    # 留言精选'
  - '[PAGE 87]


    制，如果你想一定要做一半部分是张涨涨，而另一半部分就就关心你。但是《张潇雨·商业经典案例课》里讲过，对于一个产品来讲，有100个非常狂热的粉丝，比有10000个觉得你还OK的人好得多。不知道罗老师如何看待这对矛盾。可能这两件事根本不构成矛盾，我有点分辨不清。


    我觉得这两件事之间没有必然的联系，更谈不上构成矛盾。一个分寸控制的演讲者完全可能有很多狂热的粉丝，一个情绪激烈的演讲者也完全可能没什么粉丝，或者就算有也不狂热。


    另外，我前面说的克制，是指演讲中处理情感因素时不能亢奋或不要弄得太煽情，免得让人变得肉麻或恶心。但这不意味着不能表达鲜明的态度、坚定的意志、澎湃的激情等等。


    还有就是，我前面的建议是比较普适的，适用多数的正常情况，也没有明确反特受众次。举例来说，你是对一群很酷的粉丝做演讲，并且想打动他们，那很可能你讲的越肉麻越好。


    罗老师，演讲者讲故事，动情到把自己讲哭了，是不是个好事儿？


    这个问题很有意思。不能一概而论，如果你是事先精心设计的，并且演技很牛，一般说来，效果会很好，但风险是如果观众听出来你是表演，你就彻底失去信任了。其实这就是造假，欺骗感情，后果很严重，它和人品的其他诚信问题一样，本质是人品问题，对这一个一定要保持自我警惕。


    如果你没有造假，只是现场控制不住情绪才哭了，那同样的，效果会很好；但坏处是情绪失控可能会牵连演讲的其他环节也失控，而出现不确定因素。一场成功的演讲，要尽可能做到一切都是可控的。所以一个演讲者不管对对自己要讲的东西是否有热情有激情，还是要尽可能控制自己的情绪。


    以我个人的经验为例，我多年的演讲生涯中，虽然有过情绪激动的情况，但还没有过像这次的坚果PRO发布会那样，连续两次哽咽着说不出话来的经历。当天晚上，我确实是比较激动和亢奋的状态，这带来的直接后果是，我们事先准备的演讲多次出现失控的情况，包括严重的临场串词出错等等。因为情绪不稳定，我还很不得体地在一场有直播的大型活动上讲了很多脏话，这些都是不能控制情绪的副产品。


    如果一个故事自己已经讲了很多遍，再讲可能有些提不起精神，如何在每一次讲起的时候保持饱满的情绪，就像第一次讲的时候那样？


    这个问题很好，这就涉及到一个人的敬业精神和职业素养的问题了。你要知道，在传统的相声行业，一个段子要练到登台表演，可能要练过上百遍甚至几百遍才行。理论上，相声演员登台表演的时候，应该对这个讲过上百遍的段子已经快吐了，但他们总是热情洋溢，满面红光走上去开讲，这就是传说中的敬业精神啊，很了不起。


    职业的演讲家也是一样，有时候同样的内容常常要讲上几十遍、上百遍，理论上一定是会起排斥的。但是职业素养和敬业精神，可以使每一个人每次上台前都提一口气，把精神状态调动起来，假装热情洋溢的冲上去。


    听起来很不容易是吧？是这样的，你把任何一件事情做好，做得比大多数人更好，确实是很不容易的。但好消息，你在台上假装热情洋溢地讲一会儿，你的行为就能改变你的感受，你会真的兴奋起来，再接下来就容易了，因为你不用装也能神采奕奕地讲下去了。


    那为什么会出现这样的情况呢？我们后面的课程里，讲到关于“要有激情”的部分，会详细讲到一些心理学方面的理论的解释，在这里就不展开了。


    老罗，为了准备每年若干次的演讲，你平时会做素材积累方面的工作吗？有什么经验？


    当然，如果你的工作当中，做演讲是一件比较重要的事情，你一定要养成平时随手收藏和整理演讲素材的习惯。


    我会使用一个 GTD（Getting Things Done）类的软件来搜集整理，比如 Things，我原来常用 Things 的简洁易用。后来我自己做了并且不再用
    iPhone 之后，因为 Things 没有安卓版，可以改用了 Wunderlist，这个软件有中文名，叫奇妙清单，是一个全平台的软件，可以用到安卓、iPhone、PC
    和 Mac 上，网页版也有，很好用。


    平时想到什么适合未来演讲中用到的想法，我就随手记录下来。看到某人说了一句特别有洞见或者精辟的话，我就随手记录下来；看到什么好文章，适合在演讲中讲述或引用；看到一个非常好玩的笑话，我就随手记录下来，当然了，如果那个笑话已经用之前就上大规模的流行了，我就把它删掉。


    按这种方式，过一段时间，奇妙清单的收件箱会混乱不堪，我就打开它，把收件箱各种各样的记录条目，分别归类放到各种自己创建的目录里，比如某个类别的名字是“吹牛x”，某个目录的名字是“有境界”，某个目录的名字是“巨深刻”，你可以从这些目录的名字里，大概猜到里面都是些什么样的素材。


    养成这种习惯后，像我做一年只讲两三场演讲的人，每次准备演讲时，总是会发现素材严重过剩，而不是不知道讲什么。所以这个好习惯供你参考。


    顺便说一下，要把平时脑子里想到的东西最快省事儿的记录下来，并且事后高效的处理，可能没有任何一个软件能跟这种软件的“闪念胶囊”相比，虽然这个软件是我设计的，我还是忍不住为了大家好，拼命想象我不是我，然后再非常客观地强烈推荐。


    # 罗永浩


    好，谢谢几位同学的提问，如果你在创业中有什么困惑，或者有什么想和我分享的，都欢迎在我的创业课留言给我。


    我是罗永浩，感谢把我的创业课分享给你的朋友，我们下周一见。'
  md: "\n## 悬念与画面感\n\n一场十五分钟的演讲，相当于讲一个短篇故事，虽然篇幅有限，但也要设计一些悬念来保持观众不走神。一场两小时的演讲，相当于一本完整的小说，这时候对悬念设置的要求就更高了。\n\
    \n下面我以过去的演讲中设置悬念的案例，和你探讨一下你将可能在演讲中实用到的一些手法。\n\n比如在锤子科技的第一代产品T1发布会的开场时，我首先提了一个大大的、跟现场演讲有关的问题，这个问题是：“如何令人信服地打造一个4000元的国产精品手机？”\n\
    \n2014年的时候，国产手机不要说卖4000元，卖3000元也会普遍被认为是太贵了。所以当我抛出这个问题的时候，虽然下面坐满了我们的支持者，但有些人还是发出了嘘声。同时，跟事先设想的一样，更多的人则发出了笑声，并和身边的伙伴对视和摆手，显然这部分人是不相信会卖4000元的。\n\
    \n发出嘘声没关系，因为你抛出了这么一个悬念，所以发出嘘声的人在接下来的全程中，会保持这样一种心态：“一个国产手机，你凭什么卖4000块？我倒要看看你怎么卖。”\n\
    \n不相信也没关系，因为抛出了这么一个悬念，所以不相信的人在接下来的全程中，会保持这样一种心态：“不可能，一个国产手机绝无可能卖4000块的价格，不信咱们就瞧瞧。”\n\
    \n你看，不管怎样，这个开场时的悬念设置是有效的。\n\n接下来我用了长达两个多小时的篇幅，让观众信服地接受了这台机器就应该卖4000块钱。接下来我回到了整场演讲的第二个大问题，这个问题就是，“怎样把一个4000元的国产手机卖得特别好？”\n\
    \n答案是卖3000元。\n\n以锤子科技的 T1 发布会演讲为例，我在过程中还问了下面的这些问题，这些都是我从事先准备的几百个问题中挑出来的，我们相信这些问题会让现场观众听到之后，会产生好奇，因而会全程跟着演讲者的思路走。\n\
    \n- 多年来，消费者是如何被厂商和数字媒体引导去购买手机的？\n- 当我们购买手机的时候，我们到底在购买什么？\n- 为什么1300万、2100万、甚至是4000万像素的手机，综合表现都不如苹果800万像素的手机？\n\
    - 手机产品到底应该照顾左手型用户还是右手型用户？\n- 一个英语培训学校的前校长，如何领着一群教英语教师做出一个手机？\n\n其实，用问题设置悬念，甚至应该在发布会前的预热阶段就启动，以下的几条，是历届发布会之前一周的倒计时问题，供你参考：\n\
    \n- 避孕套诞生已经几百年了，为什么每个正规厂商的产品包装盒里还都带有一份详尽的使用说明？（这是为了在演讲中说明，一个专业的产品经验，要假定每一个用户都是第一次使用你的产品，切忌妄自尊大，假定用户应该会用你的产品）\n\
    - 过去的 3 年，手机芯片的速度快了 310%，为什么你用手机做事的速度只快了 13%？（这是为了在演讲中说明，到了今天，决定手机做事效率的，不是CPU速度，而是软件的设计）\n\
    - 智能手机在全球普及的伟大进程中，哪一个用户群体被我们遗忘了？（这是为了在演讲中演示你们做的一个帮助父母用手机的远程协助功能）\n- 是更快的快充，还是干脆忘了充电这回事？（这是为了强调我们的手机电池一天用不完，无需另行携带充电插头或外置充电电池）\n\
    \n最后想强调的是，有些人演讲中设置悬念，自己玩嗨了，一直嗨到观众不耐烦了为止，到了这种状态，你再抛出一个问题的话，观众的想法就是：去你的吧，爱谁谁，我才不关心呢。这就适得其反了。\n\
    \n接下来，今天我们要讨论的第二个问题是，“画面或画面感”。\n\n这两者之间的区别在于，\n\n前者的操作方式我们会在后面讲PPT的课程中讲解，今天就不展开了。后者是我们今天要详细讨论的内容。\n\
    \n意象与群内心、留白。分享微信fourousshues，读点新书通过语言在听众多心里生成一幅画面，其实是古老的讲故事和写故事的手法。很多画面感强列，生动异常的写作案例到今天已经成为我们日常表达的一部分，比如中小学生都会用的词汇，血盆大口，怒发冲冠之类的词，都是画面感非常强列的。像铁头狼，撒撒话这样的词汇，除了画面感强列，甚至带有音效。只是因为大家用得多，就像没有这么生动和鲜活了。\n\
    \n虽然我们有这么丰富的词汇，但每年都会出现一批网络流行语。比如这两年的流行语说这个男孩是那个女孩的“备胎”，即使你是第一次听这个说法，你能迅速心理领会，因为我们见过真的备胎，知道它的用途。还有比如“脑子都肿了”就给我看这个，“友强的画面就解释”，都能传达出很强列的画面感，无需解释。你就能让你领会这些话表达的含义。\n\
    \n而像血盆大口，怒发冲冠，铁头狼，撒撒话，这些，虽然从表达手法上，是高明而幽默的，但缺乏新鲜感，导致生动性和冲性上丢分。\n\n所以再 一次，如果你自己不擅长创作，但你的英语还不错，你可以尝试从英文的文章里找那些效果很好，但在中文里不常用的表达方式，来帮演讲时运用语言形成良好的画面感。\n\
    \n形成良好的画面感。\n\n我办英语培训机构时，在海淀剧院的一场宣传演讲中，我讲到有一次接受一位记者采访，“采访的前两个小时我吹起牛来还有点拘谨，因为旁边有人，后来边上的人都走了，就剩我和那个女记者，我就终于放下了包袱，甩开了膀子，完全是翱翔……”当我说到“翱翔”的时候，我甚至做出了翱翔的动作，这时现场观众的反应就特别强烈，因为他们好像看到了一个人在用生命吹牛的生动鲜明的画面。【粟渺社首发\
    \ 分享微信ghw1361 每日更新】\n\n后来我还说，在我给这个女记者吹了两个小 时牛之后，讲了一些三观特别正的做企业的理念，“听得她眼睛里全是一些晶莹的小东西”，最后我自己也感动了。我说到这儿的时候，现场有人擦拭眼角，我相信这些表达所具有的生动性和新鲜程度，制造了很好的画面感，从而带来了很好的感染力。\n\
    \n比如我们都知道的“七圈半”，你说光速很快，我们没有概念，你说光速每秒绕地球七圈半，我们一辈子都记住了。\n\n![](img/3f2553c19e3d8036724ac589070714e0_81_0.png)\n\
    \n好，今天我们讨论的话题是：如何在演讲中制造悬念和制造画面感？\n\n> **今日思考：** 说到用语言来制造悬念和画面感，你的记忆里有没有一些格外印象深刻的例子？如果有的话，欢迎你在留言区里跟我们分享。\n\
    \n我们明天见。\n\n地区学生募捐的宣传片，就立即慨然解囊。而看了一堆罗列事实和数据来说明贫困地区的教育状况急需慈善的材料时，就无动于衷。\n\n那具体怎么操作呢？最常见有有这么几种方式：\n\
    \n**第一种是唤起人类本能的同情心。**\n\n比如为了给贫困地区的助学项目募集资金时，除了用事实和数据说明当地的教育状况急需救助，最好再讲一个真实的、关于当地孩子们的童年是如何艰辛甚至悲惨求学的感性故事，来唤起同情心。这里面要有生动的细节，如果可能，最好有极浓冲击力的画面，比如一群孩子在漏雨的教室里听上课的画面，比如一群没洗脸的孩子脸上黑乎乎的但是眼睛异常明亮地看着黑板的画面等等。\n\
    \n从技术手段上，最好找那些颜值比较高，看起来比较可爱的孩子放在最前面，这也是基于人性的弱点和理智：人类更喜欢那些好看的孩子。顺便说一下，与之类似的例子是动物保护组织的公益宣传片，你可能注意到了，他们的宣传片总是反复拍摄那些遭遇不幸的漂亮动物。\n\
    \n最后，\n\n**第二种是触发对失去美好事物的恐惧。**\n\n在人类漫长的进化过程中，生存充满了各种不确定性和凶险。所以人类有多向往那些美好的事物，就有多害怕失去它们。\n\
    \n最典型的是环保主义运动的宣传材料，总是精耕细作地描绘一个诗情画意的美好大自然，然后再渲染一个被工业污染所摧毁的末日景象。\n\n极端环保主义者们的很多主张，虽然从科学和理性的角度是完全站不住脚的，但借助这样的感性手段，还是能取得很大的民众支持，这是值得反对极端环保的科学家们深思的。如果合理地拍摄一个反对极端环保的宣传片，不应该只是简单罗列数据和事实，比如说，用事实和数据说明在世界各地，通常都是发达的大城市的人均寿命最高，发达的大城市的综合卫生条件最好（除了某些刚完成城市化的地区和水质量情），发达的大城市的食物的空气安全性靠之外，用感性的画面拍摄一些感性的、美好的画面，比如一群精神矍硕的老人疗养院里愉快地下棋或者是打太极，比如一个孩子在城市公园的绿草地上满地打滚，比如一个家庭主妇带着孩子申请愉快地逛干净整洁的食品超市等等。\n\
    \n**第三种常见的方式是，用相同的经历引起共鸣。**\n\n2015年锤子科技的T2手机发布会上，我们演示了 Smartisan OS的一个新功能，叫做“远程关怀”。这个功能的主要应用场景是，年轻人可以异地远程操作父母长辈的手机，并把操作过程一步步地展示给父母长辈看，如果有些复杂的功能反复教也不会父母，就索性远程替父母操作和设置。\n\
    \n为了更好地说明这个功能的实际应用场暴，我们制作了一条90秒的视频短片（注意：因为我存储的视频链接，你可以把这篇文章未末尾处视频链接复制到浏览器上，看看这段视频）。我们在片中只用了短短的十秒演示这个功能的操作，用其余的篇幅，让一群离乡背井在城市谋生的普通人对着镜头动情地讲述生活中的真实经历：\n\
    \n> “一个城市白领形象的女孩子说，“教我爸用智能手机，太难了……”\n\n> “一个艺术家造型的小伙子说，“我爸已经不敢问我了，什么下载啊、流置啊，他听不懂，教不会，教会还会忘”……”\n\
    \n> “一个中年人，“手机用了半年多了，老爷子才跟我说想打一下子手机，就看到孙女的照片，这不就两分钟的事儿嘛，他还得等我们过回家，一等就是半年”……”\n\
    \n这些生活中的吉凶，细节虽然有些差异，但大家在这件事上，最后的感怀是一致的：“父母老了，我要是在他们身边就好了。”\n\n很多发布会的观众事后表示，他们看这个视频的时候，都感动不已，有些人甚至忍不住流泪，因为这让人们感同身受。对离乡背井，在城市谋生，不经意见到父母，并且熟练使用数码产品的中青年人来说，绝大部分都经历过类似的真实生活场景。\n\
    \n这部演示的功能简单实用，宣传的手法触及心灵的广告片，是在2015年年底的发布会上推出的。直接带来的结果是，很多人回家过年时买了我们的手机送给父母。\n\n\
    “第一代的坚果手机是2015年八月底发布的，到了2016年春节前，本来销量已经明显骤减，但由于这支宣传片的传播，又卖了很多。最终的统计显示，坚果一代的总销量里，高达百分之二十左右，是消费者买给他们父母的。”\n\
    \n这使得一些过分仇视我们的人说，坚果代是一个“老人机”。我们以此为这些恶性言行感到“实在”，而功能非常高智的老式功能机才没有资格成为所谓“老人机”，而智能手机是与“老人机”无缘的。\n\
    \n一个功能强大，精密复杂的智能手机，因为简单易用，使得老七也能操作；一个功能强大，精密复杂的智能手机，因为有了远程协助功能，使得老人不能操作它一些复杂功能时，子女也能轻松地远程替老人操作。它因此被称为“老人机”，是当之无愧的，也是异常光荣的，我们为此感到骄傲。\n\
    \n平铺直叙最多让人觉得无聊，但言情呢，轻一点让观者替你尴尬，盼着你赶紧结束；严重一点，会看得你惶惶作态，甚至觉得恶心。相信你已经看过这类的电视节目，应该能理解我的意思。\n\
    \n# 「今日得到」\n\n1. 用故事性的方式加入情感因素的原因\n   在漫长的进化过程中更习惯和更擅长方式的，理性的推理信息，是人类相对不擅长的方式。所以即便是讲道理为主的演绎，也最好有情感因素的介入，以保证说服和打动观众的效果。\n\
    2. 在演讲和讲故事的时候，唤起观众的感性认同和共鸣的的三种常见方式：\n   - 第一种是唤起人类本能的同情心；\n   - 第二种是触发对失去美好事物的恐惧；\n\
    \   - 第三种是用相同的经历引起共鸣。\n\n> 粟渺社唯一分享微信foufloushus 为群友提供书籍免费代找\n> 谨防N手转卖，以免断更。\n\n\
    附录：\n\n![](img/3f2553c19e3d8036724ac589070714e0_83_0.png)\n\n# 罗永浩\n\n今日思考：如果你有关于讲故事的时候如何代入情感因素方面的良好案例，欢迎在留言区写出来跟我们分享\n\
    \n也欢迎把我的创业课分享给你的朋友们，我们明天见。\n\n![](img/3f2553c19e3d8036724ac589070714e0_83_1.png)\n\
    \n2. 课程的内容呈现逻辑更加清晰。专栏将为你拆解，包括：\n\n- 一个洞悉，帮你建立问题域的基本认知；\n- 一个教程，手把手教你思考怎么应对问题；\n\
    - 一个清单，补充需要注意的事项；\n- 一组问答，解决你遇到的真实的问题；\n- 一套资料，提供真实的高价值学习资料；\n- 一个问题，引发你的思考，强化你的学习。\n\
    \n3. 我们对课程的目标会更清楚，希望这也是你的学习目标。老罗\n4. 内容会有更多的 ：每一期都会专门为你留下思考的问题，老罗也会在留言区里持续为你解答答疑的创业问题；另外，专栏还会不定期地梳理和所有人的问答对话，聚焦你创业最真实的疑问。\n\
    5. ，包括：通过直播进行的案例实操和练习；通过专题的形式进行的阶段性知识归纳；以“对话”或者“读书”的方式从层面梳理知识网络。\n6. 我们还将开设一个“野望”，顾名思义就是“野心”和“希望”，我们每一个人都在开拓和探索的创业者，也是荒野。这个学习小组将给你提供各种形式的连接、共享、合作、交流、碰撞、升级……（点击文章下方的入口即可进入学习小组）\n\
    \n总之，进化还在持续进行。希望你在专栏里，对创业，对企业，对商业会有更深刻的理解，既有认识和洞见，又能解决具体的问题。人人都是创业者的时代，未来的机会一定属于提前准备好的你。\n\
    \n最后，还向你发出一个小请求：\n\n![](img/3f2553c19e3d8036724ac589070714e0_84_0.png)\n\n附录：《罗永浩的创业课》全年课表\n\
    \n点击图片即可保存课表至相册，随时随地掌握课程进度。\n\n![](img/3f2553c19e3d8036724ac589070714e0_84_1.png)\n\
    \n倒也不一定要那么那条，但是如果你本不太擅长讲故事的话，尝试这么做也没什么不好。\n\n先试着按自己的感觉写故事，凭感觉写作时，和对照片章这件事不要一起。不要边写边对照，写故事的时候不要想着那些细节。这件事最后应该是融会的结果，而不是靠边写边记着的方式。没有哪个作家写故事的时候对着写作技巧手册，这肯定会影响创作的状态。\n\
    \n写完了还是按感觉看看效果好不好，如果一切都很好，可能就不需要琢磨这个清单了。如果感觉有些地方不对，那就拿出清单看看，找找有没有跟基本原则相矛盾的地方，如果有，再做相应的处理。\n\
    \n然后下次写一个故事，还是重复这个过程。多重复几边后，你训练足够的话，将来写故事的时候如果有一些方法论上的错误，你第一时间就会感觉到。\n\n有一种广为流传的说法，面对投资人讲方案其实就是讲故事，您怎么看？\n\
    \n当然就是讲故事啊，投资人在自己的圈子里也是这么说的，他们经常说的就是，某某项目的故事不够大；某某项目的故事讲得好，很有想象空间；某某项目的故事，我觉得不成立等等。\n\
    \n因为早期的投资人面对创业者，既看不到业绩，也看不到产品，跟你这个人又不熟。你要知道，人和人之间，要彻底弄熟了，可能需要几个月甚至几年的相处。投资人天天都要一堆创业者，不可能有这样的时间成本。所以基本上就是听你讲这次故事，然后决定给不给钱的。你给投资人讲的，除了行业现状和前景分析，产品或服务是否存在市场需求，商业模式是否符合逻辑等这些百分比已知的东西之外，其他的基本都是讲故事了。\n\
    \n那这个故事怎么讲呢？跟我们前面说过的演讲的原则，或讲故事的原则，是差不多的。\n\n比如说，你要投资人吹牛，为什么呢？\n\n当然，这并不是说你要瞎吹一气，你吹的东西要经得起推敲；而是说你要在逻辑上可以说得通的大前提下，尽可能往大了说。\n\
    \n再比如说，你讲的故事要有细节，投资人会通过这些细节来判断你是一个什么样的人，你是否适合做这个项目等等。\n\n再比如说，你要跟投资人表现出对创业项目的激情，因为投资人希望看到创业者是热爱自己所从事的事业的。\n\
    \n另外，顺便说一下，我觉得在一些领域，很多人对“讲故事”这个说法比较敏感，是因为中英文的“故事”这个词的语感差异导致的。\n\n在过去的中文里，我们通常不会把“讲故事”这个说法用来形容一个非虚构的事情。而现代的中文，受西方影响比较多，所以在很多地方出现类似英文的语感，习惯了的人会觉得很正常，不习惯的人会觉得奇怪。我想大概就是这样吧。\n\
    \n乏情感当然不好，泛滥的情感一样不好，最好的效果就是内敛和克制的情感，更有深沉的力量。\n\n# 罗永浩\n\n![](img/3f2553c19e3d8036724ac589070714e0_86_0.png)\n\
    \n好，谢谢这几位同学的提问，如果你在创业中有什么困惑，或者有什么想和我分享的，都欢迎在留言区留言给我。\n\n我是罗永浩，感谢把我的创业课分享给你的朋友，我们明天见。\n\
    \n# 留言精选\n\n制，如果你想一定要做一半部分是张涨涨，而另一半部分就就关心你。但是《张潇雨·商业经典案例课》里讲过，对于一个产品来讲，有100个非常狂热的粉丝，比有10000个觉得你还OK的人好得多。不知道罗老师如何看待这对矛盾。可能这两件事根本不构成矛盾，我有点分辨不清。\n\
    \n我觉得这两件事之间没有必然的联系，更谈不上构成矛盾。一个分寸控制的演讲者完全可能有很多狂热的粉丝，一个情绪激烈的演讲者也完全可能没什么粉丝，或者就算有也不狂热。\n\
    \n另外，我前面说的克制，是指演讲中处理情感因素时不能亢奋或不要弄得太煽情，免得让人变得肉麻或恶心。但这不意味着不能表达鲜明的态度、坚定的意志、澎湃的激情等等。\n\
    \n还有就是，我前面的建议是比较普适的，适用多数的正常情况，也没有明确反特受众次。举例来说，你是对一群很酷的粉丝做演讲，并且想打动他们，那很可能你讲的越肉麻越好。\n\
    \n罗老师，演讲者讲故事，动情到把自己讲哭了，是不是个好事儿？\n\n这个问题很有意思。不能一概而论，如果你是事先精心设计的，并且演技很牛，一般说来，效果会很好，但风险是如果观众听出来你是表演，你就彻底失去信任了。其实这就是造假，欺骗感情，后果很严重，它和人品的其他诚信问题一样，本质是人品问题，对这一个一定要保持自我警惕。\n\
    \n如果你没有造假，只是现场控制不住情绪才哭了，那同样的，效果会很好；但坏处是情绪失控可能会牵连演讲的其他环节也失控，而出现不确定因素。一场成功的演讲，要尽可能做到一切都是可控的。所以一个演讲者不管对对自己要讲的东西是否有热情有激情，还是要尽可能控制自己的情绪。\n\
    \n以我个人的经验为例，我多年的演讲生涯中，虽然有过情绪激动的情况，但还没有过像这次的坚果PRO发布会那样，连续两次哽咽着说不出话来的经历。当天晚上，我确实是比较激动和亢奋的状态，这带来的直接后果是，我们事先准备的演讲多次出现失控的情况，包括严重的临场串词出错等等。因为情绪不稳定，我还很不得体地在一场有直播的大型活动上讲了很多脏话，这些都是不能控制情绪的副产品。\n\
    \n如果一个故事自己已经讲了很多遍，再讲可能有些提不起精神，如何在每一次讲起的时候保持饱满的情绪，就像第一次讲的时候那样？\n\n这个问题很好，这就涉及到一个人的敬业精神和职业素养的问题了。你要知道，在传统的相声行业，一个段子要练到登台表演，可能要练过上百遍甚至几百遍才行。理论上，相声演员登台表演的时候，应该对这个讲过上百遍的段子已经快吐了，但他们总是热情洋溢，满面红光走上去开讲，这就是传说中的敬业精神啊，很了不起。\n\
    \n职业的演讲家也是一样，有时候同样的内容常常要讲上几十遍、上百遍，理论上一定是会起排斥的。但是职业素养和敬业精神，可以使每一个人每次上台前都提一口气，把精神状态调动起来，假装热情洋溢的冲上去。\n\
    \n听起来很不容易是吧？是这样的，你把任何一件事情做好，做得比大多数人更好，确实是很不容易的。但好消息，你在台上假装热情洋溢地讲一会儿，你的行为就能改变你的感受，你会真的兴奋起来，再接下来就容易了，因为你不用装也能神采奕奕地讲下去了。\n\
    \n那为什么会出现这样的情况呢？我们后面的课程里，讲到关于“要有激情”的部分，会详细讲到一些心理学方面的理论的解释，在这里就不展开了。\n\n老罗，为了准备每年若干次的演讲，你平时会做素材积累方面的工作吗？有什么经验？\n\
    \n当然，如果你的工作当中，做演讲是一件比较重要的事情，你一定要养成平时随手收藏和整理演讲素材的习惯。\n\n我会使用一个 GTD（Getting Things\
    \ Done）类的软件来搜集整理，比如 Things，我原来常用 Things 的简洁易用。后来我自己做了并且不再用 iPhone 之后，因为 Things\
    \ 没有安卓版，可以改用了 Wunderlist，这个软件有中文名，叫奇妙清单，是一个全平台的软件，可以用到安卓、iPhone、PC 和 Mac 上，网页版也有，很好用。\n\
    \n平时想到什么适合未来演讲中用到的想法，我就随手记录下来。看到某人说了一句特别有洞见或者精辟的话，我就随手记录下来；看到什么好文章，适合在演讲中讲述或引用；看到一个非常好玩的笑话，我就随手记录下来，当然了，如果那个笑话已经用之前就上大规模的流行了，我就把它删掉。\n\
    \n按这种方式，过一段时间，奇妙清单的收件箱会混乱不堪，我就打开它，把收件箱各种各样的记录条目，分别归类放到各种自己创建的目录里，比如某个类别的名字是“吹牛x”，某个目录的名字是“有境界”，某个目录的名字是“巨深刻”，你可以从这些目录的名字里，大概猜到里面都是些什么样的素材。\n\
    \n养成这种习惯后，像我做一年只讲两三场演讲的人，每次准备演讲时，总是会发现素材严重过剩，而不是不知道讲什么。所以这个好习惯供你参考。\n\n顺便说一下，要把平时脑子里想到的东西最快省事儿的记录下来，并且事后高效的处理，可能没有任何一个软件能跟这种软件的“闪念胶囊”相比，虽然这个软件是我设计的，我还是忍不住为了大家好，拼命想象我不是我，然后再非常客观地强烈推荐。\n\
    \n# 罗永浩\n\n好，谢谢几位同学的提问，如果你在创业中有什么困惑，或者有什么想和我分享的，都欢迎在我的创业课留言给我。\n\n我是罗永浩，感谢把我的创业课分享给你的朋友，我们下周一见。\n"
  mdcn: "\n## 悬念与画面感\n\n一场十五分钟的演讲，相当于讲一个短篇故事，虽然篇幅有限，但也要设计一些悬念来保持观众不走神。一场两小时的演讲，相当于一本完整的小说，这时候对悬念设置的要求就更高了。\n\
    \n下面我以过去的演讲中设置悬念的案例，和你探讨一下你将可能在演讲中实用到的一些手法。\n\n比如在锤子科技的第一代产品T1发布会的开场时，我首先提了一个大大的、跟现场演讲有关的问题，这个问题是：“如何令人信服地打造一个4000元的国产精品手机？”\n\
    \n2014年的时候，国产手机不要说卖4000元，卖3000元也会普遍被认为是太贵了。所以当我抛出这个问题的时候，虽然下面坐满了我们的支持者，但有些人还是发出了嘘声。同时，跟事先设想的一样，更多的人则发出了笑声，并和身边的伙伴对视和摆手，显然这部分人是不相信会卖4000元的。\n\
    \n发出嘘声没关系，因为你抛出了这么一个悬念，所以发出嘘声的人在接下来的全程中，会保持这样一种心态：“一个国产手机，你凭什么卖4000块？我倒要看看你怎么卖。”\n\
    \n不相信也没关系，因为抛出了这么一个悬念，所以不相信的人在接下来的全程中，会保持这样一种心态：“不可能，一个国产手机绝无可能卖4000块的价格，不信咱们就瞧瞧。”\n\
    \n你看，不管怎样，这个开场时的悬念设置是有效的。\n\n接下来我用了长达两个多小时的篇幅，让观众信服地接受了这台机器就应该卖4000块钱。接下来我回到了整场演讲的第二个大问题，这个问题就是，“怎样把一个4000元的国产手机卖得特别好？”\n\
    \n答案是卖3000元。\n\n以锤子科技的 T1 发布会演讲为例，我在过程中还问了下面的这些问题，这些都是我从事先准备的几百个问题中挑出来的，我们相信这些问题会让现场观众听到之后，会产生好奇，因而会全程跟着演讲者的思路走。\n\
    \n- 多年来，消费者是如何被厂商和数字媒体引导去购买手机的？\n- 当我们购买手机的时候，我们到底在购买什么？\n- 为什么1300万、2100万、甚至是4000万像素的手机，综合表现都不如苹果800万像素的手机？\n\
    - 手机产品到底应该照顾左手型用户还是右手型用户？\n- 一个英语培训学校的前校长，如何领着一群教英语教师做出一个手机？\n\n其实，用问题设置悬念，甚至应该在发布会前的预热阶段就启动，以下的几条，是历届发布会之前一周的倒计时问题，供你参考：\n\
    \n- 避孕套诞生已经几百年了，为什么每个正规厂商的产品包装盒里还都带有一份详尽的使用说明？（这是为了在演讲中说明，一个专业的产品经验，要假定每一个用户都是第一次使用你的产品，切忌妄自尊大，假定用户应该会用你的产品）\n\
    - 过去的 3 年，手机芯片的速度快了 310%，为什么你用手机做事的速度只快了 13%？（这是为了在演讲中说明，到了今天，决定手机做事效率的，不是CPU速度，而是软件的设计）\n\
    - 智能手机在全球普及的伟大进程中，哪一个用户群体被我们遗忘了？（这是为了在演讲中演示你们做的一个帮助父母用手机的远程协助功能）\n- 是更快的快充，还是干脆忘了充电这回事？（这是为了强调我们的手机电池一天用不完，无需另行携带充电插头或外置充电电池）\n\
    \n最后想强调的是，有些人演讲中设置悬念，自己玩嗨了，一直嗨到观众不耐烦了为止，到了这种状态，你再抛出一个问题的话，观众的想法就是：去你的吧，爱谁谁，我才不关心呢。这就适得其反了。\n\
    \n接下来，今天我们要讨论的第二个问题是，“画面或画面感”。\n\n这两者之间的区别在于，\n\n前者的操作方式我们会在后面讲PPT的课程中讲解，今天就不展开了。后者是我们今天要详细讨论的内容。\n\
    \n意象与群内心、留白。分享微信fourousshues，读点新书通过语言在听众多心里生成一幅画面，其实是古老的讲故事和写故事的手法。很多画面感强列，生动异常的写作案例到今天已经成为我们日常表达的一部分，比如中小学生都会用的词汇，血盆大口，怒发冲冠之类的词，都是画面感非常强列的。像铁头狼，撒撒话这样的词汇，除了画面感强列，甚至带有音效。只是因为大家用得多，就像没有这么生动和鲜活了。\n\
    \n虽然我们有这么丰富的词汇，但每年都会出现一批网络流行语。比如这两年的流行语说这个男孩是那个女孩的“备胎”，即使你是第一次听这个说法，你能迅速心理领会，因为我们见过真的备胎，知道它的用途。还有比如“脑子都肿了”就给我看这个，“友强的画面就解释”，都能传达出很强列的画面感，无需解释。你就能让你领会这些话表达的含义。\n\
    \n而像血盆大口，怒发冲冠，铁头狼，撒撒话，这些，虽然从表达手法上，是高明而幽默的，但缺乏新鲜感，导致生动性和冲性上丢分。\n\n所以再 一次，如果你自己不擅长创作，但你的英语还不错，你可以尝试从英文的文章里找那些效果很好，但在中文里不常用的表达方式，来帮演讲时运用语言形成良好的画面感。\n\
    \n形成良好的画面感。\n\n我办英语培训机构时，在海淀剧院的一场宣传演讲中，我讲到有一次接受一位记者采访，“采访的前两个小时我吹起牛来还有点拘谨，因为旁边有人，后来边上的人都走了，就剩我和那个女记者，我就终于放下了包袱，甩开了膀子，完全是翱翔……”当我说到“翱翔”的时候，我甚至做出了翱翔的动作，这时现场观众的反应就特别强烈，因为他们好像看到了一个人在用生命吹牛的生动鲜明的画面。【粟渺社首发\
    \ 分享微信ghw1361 每日更新】\n\n后来我还说，在我给这个女记者吹了两个小 时牛之后，讲了一些三观特别正的做企业的理念，“听得她眼睛里全是一些晶莹的小东西”，最后我自己也感动了。我说到这儿的时候，现场有人擦拭眼角，我相信这些表达所具有的生动性和新鲜程度，制造了很好的画面感，从而带来了很好的感染力。\n\
    \n比如我们都知道的“七圈半”，你说光速很快，我们没有概念，你说光速每秒绕地球七圈半，我们一辈子都记住了。\n\n![](img/3f2553c19e3d8036724ac589070714e0_81_0.png)\n\
    \n好，今天我们讨论的话题是：如何在演讲中制造悬念和制造画面感？\n\n> **今日思考：** 说到用语言来制造悬念和画面感，你的记忆里有没有一些格外印象深刻的例子？如果有的话，欢迎你在留言区里跟我们分享。\n\
    \n我们明天见。\n\n地区学生募捐的宣传片，就立即慨然解囊。而看了一堆罗列事实和数据来说明贫困地区的教育状况急需慈善的材料时，就无动于衷。\n\n那具体怎么操作呢？最常见有有这么几种方式：\n\
    \n**第一种是唤起人类本能的同情心。**\n\n比如为了给贫困地区的助学项目募集资金时，除了用事实和数据说明当地的教育状况急需救助，最好再讲一个真实的、关于当地孩子们的童年是如何艰辛甚至悲惨求学的感性故事，来唤起同情心。这里面要有生动的细节，如果可能，最好有极浓冲击力的画面，比如一群孩子在漏雨的教室里听上课的画面，比如一群没洗脸的孩子脸上黑乎乎的但是眼睛异常明亮地看着黑板的画面等等。\n\
    \n从技术手段上，最好找那些颜值比较高，看起来比较可爱的孩子放在最前面，这也是基于人性的弱点和理智：人类更喜欢那些好看的孩子。顺便说一下，与之类似的例子是动物保护组织的公益宣传片，你可能注意到了，他们的宣传片总是反复拍摄那些遭遇不幸的漂亮动物。\n\
    \n最后，\n\n**第二种是触发对失去美好事物的恐惧。**\n\n在人类漫长的进化过程中，生存充满了各种不确定性和凶险。所以人类有多向往那些美好的事物，就有多害怕失去它们。\n\
    \n最典型的是环保主义运动的宣传材料，总是精耕细作地描绘一个诗情画意的美好大自然，然后再渲染一个被工业污染所摧毁的末日景象。\n\n极端环保主义者们的很多主张，虽然从科学和理性的角度是完全站不住脚的，但借助这样的感性手段，还是能取得很大的民众支持，这是值得反对极端环保的科学家们深思的。如果合理地拍摄一个反对极端环保的宣传片，不应该只是简单罗列数据和事实，比如说，用事实和数据说明在世界各地，通常都是发达的大城市的人均寿命最高，发达的大城市的综合卫生条件最好（除了某些刚完成城市化的地区和水质量情），发达的大城市的食物的空气安全性靠之外，用感性的画面拍摄一些感性的、美好的画面，比如一群精神矍硕的老人疗养院里愉快地下棋或者是打太极，比如一个孩子在城市公园的绿草地上满地打滚，比如一个家庭主妇带着孩子申请愉快地逛干净整洁的食品超市等等。\n\
    \n**第三种常见的方式是，用相同的经历引起共鸣。**\n\n2015年锤子科技的T2手机发布会上，我们演示了 Smartisan OS的一个新功能，叫做“远程关怀”。这个功能的主要应用场景是，年轻人可以异地远程操作父母长辈的手机，并把操作过程一步步地展示给父母长辈看，如果有些复杂的功能反复教也不会父母，就索性远程替父母操作和设置。\n\
    \n为了更好地说明这个功能的实际应用场暴，我们制作了一条90秒的视频短片（注意：因为我存储的视频链接，你可以把这篇文章未末尾处视频链接复制到浏览器上，看看这段视频）。我们在片中只用了短短的十秒演示这个功能的操作，用其余的篇幅，让一群离乡背井在城市谋生的普通人对着镜头动情地讲述生活中的真实经历：\n\
    \n> “一个城市白领形象的女孩子说，“教我爸用智能手机，太难了……”\n\n> “一个艺术家造型的小伙子说，“我爸已经不敢问我了，什么下载啊、流置啊，他听不懂，教不会，教会还会忘”……”\n\
    \n> “一个中年人，“手机用了半年多了，老爷子才跟我说想打一下子手机，就看到孙女的照片，这不就两分钟的事儿嘛，他还得等我们过回家，一等就是半年”……”\n\
    \n这些生活中的吉凶，细节虽然有些差异，但大家在这件事上，最后的感怀是一致的：“父母老了，我要是在他们身边就好了。”\n\n很多发布会的观众事后表示，他们看这个视频的时候，都感动不已，有些人甚至忍不住流泪，因为这让人们感同身受。对离乡背井，在城市谋生，不经意见到父母，并且熟练使用数码产品的中青年人来说，绝大部分都经历过类似的真实生活场景。\n\
    \n这部演示的功能简单实用，宣传的手法触及心灵的广告片，是在2015年年底的发布会上推出的。直接带来的结果是，很多人回家过年时买了我们的手机送给父母。\n\n\
    “第一代的坚果手机是2015年八月底发布的，到了2016年春节前，本来销量已经明显骤减，但由于这支宣传片的传播，又卖了很多。最终的统计显示，坚果一代的总销量里，高达百分之二十左右，是消费者买给他们父母的。”\n\
    \n这使得一些过分仇视我们的人说，坚果代是一个“老人机”。我们以此为这些恶性言行感到“实在”，而功能非常高智的老式功能机才没有资格成为所谓“老人机”，而智能手机是与“老人机”无缘的。\n\
    \n一个功能强大，精密复杂的智能手机，因为简单易用，使得老七也能操作；一个功能强大，精密复杂的智能手机，因为有了远程协助功能，使得老人不能操作它一些复杂功能时，子女也能轻松地远程替老人操作。它因此被称为“老人机”，是当之无愧的，也是异常光荣的，我们为此感到骄傲。\n\
    \n平铺直叙最多让人觉得无聊，但言情呢，轻一点让观者替你尴尬，盼着你赶紧结束；严重一点，会看得你惶惶作态，甚至觉得恶心。相信你已经看过这类的电视节目，应该能理解我的意思。\n\
