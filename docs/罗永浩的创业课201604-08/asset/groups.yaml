    ## 如果你不是第一名，那么你又该怎么办？


    听起来很绝望是吧？那我们还创业呢？


    那就说一些让人高兴的消息吧：‘佳得乐’是美国著名的运动饮料品牌，它没有去跟可口可乐去拼可乐这种品类的饮料，而是在全新的运动饮料品类里抢先为了一第一名。运动饮料被佳得乐带起先风潮之后，全球最大的饮料制造商可口可乐看着运动饮料市场眼红，也做了一个‘动乐’的运动饮料。但直到今天，动乐的销量也只是佳得乐的一个零头。可口可乐的牛也没用，因为佳得乐已经抢先成为运动饮料品类里的第一名了。再后来，佳得乐被百事可乐收购了。如果没有意外，百事可乐永远都打不过可口可乐，同样，如果没有意外，可口可乐旗下的动乐也永远都打不过百事可乐旗下的佳得乐。


    一个品类的领域你来晚了，没法做第一名了，有时候甚至可能连生存都是问题，怎么办呢？当然是


    比如说，你想做香水领域的第一名，结果发现已经来晚了，怎么办呢？抢先成为男士香水领域里的第一名。你想成为香领域里的第一名，结果发现已经来晚了，怎么办呢？抢先成为女士香水领域里的第一名。当然，今天这些都已经有人做过了，不过这个思路和定始终都是可以参考借鉴的。


    再举一个例子，你想做感冒药这个品类里的老大，结果发现已经来晚了，这时候怎么办呢？把一天吃两次的感冒药里的一半弄成会嗜睡的，另外一半照旧，然后抢先成为一种大白天上分开吃的感冒药里的老大，白加黑感冒药当年就是这么做起来的。


