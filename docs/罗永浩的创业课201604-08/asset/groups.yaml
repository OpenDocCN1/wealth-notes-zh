    \n以上就是今天我要和你分享的话题：你觉得自己适合创业吗？欢迎你在留言区写下自己的想法，和我互动。明天我会继续跟你聊聊该怎么选择创业方向。\n\n我是罗永浩，感谢你和我分享我的干货日记，明天见。\n\
    \n![](img/3f2553c19e3d8036724ac589070714e0_24_1.png)\n\n你发现了一片蓝海，发现了一个市场需求的大机会，这是比较好的创业项目。比如说你发现滴滴已经搭建了中国人坐出租车的城市出行，但是下来去兰州拉拉面吃饭的那几百米还没有人管，你发现了这个，别人也发现了这个，而且别人还想到了，做了一个共享单车，于是这个东西就火起来了。但是一定是一个很好的创业项目。\n\
    \n如果你研究这些创业项目研究了多年，你会非常深切地认同这一点，选择比努力重要的多。这个可能很多人不爱听，它不符合我们成长时候喊的那种鸡汤，你只要努力，一定会有一个回报，或者念念不忘必有回响。但是在现实世界裡你会发现，选择常常都比努力重要的多。\n\
    \n其实不光是创业，人生都是这样的。比如说你做商业选错了项目，做一个空气净化器，拉十几个人辛苦，可能就能赚到几千万上亿。但是你选错了项目，比如说你糊涂，非要做手机，拉着六七百个人辛苦了四五年，可能是在赔钱。再比如说选高兴，你的什么事都没有，子继了老爷子留下来的什么老爹没买，子继了老婆，要各种小心翼翼地去经营、维护一个婚姻，你小心翼翼地做了些事情，最后效果也不怎么样。所以不选择要比努力重要的多，尤其到了商业领域里，一定要记得这个。\n\
    \n当然选对了之后，肯定也是努力执行出来的。很多人想搞找到一个牛逼的点子，然后创业，但是单纯 的点子是一文钱都不值的。无论你自己觉得自己是多牛逼、多绝妙的点子，如果你接触的聪明人足够多，你就会发现别人也有差不多的想法，而且常情的还多的是。所以绝妙的点子是不值钱的，一旦想到了一个好的点子，马上就要把它执行出来，效果很重要。\n\
    \n发现一片特别大的蓝海需要聪明、敏锐的观察力，而多数人大发的所谓蓝海，其实是愿望里出来的假蓝海、假需求。那么多人都在创业，怎么可能留有大量被忽视的领域等着你呢？这是一个小概率事件。\n\
    \n举个例 子，比如说白色家电，如果智能化这一轮做出点什么，真能够帮助用户解决痛点的 东西，还有一点点机会，否则白色家电整体上已经尘埃落定、没机会了。但是，有没有可能从里面发现一个新的需求，做出一个新的品类呢？\n\
    \n这是有可能的。比如说牛奶老出事，买回来的成品豆浆既不安全，很难喝。于是有人就花大力气去泻出一个好用的豆浆机，这个豆浆机可能不需要你从零开始发明，你把传统上用磨的、笨重的、粗糙的、复杂的豆浆机，调整成简单易用磨的豆浆机，然后营销上对消费者连教有引导，成功的这个方法本来就在百分之几的消费牛奶的消费者，现在去也喝消费者自制的豆浆。如果这个运作好了，也能量产出一个几十亿、甚至上百亿市值的公司来，中国有这种现实的例子。\n\
    \n当然，引导消费者去追随你要做的新品类的 时候，也要看看他们能够引导过去的 基础条件是不是具备。比如说中国，喝豆浆本来就有群众基础，再加上牛奶出事，所以你引导他们去喝豆浆，这个是成立的。但如果你去美国豆浆\
    \ 家，教育美国的消费者喝豆浆，这就是上就没什么可能。就算有可能，可能需要你一辈子的时间。再比如说中医的 \"上火\" 这个概念，在中国也是很有群众基础的，相信凉茶能去除上火也是有群众基础的，如果不具备这两个条件，\"\
    怕上火，喝王老吉\" 这样的广告再烧几个亿打广告，也是很难的。\n\n这是第二种情况，也就是说发现一片蓝海。第一种情况是革命颠覆，这对绝大多数人是可遇不可求的。第二种，大的蓝海在创业热潮的时期可能会不多，但不渝的、小一点的蓝海，要找寻细去挖掘，是有可能找到的。如果你找到这样一个点子，第一个或者第一批发进去，尽快弄出几个好产品、好企业、好品牌来，是有望产生一个几十亿市值的公司。\n\
    \n### 3. 找到一个供给不足的增长行业\n\n做心爱的实木家具。为什么呢，因为老子是一个不靠谱的文青。这是最糟糕的选择。再比如说，不管市面上有多少家手机公司，也不管手机行业的入门门槛有多高，更不管手机行业是否还在增长，也不管手机行业的利润有多微薄，不管手机行业的供应链有多复杂和多看重规模，这些统统不管，老子就是要做自己心爱的手机，从整体上、从统计上、从理性上，这种都是最不可取的创业项目选择。\n\
    \n你可能有点听糊涂了，我为什么做手机。\n\n但是我们没有转型，并不是说我们没有意识到刚才说的那些弊端和困难，而是说因为我们有我们的规划，所以即使在那些困难都要面对的情况下，我们还是要继续做手机。只不过我们也启动了同时做一些其他的东⻄，把一部分团队放在做手机上，或者说主力团队放在做手机上，其他的项⽬也会陆续启动。\n\
