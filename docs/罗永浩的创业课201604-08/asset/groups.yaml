    首先，我们过去的五年虽然非常的累，但是，我只能觉得，我觉得值得，这五年收获了我能力、见识、个人成长进步这些，除了这些之外，还有巨大的幸福感。因为，我们每天做的是自己热爱的工作，在能力方面会有一个巨大的进步。同时，还收获了一个东西，就是说


    第二个问题是说，你觉得未来手机会向什么方向发展？到了今天，手机行业已经非常成熟了。几个巨头洗练得差不多了，有一些尘埃落定的意思。那么，这个带来的问题是说，如果没有大的意外，未来相当一段时间都会出现成熟的、保守的、稳健的这种模式的巨头。把整个行业的做法做得比较同质化、比较平庸。可能品质很好，但是没有什么创新，会迎来这么一个时代。


    所以我觉得未来手机的发展上，我还有哪一些类型的公司有机会，就是能够做出高度差异化的这样一个公司。从这个意义上，我们对我们自身未来的发展是比较乐观的。


    然后下一个问题是说，你心目中未来的手机会是什么样子？我现在很难描述这个未来的手机是什么样子的。我理解，或者说整个行业的理解，就是计算平台的转换和颠覆会在未来的8-10年内发生，这意味着手机可能还有差不多10年的好日子。那么就科技企业来讲，10年是一个非常长的时间周期，可能产生非常大的一个变化。但是，革命性的、颠覆性的东西不会在手机中产生，而是在下一代平台上产生。


    我们理解，可能未来8-10年里，由于更多的新发明、传感器、硬件的这些东西，会使得手机比今天变得更加丰富和有趣。但是，大的颠覆性的、革命性的东西，我觉得不会在手机本身产生。所以我们去想象未来，并不是说足够兴奋的一个东西，这是我个人的理解。


    好，下一个问题是说小米从“为发烧而生”到现在“让每个人享受科技乐趣”，你觉得公司的定位发展会随时间发生改变吗？我的想法是这样，以我对小米的理解，小米从创业到今天，公司定位发展都没有发生什么本质的变化，也就是说它一直是来定位自己做希望一个高品质、低价、高性价比这么一个国民品牌。从创业初期都是这么想的，走到今天也是这个样子。我觉得他们非常清醒和坚定地走在这条道路上，这是我喜欢和佩服小米公司的地方。


    至于你的让这个人“为发烧而生”和现在说的“让每个人享受科技乐趣”，一个公司即使定位和发展方向从来没有变化，阶段性地去调整一下它的口号、slogan、商业宣传语等等，是在商业世界里非常常见的一种现象。所以我感觉不能从它常常的一两句slogan去判断它的定位和发展发生了什么大的变化。


    > 创业时有没有想过失败的退路？是否给自己设定了一个止损的指标？这个指标是什么？


    这是一个很好的问题。每一个创业者或者说创业者都必须事先想清楚这个东西，就是说如果你失败的话，最后最坏的情况是什么。


    首先，大家都知道创业不是闹着玩的，它其实跟古代的时候打江山、打天下本质上是一样的。只不过，打江山、打天下最坏的结果就是满门抄斩，但现在，我们现代文明就是创业，最坏的结果就是破产，不用掉脑袋。所以它既过瘾又好玩的地方。


    创业时候最坏的结果，其实就是倒闭。我们在轮的时候，出现了一次非常非常艰难的经营的过程，当时很多不一两间的时间从我找到不了的话，公司是要倒闭了。在这个时期，我差不多有两周的时间每天都是失眠的，去想它最坏的结果。


    那个时候甚至想到了自杀的问题，因为我以前看那些企业家或失业者，想到的都是面子问题，或者说由来自信心，想过想自杀了，我都是这个肤浅的理解的。


    等到我面临这么一个局面的时候，发现那个时候对我来说最困难的是，一旦公司倒闭，那个时期的积累是一文不值的，倒闭就是彻底清零了。我这样的人心上的，我很难早期用我花言巧语“骗”来跟我一起创业的早期那几个兄弟。这里很多孩子甚至是刚毕业的，刚毕业以后我给他们一个
    offer，拿了BAT的一个offer，结果对我说个offer，去了那些公司可能是前程似锦的，来到我这里 是高风险的，我用各种方式给他们打气，告诉他们大饼，给他们鼓励，给他们讲理想和未来，然后把他们“骗”进了我的公司。如果这样的人
    一 到 了 的 话，我 心里 负 担 可 能 会 相 对 轻 些，如果 面 临 这 样 的 情 景 的 时 候。我 要 对 着 30 个、50 个 这样的
    人，告诉他们前面跟你讲的都是扯淡的，现在咱们倒闭了。我一想到这个，心理上压力是特别巨大的。所以，对我来说，每一个阶段困难最难的不出现在那个时候，都会每天投一定的时间，故意或者故意的必须去想这个问题，去想失败的最坏结果会是什么东西。


    经历了这几年之后，到了第3、第4年的时候，我就发现如果到了危险的，可能走不下去的时候，就会有一些大的公司过来谈收购的问题。那就说等我们过了最艰难的一关之后，就是走到了一定规模和阶段之后，如果你再倒闭的话，你这个倒闭的盘子本身也是有一个价值的。


    倒闭的盘子本身也是有一个价值的。这个价值如果能转换成钱或收益的话，你至少可以对你初期最原始、起步时候的那些元老级同事有一个交代。这时候我心理压力一定程度上得到了缓解。虽然，责任感没有变化，但是心理上最坏、最糟糕的那个压力得到了一定程度的缓解。这也给了我们一个启示，就是


    好，田野的第二个问题是是否会给自己设定一个止损的目标，这个当然也是正常和理性的做法。我们每一次公司面临巨大危机的时候，管理层会跟财务在一起去讨论说，我们一定要定一个止损的目标，到了某一个程度要么破产清算，要么卖掉，要怎么样，每一轮都是有这样的讨论的。


    但是，实际上我们过去的操作里有两次出现特别重大的危机的时候，虽然已经过了那个止损的目标，我还是不顾一切地想办法，个人出去借钱，或者是“卖身”、“卖艺”等等换来了一些收入，然后把原来定的这个止损目标突破的情况下，继续咬牙坚持，使得公司又度过了几次难关。


    我们的这种选择和做法未必是值得推荐、推广的这种方式，但是，当对你做的事业有足够强的这个信念和咬牙坚持下去这个决心的时候，可能多忍一步或多坚持半步的话都可能迎来转机，这是我自己
    的体会。但它是否具有推荐和推广价值？我其实是 没有很大的把握的，你可以自己思考。


