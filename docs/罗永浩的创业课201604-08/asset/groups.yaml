    ## 2. 我的学习驱动力来自于“幼态持续”


    但是，在少数人身上保持了一种不太正常的现象—幼态持续。幼态持续并不必然带来好的结果，有的人的幼态持续是终身很幼稚，才理学龄很低；还有一种比较幸运的，就是我或老黄这种，虽然已经近五十岁的将领，但是，在学习新的东西，尝试新的领域这些事上，旺盛的那个好奇心还跟小时候很像。因为，小孩子才会不停地问为什么，后来就有本书叫《十万个为什么》。


