    心壮志。但是到了二十多岁走进社会之后，尤其在中国，这个大环境相对不太健康的中国社会里，走进社会以后，很多人痛苦地发现，那些年轻时才华、有热情，非常正直耿直的这些年轻人，从二十多岁混到三十多岁一事无成。


    在中国，这是很常见的现象。你有能力、有才华、有热情，却一事无成，因为你不会圆滑处事，不会见人说人话，见鬼说鬼话，不会在领导面前拍马屁，不会在同事面前耍心眼，什么都不会。这样的结果是，你工作能力很强、很正直，到了30岁一事无成。


    这些人痛苦地发现身边那些臭流氓，年纪轻轻十七八岁就活的特别圆滑世故的那帮小兔崽子，在社会上如鱼得水，见人说人话，见鬼说鬼话，见到领导那副德性，简直没法看，见到同事就又是另外一副嘴脸。处事处的很圆滑，到了30来岁都混的非常好，要钱有钱，要车有车，二奶有六个。


    所以这些正直的年轻人到了30岁很彷徨，开始产生严重的自我怀疑，心想我到底在干嘛呢？于是他为了获得生存上的好处，决定跟着要流氓。所以这些人呢，不管是什么借口，最终选择了去做恶心的成人社会中的一个恶心的人，最可气的是他们之后还产生了幻觉，说这就是“成熟”。于是又过来毒害年轻人，跟他们说，你看，我年轻的时候也像你这样，现在我这叫成熟，你这叫幼稚。


    这是成熟吗？我不觉得这是成熟，这是不要脸。我现在看到很多我的同龄人变成这样，很多人都是我小时候的好朋友，也曾经充满了理想，充满了美好的这些东西，然后相信自己可以改变世界，最后却变成了这种恶心的人。


    我回家吃饭心情好就敷衍一下，有时候心情不好就忍不住当场戳穿他们。我说：“你看你们这帮兔崽子，年轻时候我们在一块儿聊，都说要改变世界，现在你，你改变个屁了。”然后他们就有点不好意思，说：“哎呀，行了，老罗，咱们那时候不是幼稚吗？谁能改变世界？谁也改变不了世界。”我就跟他们说：“你别客气了，你已经改变这个世界了，因为你变成了一个恶心的人，这个世界多了一个恶心的人，因此它变得恶心了一点点。”


    你们听懂了吗？每一个生命来到世间，都注定改变世界，这是你的宿命，你别无选择。你要么把世界变得好一点，要么把世界变得坏一点。有些人不服气，说：“MD，我就不信了，我自杀。”你自杀也不行，你自杀就把这个世界的自杀率改变了一点点。


    你如果走进社会，为了生存或是为了什么不要脸的理由，变成了一个恶心的成年人社会中的一员，那你就把这个世界变得恶心了一点点。如果你一生耿直，刚正不阿，没做任何恶心的事情，没有做任何对别人造成伤害的事情，一辈子拼了老命勉强把老婆、孩子、老娘，把身边的这些人照顾好了，没有成名，没有发财，没有成就伟大的事业，一生正直，最后梗着脖子到了七八十岁死掉了，你这一生是不是没有改变世界？你还是改变世界了，你把这个世界变得美好了一点点。因为你，这个世界又多了一个好人，听懂了吧？


    每一个生命来到世间，都注定改变世界。所以将来有一天你心里挣扎，不知道要做一个流氓……还是做一个正直的人。你在这个中间彷徨的时候，希望你记得我今天给你讲的这句话：每一个生命都注定改变这个世界。'
