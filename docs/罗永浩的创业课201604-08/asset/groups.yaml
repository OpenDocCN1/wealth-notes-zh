    # 创业公司引才策略


    创业公司被当成是一个草台班子的时候，出去谈人难免会非常困难，这时要注意的就是：


    - 1、不要低效率地采用笨工夫、花时间去挨个谈的方式，而是尽快在一个专业的领域找到一个资深的专业人才。

    - 2、一个草台班子搞定一个资深的专业人才，要么就是出很高的价码；要么就是靠相同的价值观和理念去吸引他，让他对于你企业去往的方向有认同感，这时换来的精诚协作效果还要好于单纯给钱。

    - 3、跟可能志同道合的人才去谈的时候，一定要坦诚，把你真实的情况说给他听、必要时跟他示弱、请求他的帮助。一般来说，这种能人如果碰到志同道合的人是很愿意帮忙的，这会带给他们很强的职业成就感。

    - 4、创业公司不可能全都是花钱去搞定人，一定要针对不同的群体做精准分析，然后抓住他们的特点有的放矢。很多工程师对出道时提携过他、带过他的那些技术主管非常地感恩，所以如果你能花一点心思集中精力搞定一两个技术主管、技术大牛，他通常会带着一整票的人马过来投奔你。


    ## 罗永浩


    好，以上就是今天我要和你分享的内容，在明天的课程当中，我们要分享的话题是，一个有志于创业或者已经走上创业道路的人，如何有意识地、常识地关注和接纳人才。


    欢迎你在留言区写下今天听完课程后的想法和我互动，我是罗永浩，感谢你把我的干货日记分享给你的朋友们，明天见。


    # 留言精选


    # 长期关注与接纳人才的方法


    欢迎来到我的干货日记，你好，我是老罗，罗永浩。


    今天我和你分享的话题是：有志于创业或已经创业的企业负责人，如何长期、有意识地关注和接纳人才？


    ## 1、利用一切机会和场合关注接纳人才


    这方面我比较佩服的一个例子是原凤凰周刊的主编，也就是今天大象公会的创始人黄章晋老师，他是我多年的好朋友。当年我和他受邀请去网易参加一些高校的活动，我就发现一个很有意思的现象，当我们在高校的讲台上跟大学生互动的时候，你相信由于这些年轻人整体上因为年龄的关系相对比较幼稚，所以问的问题大多数比较单纯、比较幼稚，但是时不时地，你也能在现场发现有一些非常优秀的年轻人站起来跟你对话、跟你提问题，并且回答你的问题和你的流露出跟他的年龄不成比例的成熟和优秀的那种气质。一但有这种情况，我们坐在一起在台上的几位所谓老师，大家感觉这个年轻人真不错，也就仅此而已了。


    但是我们注意到黄章晋老师，只要在休息或结束的时候，是一定要去跟那些给我们造成良好印象的、貌似优秀的年轻人交换电话号码和联系方式。当时我们开玩笑管他叫“黄总统”，所以我们就取笑他说，黄总统为了将来打江山、招人人才真是不遗余力。但是后来等到我创业的时候，我就意识到我做得有多糟糕，因为黄章晋创业的时候，他的通讯录上至少有一两百个他长期以来关注并且保持一定程度联系的人才清单，所以他把他们叫过来参与自己的事业，这个要少走很多的弯路，也非常有效。


    但是我们等到自己选择去创业的时候却发现，由于早年没有有意识地去去做这样的事情，导致我们需要人才的时候，明明过去的经历里接触过很多很多的优秀年轻人，但是等到你选择去创业的时候，发现想跟他们取得联系变得千难万难。所以凡是那些有志于创业的人，一定不要等到走上创业这一步才去考虑这些，一定要未雨绸缪，去考虑，老谋深算，就像黄章晋老师一样。


    有的人说那我早年没有注意做这件事情，现在才开始注意那怎么办？其实没有什么怎么办的，你从今天开始了有这个意识，就比较没有这个意识的企业家们都要好多。


    ![](img/3f2553c19e3d8036724ac589070714e0_33_0.png)


    ## 2、盯紧行业动态，关注走下坡路的企业


    别累，刚好又有一个比较不错的机会貌似没有那么累，所以他想换换环境、换换脑子这样走掉了；还有一种情况是，你搞了新一轮的全员调薪，他对调薪的这个结果不满意，你尝试去满足他，又涉及到你今年整个人员的预算是超标的，没法执行的情况下刚好有另一家公司开了一个非常有竞争力的这么一个新薪资条件，他可能也想换一换环境再试一试，这样就走掉了。总之各种情况都会使得，跟你志同道合的人由于某些其他的原因走掉。


    我们过去几年在这方面处理的比较好的是，当我们公司内部的人才流失的时候，如果这个人确实是人才流失或者说比较优秀的员工，我们的人才管理主管、招聘的同事一个人还缺点，通常会建立一个单独的数据库，这个数据库不仅包括流动的时间等等，还会包括到他的成长曲线，有没有其他渠道保持联系，比如说一个月两个月发一个短信问候一下、关心一下，在我们这个公司走得不顺，他去到那个公司有可能走得更加不顺；另外还有一个问题是他，去的那个公司也许走得很好，但是因为他文化这里，还有一些理念不合，可能薪资拿得满意了，但呆的并不开心，这种情况都是很频繁发生的。


    但是如果你因为他走的时候想挽留没有留住他，因而产生某些消极、怨恨的情绪，导致跟他失去了联系，很可能他在那呆得不开心，过了几个月又去了别的地方，而不是想起来回来这里。而且他主动找你的可能性比较小，因为他走的时候，既然是优秀人才你一定是挽留他的，但你挽留他的时候没有留住，他不免对你有一些愧疚之情，这时候如果他在新公司干得不开心，你主动联系他，他又有愧疚之情、又有相互了解和信任的基础，回来的概率是非常高的。但是如果你不主动联系他，他不好意思，所以他即便想回来也可能选择去了其他公司。


    如果你对这些事情想得比较透、了解得比较彻底的话，会知道当公司流失人才的时候，有各种各样的原因，所以当你尝试努力挽留、拿出最大的诚意都没有成功的时候，千万不要对他有怨恨或者是有负面消极的情绪，保持跟他的联系。


    如果花点心思的话，以我个人的成绩为例，我们过去5年里走掉的优秀的、绩效考评是A或A+这样的同事，加起来也就是10个、8个左右，但是一般来说，在半年或一年左右的时间里回来的机率是非常高的。我可以很得意地跟你讲，我们A+和A的员工流失，除了那些全家搬到外地的，基本上回来的比例是80%，希望这个东西对你有一个很好的参考作用。也就是说，千万不要怨恨那些中途离开的人，他并没有背叛你或者是跟你产生什么冲突，只是因为这样那样的各种原因。你要对他离开的原因充分了解，给予最大的理解之后，保持一个友好的关系。


    一旦他回来，通常工作动力是非常足的，而且他对你这块的业务非常地熟悉，几乎不需要什么磨合和适应，很快就会重新成为比原来工作状态还要好很多的一个骨干人员，这个是公司长期的财富，一定要在这投入很多的关注和精力。我们公司里甚至有过两出两进的，第二次回来的时候比第一次的动力还要足很多倍，这些都是花钱都买不来的宝贵的财富。


    ## 3、今日得到


    - 1、要利用一切机会、一切场合关注并接纳人才，这个是至关重要的。

    - 2、不要忘记盯紧自己所处行业里的动态，关注那些走下坡路或倒闭或可能出问题的企业，这个是短期内快速实现人才方面突破的一个很重要的方式方法。

    - 3、一定要提醒自己长期关注流失的内部优秀员工，要给予充分的理解，跟他保持一个友好的关系，在将来合适的时机重新劝他们回来。


    ![](img/3f2553c19e3d8036724ac589070714e0_34_0.png)


    好，以上就是今天我分享的干货日记，在明天的课程中我会继续和你聊一聊我个人比较个性化的3个招聘方面的绝招。


