    # 2.实践中提炼与升华如何操作？


    其实很简单，比如讲完狼羊和狼来了的故事，讲故事的人就开始提炼了：小朋友们，从这个故事里我们学会了什么呢？学会的当然就是，人不能撒谎，否则会死得很难看。这就是提炼，也是从特定的经验故事里提炼出更具普遍意义的东西，来指导我们如何面对类似的全新状况。


    再比如讲一个刘秀和吴汉的故事，光武帝刘秀有一次吃了败仗，夜里去巡视营房，看那些战败的士兵是什么状态。结果一看，有的垂头丧气，有的失声痛哭，有的借酒浇愁，终于走到一个帐篷，看到里面一个年轻的军官，脸上没有表情，既不忧伤，也不沮丧，既不在那里拿着一块破布擦武器，擦盔甲，摇得雪亮雪亮的，准备下一次的战斗。刘秀很高兴，说：“假以时日，这小子肯定能成大器。”结果这小子后来真的成了大器，他就是东汉的大将军吴汉。


    讲故事的人讲到这里，先提炼一下：这个故事告诉我们的是，那些战败后不屈不挠，该干嘛干嘛的人，才能成事。这是提炼，这是


    接下来演讲者要升华一下了：当我们面对挫折、打击、沮丧的时候，不要伤心，不要遗憾，甚至不要默然，不要愤怒，不要抗议，只管埋头默默擦亮武器，准备下一次的战斗。这种升华


    再讲个例子，2013年，锤子科技成立一周年，终于能够发布手机操作系统的测试版了，那是在我们过去五年来，走得最艰难的一段时期，几乎所有人都不看好我们，能不能拿到下一轮的融资也是未可知。


    为了给公司的同事们打气，为了给投资人看信心和状态，也为了给支持我们的人表明一个态度，在那场发布会的结尾处，我讲了绘画爱好者罗伯特·富尔顿半路出家造船的故事。为他制造的蒸汽轮船“克莱蒙特”号在美国哈德逊河首次下水时，围观群众先起哄说，“开不起来”，“开不起来”，结果船开起来了，围观群众又喊，“停不下来”，“停不下来”。但他这些从他开始跨着条蒸汽轮船就开始对抗这股冷水的笨蛋们最终还没有能力干扰到他，这艘船的船帆也取得了成功，罗伯特·富尔顿后来还建立了一个蒸汽船帝国。


    讲完了这个故事，先提炼一下：罗伯特·富尔顿的经历告诉我们，当你跨界创业，做一番事业的人，难免被围观的群众泼冷水，说三道四，创业者不应该被这些东西干扰，只管埋头做好该做的事情就是了。


    然后再升华一下，那次我主要就是为了给同事们和支持者们打气，所以给演讲的准备下了这样的功夫，也没有非要在更高的认识水平上去做文章。我只是跟现场的观众传递了这样一个信息：虽然创业者们继续咬紧牙关做事，不是为自己想做做的事情做好，改变一些东西，实现梦想和愿望，不是为了跟这些吃饱了撑的给创业者泼冷水的笨蛋们较劲，但过程中随手就气死这些笨蛋，也是我们的宿命。


    # 3.我的演讲生涯中，最好的一次“提炼与升华”的案例


    这世上绝大多数普通人，都不会成为所谓“改变世界”的大事业家，这本来没什么。但成年后的挫折和失败，会使很多人因此变得非常虚无主义甚至堕落。为了尝试说好一点，他们在生存过程中也经常做一做缺乏的事，并劝说自已这没什么，反正自己坚持信念，努力奋斗也改变不了世界，做点缺德的事儿，也改变不了世界，所以无所谓。


    有感于这种观念的流行，我在2009年的一次高校演讲中，那时候我是做罗英语培训，在那次演讲中，我讲了我们如何一步一个脚印，如何通过努力与坚持，在一个被普遍认为必须漂漂才能赚到钱的行业里，干干净净的赚到了钱。


    讲完了这一系列的故事之后，我在升华的部分，讲了一个朴素的道理，就是“每一个生命来到世间，都注定改变世界”。这是我这辈子演讲的所谓升华内容中，被转载转发最多，传播最广的一个，我把它的具体链接及文本附在这篇文章的后面，供你学习演讲时参考。


    好，以上就是我们探讨的，关于讲故事的六个辅助元素中的最后一个元素：提炼和升华。


    我们用了好几天的时间，来探讨讲好一个故事的6个辅助元素。这些方法，只要你多加练习，它一定会起作用。但同时，你也一定要知道，


    ；而且很重要的一条是，你要真的相信


    罗永浩


