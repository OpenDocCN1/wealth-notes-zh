    如果企业里没有擅长随机应变，擅长应对这类场面的人，不建议安排问答环节，否则冷场或失控是大概率事件。有些企业的做法是：提前准备好大部分的问题和答案，由关系好的媒体现场搞有问事地询，然后再自己把准备好的答案煞有介事地说
    一遍。这种操作的关键是，主持人不给现场真的临时想问问题的记者发言的机会，免得出现意外。供参考。


    您怎么评价锤子手机的发布会？您觉得锤子的发布会最成功的状态或者最好的地方在哪里？


    锤子科技的发布会，从技术层面上，受限于各种条件，很多事情其实都没有做好。锤子科技的发布会真正做得好的地方有两个：


    # **第一个地方是产品的优点讲解和演示做得好。**


    很多企业做的产品优点很突出，但讲解得 不好，所以我前期传播就会相对弱。而且除了苹果公司和锤子科技，其他手机厂商也不敢做手机功能的现场演示，要么就是没什么可供演示的差异化的功能，要么是怕现场意外丢人，这是有问题的。


    当然，他们可能还是卖得很好，销量很大，这是因为产品的商业成功，是一个复杂的系统工程。有的企业发布会做得不够好，甚至可能产品都不好，其他方面很强，比如销售团队很厉害、供应链管理和成本控制做得很厉害、运营商渠道很厉害，也有可能很成功。锤子科技做了五年，直到这次的坚果Pro发布后才打开局面，是因为别的方面短板多，单说发布会的，我们的产品讲解和演示功能演示，从一开始就定准是示范级别的。


    # **第二个地方是故事讲得好。**


    锤子科技上的创业过程，是一个活生生的关于野望、关于工匠精神、关于理想主义的样板。光是有这样有什么用呢？每年有那么多野心勃勃的创业公司成立，他们中的 一部分人，跟我们有着一样的梦想、一样的工匠精神、一样的理想主义，但一直倒到倒，都没有人知道。


    如果你觉得成功，传播得成功，它会打动足够多的人，在暂时的创业初期，产品本身还 没达到一些瑕疵的情况时，在供应链和生产根本搞不定所以没法及时交付产品的情况下，甚至完全没有财务预算去打广告做宣传的情况下，也能转化一个体量还不错的，虽然可能还不足以让公司盈利，但足以让公司活下来的忠实用户群体。


    你不要把这个讲故事理解成是瞎编一个故事。有的企业卖实话，我们不会讲故事，我们只会踏踏实实地几十年如一日地做好一件事，然后踏踏实实 地卖给消费者。这不是讲故事呢？当然是，这是一个踏实本分的品牌故事。有的企业家说，我们赚多少少钱，取得多少成就也不会满足，我们在某个领域一旦做成，马上就想开始挑战下一个难题了。这是一个富冒险和进取精神的
    品牌故事。


