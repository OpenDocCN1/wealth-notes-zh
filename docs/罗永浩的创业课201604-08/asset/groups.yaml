    每个问题可能没有一个唯一正确的答案，每个企业的创始人可能会有自己的判断和做法。以我个人为例，如果对对方有潜力，但是自持过高，要价不匹配，这样的话我决定要不要录取这个人的依据是：


    如果有可替代性，并且那个人又自持过高的，那么问题就变得非常简单；如果他在特定的岗位上是很难替代的，甚至是不可替代的时候，我会忍受一切的不舒服、打击、折磨、摧残，包括资损上我也可能会去。我相信，给大多数理性的企业负责人都会采用这个方式。


