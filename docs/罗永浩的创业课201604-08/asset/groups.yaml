  md: "\n## 2. 实践中提炼与升华如何操作？\n\n其实很简单，比如讲完狼羊和狼来了的故事，讲故事的人就开始提炼了：“小朋友们，从这个故事里我们学会了什么呢？学会的当然就是，人不能撒谎，否则会死得很难看。”这就是提炼，也是从特定的经验故事里提炼出更具普遍意义的东西，来指导我们如何面对类似的全新状况。\n\
    \n再比如讲一个刘秀和吴汉的故事，光武帝刘秀有一次吃了败仗，夜里去巡视营房，看那些战败的士兵是什么状态。结果一看，有的垂头丧气，有的失声痛哭，有的借酒浇愁，终于走到一个帐篷，看到里面一个年轻的军官，脸上没有表情，既不忧伤，也不沮丧，既不在那里拿着块破布擦武器、擦盔甲，擦得雪亮雪亮的，准备下一次的战斗。刘秀很高兴，说：“假以时日，这小子肯定能成大器。”结果这小子后来真的成了大器，他就是东汉的大将军吴汉。\n\
    \n讲故事的人讲到这里，先提炼一下：这个故事告诉我们的是，那些战败后不屈不挠、该干嘛干嘛的人，才能成事。这是提炼。\n\n接下来演讲者要升华一下了：当我们面对挫折、打击、沮丧的时候，不要伤心，不要遗憾，甚至不要默然，不要愤怒，不要抗议，只管埋头默默擦亮武器，准备下一次的战斗。这就是升华。\n\
    \n再讲个例子，2013年，锤子科技成立一周年，终于能够发布手机操作系统的测试版了，那是在我们过去五年来，走得最艰难的一段时期，几乎所有人都不看好我们，能不能拿到下一轮的融资也是未可知。\n\
    \n为了给公司的同事们打气，为了给投资人看信心和状态，也为了给支持我们的人表明一个态度，在那场发布会的结尾处，我讲了绘画爱好者罗伯特·富尔顿半路出家造船的故事。为他制造的蒸汽轮船“克莱蒙特”号在美国哈德逊河首次下水时，围观群众先起哄说：“开不起来！”“开不起来！”结果船开起来了，围观群众又喊：“停不下来！”“停不下来！”但他这些从他开始跨着条蒸汽轮船就开始对抗这股冷水的笨蛋们最终还没有能力干扰到他，这艘船的船帆也取得了成功，罗伯特·富尔顿后来还建立了一个蒸汽船帝国。\n\
    \n讲完了这个故事，先提炼一下：罗伯特·富尔顿的经历告诉我们，当你跨界创业、做一番事业的时候，难免被围观的群众泼冷水，说三道四，创业者不应该被这些东西干扰，只管埋头做好该做的事情就是了。\n\
    \n然后再升华一下。那次我主要就是为了给同事们和支持者们打气，所以给演讲的准备下了这样的功夫，也没有非要在更高的认识水平上去做文章。我只是跟现场的观众传递了这样一个信息：虽然创业者们继续咬紧牙关做事，不是为自己想做做的事情做好，改变一些东西，实现梦想和愿望，不是为了跟这些吃饱了撑的给创业者泼冷水的笨蛋们较劲，但过程中随手就气死这些笨蛋，也是我们的宿命。\n\
    \n## 3. 我的演讲生涯中，最好的一次“提炼与升华”的案例\n\n这世上绝大多数普通人，都不会成为所谓“改变世界”的大事业家，这本来没什么。但成年后的挫折和失败，会使很多人因此变得非常虚无主义甚至堕落。为了尝试说好一点，他们在生存过程中也经常做一做缺德的事，并劝说自己这没什么，反正自己坚持信念、努力奋斗也改变不了世界，做点缺德的事儿，也改变不了世界，所以无所谓。\n\
    \n有感于这种观念的流行，我在2009年的一次高校演讲中，那时候我是做罗英语培训，在那次演讲中，我讲了我们如何一步一个脚印，如何通过努力与坚持，在一个被普遍认为必须漂漂亮亮才能赚到钱的行业里，干干净净地赚到了钱。\n\
    \n讲完了这一系列的故事之后，我在升华的部分，讲了一个朴素的道理，就是“每一个生命来到世间，都注定改变世界”。这是我这辈子演讲的所谓升华内容中，被转载转发最多、传播最广的一个，我把它的具体链接及文本附在这篇文章的后面，供你学习演讲时参考。\n\
    \n好，以上就是我们探讨的，关于讲故事的六个辅助元素中的最后一个元素：提炼和升华。我们用了好几天的时间，来探讨讲好一个故事的6个辅助元素。这些方法，只要你多加练习，它一定会起作用。但同时，你也一定要知道，而且很重要的一条是，你要真的相信。\n\
    \n罗永浩\n\n好，以上就是今天创业课的内容，欢迎你写下听完之后的感想留言，我们在留言区里一起交流。\n\n- “讲好故事的6个辅助性元素”系列：（点击即可查看）\n\
    \  - 第1篇：情节和篇幅+细节\n  - 第2篇：发言场合+构思要点\n  - 第3篇：要有魂\n\n## 附录：《每一个生命来到世间，都注定改变世界》\n\
    \n每一个年轻人都相信自己与众不同，相信自己的生命到世间要改变世界，充满了雄心壮志。但是到了二十多岁走进社会之后，尤其在中国，这个大环境相对不太健康的中国社会里，走进社会以后，很多人痛苦地发现，那些年轻时才华横溢、有热情，非常正直耿直的这些年轻人，从二十多岁混到三十多岁一事无成。\n\
    \n在中国，这是很常见的现象。你有能力、有才华、有热情，却一事无成，因为你不会圆滑处事，不会见人说人话，见鬼说鬼话，不会在领导面前拍马屁，不会在同事面前耍心眼，什么都不会。这样的结果是，你工作能力很强、很正直，到了30岁一事无成。\n\
    \n这些人痛苦地发现身边那些臭流氓，年纪轻轻十七八岁就活（得）特别圆滑世故的那帮小兔崽子，在社会上如鱼得水，见人说人话，见鬼说鬼话，见到领导那副德性，简直没法看，见到同事就又是另外一副嘴脸。处事处得很圆滑，到了30来岁都混的非常好，要钱有钱，要车有车，二奶有六个。\n\
    \n所以这些正直的年轻人到了30岁很彷徨，开始产生严重的自我怀疑，心想我到底在干嘛呢？于是他为了获得生存上的好处，决定跟着要流氓。所以这些人呢，不管是什么借口，最终选择了去做恶心（的）成人社会中的一个恶心的人，最可气的是他们之后还产生了幻觉，说这就是“成熟”。于是又过来毒害年轻人，跟他们说，你看，我年轻的时候也像你这样，现在我这叫成熟，你这叫幼稚。\n\
    \n这是成熟吗？我不觉得这是成熟，这是不要脸。我现在看到很多我的同龄人变成这样，很多人都是我小时候的好朋友，也曾经充满了理想，充满了美好的这些东西，然后相信自己可以改变世界，最后却变成了这种恶心的人。\n\
    \n我回家吃饭心情好就敷衍一下，有时候心情不好就忍不住当场戳穿他们。我说：“你看你们这帮兔崽子，年轻时候我们在一块儿聊，都说要改变世界，现在你，你改变个屁了。”然后他们就有点不好意思，说：“哎呀，行了，老罗，咱们那时候不是幼稚吗？谁能改变世界？谁也改变不了世界。”我就跟他们说：“你别客气了，你已经改变这个世界了，因为你变成了一个恶心的人，这个世界多了一个恶心的人，因此它变得恶心了一点点。”\n\
    \n你们听懂了吗？每一个生命来到世间，都注定改变世界，这是你的宿命，你别无选择。你要么把世界变得好一点，要么把世界变得坏一点。有些人不服气，说：“MD，我就不信了，我自杀。”你自杀也不行，你自杀就把这个世界的自杀率改变了一点点。\n\
    \n你如果走进社会，为了生存或是为了什么不要脸的理由，变成了一个恶心的成年人社会中的一员，那你就把这个世界变得恶心了一点点。如果你一生耿直，刚正不阿，没做任何恶心的事情，没有做任何对别人造成伤害的事情，一辈子拼了老命勉强把老婆、孩子、老娘，把身边的这些人照顾好了，没有成名，没有发财，没有成就伟大的事业，一生正直，最后梗着脖子到了七八十岁死掉了，你这一生是不是没有改变世界？你还是改变世界了，你把这个世界变得美好了一点点。因为你，这个世界又多了一个好人，听懂了吧？\n\
    \n每一个生命来到世间，都注定改变世界。所以将来有一天你心里挣扎，不知道要做一个流氓……还是做一个正直的人。你在这个中间彷徨的时候，希望你记得我今天给你讲的这句话：每一个生命都注定改变这个世界。\n\
    \n## 演讲中的吹牛艺术\n\n我们在演讲中提倡的，当然是第一种，也就是合理吹牛者。用得恰当的话，吹牛在演讲中是一个完全全全的加分项。\n\n华尔街日报上发过一篇爆（款）很好看的文章，标题是“什么时候吹牛是OK的？”文章中说，布朗大学的心理学家关于吹牛的一项研究结果表明，一般来说，如果在有理有据，无法反驳的情况下“吹牛”，人们会认为你虽然自负，但却能力出众；如果你对自己的成绩低调沉默，人们会认为你谦逊诚实，但能力有限。\n\
    \n一般来说，一个公开演讲者需要给受众造成的印象，常常是第一种。当然，如果你有自己的合理选择，也可以相应的做出选择。\n\n初学吹牛的演讲者，很容易犯的一个错，是吹牛的分寸感不好。演讲中的吹牛，虽然是加分项，但不一不小心吹爆了就不好了，那么如何防止吹牛吹爆呢？\n\
    \n美国作家Peggy Klaus写了一本有意思的书，书名叫做《避免牛皮吹爆的“吹牛”艺术》，在书中，她指出，为了避免牛皮吹爆，有一些注意事项，比如不能误导听众，要选择合适的时机，吹起来不能没完没了，以及切忌为了吹牛不惜撒谎等等。很可惜这本书目前还没有中文版，不排除稍后我们会找长期合作的出版机构引进这本书。如果引进了，也会第一时间在得到上推荐。\n\
    \n那么，到底如何吹牛？我们尝试简单总结一下。\n\n### 1. 吹牛要分场合\n\n和朋友们交谈的时候不要自夸；多年不见的老同学聚会的时候不要自夸；和别人初次约会或亲戚之间的饭局上不要自夸；过年回家，在亲戚之间的饭局上不要自夸；见女朋友家长时不要自夸……\n\
    \n总结下来就是，如果你在某些场合中，更想被他人喜欢，而不是被他人佩服或是印象深刻，那就尽量不要吹牛，这也是前面说过的布朗大学的心理实验的结论的一部分。\n\
    \n如果你的需求是反过来的，也就是说，在某些场合中，你更需要被他人佩服或是印象深刻，而不是更需要被他人喜欢，你就可以选择吹牛。下面就是一些适合自夸的场合：\n\
    \n- 参加选美比赛时，善于自夸，是加分项，评委更喜欢自信的选手；\n- 应（聘）时，适当的自夸几乎是必须的，虽然不能撒谎；\n- 面见投资人，无论是对自己还是对项（目），一定要自夸；\n\
    - 售卖自己的东西时，有（理）自夸；\n- 政治家如何演讲，简直是竞选活动中唯一的重要的课题；\n- 当然了，在公开演讲中，自夸通常也是好事。\n\n###\
    \ 2. 吹牛要考虑受众对象的特性\n\n面对一群观念开放的人，合理自夸是好事；面对一群观念保守的人，自夸就有可能不是好事。一定程度上，这解释了为什么那些成功成名的歌手，给一群而（大）想到大学生中演讲时，通常较少吹牛，而去到中学里演讲时，就兴致盎然地吹一会儿，这是非常合理的选（择）和安排：不是因为大学生好，而是因为大学生观念比中年人开放。\n\
    \n## 如何提出一个好问题？设计一个好的问题的方式都有哪些？\n\n### 1. 引发思考\n\n最常见的提问策略是引发观众的思考，这需要你去发现大家普遍感兴趣并且可以参与思考的问题。比如在锤子科技\
    \ T1 的发布会上，我们提到了一个问题：“单手操作的黄金尺寸究竟应该是多少？”这个问题每个人都可能会遇到，不管你是喜欢大屏幕手机的，还是小屏幕手机的，但可能大家都没有仔细想过，那么你来提出，就现场引发了思考。\n\
    \n再比如，我们在一场发布会的前期预热时，在微博上提出过这样一个问题：“为什么同样是中国南方工厂生产的皮包，贴上欧洲品牌之后就能卖几十倍甚至几十倍的价钱？”这个现象其实是大家都普遍观察到的，但你问出来，可能大家才会认真去想这个问题，他们也想知道这是为什么，就引发了好奇心、和随之而来的热烈讨论。\n\
    \n### 2. 传达理念\n\n提问的另一种策略是，以传达某种理念来为目的的来提问，你希望借助向观众传达的内容，并不包含在答案中，有时候甚至不需要你给出解答，观众看到你的问题本身，已经接收了你要传递的信息。我们看几个锤子科技发布会上的例子：\n\
    \n- “在一个完美主义者眼中，这是一个怎样的世界？”这个提问很明显的向观众传递了提问者对于自己的定位、追求完美以及对一个腐朽的旧世界的不满。\n- “智能手机在全球普及的伟大进程中，哪一个用户群体被我们遗忘了？”这个问题传达的是，我们非常重视广大的用户，同时也关注那些被这个时代忽略的特定用户群体，有些事儿纵然他们不管，那也交给我们吧。就使我们为他们做得更好，除了公众容易从企业身上观察到的那些，还有宝贵的人文关怀，这是我们的产品时坚持的理念。\n\
    \n当然，这个问题在详细解释清楚之前，观众一看到问题也会迅速展开思考：哦，那个被我们所遗忘的用户群体到底是谁啊？\n\n### 3. 假装不小心故意透露部分信息\n\
    \n为了发布会预热时，还有一项貌似严肃和忠诚、内藏灵萌和奸诈的提问手段，叫作“假装不小心故意透露部分信息”。也就是说，在预热期你想要透露一部分信息以引发讨论，但又故意不直说，采用提问的方式，把想要传达的信息假装隐藏在问题里，这会导致以为你不小心泄露了信息而他人刚好猜出来的人非常高兴，他们就会到处转发并宣布自己的发现。\n\
    \n比如，“是更快的快充，还是干脆忘了充电这回事？”这句话没有直说，但听众稍加推理就明白我们要在手机续航的时间上做生意了，而且成果貌似很牛、弄不好已经达到了让用户“忘了充电这回事”的程度了。\n\
    \n再比如，“同样是把硬件配置堆到头，卖用户体验的公司和卖配置的公司带给你的有什么不同？”这句话也同样没直说，而且貌似在讨论用户体验，但实际上已经透露了这款产品的硬件配置是顶尖的。\n\
    \n### 4. 营造悬念\n\n营造悬念这种提问方式，往往是先讲一个观众可能关心的现象，或者先公布一个观众可能关注的结果，观众知道这结果，却不知道为什么会这样的结果。\n\
    \n比如在坚果 Pro 的发布会上，我们问了这样一个问题：“过去的 3 年，手机芯片的速度快了 310%，为什么你手机做事的速度只快了 13%？”有一个零件、煞有介事地数字，这就是一些悬念，当你提出这样一个问题，观众就会全程聚精会神关注你揭示答案的过程。\n\
    \n### 5. 装 X\n\n最后一个要讲的提问方法，是以装 X 的姿态来提问。有些问题甚至一看就是假装提问。但是给品牌形象带pose、纯装X、一个非常降格或风趣的装X模式，对观众产生巨大的感染力、甚至直接能提升你的品牌调性。我们来看其中几个例子：\n\
    \n- 严重受限于相同的工业标准、戴着镣铐跳舞的正匠如何用不一样的温度细节让你在黑暗中得到惊喜？\n\n这个问答术特别像抒情诗一样的问题，虽然蕴含着对我们产品的一个新特性，但本质上主要还是装\
    \ X。\n\n下面的这个也是一样，虽然隐含了我们产品的一个新特性，但本质上主要还是装 X。\n\n- 圆滑当道的时代，驱动一个团队保持锋芒与锐利的，究竟是无所谓的固执，还是理智的坚持？\n\
    \n至于下面最后一个，则是百分之百的纯装 X，而且装得非常高雅，虽然形式上是严肃的提问。\n\n- 患有不可救药的工匠情结的创业者们，在浮躁的时代如何取舍和自处？\n\
    \n好，关于装x的更多科学运用，我们会在后续的课程中专门提及。\n\n那么，提问题时有哪些注意事项呢？要学会跟观众换位思考，否则只有冷场和尴尬。\n\n这种情况的尴尬程度，不亚于一个相声演员费尽心机地铺垫了20分钟，最后抖出来的却是一个全国人民都听过的老包袱。\n\
    \n- “你知道我们的手机有几种颜色吗？”\n- “大家说说我们应该卖多少钱啊？”\n\n显然就属于这种糟糕的问题。无论观众猜对还是猜错，都毫无意义。这种问题的实质是以戏弄观众的形式来达到廉价的、蹩脚的互动效果。\n\
    \n## 今日得到\n\n- 1. 演讲中提问能够抓住用户的注意力，触发他们去发现问题，启发观众思考，带着他们一起寻找答案，从而使他们产生成就感和愉悦；\n\
    - 2. 5种设计一个好的问题的方式：引发思考、传达理念、假装不小心故意透露部分信息、营造悬念、装x；\n- 3. 演讲中的提问需要注意3个问题：不要提那些你自己很关心，但受众可能完全不会关心的问题；不要故作神秘或洋洋得意地问一个大家都知道答案的问题；不要用拙劣的提问来戏弄观众。\n\
    \n罗永浩\n\n好，以上就是今天创业课的内容。欢迎你写下听完之后的感想留言，我们在留言区里一起交流。明天见。\n\n## 老罗新语录\n\n![](img/3f2553c19e3d8036724ac589070714e0_92_0.png)\n\
    \n> 一个创业者如果只是简单地陈述自己干了些什么，这些辛苦成果的魅力将大打折扣。如果以一个问题的形式，引导观众一起思考、解决，就会让消费者产生一种参与其中的成就感，并从中获得愉悦的体验。\n\
    \n## 创业问答\n\n### 关于市场调查\n\n但从另一个角度，乔布斯决定做革命性的手机之前，一定会看手机的市场调查数据，看看美国和全球一年手机能卖出多少台手机，看看大家在手机上使用上的需求和痛点是什么，手机除了是手机当时的那种形态，它还可以是什么样子等等。做这种革命性的手机之后，即便它卖得非常好，好得要命，乔布斯也会继续看市场调研数据，看大家最满意的是iPhone\
    \ 的哪几个方面，最不满意iPhone 的哪些方面，然后根据这些相应地做出调整。就像福特造汽车之前，也会看看城市交通工具的需求量是多少，比如纽约一年能卖出去多少辆马车之类的。如果开售之后，会去看消费者的满意度和吐槽率之类的调研结果。\n\
    \n所以，所谓的不做市场调查，是指这方面不需要做调研，做了也得不到有价值的意见和反馈。但除此之外，...\n\n### 2. 为什么不挣钱的项目能融到钱？\n\
    \n有些项目，外行人看来完全不挣钱，比如共享篮球，为什么还能融到大笔的投资呢？\n\n共享篮球我没研究过，不便乱讲。但给大家造成这类感受的事情其实还是很多的，大家总说，某某项目显然是如此的靠谱，为什么还能融到那么多钱？常见的原因无非是这样：\n\
    \n- 1. 有些项目的商业逻辑比较复杂，难于理解，所以只有一小撮投资者能看懂。大家看着的这些项目看起来起来的现象，没有看懂在在东西的早期，就会因此产生误会。\n\
    - 2. 有些项目因为项目本身以外的某种原因，拿到了某个明星机构的投资，就会有一群无头苍蝇里的投资者跟进，特别是在这些项目的早期，因为跟投的风险很低。\n\
    - 3. 有些项目处在某个大的风口方向上，这时候，会被提到该风口上的好项目上的投资者，会补偿性地投些一二类项目的二三类项目，甚至是把项目拿来赌自己没错过风口。顺说一下，有些投资人是真傻，其实是装傻。年纪绝高的都是，风险资本家个个都是绝对的精英，都是人中龙凤，都是揣着大把钞票并且教养良好的高学历海归财神爷，其实他们多数都是帮财神爷打手的投资经理。跟绝大绝大多数社会类的群体或组织一样，都是百分之二十的精英带着百分之八十的平庸者往前奔。\n\
    - 4. 共享篮球我不清楚，但很多统计数据表明，中国的创业公司宣布自己融到了多少钱的时候，大多数都是水分有的。很少像锤子科技这样，老实到让了解真相的人都感到心疼的创业公司。\n\
    \n### 3. 创业以后还会回公司上班吗？\n\n是不是自己创业了，无论结果如何，都很难再回公司上班了？\n\n倒也不至于，创业公司三年内倒闭的几率是百分之九十左右，但从二次、三次创业的人却没有那么多。那些人都到哪里去了呢？肯（定）还是上班去了，就不甘心的。\n\
    \n但同时，很多创业过的人也确实深刻的感受到，创业这东西，就像抽烟或吸毒品，要真正戒掉是非常困难的。就算被迫戒掉了，但总有复吸的机会，还是合（不）蠢过程，心痒难（忍/吸）。所以最好想办法，创业不管多艰难，咬牙坚持，不要放弃，就过去了就好了，免得将来天天都是找人交战（交钱？）。\n\
    \n### 4. 该不该倾囊相授培养新人？\n\n倾囊相授地培养了一位新人，可对方学到东西就要走人，该怎么办？难道下次面对新人，还要刻意保留？非常纠结。\n\
    \n不至于吧，21世纪了，大家能有什么独门秘笈，到了要刻意保留，传子不传女的程度上，我想无非就是以下几种情况和对应思路吧：\n\n- 1. 如果这种情况偶尔发生，我倒意是，不至于因此就不教新人了。如果不教新人，你时间不够用又事事亲力亲为，累死了也是很难省自己。如果是复制（频繁）发生，就可以考虑推给自己了。为什么倾囊相授的人总也留不住？是不是自己待人的方式有问题之类似的。\n\
    - 2. 对方狼心狗肺，天性凉薄，人品有严重问题等等，但一般说来，这是小概率事件，不至于因此就不教新人了，因噎废食，因小失大，都是不明智的做法。\n- 3.\
    \ 对方有某种不得的难处才被迫走，所以看起来就像是“学到东西就要走人”，但其实有可以理解的原因。亚洲人辞职的时候，很少会对公司说真正的辞职原因，所以也不能强求对方告知真正的原因，只能互相理解理解。\n\
    \n最后，我以前也讲过类似的内容，我再次再喂一遍，那就是，留不住人才，一定要留点香火情，千万不要因为留不住而恼羞成怒，撕破脸皮，说伤感情话之类。锤子科技创业五年，有些过程中留不住的优者，又重回来发挥重要甚至关键作用的，有好几个。创业者的心胸和度量，要能撑船，能撑航母，能开无人驾驶汽车，不能自己带出来的徒弟伤（害？）。\n\
    \n## 延伸阅读\n\n- 《第1课，空公司怎么会有意义呢关注和接纳人才？》（点击查看）\n\n## 今日得到\n\n- 1. 划时代需求的产品通常都不是市场调研得出的意见和反馈，但是正常的企业经营和运作，很大程度上，还是需要靠谱的市场调查报告和数据来指导工作的。\n\
    - 2. 有的项目因为商业逻辑复杂只有投资人能看懂，有的则是因为投资人出现成本低或者水平有限，所以会出资看起来不挣钱的项目却能投到投资。\n- 3. 创业者要有心胸和度量对待自己倾囊相授培养过的人才的离开。\n\
    \n罗永浩： 好，谢谢这几位同学的提问，如果你在创业中有什么困惑，或者你有什么和我分享的，都欢迎在留言区留言给我。我是罗永浩，感谢把我的创业课分享给你的朋友，我们明天见。\n"
  mdcn: "\n## 2. 实践中提炼与升华如何操作？\n\n其实很简单，比如讲完狼羊和狼来了的故事，讲故事的人就开始提炼了：“小朋友们，从这个故事里我们学会了什么呢？学会的当然就是，人不能撒谎，否则会死得很难看。”这就是提炼，也是从特定的经验故事里提炼出更具普遍意义的东西，来指导我们如何面对类似的全新状况。\n\
    \n再比如讲一个刘秀和吴汉的故事，光武帝刘秀有一次吃了败仗，夜里去巡视营房，看那些战败的士兵是什么状态。结果一看，有的垂头丧气，有的失声痛哭，有的借酒浇愁，终于走到一个帐篷，看到里面一个年轻的军官，脸上没有表情，既不忧伤，也不沮丧，既不在那里拿着块破布擦武器、擦盔甲，擦得雪亮雪亮的，准备下一次的战斗。刘秀很高兴，说：“假以时日，这小子肯定能成大器。”结果这小子后来真的成了大器，他就是东汉的大将军吴汉。\n\
    \n讲故事的人讲到这里，先提炼一下：这个故事告诉我们的是，那些战败后不屈不挠、该干嘛干嘛的人，才能成事。这是提炼。\n\n接下来演讲者要升华一下了：当我们面对挫折、打击、沮丧的时候，不要伤心，不要遗憾，甚至不要默然，不要愤怒，不要抗议，只管埋头默默擦亮武器，准备下一次的战斗。这就是升华。\n\
    \n再讲个例子，2013年，锤子科技成立一周年，终于能够发布手机操作系统的测试版了，那是在我们过去五年来，走得最艰难的一段时期，几乎所有人都不看好我们，能不能拿到下一轮的融资也是未可知。\n\
    \n为了给公司的同事们打气，为了给投资人看信心和状态，也为了给支持我们的人表明一个态度，在那场发布会的结尾处，我讲了绘画爱好者罗伯特·富尔顿半路出家造船的故事。为他制造的蒸汽轮船“克莱蒙特”号在美国哈德逊河首次下水时，围观群众先起哄说：“开不起来！”“开不起来！”结果船开起来了，围观群众又喊：“停不下来！”“停不下来！”但他这些从他开始跨着条蒸汽轮船就开始对抗这股冷水的笨蛋们最终还没有能力干扰到他，这艘船的船帆也取得了成功，罗伯特·富尔顿后来还建立了一个蒸汽船帝国。\n\
    \n讲完了这个故事，先提炼一下：罗伯特·富尔顿的经历告诉我们，当你跨界创业、做一番事业的时候，难免被围观的群众泼冷水，说三道四，创业者不应该被这些东西干扰，只管埋头做好该做的事情就是了。\n\
    \n然后再升华一下。那次我主要就是为了给同事们和支持者们打气，所以给演讲的准备下了这样的功夫，也没有非要在更高的认识水平上去做文章。我只是跟现场的观众传递了这样一个信息：虽然创业者们继续咬紧牙关做事，不是为自己想做做的事情做好，改变一些东西，实现梦想和愿望，不是为了跟这些吃饱了撑的给创业者泼冷水的笨蛋们较劲，但过程中随手就气死这些笨蛋，也是我们的宿命。\n\
    \n## 3. 我的演讲生涯中，最好的一次“提炼与升华”的案例\n\n这世上绝大多数普通人，都不会成为所谓“改变世界”的大事业家，这本来没什么。但成年后的挫折和失败，会使很多人因此变得非常虚无主义甚至堕落。为了尝试说好一点，他们在生存过程中也经常做一做缺德的事，并劝说自己这没什么，反正自己坚持信念、努力奋斗也改变不了世界，做点缺德的事儿，也改变不了世界，所以无所谓。\n\
    \n有感于这种观念的流行，我在2009年的一次高校演讲中，那时候我是做罗英语培训，在那次演讲中，我讲了我们如何一步一个脚印，如何通过努力与坚持，在一个被普遍认为必须漂漂亮亮才能赚到钱的行业里，干干净净地赚到了钱。\n\
    \n讲完了这一系列的故事之后，我在升华的部分，讲了一个朴素的道理，就是“每一个生命来到世间，都注定改变世界”。这是我这辈子演讲的所谓升华内容中，被转载转发最多、传播最广的一个，我把它的具体链接及文本附在这篇文章的后面，供你学习演讲时参考。\n\
    \n好，以上就是我们探讨的，关于讲故事的六个辅助元素中的最后一个元素：提炼和升华。我们用了好几天的时间，来探讨讲好一个故事的6个辅助元素。这些方法，只要你多加练习，它一定会起作用。但同时，你也一定要知道，而且很重要的一条是，你要真的相信。\n\
    \n罗永浩\n\n好，以上就是今天创业课的内容，欢迎你写下听完之后的感想留言，我们在留言区里一起交流。\n\n- “讲好故事的6个辅助性元素”系列：（点击即可查看）\n\
    \  - 第1篇：情节和篇幅+细节\n  - 第2篇：发言场合+构思要点\n  - 第3篇：要有魂\n\n## 附录：《每一个生命来到世间，都注定改变世界》\n\
    \n每一个年轻人都相信自己与众不同，相信自己的生命到世间要改变世界，充满了雄心壮志。但是到了二十多岁走进社会之后，尤其在中国，这个大环境相对不太健康的中国社会里，走进社会以后，很多人痛苦地发现，那些年轻时才华横溢、有热情，非常正直耿直的这些年轻人，从二十多岁混到三十多岁一事无成。\n\
    \n在中国，这是很常见的现象。你有能力、有才华、有热情，却一事无成，因为你不会圆滑处事，不会见人说人话，见鬼说鬼话，不会在领导面前拍马屁，不会在同事面前耍心眼，什么都不会。这样的结果是，你工作能力很强、很正直，到了30岁一事无成。\n\
    \n这些人痛苦地发现身边那些臭流氓，年纪轻轻十七八岁就活（得）特别圆滑世故的那帮小兔崽子，在社会上如鱼得水，见人说人话，见鬼说鬼话，见到领导那副德性，简直没法看，见到同事就又是另外一副嘴脸。处事处得很圆滑，到了30来岁都混的非常好，要钱有钱，要车有车，二奶有六个。\n\
    \n所以这些正直的年轻人到了30岁很彷徨，开始产生严重的自我怀疑，心想我到底在干嘛呢？于是他为了获得生存上的好处，决定跟着要流氓。所以这些人呢，不管是什么借口，最终选择了去做恶心（的）成人社会中的一个恶心的人，最可气的是他们之后还产生了幻觉，说这就是“成熟”。于是又过来毒害年轻人，跟他们说，你看，我年轻的时候也像你这样，现在我这叫成熟，你这叫幼稚。\n\
    \n这是成熟吗？我不觉得这是成熟，这是不要脸。我现在看到很多我的同龄人变成这样，很多人都是我小时候的好朋友，也曾经充满了理想，充满了美好的这些东西，然后相信自己可以改变世界，最后却变成了这种恶心的人。\n\
    \n我回家吃饭心情好就敷衍一下，有时候心情不好就忍不住当场戳穿他们。我说：“你看你们这帮兔崽子，年轻时候我们在一块儿聊，都说要改变世界，现在你，你改变个屁了。”然后他们就有点不好意思，说：“哎呀，行了，老罗，咱们那时候不是幼稚吗？谁能改变世界？谁也改变不了世界。”我就跟他们说：“你别客气了，你已经改变这个世界了，因为你变成了一个恶心的人，这个世界多了一个恶心的人，因此它变得恶心了一点点。”\n\
    \n你们听懂了吗？每一个生命来到世间，都注定改变世界，这是你的宿命，你别无选择。你要么把世界变得好一点，要么把世界变得坏一点。有些人不服气，说：“MD，我就不信了，我自杀。”你自杀也不行，你自杀就把这个世界的自杀率改变了一点点。\n\
    \n你如果走进社会，为了生存或是为了什么不要脸的理由，变成了一个恶心的成年人社会中的一员，那你就把这个世界变得恶心了一点点。如果你一生耿直，刚正不阿，没做任何恶心的事情，没有做任何对别人造成伤害的事情，一辈子拼了老命勉强把老婆、孩子、老娘，把身边的这些人照顾好了，没有成名，没有发财，没有成就伟大的事业，一生正直，最后梗着脖子到了七八十岁死掉了，你这一生是不是没有改变世界？你还是改变世界了，你把这个世界变得美好了一点点。因为你，这个世界又多了一个好人，听懂了吧？\n\
    \n每一个生命来到世间，都注定改变世界。所以将来有一天你心里挣扎，不知道要做一个流氓……还是做一个正直的人。你在这个中间彷徨的时候，希望你记得我今天给你讲的这句话：每一个生命都注定改变这个世界。\n\
    \n## 演讲中的吹牛艺术\n\n我们在演讲中提倡的，当然是第一种，也就是合理吹牛者。用得恰当的话，吹牛在演讲中是一个完全全全的加分项。\n\n华尔街日报上发过一篇爆（款）很好看的文章，标题是“什么时候吹牛是OK的？”文章中说，布朗大学的心理学家关于吹牛的一项研究结果表明，一般来说，如果在有理有据，无法反驳的情况下“吹牛”，人们会认为你虽然自负，但却能力出众；如果你对自己的成绩低调沉默，人们会认为你谦逊诚实，但能力有限。\n\
    \n一般来说，一个公开演讲者需要给受众造成的印象，常常是第一种。当然，如果你有自己的合理选择，也可以相应的做出选择。\n\n初学吹牛的演讲者，很容易犯的一个错，是吹牛的分寸感不好。演讲中的吹牛，虽然是加分项，但不一不小心吹爆了就不好了，那么如何防止吹牛吹爆呢？\n\
    \n美国作家Peggy Klaus写了一本有意思的书，书名叫做《避免牛皮吹爆的“吹牛”艺术》，在书中，她指出，为了避免牛皮吹爆，有一些注意事项，比如不能误导听众，要选择合适的时机，吹起来不能没完没了，以及切忌为了吹牛不惜撒谎等等。很可惜这本书目前还没有中文版，不排除稍后我们会找长期合作的出版机构引进这本书。如果引进了，也会第一时间在得到上推荐。\n\
    \n那么，到底如何吹牛？我们尝试简单总结一下。\n\n### 1. 吹牛要分场合\n\n和朋友们交谈的时候不要自夸；多年不见的老同学聚会的时候不要自夸；和别人初次约会或亲戚之间的饭局上不要自夸；过年回家，在亲戚之间的饭局上不要自夸；见女朋友家长时不要自夸……\n\
    \n总结下来就是，如果你在某些场合中，更想被他人喜欢，而不是被他人佩服或是印象深刻，那就尽量不要吹牛，这也是前面说过的布朗大学的心理实验的结论的一部分。\n\
    \n如果你的需求是反过来的，也就是说，在某些场合中，你更需要被他人佩服或是印象深刻，而不是更需要被他人喜欢，你就可以选择吹牛。下面就是一些适合自夸的场合：\n\
    \n- 参加选美比赛时，善于自夸，是加分项，评委更喜欢自信的选手；\n- 应（聘）时，适当的自夸几乎是必须的，虽然不能撒谎；\n- 面见投资人，无论是对自己还是对项（目），一定要自夸；\n\
    - 售卖自己的东西时，有（理）自夸；\n- 政治家如何演讲，简直是竞选活动中唯一的重要的课题；\n- 当然了，在公开演讲中，自夸通常也是好事。\n\n###\
    \ 2. 吹牛要考虑受众对象的特性\n\n面对一群观念开放的人，合理自夸是好事；面对一群观念保守的人，自夸就有可能不是好事。一定程度上，这解释了为什么那些成功成名的歌手，给一群而（大）想到大学生中演讲时，通常较少吹牛，而去到中学里演讲时，就兴致盎然地吹一会儿，这是非常合理的选（择）和安排：不是因为大学生好，而是因为大学生观念比中年人开放。\n\
    \n## 如何提出一个好问题？设计一个好的问题的方式都有哪些？\n\n### 1. 引发思考\n\n最常见的提问策略是引发观众的思考，这需要你去发现大家普遍感兴趣并且可以参与思考的问题。比如在锤子科技\
    \ T1 的发布会上，我们提到了一个问题：“单手操作的黄金尺寸究竟应该是多少？”这个问题每个人都可能会遇到，不管你是喜欢大屏幕手机的，还是小屏幕手机的，但可能大家都没有仔细想过，那么你来提出，就现场引发了思考。\n\
    \n再比如，我们在一场发布会的前期预热时，在微博上提出过这样一个问题：“为什么同样是中国南方工厂生产的皮包，贴上欧洲品牌之后就能卖几十倍甚至几十倍的价钱？”这个现象其实是大家都普遍观察到的，但你问出来，可能大家才会认真去想这个问题，他们也想知道这是为什么，就引发了好奇心、和随之而来的热烈讨论。\n\
    \n### 2. 传达理念\n\n提问的另一种策略是，以传达某种理念来为目的的来提问，你希望借助向观众传达的内容，并不包含在答案中，有时候甚至不需要你给出解答，观众看到你的问题本身，已经接收了你要传递的信息。我们看几个锤子科技发布会上的例子：\n\
    \n- “在一个完美主义者眼中，这是一个怎样的世界？”这个提问很明显的向观众传递了提问者对于自己的定位、追求完美以及对一个腐朽的旧世界的不满。\n- “智能手机在全球普及的伟大进程中，哪一个用户群体被我们遗忘了？”这个问题传达的是，我们非常重视广大的用户，同时也关注那些被这个时代忽略的特定用户群体，有些事儿纵然他们不管，那也交给我们吧。就使我们为他们做得更好，除了公众容易从企业身上观察到的那些，还有宝贵的人文关怀，这是我们的产品时坚持的理念。\n\
    \n当然，这个问题在详细解释清楚之前，观众一看到问题也会迅速展开思考：哦，那个被我们所遗忘的用户群体到底是谁啊？\n\n### 3. 假装不小心故意透露部分信息\n\
    \n为了发布会预热时，还有一项貌似严肃和忠诚、内藏灵萌和奸诈的提问手段，叫作“假装不小心故意透露部分信息”。也就是说，在预热期你想要透露一部分信息以引发讨论，但又故意不直说，采用提问的方式，把想要传达的信息假装隐藏在问题里，这会导致以为你不小心泄露了信息而他人刚好猜出来的人非常高兴，他们就会到处转发并宣布自己的发现。\n\
    \n比如，“是更快的快充，还是干脆忘了充电这回事？”这句话没有直说，但听众稍加推理就明白我们要在手机续航的时间上做生意了，而且成果貌似很牛、弄不好已经达到了让用户“忘了充电这回事”的程度了。\n\
    \n再比如，“同样是把硬件配置堆到头，卖用户体验的公司和卖配置的公司带给你的有什么不同？”这句话也同样没直说，而且貌似在讨论用户体验，但实际上已经透露了这款产品的硬件配置是顶尖的。\n\
    \n### 4. 营造悬念\n\n营造悬念这种提问方式，往往是先讲一个观众可能关心的现象，或者先公布一个观众可能关注的结果，观众知道这结果，却不知道为什么会这样的结果。\n\
    \n比如在坚果 Pro 的发布会上，我们问了这样一个问题：“过去的 3 年，手机芯片的速度快了 310%，为什么你手机做事的速度只快了 13%？”有一个零件、煞有介事地数字，这就是一些悬念，当你提出这样一个问题，观众就会全程聚精会神关注你揭示答案的过程。\n\
    \n### 5. 装 X\n\n最后一个要讲的提问方法，是以装 X 的姿态来提问。有些问题甚至一看就是假装提问。但是给品牌形象带pose、纯装X、一个非常降格或风趣的装X模式，对观众产生巨大的感染力、甚至直接能提升你的品牌调性。我们来看其中几个例子：\n\
    \n- 严重受限于相同的工业标准、戴着镣铐跳舞的正匠如何用不一样的温度细节让你在黑暗中得到惊喜？\n\n这个问答术特别像抒情诗一样的问题，虽然蕴含着对我们产品的一个新特性，但本质上主要还是装\
    \ X。\n\n下面的这个也是一样，虽然隐含了我们产品的一个新特性，但本质上主要还是装 X。\n\n- 圆滑当道的时代，驱动一个团队保持锋芒与锐利的，究竟是无所谓的固执，还是理智的坚持？\n\
    \n至于下面最后一个，则是百分之百的纯装 X，而且装得非常高雅，虽然形式上是严肃的提问。\n\n- 患有不可救药的工匠情结的创业者们，在浮躁的时代如何取舍和自处？\n\
    \n好，关于装x的更多科学运用，我们会在后续的课程中专门提及。\n\n那么，提问题时有哪些注意事项呢？要学会跟观众换位思考，否则只有冷场和尴尬。\n\n这种情况的尴尬程度，不亚于一个相声演员费尽心机地铺垫了20分钟，最后抖出来的却是一个全国人民都听过的老包袱。\n\
    \n- “你知道我们的手机有几种颜色吗？”\n- “大家说说我们应该卖多少钱啊？”\n\n显然就属于这种糟糕的问题。无论观众猜对还是猜错，都毫无意义。这种问题的实质是以戏弄观众的形式来达到廉价的、蹩脚的互动效果。\n\
    \n## 今日得到\n\n- 1. 演讲中提问能够抓住用户的注意力，触发他们去发现问题，启发观众思考，带着他们一起寻找答案，从而使他们产生成就感和愉悦；\n\
    - 2. 5种设计一个好的问题的方式：引发思考、传达理念、假装不小心故意透露部分信息、营造悬念、装x；\n- 3. 演讲中的提问需要注意3个问题：不要提那些你自己很关心，但受众可能完全不会关心的问题；不要故作神秘或洋洋得意地问一个大家都知道答案的问题；不要用拙劣的提问来戏弄观众。\n\
    \n罗永浩\n\n好，以上就是今天创业课的内容。欢迎你写下听完之后的感想留言，我们在留言区里一起交流。明天见。\n\n## 老罗新语录\n\n![](img/3f2553c19e3d8036724ac589070714e0_92_0.png)\n\
    \n> 一个创业者如果只是简单地陈述自己干了些什么，这些辛苦成果的魅力将大打折扣。如果以一个问题的形式，引导观众一起思考、解决，就会让消费者产生一种参与其中的成就感，并从中获得愉悦的体验。\n\
    \n## 创业问答\n\n### 关于市场调查\n\n但从另一个角度，乔布斯决定做革命性的手机之前，一定会看手机的市场调查数据，看看美国和全球一年手机能卖出多少台手机，看看大家在手机上使用上的需求和痛点是什么，手机除了是手机当时的那种形态，它还可以是什么样子等等。做这种革命性的手机之后，即便它卖得非常好，好得要命，乔布斯也会继续看市场调研数据，看大家最满意的是iPhone\
    \ 的哪几个方面，最不满意iPhone 的哪些方面，然后根据这些相应地做出调整。就像福特造汽车之前，也会看看城市交通工具的需求量是多少，比如纽约一年能卖出去多少辆马车之类的。如果开售之后，会去看消费者的满意度和吐槽率之类的调研结果。\n\
    \n所以，所谓的不做市场调查，是指这方面不需要做调研，做了也得不到有价值的意见和反馈。但除此之外，...\n\n### 2. 为什么不挣钱的项目能融到钱？\n\
    \n有些项目，外行人看来完全不挣钱，比如共享篮球，为什么还能融到大笔的投资呢？\n\n共享篮球我没研究过，不便乱讲。但给大家造成这类感受的事情其实还是很多的，大家总说，某某项目显然是如此的靠谱，为什么还能融到那么多钱？常见的原因无非是这样：\n\
    \n- 1. 有些项目的商业逻辑比较复杂，难于理解，所以只有一小撮投资者能看懂。大家看着的这些项目看起来起来的现象，没有看懂在在东西的早期，就会因此产生误会。\n\
    - 2. 有些项目因为项目本身以外的某种原因，拿到了某个明星机构的投资，就会有一群无头苍蝇里的投资者跟进，特别是在这些项目的早期，因为跟投的风险很低。\n\
    - 3. 有些项目处在某个大的风口方向上，这时候，会被提到该风口上的好项目上的投资者，会补偿性地投些一二类项目的二三类项目，甚至是把项目拿来赌自己没错过风口。顺说一下，有些投资人是真傻，其实是装傻。年纪绝高的都是，风险资本家个个都是绝对的精英，都是人中龙凤，都是揣着大把钞票并且教养良好的高学历海归财神爷，其实他们多数都是帮财神爷打手的投资经理。跟绝大绝大多数社会类的群体或组织一样，都是百分之二十的精英带着百分之八十的平庸者往前奔。\n\
    - 4. 共享篮球我不清楚，但很多统计数据表明，中国的创业公司宣布自己融到了多少钱的时候，大多数都是水分有的。很少像锤子科技这样，老实到让了解真相的人都感到心疼的创业公司。\n\
    \n### 3. 创业以后还会回公司上班吗？\n\n是不是自己创业了，无论结果如何，都很难再回公司上班了？\n\n倒也不至于，创业公司三年内倒闭的几率是百分之九十左右，但从二次、三次创业的人却没有那么多。那些人都到哪里去了呢？肯（定）还是上班去了，就不甘心的。\n\
    \n但同时，很多创业过的人也确实深刻的感受到，创业这东西，就像抽烟或吸毒品，要真正戒掉是非常困难的。就算被迫戒掉了，但总有复吸的机会，还是合（不）蠢过程，心痒难（忍/吸）。所以最好想办法，创业不管多艰难，咬牙坚持，不要放弃，就过去了就好了，免得将来天天都是找人交战（交钱？）。\n\
    \n### 4. 该不该倾囊相授培养新人？\n\n倾囊相授地培养了一位新人，可对方学到东西就要走人，该怎么办？难道下次面对新人，还要刻意保留？非常纠结。\n\
    \n不至于吧，21世纪了，大家能有什么独门秘笈，到了要刻意保留，传子不传女的程度上，我想无非就是以下几种情况和对应思路吧：\n\n- 1. 如果这种情况偶尔发生，我倒意是，不至于因此就不教新人了。如果不教新人，你时间不够用又事事亲力亲为，累死了也是很难省自己。如果是复制（频繁）发生，就可以考虑推给自己了。为什么倾囊相授的人总也留不住？是不是自己待人的方式有问题之类似的。\n\
    - 2. 对方狼心狗肺，天性凉薄，人品有严重问题等等，但一般说来，这是小概率事件，不至于因此就不教新人了，因噎废食，因小失大，都是不明智的做法。\n- 3.\
    \ 对方有某种不得的难处才被迫走，所以看起来就像是“学到东西就要走人”，但其实有可以理解的原因。亚洲人辞职的时候，很少会对公司说真正的辞职原因，所以也不能强求对方告知真正的原因，只能互相理解理解。\n\
    \n最后，我以前也讲过类似的内容，我再次再喂一遍，那就是，留不住人才，一定要留点香火情，千万不要因为留不住而恼羞成怒，撕破脸皮，说伤感情话之类。锤子科技创业五年，有些过程中留不住的优者，又重回来发挥重要甚至关键作用的，有好几个。创业者的心胸和度量，要能撑船，能撑航母，能开无人驾驶汽车，不能自己带出来的徒弟伤（害？）。\n\
    \n## 延伸阅读\n\n- 《第1课，空公司怎么会有意义呢关注和接纳人才？》（点击查看）\n\n## 今日得到\n\n- 1. 划时代需求的产品通常都不是市场调研得出的意见和反馈，但是正常的企业经营和运作，很大程度上，还是需要靠谱的市场调查报告和数据来指导工作的。\n\
    - 2. 有的项目因为商业逻辑复杂只有投资人能看懂，有的则是因为投资人出现成本低或者水平有限，所以会出资看起来不挣钱的项目却能投到投资。\n- 3. 创业者要有心胸和度量对待自己倾囊相授培养过的人才的离开。\n\
    \n罗永浩： 好，谢谢这几位同学的提问，如果你在创业中有什么困惑，或者你有什么和我分享的，都欢迎在留言区留言给我。我是罗永浩，感谢把我的创业课分享给你的朋友，我们明天见。\n"
