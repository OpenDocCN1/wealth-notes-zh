    招聘有一定工作经验的员工时，发现某些有潜力的人才，但对方自持过高，要价和当前能力不匹配。虽然我认为天分上来讲，两年后他一定可以达到岗位要求相应的能力要求。但是我们是否该以未来的能力预期来给相应的薪资来留下他呢？


    每个问题可能没有一个唯一正确的答案，每个企业的创始人可能会有自己的判断和做法。以我个人为例，如果对对方有潜力，但是自持过高，要价不匹配，这样的话我决定要不要录取这个人的依据是：


    如果有可替代性，并且那个人又自持过高的，那么问题就变得非常简单；如果他在特定的岗位上是很难替代的，甚至是不可替代的时候，我会忍受一切的不舒服、打击、折磨、摧残，包括资损上我也可能会去。我相信，给大多数理性的企业负责人都会采用这个方式。


    > 老罗，对于一些工作能力比较强，但是比较散漫，对规章制度不屑一顾的人该怎么管理？作为企业管理者或者部门主管面对不同性格的人应该怎样处理或者管理，能举几个例子？


    工作能力，比较散漫，对规章制度不屑一顾的人，在我们公司其实是很多的。但你要看


    如果他在创意工作岗位，这件事其实就没那么严重，因为他在一个不太依赖协同工作的工作岗位。在这些岗位上，如果对规章制度不屑一顾，但是，他没有给同事造成非常明确和不公的对待和伤害，我通常都会容忍。而且，我觉得没有必要去纠正他们，因为每个人的能力优势的一面必然伴随着一个优势能力的负面作用，那个负面作用常常就是负面的。所以，我不觉得在这些岗位上是一个问题。


    反而是一些创业者做了老板以后，由于他有很强的控制欲望，所以他总忍受自己手下没这种人的存在， 所以就不太愿意地对一些不需要锻炼这种能力的岗位的人有这方面的要求，这是完全不可取的。


    从另一个角度，如果他做的都和规章制度是非常强相关的话，那么也没有什么好办法，只能去批评、教育、说服、改造。


    所以，我自己处理这些事情的时候，可能付出了很多努力，但是没有有什么特别不同于别人的技巧和方法。


    还有一个，我想补充关于工作能力特别强，但是比较散漫，对规章制度不屑一顾的人的管理方法。


    这些人你可以给他很高的薪水，给他很高的认可和尊重，甚至是一些荣誉制度。但是，一定要不要给他们管理角色，这是早期创业者很容易犯的逻辑。比如，手底下有几个“大功臣”，他们在早期创业过程中立下了汗马功劳，以至于要拿奖金、股份、期权已经不足以给他们回报。然后你会在发展阶段中给他一些title，然后让他去管理别人，这是非常可怕的。


    一定不要给一个对公司有重大贡献的人一个管理职位这件事理解成是奖励，这是完全不对的。这是一个工作性质，不是奖励。所以千万不能给那些需要、不适合做管理的给管理的位置。


    但这个问题很多人都会犯，我自己也犯过。而且这个犯了纠正很难。


    在亚洲文化里，这个职位“能上能下”是极端难实现的，极个别的企业可以实现，但绝大多数做不到。所以当你尝试把不适合管理的人放到管理层上，上就会招致错，员工去训斥他管理的时候，他会发现重重地扯到了他的尊严和面子问题，导致这个事无论怎么处理，他可能都会走掉。


