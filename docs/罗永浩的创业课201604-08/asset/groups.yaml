    搭建结束后，所有需要在发布会上演讲或登台参与仪式的公司管理层和所有相关人员，包括邀请的主持人，都要去现场彩排。


    如果时间允许，能走两三遍当然更好。至于需要在发布会上做主要演讲的人，彩排个七八遍也不过分。很多事件型的发布会，走完好让媒体感觉产品就算完成的任务了。但如果是消费类，产品或服务的发布会，给现场观众和媒体造成良好印象是至重要的，在这种情下，充分的彩排是绝对必要的。


    ## 3. 现场时工作人员的培训


    如果是规模较大的发布会，现场会有很多引导观众入座或是解答疑问的临时工作场然很场馆方有代为安排募集招，但我们多年的经验是，企业


    现场观众遭遇态度恶劣的或不耐心或是不足够友善的工作人员，一定会对举办发布会的企业产生不良印象。


    ## 4. 发布会当天的整个流程


    - 开场前嘉宾签到，媒体签到，必要时也可以做一个在背景墙上签字并合影留念的环节。但这个环节，通常在现场来很多在社会上有知名或影响力的人物时才会采用，否则会显得有些怪。

    - 主持人开场并介绍整个发布会流程。如果事先有制作烘托气氛的开场宣传片，效果会比较好，至少一个尝试烘托气氛的宣传片，会让现场来的人尝试去配合。如果没有这样的宣传片，则也需要专业的主持人开讲一些适当幽默的开场内容来烘托气氛。如果发布会邀请到了有分量的嘉宾，企业通常会自己主持人开场点到他们的名，以示自己有关系，有影响力，有朋友，有实力等等。


    需要说明的是，以上的流程都是企业发布会的常规合理流程，如果你的企业有一些明显不同于其他企业的地方，使得上述流程可以变得没有必要，当然完全可以按照自身的点来相应安排。比如锤子科技的发布会，就从来没有上述的流程。


    接下来是企业负责人或高管的主题演讲，通常这是发布会活动最重要的主菜，一定要要讲准备，认真排练。职业的演讲者，会为一个小时的演讲准备一百个小时，企业负责人没有那么多时间，或者说这件事对该企业没有那重要，通常情况下也得准备十几二十个小时的时间。除非是天才，否则企业负责人看起来从容淡定，气利索的，挥洒自如的，在观众和体面前为企业严肃加分的演讲，都是花了大气认真准备，反复排练的最终结果。


    顺便说一下，这些年，整个商业世界都受了乔布斯的点，一窝蜂地由企业始人或CEO站出来做产品发布会的主题演讲。包括很多完全不具备正常人演讲能力，甚至普通话比外语还难懂的CEO。其实这是完全没有必要的，如果CEO能够讲当然好，如果CEO做不到不脱，安排企业里外形好，口才佳的高管讲话也是没有问题的，如果该高管是CMO或市场总经之类，就更合适不过了。


    无论是创公司请来重量级公司的负责人站台帮场，还是公司CEO来重量级战略合作伙伴推捧，让这种商业领域的重要人物上台几句话，对发布会起拉动本的效果一定是加分的。只是安排这类环节时，得得对方过于随意的发挥导致现场效果出现意外或尴尬。


    无论如何，来自企业负责人的演讲本身是内容效果最好，如做不到，播放个事先准备好的高质量视频也可以，实在不行，做一个戏剧性的仪式高潮设计法。比如，所谓在百度图片就是搜索的一种做法，你可以在度图片里输“发布会”和“启动仪式”两个关键词搜看，看看了不要笑，记得我们前面说过的：人类需要仪式。


    最后，管你是真的还是虚伪的（当然，真的永远更有力量），技术上，比如，你这会主题，是去赚外国人的钱，升华的果是：“我们要把民族产业和民族牌走向国际化”，听起来很好吧？再比如，你的企业在城镇的业绩已经接近饱和，很多人不增长，于是决定赚乡下人的钱，升华的果是：“我们要服务好被科技和产业遗忘的六亿同胞”，大概是这一类感觉。


    如果是事件型的发布会，活动结束请媒体发稿就差不多了，这类事件会一段时。如果是消费类发布，发布会的结束，意味着市场公共和销售部长达半年到一年的长征才刚开始。


