    ## 2. 我的学习驱动力来自于“幼态持续”


    但是，在少数人身上保持了一种不太正常的现象—幼态持续。幼态持续并不必然带来好的结果，有的人的幼态持续是终身很幼稚，才理学龄很低；还有一种比较幸运的，就是我或老黄这种，虽然已经近五十岁的将领，但是，在学习新的东西，尝试新的领域这些事上，旺盛的那个好奇心还跟小时候很像。因为，小孩子才会不停地问为什么，后来就有本书叫《十万个为什么》。


    幼态持续带来的好处是：我们去学习新的领域、新的知识的时候，很多牵动做好奇心驱使，而且过程中的多巴胺分泌和激励，也就是生物学上的奖励机制和回报都是非常可观的。所以不如年就就学更多的东西。


    ## 3. 呵护你的宝贵的好奇心


    所以，如果你够幸运我们一样是到了一个年纪以后，仍然对学东西兴致勃勃的人，千万不要被边上那些所谓主流的意见所打击，去抑制你的好奇心。好奇心本身是好事。


    ## 4. 创业之后时间特别少，我最主要的学习方式是什么？


    坦率地说，我在技能方面的学习绝大多数都是从书本上得来的。这个要从两个角度讲：


    - 第一，有一些我自己操心和主持工作的业务部门，我在我身边不太有机会找到比我在这业务上更强的人，我主要的方式还是靠读书。创业再忙再累，有一些书还是要读的，就是定长期计划。只不过比较有趣的地方可能是2012年到今天看的基本都是商业书籍。

    - 第二，请合伙人和同事分享内容知识。


    但是，因为公司走到今天五年了，我们也来了一些非常有实力的合伙人和高级主管。在他们擅长的业务领域里，其实我已经能从身边的同事身上学到很多特别牛的知识，这是熬到了一个时间点发生的变化。


    所以，如果问这个问题的一个年轻人，可能你还需要有很长时间才能熬到那个点。到了那个时候，你原来读读书获取这些个资讯，其实从整体上同时你身边多了一些资源，其实从整体上感觉上是比以前更轻松能获得更好的营养了。


