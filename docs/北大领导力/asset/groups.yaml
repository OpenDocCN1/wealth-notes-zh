    +   1、领导就是掌握更多资源的人，我们应该把领导的资源用好、用足，帮助我们更好地达成经营目标

    2、“谁被孩子累着了谁就更疼孩子”，让领导更多地参与你的工作，其实也是建立好的关系的重要方法之一。他越了解你的工作，特别是工作难度，他越能看到你的努力，理解你的不容易。

    3、“用好”领导的关键是你自己已经做了非常大的努力，在你的能力和资源范围内已经无法或很难解决问题了，而领导恰好掌握这样的资源和能力，要给领导出有难度可解决的问题，不要真的给领导“出难题”。


    # 15讲：伟大老师的三个动作


    15讲：伟大老师的三个动作


    你好，我是刘润，这是领导力课程的第十五讲。从这一讲开始，我们进入一项新的领导力修炼：当老师。我要强调这样一个观点：领导者的主要角色是老师，而且，当老师要做好三件事情。


    我说领导者要当老师，这是一个比喻。这说明领导者应该要做什么事？最容易想到的，当然是教导。老师这个角色，就意味着教导这个动作。许多人已经有了这个意识，说是在工作中，我要教导我的下属。今天我要强调，伟大的老师不只是教导。伟大的老师有三个动作，要同时做好这三件事。伟大的领导者，也要同时做好这三件事。


    那么，除了教导，另外两件事是什么？


    ## 1.领导者的角色


    在回答这个问题之前，我先问你一个问题：除了我刚才说的领导者是老师，你想一想，领导者还可以是什么角色？如果觉得这个问题太大了，产生的可能性太多，那我把这个问题变得更具体一些：如果把你所在的组织比喻为一艘船，领导者的角色是什么？


    这个问题很重要，我再重复一遍：如果组织是一艘船，领导者的角色是什么？


    你可能会想，这个问题太容易了。如果组织是一艘船，那么领导者是船长，或者是舵手。船长和舵手，这是最容易想到的两个答案。我要提醒你一下，如果这是个非常重要的问题，那么答案不会是那么显而易见的。


    ## 2.设计与教导


    彼得·圣吉说领导者的角色首先是设计师，这是一个特别厉害的观点。具体设计什么呢？彼得·圣吉说了三个方面。


    +   1. 要设计组织的目的，也就是组织“为什么”干事；

    2. 要设计组织的运作流程，也就是组织“怎么”干事；

    3. 要设计组织的学习流程，也就是怎么让大家学会前面两点。


    ## 3.领导者是仆人


    我说伟大的老师需要做三个动作，我已经讲了两个，第一是设计，第二是教导，现在该说第三个了。我说的这三个动作，其实出处都是彼得·圣吉，只不过他说的是领导者有三个角色。第一是设计师，对应的动作就是设计。第二是老师，对应的动作是教导。


    ## 4.领导者就是当老师


    # 总结：


    +   1.彼得·圣吉说，领导者有三个角色：设计师、老师和仆人。

    2.领导者最主要的角色是老师。角色合成一个，要做的事情依然是三件。伟大的老师、伟大的领导者也要做三件事：设计、教导、服务。


    # 总结：


    # 划重点


    +   1. 彼得·圣吉说，领导者有三个角色：设计师、老师和仆人。

    \n2. 领导者最主要的角色是老师。角色合成一个，要做的事情依然是三件。伟大的老师、伟大的领导者要做三件事：设计、教导、服务。


    最后，我给你留两个思考题：


    第一，领导者是老师，这个观点还给你什么启发？第二，对领导者的角色还有哪些比喻，曾经给你留下过很深的印象？

