    对应的领导力结果：讲故事


    应用要点：讲故事比讲道理更能动员群众。领导者要讲四种领导力故事：我是谁，我们是谁，我们向何处去，我们为什么要变革。


    好，我是刘润，这是领导力课程的第十四讲，我们下一讲《领导者的主要角色是老师》再见。


    # 刘润·北大领导力30讲

    十句口诀，成为解决难题的高手


    # 留言精选


    触顶人 8

    想起在上大学的时候，因为是军校嘛，伙食费不用自己掏钱，所以经常有人混费粮食，好好吃没浪费两口就扔了，有甚至没吃就扔进水桶里。学校很尴尬，用各种机会教育我们要惜粮食，不过大家都不太当回事儿。后来有一次中午开饭的时候，我们的院长带好几个从干部走进餐厅，来到泔水桶前，一个掀起一个馒头，当场吃掉了，然后说：“这些粮食都是人民给的，希望我们都能爱惜。”一下就把大家给镇住了，从那以后大家都对爱惜粮食这件事儿特别上心。


    # 加餐01讲：追随力的三个要点


    加餐01讲：追随力的三个要点


    你好，我是刘润，这是领导力课程的第一次加餐，我重申讲一下追随力。为什么要讲追随力？因为你们给我的课程的留言，我每一条都看过。你们的留言告诉我，我需要给你们讲一讲追随力。


    听起来，追随力有点像领导力的反义词。其实不是。追随力是一种特殊的领导力。追随力是站在追随者的角度发挥领导力。


    你现在已经知道了，不是每个上级都有领导力。同样，不是每个下级都有追随力。追随力很重要，我们每个人都需要追随力。你需要发挥追随力的场景，很可能比需要你发挥领导力的场景还要多。


    今天，我给你讲追随力的三个要点：第一，委婉地唱反调。第二，积极地唱反调。第三，向上建立关系。


    ## 1.追随力：动员领导解决问题


    我在第十讲，讲了领导者要有大格局，要能够容忍唱反调的人，甚至培养唱反调的人。在这一讲后面有好多很相似的学员留言，说自己就是一个唱反调的人，但是结局却很悲惨。


    比如，一个叫“方中海”的同学留言说：“为公司服务两年多，一次和老板开会，激动之处指出了公司一些问题。第二天老板扬言要开除我！”


    还有一个叫“崔妹”的同学留言说：“前几年我经常唱反调，结果就是一直被当作异类。”


    还有一个叫“陈阳洁”的同学留言说：“我就是经常唱反调的人！所以不是被公司开除，就是得罪一大片！”


    这样的留言还有好几条，我就不一一列举了。


    我想对这些同学说两句话。第一句：你的上级需要提升领导力。第二句：你自己还需提升追随力。我现在不是面对你的上级，而是面对你，所以我就给你谈谈追随力。


    什么是追随力？之前，我给领导力下过一个定义，叫做：动员群众解决问题。现在，我给追随力下一个定义，你猜什么？说不定你猜到了，追随力就是：动员领导解决问题。


    我再说一遍，追随力是动员领导解决问题。它跟领导力的定义并不矛盾，实际上，追随力是领导力的一种特殊形式。领导力是动员群众解决问题，这里的群众是泛指，就是其他人、很多人之意。有时候，为了解决难题，你首先要一个人或者少数几个人，但是很特殊，你要动员的是你的上级，你就变成了“动员领导解决问题”了。你需要站在追随者的角度来发挥领导力，这个时候，追随力是领导力的一种特殊形式。


    在一个组织当中，就算你是一个所谓领导，你上面往往还有更大的领导，所以追随力应该是你的必修课。遗憾的是，没有学校开设这门必修课。关于领导力的研究很多，关于追随力的研究很少很少。


    ## 2.委婉地唱反调


    如果我开追随力这门课，一个中心内容就是：如何委婉地唱反调。追随力的一个要点，就是委婉地唱反调。


    在现实生活中，跟上级唱反调，大多数时候的结局都不会太好，为什么？这里面当然有上级的问题，但是，很可能还有一个原因，就是你唱反调的姿势不对。


    唱反调的主要姿势，就是要委婉。怎么才能委婉呢？方法之一，就是避免当众唱反调。


    有个叫“天籁斋语”的同学，他说自己经常唱反调，但是唱得很成功。为什么呢？他是这样说的：“在决策时我如果有不同意见，觉得老板有不妥就会说出来，说明理由，并指明方向，然后共同讨论，老板都很接受我的意见。但是我不会在众股东面前提出异议，而是单独以商讨或进谏方式提出。”你看，不要当着大家说，而是私下里悄悄说，你给老板留了面子，老板就更可能接受你的意见。


    委婉地唱反调，还有一个方法，我把它叫做“为难式唱反调”。我给你举一个我亲身经历的“为难式唱反调”的例子。负责这门领导力课程的得到的主编，叫陆音，他负责看我的稿子，提意见。不止一次，他跟我说，刘老师，你这篇稿子写得太完美了，要提意见真是太为难了。如果你一定要我鸡蛋里挑骨头的话，那么，你可以改以下18个地方……我说18个，是夸张了，陆音没有说那么多，我是想告诉你，他绝对不是因为提不出来意见而为难，他表现出来为难，是为了让我更容易接受他的意见。当你要对你的上级唱反调的时候，你可以考虑“为难式唱反调”。


    委婉地唱反调，我刚才讲了两个方法，一是避免公开唱反调，二是“为难式唱反调”，简单地说，就是先赞美，然后表现出来很为难的样子唱反调。


    委婉地唱反调还有第三个方法，可以叫做“借力唱反调”。站在追随者的角度发挥领导力，明显有个不利因素，就是你对上级没有职位权力，而且反过来，他对你有职位权力。这时候，如果你要唱反调，你可以考虑借力，求助于那些权力更大的人。


    我刚才讲到，课程主编陆音在对我发挥了追随力，使用了“为难式唱反调”。陆音不只会一招，他还用过“借力唱反调”。有一次，他觉得有一说的内容必须要大改。他是怎么做的呢？他说，哎呀，这一讲我拿不准，祁颖，你能不能看一看，给刘老师提提意见？祁颖是他的上级，他求助于他的上级，让他的上级跟我谈。


    我之前讲过遵义会议的案例，毛泽东在遵义会议上唱了反调，但是他首先不是自己站出来，而是让地位比他高的张闻天站了出来，毛泽东也是“借力唱反调”。


    所以，当你想要对总经理唱反调的时候，你先想一想，有没有可能借助于副总经理去唱反调？


    我刚才讲了委婉地唱反调的三种方法，避免公开唱反调，为难式唱反调，还有借力式唱反调。委婉地唱反调，是追随力的一个要点，但并不是唯一的要点。


    ## 3.积极地唱反调


    我之前讲过，追随者的态度可以从两个维度来看，是否独立思考，还有是否积极参与。积极参与这个维度，要求你的反调是积极的。追随力的第二个要点，就是要积极地唱反调。


    怎么积极地唱反调呢？我也讲三个方法。


    第一个方法，就是反调中要有建设性的内容。你不能只说上级方案不行，你得尽量提出你觉得行的方案。有个叫“小小鸟”的同学在留言中说了这么一句话：“不接受批评，只接受建设性意见。”这句话就非常好。你如果只是提出批评，没有提出建设性意见的话，上级是很难以接受的。


    第二个方法，就是在决策前唱反调，而不是在决策后唱反调。这一点，很多同学在留言中都提到了。有个叫“佛教门徒”的同学留言比较早，我就引用一下他的说法。他是这样说的：“发表不同意见的时机应该主要在决策形成前，一旦形成决策，首先确保执行。”你如果有意见，决策前不说，决策后再说，那可以说是发牢骚，可以说是拆台，总之，绝对不是积极地唱反调。


    我刚才讲了积极地唱反调的两个方法，第一，要有建设性的内容，第二，要在决策前提出出来。


    现在我讲积极地唱反调的第三个方法，在参与的前提下唱反调。有个叫“离河”的同学在留言中说：“作为员工，唱反调需要以自己的肩膀为尺度，能担多大责唱多高的反调。这样不管被否定，至少不会被当做无理取闹。”这个同学说得真好。你唱反调所针对的事情，一定是在你的参与范围之内的，至少是你跳一跳可以够得着的。而且，你不只是动动嘴皮子，你已经准备好了承担责任，你准备好了挺身而出，对上级说：“我来！”


    我刚才讲了积极地唱反调的三个方法：要有建设性的内容，要在决策前提出出来，要以参与为前提。积极地唱反调，是追随力的第二个要点。


    ## 4.向上建立关系


    下面，我讲追随力的第三个要点：向上建立关系。


    我在第九讲讲过了，领导力是一种关系。我新提出追随力，是一种特殊形式的领导力。尽管形式特殊，但是本质不变，追随力也是一种关系。既然是关系，你在行动的时候，就要考虑到另一方的情况。这一点，不只一个同学在留言中涉及了。他们指出，你是不同唱反调，怎么唱反调，需要考虑你所在的公司，面对的是什么样的上级。


    还有一点，好像还没有人在留言中提到过。我讲过，关系分为交易型关系和变革型关系，我们可以从交易型关系出发，来建立变革型关系。这一点，同样适用于追随力。你想要以追随者的身份领导你的上级进行变革吗？先和他建立良好的交易型关系。你看，如果你把追随力看做领导力的一种特殊形式，我们讲过的领导力的内容，你都可以套用到追随力上面，你多了很多新的看待问题的角度。不仅如此，你还多了很多解决问题的办法。


    还有一点，好像还没有人在留言中提到过。我讲过，关系分为交易型关系和变革型关系，我们可以从交易型关系出发，来建立变革型关系。这一点，同样适用于追随力。你想要以追随者的身份领导你的上级进行变革吗？先和他建立良好的交易型关系。你看，如果你把追随力看做领导力的一种特殊形式，我们讲过的领导力的内容，你都可以套用到追随力上面，你多了很多新的看待问题的角度。不仅如此，你还多了很多解决问题的办法。


    # 总结：


    # 划重点


    追随力是动员领导解决难题，是站在追随者的角度发挥领导力。

    追随力第一个要点：委婉地唱反调，具体方法：避免公开唱反调、为难式唱反调、借力式唱反调。

    追随力第二个要点：积极地唱反调，具体方法：有建设性的内容、在决策前提出、以参与为前提。

    追随力第三个要点：向上建立关系，用关系的眼光看待追随力，面对不同的上级，唱不唱、怎么唱，应该有不同的做法。你可以从交易型关系出发，来建立跟上级的变革型关系。


    刘润


    最后，我要感谢我前面提到的留言的同学。他们是：万中海、崔妹、陈阳洁、 天籁斋语、小小鸟、佛教门徒、离河。我要感谢所有其他留言的同学。没有你们的反馈，就没有这一讲的内容。


    最后的最后，我还是留一个思考题给你：

    追随力还应该有哪些内容？你对追随力上有什么心得？

    欢迎你继续留言分享。


