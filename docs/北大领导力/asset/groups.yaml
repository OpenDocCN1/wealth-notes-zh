    上一讲讲决策思考，我说要问为什么，找到问题背后的根本原因。这一讲讲系统思考，我也说问为什么，不过不是找原因为，而是要找到系统的目标，这是系统思考的起点。


    决策思考的“为什么”是找原因，我们可以称之为第一种为什么。系统思考的为什么是找目标，我们可以称之为第二种为什么。第三个石匠就是问了第二种为什么：我们为什么要采石头？他找到答案，是为了建造一座大教堂。那么，一切行动都要服从这个系统目标。


    ## 总结：


    划重点


    我用三个石匠这个“史上最短管理案例”，讲了系统思考的三个要点：1.整体大于部分之和；2.要在整体中理解部分；3.对部分的最好优化对整体不一定有利。怎么培养自己系统思考的能力？问第二种为什么。第一种为什么是找问题原因，第二种为什么是找系统目标。


    最后，我给你留一个思考题和一个行动题。思考题是这样的：你可能知道，华为发生过一个很著名的故事。一个新员工，到华为不久，给任正非上了一封万言书，大谈华为的跨路问题。据说任正非的批示是如果这个人有病，建议送医院治疗，如果没病，建议辞退。有人可能会觉得，这个人跟第三个石匠很像啊。请问，华为公司这个新员工和第三个石匠，他们到底像还是不像？现在我行动题：请你用系统思考的深思方式，分析一下你现在面临的一个实际问题。


    好，我是刘澜，这是领导力课程的第26讲，我们下次再见。


