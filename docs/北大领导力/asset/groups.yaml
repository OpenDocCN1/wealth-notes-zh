    # 25讲：领导者做决策，而非做决定


    25讲：领导者做决策，而非做决...


    你好，我是刘润，这是领导力课程的第二十五讲。从这一讲开始，我们进入一新的领导力修纾——深思。领导力是动员群众解决难题，领导者面对的是难题，要发现难题的解决方案，领导者必须要深思。


    我会给你讲四种深思的模式，这一讲先讲第一种：决策思考。什么叫决策思考？简单地说，就是做决策，而不是做决定。很多人觉得决策和决定是一回事，但是优秀的领导者知道，决策和决定是完全不同的两回事。


    从阿里巴巴出来一个高管写过一篇文章，说马云一年最多为阿里巴巴做四个决定。这个高管这么写，就说明他和马云之间还是有差距的。他没有理解到，马云不是一年只做四个“决定”—马云是一年只做四个“决策”。


    # 1.决策与决定的区别


    很多人觉得决定和决策没有区别，那可能是受到了英文的影响。决策和决定，在英文中对应的是同一个词：decision。但是，这两个词在中文里意思不一样的。你其实能够感觉到它们是不一样的。


    比如，你可能说：我做了一个决定，今天听完这一讲课程，我要进行一次留言分享。但是，你很可能不会说：我做了一个决策，今天听完这一讲课程，我要进行一次留言分享。你的直觉告诉你，这是一个决定，不是一个决策，尽管你不一定能够明确地说出来，决定和决策的区别在哪里。


    我现在明确地告诉你，决定和决策的区别在哪里。决定是针对个别问题的个性性解决方案，而决策是针对普遍问题的一般性解决方案。也就是说，你做一个决定，只针对一个问题。你的决定如果有效的话，你可以一次解决一个问题。做决策跟做决定不一样，你面对的可能只是一个问题，但是你做一个决策，就不只是针对这一问题，而是针对所有类似的问题。你的决策如果有效的话，你可以一次解决很多问题。


    # 2.案例：小马里奥特


    下面我给你讲一个小案例。听了这个小案例，你会更明白，为什么卓越的领导者只做很少的决策。


    # 3.怎么做决策


    做决策要求你在更高的层次上分析问题。管理大师彼得·圣吉说过，领导者要在三个层次上界定现实。第一个层次是事件的层次，就是发生了什么事。第二个层次是行为模式的层次，就是发生的事件，是不是显出来某种反复发生的行为模式。第三个层次是系统结构的层次，就是反复出现的这个行为模式，是不是系统结构所导致的。


    # 4.领导力口诀：“为什么？”


    你还可以用一句口诀，来帮助你做决策。这句口诀只有三个字，就是“为什么”。这是领导力修练的第七句口诀。


    "为什么"的第一种用法，就是找问题的原 因。

    在管理上，有"五个为什么"的说法，就是面对 问题，你要连续问五个为什么，才能发现最根本 的原因是什么。


    你如果问完第一个为什么就下结论，那往往是 在做决定。你问到第五个为什么再得出解决方 案，那就很可能是在做决策。你现在再回想一 下小马里奥特那个案例，他直接问经理，问出
    口的是两个为什么，但是，他还在心里默默问 correlated自己好几个为什么。


    # 总结：


    # 划重点


    领导者做决策，而非做决定。决策是找到 普遍问题的一般性解决方案，可以真正解决 问题，而且可以一次解决一批问 题。决定是找到具体问题的个性解决 方案，最多一次解决一个问题，而且往
    往不能真正解决问题。怎么做决策？你 需要升级你的分析层次，不仅仅要在事件 的层次，更要在行为模式和系统结构 的层次去分析问题。你可以运用领导力的 第八句口决：为什么？多问几个为什
    么，发现问题最根本的原因，针对最根 本的原因做决策。


    最后，我给你留一个行动题：想一想你最 近做的一个决定，是不是你本来应该做一个 决策呢？你现在打算怎么做？欢迎你留言 分享。


    好，我是刘润，这是领导力课程的第25讲， 我们下讲再见。


