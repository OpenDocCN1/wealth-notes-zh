    我再讲一个鼓励唱反调的例子。这是管理大师德鲁克讲过的例子。德鲁克早年研究过通用汽车公司，很佩服当时的总裁，叫斯隆。有一次，斯隆和高管开会讨论一个决策，大家意见都一致。斯隆说，既然没有反对意见，这件事情先不决策了，我们过三个月再讨论。斯隆很高明啊，他知道如果没有反调，这个决策其实是不充分的。


