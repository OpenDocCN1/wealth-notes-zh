    # 11讲：领导力第三句口诀“你觉得呢？”


    11讲：领导力第二句口诀“你…”


    你好，我是刘润，这是领导力课程的第十一讲。这osia讲的主题是修炼领导力的第三句口诀：你觉得呢？这句口诀是提问，是一个重要的领导力问题。


    如果我问你：领导者需要问下属哪些问题？你会怎么回答？你可能会说，不同的场合、不同的情况要问不同的问题。这样说没有错，但是，也有一些问题，是领导者非常需要拿出来问的。这些问题，不分行业，不分职能，不分层级，是领导者需要问下属的。


    这些问题就是重要的领导力问题。在整个的课程当中，我一共要讲十句领导力口诀，其中有五个是问题，这就是五个重要的领导力问题。今天我先讲第一个，就是——你觉得呢？你觉得呢——只有四个字，很简单，但是是很重要。你甚至可以说它是最重要的领导力问题。


    # 1.领导者最重要的能力是提问


    要知道“你觉得呢”这个问题为什么重要，我要从另外一个问题讲起。这个问题就是：领导者最重要的能力是什么？一个领导者，他需要具备很多能力，如果让你选出一个最重要的能力，那这个能力是什么？


    这个问题备选答案很多。你可以说是沟通，也可以说是用人，可以说是决策，或者战略思考，还可以说是学习能力，或者灵活应变的能力。只要你能自圆其说，都是正确答案。


    我想提出一个答案供你参考：领导者最重要能力是提问。备选答案那么多，为什么我要说是提问？


    因为领导力是动员群体解决难题，所以提问是非常关键的能力。我可以从两个方面来说，第一，为了解决难题，你需要提问；第二，为了动员群众，你更需要提问。


    # 2.为了解决难题，你需要提问


    我先说第一点，为了解决难题，你需要提问。更准确地说，是为了解决难题，你需要问正确的问题。


    管理大师德鲁克说过这样一句话，他说：“管理决策中最常见的错误来源，就是强调发现正确的答案而非正确的问题。”德鲁克为什么这么说？因为如果你问题就问错了，那么答案不可能是对的。


    举个例子，如果你是一个公司的总经理，你发现一个产品销售不好，你会做什么？我不知道你实际会做什么，我来告诉你应该做什么：你首先应该发现正确的问题。


    一个产品销售不好，你可以问：如何改变对销售员的激励政策？你也可以问：如何更好地培训销售员？你可以问：如何让顾客重新认识我们的产品？你还可以问：如何重新研发产品，让产品能够更好地满足顾客需求？你有很多问题可以问。你首先要做的，不是去发现这些问题的答案，而是去发现：在这些问题当中，哪一个才是正确的问题。


    我刚才说了，为了解决难题，你需要提问。其实这不是最重要的，最重要的是第二点：为了动员群众，你需要提问。


    领导力是动员群众解决难题，是动员群众行动起来改变现状，只有跟群众建立一个良好的关系，你才能把群众真正动员起来。


    怎么跟群众建立一个良好的关系呢？在第九讲，我讲到了一种方法，就是从交易型关系着手，来建立变革型关系。有没有一种方法可以直接建立变革型关系呢？有，就是提问。当然，不是任何提问都是动员群众。比如，有些上级会问下属：你怎么这么笨？这不是动员群众，这是打击群众。


    # 3.为了动员群众，你需要提问


    什么样的提问才是动员群众？我引用一下管理学者埃德加·沙因提出来的新说法，叫做“谦虚的提问”。


    沙因是麻省理工学院的教授，他被称为“企业文化之父”，是企业文化这个领域的权威。沙因晚年的时候有了一个领悟，就是提问很重要，但是不是任何提问都很重要。他提出一个新的概念，叫做“谦虚的提问”。


    “谦虚的提问”这个概念的关键，其实不是提问，而是谦虚。你觉得什么是谦虚？是别人夸你的时候，你说其实自己做得还不够好？一般人可能是这么理解谦虚，沙因不是这样想的。


    沙因说，有三种谦虚。第一种谦虚是面对身份更高的人的时候，比如平民面对贵族，下级面对上级，我们往往会谦虚。第二种谦虚是面对成就更大的人的谦虚，比如你是一个刚刚开始创业的人，你面对比尔·盖茨，面对马化腾，往往会谦虚。


    这两种谦虚都比较好理解。沙因的了不起，在于他提出还有第三种谦虚。第三种谦虚是因为你依赖他人而产生的谦虚，你知道这件事自己一个人干不成，你要依靠对方才能干成，所以你谦虚。


    比如我是老师，我面对学生的时候，我需要有第三种谦虚，因为我依靠对方才能完成教学任务。同样，上级面对下级的时候，领导者面对追随者的时候，也需要有第三种谦虚，因为你要依靠对方才能完成工作任务。


    谦虚的提问强调的是带着第三种谦虚来提问。沙因认为，高层领导者都要学会谦虚的提问。很多高层领导，习惯的方式不是提问，而是命令下属怎么做，或者更平和一些，是告诉下属怎么做。


    你如果是指示下属，其实隐含着这样的假设：这件事情你不知道，而我知道，而且你需要知道。你如果采用提问的方式，隐含着的假设就不一样了。你提问下属，隐含着这样的意思：这件事情我不知道，而你知道，而且我想知道。显然，告诉容易破坏关系，提问才是建立关系。为了动员群众，为了跟群众建立关系，你需要进行谦虚的提问。


    # 4.“谦虚的提问”的标准


    我觉得，你听到这里，接受“谦虚的提问”这个观念应该没问题了。你现在可能对下一个问题更感兴趣了：怎么进行谦虚的提问？


    在这里呢，我当一下沙因的助教，我提出四 quite 标。卯果符合这四个标叻"简直是为了谦虚的笌问。


    +   1. 思想上有启发。你提出的问题能够启发对方思考，让对方想得更多，想得更深；

    2. 情感上有激发。你提出的问题能够给对方提供正能量；

    3. 关系上有促进。你提出的问题，能够促进你和对方的关系；

    4. 行动上有推动。你提出的问题，能够推动对方积极行动起来。


    你可以用这四个标准来给一个问题打分，然后把分数加在一起。得分高的问题，就是领导力的好问题，就是领导者要重点问的问题。


    你现在可能发现了，“你觉得呢”就是一个领导力的好问题。它在这四个标准上，得分都可能很高。


    问“你觉得呢”是在思想上启发对方，让对方拿出想法来。


    问“你觉得呢”也是在情感上激发对方，因为对方之前可能没想法，被你启发出想法之后，发现自己还挺有想法的，自然感觉会更好。


    问“你觉得呢”也是对关系有促进，因为对方发现你尊重他的意见，想听他的想法。


    问“你觉得呢”还在行动上有推动，这一点非常重要，但是比较隐蔽，不是很容觉得看出来。我在讲第二句领导力口诀“我不知道”的时候，讲到过一个宜家效应，就是人们会更喜欢自己想出来的想法。你通过问“你觉得呢”，让他提出自己的想法，他最终就会更愿意去行动，因为他觉得最真实实施的是自己的想法。


    我还要提醒你注意，“你觉得呢”之所以是最重要的领导力问题之一，还因为它的适用范围很广。它可以用到什么地方呢？下属向上级请示的时候。上下级请话，最经常发生的情形就是下属向上级请示工作。下属问：这个事情该怎么办？这个时候，上级该怎么回答呢？我的意见是，遇到下属来请示问题，上级至少在一半的时候可以说：你觉得呢？


    刘润


    到现在，我一共讲了三句领导力口诀。它们是彼此相关的，我给你串起来讲一下。第一句是“我来”，我来做什么呢？我来解决难题，我来动员群众。第二句是“我不知道”，我挺身而出了，但是却不意味着我单枪匹马就能解决难题。因为是难题，所以我要说“我不知道”，为了动员群众，即使我知道，我也说“我不知道”。说了我不知道，不能就此打住，你接着说“你觉得呢？”这既是为了解决难题，更是为了动员群众。


    # 总结：


    # ■ 划重点


    领导者最重要的能力是提问，而领导者要问的最重要的问题就是“你觉得呢”'
