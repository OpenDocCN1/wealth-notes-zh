    你好，我是刘润，这是领导力课程的第十讲。


    在上一讲，我讲了领导力是一种关系，追随着不同，关系就不同，因此领导者针对不同的追随者、上级针对不同的下属，应该采取不同的做法。但是，有个关键问题没有讲，就是怎么区分他们的不同呢？


    有一个个简单又有有效的做法，就是把他们分为几类。企业界有一个非常简单而且貌似有效的分类方式，就是用能力和态度这两个维度来给员工分类。这种分类方式非常流行，所以你很可能知道。可是，这种分类方式有个大漏洞，你就不一定知道了。


    # 1.能力与态度的分类方式


    我先讲这个分类方式的问题。网上流传过一篇文章，是京东商城创始人刘强东讲他的用人之道。刘强东把员工分为五类。他说，能力强、价值观也好的，是金子；能力和价值观都不错，但不是那么出类拔萃的，是铜；能力稍差、价值观好的，是铁；能力差、价值观也差的，是废铁；能力强、价值观差的，是铁锈，要坚决清除。


    # 2.这种分类方式的弊病


    能力和态度这两个维度来给员工分类有没有用？当然有用。但是，这样分类有个大漏洞、大问题。这个漏洞尽管很大，但是隐藏很深，不太容易看出来。你现在想一想，这个漏洞是什么？


    # 3.思考态度与做事态度


    用能力和态度这两个维度来给员工分类，有个大问题，就是态度这个维度太虚了，容易走偏。我给你介绍一种新的分类方式，它更具体，更有启发性。怎么样待下属，也是用两个维度。一个维度是下属是有独立的、批判性的思考，还是依赖上级替他们思考？另一个维度是下属积极主动地参与工作，还是消极被动地参与？


    # 4.培养唱反调的人


    但是，也有少数企业家，他们格局更高，他们克服了自己人性的弱点，看到了爱唱反调的人的重要性。


    日本索尼公司曾经有个CEO叫大贺典雄，他手下有个部门经理叫出井伸之。出井伸之在公司里排名不是很靠前，但是大贺典雄很器重他。出井伸之是个爱唱反调的人，敢于否定上级的意思，而大贺典雄不仅没有因此讨厌他，反而因此而欣赏他。'
