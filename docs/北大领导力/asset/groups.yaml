    ## 18讲：领导力第五句口诀“我教你”


    18讲：领导力第五句口诀“我教你”


    你好，我是刘润，这是领导力课程的第十八讲，是关于领导者当老师这个主题的最后一讲。这一讲，我们讲领导力的第五句口诀“我教你”。


    “我教你”这句口诀是提示你做出一个行动，什么行动呢？当老师。


    跟前面四句领导力口诀一样，你可以不说这句口诀，直接做出这个行动。


    跟前面四句领导力口诀不太一样的是，“我教你”这句口诀的变化比较多。前面四句领导力口诀，“我来”，“我不知道”，“你觉得呢？”，“我讲个故事……除了“我来”之外，它们的变换不是那么多。


    但是“我教你”这句口诀，可以有好多种不同的说法。这一讲，我重点讲“我教你”这句口诀的五种说法。这五种说法都很重要，我需要一个一个讲给你听，因为它们分别对应了领导者当老师的五个层次。


    ### 1.案例：从最优到最差


    在讲“我教你”的五种说法之前，我先给你讲一个“从最优到最差”的故事。这个故事跟我们这一讲的主题密切相关。你听故事的时候想一想，这个故事的主人公为什么会从“从最优到最差”？


    这个故事的主人公叫孙振耀，曾经担任惠普公司在中国的总经理。孙振耀最早是在中国台湾的惠普公司担任销售员，销售业绩很好，有一年成为了惠普在全球最优秀的销售员之一，在年度的绩效考核中获得了最高分，然后到美国总部领取了总裁奖。孙振耀领完奖，回到台湾，马上就被提拔为经理。一年以后，又到了年度绩效考核，没想到，孙振耀得到的评价是最差一级，相当于不及格。


    孙振耀回顾自己当时的心情，当然很不好受。他是这样说的：“在短短一年时间，从最优到最差，我心中的错愕和困惑可想而知。”我提醒你注意一下他用的两个词，错愕和困惑。错愕，就是大吃一惊。困惑，就是不了解。孙振耀用这两个词来描述自己的心情。这两个词很重要，我过一会儿会解释，为什么这两个词很重要。


    为什么他得了最差呢？根据孙振耀的回忆，他的上级是这么跟他说的：“孙耀，你是好的销售代表，但作为经理，你还有很多需要学习的地方。特别是在教导员工方面，我没有看到你做出令人信服的表现。”


    好了，故事说完了。这个故事是很久以后孙振耀自己讲出来的。他讲这个故事，是要强调，经理人要当老师，要教导下属。他为什么“从最优到最差”呢？他自己的结论是因为他忽视了自己应当老师，忽视了自己有教导下属的责任。


    孙振耀忽略了自己要教导下属，这肯定不假。但你觉得，这是孙振耀“从最优到最差”的全部原因吗？我觉得不是。我刚才提醒你注意，当他得知自己被评为最差时，他用到了两个词，错愕和困惑。他对这个结果很吃惊，很不理解。这说明什么呢？我现在告诉你这说明什么。这说明孙振耀的上级也没有做好当老师的工作，他忽视了自己要教导孙振耀。


    实际上，孙振耀从最优到最差，他的上级应该负有主要责任。他的上级至少在两个方面没有做好对他的教导工作。首先，在孙振耀上任之初，他很可能没有跟孙振耀说清楚，你现在的责任发生了转变，你的主要责任不再是自己销售，而是教导下属做好销售。而且，在整整一年的时间里，他肯定没有跟踪孙振耀在教导下属上的表现，没有及时反馈，只是到了年底才算总账，所以孙振耀才会觉得错愕和困惑。


    所以，我的结论跟孙振耀不一样，我的结论是：孙振耀的上级没有当好老师。


    我一开始是在杂志上读到孙振耀讲的故事，然后作出了上面的分析。后来我有机会见到了孙振耀，我想验证一下我的分析。我跟孙振耀初次见面，尽管很冒昧，我还是提到他这个故事，问了他两个问题。第一个问题，在你刚刚上任的时候，有没有人告诉过你要教导下属？孙振耀回答有。他说他参加过相关的培训，但是培训过后其实就忘记了。我又问了第二个问题，在这一年里，你的上级有没有来过问你教导下属的情况？他说没有，但是他说自己在高雄市，上级在台北市，离得远，问起来不方便。我觉得，这不是理由啊，上级不要说在台北，就是在东北，也只是一个电话的距离啊。我对我的结论还是不变：主要的问题不是孙振耀没有当好老师，而是他的上级没有当好老师。


    ### 2.管教、说教和身教


    我刚才详细地讲了孙振耀从最优到最差的故事。下面我讲领导者当老师的五个层次，以及相应的“我教你”这句口诀的五种说法。我们来看一看，孙振耀的上级处在哪个层次。如果要想上升到更高的层次，他应该怎么做，怎么说。


    领导者当老师的第一个层次是“管教”。领导者使用职位权力，用“管束”、“管控”来“教导”，所以称为“管教”。在这个层次的领导者，一般是怎么说“我教你”的呢？他一般说：照我说的做！照我说的做！这是“我教你”这句口诀的第一种说法。简单地说，就是下指示，下命令，要求你做到。


    孙振耀的上级就是在这个层次的领导者，下了一个命令：“你要教导下属！”然后呢？然后就是一年以后我来检查你做没做到。


    领导者当老师的第一个层次是“管教”，第二个层次呢，是“说教”。领导者不再单纯使用职位权力了，而是使用个人权力，用“说服”来“教导”，所以称为“说教”。在这个层次的领导者，对“我教你”的说法，可以概括为“我说给你听”。说什么呢？一个是说方法，说你该怎么做。另一个是说反馈，说你做得怎么样。


    孙振耀的上级，在说反馈上做得很差，他没有定期地、及时地给孙振耀反馈。对孙振耀这种新官上任的下级，一个月反馈一次都太久，而孙振耀的上级是一年之后才反馈，那个时候已经生米煮成熟饭了。


    我已经讲了领导者当老师的两个层次，管教和说教。第三个层次，是身教。在“说教”的层次，“我教你”这句口诀的说法是“我说给你听”。在“身教”的层次，“我教你”的说法是什么呢？也许你想到了，是“我做给你看”。说教还属于言传，俗话说，言传不如身教。“我说给你听”在很多时候就不如“我做给你看”有力量。


    孙振耀的上级希望孙振耀教导下属，但是他没有从正面做给孙振耀看。实际上，他的身教是负面的。他一年没有去教导孙振耀，给孙振耀做了一个反面的示范，孙振耀也就一年没去教导下属。


    ### 3.请教与传教


    我刚才讲了领导者当老师的三个层次：管教、说教和身教。我现在讲剩下两个层次：请教。请教这个层次，跟前三个层次明显不同，有了一个质的变化。


    在前三个层次中，领导者都是站在一个更高的位置上。他们都在说：“我知道做什么，我知道怎么做。我来告诉你。”但是到了请教这个层次，领导者开始说：“我不知道做什么，我不知道怎么做。你来告诉我。”在请教这个层次，领导者站在一个更低的位置。所以请教，就是我请你来教导我，我问：“你说怎么做？”“你说怎么做？”这是“我教你”这句口诀在这个层次的说法。


    我之前区分了领导和管理。我说管理是解决技术性问题，领导是解决挑战性难题。解决技术性问题靠权威，也许管教、说教和身教就可以了。而解决挑战性难题靠群众，从请教这个层次开始，才真正把群众放到了主角的位置。因此，如果区分管理
    and 领导的话，在管教、说教和身教这三个层次还只是管理，从请教才真正进入领导力的层次。


    所以，领导者当老师的五个层次，可以分成两组。第一组包括管教、说教和身教，第二组除了请教，还有传教。传教，是领导者当老师的第五个层次。


    在请教这个层次，领导者问：你说怎么做？在传教这个层次，领导者继续问：你为什么做？你可能注意到了，在请教和传教这两个层次，“我教你”其实变成了“我问你”，变成了两个问题，你提问来教导。请教这个层次问的是：你说怎么做？关注的还是做事的层面。传教这个层次问的是：你为什么做？关注的是意义的层面。在传教这个层次，领导者扮演的更像是传教士的角色，关注的不是做事情本身，而是这件事情的意义和目标。这一点，我在后面的课程中还会讲到。


    我听说领导者要当老师，有人说领导者要当教练，意思听起来差差不多，实际上是有区别的。教练关注的是比赛胜负，老师关注的是人的成长。所以，教练往往不需要传教，甚至都不需要请教。教练一般只需要管教、说教和身教这三个层次就够了。所以，伟大的领导者不仅需要当教练，还需要当老师。


    我刚才讲了管教、说教、身教、请教和传教，领导者要在这五个层次上当老师。我需要提醒你，这五个层次尽管有高低之分，但不是说更高的层次就可以取代更低的层次。这五个层次就像是五种工具，在不同的场合需要用不同的工具。这五种工具，你都需要努力去掌握。


    我刚才讲了管教、说教、身教、请教和传教，领导者要在这五个层次上当老师。我需要提醒你，这五个层次尽管有高低之分，但不是说更高的层次就可以取代更低的层次。这五个层次像是五种工具，在不同的场合需要用不同的工具。这五种工具，你都需要努力去掌握。


    ## 总结：


    围绕“我教你”这句领导力口诀，领导者当老师有五个层次：管教、说教、身教、请教和传教，它们分别对应着“我教你”这句口诀的五种说法。

    管教对应的是“照我说的做”，

    说教对应的是“我说给你听”，

    身教对应的是“我做给你看”，

    请教对应的是“你说怎么做”，

    传教对应的是“你为什么做”。

    这五个层次可以分为两组，管教、说教、身教是一组，更多是在管理。请教和传教是一组，更多是在领导。


    最后，留给你一道行动题：

    “我教你”这句口诀有五种说法，使用其中一种说法去实践一下当老师这项领导力修炼，然后给大家分享你实践的结果。


