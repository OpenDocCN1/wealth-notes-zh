    # 04讲：魅力不是前提，而是结果


    你好，我是刘润，欢迎来到我们的领导力课堂。这是第四讲。在上一讲我们讲了领导力和权力的不同，这一讲我们要讲领导力和魅力的不同。


    你现在如果方便的话，可以照一照镜子。你觉得自己有没有魅力？你看一看你周围的人，有多少人非常有魅力？我猜想大多数人，都应该跟我差不多，不觉得自己很有魅力。


    如果你照了镜子，觉得你跟刘润老师差不多，不算很有魅力的话，我有两个好消息告诉你。第一个好消息：魅力不是发挥领导力的前提条件。你不需要有魅力，就可以发挥领导力。第二个好消息：魅力往往是发挥领导力的结果。也就是说，你如果发挥了领导力，你会变得更有魅力。


    如果你觉得自己很有魅力，属于所谓的魅力型领导者的话，那我要告诉你一个坏消息：魅力还可以是发挥领导力的负担。也就是说，有魅力可以妨碍你发挥领导力。


    这三个消息，就是魅力和领导力的三层关系。下面我就把这三层关系，具体地给你讲一讲。


    ## 1.不需要有魅力，也可以发挥领导力


    我先说第一层关系：魅力不是发挥领导力的前提条件。你不需要有魅力，就可以发挥领导力。


    ## 2.发挥了领导力，带来了魅力


    ## 3.魅力可能成为你的负担


    在发挥领导力的过程中，你会实际地改变自己，会因此更有魅力；

    你发挥了领导力就会创造业绩，即使你还是同样的人，其他人也会越来越看你越有魅力。


    你听出来什么问题没有？言为心声啊，他的这不仅表达了他对张瑞敏的崇拜，还隐含着这样一层意思：张瑞敏太有思想了，我们努力奔跑都不一定跟得上，我们自己就不用思想了，努力跟上他的思想就够了。如果张瑞敏的魅力让下属不再独立思考，那么，张瑞敏的魅力已经成为了张瑞敏的负担，成为了海尔的负担。张瑞敏的魅力已经在妨碍张瑞敏发挥领导力。


    俞敏洪的魅力，马云的魅力，有没有成为他们的领导力的负担？你可以自己去想一想。


    ## 总结：


    ### 划重点

    - 魅力不是发挥领导力的前提条件；

    - 魅力往往是发挥领导力的结果，而且是两个方面的结果，既有领导者的实质改变，也有追随者的心理作用；

    - 魅力还可以是发挥领导力的负担。


