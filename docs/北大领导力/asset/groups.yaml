    # 28讲：发现组织的根隐喻


    28讲：发现组织的根隐喻


    你好，我是刘润，这是领导力课程的第二十八讲。这一个讲的主题是隐喻思考。隐喻就是隐藏起来的比喻，隐喻思考也可以说就是用比喻思考。隐喻思考是我们讲的第四种深思模式，它跟我们讲过的另外三种深思模式，决策思考、系统思考、整合思考，有一个明显的不同。哪里不同呢？


    前三种深思模式，绝大多数人都没有在用，就算有人教，也很难学会。但是隐喻思考不一样。每个人都在用隐喻思考这种思考方式。


    你可能会问，既然每个人都在用，为什么我还要专门讲？我告诉你三个原因。第一个原因，尽管每个人都在用，但是绝大多数人都没有知道自己在用，都是不自觉地在用。第二个原因，绝大多数人也用得不好。他们是被动地在用。实际上，不是他们在用隐喻，而是隐喻在用他们。


    第三个原因，就是隐喻思考很重要，一个卓越的领导者必须要学会用。有<|message|> 一本革命性的学术名著，是一个语言学家和一个哲学家合著的，叫做《我们赖以生存的隐喻》。他们说，我们依靠隐喻而生存。如果延伸开来，就是我们依靠隐喻而管理，我们依靠隐喻而领导。


    # 1.根隐喻


    我马上会给你讲一个我们依靠隐喻而教育孩子的例子。在这之前，我先要给你讲一个重要的概念，根隐喻。“根”是“树根”的“根”。根隐喻就是根子上的那个隐喻。


    在说根隐喻之前，我还需要简单说一说隐喻。我们刚才说过了，隐喻是隐藏起来的比喻。什么是比喻呢？就是用一个事物来理解另一个事物，一般是用比较形象的事物、比较熟悉的事物，来帮助我们理解比较抽象的事物、比较陌生的事物。比如，热情似火，这是一个比喻，用形象的火来帮助我们理解抽象的热情。比喻是人类理解事物的一种基本方式。


    比喻有时候很明显，有时候就不是太明显。下面有三种说法，你比较一下。第一种说法，我的热情，好像一把火。第二种说法，我的热情，就是一把火。你再听第三种说法：我的热情在熊熊燃烧。这三种说法都是比喻，而且是同一个比喻，但是一个比一个更不明显。后面两种说法，比喻被隐藏了起来，就变成了隐喻。


    在启蒙时期，法国有个思想家叫孔多塞。他说过这样一句话：“在语言的起源时，几乎每一个字都是一个比喻，每个短语都是一个隐喻。”他这样说，并不夸张。比如，你想一想这几个词：山头、山脚、山腰。这是我们经常用的词，全都是隐喻。


    而且，这几个词背后，都是同一个隐喻。这个隐喻是什么呢？就是“山是人”。山是人，所以有头、有脚、有腰。我刚才说了，我要讲一个重要的概念，根隐喻。你注意了，山头、山脚、山腰，都是由“山是人”这个隐喻延伸出来，“山是人”这个隐喻，就成了一个“根隐喻”。


    如果从一个隐喻，可以引申出来一系列的隐喻，那么这个隐喻就叫做“根隐喻”。这个隐喻是根，从这个根上可以长出很多隐喻。根隐喻这个概念非常重要。你现在学习隐喻思考，很重要一个任务就是发现根隐喻。


    # 2.发现根隐喻


    我给你举一个例子，来说明发现根隐喻的重要性。


    这个例子是一句话：不要让孩子输在起跑线上。这句话很著名，影响了很多家长。你有没有想过，这句话的逻辑是有问题的？问题在哪里？就在它的根隐喻上。


    这句话里的起跑线，是一个隐喻，比喻的是童年。不过这个隐喻不是根隐喻。这句话的根隐喻是什么呢？是“人生是赛跑”。先有“人生是赛跑”这个比喻，才引申出“童年是起跑线”这个比喻来。


    所以，不要让孩子输在起跑线上，这句话背后的根隐喻是“人生是赛跑”，更确切地说，是“人生是短跑”。因为只有对于短跑来说，输在起跑线上才是致命的。你发现这个根隐喻之后，这句话的逻辑问题就暴露出来了。如果说人生是赛跑的话，那么人生应该是马拉松，而不是短跑。


    如果你把人生想成是马拉松，那么你会发现，是否输在起跑线上并不重要，重要的是终点线。如果你换一种说法，换成：不要让孩子输在终点线上。这是不是对家长会有不同的影响呢？


    但是，不要让孩子输在终点线上，这句话背后的根隐喻还是人生是赛跑。你还可以继续想，我为什么一定要把人生比喻为赛跑呢？赛跑一定是有赢家，有人输，人生一定是这样吗？


    那么，人生应该比喻成什么？这个问题，只能你自己回答。我的工作不是告诉你人生是什么，我的工作只是帮助你发现这句话的根隐喻，然后我问你，这是你想要的根隐喻吗？还有没有别的可能性呢？


    # 3.大多数企业领导者用到的三个根隐喻


    刚才这个例子告诉你，你怎样过你的人生，你怎样引导你的孩子过他的人生，受到你对人生的根隐喻的影响。如果是一个企业领导者，你怎样领导你的企业，同样受到几个根隐喻的影响。我发现，绝大多数的企业领导者，在用三个根隐喻领导他们的企业。但是他们并没有清醒地意识到这一点。说得严重一点，他们是这三个根隐喻的俘虏。


    第一个根隐喻，商场是战场。这个隐喻，主宰着企业领导者看待竞争对手的方式。什么方式呢？是战场上的敌我双方，是你死我活的关系。这个隐喻比较容易理解，我就不多说了。


    第二个根隐喻，人力是资源。“人力资源”现在是一个专有名词。你有没有想过，这个概念其实是一个隐喻呢？这个隐喻就是：人力是资源。你把人当做资源，就把人量化，把人服务于某一目的，而且默认在服务于这个目的的过程当中，人是可以被消耗掉的。你这样想，有好处，也有坏处。好处是更有效率了，坏处是什么呢？坏处就是没有把人当人。管理学界明茨伯格就说过，“人力资源”是管理中最糟糕的词汇。


    我說绝大多数企业领导者，在用三个根隐喻领导他们的企业。我已经说了两个。第一个，商场是战场，这个隐喻还比较明显。第二个，人力是资源，这个隐喻就不太容易看出来了。下面我讲第三个根隐喻。这个根隐喻最不容易看出，但是它影响最大，人力是资源这个隐喻其实也是从它派生出来的。


    第三个根隐喻就是组织是机器。组织是机器，这个隐喻很重要，这是对管理学影响最大的隐喻。


    在十九世纪末、二O世纪初出现了第一批管理思想家，包括法国人法约尔，美国人泰勒，还有德国社会学家韦伯，都把他们的组织管理理论建立在“组织是机器”这个隐喻之上。现在过了100多年了，管理思想一直在发展，但是绝大多数管理思想的背后，都隐藏着“组织是机器”这个根隐喻。


    绝大多数企业领导者，都有意无意接受了这个隐喻。比如，联想公司创始人柳传志，他说思想提倡发动<|start|>文化，而不是齿轮文化。他自己可能没有意识到，不管是发动机文化，还是齿轮文化，都是机器文化。


    把组织看做机器，有好的影响，比如强调专业分工，强调流程，强调标准化，但是，组织不完全是机器，过分强调这个隐喻，会带来很大的副作用。


    # 4.案例：富士康


    我现在就用一家具体的企业做例子，给你讲一讲“组织是机器”这个隐喻的副作用。这家企业就是富士康。关于富士康，你有可能知道两件事情。第一，富士康是iPhone手机的制造商。第二，有一段时间，富士康有好多工人跳楼自杀。


    富士康的工人为为什么要跳楼？我告诉你，就是因为富士康把“组织是机器”这个隐喻用到了极致。这个隐喻，就是富士康工人跳楼的罪魁祸首。


    香港理工大学有个教授叫褐疑，带着一个研究团队，专门研究过富士康。他们发现，有个女工，在富士康工作一整个月，没有说过一句活。你听起来可能惊讶，工作一个月不需要说一句话？是的，在富士康，组织是机器，员工就是螺丝钉，螺丝钉不需要说话，螺丝钉只需要听话。


    富士康的老板叫郭台铭，很著名的企业家。郭台铭的成功，就在于他把富士康变成了一台非常有效率的机器。在富士康工人跳楼事件之后，郭台铭下令给楼顶装上防护网，让工人跳不下来。郭台铭这个防护措施，依然是机器化的解决方案。他的防护措施，说明他已经成了“组织是机器”这个隐喻的奴隶。是这个隐喻在使用他，而不是他在用这个隐喻。


    # 5.领导力口诀：“为什么？”


    郭台铭怎么才能成为这个隐喻的主人呢？他需要问自己“为什么”。


    郭台铭要问自己：我们为什么这么说？我们为什么这么做？在富士康日常语言、日常行为的背后，隐藏的根隐喻是什么？这个根隐喻带来了什么好处？又带来了什么副作用？我们怎么避免这些副作用？


    要避免根隐喻的副作用，有时候只需要采取些针对性的措施；有时候就需要放弃这个根隐喻'
