    # 发刊词：你为什么需要领导力


    你好，我是刘澜。我郑重地邀请你，进入我的领导力课堂。


    也许你会问：我为什么要学习领导力？


    很多人觉得领导力跟自己没多大关系，我觉得那是他们对领导力这个话题有误解。下面我列举了三个误解，跟你讨论一下。


    # 1.领导力是跨学科的心智模式


    第一个误解，觉得领导力只是局限于商学院的学科。


    领导力研究从来没有局限在商学院。实际上，因为商学院本身是个新生事物，商学院研究领导力是相当晚的事情。


    # 2.领导力帮你承担更大的责任


    第二个误解，我的职位不够高，我不需要学领导力。


    很多人认为领导力只是企业高管的事情。


    # 3.领导力帮你解决人生难题


    也有人会说，我不想在组织中承担更大的责任，所以我不需要领导力。这是第三个误解。


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_0_0.png)


    +   1. 建立跨学科的心智模式；

    2. 为承担更大的责任做好准备；

    3. 更好地解决人生的难题。


    # 4.为什么是我为你讲


    为了帮助你做好这三件事情，我做了三个方面的准备。


    # 《刘澜·北大领导力30讲》课表


    发刊词：为什么需要领导力


    +   导论

    1. 领导力其实是领导力

    2. 用口诀修炼领导力


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_0_1.png)'
  - '[PAGE 1]


    哈佛商学院另外一个领导力的教授私下里跟我讲，说现在诺瑞亚当院长了，以后领导力的地位也许会高起来。


    领导力的学者地位不高，还有另外一个原因，就是学术界还有这样一个观点，领导力不重要。要说到这个观点，我们就要回顾一下领导力研究史上最经典的一个定量研究。这个研究还不是领导力的学者做的，是两个社会学者做的，发表于1972年。他们研究了美国167家企业，研究对公司业绩影响主要有哪些因素。他们研究的结果发现，谁当CEO，对公司的业绩影响是最小的。


    后来的后续研究，基本上没有推翻这个结论，有人根据这些研究，得出了这样一个结论，就是说领导力不重要。你觉得这个结论对不对呢？我觉得这个结论不对，我觉得从他们的研究得不出这个结论。为什么呢？因为他们的研究对象有问题，他们研究的是领导，不是领袖。你可以说谁当领导不重要，但你不能说领导力不重要。


    要真正发现领导力是什么呢？我们要研究领袖，而不是研究那些当领导的人。我们要研究那些真正地发挥了领导力的人，他们可能是领导，也可能不是领导。比如说甘地。但是他们有这样一个共同点，他们都承担了责任，他们都解决了问题，他们不是一个人解决了问题，他们是一个人带着一群人解决了问题。


    他们是怎么做到的？这就是我们这个课程的主题。


    # 总结：


    # 划重点


    +   1. 领导力是责任，是什么责任呢？是解决问题的责任。\n2. 把领导力等同于职位，是对领导力最大的误解。\n3. 领导力尽管不等于职位，但是两者之间有联系：领导力是领导职位的责任，领导职位是领导力的资源。\n4.
    学院派研究领导力有一个误区：他们往往研究的是领导，而不是领袖。\n领导是担任领导职位的人，领袖是真正发挥领导力的人。\n5. 这个课程的主题是如何当领袖，而不是如何当领导。


    # ——课后思考——


    最后，我给你留一道思考题：\n领导力是名词、动词还是形容词？为什么？请说明理由。你要注意，这不是语文题，而是领导力的思考题，没有特别简单的答案。你的答案是什么？欢迎你留言。我也会分享我的参考答案。


    好，我是刘润。这是我们领导力课程的第一讲，我们第二讲《用口诀修炼领导力》再见。


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_1_0.png)


    刘润·北大领导力30讲\n十句口诀，成为解决难题的高手\n版权归得App所有，未经许可不得转载


    # 留言精选


    右边的翅膀 21\n我觉得领导力就是名词，动词与形容词的合体。但主要依托的是动词。\n因为领导力是一种责任，解决问题的责任。这个为了解决问题，而进行的资源调配、规划、协调过程，本身就是一连串的行动。因此领导力最重要的部分就是动词。\n但是领导力也是对一类人的解释，他们是某个事件或团体的领袖，这是对想要具有领导力的人的一种指导，帮助他们判断哪种行为算是领导力。\n最后当然也是一种形容词，是一种自己通过行动达到某种程度后，别人对自己的肯定。\n18:23


    作者 回复\n这是目前被点赞最多的留言，我就在这里集中分享一下我的参考答案。(1)首先，你一定要知道，这个问题没有标准答案，只有参考答案。(2)你应该发现对你最有用的参考答案。(3)很多人把领导力看作“总裁”“局长”“校长”这样的名词。这样看领导力，就把领导力变成了一个“当没当”(某个职位)的问题。(4)还有很多人把领导力看作“雄心”“外向”这样的形容词。这样看领导力，就把领导力变成了一个“有没有”(某些品质)的问题。(5)当然，也有很多人，把领导力看作“承担责任”“解决问题”这样的动词。这样看领导力，领导力就是“做没做”(某些行动)的问题。(6)我认为，第三种看法，更积极，更有用，对绝大多数人来说，是更好的参考答案。领导力不是你当没当，不是你有没有，而是你做没做。\n(7)但是，当上某个职位，可以是领导力的资源。具有某些品质，也是领导力的资源。反过来，采取领导力的行动，可以帮助你当上更高的职位，培养你的诸多品质。(8)所以，领导力是动词、名词和形容词的三合一，主要是动词。\n22:15


    刘焕荣 11\n最先知道刘润老师是他的《思想的郊区》，后来又看到了他的另外著作《领导力的第一本书》和《领导力的第二本书》，收获满满！所以今天毫不犹豫订阅了这个课程。\n18:07


    作者 回复\n谢谢你，这几本书如果你看过，应该会更好地理解我分享的内容。\n18:26


    小朱先生 9\n感谢刘润老师领导力大师课准时上线！欢迎刘润老师！


    讨论领导力是名词、动词还是形容词之前，我想先了解一下润总一下领导力的定义。按照经典管理学的定义，权力分为五种，依次是合法权力、奖赏权力、强制权力、专家权力与参照权力（摘自《领导学》（理查德·L·达夫特著，电子工业出版社））。前三种由岗位带来的硬权力，个人可以认定为是动词，动词(v.)：表示动作或状态。只是因为人在这个岗位权力而产生的动作，比如警察、交警之类的执法机构；后两种称之为软权力，个人认为是形容词，因为这绝不是因为岗位自然带来的，是靠领导者本身的素质形成。所以在隔壁《宁向东的清华管理学课》中，宁老师一针见血指出：“有了权力不一定有领导力”。就如刘润老师所说：领导绝不等于领袖。


    在《领导力：如何在组织中成就不凡：第6版》一书中，指出：领导行为是领导科学的基石。古今中外皆然。决策行为和用人行为就是卓越领导不可或缺的两个大行为。决策行为就是要共创愿景、挑战现状；用人行为则要以身作则、使众人行和激励人心。这五种习惯行为成就了卓越领导，使得组织成员能够自愿追随并愿为共同愿景奋斗。


    基于此认识，虽然我们在判断、评判一位国家或组织领袖有“领导力”时，容易误认为是“领导力”是一种赞誉的“形容词”，但个人认为这种领导力的关键核心还是源于领导者自身素养而产生一系列有效动作给国家、组织形成有效、良好的行为结果，关键还是在于自己。所以“领导力”是一个动词，而且个人这些年在管理的路上追求“领导力”过程中，有一个深深体会，那就是“莫向外求”\n敬请老师斧正！\n18:59


