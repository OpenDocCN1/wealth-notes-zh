    ## 27讲：最高级的智商——整合思考


    27讲：最高级的智商——整合思考


    你好，我是刘润，这是领导力课程的第二十七讲。有一个管理学者，叫罗杰·马丁，是加拿大一所商学院的院长。他研究了50多位商业领导者。他说，如果一定要找出他们的一个共同点，那就是整合思考。


    我们这一讲，就讲整合思考。这是深思这项领导力修炼的第三讲。深思属于智商，而整合思考这种能力属于最高级的智商，比我们已经讲过的决策思考和系统思考更加高级，更难掌握。


    有人可能会问：你为什么要强调智商，不是说情商比智商更重要吗？我要告诉你，对于领导者来说，情商很重要，但是智商更重要。你可能见到情商很低也取得成功的领导者，但你绝不可能见到智商很低却能够成功的领导者。


    ### 1.整合思考是最成熟的心智模式


    我刚才说，整合思考是最高级的智商。著名心理学专家罗伯特·凯德纳有一个类似的说法。他总结了四种层次的心智模式。他说，整合思考是最成熟的心智模式，而绝大多数人都不具备这种心智模式。


    ### 2.鱼和熊掌我要兼得


    ### 3.案例：星巴克


    ### 4.伟大企业的整合思考


    + 1. 它们既有超越利润的目的，又务实地追求利润；

    2. 它们既有相当固定的核心价值观，又勇猛地变革和行动；

    3. 它们既有清晰的愿景与方向感，又进行机会主义的摸索与实验；

    4. 它们既制定胆大包天的目标，又通过渐进式的演变和进步来实现它。


    ### 5.转变两个观念


    ### 6."为什么不？"


    ## 6."为什么不？"


    要学会整合思考，你还可以使用领导力修练的第八句口诀"为什么"。我已经讲了"为什么"的两种用法。在决策思考的时候，你问第一种"为什么"，用来找问题原因。在系统思考的时候，你问第二种"为什么"，用来找系统目标。在整合思考的时候，你要问第三种"为什么"。


    第三种"为什么"跟前两种"为什么"有些不一样。第三种"为什么"其实问的是"为什么不"，在"为什么"后面加上一个"不"字，问"为什么不"。别问说，鱼和熊掌不可兼得，你问，为什么不，为什么不能二者兼得呢？别人说，削减成本和大力创新不可兼得，你问，为什么不，为什么不能同时做到呢？你可以通过问"为什么不"，开始自己的整合思考。


    ## 总结：


    划重点


