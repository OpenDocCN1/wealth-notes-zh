    你好，我是刘润，这是领导力课程的第十六讲。这一次我们讲讲领导者怎么当老师。


    ## 1. 教育模式伤害了我们的领导力


    我说领导者要当老师，你如果接受这个理念，你首先想到的榜样会是谁？你觉得，应该做像谁一样的老师？我告诉你，不管你口头的回答是什么，你真正的榜样实际上是三个老师。


    第一个老师是你的父母。第二个老师就是你从幼儿园到大学，那些教过你的老师们。第三个老师，是你刚走上工作岗位的最初的上级和老板。


    这三个老师，在你的身上，打下了他们的领导力的烙印。我有一个比较有趣的假设，就是在这三个老师之中，你的父母，还有你最初的上级，对你可能有好的影响，也可能有坏的影响。但是，总的说来，你的学校的老师们，对你今天如何领导他人，起到的主要是坏影响。


    你今天作为一个领导者，要做好当老师的工作，需要摆脱他们的坏影响。你可能会想，我遇到了一些好老师啊，我受到的影响应该是正面的吧。我觉得这种可能性很小。因为真正潜移默化影响你的，不是某个老师，而是所有老师们背后的那个教育模式。


    ## 2. 只鼓励个人成功


    第一个方面，就是学校教育只鼓励个人成功。


    ## 3. 给答案而不是提问题


    ## 4. 补人之短而不是用人之长


    ## 总结：


    学校教育，尤其是中小學教育，要求大家不偏科。而到了工作上，只有偏科的個人，偏科的企業，才能有更好的發展。所以謂偏科，就是要有擅長，要有優勢。所以，領導者當老師跟學校老師不一樣，學校老師要學生全面發展，領導者則要用人之長。但是，我們的學校老師教了我們十幾年，教給我們的觀念不是用人之長，而是補人之短。


