    # 13讲：领导力故事中要有一面镜子


    你好，我是刘润，这是领导力课程的第十三讲。这讲我们谈着讲故事。上讲，我讲了《鹰的重生》的故事，我说这不是一个好的领导力故事。实际上，只要是动物寓言故事，都不是好的领导力故事。


    如果有人讲动物寓言故事，不是幼儿园的老师讲给小朋友听，而是一个组织的领导者讲给组织中的其他人听，那么你要当心了。这可能是两种情况。一种是他在忽悠你，如果他不是在忽悠你，那么这说明他不会讲故事。


    动物寓言故事是错误的领导力故事。你要学会讲正确的领导力故事。正确的领导力故事主要有四种，分别是：


    - 我是谁的故事；

    - 我们是谁的故事；

    - 我们向何处去的故事；

    - 还有我们为什么要变革的故事。


    ## 1.故事中要有一面镜子


    下面我会分别举例，具体讲一讲这四种故事。不过，在分别讲这四种故事之前，你先想一想，你有没有发现，这四种故事跟动物寓言故事最大的不同是什么？我提示你一下，这四种故事都有一个什么共同点？


    ## 2. “我是谁” 的故事


    第一种重要的领导力故事，是我是谁的故事。这是领导者用自己的亲身经历，述说自己的一个价值观。你应该不难想到，为什么这是一种重要的领导力故事。因为你要让别人知道你是什么样的人，别人才会决定是否要追随你。


    ## 3. “我们是谁” 的故事


    ## 4. “我们向何处去” 的故事


    正确的领导力故事有四种，我刚才讲了两种：“我是谁的故事”、“我们是谁的故事”都举了例子。第三种正确的领导力故事是“我们向何处去”的故事。“我们向何处去”的故事，就是通常所说的愿景，只不过你的愿景不应该是一句抽象的话，而应该是一个形象的故事。


    你要注意，

    马丁·路德·金的愿景就是四个字“种族平等”。但是“种族平等”四个抽象、简单的字，不够打动情感，马丁·路德·金的演说，把这四个字变成了具体生动的形象。

    而且马丁·路德·金的演说就像一面镜子一样，他的听众可以从镜子中看到自己，看到现在的自己，更看到将来的自己，看到愿景实现之后的自己。这个演讲之所以打动人，一是形象，二是距离。


    # 总结：


    ## 划重点


    > 领导力故事的一个秘诀：故事中要有一面镜子，要让听众照到自己。

    有四种正确的领导力故事：我是谁的故事，我们是谁的故事，我们向何处去的故事，还有我们为什么要变革的故事。


    你可能想说，你第四种还没讲吗？

    是的，我知道我还没讲第四种，就是我们为什么要变革的故事。我留到下一讲详讲。为什么？有时偶然，但也是有一个特别的原因，我也留到下一讲揭晓。

    最后留一个作业：

    你可以讲一个你自己的“我是谁的故事”吗？

