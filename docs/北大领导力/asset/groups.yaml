    ## 19讲：没有犯过大的错的人都是平庸之辈


    19讲：没有犯过大错的人都是...


    你好，我是刘润，这是领导力课程的第十九讲。我先问你一个问题，伟大和平庸的区别在哪呢？这个问题显然有很多答案，不过，我觉得有一个答案，比别的答案都重要。


    在公布这个答案之前，我再问你一个比较私人的问题：你犯过大的错吗？我多次在线下的领导力课堂里问过这个问题。一个课堂里一般有三四十个人，我问：你犯过大的错吗？认为自己犯过大错误的人举手。你猜举手的人有多少呢？一般是极少数
    的几个人，甚至只有一两个人。


    现在我告诉你，伟大和平庸的区别在哪里。伟大和平庸的区别，就在于被问到“你犯过大错吗”这个问题的时候，你有没有坦然地举手。这其实是管理大师德鲁克的观点。德鲁克的原话是这么说的：“我绝对不会把从未犯错的人升到高层领导岗位上，因为没有犯过大错的人必然是平庸之辈。”


    平庸的人害怕失败，认为失败是坏事，所以他们不愿意举手。伟大的人呢，坦然面对失败，甚至把失败当做好事。这一讲的主要内容，就是告诉你，平庸和伟大的分水岭，是对待失败的态度。如果你要跨越这个分水岭，你需要克服三个障碍。


    ## 1.伟大与平庸的分水岭


    我问，你犯过大的错吗？然后我说，没有举手的人都是平庸之辈。有人不觉得很服气，对不对？他可能说，我们真的没有犯过大错啊，难道没有犯过大错也有错吗？我告诉你，真的有。没有犯过大错就是你的错。


    一个人没有犯过大错，说明他没有冒过风险，说明他每天都在谨慎小微地活着。用领导力的术语来说，就是他每天只是在解决日常性问题，最多是在解决技术性问题，他没有挺身而出去解决决策性问题，所以他即使犯错，也是犯的小错。


    而且，如果你没有犯过大错，还说明你没有大的进步。你知道吗，华为公司的创始人任正非说过这样一句话，他说：“对既没犯过错误，又没有改进的干部可以就地免职。”


    任正非这句话有两个地方值得注意，我给你解读一下：


    - 1. 德鲁克说你没有犯过大错，我不会提拔你。而任正非说的是，我不但不会提拔你，我还要把你免职。任正非比德鲁克还狠；

    - 2. 任正非把怎么犯错误单独列在一起？是改进。我重新一遍任正非的话，“对既没犯过错误，又没有改进的干部可以就地免职。”那么你可能会问，那么对于既没犯过错误又有改进的干部呢？这样的干部是不是该提拔？我告诉你，没有这样的干部。要想有改进，一定会犯错误。我说得更准确一些，要想持续改进而又不犯错误，那是不可能的。


    为什么多数人都是平庸，而少数人变得伟大了？就是因为少数人不怕犯错误，而且从自己的错误中学习。很多人认为，乔丹是有史以来最伟大的篮球运动员。乔丹出演过一则广告。在广告里他这么说：“在我的职业生涯中，我有9,000次投篮未中。我错掉了差不多300场比赛。在26场比赛中，我在最后关头的投篮将决定比赛胜负，我没有投中。我在一生中一次又一次失败。那正是我的成功的原因。”


    你注意，乔丹说，“我在一生中一次又一次失败。那正是我的成功的原因”。一段把失败和成功对立起来，只想成功，不想失败。但是那极少数出类拔萃的人知道，错误和改进，失败和成功，是因果关系。


    实际上，我认为，每个人都犯过大错。那些认为自己没有犯过大错的人，还犯了一个大错，就是他们都不知道自己犯过大错。他们都没有意识到自己的错误，怎么改进呢？


    想要从平庸到伟大，你需要改变对失败的态度。但是，要想实现这个转变，你有三个方面的障碍需要克服。哪三个方面的障碍呢？心理障碍，社会障碍，能力障碍。这三个方面都不止一个障碍，我挑主要的给你说一说。


    ## 2.害怕失败的心理障碍


    先说心理上的障碍。我们之所以害怕失败，有两个主要的心理障碍。


    一个叫做损失规避。损失规避是著名心理学卡尼曼和他的合作伙伴发现的。我们得到100元钱的快乐，远远低于我们损失100元钱的痛苦。因为我们更看重损失，所以我们害怕失败，我们更关注威胁，而不是机会。这就是损失规避。


    你很可能听说过损失规避，但是你不一定知道，损失规避是我们的本性，而且带来了很多负面影响。为什么我们会有这个本性呢？因为这有进化上的优势。在充满风险的原始社会，损失规避帮助我们的祖先生存了下来。但是，在今天的社会环境中，在绝大多数时候，失败不再是一个生死问题，所以，我们的损失规避的本性，更多带来的就是坏处。


    除了损失规避，另外还有一个心理倾向，就是所有人都自我感觉良好，也让我们害怕失败。除了抑郁症患者，所有人都有自我感觉良好，这也是人类进化而来的心理倾向，是人的本性。我们害怕失败，因为失败会破坏我们良好的自我感觉。这也是一个心理障碍。


    ## 3.害怕失败的社会障碍


    我刚才讲到两个心理障碍，损失规避和自我感觉良好。要改变我们对待失败的态度，在天生的心理障碍之外，我们还有社会障碍需要克服。社会障碍不是我们天生就有的，而是社会在我们身上后天培养出来的。


    我主要讲两个社会障碍，第一个，就是学校教育不鼓励失败。你一定还记得，我在第十六讲用了一整一讲，讲了学校教育对领导力的三个危害。你现在发现了，学校教育对领导力的危害，远远不止三个。不鼓励失败，也是学校教育对领导力的重要危害。


    我下面引用德国心理学家吉仁泽（Gerd Gigerenzer）的一段话。吉仁泽说：“老师不鼓励学生自己去寻找解答数学题的方法，以避免他们犯错误。老师会告诉学生答案是什么，然后测试他们能否记住和学会运用公式。学校强调的是让学生为考试而学，尽可能少出错，但这并不是培养有人之道。”吉仁泽讲的是德国的情况，看来全世界的学校教育都差不多。


    学校里培养的学生害怕出错，害怕失败，这些学生进入工作岗位之后，情况又是怎样的呢？你绝大多数人都在组织里工作，你们会发现，组织制度是学校教育之外的另一大社会障碍。像你正非那样的组织领导者是很少的。绝大多数组织，都是奖励成功，惩罚失败。


    ## 4.害怕失败的能力障碍


    我刚才讲了心理障碍和社会障碍，现在我讲第三个方面的障碍，能力障碍。我要提醒你注意，伟大的人之所以对待失败的态度不一样，主要原因不在于他们克服了心理障碍，不在于他们克服了社会障碍，而在于他们克服了能力障碍。


    我刚才讲到两个心理障碍，损失规避和自我感觉良好，这是刻在我们的基因里的，很难克服。我刚才讲到的两个社会障碍，学校教育和组织制度，这也是根深蒂固地长在社会体制中的，也很难克服。只有能力障碍，你更有可能依靠个人后天的努力克服。


    在具体讲能力障碍之前，我要说一说卡尼曼的两个系统的理论。你很可能也知道这个理论，我们就快速复习一下。卡尼曼把我们的大脑分为两个系统，一个叫系统一，另一个叫系统二。这两个系统都参与思考，参与决策。系统一是快系统，是自动运行的系统。系统二是慢系统，是深思熟虑的系统。


    他为什么把系统一叫做系统一，不叫做慢系统或者自动系统呢？因为我们数数的时候，默认的顺序是一二三四这样数，从一开始，然后是二，卡尼曼是想强调，系统一是大家的大脑的默认系统。任何事情都先经过系统一，系统一处理不了，系统二才会参与。你记得吗，我在讲“讲故事”这个主题的时候，提到过情感系统和理智系统。情感系统就属于系统一，理智系统就属于系统二。


    我们改变对待失败的态度会遇到的能力障碍，跟这两两个系统密切相关。我主要讲两个能力障碍。


    第一个是管理学上的热炉效应。热炉效应是两个管理学者命名的，来自美国著名作家马克·吐温的一句话。马克·吐温说，一只被热炉子烫过的猫不会再坐在热炉子上了，但是它也不会再坐在冷炉子上了。这其实说的就是“一朝被蛇咬，十年怕井绳”。为什么会这样呢？因为只有系统一参与了学习，系统一认为学到教训了，实际上没有。面对失败，我们往往只有系统一参与了学习，这让我们只看表面，我们会高估失败。


    热炉效应是第一个能力障碍，指的是往往只有系统一参与了学习。但是，即使系统二参与进来，还会遇到第二个能力障碍，就是欠缺方法。我们的天性是害怕失败，现在要变为喜欢失败，系统二也不知道怎么做。欠缺方法怎么办？我们来帮助你。后面两讲，我帮你找方法。


    ## 总结：


    刘润重点


    > 平庸的人和伟大的人有一道明显的分水岭，就是对待失败的态度。平庸的人害怕失败，伟大的人不怕失败。如果你想


    ## 总结：


    ## 划重点


    平庸的人和伟大的人有一道明显的分水岭，就是对待失败的态度。平庸的人害怕失败，伟大的人不怕失败。如果你想要从平庸到伟大，你需要改变对失败的态度，你需要克服心理上、社会上和能力上三个方面的障碍，最主要的是能力障碍。


    最后给你留一道作业：就是我一开始问过的问题：你犯过“大错”吗？你从中学到了什么？欢迎你留言分享。


    好，我是刘澜，这是领导力课程的第十九讲，我们下一讲《组织要学会聪明的失败》再见。


