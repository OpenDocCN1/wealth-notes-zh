    ## 测试题与进阶书单


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_68_0.png)


    我在得到主讲的领导力课程已经结束了。有学员表示想要继续听下去。对于这样的学员，我一方面要感谢你对于课程的认可，另一方面也有些担心这是一个误区。正如课程所强调的，领导力主要是一个“动词”，它需要你去行动。


    当然，持续学习是必要的。假设你听了这门课，还想继续学习领导力，我推荐四本比较高级的领导力书籍给你读。


    ### 1.建体系，读《领导力：解决挑战性难题》


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_68_1.png)


    如果想要建立课程背后的领导力认知体系，我推荐这本书。这本书刚刚上市，是我为MBA教学所写的领导力教材。我在得到课程的许多主题，在这本书中有更详细的讲解。比如“最高级的智商——整合思考”这个主题，书中有很多重要的操作性内容，比如实现整合的四个步骤，以及寻找整合解的四个方向，而在音频课程中没有来得及讲。


    ### 2.有延伸，读《领袖们》


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_68_2.png)


    这是本老书，作者是美国前总统尼克松，是他为他认识而且钦佩的一群各国政治领导者（包括中国的周恩来）的画像。在这本书中，你会发现我在得到课程中强调过的一些主题，比如“责任”“反思”“从失败中学习”。你也会读到一些本课程没有涉及到主题，比如领导力的“表演性”。这本书故事鲜活，分析深刻，尽管写的是政治家，但其实适用于任一领域的领导力。


    ### 3.躲危险，读《火线领导》


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_68_3.png)


    这本书的第一作者是哈佛肯尼迪学院的领导力大师海菲兹。这本书在我看来，主要讲的是如何避免领导力的“危险”。领导力是动员群众解决问题，在这个过程中难免会遭遇危险：有人反对你，有人暗算你……海菲兹和他的合作者非常现实，他们告诉你发挥领导力会遭遇哪些危险，应该怎样应对。


    ### 4.悟人生，读《论领导力》


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_68_4.png)


    这本书是学术大师詹姆斯·马奇在斯坦福大学传奇性的领导力课程的讲稿。这本书很高级，融领导力、管理学、哲学与文学于一体。马奇用西方的四大文学名著——《奥赛罗》《战争与和平》《圣女贞德》《堂吉诃德》——来讲领导力。我十年前读到这本书的英文版，大呼过瘾。终于，今年出了中文版。我每次重读，都有新的收获。提醒一下，很多会觉得这本书晦涩难懂。


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_68_5.png)


    刘润


    这四本书中，故事情最强的是《领袖们》，理论性最强的是《论领导力》，跟课程联系最紧密的是《领导力：解决挑战性难题》。最后再强调一下：读书本身不是目的，读书是为了更好地成为自己，你需要行动。


    最后，领导力课程已经结课，学习领导力的小伙伴们，你们对领导力的认知已经升级了吗？下面，来做一做这个小测试吧。测试最后会有一个分数，如果你和团队成员在一起学习，不妨把结果分享给他们，让他们也来测试一下。


