    ## 29讲：从平庸到伟大的三环


    29讲：从平庸到伟大的三环


    你好，我是刘润，这是领导力课程的第二十九讲。这一讲的主题是认识自己。我不需要给你讲认识自己很重要，因为你肯定知道认识自己很重要。我需要给你讲的是，你怎么从静态地认识自己，变成动态地认识自己。


    很多企业花钱给他们的经理去做人格测试，认为这是帮助他们认识自己。这些测试也许有点用，但他们是在“静态”地认识自己，而一个领导者，一个追求卓越的人，需要“动态”地认识自己。


    怎么“动态”地认识自己呢？就是既要认识现在的自己，又要认识将来的自己，而且，还要认识把现在和将来联系起来的路径。


    这一讲，我要教你一个“动态”地认识自己的方法，叫做三环模型。三环模型有三个互相交叉的环，分别是热爱、擅长和机会。这三个环是你现在的自己，在这三个交叉的地方，是你的人生愿景，就是你将来的自己。


    ### 1.从平庸到卓越


    这个三环模型，我是从管理大师吉姆·柯林斯那里借用来的。柯林斯本来没有发现三环模型，他本来是跟人合著了一本书，《基业长青》。这本书，我之前提到过，研究了18家基业长青的企业的成功秘密。这本书全球畅销，柯林斯当然很高兴。


    有一天，柯林斯碰到麦肯锡咨询公司的一位高管。这位高管对柯林斯说，《基业长青》这本书写得很好，但是没有用。柯林斯当然大吃一惊，问为什么。这位高管说：你写的那些公司，一直都很伟大。它们有非常伟大的创始人，比如万豪的创始人马里奥特，惠普（HP）的创始人休利特（H）和帕卡德（P）。他们从成立一开始就把公司打造得很伟大。但是大多数公司不是这样啊。大多数公司一直都很平庸，现在可能醒悟过来，想要变得伟大。但是你写的那些经验，是生而伟大的经验，对大多数公司不管用。


    柯林斯听了这番话，觉得有道理。于是他重新去研究，有没有长期平庸的公司能够改变自己，变得伟大的？他为“长期平庸”定了一个标准，就是至少连续15年，业绩等或略低于市场平均水准。他为“变得伟大”定的标准是，业绩改变了，而且这个改变不是昙花一现，而是至少连续15年，业绩保持在市场平均水准的3倍以上。


    柯林斯有没有找到符合这两个标准的企业呢？有，但是是非常非常少。他研究了1435家企业，只找到了11家企业同时符合这两个标准。你算一算，不到百分之一。他去研究在这11家企业到底发生了什么，让它们实现了从平庸到伟大的飞跃。柯林斯把研究结果写了一本书，叫做Good
    to Great，又是全球畅销书，比《基业长青》卖得还好，因为平庸的企业占多数啊，都想学习一下，怎么够身一变，变成伟大的企业。


    Good to Great这本书，中文版叫《从优秀到卓越》。你现在可能听出来了，这个翻译错了，英文的Good在这里不是优秀的意思，而是“一般”、“平庸”。这11家公司，一开始不是优秀的公司，而是平庸的公司。所以，更准确的翻译，是“从一般到卓越”，或者“从平庸到伟大”。


    ### 2.企业的三环理论


    现在要说到三环理论了。柯林斯发现，这11家从平庸到伟大的公司，有六个说法。其中之一就是三环理论。什么是三环理论呢？


    柯林斯发现，这11家公司，有些一直是专业化的公司，有些本来是多元化的公司。但是，这些多元化的公司，都变成专业化的公司之后，才实现了从平庸到伟大的飞跃。也就是说，只有专业化的公司才可能从平庸到伟大。


    你可能会问了，那些多元化的公司，本来做好多业务，现在要专业化了，只做一个业务了，它们是怎么选择做哪一个业务呢？柯林斯研究发现，这些公司最后作出的选择，都好像是问了三个问题的结果：


    - 1. 我们做什么业务，有可能做成世界上最好的？不是说已经做成世界上最好的，而是说有可能做成世界上最好的。

    - 2. 我们对做什么最有激情？

    - 3. 柯林斯的原话是什么最能驱动我们的经济引擎？我用大白话翻译一下，就是，做什么最赚钱？


    柯林斯说，这些公司在每个问题下面都列出来两三个答案，最后选择的那一个业务，就是在这三个问题的答案中都有那个答案。你现在知道，为什么柯林斯称为三环理论了。就是画三个圆圈，把答案分别填到三个圆圈中，三个圆圈——也就是三个环的交叉之处，就是这些公司最后选择的
    AG业务。


    ### 3.个人的三环理论


    这个三环理论，是柯林斯发明的，他用来讲企业如何从平庸到伟大。我现在用这三个环来讲个人。一个从平庸到伟大，也要选择自己人生的主营业务，怎么选择呢？你要问自己三个问题：


    - 1. 我的擅长是什么？

    - 2. 我的热爱是什么？

    - 3. 我的机会是什么？


    这三个问题，跟柯林斯讲到的企业选择主营业务时三个问题是一一对应的。擅长、热爱、机会，这是个人的三环理论。


    认识自己，就是认识自己的擅长，认识自己的热爱，认识自己的机会。你画三个环，发现这三环的交叉地带，把它作为自己人生的主营业务。人生的主营业务有个更文雅的说法，叫做人生愿景。


    ### 4.发现自己的热爱


    克林顿很幸运，他画了三个环，擅长、热爱和机会，三个环里的项目其实都是一样的，只是排序不同，而且，还有一个明显的最佳选项。克林顿其实选择任何一项都能够做得不错，当然，他最后选择了最佳选项。


    发现热爱的事情，你要向自己三个问题：


    - 1. 我是不是很喜欢做这件事情，做起来是不是很愉悦？

    - 2. 我对做这件事情是不是很？

    - 3. 这件事情如果让我做上一辈子，我愿不愿意？


    如果这三个问题，你都是肯定的回答，那么这个事业，才是你热爱的事情。


    ### 5.领导力口诀：“我是谁”


    认识自己这项领导力修炼的口诀是“我是谁”。这是我们讲的第九句领导力口诀。“我是谁”包括三个核心问题：我的热爱是什么？我的擅长是什么？我的机会是什么？可完成这三个问题之后，你需要去发现有没有一个答案，可以同时回答这三个问题。这个答案，就是你的人生愿景。


    作为一个领导者，你不仅要问“我是谁”，还要去引导其他人问“我是谁”。换句话说，你要去问“你是谁”。但不是直接问“你是谁”，而是去问，你的热爱是什么？你的擅长是什么？你的机会是什么？你要引导其他人认识自己，发现他们的人生愿景。


    ## 总结：


    划重点


    > 这一讲讲的是认识自己的三环理论，这三个环是热爱、擅长和机会。你要努力发现三环的交叉之处，那是你的人生愿景。如果要成就伟业，你要热爱优先。


    最后，给你留一个作业。我知道，很多--人对于热爱优先仍然心存疑惑。那你想一想，如果不热爱优先，更好的做法是什么？如果要热爱优先，有哪些障碍，怎么克服？欢迎你留言分享。


    好，我是刘润，这是领导力课程的第29讲，我们下一讲再见。


