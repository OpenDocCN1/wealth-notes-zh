    06讲：区分领导与管理


    你好，我是刘润，欢迎来到我们的领导力课堂。这是第六讲。


    # 1.领导与管理


    我先问你一个问题：你是领导者还是管理者？显然，你要回答这个问题，先得回答另一个问题：领导和管理有什么区别？


    你可能会想，领导和管理有区别吗？我们平时不是经常把这两个词混用、交换着吗？比如我们可以说，任正非领导华为领导得很好。但是也可以说，任正非管理华为管理得很好。我们可以说，他是这个团队的领导者。但是也可以说，他是这个团队的管理者。好像领导和管理没区别。


    但是，领导和管理也有不能交换的例子。比如，我们说毛泽东领导了中国革命，但是没有人说毛泽东管理了中国革命。我们说管理一台设备，但是没有人说领导一台设备。


    # 2.沃伦·本尼斯的观点


    第一个领导力大师是沃伦·本尼斯。本尼斯地位很高，被称为“领导力大师们的院长”。就是说如果把领导力大师们集中起来成立一个学院，那么本尼斯是院长。


    本尼斯最著名的是这样一句话：“管理者正确地做事，领导者做正确的事。”这句话很有名，你也许曾经听过。但是有可能你听到的時候，这句话被说成是德鲁克说的。


    # 3.约翰·科特的观点


    管理者正确地做事，领导者做正确的事。这个观点，也可以说是领导者决策，管理者执行。另外有一个领导力大师站出来，不同意这个观点。这个大师叫约翰·科特，是我们要讲到的第二个领导力大师。


    科特说，领导是决策，管理是执行，这样想是错误的。他说，领导和管理是两个不同的过程，它们各自有自己的决策和执行。


    它们的不同在于：管理是维持秩序，领导是实现变革。这句话很重要。这就是科特的核心观点。我再重复一遍：管理是维持秩序，领导是实现变革。


    # 4.罗纳德·海菲兹的观点


    我觉得科特讲得比本尼斯更准确。还有个领导力大师，我觉得讲得比科特还要准确。他就是我们要讲的第三个领导力大师，叫罗纳德·海菲兹。他跟我有点特殊的联系。我毕业于哈佛肯尼迪学院，他也毕业于哈佛肯尼迪学院，毕业之后就一直在肯尼迪学院任教。


    海菲兹说，管理是解决技术性问题，领导是解决适应性问题。这是海菲兹的核心思想，这个思想就是受到了医学的启发。


    # 5.领导解决挑战性难题


    我一开始说了，我对领导和管理的区分是：领导是解决挑战性难题，管理是解决技术性问题。你现在发现了，我只是把海菲兹的说法稍微改了一下。


