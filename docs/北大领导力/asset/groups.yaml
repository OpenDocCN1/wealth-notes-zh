    # 05讲：领导力第一句口诀“我来”


    你好，我是刘润，这是我们的领导力课程的第五讲，今天我要给你介绍领导力修炼的第一句口诀，我来。


    ## 1.挺身而出，承担责任


    曾经有一个经理人向我提问，他说，“刘老师，我的团队当中每个人都想发挥领导力，我该怎么办？”我说，“我从来没有见过这样的团队，发挥领导力需要解决集体的难题，实现共同的目标，不是每个人都做的。你说的很可能是这样一种情况，他们每个人都想当领导”。


    不知道你有没有观察到这样一种现象，大多数人都想当领导，只有少数人发挥领导力。当领导意味着更高的地位，更大的权力，更多的金钱，这是大多数人都想要的。而发挥领导力，意味着挺身而出，承担责任，解决大家面对的一个集体难题，这只有少数人才有兴趣。如果...


    ## 2.说“我来”不是本性


    有人可能觉得，“我来”很容易，不就是两个字吗？张嘴就来，其实说“我来”是不容易的，这不仅仅是两个字，这是一种挺身而出，承担责任的心智模式，这不是大多数人的本性。


    - 追随者是随大流，人越多越安全，有利于在原始环境中的生存；

    - 追随者通过模仿来学习，避免了试错过程中可能带来的危险代价。比如说看见曹操去尝荤，这个时候追随者就比领导来得更安全。


    ## 3.案例：南多的领导力


    刚才我讲到的凶杀案是因为没有人说“我来”，所以变成了悲剧。下面我给你讲几个有人说“我来”的例子，因为有人说“我来”，因为有人挺身而出，所以变成了领导力的案例。


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_10_0.png)


    这个故事发生在1972年，有一架飞机从乌拉圭飞往智利，因为天气恶劣，坠毁在了安第斯山脉，这个飞机上有45个人，其中有5名机组成员，其他的人是一支大学...在飞机坠毁之后，45个人之中还有32个人幸存。


    - 他有想法，要自己走出大山，而不是等待救援；

    - 他有信心，在飞机失事的几天后，大家从收音机里听到消息，说救援者找不到他们，停止救援了。听到这个消息之后，大多数人都绝望了，都失去了目标。但是，南多没有，南多坚定了要走出大山的信心；

    - 他有行动，南多开始说服大家，鼓舞大家，让大家相信他的想法是可行的，组织大家做准备工作；

    - 他做表率，做好准备之后，他亲自带着一个同伴上路去寻求救援。


    ## 4.“让我来”与“跟我来”


    我再讲一个例子，遵义会议，这是你非常熟悉的历史事件，是中国革命的转折点。遵义会议也是这样一个案例，是毛泽东挺身而出说“我来”，而且说得既有勇气，又有技巧。


    “我来”可以有不同的说法，面对上级和上级，你可以说“让我来”。让我来干什么呢？让我来承担责任，解决组织面对的一个问题。在遵义会议上，毛泽东就相当说了“让我来”，他作为一个政治局委员，他没有坐在哪里等总书记和常委解决问题，而是挺身而出，承担解决问题责任。而且毛泽东很有技巧，根据当事人回忆，在遵义会议后，周恩来、张闻天都认为毛泽东可以当总书记，但是毛泽东说他不当，毛泽东挺身而出，他说的是“让我来解决问题”，而不是“让我来当领导”。这是毛泽东在当时非常有领导艺术的地方。


    我举一个商界的领导者的例子，贝佐斯。贝佐斯是世界知名的电子商务公司亚马逊公司的创始人，中国的电商公司是每年“双十一”的时候特别忙，美国的电商公司是每年圣诞节的时候特别忙，大概要送礼，要从亚马逊买很多东西。在那个时候，亚马逊在库房里分拣货物的工人会非常忙，非常地辛苦，亚马逊直接把救护车停在仓库的外面，因为工作强度太大了，很容易出问题。这个时候贝佐斯干什么呢？贝佐斯不是去慰问工人，而是亲自到库房里跟工人一起配运货物，这就是贝佐斯在说“跟我来”。这种“跟我来”，也就是我们经常说的以身作则。


    我给你讲了三个例子，南多、毛泽东、贝佐斯，他们有的领导大家绝境求生，有的是领导革命，有的是领导企业。他们做的事情看起来千差万别，从领导力的角度看，其实都是一样的，他们都做了这样一件事情，在具体面对一个难题的时候，他们挺身而出，承担责任，他们好像都说了这样一句话，“我来”。

    “我来”是我们修炼领导力的第一句话诀。


    ## 总结：


    ### 划重点

    - 说“我来”不是我们的本性。我们的本性是追随，我们要克服这样的本性，所以需要说“我来”。

    - 社会心理学上有一个发现，叫旁观者效应，也叫责任扩散效应。

    - 怎么说“我来”：一种说法是“让我来”，面对难题你挺身而出。但是要注意，是让我来发挥领导力，而不是让我来当领导。

    - 说“我来”，还可以说“跟我来”，“跟我来”有两种情况，一种是指示方向，一种是以身作则。


    最后给你留两个作业。

    第一个是思考题：除了“让我来”和“跟我来”，“我来”还可以怎么说？

    第二个是行动题，请你举一个你自己说“我来”的例子。如果举不出来，那你现在就找机会去实践一次。比如跟你的平级和上级在一起的时候，试着说一说让我来。

    欢迎你留言分享你思考和行动的结果。


