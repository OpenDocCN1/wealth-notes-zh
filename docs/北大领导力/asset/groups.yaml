    ## 22讲：反思的本质是对思考再思考


    22讲 反思的本质是对思考再思考


    好啦，最后总结一下，反思实际上为我们提供了一种从第一视角、从他人角度和从第三人称视角看待问题的能力。


    ## 1. 在行动中反思


    企业何时能够进行一次真正有效的反思？这取决于CEO的反思能力。反思能力不是与生俱来的，而是需要训练。反思是一种主动的、在行动中、在行动之后进行审视的习惯。


    ## 2. 反思的本质


    可能有人会问，为什么在反思中提到反思？反思的本质是什么？实际上，反思就是对思考本身的再思考。也就是对我们已有的经验、已有理解的再认识。


    ## 3 回头看一不是反思


    回头看不等于反思。很多人把复盘当成反思，但复盘只是对过去的回顾，而真正的反思是对思考方式的质疑和重建。


    ## 4 带着问题


    带着问题去思考，才能真正进行反思。问题是反思的起点，也是推动思考深入的动力。


    ## 23讲：反思的四大要素


    23讲：反思的四大要素


    你好，我是刘润，这是领导力课程的第二十三讲。在上一讲，我们剖析了反思的本质。在这一讲，我们更进一步，掌握反思的四大要素。


    很多领导力大师都强调反思，比如本尼斯就说：“反思也许是我们学习的关 键方式。”本尼斯还列举了一些反思的方式，他说，以下这些都是反思的方式，包括“回顾看，回忆，做梦，写日记，大声说清楚，看上周的球赛，征求意见，度假——甚至讲笑话”。


    听了他列举的这些反思方式，你的感受是什么？你可能比较高兴，因为你发现有些方式，比如写日记你也在用。你也可能比较困惑，因为你发现有些方式你不太会用，比如讲笑话。你想，怎么通过讲笑话来反思呢？


    我要告诉你，本尼斯既是对的，又是错的。本尼斯说的这些方式，可以是反思，但并不必然是反思。实际上，你如果想成为一个优秀的领导者，最重要的不是掌握某一 种或者几种反思的具体方式，而是掌握反思的要素。


    反思有四大要素，也可以说是反思的四个标准。符合这四大要素、四个标准的，就是反思。写日记和讲笑话，有时候符合，有时候不符合，所以有时候是反思，有时候不是反思。


    下面，我就具体给你讲一讲反思的四大要素，以及做到这四要素的一些技巧。


    ## 1.抽身而出


    我 在上一讲讲了，反思的本质是对思之再思。这是反思最核心的地方。反思的四大要素，其实就是把反思的这个本质进行具体的展开。套用一个流行的表达方式，就是打开反思的正确方式，一共是四步。


    第一步，也就是反思的第一大要素，是抽身而出。反思的本质是对思之再思，你先有一个思，然后对这个思进行再思，才是反思。但是，要做到再思，你首先要从已经有的那个思中抽身而出。所以，反思的第一大要素，是抽身而出，你要从你已经有的那个思中抽身而出。上一讲，我讲到了领导力大师海菲兹的一个比喻，叫做走上看台。所谓走上看台，就是从比赛中抽身而出。


    ## 2.放下情感


    我刚才讲了反思的第一大要素，是抽身而出。第二大要素是什么呢？是放下情感。放下情感，这个要素很重要。很多时候，妨碍你反思的，是你的情感。


    ## 3.转换角度


    你这样讲笑话，已经做到了反思的两大要素，抽身而出，放下情感。如果你能够满足另外两个要素，那讲笑话就是反思。另外两个要素是什么呢？第三大要素，转换角度。转换角度是反思的一个核心要素。反思的本质是对思之再思。你已经有了思，就是你已经有一个旧的角度，你现在对它进行再思，就是你要换一个角度来思考。


    ## 总结：


    刘重点


    反思有四大要素：第一个要素：抽身而出。有一个技巧叫反馈分析；第二个要素：放下情感。预演失败之所以是个好方法，因为它帮助我们放下情感；第三个要素：转换角度。你可以用换人思考这个技巧，它能够帮助你转换角度，还能够帮助你放下情感；第四个要素：指导实践。具备这四个要素才是反思。

