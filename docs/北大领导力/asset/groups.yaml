    # 总结


    我们已经讲了两句领导力口诀，“我来”和“我不知道”。现在我放在一起讲一讲。这两句口诀其实都是围绕领导力的定义——动员群众解决问题而展开的。


    我在第五讲讲了“我来”。我当时说，“我来”是承担责任，现在可以说得更明确了，“我来”是承担解决难题的责任。但是，难题不是一个人可以解决的，解决难题要动员群众。所以，“我来”也是我来动员群众。“我来”可以是让我来，让我来解决难题。“我来”也需要是跟我来，跟我来就是动员群众。


    # 划重点


    +   说“我不知道”有四种情况。

    1. 面对技术性问题，我不一定知道；

    2. 面对难题，我过去的答案不一定管用；

    3. 面对难题，我要动员群众发现答案；

    4. 面对难题，我即使知道，也说不知道，为了动员群众更主动地去实施答案。


