    # 1.一位学员的留言


    在我讲这四大特征之前，我要给你讲一个学员的故事。因为有了这个学员的留言，才有了这一次加餐。这个学员叫“Dr. Towns”，他/她在听了第18讲之后留言说，他/她之前犹豫过，“要不要订阅这么令人恐心
    的课”，学到现在他/她发现这门课很值，用他/她的原话说，是“这门学问不恐心，反而很看（啊，真看~）”。


    我这是第一次听人用“恐心”这个词来修饰领导力课程。我于是好奇地问他/她，那你当初为什么要订阅这门课呢？


    “Dr. Towns”这个学员回复了我，如如果领导力的关键词真的是“话术”、“权力”之类的，他/她内心是不喜欢的，但是如果学了可以帮他/她赚钱，他/她还是会学的。下面是他/她的原话：


    > 但是意外惊喜是，领导力是个很美好的东西，我以前误解了它，我相信这世上没有学过您教的这个课的很大一部分人也都误解了它。


    # 2.领导力求真：斯托克代尔悖论


    我对领导力的定义是八个字：动员群众，解决难题。我反复说这个定义，你应该印象很深刻了。这个定义本身就决定了，领导力是美好的。领导力的美好，可以用四个字来概括：真、善、美、难。你也可以说，这是领导力的四大特征。领导力之所以美好，就是因为它具备了这四
    meche特征：真、善、美、难。


    # 3.领导力求善：再说“希特勒问题”


    # 4.领导力求善：说说“冯仑的庙”


    # 5.领导力求美：创造力和独特性


    # 6.领导力求难：美好的东西往往很難


    前面三个特征，都说明领导力很难。领导力求真，不仅要自己直面残酷的现实，还要动员群众直面残酷的现实，这很难。领导力求善，不仅是造福自己，而且要造福社会，你解决难题的方式不是你死我活，而是要尽量做到双赢，也就是从二元对立的心智模式变成整合思考的心智模式，这很难。领导力求美，你要动员群众创造性地解决难题，这也很难。


    我想提醒你，领导力之所以是美好的东西，不仅仅是因为领导力求真、求善、求美，还因为领导力很难。真正美好的东西，就好像伟大的艺术作品一样，不是那么容易得到的。我们追求领导力，不只是求真、求善、求美，而且是求难。


    苏格拉底说，没有经过反省的人生不值得过。我改一下，我说：容易的人生不值得过。我再把其他三个特征加进去，完整地说一遍：不真、不善、不美、不难的人生不值得过。领导力是动员群众解决难题，你首先要把自己动员起来，把自己的人生创作成为一件艺术品。


    # 总结：


    划重点


    你们的留言帮助我认识到一个“我方立场偏差”，我需要大声告诉你们：领导力有四大特征，决定了它的美好。1.领导力求真，要求你直面难题，直面残酷的现实；2.领导力求善，要求你解决难题，为社会提供价值；3.领导力求美，要求你创造性地解决难题；4.领导力求难。解决难题很难，动员群众很难。


    刘润

    今天的作业是一个简单的行动题：

    领导力是美好的，请把这个信息分享给其他愿意追求美好的人。


    最后，感谢“Dr. Towns”和所有留言的学员，你们让我学到了很多。真的，你们的留言也许是我在这个课程中最大的收获。


