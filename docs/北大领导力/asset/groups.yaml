    2. 用人之长在操作上的两个重要原则：一个是容人之短，另一个是识人之异。

    3. 用人之长具体应用可以体现在四个


    ## 总结：


    +   1. 围绕用人之长，有两个思想上的误区：一个人可以全面发展；一个人在薄弱的地方能够取得更大的进步。

    2. 用人之长在操作上的两个重要原则：一个是容人之短，另一个是识人之异。

    3. 用人之长具体的应用可以体现在四个字：选育用留。


    最后我给你留一道思考题，这是我刚才提出来了但是没有回答的一个问题：

