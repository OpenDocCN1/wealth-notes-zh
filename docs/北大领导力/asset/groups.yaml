    # 08讲：领导力第二句口诀 “我不知道”


    你好，我是刘润，这是领导力课程的第八讲。主题是修炼领导力的第二句口诀 “我不知道”。


    你还记得第一句口诀是什么吗？是 “我来”。我来做什么？我来承担责任，我来解决难题。


    第一句口诀 “我来” 理解起来更容易，第二句口诀 “我不知道” 更难理解一些，使用起来的难度也更大。你也許有这样的印象，伟大的领导者比别人知道得更多，所以发挥领导力需要说
    “我知道”。这样想也有道理，我不否认，发挥领导力需要说 “我知道”。但是我想强调，发挥领导力还需要你在适当的时候说 “我不知道”。这是很多人所忽视的。


    领导者在哪些时候该说 “我不知道” 呢？主要有四种情况。


    # 1.面对技术性问题


    第一种情况，你面对的是一个技术性问题，而你不知道答案。


    一个组织要面对很多技术性问题，领导者不可能都知道答案。比如你是一个总经理，下属来请示一个财务问题，你就可以这么回答。你说：这个问题 “我不知道”，不过财务总监知道，你去问财务总监。


    我讲过，解决技术性问题靠权威。上级有时候是权威，有时候不是权威，不是权威的时候不要不懂装懂。


    我给你讲一个有趣的例子。老一辈无产阶级革命家习仲勋，也就是现任的国家主席习近平的父亲，在文革之后，有一段时间负责全国入常委会的立法方面的工作。文革之后百废待兴，要立很多法，但是当时大家水平不高，很多专业语言看不懂，比如把法理理解成法国人。


    # 2.面对挑战性难题


    刚才我说了说不知的第一种情况，就是面对一个技术性问题，你不知道答案。现在我讲第二种情况，你面对的是一个挑战性难题，你不知道答案。


    # 3.发现更好的答案


    刚才讲了两种说 “我不知道” 的情况，第一种是面对技术性问题，你真的不知道。第二种是面对挑战性难题，你需要放下自己过去的锤子，告诉自己这个问题很可能不是钉子，自己不知道答案。


    # 4.让团队成员自己 “组装” 答案


    还有第四种情况。尽管你已经有了答案，而且你百分百地坚信自己的答案就是最好的答案，下属怎么说也不可能比你的答案更好。在这种情况下，下属来问你：“俞总，这个问题该怎么解决？”
    你还是说：“我不知道。”


    # 总结


    我们已经讲了两句领导力口诀，“我来”和 “我不知道”。现在我放在一起讲一讲。这两句口诀其实都是围绕领导力的定义'
