    猫人哥曾俊龙 4

    这么看来，领导力是个系统。


    既然是系统。

    理解这个系统的构成就是关键。

    系统的构成，有三要素：要素、连接、功能


    +   1、要素：领导、群众

    2、目标：动员群众解决难题

    3、连接：交易型连接、改变型连接


    什么是交易型连接？满足群众的物质需求。

    什么是改变型连接？满足群众的精神需求


    连接是系统要素之间的关系。

    至于要用什么时候连接，取决于要面对的群众。

