    # 17讲：当老师的关键只有四个字


    17讲：当老师的关键只有四个字


    你好，我是刘润，这是领导力课程的第十七讲。我先问一下，你知道木桶原理吗？这个原理很流行，你很可能听说过。就是说一个木桶能装多少水，就决定于这个木桶上最短的那块木板。这个木桶原理也毫无疑问，它得出的结论，就是一个人或者一个团队、一个企业要弥补自己的短板。很多人喜欢拿这个木桶原理说事，但是我想告诉你，在绝大多数时候，人不是木桶，企业也不是木桶，这个木桶原理是错误的。


    在上一讲，我讲到了学校教育妨碍了领导者当老师，有三个危害，其中之一就是学校教育不强调用人之长，而是强调补人之短。木桶原理强调的就是补人之短，它之所以很流行，在很大程度上也是十几年的学校教育，把我们都教懵了的一个结果。我再强调一下，木桶原理是错误的，补人之短是错误的。领导者要做的不delimiter是补人之短，而是用人之长。


    用人之长很重要。如果说领导者当老师只有一个关键，那么这个关键就是四个字——用人之长。用人之长是你需要掌握的一个关键法则，因为它很关键，所以我们专门用这一讲来讲讲用人之长。


    我要从思想，到操作，到应用，一步一步，把用人之长给你讲清楚。具体说，我要讲两个思想上的误区，两个操作原则，还有四个实际的应用。


    # 1.两个思想误区


    我先讲思想，主要是排除两个思想上的误区。


    第一个误区，是认为一个人可以全面发展。用人之长这一法则有个假设，就是一个人的长处、优势是很少的，所以我们要围绕这少数的长处和优势来使用他。有人可能会想，一个人如果全面发展，有很多长处和优势不是更好吗？


    一个人可以全面发展，这个想法是一个误区，因为只有极少数的非常常见的天才，才有可能在好多领域都出类拔萃。这样的天才，在历史上也几乎没有几个人。我们就不要自己骗自己了，我们不是这样的天才。绝大多数人想要全面发展，最后只有一个结果，就是全面平庸。绝大多数人，如果想要样样精通，最后只能是样样稀松。


    第一个思想上的误区，是认为一个人可以全面发展。第二个思想上的误区，则是认为一个人在薄弱的地方能够取得更大的进步。上ii讲我举了一个例子，一个销售经理，也要负责销售团队的财务工作，他管理销售是90分，管理财务是70分。你可能会想，满分是100分，这个经理在销售上只有10分的提升空间，在财务上还有30分的提升空间，所以，他在自己薄弱的地方能够取得更大的进步。


    在上一讲，我说，他应该提升销售，而不是财务。当时我讲了两个理由，第一，他把销售提高10分，比把财务提高10分，对组织更有价值。第二，我还说，实际上，满分不是100分，工作上没有满分，所以在销售上他还有巨大的提升空间。


    针对我的第二个理由，你可能会说，如果没有满分的话，财务上他也有巨大的提升空间啊。这一点没有错。但是，他为什么应该提升销售而不是财务，还有一个理由我在上一讲没有讲。这个理由很重要，这个理由就是，对于这个销售经理来说，因为他擅长销售而不擅长财务，他在销售上提高10分，比在财务上提高10分要容易得多。所以，他还是在销售上，在自己擅长的领域有更大的提升空间。总的说来，一个人还是在自己擅长的地方，而不是薄弱的地方，能够取得更大的进步。


    # 2.用人之长的两个操作原则


    我刚才讲了妨碍用人之长的两个思想上的误区。一个是认为一个人要全面发展，另一个是认为一个人在薄弱的地方能够取得更大的进步。下面，我从思想层面进入操作层面，给你讲用人之长的两个重要的操作原则。这两个操作原则，我分别用一个故事和一个比喻来讲。


    这个故事是关于林肯总统的。林肯被公认为美国历史上最伟大的总统之一，他的一个伟大的功劳就是打赢了南北战争，维护了美国的统一。而之所以能够打赢南北战争，在很大程度上要归功于他任命了格兰特将军担任总司令。但是，格兰特将军有些毛病，爱喝酒。有人向林肯总统告状，说格兰特将军嗜酒如命，难当大任。据说林肯总统是这么回答的。林肯说：“如果我知道他喜欢喝什么牌子的酒，我会给他将军也送一两桶。”


    林肯总统的这个故事体现了用人之长的一个重要操作原则，就是：容人之短。每个人都有短处，如果他的短处不妨碍他发挥他的长处，那么我们就该容忍他。管理大师德鲁克甚至这样说，有时候，领导者存在的价值，就是容忍这样的下属的短处，而且帮助其他人容忍他的短处。


    我刚才用林肯总统的一个故事，讲了用人之长的一个重要的操作原则：容人之短。下面我用一个比喻，来讲用人之长的另一个重要的操作原则。这个比喻来自著名的咨询顾问马克·白金汉。


    白金汉说，他调研了大量的经理人之后，得出这么一个结论：平庸的经理人下跳棋，伟大的经理人下象棋。你想一想，跳棋和象棋的区别是什么？


    你可能想到了，最主要的区别，是跳棋的每个棋子都是一样的，走法都是一样的；而象棋的每个棋子都不一样，车走直线，马走日，各不相同，各有所长。白金汉是说，伟大的经理人善于发现和利用每个下属的不同之处。伟大的经理人下象棋，这个比喻体现了用人之长的另一个重要的操作原则，就是：识人之异。两个操作原则，一个是容人之短，另一个是识人之异。识人之异，就是要发现每个人与众不同的长处，而且巧妙地利用。


    我现在问你这样一个问题：激励人的最好方式是什么？在上一讲，我讲到德鲁克说，成就是激励人的最好方式。现在我告诉你白金汉是怎么回答的。白金汉说，要看激励的是谁，要因人而异。你觉得哪个回答更好？


    # 3.选育用留


    关于用人之长，我已经讲了两个思想上的误区，两个重要的操作原则，一个是容人之短，另一个是识人之异。我已经讲了思想，讲了操作，下面讲一讲具体应用。


    我所说的，领导者当老师的关键就是四个字，是用人之长。既然叫关键，就是说大量工作都应该围绕它来展开。确实是这样，比如说，我们常常把企业里跟人相关的工作概括为四个字。哪四个字呢？选育用留。选育用留这四个方面，都应该围绕用人之长来进行。怎么在选育用留里应用用人之长这个关键呢？我下面一个一个说。


    先说选，也就是招聘。招聘的时候怎么用人之长呢？那就是招人的时候主要看长处，不要求全。招人的时候主要看他能做什么，而不是看他不能做什么。


    我刚才讲到的象棋的比喻，其实也说明了在组织中，一个人的短处为什么不是那么重要。组织更像是象棋，而不是木桶。象棋中有一些棋子很弱，但是他们也有自己的长处，他们可以配合作其它棋子一起战斗。组织是一个团队，你不擅长的地方，组织中有其他人比较擅长。德鲁克说过这样的话：“组织存在的唯一目的，就是发挥人的长处。”这句话他也反过来说过，他说：“组织之所以存在，就是让你短处变得无关紧要。”


    选育用留，我刚才讲了选，现在讲育。育，就是培养，培训。你培训一个人，也要用人之长，就是针对他的长处进行培训。我前面举了一个销售经理的例子，他很擅长销售，不擅长财务。那你如果要培训他的话，是要他参加销售培训，还是财务培训呢？很多企业会让他参加财务培训，这可能是一个错误。我前面说过了，他在财务上可能很难提高，最好的做法也許是让他财务上协助他。就算他在财务上也可以提升，但是根据经济学上的比较优势原理，他在销售上的提升，对组织会有更大的贡献。


    选育用留，选和育都讲过了，现在讲用。选人、育人都要用人之长，用人就不用说了，当然也是用人之长。怎么用？你要把他用到他最擅长的工作上，而不是更高级的职位上。企业容易犯这样的错误，一个人干某个工作干得很
    well，然后被提到一个职位更高的工作上，但是也许这是个人并不擅长的工作。我们自己有时候也会面临这样的考验：要提到你做一个你并不擅长的工作，你去不去？


    选育用留，最后是留。怎么留人？也是用人之长。你可以用薪水留人，用感情留人，用文化留人，但是还有一个可能更有效的方法，就是让你做他擅长的工作，用工作来留人。因为他做的是自己擅长的工作，他每天起床都很快乐，很带劲，他会更愿意留下来。


