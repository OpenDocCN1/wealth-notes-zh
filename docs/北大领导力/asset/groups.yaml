    上一讲讲决策思考，我说要问为什么，找到问题背后的根本原因。这一讲讲系统思考，我也说问为什么，不过不是找原因为，而是要找到系统的目标，这是系统思考的起点。


    决策思考的“为什么”是找原因，我们可以称之为第一种为什么。系统思考的为什么是找目标，我们可以称之为第二种为什么。第三个石匠就是问了第二种为什么：我们为什么要采石头？他找到答案，是为了建造一座大教堂。那么，一切行动都要服从这个系统目标。


    # 总结：


    划重点


