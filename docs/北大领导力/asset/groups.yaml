    # 26讲：领导者要问的第二种“为什么”


    26讲：领导者要问的第二种“...”


    你好，我是刘润，这是领导力课程的第二十六讲。上Memory讲讲深思的第一种模式——决策思考，这一讲讲深思的第二种模式——系统思考。


    系统思考对于领导者很重要，但是，绝大多数人都不擅长系统思考。你想知道你的系统思考能力怎么样吗？我可以用一个小案例来测试你一下。这个小案例，我把它称‘史上最短管理案例’。


    # 1.最短管理案例


    这个案例是个小故事，本身只占用大约20秒钟，但是包含的道理特别深刻，特别丰富，而且对领导者来说特别重要。你也许听说过这个案例，有人可能给你讲过这个故事，用来说明某个道理。但是，很少有人真正搞清楚了这个故事在管理上的意义。这个故事在管理上的意义，我可以讲上一整天。今天我试一试，看能不能用十分钟左右的时间，给你讲清楚系统思考的三个要点。


    下面就是这个‘史上最短管理案例’：

    有三个石匠在打石头。有一个路人经过，问他们在做什么。第一个石匠说：“我在打石头，养家糊口。”“第二个石匠说：”我在做全国最好的石匠活。“第三个石匠抬起头，眼里闪烁着光芒，说：”我在建造一座大教堂。“


    好，案例本身就是这样。现在，假设你就是这三个石匠的领导者，他们是你手下的三个员工。请问，哪个石匠最让你放心？哪个石匠最让你担心？


    # 2.案例的答案


    你先想一想你的回答。在你想的时候，我交代一下这个案例的出处。这个小故事被用作管理案例，起源于管理大师德鲁克。后来呢，欧洲有个著名的管理学者，叫马利克，也分析了这个案例。


    # 3.整体大于部分之和


