    # 凸凹小怪兽


    我现在就用系统思考来分析一下我为什么要努力？先用我的坏的视角来看待系统问题：首先对于第三个石匠，可以理解为：对社会做贡献这个大局吧？对就是这个“为社会做贡献”这个词给我感觉恐怖，（是生理层面恶性反胃想吐心肺加快！）就是我想象中那种感觉被集体社会给分会割裂，把我们的个性都被抹杀了，把我们的时间和精力全部蛄去！就好像说：我要做社会的螺丝钉，还是永不生锈的螺丝钉！这样的诡谲难道没有人反感吗？


    我这样说可能会让很多人反感，然而我倒觉得他们是精神上的奴隶，问题可能出于自己吧，或许出于集体无意识，因为我的生态圈其实不用去打拼，不用去工作，我的家庭条件比较好，所以每当别人说：“你要为社会做贡献”我就想这就是一种价值绑架！对！对我来说：“为社会做贡献”就是一种道德绑架！所以我的女人生不过是被父母和哥哥们照顾我！虽然有人说我是负担，但是我这个担心“很轻”。我认为别人之所以这么说：为社会做贡献是因为他们不得已而为之，必须要赚钱嘛，然后鄙视那些“游手好闲”的人是因为他们嫉妒！是因为他们看不惯我们这样的人的“粗”（经济学概念）。


    对我而言抛弃了社会的 人生让我感觉很空虚，我的人生生态度很不好，我写的很多其它课的留言都没有进入精品，不是我的能力，而是我的态度问题。我确实可以感受身边人的好的一面，但是对于整个社会还是在内心是反思的，甚至有反社会心理的！就是以经历过的视角来看社会是黑暗的、贫穷的、是充满剽窃性质的，社会是一种夺取和利用的工具、又充满了诡言和狡诈！


    而我从社会这个幌子中看到了太多了太多的黑暗，给我带来很多伤害、被欺骗、被剥削、被利用。充满冷漠、充满无情、充满狡诈、充满虚伪！


    对我而言社会就是一个黑色而邪恶的巨大熔炉！！有人有资格批判我对社会的这个感情吗？


    现在看到我写到这里的人都会觉得我不是一个好人！确实这就是我用坏的视角去看待社会，对我有感情的人我可以看到别人好的一面，但是对于没有感情没有生命的“社会”却是一个冷冰冰的邪恶体！相信很多人会反感她，这或许就是一种文化价值观带来的另一种“我为视角偏差”吧...


    所以关于领导力我有一个问题：就是人是有生命的，而社会是没有生命的，有生命的东西有好的一面，利用那些好的让我也变好。但是社会这个没有生命的机器却没办法让自己成为其中的一个零件，这样是对自我的一种残化，所以适应社会而生是一种精神自杀行！逃道不是吗？


    我不知道有多少人明白这个“道理”，那就是任何事物都有其两面性！真、善、美、雄， 它的另一面必然是假、恶、丑、嫉！而我们所有人谁道也不都在这两面性中挣扎吗？


