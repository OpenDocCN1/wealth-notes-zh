    04讲：魅力不是前提，而是结果


    你好，我是刘润，欢迎来到我们的领导力课堂。这是第四讲。在上一讲我们讲了领导力和权力的不同，这一讲我们要讲领导力和魅力的不同。


    你现在如果方便的话，可以照一照镜子。你觉得自己有没有魅力？你看一看你周围的人，有多少人非常有魅力？我os想大多数人，都应该跟我差不多，不觉得自己很有魅力。


    如果你照了镜子，觉得你跟刘润老师差不多，不算很有魅力的話，我有两个好消息告诉你。第一个好消息：魅力不是发挥领导力的前提条件。你不需要有魅力，就可以发挥领导力。第二个好消息：魅力往往是发挥领导力的结果。也就是说，你如果发挥了领导力，你会变得更有魅力。


    如果你觉得自己很有魅力，属于所谓的魅力型领导者的话，那我要告诉你一个坏消息：魅力还可以是发挥领导力的负担。也就是说，有魅力可以妨碍你发挥领导力。


    这三个消息，就是魅力和领导力的三层关系。下面我就把这三层关系，具体地给你讲一讲。


    # 1.不需要有魅力，也可以发挥领导力


