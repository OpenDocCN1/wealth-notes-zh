    # 留言精选


    仨边的逍鹏 5

    我是大城市里的普通一员，每天朝九晚五兢兢业业，生活中心总是柴米油盐，聊的是明星八卦，有时如同断片一样记不得昨天发生了什么，却又会常常把去年和今年弄混。


    这种单调而贫乏的生活却因为一次偶然的机遇发生改变。我才知道原来除了听歌之外，还有人在提供另一种的声音，知识的声音。于是生活中开始出现了抑扬，

