    # 27讲：最高级的智商——整合思考


    27讲：最高级的智商——整合思考


    你好，我是刘润，这是领导力课程的第二十七讲。有一个管理学者，叫罗杰·马丁，是加拿大一所商学院的院长。他研究了50多位商业领导者。他说，如果一定要找出他们的一个共同点，那就是整合思考。


    我们这一讲，就讲整合思考。这是深思这项领导力修炼的第三讲。深思属于智商，而整合思考这种能力属于最高级的智商，比我们已经讲过的决策思考和系统思考更加高级，更难掌握。


    有人可能会问：你为什么要强调智商，不是说情商比智商更重要吗？我要告诉你，对于领导者来说，情商很重要，但是智商更重要。你可能见到情商很低也取得成功的领导者，但你绝不可能见到智商很低却能够成功的领导者。


    # 1.整合思考是最成熟的心智模式


    我刚才说，整合思考是最高级的智商。著名心理学专家罗伯特·凯德纳有一个类似的说法。他总结了四种层次的心智模式。他说，整合思考是最成熟的心智模式，而绝大多数人都不具备这种心智模式。


