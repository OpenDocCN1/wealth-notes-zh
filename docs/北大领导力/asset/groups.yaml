    更新微信：1561277539


    # 总结：


    # 划重点


    - 1. 权力就是让别人听你的，你能够让别人听你的，这就是权力。

    2. 我们讲了六种权力，有三种是跟职位联系在一起的，它们是合法权力、强制权力和报酬权力，有三种我们把它们称为个人权力，它们是参照权力、专家权力，还有信息权力。

    3. 前三种权力是领导力的推力，后面三种权力是领导力的拉力，领导力的高手主要用拉力，尽量让推力变得多余。


