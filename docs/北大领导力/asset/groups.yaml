    这一讲的主题是“我要改变什么？”这一句领导力口诀。我要提醒你注意，作为一个领导者，你不但要对自己用这句口诀，还要对别人用这句口诀。对别人用的时候，你需要改一下这句口诀的主语，你要问：“你需要改变什么？”


    这句口诀，经常需要跟上一句口诀“失败了？恭喜你！”一起用。你自己失败了，你对自己说“恭喜你”，但是你还需要问自己“你该改变什么？”你的下属失败了，你对他说“恭喜你”，但是你还需要问他“你该改变什么？”只有对失败进行反思，把失败当作学习的机会，失败才可能真正成为好事。


    # 总结：


    划重点


    反思的口诀是“我要改变什么？”你可以用这句口诀，引导自己、引导他人进行三个层次的反思：一是小反思，反思如何改变行动；二是中反思，反思如何改变目标；三是大反思，反思如何改变心智模式。在进行具体反思的时候，你可能需要进行反思升级，从小反思升级到中反思，从中反思升级到大反思。


    领导力行动口诀·七


    ![](img/a0f458f554c27afcbbe4a7f330c104ba_53_0.png)


    对应的领导力楷模：反思


    应用要点：领导者需要（引导他人）在三个层次上反思。自问己（和他人）：你要改变行动吗？你要改变目标吗？你要改变心智模式吗？


    最后，给你留两个作业。第一个是思考题，在英特尔这个案例中，葛洛夫和摩尔需要改变的心智模式是什么？我刚才问到了这个问题，但是没有直接回答，你试着回答一下。第二个是行动题，请你在一个具体事例上，实际应用一下反思升级。欢迎你留言分享。


