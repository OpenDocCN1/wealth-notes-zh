    # 12讲：领导力故事的两大要素


    12讲：领导力故事的两大要素 ↓


    你好，我是刘润，这是领导力课程的第十二讲。你还记得我对领导力的定义吗？领导力是动员群众解决难题。怎么动员群众呢？前面三讲我讲了一个基本的方法，要建立关系。从这一讲开始，我还是用三讲，讲一个更高的方法，叫做：讲故事。


    这一讲的主题是领导力故事的两大要素。这两大要素很重要，如果掌握了这两大要素，关于如何通过讲故事来发挥领导力，你就已经掌握了一半了。


    ## 1.为什么领导者要讲故事


    在讲这两大要素是什么之前，我先讲一讲为什么要用讲故事来发挥领导力。你想一想，领导力是动员群众解决难题，如果不讲故事，还可以讲什么？在现实生活中，我们经常使用另一种方式——讲道理。我们觉得，只要让别人懂得道理，他们就会行动起来。实际上，只懂道理，人往往是不行动的。


    我给你举个例子。你觉得坚持每周锻炼身体至少一次的人有多少？你坚持了吗？我做过很多次小调查，发现大概有三分之一的人会举手，说我每周至少锻炼一次身体。你说另外三分之二的人，懂不懂锻炼身体很重要这个道理呢？道理他们懂，但是他们不行动。


    为什么懂道理他们不行动呢？因为要让我们行动，尤其是要让我们行动起来，作出真正的改变，最重要的不只是动我们的理论，更是动我们的情感。那为什么打动情感比打动理智更能让我们行动？这个原因就很古老了，这个原因来自我们人类的本性。


    因为我们人是从猴子进化而来的，你知道，猴子没有理智，但是有本能、有情感，猴子的行动不是因为理智，而是因为本能和情感。人跟猴子不一样，有了理智来指导行动，当然很伟大，但是，猴子变成人，不说理智代替了情感，而是在大脑里的情感系统依然存在，只是在上面新增加了一个理智系统。但是，这个新的理智系统往往战胜不了情感。


    首先情感系统更古老，理智系统是新长出来的，遇到问题，大脑首先启动的还是情感系统。即使大脑有时候启动了理智系统，但是因为理智系统是最后进化出来的，是比较新的系统，大脑使用起来也不够熟练。


    所以，因为进化的原因，尽管理智也可以让我们行动，让我们改变，但是情感更能够让我们行动，让我们改变。如果理智和情感发生冲突，你说谁会赢家？一般来说，是情感。


    我给你举一个例子。有一个心理学家叫齐纳森·海特，写过一本非常好的心理学的书，叫《象与骑象人》。这本书的主题之一就是理智和情感的冲突。海特举了一个发生在他自己身上的例子。他读研究生的时候，读了一本书，这本书提到一个观点，就是人规模的畜牧养殖对动物来说是不道德的。海特从理智上完全被这本书说服了。他认同规模的畜牧养殖是不道德的。但是他也发现，自己道德上反驳，行为上没有改变，还是很喜欢吃肉。


    但是，有一天，他看到了一段屠宰场杀动物的影片。我给你读一下海特的原话，他这样说他的感受：“当我看到成群的牛走向滴着鲜血的胶解传送带，先是受到重击，然后被钩了勾起，最后被切成一片又一片，我内心的恐惧达到最高点。”看完影片之后，他彻底变成了一个素食主义者。


    你看，尽管海特的理智被说服了，但是他没有改变行动；只有当海特的情感被打动之后，他才改变了行动。


    ## 2.打动情感的两大要素


    所以，领导者要动员群众改变，最重要的任务不是打动理智，而是打动情感。我所说的领导力故事的两大要素，其实就是打动情感的两大要素。


    打动情感的要素貌似很多，如果让你提炼为两个，你觉得会是哪两个？我给你说一说我提炼出来的两大要素。这两大要素，也都来源于我们人类进化而来的本性。


    第一大要素是形象，越形象的事物越打动我们的情感。


    为什么呢？还是回到进化上。人是猴子变过来的，猴子是不懂抽象的东西的。你跟猴子说香蕉，它不知道你在说什么，但是如果你给猴子看看香蕉的图片，你就能唤起它的本能，打动它的情感。


    比如说，我动员你给希望工程捐款。我给你说乡村有多少失学儿童，或者正在上学的山区孩子有多少人买不起学习用品，当然也能打动你的情感。但是，这些话可能就不如一张形象的照片更能够打动你的情感。你一定记得希望工程有张著名的照片，“大眼睛女孩”。那个大眼睛女孩的形象，起到了胜过千言万语的作用。为什么？因为形象打动情感。


    打动情感的第一大要素是形象，第二大要素是距离。我们越近的事情越打动我们的情感。这个距离包括物理上的距离，但主要是心理上的距离。


    比如说，非洲也有类似希望工程这样的项目。让你给非洲的希望工程捐款，就不如让你给中国的希望工程捐款更容易。你说这是为什么？要解释这一点，还是回到进化，回到人的本性。因为人是从猴子变过来的，我们最早的认同就是认同身边的这些猴子，身边的这个群体，这个部落。我们跟他们有更深厚的情感联系。距离越近，往往意味着情感的共鸣会越大。


    所以，好故事的第二要素就是距离，距离越近的故事越能打动情感，越能引起情感的共鸣。


    ## 3.案例：鹰的重生


    我刚才讲了打动情感的两个要素，一是形象，二是距离。这也是领导力故事的两大要素。


    领导力是动员群众解决难题，需要动员群众改变，打动情感比打动理智更重要。在这个过程中，需要讲故事。讲故事的目的不是娱乐大家，所以故事的情节是不是一波三折不重要，只要打动情感就达到了目的。所以领导力故事的两大要素之中不包括情节，而是形象和距离。


    你有没有听过一个故事，叫做“鹰的重生”？这个故事在企业界流传很广，很多人都听说过。这个故事流传开来，要归功于一个人，李东生。李东生是TCL集团的创始人，他在2006年讲了这个故事，把这个故事讲出名了。后来TCL成立30周年，出版了一本企业史，就叫《鹰的重生》。显然，TCL已经把这个故事看作了自己的象征。


    这个故事的传播效果是很好的，但是你要注意，这其实不是一个好的领导力故事。这个故事不长，两分钟不到，我给你读一遍这个故事。你在听的时候，想一想：这个故事的问题出在哪里？我提示一下，你要用我刚才才讲过的领导力故事的两大要素。好，我开始读了：


    这是一个关于鹰的故事。鹰是世界上寿命最长的鸟类，它一生的年龄可达70岁。


    要活这么长的寿命，它在40岁时必须作出困难而重要的决定。

    这时，它的喙变得又长又弯，几乎碰到胸膛；它的爪子开始老化，无法有效地捕捉猎物；它的羽毛长得又浓又厚，翅膀显得十分沉重，使得飞行十分吃力。

    此时的鹰只有两种选择：要么等死，要么经过一个十分痛苦的蜕变过程 150天漫长的蜕变。它必须很努力地飞到山顶，在悬崖上筑巢，并停留在那里，不得飞行。鹰首先用它的喙去打岩石，直到其完全脱落，然后静静地等待新的喙长出来。鹰会用新长出来的喙把爪子上老化的趾甲一根一根拨掉，鲜血一滴滴洒落。当新的趾甲长出来后，鹰便用新的趾甲把身上的羽毛一根根拔掉。

    5个月以后，新的羽毛长出来了，鹰重新开始飞行，重新再度过30年的岁月！


    好，这个故事讲完了。你用领导力故事的两个要素来想一想，《鹰的重生》这个故事的问题在哪里？你现在应该想到了，领导力故事有两个要素，一是形象，二是距离。《鹰的重生》尽管很形象，但是讲的是动物的事情，离我们的距离很远，很难让李东生的听众，也就是TCL的员工，建立深层次的情感的共鸣。


    ## 4.动物寓言故事不是好故事


    我提醒你注意，我下面要讲一个新的要点。之前，我把讲道理和讲故事对立起来，其实不完全是这样的。


    李东生在给TCL的员工讲《鹰的重生》的时候，在故事后面加上了一句话，李东生说：这篇有关鹰的文章让我感触颇深，由此更加深入体会到TCL此次文化变革创新的必要性和紧迫性。


    你有没有看出来这句话其实很重要？这句话说明，李东生其实是用这个故事来讲道理的。什么道理呢？就是文化变革创新的必要性和紧迫性。之前，我把讲道理和讲故事对立起来，现在你发现了，讲道理和讲故事并不完全对立，道理当中尽管没有故事，但是故事当中往往是有道理的。


    故事之中有道理，所以讲故事不但打动情感，而且打动理智。而且，故事把道理隐藏在故事之中，让你在不知不觉中接受道理，比直接


    故事之中有道理，所以讲故事不仅打动情感，而且打动理智。而且，故事把道理隐藏在故事之中，让你在不知不觉之中接受道理，比直接讲道理可能更有效。你现在应该更理解讲故事的重要性了。因为故事当中和方法，它同时打动理智和情感。


    《鹰的重生》这个故事，的确也在一定程度上同时打动理智和情感。但是，它因为距离的问题，打动情感的力量其实不是特别强。而且，它还因为距离的问题，打动理智的力量也不是那么强。


    你知道吗，《鹰的重生》这个故事是编的，鹰不是这样的。退一万步说，即使这个故事是真的，也不能说明李东生想说明的道路，也就是他所说的TCL文化变革创新的必要性和紧迫性。


    为什么呢？因为鹰是鹰，TCL是TCL，适合鹰的不一定适合TCL，这还是刚才说过的距离问题。你讲给鹰的故事，说鹰要变革，所以TCL要变革，那我给你讲个乌龟的故事吧，我说乌龟不变革，活得比鹰还长，那是不是TCL就不用变革了呢？


    你现在可能发现了，形象和距离不仅帮助打动情感，而且帮助打动理智。越形象的故事，讲的道理也更具体。离听众距离越近的故事，讲的道理也越有说服力。


    # 总结：


    ## 划重点


    动员群众改变，打动情感比打动理智更有效。而讲故事可以同时打动理智和情感。


    领导力故事有两大要素，一是形象，二是距离，离听众的距离要近。


    《鹰的重生》这样的动物寓言故事因为离听众距离远，不是有效的领导力故事。


    最后留一个作业：你的上级或者你本人曾经讲过动物寓言故事吗？你觉得起到预期的作用了吗？欢迎你留言分享。


    好，我是刘润，这是领导力课程的第十二讲，我们第十三讲《领导力故事中要有一面镜子》再见。


