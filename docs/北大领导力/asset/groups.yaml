    # 14讲：领导力第四句口诀“我讲个故事……”


    14讲：领导力第四句口诀“我讲…


    你好，我是刘润，这是领导力课程的第十四讲。这一次讲要讲领导力修炼的第四句口诀“我讲个故事……”，是讲故事这个主题的最后一讲。我要介绍三种特别的讲故事的方式。


    你要注意，“我讲个故事”这句口诀后面有个省略号。什么意思呢？提醒你要讲个故事。所有的领导力口诀都是用来提醒你行动的。这句口诀，就是提示你要讲个故事。你可以说，我讲个故事，然后讲个故事。你也可以不用说这句话，直接讲个故事。


    实际上，你都可以不用说话，就能够讲一个故事。我要强调的是，领导者要讲“故事”，只要包含形象和距离两个要素，就是领导力故事。你不一定要非用嘴讲。最高明的讲故事，往往并不只用嘴讲。我要讲的这三种特别的讲故事的方式，都不是用嘴讲故事。


    # 1.三种特别的讲故事方式


    在具体说这三种特别的讲故事的方式之前，我先说一下领导力学者约翰·科特的一个观点。我之前在讲领导和管理的区别的时候提到过科特，他是最著名的领导力学者之一。


    当时我给你讲了，科特强调领导力是变革。但是当时我没有讲，科特后来提出一个观点，他说很多人认为有效的变革是分析-思考-改变这条三步步骤。第一步分析，第二步思考，第三步改变。就是领导者让群体通过分析，产生思考，思考清楚了就发生改变。


    科特认为，这个分析-思考-改变是旧的变革模式，是不太管用的变革模式。科特说，更管用的模式不是分析-思考-改变，而是目睹-感受-改变，让你群体亲眼目睹一些形象，然后感受到情感的冲击，最后更能发生改变。目睹-感受-改变，这条三个步骤，是科特提出来的新的变革模式。


    科特根据这个新的变革模式，写过一本书，叫《变革之心》。你是否注意到，这里的变革之“心”的“心”字是一语双关？它既是说这是变革的核心，也是说要让你变革，千要是从打动你的心，打动你的情感。


    科特所说的分析-思考-改变就是我说的讲道理，他所说的目睹-感受-改变就是我说的讲故事。传统的讲故事可以说是让人倾听-感受-改变，也是三步。科特把它变成目睹-感受-改变，目睹是用眼睛看，这比用耳朵听更加形象，而且目距往往也更加近，因此更能打动情感。科特这个新的变革模式，也的确有些新意。


    但是我也要请你注意，科特的说法还不够好。讲故事不一定局限在目睹，实际上还有比目睹更能够打动情感的例子。什么比目睹更能打动情感呢？那就是体验。我可以把科特的目睹-感受-改变升级一下，升级为体验-感受-改变。


    我们现在实际上有了三个讲故事的模式，第一个是要用嘴讲的，是倾听-感受-改变，后面两个模式，一个是科特的目睹-感受-改变，另一个是我的体验-感受-改变，都不是用嘴讲故事。


    现在我可以跟你说三种特别的讲故事的方式是什么了。第一种是用道具讲故事，这属于目睹-感受-改变，第二种是用仪式讲故事，第三种是用行动讲故事，这两种都属于体验-感受-改变。


    # 2.用道具讲故事


    我先说用道具讲故事。我给你举一个我亲身经历的例子。2011年，我参加了哈佛商学院的年度领导力论坛，这个论坛有一个环节，就是要每个人用一个东西，来讲自己一个价值观。这个环节事先通知了大家，让大家带着这个东西去。大家分成小组，先是小组讲，然后小组代表给大家讲。


    我旁边的小组站起来一个代表，他叫凯尔·斯努克，来自西点军校，曾经在阿富汗服役，担任排长。阿富汗算是美国的前线啊。斯努克站起来，手里举着一只靴子。他说：“在阿富汗，我有这样一个价值观，凡是我自己不愿意亲自去做的，我也不会让我的下属去做。所以，巡逻的时候，我常常是走在队伍最前面。”


    这里我先打断一下斯努克的故事，你有没有听出来，斯努克是在应用我讲过的一句领导力口诀呢。是哪一句呢？对了，是“我来”，也是“我来”的更具体的形式，叫“跟我来”。


    斯努克说：“所以，巡逻的时候，我常常是走在队伍最前面。那一天，我就是在巡逻的时候，走在队伍的最前面，右脚穿着这只靴子，踩上了一颗地雷……”


    听到这个地方，我一下子被震撼了。我之所以被震撼，这只靴子起到了很大的作用。你觉得这只靴子起了什么作用？我提示你一下，领导力故事的两大要素是什么？你应该还记得，一是形象，二是距离。斯努克用这个靴子做道具，不仅让他的故事更加形象，而且让他的故事距离听众距离更近。这个故事本来发生在遥远的阿富汗，但是这只伸手就可以摸到的靴子，好像把阿富汗带到了我们面前一样。


    这是第一种特别的方式，不只是用嘴讲故事，而且用跟你的故事密切相关的一个道具来讲故事，让大家目睹，可以让你的故事更形象，离大家的距离更近，因此更能够打动大家的情感。


    顺便问一下，斯努克这个故事是四种领导力故事中的哪一种？我 absorber 你不难发现，是“我是谁的故事”。


    # 3.用仪式讲故事


    我刚才讲的用道具讲故事，属于科特所说的目睹-感受-改变。我下面要讲的另外两种特别的讲故事的方式，一个是用仪式讲故事，另一个是用行动讲故事，就是我所说的体验-感受-改变的例子。


    用仪式讲故事，就是把故事变成一个仪式。有许多公司，在新员工加入公司的时候，会带他们经历一些仪式，这就是用仪式讲故事。用仪式讲故事有什么好处呢？我们再复习一下，领导力故事的两大要素是什么？对了，还是形象和距离。仪式把故事动了起来，更形象了，而且，更关键的地方在于，仪式让你——也就是听故事的人——也动了起来，让你成为故事的一部分，让你跟故事的距离更近了。让你不只是目睹，而且是体验这个故事，让你的情感受到更大的冲击。


    关于用仪式讲故事，我有个建议，就是仪式不要太简单。如果仪式太简单，就不够形象，让参加仪式的人体验得不够深，这样对情感的冲击就不足够大。


    # 4.用行动讲故事


    我要讲三种创新的讲故事的方法，我刚才已经讲了两种，用道具讲故事，用仪式讲故事。下面我要讲第三种，这也是最有冲击力的讲故事的方法，用行动讲故事。


    关于海尔公司，你听说过的最著名的故事是什么？我问过很多人这个问题，大多数人的回答都是砸冰箱。砸冰箱这个行动，就是张瑞敏用行动讲故事。它跟用仪式讲故事的区别是什么？用仪式讲故事，是用仪式重复一个以前的故事，是大家以前干过的。用行动讲故事，是用戏剧化的行动，现场创造一个新的故事，并且让你加入到行动之中，给你更加强震撼的现场体验，让故事更形象，跟你的距离更近，让你的情感受到更大的冲击。


    在上一讲，我说有四种领导力故事，我是谁的故事，我们是谁的故事，我们向何处去的故事，我们为什么要变革的故事。前三种故事我都举了例子，第四种我没有举。为什么没举呢？我留到现在来举——砸冰箱就是一个典型的我们为什么要变革的故事。这个例子，也是典型的用行动讲故事的例子，所以放到了这一讲。


    张瑞敏要讲这样一个故事：我们为什么要变革？因为我们的冰箱质量太差了。我们不仅目睹，而且行动起来体验这个过程。对于围观砸冰箱的海尔员工，这是目睹-感受-改变；对于动手砸冰箱的人，这就是体验-感受-改变。对于所有人，这都是一个非常形象而且距离超近的故事。


    我在上一讲，举了星巴克的创始人舒尔茨讲故事的两个例子。舒尔茨是个讲故事的高手。我再举一个他用行动讲故事的例子。我上一讲讲过了，2008年金蝉危机爆发，星巴克遇到困境，舒尔茨重新出山担任CEO。他后来回忆，他当时做的一件起到关键作用的事情，是带了1万个店经理，到新奥尔良进行了一周的社区服务活动。新奥尔良在2005年遭遇飓风袭击，到2008年，还有很多重建工作需要做。舒尔茨在自己的店遇到危机的时候，反而带着1万个店经理，到新奥尔良做了一周的社区服务，为什么？


    舒尔茨是要星巴克的员工重新认识他们的价值观。他们的价值观是什么？前面说过了，是建立人和人之间的联系。我们为新奥尔良的灾民服务，就是建立人和人之间的关系。我们在星巴克卖咖啡，做得也是这件事。舒尔茨高明的地方，就是他不仅要让员工知道这一点，而且要让员工体验这一点。舒尔茨是在用行动讲故事。这个故事是一个“我们是谁”的故事。'
