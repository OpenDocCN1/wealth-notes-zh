    ## 30讲：成为领导者就是成为自己


    30讲：成为领导者就是成为自己


    你好，我是刘润，这是领导力课程的第三十讲。这一讲的主题是成为自己。


    ### 1.become yourself


    有一本书讲领导力的书籍，作者也是一个很有经验的企业领导者。他说，他给年轻人的建议是：做你自己。用英文说，就是be yourself。你可能也在别的地方听到过类似的建议。你觉得这个建议怎么样？


    我觉得这个建议一一不好。做你自己，到底是什么意思？我现在难道做的不就是我自己吗？如果说，这个建议的意思是让一个人不要装的话，我觉得它没有抓住作为领导者的关键。成为领导者的关键不是做你自己，而是成为你自己。做你自己跟成为你自己的区别在哪里？做你自己是be
    yourself，是表现出一个状态；成为你自己是become yourself，是一个打造自己的过程。


    我甚至可以说，成为一个领导者就是要装。你装成一个更好的自己，一个你理想中的自己，一个形貌要求你做到的自己。你装一辈子，直到装成功。这个过程，就是成为自己的过程。


    领导力大师沃伦·本尼斯说过一句话：“成为领导者就是成为你自己，就是那么简单，也就是那么困难。”单独听这句话，不太好理解。管理大师德鲁克·圣吉在跟我对话的时候，说了一句话，我印象特别深。他说，我们不是生而为人的，我们要花费一生的时间来成为人。你把本尼斯和德鲁克·圣吉这两句话放在一起，就比较好理解了。


    做你自己，be yourself，是表现在现在的自己，这并不很难。而成为你自己，become yourself，是塑造一个理想的自己，是花费一生的时间的一个过程，在这个过程当中充满了困难。


    成为自己有很多困难，我概括了三个主要eking的困难。这三个困难，具体说是三种两难选择。下面我一个一个讲。


    ### 2.成为哪个自己


    成为自己的第一个难题，是：我该是我想成为的自己，还是别人想我成为的自己？这个难题，可以称之为在“自我对别人”的两难选择。


    你对人生愿景有自己的想法，但你的家人对你的未来可能另有规划，这是最常见的一个冲突。但是还有另一种可能，就是作为领导者，你的追随者对你的期望，跟你自己对自己的期望不一样。面对“自我对别人”的冲突，你该听自己的，还是听别人的？我的建议是一一听三环的。上－讲，我们讲了三环理论。这三个环，你既可以用采规划组织的未来，也可以用来规划自己的未来。


    上一讲我给你讲了美国前总统克林顿的故事，这一讲我给你讲讲的副总统戈尔的故事。


    ### 3.选择结果还是原则


    我刚才讲了成为自己的第一个两难选择，是自我对别人。成为自己的第二个两难选择，是结果对原则。我们每个人的内心都有两个小人，一个小人追求结果，另一个小人坚持原则。我们常常面临这样的难题：我该是追求结果的自己，还是坚持原则的自己？


    ### 4.选择哪个原则


    我刚才讲了，成为自己的第二个两难选择是结果对原则。可是，不仅仅是结果和原则会冲突，原则和原则也会发生冲突。这是成为自己的第三个两难选择：原则对原则。我该是坚持这个原则的自己，还是坚持那个原则的自己？


    ### 5.领导力口诀：“我该是谁？”


    我刚刚说了成为自己的三个两难选择。这三个难题，都可以用一句领导力口诀来帮助思考。这就是我们的第十句口诀：我该是谁？第一个难题，我该是自己想要成为的自己，还是别人想要我成为的自己？第二个难题，我该是追求结果的自己，还是坚持原则的自己？第三个难题，我该是坚持这个原则的自己，还是坚持那个原则的自己？你对这三个难题的每一次回答，每一次选择，都是你对自己的一次塑造，都是成为自己的一个过程。


    ## 总结：


    划重点


    我们花费一生的时间成为自己。成为自己就是问“我该是谁”。在成为自己的过程中，有三个“我该是谁”的两难选择，分别是自我对他人，结果对原则，原则对原则。


