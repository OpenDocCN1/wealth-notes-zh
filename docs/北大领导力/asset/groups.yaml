    ## 留言精选


    ### 一杯白开水


    华为给任正非写万言书的新员工，若是把他比作第四个石匠，相当于这个第四个石匠在说：“我有刚好的教会设计和建造方案，希望能按照我的设计来搭建” 这第四个石匠，直接否定了整体，比忽视整体更危险。


    这节课的“为什么”，和上节课不断追问问题源头的“为什么”不一样，今天的“为什么”，是指“为什么一定要这么做？”如此不断追问，可以追问出最上层的整体目标。最后审视，自己的部分，有没有在以整体为向导去工作。1:58


    ### 凸凹小怪兽


    我现在就用系统思考来分析一下我为什么要努力？先用我的坏的视角来看待系统问题：首先对于第三个石匠，可以理解为：对社会做贡献这个大局吧？对就是这个“为社会做贡献”这个词给我感觉恐怖，（是生理层面恶性反胃想吐心肺加快！）就是我想象中那种感觉被集体社会给分会割裂，把我们的个性都被抹杀了，把我们的时间和精力全部蛄去！就好像说：我要做社会的螺丝钉，还是永不生锈的螺丝钉！这样的诡谲难道没有人反感吗？


    我这样说可能会让很多人反感，然而我倒觉得他们是精神上的奴隶，问题可能出于自己吧，或许出于集体无意识，因为我的生态圈其实不用去打拼，不用去工作，我的家庭条件比较好，所以每当别人说：“你要为社会做贡献”我就想这就是一种价值绑架！对！对我来说：“为社会做贡献”就是一种道德绑架！所以我的女人生不过是被父母和哥哥们照顾我！虽然有人说我是负担，但是我这个担心“很轻”。我认为别人之所以这么说：为社会做贡献是因为他们不得已而为之，必须要赚钱嘛，然后鄙视那些“游手好闲”的人是因为他们嫉妒！是因为他们看不惯我们这样的人的“粗”（经济学概念）。


    对我而言抛弃了社会的 人生让我感觉很空虚，我的人生生态度很不好，我写的很多其它课的留言都没有进入精品，不是我的能力，而是我的态度问题。我确实可以感受身边人的好的一面，但是对于整个社会还是在内心是反思的，甚至有反社会心理的！就是以经历过的视角来看社会是黑暗的、贫穷的、是充满剽窃性质的，社会是一种夺取和利用的工具、又充满了诡言和狡诈！


    而我从社会这个幌子中看到了太多了太多的黑暗，给我带来很多伤害、被欺骗、被剥削、被利用。充满冷漠、充满无情、充满狡诈、充满虚伪！


    对我而言社会就是一个黑色而邪恶的巨大熔炉！！有人有资格批判我对社会的这个感情吗？


    现在看到我写到这里的人都会觉得我不是一个好人！确实这就是我用坏的视角去看待社会，对我有感情的人我可以看到别人好的一面，但是对于没有感情没有生命的“社会”却是一个冷冰冰的邪恶体！相信很多人会反感她，这或许就是一种文化价值观带来的另一种“我为视角偏差”吧...


    所以关于领导力我有一个问题：就是人是有生命的，而社会是没有生命的，有生命的东西有好的一面，利用那些好的让我也变好。但是社会这个没有生命的机器却没办法让自己成为其中的一个零件，这样是对自我的一种残化，所以适应社会而生是一种精神自杀行！逃道不是吗？


    我不知道有多少人明白这个“道理”，那就是任何事物都有其两面性！真、善、美、雄， 它的另一面必然是假、恶、丑、嫉！而我们所有人谁道也不都在这两面性中挣扎吗？


    有时我们很难证明到底哪一面是对自己有利的一面……（这其中取决于你所在的的环境和时势）


    我再用好的一面去看待这一句：“为社会做贡献”


    现在问题来了：我要为哪个社会在什么时候做出什么样的贡献呢？这种“贡献”是不是对社会真有点意义呢？是什么样的机构呢？比如社会机构？福利机构？工会？慈善机构？消费主义？而且这种贡献是可以长期考察的吗？对什么样的听群有利益呢？把这个贡献放到种族、自然环境中再重新参考下呢？


    所以说：“为社会做贡献”这个‘真理’本身就是一个可证伪的！我再说一遍：是可证伪的！！


    以我看来：“为社会做贡献”是一种苍白的无力的虚伪的一个形容词！


    所以我们的价值观决定了我们看待社会的角度；而社会向我们散开的角度恰恰造就了我们对于社会的价值观；这是一个相辅相成的共生关系！


    老师！您一直在强调理论上的合理性，而且所谓的领导力感触也只是“高大上”层次的感性因素，这些因素放到大多数人当中用人的现实上，真的现实需要的多“用吗？”高大上的领导力真的能给大多数人的生活带来实质性的利益吗？脱离了这样的利益谈领导力不是显得太虚无飘渺了吗？您有没有真正体会过别人真实的感情呢？！真正引导大多数人的是现实利益啊！


    老师您就用领导力来动员我好好努力吧？现在我就想一下我没学过领导力又没有经济问题又是被社会给伤害过，您能动员的了我努力吗？您可别说什么是“为社会做贡献”这样的话啊！


    那些高大上的感情因素和个人不同的价值观恰恰是“反领导力”吧，或者说就是：“分散力”


    可能动员“领导力”最大的问题是在于我们看待这个社会的真实感情吧……也就是说所谓的“第一因，或者第一性原理”


    那现在我还能再趣一点，我想问得道的同学们：咱他大家这样拼命的学习，可能我们觉得很高大上吧，少数终生“学习”的我们真的是那个少数“精英”吗？我们学什么？以及我们对自己塑造的高大上的人生态度和目标当初真能给我们带来最大幸福吗以及最大利益吗？或许有人说我们可以创造别人没有的价值，关键是你得先创造出来再说啦！这句话没有说过：现在说大家沉浸在一家自己满足感和对未来有一种掌控感的意境中呢？


