    你好，我是刘润，这是领导力课程的第九讲。我前面讲过对领导力最大的误解，就是把领导力跟职位挂上等号。这一讲呢，我首先要破除一个稍微小一些、但是依然很大的误解，就是认为领导力是领导者一个人的事情。


    比如，你会经常听见有人说，伟大的领导者需要具备什么什么样的品质。意思是说，你只要具备了这些品质，就能成为一个伟大的领导者，就能有效地发挥领导力。这种说法的问题在哪里呢？你还记得我给领导力下的定义吗？我
    说领导力是动员群众解决难题。


    你应该记住这个定义。我会反复地使用这个定义。之前我用这个定义解决了希特勒问题，现在我用这个定义来消除这个误解。领导力是动员群众解决难题，这个定义就告诉我们，领导力不是一个人的事情，领导力是领导者
    和群众双方的事情。换句话说，领导力是一种关系。


    从这一讲开始，我们重点关注怎么动员群众。怎么动员群众呢？首先就要知道，领导力是一种关系，而且要知道怎么建立领导力的关系。这就是这一讲的主题。


    ### 1.领导力研究的发展


    我先讲一讲领导力是关系。领导力是关系，不是很容易被发现的，早期的领导力学者就没有发现这一点。


    早期有两大领导力理论，或者叫两大学派。最早出现的是特质学派，他们关注领导者的特质，想要发现他们身上有哪些人格特征，决定了他们的领导力。然后呢，出现了行为学派，想要发现领导者身上有哪些行为特征，决定了他们的领导力。这两个学派有个共同点，都认为领导力是领导者一个人的事情，研究领导者就可以清楚领导力。


