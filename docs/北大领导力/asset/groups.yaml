    # 导论02讲：用口诀修炼领导力


    导论02讲：用口诀修炼领导力


    你好，我是刘润，欢迎来到我们的领导力课堂。这是第二讲。


    这一讲我要给你介绍一个我的独家思想，叫做领导力口诀。这也是我们这门课程的一大特色。我们的课程就是围绕十句领导力口诀展开的。


    # 1.共军与国军的领导力差别


    你如果想要提升领导力，会发现这件事情很难。确实是这样，提升领导力是一个艰难的过程，但是也有方法。使用领导力口诀就是一个有效的方法。


    我给你举一个使用口诀的例子。我们都知道 given 1949年建立新中国，是因为共产党的军队打败了国民党的军队。共军靠什么打败国军？我有一个简单的答案：共军打败国军，靠的是一个领导力口诀。


    什么口诀呢？这是我从电影里看到的。我小时候看共军和国军打仗的电影，对这样的画面印象很深刻：共军的军官挥舞着手枪，冲在了队伍的最前面，喊的是“同志们，跟我上！”国军的军官呢，也挥舞着手枪，但是他们是站在队伍的最后面，喊的是“弟兄们，给我上！”


    共军的领导力口诀是“跟——我上”，国军的领导力口诀是“给——我上”，尽管只有一字之差，但是格局就完全不同了。哪一句口诀更有效呢？我相信历史已经给了我们答案。


    # 2.言为心声


    刚才讲的共军和国军的例子，其实可以用来看这样一个问题：怎么快速判断一个人的领导力？怎么判断呢？答案之一就是听他说话。有一个成语叫“言为心声”。我们可以通过听一个人说话，来判断他的领导力。


    你听说没听说过这样一句话：小胜凭智，大胜靠德。这句话听起来很有哲理，对不对？取小胜利靠智谋，取大的胜利靠品德。这句话是谁说的呢？牛根生。这是牛根生的一句著名的话。我刚才说听人说话可以判断领导力，那么如果听牛根生说这句话，是不是说明他很有领导力呢？我来带你再仔仔细听一听这句话。


    你可能还记得2008年中国出过一件大事：三聚氰胺事件，也叫毒牛奶事件。中国乳品企业在这个事件中几乎全军覆没，蒙牛也不例外。这个时候呢，有人把牛根生这句话改了一下。原话是“小胜凭智，大胜靠德”。有人给它各加了一个字，改为“小胜凭弱智，大胜靠缺德”，用来嘲笑牛根生。


    这个时候回头看，牛根生当初说“小胜凭智，大胜靠德”的时候，是不是他的心声呢？我觉得他多多少少是真诚的。只不过，你要仔细听才能听到他真正的心声。他真正要强调的很可能不是智也不是德，你想一想，他真正想要强调的是什么？


    你仔细听一听，小胜凭智，大胜靠德，这句话里哪个字出现的次数最多？对了，是“胜”，牛根生真正要强调的是胜。牛根生最重要的价值观也许不是智也不是德，而是“胜”。如果靠智能胜他就靠智，如果靠德能胜他就靠德，但是如果靠缺德才能胜呢？我就不好往下说了。


    # 3.牛根生有没有领导力？


    你可能会问，那么，牛根生到底有没有领导力呢？牛根生能够白手起家把蒙牛做起来，一定有他很领导力的地方。但是，领导力像是高考，不是考一门，而是要考很多门。牛根生在有些科目上考得好，有些科目就不见得那么好。


    # 4.领导力十律


    我刚才说领导力像高考，牛根生有些科目考得不好。那么领导力都有哪些科目呢？我给你一个我自己的答案。引用牛顿著名的那句话，我要给你的答案，是站在巨人肩膀之上的。


    # 5.用口诀修炼领导力


    我概括的领导力十律，也可以叫领导力的十项修炼。你要注意，修炼的“炼”是火字旁，是用火把铁炼成钢的“炼”。为什么说是领导力的十项修炼？简单地说，就是这些行动往往要求我们改变本性，所以要经历一个把铁炼成钢的过程。'
