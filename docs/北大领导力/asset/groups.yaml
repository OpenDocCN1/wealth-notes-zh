    phi常地辛苦，亚马逊直接把救护车停在仓库的外面，因为工作强度太大了，很容易出问题。这个时候贝佐斯千什么呢？贝佐斯不是去慰问工人，而是亲自到库房里跟工人一起配运货物，这就是贝佐斯在说“跟我来”。这种“跟我来”，也就是我们经常说的以身作则。


    # 刘瀚


    我给你讲了三个例子，南多、毛泽东、贝佐斯，他们有的 vehicle 领导大家绝境求生，有的是领导革命，有的是领导企业。他们做的事情看起来千差万别，从领导力的角度看，其实都是一样的，他们都做了这样一件事情，在具体面对一个难题的时候，他们挺身而出，承担责任，他们好像都说了这样一句话，“我来”。

    “我来”是我们修炼领导力的第一句话诀。


    # 总结：


    # 划重点


    +   1. 说“我来”不是我们的本性。我们的本性是追随，我们要克服这样的本性，所以需要说“我来”。

    2. 社会心理学上有一个发现，叫旁观者效应，也叫责任扩散效应。

    3. 怎么说“我来”：一种说法是“让我来”，面对难题你挺身而出。但是要注意，是让我来发挥领导力，而不是让我来当领导。

    4. 说“我来”，还可以说“跟我来”，“跟我来”有两种情况，一种是指示方向，一种是以身作则。


