    学校教育，尤其是中小學教育，要求大家不偏科。而到了工作上，只有偏科的個人，偏科的企業，才能有更好的發展。所以謂偏科，就是要有擅長，要有優勢。所以，領導者當老師跟學校老師不一樣，學校老師要學生全面發展，領導者則要用人之長。但是，我們的學校老師教了我們十幾年，教給我們的觀念不是用人之長，而是補人之短。


