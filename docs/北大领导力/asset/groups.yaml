    ### 言官岁月


    今天的课程给我自己找到了一为自己辩明眦的“证据”，先谢谢老师。


    就单说在工作中，我犯过很多错误，因为我的决策失误，公司蒙受过从几十万到几百万的损失，我来给大家其中一个例子。

    A客户是我们十年前开始合作的，因为是一家韩国私企公司，开始时我们就特别谨慎，但对方业务发展很快，货量非常大，我们就在摸索中开始了合作，而后由于竞争关系，我们就被迫给予了对方“月结”条款，也就是后付费，这是ak的，这个决定是由我来做出的。

    2017年, A客户突然宣布破产, 对我们公司欠费上千万, 但是我们在长期合作中已经摸索出应急措施, 就是手上一直保留有超过欠费数倍的货物, 虽然货权到底归谁有争议,
