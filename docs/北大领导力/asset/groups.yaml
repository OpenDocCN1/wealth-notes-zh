    你好，我是刘润，这是领导力课程的第三讲，今天我给你讲一讲领导力中的拉力和推力的概念。


    ## 1.领导力包含拉力与推力


    管理大师德鲁克有一句著名的话，说营销的目的就是让销售变得多余。德鲁克是什么意思呢？他是说，销售产品有两种方式，一种是推销，一种是营销。推销是把产品推给顾客，营销则神吸引顾客，相当于把顾客拉到产品的面前。德鲁克说，营销的目的就是让销售变得多余，就是说你拉的工作做得好的话，你推的工作就不需要了。


    领导力和销售产品其实有相似的地方，领导力的高手也是擅长用拉力，尽量让推力变得多余。


    ## 2.权力


    当然了，推力和拉力都不只是他们说的这些。要知道都有哪些推力，哪些拉力呢？我们还需要讲一讲权力的概念。


    ## 3.五种权力


    具体有哪些方式呢？在管理学的教科书里，或者社会心理学的教科书里都会讲到五种权力，也就是说有五种方式能够让别人听你的。


    ## 4.第六种权力


    ## 5.领导力主要用拉力


    更新微信：1561277539


