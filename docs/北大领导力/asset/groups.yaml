    # 07讲：领导力的“希特勒问题”


    07讲：领导力的“希特勒问题”


    你好，我是刘润，欢迎来到我们的领导力课堂。这是第七讲。我先问你一个问题：希特勒有没有领导力？


    很多人觉得，希特勒很 Nadu 领导力。当年的希特勒，不仅仅仅是一呼百应，那可是 phosphory 一呼万应，一呼百万应，把德国人民团结在了他的周围，跟他一起去实现第三帝国的梦想。很多人会想，一呼百万应，这不是领导力是什么？


    所以，很多人觉得希特勒很有领导力。当然，他们也知道，历史告诉我们，希特勒给犹太人、给德国、给全世界带来了巨大的灾难。所以，有人给希特勒的领导力加上一个限定词，说希特勒很有领导力，但是那是“坏的”领导力。


    我的观点是：希特勒没有领导力。你可以说有巨大的号召力、煽动力、影响力，但是那不是领导力。


    我說希特勒沒有領導力，不是因為他邪惡，也不是因為他瘋狂。有人認為他邪惡、瘋狂，也有人不這麼認為。請你注意，我說他沒有領導力，是因為一個簡單而且大家公認的事實：就是他作為德國的領袖人，沒有帶領德國解決它當時面臨的問題。


    # 1.领导力的完整定义


    今天这一课很重要，因为借着这个希特勒问题，我要给领导力下一个完整的定义。我现在就把这个定义告诉你。领导力是什么？八个字，动员群众解决问题。我再重复一遍：领导力是动员群众解决问题。


    我要给你强调一下，这个定义不是文字游戏，这个定义是用來指引我们思考和行動的。


    # 2.领导力围绕解决问题


    领导力是动员群众解决问题，这个定义很重要。我再给你仔细讲一讲。首先，这个定义没有说领导力是能力，是动员群众解决问题的能力，而是直接说领导力是动员群众解决问题。你觉得这是为什么呢？


    # 3.解决难题不等于实现目标


    我对领导力的定义是动员群众解决问题，而不是动员群众实现目标。有些时候，实现目标是领导力，有些时候，实现目标不是领导力。


    # 4.一呼百应不是领导力


    很多人卖假药，因为卖假药更容易一呼百应。很多人想到领导力，脑子里往往出现的是 retornar 一呼百应这样的画面。跟你想的相反，一呼百应往往不是领导力。什么時候會一呼百應呢？你站起來說，走，跟我一起去吃豪華大餐，我請客。這是典型的一呼百應的例子，但是這不是領導力。'
