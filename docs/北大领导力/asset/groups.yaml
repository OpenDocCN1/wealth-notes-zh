    我反复给你强调过，每一句领导力口诀，都是提醒我们要做出一个行动。“我要改变什么？”这句口诀指向的行动是什么呢？是反思。


    这句口诀跟我以前讲过的其他领导力口诀一样，听起来简单，但是使用起来并不简单。这句口诀只有六个字，加上一个问号，但是这句口诀可以指向三种不同层次的反思。我分别称之为小反思、中反思和大反思。


    普通人常只是 在进行小反思。如果你想成为一个优秀的领导者，你需要在这三个层次上反思。在很多时候，你需要进行“反思升级”，就是在更高的层次上反思。


    # 1.改变行动


    我前面讲过，反思的本质是对思而再思。把这个本质扩展开来，反思有四大要素：抽身而出，放下情愫，转换角度，指导实践。符合这四大要素的，就是反思。符合这四大要素的反思方法，当然不止一个。现在我告诉你一个最简单的反思方法，就是经常问一下自己这句话：我要改变什么？


    # 2.案例：英特尔的反思


    我下面讲一个真实的领导力案例，来帮助你区分三种反思。这个案例会告诉你，在关键时刻，小反思往往不起作用。这个案例，讲的是英特尔公司。


    # 3.反思目标


    # 4.反思心智模式


    # 5.口诀：我要改变什么？


    这一讲的主题是“我要改变什么？”这句领导力口诀。我要提醒你注意，作为一个领导者，你不已要对自己用这句口诀，还要对别人用这句口诀。对别人用的时侯，你需要改一下这句口诀的主语，你要问：“你要改变什么？”


    # 5.口诀：我要改变什么？


    这一讲的主题是“我要改变什么？”这一句领导力口诀。我要提醒你注意，作为一个领导者，你不但要对自己用这句口诀，还要对别人用这句口诀。对别人用的时候，你需要改一下这句口诀的主语，你要问：“你需要改变什么？”


    这句口诀，经常需要跟上一句口诀“失败了？恭喜你！”一起用。你自己失败了，你对自己说“恭喜你”，但是你还需要问自己“你该改变什么？”你的下属失败了，你对他说“恭喜你”，但是你还需要问他“你该改变什么？”只有对失败进行反思，把失败当作学习的机会，失败才可能真正成为好事。


    # 总结：


    划重点


    反思的口诀是“我要改变什么？”你可以用这句口诀，引导自己、引导他人进行三个层次的反思：一是小反思，反思如何改变行动；二是中反思，反思如何改变目标；三是大反思，反思如何改变心智模式。在进行具体反思的时候，你可能需要进行反思升级，从小反思升级到中反思，从中反思升级到大反思。


