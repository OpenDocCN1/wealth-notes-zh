    - 第一：心中所想即为所见！当初の我一直心怀怨恨，有反社会心理，看谁都不顺眼，想伤害别人，最后身边竟全是坏人！当我想要寻求救赎的时候，就一定能做到！天堂和地狱往往只是心中一瞬间的决定！别人是天使还是恶魔往往是在答案依然在自己想待看的是什么！我若想我的世界便能好，我若想坏就会坏！现在的我一心能看到别人的好，看别人的好已经成了自然习惯了！看到别人的好就忍不住想称赞！

    第二：学会了自知、自明！我不是一个完美的人，我时常犯错、作死、没自信，不接受自己！但是我大多数时候还是希望变好的，有上进心的、希望幸福、爱学习、真诚待人…我对我的评价是不完美，大部分还算好，有时不太好！

    第三：深刻明白“人生最大的敌人就是自己！”我到现在还是会有自毁倾向，但是不同的是我知道我有这么一个敌人了，每次敌人出现的时候我就会计较力党散、智商下隆、焦虑、处处犯错总给自己挖坑！对待的措施是经常给自己留条条，告诉那个“坏的”我不要太过分！给自己找了个大我很多岁又有严重控制欲的大男子主义的男朋友，虽然这样的人别人会受不了，但是我会用别人眼中的“不好”变成有利于我的条件，帮助我那个坏的我，变成我的“盟友”，化“不好”为“好”。

    第四：人生最大的目标不是为了“赢”！而是学会照顾好自己以及自己亲近的人！以前的我看待世界一直是赢和输，能赢就不能输去赢，就赢！输愧愧自无能！现在在经历了足够多的追求赢了，不想变得伟大！照顾好自己让感受到充实，帮助到别人让我感到幸福。

    第五：空杯心态！现在的我很容易学习别人的知识和经验，一点点做慢也没有，不知道是不是因为自己本身是破碎的，所以“光”容易照进来。但是黑暗的东西也容易进来，所以我更加要远离黑暗！


    没想到写了这么多…可能毕竟那次的错实在伤害太太太深刻！我把自己毁灭的那么透彻，救赎也很深刻！得到好处很多，坏处也有！对我而言，杀不死我的必使我强大！我很强者！因此是没而过的痛苦也许，别人大多都选择因基地沉浸在痛苦苦、抉择着、继续吸毒、持续不断地看心理医生、甚至自杀！而我竟然不断地学习、坦然地面向过去、对抗自我毁灭、坚定不移地往好的方向前行…坚韧如小强！


