- pgno: 11
  md: '中间层呢，可以配置一些长期持有的固定资产，比如房产，另外还有收藏品和蓝筹股。


    这个道理，就是你投资房产，然后租出去，等到物价上涨了，房租也会涨；

    股票也一样，物价涨上去，各个领域的龙头企业的分红也会上涨，这就形成了一个很有有效的对冲。所以这类投资品，是可以在很长的周期中抵御通货膨胀的。


    再往上，就要做流动性配置了。高净值人群因为调动杠杆的能力比较强，所以流动性配置不需要太多，足够家庭半年生活费的现金和现金等价物就可以了。


    最高一层，是风险投资配置，只追求高收益，但也要接受损失。像股票、私募产品甚至比特币，都可以持有。


    除了上面这些，物理空间的分散投资也是高净值人群抵御周期风险的重要配置。这里我指的是在全球配置资产，比如美元保单、港股美股、海外地产，子女的海外教育投资等等。


    但是海外投资要同时对抗汇率风险。由于我国有外汇管制，不可能在你需要用钱的时候一次性换汇。所以，高净值人群，每年都会用好家庭每个人的5万美金换汇额度，提前做好准备。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '经历一轮经济危机，做好了分散投资和长期投资的家族，虽然财富缩水了，但是缩水比例一定是远远小于社会平均水平的，而且在复苏期，往往也具备非常强的修复能力。


    好，我们再来看看另外一个适用于大多数人的冰山模型。


    冰山理论，你肯定知道，是心理学家弗洛伊德提出的。也就是说：


    冰山浮在海面上的部分其实只占到冰山体积的八分之一，可能还有很大一部分是藏在水面下的，人们不会轻易地看见。'
  merge: -1
