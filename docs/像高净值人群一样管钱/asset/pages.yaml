- pgno: 30
  md: '# 4.怎样利用金融工具控制健康风险


    到了这一讲，高净值人群财富管理的宏观层面你应该已经清楚了，家庭层面也已经有所了解，下面我们来聊一聊个人层面。


    个人层面存在哪些风险呢？是健康。


    任何一个人都很关心自己的健康，我相信你手上肯定也有一个两个医疗保险或重大疾病的保单，那高净值人群会购买保险吗？他们怎么来管理自己的健康呢？


    很多人会觉得高净值人群那么有钱，资产上千万，得个病顶多花个一两百万吧，花得起，上保险还有什么意义。


    其实你错了，高净值人群不但会购买保险，而且还会购买高额保险。


    为什么呢？这里我给你讲两个理念：


    +   - 第一，高额保险的本质是把健康风险的焦虑，从个人身上转移给保险公司；


    +   - 第二，他们在购买高额保险以后，考虑的并非是生病后的赔付，而是通过购买高额保险获得一个通道，这个通道将帮助他们获得全球最好的医疗资源。


    # 高额保险买的是焦虑转移


    关于第一个理念，个人健康风险的焦虑怎么转移给保险公司呢？我通过两个案例帮助你理解。


    第一个案例：'
  merge: -1
  img_proc: true
- pgno: 31
  md: '2010 年以前中国最大的一张个人人身保险的保额大概是 7000 多万，也就是说这个客户一旦身故，保险公司就需要赔付给他的家人 7000 多万人民币。虽然今天这样的保单已经很多了，但是在
    8 年以前，可以说是巨额保险了。结果你知道吗？这个客户的整个生活都被保险公司给管起来了。他喜欢游泳，保险公司就派理财经理陪他游泳，送游泳卡，带他去健身。为了分散风险，还把他的一部分保额分给了慕尼黑再保险公司做再保险。为什么呢？因为当风险大到一定程度，保险公司不愿单独承保的时候，就会找到能给自己做保险的再保险公司共同承担。从本质上讲，做再保险的目的就是为了分散风险。


    所以你想一想，如果这个客户哪里不舒服，打个电话给客服，就连这个保险公司的总经理都会关心他的身体状况的。


    另一个案例是一个明星的案例：


    张学友前几年在沈阳开演唱会，他的经纪公司为他投保了过亿的高额保险。所以从他的飞机降落，到演唱会结束后再上飞机，中间的整个过程，都是被保险公司严格参与监控的。保险公司用自己的安保代替了经纪公司甚至是他本人的安保，为什么？因为他保额太高，保险公司承担不了损失。所以宁愿花钱雇庸世界最好的安保公司，来提供最好的安保服务。也就是说，保险公司要对被保险人员最大限度地提供防止风险发生的服务。


    你看，高净值人群到了这个层面，不再会焦虑健康这个问题了，因为这个事情已经从个人风险转移给了保险公司。


    # 高额保险是获得最优质医疗资源的捷径


    我们再来看第二个理念，高额保险能够帮你拿到全球最好的医疗资源。


    医疗资源在中国来讲是极其稀缺的，因为中国人多，优质的医疗资源少。

    很多人有钱，但不一定能够看到很好的医生，也不一定能够住进很好的病房。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '我也碰到过一些朋友，虽然自己很有钱，但是 一到要住院就打电话给我，托我找关系，给他们去挂号。


    我经手过一个真实的案例，发生在前年。


    我服务的那个保险公司的 一个客户长期在鄂尔多斯工作，有一天突发心脏病，报案以后，保险公司马上安排直升飞机去当地对他进行了紧急救助。4 个多小时，从鄂尔多斯直飞北京。到了北京以后，又换了一架直升飞机把他送到安贞医院。中间所有的转机费用大约
    50 万元，全部由保险公司承担的，保险公司花这个钱Maybe甘心情愿，因为它知道，如果这个客户当时没有救过来，他们要承担更大的经济损失。


    而且你要知道，保险公司独有的风险管理模式，决定了它们会经常投资一些医疗机构。比如说平安有平安好医生，太平投资了北大国际医院。


    这些保险公司通过入股投资医院为客户间接提供优质的医疗资源。


    上海有一家医院叫质子重离子医院，这个医院是保险公司投资的，里面有一台仪器，这个仪器可以把质子重离子加速到 70% 的光速，去照射肿瘤部位，快速杀死癌细胞。这种射线的半衰期非常短，所以当它杀完癌细胞，就不再具有放射性了，就没有副作用了。


    如果我们把传统放疗比喻为霰弹枪，打一枪，杀敌一万自损三千，那么质子重离子就是狙击枪，这把枪开一枪需要多少钱？30 万一枪。关键是，这个医院一年只能接待 100
    个病人，有钱都排不上。如果你在这家公司买了大额保险，当有这种需求的时候，你想一想他们会不会优先安排你？'
