- pgno: 46
  md: '创造财富可能二十年的时间就够了，但是传承财富、守护财富、传承价值观、传承家族的一些理念可能需要用余生中所有的时间去投入、去做。


    你对一个顶级家族的看法、对这个家族的敬畏，就是从了解到他的家族传承理念的那一刻开始的。


    # 总结


    好了，我的课到这里就要结束了。


    +   - 课程中，我给你讲了 2 个财富管理模型，分别是高净值人群适用的金字塔模型和大部分人适用的冰山模型。

    - 我还告诉你了 1 套最小化的个人健康保障策略，那就是一个基础保障加 3 倍于年收入保额的重大疾病险。

    - 另外，我给你介绍了保险、信托、家族办公室、财富管理机构这 4 类金融管理方式和大量可参考的案例。


    但是比这更重要的，也是我最后一定要再次提醒你的，是这群人的几个最有价值的观念：


    第一，分散投资和长期投资的本质不是为了获得收益而是对抗未来长周期内的不确定性。


    第二，建立资产边界意识，提前设置防火墙，是对个人、家庭、企业最大的保护。


    第三，这一代，家庭和睦是最好的投资。下一代，给子女充分的自由，但是用金融工具帮他们管理未来。'
