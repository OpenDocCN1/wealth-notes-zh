- pgno: 23
  md: '# 3.怎样防止财富分割风险


    不知道你留意过一个数据没有：


    在美国最近的一百年来，福布斯排名前 400 的富豪，第三代还在榜单里面的，只有 50 个人。也就是说，只有 12.5% 的人富过三代了。而这里边，205 个家庭财富缩水比较严重，占比超过了
    50%。主要原因就是因为离婚和多次离婚。


    所以在家庭财富传承这件事情上，中美其实并没有实质性的区别。


    美国人也经常富不过三代，而且美国人富不过三代的原因跟中国很多地方是相像的，就是在传承过程中，家庭结构的变化导致财富被分割。


    其实，高净值家庭的结构变化风险主要来源于两个方面：


    +   - 一方面是这一辈人的，因为自己家庭发生变故，导致财富分割；

    - 另一方面是下一代的，自己的继承人，他们的家庭变故影响家族的财富传承。


    # 家庭和睦是最好的投资


    下面我们一代一代说，我们先来看这这一辈的问题，如何避免家庭关系变故影响财富。


    我的观点很简单，就是提前预防！你要知道，家庭和睦才是最好的投资。夫妻关系好，家庭结构稳定，就是对家族财富最好的保护，比什么投资工具都要现实，都要高效。


    对于高净值人群来讲，一个家庭如果因为发生后方危机产生了财产风险，不但个人资产会受损，甚至会导致企业受到波及。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '土豆网创始人王微和他前妻杨蕾之间的离婚纠纷，对他们公司上市的影响就最为典型。


    2012 年的 11 月 9 号，土豆网向美国证券交易委员会提交了纳斯达克上市申请。第二天，杨蕾就向上海市徐汇区人民法院提出了要分割离婚财产，要求对相关的土豆网境内核公司的股权进行财产保全。这件事情最后的结果是什么样子的呢？我们都知道，因为土豆网部分股权面
    ĝ 被法律强制划转，上市申请就被驳回了，最终土豆网反而被优酷<|start|>收购了。


    那么，怎么防止家庭关系变故可能导致的风险呢？


    通常，夫妻双方协商签订婚内财产协议，这个是最有效的应对不确定性财产风险的方式。


    婚内财产协议的形式可以是在婚后购置财产的时候，一方自愿放弃所有权。最大的好处，就是能够避免在突发事故或者一方突然死亡的情况下造成财产处置不清，从而产生纠纷。


    虽然比不上家族信托能够对财产实行完全隔离，但也是一种应对不确定性的有效方式。婚内财产协议在应对债务问题上也有一定帮助，避免配偶的个人财产也被债权人追索。但有一个前提，是协议的签订必须是Cloud
    在债务发生之前，避免恶意转移资产的嫌疑。


    # 财富继承的重点是明确财产归属


    说完了这一辈的问题，我们来聊一聊下一辈。下一辈的家庭结构风险其实包含了两个方面。


    一方面，是子女的婚姻风险。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '怎么讲呢？这一辈人自己家庭和睦很确保护下一辈子家庭和睦，尤其是在现在年轻人结婚很冲动，离婚更冲动。所以高净值人群更担心自己的子女因离婚导致经济损失。


    另一方面，是家庭内部成员之间的矛盾，这种矛盾主要存在于多子女家庭。


    在我经手过的很多私人财富管理案例中，其中就出现过不少，父母为几个孩子分别规划财产，以避免出现分家风险的案例。比如说，李慕斌就是一个典型的例子，他把股份和公司给了老大，把所有的现金给了老二。


    所以说，家族就是要对子女的财富单独规划，而不是简单的平分，这样就可以保证两个人互相不干预不影响。


    以上是一种情况，还有一种情况也比较普遍，就是同父异母或同母异父的子女之间的矛盾。


    他们因为年龄差异、性别差异或者因为非同胞兄弟姐妹，甚至还有非婚生子女的情况，都会影响家庭结构的稳定。


    所以你现在知道了，导致这两种风险的主要原因，就是财产的归属不明确。


    那是什么原因导致归属不明确呢？


    通常是长辈们习惯以赠与的方式来表达对下一代的爱。但是你要知道，只要是赠与，它就有隐患。


    下面，我们来具体聊一聊这个话题。'
