- pgno: 14
  md: '冰山以上的部分，就是现金储备和收益杠杆。我解释一下，这个现金储备是指你的银行存款。收益杠杆是指股票、基金类产品，这两部分比例加起来不要超过总资产的 20%，你可以各配置
    10%。


    往海平面以下看，首先要配置实物资产、固定资产，像房产、收藏品等等，都属于这类。这类资产的比例是多少呢，是 25%。


    再往下，就是时间的杠杆，用时间去撬动收益。最典型的配置就是国债、固定收益类投资、长期持有蓝筹股、投保分红型年金保险。这部分的比例要占到 40%以上，它的特点就是投钱时间长、安全、收益固定，而且还有复利作用。


    到了最底层，会占到 15%的是风险杠杆，也就是保额高的保障型保险，通常会配置意外险、高额人身险、重大疾病险这类保费低，但是保额高的产品。这类配置的目的就是用小钱撬动风险发生时候你需要消费的大钱。


    因为普通人的抗风险能力不如高净值人群，所以这部分配置就尤为重要。


    你的资产就是这样的一座冰山。海平面以上的部分流动性好，变现能力强，但抗风险能力很弱。就很像冰山露在外面的部分，风吹日晒，会被蒸发掉。


    现在，你想象一下，我们的现金会被消费，投资也可能亏损。如果海平面以上的体积被蒸发掉了，冰山会怎么样？


    会浮上来。也就是说，你要通过变现其他的资产来弥补现金的损失，顺序是什么样子的呢？'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   - 首先，可以抵押或变卖固定资产。因为变卖部分资产并不会影响生活，还有机会买回来，抵押的利息也不高。

    - 其次，就是动用你的时间杠杆，也就是你储备的养老金、给孩子的教育金等等。但是这笔费用千万轻易不要动，因为复利是在时间作用下才能发挥巨大的作用的，你中断了，损失的不是收益，而是时间。

    - 最后的最后，你还有风险杠杆，就是那些偿氢高的产品，它们能够帮你守住家庭经济来源的底线。


    好了，这两个模型我给你讲完了。关于不同资产的配置原则，相信你已经有了比较系统的了解。掌握了这套宏观视角和方法论，你为自己配置资产的大方向上就不会跑偏了。


    另外呢，还有很重要的一点是，从今天起，当你再接到理财师或保险人员打来的推销电话时，也不会感到毫无头绪了，这套宏观视角和方法论就是你判断的依据。


    # 本讲小结


    这一讲，我从宏观的角度给你分析了经济周期和通胀周期对我们的财富可能造成的影响，并且给了你两个关于分散投资和长期投资的财富配置模型，金字塔模型 和冰山模型。


    所以，你现在知道了，分散投资、长期投资的本质不是为了获得收益而是对抗未来长周期内的不确定性。


    接下来，我们要讲股权划分以及个人资产和企业资产的划分在高净值人群的财富管理中有多重要。'
