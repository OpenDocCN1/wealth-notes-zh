- pgno: 6
  md: '# 1.高净值人群如何跨周期生存


    对于一个工薪家庭来讲，无论是做投资还是做规划，考虑的时间大概是三年、五年或者十年。


    但是对于高净值人群来讲，这个时间的比例尺常常会被放大到三十年、五十年，甚至一百 Harbor 以后。


    你发现没有，当你选择时间框架的时候，其实是在选择你的世界。时间框架就是你的思维方式。换句话说，有些人之所以富有，是因为他衡量世界的时间长度和我们是不一样的。


    那么，大比例尺的时间框架也决定了高净值人群最关注的事情，是宏观背景下的跨周期生存。


    在这里我还要特别说明一下，本节课里讲的周期，主要是指经济周期和通胀周期。


    这两个周期存在的风险主要来自于社会和市场，它是不可抗的，我们叫它大环境，也就是前面我提到的宏观意义上的周期。


    # 尊重规律，顺应经济周期


    我们先来看经济周期存在什么风险，有一句名言叫：


    > “人生发财靠康波。”'
  merge: -1
  img_proc: true
- pgno: 7
  md: '康波是俄罗斯经济学家提出的一种经济周期理论，这个周期大概是 50 年到 60 年。这句话的意思是说，每一个人的财富积累可能并非是你多有本事，而是完全取决于经济周期运动的时间给你的机会。


    在中国，因为我们发展速度比较快，所以这个周期运动的时间会更短，通常是十年左右。那随着这个经济周期的变化，每个人一生中都会经历几次发财的机会。当然，也会遇到相同次数的危机和经济大萧条。


    对于工薪阶层来讲，普通老百姓想要跨越周期还是比较容易的，只要控制欲望、勤俭节约，还是能够熬过去的。


    对于企业跟机构来讲，很多是没熬过周期就倒下了。我们在全球范围内做过一个统计，从 1776 年到现在，经历了 200 多年历史还依然存在的组织只剩 76 个，其中学校
    70 个，宗教组织 6 个。所以你看，能够说得上基业常青的企业屈指可数，200 年以上的几乎一个都没有。关门、停业、并购、转让，是企业的宿命。


    那么对于高净值人群来说，跨越周期会遇到更多的挑战，需要的是智慧。我曾经听一位知名企业家分享他的财富观念，很有启发，在这里我也分享给你：


    第一，顺势而为不逆势而动；第二，不碰雷池、不退维谷；第三，礼让三分、利止三分。


    我是这么理解这句话的：


    +   - 顺势而为不逆势而动，讲的是要尊重规律、顺应周期，不要对抗周期；'
  merge: -1
  img_proc: true
- pgno: 8
  md: '+   - 不越雷池是告诉我们要讲规则、守法律、有底线，不退维谷告诉我们要永远保留退路，永远有应急措施，不要走绝路；


    +   - 礼让三分、利让三分，是让我们多交朋友，要寻求共赢而不是吃独食。


    我认为，这是一个企业家十几年来自商海拼搏经验的高度提炼，也是对财富智慧的总结。


    # 通胀周期要解决资产保值问题


    说完了经济周期，我们来看另一个影响财富的风险因素：通胀周期。


    当你站在一个长达百年的维度去衡量的时候，隐性的通胀、缓慢的货币贬值也是高净值人群会首先考虑在资产管理因素中的。


    所以，面对通胀周期，这群人要解决的就是如何让资产保值的问题。


    我给你举个例子：


    我去年在日本旅行，在京都的一个神社里面看到了两个功德碑，功德碑是当地人以个人的名义捐赠给庙里记录载德的石碑。其中有一个是 1910 年捐的，那个人只花了大概
    7000 日元，按今天的汇率看，大概是四百多人民币，就把这块碑立在那了。但是 2015 年一个新的碑，跟那个碑的距离也就 20 米开外，这个碑大概花了将近
    200 多万日元才能买下来。按今天的汇率去看，大概是十二万人民币。你看看，同样的东西，同一个地段的商品，三百倍的变化。从这个价值贬值你就能看到一百年的时间里，日元所经历的通胀周期。


    那么，面对经济周期和通胀周期，该怎么应对呢？


    # 用分散投资、长期投资抵御两大周期


    分散投资、长期投资是熬过下行周期的唯一办法。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '讲到这里，我要提醒你一下，分散投资和长期投资的目的是为了防范风险，这和你是不是高净值人群没关系。


    不管你是谁，不管你要投资还是理财，你都应该有这个最基本也是最重要的风险防范意识。尤其对于普通人来讲，懂得这一点，可能更重要。


    在这里，我准备了两个关于分散投资、长期投资的财富管理模型。


    第一个，是对高净值人群来讲比较适用的，叫 金字塔模型。


    第二个，是对大部分人来讲比较适用的，叫 冰山模型。


    接下来，我给你详细介绍一下这两个模型的具体内容。


    先来看金字塔模型，它是一个正三角结构：'
  merge: -1
  img_proc: true
- pgno: 10
  md: '![](img/727752497f387e0b15689759e4af4a39_10_0.png)


    # 金字塔模型


    ![](img/727752497f387e0b15689759e4af4a39_10_1.png)


