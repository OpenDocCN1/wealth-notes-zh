- pgno: 16
  md: '# 2.怎样避免资产划分不清导致财富动荡


    对于高净值人群来说，跨周期生存不仅仅是宏观意义上的周期，还包括企业的经营周期。


    企业经营周期的风险，来自于内部。我们这里不说因为经营决策失误导致的危机。这一讲，我们就说非战减员的风险：那就是因资产划分不清导致的财富问题。


    这个问题会牵扯两个方面：


    +   - 第一，因合伙人之间的股权划分不清，导致个人风险向企业传导。


    +   - 第二，因公司和个人资产划分不清，导致的企业发问题把风险蔓延给个人和家庭。


    # 尽早股权划分避免个人风险向企业传导


    我们先来讲讲：个人风险如何向企业传导。


    招商银行的私人银行财富报告——白皮书里面有这样一个统计：


    2017 年全球新增的亿万富翁里每五个有三个在亚洲，也就是在中国。但是每年破产的四个亿万富翁里面也有三个在中国。可以说，中国造富和破产的速度是一样的，甚至破产的速度更快。


    导致企业破产的原因有多种，比较典型的一个：就是因股权划分不清晰导致的个人风险向企业传导。


    股权划分不清的第一种情况是代持，另一种情况是因企业家或股东个人突发的人身风险，对企业造成猝不及防的伤害。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '我先给你解释一下代持的意思，代持就是委托持股，比如说实际出资人与另外一个人约定，以这个人的名义代替他自己履行股东的权利义务。


    那么为什么要代持呢？


    因为在创业初期，股权划分有时候拍脑门就定了，很随意。随着企业的发展，股权就会在股东之间互相有流动。为了图方便，有的企业就会用代持的方式来解决，这种形式非常普遍，但是也是非常不规范。


    企业一旦做大，涉及到利益的分配了，前期这样做的企业这个时候就会出现各种纠纷，轻者伤感情，严重的，会导致分家。


    这是一种隐患，咱们再讲另一种更厉害的情况，因股东人身风险、突发状况影响到企业。


    中国企业中很多合伙人、股东是发小，或者是同学，也有很多人是亲属。这就天然地决定了如果没有相应的法律机制约束，他们之间的权属利益一定是纠缠不清的。


    当企业发展得越来越大，股东之间的权益又缺乏规划和管理的时候，一旦发生突发状况，将会直接面临崩塌的风险。


    我举个例子：


    20 年前，中国有一个很著名的家族企业叫均瑶乳业。均瑶乳业的创始人王均瑶投资开创了均瑶乳业和均瑶航空，很遗憾的事情是，他在公司发展最好的时候突然离世。最终，这个企业因为股东们，也就是他的家人们之间争抢股权资产、争抢话语权而导致快速走向没落。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '所以说，企业在经营过程中，就要充分考虑到股东、决策层的个人风险对企业可能造成的损失。我这里还有一个正面案例：


    我有一次和美国最大的财产险公司——美国旅行者保险公司的 8 名高管在阿里巴巴做了一次交流。他们 8 个人是坐了两架私人飞机来的。我说，你们太浪费了吧。然后他们
    CEO 告诉我，这是公司的规定，不能所有的高管坐在同一架飞机上。董事长不能和 CEO 一架飞机，COO 和 CFO 也不能一架飞机。为什么呢？怕有一架摔下来，全军覆没。这样的事情有过先例，AC
    米兰曾经全队球员加教练坐一架飞机出去比赛。结果飞机失事，无一人幸免。


    其实一个好的企业如果在股权权益管理这件事情上提前做过规划，那么即使出现一些突发状况，它应该也不会存在很大的经营风险。


    那么高净值人群会用哪些工具规避呢？


    针对第一种隐患，除了提前明确股权责任以外，就是要谨慎对待股权问题。


    如果初期有这样的情况存在，在公司成熟、股东稳定的时候就要尽快处置好。可以通过正规的工商注销、专业的员工持股计划，或者成立有限合伙人公司来统一管理，这都是非常好的方式。


    针对第二种隐患，高净值人群通常会通过购买责任保险的方式来规避。


    也就是说，可以把一些风险转嫁给保险公司，也可以用公司的名义给高管、股东上完善的团体医疗保险和高额寿险。这样一旦发生个人风险，也有很多的现金赔付给家庭。


    甚至在国外，还有将保险受益金，用于回购股份的案例。这样做是为了防止因为遗产继承，导致股权落到不懂得经营的人手里，干预公司正常发展。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '规模更大的企业，还可以在国外设置信托，把公司的股份交给信托来管理，把“人”的风险彻底规避掉。


    # 明确公私资产避免企业风险蔓延给个人


    好了，如何避免个人风险向企业传导你已经了解了，下面我们接着讲企业的风险又是怎么蔓延给个人和家庭的。


    我以前碰到过一些企业主，他们理所当然地认为公司是我的，公司需要的时候，我的就是公司的。其实他们错了，这个念头的背后恰恰没有考虑到风险层面。


    要知道，公司是独立的法律主体，拥有法人资格和独立财产权。基于这个前提，如果企业资产和个人资产混为一谈，公司的独立法人人格就很难获得法律认可，一旦出了问题，公司的风险就会蔓延传导给个人和家庭。


    我会建议你把自己的家庭想象成一个企业。我就常跟我爱人说，我说其实你是我们家集团董事长，我是子公司总经理，我为集团贡献利润，集团要帮我做好财务管理，和我家两个初创公司，也就是我两个闺女的培养和孵化。


    你看，这个主次顺序不能搞反了。现在很多家庭其实是集团服务于子公司，就是老婆孩子服务于创业者，创业者赚钱了全家吃香喝辣，创业者赔钱了全家饿肚子。


    所以，如果你现在正在经营一家企业，记住：'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   - 该自己已发工资就要发，这不是发给你自己的，是发给你家庭的；

    - 该分红就要分红；

    - 自己给公司的钱，记得要在财务记好借款，不要觉得公司是自己的，都拿家里钱填公司的窟窿；

    - 也不要以个人名义在外借外债，然后拿来给公司用，一旦出了问题债务会连带到家庭。因为婚姻法规定，个人名义借钱，夫妻要一起承担还钱义务，离婚也没用，婚内借的，离婚也要一起承担。


    我给你举个例子：


    2015 年股灾之前贾跃亭干了一件事情，就是高位抛掉了自己所持的股票，大概价值近百亿。然后再把这笔钱又无息地借给了谁呢？借给了乐视。相当于他从二级市场把钱w装到自己兜里。然后又把这个钱借给了自己的公司乐视。


    很多人就不理解了，说你这不是多此一举嘛，还不如就把这个钱放在股市里面维持股价的稳定，吸引投资。


    你错了，正是由于他这么一个动作，才把个人资产跟企业的关系，从过去的股权关系变成了债权关系。


    也就是说他对这一百个亿资产的处理，决定了他跟乐视之间的关系不再是股权，而是债权。


    你要知道，在清算过程中债权的优先级是高于股权的。


    这就意味着当企业发生破产风险的时候，清算的第一步会优先偿还国家 的税。


    第二步会把欠个人的给个人，比如说拖欠员工的薪水，短缴或者是断缴的社保、保险金。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '第三步就是用剩下的资产再来清偿债务。最后才清偿什么呢？清偿股权。


    假设乐视按这个顺序进行清偿的话，搞不好贾跃亭还能分到一些资产。但是其他股东理论上来说应该是全损、颗粒无收的。


    事实上，你关注这两年乐视的公告和财报，乐视在根本没有盈利的情况下，拿营收还了贾跃亭个人借给公司的几十个亿。


    当然这个操作，贾跃亭并不承认是这个目的，但我们用这个案例来分析。


    一些简单的财富管理的措施就能很有效地将个人资产跟企业进行隔离，就能够有效地防止当企业发生经营风险的时候烧到自己的家里，影响到家人的生活品质。


    关于企业和个人资产这部分的风险，一定要求雨绸缪，不要将家庭的命运和企业深度绑定。尽早对家庭个人资产和企业资产进行划分与隔离。


    另外，还可以选择财富管理、法律方面的专业人士提供意见与建议，把专业的事交给专业的人。


    你看，财富积累的过程，要不断升级自己创造价值的能力，把握时机的能力，但更重要的是应对风险的能力。


    创造财富需要机遇、胆识和魄力，守护财富需要一个正确的财富观和智慧。


    # 本讲小结


    这节课我给你讲了两个典型的高净值人群，尤其是企业家会面临的问题：'
