- pgno: 41
  md: '# 5.怎样用金融工具传承家族意志和文化


    到了这一讲，高净值人群财富管理自己这一辈子的事我们已经盘点完了。接下来，我们再来看看金融工具是如何帮助他们向后辈不断传递意志和价值观的。


    在过去的二十多年，我们国家的<|message|> 第一批富豪，他们的财务需求其实非常简单，他们的投资偏好永远是收益第一位，大多数人还是希望通过投资理财赚取更多的钱。


    但是随着时间的推移和中国财富管理的发展，今天，这些富豪都已经七十多岁了。他们的观念开始从继续获得更高收益转向了退休，将财富用不多的余生逐次地、安全地向自己的后辈进行转移。


    而这种转移其实际包含两个方面：


    +   - 第一，家族财富和事业的传承；

    - 第二，家族文化和影响力的传承。


    # 在固定周期内规划资产传承


    千万不要以为巨额财富可以在一夜之间传给后代。把大量现金交给一个心智不成熟、不会驾驭财富的二代，相当于给自己的孩子喂毒药，而且一次性地传承，还会让后代面临着高额的税收。


    对于财富和事业，高净值人群通常会把这种传承放在一个固定的时间周期里去配比。你可以记住这样一句话：'
  merge: -1
  img_proc: true
- pgno: 42
  md: '“十年投国债，二十年投蓝筹股和指数股，三十年投长期寿险。”


    先说国债，国债的投资回报率是最低的，它大概只有 5%以下，但是它的风险也是非常低的，你相信任何一个投资机构都不如相信国家。


    如果准备把自己的资产用十年时间传到孩子手里，国债是高净值人群会优先考虑的。


    再往上走，买指数要比给孩子买更好的车划算。


    巴菲特曾经跟一个对冲基金的管理者打赌说，我就买标准普尔指数，你随便怎么买，我们俩比十年，十年之后看谁赢。结果比赛到了第七年就对冲基金宣告输掉，标准普尔指数稳定在年化7左右的收益，远远超过了这个对冲基金的基金经理的收益2.3%的收益。


    +   - 所以说，十年二十年，我们就买国债，买蓝筹股和指数就好了，买定离手，不要老去操作。那是孩子的钱，安全第一。

    - 同时现在孩子出生比较多，可以每年都换一些外汇，放在香港和美国，但这些地区和国家利息非常低，你可以买美股、港股的蓝筹，也是买定离手，佛系炒股，不要操作。

    - 条件再好一点的，买海外的房产，日本的房产租金回报很不错，美国的房产长看著也很妒。你看到2008年次贷危机暴跌，2014年就涨回来了，比较坚挺。


    再长一点的时间，咱叫说三十年。这个周期，我们就要规划孩子的现金流，可以选择给孩子购买长期年金保险或做家庭信托。


    因为中国的保险机构在保险法的监管下是有些法律属性的。其次保险资金的投资渠道和投资监管也非常严格。你把钱交给保险公司，一般来讲的话，要比交给其他的理财机构更为安全。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 通过三种方式传承家族财富


    这里，我再给你重点介绍三个高净值人群在财富传承过程中会用到的方式：信托公司、家族办公室和财富管理机构。


    第一种方式：信托，也就是说，我们会借助信托法律架构的方式来进行定向传承和安排。关于信托的内容我们在第三讲就已经涉及了，它的好处就是在传承财富的过程中同时规范下一代的行为。


    高净值人群把自己的资产收益权、支配权模式所有权交给保险公司、信托公司，本质上是为了进行剥离。因为当这个所有权剥离给了信托公司，本身来讲就免除了税费的责任。同时消费的风险也被剥离掉了。


    但是支配权还是依然存在的，就是说他可以选择不给予下一代资产或者怎么给予下一代资产。


    我见过很多的家长给孩子做信托规则设计的时候很有意思：


    有一个妈妈特别担心的事情就是儿子去英国留学 epileptide 会找一个英国女朋友结婚。所以她在儿子留学之前给儿子做了信托基金，里面有一条规则是：你去英国读书，每年都可以从信托基金领多少钱的学费，每个月领多少生活费，花光了没关系，下个月还有。但是你这个月花光了，就得自己想办法。同时，交女朋友可以，你交英国人、法国人
    Teste，就是千万不要回家结婚。领回家你就很少一大笔钱。


    还有一个例子：


    一个家长给孩子结婚的礼物不是房子，不是股票，而是一份结合保险单的信托合同。是什麽内容呢？这两代孩子夫妻关系好，每个月就能基金里额度让他们吃穿不愁的生活费，去旅游、购物都可以。但是夫妻关系不好，一旦发生了婚姻风险，支配者也就是说家长可以直接'
  merge: -1
  img_proc: true
- pgno: 44
  md: '接åk信托机构终Kn对他们进行现金的给付，小两口从此得不到额外的收入。当然得不到就无从进行分割，也就是说，他们即使离婚了也分不了这笔钱。


    你看，这就是通过信托的方式一方面把资产给子女传递下去，另一方面还对子女人生中各个阶段的风险进行了有效规避。


    第二种方式，就是极高端的人士还会选择自建管理团队。比如说成立一个自己的基金，成立一个自己家里里的资产管理公司，专门来打理家庭的资产。当然这种方法成本非常地高，同时也要付出很多的精力和时间去管理它。


    因为自建团队的成本非常高，所以第三种方式是目前很多的高净值人士会委托全球比较顶尖的机构，像洛克菲勒、美林、高盛来帮他们进行资产管理。


    # 传承影响力是全球顶尖富豪们在做的事


    在财富传承这件事情上，还有另外一群人，就是我们全球的顶尖“老钱”们，他们是怎么做的呢？


    我们东方国家、亚洲国家偏向于传承钱、传承产业、传承技能。一些古老的技术很多都是传男不传女、传内不传外的。


    +   - 给后辈钱，他们就是富二代；

    - 给产业，他就拥有了家族企业；

    - 给技能，他就变成一个祖传的手艺者。


    而西方国家的老钱们，偏向于传承价值观和影响力，也就是家族文化的传承。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '这里我要给你介绍一个投资品类叫 影响力投资，通过什么方式呢？就是通过投资教育和投资慈善。


    因为对于这些顶级的富豪来说，他们家族财富的传递一定是五十年、一百年甚至更长。


    在这个维度下，富豪们通常会选择投资教育，给孩子提供最顶尖的教育资源、教育环境，注重能力的培养，培养孩子面向未来的能力。


    这样呢，下一代长大后未必会被动接受父母传递下来的事业，而是可以根据自己的意愿，打拼出属于自己的一番事业。但是这个背后，关于财富最本质的东西，那些家族的视野、意志力、文化和精神，却被一代一代地传递下来了。


    另外，通过建立慈善机构，给自己的孩子做一些慈善方面的安排，也能让孩子养成对财富的敬畏之心，看到一些弱势群体尽量地关怀，培养他对这个社会的责任感和奉献精神。


    同时，做慈善这种方式，还可以让整个家族得到来自于社会的、政府的、政策的多方面的支持和保护。


    比如说比尔·盖茨花一二十年的时间建立了微软帝国，但是他在四十多岁的时候选择全身而退，完全将自己的财产投入到慈善领域。你看到盖茨基金会作为一个基金，它承诺所有的收益都是要捐献出去的。他的妻子、他的子女投身在全球需要救助的第一线。我在
    2016 年的时候，去盖茨基金会考察，发现他们对外宣传的很多材料里面，他的女儿都是在非洲那种最穷的地方用骆驼给人家运药、运淡水。有人说比尔盖茨是钱赚够了，想做点别的事情。但是更多的时候，我们应该看到的是比尔盖茨的智慧。'
