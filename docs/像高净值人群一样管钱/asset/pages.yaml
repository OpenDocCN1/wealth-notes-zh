- pgno: 33
  md: '作为一个高净值人群，想拥有这个社会最头部的医疗资源，通常他都会把自己的保额上得高高的，确保在意外发生时，能够第一时间获得最优质的医疗资源和医疗服务。


    当然，还有一些服务比如海外第二诊疗意见、海外医疗，这都是非常好的资源。这些服务如果你不知道，不享受，那 convocatoria 就是浪费了。我整理了一个服务列表作为福利放在文稿的最后，供你了解。


    我们曾经有一位客户，得了肿瘤，拿到国内的治疗方案后不放心，就通过保险公司把他的检查报告送到美国，请美国最顶尖的梅奥医学中心做了一次单独的会诊。然后拿两个诊结结果做对比，制定出更有效、更精确的治疗方案。


    你看，当你在某家保险公司上了足够的保额的保险，实际上就间接地获得了优质的医疗资源。


    # 一套最小化的个人健康保险策略


    从这个意义上，高净值人群是有一套最小化的保险规划策略的，我把它总结出来分享给你。


    如果你要为自己购买一套能够获得一定医疗资源的保险，可以根据这个方案进行筛选和调整：


    这个最策略其实非常简单，一个基础保障+3 倍于年收入的保额的重疾险就够了。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '首先，你可以为自己配置一个基础保障：拥有一份补充医疗保险，覆盖社保不能覆盖的自费药、私立医院或者特需门诊。


    对更好的医疗资源有诉求的人群，还可以考虑环球医疗，这类保障会提供像是紧急救援、海外治疗、医疗费用垫资等服务。


    不要以为这个很贵，基础的补充医疗其实一年可能只要几百块就够，高端的环球医疗一年只要一万多，可能比很多人养车的车险都便宜很多。


    其次，有一个比你的年收入高出 3 倍保额的重疾病保险，这是为了应对重大疾病导致的突发性大额现金消费以及在未来漫长康复过程中的收入损失。


    即使你是一个普通人，我也建议你，购买这类保险的时候，保额最少都不能低于 30 万，大概一年的花费也就是一万多一点。你要知道，当人得了重大疾病，30 万也就只是覆盖了一个医药费用，都不包含后续的治疗和恢复期的生活费用。


    当然，有的人希望再全面点，希望全覆盖的，还可以再购买一定保额的长期护理保险。当被保险人有一天丧失了生活能力、年老患病的时候，长期护理保险会为他提供护理保障和经济补偿。


    我从事保险行业的时间比较长，但这门课都讲到了这了，我才大范围提到保险，为什么呢？'
  merge: -1
  img_proc: true
- pgno: 35
  md: '因为保险这件事它不是独立存在的，而是一个解决问题工具。从健康风险管理这件事上你就能看出它工具的属性。


    我过去学的注册理财规划师课程，也会把保险作为财富管理的基石来强调。就是说疾病面前是不分阶层的，想要应对健康风险，我们每个人都需要建立自己的触发机制和应对方法。


    因为，从本质上来说，购买这种医疗、重大疾病保险：


    +   - 首先是对未知的健康风险起到一个保障作用；

    - 其次是利用保险公司的服务获得更好的医疗资源；

    - 另外，也是很多人忽略的一点。就算你健康真的出了问题，它后续的持续服务能力也会为你日后东西山再起打下基礎。


    最后，我建议你除了按照以上的方法为自己配置一套基础性保险以外，按时定期体检也是非常必要的。


    当然，还要养成健康积极的生活方式，比如坚持锻炼身体、健康饮食、定期疏导压力等。


    如果你有条件，还可以考虑日本或者美国的定期肿瘤筛查，尤其是日本。日本的 PET-CT 技术目前应该在全球是顶尖的。像东京一些公立医院，他们的医生完全可以在检查到一个人大肠褶皱的癌变风险，这一技术已经是非常厉害的技术了。


    # 本讲小结


    这一讲，你已经了解了高净值人群购买高额保险的两个原则。'
