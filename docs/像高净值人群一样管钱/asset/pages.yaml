  img_proc: true
- pgno: 26
  md: '第一个隐患，很多赠与的行为都发生在口头上或者私下场合，最后这些赠与都会在事后变成争议财产，所以大额的赠与，公证是非常有必要的。


    第二个隐患，是家长给孩子买的婚前房产，孩子结婚以后，把房子卖了再买新房，就变成了夫妻共同财产，一旦二人发生婚变，这个财产是要被分割的。


    第三个隐患，是父母对子女的现金赠与也要确保婚前、婚后的账户分离。


    我们有时候，给孩子的嫁妆可能是一张存了钱的储蓄卡，这个是婚前财产。但如果子女在婚后往这张卡里存了钱，那对不起，那这笔钱就变成了婚内资产，就意味着婚前财产是混同的，就成了夫妻两人的共同财产。


    第四个隐患，是父母在子女的婚后赠与，法律上会优先推定为是赠与小夫妻俩的。如果意愿是单独赠与与自己的孩子，也需要到公证处，做单独赠与的公证的。


    第五个隐患，如果你孩子是外籍人士，还有一个问题你要关注，很多国家是有遗产税的。为了防止大规模赠与以逃避遗产税，这些国家会同时设置赠与税。赠与税作为惩罚条款，它会设定一个额度，在合理额度以内是免税的，但是超过这个额度，税率就要比遗产税还高。


    我还要提醒你，有些问题，即使是公证也规避不了风险，比如说股票和房产。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '因为婚前财产公证对一些现金资产，或者说一些固定收益类资产还好，受法律保护，可以明确归属权。但是不要忘了，有一部分的资产是有增值部分的。婚前公证保护的价值是婚前财产的当时价值。


    比如说房产，在你签署公证的当下，你的房产的价格是受到保护的。但是婚后增值的部分，两個人是要分的。如果结婚的时候一只股票值十块钱，离婚的时候涨到三十块。对不起，那二十块钱的增值部分，两個人是要平分的。


    所以，现在大部份高净值人士不再继续采用赠与的形式，而是会借助一些工具；比如说法律架构、信托架构或者保管来进行管理。


    我们这里讲管理，指的是生前资产，遗产不在这一章讨论的范畴。


    # 借助法律、信托架构管理后辈资产


    那具体怎么做呢？我这里给你三种方法。


    第一种方法，比如说我们想给女儿一定金额的嫁妆，我们不一定要给房子，也一定不要给股票或者证券。我们可以通过投保保险并指定子女为受益人，这样就有效避免了子女的婚姻风险。


    不过保险，虽然可以分离所有权、支配权和收益权，但是在受益的形式上，灵活性比较差，基本上只能设置到期返还现金。在时间和金额上进行设计，并不能根据个性的需求来决定给付条件。'
  merge: -1
  img_proc: true
- pgno: 28
  md: '第二种方法，可以选择配置保险金信托。在保险的基础上实现信托的部分功能，比如求学、结婚、生子等正向行为的奖励，还能避免受益人的监护人挪用保险金，同时可以增加或变更受益人。


    第三种方法，就是设置家族信托。将资产交给信托机构，进行专业化管理，按自己的意愿明确信托受益人，包括分配的时点、条件以及分配的频率全权掌控在自己的手上，还可以灵活调整变更。


    家族信托可以实现资产不以子女的名义持有，不计入子女婚内财产，同时，离婚时也就不需要分割了。


    当然，不管是哪一种家庭，我们都可以考虑以签订婚前协议的方式，明确夫妻双方各自的财产和债务范围以及权利归属等问题，避免个人财产与婚后共同财产混同。


    # 本讲小结


    这一讲，我给你介绍了高净值人群会利用哪些工具来控制家庭关系变故导致的财产分割。


    这一辈人，好好照顾你的家人才是铁律，家庭和睦就是最好的投资；


    下一辈人，在给子女充分的自由的前提下，利用金融工具帮他们管理未来。


    如何管理？


    我给你讲了三种方式，分别是：'
  merge: -1
  img_proc: true
- pgno: 29
  md: '+   - 第一，以投保保险并指定子女为受益人的方式来规避下一辈的婚变风险。

    - 第二，选择配置保险金信托，在保险的基础上规范下一辈的行为。

    - 第三，设立家族信托，让专业的人更专业地管理下一辈的方方面面。


    接下来，我会告诉你为什么高净值人群那么有钱了，还需要购买高额商业保险。'
  merge: -1
