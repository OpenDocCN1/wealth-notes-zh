- pgno: 1
  md: '# 发刊词 | 为什么我要给你讲这堂课


    你好，我是李璞，欢迎来到我的得到课程《像高净值人群一样管钱》。


    听到“管钱”两个字，你是不是以为这堂课要教你怎么像有钱人一样投资和理财？


    投资和理财的事儿呢，银行的客户经理就能给你解决。而我要给你讲的，是高净值人群身上对于你来说最有价值的部分，也就是他们的财富观，这就是他们之所以成为高净值人群的原因。


    在长期为高净值人群服务的过程中，我逐渐意识到一个问题，那就是：


    具备一个更高维度的财富观和变得更富有这两件事情，其实是正相关的。


    也就是说，不是因为你很有钱，你才能谈财富管理，财富管理人人需要；而只是你提前树立了一个正确的财富观，管理好自己的人生，你今后才会有更多钱。


    换句话说，正是因为高净值人群具备系统的财富观和风险意识，才帮助他们成为更富有的人，资产也更加牢固。


    我是一名金融科技的投资者和创业者。创业之前，我在一家央企的保险公司做副总经理，负责营销管理、重要客户服务和私人财富管理。十几年的工作经历中，我直接或间接地服务过大量财富资产相对富裕的家庭和人群。在我们业内，把这样人群称为高净值人群。'
  merge: -1
  img_proc: true
- pgno: 2
  md: '瑞士银行和普华永道 2017 年联合发布了一项报告。这个报告中提到，中国亿万富翁的增速目前持续保持在全球排名第一的水平，从绝对数量来看排名也逐年提高。


    这就说明，我们国家近年来，高净值人群的数量是在快速扩容的。也许你现在不敢想，但我认为未来，你很可能就是他们其中的一员。


    所以，如果你能提前了解高净值人群现阶段：


    +   - 是怎样看待财富的；

    - 他们怎么配置资产；

    - 他们正在关心、焦虑哪些问题；

    - 他们愿意采用的解决方案和应对思路是怎样的。


    那这些先富起来的人的经验对于你来说就是有帮助、有价值的。这也是为什么我想得到开这门课的原因。


    那么，哪些人属于高净值人群呢？


    我先来先定义一下，这堂课中的高净值人群，指的是家庭可支配资产在一千万以上，并且有持续获得较高收入能力的人。


    这不是我瞎定的，保险业这么定，中国私人银行业也是这么定义的。但是我要再强调一下，不是说你有了一千万你就是高净值人群，纯粹的有钱只能算是高收入阶层，而高净值人群是说，你得有和这些资产相匹配的生活理念和财富观。


    他们到底是怎样的一群人呢？'
  merge: -1
  img_proc: true
- pgno: 3
  md: '具体一点地说，他们包括了创富一代、上市公司高管、家族企业二代，还有金融、法律、医生、演员、运动员、画家这一类专业性较强的人。


    说完了什么是高净值人群，下面我来跟你说一说他们的 4 个共同特点，正是这些特点决定了他们的思维方式，也影响着他们积累财富和规划财富的心态。


    # 第一个特点，执着与偏执。


    他们是具有两面性的人，每个人对成功，包括对自己的价值追求都是极其执着的。同时性格中偏执的那一面，也导致他们不太接受别人对他所处领域的某些专业意见的否定。


    # 第二个特点，自信与自负。


    我们知道，自信的背面就是自负。高净值人群对于一些企图在某些领域以更高自信压过自己的人是抱有天然敌意的。


    当我在给他们做投资顾问的时候，发现这些人其实听不进去意见，因为他们对信息的接纳程度取决于信任程度，除非你能够首先取得他们的信任，或跟他保持频道对等。否则，他的价格观是高于你的。


    # 第三个特点，敬业与痴迷。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '高净值人群曾经在财富积累的过程中投入了大量的精力和时间，所以很少有人能够兼顾事业又照顾好家庭。这种失衡导致他们在工作unque是敬业的，对家庭却是懈怠的。


    我接触的很多高净值客户，他们会希望用金钱的方式去补偿家庭，但往往家庭需要的却是情感和时间，这种需求偏差导致他们感觉到很无助。


    # 第四个特点，热爱风险又厌恶风险。


    资本的积累在初期总是伴随着风险与企业家精神，但也总是在积累到足够大的数额后，从“高收入”向“高净值”转化，这个区别就在于劳动收入向资本性收入转化，以及财富观念的升级。他们一方面在创富的时候选择拥抱风险，另一方面在保护财富的时候又厌恶风险。


    到这里，你可能会发现，你身上已经具备以上一种或几种高净值人群身上普遍具有的性格特质。但是不具备也没关系，因为我要马上要告诉你的是这些性格特质背后，导向的财富理念。


    接下来的一小时，我会把它们分成五个部分讲给你听，分别是：


    第一讲：高净值人群如何跨周期生存。


    我会从宏观角度给你讲讲高净值人群是怎么抵抗各类周期风险的。


    第二讲：怎样避免财产划分不清导致财富动荡。


    我会告诉你尽早明确股权划分和划分公私财产的重要性。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '第三讲：怎样防止财富分割风险。


    这一讲，我会告诉你，面对家庭关系的变动，高净值人群怎么控制风险。


    第四讲：怎样利用金融工具控制健康风险。


    我会从个人层面带你分析，购买高额保险对于高净值人群来说最大的价值在哪里。


    第五讲：怎样用金融工具传承家族意志和文化。


    你要知道，只有遵守了财富传承的规律，家族才不会衰败，财富才不会消亡。在整个家族的财富传承这件事上，我要告诉你高净值人群的理念是什么，他们通常会运用哪些工具来完成家族财富的传承使命。


    听完这五讲，你就会明白：


    财富管理的核心，不是怎么管理好你的钱，而是怎么管理好你的人生。


    希望这堂课，能让你在自我财富规划的道路上，获得最有价值的洞见和智慧。


    好，下面请跟我一起正式进入第一节，高净值人群如何跨周期生存。'
  merge: -1
