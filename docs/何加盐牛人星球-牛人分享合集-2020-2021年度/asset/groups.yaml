    实缴，现在是认缴。你可以把资本金搞得无限大都没问题，可能你现在身上有1万块，但是你可以注册一个一千万的公司，没问题。你的营业执照上显示你的注册资本一千万。


    但是这个一千万呢，它是认缴的，它不是实缴的，实缴的才叫实收资本，这个报表的编制主体是企业，比如说我成立了一家公司，这家公司正常来说分法人企业和非法人企业，所谓的法人企业和非法人企业的区别就是它是否能够独立承担法律责任。不管他能不能独立承担法律责任，作为一个会计报表的主体，它和你个人是独立开的，你只是这个企业的股东，你并不代表这个企业本身。所以呢，这个报表它是站在企业的主体上来编制的，所以它这里写实的实收资本不以你认缴的来显示。比如说你认缴一千万的注册资本，你的营业执照上显示你注册资本一千万，当时你只交了一万块钱，那你这个报表的所有者权益，实收资本只有一万块钱。现在国家真的是鼓励大家创业，也不需要验资了，也不需要出具审计报告了。以前总是常要找人作验资，出审计报告，我们会计师可以赚一把审计费，现在都没了。然后我们刚才说了，就是说这个实收资本呢，是你实际交足的数值，才在实收资本这个项目里面反映。


