    美国有一个典型的说法就是红蓝两个阵营，分得非常的清楚。从选举地图来看，特朗普就是在美国南方，是大片的都是红色的这些州；民主党的地盘呢，就是在西部加州这些地方，然后还在东北部纽约这些地方，这个阵营看似非常清楚。但其实在美国的历史上，很搞笑的一个事儿是，南方现在看起来是民主党好像不行，全是红通通的一片，都是特朗普的粉丝啊，是共和党的地盘。其实在南北战争美国南北打仗的时候，南方是民主党的地盘。


    我这里发了一个地图，这个选举地图，看上去南方是蓝色的，其实就是民主党的。这是 1900 年美国大选的选举地图，南方是民主党占优的。但是北方是红色的，是共和党占优，当时是共和党的。麦金莱当选了南方这个民主党的，他就叫南方基地。虽然是南方基地，但是打不过北方的。所以在
    1900 年时，是民主党在南方，共和党在北方这么一个趋势。


    而且美国在 1900 年的时候，大选阵营还是按照南北划分，民主党在南方，共和党在北方。但是之后就发生了一个离奇的逆转。民主党跑到美国的东北部去发展了。


    以前美国人大选，阵营也不是这么鲜明对比。如美国历史上经常发生压倒性的胜利，也就是说，要么就民主党的人得了压倒性的胜利，比如 400 多比十几啊，或者是共和党这边呢，500
    多比十几啊这样的比例胜利。这张地图，是 1984 年美国选举的结果，是里根以 500 多比 13 大胜他的对手蒙代尔，这是美国历史上共和党最大的一场胜利。但是是从小布什他爸老布什
    1988 年当选之后，1992 年开始美国逐渐就呈现出了两党的阵营划分，越来越清楚这么一个现象。


