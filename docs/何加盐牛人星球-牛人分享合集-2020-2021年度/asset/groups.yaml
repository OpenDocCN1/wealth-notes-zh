    ## 如何通过有效沟通更好地达到目标


    分享者：媛媛，某咨询公司总经理。


    分享时间：2020年7月


    各位星友，晚上好！我是媛媛，何加盐的太太。曾在上海高校做过老师，后随何老师定居广州，先是在中山大学一个科研机构工作，后来加入企业管理咨询行业，目前在广州一家企业管理咨询公司担任总经理兼项目总监，十多年
    来调研过各行各业几百家企业，访谈过上百名知名企业高层，曾经给广州酒 家、广州塔、王老吉、珠江钢琴、广汽集团、酷狗音乐等多家知名企业做过管 理咨询项目。


    今天跟大家分享的主题是《如何通过有效沟通更好地达到目标》，之所以会 选择这个主题，是因为我每次回顾和思考了自己过去的经历，觉得我做得比较好 的地方或者说我成就感的来源大多跟它有关。


    在高校做老师的时候我最大的成就就是改造了几名问题学生，他们从一开始 逃学、打架、挨揍甚至抢劫，发动全班同学发短信轮番骂我，搞精神轰炸，到 跟我成为朋友，信任我，在我的劝导下开始认真学习，这都离不开真诚的沟
    通。


    在科研机构，我筹备并举行了好几场大型高端学术会议，甚至人在广州远 程筹备并成功举行了一场在北京的重要学术会议，参会的嘉宾都是全国乃至国 际知名的专家学者，这也离不开沟通。


    而做企业管理咨询，沟通能力就更重要了。咨询是一个信任品。从开始 的接触，怎样让客户信任我们，怎样谈一个好价格，项目过程中怎么能够平衡 好各方面的诉求等等，可以说没有沟通能力就很难把管理咨询做成功。


    在这个过程中我也作为合伙人参与了一个互联网创业项目，团队大部分人 都是我招聘的，大家非常信任我，有有些人是自愿除薪加入的，即使这个项目 因为投资人撤资最终夭折了，团队所有成员仍然给予了我们最大的支持和理
    解，甚至表示如果我们再创业他们还是会加入。这也是日常深沟通带来的效 果。


    我想既然要跟大家分享就一定要找自己最擅长的，把最好的经验拿出来。

    所以我选择了这个主题。至于管理咨询领域的知识，何老师都已经分享的很多了，如果以后大家还有其他感兴趣的也可以告诉我，我也可以继续跟大家分享。


    沟通和幸福一样，相信每个人都有自己的见解，我不敢说做得多好，也在不断的学习中，这次如果能够对大家有所启发，带来一些思想的碰撞我就非常开心了，也欢迎大家多多指正，多多交流。下面我们正式开始。


    首先，沟通的前提是明确目的。也就是说每一次沟通之前我们要非常清楚这次沟通的目的是什么，要达到什么效果。目的明确了，方法才能到位，更重要的是保证在过程中不至于跑偏。这个听起来是非常简单甚至不用讲的基本道理，但在现实中很多人却往往没有做好，经常说着说着就忘记了自己原本的目的什么，甚至出现了南辕北辙的结果。


    一般会造成这种状况，有两个原因，一个是沟通对象思维太过于发散又特别能说或者与自己身份、地位、认知不对等，不知不觉就被带偏了。比如，你原本是想向孩子同学的家长取经，她家孩子是怎么学习好数学的。这位妈妈非常善谈，表达欲望又特别强，夸起自家孩子就停不住，一聊就是半个小时，聊完之后你发现想要的信息没多少，完全成了她夸奖孩子的个人秀；再比如，你原本是想跟老板谈加薪，进去之后要求还没达成，反而又被分派了一堆活；你想说服父母不要相信市面那些夸得神乎其乎的保健品、保健器械，父母却认为你不关心他们，怕花钱。


    另一个就是自身情绪的影响，沟通时被好胜、生气、害怕、愧疚等情绪左右，沟通变成了情绪的发泄或者逃避，这种情形尤其在越亲密之人之间越经常出现。之前流行的各种调侃辅导孩子做作业的情景就是非常好的例子。原本目的是想要孩子把作业做好，往往就变成了孩子和父母之间的情绪对抗。还有经典的场景就是夫妻之间关于做家务、带孩子的矛盾，原本是想要另一半理解自己的辛苦，两个人共同分担，却因为内心的
    unsatisfied 和心态的失衡，而采用指责、埋怨、嘲讽等不良的沟通方式来处理，最后造成夫妻之间的争吵甚至渐行渐远。


    这些都是我们所说的无效沟通。无效沟通不仅浪费时间，降低效率，还有可能造成双方关系的隔离。那怎么能够避免这种状况发生呢？


    其实也很简单，就是我们心中要对沟通的目的非常明确，始终要把这个目的当成一根槎，牵引整个沟通的过程。


    接触过管理咨询的人都知道，我们做咨询在进行访谈之前都会准备一份访谈提纲，新闻采访、对话、谈话类节目大都也是如此。我们这份访谈提纲的目的就是为了能够引领整个访谈都始终围绕着中心，不要跑偏了。所以在重要的沟通前，明确沟通的目的，把要达到的效果1、2、3都列出来，沟通时放在目光及的方时刻提醒自己，尤其是在商务谈判、洽谈中是非常必要的。


    另外，这里还有一个商务谈判的小技巧，就是你要作为沟通的发起方，比如打电话是你先打给对方，而不是等对方打给你，因为你在打电话之前肯定都已经做了充分的准备和预演，沟通的时候才能掌握主动权。如果对方电话打来了，你还没有准备好，可以说内部先商讨一下再给他回复，或者说现在比较忙，稍后再回电，把主动权夺回来。


    回到沟通的目的，我不是说平时跟家人说话都要列个提纲，但是开口说话前一定要在脑子里过一下我说话的目的什么？想要达到什么效果？在沟通的过程中，脑海里始终要有这个目的，发现开始偏离的时候要及时拉回来，比如，当你开始生气的时候，提醒自己我的目的是让他把作业做好，而不是发脾气。我是想要让他帮我分担一下家务，而不是要激怒他。这样可以以一定程度的减小说绪化的沟通。对我是非常有用的，大家也可以尝试一下。


    其次，要了解沟通对象。正所谓知己知彼，百战不殆。我们在沟通前一定要对沟通对象有充分的认知。如果是接触一个新的客户，我们需要先对客户的企业、沟通对象本身的职位、性别、年龄、履历等做一个基本的背景调查。这样才能能够对对方可能的诉求、喜好、状态有基本的了解，沟通时做到有的放矢，更容易在第一次见面就找到对方感兴趣的话题，形成良好的互动，在沟通中占据主动。这个在商务场合大部分人应该都可以做到。


    往往我们的误区来自于生活中，就是理所当然地认为自己的家人，父母、爱人、孩子，我当然很了解，我们每天生活在一起，怎么会不了解呢？问题是真的了解吗？你了解的是你认识的他，还是真正的他？简单的说就是你对他的了解是否带着主观的偏见和喜好。


    举个例子，经常有父母会这样形容自己的孩子，他就是胆小、害羞，不爱跟别人打招呼；或者老婆评价老公，他这个人就是懒。那么孩子为什么胆小和害羞呢？是因为环境没有给他提供足够的安全感，还是仅仅因为他还小，对于社会交往还需要时间来慢慢适应？老公真的懒吗？为什么懒？是因为从小被娇惯不会干活还是因为你太能干，总是谁帮什么都干不好？


    我们对于越亲近的人越容易产生控制的欲望，总希望对方能够按照自己的意愿行动，满足自己的预期，如果对方没有达到预期，或者做出违背我们意愿的行为，我们就会产生失望、委屈、愤怒的情绪，并用自己的几怨等对方言语和行为的结果。比如，“你最近一下班就本着一张脸，是不是对我很不满，是不是不爱我了？”
    “我辛辛苦苦把你拉扯大，你就是这样来回报我的？”这些都是典型的情绪绑架，这样的话一出口沟通的结果自然不会好。


    所以我们在沟通之前要真正了解对方他想要什么，他会怎么想、怎样说他的接受度高，这样才有可能达到想要的效果。这就需要我们换位思考了。换位思考这个词说的太多了，因为它在人际交往中确实非常重要。


    有些人可能会说我知道要换位思考，可现实中就是做不好。那这里我分享一个自己常用的方法，就是角色代入或者也可以叫做角色扮演。我经常会跟女儿玩角色互换的游戏，她来当妈妈我来做女儿，尤其是当有些事情她情绪反应比较大，我知道讲道理没有用的时候，我会暂不处理。选一个她心情好的时候，用玩游戏的方式代入问题，你会发现女儿视角里的妈妈原来是这样的，当女儿用你的语气说出你经常说的那些话时，作为“女儿”的你会感受到平时体会不到的她的情绪。而她也更加能够理解妈妈的想法。对于不擅长换位思考的人来说，做一些这种游戏有利于锻炼换位思考的意识和能力。


    我们可以再沟通前，将自己代入到对方的角色，思考他所处的情境以及他内心的想法，在脑海中模拟沟通的过程，注意这个模拟的过程你始终是对方的角色，而不是用自己的视角去看待对方。这样就能够更加贴近对方真实的需求。


    举个例子，当你要去跟老公/老婆谈让他/她多分担一些家务的时候，你先把自己想象成他，为“自己”找一些理由：我不做家务是因为工作压力太大 了，太累了，下班回家就想堆在那里放松一会；我不做家务是因为这种事情根本不需要我做，没有人分派任务给我啊，反正会有人搞定，我只要把钱赚回来就行；我不做家务是因为无论我做什么，他都看不上，都认为我做得不好，那我干脆不做了……


    这里你可以千万忍住不要精分，刚想到一个理由就跳回自己的角度去反驳：你工作压力大，我就没有压力吗？！在角色代入彻底完成之前，你一直是对啊方。当你站在对方的角度把他可能的思想都罗列出来之后，针对每个想法你都可以想到一套说辞来应对，然后继续代入角色听到这些说辞后会有什么反应，怎样的表达方式更容易接受。模拟完后再去沟通，效果就会截然不同了。


    听起来似乎显得很麻烦，其实并不会，我们在面对重要客户时，一言一行可能都会事先演练多次，生怕把生意搞砸了。其实，家人就是我们人生最重要客户，为什么我们不稍微多花点精力来跟他们搞好关系，沟通好呢。


    以上两个沟通的前提做好之后就是我接下来要讲的第三点，根据沟通目的和对象的不同选择合适的沟通方式和渠道。


    有句话叫做见人说人话，见鬼说鬼话。虽然它通常带着贬义的味道，但其中还是有可取之处的，面对不同的人，我们需要选择不同的表达方式。


    关于这个，我们曾经有一个很有意思的总结：给下属分派工作一定不能让他听不懂，为啥？听懂了都不一定做到让你满意，听不懂岂不是更糟糕；跟老板汇报方案一定要让他半懂不懂，全懂了老板就会忍不住处处指手画脚，你还怎么开展工作，全不懂，这个方案就黄了；向教授推销东西一定要让他懵懵懂懂，也就是让他自以为很懂，接触过大学教授的人一定能
    get 到这个点。我们还可以举很多例子，比如秀才遇到兵，有理说不清。如果秀才遇到了兵还在那里一手一字者，自然没法沟通。我们要根据对方的特点选择他能够接受和适应的沟通方式，也就是用对方的语言体系来沟通，这跟我们去国外要说外语一样的道理。


    上面说的是对不同的人要有不同的沟通策略和方式。我还想提醒大家的是不同的沟通渠道。现在微信很方便了，很多人都把微信当成沟通的主要渠道，有些人总是喜欢发语音，第一次接触的人也直接发语音，甚至直接拨语音电话，他们可能认为这样效率高，或者觉得太忙了，这样自己最方便。可是他们却忘记了考虑对方是否方便？尤其是对于不熟悉的陌生人，一上来就给他别人发语音，别人是否方便听？是否愿意听？我会认为这种人比较自我，没有礼节的常识，自然不会有好的第一印象。


    也有可能是我与时代脱节了，现代的年轻人更崇尚高效，或许他们不会在意这个点。但是如果你的沟通对象是像我这个年纪的人，他们特别忙，又或者他们身份地位比较高，学历比较高，那么我建议保险起见你能够用文字说清楚的问题就尽量不要语音，如果确实需要电话沟通，也可以先发个微信询问一下对方是否方便。你自己节约时间可以下载个讯飞输入法，直接语音说转化为文字再发，并不会耽误太多时间，却给对方带来便捷，何乐而不为呢？其实，这也是换位思考的另一个表现。


    另外一个被忽略的渠道就是邮件，其实很多大公司的职员或者高校老师都有工作邮箱的，这个工作邮箱的命名是有规律可循的。如果你想联系某个大公司的高层或者某个知名教授，可以去寻找规律猜测出邮箱。对于这些大牛来说第一次接触用邮件沟通也是比较合适的方式。因为邮件是他们日常工作必须严格要处理的，你发的邮件如果没有被当成垃圾邮件的话他基本上都能够看到的。


    而且邮件书写内容的空间更多，最适合用来第一次打动别人。


    何老师考研新大的硕士时，想选经济学院的一位知名教授作为导师，在考研之前他就用一封邮件打动了导师，得到了导师的高度认可。至于怎样打动大牛，就要靠邮件的标题和内容了，这是何老师最擅长的，以后他会跟大家分享写作的课程，这里我就不再多说了。


    接下来，我给大家讲一些具体的沟通技巧。算是抛砖引玉，群里如果有经验丰富的专家也欢迎接下来继续分享、探讨。


    ### 第一点是沟通的内容要清晰简洁。


    在保证清晰的前提下尽量用简洁的语言来表达，能用一句话说明白的就不要用两句，能用两句话说明白的就坚决不要三句。大家都知道我们人类大脑的记忆规则对3以上的东西是不太能记住的，科学实验已经证明了这一点。另外，尤其是对于一些牛人来说他的时间是非常宝贵的，没有太多时间听你�iler。我这里也举一个对我触动比较深的故事，希望对大家也能有所启发。


    有一次，某知名高校的校长给全校的大牛教授们开会，让他们用 5 分钟讲述清楚自己的科研成果。教授们炸锅了，有一位教授上来就说，我昨晚熬夜到很晚才做好了这个 PPT，一共
    50 多页，我的成果不可能在这短的时间内就讲完，所以我会超时，至少需要 15 分钟。这时，校长就起来打断了他：“你上来就说你很辛苦，熬夜做好的 PPT，这只说明了你能力不够（如果够能力就应该在工作的时间处理好了嘛）；你说你的成果不可能
    5 分钟讲完，更说明了你表达能力低”（这个教授以前是校长的学生，亲信，所以能这么讲，选自己学生开刀，也是杀鸡儆猴，校长很高明），同时，校长讲述了自己的经历：


    有一次，主席来考察，见到知名学者，校长也在其中，每个学者只有一分钟的时间向主席说明白自己的成果。校长只用了三句话就让主席弄明白了他是干什么的。他说：“我的工作类似地球医生。我能够勘探到地表以下
    300 米范围内所有的物质。我的成果能够让国家做好未来 100 年的资源规划和布局”。


    校长一席话说完，教授们都不吭声了。


    我们自己平时也可以多做练习，如果给你一分钟在大佬面前推销自己，你会怎样讲。推销自己的公司或者产品又要怎么讲？这里面其实也有很多方法论的东西，比如 star
    原则、个人标签等，感兴趣的可以自己去搜索学习，但最关键的是反复的推敲、打磨和练习，每一次比上一次更进一步一点。


    ### 第二点是适当的自我暴露有利于增强彼此的信任。


    大家仔细回想一下，一场你觉得跟对方亲近感增强的沟通，是不是多多少都有一方对自我信息的暴露。比此，我跟你聊了我的初恋，你是不是会觉得我很信任你、 pretty
    你跟别人不一样，毕竟初恋对我而言是有特殊意义的，不会对谁都讲。那么你自然也会对我更加亲近和信任。


    这就是自我暴露，我向你讲述的信息越隐秘就意味着自我暴露的程度越深，在你看来也代表着我与你的关系越亲近。这一点尤其在与下属、孩子、学生等处于弱势地位的对象沟通中非常有用，能够让他们放下戒备。


    比如，对于刚招聘进来的新同事，我们一起去客户处洽谈，看到他非常紧张的表现，我当时不说什么，回来路上跟他闲聊，讲述我第一次站在台上讲话紧张失措的故事，他顿时会觉得原来你也曾经跟我一样啊，马上就会觉得我亲近了很多（当然我原本就很易近人哈），这时我再借机告诉他刚开始会紧张
    很正常，练习多了经历多了自然就会越来越好，看我现在的状况就知道了。这样也能够及时消除他内心的不安和沮丧，鼓励他更加努力地做好。


    我在学校最初化解学生的敌意也是用得这一招，我会跟他们讲自己做学生的时候曾经犯过的错，让他们感受到我不是高高在上来指责他们的老师，而是跟他们一样曾经青春少年，理解他们的想法，懂得他们的需求并且真诚为他们好的朋友。在家里，我也会经常跟女儿聊起我她那么大时候的事情。


    当然，大家不要忘了这里讲的是适当的自我暴露，自我暴露的目的，是为了赢得对方的亲近和信任，自我暴露的信息也要有助到达沟通的最终目的，而不是把自己的事情、隐私、情绪都一股脑的倾倒给别人，要记住：没有人喜欢祥林嫂。每个人都希望自己是主角，希望被倾听。这也是我要讲的下一点，善于倾听。


    ### 第三要点善于倾听。


    英国国王爱德华八世的爱情故事很多人应该都听说过。他为了娶一个离过两次婚的美国女人辛普森夫人，而放弃了王位。被认为爱美人不爱江山的典范，而这位辛普森夫人容貌并不惊艳，据说她最厉害之处就是善于倾听，总能在第一次见面时就让对方感觉到她是自己的知己。这就是倾听的魅力了。


    我们在与人沟通时，不要总是急于表达自己，而是要善于倾听，并且给予积极的反馈和引导，让对方谈出我们需要的信息。只要你把话题引导到他们自己身上，尤其是让他们谈论自己喜欢并得意的东西，他们都会很乐意参与，因为谈论自己让他们感觉自己很重要，也会让他们感觉你把他们摆在一个重要的位置上，关心他们的状态、想法和情感。


    也许有人会说这也是说起来容易做起来难。这里有两个小妙招，一个是别人说完话，你停顿一秒再反应，一秒是很短暂的时间，但足以让我们控制住本能，回归理性。很多时候我们说话是不经大脑，脱口而出的，也就是只用了大脑的自动驾驶模式，停顿一秒可以让我们切换回手动驾驶的模式。


    第二个是当你想说“我”的时候，尝试把“我”换成“你”，比如：“你喜欢什么？”而不是“我喜欢XXX”，“你怎么看？”而不是“我觉得怎样”，如果你实在忍不住表达的欲望，也要在意识里在自己一段表述结束后，把话题转移到对方身上，“不要光我说了，你也说说你的想法”。

