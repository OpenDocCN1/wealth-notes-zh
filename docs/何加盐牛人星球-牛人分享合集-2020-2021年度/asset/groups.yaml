    大家想一下，这样的孩子之所以有这样的行为，就是因为他是被宠出来的小皇帝。到了学校里边，家长还要动用自己的力量来给孩子营造皇帝的氛围。大家可以想象，这个孩子如果不改变，未来会受到多大的挫折。


    还有一类家长把孩子当成一张白纸，觉得这张白纸可以画最最最美的图画，随着自己的想法画。有的觉得这个小孩长得像小女孩，而自己又喜欢小女孩，就索性给这个男孩穿上了小裙子。殊不知，这样的方式可能会让孩子性别错乱，未来可能有一天给你来个同性恋看看。有的家长发现孩子肚子特别小，觉得这个孩子不应该胆小，然后就让孩子晚上出去或者去看鬼片儿，要练他的胆大。结果发现，这个孩子胆儿越来越小，那是因为这个家长根本不知道，孩子大体从心理的角度可以分为五种气质类型。这五种气质类型是天生的气质类型，你要用不同的方法来对待它。否则，就相当于给羊吃肉，相对于喂狼吃草。你费了非常多的心力，却并不能得到有效的结果。


    这五种气质类型分别是乐天型、冷静型、忧郁型、激进型和牵敏型。忧郁型的孩子特别渴望自由，不希望别人管，他们最极致的目的就是为了懂得真、善、美。


