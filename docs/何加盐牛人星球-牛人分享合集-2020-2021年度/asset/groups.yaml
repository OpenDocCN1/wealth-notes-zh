    简单的一句话，就是我们怎么在这个社会上怎么混，对不对？怎么混到一个金字塔的顶端，不管你是做技术的也好，还是做教师的也好，还是做创业也好，还是做销售也好，还是做嘎怕很基层的文员也好，我们最终怎么能够成为这个社会上的一个所谓的精英阶层，我们怎么能够日益越来越好，然后职位越来越高，当然也希望钱也赚的越来越多，然后这个日子也越来越幸福，对不对？这可能是我们每个人共性，如果翻译成一个非常接地气的话，就是如何在在这个社会上混的越来越好。


    我为什么敢分享这个主题呢？是因为我在友邦做了 22 年，倒不是我多么成功，而是我观察了很多个人。


    我处于一种不动的一个状态，在友邦保险公司 22 年，但是我所认识的客户和社会上的一些人，他们往往都在不同的异动中，在不断变化，我就去观察，'
