    分配利润的年初余额，加上利润表里的本年累计数的净利润，就是说净利润的本年累计数，加上资产负债表未分配利润的期初余额等于未分配利润的期末余额。但是呢，真正的财务在做报表时，他并不是这么加加减减做出来的，它是由会计凭证自动生成的。所以很多企业，他在编制假报表的时候，他总是对不上，他顾了这个数，那个数又冒出来了，因为它这个数之间都有逻辑关系，我等一下会再介绍它们之间的逻辑关系。


    刚才我在介绍未分配利润这个数的时候，我有说到它跟净利润之间的勾稽关系，这里边的勾稽关系，还要受到盈余公积的影响。这个盈余公积是什么意思呢？


    其实可以根据资本公积来理解，我刚才讲到了这个资本公积，指的是更多的是股本溢价。当然资本公积包括的不仅仅是股本溢价，为什么我这么说呢？假如说我是一个医院，别人捐赠了一栋楼给我，或者捐赠了一套很大型医疗设备。然后这个医疗设备占我整个医院的总资产的比重比较大，他捐赠的东西一般都作为资本公积。为什么呢，因为你捐赠的东西不属于你的收入啊，它不属于你经营活动。它不产生现金流，它不是可以直接放在货币资金，或者放在收入里面的，它就形成了你企业的一种资本积累。当然不是所有的捐赠都可以放在资本公积里，比如说它捐赠了一个很小的东西给我，然后当期我就把它消耗掉了，我就不能放在资本公积里面，资本公积它一定要能够形成我企业沉淀的，而在捐赠的时候，能放在资本公积一定是交过税了。


    我刚才举了一个例子。比如此说别人捐赠了一栋楼给这个医院，对于这个医院来说，它其实不是收入。如果是收入，它实际上又收多了一样东西。如果你把它做成收入就会影响利润表里的数据，利润表会让当期的利润变大。所以这个接受捐赠的东西是不能归到利润表里面去，因为利润表它会影响当期的利润。当期的利润，企业可以分红，可以根据利润来分配给股东。但是有的时侯不是因为你企业经营业绩好，不是因为你的经营成果优秀，你形成了未分配利润，你才能给股东分配利润。如果接受捐赠的大型资产被我直接当利润给分了，这初衷就变了。比如说有一些捐赠不是政府款，只是企业自发性的，民间这些捐赠，一些公益性或者非公益性这些捐赠，他本意是让你企业发展壮大的，形成你企业工具的，形成你企业的资本积累的，而不是让你现在马上拿'
  - '[PAGE 52]


    着这个钱实现的。所以呢，从这种角度上来说，放在利润表里也不合适。


    还有一个问题就是税收方面的影响，你如果放在利润表，你给它放在收入里边，收入是要交税的。这个收入交税，其实不仅仅是只交一个流转税。说到流转税，我就再解释一下，流转税之所以叫流转税，它是流转额，就是你只要发生了流转，比如说你一块钱买的，你五毛钱给卖了，或者你一块钱买的，两块钱给卖了，我不管你是亏还是赚，总之以你的流转额，以你的销售额来征税，这叫流转税。


    然后我们拉到这个利润表，看到第 15 项利润总额，下面有一个所得税费用，这个所得税费用它呀是根据利润来征的，它就不是我们刚才说的流转税。管你有没有利润，你只要发生流转就征税，也就是现在所说的增值税，现在没有营业税了，营业税之所以叫营业税，它是根据营业额来征的。增值税之所以叫增值税，它是根据增值额来征的。那我刚才说了你哪怕一块钱买的东西，你五毛钱给卖了，你没有增值，你也要交增值税。为什么呢。因为国家就觉得你明明一块钱买的，你非用五毛钱卖了，他就算给你一个四成销售价，他不按照正常销售价。因为正常一个人没有说把这些东西以比它的成本更低的价格卖，如果他这种以比成本还低的价格卖，有几种可能，第一种可能扰乱经济秩序，故意的。比如说我们现在买卖二手房，有的时候它不以你去开发票的价格，也不宜你贷款的评估价，而是税务局会给你一个评估价，这个价格叫公允价格。因为他认为你低于本钱卖的商品，是不公允的，所以他给你评估一个价。所以这个时侯就算你是低于成本卖的，他也认为你有增值。但是还有一种情况，确实是市场经济不好的时候，你就低价卖东西，但是你低价卖，因为增值税它是可以跟进项抵扣了。这个我越讲越复杂了，所以我就ละ展开了。那我这里面其实主要还是为了让大家理解这个所得税费用，这个所得税费用其实它是针对所得税的，你企业有利润，有所得才征所得税。


    然后呢，我们刚才其实还是为了说资产负债表里的资本公积，那这个资本公积，它是这样的，因为它不属于你的收入，如果我们不给他放在资本公积里，你给它放在收入这个科目。因为你接受捐赠，你企业的资产变多了，你必须要在报表上有体现。那你有体现的时候，如果放在收入里面，因为你不属于流转，如果你放在收入里面，那你就得交税了。但是国家他征税，他也不是胡来'
