    然后，比如说非流动负债下边有一个长期应付款，这个应付债券我就不再说了，其实顾名思义就是你发债券。然后长期应付款一般指的是融资租赁的形式，融资租赁指的是什么意思呢？假设说我现在有一栋楼，我通过银行融资可能比较少，金额比较少，或者是说期限、额度、成本什么都可能受影响。而且银行贷款对企业的经营总情况，流水要求比较高，那我有可能跟融资租赁公司合作。我在跟融资租赁公司合作的时候呢，比如说我先估值这栋楼，假设值十个亿，十个亿我以售后租回的形式卖给一个融资租赁公司。我以十个亿卖给他，我就收到了十个亿。收到了十个亿以后，我每个月付租金给他，其实是每个月还本付息。我表面上卖房子收到的这个钱就放在长期应付款里边，其实它是融资租赁应该付的本金。所以通过关注长期应付款，也是看一个企业融资结构很重要的一个指标。


    然后这个长期应付款我也再展开说了，受时间限制。那我说这个预计负债，这个预计负债为什么要跟流动负债某个其他科目以及非流动负债其他科目区别开呢？它只是一项预计的行为，但这个预计的可能性要大于60%。比如说我卖100万的产品，我产生了保修费可能在20万，那我这个20万产生的可能性，根据我过去的经验可能大于60%以上，只要是95%以内的都放在预计负债，你这个是要预计的。我们财务有一个原则，永远不要高估资产，但是永远不能低估负债。这个是预计负债核算的一部分内容，还有一种，比如说我现在正在进行诉讼，正在进行仲裁，但是我败诉的可能性很大，我一败诉，我有可能要赔人家钱，诉讼费我要承担，这个时候要放在预计负债里。如果是已经判决下来，判决书藏了，马马上强制执行了，这个时候你肯定是直接放在负债里面，就不能再放在预计负债里了。


    左下角的商誉、无形资产、开发支出是什么意思呢？无形资产一般指的是没有形状和载体的资产，但它有价值，比如说专利权、专有技术等等。我开发了一些软件，这些一定是有价值的，它们有市场价值，可变现的。开发支出指的是在开发的初始阶段，我还不知道这个开发有没有成果形成，还能不能投入到市场，有可能成功，有可能失败，所以前期我这些研发支出只能放在开发支出里面。


    那有的朋友可能会想，你既然放在开发支出，为什么不能放在费用里面呢？它又不能放在费用，为什么呢，因为它是需要资本化的，不能费用化。因为国家有要求的，你什么东西都记到当期的费用，你就会影响当期的利润。这个东西大家自己去衡量，到底是放在利润表还是放在资产负债表。是在会计准则的要求下，要考虑税收筹划，我为什么这么说呢？企业所得税上有一个五年亏损的弥补期限，指的是什么意思呢？比如说一家企业第六年产生了利润，你可以用第六年的利润弥补前五年的亏损。那这家企业的所得税也少交了，第六年虽然有利润，但是由于之前年度有亏损，你想把它给弥补了才交所得税。


    有这样的一个情况，假如说你现在有很大金额的研发支出，你一下子当年就给它计入费用了，你当年亏损的很厉害，但是你明年可能还亏损，后年还亏损，你可能亏损到第七年才有利润，那这个五年亏损弥补期就过去了。那你第一年进行了大幅的费用，导致的大额亏损已经不能放在第七八年去弥补了，其实你企业还是吃亏了。如果你放在费用里边，比如说放在资产负债表的开发支出里边，你以后形成了无形资产也好，或者这个项目失败了，你再计费用也不迟。


    你甚至可以分摊，你给它按几年摊都没有问题，这个看自己的利润情况去调节。然后资产负债表的右边，我还想说一个科目叫预收账款，预收账款的会计科目在应付账款下边。记得我刚毕业的时候，甚至在我刚毕业前十年，比如说在2009年的时候，我同行内都会有一种说法，就是说财务最复杂的是制造业，做制造业的成本核算复杂。其实这种说法是错误的，当时之所以感觉制造业的成本核算复杂，是我们的核算工具和核算能力太差了，其实真正复杂的是房地产。


    我从2002年到现在，一直没有离开地产这个圈子，其实我觉得地产的报表才是最有看头的。那我这里为什么会在这个时候提到房地产的报表才是最有看头呢，就是因为我们才说预收账款这个会计科目，这个预收账款它是一个负债类科目，但实际上它是一项收入来看。对于房地产来说它是一项收入，所以你要要是看房地产的报表，你都不敢看资产负债率，每一个房地产的资产负债率都高得要死。


    实际上就现在这种状况，房地产的资产负债率却是最低的。为什么它只能做开发贷，现在国家打压的太严了，基本没有别的融资渠道，你想搞一些拿地的资金，融资啊这些东西，其实更多的都是通过非银行渠道，比如说私募基金，成本都非常高。那些东西一般都不会并入表内，都不敢反映。因为呢，第一国家不允许采用这种手段来拿地，第二个融资成本太高了。现在融资成本国家也都有要求，然后还有银行这一块儿对房地产融资的时候设防。所以，房地产行业的资产负债率其实并不高。


    当然我说的资产负债率并不高，仅仅是看表象数据，那这里就不得不提的是这个预收账款，这个预收账款其实是房款，在中国现在所有的房子基本上都是预售，当然也有限制。像这个预售一般情况下一线城市都是必须建到70%才能办预售证。比如说30层的房子，你要建到21层，达到70%的工程进度才能办预售证。然后你像下面五线城市，有的只要建到地平面就可以办预售证，它离交楼还有很长的时间。一般情况下，拿到预售证到交楼最少也有两年的时间。


    房地产的确认收入是在交楼的时候才确认收入，只有把这个房子交到业主手上，它才跑到利润表的营业收入里面，在交楼之前，所有收到的房款都在预收账款里面。所以你说一个房地产公司的负债看起来是不是很高，这个预收账款它含有利润是收入来着。预收账款表上是一项负债，其实是收入。其实只要在交楼之前，我们业主都有资格退房的。那这里边还有一个问题，正常来说税是按照收入来收，但是根据房地产这种预售的形式，国家是以预收账款来先收税的。由于它是根据没有交楼的预收的房款，预收账款这个会计科目来交的税，所以它交的税不反映在利润表的费用里，它是跑到资产负债表的左下角，有一个叫递延所得税资产里面。这个递延所得税资产的意思就是提前交的税，它迟早又以费用的形式跑到利润表里面的费用内，所以这个资产负债表和利润表之间的数字会经常转换的。


    有的时候我很少会跟别人谈论说你这个企业资产负债率怎么样啊，流动比率怎样，存货周转率怎么样，这些我不怎么看的。我大概就看几个重要的数据，我会看你的长期借款有多少，你的短期借款有多少，知道这些大概就知道你的银行融资情况怎么样，然后我就知道你这个企业的负担怎么样了，我可否再给你做增融。然后我找你这个企业的时候，我要看一下你的利润表，你的销售利润率怎么样，你的净利率怎么样，你的成本结构怎么样。资产负债表呢，我暂时先说到这里。


    我再说一下利润表，现在的会计准则，国家就要我们财务人员在做报表的时候，要争取做到不懂得财务的人、也能看懂报表，所以它这个名字起的都是通俗易懂的。比如说下面这些费用的核算，如财务费用，这个主要的就是一些利息，一些财务方面的财务成本就放在这里。下面我也不说太多这个利润表了。


    然后现金流量表，现金流量表刚才我也说了，它有三个板块组成，一个是经营活动产生的现金流量，一个是投资活动产生的现金流量，一个是筹资活动产生的现金流量。经营活动产生的现金流量是指企业的主营业务。其实这个报表是把利润表和资产负债表又重新翻译了一遍，以另外一种语言说出来。比如说利润表，你反映的收入有可能是应收账款，就比如说我卖的这个东西，但我是赊销卖出去的，我没收到钱。我没收到钱反映在资产负债表里就是应收账款，反映在利润表里就是收入。但是不代表说我这个企业还可以玩的转，我卖再多东西我收不到钱，其实这个企业还是有问题的。这个时候体现在现金流量表里就是销售商品、提供劳务收到现金，我收到的现金怎么样，所以我刚才就说了经营活动产生的现金流量，如果是正数，说明这个企业平稳正常的经营活动还是很健康的，还是正常的。


    然后呢，经营活动这里就反映了跟收入有关的一些税费、人工成本、税金这些支出。投资活动我刚才都说了，比如说你买固定资产，然后卖固定资产，你买了股票，卖股票都在这里。筹资活动就是融资，比如说我吸收外部的投资者，我吸收负债、借款，这都属于筹资。


    然后这个现金流量表最下面有一页补充资料，这个补充资料的净利润正好就是利润表的净利润，它就是一种间接的手段，把它间接调到经营活动部分产生的现金流量。为什么这么说呢，比如说这个月你的利润里面有很多是非付现的支出，比如说你有折旧，我以前买了个房子，我提了折旧。其实提折旧，它是以费用的形式来减少你的利润。实际上这个钱并不是之前都支出了，当期我并没有支出。比如说我现在编了现金流量表是九月份，实际上我九月份并没有这么多现金支出，它就通过调整利润表的形式，再把它调整成真正的现金流量。


    我看现在时间是十点二十二了，等于说我超了有大概半个小时的时间。今天我可能讲的不好好，我就是直接对着报表，没有做课件，我就跟大家聊。我喜欢跟我的老板，跟我打交道的客户，比如说银行，投资者这些，我喜欢教会计他们看懂报表，这样我就轻松了。基本上我的老板他们都能看懂财务报表，这是第一个。


    其实今天我跟大家讲的是非常浅显的东西，更深入的东西我觉得很难说在短短的几十分钟内跟大家说清楚。


    然后呢，平时在税法上我把那个税负也给它融到报表里面，基本上我的老板也都懂税。我也会经常把我工作中遇到的问题形成一个个案例，把这些所有的知识贯穿起来，把各种东西整合起来，形成案例，写成财务文章。包括我写税文章的目的追求的也是让所有人都看懂，包括非财务人员也要让他看懂，就像计算机一样所有人都会用。比如说你完工进度到了一定程度，三方经过确认以后，比如说监理啊，施工单位啊，甲方啊，已经确认好以后，他可能只付70%。这个时候财务人员入账的时候成本有可能只入70%，剩下的30%可能以预计的形式。预计也只是为了企业所得税核算的时候，但是实际上平时资产负债表你可能不包括这一部分，但是其实它对于企业来说是一种负债，所以这个时候就有必要在会计报表附注里披露这一项事项。我呢，也只是举了一个简单的例子，就告诉大家这个附注的作用。


    我今天要说的就是这么多吧，我也不再耽误大家时间了。如果说有哪些没有讲明白，大家事后可以问我。需要校正的或者以后需要补充的，下节课我们大家在一起探讨。今天我的课就到结束，谢谢大家！


    ## 怎样成为好父母——三个教育心法和五个教育招法


    分享者：老虎，加盐星友会会员。吉林大学硕士，国家二级心理咨询师、高级家庭教育指导师、高级生涯规划师。曾先后在报纸、网络任高管十五年，创业做新媒体营销公司五年。出版三本著作。因感于教育是立国之本，故投身教育。经管国学学校十年，现为长春某国学学校校长，有3000例孩子心理梳理经验，在教育生涯规划、亲子沟通、孩子学习动力激发、学习习惯改变有丰富经验。


    分享时间：2020 年 8 月


    加盐星友会的各位朋友们，大家晚上好。感谢何老师提供这次机会，让我们有时间能够交流家庭教育的某些话题。


    其实，我们每个人生下来都没有怎么学习去做父母。但是，我们每个人内心都希望自己能够成为最智慧、最优秀的父母，这个中间的过程就需要我们不断的学习。


    我本人在何老师的群里收益颇多，希望我今天的分享对我们加盐星友会的朋友们也能够有所帮组。分享大约一个小时左右。


    马上要过节了，我相信很多群友都在筹划旅游，大家都在规划自己的路线。如果有一个人跟你说，他想去看天安门。但是，他买了去哈尔滨的火车票，那么你肯定会阻止他，并且跟他争论，告诉他，北京不是在哈尔滨方向。但这个人他并不知道，所以他固执己见，这个时候你就会觉得他非常不可理喻。


    其实，我们在教育的过程中，经常会发生这样的事情。我们有的家长在选择教育目标，或者说选择旅游目的地的时候，除了会选错，有的甚至连还并不知道，到达这个目的地有哪些交通工具，可供选择。


    比如说，一个古代人穿越到了现代，你跟他讲，去北京可以坐飞机，一小时就可以有几千公里的速度。他可能觉得你在骗他。因为在他的世界里，除了步行、牛车，并没有汽车、高铁、飞机这样的工具。在他的认知结构里没有这样的工具，那么，他在做选择的时候，就一定是在有限范围内，做的有限的选择。


    人活在天地间，都是以有限的资源来体会无限的辽阔。但随着社会的进步，我们的认知窗口越来越大，我们的心智可以照亮的范围也越来越大。遗憾的是，即使在物质极度繁荣的当下，我们在教育方面的智慧却非常有限。我们在教育认知能力上的匮乏，导致我们在选择目的地的时候会出现偏差，导致我们在选择达成教育结果的方式上，会陷入有既选择这样的怪圈。


    这里给大家星友们提个问题，如何用一句话来描述教育，或者说“教育功能”到底是什么？大家可以思考一下。如果有星友愿意用文字来回复，大家也可以回复。到课程快要结束的时候，我来给大家提供一下我的答案。


    前两天我在一个面馆里碰到一家三口，一个四岁左右的小女孩跟爸爸妈妈在一起吃饭。这个小女孩长得非常漂亮，聪明伶俐，而且我发现她还很独立。她跟她妈妈讲，她说：“妈妈我求求你了，能不能不让我上学。”她妈妈说不行，然后，小女孩就拒绝吃饭。她妈妈就跟她说：“你不吃没事啊，反正饿一顿也没饿死。”她爸爸盘出去揽车，过了一会儿，回来之后就给孩子夹肉。他说：“你得多吃肉，少吃点面条，多吃肉才能长身体。你每天保证吃一块肉，那么你的营养才不会缺乏。”


    这样的日常场景，在我们的生活中可能司空见惯。但对一个教育工作者来说，看到这样的场景，心里的感受是非常复杂的。


    这一家三口应该说是很和睦的，能够一起共进晚餐，大家互相陪伴。但是，这样的父母他们可能没有学过，如何去做智慧的父母？如何更有效地去做好教育？因此，在他们教育的过程中，就已经蕴含着非常多的错误，而这些错误会给孩子在成长的道路上埋下非常多的隐患。


    各位星友也可以想一下，这两位家长到底有哪些错误？


    比如说这个妈妈，她不娇惯孩子这是好的，不让孩子养成讲条件的习惯。但是，这个妈妈却用了一种控制的方法，这样的方法会让孩子的内心充满压力。她会觉得妈妈不在意自己，会导致她心理营养的匮乏。继而，会让这个孩子学会妈妈这样的处理方式。未来呢，她在面对一些人和事物的时候，也会不自觉的采用这样的方式。


    这位爸爸应该说是毫无伤害之心，但是呢，他用自己的认知能力，用自己认知的局限限制了孩子的养分。他认为吃肉有好处，每天吃一块肉就能保证营养，所以...


    养。所以必然的结果就是给孩子夹肉，而让孩子去少吃面条。


    大家想一下，有多少父母是用自己这样的认知、信念、满腔热情的爱来照顾、引导、教育我们的孩子？


    因为我们并不知道我们要去北京，我们并不知道北京朝向哪个方向，所以，我们买了去哈尔滨的车票，结果呢？我们努力越多，离目标越远。


    如果这个家长他会采用更多，更好的交通工具，或者说他这个外在条件更好一些，那么，他有可能买的是机票，他离正确的速度可能就会更快。


    如果大家按照这样的方式，来看待我们周边出现的一些教育上的悲剧，可能会找到更多的答案。


    九月十七号，有一则新闻在网络上传播的非常火爆，舆论一边倒的指责这个妈妈。


    这件事发生在武汉，一个中学生因为在现级里打扑克，被老师发现叫来了家长。妈妈来了之后，在走廊里给了这个孩子一记耳光，这个孩子马上就跳楼了。大家都觉得这个妈妈的教育方式不得当，很多人都指责这个妈妈。这个妈妈的教育肯定是不得当的，但是这个妈妈为什么会情绪失控？我肯定前面还有非常多的剧情。而这个孩子因为妈妈恐吓了他，他就选择了轻生也是非常让人无语的。


    自媒体人迭叠把这件事进行了相关的分析。我看到一些留言说，上周我儿子的班级也有一个人跳楼了，我们的小区上周也有一个人跳楼了，好像跳楼已经成为了司空见惯的情形。我上网搜索了一下发现，这样的悲剧确实已经在成批出现。比如说，四月十二号陕西商洛的初三女生在学校跳楼身亡、四月十三号无锡的十二岁女孩在家跳楼、五月九号沧州的初三女孩在家自杀、五月十二号山东临沂的一个学生自杀……


    我们不禁要想，国家物质条件已经越来越丰富了，家家给予孩子更多、更好的物质条件。甚至在教育上，家庭也做了大量的投入，那为什么会出现这么多的悲剧呢？对于一名教育工作者来说，我看到这样的悲剧，只是掀开了悲剧大幕的一角。接下来类似的事件会更加层出不穷，原因就是我们在教育的底层逻辑上，在家庭教育的方式方法上，不自觉间已经为孩子的成长埋下了巨大的隐患。这样的隐患就像我们并没有发现炸药的引信一样，它遇到了相应的火星，就一定会发生灾害性的引爆。


    可能有小伙伴还不太理解。现在我们在教育上成批出现的问题，其实就像庄稼一样。前一段时间因为台风，我所在的东北遭了灾，台风过处玉米大量倒伏。其实，我们的孩子就像庄稼一样，因为根基扎得不牢，出现这样的了大风天、灾难天，就出现了倒伏。也可以说，是因为我们教育上出现了这样系统性的、系列性的问题，导致了孩子心地的污染，导致了我们人才的绝收。这其实是时代的地震，是一个民族的山洪，是中国这个家庭里边最大的隐患，也是中国未来实现强国梦，实现中华民族伟大复兴，中国的伟大跨越的一个巨大的障碍。


    我在多年的教育过程中总结出来一套教育模型，叫教育核爆思维。我用数字来代替551105533311系统。拿着这个系统，就像拿了一面镜子一样，用这面镜子一照，就会发现我们类似的问题一定层出不穷。


    我简单给大家讲一下。第一个5就是影响我们教育结果呈现的五种因素。从最远往最近的方向依次是：一、人力并不能够理解的因素。二、遗传的因素。三、社会因素。四、家庭氛围的因素。五、家庭教育手法因素。


    什么叫非人力能够理解的因素呢？比如说，去年有一个电视新闻，重庆有一个男孩子跳楼，不幸的是，两个从下面走过的女孩，因为他的跳楼也丧生了。这两个女孩是从外地到重庆参加绘画考试的，并且这两个女孩都是品学兼优的好孩子，却发生了这样的意外，你说到底是什么原因？我们只能说它是人类目前所不能够了解的因素。


    社会因素大家都知道，我们现在一切向钱看。在童年成长关键期，我们把孩子托给了老人。所以，电视上会上演《爸爸去哪儿了》。现在所有的人都在追求成功，所谓的成功更多的就是跟金钱挂钩，我们的这个成功标准非常单一。学习上因为不断的填鸭，孩子高考完了之后就是撕书、烧书。上了大学之后就胜利大逃亡。我们的大学也在普遍的扩招，但是这个可用的人却非常有限。没有一些能够独挡一面，有创造性的人才。所以，社会因素对教育结果呈现的影响非常大。


    家庭因素呢，大家也能看到，因为我们工作繁忙、因为离婚率跟结婚率现在已经几乎持平了。八零后、九零后的人都是独生子女出身，普遍已然做了家长。所以，很多的家庭因素纠结到一起，家庭氛围并不和谐。


    家庭教育手法因素上存在的问题更多。单从说话角度就有六种不恰当的说话方式。我相信群里的小伙伴们，自觉不自觉的都犯过类似的错误。比如何我们会说：哎，你看看你班谁谁谁，他考试为什么又进步了？或者说，你看人家怎么那么勇敢？这是孩子非常讨厌的一种类型，叫比较型。


    我告诉你是啥就是啥，你别跟我争论了、你给我听好了、我说不行就不行、这个东西就不可以买、你赶紧写作业去、现在就得去。同样类似的对话，我相信在中国大地上就像幽灵一样不断地在徘徊，这种类型叫控制型。


    当你在做一件什么事儿的时候，孩子突然放下作业过来帮你忙，你可能就会说，哎，你别给我添乱。这个就否定了孩子的能力。或者说孩子突然遇到了一只小虫子，他害怕地叫起来。你就会说，这有什么可怕的，你怎么那么胆小？这就否定了孩子的感受。这种类型叫否定型。


    当父母的承受能力达到了一定的极限，经常说你怎么连这个都不会，你可真够笨的了。我们回想一下，那个挥手打自己孩子的妈妈，很可能已经绝望到了这样的境地。因为孩子的这种导火索，让她没办法控制自己的情绪。最后，导致了孩子跳楼，家庭失去子女这样的悲剧发生。这种类型叫数落型。


    家庭里夫妻关系不太和谐，尤其是单亲家庭那就是更普遍了，经常会有这样说法。如果不是因为你，我早就跟你爸妈离婚了，不用在这个家里边忍者了。如果不是你，我就不用这么辛苦地去挣钱，这种类型叫抱怨型。


    还有一种类型，只要用心看，你也经常会看到它的出现。我让你赶紧去做这件事儿，我数到三，你再这样妈妈就生气了。那这种类型叫威胁型。


    从影响教育呈现结果的这五个因素来看，我们起码有两个半因素都存在着巨大的问题。半个是社会因素，一个是家庭氛围的因素，一个是家庭教育方式手法的因素。


    我们明明想把孩子教育好，明明希望孩子品学兼优。但是，我们只关注孩子的学习，只关注了他的学而没有关注他的品德。比如说，我们都希望孩子成为一个有价值感的孩子，可我们一再伤害他的安全感，一再破坏他的归属感。他本来自信心营养就不够，比如说，心理营养只有一桶水这么多。但你在他前进步的路上挖好了多坑，他要把这些坑用水填满，才能游过去。等他已经游

    '
  merge: 0
- raw:
  - '[PAGE 68]


    过了几个坑，再想要开出自己的花的时候已经没有水了， 不能够帮助他渡坑了。所以说，我们只是打量这两个半因素就会发现，类似的，我给大家罗列的悲剧会不断的发生。


    如果我们的孩子在三岁以下，六岁以下或者十三岁以下，今天能够听到老虎校长给大家的分享，那么你的孩子还有救。


    我们都不希望自己的孩子输在起跑线上，但我们却经常忘了朝哪个方向跑。我们说家长是孩子的起跑线。为什么说家长是孩子的起跑线呢？因为家长帮孩子做方向性的选择，家长的认知结构，家长的认知能力会局限我们教育的选择。


    在我们看来，一个生命的成长需要有五种教育，就是我们的 551105533311 系统的第二个 5。这五种教育从近处向远处依次是家庭教育、社会教育、学校教育、自我教育和道德教育。其实，我们教育的最核心目的，是让这个孩子能够自我教育，自食其力，是让这个孩子能够自我负责，是让这个孩子未来能够进德修业。


    但我们看看，现在的家庭教育，它存在着巨大的隐患。它的隐患有这么几个：第一个就是在孩子零岁到六岁这样的教育关键时期，基本上都交给了老人。孩子在这个阶段需要心理营养，而我们的父母却经常因为忙碌不在孩子身边。我们从西方心理学和大脑的解剖学来看，人的大脑细胞是需要信息刺激的，它有一个发育的关键期。左右半脑的脑细胞，它通过信息刺激会不断地萌发。萌发就像小芽儿一样，这个芽儿就会长成树枝，树枝跟树枝连接到一起就会形成神经网络，这个连接就叫树突。我们只有通过信息刺激，这个树突才能够不断的发育。三到六个月的时候，树突的数量会不断的激增，最后能够达到一千亿的数量。六个月以后，脑细胞就开始停止数量的增长，更多的是它本身宽度的增加。


    在早期的教育中，人的大脑发育有这么几个规律：第一个叫海绵式吸收。第二个叫用进废退。第三个叫印刻印象，也叫先入为主。用进废退就是我们的神经细胞如果得不到有效的信息刺激，它自己就会消化、吸收，最后就不再萌发了。相当于我们的这个小苗儿得不到营养，萎缩了。这个最极端的例子其实就是狼孩。印度有一个传教士，在一次传教过程中，在野外发现了两个狼孩。'
  - '[PAGE 69]


    他把这两个狼孩，一个十一岁、一个七岁送到幼儿园里。这个十一岁的孩子经过四年才学会单音节，才学会说像“妈”“吃”这样的单音节。那是因为，她错过了大脑神经结构的关键期，语言学习的关键期。


    从大脑神经的发育来看，零岁到三岁，大脑发育百分之六十；三岁到六岁，发育百分之二十；六岁到十三岁，发育百分之十；十三岁之后又发育了百分之十。现在的更多家长，习惯于在孩子上幼儿园或者学前班的时候，开始在意孩子的教育，而忽略了早期的胎早教。所以，这就相当于投入了百分之百的资源，获得的满分却只有二十分。六岁到死，大脑发育只能有百分之二十。


    这是我们大部分的家庭都发生过的悲剧。因为父母没有这样的认知，所以根本没有这样的选择。相应就会带来这样的恶果。相当于我们盖了一栋高楼大厦，但大厦的地基没有打稳。我们的孩子心性没有养成，根基没有夯实，遇到一些批评，遇到一些学习困难，遇到一些诱惑，他就很难抵御住。我们的家庭教育在起步的时候就隐藏着非常大的隐患，社会教育和学校教育我就不想说了，我们的自我教育是普遍缺乏的，但我们都希望培养出自立自强的孩子。我经常跟家长讲，我希望孩子自立自强，但在之前有个前提叫“自我”。只有有“自我”的人，他才能够真正的自强和自立。


    在 55110553311 系统里边的第一个 1 涉及到今天要给大家分享的第一个教育的 Patriarch 心法。


    一个生命的成长，我们怎么来看待它，就决定我们用什么样的方法来对待它。很多家长是把孩子当成一个小皇帝，一家六口人都在围绕着这个孩子，宠他，给他最好的条件。那得到的结果竟然是孩子把家长当成太监，骑在他们的头上作威作福。等孩子进到学校的时候，他就要服从规矩。这个时候他发现，在家我可以为所欲为，为什么在学校里需要我服从这样那样的规矩？他就完全不适应。


    今天早晨，我跟一个中学的校长交流。这个中学的校长跟我讲，有个孩子上课不好好听讲，在那里摆弄东西，老师让他认真听讲，结果呢，他还打响指，老师把他的手给按了下去。这个孩子回到家跟父母讲，老师打了他五拳。最后，父母不分青红皂白就把这件事情告到了教委。后来，这个校长经过跟家长长时间的沟通。在协商的过程中，这个家长提出了众多的要求，要求老师'
  - '[PAGE 70]


    赔礼道歉，要把这个老师整下岗，要求赔偿等等。


    大家想一下，这样的孩子之所以有这样的行为，就是因为他是被宠出来的小皇帝。到了学校里边，家长还要动用自己的力量来给孩子营造皇帝的氛围。大家可以想象，这个孩子如果不改变，未来会受到多大的挫折。


    还有一类家长把孩子当成一张白纸，觉得这张白纸可以画最最最美的图画，随着自己的想法画。有的觉得这个小孩长得像小女孩，而自己又喜欢小女孩，就索性给这个男孩穿上了小裙子。殊不知，这样的方式可能会让孩子性别错乱，未来可能有一天给你来个同性恋看看。有的家长发现孩子肚子特别小，觉得这个孩子不应该胆小，然后就让孩子晚上出去或者去看鬼片儿，要练他的胆大。结果发现，这个孩子胆儿越来越小，那是因为这个家长根本不知道，孩子大体从心理的角度可以分为五种气质类型。这五种气质类型是天生的气质类型，你要用不同的方法来对待它。否则，就相当于给羊吃肉，相对于喂狼吃草。你费了非常多的心力，却并不能得到有效的结果。


    这五种气质类型分别是乐天型、冷静型、忧郁型、激进型和牵敏型。忧郁型的孩子特别渴望自由，不希望别人管，他们最极致的目的就是为了懂得真、善、美。


    我们说说乐天型的孩子。可能有一类孩子他这个人际关系特别好，你跟他说什么他都答应你，但是转身就给忘了。他们对金钱、对游戏的控制力特别差。这样的孩子往往都是乐天型的孩子，你要求他做一件什么事，他未必能够去做。但是如果你懂他的气质类型，你跟他搞好关系，他可能会乖乖去做。因为他们不会为对错去努力，只会为好的-color人际关系去努力，这是他的气质类型决定的。


    还有一类孩子他动作特别慢，无论做什么事情都让家长很着急，然后总要催促他。结果发现，越催促这个孩子，孩子就越慢。这样的孩子往往不是因为他的动作慢，而是因为面对一件事情的时候，他要充分思考，思考完之后他觉得有安全感了，他才会去行动。这样的孩子往往是冷静型的孩子。冷静型的孩子你要尊重他的节奏，另外，你要在意他的自尊，不能拿他的慢来说事，更不能通过这件事来贬损他。否则，你们的亲子关系会破坏，这个孩子的心理也会造成巨大的压力。'
  - '[PAGE 71]


    激进型的人就很好理解了，希特勒就是典型的激进型。这样的人为了自己的目标不择手段，就像打不死的小强一样精力无限，失败了一次还会重新来过。


    而奉献型呢，我们的星友可以回家看看自己的妻子是不是这种类型。这种类型的人任劳任怨，会干很多的事，但是却愿意抱怨。如果你不能及时的评点她所做的事，不能及时的认可她。那她的心理就得不到满足，就会升起怨恨性的东西，这样类型的人就是我们所说的奉献型的人。这样的人做一件事情你不能说，谢谢你，你这件事情做得好，这样的话语往往并不能让她满足。比如说她帮你擦了一双鞋，你跟她说，老婆谢谢你，你不给我擦这双鞋，我今天上就晚了。或者是你晚上下班回来之后说，哎呀，今天穿这个出去，我特别有面子，大家都说我今天的着装特别好，尤其是我的鞋擦得倍儿亮。那么她听完这句话心里就得到了满足，接下来就会拼死拼活的帮你做更多的事。如果不知道她的这种气质类型，只是很随意的说，谢谢你。那么长此以往，她就会怨恨你，甚至憎恨你。


    我们的家长没多少人知道，孩子是分这样的气质类型的，是要用不同的手段来对待的。如果不懂的话，那就会在我们打着爱的旗号，全力以赴的过程中，埋下巨大的隐患。


    我们有的家长还会把孩子当成一个盆景，给照顾的特别好，雕琢的也很好，看起来这个行为习惯也很好，但是呢，因为它的根扎在土盆儿里，它的格局不大，所以未来就会有三年级现象、五年级现象、初中一年级现象、初中三年级现象。原来学习很好，很听话的孩子考了一个不错的学校，并且进入了实验快班。结果呢，成绩一落千丈，最后甚至厌学。


    这些对我们孩子的认识都是错误的。孩子是一颗带着天然使命的种子。每个孩子都是不同的种子，你不能要求所有孩子都有毛竹这样的生长速度。如果我们的孩子是橡树，你想让他像毛竹一样，早早就表现出耿聪慧，那是不可能的，就像你不能要求夜来香的种子散发出荷花的清香。


    当意识到孩子是一颗种子的时侯，就改变了教育最主要的认知。我们会觉得教育不是以家长为主，教育应该是以孩子为主，教育是以孩子为主体。这就涉及到我们心法的第一个，叫：事无好坏，诠释在人。'
  - '[PAGE 72]


    因为生命的成长是孩子本身的事，他带着他天生的天赋和使命，他有自己热爱的领域。我们家长在这个过程中只能引导，只能是一个助推者，而不是一个操控者，甚至更不是一个全局的把握者。


    有了这个想法之后，再面对孩子的时候，我们就不是按照自己的规划蓝图来设计孩子的走向。我们就不会因为孩子没有按照我们的规划走而感到焦虑，我们就不会觉得我们的孩子怎么不如隔壁家的小明呢？我们就不会否定、数落、抱怨、威胁我们的孩子。我们就会发现我们孩子身上也有非常多的优点。我们就会了解一个生命的成长，有他自己的道路，有他萌发的节奏。


    在教育孩子过程中，我们作为一个引导者，要有一个全局性的了解。这就涉及到我开始给大家讲的教育的目的。


    教育到底是什么？教育的目的是为了开发人性。我把教育比喻成是一个生命的重新疆活操作系统。老天让人生在天地间，有了身体，有了生命，同时还要有他的慧命。那么这个慧命如何来启动？就像我们计算机有了硬件之后还有内驱，还有软件。其实呢，教育就是内驱，能够驱动我们的软件，能够重构我们的生命，让我们的生命能够去发现自己的使命，践行自己的使命，能够去达成自己，利益他人。所以，教育可以总结成四个字：长善救失。你要去长养善的东西，你要去救助生命中容易走偏的地方。就像小树长了枝桠之后，我们要及时的去把它修剪掉。


    在这个过程中，我们要引导孩子，是因为现在跟孩子在一起的时间很少，我们的孩子已经没有了我们过去成长的自然环境、社会环境。我们的社会价值观已经发生了非常多的变化。所以，我们更多的是靠语言跟孩子进行相关的交流。因此，我们就要求用好语言这种工具。这里边就涉及到我们所说的第二个心法叫：表扬，是为了未来不依赖表扬。


    现在有很多教育方面的书籍告诉我们，好孩子都是夸出来的你要求怎么善于表扬孩子。所以，当孩子做点儿什么事情的时候，我们家长都会说：“啊，你真棒，孩子你太厉害了”。结果，我们的孩子上了学之后，老师不表扬他，他就很生气。当别人夺去了他的光芒，他就要配毒药把别人毒死。


    想做到“表扬是为了不表扬”，就需要说话有技巧。这个涉及到我给大家分享的五个招法。'
  - '[PAGE 73]


    招法一：让孩子先做好，我们再长善。


    一个好的家长，智慧的家长善于看到孩子身上的闪光点。也有很多家长说：“我怎么觉得我们家孩子没有什么优点吗？”我们经常会跟家长说，你要像在鸡蛋白里挑骨头一样去找他的优点。如果没有优点，那么还有一种方法可以让他展现优点。比如说，你让他帮你拿一双鞋，他拿来之后你就跟他讲“孩子呀，你真贴心。你看，妈妈让你拿双鞋，你拿无怨言的就拿来了。而且，拿鞋的过程中你很小心细致，另外，你把鞋拿到妈妈身边的时候你摆的这么正，证明你做事特别有规律。”长善，先让他做好，然后再长善。甚至等家人回来的时候，你就跟家人大张旗鼓的讲，今天我让孩子给我拿鞋，孩子拿鞋的这个过程中板板正正摆到我面前，这叫当众长善。


    通过这样的方法就会激发出孩子身上更多这样的优点。我们知道，植物生长的过程中，有一个规律叫顶端优势。世曝阳光越多的地方，它长得就越多。从心理学角度有一个概念叫聚焦优势。你在哪个地方聚焦，它就会呈现哪一个。而我们现在的家长说的基本都是否定的东西，你怎么不行，你怎么不听话。所以，我们的孩子呈现给你双倍的否定。


    招法二：表扬孩子，用“你就是”。


    第二个招法就是使用表扬的通用句式。表扬的时候，我们说：“你真棒，你太厉害了。”这样的话其实是不对的。为什么不对呢？是因为你在这么表扬的时候，就意味着他此前不棒，此前不优秀。你是用上帝视角来表扬他，他只能匍匐在你面前。我们的第二心法是：表扬，是为了未来不依赖表扬。所以，我们在表扬的时候可以换一种句式，叫“你就是”。比如说，他战胜了自己的恐惧。你就说，你就是一个勇敢的孩子，这么难的事，妈妈都不敢面对，你却勇于面对；你就是一个细心的孩子，妈妈都没有注意到事情，你替妈妈看着了，有效的提醒了妈妈；你就是一个善解人意的孩子、你就是一个智慧无穷的孩子，你就是一个眼光长远的孩子；你就是一个干净整洁的孩子…用“你就是”来替换“你真棒”，“你很厉害”，是因为我们把对事的关注变成了对人的关注。


    我们现在的家长更多的是对事儿的关注。比如说，孩子考了多少分？孩子在学校里乖不乖？其实，你根本就没有关注到孩子本身，孩子就会觉得我妈妈'
  - '[PAGE 74]


    关注的只是分数，根本不关心我这个人，那么他内心的营养就匮乏。我们说一个生命的成长，它包括生理的成长，心理的成长和性理的成长。生理的成长我们大家都知道，就是身体层面上要健康。心理方面的成长，它需要有安全感、归属感、价值感，需要有爱的滋养。但我们的孩子总被否定，总被物化。所以，普遍心理营养匮乏。性理方面，就是说这个孩子知道为什么而活，知道人可以达到什么样的高度，这是对孩子慧命、智慧的引领。这就涉及到我今天要跟大家分享的第三个心法：教育孩子有三种层次。


    最低层次是经营孩子知识的层次。再往上一个层次是经营孩子习惯的层次。很多家长帮助孩子养成许多习惯，这些习惯很好，但这些习惯都是外部控制的，都不是孩子发自内心的。经营孩子最高的层次叫经营感受。你会发现有许多事情，你也跟孩子说了很多遍，他都不愿意去做。但你给他手机，他刷起抖音就没完。为什么会这样呢？因为，孩子不会因为你说的对错而去做一件事情，他只会因为自己感觉好而去做一件事情。大家注意这句话吗，他只会因为感觉好而去做一件事情。家长想让孩子朝哪些方面发展，我们就要让孩子在这个方面能够感觉好。那他自然就会往那个方面去发展。那些学霸之所以愿意学习，是因为学习能够给他们带来荣耀，能够给他们带来快乐，能够让他们感觉好。要想让孩子感觉好，就涉及到我们五个招法里的另外三个招法。


    招法三：把“你句式”替换成“我句式”。


    比如说婆媳之间，老人给孩子吃糖，妈妈看到了之后就会说：“啊，妈，你怎么又给孩子吃糖呢？那牙不坏了吗？你怎么总是这样啊？”老人一听就很生气：“我也是为孩子好，还不是为了让他长身体吗？”然后，两个人就争执起来了。老人就说：“我帮你做饭、收拾卫生，我帮你干这么多活儿，我没有功劳还有苦劳呢。”这个就是你句式，你怎么怎么样，其实，那是指向别人，这是在指责别人。换成“我句式”的说法就是：“妈，我知道你给孩子糖，是为了让孩子多吸收一些营养，但吃糖对他牙齿不好，我是担心他未来牙齿不好之后，对他的身体持续健康有影响。我相信，妈你也不想让这个孩子有一口坏牙。”这么一说，我相信老人一定能够听得进去。又比如说，孩子写作业，写一下，在那玩一会儿，摆弄摆弄手指。一般的父母就会说，你怎么又不专心？你怎么总是三心二意的？其实，换成我句式就是：“我小的时候呢，做一件什么事儿也很难'
  - '[PAGE 75]


    的，需要坚持很长时间。但是呢，我希望你能够快速的写完。完毕，我们有时时间可以一起做个游戏吗。”这样的话，孩子听起来感觉也会好很多。


    # 招法四：经常对孩子表达崇拜，这个太**了，你是怎么做到的呀！


    这个招法对男人和女人，对老公、对妻子都有强大的杀伤力，大家可以用一下。比如说，孩子帮你拎一个东西，可以这样表达：“哎呀，这个东西这么沉，你都能够轻巧地把它拿上来，你是怎么做到的呀？”眼睛盯着他，表达出来崇拜的目光，配上这样的语言，孩子自然就会信心满满。比如说，你不在家的时候，你老公帮你做了家务，你直接说老公做家务这件事情，会让男人特别没有面子。换种说法就不一样了：“老公，你把家收拾的这么干净，你是怎么做到的呀？”你放心，如果再有时间的话，你老公还会帮你收拾家务。


    # 招法五：在家里读点有营养的。


    家长是孩子的起跑线，家庭是孩子的首任学校。那么，家庭的氛围对孩子的教育成长至关重要。中国过去是有家庭传承的，过很重要。中国过去是有家庭传承的，过去中国的教育叫三堂教育，有学堂、有中堂、有祠堂。古人有自己的家风传承，但今天我们受市场经济的影响，受了西方教育流派的影响，我们都已经把我们优秀的中华民族的教育传统遗失了。


    曾经有一位老师，他是做演讲的，是一位德高望重的老师。他曾经就讲到，他们在家里的时侯，他跟他的爱人就会经常谈论时尚报上的一些好的产品，又出现的创新品牌。结果，他的女儿就从事了这样的行业，并且，有着非常高的艺术鉴赏品味。


    我还有一个朋友是做教育的，她不仅获得了黑龙江省三八红旗手的称号，做的创新教育也受到过中央电视台的报道。她曾经就讲到，她是一个军人家庭出身，父母在她小的时候，家里就定参考消息。她从小的时候就看《参考消息》，长大了之后也在坚持看这个。对家庭来说，这就是有营养的东西。大家想一下，看《参考消息》长大的孩子，她的眼界，格局会是什么样的？


    中国的胎早教也有一个最好的方式，就是我们可以在网上买一个读经机，或者自己拷贝一本经典在家里播放。尤其是孩子零岁到三岁的时候，他的大脑是海绵式吸收。然后，用进废退，大脑的规律是印刻印象。印刻印象就是，他最早接触了什么，他就会对什么感兴趣。这个时候在家里面不断地播放，就会让'
  - '[PAGE 76]


    我们的孩子得到了熏修。相当于我们把音乐厅放到了家里，把博物馆放到了家里，相当于请了多国的外教来教孩子的外语，相当于让孩子与我们的古圣先贤往来与对话，自然就会扩展他们的心胸和人生的格局。


    教育的话题是一个非常广大的话题。刚才给大家简单分享了我一个教育模型叫 551105533311 系统。第一个五是影响教育结果的五种因素。从远往近分别是，人力所不能理解的因素、遗传的因素、社会因素、家庭氛围的因素、家庭教育手法因素。一个教育工作者只能解决两个半因素，分别是教会家长好的教育手法，让家庭形成好的氛围，进而通过家庭带动社区，带动社会风气的改善。


    为了让大家有更好的教育手法，我跟大家分享了教育的三个心法和五个招法。第二個五是五种教育。从近往远分别是家庭教育、社会教育、学校教育、自我教育和道徳教育。我们家庭教育的目的是为了让这个孩子自理、自立，有自我。为了让他开启自我，进而去进行自己的道德教育。我们的第一个1就是要把孩子看成一颗种子。它带有自己天然的使命，有自己萌发的周期。所以家长需要多引导、多陪伴，但是不操控，不焦虑。中间的10就是告诉大家，我们作为一个生命，它有现实性，也有超越性。人可以不断地去进步，也可以被物质不断地吸引、堕落。我们的生命就应该像一个十字打开一样，既有生命成长的全程性，要做好相关的规划。生命成长又有全幅性。就像《论语》说的那样，我们要志于道，据于德，依于仁，游于艺。而不仅仅限于物欲的层面，让我们离道德越来越远。


    教育是“就人性开发人性”的一个伟大工程。教育是为我们的生命重新驱动系统的一个专业性极强的技术工作。教育一定要有方向，想去北京看天安门，就一定不能买去哈尔滨的票。教育需要有很好的知识系统支撑。你要知道，要想达到更高的效率，更快的速度，除了步行、牛车、还有汽车、飞机。你要懂得为你的孩子插上能够腾飞的翅膀。


    在此，衷心的预祝我们的星友们，都能够做好教育，掌握好孩子教育的成长关键期。零岁到三岁大脑发育百分之六十，三岁到六岁发育百分之二十，六岁到十三岁发育百分之十，十三岁直至去世又发育百分之十。如果你孩子还在成长的关键期，就一定要抓住机会。如果你孩子已经超过了关键期，也不'
  md: '

    过了几个坑，再想要开出自己的花的时候已经没有水了， 不能够帮助他渡坑了。所以说，我们只是打量这两个半因素就会发现，类似的，我给大家罗列的悲剧会不断的发生。


    如果我们的孩子在三岁以下，六岁以下或者十三岁以下，今天能够听到老虎校长给大家的分享，那么你的孩子还有救。


    我们都不希望自己的孩子输在起跑线上，但我们却经常忘了朝哪个方向跑。我们说家长是孩子的起跑线。为什么说家长是孩子的起跑线呢？因为家长帮孩子做方向性的选择，家长的认知结构，家长的认知能力会局限我们教育的选择。


    在我们看来，一个生命的成长需要有五种教育，就是我们的 551105533311 系统的第二个 5。这五种教育从近处向远处依次是家庭教育、社会教育、学校教育、自我教育和道德教育。其实，我们教育的最核心目的，是让这个孩子能够自我教育，自食其力，是让这个孩子能够自我负责，是让这个孩子未来能够进德修业。


    但我们看看，现在的家庭教育，它存在着巨大的隐患。它的隐患有这么几个：第一个就是在孩子零岁到六岁这样的教育关键时期，基本上都交给了老人。孩子在这个阶段需要心理营养，而我们的父母却经常因为忙碌不在孩子身边。我们从西方心理学和大脑的解剖学来看，人的大脑细胞是需要信息刺激的，它有一个发育的关键期。左右半脑的脑细胞，它通过信息刺激会不断地萌发。萌发就像小芽儿一样，这个芽儿就会长成树枝，树枝跟树枝连接到一起就会形成神经网络，这个连接就叫树突。我们只有通过信息刺激，这个树突才能够不断的发育。三到六个月的时候，树突的数量会不断的激增，最后能够达到一千亿的数量。六个月以后，脑细胞就开始停止数量的增长，更多的是它本身宽度的增加。


    在早期的教育中，人的大脑发育有这么几个规律：第一个叫海绵式吸收。第二个叫用进废退。第三个叫印刻印象，也叫先入为主。用进废退就是我们的神经细胞如果得不到有效的信息刺激，它自己就会消化、吸收，最后就不再萌发了。相当于我们的这个小苗儿得不到营养，萎缩了。这个最极端的例子其实就是狼孩。印度有一个传教士，在一次传教过程中，在野外发现了两个狼孩。


    他把这两个狼孩，一个十一岁、一个七岁送到幼儿园里。这个十一岁的孩子经过四年才学会单音节，才学会说像“妈”“吃”这样的单音节。那是因为，她错过了大脑神经结构的关键期，语言学习的关键期。


    从大脑神经的发育来看，零岁到三岁，大脑发育百分之六十；三岁到六岁，发育百分之二十；六岁到十三岁，发育百分之十；十三岁之后又发育了百分之十。现在的更多家长，习惯于在孩子上幼儿园或者学前班的时候，开始在意孩子的教育，而忽略了早期的胎早教。所以，这就相当于投入了百分之百的资源，获得的满分却只有二十分。六岁到死，大脑发育只能有百分之二十。


    这是我们大部分的家庭都发生过的悲剧。因为父母没有这样的认知，所以根本没有这样的选择。相应就会带来这样的恶果。相当于我们盖了一栋高楼大厦，但大厦的地基没有打稳。我们的孩子心性没有养成，根基没有夯实，遇到一些批评，遇到一些学习困难，遇到一些诱惑，他就很难抵御住。我们的家庭教育在起步的时候就隐藏着非常大的隐患，社会教育和学校教育我就不想说了，我们的自我教育是普遍缺乏的，但我们都希望培养出自立自强的孩子。我经常跟家长讲，我希望孩子自立自强，但在之前有个前提叫“自我”。只有有“自我”的人，他才能够真正的自强和自立。


    在 55110553311 系统里边的第一个 1 涉及到今天要给大家分享的第一个教育的 Patriarch 心法。


    一个生命的成长，我们怎么来看待它，就决定我们用什么样的方法来对待它。很多家长是把孩子当成一个小皇帝，一家六口人都在围绕着这个孩子，宠他，给他最好的条件。那得到的结果竟然是孩子把家长当成太监，骑在他们的头上作威作福。等孩子进到学校的时候，他就要服从规矩。这个时候他发现，在家我可以为所欲为，为什么在学校里需要我服从这样那样的规矩？他就完全不适应。


    今天早晨，我跟一个中学的校长交流。这个中学的校长跟我讲，有个孩子上课不好好听讲，在那里摆弄东西，老师让他认真听讲，结果呢，他还打响指，老师把他的手给按了下去。这个孩子回到家跟父母讲，老师打了他五拳。最后，父母不分青红皂白就把这件事情告到了教委。后来，这个校长经过跟家长长时间的沟通。在协商的过程中，这个家长提出了众多的要求，要求老师


    赔礼道歉，要把这个老师整下岗，要求赔偿等等。


    大家想一下，这样的孩子之所以有这样的行为，就是因为他是被宠出来的小皇帝。到了学校里边，家长还要动用自己的力量来给孩子营造皇帝的氛围。大家可以想象，这个孩子如果不改变，未来会受到多大的挫折。


    还有一类家长把孩子当成一张白纸，觉得这张白纸可以画最最最美的图画，随着自己的想法画。有的觉得这个小孩长得像小女孩，而自己又喜欢小女孩，就索性给这个男孩穿上了小裙子。殊不知，这样的方式可能会让孩子性别错乱，未来可能有一天给你来个同性恋看看。有的家长发现孩子肚子特别小，觉得这个孩子不应该胆小，然后就让孩子晚上出去或者去看鬼片儿，要练他的胆大。结果发现，这个孩子胆儿越来越小，那是因为这个家长根本不知道，孩子大体从心理的角度可以分为五种气质类型。这五种气质类型是天生的气质类型，你要用不同的方法来对待它。否则，就相当于给羊吃肉，相对于喂狼吃草。你费了非常多的心力，却并不能得到有效的结果。


    这五种气质类型分别是乐天型、冷静型、忧郁型、激进型和牵敏型。忧郁型的孩子特别渴望自由，不希望别人管，他们最极致的目的就是为了懂得真、善、美。


    我们说说乐天型的孩子。可能有一类孩子他这个人际关系特别好，你跟他说什么他都答应你，但是转身就给忘了。他们对金钱、对游戏的控制力特别差。这样的孩子往往都是乐天型的孩子，你要求他做一件什么事，他未必能够去做。但是如果你懂他的气质类型，你跟他搞好关系，他可能会乖乖去做。因为他们不会为对错去努力，只会为好的-人际关系去努力，这是他的气质类型决定的。


    还有一类孩子他动作特别慢，无论做什么事情都让家长很着急，然后总要催促他。结果发现，越催促这个孩子，孩子就越慢。这样的孩子往往不是因为他的动作慢，而是因为面对一件事情的时候，他要充分思考，思考完之后他觉得有安全感了，他才会去行动。这样的孩子往往是冷静型的孩子。冷静型的孩子你要尊重他的节奏，另外，你要在意他的自尊，不能拿他的慢来说事，更不能通过这件事来贬损他。否则，你们的亲子关系会破坏，这个孩子的心理也会造成巨大的压力。


    激进型的人就很好理解了，希特勒就是典型的激进型。这样的人为了自己的目标不择手段，就像打不死的小强一样精力无限，失败了一次还会重新来过。


    而奉献型呢，我们的星友可以回家看看自己的妻子是不是这种类型。这种类型的人任劳任怨，会干很多的事，但是却愿意抱怨。如果你不能及时的评点她所做的事，不能及时的认可她。那她的心理就得不到满足，就会升起怨恨性的东西，这样类型的人就是我们所说的奉献型的人。这样的人做一件事情你不能说，谢谢你，你这件事情做得好，这样的话语往往并不能让她满足。比如说她帮你擦了一双鞋，你跟她说，老婆谢谢你，你不给我擦这双鞋，我今天上就晚了。或者是你晚上下班回来之后说，哎呀，今天穿这个出去，我特别有面子，大家都说我今天的着装特别好，尤其是我的鞋擦得倍儿亮。那么她听完这句话心里就得到了满足，接下来就会拼死拼活的帮你做更多的事。如果不知道她的这种气质类型，只是很随意的说，谢谢你。那么长此以往，她就会怨恨你，甚至憎恨你。


    我们的家长没多少人知道，孩子是分这样的气质类型的，是要用不同的手段来对待的。如果不懂的话，那就会在我们打着爱的旗号，全力以赴的过程中，埋下巨大的隐患。


    我们有的家长还会把孩子当成一个盆景，给照顾的特别好，雕琢的也很好，看起来这个行为习惯也很好，但是呢，因为它的根扎在土盆儿里，它的格局不大，所以未来就会有三年级现象、五年级现象、初中一年级现象、初中三年级现象。原来学习很好，很听话的孩子考了一个不错的学校，并且进入了实验快班。结果呢，成绩一落千丈，最后甚至厌学。


    这些对我们孩子的认识都是错误的。孩子是一颗带着天然使命的种子。每个孩子都是不同的种子，你不能要求所有孩子都有毛竹这样的生长速度。如果我们的孩子是橡树，你想让他像毛竹一样，早早就表现出耿聪慧，那是不可能的，就像你不能要求夜来香的种子散发出荷花的清香。


    当意识到孩子是一颗种子的时侯，就改变了教育最主要的认知。我们会觉得教育不是以家长为主，教育应该是以孩子为主，教育是以孩子为主体。这就涉及到我们心法的第一个，叫：事无好坏，诠释在人。


    因为生命的成长是孩子本身的事，他带着他天生的天赋和使命，他有自己热爱的领域。我们家长在这个过程中只能引导，只能是一个助推者，而不是一个操控者，甚至更不是一个全局的把握者。


    有了这个想法之后，再面对孩子的时候，我们就不是按照自己的规划蓝图来设计孩子的走向。我们就不会因为孩子没有按照我们的规划走而感到焦虑，我们就不会觉得我们的孩子怎么不如隔壁家的小明呢？我们就不会否定、数落、抱怨、威胁我们的孩子。我们就会发现我们孩子身上也有非常多的优点。我们就会了解一个生命的成长，有他自己的道路，有他萌发的节奏。


    在教育孩子过程中，我们作为一个引导者，要有一个全局性的了解。这就涉及到我开始给大家讲的教育的目的。


    教育到底是什么？教育的目的是为了开发人性。我把教育比喻成是一个生命的重新疆活操作系统。老天让人生在天地间，有了身体，有了生命，同时还要有他的慧命。那么这个慧命如何来启动？就像我们计算机有了硬件之后还有内驱，还有软件。其实呢，教育就是内驱，能够驱动我们的软件，能够重构我们的生命，让我们的生命能够去发现自己的使命，践行自己的使命，能够去达成自己，利益他人。所以，教育可以总结成四个字：长善救失。你要去长养善的东西，你要去救助生命中容易走偏的地方。就像小树长了枝桠之后，我们要及时的去把它修剪掉。


    在这个过程中，我们要引导孩子，是因为现在跟孩子在一起的时间很少，我们的孩子已经没有了我们过去成长的自然环境、社会环境。我们的社会价值观已经发生了非常多的变化。所以，我们更多的是靠语言跟孩子进行相关的交流。因此，我们就要求用好语言这种工具。这里边就涉及到我们所说的第二个心法叫：表扬，是为了未来不依赖表扬。


    现在有很多教育方面的书籍告诉我们，好孩子都是夸出来的你要求怎么善于表扬孩子。所以，当孩子做点儿什么事情的时候，我们家长都会说：“啊，你真棒，孩子你太厉害了”。结果，我们的孩子上了学之后，老师不表扬他，他就很生气。当别人夺去了他的光芒，他就要配毒药把别人毒死。


    想做到“表扬是为了不表扬”，就需要说话有技巧。这个涉及到我给大家分享的五个招法。


    ### 招法一：让孩子先做好，我们再长善。


    一个好的家长，智慧的家长善于看到孩子身上的闪光点。也有很多家长说：“我怎么觉得我们家孩子没有什么优点吗？”我们经常会跟家长说，你要像在鸡蛋白里挑骨头一样去找他的优点。如果没有优点，那么还有一种方法可以让他展现优点。比如说，你让他帮你拿一双鞋，他拿来之后你就跟他讲“孩子呀，你真贴心。你看，妈妈让你拿双鞋，你拿无怨言的就拿来了。而且，拿鞋的过程中你很小心细致，另外，你把鞋拿到妈妈身边的时候你摆的这么正，证明你做事特别有规律。”长善，先让他做好，然后再长善。甚至等家人回来的时候，你就跟家人大张旗鼓的讲，今天我让孩子给我拿鞋，孩子拿鞋的这个过程中板板正正摆到我面前，这叫当众长善。


    通过这样的方法就会激发出孩子身上更多这样的优点。我们知道，植物生长的过程中，有一个规律叫顶端优势。世曝阳光越多的地方，它长得就越多。从心理学角度有一个概念叫聚焦优势。你在哪个地方聚焦，它就会呈现哪一个。而我们现在的家长说的基本都是否定的东西，你怎么不行，你怎么不听话。所以，我们的孩子呈现给你双倍的否定。


    ### 招法二：表扬孩子，用“你就是”。


    第二个招法就是使用表扬的通用句式。表扬的时候，我们说：“你真棒，你太厉害了。”这样的话其实是不对的。为什么不对呢？是因为你在这么表扬的时候，就意味着他此前不棒，此前不优秀。你是用上帝视角来表扬他，他只能匍匐在你面前。我们的第二心法是：表扬，是为了未来不依赖表扬。所以，我们在表扬的时候可以换一种句式，叫“你就是”。比如说，他战胜了自己的恐惧。你就说，你就是一个勇敢的孩子，这么难的事，妈妈都不敢面对，你却勇于面对；你就是一个细心的孩子，妈妈都没有注意到事情，你替妈妈看着了，有效的提醒了妈妈；你就是一个善解人意的孩子、你就是一个智慧无穷的孩子，你就是一个眼光长远的孩子；你就是一个干净整洁的孩子…用“你就是”来替换“你真棒”，“你很厉害”，是因为我们把对事的关注变成了对人的关注。


    我们现在的家长更多的是对事儿的关注。比如说，孩子考了多少分？孩子在学校里乖不乖？其实，你根本就没有关注到孩子本身，孩子就会觉得我妈妈


    关注的只是分数，根本不关心我这个人，那么他内心的营养就匮乏。我们说一个生命的成长，它包括生理的成长，心理的成长和性理的成长。生理的成长我们大家都知道，就是身体层面上要健康。心理方面的成长，它需要有安全感、归属感、价值感，需要有爱的滋养。但我们的孩子总被否定，总被物化。所以，普遍心理营养匮乏。性理方面，就是说这个孩子知道为什么而活，知道人可以达到什么样的高度，这是对孩子慧命、智慧的引领。这就涉及到我今天要跟大家分享的第三个心法：教育孩子有三种层次。


