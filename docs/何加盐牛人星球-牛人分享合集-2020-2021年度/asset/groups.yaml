    收入，那是另外一条路。那是你的第 1 桶金挖到之后就可以做一些投资。但早 期的 话我认为这 4 条路，一定要素清楚你要成定位。哪一条路是合适你的。


    人的这条路，我觉得没有什么高下之分。完全在于你是否喜欢，你的兴趣 很重要。你到底愿意过一个什么样的生活，你到底是愿意直打工下去还是愿意 当老板。这跟人的性格有关系。所以这点我就不能展开讲。我就讲一讲这个定
    位，定位要非常清楚。


    在比利时的一家报社，20 多年前我在读者上就看到一篇文章《对全国 60 岁以上老人做过一次调查，你这辈子最后悔的是什么？》。

    第一，后悔年轻的时候努力不够，以致一事无成；第二是遗憾了职业；第 三后悔对子女教育不够，方法不当；第四后悔没有好珍惜自己的伴侣；第五 后悔锻炼身体不足；第六，后悔对双亲尽孝不够；第七后悔一生过于平淡，缺
    乏激情；第八后悔挣钱太少。这当时比利时是对全国 60 岁以上老人做过一次调 查，大家可以参照一下。你自己要避免这些后悔，你现在该做什么？

    刚才讲的第 1 点，现在讲的是第二点，就是能够在社会上想混得越来越好


    的话，我觉得这个要持续的付出。


    这是什么意思呢？就是你的方向定了，那下一步就是你要该怎么做？那我觉得这个持续的付出。我们不要陷入一些低水平的付出。当然我们不是说贬低脑力劳动者，你永远做一个保安，永远做一个快递小哥和你永远做一个前台接待员，我相信你很发达。但是当然你可以过的
    shed 小康之家都没问题。但是如果我今天讲的是如果你最终在 35 岁之后能成为一个有智慧的人，付出是要有智慧的。那我现在跟你们讲个故事说明这种付出的一种重要性。我也会讲我跟何老师是怎么认识的。


    其实这个故事大家很多人都听过了，我再讲一次，这里强调一下这种有智慧的付出或是一种资源整合的重要性。我把这个故事讲完了之后也顺便跟大家讲一下我跟何老师是怎么认识的，也希望身说法想我们怎么去有智慧的付出。


    有一个优秀的商人杰克，有一天告诉他儿子，“我已经选好了一个女孩子，我要你娶她”。儿子回答道，“我自己要新娘我自己会决定”。杰克说道，“但我说的这个女孩可是比尔盖茨的女儿”。儿子欢呼道，“那这样的话我要考虑考虑呕”。杰克对比尔盖茨说，“我在帮你女儿介绍个好丈夫”。比尔盖茨说，“我女儿还没想嫁人呢？”。杰克又说道，“但我说的这个年轻人可是世界银行的副总裁哦”，比尔盖茨大吃一惊，说，“�<|message|>，
    那这样的话要考虑考虑”。接着，杰克就去找世界银行总裁。杰克说，“一位年轻人来当负责行的副总裁”。总裁说，“我们已经有几十位副总裁够多了”。“但我说的这个年轻人可是比尔盖茨的女婿总裁”，杰克说道。总裁叫，“哇，那这样的话我也会考虑考虑”。最后杰克的儿子娶了比尔盖茨的女儿，还当上世界银行的副总裁。


    这个故事是完全虚构的，很老很戏剧性，也很理想化。但是你从中悟出了什么呢？其实任何一个从无到有，从小到大从弱到强的销售人员，或者企业家都是一优秀的资源整合者。整合自己的时间、精力、智慧、情感，取得好的工作成绩，创造更大的经济价值和社会价值。所以我们要整合的，而不是一个低级的勤奋者。


    那我跟何老师是怎么认识的？其实我就关注了何老师公众号，他写的文章非常好，将雷军、马云写的很有思想也很深度，看的很过瘾。后来我就加入了牛人


    星球，加了微信。我现在都忘了我付了多少钱呢？总之我就想认识这个何老师。


    那这个洁柔老板我是怎么认识的呢？其实，我认识他的时候，我是个小业务员，他当年已经是亿万富翁了，现在是中山的首富，已经接近70岁了，我们认识已经快20年了。那你问他是不是我客户呢？其实他还不是我的客户，但是我一直跟他保持联系。我跟他也吃了很多次饭，他也见了我很多次。他真的把我当可以说把我当好朋友，可以这样说吧，虽然没有做成生意，但他一直把我当好朋友，所以他很乐意去我介绍给他的这个作家何老师。然后，他们就成功合作了，细节就不讲了，就讲了一下你怎么去资源整合。


    虽然会常说一个非常负面的词来说的话，一个像有些空手套白狼的感觉。其实我觉得不是它是从无到有，你是用心去帮别人，你要知道别人缺什么别人有什么，对不对？因为对于我们来说可能跟这个有钱人打交道，我们没有跟他们比钱多，我们只能比这背后的资源，我们可以利用背后的资源能够为他所用，那这样的话，他对你更加刮目相看了。


    不管你是从事什么行业，我觉得我们都要有一种付出的精神。我们现在年轻人都忌讳的就是，因为我也年轻过，我今年49岁了。我记得我在年轻的时候难免有些急功近利，难免有些不达到目的就马上就放弃了，我现在回想起来，觉得我当初都还是太急功近利了。


    在我年轻的时候，如果我能够有长远眼光，更能够放长线钓大鱼，我觉得我今天可能还不是现在这个样子。所以我觉得这种持续的付出是非常重要的，而且这种付出是我们首先想别人想要什么。如果你想从别人那里得到什么，首先要想你能够给别人什么。


    所以我再讲这个故事，就是个找气球的故事，给予他他想要的就会得到你想要的：


    在寻求福气的引导会上，有50个人报名参加。50个人走进一个装满气球的教室。主持人提出一个非常奇怪的要求，给每人一个气球，要求大家在气球上用笔写上自己的名字。接着他将所有的气球收集起来放到另外一个房间。然后带大家到那个房间去，要每个人分别找到写上自己名字的气球，限时5分钟。


    于是每个人就开始疯狂地寻找自己的名字，大家碰来碰去。现场一片混乱，5分钟过去了，很少有人能在规定的时间内找到写了自己名字的气球，主持人突然喊停。接下来主持人要求大家随便抛这个气球，然后把这个气球递给气球上面名字对应的人，不到三分钟，大家都接到自己的气球了。于是主持人指出，这是我们的人生！


    每个人都在<|start|>狂寻找自己想要的东西，但是没人知道它在哪里。最有效快捷的方法就是给予他人想要的，你就会得到你想要的，对不对？


    所以如果你在这个社会上，不管你是个人职业经理人也好，还是一个老板也好，还是销售人员也好，嗯怕你是医生，是个专业人士也好。你除了要靠专业吃饭外，你真的要想，你能够给别人想要的东西是什么？当你能给别人想要的东西，别人就会给你想要的东西。这是一个中国非常古老的智慧，叫做得。舍得，小舍小得，不舍不得，大舍大得。


    我介绍何老师给柔柔的老板，你说我从中得到什么好处？没有得到什么好处，就是交个朋友，这就是最大的好处，就是何老师这个朋友。所以他今天才给我这个机会来跟大家分享。那这样，我认为这种机会是非常难能可贵的，我也很珍惜跟大家分享，也很愿意跟大家讲我的一些真实想法和心得。


    刚才讲了第2点了，下面讲第3点。我们要在社会上混到出人头地的第3点，就是要长远的关系。


    长远的关系，这句话内涵还是非常大的，包括跟你的孩子的关係，跟你的妻子的关係，跟你的家人的关係，还跟你同事的关係。


    我刚毕业的时候，在保险公司的表现是非常普通的。那时候22岁来到广州，26岁开始做保险，在广州是一穷二白，也不仅仅认识什么人。


    我这个人，嗯怕到现在为止，你如果你见到我的面，你会发现我是个很内向的一个人，不是很外向的。但我有一个特别大的特点，就是刚跟别人认识的时候，别人觉得我这个人其貌不扬，好象也不是很聪明，但是我愿意跟别人建立一种长远的关系。这一点跟大家分享一下我的一些经历，可能大家就会更有感受一些。


    在广州做了两年三年保险之后，当时只能说养活自己吧。这2000年左右我去参加一个培训班，在这个班一下子认识到三十多个成功的企业家。


    你看我也是又很穷，又不自信，因为在这帮老板的眼中我是一个外地来的小伙子，一穷二白，又不够自信，都是重点大学毕业，在他们面前真的是觉得自己很卑微。当时有这种感觉，但我一直跟这些老板保持联系，所以很多老板就成为了我的客户，包括刚才提到那个老板。也是我在（他不是我同班同学）跟着老师去参加他们一个更大的同学会，接著我成为那个同学会的理事。然后又跟着冯老师去了清泰公司去参观，然后就是一旦认识他之后，我就跟他保持了一种联系的。


    同班的其他老板，我从来没有刻意去推销保险，但至<|message|>已经接近 1/3 的人成为了我的客户了。我觉得在这点我就是特别的擅长。有很多人参加短训班之后，过了两三天他就不再联系了，包括这两年我去中大岭南学院，学《领军人才班》。大家觉得我做保险的人过去好像有目的，好像推销保险，其实你说没目的吗？也有，但也不是那么直接。因为现在我们在做团队管理并没有说一定要有很大的什么压力去卖保险，我们就是随缘的心态。


    我发现一个规律，就是来到这个班级，比如说学东西也可以学一些东西，我认为可能占 1/2 关系，另外的 1/2 建立人脉关系。


    交了几万学习这个课程的人，很多人就是在前半年热情最高，过了半年之后，过了两年之后，过了三年之后，他们就流失掉了。


    刚刚说过我在很多场合刚一开始显得很内向，也不是特别的具有领导才能，我又不是班长，又不是副班长，又不是学习委员，什么都不是。结果，最后可能在这个群上最活跃，我可以为大家做的事情最多，到最后我被推举到整个学院的理事会去做一个理事。


    这是我的一个贯做法：刚开始很低调，然后靠做时间的朋友，坚持长期主义，慢慢就得到大家认可。


    所以我们一定要学会去跟别人建立一种长远的关系，但是群里的朋友有些人不见得做销售的，你们需要投资，需要寻找合伙人，需要找采购商，我觉得长远的关系非常的重要。


    那长远的关系的话，因为我做保险做了 12 年，在我们这个行业，我做了 22 年的保险了，我太太做到 14 年的保险了，我们加起来 36 年的保险。在广州友邦保险，比很多人的年龄还大。那截至今天为止，我们服务的客户不超过
    300


    个家庭，其实也不多，我们的心态就是为这些客户服务一辈子。因为他们会不断的加保，有人结婚，有人结婚离婚，生孩子，生一个，生两个。或者有些人从小老板变成大老板。就是我们很在乎这个长远的关系。


    但反过来是不是其他行业就不重视这个关系呢，其实也不见得。我建议大家还是做一个长情的人，但这个长情并不是说没有原则，就是这个人跟你三观不合，你一定要跟他保持联系？不是，我如果那种三观相同的人一定要去珍惜，不要在乎现在做不做的成生意。


    我在 30 岁的时候，也曾经犯过错误，有一段时间我就特别的高傲。在 30 多岁的时候在广州买了一套 180 平的房子。因为我认识了这边有这么多老板嘛，达标了什么全球
    md1 的公司会员，然后在番禺的一个郊区就买了一套 180 平米的房子，当时也不贵，70 万。然后我接触的人都是一些有钱人，所以我那个时候（应该在 33 时左右），我的眼晴就长在额头上，就经常看不起眼的小人物。那我现在回想起来觉得这是非常急功近利的一种短视的行为。实际上所有的大小老板都是从小老板开始的，甚至是我们所认识
    20 多岁的普通人，以后也会成为千万富翁，亿万富翁。


    因为我注重长远的关系，所以很多当年在我这买了几百块钱的保险的人，后来在我这一年交个十万，比如我很多人都认识的像中国 NLP 学院的院长，实用心理学也是个作家叫黄集团的，他第
    1 张保单就几百块钱。后来变成了几千块钱，第 3 张几万，第 4 次买的几十万。


    我跟他开玩笑说，你总有一天会跟我买个几百万的保单，您交保费几百万。那这是什么？就是一种长期主义。


    我还有一些校友，刚开始可能在我这买个四五千块钱保险，结果过了 10 年之后公司上市了，现在成为亿万富翁，那现在他再买保险就是几百万几百万的买的。


    所以这一点，我还是强调一下，哪怕你不是做保险的，不是做销售的，我认为大家一定要珍惜重视你跟这些人的关系。


    人就是三年河东三年河西。现在这个时代，很可能名不见经传的一个小伙子，一下子成为一个非常厉害的人呢，对不对？


    所以我甚至跟大学毕业的时候很多同学保持联系，他们现在已经做到了什么


    么副厅长、副局长了，我对他们也没有无所求，我卖保险有没有什么要求他的。但我觉得这样很好啊，我认识他，能够在一起吃个饭聊个天，大家互相不求，这也是一种成功。就是我们当时的关系时候偶尔帮帮一些小忙，我觉得也可以也可以不是坏事对不对？


    第 4 点是什么呢？第 4 点我跟大家分享一下：平衡的生活。


    这一点我觉得可能很多年轻人觉得不重要，觉得我现在所有心思都在赚钱上，你别跟我讲什么平衡，什么生活，有了钱什么都好说。


    其实这种观念我不是很认同。因为我在友邦，可以说我友邦长大。友邦是非常大的一个公司，友邦是一家有 101 年历史的，起源于中国上海的一家跨国公司。在广州也是
    25 年了，我在友邦里面有 22 年了。然后我们最近拿到一个全国的牌照了，也会去四川成都开业。


    那为什么提到友邦这个外资企业？因为在外资公司工作的人，可能都是相对来说，给我感觉比较注重生活。


    所以说我们是销售人员，我们是外企，我们不是有友邦的员工，我们不是友邦的高管，我们是友邦的代理。我们是做到业务总监，也是属于外企，也是说保险业业务销售体系的。但是其实我们只是做业务的人，我们也是一样很注重生活，没有说一定要成为工作狂。当然有些外企人，或者我在年轻的时候很羡慕的一些外企人，他们话好像都很有涵养一样，就是很注重旅游和家庭生活。相对来说一些民营企业家是很苦逼的，我所有认识的差不多都这样。但这是中国发展当中的一个必然的过程，我们说没有对错。


    我继续讲这个平衡的生活。就像某些你们耳熟能详的那些公司，一年赚个一两百万，都有这种公司，结果没日没夜的干了，什么 996。确实，钱可以买到很多时间，一个老板花很多钱买时间。


    但我觉得人活在这个社会上，你现在很年轻不觉得，但是随着时间的推移你会发现，生活，却是平衡还很重要。所以一个社会越来越成熟，越来越文明，不会把赚钱放在第 1
    位的，而是把这个生活平衡放在第 1 位。现在我们所看到的欧美可能就是这样一种状况。在中国还是有很多人为了成功，为了赚钱，去牺牲家庭、牺牲身体，我觉得真是不值得的。


    我跟大家分享一下这个平衡生活的七大点，这也是上次跟何老师提到的。

