    \ 明确时间、阶段性目标—跟踪评估\n  - 共同制定个人的培训计划、提供支持和帮助\n\n这里我想提醒两点的，就是针对高绩效员工我们怎么去沟通？那很多会觉得有的领导会想这个员工高绩效对吧？我就不能再表扬他了，我得故意打压他或什么，但实际上这个思维不是特别对，我想提醒的是你可以不用特质去打压他，也不用舍不得表扬他，因为人都是希望被表扬的，你可以在沟通过程中去增强他的信心，同时让他成为你的左膀右臂，给你更多提出他对部门的一些改进建议和个人发展的期望，然后你结合他的个人期望给他设计更有挑战，更有难度的工任务和目标，我觉得这个是对高绩效员工关注的地方。\n\
