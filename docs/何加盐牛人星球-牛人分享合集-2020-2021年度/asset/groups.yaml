    做？怎么去完成？然后在技术里找资源，在市场上去找供应商。这种公司有做 大的吗？反正我没有看到。真正做大的苹果，腾讯、卖的都是感觉，理念，信 仰。包括 bilibili，年轻人喜欢，这就是一种场。所以我们真的应该从现在开
    始换一种思路，换一种方式去生活。


    最后我想用清华心理学教授李虹老师的话来结束今天的分享。当你专注在 此时此刻去感受生命的精彩，去感受生命的无限可能，你会发现你不会再去担 心你没有的东西，你不会再去担心你匮乏的感觉，那些曾经的烦恼也不会再来
    找你。你会不断的赞叹生命的精彩，生命的无限可能。也只有当你真的专注在 当下的时候，你会收到这个世界给你的意外的礼物。


    所以说房子、股票、工作、创业都是我们人生路上各式各样的风景，也是 我们需要去面对的课题。不要刻意追逐，不用故意回避。活在当下，勇敢去 爱，你会感受不一样的精彩！谢谢大家。'
