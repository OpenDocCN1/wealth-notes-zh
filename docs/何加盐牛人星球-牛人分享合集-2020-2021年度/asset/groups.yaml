    ## 前言


    牛人分享是加盐星友会的保留节目，也是深受星友们喜爱的內容。每次分享，都是一场思想盛宴。


    这一年度，原本我们计划是每月 1 期，共计 12 期，实际上做了 15 期。我们把其中 13 期整理成文字稿，共计 16 万字。就是你看到的这份文档。

    如同去年一样，今年的分享嘉宾，也都是各行各业的专家或大咖。他们有：


    - ➢ 咨询公司总经理，讲解沟通的技巧；

    - ➢ 大型地产公司财务副总，讲解普通人应该应会的财务知识；

    - ➢ 教育培训学校校长，讲解亲子教育问题；

    - ➢ 全国知名医院儿科医生，讲解儿童基本保健知识；

    - ➢ 网络著名大V 陈经博士，讲解拜登上台后对中美关系的影响；

    - ➢ 年入几百万的保险公司高管，讲解职场营销秘诀；

    - ➢ 前华为人力资源经理，讲解华为人力资源那些事儿；

    - ➢ Recap机构创始人，浙大蒋汤鹏飞，讲解不为钱活的另一种生活；

    - ➢ 律师事务所合伙人，讲解普通人应该应会的法律常识；

    - ➢ 公众号大V 卢克文，讲解看透世间万物的心法。


    除了嘉宾分享外，何加盐也做了三场内部分享课，分别是：


    - ➢ 人生战略，从规划到实施；

    - ➢ 如何应对刹变的时代和时代的剧变；

    - ➢ 人生道路该如何选择。


    这些分享与课程，都是非常有价值的，也是其他场合很少有机会听到，每一场都值得大家再三研读，好好回味。


    也许你当时就认真听了，不妨再好好看一遍，一定会有新的收获；也许你当时因为忙，没来得及听，那就趁此机会应该好好学习一下。


    下面，请好好享受这 13 场“思想大餐”吧。


