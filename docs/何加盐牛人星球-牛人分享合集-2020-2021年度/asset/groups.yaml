    中美还有一个很大的竞争领域，就是互联网。全球互联网基本上现在前 20，就只剩下美国企业和中国企业了。这是一个很奇怪的现象，美国互联网垄断全球，但是中国互联网企业也不弱。所以现在中国互联网企业走出到海外，包括这次的抖音事件，就是因为抖音走向全球，导致中美在互联网这个事也发生了竞争。但是在特朗普时期，这个矛盾都激化了，特朗普就直接下手了，包括说还要搞净网运动，说全球互联网就必须把中国企业，包括华为这些互联网基础设施都清除掉。


