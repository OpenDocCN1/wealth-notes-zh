    《民法典·继承编》第一千一百三十条规定，同一顺序继承人继承遗产的份额，一般应当均等。对生活有特殊困难又缺乏劳动能力的继承人，分配遗产时，应当予以照顾。对被继承人尽了主要扶养义务或者与被继承人共同生活的继承人，分配遗产时，可以多分。


    有扶养能力和有扶养条件的继承人，不尽扶养义务的，分配遗产时，应当不分或者少分。继承人协商同意的，也可以不均等。


    《民法典·继承编》第一千一百四十一条规定，遗嘱应当为缺乏劳动能力又没有生活来源的继承人保留必要的遗产份额。第一千一百五十九条规定，分割遗产，应当清偿被继承人依法应当缴纳的税款和债务。但是，应当为缺乏劳动能力又没有生活来源的继承人保留适当的遗产。


    ## 五、《民法典》中关于担保方面的新变化


    ### 1、保证方式未约定或约定不明的推定，由原“连带保证”改为“一般保证”。


    保证合同对保证方式没有约定或者约定不明确时，《民法典》第 686 条将保证方式推定为“一般保证”，与原《担保法》规定的“连带责任”截然相反。相对连带保证，一般保证的保证人享有先诉抗辩权，即在主合同纠纷未经审判或者仲裁，并就债务人财产依法强制执行仍不能履行债务前，有权拒绝向债权人承担保证责任。可见，《民法典》关于保证方式的推定规则更为倾向保护保证人利益。


    区分保证方式对于债权人以及保证人具有至关重要的意义。对于债权人而言，应当在保证合同中明确约定保证方式，如需保证人承担连带保证责任的，则必须明确约定保证方式为“连带保证”。对于保证人而言，则应当清楚地在保证方式未约定或约定不明确时，享有“先诉抗辩权”。


    ### 2、保证期间及保证债权诉讼时效


    - （1）保证期间约定不明的，由 2 年调整为 6 个月


    保证期间，是确定保证人承担保证责任的期间。《民法典》第 692 条将约定不明的保证期间由 2 年调整为 6 个月，与未约定保证期间的情形保持一致。《民法典担保制度解释》第
    32 条规定，保证合同约定保证人承担保证责任直至主债务本息还清时为止等类似内容的，视为约定不明。


    《民法典》缩短约定不明情况时的保证期间是出于“消除隐形担保及过度担保”的初衷，体现了对于保证人的倾向性保护。债权人为保障债权的实现，应关注保证期间的约定，尽可能约定明确的保证期间，在未约定保证期间或者约定不明的情况下，应当及时依法行使权利。


    - （2）一般保证的诉讼时效起始日期由“判决或者仲裁裁决生效之日”修改为“保证人拒绝承担保证责任的权利消灭之日”


    《民法典》第 694 条将一般保证的诉讼时效的起始日期修改为“保证人拒绝承担保证责任的权利消灭之日”。原《担保法》及《担保法解释》规定一般保证的诉讼时效起始日期为“判决或者仲裁裁决生效之日”。


    本条款修改的原因在于，根据原《担保法》及《担保法解释》的规定，在判决或裁决生效后到保证人先行抗辩权消灭前，债权人事实上上无权请求一般保证人承担保证责任，而这显然不符合诉讼时效的制度本意，无疑减损了债权人的时效利益。


    ### 3. 新增共同担保人之间享有内部追偿权的情形


    针对混合共同担保人之间的内部追偿权问题，实务中一直存在争议。原《担保法解释》对混合共同担保人内部追偿权持否定态度，随后出台的原《物权法》对此态度不明，直到《九民纪要》彻底否定混合共同担保人内部追偿权。


    《民法典》配套实施的《民法典担保制度解释》则回应了各界对于共同担保追偿权问题的关切。其中《民法典担保制度解释》第 13 条，对于共同担保（两个以上第三人提供担保时），在三种情形中，担保人之间享有内部追偿权。


    《民法典担保制度解释》秉承了担保人原则上不享有相互追偿权的观点，对于当事人明确约定或者推定当事人具有互相追偿意思表示的情形，赋予当事人之间相互追偿的权利。“连带共同担保”中承担了担保责任的担保人，可以要求其他担保人按比例分担债务。


    那么担保人能否通过受让债权的方式，取得原债权人的法律地位，要求其他担保人承担担保责任呢？《民法典担保制度解释》第 14 条对该问题给出了否定答案。根据该条款规定，担保人受让债权，就其行为本原而言属于担保人承担担保责任，其他担保人可在受让债权的范围内主张免除担保责任，而担保人之间的相互追偿问题仍依照《民法典担保制度解释》第
    13 条的规定处理。


    举例来说，张三借 100 万元给李四，王五和赵六二人提供担保。


    债务到期，李四偿了 70 万还给张三，还剩 30 万元没还。张三看中了王五的汽车，张三以剩余 30 万元债权作为对价购买汽车。王五虽然受让了该债权，成为债权人，但仅在王五和赵六约定可以相互追偿
    或者承担连带共同担保，又或者在同一担保合同签字、盖章或按指印 的情形下，才有权要求赵六按比例分担 30 万元的担保责任；否则，王五无权向赵六追偿，只能追李四还钱。


    ### 4、共同保证中，部分保证人未被主张保证责任，其他保证人虽无权向其追偿，但有权向债权人主张在不能追偿的范围内免除保证责任。


    关于保证人在整个保证期间内未被债权人主张过保证责任的，已承担保证责任的其他保证人可否向其追偿的问题，在实务中存在着争议。


    原《最高人民法院关于已承担保证责任的保证人向其他保证人行使追偿权问题的批复》对该问题进行了肯定回答：保证期间经过，连带共同保证人虽然不用对债权人承担担保责任，但仍需其他连带担保
    保证人分担应当承担的份额。


    一方面，《民法典担保制度解释》第 29 条第 1 款规定，共同保证中，债权人向部分保证人行使权利的效力，并不及于其他保证人。该条款的核心要素在于，债权人在保证期间向多个保证人行使权利的范围应当“全覆盖”。


    另一方面，《民法典担保制度解释》第 29 条第 2 款规定，债权人未在保证期间内向部分保证人主张保证责任，导致其他保证人在承担保证责任后丧失追偿权的，其他保证人在其不能追偿的范围内免除保证责任。该条款的核心要素在于，债权人怠于在保证期间内行使权利的结果，不应由其他保证人承担。


    ### 5、新增公司提供担保时，债权人应当审查公司决议


    - （1）公司提供担保，债权人应当对公司的决议进行审查


    根据《民法典担保制度解释》第 7 条，公司的法定代表人越权担保，担保合同仅在相对人为善意时对公司发生效力。相对人善意的判断标准在于相对人在签订担保合同同时，是否尽到了对公司决议的审查义务；《民法典担保制度解释》第
    11 条规定分支机构对外担保时，债权人负有审查总公司决议的义务。


    - （2）上市公司及其控股子公司提供担保，债权人应当审查上市公司披露的关于批准担保事项的公告


    《民法典担保制度解释》第 9 条新增规定，对于上市公司及其控股子公司，


    债权人应当审查上市公司披露的相关批准担保事项的决议。也就是说，上市公司及其控股子公司的对外担保除了要经过董事会决议或股东大会决议外，还应当公开披露。


    该规定是为了解决实践中上市公司法定代表人越权签订担保合同，导致上市公司资产被掏空，严重损害中小投资者利益的问题。


    ### （3）无需审查公司决议的例外情形


    《民法典担保制度解释》第 8 条规定了债权人无需审查公司决议的例外情形，包括：


    - （1）金融机构开立保函或者担保公司提供担保；

    - （2）公司为其全资子公司开展经营活动提供担保；

    - （3）三分之二以上表决权的股东在担保合同上签字同意。


    上市公司对外提供担保，不适用第（2）项、第（3）项的规定。相对于《九民纪要》第 19 条规定，《民法典担保制度解释》第 10 条新增了一人有限责任公司为其股东提供担保，债权人无需对公司股东决议合理审查的情形。


    同时，《民法典担保制度解释》缩限了无需审查内部决议的例外情形：其一，将关联担保中公司“直接或间接控制的公司”修改为“全资子公司”；其二，删除了“公司与主债务人之间存在相互担保等商业合作关系”的情形。


    ### 6、明确抵押期间，抵押人无需抵押权人同意即可转让抵押财产


    从《民法典》规定来看，抵押权人可以通过约定来禁止或者限制抵押物转让。


    《民法典担保制度解释》第 43 条进一步要求，只有将禁止或者限制转让抵押财产的约定进行登记的，才能对抗受让人，使得该抵押财产转让不发生物权效力，除非受让人代替债务人清偿债务导致抵押权消灭的。


    因此，若抵押权人不希望抵押人转让抵押财产，建议对此进行明确约定，并且在办理抵押登记时将该约定一并进行登记。


    ### 7、正常经营买受人规则的适用范围由浮动抵押扩展到动产抵押


    根据《物权法》第 181 条及 189 条的规定，正常经营买受人规则是指动产浮动抵押（即企业、个体工商户、农业生产经营者以现有的以及将有的生产设备、原材料、半成品、产品抵押的情形），不得对抗正常经营活动中已支付合理价款并取得抵押财产的买受人的规则，其本质是一种特殊的善意取得规则。


    举例而言，一个大卖场将其现有的以及将有的所有商品为银行设定了抵押并登记，顾客可以在付账后取得商品的所有权，并且不受抵押权的追及。


    《民法典》第 404 条将正常经营活动买受人规则的适用范围，由动产浮动抵押扩展到动产抵押，明确以动产抵押的，不得对抗正常经营活动中已支付合理价款并取得抵押财产的买受人。


    《民法典担保制度解释》第 56 条规定，正常经营活动是指出卖人的经营活动属于其营业执照明确记载的经营范围，且出卖人持续销售同类商品。同时还规定了正常经营买受人规则五种例外情形，目的在于避免抵押人和买受人恶意地通过买卖抵押财产规避债权人抵押权。


    在《民法典》实施之前，正常经营买受人规则只限于动产浮动抵押，原因在于动产浮动抵押中抵押财产具有不确定性、流动性，在浮动抵押中并不限制抵押人出让抵押物，抵押人在抵押权实现前可以放手经营。现在将这一规则扩大到动产抵押中，使得在正常经营活动中，买受人无需耗费精力查验标的物上是否存在权利负担，从而降低交易成本，提高交易效率。


    ### 8、进一步完善了让与担保制度


    - （1）明确让与担保制度的概念及效力


    让与担保，是指债务人或者第三人与债权人约定将财产“形式上转移”至债权人名下，以担保债权实现的制度。


    《九民纪要》第71条首次明确了让与担保的概念和效力，《民法典担保制度解释》第68条、69条将这一制度进一步完善。《九民纪要》除对让与担保的财产或财产权直接归属于债权人的约定（流担保）及相应的请求不予支持外，对让与担保合同的效力及债权人的具有担保物权性质的优先受偿权均给予了肯定。《民法典担保制度解释》第68条将《九民纪要》的上述规定进行了重申，并且新增了两点规定：


    第一，债务人与债权人约定将财产转移至债权人名下，在一定期间后再由债务人或者其指定的第三人以交易本金加上溢价款回购，债务人到期不履行回购义务，财产归债权人所有的，其本质上属于让与担保，适用让与担保制度的相关规定。


    第二，若债务人与债权人约定的到期回购财产标的是虚构的、不存在的，则视为“虚假意思表示”，进而认定合同无效。


    - （2）新增股权让与担保中，债权人不与其他股东承担瑕疵出资连带责任


    《民法典担保制度解释》第69条规定，股权让与担保中，公司或者公司的债权人以股东未履行或者未全面履行出资义务、抽逃出资等为由，请求作为名义股东的债权人与股承担连带责任的，人民法院不予支持。该条款实际上是肯定了让与担保的担保本质，而非真正意义上的受让股权，既尊重了立法原意，又保护了债权人因接受让与担保而利益减损。


    让与担保制度属于非典型担保，发挥着重要的担保功能和商业价值。实践中，抵押权、质权等典型担保方式存在变价高昂、手续繁琐、债务人恶意转移抵押财产等现实问题。相比较而言，让与担保首先将抵押财产转让给债权人，债务人不履行到期债务，法律允许债权人对财产折价或者以拍卖、变卖该财产所得价款优先受偿，因此，让与担保凭借其融资灵活、交易成本低、第三方阻碍债权实现可能性较小等优势，深受债权人的追捧。


    ### 9、进一步完善了保证金担保制度


    相较于原《担保法解释》，《民法典担保制度解释》在体例上将保证金担保编排在“非典型担保”部分而非“动产质押”部分。除此之外，还将金钱质押的形式从“特户”、“封金”、“保证金”统一为“保证金”。当然，这些更多是文字方面的调整。在此，我们不予赘述。相对而言，《民法典担保制度解释》将保证金担保制度进一步细化和完善，主要变化体现在两个方面：


    首先，原《担保法解释》第 85 条规定，保证金担保以“债务人占有”为设立要件，《民法典担保制度解释》第 70 条将“占有”修改为“实际控制”，并将“实际控制”方式具体化为两种实践中常见的方式：


    - 设立专门的保证金账户并由债权人实际控制；

    - 将资金存入债权人设立的保证金账户。


    其次，规定保证金账户内的款项浮动，不影响债权人对账户内的款项享有优先受偿权。《民法典担保制度解释》再一次重申该观点，并在肯定保证金担保成功设立的基础上，进一步规定保证金账户内的款项浮动，不影响债权人对账户内的款项享有优先受偿权。


    ### 10、主合同有效而担保合同无效，担保人有过错而债务人无过错的，担保人由承担“连带赔偿责任”修改为“对债务人不能清偿的部分承担赔偿责任”


    《民法典担保制度解释》第 17 条规定了第三人提供的担保合同无效的赔偿责任划分问题。针对担保人有过错而债务人无过错情形，《民法典担保制度解释》将原《担保法解释》第
    7 条进行了实质性修改，将担保人承担的赔偿责任由“连带赔偿责任”修改为“对债务人不能清偿的部分承担赔偿责任”。


    相较于原《担保法》，《民法典》的立法价值取向发生了变化，从保护债权人变成了平衡债权人和担保人的利益。如此调整后，担保合同无效的赔偿责任划分问题，与《民法典》的立法价值取向保持着系统性和一体化。


    ## 六、公共场所侵权责任纠纷的规定


    ### 1、学校等公共场所侵权责任纠纷的规定


    实践中，在校园、公共场所或群体性活动中，因第三人的行为造成损害的事件时有发生。在第三人侵权的情況下，由第三人承担侵权责任毋庸置疑。不过，第三人可能无法确定，可能下落不明，也可能缺乏赔偿能力等因素影响被侵权人的权利得以实现。这时公共场所的管理人或者群体性活动的组织者往往就是被侵权人主张权利的对象。当然，这种补充责任有别于侵权责任，并且依据最新颁布的民法典的规定，经营者在承担了这种补充责任后是可以向第三人进行追偿的，


    我们一起来看一下。


    虽然《民法典》第 1199-1201 条的内容改动并不大，但该等条文却是《民法典》侵权编中与学校最密切相关的条文，基本确定了无民事行为能力人、限制民事行为能力人和第三人侵权的校园伤害事故责任承担的原则。需要注意的是，学校在这种三种类型的校园伤害事故中所承担的责任和举证义务是不同的。


    对于无民事行为能力人的校园伤害事故，学校适用的是过错推定原则，在学校能够证明已尽到教育、管理职责的情况下，才能免除侵权责任，即举证责任在学校一方。


    对于限制民事行为能力人的校园伤害事故，学校适用的是过错责任原则，在学校未尽到教育、管理职责的，才应当承担侵权责任，即举证责任在受害人一方。


    当无民事行为能力人或者限制民事行为能力人在校园内受到第三人侵害的，由第三人承担侵权责任，学校未尽管理职责的需承担补充责任，此时举证责任在受害人或第三人。


    从以上条文可以看出，在校园伤害事故中，学校是否需要承担侵权责任与其是否尽到教育、管理职责息息相关，学校一定要做好学生的安全防护和教育工作。


    而公共场所和群体性活动如何认定侵权行为与损害事实之间的因果关系？依据《民法典》一千一百九十八条的规定：


    宾馆、商场、银行、车站、机场、体育场馆、娱乐场所等经营场所、公共场所的经营者、管理人员或者群体性活动的组织者，未尽到安全保障义务，造成他人损害的，应当承担侵权责任。


    因第三人的行为造成他人损害的，由第三人承担侵权责任；经营者、管理人员或者组织者未尽到安全保障义务的，承担相应的补充责任。经营者、管理人员或者组织者承担补充责任后，可以向第三人追偿。


    因此受害人无须直接证明安全保障义务人消极不作为与损害发生之间存在因果关系，只需要证明安全保障义务人负有特定的作为义务，不履行该义务与损害的发生之间存在高度的盖然性，如果安全保障义务人履行了自己的作为义务，则损害极有可能被避免。


    经营者的安全保障义务的法理基础来源于德国法院从判例发展出来的“交往安全义务理论”。经营者的安全保障义务作为一种积极的作为义务，要求经营者应当在合理限度范围内以积极作为的方式防止或制止损害的发生，在发生第三人侵权的情况下，经营者在合理限度范围内可以防止或制止损害的发生，却未能防止或制止时，经营者即存在过错，应当承担不作为的侵权责任。


    但是在公共场所发生的意外伤害案件中，很多是由于顾客未注意保护自身安全引起的。如一些患有相关疾病的患者出入娱乐场所却忽视“高血压、心脏病患者禁止入内”的警示标志；未成年人
    在缺乏家长监管的情况下，在公园等公共场所作出危险举动，如嬉戏奔跑、爬高、嬉闹等，都埋下了安全隐患，一旦受到损伤，都需为自己的过错承担责任，所以无论如何，大家在公共场所时一定要注意安全，避免受到人身财产的损害。


    ### 2、交通险的最高限额的变动


    2020年9月9日，中国银保监会发布《关于调整交强险责任限额和费率浮动系数的公告》，新交强险责任限额方案为：


    在中华人民共和国境内（不含港、澳、台地区），被保人人在使用被保险机动车过程中发生交通事故，致使受害人遭受人身伤亡或者财产损失，依法应当由被保险人承担的赔偿责任，每次事故责任限额为：死亡伤残赔偿限额18万元，医疗费用赔偿限额1.8万元，财产损失赔偿限额0.2万元。被保险人无责任时，死亡伤残赔偿限额1.8万元，医疗费用赔偿限额1800元，财产损失赔偿限额100元。上述责任限额从2020年9月19日零时起实行。截至2020年9月19日零时保险期间尚未结束的交强险保单项下的机动车在2020年9月19日零时后发生道路交通事故的，按照新的责任限额执行；在2020年9月19日零时前发生道路交通事故的，仍按原责任限额执行。


    ## 七、关于消费者权益你应该知道的事


    - 1、消费者在维权中主要需要查阅的法律法规：《民法典》、《民事诉讼法》、《消费者权益保护法》、《食品安全法》、《产品质量法》；

    - 2、消费者维权的主要途径为：与商家协商和解；请求消费者协会组织调解；向市场监管管理局投诉；提请仲裁机构仲裁；向人民法院提起诉讼；

    - 3、消费者因购买、使用商品或者接受服务受到人身、财产损害的，有权依法获得赔偿；

    - 4、商家应当向消费者出具发票；

    - 5. 消费者索要发票，商家必须出具；

    - 6. 商家采用网络、电视、电话、邮购等方式销售商品，消费者有权自收到商品之日起七日内退货，且无需说明理由；

    - 7. 商家应当自收到退回商品之日起七日内返还消费者支付的商品价款；

    - 8. 商家不得以声明、店堂告示等方式，作出排除或者限制消费者权利、减轻或者免除经营者责任、加重消费者责任等对消费者不公平、不合理的规定，否则其内容无效；

    - 9. 超市保安无查消费者的身体及其携带物品的权利，更不得侵犯消费者的个人自由；

    - 10. 商家未经消费者同意或者请求，不得向其发送商业性信息；

    - 11. 消费者在购买、使用商品时，其合法权益受到损害的，可以向销售者要求赔偿也可以向生产者要求赔偿；

    - 12. 老板虽然不是营业执照上的责任人，损害消费者合法权益的，消费者可以向其要求赔偿，也可以向营业执照的持有人要求赔偿。

    - 13. 展销会结束或者柜台租赁期满后，消费者也可以向展销会的举办者、柜台的出租者要求赔偿；

    - 14. 网络交易平台提供者不能提供销售者或者服务者的真实名称、地址和有效联系方式的，消费者可以向网络交易平台提供者要求赔偿；

    - 15. 消费者因商家利用虚假广告提供商品或者服务，可以向商家要求赔偿；

    - 16. 消费者向市场管理局投诉的，该部门应当自收到投诉之日起七个工作日内，予以处理并告知消费者；

    - 17. 商家有欺诈行为的，应当按照消费者的要求增加赔偿其受到的损失，增加赔偿的金额为消费者购买商品的价款或者接受服务的费用的三倍；增加赔偿的金额不足五百元的，为五百元；

    - 18. 你微信上的那些贩卖食品的个人也应当依法取得许可；

    - 19. 消费者因不符合食品安全标准的食品受到损害的，可以商家要求赔偿损失，也可以向生产者要求赔偿损失；

