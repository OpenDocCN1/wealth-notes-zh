    共和党和民主党对于中国有一个最大的区别，就是共和党把中国当成他的第一大的危险。美国一个调查，里边说哪个国家是或者哪些事件是美国最大的威胁，共和党那边的人就说中国是第一大的威胁；而民主党那边呢，民主党那边的<|message|>'
  - '[PAGE 93]


    以前的老年人，所以基本可以相当地可预测说，民主党这边，不太可能会主动地进攻，对中国像特朗普那样发起那么恶心的超乎预期的都不卖面子的那种进攻，包括把抖音禁掉什么的，这都非常的不顾自己的体面的这种打法。


    民主党那边还有多少有些冠冕堂皇，他会讲究一个什么全球人类的理念，要讲死这个，要师出有名，多少是讲一点面子的。特别是这种老政客，很难说就抛去政府的体面，像特朗普那样的发疯般狗倚的进攻。


