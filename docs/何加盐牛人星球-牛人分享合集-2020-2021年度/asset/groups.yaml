    刚刚说过我在很多场合刚一开始显得很内向，也不是特别的具有领导才能，我又不是班长，又不是副班长，又不是学习委员，什么都不是。结果，最后可能在这个群上最活跃，我可以为大家做的事情最多，到最后我被推举到整个学院的理事会去做一个理事。


