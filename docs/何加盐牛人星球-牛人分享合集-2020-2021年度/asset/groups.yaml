    ## 人生战略：从规划到实施


    分享人：何加盐


    分享时间：2020 年 6 月


    大家晚上好，欢迎收听何加盐的人生战略课。


    因为我们是第一期分享，所以我想在此表达对咱们牛人星球第二期会员的欢迎和感谢。第二期的星友中，有差不多 300 位会员是从一期过来的。特别感谢大家对何加盐的认可和信任，也希望我们能够继续一起好好的走下去，让大家在牛人星球里度过愉快又有价值的时光。也有一些朋友是新进来的，你们可能第一次听我们的讲座。我在这里也对新朋友表示热烈的欢迎，感谢大家！


    我们现在就正式开始今晚的分享。这一次课程，我们有一个点跟以往很不一样的地方，就是做了一个调研问卷。有 107 位星友提交了问卷，感谢这 107 位星友。


    这份问卷里填过了就知道问的是非常深入的问题，包括有很多可以说是拷问灵魂的问题，所以现在我可以很得意的说，对于这 107 位星友而言，我可能是这个世界上最了解你的人，除了你自己之外。


    ![](img/d43ec9f811a059e999583aaeac906d81_3_0.png)


    首先，我们看一下参与调研的 107 位星友的性别和年龄的分布。我想这大体上也代表了牛人星球一个总体抽样的分布，咱们牛人星球大概男女比例是男生占 2/3，女生占
    1/3，这个也跟我的公众号的性别分布比是比较相接近的。从年龄层次来说，基本上是 18~60 岁都有，最主要的 57%是 26~35 岁的，职业生涯的第一个
    10 年，最容易迷茫的时期。


    ![](img/d43ec9f811a059e999583aaeac906d81_4_0.png)


    职位分布也可以看一下，我们人数最多的是 36% 的经理和主管级也就是中层或者基层的干部，也有总监级以上占 18%。其中包括 12 位创始人、5 位副总、4
    位总监级的，另外还有少数的自由职业者或者学生以及在家照顾家庭的一些人士。


    ![](img/d43ec9f811a059e999583aaeac906d81_4_1.png)


    好，现在一个重点的问题来了。你认为一生中什么原因让人最幸福？我们有接近一半的人选择了“很有成就感”，其实这个问題跟上一个问题是紧密结合的，因为我们在很多地方都做过这个调研，发现哈佛大学的
    EMBA 的课堂，人们选的最多的就是“好的社会关系”，但是在 MBA 的课堂就是说企业的中层或者高管去选的话就是“很有成就感”居多，这里代表什么呢？就是更成功的人士，他就不再那么看重“成就感”，这个东西可能因为他已经得到了。他们更看重什么呢？就是“好的社会关系”。从这里将近一半的人选择“很有成就感”就说明，我们这个群体在“成就感”这一方面还没有能够得到满足，也就是说我们的社会层其实还处于中等的位置。这也是大家都有一个想要向上的冲力，才会来到咱们牛人星球。


    ### 6. 您对您今年要达到什么目标有规划吗？（多选1项）


    - A. 有明确的方向，并有具体的落实计划 34%,37人

    B. 有明确的方向，粗略设想了落实具体步骤 30%,33人

    C. 有模糊的方向，大致在某个方向的冲动 26%,28人

    D. 基本没有方向，什么都算一步 7%,8人

    E. 完全没想过这个问题 0%,1人


    ### 7. 您对您明年要达到什么目标有规划吗？（多选1项）


    - A. 有明确的方向，并有具体的落实计划 18%,20人

    B. 有明确的方向，粗略设想了落实具体步骤 25%,32人

    C. 有模糊的方向，大致在某个方向的冲动 40%,43人

    D. 基本没有方向，什么都算一步 8%,8人

    E. 完全没想过这个问题 2%,3人


    ### 9. 相对自后10年后要达到什么目标有规划吗？（必填1项）


    - A. 有明确的方向，并有具体的落实计划 7%,8人

    B. 有明确的方向，粗略设想了落实具体步骤 28%,30人

    C. 有模糊的方向，大致在某个方向的冲动 36%,39人

    D. 基本没有方向，什么都算一步 17%,19人

    E. 完全没想过这个问题 10%,11人


    ### 10. 您对自身最终要达成什么目标有规划吗？（必填1项）


    - A. 有明确的方向，并有具体的落实计划 10%,11人

    B. 有明确的方向，粗略设想了落实具体步骤 26%,28人

    C. 有模糊的方向，大致在某个方向的冲动 34%,37人

    D. 基本没有方向，什么都算一步 14%,16人

    E. 完全没想过这个问题 14%,15人


    这里又是连续几个很重要的问题，大家可以发现我们很多人对于自己今年要做什么是，有明确的方向的，并且有 1/3 的人已经有很详细的计划，还有 1/3 的人知道要往哪走，但是没有具体的计划，走到哪里就算哪里。你们可以看到随着时间的推移，越往后我们的方向就变得越来越模糊，然后到了5年、10年甚至一辈子的时侯，大部分的人就已经没有了明确的方向了。我们可以看到在10年以上有明确方向的人只有35%，另外都是没有方向或者方向很模糊的。所以，对我们大多数人来说，我们是缺乏一个好的人生战略的。


    调研的结果我们暂时告一段落，等一会儿会继续分析。


    刚刚我提到大部分人是没有一个明确的人生战略的。大家可能会提出一个疑问，为什么要有战略呢？大家可以先想一下。


    下面我放一张图给大家看，这是两个人物的对比。


    ![](img/d43ec9f811a059e999583aaeac906d81_6_0.png)


    左边这个人大家都知道是马云，右边这个人是谁呢？可能绝大部分朋友就不知道了，他叫杜国楝。杜国楝和马云一样，也是毕业于师范学校，也当过老师，其实他做过很多东西，我们可能每个人都听过。比如背背佳、好记星、一人一本、8848钛金手机，还有现在比较流行的小罐茶。可以说杜国楝也是一个相对成功的人士，但是你们发现他和马云最大的差别在哪？马云是认定了一个方向之后一直朝这个方向走，杜国楝却不断地换来换去、换来换去。


    其实，我们如果从能力上来说，杜国楝的能力是非常强的，你看他做营销太强了！他做出了那么多很有名的品牌，但是一个能力那么强的人，为什么他要不停的换方向？把自己搞得那么累，每次都要从头开始，然后原来的做失败或者把它丢掉，自己又找一个。最关键的原因就是他自己没有一个明确的战略方向，这就导致他虽然有超强的能力，但是没有获得与他能力相匹配的成就。所以一个人有战略和一个人没有战略，它的差别是非常大的。


    我们都知道在历史上，孔子15岁“有志于学”，周总理要“为中华之崛起而读书”。每一个伟大的人物都是有清晰的人生战略的，每一个伟大的企业家都是有一个明确的方向的。如果你想有一点成就的话，那就一定要有一个明确的人生战略。下面我用一张表来述一下，有战略和没有战略，或者战略模糊与清晰之间有什么样的区别。


    | | 战略模糊 | 战略清晰 |

    |---|---|---|

    | 心理感受 | 迷茫、焦虑、压力、摇摆 | 充实、平静、斗志、坚定 |

    | 前进动力 | 得过且过、半途而废 | 充满激情、百折不挠 |

    | 人生成就 | 自我评价低、社会评价低、实际达成低 | 自我评价高、社会评价高、实际达成高 |


    我从这三个方面来对比，有战略和没有战略的区别。


    首先从心理感受来说，如果你没有战略或者战略很模糊的话，你总是会感觉到很迷茫、很焦虑、有压力，在各个方向摇摆不定；如果你的目标很清晰，战略很明确，那你就会变得比较充实、平静，做事充满了斗志，并且能够坚定不移的朝着这个目标前进，不管碰到什么困难你都不会害怕。


    从前进的动力来说，没有战略我们就会有得过且过的心理，做事特别容易半途而废，碰到一点点困难就算了；但如果战略很清晰的话，你每天过的是充满激情的朝着你梦想的方向前进，而且不管碰到任何的问题，你都能够百折不挠。


    最后从人生成就来讲，没有战略的人总体上对自我的评价是比较低的，因为他没有一个明确的指引告诉他达到一个什么样的价值目标，所以他对自己缺乏一个价值评价。在社会上的社会评价也是比较低的，因为他总是变来变去，没有一个能够被社会认可的、给他贴上标签的人生成就，从实际它能够达成的成就来说，没有战略的人成功的几率是非常小的。相反，如果战略很清晰的话，他自己会对自己的评价很高，因为他心中刀理想、有梦想、有价值感。社会对他评价也很高，知道他是一个有梦想的人，百折不挠的朝梦想前进，有战略的人实际达成目标的概率也会更高。


    所以这就是我们为什么一定要有一个人生战略的原因，如果你在回答上面那一堆问题的时候，对今年要做的事情很清晰，但是对五年、十年、一辈子要做什么不清晰的话，我觉得你非常有必要好好的思考一下后面那个问题。五年、十年、一辈子，我到底要朝着哪个方向走？我需要制定什么样的计划去达到那个目标？


    人生战略这么重要，那究竟什么是人生战略呢？


    ![](img/d43ec9f811a059e999583aaeac906d81_8_0.png)


    我认为人生战略的定义可以从这三个方面来看着手。第一个是我要往哪个方向走？第二个我从那边方向走，要走到什么位置才算成功？第三个给自己定的时间是多少？三年？五年？十年或者是
    一辈子？总体来看什么是人生战略呢？人生战略就是若干年后我要达到什么样的成绩？我变成什么样的人？


    ![](img/d43ec9f811a059e999583aaeac906d81_8_1.png)


    人生战略，是一个总体的概念，实际上它可以根据不同的年份分解为不同的东西。比如说我们今年要达到什么？其实是一个短期目标，用企业管理的术语来说，就是我们的年度
    KPI。


    3-5 年是一个人生的阶段目标，在企业里面我们把它叫做战略，其实企业的战略就是 3-5 年要达到的目标，它是一个阶段性的或者狭义的战略。


    那 10-20 年，我们要达到什么呢？这就是愿景了，愿景就是一个中长期的时间段之内我们要达到一个什么样的目标，或者说要形成一种什么状态，要成为一个什么样的人，这就是我们的愿景。


    如果我们把时间拉到一辈子，我会永不放弃地朝着这个目标前进的，这个就是我们的使命了。甚至于我死之后，我还希望别人能够继续朝这个目标前进。类似于实现共产主义或者马云说的“让天下没有难做的生意”等等，这个就是一个人的使命。所以我们平时听到的
    KPI、战略、愿景、使命到底是什么意思呢？你把它分成不同的时间段来看，其实就是战略在不同时间段的表述。


    ## 确定人生战略需要考虑的三个因素


    ![](img/d43ec9f811a059e999583aaeac906d81_9_0.png)


    那我们要确定一个人生战略需要考虑哪些东西呢？最主要的就是上面的三个因素。


    一个是你要认识你自己，你要知道自己喜欢什么、讨厌什么、恐惧什么、欢迎什么；你也要知道自己擅长什么，还有不擅长什么。这就是为什么我在那个问题里提了那么多你的不足、你的优势、你一个月的无爽、一个月的开心这些问题，其实是想帮助你认识你自己，因为这是确定人生战略第一个要考虑的因素。


    第二个就是我们要认识到外部的环境，现在整个社会是怎样的，它有哪些东西是适合我的喜好或者长处短处的，有哪些是不适合的。或者说在这个环境之下，我自己要如何修炼自己，才能跟环境变得更匹配。


    第三个就是世界、社会或者经济发展趋势是怎样的，所谓顺者昌，逆者亡，就是一个社会大的趋势在这里的话，你的人生战略要与之相匹配，不然你可能很难达到自己想要的目标。因为如果整个社会的趋势都跟你想要达成的目标是相反的，那你这个人生战略就太难实现了。我举个例子，你现在想，我的人生战略是当一个奴隶主，那就不可能实现，因为现在社会越来越开明了，不是一个奴隶主的时代。


    我们要认识自己的话，首先要知道你感冒什么，不喜欢什么，想躲避什么。你如果知道这些东西是什么，你就可以克服它，或者躲过它。

    我们人的痛苦都来自哪里呢？我们可以先看一下咱们 107 个人提供的答案：我过去一个月最大的不爽来自于哪里？


    ![](img/d43ec9f811a059e999583aaeac906d81_10_0.png)


    上面这张图是我从 107 人的答案里面摘出来的，大部分都在这里，除了写“没有的”，我没放上来。


    你们可以看一下，这些不爽都来自哪些方面，后面我会出一个总结，你可以看一看你的总结跟我的总结是不是一致。这里面有几个标黄的是我觉得比较特别的答案，其中有一个说特别不爽的是“弟弟自杀”。我看了这个答案心情特别沉重，因为我不能透露是哪位星友，我希望你在听的时候能够听到这一句：“没有什么东西是时间摆不平的，没有什么伤痛是会永远存在的，希望你能够尽快走出这个悲痛”。


    还有一个我标黄的答案是说“老公因为疫情隔离在家帮忙带娃，我就觉得更累，还不如他去上班，我一个人带孩子更轻松”。这个我为什么要标出来？就是觉得有些时候我们认为，有一个东西会让我们很幸福，但实际上我们想象中的幸福跟实际它真正达到的时候是不一致的，所以有时候我们不能用想象来代替未来的决策。我举个例子，你叫你的小孩去公园玩，他现在正在看奥特曼，他就不愿意去，他觉得去公园不好玩，但实际上呢，假如你真的把他带去之后，他在公园会玩的非常开心，他在公园又不想回家了，所以我们人类很多时候想象中的幸福未必是真正的幸福，想象中的痛苦未必是真正的痛苦。


    还有第三个标黄的说了他跟室友的一个矛盾，就是说“因为要停水，他打了两壶水，然后室友给他倒掉了”，就特别生气，甚至都把这个事故到了我们的调研问卷上，作为过去一个月最不爽的事情。我把这个标出来呢，是因为我想知道这件事真的让你这么愤怒这么不爽吗？会不会你有一点太过重视这个了？有时候我们需要心态放宽一点，有一些无关紧要的事情是可以忽略的，你觉得室友倒掉了你的一壶水，他不节约用水就把自己搞得这么生气，我认为是完全没有必要的，何不放过他，也放过自己呢？


    ## 人的痛苦来自哪里？


    人际关系 别人没有按你期待的方式对你


    突发事件 事物没有按你期待的方式发生


    自我失望 自己没有按你期待的方式成长


    结论：人生的痛苦，大多来自 1.对别人的不满足；2.对事的不确定性；3.对自己的失望。归根结底，是来源于我自己无法掌控自己的情绪。


    不知道大家看了每一个人不爽的事情之后有没有一个什么感受，那我把它总结为这三点。我们的痛苦其实主要来自这三方面。首先是人际关系方面，你看我们的栏目里有很多都是说我的爱人不理解我，我老公跟我吵架，或者我的领导又怎么怎么对我，然后同事又怎么说我了，家人在跟我闹矛盾了，朋友又不理我之类的，人际关系的和谐是人痛苦的一个很大根源，甚至有些心理学家认为是最为最大的根源，比如说以研究自卑与超越而出名的个体心理学家阿德勒，他认为人最大的痛苦就是来自于人际关系的不和谐。


    第二大痛苦来自哪里呢？就是我们没有预料到的突发事件。比如说工作出现什么变故，让我们没有达成目标；家庭突然有人生病或者是谁去世了，或者孩子什么东西没有达到我的预测；或者是社会上发生什么突发事件，打乱我原先的工作或者生活节奏，比如说疫情来了；还有就是各种的杂事突然发生，让我们觉得特别心烦。


    第三个就是对自我失望，比如说身体上的、还有能力上的、性格上的、感情上的各方面的东西，觉得自己没有能够达到自己的预期目标，对自己不满意了。所以我们的痛苦主要来自于这三方面，人际关系、突发事件和自我失望。


    所以你会发现我们的多数痛苦是：第一个是别人没有按照你期待的方式来对待你，这个是人际关系的痛苦；第二个是事情没有按照你期待的方式发生或者发展，这个是突发事件带来的痛苦；第三个是你自己没有按照你期待的方式去成长，这个是你自己给自己带来的痛苦。综上我们就可以得到一个结论，你

