    那长远的关系的话，因为我做保险做了 12 年，在我们这个行业，我做了 22 年的保险了，我太太做到 14 年的保险了，我们加起来 36 年的保险。在广州友邦保险，比很多人的年龄还大。那截至今天为止，我们服务的客户不超过
