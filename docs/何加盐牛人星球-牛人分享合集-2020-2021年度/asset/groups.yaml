    struck 手段很复杂的企业，大家如果看碧桂园，恒大，他们那些可以发债的企业的报表，他会有永远债这个东西。这个永续债也是放在所有者权益里面，因为它可以一直延续，它不会说在短期内偿还。当然永续债是受特定
    的条件限制，有很严格的条件限制的情况下才可能成为永续债。所以一般情况下，投行或者是说投资者在看这些企业报表的时候，看它的净负债率的时候，会把永续债从这个所有者权益里面给你剔除，因为它并不属于真正意义上的企业的净资产积累。


