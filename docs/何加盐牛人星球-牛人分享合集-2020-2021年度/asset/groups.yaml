    ## 普通人应知应会的法律常识


    讲师：王鸽，中国海洋大学法学院法学硕士，研习法律七年，深耕律师行业十五年，现执业于山东睿能律师事务所（坐标青岛），任高级合伙人。王鸽律师的业务专长领域涵盖公司法律顾问、房地产开发及建设工程、海事海商等多个法律业务领域，长期为几十家大中型企业提供各类专业法律服务；每年代理大量诉讼案件及非诉讼法律事务，每年经手的案值数亿元，案件效果理想，深受客户好评。


    时间：2021 年 3 月


    ## 一、婚姻


    ### 1. 给出去的彩礼还可以要回来吗？彩礼在什么情况下可能会被要回去呢？


    #### 案例：2018 年刚高中毕业的小张南下打工，打工四年非常艰辛的积攒了四万元钱，2020 年小张在老家相中了一个姑娘，双方很快建立了恋爱关系，并在家人的催促下双方订婚，订婚时小张给姑娘家二万元彩礼，双方没有办理结婚登记手续，就在老家一起生活，但是随着小两口接触多了，感受原来越不好，双方感觉不适合在一起，要分开。但是双方在二万元彩礼金方面争议非常大，男方说这二万元赚的不容易，给女方这钱是为了结婚的，不结婚了彩礼钱必须退回，可女方说，婚结不成是两人都有责任，给彩礼是自愿赠与的，给予后不得反悔坚决不能退回的。那根据法律规定，彩礼是否要返还呢？


    #### 律师分析：


    彩礼的性质是一种民间习俗，首先，当地有这种风俗习惯。给付彩礼的行为可以视为是一种以结婚为生效条件的附条件的赠与行为，而不是一般的无偿赠与。如果双方缔结婚姻关系，赠与行为发生法律效力，彩礼属于受赠人所有。如果结婚不成，赠与行为则失去法律效力，彩礼应该返还给赠与人。如果在结婚之前，确从彩礼中有合理的支出，也应该酌情返还。


    #### 法律依据：


    2004 年 4 月 1 日施行的《最高人民法院关于适用《中华人民共和国民婚姻法》若干问题的解释（二）》第十条规定：当事人请求返还按照习俗给付的财力的，如果双方明属于以下情形的，人民法院应当予以支持：


    - （一）双方未办理结婚登记手续的；

    - （二）双方办理结婚登记手续但确未共同生活的；

    - （三）婚前给付并导致给付人生活困难的。


    律师提醒：


    婚约，是未婚男女对缔结婚姻关系的一种事先约定，自古以来，人们就把订立婚约作为婚姻成立的必经程序，订婚送彩礼更是世代相传的习俗。然而我国现行法律为尊重婚姻自由，不承认婚约的法律效力，所以当一方要求解除婚约时，彩礼的纠纷应然而生，当事一方也不能以另一方违反婚约而要求其承担违约责任。在《最高人民法院关于适用〈中华人民共和国民法典〉若干问题的解释（二）》第十条规定，在处理彩礼纠纷上有了依据和统一的标准。


    ### 2、婚前购房、婚后购房、婚前购房加名、婚后父母购房各种情况怎么分辨是夫妻共同财产还是个人财产？


    #### 第一类：婚前买房


    01 一人出资，结婚前取得房屋产权，房屋登记在出资方名下，并还清个人贷款或全款买房，这种房子法院会认定为出资方的个人财产。


    举例：你老公在你们结婚前，用自己挣的钱买了一套房子，登记在自己名下，并且是用全款，那么这套房子就归他个人所有，和你没有半毛钱关系。


    02 一人出资，结婚前已还清全部贷款，但婚后取得房产证，房屋登记在出资方名下，这种情况房子还是属于出资方的个人财产。


    03 一人出资，结婚前夫妻一方已支付房屋首付款，并向银行申请贷款，房屋登记在该方名下，婚后用夫妻共同财产还贷，这种认定为产权登记方的个人财产，夫妻二人共同支付的贷款及房屋相对应的财产增值部分属于共同财产；尚未偿还的贷款视为产权登记方的个人债务。


    举例：你老公婚前，用自己挣的钱付了首付，房子登记在自己名下，婚后你们两人一起还贷款，这种情况下，房子还是归你老公所有，只是在共同还款的部分及房产增值部分才和你有关系，如果贷款没有还完，那也只是你老公的个人债务，你俩离婚了，债主没有权利找你还钱。


    04 一人出资，房屋登记在非出资方名下，这种情况稍显复杂，通常会出现非出资方不具备购房条件，以对方名义购买，如果没有特殊情况，会视为以结婚为目的的赠与，按共同共有处理；如果有证据证明出资方明确表示归登记一方个人所有，则按产权登记方个人财产处理。


    举例：你老公婚前，因为自己没有资格，自己出钱用你的资格买了一套房，如果你们没有单独约定房产归属问题，那这房子就是你们共有，如果你们约定了房子归谁，那这房产权证登记在谁的名下就归谁，注意一点，你们的约定必须具备法律效力。


    05 双方出资，房屋产权登记在夫妻二人 PACKAGE 2020-2021 年度下，如果是同居生活期间买的房，按一般共有财产处理；如果是婚后买的，就认定为夫妻共同财产。


    简单解释一下，一般共有财产和夫妻共同财产在性质上没有太大区别，都是共同所有，只是主体不同，同居是一般公民关系，婚后则是夫妻关系，如果进行财产分割，夫妻关系就适用婚姻法，一般公民关系就没有婚姻法的限制。


    举例：你和你老公共同出资买了一套房，如果你们是在婚前（同居）时买的，那这套房子就是一般共有财产，假如离婚分割房产，有约定的，按约定来，没有约定或约定不明确的，按照出资额确定；不能确定出资额的，视为等额享有。如果是婚后买的，就是你们的夫妻共同财产，原则上一人一半。


    06 双方出资，房屋产权登记在夫、妻一人名下，同居生活期间购房，按一般共有财产处理；非同居生活期间购房，按照共同财产处理还是按照借款或赠与处理，视具体情况而定，法官综合考虑购房背景、出资数额等因素，以公平原则作出认定。


    #### 第二类：婚后买房


    01 以夫妻一方婚前个人财产购房，房屋登记在出资人名下，房屋是出资方个人婚前财产在婚后的转化，应认定为个人财产；若出资方只支付了首付款，房款尚未偿还部分及房屋增值部分应认定为夫妻共同财产。


    举例：你和你老公结婚后，你老公用自己以前的存款全款买了一套房，并且房子登记在你老公名下，那么这套房子就是你老公的个人财产；如果你老公只是用自己的存款付了首付，那剩下来还贷的以及房子增值的部分，就属于你们两个人的共同财产。


    02 以夫妻一方婚前个人财产购房，房屋登记在夫妻双方名下或非出资人名下，认定为夫妻共同财产。


    03 以夫妻共同财产买房，房屋登记在夫妻双方名下或夫妻一方名下，均视为夫妻共同财产。


    04 以夫妻共同财产买房，房屋登记在未成年子女名下，这种情况就要复杂一些，夫妻离婚时不能简单地完全按照登记情况将房屋认定为未成年子女的财产。


    法院重点审查夫妻双方在购买房屋时的真实意思表示。如果真实意思确实是将购买的房屋赠与未成年子女，离婚时应将该房屋认定为未成年子女的财产，由直接抚养未成年子女的一方暂时管理；如果真实意思并非将房屋赠与未成年子女，离婚时将该房屋作为夫妻共同财产处理。


    #### 第三类：父母出资买房


    01 一方父母出全部的买房钱，房子登记在出资方子女名下，这种就会认定为产权登记方的婚前个人财产。


    举例：你老公的父母在你俩结婚前，用自己的积蓄（全款）给让你老公买了一套房，并且房子是登记在你老公名下，那么这套房子就属于你老公个人所有。


    02 一方父母出钱付了房子的首付，房子登记在出资方子女名下，由夫妻二人共同还贷，离婚时一般将房产判归产权登记方所有，由该方支付剩余贷款。对婚内夫妻双方共同还贷（包括本金与利息）及房屋增值部分，由产权登记方对另一方进行补偿。


    举例：你老公的父母在你俩婚前首付给了 30 万，买了一套 100 万的房子，房产产权登记在你老公名下，贷款 70 万，过了 2 年，你们已经按揭了 20 万贷款，并且房子已经增值到
    200 万，这时你们因为某些原因要离婚，那么一般法院会把房子判给你老公，但是剩下的 50 万贷款就是你老公的个人债务，你们共同还贷的 20 万以及这 20
    万产生的收益，你老公要对你进行补偿。


    03 一方父母出钱付了房子的首付，房子登记在另一方子女名下，一般认定为夫妻共同财产。父母明确表示赠与登记方或夫妻双方或者有其他相关约定的除外。


    举例：你老公父母出首付给你们买了一套房子，房子登记在你的名下，如果你老公父母没有什么特殊要求，那么这套房子就是你们的夫妻共同财产；相反，如果你老父母明确要求是把房子赠与给你老公或者你们两个人或者其他情况的，就具体情况具体分析了。


    04 一方父母出钱付了房子的首付，房子登记在双方子女名下，一般认定为夫妻共同财产。若双方约定了共有方式及各自份额，则按照双方约定享有房屋产权。若双方对共有方式未进行约定，视为等份共有。


    05 双方父母均出资，登记在夫妻一方或双方名下，一般会认定为夫妻共同财产，父母的出资会认定为对各自子女的赠与。


    #### 总结


    在房产证加上几个名字，这件事很难判断谁对谁错，钱的确买不来爱情，但可以为爱情提供保障，而房子在有些女生心中，就是最好的爱情保障。


    愿天下有情人都能终成眷属，而不是收到金钱和房子。


    ## 二、民间借贷


    ### 1、借条和欠条的区别


    #### 1、定义作用不同


    借条：在借用关系中债务人向出借人开具的表明债务人有到期“还款赎条”的义务的借款凭证。借条代表的是一种借款合同关系。


    欠条：交易过后产生应付账款的一方（债务人）向债权人开具的证明其欠款事实同时表明开具人有到期“还款赎条”义务的凭证。欠条是对以往双方经济往来的一种结算，表明自欠条形成之日起双方之间形成的一种新的纯粹的债权债务关系。


    #### 2、性质不同


    借条：借条证明的是借债/借用关系，强调的是“借”字。


    欠条：欠条证明的是双方之间有债权债务关系，强调的是“欠”。


    #### 3、产生原因不同


    借条：借条是一份简易的借债/借用合同，它只能因“借”产生。做为重要证据，本似乎就能证明双方存在借贷关系，法律效力比较强。


    欠条：欠条是一种经济结算结果，它可以因借款产生、因买卖产生、因劳务产生、因赔偿产生很多原因都能产生欠条，所以它不能证明单纯是借贷关系。


    #### 4. 书写内容不同


    借条一般包括如下内容：“借条”名称、借款人名称、出借人名称、借款日期、借款事由、借款金额、借款期限、还款日期、利息、借款人签字盖章按手印、开具日期等。


    欠条一般包括如下内容：“欠条”名称、欠款人名称、被欠款人名称、欠款事由、欠款日期、欠款金额、还款日期、利息、欠款人签字盖章按手印、开具日期等。


    #### 5. 诉讼时效不同


    约定了还款时间的：


    借条和欠条有三年的诉讼时效，均从约定还款时间到期后开始计算。


    没有约定还款时间的：


    借条：从主张还款时开始计算，有三年诉讼时效。三年内再次主张还款时，诉讼时效重新开始计算，产生新的三年诉讼时效，以此计算最长可达到20年。


    欠条：从书写欠条之日算起，只有三年的诉讼时效。


    ### 2. 借条中约定或未约定利息时各种利息的计算方式


    问题 1：借贷双方没有约定借款期内利息，出借人能否主张借款期内利息？


    借条样式 1：现张三（借款人）因购买轿车资金不足，向李四（出借人）借到人民币 20000.00 元整（大写：贰万元）。还款期限 2015 年 12 月 31
    日前。


    答：不能，如果双方当事人在当初签写借条的时候没有明确的约定了借款利息的话，法院会认定出借人在借款期限内是不需要利息的，在起诉的时候再主张借款利息将无法获得法院的支持。


    提示：借款合同一定要约定利息。


    问题 2：借贷双方没有约定借款期内利息，也未约定逾期利息，出借人能否主张逾期利息？


    借条样式 2：现张三（借款人）因购买轿车资金不足，向李四（出借人）借到人民币 20000.00 元整（大写：贰万元）。还款期限 2019 年 12 月 31
    日前。实际情况是，在 2019 年 12 月 31 日前，张三并未依约还款。在 2020 年 8 月 30 日，张三才还清借款。那么李四是否可以主张 2020
    年 1 月 1 日至 2020 年 8 月 30 日期间的逾期利息呢？


    答：可以。

    提示：借条中未约定借期内利息和逾期利息，借款人没按期还款时，出借人可以向借款人主张逾期利息的。


    问题 3：借贷双方没有约定借期内利息，出借人主张逾期利息，利率应按多少计算？


    借条样式 3：现张三（借款人）因购买轿车资金不足，向李四（出借人）借到人民币 20000.00 元整（大写：贰万元）。还款期限 2019 年 12 月 31
    日前。实际情况是，在 2019 年 12 月 31 日前，张三并未依约还借款。在 2020 年 8 月 30 日，张三才还清借款。那么李四是否可以主张 2020
    年 1 月 1 日至 2020 年 8 月 30 日期间的逾期利息呢，利率应按多少计算呢？


    答：如果双方当事人没有在借条中没有约定利息，但是约定了还款期限，而借款人逾期归还，出借人可以按照全国银行间拆借中心公布的贷款市场报价利率（LPR）来计算逾期利息，这个是可以被法院支持的。


    问题 4：借贷双方没有约定借期内利息，但约定了逾期利息，能否主张逾期利息？逾期利息应按多少计算？


    借条样式 4：现张三（借款人）因购买轿车资金不足，向李四（出借人）借到人民币 100000.00 元整（大写：拾万元）。还款期限 2019 年 12 月 31
    日前。若张三不能按时还车，自 2020 年 1 月 1 日开始，张三应支付利息。


    借条样式 5：现张三（借款人）因购买轿车资金不足，向李四（出借人）借到人民币 100000.00 元整（大写：贰万元）。还款期限 2020 年 12 月 31
    日前。若张三不能按时还车，自 2020 年 1 月 1 日开始，张三应按全国银行间拆借中心公布的贷款市场报价利率（LPR）的四倍支付利息。


    实际情况是，在 2019 年 12 月 31 日前，张三并未依约偿还借款。

    在 2020 年 8 月 30 日，张三才还清借款。那么李四能否主张 2020 年 1 月 1 日至 2020 年 8 月 30 日期间的逾期利息？利率应按多少计算呢？


    答：可以主张逾期利息。但要注意逾期利息约定是否明确、是否合法。如借条样式 4 中，属于双方对逾期利息约定不明，此时应按全国银行间拆借中心公布的贷款市场报价利率（LPR）计算逾期利息。借条样式
    5 中，双方约定逾期利率为全国银行间拆借中心公布的贷款市场报价利率（LPR）的四倍支付利息。

