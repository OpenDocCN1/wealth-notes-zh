    ## 第四点是给予对方选择权。


    有时候想要说服一个人不要做某件事情很难，那这时不如给他充分的选择权，让他自己决定不做。


    举个例子，女儿有一次跟我说她不想上英语课，不想学英语，中国人为什么要说英语，她就是不要学。这时，如果我去跟她讲学英语多么有用，必须得学，她肯定听不进去。于是，我就笑着嘻嘻地说：“好啊，你可以不上英语课，但是如果去上学的话，学校有英语课你又没法不上，要不然这样吧，你不去上学了，咱就在家里呆着，自己想学什么就学什么，完全自己做主，多好啊！”女儿一下子懵了，默默地走了开。过了之后，她跑过来，扭扭捏捏地跟我说：“妈妈，我想了一下，我还是去上学吧，学英语其实也没那么难以忍受”。


    ## 第五点是把自己的目的转化为对方的利益。


    这个意思是说我们在说服他人的时候要从能给对方带来什么好处的角度去说。比如，你想结交一位牛人，第一次给他发消息，不要光想着我希望能够认识你，我需要你的帮助，而是要告诉他我能为你做什么，我能为你提供哪些价值。


    不要觉得大佬们这么厉害，我这么普通能为他做什么，大佬也是人，他们的需求跟我们并没有太大的区别，都符合马斯洛的需求理论。


    关于马斯洛的需求理论，有些人对它的理解可能有误区，以为都是先满足了下面低层次的需求才会产生高层次的需求，其实不是这样的，这些需求是同时的，没有先后之分，不然我们没法解释会出现雷锋。有些人他自我实现的需求已经得到了充分的满足，那么他对于生理的、安全的这些低层次的需求的要求就没那么高了。


    对于大佬来说，告诉他你能为他带来什么价值，对方才会有想要和你结交的动力。


    再比如，我想催客户尽快敲定合作，尽快付款。我会告诉他“我要帮顾问的时间，咱这边如果能够稳定下来的话我把能力最好最有经验的顾问留给这个项目，如果拖得久了，他们都去别的项目了。”当然，我说的这些话都是真的，这是前提。这样在对方听起来就是在为他们考虑，催合作、催款这件原本比较尴尬的事情也变成了是对对方利益的关心。


    ## 第六点是对对方说出结论。


    也就是说某件事情你心中已经有了观点和结论，但在沟通的过程中先不要急于亮出，而是用询问、讨论、引导的方式，让结论从对方的嘴里说出来。这样做的目的，是为了让对方深刻理解并认同这个结论，能够坚决地去维护和执行。因为结论是他自己得出的嘛！人不会自打嘴巴的。


    这一点我们在咨询过程中是最常用的，比如我们会让甲方的关键人员参与我们方案的讨论中，最后做出的方案，对方一定是赞同的，因为这个方案是我们共同得出的。甚至他还会转化为我们的沟通员，帮我们去说服内部有不同意见的其他人。在我们管理团队的时候也是非常好用的，要让大家对公司的重要决策有参与感，自己参与做出的决策，执行的力度是更好的。


    ## 第七点是善用沉默。


    有时候并不一定非得说话才能达到想要的效果。偶尔的沉默可能效果更好。我记得在女儿3、4岁的时候，有一次，她和小朋友一起玩，小朋友抢了她的玩具，她一把夺过来，很凶地冲对方喊：“谁都许碰我的小蟹，谁碰我就打他！”她一边吼，还一边用余光打量我的反应。我没有说话，只是深深地看了她一眼，然后就走开了。女儿就上发脾气了，追上来问我：“妈妈，你怎么没反应？我刚刚说你怎么没反应？你现在在想什么？”其实她知道自己那样的行为是不对的，只是没法控制情绪，而这个时候她的气愤已经完全转移了。


    这点也可以用于商务谈判中，当双方因为某些条款僵持不下的时候，如果你足够沉得住气，先晾对方一两天，对方着急了，有些条件自然就松口了。当然，要慎用，前提是你对形势有充分的把握，确定对方肯定会跟你合作或者即使不合作也没什么大的影响。


    ## 第八点是请示“领导”。


    什么意思呢？也就是说在沟通中，不要告诉对方我对这件事情有最终的决策权，我必须要去请示“领导”。如果你自己就是公司的CEO，那么你还可以说要去说服团队或者合伙人。为什么要这样做呢？因为如果对方知道只要说服了你，交易就能够达成，那么你就已经把自己放在了一个非常不利的位置上。而当你表示结果需要“请示领导”时，他会意识到只能拿出更优惠的条件，你才有可能愿意去说服领导。这样你的弹性空间也会更大，议价能力也会更高。


    我还是先用生活中的例子来说明，比如，儿子缠着我要我给他买玩具，如果我告诉他只要说服我，我就可以给他买，那么他很容易就能达成目的了，比如撒娇，卖萌，甜言蜜语哄我开心。而我告诉他：“爸爸同意才能买”，那这个时候他可能就要掂量一下了，爸爸可一定吃他这一套，自己有没有胆量去说服爸爸。或许这个玩具他就不要了。


    再比如，公司需要购买一个招揽的年度服务，销售员给我报的价格虚高，我自己跟他谈一轮下来，价格已经降了一部分，但我知道还是有空间的，这时刻我告诉他，你再优惠一点我去请示领导，他多半会再降一点价，请示完领导，我又告诉他，领导觉得价格还是高了，再降
    1000 元，或者再赠送 1000 个代金币我们就定了，不然就选竞争对手的套餐了。那这个时刻多半会成功。


    好了，不知不觉就讲这么多了，沟通的技巧还有很多，沟通的内容也不仅限于说话和文字，还包括肢体语言等等。我会推荐几本书，大家感兴趣的可以去看一下。


    上面虽然讲了很多的技巧，其实都还只是“术”的层面，最后我想强调的是沟通的“道”，那就是真诚以及为他人着想。所有的技巧都是建立在真诚并且真心为对方考虑的基础上的，这也是我这些年来能够得到很多信任的最根本的原因。


    另外，我还想强调一下，夫妻之间、家人之间经常说废话是很有必要的，我曾经看过一句话“所谓知己，就是那个愿意听你说废话的人”，深以为然。现代社会大家工作压力都比较大，都很忙碌，不知不觉效率就变成了重要的衡量标准，职场里说话做事的效率也带到了家里，经常会出现听到另一半或者孩子说一些无关紧要的话题就不耐烦，甚不愿意听的情景，觉得我还有很多事情要处理呢，哪有时间听你说废话。其实，你不听就是堵住了沟通的纽带，把跟他成为知己的机会拱手让给了别人。损失的又何止是那么一点点时间？


    我今天的分享就到这里了，感谢大家的聆听。希望能够对大家有所启发。也希望大家新的一年里星球能够有所成长和进步。


    ## 非财务专业人士怎样迅速看懂财务报表


    分享者：王爱莉，中国注册会计师，注册税务师，高级会计师，会计学副教授，拥有 20 年一线财税实战经验，从收银员、仓管做起，曾在多家酒店集团和地产集团担任副总裁、财务中心总经理等职务，对财务管理有深入研究和丰富实践，在资本运作、股权并购、税务筹划和重大投资靠方面均有多项成功案例，现在是一名自由投资人和财务咨询师，担任多家房地产、酒店、科募股权基金、体检中心财税顾问。


    分享时间：2020 年 8 月


    大家好，我是王爱莉，今天就由我来和大家一起学习如何看懂财务报表。在正式上课之前呢，我先跟大家聊一聊与本节课相关的话题。


    我先介绍一下我本人，我今年 40 岁，在初中的第五年，我读了一所财会类中等学校，因此我 19 岁中专毕业，也就是你们的高中毕业。因为我在中专玩了三年，所以毕业以后我就只能去酒店做收银员，后来又做了一段时间仓管。当然，我也是从九九年，我毕业的那一年开始真正的来学会计，我这一学就是
    20 年。


    这过去的 20 年让我明白了一个道理，就是财务专业门槛非常低，一个庸人都可以干。正是因為我明白了这个道理，又想着我做学生的时候太混蛋了，所以我对自己的要求是，即使是在一个白痴都舍会干的财务行业里，我也要做一个不一样的人，我要洗刷我做分母的命运。所以连我这样的人都可以财税道路上走到今天，你们就更不用提了。


    2009 年到 2011 年，我做过三年财税讲师，当时我的学生是税务系统的工作人员，是企业的财务总监，我从那个时候知道我的行业人员极其相似，我永远都是女性朋友更多，更受女性朋友欢迎。同样的，我也永远都是更受同行欢迎，我的粉丝多半来自同行的财税专业人士。所以今天我不知道我的分享是否能够接受非财税人士你们的检验，我很忐忑。


    今天是我第一次面对非财税人士，我的压力很大，一直不知道该怎么讲是好。何加盐老师跟我商量课讲时间，我说就定 7 月 13 号吧，因为北京奥运成功是 2001
    年的 7 月 13 号那天。今天这次分享我没有写课件，没有做 PPT。我的想法是我就像平时跟我的老板、客户、顾问单位、银行、资金方、投资方、税务部门和政府部门汇报、安排工作一样，来领着大家把财务报表看一遍。我的目标是让所有人都能看懂财务报表，真正的把财务当工具使用，就像我们的手机和电脑一样，深入到我们的生活中，为我们的生活和工作保驾护航。


    何加盐老师本來最开始给我讲的课题是：普通人应知道会的财务知识。他这个想法真的很好，作为一个专门研究牛人的公众号，作者同样也是经济管理类专业出身，有多年企业咨询经验的老师，他的关注点很准，很实用。我想了想，普通人应应会的财务知识，其实是一个系列的问题，但是我想从看懂财务报表开始。因为在我看来，懂财务报表就是自己打开了一扇门窗，通过这个窗口，我们可以看到一个企业更大更远的世界。


    今天我就重点告诉大家如何看懂财务报表。通常来说，财务报表有三个主表和一个附表，还有一个附注组成。这四个内容，在财务报表中的地位同等重要。我把三个主表先发上来。另外一个附表是所有者权益变动表，这个表呢，相信大家也能看懂，你只要能看懂前面三张报表，后面一张表就非常容易了。


    我建议大家用电脑把这个 PDF 文件打开，我会按照顺序来讲。这三张主表分别是资产负债表、利润表和现金流量表。这个资产负债表有一句话说它是资本主义最伟大的发明，我觉得它有它的道理，今天大家听完我的课程可以感受一下。


    我先从资产负债表讲起，大家打开这三张主表第一个资产负债表。资产负债表大家看一下，它是左右结构。左边最下方有一个资产总计，所以左边反映的所有情况都是资产类的，右边是负债，最下方有负债和所有者权益总计。关于资产负债表这个表呢，我想大家都有可能听说过它是一个平衡表。大家会经常讲这个报表平不平，指的是资产总计等不等于负债和所有者权益总计的意思。这个报表呢，它还有一个特点，你看我列的时间，2019
    年 9 月 30 号。这说明什么呢？这个报表它是一个时点性的，它是截止到哪一天的报表。我们可以对照下面的表看，大家把表拉到下面，有个利润表。利润表上面写的日期是
    2019 年 9 月。这个 2019 年 9 月，它其实是一个期间，是一个月的 情况，而资产负债表是某一日的情况。利润表正常来说企业按年编一次 就可以 了，一般中小民营企业按年编一次，有一些上市公司，或者公司稍微大
    一点的话，都是按月编。


    这三张表它们之间有一些勾稽关系，为什么 right 在这里提到它们三个表之间的 勾稽关系呢？其实是这样的，假如说有一个人他跟你介绍一个项目，说这个项 目怎么样啊。你可能会说那你把你的财务报表拿给我看一看，他为
    了吸引投 资者，有可能会在财务报表上粉饰一下。或者说跟资方在谈一个项目的时 候，我们肯定不能拿一个很差很差的报表给他。当然不是说做假报表，而是做 一些相应的调整，但是有的时候有人在调整报表的时候就脱离事实了，犯一
    些非常低端的错误。


    那作为一个外行人，你如何看懂他这个报表缉在那里呢？比如说把这个报 表翻 看下来，资产负债表的右下角有一个所有者权益，这里有个未分配利润，这 个未分配利润本身是取自于利润表下面的净利润，当然它不是简单的就直接等
    于这个数，它是有加加减减的，所以报表之间其实是有勾稽关系的。


    然后再翻到下面的现金流量表补充资料，上面有一个 38 行净净利润，其 实这个净利润它就和利润表的净利润是同样的，然后和资产负债表的未分配利 润，它们之间是有一定的勾稽关系。


    你比如说现金流量表上有净利润这一栏，其实这个数呢，不是我们填上去 的，它是加加减减以后自动生成的。取数自动生成以后，这个利润表里面的净 利润它是根据上面收入减成本算出来的。同时呢，这个未分配利润又根据净
    利润取数得出来的，这个我等一下再讲。还有你的净资产余额是多少，它主要 体现的是某个时间点的余额，就是你这个企业此刻此 creatures 的财务状况。


    我先说下这三张表的功能，资产负债表它反映一个企业财务状况的。什 么叫一个企业的财务状况呢？就比如说这个企业，它的资产负债率怎么样，有 人会听说它的资金链要断裂了，或者它财务杠杆比较大，或者公司的资金流动
    性很大很差，或者说它是重资产运营还是轻资产运营，这些情况就可以通过资 产负债表来看得到。像经常我们听到的一些比率，比如资产负债率、流动比率、 净资产负债率，这些数其实都是从资产负债表里取数得出来的。它是反映某一
    个时点，比如说一个月的最末那一天的余额，比如说你这个企业，现在你的资产余额是多少，你的负债余额是多少？利润表是反映企业某一个时段，某一个期间的经营成果的。你是亏损还是盈利的，你这一个月或者一个季度，你的收入怎么样，你成本怎么样，你的利润怎么样，是否有亏损。它是对某一段，某一个期间时段的经营成果的反映。


    然后现金流量表它也是针对某一个时段的，比如说某一个时段你的现金流怎么样。现金流量表又分了三个部分，大家看着这个现金流量表，它有一个经营活动产生的现金流量，投资活动产生的现金流量和筹资活动产生的现金流量。这个是什么意思呢？比如说经营活动产生的现金流量，这个数正常来说是一个正数，比较合适。


    为什么我说是经营活动产生的现金流量是一个正数比较合适呢？是正数就说明这个企业还是正常的经营，它的销售回款是良性的，比如说它这个收入都是现收，产生了现金流，而不是更多的账款。它的经营方面，现金流入是正数，大于它的经营方面的现金流出，就说明这个企业还是正常的。比如说它日常运营，你每天所产生的收入是有正的现金流，不说你产生了这么多收入，但你钱全部没收上来，反而你还要投很多钱进去，你的本钱在这个时候就是负数。所以这个时候你的经营活动这一块儿，现金流量不能说是良性的。


    现金流量表的第二部分，“投资活动产生的现金流量”要看企业的发阶段，比如说企业正在初始阶段，正在扩张的阶段，投资活动产生的现金流量正常来说是负数才对。为什么呢，投资就是你对外的投资比较多的时候，你的现金支出就比较大，当你只有处置你的投资的时候，你才会产生正的现金流。如果说你一直在卖变资产，你在处置你的投资款，那这个时候你就是正的现金流，这样的话这个企业就是在收缩它的投资。当然这个不能说完全看企业的发阶段，这个根据企业的战略规划也有很大关系，但是呢，这个现金流的正负可以说明一些问题。第三个是筹资活动产生的现金流。筹资活动产生的现金流如果说是正数，那小编就说明企业这段时间融资效率比较
    好，如果说是负数，就说明这段时间可能偿还了很多的债务，或者说很多投资者退出。因为我们的融资手段不一定只是借款，还可能是债务融资，股本融资。比如说资本融资，我们吸收一些投资者进来，那如果说这个数是负数，只能说明两个方面问题。第一个我我们阶段
    debt 成本金比较多，也就说我们到期债务很多，还有一个原因，就是我们有很多投资者退出。


    下面我接着讲一下这三个表，平时我们有听到说中期财务报表，或者是说年度财务报表，这个是什么意义呢？中期财务报表一般指的是小于一个年度，它都叫中期财务报表，比如说月报、季报、半年报，这都叫中期财务报表。年报就是指一个年度的，正常情况在在国内这个年表就是一个自然年度，指的是
    1 月 1 号到 12 月 31 号，这一个年度内的财报。但是这一一个年度的财报它又有这三个表。在中国大陆，资产负债表的报表截止时点永远是 12 月 31
    号，这一个时点它的财务状况。利润表和现金流量表反映的就是那一个年度的 12 月份的数据。


    有很多香港的企业，或者说内地在香港上市的企业，他们的年报是从今年的七月份到下一年度的六月份为一个集束。我们这边内地的投资者看的都是自然年度，平时到半年的时侯，他要专门做一个港报，要做调整。像恒大健康，就有这样的情况，他们从七月份要编年报到第二年的六月份，要重新做一份报表。但是后来恒大把恒大健康收购了以后，他也重新改用大陆这个自然年度了，也都是从一月份到十二月份为一个自然年度的年报。平时呢，也是大陆的做法，就是月报、季报和半年报。


    说完这些，我领着大家看一下资产负债表。这个资产负债表是这样的，它是左右结构，然后上下的顺序。这个上下排序的顺序是按流动性来排列的，流动性从强到弱，流动性强的叫流动资产排在最前列，流动性弱的叫非流动资产，也就是所谓的长期资产，它们排在下边。同样，在报表的右边，上面是反映的负债，下边是所有者权益，其实它也是按照流动性来排列的。包括负债类也是从流动负债到非流动负债，所谓的非流动负债指的是长期负债。然后下面所有者权益。其实流动性也很差，流动性越差的排在后面。当然，这个不是说流动性差的就是差，不是不是这个意思，只是报表这种语言反应方式。


    那区 分流动性是怎么区分呢？一般情况下以年为界限，比如说资产类，你是准备在一年内变现的资产，在一年内处置的资产，在一年内变更消耗，用掉的资产，一般情况下就叫流动资产。超过一年的一般都叫非流动资产。然后负债类也是，在一年内要偿还的，就叫流动负债，超过一年的负债就叫非流动负债。


    那同样的我们可以想一下，所有的者权益它的流动性最差，所以它排在最下面。所有者权益是属于企业所有者的净资产，是企业享有的权益，是所有的资产补偿负债以后的净资产。


    那么我们现在就来详细地看一下资产负债表，刚才我介绍的这个结构就是按流动性排序，然后左边是资产，后边是负债和所有者权益。在最开始我有说过这个报表是一个平衡表，我们会计讲究恒等式的原则。恒等式原则最主要的体现，就是在资产负债表上，资产负债表的左边一定要等于右边。有的时候我帮一些企业做财务尽调的时候，我这个时候就会去看他的报表，首先他的报表有时候都会犯非常低端的错误，甚至这两边资产不等于负债加所有者权益。这里我可以跟大家讲一下，无论一个企业它在任何情况下都不可能出现资产不等于负债加所有者权益。如果存在，那一定是错了。那为什么这么说呢？大家可以想一个问题，一个企业的资产是从哪里来的，要么就是我借钱形成了负债，是我借钱买来的，或者我向别人借来的。我向别人借来的，我的资产增加的同时我的负债也增加了，那我向别人借钱来购置资产的同时，我也是资产增加的，同时我的负债也增加了。然后我的资产的另一部分来源，有可能是我企业本身的积累，就是净资产所有者权益，所有者权益顾名思义属于企业所有者的权利和利益。


    大家看一下所有者权益都包括了什么？第一个实收资本，实收资本也叫股本，这两个在同一个项目。他俩的性质是一样的。但是为什么会有不同的称呼呢？就是非上市企业跟上市企业的区别。非上市企业叫实收资本，上市的企业叫股本。


    为什么呢？我举一个例子，现在的企业一般情况都是认缴制，就是对于你的资本金，规定一定的年限，你在什么时候交足就行了，你的注册资本金什么时候你注。像现在这种情况，国家鼓励创业。我们随便一个人都可以注册。从哪些方面可以看到国家鼓励创业呢？首先从税收上，比如说月销售额不到10万，不用交税。你想一下，如果月收入10万块钱不用交税，比你打工强吧。然后呢，他不用交税啊，这个在以前是不可能的，这也是刚刚开始没多久。除了税收鼓励以外呢，另外他在在这个资本金上也是放宽了限制。以前必须采用的是

    '
