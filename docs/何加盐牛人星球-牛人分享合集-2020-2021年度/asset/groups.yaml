    1 元，你这里如果说是五千万注册资本，股本如果是五千万，你就是有 5000 万股，每股面值 1 元。如果说以后这个股价上涨了，或者你买卖来去，到二级市场流通啦，你可能股本溢价了。假如说现在你这个股票面值是
