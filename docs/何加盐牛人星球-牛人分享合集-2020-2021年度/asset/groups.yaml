    我们有的家长还会把孩子当成一个盆景，给照顾的特别好，雕琢的也很好，看起来这个行为习惯也很好，但是呢，因为它的根扎在土盆儿里，它的格局不大，所以未来就会有三年级现象、五年级现象、初中一年级现象、初中三年级现象。原来学习很好，很听话的孩子考了一个不错的学校，并且进入了实验快班。结果呢，成绩一落千丈，最后甚至厌学。


    这些对我们孩子的认识都是错误的。孩子是一颗带着天然使命的种子。每个孩子都是不同的种子，你不能要求所有孩子都有毛竹这样的生长速度。如果我们的孩子是橡树，你想让他像毛竹一样，早早就表现出耿聪慧，那是不可能的，就像你不能要求夜来香的种子散发出荷花的清香。


    当意识到孩子是一颗种子的时侯，就改变了教育最主要的认知。我们会觉得教育不是以家长为主，教育应该是以孩子为主，教育是以孩子为主体。这就涉及到我们心法的第一个，叫：事无好坏，诠释在人。


    因为生命的成长是孩子本身的事，他带着他天生的天赋和使命，他有自己热爱的领域。我们家长在这个过程中只能引导，只能是一个助推者，而不是一个操控者，甚至更不是一个全局的把握者。


    有了这个想法之后，再面对孩子的时候，我们就不是按照自己的规划蓝图来设计孩子的走向。我们就不会因为孩子没有按照我们的规划走而感到焦虑，我们就不会觉得我们的孩子怎么不如隔壁家的小明呢？我们就不会否定、数落、抱怨、威胁我们的孩子。我们就会发现我们孩子身上也有非常多的优点。我们就会了解一个生命的成长，有他自己的道路，有他萌发的节奏。


    在教育孩子过程中，我们作为一个引导者，要有一个全局性的了解。这就涉及到我开始给大家讲的教育的目的。


    教育到底是什么？教育的目的是为了开发人性。我把教育比喻成是一个生命的重新疆活操作系统。老天让人生在天地间，有了身体，有了生命，同时还要有他的慧命。那么这个慧命如何来启动？就像我们计算机有了硬件之后还有内驱，还有软件。其实呢，教育就是内驱，能够驱动我们的软件，能够重构我们的生命，让我们的生命能够去发现自己的使命，践行自己的使命，能够去达成自己，利益他人。所以，教育可以总结成四个字：长善救失。你要去长养善的东西，你要去救助生命中容易走偏的地方。就像小树长了枝桠之后，我们要及时的去把它修剪掉。


    在这个过程中，我们要引导孩子，是因为现在跟孩子在一起的时间很少，我们的孩子已经没有了我们过去成长的自然环境、社会环境。我们的社会价值观已经发生了非常多的变化。所以，我们更多的是靠语言跟孩子进行相关的交流。因此，我们就要求用好语言这种工具。这里边就涉及到我们所说的第二个心法叫：表扬，是为了未来不依赖表扬。


    现在有很多教育方面的书籍告诉我们，好孩子都是夸出来的你要求怎么善于表扬孩子。所以，当孩子做点儿什么事情的时候，我们家长都会说：“啊，你真棒，孩子你太厉害了”。结果，我们的孩子上了学之后，老师不表扬他，他就很生气。当别人夺去了他的光芒，他就要配毒药把别人毒死。


    想做到“表扬是为了不表扬”，就需要说话有技巧。这个涉及到我给大家分享的五个招法。


    ### 招法一：让孩子先做好，我们再长善。


    一个好的家长，智慧的家长善于看到孩子身上的闪光点。也有很多家长说：“我怎么觉得我们家孩子没有什么优点吗？”我们经常会跟家长说，你要像在鸡蛋白里挑骨头一样去找他的优点。如果没有优点，那么还有一种方法可以让他展现优点。比如说，你让他帮你拿一双鞋，他拿来之后你就跟他讲“孩子呀，你真贴心。你看，妈妈让你拿双鞋，你拿无怨言的就拿来了。而且，拿鞋的过程中你很小心细致，另外，你把鞋拿到妈妈身边的时候你摆的这么正，证明你做事特别有规律。”长善，先让他做好，然后再长善。甚至等家人回来的时候，你就跟家人大张旗鼓的讲，今天我让孩子给我拿鞋，孩子拿鞋的这个过程中板板正正摆到我面前，这叫当众长善。


    通过这样的方法就会激发出孩子身上更多这样的优点。我们知道，植物生长的过程中，有一个规律叫顶端优势。世曝阳光越多的地方，它长得就越多。从心理学角度有一个概念叫聚焦优势。你在哪个地方聚焦，它就会呈现哪一个。而我们现在的家长说的基本都是否定的东西，你怎么不行，你怎么不听话。所以，我们的孩子呈现给你双倍的否定。


    ### 招法二：表扬孩子，用“你就是”。


    第二个招法就是使用表扬的通用句式。表扬的时候，我们说：“你真棒，你太厉害了。”这样的话其实是不对的。为什么不对呢？是因为你在这么表扬的时候，就意味着他此前不棒，此前不优秀。你是用上帝视角来表扬他，他只能匍匐在你面前。我们的第二心法是：表扬，是为了未来不依赖表扬。所以，我们在表扬的时候可以换一种句式，叫“你就是”。比如说，他战胜了自己的恐惧。你就说，你就是一个勇敢的孩子，这么难的事，妈妈都不敢面对，你却勇于面对；你就是一个细心的孩子，妈妈都没有注意到事情，你替妈妈看着了，有效的提醒了妈妈；你就是一个善解人意的孩子、你就是一个智慧无穷的孩子，你就是一个眼光长远的孩子；你就是一个干净整洁的孩子…用“你就是”来替换“你真棒”，“你很厉害”，是因为我们把对事的关注变成了对人的关注。


    我们现在的家长更多的是对事儿的关注。比如说，孩子考了多少分？孩子在学校里乖不乖？其实，你根本就没有关注到孩子本身，孩子就会觉得我妈妈


    关注的只是分数，根本不关心我这个人，那么他内心的营养就匮乏。我们说一个生命的成长，它包括生理的成长，心理的成长和性理的成长。生理的成长我们大家都知道，就是身体层面上要健康。心理方面的成长，它需要有安全感、归属感、价值感，需要有爱的滋养。但我们的孩子总被否定，总被物化。所以，普遍心理营养匮乏。性理方面，就是说这个孩子知道为什么而活，知道人可以达到什么样的高度，这是对孩子慧命、智慧的引领。这就涉及到我今天要跟大家分享的第三个心法：教育孩子有三种层次。


    最低层次是经营孩子知识的层次。再往上一个层次是经营孩子习惯的层次。很多家长帮助孩子养成许多习惯，这些习惯很好，但这些习惯都是外部控制的，都不是孩子发自内心的。经营孩子最高的层次叫经营感受。你会发现有许多事情，你也跟孩子说了很多遍，他都不愿意去做。但你给他手机，他刷起抖音就没完。为什么会这样呢？因为，孩子不会因为你说的对错而去做一件事情，他只会因为自己感觉好而去做一件事情。大家注意这句话吗，他只会因为感觉好而去做一件事情。家长想让孩子朝哪些方面发展，我们就要让孩子在这个方面能够感觉好。那他自然就会往那个方面去发展。那些学霸之所以愿意学习，是因为学习能够给他们带来荣耀，能够给他们带来快乐，能够让他们感觉好。要想让孩子感觉好，就涉及到我们五个招法里的另外三个招法。


    ### 招法三：把“你句式”替换成“我句式”。


    比如说婆媳之间，老人给孩子吃糖，妈妈看到了之后就会说：“啊，妈，你怎么又给孩子吃糖呢？那牙不坏了吗？你怎么总是这样啊？”老人一听就很生气：“我也是为孩子好，还不是为了让他长身体吗？”然后，两个人就争执起来了。老人就说：“我帮你做饭、收拾卫生，我帮你干这么多活儿，我没有功劳还有苦劳呢。”这个就是你句式，你怎么怎么样，其实，那是指向别人，这是在指责别人。换成“我句式”的说法就是：“妈，我知道你给孩子糖，是为了让孩子多吸收一些营养，但吃糖对他牙齿不好，我是担心他未来牙齿不好之后，对他的身体持续健康有影响。我相信，妈你也不想让这个孩子有一口坏牙。”这么一说，我相信老人一定能够听得进去。又比如说，孩子写作业，写一下，在那玩一会儿，摆弄摆弄手指。一般的父母就会说，你怎么又不专心？你怎么总是三心二意的？其实，换成我句式就是：“我小的时候呢，做一件什么事儿也很难


    的，需要坚持很长时间。但是呢，我希望你能够快速的写完。完毕，我们有时时间可以一起做个游戏吗。”这样的话，孩子听起来感觉也会好很多。


    ### 招法四：经常对孩子表达崇拜，这个太**了，你是怎么做到的呀！


    这个招法对男人和女人，对老公、对妻子都有强大的杀伤力，大家可以用一下。比如说，孩子帮你拎一个东西，可以这样表达：“哎呀，这个东西这么沉，你都能够轻巧地把它拿上来，你是怎么做到的呀？”眼睛盯着他，表达出来崇拜的目光，配上这样的语言，孩子自然就会信心满满。比如说，你不在家的时候，你老公帮你做了家务，你直接说老公做家务这件事情，会让男人特别没有面子。换种说法就不一样了：“老公，你把家收拾的这么干净，你是怎么做到的呀？”你放心，如果再有时间的话，你老公还会帮你收拾家务。


    ### 招法五：在家里读点有营养的。


    家长是孩子的起跑线，家庭是孩子的首任学校。那么，家庭的氛围对孩子的教育成长至关重要。中国过去是有家庭传承的，过很重要。中国过去是有家庭传承的，过去中国的教育叫三堂教育，有学堂、有中堂、有祠堂。古人有自己的家风传承，但今天我们受市场经济的影响，受了西方教育流派的影响，我们都已经把我们优秀的中华民族的教育传统遗失了。


    曾经有一位老师，他是做演讲的，是一位德高望重的老师。他曾经就讲到，他们在家里的时侯，他跟他的爱人就会经常谈论时尚报上的一些好的产品，又出现的创新品牌。结果，他的女儿就从事了这样的行业，并且，有着非常高的艺术鉴赏品味。


    我还有一个朋友是做教育的，她不仅获得了黑龙江省三八红旗手的称号，做的创新教育也受到过中央电视台的报道。她曾经就讲到，她是一个军人家庭出身，父母在她小的时候，家里就定参考消息。她从小的时候就看《参考消息》，长大了之后也在坚持看这个。对家庭来说，这就是有营养的东西。大家想一下，看《参考消息》长大的孩子，她的眼界，格局会是什么样的？


    中国的胎早教也有一个最好的方式，就是我们可以在网上买一个读经机，或者自己拷贝一本经典在家里播放。尤其是孩子零岁到三岁的时候，他的大脑是海绵式吸收。然后，用进废退，大脑的规律是印刻印象。印刻印象就是，他最早接触了什么，他就会对什么感兴趣。这个时候在家里面不断地播放，就会让


    我们的孩子得到了熏修。相当于我们把音乐厅放到了家里，把博物馆放到了家里，相当于请了多国的外教来教孩子的外语，相当于让孩子与我们的古圣先贤往来与对话，自然就会扩展他们的心胸和人生的格局。


    教育的话题是一个非常广大的话题。刚才给大家简单分享了我一个教育模型叫 551105533311 系统。第一个五是影响教育结果的五种因素。从远往近分别是，人力所不能理解的因素、遗传的因素、社会因素、家庭氛围的因素、家庭教育手法因素。一个教育工作者只能解决两个半因素，分别是教会家长好的教育手法，让家庭形成好的氛围，进而通过家庭带动社区，带动社会风气的改善。


    为了让大家有更好的教育手法，我跟大家分享了教育的三个心法和五个招法。第二個五是五种教育。从近往远分别是家庭教育、社会教育、学校教育、自我教育和道徳教育。我们家庭教育的目的是为了让这个孩子自理、自立，有自我。为了让他开启自我，进而去进行自己的道德教育。我们的第一个1就是要把孩子看成一颗种子。它带有自己天然的使命，有自己萌发的周期。所以家长需要多引导、多陪伴，但是不操控，不焦虑。中间的10就是告诉大家，我们作为一个生命，它有现实性，也有超越性。人可以不断地去进步，也可以被物质不断地吸引、堕落。我们的生命就应该像一个十字打开一样，既有生命成长的全程性，要做好相关的规划。生命成长又有全幅性。就像《论语》说的那样，我们要志于道，据于德，依于仁，游于艺。而不仅仅限于物欲的层面，让我们离道德越来越远。


    教育是“就人性开发人性”的一个伟大工程。教育是为我们的生命重新驱动系统的一个专业性极强的技术工作。教育一定要有方向，想去北京看天安门，就一定不能买去哈尔滨的票。教育需要有很好的知识系统支撑。你要知道，要想达到更高的效率，更快的速度，除了步行、牛车、还有汽车、飞机。你要懂得为你的孩子插上能够腾飞的翅膀。


    在此，衷心的预祝我们的星友们，都能够做好教育，掌握好孩子教育的成长关键期。零岁到三岁大脑发育百分之六十，三岁到六岁发育百分之二十，六岁到十三岁发育百分之十，十三岁直至去世又发育百分之十。如果你孩子还在成长的关键期，就一定要抓住机会。如果你孩子已经超过了关键期，也不

