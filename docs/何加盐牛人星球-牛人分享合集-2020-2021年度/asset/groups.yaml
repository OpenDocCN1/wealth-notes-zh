  - '[PAGE 158]


    科学验证，哈佛也做了一些科学研究，ted 上都能查到。8 周就可以改变大脑的思维习惯，甚至改变海马体和杏仁核的结构。


    我的学生经常会问这样一个问题：鹏飞老师，既然人活在当下，全然的关注当下就行，那为什么要计划？为什么要设立目标？这个问题应该怎么回答呢？


    我认为教育的问题，就是让我们每个人都朝着一个方向去想问题。比如什么叫好，什么叫坏？什么叫挣得多？什么叫挣得少？什么叫有目标？什么叫没有目标？什么叫成功？什么叫失败？什么叫中年危机？什么叫大器晚成？什么人
    30 岁就可以获得人生的巅峰？什么人 40 岁可能会被企业裁掉？整个教育的逻辑都是在评判中、判断中、框架中、限制中、匮乏中进行的。所以我们所有的人思考问题都在想缺什么，怕什么？


    你有目标，有欲望，有想法，很多时候并不来自于你爱什么，并不来自于你感觉好的那个是什么，而是你现在没有什么，你缺什么？大家有没有发现，其实我们中国人从小的家庭教育观就是来自于匮乏和恐惧，你没有的才要去努力，你落后的才要去追赶。因为你怕失败，所以才要学习。你怕被淘汰，所以才要奋斗。恐惧、匮乏，说来说去就是这两个词，这就是教育的悲剧。


    有著严谨科学作风的积极心理学创始人塞里格曼教授说过，如果我们把角度转变成出于爱、热情和感恩，你会发现人生真的大不同。


    你为什么会感恩？为什么会爱呢？它来自你内在的那个声音。它会告诉你此时此刻、当下你要去干的事情。


    有时候我在家，突然想和爸爸来个拥抱，突然想和姐姐来个亲吻。就是此时此刻，而我们中国人有太多的限制，不能让你在此此时此刻去做这些内心真正想做的事情，去表达你的爱、你的热情的事情。我们都被限制住了，但是当你真的翻转过来，你会发现其实你没有那么多邪恶的想法，因为你没有了恐惧，没有了匮乏，你不会想去偷谁，去违法，去违反道德，你做什么都是出于一种热心和热情，听从内心的声音就好。


    你会构建不一样的亲子关系、父母的关系、同事的关系，你不需要什么沟通技巧，你就是很真诚地去表达你的热情。我很喜欢李中莹老师的观点：当你是从黑洞的时候，你会吸引各种各样的烦恼，各种让你痛苦的事情。但当你是一'
  - '[PAGE 159]


    束光的时候，你会照亮其他人的黑暗，让其他人都变得和你一样。这个真的不是“吸引法则”，它是用量去传递你内心的那种热情。我非常喜欢这个观点，当我们用此時此刻的这种感觉和感受去代替方法论的时候，人生就不一样了。


    我记得有一个代理商问过我们这样一个问题：既然你们推崇正念，活在当下的观点，用爱心去做教育，用真诚去做教育。那么在商业上如何去适应规则， beruf 是要合作，终究是要共同去推这个市场。这个问题，我们一直在践行，在思考，这里给大家做一个简单的分享。


    公司的业务，我们没有打过一分钱的广告，我们也没有公开的去用所谓的优惠促销政策去逼谁或者诱导着谁去买单，我们就做好我们的大学客户，高中客户，初中客户和小學客户，我们妥好我们的信息化软件，做好我们的项目方案，讲好我们的课程，做好我们的一对一咨询。基本上就是客户介绍客户，代理商介绍代理商。陕西有
    400 所高中，我们能直接接触的是 60 所高中，但是我们讲过方案的学校有将近 200 所，剩下那些没有直接关系的人，都是在创业的路上，你用你的热情、真诚和那种气场吸引来的。


    很多时候人生真的很奇妙，会有很多运气，很多巧合，也有很多悲哀，很多痛苦，很多烦恼。所以佛陀说人是非常的，世界也是无常的。如果你用好和坏去评价，用黑和白去评价，那么你总会遇到白事、遇到黑事、遇到好事、遇到坏事。人生永远是喜怒哀乐交替着，但是如果我们换个思路，跳出这个框架去思考问题。此時此刻的感受和感觉是没有颜色的，也没有好坏。就是此刻，我专注在这里，我让我的生命充满爱，充满热情。我遇到的每个人我都真诚对待，生命会很不一样。


    亲子专家李子勋老师说过：当你告诉孩子，就算是跌倒了，也要去抱一抱那个摔了个大石头的，那么你这一辈子可能一个秘密的人都不会遇到。我特别相信这句话，因为我会在讲台上用我的热情去带动学生们去思考自己的未来。我曾经很多次把那些低着头打王者荣耀学生的注意力拉了回来。没有方法论，没有演讲技巧，大家不要再相信那些方法论了，不要再去花很多钱上那些技巧类的课。因为道一定在术之上，道就是你这个人本身，你的命，你的气，你的场。


    创业也是这样，工作也是这样，我相信大家都有很多体会。面试要方法'
