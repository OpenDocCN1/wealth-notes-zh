    上面是说到国际格局的一个巨变。那在国内呢，我们说一下产业或者经济方面的一些大的变化。我们最近看到阿里巴巴，还有美团都被到了这个国家的反垄断的调查，以及阿里、美团、滴滴这些公司都纷纷进入了社区团购，就是说看上了我们的菜篮子。为什么在这个时候会出现这样的事情呢？其实大家想一想我们此前讲的技术变化对社会财富对企业利润的影响，就可以知道，以前这些公司是靠着技术进步的红利起来的，但是当技术红进步的红利即将吃尽的时候，我们就进入到了一个所谓“存量残杀”的世界。


