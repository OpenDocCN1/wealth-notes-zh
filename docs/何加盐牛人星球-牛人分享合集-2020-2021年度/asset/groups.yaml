    教育的话题是一个非常广大的话题。刚才给大家简单分享了我一个教育模型叫 551105533311 系统。第一个五是影响教育结果的五种因素。从远往近分别是，人力所不能理解的因素、遗传的因素、社会因素、家庭氛围的因素、家庭教育手法因素。一个教育工作者只能解决两个半因素，分别是教会家长好的教育手法，让家庭形成好的氛围，进而通过家庭带动社区，带动社会风气的改善。


