    # 人力资源组织运作模式


    ![](img/d43ec9f811a059e999583aaeac906d81_131_0.png)


    ![](img/d43ec9f811a059e999583aaeac906d81_131_1.png)


    三支柱模式讲的就是三驾马车，COE 是专家队伍，SSC 是共享服务中心，还有业务合作伙伴 HRBP。那很多人都很好奇，SSC 人事共享服务中心到底是怎么做？其实我们在早期
    2007 年的时候，人力资源不是三支柱模型，而是经历了人事变革，像 IBM 学习，请 IBM 的顾问来帮我们做人力资源的三支柱转型，将人力资源当中很多事务性的工作全部提取出来，然后分解到共享平台，成立专门的人事服务中心。这个服务中心感觉像银行的办事流程服务大厅，就像你到银行有专门的业务接待员，然后华为的人事服务大厅在公司总部设有专门一个大堂，针对每一类业务设置窗口服务，比如合同续签、离职手续办理等窗口。员工有需要处理相关人事业务时，就上网预约，按照预约时间，到店铺现场办理，办理'
  - '[PAGE 132]


    完结给现场工人做一个评价和反馈，就可离开了。表面上看，这是一个窗口服务模式，但背后其实是有大量的流程包括强大的系统支持。说实话，很多企业很难做到这一点，很难实现自主研发。那对于中小企业，我通常建议他们用钉钉或者是企业微信去解决，实现一些无纸化办公。


    因为华为有强大的研发人员可以自主研发系统，就能解决大量基层的人事工作，这会把 HR 在事务方面的工作时间精力释放出来，让 HR 有时间和精力承担其他更多工作。比如，让经验更丰富的，专专家路线，也就是
    COE 角色。他们负责我给大家那张白色的图片左边的那一列内容，包括给大家看的视频，是员工关系部（集团层的部门），他们负责从公司层面做集团标准化，输出公司管理需要的制度与流程，包括一些组织变革的动作，比如股权分配的调整方式，从原来的
    ESOP 到 TUP 的转变等等，这些都是在 COE 这个层ว่าง解决的。


    人力资源的第二大块工作，就是贴近业务解决业务中涉及人力资源管理方面的实际问题。我理解人力资源如果不能帮助业务解决业务部门在人的选育用留方面问题，他的很多工作是没有意义的。基于这个要求，人力资源就分裂出了一个角色叫
    HRBP，如图片的右边是全部 BP，事业群 BP 等。


    在华为组织架构复杂兼层级多，每个事业 BG 都有二级 COE，各层级都有 HRBP，各层级 HRBP 要跟一级 COE 保持对接，承接来自公司对人力资源战略或组织变革要求的一些动作，所以右下角的
    BP 职责基本都是相应的推行这些推行那的。市场上很多组织都想做三支柱转型，也在思考如何推行 HRBP，事实上这个过程，要想做好 HRBP 是需要有对应支持的，总部集团的
    COE 支持就最重要，COE 负责提供解决方案，提供制度，提供流程，HRBP 贴近业务去了解业务所对应的需求，然后跟跟 COE 对接，制定出更符合业务发展需要的解决方案。


    # V-CROSS模型


    ![](img/d43ec9f811a059e999583aaeac906d81_132_0.png)


    在这里，就华为的三支柱我重点讲下 HRBP 这个角色，因为很多人力资源工'
  - '[PAGE 133]


    作最终都靠 HRBP 去落地的，或者说最终是靠 HRBP 在部门运作实现的。运作的过程中，就有很多灵活技巧，包括 HRBP 在自己部门如何去设置组织绩效，以及如何去完成对应的招聘工作和招聘任务，以及干部管理，任职资格体系的运用等，都是可以在公司体系下，再二次精细化管理或再修订。


    华为人力资源的体系本身非常复杂，我本想把人力资源复杂的板块地图列出来给大家看，但是我觉得这样复杂的东西可能对大家的帮助不是特别大。那今天我重点主要是讲两个板块有趣的事吧。


    我觉得第一个比较有趣的事是招聘，为什么我要选招聘来讲，是因为我觉得选对人比培养更重要。还有一点就是我也觉得华为为什么能够在人力资源方面有所成就，相应来讲，在外界感受到的不那么明显的，其实很多时候是他的招聘工作真的和外面很多企业是不一样的，而这些管理动作是很多企业想学习华为也很难以到。


    如果今天在听的有老板或是某公司的 HR 负责人，我倒觉得有些地方是值得大家去借鉴和学习的。因为入口端抓严了的话，那么其实会减少很多后期人事处理的事情。在一些中小民营企业里，经常发现试用期需要处理一些你不想去处理的事，但有许多事情，事后看都是在前端入口没有把握好导致的。如果我们把前端把握好了，有很多事情是可以省去的。


    华为有一套相对强大的招聘录用流程，我现在把这个强大的招聘录用流程，或者是说相对严格的人才选拔流程分享给大家，可以跟大家细说一下。


    ![](img/d43ec9f811a059e999583aaeac906d81_133_0.png)


    我知道很多企业其实在做人才选拔的时候比较简单，可能就是 HR 跟用人'
  - '[PAGE 134]


    部门约一下，聊个需求，完了以后就开始 HR 选人，如果觉得合适就交给业务部门面试，面完试觉得合适了，就开始走入职流程。那这个过程是否老板见过了（小公司是不是每个人老板都亲自面试），大一点公司的，这个人是不是部门领导或部门总监以上看过的。很多时候，在人才选拔上来说是没有那么严格，基本上就两轮面试，人员就决定了。但是在华为，整个面试流程是非常完善的，当然它和普通公司不一样，和一般公司不一样的地方就是可能在一般公司快的话一两天就可以发
    offer，但华为的 offer 流程时间特别长，为什么这么长？我给大家讲一下。


    首先，如果今年有大批量招聘任务的时候，只让 HR 独立完成是不可能的，因为 HRBP 是按照大概 1:150 左右配比，如果这个事业部大概 500 个人，可能就会配上三个
    BP，再加一个大 BP，最多就是 1+2 或者 1+3 的模式，最多再带一个 HR 文员（HR 助理）的一个架构。如果今年赶上招聘大年，部门需要扩展队伍，招聘任务大，就靠这些
    HR 来完成招聘，是远远不够也很难满足业务发展需要的。这时候我们通常会和业务部门联合形成一个作战团队，成立一个招聘任务小组。这个招聘小组的成员，不仅仅仅是招聘
    HR，还有招聘文员，再加上由各个业务部门筛选出来的狼筅干部队一起组成。华为为这个狼筅干部队角色是非常与众不同的，这在外面很多公司，让业务部门选人是很<|message|>
    的，很难像华为这样，可以说，不论我业务部门多忙，都能挤出一个人来，2~3 个月时间，甚至于 3~5 个月的时间去全职支撑做招聘的事情（因为中小公司基本一萝卜一个坑，工作不易被接管，所以其想学习这个模式要评估部门职责情况而定）。但在华为，不一样，这些狼筅干部队确实是组织未来要培养为基层领导或者中层领导而选拔出来的的人才。


    那我们为什么叫狼筅干部队？因为通过这个事情，顺便也能够提升这个员工的该人员能力，以及通过对人员的招聘工作，他会了解到人才的获取来之不易，那么在日后管理，就会更加珍惜和更值得去留用人才，这点是很多企业做不到的地方。


    由大 BP 和招聘 HR 带着业务部门一起选完狼筅干部队后组成招聘小组，招聘 HR 赋能给狼筅干部队，给他相应的账号密码，以及定点挖掘的企业和对应的岗位，包括招聘学校清单，一会跟大家分享招聘学校清单，这点也是蛮特殊的，'
  - '[PAGE 135]


    是区别其他企业的做法。华为招聘学校主要来自 211/ 985 的学校，也不是所有 211/985，我会发给大家分享一下。


    动机干部分先做筛选，选一批候选人约在周末统一面试，到周末，他专门组织一场周末的小型招聘会，HR 负责协调面试官，然后就进入招聘工作流程。


    首先说下面试流程，候选人到了以后，一般先做素质面试，这一关只有 HR 可以面试，然后做专业面试就是业务面试。业务面试也就是技术面试官会做一个业务能力评估，按公司任职资格标准，定一个建议的职级，比如说专业一级二级还是三级，HR
    也会有个人岗建议的职级，比如 13、14……，以前会有个集体面试，现在已经取消集体面试了。在专业面试和素质面试两个方面，都有—票否决权。HR 觉得合适的，业务部门可以否定，业务部门觉得合适的，HR
    一样可以否定，所有面试流程，只有这两个面试的先后顺序是可以调整的，根据现场招聘会，获选人等待时间而相应的灵活调整。只要这两关都通过以后，才会给候选人发一个人才测评，这个人才测评是当年华为发现很多员工有心理问题，特意增加了这一心心理测试，这个心理测试题目是专门和上一知名专业机构研发的，一套题不便宜。这个测试通常需要
    2~3 个小时的时间，只有候选人测评结果通过后，才会交给综合面试官，综合面试官通常都是 19 级以上的总裁。在华为，最终候选人的定薪定级并不是由人力资源部门完成的，而是由综合面试官完成的。综合面试官都跟候选人谈妥后，才会进入到下一个阶段，就是
    BU 总裁资料审核的阶段，就是要把候选人填写以及面试官填写的所有材料带回去交给 BU 总裁审核，这一关，通常我们 10 个简历进去，一般都会被卡掉两或三个，大概也就剩
    70%~80%了。很多时候总裁他不看人，他就看简历和他填写的资料，在简历中他看到觉得有疑问的地方，我们无法解释到位，他觉得这个人有一些疑问，他就有权不录用，所以基本上很多人觉得我们华为招聘会很简单，好像有这个椰子很好招人，事实上是很难的，因为每一层都会有一个筛选关，所以其安按照漏斗的原来来讲的话，我们可能筛选
    100 份简历，最后可能录用的也就不到六七个人，成功率也就是百分之六七这样，人才选拔过程就是这样逐层筛选逐层过滤的严格把关。


    最后即使 BU 总裁资料审核通过了，还要上交给一级部门的人力资源部门审核资料，一级部门招聘 COE，他会对资料进行严格的审核，因为所有的资料都必'
  - '[PAGE 136]


    须按照公司的要求来填写，要规范的填写。包括简历空白说明，单亲家庭的说明或是测评结果，就某一项的特殊说明等，这些资料都是必须完备无误的，如果这中间有一个资料是不完备，还会打回来重新再审核。等所有资料审核完之后才会交给集团，也就是交给公司的人力资源去备案。


    招聘整个过程，是层层严格把关的，因为有这样一个严格把关的流程，一般来说，不会录用到一个错的人，但是不排除只是说相对错误的人概率是少的。但这样的流程，在我们现有的企业当中，做到这一点是很فق难的，所有的管理者都会觉得很浪费时间，甚至觉得这是
    HR 的工作，而不是我业务部门的工作，但事实上招聘是业务部门和人力资源部门共同的工作，甚至可以是业务部门最核心的工作，其实 HR 要选对人的前提，或者说 HR
    做招聘的关键是先有准确的需求，但现阶段很多时候需求是不准确的，或者是需求是可以频繁变更的，会导致招聘的复杂度增加，或者说各种试错成本增加。


    我拿华为内外差异性做了一个对比说明，因为我在外面看到了一些现象，但在华为，我们不太容易出现，比如说需求不明确的情况，我们的 HC 都是非常严格管理，招每一个岗位，人力预测都是严格审核的。这是在人才招聘上面的第一个差异性。


    华为招聘流程是规范的，那大家可能就会感兴趣，我们都从哪里来选人，我们选人的原则和标准是什么，其实我们每一个 HR 和锻炼干部，都有一个招聘大钢和招聘学校清单，招聘大钢中他很多内容我就不了，我重点讲一些社会招聘的排他条件，我觉得这个是可以给大家作为借鉴的。


