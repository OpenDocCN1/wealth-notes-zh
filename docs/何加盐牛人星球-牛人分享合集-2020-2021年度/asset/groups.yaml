    # 从菜鸟到达人的职场营销秘诀


    分享者：夏茵，毕业于武汉大学，1999 年加入友邦保险，从普通业务员，成长为近 300 人团队的负责人，现为友邦广东业务总监，友邦五星级培训导师，全球百万圆桌协会终身会员，国家高级理财规划师，国际
    NLP 执行师，行业畅销书《保险如何创业富》作者。


    时间：2020 年 11 月


    大家好！我叫夏茵，70 年代初出生于湖北孝感，94 年大学毕业，来到广州，成广漂一族。第一份工作到了港资（企业），后来 98 年做保险，一悦都做了 22 年了，大学毕业
    26 年了，已经算老广州人。首先非常感谢何老师这个机会给我来跟大家见面。


