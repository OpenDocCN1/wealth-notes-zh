    能比较少，金额比较少，或者是说期限、额度、成本什么都可能受影响。而且 银行贷款对企业的经营总情况，流水要求比较高，那我有可能跟融资租赁公司 合作。我在跟融资租赁公司合作的时候呢，比如说我先估值这栋楼，假设值十
