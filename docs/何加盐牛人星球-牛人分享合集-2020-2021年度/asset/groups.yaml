    这里我也标黄了几处，第一个是帮助别人。确实，帮助别人就是一种利他的心，是我们幸福感的重要来源，很多人认为甚至认为是最重要的幸福感的来源，稻盛和夫就认为利他是人幸福的根源。


    第二个我们上面说到不开心的有一个是弟弟自杀去世了，然后这里让人开心的是有一个出了车祸的亲人醒来。这里我们好歹有一个这方面的好消息了，也祝福这位星友。


    还有一位星友提到“想了半天好像没啥好开心的事”，其实这里写“没有开心事情”的不止这一个，有三四十个人说过去都没有开心的事，我觉得这就值得深思了。为什么你会没有开心的事？是因为你自己不容易开心呢？还是因为你这一段时间就是这么的不幸运？或者说你没有能够找到让自己开心的办法呢？


    下面还有一个说“520的时候收到自己给自己送的花，老板娘包的非常符合心意”，所以她把这个写上了当做最开心的事，大家可以看到，其实幸福是可以自己创造的，我自己给自己送花，那就是一种开心的方式呀。


    下面还有一个说“我最近经历身体的一次重大挑战，很开心，因为在最绝望的时候爱人一直陪在身边鼓励他”，这里我们也可以看到，首先我们对别人的帮助会让别人很幸福；其次我们对别人的帮助也会让自己很幸福。所以不管是对爱人或者说朋友、家人，你对他好，其实是让自己幸福，也是让对方幸福的一种方式，所以我们要学会
    cuadro 对家人好，爱护家人。


    ## 人生的幸福来自于哪里？


    性别划分：

    男人的开心来自事业，

    女人的开心来自家庭，

    男女都因成长而开心，

    给人机会才会幸福。


    时间划分：

    短期的幸福来自于掌控感，

    长期的幸福来自于价值感。


    上面是我总结的，咱们星友的幸福主要来自于哪？如果按照性别区分的话，大家可以看到，男人的开心更多的来自于事业，而女人的开心更多的来自于家庭。当然这个不是绝对的啊，也有女性因为事业的成功而开心，男性因为家庭而开心的，这个不是绝对，只是说一个概率上。但有一点，不管是男还是女，都会因为自己的成长或者公司的成长而开心。另外一个特别重要的是，如果我能够给予别人带来幸福，自己也能够得到幸福，主要是这四类。


    如果按照时间段来分呢，其实很短期的幸福，它主要来自于掌控感，就是一个东西我能够让它按照我最想要的方式去发展、去实现，这个时候我是幸福的。而从长期来看，长期的幸福来自于价值感，比如说我去帮助别人，或者我的孩子如何去成长，这些都是让我觉得特别有价值的地方。


    所以，如果你想要短期的幸福，你就要增强自己的对事物的掌控能力；如果你想长期的幸福，你要寻找一个让你的生活变得有意义的东西。也就是下一张图的“如何创造幸福”。


    ## 如何创造幸福？


    给生活赋予足够强大的意义；


    给自己赋予实现意义的实力！


    要让自己幸福，首先你要给生活赋予足够强大的意义。有时候我们做的很多事情，其实是比较苦比较累的，但是为什么我们还会乐此不疲的去做呢？就是因为它有价值啊，它给我们的生活带来了意义，所以我们要学会给我们做的事情、给我们正在过的生活赋予一个强大的意义，这是幸福感的根源。第二，我们要增强掌控感，就是要让自己能够拥有实现这种价值或者意义的实力，要不然你光有意义，但是你实现不了，也会陷入到一个痛苦和焦虑之中。


    > 人生战略管理的意义，就在于亲手掌控一个有意义的明天。


    我们分析了这么久的不幸和幸福，其实就是为了告诉大家这么一个道理：人生战略管理的意义就在于给自己亲手掌控一个有意义的明天的机会。如果我们能够学会人生战略管理的话，可能你就可以清楚去掌控一个有意义的明天，这样你的痛苦的指数会比较低，幸福的指数会比较高。


    ![](img/d43ec9f811a059e999583aaeac906d81_18_0.png)


    前面说到了自己、环境和趋势，我们会想这三个因素中哪一个更重要呢？上面是我们 fifty 在问卷中回答的答案，我是谁、我在哪哪、我要去哪、怎么去四个选项中大部分人选的是“我要去哪”，也就是说“我的目标如何确定”。在这四个选项中，你认为哪一个是最难？大部分人选的是“怎么去”，我们看到这两个问题中选择“我是谁”的都很少，只有
    26% 和 28%。其实我认为这两个问题，最重要的也是“我是谁”，最难的也是“我是谁”。


    > 想弄明白“我要去哪里”，

    关键是要先弄明白“我是谁”。

    只有知道了自己的喜恶和短长，

    我们才知道自己要去哪里。


    为什么这么说呢？你想想，你想要知道“我要去哪里”，关键是要先搞明白“我是谁”，也就是说你想要设定一个人生目标，关键是不是要先弄清楚你到底喜欢什么、讨厌什么、擅长什么、不擅长什么，然后才能够确定“我要去哪里”？如果连自己都弄不明白自己的状况，就设置“我要去哪里”这个目标，那就是盲目的，而且一定会被你改变的。只有知道了自己的喜恶，还有短长，


    我们才能真正的明白自己要去哪里，我们设置的“我要去哪里”，这个目标才是合理的，并且能够持久的。


    ![](img/d43ec9f811a059e999583aaeac906d81_19_0.png)


    所以关于“你认为人生目标规划最难的是什么？”这个问题，很多朋友都选了其他的选项。实际上我们每一个人最难的还是了解自己，因为你如果了解自己的话，其实你就知道你想去哪里，你就知道你要去发展哪些能力。最难的就是知道“我想要什么”，你知道了你想要什么，自然就会想着去培养拿到“想要的这个东西”的能力，也自然就知道了你要到什么位置、达到什么成就才算圆满，所以关键是“认识你自己”。


    ![](img/d43ec9f811a059e999583aaeac906d81_19_1.png)


    但是“认识你自己”最重要，并不是说其他的两方面就可以被忽略，而是说你要先确定你喜欢的东西，再来确定其他两样。确定人生战略，你可以用这三个方法；我喜欢、我擅长、赚钱多。“我喜欢”和“我擅长”都是了解自己，其中最重要的是“我喜欢”，然后赚钱多是跟现在的社会环境以及未来的经济发展趋势相关的。这里面的关键是你必须得先确定“我喜欢”，然后去发展“我擅长”的东西，通过这两个东西，一个提供动力，一个提供技巧，达到“赚钱多”这个目的，所以“我喜欢”是基础的，其他的是衍生的。


    我们根据上面的这些条件，选择了人生战略之后，人生战略怎样才能实现呢？就是说我知道了自己是谁，知道要去哪里，问题是怎么去呢？这个我写过一篇文章，就是《我研究了100多个牛人，总结出一个牛人公式》，这实际上是一个怎么实现人生战略的指引。


    ![](img/d43ec9f811a059e999583aaeac906d81_20_0.png)


    我们看如何实现人生战略，其实换一个问法就是，人生成功或者说我达到人生战略取决于什么东西？它可以分为两大类，一类是不可控因素，就是要很长的时间，要有一定的运气，这个我们就不讲了。然后就是可控的因素，可控因素涉及到目标、动力和方法，关于这个我专门写了篇文章（就是牛人公式那篇）里面写的非常清楚，大家可以去看看那篇文章，这里由于时间关系我就不再展开讲了。


    ## 牛人公式


    牛人 = 选择³ × 方法² × 动力 × μC


    更详细的论述，请参阅

    《我研究了100多位牛人，终于总结出一个牛人公式》


    那么要实现人生战略，我们需要认识到三个很关键的认知，这里我给大家讲一下。一个是进化理论，一个是二八定律，一个是因为相信而看见。


    ## 与人生战略有关的三个关键认知


    + - 进化理论

    - 二八定律

    - 信而后见


    我认为一个人要实现人生战略，首先他必须要求不停的进化。进化有三个层次，这三个层次分别是认知、创造和积累。


    ## 进化的第一层次


    ![](img/d43ec9f811a059e999583aaeac906d81_22_0.png)


    我们先看第一个层次：认知层。


    我们首先要认识到自己是能够进化的，然后才能谈得上去真正的进化，所以第一个层次，你必须从僵固型思维升级为成长型思维。所谓僵固型思维就是认为人的能力都是固定的，因为能力固定，所以你再努力也没有用，所以才会否定努力的作用，然后他会把一切外界的失败或者不当成是对一个人的最终的评定，比如说你失败了，就会认为全世界都认为你是一个无能的人。所以，他会特别害怕挫折和失败，他不会去挑战任何有可能导致他失败的东西，所以他就永远留在这里。成长型思维认为人的能力是不断向前发展的，他会积极努力的提升自己，从而也不怕挫折和失败，敢于挑战更高的目标。


    关于僵固型心态和成长型心态，大家可以看一看《终身成长》那本书，那里面讲的比较清楚，这里我就不再多说了。我的公众号里面也有一篇讲马云跟马化腾的区别，就是说马化腾是不断进化的。那篇文章里也讲的比较清楚，大家可以找一下。


    进化的第二个层次，是我们要为进化创造条件。大家想一想进化是什么？是物竞天择，适者生存，实际上就是我们的 DNA 不断的变异，产生出新的性状，然后适合当下环境的性状就会被遗传下去，不合适的可能会导致我们的个体的消亡，这一不部分性状就没有遗传下去。


    ## 进化的第二层次


    第二层次，创造层 主动创造新的多个性状


    进化的内因是变异，外因是环境选择


    用更快的人来学习，创造的性状，有不合适就淘汰会继承。


    进化的第二个层次是创造层。就是我们要主动创造很多新的性状。变异是进化的内因，环境选择是进化的外因，所以我们必须得创造更多的性状，让环境来选择。作为一个进化型的人，你要不断的学习新的知识，了解新的信息，获得新的思维的方式，这样你才能在不同的层面创造更多的现状，进而得到更大的生存的优势，也就更容易实现自己的人生战略。


    ## 进化的第三层次


    第三层次，积累层 每次微小的持续积累


    慕课分布


    每天进步千分之一，你的能力一年会增长44%。

    如果时间延长到10年，那就就是增长37倍。


    进化的第三个层次是积累。当我们获得了那些好的性状，然后环境把它挑选出来，是适合这个社会发展，适合未来的趋势的时候，我们就会获得优势，那这个优势要不断的积累，不是一劳永逸的。其实进化就是一个微小的优势，在很多年的时间里持续的积累。这也是为什么一个单细胞动物最终能够发展为我们这么复杂的人类，因为它不断地积累微小的优势，然后持续积累几亿年，单细胞就变成了人。所以，如果我们用在人的进化上的话，我们每天只要


    每天进步 1%，过了一年你的能力就增长了 44%，如果是 10 年呢，这个增长的幅度就是 37 倍。


    微小优势的持续积累，会造成自然界的一种现象，就是说占有优势的人，他的优势会越来越明显，不占优势的人他的优势会越来越弱化，最后就是占有优势的人获得更多的收益，也就是形成了我们常说的二八定律。


    ## 人间铁律：二八定律


    + - 在我们这个三百多万人的支付宝里，60%的消费是最后结转的十几个人发觉的。

    - 每个乡镇关注了很多人公众号，但是经常看的，只有两三个，甚至只有一个。

    - 群体的大小方面，智商越高越到150左右，天才和超凡越少，基因没有。

    - 中国的战绩人，绝大部分都在听到不到50米之间，剩于千米和高于85米的很少见。

    - 全世界最贫穷的一个人，他们拥有财产加起来，等于全世界的一般。


    上面举了五个例子，我就不再一一念了，大家可以看文字就好。二八定律是世界的一个基本规律，我们很多事情都是符合它的，包括我们的进化也是这样，以及我们的财富或者知识、名声等等，在全世界的分布都是符合二八定律的。


    ## 人间铁律：二八定律


    ![](img/d43ec9f811a059e999583aaeac906d81_24_0.png)


    ## 二八定律的启示


    ![](img/d43ec9f811a059e999583aaeac906d81_25_0.png)


    我们只要是生活在这个世界上，就不可能摆脱二八定律，二八定律有可能是影响我们思维和未来行动的一个特别有用的工具。你现在听到了，如果能够把它用起来，会对你未来产生非常大的影响。


    那二八定律在我们的人生战略里面是怎么用的呢？首先，二八定律告诉我们，世界是不公平的，因为 80% 的人只占有世界 20% 的财富，而那剩下 20% 的富翁，他们拥有了全世界
    80% 的财富。这不仅是在财富分配领域，你发论文、在公司拿业绩、你的公众号的发展等等，全部都符合这个定律。


    二八定律告诉我们，我们要不断的从 80% 的基数里跃起到 20% 里，这其实就是人生跃迁的本质，人生跃迁就是从 80% 进入到 20%。进入到 20% 还不算结束，因为你在
    20% 里又符合二八定律，有 16% 是一般牛的，4% 是超级牛的，你又要从 16 里进到 4，不断地前进。所以二八定律会让你对进化保持一种强烈的渴望，如果你不进化就会留在
    80% 的人里面，只能去争夺那可怜的 20% 收益，所以一定要进化。


    第二个就是要专注，因为我们知道 80% 的成果其实是以我们 20% 的努力而得到的。如果你知道了这一点的话，你在分配的时间的时候，就一定要知道哪些对你是最关键的，你认识人，要知道
    20% 的人在哪里，他们决定你 80% 的优质人脉；你做事，要知道你要紧抓的 20% 在哪里，你要学习考试都是一样，紧抓 20%。所以人一定要专注，不能在所有事情上平均用力。这就是为什么我在问卷里特别设置了完美主义是不是一个好的选择？60
    分万岁是不是一个好的哲学？就是告诉大家在 20% 的关键事项上，我们要选择完美主义，在另外 80% 非关键事项上，60分就可以了，所以60分万岁是一个很好的哲学。


    二八定律的第三个启示就是我们要保持耐心。因为有可能会你人生80%的成就是在最后20%的时间里才显现出来的。最典型的例子就是巴菲特，我们都知道巴菲特是亿万富翁，全世界排名第二，他也当过首富，但是实际上他主要财富都是自己50岁以后才积累的。


    ![](img/d43ec9f811a059e999583aaeac906d81_26_0.png)


    我们可以看到像巴菲特那么富有的人，在30多岁的时候也并不是那么有钱呀，对吧？32岁102万美元，现在你在北上广深有一套大一点的房子，都已经超过他了。但是人家人生后半段在起飞。你可以再看一下前面我们放的“进化第三层次”的那张图，其实世界的幂率分布就是这样，你的主要成就很有可能是要在长期的积累之后，才能爆发式的出来，这里它会有个引爆点，或者我们叫拐点，你没有到那个拐点的时候，你就要不断的练习，不断的进化，然后耐心地等待引爆点的出现。


    ## 因而相信而看见


    ![](img/d43ec9f811a059e999583aaeac906d81_27_0.png)


    第三个关键的认知是“因而相信而看见”。我们总是说“眼见为实”，一件事情我只有看见了才会相信他。但是实际上一个成功的人，他都是先相信再看见的。这点马云就最明显了，他在1999年十八罗汉大会的时候，他就告诉所有人，我们企业要活102年，我们几年之内要上市，我们要成为全世界最大的电子商务企业，我们要成为全世界最伟大的企业。他看见什么了？他什么都没看见！他只是有这个信念而已。


    这个特质有可能是富人跟穷人最关键的特质之一，也有可能 despair 成功人士跟失败人士或者跟平庸人士最关键的分野之一。


    你看我们普通人去做一件事情，总是会想，我现在有什么能力、有什 么资源，因此我可以设定这个目标，因为我符合它的条件，所以我去做这件事情。实际上你要获得巨大的成功，要怎么样啊？你得反过来，你先想我喜欢什么？先把这个目标给设定了，然后一看，我的资源不匹配、能力达不到，怎么办？那你就创造条件让它实现啊，缺少资源你就找什么资源，哪方面能力不足，你就练哪方面的能力。所以一个人要实现一个伟大的人生战略，必须得是因为相信而看见。


    我们把上面的东西总结一下，首先什么是人生战略？人生战略就是明确若干年以后我要成为什么样的人，要达到什么样的成就。而人生战略管理是掌控自己未必来的一条必经之路，所以我们一定要学会制定战略，然后学会战略管理。人生战略的实现最主要的是做出选择、学习方法、保持动力。

