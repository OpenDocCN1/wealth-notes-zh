    蓝州的人也可能是把这个红人选上去。但是在 2000 年以后，美国的蓝州红州分的特别明显。然后选举地图，每一届隔了四年，再选好像都差差不多。


    这其实就是预示着美国发生了一个深刻的现象：人群分化，民主党和共和党价值观、办事方式、基本群众，发生了很深刻的变化。这方面的变化在选举中体现的非常的明显，总体来说他是不利共和党的。


    在这次选举中也体现的非常明显，共和党在他的南方基地，以前应该说是很...容易获胜的，但是这次在摇摆州里面呢，出现了几个南方的，比如说以前不太可能认为出问题的地方，比如像德州、德克萨斯州，这个是传统的，每次都是选共和党的，这次虽然也还是选特朗普，但它已经说成摇摆州了，这也是日常分析经常说的美国的人口结构发生变化，外来人口越来越多。而共和党的基本盘，白人、男性、基督徒比例占的越来越少。


    这导致美国选举，他不再是看每个人有什么政见；你要到底是具体在说些什么；反而就变成了：你到底是谁啊？你这个人到底是支持我这波的还是支持那波的？


    这就导致甚至于是说选举结果出来了以后互相不承认。上一次 2016 年选举特朗普获胜的时候，希拉里的支持者就闹了，说不承认，说特朗普不是我们的总统。那这次特朗普输了，那他也不断的闹各种选举争议。特朗普的支持者也是纷纷的不承认，到现在中国外交部祝贺拜登的时候，还是说并不是祝贺拜登当选总统。所以这选举争议的还会继续闹下去。


    他这个闹下去，根源是共和党未来的发展不利他那个红州。虽然各州的数目还是占了一半稍多一点。共和党在参议院，它是每个州选两个参议员，共和党在参议院的数量上面还是稍占一点优势。但是在未来，在人口结构发生变化以后，有一些红州会转变成蓝州。现在是蓝州的就不太可能变成红州，这个趋势就让共和党非常地担心。


    共和党还存在一个问题，就是推不出很好的候选人来和民主党这边的候选人竞争，那么他们选择就是和特朗普这样比较奇怪的一人进行合作。民主党那边推出的候选人呢，基本上谁都差不多，有好的候选人当然很好，没有特别好的，像拜登这次就不是特别好的候选人。但是他们推出来一个人来呢，基本上也不会太差。'
  - '[PAGE 90]


    那么共和党选择了和特朗普合作，其实导致了很大的隐患。因为特朗普著这个人是没有政治经验的，他也不遵守美国政坛一些潜规则。所以特朗普当选的四年，把美国政坛搞得鸡飞狗跳，可以称之为发生了一场“特朗普之乱”。


    特朗普这个人办事有点胡来莽撞，有的时候也可以按他的支持者说，他是果断。比如说在竞选的时候，特朗普对拜登说，他说你 47 年在站台上做的事情，还不如我 47
    个月做的事情。


    这一个意思说，拜登这个人呢，是一个老政客。他 1972 年就在特拉华州当选了参议员，走入美国政坛，然后一直是在美国政坛浸淫多年，专长领域是外交，他是参议院外交委员会的主席啊。2008
    年之后，当了美国的副总统，也是外界和世界上几乎所有国家的领导人，都有过交道的。所以拜登这个人，是一个传统政客，行事非常老道。


    但是特朗普就是一个很奇怪的行事风格，大家从没想过美国领导人会是这么一个形象。特朗普实际上也没有自己的班底，是个政治素人。虽然他选举选上后，跟共和党其实是个合作关系。那他怎么执政呢？他就从美国各地临时拉了一波比较极端的人，像纳瓦罗、班农，还有那个蓬皮奥什么的，都是他自己私人拉来的，并不是共和党的固有班底。


    所以特朗普的行事的时候，有一个自己的小团体。这个显得非常独特。以前当选的总统，是可以有自己的小班底，但是他应该是五湖四海接纳各个利益团体的人，而特朗普呢他搞自己的小团体。


    而拜登呢，你可以明显地看出，他的团队的 500 个人要接住这个下一届政府了，这个团队都是很成熟的。因为他身边的人，其实并不是新人，都是一些已经有相当多的工作经验的人，而拜登只是一个代表。其实你把拜登换成别人也差不多，就是代表着民主党传统政治路线，甚至可以说是美国建制派传统的政治路线的这么一个代表人物。


    可以说，拜登当选以后，他最大的任务是什么呢？就是去补特朗普捅下的篓子。


    这四年，特朗普这个团队，用他极端的形式手法，肆无忌惮地办了非常多的事儿。按照美国建制派的说法，是对美国的国际形象是影响非常大。因为特朗普的行事风格就是：我只管自己的粉丝，你仇恨我的人我根本不'
  - '[PAGE 91]


    在乎，我把我的基本盘稳固了就行了。而拜登不是这样。他就说：我当选了，就是所有人的总统，不管是支持我的还是不支持我的。


    我们上面介绍了一下美国选举的一些基本常识，以及拜登将来在美国内部需要面对的任务，但是这个对中国是什么影响呢？


    我们下面来聊一下拜登可能对中国是一个什么样的基本态度。


    首先，可以肯定的：2018年，美国对中国发动了贸易战，这是一个回不去的事儿了。贸易战并不是特朗普个人的意志，他是美国包括民主党、共和党在内都赞同的，包括对中国进行高科技禁运的脱钩，这些都并不是特朗普小团体自已的事儿。只是特朗普做事比较冲动鲁莽，扣了扳机。


    在这方面，可以肯定拜登即使上台以后，他不太可能回到以前的奥巴马时代和中国相对比较和平的这么一个状态，而是会多少延续特朗普政府和中国开始了一个相当程度的竞争关系。


    但是另外一方面，特朗普对中国、他的做法是非常的极端的，包括特别是2020年发生疫情以后，非常多的极端性的做法，绝对不是一般人可能做得来的。简直就像疯狗一样的，包括为难我们的留学生，把我们的很多学者也抓起来了，还有对中国科技企业的疯狂的禁谈，简直就是不顾后果的。这些事情，美国企业本身都反对的，因为也要和中国做生意。


    所以这些手段非常的激烈，可以预期拜登政府即使对中国想下手，也不太可能采取像特朗普这么激烈手段。


    特朗普对中国这下手呢，一个代表人物就是蓬佩奥。这个人说诅非常的过分，实际上他等于是把中国当作敌人来处理的，完全就是一把中国污蔑成美国最大的敌人，跟以前的前苏联相比，就是要开一个新冷战，这是蓬佩奥的说法。其实特朗普其实就是支持这个说法的。


    当然我们批评的是蓬佩奥，还给特朗普留点了面子。但是从拜登的说法来说的话，他应该不会到蓬佩奥这么一个恶劣的程度。


    首先从大的方向来定性，在特朗普之前中美表面上这个定义，叫做战略合作伙伴，每年还定期开一个这个战略经济对话。虽然说有各种私底下对中国有攻击，但是那个时候确实明面上是合作伙伴，美国总统，都是中国的朋友，下台了，变成中国的老朋友了。所以之前的关系呢，明面上叫做战略合作伙伴'
  - '[PAGE 92]


    伴。


    但到了特朗普这个时代呢，从贸易战开始到蓬佩奥就已经变成了敌人了，就要开打新冷战了，这是两个极端。


    在拜登政府这方面来说，其实他的说法已经出来了。我估计拜登会把中国定义为叫做“竞争对手”这么一个说法。他也不是说伙伴，但也不是说说是那个很可怕的那种敌人，他叫做竞争对手。就是说在比如说在经济学上面，大家是友商这么一个概念，虽然说是竞争，但也不是撕破脸的那种竞争。


    个人觉得，拜登如果把中国当作竞争对手，这还算是可以接受的一个定义，因为你不太可能说中美发生了这么大的事，贸易战这么大的事儿，科技方面都已经打得这么惨了，忽然又变成朋友了，不可能。但是如果说能够把竞争的底线控制住，不要搞得过火，然后变成商业上可以理解的竞争关系，这个还是光明正大的。双方都可以说是在这一个有管制的框架之下进行，不要失控的竞争，这是好的。


    有的人会说，特朗普这边儿是对中国是很恶意，但是拜登也好不到哪去。因为平时民主党共和党对中国关于一些发言呢，也都非常恶毒的。很像粤港独啊、台独什么的，这些都沒有什么好话。所以就会说，民主党是不是和共和党特朗普一丘之貉？对中国就关
    系好，也好不到哪去？


