    核算了。


    然后说上面呢，比如说这个应收账款和其他应收款，这两个是什么区别呢？它两个就好比应付账款和其他应付账款的区别。你看负债的流动负债里面有一个应付账款，有一个其他应付账款，流动资产里面有一个应收账款，有个其他应收款，它们有什么区别呢？应收账款和应付账款是站在本企业的角度上，对外的一些应收账款，应收没有收回来的债权和应付而未付的负债。流动负债是外单单位的，其他应收款指的是内部单位的，比如说关联公司或者内部员工的借款，我们收到一些押金什么之类的，内部的这些，而且是由非主营业务产生的债权和债务。比如说其他应收款和其他应付款，它是对应的，一般情况下指的是关联单位之间的往来，或者内部的一些往来。


    然后说这里面呢我也不展开讲，那我其实现想多说一点的是非流动资产里面的长期股权投资，其实大家也能理解，我就不说了。我就说这个投资性房地产，固定资产和在建工程，其实这里面影响税收特别严重。投资性房地产指的是持有的目的是为了让渡资产的使用权而赚取收益。什么意思呢？我买这个房子不是为了自用的，比如说作为办公楼或者是什的，过一段时间，我坐等它升值，我给他卖了。或者是说我为了出租的，这个时候这些东西就放在投资性房地产。那有些人可能会想了，既然是这样，那为什么不把它放在固定资产里面呢，固定资产里面它也包括房屋，建筑物。其实我们企业所拥有的房屋建筑物，它分布在三个会计科目里面：第一个流动资产里面的存货，第二个投资性房地产，第三个固定资产。它分布在这三个会计科目里面有非常大的区别，如果这个房屋放在存货里面，一般情况下是开发商，房地产公司它开发的这个产品是为了出售，它就放在存货里面。如果说开发商建了房子，我不准备销售，我只是作为以后自用的，或者我留下来作为商铺出租，如果作为商铺出租，那叫投资性房地产，如果办公自用，就是固定资产。


    那它两个为什么还要区别呢？对于企业自用的房产是需要征房产税的，按房产原值的 70%乘以 1.2 对自用房产征房产税。但是如果你这个企业持有的房产是为了卖的，比如说你是房地产开发商，你拥有再多房子都不征房产税，因为它放在存货里边，它是你的商品准备代售的，你持有它不是为了自用的，你是为了销售的，所以它放在存货里面，所以它不征房产税。'
  - '[PAGE 56]


    那同样的比如说投资性房地产，你买回来，假如说你是为了赚取租金，虽然会计科目上你把它放在投资性房地产，但其实你也是在自用，你有利用它增值。国家通过房产税其实是来压制富有人群，劫富济贫。即使你不放在固定资产自用这个会计科目，而是放在投资性房地产里面，你只要进行出租了，依然对你征房产税，只是这个时候房产税的计税依据就成了租金收入。


    然后另外这里面还有一个问题，营改增之前，针对房地产行业或者房屋建筑物这些东西，他是征营业税的。征收营业税和增值得有一个区别，增值税顾名思义它是根据增值额来征的。这是什么意思呢？我买原材料的时候只有100块钱，但是我卖200，它是可以进行抵扣，就是我100块钱买回来的，它的增值税可以从我这200块钱销售额里面进行抵扣。但是在营改增之前，由于房地产行业它是征营业税的，所以它那房子增值税是不能进行抵扣的。这是其中的一个问题。


    还有一个问题，后来营改增以后，2016年5月1号，全中国所有的行业都征收增值税，在房地产也属于增值税企业的时候，虽然说我买的这个固定资产，这个房屋子里边含有增值税，国家依然不允许增值税进行抵扣。后来有一段时间，国家就说了固定资产买回来含的增值税可以抵扣，在你销售额里面抵扣。但是呢，他不允许你一次抵扣，比如说分阶段抵扣，在两年内抵扣，比如说先抵扣60%，剩下的40%留到第二年第三年，或者是说先抵扣40%，后来的60%留在什么时候抵扣。这是中间一段时期。


    现在是什么意思呢，现在是你只要买回来的固定资产，它所含有税一次性当月都可以抵扣了。这体现了国家在鼓励固定资产投资，他以税收补贴的形式来鼓励企业进行固定资产投资。跟所有的行业相比，房地产行业的税收还是非常高的。


    为什么之前你买回来的房子里面明显含的有税，不能进行抵扣，是不是企业在固定资产里面就承担了。而这个固定资产，国家又规定折旧年限，所谓的规定折旧年限就是说这个固定资产可以当费用支出扣除，遇到利润表里面影响利润。它规定的有年限，比如说房屋建筑物不得低于20年。它又不允许你购进的房产在短期内折旧，所以把它分摊到一个很长的时间内，这样每年对你利润的抵减金额就会变小，你当期的利润有可能就会变大。变大以后你可能还要'
  - '[PAGE 57]


    交所得税，所以之前的税金不允许抵扣，这个税金就被企业承担了。国家为了鼓励工厂投资，它就规定两年内可以抵扣，先抵扣 60%，后来抵扣 40%。后来国家觉得这样力度还是不行，然后就直接当期一次性抵扣。比如说现在一套房屋建筑物，光增值稅含有了九个点的税，也就是说你
    100 万的房子里面有 9 万的税，当时你是可以直接抵扣你当期的增值税的。所以这个其实就是国家对固定资产投资的一种非常明显的鼓励，它就从这里面体现了。


    所以我们这个资产负债表现在在的固定资产科目核算的内容是不含税的，你这个税金已经当期抵扣了。而且现在国家还规定，在 2019 年，很多企业都退了很多税，就是说你买回来的东西太多了，里边含的税太多了，可是你今年销售额非常差，你没有什么增值额，你很多以前买回来的东西税没有抵扣，你可以去向税务局申请退税，所以很多企业都退了很多税。


    有时侯我经常交流我的顾问单位，我就跟他们讲有一些东西你尽量不要放在固定资产里面，你就放在最下面的长期待摊费用里边，要么放在工程物资里面，或者放在在建工程里面，不要放在固定资产。为什呢，我就是避开房产税。房产税暂行条例里面有写，必须要达到交付使用条件的房屋，必须能够满足人们正常的工作生活学习需要的东西，才叫房产。所以呢，可以暂时不验收，如果是我企业自己的房子，我不考虑融资，贷款拿抵押，因为抵押必须有房产证，如果不考虑这个问题，就可以以后再确权。我就给它放在在建工程里面，不搞在固定资产里面。这样的话呢，房产税会少交很多。因为房产是按照原值的
    70% 的 1.2 征，每年都征。


    还有一个方法，在确权的时候，把房屋的价值变小，房产税的计税基数变少。但是这里边就有一个问题，在银行贷款的时候，评估值的时候它可能就变低了，但是影响也大不，因为现在评估都是按照市价，它不是按照原来的成本来评估。当然，还是会受一定影响。


    资产负债表的左边我就来介绍这些，然后后边的负债，像这里边短期借款和长期借款，其实这两个的区别也是以年为单位。比如说一年内需要存款的银行借款才叫短期借款，如果我是跟其他非银行的金融机构，或者说是民间的一些借款或者其他形式的一些融资，他们都不放在短期借款和长期借款。短期借款和长期借款，正常情况下指的都是银行的融资。'
  md: '

    实缴，现在是认缴。你可以把资本金搞得无限大都没问题，可能你现在身上有1万块，但是你可以注册一个一千万的公司，没问题。你的营业执照上显示你的注册资本一千万。


    但是这个一千万呢，它是认缴的，它不是实缴的，实缴的才叫实收资本，这个报表的编制主体是企业，比如说我成立了一家公司，这家公司正常来说分法人企业和非法人企业，所谓的法人企业和非法人企业的区别就是它是否能够独立承担法律责任。不管他能不能独立承担法律责任，作为一个会计报表的主体，它和你个人是独立开的，你只是这个企业的股东，你并不代表这个企业本身。所以呢，这个报表它是站在企业的主体上来编制的，所以它这里写实的实收资本不以你认缴的来显示。比如说你认缴一千万的注册资本，你的营业执照上显示你注册资本一千万，当时你只交了一万块钱，那你这个报表的所有者权益，实收资本只有一万块钱。现在国家真的是鼓励大家创业，也不需要验资了，也不需要出具审计报告了。以前总是常要找人作验资，出审计报告，我们会计师可以赚一把审计费，现在都没了。然后我们刚才说了，就是说这个实收资本呢，是你实际交足的数值，才在实收资本这个项目里面反映。


    股本是什么呢？股本，因为你是上市了，你上市以后，你企业的资本就被份额化了。比如说你有一千万的注册资本金，你就变成1000万股。每股的面值是1元。在中国股票的发行它是只能高于面值发行，不允许折价发行。比如说最初企业成立的时候，在没上市之前，你的注册资本假如说跟实收资本一致的话，也是反映叫股本。但是一般情况下面值都是1元，你这里如果说是五千万注册资本，股本如果是五千万，你就是有5000万股，每股面值1元。如果说以后这个股价上涨了，或者你买卖来去，到二级市场流通啦，你可能股本溢价了。假如说现在你这个股票面值是1元，但是你20块钱，买了100股，你就是2000块钱。但是你2000块钱在我们这个资产负债表上入账，并不是入你股本增加了2000。


    假如说有人新买我们的股票了，你还是20，你买了100股，你还是在股本里面只增加100。剩下的差额，比如说2000减100，1900，这一千九反映在下边这个资本公积里边。这个资本公积又反映的是什么呢？反映的是股本溢价。比如说我现在成立了个企业，我这个企业是非上市企业，我的实收资本是100万，我有两个股东，一人持股50%，我们每人享有实收资本，股权就是50万。那另外还有一个人要加入，这个人加入的时候呢，我们就不会说让他再以当时我们成立企业的时候的价格就给他平分掉1/3的股权，比如说我们两个各卖一部分股权给他，我们两个各卖15给他，那他就有30。那他有30，但是他占股比，可能不能占到30%。占30%也没问题，那他就不能只拿出来30万，可能要拿出40万或50万。但是这个多拿出来的钱，并不会增加他的股权比例，也不会在报表里体现实收资本增加，他只能放在资本公积里面，它也是股权溢价的一种方式。


    在所有者权益里面，实收资本和资本公积其实都可以代表一个企业的实力，就是企业的自有资金，也可以说是股东投入的本金。然后那个库存股，其实现大家顾名思义也知道的。然后它为什么会出现一个减库存股呢？这个减库存股，这有可能是就不属于企业，要在资本公积里给减掉，我不再展开赘述。下面这个盈余公积，其实是根据每一年净利润来提取的。


    所以我从一开始就说了这三张表的勾稽关系，当时我提到说这个未分配利润，它其实加加减减以后一定要跟利润表里边的净利润要能够有推导关系。加加减减以后有这种数据的，很简单的加减的逻辑关系。它的逻辑关系在哪里呢？我首先说一下，如果未分配利润这里是负数，就代表企业是亏损的。那这个企业亏损，它是一个什么情况呢？你看这个资产负债表，它有两列，有一个期末余额，有一个期初余额。它这个期初余额，有的报表也叫年初余额，后边有一个期末余额，这个期末余额是指一个月的最后一天。为什么期初余额指的是年初余额的情况下，它怎么不叫年初余额呢？它是为了跟期末余额相对应。


    因为你前面写的是如果年初余额，你后边要写年末余额才有对比性，才有可比性。因为会计也比较严谨，所以呢，它为了照顾后边这个期末余额，所以这个地方它就叫期初余额。所有的资产负债表，无论它是哪个期间，只要说期初余额，就一定指的是年初余额。像我这张报表，它指的就是2018年的12月31号，也就是2019年的1月1号的零点。


    那这个利润表和这个资产负债表体现了勾稽关系，在未分配利润这个会计科目里边怎么体现呢？这个未分配利润的期末余额一定等于这个资产负债表未分配利润的年初余额，加上利润表里的本年累计数的净利润，就是说净利润的本年累计数，加上资产负债表未分配利润的期初余额等于未分配利润的期末余额。但是呢，真正的财务在做报表时，他并不是这么加加减减做出来的，它是由会计凭证自动生成的。所以很多企业，他在编制假报表的时候，他总是对不上，他顾了这个数，那个数又冒出来了，因为它这个数之间都有逻辑关系，我等一下会再介绍它们之间的逻辑关系。


    刚才我在介绍未分配利润这个数的时候，我有说到它跟净利润之间的勾稽关系，这里边的勾稽关系，还要受到盈余公积的影响。这个盈余公积是什么意思呢？


    其实可以根据资本公积来理解，我刚才讲到了这个资本公积，指的是更多的是股本溢价。当然资本公积包括的不仅仅是股本溢价，为什么我这么说呢？假如说我是一个医院，别人捐赠了一栋楼给我，或者捐赠了一套很大型医疗设备。然后这个医疗设备占我整个医院的总资产的比重比较大，他捐赠的东西一般都作为资本公积。为什么呢，因为你捐赠的东西不属于你的收入啊，它不属于你经营活动。它不产生现金流，它不是可以直接放在货币资金，或者放在收入里面的，它就形成了你企业的一种资本积累。当然不是所有的捐赠都可以放在资本公积里，比如说它捐赠了一个很小的东西给我，然后当期我就把它消耗掉了，我就不能放在资本公积里面，资本公积它一定要能够形成我企业沉淀的，而在捐赠的时候，能放在资本公积一定是交过税了。


    我刚才举了一个例子。比如此说别人捐赠了一栋楼给这个医院，对于这个医院来说，它其实不是收入。如果是收入，它实际上又收多了一样东西。如果你把它做成收入就会影响利润表里的数据，利润表会让当期的利润变大。所以这个接受捐赠的东西是不能归到利润表里面去，因为利润表它会影响当期的利润。当期的利润，企业可以分红，可以根据利润来分配给股东。但是有的时候不是因为你企业经营业绩好，不是因为你的经营成果优秀，你形成了未分配利润，你才能给股东分配利润。如果接受捐赠的大型资产被我直接当利润给分了，这初衷就变了。比如说有一些捐赠不是政府款，只是企业自发性的，民间这些捐赠，一些公益性或者非公益性这些捐赠，他本意是让你企业发展壮大的，形成你企业工具的，形成你企业的资本积累的，而不是让你现在马上拿着这个钱实现的。所以呢，从这种角度上来说，放在利润表里也不合适。


    还有一个问题就是税收方面的影响，你如果放在利润表，你给它放在收入里边，收入是要交税的。这个收入交税，其实不仅仅是只交一个流转税。说到流转税，我就再解释一下，流转税之所以叫流转税，它是流转额，就是你只要发生了流转，比如说你一块钱买的，你五毛钱给卖了，或者你一块钱买的，两块钱给卖了，我不管你是亏还是赚，总之以你的流转额，以你的销售额来征税，这叫流转税。


    然后我们拉到这个利润表，看到第15项利润总额，下面有一个所得税费用，这个所得税费用它呀是根据利润来征的，它就不是我们刚才说的流转税。管你有没有利润，你只要发生流转就征税，也就是现在所说的增值税，现在没有营业税了，营业税之所以叫营业税，它是根据营业额来征的。增值税之所以叫增值税，它是根据增值额来征的。那我刚才说了你哪怕一块钱买的东西，你五毛钱给卖了，你没有增值，你也要交增值税。为什么呢。因为国家就觉得你明明一块钱买的，你非用五毛钱卖了，他就算给你一个四成销售价，他不按照正常销售价。因为正常一个人没有说把这些东西以比它的成本更低的价格卖，如果他这种以比成本还低的价格卖，有几种可能，第一种可能扰乱经济秩序，故意的。比如说我们现在买卖二手房，有的时候它不以你去开发票的价格，也不宜你贷款的评估价，而是税务局会给你一个评估价，这个价格叫公允价格。因为他认为你低于本钱卖的商品，是不公允的，所以他给你评估一个价。所以这个时侯就算你是低于成本卖的，他也认为你有增值。但是还有一种情况，确实是市场经济不好的时候，你就低价卖东西，但是你低价卖，因为增值税它是可以跟进项抵扣了。这个我越讲越复杂了，所以我就略展开了。那我这里面其实主要还是为了让大家理解这个所得税费用，这个所得税费用其实它是针对所得税的，你企业有利润，有所得才征所得税。


    然后呢，我们刚才其实还是为了说资产负债表里的资本公积，那这个资本公积，它是这样的，因为它不属于你的收入，如果我们不给他放在资本公积里，你给它放在收入这个科目。因为你接受捐赠，你企业的资产变多了，你必须要在报表上有体现。那你有体现的时候，如果放在收入里面，因为你不属于流转，如果你放在收入里面，那你就得交税了。但是国家他征税，他也不是胡来的呀，所以这时候就放在资本公积里了。但是呢，你所得税要征，因为你有所得它就是根据利润来征的，你白白接受一项捐赠，你的净利润其实还是高了。


    那所以呢，它会根据你收到的东西给你评估一个价，先收你一些所得税，他评估你这个利润率。比如说医院接受捐赠一栋楼，这一栋楼的市场是一个亿，他不会按一个亿来跟你征，这一亿他给你核算一个利润率。比如说他给你核算利润率是10%，他用一个亿乘以10%，乘以企业所得税税率25%。那你入账的时候，你只要7500万在这个资本公积里就好了，你剩下的所得税费用就反映在利润表里的所得税费用里边了。


    回到那个盈余公积的问题，盈余公积它是根据利润分配的计划，这个利润分配的计划有两个方面的约束。第一，公司法的约束；第二，股东之间的公司章程里面会约定利润分配的原则。一般情况下，盈余公积以不高于净利润的10%分配原则，你可以自己计提。如果有净利润，你就按净利润的10%计提放在盈余公积里。所以这个+的时候也就是你的盈余公积是10%，未分配利润是净利润的90%，你们两个相加依然跟刚才我说的资产负债表和利润表的勾稽关系不矛盾。


    所有者权益下面有个归属于母公司的所有者权益，下面有个少数股东权益，这个是什么意思呢？比如说我们这个公司，假设说属于集团公司，或者说有多个股东的公司，怎么样才能被称为母公司呢，就是有一个它能够持股超过50%。也可以是大于50%的，它就可以被称为母公司，它就是控制了一个企业。最简单的体现就是在持股比例上，比如说这个企业形成的净资产，它是按股份的比例归属于股东的，那这里就是归属于控股权超过50%的那个最大的股东所有者权益。下面的少数股东权益，假如说两个股比一个80%，一个20%，当然这指的是那个少数股权的权益了。


    然后这里面说的是所有者权益，因为我想着大家无论如何都有一定的基础了，所以我就脱离会计基础再讲一些问题。现在市场上说的最多的话题，说的是在看一个企业情况的时候，比如说它的负债情况，它的经营状况，它的财务杠杆的大小，不是说传统的就用一个资产负债率来衡量，就会说一个叫净负债率。他所说的净负债率就是用所有者权益，这个净资产为分母，分子是负债。他就不再简单单纯的直接用一个负债除以资产总额这样来比。


    我刚才说的还不够准确，真正的像在说净负债率的时候，还需要有息负债、无息负债之间的区分。比如说你的有息债，你有多少现金可偿还，他也会把它递减。然后这个所有者权益，我这里列的其实是专门针对不是说融资手段很复杂的企业，大家如果看碧桂园，恒大，他们那些可以发债的企业的报表，他会有永续债这个东西。这个永续债也是放在所有者权益里面，因为它可以一直延续，它不会说在短期内偿还。当然永续债是受特定
    的条件限制，有很严格的条件限制的情况下才可能成为永续债。所以一般情况下，投行或者是说投资者在看这些企业报表的时候，看它的净负债率的时候，会把永续债从这个所有者权益里面给你剔除，因为它并不属于真正意义上的企业的净资产积累。


    虽然时间越想，但我还是想再接着说一下。我刚才把所有者权益说了一下，我们还是回到资产负债表上面的内容，比如说流动资产，这个流动资产里面我要说的是什么呢，它这个为什么分类不同，比如说货币资金为什么要跟交易性金融资产区分开，这个为什么会有区分呢？它有多方面的原因，第一个在税收的认定上，它有很大的区别，我等一下告诉大家区别在哪里。还有它们本身核算的内容区别很大，经济用途不同，比如说这个交易性金融资产，它指的是什么呢？就是我买回这个金融资产完全是为了交易的，比如说买股票。企业持有这个股票仅仅是为了交易，它只是交易性的金融资产。那其实现金融资产不仅仅包括了股票，还包括了债券，但是有的我买的债券也很短期，比如说三到六个月或者一年内，或者我随时就把它变现了，我只是为了赚取这一个差额。这个时候无论你是股票还是债券都放在交易性金融资产里面。比如说有可能还会买一些票据，那这个非流动资产里面有一个可供出售金融资产和持有至到期投资。


    我刚才有说这报表它都是从上到下按照流动性的顺序来排列的，那就可以看出交易性金融资产，持有它的目的是为了短期内变现，而如果你持有 一项股票或者一项债券，你是要持有到期的。票面上有到期日，你持有这项票据的目的就是为了持有到期，可能你跟别人签的有什麽协议，有什麽约定之类的，或者是说你本人的经济用途，你就是想持有到期，你就放在持有至到期投资里
    边。那这个时候假如说中间我改变主意啦，我又可能拿到三到六个月内，或者什么时候就把它给卖了，那这时候它又跑到交易性金融资产这个科目里面来核算了。


    然后说上面呢，比如说这个应收账款和其他应收款，这两个是什么区别呢？它两个就好比应付账款和其他应付账款的区别。你看负债的流动负债里面有一个应付账款，有一个其他应付账款，流动资产里面有一个应收账款，有个其他应收款，它们有什么区别呢？应收账款和应付账款是站在本企业的角度上，对外的一些应收账款，应收没有收回来的债权和应付而未付的负债。流动负债是外单单位的，其他应收款指的是内部单位的，比如说关联公司或者内部员工的借款，我们收到一些押金什么之类的，内部的这些，而且是由非主营业务产生的债权和债务。比如说其他应收款和其他应付款，它是对应的，一般情况下指的是关联单位之间的往来，或者内部的一些往来。


    然后说这里面呢我也不展开讲，那我其实现想多说一点的是非流动资产里面的长期股权投资，其实大家也能理解，我就不说了。我就说这个投资性房地产，固定资产和在建工程，其实这里面影响税收特别严重。投资性房地产指的是持有的目的是为了让渡资产的使用权而赚取收益。什么意思呢？我买这个房子不是为了自用的，比如说作为办公楼或者是什的，过一段时间，我坐等它升值，我给他卖了。或者是说我为了出租的，这个时候这些东西就放在投资性房地产。那有些人可能会想了，既然是这样，那为什么不把它放在固定资产里面呢，固定资产里面它也包括房屋，建筑物。其实我们企业所拥有的房屋建筑物，它分布在三个会计科目里面：第一个流动资产里面的存货，第二个投资性房地产，第三个固定资产。它分布在这三个会计科目里面有非常大的区别，如果这个房屋放在存货里面，一般情况下是开发商，房地产公司它开发的这个产品是为了出售，它就放在存货里面。如果说开发商建了房子，我不准备销售，我只是作为以后自用的，或者我留下来作为商铺出租，如果作为商铺出租，那叫投资性房地产，如果办公自用，就是固定资产。


    那它两个为什么还要区别呢？对于企业自用的房产是需要征房产税的，按房产原值的70%乘以1.2对自用房产征房产税。但是如果你这个企业持有的房产是为了卖的，比如说你是房地产开发商，你拥有再多房子都不征房产税，因为它放在存货里边，它是你的商品准备代售的，你持有它不是为了自用的，你是为了销售的，所以它放在存货里面，所以它不征房产税。


    那同样的比如说投资性房地产，你买回来，假如说你是为了赚取租金，虽然会计科目上你把它放在投资性房地产，但其实你也是在自用，你有利用它增值。国家通过房产税其实是来压制富有人群，劫富济贫。即使你不放在固定资产自用这个会计科目，而是放在投资性房地产里面，你只要进行出租了，依然对你征房产税，只是这个时候房产税的计税依据就成了租金收入。


    然后另外这里面还有一个问题，营改增之前，针对房地产行业或者房屋建筑物这些东西，他是征营业税的。征收营业税和增值税有一个区别，增值税顾名思义它是根据增值额来征的。这是什么意思呢？我买原材料的时候只有100块钱，但是我卖200，它是可以进行抵扣，就是我100块钱买回来的，它的增值税可以从我这200块钱销售额里面进行抵扣。但是在营改增之前，由于房地产行业它是征营业税的，所以它那房子增值税是不能进行抵扣的。这是其中的一个问题。


    还有一个问题，后来营改增以后，2016年5月1号，全中国所有的行业都征收增值税，在房地产也属于增值税企业的时候，虽然说我买的这个固定资产，这个房屋子里边含有增值税，国家依然不允许增值税进行抵扣。后来有一段时间，国家就说了固定资产买回来含的增值税可以抵扣，在你销售额里面抵扣。但是呢，他不允许你一次抵扣，比如说分阶段抵扣，在两年内抵扣，比如说先抵扣60%，剩下的40%留到第二年第三年，或者是说先抵扣40%，后来的60%留在什么时候抵扣。这是中间一段时期。


    现在是什么意思呢，现在是你只要买回来的固定资产，它所含有税一次性当月都可以抵扣了。这体现了国家在鼓励固定资产投资，他以税收补贴的形式来鼓励企业进行固定资产投资。跟所有的行业相比，房地产行业的税收还是非常高的。


    为什么之前你买回来的房子里面明显含的有税，不能进行抵扣，是不是企业在固定资产里面就承担了。而这个固定资产，国家又规定折旧年限，所谓的规定折旧年限就是说这个固定资产可以当费用支出扣除，遇到利润表里面影响利润。它规定的有年限，比如说房屋建筑物不得低于20年。它又不允许你购进的房产在短期内折旧，所以把它分摊到一个很长的时间内，这样每年对你利润的抵减金额就会变小，你当期的利润有可能就会变大。变大以后你可能还要交所得税，所以之前的税金不允许抵扣，这个税金就被企业承担了。国家为了鼓励工厂投资，它就规定两年内可以抵扣，先抵扣60%，后来抵扣40%。后来国家觉得这样力度还是不行，然后就直接当期一次性抵扣。比如说现在一套房屋建筑物，光增值税含有了九个点的税，也就是说你100万的房子里面有9万的税，当时你是可以直接抵扣你当期的增值税的。所以这个其实就是国家对固定资产投资的一种非常明显的鼓励，它就从这里面体现了。


    所以我们这个资产负债表现在在的固定资产科目核算的内容是不含税的，你这个税金已经当期抵扣了。而且现在国家还规定，在2019年，很多企业都退了很多税，就是说你买回来的东西太多了，里边含的税太多了，可是你今年销售额非常差，你没有什么增值额，你很多以前买回来的东西税没有抵扣，你可以去向税务局申请退税，所以很多企业都退了很多税。


    有时候我经常交流我的顾问单位，我就跟他们讲有一些东西你尽量不要放在固定资产里面，你就放在最下面的长期待摊费用里边，要么放在工程物资里面，或者放在在建工程里面，不要放在固定资产。为什呢，我就是避开房产税。房产税暂行条例里面有写，必须要达到交付使用条件的房屋，必须能够满足人们正常的工作生活学习需要的东西，才叫房产。所以呢，可以暂时不验收，如果是我企业自己的房子，我不考虑融资，贷款拿抵押，因为抵押必须有房产证，如果不考虑这个问题，就可以以后再确权。我就给它放在在建工程里面，不搞在固定资产里面。这样的话呢，房产税会少交很多。因为房产是按照原值的70%的1.2征，每年都征。


    还有一个方法，在确权的时候，把房屋的价值变小，房产税的计税基数变少。但是这里边就有一个问题，在银行贷款的时候，评估值的时候它可能就变低了，但是影响也大不，因为现在评估都是按照市价，它不是按照原来的成本来评估。当然，还是会受一定影响。


    资产负债表的左边我就来介绍这些，然后后边的负债，像这里边短期借款和长期借款，其实这两个的区别也是以年为单位。比如说一年内需要存款的银行借款才叫短期借款，如果我是跟其他非银行的金融机构，或者说是民间的一些借款或者其他形式的一些融资，他们都不放在短期借款和长期借款。短期借款和长期借款，正常情况下指的都是银行的融资。

