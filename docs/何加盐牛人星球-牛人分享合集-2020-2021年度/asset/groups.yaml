    的呀，所以这时候就放在资本公积里了。但是呢，你所得稅要征，因为你有所得它就是根据利润来征的，你白白接受一项捐赠，你的净利润其实还是高了。


    那所以呢，它会根据你收到的东西给你评估一个价，先收你一些所得税，他评估你这个利润率。比如说医院接受捐赠一栋楼，这一栋楼的市场是一个亿，他不会按一个亿来跟你征，这一亿他给你核算一个利润率。比如说他给你核算利润率是
    10%，他用一个亿乘以 10%，乘以企业所得税税率 25%。那你入账的时候，你只要 7500 万在这个资本公积里就好了，你剩下的所得税费用就反映在利润表里的所得税费用里边了。


    回到那个盈余公积的问题，盈余公积它是根据利润分配的计划，这个利润分配的计划有两个方面的约束。第一，公司法的约束；第二，股东之间的公司章程里面会约定利润分配的原则。一般情况下，盈余公积以不高于净利润的
    10%分配原则，你可以自己计提。如果有净利润，你就按净利润的 10%计提放在盈余公积里。所以这个+F时候也就是你的盈余公积是 10%，未分配利润是净利润的
    90%，你们两个相加依然跟刚才我说的资产负债表和利润表的勾稽关系不矛盾。


    所有者权益下面有个归属于母公司的所有者权益，下面有个少数股东权益，这个是什么意思呢？比如说我们这个公司，假设说属于集团公司，或者说有多个股东的公司，怎么样才能被称为母公司呢，就是有一个它能够持股超过
    50%。也可以是大于 50%的，它就可以被称为母公司，它就是控制了一个企业。最简单的体现就是在持股比例上，比如说这个企业形成的净资产，它是按股份的比例归属于股东的，那这里就是归属于控股权超过
    50%的那个最大的股东所有者权益。下面的少数股东权益，假如说两个股比一个 80%，一个 20%，当然这指的是那个少数股权的权益了。


    然后这里面说的是所有者权益，因为我想着大家无论如何都有一定的基础了，所以我就脱离会计基础再讲一些问题。现在市场上说的最多的话题，说的是在看一个企业情况的时候，比如说它的负债情况，它的经营状况，它的财务杠杆的大小，不是说传统的就用一个资产负债率来衡量，就会说一个叫净负债率。他所说的净负债率就是用所有者权益，这个净资产为分母，分子是负债。他就不再简单单纯的直接用一个负债除以资产总额这样来比。'
