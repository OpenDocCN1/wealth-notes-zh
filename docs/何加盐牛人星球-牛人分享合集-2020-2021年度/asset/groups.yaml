    个家庭，其实也不多，我们的心态就是为这些客户服务一辈子。因为他们会不断的加保，有人结婚，有人结婚离婚，生孩子，生一个，生两个。或者有些人从小老板变成大老板。就是我们很在乎这个长远的关系。


    但反过来是不是其他行业就不重视这个关系呢，其实也不见得。我建议大家还是做一个长情的人，但这个长情并不是说没有原则，就是这个人跟你三观不合，你一定要跟他保持联系？不是，我如果那种三观相同的人一定要去珍惜，不要在乎现在做不做的成生意。


    我在 30 岁的时候，也曾经犯过错误，有一段时间我就特别的高傲。在 30 多岁的时候在广州买了一套 180 平的房子。因为我认识了这边有这么多老板嘛，达标了什么全球
