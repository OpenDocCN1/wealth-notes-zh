    我们的三个心法，第一个心法是事无好坏，<|message|> 诠释在人。我们要把孩子当成一颗种子。第二个心法是，表扬，是为了未来不依赖表扬。第三个心法是，经营孩子有三个层次，我们要能够从经营知识、经营习惯上升到经营孩子的感觉。


    我们的五个招法是，让孩子做善而长善；表扬孩子，多用“你就是”这样的句式；经常对孩子表达崇拜；沟通时多用“我句子”替换“你句子”；在家里面多谈一些有营养的。通过我们自身的成长，通过家庭氛围的构造，为我们孩子的培育和成长打下一个非常好的基础。


