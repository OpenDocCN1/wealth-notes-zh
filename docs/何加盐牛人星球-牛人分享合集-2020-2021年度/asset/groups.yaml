    ### 招法三：把“你句式”替换成“我句式”。


    比如说婆媳之间，老人给孩子吃糖，妈妈看到了之后就会说：“啊，妈，你怎么又给孩子吃糖呢？那牙不坏了吗？你怎么总是这样啊？”老人一听就很生气：“我也是为孩子好，还不是为了让他长身体吗？”然后，两个人就争执起来了。老人就说：“我帮你做饭、收拾卫生，我帮你干这么多活儿，我没有功劳还有苦劳呢。”这个就是你句式，你怎么怎么样，其实，那是指向别人，这是在指责别人。换成“我句式”的说法就是：“妈，我知道你给孩子糖，是为了让孩子多吸收一些营养，但吃糖对他牙齿不好，我是担心他未来牙齿不好之后，对他的身体持续健康有影响。我相信，妈你也不想让这个孩子有一口坏牙。”这么一说，我相信老人一定能够听得进去。又比如说，孩子写作业，写一下，在那玩一会儿，摆弄摆弄手指。一般的父母就会说，你怎么又不专心？你怎么总是三心二意的？其实，换成我句式就是：“我小的时候呢，做一件什么事儿也很难


