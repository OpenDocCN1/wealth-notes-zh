    # 因而相信而看见


    ![](img/d43ec9f811a059e999583aaeac906d81_27_0.png)


    第三个关键的认知是“因而相信而看见”。我们总是说“眼见为实”，一件事情我只有看见了才会相信他。但是实际上一个成功的人，他都是先相信再看见的。这点马云就最明显了，他在1999年十八罗汉大会的时候，他就告诉所有人，我们企业要活102年，我们几年之内要上市，我们要成为全世界最大的电子商务企业，我们要成为全世界最伟大的企业。他看见什么了？他什么都没看见！他只是有这个信念而已。


    这个特质有可能是富人跟穷人最关键的特质之一，也有可能 despair 成功人士跟失败人士或者跟平庸人士最关键的分野之一。


    你看我们普通人去做一件事情，总是会想，我现在有什么能力、有什 么资源，因此我可以设定这个目标，因为我符合它的条件，所以我去做这件事情。实际上你要获得巨大的成功，要怎么样啊？你得反过来，你先想我喜欢什么？先把这个目标给设定了，然后一看，我的资源不匹配、能力达不到，怎么办？那你就创造条件让它实现啊，缺少资源你就找什么资源，哪方面能力不足，你就练哪方面的能力。所以一个人要实现一个伟大的人生战略，必须得是因为相信而看见。


    我们把上面的东西总结一下，首先什么是人生战略？人生战略就是明确若干年以后我要成为什么样的人，要达到什么样的成就。而人生战略管理是掌控自己未必来的一条必经之路，所以我们一定要学会制定战略，然后学会战略管理。人生战略的实现最主要的是做出选择、学习方法、保持动力。'
