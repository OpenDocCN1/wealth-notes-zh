    # 干部标准通用框架/干部四力


    华为的干部通用标准就是人才选拨的从 4 个维度，第一个就是品德，那怎么讲品德，品德不是用来考核的，平时也不会关注，那品德会在什么时候看呢？在管理者有没有出现什么关键事件，比如说贪污了，或者说发生什么不正当的关系等等，或者类似涉及到品德底线问题的时候，不管多优秀，只要你一旦做了这些事情，不好意思，那你就再也没有机会了，这就是不考核，但作为底线要求，这是一个基础，就是你不要去碰红线。


    第二个就是核心价值观与使命感，作为一个管理者，你必须能够充分的去理解公司的核心价值观，并且时刻保持着对企业的使命感。这是最基本的能力，如果这条都没有了，那就不用说了，肯定没机会，也不可能担当大任。


    真正选拔干部最重要的分水岭是绩效，也就是说干部要会打胜仗，在华为干部选拔的时候，我们一定会优先看绩效的。我们认为那个常胜将军至少说明他在现在这个岗位上，是能挑
    100 斤，那就他应该可以挑 150 斤甚至 200 斤，那我们就会把他往上提一级，让他到对应的岗位上去锻炼。那上去了是否胜任？判断的依据是在对应考核期的绩效，是否能做出该岗位对应的贡献即绩效。


    所以干部选拔分水岭首先是绩效，绩效是证明他在这个岗位上的胜任力是没有问题的，而且是轻车熟路的，然后才可以再往上拔，往上拔上一个职级去做上一层领导，然后再去考核，再看是不是能够挑的起来，只要能够挑起来，就能够继续往上，如果不能，那可能就没有上升机会了。我们认为只有一段成功的经历才叫经验，否则只叫经历。所以能力与经验就是这样作为选拔每一层干部的关键要素。'
  - '[PAGE 152]


    华为为干部的领导要求最重要的 4 个能力，对基层干部最主要的就是要求他有执行力，对中层要求最重要的是理解力，高层最重要的是决策力。


    什么叫基层要执行力？做一个基层管理者，最基本就是能带众做项目。怎么去训练基层管理者？就是做项目，不断的通过一个个项目，通过持续不断的打胜仗来证明你在基层管理者的能力和经验是没有问题的。完成了上升到中层管理者的理解力，那怎么去训练中层管理者？最核心的是让中层管理者轮岗。通过上下游岗位、横向跨部门岗位轮岗，比如研发到测试，再到质量或
    HR，让人才能上能下，能左右这样跨岗位跨职责的去轮岗，通过轮岗，扩大视野，并提升理解力，更好的理解公司岗位上下游、周边跨部门协作关系，提升个人能力与技能的同时，还学会看问题的视角不会只站在自己的角度，视野会更宽，这对很多企业来说要做到轮岗是有难度的。但轮岗对于管理者来讲是很有意义的一件事情。


    最后对于高层来讲的话，就是怎么证明一个好的中层，提放到高层以后，是具备决策力呢？首先是会有个试用期，每一个管理者都有一个试用期，然后把高层放到一个可能不太好的区域去做这个区域的提升，比如说这个区域在新高层的打理下能够扭亏为盈，或者说这个组织在高层的管理下，组织氛围由坏变好，又或者说这个组织在高层的打理下，能够挑战承担组织想要实现的目标任务等（比如华为手机业务）。只要做到了，某种程度上就证明你的决策力是没有问题的，你能够承担公司的更高战略目标。总的来讲，华为主要是通过这些方式训练干部的
