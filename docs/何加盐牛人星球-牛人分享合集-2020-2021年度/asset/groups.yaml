    5 年之内会发生，也有可能 10 年之后才发生。这个我们不能把所有的东西全都压在里面，除非你已经看准了。确实是它已经带来了一个新的技术革命级的东西，那你就可以全情投入，像马云一样。


    另外一个，如何寻找变化中的机会呢？那就是寻找不断变化之下的永恒的不变的东西。我昨天发了一篇知识星球的文章，在变化的世界中寻找永恒。我讲到诺基亚和柯达为什么会失败？表面上看是因为时代变了，他们没有变。但实际上我们再仔细地分析，他们最根本的失败不是因为没有变，而是因为没有做好不变的那一部分。哪一部分？就是他们没有把自己的主业聚焦在消费者真正关注的那个不变的需求是什么？


    比如说，诺基亚做手机，其实我们需要的不是手机，而是信息更快速的、更便捷的流通。当一个新智能手机能够用语音、用图像、用社区的方式，实现信息更快速、更便捷流通的时候，那种功能手机就不再是我们需要的了。所以表面上看是从功能手机变成智能机，实际上不变的还是人类对快速、便捷、准确的信息流通的一个需求。


    我们需要相机，要的也不是相机，而是怎么样更方便、更清晰地留下我们想要保留的那一个瞬间。所以表面看是胶卷相机啊变成数码相机又变成了，现在的可拍照的手机，实际上不变的还是那个内在的需求，拍照的需求。


    所以不管是个 人还是企业，如果我们能够找到一个产品、一个行业表面的变动之下，这种本质的、不变的永恒，那我们可能就知道未来我们哪些东西应该变，哪些东西不会变，做了哪些，我们就永远不会被时代淘汰。比如说我做一个卖货的、卖商品的东西，不管是网上的店，还是网下的超市，你永远要做到的就是多快好省，当然你有可能会不会全部做到，但是你能够把其中的一个做到极致，把其他几个做到中等水平，你也就可以在商场上立住脚。


    除了这些人们的消费需求底下隐藏的不变之外，我们还可以以更深的一层去寻找永恒的东西。比如说人性中的永恒的东西，我们每个人都会去追求真善美，所以如果你能够为这个世界创造真善美，你永远会受到尊重，永远会找到市场。当然人性中也有很多不好的，但是也是永恒的东西。比如说人都会贪婪，都会好逸恶劳，都会爱吐槽，爱骂人，都会有犯傻的时候，所以无数商业其实是针对我们这些人类永恒的弱点而设立的。像抖音就是针对我们不爱动脑子的弱点，拼多多是针对我们贪贪便宜的弱点，这些种游戏是针对我们容易上瘾的特点。所有种种永恒的不变的东西，如果你能找准、并且围绕它设计一个商业模式，我们不说它是好是坏，商业模式本身没有好坏，看你怎么去利


    用，我只是指出来，围绕这些人性的永恒，你可以去设计你的商业模式，来应对这个时代的。


    其实我们每个人都可以想一下，你所从事的行业里，有哪些东西是在发生剧烈变动的？这个变动的背后，有没有体现的一些永恒的东西？如果你能抓住这一点本质，围绕这个去做文章的话，那有可能你对未来的规划，是会完全不一样的。比如说我是一个写文章的自媒体人，我可能会看到说，公众号会不会越来越没有人看？这是一个变化的东西。但是我会看到一个不变的东西是什么呢？人们对于高质量文章的需求是永恒不变的。任何时候人类都需要阅读高质量的文章，所以这一点是永恒不变的需求。那么我会认为，如果我能够围绕这一点来提升自己的能力，这有可能会是我未来长期立于这个世界的一个立身之道，而不是去花费很大的力气研究公众号没有了我该怎么办？我是不要转做视频？当然我也可以去转做视频，但是本质上还是要围绕着人们喜欢高质量的内容这个需求，所以我还是要找到背后的永恒的东西在哪里。


    上面我说了三点。如何应对世界的变化？第一个是从意识上要改变求稳，追求安全感的这么一种状态，要学会拥抱不确定性。第二个是要学术元壤高筑墙、广积粮、缓称王。第三个是我们如何在剧变的世界中寻找大机会，或者说寻找持续的机会，寻找大机会就需要发现一个未来有可能成为技术变革，革命性的技术变革的一个东西。然后扎进去，寻找永恒。怎么寻找变化中的永恒呢？首先我们要看到变动背后的实质不变的那个东西，其次我们要善于发现人性中永恒不变的东西，比如说对真善美的追求，人性中不磨灭的贪婪嗜欲的这些缺点等等。如果能够围绕这些来设计模式的话，我们就可以在不变的世界中获得持久的优势。


    不知不觉讲了一个小时，上面说的这些主要是从心法的层面给大家一些启发，它不是具体的招数，所以你可能不能直接套用在某一个行业或者某一个个人、某一个企业上面，但是我希望通过这个，大家能够从更底层一点的这个地方去思考，这个世界为什么会变？为什么会如此地变？未来会进一步怎样变？然后我们又要怎样去应对？如果我们能够从这个底层去思考的话，我们很多时候对于未来的规划，对世界的认识可能就都不一样了。那今天就讲到这里。


    最后我想说一下，2020 年即将过去，大家都挺过来了，今年挺不容易的。

