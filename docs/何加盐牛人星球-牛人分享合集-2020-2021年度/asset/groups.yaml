    ## 华为的核心价值观


    ![](img/d43ec9f811a059e999583aaeac906d81_129_0.png)


    一切以客户为中心，为客户服务是华为存在的唯一理由。成就客户，实现价值创造


    上面说的这些只是一个开篇，做一个简单的分享，下面进入正式分享。

    华为的核心价值观大家都很熟悉，我就不多说，但是我想重点提的是什么叫成就客户，或者说为什么在日常工作中，给我们造成深刻影响的是成就客户，日常工作中，我们始终不断抓紧一根弦，就是如果我们所做的这些事情不能给客户


    带来价值，不能解决客户的痛点问题，不能帮助客户，不能因为我们给客户解决痛点问题而带来好的或者优秀的解决方案。那在我们的评价体系中会认为很多工作都是无效的，所以在企业管理当中就更加强调客户是我们衣食父母，引导员工关注客户。


    只要我们真正做到以客户为中心，那么华为所提倡的艰苦奋斗，自我批判，开放团队合作等等，都是自然而然融在日常工作当中，关键的是你的发心有没有一颗利他的心，就是能站在客户的视角去思考问题解决问题。当然很多人可能会觉得这人力资源的工作是什么？人力资源工作的客户是什么？以及说，我们人力资源怎么去成就是客户，这其实是个很有意思的话题。在很多企业里面，大家也会去思考，包括对人力资源的考核评价体系，很多工作很难量化，后勤职能岗位该如何体现成就是客户等等。


    这里我结合自己多年的经验也有一些心得，我觉得人力资源的客户可以从三个层面去讲，第一个的是企业，也就是老板，做 HR 的肯定是要坐个在公司，就是任何时候要明确自己向着谁，这是第一个客户；第二个，就是业务部门，也就是我们讲的
    HRBP 当中的 Partner，HR 支持的业务部门的部门负责人和部门领导；第三个，就是员工，其实员工也是你的客户之一，因为你要思考如何激发员工，或者说如何提升员工在企业当中的归属感，辅帮和协助企业去帮助公司激发员工的积极性，落地执行文化等，其实这些都是人力资源的工作职责之一。只要我们做到了这些，自然而然的就能帮助业务部门，实现间接面向客户。


    下面我讲一个大家可能会比较感兴趣的内容，就是关于人力资源这个组织在华为是怎么运作的，它的组织架构是怎么样的，会包含哪些部门？原来看我想把这个信息图分享给大家看，但太复杂了，因为华为的人力资源是一个非常庞大的管理体系，它其实是环环相扣，在人才的选用留方面，在制度和流程，以及各个模块的管理方面，都有非常完善的管理制度和体系，现阶段采取人力资源三支柱模型支撑业务发展。


    ## 人力资源组织运作模式


    ![](img/d43ec9f811a059e999583aaeac906d81_131_0.png)


    ![](img/d43ec9f811a059e999583aaeac906d81_131_1.png)


    三支柱模式讲的就是三驾马车，COE 是专家队伍，SSC 是共享服务中心，还有业务合作伙伴 HRBP。那很多人都很好奇，SSC 人事共享服务中心到底是怎么做？其实我们在早期
    2007 年的时候，人力资源不是三支柱模型，而是经历了人事变革，像 IBM 学习，请 IBM 的顾问来帮我们做人力资源的三支柱转型，将人力资源当中很多事务性的工作全部提取出来，然后分解到共享平台，成立专门的人事服务中心。这个服务中心感觉像银行的办事流程服务大厅，就像你到银行有专门的业务接待员，然后华为的人事服务大厅在公司总部设有专门一个大堂，针对每一类业务设置窗口服务，比如合同续签、离职手续办理等窗口。员工有需要处理相关人事业务时，就上网预约，按照预约时间，到店铺现场办理，办理完结给现场工人做一个评价和反馈，就可离开了。表面上看，这是一个窗口服务模式，但背后其实是有大量的流程包括强大的系统支持。说实话，很多企业很难做到这一点，很难实现自主研发。那对于中小企业，我通常建议他们用钉钉或者是企业微信去解决，实现一些无纸化办公。


    因为华为有强大的研发人员可以自主研发系统，就能解决大量基层的人事工作，这会把 HR 在事务方面的工作时间精力释放出来，让 HR 有时间和精力承担其他更多工作。比如，让经验更丰富的，专家路线，也就是
    COE 角色。他们负责我给大家那张白色的图片左边的那一列内容，包括给大家看的视频，是员工关系部（集团层的部门），他们负责从公司层面做集团标准化，输出公司管理需要的制度与流程，包括一些组织变革的动作，比如股权分配的调整方式，从原来的
    ESOP 到 TUP 的转变等等，这些都是在 COE 这个层面解决的。


    人力资源的第二大块工作，就是贴近业务解决业务中涉及人力资源管理方面的实际问题。我理解人力资源如果不能帮助业务解决业务部门在人的选育用留方面问题，他的很多工作是没有意义的。基于这个要求，人力资源就分裂出了一个角色叫
    HRBP，如图片的右边是全部 BP，事业群 BP 等。


    在华为组织架构复杂兼层级多，每个事业 BG 都有二级 COE，各层级都有 HRBP，各层级 HRBP 要跟一级 COE 保持对接，承接来自公司对人力资源战略或组织变革要求的一些动作，所以右下角的
    BP 职责基本都是相应的推行这些推行的。市场上很多组织都想做三支柱转型，也在思考如何推行 HRBP，事实上这个过程，要想做好 HRBP 是需要有对应支持的，总部集团的
    COE 支持就最重要，COE 负责提供解决方案，提供制度，提供流程，HRBP 贴近业务去了解业务所对应的需求，然后跟 COE 对接，制定出更符合业务发展需要的解决方案。


    ## V-CROSS模型


    ![](img/d43ec9f811a059e999583aaeac906d81_132_0.png)


    在这里，就华为的三支柱我重点讲下 HRBP 这个角色，因为很多人力资源工作最终都靠 HRBP 去落地的，或者说最终是靠 HRBP 在部门运作实现的。运作的过程中，就有很多灵活技巧，包括
    HRBP 在自己部门如何去设置组织绩效，以及如何去完成对应的招聘工作和招聘任务，以及干部管理，任职资格体系的运用等，都是可以在公司体系下，再二次精细化管理或再修订。


    华为人力资源的体系本身非常复杂，我本想把人力资源复杂的板块地图列出来给大家看，但是我觉得这样复杂的东西可能对大家的帮助不是特别大。那今天我重点主要是讲两个板块有趣的事吧。


    我觉得第一个比较有趣的事是招聘，为什么我要选招聘来讲，是因为我觉得选对人比培养更重要。还有一点就是我也觉得华为为什么能够在人力资源方面有所成就，相应来讲，在外界感受到的不那么明显的，其实很多时候是他的招聘工作真的和外面很多企业是不一样的，而这些管理动作是很多企业想学习华为也很难以到。


    如果今天在听的有老板或是某公司的 HR 负责人，我倒觉得有些地方是值得大家去借鉴和学习的。因为入口端抓严了的话，那么其实会减少很多后期人事处理的事情。在一些中小民营企业里，经常发现试用期需要处理一些你不想去处理的事，但有许多事情，事后看都是在前端入口没有把握好导致的。如果我们把前端把握好了，有很多事情是可以省去的。


    华为有一套相对强大的招聘录用流程，我现在把这个强大的招聘录用流程，或者是说相对严格的人才选拔流程分享给大家，可以跟大家细说一下。


    ![](img/d43ec9f811a059e999583aaeac906d81_133_0.png)


    我知道很多企业其实在做人才选拔的时候比较简单，可能就是 HR 跟用人部门约一下，聊个需求，完了以后就开始 HR 选人，如果觉得合适就交给业务部门面试，面完试觉得合适了，就开始走入职流程。那这个过程是否老板见过了（小公司是不是每个人老板都亲自面试），大一点公司的，这个人是不是部门领导或部门总监以上看过的。很多时候，在人才选拔上来说是没有那么严格，基本上就两轮面试，人员就决定了。但是在华为，整个面试流程是非常完善的，当然它和普通公司不一样，和一般公司不一样的地方就是可能在一般公司快的话一两天就可以发
    offer，但华为的 offer 流程时间特别长，为什么这么长？我给大家讲一下。


    首先，如果今年有大批量招聘任务的时候，只让 HR 独立完成是不可能的，因为 HRBP 是按照大概 1:150 左右配比，如果这个事业部大概 500 个人，可能就会配上三个
    BP，再加一个大 BP，最多就是 1+2 或者 1+3 的模式，最多再带一个 HR 文员（HR 助理）的一个架构。如果今年赶上招聘大年，部门需要扩展队伍，招聘任务大，就靠这些
    HR 来完成招聘，是远远不够也很难满足业务发展需要的。这时候我们通常会和业务部门联合形成一个作战团队，成立一个招聘任务小组。这个招聘小组的成员，不仅仅仅是招聘
    HR，还有招聘文员，再加上由各个业务部门筛选出来的狼筅干部队一起组成。华为为这个狼筅干部队角色是非常与众不同的，这在外面很多公司，让业务部门选人是很困难的，很难像华为这样，可以说，不论我业务部门多忙，都能挤出一个人来，2~3
    个月时间，甚至于 3~5 个月的时间去全职支撑做招聘的事情（因为中小公司基本一萝卜一个坑，工作不易被接管，所以其想学习这个模式要评估部门职责情况而定）。但在华为，不一样，这些狼筅干部队确实是组织未来要培养为基层领导或者中层领导而选拔出来的人才。


    那我们为什么叫狼筅干部队？因为通过这个事情，顺便也能够提升这个员工的管理人员能力，以及通过对人员的招聘工作，他会了解到人才的获取来之不易，那么在日后管理，就会更加珍惜和更值得去留用人才，这点是很多企业做不到的地方。


    由大 BP 和招聘 HR 带着业务部门一起选完狼筅干部队后组成招聘小组，招聘 HR 赋能给狼筅干部队，给他相应的账号密码，以及定点挖掘的企业和对应的岗位，包括招聘学校清单，一会跟大家分享招聘学校清单，这点也是蛮特殊的，是区别其他企业的做法。华为招聘学校主要来自
    211/ 985 的学校，也不是所有 211/985，我会发给大家分享一下。


    动机干部分先做筛选，选一批候选人约在周末统一面试，到周末，他专门组织一场周末的小型招聘会，HR 负责协调面试官，然后就进入招聘工作流程。


    首先说下面试流程，候选人到了以后，一般先做素质面试，这一关只有 HR 可以面试，然后做专业面试就是业务面试。业务面试也就是技术面试官会做一个业务能力评估，按公司任职资格标准，定一个建议的职级，比如说专业一级二级还是三级，HR
    也会有个人岗建议的职级，比如 13、14……，以前会有个集体面试，现在已经取消集体面试了。在专业面试和素质面试两个方面，都有—票否决权。HR 觉得合适的，业务部门可以否定，业务部门觉得合适的，HR
    一样可以否定，所有面试流程，只有这两个面试的先后顺序是可以调整的，根据现场招聘会，获选人等待时间而相应的灵活调整。只要这两关都通过以后，才会给候选人发一个人才测评，这个人才测评是当年华为发现很多员工有心理问题，特意增加了这一心理测试，这个心理测试题目是专门和上一知名专业机构研发的，一套题不便宜。这个测试通常需要
    2~3 个小时的时间，只有候选人测评结果通过后，才会交给综合面试官，综合面试官通常都是 19 级以上的总裁。在华为，最终候选人的定薪定级并不是由人力资源部门完成的，而是由综合面试官完成的。综合面试官都跟候选人谈妥后，才会进入到下一个阶段，就是
    BU 总裁资料审核的阶段，就是要把候选人填写以及面试官填写的所有材料带回去交给 BU 总裁审核，这一关，通常我们 10 个简历进去，一般都会被卡掉两或三个，大概也就剩
    70%~80%了。很多时候总裁他不看人，他就看简历和他填写的资料，在简历中他看到觉得有疑问的地方，我们无法解释到位，他觉得这个人有一些疑问，他就有权不录用，所以基本上很多人觉得我们华为招聘会很简单，好像有这个椰子很好招人，事实上是很难的，因为每一层都会有一个筛选关，所以其按照漏斗的原来来讲的话，我们可能筛选
    100 份简历，最后可能录用的也就不到六七个人，成功率也就是百分之六七这样，人才选拔过程就是这样逐层筛选逐层过滤的严格把关。


    最后即使 BU 总裁资料审核通过了，还要上交给一级部门的人力资源部门审核资料，一级部门招聘 COE，他会对资料进行严格的审核，因为所有的资料都必须按照公司的要求来填写，要规范的填写。包括简历空白说明，单亲家庭的说明或是测评结果，就某一项的特殊说明等，这些资料都是必须完备无误的，如果这中间有一个资料是不完备，还会打回来重新再审核。等所有资料审核完之后才会交给集团，也就是交给公司的人力资源去备案。


    招聘整个过程，是层层严格把关的，因为有这样一个严格把关的流程，一般来说，不会录用到一个错的人，但是不排除只是说相对错误的人概率是少的。但这样的流程，在我们现有的企业当中，做到这一点是很困难的，所有的管理者都会觉得很浪费时间，甚至觉得这是
    HR 的工作，而不是我业务部门的工作，但事实上招聘是业务部门和人力资源部门共同的工作，甚至可以是业务部门最核心的工作，其实 HR 要选对人的前提，或者说 HR
    做招聘的关键是先有准确的需求，但现阶段很多时候需求是不准确的，或者是需求是可以频繁变更的，会导致招聘的复杂度增加，或者说各种试错成本增加。


    我拿华为内外差异性做了一个对比说明，因为我在外面看到了一些现象，但在华为，我们不太容易出现，比如说需求不明确的情况，我们的 HC 都是非常严格管理，招每一个岗位，人力预测都是严格审核的。这是在人才招聘上面的第一个差异性。


    华为招聘流程是规范的，那大家可能就会感兴趣，我们都从哪里来选人，我们选人的原则和标准是什么，其实我们每一个 HR 和锻炼干部，都有一个招聘大钢和招聘学校清单，招聘大钢中他很多内容我就不了，我重点讲一些社会招聘的排他条件，我觉得这个是可以给大家作为借鉴的。


    至于学校清单的话，我先简单跟大家说一下，华为的学校清单列表，校招只有几所重点大学，在左侧列表里面，针对社招，也必须严格按学校列表要求招聘。关于社会上说的本三硕，本五硕四是指面向社会招聘，本科毕业工作满三年或者研究生毕业满两年以后才可以定
    14 级，如果定 15 级必须本科 5 年硕士 4 年以上工作经验。所以如果在校招的时候，没能进入华为，那在未来工作以后，你想通过社招方式进入华为，如果本科不到三年，研究生不到两年的话，面试的时候，只能定在
    13 级，避免内部倒挂。


    然后我再讲讲华为社社会招聘的一些排他条件，这个一般大家也不会关注，甚至于也没有想那么多。我能够感觉到在面试人选的时候，通常面试比较基础，面试的时候，提问的问题或候选人回答问题的时候，通常就停留在第一层的回答上面，比如离职原因，或者问工作经历，通常都是他说什么，就相信他说的，然后就不再继续往下问，但事实上这样获取信息有限。在华为我们其实是被训练的有追问的能力，连继追问为什么，像剥洋葱一样，逐层刨问题的能力，去挖掘他的一些真实情况，是不是在公司的排他条件里，如果他在排他条件里，基本我们是不录用的。


    ## 社会招聘的排他条件


    - 1. 谎话不断，如：持假证件，隐瞒经历

    - 2. 缺乏团队合作精神，性格孤僻，独行，以自我为中心

    - 3. 个人心理极端偏激，心态浮躁，频繁跳槽，工作没有延续性

    - 4. 没有良好的社会气氛

    - 5. 坚韧性差，不够坚忍忍耐承受挫折能力

    - 6. 家庭状况（单亲、离异、家属长期生活困难）原因（源：水逆影响需照顾到小公司工作）

    - 7. 研发岗位应届生有特长，领导岗位

    - 8. 年龄过大（30岁以上，柔性在14岁以下，潜水人力大）

    - 9. 已婚，家庭配偶需要承担家庭工作

    - 10. 在校学习期间有休学经历


    那这里主要有哪些点，第一个是以自我为中心，这个是一般人很难考察的，但事实上在面试的过程中，通过问题的设计是能够去相应一一考察的，这一点如果大家觉得难，还有一种办法，就是可以和北森合作，北森有一些人才测评问卷，可以测试这个自我为中心维度，我们现在有一家企业，就是跟北森合作。


    第二个是频繁跳槽，如果候选人一年一跳肯定是进了华为的。如果是有一家企业三年以上，然后另外两家企业或者说另外一家企业是1-2年的时间，这种还是可以接受的，只要一年一跳的，绝不录用，不管他是有多好的学校，哪怕是很多很对口的企业，我们他都是不要的。


    第三个就是逆向发展，很多企业可能会忽略这一点，但在华为会很在意，他认为人应该是一个正向发展的过程，而不是逆向发展，如果你的岗位比原来更低了，如果你的薪水比原来更少了，不管是基于什么样的原因，某种程度上就会觉得你是一个逆向发展路线，那种人我们也是基本不用的。


    很好奇的是为什么研发人员不用有经商和创业背景的？因为任总曾经提到

    '
