    ## 什么是绩效


    > 绩效是员工、部门或组织的活动所带来的经济产出。

    > 华为绩效指的是绩效结果导向。

    > 绩效考核就是要给绩效结果一个公正的评价和合理的定级，所以绩效就是为客户创造价值。


    ## 绩效不是过程、不是行为、不是能力


    - 大量做事、努力、苦干

    - 完成任务、速度

    - 有热情、干劲、学习能力

    - 对工作超负荷投入

    - 管理方法

    - 善于发现问题


    ## 而是绩效结果


    - 营收增长、成本降低、客户满意度、交付准时率、质量达标率

    - 业绩完成量/达成率达成率 vs 承诺

    - 个人能力达成目标/达标

    - 客户满意度提升、团队贡献价值

    - 创新成果、制度完善


    华为的绩效，首先对绩效的定义大家都了解，就不再解释。这里重点讲下华为的绩效导向是责任结果导向，所谓的责任结果导向是什么？其实它重点还是在员工是否在自己的岗位上能对应的履行他的责任和对应的能力将他所承担的职责做出有效的产出，真正的为客户创造价值，真正的为团队做出贡献。


    在华为很多时候讲的是贡献，你个人的贡献，特别是个人对团队的目标贡献，当然如果是非销售岗位，衡量比较简单，如果是非销售岗位特别是后勤人员岗位，感觉评价贡献是很模糊的，所以这类岗位盯住一个关键点，就是这个员工的岗位职责是什么？他在这个岗位上应该做些什么事情，然后他所对应要做的事情是不是做到位，就是说他是否不仅做出了自己本岗位职责所要求的工作职责，还完成了超过这个岗位职责更多的内容。那这样的员工华为是非常喜欢的。而这个导向就是责任结果导向，确切来讲，就是拿最后的业绩/工作目标来说话。


    在华为，高层主要是 KPI 考核，涉及目标分解，但对很多基层员工其实很多工作没法量化，那就没法量化就不能考核了吗？不是的，他是能够考核的。很多企业都想学习华为，都想知道华为的绩效管理到底是怎么做的。


    ## 绩效管理的步骤


    ![](img/d43ec9f811a059e999583aaeac906d81_140_0.png)


    我先说一下华为的绩效管理是有完善的步骤和流程，要求管理者按照流程执行每个步骤，这点很多外面的企业想要学习的时候经常是学不到的。比如严格的要求管理者对你的下属真正做一对一绩效面谈，真正要求你的管理者去跟你的员工沟通绩效目标；再比如说为了确保员绩效考核结果评议的公正性，为了避免由主管一个人考核一个人说的算而失去相对公正，由此而增加的集体评议。这些动作其实在很多公司效仿和学习是有难度的。


    那我说明一下华为是怎么做的，华为利用 PBC 这个管理工具和员工谈个人的绩效承诺，即绩效目标。目前比较时尚的绩效管理工具是 OKR，事实上 OKR 和 PBC
    有异曲同工之妙。二者都是为了激发员工自主的去挑战更高目标。


    华为绩效管理会按照 4 个步骤执行，即目标制定，绩效辅导，绩效评价和结果反馈，那每一步骤到底怎么去做，才能真正有效落地。


    我先给大家看一下什么是 PBC，很多人都想了解真正 PBC 是什么，以及 PBC 长什么模样，先说下 PBC 和别的不同之处有几个。


    ![](img/d43ec9f811a059e999583aaeac906d81_141_0.png)


    第一个、它的内容主要是由4部分组成 业务目标、人员管理的目标、价值观现行为和个人发展计划，但价值观现行为后面其实慢慢弱化，因为随着企业文化的成熟度在提升，这一快其实是不做严格考核的，现在会有个年度的劳动态度打分。


    第二个、是业务目标、业务目标里面我们会分三个标准，第一个就是不可接受的标准，第二个是有效达标的标准，第三个是卓越的标准。


    那这里我给大家讲一个小故事，针对前端一线的销售人员在定销售目标的时候，领导会怎么做好呢？他会跟这个部门长就是这个销售部的负责人说，基于市场的分析（补充下：很多公司在做销售目标的时候，可能会说基于公司内部的资源，觉得有这样的困难，或有这样的限制，可能年只能达成多少目标），但在华为定销售目标的时候，它更多不是基于组织内部有什么样的资源，而是基于市场环境，比如认准了这个市场今年是有多大的机会，有多大的蛋糕份额，那就就要为了这个蛋糕去挑战目标，去定超出大家所认知的目标。


    那怎么定呢？延续刚才的故事，这个领导会跟销售部门说你在你手上写一个你今年要增加的目标，比如说增加30%或50%，又是100%都可以，然后我也在我的手掌上写上我期望发展的目标，一会我们俩都拿出来看，如果你定的目标低于我的期望，那你就可以下课了，换句话说，就是这个市场你不用做了，我交给其他人来做。有趣的故事是，后来他们两同时伸出手来，发现销售负责人写的是120%，而领导手里是空的，什么也没写，但这个120%就是他们当年的目标。


    当然这个故事是很用意思的，很多时候华为就是靠这种让管理者承担更高要求更有挑战的目标，去将目标考核设定的更具备挑战性。定好挑战目标以后，更多的是想激发这个部门领导，他能够自主的去挑战他自己认为的目标，因为每个人对市场都会有分析和判断的，为了实现自己的岗位价值，他也会去设定自己一个可以挑战的目标，带着队伍往前冲。


    这个目标通常我们就定义为挑战目标（120 分目标），是需要团队跳一跳够得着而定的目标。那为什么不是基于资源内部呢？因为资本内部本身含有各种约束，理由太多了，在华为的观点里面，只要你设定好销售目标，你就是火车头，你会拉动后面的火车车厢去支持你和配合你。华为通过前端的销售，相应的倒逼后端的研发，倒逼后端的研发和供应链生产配套去支持到销售来完成。所以只要前面的带头做好了，后面的队伍跟上是没有问题的，这就是华为在定销售业绩目标的一个基本原则。


    有效达标的标准就是最基本的要求，按 100 分的标准，不可接受的标准就是 80 分的标准。如果你真的落到了 80~100 之间，那这个销售负责人是真的会下课。通常销售目标的保底线就是不增长或增长小于平均值，这在公司看来就是不可接受的，一定是要有增长的，最好是能够跳一跳而达到的增长率（当然如果有些是新市场，是战略定位等情况设定有些不同）。


    针对绩效考核定量方面，主要是针对前线的岗位，那我们对绩效考核的“考”就跟考试一样，用数据做考核。针对职能端的岗位，主要是定性，更是通过重点工作目标和方向，还有关键举措，通过定性的方式做绩效考核，也就是定性重在核，核实他的绩效结果。


    每个员工都会对自己的绩效完成情况做自评，比如说你是非销售岗位的人，没有量化指标，但可以针对完成的工作性质，完成的结果做描述。那作为管理者除了对员工日常工作了解的部分评价外，其余不太了解的情况，就要通过
    360 周边调查核实，真正做够清晰了解员工实际完成的绩效结果，然后就这个结果的方向和目标是不是跟团队组织要的方向目标是一致的。如果是的话，那么相对来讲这个员工的绩效结果就不会差。


    现在很多企业的通病或者说大家会有一个现象，就是极力的去花很多的时间精力，不断的去思考如何给员工设置考核 KPI，老想着怎么去量化考核，实际上


    有的时候，这个用力方向有点不对。我个人觉得高层以上对公司经营负责人主要用一些量化的考核指标，比如在华为销售部门严格考核的就是收入、利润和回款，那这个我觉得是每家公司都可以参考的。但基层岗位尤其是销售岗位，是否一定要追求量化，我觉得未必。


    在华为讲三个点，就是价值创造、价值评价和价值分配，那么价值创造更多的就是前面讲的，用客户的视角解决客户的问题，真正为客户处理问题，然后拿下大单，然后价值评价更多的实际上是在绩效管理当中如何去做好评价以及说评价的依据是什么，价值分配更多的就是在后端有相应的有奖金包，有各种配套的薪酬制度。华为针对销售有奖金包，有薪酬包，有很多这种配套的分配制度和体系对应落地，对于销售人员来讲完成的销售目标越高，奖金越多，就是重赏之下必有勇夫的这么一个理念在做的。


    现在给大家讲一个，我觉得在绩效管理当中，华为做的和别的企业不太一样，也与众不同的，比较有价值的地方。


    ## 绩效评价（1）等级


    华为现在内部的绩效主要分 5 个等级，每个等级的比例要求大概是这样的，A 和 B+合起来一起最多 55%，其中 A 的比例不高于 15%，C 和 D 的比例通常在
    5%~10%，正常来讲公司没有裁员计划的时候，通常是 5%作为最低来操作的，那剩下的就全部都是 B。华为有的时候也会用组织绩效，那组织绩效对绩效的比例分布，我觉得对于企业来讲是有参考意义和价值的。在华为内部，如果某个组织绩效达成特别好，那么对应的这个部门的组织绩效为一级，那么它在绩效的比例分布...


    例分布可以没有下限，就是用下限或者没有，然后二级组织绩效，末位绩效等级按正常标准。如果是三级组织绩效，绩效末位的比例取上限 10%，同时 A 只能取下限≤10%。华为绩效考核一直是按这个比例严格分布的，特别是每年对于我们在给员工做末位考评的时候是最难的，因为员工都很努力，不过再难都没有高层管理者
    19 级以上 C 末位考评来的难。


    华为员工的考核主要会分三个层级，13与14 级，15~18 级和 19 级以上的员工分别在一起，参考上面的强制比例考核。之前 19 级以上人比较少，不到 20
    个，那么就会把 19 级以上的管理者往上一级部门合并，确保有 20 人以上，确保末位 5%的比例至少有一个 C，所以高层的绩效末位考核是很难的。每年我们在组织高层管理者考核时，这个绩效集体评审会特别难做，大家是经过很多
    PK 最后才能挑选出来。那管理者考核拿到 C 影响还是挺大的。通常组织碰到这种情况下都会让高层调换岗，换个地方再去看是否合适做高层。


    ## 绩效评价 (2) 流程


    - 绩效指员工在履行岗位或角色所要求的职责中所表现出来的责任结果，即绩效结果事实，是绩效评价的基础和起点。

    - 绩效不仅仅反映绩效，而是指员工在本合同岗位所承担的有绩效的输出结果。 —EMT纪要 [2005] 053号

    - 绩效评价重视关注结果，同时也关注成绩所采用的行为表现。


    ![](img/d43ec9f811a059e999583aaeac906d81_144_0.png)


    各个环节重点围绕绩效结果展开！


    关于绩效辅导，我就不讲了，辅导很多时候就是教练式辅导，比较有特色的是中期审视，大概每年 4 月和 10 月份校对下 PBC。


    绩效评价，关键是怎么确保绩效的评价结果是相对公平，华为是怎么做的？我们一般是按这样的几个流程来做，第一个先是员工自评，第二個是主管初评，如果这个组织或这个部门采用矩阵式管理，那么在做绩效考核的时候是先按照资源部门（即比如所属的研发部或测试部）考核，只是你的主管需要就你支持的某个项目，咨询项目的业务部门老大意见，就是矩阵式的管理会涉及到由矩阵式领


    导补充绩效评价意见。员工的评价结果是双方评价的结果，所以主管需要做 360 度的意见收集。


    这里有一个特别需要提醒的就是，考评前沟通，我觉得这环节它是非常有效的保证了组织当中对员工绩效考核不好量化情况下，主管是怎么保证他的评价结果是相对的客观公正或是有效的。


    考评前沟通，是说主管在给员工做初评之前，先要和员工做一次考评前沟通，允许员工向主管陈述他这一段时间（半年）以来的绩效结果，再结合他陈述的绩效结果，看哪些是主管平时掌握不到的绩效结果，那主管就要去做核实，考评前沟通主要目的就是为了核实结果，因为管理者是有可能出现视角盲区的，不能保证自己都非常了解员工这半年以来所有的业绩产出或承担的责任结果，那管理者就要利用考评前沟通了解情况后对结果做核实（当然如果如果是表现不好的员工，可以适当地做些期望沟通），核实完毕以后，就这个核实的结果，在所管理的团队成员内部，比如
    10 个员工，那么对这 10 个员工进行排序，排序后谁能评 A 和 B+，谁能评末位就基本清晰了。


    团队内部排序的结果就会拿来对相应的部门做集体评议，比如测试部和开发部，先由各部门总监带管理者做集体评议、做完的结果再到 BU 的 AT 集体评议会上讨论一次，通常是
    BU 总裁跟 AT 成员一起评议。逐层集体评议的目的为了拉通看，中间分布的不是大家关注重点，在所有的集体评议里面，重点是看两端，第一端就是 A 的人员，还有末端的
    C。我们评议的核心就是要确保评出来 A 是大家真正认可的 A，然后评出来的 C 是团队当中大家都认可的 C，避免不是因为某个领导想要给员工 C 而导致的误判。


    这个对中小公司其实可以理解为是各部门总监带着自己的部门经理做集体评议，在各部门内审视评出来团队中的优秀和团队的末位是合理的吗？是的话那就往上提交结果，交到公司后，由公司的老板带着各部门的总监，集体评出公司的优秀和公司的末位，看是不是合理的？如果觉得不合理的，可以及时反馈，逐层沟通；有了主管初评到两层的集体评议，再加上最后的结果审核这么一个三层闭环，从某种程度上来说就基本已经解决了非量化下的相对评价客观性。


    在绩效评价部份，我重点讲的是集体利益和考评前沟通，这是华为做的一直很有效也是亮点部分。最后一个亮点就是绩效反馈了，绩效反馈是很多企业目前


    都做不到，也很难做到，也懒得做的一件事情，但事实上这件事情是我认为在华为我们绩效管理这么多年能够做好的一个很重要的步骤和流程。


    再耽误大家一点点的时间，我再讲一下那个绩效评价的三个要素，因为很多人就会在思考，那华为的绩效考核到底最终依赖于什么，或者说考试的客观性主要决定于哪些要素，我想刷新一下大家可能对以往绩效考核上的一些认知，以为华为内部是很强KPI管理的，实际上KPI只是针对于高层，大量的基层员工以下并不是采用KPI，而是PBC，而且PBC里面很多也casts不是用KPI，而是用关键事件也就是定性来作为评价依据的。


    ## 绩效评价（3）要素


    - 管理公司的考核原则于：

    - 主管对有特殊事项，而非主管描述情况；

    - 主管有责任和权利对事件进行干预；

    - 有权利和责任的考核要严格；

    - 评价结果定位；

    - 全面客观、兼容性好、避免主管主导的评价；


    重要提醒：评价不因形式化的形式而 wraparound，真正有效的评价，在于主管有意愿且有能力不失偏颇地评价下属的工作


    其实我一直思考为什么说在华为做绩效评价的时候，相对于来讲是容易的，因为管理者是成熟的，所有参与绩效考核的管理者，从不熟悉到熟悉都会有一个培训的过程。或者说会有传帮带，刚开始上有上一层领导指导你怎么评价带著你做集体评议这么一个过程，然后随着看的多，用的多，经验就自然成熟。


    如果主管评价的相对不客观，或者说作为管理者，评价结果不够客观，员工是可以弹劾主管的，所谓弹劾就是它可以申诉结果，其实作为管理者，如果评价结果不客观，员工申诉，HR
    处理完申诉后，核实结果评价是存在问题，这对管理者是不利的，所以组织对管理者的成熟度和客观性是有要求的，在组织赋予管理者权力的同时，也对其责任有要求。这在我们很多组织，做不到，给管理者权力，却很难让它承担相应的责任和结果，所以我觉得这个可能
    Skeleton 很多企业和华为不太一样的地方，那么华为的客观公正，取决主要有什么？第一个是基于客观


    事实，第二个是主管的经验丰富，第三个是有相应的绩效相关数据和事实，最主要就是整个流程是规范的，有确认流程的集体评审，集体决策。


    华为内部有这么一句话，我觉得值得拿出来分享给大家。“考评不会因为其是不是量化的形式而客观，真正客观的考评是在于主管有意愿，而且有能力不失偏颇的能力评价下属的工作”，其实这句话意思就是提出了对管理者很高的要求。

    管理者能不能在人才的选用育留上面，能不能具备一定的领导力等等，其实都是对管理者有极高的要求，这个也是我感受到华为内部的管理者和在外面企业管理者的差异性，我认为根本就是管理者成熟度的不同。外面的企业很多时候还不重视培训，也没有想过给管理者上非人的人力资源管理课，以及说设有帮助管理者去提升他在绩效考核客观考评评价的能力等，所以导致管理者一方面不知道怎么评，第二方面就是没有给管理者一个明确的要求。


    我经常会看到很多管理者明明对某个员工是不满意的，可是真的在打绩效的时候，结果他还是给一个合格，因为他不想得罪人，他不想打击员工的积极性，然后员工绩效一般，结果就影响他自己的绩效目标等。其实很多时候的误区就在这里，你对下属越宽松，或者说你对下属越没有要求、目标越不明确，其实最后越不能实现团队的绩效，而团队的绩效做不出来，作为管理者来说，那么你管理的绩效就达不到，那其实对管理者本人是有很大影响的。


    所以在华为里面就会层层的把关，作为管理者要实现自己的管理绩效，就必须向员工拿结果，要向员工拿绩效，就必须给员工清晰的目标，并且告知诉对他的要求，以及对他的结果考核要求，当然这个过程，需要做绩效辅导和管理，发现他做的不完善的时候能够及时的指出采，我觉得这些在我们很多日常管理过程，很多管理者是碍于面子或者是不好意思，就是对下属不够狠，这是我目前看到普遍现象和问题。那不管怎么说，我想说很多时候其实现绩效管理的本质就是领导说了算这句话，今天算是一个分享送给大家。


    最后是绩效反馈，反馈包含的内容主要是三大点，通常是三部曲，第一步肯定好的，第二步说需要改进的，第三是鼓励，鼓励或激励他承担更大的责任。按这个三步曲，跟 A/B+
    的员工沟通是没有难度，最难的是跟 C 的员工和部分 B 的员工沟通，因为在华为大家都很努力，真的很努力，都认为自己的绩效不应该是 B 的位置，当然个别明明能知道自己这个季度绩效一般的，那就不没难度。

