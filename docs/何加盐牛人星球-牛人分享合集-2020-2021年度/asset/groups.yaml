    这是什么意思呢？当一个国家的互联网发展还是空白的时候，阿里巴巴做电子商务，它有无限的发展空间，它得流量，或者说客户数可以从0做到6个亿，这个是完全指数性的发展，所有的互联网公司都是这样发展起来的。那么对于投资来看，它就有非常大的动力来投资这样的公司。对于企业家来说，他也从中得到很大的利润。对于企业来说，也可以很高的薪酬养很多人，工作条件还很优越，像当初这个微软、谷歌进入中国的时候，那外企的待遇都是非常非常好的。


    这就是因为技术进步带来的指数型的爆炸性的增长，有足够的利润来维持这么一种发展。但是当我们把这种技术进步的红利吃尽的时候，你比如说阿里巴巴的用户已经达到了6个亿，它
    governs 这个营收的增长不再是指数型，而是线性增长的时候，那么这个时候资本家就不会满意了。他们的企业家管理团队也就不太满意，他们会想尽了办法，怎么 样维持原先那种增长态势，如果不能维持的话，对公司是一个非常危险的现象。


    所以我们可以看到00年前后，阿里巴巴、腾讯、百度都是那个时候起来的，他们发展起来了，并且刚开始他们赚的钱其实是相对干净一点的，后面才吃相慢慢地越来越难看，难看是因为他们不能再轻易地用技术站着赚钱了，它必须得用别的方式了。然后2010年前后，滴滴、美团、今日头条，这些一波又起来，这个是吃了移动互联网的红利，他们也经历了一波指数性的增长，包括后面的排多多。那现在呢，所有的这些流量都已经到顶了。技术的应用已经达到了天花板。


    那等待他们的是什么？就是存量杀戮。现在的巨头们，不再是利用技术增加社会的总体财富，而主要是在已经存在的社会财富之间互相去争夺，做重新 的分配。比如说这些巨头们做社区团购，本质上是什么呢？它利用自己的流量优势、资本优势、组织能力的优势，从别的产业、别的公司那里把利润争夺过来，就是说原来的菜场，原来小商小贩赚的那些钱，可能每一个人赚的很少，但是是全国那么多加起来、这个利润也是很让这些已经没有别的地方发展的互联网巨头很眼红。


    所以呢他们就做这些没有技术含量的事情。一般是先通过各种的补贴，各种的低价烧钱，先把市场给抢下来。这个一方面通过规模优势啊会降低它的运营成本，另一个通过达到垄断地位之后就提高价格，用后期的利润来补前期的亏损。我们看到所有互联网公司都是这样做的，不管是阿里、京东还是滴滴、美团，刚开始不管是对商家、还是对消费者各种补贴，让你在他平台能够赚到很多钱，但是慢慢地平台的费用越来越高，流量的费用越来越高。其实这些商家最后都只是在给这些大的巨头打工，而消费者享受到的低价的福利很快就没有了。


    另外一个，当资本互相之间的争各已经很残酷，已经没有办法从别的地方在抢肉的时候，或者说这个抢的肉已经不足以维持资本的贪婪之后，他还有一个办法，就是把利润在资本跟劳动力之间重新分配，换句话说，就是增加对劳动者剥削。虽然说由于市场竞争的关系，他们一般很难降低员工的工资，但是所有的互联网公司都会做一件事情，就是无限地延长劳动时间，无限地所谓提升人效，就是说把那些老的、或者说劳动效率已经不再高的人，不断地剔除，让年轻的人来，工资更低的人来替代他们。


