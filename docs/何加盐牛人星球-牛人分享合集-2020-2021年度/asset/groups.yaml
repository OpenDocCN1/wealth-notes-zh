    1 张保单就几百块钱。后来变成了几千块钱，第 3 张几万，第 4 次买的几十万。


    我跟他开玩笑说，你总有一天会跟我买个几百万的保单，您交保费几百万。那这是什么？就是一种长期主义。


    我还有一些校友，刚开始可能在我这买个四五千块钱保险，结果过了 10 年之后公司上市了，现在成为亿万富翁，那现在他再买保险就是几百万几百万的买的。


