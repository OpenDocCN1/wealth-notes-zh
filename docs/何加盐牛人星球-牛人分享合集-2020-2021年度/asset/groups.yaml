    当然，这只是我自己的想法，我说的不一定是正确的。我今天说的所有的东西都不一定是正确的。


    我一直鼓励大家独立思考，我所有的东西都是我自己的一套哲学系统，是我自己看懂万物的方法论。这套方法论确实使我受益良多，使我人生的下半场应该是越战越勇。


    但是，你们不要迷信我说的话，


    我只是做一个分享而已，你们觉得自己适合什么，自己按那条路走就可以了。我只是分享一下我的方法论。


    我的分享到这里就结束了，谢谢加盐。


    ## 人生道路该如何选择


    讲师： 何加盐。


    时间： 2020 年 5 月


    大家好，时间过得很快，转眼又是 一年，很感谢大家在这一年来对何加盐以及牛人星球的认可和支持。


    这一年来，我也收到过无数朋友的私信，或者在群里看到大家的聊天，能够感受到有很多人都在牛人星球里得到了成长进步，对于这一点我非常欣慰，也希望大家在日后的生活里，能够继续保持这种持续进化的节奏。


    今天的题目有点大，叫做《人生道路该如何选择》。为什么会选择这样一个题目呢？是因为我最近几年常常会碰到很多朋友，都对自己所选择的人生道路、或者将要选择的人生道路充满了疑惑、充满了不甘、充满了想要又不敢的犹豫。


    我看到很多人，明白自己在某一方面很有激情或者很有能力，但是就是选错了一个方向或者站错了一个平台，导致生活很痛苦，对未来很迷茫。


    例如我前几天在星球文章里写到过的一个帅大的师弟，他是物理竞赛全国一等奖的得主，人特别的聪明，家族也有稳定的事业。但是他毕业 5 年多以来，一直都还是找不到自己人生的方向，到现在一事无成。


    我们不是说他赚钱多少，而只是说，他没有找到一个能够安放自己的灵魂的地方。如果我们说一个人的真正的成功，是可以按照自己喜欢的方式过一辈子的话，那么可以说这一位师弟他拥有了成功的最好的条件，但是却处在了离成功最远的一个地方。我觉得特别可惜，特别令人心痛。


    那么咱们的星球里面，我想肯定也很多朋友，对自己曾经的选择是后悔的，对自己现在的境况是不满的，对未来是有其他新的憧憬的。今天我讲的这个题目，可能会对大家在这些方面有一些参考的作用，所以如果你有这些方面苦恼的话，建议好好地听一听。


    其实我们每一个人每天都在不断地作出选择，但是对于一个人来说，人生最重要的选择，往往只有极少数的几次，甚至于只有最关键的一次。所以我想，今天我们讨论人生道路该如何选择，其实关键的是，说我们在人生的重要关口该怎样选择人生道路。只要你的
    人生能够把那一次最关键的选择做好了，你的整个人生都会大不一样。


    我今天关于人生选择的演讲分为四个部分，第一部分讲一讲选择的三个方面，第二部分讲一讲选择的五个层次，第三部分讲选择之后如何落地，第四部分讲如果实在是没法选择该怎么办。


    首先我们看一下选择包括的三个方面。


    一般来说，我们决定做一个人生关键选择的时候，都是要选三个东西：


    第一，我选择人生往哪个方向走。如果是大学的话，就是选择哪个专业；如果是工作，就是选入哪一行。这是一个方向性的东西。


    由于经济的发展，科技的进步，社会的变化，有一些方向是很 有前途的，有一些方向是夕阳西下的。所以这个对我们是很重要的。


    如果你选择了一个未来很 有前景的专业，或者说事业，那么未来，你即使是没有别人那么努力，但是你在 这个专业或 者 行业里水准稍高，你都能够获得比别人更大的红利；但是如果你在一个错误的方向上，那不管你怎么努力，可能你的
    人生 成就不、或者说你自己的满足感，是远远不如别人，也达不到自己的预期目标的。


    这就有 点像雷军的两个选择，最初他选择了做金山，他认为自己非常的努力，但是其成功的程度不如自己的预期，他过得很痛苦，他把那一段经历比喇成“在盐碱地种庄稼”。后来他选中了一个别的行业，开始做小米，然后才有了今天的小米庞大的帝国。雷军把后面这一段比作是在风口上飞”。他的名言大家也都耳熟能详了，在风口上，猪都能飞起来。当然雷军他本身都不是猪，它是一只雄鹰，所以遇到风的时候乘风而起，那就是“好风凭借力，送我上青云”，那就更厉害了。所以选择的
    第一点是要选择一个好的方向。至于什么是好的方向，我们等一会儿第二个部分再来说。


    选择的第二点是选择一个好的平台。就是你选好一个方向之后，去往这个方向的可能有不同的平台。


    举一个很简单的例子，假设我们都是要从广州去北京，你可以坐飞机去，也可以坐火车去，也可以开车或者是坐船，甚至走路、骑自行车都可以，这就是我们选择的平台。当然“飞机是最快的，但是“飞机也会有飞机票比较贵的问题，也会
    有从机场到市区比较麻烦的问题；坐高铁可能更舒适，但是路上的时间会 稍微长一点；坐


    普通火车那时间就更长了，但是它的票价是最便宜的。走路自然就不用说了，如果你一点钱都没有，可能你就只能走路，因为你没得选择。


    大家很简单就能明白，选择不同平台的话，我从 A 地到 B 地，所花费的时间是不一样的，舒适程度是不不一样的，当然所需要的前提条件和付出的成本也是不一样的。


    这个在现实中是什么意思呢？如果是学习的话，平台就是我们选择的学校。有人可能会说，我也想选好的学校，可是成绩不够啊。其实在同样的分数下你也可以选择不同学校，比如说你是选择一个专科，还是三本？或者说选好一点的学校的差专业，还是差一点的学校的好专业？是选择一个综合性的学校，还是理工类的学校，或者是音乐类艺术类的学校？同一方向，是有很多不同的平台的。


    如果是事业上的话，平台就是指我们选择的公司或者说团队。同样是朝阳行业，也有许多公司做得半死不活，也有许多公司做得很成功，这个就是跟不同团队、不同公司的状态、气质、能力、价值观等有关了。


    所以我们选择平台的话，要选择自己最舒服的、自己更能成长的、未来的前景更辉煌的一个平台，不要选择那种死气沉沉或者自己在里面学不到东西，或者在里面每天度日如年的那种平台。


    方向和平台是我们对外的一个选择，同时呢，我们还有对内一个选择，就是你选择以什么样的姿势，或者什么样的态度去加入这个方向，登上这个平台。同样是坐火车，我可以躺着，也可以坐着，也可以站着，甚至是趴着。这就是所谓的不同的姿势。


    这应用到现实中是什么意思呢？我们每一天的选择除了选择做什么是事情之外，还要选择我们每天不同的做事的态度、做事的心情、做事的价值观、做事的原则。所以这个姿势的选择，其意义就是我们要选择一种对自己做人做事的要求。


    不管你在任何平台任何方向上，你都可以随波逐流、也可以标新立异，你都可以偷奸耍滑，也可以 用心做事，真诚做人。你可以选择利益至上，也可以选择成长之上，也可以选择打好人脉基础之上，甚至也可以选择让当下的自己感觉最舒服至上。不管怎样，你都要做出一个选择。这个选择有可能比方向和平台更能决定你的幸福感。


    上面我们说了选择包括的三个方面，但是我们怎么去选这三个方面呢？我怎么

