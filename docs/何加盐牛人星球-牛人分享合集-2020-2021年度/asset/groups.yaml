    人就是三年河东三年河西。现在这个时代，很可能名不见经传的一个小伙子，一下子成为一个非常厉害的人呢，对不对？


    所以我甚至跟大学毕业的时候很多同学保持联系，他们现在已经做到了什么


    么副厅长、副局长了，我对他们也没有无所求，我卖保险有没有什么要求他的。但我觉得这样很好啊，我认识他，能够在一起吃个饭聊个天，大家互相不求，这也是一种成功。就是我们当时的关系时候偶尔帮帮一些小忙，我觉得也可以也可以不是坏事对不对？


    第 4 点是什么呢？第 4 点我跟大家分享一下：平衡的生活。


