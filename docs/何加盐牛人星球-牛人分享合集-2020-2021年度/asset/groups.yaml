    # 如何应对剧变的时代和时代的剧变


    分享人：何加盐。

    时间：2020 年 12 月


    现在已经是 12 月 30 号，再有两天就是迎接新的一年了，很高兴能在岁末的时候跟大家做一次分享，而且这个分享跟我们目前所处的时代以及时代的变密密切相关。所以我起的这个标题叫做：如何应对巨变的时代以及时代的巨变。


    首先我想大家都看到，目前我们这个时代正在发生非常剧烈的变化，就好像之前都没有见过一年能发生那么大事的。我想就算是再过 1000 年，如果那个时候人类还在的话，我们翻看那个时候的史书，应该
    2020 年会在上面有比较多的篇幅，它有可能是个承上启下的一 个时候，我们看到不管是国际的格局，还有国内的这些产业的经济的变化，以及各种政策的变动，社会心理的巨变，以及我们每个人的生活，都或多或少有了很多的变动。那这些变化内在有没有什么一些逻辑紧密联系起来呢？


    我想，当我们看到这些变化的时候，可能我们要去分析一下，为什么是在这个时候发生这么多的变化？这些变化内在的原因到底是什么？如果我们可知其所以然的话，可能就能够对未来做一个相对准确一点的一个预测，也能够对我们自己安排自己未来的生活事业，学业可能有一定的帮助。因为古
    往今来，如果一个人能够察大势的话，啊他就可能能够提前做很多的安排。我们希望呢今天晚上这次分享能够在這方面对大家有一定的启发。当然呢这些分析和预测只是我个人的观点，仅供大家参考。我不是先知，也不是一个未来学家，只是根据自己的所学所思，提出一点自己的看法。


    首先和大家分享一个基本的概念，就是我是比较认可马克思所说的生产力决定了生产关系，或者说物质基础决定了上层建筑，也就是说我们看到的所有 的这些变化，背后的表象，有可能都是一些经济的、物质的因素在那里变化而引起的。所以我们可以先看一下，它内在最基本的驱动的变化因素是什么？


    在这里呢，前面可能会稍微枯燥一点，给大家介绍一点经济学知识，就'
