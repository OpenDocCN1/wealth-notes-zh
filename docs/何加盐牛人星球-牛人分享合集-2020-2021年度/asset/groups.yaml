    所以这是我今天跟大家分享一下我的一些心得、一些体会，真的谈不上多么成功，只能只能说分享我的心得和体会。


    我刚才才经介绍过自己一次了，我再介绍一下，就是我本人，在友邦带领先一个近300人的团队，任职业务总监，本身也是全球mdi公司会员。两年前写了一本书叫做《保险如何创富》，卖的还可以，这本书的版税全部捐出来的，全部转给一些慈善机构，捐给广州一个白血病儿童的一个慈善机构，所以这本书是不赚钱的，就是叫《保险如何创富》。


    现在我们进入主题了，就是我们怎么在社会上越混越好，如果怎么如果成为从一个菜鸟变成一个达人，怎么一个小老板变成了大老板？一个教师变成一个教授，一个小医生比那个大医生，一个小力士变成一个大力士。这是我相信每个人都很关心的，那我跟大家分享五点。


    那第一点是什么？我觉得我们走向这个社会，我们对自己要有个精准的定位，第一点就是精准的定位。


    在这样一个移动互联网的社会，这个抖音直播的社会，的确会\:有一种浮躁，因为我相信这个群里的人，估计应该是在30岁左右，我觉得这一点正好也是一个非常重要的一个定位的理念，早点定位26岁的更好，如果迟点我觉得35岁也不为迟，但如果人是没有定位的话，你就像一个浮萍飘来飘去，对不对？你说你拿着机票不知道去哪里，还不知道会把你带到哪里，首先你一定要知道你要去哪里，那人生定位的话，我觉得大概就分为了这4个方向，就这4个方向分享一下。


