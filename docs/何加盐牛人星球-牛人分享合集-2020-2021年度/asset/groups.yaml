  md: '

    票在人们现场投票之后再去统计，然后就发生了特朗普初期大比例领先。这在美国大选历史上是很有意思的一个现象。


    美国有一个典型的说法就是红蓝两个阵营，分得非常的清楚。从选举地图来看，特朗普就是在美国南方，是大片的都是红色的这些州；民主党的地盘呢，就是在西部加州这些地方，然后还在东北部纽约这些地方，这个阵营看似非常清楚。但其实在美国的历史上，很搞笑的一个事儿是，南方现在看起来是民主党好像不行，全是红通通的一片，都是特朗普的粉丝啊，是共和党的地盘。其实在南北战争美国南北打仗的时候，南方是民主党的地盘。


    我这里发了一个地图，这个选举地图，看上去南方是蓝色的，其实就是民主党的。这是 1900 年美国大选的选举地图，南方是民主党占优的。但是北方是红色的，是共和党占优，当时是共和党的。麦金莱当选了南方这个民主党的，他就叫南方基地。虽然是南方基地，但是打不过北方的。所以在
    1900 年时，是民主党在南方，共和党在北方这么一个趋势。


    而且美国在 1900 年的时候，大选阵营还是按照南北划分，民主党在南方，共和党在北方。但是之后就发生了一个离奇的逆转。民主党跑到美国的东北部去发展了。


    以前美国人大选，阵营也不是这么鲜明对比。如美国历史上经常发生压倒性的胜利，也就是说，要么就民主党的人得了压倒性的胜利，比如 400 多比十几啊，或者是共和党这边呢，500
    多比十几啊这样的比例胜利。这张地图，是 1984 年美国选举的结果，是里根以 500 多比 13 大胜他的对手蒙代尔，这是美国历史上共和党最大的一场胜利。但是是从小布什他爸老布什
    1988 年当选之后，1992 年开始美国逐渐就呈现出了两党的阵营划分，越来越清楚这么一个现象。


    2000 年美国大选可能是美国历史上比较数接近的一次选举，戈尔和小布什甚至于发生了闹出了选举闹剧，在佛罗里达州点票点不清楚，最后是小布什以 271:266
    险胜。从那时起美国呈现出了一个很重要的现象——分裂现象，就是蓝的州就越蓝，红的州就越红。以前也是有蓝州红州，但是个人没有那么死磕，如果说候选人出色的话，蓝州的人也可能是把这个红人选上去。但是在
    2000 年以后，美国的蓝州红州分的特别明显。然后选举地图，每一届隔了四年，再选好像都差差不多。


    这其实就是预示着美国发生了一个深刻的现象：人群分化，民主党和共和党价值观、办事方式、基本群众，发生了很深刻的变化。这方面的变化在选举中体现的非常的明显，总体来说他是不利共和党的。


    在这次选举中也体现的非常明显，共和党在他的南方基地，以前应该说是很……容易获胜的，但是这次在摇摆州里面呢，出现了几个南方的，比如说以前不太可能认为出问题的地方，比如像德州、德克萨斯州，这个是传统的，每次都是选共和党的，这次虽然也还是选特朗普，但它已经说成摇摆州了，这也是日常分析经常说的美国的人口结构发生变化，外来人口越来越多。而共和党的基本盘，白人、男性、基督徒比例占的越来越少。


    这导致美国选举，他不再是看每个人有什么政见；你要到底是具体在说些什么；反而就变成了：你到底是谁啊？你这个人到底是支持我这波的还是支持那波的？


    这就导致甚至于是说选举结果出来了以后互相不承认。上一次 2016 年选举特朗普获胜的时候，希拉里的支持者就闹了，说不承认，说特朗普不是我们的总统。那这次特朗普输了，那他也不断的闹各种选举争议。特朗普的支持者也是纷纷的不承认，到现在中国外交部祝贺拜登的时候，还是说并不是祝贺拜登当选总统。所以这选举争议的还会继续闹下去。


    他这个闹下去，根源是共和党未来的发展不利他那个红州。虽然各州的数目还是占了一半稍多一点。共和党在参议院，它是每个州选两个参议员，共和党在参议院的数量上面还是稍占一点优势。但是在未来，在人口结构发生变化以后，有一些红州会转变成蓝州。现在是蓝州的就不太可能变成红州，这个趋势就让共和党非常地担心。


    共和党还存在一个问题，就是推不出很好的候选人来和民主党这边的候选人竞争，那么他们选择就是和特朗普这样比较奇怪的一人进行合作。民主党那边推出的候选人呢，基本上谁都差不多，有好的候选人当然很好，没有特别好的，像拜登这次就不是特别好的候选人。但是他们推出来一个人来呢，基本上也不会太差。


    那么共和党选择了和特朗普合作，其实导致了很大的隐患。因为特朗普这个人是没有政治经验的，他也不遵守美国政坛一些潜规则。所以特朗普当选的四年，把美国政坛搞得鸡飞狗跳，可以称之为发生了一场“特朗普之乱”。


    特朗普这个人办事有点胡来莽撞，有的时候也可以按他的支持者说，他是果断。比如说在竞选的时候，特朗普对拜登说，他说你 47 年在站台上做的事情，还不如我 47
    个月做的事情。


    这一个意思说，拜登这个人呢，是一个老政客。他 1972 年就在特拉华州当选了参议员，走入美国政坛，然后一直是在美国政坛浸淫多年，专长领域是外交，他是参议院外交委员会的主席啊。2008
    年之后，当了美国的副总统，也是外界和世界上几乎所有国家的领导人，都有过交道的。所以拜登这个人，是一个传统政客，行事非常老道。


    但是特朗普就是一个很奇怪的行事风格，大家从没想过美国领导人会是这么一个形象。特朗普实际上也没有自己的班底，是个政治素人。虽然他选举选上后，跟共和党其实是个合作关系。那他怎么执政呢？他就从美国各地临时拉了一波比较极端的人，像纳瓦罗、班农，还有那个蓬皮奥什么的，都是他自己私人拉来的，并不是共和党的固有班底。


    所以特朗普的行事的时候，有一个自己的小团体。这个显得非常独特。以前当选的总统，是可以有自己的小班底，但是他应该是五湖四海接纳各个利益团体的人，而特朗普呢他搞自己的小团体。


    而拜登呢，你可以明显地看出，他的团队的 500 个人要接住这个下一届政府了，这个团队都是很成熟的。因为他身边的人，其实并不是新人，都是一些已经有相当多的工作经验的人，而拜登只是一个代表。其实你把拜登换成别人也差不多，就是代表着民主党传统政治路线，甚至可以说是美国建制派传统的政治路线的这么一个代表人物。


    可以说，拜登当选以后，他最大的任务是什么呢？就是去补特朗普捅下的篓子。


    这四年，特朗普这个团队，用他极端的形式手法，肆无忌惮地办了非常多的事儿。按照美国建制派的说法，是对美国的国际形象是影响非常大。因为特朗普的行事风格就是：我只管自己的粉丝，你仇恨我的人我根本不在乎，我把我的基本盘稳固了就行了。而拜登不是这样。他就说：我当选了，就是所有人的总统，不管是支持我的还是不支持我的。


    我们上面介绍了一下美国选举的一些基本常识，以及拜登将来在美国内部需要面对的任务，但是这个对中国是什么影响呢？


    我们下面来聊一下拜登可能对中国是一个什么样的基本态度。


    首先，可以肯定的：2018年，美国对中国发动了贸易战，这是一个回不去的事儿了。贸易战并不是特朗普个人的意志，他是美国包括民主党、共和党在内都赞同的，包括对中国进行高科技禁运的脱钩，这些都并不是特朗普小团体自己的事儿。只是特朗普做事比较冲动鲁莽，扣了扳机。


    在这方面，可以肯定拜登即使上台以后，他不太可能回到以前的奥巴马时代和中国相对比较和平的这么一个状态，而是会多少延续特朗普政府和中国开始了一个相当程度的竞争关系。


    但是另外一方面，特朗普对中国、他的做法是非常的极端的，包括特别是2020年发生疫情以后，非常多的极端性的做法，绝对不是一般人可能做得来的。简直就像疯狗一样的，包括为难我们的留学生，把我们的很多学者也抓起来了，还有对中国科技企业的疯狂的禁谈，简直就是不顾后果的。这些事情，美国企业本身都反对的，因为也要和中国做生意。


    所以这些手段非常的激烈，可以预期拜登政府即使对中国想下手，也不太可能采取像特朗普这么激烈手段。


    特朗普对中国这下手呢，一个代表人物就是蓬佩奥。这个人说辞非常的过分，实际上他等于是把中国当作敌人来处理的，完全就是一把中国污蔑成美国最大的敌人，跟以前的前苏联相比，就是要开一个新冷战，这是蓬佩奥的说法。其实特朗普其实就是支持这个说法的。


    当然我们批评的是蓬佩奥，还给特朗普留点了面子。但是从拜登的说法来说的话，他应该不会到蓬佩奥这么一个恶劣的程度。


    首先从大的方向来定性，在特朗普之前中美表面上这个定义，叫做战略合作伙伴，每年还定期开一个这个战略经济对话。虽然说有各种私底下对中国有攻击，但是那个时候确实明面上是合作伙伴，美国总统，都是中国的朋友，下台了，变成中国的老朋友了。所以之前的关系呢，明面上叫做战略合作伙伴。


    但到了特朗普这个时代呢，从贸易战开始到蓬佩奥就已经变成了敌人了，就要开打新冷战了，这是两个极端。


    在拜登政府这方面来说，其实他的说法已经出来了。我估计拜登会把中国定义为叫做“竞争对手”这么一个说法。他也不是说伙伴，但也不是说说是那个很可怕的那种敌人，他叫做竞争对手。就是说在比如说在经济学上面，大家是友商这么一个概念，虽然说是竞争，但也不是撕破脸的那种竞争。


    个人觉得，拜登如果把中国当作竞争对手，这还算是可以接受的一个定义，因为你不太可能说中美发生了这么大的事，贸易战这么大的事儿，科技方面都已经打得这么惨了，忽然又变成朋友了，不可能。但是如果说能够把竞争的底线控制住，不要搞得过火，然后变成商业上可以理解的竞争关系，这个还是光明正大的。双方都可以说是在这一个有管制的框架之下进行，不要失控的竞争，这是好的。


    有的人会说，特朗普这边儿是对中国是很恶意，但是拜登也好不到哪去。因为平时民主党共和党对中国关于一些发言呢，也都非常恶毒的。很像港独啊、台独什么的，这些都没有什么好话。所以就会说，民主党是不是和共和党特朗普一丘之貉？对中国就关系好，也好不到哪去？


    这个我是不赞同的。


    共和党和民主党对于中国有一个最大的区别，就是共和党把中国当成他的第一大的危险。美国一个调查，里边说哪个国家是或者哪些事件是美国最大的威胁，共和党那边的人就说中国是第一大的威胁；而民主党那边呢，民主党那边的


    共和党和民主党对于中国有一个最大的区别，就是共和党把中国当成他的第一大的危险。美国一个调查，里边说哪个国家是或者哪些事件是美国最大的威胁，共和党那边的人就说中国是第一大的威胁；而民主党那边呢，民主党那边的


    以前的老年人，所以基本可以相当地可预测说，民主党这边，不太可能会主动地进攻，对中国像特朗普那样发起那么恶心的超乎预期的都不卖面子的那种进攻，包括把抖音禁掉什么的，这都非常的不顾自己的体面的这种打法。


    民主党那边还有多少有些冠冕堂皇，他会讲究一个什么全球人类的理念，要讲死这个，要师出有名，多少是讲一点面子的。特别是这种老政客，很难说就抛去政府的体面，像特朗普那样的发疯般的进攻。


    无论如何，拜登是会和中国采取一个有政府体面的交往方式，不会撕破脸去那么做事。这在之前他已经说明了，在一些关于这个全球气候，核裁军和核禁运，防止核扩散方面和中国是会有合作。


    还有一个问题，就是对于美国的中层官员的管控，美国有个词儿叫 deep state，就是说这些实际上在执行政府事务的人，他们实际上会干很多事。比如说最有名的关于中国的两个事儿，就是一个是九十年的轰炸中国大使馆；另外一个就是
    2018 年底，孟晚舟在加拿大被美国让人加拿大把他把他抓了。


    这两件事情，其实并不是美国最高层命令。可以说相当可能就是美国的这个 deep state 里边的这些具体执行的人，他们在中间搞鬼把这些事儿做成了，然后再让当时的这个总统克林顿，这个桀骜的时候，克林顿可能还不知道，包括这次孟晚舟被抓呢，也是特朗普都是不知道的。


    对这些人，他办出一些事对中国下狠手，如果没有一个有效管控的话，这很糟糕的。


    那么像拜登，他这个团队在政府里的经验非常的丰富，几十年在都在美国政府里边混，所以可以预期他和美国的 deep state 的关系，会好于特朗普，失控的可能性会少一些。


    我们最大的预期，或者说对拜登最大的预期，就是不要搞新冷战。如果说按照特朗普的路线走下去的话，按照蓬佩奥的那个说法的话，美国和中国下去就是搞新冷战了，那就是把中国当以前的苏联一样处理的话，很糟糕，这对中国队对美国都不是好事。


    但是如果拜登能够按照他以前一贯的行事风格，那么大家还是说有竞争没关系，但是不要搞成那种双输的竞争。


    下面再聊一些具体的领域。


    第一个领域就是在意识形态领域。


    其实特朗普对中国意识形态领域是不太看重的。比如说中国有一个名词叫公知，那就是谄媚拜美国的人怎么去赵美熙中。但是特朗普对这些人是没什么兴趣的，包括在香港闹出了2019的事件，港独事件，这个并不是特朗普闹出来的，特朗普反而对这些没什么支持的。


    为什么港独觉得特朗普这个人厉害呢？是因为特朗普对中国下手了。但是他其实是两回事儿。真正支持港独的人，在美国那边是希拉里手下的那些人，希拉里2009年开始搞颜色革命、软实力这些，直接导致了中国周边相当国家发生了颜色革命，中国也受到相当影响。


    所以说拜登政府上台以后，他相信会延续希拉里奥巴马时期的这种颜色革命的策略，跟中国的公知啊、港独啊、台独啊，交往会明显增加，所以这对中国这边会造成一些压力。


    但是这个事其实没那么可怕，中国已经证明根本就不在乎这些事儿，这个这叫受力的酱浆。其实只要中央有决心，这个根本不会有什么事。


    公知的影响在受到网络上的揭发都不太好混了。港独、台独，包括这个新疆、西藏这方面的事儿，明白人都可以看出来，没有什么大事，只要中国下定决心要平乱的诸都不是问题。包括所谓解放台湾，这都是时间表都开始了，美国在这方面想搞事儿不太容易。


    反而说是中国在这方面，是主动进攻的一个方面。我们不是防守，我们在意识形态方面不是防守的。


    我们在香港以前就是一个防守状态，撒手不管一样，一说意识形态，就是要谨守一国两制这些，怕别人批评什么的。现在通过国安法在香港的确立，目标都已经非常明确了：针锋相对，水来土掩，谁怕谁啊。


    所以这方面的意识形态的斗争，如果拜登政府发动起来的话，我们是完全不惧。甚至可以寄望，如果美国的攻击只集中在意识形态领域，对我们是个好事儿。


    我个人以为真正比较大的斗争，是在全球经济领域以及全球意识形态领域。比如说产业链转移的问题。美国说要和中国发生脱钩，让中国的一些产业转移到东南亚，转移到印度去。


    包括中国的一带一路这个意识形态和美国的民主自由的竞争到底是个怎么回事儿，这个斗争，我认为还倒真是有相当有看点。


    随着中国的不斷崛起，包括明天就要签署的 RCEP，15 个国家自贸区，中国一带一路的进展，也还是一直持以恒的在做，进展都相当不错。在这方面，中国也是一 going
    进攻态势，美国是防守的。不是说我们在意识形态方面，要去防守美国的进攻，中国也同时在进攻美国，我个人看好中国的意识形态会胜利。


    那么，在这个意识形态斗争以及国际政治经济斗争的大背景之下，中国公司和美国的斗争，主要集中在技术脱钩方面。


    技术脱钩，对中国的公司会造成很大的影响。我和何老师上次去华为，华为就是明显地压力很大，希望媒体对华为多支持。就是因为他们面对美国这个芯片断供，各种各样的以前完全想不到的打击手法，这对中国公司，确实不管是在国际上运营，甚至在国内运营都造成很大的影响。


    那么具体在脱钩这个事情上，美国和中国这个脱钩到底是什么态度呢？我也用两句话来总结一下。


    中国方面的对于脱钩的意图是这样的：我们短期内不希望和美国技术脱钩，因为中国的高科技体系其实是跟美国的技术体系，是依赖于他的，特别是 IT 体系，以芯片为代表的技术体系完全是依赖美国的。如果发生了脱钩，这个对中国的企业打击是非常大的，所以我们短期内不希望和美国脱钩，反而是说要紧紧地和美国捆绑在一起。


    但是长期来说呢，这个路线是一定已经确定了。中国长期来说一定要技术自主，要和美国脱钩。只有你从最底层开始建立了一个坚实的科技基础，能够和美国脱钩，才能能够说是我们最终不被美国卡着脖子。那个卡脖子的事是要死要活的事，这个路线长期来说说是不会变的。所以我们中国适合长脑短脱。


    但是美国和中国的这个企业科技方面的态度呢？相反它叫做短脑长不脱。


    这短脱的意思是什么呢？是因为美国像针对前苏联以及针对日本对他的挑战一样，它需要先给个下马威，要对中国企业造成一个重大的打击，最好把中国打出来一个经济危机来。比如说中国经济危机了，很多企业倒闭啪什么的，这是美国短期的目标。


    特朗普集团伙对中国发动贸易战，发动高科技战争，一个最大的目标就是给予中国造成短期的经济危机。


    然后，短期把中国打服了以后，就和美国签一个城下之盟。在这个基础之上，在美国划定的框架进行，还是要在美国的技术体系之内不要脱钩。


    所以对于这个脱钩的事，中美双方其实都是很清楚，最终还都是想脱钩的，但是有的时候又不想脱钩。所以搞 up 搞去，斗争很复杂。


    这个事儿在拜登政府上台以后，要观察他会怎么操作。我个人认为，拜登不会像特朗普搞得这么急，因为这个事儿对他来说过于遥远。特朗普已经证明了他跟中国打得这么狠，没有什么大的战果，什么所谓的中国经济危机根本没谱的事。


    反而是拜登，他有一点压力，就是来自于美国的很多企业，实际上因为和中国发生了贸易战，受损很严重。包括一些高科技企业像高通，要跟中国做生意。其实美国企业高科技企业和中国做生意是很积极很活跃的，只是因为特朗普政府要搞贸易战，要搞脱钩，弄得很不舒服。


    民主党跟高科技企业关系好，而特朗普则关系不太好，所以他反而打起贸易战来无所顾。拜登上台以后，他有可能把特朗普那些狠招的往后收一收，让美国的高科技企业在中国经营稍微顺畅一些，不要弄得就是真的不做生意一样。


    另外美国除了高科技和中国有斗争以外，还有很重要一个斗争是在金融领域，或者说在人民币升值贬值这些领域。


    关于人民币，也是有刚才这个脱钩的类似观察。比如人民币升值，那中国的目标是什么？


    中国的目标人民币要长升短不升。


    而美国对于人民币的态度，恰恰相反，它叫做要你短期升值，但是长期要贬值。


    这是因为如果中国发生经济危机，被美国竞争输掉了，那么中国人民币一定是长期会大贬的，甚至于 GDP 腰斩，这种事儿在美国的对手就都是发生过了。那么这种事儿长期是要中国人民币贬值。


    但是短期从战术上来讲，美国往往是要求升值，因为升值，那就是说表明它是模仿和日本的日元的事，就是要要求你升值，然后影响中国的企业竞争力这么一个态势。


    所以这就是跟中国相反的，叫做长期贬值，短期升值。


    我个人观察，人民币长期升值是肯定的。其实最近这个疫情发生以后特别明显，人民币长期来说是必须是必然升值的。因为中国发展良好，科技进步也是非常好，顺差也是创了历史记录，没有理由不升值。


    在金融方面，美国和中国在国际上有个很大的竞争，那就是美元的地位。如果说有什么货币可以取代美元，基本上只能是人民币了。但是另一方面，在金融方面反而是中国和美国可以合作的，或者说这是相关人员合作机会最大的领域。


    其实在 2018 年贸易战发生以后，美国方面为中国说话的，可以说剿剩华尔街都帮人了。科技企业、实体企业跟中国之前还是合作关系，但是慢慢也发现打不过中国企业，也是敌对，或者说态度不那么好了。只有华尔街的人，还是真正觉得和中国有很大的合作机会，包括说他们的钱鞘到中国来进行投资，都是很盼望的。


    中美还有一个很大的竞争领域，就是互联网。全球互联网基本上现在前 20，就只剩下美国企业和中国企业了。这是一个很奇怪的现象，美国互联网垄断全球，但是中国互联网企业也不弱。所以现在中国互联网企业走出到海外，包括这次的抖音事件，就是因为抖音走向全球，导致中美在互联网这个事也发生了竞争。但是在特朗普时期，这个矛盾都激化了，特朗普就直接下手了，包括说还要搞净网运动，说全球互联网就必须把中国企业，包括华为这些互联网基础设施都清除掉。


    美国的这个态度过于恶劣，特朗普过于恶劣。在拜登上台以后，个人认

