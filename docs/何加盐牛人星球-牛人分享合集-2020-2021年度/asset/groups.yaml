    这也是华为为什么人才选取一定要从 211/985 这些名校来，因为人很重要。

    因为人选对了很重要，因为我们认为这样学校的学生，大多数对自己的要求是比较高的，愿意上进和进步的动力是比较强的，本身对自我的要求也比较高，也更愿意自我挑战，对自己有更高追求。'
