    ## 如何应对剧变的时代和时代的剧变


    分享人：何加盐。

    时间：2020 年 12 月


    现在已经是 12 月 30 号，再有两天就是迎接新的一年了，很高兴能在岁末的时候跟大家做一次分享，而且这个分享跟我们目前所处的时代以及时代的变密密切相关。所以我起的这个标题叫做：如何应对巨变的时代以及时代的巨变。


    首先我想大家都看到，目前我们这个时代正在发生非常剧烈的变化，就好像之前都没有见过一年能发生那么大事的。我想就算是再过 1000 年，如果那个时候人类还在的话，我们翻看那个时候的史书，应该
    2020 年会在上面有比较多的篇幅，它有可能是个承上启下的一 个时候，我们看到不管是国际的格局，还有国内的这些产业的经济的变化，以及各种政策的变动，社会心理的巨变，以及我们每个人的生活，都或多或少有了很多的变动。那这些变化内在有没有什么一些逻辑紧密联系起来呢？


    我想，当我们看到这些变化的时候，可能我们要去分析一下，为什么是在这个时候发生这么多的变化？这些变化内在的原因到底是什么？如果我们可知其所以然的话，可能就能够对未来做一个相对准确一点的一个预测，也能够对我们自己安排自己未来的生活事业，学业可能有一定的帮助。因为古
    往今来，如果一个人能够察大势的话，啊他就可能能够提前做很多的安排。我们希望呢今天晚上这次分享能够在這方面对大家有一定的启发。当然呢这些分析和预测只是我个人的观点，仅供大家参考。我不是先知，也不是一个未来学家，只是根据自己的所学所思，提出一点自己的看法。


    首先和大家分享一个基本的概念，就是我是比较认可马克思所说的生产力决定了生产关系，或者说物质基础决定了上层建筑，也就是说我们看到的所有 的这些变化，背后的表象，有可能都是一些经济的、物质的因素在那里变化而引起的。所以我们可以先看一下，它内在最基本的驱动的变化因素是什么？


    在这里呢，前面可能会稍微枯燥一点，给大家介绍一点经济学知识，就


    是我们这个世界，每个国家或者说每一个经济体，它的财富的增长，企业利润的增长，我们每个人平均收入的增长是跟什么东西有关？


    在经济学上，我们所有的经济的产出是跟三个东西有关。第一是劳动力。第二是资本。这个资本不仅仅是钱，包括土地啊、机器啊或者我们这些基本的设施等等。第三个，就是如何组织这些资本和人力的
    Farm，也是技术。一切的经济都跟这三个东西有关。


    在 一个相对固定的时期里，或者说短时间内，人力和资本它的变动是比较小的，甚至可以说是认为固定不变的一个常数。那么在一个固定时间里，对经济影响最大的其实就是技术的提升。本质上我们看到的所有的经济增长，都是技术提升的过程，如果没有技术的进步，几千年人类文明大家都看到了，可能就是像农业时代一样，它是固定不变的。从唐朝到明朝，可能人们的生活水平都是差不多的，用的用具也都是差不多的，可能会样式上有些许的变化，但是对生产力的提升来说是不会有大的变动的。


    从蒸汽机革命开始，也就是说工业革命开始以来，人类组织劳动力和资本进行生产的方式发生变动了，也就是说每一个人每一亩土地、每一台机器能够产出的东西增加了，这就是技术带来的生产力的革命。技术会使得整个社会的劳动生产力提高啊相应起来，也就是说企业的利润会增加，人们的平均财富会增加，整个社会的财富也都增加。所以我们看到在工业革命时代，技术使得西方国家先发展起来，然后他引入到东方的时候，日本这样的国家先使用了西方技术也发展起来，但是中国一直没有好好的吸收这些技术，所以就落下了。


    当然西方的 发展还建立在一定程度的剥削全世界这个基础上，这一点也是有一点作用，但今天我们暂时不讨论这一点，我们是讨论不存在对外剥削的情况下，一个内生经济的模型它是怎么增长的？


    技术的发展，刚开始会带动一个经济体经济快速的增加，人们财富快速的增加，所有人的生活水平，你可以在不侵害他人利益的情况下，你的利益得到增长，这个叫帕累托改进。技术的增长就可以做到这一点，也就是说蛋糕做大了，每个人都可以多分一点。但是它也存在一个问题，如果技术的发展停滞了，那么这种增长的势头也就慢慢的会停止。我们可以用下图来比较直观的看


    一看（见文本）。


    在最开始没有技术革命的时候，我们是处于 t0 的阶段，当技术开始爆炸的时候，我们就进入了的 t1 阶段，大家可以看到不管是企业利润还是平均收入还是社会总财富，它会随着时间的推移快速地增加。但是，技术的效用，当它跟劳动力和资本已经融合得非常好，它能够给劳动力和资本带来的效率提升到了顶峰之后，这个社会就会有可能陷入了一个经济停滞的阶段。


    但好就好在，技术它是一个不断进步的过程。我们人类从蒸汽机革命以来，先后经历了蒸汽革命、电力革命、信息革命。信息革命可能后面又分为互联网革命和移动互联网革命。所以，每一次新的技术增长都会把之前上一次技术增长带来一个天花板，会把它往上推移，所以人类才能够不断的进步，我们的生活水平才能够不断的提高。就像下面这样。


    那么随着一次又一次的技术革命，人类的生活水平在不断的提高，只要是技术到达某个地方，并且能够跟当地的人力和资本紧密结合的话，一般当地的财富生活水平都会有比较大的提升。但是这里就有个问题，如果当技术不再进步的时候，人类社会的财富就会面临一个天花板。就是上面这张图里面我用实线来表示了，当技术不再进步的时候，那就是一个企业的利润、一个社会的平均收入、以及一个社会的总财富能够达到的一个天花板。


    技术的进步存在一个特点，一个非常不好的特点，就是它的不均衡性。从国家来讲，它在每一个国家之间不是均匀发展的，有可能会在 a 国发展的很好。在 b 国却不一定能应用得上。所以我们可以见到从工业革命以来是欧美先发达起来，然后日本，然后再到韩国、台湾、新加坡、香港，然后再到中国大陆、印度这些地方，而且你的劳动力和资本要能够跟那些技术匹配的上才能够发展。所以从清朝开始，虽然说西方的技术进来了，但是中国的劳动力和资本不能够跟那些技术匹配，只有当新中国成立，尤其是改革开放之后，我们才能够把这些技术给引进来吸收消化掉，才能带来生产力的提升。


    这是个横向的不均衡，它带来国与国之间发展速度的不均衡，另外还有一个纵向的不均衡，就是从时间的维度上，技术的发展是跳跃性的，突然产生的，而且很多时候是没有规律的，断续的。所以呢，我们可以看到人类几万年没有发生技术革命，突然从蒸汽机开始以来，发生了工业革命，一直持续到今


    天的各种信息革命。可以说，人类社会其实就是从工业革命开始分成两个阶段，我们可以把人类社会叫做工业革命前和工业革命后两个阶段，但是从工业革命以来吧，大的技术进步发生了大概这么三四次，小的呢我们就不算了，像电话啊电报呀这些的发明。


    比较遗憾的是从蒸汽革命、电力革命、信息革命以后，人类的技术革命就没有再出现过类似程度的这种大跳跃了了。90年代发生了互联网的革命，带动了美国的繁荣，以为您维持了世界这些年的经济的增长。然后
    2010 年以来发生了移动互联网的革命，又持续了大概 10 年的经济增长。但是我们也可以看到国与国之间的发展不均衡了，一个国家内部的不同时期的发展也不均衡了。


    从国家的发展来讲，目前我们面临的最大的世界格局的变化，就是中国的崛起和欧美日的相对衰落，他们并没有绝对的衰落，只不过是因为他们相对速度变慢了。而中国的速度还是很快，所以导致双方的力量对比发生了变化。这个是怎么引起来的呢？那就是因为中国之前已经储备了大量的高素质劳动力，加上我们新中国建立之后，又是搞什么？大力的扫盲，解放妇女，人民公社等，就是说让中国非常庞大的农村劳动力，具有了一定的知识技能，并且具有了组织纪律性。


    这个对于发展工业来说，就是储备了非常好的人力资源。另外我们又大修水利大搞基建，铁路、公路，水库，重化工厂，这个基础都打好之后，然后改革开放。那么在这么多的高素质的劳动力，储备了这么好的资本之下，这些先进技术一进来，中国就迅速地进入一个飞速发展的时期，这个发展速度可能是人类历史上最快之一，就跟日本大概
    50~70 年代和台湾 80 年代差不多，但是他们也没有持续时间这么长，中国可能持续了 40 多年。


    我们大概用 30 年的时间补上了工业革命的课，然后到 90 年代的时候，那个时候其实我们已经把这种技术融合的差不多了，该到装藏的时候了，但那个时候又发生了互联网的革命，中国赶上了这一波浪潮，没有落后。所以从
    90 年代以后，中国照样发展得很快。2010 年前后，在移动互联网领域，中国就不只是赶上了，而且是引领了，那至少是和美国一起引领了互联网移动互联网的革命。所以到从
    2010~2020 年，中国也还是继续飞速的发展，而且发展速度比美日欧都快。所以到现在中国的总体经济实力已经非常接近美国。那么 5~10 年内


    中国的GDP是肯定会超过美国的。


    而且我们的工业生产能力、14亿人口的市场消费能力、我们的进出口规模，实际上都已经超过美国。另外在航空航天、人工智能、生物科技这些方面就已经跟美国差不多不相上下，可能有些地方还差一点点，但是有些地方超过一点点，平均起来可能是可以达到平分秋色的地步，然后在另一些方面，例如移动互联网的应用，基础设施的建设，滤高铁、高速公路、火车站、机场、城市建设，以及我们的社会总体安全水平，社会综合管理能力，重大灾害应对这些方面，我们已经形成了全球的领先优势。


    这反映在国际格局上，就是以前的一个超强旧格局要被打破，美国作为唯一的超级帝国的地位被中国挑战了，这个挑战可能会给我们给世界带来一好一坏两个结果。


    其中好的结果，就是中国对世界的影响力会更大，这就意味着在生存竞争中，如果我们把全球各个国家看作是要争夺这个资源或者发展空间的话，当我们对世界的影响力更大的时候，我们就会拥有更好的竞争优势，得iket更好的保障。也就是说我们未来的总体的生活水平是相对于其他国家更容易保障一点。另外我们长期积贫积弱带来的这种民族自卑，会大大减少，我们的自信心会更强，国民的尊严会更多，我们走到国外去的话，起码在表面上他们会给我们更多的尊敬和尊重。因为你的消费能力以及国际影响力都摆在那里。


    这一点我inar大家其实已经都感受到了，尤其是经常出国的朋友可能会感受到非常强烈。就是说中国跟我们曾经以发的发达国家相比，很多地方都已经赶上，甚至有些超过了，我们也受到更多的尊重。当然他们内心有可能会有一些抵触，或者害怕，觉得中国抢夺了本该属于他们的资源，但是这些跟以前那种鄙视是不一样了，他是把你当做一个强者来看待。


    这是对中国人来说好一个发展方向。那坏的结果呢，就是中国跟美国的关系可能在一段时间内会更加的糟糕。


    会，也会用一切手段去谋求替代强国的主导地位。这个是国家发展利益的必需，对于守成的强国以及挑战的国家来讲，只要是走到这个位置，通常来说这个不以人的意志为转移，会形成这么一个竞争对抗的局面。


    在历史上，这样的故事已经发生了很多次，很少有例外的。它为什么叫修昔底德陷阱？就是修昔底德这个历史学家写的伯罗奔尼撒战争史，就是当时的伯罗奔尼撒半岛上面，雅典跟斯巴达，一个守成国跟一个挑战国之间战争，那么后来人们用这个来指代后面一切此类visning的挑战。在欧洲的历史上就发生过多次，英国跟法国的挑战，法国跟德国的争霸，然后法国跟这个俄国，最后唉就是美国又出来了。美国是唯一的例外，它没有直接跟当时的第一强国发生战争，但是它也是通过战争起来的。


    美国通过一战和二战，并且通过二战的胜利取代了英国的主导地位，这个可能是一个很少的一次守成国跟挑战国没有发生直接的战争。那么美国在成为第一之后，后面它也面临过苏联的挑战，日本的挑战，但是它通过冷战把苏联撤下去，又通过广场协议等这个金融贸易竞争，有把日本压制得死死的。另外日本的领土上还有美国的驻军，所以它在军事上是没有办法挑战美国的。现在就是成了中国和美国直接面临这样的一荒竞争局面。


    那中国的崛起能不能避免修昔底德陷阱？这个我也现在也很难说，它既考验我们领导人的智慧和胸怀，同时也考验对手，即美国人的智慧和胸怀。这个你一方是没有用的，如果你想跟美国修好，人家得寸进尺，那个生意也做不成，所以必须得双方都有让步都有取舍。


    经济上学，在博弈论里面，一般来说两个互相不信任的人会形成一个均衡结果叫做纳什均衡。这个纳什均衡对双方都不是最有利的，我们叫非最优解，但是它是会达到的一个结果。


    那么这个纳什均衡，它是可以透过两个人的合谋来打破的，但是达到合谋，必须得双方的信息完全透明，然后双方又能够完全互相信任。我看在中国跟美国之间要达到这种合谋，还是相对比较难的。但是现在比较好的一个是什么呢，因为世界毕竟还是一个核恐怖平衡在起作用，所以以前那种大的战争应该是不会有，就是瞬间灭国的战争不会有了。美国跟中国都不会打，因为打的话最终有可能走向这个热核战争，整个地球可能都毁了，但是小范围的局部战

