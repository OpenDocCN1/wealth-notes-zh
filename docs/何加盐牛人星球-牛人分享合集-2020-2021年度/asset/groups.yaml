    另外一个被忽略的渠道就是邮件，其实很多大公司的职员或者高校老师都有工作邮箱的，这个工作邮箱的命名是有规律可循的。如果你想联系某个大公司的高层或者某个知名教授，可以去寻找规律猜测出邮箱。对于这些大牛来说第一次接触用邮件沟通也是比较合适的方式。因为邮件是他们日常工作必须严格要处理的，你发的邮件如果没有被当成垃圾邮件的话他基本上都能够看到的。


