  - '[PAGE 139]


    # 什么是绩效


    +   > 绩效是员工、部门或组织的活动所带来的经济产出。

    > 华为绩效指的是绩效结果导向。

    > 绩效考核就是要给绩效结果一个公证的评价和合理的定级，所以绩效就是为客户创造价值。



    # 绩效不是过程、不是行为、不是能力


    +   - 大量做事、努力、苦干

    - 完成任务、速度

    - 有热情、干劲、学习能力

    - 对工作超负荷投入

    - 管理方法

    - 善于发现问题



    # 而是绩效结果


    +   - 营收增长、成本降低、客户满意度、交付准时率、质量达标率

    - 业绩完成量/达成率达成率 vs 承诺

    - 个人能力达成目标/达标

    - 客户满意度提升、团队贡献价值

    - 创新成果、制度完善



    华为的绩效，首先对绩效的定义大家都了解，就不再解释。这里重点讲下华为的绩效导向是责任结果导向，所谓的责任结果导向是什么？其实它重点还是在员工是否在自己的岗位上能对应的履行他的责任和对应的能力将他所承担的职责做出有效的产出，真正的为客户创造价值，真正的为团队做出贡献。


    在华为很多时候讲的是贡献，你个人的贡献，特别是个人对团队的目标贡献，当然如果是非销售岗位，衡量比较简单，如果是非销售岗位特别是后勤人员岗位，感觉评价贡献是很臒的，所以这类岗位盯住一个关键点，就是这个员工的岗位职责是什么？他在这个岗位上应该做些什么事情，然后他所对应要做的事情是不是做到位，就是说他是否不仅做出了自己本岗位职责所要求的工作职责，还完成了超过这个岗位职责更多的内容。那这样的员工华为是非常喜欢的。而这个导向就是责任结果导向，确切来讲，就是拿最后的业绩/工作目标来说话。


    在华为，高层主要是 KPI 考核，涉及目标分解，但对很多基层员工其实很多工作没法量化，那就没法量化就不能考核了吗？不是的，他是能够考核的。很多企业都想学习华为，都想知道华为的绩效管理到底是怎么做的。'
  - '[PAGE 140]


    # 绩效管理的步骤


    ![](img/d43ec9f811a059e999583aaeac906d81_140_0.png)


    我先说一下华为的绩效管理是有完善的步骤和流程，要求管理者按照流程执行每个步骤，这点很多外面的企业想要学习的时候经常是学不到的。比如严格的要求管理者对你的下属真正做一对一绩效面谈，真正要求你的管理者去跟你的员工沟通绩效目标；再比如说为了确保员绩效考核结果评议的公正性，为了避免由主管一个人考核一个人说的算而失去相对公正，由此而增加的集体评议。这些动作其实在很多公司效仿和学习是有难度的。


    那我说明一下华为是怎么做的，华为利用 PBC 这个管理工具和员工谈个人的绩效承诺，即绩效目标。目前比较时尚的绩效管理工具是 OKR，事实上 ORK 和 PBC
    有异曲同工之妙。二者都是为了激发员工自主的去挑战更高目标。


    华为绩效管理会按照 4 个步骤执行，即目标制定，绩效辅导，绩效评价和结果反馈，那每一步骤到底怎么去做，才能真正有效落地。


    我先给大家看一下什么是 PBC，很多人都想了解真正 PBC 是什么，以及 PBC 长什么模样，先说下 PBC 和别的不同之处有几个。'
  - '[PAGE 141]


    ![](img/d43ec9f811a059e999583aaeac906d81_141_0.png)


    第一个、它的内容主要是由4部分组成 业务目标、人员管理的目标、价值观现行为和个人发展计划，但价值观现行为后面其实慢慢弱化，因为随着企业文化的成熟度在提升，这一快其实是不做严格考核的，现在会有个年度的劳动态度打分。


    第二个、是业务目标、业务目标里面我们会分三个标准，第一个就是不可接受的标准，第二个是有效达标的标准，第三个是卓越的标准。


    那这里我给大家讲一个小故事，针对前端一线的销售人员在定销售目标的时候，领导会怎么做好呢？他会跟这个部门长就是这个销售部的负责人说，基于市场的分析（补充下：很多公司在做销售目标的时候，可能会说基于公司内部的资源，觉得有这样的困难，或有这样的限制，可能年只能达成多少目标），但在华为定销售目标的时候，它更多不是基于组织内部有什么样的资源，而是基于市场环境，比如认准了这个市场今年是有多大的机会，有多大的蛋糕份额，那就就要为了这个蛋糕去挑战目标，去定超出大家所认知的目标。


    那怎么定呢？延续刚才的故事，这个领导会跟销售部门说你在你手上写一个你今年要增加的目标，比如说增加30%或50%，又是100%都可以，然后我也在我的手掌上写上我期望发展的目标，一会我们俩都拿出来看，如果你定的目标低于我的期望，那你就可以下课了，换句话说，就是这个市场你不用做了，我交给其他人来做。有趣的故事是，后来他们两同时伸出手来，发现销售负责人写的是120%，而领导手里是空的，什么也没写，但这个120%就是他们当年的目标。'
  - '[PAGE 142]


    当然这个故事是很用意思的，很多时候华为就是靠这种让管理者承担更高要求更有挑战的目标，去将目标考核设定的更具备挑战性。定好挑战目标以后，更多的是想激发这个部门领导，他能够自主的去挑战他自己认为的目标，因为每个人对市场都会有分析和判断的，为了实现自己的岗位价值，他也会去设定自己一个可以挑战的目标，带着队伍往前冲。


    这个目标通常我们就定义为挑战目标（120 分目标），是需要团队跳一跳够得着而定的目标。那为什么不是基于资源内部呢？因为资本内部本身含有各种约束，理由太多了，在华为的观点里面，只要你设定好销售目标，你就是火车头，你会拉动后面的火车车厢去支持你和配合你。华为通过前端的销售，相应的倒逼后端的研发，倒逼后端的研发和供应链生产配套去支持到销售来完成。所以只要前面的带头做好了，后面的队伍跟上是没有问题的，这就是华为在定销售业绩目标的一个基本原则。


    有效达标的标准就是最基本的要求，按 100 分的标准，不可接受的标准就是 80 分的标准。如果你真的落到了 80~100 之间，那这个销售负责人是真的会下课。通常销售目标的保底线就是不增长或增长小于平均值，这在公司看来就是不可接受的，一定是要有增长的，最好是能够跳一跳而达到的增长率（当然如果有些是新市场，是战略定位等情况设定有些不同）。


    针对绩效考核定量方面，主要是针对前线的岗位，那我们对绩效考核的“考”就跟考试一样，用数据做考核。针对职能端的岗位，主要是定性，更是通过重点工作目标和方向，还有关键举措，通过定性的方式做绩效考核，也就是定性重在核，核实他的绩效结果。


    每个员工都会对自己的绩效完成情况做自评，比如说你是非销售岗位的人，没有量化指标，但可以针对完成的工作性质，完成的结果做描述。那作为管理者除了对员工日常工作了解的部分评价外，其余不太了解的情况，就要通过
    360 周边调查核实，真正做够清晰了解员工实际完成的绩效结果，然后就这个结果的方向和目标是不是跟团队组织要的方向目标是一致的。如果是的话，那么相对来讲这个员工的绩效结果就不会差。


    现在很多企业的通病或者说大家会有一个现象，就是极力的去花很多的时间精力，不断的去思考如何给员工设置考核 KPI，老想着怎么去量化考核，实际上'
