    ## 儿童基本保健知识


    分享者：上海交通大学新华医院儿科主治医师 焦先婷博士


    分享时间：2020 年 10 月


    各位星友，大家晚上好，我是上海交通大学新华医院的焦先婷，很高兴今晚能在这个群里跟大家交流一下。


    我是一名儿科医生，前期受到何老师的邀请，让我给群里的星友们讲一点儿童保健方面的知识。鉴于星友群里的爸爸妈妈们对于育儿知识已经有了基本的了解，再加上医学知识的专业性特别强，对于怎么讲好这个话题，我之前也是有些顾虑的。后来我想了想，还是结合我在临床中，家长们比较关注的几个问题来展开并讲一讲。


    ### 一. 孩子发热要不要去医院？


    这是在咨询的过程中家长问最多的一个问题，这个看似简单的问题医生也需要在询问家长一系列的问题后才能给出判断。


    如果单纯的发热，我在这里强调一下对于不同年龄段的孩子，家长需要关注的地方要有所不同。


    - 1. 对于 1 岁以上的孩子：孩子精神状态不错，胃口不错，能玩会笑，就 可以居家观察。


    需要在家注意观察的地方是：注意及时监测体温，体温超过 38.5℃（腋下）或者 39℃（耳温）以上，可以口服退热药（美林或者泰诺林），退热药一般需要间隔 6
    小时以上口服第 2 次。


    再就是注意多给孩子喝水补充水分，因为在发热的时候身体水分会蒸发比较厉害，及时补充水分对于退热来说非常重要！


    这里需要注意的地方是需要注意孩子手脚的温度，孩子的四肢温暖，热乎乎的，就没有关系，如果四肢冰凉，或者四肢都开始抖动了，说明体温处于上升期，肌肉在收缩，需要用大人的双手帮忙搓揉，或者温毛巾擦搓，让手脚的血管扩张起来。增加散热。


    如果孩子出现寒战，四肢抖动，就很容易出现抽挛，这种情况就是我们所说的高热惊厥。什么样的孩子容易出现高热惊厥，跟孩子的体质有关，因为小婴儿，一般是3岁之内的孩子，大脑的这个调节机制还没有发育完善，体温快速上升的时候，大脑一下调整不过来了，就出现了抽搐。


    一般情况下是出现1次抽搐后，下次发热就很容易出现第2次抽搐，所以抽搐过1次的孩子下次发热的时候需要注意，及时测体温，尽量不要让孩子出现四肢冰凉、寒颤。高热惊厥都是很快的发生，1分钟左右就停止了，所以家长也不需要紧张，一般不会对孩子大脑有什么影响。一般到6岁以后高热惊厥就很少会发生了。


    2. 对于6个月到1岁之间的宝宝：很多都是第一次发热，家长会表现的很紧张，经常手忙脚乱，处理判断的方法跟上面一样。


    这个年龄段宝宝很容易是幼儿急疹，幼儿急疹的表现就是：在发热第3天左右后体温退下来后，开始出现皮疹，典型的热退疹出，这种皮疹不用特殊处理，一般2-3天会自行消退干净。


    还有少部分的幼儿急疹不是这么典型的，发热1-2天或者低热，皮疹也不典型，幼儿急疹就这样发过一次了。


    幼儿急疹基本都是得一次后就不会再得了。其他的就是观察体温、喝水、观察精神状态都是和上面一样的。


    3. 对于<6个月，尤其是<3个月的小宝宝：发热一定要引起注意，因为这个年龄段之内的孩子，他从妈妈什么传递过来的抗体还有效，所以普通病毒感染相对是比较少的。


    这个年龄段的特点是孩子的自身免疫能力和血脑屏障还没有发育完善，再加上这个年龄段孩子生病的表现很不典型，一般超过38度以上就建议及时到医院就诊检查。这个年龄段的小婴儿，医生都会很谨慎。


    4. 关于发热的长短：一般1个普通的病毒感染需要3-5天的过程，家长无需过度紧张。3天是一个时间点，3天后发热开始有好转的趋势或者体温退了就没事情了，如果3天后还是高热不退或者出现了很明显的咳嗽，就需要当心合并有支气管炎或者肺炎的可能了。


    另外就是密切注意孩子的其他表现，有没有腹泻、身上有没有皮疹、淋巴结肿大的情况，需要另外鉴别考虑。


    ### 二. 孩子好好的怎么突然就发热了？到底是什么原因引起的发热？


    这是每个发热的宝宝的家长都会问的问题，这个问题也是我们医生需要辨别的问题，因直接涉及到我们的用药方案。孩子的发热原因主要分为3大类：


    - 1. 细菌感染：细菌感染在引起小朋友发热的原因里属于少数部分的，一般如化脓性扁桃体炎、尿路感染、肺炎链球菌引起的肺炎等。这种感染除了发热外，有喉咙痛、小便的时候痛、咳嗽很厉害外，验血报告里会有白细胞升高。


    - 2. 病毒感染：病毒感染引起的发热占到儿童发热的一大半以上，那么怎么会病毒感染呢，如交叉感染，家里人或者小朋友之间，尤其是刚痊愈或者前刚刚托班或者小班的小朋友，经常会被交叉感染。第2种就是着凉，吹风或者玩着出了汗突然后把衣服脱了，避被子着凉等，这种情况在中医上的术语就是风凉引起的病毒感染。


    - 3. 第3种情况就是无缘无故就发热了；家长发现不了明确的原因，并且这种情况还是很常见，可以从中医的角度来解释家长比较容易理解，就是大家经常听到的上火或者积食了，经常会听到说是胃肠型感冒等等。小朋友尤其是小婴儿的胃肠功能还没有发育完善，在正常饮食一段时间，尤其是这段时间胃口特别好后，很容易出现胃肠道积食这种情况。


    人的真食道的表面积是非常大的，肠道是人体非常重要的一个免疫器官，胃肠道出现积食后，人身体的免疫功能就下降了，这个时候很容易就生病发热了。


    最近这几年特别热门的肠道菌群紊乱就可以解释这种情况，孩子胃肠功能紊乱，出现发热、胃口不好，甚至还伴有吐吐，这样前后前后会折腾个2周左右。所以一般医生会建议3个月左右需要给孩子调理一下，也就是经常说的开开胃，小婴儿给孩子吃几天益生菌，大点的可以熬点山楂水，或者鸡内金散。鸡内金散这个现在在很多地方都买不到，在乡下或者小地方估计还能有，或者从老家乡下会弄到这个东西。


    至于上火也是积食的一种表现，如果孩子出现眼屎很多，并且是黄色的，或者小便很黄，小男孩可以看出尿道口很红，说明体内火气旺了，可以给孩子熬点冰糖雪梨，金银花水、山楂水都是可以的。每天坚持给孩子多喝水，饮食清淡几天。


    ### 三、关于孩子腹泻的问题


    腹泻就是拉肚子的问题，引起腹泻的常见主要是：


    - 1. 病毒感染如轮状病毒、诺如病毒，这种病毒每年都会有1-2次的小爆发流行，很多孩子都会中招，这种病毒感染除了引起的拉肚子大都是拉水样的便，很稀，还经常会伴发热或呕吐。


    - 2. 由于饮食不当的原因引起的，母乳喂养的很容易受妈妈饮食的影响。

    孩子吃了冰箱里直接拿出来的冷的东西或者不小心变质的东西，或者孩子爱吃什么时候一下子吃了很多等等。这种情况很快孩子会出现上吐下泻。出现拉肚子情况时一个主要的观察点：注意密切观察患儿的精神状态、尿量、眼泪，观察孩子会不会出现脱水的情况。


    关于拉的这个情况：不要着急给孩子吃这种止泻的药如蒙脱石散和思密达等，尤其是着凉或者病毒、细菌感染引起的拉肚子的时候，因为这种情况下拉出来的便是具有排毒和排菌的作用的，迅速把拉肚子止住了，这些细菌或者病毒就通过肠道吸收进血液了，孩子会出现发热了，所以拉肚子在不出脱水的情况下，就饮食调整和益生菌调整，补充水分防止脱水就可以了。


    关于孩子出现吐的这个情况：不管孩子是什么原因导致的呕吐，刚呕吐完一定不能给孩子吃任何东西包括喝水。因为呕吐的时候孩子胃肠道处于痉挛状态，刚呕吐完就马上吃东西会导致越吃越厉害。等差不多一个多小时没有呕吐，先少量喝几口水，注意观察一会没有呕吐再少量喝水，观察半小时左右没有再呕吐。可以少量米汤或者薄粥，少量多餐，慢慢添加起来。同时注意观察孩子精神状态，小便量，眼泪，脸色情况，如果精神还可以，有小便，有眼泪，脸色正常，就可以继续在家里观察。


    那么拉肚子的时候饮食该怎么吃呢？这个时候饮食的调理尤其是恢复期饮食的调整是非常重要的。推荐可以吃的食物包括：大米（米汤、粥、米饭）和小麦（馒头、面条、面包）；对于水果和蔬菜，平时是用來软化大便的，这个时候吃的话就不能随便吃了，这个时候推荐吃蒸苹果对腹泻有比较好的帮助，蒸苹果单宁酸作为肠道收敛剂，有轻微的止泻作用；对于奶能不喝，在拉肚子的时候，能用辅食代替的尽量少喝奶，小婴儿只有奶的情况下，就少量多餐，必须时候换成腹泻奶粉。蛋白肉类的就不要吃了，这个时候胃肠功能本来就比较弱了，再蛋白质高的饮食肯定会影响病情的恢复。所以在拉肚子的时候，饮食的调整是很重要的。


    ### 四、现在家长比较关注的孩子蛋白过敏的问题


    现在由于环境污染问题，饮食中添加剂等同问题，过敏的孩子是越来越多。在孩子身上过敏的问题主要是湿疹也就是特应性皮炎、过敏性鼻炎、食物过敏和喘（哮喘）。


    这几个表现一般都不会是单独出现的，经常好几个连着都有，或者连续着出现，如小的时候湿疹比较多的孩子，后面长着很容易就会有牛奶蛋白过敏，再大点过敏性鼻炎的可能性就很大。


    这里主要说一下牛奶蛋白过敏的问题，很多家长本来就头疼的喂养方面，又带带着食物过敏，所以很多家长都很头疼。


    引起孩子过敏食物主要是：


    - 1. 牛奶和含牛奶的食物（这是小婴儿接触的第一道食物）

    2. 鸡蛋

    3. 小麦、大豆

    4. 芒果、猕猴桃

    5. 花生

    6. 坚果，如杏仁或腰果

    7. 鱼

    8. 贝类，如虾或牡蛎

    9. 芝麻


    其中最常见和多见的就是牛奶蛋白过敏。


    牛奶蛋白过敏最早出现，一般在 3 个月左右的时候就出现皮肤和胃肠道为主的症状，大多数患有牛奶蛋白过敏的婴儿都表现 2 种及以上的症状，累及 2 个及以上的器官系统。


    我们做为家长主要关注的是孩子这些表现到底是不是属于过敏的情况？主要是消化道和皮肤症状。


    胃肠道症状包括：易激惹 - “肠痉挛”、呕吐和反流、拒食或厌食、腹泻样便（稀便和/或便次增多）、便秘（尤其是软便，过度用力）腹部不适、腹胀伴便痛、血便和/或粘液便（其他状况良好婴儿）。


    皮肤症状包括：瘙痒、红斑、非特异性皮疹、明显特应性湿疹。


    呼吸道症状：鼻塞、流涕、喘息、慢性咳嗽（排除感染）。


    全身表现：困倦、睡眠差、无精打采、烦躁不安、哭闹不止、生长发育障碍、严重过敏反应。


    如果明显是过敏的情况，饮食上该怎么注意的问题。大部分的还是轻中度牛奶蛋白过敏，我们建议选择深度水解配方奶粉，如果是重度的就选择氨基酸配方。


    一般新手妈妈在选择奶粉的问题是非常纠结的，因为毫无争议的大家都知道母乳对宝宝来说是最好的。


    如果孩子确实是过敏的这些表现，体重增长的很不好，那就选择合适的奶粉，一般 3 个月左右的时候症状会明显改善，孩子体重开始增长，这时候可以慢慢进行奶粉的调换。随着孩子年龄的增长，肠道功能的恢复，过敏的情况慢慢会好转的。


    85%-90%的牛奶蛋白过敏患儿会在 3-5 岁时自然脱敏，从 3 月龄到 3 岁，是个漫长的过程，特别它是包含了婴儿快速生长发育的时候。


    ### 五、说完腹泻的问题，我看我们群里提问很多关于便秘的问题。


    现在便秘的孩子是越来越多了，关于便秘的原因主要还是饮食问题，饮食的搭配比例。现在全民的饮食结构都发生变化了，现在大人每天都能注意多蔬菜水果，而对孩子来说还是有问题，大人可以主动控制自己多吃蔬菜水果，孩子却没有这个主动意识，不喜欢吃就是不喜欢。


    孩子的便秘问题多数在 2-3 岁才明显凸显出来，这个时候饮食的习惯已经养成了，再反过来改变孩子的饮食习惯是也非常困难的，所以一定要在辅食的添加阶段就要注意。


    小婴儿在添加辅食的开始阶段，新手爸爸妈妈们关注的都是孩子的高蛋白营养问题，一天没有吃到鱼虾啊都很着急，而蔬菜水果少吃或者不少到觉得问题不大，慢慢的就出现了孩子的饮食习惯问题，等这个习惯养成了，再反过来改掉是很难不容易的，这个我们医生就一句话，调整饮食习惯，说起来容易，能坚持做好的是非常不容易的。尤其是把孩子的一日三餐交给老人的，那更是难中难了。


    还有一个需要关注的是家长自己的饮食行为，现在我们的爸爸妈妈们也都是家里的独生子，本自自己的饮食习惯，饮食行为就有问题，在餐桌上对孩子是有很大的影响的。


    再就是需要训练孩子的排便习惯，培养排便习惯，每天诱导着固定时间排便。每天必须喝一定的水量。


    ### 六、要不要使用抗生素的问题？


    现在家属是听到抗生素都很紧张，面对医生的是有 2 个极端现象：


    - 一种就是每次坚持要用抗生素，觉得不用几天抗生素孩子是不会好的；另一种就是很抵触抗生素。


    那么到底应该怎么选择？如果已经明确有细菌感染，需要使用的时候就必须使用，要不然细菌感染扩散导致病情加重，最后导致只能使用更高级的抗生素就没有必要。在没有明确有细菌感染的时候，家长们不要很随便去使用，现在国家在严格控制抗生素的使用上已经采取了很多措施，一般大医院，尤其是专科的三级以上医院抗生素都控制的很严，不会随便给开抗生素了，这个情况也是有一定的国情因素在，改变这种现象还需要一段时间。家属来看病的时候可能还没有明显的细菌感染，想着好不容易来一次了，排了很久的时间，就要求开点抗生素，就这样抗生素就用上了。


    ### 群里的提问问题：


    - 1. 晚上踢被子，着凉后咳嗽问题。


    这个问题是个普遍性问题，每个孩子都会这样，对孩子来说，睡觉的时候盖住肚子，胳膊和脚露出来就可以，盖的被子或者毯子比大人稍微薄一点。或者方便的话就使用睡袋比较好。


    因为孩子的植物神经调节功能还没有发育好，刚睡着的 1 个小时内，尤其是半个小时之内，会出很多的汗，一会的功能就会额头、前胸后背很多汗珠，这个时候如果不注意更换，孩子稍微加盖的东西就很容易着凉。


    这种情况下的话，建议睡着后马上在枕头和后背垫一块纱布巾，等汗出了后把下面的纱布巾换掉，把前胸的汗及时擦干净。一般等入睡1小时后神经系统调节稳定后，汗就会少很多，如果后面还是很多汗的话，那就说明肯定是盖多了。


    还有一种建议就是刚入睡的时候稍微盖的少一点，后面稳定了后稍微再加一点。着凉后咳嗽，流鼻涕现象，一般管好入睡开始的这段时间就会好很多。


    - 2. 二胎家庭，老大吃醋问题。


    这个问题其实没法回答，每个不同年龄段孩子都有敏感的事情，希望家长关注和得到家长的诱导，家长需要照顾到老大的心理需求，每件事情需要耐心给老大讲解，慢慢的肯定义会接受二宝的。


    我身边很多这样的例子，包括我们的医生同事，说起二宝眉飞色舞，说起老大咬牙切齿。我们不停提醒，家长也知道这个问题，但是需要慢慢调整。


    - 3. 3岁孩子睡觉打鼾问题。


    这个需要引起重视，如果仅仅是感冒期间打鼾，感冒时候扁桃体、腺样体肥大引起，等好了后慢慢就好了。


    如果长期打鼾，需要去医院耳鼻喉科检查，看看是不是腺样体肥大，评估后再决定治疗方案。因为打鼾意味着呼吸道有堵塞，长期会引起大脑缺氧的，不能轻视。


    - 4. 肥胖问题。


    必须饮食控制和坚持每天的运动量，很不容易，但是必须引起重视。儿童肥胖引起一系列的身心问题，肥胖的孩子容易出现性早熟，本来现在在饮食营养的问题孩子的发展都有所提前，可以去医院儿童内分泌科室检查。


    - 5. 吃饭慢问题，饮食特别慢。


    吃饭一直很慢，这个问题很大一部分原因是小时候吃饭习惯惯没有养成，等大了后要改正真的很困难。有些孩子是因为脾胃虚弱，他就不喜欢吃，看到饭就没有胃口。可以中成药调理一下，健胃消食口服液，山白消食口服液等这些会有短期效果的。


    - 6. 感冒咳嗽后呕吐问题。


    这个是孩子咳嗽口反射比较敏感，喉咙口有点炎症，咳嗽一下，吃东西卡一下就会呕吐，这个长到6岁以后慢慢就好了。


    - 7. 鸭鸦菜一年只能吃两次，每次三天喝？吃完还是会磨牙，是什么问题呢？


    是一种驱虫药的成分，这个是因为根据药物作用机制，3天后药效足以杀死虫子了，所以建议吃3天。


    这里说到的磨牙问题：原来的观点一说磨牙就是肚子有虫了，现在医学观点已经改变了。


    ### 磨牙的原因：


    - 1. 精神过度紧张，做梦：睡觉前看惊险的打斗电视、入睡前玩耍过度，精神紧张会引起磨牙。如果因某件事情长受爸爸妈妈的责骂，引起压抑、不安和焦虑，也会引起夜间磨牙。


    - 2. 消化功能紊乱：孩子晚饭吃的太饱，入睡时肠道内积聚了不少食物，胃肠道负担过重，导致睡觉时不自主磨牙。


    - 3. 营养不均衡：挑食的孩子，特别是吃不吃蔬菜，形成营养不均衡，导致钙、磷、各种维生素和微量元素缺乏，引起颌间面部咀嚼肌的不自主收缩，牙齿便来回磨牙。


    - 4. 牙齿生长发育不良：牙齿发育不良，上下牙接触时会发生咬合面不平，也是夜间磨牙的原因。


    - 5. 肠道寄生虫病：蛔虫产生的毒素刺激神经，使神经兴奋，导致磨牙。蛔虫也会分泌毒素，并引起肠门痉挛，影响小孩睡眠并发出磨牙声音，现在这种情况已经非常少见了。


    以上就是今天的分享。非常感谢朋友的聆听。如果后面还有什么问题的话，欢迎大家在群里和我交流。非常感谢大家。


    ## 拜登当选对中美关系、中国发展的影响


    分享者：陈经，香港亚洲视宽科技研究所总监。《中国的官办经济》启蒙众多读者，“工业党”代表，出版《陈经说》，观察者网、环球时报等媒体特约作者。微博@风云学会陈经，科技与战略风云学会副会长。


    分享时间：2020 年 11 月


    大家好，我是陈经。上次在华为和何老师一起开会，认识了，学了很多自媒体相关的知识。也感谢何老师组建了星球，大家一起分享学习。今天我来讲一下拜登和特朗普大选的一些相关知识，以及拜登当选对中国将来的影响。


    这次大选还是有一些出人意料的，从赚钱盘上都可以看出来，非常有戏剧性。


    开始是拜登以绝对优势领先。大家都以为特朗普是没法当选的，但是在 11 月 4 日开票的时候，又显得好像特朗普突然蒸发了，拜登的赚钱盘的概率，都降得非常低。


    大家以为，是不是拜登又像 2016 年希拉里一样的不灵了呢？但是最后到 11 月 4 号的晚上，各种消息又传来，还是说拜登要当选了。这个过程是非常有戏剧性的，至少是在主要国家的领导人选举历史上没有发生过这样的事儿。


    这个原因是因为美国大选的制度比较特殊。它是分五十几个州，每个州是“赢家通得”。这是一个常识。


    另外今年发生了一个变化：就是发生了疫情，有很多邮寄选票。之前是邮寄选票很少，2020 年的大选邮寄选票特别的多。由于特朗普对于疫情特殊的态度，他就让他的支持者到现场去投票，而拜登是鼓吹鲜明地要求人们去用邮寄选票去投票，这样避免的就跑到街上扎堆儿得了新冠。所以这导致拜登的票数很多都是通过邮寄选票，在最后才能统计出来。

