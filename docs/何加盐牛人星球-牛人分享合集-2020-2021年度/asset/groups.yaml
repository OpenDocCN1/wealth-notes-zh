    在 55110553311 系统里边的第一个 1 涉及到今天要给大家分享的第一个教育的 Patriarch 心法。


    一个生命的成长，我们怎么来看待它，就决定我们用什么样的方法来对待它。很多家长是把孩子当成一个小皇帝，一家六口人都在围绕着这个孩子，宠他，给他最好的条件。那得到的结果竟然是孩子把家长当成太监，骑在他们的头上作威作福。等孩子进到学校的时候，他就要服从规矩。这个时候他发现，在家我可以为所欲为，为什么在学校里需要我服从这样那样的规矩？他就完全不适应。


    今天早晨，我跟一个中学的校长交流。这个中学的校长跟我讲，有个孩子上课不好好听讲，在那里摆弄东西，老师让他认真听讲，结果呢，他还打响指，老师把他的手给按了下去。这个孩子回到家跟父母讲，老师打了他五拳。最后，父母不分青红皂白就把这件事情告到了教委。后来，这个校长经过跟家长长时间的沟通。在协商的过程中，这个家长提出了众多的要求，要求老师


