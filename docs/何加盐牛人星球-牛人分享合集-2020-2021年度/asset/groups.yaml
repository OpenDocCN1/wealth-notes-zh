  - '[PAGE 208]


    知道哪个方向向好，或者喜欢哪个方向，或者哪个平台更适合我，或者哪种姿势更适合我呢？那就涉及到选择的五个层次。


    其实世界上有很多很多人，他的生命中可能都不存在选择两个词，因为他没有选择的自意识，他做什么事情都是要么就是别人让他怎么做，或者就是命运的安排。比如说我们选择什么样的专业，进什么样的大学，日后做什么样的工作，可能你自己都没有一个自主决定的意识，都是因为父母让你这样做的，或者看到别人都是这样做的，或者我也不知道，反正就是自然而然就是走上这条路了。


    这种其实是我们作为一个拥有自由意志的人，放弃了人最宝贵的自由选择权，以致让命运来决定了我们生命中的所有一切。我把这种叫做命运驱动型。


    其实很多人omb在生命中都是这样的，很多事情是不由自主的，没有自己明确的选择方向的。我觉得，只有你自己很明确地知道自己想要做什么，这个选择是根据你的自由意志而不是他人的意志、或者你懂得尊重地毫无个人选择之下就做出来的，那你才能称之为摆脱了命运驱动，是你自己在掌控命运，而不是命运在掌控你。


    所以当我们今天听到“选择”两个字的时候，我希望咱们有些星友可以重新思考一下，如果是给你自己选，你会怎么选？你当然也可以选择原来的道路，也可以选择换一条道路，但不管怎么样，这是你自己重新选择过的，你不是毫无意识地被命运推着走的。


    第二个层次的选择会比命运选择要好一点。很多人会根据“我自己所拥有什么”来选择一条最适合自己的能力或者资源的人生道路。比如说很多人会因为自己觉得自己做数学题比较厉害或者做物理题比较厉害就选择了理科啊，因为自己不喜欢数学啊，或者说做物理题不行，就选择了文科，然后因为自己大学学了什么专业啊，毕业后就从事什么样的�工作，这种都是根据自己的能力来选择。


    还有一些，是觉得自己现在特别漂亮就会去选择去做一个明星或者是网红，或者自己家里在哪方面有很好的人脉关系，就利用这些人脉关系给自己安排了一条道路。这种我们叫做资源驱动型。
    这个资源不仅仅指家里有矿啊，或者你的人脉资源，或者你长得多漂亮，还包括你拥有的能力、你擅长的东西，如果你是根据自己已经拥有什么或者最擅长做什么来选择一个东西，而不管这个东西是不是你特别喜欢的，是不是有前途的，等等，那就很典型的，你就是根据自己的能力或者资源来确定的，我们就把它叫做资源驱动型。'
  - '[PAGE 209]


    资源驱动型好不好呢？其实也取决于你的运气好不好。如果nus运气好，你这个行业刚好是很前途的，或者说刚好你选的事情是你做起来很舒服的，那么你的人生可能会幸福一点，也会成功一点，但也是有可能存在两个很很大的风险：


    第一个就是你的资源和能力不匹配时代发展的需要，例如你说你很会种田，很会爬树，在现就没有什么意义。


    第二个是你的资源和能力会随着时间的流逝而消失，例如很多网红都是吃青春饭，等容颜老去，她的事业也就失去了。或者家里有矿的，矿挖完了，事业也就没有了。


    那么第三类人呢，他其实不是看自己擅长什么，而是看看周围有没有很好的机会。如果是看到一个东西，觉得挺前TOP的，然后就冲进去干，也不管自己是不是擅长、是不是喜欢，反正就是觉得能赚钱，就去做了，这个叫做机会驱动型。


    很多做投资的其实都是这样，他们并不是说喜欢或者擅长做投资，而是觉得投资一个房子、或者比特币、或者买股票能赚钱。这个就是典型的机会驱动型。


    机会驱动型不仅仅是在投资领域，还会在很多其他的领域，比如说选择事业的时候，你可能觉得，这个工作现在挺能赚钱的，现在工资挺高的，我先干了再说，也不管这个行业是不是未来有发展前途，也不管他对我的能力是不是有提升，反正现在给钱多我就先干了，这个其实就是机会驱动。


    创业也有类似的，就是我选择一个方向，我并不认为它是未来长久的一个方向，我可能也不会一辈子都做这个，但只要它现在能让我赚很多钱啊，我就赶紧去做了，这个叫做机会驱动型。这种机会驱动型的，非常考验个人分辨机会的能力，抓住机会的能力，以及运气。


    有很多机会驱动性的人其实会败得很惨，因为他们看好的机会未必是真正好的机会，里面有好多坑的东西，他不一定能发现，很多买股票或炒房的，亏得一塌糊涂。还有一些，确实是看好了一个机会，但是他自己的能力和资源其实是不匹配的，所以机会会从他的手边溜过了，他没能抓住，最后失败了。


    机会驱动型的人，他是先看有没有机会，以及机会大不大，首先想的不是说我有没有这个资源和能力，而是会想尽办法去补充某方面的能力或者是聚集某方面的资源，所以从这一点来看呢，他会比命运驱动型和能力驱动型的人成功的几率更大一点。但是如果一旦失败呢，失败的惨状也会更惨一点，因为他不是基于自己'
  - '[PAGE 210]


    的能力出发的。机会驱动型的人，如果能够抓住一个真正的机会，加上一点运气的话，那就是可以获得挺大的成功的，但总体上而言，一个人就算是在会抓机会，如果他看的都是短期机会的话，其实他的成就就不会特别大。


    有一个很好的例子就是小罐茶的创始人叫杜国楹，其实那个人是一个营销天才，大家可能听说过他创造的很多产品，比如说背背佳，好记星、ｅ ｉｎ ｅ 本、8848手机等等，这个人的营销特别厉害，但是每次只能在一个地方赚一笔钱，过几年然后就退出了，然后又去别的地方去了。那就是因为他擅长抓住短期的小机会而不擅长抓住长期的大机会。


    那长期的大机会是什么呢？其实就是战略了。


    有一些人，他是可以不看短期收益的，而是会去研究未来这个社会需要什么，或者说未来几十几二十年、几十年之内科技的发展、经济的发展进入到一个什么阶段，哪个一个行业会兴起，他才会去投资这个东西，这种就是战略驱动型。


    其实这也是一个广义上的机会驱动，但是我为什么把战略驱动型和机会驱动型分开？就是看他在面临短期机会的时候会不会心动，会不会偏离原来的路线。


    一个战略驱动的人，他不管看到任何短期能赚钱的机会，只要跟他的既有战略不符的，他都不会去动心，他会觉得世界上可做的事情太多了，我就集中精力做好我这一件就就行了。如果他遇到了各种困难，都会咬紧牙关去坚持。


    而机会驱动型的人呢？他会看到，旁边有一个更能赚钱的机会，我就赶紧放弃了这个，先去做那个更赚钱的再说；或者说，如果我这个事情做Presenter 做好了，那我......'
  - '[PAGE 211]


    这个信念，可能是你从小就有的一个梦想，或者是你现在由于一个什么东西激发而拥有的一个对未来的使命感，也有可能是你自己为行事中，一直所秉持的一种原则或者理念。


    梦想的驱动好比说，我想解决人类的能源问题，我想攻克癌症，我想保护世界环境，我想当一个宇航员，我想当一个科学家，带领人类走向宇宙，我想当一个伟大的创业者，让中国人都变得更幸福或者更聪敏或者更快乐，我想让世界和平等等。


    而理念的驱动呢，则是我要让自己不断变得更好，我要与人为善，我要与众不同等等。这种理念的驱动是在你决定做什么选择的时候，一个重要的选择力量。例如你选择加入一个什么行业或者什么公司，或者是不是自己创业的时候，如果你的理念是让自己变得更好，那你肯定会选择一个成长性更强的公司，而不会选择一个目前工资最高公司。


    如果你是一个创业者，你的理念是与众不同，那么不管你选择了哪一个行业哪一个方向，你都能做出跟别人不一样的东西。


    如果你的理念是向世界传播爱，你有可能会选择去做慈善，或者说在日常的工作中跟你的同事、领导、下属，以及所有你能接触的人，以一种比较好的态度去跟他们打交道，有可能你会成为一个伟大的推销员或者布道师。


    不管你的理念是成为一个怎样的人，只要你每天都能够按照自己的原则和理念去生活去做选择，我相信不管你的成就是大还是小，你的每一天是幸福的。


    上面就是人生道路选择的五个层次。这五个层次我们可以用说它有一定的高下之分，当然不是那么明确，我们不能说五个层次就一定比第二个层次更高贵，或者未来的成就会更大，这个是不一定的，但是越是从高的层次出发，我们的成就感或幸福感，更大的概率会更强。


    最好的方式是什么呢？是资源、机会、战略、信念我都有。也就是说，它是一个我特别喜欢的、特别想要做到的事情，同时它又<|message|> 符合这个时代发展需要的，同时也在短期内能够带给我挺好的利润，并且是恰好我擅长的或者我拥有这些资源
    的。如果能这样，当然是最完美的。


    但是现实生活中很难找到这么完美的东西，那么我们应该怎么办呢？


    我个人的建议，如果你不知道怎么做选择，那就如用信念来驱动你做选择，'
  - '[PAGE 212]


    就是你先看看自己的梦想或者原则是什么，根据这个信念，再去聚合资源、练能力、选战略、找机会。


    那如果是『我这样选择了之后，具体找什么方向找什么平台以什么姿势呢？』


    确定好你的信念之后，第一步你需要做的，是战略的收敛。


    同样的一个梦想，同样的一个理念，可能会适用于很多的方面和不同的平台、不同的团队、组织。我们定好了信念之后，要根据这个信念，结合经济发展、科技进步、社会变化，来确定一个可选择的路径。如果这个方向和平台是自己的资源和能力范围之内的，那就算再好不过，但如果不是自己资源和能力范围之内的，也没有关系，因为资源是你可以用自己去寻找到的，能力是你可以用自己去培养的，其关键就在于你要根据自己的信念来做一个决定，并且为之付出不亚于任何人的努力。


    如果你只是把这个信念当成一种说词，当成一个空中楼阁，并为它去做任何的事情，那你并不是真正做出了选择，或者我们也可以说你做出了一个放弃梦想、放弃信念的选择，是被命运驱动着走了一个选择。


    所以当你选择了信念之后，第一步要做的是做战略收敛。这是什么意思呢？


    是你去研究这个行业、这个事业是不是人们未来若干年还需要；如果是的话，你择其其中的某一个方向。


    举一个例子，我认为“让农民变得更富裕，让农村变得更宜居，让农业变得更现代化”是我的一个梦想。但是这个梦想很大，我需要把它收敛为一个我自己现在可以做的事情，那我既可以选择去做农业机械，也可以选择做农业服务的平台，也可以选择帮助好的农产品找到买主。所有的这些方向都是可行的，关键就在于你要根据你对社会的了解，以及你现在所拥有的或者经过这些努力可能被动到的资源，以及经过自己努力能够获得的能力去选择。假设有一个事情是你无论怎么努力永远都无法实现的，那就
    se 不适合当成一个驱动你做选择的选项，否则会浪费生命。


    平台的话，你可以加入到一个现在已经在做这些事情的平台，也可以自己创造一个平台。你可能会说我也想加入某家大公司，可是人家不招呀，其实如果你信念在驱动你的话，你可以在选择这个方向之后，去拼命地学习这方面的知识、锻炼这方面的能力，然后先找一个比较小的平台，让自己能够去实践，不断让自己越来越牛，把自己锻炼成这个领域的专家，当你能够达到专家级别的时候，你再想去那个大厂，可能人家就求之不得了。或者到那时候，你可能都不需要进入某个大'
  - '[PAGE 213]


    公司，你自己都可以创立一个新平台来实现自己的梦想。


    那就说到第二点了，当我的战略已经收敛到某个方向或平台了，之后要做什么呢？那就是积累资源与能力。


    梦想是驱动或者信念驱动的东西，它往往是超脱于我们现有的资源和能力之外的，但是超脱我们现在的能力和资源，并不代表我就做不了了，因为所有的资源都是可以去寻找、聚集、攒动的，所有的能力都是可以去培养、锻炼、提高的。


    如果你仅仅因为自己现在的资源或能力不具备而放弃了某一选择，其实你还是掉回了第二层次的资源驱动了。


    那么我们需要哪些资源和能力呢？


    首先，你需要有完成这个信念的基础素养。比如说很简单的，你要有好的身体；或者在某些行业，你要有一个证书；或者说另外一些行业，你可能需要一个好的政绩或者身材；同时，在任何行业你可能都需要相应的人脉等等。这是基础的必备的素养。


    另外，在所有的行业，你都需要学习这个方向的知识以及技能，这是你必须得具备的。如果你是自己创造平台的话，你还需要组建一个很好的团队。这个团队必须得深刻地认同你的信念，同时在分工上至少需要有两个人，第一个人是在业务上帮你落地，也就是一个业务能力很强的人；第二个是在组织上帮你落地，也就是在人力资源或者组织管理等方面的能力很强的人。当然，如果你自己本身就具备这些方面能力，那也行，但更好的是有一个比较合理的团队分工。


    当你选好了战略，有了资源和能力，也组建了团队的时候，剩下的就是等待并且抓住机会了。或者你要是有能力的话，你可以自己创造机会。就像比尔·斯克，他不会等待一个电动车的时机，或者说航天时机，他是自己去创造的。如果我们真正想要做一件事情的话，即使没有机会，也可以尝试着去创造一些机会。比如我们想做农业项目，其实目前并没有说一个很好的机会在等着我们，但是我们去不断地创造机会，就会出现机会是很多的。


    当你凭着信念的指引根据战略去做出收敛，具备了相应的资源和能力，找到了好的机会，那剩下的就是坚持到底，最终改变命运了。


    所以，人生道路的选择，最关键是找到自己的信念，这个信念可以是一个梦想，也可以是一个原则。但是我也知道，很多人最头痛的地方，就在于找不到自己'
  - '[PAGE 214]


    的信念。我本来就没有


    信念、找不到信念，找不到梦想，你说这些东西不都是白说了吗？


    其实不是的，如果你现在找不到信念怎么办呢？这里我也提供几个办法。


    # 第 1 个是名人激励法。


    我们有时候不知道选择什么样的道路，其实可能是不知道每一 条路有怎样的风景，因为我们没有办法未卜先知地知道哪条路有什么花、什么草，但是我们去看足够多的名人案例的话，其实大概可以知道哪一条路的风景是怎样的。如果我们能够被那些风景所吸引的话，可能我们就会选择到一个很好的方向。


    例如我想做农业项目，其实就是因为极飞科技彭斌的激发。我并不是说要做他已经做过的事情，但是他描述这条路上的风景的时候，这些风景很打动我。我觉得这就够了。所以我特别建议大家多读名人传记，好好地把我的公众号上写的那些牛人的故事多看一看，说不定从中你就可以找到自己一直在追寻的一个梦想。


    # 第 2 个方法是自我反思法。


    有时候我们从外部找不到一个很好的激励，那可能因为你的所有的力量都来自于内心。那我们怎么从内心去发现让自己最激动的地方呢？那就自已不断地去反思自己的过去。你可以想一想过去的三个月、半年、一年、三年、五年、十年，乃至你的整个一生中，最让你激动的事情是什么？最让你开心的事情是什么？最让你恐惧最想逃避的事情是什么？


    你可以列一个表，左边一栏是最让你兴奋的事情，右边一栏是最让你恐惧的事情，你把你能回忆起来的点点滴滴，重要的事情都写在里面，然后想一想你最希望、最喜欢做的是什么？背后驱动你喜欢它的信念或者梦想到底是什么？你最恐惧的、最想逃避的事情到底是什么？如果到最后你能够从中发现你最喜欢做的事情，也许你能够找到自己一辈努力的方向；或者说即使你找不到努力的方向，你也可以找到哪些事情是你可以避免的。


    # 第 3 个方法是万全准备法。


    这个是为暂时还找不到方向或者信念的朋友准备的。就是说，如果我现在还没有发现什么东西让我兴奋，那我要不要去做准备呢？如果准备的话做什么准备呢？


    我想这个时候你可以做一些不管在任何情况下都会对你有用的东西。例如拥有一个强健的身体，锻炼演讲或者写作的能力，或者是锻炼一些能够让你自己开心幸福'
  - '[PAGE 215]


    的能力，例如弹个吉他，做个陶艺，插个花，刺个绣等等。


    这些东西是你任何时候学、任何时候准备，都不会让你虚掷光阴的，因为它就算不能为你的未来梦想服务，也可以让你的生活变得更加的幸福有趣。更何况，如果万一你未来找到一个你可以为之奋斗终身的梦想，其中的很多东西你都是可以
    relied 上的，一个好的身体，一个好的表达能力，一个好的思维的方式，一些好的思维框架，丰富的知识积累等等。


    第 4 个方法就是知足常乐法。


    我想，不可避免会很多朋友，是无论如何也找不到自己的梦想或者信念是什么的。假如你试过了上面所有的办法还是不行的话，那我觉得你生命中最大的幸福有 khả năng就存在于你现在的生活本身。


    也许你没有发现，现在的生活可能就是你最想过的，而你寻寻觅觅想找的东西可能根本就不存在，因为它已经在你的手里了。


    如果是这种情况的话，你不如多花点心思享受现在的生活，享受现在的人际关系。你好好地去爱你的家人，好好地去陪伴你的朋友，然后出去旅行、看看书、看看电影，享受生活给予你的一切，把现有手头的每一件事情都做好，也许这就是你最大的幸福。


    好了，上面就是我对于人生道路应该如何选择的一些思考，希望它能够帮助你，在你人生重要关口做出一次重要的正确 的选择。


    一位知名作家，就是《创业史》的作者柳青说过一句话，这句话也被摘录放在《人生》这部小说的扉页，可能激励了无数 的青年。这句话是这样说的：


    人生的道路虽然漫长，但要紧处常常只有几步。


    我希望咱们加盐星学会的每一位朋友，都能够走好自己人生要紧的几步，过一个自己想要的人生。


    好了，今天的分享就到这里结束了，由于是最后一期，我就再多说几句：非常感谢大家这两年时间以来对何加盐以及牛人星球的支持。现在我们第三期的牛人星球也已经开始了，从今天晚上开始，就是进入到下一个年度的会员期了。咱们都是作为老会员也都知道牛人星球是一个什么样的社群，新会员可能这段时间也已经有所了解了，如果你觉得在这里呆着挺好的话，欢迎成为新一期的会员！'
