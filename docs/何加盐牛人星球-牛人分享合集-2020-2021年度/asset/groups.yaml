  - '[PAGE 98]


    为，他对双方的竞争会找到一个框架，也就是说在金融、互联网这方面，还是要管控住。中美要对谈到底该如何竞争。撕破脸的竞争不太好，还是要有规矩。


    总体来说，拜登政府和中国关系，他不会看得那么重要。由于他们内部有一个“特朗普之乱”，拜登政府会集中精力首先把内政搞好，包括恢复盟友关系什么的，其实都是从他的内政的角度来考虑。因为特朗普和盟友，尤其是传统盟友关系搞得很差。特朗普得罪的不仅是中国，还得罪了全球好多国家的政府。拜登首先需要修复关系。


    最后再总结一下：


    拜登政府上台以后，和中国的关系肯定不会像特朗普时期那么恶劣，但是也回不到奥巴马时期那种好像若无其事的战略合作伙伴关系。


    由于美国的日益分裂，他们的红州蓝州，红州越红，蓝州越蓝，包括共和党面对的危机，红州要变成蓝州什么的，这些它导致美国内部分裂，产生了一个“特朗普之乱”四年的混乱，所以拜登面对着巨大的麻烦，他不太可能集中精力对中国发动什么突然袭击，多半是延续特朗普时期对中国恶搞的一些小手段，但不太可能有新的进攻产生。


    在意识形态斗争领域，拜登会延续希拉里颜色革命的一些进攻手段。但是这方面我们都不会觉得有什么事。我相信中美关系之后会进入相对一个平和期，双方都要集中去整治内部的一些混乱。其实中国也在开始做互联网企业反垄断调查什么的。


    中美关系自从特朗普时期冲突急剧恶化，会在拜登时期趋向和缓，这是我的最后的结论。


    我今天就说到这里，谢谢大家！'
