    劳动者剥削。虽然说由于市场竞争的关系，他们一般很难降低员工的工资，但是所有的互联网公司都会做一件事情，就是无限地延长劳动时间，无限地所谓提升人效，就是说把那些老的、或者说劳动效率已经不再高的人，不断地剔除，让年轻的人来，工资更低的人来替代他们。


    所以为什么字节跳动，最讲究的就是人效，为什么马云会说996是福报，为什么华为以奋斗者为本？为什么互联网公司过了35岁就爱淘汰？为什么美团有困在系统里的骑手？这些其实都是当资本不能再通过技术获得超额利润的时候，它就转向剥削劳动者来获得他想要的利润，这样手段会未来越来越盛行。像比如最新的一个新闻是快手将实行大小周的加班工作，也就是说大周还是5天工作制，但是小周就是6天工作制了。


    其实更多的互联网公司都是6天工作制的，你像拼多多，好象字节跳动也是，而且他们的加班，10点之前走都算是早的，所以这个资本跟劳动力之间的重新分配，也造成了很多新的问题。


    从目前来讲，我们已经处于互移动互联网这个红利的尽头，但是下一个技术革命会在什么时候发生？发生在什么领域？这个我们现在谁也说不清楚。它有可能是 一种新的能源利用方式，比如说可控核聚变；很有可能是一种新材料，比如说高温超导体；也有可能是新的
    人工智能，比如说汽车的自动驾驶、工业机器人或者家用机器人等等；也有可能是生物科技，比如说我们熟悉的这个基因编辑，3D打印的人体器官，或者甚至有可能会以后的人造子宫等等；但也有可能是5G或者6G催生的物联网、虚拟现实、增强现实等等；甚至也有可能是一个我们现在还没听说过的没看到过的东西。


    从目前来看，新技术革命发生突破的方向是有很多，但是现阶段都没有能够产生技术革命这样级别的这种进步。所以说没有每一个技术进步有足够的 影响力，改变当前这种存量续杀的局面，让大家一起做大蛋糕，目前还缺少这一
    个。所以可能未来至少5年之内，我们还会临这种剧烈的变动。


    我们刚刚讲到国际的、国内的、经济的、产业的这些变化，不可避免地对我们个人生活，还有社会的心理都会产生很大的影响。


    首先在宏观上，由于中国在国际上的相对地位和影响力提升，我们中国人对在面对西方的时候会更加的自信，那种崇洋媚外会越来越少，从容和自信'
  - '[PAGE 121]


    的程度，自尊自强的态度会越来越强。


    所以有可能 60 后、70 后、50 后这些人，他们很多人还是会从心里就觉得西方比我们先进，也许会觉得西方的制度，西方的文明比我们要好很多，但是 80、90、00
    后这样的心理就少了很多，尤其是我们出国的中国人，就会看到，其实中国在基础设施建设呀、治安水leyball、生活的便利程度啊，这很多方面是超过发达国家的，所以
    00 后的小孩到国外，他们不觉得外国比中国好在哪呢，尤其是我们看到新冠这个疫情爆发以来，中国在病毒防治上体现的优势，对比现在欧洲美国产生的混乱，进一步增强了中国人的这样的自信。


    这种心理反映在市场上或者网络上，就是崇洋媚外的言论未来会越来越没有市场。我们可以看到不管是 b 站、还是微博还是公众号，其实那些爱国的內容是越来越受市场的欢迎的。如果是做生意，尤其是做跟大众心理有关的生意的，要注意到这一点变化。那在微观上说，这个大众心理和人们行为的变化就非常复杂了。这主要是社会整体生产力的提高，带来的这个致富的效应跟技术暂时停滞带来的内卷效应挤压在一起，就形成了一种非常错综复杂的变化局面。


    所以我们一方面看到很多富起来的人，越来越多的奢侈消费，这个我们普通人也会有这个品牌升级、消费升级，我们会舍得去追星、搞体育运动，打游戏或者旅游，这种非实物性的、泛娱乐化的一些消费，是越来越多的。同时，原来只属于有钱阶级，或者说吃饱了没事干的那些人关心一些话题，就是一个没吃饱的人，他不会去关心的話題，比如说环保，然后动物保护，以及那种性少数群体的权益那些，我们看到它在网络上是占有着越来越大的这个空间的，经常会成为热搜的标题。


    这是一方面社会变得越来越富带来的影响，但是另一方面，随着技术慢慢地停滞，这个社会不可避免的就会走向内卷，表现出来的就是像美国那样两个党以及两个党派的拥护者之间，争得不可开交。其实就是社会的整体蛋糕不够大大家分了，每个人心中都有怨言，然后国家内部不同公司之间竞争会加剧，像阿里跟腾讯，包括腾讯跟这个字节跳动，美团跟阿里之间互相打来打去，因为大家对流量的争夺都是日趋白热化，所采用的竞争手段可能也越来越没有底线。'
  - '[PAGE 122]


    另外，资本阶层跟劳动力阶层之间的矛盾也是加剧的。我们会看到社会上形成一种很复杂现象。一方面大众对于财富是非常崇拜的，比如说这个马云、马化腾这些人，在人们心中看来还是这个社会的英雄、成功者，我们要向他学习。但另一方面，对资本的批判，或者我们劳动者的自嘲自怜，也是很强烈的。所以我们看到在b站上，以前马云出来的时候都是叫“马爸爸”、“爸爸”，现在你看b站上的弹幕，都是说“黑心的资本家”，“全世界打工人联合起来”等等，这个是一种非常有趣的现象。


    对于个人来讲，我们每个人现在都有非常强烈的不安全感，我们不知道现在的事业财富、社会地位能不能保得住？我们不知道未来新的对手会从哪个行业来、哪个公司来，有可能是我们这行业、我这个公司本来干得好好的，一个从来没想过的对手会进来，比如说我就卖个菜，谁知道美团、阿里、滴滴他们搞什么社区团购会把我打败呢？所以我们都很焦虑，尤其是我们不知道自己所学的东西、目前所会的技能，在明天还有没有用？在明天我还能不能维持一个体面的生活？


    所以上面这种种变化，会让我们非常非常焦虑，相近每个人都在焦虑，而我们每个人的生活的变动频率也越来越高。大家可以看一看这个周边，或者反思一下自己，是不是特别越来越多的人辞职、搬家、甚至换城市。或者你自己有没有越来越想要跳槽，或者说重新创业等等。每个人都在想要如何变化，如何应对这种时代的变化。


    那上面讲了我们这个时代的一些主要的变化，以及这个变化背后的驱动力量。下面我们讲一讲如何应对这些变化。


    第一个，呢我们首先在意识上就要明白，现在这个时代已经不同于以往了。我们人类都是很追求确定性的，尤其是咱们中国人作为一个 5000 年农耕文化的文明，就非常希望一切都是在自己的精确控制之中。古代人想要的是风调雨顺，每年按照季节，什么季节干什么事就行了，永远都不要有那些意外的事情出现，但是现在这个社会根本就没有这种很确定的事情，一切都是不确定的。


    所以我们首先要学会拥抱不确定性，学会接受风险，学会这个世界有可能是灰色的，它不是黑的也不是白的，也就是说我们从这个意识上可能你要具备，原来我们想着一辈子住一个地方，不搬家，未来这种事情可能就会变化。'
  - '[PAGE 123]


    原来我们想着我就是做这一份工作，永远不换的，未来这个也可能会变化。所以我们如果是一个只想着做一份安稳工作的，你可能未来会非常的难受，有可能你这个工作明天就没了了，也有可能是你还是在做的这一份工作，但是你看到周围的人一个个混的比你好，你会内心非常的惶恐，非常的焦虑。


    这是意识上的一个变化，那在行动上要做什么呢？其实就是当时朱元璋采取的办法高筑墙，广积粮，缓称王。所谓高筑墙是什么呢？就是说你要做好自己的防御，然后你要矮自的两把刷子，有很强的业务能力，这就是说我们要形成自己的竞争优势。你的竞争优势是什么？其实现在这个社会，竞争优势不是一门固定的绝活，而是什么呢？你的学习能力，你的应变能力，以及有一些可能在这个世界上永远不过时的那些能力，未来是这些东西的竞争。


    什么叫做永远不过时的能力呢？比如说你搞人际关系的能力，你的演讲能力、你的写作能力，你管理一个团队的能力，你去激发一个组织的能力，激励一个人的能力，这些东西是永远不过时的能力。当然它更重要的要跟你判断世界、产业走向的能力，以及你快速获取信息，辨别真伪，然后学习对你有用部分的这些能力结合起来，这才能让你形成一个等于你筑了一座很高的城墙，拥有了不败的资本，就不管世界怎么变化，你永远是具有竞争力的，这是第一个要高筑墙。


    第二个广积粮，这是什么呢？在一个不确定的环境下，我们要給自己打造一个足够宽广的安全边界。比如说如果明天你失业了，你自己有没有足够的资金？如果你明天又要重新创业，你有没有积聚足够的人脉？如果你的事业需要你长时间加班，你有没有一个健康的身体？如果你的事业需要你经常应酬，经常出差，你的后面有没有一个坚实的家庭在哪里支撑？当你出差的时候，家人不去跟你吵吗？或者说，你做的是需要一个大流量的工作的时候，你有没有从现在就开始积聚你的流量池？


    那上面说到这些资金、人脉、健康、稳定的后方、流量池，这些都是我们打造安全边界需要去做的。所以从现在开始，为了应对未来的可能出现的各种有利或者不利的变化，我们必须不断的增强刚刚所说的这些方面，这就是第二个广积粮。


    第三点呢缓称王，因为如果一个时代一个社会开始进入存量残杀的时候，'
  - '[PAGE 124]


    社会上这些出 Rui 露面的张扬的人会受到沉重的打击，会成为民众的靶子以及政府收拾的对象。啊这一点我就不再展开讲了。写老师最近的遭遇大家都看到了。


    所以说我们尽可能做到谦虚低调缓称王，闷声发大财，不要引起过多的关注，不要招来这个不知所以的无谓的仇恨。这是第三点，缓称王。


    我们上面说的其实还是防御性的，那进攻性的呢？那就是在一个不断变化的世界中，我们怎么去寻找大的机会，这个大的机会可能存在于哪呢？


    第一，它有可能存在于新的技术变化之中。我们刚刚说到，我们之所以不能再赚取指数型的利润，就是因为技术的发展停滞了。


    那换一个方向讲，如果我们能够寻找到并且进入一个技术即将发生突变的行业，会带来新的技术革命的一个行业，甚至有可能我们自己能够直接推动这个技术革命，那你就是未来世界之王。


    这就是好比 2000 年代的百度、阿里、腾讯，或者 2010 年代的滴滴、美团，字节跳动、拼多多。那下一个风口式的东西在哪呢？我们刚刚其实已经点到了一些，我这里再重复一下，我不知道具体是哪一个，但是他有可能是这中间的某一个。


    第一是新的能源利用方式，比如说可控核聚变，也有可能是太阳能或者说风能，就是这些新的更好的、更高效的、更集约的能源利用的方式；也有可能是发现新的材料，比如说高温超导体，现在这个石墨烯的研究也就很红火；也有可能是新的更能找到实现应用场景的人工智能技术，比如说汽车自动驾驶，工业自动机器人、家用机器人等等；也有可能是生物科技，生物科技包括基因编辑，这个农业领域的转基因也包含在里面，然后人体
    3D 打印机啊等等这些；也有可能使我们的 5G 或 6G 网络催生的互联网的更大规模的应用，以及虚拟现实、增强现实等找到新的应用场景。


    这里只是列举了有可能发生新的技术革命的一些方向，但是也有可能不发生，这个我是不能做保证的。因为一个技术革命的发生，刚刚我们说到，其实它有很多的是偶发的原因，它是一个非连续的、突发的一个东西，也有可能
    5 年之内会发生，也有可能 10 年之后才发生。这个我们不能把所有的东西全都压在里面，除非你已经看准了。确实是它已经带来了一个新的技术革命级的东西，那你就可以全情投入，像马云一样。'
  - '[PAGE 125]


    另外一个，如何寻找变化中的机会呢？那就是寻找不断变化之下的永恒的不变的东西。我昨天发了一篇知识星球的文章，在变化的世界中寻找永恒。我讲到诺基亚和柯达为什么会失败？表面上看是因为时代变了，他们没有变。但实际上我们再仔细地分析，他们最根本的失败不是因为没有变，而是因为没有做好不变的那一部分。哪一部分？就是他们没有把自己的主业聚焦在消费者真正关注的那个不变的需求是什么？


    比如说，诺基亚做手机，其实我们需要的不是手机，而是信息更快速的、更便捷的流通。当一个新智能手机能够用语音、用图像、用社区的方式，实现信息更快速、更便捷流通的时候，那种功能手机就不再是我们需要的了。所以表面上看是从功能手机变成智能机，实际上不变的还是人类对快速、便捷、准确的信息流通的一个需求。


    我们需要相机，要的也不是相机，而是怎么样更方便、更清晰地留下我们想要保留的那一个瞬间。所以表面看是胶卷相机啊变成数码相机又变成了，现在的可拍照的手机，实际上不变的还是那个内在的需求，拍照的需求。


    所以不管是个 人还是企业，如果我们能够找到一个产品、一个行业表面的变动之下，这种本质的、不变的永恒，那我们可能就知道未来我们哪些东西应该变，哪些东西不会变，做了哪些，我们就永远不会被时代淘汰。比如说我做一个卖货的、卖商品的东西，不管是网上的店，还是网下的超市，你永远要做到的就是多快好省，当然你有可能会不会全部做到，但是你能够把其中的一个做到极致，把其他几个做到中等水平，你也就可以在商场上立住脚。


    除了这些人们的消费需求底下隐藏的不变之外，我们还可以以更深的一层去寻找永恒的东西。比如说人性中的永恒的东西，我们每个人都会去追求真善美，所以如果你能够为这个世界创造真善美，你永远会受到尊重，永远会找到市场。当然人性中也有很多不好的，但是也是永恒的东西。比如说人都会贪婪，都会好逸恶劳，都会爱吐槽，爱骂人，都会有犯傻的时候，所以无数商业其实是针对我们这些人类永恒的弱点而设立的。像抖音就是针对我们不爱动脑子的弱点，拼多多是针对我们贪贪便宜的弱点，这些种游戏是针对我们容易上瘾的特点。所有种种永恒的不变的东西，如果你能找准、并且围绕它设计一个商业模式，我们不说它是好是坏，商业模式本身没有好坏，看你怎么去利'
  - '[PAGE 126]


    用，我只是指出来，围绕这些人性的永恒，你可以去设计你的商业模式，来应对这个时代的。


    其实我们每个人都可以想一下，你所从事的行业里，有哪些东西是在发生剧烈变动的？这个变动的背后，有没有体现的一些永恒的东西？如果你能抓住这一点本质，围绕这个去做文章的话，那有可能你对未来的规划，是会完全不一样的。比如说我是一个写文章的自媒体人，我可能会看到说，公众号会不会越来越没有人看？这是一个变化的东西。但是我会看到一个不变的东西是什么呢？人们对于高质量文章的需求是永恒不变的。任何时候人类都需要阅读高质量的文章，所以这一点是永恒不变的需求。那么我会认为，如果我能够围绕这一点来提升自己的能力，这有可能会是我未来长期立于这个世界的一个立身之道，而不是去花费很大的力气研究公众号没有了我该怎么办？我是不要转做视频？当然我也可以去转做视频，但是本质上还是要围绕着人们喜欢高质量的内容这个需求，所以我还是要找到背后的永恒的东西在哪里。


    上面我说了三点。如何应对世界的变化？第一个是从意识上要改变求稳，追求安全感的这么一种状态，要学会拥抱不确定性。第二个是要学术元壤高筑墙、广积粮、缓称王。第三个是我们如何在剧变的世界中寻找大机会，或者说寻找持续的机会，寻找大机会就需要发现一个未来有可能成为技术变革，革命性的技术变革的一个东西。然后扎进去，寻找永恒。怎么寻找变化中的永恒呢？首先我们要看到变动背后的实质不变的那个东西，其次我们要善于发现人性中永恒不变的东西，比如说对真善美的追求，人性中不磨灭的贪婪嗜欲的这些缺点等等。如果能够围绕这些来设计模式的话，我们就可以在不变的世界中获得持久的优势。


    不知不觉讲了一个小时，上面说的这些主要是从心法的层面给大家一些启发，它不是具体的招数，所以你可能不能直接套用在某一个行业或者某一个个人、某一个企业上面，但是我希望通过这个，大家能够从更底层一点的这个地方去思考，这个世界为什么会变？为什么会如此地变？未来会进一步怎样变？然后我们又要怎样去应对？如果我们能够从这个底层去思考的话，我们很多时候对于未来的规划，对世界的认识可能就都不一样了。那今天就讲到这里。


    最后我想说一下，2020 年即将过去，大家都挺过来了，今年挺不容易的。'
