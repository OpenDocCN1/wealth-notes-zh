    还有一个问题，就是对于美国的中层官员的管控，美国有个词儿叫 deep state，就是说这些实际上在执行政府事务的人，他们实际上会干很多事。比如说最有名的关于中国的两个事儿，就是一个是九十年的轰炸中国大使馆；另外一个就是
    2018 年底，孟晚舟在加拿大被美国让人加拿大把他把他抓了。


    这两件事情，其实并不是美国最高层命令。可以说相当可能就是美国的这个 deep state 里边的这些具体执行的人，他们在中间搞鬼把这些事儿做成了，然后再让当时的这个总统克林顿，这个桀骛的时候，克林顿可能还不知道，包括这次孟晚舟被抓呢，也是特朗普都是不知道的。


    对这些人，他办出一些事对中国下狠手，如果没有一个有效管控的话，这很糟糕的。


    那么像拜登，他这个团队在政府里的经验非常的丰富，几十年在都在美国政府里边混，所以可以预期他和美国的 deep state 的关系，会好于特朗普，失控的可能性会少一些。


    我们最大的预期，或者说对拜登最大的预期，就是不要搞新冷战。如果说按照特朗普的路线走下去的话，按照蓬佩奥的那个说法的话，美国和中国下去就是搞新冷战了，那就是把中国当以前的苏联一样处理的话，很糟糕，这对中国队对美国都不是好事。


    但是如果拜登能够按照他以前一贯的行事风格，那么大家还是说有竞争没关系，但是不要搞成那种双输的竞争。


    下面再聊一些具体的领域。'
  - '[PAGE 94]


    第一个领域就是在意识形态领域。


    其实特朗普对中国意识形态领域是不太看重的。比如说中国有一个名词叫公知，那就是谄媚拜美国的人怎么去赵美熙中。但是特朗普对这些人是没什么兴趣的，包括在香港闹出了2019的事件，港独事件，这个并不是特朗普闹出来的，特朗普反而对这些没什么支持的。


    为什么港独觉得特朗普这个人厉害呢？是因为特朗普对中国下手了。但是他其实是两回事儿。真正支持港独的人，在美国那边是希拉里手下的那些人，希拉里2009年开始搞颜色革命、软实力这些，直接导致了中国周边相当国家发生了颜色革命，中国也受到相当影响。


    所以说拜登政府上台以后，他相信会延续希拉里奥巴马时期的这种颜色革命的策略，跟中国的公知啊、港独啊、台独啊，交往会明显增加，所以这对中国这边会造成一些压力。


    但是这个事其实没那么可怕，中国已经证明根本就不在乎这些事儿，这个这叫受力的糨压。其实只要中央有决心，这个根本不会有什么事。


    公知的<|message|>影响在受到网络上的揭发都不太好混了。港独、台独，包括这个新疆、西藏这方面的事儿，明白人都可以看出来，没有什么大事，只要中国下定决心要平乱的诸都不是问题。包括所谓解放台湾，这都是时间表都开始了，美国在这方面想搞事儿不太容易。


    反而说是中国在这方面，是主动进攻的一个方面。我们不是防守，我们在意识形态方面不是防守的。


    我们在香港以前就是一个防守状态，撒手不管一样，一说意识形态，就是要谨守一国两制这些，怕别人批评什么的。现在通过国安法在香港的确立，目标都已经非常明确了：针锋相对，水来土掩，谁怕谁啊。


    所以这方面的意识形态的斗争，如果拜登政府发动起来的话，我们是完全不惧。甚至可以寄望，如果美国的攻击只集中在意识形态领域，对我们是个好事儿。


    我个人以为真正比较大的斗争，是在全球经济领域以及全球意识形态领域。比如说产业链转移的问题。美国说要和中国发生脱钩，让中国的一些产业转移到东南亚，转移到印度去。'
  - '[PAGE 95]


    包括中国的一带一路这个意识形态和美国的民主自由的竞争到底是个怎么回事儿，这个斗争，我认为还倒真是有相当有看点。


    随着中国的不斷崛起，包括明天就要签署的 RCEP，15 个国家自贸区，中国一带一路的进展，也还是一直持以恒的在做，进展都相当不错。在这方面，中国也是一 going
    进攻态势，美国是防守的。不是说我们在意识形态方面，要去防守美国的进攻，中国也同时在进攻美国，我个人看好中国的意识形态会胜利。


    那么，在这个意识形态斗争以及国际政治经济斗争的大背景之下，中国公司和美国的斗争，主要集中在技术脱钩方面。


    技术脱钩，对中国的公司会造成很大的影响。我和何老师上次去华为，华为就是明显地压力很大，希望媒体对华为多支持。就是因为他们面对美国这个芯片断供，各种各样的以前完全想不到的打击手法，这对中国公司，确实不管是在国际上运营，甚至在国内运营都造成很大的影响。


    那么具体在脱钩这个事情上，美国和中国这个脱钩到底是什么态度呢？我也用两句话来总结一下。


    中国方面的对于脱钩的意图是这样的：我们短期内不希望和美国技术脱钩，因为中国的高科技体系其实是跟美国的技术体系，是依赖于他的，特别是 IT 体系，以芯片为代表的技术体系完全是依赖美国的。如果发生了脱钩，这个对中国的企业打击是非常大的，所以我们短期内不希望和美国脱钩，反而是说要紧紧地和美国捆绑在一起。


    但是长期来说呢，这个路线是一定已经确定了。中国长期来说一定要技术自主，要和美国脱钩。只有你从最底层开始建立了一个坚实的科技基础，能够和美国脱钩，才能能够说是我们最终不被美国卡着脖子。那个卡脖子的事是要死要活的事，这个路线长期来说说是不会变的。所以我们中国适合长脑短脱。


    但是美国和中国的这个企业科技方面的态度呢？相反它叫做短脑长不脱。


    这短脱的意思是什么呢？是因为美国像针对前苏联以及针对日本对他的挑战一样，它需要先给个下马威，要对中国企业造成一个重大的打击，最好把中国打出来一个经济危机来。比如说中国经济危机了，很多企业倒闭啪什么的，这是美国短期的目标。'
  - '[PAGE 96]


    特朗普集团伙对中国发动贸易战，发动高科技战争，一个最大的目标就是给予中国造成短期的经济危机。


    然后，短期把中国打服了以后，就和美国签一个城下之盟。在这个基础之上，在美国划定的框架进行，还是要在美国的技术体系之内不要脱钩。


    所以对于这个脱钩的事，中美双方其实都是很清楚，最终还都是想脱钩的，但是有的时候又不想脱钩。所以搞 up 搞去，斗争很复杂。


    这个事儿在拜登政府上台以后，要观察他会怎么操作。我个人认为，拜登不会像特朗普搞得这么急，因为这个事儿对他来说过于遥远。特朗普已经证明了他跟中国打得这么狠，没有什么大的战果，什么所谓的中国经济危机根本没谱的事。


