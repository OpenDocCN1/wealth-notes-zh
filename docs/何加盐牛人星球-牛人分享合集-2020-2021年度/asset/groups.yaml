    21、因产品存在缺陷造成损害要求赔偿的诉讼时效期间为三年；


    ## 八、执行


    ### 1、什么是强制执行？


    人民法院按照法定程序，运用国家强制力量，根据发生法律效力文书明确具体的执行内容，强制民事义务人完成其所承担的义务，以保证权利人的权利得以实现。发生法律效力的文书包括但不限于以下几种：民事判决书、实现担保物权裁定、确认调解协议裁定、支付令等。我们通常所了解到如人民法院作出的民事判决书、民事调解书；仲裁委员会作出的裁决书；劳动争议仲裁委员会作出的劳动争议裁决书；公证机关作具有执行效力的公证书。在它们生效后，义务人即应自动履行。如拒不履行，权利人可申请人民法院强制执行。提出申请的权利人称申请人，被指名履行义务的人称被执行人。


    ### 2、强制执行向哪个法院申请？


    《中华人民共和国民事诉讼法》规定发生法律效力的民事判决、裁定，以及刑事判决、裁定中的财产部分，由第一审人民法院或者与第一审人民法院同级的被执行的财产所在地人民法院执行。仲裁委员会作出的裁决书，由被执行人住所地或被执行财产所在地的中级人民法院管辖。劳动仲裁委员会作出的劳动争议仲裁裁决书，由作出裁决的仲裁委员会所在地的基层人民法院执行。


    ### 3、强制执行哪些措施？


    《中华人民共和国民事诉讼法》规定的执行措施包括：


    #### 01 报告财产


    被执行人应当报告当前以及收到执行通知之日起一年的财产情况。被执行人拒绝报告或者虚假报告的，人民法院可以根据情节轻重对被执行人或者其法定代理人、有关单位的主要负责人或者直接责任人员予以罚款、拘留。


    #### 02 查询、扣押、冻结划拨、变价财产


    人民法院有权向有关单位查询被执行人的存款、债券、股票、基金份额等财产情况。人民法院有权根据不同形态扣押、冻结、划拨、变价被执行人的财产。人民法院查询、扣押、冻结、划拨、变价的财产不得超出被执行人应当履行义务的范围。人民法院有权冻结被执行人的银行存款的期限不得超过一年，查封、扣押财产的期限不得超过两年，查封不动产、冻结其他财产权的期限不得超过三年。到期后人民法院依职权办理续行查封、扣押、冻结手续。


    #### 03 加倍支付延迟履行金


    被执行人未按判决、裁定和其他法律文书指定的期间履行给付金钱义务的，应当加倍支付迟延履行期间的债务利息。被执行人未按判决、裁定和其他法律文书指定的期间履行其他义务的，应当支付迟延履行金。


    #### 04 限制出境、限制高消费、列为失信被执行人


    执行人不履行法律文书确定的义务的，人民法院可以对其采取或者通知有关单位协助采取限制出境，在征信系统记录、通过媒体公布不履行义务信息以及法律规定的其他措施。有履行能力而拒不履行生效法律文书确定义务或无正当理由拒不履行执行和解协议的，可能被列为失信被执行人，后果：1.
    禁止部分高消费行为，包括禁止乘坐飞机、列车软卧；2. 实施其他信用惩戒，包括限制在金融机构贷款或办理信用卡；3. 失信被执行人为自然人的，不得担任企业的法定代表人、董事、监事、高级管理人员等。


    ## 九、刑事（交通肇事）


    ### 1、什么是交通肇事罪？该罪名的犯罪构成包括哪些方面？


    交通肇事罪是违反交通运输管理法规，因而发生重大事故，致人重伤、死亡或者公私财产遭受重大损失的行为。


    ### 2、交通肇事罪的犯罪构成：


    主体系一般主体，即年满 16 周岁的具有刑事责任能力的自然人均可构成。因本罪的犯罪主体为一般主体，任何人员只要从事机动车驾驶的，均可成为本罪的主体。包括直接从事交通运输业和保证交通运输的人员以及非交通运输人员。


    客体系交通运输的正常秩序和安全，但不限于发生在交通运输过程中。比如非交通运输人员实施肇事行为的，既不是在交通运输过程中，也可构成本罪。


    主观方面系过失，包括疏忽大意的过失和过于自信的过失。比如酒后驾车、毒驾、超速行驶、强行超车等等主观故意的违章行为，因疏忽大意或者过于自信最终导致严重后果的发生，其本质上并不具有造成严重后果的故意，属于过失。


    客观方面系在交通运输活动中违反交通运输管理法规，因而发生重大事故，致人重伤、死亡或者使公司财产遭受重大损失的行为。


    ### 3、交通事故罪的量刑如何？怎样才能争取适用缓刑？


    交通肇事罪，最低刑是拘役，最高刑是七年以上有期徒刑，可以适用缓刑。


    交通肇事罪缓刑适用应考虑的因素应包括法定因素和酌定因素：


    #### （一）法定因素


    + 1. 看是否具备法定从轻和减轻情节。也就是是否符合《刑法》第 67 条和 68 条关于自首和立功的规定，具体到交通肇事罪，主要看肇事者在案发后是否有主动报警、自首投案、委托他人报案等自首情节，当然还包括是否构成立功等因素。

    + 2. 看是否符合缓刑的适用条件。

    首先是刑期的要求，对于被判处拘役、三年以下有期徒刑的犯罪分子，才可能被判处缓刑。对交通肇事罪而言，只有不具备加重情节的一般交通肇事，才满足缓刑适用的刑期要求。

    其次是实质要求，即根据犯罪分子的犯罪情节和悔罪表现，适用缓刑不致再危害社会。再次，必须不是累犯，累犯的人身危险性严重，再次犯罪的可能性较大，故累犯不得适用缓刑。


    #### （二）酌定因素


    + 1. 考虑被告人在交通肇事中所负的责任大小。

    从目前的法律规定看，只有负全部责任和主要责任、同等责任的才可能构成交通肇事罪，那么在具体量刑时如果危害结果相同，而被告人所负的责任不同，量刑时亦应有所区别。

    + 2. 考虑被告人犯罪后的态度、包括认罪态度、案发后能否如实供述犯罪事实。

    犯罪后的态度直接反映行为人人身危险的程度。对案发后没有逃跑且积极配合公安机关调查询案情的被告人在量刑中应该予以考虑。

    + 3. 考虑被告人是否对被害人及时抢救、治疗。

    在司法实践中常常有这样的现象，案发后肇事人在慌乱中忘记报警、投案，而是主动将被害人送至医院抢救、治疗。及时抢救、治疗被害人并非法定从轻、减轻情节，但效果却比自首更明显，其直接避免、防止了损失的扩大，因而必须对被告人的这一行为进行鼓励，即使抢救的行为并未能避免被害人的死亡，在量刑中必须予以考虑，而且笔者认为酌情考虑的幅度应比照自首进行。


    4. 考虑被告人是否对被害人进行积极主动的经济赔偿。


    被告人积极主动对被害人及其家属进行经济赔偿，对被害人的健康或生命是一种补偿，对被害人的精神也是一种抚慰，一定程度上修复了被交通肇事破坏的社会秩序。同时，被告人积极主动赔偿的行为也是体现了对其自身过错行为的正确认识，反映了被告人的悔罪心理。


    5. 考虑当时的犯罪时空和周围环境，如天气状况、地面路况等。


    很显然，在冰天雪地和大雾天气，造成交通事故的可能性加大。分析肇事时客观因素和主观因素的对比程度，对于准确认断肇事人的过失大小，进而准确地定罪量刑都大有裨益。


    综上所述，发生交通事故之后，肇事司机一定要积极救护受伤人员，主动投案自首，积极给予受害者家属经济赔偿，取得被害人家属谅解，这样才能努力去争取获得缓刑处理。


    ## 如何看透世界万物的本质


    讲师： 卢克文。


    时间： 2021 年 4 月


    大家好，我是卢彦祖。因为人长得比较帅嘛，所以大家都叫我彦祖。


    我是专门写国际政治的，2019 年才开始写，到现在在两年多一点点的时间，在各个平台现在已经有了 1000 多万粉了，预计今年应该能到 2000 多万、3000
    万粉左右。暂时是做国际政治领域还算是可以的那种。


    我跟加盐认识是在 2019 年初，是在我刚写公众号时认识的。他教了我一些排版的技巧，我觉得这个特别实用。加盐的内心比较开放，做公众号加盐在我前面，就是你问他什么，他都是在细心教我，我觉得挺受益的，我和加盐就一直做了好朋友，一直到现在。


    加盐为人心态比较开放，大家平时在一起能学到很多东西。而且，他经历的事情比较多，能够互相交流。尤其是他的心态特别好，我觉得这个是最重要的。所以，能够希望大家也在群里面互相学习，我也是在努力的学习。


    好，下面我开始进入正题。


    这篇分享的主题就叫做《如何看透万物的本质》。虽然我写了这篇文章，但文章的有些话太刺激了，也不太方便在公众场合说。所以在私底下说还是蛮好的。


    怎么去看透万物的本质？只要有了这个逻辑，有了这项哲学，就是我自己经过生活 mac 的磨练，带给我的这项哲学系统，已经深深的印入到我的骨髓里面了。这个哲学系统将对我的人生有很大的帮助。


    在以前我还没有开窍的时候，我跟所有普通人一样。我们活在了世上，很多事情想不通，不理解，不知道怎么去分析它们，也不知道怎么去认识它们。


    后来，我自己辞职创业以后，不断地去做生意，不断地去磨练自己。


    有一天，我看了几本经济学的书，整个 Reflect 突然就开窍了，好像眼打通了任督二脉一样，看任何事情也都就完全懂了。从那一刻开始，我就很少很少犯什么错误了。而且，我不管是在哪方面，经营公司，在做生意这块就变得一帆风顺顺，整个人生就开始变得比较顺利。


    所以，我觉得这套哲学系统是非常重要的。对我自己来说，其实是对我灵魂上的一个改变。我相信一件事情，就是，就算今天我没有去做现在这份工作了，没有选择自媒体了，把我扔到别的行业里面去，我去做任何事情，都会比别人做的好一些。因为我有一套自己的哲学系统，让我能够够迅速地融入一件事情，去解决一件事情，并且能够解决一些问题。


    我觉得自己已经有这种能力，这种能力让我和普通人有了一定的差距，这对我的帮助特别大。下面我就开始详细讲，我是怎么去运用这套价值链体系，这套哲学系统，怎么样去帮助我的人生，以及怎么去解决我写文章的问题。


    我看任何事情的时候，或者说看国际政治上的新闻，我去理解它们的时候，都不会用道德的眼光去看待这件事情，也不会用意识形态的眼光去看待这件事情。


    但是普通人呢，经常会被道德所左右，经常会被好人、坏人、好事、坏事，这种简单的哲学逻辑所左右，或者某些事情一定要加强道德主义色彩，或者是强加一种叫做情感的色彩在里面，导致很多人看事情是无法解释的通明白的。特别是在国际上，就更容易加入各种意识形态。


    在分析事物的时候，很多人要么就左，要么就右，要么就站在西方的角度看问题，要么就站在我们中国的角度看问题，导致他们看问题是不够清晰透彻的。


    所以，一定不要用这种思维方式去看问题，否则会越看越糊涂，越看越糟逼，搞不清问题的本质是什么。


    我现在只说国际政治，等下讲生活中怎么去判断。


    其实，只有一个方法能够看清问题的本质，就是你要去看这件事情的利益链。


    我说一个大家在国际政治里面常听到的一些东西，你们看了以后百思不得其解的背后都是有利 益链的。你只要深挖一下，就能很容易挖出他的利益链条来。


    比如说，我们经常听说的西方在搞 LGBT 这种东西，搞同性恋、搞身体政治、还有黑命贵。LGBT 和黑命贵这种东西全部属于叫身份政治。身份政治让普通人去看，完全看不懂它在说什么，或者它为什么搞这些东西。其实是有原因的，身份政治的背后是为了冲淡阶级矛盾。


    身份政治大概是 21 世纪才兴起的，在这之前是没有身份政治的。在这之前呢，整个西方国家也没有那么严重的叫“政治正确”的东西。不准说这个人是黑人，不准说这个人是犹太人，不准说这个人是穆斯林，只能说他是郊区青年。


    这一切的背后原因，都是因为在这之前，西方处在一个经济非常发达的一个时期，它没有什么社会矛盾，人民都比较富有，不需要去调节矛盾。


    但到了 21 世纪，特别是他们把苏联的红利吃完之后，整个西方出现了严重的阶级对立，就从原来的，大家都看到了大量的中产阶级，到现在 2021 年出现了明显的贫富差距。穷的人越来越穷，富的人越来越富，然后慢慢地出现了阶级对立。


    在这个阶级对立的过程中呢，因为西方的大政治学家都是经历过冷战的，而且他们都经历过当时跟苏联对抗的很多事情。基辛格现在还活着，除了基辛格以外，其他的以前大政治家像维热斯基，还有其他的大政治学家，他们对整个东西方的冲突，或者对整个阶级冲突是非常了解的。所以，他们吸收了以前在对抗苏联的那些教训，为了避免经济矛盾加深，就开始增加了身份政治这个东西。


    身份政治就是一种通过瓦解内部人群细分，让群众斗群众的一种宏观策略。就是把人，人为地分为“黑命贵”“LGBT”“亚裔”等等。人为去区分这些东西，让群众去斗群众，而不要让穷人去斗富人。


    这样的话，就可以通过身份政治去冲淡阶级矛盾，而不像以前那样，大家一穷就开始去找富人的麻烦。它就把阶级矛盾给冲散了。


    所以你看，美国不管发生多大的冲突，多大的问题，很少把这些问题极端化。这个事情在还没有爆炸之前就被压缩在一个空间里面了，接着，这个空间就把它稀释掉了，所以它是一种稀释社会矛盾的方法。


    如果你不用利益链去看这些问题，你就算想破头，都永远不会想通为什么会搞这些东西，它的背后其实是有自己的一套哲学在的，它背后有一整个自己的政治思想在。所以普通人是很难想通，想清楚这些问题的，那很容易被人牵着鼻子走，这是一个身份政治的问题。


    除了这个以外呢，我们还经常听说环保少女，我不知道大家有没有印象，就是瑞典的环保少女。


    这个环保少女呢，普通人根本就看不懂她在干嘛。实际上，你一定要通过很深的利益链去分析这个事情，你才能找到为什么会出现环保少女这个人物。


    像环保少女，她这么小的年纪，对世界其实是在一种一无所知的状态。她对世界根本就不了解，她的世界观还没有完全形成。普通人是在 30 岁到 35 岁左右，才会慢慢形成自己的世界观。一个十几岁的少女，她懂什么是世界观吗？懂什么是真的要环保吗？懂环保的真正意义吗？那她这个人为为什么会被推出?


    其实，背后有着一股极大的政治势力，有极大的经济利益链条。


    现在整个世界上，主要的话语权是掌握在美国民主党手里的。美国民主党的整个话语权的架构，又是由犹太人控制的。美国几乎所有的大的电影公司，所有的报纸，所有的电视台，所有的网络全部是犹太人控制的。所以，这一块应该就是民主党里面的犹太人在塑造一个精神偶像，当他们想造一个精神偶像的时候是非常容易的。


    那他们为什么要塑造一个这样的精神偶像呢？为什么要塑造环保少女呢？


    因为环保少女本身是跟民主党的利益有关系的。民主党的主要利益是在金融产业以及高科技产业，民主党的所有的金来于美国东西海岸的两边。所以，美国的整个架构不同。两个党的架构不同，民主党主要是环保。他只要宣传环保，就要对石化行业进行打击，进行打压。


    而美国共和党的主要经济来源，主要的金来于一些传统的石油、传统的矿业，或者传统的其它产业。这些行业相对来说是有一定污染性的，在民主党看来是有一定的污染性的，不是环保的。如果要能进行打压的话，比如说，如果能够用电力取代一些石油产业的话，那么民主党能够在
    10 年之内将共和党的总体经济利益打压将近 28 万亿美元。


    所以，如果推行和推广环保主义的话，就是在鼓取取消以前的石化能源，而石化能源又是共和党的主要经济来源。所以，推行环保主义，最重要的并不是真的要环保，而是要打压整个共和党的经济来源，切断共和党的经济来源，这样才能使民主党开始逐渐变强大。


    像我前面说的身份政治、人群细分、比如说，像对墨西哥裔的保护、对墨西哥裔的爱戴，这些东西都是民主党开始自己带起来的。


    这个之前，民主党跟共和党一直是不分上下的。一直到了肯尼迪总统竞选的时候，肯尼迪竞选总统，有两件大事让他成为了总统。


    一个是他跟当时芝加哥的黑社会头子做了买卖，芝加哥头子买通了一些工会的人，那些工会的人帮他投票。


    另外一个就是，他尝试去给黑人发一些宣传册，替黑人说话。所以当时黑人出了力量，保证了肯尼迪上台。民主党上台之后受到了一个很重要的启发，从此，他就开始觉得要对人群进行细分。


    这样的话，我可以用政治身份去推动我的人群细分，推动我的政治政权。所以，民主党在后期，从肯尼迪以后，慢慢地吃到了甜头，慢慢地就开始去搞这些人群细分、身份政治、环保主义。有的是给自己加分的，有的是给共和党减分的。


    民主党上台的时候会签订《京都议定书》《巴黎协定》签订这些贯环保有关的东西，但是共和党一上台，所有的总统就会马上废除这些东西。因为共和党所有的利益是跟化石能源相关联的，这个在他们看来是被动挨打的。


    民主党非常善于制作一些高大上的东西。所以，他们在控制舆论这一块，有非常高深的战略手段，有一套非常厚重的属于自己的系统。这个很少有人能够仿抗他们，实际上几乎没有哪个人能够反抗。他们在这方面的经验是非常优秀，是我们需要学习的。


    正是因为搞环保主义有利于民主党，所以，我们看到那个瑞典少女在联合国开会的时候，她看着特朗普的表情就是愤恨的表情，这是一种无形中渗透的。


    这个女孩肯定不知道自己是站在民主党的利益这一边的。但她已经被洗过脑了，或者被人灌输这种意识形态到她的脑海里面去，看到共和党的支持的人，她就会条件反射地对特朗普流露出那种愤恨的眼神，愤恨的表情，这其实就是背后隐藏的利益链条。


    你要想看懂这个利益链条，一定要用非常深度的眼光去追查，知道每件事情的背后大概是谁在控制，你就能找到事情发生的原因。


    所以，我去解读国际政治的时候，我的方法跟别人是完全不一样的，我有自己的方法论。我不会去说这个事情怎么样，我不会用道德去解释它，我也不会用意识形态去解释它，我一定是用利益链去解释万物的。


    我在刚刚写完的美国国运史里面解释美国的成长、解释美国的崛起时，我用的是就是分析利益链的方法。然后，用利益链方法一串联，你会发现整个美国的国运其实跟英国和法国是紧密的勾连在在一起的。美国能够崛起跟英国和法国有着莫大的关系，并不是说美国自己通过简单的奋斗就能起来的，其实真的是跟英美之间的利益有非常深的联系。


    这个是很普通的利益链分析法，但是我们刚刚说了，看透万物的本质是看透万物的利益链。


    利益链这个词汇，我一定要跟大家说清楚这个问题。利益它是一个中性词，它绝对不是一个贬义词。如果谁把利益解读成贬义，那这个人就是一个 Infos 庸腐的人，就是一个非常非常
    Infos 庸腐的人。


    如果觉得利益是贬义词，那你平时赚钱养家不也是利益吗？你要给自己小孩读书交学费不也是利益吗？这是需要你去赚钱的。所以说，利益它不脏贱，它也不高贵，它就像空气和水一样，是我们生活中经常出现的一种中性的事物，我们每个人都必须围绕它去转，围绕它去生活。作为一个聪明的人，就不能够把利益这两个字进行污名化，而是要把它中性化。


    人要大大方方的去追求利益，用合理合法的方式追求利益，这就是对的。只要你不犯法，随便你怎么追求利益都是对的。所以，面对利益不要扣扣捏捏的，不要一面对利益就放不开自己的手脚。


    如果你不能战胜这一分，你就不可能实现财富上的增长，你把自己锁在一个道德束缚的一个阶段。你不仅不会变得很高，你还会变得 Infos 庸腐。你一定要把事情看成是中性的，你才能去认知它、理解它、探索它，并且深入了解它。


    我刚刚说了国际政治，但是在日常生活中，利益链条跟我们是完全紧密相关的。


    人是什么呢？人是经济动物。人只要是经济动物，就必须活在利益链条的活动范围之内。几乎我们在生活中做的每一件事情都是跟经济利益相关联的。


    每个国家奋斗到最后，竞争到最后，说白了就是为了让国民过得更好一

