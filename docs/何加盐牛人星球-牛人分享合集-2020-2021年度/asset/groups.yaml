    60%。比如 说我卖 100 万的产品，我产生了保修费可能在 20 万，那我这个 20 万产生的 可能性，根据我过去的经验可能大于 60%以上，只要是 95%以内的都放在预计
    负债，你这个是要预计的。我们财务有一个原则，永远不要高估资产，但是永 远不能低估负债。这个是预计负债核算的一部分内容，还有一种，比如说我现 在正在进行诉讼，正在进行仲裁，但是我败诉的可能性很大，我一败诉，我有
    可能要赔人家钱，诉讼费我要承担，这个时候要放在预计负债里。如果是已经 判决下来，判决书藏了，马马上强制执行了，这个时候你肯定是直接放在负债 里面，就不能再放在预计负债里了。


    左下角的商誉、无形资产、开发支出是什么意思呢？无形资产一般指的是 没有形状和载体的资产，但它有价值，比如说专利权、专有技术等等。我 开发了一些软件，这些一定是有价值的，它们有市场价值，可变现的。开发支
    出指的是在开发的初始阶段，我还不知道这个开发有没有成果形成，还能不能 投入到市场，有可能成功，有可能失败，所以前期我这些研发支出只能放在开 发支出里面。


