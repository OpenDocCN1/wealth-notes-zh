    17 条规定了第三人提供的担保合同无效的赔偿责任划分问题。针对担保人有过错而债务人无过错情形，《民法典担保制度解释》将原《担保法解释》第 7 条进行了实质性修改，将担保人承担的赔偿责任由“连带赔偿责任”修改为“对债务人不能清偿的部分承担赔偿责任”。


    相较于原《担保法》，《民法典》的立法价值取向发生了变化，从保护债权人变成了平衡债权人和担保人的利益。如此调整后，担保合同无效的赔偿责任划分问题，与《民法典》的立法价值取向保持着系统性和一体化。


    六、公共场所侵权责任纠纷的规定


    1、学校等公共场所侵权责任纠纷的规定


    实践中，在校园、公共场所或群体性活动中，因第三人的行为造成损害的事件时有发生。在第三人侵权的情況下，由第三人承担侵权责任毋庸置疑。不过，第三人可能无法确定，可能下落不明，也可能缺乏赔偿能力等因素影响被侵权人的权利得以实现。这时公共场所的管理人或者群体性活动的组织者往往就是被侵权人主张权利的对象。当然，这种补充责任有别于侵权责任，并且依据最新颁布的民法典的规定，经营者在承担了这种补充责任后是可以向第三人进行追偿的，'
  - '[PAGE 185]


    我们一起来看一下。


    虽然《民法典》第 1199-1201 条的内容改动并不大，但该等条文却是《民法典》侵权编中与学校最密切相关的条文，基本确定了无民事行为能力人、限制民事行为能力人和第三人侵权的校园
    Coy 伤害事故责任承担的原则。需要注意的是，学校在这种三种类型的校园伤害事故中所承担的责任和举证义务是不同的。


    对于无民事行为能力人的校园伤害事故，学校适用的是过错推定原则，在学校能够证明已尽到教育、管理职责的情况下，才能免除侵权责任，即举证责任在学校一方。


    对于限制民事行为能力人的校园伤害事故，学校适用的是过错责任原则，在学校未尽到教育、管理职责的，才应当承担侵权责任，即举证责任在受害人一方。


    当无民事行为能力人或者限制民事行为能力人在校园内受到第三人侵害的，由第三人承担侵权责任，学校未尽管理职责的需承担补充责任，此时举证责任在受害人或第三人。


    从以上条文可以看出，在校园伤害事故中，学校是否需要承担侵权责任与其是否尽到教育、管理职责息息相关，学校一定要做好学生的安全防护和教育工作。


    而公共场所和群体性活动如何认定侵权行为与损害事实之间的因果关系？依据《民法典》一千一百九十八条的规定：


    宾馆、商场、银行、车站、机场、体育场馆、娱乐场所等经营场所、公共场所的经营者、管理人员或者群体性活动的组织者，未尽到安全保障义务，造成他人损害的，应当承担侵权责任。


    因第三人的行为造成他人损害的，由第三人承担侵权责任；经营者、管理人员或者组织者未尽到安全保障义务的，承担相应的补充责任。经营者、管理人员或者组织者承担补充责任后，可以向第三人追偿。


    因此受害人无须直接证明安全保障义务人消极不作为与损害发生之间存在因果关系，只需要证明安全保障义务人负有特定的作为义务，不履行该义务与损害的发生之间存在高度的盖然性，如果安全保障义务人履行了自己的作为义务，则损害极有可能被避免。


    经营者的安全保障义务的法理基础来源于德国法院从判例发展出来的“交往安全义务理论”。经营者的安全保障义务作为一种积极的作为义务，要求经营'
  - '[PAGE 186]


    者应当在合理限度范围内以积极作为的方式防止或制止损害的发生，在发生第三人侵权的情况下，经营者在合理限度范围内可以防止或制止损害的发生，却未能防止或制止时，经营者即存在过错，应当承担不作为的侵权责任。


    但是在公共场所发生的意外伤害案件中，很多是由于顾客未注意保护自身安全引起的。如一些患有相关疾病的患者出入娱乐场所却忽视“高血压、心脏病患者禁止入内”的警示标志；未成年人rate
    在缺乏家长监管的情况下，在公园等公共场所作出危险举动，如嬉戏奔跑、爬高、嬉闹等，都埋下了安全隐患，一旦受到损伤，都需为自己的过错承担责任，所以无论如何，大家在公共场所时一定要注意安全，避免受到人身财产的损害。


    # 2、交通险的最高限额的变动


    2020年9月9日，中国银保监会发布《关于调整交强险责任限额和费率浮动系数的公告》，新交强险责任限额方案为：


    在中华人民共和国境内（不含港、澳、台地区），被保人人在使用被保险机动车过程中发生交通事故，致使受害人遭受人身伤亡或者财产损失，依法应当由被保险人承担的赔偿责任，每次事故责任限额为：死亡伤残赔偿限额18万元，医疗费用赔偿限额1.8万元，财产损失赔偿限额0.2万元。被保险人无责任时，死亡伤残赔偿限额1.8万元，医疗费用赔偿限额1800元，财产损失赔偿限额100元。上述责任限额从2020年9月19日零时起实行。截至2020年9月19日零时保险期间尚未结束的交强险保单项下的机动车在2020年9月19日零时后发生道路交通事故的，按照新的责任限额执行；在2020年9月19日零时前发生道路交通事故的，仍按原责任限额执行。


