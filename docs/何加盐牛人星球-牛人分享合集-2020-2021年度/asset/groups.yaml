    呢？它又不能放在费用，为什么呢，因为它是需要资本化的，不能费用化。因为国家有要求的，你什么东西都记到当期的费用，你就会影响当期的利润。这个东西大家自己去衡量，到底是放在利润表还是放在资产负债表。是在会计准则的要求下，要考虑税收筹划，我为什么这么说呢？企业所得税上有一个五年亏损的弥补期限，指的是什么意思呢？比如说一家企业第六年产生了利润，你可以用第六年的利润弥补前五年的亏损。那这家企业的所得税也少交了，第六年虽然有利润，但是由于之前年度有亏损，你想把它给弥补了才交所得税。


    有这样的一个情况，假如说你现在有很大金额的研发支出，你一下子当年就给它计入费用了，你当年亏损的很厉害，但是你明年可能还亏损，后年还亏损，你可能亏损到第七年才有利润，那这个
    Review 五年的亏损弥补期就过去了。那你第一年进行了大幅的费用，导致的大额亏损已经不能放在第七八年去弥补了，其实你企业还是吃亏了。如果你放在费用里边，比如说放在资产负债表的开发支出里边，你以后形成了无形资产也好，或者这个项目失败了，你再计费用也不迟。


    你甚至可以分摊，你给它按几年摊都没有问题，这个看自己的利润情况去调节。然后资产负债表的右边，我还想说一个科目叫预收账款，预收账款的会计科目在应付账款下边。记得我刚毕业的时候，甚至在我刚毕业前十年，比如说在2009年的时候，我同行内都会有一种说法，就是说财务最复杂的是制造业，做制造业的成本核算复杂。其实这种说法是错误的，当时之所以感觉制造业的成本核算复杂，是我们的核算工具和核算能力太差了，其实真正复杂的是房地产。


    我从2002年到现在，一直没有离开地产这个圈子，其实我觉得地产的报表才是最有看头的。那我这里为什么会在这个时候提到房地产的报表才是最有看头呢，就是因为我们才说预收账款这个会计科目，这个预收账款它是一个负债类科目，但实际上上它是一项收入来看。对于房地产来说它是一项收入，所以你要要是看房地产的报表，你都不敢看资产负债率，每一个房地产的资产负债率都高得要死。


    实际上就现在这种状况，房地产的资产负债率却是最低的。为什么它只能做开发贷，现在国家打压的太严了，基本没有别的融资渠道，你想搞一些拿地'
