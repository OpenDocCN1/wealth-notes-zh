    如果你不用利益链去看这些问题，你就算想破头，都永远不会想通为什么会搞这些东西，它的背后其实是有自己的一套哲学在的，它背后有一整个自己的政治思想在。所以普通人是很难想通，想清楚这些问题的，那很容易被别人'
