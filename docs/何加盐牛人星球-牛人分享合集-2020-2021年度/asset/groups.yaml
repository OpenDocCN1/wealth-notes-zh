    点，为了让自己的老百姓生活得更好一点，而不是说我一定要称王称霸什么的。有些人是为了个人的利益，有些人是为了大众的利益。


    人的第一层是看懂利益，第二层是利用这种利益链条为自己服务，第三层是用这种利益链条为大众服务，为国民服务，这个时候就达到一个比较高的阶段。


    我举一个非常简单的例子。如果我现在去做什么行业，比如说我去做餐饮，我从没做过餐饮，但我是 有这个方法论的。


    我分析事物就很清晰，我只要随便到一个餐饮店坐下来，坐一二十分钟，我大概就能算出来这个店，它每天的流水大概是多少？它的销售额大概是多少？它的租金会大概会是多少？有个大概的数据，而不是很准确。这个店它的成本是多少？它每天能挣多少钱？


    这样我就能够透视利益链条了。我还能看透大多数店铺，他是不是使用的是那种统一配送的速成食物，还是说自己在后面直接炒的食物，我大概看一眼就能看出来。我还能够知道这个店铺它到底挣不挣钱，它如果不挣钱，那么它的问题出在哪里？这个店铺如果想挣钱，怎么去改？怎么去做？


    如果我开这家店，我会怎么去做这个事情，这种方法论对我人生的帮助太大了。基本上，我创业以后碰到很多很多的困难，我都通过利益链分析法轻易的破解难题。到现在为止，都能够轻易的破解难题。


    而且，我不会觉得卑躬屈膝是一件很丢脸的事情，我向别人低头是件很丢脸的事情。因为我知道，一件事情获得的最大利益，是让身我身边的人过得好，让我的同事们过得好，能惠及到更多人，其它的就没有什么太大的意义，因为最大的意义就是通过利益链条放大大家的权利，让大家过得更好。


    这个方法论不仅用于在餐饮上，用在很多行业都是可行的。我其实给自己估算过，就是说，哪怕我换一个行业，马上换一个赛道，我也可以活得不错，我觉得我能够每年挣个小几百万是肯定没问题的，随便干什么肯定没问题的，因为这种哲学已经深深到我的骨髓了。


    我看其他的某些行业，比如说我随便翻一下抖音，我去看别人干什么。我看到有的人在介绍各种豪车、有的人介绍各种豪宅、有的人介绍各种历史。我只要看一下，我就能看到每一个人的利益链，他后面怎么样去变现？怎么样去做这个IP？怎么去维持？怎么去挣钱？我看五分钟大概就能算出它前面的系统和后面的系统。


    我说一个例子。有很多人是专门卖豪宅的，各种豪宅之间跑来跑去。这个东西你要看就看他的利益链，在什么地方卖豪宅这个事情肯定是最重要的。


    他可以把房子卖给指定的高端用户人群，可以通过抖音留下自己的联系方式加取这些人，这是第一种。他可以去做高端房地产的广告，这是第二种。只要他加取了这些高端人群的联系方式，那简直就是打开了一个无尽的宝藏啊，这是第三种。


    只要他的人数达到一定的规模，他每年就可以直接谈到好几百万的生意。就像说，他可以直接建立最顶级的高端人群俱乐部，这个俱乐部的在在一起沟通的过程中当中也会产生极大的利益关联。


    除此之外，他可以做一个旱涝保收的工作。只要把他们集中在一起，他后面还可以卖名贵的珠宝，可以卖高尔夫俱乐部的会员资格，还可以去卖一些名贵的车。


    他只要把这个高端卖豪宅的抖音IP做好，慢慢地引流进来，可以再引流进入自己的池子，私域流量，或进入其它的区域，他都可以变现，而且是很容易变现的，这属于一种精准分析法。


    看到抖音上有卖豪宅的那些人，我就很喜欢加他们，我会加他们的联系方式，我能看到他们下一步会干什么，我甚至能知道他们的话术该怎么说，如何跟有钱人说话，跟那些有一定社会地位的人怎么聊天，怎么能让他们想信或者获取他们的信任，怎么去转化他们。


    怎么样让这些优质人群围绕在自己的身边去组成一个系统？这些东西基本上我现在看一眼就能看明白了。


    比如说，抖音上也有很多卖豪车的，有些人就专门卖这个豪车。然后告诉别人怎么去加自己，这个也是一种加联系方式，因为到最后的目的不一定就是卖豪车，它会形成一种固定的产业链思维。他可能会卖一些名贵的酒，或者名贵的表，或者海外的一些奢侈品给这些有钱人，这就形成一种闭环。


    经过生活中大量的训练，大量的思考，我看大多数事物都能够轻而易举地看到它的前端和后端。


    这是属于商业系统。如果你说科学系统，我肯定是不行的。比如说，你要解薄熙来、粒字这些东西我肯定不行，但是大多数人的生活、人的行为、习惯的所有东西都是可以轻而易举的看到它的前端和它的后端。因为人是经济动物，所有人思考问题的思维方式其实都是受经济环境影响的。


    看不同的人，去跟不同的人打交道，你只要看他的经济环境是 什么样的，你就知道用什么方式跟他打交道，你用什么方式去跟他亲近而不引起矛盾和冲突，你只要看懂这些问题，就很容易在某些领域取得比较高的成就。


    我告诉大家这些东西，并不是说大家拿着认识到的这套哲学系统去挣钱。而是说，你慢慢的看懂利益链之后，你就懂得尊重万物了。你深入了解它之后，你就会开始觉得尊重万物很重要。你会明白为什么有些人那么穷，他穷的原因是什么？


    我看过很多很多发展中国家的人，他们过得非常非常差，像菲律宾贫民窟的人，他们就是在去垃圾堆里面把别人扔掉的肉捡来吃。然后，你就会忍不住分析，为什么菲律宾有这么穷的人？为什么菲律宾有些人穷到这种地步也没有人管他们？菲律宾曾经有过一段黄金时刻，他们把这个国家给搞成这个鬼样子的背后发生了什么？


    然后，你就慢慢的去想这些问题，你就能找到背后的利益链条，你就会慢慢知道贫民窟的人是什么原因变穷的，是谁在剥削他们，你会发现菲律宾的每个地方都会有一个地方势力，这个地方势力占有大量的土地，占领土地之后，又会对平民进行剥削。你就会慢慢懂得平民是怎么失去土地的，失去土地之后他们是怎么沦为平民的。住在贫民窟之后他赚不到钱，是因为国家没有工作机会给他，所以他变得很穷很苦，所以他才会过那样的生活。然后，他下面的地方势力在国际上又是被谁欺负，被谁剥削的。


    你就慢慢能看到很多很多事物的本质，你就能理解为什么有些人穷，有些人富。有些人穷，不一定是因为他真的很穷，真的很笨，而是他处于剥削的最底端。你就会慢慢理解这些事物了。


    所以，你懂经济链不一定是为了自己挣钱，而是，从这个链条看到万物的本质，你会产生真正的悲天悯人。我说的是真正的悲天悯人，而不是那种带有泛滥的情绪性的东西。就比如


    说，一些文艺青年到了西藏，看见一些喇嘛的念经，他都会突然很感动。这种感动是非常非常无知的、幼稚的。


    因为你只要稍微理解一下，整个西藏地区的穷人他们是怎么过的？为什么有些人死了之后要把所有的财产捐给喇嘛庙？为什么去拜山的那些人永远都是穷人？跪在地上三步一叩都是穷人，为什么富人不会干这些事情？


    你会明白，有人通过精神控制普通民众，就是在西藏地区有人通过精神控制普通民众有喇嘛，有贵族阶层，通过这种方式去麻痹普通民众，让普通民众失去自我思考能力，让他们把财富交给更高阶层，你就会懂普通民众的痛苦在哪里。


    如果你懂得普通民众的痛苦在哪里，你才能知道怎么去解决痛苦，怎么去对抗那些万恶的剥削阶级。你才知道要给他们修路，要给他们念好的学校。要让西藏人民过上好生活，就是让他们更信科学，不要去迷信这些东西，让他们读更多的书，让他们有更好的工作，所以惋惜你就能理解这些事物了。


    而且，我觉得很多人那种轻易的感动是属于傻白甜式的感动。其实傻白甜也分两种，一种是普通的傻白甜。我们在日常生活中一眼睛就能看透的傻白甜。


    另外一种傻白甜以为自己念了点书，以为自己懂些东西，但是不去看整个事务的本质，他就会很容易沉醉自己，感动自己。


    这种傻白甜就是整个民主党体系培养出来的很大很大一部分这种人，中国也有很大一部分这种无知的、自我感动的文艺青年是属于深度的傻白甜。


    很多人写，在说思想总结的时候，很容易写出一些比较复杂的整体架构出来。但是，我还是比较尊重普通人的思维方式的，我觉得任何事物都要通俗的解释出来。


    我个人特别看重白居易说的那句话，就是你写完诗以后，你要念给老太太听，如果老太太都能听得懂，那就是好诗。如果老太太完全听不懂，就不一定是好诗。


    我们现在去传播精神和哲学，告诉别人万物本质的时候，就不能再像以前那样说，道可道，非常道。天之道，损有余而补不足，不能再说这样的话了。因为普通人听不懂的，这个世界已经改变了，就不能再用以前那种方式，那是精英传递信息的方式。


    精英有精英传递信息的方式，民众有民众传递信息的方式。所以，我们在向民众传递信息的时候，一定要注意通俗化，注重口语化，注重大白话。不要把一件非常简单的事搞得特别复杂。这是我们特别反对的。


    不能把所有简单的事物复杂化，而是要把复杂的事物简化。所以，我们写东西的时候逻辑一定都是非常清晰明了的，而且，是非常生动的去告诉别人这个事情怎么样。


    因为我们是写国际政治，有时候写一些外国的事情，比如，英国的事情、美国的事情。中国人听不懂，那解释一下就很简单明了，比如说，这个哥们怎么样怎么样，你不要用那些英式的说法，英式的名词去解释这个事情。你就直接说，这哥们儿相当于这些地方的扫荡子，读者一听就懂了，读者就能理解这个东西是什么。


    不管是英国的东西也好，美国的东西也好，你解释不清楚的时候，你就直接代入到你身边一些东西，这样别人一听就能消化它、理解它。你如果使用大量的外语词汇、大量的专业词汇、大量的别人听不懂的词汇，你这样虽然能达到一种装逼的效果，但别人是不会欢迎你的，不会喜欢你的，别人的内心深处是拒绝的，不会喜欢你这些东西的。


    所以，你一定要通俗的像白居易写的那样去表达你的信息，这样就是对的。


    我不知道这个群里大家的年龄是多少，但是我一定要说一件事情。这个世界是一直在不停地变的。你不要觉得你以前成功，就用以前的思维继续做事情。人是在不停的变的，年轻人的思维方式也是在不停的变的。你一定要跟上时代，跟上潮流。


    根据最新的一些调查，看足球和篮球的年轻人数量越来越少，18岁到28岁看打电竞比赛的人越来越多。像英雄联盟这种游戏，现在是国内第一大游戏比赛，看这个游戏的人越来越多。你可能年纪大了，即使你不接受这些东西，你也必须接受，要跟上时代，你要了解年轻人
    Managers. 你要知道年轻人想什么，你要知道年轻人做什么，你要知道他们的口头禅是说什么意思。


    哪怕你再不喜欢王者荣耀，你也要去尝试王者荣耀。哪怕你再不喜欢吃鸡，你要去尝试玩吃鸡。你要知道现在流行什么，年轻人想什么，如果你不


    能理解这事物，你就无法成为一个真正优秀的人。


    因为时代是在不停的变的，你不能老是抱着保守的僵化的思想，你要一直跟著年轻人走。现在年轻人的思维方式跟我们发生了很大的变化，他们生活的物质环境跟我们是不一样的。


    我说道人是经济动物、人所有的行为都是被经济所控制的。所以他们的想法会跟我们不一样，他们会更自信、更开放、更乐观、更开朗。


    现在大多数年轻人他们的气质和形象，跟我们以前的年轻人的气质和形象是完全不同的。因此，我们要尊重万物的变化。你在跟他们说话的时候，你就不能再用以前的思维，你必须要用一些他们听得懂的，动漫的语言，游戏的语言去跟他们沟通。


    他们卖萌，你也要知道怎么卖萌，他们装可爱，你也要知道怎么装可爱。你可以不接受他们，但是你一定要了解他们，这就是对万物的尊重，也是属于历练的一种。


    你要对万物尊重，你要用他们听得懂的语言去跟他们沟通，这个时候你才完成一次自我更新。你要不断的自我更新。


    我初入职场的时候是做平面设计的，后面我发现电子商务快起来的时候，就是 2009 年的时候，我就坚决要去做电子商务。


    电子商务也确实让我生活变好了。以前我做平面设计只能做到企划经理，但电子商务我做就做到了电商总监，做到了小猪班纳分公司的副总。


    后面电商慢慢的不行了，我就坚决转型。我又转型做自媒体。我在不停的变化，不停地适应这个时代。


    其实，所有东西都是在不断变化的，当你越适应这个时代的时候，你的心就越是宽松的，是打开的。当你能够接收新事物的时候，你就能更快地吸收新事物。


    所以，我希望大家都能保持这种跟社会同步的一种心态。


    我最后做个总结。


    我们看任何事物，不要带着道德的眼光去看，要用利益链条的眼光去看。你看懂这个利益链条并不一定就是单独的追求利益，你可以在这中间获取利益，你可以让自己和家人过得很好，你可以遵纪守法，也过得很好。


    但是，你也可以通过这套方法去读懂很多很多这个世界上你想不通的事情，读懂别人，读懂世界，你会产生一种真正的悲天悯人，而不是那种浅薄表层的悲天悯人，是发自灵魂的悲天悯人。


    你懂得这些东西之后，你再跟别人沟通的时候，你就懂得用别人听得懂的东西，通俗的东西去跟他们沟通。这样的话你就有自己的价值观和这个系统。


    当然，这只是我自己的想法，我说的不一定是正确的。我今天说的所有的东西都不一定是正确的。


    我一直鼓励大家独立思考，我所有的东西都是我自己的一套哲学系统，是我自己看懂万物的方法论。这套方法论确实使我受益良多，使我人生的下半场应该是越战越勇。


    但是，你们不要迷信我说的话，


    我只是做一个分享而已，你们觉得自己适合什么，自己按那条路走就可以了。我只是分享一下我的方法论。


    我的分享到这里就结束了，谢谢加盐。


    ## 人生道路该如何选择


    讲师： 何加盐。


    时间： 2020 年 5 月


    大家好，时间过得很快，转眼又是 一年，很感谢大家在这一年来对何加盐以及牛人星球的认可和支持。


    这一年来，我也收到过无数朋友的私信，或者在群里看到大家的聊天，能够感受到有很多人都在牛人星球里得到了成长进步，对于这一点我非常欣慰，也希望大家在日后的生活里，能够继续保持这种持续进化的节奏。


    今天的题目有点大，叫做《人生道路该如何选择》。为什么会选择这样一个题目呢？是因为我最近几年常常会碰到很多朋友，都对自己所选择的人生道路、或者将要选择的人生道路充满了疑惑、充满了不甘、充满了想要又不敢的犹豫。


    我看到很多人，明白自己在某一方面很有激情或者很有能力，但是就是选错了一个方向或者站错了一个平台，导致生活很痛苦，对未来很迷茫。


    例如我前几天在星球文章里写到过的一个帅大的师弟，他是物理竞赛全国一等奖的得主，人特别的聪明，家族也有稳定的事业。但是他毕业 5 年多以来，一直都还是找不到自己人生的方向，到现在一事无成。


    我们不是说他赚钱多少，而只是说，他没有找到一个能够安放自己的灵魂的地方。如果我们说一个人的真正的成功，是可以按照自己喜欢的方式过一辈子的话，那么可以说这一位师弟他拥有了成功的最好的条件，但是却处在了离成功最远的一个地方。我觉得特别可惜，特别令人心痛。


    那么咱们的星球里面，我想肯定也很多朋友，对自己曾经的选择是后悔的，对自己现在的境况是不满的，对未来是有其他新的憧憬的。今天我讲的这个题目，可能会对大家在这些方面有一些参考的作用，所以如果你有这些方面苦恼的话，建议好好地听一听。


    其实我们每一个人每天都在不断地作出选择，但是对于一个人来说，人生最重要的选择，往往只有极少数的几次，甚至于只有最关键的一次。所以我想，今天我们讨论人生道路该如何选择，其实关键的是，说我们在人生的重要关口该怎样选择人生道路。只要你的
    人生能够把那一次最关键的选择做好了，你的整个人生都会大不一样。


    我今天关于人生选择的演讲分为四个部分，第一部分讲一讲选择的三个方面，第二部分讲一讲选择的五个层次，第三部分讲选择之后如何落地，第四部分讲如果实在是没法选择该怎么办。


    首先我们看一下选择包括的三个方面。


    一般来说，我们决定做一个人生关键选择的时候，都是要选三个东西：


    第一，我选择人生往哪个方向走。如果是大学的话，就是选择哪个专业；如果是工作，就是选入哪一行。这是一个方向性的东西。


    由于经济的发展，科技的进步，社会的变化，有一些方向是很 有前途的，有一些方向是夕阳西下的。所以这个对我们是很重要的。


    如果你选择了一个未来很 有前景的专业，或者说事业，那么未来，你即使是没有别人那么努力，但是你在 这个专业或 者 行业里水准稍高，你都能够获得比别人更大的红利；但是如果你在一个错误的方向上，那不管你怎么努力，可能你的
    人生 成就不、或者说你自己的满足感，是远远不如别人，也达不到自己的预期目标的。


    这就有 点像雷军的两个选择，最初他选择了做金山，他认为自己非常的努力，但是其成功的程度不如自己的预期，他过得很痛苦，他把那一段经历比喇成“在盐碱地种庄稼”。后来他选中了一个别的行业，开始做小米，然后才有了今天的小米庞大的帝国。雷军把后面这一段比作是在风口上飞”。他的名言大家也都耳熟能详了，在风口上，猪都能飞起来。当然雷军他本身都不是猪，它是一只雄鹰，所以遇到风的时候乘风而起，那就是“好风凭借力，送我上青云”，那就更厉害了。所以选择的
    第一点是要选择一个好的方向。至于什么是好的方向，我们等一会儿第二个部分再来说。


    选择的第二点是选择一个好的平台。就是你选好一个方向之后，去往这个方向的可能有不同的平台。


    举一个很简单的例子，假设我们都是要从广州去北京，你可以坐飞机去，也可以坐火车去，也可以开车或者是坐船，甚至走路、骑自行车都可以，这就是我们选择的平台。当然“飞机是最快的，但是“飞机也会有飞机票比较贵的问题，也会
    有从机场到市区比较麻烦的问题；坐高铁可能更舒适，但是路上的时间会 稍微长一点；坐


    普通火车那时间就更长了，但是它的票价是最便宜的。走路自然就不用说了，如果你一点钱都没有，可能你就只能走路，因为你没得选择。


    大家很简单就能明白，选择不同平台的话，我从 A 地到 B 地，所花费的时间是不一样的，舒适程度是不不一样的，当然所需要的前提条件和付出的成本也是不一样的。


    这个在现实中是什么意思呢？如果是学习的话，平台就是我们选择的学校。有人可能会说，我也想选好的学校，可是成绩不够啊。其实在同样的分数下你也可以选择不同学校，比如说你是选择一个专科，还是三本？或者说选好一点的学校的差专业，还是差一点的学校的好专业？是选择一个综合性的学校，还是理工类的学校，或者是音乐类艺术类的学校？同一方向，是有很多不同的平台的。


    如果是事业上的话，平台就是指我们选择的公司或者说团队。同样是朝阳行业，也有许多公司做得半死不活，也有许多公司做得很成功，这个就是跟不同团队、不同公司的状态、气质、能力、价值观等有关了。


    所以我们选择平台的话，要选择自己最舒服的、自己更能成长的、未来的前景更辉煌的一个平台，不要选择那种死气沉沉或者自己在里面学不到东西，或者在里面每天度日如年的那种平台。


    方向和平台是我们对外的一个选择，同时呢，我们还有对内一个选择，就是你选择以什么样的姿势，或者什么样的态度去加入这个方向，登上这个平台。同样是坐火车，我可以躺着，也可以坐着，也可以站着，甚至是趴着。这就是所谓的不同的姿势。


    这应用到现实中是什么意思呢？我们每一天的选择除了选择做什么是事情之外，还要选择我们每天不同的做事的态度、做事的心情、做事的价值观、做事的原则。所以这个姿势的选择，其意义就是我们要选择一种对自己做人做事的要求。


    不管你在任何平台任何方向上，你都可以随波逐流、也可以标新立异，你都可以偷奸耍滑，也可以 用心做事，真诚做人。你可以选择利益至上，也可以选择成长之上，也可以选择打好人脉基础之上，甚至也可以选择让当下的自己感觉最舒服至上。不管怎样，你都要做出一个选择。这个选择有可能比方向和平台更能决定你的幸福感。


    上面我们说了选择包括的三个方面，但是我们怎么去选这三个方面呢？我怎么

    '
