    # 不为钱活，你值得拥有另一种生活


    分享者：汤鸣飞，教育行业创业者，内在成长修习者，财富並化践行者。曾在北上深抓地沧海 10 年，历经互联网，教育两个行业。现回到西安，和家乡共同成长。擅长资源整合，产品销讲，需求挖掘，成长类培训。陕西家庭教育研究会理事，陕西省牧校长联盟会理事，陕西商教信息协会理事。国家高級理财规划师，高级企业培训师，高级创业指导师，高级生涯规划师，高级家庭教育指导师。半职奶爸，25
    万公里自驾旅行经历，3000 小时北京龙泉寺志愿服务，10000 小时卡巴金静观冥想践行者，1500 小时正念止语禅修打卡


    时间：2021 年 2 月


    感谢加盐师兄的邀请，我在师兄的知星球里也看到之前邀请了很多关于创业投资管理的一些大咖来分享。今天我很荣幸，其实我并不是一个在创业或者投资非常成功的人，我只是在内在成长这条路上走了蛮多年，希望能够给大家带来一些不一样的观点，不一样的声音。


    2016 年我第一次去龙泉寺拜访了贤智法师，贤智法师当时问了我一个问题：鹏飞，你作为志愿者，你来龙泉寺有什么样的目的？我說：工作、创业、生活，我想思考一些人生更高维度的问题，但我又不是一个佛教徒，也不是一个道家或者儒家的忠实粉丝，只是看了一些书，而且我正在北京创业，所以我离这里很近，我就想请教一下您，您觉得对于我们这些青年人有什么建议吗？


    贤智法师问我这样一个问题，让我去思考人生到底意义是什么。或许佛家不能够帮你解决所有的问题，但是至少它可能是我内心探索的一条途径。在我等待他回答的时候，贤智法师又问了我这样一个问题。鹏飞你一个月花多少钱？我說我在北京一个月，2万到3万块钱的开销，包括房租，包括我嬷妈，我们两个人的消费，整个一个家庭加起来，他說我觉得你的生活可能面临的一些问题。


    我想一个月花2~3万，在北京应该不算是特別夸张，当然也不会特别节省，因为我和我嬷妈比较喜欢去尝试各种各样好玩的东西，基本上我们不会去'
  - '[PAGE 154]


    追求奢侈品，但是我们会参与各种各样的活动，包括去玩射击、户外滑雪、蹦极、当时贤智法师说我们的生活可能遇到了一些问题，我辩解到，其实我们这两年消费才上来。之前我们收入不高的時候，一个月可能花1万块钱，当时也觉得挺幸福的，有一点游戏，有一点找理由。没想到贤智法师告诉我们，其实那个时候你们的生活也很混乱。


    如果1万块钱生活也很混乱的话，难道要回到上大学的时候吗？我从西安考到杭州，因为西安的经济环境和经济条件并不好，所以当时我的生活费一个

    月只有800块钱，那我就强行去辩解。我就问了贤智法师一个问题：难道在北京一个月花3000块钱，才叫符合佛陀的理念吗？


    贤智法师说，不管是花3万块钱，1万块钱，还是3000块钱，都不是佛陀的理念。如果你作为志愿者，我不想给你普及更更多的佛法，我希望通过这个问题去启发你，人生到底什么是最重要的？到底和钱关系有多大？当你花3万的时候，花1万的时候，或者花3000的时候，你会对幸福、快乐有不同的看法吗？你会对人生的价值有不同的看法吗？当时我没有什么想法，因为那是我第一次去龙泉寺，但是它给我的人生埋下了一个伏笔。在我之后的创业生活中，我一直去思考这个问题。


    2018年，我们的创业达到了第一个小的目标，然后团队一起去云南做了一次长时间的团建。我们在云南呆了10天时间，我记得很清楚，因为我自已非常喜欢从泰国、缅甸、越南、还有云南的西双版纳都在搞的泼水节。我每年都想去云南玩，但是那一年是和同事一起去，我记得很清楚，那天晚上喝了点酒，然后就一个人来到西双版纳的野象谷的丛林边，因为我们当时住在野象谷附近。有一个很神奇的事情在那天晚上发生了。


    所有的同事都没有陪着我。我一个人到野象谷旁边，住在那个小木屋里。这是我人生第一次遇到一条“蟒蛇”，我以为是“蟒蛇”。后来村民告诉我们这个东西其实是带毒的，在云南、缅甸交界的地方才会有。很神奇，我就无缘无故的被咬了一口，我眼睁睁看着它扑了上来，咬到我的中指，就像电影里演的那样，你看到它，却无能为力。然后我就断片了。


    当我醒来的时候，我躺在医院里。我竖住医生，我说我头很疼，是不是这个蛇有毒？大夫非常惊讶的告诉我，你的血里头好像带一种解毒的元素。'
  - '[PAGE 155]


    这种蛇三年前也咬过一个游客，但那个游客当时就中毒身亡了。他问我之前吃过什么，蛇胆或者和蛇血清相关的中药。我印象里好像就是一个礼拜前，因为北京的温差比较大，我感冒了，喝了一些双黄连，大夫偷偷的笑了。


    那天晚上醒来后，我一夜没睡。当你经历过从恐惧到惶恐，再到“生离死别”，再战胜回到人间。这个过程绝不是电影里演的，它没有什么值得回味，也没有什么精彩。你只是会不断赞叹生命的奇迹，但是又有一丝无奈。你好像穿越了一个很漫长很漫长的生死隧道，这种感觉必然会让你静静的思考：为什么要成功？为什么要挣钱？为什么要活着？


    吊诡的是我们刚刚完成第一个创业小目标，我觉得人生即将奔向一种新的高度。我们攒下买房的钱，然后遇到了这么一件事。有时候我会觉得人生确实挺有意思，在很多特殊的时间点，出现特别地让人无法理解的，但又很怀孕的事，它会刺激着你不断思考人生的意义。


    2019年我们做了一个公益项目，把西安周边的农村孩子，包括留守儿童，残疾儿童，单亲家庭的孩子等和北京家庭条件不错的孩子交换角色。我们没有香港节目中上层家庭和下层家庭的角色互换这么严肃，就是希望把北京的孩子带到西安周边的农村来体验一下生活，把西安儿童村以及周围一些贫困地区的孩子带到北京去，参观小米，参观百度，爬长城等。


    我带着西安周边的这些农村的孩子去北京的时候，你能看到他们眼神的渴望，那种对世界的好奇心，想要学习的冲动，非常真实。每一个孩子都会赞叹北京发展的速度，都会觉得人生是很希望的。当他们在山里、在村里的时候，他们其实是被压抑的。我看过一些书，考了很多跟教育相关的证，但都不能给我带来这种启示。书、课程、自媒体都会告诉我，人是分阶层的，但那一天我感受到了很不一样的东西。


    当我带着这些西北的孩子在国家图书馆，带着他们去爬长城、去百度参观，他们会对未来充满了想象，那种想象和电视采访北京的中产家庭的孩子是一样的，他们也想到国外去争光，也会向往北京的工作环境。孩子们好像一瞬间就产生了一种从来都没有的灵感，高度。


    可能我们所知的关于人生成长，人生发展是和父母的起点有关，和格局有关，和眼界有关。或许是对的，但至少在那一刻，我不这么认为，我会觉得其'
  - '[PAGE 156]


    其实人生有许多不一样的东西，它能够突破这些条条框框。


    2020 年我和她妈迎来人生中最大的礼物，我们的女儿出生。因为疫情，前半年基本上都在家，女儿没有见过世面，也没有和别的小孩子交流，更没有去其他地方游玩。你会发现她有很多情绪要表达，但被压抑住了。她有很多想法没有地方去释放，因为环境太单一了，她的创造力、与生俱来的活力都被压制住了。


    七八月疫情稍好一些，我们带着她到处去玩、爬山、油湖、去朋友家做客，你会发现哪里有什么都稀罕宝宝，什么内向宝宝。人生从生下来开始就充满着张力，就充满着无限可能。因为她没有体验过这些，被压抑住了。


    她上半年一句话都不说，连声音都不愿意发，可下半年这几个月，整个人都改变了。我以前做教育、考证，做咨询，各种理论都告诉我们，人的性格是先天的，但实际案例告诉你，人有无限的可能。


    前前后后这些事情串起来，它不得不让我去反思：到成人为什么活着？人的价值是什么？人的意义是什么？它比我创业、工作、挣钱、买房、理财，要重要得多，至少它带给我的感觉是感受无
    '''''' 精彩。我觉得这可能是我们所有人都应该去思考的一个问题。


    2015 年夏天，我相信除去那些极少数财富自由，通过股票实现人生理想的人，大部分散户和我的心情应该差不多。我们做着冲上 8000 点、冲上 1 万点的梦，但是它停止在
    5100 多点。那个夏天北京的心理医生根本就约不上，不过有缘，我和武志红老师做了 7 次一对一交流，真的好贵，我记得当时刷的信用卡。整个咨询我都在和武志红老师探索一个问题：既然我损失了，我这么痛苦，那我得到的时候为什么没有这么幸福，没有这么快乐呢？


    这其实是心理学一个很基本的问题，因为我没有心理学的背景。做咨询的时候，我就是想不明白，我知道人是厌恶损失的，但损失的感觉真的太难受了。如果我通过炒股或者打工，创业挣了一个
    100 万，开心了两天。但我赔掉了 100 万，或者客户欠了你 100 万，我会痛苦几个月，而且每天都很难过。武志红老师告诉我是人生常态，那既然它是常态，我为什么要去追求那两天的快乐呢？人生本来就是平衡的，你在这里得到，必然在另一个地方释放。


    15 年-16 年我相继拜访了刘明老师、陈晓东老师、武志红老师、李忠堂老'
  - '[PAGE 157]


    师，卡巴金在中国有两个传人，从格式塔、精神分析、NLP、萨提亚到积极心理学，花了不少钱，但是学了一圈，其实你没有找到什么人生的价值，也没有什么人生的意义可以让你有特别明晰的理解。我只想明白了一点：你会一直去思考这件事情。


    思考本身，它可能就是人生的意义。你不断思考：你为什么活着，为什么快乐？它伴随着我后面 5 年的经历，也伴随着我一次又一次去龙泉寺做志愿者，每一次都是一个月，最长一次做了三个月。


    2018 年开始，我去学习卡巴金的正念冥想。因为做志愿者一年你才有一次机会，龙泉寺可不是你想去就能去的，但是正面冥想每天都可以做。它的很多理论，很简单，回到当下专注当下，但是它能帮助我们收心，收情绪，收念头，它也在刺激着我们去不断反思、觉察。


    你活着本身就是意义！你活着本身就是意义！

    当你反过来再去看这些问题的时候，突然间会发现诗和远方，真的是诗和远方，不是网上的说的，去了一地鸡毛，回来继续焦虑。爱旅游，爱创造，真的很幸福，也不是网上的说的，旅游没什么意义，创造只是在楼伤而已。当你回到正念的状态，回到当下，回到此刻，就是这一片刻的感觉和感受。创业本身其实一点都不累，因为根本就没有
    996，根本就没有客户的烦恼，这个是真的。有的时候确实会觉得内心成长这条路找了一大圈，最后发现其实此时此刻生动的生活就进行了。


    我们都是教育的失败品。为什么这么说？我做了 6 年教育，咨询了 600 多个大学生个案，讲的大课，大学生的、高中的，从生涯规划到职业规划，心理的、健康减压的，有几百场。你会发现所有人脑子里的问題都是一样的。因为我们的教育本身出了问题，但是今天我们不深入探讨教育细节的东西，我们要去反思教育带来的问题。它让我们整个人生根本不知道为什么而忙，为什么而活？因为为什么快乐？因为为什么幸福？所以要回到内心。回到那些此刻的感觉。


    我不喜欢很多人，打着吸引力法则或者帮你成功的方式，去践踏心理学。我也不喜欢很多人用传统文化的条条框框告诉我们应该怎么做。我们本身活着，全然的活着，放松的活着，自在的活着，专注的活着，真的就很快乐。你要问我多长时间能形成这个习惯？8
    个星期就可以 了。按照卡巴金正念冥想的'
  md: "\n可真的做出了不错业绩，而又基于比例的控制情况下，本来就介于 B+/B 之间，其实没办法的情况下放到了 B 的位置上，这种情况在我们绩效考核过程中是不可避免的，所以这种沟通是比较难度的，那这对管理者的要求就会很高，他就需要要在日常过程中要做事件记录，要能明确表达走的需要改进的地方。\n\
    \n## 绩效反馈（非常重要，不可忽视）\n\n- 绩效反馈即本着为了帮助员工成长规范、明确了绩效沟通、绩效改进、绩效跟踪三个步骤：\n  - 明确对绩效现状、绩效改进的方向\n\
    \  - 调整方向要求及改进方向为导向\n  - 制定改进措施，并指定一个具体时间周期随同大目标\n- 绩效沟通要突出双向沟通、交流反馈（有明确时间要求，落实到它，校长提醒）\n\
    - 绩效沟通注重视:\n  - 尊重、理解、共情：\n    - 尊重员工、理解员工心态、不断帮助成长、打开心结、达成一致共识\n    - 与被评价人员的沟通原则、以及对员工改善的讨论建议\n\
    \    - 提出建议等、帮助员工拟定改进目标；必要要帮助做好绩效工作的调整\n- 绩效改进:\n  - 与员工一起制定改进措施（可视化及讲评）\n  -\
    \ 明确时间、阶段性目标—跟踪评估\n  - 共同制定个人的培训计划、提供支持和帮助\n\n这里我想提醒两点的，就是针对高绩效员工我们怎么去沟通？那很多会觉得有的领导会想这个员工高绩效对吧？我就不能再表扬他了，我得故意打压他或什么，但实际上这个思维不是特别对，我想提醒的是你可以不用特质去打压他，也不用舍不得表扬他，因为人都是希望被表扬的，你可以在沟通过程中去增强他的信心，同时让他成为你的左膀右臂，给你更多提出他对部门的一些改进建议和个人发展的期望，然后你结合他的个人期望给他设计更有挑战，更有难度的工任务和目标，我觉得这个是对高绩效员工关注的地方。\n\
    \n针对低绩效员工是很难谈的，但也不是不能谈。针对低绩效员工，重在事实依据，要做好日常记录，日常纠偏，比如说态度方面，知识方面以及他在所需要的工作技能方面的短板，是你明确能够清楚所有记录的，而不是凭感觉的，是基于事实来去表达的，我相信很多员工是会认可的，因为我在工作中也不少和这样的员工去沟通，只要你做有准备之战，其实是没有难度的。\n\
    \n关于绩效反馈，很多会忽视，但我想跟大家说的是这一块非常重要，而且一定要签字确认，才能作为日后管理抓手，因为有些时候和不胜任的员工打官司是需要依据的，低绩效员工的绩效结果，就是不胜任的重要依据和证明，所以是\n\
    \n需要员工签字确认的。\n\n在华为还有一个很重要的闭环，就是对低绩效员工，我们会做 PIP，也就是个人发展和成长计划，那他和那个 IDP 是不一样的，PIP\
    \ 是低绩效的改进计划。\n\n还剩一点内容就是绩效的结果运用。很多人都讲华为的绩效做得好，其实做的好是流程规范了，评价相对客观了，还有一点非常重要，就是绩效是华为在人力资源所有模块工作当中的基石，什么是基石？就是最重要的一个基础。当把绩效管理做好了，评价体系出来了，绩效结果有了以后，那对应的在各个领域的运用就非常的广泛，而这样的应用才是真正能够去激发人的潜力的。\n\
    \n## 绩效结果应用（1）\n\n各公司对潜力力量评价的不同下，薪酬结果与员工绩效制定原则\n\n| 不称职等级 | 1 对绩效、薪酬制订原则 | 宽带\
    \ | 薪酬和绩效 | 备注 |\n|---|---|---|---|---|\n| A | 薪酬结果、和绩效挂钩。工程、经营等项目部门，绩效结果随绩效联动，并纳入员工赔偿范围内\
    \ | 有绩效，有绩效结果。绩效结果与薪酬挂钩 | 有绩效令薪酬随绩效联动 | 与绩效结果和绩效等级直接相关 |\n| B+ | | | | |\n| B\
    \ | | 原则上无 | 无 | |\n| C | | | | |\n| D | 不满意/差评 | 无 | 无 | |\n\n华为的绩效结果会跟员工的薪酬、调薪、配股、晋升、评优，所有涉及到人的名或者利益相关部门，都会跟绩效有一个强相关强挂钩，也就是说绩效结果的运用是多元化的，也是灵活的。基于这个应用，才是真正能够把人才激活。\n\
    \n因为所有的人都会知道，如果我的绩效不好，对我有很大的影响，反过来讲如果我的绩效好，那我就可以有很多好的方面，就会形成越来越好的一個正向循环，所以为了好的绩效，那大家就会有很强的目标感和方向感，当然对自己的要求也会更高。\n\
    \n这也是华为为什么人才选取一定要从 211/985 这些名校来，因为人很重要。因为人选对了很重要，因为我们认为这样学校的学生，大多数对自己的要求是比较高的，愿意上进和进步的动力是比较强的，本身对自我的要求也比较高，也更愿意自我挑战，对自己有更高追求。\n\
    \n事实大家都在想，到底怎么样才能激发员工的积极性和意愿度，积极性和意愿度是比较难培养的，他有天性在里面，如果可以的话，我建议大家从人选上面就先做第一把关，先选对这样的人，在对这样的人去做培养才是更有意义和价值的。如果你一开始人都选错了，你对他花更多的时间培养和教育那都是错的。\n\
    \n当然华为不是所有的人都这么高意愿，这是不可能的。我们都知道，人天生都有惰性。只不过说你在一个组织文化里面，你就很难以惰性，因为你惰性了你就会被淘汰。所以你要不愿意在这个组织里被折磨。我说的折磨有点意思就是被修炼，不断的去进步，要不然你就觉得这个组织不适合你，你就离开，所以这样的人也就不是华为人自然而然离开。\n\
    \n## 绩效结果应用 (2)\n\n在绩效结果可预期但会随条件变化下，绩效结果与工作制度相关联\n\n| 绩效等级 | 干系（有条件） | 人为晋升渠道\
    \ | 任职资格评定 | 本轮考核不/持续发展 | 内部调动 | 外部引入机会 |\n|---|---|---|---|---|---|---|\n| A\
    \ | 有条件，可进入专项通道 | 有条件，可进入专项通道 |  | 无 | 有机会 |  |\n| B+ |  | 有机会 |  |  |  |  |\n\
    | B |  |  |  |  |  |  |\n| C | 没有机会会被淘汰 |  | 没有机会 | 进入人员PIP，考核调整退出 | 没有机会 |  |\n\
    | D | 视情况会被淘汰 |  |  | 不适合干系调整 |  |  |\n\n这是绩效结果的第二个应用，具体的我就不再详细讲了，大家可以自己看，反正通常来讲什么样的绩效结果是有机地配合加薪等，在表格上面列的比较清晰，这些材料都属于相对于公司内部的资料，大家自己用，请不要外发。\n\
    \n最后，跟大家讲一下干部管理，既然大家都知道华为跟外部的差异性很多时候是在管理者的成熟度上面，我觉得与其花很多的时间去研究怎么把考核结果量化 KPI，可能更多的时间不如去思考怎么让你的管理者变得经验更丰富，能力更强，如何去提升管理者的管理能力，以及说华为在人才选拔上面的时候，在干部选拔和干部的通用能力上面主要会关注哪几个点，我想跟大家讲一讲。\n\
    \n## 干部标准通用框架/干部四力\n\n华为的干部通用标准就是人才选拨的从 4 个维度，第一个就是品德，那怎么讲品德，品德不是用来考核的，平时也不会关注，那品德会在什么时候看呢？在管理者有没有出现什么关键事件，比如说贪污了，或者说发生什么不正当的关系等等，或者类似涉及到品德底线问题的时候，不管多优秀，只要你一旦做了这些事情，不好意思，那你就再也没有机会了，这就是不考核，但作为底线要求，这是一个基础，就是你不要去碰红线。\n\
    \n第二个就是核心价值观与使命感，作为一个管理者，你必须能够充分的去理解公司的核心价值观，并且时刻保持着对企业的使命感。这是最基本的能力，如果这条都没有了，那就不用说了，肯定没机会，也不可能担当大任。\n\
    \n真正选拔干部最重要的分水岭是绩效，也就是说干部要会打胜仗，在华为干部选拔的时候，我们一定会优先看绩效的。我们认为那个常胜将军至少说明他在现在这个岗位上，是能挑\
    \ 100 斤，那就他应该可以挑 150 斤甚至 200 斤，那我们就会把他往上提一级，让他到对应的岗位上去锻炼。那上去了是否胜任？判断的依据是在对应考核期的绩效，是否能做出该岗位对应的贡献即绩效。\n\
    \n所以干部选拔分水岭首先是绩效，绩效是证明他在这个岗位上的胜任力是没有问题的，而且是轻车熟路的，然后才可以再往上拔，往上拔上一个职级去做上一层领导，然后再去考核，再看是不是能够挑的起来，只要能够挑起来，就能够继续往上，如果不能，那可能就没有上升机会了。我们认为只有一段成功的经历才叫经验，否则只叫经历。所以能力与经验就是这样作为选拔每一层干部的关键要素。\n\
    \n华为为干部的领导要求最重要的 4 个能力，对基层干部最主要的就是要求他有执行力，对中层要求最重要的是理解力，高层最重要的是决策力。\n\n什么叫基层要执行力？做一个基层管理者，最基本就是能带众做项目。怎么去训练基层管理者？就是做项目，不断的通过一个个项目，通过持续不断的打胜仗来证明你在基层管理者的能力和经验是没有问题的。完成了上升到中层管理者的理解力，那怎么去训练中层管理者？最核心的是让中层管理者轮岗。通过上下游岗位、横向跨部门岗位轮岗，比如研发到测试，再到质量或\
    \ HR，让人才能上能下，能左右这样跨岗位跨职责的去轮岗，通过轮岗，扩大视野，并提升理解力，更好的理解公司岗位上下游、周边跨部门协作关系，提升个人能力与技能的同时，还学会看问题的视角不会只站在自己的角度，视野会更宽，这对很多企业来说要做到轮岗是有难度的。但轮岗对于管理者来讲是很有意义的一件事情。\n\
    \n最后对于高层来讲的话，就是怎么证明一个好的中层，提放到高层以后，是具备决策力呢？首先是会有个试用期，每一个管理者都有一个试用期，然后把高层放到一个可能不太好的区域去做这个区域的提升，比如说这个区域在新高层的打理下能够扭亏为盈，或者说这个组织在高层的管理下，组织氛围由坏变好，又或者说这个组织在高层的打理下，能够挑战承担组织想要实现的目标任务等（比如华为手机业务）。只要做到了，某种程度上就证明你的决策力是没有问题的，你能够承担公司的更高战略目标。总的来讲，华为主要是通过这些方式训练干部的\
    \ 4 个能力。\n\n## 不为钱活，你值得拥有另一种生活\n\n分享者：汤鸣飞，教育行业创业者，内在成长修习者，财富並化践行者。曾在北上深抓地沧海 10\
    \ 年，历经互联网，教育两个行业。现回到西安，和家乡共同成长。擅长资源整合，产品销讲，需求挖掘，成长类培训。陕西家庭教育研究会理事，陕西省牧校长联盟会理事，陕西商教信息协会理事。国家高級理财规划师，高级企业培训师，高级创业指导师，高级生涯规划师，高级家庭教育指导师。半职奶爸，25\
    \ 万公里自驾旅行经历，3000 小时北京龙泉寺志愿服务，10000 小时卡巴金静观冥想践行者，1500 小时正念止语禅修打卡\n\n时间：2021 年 2\
    \ 月\n\n感谢加盐师兄的邀请，我在师兄的知星球里也看到之前邀请了很多关于创业投资管理的一些大咖来分享。今天我很荣幸，其实我并不是一个在创业或者投资非常成功的人，我只是在内在成长这条路上走了蛮多年，希望能够给大家带来一些不一样的观点，不一样的声音。\n\
    \n2016 年我第一次去龙泉寺拜访了贤智法师，贤智法师当时问了我一个问题：鹏飞，你作为志愿者，你来龙泉寺有什么样的目的？我說：工作、创业、生活，我想思考一些人生更高维度的问题，但我又不是一个佛教徒，也不是一个道家或者儒家的忠实粉丝，只是看了一些书，而且我正在北京创业，所以我离这里很近，我就想请教一下您，您觉得对于我们这些青年人有什么建议吗？\n\
    \n贤智法师问我这样一个问题，让我去思考人生到底意义是什么。或许佛家不能够帮你解决所有的问题，但是至少它可能是我内心探索的一条途径。在我等待他回答的时候，贤智法师又问了我这样一个问题。鹏飞你一个月花多少钱？我說我在北京一个月，2万到3万块钱的开销，包括房租，包括我嬷妈，我们两个人的消费，整个一个家庭加起来，他說我觉得你的生活可能面临的一些问题。\n\
    \n我想一个月花2~3万，在北京应该不算是特別夸张，当然也不会特别节省，因为我和我嬷妈比较喜欢去尝试各种各样好玩的东西，基本上我们不会去追求奢侈品，但是我们会参与各种各样的活动，包括去玩射击、户外滑雪、蹦极、当时贤智法师说我们的生活可能遇到了一些问题，我辩解到，其实我们这两年消费才上来。之前我们收入不高的時候，一个月可能花1万块钱，当时也觉得挺幸福的，有一点游戏，有一点找理由。没想到贤智法师告诉我们，其实那个时候你们的生活也很混乱。\n\
    \n如果1万块钱生活也很混乱的话，难道要回到上大学的时候吗？我从西安考到杭州，因为西安的经济环境和经济条件并不好，所以当时我的生活费一个月只有800块钱，那我就强行去辩解。我就问了贤智法师一个问题：难道在北京一个月花3000块钱，才叫符合佛陀的理念吗？\n\
    \n贤智法师说，不管是花3万块钱，1万块钱，还是3000块钱，都不是佛陀的理念。如果你作为志愿者，我不想给你普及更更多的佛法，我希望通过这个问题去启发你，人生到底什么是最重要的？到底和钱关系有多大？当你花3万的时候，花1万的时候，或者花3000的时候，你会对幸福、快乐有不同的看法吗？你会对人生的价值有不同的看法吗？当时我没有什么想法，因为那是我第一次去龙泉寺，但是它给我的人生埋下了一个伏笔。在我之后的创业生活中，我一直去思考这个问题。\n\
    \n2018年，我们的创业达到了第一个小的目标，然后团队一起去云南做了一次长时间的团建。我们在云南呆了10天时间，我记得很清楚，因为我自已非常喜欢从泰国、缅甸、越南、还有云南的西双版纳都在搞的泼水节。我每年都想去云南玩，但是那一年是和同事一起去，我记得很清楚，那天晚上喝了点酒，然后就一个人来到西双版纳的野象谷的丛林边，因为我们当时住在野象谷附近。有一个很神奇的事情在那天晚上发生了。\n\
    \n所有的同事都没有陪着我。我一个人到野象谷旁边，住在那个小木屋里。这是我人生第一次遇到一条“蟒蛇”，我以为是“蟒蛇”。后来村民告诉我们这个东西其实是带毒的，在云南、缅甸交界的地方才会有。很神奇，我就无缘无故的被咬了一口，我眼睁睁看着它扑了上来，咬到我的中指，就像电影里演的那样，你看到它，却无能为力。然后我就断片了。\n\
    \n当我醒来的时候，我躺在医院里。我竖住医生，我说我头很疼，是不是这个蛇有毒？大夫非常惊讶的告诉我，你的血里头好像带一种解毒的元素。\n\n这种蛇三年前也咬过一个游客，但那个游客当时就中毒身亡了。他问我之前吃过什么，蛇胆或者和蛇血清相关的中药。我印象里好像就是一个礼拜前，因为北京的温差比较大，我感冒了，喝了一些双黄连，大夫偷偷的笑了。\n\
    \n那天晚上醒来后，我一夜没睡。当你经历过从恐惧到惶恐，再到“生离死别”，再战胜回到人间。这个过程绝不是电影里演的，它没有什么值得回味，也没有什么精彩。你只是会不断赞叹生命的奇迹，但是又有一丝无奈。你好像穿越了一个很漫长很漫长的生死隧道，这种感觉必然会让你静静的思考：为什么要成功？为什么要挣钱？为什么要活着？\n\
    \n吊诡的是我们刚刚完成第一个创业小目标，我觉得人生即将奔向一种新的高度。我们攒下买房的钱，然后遇到了这么一件事。有时候我会觉得人生确实挺有意思，在很多特殊的时间点，出现特别地让人无法理解的，但又很怀孕的事，它会刺激着你不断思考人生的意义。\n\
    \n2019年我们做了一个公益项目，把西安周边的农村孩子，包括留守儿童，残疾儿童，单亲家庭的孩子等和北京家庭条件不错的孩子交换角色。我们没有香港节目中上层家庭和下层家庭的角色互换这么严肃，就是希望把北京的孩子带到西安周边的农村来体验一下生活，把西安儿童村以及周围一些贫困地区的孩子带到北京去，参观小米，参观百度，爬长城等。\n\
    \n我带着西安周边的这些农村的孩子去北京的时候，你能看到他们眼神的渴望，那种对世界的好奇心，想要学习的冲动，非常真实。每一个孩子都会赞叹北京发展的速度，都会觉得人生是很希望的。当他们在山里、在村里的时候，他们其实是被压抑的。我看过一些书，考了很多跟教育相关的证，但都不能给我带来这种启示。书、课程、自媒体都会告诉我，人是分阶层的，但那一天我感受到了很不一样的东西。\n\
    \n当我带着这些西北的孩子在国家图书馆，带着他们去爬长城、去百度参观，他们会对未来充满了想象，那种想象和电视采访北京的中产家庭的孩子是一样的，他们也想到国外去争光，也会向往北京的工作环境。孩子们好像一瞬间就产生了一种从来都没有的灵感，高度。\n\
    \n可能我们所知的关于人生成长，人生发展是和父母的起点有关，和格局有关，和眼界有关。或许是对的，但至少在那一刻，我不这么认为，我会觉得其实人生有许多不一样的东西，它能够突破这些条条框框。\n\
    \n2020 年我和她妈迎来人生中最大的礼物，我们的女儿出生。因为疫情，前半年基本上都在家，女儿没有见过世面，也没有和别的小孩子交流，更没有去其他地方游玩。你会发现她有很多情绪要表达，但被压抑住了。她有很多想法没有地方去释放，因为环境太单一了，她的创造力、与生俱来的活力都被压制住了。\n\
    \n七八月疫情稍好一些，我们带着她到处去玩、爬山、油湖、去朋友家做客，你会发现哪里有什么都稀罕宝宝，什么内向宝宝。人生从生下来开始就充满着张力，就充满着无限可能。因为她没有体验过这些，被压抑住了。\n\
    \n她上半年一句话都不说，连声音都不愿意发，可下半年这几个月，整个人都改变了。我以前做教育、考证，做咨询，各种理论都告诉我们，人的性格是先天的，但实际案例告诉你，人有无限的可能。\n\
    \n前前后后这些事情串起来，它不得不让我去反思：到成人为什么活着？人的价值是什么？人的意义是什么？它比我创业、工作、挣钱、买房、理财，要重要得多，至少它带给我的感觉是感受无\
    \ 精彩。我觉得这可能是我们所有人都应该去思考的一个问题。\n\n2015 年夏天，我相信除去那些极少数财富自由，通过股票实现人生理想的人，大部分散户和我的心情应该差不多。我们做着冲上\
    \ 8000 点、冲上 1 万点的梦，但是它停止在 5100 多点。那个夏天北京的心理医生根本就约不上，不过有缘，我和武志红老师做了 7 次一对一交流，真的好贵，我记得当时刷的信用卡。整个咨询我都在和武志红老师探索一个问题：既然我损失了，我这么痛苦，那我得到的时候为什么没有这么幸福，没有这么快乐呢？\n\
    \n这其实是心理学一个很基本的问题，因为我没有心理学的背景。做咨询的时候，我就是想不明白，我知道人是厌恶损失的，但损失的感觉真的太难受了。如果我通过炒股或者打工，创业挣了一个\
    \ 100 万，开心了两天。但我赔掉了 100 万，或者客户欠了你 100 万，我会痛苦几个月，而且每天都很难过。武志红老师告诉我是人生常态，那既然它是常态，我为什么要去追求那两天的快乐呢？人生本来就是平衡的，你在这里得到，必然在另一个地方释放。\n\
    \n15 年-16 年我相继拜访了刘明老师、陈晓东老师、武志红老师、李忠堂老师，卡巴金在中国有两个传人，从格式塔、精神分析、NLP、萨提亚到积极心理学，花了不少钱，但是学了一圈，其实你没有找到什么人生的价值，也没有什么人生的意义可以让你有特别明晰的理解。我只想明白了一点：你会一直去思考这件事情。\n\
    \n思考本身，它可能就是人生的意义。你不断思考：你为什么活着，为什么快乐？它伴随着我后面 5 年的经历，也伴随着我一次又一次去龙泉寺做志愿者，每一次都是一个月，最长一次做了三个月。\n\
    \n2018 年开始，我去学习卡巴金的正念冥想。因为做志愿者一年你才有一次机会，龙泉寺可不是你想去就能去的，但是正面冥想每天都可以做。它的很多理论，很简单，回到当下专注当下，但是它能帮助我们收心，收情绪，收念头，它也在刺激着我们去不断反思、觉察。\n\
    \n你活着本身就是意义！你活着本身就是意义！\n当你反过来再去看这些问题的时候，突然间会发现诗和远方，真的是诗和远方，不是网上的说的，去了一地鸡毛，回来继续焦虑。爱旅游，爱创造，真的很幸福，也不是网上的说的，旅游没什么意义，创造只是在楼伤而已。当你回到正念的状态，回到当下，回到此刻，就是这一片刻的感觉和感受。创业本身其实一点都不累，因为根本就没有\
    \ 996，根本就没有客户的烦恼，这个是真的。有的时候确实会觉得内心成长这条路找了一大圈，最后发现其实此时此刻生动的生活就进行了。\n\n我们都是教育的失败品。为什么这么说？我做了\
    \ 6 年教育，咨询了 600 多个大学生个案，讲的大课，大学生的、高中的，从生涯规划到职业规划，心理的、健康减压的，有几百场。你会发现所有人脑子里的问題都是一样的。因为我们的教育本身出了问题，但是今天我们不深入探讨教育细节的东西，我们要去反思教育带来的问题。它让我们整个人生根本不知道为什么而忙，为什么而活？因为为什么快乐？因为为什么幸福？所以要回到内心。回到那些此刻的感觉。\n\
    \n我不喜欢很多人，打着吸引力法则或者帮你成功的方式，去践踏心理学。我也不喜欢很多人用传统文化的条条框框告诉我们应该怎么做。我们本身活着，全然的活着，放松的活着，自在的活着，专注的活着，真的就很快乐。你要问我多长时间能形成这个习惯？8\
    \ 个星期就可以 了。按照卡巴金正念冥想的\n"
  mdcn: "\n可真的做出了不错业绩，而又基于比例的控制情况下，本来就介于 B+/B 之间，其实没办法的情况下放到了 B 的位置上，这种情况在我们绩效考核过程中是不可避免的，所以这种沟通是比较难度的，那这对管理者的要求就会很高，他就需要要在日常过程中要做事件记录，要能明确表达走的需要改进的地方。\n\
    \n## 绩效反馈（非常重要，不可忽视）\n\n- 绩效反馈即本着为了帮助员工成长规范、明确了绩效沟通、绩效改进、绩效跟踪三个步骤：\n  - 明确对绩效现状、绩效改进的方向\n\
    \  - 调整方向要求及改进方向为导向\n  - 制定改进措施，并指定一个具体时间周期随同大目标\n- 绩效沟通要突出双向沟通、交流反馈（有明确时间要求，落实到它，校长提醒）\n\
    - 绩效沟通注重视:\n  - 尊重、理解、共情：\n    - 尊重员工、理解员工心态、不断帮助成长、打开心结、达成一致共识\n    - 与被评价人员的沟通原则、以及对员工改善的讨论建议\n\
    \    - 提出建议等、帮助员工拟定改进目标；必要要帮助做好绩效工作的调整\n- 绩效改进:\n  - 与员工一起制定改进措施（可视化及讲评）\n  -\
    \ 明确时间、阶段性目标—跟踪评估\n  - 共同制定个人的培训计划、提供支持和帮助\n\n这里我想提醒两点的，就是针对高绩效员工我们怎么去沟通？那很多会觉得有的领导会想这个员工高绩效对吧？我就不能再表扬他了，我得故意打压他或什么，但实际上这个思维不是特别对，我想提醒的是你可以不用特质去打压他，也不用舍不得表扬他，因为人都是希望被表扬的，你可以在沟通过程中去增强他的信心，同时让他成为你的左膀右臂，给你更多提出他对部门的一些改进建议和个人发展的期望，然后你结合他的个人期望给他设计更有挑战，更有难度的工任务和目标，我觉得这个是对高绩效员工关注的地方。\n\
    \n针对低绩效员工是很难谈的，但也不是不能谈。针对低绩效员工，重在事实依据，要做好日常记录，日常纠偏，比如说态度方面，知识方面以及他在所需要的工作技能方面的短板，是你明确能够清楚所有记录的，而不是凭感觉的，是基于事实来去表达的，我相信很多员工是会认可的，因为我在工作中也不少和这样的员工去沟通，只要你做有准备之战，其实是没有难度的。\n\
    \n关于绩效反馈，很多会忽视，但我想跟大家说的是这一块非常重要，而且一定要签字确认，才能作为日后管理抓手，因为有些时候和不胜任的员工打官司是需要依据的，低绩效员工的绩效结果，就是不胜任的重要依据和证明，所以是\n\
    \n需要员工签字确认的。\n\n在华为还有一个很重要的闭环，就是对低绩效员工，我们会做 PIP，也就是个人发展和成长计划，那他和那个 IDP 是不一样的，PIP\
    \ 是低绩效的改进计划。\n\n还剩一点内容就是绩效的结果运用。很多人都讲华为的绩效做得好，其实做的好是流程规范了，评价相对客观了，还有一点非常重要，就是绩效是华为在人力资源所有模块工作当中的基石，什么是基石？就是最重要的一个基础。当把绩效管理做好了，评价体系出来了，绩效结果有了以后，那对应的在各个领域的运用就非常的广泛，而这样的应用才是真正能够去激发人的潜力的。\n\
    \n## 绩效结果应用（1）\n\n各公司对潜力力量评价的不同下，薪酬结果与员工绩效制定原则\n\n| 不称职等级 | 1 对绩效、薪酬制订原则 | 宽带\
    \ | 薪酬和绩效 | 备注 |\n|---|---|---|---|---|\n| A | 薪酬结果、和绩效挂钩。工程、经营等项目部门，绩效结果随绩效联动，并纳入员工赔偿范围内\
    \ | 有绩效，有绩效结果。绩效结果与薪酬挂钩 | 有绩效令薪酬随绩效联动 | 与绩效结果和绩效等级直接相关 |\n| B+ | | | | |\n| B\
    \ | | 原则上无 | 无 | |\n| C | | | | |\n| D | 不满意/差评 | 无 | 无 | |\n\n华为的绩效结果会跟员工的薪酬、调薪、配股、晋升、评优，所有涉及到人的名或者利益相关部门，都会跟绩效有一个强相关强挂钩，也就是说绩效结果的运用是多元化的，也是灵活的。基于这个应用，才是真正能够把人才激活。\n\
    \n因为所有的人都会知道，如果我的绩效不好，对我有很大的影响，反过来讲如果我的绩效好，那我就可以有很多好的方面，就会形成越来越好的一個正向循环，所以为了好的绩效，那大家就会有很强的目标感和方向感，当然对自己的要求也会更高。\n\
    \n这也是华为为什么人才选取一定要从 211/985 这些名校来，因为人很重要。因为人选对了很重要，因为我们认为这样学校的学生，大多数对自己的要求是比较高的，愿意上进和进步的动力是比较强的，本身对自我的要求也比较高，也更愿意自我挑战，对自己有更高追求。\n\
    \n事实大家都在想，到底怎么样才能激发员工的积极性和意愿度，积极性和意愿度是比较难培养的，他有天性在里面，如果可以的话，我建议大家从人选上面就先做第一把关，先选对这样的人，在对这样的人去做培养才是更有意义和价值的。如果你一开始人都选错了，你对他花更多的时间培养和教育那都是错的。\n\
    \n当然华为不是所有的人都这么高意愿，这是不可能的。我们都知道，人天生都有惰性。只不过说你在一个组织文化里面，你就很难以惰性，因为你惰性了你就会被淘汰。所以你要不愿意在这个组织里被折磨。我说的折磨有点意思就是被修炼，不断的去进步，要不然你就觉得这个组织不适合你，你就离开，所以这样的人也就不是华为人自然而然离开。\n\
    \n## 绩效结果应用 (2)\n\n在绩效结果可预期但会随条件变化下，绩效结果与工作制度相关联\n\n| 绩效等级 | 干系（有条件） | 人为晋升渠道\
    \ | 任职资格评定 | 本轮考核不/持续发展 | 内部调动 | 外部引入机会 |\n|---|---|---|---|---|---|---|\n| A\
    \ | 有条件，可进入专项通道 | 有条件，可进入专项通道 |  | 无 | 有机会 |  |\n| B+ |  | 有机会 |  |  |  |  |\n\
    | B |  |  |  |  |  |  |\n| C | 没有机会会被淘汰 |  | 没有机会 | 进入人员PIP，考核调整退出 | 没有机会 |  |\n\
    | D | 视情况会被淘汰 |  |  | 不适合干系调整 |  |  |\n\n这是绩效结果的第二个应用，具体的我就不再详细讲了，大家可以自己看，反正通常来讲什么样的绩效结果是有机地配合加薪等，在表格上面列的比较清晰，这些材料都属于相对于公司内部的资料，大家自己用，请不要外发。\n\
    \n最后，跟大家讲一下干部管理，既然大家都知道华为跟外部的差异性很多时候是在管理者的成熟度上面，我觉得与其花很多的时间去研究怎么把考核结果量化 KPI，可能更多的时间不如去思考怎么让你的管理者变得经验更丰富，能力更强，如何去提升管理者的管理能力，以及说华为在人才选拔上面的时候，在干部选拔和干部的通用能力上面主要会关注哪几个点，我想跟大家讲一讲。\n\
    \n## 干部标准通用框架/干部四力\n\n华为的干部通用标准就是人才选拨的从 4 个维度，第一个就是品德，那怎么讲品德，品德不是用来考核的，平时也不会关注，那品德会在什么时候看呢？在管理者有没有出现什么关键事件，比如说贪污了，或者说发生什么不正当的关系等等，或者类似涉及到品德底线问题的时候，不管多优秀，只要你一旦做了这些事情，不好意思，那你就再也没有机会了，这就是不考核，但作为底线要求，这是一个基础，就是你不要去碰红线。\n\
    \n第二个就是核心价值观与使命感，作为一个管理者，你必须能够充分的去理解公司的核心价值观，并且时刻保持着对企业的使命感。这是最基本的能力，如果这条都没有了，那就不用说了，肯定没机会，也不可能担当大任。\n\
    \n真正选拔干部最重要的分水岭是绩效，也就是说干部要会打胜仗，在华为干部选拔的时候，我们一定会优先看绩效的。我们认为那个常胜将军至少说明他在现在这个岗位上，是能挑\
    \ 100 斤，那就他应该可以挑 150 斤甚至 200 斤，那我们就会把他往上提一级，让他到对应的岗位上去锻炼。那上去了是否胜任？判断的依据是在对应考核期的绩效，是否能做出该岗位对应的贡献即绩效。\n\
    \n所以干部选拔分水岭首先是绩效，绩效是证明他在这个岗位上的胜任力是没有问题的，而且是轻车熟路的，然后才可以再往上拔，往上拔上一个职级去做上一层领导，然后再去考核，再看是不是能够挑的起来，只要能够挑起来，就能够继续往上，如果不能，那可能就没有上升机会了。我们认为只有一段成功的经历才叫经验，否则只叫经历。所以能力与经验就是这样作为选拔每一层干部的关键要素。\n\
    \n华为为干部的领导要求最重要的 4 个能力，对基层干部最主要的就是要求他有执行力，对中层要求最重要的是理解力，高层最重要的是决策力。\n\n什么叫基层要执行力？做一个基层管理者，最基本就是能带众做项目。怎么去训练基层管理者？就是做项目，不断的通过一个个项目，通过持续不断的打胜仗来证明你在基层管理者的能力和经验是没有问题的。完成了上升到中层管理者的理解力，那怎么去训练中层管理者？最核心的是让中层管理者轮岗。通过上下游岗位、横向跨部门岗位轮岗，比如研发到测试，再到质量或\
    \ HR，让人才能上能下，能左右这样跨岗位跨职责的去轮岗，通过轮岗，扩大视野，并提升理解力，更好的理解公司岗位上下游、周边跨部门协作关系，提升个人能力与技能的同时，还学会看问题的视角不会只站在自己的角度，视野会更宽，这对很多企业来说要做到轮岗是有难度的。但轮岗对于管理者来讲是很有意义的一件事情。\n\
    \n最后对于高层来讲的话，就是怎么证明一个好的中层，提放到高层以后，是具备决策力呢？首先是会有个试用期，每一个管理者都有一个试用期，然后把高层放到一个可能不太好的区域去做这个区域的提升，比如说这个区域在新高层的打理下能够扭亏为盈，或者说这个组织在高层的管理下，组织氛围由坏变好，又或者说这个组织在高层的打理下，能够挑战承担组织想要实现的目标任务等（比如华为手机业务）。只要做到了，某种程度上就证明你的决策力是没有问题的，你能够承担公司的更高战略目标。总的来讲，华为主要是通过这些方式训练干部的\
    \ 4 个能力。\n\n## 不为钱活，你值得拥有另一种生活\n\n分享者：汤鸣飞，教育行业创业者，内在成长修习者，财富並化践行者。曾在北上深抓地沧海 10\
    \ 年，历经互联网，教育两个行业。现回到西安，和家乡共同成长。擅长资源整合，产品销讲，需求挖掘，成长类培训。陕西家庭教育研究会理事，陕西省牧校长联盟会理事，陕西商教信息协会理事。国家高級理财规划师，高级企业培训师，高级创业指导师，高级生涯规划师，高级家庭教育指导师。半职奶爸，25\
    \ 万公里自驾旅行经历，3000 小时北京龙泉寺志愿服务，10000 小时卡巴金静观冥想践行者，1500 小时正念止语禅修打卡\n\n时间：2021 年 2\
    \ 月\n\n感谢加盐师兄的邀请，我在师兄的知星球里也看到之前邀请了很多关于创业投资管理的一些大咖来分享。今天我很荣幸，其实我并不是一个在创业或者投资非常成功的人，我只是在内在成长这条路上走了蛮多年，希望能够给大家带来一些不一样的观点，不一样的声音。\n\
    \n2016 年我第一次去龙泉寺拜访了贤智法师，贤智法师当时问了我一个问题：鹏飞，你作为志愿者，你来龙泉寺有什么样的目的？我說：工作、创业、生活，我想思考一些人生更高维度的问题，但我又不是一个佛教徒，也不是一个道家或者儒家的忠实粉丝，只是看了一些书，而且我正在北京创业，所以我离这里很近，我就想请教一下您，您觉得对于我们这些青年人有什么建议吗？\n\
    \n贤智法师问我这样一个问题，让我去思考人生到底意义是什么。或许佛家不能够帮你解决所有的问题，但是至少它可能是我内心探索的一条途径。在我等待他回答的时候，贤智法师又问了我这样一个问题。鹏飞你一个月花多少钱？我說我在北京一个月，2万到3万块钱的开销，包括房租，包括我嬷妈，我们两个人的消费，整个一个家庭加起来，他說我觉得你的生活可能面临的一些问题。\n\
    \n我想一个月花2~3万，在北京应该不算是特別夸张，当然也不会特别节省，因为我和我嬷妈比较喜欢去尝试各种各样好玩的东西，基本上我们不会去追求奢侈品，但是我们会参与各种各样的活动，包括去玩射击、户外滑雪、蹦极、当时贤智法师说我们的生活可能遇到了一些问题，我辩解到，其实我们这两年消费才上来。之前我们收入不高的時候，一个月可能花1万块钱，当时也觉得挺幸福的，有一点游戏，有一点找理由。没想到贤智法师告诉我们，其实那个时候你们的生活也很混乱。\n\
    \n如果1万块钱生活也很混乱的话，难道要回到上大学的时候吗？我从西安考到杭州，因为西安的经济环境和经济条件并不好，所以当时我的生活费一个月只有800块钱，那我就强行去辩解。我就问了贤智法师一个问题：难道在北京一个月花3000块钱，才叫符合佛陀的理念吗？\n\
    \n贤智法师说，不管是花3万块钱，1万块钱，还是3000块钱，都不是佛陀的理念。如果你作为志愿者，我不想给你普及更更多的佛法，我希望通过这个问题去启发你，人生到底什么是最重要的？到底和钱关系有多大？当你花3万的时候，花1万的时候，或者花3000的时候，你会对幸福、快乐有不同的看法吗？你会对人生的价值有不同的看法吗？当时我没有什么想法，因为那是我第一次去龙泉寺，但是它给我的人生埋下了一个伏笔。在我之后的创业生活中，我一直去思考这个问题。\n\
    \n2018年，我们的创业达到了第一个小的目标，然后团队一起去云南做了一次长时间的团建。我们在云南呆了10天时间，我记得很清楚，因为我自已非常喜欢从泰国、缅甸、越南、还有云南的西双版纳都在搞的泼水节。我每年都想去云南玩，但是那一年是和同事一起去，我记得很清楚，那天晚上喝了点酒，然后就一个人来到西双版纳的野象谷的丛林边，因为我们当时住在野象谷附近。有一个很神奇的事情在那天晚上发生了。\n\
    \n所有的同事都没有陪着我。我一个人到野象谷旁边，住在那个小木屋里。这是我人生第一次遇到一条“蟒蛇”，我以为是“蟒蛇”。后来村民告诉我们这个东西其实是带毒的，在云南、缅甸交界的地方才会有。很神奇，我就无缘无故的被咬了一口，我眼睁睁看着它扑了上来，咬到我的中指，就像电影里演的那样，你看到它，却无能为力。然后我就断片了。\n\
    \n当我醒来的时候，我躺在医院里。我竖住医生，我说我头很疼，是不是这个蛇有毒？大夫非常惊讶的告诉我，你的血里头好像带一种解毒的元素。\n\n这种蛇三年前也咬过一个游客，但那个游客当时就中毒身亡了。他问我之前吃过什么，蛇胆或者和蛇血清相关的中药。我印象里好像就是一个礼拜前，因为北京的温差比较大，我感冒了，喝了一些双黄连，大夫偷偷的笑了。\n\
    \n那天晚上醒来后，我一夜没睡。当你经历过从恐惧到惶恐，再到“生离死别”，再战胜回到人间。这个过程绝不是电影里演的，它没有什么值得回味，也没有什么精彩。你只是会不断赞叹生命的奇迹，但是又有一丝无奈。你好像穿越了一个很漫长很漫长的生死隧道，这种感觉必然会让你静静的思考：为什么要成功？为什么要挣钱？为什么要活着？\n\
    \n吊诡的是我们刚刚完成第一个创业小目标，我觉得人生即将奔向一种新的高度。我们攒下买房的钱，然后遇到了这么一件事。有时候我会觉得人生确实挺有意思，在很多特殊的时间点，出现特别地让人无法理解的，但又很怀孕的事，它会刺激着你不断思考人生的意义。\n\
    \n2019年我们做了一个公益项目，把西安周边的农村孩子，包括留守儿童，残疾儿童，单亲家庭的孩子等和北京家庭条件不错的孩子交换角色。我们没有香港节目中上层家庭和下层家庭的角色互换这么严肃，就是希望把北京的孩子带到西安周边的农村来体验一下生活，把西安儿童村以及周围一些贫困地区的孩子带到北京去，参观小米，参观百度，爬长城等。\n\
    \n我带着西安周边的这些农村的孩子去北京的时候，你能看到他们眼神的渴望，那种对世界的好奇心，想要学习的冲动，非常真实。每一个孩子都会赞叹北京发展的速度，都会觉得人生是很希望的。当他们在山里、在村里的时候，他们其实是被压抑的。我看过一些书，考了很多跟教育相关的证，但都不能给我带来这种启示。书、课程、自媒体都会告诉我，人是分阶层的，但那一天我感受到了很不一样的东西。\n\
    \n当我带着这些西北的孩子在国家图书馆，带着他们去爬长城、去百度参观，他们会对未来充满了想象，那种想象和电视采访北京的中产家庭的孩子是一样的，他们也想到国外去争光，也会向往北京的工作环境。孩子们好像一瞬间就产生了一种从来都没有的灵感，高度。\n\
    \n可能我们所知的关于人生成长，人生发展是和父母的起点有关，和格局有关，和眼界有关。或许是对的，但至少在那一刻，我不这么认为，我会觉得其实人生有许多不一样的东西，它能够突破这些条条框框。\n\
    \n2020 年我和她妈迎来人生中最大的礼物，我们的女儿出生。因为疫情，前半年基本上都在家，女儿没有见过世面，也没有和别的小孩子交流，更没有去其他地方游玩。你会发现她有很多情绪要表达，但被压抑住了。她有很多想法没有地方去释放，因为环境太单一了，她的创造力、与生俱来的活力都被压制住了。\n\
    \n七八月疫情稍好一些，我们带着她到处去玩、爬山、油湖、去朋友家做客，你会发现哪里有什么都稀罕宝宝，什么内向宝宝。人生从生下来开始就充满着张力，就充满着无限可能。因为她没有体验过这些，被压抑住了。\n\
    \n她上半年一句话都不说，连声音都不愿意发，可下半年这几个月，整个人都改变了。我以前做教育、考证，做咨询，各种理论都告诉我们，人的性格是先天的，但实际案例告诉你，人有无限的可能。\n\
    \n前前后后这些事情串起来，它不得不让我去反思：到成人为什么活着？人的价值是什么？人的意义是什么？它比我创业、工作、挣钱、买房、理财，要重要得多，至少它带给我的感觉是感受无\
    \ 精彩。我觉得这可能是我们所有人都应该去思考的一个问题。\n\n2015 年夏天，我相信除去那些极少数财富自由，通过股票实现人生理想的人，大部分散户和我的心情应该差不多。我们做着冲上\
    \ 8000 点、冲上 1 万点的梦，但是它停止在 5100 多点。那个夏天北京的心理医生根本就约不上，不过有缘，我和武志红老师做了 7 次一对一交流，真的好贵，我记得当时刷的信用卡。整个咨询我都在和武志红老师探索一个问题：既然我损失了，我这么痛苦，那我得到的时候为什么没有这么幸福，没有这么快乐呢？\n\
    \n这其实是心理学一个很基本的问题，因为我没有心理学的背景。做咨询的时候，我就是想不明白，我知道人是厌恶损失的，但损失的感觉真的太难受了。如果我通过炒股或者打工，创业挣了一个\
    \ 100 万，开心了两天。但我赔掉了 100 万，或者客户欠了你 100 万，我会痛苦几个月，而且每天都很难过。武志红老师告诉我是人生常态，那既然它是常态，我为什么要去追求那两天的快乐呢？人生本来就是平衡的，你在这里得到，必然在另一个地方释放。\n\
    \n15 年-16 年我相继拜访了刘明老师、陈晓东老师、武志红老师、李忠堂老师，卡巴金在中国有两个传人，从格式塔、精神分析、NLP、萨提亚到积极心理学，花了不少钱，但是学了一圈，其实你没有找到什么人生的价值，也没有什么人生的意义可以让你有特别明晰的理解。我只想明白了一点：你会一直去思考这件事情。\n\
    \n思考本身，它可能就是人生的意义。你不断思考：你为什么活着，为什么快乐？它伴随着我后面 5 年的经历，也伴随着我一次又一次去龙泉寺做志愿者，每一次都是一个月，最长一次做了三个月。\n\
    \n2018 年开始，我去学习卡巴金的正念冥想。因为做志愿者一年你才有一次机会，龙泉寺可不是你想去就能去的，但是正面冥想每天都可以做。它的很多理论，很简单，回到当下专注当下，但是它能帮助我们收心，收情绪，收念头，它也在刺激着我们去不断反思、觉察。\n\
    \n你活着本身就是意义！你活着本身就是意义！\n当你反过来再去看这些问题的时候，突然间会发现诗和远方，真的是诗和远方，不是网上的说的，去了一地鸡毛，回来继续焦虑。爱旅游，爱创造，真的很幸福，也不是网上的说的，旅游没什么意义，创造只是在楼伤而已。当你回到正念的状态，回到当下，回到此刻，就是这一片刻的感觉和感受。创业本身其实一点都不累，因为根本就没有\
    \ 996，根本就没有客户的烦恼，这个是真的。有的时候确实会觉得内心成长这条路找了一大圈，最后发现其实此时此刻生动的生活就进行了。\n\n我们都是教育的失败品。为什么这么说？我做了\
    \ 6 年教育，咨询了 600 多个大学生个案，讲的大课，大学生的、高中的，从生涯规划到职业规划，心理的、健康减压的，有几百场。你会发现所有人脑子里的问題都是一样的。因为我们的教育本身出了问题，但是今天我们不深入探讨教育细节的东西，我们要去反思教育带来的问题。它让我们整个人生根本不知道为什么而忙，为什么而活？因为为什么快乐？因为为什么幸福？所以要回到内心。回到那些此刻的感觉。\n\
    \n我不喜欢很多人，打着吸引力法则或者帮你成功的方式，去践踏心理学。我也不喜欢很多人用传统文化的条条框框告诉我们应该怎么做。我们本身活着，全然的活着，放松的活着，自在的活着，专注的活着，真的就很快乐。你要问我多长时间能形成这个习惯？8\
    \ 个星期就可以 了。按照卡巴金正念冥想的\n"
