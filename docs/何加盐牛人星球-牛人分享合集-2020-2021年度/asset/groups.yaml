    所以我再讲这个故事，就是个找气球的故事，给予他他想要的就会得到你想要的：


    在寻求福气的引导会上，有50个人报名参加。50个人走进一个装满气球的教室。主持人提出一个非常奇怪的要求，给每人一个气球，要求大家在气球上用笔写上自己的名字。接着他将所有的气球收集起来放到另外一个房间。然后带大家到那个房间去，要每个人分别找到写上自己名字的气球，限时5分钟。


    于是每个人就开始疯狂地寻找自己的名字，大家碰来碰去。现场一片混乱，5分钟过去了，很少有人能在规定的时间内找到写了自己名字的气球，主持人突然喊停。接下来主持人要求大家随便抛这个气球，然后把这个气球递给气球上面名字对应的人，不到三分钟，大家都接到自己的气球了。于是主持人指出，这是我们的人生！


    每个人都在<|start|>狂寻找自己想要的东西，但是没人知道它在哪里。最有效快捷的方法就是给予他人想要的，你就会得到你想要的，对不对？


    所以如果你在这个社会上，不管你是个人职业经理人也好，还是一个老板也好，还是销售人员也好，嗯怕你是医生，是个专业人士也好。你除了要靠专业吃饭外，你真的要想，你能够给别人想要的东西是什么？当你能给别人想要的东西，别人就会给你想要的东西。这是一个中国非常古老的智慧，叫做得。舍得，小舍小得，不舍不得，大舍大得。


    我介绍何老师给柔柔的老板，你说我从中得到什么好处？没有得到什么好处，就是交个朋友，这就是最大的好处，就是何老师这个朋友。所以他今天才给我这个机会来跟大家分享。那这样，我认为这种机会是非常难能可贵的，我也很珍惜跟大家分享，也很愿意跟大家讲我的一些真实想法和心得。


    刚才讲了第2点了，下面讲第3点。我们要在社会上混到出人头地的第3点，就是要长远的关系。


    长远的关系，这句话内涵还是非常大的，包括跟你的孩子的关係，跟你的妻子的关係，跟你的家人的关係，还跟你同事的关係。


    我刚毕业的时候，在保险公司的表现是非常普通的。那时候22岁来到广州，26岁开始做保险，在广州是一穷二白，也不仅仅认识什么人。


    我这个人，嗯怕到现在为止，你如果你见到我的面，你会发现我是个很内向的一个人，不是很外向的。但我有一个特别大的特点，就是刚跟别人认识的时候，别人觉得我这个人其貌不扬，好象也不是很聪明，但是我愿意跟别人建立一种长远的关系。这一点跟大家分享一下我的一些经历，可能大家就会更有感受一些。


    在广州做了两年三年保险之后，当时只能说养活自己吧。这2000年左右我去参加一个培训班，在这个班一下子认识到三十多个成功的企业家。


    你看我也是又很穷，又不自信，因为在这帮老板的眼中我是一个外地来的小伙子，一穷二白，又不够自信，都是重点大学毕业，在他们面前真的是觉得自己很卑微。当时有这种感觉，但我一直跟这些老板保持联系，所以很多老板就成为了我的客户，包括刚才提到那个老板。也是我在（他不是我同班同学）跟着老师去参加他们一个更大的同学会，接著我成为那个同学会的理事。然后又跟着冯老师去了清泰公司去参观，然后就是一旦认识他之后，我就跟他保持了一种联系的。


    同班的其他老板，我从来没有刻意去推销保险，但至<|message|>已经接近 1/3 的人成为了我的客户了。我觉得在这点我就是特别的擅长。有很多人参加短训班之后，过了两三天他就不再联系了，包括这两年我去中大岭南学院，学《领军人才班》。大家觉得我做保险的人过去好像有目的，好像推销保险，其实你说没目的吗？也有，但也不是那么直接。因为现在我们在做团队管理并没有说一定要有很大的什么压力去卖保险，我们就是随缘的心态。


