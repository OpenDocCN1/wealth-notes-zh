    中心公布的贷款市场报价利率（LPR）的四倍，不超过法定的利率标准，合法、有效，故此时应按全国银行间拆借中心公布的贷款市场报价利率（LPR）的四倍计算逾期利息。即，借条样式4与借条样式5中的逾期利率是不同的。概括地说，就是：


    1）未约定借期内利息+逾期利息约定不明确——>按全国银行间拆借中心公布的贷款市场报价利率（LPR）计算逾期利息；

    2）未约定借期内利息+约定的逾期利率不超过全国银行间拆借中心公布的贷款市场报价利率（LPR）的四倍——>按约定逾期利率计算逾期利息；


    ## 问题5：借款双方对借期内利息约定不明确，是否可以主张借期内的利息？应按多少计算？


    借条样式6：现张三（借款人）因购买轿车资金不足，向李四（出借人）借到人民币100000.00元整（大写：拾万元）。张三应在2019年12月31日前一次性还本付息。


    借条样式7：现北京天地人和房地产有限公司（借款人）因资金周转不足，向李四（出借人）借到人民币1000000.00元整（大写：壹佰万元）。北京天地人和房地产有限公司应在2019年12月31日前一次性还本付息。


    答：双方对借款期内利息约定不明确，借期内的利息应根据借款主体来确定。如果借款主体是自然人之间，则视为无息借款；如果借款主体有一方不是自然人，则视为有息借款。利息要综合考虑民间借贷合同的内容，并根据当地或者当事人的交易方式、交易习惯、市场利率等因素。因此，借条样式6中，应视为无息借款。借条样式7中，视为有息借款。


    提示：自然人之间借款，没约定利息或约定不明的，视为无息借款。除自然人之外的借款，无论是否约定利息，均可视为有息借款。


    ## 问题6：借款双方对借期内利息约定不明确，是否可以主张逾期利息？


    借条样式8：现张三（借款人）因购买轿车资金不足，向李四（出借人）借到人民币100000.00元整（大写：拾万元）。张三应在2019年12月31日前一次性还本付息。实际情况是，在2019年12月31日前，张三并未依约偿还借款。在2020年8月30日，张三才还清借款。那么李四能否主张2020年1月1日至2020年8月30日期间的逾期利息？利率应按多少计算呢？


    借条样式9：现北京天地人和房地产有限公司（借款人）因资金周转不足，向李四（出借人）借到人民币1000000.00元整（大写：壹佰万元）。北京天地人和房地产有限公司应于2019年12月31日前一次性还本付息。实际情况是，在2019年12月31日前，北京天地人和房地产有限公司并未依约偿还借款。在2020年8月30日，北京天地人和房地产有限公司才还清借款。那么李四能否主张2020年1月1日至2020年8月30日期间的逾期利息？利息应按多少计算呢？


    答：可以主张逾期利息。借条样式8中，因张三和李四对约定借期内利率约定不明确，视为无息借贷。故，其逾期利息可参照问题4主张。借条样式9中，北京天地人和房地产有限公司与李四对借款期内利率约定明确，但因属于非自然人之间的借贷，应视为有息借贷。故，逾期利息应按最终确定的约定借期内的利率计算。


    提示：借条对借期内利息约定不明确，主张逾期利息时要根据借款主体确定。


    ## 问题7：借条中同时约定逾期利率、违约金、律师费或者其他费用，如何处理？


    答：同时约定逾期利率、违约金、律师费或其他费用的，出借人既可以选择性主张，也可同时主张，但总计不得超过全国银行间拆借中心公布的贷款市场报价利率（LPR）的四倍。


    问题8：双方没约定利息，借款人支付利息后反悔，如何处理？

    答：双方没有约定利息但借款人自愿支付，又要求出借人返还的，除损害国家、集体和第三人利益情形外，法院不予支持。


    ## 三、公司业务


    ### 1. 一人有限责任公司的法律责任和风险规避


    ## 问题1：一人有限责任公司的性质和法律责任是什么？


    一人有限责任公司，是指只有一个自然人股东或者一个法人股东的有限责任公司，是有限责任公司的一种特殊类型。《中华人民共和国公司法》第六十三条规定：“一人有限责任公司的股东不能证明公司财产独立于股东自己的财产的，应当对公司债务承担连带责任”。该条款是对一人有限责任公司财产混同情形下举证责任倒置的规定，目的在于解决一人有限责任公司债权人举证责任困难的问题。也正因此，在审判程序或执行程序中，债权人为实现利益最大化和保护最大化，往往直接追加一人有限责任公司股东为被告或被执行人，让其对公司的债务承担连带责任。


    该类规则的合理性在于，一人有限责任公司只有一个股东，股东意志决定着公司意志。该特殊的组织形式缺少多股东有限责任公司中股东相互制约的机制，天然地存在人格混同风险，股东极容易利用控制公司的便利恶意混同公司财产和个人财产，利用公司独立人格和有限责任规避债务，损害债权人利益。


    因此，法律预设一人有限责任公司的股东财产与公司财产本身就是混同的，除非股东能够证明两者之间相互独立，否则股东就应当承担公司债务。


    故，债权人以一人有限责任公司存在财产混同为由起诉要求股东对公司债务承担连带责任的，实行举证责任倒置，债权人无需承担的财产混同证明责任，由股东对其个人财产与公司财产之间不存在混同承担举证责任。


    ## 问题2：作为一人有限责任公司股东，如何规避公司债务给股东个人带来的不利后果？


    作为一人有限责任公司股东，在公司人格否认诉讼中，可以从以下几个方面进行举证，主动提供证据证明不存在财产混同情况，防范对公司债务承担连带责任的风险：


    ### （一）可先行提交公司年度财务会计报告及审计报告。


    根据《中华人民共和国公司法》第六十二条规定：“一人有限责任公司应当在每一会计年度终了时编制财务会计报告，并经会计师事务所审计。”可知，公司应当进行正常的年度审计，年度审计报告应客观公正地反映公司的财务状况。通过提交年度审计报告，可证明公司已履行年度法定审计义务，证明公司财产与股东财产相互独立，完成了初步举证义务。在无法提供年度审计报告的情况下，则可提供完整的会计账册，说明股东与公司之间不存在资金往来，或虽存在资金往来，但资金往来情况不影响公司财产与股东财产的独立性；


    ### （二）在提交年度审计报告后，如法官仍对公司财产与股东财产的独立性存疑，可根据法官的释明进一步提交公司的财务账册（如原始记账凭证、银行明细和转账凭证、账册等资料）等证据予以补充。或根据实际情况提交股东财产与公司财产独立的专项审计报告，专项审计报告应对股东及公司资金往来的合理性及真实性予以确认。


    （三）除上述证据外，股东也可通过人员、业务、场所等股东与公司相互独立以加强财产独立的证明。


    ### 2、分公司和总公司、子公司和母公司的区别解析


    ## 问题1：总公司与分公司


    ### 1、概念

    总公司管理分公司，对所属分公司在生产经营、资金调度、人事管理等方面行使指挥、管理、监督的权利，具有法人资格，可以独立承担民事责任。分公司是与总公司相对应的法律概念，是指在业务、资金、人事等方面受总公司管理，不具有法人资格的分支机构。分公司在法律、经济上没有独立性，属于总公司的附属机构。


    ### 2、联系与区别

    - （1）分公司没有自己的独立财产，其实际占有、使用的财产是总公司财产的一部分，列入总公司的资产负债表。

    - （2）分公司不具有法人资格，不独立承担民事责任。

    - （3）分公司的设立程序与一般意义上的公司设立程序不同，设立分公司只需办理简单的登记和开业手续。

    - （4）分公司没有自己的公司章程，没有董事会等公司经营决策机构。

    - （5）分公司名称为总公司名称后加分公司字样，其名称中虽有公司字样，但不是真正意义上的公司。


    ## 问题2：母公司与子公司


    ### 1、概念

    母公司是指拥有另一个公司一定比例以上的股份或通过协议方式能够对另一个公司实行实际控制的公司，具有法人资格，可以独立承担民事责任。子公司是与母公司相对应的法律概念，是指一定比例以上的股份被另一个公司持有或通过协议方式受到另一个公司实际控制的公司。子公司具有法人资格，可以独立承担民事责任。


    ### 2、联系与区别

    - （1）子公司受母公司的实际控制。

    母公司对子公司的重大事项拥有实际决定权，能够决定子公司董事会的组成，可以直接行使权力任命董事会董事。


    - （2）母公司与子公司之间的关系基于股份的占有或控制协议而产生。

    一般来说，拥有股份多的股东对公司事务具有更大的决定权。因此，一个公司如果拥有了另一个公司50%以上的股份，就能够对该公司实行实际控制。在实践中，大多数公司的股份较为分散，因此，只要拥有一定比例以上的股份就能取得控制地位。除控制股份之外，通过订立某些特殊契约或协议，也可以使某一个公司控制另一个公司。


    - （3）母公司、子公司各为独立的法人。

    子公司虽然处于受母公司实际控制的地位，在许多方面受到母公司的制约和管理，有的甚至实际上类似于母公司的分支机构，但在法律上，子公司属于独立的法人，以自己的名义从事经营活动，独立承担民事责任。


    子公司有自己的公司章程，有董事会等公司经营决策机构。子公司有自己的独立财产，其实际占有、使用财产属于子公司，有自己的资产负债表。子公司和母公司各以自己全部财产为限承担各自的责任，互不连带。母公司作为子公司的最大股东，仅以其对子公司的出资额为限对子公司在经营活动中的债务承担责任。设立子公司必须严格按照设立公司的要求提出申请，依法取得营业执照、办理相关手续后方可营业。


    ## 问题3：子公司与分公司


    - 1、设立方式不同

    子公司由公司股东按照《公司法》的规定设立，应当符合《公司法》对公司设立条件和投资方式的要求。分公司由总公司在其住所地之外向当地工商机关申请设立。属于设立公司分支机构。


    - 2、法律地位不同

    子公司是独立的法人、具有法人资格、拥有独立的名称、公司章程和组织机构，对外以自己的名义从事经营活动。分公司不具有法人资格，没有独立的名称、公司章程和组织机构，以总公司分支机构的名义从事经营活动。


    - 3、受控制方式不同

    母公司对子公司一般不直接控制，而是通过任免子公司董事会社成员、作出投资决策等方式影响子公司的生产经营活动。分公司的人事、业务、财产受总公司的直接控制，在总公司的经营范围内从事经营活动。


    - 4、承担债务责任方式不同

    子公司作为独立的法人，以子公司的全部财产为限对其债务承担责任。分公司由于没有自己独立的财产，与总公司在财务上统一核算，因此，其经营债务由总公司负责清偿，即总公司以其全部财产为限对分公司在经营活动中的债务承担责任。


    - 5、领取的营业执照不同

    子公司领取的是企业法人营业执照，有法定代表人姓名字样。分公司领取的是营业执照，有负责人字样。


    - 6、产品包装标注不同

    子公司在产品外包装上必须标注自己的名称和住所。分公司可以标注自己的名称、住所，也可以同时标注总公司的名称、住所，还可以只标注总公司的名称、住所。


    ### 3、公司盖章、法定代表人签字时应注意的要点


    - ①、需要在法律文件上签字的，最好按照同期惯常的书写方式完成签名，而不要刻意书写正楷等字体。如担心签名字体不清楚，可先打印或书写正常姓名，再正常签字。

    - ②、法定代表人签名时，应签署法定姓名，并应签署全名。法律并未禁止当事人签名时使用简称，也未禁止使用曾用名、艺名、笔名、化名、小名或绰号以及画押、画圈等签名，但这些签名方式可能增加发生争议时的举证难度。

    - ③、重要的合同尽量面签。面签时也要注意签字的对应关系。

    - ④、企业法定代表人或负责人有权在合同上签字；持有有效委托证明文件的委托代理人、直接相关的职务代理人也可签字。根据《合同法》第49条之规定，“表现代理人”的签字虽然缺乏正当性，但亦可能发生有权代理的后果。

    - ⑤、代理人应签署自己的姓名，但应注明被代理人是谁。

    - ⑥、签约时间应写到具体日期，即注明年月日。多 人签字时，最好签章时间相同。如果不同，应以最后签章时间作为合同成立时间。

    - ⑦、正式文件签章宜使用钢笔或签字笔，不宜使用铅笔。

    - ⑧、在签字盖章之前，应注明“以下为合同签署栏”或“以下不正文”，且不要预留太多空白。

    - ⑨、公司法定代表人代表公司行使职权，其在合同上签字的行为代表公司的意思表示，并不要求再加盖公司公章而使合同成立。公章是公司行为的主要证明，法定代表人的亲笔签名并非公司行为的法定要件。合同约定经双方签字、盖章后生效，则有权主体的签字或加盖公司有效印章均可使合同生效，而无需同时具备签字和盖章。建议，法人代表签字和加盖公司印章尽量都不要缺少。

    - ⑩、法律文件盖章时，要区别公章、合同专用章、财务专用章等印章类型。

    - 11、使用电子签章需事先约定，并在法律允许的范围内使用。请注意确定电子签章的可靠性。

    - 12、加盖印章时，请记得加盖骑缝章。

    - 13、公司加盖印章，一般意味着做出意思表示或对事实的确认，也可能意味着放弃权利之类的意义。

    - 14、未签字盖章，合同不成立。履约事实虽可补正合同签字盖章的瑕疵，但会增加当事人的举证难度。

    - 15、加盖公司印章，即使违反印章管理规章或者未经股东会决议等程序，一般也不会影响印章应有的法律效力。

    - 16、个人伪造公司印章，通常不会对公司发生效力，但在构成表见代表或表见代理应例外的，表见代表或表见代理制度对于交易安全的保护，仅适用于善意的相对人。

    - 17、公司分支机构的工作人员，经分支机构负责人授权，对外代表分支机构实施民事行为，应认定为该分支机构的民事行为。

    - 18、项目部对外借款，一般由公司承担责任；但是，在特定的个案中，可能根据项目部印章类型、相对人是否知晓质用资质情况、公司是否参与或知晓借款等因素，得出不同的结论。

    - 19、公司印章应按照法律规定，在当地公安机关指定的刻章单位刻制。未按规定刻制的印章，经企业确认或使用，亦可发生效力。

    - 20、企业尚未正式成立，经发起人股东授权刻制的印章具有法律效力，相关法律责任由成立后的企业承担。

    - 21、公司印章归公司所有，由相关工作人员根据公司授权保管使用。公司使用多枚印章，或者使用作废的印章，均不能单纯以此为由否定公章的效力。

    - 22、公司印章使用违反章程或公司管理规定，并不影响公章对外的效力，但相对人知晓或恶意的除外。故印章管理人员的审慎确定及管理规定的严格执行非常重要。

    - 23、加盖印章的空白合同等资料，可能构成法律意义上的授权证明，故原则上不能提前加盖印章于空白处。

    - 24、他人私刻单位印章实施经济犯罪行为的，单位有印章管理不当等过错的应当承担赔偿责任。

    - 25、借用人违反承诺或协议使用印章，基于该承诺或协议效力的相对性，出借单位可能须对外承担责任。

    - 26、在公司委托经营、承包经营等情形下，更应做好公司印章的管理。即便受托人或承包人违反内部约定，但基于其掌握印章的事实，仍然可能被认定为表见代理人。合同效力仅具相对性，即使受托人或承包人违反关于印章使用的内部约定，公司仍应对其的代理行为承担责任。内部约定不能对抗印章本身所具有的证明公司行为的效力。


    ## 四、《民法典》中关于继承方面的规定变化


    - 1. 新增了关于打印遗嘱和录像遗嘱的遗嘱类型的规定。

    《民法典·继承编》第一千一百三十六条规定，打印遗嘱应当有两个以上见证人在场见证。遗嘱人和见证人应当在遗嘱每一页签名，注明年、月、日。《民法典·继承编》第一千一百三十七条规定，以录音录像形式立的遗嘱，应当有两个以上见证人在场见证。遗嘱人和见证人应当在录音录像中记录其姓名或者肖像，以及年、月、日。这些遗嘱形式的增加，适应时代发展，与人民生活习惯相吻合，方便了自然人立遗嘱，降低了立遗嘱的成本。


    例如：某甲习惯于电脑打字。甲在电脑上用文稿打出一份遗嘱，打印出来后，请律师乙和没有法律上利害关系的邻居丙作为遗嘱见证人来到家中，甲表明打印出来的遗嘱是自己真实的意思表示。甲当着乙和丙的面，在遗嘱的每一页都现场亲自笔签署了自己的名字，注明年月日。见证人乙和丙全程在场，并在遗嘱上逐页签字。一份打印遗嘱就完成了。


    如果设立录像遗嘱就需要有摄像设备，还需要找到两名以上的遗嘱见证人参与见证才能设立录像遗嘱。录像遗嘱不需要书写，但需要让遗嘱人在录像中亲自表达所立遗嘱的内容。对因疾病、残疾、文化程度影响而书写有困难的立遗嘱人而言，是非常方便的。


    录像遗嘱直接记录立遗嘱的过程，并与见证人的见证行为一起确保遗嘱的真实性。在录像中，见证人和遗嘱人必须出镜，必须明确说出立遗嘱的录制时间，甚至可以拿着当天的报纸，通过报纸上的日期增加立遗嘱时间的证明力。录像遗嘱制作完成后其原始载体应当妥善保存，原则上应当封存起来。


    - 2、删除了公证遗嘱效力优先的规定，更有利于贯彻遗嘱自由原则。

    《民法典·继承编》第一千一百四十二条第一款规定，遗嘱人可以撤回、变更自己所立的遗嘱。并且新增加了第二款规定：立遗嘱后，遗嘱人实施与遗嘱内容相反的民事法律行为的，视为对遗嘱相关内容的撤回。


    该款规定的增加，是为了对立遗嘱人对遗嘱的变更做出有效的指示，同时改变了其他遗嘱形式不能变更或撤回公证遗嘱的以往做法，本条删除了原《继承法》中的“自书、代书、录音、口头遗嘱，不得撤销、变更公证遗嘱”的规定。实现了遗嘱形式上的平等性，降低了遗嘱变更和撤回的成本，进一步保障了遗嘱自由。如果某自然人立有数份遗嘱，内容相互冲突的，以最后的遗嘱为准。


    - 3、增加规定了兄弟姐妹的子女可以是代位继承人，避免遗产无人继承


    - 4、新增则规定了遗产管理人制度，对于遗产管理人的产生、指定、职责、民事责任和报酬进行了规定。

    《民法典·继承编》第一千一百四十五条规定，继承开始后，遗嘱执行人为遗产管理人；没有遗嘱执行人的，继承人应当及时推选遗产管理人；继承人未推选的，由继承人共同担任遗产管理人；没有继承人或者继承人均放弃继承的，由被继承人生前住所地的民政部门或者村民委员会担任遗产管理人。关于遗产管理人的选任有争议时的纠纷处理，《民法典·继承编》第一千一百四十六条规定，对遗产管理人的确定有争议的，利害关系人可以向人民法院申请指定遗产管理人。


    《民法典·继承编》第一千一百四十七条规定，遗产管理人应当履行下列职责：

    - （一）清理遗产并制作遗产清单；

    - （二）向继承人报告遗产情况；

    - （三）采取必要措施防止遗产毁损、灭失；

    - （四）处置被继承人的债务债权；

    - （五）按照遗嘱或者依照法律规定分配遗产；

    - （六）实施与管理遗产有关的其它必要行为。


    遗产管理人作为一种受托人，需要承担受托人的勤勉、谨慎、忠实、诚信方面的义务。如果违反以上义务或者违反遗产管理人的职责而有可归责事由的，在《民法典·继承编》第一千一百四十八条中也做了承担法律责任的后果性规定，即：遗产管理人应当依法履行职责，因故意或者重大过失造成继承人、受遗赠人、债权人损害的，应当承担民事责任。另外，《民法典·继承编》第一千一百四十九条还规定了遗产管理人获得报酬的权利，该条规定，遗产管理人可以依照法律规定或者按照约定获得报酬。


    - 5. 注重对缺乏劳动能力又没有生活来源的继承人等弱势民事主体的保护

    《民法典·继承编》的法律规定充分体现对弱势群体的保护，如胎儿的保留份额制度、双缺乏继承人应继承份额确定规则、遗嘱继承中必留份额制度、遗产分割的保留份额制度、被扶养人的遗产份额请求权。《民法典·继承编》第一千一百五十五条规定，遗产分割时，应当保留胎儿的继承份额。胎儿娩出时是死体的，保留的份额按照法定继承办理。

