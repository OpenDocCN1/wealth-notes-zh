  - '[PAGE 108]


    第一点，就是一个健康的身体。你再挣钱，再成功，再出差，结果有一天 over，有什么意义呢？对家庭造成一个非常大的伤害。就像我曾经跟碧桂园讲过课，这家公司非常强性。当时在
    5、6 年前，碧桂园的一个营销总监请我去讲课，给他们讲销售。那个总监才 38 岁，后来我们也是微信好友，结果后来他就是因为工作太累猝死了。那我觉得这种真的是不值得，一定要保持一个健康的身体。那健康身体跟什么有关系，其实跟
    4 点因素有关系，这个我虽然不是养生专家也提一下，一个是要有很好的心态，也有很好的心态，要开心要快乐。


    第 2 个，正常的睡眠，就不要天天熬夜。当然有些 IT 公司，有些高科技公司容易去熬夜。我觉得这也是很危险的。第 3 个，不要暴饮暴食，狂吃狂喝，整天喝酒应酬，我觉得这对身体也是很大的伤害；第
    4 个，适当的运动；第 5 可能才提到一些保健品。我把保健品放在第 5 位，我认为前 4 个是最重要的，就是你要良好的心态，要充足的睡眠，不要暴饮暴食再加上那个适度的运动。我每周都跑步去跑，每次十公里，每周跑三次左右。3^4
