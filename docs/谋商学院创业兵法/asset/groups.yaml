    假如你去很多动物园看，活鸡喂老虎和狮子的表演。你就可以体会一下老虎“气吞天下”的强者霸气与血腥残忍的场面，然后，临走的时候，回头凝望老虎，与它惺惺相惜，与它识英雄重英雄的喃喃自语：“这就是强者的天下，也是大自然的游戏规则，成王败寇，弱者不应该有任何怨言。”因为，老虎与狮子贵为百兽之王，也被我们人类征服，成为盘中餐或者玩物。


