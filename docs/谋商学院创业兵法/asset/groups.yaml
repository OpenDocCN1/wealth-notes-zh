    了 现在一个社会恶果。


    这些案例跟我们做企业的关系实际是非常大的。比如，我们在企业里，一定要对一些立小功的人奖励，那么才有人愿意不断的立功来 争取更多的奖励。如果我们对小功不奖励，那么最后就没有人积极的
    争取立功了。我们不但要奖励立小功的，还要宣传立小功的，让企业， 团队里的每一个人都有这个意识，只要我做出了成绩，就一定会受到 奖励。企图靠员工境界高，不给利益也干活的老板是糊涂老板。员工立功，给了奖励，升了官，不宣传的老板，是管理能力有缺陷的老板。


    只有告诉大家，干得好的，立了功的，都有奖励，都能升官，大家才会热火朝天的给你干。有一种老板，只知道对员工提道德境界的要求，不给员工实际奖励，企图让员工拼命给他干。这样的老板，就是脑子
    进水的老板。是违背人性的，这样的老板在这个社会还不少。


    所以大家记住：奖励小功，则大功立，小功不奖，大功不立。


    # 哪些员工是合格的，哪些员工是不合格的


    其实当员工也必须与时俱进，老思想的员工应该被淘汰，如果不淘汰这些员工，那么企业就会被淘汰，每一个历史时期，所用员工的标准，都有所变化。


    公司里总有一些人经常闲着无事可干，老板走过去询问原因，他就说：“您安排的事情做完了，没事啦。”这样的人每个公司都是存在。他们认为，做完老板安排的事情就很不错了。然而，在现代化企业里，虽然听命行事相当重要，但是个人主动进取的精神更重要。'
  - '[PAGE 207]


    因为在市场经济时代，昔日那种“听命行事”的员工已经失去竞争优势了，你不努力工作，有的是人没日没夜的干活，比如阿里巴巴 腾讯这些公司，真的就是晚上也在工作。这些企业非常优秀，是因为
    有一帮拼命的员工。


    我们当老板的，必须把员工调教到这种程度，如果一个员工不能 为企业带来利益，那么必须开除。


    今天企业需要的是那种不必老板交代，就自动自发去工作的人。


    有两种人注定一事无成，一种是除非别人要他去做，否则绝不会主动做事的人；这种员工招聘进公司了，经过一段时间的培训与改造，依旧不改变，应该开除，其实真正聪明的老板是直接不招聘这样的人
    进公司，不培训，因为培训也是成本；另外一种人则是即使别人要他做，他也做不好事情的人，这种人通常是做事不上心的人。哪些不需要别人催促，就会主动去做应该做的事，而且不会半途而废的人必定成功，这种人懂得要求自己多努力一点多付出一点，而且比别人预期的还要多，这是我们要的员工。


    很多老板讲，这样的员工难找，确实是，我刚开始创业的时候，因为员工不好找，我刚开始的高标准就降低了，招聘了很多我不喜欢的员工。后来呢，我实在受不了他们，就一个一个的把这样的人开除了，只留下了符合我心意的员工，我发现，这样公司的利润反而更高，大家在一起工作更开心。


    特别是现在互联网经济，根本不是人越多越好，耐是人越精越好，曹操讲了，兵不在多而在精，将不在勇而在谋！'
  - '[PAGE 208]


    曾有一段佳话，1992 年，当卫哲还在上海外国语大学就读的时候，他曾到万国证券勤工俭学。他翻译的一份年报得到了万国总裁管金生的肯定，管金生表示一定要见见这个年轻人。就是这次初见面，让卫哲成为了“中国证券之父”管金生的秘书。


    与一般秘书不同的是，卫哲工作时非常主动积极，想老板之所想，急老板之所急。刚开始管金生只是让卫哲翻译年报，剪剪报纸，这些事情对于一般人来说是小事，但是卫哲却把它当成大事，做足了工夫，卫哲十分留心在那么多的剪报中哪些是老板看过的，然后进行引导。这些事情，老板没有要求他这么做，到后来，管金生不看剪报中午就吃不下饭。


    作为秘书，卫哲要做给老板端茶倒水这样的小事，他也琢磨出很多技巧。比如开会时，什么时候去倒茶水，才不会打断老板讲话的激情；什么时候光倒水不加茶叶，什么时候该带着茶叶进去；老板有抽烟的习惯，什么时候打火机里的油没了该换个打火机，卫哲都把握得很有分寸。


    经过一段时间的观察，管金生认识到，如果再让卫哲做复印、倒水、剪报等事情，就是屈才。于是，24 岁的卫哲出任上海万国证券公司资产管理总部的副总经理，成为当时国内证券界最年轻的副总。


    如果从普通员工的角度来讲，他们喜欢说，这个世界缺乏机会。


    其实，世界从来不缺乏机会，我们每个老板手里，银行卡里，支付宝上都有大量现金，就是想给这些人才，可惜很难找'
  - '[PAGE 209]


    到这样上心的人才来赚我们的钱。


    从老板的角度来说, 我们必须找到这样的人才, 必须培养这样的人才。


    # 如何骂了人, 还要让他接受


    假如你的老婆某一天回家很晚, 比如晚上12点回家的。你非常生气, 觉得她太过分了。于是, 你早上说, “老婆, 我是很爱你的, 但是我非常生气, 你为什么昨天那么晚才回家,
    你又没打电话, 你去了哪里?” 那么这种讲话方式通常会让你老婆把前面那句, “老婆, 我是很爱你的”忽略。而后面那句, “我非常生气”, 她就听得很清楚,
    还有那句: “你去哪里了?”她则认为你在审问她!


    所以, 马上, 你老婆就会变成会计师, 清算你以前回家晚的罪过, 甚至, 还会翻出来很多其他的旧账。或者, 他会变身成律师。对你说 “你要相信我啊, 两个人在一起就是要相互信赖,”
    结果就是你有罪, 她反而是对的。


    你的本意是想让你老婆早点回家, 让她理解你的感受, 但由于你讲话的方式不对, 反而起了反作用。


    正确的沟通方式是你应该把那一句话的前半部与后半部对调。你应该说, “老婆, 我很生气, 你昨天晚上那么晚才回家, 你又没有的电话回来, 但是我还是很爱你!”
    这种讲话方式会让你老婆听了就得很你爱她。


    语言就是魔鬼的工具, 谁完全理解了讲话的艺术, 谁就能操纵世界。开始讲的这个手段叫做 “糖衣效应”。'
  - '[PAGE 210]


    把苦的药藏在糖衣里面，好让她容易吞下去。就好像我们小时候，妈妈为了让我们吃苦的药，就用糖果来诱骗我们一样的道理。你认为妈妈会不会叫你先吃了糖果，再吃苦药？除非妈妈傻。人类的记忆往往是记住最新鲜的，最近的事情与感受。因此，我们做人做事，讲话，好的东西，都要留在最后才拿出。


    所以，作为老板，要清楚骂人的目的是什么？不要纯粹是为了骂而骂，要为了对方改变而讲话。这些先批评后表扬与肯定的手段，也是我经常拿来对付员工的，当然在营销的过程中，我也会先给客户介绍产品的缺点，然后再介绍产品的优点。


    # 如何管理自己的核心谋士


    凡是成大事者，都必须找到自己的核心谋士，领导者的本事，是发现问题，指大方向。但解决问题是要留给核心谋士的。比如，刘备提出兴复汉室的大方向，找诸葛亮来想方案，给答案。宋江要替天行道，由吴用来想方案，想答案。朱元璋找到了刘伯温，曹操找到了郭嘉，司马懿。孙权找到了周瑜，陆逊！各位当老板的，你们可找到了自己的核心谋士？


    不过今天不与大家谈如何找谋士，因为如何管理核心谋士更加重要。


    下过象棋的人都知道，象棋里面的老将边上有个士，那个士，就是谋士的意思，象棋是非常有智慧的，这个士呢，只能在老将周围的九宫格走，不能跑出去。也就是说，做老板的，要随时随地的把谋士带在身边，刘备当年为了给关羽报仇，想灭了孙权，就犯了这个大忌，我搞不懂他为什么那一次没有带诸葛亮，看来刘备不会下象。'
  - '[PAGE 211]


    象棋中的士是走斜线，按照我们的说法，就是侧着走，不 露正脸，为什么呢？因为谋士很聪明，很有才华，他应该在幕 后做策划，如果让他露了正脸，底下员工一看，哇，我们老板
    原来是个白痴，聪明的原来是那个谋士，这就会影响老板的权 威性，毁坏老板的形象。所以， 谋士只能支招，只能提方案， 不可以当着大家拍板，拍板的事情，只 能老板亲自做。


    永远不要让谋士去基层搞执行，搞好了谋士信心膨胀，恐 怕有自立门户或者取而代之的思想。这还算好的，大多数情况 下是，谋士经常用脑，只是理论水平高，没有实际工作经验，
    这样的人是不能到基层去搞执行的。历史上有两个著名的例子， 是谋士搞了执行，一个是领导赵国与秦国打长平之战的赵括， 惨败后被秦国坑了 40 万士兵，留下了一个著名的成语，纸上谈
    兵。另一个是诸葛亮的谋士马谡著名的空城计，就是因为马谡 失街亭才唱的。


    总结一下，管離心谋士要注意的三点


    第一：永远把谋士带在身边，让他了解事实，出谋划策。


    第二：不给谋士拍板的权利，不可让谋士露正脸，拍板的 权利永远在老板手里。


    第三：不可以让谋士到基层去搞执行，谋士的理论水平高， 就利 用好谋士的理论水平就行了。


    老板的三种管理风格造就三种企业


    不同水平的老板，基本上决定了企业的规模，企业的未来。 到底是混口饭吃呢？还是从优秀到卓越，亦或是基业长青。'
  - '[PAGE 212]


    先说第一种老板，靠自己性格管理企业的，想干啥就干啥，想讲 欢话就讲哈话，认为自己对了，大家都必须听。完全凭喜 怒哀乐，拍桌子，瞪眼睛的方法来管理团队。


    我们中国的大多数小企业，小老板，几乎都是这种模式。这样的老板，除非老板本人英明得不得了，个人魅力强到爆炸。 能把企业做大。 否则，优秀的人才都不愿意跟这样的老板混下
    去，只能留下一帮混饭吃的跟随者。这种企业呢几乎就是老板 是个强人！与其说是个老板，不如说是个勉强能混饭吃的项目 经理或者说是个小包工头。这种企业也没什么未来。


    第二种老板：知道建设企业制度，定流程，定政策，找管 理方法，也知道出一些吸引人才的政策，也有能力引导大家行 动。知道做绩效 考核，知道给员工定目标，玩结果管理，玩目
    标管理。这种老板追求 的是制度化，西方企业大多都是这样的 企业，目前很多中国企业引进 的管理模式基本都是这种模式。


    ‘ 其实这种企业有很大的毛病，就是越考核，人心越散。指 标越精确，员工的满意度越低。这种企业的老板 喜欢吹，我的 目的就是要打造一个自动运转的机器，就算我离开了企
    业，企 业照常运转。岂不知永动机从来没有造成过。不过呢，如果你 想 着这个方向来领导企业，建立一个优秀的企业问题不大！


    第三种老板：会做文化的老板。世界上真正的大品牌，无 一例外,走文化路线的。走文化路线，不是说一开始做规模，后 来有钱了才做文化，而是-开始就是做文化起家，这完全是创始
    人世界观，价值观，人生观的展现。一般就是一句口号就体现 了他们企业的宗旨。比如，洛基亚的科技以人为本；华为的狼 性文化；微软的失败是成功之母！'
  - '[PAGE 213]


    这种文化不断的滋润着每一个进入这个企业里的员工，认同留下，不认同的走掉，最终形成一种特殊的人群。这种人群就是有这种文化的人的集合。


    只有学会做文化，才能影响到员工的头脑，也能影响到客户的头脑。这就是老板的最高境界，让别人从内心里彻底服；在这个层次的企业，才能基业长青。


    在建设制度，定指标，讲绩效这样的境界上，只能做到优秀，最牛逼能做到卓越。


    靠拍桌子，瞪眼睛，老板牵头做项目的境界上，只能做到混饭吃。各位想成为什么老板，就选择什么样的手法去经营自己的企业吧。


    不要跟员工讲道理只向员工要结果


    凡是想把公司所有事情解决完的老板，都是赚不到钱的老板，把心思只放在公司最赚钱的核心业务上的老板，就是赚大钱的老板。


    无时无刻的保持研究市场，研究产品，学习知识，如果你拒绝这样做，你的竞争对手不会拒绝这样做，你被就淘汰了。


    老板不要太在意小钱，要想如何才能赚到更多的大钱，见小利则大事不成。


    要让公司的员工有让给自己干的感觉，所以，我给公司的每一个员工做市场的机会，每个人都有提成拿，只要你有本事。


    要为员工考虑未来，如果只考虑自己的未来，那么员工就不会跟你了，特别是优秀的员工。'
  - '[PAGE 214]


    不要以为自己是老板，就可以不上进，不上进就会被淘汰，不管你是谁。


    怎么才叫有胸怀的老板，就是敢把钱与权力分配给优秀的员工的老板。


    想尽办法让员工开心，奶牛听音乐开心了产奶量，质量都高，人也一样。


    不要跟员工讲道理，只向员工要结果；越讲道理，越没道理，一要结果，啥都对了，大家都没话说。


    如何解雇公司员工？


    刚创业的小老板一般没经验解雇员工，甚至不知道那些员工应该解雇。由于刚开始，别人都瞧不上你的小公司，招人本来就很难。所以，很多老板招聘到了一些本来就找不到工作的人，这些人呢，就在
    你那个公司混日子。


    老板要明确一件事，只要这个人在一定的时间内不能给公司带来利益，就应该立马解雇。


    解雇任何人都不要闹僵，要好言好语，说明公司的情况，为什么他需要离开，都可以告诉他。也切记不发员工工资，会导致员工去劳动局告你，甚至在网上散播你们公司的负面信息，导致影响你的业务。每个与你接触的人都是你的活体广告，尽量别给他们做你负面广告的理由。


    创业人永远要保持头脑清晰，公司资金紧张了，该裁员就迅速做出决断。别拖。越拖钱越少。也别走漏风声，要当机立断。走漏消息的后果往往是节外生枝，麻烦不断。'
  - '[PAGE 215]


    解雇一个人，要讲清楚是公司经营不善造成的，不要怪罪员工无能，告诉员工可以在其他行业找到合适他们的工作，会有前途。


    如果你实在不擅长做解雇的事情，可以培养一个心腹，可以是 你的人事，可以是你们公司的二把手，重要的是要确保他们不会破坏 公司的形象，采取粗暴的解雇员工的方式。他们爽了，背黑锅的是你。


    对于让你背黑锅的团队成员，不能让一个坑我们的人留在身边 理应开除。


    # 企业的末位淘汰制实施策略


    企业必须实行末位淘汰制，就如同古代军队打仗失败，有的人必 须受到斩头的处罚一样，作用之一是激励将士们在战场上拼命杀敌， 作用之二是震慑还没有上战场的人，让他们做好心理准备，必须拼命。


    很多老板虽然知道这个制度，但不知道如何玩，今天我就讲三条实施策略。


    第一：分层次淘汰。


    对做得好的人理应给予鼓励，做得不好就必须适当淘汰。但在实际操作中绝不能搞“一刀切”，否则倒霉的一定是基层员工。因为，淘汰应在企业的各个层次展开，经理、主管等各个层级都应有人员进行合理流动，这样才能体现末位淘汰制的公平性，不能一淘汰人就只最基层员工。


    第二： 合理安排被淘汰人员'
  - '[PAGE 216]


    推行末位淘汰制不能对“末位员工”一栽了事，这样会极大地伤害被淘汰员工的自尊心，也会打击那些仍然有企业内工作的员工的情绪。对于“末位员工”企业不应从一开始就放弃对他们的帮助和培训，只有当确定他们最终无法实现快速转变或是不能领悟、认同企业的价值观时，才让其转岗、降职，或者走人。


    第三：明确末位淘汰的界限，避免形式化，注重实用。


    竞争、淘汰是必须的，但淘汰周期应主要依据企业的人力的素质水平而定，当目标已经达到的时候，末位淘汰制就应该缓行，不能为了淘汰而淘汰。通常来说，末位淘汰的周期是最多一年一次，不可太频繁，否则就会出现人人自危的状况。末位淘汰的范围一般以小于5%的比例为宜，即100人的企业，一次淘汰5人。当然，这里个人并不是均勾分布的，有些部门可能一个也没有，而有些部门可能有多个，应视具体情况而定。如果企业能够招聘到非常优秀的人才，


    那么可以加大淘汰力度。


    有些老板狠不下来心，这是不对的，企业不是养老院，不是慈善机构。能者上，庸者下。企业必须要有人流动，有新来的人刺激公司的老员工，有差的人离开，这样留下来的人才会警惕。铁打的营盘，


    流水的兵，只要保证公司的核心骨干在，并且不断培养核心骨干的后


    备队伍，企业就能健康发展。


    哪几种员工必须裁掉？'
  - '[PAGE 217]


    现在这个社会，赚钱在也不是靠人多，而是靠精英。所以各位老板不能再以前面 10 年的思想来经营自己的企业，现在很多人读了大学，但实际上他们的意识形态却是把自己当成一个工广工人。目前社会竞争激烈，要想公司发展得好，利润高，在这个互联网社会立于不败之地，几种没跟上时代的员工必须开除或者不要招聘进公司。


    第一：想过朝九晚五的安逸生活，还想要双休的人，还要高薪的人，不要招聘进公司，其实就算他要底薪，要双休，要朝九挽：不要招聘进公司。因为会影响一个不断奋进的团队，给团队树立不好的榜样。


    第二：想靠高底薪生活的人，特别是销售岗位，推广岗位，居然有的人要求高薪水，很是搞笑，这些岗位就是靠能力吃饭的，靠提成吃饭，能零底薪就零底薪，尽量高提成就行了。


    第三：来公司图稳定，没有企图心，不想赚大钱的人，这样的人呢，典型的想找个公司混日子，这样的人适合当门卫，千万别招聘到公司里。


    第四：不能与时俱进的学习的人，不善于主动学习新东西的人， 不要招聘进公司。


    第五：做事马马虎虎，得过且过，没有精益求精的精神的人，也 不要招聘进公司。


    第六：老是给自己公司找毛病，比如，你让他卖一个产品，他就说这个产品太贵，客户不买，你让他去做一个事情，他就说这个事情有难度，不好做。他不会主动想办法，直接开除。


    现代企业，绝不是拼人多的，而是看那个企业里精英多。'
  - '[PAGE 218]


    与其招聘一群能把人气死的人，不如招聘一个优秀的人才。特别是互联网行业，一个优秀的人能顶不优秀的十几个人。


    以前的社会是把企业做大，比规模。以后的企业，是把企业做精，做小，比利润。


    # 老板如何处理手握重权的害群之马


    齐景公当年问晏子，就是晏子使楚的那个晏子。说，晏子丞相：


    你看当国王最怕什么呢？晏子说：当国王最怕老鼠与狗。


    许齐景公哈哈大笑#我怎么会怕老鼠与狗，你倒是说说。


    晏子说，我们老家拜祭祖先的时候，上了很多贡品在祖先的牌位 面前。但是看到一只大肥老鼠，在上面吃贡品，我又不敢打，不是不 抓老鼠啊，是怕打老鼠，老鼠在祖先的牌位台子上乱跑，我跟着打，把祖先的牌位都给打倒了，这可不得了。


    这就叫投鼠忌器啊。


    齐景公问，那如何是好？


    晏子说，好办啊，用其他食物把老鼠诱感到更加空旷的地方，或 者等到他到空旷的地方了，在下手，把老鼠打死。


    齐景公说，这样讲起来，还真是怕在祖先牌位面前的老鼠啊。


    最近，我有个 VIP 学员问了我一个问题，说他有个游戏公司，创业的时候呢，这个游戏公司的核心程序被一个程序员拿在手里，而这个家伙老是不听指挥，不服从管理，动不动就以销毁核心程序威胁公司，问我怎么办？'
  - '[PAGE 219]


    我开始的策略就是这种人坚决要清掉，不管付出多大代价。后来 知道投鼠忌器这回事情了。就出一个方案，先不动声色的给这个坏蛋 程序员招聘一个副手，这个副手的目的就是要拿到这个核心程序，拿
    到这个核心程序了，就可以直接把这个坏蛋程序员干掉了。


    我们做大事的人，一定不要冲动，不要感情用事，要用温和的手段处理这些矛盾的事情，把损失降到最低，最大程度的保证自己的利益。要把老鼠引诱到空旷，冷静的地方，一次性就要了它的小命，千万不要与其发生直接冲突而造成自己承担不起的损失。


    不站在老板立场的员工没前途，没有员工思老板做不大


    每个人都想要别人顺从自己的欲望，特别是当老板的，总是希望 员工顺从自己的欲望，但很少有员工从内心里顺从老板的欲望。


    我们做老板的其实是可以利用这一点的，不必要让员工都有非常 高的觉悟，要顺从自己的欲望。


    老板可以顺从员工的欲望，以帮助员工完成心愿的姿态来经营员 工。比如“打土豪，分田地”老百姓都想完成这个心愿，那么好，你 们跟我一起闹革命，就可以完成你的心愿。


    比如员工想买房子，买车子，那么好，我来帮你们完成这个心愿， 你们把工作做好，我来辅助你们把工作做好，这就是让自己的欲望顺 从员工的欲望，这样的思路来经营员工，就会顺畅得多。成就了员工，
    也成就了自己，顺便自己赚钱了。


    对于员工来说呢？你必须要站在老板的立场上来思考与处'
  - '[PAGE 220]


    理任何问题，老板会重用你，你才会爬得快。


    对于乙方来说，你要站到甲方老板的立场上去思考，处理问题。这样就会感动甲方老板，合作就会长期愉快的进行下去。


    当然，如果你是老板，必须要有员工思维，凡事要站到员工的立场去看一看，服务员工，关心员工，帮忙员工，员工就愿意为你卖命了。


    对于企业来说，要始终站到消费者的立场，实实在在的为消费者建立起别人做不到的产品体系，服务体系，自然也就把生意做好了。


    给大家举个例子：


    操在讨伐东吴的时候，孙权开会讨论是投降还是打一架，有很多人都是主张投降，大家都说，刘表的儿子都投降了，还封了官，我们也投降了算了。


    鲁肃趁孙权上厕所的机会，就跟孙权说：“老大，我们当臣子的可以投降，你不能投降。”孙权就问为什么，鲁肃就说我们做臣子的，换个皇帝，还是一样当官，投降了，家产官位都有保障，你投降了，曹操让你做什么官呢？”孙权一下子就明白了，他必须跟曹操干一架！


    这也是为什么后来鲁肃被视为孙氏王朝心腹的原因，因为鲁肃是 真心实意彻底为孙权考虑的人。也就是说，鲁肃是站到孙权的立场上 满足孙权的欲望的人。


    我在我们企业里开会，一直都是以彻底帮助伙伴们实现财'
  md: "\n## 哪些员工是合格的，哪些员工是不合格\n\n其实当员工也必须与时俱进，老思想的员工应该被淘汰，如果不淘汰这些员工，那么企业就会被淘汰，每一个历史时期，所用员工的标准，都有所变化。\n\
    \n公司里总有一些人经常闲着无事可干，老板走过去询问原因，他就说：“您安排的事情做完了，没事啦。”这样的人每个公司都是存在。他们认为，做完老板安排的事情就很不错了。然而，在现代化企业里，虽然听命行事相当重要，但是个人主动进取的精神更重要。\n\
    \n因为在市场经济时代，昔日那种“听命行事”的员工已经失去竞争优势了，你不努力工作，有的是人没日没夜的干活，比如阿里巴巴、腾讯这些公司，真的就是晚上也在工作。这些企业非常优秀，是因为有一帮拼命的员工。\n\
    \n我们当老板的，必须把员工调教到这种程度，如果一个员工不能为企业带来利益，那么必须开除。\n\n今天企业需要的是那种不必老板交代，就自动自发去工作的人。\n\
    \n有两种人注定一事无成，一种是除非别人要他去做，否则绝不会主动做事的人；这种员工招聘进公司了，经过一段时间的培训与改造，依旧不改变，应该开除，其实真正聪明的老板是直接不招聘这样的人进公司，不培训，因为培训也是成本；另外一种人则是即使别人要他做，他也做不好事情的人，这种人通常是做事不上心的人。哪些不需要别人催促，就会主动去做应该做的事，而且不会半途而废的人必定成功，这种人懂得要求自己多努力一点多付出一点，而且比别人预期的还要多，这是我们要的员工。\n\
    \n很多老板讲，这样的员工难找，确实是，我刚开始创业的时候，因为员工不好找，我刚开始的高标准就降低了，招聘了很多我不喜欢的员工。后来呢，我实在受不了他们，就一个一个的把这样的人开除了，只留下了符合我心意的员工，我发现，这样公司的利润反而更高，大家在一起工作更开心。\n\
    \n特别是现在互联网经济，根本不是人越多越好，而是人越精越好。曹操讲了，兵不在多而在精，将不在勇而在谋！\n\n曾有一段佳话，1992年，当卫哲还在上海外国语大学就读的时候，他曾到万国证券勤工俭学。他翻译的一份年报得到了万国总裁管金生的肯定，管金生表示一定要见见这个年轻人。就是这次初见面，让卫哲成为了“中国证券之父”管金生的秘书。\n\
    \n与一般秘书不同的是，卫哲工作时非常主动积极，想老板之所想，急老板之所急。刚开始管金生只是让卫哲翻译年报，剪剪报纸，这些事情对于一般人来说是小事，但是卫哲却把它当成大事，做足了工夫，卫哲十分留心在那么多的剪报中哪些是老板看过的，然后进行引导。这些事情，老板没有要求他这么做，到后来，管金生不看剪报中午就吃不下饭。\n\
    \n作为秘书，卫哲要做给老板端茶倒水这样的小事，他也琢磨出很多技巧。比如开会时，什么时候去倒茶水，才不会打断老板讲话的激情；什么时候光倒水不加茶叶，什么时候该带着茶叶进去；老板有抽烟的习惯，什么时候打火机里的油没了该换个打火机，卫哲都把握得很有分寸。\n\
    \n经过一段时间的观察，管金生认识到，如果再让卫哲做复印、倒水、剪报等事情，就是屈才。于是，24岁的卫哲出任上海万国证券公司资产管理总部的副总经理，成为当时国内证券界最年轻的副总。\n\
    \n如果从普通员工的角度来讲，他们喜欢说，这个世界缺乏机会。\n\n其实，世界从来不缺乏机会，我们每个老板手里，银行卡里，支付宝上都有大量现金，就是想给这些人才，可惜很难找到这样上心的人才来赚我们的钱。\n\
    \n从老板的角度来说，我们必须找到这样的人才，必须培养这样的人才。\n\n## 如何骂了人, 还要让他接受\n\n假如你的老婆某一天回家很晚, 比如晚上12点回家的。你非常生气,\
    \ 觉得她太过分了。于是, 你早上说, “老婆, 我是很爱你的, 但是我非常生气, 你为什么昨天那么晚才回家, 你又没打电话, 你去了哪里?” 那么这种讲话方式通常会让你老婆把前面那句,\
    \ “老婆, 我是很爱你的”忽略。而后面那句, “我非常生气”, 她就听得很清楚, 还有那句: “你去哪里了?”她则认为你在审问她!\n\n所以, 马上,\
    \ 你老婆就会变成会计师, 清算你以前回家晚的罪过, 甚至, 还会翻出来很多其他的旧账。或者, 他会变身成律师。对你说 “你要相信我啊, 两个人在一起就是要相互信赖,”\
    \ 结果就是你有罪, 她反而是对的。\n\n你的本意是想让你老婆早点回家, 让她理解你的感受, 但由于你讲话的方式不对, 反而起了反作用。\n\n正确的沟通方式是你应该把那一句话的前半部与后半部对调。你应该说,\
    \ “老婆, 我很生气, 你昨天晚上那么晚才回家, 你又没有打电话回来, 但是我还是很爱你!” 这种讲话方式会让你老婆听了就觉得很你爱她。\n\n语言就是魔鬼的工具,\
    \ 谁完全理解了讲话的艺术, 谁就能操纵世界。开始讲的这个手段叫做 “糖衣效应”。\n\n把苦的药藏在糖衣里面，好让她容易吞下去。就好像我们小时候，妈妈为了让我们吃苦的药，就用糖果来诱骗我们一样的道理。你认为妈妈会不会叫你先吃了糖果，再吃苦药？除非妈妈傻。人类的记忆往往是记住最新鲜的，最近的事情与感受。因此，我们做人做事，讲话，好的东西，都要留在最后才拿出。\n\
    \n所以，作为老板，要清楚骂人的目的是什么？不要纯粹是为了骂而骂，要为了对方改变而讲话。这些先批评后表扬与肯定的手段，也是我经常拿来对付员工的，当然在营销的过程中，我也会先给客户介绍产品的缺点，然后再介绍产品的优点。\n\
    \n## 如何管理自己的核心谋士\n\n凡是成大事者，都必须找到自己的核心谋士，领导者的本事，是发现问题，指大方向。但解决问题是要留给核心谋士的。比如，刘备提出兴复汉室的大方向，找诸葛亮来想方案，给答案。宋江要替天行道，由吴用来想方案，想答案。朱元璋找到了刘伯温，曹操找到了郭嘉，司马懿。孙权找到了周瑜，陆逊！各位当老板的，你们可找到了自己的核心谋士？\n\
    \n不过今天不与大家谈如何找谋士，因为如何管理核心谋士更加重要。\n\n下过象棋的人都知道，象棋里面的老将边上有个士，那个士，就是谋士的意思，象棋是非常有智慧的，这个士呢，只能在老将周围的九宫格走，不能跑出去。也就是说，做老板的，要随时随地的把谋士带在身边，刘备当年为了给关羽报仇，想灭了孙权，就犯了这个大忌，我搞不懂他为什么那一次没有带诸葛亮，看来刘备不会下象棋。\n\
    \n象棋中的士是走斜线，按照我们的说法，就是侧着走，不露正脸，为什么呢？因为谋士很聪明，很有才华，他应该在幕后做策划，如果让他露了正脸，底下员工一看，哇，我们老板原来是个白痴，聪明的原来是那个谋士，这就会影响老板的权威性，毁坏老板的形象。所以，谋士只能支招，只能提方案，不可以当着大家拍板，拍板的事情，只能老板亲自做。\n\
    \n永远不要让谋士去基层搞执行，搞好了谋士信心膨胀，恐怕有自立门户或者取而代之的思想。这还算好的，大多数情况下是，谋士经常用脑，只是理论水平高，没有实际工作经验，这样的人是不能到基层去搞执行的。历史上有两个著名的例子，是谋士搞了执行，一个是领导赵国与秦国打长平之战的赵括，惨败后被秦国坑了40万士兵，留下了一个著名的成语，纸上谈兵。另一个是诸葛亮的谋士马谡，著名的空城计，就是因为马谡失街亭才唱的。\n\
    \n总结一下，管理核心谋士要注意的三点\n\n- 第一：永远把谋士带在身边，让他了解事实，出谋划策。\n- 第二：不给谋士拍板的权利，不可让谋士露正脸，拍板的权利永远在老板手里。\n\
    - 第三：不可以让谋士到基层去搞执行，谋士的理论水平高，就利用好谋士的理论水平就行了。\n\n### 老板的三种管理风格造就三种企业\n\n不同水平的老板，基本上决定了企业的规模，企业的未来。到底是混口饭吃呢？还是从优秀到卓越，亦或是基业长青。\n\
    \n先说第一种老板，靠自己性格管理企业的，想干啥就干啥，想讲啥话就讲啥话，认为自己对了，大家都必须听。完全凭喜怒哀乐，拍桌子，瞪眼睛的方法来管理团队。\n\n\
    我们中国的大多数小企业，小老板，几乎都是这种模式。这样的老板，除非老板本人英明得不得了，个人魅力强到爆炸，能把企业做大。否则，优秀的人才都不愿意跟这样的老板混下去，只能留下一帮混饭吃的跟随者。这种企业呢几乎就是老板是个强人！与其说是个老板，不如说是个勉强能混饭吃的项目经理或者说是个小包工头。这种企业也没什么未来。\n\
    \n第二种老板：知道建设企业制度，定流程，定政策，找管理方法，也知道出一些吸引人才的政策，也有能力引导大家行动。知道做绩效考核，知道给员工定目标，玩结果管理，玩目标管理。这种老板追求的是制度化，西方企业大多都是这样的企业，目前很多中国企业引进的管理模式基本都是这种模式。\n\
    \n其实这种企业有很大的毛病，就是越考核，人心越散。指标越精确，员工的满意度越低。这种企业的老板喜欢吹，我的目的就是要打造一个自动运转的机器，就算我离开了企业，企业照常运转。岂不知永动机从来没有造成过。不过呢，如果你想着这个方向来领导企业，建立一个优秀的企业问题不大！\n\
    \n第三种老板：会做文化的老板。世界上真正的大品牌，无一例外,走文化路线的。走文化路线，不是说一开始做规模，后来有钱了才做文化，而是一开始就是做文化起家，这完全是创始人世界观，价值观，人生观的展现。一般就是一句口号就体现了他们企业的宗旨。比如，诺基亚的科技以人为本；华为的狼性文化；微软的失败是成功之母！\n\
    \n这种文化不断的滋润着每一个进入这个企业里的员工，认同留下，不认同的走掉，最终形成一种特殊的人群。这种人群就是有这种文化的人的集合。\n\n只有学会做文化，才能影响到员工的头脑，也能影响到客户的头脑。这就是老板的最高境界，让别人从内心里彻底服；在这个层次的企业，才能基业长青。\n\
    \n在建设制度，定指标，讲绩效这样的境界上，只能做到优秀，最牛逼能做到卓越。\n\n靠拍桌子，瞪眼睛，老板牵头做项目的境界上，只能做到混饭吃。各位想成为什么老板，就选择什么样的手法去经营自己的企业吧。\n\
    \n### 不要跟员工讲道理只向员工要结果\n\n- 凡是想把公司所有事情解决完的老板，都是赚不到钱的老板，把心思只放在公司最赚钱的核心业务上的老板，就是赚大钱的老板。\n\
    - 无时无刻的保持研究市场，研究产品，学习知识，如果你拒绝这样做，你的竞争对手不会拒绝这样做，你就被淘汰了。\n- 老板不要太在意小钱，要想如何才能赚到更多的大钱，见小利则大事不成。\n\
    - 要让公司的员工有为自己干的感觉，所以，我给公司的每一个员工做市场的机会，每个人都有提成拿，只要你有本事。\n- 要为员工考虑未来，如果只考虑自己的未来，那么员工就不会跟你了，特别是优秀的员工。\n\
    - 不要以为自己是老板，就可以不上进，不上进就会被淘汰，不管你是谁。\n- 怎么才叫有胸怀的老板，就是敢把钱与权力分配给优秀的员工的老板。\n- 想尽办法让员工开心，奶牛听音乐开心了产奶量，质量都高，人也一样。\n\
    - 不要跟员工讲道理，只向员工要结果；越讲道理，越没道理，一要结果，啥都对了，大家都没话说。\n\n### 如何解雇公司员工？\n\n刚创业的小老板一般没经验解雇员工，甚至不知道那些员工应该解雇。由于刚开始，别人都瞧不上你的小公司，招人本来就很难。所以，很多老板招聘到了一些本来就找不到工作的人，这些人呢，就在你那个公司混日子。\n\
    \n老板要明确一件事，只要这个人在一定的时间内不能给公司带来利益，就应该立马解雇。\n\n解雇任何人都不要闹僵，要好言好语，说明公司的情况，为什么他需要离开，都可以告诉他。也切记不发员工工资，会导致员工去劳动局告你，甚至在网上散播你们公司的负面信息，导致影响你的业务。每个与你接触的人都是你的活体广告，尽量别给他们做你负面广告的理由。\n\
    \n创业人永远要保持头脑清晰，公司资金紧张了，该裁员就迅速做出决断。别拖。越拖钱越少。也别走漏风声，要当机立断。走漏消息的后果往往是节外生枝，麻烦不断。\n\
    \n解雇一个人，要讲清楚是公司经营不善造成的，不要怪罪员工无能，告诉员工可以在其他行业找到合适他们的工作，会有前途。\n\n如果你实在不擅长做解雇的事情，可以培养一个心腹，可以是您的人事，可以是你们公司的二把手，重要的是要确保他们不会破坏公司的形象，采取粗暴的解雇员工的方式。他们爽了，背黑锅的是你。\n\
    \n对于让你背黑锅的团队成员，不能让一个坑我们的人留在身边，理应开除。\n\n## 企业的末位淘汰制实施策略\n\n企业必须实行末位淘汰制，就如同古代军队打仗失败，有的人必须受到斩头的处罚一样，作用之一是激励将士们在战场上拼命杀敌，作用之二是震慑还没有上战场的人，让他们做好心理准备，必须拼命。\n\
    \n很多老板虽然知道这个制度，但不知道如何玩，今天我就讲三条实施策略。\n\n- 第一：分层次淘汰。\n  对做得好的人理应给予鼓励，做得不好就必须适当淘汰。但在实际操作中绝不能搞“一刀切”，否则倒霉的一定是基层员工。因为，淘汰应在企业的各个层次展开，经理、主管等各个层级都应有人员进行合理流动，这样才能体现末位淘汰制的公平性，不能一淘汰人就只针对最基层员工。\n\
    \n- 第二：合理安排被淘汰人员\n  推行末位淘汰制不能对“末位员工”一裁了之，这样会极大地伤害被淘汰员工的自尊心，也会打击那些仍然在企业内工作的员工的情绪。对于“末位员工”企业不应从一开始就放弃对他们的帮助和培训，只有当确定他们最终无法实现快速转变或是不能领悟、认同企业的价值观时，才让其转岗、降职，或者走人。\n\
    \n- 第三：明确末位淘汰的界限，避免形式化，注重实用。\n  竞争、淘汰是必须的，但淘汰周期应主要依据企业的人力的素质水平而定，当目标已经达到的时候，末位淘汰制就应该缓行，不能为了淘汰而淘汰。通常来说，末位淘汰的周期是最多一年一次，不可太频繁，否则就会出现人人自危的状况。末位淘汰的范围一般以小于5%的比例为宜，即100人的企业，一次淘汰5人。当然，这里个人并不是均匀分布的，有些部门可能一个也没有，而有些部门可能有多个，应视具体情况而定。如果企业能够招聘到非常优秀的人才，那么可以加大淘汰力度。\n\
    \n有些老板狠不下来心，这是不对的，企业不是养老院，不是慈善机构。能者上，庸者下。企业必须要有人流动，有新来的人刺激公司的老员工，有差的人离开，这样留下来的人才会警惕。铁打的营盘，流水的兵，只要保证公司的核心骨干在，并且不断培养核心骨干的后备队伍，企业就能健康发展。\n\
    \n### 哪几种员工必须裁掉？\n\n现在这个社会，赚钱在也不是靠人多，而是靠精英。所以各位老板不能再以前面10年的思想来经营自己的企业，现在很多人读了大学，但实际上他们的意识形态却是把自己当成一个工厂工人。目前社会竞争激烈，要想公司发展得好，利润高，在这个互联网社会立于不败之地，几种没跟上时代的员工必须开除或者不要招聘进公司。\n\
    \n- 第一：想过朝九晚五的安逸生活，还想要双休的人，还要高薪的人，不要招聘进公司，其实就算他要底薪，要双休，要朝九晚五，不要招聘进公司。因为会影响一个不断奋进的团队，给团队树立不好的榜样。\n\
    - 第二：想靠高底薪生活的人，特别是销售岗位，推广岗位，居然有的人要求高薪水，很是搞笑，这些岗位就是靠能力吃饭的，靠提成吃饭，能零底薪就零底薪，尽量高提成就行了。\n\
    - 第三：来公司图稳定，没有企图心，不想赚大钱的人，这样的人呢，典型的想找个公司混日子，这样的人适合当门卫，千万别招聘到公司里。\n- 第四：不能与时俱进的学习的人，不善于主动学习新东西的人，不要招聘进公司。\n\
    - 第五：做事马马虎虎，得过且过，没有精益求精的精神的人，也不要招聘进公司。\n- 第六：老是给自己公司找毛病，比如，你让他卖一个产品，他就说这个产品太贵，客户不买，你让他去做一个事情，他就说这个事情有难度，不好做。他不会主动想办法，直接开除。\n\
    \n现代企业，绝不是拼人多的，而是看那个企业里精英多。\n\n与其招聘一群能把人气死的人，不如招聘一个优秀的人才。特别是互联网行业，一个优秀的人能顶不优秀的十几个人。\n\
    \n以前的社会是把企业做大，比规模。以后的企业，是把企业做精，做小，比利润。\n\n## 老板如何处理手握重权的害群之马\n\n齐景公当年问晏子，就是晏子使楚的那个晏子。说，晏子丞相：你看当国王最怕什么呢？晏子说：当国王最怕老鼠与狗。\n\
    \n齐景公哈哈大笑：我怎么会怕老鼠与狗，你倒是说说。\n\n晏子说，我们老家拜祭祖先的时候，上了很多贡品在祖先的牌位面前。但是看到一只大肥老鼠，在上面吃贡品，我又不敢打，不是不抓老鼠啊，是怕打老鼠，老鼠在祖先的牌位台子上乱跑，我跟着打，把祖先的牌位都给打倒了，这可不得了。\n\
    \n这就叫投鼠忌器啊。\n\n齐景公问，那如何是好？\n\n晏子说，好办啊，用其他食物把老鼠诱感到更加空旷的地方，或者等到他到空旷的地方了，在下手，把老鼠打死。\n\
    \n齐景公说，这样讲起来，还真是怕在祖先牌位面前的老鼠啊。\n\n最近，我有个VIP学员问了我一个问题，说他有个游戏公司，创业的时候呢，这个游戏公司的核心程序被一个程序员拿在手里，而这个家伙老是不听指挥，不服从管理，动不动就以销毁核心程序威胁公司，问我怎么办？\n\
    \n我开始的策略就是这种人坚决要清掉，不管付出多大代价。后来知道投鼠忌器这回事情了。就出一个方案，先不动声色的给这个坏蛋程序员招聘一个副手，这个副手的目的就是要拿到这个核心程序，拿到这个核心程序了，就可以直接把这个坏蛋程序员干掉了。\n\
    \n我们做大事的人，一定不要冲动，不要感情用事，要用温和的手段处理这些矛盾的事情，把损失降到最低，最大程度的保证自己的利益。要把老鼠引诱到空旷，冷静的地方，一次性就要了它的小命，千万不要与其发生直接冲突而造成自己承担不起的损失。\n\
    \n### 不站在老板立场的员工没前途，没有员工思老板做不大\n\n每个人都想要别人顺从自己的欲望，特别是当老板的，总是希望员工顺从自己的欲望，但很少有员工从内心里顺从老板的欲望。\n\
    \n我们做老板的其实是可以利用这一点的，不必要让员工都有非常高的觉悟，要顺从自己的欲望。\n\n老板可以顺从员工的欲望，以帮助员工完成心愿的姿态来经营员工。比如“打土豪，分田地”老百姓都想完成这个心愿，那么好，你们跟我一起闹革命，就可以完成你的心愿。\n\
    \n比如员工想买房子，买车子，那么好，我来帮你们完成这个心愿，你们把工作做好，我来辅助你们把工作做好，这就是让自己的欲望顺从员工的欲望，这样的思路来经营员工，就会顺畅得多。成就了员工，也成就了自己，顺便自己赚钱了。\n\
    \n对于员工来说呢？你必须要站在老板的立场上来思考与处理任何问题，老板会重用你，你才会爬得快。\n\n对于乙方来说，你要站到甲方老板的立场上去思考，处理问题。这样就会感动甲方老板，合作就会长期愉快的进行下去。\n\
    \n当然，如果你是老板，必须要有员工思维，凡事要站到员工的立场去看一看，服务员工，关心员工，帮忙员工，员工就愿意为你卖命了。\n\n对于企业来说，要始终站到消费者的立场，实实在在的为消费者建立起别人做不到的产品体系，服务体系，自然也就把生意做好了。\n\
    \n给大家举个例子：\n\n曹操在讨伐东吴的时候，孙权开会讨论是投降还是打一架，有很多人都是主张投降，大家都说，刘表的儿子都投降了，还封了官，我们也投降了算了。\n\
    \n鲁肃趁孙权上厕所的机会，就跟孙权说：“老大，我们当臣子的可以投降，你不能投降。”孙权就问为什么，鲁肃就说我们做臣子的，换个皇帝，还是一样当官，投降了，家产官位都有保障，你投降了，曹操让你做什么官呢？”孙权一下子就明白了，他必须跟曹操干一架！\n\
    \n这也是为什么后来鲁肃被视为孙氏王朝心腹的原因，因为鲁肃是真心实意彻底为孙权考虑的人。也就是说，鲁肃是站到孙权的立场上满足孙权的欲望的人。\n\n我在我们企业里开会，一直都是以彻底帮助伙伴们实现财\n"
  mdcn: "\n## 哪些员工是合格的，哪些员工是不合格\n\n其实当员工也必须与时俱进，老思想的员工应该被淘汰，如果不淘汰这些员工，那么企业就会被淘汰，每一个历史时期，所用员工的标准，都有所变化。\n\
    \n公司里总有一些人经常闲着无事可干，老板走过去询问原因，他就说：“您安排的事情做完了，没事啦。”这样的人每个公司都是存在。他们认为，做完老板安排的事情就很不错了。然而，在现代化企业里，虽然听命行事相当重要，但是个人主动进取的精神更重要。\n\
    \n因为在市场经济时代，昔日那种“听命行事”的员工已经失去竞争优势了，你不努力工作，有的是人没日没夜的干活，比如阿里巴巴、腾讯这些公司，真的就是晚上也在工作。这些企业非常优秀，是因为有一帮拼命的员工。\n\
    \n我们当老板的，必须把员工调教到这种程度，如果一个员工不能为企业带来利益，那么必须开除。\n\n今天企业需要的是那种不必老板交代，就自动自发去工作的人。\n\
    \n有两种人注定一事无成，一种是除非别人要他去做，否则绝不会主动做事的人；这种员工招聘进公司了，经过一段时间的培训与改造，依旧不改变，应该开除，其实真正聪明的老板是直接不招聘这样的人进公司，不培训，因为培训也是成本；另外一种人则是即使别人要他做，他也做不好事情的人，这种人通常是做事不上心的人。哪些不需要别人催促，就会主动去做应该做的事，而且不会半途而废的人必定成功，这种人懂得要求自己多努力一点多付出一点，而且比别人预期的还要多，这是我们要的员工。\n\
    \n很多老板讲，这样的员工难找，确实是，我刚开始创业的时候，因为员工不好找，我刚开始的高标准就降低了，招聘了很多我不喜欢的员工。后来呢，我实在受不了他们，就一个一个的把这样的人开除了，只留下了符合我心意的员工，我发现，这样公司的利润反而更高，大家在一起工作更开心。\n\
    \n特别是现在互联网经济，根本不是人越多越好，而是人越精越好。曹操讲了，兵不在多而在精，将不在勇而在谋！\n\n曾有一段佳话，1992年，当卫哲还在上海外国语大学就读的时候，他曾到万国证券勤工俭学。他翻译的一份年报得到了万国总裁管金生的肯定，管金生表示一定要见见这个年轻人。就是这次初见面，让卫哲成为了“中国证券之父”管金生的秘书。\n\
    \n与一般秘书不同的是，卫哲工作时非常主动积极，想老板之所想，急老板之所急。刚开始管金生只是让卫哲翻译年报，剪剪报纸，这些事情对于一般人来说是小事，但是卫哲却把它当成大事，做足了工夫，卫哲十分留心在那么多的剪报中哪些是老板看过的，然后进行引导。这些事情，老板没有要求他这么做，到后来，管金生不看剪报中午就吃不下饭。\n\
    \n作为秘书，卫哲要做给老板端茶倒水这样的小事，他也琢磨出很多技巧。比如开会时，什么时候去倒茶水，才不会打断老板讲话的激情；什么时候光倒水不加茶叶，什么时候该带着茶叶进去；老板有抽烟的习惯，什么时候打火机里的油没了该换个打火机，卫哲都把握得很有分寸。\n\
    \n经过一段时间的观察，管金生认识到，如果再让卫哲做复印、倒水、剪报等事情，就是屈才。于是，24岁的卫哲出任上海万国证券公司资产管理总部的副总经理，成为当时国内证券界最年轻的副总。\n\
    \n如果从普通员工的角度来讲，他们喜欢说，这个世界缺乏机会。\n\n其实，世界从来不缺乏机会，我们每个老板手里，银行卡里，支付宝上都有大量现金，就是想给这些人才，可惜很难找到这样上心的人才来赚我们的钱。\n\
    \n从老板的角度来说，我们必须找到这样的人才，必须培养这样的人才。\n\n## 如何骂了人, 还要让他接受\n\n假如你的老婆某一天回家很晚, 比如晚上12点回家的。你非常生气,\
    \ 觉得她太过分了。于是, 你早上说, “老婆, 我是很爱你的, 但是我非常生气, 你为什么昨天那么晚才回家, 你又没打电话, 你去了哪里?” 那么这种讲话方式通常会让你老婆把前面那句,\
    \ “老婆, 我是很爱你的”忽略。而后面那句, “我非常生气”, 她就听得很清楚, 还有那句: “你去哪里了?”她则认为你在审问她!\n\n所以, 马上,\
    \ 你老婆就会变成会计师, 清算你以前回家晚的罪过, 甚至, 还会翻出来很多其他的旧账。或者, 他会变身成律师。对你说 “你要相信我啊, 两个人在一起就是要相互信赖,”\
    \ 结果就是你有罪, 她反而是对的。\n\n你的本意是想让你老婆早点回家, 让她理解你的感受, 但由于你讲话的方式不对, 反而起了反作用。\n\n正确的沟通方式是你应该把那一句话的前半部与后半部对调。你应该说,\
    \ “老婆, 我很生气, 你昨天晚上那么晚才回家, 你又没有打电话回来, 但是我还是很爱你!” 这种讲话方式会让你老婆听了就觉得很你爱她。\n\n语言就是魔鬼的工具,\
    \ 谁完全理解了讲话的艺术, 谁就能操纵世界。开始讲的这个手段叫做 “糖衣效应”。\n\n把苦的药藏在糖衣里面，好让她容易吞下去。就好像我们小时候，妈妈为了让我们吃苦的药，就用糖果来诱骗我们一样的道理。你认为妈妈会不会叫你先吃了糖果，再吃苦药？除非妈妈傻。人类的记忆往往是记住最新鲜的，最近的事情与感受。因此，我们做人做事，讲话，好的东西，都要留在最后才拿出。\n\
    \n所以，作为老板，要清楚骂人的目的是什么？不要纯粹是为了骂而骂，要为了对方改变而讲话。这些先批评后表扬与肯定的手段，也是我经常拿来对付员工的，当然在营销的过程中，我也会先给客户介绍产品的缺点，然后再介绍产品的优点。\n\
    \n## 如何管理自己的核心谋士\n\n凡是成大事者，都必须找到自己的核心谋士，领导者的本事，是发现问题，指大方向。但解决问题是要留给核心谋士的。比如，刘备提出兴复汉室的大方向，找诸葛亮来想方案，给答案。宋江要替天行道，由吴用来想方案，想答案。朱元璋找到了刘伯温，曹操找到了郭嘉，司马懿。孙权找到了周瑜，陆逊！各位当老板的，你们可找到了自己的核心谋士？\n\
    \n不过今天不与大家谈如何找谋士，因为如何管理核心谋士更加重要。\n\n下过象棋的人都知道，象棋里面的老将边上有个士，那个士，就是谋士的意思，象棋是非常有智慧的，这个士呢，只能在老将周围的九宫格走，不能跑出去。也就是说，做老板的，要随时随地的把谋士带在身边，刘备当年为了给关羽报仇，想灭了孙权，就犯了这个大忌，我搞不懂他为什么那一次没有带诸葛亮，看来刘备不会下象棋。\n\
    \n象棋中的士是走斜线，按照我们的说法，就是侧着走，不露正脸，为什么呢？因为谋士很聪明，很有才华，他应该在幕后做策划，如果让他露了正脸，底下员工一看，哇，我们老板原来是个白痴，聪明的原来是那个谋士，这就会影响老板的权威性，毁坏老板的形象。所以，谋士只能支招，只能提方案，不可以当着大家拍板，拍板的事情，只能老板亲自做。\n\
    \n永远不要让谋士去基层搞执行，搞好了谋士信心膨胀，恐怕有自立门户或者取而代之的思想。这还算好的，大多数情况下是，谋士经常用脑，只是理论水平高，没有实际工作经验，这样的人是不能到基层去搞执行的。历史上有两个著名的例子，是谋士搞了执行，一个是领导赵国与秦国打长平之战的赵括，惨败后被秦国坑了40万士兵，留下了一个著名的成语，纸上谈兵。另一个是诸葛亮的谋士马谡，著名的空城计，就是因为马谡失街亭才唱的。\n\
    \n总结一下，管理核心谋士要注意的三点\n\n- 第一：永远把谋士带在身边，让他了解事实，出谋划策。\n- 第二：不给谋士拍板的权利，不可让谋士露正脸，拍板的权利永远在老板手里。\n\
    - 第三：不可以让谋士到基层去搞执行，谋士的理论水平高，就利用好谋士的理论水平就行了。\n\n### 老板的三种管理风格造就三种企业\n\n不同水平的老板，基本上决定了企业的规模，企业的未来。到底是混口饭吃呢？还是从优秀到卓越，亦或是基业长青。\n\
    \n先说第一种老板，靠自己性格管理企业的，想干啥就干啥，想讲啥话就讲啥话，认为自己对了，大家都必须听。完全凭喜怒哀乐，拍桌子，瞪眼睛的方法来管理团队。\n\n\
    我们中国的大多数小企业，小老板，几乎都是这种模式。这样的老板，除非老板本人英明得不得了，个人魅力强到爆炸，能把企业做大。否则，优秀的人才都不愿意跟这样的老板混下去，只能留下一帮混饭吃的跟随者。这种企业呢几乎就是老板是个强人！与其说是个老板，不如说是个勉强能混饭吃的项目经理或者说是个小包工头。这种企业也没什么未来。\n\
    \n第二种老板：知道建设企业制度，定流程，定政策，找管理方法，也知道出一些吸引人才的政策，也有能力引导大家行动。知道做绩效考核，知道给员工定目标，玩结果管理，玩目标管理。这种老板追求的是制度化，西方企业大多都是这样的企业，目前很多中国企业引进的管理模式基本都是这种模式。\n\
    \n其实这种企业有很大的毛病，就是越考核，人心越散。指标越精确，员工的满意度越低。这种企业的老板喜欢吹，我的目的就是要打造一个自动运转的机器，就算我离开了企业，企业照常运转。岂不知永动机从来没有造成过。不过呢，如果你想着这个方向来领导企业，建立一个优秀的企业问题不大！\n\
    \n第三种老板：会做文化的老板。世界上真正的大品牌，无一例外,走文化路线的。走文化路线，不是说一开始做规模，后来有钱了才做文化，而是一开始就是做文化起家，这完全是创始人世界观，价值观，人生观的展现。一般就是一句口号就体现了他们企业的宗旨。比如，诺基亚的科技以人为本；华为的狼性文化；微软的失败是成功之母！\n\
    \n这种文化不断的滋润着每一个进入这个企业里的员工，认同留下，不认同的走掉，最终形成一种特殊的人群。这种人群就是有这种文化的人的集合。\n\n只有学会做文化，才能影响到员工的头脑，也能影响到客户的头脑。这就是老板的最高境界，让别人从内心里彻底服；在这个层次的企业，才能基业长青。\n\
    \n在建设制度，定指标，讲绩效这样的境界上，只能做到优秀，最牛逼能做到卓越。\n\n靠拍桌子，瞪眼睛，老板牵头做项目的境界上，只能做到混饭吃。各位想成为什么老板，就选择什么样的手法去经营自己的企业吧。\n\
    \n### 不要跟员工讲道理只向员工要结果\n\n- 凡是想把公司所有事情解决完的老板，都是赚不到钱的老板，把心思只放在公司最赚钱的核心业务上的老板，就是赚大钱的老板。\n\
    - 无时无刻的保持研究市场，研究产品，学习知识，如果你拒绝这样做，你的竞争对手不会拒绝这样做，你就被淘汰了。\n- 老板不要太在意小钱，要想如何才能赚到更多的大钱，见小利则大事不成。\n\
    - 要让公司的员工有为自己干的感觉，所以，我给公司的每一个员工做市场的机会，每个人都有提成拿，只要你有本事。\n- 要为员工考虑未来，如果只考虑自己的未来，那么员工就不会跟你了，特别是优秀的员工。\n\
    - 不要以为自己是老板，就可以不上进，不上进就会被淘汰，不管你是谁。\n- 怎么才叫有胸怀的老板，就是敢把钱与权力分配给优秀的员工的老板。\n- 想尽办法让员工开心，奶牛听音乐开心了产奶量，质量都高，人也一样。\n\
    - 不要跟员工讲道理，只向员工要结果；越讲道理，越没道理，一要结果，啥都对了，大家都没话说。\n\n### 如何解雇公司员工？\n\n刚创业的小老板一般没经验解雇员工，甚至不知道那些员工应该解雇。由于刚开始，别人都瞧不上你的小公司，招人本来就很难。所以，很多老板招聘到了一些本来就找不到工作的人，这些人呢，就在你那个公司混日子。\n\
    \n老板要明确一件事，只要这个人在一定的时间内不能给公司带来利益，就应该立马解雇。\n\n解雇任何人都不要闹僵，要好言好语，说明公司的情况，为什么他需要离开，都可以告诉他。也切记不发员工工资，会导致员工去劳动局告你，甚至在网上散播你们公司的负面信息，导致影响你的业务。每个与你接触的人都是你的活体广告，尽量别给他们做你负面广告的理由。\n\
    \n创业人永远要保持头脑清晰，公司资金紧张了，该裁员就迅速做出决断。别拖。越拖钱越少。也别走漏风声，要当机立断。走漏消息的后果往往是节外生枝，麻烦不断。\n\
    \n解雇一个人，要讲清楚是公司经营不善造成的，不要怪罪员工无能，告诉员工可以在其他行业找到合适他们的工作，会有前途。\n\n如果你实在不擅长做解雇的事情，可以培养一个心腹，可以是您的人事，可以是你们公司的二把手，重要的是要确保他们不会破坏公司的形象，采取粗暴的解雇员工的方式。他们爽了，背黑锅的是你。\n\
    \n对于让你背黑锅的团队成员，不能让一个坑我们的人留在身边，理应开除。\n\n## 企业的末位淘汰制实施策略\n\n企业必须实行末位淘汰制，就如同古代军队打仗失败，有的人必须受到斩头的处罚一样，作用之一是激励将士们在战场上拼命杀敌，作用之二是震慑还没有上战场的人，让他们做好心理准备，必须拼命。\n\
    \n很多老板虽然知道这个制度，但不知道如何玩，今天我就讲三条实施策略。\n\n- 第一：分层次淘汰。\n  对做得好的人理应给予鼓励，做得不好就必须适当淘汰。但在实际操作中绝不能搞“一刀切”，否则倒霉的一定是基层员工。因为，淘汰应在企业的各个层次展开，经理、主管等各个层级都应有人员进行合理流动，这样才能体现末位淘汰制的公平性，不能一淘汰人就只针对最基层员工。\n\
    \n- 第二：合理安排被淘汰人员\n  推行末位淘汰制不能对“末位员工”一裁了之，这样会极大地伤害被淘汰员工的自尊心，也会打击那些仍然在企业内工作的员工的情绪。对于“末位员工”企业不应从一开始就放弃对他们的帮助和培训，只有当确定他们最终无法实现快速转变或是不能领悟、认同企业的价值观时，才让其转岗、降职，或者走人。\n\
    \n- 第三：明确末位淘汰的界限，避免形式化，注重实用。\n  竞争、淘汰是必须的，但淘汰周期应主要依据企业的人力的素质水平而定，当目标已经达到的时候，末位淘汰制就应该缓行，不能为了淘汰而淘汰。通常来说，末位淘汰的周期是最多一年一次，不可太频繁，否则就会出现人人自危的状况。末位淘汰的范围一般以小于5%的比例为宜，即100人的企业，一次淘汰5人。当然，这里个人并不是均匀分布的，有些部门可能一个也没有，而有些部门可能有多个，应视具体情况而定。如果企业能够招聘到非常优秀的人才，那么可以加大淘汰力度。\n\
    \n有些老板狠不下来心，这是不对的，企业不是养老院，不是慈善机构。能者上，庸者下。企业必须要有人流动，有新来的人刺激公司的老员工，有差的人离开，这样留下来的人才会警惕。铁打的营盘，流水的兵，只要保证公司的核心骨干在，并且不断培养核心骨干的后备队伍，企业就能健康发展。\n\
    \n### 哪几种员工必须裁掉？\n\n现在这个社会，赚钱在也不是靠人多，而是靠精英。所以各位老板不能再以前面10年的思想来经营自己的企业，现在很多人读了大学，但实际上他们的意识形态却是把自己当成一个工厂工人。目前社会竞争激烈，要想公司发展得好，利润高，在这个互联网社会立于不败之地，几种没跟上时代的员工必须开除或者不要招聘进公司。\n\
    \n- 第一：想过朝九晚五的安逸生活，还想要双休的人，还要高薪的人，不要招聘进公司，其实就算他要底薪，要双休，要朝九晚五，不要招聘进公司。因为会影响一个不断奋进的团队，给团队树立不好的榜样。\n\
    - 第二：想靠高底薪生活的人，特别是销售岗位，推广岗位，居然有的人要求高薪水，很是搞笑，这些岗位就是靠能力吃饭的，靠提成吃饭，能零底薪就零底薪，尽量高提成就行了。\n\
    - 第三：来公司图稳定，没有企图心，不想赚大钱的人，这样的人呢，典型的想找个公司混日子，这样的人适合当门卫，千万别招聘到公司里。\n- 第四：不能与时俱进的学习的人，不善于主动学习新东西的人，不要招聘进公司。\n\
    - 第五：做事马马虎虎，得过且过，没有精益求精的精神的人，也不要招聘进公司。\n- 第六：老是给自己公司找毛病，比如，你让他卖一个产品，他就说这个产品太贵，客户不买，你让他去做一个事情，他就说这个事情有难度，不好做。他不会主动想办法，直接开除。\n\
    \n现代企业，绝不是拼人多的，而是看那个企业里精英多。\n\n与其招聘一群能把人气死的人，不如招聘一个优秀的人才。特别是互联网行业，一个优秀的人能顶不优秀的十几个人。\n\
    \n以前的社会是把企业做大，比规模。以后的企业，是把企业做精，做小，比利润。\n\n## 老板如何处理手握重权的害群之马\n\n齐景公当年问晏子，就是晏子使楚的那个晏子。说，晏子丞相：你看当国王最怕什么呢？晏子说：当国王最怕老鼠与狗。\n\
    \n齐景公哈哈大笑：我怎么会怕老鼠与狗，你倒是说说。\n\n晏子说，我们老家拜祭祖先的时候，上了很多贡品在祖先的牌位面前。但是看到一只大肥老鼠，在上面吃贡品，我又不敢打，不是不抓老鼠啊，是怕打老鼠，老鼠在祖先的牌位台子上乱跑，我跟着打，把祖先的牌位都给打倒了，这可不得了。\n\
    \n这就叫投鼠忌器啊。\n\n齐景公问，那如何是好？\n\n晏子说，好办啊，用其他食物把老鼠诱感到更加空旷的地方，或者等到他到空旷的地方了，在下手，把老鼠打死。\n\
    \n齐景公说，这样讲起来，还真是怕在祖先牌位面前的老鼠啊。\n\n最近，我有个VIP学员问了我一个问题，说他有个游戏公司，创业的时候呢，这个游戏公司的核心程序被一个程序员拿在手里，而这个家伙老是不听指挥，不服从管理，动不动就以销毁核心程序威胁公司，问我怎么办？\n\
    \n我开始的策略就是这种人坚决要清掉，不管付出多大代价。后来知道投鼠忌器这回事情了。就出一个方案，先不动声色的给这个坏蛋程序员招聘一个副手，这个副手的目的就是要拿到这个核心程序，拿到这个核心程序了，就可以直接把这个坏蛋程序员干掉了。\n\
    \n我们做大事的人，一定不要冲动，不要感情用事，要用温和的手段处理这些矛盾的事情，把损失降到最低，最大程度的保证自己的利益。要把老鼠引诱到空旷，冷静的地方，一次性就要了它的小命，千万不要与其发生直接冲突而造成自己承担不起的损失。\n\
    \n### 不站在老板立场的员工没前途，没有员工思老板做不大\n\n每个人都想要别人顺从自己的欲望，特别是当老板的，总是希望员工顺从自己的欲望，但很少有员工从内心里顺从老板的欲望。\n\
    \n我们做老板的其实是可以利用这一点的，不必要让员工都有非常高的觉悟，要顺从自己的欲望。\n\n老板可以顺从员工的欲望，以帮助员工完成心愿的姿态来经营员工。比如“打土豪，分田地”老百姓都想完成这个心愿，那么好，你们跟我一起闹革命，就可以完成你的心愿。\n\
    \n比如员工想买房子，买车子，那么好，我来帮你们完成这个心愿，你们把工作做好，我来辅助你们把工作做好，这就是让自己的欲望顺从员工的欲望，这样的思路来经营员工，就会顺畅得多。成就了员工，也成就了自己，顺便自己赚钱了。\n\
    \n对于员工来说呢？你必须要站在老板的立场上来思考与处理任何问题，老板会重用你，你才会爬得快。\n\n对于乙方来说，你要站到甲方老板的立场上去思考，处理问题。这样就会感动甲方老板，合作就会长期愉快的进行下去。\n\
    \n当然，如果你是老板，必须要有员工思维，凡事要站到员工的立场去看一看，服务员工，关心员工，帮忙员工，员工就愿意为你卖命了。\n\n对于企业来说，要始终站到消费者的立场，实实在在的为消费者建立起别人做不到的产品体系，服务体系，自然也就把生意做好了。\n\
    \n给大家举个例子：\n\n曹操在讨伐东吴的时候，孙权开会讨论是投降还是打一架，有很多人都是主张投降，大家都说，刘表的儿子都投降了，还封了官，我们也投降了算了。\n\
    \n鲁肃趁孙权上厕所的机会，就跟孙权说：“老大，我们当臣子的可以投降，你不能投降。”孙权就问为什么，鲁肃就说我们做臣子的，换个皇帝，还是一样当官，投降了，家产官位都有保障，你投降了，曹操让你做什么官呢？”孙权一下子就明白了，他必须跟曹操干一架！\n\
    \n这也是为什么后来鲁肃被视为孙氏王朝心腹的原因，因为鲁肃是真心实意彻底为孙权考虑的人。也就是说，鲁肃是站到孙权的立场上满足孙权的欲望的人。\n\n我在我们企业里开会，一直都是以彻底帮助伙伴们实现财\n"
