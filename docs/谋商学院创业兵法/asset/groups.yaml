    # 要推动一个社会的进步，必须从利益角度想


    四川大地震的时候，有位老师很快逃离了教室，事情曝光后，有不少人开始骂这位老师，讲什么为人师表，不应该丢弃学生。


    其实一个人在危险的时候，只管自己逃命是本能。某些人就是希望牺牲别人，成全自己，不断的教育别人当傻瓜，自己当聪明人。可惜人的本能会帮助他变得理智。就算他答应了你当傻瓜，但真正遇到事情的时候，他还是会当聪明人。


    所以，我们作为老板，少给员工讲什么要为了企业这个大家庭应该怎么样，少讲要为客户服务之类的话，少整些企业文化给员工洗脑说得冠冕堂皇，不就是想少给员工钱，还想让员工拼命给你干活嘛，凡是打这个算盘的人，企业很难做大，因为他违背了人性。员工只想给自己干，不想给别人。


