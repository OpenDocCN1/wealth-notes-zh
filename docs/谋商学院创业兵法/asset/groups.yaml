    # 面谈


    得这些优秀品质，很多东西都可以无师自通。


    第一个品质，耐力。我们很多人做事有爆发力已经很不错了，他能持续拼搏一小段时间，但是不能长久的拼，这样的人注定只能给别人打工。我昨天早上长跑了12000米，今天早上长跑了14000米，我喜欢长跑。因为长跑最考验一个人的耐力，我计划以后平均每天早上16000米的样子。很多跑步的人跟我一起跑步，开始的时候，他们能跑上三四千米，可是他们很难继续下去了；如果你想锻炼自己的耐力，可以开始学习长跑。


    人活在这个世界 上，要做事业，要赚钱，你需要选定一个领域，首先，你需要往前跑，不一定要是这个领域里跑的最快的，但是要跑得久。大部分人都跑不久，他们迟早换行业，而如果你跑得久，那么优势必会积累下来，最终成为行业王者。需要注意的是，跑得久不是说你在这个行业混着，不能三天打鱼，两天晒网：你需要持之以恒的跑，只要跑，早晚都会达到目标。


    第二个品质，懂得分享。


    人是群体性动物，要赚到钱，就必须学会在群体中获得支持。大家都帮你，不是因为大家是雷锋。而是大家知道你成功了，他们也能获得果实，他们才愿意帮你，所以必须要懂得分享。


    人际关系的好坏，决定了你的地位与荣耀，进而决定你的钱袋子，如果你想让一帮人死心塌地的支持你，你必须让他们分享你的物质财富，精神财富。分享你的痛苦与快乐，让大家感觉到你可贵真实。帮助你就等于帮助他们自己，这是你能够坐着数钱的立论之一。


    吃苦精神也很重要，做任何事情如果不付出艰辛的劳动而想做好是不行的，很多伟大的事情都是由又单调而乏味的小事情构成的。'
  - '[PAGE 108]


    这个世界上，除了你的父母会无私的给予你钞票外，大概就只能靠自己获取了，说句很多人接受不了的话，包括你的老婆或者老公，都做不到无私的给予你钞票。我们要清醒的认识到这个社会现实，所以我们要锻炼自己的吃苦能力，因为你不吃苦不行了。


    # 第三：果断的精神。


    果断为什么要提出来呢？因为人的一辈子不断的面临着选择。有了果断的精神，能让我们节约不少犹豫的时间，我也碰到很多反复思考决定不了的事情，索性抛硬币决定，因为犹豫太浪费时间了。很多事情只有在做的过程中，才能具体的了解，在选择上浪费很多时间，是极其划不来的事情。


    与果断配合起来的一个品质就是坚持，当你选择好了一件事情的时候，动手去做了，就别老是想其他的事情，你必须坚持去做，只有坚持去做，你才能在这个领域获取更多的经验，更多的资源，积累人脉，积累知识。而如果你经常换，那么是很难成长的，深入一个行业才能挖掘到巨大的利润。我们选择好了，就要准备做到别人永远也达不到的
    高度，走出别人走不出的距离，即便是很多人说，马上就到尽头了，也别停下，继续走，走到尽头，往往又会有新的路。


    # 第四：专注。


    我们每一个人，其实一生能做好一件事，就能荣华富贵。


    现代很多人看似懂得很多，其实呢，没多大用处。一个人不要炫耀你懂得多，只要有一门拿的出手的本事就算你厉害。如果你把你钻研很多东西的时间都专注到一件事情上来，可能你的生活品质早都提升了好几个档次了。我以前喜欢读很多书，好像什么都知道点一样，但是呢，自己也能感觉到，自己是个啥都不会的人。后来，我每天早上必读《道德经》由于持续不断的读，我几乎没有用心去背，就发现'
  - '[PAGE 109]


    我也已经会背了，并且这部书融入了我的潜意识，我做什么都会想起这本书上的句子，这种感觉就很好。这或许就是专注所带来的力量。所以读书这件事情上，我建议大家广泛阅读，而精读一两本好书。


    # 第五：奋斗


    为什么要奋斗？因为对于普通人来说，只有奋斗能改变你的生活品质，能改变命运。人有可能靠一段时间的运气好而赚到钱，但不可能一直运气好，而如果一个人有奋斗精神，就算在逆境中，他也会过得越来越好。我们很多创业成功的人，实际上都把成功归结为持续不断的努力奋斗，可见这种品质是多么的重要。


    这五个品质，非常重要，是道的层面，老板学得就是道，员工学的是术；道的层面的事情做好了，术的层面的事情就水到荣成，自然就好了。


    # 复制已经成功的业务，少创新


    很多企业的大成功其实不是创新的成功，而是复制的成功，例如大部分连锁企业。有一些企业的做法甚至不是复制自己的成功，而是复制别人的成功。复制与创新，就像自然界的阴与阳，谁也离不开谁很多企业的问题不是缺少创新而是缺少复制已经成功的业务。


    最近碰到一个老板在做明年公司的战略，请我帮他把把关，出出主意。在他的计划中，我看到非常多新奇的创意和想法，在现有的3个产品之外，他还想再做两个新产品。在现有的渠道之外，他还要添加3个新渠道。在现有的客户群之外，他还想增加两个新客户群。在现有的几个销售模式之外，他还想再尝试一个新模式。当他描述他对未来创意的时候，我看到他陶醉在自己的梦想中，他的眼神里充满了对2016年无限的期待。这是很多老板常常犯的毛病，稍微有几个小钱或者是原有业务稳定盈利后，总是好大喜功，想要发展几个新业务。'
  - '[PAGE 110]


    我感觉到，他希望从我这里得到对他一个人花费了大量心血做出来的计划肯定和赞许。但我给他说，非常抱歉，在你的计划里，我看到的是创新，创新，再创新，却没有看到一点点更现实的复制。一个真正聪明的创业者，是只要找到一个赚钱的业务了，就会在这个业务上不断深挖。


    其实一个年度计划里80%应该是复制，20%才是创新，我问他：你总结过没有，在过去的一年里，你们什么地方是做得好的？在你的计划里，有没有把已经经过验证的过的，赚钱的业务不断的复制，复制再复制？他说这些他没有多想，因为感觉那些事情大家都已经道，重复一个已经会做的事情对他来说没有什么挑战性，他作为老板首要任务是带领大家创新。


    不要图新鲜，把老业务做到极致，做到行业老大，做到垄断，就有够多的利润让你爽了。


    创新的确是重要的，没有创新，没有独一无二的追求，一个企业不可能走远。但只知道创新，不知道把成功的业务通过复制放大到无法再放大，这也是错的，而且这个错误可能是我们做老板的最容易犯的，也同时是最愚蠢的错误。


    为什么说这个错误愚蠢？我们都知道老熊掰棒子的故事，我们都会嘲笑老熊的愚蠢。但很多公司众多创新的命运不是和老熊掌中的棒子一样，被拿起又被扔掉了吗？


    一个企业只要有一个赚钱的主营业务就行了。把自己的人才，资源都投入到这个主营业务，经营好他。


    很多企业的大成功其实不是创新的成功，而是复制的成功，例如大部分连锁企业。有一些企业的做法甚至不是复制自己的成功，而是复制别人的成功，你也可以骂他不道德，是抄袭，但别人依然是成功'
  - '[PAGE 111]


    者。例如很多人认为腾讯就是这样成功的。应不应该复制别人的成功是另外一个问题，但复制自己的成功是没有任何道德问题的。


