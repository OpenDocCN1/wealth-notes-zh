    投资公司，这种生意也是轻型资产，几个风头（注：应为“风投”），几部电话就行了。这也是我发展的方向。不过我的投资方向是只做互联网。本来以前我就是搞程序设计、做网站、网络推广这些东东的，做起来也轻车熟路。


    这类公司还有：广告公司、设计公司、策划公司、律师事务所、人力资源猎头。做生意，大家就选择这样的生意方向，爽到颠。


    第四：可以任意搬迁，不受地域限制，全国范围内（注：原文“范围类”改为“范围内”）跑都可以。


