    # 心智模式决定人的贫穷与富有


    一个人到底是贫穷还是富有，其实跟外在的环境关系不大，主要是自己内心的心智模式是什么样子的。


    学过物理的人都知道，钻石与煤炭都是碳原子组成，但钻石坚硬无比，煤炭就没那么硬了，钻石晶莹剔透，煤炭乌漆墨黑，仅仅是因为他们的碳原子坚的排列方式不同。美国有一个跟踪那些中了大奖的贫穷普通人的调查，发现过5到10年，这些人又贫穷了。


    以前我有个经验，我读小学的时候，是班里的第二名，读初中依然是班里的第二名，读高中依然是班里的第二名，当初不明白是怎么回事，现在明白了，其实我当初的心智模式就是第二名，放到任何一群人中，我都会去找准这个位置，与能力无关。


