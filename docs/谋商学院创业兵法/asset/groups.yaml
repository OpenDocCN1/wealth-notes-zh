    史玉柱说过，我招聘人，就是要考验一个人的逻辑，如果一个人的逻辑有问题，那么，是很糟糕的，是不能用的。


    这就解释了，为什么那些世界 500 强在面试的时候，往往出些非常巧难人的逻辑题作为面试的第一个步骤。看看你能得几分。不及格的，直接就毙掉！


    我给大家讲个商业案例，当年李宇春做为超女第一，拥趸无数。可口可乐和宝洁的佳洁士牙膏，也是各自领域的第一，就找李宇春来代言，这个逻辑有错么？


    作为巩固品牌地位，这种广告策划似乎很对啊！但微小的变化，没有精明的逻辑思维，是看不到商业逻辑的变化，就会带来灾难性的后果。


    李宇春第一个代言的品牌，是神州电脑，一个二流品牌。商业逻辑是：既然那么多人狂迷李宇春，由李宇春代言的东西，可能会引发“歌迷”的倾向性购买，这样，会新增购买用户。没错，这个逻辑，对二流品牌神州电脑来说，是成立的，而且，神州电脑做为第一个找天娱：媒购买李宇春的，价格上，还占便宜！


    注意，这笔交易天娱传媒吃亏了。因为第一流的电脑品牌，这时就不会购买天娱传媒旗下任何一个艺人了。想想，联想会不会购买周 笔畅？肯定不会！不关价格的事：神州买了超女第一名，联想买第二名？岂不是默认低神州一头？所以，过了好久，我们才看到，电脑领
    域，同样是二流品牌的 TCL 购买了张靓颖。


    天娱牛就牛就在于，脑筋够快，转身够猛。反正电脑类的'
