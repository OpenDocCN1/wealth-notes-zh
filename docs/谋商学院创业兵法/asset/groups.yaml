    恐惧源于未知，对于未知的东西，我们会采取一种消极防守的态度，这不仅是你的本能，也是你团队成员的本能。就算你能说服自己冒险试一次，你的团队未必这样想，当冲锋号吹响的时候，只有你一个人冲上去又有什么意义呢？


    我们这一课说的就是，你要考虑团队成员的心态和情绪，他们随时打算扭头就跑，这仗能赢岂不是很奇怪？


    +   二、选择小项目，越小越好。


    就是降级思维一让你去考高考，你可能没把握，但是让你去考'
