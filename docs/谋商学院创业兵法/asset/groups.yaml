    ## 互联网创业趋势与建议


    比如百度贴吧等能够定向传播广告，百度的 SEM 等等，都可以实现定制化的广告传播，企业也能定出更合理的价格。


    第二：物流行业的发展，使我们的产品可以成本很低卖到全国，甚至全球。运输、交通的发展，也使得很多人都可以远离家乡工作或者出游。旅游业以及相关产业在未来 10
    年会越来越牛逼。


    第三：今年的两会特别提了一个热点，就是创业。国家对创业进一步放松了管制，对金融体系、小额贷代、互联网金融放开了很大的口子，特别提倡了“互联网+”这样一个概念。国家的方向如此，我想互联网这个行当的创业，大家需要仔细考虑一下，怎么能在这个行当捞点好处。


    第四：产业之间交集越来越多。新的创业机会往往孕育在两个或者多个产品的交融处，很多产业之间的界限越来越模糊，大部分生意与互联网结合将是一个强劲的趋势。


    第五：硬广告、传统媒体的衰落，互联网、微型媒体的崛起，社交媒体的崛起，很多借助社交媒体、互联网的企业都有较大的利润、较好的发展。微信会进一步崛起。互联网的发展使得很多企业不再依靠传统分销渠道，可以直接与客户沟通，中介的日子越来越不好过。


    第六：由于很多企业采取了互联网的营销手段，自己给自己做广告，结束了以前的电视、报纸的广告时代，使得产品的成本迅速降低，变相的提高了消费者的购买力。并且消费者可以在网络上
    24 小时邮购企业的产品，购买企业的产品，打破了地域限制与时间限制。


    团购网站的出现，进一步增加了消费者的议价能力，并让消费者享受到了折扣优惠。


    第七：企业可以借助云计算、大数据等进一步搜集用户信息，消费者关注的焦点，甚至可以精确的推断出自己的创业方向有没有市场。企业可以进行有针对性的生产，比如大家可以用百度指数，去查找自己想像的产品，看看每个城市以及全国有多少人在关注你要做的这个产品，都能够推导出市场大概有多大。这是史无前例的进步。


    第八：消费者越来越想参与到企业的生产过程中来。消费者越来越有主人翁精神，比如小米的成功，就是因为开始小米有一个论坛，大家都在里面讨论这个手机要怎么设计，要有什么功能，用什么材料。最后产品出来了，大家就对这个产品有感情，自然就卖的好，因为有参与感嘛。


    第九：以前是没有办法，只有电视、报纸，大家被迫接受广告信息，媒体很强势。现在，大家在互联网上，只要感觉不爽就换，就关掉网页了，人们会越来越理智，避免购买进行过度营销的产品。所以，我们要做小而美，精细化的产品给用户，粗放型到集约型的转变是必然趋势。


    ### 最好赚钱的行当，就是你自己最熟悉的行当


    渠道可以变到互联网上来，或者你想方设法如何变成互联网企业就行了。很多人都以为别人的行当好赚钱，实际上要赚到真金白银，只能在自己熟悉的行当升级，变通。


    大量的传统企业老板不懂得互联网营销，不重视互联网与传统生意结合。其实，这就是愿意学习的人的机会。甚至，很多身无分文的人愿意学习互联网，在互联网上做起了生意，也有钱赚。


    知识就是生产力，财务知识、企业知识、投资知识，合起来就是致富知识。一个人头脑里有什么知识，就会影响其思想，进而影响其行为，再进一步就影响其事业，最后就影响其生活品质。


    比如当年我脑袋里拥有的是战士、法师、术士、盗贼的关键词，我明显是个游戏脑。我的脑子都用去打游戏了，所以生活过得很惨。


    后来脑中拥有的是 MFC、SQL、C++、JAVA、PHP，明显是个程序员脑子，只能领一份薪水度日。


    再后来脑中拥有的是绩效考核、目标管理、公司的财务报表、资产负债表，明显是老板的脑袋，收入有所提高。


    再后来拥有资产收益率、资产回报率这些概念，这些明显就是投资人的脑袋，生活水平进一步提高！


    富人是靠知识与概念赚钱的，普通人靠体力赚钱的。从现在起，若想富有，你就可以改造自己的脑袋了。


    社会鼓励任何人负债，政府会减免你的破产税收，但是会加高你的收入税收。社会在鼓励人变成别人的债务人，大家不要上当。很多没脑子的人就被别人坑了。昨天课上有人问我，金融是什么意思？对于普通人金融的意思就是让你无缘无故的欠别人钱，把钱平白无故的送给别人。对于懂金融的人，就是把不懂的人的钱转移到自己的钱包里的游戏。


    财务知识认识的越深刻，你就能注意到你眼睛看不见的东西。你可以选择变成债务人，也可以选择变成债权人。而如果你不懂这些知识，你就没有能力做出对的选择。


    赚钱的创意从哪里来？一靠积累，二靠套路，二靠抄袭。营销趣想，赚钱的手法、项目，都是靠积累，靠固定的商业套路，靠抄袭已经赚钱的人的模式。请大家注意“已经赚钱”这几个字。


    积累是每时每刻的生活积累，你随时随地都在向你的收藏夹里添加东西，当然也随时随地删除那些质量不好的东西。随时你都在打草稿。套路就是好方法用 100 遍，有用的招
    100 年不变，抄袭就是要明白你想干的事别人早都干过。


    这个世界上最发财的套路已经有人在用，你需要的就是把别人发财的套路、原理都看懂，你把他变成你能驾驭的模式就行了。


    人的成功，不是找到新奇的方法，是找到老的方法、旧的能用的方法。聪明的老板不是喜欢新创意，而是要阻止其他聪明的人扯出来一个新创意、一个新业务、新项目，只走自己熟悉的路。


    ### 创业最难的不是管理战略而是从零到一即第一单


    创业，最难的不是以后的管理、战略，以及公司所谓的各种尾事。实际上刚开始创业的时候，我也没有经验，老是跟人谈论战略未来、管理、股权分配等没有意义的事情，甚至可以这样说，创业连租办公室都没啥意义。我刚开始创业的时候，也鼓动我的合伙人一起租了一个豪华写字楼。最后发现，晕大了，根本就没有客户来看我的写字楼，但天天在烧钱。后来实在坚持不下去了，就把一切用钱的地方几乎是砍了个精光，只留下吃饭的工具，然后我忽然发现，豁然开朗了。现在我只需要谈业务啦，什么都不用管啦，把自己当个业务员就行啦。结果就是由于精力相当集中，完全集中到业务这个点上，很快就谈了一笔业务。我什么也没有，就直接把这个业务顺给同样产品的其他公司，我就拿了个提成。然后继续谈业务，拿提成，联系的公司越来越多，我的业务也越来越好，水到渠成的自己就组建了一个团队。


    所以，我发现，创业是个水到渠成的事情，就像栽树苗一样，从一颗种子开始培养起来的，而不是直接长成大树的。也就是说，我认为，直接租个豪华写字楼，相当于直接成长为成熟的公司了。开始的时候，招聘一个人事部门主管，都是没必要的。当业务成长到一定的时候，不得不招聘行政部门才招聘。这就是我认为的水到渠成的创业。当然如果你背后有足够的养料，你可以直接成长为大公司，每个辅助部门都配备起来，比如你有风险投资。否则，还是不要违背规律的好，按部就班的找到你的第一单，慢慢做大，不要急，也不要放弃。


    最难的是第一单，也就是从 0 到 1。


    从零到一，意味着，你开始有了业务了，也就是说，你终于进入商业的大门了。你为自己赢得了肯定，同时不再怀疑未来。能够坚定的付出劳动而不会去怀疑这样干下去会不会成功，这非常的重
    要。


    第一单的付出是巨大的，因为创业的开始，我们都不知道怎么赚钱，我们需要探索，需要实验。需要掏自己的钱出来支付房租、水电、饭钱。其实我一般建议大家开始做点非常小的生意，找找经商的感觉，就算摆个地摊也好。其实我认识很多老板，最开始都摆过地摊，因为，摆地摊成本极低，而赚到几十块钱，会给自己极大的信心，就是说，你看创业的书，或者说是听我讲课，他不能给你商业的感觉。这就像看黄片，虽然你看到了，但你没有摸到手，这个女人到底是啥感觉，你实际上是没底的。摆地摊能让你快速的找到商业的感觉。


    其实就像第一次谈恋爱入洞房一样，800 年没有见过女人了，以 为自己已经是谈不到女人了，但是终于，终于通过自己的努力有了第一次。这个时候，人的心理会非常的激动，进而变得坦然。进而有了信心，下一次自然，就能轻车熟路。我的第一笔生意是读高三的时候，卖传奇这个游戏里面的一个手镯，给一个网吧里小孩子，我记得，我是
    60 块买过来的，转手就卖 85 块，还记得那个网吧叫“红润网吧”。那时候，一个农民工一天得工资也才 50 块吧，而我只用了 10 分钟，赚到了 25 块，这种感觉，就爽到爆。从此我就爱上了倒卖这门艺术。


    创业，一定要找到自己的“第一滴血”，后面做生意，就有底了，如果跨不过第一道坎，那么就会一直很苦逼，如果跨过去了，你就再也不会去打工了，因为自己给自己赚钱这种感觉非常爽啊，所以，竭尽全力的去挖掘自己的第一个单子吧。永不言弃，前途光明，一旦放弃，堕入地狱。


    ### 草根创业步骤先学技术赚小钱再用小钱赚大钱


    其实，作为一无所有的 N 无人员，想要做生意，最可行的路子都是先学一门技能。实话实说，商业的本质就是交换，你总得拿一点什么，去换另一点什么。


    一无所有的朋友，唯一还有的可能就是一点时间了，所以拿时间去换技能，拿技能换小钱，拿小钱换大钱，几乎可以说这是唯一可行的路子。


    我经常听到一些摆小摊的创业者讲技术不重要。确实技术对有钱人来讲，可以说毫无意义，但问题你是草根。


    问题就在于，很多人想做生意，就是因为他们一无技术，二无学历，错误的，或者说自我欺骗的认为，做生意不需要技术。也是，如果他们学历高，技术强悍，也不至于混到要去从摆小摊开始那步。


    可是这事就是这么无奈，如果你没有大量的资金投入，你要从零起步，还就得靠技术强悍赚第一桶金。


    别说什么我精通营销、管理、投资、运营。策划纵横，算无遗策，科事如神，运筹帷幄，决胜千里，所以我就不需要学技术了。


    技术不能让你赚大钱，但是能让你赚小钱，你得先赚到小钱，然后才有机会赚大钱。因为我们说的这些各种社会能力，都需要有一定的“小钱”作为支撑。做生意就是一种赚大钱的方法，但赚大钱这事就像是上赌场一样，你得先有本金，别人才会跟你玩。


    因为你说谋略纵横也好，说权谋手段也好，说营销管理也好，这钱东西统统都有一个共同点，就是和人打交道。而要和人和交道的关键前提是，人家愿意和你打交道，愿意听你说什么。


    在你一名不文，一无是处的时候，你的号召力、影响力、公信力都是零。中国的武术界有一句话“一力降百会”，力都是零了，你再精通四拨千斤，零力能拨动几斤？


    具体一点说，如果我们真的去摆一个卖豆浆的小摊，假设我们资金上的投入比较多（五十万以上），我们说说服一些有能力的人跟我们干，这样具体的很多事（包括技术）都可以交给他们负责，而他们也愿意尽心尽力跟着你干（因为有前途），在这个前提下，我们才有可能腾出时间精力去思考怎么策划，怎么营销，怎么定位用何种战略。如果你没有钱，但是你的技术牛逼，是当地公认的“豆浆大王”，这样也可以忽悠到一些有能力有前途的人，尽心尽力的跟着你干（因为有前途）。只有在满足了能忽悠到人这个前提下，你才能用上战略、营销、管理等等技巧。


    如果不是这样，再怎么精通社会技能，去摆个小摊从零起步，兔的生活会变成这样：每天半夜起来磨豆浆，从早上一直卖到下午 4 则亏损本），累得跟狗一样，回到家挨着枕头就睡着，因为人的时间精力是有限的。这样，还战略个啥，还营销个啥，还管理个啥？熬个几年，身体吃不消干不动了，就是去做个门卫保安的下场。


    所以在这里，我反复说，希望一无所有的朋友认真真的去学一门技能，手艺，从“蓝领”这个角色做起。这条路不速成，但却是踏实可行的，而且万一你以后生意做失败了，靠一门手艺你也不用去做保安之类的工作，收入好歹有个保障，能养活妻儿老小。当我个人是个浪漫主义，选择了创业，那么就必须得干成，坚决不留后路。


    经常有人来问我，有什么手段，有什么方法？能完全从零开始，你把肾卖了，先弄个五十万本钱，咱们再来谈如何营销，如何管理，如何忽悠别人给你卖命，如何让消费者心甘情愿的掏钱。


    实际在我看来，精通心理学、行为学等等高深学科，远远比把豆浆磨好更难。如果换个位置，叫我去干这事，我有 100% 的信心做出全城最好的豆浆来（或者其他什么产品）。但是，如果我的产品和别人一样，甚至不如别人，你叫我通过营销等等手段方法竞争过对手，理论上是可能的，实际上是不可能的。


    因为如果我的产品不如对手，势必销量和利润都不如对手，而且生意小，这样就赚不了几个钱，只够勉强糊口。那我显然就请不起员工和师傅了，只能自己起早贪黑，疲于奔命。在这种情况下，别说我能策划把苍老师或者干露露请来轰动一把；就是你叫我天天拍照片编故事发微博微信，我都做不到。


    更何况，摄影和文案写作这种神功没个十年八年的努力根本练不好，退一万步讲，就算我有时间精力去写，有没有人肯关注呢？（当我有信心，因为这两项我都有基础和投入，但是你呢？）


    好吧，你说我做不到，我和人合作总行吧？那你去问问汪小菲，海底捞，如果你的产品不是全城数一数二的牛逼，他会不会和你合作？怎么样，是不是绕不开这个门槛？


    归根结底，与其去想这些远水救不了近火的事，不如老老实实就把产品做好。但如果你不愿意在产品上下功夫，要在营销上发力，问什么好的不花钱的方法？那就只有微营销，微博微信，你要把援文字都练到足够吸引群众的眼球，没有十年八年的功底是不行的。


    把产品做好确实不容易，但是把营销做好就容易吗？


    就这点小生意，要把产品做好，相对不难，但是产品不行，而且没钱没能力，没影响力，号召力的基础上，要把营销做好，那就难如登天了。说到这里，仿佛又扯到了产品制胜还是营销制胜？其实都不是。


    这是一个战略问题，处于白手起家的阶段，把资源（钱时间精力等等）砸在产品上，回报会丰厚很多。尤其是小本生意，支个豆浆摊子，还打算花百八十亿搞个央视标王是怎么的？


    把产品做好了之后怎么发财赚大钱，这才牵扯到营销管理经营这些问题。你做到至少全城第二之后，再来考虑，这不是说产品比营销重要，而是做事要分阶段目标，阶段不同发力点不同。


    结论就是，一无所有的人创业，先学一门技术，用技术换小钱，用小钱换大钱。再细致一点，就是你要先能出个像样得活，才能营销。不要想着空手套白狼。虽然我就经常空手套白狼，但是，我有十几年的营销功底，玩创业也七八年了，但你呢？所以，希望大家慎重的理解一下。


    ### 创业初期是认准一个项目死磕还是打游击战


    创业初期是认准一个项目死磕还是打游击战？创业需要有激情，有干劲，但也必须得有计划有谋略。


    其实创业这个词，古代一般都是形容开辟江山当皇帝。还记得诸葛亮的出师表吗？开篇就是“先帝创业未半而中道崩殒”。所以大家干创业这件事，实际上在古代就等同于打天下了。打天下要胆量，有激情。但还得有计划，有谋略，古代呢，一般军师就是干谋略，筹划这个活的。


    现在，我就给大家当回军师，解读下创业初期到底是认准一个项目死磕出利润呢？还是见什么做什么？有奶便是娘。


    假如我们认准一个项目死磕，我想说的是其实非常牛逼的战略眼光很难形成。很难在开始的时候，就知道做什么一定能成。创业经常是，眼中明明要做成 A 项目，结果开干的时候干成了
    B, 干着干着项目变形成了 C, 结果最后赚钱却是在 D 上面。


    这个世界确实有很多牛人，一干就干成了大事。比如马云确定干阿里巴巴电子商务，他就干成了，刘强东确定干京东他也干成了。但是别忘了，这些家伙条件很好，有强大的风投在后面支持他们烧钱玩，他们有资本犯错。


    但我们大多数创业者囊中羞涩，都是小本创业。如果死磕一个项目，会发现还没开张呢，口袋里的钱己经所剩无几了。我们没有实力去一年，两年的试错。有强大资金实力的人，可以认准一个项目，不断的做探索市场，反正失败了再来就是了，钱花不完，所以我建议小创业者还是选择打游击战。


    游击战是怎么打的呢，就是一开始直接奔着利润去的：什么活赚钱，我们又有能力干，我们就干什么。先保证能活下去，活下去才有希望。


    在打游击战中，最重要的一点是什么呢？就是我们要不断的去寻找自己那块“根据地”。这块根据地就是在打游击战的过程中，发现的可以盈利的商业模式。找到了这个能盈利的根据地过后，我们就要开始根据这个特定商业模式打造团队，定战略，做运营。一般情况下，一个企业取胜是因为团队、战略、运营都非常强。我们到底突出那一块，要根据创业者自己的特长，着重培养自己的长处。比如我们就是擅长团队管理，那么我们就可以在这个根据地上培养出出的王牌团队。比如我们就是擅长于项目运营，那我们也可以重点培养运营的本领。这其实就是商业世界中的构建壁垒，我们在打游击的过程中，发现了一块根据地，然后我们根据地理位置，根据我们自己的能力，开始构筑自己的防御壁垒，开始练兵，以便于保住老巢，扩大战果。


    打游击的过程中，切忌打成了流窜犯，就是喜欢上了打游击，从来没建立自己的根据地的意识。我们伟大领袖毛主席，有一句话“革命要有根据地，就像人要有屁股！”我们党有很多敌后抗日根据地，井冈山，延安等等。就说明了打游击战的过程中，要注意建立自己的根据地。


    ### 草根创业初期采取短期目标管理


    战略是干出来的，不是想出来的。现在很多创业者由于看了太多马云、史玉柱、潘石屹，老是喜欢谈天马行空的战略，谈企业规范化谈管理制度。企图用这些理论去带领初创团队创业成功。这简直方夜谭。这些人已经是成功人士了，基本上是功成身退的讲话模式，而不是创业初期的创业者应该学习的。所谓战略，是走一步看一步，一步一步干出来的。所以邓伟人讲：“摸着石头过河！”就是这个道理，哪里有什么先见之明？哪里能算到后面几十年的事情？伟人在厉害，他也不是上帝。


    那么创业者到底应该用什么样的理论指导自己呢？就是把精力用在短期目标实现上。邓伟人的另一个理论：“不管白猫黑猫，抓住老鼠就是好猫！”一切为了生存，先生存再求规范化，再求战略，再谈制度。先制定一个目标，无论如何，半年要搞到多少钱，比如说
    100 万！然后想尽办法去达成。柳传志、王石这些人创业初期，都是这套打法。我自己也是这套做法。根本不是想好了再做，是边做边想，走一步看一步，赚到钱，先生存下来再说。


    创业初期，为了实现阶段性的目标，是宁可在混乱与不规范中前进，而不可在制度与规范当中死亡。当然，不可违法乱纪。大家有饭吃，有衣服穿，不至于饿死才是关键。


    为了快速实现阶段性的目标，创业者一定要拼尽全力，以身作则做好表率。就算你能力不强，但你在努力干活，整个团队也会在你的带动下去找方法，想策略实现阶段性目标的，切忌认为自己是老板了，就就啥也不干了。当老板不是比打工的时候轻松了，而是比打工的时更加勤奋了。


    ### 创业的好机会，谈谈互联网教育


    互联网的发展，让每一人都有机会靠一台电脑就致富，如果你有特长、有经验，愿意在互联网上分享你的特长、你的经验，不管是些什么东西，只要对人有帮助，总是会有人跟你学的。有学生，有老师，就是教育，然后你可以酌情收点学费，这样一个舰模式，就非常棒，你没什么成本，赚到手的都是纯利润。


    而且，互联网教育必定是一个趋势，你是可以做得非常大。


    我举几点来证明。


