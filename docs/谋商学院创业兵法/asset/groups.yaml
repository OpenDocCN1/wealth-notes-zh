    ## 失败者与成功者的最核心区别在哪


    成功者会失败吗？答案是：会，但成功者会为自己的失败负责。


    典型的例子，就是史玉柱，他因为修巨人大厦欠下了 2.5 亿元的债务，没有灰心丧气，逃之夭夭，啥也不管了，而是带着团队，又一次做起来，把债务还完了。


    成功者都是一样的性格，再比如爱迪生，发明电灯，实验了 1000 多次，1000 多次都失败了，但他依然在追求成功。在 1600 多次后成功发明了电灯。


    其实现在牛逼的 360，也是周鸿祯失败多次的产物，所有的成功者，都有填坑精神，他们会不断的填坑，直到无坑可填。失败者，最怕填坑，有的失败者最多填两个坑，就再也不愿意填下去了。


    成功者之所以会成功，是因为他们肯失败，不怕失败，甚至可以失败比任何人都多。


    社会的真实情况，显然是成功的人是极少数的，想成功而又不成功的占大多数。由于生产力的发展，看起来现在普通人比以前的普通人过得好了，10 年以前的普通人，可能都没有自己的手机，没自己的电脑，而现在的普通人，人人都有自己的手机，自己的电脑。


    看起来，现在的普通人要比十年前的普通人过得更加富裕。但真实的情况，却是现在的普通人比以前更加的辛苦，更加失败。


    因为这个社会，是个 M 型社会，古往今来，都是成功的人越来越成功，失败的人越来越失败。以前的大学生少，毕业后能找到份好工作，日子相对好过些，现在满大街都是大学生，虽然都能找到工作，但基本上都是处在月光族，处在一个不饱不饿的阶段。大家要快速改变自己的观念，否则，时间越往后面走，失败者与成功者的鸿沟会越来越大，向社会上层爬更加难。


    失败的人，总是以为自己很聪明，聪明人的想法很简单，付出最少，而得到最多，而且要求在短时间内就得到回报。这种思维，就直接导致一个人变成社会上的失败者。


    失败者是羊的性格，怕付出过多，怕上当受骗，所以，万事都跟大众一样，就是羊群中的一只羊。只要是大家要的，就是失败者要的；是大家都做的，失败者也跟着做。既然大家都做，失败者就想，自己跟着做，也没错。基本上，失败者，就是跟着大众的想法走。


    谈完这些，我要给出我的观点了，你按照我下面给出的观点来做，定然很快就能进入成功者的行列：


    - 第一：变成一个喜欢付出很多，没啥收获也继续付出的人。其实呢，只要你付出很多，总会有收获的。

    - 第二：不要怕上当，吃亏。因为你本来就很穷，你也上不去啥大当，但是呢，你可以不断的积累经验，经验多了，就成老手了，练就一双火眼金睛，离成功也就更近一步了，其实成功就是失败浇灌出来的。妄想没有失败的经验教训而直接成功，本来就是及其白痴的想法。

    - 第三：凡是大部分人的想法，做法，自己尽量不要去做。不要征求大部分人的意见，不要跟着大队伍走，真理与财富一直掌握在少数人手里，如果你的想法，做法跟大部分人一样，你就是典型的失败者。


    ## 要刻意练习一个能赚钱的一技之长才容易服众


    我以前认为劳心者治人，劳力者治于人，这世界上有两种功夫，一种是劳心，一种是劳力。我一直认为只有劳心才是最牛逼的，所以我就无师自通的去学习“劳心之道”，我以前很擅长组织、策划、监督、领导、运筹帷幄，察言观色，揣度别人的心思等等功夫。在这条路上，我比大家走得都远，我就没有遇到过比我强的，但是这是没用的：


    怎么会没用？我花了无数时间终于明白了：其实劳心功夫就是 我们说的管理、领导。劳力的功夫就是技术，一技之长。管理和领导的价值是很难体现出来的，哪怕你在这方面强到了无以复加，别人也不会服你，越是低素质的人群他就越不服，是因为你管理，领导有方，做出成绩的。


    比如，你组织十个人去做某事，在你的策划下事情做成了，假设就是赚了 100 万，在分赃的时候，他们会认为你什么都没做，这样 100 万是他们的劳动成果。实际上没有你，他们一分钱都赚不到，但你无法证明这点，因为他们会说，既然你说你的价值大，那行，你一个人去做做看。


    你一个人做，需要什么？答案是：一技之长，技术能力。


    所以有一技之长的人，反而容易成为领导者，因为技术这个东西，一伸手就知道有没有，厉害的人就是比普通人强。大家都看得见，就容易服你。所以，我们要刻意练习一个能赚钱的一技之长，用这个来威慑团队里的人，比说你管理能力强，组织能力强，更加容易服众！


    ### 做企业可以借鉴佛教的三条长盛不衰的核心


    - 第一条：普度众生。就是要有帮助人的习惯，而且这个帮助人是不求回报的，所以就会吸引一大批特别的信众愿意施舍财物供养佛教。我做互联网项目也一样，就比如我每天录音给大家讲点创业经验，企业管理知识，也吸引了一大帮铁杆粉丝，然后我建立了几个
    VIP 群，就有人付费进我的 VIP 群。也就是说，想赚钱，必须先免费付出很多。

    - 第二条：无欲无求，佛教的一个核心理念，你不能帮助了别人就天天挂到嘴巴上，你一说，别人就心里嫉恨你，连朋友都做不了了。也就是说施恩不图报，反而可以长久的做朋友。做老板也是这样，要把心态换过来，有的老板比较傻，他天天说他帮了这个员工，帮了那个，结果员工心里很抵触，很反感。你要反过来讲，都是员工努力与付出的结果，没有员工，我就啥也不是，这样，员工有归属感，就有成就感，也会更加努力工作，企业就更加有发展前途。

    - 第三条：只渡有缘人，强扭的瓜不甜；有缘千里来相会，无缘对面不相逢。当老板，只提拔那些企图心强的人，他愿意改变，他才给他机会，他不愿意改变，不愿意上进，你就别强行让他上，如果公司缺人，他赚得钱能养活他自己，就留他在公司，如果他赚得钱，当老板的亏本了，就迅速开除。


    这三条能让佛教几千年不倒，用来做企业，也能让企业生存得好。


    ## 中国古代文化对做老板的启示


    - 一粥一饭，当思来之不易，一口饭不容易吃，钱不要乱花，业务员跑业务也是很辛苦的。要晓得节约，比如，今天我们公司装固定电话，我就要求不装了，为什么呢？因为，现在大家都用手机，包括人事经理，也是用手机打电话来招聘。用了多少钱实报实销。

    - 今天还有人申请买复印机，我开始答应了，后来一想，这东西我们要来也没啥用啊！员工复印一下身份证入档案，我们是互联网公司，我们不如直接做成电子档。所以这个钱又节约下来了。还节约了一个空地，还节约了电费，维修费用等等。

    - 三姑六婆，实淫盗之媒。不要与妇女们啰嗦，不要多来往，包括像尼姑，道姑，修女，什么做媒婆的，算命的，走街窜巷卖药的，不要多来往。大概意思是，做人呢，要专注自己的事业，不要被无关紧要的人打扰。比如，你的同事又说看到什么稀奇古怪的事情，看到什么新出的衣服，电视剧，你不要凑过去聊。因为这对你的事业没帮助。

    - 婢美妾骄，非闺房之福，公司的秘书啊，自己的情人啊，越漂亮越糟糕，越是靠不住。我发现很多大公司总部重要位置几乎都是男人，就没有漂亮的女人，甚至连女人都没有。用女人呢，不漂亮自己不喜欢。漂亮的，又靠不住，所以就干脆不用。

    - 经书不可以不读，教子要有义方。多读经书呢，会明白很多做人做事的道理，多读管理学，经济学的书籍呢，会明白做企业的规律。教育自己的员工呢，要从道义上去教育，不可有私心。否则，员工的眼睛是火眼金睛，当面不说，背后铁定骂娘。对公司的民展没什么好处。世界上最伟大的人，一定是人格高尚的人，一定是一个大公无私的人，这就是道。

    - 勿贪意外之财。是谁做的贡献，就谁拿钱，别用自己的权力去压榨那些做出贡献的人，如果你非常贪财，那做出功献的人，以后就不愿意给你做出贡献了，因为拼命给你干，他自己也拿不到几个钱。他为毛要干，谁给你拼命干谁是傻逼。对职员不要太刻薄，比如给公司打扫卫生的，我就多给了她100块工资。因为她挣点钱也不容易，多给点工资以外的钱财，她会更加负责任，努力把公司的卫生搞好，这样，我与同事们上班的心情也好，自然会把这100的几百倍都赚回来的。


    我非常喜欢品味这些中国古文化，里面有大智慧，对我们做企业是非常有好处的。


    # 第七章


    # 人才的招用


    ## 实体老板抱怨招人难


    现在很多实体的小老板抱怨，现在找员工，很多人都是眼高手低，什么都不会，要手把手的教，还要发工资，感觉非常憋屈。我说，“这是你当孙子当习惯了的结果，在谁面前都喜欢当孙子！”


    员工不会，直接让他滚就是了，只找会的，找不到人也别急，慢慢找，有事情急不得。


    另外，这只能说明你洗脑水平太低，所以要好好读书，学习文化知识。


    其实人这个东西，习惯了当爷，在什么位置上都是爷，习惯了当孙子的人，当了老板也是孙子。我提倡站着挣钱，绝不跪着挣钱，跪着挣钱，钱挣到了，这个人活得也没意思。这就是为什么我不去玩淘宝的原因，一口一个“亲”，这是有神经病吗？


    我们只做暴利零成本项目，而且是引流过后，你爱买单不买单，我继续引流，我从来不当顾客是上帝，顾客只是我的服务对象罢了，你交钱，我服务你，你不买我的服务，你走你的独木桥，我过我的阳关道。这就软文推广的魅力，来买单的都已经过滤好了。


    ## 我们应该招聘什么样的人到公司里？


    老板必须亲自抓招聘，乔布斯一辈子面试了至少 5000 人。曹操曹老板也是到处招聘人才，多次发生绑架人才的父母的情况。刘备也是到处面试人。


    企业的竞争，本质上是人才的竞争。企业老板在天天面试的过程中是否有清晰的套路？还是大家坐到一起随便聊，聊了半天，最后说我考虑考虑，老板也说 我考虑考虑？毫无章法的招聘注定你这个企业也是毫无章法的，自己的企业也好不到哪里去！


    如果你不能用一句话清晰的总结出你要招聘岗位需要 的人才 是 具 备 那 几 个 重 要 特 征 的 ， 那 就 说 明 你 根 本 不 懂 招 聘 。 最
    厉害 的 老 板 是 ， 跟 这 个 人 聊 上 两 三 分 钟 ， 就 知 道 结 果 了 。 就 因 为 讲 话 稳 准 狠 ， 快 速 的 获 得 了
    自 己 想 要 的 信 息 ， 没 有 废 话 。


    我们招聘人，要找到真正合适的人最重要。我看现在很多老板都喜欢谈高待遇，或者企业发展前景，或者说福利好，通过这种手段把自己的企业销售给应聘者，把人先骗进企业。这就是典型的正事不谈，谈邪事，做事抓不住重点。我们千万别把人骗进企业，因为他如果不合适，干上一周，或者一个月就走了。这期间，我们做的培训，他占用公司的位置，都是对企业的损失，也耽误了应聘者的前途。


    那么怎么搞清楚企业具体岗位的工作职责，特征呢？我的做法是买一个白板。每天开会 10 分钟，把相关岗位的人组织起来，让他们讲他们的具体工作，总结他们每天的工作成果。然后把这些东西写到白板上，每天都不断的讲，不断的修改，包括他们岗位的具体工作内容，也写上去，不断的修改。基本一个月时间，就清楚这个岗位的主要特征。选三，五条重要的特征，形成文件，然后拿着这三五条特征去面试。这样的话，就算刚进公司
    1 天的人事主管也清晰的知道公司要招聘什么样的人。不过，随着公司的发展，你这三五条特征也要不断的更新换代。


    我们有了这些具体的东西在面试过程中就能清楚的知道那些人能够很好的完成工作，那些人只能做得一般，那些人是不合格的。


    其次，还看重一个人的潜力，一个人的内在品质反映一个人的潜力，具体来说，就是这个是否是积极的，按照中国五行学说，就是这个人是火命人。总是充满正能量，比如，你给他安排一个他没干过的事情，只要你给他方法，他就会不停的想办法，最终干好，这就是人才。而如果一个人，你一说让他去干一件他没干过的事，他就惊恐，甚至抱怨，这样的人，就是废物，别招聘到公司里。


    再看一个人的形象，我在招聘的过程中，碰到些衣服凌乱，头发凌乱，甚至脸都没洗干净的人，是直接PASS掉的。一个自信，有能力的人，是非常重视自己的形象的。那种形象差，还喜欢说，人不可貌相的人，简直是有病。社会中有文化就是麻痹这些笨蛋的。让他们给自己找个理由，他们还真上当了。很难相信一个形象差的人能把工作做好，就算他真能做好也不要他，因为他会伤害公司其他同事的心情。


    然后是职业认同感，就是这个是否是真正喜欢这个职业，比如我们招聘销售，有的人说，我干过5年销售了，有丰富的经验，但不是太喜欢这个职业。还有的人跑过来，很老道的说：“销售就是忽悠，就是欺骗！”这两种人呢，都是对自己的职业不认同的人，这样的人不要招聘到企业。


    我曾经碰到一个销售经理，有经验，也能做出成绩，但就是天天讲销售这个职业不是人干的，很苦，很没意思，很无聊，就是骗人。


    新的销售人员听他这样讲，都愁眉苦脸，工作都没积极性了。当初没有经验让他干了一段时间，后来明白了这种人没有职业认同感，直接把他开除了。扶上一个正面，积极阳光的人做经理，非常有职业认同感，虽然这个经理业务能力没有他强，但整个团队的业绩比以前翻了3倍。


    ## 团队里只要靠谱的人


    我们做老板的，经常招聘，根据自己做企业的经验，慢慢的对做企业有了自己一套课本上没有的看法。很长一段时间由于销售的压力，我一直在努力的招聘优秀的业务员，选择那些聪明的人，有头脑的人，愿意挣钱的人去合作。但经过了大起大落的跌荡起伏之后，心沉淀下来，道理也清楚了很多，总觉得一个靠谱的人，才是你值得珍惜的人，值得用时光陪着一起做事情的人。靠谱的人，必须是勤于动手的人。


    现在社会，由于读大学很容易了，从大学里出来的孩子，每个人都显得能说会道，招聘的时候，也很有技巧，表现得 什么都会一样，但是一进企业，缺陷就暴露出来了，他们并不会努力做事，甚至是成天抱着电脑聊QQ，逛淘宝。


    一个会说话的人，讲了一大堆理论，弄了一个大饼给你看，你收留了他，他并不卖力的去工作，最终只留下失望和双方的不欢而散。


    什么样的人靠谱呢？就是：一是一，二是二，能办就能办，不能办就是不能办，实实在在，踏踏实实。


    比如一个业务员，他天天就是勤勤恳恳的卖产品，卖服务，有困难，有问题，自己想办法克服，但还是要坚持做下去。


    不想卖就别接这个业务，更不会做“一单求利润，产生死与我不相干”的事。我们有的业务员，只为了自己赚钱，给客户承诺公司办不到的事情，或者直接欺骗客户，造成公司损失。这样的人要尽量开除掉。


    跟靠谱的人合作干的是事业，跟聪明的人只能空闲时才可以坐在一起聊聊天。


    这么多年接触了很多聪明人，的确通过聊天蛮受益的，无论他们现在是否与我合作，当初有些观点是对我们有 帮助的。但是合作以后发现，太聪明的人想的是自己的利益大于一切，特别的自私自利，久而久之，很难长久共事。至少心中有一种困惑，为什么我们比其他人给予他的更多，但总是不能满足他们的需求。聪明人算计心都特别强，躲着粗活，重活。只想指手画脚，只想锦上添花，我们经商久了，深深的明白，功劳应该记在那些踏踏实实做事的人的基础上。


    不讲漂亮话，踏实做事的人很重要，无论跟他们共事，还是交朋友（当然也包括男女朋友），是诚实的，一是一、二是二的做事！他不会有意外让你措手不及。而很多聪明人总是先答应得好好的，结果等你问他要结果的时候，他就会给你一个意料之中的失望。以至于现在我都防着这些一开始接触就表现得伶牙俐齿，很聪明的人了。


    现在很多人，在一起谈论最多的话题，是我们很“聊得来”。


    其实年头长久了才发现很“聊得来”，只是一种心理满足感，而靠谱才能给予双方安全感。当一个靠谱的人，承诺你事情的时候，他在心里已经有了把握，这件事情该怎么办，而伶牙俐齿人，他承诺你的事情多半是察言观色，发现你的心理需求，用语言满足你，能不能办他根本就没有想过，因为他的聪明，所以总会在有办法上让你觉得他尽力了，其实他连想都没有想一下，他连心都没用一下，只是空气在口腔中穿堂过而已。


    靠谱的人，他会体察对方的困难。而后，从自身的角度尽可能的为你办实事，虽然可能存在局限性，可能存在意见上的分歧，可能在一段时间之内不统一，也可能是拒绝。但是是高效的，是意图明显的，是真诚与信任的基础。这样的人才是要与其合作的人。


    现实生活中，人们喜欢聪明的人，当属正常心理。人们可以保持联系。但不一定会愿意推心置腹的相处，主要是变数太大，不托底。


    而人品好，靠谱的人，自然会有靠谱的人与之相处交往。这样的人在一个团队里，团队相对稳定很多。也就是企业中我们强调的忠诚大于能力。


    有的人在跟你合作的时候，尾巴夹的紧紧的，一旦不合作了，什么恶劣的手段都会使用出来。招聘了这么多年，哪些员工去劳动局告了我，哪些人在网上骂我，我仔细回忆起来，其实就会发现，这是一开始就表现得很聪明的人。


    由于聪明，穿上了一件“善良”“实在”的外衣，让人觉得这个人很实在。但对靠谱的人伤害就太大了，他们大多不善言辞，只会用心与人相处，吃亏了，大不了讲在当面。也就是人们常说的，好“欺负”“好人”。结果委屈受大了，泪水咽到肚子里，擦干了，还是阳光一片。而聪明人，往往是背后使坏，恶毒至极。


    在当前这个社会，遇到靠谱的人是求之不得的宝贵资源。他们在社会的各个领域，如果能遇到是企业中万幸之事，固然要倍加珍惜。


    自己是踏实做事的人，一直走下去渐渐的会有很多踏实做事的人和你会交往！


    自己耍小聪明，实际上，靠谱的人都会离你而去。路遥知马力，日久见人心。


    这些年体会最深的是，一个靠谱人给你介绍的朋友，合作起来就是人品好，办事靠谱的人。


    而一个不靠谱的人给你介绍一个朋友或者一个同事，也能碰到靠谱的，但需要你有慧眼，否则就只能碰运气。我们做事选择靠谱，是选择一种优秀的品质。一旦你靠谱的对待事情，你可能暂时受到伤害。但是你能检验身边朋友或者合作伙伴，筛掉最不靠谱的人，最后在你身边会凝聚一团正气。这团正气可以使彼此化险为夷，使你坦荡荡地走下去，没有相互的猜疑，只有全部智慧叠加在一起，一定是一加一大于二的最好结局。所以一直靠谱下去，你的运气定不会差！所以，我现在的选人策略不再是看这个人会不会说了，而是看他做事是否踏实靠谱。


    ## 如何抢占应聘者心智

