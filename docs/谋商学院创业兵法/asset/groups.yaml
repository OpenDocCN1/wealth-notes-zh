    ## 生意人就是要赚钱只要不违法就行


    企业存在的基础与目的是什么？答案非常简单，企业存在的基础是爱钱没花完，哪怕是风投或者是借来的钱。那么风投投给你钱，或者借来的钱，是用来做慈善的吗？肯定不是，而是用来赚钱的，企业的目的必然是赚钱。


    现在很多成功的企业家，还有一些写书的人，喜欢误导大家，说企业的存在是为了解决就业问题，为社会做出贡献，等等，这都是扯淡的事情，或者说，企业的存在，必然会解决部分就业问题，必然会为社会做出贡献，但这不是目的，这仅仅是顺带的事情。


    如果企业不赚钱，没有利润，企业必死无疑，只是早死、晚死的问题。所以创业人头脑要清醒，不可以被那些成功的企业家、写书的人骗了。一开始创业，就定出了一个错误的目标。


    我以前有一个朋友，开了一个电脑店，就是闹不清楚做企业的目的，而把那些成功的人拿到嘴上说的做企业的方针当成了真理，搞得自己狼狈不堪。


    这个家伙呢，人品很好，做朋友够哥们。结果就是，我们这些好朋友找他买电脑，他从来都是一毛钱不赚，他那个电脑店，生意本来就不好，朋友介绍过来的朋友，他也不好意思赚钱，结果大家猜到了吧，他倒闭了。


    我一直劝他，朋友的钱为何不赚？生意就是生意，做企业，必须赚钱，凡是偏离了这个目的，不管你的理由多么伟大光明正直，都只能说怪而已。不可把伟大光明正直的理由当成生意的指导方针。


    其实，我再深入一点讲，做生意，连诚信，都是伪装的，连对人们有好处都是伪装的，大家以为脑白金的成本是多少钱一瓶啊？真的能延年益寿吗？各个电视台的部分广告到底是夸张的手法呢？还是直接就是欺骗？网络游戏对青少年的到底起到了正面作用，还是负面作用呢？聪明人已经知道答案了，我就不多说了，但这些企业都活得非常滋润，赚取了大量的暴利。


    所以我这里，只给出一个结论，企业存在的基础目的就是盈利，只要不违法就行，凡是给我扯其他目的的人，都是做企业还没入门的人，或者是居心不良的人，或者是脑袋糊涂的人，这样的企业，就必须得倒闭。


    ## 适应社会而不是改变社会


    我们要适应社会而不是改变社会。“如果李嘉诚也身无分文了，我们与他有什么区别呢？”我想，李嘉诚一定会找出好的方法重新发展，其实李嘉诚本身也是从一个非常穷的人爬起来的。人与人的区别在于思维方式和内涵的不同，一个问题你想不通，解决不了，而别人跟你一样的资源，但是别人换一种思维方式，或者是有经验，就能想通，想透彻，解决问题。


    从这个角度讲，人只要不断的学习成功人士的思维方式、经验、精神，你就会变得越成功。


    人在社会首先要了解自己，了解社会，适者生存就是自己要适应社会，而不是社会适应自己，因为，一个人要改变社会太难，就是光绪皇帝也没做到，社会是许多人用一段时间改变的，改变也可以是好的方向，可能是坏的方向。


    聪明的人从来不试图去改变社会，所以取势、明道、优术，取势排在第一位。这就叫顺应时代的发展。看现在社会上呼风唤雨的大企业，陈天桥顺应了游戏，马化腾顺应了电子商务，该下海经商当倒爷的时候，就去倒，该做房地产的那几年就去干建材，该做网商的就去做网商，现在我认为正到了玩垂直电商、社群电商，和传统企业互联网化的时代了。


    取好这个势，自然就发家致富。还有一个势是文化产业，精神产业也马上就蓬勃发展的。大家也可以参与进来，万达的王健林就在进军文化地产、体育、娱乐等产业。王思聪在玩电竞，春江水暖鸭先知，大家可以把这些大商人当成风向标来指导自己创业。


    ## 为什么很多街头混混当了老板


    为什么很多读书成绩好的人都去打工了，为什么一直在思考人生方向的人，基本上都没啥出息。而那些街头混混却成了老板，那些看似没什么远见的人，却拥有不错的事业。


    其实道理很简单，因为街头混混的口诀就是：先干一票，弄点吃的再说。典型的先生存下来，然后再做打算的理念。


    其实我们有创业经验的人，就明白，我们做计划，想策略，拿到市场去用，根本就行不通，因为市场变化太快，经常出现，计划的 A，做着做着就变成了 B，以为能在 C
    处赚钱，结果是在 D 处发家。所以创业根本不是计划出来的。而读书成绩优异的人，成天思考人生方向的人，总是想有一个完美的计划策略去做事，这就导致这些人做不了老板。


    我现在招聘时候，想选一些优秀的人来带领项目组工作，最怕就是碰到一些高材生，问计划，问策略，因为赚钱这个事情，就没有具体的套路，我要的是给他一个大方向，他就直接去干，然后能赚钱的天才；我不需要一个只会按照计划书照本宣科的执行者来带领团队。我发现很多高端的人才根本就理解不了创业精神。


    我们创业的人只想解决眼前的生存问题，没有功夫去想人生方向，也没有时间去做什么计划，通常更没有时间去思考：谁对不起谁，工作有没有不愉快，累不累等问题。我只有一个想法，赚到钱，活下去，走一步看一步。


    后来当我读邓小平文选的时候，我忽然发现，伟大的邓公也是这样一个思路，就是摸着石头过河。做开创性的工作，是根本不用计划的，就是走一步，才看下一步，看到了一步，再走一步。


    这是成功创业的思维模式，希望大家能理解。


    ## 学错知识比吃错药还倒霉


    “回”字有四种写法，是当年孔乙己先生用以炫耀的知识。只是可惜，这知识于茴香豆吃的孩子们无益，于他自己也无益，即便是我这个跟文字打了 30 年交道的文化人，至今尚不清楚那四种写法，却也并不觉得怎样遗憾。而且，我也不会去研究如何写。


    在我的世界里，只有两件事，读书与赚钱，赚钱是为了读书，读书是为了更好的赚钱，如果非要活生生的加上其他事情，大概就是有足够的财富了过后，带着家人欣赏世界吧，我目前的一切精神，都集中在做企业上面，我认为做企业简直太好玩。


    我们经常电视台看到这种知识考题，“世界环境日是那一天？”这是中央电视台全球青年歌手电视大赛上的一道“文化考核”题，参加歌手解答，由某学者讲评。以前读小学的时候，总是觉得能回答上这些问题的人很牛逼，现在，我却觉得这样的人是白痴，而且，这种问题能回答出来，根本不能说明这个人就是优秀的人，反而误导了我们这些小学生，认为应该去死记硬背这些知识。有时候还打击了我们小学生幼小的心灵。认为自己很无能，怎么什么都不知道。


    不知某学者作何感想，反正我看了这题，只是感到哭也不是笑也不是，至于讲评，我想倘若换了我，我会告诉那位歌手：这个问题，只需从事环境工作的专业人士知道即可，而且也算不上什么文化考核，因此，你作为歌手，不知道也罢，是不应该扣分的。


    至于这个大赛的其他“文化考核”题，如“世界三大短篇小说家都是谁”，“‘人生自古谁无死’是谁的诗句”，“莘莘学子是什么意思”“某某节何时在巴黎确定”一类，虽然不能说与文化无关，但对于歌手来说，不知道这些，也没什么了不起的。那些已经成了名的大歌唱家，请他们也来答答试试？你总不能因此而指责他们没文化吧。


    不客气地说，倘若让我来出题—就出这类题—来考考这个大赛的出题人，我要是不把他们个个考得汗流浃背，恨无地缝可钻，就算我小时候那几天书白念了。


    因为：


    - 一、这种题的偶然性太，回答正确的几率本来就不高；

    - 二、这种题，对于许多从事其他特定专业的人们来说，他们平时根本就没有必要注意；

    - 三、最最重要的是：这种题的答对与否，并不能反映答题人文化素质。


    由此，我便想到了这样的一个问题：在知识爆炸的当今社会，我们有没有必要、有没有可能，把人类创造的全部知识，统统地塞进自己的大脑？如无必要、无可能，那么，我们应该进行怎样的取舍或选择？


    一般而论，人们认为我们的知识结构应该是由下面两个部分来组成：


    - 一、一般基础知识；

    - 二、混饭吃的特定专业知识。


    但我，却以为还有一个第三，而且这个第三还要比前面的两个部分更加重要，那就是对于一般基础知识和特定专业知识的理解、把握和创造的能力。以及，区分出来那些知识是对自己没有什么用处的知识，我们就不要去学它了。为什么有的人看起来什么都知道，却混不好社会，高分低能？就是因为他们满脑子学的都是不能赚钱的知识。


    这里，我想特别强调的是，在中国，自古以来，咱们就特别重视对知识的记忆，同时却忽视对知识的理解和运用。回到那个大赛的话题，我以为倘若把考题出在对知识的理解和运用上来，那就好多了。歌手的回答倘若还有创新，那应该给予高分了。


    据中美两国学生的学习成绩，中小学阶段是中国学生优秀，因为这个时候考死记硬背，到了大学以及大学以后，就是美国学生优秀了，因为这个时候靠对知识的运用。这个现象，说明了两国教育思想与教育方式的差异。而美国科学家，发明家远远多于中国，就又印证了美国重视创造能力的教育思想与教育方式的牛逼之处。


    不明白我们到底为什么还不加以改变？我的中学时光距离现在 15 年了。我那时的学习成绩是很优秀的，高中毕业时，包括数理化都是高分。可惜，十几年来，我当年记忆并运用得滚瓜烂熟的许多知识，特别是理科部分，就几乎从未应用过。至于当年费时最多的数理化，现在至少已经忘记了
    99%！相反，我在业余时间，凭着兴趣和自身需要而自学的知识，现在看来倒很有用，比方说哲学、社会学、心理学、宗教、中国通史、世界通史、中外文化史、中外艺术史、营销、管理、互联网、人际沟通……甚至包括服装、建筑、卫生、军事、谋略、兵法等等，都令我受益良多，特别是对我的生意有很大的好处。


    而且，发生在我身上的这个现象，我相信绝非个例，相反，却是极其普通的，即我们每一个受过那种教育的人，都会出现这样的现象。那就是说，我们的教育存在巨大的浪费！浪费且不说，简直是对我这种人的一种巨大误导，相当于我花了极大的精力白学了
    20 年，倘若一开始，我学的是我现在能用得上的营销、管理、人际沟通、历史、哲学、心理学知识，我相信，我现在的赚得钱肯定会更多，所以，我有个结论，读书的时候，喜欢看业余书籍的孩子，混社会，都差不到哪里去。


    为此，我常常这样想：倘若我们的学习内容不那么盲目，不那么虚荣，能够在知识的广度方面有所拓展，特别是能够在素质教育方面多加注意，那么，不只是我们的学生，全体中国人的文化素质都将得到很大的提高。遗憾的是，关于教育，特别是素质教育，我们已经讨论了许多年，却至今不见起色。


    我们都学了些什么？


    昨夜我做了个奇怪的梦，梦中，有人问我一个初中数学题，这道题不会做，一着急，急醒了。


    醒来后，好半天睡不着。我想，这个梦肯定是属于“日有所思，夜有所梦”，因为很长时间以来，我就疑惑我们的学习的内容，究竟能有多少意义？


    我读中学的时候，学习是很认真的，数理化几个主要理科的考试每次都能得到高分。这几个理科的学习，也是占用时间最多的学科，相反，我所喜欢的语文啊历史啊地理啊什么的，倒是给点时间就完，仿佛成了业余。


    问题是，我曾经不得不花费了那么多的时间精力学习的那几门理科的知识，自从中学毕业后，这几十年来，如果不是完全没用的话，至少可以说是基本没用。相反，我在业余时间里漫不经心学到的那些东西，这几十年来，反倒派上了用场。


    这就让人感到我以前学的东西，实在是近乎荒谬。现在，我只学对我做企业，盈利有帮助的知识了。不是说理科学习没有用处，对于准备专业学习专业研究的人员，它们当然是有用的，甚至还要精益求精；问题是对于一般人来说，学那么多那么深，有什么意义呢？把那么多的宝贵时间和精力都用在了只供后来忘记的学习内容上，难道就是我们学习的目的么？


    现在的课本，据说里边的内容比我那时候还要丰富得多深奥得多。真不知道我们的教育专家们到底是怎样想的？建议教育部门搞一个跟踪调查，看到底有多少人能够学以致用--哪怕能用上几十分之一也好。


    我想，我以后的小孩，不会让他去这种学校里学习，这简直就是一个灾难。没用的东西学了不少，有用的东西自然就被“省略”了。学错知识确实比吃错药还倒霉，因为他不仅仅会浪费你的宝贵的时间，还会误导你干没有价值的事。


    对于我自己来讲，我判断一个知识有没有用，就是想一想，这个知识能否帮我赚到更多的钱，能不能帮我更好的经营企业，或者是提高我的修养，凡是做不到这几点的知识，于我来说，统统是毫无意义的知识，不学也罢。希望能对各位创业者、老板有所启发。


    ## 学习就是生产力，不停的学习就自然富有


    先跟大家谈谈这个世界最富有的民族：犹太人，我们经商的人，都应该对这个民族进行一个透彻的了解。


    犹太人自公元一世纪被罗马人奴役，开始流离失所，流浪全世界。直至二战结束的 1947 年才回到现在的家园，就是现在的以色列，影响世界的犹太人很多比如：马克思，爱因斯坦，弗洛伊德，控制欧洲金融命脉的罗斯柴尔德家族，华尔街的超级富豪摩根，第一个亿万巨富洛克菲勒，股神巴菲特。


    犹太民族是一个有强烈宗教信仰的民族，犹太人将学习视为信仰的一部分，学习是向上帝表示敬意。每一个犹太人都必须会读书，塔木德就是犹太智慧的基因库，塔木德本身的含义就是“钻研”或“研习”。塔木德认为：“学习是至善行为，是美德的本源，一个人的虔诚、至善、平和、优雅都是靠后天教育的结果。”


    有一本书叫《虔诫者的书》。说到古时，墓园全要放书，在夜深人静的时候，死者要从坟墓中爬起来看书。书是一生中的宝贝，书柜必须设在床头，不能设在床尾，否则被视为对书不敬。


    犹太人认为：教师比国王更伟大。犹太人对教师高度尊敬。学校在、知识在、书在，犹太民族无论流浪在何处，都能生存下来，而且更为强盛。


    《智慧比知识更重要》：何为知识？知识就是万事万物的真相和客观存在，而智慧就是将万事万物的真相与客观存在进行无限联接综合总结出来的解决问题的最佳方案。对人最重要的是什么？智慧，而智慧来自于知识。


    读书的目的，就是拓展知识，具备了丰富知识以后，你学会了思考，你就会明白做人的道理或找到解决问题的方法。这就是智慧！因此，智慧来自于知识，比知识更重要！


    犹太人崇尚创新，认为创新是一种智慧，要敢于怀疑，随时发问，知道的越多，越会产生怀疑。中国的家长对放学回家的孩子问的一句话是：“你考得怎样？”而犹太人家长会问：“今天你又提问了吗？今天与往日比有何不同？”犹太人认为创新是“滚动的智慧，开放的智慧，灵活的智慧。”人生通过学习可以认识自我，超越自我。


    犹太人教育既封闭又开放。对犹太人内部是开放的，对外是封闭的，以保持犹太民族的生存竞争力。《塔木德》是准圣经，在公元 2 世纪到 6 世纪之间，犹太人用了 500
    年，两千多个拉比和科学家合作编写出这本犹太人生存宝典。


    犹太人认为，教育等于财富、等于个人感动，教育改变人生、命运，改变一切。在 2000 多年的流浪历史中，一切都被掠夺了，只有书和知识是夺不走的财富。由于犹太人对教育极为重视，对知识、对书无比重视，什么都可以不要。只有知识是最重要的财富，是可以随身携带而且终身享用的财产！因此，犹太人是全世界最早消灭文盲的民族，在
    1947 年以前，犹太人连一片固定的国土都没有。可是在中世纪时期，犹太人就消灭了文盲。因此，这个民族的整体素质比其他民族要高出一等，因此全世界的富人恨他们太聪明，穷人恨他们太有钱！


    就是这些因素使得犹太民族在全世界流浪了两千年，却是全世界独一无二没有乞丐的民族！


    总结一句：学习就是生产力，不停的学习就自然富有！我们商人更加应该记住这句话，不断的投资时间与金钱在学习上面。


    ## 做互联网赚钱必须意志力坚强


    赚钱这条道路上，没有坚强的意志力，将永远活在地狱。


    其实在任何道路上行走，想要搞到钱，没有坚强的意志力都注定走不远。你走不远的后果就是总有的人走的比你更加远。那么走得更加远的人就赚到了钱，而走不远的人，就成了相关领域的失败者，虽然赖在这个领域不走，但是会一直痛苦，痛苦一辈子。


    人身上的缺点，只有用坚强的意志力去改变，才能彻底改变。否则这个缺点就会终身成为你的短板，一直拉着你下地狱，在社会中过得不如意。


    对自己不要太温柔。对自己温柔的人，一辈子都不能进步。人真的是逼出来的，成佛成道，在此一逼，逼自己过这道坎，过了就吃肉，不过就吃屎。


    我们做互联网项目，做网赚对此体会是深入骨髓的。很多的零成本项目，说白了，讲透彻了。就是文案加推广加售后服务。死磕两周就懂了，可是就是有很多兄弟，舍不得自己那身臭肉，狠下心来苦学，苦干。这些项目一点就透，少的就是具体化去落实的精神，每天去优化自己的文案，优化自己的项目，每天都参考
    10 几个同行的推广渠道，操作手法。每天做记录，每天做售后，做反馈，你只要拼三个月，人生就是另一番风景了。至少从员工变成个体户或者说小老板。可是很多人就是不能坚持拼搏。哎，我能说什么呢？


    你拼不拼，其实跟我没关系。我照样赚钱，只是觉得我应该讲讲这些简单的道理，万一哪个做项目的兄弟听明白了，就改变了人生呢，我也算是功德一件吧。


    任何成就都是建立在坚持不懈的精神上，道理简单，必须做到，做不到的人，还是去打工吧。赚钱真的不适合一点自律性都没有的人。我们提供的项目很简单，你听话，照做，就能赚钱。豁出命来跟我们干，3
    个月后，你有钱了，愿意找个客服自己单干或者跟着我们干都可以。


    ## 做一个认栽的高手


    历史上的牛人，都是肯等待的人，等待并不是玩耍，而是默默的储存实力，找到机会，遇到危险了就开始逃跑，装死，也是大人物的作风。


    装死这招，都是牛人喜欢干的。比如，齐桓公当年跟他兄弟争国王的位置，被管仲射了一箭，齐桓公赶忙滚下马，口吐鲜血，死了。其实是装死。管仲大喜，骑着马就逃命了。齐桓公等管仲走了，又爬起来，倍速兼行跑回齐国首都当国王去了。


    认栽比较出名的韩信，甘愿受到胯下之辱。钻一个屠夫的裤裆。后来当了大将军。


