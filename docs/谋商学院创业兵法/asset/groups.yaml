    不要与让你不开心，让你分心的人呆在一起，如果你有两躁不安的朋友，那么离开他。大部分刚开始修炼专注力的人都'
  md: '

    严格来说，只做自己能搞定的事并不是保守，是因为很多人尤其是初次创业者，都容易过高估计自己或团队的资源和能力，低估项目和市场的复杂性，寄希望于不遇到问题，不发生意外，寄希望于对手不回应，不反击……这怎么可能呢？成功的唯一可能是运气实在太好，好比横渡太平洋没遇到任何风浪；而保守一点，正好留出处理各种不可控因素的余力来。


    如果这个余力足够大，你可以迅速提高自己的目标，但是如果一开始就把自己的目标定得很高，往往耗尽自己的资源、现金，最可怕的把自己与团队累的筋疲力尽，信心也搞没了，成功就基本不可能了。


    我做企业有一个重点，就是不断招聘人才。我招聘人才并不是用他们来完成高难度的项目，而是做非常非常简单的事情，高手做简单的事情，并不是屈才与浪费。高手做简单的事情，会把简单的事情做到更加的极致，直接对这个行业的其他竞争对手形成屠杀级的优势。


    就如同我以前玩《魔兽世界》一样，我喜欢杀人。我才不去杀大号呢，就算我技术好，也要经常被虐。我是组织一伙人，一起去小号练级的地方屠杀小号。这样既安全又快乐。很多人对我这种行为不耻，无所谓了，我要的是胜利，而你要的是让我去送死，其实《孙子兵法》讲过这个哲理，伟人毛也讲过只打有把握的战争，这就是创业者应该吸收的思想。


    ## 创业企业采用人治还是法治好


    刚开始创业的时候，肯定是人治，但是随着业务的繁忙，如果企业忙不过来了，就要招兵买马，人多了，你一个人管不过来，就要委任管理者，而要使管理者的工作有法可依，不至于按他们自己想胡来，不至于大家心不朝一处想，力不往一处使，自然就要开始订立目标与规章制度，自然就过渡到“法治”了。


    水到自然集成，企业的成长和生物的成长一样，是个过程。只要有利润，创业初期先不要考虑人治还是法治的问题。法治是规模发展起来了可以采用的手段。如果初级阶段“硬要”去决定人治还是法治，可能都会适得其反。


    从企业发展的角度，你需要招人；从法治的角度，你仍然需要招人。因为你要分工的话，就得权责分明，权力和责任是同时放下去的。比如你叫我负责办公室的卫生，表面只是责任，其实权力也一块放下去了。我有什么权力？打扫办公室的权力。这意味着任何人插手我的工作的话，最后你都无法追究我的责任。所以当你把权责放下去之后，就意味着在那一块，你只剩下最牛X最无奈的“撤换负责人”的权力，而不能轻易插手别人的工作。牛X在哪里？生杀大权嘛！无奈在哪里？如果你没有后备人才，你敢撤换他吗？不撤，他做不好本职工作，影响大局。撤了，你得自己去顶上，顶张三顶李四……最后累成狗。


    所以说，发展到分工合作阶段，就要求你必须要有替补，而且替补的存在会让在位者有种无形的压力。也就是，内部竞争机制是有替补建立起来的。


    无论从哪个角度讲，当你有闲钱多养几个人的时候，你才能建立法治。然后，即便这样，也不是人治法治的分割点。规则化制度化是结果，既非目的，更不是必然手段。反正兵来将挡，遇到问题解决问题，企业发展到自己实在没有精力去管的时候，就只能借助一些“规章制度”，这样一天一天过去，有天你回头一看：咦！自己的企业变得像台机器一样，员工们按照规章制度和惯例工作，做得好得到奖励，做不好受到处罚，你不去管他们细常工作，这就法治上了。


    所以，创业初期是人治，随着企业发展到分工合作阶段，人数增加到你一个人管理不过来的时候，发展到法治是水到渠成的事情。不可生搬硬套的决定人治还是法治，也没有法治比人治好的说法，而是不同阶段，用不同的手段。


    ## 皇帝的管理哲学


    许攸献计，助曹操打败袁绍。曹操统率众将入冀州，许攸纵马近前，高叫：“阿瞒，如果不是我，你能够入这个城门吗？”曹操听罢大笑。


    许攸又指诸将说：“你们没有我，能这样出入此城门吗？”诸将忿忿不平。许褚斥道：“我们千生万死，身冒血战，才夺取胜利，你怎么胆敢这样夸口呢！”许攸说：“你们不过是匹夫之勇，没有什么了不起。”许褚大怒，拔剑把许攸杀死了。


    曹操为此深责许褚，不过马上就提拔为征南将军，进牟乡侯，宠遇优渥，邑七百户，赐子孙二人为关内侯。


    这就是曹操混社会的哲学，只要是忠诚于我的，我就不会亏待你。曹操的孙子曹髦“才同陈思，武类太祖。”不甘当傀儡皇帝，说：“司马昭之心，路人皆知也，我要去讨伐他。”率领宫女僮仆数百人，敲起战鼓，出云龙门而去。


    小皇帝身披新甲，坐在车驾之上，手持宝剑，大呼杀贼，激励士气。司马昭的亲信贾充率军迎战，列阵于司马昭府前。


    曹髦赤膊上阵，高喊：“我是天子，谁敢拦我！”士兵们慑于皇威，无人敢挡。贾充急了，说：“皮之不存，毛将焉附。司马若败，我等必死！”校尉成济是个头脑简单的家伙，听了说：“没错！”，拍马上前，挺手中长矛从曹髦胸中进去，于背部出来。


    小皇帝血溅长街，当场身亡，年仅二十岁。这个皇帝真幼稚，丝毫没有谋略！没谋略的人在高位，迟早也是死，大家可以参考康熙是怎么干死鳌拜的。


    司马昭听到消息后大惊失色，跑过去，抱着曹髦的尸体放声大哭一场，明白人都知道是作戏，然后召集百官，商量对策。有个大臣说：“斩贾充，以谢天下。”司马昭不语，沉吟再三，不得已杀成济以抵罪。贾充此后一路升官，累迁车骑将军、散骑常侍、行太子太保、录尚书事，假黄钺拜大都督，封鲁郡公，增邑八千户。


    司马昭的哲学就是谁帮我，我肯定保他荣华富贵。所以贾充荣华富贵，我想建议杀贾充哪个家伙会很惨。


    一个管理者永远要搞清楚的是，谁是真正在帮你，不要让真正帮你的人寒心。


    ## 看起来越傻的人越有出路，大智若愚


    越真诚，越赚钱，因为大家都愿意跟真诚的人玩。初看起来，真诚的人是很傻的，时间长了，你就会觉得真诚的人很聪明。


    那些看起来越狡猾，越聪明的人，越没什么出路，大家表面夸你，实际上都不想跟你共事。


    你太聪明了，想要干活少干，分钱要多分，就没人愿意与你合作，你只有去当孤家寡人。凡是当老大的，普通人看起来就是有点傻的。宋江叫及雨，别人需要女人他就送女人，别人需要钱他就送钱，他把自己的都送出去了，所以别人都叫他大哥。


    刘备宁愿不逃命，也要老百姓跟着，所以大家都觉得刘皇叔仁义。吕布聪明吧，谁牛逼叫谁爹，谁给粮吃，谁就是娘，最后被曹操抓住，本来曹操爱其武勇，想接纳他的，结果想想吕布以前的行为，还是算了。


    什么样的人才能成功呢？很多人都关心这个问题。人活着总是有欲望的，欲望越少的人越牛逼，无欲则刚，通常，成功的老板，他的爱好是极其专一的，甚至，他只爱他的生意。


    而贫穷人，爱电视剧，爱麻将，爱喝酒，爱游戏，爱逛街。人的各种缺点都是建立在欲望基础上，比如爱睡懒觉。要想有成绩，你必须只爱上一件有益的事。其他的，你就别爱了，因为人没那么多时间与精力。


    佛祖的八万四千法门，你不能都爱，只能爱一种法门，爱一本书，爱一门学问。你若都爱，后果就是不精通。比如，我们读佛经，你休想把所有的经典都搞懂。你就读一本《金刚经》读完一遍，再读一遍，不断循环往复，几十年如一日。你就能搞懂这本经，成为这一本经的专家，你就会有名声，然后想学这本经的人就会来找你。你就成了这本经的权威。实际上，我们历史上那些高僧大德就是这样干的。


    做项目，也是如此，只做一个项目，不断的专研一个项目，数十年如一日，不断的迭代升级，你就能在这个行业成为权威。


    凡是没有耐心，几个月不赚钱就换项目的人，都赚不到什么钱，甚至只有倒闭了事。


    这世界就这样：当你要的很少的时候，你就会得到很多，当你要得很多，你将一无所有。


    比如，又怕风险，又要创业。又想跟学知识，又舍不得花钱。有想跟美女认识，又怕拒绝。又想赚大钱，又不愿意牺牲休息时间，又愿意早起。又想身体好，有肌肉，又不愿意锻炼身体。


    一个人，你只能要一样，想要的多了，就什么也得不到。这种道理，只有比较傻的人才能明白，聪明的人总是认为鱼和熊掌可兼得!然而，我们都想做这种聪明人，但是我们都讨厌这样的聪明人跟我们做朋友。我们只喜欢傻一点的人，既然，傻一点的人大家喜欢，傻一点的人成功了。


    ## 领导者是自然选择的结果


    最优秀的领导者，应该是从一个生态系统中自然产生的。正常的生态环境，会有人从中脱颖而出。或者说，大家都觉得他牛逼，众望所归，他就是领导了。


    有一个例子，大家可以参考下：东北的鄂伦春族原来是养鹿的。但是，近年来，鹿的种群质量下降得厉害，鹿的个头越来越小，还经常生病。大家不断的寻找原因，最后终于找到原因了，是人为造成的。因为鹿茸很值钱，人们就把鹿角锯下来拿去卖钱了。到后来鹿都没有角了，这样带来了一个严重的问题。


    本来每年春天，鹿群需要用角斗来决出鹿王，而鹿王享有交配权，一般鹿王就是最雄壮，个头最大，体质最优的。这样才能保证种群中最优秀的基因传下去。现在呢，人们把他们的角锯下来卖钱了。鹿没有角，角斗时大家谁也搞不过谁了，就鹿鹿平等了，每个鹿都自由交配。延续下去就不是最优良的基因了，所以种群的质量越来越差。


    在一个正常的组织里，领导者必须有一套机制让他们脱颖而出。我定义这套机制就是业绩，你为企业做出了多少贡献，赚了多少钱。做的贡献大的，赚钱多的，就相当于在角斗中获胜，那么就享有领导权。


    而不能用一套其他的外力去干涉这套机制，比如这个人是你小学，或者是你妹妹的老公，或者他马屁拍的好，你就让他当领导。这就相当于把劣质基因不公平的引入一个企业。整个组织就会陷入平庸。甚至真正牛逼的人，看到你这样搞，只好选择离开。


    也就是说，领导地位，必须是凭借实力来赢得的。


    一个企业要杜绝工作能力不强的人升官。比如，这个人是拍马屁拍得好的，有裙带关系的，就不能让这样的人上位。只让工作能力强的人上位，也就是能为企业赚钱的人上位。


    如果你人为的去干涉企业的正常生态系统，你的企业就会像那个鹿群一样，竞争力越来越差，陷入慢性自杀的状态。


    ## 毛伟人对我们创业人的启示


    真正推动社会进步的力量是世俗的力量，而不是超世俗的力量。世俗力量是什么？


    毛说：人民，只有人民才是推动历史前进的真正动力。只有人民的想法，人民的欲望，人民的需求，才能推动历史的进步，你之所以能盈利，是因为你找准了人民需求的脉搏，人民欲望的脉搏，一切不研究人民心理真实需求的人，都不能做大做强企业。性是人民所需求的东西，所以，黄色文化屡禁不止，QQ，微信，陌陌都是约炮工具。


    淘宝网，饿了么，滴滴打车，是人民方便的工具，也可以说是人民懒惰的工具。人类的欲望还有很多，你做的产品必须符合人民的欲望。凡是高大上，超越人类世俗需求的创新与创业都是逆人类的，都是自取灭亡。老百姓吃喝拉撒玩儿睡就是消费社会市民社会的特征，是推动历史进步的力量，也是最赚钱的几个点。


    忽然想起了一条毛主席语录：


    马克思主义的道理，千头万绪归根结底，就是一句话，“造反有理。”


    有了这个道理，于是就革命、就造反、就干社会主义。创业也有理，发财也有理，做营销也是这个理：乱搞乱发财。不要怕乱，怕不搞。动力是一切的根本，一个人就怕没动力。我以前跟一个营销经理聊天谈到一个问题。什么样的销售员才是好的销售员？不是技巧好，也不是会讲话，也不是经验丰富，而是其动力十足，一直都是打电话，跑业务，只要他个停下来，他的业绩必然是最好的，我经历了好几个公司，不管是卖建材料的还是做网络代销的，那些业绩最好的营销人员，都是动力十足的人，没有例外。


    文武分家是中国文化的一个悲剧，是赵匡胤干出来的，他当年造反，怕他的将军们依样脚葫芦，所以搞个杯酒释兵权，这个规矩遗害千年啊。


    一定是要文武合流，这才是中国的强处。我们带员工也是如此，必须不断你的强调体育锻炼，吃好，喝好，睡好。身体不好，工作就没激情，萎靡不振，业绩是好不起来的。


    毛的第一篇论文，讨论的不是什么社会制度，也不是战略，战术，而是体育之研究。他年轻的时候，是一个学校的老师，最后带兵打仗。


    毛的战略思想是：


    初战的计划必须是全战役计划的有机的序幕。第一步很重要，也就是我们经常讲的，选择非常重要，选择就是战略。就是说，即使初战打了一个胜仗，若这个仗不但不于全战役有利，反而有害时，则这个仗算败了（例如第五次“围剿”时的湘口战斗）。比如，我们有的人5月份就想创业，结果因为公司还没发年终奖，就拖到了年底。虽然拿到了年终奖，这个意义上胜利了，但是整体来讲，这是非常失败的，因为浪费了时间，也磨灭了斗志。


    因此在打第一仗之前，必须想到第二、第三、第四以至最后一仗大体上如何打法，每次的一仗胜了，敌军全局将起如何变化，假若败了，又将起如何变化。


    虽结果不见得乃至决不会尽如所期，然而必须依据双方全局，仔实地想明白。


    没有全局在胸，是不会真的投下一着好棋子的。古话讲，不谋全局者，不足谋一域！要知道连锁反应才能明白战略的意义。


    毛指挥战争最大的特点，是始终盯着对手的人，消灭敌人有生力量放在第一位，说白了就是要杀人，把夺取城池寺方放在第二位。这就是事物的本质。比如我们经营企业，最终目的是要收回来钱。这是本质。我以前有个公司做建材生意，生意很好，干得热火朝天，精神抖擞，算下来一年赚几百万，可惜都是欠帐，烂账，这就叫做企业没有抓住本质，输得很惨。


    再比如，时下很多企业老板，认为自己企业人数少了，没面子，要一定的规模，自己手里有钱，或者是有风投，就不按公司实际效益的猛招人，凑人数；我见好几个互联网企业都是这样，最后的结局当然是倒闭了事，这些都是没抓住本质的结局。


    毛伟人的做法是：


    计算对手共有近二百多个旅，精密计算消灭和补充的速度，将攻城作为杀敌的手段，下令命令都是歼灭敌人几个旅。


    这是驾驭战争的不二法门，凡是违背了这个原则一定要失败。做任何事情，都有一个本质，泡妞，离婚，经营企业，招聘人才，都有一个本质问题，各位自己去思考。


    当年刘伯承跟毛泽东问：我们到底去哪儿？


    毛：还是要往北，共产党要想发展，就必须得到民众的拥护，你要想得到民众的拥护就得抗日，你要是不去贴近抗日前线，不去发动群众，不去为老百姓办事，共产党怎么发展？老百姓怎么会拥护你？


    企业要想发展很简单，要人民拥护，就必须为人民办事。


    ## 你为民办了个什么事？


    张国焘就显得魄力不足，他想在荒凉的川西北藏区建立一个苏维埃。


    刘伯承说：这样一比，就看出两个人思路的差别了。


    所以毛后来总结长征的时候说：方向路线是至关重要的。


    方向路线对了头，没有人可以有人，没有枪可以有枪，如果方向路线错了，你有再大的力量也会失败。


    ## 如何让自己成为一个博大精深的人


    有些人说现在没人读书了，其实是他不读书，他自己认为读书没用了。如果你读书，你会发现周围好多人在读书。如同有些人说赚钱难，其实是你赚钱难，如果你进入一个赚钱的圈子，你会发现，赚钱的人很多而且也不难。


    学习，是一种拼图游戏，是一种心理学现象，首先，你得找到一门有用的学问，知识，我说的有用就是能赚钱的学问知识，然后去模仿，去记忆。模仿多了，记忆多了，就产生是一种“孕妇效应”就是肚子会越来越大。处处留心皆学问。搜尽奇峰打草稿，就是看到一山一水，一鸟一草，一本书，一个理论甚至一个人，都想着氢其卖出去，变成钱，都想想如何做市场推广，哪里有客户，怎么做包装。无时无刻不是学问，无时无刻不在想变现，我脑袋里随时随地都是金钱，都是投资，都是管理，都是琢磨员工，如何让工产生利润。


    无人无物不是我师，比如你新招聘-个员工，你不要以为他没本事，你跟他交流，就算他真没本事，他也会启发你的思维。


    你心里有一个赚钱的理念，投资的理念，有一个主线，有纲有目，有一张吸取知识的大网，你遇到的所有相关的信息，都会往你张网上撞，全部一网打尽！


    时间长了，自然比普通入牛逼，自然博大精深。


    卫国大夫公孙朝问子贡：“你的老师孔子对于天下事理，无论大小，无不周知，如此博大精深，他的学问从哪里学来的啊？”


