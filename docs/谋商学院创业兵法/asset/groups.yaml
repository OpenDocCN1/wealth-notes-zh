    就是感染力，领导力。英雄所见略同，英雄所干的事情也略同！


    所以我的另一个观点就是，在中国发财是及其容易的一件事，因 人都喜欢做表面功夫，能把功夫落到实处的人很少。因为要落到实处，得靠自己真刀真枪的上去干，这会很累，很苦。所以大部分人都希望追求到一个技巧，方法，来快速让自己发财，岂不知，这样是缘木求鱼。


    我很早就明白了一个道理，只要稍微上心，稍微舍得吃苦，自己做好表率，用这种精神去感染团队。在中国是很容易混个出人头地，所以，我能同时启动两，三个项目，也能赚点小钱。


