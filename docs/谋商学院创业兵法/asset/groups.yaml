    我还做创业圈子、QQ群营销、QQ空间营销。我的生意可以今天在都江堰，明天在泰山，后天在秦始皇兵马俑。我们整个团队都可以随着我们的爱好任意搬迁。我要介绍给大家的项目，统统是这样的项目。感谢互联网时代，感谢信息技术。并且这种项目，随着我信息化技术的进步，会越来越有市场：3G-4G-5G-6G。所以我一直鼓吹让大家来做互联网。


    第五：项目极易复制。


