    ## 公司招聘原则


    公司招聘，宁可漏过千个合适的人，也不可惜招一个不合适的人，错招一个人损失太大了，时间损失，精力损失，金钱损失，公司项目进度损失，满滴都是泪。


    这些年没少招聘，我基本上每天面试 1 到 10 个人。刚开始没有经验，每回招人都找最好的，什么新加坡理工大学的，英国留学生。工资 4000 多的售后服务岗位经常招名牌大学本科生，英语过八级。后来发现，招来人根本留不住。本来简单工作的岗位，大专生完全能够胜任，找个本科生双方都不合适，只是在写公司简介时方便吹牛。员工对自己的工资期望高，但这个岗位上也发挥不出来他英语八级的能力。时间长了还要发脾气。后来招聘一个大专生，大专生就老老实实的在这个岗位上干得很开心。所以，找人不是越优秀越好，公司是一个生态系统，需要优秀的人的岗位放优秀的人，需要普通人的岗位放普通人，主要是能力与岗位匹配最好。


    另外面试时应聘人员说的话不可全信，本来就是一面之词，基本是只会挑好的说，你要学会从他的表情，话语中旁敲侧击的去推测一些东西。


    有时对方刚失去工作后比较失落，为得到新工作，他们什么都敢承诺。有时候有的人是刚到上海来，想迅速找个工作混工资吃饭，然后利用你公司的电脑继续上网投递简历，打电话找工作，这样他还可以节约去网吧上网的网费。碰到这样的奇葩，直接开除。某次公司招聘人事，岗位工资定为
    5000 左右，一个女孩投简历面试，本科学历，3 年工作经验，上份工作工资在 5500，我问她这次工资比上份工作工资低，能否接受，她毫不犹豫表示没问题。由于她比较适合人事职位，录用了她。半个月后，前任人事和她交接完离职后，第二天她也离职，理由居然是工资低，搞得公司非常被动，要给她发工资不说，还耽误了公司招聘合适的人。再次招聘我招了个原工资金
    4500 的女孩，现在还在该岗位，不但干得好，而且对工资也很满意。大部分人对待新工作职位及待遇都是只能上不能下，能下能下的人太少了，邓小平是能三下三上的人，所以他伟大。


    招人最重要的经验是：宁可漏过一千，不可错招一个。招错人了，浪费钱财我不在乎，主要是拖累公司项目进度，直接减缓公司发展速度。据我的经验，公司招聘：低一档用人，高一档发工资效果比较好。也就是招三流的人才，干二流的工作，发一流的工资。当然，以上一流三流都是相对的，这样公司能稳定发展，三流的人才内心被调动起来，出的成绩也不会差到哪儿去，一流的人才如果不满意公司，基本上也就是个庸才。招聘时应不嫌麻烦，仔细核对应聘人员身份，手脚不干净的人偷了你的东西，几千块钱警察都不管。


    对岁数稍大，牢骠满腹，觉得社会对他不公的，统统不要招聘到公司里来。对于批评抱怨原来公司的人，也别招聘进公司，他能抱怨以前的单位就能抱怨你的单位。觉得公司给他什么福利都是应该的，什么都没干，斤斤计较的要这要那的，一定不要招进来，这种人最会找事，并且会不断传播他的思想给其他团队成员。此外亲戚朋友能少用就少用吧，打不得，骂不得，开除不得，总是认为你当老板剥削他，而不是给了他一份工作。他有本事他就去找好工作嘛，可惜他不去。他还要说，你以为我想呆在你公司啊，我要有本事，会什么，我早走了。情愿发展慢点，也不要急急忙忙的招不合适的人。大量投入时间、金钱给员工培训，才能降低经营成本。兵法的基本原则，就是压倒性的投入。


    公司要想经营好，就要投入大量的时间、金钱去培训。一个员工没有水平，做不好事情，就浪费公司的时间与工资。


    公司培训了员工，员工会做事情，才能为企业带来效益。所以要想经营成本低，必须高投入去培训员工。


    公司培训体系如何建立呢？


    - 让每个部门的老员工，写业务操作手册。新员工进来先学习老员工的经验。

    - 讲清楚那些应该干，如何干最有效率，那些不应该干。

    - 公司的领导必须给员工洗脑，树立正确的世界观，讲清楚公司的企业文化，认可公司的企业文化的人才留下，不认可的立刻请他走。

    - 满足员工的短期期望，比如员工想来学习，我们就告诉他我们公司可以学习很多有用的知识。员工想来赚钱，我们就告诉他，公司会对优秀的人分红，给予高待遇。员工想升官，我们就告诉他，有能力的人，业绩好的人，我们就给予升官的机会。总之要看人下菜碟，满足不同员工的需求。

    - 公司有长期目标，也有短期目标。只有长期目标与短期目标相互配合公司才能发展得更好。

    - 我们公司欢迎优秀的人加入，如果优秀的员工想换公司，我们也表示欢送，希望他职业发展得更好。但我们公司不愿意接受一个平庸，负面的人加入。这个在新员工进公司的时候，就要讲清楚。

    - 培养商业间谍，去同行的公司里学习他们的操作手法。甚至贿赂同行，学习新方法，新技术。

    - 对于不想进步，不愿意学习的人，我们直接放弃培训，甚至开除。

    - 老板要经常与同行的老板相互交流，学到更高明的盈利手段。


    ## 用人：有用就吃好喝好的待着，没用就让他走


    中国社会，有很多有才华的人，一辈子郁郁不得志，就是因为分不清感情与利益，总是把这些东西纠结在一起。


    比如，两个人开始合伙做生意，一个人明明跟不上时代，还不愿意努力学习。而你以为他开始的时候与自己同甘共苦，不想叫他走，结果是生意继续没有起色。


    其实反过来想想，有用的时候，可以当他是宝，没用了，你还当他是宝贝，就证明你脑子有问题了。


    总有一些人脑子有问题，他认为他付出一次，你就永远要对他负责。就好像一个员工因为今年做出了好成绩，以后成绩都很差，你还要给他高薪水一样不合理。老板一定要学会过河拆桥。


    只有笨蛋才老关注恩情。有本事的强者一定是关注利益的。


    企业本来是靠利益生存的，有钱，企业才能活下去，无钱，企业只能倒闭。


    所以开除不合格的员工，股东要毫无内疚之感，并且要迅速。公司越大，越是只看成绩不看恩情。


    中国人喜欢讲一句话，“饮水要思源”。其实这个思，就是记住就行了。不是说一个对你有恩，你发达了，就必须无条件的提拔他。


    就算你给他机会，他自己不好好珍惜，你也帮不了他。


    道理很简单，假如你曾经掉下山崖，被一个农夫救了，你斗成皇帝了，不是说就得把这个农夫弄来当宰相。


    老板呢，必须分清楚感情与利益。不可混为一谈。做企业就是有用的人就好吃好喝的待着，没用就让他走！


    ## 让员工自己管理自己


    我最喜欢无为而治，我不喜欢对员工做什么规定，不管做什么，我都喜欢让员工自己出方案，定策略，搞执行。因为是他们自己出的方案，定的策略，所以，他们执行得也比较到位。


    我曾经见过一个与我想法类似的公司。


    他们公司的走廊墙壁上张贴着十几条格言。“没有付出，就没有收获。”“完成工作很难，但有意义；失去工作很容易，但没有价值。”“多一个微笑，少一点矛盾；多一份责任，少一些隐患。”这些格言平实但意义深刻。看署名才知道，格言作者都是该公司的员工。


    不张贴“名人名言”，而张贴员工自己的格言，不仅是对员工格言给予的肯定，对员工价值观表示很尊重，而且也是对员工的一种鼓舞。员工每天看着自己的人生格言，就会以此对照检查自己的工作，可以常常鞭策自己，鼓舞自己，这是个好做法，为企业带来生机活力。


    各位可以变通一下用到自己公司。


    ### 老板不培养人，只选合适的人来用


    学习和进步确实是自己的事，一个底子优良的人不需要你监督，只要提供良好的环境，一定的压力，比如他身边便是积极向上的人，老板给出合理的奖惩，他自己会学习进步。


    但是有很多员工，确实就是死猪不怕开水烫，牵着不走撑着倒退的，我们是做企业的，不是学前班，如果一个人连努力都不知道，我认为这是他父母和启蒙老师的责任，不应该由我们来承担。


    培养一个人的自觉性和主动性是超级累的，付出的代价可能远超过他贡献的价值，更可悲的是，很多人到了十八岁（甚至十六岁）就“定型”了，再无改变的可能。


    从心理学上说，人的基本性格形成是在三岁之前，所以除非时间倒流，否则我们是一点办法也没有。


    你心里要有“可造”和“不可造”的概念，遇到后者，哄着骗着钳制着让他出一把力，但不要抱有让他学习进步的希望，也就是不要培养他。


    做老板，不计小节，抓大放小非常重要。


    抓大放小意味着决断力，是一种取舍，所以也可以说果断迅速的放弃一些东西。


    比如说培养员工这事，如果是我，我就会非常迅速放弃这种想法，虽然这事看起来是可行的，而采取挖墙角的方式会增加我们的用人成本。


    但如果你站在全局和长远上来看：退一万步，假设我们花一年时间把他们培养起来，而我们的利润和待遇却没有跟上。（显然跟不上，我们的精力都放在他们身上去了，而不是做业务，赚钱上去了。）－转眼他们就会被人挖走，我们就为人作嫁，难道我们是来做慈善的。


    当你看到一年以后，看到几年以后，你的企业整体盈利水平会发生什么变化（因为这些人不顶用，所以不太乐观），你知道了事情会怎么发展，你当然也就能决定现在该怎么办。所以牛逼的企业家都是站在未来看现在的人。站在未来看现在，很多问题都不是问题了。


    但倘若你纠结于如何把人培养好，你显然就会忽略培养好了又怎样？你能看多远就能走多远，因为你看到什么，就会把精力投入到什么上。


    所以如果你看得太近，看得太窄太具体，赢得一场战役，反而会输掉整个战争。


    做企业要分清核心团队和普通员工，你提拔任用的得是你的人，也就是核心团队，他们和你是生死与共的。而其他被监督管理的是普通员工，属于可以被替换的一部分。


    类似部队，提干的就是自己人了，可以长期留下来任职；其他的的就是炮灰。


    人为的制造等级差距是管理中很重要的一环。要按照人人平等的梦想，这企业没法管理。因为人与人的利益立场是不同的，不是谁都会自觉自愿的工作。其实大多数员工会把自己和企业看成是对立的，就因为你拿得多他拿得少（他们丝毫不考虑你的投资风险和机会成本），总认为自己多偷懒才是赚了。


    这种前提下，你得培养你自己的人，亲信，这些人组成了企业基本的骨架，也就是企业结构的雏形。创业的过程中，你就可以向这个方向去建立你的企业结构，实践这种用人策略。


    ## 让员工自己做计划


    我的策略是告诉员工公司的整体目标，然后让员工自己去做计划执行。我是不管他们如何完成目标的，我只要结果。


    与员工讨论制定整体目标有什么好处？就是让员工清楚的知道我们公司要干什么，这样做，能让员工理解自己工作的意义，他们会主动使用自己的大脑想问题，根据目标调整自己的动作，最终提高自己的工作效率。


    如果我们不告诉员工我们的目标，那么员工就很难理解自己工作的真正意义，就会很难管，没有向心力，没有热情，不主动。最高境界的管理，一定是理顺逻辑，让员工发自内心的思考并且主动工作。


    有很多老板喜欢自己做一个计划，然后让员工去执行，或者自己不做计划，找一个能力强的总经理来做计划，这种模式，是典型的计划经济模式。如果老板自己的能力与总经理的能力都超级强悍，那么这个公司会有一些竞争力，当这位厉害的总因为年纪的增加，精力有限的时候，企业就走上坡路。


    那么有没有办法在没有强悍的总经理或者老板的情况下，企业的业绩依然很好呢？答案是有的：就是市场经济的管理模式。调动每一个员工的头脑，而不是老板自己的头脑。


    老板再牛逼，也只有一个脑袋，就比如像项羽一样牛逼，也是无济于事的。而老板如果善于调动所有员工的脑袋，那么就算老板不迫，团队也会很牛逼，如同刘邦调动了张良，萧何，韩信的脑袋一样。


    任何一个聪明人都是没办法管理足够多的事情的。现代企业最大的资产，其实就是你那几十个或者几百个员工的脑袋，没有人愿意被执行计划，而如果是他们自己制定的计划，他们执行的愿望就会强烈些，工作也会主动些。


    所以，现代企业的管理思路应该是想尽办法让每一个员工自己动脑去制定一个计划来完成公司的目标。而不是让一个牛逼人物来制定一个整体计划让员工执行。


    老板的主要任务就是给出清晰的战略方向，确定要做什么。


    尽量让更多的人负起他们手上工作的全部责任，重要的是他们自己的计划责任，而不仅仅是执行责任。


    老板不要变成一个计划者，更加不要变成一个统一的指挥，而是做一个方向指引者，协调者，激励者就行了。


    总结一句：如果你善于利用每一个人的脑袋去做计划做执行是一定会打败利用一己之力做一个统一的大计划然后让员工去执行的聪明老板的。


    ## 奖励小功，则大功立，小功不奖，大功不立


    先讲一个故事，就是孔子的弟子子路在一个地方当市长。一天，天下大雨，有个小女孩落水了，子路二话不说，就跳进水里把这个小女孩救起来了。小女孩的父母知道后非常的感动，就把自己家的牛送给了子路；子路毫不客气的把牛收下了，并且杀了，把肉拿上跟着孔子一起吃。


    孔子一见有肉吃，边吃肉，边表扬子路干得好。


    这个时候，孔子的另一个弟子子贡来了，子贡是个有钱的大商人，就对孔子说，老师，你这样表扬子路是不对的。我们应该做好事不留名，怎么还要拿别人家的东西呢？子路这个道德境界太低了。


    孔子就说，你懂什么？如果子路拒绝别人的牛，那么以后谁还愿意见义勇为，救人于危难？道德境高界的人自然是要救人的，如果有好处，那么道德境界低的人也会去救人，子路的做法，会让道德境界高的与道德境界低的人都去救人。而子贡你的做法，恐怕弄到最后，都没人去救人了，因为人都是利益动物嘛。


    由此可见孔夫子是非常高明的。我想为什么现代社会，大家都怕扶老奶奶？因为有可能被老奶奶敲诈，所以出现了老奶奶倒地，大家都上前围观也不愿意扶她起来的现象。甚至更加严重的是，现在很多人见到老奶奶都离得远远的，就怕万一倒了，说不清楚。其实出现这种问题，就是因为榜样没有树立好。当初有几个案子，都判了扶老奶奶的人赔偿老奶奶，所以造成

    '
