    卖用户能获得什么利益，而不是卖你产品的特点


    很多销售员根本不知道面对客户应该讲些啥，把自己产品的一大堆特点，好处告诉客户，这种行为其实是在浪费自己的时间，也是在占用客户的时间。讲自己产品的特点与好处，全部都是废话，而且你讲得越多，用户越是迷茫，不知道你重点要讲什么，你不要讲你的价格便宜，其实用户根本不关心你便宜不便宜，他只关心他能获得什么利益。便宜不便宜根本不是他购买的直接原因。


    我们卖一个产品，最好是告诉用户，买了你这个产品，会给他带去什么改变。让他有已经买了这个产品的感觉。所以，我在很多场合讲过，卖产品，是卖一种感觉给用户，但很多人听不懂这句话。


    我们做销售，永远要用肯定，清晰，充满朝气，充满信心的声音将你的产品的好处传达给你的用户。没这个讲话能力的，可以去读诗歌练习。


    我看到很多销售人员讲，我这个产品里含有多少维生素，是经过了多少道工序才做出来的，有什么植物精华，保湿因子。想想这些没有经过系统训练的销售员就好笑。客户根本不关心你说的这些。客户只关心你这个产品能给他带去什么利益。所以，不管我们做广告，还是面对客户讲话，希望我们的重心永远是客户能获得什么利益，而不是你产品怎么怎么样。


    我们读什么东西，切忌用专业术语，很多销售为了显示自己牛逼，还专门去背送些说明书上的专业术语，这种销售最讨厌。你讲的话客户听不懂，他肯定就不买；高手是把复杂的事情讲简单通俗易懂，傻子是把简单的事情搞复杂。


    ### 竞争的本质是要盯着顾客不是盯着对手


    因为你说要打败谁，就等于说，你现在比别人差，你每喊一句口号，就相当于在给竞争对手做广告。并且说明了，你很崇拜这个竞争对手，诺基亚的 CEO 说要打败苹果，就只能证明，诺基亚的
    CEO 崇拜苹果公司。


    脑袋里想着竞争对手，嘴巴里念着竞争对手，等于在给竞争对手免费做广告。


    有的老板，看到竞争对手做什么产品，就决定自己要做什么产品。你的竞争对手很多，哪有那么多精力来应付竞争对手呢？


    其实，最有效的手段，你的脑袋是盯着顾客，不要盯着竞争对手。


    就跟泡姐是一个道理，你的脑袋里，眼睛里，要盯着妞，而不要盯着你的情敌，就算你能搞定一个情敌，还有无数情敌等着你搞，累死你，你也不能获得成功。你应该想妞之所想，急妞之所急，这才是泡到妞的正确做法。


    当年 QQ 与 360 打架，QQ 要求用户卸载 360，这就是典型的找情敌麻烦，不专心泡妞。而 360 就精明多了，360 说，我是帮用户抵制 QQ 的弹出窗口广告的。现在
    360 还有防止 QQ 弹窗的功能，这就是正确的泡妞策略，360 在如此激烈的竞争中，能屹立不倒，跟他正确的策略是密不可分的。


    人性有一个弱点，总是盯着谁抢了他的饭碗。不盯着谁给了他的饭碗，人民总是忽略给他饭吃的人，而跟那些抢他饭吃的人竞争。


    我们要完全改变这种思维，我们要讨好给我们饭吃的顾客，那些抢我们饭吃的竞争对手自然就饿死了。


    ### 给产品取名字的重要性做好标题党


    给自己的产品取名字的重要性，在这个注意力稀缺的年代，我们做好标题党。


    取名字非常重要，好的名字能直接划入消费者的脑袋里去，一个名字如果不上口，不容易记忆。往往要花费几十倍的广告力度，才能达到让人记得住的效果。


    虽然，不是取好了名字，产品就成功了。但是这是核心的一环。凡是做得好的产品。大多数名字都取得不错。


    我做语音节目。其实每一小节，都是花了点心思去取名字的。其他有部分人的节目的名字真是惨不忍睹，更有的人，就是用第一集，第二集这样的方式来取名字，显然是不能吸引人的眼睛的。在这个注意力非常稀缺的年代，好的名字，好的标题都是非常重要的。


    但是也有部分名字取不好的产品。也做得很好。基本就是靠时间长，做品牌，靠广告，狂轰滥炸了。


    我对怎么给产品取一个好名字有些看法。


    产品定位很重要，有人讲，产品的名字就像钩子，把品牌挂在潜在客户心智中的产品阶梯上。因此，在给产品取名时，一定要先给产品做好定位，明确产品消费目标群体，才能取一个更有力、更有效的名字。卖给儿童与卖给成年人的东西名字命名肯定是有区别的，比如你把成年人的服装命名个
    Hello Kitty 我估计这个销量就要下跌。我的节目是给创业这群人听的，所以简单直白，就叫着创业商学院，大家一看就懂，这就是我的定位。


    巧妙利用产品本质或性能，有些产品，其本身的性能或材料就是卖点。就拿食品来说，如果是用玉米提炼的成分做的糖，尽管就叫“玉米糖”，要比取什么花里胡哨、故弄玄虚、让人摸不着头脑的诸如右旋糖、高果糖等名字更加吸引人。


    针对中国人的产品，要注意文化差异和民族习俗，针对不同的消费群体，再为产品取名时就要注意充分考察消费人群的文化背景、宗教信仰和民族习俗。比如高端汽车品牌宝马、奔驰等，其中文译名就充分考虑了中国人的文化背景和吉祥追求理念，并将中国古典文化和中国人的追求吉祥的信仰巧妙地融合，不可不说绝妙。


    我们给产品或给文章命名，都力求抓住人的眼球，把产品，标题刻进人的脑子里，一个名字要融入你的产品定位针对的是什么用户群，要表达出你的行业本质。只有消费者记住你了，买单的几率才会增加。


    产品名字要易于传播，我们的思想宣传必须是人民群众喜欢的。凡是标新立异的，凸显自己创意的人，都没什么前途，而且还要能让最无知的人也能一听就明白。


    做任何事，都要大众化，大众化，才有群众基础，有了群众基础，才有力量，360 击败金山毒霸就是如此。伟大领袖革命成功也是因为 有群众基础。


    能流传千古的诗句多是“白日依山尽”，“床前明月光”，“粒粒皆辛苦”之类，越简单传播成本越低，因为老百姓听得懂啊。


    复杂的，高雅的就是和群众做对！推广起来费时费力，人民群众记不住，没有群众基础，就灭亡了。


    ## 现代营销学的方向是什么


    现代营销越来越向心理学靠拢，追其原因，一方面是因为社会生产力的发展，人们的基本需求已经得到满足；另一方面是竞争激烈，导致卖方不得已，要玩出许多花样来，不再是那个以产品为导向，“便宜量又足”就能立足的时代已经要过时了！（不过这话得有所保留，便宜量又足在任何时代都是有竞争力的，因为穷人总是很多，但我们不赚穷人的钱，因为穷人的钱要拿去生存，我们要赚钱暴利，就要研究现代营销学的方向，那就是心理学，我们要满足的是富人的精神需求）。


    这就要说象征性消费，是人，就有自然属性，有社会属性。


    自然属性顾名思义，就是自然赋予的属性，比如食色性也，比如对安全的需要，比如保暖的需要……简单解释，一个婴儿，被丢到一个孤岛上，从小别让他接触任何人，脱离人类社会，这种情况下，他的需求，就对应着他的自然属性。


    社会属性，就是人类社会，其他人，赋予的属性。


    比如穿衣服，原始目的，只是为了保暖，那你为什么不披一床棉被呢？你知道什么是美什么是丑，知道什么是高大上什么是矮低俗……这些观念，它不是你生下来就具有的，不是你的生物属性，它实际上是你身边的人灌输给你的。


    我们就可以看出，买一件衣服，生物需求只占很小的比重，社会需求占大头。以一件售价 1000 元的衣服来说，它满足你生物需求的那一部分价值，可能还不到 50 元。这个社会需求，本质是要得到他人的认可。衣服穿给谁看？传给别人看。


    有人说，我是穿给自己看的！其实啊，你生在人类社会，你还有自己么？你的观念你的想法，都是自然属性和社会属性共同作用的结果，你看见老太太摔倒你就去扶，你以为那是你本能的想法？


    社会需求的本身，就带着一种象征性的意义和价值，就是一种符号，标签，标示着你的立场，标示着你属于不同阵营。


    人活在社会中，必须有立场，必然有立场，除非你脱离社会，但今天谁能脱离社会？谁能不和其他人接触？不能，谁都不能。就算去当和尚，你得下山来买东西买盐啊。更何况“出家人”本身，就是一种立场。


    只要你处于某个立场，你就得“象征性的消费”，对大多数情况，你感觉不到被迫，会以为这是自己自然的选择，也分不清那些消费是象征性的，但是极端情况，你可以察觉到。


    比如买车，日本车有什么不好？没什么不好。你本身不讨厌日本车，也很清楚两国贸易对大家都有好处，也很清楚“敌人和朋友”，是一个硬币的两面，某些人和你是敌人，但是某些方面同时是你的朋友，某些人和你是朋友，但在某些方面却是你的敌人。


    道理都懂，但是，你身边的朋友都不买日本车，你为了避免和他们发生争执和矛盾，也为了避免他们疏远你，你也只好跟着不买。


    这种情况下，你会感觉到有一点被强迫；但是大多数情况下，你察觉不到，比如什么是美，什么是高大上，什么是有气质，什么是范儿；你有你的一套理解，但是你的这一套理解，不是天上掉下来的，它是你身边的人，社会，灌输给你的，这些东西决定着你的选择，让你自觉自愿的选择了某种象征性消费，让你隶属于某个立场。


    当然应当指出，这种社会需求不是没有现实意义的，比如你开辆好车，勾搭妹纸都会容易些；这种标签（高富帅，成功人士），让你更容易获得和你处于同一个立场的人的认可，更容易获得社会资源（例如人脉关系）。


    但是整个决策过程，都在你的潜意识中完成了，很少有人会认识到：自己喜欢“宝马，奔驰，奥迪”，不喜欢“本田，丰田，马自达”是为什么。


    他们不知道不要紧，我们作为商人知道就行了，就像病人不知道药物原理不要紧，医生知道就行了。


    现代营销走向了忽悠之路，所以我们选择一个群体，通过宣传潜移默化的影响他们，让他们认为某种东西具有“标签”的意义一典型的 60，70 年代的毛主席像章，你敢不买？你能不买吗？


    这个东西，象征性太强，一眼就能看出来。其他产品的象征性不强，但并不表示没有，任何产品，都必然有社会价值，对应着一种社会属性，一种立场。现代营销学，就是要研究如何卖社会属性，研究卖立场，这也是自媒体可以赚钱，社交网络营销为什么可以赚钱的原因。


    中日中美关系紧张起来之后，神车大众甚至要加价提车，到现在都还没有回落到正常水平，这个加的这一部分价，就可以理解成象征性需求带来的增值。


    最后，完全意义的象征性消费非常少见，典型的也只有毛主席像章了，这个词改成“象征性需求”“象征性社会价值”会比较准确，也容易被理解些。


    最后给大家一个总结，随着时代的发展，人们的社会需求会远远大于生物需求，而赚钱，就要满足人的社会需求，所以，现代营销学要研究人的心，也就走向了心理学之路，忽悠之路，才能赚取暴利。


    ### 卖产品就是给用户找购买理由


    现代社会，生产力空前发展，做好商品等着顾客来买的时代已经一去不复返了。


    卖产品，必须卖到心理学层面，卖产品已经不是卖产品了，而是给用户购买理由，找行动理由。


    产品的名字，都要体现出来购买指令，广告就是货架，产品就是媒体。其作用是告诉顾客为什么要买你的产品，而不是介绍产品。


    你如何才能做出一个好产品，其实根本不是有一个好想法，是去观察人们的行为特征，心理活动。经济学其实是心理学的延伸。做生意其实是心理游戏。人类的每一个动作，都是心理的延伸。价格只是一种感觉，付款只是一种期待。我自己在说什么，我其实都搞不清楚，但就是这种搞不清楚的东西在支配着这个世界。一般的产品，只能解决人们显性的问题，高级的产品，利润高的暴利产，解决的是人们心理的问题。没有多少人能达到这个高度，所以，暴利只对少数商业心理学家开放。


    人们需要的是理由，不管做什么，你只要有充足的理由，人们就会支持你。送礼就送脑白金，就是一个理由，收礼只收脑白金，也是一个理由。你嫁给我，衣食无忧，也是一个理由。跟我创业可以成为亿万富翁也是一个理由。


    其实，打土豪，分田地，也是一个理由。给其一个理由，可以让其粉身碎骨浑不怕。脱掉她的衣服，你只要能找到好的理由！就可以实现。


    张仪，苏秦，靠理由混社会，话语就是围棋！


    ### 你没发财，只是你没把定义卖给对的人


    一切事物是相互依存的，没有任何一样东西能独立的存在，有穷人就必须有富人。


    有男人，就必须有女人。有老板，就必须有员工，更深入的讲，老板必须待员工好，你的企业才能发展壮大，本身才会好。企图只让自己好的老板，员工是不会让你得逞的。


    一切事物都是相互依存的，没有真正的独立。二鹿奶粉用了三聚氰胺害了很多婴儿，所以三鹿就倒闭了。凡是伟大的企业，都是真心实意帮助顾客的。凡是圣人都是竭心尽力为人类造福的。


    整个宇宙都是无常变幻的，王座不可能永恒。道德的定义也随着时代的精神一直在变幻。古代一个你男人可以娶好几个老婆。现在中国实行的一夫一妻制。作为商人，必须与时俱进，跟着新科技奔跑，方能赚取巨额财富。


    蛋如果煮熟，你就不能改变什么了，任何事情都有个时间限制，人生最要紧的是踏准节拍，该结婚必须结婚，该恋爱必须恋爱。


    创业也是如此，最黄金的创业年纪应该在 20 到 30 岁。过了 30 岁后，你的生活压力，父母给你的压力，都会让你诚惶诚恐。如果你到了 50 岁，60 岁，再要创业，可能你连合伙人都找不到，员工也不会相信你会成功了。


    每段关系最终都会结束，天下没有不散的筵席，但我们在有关系的时候，要尽情去演戏。没有天长地久，只有尽情演戏的人才不会留下遗憾。人生就是演戏，如果你想活得久一点，你可以选择不抽烟多运动。如果你想多赚钱，你就开始学习财务知识，创业知识，企业管理知识，并且去实践。赶在蛋已煮熟之前行动。


    对某些人痛苦的定义，对其他人却是快乐的，商人就是能靠概念赚钱的人，靠定义赚钱的人。送礼就送脑白金，对有些人来讲是弱智的，对有些人来讲却是救命稻草。你没发财，只是你没把定义卖给对的人


    ### 我的网络营销态度


    先给大家扯淡点穷人的习性。


    穷人做事，多而杂，富人做事，少而专且精。穷人贪心得很，穷人啥都干。越干越穷，看起来很忙，实则是因为舍不得钱休闲，所以一直忙着节约钱。


    我见过一穷人，很早起床要自己做饭，做好了饭，自己吃了，还要带一份到公司当午饭吃，以便节约钱。


    他还要送小孩上学。然后自己挤地铁上班。穷人不舍得打车。因为他要节约钱。再我看来，这是一种贪心，穷下班还要去市场买菜烧饭。忙完了，他还要忙着看电视剧，看新闻，时间表排的满满的。


    而富有的人，只做一件事，把一件事做到极致，就赚到钱了，赚到钱了，啥都不用忙了。当然喜欢工作的继续把这件事做到大师级。


    史玉柱东山再起这 20 年，就只做了两个产品“脑白金”“征途”。真是聚焦到极致。对于普通人来讲，成功之道无他：“聚焦，聚焦，再聚焦”。把所有精力都投入到一件事情上面，那么自然就可以比那些分散精力的人走得更远得多。


    谈完这些，我们再来谈我们的营销策略，就清晰了。营销的具体方式有很多，我们谈主要的三类：软文营销，语音营销，视频营销。


    我们就单说软文营销。按我的方式又分为：自己写的，抄的，改编的。


    再细分这个改编的软文题材。又分为小说题材。故事形式题材。说理形式酣的。


    这里面的故事形式题材又分为，他人的故事，自己的故事。都分到这个份上，其实还可以继续分下去。这种分析的目的是为了找到适合自己的软文形式。


    我们测试的结果是，自己的故事题材是最有效果的；那我们就重点做自己的故事形式的软文改编。我们的引流方式是软文引流。我们在做这种具体的事情的时候，出现了其他非常多的诱惑。比如，我们知道分类信息网站上的“色流”。流量很大，我们有冲动去做。同时我们是做网站的，做
    SEO 的。我们做装修类网站，一年能搞几十万。我们必须抵御这种诱惑，不能分散精力。必须一心一意的做改编自己故事题材的软文营销。


    目前，主攻的是天涯论坛。


    网赚的道路，必须聚焦，聚焦，再聚焦。从生活态度到工作的内 容细分，都必须到这一点。


    然后还要抵御住其他诱惑，由于我们是专门研究，测试暴利项目的，更是要抵御很多项目的诱惑。其实方法对了，做啥都能成功。


    再然后是要坚持持续在一个项目上死磕三个月。你不能期待今天发一篇软文，明天就能收入几千，那这个钱也太好赚了。


    最后，再没有出成绩的时候，要加大量，不停的做，不能灰心，但要总结，相信“一分耕耘一分收获”。


    ## 虚虚实实才是营销之道


    太过老实，直白的人啊，在中国这个社会确实是非常难混的。典型的代表人物，就是技术员，普通老百姓。


    还有些普通的业务员也很直白，这就让我大吃一惊了。营销呢，必虚虚实实，有手段。


    比如，我们卖一件衣服，你的衣服有 1000 的，有 2000 的，有 3000 的。顾客进店里了，不要直接推荐低价的，先推荐最高价的，他一看，这么贵，然后你再顺势推荐一个低价的给他，他的心理就比较能接收了，这就是虚晃一枪。


    再比如单品营销手段，讲这件衣服只有一件了，非常抢手，不买就没了，估计你明天来，肯定就卖掉了。人都有一个心理，怕永久的失去一件东西，这样成交率也会上升。


    还有涨价营销手段，比如，你今天来运气好，接到总部要求，明天我们这个货物就，涨价了，要买赶快买。


    还有限售营销，讲最后几个名额，这个在那些办会员金卡的店里，经常有商家去用。


    这些东西啊，其是非常有用，但是老实人呢，总觉得这样不道德，良心上过不去，所以很难做好生意。


    我们商人，还是要在商言商，没有手段的商人，就如同没有爪牙的老虎，啥也干不了，还是用上这些手段，比赛谁赚得钱多吧。


    ### 利用人性让用户快速买单


    要想选择一个长盛不衰的项目，能赚大钱的项目，还是得利用人性。你要思考，你这个项目能不能让用户一直想起你，营销的本质是消费者头脑中的战争，只有刚性需求的产品或服务，才能让用户随时都想起。第二个是，你这个项目提供的产品，服务，是不是用户的迫切需求。只有迫切的需求，用户才容易掏钱。要不然，用户就拖啊拖啊，最后你没钱了，就倒闭了，用户还不消费。


    我们做营销的时候，可以通过人性的弱点去放大用户的迫切性，让用户快速掏钱买单。


    我总结了下面五点：


    - 第一：通过恐惧去放大用户的迫切性，像医院的医生，你本来是个小病，他会恐吓你不动手术会怎么怎么样，然后很多根本不用动手术的人都被他们弄的去动手术了。大家也可以用这一招去卖自己的产品，服务。

    - 第二：色欲。比如可口可乐的瓶子，实际上是女人的身体曲线，男人握住这个瓶子，潜意识会感觉到很爽，这其实是从潜意识层面去营销人了。意识成面用色欲去营销人的很多，比如卖房子用美女，卖车用美女，如果请不起美女，可以用图画，反正就是这么个套路。

    - 第三：利用用户的懒惰，买了你这个产品或者服务，会给他带去什么什么样的方便，会改善他的生活。比如买了吸尘器，就不用自己擦灰了。

    - 第四：贪婪，买了你这个产品，服务，会送他什么什么东西。

    - 第五：性价比，要做一些同类产品的对比，你这个产品，服务：是价格最便宜，服务最周到。


    办法总是人想出来的，这些套路都能加大用户购买的迫切感，把这些概念传递给用户，让用户快速掏钱买单。


    ### 利用产品名字把营销玩到人类的潜意识里去


    首先给大家讲一个概念，我们大家使用的词语本身是没有任何含义的，含义不是在词语本身，而在于使用这些词语的主体，文字本省仅仅是个符号而已。


    打个比喻，糖罐在放糖之前，是个空罐。同理，词语在人们使用并赋予它含义之前，是没有含义的。


    你如果往一只漏斗里倒糖，糖是存不住的，同理，给一个靠不住的词语添加含义，结果也是撑不住的，要明确表达你的含义，你最好换一个靠的住的词语。


    比如：大众汽车，这个词语包含不了高档豪华汽车的概念。

    '
  mdcn: '

    - 曲折动人

    - 易于记忆

    - 没有废话。


    卖用户能获得什么利益，而不是卖你产品的特点


    很多销售员根本不知道面对客户应该讲些啥，把自己产品的一大堆特点，好处告诉客户，这种行为其实是在浪费自己的时间，也是在占用客户的时间。讲自己产品的特点与好处，全部都是废话，而且你讲得越多，用户越是迷茫，不知道你重点要讲什么，你不要讲你的价格便宜，其实用户根本不关心你便宜不便宜，他只关心他能获得什么利益。便宜不便宜根本不是他购买的直接原因。


    我们卖一个产品，最好是告诉用户，买了你这个产品，会给他带去什么改变。让他有已经买了这个产品的感觉。所以，我在很多场合讲过，卖产品，是卖一种感觉给用户，但很多人听不懂这句话。


    我们做销售，永远要用肯定，清晰，充满朝气，充满信心的声音将你的产品的好处传达给你的用户。没这个讲话能力的，可以去读诗歌练习。


    我看到很多销售人员讲，我这个产品里含有多少维生素，是经过了多少道工序才做出来的，有什么植物精华，保湿因子。想想这些没有经过系统训练的销售员就好笑。客户根本不关心你说的这些。客户只关心你这个产品能给他带去什么利益。所以，不管我们做广告，还是面对客户讲话，希望我们的重心永远是客户能获得什么利益，而不是你产品怎么怎么样。


    我们读什么东西，切忌用专业术语，很多销售为了显示自己牛逼，还专门去背送些说明书上的专业术语，这种销售最讨厌。你讲的话客户听不懂，他肯定就不买；高手是把复杂的事情讲简单通俗易懂，傻子是把简单的事情搞复杂。


    ### 竞争的本质是要盯着顾客不是盯着对手


    因为你说要打败谁，就等于说，你现在比别人差，你每喊一句口号，就相当于在给竞争对手做广告。并且说明了，你很崇拜这个竞争对手，诺基亚的 CEO 说要打败苹果，就只能证明，诺基亚的
    CEO 崇拜苹果公司。


    脑袋里想着竞争对手，嘴巴里念着竞争对手，等于在给竞争对手免费做广告。


    有的老板，看到竞争对手做什么产品，就决定自己要做什么产品。你的竞争对手很多，哪有那么多精力来应付竞争对手呢？


    其实，最有效的手段，你的脑袋是盯着顾客，不要盯着竞争对手。


    就跟泡姐是一个道理，你的脑袋里，眼睛里，要盯着妞，而不要盯着你的情敌，就算你能搞定一个情敌，还有无数情敌等着你搞，累死你，你也不能获得成功。你应该想妞之所想，急妞之所急，这才是泡到妞的正确做法。


    当年 QQ 与 360 打架，QQ 要求用户卸载 360，这就是典型的找情敌麻烦，不专心泡妞。而 360 就精明多了，360 说，我是帮用户抵制 QQ 的弹出窗口广告的。现在
    360 还有防止 QQ 弹窗的功能，这就是正确的泡妞策略，360 在如此激烈的竞争中，能屹立不倒，跟他正确的策略是密不可分的。


    人性有一个弱点，总是盯着谁抢了他的饭碗。不盯着谁给了他的饭碗，人民总是忽略给他饭吃的人，而跟那些抢他饭吃的人竞争。


    我们要完全改变这种思维，我们要讨好给我们饭吃的顾客，那些抢我们饭吃的竞争对手自然就饿死了。


    ### 给产品取名字的重要性做好标题党


    给自己的产品取名字的重要性，在这个注意力稀缺的年代，我们做好标题党。


    取名字非常重要，好的名字能直接划入消费者的脑袋里去，一个名字如果不上口，不容易记忆。往往要花费几十倍的广告力度，才能达到让人记得住的效果。


    虽然，不是取好了名字，产品就成功了。但是这是核心的一环。凡是做得好的产品。大多数名字都取得不错。


    我做语音节目。其实每一小节，都是花了点心思去取名字的。其他有部分人的节目的名字真是惨不忍睹，更有的人，就是用第一集，第二集这样的方式来取名字，显然是不能吸引人的眼睛的。在这个注意力非常稀缺的年代，好的名字，好的标题都是非常重要的。


    但是也有部分名字取不好的产品。也做得很好。基本就是靠时间长，做品牌，靠广告，狂轰滥炸了。


    我对怎么给产品取一个好名字有些看法。


    产品定位很重要，有人讲，产品的名字就像钩子，把品牌挂在潜在客户心智中的产品阶梯上。因此，在给产品取名时，一定要先给产品做好定位，明确产品消费目标群体，才能取一个更有力、更有效的名字。卖给儿童与卖给成年人的东西名字命名肯定是有区别的，比如你把成年人的服装命名个
    Hello Kitty 我估计这个销量就要下跌。我的节目是给创业这群人听的，所以简单直白，就叫着创业商学院，大家一看就懂，这就是我的定位。


    巧妙利用产品本质或性能，有些产品，其本身的性能或材料就是卖点。就拿食品来说，如果是用玉米提炼的成分做的糖，尽管就叫“玉米糖”，要比取什么花里胡哨、故弄玄虚、让人摸不着头脑的诸如右旋糖、高果糖等名字更加吸引人。


    针对中国人的产品，要注意文化差异和民族习俗，针对不同的消费群体，再为产品取名时就要注意充分考察消费人群的文化背景、宗教信仰和民族习俗。比如高端汽车品牌宝马、奔驰等，其中文译名就充分考虑了中国人的文化背景和吉祥追求理念，并将中国古典文化和中国人的追求吉祥的信仰巧妙地融合，不可不说绝妙。


    我们给产品或给文章命名，都力求抓住人的眼球，把产品，标题刻进人的脑子里，一个名字要融入你的产品定位针对的是什么用户群，要表达出你的行业本质。只有消费者记住你了，买单的几率才会增加。


    产品名字要易于传播，我们的思想宣传必须是人民群众喜欢的。凡是标新立异的，凸显自己创意的人，都没什么前途，而且还要能让最无知的人也能一听就明白。


    做任何事，都要大众化，大众化，才有群众基础，有了群众基础，才有力量，360 击败金山毒霸就是如此。伟大领袖革命成功也是因为 有群众基础。


    能流传千古的诗句多是“白日依山尽”，“床前明月光”，“粒粒皆辛苦”之类，越简单传播成本越低，因为老百姓听得懂啊。


    复杂的，高雅的就是和群众做对！推广起来费时费力，人民群众记不住，没有群众基础，就灭亡了。


    ## 现代营销学的方向是什么


    现代营销越来越向心理学靠拢，追其原因，一方面是因为社会生产力的发展，人们的基本需求已经得到满足；另一方面是竞争激烈，导致卖方不得已，要玩出许多花样来，不再是那个以产品为导向，“便宜量又足”就能立足的时代已经要过时了！（不过这话得有所保留，便宜量又足在任何时代都是有竞争力的，因为穷人总是很多，但我们不赚穷人的钱，因为穷人的钱要拿去生存，我们要赚钱暴利，就要研究现代营销学的方向，那就是心理学，我们要满足的是富人的精神需求）。


    这就要说象征性消费，是人，就有自然属性，有社会属性。


    自然属性顾名思义，就是自然赋予的属性，比如食色性也，比如对安全的需要，比如保暖的需要……简单解释，一个婴儿，被丢到一个孤岛上，从小别让他接触任何人，脱离人类社会，这种情况下，他的需求，就对应着他的自然属性。


    社会属性，就是人类社会，其他人，赋予的属性。


    比如穿衣服，原始目的，只是为了保暖，那你为什么不披一床棉被呢？你知道什么是美什么是丑，知道什么是高大上什么是矮低俗……这些观念，它不是你生下来就具有的，不是你的生物属性，它实际上是你身边的人灌输给你的。


    我们就可以看出，买一件衣服，生物需求只占很小的比重，社会需求占大头。以一件售价 1000 元的衣服来说，它满足你生物需求的那一部分价值，可能还不到 50 元。这个社会需求，本质是要得到他人的认可。衣服穿给谁看？传给别人看。


    有人说，我是穿给自己看的！其实啊，你生在人类社会，你还有自己么？你的观念你的想法，都是自然属性和社会属性共同作用的结果，你看见老太太摔倒你就去扶，你以为那是你本能的想法？


    社会需求的本身，就带着一种象征性的意义和价值，就是一种符号，标签，标示着你的立场，标示着你属于不同阵营。


    人活在社会中，必须有立场，必然有立场，除非你脱离社会，但今天谁能脱离社会？谁能不和其他人接触？不能，谁都不能。就算去当和尚，你得下山来买东西买盐啊。更何况“出家人”本身，就是一种立场。


    只要你处于某个立场，你就得“象征性的消费”，对大多数情况，你感觉不到被迫，会以为这是自己自然的选择，也分不清那些消费是象征性的，但是极端情况，你可以察觉到。


    比如买车，日本车有什么不好？没什么不好。你本身不讨厌日本车，也很清楚两国贸易对大家都有好处，也很清楚“敌人和朋友”，是一个硬币的两面，某些人和你是敌人，但是某些方面同时是你的朋友，某些人和你是朋友，但在某些方面却是你的敌人。


    道理都懂，但是，你身边的朋友都不买日本车，你为了避免和他们发生争执和矛盾，也为了避免他们疏远你，你也只好跟着不买。


    这种情况下，你会感觉到有一点被强迫；但是大多数情况下，你察觉不到，比如什么是美，什么是高大上，什么是有气质，什么是范儿；你有你的一套理解，但是你的这一套理解，不是天上掉下来的，它是你身边的人，社会，灌输给你的，这些东西决定着你的选择，让你自觉自愿的选择了某种象征性消费，让你隶属于某个立场。


    当然应当指出，这种社会需求不是没有现实意义的，比如你开辆好车，勾搭妹纸都会容易些；这种标签（高富帅，成功人士），让你更容易获得和你处于同一个立场的人的认可，更容易获得社会资源（例如人脉关系）。


    但是整个决策过程，都在你的潜意识中完成了，很少有人会认识到：自己喜欢“宝马，奔驰，奥迪”，不喜欢“本田，丰田，马自达”是为什么。


    他们不知道不要紧，我们作为商人知道就行了，就像病人不知道药物原理不要紧，医生知道就行了。


    现代营销走向了忽悠之路，所以我们选择一个群体，通过宣传潜移默化的影响他们，让他们认为某种东西具有“标签”的意义一典型的 60，70 年代的毛主席像章，你敢不买？你能不买吗？


    这个东西，象征性太强，一眼就能看出来。其他产品的象征性不强，但并不表示没有，任何产品，都必然有社会价值，对应着一种社会属性，一种立场。现代营销学，就是要研究如何卖社会属性，研究卖立场，这也是自媒体可以赚钱，社交网络营销为什么可以赚钱的原因。


    中日中美关系紧张起来之后，神车大众甚至要加价提车，到现在都还没有回落到正常水平，这个加的这一部分价，就可以理解成象征性需求带来的增值。


    最后，完全意义的象征性消费非常少见，典型的也只有毛主席像章了，这个词改成“象征性需求”“象征性社会价值”会比较准确，也容易被理解些。


    最后给大家一个总结，随着时代的发展，人们的社会需求会远远大于生物需求，而赚钱，就要满足人的社会需求，所以，现代营销学要研究人的心，也就走向了心理学之路，忽悠之路，才能赚取暴利。


    ### 卖产品就是给用户找购买理由


    现代社会，生产力空前发展，做好商品等着顾客来买的时代已经一去不复返了。


    卖产品，必须卖到心理学层面，卖产品已经不是卖产品了，而是给用户购买理由，找行动理由。


    产品的名字，都要体现出来购买指令，广告就是货架，产品就是媒体。其作用是告诉顾客为什么要买你的产品，而不是介绍产品。


    你如何才能做出一个好产品，其实根本不是有一个好想法，是去观察人们的行为特征，心理活动。经济学其实是心理学的延伸。做生意其实是心理游戏。人类的每一个动作，都是心理的延伸。价格只是一种感觉，付款只是一种期待。我自己在说什么，我其实都搞不清楚，但就是这种搞不清楚的东西在支配着这个世界。一般的产品，只能解决人们显性的问题，高级的产品，利润高的暴利产，解决的是人们心理的问题。没有多少人能达到这个高度，所以，暴利只对少数商业心理学家开放。


    人们需要的是理由，不管做什么，你只要有充足的理由，人们就会支持你。送礼就送脑白金，就是一个理由，收礼只收脑白金，也是一个理由。你嫁给我，衣食无忧，也是一个理由。跟我创业可以成为亿万富翁也是一个理由。


    其实，打土豪，分田地，也是一个理由。给其一个理由，可以让其粉身碎骨浑不怕。脱掉她的衣服，你只要能找到好的理由！就可以实现。


    张仪，苏秦，靠理由混社会，话语就是围棋！


    ### 你没发财，只是你没把定义卖给对的人


    一切事物是相互依存的，没有任何一样东西能独立的存在，有穷人就必须有富人。


    有男人，就必须有女人。有老板，就必须有员工，更深入的讲，老板必须待员工好，你的企业才能发展壮大，本身才会好。企图只让自己好的老板，员工是不会让你得逞的。


    一切事物都是相互依存的，没有真正的独立。二鹿奶粉用了三聚氰胺害了很多婴儿，所以三鹿就倒闭了。凡是伟大的企业，都是真心实意帮助顾客的。凡是圣人都是竭心尽力为人类造福的。


    整个宇宙都是无常变幻的，王座不可能永恒。道德的定义也随着时代的精神一直在变幻。古代一个你男人可以娶好几个老婆。现在中国实行的一夫一妻制。作为商人，必须与时俱进，跟着新科技奔跑，方能赚取巨额财富。


    蛋如果煮熟，你就不能改变什么了，任何事情都有个时间限制，人生最要紧的是踏准节拍，该结婚必须结婚，该恋爱必须恋爱。


    创业也是如此，最黄金的创业年纪应该在 20 到 30 岁。过了 30 岁后，你的生活压力，父母给你的压力，都会让你诚惶诚恐。如果你到了 50 岁，60 岁，再要创业，可能你连合伙人都找不到，员工也不会相信你会成功了。


    每段关系最终都会结束，天下没有不散的筵席，但我们在有关系的时候，要尽情去演戏。没有天长地久，只有尽情演戏的人才不会留下遗憾。人生就是演戏，如果你想活得久一点，你可以选择不抽烟多运动。如果你想多赚钱，你就开始学习财务知识，创业知识，企业管理知识，并且去实践。赶在蛋已煮熟之前行动。


    对某些人痛苦的定义，对其他人却是快乐的，商人就是能靠概念赚钱的人，靠定义赚钱的人。送礼就送脑白金，对有些人来讲是弱智的，对有些人来讲却是救命稻草。你没发财，只是你没把定义卖给对的人


    ### 我的网络营销态度


    先给大家扯淡点穷人的习性。


    穷人做事，多而杂，富人做事，少而专且精。穷人贪心得很，穷人啥都干。越干越穷，看起来很忙，实则是因为舍不得钱休闲，所以一直忙着节约钱。


    我见过一穷人，很早起床要自己做饭，做好了饭，自己吃了，还要带一份到公司当午饭吃，以便节约钱。


    他还要送小孩上学。然后自己挤地铁上班。穷人不舍得打车。因为他要节约钱。再我看来，这是一种贪心，穷下班还要去市场买菜烧饭。忙完了，他还要忙着看电视剧，看新闻，时间表排的满满的。


    而富有的人，只做一件事，把一件事做到极致，就赚到钱了，赚到钱了，啥都不用忙了。当然喜欢工作的继续把这件事做到大师级。


    史玉柱东山再起这 20 年，就只做了两个产品“脑白金”“征途”。真是聚焦到极致。对于普通人来讲，成功之道无他：“聚焦，聚焦，再聚焦”。把所有精力都投入到一件事情上面，那么自然就可以比那些分散精力的人走得更远得多。


    谈完这些，我们再来谈我们的营销策略，就清晰了。营销的具体方式有很多，我们谈主要的三类：软文营销，语音营销，视频营销。


    我们就单说软文营销。按我的方式又分为：自己写的，抄的，改编的。


    再细分这个改编的软文题材。又分为小说题材。故事形式题材。说理形式酣的。


    这里面的故事形式题材又分为，他人的故事，自己的故事。都分到这个份上，其实还可以继续分下去。这种分析的目的是为了找到适合自己的软文形式。


    我们测试的结果是，自己的故事题材是最有效果的；那我们就重点做自己的故事形式的软文改编。我们的引流方式是软文引流。我们在做这种具体的事情的时候，出现了其他非常多的诱惑。比如，我们知道分类信息网站上的“色流”。流量很大，我们有冲动去做。同时我们是做网站的，做
    SEO 的。我们做装修类网站，一年能搞几十万。我们必须抵御这种诱惑，不能分散精力。必须一心一意的做改编自己故事题材的软文营销。


    目前，主攻的是天涯论坛。


    网赚的道路，必须聚焦，聚焦，再聚焦。从生活态度到工作的内 容细分，都必须到这一点。


    然后还要抵御住其他诱惑，由于我们是专门研究，测试暴利项目的，更是要抵御很多项目的诱惑。其实方法对了，做啥都能成功。


    再然后是要坚持持续在一个项目上死磕三个月。你不能期待今天发一篇软文，明天就能收入几千，那这个钱也太好赚了。


    最后，再没有出成绩的时候，要加大量，不停的做，不能灰心，但要总结，相信“一分耕耘一分收获”。


    ## 虚虚实实才是营销之道


    太过老实，直白的人啊，在中国这个社会确实是非常难混的。典型的代表人物，就是技术员，普通老百姓。


    还有些普通的业务员也很直白，这就让我大吃一惊了。营销呢，必虚虚实实，有手段。


    比如，我们卖一件衣服，你的衣服有 1000 的，有 2000 的，有 3000 的。顾客进店里了，不要直接推荐低价的，先推荐最高价的，他一看，这么贵，然后你再顺势推荐一个低价的给他，他的心理就比较能接收了，这就是虚晃一枪。


    再比如单品营销手段，讲这件衣服只有一件了，非常抢手，不买就没了，估计你明天来，肯定就卖掉了。人都有一个心理，怕永久的失去一件东西，这样成交率也会上升。


    还有涨价营销手段，比如，你今天来运气好，接到总部要求，明天我们这个货物就，涨价了，要买赶快买。


    还有限售营销，讲最后几个名额，这个在那些办会员金卡的店里，经常有商家去用。


    这些东西啊，其是非常有用，但是老实人呢，总觉得这样不道德，良心上过不去，所以很难做好生意。


    我们商人，还是要在商言商，没有手段的商人，就如同没有爪牙的老虎，啥也干不了，还是用上这些手段，比赛谁赚得钱多吧。


    ### 利用人性让用户快速买单


    要想选择一个长盛不衰的项目，能赚大钱的项目，还是得利用人性。你要思考，你这个项目能不能让用户一直想起你，营销的本质是消费者头脑中的战争，只有刚性需求的产品或服务，才能让用户随时都想起。第二个是，你这个项目提供的产品，服务，是不是用户的迫切需求。只有迫切的需求，用户才容易掏钱。要不然，用户就拖啊拖啊，最后你没钱了，就倒闭了，用户还不消费。


    我们做营销的时候，可以通过人性的弱点去放大用户的迫切性，让用户快速掏钱买单。


    我总结了下面五点：


    - 第一：通过恐惧去放大用户的迫切性，像医院的医生，你本来是个小病，他会恐吓你不动手术会怎么怎么样，然后很多根本不用动手术的人都被他们弄的去动手术了。大家也可以用这一招去卖自己的产品，服务。

    - 第二：色欲。比如可口可乐的瓶子，实际上是女人的身体曲线，男人握住这个瓶子，潜意识会感觉到很爽，这其实是从潜意识层面去营销人了。意识成面用色欲去营销人的很多，比如卖房子用美女，卖车用美女，如果请不起美女，可以用图画，反正就是这么个套路。

    - 第三：利用用户的懒惰，买了你这个产品或者服务，会给他带去什么什么样的方便，会改善他的生活。比如买了吸尘器，就不用自己擦灰了。

    - 第四：贪婪，买了你这个产品，服务，会送他什么什么东西。

    - 第五：性价比，要做一些同类产品的对比，你这个产品，服务：是价格最便宜，服务最周到。


    办法总是人想出来的，这些套路都能加大用户购买的迫切感，把这些概念传递给用户，让用户快速掏钱买单。


    ### 利用产品名字把营销玩到人类的潜意识里去


    首先给大家讲一个概念，我们大家使用的词语本身是没有任何含义的，含义不是在词语本身，而在于使用这些词语的主体，文字本省仅仅是个符号而已。


    打个比喻，糖罐在放糖之前，是个空罐。同理，词语在人们使用并赋予它含义之前，是没有含义的。


    你如果往一只漏斗里倒糖，糖是存不住的，同理，给一个靠不住的词语添加含义，结果也是撑不住的，要明确表达你的含义，你最好换一个靠的住的词语。


    比如：大众汽车，这个词语包含不了高档豪华汽车的概念。

