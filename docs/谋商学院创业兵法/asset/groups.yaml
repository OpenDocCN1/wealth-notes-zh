    我的网络营销态度


    先给大家扯淡点穷人的习性。


    穷人做事，多而杂，富人做事，少而专且精。穷人贪心得很，穷人啥都干。越干越穷，看起来很忙，实则是因为舍不得钱休闲，所以一直忙着节约钱。


    我见过一穷人，很早起床要自己做饭，做好了饭，自己吃了，还要带一份到公司当午饭吃，以便节约钱。


    他还要送小孩上学。然后自己挤地铁上班。穷人不舍得打车。因为他要节约钱。再我看来，这是一种贪心，穷下班还要去市场买菜烧饭。忙完了，他还要忙着看电视剧，看新闻，时间表排的满满的。


    而富有的人，只做一件事，把一件事做到极致，就赚到钱了，赚到钱了，啥都不用忙了。当然喜欢工作的继续把这件事做到大师级。


    史玉柱东山再起这 20 年，就只做了两个产品“脑白金”“征途”。真是聚焦到极致。对于普通人来讲，成功之道无他：“聚'
