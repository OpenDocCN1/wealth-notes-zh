    # 草根创业初期采取短期目标管理


    战略是干出来的，不是想出来的。现在很多创业者由于看了太多马云，史玉柱，潘石屹，老是喜欢谈天马行空的战略，谈企业规范化谈管理制度。企图用这些理论去带领初创团队创业成功。这简直方夜谭。这些人已经是成功人士了，基本上是功成身退的讲话模式，而不是创业初期的创业者应该学习的。所谓战略，是走一步看一步，一步一步干出来的。所以邓伟人讲：“摸着石头过河！”就是这个道理，哪里有什么先见之明？哪里能算到后面几十年的事情？伟人在厉害，他也不是上帝。'
