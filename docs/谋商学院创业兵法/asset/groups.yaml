    沈攸之不听，用自己精兵猛攻，结果很长时间没打下来。跟着造反的士兵一看，第一仗就这么难打，就纷纷逃亡了，沈攸之见大事已去，跑到树林里上吊自杀了。造反就稀里糊涂的失败了，也可以叫创业失败。


