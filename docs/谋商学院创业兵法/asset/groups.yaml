    ## 什么样的团队才能稳定发展


    我们很多人创业成功后，拥有一个小团队，就是发展不起来，不管是企业利润，还是企业规模，都碰到瓶颈，搞不清楚为什么。今天我就来谈一谈这个问题。


    这个世界上最稳定的结构不是上海的金茂大厦，也不是美国的五角大楼，而是埃及的金字塔，到现在已经 4500 年了。如果用少量的炸药炸金茂大厦或者五角大楼的某些局部，那么这些大厦都会倒塌。但如果你用同样的炸药去炸埃及金字塔，你放到任意位置，都不会对金字塔的稳定有任何影响。


    金字塔这种四边形是宇宙中最稳定的结构，它有四个面相互支撑，各司其职。


    我本人做过很长时间的业务员，所以，心里始终认为业务员非常重要，甚至认为公司只要有业务员就行了。能拉来单子就能吃饭，所以我刚做企业的时候，跟着我的全部是业务员，公司也能有盈利，打电话招聘也是业务员去搞，交社保，办理各种证件，也是业务员代劳，认为除了业务员，其他人员都没什么用。可以想象公司的管理混乱，制度建设什么的根本没有。


    后来狠心花了大价钱找来一个懂制度建设的人事经理，经过他的努力，公司的人不迟到，不早退，偶尔还有活动举办，其乐融融，并且发现公司的运营效率比以前高了。


    忽然之间我明白了点什么，就又招聘来一个运营经理，一个策划经理，公司的运作效率与广告效果都有显著提升。


    整体来讲，公司是由两个重要部分组成的，一个是前面打仗的业务员，一个是后面搞后勤的运营啊、策划啊、人事啊、财务啊组成的。必须要大家技能互补，性格互补，公司才能发展壮大，实现高盈利。


    企业也才会越来越稳定。就如同我前面讲的金字塔是由四个面组成的一样，一个团队也至少由四个面组成。


    如果你的团队全部是业务员，就意味着你只有一个面，你这个企业就很不稳定，就别谈发展壮大的问题了。


    所以，我现在做任何一个项目，我都会尽快给这个项目团队配上四个面的人才。需要说明的是，配齐四个面可能需要一两年，因为招聘到合适的人靠我们努力，也靠缘分。有的人不合格也是要换下来的。


    总结一下：团队想要发展壮大，就需要多方面人才的配合，而不是单方面的人才。很多老板只喜欢跟自己一样的人，这是发展的大忌，企业是一个生态系统，尽快让技能互补，性格互补的人相互配合，才能发展壮大。


    ### 为什么你定的方案执行不下去


    很多老板喜欢讲执行力，企业文化，企业利益。不管你讲什么，你的目的员工心里跟明镜似的，就是想让大家多干活少拿钱，只有极度愚蠢的人才能被你洗脑，把你的方案执行好。但这本身就是一个悖论。极度愚蠢的人是不会把事情干好的。他们能干好的事情，也赚不了几个钱。这种老板就叫小聪明，就是聪明反被聪明误。


    真正聪明的人，是不会多干活，少拿钱的，聪明的人要的是真金白银的利益。我们当老板的都是聪明人，我们就是希望低投入，高产出，如果你不是这样的心智模式，你就不是一个正常的商人。


    说白了，我们光制定好一个方案了。这个方案是满足老板本人的利益了。可你有没有考虑过执行人的利益？反正做得好，做不好，都是那么多工资的话，我就保证，你这个企业就要死不活的了。


    一项重要的工作，必定是要执行者与这件事情的成败利益相关，最最重要的工作，当然只有股东层面的人才能做好。这是机制决定了的，不是什么执行力、企业文化、臆念能扭转的。


    次一点重要的工作，比如要公司的总经理去执行，他执行不好，就要下课，这是威胁，执行好了就要奖励，这是利诱。他很在意这些东西，他才能执行好。


    其实就是你必须考虑到执行人的利益。当老板，千万别用架子去压人。别讲些冠冕堂皇的话，真正的大师级的老板，就是句句讲真话，句句关心每个人的利益。绝不浮夸、忽悠别人干活。没有人能被你忽悠，最终你只能忽悠你自己。每个人都是为了自己，没有人会为了公司，包括老板自己，都是为了自己才建立公司的。不敢承认这点的，讲得冠冕堂皇的人，我在公开场合就不多嘴了，免得被道德帝骂，你们自己去想。


    讲打工的吧，很多打工的，在企业里面为老板出谋划策，出了很多好方案，结果事情不仅没办好，还弄得到处树敌，混得越来越惨。为什么？


    就是因为，很多高级知识分子只知道一心为老板考虑，为企业考虑，为了把事情做好考虑。他不知道企业利益与公司的管理人员的利益是不是重合的，企业利益与老板的利益是不是重合的，管理人员的利益与老板的利益是不是重合的。你每出一个方案，其实都是牵一发而动全身。影响到很多人的利益，你这个方案损害了别人的利益，别人就要反对，能执行得好吗？你这方案让有实权的人获益了，讲得再好，估计也难以奏效。执行力就差。必须理清楚企业的利益脉络，才能做好企业。


    所以，做方案，做管理，最重要的是要分清你那几号人的个人利益。谁支持执行，执行什么，对谁有益处，只有把这几点搞清楚了，不管自己当老板，还是在别人的企业做高管，都会如鱼得水。如果你能明白这些，立马在你公司里找一个问题，写个方案，照顾到实权人物的利益，这种方案多出几个，告诉你，你马上就平步青云，就怕你不理解。


    ## 无为而治的根本是分享利益给员工


    美的创始人可说是裸退了，把董事长和 CEO 都交给了职业经理人方洪波，自己拿着大量公司股票及每年的现金分红过着退休生活。方总也把公司带上了新台阶，所有主要业务指标都居于行业领先。谈及其创始人最重要的优点时，方总说：“永远都开心满足得到了自己应得的那一份，绝不眼红其他人得到什么。”


    修养就是财富，见到别人得到更多，心中总是有些不平的人，很难把企业做大，也很难聚集能力强的人跟自己混，其实这样的人得到的反而少了。


    用亚当斯密观点补充一下：奴隶比自由人更贵！奴隶难道不是只要不饿死他就行了吗？是啊。但是，对于奴隶来说，由于没有任何收益，偷懒就成了他唯一的利益，如果你手下全是不拿工资的奴隶，你的成本会达到最高，因为他们会想尽一切办法偷懒。要想降低成本，就要懂得把利益给别人，如此他们就自己去干活了。


    这就要求老板必须把利益分享给团队成员。所以美的的创始人最聪明，他分享了利益。


    很多领导人都在追求无为而治，学了很多管理学，请教了很多高人，也去了 MBA。


    但只要你不分配利益给下属，你的无为而治都无从谈起。


    ## 想当好老大，就要拿自己人开刀


    如果你只知道自己的队员很好，而不能指使他们做事，或者只知道溺爱而不能对他们下命令，大家经常违反你定的规章制度也不能治理，那么你这个队员就成了骑兵，就没法用了。


    我们当老大，可以平易近人，可以礼贤下士，但不可骄纵下属。


    我们很多人，往往对一个人太好，结果是害人害己，为什么呢？


    因为一味的只有恩，只有爱，却没有规矩，它就会习惯，并且骄纵，认为理所当然。如果你哪天因为公司的发展要把关系调整过来，他就要跟你闹。不听你的，这时候，你就只好放弃他，他没了机会，你自己也白培养他了。


    人就是这么贱，一旦习惯了的恩情没有了，就必然成为仇人，你会说，怎么会有仇啊？我又没伤害他，只是停止了恩情而已，是的，对你来说，是只停止了恩情，可对他来说，却是夺走了既有利益。


    所以叫恩怨，恩仇，没有恩，就没有怨，没有恩，就没有仇，曾经你给了他多大的恩，就有多大的怨，就有多大的仇。


    我们古代那些成大事的将军，就深知这个道理。所以，李靖说：“畏我者不畏敌，畏敌者不畏我。”也就是说，怕我的，才会不怕敌人。不怕我的，就怕敌人。所以，当将军，一定要比敌人更加可怕，才能指挥军队，吹了号角，冲锋陷阵的，不一定会死，吹了号角，不冲锋的，马上砍死，这样大家才听话。


    所以，要经常拉一个不听话的人来开刀。


    秦朝末年，陈胜、吴广起义，项梁、项羽也起兵了。天下有野心的年轻人，个个蠢蠢欲动。彭越的一些小弟找到他，说，你带我们起兵吧，他们行，我们也一定行。彭越不同意，说，现在两虎相争，形势如何发展不清楚，我不想参与你们的事。


    年轻人不依不饶，纠集了 100 多人，一定要让彭大哥打天下。彭越被缠的没办法，说，好吧，既然大家要干，就明天日出的时候，开第一次军事会议，既然要成军，就要立军法，迟到的斩首。


    第二天中午，彭越等着，小伙子们稀稀拉拉地来了，迟到了十几个人。彭越说，军法是迟到的斩首，可是迟到的太多了。也不能把你们都杀了，就杀最后一个吧。大家嘻嘻哈哈的说，有这个必要吗？下次知道了。彭越不说话，一个箭步上前，瞬间就杀了最后一个人。众人一看，玩真的啊，吓得都发抖。从此过后，彭越说啥大家就听啥了。最后彭越成为一代豪杰，投靠刘邦后，成为开国功臣。


    再讲讲斯大林在 1937 年到 1938 年的内部清洗，斯大林本人签署了 681692 人的处决命令。有人说，斯大林把能打仗的将领都杀完了。以至于希特勒打进来时，红军没有能指挥的将领。这个说法不对，斯大林并没有输掉第二次世界大战，恰恰相反，他是二战的大赢家。


    内部清洗，在理论上是保持组织强大的手段；因为这能让队员怕我，不怕敌人。所以，一个组织，有必要隔一段时间，就要清洗一回那些不称职的人。


    今天都在讲反腐，有的人讲：“不反腐要亡国，反腐要亡党，”这是不想反腐的人说的，不反腐才会亡党。把贪官都清洗了，党不会没有官用，只会更加强大，更加有生命力。


    总的来说，驾驭组织，驾驭团队的功夫就是恩威并施。这个威，就是要做到让大家怕我，比如带销售团队，必须让业务员怕你，而不是怕客户，如果不怕你，业务员就会不做事，阳奉阴违。出去了也不敢上门拜访客户。这就是为什么很多企业表面一团和气，而业绩很差的原因。因为带着一帮不做事的业务员，狠下心来清洗这些不做事的人，组织与团队的生命力才会越来越强大。


    ### 要打破大锅饭，把资源向优秀的人倾斜


    公司要在待遇与报酬上坚定不移的向优秀的员工倾斜，优秀的人活着的目的就是比普通人强。如果不管怎么努力，大家待遇都一样，那么优秀的人就不会行动了；企业就要平庸，平庸就要倒闭。


    世界上如果没有电位差就没有电力，没有水位差就没有水力，没有温差就没有风，地球就不会有生命。企业里的人都是平等的，就意味着企业死亡。正是因为企业对优秀的员工与普通员工有差异，才启发优秀的员工努力去攀登。优秀的员工努力的攀登，企业就有了自动发展的能力。


    公司本来就应该不停的剥离那些不优秀的懒汉，把位置，机会，钱都倾斜给那些优秀的冲锋陷阵的人。分几个等级发放年终奖，最差的没有奖金，中间的给少量奖金，对于优秀的员工给大量奖金。要打破每个人的奖金都一样的做法，以能力定奖金，而不是以岗位定奖金。


    公司的奖金平衡的后果就是聪明人都跑了，聪明人最讨厌跟草包拿的一样多，优秀的人最怕你说他跟平庸的人是一样的，他会认为你在侮辱他。老板必须让公司里干得好的人明显钱多起来，大家都会努力干了。优秀的人就觉得不用跑了。如此，优秀的人也增加了，企业就发展了。


    用感情感觉来分配利益的老板是幼稚的老板。慈不掌兵，情不立事，义不理财，善不为官！


    ## 员工管理有四个层次


    第一个层次：打骂式管理，最初级的管理者，员工犯错了，就骂，就打，当然现在社会，打的情况很少了，但是还是存在。如果是这种管理者，那么他的工作是做不了多好的，还采取这种管理手段的管理者要注意了。员工在这种管理者手下，是非常难过的。能在这种管理者手下工作的人，要么是自己水平实在太差，没办法跑；要么就是在等机会，只要找到个其他工作，立马就跑路了，这样的企业有倒闭的危险。


    第二个层次：金钱式管理，用奖惩制度来管理员工的，这样的管理者，只能算是入门的管理者，如今，大多数中小企业还在采用这种入门级的手段，这种管理，员工对企业没有向心力，就是为了挣个饭、钱而已，就是各人自扫门前雪的心态，把自己的事情做好了，就算了。这样的企业在顺境当中尚可生存，一旦遇到逆境，很难度过。


    第三个层次：愿景式管理，要想成为一个大老板，必须是愿景式管理。愿景管理，也可以称作画饼管理，厉害的管理者必然都是画饼高手，历史上的曹操“望梅止渴”，就是画饼式管理。让人对未来充满希望。伟大领袖的“星星之火可以燎原”也属于愿景式管理。愿景管理，就是给人以未来的管理方式。Facebook
    初创期的期权，股票，属于愿景管理，马云经常鼓励创业者要有希望，明天是美好的，属于愿景管理。柳传志也是典型的愿景管理高手。会利用愿景来管理员工的人，基本上不会差太远，愿景能调动人的激情，能激发人的想象力，能让人有使不完劲，这都是一个赚大钱企业的员工必备的素质，建议各位老板好好琢磨下愿景管理。愿景管理，能让你的企业在逆境中生存，度过困难期。


    第四个层次：宗教式管理，这是信仰层面的管理，文化层面上的管理。当然也是最高境界。可琢磨孔夫子怎么带领 3000 弟子，周游列国 14 年，身边都有好几十人一直跟着孔圣人风餐露宿，当然也有杀鸡宰羊的时候。如佛主不管走哪里
    1200 比丘都是一直跟着佛主的，这就是文化级别的管理者，信仰级别的管理者才能达到的水平。但凡国家的建立，基本上都是入门级别的宗教式管理，如普京是东正教的，我们伟大的共产党人都是信仰共产党的，可以去查下百科，看看信仰那一栏。但凡历史上搞了点动作的革命人物，无不是宗教管理、文化管理、信仰管理层面的人。如“拜上帝教”的洪秀全，“苍天已死，黄天当立”的张角，“替天行道”的宋江，“驱逐鞑虏，恢复中华，陈纲立即，救济斯民”的复古主义者朱元璋，等等。如果想做名垂千古的企业，那么可以琢磨下信仰层面上的管理。他是在人的心中植入使命感，大家好体会下使命感的植入。


    # 第九章


    # 如何做好产品销售


    # 我的 27 条做营销的心得


    - 顾客是最好的老师，时时刻刻研究顾客。同行是最好的榜样，谁赚到钱了，你就抄袭他，他怎么做营销，你就怎么做，他怎么做广告，你就怎么做，能弄到钱就行。市场是最好的学堂，关注市场，少听学院派纸上谈兵。

    - 信赖感大于实力。销售的 97% 都在建立信赖感，3% 在成交，我卖出去很多不是行业第一的产品，而价格却能卖的奇高，有时候连我自己都不相信这是真的，但因为与客户建立了信任感，客户就买单了。很技术派，学院派的人认为产品好才是硬道理，我认为，多于客户接触才是硬道理。就如同你吃你妈做的饭很放心，而你吃那个五星级大饭店里大厨烧的饭菜，总是会怀疑素菜是不是打了农药，肉类是不是有很多激素，卫生吗？这些问题。所以，顾客买单信赖感第一。

    - 当你学会了销售和收钱，你不想成功都难，刚开始创业的老板第一要学会的就是销售与收钱，马云最开始都是亲自一家一家的去敲企业的门做销售的；拒绝做销售的人，很难做好老板。

    - 拒绝是成交的开始。被 99% 的顾客拒绝都很正常，100 家里面有 1 家买你的产品，你就富可敌国了，很多人被拒绝 10 次就受不了了，这也太幼稚了。销售就是零存整取的游戏，顾客每一次的拒绝都是在为你存钱，并不是说，顾客拒绝你，你的工作等于零，而是你放弃了，就等于零。

    - 要从赢得客户信任、改变客户观、用故事洗客户的脑、讲利益、讲他不买会有什么损失等负面，对客户进行一个十面埋伏的营销体系。创造让客户不可思议、不可抗拒的营销方案。

    - 销售是把你产品信奉传递给客户的一个过程，所以，你自己必须得相信你的产品或服务值钱，用情绪去感染客户，锻炼好身体，持续不断的说服顾客；谈判是决心的较量，你必须相信他就是会买；成交是意志力的体现。

    - 仅仅是把货物卖出去不算完成销售，必须把钱收回来才算销售完成。

    - 一定要给客户讲有含金量的东西，一定要学会创造价值，为顾客创造他需要的价值。客户认为了，自然就买单了。

    - 所有的一切事物，都要学会去链接。感情的关系大于利益关系和合作关系，要与顾客有深层次的情感交流。把一切美好事物都链接到你的产品与服务上去。

    - 顾客买的不仅是产品本身，更买产品相应的及额外的服务，多宣传宣传你会提供什么额外服务。

    - 不要得罪人，只管赚钱。做销售不要与客户发生矛盾，就算你碰到很不礼貌的顾客也不要与其发生矛盾。

    - 你永远没有第二次机会给顾客建立自己的第一印象。所以，随时随地保持好自己的好形象。顾客不会在一个看起来就很讨厌的人那里买单的。

    - 销售等于收入。这个世界上所有的成功都是销售的成功。当你学会了销售和收钱的本领时，你想穷都穷不了。

    - 做业绩千万不要小看每个月的最后几天，这好比是 3000 米长跑，当你跑完 2700 米时，最后的 300 米犹为重要，最后几天是最容易创造奇迹的时刻。

    - 没有卖不出的产品，只有卖不出产品的人；不是市场不景气，只是脑袋缺思路，多学同行，多跟赚到钱的企业学习，你自然前途就光明。

    - 一流推销员卖自己；二流推销员卖服务；三流推销员卖产品；四流推销员卖价格。

    - 销售时传递给顾客的第一印象：我就是你的朋友，我今天与你见面就是和你交朋友的，所有顶尖高手都是会把客户当家人的人。

    - 随时随地都在销售，把销售变成一种习惯。成长永远比成功重要，你可以不在销售中成交，但你不可以在销售中不成长，每一个优秀的销售都是随时随地的学习者。

    - 选对池塘才能钓大鱼，顾客的品质一定要好。你的选择大于努十倍。如果你为穷人服务，你将变得越来越穷；你可以把自己定位为珠宝店老板，也可以把自己定位为收破铜烂铁的小贩；你服务十个买破铜烂铁的不如服务一个买颗钻石的。

    - 重视细节，大部分人都不重视细节，你重视细节了，就能够 在激烈的竞争中胜利。

    - 销售不是多讲话，而是只讲巧的好处的话，不多一句，

    '
