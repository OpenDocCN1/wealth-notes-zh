    任何一个聪明人都是没办法管理足够多的事情的。现代企业最大的资产，其实就是你那几十个或者几百个员工的脑袋，没有人愿意被执行计划，而如果是他们自己制定的计划，他们执行的愿望就会强烈些，工作也会主动些。


    所以，现代企业的管理思路应该是想尽办法让每一个员工自己动脑去制定一个计划来完成公司的目标。而不是让一个牛逼人物来制定一个整体计划让员工执行。


