    理，就是给人以未来的管理方式。Faceb ook 初创期的期权，股票，属于愿景管理，马云经常鼓励创业者要有希望，明天是美好的，属于愿景管理。柳传志也是典型的愿景管理高手。会利用愿景来管理员工的人，基本上不会差太远，愿景能调动人的激情，能激发人的想象力，
