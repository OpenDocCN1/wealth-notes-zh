    # 弱肉强食是天道


    我们生意人必须深刻的认识到这个观念，才有助于我们赚更多的钱，把企业经营的更好。比如，有些人认为战争是丑恶行为，看到战争死亡的人数就觉得残忍。却不知我们每个人类每天杀的生物，比战争死亡的人数不知道多出多少倍。


    可能有的人说，这些畜生是没有思想的低等生物，死不足惜。那么等到有一天，比我们人类智慧高万倍的外星人来到地球的时候，外星人看到我们就好像我们看到老鼠一样，并决定要将我们变成他们的家畜的时候，我们就可以回想一下我们自己的立场——死不足惜。大自然也会推动一些东西的进化来抗衡人类的迅速繁衍，比如各种不同的新病菌或者不能治疗的疾病，就夺走了许多人的生命。


    吃素的人也别以为自己不杀生，因为你吃的那碗饭与蔬菜，也是要用很多农药杀死很多虫子，你才吃到的。并且你吃了，其他生物就吃不下了，他们就少了一口粮食，就得饿死。


    商人必须深刻的认识到，残忍就是残忍，不会因为我们没有文化就不残忍了，只不过残忍得隐蔽些。大自然的进化和平衡规律就是弱肉强食，竞争的本质就是一物活，一物死。没有共同存在的可能，大家看看这段时间互联网行业的兼并战多么激烈就该明白这个道理。这种残忍的定律也是源于我们的基因，就算刚出生的婴儿'
