    # 第五章 创业合伙人


    ## 创业选择合伙人的一些问题


    如何选择合伙人？为什么我们创业需要选择合伙人？什么样的关系是最适合做合伙人？


    我们可以参考一下很多优秀的大公司，最初创业的时候，如微软的盖茨与艾伦，后来的鲍尔默，苹果的乔布斯与沃兹。这些人都是很早年的朋友甚至是同学。中国的很多大企业都是家族血缘关系！


    为什么是这样的关系？因为创业并不容易，这个过程中会遇到很多挫折与磨难，一般人不具备大的格局，很容易因为小的利益争吵，而血缘关系即使再吵，甚至是打架，过后也多半能原谅。这样凝聚力就不会出问题，容易成功些。不过也有例外，不能原谅的就夫妻反目，兄弟成仇了。


    现代社会，很多人神经敏感脆弱，一点点小事，都能整的大动肝火，如果没有什么相当长的了解，合伙人很容易散伙。


    我曾经有个合伙人，他一分钱不出，也不怎么做事，我又供他吃，又供他睡，他还借我的钱花。可是居然因为一个业务出卖我，自己去赚钱了。说是不是为他着想，他家里逼着要钱呢，我狂晕，就这格局还是创业？事后我总结，合伙人宁愿挑不到，也绝不乱挑，宁缺勿滥。后来，这个家伙
    QQ 发我消息，有回来的意思。在外面混了一圈，发现我对他最好，并且我的事业也有了起色了。还佯装给我建议来指导我，我就回他两个字“谢谢”，就再也不理他了。


    我认为，合伙人性 格，格局最重要。人一定是有大格局才有大事业的。为了几个小钱能出卖兄弟的人很难混好。小肚鸡肠的人也很难混好，平常多注意一个人的细节，细节最能反映一个人的真实内心。


    我们为什么要寻找个合作伙伴呢？因为每个人都是有局限的，非常难得一个人既有领袖能力，也有管理能力，就连皇帝都要整个宰相。


    你可能善于谈业务，但不善于技术，或者善于设计，但不善于实现。所以你要有人来做你不会的那一部分，这就是合伙人的意义。


    比如戴尔公司是两个人干起来的，戴尔与他的伙伴罗林斯。索尼是盛田绍夫与井深大干起来的，很多公司都是两个人干起来的。


    如此厉害的人为什么还要整个搭档？你就不需要？因为这涉及到公司两个最重要的方面，“领导者”和“管理者”。


    领导者与管理者需要的能力是完全相反的。领导者需要一种把任何复杂问题都能极致简化的能力。而管理者恰好是要把任何简单有问题分析得透彻，仔仔细细的人，即是管理者需要把任何简单的问题复杂化。仔细辨别自己的天性是领导者还是管理者，然后发挥自己的特长最重要。


    领导者的作用就是考察市场，看看企业内外各种复杂的情况，国际形势，行业形势，然后从复杂的各种事物中找麵些是我们将来要做的，哪些事情是重点，哪些事情是马上要做的，哪些事情可以放一放。轻重缓急，在领导者这里就变得非常的清晰简单。


    而管理是个实际的工作，管理者实际上做的是鸡毛蒜皮的事情，需要把各种细节运营好，才能让项目正常运转起来。战略这种事，对企业来说非常重要，但是你不可能天天做吧。领导者是总设计师，管理者是建造这个企业的执行人。


    我们看华为，大家都知道任正非与孙亚芳，任正非管理内部事物。孙亚芳管理公关，销售等外部事物，这就是一个能力互补。人必须要有一个合作者，才能成大事，刘备就知道这点，到处找文找到诸葛亮，武找到关张赵。


    我一般喜欢两个人合伙做事。中国人有个毛病，一上三个人，就开始三国演义，明争暗斗，很是不利于做事。


    仔细分析下矛盾，其实一般的矛盾，我们都可以通过双方的相互忍让得到解决，除非是那种原则性的错误，比如出卖公司利益。我建 议两个人合伙的时候，无论遇到什么事情，都及时沟通，千万不要闷在心理，不闹就不闹，一闹就掰掉了。


    ## 我选择创业合伙人的经验


    创业中，合伙人的选择是个非常重要的问题，虽然合伙人非常不好找，但并不意味着是个人就行。这种奠定企业文化基础的事情，还是要慎之又慎。


    其实创业，对人的素质要求是相当高的。


    1. 真诚，坦率的人，如果这个人喜欢惹是生非，喜欢搬弄是非，不管这种人能力有多强，也别让他加入。

    2. 合伙人最好来自于同学, 同事, 尽量是了解的时间相当长的人，大家知根知底的，这就要求创业其实有准备工作的，也许你提前好几年，就在寻觅合适的人了。比如马云，他很多合伙人都来自于他的学生。

    3. 相互之间有包容心，别为了鸡毛蒜皮的事情成天斗争，小肚鸡肠是成不了大事的，走不长久的。

    4. 既然是创业，就不是在一起来吹牛扯淡的。平常除了沟通工作，谈项目，还是沟通工作，谈项目。总之，只做与工作有关的事情。除非不得已联络下感情。我们创业的起步阶段，时间与精力都异常宝贵，容不得浪费。

    5. 亲兄弟，明算账。既然一起创业，就必须共同出资，心往一处想，劲往一处使。杜绝一个人出资，另一个人找任何借口不出资的情况。他不出钱，他就会带着投机心理来创业。看到
    好了，就跟你一起干；稍微感觉没前途，就立马开溜。其实 这还不是危害最大的地方。最可恶的地方是，这种合伙人不出 钱，他就不会上心。会严重影响团队的战斗力，使团队经受不了
    一点困难的考验。


    我在几年前刚创业的时候，由于没有经验，其中有个合伙人，就是不出房租，不出饭钱。看到团队没有收入，居然跑出去找个兼职来 是不而当初我居然能容忍这样脑子混乱的人跟我们在一起。结果是我们
    出房租，饭钱，养了一个给团队增加负担的废物，这废物还很不高兴。


    我们既然选择当老板了。就要把各种简单的道理搞清楚。坚决不能感情用事。否则，市场会毫不留情地教育我们，不管是人际关系还是带团队，都跟打工的时候有本质区别，因为这个时候，你是老板了，角度不一样了，每件事不管好的坏的，你都要承担责任。


    6. 创业合伙人必须是打工的时候就素质高的人，你不能期望一个打工失败者可以直接当老板。创业要求比打工更加任劳任怨，工作强度要求更高，活做得要更加漂亮。只有这样，才能在激烈的竞争中胜出。


    优秀是一种习惯，失败也是一种习惯。优秀的打工者在创业活动中，会保持优秀的习惯。失败的找工作者有可能在创业的过程中睡到自然醒。这种整体素质差的人改变起来非常困难。我们找合伙人是找到与自己素质相当，甚至比自己素质更高的人合作。而不是找到一个低素质的人来教育培训，般你尝试教育培养别人，最后都会成为仇人。


    ## 我是如何说服别人跟我创业的


    首先，我把时间劈成了三段，过去，现在，和未来。


    原则是，增加他过去没创业带来的损失，遗憾，和痛苦。描述未来创业成功的好处。越详细越好，越好举例说明，目的是，让他现在就跟你创业。


    我们要说服一个人。


    首先，我们要明确一个概念就是，讲对说服的对象没有好处的话，他是不会跟你走的。你描述的东西，必须要对他有好处。


    我总结了7招。


    - 第一招：畅想未来。也就是通常说的画饼。如果创业，收入会提高的什么程度，将来会给他带来什么好处，未来会获得什么资源，就是用未来去诱惑他现在采取行动。

    - 第二招：举例论证，谁谁谁，创业成功了拥有了什么什么，这种例子举三，五个非常典型的，特别是你将要拉他入伙的行业中成功的例子，给他看。

    - 第三招：用过去恐吓他，过去没创业，收入非常好低，帮他算账，比如一个月收入是5000块，每个月吃喝用，能剩下1000块吗？干十年才能有10万块，够干啥？买不起车，买不起房子，交不起女朋友。我们创业，开始可能不顺利，但一旦上了轨道了一年就能赚几十万。

    - 第四招：告诉他谁谁谁，年纪比他小四五岁创业成了，你需要找几个这样酬子。年纪比他小四五岁的人因为创业成功了，现在地位有了，事业有了，钱也有了，家庭也很幸福，增加他的焦息感。

    - 第五招：告诉他，因为以前有很多机会，比如淘淘宝啊，很多发财的机会，由于他没打定创业的主意，犹豫了，错过了机会，那以前抓住机会的人都发了财了，举几个例子说明。然后说，现在我经过周密的调查，我们现在干这个创业项目，就是一个好机会。

    - 第六招：了解对方最在意什么，比如对方现在最想找女朋友。你就可以告诉他，没钱是找不到女朋友的，现在女人都拜金，你没有事业，找到的也不是质量好的女朋友。如果你创业成功了，会找到很多层次高的女朋友。这一条是，了解对方需求，把他的需求分析成需要
    创业成功才能很好的解决。这一招具有颠覆性，大家慎用。

    - 第七招：否定他其他的出路，只要他提出任何一个出路，你就给他往死了的分析，最后问他，还有什么出路吗？还有什么其他出路吗？他最后自己都会说，只有创业一条路。这一招其实是非常厉害的，是经常用的招式，不过内功不够用不好，大家自己去掂量。


    大家根据自己的具体情况，把我这七招套到自己身上，去说服别人加入你的队伍吧！


    ## 如何把人凝聚在你身边


    很多创业人刚开始创业的时候，不知道如何才能把人团结在自己的周围，没有凝聚力，下面给出我的操作方案。


    1. 拉高跟你一起创业人的梦想，比如他的梦想就是在上海有车有房，你要把他的梦想变成有一个亿。

    2. 自己的梦想要包含你的伙伴的梦想，也就是说，只要你的梦想实现了，他们的梦想就能实现，这样，他们就愿意跟随你，同时，不断的强化自己的梦想，并让他们都知道，这样，还可以获得更多的人追随。

    3. 不断的强化自己的梦想，伙伴的梦想，如果你停止强化梦想，那么大家的梦想都会消失，梦想消失，创业团队就要解散。

    4. 讲梦想的时候，要讲有梦想有什么好处，比如你赚到100 个亿，可以有社会地位，可以有游艇，豪宅，可以买自己想要的任何书籍，可以让子女去读地球上最好的大学，可以让父母去新西兰生活，每个伙伴都有自己的团队，灵魂得到升华，等等。也就是说，你需要把梦想实现能得到什么好处，描绘得越具体越好，这样，大家就会铁心的
    跟随你。

    5. 把自己扯到跟历史上的牛逼的人，行业里牛逼的人的高度，甚至对团队讲，我们要一起超过这些历史上的牛人，行业里的牛人。这样能增强团队的战斗力。所以，我们经常看到牛逼的大富豪，都喜欢吹一个大牛，动不动就超越马云，干掉腾讯，这是有道理的，并不是别人乱讲。

    6. 你的梦想必须明确，简单，一句话可以描述，善于记忆，比如， 我对团队讲，赚一千个亿只是起步，把这个印象深深的印在团队成员的脑袋里。他们在其他地方，不可能听到如此牛掰的话，他们就只能呆在我们这个团队中了。

    7. 讲了这么多虚的，讲一个实的来支撑上面的精神体系，就是你在创此初期，你必须非常拼，非常刻苦，比如我早上 5 点就起来工作到晚上 10 点甚至 12 点，无节假日，无任何娱乐。这样，团队成员一看，慢慢的他们就真信我说的了。只要信了，你叫他们去做事，他们就会上心了。


    大家可以把我这7条拿去实践一下，一定会有效果的。


    ## 老板如何选择企业核心层


    如何选人，适我们所有当老板最核心的工作之一，企业就是由人组成的，优秀的人多了，企业当然就牛逼，一群傻逼集中在一起，也别指望做出什么好成绩。


    我选人的第一个标准是这个人有状态。积极向上，非常有活力。


    因为，没有那个员工喜欢死气沉沉的领导，也没有那个顾客喜欢死气沉沉的员工。所以，死气沉沉的领导只能带出来死气沉沉的员工，最后整个公司就死气沉沉的，没有活力。所以，选人第一个看人的状态是不是积极向上，非常有活力。


    老板的本领不是盯着事情做，而是调整自己的状态，把控管理层的状态。企业管理层的状态好了，业绩自然就好。


    选人的第二个标准是与这个人聊天，看这个人是喜欢讲理论，还是喜欢讲简单干脆实用的话。能做事的人说话是直接奔着具体操作，执行的方向去的，越是不中用的人，越喜欢谈论理论，半天都落不到实处，为什么他落不到实处呢？就细为他不会，会的人只需要讲两句，大家就知道怎么做了。不会得人才扯出来很多理论，掩饰他的无知。


    选人第三个标准是看这个人是关注企业的优点，还是关注企业的缺点。选关注优点的人，因为一个企业能够发展好，不是因为他天天都在修正自己的缺点，讨论自己的缺点，而是他在不断的优化自己优点，琢磨自己的优势。企业的利润是优势发挥的结果。我这个人为什么能够带团队，能够做项目，赚点小钱，因为我知道我的优势就是读书加改变人的思想，所以，我天天就读书，然后找几个人来改变他们的思想，我甚至连团队管理都不做，因为我脾气暴躁，动不动就对人骂“草泥马”。而且我嘴上脏话连篇，普通人根本受不了我这样，所以，我就培养几个人跟着我挨骂，让这些受的了我的人去做团队管理。我只要管整体企业的方向与团队人员的思想问题。因为这是我的特长，所以我只是把我自己的优势发挥到极致，我做不好的地方，我压根就不去碰。结果，越做越顺手，顺心，利润也还可以。


    选人的误区之一：我问过很多老板，他们都说选人要忠诚，要；有道德素质，要有能力。其实，这都是误区。


    首先讲忠诚，一个人是不可能对你的企业忠诚的。他凭啥要忠诚于你？我们可以扪心自问一下，你会忠诚与谁？人还不都是为了自已，钱多就跟你混，钱少就闪人。


    要有道德？其实很多人压根没搞清楚什么是道德。我以前给一个全国最大的建衬公司打工的时候，我就是经常出去给客户吹，我们的质量是全国第一，真的是第一吗?其实我自己都不清楚到底是第几。我甚至跑业务的时候，偷偷的把竞争对手的宣传册拿出去扔了。只留下我的宣传册。结果，就是我这种不道德的人，业绩最好。当老板的，你们扪心自问，业绩到底是不是靠道德做起来？那么你为什么要求你的核心层是有道德的人？曹操，刘邦的选择人标准是有道德的人吗？喜欢史的人可以去查一查这些成功者的选人方式。


    其实，最有争议的就是有能力的人。我记得马云说过，企业就是带着一帮普通人干成了一件不普通的事。他为什么不说有能力的人？其他，我们每个创业的老板，开始对自己做得那件事情，根本就不具
    其什么能力，但是为什么最后能做出来？不是因为有能力，而是因为做事非常用心，天天都去想，都去琢磨，这个事情慢慢就成了，所以，也不是选有能力的人，而是选上心的人，选用心的人。


    创业者要让自己的伙伴知道为什么


    当老板要习惯性的分享自己的观点，经验，知识给员工，这样，员工就知道老板想什么，方向是什么。现在的人文化水平越来越高了，要让员工知道为什么干，而不仅仅是简单的工作。这样，员工才有主人翁精神，工作效率与质量才能提升。


    创业并非都要做大事，人们需要解决的小事很多，你就选择一件小事来解决。很多时候，我们认为的小事，对人们来说非常重要，是 大事。而且做小事成功几率大很多。


    找到一件值得去做的小事，越小越好，然后坚持到底，很多创业者成功，靠的就是坚持！


    如果你有拖延的毛病，你就把事情全推给员工，规定他们多长时间完成。当然，你自己能改正这些毛病最好。


    很多老板喜欢与自己性格，经验，甚至行为模式相同的员工。这其实是错误的，应该雇佣能力与行为模式都是自己互补的人为企业工作。


    能把企业做大的人，都是活到老，学到老的人，现代社会发展日新月异，学习新知识就更加重要了。多读科杂志，多了解世界的发展方向，对抓住新趋势有好处。


    ### 如何建设公司的干部队伍


    与企业文化不合适，与老板思想背道而驰，牢骚多，这样的干部要下台。


    老板与干部接触，自己别多说话，经常让干部宣誓，比如酒桌上，平时公司的活动场所等等，让干部经常讲，为了公司拼了，愿意为老板效忠，讲得多了，他们自己就相信了。开始的时候，没人讲，你可以找一个托。


    把公司里每个干部的业绩都挂出来，每个干部的贡献都公布出来，一来是表扬做的好的干部，二来是敲打做得不好的干部。


    干部的权力，责任一定是一体化的，有责任必须给权利，有权利必须让他负责任。


    干部应该都是从优秀的一线员工里挑选出来的，拒绝凭自己的喜好弄一些没有真才实学，没有在一线干过的人来当管理者。


    一个企业的管理者，应该是具有自我培训的意识的，一个企业的管理者不求上进，不喜欢学习，那么这个企业就会在激烈的竞争中落伍。


