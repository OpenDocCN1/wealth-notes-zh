    \n等他们销售自己，找工作的时候，就没人帮他介绍好工作，就不容易把自己卖出去，卖不出去，就赚不到钱，就越来越穷。这就是为什么，喜欢骂人的人，都很穷的原因；他们穷，跟他们的脾气，性格，世界观，价值观，都有关系。可怜之人，必有可恨之处，表面上的贫困，背后是有深刻的规律在起作用的。穷人们过于坚持自己的原来的老观念，人的想法观念，都是环境的产物。\n\
    \n你在老板圈子混久了，就觉得老板说的都是对的，你在乞丐圈子混久了，你就觉得要饭的话全是对得。\n\n要成为老板，必须放弃自己原来的价值观，你要固守自己原来的价值观，不愿意把自己的价值观改造成老板的观念，你就会永远原地踏步，止步不前。\n\
    \n如果你原来是工人，你就会当一辈子工人，如果你原来是小职员，就会当一辈子小职员。当一个观念，不能带给你好处的时候，你为什么要坚持这个没有任何好处的观念呢？\n\
    \n真是难以理解，因为是你固有的观念，你就要坚持吗？这是很愚蠢的；道理很简单，你的旧观念，并不是天生的，它只是你所处环境的产物。旧观念不是你爹，旧观念也不是你妈，旧观念只是你的环境导致的你下意识的产物，放弃没什么可惜的。\n\
    \n学了当官的观念，可以当官；学了老板的观念，可以发财；你固守着工人、农民、小职员的旧观念不放，只会导致你做一辈子工人、农民和小职员，让你受一辈子穷，这就是固守旧观念的结果。\n\
    \n本书将为大家介绍真正的致富之道。\n\n## 第一章 社会的本质\n\n### 打工还是创业？\n\n我来给大家仔细分析下，你就知道如何选择了。\n\n\
    往玄了说，生物的本能永远会选择有利于自己的一面。而文化，教育会阉割一个人的志气，从而影响一个人的智商，最终做出错误的决定。其实大部分人心底里的呐喊都是创业，但是会自作聪明的找借口。\n\
    \n我们假设一个大学生22岁大学毕业，工作到60岁，算62岁吧，好计算，那么这个大学生工作了40年，我们再假设这个大学生一毕业就5000块一月，算这个社会物价永远不长。这个大学生每月租房花掉1000块，吃饭花掉1000块，零用花掉200吧，交际花掉300吧，谈女朋友或者为了女人花掉500吧，养小孩花掉1000一个月吧。这家伙，是根本不能买车，买房的，这家伙每个月能余下1000块。假设这个家伙退休后活到82岁，那么他自己每个月生活费加房租加零用就得从他那40年里积累的财富中间拿。他每月有2000块结余的样子，他最不要生病。他也最好一生都没有失业，没有任何风险，没有任何病痛。他也买不起任何贵重的东西，当然也不能到处旅游？我虽然粗略的算了下，但是大概，这就是大部分人一辈子的真实生活状态。\n\
    \n创业是怎么回事呢？没有人天生会创业，就如同没有人天生会打工一样，都是教育的结果。或者说后天摸索学习的结果。其实打工的技能对创业没啥大的帮助，打工大概用到的都是技能，而创业用的得最多还是资源整合能力，倒卖能力。有了团队玩的是管理能力，领导力，商业敏感度。\n\
    \n我认识一个目不识丁的木工，这家伙其实是个什么也不会的人，到上海混，租了个房子，到处骑着三轮车收旧家具，一张二手电脑桌子 50 块收过来，120 卖掉，一张老板桌，180\
    \ 块买过来，400 块卖掉，每天都能做成好几单，老家有个亲戚，16 岁的小男孩，跟着他干活，每月给别人开 1800，美其名曰“带学徒”。这个学徒当然还感恩戴德的感谢他给了一份工作。\n\
    \n这种低级的生意一抓一大把，社会上到处都是。卖菜的，卖水果的，卖干果的，卖海鲜的。这种创业对大学生来说，简直就是毫无难度。一做就做成了，利润呢？做得差得都能赚到\
    \ 10 万，稍微过得去的 20 万。\n\n但是大学生看不起，我这个人也看不起这种生意，所以我就专研了网赚暴利项目。我们那里有个理发店，两夫妻开的，那个家伙现在收费是\
    \ 20 块一个头，一天从中午要忙到晚上，大概每天能理发 20 个男头左右，如果有女式做头，他又多赚些，每一月至少也收入上万这就是很不入流的生意的收入，你一个打工的，还敢小看这些小生意吗？\n\
    \n当然，我是看不起这些小生意的，我只是举些例子让打工的白领知道自己有多愚昧罢了。\n\n为什么要这么看重钱，答案非常简单，因为有了这些钱，我才能去旅游，才能去买房子，买车子，才能保证我\
    \ 60 到 120 岁还有得活头，我敢活到 120 岁，是因为我准备好了足够的物质条件。而赚不到钱，是活不到 120 岁的，因为物质条件不允许你的生命能这么坚强。\n\
    \n年纪大了随便进个医院，没几大千是出不来的。随便买点营养品，没几大百也是不行的。我都不说你以为自己的父母奉献点什么了，为自己的儿女奉献点什么了，我们只为自己算算这些帐吧，看你还敢打工吗？\n\
    \n其实在这个社会上，赚钱只是一种理念。你如果想赚钱，就选择创业，哪怕是 100 块钱，也可以起家，这主要是一种理念。100 块，可以到街上去捡破烂卖。\n\
    \n### 饿死宁做创业狼，坚决不做打工狗\n\n我们 30 年前开始，中国最胆大的就是四川人，浙江人。最早出去闯荡江湖的就是这两个地方的人。不过，四川的人出去就在沿海城市进厂打工，浙江人，特别是温州人，到处摆地摊，到处补锅，补鞋。\n\
    \n虽然都是农民，都很勤奋，但是理念不一样。一个是创业，一个是打工。如今浙江人依然成为中国最会经营的人，大富大贵的很多。而四川人，年纪大了回老家继续贫穷，更加可悲的是他们的子女依然喜欢打工。而浙江人的子女生意开始拓展到了国外，犹如一个轮回。\n\
    \n创业没那么可怕，创业仅仅是一项经营技能而已。为什么很多人都怕选择呢？其实在中国这个社会，没有什么保障体系，特别是对穷人。打工永远难以做到财富自由，一个人的财富不自由，人格就很难独立。不能够做到为自己的老婆孩子提供一个良好的生活环\n"
