    # 长期努力是成功的唯一方法


    我认为，长期努力是成功的唯一原因，很多人听我这样讲，就认为很极端，不科学。我想说的是，我谈的都是我的经验而已，我从来不想证明我科学，我甚至讨厌那些看起来，听起来很严密的理论。在我们公司里，只要谁说：“什么事情都有两面性，一件事情总是有好有坏。”我总是想辱骂他，我会让他离开，甚至开除这样的人。我最讨厌这些正确的废话，完全没'
  - '[PAGE 289]


    有立场，简直就是孔夫子讲的乡愿。


    我们当老板的，不是理论家，我们是在打仗，我们只能选择一个 判断，然后执行下去。你不能告诉我这也行，那也行，我们的选择是唯一的。


    所以，我这个人讲话就是很极端。在读高中的时候，我就发现了一个现象，成绩好的孩子总是一直在读书，做作业，从来感觉不到烦，就算周六，周日也在学习，成绩差的学生在网吧，球场，或者看小。有的孩子只能努力一个月，然后就坚持不下去了，这样的人就是成绩波动比较大的人。


    读书毕业后，我经历过很多工作，特别是在两个公司做过销售员，我们的销售员有几百人之多。


    哪些销售员的业绩最好呢？毫无疑问，我的结论是：最努力的那个人。最努力的那个销售员，他在办公室就是从早到晚打电话，他出了办公室就是一直在拜访客户。他真在做事，一年下来，他自然是业绩最好的，我离开那个公司的时候一年后，再回到那个公司去看他，他已经升级为经理了，而同期不努力的人要么离开了，要么还是个跑腿的。


    我从来不相信天赋，我认为任何人的智力基本一样，甚至你如果疯狂的能力工作，实际上你的智力会因为你的能力而改变，其实不是智力改变了，而是熟能生巧。我以前讲过一期节目叫卖油翁，说的就是熟能生巧。


    所以我只相信努力，我要成为最努力的那个人，什么叫努力呢？


    就是坚持对长远目标的激情，对手上的工作日复一日的干，'
