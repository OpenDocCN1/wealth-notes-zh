  - '[PAGE 163]


    严格来说，只做自己能搞定的事并不是保守，是因为很多人尤其是初次创业者，都容易过高估计自己或团队的资源和能力，低估项目和市场的复杂性，寄希望于不遇到问题，不发生意外，寄希望于对手不回应，不反击……这怎么可能呢？成功的唯一可能是运气实在太好，好比横渡太平洋没遇到任何风浪；而保守一点，正好留出处理各种不可控因素的余力来。


    如果这个余力足够大，你可以迅速提高自己的目标，但是如果一开始就把自己的目标定得很高，往往耗尽自己的资源、现金，最可怕的把自己与团队累的筋疲力尽，信心也搞没了，成功就基本不可能了。


    我做企业有一个重点，就是不断招聘人才。我招聘人才并不是用他们来完成高难度的项目，而是做非常非常简单的事情，高手做解的事情，并不是屈才与浪费。高手做简单的事情，会把简单的事情做到更加的极致，直接对这个行业的其他竞争对手形成屠杀级的优势。


    就如同我以前玩《魔兽世界》一样，我喜欢杀人。我才不去杀大号呢，就算我技术好，也要经常被虐。我是组织一伙人，一起去小号练级的地方屠杀小号。这样既安全又快乐。很多人对我这种行为不耻，无所谓了，我要的是胜利，而你要的是让我去送死，其实《孙子兵法》讲过这个哲理，伟人毛也讲过只打有把握的战争，这就是创业者应该吸收的思想.


    # 创业企业采用人治还是法治好


    刚开始创业的时候，肯定是人治，但是随着业务的繁忙，如果企业忙不过来了，就要招兵买马，人多了，你一个人管不'
  - '[PAGE 164]


    过来，就要委 任管理者，而要使管理者的工作有法可依，不 至于按他们自己想胡 来，不至于大家心不朝一处想，力不往 一处使，自然就要开始订立目标与规章制度，自然就过渡到“法
    治”了。


    水到自然集成，企业的成长和生物的成长一样，是个过程。


    只要


    有利润，创业初期先不要考虑人治还是法治的问题。法治 是规模发展


    起来了可以采用的手段。如果初级阶段“硬要”去决定人 治还是法治，可能都会适得其反。


    从企业发展的角度，你需要招人；从法治的角度，你仍然 需要招人。


    因为你要分工的话，就得权责分明，权力和责任是同时放下 去的。比如你叫我负责办公室的卫生，表面只是责任，其实权 力也一块放下去了。我有什么权力？打扫办公室的权力。这意
    味着任何人插手我的工作的话，最后你都无法追究我的责任。 所以当你把权责放下去之后，就意味着在那一块，你只剩下最 牛X 最无奈的“撤换负责人”的权力，而不能轻易插手别人的
    工作。牛X 在哪里？生杀大权嘛！无奈在哪里如果你没有后备 人才，你敢撤换他吗？不撤，他做不好本职工作，影 响大局。 撤了，你得自己去顶上，顶张三顶李四……最后累成狗。


    所以说，发展到分工合作阶段，就要求你必须要有替补，而 且替补的存在会让在位者有种无形的压力。也就是，内部竞争 机制是有替补建立起来的。'
  - '[PAGE 165]


    无论从哪个角度讲，当你有闲钱多养几个人的时候，你才能建立


    法治。然后，即便这样，也不是人治法治的分割点。规则化制度化是结果，既非目的，更不是必然手段。反正兵来将挡，遇到问题解决问题，企业发展到自己实在没有精力去管的时候，就只能借助一些“规章制度”，这样一天一天过去，有天你回头一看：咦！自己的企业变得像台机器一样，员工们按照规章制度和惯例工作，做得好得到奖励，


    做不好受到处罚，你不去管他们细常工作，这就法治上了。


    所以，创业初期是人治，随着企业发展到分工合作阶段，人数增加到你一个人管理不过来的时候，发展到法治是水到渠成的事情。不可生搬硬套的决定人治还是法治，也没有法治比人治好的说法，而是
    不同阶段，用不同的手段。


    # 皇帝的管理哲学


    许攸献计，助曹操打败袁绍。曹操统率众将入冀州，许攸纵马近前，高叫：“阿瞒，如果不是我’ 你能够入这个城门吗？ ”有操听罢大笑。


    许攸又指诸将说：“你们没有我，能这样出入此城门吗？ ”诸将忿忿不平。许褚斥道： “我们千生万死，身冒血战，才夺取胜利，你怎么胆敢这样夸口呢！” 许攸说：“你们不过是匹夫之勇，没有什么了不起。”
    许褚大怒，拔剑把许攸杀死了。


    曹操为此深责许褚，不过马上就提拔为征南将军，进牟乡侯，宠 遇优渥，邑七百户，赐子孙二人为关内侯。'
  - '[PAGE 166]


    这就是曹操混社会的哲学，只要是忠诚于我的，我就不会亏待你。曹操的孙子曹髦“才同陈思，武类太祖。”不甘当傀儡皇帝，说：“司马昭之心，路人皆知也，我要去讨伐他。”率领宫女僮仆数百人，敲
    起战鼓，出云龙门而去。


    小皇帝身披新甲，坐在车驾之上，手持宝剑，大呼杀贼，激励士 气。司马昭的亲信贾充率军迎战，列阵于司马昭府前。


    曹髦赤膊上阵，高喊：“我是天子，谁敢拦我！”士兵们慑于皇威，无人敢挡。贾充急了，说：“皮之不存，毛将焉附。司马若败，我等必死！”校尉成济是个头脑简单的家伙，听了说：“没错！”，
    拍马上前，挺手中长矛从曹髦胸中进去，于背部出来。


    小皇帝血溅长街，当场身亡，年仅二十岁。这个皇帝真幼稚，丝


    毫没有谋略！没谋略的人在高位，迟早也是死，大家可以参考康熙是怎么干死鳌拜的。


    司马昭听到消息后大惊失色，跑过去，抱着曹髦的尸体放声大哭一场，明白人都知道是作戏，然后召集百官，商量对策。有个大臣说：“斩贾充，以谢天下。”司马昭不语，沉吟再三，不得已杀成济以抵罪。贾充此后一路升官，累迁车骑将军、散骑常侍、行太子太保、录尚书事，假黄钺拜大都督，封鲁郡公，增邑八千户。


    司马昭的哲学就是谁帮我，我肯定保他荣华富贵。所以贾充荣华富贵，我想建议杀贾充哪个家伙会很惨。


    一个管理者永远要搞清楚的是，谁是真正在帮你，不要让'
  - '[PAGE 167]


    真正帮你的人寒心。


    # ## 看起来越傻的人越有出路，大智若愚


    越真诚，越赚钱，因为大家都愿意跟真诚的人玩。初看起来，真 诚的人是很傻的，时间长了，你就会觉得真诚的人很聪明。


    那些看起来越狡猾，越聪明的人，越没什么出路，大家表面夸你， 实际上都不想跟你共事。


    你太聪明了，想要干活少干，分钱要多分，就没人愿意与你合作， 你只有去当孤家寡人。凡是当老大的，普通人看起来就是有点傻的。 宋江叫及雨，别人需要女人他就送女人，别人需要钱他就送钱，他把自己的都送出去了，所以别人都叫他大哥。


    刘备宁愿不逃命，也要老百姓跟着，所以大家都觉得刘皇叔仁义。吕布聪明吧，谁牛逼叫谁爹，谁给粮吃，谁就是娘，最后被曹操抓住，


    本来曹操爱其武勇，想接纳他的，结果想想吕布以前的行为，还是算了。


    什么样的人才能成功呢？很多人都关心这个问题。人活着总是有欲望的，欲望越少的人越牛逼，无欲则刚，通常，成功的老板，他的爱好是极其专一的，甚至，他只爱他的生意。


    而贫穷人，爱电视剧，爱麻将，爱喝酒，爱游戏，爱逛街。人的 各种缺点都是建立在欲望基础上，比如爱睡懒觉。要想有成绩，你必须只爱上一件有益的事。其他的，你就别爱了，因'
  - '[PAGE 168]


