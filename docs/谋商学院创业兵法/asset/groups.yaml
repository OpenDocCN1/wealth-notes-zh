    # 创业，从任何一个点切入，都能富甲天下


    从任何一个点切入去创业，<mark>把一个事情做细，做深，自然就会发现很多新机会，新的赢利点，甚至你能做到别人的地盘上去颠覆别人。</mark>


    比如滴滴打车，从出租车市场入手，做得深，占据了很大的市场后。直接推出代驾服务。代驾服务是利润非常高的一块市场，由于滴滴打车的用户基数很大，而 E 代驾的人口基数很少。当滴滴打车推出了代驾服务过后，基本把
    E 代驾的市场给干没了。


    把一件事做透彻，任何一个项目，任何一个企业，都能做成几千亿市值的巨无霸。乔布斯从 MP3 入手，把音乐市场给统治了，干掉了很多唱片公司。跟着做出了在线音乐平台，干掉了全球的音乐公司。又在
    MP3 上加上了个屏幕做成了 iPad，继续加个电话卡，做成了手机，干掉了诺基亚，把三星也给干残废了。其实，在我看来，乔布斯仅仅是把 MP3 做透彻了。


    360 的周鸿祎，开始做了个 360 清理软件，把清理软件又做成了安全卫士，继而成在线杀毒，通过免费，直接干掉了所有杀'
  - '[PAGE 53]


    毒软件。然后占据了很大的市场，顺手推出 360 安全浏览器。在我看来，360 就是做透彻了一个清理软件。只要创业者愿意把一件事做透彻，那么机会多得很，成为巨无霸级别的企业易如反掌。


    如果把一件事做到一半呢？虽然很努力，可能等待你的是激烈的竞争，然后就是失败。我把创业商学院的创业两个字做透彻，会什么呢？想象空间非常大哦。我大概会孵化很多企业出来，会投资部分我觉得好的企业。我也会接触到很多创业者，投资人。只要做透，随随便便搞个几千亿的企业出来也不在话下。


    每一个创业者，都不应该说自己没什么机会，自己找不到方向，因为，你只需要选择一件事，把这件事做透彻，在这个过程中，你自然会非常多的机会，让你大赚特赚，让你功成名就。


    # ## 十一点做老板的心法


    1. 做互联网生意，自己就是上游是顶点，做传统生意，你很容易在别人的下游。有货款，欠账，烂账，上游企业一倒闭，就砸死一群下游企业。所以，现阶段有智慧的老板都来玩互联网吧。


    2. 找人合作，先搞清楚这个人的状态是正在走上坡路吗？如果是上坡路，跟他合作就很容易成功。如果是走下坡路或者维持现状呢？大势已去的人，不跟他玩。


    3. 员工所关心的问题不是公司的问题而是自己的问题，所以管理员工，就是给他定具体目标。别扯你希望什么什么的，因为不管你怎么说，他都不关心，他只关心自己的利益。


    4. 公司能培养多少心放在公司的人，公司就有多稳定，公司的稳定不是靠技术强悍，不是靠有能力的人支撑的，而是靠心在公司'
  - '[PAGE 54]


    的人支撑的。


    5. 项目经理是用自己的智慧解决问题，老板是用所有员工的智慧解决问题，不会利用员工脑袋的老板仅仅愚-一个项目经理而已，有将合自己的情况思考下。整理下，你就能清楚的认识你自己的现实情况了。


    对于我们每个创业人来说。我们的核心资源就是自己，包括自己的兴趣，技能，个性。以及你所掌握的资源，比如你银行里的存款，你的房子。如果你有团队，那么也可以算是你的资源。


    我们通过九个步骤搞清楚自己怎么可以创业成功，并且赚到钱。


    第一：问自己，可以与谁合作。


    首先是团队成员，其次是家人，明友，同学，公司同事，还有客户。


    第二：问自己，可以发展什么样的关键业务，自己要做什么？


    比如是要做互联网营销呢？是做产品代理呢？还是自己去炒菜，卖菜.还是开个广告设计公司？这完全取决于你会什么，你的兴趣点在什么地方，还有你的志向是什么！


    第三：自己的核心资源是什么？你干过什么？拥有什么？比如你做了5年网站程序员，你会编程，会做网站，这是你的优势。比如你家里有钱，你老子给了你50万，这也是你的资源。比如你在学校里泡妞无数，一毕业有无数个如愿意跟你浪荡天涯，你可以教人泡妞。


    第四：价值服务。


    你到底要提供一个什么价值去帮助你的客户。这取决于你的核'
  - '[PAGE 55]


    心资源和**你干过什么，会什么**。


    第五：**与**客户的关系。


    你打算怎么和客户沟通，交流。以什么形式沟通交流！是一对一呢？还是会议营销-对多？等等。


    第六：怎么宣传**自己，怎么**把服务提供给用户。


    比如，你通过快递把包裹送上门，还是开个店等用户主动来找你？


    通过百度推广，QQ 群推广，或者报纸做广告宣传**自己，还是**自己请几个人做地面推广？


    第七：**你的**用户群体定位。


    你到底为老年人服务，还是为大学生服务，为家庭妇女服务，还


    是为写字楼里的白领服务。


    第八：**你想要做的**事情。


    你要付出什么？你的成本包括什么？成本多高以内你能接受？超过了多少你有没有把握能融到资金？


    第九：收入。


    做完这一切，你能得到什么？你的收入是多少？划算不划算？如


    果最后算到收入这个**步，不划算，那么前面 8 个步骤都没意义！**


    大家根据我这 9 条，一条一条的去套**自己，就能把自己给分析的**'
  - '[PAGE 56]


    一清二楚，创业方向与要做得事情就能分析的非常明白。


    # 互联网创业，想法一定要大，做法一定要小


    没有想法的人，很难有成就，目前，中国 pc 互联网加移动互联网人口达到 8.5 亿人。任何一个细小的分支都蕴藏着巨大的商机。一个滴滴打车，两年前从 80 万起家，做到现在手上有
    150 亿现金。说简单点，就是把一个打车软件给做到极致了。而在中国，这样的机会在未来 10 年会在各个领域出现很多。


    我们选好一个行业的细分领域，就要想，我要把这个点吃透彻，做到全国去，做到几百亿去。有了这个理想过后，我们从一个小细节入手，把这个细节做到极致，做到全国。要在一个关键问题上赚到钱再去想扩张的事。千万不要一上去，就做很多功能，很多服务。战线拉长，人的精力就跟不上，就很难做起来。


    我们要选好一个具体的点，尽到最大的努力，把这个点做到极致。据了全国市场过后，再去想扩张的事情，比如，滴滴打车占据了整个出租车市场过后，就扩张到了代驾业务。吃掉了代驾市场这块肥肉。当滴滴把代驾这块肥肉吃掉过后，他能不能继续吃掉驾校这块市场、能不能吃掉二手车市场？都围绕着车这个市场来吃，吃得有深又宽，我觉得，一个千亿级别的企业会轻轻松松的诞生出来。


    互联网行业，真的是机会非常多。而且目前是异常容易把一个屌丝变成一个富豪的行业。想在这个行业发展事业的人，要多跟这个行业的人接触，进入这个行业的圈子去讨论，探索，学习。你现在与什么样的人讨论，探索，学习，决定着你三五年后从事的事业。想要快速成就事业，完全靠自己探索，基本是不可能的，要学会去'
  - '[PAGE 57]


    借鉴行业里优秀人的思维，做法。然后去实践，变成自己的思维，做法。


    # 冷门生意赚大钱


    首先讲一个理念，一个人赚钱没有什么了不起，要让大家都能赚钱。让跟着你的人都能赚钱，甚至，让你的客户也能在跟你的合作中赚钱，这样，许多人就会跟你精诚合作，你就可以控制整个市场。赚到更多的钱。最笨的人就是只知道自己赚钱，而不顾别人。最后自己只有倒闭。


    一般人做生意，只是精于算计，做法犹如打麻将，看住上家，扣住下家，防住对家，结果我做不成，你也做不成，大家都没钱赚。


    犹太商人和温州商人的做法犹如下围棋，你占这个点，我就占那个点，你卖汽车，我就开旅馆，大家在竞争合作，在合作中竞争，其结果是联手造势，一起把蛋糕做大。


    我经常在核心骨干就是宣传的，大家要精诚合作，一起把蛋糕做大。


    我们当老板的，招聘新人进公司，在试用期就要特别注意，这个人是精于算计的还是愿意跟大家精诚合作的。


    一个优秀的创业者，永远是目标明确，高度专注，不断为用户释放价值，力图成为用户卓越的伙伴。'
  - '[PAGE 58]


    创业者要知道：风险越大，赚钱的机会就越大。到别人认为是冷门的 地方，你会赚到数不清的钱。


    比如有个网站叫一心理网站，做心理学的，最近融资了几千万美金；心理学从来都不是热门，但被他们做成了。一个叫好想 你品牌的红枣，居然市值做到了 23.06 亿。


    一个教人泡妞网站，每年居然有 5000 万的收入。


    这都是大家不太注意的偏门生意，很赚钱。当然，如果你细心去找，你会发现更多的冷门赚大钱的生意，我就经常去找这些冷 门生意来做。


    # 企业打造核心竞争力的 6 个方向


    用户到底为什么选择你这个企业提供的产品或者服务，是我们每个企业都要思考的问题。


    换句话说，也是我们企业靠什么核心竞争力赢得用户，我大 概归纳了 6 个点，供大家参考。


    +   1. 便利性。就是你这个产品或者服务帮助用户节约了时间，减少了麻烦，你就可以赢得用户，比如余额宝为什么成了最大的基金，是因为用户把钱转到余额宝太方便了，淘宝最近出了一个花呗，肯定有会抢占非常大的信用卡市场，因为这又是具备非常大便利性西。你能为用户提供便利，是我们打造核心竞争力的第一个方向。


    +   2. 价格，省钱，也是吸引用户非常重要的一个原因。你能做出一个比市场上的产品更加便宜的产品，你就能胜利。比如 360 做了个免费杀毒，就把金山毒霸，瑞星杀毒的收费市场干掉了。微信的语音干掉了部分电话业务，干掉了部分短信业务。你能卖得便宜，是打造核心竞争力的第二个方向。'
  - '[PAGE 59]


    3. 设计，随着人们生活水平的提高，有品位的产品或服务会越 来越有市场，尽管价格比普通商品高很多，还是有用户为设计好的 产品买单，比如，很多人会为苹果手机买单，就是因为苹果手机设
    计得好，不但有装逼感，而且播放音乐比很多普通的音箱都好。很 多设计好的家具也很有市场。打造核心竞争力的第三个方向，修炼自 己的设计能力。


    4. 品牌或者市场地位。这是什么东西呢？就是让用户感觉到不 同，有身份，有地位，很多奢侈品就是走得这个路线。比如，有的 人不惜重金买几百万的法拉利跑车，手表。或者买有特殊意义的东
    西，比如脑白金，这个产品卖的是孝敬爸妈脑白金，卖的是品牌与 孝敬文化。突出自己的市场定位与品牌，是打造核心竞争力的第四 个方向。


    5. 帮助企业或者个人进行成本削减。就是你能提供一个产品或 者服务，让企业或个人以前的运营成本减小，你也会有市场。比如 自动化机械化替代工人。信息化，无纸化办公，让企业节约了办公
    成本，


    帮助企业或者个人进行成本削减，是打造自己核心竞争力的第 五个方向。


    6. 帮助企业或者个人降低风险，这种服务一般出现在保险业，调 查取证行业，咨询，顾问行业等。是打造自己核心竞争力的第六个 方向。


    这其实也是创业的六个方向。


    不管是创业还是做企业都需要根据自己的特长与资源来打造相 对应的核心竞争力，你有那个优势就用那个优势。'
  - '[PAGE 60]


    # 物质丰富的互联网时代赚钱的方向


    首先讲一个观念，创业者永远不要让工作成为自己的负担，如果感觉到工作成了自己的负担，那么别干了，创业者，一定要让自己的心自由，才能够抗住压力，挖掘出自己的潜力。如果工作已经成为了自己的负担，那么你就很难做好这份工作。


    其实，延伸下来，就是一个精神问题，创业者要关注团队里的人的精神，而不是项目本身，精神状态好，做什么项目都成，精神状态不好，做什么项目都危险。


    要让团队成员的精神状态好，就要看人下菜单，每个人的心理需求不一样，比如，有的人需要荣誉感，有的人需要未来，有的人需要现金，他要什么东西，我们就尽量画什么饼给他，让他兴奋起来，把大家的状态调节到最好。


    其实，创业人管理团队，就是需要管理与引导好每个人的欲望！


    创业初期，我们也没多少钱，现在的人又很聪明，特别是90后，你给他一个低底薪，还想让他拼命工作的思维已经过时了。所以，我现在做任何项目，都是全体团队共同持股，且让团队拿大头，所以，在我


    的项目里面，已经没有员工了，我让所有的人都包产到户，实行低底薪，高分红的政策，这样其实解决了很多人想当老板的欲望，并且他们自己为自己干，也比较拼命。加上我做项目的经验，团队管理的经验，基本做一个项目，成一个项目，也还有点利润。


    我选项目的方法是，先选择消费群体，看谁有钱，然后就开始找相关行业的人，然后开始设计产品，或者设计一个圈套，开始捞他们'
  - '[PAGE 61]


    的氧这叫着按市场需求，市场趋势做项目。而很多没玩过项目的人，是先考虑自己对什么感兴趣，就直接开始干了，这样的态度，还想发财，我认为这叫闭门造车，还是计划经济的思维，社会上大多数创业者每是这样的思维，非常可怕。


    这个社会，很多人认为发财的机会少，其实发财的机会非常多，因为人们有千奇百怪的欲望，只要你能解决一个欲望，一类人的一个问题，你就能赚大钱。思维放开一点想想，特别是互联网时代，互联网这个工具是最适合解决人们的精神问题的。


    由于生产力的迅速发展，物质相当丰富的今天,做实体产品当然竞争激励，利润稀薄。可惜大部分人的思维僵化，一说创业，做生意,只会想到实体产品，这就导致少部分做互联网虚拟项目的人很赚钱，比如，我就知道泡泡培训，在线股票培训，网上看风水，算命，等很多一天赚几千的项目，大部分人都看不起，看不懂这样的项目，真是奇怪。


    新一代的创业者，完全可以考虑一下，玩这些互联网虚拟暴利荐目。几乎没什么成本，但利润超级高。


    只要人们发自内心的需要一个产品，那么这个产品就一定有市场，根据这个思路，实际上大家可以挖掘出来很多虚拟的项目。


    对于创业者来说，刚刚奋力拼搏的时候，是会很痛苦的，但有了结果的时候，人就会很开心，继面进入拼搏起来也很享受的状态，我现在就进入了拼搏起来也很享受的状态，我希望广大创业者们也能快速进入这个状态。


    # 新时代的市场经济管理模式


    看到很多老板还在用几千年前秦始皇创造的管理模式，即中央'
  - '[PAGE 62]


    集权的管理模式，我就心疼这些过时的老板。


    这种管理模式，就是老板自己当头。老板下面设几个部门，比如，营销部，市场部，生产部，人事部。每个部门都有自己的经理，然后，老板就带领这几个部门打仗，赚钱，指挥这几个部门行动。


    这种模式，在现代自由社会，只会把老板累死，因为，大家都越来越聪明，市场竞争越来越激烈，分工越来越精细，老板不可能又懂市场，又懂顾客，又懂生产，又懂财务，还懂人事。


    而且，人的自由意志在不停的觉醒，特别是90后参与到社会中来工作的时候，特别是玩知识经济的企业，很多人都是本科毕业，大家都不愿意听老板指挥。老板又不是皇帝，又没有军队，就发点工资，只有没什么叫的人，找不到工作的人，跟着你混，没有办法了，才听你的。这种中央集权的管理模式吸收不到优秀的人才。现代人，都不服管，不喜欢被管。


    那么，我的市场经营管理模式是怎么做的呢？


    在企业，所有员工不必要听我的指挥，你为谁工作，你就听谁的指挥，你服务那个部门，哪些员工，你就听谁的指挥，在这个过程中，谁服务好自己的对接部门或者个人，谁服务的好，谁就升官，也就是你的市场在哪里、你的顾客在哪里，才是你关心的，你不用关心我这个老板想什么了。我也不会指挥你干什么，大家也可以民主选举，你部门的几个人，可以直接选一个，你们认为带着你们能赚更多钱的人来当经理，我批准了就可以执行。


    这样，人事部的人就只会一心一意的去服务那些要人的部门；财务部的人，服务于公司的每个员工；市场部的人，服务顾客，生'
  - '[PAGE 63]


    产部的人，服务市场部的，他们要什么产品，你就生产什么产品。公司就自动运转了，不需要我再安排他们做什么工作。


    我呢，只负责把几个部门的经理叫到一起 coming 开开会，调节调节矛盾，我也服务于这几个经理。


    我发现，这个样子，大家的工作积极性变得很高，每个人都有成就感，每个人都主动发挥自己的智慧。我反而轻松了，而业绩居然比以前我自己吭哧吭哧的带队指挥高出一大截。


    后来我读经济学，才知道，以前的管理模式，纯粹是计划经济的管理模式。而现在我采用的这种管理模式，是市场经济的管理模式。


    一般情况下，市场经济都强于计划经济，那么把这个思想用到管理上，也是通用的。


    # 中国目前创业环境的变化以及趋势


    目前，我们国家是鼓励创业的，在国家的政策与西方国家, 日本等国家对中国的态度，以及社会意识形态的发展，实体经济衰落，互联网，移动互联网的崛起，金融体系的开放，房地产的瓶颈等等多种社会因素的共同作用
    1 市场已经发生了翻天覆地的变化。这些因素不仅仅塑造了新的行为，而且也提供了不少新的创业机会与挑战。


    我觉得主要的创业环境变化，以及趋势，体现在如下 9 点上面。


    第一：网络信息技术的发展。


    互联网特别是现在的移动互联网创造了崭新的信息时代。我们能够更加精确的为用户生产产品，甚至定制产品，社交网络的发展，'
  md: "\n## 俞敏洪的启示与创业心法\n\n敏洪，坐了半天一夜的船到了上海。\n\n8岁的俞敏洪通过这次出远门，见识了长江的壮阔，吴淞口的苍茫，上海的灯光，街道的繁华。我想，这次对小小的俞敏洪有了很深的刺激。他萌生了走出农村的念头，走向远方的心思。\n\
    \n其实，我想说，一个人的见识，非常的重要；只有你见识了繁华，才有追逐的欲望。我8年前做过房产中介，到陆家嘴最繁华的财富海景楼盘里去过，当时还见到了分众传媒的老总江南春。内心就萌生这一辈子，一定不能做普通人的念头，虽然那里面的房子，一套动辄半个亿，我还买不起，但我总是会不断的向这个方向靠近。我的内心从来没有放弃过这个念头。因为我见识过了，就念念不忘，这种感觉估计和俞敏洪从农村到上海见到的那些繁华后的感觉或有相似之处。所以我建议有志之人虽然你买不起保时捷也可以到4S店里面去试驾下，先见识一下。这样魂牵梦绕后，你会有一定的要攀登上去的念头。\n\
    \n接着说俞敏洪，俞敏洪为了能走出农村，参加了三次高考，1978年显然没考上，俞敏洪回家里开始插秧，开拖拉机，干了几个月农活。遇到一个当代课老师的机会，然后他借助这个当代课老师的机会，边代课，边复习，又参加了1979年的高考。结果呢，英语只考了55分，又没考上。其他科目的成绩都很好，于是，他不甘心，准备好好参加1980年的高考。\n\
    \n这一次，他每天早上很早起床开始读英语，背单词，背课文，做题，讨论；晚上10点学校关灯了，他还用手电筒在被窝里背单词。\n\n一年后，他杀出重围，考上了北大。这里我有一个观点，俞敏洪在那个竞争异常激烈的年代能考上北大，不用说，也是下了死功夫的。有句话叫“要想生富贵，需下死功夫！”我们在现在这个商业环境中创业，遇到的竞争当然也是非常大的，但是只要是积极进取，完全投入的付出，一定会有收获的。\n\
    \n俞敏洪进了北大，并不是一帆风顺的。一个农村的孩子走进大城市，想要胜出城市里的土著是很艰巨的一个任务。特别是在北京这种大城市里的北大，里面很多都是当官的或者大人物子女，一个农村娃就更加地自卑和孤独了。他有很多困难，比如不会讲普通话。第一次全班同学做自我介绍的时候，俞敏洪做了自我介绍后，班长站起来跟他说“俞敏洪，你能不能不要讲日语？”这导致了俞敏洪用了整整一年，拿着个收音机在小树林里学播音员讲话，终于勉勉强强让大家能听个明白。一个人了不起的地方就是当到这些地方，别人批评了他的不足，甚至是带着嘲讽的口吻批评的，但他却没有愤然攻击，而是接下来默默的奋起直追，这种做法，值得我们学习。\n\
    \n后来我们都知道俞敏洪搞出了新东方。但是在北大的时候，他曾经因为英语差被调到了C班，当初应该是有ABC三个等级的班级，C班是“语音语调及听力障碍”班。可他并没有气馁，而是开始不停的听单词，背单词，每天除了吃饭，睡觉就是带着收音机学习。寝室关灯了，依旧跑到路灯下学习。就这样，他的英语水平迅速提高，而且成了班里的“单词王”。大家不懂的单词就直接把俞敏洪当词典问了。我们创业做项目，其实如果有这个精神，什么项目都能被攻克。\n\
    \n俞敏洪在大三的时候，被查出了“肺结核”，休学一年，在医院养病的这一年，这个家伙，开始了疯狂的阅读，一刻也没有闲下来，据传一年读了600多本书，包括《三国演义》《水浒传》《资治通鉴》《孙子兵法》《论语》《曾国藩家书》《徐霞客游记》，背诵了部分书籍包括《离骚》等。这说明了个什么问题呢？从来没觉得累过，在奋斗，这样的人后来成为亿万富翁其实是水到渠成的。我刚刚去查了下新东方的市值还是40.55亿美元。我们很多人在工作中，总是希望放假或者休息，还没病就渴望休息，要是病了就更不得了了，这种精神状态当然是做不成什么大事的，更别说创业成功了。如果我们想创业成功，我觉得俞敏洪身上的这些优秀的品质值得我们深思与学习。\n\
    \n## 创业，从任何一个点切入，都能富甲天下\n\n从任何一个点切入去创业，把一个事情做细，做深，自然就会发现很多新机会，新的赢利点，甚至你能做到别人的地盘上去颠覆别人。\n\
    \n比如滴滴打车，从出租车市场入手，做得深，占据了很大的市场后，直接推出代驾服务。代驾服务是利润非常高的一块市场，由于滴滴打车的用户基数很大，而E代驾的市场基数很少。当滴滴打车推出了代驾服务过后，基本把E代驾的市场给干没了。\n\
    \n把一件事做透彻，任何一个项目，任何一个企业，都能做成几千亿市值的巨无霸。乔布斯从MP3入手，把音乐市场给统治了，干掉了很多唱片公司。跟着做出了在线音乐平台，干掉了全球的音乐公司。又在MP3上加上了个屏幕做成了iPad，继续加个电话卡，做成了手机，干掉了诺基亚，把三星也给干残废了。其实，在我看来，乔布斯仅仅是把MP3做透彻了。\n\
    \n360的周鸿祎，开始做了个360清理软件，把清理软件又做成了安全卫士，继而成在线杀毒，通过免费，直接干掉了所有杀毒软件。然后占据了很大的市场，顺手推出360安全浏览器。在我看来，360就是做透彻了一个清理软件。只要创业者愿意把一件事做透彻，那么机会多得很，成为巨无霸级别的企业易如反掌。\n\
    \n如果把一件事做到一半呢？虽然很努力，可能等待你的是激烈的竞争，然后就是失败。我把创业商学院的“创业”两个字做透彻，会什么呢？想象空间非常大哦。我大概会孵化很多企业出来，会投资部分我觉得好的企业。我也会接触到很多创业者，投资人。只要做透，随随便便搞个几千亿的企业出来也不在话下。\n\
    \n每一个创业者，都不应该说自己没什么机会，自己找不到方向，因为，你只需要选择一件事，把这件事做透彻，在这个过程中，你自然会拥有非常多的机会，让你大赚特赚，让你功成名就。\n\
    \n### 十一点做老板的心法\n\n- 做互联网生意，自己就是上游是顶点，做传统生意，你很容易在别人的下游。有货款，欠账，烂账，上游企业一倒闭，就砸死一群下游企业。所以，现阶段有智慧的老板都来玩互联网吧。\n\
    - 找人合作，先搞清楚这个人的状态是正在走上坡路吗？如果是上坡路，跟他合作就很容易成功。如果是走下坡路或者维持现状呢？大势已去的人，不跟他玩。\n- 员工所关心的问题不是公司的问题而是自己的问题，所以管理员工，就是给他定具体目标。别扯你希望什么什么的，因为不管你怎么说，他都不关心，他只关心自己的利益。\n\
    - 公司能培养多少心放在公司的人，公司就有多稳定。公司的稳定不是靠技术强悍，不是靠有能力的人支撑的，而是靠心在公司的人支撑的。\n- 项目经理是用自己的智慧解决问题，老板是用所有员工的智慧解决问题。不会利用员工脑袋的老板仅仅是一个项目经理而已，有将合自己的情况思考下。整理下，你就能清楚的认识你自己的现实情况了。\n\
    \n对于我们每个创业人来说，我们的核心资源就是自己，包括自己的兴趣，技能，个性，以及你所掌握的资源，比如你银行里的存款，你的房子。如果你有团队，那么也可以算是你的资源。\n\
    \n我们通过九个步骤搞清楚自己怎么可以创业成功，并且赚到钱。\n\n- **第一：问自己，可以与谁合作。**\n  首先是团队成员，其次是家人，朋友，同学，公司同事，还有客户。\n\
    - **第二：问自己，可以发展什么样的关键业务，自己要做什么？**\n  比如是要做互联网营销呢？是做产品代理呢？还是自己去炒菜、卖菜？还是开个广告设计公司？这完全取决于你会什么，你的兴趣点在什么地方，还有你的志向是什么！\n\
    - **第三：自己的核心资源是什么？你干过什么？拥有什么？**\n  比如你做了5年网站程序员，你会编程，会做网站，这是你的优势。比如你家里有钱，你老子给了你50万，这也是你的资源。比如你在学校里泡妞无数，一毕业有无数个如愿意跟你浪荡天涯，你可以教人泡妞。\n\
    - **第四：价值服务。**\n  你到底要提供一个什么价值去帮助你的客户。这取决于你的核心资源和**你干过什么，会什么**。\n- **第五：**与**客户的关系。**\n\
    \  你打算怎么和客户沟通，交流。以什么形式沟通交流！是一对一呢？还是会议营销一对多？等等。\n- **第六：怎么宣传**自己，怎么**把服务提供给用户。**\n\
    \  比如，你通过快递把包裹送上门，还是开个店等用户主动来找你？通过百度推广，QQ群推广，或者报纸做广告宣传**自己，还是**自己请几个人做地面推广？\n\
    - **第七：**你的**用户群体定位。**\n  你到底为老年人服务，还是为大学生服务，为家庭妇女服务，还是为写字楼里的白领服务。\n- **第八：**你想要做的**事情。**\n\
    \  你要付出什么？你的成本包括什么？成本多高以内你能接受？超过了多少你有没有把握能融到资金？\n- **第九：收入。**\n  做完这一切，你能得到什么？你的收入是多少？划算不划算？如果最后算到收入这个**步，不划算，那么前面8个步骤都没意义！**\n\
    \n大家根据我这9条，一条一条的去套**自己，就能把自己给分析的**一清二楚，创业方向与要做得事情就能分析的非常明白。\n\n## 互联网创业，想法一定要大，做法一定要小\n\
    \n没有想法的人，很难有成就。目前，中国PC互联网加移动互联网人口达到8.5亿人。任何一个细小的分支都蕴藏着巨大的商机。一个滴滴打车，两年前从80万起家，做到现在手上有150亿现金。说简单点，就是把一个打车软件给做到极致了。而在中国，这样的机会在未来10年会在各个领域出现很多。\n\
    \n我们选好一个行业的细分领域，就要想，我要把这个点吃透彻，做到全国去，做到几百亿去。有了这个理想过后，我们从一个小细节入手，把这个细节做到极致，做到全国。要在一个关键问题上赚到钱再去想扩张的事。千万不要一上去，就做很多功能，很多服务。战线拉长，人的精力就跟不上，就很难做起来。\n\
    \n我们要选好一个具体的点，尽到最大的努力，把这个点做到极致。据了全国市场过后，再去想扩张的事情。比如，滴滴打车占据了整个出租车市场过后，就扩张到了代驾业务。吃掉了代驾市场这块肥肉。当滴滴把代驾这块肥肉吃掉过后，他能不能继续吃掉驾校这块市场、能不能吃掉二手车市场？都围绕着车这个市场来吃，吃得有深又宽，我觉得，一个千亿级别的企业会轻轻松松的诞生出来。\n\
    \n互联网行业，真的是机会非常多。而且目前是异常容易把一个屌丝变成一个富豪的行业。想在这个行业发展事业的人，要多跟这个行业的人接触，进入这个行业的圈子去讨论，探索，学习。你现在与什么样的人讨论，探索，学习，决定着你三五年后从事的事业。想要快速成就事业，完全靠自己探索，基本是不可能的，要学会去借鉴行业里优秀人的思维，做法。然后去实践，变成自己的思维，做法。\n\
    \n## 冷门生意赚大钱\n\n首先讲一个理念，一个人赚钱没有什么了不起，要让大家都能赚钱。让跟着你的人都能赚钱，甚至，让你的客户也能在跟你的合作中赚钱，这样，许多人就会跟你精诚合作，你就可以控制整个市场，赚到更多的钱。最笨的人就是只知道自己赚钱，而不顾别人，最后自己只有倒闭。\n\
    \n一般人做生意，只是精于算计，做法犹如打麻将，看住上家，扣住下家，防住对家，结果我做不成，你也做不成，大家都没钱赚。\n\n犹太商人和温州商人的做法犹如下围棋，你占这个点，我就占那个点。你卖汽车，我就开旅馆，大家在竞争合作，在合作中竞争，其结果是联手造势，一起把蛋糕做大。\n\
    \n我经常在核心骨干中宣传的，大家要精诚合作，一起把蛋糕做大。\n\n我们当老板的，招聘新人进公司，在试用期就要特别注意，这个人是精于算计的还是愿意跟大家精诚合作的。\n\
    \n一个优秀的创业者，永远是目标明确，高度专注，不断为用户释放价值，力图成为用户卓越的伙伴。\n\n创业者要知道：风险越大，赚钱的机会就越大。到别人认为是冷门的地方，你会赚到数不清的钱。\n\
    \n比如有个网站叫“一心理网站”，做心理学的，最近融资了几千万美金；心理学从来都不是热门，但被他们做成了。一个叫“好想你”品牌的红枣，居然市值做到了23.06亿。一个教人泡妞网站，每年居然有5000万的收入。\n\
    \n这都是大家不太注意的偏门生意，很赚钱。当然，如果你细心去找，你会发现更多的冷门赚大钱的生意，我就经常去找这些冷门生意来做。\n\n## 企业打造核心竞争力的6个方向\n\
    \n用户到底为什么选择你这个企业提供的产品或者服务，是我们每个企业都要思考的问题。换句话说，也是我们企业靠什么核心竞争力赢得用户，我大概归纳了6个点，供大家参考。\n\
    \n- 便利性。就是你这个产品或者服务帮助用户节约了时间，减少了麻烦，你就可以赢得用户。比如余额宝为什么成了最大的基金，是因为用户把钱转到余额宝太方便了；淘宝最近出了一个花呗，肯定会抢占非常大的信用卡市场，因为这又是具备非常大便利性的产品。你能为用户提供便利，是我们打造核心竞争力的第一个方向。\n\
    - 价格，省钱，也是吸引用户非常重要的一个原因。你能做出一个比市场上的产品更加便宜的产品，你就能胜利。比如360做了个免费杀毒，就把金山毒霸、瑞星杀毒的收费市场干掉了；微信的语音干掉了部分电话业务，干掉了部分短信业务。你能卖得便宜，是打造核心竞争力的第二个方向。\n\
    - 设计。随着人们生活水平的提高，有品位的产品或服务会越来越有市场。尽管价格比普通商品高很多，还是有用户为设计好的产品买单。比如，很多人会为苹果手机买单，就是因为苹果手机设计得好，不但有装逼感，而且播放音乐比很多普通的音箱都好。很多设计好的家具也很有市场。打造核心竞争力的第三个方向，修炼自己的设计能力。\n\
    - 品牌或者市场地位。这是什么东西呢？就是让用户感觉到不同，有身份，有地位，很多奢侈品就是走的这个路线。比如，有的人不惜重金买几百万的法拉利跑车、手表，或者买有特殊意义的东西。比如脑白金，这个产品卖的是孝敬爸妈，卖的是品牌与孝敬文化。突出自己的市场定位与品牌，是打造核心竞争力的第四个方向。\n\
    - 帮助企业或者个人进行成本削减。就是你能提供一个产品或者服务，让企业或个人以前的运营成本减小，你也会有市场。比如自动化机械化替代工人，信息化、无纸化办公，让企业节约了办公成本。帮助企业或者个人进行成本削减，是打造自己核心竞争力的第五个方向。\n\
    - 帮助企业或者个人降低风险。这种服务一般出现在保险业、调查取证行业、咨询、顾问行业等。是打造自己核心竞争力的第六个方向。\n\n这其实也是创业的六个方向。不管是创业还是做企业都需要根据自己的特长与资源来打造相对应的核心竞争力，你有那个优势就用那个优势。\n\
    \n## 物质丰富的互联网时代赚钱的方向\n\n首先讲一个观念，创业者永远不要让工作成为自己的负担，如果感觉到工作成了自己的负担，那么别干了。创业者，一定要让自己的心自由，才能够抗住压力，挖掘出自己的潜力。如果工作已经成为了自己的负担，那么你就很难做好这份工作。\n\
    \n其实，延伸下来，就是一个精神问题，创业者要关注团队里的人的精神，而不是项目本身。精神状态好，做什么项目都成；精神状态不好，做什么项目都危险。\n\n要让团队成员的精神状态好，就要看人下菜单。每个人的心理需求不一样，比如，有的人需要荣誉感，有的人需要未来，有的人需要现金。他要什么东西，我们就尽量画什么饼给他，让他兴奋起来，把大家的状态调节到最好。其实，创业人管理团队，就是需要管理与引导好每个人的欲望！\n\
    \n创业初期，我们也没多少钱，现在的人又很聪明，特别是90后，你给他一个低底薪，还想让他拼命工作的思维已经过时了。所以，我现在做任何项目，都是全体团队共同持股，且让团队拿大头。所以，在我的项目里面，已经没有员工了，我让所有的人都包产到户，实行低底薪，高分红的政策。这样其实解决了很多人想当老板的欲望，并且他们自己为自己干，也比较拼命。加上我做项目的经验，团队管理的经验，基本做一个项目，成一个项目，也还有点利润。\n\
    \n我选项目的方法是，先选择消费群体，看谁有钱，然后就开始找相关行业的人，然后开始设计产品，或者设计一个圈套，开始捞他们的氧。这叫着按市场需求，市场趋势做项目。而很多没玩过项目的人，是先考虑自己对什么感兴趣，就直接开始干了。这样的态度，还想发财，我认为这叫闭门造车，还是计划经济的思维。社会上大多数创业者每是这样的思维，非常可怕。\n\
    \n这个社会，很多人认为发财的机会少，其实发财的机会非常多，因为人们有千奇百怪的欲望，只要你能解决一个欲望，一类人的一个问题，你就能赚大钱。思维放开一点想想，特别是互联网时代，互联网这个工具是最适合解决人们的精神问题的。\n\
    \n由于生产力的迅速发展，物质相当丰富的今天，做实体产品当然竞争激烈，利润稀薄。可惜大部分人的思维僵化，一说创业、做生意，只会想到实体产品。这就导致少部分做互联网虚拟项目的人很赚钱。比如，我就知道泡泡培训、在线股票培训、网上看风水、算命等很多一天赚几千的项目。大部分人都看不起、看不懂这样的项目，真是奇怪。\n\
    \n新一代的创业者，完全可以考虑一下，玩这些互联网虚拟暴利项目。几乎没什么成本，但利润超级高。\n\n只要人们发自内心的需要一个产品，那么这个产品就一定有市场。根据这个思路，实际上大家可以挖掘出来很多虚拟的项目。\n\
    \n对于创业者来说，刚刚奋力拼搏的时候，是会很痛苦的。但有了结果的时候，人就会很开心，进而进入拼搏起来也很享受的状态。我现在就进入了拼搏起来也很享受的状态，我希望广大创业者们也能快速进入这个状态。\n\
    \n## 新时代的市场经济管理模式\n\n看到很多老板还在用几千年前秦始皇创造的管理模式，即中央集权的管理模式，我就心疼这些过时的老板。\n\n这种管理模式，就是老板自己当头。老板下面设几个部门，比如，营销部，市场部，生产部，人事部。每个部门都有自己的经理，然后，老板就带领这几个部门打仗，赚钱，指挥这几个部门行动。\n\
    \n这种模式，在现代自由社会，只会把老板累死。因为，大家都越来越聪明，市场竞争越来越激烈，分工越来越精细，老板不可能又懂市场，又懂顾客，又懂生产，又懂财务，还懂人事。\n\
    \n而且，人的自由意志在不停的觉醒，特别是90后参与到社会中来工作的时候，特别是玩知识经济的企业，很多人都是本科毕业，大家都不愿意听老板指挥。老板又不是皇帝，又没有军队，就发点工资。只有没什么叫的人、找不到工作的人，跟着你混，没有办法了，才听你的。这种中央集权的管理模式吸收不到优秀的人才。现代人，都不服管，不喜欢被管。\n\
    \n那么，我的市场经营管理模式是怎么做的呢？\n\n在企业，所有员工不必要听我的指挥。你为谁工作，你就听谁的指挥；你服务那个部门、哪些员工，你就听谁的指挥。在这个过程中，谁服务好自己的对接部门或者个人，谁服务的好，谁就升官。也就是你的市场在哪里、你的顾客在哪里，才是你关心的，你不用关心我这个老板想什么了。我也不会指挥你干什么。大家也可以民主选举，你部门的几个人，可以直接选一个你们认为带着你们能赚更多钱的人来当经理，我批准了就可以执行。\n\
    \n这样，人事部的人就只会一心一意的去服务那些要人的部门；财务部的人，服务于公司的每个员工；市场部的人，服务顾客；生产部的人，服务市场部的，他们要什么产品，你就生产什么产品。公司就自动运转了，不需要我再安排他们做什么工作。\n\
    \n我呢，只负责把几个部门的经理叫到一起coming开开会，调节调节矛盾，我也服务于这几个经理。\n\n我发现，这个样子，大家的工作积极性变得很高，每个人都有成就感，每个人都主动发挥自己的智慧。我反而轻松了，而业绩居然比以前我自己吭哧吭哧的带队指挥高出一大截。\n\
    \n后来我读经济学，才知道，以前的管理模式，纯粹是计划经济的管理模式。而现在我采用的这种管理模式，是市场经济的管理模式。\n\n一般情况下，市场经济都强于计划经济，那么把这个思想用到管理上，也是通用的。\n\
    \n## 中国目前创业环境的变化以及趋势\n\n目前，我们国家是鼓励创业的。在国家的政策与西方国家、日本等国家对中国的态度，以及社会意识形态的发展、实体经济衰落、互联网、移动互联网的崛起、金融体系的开放、房地产的瓶颈等等多种社会因素的共同作用下，市场已经发生了翻天覆地的变化。这些因素不仅仅塑造了新的行为，而且也提供了不少新的创业机会与挑战。\n\
    \n我觉得主要的创业环境变化，以及趋势，体现在如下9点上面。\n\n- 第一：网络信息技术的发展。互联网特别是现在的移动互联网创造了崭新的信息时代。我们能够更加精确的为用户生产产品，甚至定制产品。社交网络的发展，\n"
  mdcn: "\n## 俞敏洪的启示与创业心法\n\n敏洪，坐了半天一夜的船到了上海。\n\n8岁的俞敏洪通过这次出远门，见识了长江的壮阔，吴淞口的苍茫，上海的灯光，街道的繁华。我想，这次对小小的俞敏洪有了很深的刺激。他萌生了走出农村的念头，走向远方的心思。\n\
    \n其实，我想说，一个人的见识，非常的重要；只有你见识了繁华，才有追逐的欲望。我8年前做过房产中介，到陆家嘴最繁华的财富海景楼盘里去过，当时还见到了分众传媒的老总江南春。内心就萌生这一辈子，一定不能做普通人的念头，虽然那里面的房子，一套动辄半个亿，我还买不起，但我总是会不断的向这个方向靠近。我的内心从来没有放弃过这个念头。因为我见识过了，就念念不忘，这种感觉估计和俞敏洪从农村到上海见到的那些繁华后的感觉或有相似之处。所以我建议有志之人虽然你买不起保时捷也可以到4S店里面去试驾下，先见识一下。这样魂牵梦绕后，你会有一定的要攀登上去的念头。\n\
    \n接着说俞敏洪，俞敏洪为了能走出农村，参加了三次高考，1978年显然没考上，俞敏洪回家里开始插秧，开拖拉机，干了几个月农活。遇到一个当代课老师的机会，然后他借助这个当代课老师的机会，边代课，边复习，又参加了1979年的高考。结果呢，英语只考了55分，又没考上。其他科目的成绩都很好，于是，他不甘心，准备好好参加1980年的高考。\n\
    \n这一次，他每天早上很早起床开始读英语，背单词，背课文，做题，讨论；晚上10点学校关灯了，他还用手电筒在被窝里背单词。\n\n一年后，他杀出重围，考上了北大。这里我有一个观点，俞敏洪在那个竞争异常激烈的年代能考上北大，不用说，也是下了死功夫的。有句话叫“要想生富贵，需下死功夫！”我们在现在这个商业环境中创业，遇到的竞争当然也是非常大的，但是只要是积极进取，完全投入的付出，一定会有收获的。\n\
    \n俞敏洪进了北大，并不是一帆风顺的。一个农村的孩子走进大城市，想要胜出城市里的土著是很艰巨的一个任务。特别是在北京这种大城市里的北大，里面很多都是当官的或者大人物子女，一个农村娃就更加地自卑和孤独了。他有很多困难，比如不会讲普通话。第一次全班同学做自我介绍的时候，俞敏洪做了自我介绍后，班长站起来跟他说“俞敏洪，你能不能不要讲日语？”这导致了俞敏洪用了整整一年，拿着个收音机在小树林里学播音员讲话，终于勉勉强强让大家能听个明白。一个人了不起的地方就是当到这些地方，别人批评了他的不足，甚至是带着嘲讽的口吻批评的，但他却没有愤然攻击，而是接下来默默的奋起直追，这种做法，值得我们学习。\n\
    \n后来我们都知道俞敏洪搞出了新东方。但是在北大的时候，他曾经因为英语差被调到了C班，当初应该是有ABC三个等级的班级，C班是“语音语调及听力障碍”班。可他并没有气馁，而是开始不停的听单词，背单词，每天除了吃饭，睡觉就是带着收音机学习。寝室关灯了，依旧跑到路灯下学习。就这样，他的英语水平迅速提高，而且成了班里的“单词王”。大家不懂的单词就直接把俞敏洪当词典问了。我们创业做项目，其实如果有这个精神，什么项目都能被攻克。\n\
    \n俞敏洪在大三的时候，被查出了“肺结核”，休学一年，在医院养病的这一年，这个家伙，开始了疯狂的阅读，一刻也没有闲下来，据传一年读了600多本书，包括《三国演义》《水浒传》《资治通鉴》《孙子兵法》《论语》《曾国藩家书》《徐霞客游记》，背诵了部分书籍包括《离骚》等。这说明了个什么问题呢？从来没觉得累过，在奋斗，这样的人后来成为亿万富翁其实是水到渠成的。我刚刚去查了下新东方的市值还是40.55亿美元。我们很多人在工作中，总是希望放假或者休息，还没病就渴望休息，要是病了就更不得了了，这种精神状态当然是做不成什么大事的，更别说创业成功了。如果我们想创业成功，我觉得俞敏洪身上的这些优秀的品质值得我们深思与学习。\n\
    \n## 创业，从任何一个点切入，都能富甲天下\n\n从任何一个点切入去创业，把一个事情做细，做深，自然就会发现很多新机会，新的赢利点，甚至你能做到别人的地盘上去颠覆别人。\n\
    \n比如滴滴打车，从出租车市场入手，做得深，占据了很大的市场后，直接推出代驾服务。代驾服务是利润非常高的一块市场，由于滴滴打车的用户基数很大，而E代驾的市场基数很少。当滴滴打车推出了代驾服务过后，基本把E代驾的市场给干没了。\n\
    \n把一件事做透彻，任何一个项目，任何一个企业，都能做成几千亿市值的巨无霸。乔布斯从MP3入手，把音乐市场给统治了，干掉了很多唱片公司。跟着做出了在线音乐平台，干掉了全球的音乐公司。又在MP3上加上了个屏幕做成了iPad，继续加个电话卡，做成了手机，干掉了诺基亚，把三星也给干残废了。其实，在我看来，乔布斯仅仅是把MP3做透彻了。\n\
    \n360的周鸿祎，开始做了个360清理软件，把清理软件又做成了安全卫士，继而成在线杀毒，通过免费，直接干掉了所有杀毒软件。然后占据了很大的市场，顺手推出360安全浏览器。在我看来，360就是做透彻了一个清理软件。只要创业者愿意把一件事做透彻，那么机会多得很，成为巨无霸级别的企业易如反掌。\n\
    \n如果把一件事做到一半呢？虽然很努力，可能等待你的是激烈的竞争，然后就是失败。我把创业商学院的“创业”两个字做透彻，会什么呢？想象空间非常大哦。我大概会孵化很多企业出来，会投资部分我觉得好的企业。我也会接触到很多创业者，投资人。只要做透，随随便便搞个几千亿的企业出来也不在话下。\n\
    \n每一个创业者，都不应该说自己没什么机会，自己找不到方向，因为，你只需要选择一件事，把这件事做透彻，在这个过程中，你自然会拥有非常多的机会，让你大赚特赚，让你功成名就。\n\
    \n### 十一点做老板的心法\n\n- 做互联网生意，自己就是上游是顶点，做传统生意，你很容易在别人的下游。有货款，欠账，烂账，上游企业一倒闭，就砸死一群下游企业。所以，现阶段有智慧的老板都来玩互联网吧。\n\
    - 找人合作，先搞清楚这个人的状态是正在走上坡路吗？如果是上坡路，跟他合作就很容易成功。如果是走下坡路或者维持现状呢？大势已去的人，不跟他玩。\n- 员工所关心的问题不是公司的问题而是自己的问题，所以管理员工，就是给他定具体目标。别扯你希望什么什么的，因为不管你怎么说，他都不关心，他只关心自己的利益。\n\
    - 公司能培养多少心放在公司的人，公司就有多稳定。公司的稳定不是靠技术强悍，不是靠有能力的人支撑的，而是靠心在公司的人支撑的。\n- 项目经理是用自己的智慧解决问题，老板是用所有员工的智慧解决问题。不会利用员工脑袋的老板仅仅是一个项目经理而已，有将合自己的情况思考下。整理下，你就能清楚的认识你自己的现实情况了。\n\
    \n对于我们每个创业人来说，我们的核心资源就是自己，包括自己的兴趣，技能，个性，以及你所掌握的资源，比如你银行里的存款，你的房子。如果你有团队，那么也可以算是你的资源。\n\
    \n我们通过九个步骤搞清楚自己怎么可以创业成功，并且赚到钱。\n\n- **第一：问自己，可以与谁合作。**\n  首先是团队成员，其次是家人，朋友，同学，公司同事，还有客户。\n\
    - **第二：问自己，可以发展什么样的关键业务，自己要做什么？**\n  比如是要做互联网营销呢？是做产品代理呢？还是自己去炒菜、卖菜？还是开个广告设计公司？这完全取决于你会什么，你的兴趣点在什么地方，还有你的志向是什么！\n\
    - **第三：自己的核心资源是什么？你干过什么？拥有什么？**\n  比如你做了5年网站程序员，你会编程，会做网站，这是你的优势。比如你家里有钱，你老子给了你50万，这也是你的资源。比如你在学校里泡妞无数，一毕业有无数个如愿意跟你浪荡天涯，你可以教人泡妞。\n\
    - **第四：价值服务。**\n  你到底要提供一个什么价值去帮助你的客户。这取决于你的核心资源和**你干过什么，会什么**。\n- **第五：**与**客户的关系。**\n\
    \  你打算怎么和客户沟通，交流。以什么形式沟通交流！是一对一呢？还是会议营销一对多？等等。\n- **第六：怎么宣传**自己，怎么**把服务提供给用户。**\n\
    \  比如，你通过快递把包裹送上门，还是开个店等用户主动来找你？通过百度推广，QQ群推广，或者报纸做广告宣传**自己，还是**自己请几个人做地面推广？\n\
    - **第七：**你的**用户群体定位。**\n  你到底为老年人服务，还是为大学生服务，为家庭妇女服务，还是为写字楼里的白领服务。\n- **第八：**你想要做的**事情。**\n\
    \  你要付出什么？你的成本包括什么？成本多高以内你能接受？超过了多少你有没有把握能融到资金？\n- **第九：收入。**\n  做完这一切，你能得到什么？你的收入是多少？划算不划算？如果最后算到收入这个**步，不划算，那么前面8个步骤都没意义！**\n\
    \n大家根据我这9条，一条一条的去套**自己，就能把自己给分析的**一清二楚，创业方向与要做得事情就能分析的非常明白。\n\n## 互联网创业，想法一定要大，做法一定要小\n\
    \n没有想法的人，很难有成就。目前，中国PC互联网加移动互联网人口达到8.5亿人。任何一个细小的分支都蕴藏着巨大的商机。一个滴滴打车，两年前从80万起家，做到现在手上有150亿现金。说简单点，就是把一个打车软件给做到极致了。而在中国，这样的机会在未来10年会在各个领域出现很多。\n\
    \n我们选好一个行业的细分领域，就要想，我要把这个点吃透彻，做到全国去，做到几百亿去。有了这个理想过后，我们从一个小细节入手，把这个细节做到极致，做到全国。要在一个关键问题上赚到钱再去想扩张的事。千万不要一上去，就做很多功能，很多服务。战线拉长，人的精力就跟不上，就很难做起来。\n\
    \n我们要选好一个具体的点，尽到最大的努力，把这个点做到极致。据了全国市场过后，再去想扩张的事情。比如，滴滴打车占据了整个出租车市场过后，就扩张到了代驾业务。吃掉了代驾市场这块肥肉。当滴滴把代驾这块肥肉吃掉过后，他能不能继续吃掉驾校这块市场、能不能吃掉二手车市场？都围绕着车这个市场来吃，吃得有深又宽，我觉得，一个千亿级别的企业会轻轻松松的诞生出来。\n\
    \n互联网行业，真的是机会非常多。而且目前是异常容易把一个屌丝变成一个富豪的行业。想在这个行业发展事业的人，要多跟这个行业的人接触，进入这个行业的圈子去讨论，探索，学习。你现在与什么样的人讨论，探索，学习，决定着你三五年后从事的事业。想要快速成就事业，完全靠自己探索，基本是不可能的，要学会去借鉴行业里优秀人的思维，做法。然后去实践，变成自己的思维，做法。\n\
    \n## 冷门生意赚大钱\n\n首先讲一个理念，一个人赚钱没有什么了不起，要让大家都能赚钱。让跟着你的人都能赚钱，甚至，让你的客户也能在跟你的合作中赚钱，这样，许多人就会跟你精诚合作，你就可以控制整个市场，赚到更多的钱。最笨的人就是只知道自己赚钱，而不顾别人，最后自己只有倒闭。\n\
    \n一般人做生意，只是精于算计，做法犹如打麻将，看住上家，扣住下家，防住对家，结果我做不成，你也做不成，大家都没钱赚。\n\n犹太商人和温州商人的做法犹如下围棋，你占这个点，我就占那个点。你卖汽车，我就开旅馆，大家在竞争合作，在合作中竞争，其结果是联手造势，一起把蛋糕做大。\n\
    \n我经常在核心骨干中宣传的，大家要精诚合作，一起把蛋糕做大。\n\n我们当老板的，招聘新人进公司，在试用期就要特别注意，这个人是精于算计的还是愿意跟大家精诚合作的。\n\
    \n一个优秀的创业者，永远是目标明确，高度专注，不断为用户释放价值，力图成为用户卓越的伙伴。\n\n创业者要知道：风险越大，赚钱的机会就越大。到别人认为是冷门的地方，你会赚到数不清的钱。\n\
    \n比如有个网站叫“一心理网站”，做心理学的，最近融资了几千万美金；心理学从来都不是热门，但被他们做成了。一个叫“好想你”品牌的红枣，居然市值做到了23.06亿。一个教人泡妞网站，每年居然有5000万的收入。\n\
    \n这都是大家不太注意的偏门生意，很赚钱。当然，如果你细心去找，你会发现更多的冷门赚大钱的生意，我就经常去找这些冷门生意来做。\n\n## 企业打造核心竞争力的6个方向\n\
    \n用户到底为什么选择你这个企业提供的产品或者服务，是我们每个企业都要思考的问题。换句话说，也是我们企业靠什么核心竞争力赢得用户，我大概归纳了6个点，供大家参考。\n\
    \n- 便利性。就是你这个产品或者服务帮助用户节约了时间，减少了麻烦，你就可以赢得用户。比如余额宝为什么成了最大的基金，是因为用户把钱转到余额宝太方便了；淘宝最近出了一个花呗，肯定会抢占非常大的信用卡市场，因为这又是具备非常大便利性的产品。你能为用户提供便利，是我们打造核心竞争力的第一个方向。\n\
    - 价格，省钱，也是吸引用户非常重要的一个原因。你能做出一个比市场上的产品更加便宜的产品，你就能胜利。比如360做了个免费杀毒，就把金山毒霸、瑞星杀毒的收费市场干掉了；微信的语音干掉了部分电话业务，干掉了部分短信业务。你能卖得便宜，是打造核心竞争力的第二个方向。\n\
    - 设计。随着人们生活水平的提高，有品位的产品或服务会越来越有市场。尽管价格比普通商品高很多，还是有用户为设计好的产品买单。比如，很多人会为苹果手机买单，就是因为苹果手机设计得好，不但有装逼感，而且播放音乐比很多普通的音箱都好。很多设计好的家具也很有市场。打造核心竞争力的第三个方向，修炼自己的设计能力。\n\
    - 品牌或者市场地位。这是什么东西呢？就是让用户感觉到不同，有身份，有地位，很多奢侈品就是走的这个路线。比如，有的人不惜重金买几百万的法拉利跑车、手表，或者买有特殊意义的东西。比如脑白金，这个产品卖的是孝敬爸妈，卖的是品牌与孝敬文化。突出自己的市场定位与品牌，是打造核心竞争力的第四个方向。\n\
    - 帮助企业或者个人进行成本削减。就是你能提供一个产品或者服务，让企业或个人以前的运营成本减小，你也会有市场。比如自动化机械化替代工人，信息化、无纸化办公，让企业节约了办公成本。帮助企业或者个人进行成本削减，是打造自己核心竞争力的第五个方向。\n\
    - 帮助企业或者个人降低风险。这种服务一般出现在保险业、调查取证行业、咨询、顾问行业等。是打造自己核心竞争力的第六个方向。\n\n这其实也是创业的六个方向。不管是创业还是做企业都需要根据自己的特长与资源来打造相对应的核心竞争力，你有那个优势就用那个优势。\n\
    \n## 物质丰富的互联网时代赚钱的方向\n\n首先讲一个观念，创业者永远不要让工作成为自己的负担，如果感觉到工作成了自己的负担，那么别干了。创业者，一定要让自己的心自由，才能够抗住压力，挖掘出自己的潜力。如果工作已经成为了自己的负担，那么你就很难做好这份工作。\n\
    \n其实，延伸下来，就是一个精神问题，创业者要关注团队里的人的精神，而不是项目本身。精神状态好，做什么项目都成；精神状态不好，做什么项目都危险。\n\n要让团队成员的精神状态好，就要看人下菜单。每个人的心理需求不一样，比如，有的人需要荣誉感，有的人需要未来，有的人需要现金。他要什么东西，我们就尽量画什么饼给他，让他兴奋起来，把大家的状态调节到最好。其实，创业人管理团队，就是需要管理与引导好每个人的欲望！\n\
    \n创业初期，我们也没多少钱，现在的人又很聪明，特别是90后，你给他一个低底薪，还想让他拼命工作的思维已经过时了。所以，我现在做任何项目，都是全体团队共同持股，且让团队拿大头。所以，在我的项目里面，已经没有员工了，我让所有的人都包产到户，实行低底薪，高分红的政策。这样其实解决了很多人想当老板的欲望，并且他们自己为自己干，也比较拼命。加上我做项目的经验，团队管理的经验，基本做一个项目，成一个项目，也还有点利润。\n\
    \n我选项目的方法是，先选择消费群体，看谁有钱，然后就开始找相关行业的人，然后开始设计产品，或者设计一个圈套，开始捞他们的氧。这叫着按市场需求，市场趋势做项目。而很多没玩过项目的人，是先考虑自己对什么感兴趣，就直接开始干了。这样的态度，还想发财，我认为这叫闭门造车，还是计划经济的思维。社会上大多数创业者每是这样的思维，非常可怕。\n\
    \n这个社会，很多人认为发财的机会少，其实发财的机会非常多，因为人们有千奇百怪的欲望，只要你能解决一个欲望，一类人的一个问题，你就能赚大钱。思维放开一点想想，特别是互联网时代，互联网这个工具是最适合解决人们的精神问题的。\n\
    \n由于生产力的迅速发展，物质相当丰富的今天，做实体产品当然竞争激烈，利润稀薄。可惜大部分人的思维僵化，一说创业、做生意，只会想到实体产品。这就导致少部分做互联网虚拟项目的人很赚钱。比如，我就知道泡泡培训、在线股票培训、网上看风水、算命等很多一天赚几千的项目。大部分人都看不起、看不懂这样的项目，真是奇怪。\n\
    \n新一代的创业者，完全可以考虑一下，玩这些互联网虚拟暴利项目。几乎没什么成本，但利润超级高。\n\n只要人们发自内心的需要一个产品，那么这个产品就一定有市场。根据这个思路，实际上大家可以挖掘出来很多虚拟的项目。\n\
    \n对于创业者来说，刚刚奋力拼搏的时候，是会很痛苦的。但有了结果的时候，人就会很开心，进而进入拼搏起来也很享受的状态。我现在就进入了拼搏起来也很享受的状态，我希望广大创业者们也能快速进入这个状态。\n\
    \n## 新时代的市场经济管理模式\n\n看到很多老板还在用几千年前秦始皇创造的管理模式，即中央集权的管理模式，我就心疼这些过时的老板。\n\n这种管理模式，就是老板自己当头。老板下面设几个部门，比如，营销部，市场部，生产部，人事部。每个部门都有自己的经理，然后，老板就带领这几个部门打仗，赚钱，指挥这几个部门行动。\n\
    \n这种模式，在现代自由社会，只会把老板累死。因为，大家都越来越聪明，市场竞争越来越激烈，分工越来越精细，老板不可能又懂市场，又懂顾客，又懂生产，又懂财务，还懂人事。\n\
    \n而且，人的自由意志在不停的觉醒，特别是90后参与到社会中来工作的时候，特别是玩知识经济的企业，很多人都是本科毕业，大家都不愿意听老板指挥。老板又不是皇帝，又没有军队，就发点工资。只有没什么叫的人、找不到工作的人，跟着你混，没有办法了，才听你的。这种中央集权的管理模式吸收不到优秀的人才。现代人，都不服管，不喜欢被管。\n\
    \n那么，我的市场经营管理模式是怎么做的呢？\n\n在企业，所有员工不必要听我的指挥。你为谁工作，你就听谁的指挥；你服务那个部门、哪些员工，你就听谁的指挥。在这个过程中，谁服务好自己的对接部门或者个人，谁服务的好，谁就升官。也就是你的市场在哪里、你的顾客在哪里，才是你关心的，你不用关心我这个老板想什么了。我也不会指挥你干什么。大家也可以民主选举，你部门的几个人，可以直接选一个你们认为带着你们能赚更多钱的人来当经理，我批准了就可以执行。\n\
    \n这样，人事部的人就只会一心一意的去服务那些要人的部门；财务部的人，服务于公司的每个员工；市场部的人，服务顾客；生产部的人，服务市场部的，他们要什么产品，你就生产什么产品。公司就自动运转了，不需要我再安排他们做什么工作。\n\
    \n我呢，只负责把几个部门的经理叫到一起coming开开会，调节调节矛盾，我也服务于这几个经理。\n\n我发现，这个样子，大家的工作积极性变得很高，每个人都有成就感，每个人都主动发挥自己的智慧。我反而轻松了，而业绩居然比以前我自己吭哧吭哧的带队指挥高出一大截。\n\
    \n后来我读经济学，才知道，以前的管理模式，纯粹是计划经济的管理模式。而现在我采用的这种管理模式，是市场经济的管理模式。\n\n一般情况下，市场经济都强于计划经济，那么把这个思想用到管理上，也是通用的。\n\
    \n## 中国目前创业环境的变化以及趋势\n\n目前，我们国家是鼓励创业的。在国家的政策与西方国家、日本等国家对中国的态度，以及社会意识形态的发展、实体经济衰落、互联网、移动互联网的崛起、金融体系的开放、房地产的瓶颈等等多种社会因素的共同作用下，市场已经发生了翻天覆地的变化。这些因素不仅仅塑造了新的行为，而且也提供了不少新的创业机会与挑战。\n\
    \n我觉得主要的创业环境变化，以及趋势，体现在如下9点上面。\n\n- 第一：网络信息技术的发展。互联网特别是现在的移动互联网创造了崭新的信息时代。我们能够更加精确的为用户生产产品，甚至定制产品。社交网络的发展，\n"
