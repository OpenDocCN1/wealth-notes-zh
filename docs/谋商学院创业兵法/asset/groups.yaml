  - '[PAGE 148]


    情，也要为自己买房，买车奋斗。老人一看到新人业绩起来了，受到重用，他们怕自己的利益受到威胁，也会再一次鼓起劲来拼，要不立马就会被淘汰。


    历史上成功的皇帝都是这个玩法，所以，宰相啦，高官啦，立锥将军啦，几年就会换一波新人上来。想发展好，永远不能用一批人跟皇帝走 20 年，不同的时期必须用不同的人。


    员工不可能跟老板一样非常有激情，还能持续 30 年，所以最厉害的公司，一定是天天招聘的，铁打的营盘流水的兵，不断淘汰激情不在的员工，把他们放到社会上去，不断吸收那些初生牛犊不怕虎的人，来打江山，来开拓市场。


    除非真正核心的几个人非常有激情不用换掉以外，其他的人，都要三五年一换。阿里巴巴已是换人非常频繁的一个企业，不管多大的 官，包括 CEO 几年就换掉!华为呢，是用轮值
    CEO 的策略在做。基层就是是不断放弃老人，逐步吸收新人，把新人放到重要位置上去。这其实跟烧柴火一样，燃烧掉的木头就成了灰，需要不断的添加新的木头，火焰才会越来越旺盛，把燃烧掉的木头扔掉。


    李世民，康熙皇帝，都是用的这个策略：刘邦，朱元璋，也是用的这个策略。


    飞鸟尽，良弓藏，狡兔死，走狗烹，敌国破，谋臣亡。


    不是当老板的狠心，而是你没用了，就必须把你干掉，换有用的上来，不同时期，有不同的任务，就必须上不同的人，只有这样，企 业才能健康，持续的发展。


    尤其是高速发展的创业公司，每个人的梦想大小都不一样，'
  - '[PAGE 149]


    但创 业的时候大家走到一起了，有的伙伴就是为了买房，买车，存款 50 万就行了。这个目标，稍微发展快点的公司，3 年就实现了，没实现目标前，伙伴们很拼，一旦实现了目标，他的心思就不在工作上了，就要去吃喝玩乐。比如，我就有个伙伴，才赚了几个小钱，但心思已经不
    在工作上了，到处吃喝玩乐去了，这种人，必须坚决换下来。让没吃饱的饿狼顶上，企业才有发展的新动力。


