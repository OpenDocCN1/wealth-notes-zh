    境，也不能够为父母提供一个有保障的晚年。甚至他们晚年的时候疾病缠身的时候，你也只有在旁边看着！不是你孝顺，而是你没有资本孝顺。这其实是大多数中国人的写实，与道德无关，现实如此。


    所以，为了获得有尊严的生活，在我们年轻的时候必须学会赚钱！必须清楚每个人都有这样一笔账，你必须算清楚。


    # 赚钱，必须了解钱的性格


    地球上从来不缺钱，当今社会，电子货币满卫星飞，满互联网飞，支付宝，微信，财付通，各种网银，各种资本，投资人，基金。


    这些钱 24 小时不停的在寻找着谁需要他。然而奇怪的是，大部分却非常贫穷，努力挣钱却得不到。


    现在，我就来谈谈钱到底在找什么人。而你只需要成为这样的人，钱就会向你飞奔而来。


    司马迁讲，天下熙熙，皆为利来，天下攘攘，皆为利往。司马大爷的意思是，所有的人都是为了钱。我先讲我们如何待员工，我们才能成为牛逼的老板？


    +   1. 你必须给员工高额的回报。比如公司一年赚了 100 万，你拿 30 万来分给你的两个骨干，一个人 20 万，一个人 10 万，如此，这两个骨干就会在来年更加拼命的干。于是你来年就可以赚到
    200 万，你就可以拿出 60 万来分给骨干，一个 25 万，一个 20 万，一个 10 万，一个 5 万。如此，你又多两个愿意跟着你拼命的人。你就如此周而复始的干下去，跟着你的牛逼员工就会越来越多。


    +   2. 你必须让员工有安全感，承诺给员工的钱必须兑现，你也不能够去要求员工干违法的事情，否则，员工不安心，就要辞职。'
