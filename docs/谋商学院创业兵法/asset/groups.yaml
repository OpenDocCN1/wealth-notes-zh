    种能够增加你们技能和能力的事来做，要技术含量，可持续发展，谓之事业。


    若干年前，去批发 IC 卡来卖，去做黄牛党。你做十年二十年，能有什么长进？能积累到什么？这种生意来钱快，没什么门槛，全靠认识几个内部人士，政策一变，或者那几个人退休了，你马上就完蛋，后半辈子靠什么养活？再去卖烤白薯，糖炒栗子？


    人家一开始卖炒栗子的已经变成三只松鼠了，一开始卖卖辣椒的已经变老干妈了，一开始卖煎饼的变成皇太吉，你们呢？


    财富和优势都要靠积累，可持续发展的模式会让你们越来越有信心，反之短平快的项目，大学生兼职去做一下还可以，以此作为事业，就会出现“王小二过年，一年不如一年”的景象。


    当你们的利润开始萎缩，你拿什么激励大家？就算是世界上莫厉害的大忽悠，希特勒，第三帝国的军队在莫斯科郊外开始吃败仗的时候，他的团队，想得最多的不是反败为胜，而是刺杀他。


    人人都只会锦上添花，如果我们的生意不能越来越红火，不进，其实就已经是败了。


    总结一下：首先，你要找到一个你有把握能赚钱的项目，其次，这个项目越小越好，要游刃有余，再次，你这个项目要能积累经验与优势，不做没有积累性的项目。


    # 什么样的项目可以利润暴增


    我问过很多人一个问题：你怎么让你的项目快速赚到很多钱呢？让你的利润暴增呢？


    做网络项目的人一般会先说，我使劲推广，延长工作时间，多发'
  - '[PAGE 84]


    贴子。多吸引粉丝，团结一切可以团结的力量，与人谈合作，对吗？对，不过只对了一小部分。


    大家首先要有个概念，不是所有的项目都可以实现利润暴增的，不是所有的项目都可以快速赚大钱的。所以开始做项目的时候，就要判断好这个项目有没有发展前途，而不是只要是个项目，就支干，干了几年，又赚不到大钱，扔掉又舍不得，搞得食之无味，弃之可惜。比如你在菜市场卖菜，你就不可能利润暴增。因为大家都是卖菜的，都睁大眼睛盯着你呢，你能玩出来什么花样？


    现在的淘宝，你也很难实现利润暴增。因为别人看到你利润暴增了，马上就复制过去做了，结果是大家都赚不到什么钱。


    我们在这里就得到一个结论，容易被复制的项目，不能实现利润暴增。所以项目的唯一性非常重要，这也就差异化战略。


    选择项目第一点：项目要具有唯一性，当然这一点很难做到，但你至少要选择很难复制的项目去做。比如卖地方特产与卖全国到处都有的东西比起来，显然卖地方特产有优势。


    第二点：项目能够招商加盟，可以低成本快速辐射全国，一但样板打造好了，就能快速招商加盟的项目，就是好项目。比如培训，在线教育，卖软件的等等。


    第三点：项目要有可控性。最核心的东西永远掌握在自己手里，只有你才能对项目独掌乾坤。假如你这个项目有 10 个环节，你可以告诉别人 9 个环节，最后一个环节要么不告诉别人，要么要让别人知道也做不了。也就是说，自己必须打造核心竞争力。比如，我卖我的创业咨询，创业培训，虽然有人做我的代理，但是他复制不了我，别人就认定要我。再比如，苹果手机他是个封闭的苹果系统，'
  - '[PAGE 85]


    别的手机厂商就复制不了，他们只能复制安卓手机。所以苹果手机就极度具有竞争力，而安卓机就只要打价格战，因为太容易复制了。


    第四点：市场空间比较大，可持续发展，坚决不做市场小的项目。


    天花板摆在那里，你能难做到利润暴增。


    第五点：要建立一套分钱机制，要团结别人，就必须给别人分钱，有的人，舍不得到手的票子。那么别人就不会跟你干，你就做不大，做大了就能玩规模经济。


    第六点：系统化，程序化，自动化。


    系统化就是说，你这个项目是一个完整的系统，对我们自己来说容易批量复制。建立分公司程序化就是说，写出规章制度，普通人招聘过来，看看规章制度就直接能根据你这个程序开始操作这个项目，自动化，实现自动化，就是要求你这个项目打造好了过后，你就可以腾出手来做其他重要的事情，不必要天天爬在这个项目上面。


    第七点：必须建立自己的文化品牌，让项目有文化附加值。才能卖个好价钱，可以通过网页加微博加微信公众号加贴吧加电子书加视频来树立文化品牌。建立公司论坛。


    让别人了解你这个老板喜欢读什么书，有什么性格，喜欢喝什么酒，与什么样的人在一起玩，做什么样的具体事情。比如你们去看郭敬明的微博，就会发现他非常重视建立自己文化品牌，展现自己的个性，衣食住行，家居摆设都被他展示出来了。这样，他的文化品牌就深深的植入到了关注他的人的头脑中，他就可以获取高额附加值。'
  - '[PAGE 86]


    # **5个步骤网络创业**


    网络创业 5 步骤。


    第一：先选好一个项目。如何找到好项目呢？有五个步骤。


    +   A. 加很多 QQ 群，微信群，去看看别人发的什么广告，一个广告就是一个项目。


    +   B. 去网赚论坛看看，网赚论坛上的人都再玩什么项目。


    +   C. 去 58，赶集网看看别人发的广告，大概了解一下哪些项目你能做


    +   D. 去猪八戒网，那里有很多人发任务，你可以试着去接接任务，做一做看看难度，自己有能力搞得定的，就可以发展成一个项目。


    +   E. 去慧聪网，淘宝网看看那些批发价 1 块钱到了 10 块钱的项目，那些可以高价做营销来卖。做做 OEM 贴牌，里面的机会也不少。


    第二：找到了项目，就开始挖掘具体的案例。挖掘同行具体案例有二个步骤。


    +   A. 加入同行的 QQ 群，微信群，搜索其 QQ 号，手机号，公司名称，找到案例的网页广告。


    +   B. 在百度，微博上搜索同类项目的网页。


    挖掘项目这一步很重要，你至少应该通过网络找到 100 个同行，才能进行好下面的步骤。第三:找到了很多同行后，我们就开始复制这些成功的项目。


    +   A. 谁赚的钱多，业务流程简单，我们就复制这些成功的项目。'
  - '[PAGE 87]


    B. 谁的广告好，软文好，段子好，就杂交谁的。


    第四：如果前三个步骤你都完成得很好，赚到钱了，那么你就可以执行第四个步骤，组建团队。


    A. 创业组建团队，只招聘有推广经验的人，赖售经验的人。


