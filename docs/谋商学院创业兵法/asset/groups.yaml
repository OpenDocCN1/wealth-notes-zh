    你看我一把年纪了，最感兴趣的生意，不是什么跨国公司，不是什么世界 500 强，恰恰是卖烤白薯，臭豆腐什么什么的一因为这些生意小到全无压力，可以自由发挥，而且，做砸一百次都会不造成心理阴影，我只找那些极小的小生意来做。


    三、选择能够积累经验的生意。


    什么意思呢？就是说年纪不小了，不要捞偏门了，你得选择一'
