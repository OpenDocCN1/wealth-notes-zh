    拉里佩奇。等等，还有很多上市公司，58，赶集，京东百姓网，哪个不是互联网出来的巨富。就我自己去过的一些证券公司，黄金公司，办公室装修公司，医疗集团，以前都是靠电话销售，现在都转向了互联网营销。


    而从事这个行业的人，基本上拼搏半年，月薪从 4000 到万大有人 在。如果你像我一样，搞明白了玄机，自己组织个团队单干，如果你不是笨得出奇的话，赚点小钱花光，还是能办到的。


    # 生意人就是要赚钱只要不违法就行


    企业存在的基础与目的是什么？答案非常简单，企业存在的基础 孩爱钱没花完，哪怕是风投或者是借来的钱。那么风投投给你钱，或 许借来的钱，是用来做慈善的吗？肯定不是，而是用来赚钱的，企业的目的必然是赚钱。


    现在很多成功的企业家，还有一些写书的人，喜欢误导大家，说 企此的存在是为了解决就业问题，为社会做出贡献，等等，这都是扯 淡的事情，或者说，企业的存在，必然会解决部分就业问题，必然会
    为社会做出贡献，但这不是目的，这仅仅是顺带的事情。


    如果企业不赚钱，没有利润，企业必死无疑，只是早死，晚死的 问题。所以创业人头脑要清醒，不可以被那些成功的企业家，写书的 人骗了。一开始创业，就定出了一个错误的目标。


    我以前有一个朋友，开了一个电脑店，就是闹不清楚做企业的目 的，而把那些成功的人拿到嘴上说的做企业的方针当成'
  - '[PAGE 120]


    了真理，搞得 自己狼狈不堪。


    这个家伙呢，人品很好，做朋友够哥们。结果就是，我们 这些好 朋友找他买电脑，他从来都是一毛钱不赚，他那个电脑 店，生意本来 就不好，朋友介绍过来的朋友，他也不好意思赚
    钱，结果大家猜到了 吧，他倒闭了。


    我一直劝他，朋友的钱为何不赚？生意就是生意，做企业， 必须赚钱，凡是偏离了这个目的，不管你的理由多么伟大光明 正直，都只能说诔而已。不可把伟大光明正直的理由当成生意
    的指导方针。


    其实，我再深入一点讲，做生意，连诚信，都是伪装的， 连对人们有好处都是伪装的，大家以为脑白金的成本是多少钱 一瓶啊？真的能延年益寿吗？各个电视台的部分广告到底是夸
    张的手法呢？还是直接就是欺骗？网络游戏对青少年的到底 起到了正面作用，还是负 用呢？聪明人已经知道答案了，我就 不多说了，但这些企业都活得非常滋润，赚取了大量的暴利。


    所以我这里，只给出一个结论，企业存在的基础目的就是 盈利，只要不违法就行，凡是给我扯其他目的的人，都是做企 业还没入门的


    人，或者是居心不良的人。或者是脑袋糊涂的人，这样的 人来做企处，就必須得倒闭。


    # 适应社会而不是改变社会


    我们要适应社会而不是改变社会。“如果李嘉诚也身无分'
  - '[PAGE 121]


    文了，我们与他有什么区别呢？”我想，李嘉诚一定会找出好的方法重新发展，其实李嘉诚本身也是从一个非常穷的人爬起来的。人与人的区别


    在于思维方式和内含的不同，一个问题你想不通，解决不了。而别人跟你一样的资源，但是别人换一种思维方式，或者是有经验，就能想通，想透彻，解决问题。


    从这个角度讲，人只要不断的学习成功人士的思维方式，经验，精神，你就会变得越为越成功。


    人在社会首先要了解自己，了解社会，适者生存就是自己要适应社会，而不是社会适应自己，因为，一个人要改变社会太难，就是光绪皇帝也没做到，社会是许多人用一段时间改变的，改变也可以是好的方向，可能是坏的方向。


    聪明的人从来不试图去改变社会，所以取势、明道、优术，取势排在第一位。就较顺应时代的发展。看现在社会上呼风唤雨的大企业，陈天桥顺应了游戏，马石顺应了电子商务，该下海经商当倒爷的时候，就去倒。该做房地产的那几年就去干建材，该做网商的就去做网商，现在我认为正到了玩垂直电商，社群电商，和传统企业互联网化的时代了。


    取取好这个势，自然就发家致富。还有一个势是文化产业，精神产业也马上就蓬勃发展的。大家也可以参与进来，万达的王健林就在进军文化地产，体育，娱乐等产业。王思聪在玩电竞，春江水暖鸭先知，大家可以把这些大商人当成风向标来指导自己创业。'
  - '[PAGE 122]


    # 为什么很多街头混混当了老板


    为什么很多读书成绩好的人都去打工了，为什么一直在思考人生方向的人，基本上都没啥出息。而那些街头混混却成了老板，那些看似没什么远见的人，却拥有不错的事业。


    其实道理很简单，因为街头混混的口诀就是：先干一票，弄点吃 的再说。典型的先生存下来，然后在做打算的理念。


    其实我们有创业经验的人，就明白，我们做计划，想策略，拿到 市场去用，根本就行不通，因为市场变化太快，经常出现，计划的 A，做着做着就变成了 B，以为能在 C
    处赚钱，结果是在 D 处发家。所以创业根本不是计划出来的。而读书成绩优异的人，成天思考人生方向的人，总是想有一个完美的计划策略去做事，这就导致这些人做不了老板。


    我现在招聘时候，想选一些优秀的人来带领项目组工作，最怕就是碰到一些高材生，问计划，问策略，因为赚钱这个事情，就没有真体的套路，我要的是给他一个大方向，他就直接去干，然后能赚钱的天才；我不需要一个只会按照计划书照本宣科的执行者来带领团队。我发现很多高端的人才根本就理解不了创业精神。


    我们创业的人只想解决眼前的生存问题，没有功夫去想人生方向， 也没有时间去做什么计划，通常更没有时间去思考：谁对不起谁，工作有没有不愉快，累不累等问题。我只有一个想法，赚到钱，活下去，
    走一步看一步。


    后来当我读邓小平文选的时候，我忽然发现，伟大的邓公也是这 样一个思路，就是摸着石头过河。做开创性的工作，是'
  - '[PAGE 123]


    根本不用计划的，就是走一步，才看下一步，看到了一步，再走一步。


    这是成功创业的思维模式，希望大家能理解。


    # 学错知识比吃错药还倒霉


    “回”字有四种写法，是当年孔乙已先生用以炫耀的知识。只是可惜，这知识于贪茴香豆吃的孩子们无益，于他自己也无益，即便是 我这个跟文字打了 30 年交道的文化人，至今尚不清楚那四种写法，却也并不觉得怎样遗憾。而且，我也不会去研究如何写。


    在我的世界里，只有两件事，读书与转钱，赚钱是为了读书，读书是为了更好的赚钱，果要活生生的加上其他事情，大概就是有足够的财富了过后，带着家人欣赏世界吧，我目前的一切精神，都集中在做企业上面，我认为做企业简直季度好玩。


    我们经常电视台看到这种知识考题，“世界环境日是那一天？”这是中央电视台全闯青年歌手电视大赛上的一道“文化考核”题，参加歌手解答，由某学者讲评。以前读小学的时候，总是觉得能回答上这些问题的人很牛逼，现在，我却觉得这样的人是白痴，而且，这种问题能回答出来，根本不能说明这个人就是优秀的人，反而误导了我们这些小学生，认为应该去死记硬背这些知识。有时候还打击了我们小学生幼小的心灵。认为自己很无能，怎么什么都不知道。'
  - '[PAGE 124]


    不知某学者作何感想，反正我看了这题，只是感到哭也不是笑也不是，至于讲评，我想倘若换了我，我会告诉那位歌手：这个问题，只需从事环境工作的专业人士知道即可，而且也算不上什么文化考核，因此，你作为歌手，不知道也罢，是不应该扣分的。


    至于这个大赛的其他“文化考核”题，如“世界三大短篇小说家都是谁”，“‘人生自古谁无死’是谁的诗句”，“莘莘学子是什么意思”“某某节何时在巴黎确定”一类，虽然不能说与文化无关，但对于歌手来说，不知道这些，也没什么了不起的。那坚己经成了名的大歌唱家，请他们也来答答试试？你总不能因此而指责他们没文化吧。


    不客气地说，倘若让我来出题—就出这类题’来考考这个大赛的出题人，我要是不把他们个个考得汗流浃背，恨无地缝可钻，就算我小时候那几天书白念了。


    因为：


    一、这种题的偶然性太了大，回答正确的几率本来就不高；


    二、这种题，对于许多从事其他特定专业的人们来说，他们平时根本就没有必要注意；


    三、最最重要的是：这种题的答对与否，并不能反映答题人文化素质。


    由此，我便想到了这样的一个问题：在知识爆炸的当今社会，我们有没有必要、有没有可能，把人类创造的全部知识，统统地塞进自己的大脑？如无必要、无可能，那么，我们应该进行怎样的取舍或选择？'
  - '[PAGE 125]


    一般而论，人们认为我们的知识结构应该是由下面两个部分来组成：


