    智，不要废话，直接给具体的结果，来应聘的人一旦听到了结果，他就立即记住了，并且会有一个判断到底加入不加入。其实对公司的历史，公司的未来都没有必要谈，因为这些总是忽悠人的感觉。现在的人都认为自己很聪明，对这些比较抗拒，谈颇多，加入的可能越小。


