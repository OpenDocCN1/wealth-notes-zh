    # 第九章


    # 如何做好产品销售


    # 我的 27 条做营销的心得


    +   1. 顾客是最好的老师，时时刻刻研究顾客。同行是最好的榜样，谁赚到钱了，你就抄袭他，他怎么做营销，你就怎么做，他怎么做广告，你就怎么做，能弄到钱就行。市场是最好的学堂，关注市场，少听学院派纸上谈兵。


    +   2. 信赖感大于实力。销售的 97% 都在建立信赖感，3% 在成交，我卖出去很多不是行业第一的产品，而价格却能卖的奇高，有时候连我自己都不相信这是真的，但因为与客户建立了信任感，客户就买单了。很技术派，学院派的人认为产品好才是硬道理，我认为，多于客户接触才是硬道理。就如同你吃你妈做的饭很放心，而你吃那个五星级大饭店里大厨烧的饭菜，总是会怀疑素菜是不是打了农药，肉类是不是有很多激素，卫生吗？这些问题。所以，顾客买单信赖感第一。


    +   3. 当你学会了销售和收钱，你不想成功都难，刚开始创业的老板第一要学会的就是销售与收钱，马云最开始都是亲自一家一家的去敲企业的门做销售的；拒绝做销售的人，很难做好老板。


    +   4. 拒绝是成交的开始。被 99% 的顾客拒绝都很正常，100 家里面有 1 家买你的产品，你就富可敢国了，很多人被拒绝 10 次就受不了了，这也太幼稚了。销售就是零存整取的游戏，顾客'
  - '[PAGE 247]


    每一次的拒绝都是在为你存钱，并不是说，顾客拒绝你，你的工作等于零，而是你放弃了，就等于零。


    +   5. 要从赢得客户信任、改变客户观、用故事洗客户的脑、讲利益、讲他不买会有什么损失等负面，对客户进行一个十面埋伏的营销体系。创造让客户不可思议、不可抗拒的营销方案。


    +   6. 销售是把你产品信奉传递给客户的一个过程，所以，你自己必须得相信你的产品或服务值钱，用情绪去感染客户，锻炼好身体，持续不断的说服顾客；谈判是决心的较量，你必须相信他就是会买；成交是意志力的体现。


    +   7. 仅仅是把货物卖出去不算完成销售，必须把钱收回来才算销售完成。


    +   8. 一定要给客户讲有含金量的东西，一定要学会创造价值，为顾客创造他需要的价值。客户认为了，自然就买单了。


    +   9. 所有的一切事物，都要学会去链接。感情的关系大于利益关系 和合作关系，要与顾客有深层次的情感交流。把一切美好事物都链接 到你的产品与服务上去。


    +   10. 顾客买的不仅是产品本身，更买产品相应的及额外的服务，多宣传宣传你会提供什么额外服务。


    +   11. 不要得罪人，只管赚钱。做销售不要与客户发生矛盾，就算你碰到很不礼貌的顾客也不要与其发生矛盾。


    +   12. 你永远没有第二次机会给顾客建立自己的第一印象。所以，随时随地保持好自己的好形象。顾客不会在一个看起来就很讨厌的人哪里买单的。'
  - '[PAGE 248]


    +   13. 销售等于收入。这个世界上所有的成功都是销售的成功。当你学会了销售和收钱的本领时，你想穷都穷不了。


    +   14. 做业绩千万不要小看每个月的最后几天，这好比是 3000 米长 跑，当你跑完 2700 米时，最后的 300 米犹为重要，最后几天是最容易创造奇迹的时刻。


    +   15. 没有卖不出的产品，只有卖不出产品的人；不是市场不景气，只是脑袋缺思路，多学同行，多跟赚到钱的企业学习，你自然前途就光明。


    +   16. 一流推销员卖自己；二流推销员卖服务；三流推销员卖产品；四流推销员卖价格。


