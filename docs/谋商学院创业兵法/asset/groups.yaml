    ## 创业太有意义了


    创业虽然艰难，但我从来没有后悔，创业太有意义了。创业确实会很碰到很多困难，但我们需要把这些困难当成享受，其实解决一个困难，就相当于丰富了我们的人生。


    其实我甚至偏执的认为，每一个人都应该创业，每一个人都应该努力的去做好自己心目中想做的那件事，这样一辈子才没白活。而你在别人的企业，很难找到这样的一件事，是你心甘情愿，非常想做的事，并且愿意把他当成一辈子的事业来做的事情。


    我经常建议某些人，拿张纸拿一支笔出来，写下你最想干的 10 件事，其实这几就是你的人生指南了。根据重要程度有选择性的去实现这些事情吧。


    我认为一个没什么梦想的人活一辈子白活了。而一个有梦想而不敢于实践的人，比一辈子白活的人还纠结，还倒霉。所以我的总结就是，必须去实践你的梦想。


    如果一个人不去实践自己的梦想，就算你是富二代，那么你的人生也是平庸的，也是索然无味的。


    其实很多人都说创业难，真的难吗？当然万事开头难，但并不代表这是一项非常困难的技能，是学不会的技能，其实跟学开车一样。潜心去学，只要脑子没问题，应该都学得会。别怕摔打，小孩子学走路都要摔跤，何况创业呢？但是每个人如果去实践，去摸索，都是会成功的。


    完美的人生，就是去实现自己的想要实现的梦想，我喜欢创业，希望大家也喜欢创业人生。


