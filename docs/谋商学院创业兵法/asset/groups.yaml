    那我冲里面摆！老人又告诉你，也不能这样摆，因为半夜里哪个“好朋友”路过，一看：这里有双鞋，穿上试试。再一看，咦！床上还有个人，等我玩个附身。完了完了，你又被鬼压身了。


    那该怎么摆？我告诉你：一只冲左，一只冲右。这是什么意思？我们的目的，就是要让半夜路过的那个朋友，不知道这是什么意思。也让你的三魂七魄没鞋可穿，这样你就安全了。


    对了，这个睡觉之前鞋怎么摆就是一个仪式化。大家这下被我种下了这个种子，以后睡觉就得把鞋子一只冲左，一只冲右。否则，鞋尖外摆，晚上三魂七魄就穿上你的鞋子跑出去了，你小心他不回来了。大家鞋尖向里面摆，后果就是：“半夜路过的朋友”，一看这里有双鞋，穿上，然后看床上有个人，就会上来玩个附身。完了，这下就会被鬼压身。你的鞋子没摆好的话，赶快下床去摆好。我已经告诉你了，要一只冲左，一只冲右。


    你会说，我很牛逼，人挡杀人佛挡杀佛，怎么还会信这个？我才不会被你吓到呢！我是无神论者。听我细细道来，你就明白你必须信了。


    你不信，但是你的潜意识会信。当这套离魂和鬼压身的歪理邪说感染了你的意识之后，在你清醒的时候你不怕，因为你的意识可以凌驾在你的潜意识上。但是，当你睡着了以后，潜意识就会活跃起来。


    你的潜意识是不具备分辨能力的，如果我睡觉之前没有按照这套仪式来摆放拖鞋，那么我的意识就会组织起很多素材来让我睡不安稳。


    比如前两天我四点就醒过来了，因为做了两个梦。


    **梦境一：大战僵尸。**


    说实话僵尸我不怕，在梦里都不怕，可怕的是，这些僵尸离我只有几米的距离，而我得用狙击枪打。


    狙击镜这个东西呢，你一打开就只能看见很小的范围，左面右面后面完全看不见，而僵尸却是从四面八方冒出来的，所以当你瞄准僵尸的时候，就会害怕周围冒出僵尸来，这还不算完。


    这个梦里面，地上有很多狙击枪，各式各样，但是，枪里有多少子弹是未知的，有可能有一颗，有可能有五颗，有可能是空枪。枪总共只有几把，但是僵尸却源源不断的从楼道、走廊里冒出来。这就造成第二种恐惧，你的子弹远远不够用，而且你没法算着用，因为你都不知道有多少。


    打到最后，冒出一只“僵尸王”，我连爆了它五次头，他没死，万分危急之际，我醒过来了，一看表，四点。醒过来一想，这是要玩死我啊，知道单凭僵尸吓不倒我，还给我设计了三个困境。


    **隔天，又做了个噩梦，是这样的：**


    梦见我开了辆车，拉着一车人。本来路是很熟的，但开着开着，拐过一个弯就变成晚上了。


    路上一颗灯都没有，汽车的车灯跟蜡烛一样，开了十来分钟，越来越恐怖。


    你说，这又有什么好恐怖的？这个场景用语言来描述不恐怖，但是当你身临其境，在一条黑漆漆的陌生的完全不知道通往哪里的路上开车，前不见村后不着店，仿佛永远没有尽头，你的心就会慢慢沉下去。最后，这种压抑会突破你的心理极限，让你无法承受。


    醒过来一看，又是四点（跑题一句，大脑复杂的人做噩梦都跟常人不一样，特别消耗卡路里）。所以，仪式化这个东西，虽然看起来很简单，甚至很白痴，但其实很管用。你听了我这套说法，你也就被这种病毒感染了，即便今天它还无法影响你，但是它在你的意识里埋下了一颗种子，总有一天你睡觉之前，肯定会想起我的话，把鞋一左一右的摆，要不你就睡不安稳。


    大家已经被我种下了仪式化的种子，就被我营销了，大家总会想起我，你们最好把鞋子一左一右的摆，否则要么三魂七魄回不来，英年早逝，要么鬼压身，大家看着办吧。


    ## 如何把自己宣传出去


    每个老板，都要宣传自己到底能为用户提供什么服务或产品。也要宣传自己的理念、价值观、思想给自己的团队，甚至给用户。


    我给出我的宣传经验。


    把要推销这个概念从自己头脑中拿掉，要把说服人这个概念从自己的头脑中拿掉。不管是企业内部，还是外部，人们都自然而然地抗拒推销。要用分享你的观点、分享你的服务的理念去做事，目的是帮助对方改善生活，以帮助对方的出发点，去宣传你的理念、你的企业文化和你提供的服务。


    永远把他人的利益考虑在第一位。


    习惯性地宣传自己的理念。比如，我经常在公司里面宣传我的理念：努力工作是一种才华。我只是分享我的观点，并没有推销，但这给其他员工树立了榜样，表明自己是一个斗志昂扬、全神贯注的老板，直接增加了自己的领导力。


    经常与员工闲聊，或者在 QQ 上发表说说，在微信上发表动态，这样员工知道我的心理状态，也就知道我的理念。潜移默化地影响员工积极工作，拼命奋斗。


    比如与同事一起出去用餐的时候，我也会分享一些心得理念，有助于修正团队的理念。虽然不是讲的工作上的事情，但都是积极正面的东西。从侧面也调整了同事的心理状态，工作状态自然就好了。所以，我经常说，“老板必须是一个社会学家，也必须是一个心理学家。”


    还可以组织共同的读书会，一起读一本书，然后分享观点，在分享的时候，就可以夹带私货给员工。


    要有习惯写日记、写演讲稿、写材料，这样，自己的条理就越来越清晰，讲话也越来越有深度。更加有利于宣传你的理念给员工或者客户。


    只讲有对人有帮助的话，你的话对人没帮助，宁愿闭嘴。没有什么有价值的话讲的时候，就算大家请你讲话，你也要委婉地推掉，所以，平时的积累很重要。


    多读故事书、历史书，或者提炼总结自己碰到的有趣的故事，讲给大家听。优秀的宣传者是一个优秀的“说书人”，人们最喜欢听故事。你可以通过故事把你想传达给员工的思想传达出来。你可以专门挑选特定的故事、特定的人物给大家分享。


    洗脑是在无形之中完成的。宣传思想的时候，要注意跟你的听众互动、沟通，别只会蒙着头自己讲。与大家不断的互动，大家才感兴趣，而且会迅速提高认可度。


    每次要宣传一个理念的时候，记得自己在办公室里演练20次，自己又当听众，又当宣传者，来回切换角色体会，务必一次把理念灌输听众脑袋里，对他们产生根本性的影响。


    宣传必须有娱乐性、有趣味性，别板着脸，谁也不喜欢看板着脸的老板。如果你板着脸，你讲得再有理，听众也听不进去了。但如果你能让 大家笑，他们就会侧着耳朵，集中精力听你讲，生怕没听清楚或者是错过了什么，所以，多培养自己的幽默感。


    必须讲真话。现在我们中国很多人有毛病，说话都躲躲闪闪的，不敢讲真心话，讲话不讲到实质上，是没有人感兴趣的。


    ## 附录一


    ## 我是如何成长的？


    不断地写文章，肯定会让人变得聪明的。不断地阅读，人就越越来越有料，要强迫自己独处。


    在一个办公室里，静静地看书，然后总结。思考的范围就是商业，就是管理，就是如何降低成本，提高利润。


    公司的经营重点就是提高效率。思想越简单、越单纯越有前途。


    公司招聘的管理人员，先做助理，该教育的教育，该培训的培训。思想太烂的、培训不出来的，早点请他走。


    我非常反对招聘一个管理人员就直接给他团队管，风险太大。我只提拔我熟悉的人，我们这种人，只做有把握的事情。


    永远积极向上，把失望、悲伤、沮丧的力量都转化成奋斗的力量。一个人可怜，其实就是因为没有钱，没有事业，没有地位。


    而地位、事业、金钱，都是靠工作获得的。别说你是富二代、官二代，你若自己不奋斗，没有积累到经验，其实你的社会地位、金钱都非常不靠谱，靠山一倒，一不小心就回到解放前了。


    每个人想成功，都要经历痛苦，没有人可以例外。我当年做业务员，也非常不习惯去递名片，我痛苦，我销售的对象也很痛苦。但是因为我不断锻炼，现在，被我销售的对象也都心服口服，也很开心。


    我写文章也是如此，开始的时候，哪里写得出来嘛？但是我相信马云先生的那句话，“永不放弃”，写着写着就找到感觉了。


    我最近招聘了一个学金融的研究生，让他给大家讲商业故事、讲历史故事、人为什么会成功？理清楚了历史上这些牛逼的人物，我们也就知道怎么干了。一个人迷茫，其实就是不知道怎么解决问题，甚至都不知道问题在哪里，就应该不断的学习。


    人只可以通过学习改变命运。学习其实就是人的第二生命。


    我的语音课讲不好的时候，就是我没有备课的时候，或者是当天阅读量不够的时候。所以，人必须时时刻刻地准备着，做事业的人，一刻也不能松懈。


    社会竞争激烈，那些松懈的人、不能坚持下去的人永远也不能成功。最近我指导了很多人的创业，其中有一个人的本来打算放弃了，不过他经常听我的录音，又坚持了下去。现在收入起来了。我看到很多其他的学员问他要方法，其实，方法这些我都讲过。我们那个成功的学员说，“我就算给你们方法又怎么样？只有坚持下去才有意义。”


    经历的事情多了，我不怎么相信一个人说话了。我知道，大部分人说话等于放屁，因为他执行不下去。我也不太喜欢人的看似脑袋很灵活的人了。毕竟，讲一个理论与方法很容易，做起来就不是那么回事了。


    当我了解的金融知识、企业家知识、投资知识越多的时候，我越来越喜欢那些穷人、懒惰者。为什么呢？其实，正因为他们懒惰，成全了我们这种人。懒惰的人一辈子都只能为勤奋的人工作，并且世界上好的东西先由勤奋的人挑。挑完了，才由懒惰的人挑，其实也没什么挑的了。


    雷军是个工作狂，比尔盖茨也是。只有工作狂，才能成功。没有人可以逃避责任，生活就是天网恢恢疏而不漏。多找导师帮助你，当然没有多少导师会免费帮助你，你应该付出金钱，天经地义。


    笨蛋总是以为导师不重要，岂不知专业的运动员都是有导师的，而业余的人，是没有导师的。别人给摸索好的东西，你为什么不花点钱弄到手呢？非要自己钻木取火？


    要习惯善待他人、善待自己，但善待并不意味着妥协。我等课讲完了，就去学习些财务知识。我需要这些知识来看待这个世界，也劝各位创业者多学财务知识与销售知识。


    ## 附录二


    ## 长期努力是成功的唯一方法


    我认为，长期努力是成功的唯一原因。很多人听我这样讲，就认为很极端，不科学。我想说的是，我谈的都是我的经验而已，我从来不想证明我科学，我甚至讨厌那些看起来、听起来很严密的理论。在我们公司里，只要谁说：“什么事情都有两面性，一件事情总是有好有坏。”我总是想辱骂他，我会让他离开，甚至开除这样的人。我最讨厌这些正确的废话，完全没有立场，简直就是孔夫子讲的乡愿。


    我们当老板的，不是理论家，我们是在打仗。我们只能选择一个判断，然后执行下去。你不能告诉我这也行，那也行，我们的选择是唯一的。


    所以，我这个人讲话就是很极端。在读高中的时候，我就发现了一个现象：成绩好的孩子总是一直在读书、做作业，从来感觉不到烦，就算周六、周日也在学习；成绩差的学生在网吧、球场，或者看小电影。有的孩子只能努力一个月，然后就坚持不下去了，这样的人就是成绩波动比较大的人。


    读书毕业后，我经历过很多工作，特别是在两个公司做过销售员，我们的销售员有几百人之多。


    哪些销售员的业绩最好呢？毫无疑问，我的结论是：最努力的那个人。最努力的那个销售员，他在办公室就是从早到晚打电话，他出了办公室就是一直在拜访客户。他真在做事，一年下来，他自然是业绩最好的。我离开那个公司的时候一年后，再回到那个公司去看他，他已经升级为经理了，而同期不努力的人要么离开了，要么还是个跑腿的。


    我从来不相信天赋，我认为任何人的智力基本一样。甚至你如果疯狂地能力工作，实际上你的智力会因为你的能力而改变。其实不是智力改变了，而是熟能生巧。我以前讲过一期节目叫卖油翁，说的就是熟能生巧。


    所以我只相信努力。我要成为最努力的那个人，什么叫努力呢？


    就是坚持对长远目标的激情，对手上的工作日复一日的干，而不是仅仅坚持一个星期或者几个月。


    我创业有三年，都是没赚到什么钱的，不过坚持过来了，收入就越来越高了。我经常对创业者讲的话是，“如果你不能做好两年不赚钱的准备，就别来创业。”


    真正有成就的人，都是几年、几十年如一日的努力奋斗着，生活是一场马拉松而不是一次短跑。


    我相信在这个社会上收入高的人，都是长期艰苦奋斗的结果。我说的艰苦奋斗包括体力与脑力的艰苦奋斗：有这么一种人，他们只会体力奋斗，不会脑力奋斗，脑力上非常的懒惰，就别来跟我辩解了。


    长期努力是成功的唯一原因。


