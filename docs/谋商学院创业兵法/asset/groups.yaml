    ## 弱肉强食是天道


    我们生意人必须深刻的认识到这个观念，才有助于我们赚更多的钱，把企业经营的更好。比如，有些人认为战争是丑恶行为，看到战争死亡的人数就觉得残忍。却不知我们每个人类每天杀的生物，比战争死亡的人数不知道多出多少倍。


    可能有的人说，这些畜生是没有思想的低等生物，死不足惜。那么等到有一天，比我们人类智慧高万倍的外星人来到地球的时候，外星人看到我们就好像我们看到老鼠一样，并决定要将我们变成他们的家畜的时候，我们就可以回想一下我们自己的立场——死不足惜。大自然也会推动一些东西的进化来抗衡人类的迅速繁衍，比如各种不同的新病菌或者不能治疗的疾病，就夺走了许多人的生命。


    吃素的人也别以为自己不杀生，因为你吃的那碗饭与蔬菜，也是要用很多农药杀死很多虫子，你才吃到的。并且你吃了，其他生物就吃不下了，他们就少了一口粮食，就得饿死。


    商人必须深刻的认识到，残忍就是残忍，不会因为我们没有文化就不残忍了，只不过残忍得隐蔽些。大自然的进化和平衡规律就是弱肉强食，竞争的本质就是一物活，一物死。没有共同存在的可能，大家看看这段时间互联网行业的兼并战多么激烈就该明白这个道理。这种残忍的定律也是源于我们的基因，就算刚出生的婴儿也是弱肉强食才诞生下来的，因为他需要击败众多的竞争者，上亿的精子要壮烈牺牲，才会有一个小孩生下来。


    假如你去很多动物园看，活鸡喂老虎和狮子的表演。你就可以体会一下老虎“气吞天下”的强者霸气与血腥残忍的场面，然后，临走的时候，回头凝望老虎，与它惺惺相惜，与它识英雄重英雄的喃喃自语：“这就是强者的天下，也是大自然的游戏规则，成王败寇，弱者不应该有任何怨言。”因为，老虎与狮子贵为百兽之王，也被我们人类征服，成为盘中餐或者玩物。


    我知道京东商城的刘强东，雅虎的杨致远，微软的比尔盖茨。都不约而同的说过，“我不喜欢输的感觉，我喜欢竞争，我喜欢在竞争中获得胜利。”这句话口气似乎狂妄，自大，但流露出狮子老虎的霸气，道出了每一个强者的心态。


    我敢肯定的说，一个强者，必须有强者的心态，必须理解这个世界就是弱肉强食，所以，每一个人都强大自己吧，因为输了，落后了轻则挨打，重则死亡！做企业，做人都是这样的。


    ## 友谊是一种投资


    怎么交朋友？有人说了，交朋友谁不会？别以为你会！你混得不怎么样，很大程度上，就是由于你根本不会交朋友，或者说是交了一帮没什么用的朋友。


    好了，废话不多说，直接上干货。首先，要明白，交朋友实际上是一种“投资”。那么既然是“投资”，自然就必须得有“回报”，那么接下来的问题是交哪些朋友，才会有回报呢？


    **第一种朋友，必须明事理，懂得互利共赢的朋友。** 这一条看起来简单，好像每个人都懂，实则，明白人很少。加上近代“打土豪，分田地”的文化影响，很多人的意识形态不是要想，自己能为朋友提供些什么。而是想着朋友比我有钱，有能力，就应该分我些。


    这是一种平均主义思想，是零和博弈。假如你有 100 万，你想创业，找了一帮朋友来帮忙，这帮朋友只想着，你很有钱，咱们都是穷人，你把这 100 万分给我们吧。如果你交的是这样的朋友，那么你再有能力，也混不好。


    我们选朋友，就是为了组成一个战斗力强的组织，群策群力，一起去寻找更大的财富，而不是脑子里都是平均主义的人。这些平均主义者，只会让他们自己赢，而你输。跟这种平均主义者交朋友，结果是你输，这种朋友会削弱老大的竞争力。


    只有老大混得好，才能大家一起发财，要是老大竞争力被削弱，越混越惨，这个组织就完蛋，如果你交平均思维的朋友，那么结局就是大家一起完蛋。


    只有选择懂得互利共赢，明事理的朋友，大家一起才能越混越好；如果选择平均思维的人做朋友，这些人都有红眼病，老是算计你比他多了多少钱，车子又比他的高档，那么最后只能“同归于尽”。


    **第二种朋友：有前途的朋友。**


    什么样的朋友有前途？一个人要有前途，具备如下几个特征：


    - 学习能力强，特别好学。


    天才其实根本不是天生的，而是后天不断的勤加练习，努力学习加实践的结果，一个人的种种能力，都源于后天的学习，没有人生下来就是赛车手，就是足球健将。学习能力要排在所有能力的首位，只要有很强的学习能力，慢慢的很多能力都会强起来。如果学习能力弱的话，注定是个废物。


    - 勤奋努力干活的人。


    这个其实非常好判断，一个人如果勤奋努力干活，必然会在某方面越来越强。而一个人如果你发现一个人如果没什么特别的，其实就可以判断，这个人根本不勤奋，只要勤奋的人，都会有某方面比一般人强些。而一个没什么特别的人，可以说他一辈子都不会有什么机会，人是很难改变的，不要相信他会变得勤奋，这些性格问题，而性格，一般都是小时候就形成的根深蒂固的习性。不勤奋的人，直接判“死刑”。


    - 精力过剩的人，积极乐观，而且喜欢瞎折腾的人。


    一个人的事业跟一个人的精力关系非常之大。什么事情都萎靡不振的那种人，别交往，跟萎靡不振的人在一起，你也会变得萎靡不振，30岁活得跟80岁一样，还谈什么前途？


    交往积极乐观的人，情绪是会传染的。如果你交往积极乐观的人，你会越来越乐观。而那种悲观主义者，会让你越来越绝望，觉得干什么事情都干不成。最后索性什么也别干了，这样当然也就没有前途了。


    喜欢折腾是一种非常优秀的品质，只要这家伙永不停息的折腾，他总会折腾出经验来，总会越折腾越会折腾，最终获得成功。


    下面谈第三种朋友：家庭教育好的朋友，家庭教育对一个人影响非常大，素质低的家庭很难教育出来素质高的孩子，别说特例，我不喜欢谈特例我只谈一般情况下。性格决定命运，家庭教育好的孩子，性格里有更多的优秀品质，这些品质都会在以后的激烈竞争中发挥竞争优势。


    第四种朋友：帅哥，美女。人的外貌很重要，外貌对人生的影响具有极大的不确定性。特别是美女，那天她嫁给个位高权重的官老爷或者是富商。几句话，就能让你飞黄腾达。当然如果你得罪了她，几句话也能让你完蛋。


    所以，但凡是漂亮的妹子，多给点面子，多结交。因为这是一种优质资源，千万别瞧不起，女人的美丽就是一种能力。


    最后，强调一下，别由着自己的性子乱交朋友，咱们是来学习怎么混社会的，怎么赚更多的钱。大家都是成年人了，做事都成熟点。


    如果你在读小学的时候，就明白了我给你讲的这些交朋友的道理，选择性的交朋友，而不是胡乱的交朋友，我相信你再差也差不到那里去。


    人类社会从来不是单打独斗的，比的就是谁的团队牛逼，谁的朋友牛逼。如果凭借单打独斗，我是不会怕李嘉诚，马云的，我天天都练拳呢。


    我以前就是由着自己的性子乱交朋友，特别是读书的时候，那个时候打传奇，魔兽，交了个朋友，由于游戏里玩得好，这家伙总是找我借钱。结果有一次，我让他帮我顺带本书都不愿意，还如不一个宿舍的普通室友好使，你说这种朋友交来做什么？后来，这家伙还来找我借钱，在游戏里间我要优秀装备，我真是对这种朋友非常无语。你为什么穷？


    即便是收入较高的职业，比如律师、医生、投行，他们获得更高收入是因为他们具备一些难于获得的知识和技能，但是相对于他们创造的价值，也是相对低的。


    马克思讲过，劳动者创造的价值大部分被资本家剥削了。我们钢业者就是奔着资本家这个位置去的。一个员工如果不能给企业带来价值，我们当然要开除他，他给我们带来高价值，我们剥削他的剩余价值也是天经地义的事情。


    因此，如何对自己劳动正确定价，获取自己全部付出的应有回报？是想成为富的人必须考虑的。


    富人投入精力做有利于自己财富增长的事情，比如开公司，做实业投资金融投资等。打工会让人陷入收入只够养家糊口的循环，而且你会没有时间去学习，没有金钱去探索如何挣更多的钱。


    富人拥有正确的消费观。人都是有欲望的，因为贪婪所以要工作，满足物欲，但是物质满足只能是暂时的，胃口会越来越大，所以想要更多。这是对人性的精准阐述。问题是，穷人和富人消费有什么区别？我以前有个同事，他出国旅游一趟，花费了四十多万在购物上面，这在北京已经足够三到四个普通家庭一年的开销了，但是对于他来说并无负担，他的房租以及购买金融资产带来的收益，可比这多多了，于是在同一年，他又张罗着给自己换了一辆豪车。我还认识一些刚毕业一两年的姑娘，省吃俭用两三个月，就是为了给自己买一个LV的包，然后过地铁都不愿放在安检的机器上怕弄脏了。这就是富人和穷人消费的区别：富人不用考虑对自己财务状况造成的影响，穷人反而反其道行之，购买奢侈品等来营造自己购买力的假象。再换一个角度想想，不是二代的话，谁都有穷的时候，这个时候，多积攒一些金钱，用于投资，不论是提高自己综合能力或者去购买房产或金融产品，而不是用于消费，十年之后，结果完全是两样。消费的产品在物理上可能早就消失了，带来的愉悦早已过去，如果投资，这时候可能就是一笔不大不小的财富了。


    如果你不懂如何投资，那么，我告诉你一个最保险又肯定快速升值的方法，就是投资学习。不管是看书也好，还是进入富人经常参加培训圈子也好，都能快速帮你致富。你的所见，决定了你的收入。


    想发财要放弃寻找安全职业的错觉。没有公司能万古长青，基业长存，也没有公司能保证哪天不让你走人，这个社会没有安全的职业。也许在一个企业奉献了青春，不再年轻，某天发现从事的职位变成了夕阳行业没了饭碗，这个时候不得不从头做起，和
    20 岁毕业的毛头小子们一起竞争。


    在中国，当然有特殊情况，公务员和国企有编制的员工目前看来还是很安全的。但是，安全感永远不能让别人给，在干事业和谈感情上这点是共通的。别人给的安全感，永远只能是自欺欺人的假象。


    中国古话讲：富贵险中求，年轻的时候，有冒险的精神非常重要。


    人富钱生钱。在中国，资本的回报率可比人“贵”多了。一个受过良好教育，工作勤奋的年轻人，在一线城市一年能有 20 万的收入，算得上是不错了。如果考虑一下家庭为了养育这个年轻人所花费的巨量金钱，这个收入的回报真不高。但是金融资产，一年取得
    10% 的回报只能算稀松平常。富人的资产量大，也可以接触到很多普通人接触不到或不留意的渠道，为自己的资本寻找到迅速增值的通道。举个例子来说，上海的一些双语幼儿园，毛利可以达到
    50%以上，所以，做老板是一件极其划得来的事情。


    人穷是一种观念，时刻想的是“我不能做这个”，“我不能做那个”，正是这些自我施加的框格，彻底束缚了一个人追求财富的能力，在中国这个社会，有很多不自由，但是唯独对追求财富，真的没有那么多“不能”的限制，把这些“不能”替换掉，时刻想想“我怎么能做成这个”、“我怎么能做成那个”。我怎么能成为一个10亿级的富豪？做一个积极的思考者和行动者。物质上的富裕，


    ## 靠数据活着的人才会变富


    很多人都想变富，苦苦经营，绞尽脑汁找方法，买股票，卖股票。起早贪黑的经营公司，可是几十年干下来，发现自己的财富并没有增加多少？百思不得其解。


    当然，有一部分打工族也以为自己付出了很多，为什么就是不能变富有呢？


    答案很简单，穷人是靠感觉活着的人，而富人靠的是数据。比如，一个穷老板经营公司的方法是，这个哥们对我很尊重，跟我关系也很好，以前是一起跟我打下天下的，所以提拔他当经理。而另一个能力很强的人，却只能给他当手下。公司没有考核制度，全凭感觉经营。


    穷人有几十万，几百万闲钱，看着别人去炒股，他也去炒股，他根本就不懂股票是什么，也从来没有上过一堂投资课程，就凭着另一个邻居的介绍，他就投资钱去炒股，可笑的是他的邻居也是邻居介绍的，他们一起把钱买了股票后，又一起商量着去菜市场买菜，去跳广场舞。


    有人说中国大妈抄了黄金的底，后来我们都知道，黄金大跌，其实中国大妈抄底黄金跟中国人在日本核泄漏的时候把超市里的盐抢光了一样，根本就是凭着感觉瞎跟风。


    而富人，只玩自己懂的东西，十拿九稳赚钱的东西。其实这个社会上发明了很多坑人的投资组合，投资产品由一些不懂得投资的专科生，中专生，领着 2500 到 4000
    块钱的工资打着电话，推荐给了那些有闲钱的人买。那些有闲钱的人也不懂自己买的是什么，反正白纸黑字有合同，反正有人推荐，又被说的心慌就买了。


    大多数人重视经验，而不注重基础事实，科学调研出来的数据，并且自作聪明的否定事实。总以为有捷径可走，总以为自己能捡到便宜。其实大部分人的致富套路是投资，然后祈祷。根本就不是有计划，有纪律的去致富，这就是大多数人终其一生不能致富的原因。


    大多数人偏爱复杂的致富套路，而轻视简单的大家都懂的致富套路，比如说，你从现在开始专研网络营销，只要天天专研 5 个小时以上，就算你现在身无分文，只要智力正常，两年后，你必然有
    200 万现金在身上。10 年后，你就能成为千万富翁。我说的是专研，不是你打了一份网络营销的工，如果你智力正常，你就能明白我的意思。但 100 个人当中，只有一两个人会坚持这种简单的致富套路。其他的人都会嘲笑或者说坚持几个月就放弃了，因为他们又想去寻找其他的致富套路了，显然，当他们找到后，他们稍微坚持一下，又会放弃，然后又一次去找新的致富套路。


    这个世界最有意思的是，穷人想的跟做的总是有着天壤之别。而致富，就是想的很简单，做得也很简单。


    国外有一个统计，100 年来看，大部分基金经理绞尽脑汁都没有跑赢标准普尔 500。也就是说，如果投资，你根本不需要思考只买标准普尔 500 的企业就行了。


    同样的道理，在中国，你只需要买大城市的地产就行了，你就赚钱了，根本就不需要动脑。致富，只需要想得极其简单，做得极其简单。通过整个社会的统计数据去干了。同样的道理，你管理一个企业，你不知道怎么管，你压根就不需要绞尽脑汁，费尽心思去想办法，搞政策，甚至玩企业内部的政治斗争，你只需要找到中国最牛逼的企业，比如阿里巴巴，腾讯，华为，万科，看看他们各个模块的管理制度，根据自己企业的情况稍微变通下，用起来就行了。


    ## 会做人就会赚钱，而且一定有钱赚


    怎么算是会做人呢？做到哪几点就会赚钱呢？下面我分享 10 点我认为重要的给大家。


    - 尊重身边的每一个人，没事就多烧香，天天平安。给多少人烧香，就有多少人帮助你，保佑你，人都是礼尚往来的。

    - 能送礼的时候，就送礼，送礼多的人，就很容易成就大事。甚至在你无路可走的时候，会有你送过礼的人帮助你，让你绝处逢生。

    - 养成背后从来不说人坏话的习惯，也不听别人说坏话，别人来找你说坏话，你就找借口走开。因为坏话是一种负能量，会感染你的精神。让你丢失财运，况且，中国本来就是个好事不出门，坏事传千里的社会。你只要一说坏话，要不了多久，大家都知道是你说得了，没人愿意与你相处，大家心里对你有芥蒂，你就混不好了。

    - 养成做好事的习惯，并且做好事绝不留名，这样你的人缘就会越来越好。如果你做了好事，到处宣传，好事就会变成祸害。因为那些接受你恩惠的人脸上无光，成了你炫耀的工具了。你就开始积累怨恨。而如果你不宣传，有部分受你恩惠的人就一直铭记在心。总是很感激你，你积累的就是福德。怨恨与福德都会在条件成熟的时候转化到现实生活中。养成做好事不留名的习惯，必成大业。

    - 调理好家庭关系，家和万事兴。家和，你家里的父母，老婆都鼓励你创业，鼓励你奋斗，一家人都支持有如神助，成功几率就大很多。如果把你家庭关系处理不好，那么你做什么事情，父母反对，老婆反对，负能量都集中到你身上，你就相当于小鬼缠身。事业就显出衰败之象，赚钱就很难。

    - 不要抱怨环境不好，找客观原因，这样大家只会认为你无能，其实大多数事情，都是人为因素占的多。人为因素大概70%，环境因素占30%。所以，你只要把你能改变的事情做好了，基本这个事情就算成功了。

    - 我们工作的时候，总会遇到些压力，不顺利，甚至是痛苦。不要把这种压力发泄到伙伴身上，不要把这种压力带到家里，让家里人跟你一起痛苦。这一点，我是跟李嘉诚学的。李嘉诚回家绝对不谈工作，家庭就是家庭，工作就是工作。李嘉诚先生事业如此之大，能做到井水不犯河水，真是了不起。我现在都是家庭与工作分不开了。但我还能做到不把痛苦发泄到伙伴与家人身上，男人有什么事情就自己承担。挺一挺就过去了，这样你会跟大家关系融洽。

    - 要有城府，别人骂你，做错了什么事情，不要把情绪挂在脸上。什么事情都挂在脸上的人，成不了大人物，成不了大商人。

    - 永远不空手吃任何人的饭，永远不空着手到任何人家里去玩。

    - 与人合作永远让别人赚大头，自己赚小头。这样干得目的有二，第一，对方会上心，会操心；第二：对方会讲你好话，会有更多的人与你合作。


