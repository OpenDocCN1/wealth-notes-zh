    个叫邢帅的做 PS 培训的，开始连网站费用都出不起，几年时间做在线教育就做到了几千万。大家可以在网上搜索到邢帅教育，了解一下这家伙的创业史，看有没有 可以学到的套路。


    我们部分人在这个社会上混不好，初级的人是靠出卖体力，入门 级点的是靠出卖技术。要登堂入室，我们玩的是一套思维，有了这套 思维，很多东西都会变很简单。


    先搞广告创意，再搞包装，最后落实做产品开发


    很多创业者，老板，想做一个生意，就开始在那里研究产品。研究好产品就做出来，做出来了就开始卖，自己没本事卖出去，就企图 招聘一个牛逼的营销经理来卖产品。卖不出去就破产，卖得出去就开
    心。很多时候，都是自己做了一个根本没市场需求的产品。


    这种做生意的逻辑是大部分人的逻辑，也是非常错误的逻辑。


    正确的逻辑是：先搞广告创意，再根据广告创意做产品包装，也就是先找到顾客购买你这个产品的理由，找到客户购买理由后，我们 再根据客户购买理由去开发产品，制造产品。这样搞出来的产品，水
    到渠成就能卖出去。


    表面看上去，顾客是买产品的，真实的情况是，顾客是看到广告才 决定买你的产品的，广告是顾客购买你产品的理由。


    也就是说，做一个业务，广告是核心，研发是为了广告服务，产品是为了广告服务，包装也是为了广告服务。


    什么决定需求？'
  - '[PAGE 257]


    作为一个创业者，我们要找到我们卖的东西有什么价值。价值是 由人们的需求决定的，道理很简单，人们不需要你这个东西，你这个 东西就毫无价值，人们非常非常急切的需要你这个东西，你这个东西
    就非常有价值。


    我们应该卖什么产品？做什么服务？明显是人们非常非常需求的东西！


    那么，什么决定需求呢？思想，观念决定需求！ 通俗点讲就是人 的想法决定需求，人的想法千奇百怪，所以世界上的商品千奇百怪。 连火星上的土地都卖出去了，淘宝上还有卖一屁股的，依然卖了很多。
    当然卖穿过的内裤的也卖出去了很多！


    那么，又是什么决定你的观念呢？又是什么决定你的想法呢？


    你接受的信息，决定你的观念，你天天听我讲创业，你就想创业。 社会环境，决定你的观念，如果你生在温州商人家里，你就自然而然 想要当老板。


    你只是父母遗传基因和自身环境的综合产物，你的观念来自你所 处的环境，一定要清醒的认识到这一点。你自己是没有观念的。你是一个机器人而已，你的想法与观念，甚至心理需求，仅仅是你的基因与你的社会环境编写的程序而已。


    遗传基因的核心是遗传信息，他决定你的硬件组成部分是什么，他决定组成你躯体的硬件性能如何，比如，有科学研究表明，人的智商跟遗传有很强的关系；环境的作用，主要价值也是信息，因为我们每个人接受的信息，都是从自身环境来的，所以身处什么环境，往往决定你的命运。'
  - '[PAGE 258]


    一个聪明人，必须付出代价，把自己所处的环境打造成好。


    打造自己所处的环境，就是打造自己的命运。


    当然了，遗传信息很重要，比如那些天生智力残疾的痴呆


    症、傻


    子、疯子之类的，就是遗传基因出了问题，好比电脑某个电路板或者 CPU 损坏了，导致根本无法使用。


    人们有什么观念，完全来自人们自身所处的环境，人们就是自身 所处环境的产物。


    所以，你只要天天盯着一帮人做营销，灌输给他们需求你产品的 观念，塑造消费环境，或者帮他们找消费环境，他们必定会买单。


    > “人本来就是环境的产物”， “环境塑造人”。


    如果你把人假设成一台高性能电脑，那么，人就是获取信息和处 理信息，并输出信息的机器。


    这台机器做什么动作，就在于你给他什么信息。


    也就是说，一个人，认为什么有价值，跟他的价值观，也就是我


    们通常所说的观念，密不可分。


    有什么观念，就有什么需求，有什么需求，什么就是有价 值的。 理解了这个东西，你应该就明白了，只要你能塑造人的观念，改变人 的思想, 那么你就能卖出去一切。那些时尚代言人，其实就是在塑造
    人们的观念，思想，比如什么韩流，日流穿衣风。'
  - '[PAGE 259]


    营销，最重要的是塑造人们的观念，品牌营销，奢侈品营销都是 从这一点着手的。其实最早的时候，经济学是心理学家业余的时候专研的，后来就有了经济学这些课程。


    一个老板，必须是一个心理学高手


    什么产品可以赚取暴利做一个直指人心的产品。


    根据马斯诺需求层次理论，这个人类的需求，依次是先满足生理 需求，再满足安全需求，再满足社交需求，再满足尊重需求，最后满足自我实现需求！


    马斯诺的理论是，前一极需求被满足，人们才会诞生下一级的需求。


    意思就是，你饭都吃不饱，肯定是找饭吃，不会想到找女人，所 以中国古话讲，饱暖思淫欲，先有饭吃，能穿的好，才想找配偶交配。


    所以，人类的基本需求，就是吃饭加交配。


    这个理论，我们可以运用到商业上，到底做什么样的产品最有市场。读懂这个理论，你就能设计好你的产品，赚取暴利。


    首先把这个理论进一步进化，需求，并不代表市场，有购买力才 能形成市场，有需求才只是会让人产生购买冲动。


    如果目标的购买力已经满足了上极一需求，那么我们就可以认为 目标已经产生了下一级需求。


    相反，如果目标的购买力只足以满足基本需求，即使他有更高的 需求，我们也不认为更高的需求已经诞生了。因为更高的需求，他买 不起，就像一般的打工仔也想要跑车，可是他没'
  - '[PAGE 260]


    有购买力一样。


    另一个方面，将需求对应欲望更容易理解判断。


    我发现，人的需要都诞生于基本欲望，而所有的欲望都追述到“生存和交配”上，这两个欲望衍生出了其他一切欲望。


    举个极端例子，一个人追求超脱，无欲，修道。其实也是正因为有欲望，得不到满足，所以他才去追求化解这种欲望。


    这样的话，我们就不能说“因为生理需求被满足，人们才追求更高级的欲望，有点见识的人应该都知道，很多贫穷的人开始追求信佛，修道，信耶稣。按理说，这是高级需求”，这种高级需求，恰恰是因为，基本欲望永不满足，才诞生出高级需求的。所以从深层次上讲，这些求佛，修道，信耶稣的人，还是想满足基本需求，就是生存与交配。


    再比如我们追求被别人肯定，被认可，这是一种社会需求。


    但这种社会需求，表面看来是因为我们的生理需求和安全需求已经被满足了，实际上，它反应出来的，恰恰是：我们希望得到更多的生存和交配资源。因为社交需求让你想去认识漂亮的异性。这是人的潜意识。


    因此我们可以看出，整个需求的过程，其实是由少到多，由浅显到复杂，由直接到引申。


    但是，这些高级需求的根本基本都是从生存与交配需求上延伸出来的，而且其他高级需求又反过来进一步帮助你更好的实现生存与交配。'
  - '[PAGE 261]


    故此我们的产品必须千方百计和基本需求挂上勾才会有前途。也就是我们打磨的产品，必须与生存和交配挂钩，才能直击人心。


    举例说明：你的产品如何能卖出暴利！


    比如，衣服对应穿着需求，穿着是因为要装扮自己，而装扮是要吸引异性（繁衍后代的目的，如果我去做衣服生意，我的产品设计方向一定是满足交配这个基本需求的产品，那么，我就可以获取暴利。要不然，我的产品就卖不上高价）。具体一点，我会去做女士内衣，显然是具有诱惑男人功能的内衣，女士们就愿意花高价去买，所以要和基本欲望“生存，交配”挂钩，因为性感，所以交配？其它设计、包装、


    营销等等环节也都要围绕这个来！


    如何建立品牌，如何把一个东西卖到高价


    建立品牌，就是要让用户的脑袋里烙印上正面的印象。需要卖到高价的产品，你就不能只卖实用性，而要卖内涵，再卖一个外延。


    中国是一个最好赚取暴利的地方，因为中国人的消费不像西方人那样理性，西方人是什么收入阶层，就有什么样的消费，阶层感比较强。


    而中国，由于儒家文化，喜好面子，比较务虚，虽然中国人很穷，但中国是世界上奢侈品消费的大国。中国的普通白领挤着公交车上班，就敢买LV的包包。二个月工资的结余，去买个7000块的苹果手机。正因为这种极其离谱的事情在中国极其正常，所以，中国是个赚取暴利的好地方。中国人喜欢炫耀'
  - '[PAGE 262]


    性消费。你有我也要买，价格低了还不 行，贷款都要买。


    有了市场，接下来我们就要使点手段，让他们买我们的产品了。我仔细研究过一些品牌，他们就是靠讲故事的能力把产品卖到高价。


    比如瑞士军刀，怎么讲故事？有架飞机坠毁了，一位乘客，拿着 随身的瑞士军刀在飞机上刻出一个小洞，钻了出来，刚爬出来，飞机 就爆炸了，结果，飞机上就他一个人生还。这种故事极具传播性，听了的人终身难忘，就会以为瑞士军刀的价值很高，所以瑞士军刀就算比其他同样品质的军刀高几百块，听了这个故事的人也会毫不犹豫的
    买瑞士军刀。


    再比如 LV 是怎么讲故事的？话说 1912 泰坦尼克号沉船后，到了 1996 年，有人打捞上来一个行旅箱，是 LV 的，一打开，里面的衣服还干的。你说，LV
