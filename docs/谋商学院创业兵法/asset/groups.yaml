    # 什么样的团队才能稳定发展


    我们很多人创业成功后，拥有一个小团队，就是发展不起来，不管是企业利润，还是企业规模，都碰到紧瓶，搞不清楚为什么。今天我就来谈一谈这个问题。


    这个世界上最稳定的结构不是上海的金茂大厦，也不是美国的五角大楼，而是埃及的金字塔，到现在已经 4500 年了。如果用少量的炸药炸金茂大厦或者五角大楼的某些局部，那么这些大厦都会倒塌。但如果你用同样的炸药去炸埃及金字塔，你放到任意位置，都不会对金字塔的稳定有任何影响。'
  - '[PAGE 237]


    金字塔这种四边形是宇宙中最稳定的结构，他有四个面相互支撑，各司其职。


    我本人做过很长时间的业务员，所以，心里硕就认为业务员非常重要，甚至认为公司只要有业务员就了。能拉来单子就能饭吃，所以我刚做企业的时候，跟着我的全部是业务员，公司也能有盈利，打电话电话招聘也是业务员去搞，交社保，办理各种证件，也是业务员代劳，认为除了业务员，其他人员都没什么用。可以想象公司的管理混乱，制度建设什么的根本没有。


    后来狠心花了大价钱找来一个懂制度建设的人事经理，经过他的努力，公司的人不迟到，不早退，偶尔还有活动举办，其乐融融，并且发现现公司的运营效率比以前高了。


    忽然之间我明白了点什么，就又招聘来一运营经理，一个策划经理，公司的运作效率与广告效果都有显著提升。


    整体来讲，公司是由两个重要部分组成的，一个是前面打仗的业 务员，一个是后面搞后勤的运营啊，策划啊，人事啊，财务啊组成的。必须要大家技能互补，性格互补，公司才能发展壮大，实现高盈利。


    企业也才会越来越稳定。就如同我前面讲的金字塔是由四个面组成的 一样，一个团队也至少由四个面组成。


    如果你的团队全部是业务员，就意味着你只有一个面，你这个企 业就很不稳定，就别谈发展壮大的问题了。


    所以，我现在做任何一个项目，我都会尽快给这个项目团队配上 四个面的人才。需要说明的是，配齐四个面可能需要一'
  - '[PAGE 238]


    两年，因为招聘到合适的人靠我们努力，也靠缘分。有的人不合格也是要换下来的。


    总结一下：团队想要发展壮大，就需要多方面人才的配合，而不是单方面的人才。很多老板只喜欢跟自己一样的人，这是发展的大忌，企业是一个生态系统，尽快让技能互补，性格互补的人相互配合,才能发展壮大。


    为什么你定的方案执行不下去


    很多老板喜欢讲执行力，企业文化，企业利益。不管你讲什么，你的目的员工心理跟明镜是的，就是想让大家多干活少拿钱，只有极度愚蠢的人才能被你洗脑，把你的方案执行好。但这本身就是一个悖论。极度愚蠢的人是不会把事情干好的。他们能干好的事情，也赚不了几个钱。这种老板就叫小聪明，就是聪明反被聪明误。


    真正聪明的人，是不会多干活，少拿钱的，聪明的人要的真金白银的利益。我们当老板的都是聪明人，我们就是希望低投入，高产出，如果你不是这样的心智模式，你就不是一个正常的商人。


    说白了，我们光制定好一个方案了。这个方案是满足老板本人的利益了。可你有没有考虑过执行人的利益？反正做得好，做不好，都是那么多工资的话，我就保证，你这个企业就要死不活的了。


    一项重要的工作，必定是要执行者与这件事情的成败利益相关，最最重要的工作，当然只有股东层面的人才能做好。这是机制决定了的，不是什么执行力，企业文化，臆扭转的。'
  - '[PAGE 239]


    次一点重要的工作，比如要公司的总经理去执行，他执行不好，就要下课，这是威胁，执行好了就要奖励，这是利诱。他很在意这些 东西，他才能执行好。


    其实就是你必须考虑到执行人的利益。当老板，千万别用架子去压人。别讲些冠冕堂皇的话，真正的大师级的老板，就是句句讲真话， 句句关心每个人的利益。绝不浮夸。忽悠别人干活。没有人能被你忽悠，最终你只能忽悠你自己。每个人都是为了自己，没有人会为了公司，包括老板自己，都是为了自己才建立公司的，不敢承认这点的，
    讲得冠冕堂皇的人，我在公开场合就不多嘴了，免得被道德帝骂，你们自己支想。


