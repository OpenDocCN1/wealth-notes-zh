    # 员工管理有四个层次。


    第一个层次：打骂式管理，最初级的管理者，员工犯错了，就骂，就打，当然现在社会，打的情况很少了，但是还是存在。如果是这种管理者，那么他的工作是做不了多好的，还采取这种管理手段的管理者要注意了。员工在这种管理者手下，是非常难过的。能在这种管理者手下工作的人，要么是自己水平实在太差，没办法跑；要么就是在等机会，只要找到个其他工作，立马就跑路了，这样的企处有倒闭的危险。


    第二个层次：金钱式管理，用奖惩制度来管理员工的，这样的管理者，只能算是入门的管理者，如今，大多数中小企业还在采用这种入门级的手段，这种管理，员工对企业没有向心力，就是为了挣个饭、钱而已，就是各人自扫门前雪的心态，把自己的事情做好了，就算了。这样的企业在顺境当中尚可生'
