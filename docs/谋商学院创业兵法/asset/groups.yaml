    我们就可以看出，买一件衣服，生物需求只占很小的比重，社会需求占大头。以一件售价 1000 元的衣服来说，它满足你生物需求的那一部分价值，可能还不到 50 元。这个社会需求，本质是要得到他人的认可。衣服穿给谁看？传给别人看。


