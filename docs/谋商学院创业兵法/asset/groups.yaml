    # 老板如何管理自己时间


    很多创业老板，甚至稍微上一点规模的老板，成天忙得不得了。


    但没干几件有用的事情，干了好几年，企业依然没有发展壮大，大部 分原因是没有分析自己的时间都用到哪里去了，所以，你问他要成绩，


    他是拿不出来的，今天我就系统的与大家谈谈老板如何管理自己的时间。


    先讲一个题外话，如果你的企业里有一些人是偶尔才用一下，那么就把它解雇，通过外包的形式来做这个人做的工作。因为企业有多 余的人，他成天不做事，会对整个企业产生不良的影响。员工没事干，他就要去干扰其他人，无事就生非，所以，我们要给员工安排满事情做。'
  - '[PAGE 112]


    现在讲老板她如何管理自己的时间。


    第一：只开有效的会议，因为开会就不能工作，工作就不能开会。拒绝无关的人参加会议。部分企业老板，管理者动不动就开整体部门


    会议，全员会议，这绝对浪费大家的时间，浪费时间就是浪费钱。我们开会，必须言之有物，针对特定的事，特定的人，解决具体的问题】杜绝把不相关的人也弄来开会。


    适当的会议非常必要，因为相关的人与事要彼此合作，就要彼此沟通。一个人的头脑不能解决所有问题，适应的会议作用就是集思广益。


    第二：老板只抓公司一个主要业务。其他业务全部交给公司的能人打理，老板只看结果。同时不参与其他业务的会议，让相关人员全面负现你丢给他们的业务。老板亲自抓公司的主要业务，如果主要业务盈利能力强，企业的能人自然有样学样，差不到哪里去。


    第三：把业务流程化，精简化，标准化，让每一-个新人人都看得懂，减少重复解释时间，会议时间，内容相同的沟通尽量流程化。


    第四：拒绝参加不一定非要自己参加的任何形式的讨论与会议拒绝批阅不必由自己批阅的公文，比如，我们公司要买一个杂物柜，一些电脑。由其他同事决定了就行了，我是拒绝参与这些事情的。


    第五：不要把自己的时间分割成很多小段，分割开了的时间，等于没有时间，很难处理好一件事。我在公司里是最讨厌'
