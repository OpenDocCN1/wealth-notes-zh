    # 虚虚实实才是营销之道


    太过老实，直白的人啊，在中国这个社会确实是非常难混的。典 型的代表人物，就是技术员，普通老百姓。


    还有些普通的业务员也很直白，这就让我大吃一惊了。营销呢，必虚虚实实，有手段。


    比如，我们卖一件衣服，你的衣服有 1000 的, 有 2000 的，有 3000 的。顾客进店里了， 不要直接推荐低价的，先推荐最高价的，他一看，这么贵，然后你再顺势推荐一个低价的给他，他的心理就比较能接收了，这就是虚晃一枪。


    再比如单品营销手段，讲这件衣服只有一件了，非常抢手，不买就没了，估计你明天来，肯定就卖掉了。人都有一个心理，怕永久的失去一件东西，这样成交率也会上升。


    还有涨价营销手段，比如，你今天来运气好，接到总部要求，明天我们这个货物就，涨价了，要买赶快买。


