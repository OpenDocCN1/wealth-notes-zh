    而是因为不自信。自信是一种力量，更是一种动力。当你不自信的时候，你难于做好事情；当你什么也做不好时，你就更加不自信。这是一种恶性循环。若想从这种恶性循环中解脱出来，就得与失败作斗争，就得树立牢固的自信心。


    # 心动更要行动


    生活不会因为你你想做什么而给你报酬，也不会因为你知道什么而


    给你报酬，而是因为你做了些什么才会给你报酬。一个人的目标是从梦想开始的，一个人的幸福是从心态上把握的，而一个人的成功则是在行动中实现的。因为只有行动，才能赚回滋润你成功的食物和泉水。平常心不可少


    人生不可能一帆风顺，有成功，也有失败；有开心，也有失落。如果我们把生活中的这些起起落落看得太重，那么生活对于我们来说永远都不会坦然，永远都没有欢笑。人生应该有所追求，但暂时得不到并不会阻碍日常生活的幸福，因此，拥有一颗平常心，是人生必不可少的润滑剂。


    # 宽容是一种智慧


    俗话说得好：“退一步海阔天空，让几分心平气和。”这就是说人与人之间需要宽容。别人来找你这个当老板的麻烦了，你后退一步，可能付出很小的代价就解决了，而你前进一步，可能流血五步！我们没必要跟屌丝血流五步。


    # 学会给心灵松绑


