    ## 人是因为优秀才有优秀的朋友


    部分人总觉得老天不公平，自己孤独，说那些优秀的人都有自己牛逼的圈子，如果他们没有那个圈子就什么也不是。看起来好像很正确无比。比如俞敏洪进入了北京大学，有了徐小平，王强这些同学，才有了后来的新东方。但我想说，首先俞敏洪能从农村考进北大，能和优秀的人成为朋友，这本来就证明了俞敏洪是一个优秀的人。只有你是一个优秀的人，其他优秀的人才愿意和你交朋友。如果你不优秀，那么挖空心思混迹各种牛逼的圈子，实际意义上不大。越是优秀的圈子，大家越是精明。表面看起来优秀的圈子的人好接触，平易近人，彬彬有礼，实际上并非如此，而是因为他们不得不这样，以免得罪人。真正要与优秀的人有所深交，你必须也是很优秀的人，必须能和他们交易。不管是精神上的，还是物质上的。社会本来就是一个交易系统，别指望优秀的人做亏本生意，大家在一起，就是互利互惠，这从另一个角度也能说明，如果你价值不大，不愿意或者不能做出对应的贡献，那么你也是交不到对应层次的朋友。


    所以我不建议创业者去外面混什么老板圈户，商业圈子，因为这毫无意义，简直就是浪费时间，大家都精明得跟鬼一样。而自己专心去拓展自己的业务，把自己的事情做好了，才是正事。等自己把业务做好了，把自己的事情做好了，你会惊奇的发现，你的圈子也随着你的事业水涨船高。你周围自然就聚集起来优秀的人，那些不优秀的人就会自动远离你，就算开始大家在一起，不优秀的人也会自动神退。


    而如果你一心一意的想去靠别人发财，想去混个什么圈子企图改变自己的社会地位，经济地位，其结果只能是徒劳。就算侥幸被你混进某个高端圈子，你也只能是那个圈子里的可怜虫，当然如果你纯粹是为了进入高端圈子学点经验的，我觉得也可以短时间混一下圈子。


    一句话总结，就是物以类聚，人以群分。创业人更加要踏实，有梦想，但是**要按计划，一步一步的去实现**。


    ## 观察，理解，**然后改变这个世界**


    创业成功，赚到几个亿，其实蛮简单。我一直在思考，我们人来到这个世界上首先应该干嘛？明显是观察这个世界，享受这个世界，只有你细心的观察这个世界，你才会发现些什么，然后你要试着理解这个世界。很多人找不到赚钱的门道，辛辛苦苦一辈子，依然贫穷，而有的人呢，轻轻松松就赚到钱了。就是理解世界的程度不一样，角度不一样。


    农民工对自己的孩子讲，学个电焊，学个挖掘机，学个厨师就能有口饭吃，这是农民工对世界的理解。这种理解，自然是很难赚到钱的。


    很多工人对自己的子女讲，好好学习，考一个好大学，将来能找到一份好工作。这种理解呢，只会成为一个房奴式的工薪阶层，自然也是难以赚到钱的。


    像我们这种人，既不学技术，也不好好找一份工作，一心只为创业，只为做企业，只当老板，其他的事情绝不干，这种理解世界的方式，比前面两种人要多赚点，但还不够牛逼。


    我当年写程序，做网站，开公司也赚了几个小钱。我们有一个投资人，年初投了几十万，年末就直接赚了几十万，回本了，后来他就一直拿这个企业的分红。这个投资人，一年到头都不来公司来看看，而且他投资了好几十个这样的小企业。他赚得是最多的。为什么他中了这么多？就是因为他的理解世界的方式不一样。


    在赚钱与创业这条路上！怎么知道自己理解世界的方式错了？


    答案很简单，就是你干了半年或者一年，依旧很贫穷，没有赚到钱，就说明你理解世界的方式有问题。你就要迅速学习新的理解世界的方式。


    结果是最好的检验你的思维是否有效的工具。


    我现在的重点工作就是全面，充分，精准的理解这个世界，这能让我的决策更加的正确。


    只有理解了这个世界，我们才能改变这个世界，创造一些市场上真正需要的产品与服务。只有理解了这个世界，我们才能明白这个世界需要我们为他做些什么。比如，快的打车的创始人为什么要做快的打车这款软件？就是因为他自己打车的时候不方便，他认为如果我们做一个软件，能点一下，就把车叫过来，这样不就更加有效率？于是，他就做了这样一个改变世界的软件，顺手就把企业做到了上百亿。


    只要你理解这个世界，你就会找到很多可以改变这个机会，比如传统行业都需要用新技术去提升他们的效率，都可以借助互联网工具进一步升级，这里面就有很多改变世界的机会。所以，我肯定，只要你选择一个领域，用一些新技术，新工具去改变你理解的这个世界，那么赚上几个亿也是容易的事情。


    ## 成功在于持续的重复一件小事


    前面有一期节目讲了品牌建设的重要性，你一定要在你的品牌建设里面，把你的第一给挖出来，猛宣传那一点。


    也就是说你的产品或者服务最具有优势的那一点，就是你发展的方向，既是你的战术也是你的战略，公司所有的资源都应该投入到这一点上。


    一招鲜，吃遍天。程咬金三板斧，谁又躲得过呢？**百招会不如一招精，把优势发挥到极致。**


    穷人就是什么都会的人，富人就是只会一件事的人。


    创业做项目，计划多了没用，90% 的困难你现在想都没有想到，你都不知道那是困难。你既然连困难都不知道，就应该赶快去干。


    **很多事我们想不明白，那就把它干明白！** 创业人之间是争论不明白的，公说公有理婆说婆有理，但一干就明白了。


    我做了很长时间的招聘，非常难招聘到自己满意的人才。聪明的企业家就是把复杂的事情简单化，然后让能力差的人分工合作，以此把事情干好。要善于与“傻瓜”打交道，因为“聪明人”是不会与你合作的，他们自己创业了。


    做成功一个项目的第一单声你大的成功就不远了，所以你首先就是脚踏实地、集中精力地先做第一笔业务，创业刚开始最忌讳做三五年要怎么了么样的梦，先脚踏实地做出第一单。万事开头难，开头干出来了，也就成功了一半。


    **做项目，选择一个极小的服务或者产品，先在这个领域内做到第一，然后在上下游稍微延伸下就行了。**


    大器晚成并不是说到了 40 岁才发力，而是你必须在 20、30 几岁的时候就很拼，基础打好了，才能盖高楼。


    什么样的员工是合格的员工，能干，能做出贡献，就合格，而不是学历高。


    实用的才是最好的，能盈利才是最重要的。


    有想法没办法的人很多。社会大学是最好的大学。我们每个人一定要持续进步，持续学习。拒绝招聘只有想法不干活的人进公司。


    如果我认为自己还取得过一点点成绩的话，那只是因为我不断的重复：


    重复读同一本图书，重复做同一件小事，不断的重复，你就会发现很多秘密，所谓书读百遍，其义自现，做项目也是如此。


    我总是努力的在重复中去发现不同，重复重复再重复，重复的价值今天在无限放大。


    现在社会节奏太快，新鲜事物冲击大，很难静下心来长时间对一个项目投资精力。大部分人都没耐心，只要你有耐心重复干一个小项目，你非常就出类拔萃。


    坚持就是胜利，坚持体现力量。


    厄普代克写一本兔子快跑，就是一本书。但等他再写出兔子归来和兔子富了，就是人物了。等之后再出七本关于兔子的书5兔子嫁人，兔子伤心，兔子老了，是垃圾还是珠玉不论，厄普代克就逼近不朽了。


    有个叫罗伯特清崎的人写了 20 本书，全部都是穷爸爸，富爸爸，所以，他也出名了，也财富自由了。


    世界级的营销专家，一辈子都在研究营销，比如科特勒，李阳一辈子研究英语，李嘉诚一辈子研究企业。很多超级大企业的 CEO 都是几十年如一日的重复。其实很多人羡慕这些大企业家，可是这些平凡的人，根本不知道，这些人都是早上六点干到晚上
    10 点的，一直在重复那些工作。


    我看到美团王兴在网上发表过的一句话：“今天决定 12 点之前下班”各位听懂了吗？也就是说，他以前都没有 12 点之前下过班，而你，已经回家，已经在梦里了，亿万富翁都是规律的重复他的工作。


    用鲍鱼人参做出来的菜，通常不会好吃，装逼范而已。愈珍贵的食材，练习的机会愈少，如何可以熟练？只有最平凡的鸡、牛、猪，才会产生千变万化的厨艺。比如辣椒炒肉，小炒肉，回锅肉，这才是硬菜，熟练才有出路，也就是不断重复才能有出路。


    一招鲜，吃遍天的秘诀是精通。精通来至于重复，只有精通的应用才能成为专业人士。


    专业人士：


    一生的辉煌只需要一次，但这一次就是传奇。活在人们的传说之中，活在人们的想象之外。我个人喜欢佛学！什么是敲木鱼呢？


    鱼是昼夜睁着眼睛的，鱼睡觉就是停在那里不动了，休息一下就算睡觉了。


    所以我们庙里敲这个木鱼，是要我们精进，修道要效法鱼的精神，昼夜努力不停。


    步步前进，日日不止，自有到期，不必计算远近而徒长吁短叹也，成功在于持续的重复一件小事。


    ## 创业太有意义了


    创业虽然艰难，但我从来没有后悔，创业太有意义了。创业确实会很碰到很多困难，但我们需要把这些困难当成享受，其实解决一个困难，就相当于丰富了我们的人生。


    其实我甚至偏执的认为，每一个人都应该创业，每一个人都应该努力的去做好自己心目中想做的那件事，这样一辈子才没白活。而你在别人的企业，很难找到这样的一件事，是你心甘情愿，非常想做的事，并且愿意把他当成一辈子的事业来做的事情。


    我经常建议某些人，拿张纸拿一支笔出来，写下你最想干的 10 件事，其实这几就是你的人生指南了。根据重要程度有选择性的去实现这些事情吧。


    我认为一个没什么梦想的人活一辈子白活了。而一个有梦想而不敢于实践的人，比一辈子白活的人还纠结，还倒霉。所以我的总结就是，必须去实践你的梦想。


    如果一个人不去实践自己的梦想，就算你是富二代，那么你的人生也是平庸的，也是索然无味的。


    其实很多人都说创业难，真的难吗？当然万事开头难，但并不代表这是一项非常困难的技能，是学不会的技能，其实跟学开车一样。潜心去学，只要脑子没问题，应该都学得会。别怕摔打，小孩子学走路都要摔跤，何况创业呢？但是每个人如果去实践，去摸索，都是会成功的。


    完美的人生，就是去实现自己的想要实现的梦想，我喜欢创业，希望大家也喜欢创业人生。


    # 第二章 创业的他们


    中国古代，打下江山，叫着开创基业。就是创业成功！造反，其实就是创业。


    我国刘宋顺帝时期，荆州沈攸之造反。他的本钱不小，史书上说，他养了很多马，也有很多粮食，有十万精兵，有两千精锐的骑兵。他的军队到了郢城，这座城易守难攻，没有十天半个月，拿不下来！他的谋臣就告诉他，如果不能顺利拿下，军队的锐气，兵威就没了。造反这事，士兵们一看打，军心就有变。我们不如放弃易守难攻的郢城，直接去攻打空虚的南京，打下刘宋的根本，郢城就主动投降了。


    沈攸之不听，用自己精兵猛攻，结果很长时间没打下来。跟着造反的士兵一看，第一仗就这么难打，就纷纷逃亡了，沈攸之见大事已去，跑到树林里上吊自杀了。造反就稀里糊涂的失败了，也可以叫创业失败。


    我在 11 年前玩魔兽世界的时候建立了一个公会，组织了 40 人，去打一个副本里的难度很大的怪，结果不断的灭团，然后我的公会就散伙了。跟沈攸之同志一样，我也失败了。后来，我碰到魔兽世界里面一个高人，他说，大家要的只是活动，你没必要组织他们去打难度高的怪，你可以组织他们去打非常简单的怪。所以，我就组织了一批人去打简单的怪，结果大家打的激情高涨，团队慢慢有感情了，配合意识也强了，后来我的公会自然就发展到能打得过难度高的怪了。


    讲这个啥意思，就是我们创业刚开始，不要找难的打，打不下的别打，去打打得下的。


    创业的时候，如果你带着一帮兄弟们做了很久时间，没见到现金，士气没了，团队就没法带，只有散伙了事。所以，创业初期，只要有现金进来，不管什么活，先去干。这样，团队士气就会越来越旺。要先找个很简单的赢利点，让大家快速尝到甜头；团队的信心才能快速建立，大家才会认为跟着你有前途。


