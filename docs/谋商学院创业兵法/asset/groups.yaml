    失败者与成功者的最核心区别在哪


    成功者会失败吗？答案是：会，但成功者会为自己的失败负责。


    典型的例子，就是史玉柱，他因为修巨人大厦欠下了 2.5 亿元的债务，没有灰心丧气，逃之夭夭，啥也不管了，而是带着团队，又一次做起来，瓶把债务还完了。


    成功者都是一样的性格，再比如爱迪生，发明电灯，实验了 1000 多次，1000 多次都失败了，但他依然再追求成功。在 1600 多次后成功发明了电灯。


    其实现在牛逼的 360，也是周鸿伟失败多次的产物，所有的成功者，都有填坑精神，他们会不断的填坑，直到无坑可填。失败者，最怕填坑，有的失败者最多填两个坑，就再也不愿意填下去了。


    成功者之所以会成功，是因为他们肯失败，不怕失败，甚至可以失败比任何人都多。


    社会的真实情况，显然是成功的人是极少数的，想成功而又不成功的占大多数。由于生产力的发展，看起来现在普通人比以前的普通人过得好了，10 年以前的普通人，可能都没有自己的手机，没自己的电脑，而现在的普通人，人人都有自己的'
