    # 领导者是自然选择的结果


    最优秀 的领导者，应该是从一个生态系统中自然产生的。正常的 生态环境，会有人从中脱颖而出。或者 说，大家都觉得他牛逼，众望所归，他就是领导了。


    有一个例子，大家可以参考下：东北的鄂伦春族原来是养 鹿的。 但是，近年来，鹿的种群质量下降得厉害，鹿的个头越来越小，还经 常生病。大家不断的寻找原因，最后终于找到原因了，是人为造成的。
    因为鹿茸很值钱，人们就把鹿角锯下来拿去卖钱了。到后来鹿都没有 角了，这样带来了一个严重的问题。


    本来每年春天，鹿群需要用角斗来决出鹿王，而鹿王享有交配权， 一般鹿王就是最雄壮，个头最大，体质最优的。这样才能保证种群中 最优秀的基因传下去。现在呢，人们把他们的角锯下来卖钱了。鹿没
    有角，角斗时大家谁也搞不过谁了，就鹿鹿平等了，每个鹿都自由交 配。延续下去就不是最优良的基因了，所以种群的质量越来越差。


    在一个正常的组织里，领导者必须有一套机制让他们脱颖而出。 我定义这套机制就是业绩，你为企业做出了多少贡献，赚了多少钱。做的贡献大的，赚钱多的，就相当于在角斗中获胜，那么就享有领导权。


    而不能用一套其他的外力去干涉这套机制，比如这个人是你小学，或者是你妹妹的老公，或者他马屁拍的好，你就让他当领导。这就相当于把劣质基因不公平的引入一个企业。整个组织就会陷入平庸。甚至真正牛逼的人，看到你这样搞，只好'
