    # 赚钱，必须了解钱的性格


    地球上从来不缺钱，当今社会，电子货币满天飞，满互联网飞，支付宝，微信，财付通，各种网银，各种资本，投资人，基金。


    这些钱 24 小时不停的在寻找着谁需要他。然而奇怪的是，大部分却非常贫穷，努力挣钱却得不到。


    现在，我就来谈谈钱到底在找什么人。而你只需要成为这样的人，钱就会向你飞奔而来。


    司马迁讲，天下熙熙，皆为利来，天下攘攘，皆为利往。司马大爷的意思是，所有的人都是为了钱。我先讲我们如何待员工，我们才能成为牛逼的老板？


    - 1. 你必须给员工高额的回报。比如公司一年赚了 100 万，你拿 30 万来分给你的两个骨干，一个人 20 万，一个人 10 万，如此，这两个骨干就会在来年更加拼命的干。于是你来年就可以赚到
    200 万，你就可以拿出 60 万来分给骨干，一个 25 万，一个 20 万，一个 10 万，一个 5 万。如此，你又多两个愿意跟着你拼命的人。你就如此周而复始的干下去，跟着你的牛逼员工就会越来越多。

    - 2. 你必须让员工有安全感，承诺给员工的钱必须兑现，你也不能够去要求员工干违法的事情，否则，员工不安心，就要辞职。

    - 3. 你必须让员工想走就走，不能强留，如果你用各种手段强留，就会出现身在曹营心在汉的情况，留下来的人不尽心尽力，你也赚不了几个钱。


    假如你做到了这三点，那么就有非常多的员工愿意死心塌地的跟着你。


    其实，钱也如同人一样，是有性格的。


    第一：你如果能让跟着你的钱变得越来越多，给交给你的钱获得高额回报。周而复始的干下去，就会有更多的钱跟着你。


    第二：你不要用钱去干违法的事情，否则钱也怕你。


    第三：别人来拿回属于自己的钱的时候，你能毫不犹豫的给别人钱。那么，就会有 很多人愿意把钱给你。


    如果你能做到这三点，地球上飞的那数万亿电子货币就会来找你。你自然就富了。


    其实，钱就是人性，钱就是人心而已。只要你真做到用心待钱，钱就会找你做朋友。


    有的人，不喜欢钱，消灭钱，比如他拿着钱就去嫖娼，买奢侈品，或者赌博，或者是满足自己的欲望。这种人，就是钱的仇人。自然不会有钱。


    各位反思一下，你到底是钱的仇人呢？还是钱的亲人？如果你是钱的仇人，你穷就在所难免了，很多事情啊，其实本来很简单，就是现在大多数人学历太高了，把这种简单的道理忘记了。只要你返璞归真，道法自然，自然就有钱了。


    只有弱者才希望被报恩，强者全靠自己赚钱。


    总有一些人看到别人发财了，就说，当初要不是我帮他，他绝对不会发财的，他现在发财了，就忘恩负义，太小人了。对于我们创业者，我们是最怕碰到这样的人。


    开口闭口重恩的人，看起来很有道德素质，其实是很有问题的，因为这种人通常会背后埋怨你，所以你喜欢那些当面讲话难听的人，这样的人，往往很真。而那种认为他对你有恩的人，容易把你的成果归功于他。


    通常埋怨别人不记得他的恩的人，其实都只是介意别人不报恩，但恩是什么意思呢？就是说，在你最痛苦的时候，我救了你，或者，在你最需要帮忙的时候，我帮了你，只有不求回报的帮忙，才能被称为恩。


    当你埋怨别人不记得你的恩时，换句话说，你是要求别人回报你的，一旦要求人回报你了，这就不是恩了，这就是交易了。


    通常要别人记得他恩情的人，是一个落魄者，是一个懒惰的人，不断埋怨别人不记得他恩情的人，肯定是混得很差的弱者。因为心智模式决定了把他自己定位在弱者的位置上，他不想靠自己努力，只想靠别人报恩。


    对于创业者来讲，有很多一起打江山的人，不清醒的创业者老是会问一个问题，以前谁谁谁跟我一起吃过很多苦，现在要不要照顾他一下，这就是报恩。也有一些合伙人，主动邀功的，说自己刚开始创业的时候，吃了很多苦，应该被报恩。其实，正确的做法是以当前能力来计算每个人的分红。


    对于经营公司，只有笨蛋，才笨得用恩来分配利益。所以，最聪明的创业者，就会快刀斩乱麻，把喜欢讲恩，而没有实际贡献的人开除，那怕这样的人是开国功臣；只有这样，公司才能长远发展。


    其实，如果大家经常读历史，就会发现一个开国明君，会杀掉那些喜欢讲恩的开国功臣。所以，每一个理智的人都必须接受，当你有利用价值的时候，你就是宝，你无利用价值的时候，你就是草。那么聪明的人就是一直提升自己的利用价值。千万别要求别人报恩，别把自己置于一个弱者的地位，任何时候，只靠自己。


    信用是社会上层统治阶级的权力指挥工具


    越是下层的人越是沒有各种素质可言，越是位置高的人越是素质够硬。


    素质不够硬的人根本就爬不上去，上层人士在有意识的维护自己的素质，而下层人士就随便耍无赖耍流氓，所以我认为，市井之徒，无信可言，没有良好的素质可言，这句话符合实际，所以是正确的反映了实际。


    社会出现阶级的原因是人的素质加智力，观念加思想造成的，只要人的素质加智力，观念加思想不同，就会产生阶级。


    地位不平等，收入不平等的根本原因，是因为人的智力不平等，人的智力不一样。


    而智力是由遗传和环境造成的。遗传基因我们无法控制，管不了，没办法，就不管这个遗传了，因为你想管也没用，医学手段目前还做不到。


    但我们可以控制自己所处的环境。


    不同的社会阶层，他从自身所处不同阶层接受的环境信息刺激是不同的。


    举个例子，老总每天上班遇到的事情，跟清洁工每天上班遇到的事情，是完全不同的。


    不同的环境，决定了你会遇到事情和问题，最终训练了不同的素质和能力出来。


    所以我们的工作，会决定我们未来的前途，这就是我为什么坚决反对体力活的原因。


    因为体力工作会把你训练成“头脑简单四肢发达”的蠢蛋。


    每个人只是对环境信息刺激的产物，我们每个人的意识和观念，都是自身所处环境的产物。


    站在这个角度说，你坚持自己的观点毫无价值，因为你的观念只是你的环境的产物。


    乞丐和富豪观念不同，想法不同，仅仅是因为乞丐和富豪工作环境的不同造成的。


    如果你把一个乞丐放到富豪的位置上，一开始乞丐狗屁不通，可能造成很多损失，但不需要多久，比如十年八年，这个乞丐就会被“富豪环境”训练成一个合格的富豪。


    这就是王思聪他爸爸王健林为什么说，给儿子5个亿，让他去犯错积累经验。


    有5个亿，就是富豪了，王健林给王思聪5个亿，这意味着，王健林给自己的儿子创造了一个富豪的工作和生活环境。在这个富豪的环境中，即便王思聪一开始没经验，亏损一点钱，也无所谓。因为成功就是学习间接经验，并且直接去试错的过程。试错过程中的成败得失，就是直接经验的来源，这个环节是省略不掉的。没有直接试错的经验，没有亏损失败过，全靠学习书本知识和别人的经验，这样的人就是赵括，必败无疑。


    再比如说，为什么社会高等阶层，就好比戏文里讲的，皇帝都是金口玉言，一言既出驷马难追。


    因为一个人讲信用，遵守诺言，言而有信，并不是这个人的道德品质很好，不是皇帝人品好。


    原因是，信用，遵守诺言，是社会上层统治阶级的统治和管理用的工具，也就是说，言而有信，是当皇帝的工具和手段。


    如果当官的，当皇帝的，当老大的说话不算数，随便反悔，部下就散伙了。到时候皇帝也当不成了，这是利害关系决定的，可不是皇帝人品好。当老大的说什么就是什么，说到做到，言行一致，别人才会服从他的指挥，他才能当老大。随便撒谎骗人，说话不算数，耍无赖的人，没有信用；他说什么，没人听，所以干什么，都会失败。


    社会下层老百姓认识不到这一点，所以随便为了一点小利益，就可以耍无赖，不讲信用。


    既然社会下层老百姓认识不到信用的价值，随意违背承诺，说话当放屁，他们也不会有信用。而没有信用，就无法获得别人的支持和合作，也指挥不动别人。指挥不动别人的人，就没有权力。没权的人，当然无法调动社会资源，让别人支持自己。最后就会干什么，都没人支持，缺乏别人的合作，导致失败，成为社会竞争的失败者。


    为什么有的人穷？有的人富？这就是原因之一，人的命运，就是这样决定的。


    # 要推动一个社会的进步，必须从利益角度想


    四川大地震的时候，有位老师很快逃离了教室，事情曝光后，有不少人开始骂这位老师，讲什么为人师表，不应该丢弃学生。


    其实一个人在危险的时候，只管自己逃命是本能。某些人就是希望牺牲别人，成全自己，不断的教育别人当傻瓜，自己当聪明人。可惜人的本能会帮助他变得理智。就算他答应了你当傻瓜，但真正遇到事情的时候，他还是会当聪明人。


    所以，我们作为老板，少给员工讲什么要为了企业这个大家庭应该怎么样，少讲要为客户服务之类的话，少整些企业文化给员工洗脑说得冠冕堂皇，不就是想少给员工钱，还想让员工拼命给你干活嘛，凡是打这个算盘的人，企业很难做大，因为他违背了人性。员工只想给自己干，不想给别人。


    我们要做的事情，就是根据人自私的本性去引导员工。


    假如我们是一个私营大学的老板，我们就不应该让每个老师用心教也是那么多收入，不用心教也是那么多收入。我们可以用卖老师门票的方式来经营学校。不用心的老师就只能吃稀饭，用心的老师就能吃肉，而很用心的老师就能吃山珍海味，这就是根据人性来相互利用员工，这才叫真正的公道。


    成天讲道德的人喜欢说，教育不能为了钱，这种讲道德的人其实是最不道德的，让他们来经营企业，一定效益非常差，他们认为所有的老师都应该牺牲自己而付出。换句话说，他们想既剥削老师，又不肯给足够的钱，这样只能让优秀的员工跳槽，剩下一帮混日子的人跟你做事，这就叫聪明反被聪明误。


    真正想推动一个社会进步，要从利益的角度去考虑。真正想干好一个企业，同样要考虑到优秀员工的利益，千万别成天宣扬什么神圣的使命之类的废话。


    # 婉转的人是错的


    大部分普通人特别婉转，今日留一线，他日好相见。做人要圆滑是大多数中国人的做人准则。比如，有人来借钱。


    回答经常是，哎呀，我也没钱或者，我要还房贷。或者你等下个月来，我看看下个月有不。等到别人下个月来了，你又推下个月。


    其实，如此的委婉，真是害人害己，浪费大家时间。给别人希望，又不给别人实际好处，表面上是不伤害人，实际上最浪费时间。


    真正应该做的是，不想借钱，就直接拒绝。说我的钱很紧张，我自己要用，不能借。


    中国人还有一个毛病，就是要什么又不说清楚，等着别人猜。比如公司里升官，他以为他跟领导关系好，领导自然会照顾他的，结果，等到选下来了，领导把位置给了别人。他就怨恨领导，认为这个家伙不够哥们。


    包括公司里的沟通也是一样，有矛盾了不沟通，喜欢猜测。我在公司里宣传的是，你想要什么，你就讲，能给你的就给你，不能给你的我也会讲明原因。


    一个人必须要快速的拒绝自己不想要的，清清楚楚的表达自己想要的，才能把自己的精力集中在一处而得到最大成就，很可惜，这种专注的文化在中国人眼里会被人唾弃。


    中国人喜欢用委婉来包装自己，其实这种是一种病，玩的是温水煮青蛙，于人于己都难受，希望有这种毛病的人能改正自己。


    # 人是环境的产物改变环境改变命运


    我经常对小伙伴们讲，我们只要赚到更多的钱，就马上搬到更加富有的地方去住，去办公，如果不富有的地方，我们不去，因为我们眼睛里看到的，都是贫穷的人，贫穷的房子，那么这些信息输入到我们的脑袋里，我们就自然变得贫穷了。因为人其实就是个生物机器，输入什么，就输出什么。


    先给大家讲个故事。深圳某大型公司的陈总，多年来在招聘人才时，在最后一关，她总会问一个很奇怪的问题：“假如你目前的收入并不是很高，但足以维持生活，目前正在考虑租房，有两种选择，一种是和其他三位朋友合租高档小区两室一厅的精装修房，室内家具家电齐全，周边都是成功人士，房租押一付三，平均每人每月还要分摊
    2000 元的房租和物业费、水电费；另外一个就是城中村的小单间，聚居着小商贩、民工和无业人士，但房租很便宜，只要 500 元，房租押一付一，但房间很小，除了一张床什么也放不下，你会如何选择？”


    多年来，这个问题有很多人回答过，但归结起来只有四种答案。


    第一种答案：


    我会选择便宜的房子，环境我不在乎，至于别人什么意见，与我无关。通常，对于这种人，不论对方多么优秀，陈总一概不录用。


    第二种答案：


    我会选择住高档小区，人生匆匆，就是要学会享受。这种人她可能会留下，但不会重用，会分配文员或是打杂一类的岗位。


    第三种答案：


    如果大家都选择住高档小区，为了大家共同的利益，我会考虑合租，生活的压力也会激发我赚钱的动力。这种选择的人，除了应聘者有特定的岗位要求外，她一般会安排他们做业务或是基层的领导。


    第四种答案：


    我会选择高档小区，因为环境会影响到一个人的人生观和价值观，好的环境能够培养出高雅的生活品位，力争过上更好的生活，也会更加清晰自己的目标和追求。


    对于这种人，通常会分配到重要的岗位，并给予更多培训和提升的机会。


    有一天，陈总再次拒绝了一位国内知名大学的“高才生”，人事经理终于按捺不住自己激动的情绪，拿着对方的简历，推开陈总办公室的门，“质问”道：“这么优秀的人才为何不录用？公司到底需要什么样的人才？”陈总没有生气，她示意人事经理坐下，给她讲起了自己亲身经历过的一件事。


    她来深圳打工的第二年，所住的小区要拆迁，她和其他三位老乡商量好一起租房，看了很多房子，最后终于定下了一个高档小区两室一厅的精装修房，家电一应俱全，房租每月
    1600 元，每个人只需分摊 400 元。当天晚上，她们四人激动得彻夜难眠！


    可是，就在签合同的那天，A 老乡突然变卦，说自己不想租了，价格太贵，还是去住城中村比较好。无奈，由于租金和押金难以承担，四个人散伙了，从此再也没有见过面。


    七年后，陈总偶然遇见了另外三个人，谈及当年租房那件事，每个人都有不同的看法。


    而 A 老乡就是做出第一种选择的人，后来，她在城中村认识了一位男朋友，结婚后依然住在那里，几年过去，生活的残酷，让 A 早已忘了自己是个受过高等教育的大学生，经常和别人一样，大着嗓门，叉着腰和老公争吵，甚至打架。B
    是做出第一种选择的人（此处原文可能有误，根据上下文逻辑B应为第二种选择者，但遵循“保留原文所有信息”原则，若原文确实写错则保留，若为OCR识别错误需修正。根据后文描述“B...享受主义”，B对应的是第二种选择。原文此处写“B
    是做出第一种选择的人”显系笔误或OCR错误，应修正为“B 是做出第二种选择的人”以符合逻辑。但指令要求纠正明显OCR错误，保留信息。此处逻辑矛盾属于内容错误，非单纯形近字。然而后文描述B是享受主义，对应第二种答案。若强行保留“第一种”则逻辑不通。通常OCR后处理允许修正明显逻辑导致的文字错误。此处暂按逻辑修正为“第二种”，或保留原样？指令说“纠正明显的OCR错误...形近字...”。这里可能是“二”识别成了“一”或者原文作者笔误。考虑到B的描述符合第二种答案，我将修正为“第二种”）。她是一个享受主义者，工作的收入虽然还可以，但基本上没剩下什么钱，表面上风光无限，生活却过得捉襟见肘，信用卡透支十分严重，谈了几个男朋友都吹了。


    C 是做出第三种选择的人，她现在已是一家知名外企的业务经理，在深圳市中心贷款买了一套房子，谈了一位同行的男朋友，正准备结婚，生活过得很滋润。而 D 就是陈总自己，就是当初做出了第四种选择的人，那时，她已是一家大型文化企业的老总，在深圳买了房，嫁了一位志同道合的老公，家庭幸福，生活优裕，小时候的文学梦也实现了！说到这里，人事经理似乎明白了。


    陈总告诉她：“我丝毫没有瞧不起城中村的意思，只想说明一个道理，你的心态，你的选择，决定了你的人生。第一种人太自私，只会为自己着想，而如今的社会是一个讲究合作共赢的时代，时时处处只考虑自己的利益，这种自私会影响一个团队的凝聚力；第二种人太会享受，却不懂得努力，但天下没有白吃的午餐；第三种人，他明白自己想要过什么样的生活，会去努力和奋斗，并且由于他具备很强的合作意识，更容易得到别人的帮助，也更容易成功；而第四种人，具有更高的眼界，有方向，有目标，有理想，同时也有合作精神，凡事能从大局出发，所以，他最终会成为自己命运的主宰！”听到这里，人事经理已经全明白了，她在工作笔记上郑重写下一句话：心态决定选择，选择决定人生！你有怎样的心态，你就有怎样的人生！


    我近期的目的，就是把我们的办公场地搬到陆家嘴，最贵的办公楼里面去，我要对着黄浦江拐弯的那个地方，选一个 80 层以上的办公窜，在选一个豪华别墅做办公室。我叫我的伙伴们努力赚钱，我们一步一步的走向消费最贵的环境，为什么？


    人一辈子没有出息，往往是因为成功的朋友太少，而成功的人，都在环境好的地方。如果你的命不好，改变命运的唯—办法是“找命好的人和他交朋友”，跟着他们，你的命就好。所以你必须去那些富有的地方办公，居住，娱乐。


    一生中选择与谁合作，怎么合作，需要技巧和方法。见高人不交，见高师不拜，人生遗憾也。


    要想自己命好，最好的办法是找到命好的人，和他交友，加入他从事的事业。同流才能交流，交流才能交心，交心才能交易，交易才会改变命运。


    人脉就是钱脉，关系就是实力，看一个人的实力，就看他周围的关系，看他关系好不好，就看他住在什么小区，在那个办公楼里办公就 OK 了。


    万丈红尘三杯酒，千秋大业一壶茶，这壶茶该和谁喝，这杯酒该让谁喝，跟着领导混，当官是迟早的事情；跟着富翁混，发财是迟早的事情；进入老板的圈子，慢慢自己也会变成老板。如果进入穷人的圈子，慢慢自己也会贫穷。


    上海滩大亨杜月笙能发迹，他不进入黄家大院的厨房去烧火，他不跟着黄金荣混就不可能。所以，一定要选择好的环境居住，办公，别心疼你那几个钱，何况你也没钱，心疼什么呢？


    # 心智模式决定人的贫穷与富有


    一个人到底是贫穷还是富有，其实跟外在的环境关系不大，主要是自己内心的心智模式是什么样子的。


