    第二：物流行业的发展，使我们的产品可以成本很低卖到全国，甚至全球，运输，交通的发展，也使得很多人都可以远离家乡工作或者出游。旅游业以及相关产业在未来 10
    年会越来越牛逼。


    第三：今年的两会特别提了一个热点，就是创业。国家对创业进一步放松了管制，对金融体系，小额贷代，互联网金融放开了很大的口子，特别提倡了互联网+这样一个概念。国家的方向如此，我想互联网这个行当的创业，大家需要仔细考虑一下，怎么能在这个行当捞点好处。


    第四：产业之间交集越来越多。新的创业机会往往孕育在两个或者多个产品的交融处，很多产业之间的界限越来越模糊，大部分生意


    与互联网结合将是一个强劲的趋势。


