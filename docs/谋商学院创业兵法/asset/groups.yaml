    个小时不等。我节约的时间就投入到工作与学习中。当年的那些同事认为我这个人很奢侈，实际上奢侈的是他们，他们愿意用自己一个小时的生命来交换 100 块钱。只用了半年时间都不到，很多同事就成了我的下属。很多事情其实是个简单的思想问题，大家想通了就会非常简单，想不通就苦逼一辈子。


    富人聪明在什么地方呢？这些穷人看来天大的事情，其实只需要一笔钱，就能完全解决掉。甚至是每月多赚一万块，穷人的所有问题，都变得不是问题了，问题可以找其他人代劳，而自己也专心赚钱。当赚钱赚的越来越多的时候，这些事就越来越不是问题。


    那些聪明人花 3000，4000 块钱请个保姆，洗衣，做饭，拖地，甚至叠被子，都不用自己做了，每天至少节约 3 到 5 个小时，而且保姆很专业，做得比自己好得多。每天都可以穿洗过的衣服，吃香喷喷的饭菜。聪明人所有的时间花来看书与工作，参加提高自己的培训。这样，聪明人会越来越聪明，工作做得越来越好。


    而笨蛋从来不舍得投资自己，从来不参加培训提高自己，也不喜欢看书，更加不拼命工作。


    所谓术业有专攻，穷人就是会得太多了，会得多，就不专业，每一项都做得普普通通，在社会上毫无竞争力。


    所以我建议现在贫穷的人，把你的钱都花出去，用来买时间，用来学习和工作。越是贫穷，越不要看重钱，你能节约几个钱？能赚钱才是王道，你一年本来就赚不到 20 万块钱，节约起来有意思吗？毫无意义啊。


    人是因为优秀才有优秀的朋友


    部分人总觉得老天不公平，自己孤独，说那些优秀的人都有自'
  - '[PAGE 41]


    己牛逼的圈子，如果他们没有那个圈子就什么也不是。看起来好像很正确无比。比如俞敏洪进入了北京大学，有了徐小平，王强这些同学，才有了后来的新东方。但我想说，首先俞敏洪能从农村考进北大，能和优秀的人成为朋友，这本来就证明了俞敏洪是一个优秀的人。只有你是一个优秀的人，其他优秀的人才愿意和你交朋友。如果你不优秀，那么挖空心思混迹各种牛逼的圈子，实际意义上大。越是优秀的圈子，大家越是精明。表面看起来优秀的圈子的人好接触，平易近人，彬彬有礼，实际上并非如此，而是因为他们不得不这样，以免得罪人。真正要与优秀的人有所深交，你必须也是很优秀的人，必须能和他们交易。不管是精神上的，还是物质上的。社会本来就是一个交易系统，别指望优秀的人做亏本生意，大家在一起，就是互利互惠，这从另一个角度也能说明，如果你价值不大，不愿意或者不能做出对应的贡献，那么你也是交不对应层次的朋友。


    所以我不建议创业者去外面混什么老板圈户，商业圈子，因为这毫无意义，简直就是浪费时间，大家都精明得跟鬼一样。而自己专心去拓展自己的业务，好自己的事情，才是正事。等自己把业务做好了，把自己的事情做好了，你会惊奇的发现，你的圈子也随着你的事业水涨船高。你周围自然就聚集起来优秀的人，那些不优秀的人就会自动远离你，就算开始大家在一起，不优秀的人也会自动神队。


    而如果你一心一意的想去靠别人发财，想去混个什么圈子企图改变自己的社会地位，经济地位，其结果只能是徒劳。就算侥幸被你混进某个高端圈子，你也只能是那个圈子里的可怜虫，当然如果你纯粹是为了进入高端圈子学点经验的，我觉得也可以短时间混一下圈子。'
  - '[PAGE 42]


    一句话总结，就是物以类聚，人以群分。创业人更加要踏实，有梦想，但是**要按计划，一步一步的去实现**。


    观察，理解，**然后改变这个世界**


    创业成功，赚到几个亿，其实蛮简单。我一直在思考，我们人来到这个世界上首先应该干嘛？明显是观察这个世界，享受这个世界，只有你细心的观察这个世界，你才会发现些什么，然后你要试着理解这个世界。很多人找不到赚钱的门道，辛辛苦苦一辈子，依然贫穷，而有的人呢，轻轻松松就赚到钱了。就是理解世界的程度不一样，角度不一样。


    农民工对自己的孩子讲，学个电焊，学个挖掘机，学个厨师就能有口饭吃，这是农民工对世界的理解。这种理解，自然是很难赚到钱的。


    很多工人对自己的子女讲，好好学习，考一个好大学，将来能找到一份好工作。这种理解呢，只会成为一个房奴式的工薪阶层，自然也是难以赚到钱的。


    像我们这种人，既不学技术，也不好好找一份工作，一心只为创业，只为做企业，只当老板，其他的事情绝不干，这种理解世界的方式，比前面两种人要多赚点，但还不够牛逼。


    我当年写程序，做网站，开公司也赚了几个小钱。我们有一个投资人，年初投了几十万，年末就直接赚了几十万，回本了，后来他就一直拿这个企业的分红。这个投资人，一年到头都不来公司来看看，而且他投资了好几十个这样的小企业。他赚得是最多的。为什么他中了这么多？就是因为他的理解世界的方式不一样。


    在赚钱与创业这条路上！怎么知道自己理解世界的方式错了？'
  - '[PAGE 43]


    答案很简单，就是你干了半年或者一年，依旧很贫穷，没有赚到钱，就说明你理解世界的方式有问题。你就要迅速学习新的理解世界的方式。


    结果是最好的检验你的思维是否有效的工具。


    我现在的重点工作就是全面，充分，精准的理解这个世界，这能让我的决策更加的正确。


    只有理解了这个世界，我们才能改变这个世界，创造一些市场上真正需要的产品与服务。只有理解了这个世界，我们才能明白这个世界需要我们为他做些什么。比如，快的打车的创始人为什么要做快的打车这款软件？就是因为他自己打车的时候不方便，他认为如果我们做一个软件，能点一下，就把车叫过来，这样不就更加有效率？于是，他就做了这样一个改变世界的软件，顺手就把企业做到了上百亿。


    只要你理解这个世界，你就会找到很多可以改变这个机会，比如传统行业都需要用新技术去提升他们的效率，都可以借助互联网工具进一步升级，这里面就有很多改变世界的机会。所以，我肯定，只要你选择一个领域，用一些新技术，新工具去改变你理解的这个世界，那么赚上几个亿也是容易的事情。


    # 成功在于持续的重复一件小事


    前面有一期节目讲了品牌建设的重要性，你一定要在你的品牌建设里面，把你的第一给挖出来，猛宣传那一点。


    也就是说你的产品或者服务最具有优势的那一点，就是你发展的方向，既是你的战术也是你的战略，公司所有的资源都应该投入到这一点上。'
  - '[PAGE 44]


    一招鲜，吃遍天。程咬金三板斧，谁又躲得过呢？**百招会不如一招精，把优势发挥到极致。**


    穷人就是什么都会的人，富人就是只会一件事的人。


    创业做项目，计划多了没用，90%的困难你现在想都没有想到，你都不知道那是困难。你既然连困难都不知道，就应该赶快去干。


    **很多事我们想不明白，那就把它干明白！** 创业人之间是争论不明白的，公说公有理婆说婆有理，但一干就明白了。


    我做了很长时间的招聘，非常难招聘到自己满意的人才。聪明的企业家就是把复杂的事情简单化，然后让能力差的人分工合作，以此把事情干好。要善于与“傻瓜”打交道，因为“聪明人”是不会与你合作的，他们自己创业了。


    做成功一个项目的第一单声你大的成功就不远了，所以你首先就是脚踏实地、集中精力地先做第一笔业务，创业刚开始最忌讳做三五年要怎么了么样的梦，先脚踏实地做出第一单。万事开头难，开头干出来了，也就成功了一半。


    **做项目，选择一个极小的服务或者产品，先在这个领域内做到第一，然后在上下游稍微延伸下就行了。**


    大器晚成并不是说到了 40 岁才发力，而是你必须在 20、30 几岁的时候就很拼，基础打好了，才能盖高楼。


    什么样的员工是合格的员工，能干，能做出贡献，就合格，而不是学历高。


    实用的才是最好的，能盈利才是最重要的。


    有想法没办法的人很多。社会大学是最好的大学。我们每个人'
  - '[PAGE 45]


    一定要持续进步，持续学习。拒绝招聘只有想法不干活的人进公司。


    如果我认为自己还取得过一点点成绩的话，那只是因为我不断的重复：


    重复读同一本图书，重复做同一件小事，不断的重复，你就会发现很多秘密，所谓书读百遍，其义自现，做项目也是如此。


    我总是努力的在重复中去发现不同，重复重复再重复，重复的价值今天在无限放大。


    现在社会节奏太快，新鲜事物冲击大，很难静下心来长时间对一个项目投资精力。大部分人都没耐心，只要你有耐心重复干一个小项目，你非常就出类拔萃。


    坚持就是胜利，坚持体现力量。


    厄普代克写一本兔子快跑，就是一本书。但等他再写出兔子归来和兔子富了，就是人物了。等之后再出七本关于兔子的书5兔子嫁人，兔子伤心，兔子老了，是垃圾还是珠玉不论，厄普代克就逼近不朽了。


    有个叫罗伯特清崎的人写了 20 本书，全部都是穷爸爸，富爸爸，所以，他也出名了，也财富自由了。


    世界级的营销专家，一辈子都在研究营销，比如科特勒，李阳一辈子研究英语，李嘉诚一辈子研究企业。很多超级大企业的 CEO都是几十年如一日的重复。其实很多人羡慕这些大企业家，可是这些平凡的人，根本不知道，这些人都是早上六点干到晚上
    10 点的，一直在重复那些工作。


    我看到美团王兴在网上发表过的一句话：“今天决定 12 点之前'
