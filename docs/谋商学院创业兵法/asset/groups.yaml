    因为这个社会，是个 M 型社会，古往今来，都是成功的人越来越成功，失败的人越来越失败。以前的大学生少，毕业后能找到份好工作，日子相对好过些，现在满大街都是大学生，虽然都能找到工作，但基本上都是处是月光族，处在一个不饱不饿的阶段。大家要快速改变自己的观念，否则，时间越往后面走，失败者与成功者的鸿沟会越来越大，向社会上层爬更加难。


