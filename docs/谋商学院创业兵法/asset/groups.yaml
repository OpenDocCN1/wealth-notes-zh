    所以，一个成功的投资人必须先成为一个成功的企业家。成为一个企业家还有一个好处，就是你的企业不断的在给你提供现金，你可以拿这些现金不断的去投资。


    我的做法很简单，我是把钱拿来投资我的员工，我的员工当中有特别优秀的人，我就会辅助他做一个小业务，我出30%的钱，他出70%的钱，我占10%到20%有股份，并且给他一些做企业的建议。帮助他做成功。我只投资我熟悉的领域，基本就是我们企业业务的上下游延伸，这样成功几率高很多。


    如果各位有心玩投资，你就会慢慢爱上这个行当，因为，这是一个钱赚钱的行当，你终于不用自己起早贪黑的操心企业里的事情，面是每年等着分红。然后游山玩水，有钱有闲，终于可以天天陪老婆孩子了。前提是你看准了人，投资本质上拼的是看人的眼光。


