    这些年没少招聘，我基本上每天面试 1 到 10 个人。刚开始没有经验，每回招人都找最好的，什么新加坡理工大学的，英国留学生。工资 4000 多的售后服务岗位经常招名牌大学本科生，英语过八级。后来发现，招来人根本留不住。本来简单工作的岗位，大专生完全能够胜任，找个本科生双方都不合适，只是在写公司简介时方便吹牛。员工  对自己的工资期望高，但这个岗位上也发挥不出来他英语八级的能力。时间长了还要脾气。后来招聘一个大专生，大专生就老老实实的在这个岗位上干得很开心。所以，找人不是越优秀越好，公司是一个生态系统，需要优秀的人的岗位放优秀的人，需要普通人的岗位放普通人，主要是能力与岗位匹配最好。


