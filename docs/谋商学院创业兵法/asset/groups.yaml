    我最近的反思，以后我的日志是每天的第一件事，语音也是日志写完后后马上就要做的事情；不能拖到后面感觉越做越吃力，这都是进步。


    ## 网络营销的三个步骤


    我们做网赚暴利项目营销有三个要点：


    - 1. 分析到底是谁为你的项目买单。我们需要研究我们的客户群体到底是谁，任何企业的产品都是卖给特定的用户群体的。这要求我们必须分析清楚产品到底卖给谁。比如
    脑白金：这款产品，他不是卖给老人的，他的定位是 “送礼”，他的广告语：“年轻态，健康品”、“孝敬爸妈脑白金”、“今年过节不收礼，收礼只收脑白金”。这明显是卖给送礼人的，而且这个送礼人是子女，收礼人是爸妈。说明了，脑白金
    的客户群体根本不是吃“脑白金”的人。分析透彻了，你才知道你的营销资源，营销策略该投入到什么地方，投入到那些人身上。

    - 2. 营销资源的准确投入。比如我们做网赚暴利项目分享，我们的营销策略当然是找到比较有冲劲，想赚钱的人。有创业欲望的人。而且这个类人要有一定的文化，会上网，认可互联网上能赚到钱。其实很多人都在互联网上赚到了钱，但是就是有一部分人观念改不过来，认为都是虚拟的，不靠谱。这部分不认可的人，当然就不是我们的营销对象了。所以，我们营销资源的准确投入应该是互联网创业论坛，网络推广人员论坛，大学生创业论坛等相关领域。我们就
    shouldn''t 跑到什么相亲论坛去做营销了。

    - 3. 持之以恒的做营销。我们既然选择好了一个项目，就需要不断的研究这个项目，有工作人员对项目进行广告推广。半年时间过去了，或许在这个过程中，我们又碰到新的暴利项目，并且确定能赚到钱，但是我们也不会去做。比如我们发现小额贷代的网络项目，倒卖假古董的网络项目。我们虽然知道这种项目很赚，也知道怎么操作。其实互联网项目都是相通的，但我们不会去做，原因很简单。如果我们换新项目，那么老项目的投入就白白浪费了。


    做网赚，不能三心二意。选好了项目，确定好战略计划，我们应该坚定不移，持之以恒的去做。人一辈子，能做好一件事情，就能发财。很多人，一辈子做了很多事情，却没有一件事情做得出色。当然也就赚不到钱。


    我希望，我们 VIP 群的人们，做我们给出的暴利项目的时候，确定好一个项目，就别换来换去的。至少死磕三个月，一般情况都是能赚到钱的。别一个月做好几个项目，就死磕三个月做一个项目，赚不到钱再换，也不后悔。


    # 第四章


    # 创业者的思想


    # 不断学习赚钱思想，自然就富了


    华人首富李嘉诚常打一个比方：一个人从现在开始，每年存 1.4 万元，并都能投资到股票或房地产，获得每年平均 20% 的投资回报率，40 年后财富会增长为 1
    亿零 281 万元。


    如果我们细算账会发现，按这种方式操作，第十年仅能攒 36 万元，在很多大城市还不够买一个卫生间。别着急吐槽，坚持下去，到了第 20 年，这笔资产就积累到了
    261 万元，如果你能坚持 40 年，财富就会到达 1 亿零 281 万元的惊人厚度——这就是神奇的复利投资。


    > 爱因斯坦说：复利的威力比原子弹还可怕。


    是不是有人要抱怨四十年时间太长？没办法，基数有限，只能靠更多时间去弥补，想要更早实现财富目标，你需要先完成一定的财富基础。


    对普通人来说，人生积累财富过程中最重要的分水岭莫过于 100 万元。靠自己积累到 100 万元，你的经商能力，处事能力，甚至带团队能力都提升上来了。


    李嘉诚就说过，赚第二个 100 万时要比赚第一个 100 万简单容易得多，简直就是顺手就赚来了。李嘉诚在不到 30 岁的时候，就完成了这个跨越，回顾一些知名富豪经历，他们也大多在
    30 岁左右就完成了这笔积累。


    放到当下，如果你还没有跨过 100 万门槛，在应付完各种高昂的生活成本之后，其实能用于投资的资金非常有限。越早完成靠勤劳存钱的阶段，你才能越早进入以钱赚钱的阶段。所以你积累第一个
    100 万元所用的时间长短，基本能够决定你一生的财富厚度。


    马云为什么买买买？其实买的是时间，这个世界最美妙的就是用钱买时间，只是很多笨蛋不懂。我就特别喜欢买书，买知识，因为如此，就相当于买到了时间，买到了未来。


    我们该如何快速积累 100 万元呢？打工的除了在本职工作上努力拼搏谋取升职加薪，还可以考虑创业开辟人生新道路，更重要的则是不论钱多钱少，从一开始就养成投资的习惯。不会投资马上学，找各种各样的书，各种各样投资达人的微博去学这些知识。


    每个致富的人，只不过养成了一般人不喜欢，且无法做到的习惯而已，即学习投资理财的知识。你可以完全不会，只要你现在开始学投资的知识就行。


    只有掌握穷变富的知识，才能变富。我能赚钱，就是我买了很多书，买了很多讲座，买了很多培训，我把这些东西糅合起来，然后运用在自己的企业经营上，做出服务与产品卖给了别人，我就赚钱了，买一本书只要
    50 块，给我带来的效益是几十万，甚至更多。


    贫穷者的可悲就在于，他的钱很难由生活费用变成知识，更加不去买那些值钱的经验。所以，贫穷者就只能一直穷下去。


    牛人的想法，观念，思想都是能变成钱的知识只是穷人对这些东西笑一笑就走开了，从来不去深入专研，所以只能穷下去。


    我赚的第一笔钱就是打传奇这个游戏，本来买了一个装备想自己爽爽的，结果看到别人想买，我就加了 30 块卖出支了，就赚钱了。当年 30 块钱是一个农民工一天的工资，而我只用了几分钟就赚到了。


    其实，贫穷者要变成富人，最大的困难是最初几年。你没有多余的钱，还得起早贪黑的干。


    对于白手起家的人来说，如果第一个百万花费了 10 年时间，那么，从 100 万元到 1000 万元，也许只需 5 年，再从 1000 万元到 1 亿元，只需要
    3 年就足够了。


    因为你已有丰富的经验和启动的资金，就像汽车已经跑起来，速度已经加上去，只需轻轻踩下油门，车就会疾驶如飞。开头的 5 年可能是最艰苦的日子，接下来会越来越有乐趣，且越来越容易。


    有公司，有团队，有钱，有经验，基本进入捡钱模式。贫穷者的财富只有大脑！不武装自己的大脑，简直就是放弃财富。


    贫穷者最宝贵的资源是什么？不是有限的那一点点存款，也不是身强力壮，而是大脑。以前总说思想是一笔宝贵的精神财富，其实在我们这个时代，思想不仅是精神财富，还可以是物质化的有形财富。


    一个思想可能催生一个产业，也可能让一种经营活动产生前所未有的变化。


    ## 教育是最大投资，想富就学知识


    学历只是一般教育的证明，学校里学到的只是一些综合性的基础知识，人一辈子都需要不断学习。江苏省 2003 年高学历者人均年收入超过 11 万元，小学文化程度者只有
    3708 元，二者相差近 30 多倍。经济收入的悬殊，已经造成实际上的高低贵贱，为什么收入相差这么大？其实就是知识造成的。教育是最大的投资，对很多贫穷者来说，他们的命运是和受教育程度密切相关的。


    不断学习赚钱思想，自然就富了。


    ## 和珅的创业精神


    其实，创业就是做服务，你能不能服务好你的主子，也就是你的顾客，如果你能完完全全的服务好你的主子，那么，你就能得到主子的奖励，绝非等闲之辈。


    他从 26 岁发迹，到 32 岁，居吏部尚书，历任几十年部门一把手。


    靠得是什么？


    首先，和珅是一个非常 has 学问的人，懂蒙古语，藏语，但是没有考上科举，靠着一个机会，当了皇家仪仗队的一个队员。


    有一天，乾隆皇帝坐在车中在外面游览春光，有个侍卫急匆匆的跑到轿子前，说云南急报，一个罪犯越境跑到缅甸去了。当时乾隆很生气，就说了《论语》中一句话：“虎兕出于柙，龟玉毁于椟中，是谁之过欤？”这话是什么意思呢？就是问这个事情，该谁负责任。由于周围都是粗人，没人听得懂，而和珅非常好学，听懂了，就回了一句：“典守者不能辞其责耳！”意思是说，是守卫的责任！。


    乾隆就回过头看了这个仪仗队员和珅一眼，这就是和珅发迹的开始。


    这说明什么？说明和珅虽然地位低下，但一直在准备，逮着机会，就能上，而其他人，由于没有准备，机会放到面前，也抓不住。这就是一种创业精神，一直默默的在准备。


    中国正在从制造业大国转型向服务业大国，要在这个时代获得成功，就要成为一个服务型人才，就不仅仅是满足顾客需求这么简单，而是要超额完成顾客的需求，用苹果公司的话说，就是，苹果公司不是在追求客户的满意度，而是在追求客户的尖叫度，打造自己感动顾客的能力。


    说回和珅，比如乾隆皇帝下江南，他不告诉和珅是走水路还是走旱路，和珅就得猜测乾隆的喜好，比如他知道乾隆喜欢写诗，和珅就跟公主说：皇上现在的诗写的越来越好了，我特别喜欢看，以后皇上写了什么诗，您给我拿过来，我好好学习。


    和珅就靠读乾隆皇帝的诗，体会到了乾隆的心境和偏好，最后他认定乾隆要走水路，而不是走旱路，和珅就做好了走水路的准备。果然出发前一天，乾隆就告诉和珅，要走水路。


    和珅这个服务功夫可是了不得。他能去分析顾客，从大量的隐性信息里面琢磨出顾客的偏好。有些顾客的偏好与需求，甚至连顾客自己都没有意识到，有时候又不好意思说出来，或者说不愿意告诉你。


    那么，如果你有能力自己去察觉到这种需求，那么顾客就对你产生好感与依赖，赚钱就水到渠成了。老板呢，就是要成天去琢磨顾客的需求喜好。


    还有一个和珅制造顾客感动的例子，大家可以琢磨一下。


    就是乾隆皇帝的母亲要去金山寺，拜佛，但金山寺台阶很多。而且很陡峭，要用轿子把皇太后抬上去是非常考验抬轿子的人的水平的。和珅就亲自训练轿夫。但后来发现轿夫的水平还是不行。他不放心，就自己当了轿夫抬着皇太后上去又下来。


    皇太后坐在轿子上，就说：“哎哟，和珅手下真能干，轿子抬得就像是在平地上一样，坐着非常舒服。”然后皇太后就要找和珅，叫了几声，和珅从轿子后面害羞地出来，穿着轿夫的衣服，这时皇太后才明白是怎么回事：“堂堂一品大员这副打扮。”


    乾隆站在一旁也非常感动，只是说了一句：“你呀你呀，你能做到这一步，我们君臣永不相疑。”


    这就是制造感动，就是能够制造惊喜，让顾客尖叫。


    后来和珅有些地方做得过分了，被乾隆罢免了，赋闲在家，但是后来又复出了，因为皇太后临死之前留下一句话，说她的丧事只能让和珅来办。这就是皇太后对他形成了成瘾性依赖，连死了都对他有依赖。撇开所有的封建余孽不讲，我们以上讲的是服务的精神，是老板应该好好琢磨琢磨的东西。


    我们要讲的是，打造优质的服务品质，为客户制造最好的服务体验，这当中一定要有真正的服务精神。只有这样才不仅能制造客户满意度，而且能制造客户尖叫度，不仅能够让客户在接受服务的时候满意，而且能对你形成一种成瘾性的依赖。


    我一直强调，做事就是要做到极致，先把自己感动了，才能感动顾客，感动了顾客，带着这种精神去创业。去做服务，不赚钱是没有天理的！


