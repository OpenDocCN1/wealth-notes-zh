    # 如何把自己宣传出去


    每个老板，都要宣传自己到底能为用户提供什么服务或产品。也要宣传自己的理念，价值观，思想给自己的团队，甚至给用户。


    我给出我的宣传经验。


    把要推销这个概念从自己头脑中拿掉，要把说服人这个概念从自己的头脑中拿掉。不管是企业内部，还是外部，人们都自然而然的抗拒推销。要用分享你的观点，分享你的服务的理念去做事，目的是帮助对方改善生活，帮助对方的出发点，去宣传你的理念，你的企业文化和你提供的服务。


    永远把他人的利益考虑在第一位。


    习惯性的宣传自己的理念，比如，我经常在公司里面宣传我的理念：努力工作是一种才华。我只是分享我的观点，并没有推销，但这给其他员工树立了榜样，表明自己是一个斗志昂扬，全神贯注的老板，直接增加了自己的领导力。


    经常与员工闲聊，或者在 QQ 上发表说说，在微信上发表动态，这样员工知道我的心理状态，也就知道我的理念。潜移默化的影响员工 积极工作，拼命奋斗。'
  - '[PAGE 284]


    比如与同事一起出去用餐的时候，我也会分享一些心得理念，有助于修正团队的理念，虽然不是讲的工作上的事情，但都是积极正面的东西。从侧面也调整了同事的心理状态，工作状态自然就好了。所以，我经常说，“老板必须是一个社会学家，也必须是一个心理学家。”


    还可以组织共同的读书会，一起读一本书，然后分享观点，在分享的时候，就可以夹带私货给员工。


    要有习惯写日记，写演讲稿，写材料，这样，自己的条理就越来越清晰，讲话也越来越有深度。更加有利于宣传你的理念给员工或者客户。


    只讲有对人有帮助的话，你的话对人没帮助，宁愿闭嘴。没有什么有价值的话讲的时候，就算大家请你讲话，你也要委婉的推掉，所以，平时的积累很重要。


    多读故事书，历史书，或者提炼总结自己碰到的有趣的故事，讲给大家听，优秀的宣传者是一个优秀的“说书人”，人们最喜欢听故事。你可以通过故事把你想传达给员工的思想传达出力。你可以专门挑选特定的故事，特定的人物给大家分享。


    洗脑是在无形之中完成的，宣传思想的时候，要注意跟你的听众互动，沟通，别只会蒙着头自己讲。与大家不断的互动大家才感兴趣，而且会迅速提高认可度。


