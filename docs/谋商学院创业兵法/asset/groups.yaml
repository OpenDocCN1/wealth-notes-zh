    ## 尊重重视身边地位低的人，别阴沟里翻了船


    我们当老板的，大多数都比身边的人经济条件好些，社会地位高些。容易有意，无意之间刺激到了身边地位低的人。心胸开阔的人可能就原谅我们了，而如果碰到心胸狭窄的人，那么就要倒霉了，犯这种小错误非常划不来。


    最近了解到一个新闻，简单叙述下，大家有兴趣自己到网上去搜索，就是一个保姆被这个家庭女主人无意间伤害到自尊了，这个保姆就在这家人都外出工作的时候，对小孩子进行了殴打。当然被视频拍了下来，这就是不尊重，重视身边地位低的人的后果。


    其实这都还是小事。我们历史上，有因为不重视，尊重身边地位低的人打了败仗，而差点丢掉性命的人，春秋时期的宋国大臣华元领军与郑国开战。


    华元准备与郑军开战的前一天晚上，杀羊煮羊肉汤给士兵喝，华元同志与士兵们开开心心的喝羊肉汤。华元同志的车夫没有吃到羊肉汤，所以就怨恨华元。当天晚上在床上翻来覆去的睡不着，感觉华元太不是东西了，有羊肉汤都不给自己喝。等到两军交战的时候喊开打。车夫就对华元说：“昨天晚上的羊肉汤，是你作主。打仗驾车，是我作主。”就驱车冲进郑军军中，宋军将士看得目瞪口呆，郑军活捉了对方主将华元，因此宋军战败。这就是不尊重和重视身边地位低下的人的严重后果。


    我喜欢研究李嘉诚。当年读到一篇报道，李嘉诚在宴请长江商学院的各位企业家的时候，吃完饭，与每个大企业家握手道别。最后李嘉诚看到离他有10几米远，站在门边的一个服务员，李嘉诚同志居然跑上去，主动跟这个服务员握手，表示感谢。我当年不懂这是为什么，这不是浪费时间？这不是多此一举吗？李嘉诚的身价多高，时间多宝贵呢？如今我才明白，李嘉诚不是在浪费时间，而是他看透了人间的规则，做事已经是滴水不漏了。


    这不是孤例，因为我看过一个李嘉诚的传记视频。李嘉诚去打高尔夫球，进门第一时间也是跟工作人员打招呼，问好。不像我们现在部分人，刚刚事业有点起色，就对人颐指气使，高高在上的感觉就出来了，实际上，身边地位低的人，都在后面骂你呢，指不定那天就坏你大事。所以，大家一定要尊重，重视，身边地位低的人，别阴沟里翻了。


