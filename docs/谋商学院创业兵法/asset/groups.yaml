    长期努力是成功的唯一原因。'
  md: '


    如果你想卖高价，那么你就必须得换个糖罐。保时捷这个词更适合装高档车这个概念，这个地方，就有一个赚钱的密码。其次，大众汽车的工厂不见得就比保时捷的工厂落后，所以，你在大众汽车工厂里生产的汽车，也可以叫保时捷，从而卖到高价。这个概念变通一下，大家就可以拿着卖自己的产品或者服务了。


    脑白金，可口可乐的成分不就是水加糖嘛，但是他们的概念卖的好，就卖出了几百亿的市场份额，大家懂了吗？


    我们要善于利用历史上已经被塑造好了的词语、文字，借力打入人们的潜意识中去。我们中国古代，有汗血宝马，宝马这个词语，就被宝马汽车公司利用。在历史上已经塑造好了的词语、文字，可以快速打入人们的潜意识中。


    阿里巴巴，淘宝网，都是利用人们心中已经塑造好了的词语来做营销的典型代表。选择好了词语、文字、名字，连广告费都能节约很多。


    每一项产品或者服务，都是带着包装的商品。概念就是产品、服务的包装。也就是说，你必须得先把概念卖出去，人们通过你的词语、文字，感性地认识到你的商品，进而在他心中留下印象，然后他才会购买。这个概念玩好了，你就能赚到大钱。


    词语、文字是触发器，它能触发人类心智中的含义。当然，一个精明人你是营销不了他的，因为你说 是悍马，它就不认为你这个车是悍马，他能区别出来概念与现实的情况。这种人也不会去买脑白金，管你怎么给他概念，他心里都跟明镜似的，不会上你的当。


    但是恭喜大家，这种人毕竟是少数，大部分人都是可以被营销的。


    我称精明的人为正常人，称可以被营销的人为不正常的人，这种人有什么区别呢？


    - 可以被营销的人是企图让现实世界适应自己心智想法的人。

    - 不可被营销的人，是不断的分析现实世界，使自己的想法去适应现实世界。


    但这样做很累，让现实去适应自己的观点要轻松得多，所以，可以被营销的人总是接受与自己观点相近的专家的意见，他们不会去关心事实的真相。这就是为什么很多广告里都有专家形象的人出现，都有明星代言。而这样做，销量就会上升，因为不思考的人多，概念被卖出去了。


    能被营销的人，潜意识认为，一辆车叫做悍马汽车，比它叫乌龟汽车更加的帅气，脾气野性，跑得更快。所以，如果你卖汽车，你的汽车叫大众汽车，你想要卖高价就不可能。凡是能卖高价的汽车，总是要弄一个高贵的词语、名字，先把概念卖出去。


    真正的赚钱利器，就是利用文字、词语、卖概念。


    ## 仪式化营销的最高境界


    这个仪式化，其实生活中随处可见。比如苹果手机的发布会，新品发布大家去排队，小米手机发布会，华为手机饥渴营销，大家在电脑上抢手机，都是仪式化的变种而已。


    海底捞火锅，你去吃火锅，还有美甲师给你美甲。去吃日本料理、韩国料理，去吃牛排，对中国人来讲特殊的吃法，都是仪式化的东西。这玩意只要去了几次，就会在你的脑袋里打下烙印，你老是会想起这些东西，就会勾引你继续去买单。这就是营销的最高境界，在消费者脑袋里面种下了种子，随时都会发芽。我们做营销的，就是要做到这个境界。


    我们请一尊财神，比如我就请了一个财神，要开光，这个老道就会神神叨叨，东搞搞，西搞搞，就开了光了，就收了我好大一笔钱。他玩的就是仪式化。我为啥需要这个仪式化呢？其实是因为有人在
    我脑袋里种了一颗种子，他在我买财神的时候发芽了。这就是最牛逼的营销。


    下面我给大家一个种草子的案例，大家好好悟一悟。


    睡觉之前，拖鞋怎么摆？这就是一个仪式。老人们说，不能把鞋尖冲外摆！因为会离魂。三魂七魄穿上了你的鞋，去东莞找乐子去了，完了完了，你醒不来了，英年早逝，骨灰盒还没来得及买呢。


    那我冲里面摆！老人又告诉你，也不能这样摆，因为半夜里哪个“好朋友”路过，一看：这里有双鞋，穿上试试。再一看，咦！床上还有个人，等我玩个附身。完了完了，你又被鬼压身了。


    那该怎么摆？我告诉你：一只冲左，一只冲右。这是什么意思？我们的目的，就是要让半夜路过的那个朋友，不知道这是什么意思。也让你的三魂七魄没鞋可穿，这样你就安全了。


    对了，这个睡觉之前鞋怎么摆就是一个仪式化。大家这下被我种下了这个种子，以后睡觉就得把鞋子一只冲左，一只冲右。否则，鞋尖外摆，晚上三魂七魄就穿上你的鞋子跑出去了，你小心他不回来了。大家鞋尖向里面摆，后果就是：“半夜路过的朋友”，一看这里有双鞋，穿上，然后看床上有个人，就会上来玩个附身。完了，这下就会被鬼压身。你的鞋子没摆好的话，赶快下床去摆好。我已经告诉你了，要一只冲左，一只冲右。


    你会说，我很牛逼，人挡杀人佛挡杀佛，怎么还会信这个？我才不会被你吓到呢！我是无神论者。听我细细道来，你就明白你必须信了。


    你不信，但是你的潜意识会信。当这套离魂和鬼压身的歪理邪说感染了你的意识之后，在你清醒的时候你不怕，因为你的意识可以凌驾在你的潜意识上。但是，当你睡着了以后，潜意识就会活跃起来。


    你的潜意识是不具备分辨能力的，如果我睡觉之前没有按照这套仪式来摆放拖鞋，那么我的意识就会组织起很多素材来让我睡不安稳。


    比如前两天我四点就醒过来了，因为做了两个梦。


    **梦境一：大战僵尸。**


