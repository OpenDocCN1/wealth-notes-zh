    ## 道学会了术就无师自通


    创业的方法很重要，但其实一个人真正能创业成功往往不是方法所决定的，而是那些优秀的品质所决定的，当一个人具备了这些优秀品质，很多东西都可以无师自通。


    第一个品质，耐力。我们很多人做事有爆发力已经很不错了，他能持续拼搏一小段时间，但是不能长久的拼，这样的人注定只能给别人打工。我昨天早上长跑了12000米，今天早上长跑了14000米，我喜欢长跑。因为长跑最考验一个人的耐力，我计划以后平均每天早上16000米的样子。很多跑步的人跟我一起跑步，开始的时候，他们能跑上三四千米，可是他们很难继续下去了；如果你想锻炼自己的耐力，可以开始学习长跑。


    人活在这个世界 上，要做事业，要赚钱，你需要选定一个领域，首先，你需要往前跑，不一定要是这个领域里跑的最快的，但是要跑得久。大部分人都跑不久，他们迟早换行业，而如果你跑得久，那么优势必会积累下来，最终成为行业王者。需要注意的是，跑得久不是说你在这个行业混着，不能三天打鱼，两天晒网：你需要持之以恒的跑，只要跑，早晚都会达到目标。


    第二个品质，懂得分享。


    人是群体性动物，要赚到钱，就必须学会在群体中获得支持。大家都帮你，不是因为大家是雷锋。而是大家知道你成功了，他们也能获得果实，他们才愿意帮你，所以必须要懂得分享。


    人际关系的好坏，决定了你的地位与荣耀，进而决定你的钱袋子，如果你想让一帮人死心塌地的支持你，你必须让他们分享你的物质财富，精神财富。分享你的痛苦与快乐，让大家感觉到你可贵真实。帮助你就等于帮助他们自己，这是你能够坐着数钱的立论之一。


    吃苦精神也很重要，做任何事情如果不付出艰辛的劳动而想做好是不行的，很多伟大的事情都是由又单调而乏味的小事情构成的。


    这个世界上，除了你的父母会无私的给予你钞票外，大概就只能靠自己获取了，说句很多人接受不了的话，包括你的老婆或者老公，都做不到无私的给予你钞票。我们要清醒的认识到这个社会现实，所以我们要锻炼自己的吃苦能力，因为你不吃苦不行了。


    ## 第三：果断的精神


    果断为什么要提出来呢？因为人的一辈子不断的面临着选择。有了果断的精神，能让我们节约不少犹豫的时间，我也碰到很多反复思考决定不了的事情，索性抛硬币决定，因为犹豫太浪费时间了。很多事情只有在做的过程中，才能具体的了解，在选择上浪费很多时间，是极其划不来的事情。


    与果断配合起来的一个品质就是坚持，当你选择好了一件事情的时候，动手去做了，就别老是想其他的事情，你必须坚持去做，只有坚持去做，你才能在这个领域获取更多的经验，更多的资源，积累人脉，积累知识。而如果你经常换，那么是很难成长的，深入一个行业才能挖掘到巨大的利润。我们选择好了，就要准备做到别人永远也达不到的高度，走出别人走不出的距离，即便是很多人说，马上就到尽头了，也别停下，继续走，走到尽头，往往又会有新的路。


    ## 第四：专注


    我们每一个人，其实一生能做好一件事，就能荣华富贵。


    现代很多人看似懂得很多，其实呢，没多大用处。一个人不要炫耀你懂得多，只要有一门拿的出手的本事就算你厉害。如果你把你钻研很多东西的时间都专注到一件事情上来，可能你的生活品质早都提升了好几个档次了。我以前喜欢读很多书，好像什么都知道点一样，但是呢，自己也能感觉到，自己是个啥都不会的人。后来，我每天早上必读《道德经》由于持续不断的读，我几乎没有用心去背，就发现我也已经会背了，并且这部书融入了我的潜意识，我做什么都会想起这本书上的句子，这种感觉就很好。这或许就是专注所带来的力量。所以读书这件事情上，我建议大家广泛阅读，而精读一两本好书。


    ## 第五：奋斗


    为什么要奋斗？因为对于普通人来说，只有奋斗能改变你的生活品质，能改变命运。人有可能靠一段时间的运气好而赚到钱，但不可能一直运气好，而如果一个人有奋斗精神，就算在逆境中，他也会过得越来越好。我们很多创业成功的人，实际上都把成功归结为持续不断的努力奋斗，可见这种品质是多么的重要。


    这五个品质，非常重要，是道的层面，老板学的就是道，员工学的是术；道的层面的事情做好了，术的层面的事情就水到渠成，自然就好了。


    ## 复制已经成功的业务，少创新


    很多企业的大成功其实不是创新的成功，而是复制的成功，例如大部分连锁企业。有一些企业的做法甚至不是复制自己的成功，而是复制别人的成功。复制与创新，就像自然界的阴与阳，谁也离不开谁，很多企业的问题不是缺少创新而是缺少复制已经成功的业务。


    最近碰到一个老板在做明年公司的战略，请我帮他把把关，出出主意。在他的计划中，我看到非常多新奇的创意和想法，在现有的3个产品之外，他还想再做两个新产品。在现有的渠道之外，他还要添加3个新渠道。在现有的客户群之外，他还想增加两个新客户群。在现有的几个销售模式之外，他还想再尝试一个新模式。当他描述他对未来创意的时候，我看到他陶醉在自己的梦想中，他的眼神里充满了对2016年无限的期待。这是很多老板常常犯的毛病，稍微有几个小钱或者是原有业务稳定盈利后，总是好大喜功，想要发展几个新业务。


    我感觉到，他希望从我这里得到对他一个人花费了大量心血做出来的计划肯定和赞许。但我跟他说，非常抱歉，在你的计划里，我看到的是创新，创新，再创新，却没有看到一点点更现实的复制。一个真正聪明的创业者，是只要找到一个赚钱的业务了，就会在这个业务上不断深挖。


    其实一个年度计划里80%应该是复制，20%才是创新，我问他：你总结过没有，在过去的一年里，你们什么地方是做得好的？在你的计划里，有没有把已经经过验证的、赚钱的业务不断的复制，复制再复制？他说这些他没有多想，因为感觉那些事情大家都已经知道，重复一个已经会做的事情对他来说没有什么挑战性，他作为老板首要任务是带领大家创新。


    不要图新鲜，把老业务做到极致，做到行业老大，做到垄断，就有够多的利润让你爽了。


    创新的确是重要的，没有创新，没有独一无二的追求，一个企业不可能走远。但只知道创新，不知道把成功的业务通过复制放大到无法再放大，这也是错的，而且这个错误可能是我们做老板的最容易犯的，也同时是最愚蠢的错误。


    为什么说这个错误愚蠢？我们都知道老熊掰棒子的故事，我们都会嘲笑老熊的愚蠢。但很多公司众多创新的命运不是和老熊掌中的棒子一样，被拿起又被扔掉了吗？


    一个企业只要有一个赚钱的主营业务就行了。把自己的人才、资源都投入到这个主营业务，经营好它。


    很多企业的大成功其实不是创新的成功，而是复制的成功，例如大部分连锁企业。有一些企业的做法甚至不是复制自己的成功，而是复制别人的成功，你也可以骂他不道德，是抄袭，但别人依然是成功者。例如很多人认为腾讯就是这样成功的。应不应该复制别人的成功是另外一个问题，但复制自己的成功是没有任何道德问题的。


    年底计划或预算的基础不应该是天马行空的创新，创新不是目的，复制成功才是目的。总结让复制成为可能，带领大家做好一年的总结，是年底时候老板比创新更重要的任务。只有总结好了，才能把过往大家费了九牛二虎之力取得的经验发扬光大，才能取得事半功倍的结果。对盈利模式的总结，会让你的企业有更强的核心竞争力。对组织方式的总结，会让你的员工更有战斗力。对产品的总结，会让你的销售大大提高成功率。对人事的总结，会帮助你大大提高员工的积极性。对客户关系的总结，会让你的经营更长久稳定。


    ## 老板如何管理自己时间


    很多创业老板，甚至稍微上一点规模的老板，成天忙得不得了。但没干几件有用的事情，干了好几年，企业依然没有发展壮大，大部分原因是没有分析自己的时间都用到哪里去了，所以，你问他要成绩，他是拿不出来的，今天我就系统的与大家谈谈老板如何管理自己的时间。


    先讲一个题外话，如果你的企业里有一些人是偶尔才用一下，那么就把它解雇，通过外包的形式来做这个人做的工作。因为企业有多余的人，他成天不做事，会对整个企业产生不良的影响。员工没事干，他就要去干扰其他人，无事就生非，所以，我们要给员工安排满事情做。


    现在讲老板该如何管理自己的时间。


    - 第一：只开有效的会议，因为开会就不能工作，工作就不能开会。拒绝无关的人参加会议。部分企业老板，管理者动不动就开整体部门会议，全员会议，这绝对浪费大家的时间，浪费时间就是浪费钱。我们开会，必须言之有物，针对特定的事，特定的人，解决具体的问题。杜绝把不相关的人也弄来开会。


    适当的会议非常必要，因为相关的人与事要彼此合作，就要彼此沟通。一个人的头脑不能解决所有问题，适当的会议作用就是集思广益。


    - 第二：老板只抓公司一个主要业务。其他业务全部交给公司的能人打理，老板只看结果。同时不参与其他业务的会议，让相关人员全面负责你丢给他们的业务。老板亲自抓公司的主要业务，如果主要业务盈利能力强，企业的能人自然有样学样，差不到哪里去。


    - 第三：把业务流程化，精简化，标准化，让每一个新人都看得懂，减少重复解释时间，会议时间，内容相同的沟通尽量流程化。


    - 第四：拒绝参加不一定非要自己参加的任何形式的讨论与会议，拒绝批阅不必由自己批阅的公文，比如，我们公司要买一个杂物柜，一些电脑，由其他同事决定了就行了，我是拒绝参与这些事情的。


    - 第五：不要把自己的时间分割成很多小段，分割开了的时间，等于没有时间，很难处理好一件事。我在公司里是最讨厌被琐事打扰，一个上午有几个人找，就会发现什么事情也没做。没人找我的话，就明显感觉主要的事情推进了很多。


    - 第六：最好有一间自己的办公室，谁也不让他进来，你一个人在那儿思考问题。拒绝被中断打扰。


    - 第七：最好养成早睡早起的习惯，不要有晚上可以加班的思想，因为这会让你觉得白天不抓紧时间工作，晚上能补救。


    总结一下，时间是最宝贵的资源，不能利用好时间，而想做好事业就是空谈。老板就是会利用时间发财的人，同时用钱买别人生命的人，生命就是由时间组成的。


    ## 碰见白痴不要硬碰硬


    人走在路上，不可避免要撞上墙。因为，有时候，墙是活的。


    公元前二百年，韩信撞上了一面墙。一位杀猪的堵住了韩信，提出一个小小的要求：“请钻我的裤裆。”


    那时的韩信穷困潦倒，穿着麻布衣服，吃饭基本靠蹭，唯一能让他挺起腰杆走路的就是他有把剑。剑是士的标志，就像马车是士大夫的标志，苹果手机曾经是小资标配。韩信有一把剑，挂在腰上，寻找着士的感觉，却没有士的钱包，很丢人。


    屠夫拦住他，“我看你长得高高大大，又拿着把剑，挺得瑟啊。但我看你是个胆小鬼，有本事，你抽出剑，刺我，不敢的话，就从我的胯下钻过去。”


    其实不只韩信遇到过这样的挑战，过了一千年，有一个叫郭威的人也被一个屠夫堵住，屠夫拉开衣服，露出肚皮：“有本事，你就捅一刀。”


    再往回倒退五百年，李渊跟表弟隋炀帝杨广吃饭，杨广说你这个阿婆面，脸怎么长得像睾丸袋。


    李渊去了趟洗手间，拉开裤子看了看，差点头晕在厕所里。回到家，李渊告诉老婆窦氏，皇帝说我是阿婆面。一般的老婆有两种反应，一种是劝：忍了吧，皇帝是什么，我们惹不起。另一种是激：哎呀，他杨广就长得好看啦，弄不死他丫的。窦氏选择了第三条：恭喜啊，老公，阿婆面在我们那是堂主的意思，堂就是唐，你袭封唐国公，说明你的位置很稳啊。这么远的飞盘，都被窦氏叼了回来。


    有时候，我们确实需要一点阿Q精神，或者叫唾面自干。


    当屠夫堵住郭威时，郭威真的拿起杀猪刀，然后一刀捅死了杀猪的。所以当是白痴时，千万不要再去刺激另一个白痴。


    韩信选择了弯腰，他从屠夫的胯下爬过，然后起来拍拍身上的灰，笑声中走了，一路走远。


    当这个集市再次听到他的名字，他成了刘邦的将军，西汉的齐王。郭威被抓了起来，打进了死牢。军头李继韬欣赏他，将他从牢里私放了出来。数十年后，郭威成了后周的开国皇帝，不同的应对，似乎并没有影响他们的结局。


    但真的如此吗？区别还是有的，区别是郭威把自己放到了一个巨大的不确定上，如果不是碰上伯乐李继韬，他可能早已经被处死，而韩信避免了在最无聊的事情上把自己置身于最大的不确定。


    如果有平行世界，我相信会有这样的场景，郭威被砍杀在菜市口。韩信同样有个版本，他刺死了屠夫，然后被抓住砍掉了脑袋。


    每一个选择都会决定我们的未来，我们要避免把最好的自己押给最不值钱的对象。


    很多年以后，韩信找到那个屠夫，屠夫提心吊胆了很久。结果韩信把他提为护军卫，还告诉他：当年，我不是怕你，而是我没有道理去杀你。如果杀了你，我不会有自己的今天。我可以把我的命押给项羽，押给刘邦，甚至是吕后，但不会押给你。


    同样，不要挥霍我们的愤怒。


    天下可以愤怒的东西有很多，社会的不公你不愤怒，你自己没钱，你不愤怒，别人说你两句你就愤怒了？


    同样，不要忽略每一个迎面而来的微笑。


    那么，当韩信愿意从屠夫胯下钻过时，他靠的是什么？是尿不湿还是护舒宝？我想应该是理智与心态。


    如果碰到墙，绕开就是了，不要忘了，你是有脑袋的，你知道孰轻孰重，不要跟白痴死磕。


    ## 如何成为一名成功的投资人


    我有很多创业学员，老板学员跟我聊天。他们说，我想成为一个投资人却不知道该怎么办，今天我就聊下如何成为一名成功的投资人。


    如果你想直接成为一名投资人，除非你有足够多的空闲时间，有足够多的金钱让你去投资，吸取失败的教训，失败多了就成功了。显然，具备足够的时间与金钱的条件很难达到，除非你爹妈是超级富翁。


    一般的人要成为一名投资人，必须先成为一名企业家。什么叫企业家？企业家与小老板的区别在什么地方？小老板就是自己带团队做业务赚钱的人，自己离开企业，企业基本不能运作的人，叫着小老板。而企业家就是请了
    CEO，总裁为自己打理公司的人，企业家离开了企业，企业照样运转，而且运转的越来越好，比如，马云到处游山玩水，史玉柱到处看花花草草，就算离开一年以上，公司依然不会倒闭，这样的人才能叫企业家，否则，只能叫小老板。


    要成为一个成功的投资人，你必须先成为一个企业家，企业家就是能打造一个自动运转的盈利系统的人。在这个过程中，你实践了如何打造企业。你成为投资人的时候，你才能慧眼识珠，分辨出谁可能成为企业家而投资他。不会被一些只有激情与梦想，而没有能力的脑残欺骗了金钱。


    永远不要直接投资一个小老板与普通员工，风险太大。因为这样的人根本不能理解系统与产品之间的关系。投资这样的人回报率极低，他们很难把企业做大。很多小老板与普通员工认为自己能制作好产品，岂不知能炒好菜的厨师很多，但俏江南，海底捞只有一个。


    所以，一个成功的投资人必须先成为一个成功的企业家。成为一个企业家还有一个好处，就是你的企业不断的在给你提供现金，你可以拿这些现金不断的去投资。


    我的做法很简单，我是把钱拿来投资我的员工，我的员工当中有特别优秀的人，我就会辅助他做一个小业务，我出30%的钱，他出70%的钱，我占10%到20%的股份，并且给他一些做企业的建议。帮助他做成功。我只投资我熟悉的领域，基本就是我们企业业务的上下游延伸，这样成功几率高很多。


    如果各位有心玩投资，你就会慢慢爱上这个行当，因为，这是一个钱赚钱的行当，你终于不用自己起早贪黑的操心企业里的事情，而是每年等着分红。然后游山玩水，有钱有闲，终于可以天天陪老婆孩子了。前提是你看准了人，投资本质上拼的是看人的眼光。


    ## 如何增加自己的竞争力


    人与人之间的竞争，说到底是思维模式的竞争。大部分普通家庭都只是生育了孩子，并没有教育好孩子，或者说教育的层次不一样吧，这就直接导致了孩子在社会上的竞争力千差万别。


    孙中山闹革命的时候，曾经把民众作过分类。大概的意思就是，这个社会是由少数精英领导大部分芸芸众生。


    精英阶层负责制定规则和在某些时候打破规则，芸芸众生就只要在规则内活动就行了，如果违背了规则，就会受到严厉的惩罚。


    家庭教育并不是百米冲刺似的短跑，而是一代代的接力赛跑。每一代人积累到的经验，都会对他的后代有影响。孔夫子的后代就一直很牛逼，可以说原因就是孔夫子很牛逼。


    如果你生在了普通家庭，你的父母其实不能教会你什么有竞争力的东西，这不怪他们，因为他们也不懂啊。要求他们做到他们不懂的事情，岂不是太不讲道理了？


    但是当我们明白这些道理的时候，我们想在这个社会上有竞争力，就要自己教育自己，想办法多看书，多学习，多交有能力，有前途，学习能力强的朋友。尽全力的去改变自己，争取给自己的下一代“传道授业解惑”，做一个有竞争力的父母。自己的起点不公平，没什么好抱怨的，这个世界本来就不是公平的，而且从来没有公平过。


    《易经》中有句话“天行健，君子以自强不息。”说的是要靠我们自己自强，我想，这才是我们每个有志青年应该做的。


    如今的互联网恰好给了我们一个放眼世界的机会，我们可以利用互联网，看到大部分我们能寻找到的有用的知识，思想，来武装我们自己，增加我们的竞争力，通过互联网也可以结交一些有能力的人，可别去看电视剧，玩游戏，让互联网成了削弱自己竞争力的武器。


    互联网才刚刚开始，你也可以进入互联网行业来赚钱。看当今中外富豪，多少人都是跟互联网挂上钩的啊，百度李彦宏，阿里巴巴马云，腾讯马化腾，Facebook 马克扎克伯格，谷歌...

    '
