    ## 只做一件最赚钱的事


    为什么很多人碌碌无为，就是因为目标太多，想太多，一个人想太多，就没有执行力。而一个人如果只想一件事，只做一件事，他必定能行动起来，做得好的可能性就增加很多。


    一个老板，必须以结果为导向，结果导向就是赚到钱，有纯利润，我们不是搞科研的，我们做企业的目的是希望获得商业成功。


    赚钱就是要不断的探索新的赚钱方法，因为一定有更加作优秀，更加简单，更加快速的赚钱方法。卖水果的赚钱方法与搞金融的赚钱方法差别太大，搞金融的一天就可以赚买水果一年的收入。那么同样水平的人，为什么不去搞金融呢？我推荐有点脑子的人，想多赚钱的人，都进入金融这个行当去搞。


    老板就是找到当下最赚钱的事情去干，把不重要而非做不可的情交给助理做！不重要，可做可不做的事情，就不做了。


    让公司所有的资金，人才帮你做第一重要的事情，不管你的公司是 10 个人，还是 100 个人，甚至 1000 个人，都只管一个最赚钱的业务。坚决不管理两个以上的业务。


    一个目标很容易就实现了，5 个目标实现起来就有难度，10 个目标能实现简直就是天才级的人物，我们大多数老板都是普通人，所以，找一个最有价值的目标干就行了。


    老板就是要冇取舍的能力，抓住主要矛盾，就如同田忌赛马一样。田忌之所以能打败齐王，就是因为田忌懂得取舍，懂得把自己的优势排序。


    老板把什么人放在什么位置，把资金放在什么地方，把自己的精力放在什么地方，就决定了企业的整体效益。所以，老板就是一个理论功底特别强的人，逻辑能力也特别强的人。如果一个人没有理论功底，没有逻辑能力，是做不好老板的，是一个糊涂蛋。


    总结一句，老板不是首先要做最重要的事情，然后去做第二重要的事情。而是只做最重要的事情，不做第二重要的事情。这样才能力速赚钱，赚到最多的钱。


    ## 生意人是见啥卖啥普通人见啥买啥


    在现代经济社会，我们活一辈子到底是为了啥呢？我总结如下，第一是金钱，第二，是感情。我们既然是创业商学院，我们就不谈感情。因为金钱能解决 99% 的问题。就算是感觉问题，金钱也能解决大部分。比较残酷的例子，有人开车撞死人了，只要这个家伙有钱，赔个百万块，这事也就过去了。


    那么重点出来了，我们到底怎么赚钱，其实我们身边充满了商机，只是很多人视而不见。处处留心皆学问，人情练达即文章，绝非虚言。


    每个人都有些与众不同的地方。比如有人唱歌唱得好，有人是教书先生，有人热爱打篮球。有人热爱看电视刷。聪明的人呢，把自己的爱好变成了财富。而笨蛋把爱好变成了负资产。打篮球的，可以教别人打篮球，教书的可以在外面办补习班，热爱看电视刷的，比如美剧的，可以尝试着写影评，做字幕翻译等等。出路其实都很多，也都很赚钱。


    甚至吹牛逼，都是可以拿来卖的。而且卖的价钱还很高。我天天在网上吹牛逼，就有人付钱给我请教问题。真是到处都是赚钱的机会。如果你留意了，你就会发现，如今的互联网时代，机会真是太多了。


    普通人与生意人的最大区别，我以为就是一个“卖”字，打工的人呢，脑子里很难浮现出这个字，而我，脑袋里天天就是这个“卖”字！什么时候，我养成了这样一个习惯呢？就是我
    13 年前，高三的时候，在一个网吧里打传奇这款网游的时候，用 60 块钱买了一个游戏人物里面的手镯。刚刚买到手，就发现同一个游戏里面下面有一排小白字，说“收购
    XX 手镯，红润网吧交易”，天啦，我就在红润网吧呢，我就密他。那时候私聊叫“密”。说 85 块，本来只想试探一下，没想到他直接答应了。然后我就告诉他我也在红润网吧，然后我们就愉快的交易了。前后不到
    10 分钟，我就赚了 25 块。当年一个农民工一天的薪水也就 50 块不得了。我只用了 10 分钟，就赚了 25。我忽然感觉到从头到脚的爽，估计武侠小说里面的打通任督二脉也不过如此。


    我感觉我发现了一个天大的秘密。这个秘密就是“卖”。我这一生，啥都不用研究了，就是卖就行了，东西有人生产，技术有人学，我负责“卖”。


    在以后的人生当中，不管是在游戏中，比如魔兽世界，还是现实中，我都重点研究这个“卖”字。


    所以，我这个人不 太喜欢与人聊技术，聊生产，因为我感觉这个发不了财。我的脑子里只有一件事，就是把见到的任何东西卖出去。


    我觉得最好的生意就是自己啥也不会，挪腾几下就赚钱的生意。


    比如，很多同城交友的群，建立 20 个群，20 人的，到处发帖，拉会员入群，然后把每周在 20 个 QQ 群里发一个公告，在某某 KTV 举行同城交友聚会，人均消费限定在
    200~500 以内。我认识一个团队 5 个人，在上海。他们就干这个事，这些人消费完了，他们老大就去找这个 KTV 拿提成，赚钱吗？我不知道，我只知道那个家伙开的车大概
    40 万左右，40 万的车在上海确实连尾都算不上，可是，这个生意的成本是多少呢？需要多少启动资金呢？我就不明讲了。


    看，连 QQ 群都是可以卖的，我们在把这个思维进一步延伸，QQ 群的种类没 10 万种，也有 5 万种。这里到底蕴含了多少没啥成本的生意呢？大家自己去想哦，说得太明白了，是在侮辱大家的智商。


    很多时候，并不是我们不吃苦，不努力，而是脑子有没有开窍。做生意，纯粹是个思维问题。很多人不愿意探索，不喜欢新事物，别人都玩烂的东西，他也不去接触，就这样，自己把自己隔离起来，成了一个只会拿固定工资得苦逼。找借口说，必须要有资金才能创业，兼职就是在侮辱互联网时代嘛。


    有一技之长好不好？当大多数人都认为好的东西，我一般都要否定的。我最喜欢的状态就是啥也不会，也能混的风生水起。这才好玩呢，有一技之长的人，老是想用他的技术养活自己，就懒惰得不会思考了。而我这种人，就是啥也不会，就只好忽悠有技术的人给我干活了。讲高大上点，叫动脑让有技术的人给我干活。只好苦练忽悠术，总算天无绝人之路，还真有部分人相信我忽悠的东西，我以为这就是老板真正意义。


    当然，如果你脑子开转了，又有一技之长，那么你赚钱的速度立 马会水涨船高。别人给你 5000 块一个月，买你的技术，这就是一棵树，你抱住了，你别去抱着这颗树，其实能逼着自己看见一片森林。


    ### 先做好一个具体产品然后依托这个产品进一步扩张自己的业务


    互联网创业初期，我建议大家单点切入，也就是做得越精 越细微 好。只选择一个具体的产品或者一个具体的服务来做。


    互联网的好处就是如果你把一个产品做得好，就会有海量 的用户 关注你，根本不愁没有客户，因为任何一个平台都可以 面向全国。举 个例子，在线下你开个包子店，你很难说就卖豆
    沙包，其他包子我不 卖，馒头我也不卖，一般，你的品类要齐 全。或者说你开个培训公司， 你不可能只培训 PS，其他的技 术你不培训；但在互联网上，我们可以这样干，只做一个产品。


    当我们驾驭一个产品或者服务驾驭的很好的情况下，我们 才去扩 展其他的产品与服务。当然，我私下里是不喜欢扩张新 业务的，因为 一个业务就完全够你赚大钱了。网上有几亿用户，
    你能圈上一万个人， 你就已经发大财了，为什么要去扩展其他 业务呢？当然，我自己确实也扩展了好几个业务，但都不是主 动扩展的。


    扩展自己的产品与服务也是个水到渠成的事情，就是当你 把第一 个产品或者服务做好了的时候，自然用户会有与你这个 产品的相关需求，这个时候，你仅仅需要开始提供第一个产品
    相关的服务，慢慢的 扩展你的业务，这样自己的客户熟悉你， 你扩展的业务与你以前的业务也是相辅相成的。


    比如我就是经常开发新项目，一个项目正常运作了过后我就会找一个职业经理人去管理，我继续开发新的项目。我现在在互联网上讲创业，吸引了部分人来听，我也写了很多博客吸引了很多人来看，我只需要把这一个点做好。然后我就能自然延伸出来其他的服务来，比如有人咨询我怎么创业，我就可以做创业咨询了；有人咨询我怎么开发项目，我又建立一个
    QQ 群专门帮助别人开发项目。


    这样，我所做的事情可以无限的扩展下去，钱会越赚越多，越来 越容易。创业这个圈子也会被我越做越大。但是人的精力是有限的，一个业务链条扩展到三个服务，我一般就不扩展了。


    我有一个对待客户的理念，不是让客户很长时间逗留在我这里，我的做法是快速给他一个结果，让他快速学会然后离开，这样，他才能觉得他的问题得到了快速解决，下次有问题他还来。


    我在做语音与软文推广的过程中，还认识了一些朋友，他们并不是想创业，也在听我的录音看我的心得文字。有的人认为我讲得对，就来找我解决一些他们工作上的事情，比如，有的人想要从一个普通员工升级为主管，问如何才能快速升上去，我就在电话里针对他的具体情况给了他具体建议，这个慢慢也发展成了我的一个咨询业务。


    我希望大家能在我的经验当中学到一些手段，自己操作的时候。少走弯路，认准一个产品或者服务先做出来。其实现在互联网创业真得很简单，我认识的一些在网上做 PS 培训的，做网络营销的，很多人都只是一个
    YY，几个 QQ 群就做起来了，有个叫邢帅的做 PS 培训的，开始连网站费用都出不起，几年时间做在线教育就做到了几千万。大家可以在网上搜索到邢帅教育，了解一下这家伙的创业史，看有没有
    可以学到的套路。


    我们部分人在这个社会上混不好，初级的人是靠出卖体力，入门 级点的是靠出卖技术。要登堂入室，我们玩的是一套思维，有了这套 思维，很多东西都会变很简单。


    ### 先搞广告创意，再搞包装，最后落实做产品开发


    很多创业者，老板，想做一个生意，就开始在那里研究产品。研究好产品就做出来，做出来了就开始卖，自己没本事卖出去，就企图 招聘一个牛逼的营销经理来卖产品。卖不出去就破产，卖得出去就开
    心。很多时候，都是自己做了一个根本没市场需求的产品。


    这种做生意的逻辑是大部分人的逻辑，也是非常错误的逻辑。


    正确的逻辑是：先搞广告创意，再根据广告创意做产品包装，也就是先找到顾客购买你这个产品的理由，找到客户购买理由后，我们 再根据客户购买理由去开发产品，制造产品。这样搞出来的产品，水
    到渠成就能卖出去。


    表面看上去，顾客是买产品的，真实的情况是，顾客是看到广告才 决定买你的产品的，广告是顾客购买你产品的理由。


    也就是说，做一个业务，广告是核心，研发是为了广告服务，产品是为了广告服务，包装也是为了广告服务。


    ### 什么决定需求？


    作为一个创业者，我们要找到我们卖的东西有什么价值。价值是 由人们的需求决定的，道理很简单，人们不需要你这个东西，你这个 东西就毫无价值，人们非常非常急切的需要你这个东西，你这个东西
    就非常有价值。


    我们应该卖什么产品？做什么服务？明显是人们非常非常需求的东西！


    那么，什么决定需求呢？思想，观念决定需求！ 通俗点讲就是人 的想法决定需求，人的想法千奇百怪，所以世界上的商品千奇百怪。 连火星上的土地都卖出去了，淘宝上还有卖一屁股的，依然卖了很多。
    当然卖穿过的内裤的也卖出去了很多！


    那么，又是什么决定你的观念呢？又是什么决定你的想法呢？


    你接受的信息，决定你的观念，你天天听我讲创业，你就想创业。 社会环境，决定你的观念，如果你生在温州商人家里，你就自然而然 想要当老板。


    你只是父母遗传基因和自身环境的综合产物，你的观念来自你所 处的环境，一定要清醒的认识到这一点。你自己是没有观念的。你是一个机器人而已，你的想法与观念，甚至心理需求，仅仅是你的基因与你的社会环境编写的程序而已。


    遗传基因的核心是遗传信息，他决定你的硬件组成部分是什么，他决定组成你躯体的硬件性能如何，比如，有科学研究表明，人的智商跟遗传有很强的关系；环境的作用，主要价值也是信息，因为我们每个人接受的信息，都是从自身环境来的，所以身处什么环境，往往决定你的命运。


    一个聪明人，必须付出代价，把自己所处的环境打造成好。


    打造自己所处的环境，就是打造自己的命运。


    当然了，遗传信息很重要，比如那些天生智力残疾的痴呆 症、傻 子、疯子之类的，就是遗传基因出了问题，好比电脑某个电路板或者 CPU 损坏了，导致根本无法使用。


    人们有什么观念，完全来自人们自身所处的环境，人们就是自身 所处环境的产物。


    所以，你只要天天盯着一帮人做营销，灌输给他们需求你产品的 观念，塑造消费环境，或者帮他们找消费环境，他们必定会买单。


    > “人本来就是环境的产物”， “环境塑造人”。


    如果你把人假设成一台高性能电脑，那么，人就是获取信息和处 理信息，并输出信息的机器。


    这台机器做什么动作，就在于你给他什么信息。


    也就是说，一个人，认为什么有价值，跟他的价值观，也就是我 们通常所说的观念，密不可分。


    有什么观念，就有什么需求，有什么需求，什么就是有价 值的。 理解了这个东西，你应该就明白了，只要你能塑造人的观念，改变人 的思想, 那么你就能卖出去一切。那些时尚代言人，其实就是在塑造
    人们的观念，思想，比如什么韩流，日流穿衣风。


    营销，最重要的是塑造人们的观念，品牌营销，奢侈品营销都是 从这一点着手的。其实最早的时候，经济学是心理学家业余的时候专研的，后来就有了经济学这些课程。


    ### 一个老板，必须是一个心理学高手


    什么产品可以赚取暴利做一个直指人心的产品。


    根据马斯诺需求层次理论，这个人类的需求，依次是先满足生理 需求，再满足安全需求，再满足社交需求，再满足尊重需求，最后满足自我实现需求！


    马斯诺的理论是，前一极需求被满足，人们才会诞生下一级的需求。


    意思就是，你饭都吃不饱，肯定是找饭吃，不会想到找女人，所 以中国古话讲，饱暖思淫欲，先有饭吃，能穿的好，才想找配偶交配。


    所以，人类的基本需求，就是吃饭加交配。


    这个理论，我们可以运用到商业上，到底做什么样的产品最有市场。读懂这个理论，你就能设计好你的产品，赚取暴利。


    首先把这个理论进一步进化，需求，并不代表市场，有购买力才 能形成市场，有需求才只是会让人产生购买冲动。


    如果目标的购买力已经满足了上极一需求，那么我们就可以认为 目标已经产生了下一级需求。


    相反，如果目标的购买力只足以满足基本需求，即使他有更高的 需求，我们也不认为更高的需求已经诞生了。因为更高的需求，他买 不起，就像一般的打工仔也想要跑车，可是他没有购买力一样。


    另一个方面，将需求对应欲望更容易理解判断。


    我发现，人的需要都诞生于基本欲望，而所有的欲望都追述到“生存和交配”上，这两个欲望衍生出了其他一切欲望。


    举个极端例子，一个人追求超脱，无欲，修道。其实也是正因为有欲望，得不到满足，所以他才去追求化解这种欲望。


    这样的话，我们就不能说“因为生理需求被满足，人们才追求更高级的欲望，有点见识的人应该都知道，很多贫穷的人开始追求信佛，修道，信耶稣。按理说，这是高级需求”，这种高级需求，恰恰是因为，基本欲望永不满足，才诞生出高级需求的。所以从深层次上讲，这些求佛，修道，信耶稣的人，还是想满足基本需求，就是生存与交配。


    再比如我们追求被别人肯定，被认可，这是一种社会需求。


    但这种社会需求，表面看来是因为我们的生理需求和安全需求已经被满足了，实际上，它反应出来的，恰恰是：我们希望得到更多的生存和交配资源。因为社交需求让你想去认识漂亮的异性。这是人的潜意识。


    因此我们可以看出，整个需求的过程，其实是由少到多，由浅显到复杂，由直接到引申。


    但是，这些高级需求的根本基本都是从生存与交配需求上延伸出来的，而且其他高级需求又反过来进一步帮助你更好的实现生存与交配。


    故此我们的产品必须千方百计和基本需求挂上勾才会有前途。也就是我们打磨的产品，必须与生存和交配挂钩，才能直击人心。


    举例说明：你的产品如何能卖出暴利！


    比如，衣服对应穿着需求，穿着是因为要装扮自己，而装扮是要吸引异性（繁衍后代的目的，如果我去做衣服生意，我的产品设计方向一定是满足交配这个基本需求的产品，那么，我就可以获取暴利。要不然，我的产品就卖不上高价）。具体一点，我会去做女士内衣，显然是具有诱惑男人功能的内衣，女士们就愿意花高价去买，所以要和基本欲望“生存，交配”挂钩，因为性感，所以交配？其它设计、包装、营销等等环节也都要围绕这个来！


    ### 如何建立品牌，如何把一个东西卖到高价


    建立品牌，就是要让用户的脑袋里烙印上正面的印象。需要卖到高价的产品，你就不能只卖实用性，而要卖内涵，再卖一个外延。


    中国是一个最好赚取暴利的地方，因为中国人的消费不像西方人那样理性，西方人是什么收入阶层，就有什么样的消费，阶层感比较强。


    而中国，由于儒家文化，喜好面子，比较务虚，虽然中国人很穷，但中国是世界上奢侈品消费的大国。中国的普通白领挤着公交车上班，就敢买 LV 的包包。二个月工资的结余，去买个
    7000 块的苹果手机。正因为这种极其离谱的事情在中国极其正常，所以，中国是个赚取暴利的好地方。中国人喜欢炫耀 性消费。你有我也要买，价格低了还不 行，贷款都要买。


    有了市场，接下来我们就要使点手段，让他们买我们的产品了。我仔细研究过一些品牌，他们就是靠讲故事的能力把产品卖到高价。


    比如瑞士军刀，怎么讲故事？有架飞机坠毁了，一位乘客，拿着 随身的瑞士军刀在飞机上刻出一个小洞，钻了出来，刚爬出来，飞机 就爆炸了，结果，飞机上就他一个人生还。这种故事极具传播性，听了的人终身难忘，就会以为瑞士军刀的价值很高，所以瑞士军刀就算比其他同样品质的军刀高几百块，听了这个故事的人也会毫不犹豫的
    买瑞士军刀。


    再比如 LV 是怎么讲故事的？话说 1912 泰坦尼克号沉船后，到了 1996 年，有人打捞上来一个行旅箱，是 LV 的，一打开，里面的衣服还干的。你说，LV
    什么质量？什么质量我先不管，以前我给别人吹牛的时候，就说 LV 就是两块布料，可是我专门去 LV 官网看了下，他卖苹果 6 的手机套子是 3400 人民币。暴利不暴力？靠什么暴力？就靠讲故事的能力暴利。


    故事能够传递感觉，能够传递价值，其实卖东西，就是卖的感觉，顾客愿意掏高价买，也是因为他感觉值。大家想赚钱，就可以构思一 个故事然后套到自己的产品上去卖！我做项目，最舍得花钱的地方，
    就是找几个策划给我整几个能彻底忽悠得住人的故事，制作成精美的 册子，拿去折服顾客；能不能赚钱你们去试一试就知道了。


    总的来说，讲故事的原则：


    1. 短小精悍

