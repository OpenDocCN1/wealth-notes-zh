    就是降级思维。一让你去考高考，你可能没把握，但是让你去考小学一年级的数学呢？不要怕降得多，因为扩张起来很容易；但如果你咬牙上了个高难度，你就降不下来了。


    其实这里大家都有个惯性思维（包括我），都想去够高起点，仿佛卖西餐就比卖牛肉面高级，卖牛肉面就比卖煎饼高级。所以资源和能力勉强能够到开家内（注：应为“面”）餐厅的时候，就会勉强自己去开西餐厅。


    但其实呢，就是从西餐厅降到卖煎饼，我觉得都还不够小，不够容易。


    你用够开西餐厅的资源和能力，去从卖煎饼上的芝麻起步，这就对了。这才能让你、你的团队，有那种举重若轻、游刃有余、每天总想搞点什么事儿、想去突破的心态、情绪和动力。


    别说卖芝麻赚不着钱，这一步考虑的不是赚钱。如果你们真的游刃有余了，生意渗透和扩张得比你做梦梦到的还快。但倘若“卖芝麻”都让你们手忙脚乱了，你应该庆幸：幸好当初没选择“西瓜”的。


    天下事有难易乎？首先是要去做，积极行动；其次是从容易的开始，第三是从小事开始。


    你看我一把年纪了，最感兴趣的生意，不是什么跨国公司，不是什么世界500强，恰恰是卖烤白薯、臭豆腐什么什么的。因为这些生意小到全无压力，可以自由发挥，而且，做砸一百次都会不造成心理阴影，我只找那些极小的小生意来做。


    - 三、选择能够积累经验的生意。


    什么意思呢？就是说年纪不小了，不要捞偏门了，你得选择一种能够增加你们技能和能力的事来做，要技术含量，可持续发展，谓之事业。


    若干年前，去批发IC卡来卖，去做黄牛党。你做十年二十年，能有什么长进？能积累到什么？这种生意来钱快，没什么门槛，全靠认识几个内部人士。政策一变，或者那几个人退休了，你马上就完蛋，后半辈子靠什么养活？再去卖烤白薯、糖炒栗子？


    人家一开始卖炒栗子的已经变成三只松鼠了，一开始卖辣椒的已经变老干妈了，一开始卖煎饼的变成皇太吉，你们呢？


    财富和优势都要靠积累，可持续发展的模式会让你们越来越有信心。反之短平快的项目，大学生兼职去做一下还可以，以此作为事业，就会出现“王小二过年，一年不如一年”的景象。


    当你们的利润开始萎缩，你拿什么激励大家？就算是世界上莫厉害（注：应为“莫”指“最”或“没”？可能是“最”）的大忽悠，希特勒，第三帝国的军队在莫斯科郊外开始吃败仗的时候，他的团队，想得最多的不是反败为胜，而是刺杀他。


    人人都只会锦上添花。如果我们的生意不能越来越红火，不进，其实就已经是败了。


    总结一下：首先，你要找到一个你有把握能赚钱的项目；其次，这个项目越小越好，要游刃有余；再次，你这个项目要能积累经验与优势，不做没有积累性的项目。


    ## 什么样的项目可以利润暴增


    我问过很多人一个问题：你怎么让你的项目快速赚到很多钱呢？让你的利润暴增呢？


    做网络项目的人一般会先说，我使劲推广，延长工作时间，多发贴子（注：应为“帖子”），多吸引粉丝，团结一切可以团结的力量，与人谈合作。对吗？对，不过只对了一小部分。


    大家首先要有个概念，不是所有的项目都可以实现利润暴增的，不是所有的项目都可以快速赚大钱的。所以开始做项目的时候，就要判断好这个项目有没有发展前途，而不是只要是个项目，就支（注：应为“吱”或“直”？“就直干”？原文“支干”可能是“吱干”即“只管干”或“直接干”）干。干了几年，又赚不到大钱，扔掉又舍不得，搞得食之无味，弃之可惜。比如你在菜市场卖菜，你就不可能利润暴增。因为大家都是卖菜的，都睁大眼睛盯着你呢，你能玩出来什么花样？


    现在的淘宝，你也很难实现利润暴增。因为别人看到你利润暴增了，马上就复制过去做了，结果是大家都赚不到什么钱。


    我们在这里就得到一个结论：容易被复制的项目，不能实现利润暴增。所以项目的唯一性非常重要，这也就（注：应为“是”）差异化战略。


    选择项目第一点：项目要具有唯一性。当然这一点很难做到，但你至少要选择很难复制的项目去做。比如卖地方特产与卖全国到处都有的东西比起来，显然卖地方特产有优势。


    第二点：项目能够招商加盟，可以低成本快速辐射全国。一但（注：应为“一旦”）样板打造好了，就能快速招商加盟的项目，就是好项目。比如培训、在线教育、卖软件的等等。


    第三点：项目要有可控性。最核心的东西永远掌握在自己手里，只有你才能对项目独掌乾坤。假如你这个项目有10个环节，你可以告诉别人9个环节，最后一个环节要么不告诉别人，要么要让别人知道也做不了。也就是说，自己必须打造核心竞争力。比如，我卖我的创业咨询、创业培训，虽然有人做我的代理，但是他复制不了我，别人就认定要我。再比如，苹果手机它是个封闭的苹果系统，别的手机厂商就复制不了，他们只能复制安卓手机。所以苹果手机就极度具有竞争力，而安卓机就只要打价格战，因为太容易复制了。


    第四点：市场空间比较大，可持续发展，坚决不做市场小的项目。天花板摆在那里，你能难（注：应为“很难”）做到利润暴增。


    第五点：要建立一套分钱机制，要团结别人，就必须给别人分钱。有的人，舍不得到手的票子。那么别人就不会跟你干，你就做不大。做大了就能玩规模经济。


    第六点：系统化，程序化，自动化。

    系统化就是说，你这个项目是一个完整的系统，对我们自己来说容易批量复制。建立分公司。

    程序化就是说，写出规章制度，普通人招聘过来，看看规章制度就直接能根据你这个程序开始操作这个项目。

    自动化，实现自动化，就是要求你这个项目打造好了过后，你就可以腾出手来做其他重要的事情，不必要天天爬（注：应为“趴”）在这个项目上面。


    第七点：必须建立自己的文化品牌，让项目有文化附加值。才能卖个好价钱。可以通过网页加微博加微信公众号加贴吧加电子书加视频来树立文化品牌。建立公司论坛。


    让别人了解你这个老板喜欢读什么书，有什么性格，喜欢喝什么酒，与什么样的人在一起玩，做什么样的具体事情。比如你们去看郭敬明的微博，就会发现他非常重视建立自己文化品牌，展现自己的个性，衣食住行、家居摆设都被他展示出来了。这样，他的文化品牌就深深的植入到了关注他的人的头脑中，他就可以获取高额附加值。


    ## 5个步骤网络创业


    网络创业5步骤。


    第一：先选好一个项目。如何找到好项目呢？有五个步骤：


    - A. 加很多QQ群、微信群，去看看别人发的什么广告，一个广告就是一个项目。

    - B. 去网赚论坛看看，网赚论坛上的人都再（注：应为“在”）玩什么项目。

    - C. 去58、赶集网看看别人发的广告，大概了解一下哪些项目你能做。

    - D. 去猪八戒网，那里有很多人发任务，你可以试着去接接任务，做一做看看难度，自己有能力搞得定的，就可以发展成一个项目。

    - E. 去慧聪网、淘宝网看看那些批发价1块钱到了10块钱的项目，那些可以高价做营销来卖。做做OEM贴牌，里面的机会也不少。


    第二：找到了项目，就开始挖掘具体的案例。挖掘同行具体案例有二个步骤：


    - A. 加入同行的QQ群、微信群，搜索其QQ号、手机号、公司名称，找到案例的网页广告。

    - B. 在百度、微博上搜索同类项目的网页。


    挖掘项目这一步很重要，你至少应该通过网络找到100个同行，才能进行好下面的步骤。


    第三：找到了很多同行后，我们就开始复制这些成功的项目。


    - A. 谁赚的钱多，业务流程简单，我们就复制这些成功的项目。

    - B. 谁的广告好，软文好，段子好，就杂交谁的。


    第四：如果前三个步骤你都完成得很好，赚到钱了，那么你就可以执行第四个步骤，组建团队。


    - A. 创业组建团队，只招聘有推广经验的人、赖售（注：应为“销售”）经验的人。

    - B. 尽量招聘985、211的高学历人士。高价招聘的人其实能给你带来效益，就是免费的。而低价招聘过来的人，是负担。最贵的就是免费的，免费就是最贵的。

    - C. 尽量招聘优秀的女性。虽然我知道很难招聘，但我还是给出这个建议。一旦你能赚到钱，需要的就是执行力，需要的就是工作细致的人，需要的是团队稳定，不是看到你赚钱，他们就想创业了。而女性一般比较稳定，愿意做事。男人坐不住，甚至执行力还很差。碰到好多没用的男人，我基本失去耐心教育男性了。

    - D. 不要招聘专员，最基层的人员，这些人基本没什么能力，做不了事。直接招聘别人公司的主管，主管稍微有能力点，能够执行好具体的业务。

    - E. 团队是要磨合的，不是说你招聘一个团队，就立马可以给你赚钱，很可能你需要养3个月，甚至半年。所以，你手上最好要准备几十万现金，保证资金链不断裂，你才能安心磨合团队。不过，你必须有一个强有力的核心团队能养活整个公司。有多大能力吃多大饭，掂量着自己的资金实力招人吧。


    总结一下：网络创业按照1. 找项目；2. 挖掘具体案例；3. 复制同行；4. 打造团队这四个步骤来。管理好自己的现金流，实际上是非常简单也容易的创业。成本也很低廉，建议年轻人都可以来玩一玩。


    具体的，我以后还会讲，也可以参考我初期的节目，这方面讲过不少。


    ## 如何在互联网上找项目


    如何在互联网上找项目做？比如，大家打开新浪网站，会看到各种各样广告，每个广告其实就是一个项目。如果这些项目不赚钱的话，别人为什么愿意花钱在上面做广告呢？所以，只要在上面打广告的，一般都是赚钱的项目。


    找到这些项目后，比如我刚才在新浪上看到上面有个卖思途男士太阳镜的广告，一周就卖了2200个，而这个太阳镜单价99元。我敢说他的进价也就几块钱一个，利润一个90多块。现在马上是夏天了，买太阳镜的人很多。这属于季节性项目，我只是给大家举个例子。


    那找到这个项目了，我们怎么做呢？首先解决货源。现在是生产过剩的年代，谁能卖出去谁牛逼，货源到处都是。大家可以到阿里巴巴上去拿，批发价便宜得要死，几块钱一个太阳镜。我刚刚在阿里巴巴上找了一下，有很多都是不到10块钱的进价。找到货源后，现在，完全复制别人的淘宝店或者网页，只需要改下网店的名字，甚至你可以自己做个品牌名字，叫“牛逼氨麦（注：应为“贩卖”或“爱美”？可能是“牛逼贩卖”）太阳镜”都可以。分分钟搞定一个网店或者独立网页。为什么分分钟？我让你完全复制他的网页，只改几个字就行（注：原文“行广”应为“就行”或“行了”）。如果你会PS更好。如果你不会做网站，以后我会讲怎么做，你自学也就2天就学会了，现在都是模块化设计，非常简单。


    网页复制下来就可以推广了。如果你有闲钱，那么可以采取直接在新浪上卖广告或者其他网站上卖广告。如果没有钱，其实也很简单，自己写软文，到处发。不过这就粘（注：应为“沾”或“是”）体力活。这个体力活呢，你可以几千块钱招聘个网络推广员帮你推广，你也不用来千（注：应为“做”）体力活了。


    赚钱就是这幺（注：应为“这么”）简单，拿掉你的条条框框。做生意，大家都这样玩的。你还可以在上面找到其他的项目，比如卖股票软件的，卖腰带的。


    简单步骤就是找到别人赚钱的项目，找货源，复制别人的网店、网站，然后推广。包联网（注：应为“互联网”）目前处于捡钱状态，大家可以参与进来玩玩，就算做不起来成本也就千把块。


    如果你是纯屌丝，穷得连2000块钱都拿不出来。我也有项目让你发财。


    很简单，我经常逛天涯。天涯里每个版块都有项目，这些就是大家用软文推广在做项目。你在里面看哪个帖子回复的比较多，有吸引力，你就去复制他的帖子，学好了然后用自已（注：应为“自己”）的语言改编一下，然后同样扔到这个版块，或者扔到其他版块，然后做好互动性，比他原贴更加认真的去回复，你就会发现顶到20万帖的时候会有人交钱给你。这纯粹是软文营销的魅力。你自己不会写软文没关系，只要你会复制、粘贴、聊QQ就行了。很多软文写手天天在天涯里面写啊写，不赚钱，鬼才会玩啊。


    第三个找项目的好地方，是百度贴吧。大家到百度贴吧流量最大的50个贴吧去翻一翻，每个贴吧都会找到一个好项目。比如我在一个贴吧里找到一个家伙卖花卉技术的，6000块一个套。


    我就把他这个花卉技术整理好。然后我加了很多QQ群，这个QQ群是一些小企业主，各行各业的批发商。我就在群里说，我这个花卉技术免费送，要的加我QQ。结果我发现很多人加我QQ了。那么证明很多人感兴趣，这个项目就能活。我也找了其他一些项目，有些项目，你免费送，都没人理你，果断不做这个项目，证明这个项目是个死项目。


    再给大家一个贱招，就是你发现你要做的那个项目，对手在那里推广，你就到哪里推广。他怎么干，你就怎么干，跟着收钱就行了。别自作聪明。刚开始创业的时候，切忌自作聪明，因为别人已经探索好了盈利模式，证明是可行的，你就抄啊抄的把钱赚了。


    ## 初入门做网赚的步骤


    初入门做网赚步骤如下：


    1. 确定我们要靠QQ空间与QQ群来赚钱。当然你也可以确定你用淘宝，用网站，用YY，甚至用视频营销，但我们最拿手的还是QQ空间与QQ群这样的营销模式。

    2. 找到同行，找100个年赚500万以上的案例，研究他们的软文，研究他们的QQ空间是怎么打造的，研究他们的推广渠道。推广渠道可以在百度里搜索他们的QQ号码、电话号码，这样他们在那里推广的就可以了解一部分了。

    3. 找到同行的YY，去听各种各样的免费公开课。记住，各个老大最牛逼的，就是他们的免费公开课，这个公开课是他们赚钱的手段，也是他们最干货的地方，值得仔细研究。

    4. 上面几步做好了，比如QQ空间打造好了，同行业研究好了，然后确定好你要卖的具体产品，到各个渠道去持续不断的推广。比如你采取在天涯上发布软文来推广，那么就得持续不断的发。千万不要发了一周，没效果，就放弃了。要不断总结，不断改进的心态来做好软文推广这件事。


    如果想具体了解，可以加入我们的VIP群，我们会详细讲解各种暴力项目，地面的30%线上的70%，都是0成本暴利项目。地面的，起步资金1000元以内，月入2万很正常。我们玩的是智力游戏，欢迎有毅力、有魄力的人加入我们VIP。


    ## 互联网上怎么做推广与引流


    这里做天涯、百度贴吧推广与引流的经验分享。


    1. 热门帖子相互倒。什么意思呢？大家打开天涯论坛，找到天涯热帖排行榜，看看这些点击量很大的帖子，都是些什么内容，可以与那些产品嫁接，筛选出来适合自己的帖子，改编整理好，然后可以发到百度贴吧里，留下自己的微信、QQ号，让别人加过来。同样，你也可以把西度（注：应为“百度”）贴吧里的热帖，倒到天涯上去，留下自己的联系方式。热帖就是软文高手运作的帖子，你自己都不用写，拿来改一改，就能赚钱啦。比如八卦娱乐帖子，你可以发到明星吧等等。

    2. 悬疑推理帖子留半截，剩下的一半留到自己的微信、QQ上。有好奇心的人想看下一半，他就来找你了。你就可以积累粉丝，要注意广告性质不要太明显。

    3. 注意天涯、猫扑、西祠胡同、百度贴吧。早上到中午其实都是越（注：可能多余）没什么流量的，中午12点过后到晚上12点流量最多。引流尽量在对的时间对的群体中去引流。没流量的早上这段时间，你要做的就是优化你的帖子，找到好的能帮助营销你的帖子。到了下午晚上，你就得集中精力做推广。

