    这也是我现在的招聘策略，我竭尽全力的去选择优秀的人跟我们 混，优秀的人你不需要教他，他自己会教自己，自己就能把工作做好。如果你招聘到了不优秀的人，看似节约了底薪，其实，这个人进来，
    你需要培训他，这就是成本，他工作也不够努力，做得也不好，这又 是成本。所以，花 1 万块招聘一个优秀的员工,好过花 5000 块招聘两 个差的员工。


