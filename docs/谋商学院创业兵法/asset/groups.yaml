    ## 第三章 创业项目的选择和操作


    ### 选择什么样的生意来做


    我选择生意的几大法则，有所保留地奉献给大家一部分。


    第一：零成本的生意。我考察一个生意好不好，首先考虑的是它的成本高不高。这个生意的成本无限趋近于零呢，就是好生意。因为这样，不仅谁都可以起步，而且做大了后，边际成本几乎为零，扩张起来非常的爽。那么这些生意都是些什么生意呢？


    - 培训：培训这个生意简直是完美的生意。一个老师，几张桌子，你们交钱吧，一收就是几千块。两个月教40个学生，而且这还是线下的培训。由于现在互联网的发展，出现了很多线上的培训，这就更加爽了。有的人录制些视频进行培训，有的人靠YY来培训。比如：泡妞培训、PS培训、编程培训。而我呢，会做些创业培训、老板培训、网赚培训。

    - 卖虚拟资料：这个东西你在淘宝里搜一下，就会发现有很多人在大发其财。各种各样的虚拟资料，有学习的，有各种电子书，当当网的资料，有各种视频，各种名人演讲，各种项目资料。以前我做办公室装修的时候，有人在网上卖效果图。

    - 文化包装的东西：给大家举一个例子：在淘宝搜索“回心转意符”，看看销量吧。成本几毛钱，卖价几百元。当然这类还有很多，我暂时不列举，有兴趣做这种生意的可以加入我们VIP群，我会讲具体操作步骤。

    - 策划：这个很复杂，我只给大家说一下。篇幅所限，我们继续说第二条。


    第二：项目必须是暴利的。


