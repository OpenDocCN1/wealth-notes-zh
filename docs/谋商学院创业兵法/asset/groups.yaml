    # 第六章


    # 成功者的素质


    # 创业人到底是种什么人


    什么是创业人呢？创业的人就是喜欢折腾的人，是个拥有勤劳的 双手，并且拥有活跃脑袋的人。想发挥自己的才华，不愿意甘居人下， 想获得财富自由与精神自由的人。最重要的一点，他行动了。


    而打工仔，怕这怕哪的，混点日子，在别人的企业里得过且过就 行了。他们获得了暂时的安稳，牺牲掉自己的自由意志，自己的特 长也很难充分发挥，基本上也就牺牲了财富自由与精神自由的可能。


    我祝福大家，走上了创业这条路，我将终身陪伴大家，给'
  - '[PAGE 150]


    大家贡献我的经验。


    创业人是喜欢解决问题的人，是碰到问题就兴奋的人，而打工仔 碰到问题就头大。推卸责任，创业人也是解决问题的人，你总是喜欢 解决各种各样的问题，然后让业务正常化，让企业盈利正常化，创此
    人也是没事找事的人，当业务都正常了，我们总是要折腾点新业务出 来让大家干。


    创业的过程中，有的人可能会失眠，迷茫，甚至想老子不干了，但我们需要咬牙坚持下去。因为创业成功的喜悦是发自肺腑的，会让人 的心儿发颤，感觉棒极了。


    创业的男人，就算你长得很不是帅哥，都有女人把你当男神，这是我自己的体会，有狼一样的女人会喜欢你，而绵羊一样的女人跟 你没有共同语言，会早早地离开你。创业的男人，心理承受能力都很强，
    抹一抹眼泪，继续赶路。


    我经常见到 60，70 岁的大老板，依然精神矍铄的工作，依然没有周末，努力拼搏。我也见过很多穷人的孩子，他们上班的时候想着下班，想着放假，一天 8 小时，有四个小时拼命干活的人，都能成为企业管理级别的人物。这些打工的人，都不是发自肺腑的工作，效率极其低下，我们当老板的人，看在眼里，乐在心理，这些家伙就这样干吧，给我当一辈长工，反正他们的月薪很低。如果我算出来太亏了，我就会让他走，怎么算我都不亏。


    我们创业人自己给自己找工作干，而且是拼命的干，我们会发现 当我们 60，70 岁的时候，依旧会很健康，虽然我没 60，70 岁，但我 成天见到 60，70
    岁的老板，他们很健康，而普通'
  - '[PAGE 151]


    人，就健康不起来。我想-个是因为经济条件差，住房，医疗， 食物都差，另一个，老板们思维活跃，普通人思维僵化，因为 老板们一直在用脑，李嘉诚 87 岁了，依然健步如飞，依然每天
    早上 6 点就起来工作了。


    我们创业人最求完美的人生，我们想要努力去做成一件事 情，实际上我经常给我的伙伴们讲的就是，如果你能把一件事 做到极致，你 能发大财。而打工仔，基本没机会做好一件事，
    因为打工仔的时间老板安排的，他的时间是碎片化的，所以没 啥前途。


    # 创业者就是很多东西都跟普通人想得不一样的人


    创业者是那些能够比普通人见识深的人，《孙子兵法》讲： 见日月不为明目，闻雷霆不为聪耳。意思是说，你看到了太阳 月亮没什么 了不起，因为普通人也能看到，你听到了打雷不能
    说明你耳朵灵敏， 因为大家都能够听到。


    普通人开公司，或者是当领导，招聘员工，总是招聘一些 不如自己的人进来，以为这样好管理，我碰到有些老板还告诉 我说，怕秘密 让员工知道了，他会了，就自己去干，不跟我做
    了。这都是小肚鸡肠 的人，没有大格局，成不了大气候。


    比如微软公司的比尔盖茨说：“我只招比我聪明的人！” 比尔盖茨经常开除一些别人看来非常优秀的人，原因就是比尔 盖茨认为这个 人没他聪明。


    所以微软把环境、文化、氛围搞得好好的！


    让众多比“比尔盖茨还聪明的人”毫无后顾之忧的在微软 拼命的干，微软公司想不发达都不行！'
