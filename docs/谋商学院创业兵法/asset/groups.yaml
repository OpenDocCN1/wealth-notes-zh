    小学一年级的数学呢？不要怕降得多，因为扩张起来很容易；但如果你咬牙上了个高难度，你就降不下来了。


    其实这里大家都有个惯性思维（包括我），都想去够高起点，仿佛卖西餐就比卖牛肉面高级，卖牛肉面就比卖煎饼高级。所以资源和


    能力勉强能够到开家内餐厅的时候，就会勉强自己去开西餐厅。


