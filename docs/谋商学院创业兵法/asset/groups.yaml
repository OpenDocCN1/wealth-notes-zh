    ## 第六章


    ## 成功者的素质


    ### 创业人到底是种什么人


    什么是创业人呢？创业的人就是喜欢折腾的人，是个拥有勤劳的双手，并且拥有活跃脑袋的人。想发挥自己的才华，不愿意甘居人下，想获得财富自由与精神自由的人。最重要的一点，他行动了。


    而打工仔，怕这怕哪的，混点日子，在别人的企业里得过且过就行了。他们获得了暂时的安稳，牺牲掉自己的自由意志，自己的特长也很难充分发挥，基本上也就牺牲了财富自由与精神自由的可能。


    我祝福大家，走上了创业这条路，我将终身陪伴大家，给大家贡献我的经验。


    创业人是喜欢解决问题的人，是碰到问题就兴奋的人，而打工仔碰到问题就头大。推卸责任，创业人也是解决问题的人，你总是喜欢解决各种各样的问题，然后让业务正常化，让企业盈利正常化，创业人也是没事找事的人，当业务都正常了，我们总是要折腾点新业务出来让大家干。


    创业的过程中，有的人可能会失眠，迷茫，甚至想老子不干了，但我们需要咬牙坚持下去。因为创业成功的喜悦是发自肺腑的，会让人心儿发颤，感觉棒极了。


    创业的男人，就算你长得很不是帅哥，都有女人把你当男神，这是我自己的体会，有狼一样的女人会喜欢你，而绵羊一样的女人跟你没有共同语言，会早早地离开你。创业的男人，心理承受能力都很强，抹一抹眼泪，继续赶路。


    我经常见到60，70岁的大老板，依然精神矍铄的工作，依然没有周末，努力拼搏。我也见过很多穷人的孩子，他们上班的时候想着下班，想着放假，一天8小时，有四个小时拼命干活的人，都能成为企业管理级别的人物。这些打工的人，都不是发自肺腑的工作，效率极其低下，我们当老板的人，看在眼里，乐在心里，这些家伙就这样干吧，给我当一辈长工，反正他们的月薪很低。如果我算出来太亏了，我就会让他走，怎么算我都不亏。


    我们创业人自己给自己找工作干，而且是拼命的干，我们会发现当我们60，70岁的时候，依旧会很健康，虽然我没60，70岁，但我成天见到60，70岁的老板，他们很健康，而普通人，就健康不起来。我想一个是经济条件差，住房，医疗，食物都差，另一个，老板们思维活跃，普通人思维僵化，因为老板们一直在用脑，李嘉诚87岁了，依然健步如飞，依然每天早上6点就起来工作了。


    我们创业人最求完美的人生，我们想要努力去做成一件事情，实际上我经常给我的伙伴们讲的就是，如果你能把一件事做到极致，你 能发大财。而打工仔，基本没机会做好一件事，因为打工仔的时间老板安排的，他的时间是碎片化的，所以没啥前途。


    ### 创业者就是很多东西都跟普通人想得不一样的人


    创业者是那些能够比普通人见识深的人，《孙子兵法》讲：见日月不为明目，闻雷霆不为聪耳。意思是说，你看到了太阳月亮没什么了不起，因为普通人也能看到，你听到了打雷不能说明你耳朵灵敏，因为大家都能够听到。


    普通人开公司，或者是当领导，招聘员工，总是招聘一些不如自己的人进来，以为这样好管理，我碰到有些老板还告诉我说，怕秘密让员工知道了，他会了，就自己去干，不跟我做了。这都是小肚鸡肠的人，没有大格局，成不了大气候。


    比如微软公司的比尔盖茨说：“我只招比我聪明的人！”比尔盖茨经常开除一些别人看来非常优秀的人，原因就是比尔盖茨认为这个人没他聪明。


    所以微软把环境、文化、氛围搞得好好的！


    让众多比“比尔盖茨还聪明的人”毫无后顾之忧的在微软拼命的干，微软公司想不发达都不行！


    这也是我现在的招聘策略，我竭尽全力的去选择优秀的人跟我们混，优秀的人你不需要教他，他自己会教自己，自己就能把工作做好。如果你招聘到了不优秀的人，看似节约了底薪，其实，这个人进来，你需要培训他，这就是成本，他工作也不够努力，做得也不好，这又是成本。所以，花1万块招聘一个优秀的员工,好过花5000块招聘两个差的员工。


    如果你不是开公司，在别人公司里打工，你吸收我的思想，对你也有好处。比如你在别人公司里做领导，心态一定要摆正，在给上级汇报工作的时候要多提部下的功绩，要让你的上级觉得你手下的人个个都能干，随时都能接替你的工作，那么你离升职的时候就不远了，


    如果一个领导总说下属不如自己，其实上级就会想，是你领导无方，没有能力。那么你的位置永远都没人可以填补，那么你自己怎么能够晋升呢？


    所以这个世界很神奇，你给别人机会，上帝就给你机会，你断了别人的机会，上帝才不会给你机会。


    创业者要明白企业是个生态系统，要能容纳得下各种各样的人才，不管是正规军，还是偷鸡摸狗的人，只要是能为企业创造效益，不违法的，我们都可以笼络到自己手下，其实但凡干大事的人，手下的人才总是多种多样，比如宋江手下的人才，战国四君子手下的人才，都是如此。


    企业文化兼容性越好的公司，笼络的人才越多，发展潜力就越大。像谷歌这样的公司，为了挖掘不同人才的潜力，会让他们在工作时间中，有20%的时间是自由支配的。所以，谷歌公司发明了很多非常具有潜力的新玩意，比如无人驾驶汽车，无人直升机快递。这都是企业文化兼容性好的成果。


    创业者绝对不能小肚鸡肠，容不得沙子，我们只要达到企业发展，赚钱的目的就好，至于手段，完全不要去约束你的员工。


    经常有创业者问我学习的方法论问题，以及看什么书！


    我的经验是，越多越杂越好，像诸葛亮经常说“观其大略”是最好的，这样就不容易陷入到死角，不容易走极端！而且最好是两种意见截然相反的书同时读！一个人聪明不聪明，就是看你的脑袋里能不能容纳下两种截然相反的观点，还能够正常运转。


    等你学会把意见完全不同的书中的内容找到相同点，并且试着从中归纳自己的判断，并形成自己的系统，那就有所小成了。


    此外，我认为并非非要看书才是学习，看报，看电视剧，看广告，看世界万物，都是学习，人精练达即文章，世事洞明皆学问。


    学习是一个随时随地随事的事情，任何时候都能学习！


    比如去餐馆吃饭，就留意一下服务员的工作方法，看看怎么样的上菜方式是最好的，你会发现不同的服务员差别简直太大了，其实端盘子真的是有很大学问的！


    别人看电视都很烦广告，而我是经常看广告，有些比较好的广告真的值得好好推敲，你把那些好的广告修改修改，换成你的产品卖，你就相当于请了一个牛逼的广告策划，还不花钱。


    ### 创业者心态不好，就注定是个弱者


    #### 心态决定人生


    一位哲人说过：“你的心态就是你的主人。”在现实生活中，我们不能控制自己的遭遇，却可以控制自己的心态；我们不能改变别人，却可以改变自己。其实，人与人之间并无太大的区别，真正的区别在于心态。所以，一个人成功与否，主要取决于他的心态。社会上有很多在逆境中拼搏起来的人，都是因为心态好，心的强大。弱者主要是弱在他的心态。


    #### 生气不如争气


    人生有顺境也有逆境，不可能处处是逆境；人生有巅峰也有谷底，不可能处处是谷底。因为顺境或巅峰而趾高气扬，因为逆境或低谷而垂头丧气，都是浅薄的人生。面对挫折，如果只是一味地抱怨、生气，那么你注定永远是个弱者。其实人生大部分都是失败，但只要抓住一次机会成功了就行了。


    #### 有自信才能赢


    古往今来，许多人之所以失败，究其原因，不是因为无能，而是因为不自信。自信是一种力量，更是一种动力。当你不自信的时候，你难于做好事情；当你什么也做不好时，你就更加不自信。这是一种恶性循环。若想从这种恶性循环中解脱出来，就得与失败作斗争，就得树立牢固的自信心。


    #### 心动更要行动


    生活不会因为你你想做什么而给你报酬，也不会因为你知道什么而给你报酬，而是因为你做了些什么才会给你报酬。一个人的目标是从梦想开始的，一个人的幸福是从心态上把握的，而一个人的成功则是在行动中实现的。因为只有行动，才能赚回滋润你成功的食物和泉水。


    #### 平常心不可少


    人生不可能一帆风顺，有成功，也有失败；有开心，也有失落。如果我们把生活中的这些起起落落看得太重，那么生活对于我们来说永远都不会坦然，永远都没有欢笑。人生应该有所追求，但暂时得不到并不会阻碍日常生活的幸福，因此，拥有一颗平常心，是人生必不可少的润滑剂。


    #### 宽容是一种智慧


    俗话说得好：“退一步海阔天空，让几分心平气和。”这就是说人与人之间需要宽容。别人来找你这个当老板的麻烦了，你后退一步，可能付出很小的代价就解决了，而你前进一步，可能流血五步！我们没必要跟屌丝血流五步。


    #### 学会给心灵松绑


    人的心灵是脆弱的，需要经常地激励与抚慰。常常自我激励，自我表扬，会使心灵快乐无比。学会给心灵松绑，就是要给自己营造一个温馨的港湾，常常走进去为自己忙碌疲惫的心灵做做按摩，使心灵的各种零件经常得到维护和保养。


    #### 别把挫折当失败


    每个人的一生，难免都会遭受挫折和失败。所不同的是失败者总是把挫折当失败，从而使每次挫折都能够深深打击他取胜的勇气；成功者则是从不言败，在一次又一次的挫折面前，总是对自己说：“我不是失败了，而是还没有成功。”一个暂时失利的人，如果继续努，打算赢回来，那么他今天的失利，就不是真正的失败。相反的，如果他失去了再战斗的勇气，那是真输了。


    #### 避免烦恼成心病


    在现实生活中，终日烦恼的人，实际上并不是遭遇了太多的不幸，而是根源于烦恼者的内心世界。因此，当烦恼降临的时候，我们既不要怨天尤人，也不要自暴自弃，要学会给心灵松绑，从心理上调适自己，避免烦恼变成心病。


    #### 快乐其实很简单


    一个会心的微笑，一次真诚的握手，一次倾心的交谈，就是一些快乐无比的事情。


    一切财富、名誉、地位，都是外在表象。心态才是根本，马云不是现在才成功的，他几十年前就成功了，因为他心态好。很多创业者并不是日进斗金的时候才成功的，而是刚开始的心态就决定了他已经是个成功者了。为什么学习中国传统文化之后能够轻松获得财富！因为心态好了，人际关系就好了，也能够团结人了，也能静下心来把具体的事情干好，想不创业成功都难。


    ## 创业者需要哪些技能


    首先，那些声称自己讨厌销售或者不能做好销售的创业者必须失败，销售能力，是创业者的第一能力。


    如果仅仅会销售，有一个产品，勤勤恳恳的干下去，可以干成一个小老板，很多老板都停留在小老板的角色而不能前进一步成为企业家。原因是赚到钱后，不懂得培养新人，接替自己的位置，自己一直在当销售经理，而不是老板。销售产品开始要老板抓，发展到一定时候，就应该放手。


    放手干什么呢？开始学习运营，财务，员工管理，法律，以及薪酬管理。这是走向企业家之路，别以为企业家很悠闲，企业家实际上非常辛苦，如果你想随心所欲的做事情，最好别把企业做大。


    如果你是个工作狂，学习狂，享受工作，犹如李嘉诚，比尔盖茨这样的工作狂人，那么成为一个企业家是一件美事。


    当你把我提到的这钱基本能力都学会了后，注意，不是叫你学精通，而是基本会了就行了，关键点你能掌握，你的员工就欺骗不了你，你就可以根据市场来制定公司战略。


    这些都完成了，还想壮大，就开始疯狂的专研交际能力。人的本质是一切社会关系的总和！马克思讲的真理，你现在开始用得上了。


    还有最最重要的一点，就是必须大方慷慨，你若只想打工或者你无需大方慷慨的对待你的员工，核心成员。而如果你想做大做强，你必须让跟着你混的人一起分享你的财富。他们才会与你一起为公司着想，拼命。


    ## 创业者要刻在脑子里的思想


    一个人要想做大事，要么把所有的心思花在组建团队身上，成为一个企业组织者，要么成为一个研究者，做自己特别喜欢做的事情。如爱因斯坦研究物理学一样。我想对大多数人来说，组建团队是一条容易走的路。


    人应该经常去看看那些比自己富的人住的房子，开的车子，拥有的地位，通过见识去唤起自己的野心，如果你的环境都是些很差劲的人，我建议你经常去那些富豪集中的小区里转转。大着胆子走进
    去，保安有时候搞不清楚你是不是业主，不会拦你，不过有些高端小区要打卡才让进，你也可以找房产中介说要买房子，然后就混进去了。


    对于创业者，我是不建议一开始就创新的，先找到一个你认同，又能模仿的产品或者服务，他怎么干，你就怎么干，他怎么卖你就艺么卖，先赚到钱再说，有了钱去想创新的事情。


    永远不要怕出丑，永远不要怕失败，其实每一个成功的人都经过！一而再，再而三的失败才成功的，失败与出丑是必经之路。


    作为老板，想要员工听话，你自己必须先要做到，你自己没结果，说再多，大家最多表面上服从你，私下里其实觉得你没什么本事，老板必须做到让员工心服口服，这个企业才有发展前途，这就要求老板必须以身作则。


    创业，必须不断的行动，而不是只知道在那里做计划或者纸上谈兵。只要你行动，你就会感觉到快乐。不行动，慢慢的，你的项目没有推进，你的钱快要玩完了，你就会感觉到很痛苦。


    梦想，理想要是天讲给员工听的，听多了员工就相信了，谎言说一千遍就成了真理，这样你就可以利用员工的智慧去帮你实现梦想了。


    要明白新员工不是一次就能教会的，你妈妈教你走路还教了无数次呢。多点耐心去培养员工，对于实在不能上道的员工，采取立刻开除的态度。老板在公司里姿态越低，越有影响力，大家越愿意帮你做事，姿态越高，别人越不愿意跟你混，特别是现在90后，比较自我，要尊重员工。


    老板的工作能力加上工作态度，决定你的企业在市场上的竞争力。老板的工作态度更加重要，员工的工作能力更加重要。


    ## 创业者最大的财富是激情


    这个时代，有无数的传统企业家，年纪40多了，不思进取，依然活在互联网之前的时代，依然自恋自己曾经很牛逼，依然陶醉在互联网之前的成就感里，这是很危险的，我希望他们尽快进入到互联网的时代，进入到数字时代，智能时代，但这群老企业家，很难从以前熟悉的世界进入时代。


    老企业家们不管柯达怎么死的，也不管爱多怎么死的，更不管诺基亚怎么死的，谈到微信，移动互联网，互联网金融，社群营销，他们还完全处在排斥中。这是最可怕的，是抗拒时代的发展，是逆潮流的，硬生生把自己定格在落伍者的行列里。


    这些人为什么会这么保守？我的理解就是缺少激情。其实我个人为什么会走上创业之路，就是想要睁眼看世界，想要去扩大自己的见识面，一个人有激情，才愿意跟着时代跑，3D打印机来了，了解3D打印机，微信来了玩微信营销，机器人来了玩机器人，淘宝来了玩淘淘宝，智能时代来了玩智能时代。凡是跟着时代的潮流能赚到钱的，都是非常积极的人，在大家还没感觉的时候，就投入时间，精力去研究，等到大家有感觉，醒来的时候，就抢占了先机，就有钱赚。实际上，这个社会，每3到5年，都有一个大机会可以让人发财。但是很少有人可以拥有激情不断地去探索。


    比如QQ推出的部落现在述不怎么成熟，但是已经有先行者在努力研究，在做营销，并且已经有人开始赚到钱了。


    所以，创业者最最需要的就是要跟上时代，保持激情，我想，那些老企业家年轻的时候，肯定也是很有激情的年轻人，才会去创业的，结果老了，把激情弄丢了。


    一个人要想持续成功，就要保持激情，就必须跟上时代的发展，否则，就会成为柯达，诺基亚，爱多的下场。


    ## 创业者最重要的能力不是做产品的能力


    很多创业者喜欢讲，我有一个非常好的产品创意，我有一个很好的想法，然后就把自己全部的精力、时间、金钱、团队、都投入到让产品落地，或者改善产品的性能与质量上去了。


    这个过程非常耗时耗力，最后经过半年，甚至一年时间，做出来个产品还没有打开市场，钱就花光了，团队也没有信心了，就散伙了。


    问题出在哪里？就是因为市场上最不缺的就是产品，到处都有优秀的产品，而市场上最缺的是具有推广能力，营销能力的人，只要有了推广能力，营销能力，随便找个好产品，就能卖起来。


    其实微软公司的windows操作系统，也不是比尔盖茨做出来的，而是比尔盖茨推广到全世界的；QQ也不是马化腾做出来的，也是马化腾把QQ推广到全中国的；华为公司的任正非，开始也是背着包卖交换机的一个代理商，而且是交换机的生产者。


    拥有一个好产品，是创业过程中最不重要的事情，创业者最好一开始就打造一个营销推广团队，把营销推广团队当成重点，企业成功的几率就大很多。


    大家都知道马云是个英语老师，不懂数据库，也不懂网站建设。但这没关系，马云是一个好的营销推广人员。


    创业者的方向对了，就容易成功，方向错了，不管你多努力，成功也很难。


    ## 创业，只做自己能力范围内的事


    你去大街上转一圈，可以说在任何失败的，奄奄一息，半死不活的生意上，都可以看见“做了能力以外的事”的影子。


    我经常碰到一些创业者，只有100万，却以为自己很聪明，做了需要500万才能干的生意，最后资金链断裂，人才匮乏，往往是倒闭了事。


    虽然他们各有各的问题，具体到各自己的问题上，他们遇到的问题不一样。


    但是我们从战略高度来看，他们的成败，与他们遇到的问题，与他们的能力是无关的。


    能力再小的人，比如一个两岁大的孩子，你让他用手去抓薯条，他会遇到什么问题？又怎么可能失败？他一定搞得定。


    什么意思呢？就是创业，必须做自己能搞得定的事。


    能力再大的人，比如马云，李小龙，爱因斯坦……全部召集起来，给他们双筷子，让他们去把没有剥壳的生鸡蛋夹起来，他们怎么可能不遇到问题？又怎么可能会成功？


    如果我们去深究他们每个人失败的原因，比如爱因斯坦不善于用筷子，他应该多加练习；李小龙力气太大，把鸡蛋夹破了；马云会取巧，他把筷子反过来用方头去夹，值得学习，可惜手劲不足，功败垂成……


    这样去分析，从战术层面有意义，但不是我们要说的重点。因为，他们都做了他们能力以外的事情，从战略层面毫无意义。


    你看李小龙能踢碎2米5高的灯泡，那2米6的又如何呢？就算我们把他的能力放大十倍，一百倍，他能踢碎250米高的灯泡，那251米的又如何呢？


    就算我们的能力被放大十倍一百倍，如果我们老是设立过高的目标，做自己能力以外的事，铁定是要失败的。

    '
