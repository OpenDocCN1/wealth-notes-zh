    举个例子，老总每天上班遇到的事情，跟清洁工每天上班遇到的事情，是完全不同的。


    不同的环境，决定了你会遇到事情和问题，最终训练了不同的人素质和出来。


    所以我们的工作，会决定我们未来的前途，这就是我为什么坚决反对体力活的原因。


    因为体力工作会把你训练成“头脑简单四肢发达”的蠢蛋。


    每个人只是对环境信息刺激的产物，我们每个人的意识和观念，都是自身所处环境的产物。


    站在这个角度说，你坚持自己的观点毫无价值，因为你的观念只是你的环境的产物。


    乞丐和富豪观念不同，想法不同，仅仅是因为乞丐和富豪工作环境的不同造成的。


    如果你把一个乞丐放到富豪的位置上，一开始乞丐狗屁不通，可能造成很多损失，但不需要多久，比如十年八年，这个乞丐就会被“富豪环境”训练一个合格的富豪。


    这就是王思聪他爸爸王健林为什么说，给儿子5个亿，让他去犯错积累经验。


