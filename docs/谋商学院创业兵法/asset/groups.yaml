    如果你生在了普通家庭，你的父母其实不能教会你什么有竞争力的东西，这不怪他们，因为他们也不懂啊。要求他们做到他们不懂的事情，岂不是太不讲道理了？


    但是当我们明白这些道理的时候，我们想在这个社会上有竞争力，就要自己教育自己，想办法多看书，多学习，多交有能力，有前途，学习能力强的朋友。尽全力的去改变自己，争取给自己的下一代
    “传道授业解惑” ，做一个有竞争力的父母。自己的起点不公平，没什么好抱怨的，这个世界本来就不是公平的，而且从来没有公平过。


    《易经》中有句话 “天行健，君子以自强不息。”说的是要靠我们自己自强，我想，这才是我们每个有志青年应该做的。


