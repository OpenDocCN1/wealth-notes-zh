    学员可以具体找我了解操作步骤。我稍后也会整理一个文档给大家。大着胆子来混社会吧，夹着尾巴做人也是一辈子，赚不了几个钱，大着胆子混社会吃肉，就是这么简单。当然我们一定要多看书，多用脑子，多用策略。我们会一步一步的带着你玩网赚暴利项目，玩会网赚项目，还打什么工啊。做网赚要学会聚焦，赚到钱的人只聊自己的项目，时时刻刻都在想怎么与人合作，与人分钱，自己的团队怎么赚钱；与自己无头的事情，基本不关注。


    每个人的精力，时间都是极其宝贵而有限的。贫穷的人总不珍惜自己的精力，时间。关注和操心了太多与自己无关的事情，不关心自己的事，当然自己那点事就做不好。


    能够赚钱的人，总是聚焦。珍惜自己的精力，时间。只关心自己的项目，赚到钱才是正事。希望我们的团队成员，VIP群员都只关心自己的项目，关心怎么能做好暴利网赚项目。优化自己的推广，优化自己的成交系统。赚到钱才是正事，如有什么问题，都可以直接打电话给我。


    做事当追求效率加效果。我从来不赞成一个人延长工作时间的，我只希望这个人做事情有结果。如果拿在社会上做事情来讲，就是这个人需要的是赚到钱。


    分细一点，就是目标有没有达到。我是希望每个人都能对自己进行目标管理。这是比较科学的做事态度。我们每天列出自己要完成的目标，1，2，3；然后这些 1，2，3
    在多长时间内完成，都需要标注好。


    完成后检查效果有没有达到预期，进一步反思这些达到目标的方法能不能进一步改进。那些在自己预期的范围内没有达到目标，原因是什么？我希望大家用这种科学的方法去审视自己。


    这种做法还会让人慢慢了解自己的特长，那些预期总是能完成，那些预期总是完成不了。我们人应该发挥自己的长处，总是能完成的任务，就说明了你有如此长处。应该加大力度，继续发挥自己的长处。总是完不成的任务是否考虑自己不适合做，非要做，就需要改进方法。


