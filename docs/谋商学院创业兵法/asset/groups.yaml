    一流品牌没了，剩下领域，还有很多嘛。关键是如何赚到“一流代言费”。


    这时，可口可乐、佳洁士浮出水面。营销人“水木周平”认为：“怀疑李宇春给可口可乐、佳洁士等一些国际一线企业代言是免费甚至是倒贴钱的。因为当李宇春能代言这样的一线城市产品的时候，国内的二、三线产品就会误以为可以借李宇春的形象，提升自己的品牌和销量。”


    这个逻辑成立，其实，我们接下来看到的事实，就是李宇春再卖，任何一个商标类别企业时，一定会按照一流代言费来收取，理由很简单：这可是可口可乐的代言人！你和可口可乐使用同一人，代言费想打折？你脑子进水了？


    但可口可乐与佳洁士很惨，印着李宇春头像的产品大量滞销：因为一个商业逻辑搞混淆了：神州电脑，因为购买人群本来就不大，所以“歌迷”们带来的就会是增长。而可口可乐与佳洁士，本来就已经是很多很多人在消费了，市场占有率已经接近极限，你期望“歌迷”们一天多喝五罐可乐？然后第天刷四遍牙？


