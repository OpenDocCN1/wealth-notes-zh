    我们要想尽办法去感染团队成员，这就需要内功，耐不是表面的技巧，方法，规章制度。


    我读历史，发现哪些创造了战争奇迹的将军往往都是是身先士卒，披坚执锐，与士兵同甘共苦，比士兵做得更好。


