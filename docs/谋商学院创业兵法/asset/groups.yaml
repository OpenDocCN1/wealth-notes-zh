    修养就是财富，见到别人得到更多，心中总是有些不平的人，很难把企业做大，也很难聚集能力强的人跟自己混，其实这样的人得到的反而少了。


    用亚当斯密观点补充一下奴隶比自由人更贵！奴隶难道不是只要不饿死他就行了吗？是啊。但是，对于奴隶来说，由于没有任何收益，偷懒就成了他唯一的利益，如果你手下全是不拿工资的奴隶，你的成本会达到最高，因为他们会想尽一切办法偷懒。要想降低成本，就要懂得把利益给别人，如此他们就自己去干活了。


    这就要求老板必须把利益分享给团队成员。所以美的的创始人最 聪明，他分享了利益。


    很多领导人都在追求无为而治，学了很多管理学，请教了很多高 人，也去了MBA！


