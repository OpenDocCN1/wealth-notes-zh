    # ### 心态决定人生


    一位哲人说过：“你的心态就是你的主人。”在现实生活中，我们不能控制自己的遭遇，却可以控制自己的心态；我们不能改变别人， 却可以改变自己。其实，人与人之间并无太大的区别，真正的区别在
    于心态。所以，一个人成功与否，主要取决于他的心态。社会上有很 多在逆境中拼搏起来的人，都是因为心态好，心的强大。弱者主要是 弱在他的心态。


    # ### 生气不如争气


    人生有顺境也有逆境，不可能处处是逆境；人生有巅峰也有谷底， 不可能处处是谷底。因为顺境或巅峰而趾高气扬，因为逆境或低谷而 垂头丧气，都是浅薄的人生。面对挫折，如果只是一味地抱怨、生气，那么你注定永远是个弱者。其实人生大部分都是失败，但只要抓住一次机会成功了就行了。


    # ### 有自信才能赢


    古往今来，许多人之所以失败，究其原因，不是因为无能，'
