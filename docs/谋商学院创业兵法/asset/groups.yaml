    1200 比丘都是一直跟着佛主的，这就是文化级别的 管理者，信仰级别的 管理者才能达到的水平。但凡国家的建立，基本上都是入门级别的宗教式管理，如普京是东正教的，我们伟大的共产党人都是信仰共产党的，可以去查下百科，看看信仰那一栏。但凡历史上搞了点动作的革命人物，无不是宗教管理，文化管理，信仰管理层面的人。如"拜上帝教"的洪秀全，"苍天已死，黄天当立"的张角。
