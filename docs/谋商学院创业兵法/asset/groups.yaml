    - 三姑六婆，实淫盗之媒。不要与妇女们啰嗦，不要多来往，包括像尼姑，道姑，修女，什么做媒婆的，算命的，走街窜巷卖药的，不要多来往。大概意思是，做人呢，要专注自己的事业，不要被无关紧要的人打扰。比如，你的同事又说看到什么稀奇古怪的事情，看到什么新出的衣服，电视剧，你不要凑过去聊。因为这对你的事业没帮助。

