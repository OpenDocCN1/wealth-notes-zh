  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_14_0.png)


    # 1）变量


    “经济繁荣”程度，和“城市人口”数量，是国王最关心的两个要素，也就是变量。但是，还有哪些变量与之相关呢？


    “城市移民”，与“经济繁荣”相关；“城市人口”，还与“出生人数”、“死亡人数”相关；出生死亡，又与“出生率”、“死亡率”相关；城市人口，还与之伴生“过度拥挤”、“疾病蔓延”。


    这些，都是国王应该关心的“变量”。'
