- pgno: 19
  md: '不算药品，但却扮演了抑制“疾病蔓延”的作用，让出生率高于死亡率，导致繁荣。


    “茶文化”，并没有直接带来“经济繁荣”。它只是“无意中”改变了“系统”一个变量，然后，系统带来了轰轰烈烈的繁荣。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_19_0.png)


