  md: '这又可能是一个巨大的商业机会。


    从买钻孔机，到需要一个孔，到需要挂照片，到需要留住美好的瞬间。逆着这条长长的因果链，不断向上追溯，你会不断提升磨练自己的洞察力，直到一针见血。


    # 第三，多打比方


    打好一个比方，通常有三个步骤：


    +   1. 找到你所描述的这个陌生事物的本质；

    2. 然后在你的模型库里，匹配有相同本质的，大家熟悉的事物；

    3. 然后用这个熟悉的事物，解释那个陌生事物。


    你看，打好比方，同时需要你有建立新模型，和储备旧模型的能力。它特别能训练一个人的洞察力。


    有一次，我带领我的企业家私人董事会，去小米参观。小米的联合创始人刘德热情地接待了我们。


    我问刘德，在小米的生态链中，有很多既不“高科技”，也不“智能”的产品，没有传感器，没有软件，有的干脆就是日用品，比如毛巾、床垫等等。小米不是要做“科技界的无印良品”吗？怎么真的做起无印良品的产品来了呢？说好的科技呢？


    刘德说，这类生意对小米来说，是“烤红薯生意”。


    什么意思？'
