- pgno: 73
  md: '# 10 | 还原大前提：过去有效，现在失效，怎么办？


    看透复杂世界，破解决策难题。欢迎收听《刘润·商业洞察力30讲》。这讲开始，我们进入新模块的学习。


    上个模块，我们在课桌前，学习用“变量、因果链、增强回路、调节回路、滞后效应”这5个结构模块，“搭建模型”。这个模块，我们开始练习用搭建好的模型“解决难题”。


    所有的难题，最终都是模型导致的难题；真正的解决，最后都是改变模型的解决。你一定注意到了我在不断强调“模型”这个关键词。


    那如何用模型解决难题？今天我们从一个叫“还原大前提” 的方法开始。这也是我作为商业顾问最常用到的一种方法。


    你遇到过这些场景吗？


    尖子生考进热门专业，毕业时找不到工作；补贴成本越来越高，但用户热情越来越低；你一直学宝洁的多品牌管理，突然宝洁自己砍掉一半的品牌；以前给女朋友送花她挺高兴，结婚了就开始骂你浪费……


    这些问题，看上去八竿子打不着边。但戴上洞察力眼镜，它们都是一类问题：大前提消失。这些问题有个共同特征：过去有效，现在失效。


    有家线下超市，过去生意很好。可最近一两年，消费者依然来逛，但看完不买，拿出手机在网上下单，然后空手走出超市。


    超市管理者很痛苦，问我：润总，我们尝试了很多办法，买三送一、免费班车、给孩子送冰淇淋，但这些过去一直有效的方法，最近不那么有效了。怎么办？'
  merge: -1
  img_proc: true
- pgno: 74
  md: '过去有效。现在失效。我说：这是因为一条“方法→效果”的因果链断裂了。


    “过去的办法”这个“因”，得不出“现在的有效”这个“果”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_74_0.png)


    可是，因果链为什么会断裂呢？


    因为你“看不见的东西不见了”。


    什么意思？你 কার画因果链时，心中一定隐藏着一些自己都没意识到的大前提。


    比如“点火，导致燃烧”这个因果链，有个隐藏的大前提：氧气充足；比如“苹果掉下来，就会砸着头”，有个隐藏的大前提：存在重力。


    这些大前提如此理所当然，以至于你可能完全忽视，甚至根本“看不见”，直到突然怎么点火也不燃烧了，苹果居然往天上飞了。这时候，你要告诉自己，很可能就是因为：你看不见的东西不见了。


    这个你看不见的东西，就是“隐藏的大前提”。


    没有啊！我没有隐藏任何大前提啊！知道你不会承认。那我们就一起找找看。


    这就是商业顾问的工作。


    比如在超市的例子中，首先，我们要理解，什么是超市？'
  merge: -1
  img_proc: true
- pgno: 75
  md: '超市，在本质上就是信息流、资金流和物流的万千组合。


    +   - 你去超市看到琳琅满目的商品，看看保质期，摸摸手感，这是信息流。\n- 挑好东西去收银台付款，这是资金流。\n- 走出超市，把东西拎回家，这是物流。


    但是超市为了给你展示信息流，花费了巨大的成本，租店面、付水电、雇人力、进库存，但却没向你收费。为什么？因为它决定“通过资金流差价，收回信息流成本”，这就是超市的商业模式。


    这个模式的成立，有“隐藏的大前提”吗？有的。那就是超市相信，80%～90%的顾客看中商品后，都会购买。因为以前，你没有别的选择。


    但是，今天有了互联网，信息流、资金流和物流，被切割了。人们可以在超市获得信息流，但在网上完成资金流，最后通过快递来完成物流。这意味着“80%～90%的顾客看中商品后会买”，这个理论当然被忽视了，“隐藏的大前提”，消失了。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_75_0.png)


    这就是“隐藏的大前提”吗？这还用说吗？这是必须的啊！不买我花那么多钱展示商品，有病啊？'
  merge: -1
  img_proc: true
- pgno: 76
  md: '“隐藏的大前提”的可怕之处，就是你认为它们不辩自明，绝不会错，所以提都用不提，想都不用想。但是，所有东西，都会变化，只是可能性大小而已。


    一旦大前提丢了，整个模型就都错了。


    还原了大前提，解决问题的方法，就显而易见了。


    你可以增加难在网上买到的商品比重，比如餐饮、娱乐、洗衣、儿童乐园；

    你可以改变商业模式，不赚差价，转而向品牌商收取“信息流展示费”；你可以收取会员费，帮助用户有恰反向全球采购最好、最便宜的商品。


    回到最开始的一组案例。


    +   - 尖子生考研选热门专业，毕业时找不到工作，也许是因为“热门专业永远如日中天”这个大前提消失；

    - 补贴成本越来越高，但用户热情越来越低，也许是因为“竞争对手补贴不大”这个大前提消失；

    - 你一直学宝洁的多品牌管理，突然宝洁自己砍掉一半的品牌，也许是因为“消费者获得信息的渠道少”这个大前提消失；

    - 以前给女朋友送花她挺高兴，结婚了就开始骂你浪费，也许是因为“你的钱还不是她的钱”这个大前提消失。


    大前提消失，就是你以为榨精子的生意可以一直做下去，可是第二天醒来……大清亡了。


    那应该如何防止“大前提消失”带来的“过去有效，现在失效”的问题呢？在搭建模型、分析模型时，还原大前提。


    怎么还原？从三个地方，找到大前提可能的藏身之处。


    # 第一，时间前提'
  merge: -1
  img_proc: true
- pgno: 77
  md: '小赵做了一个公众号，叫“你是第一个知道的”；写办公室八卦，每天中午 12:30 发。没想到，阅读量惊人地不错。他对自己的写作能力很满意。于是，又做了一个公众号，叫“上班的第一件事”，每天早上
    9:01 发，没想到，这次就数据很差。


    为什么？因为用户的阅读，是有周期性的。每天上斑路上、中午休息、晚上回家、睡觉前，是最主要的阅读时间。小赵第一个公众号成功，有个他自己可能都不知道的隐藏的大前提：发送时间。


    很多商业逻辑，都有时间前提。比如，公司采购有季节性，一年刚开始，和快结束，是最愿意花预算的时候；创业成功的人，不少都是正好踩对了时间。


    太早的话会被淹死，太晚的话赛道上已经很拥挤。


    # 第二，空间前提


    小钱开了一家健身房，很成功。他认为自己找到了一套成功的健身房运营规范。


    可是他用这套办法开第二家、第三家健身房时，都不成功。为什么？


    因为他的成功，有自己没意识到的，隐藏的“空间前提”：正好开在一家整天加班的互联网公司旁边。而第二家、第三家，就没有这个优势。


    很多商业逻辑，都有空间前提。和田玉在美国这个“空间”比较难成功，因为玉在他们眼里，就是一种矿石；再好吃的甜豆腐脑，也不要拿到底方卖，他们只吃咸的。


    # 第三，技术前提'
  merge: -1
  img_proc: true
- pgno: 78
  md: '过去借钱，几乎必须要有抵押，没有抵押至少也得有担保，或者更大的机构授信。可是今天，你居然可以没有任何抵押、担保，就能从蚂蚁金服借出 20 万了。为什么呢？因为“很难建立起低成本的个人信用体系”这个大前提消失了。


    今天，支付宝可以通过一个人的消费数据、交易数据、打车数据、购物数据、人际关系等数据，来构建个人信用。这就打破了过去的大前提。“贷款必须要有抵押”这个模式，就不再是必须了。


    # 要点总结


    任何商业模式，或者说系统能够成立，都有“隐藏的大前提”。大前提消失，看不见的东西不见了，因果链就会断裂，系统就会失效。


    所以，过去有效，现在失效，这时你要条件反射地想到，一定是它所依赖的某个隐藏的大前提消失了。那怎么办？还原大前提。


    怎么恢复大前提？从三个地方，找到大前提可能的藏身之处，它们是：时间前提、空间前提，和技术前提。


    我们无法在画因果链的最开始，就把所有大前提都列在纸上，这样可能 100 张纸都不够。但是我们要知道，一定有些我们看不见的东西是被默认存在的。


    一旦遇到“过去有效、现在失效”的问题，就要开始寻找“隐藏的大前提”。


    好的，这一讲就讲到这里。下一讲，我们进行用模型解决难题的第二项训练：突破边界墙。


    今天我留给你一个思考题：你的公司赚钱吗？你还能还原三个，你公司能赚钱的“隐藏的大前提”吗？欢迎你在留言区和我互动。'
