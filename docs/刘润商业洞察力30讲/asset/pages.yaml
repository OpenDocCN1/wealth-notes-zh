- pgno: 120
  md: '你也别笑他们。我们就一定做得更好吗？


    仔细回想一下，你是不是也在上周的例会上说过：“我同意前面每个人的观点”，“嗯，我觉得都挺好啊”，或者“也行”？群体压力，就在你的身边。


    那么，CEO 如何识别团队正处于群体压力下，并破解其带来的“集思反而 mutta 不广益”呢？


    识别很简单。只要你发现，最近大家达成一致意见的速度特别快，就知道群体压力，已经在你的公司里扎根了。


    那么怎么破解呢？麻省理工学院教授库尔特·勒温（Kurt Lewin），对此做了深刻研究，并开创了一门新学科：群体动力学。


    既然这个问题本质，是一条“表达不同，增强群体压力；群体压力，压制表达不同”的调节回路。那么，切断这条调节回路，就能解决这个问题。


    具体怎么做？群体动力学里有不少工具。今天，我给你介绍最重要的三种：


    # 第一，魔鬼代言人（Devil''s Advocate）


    下次开会，你可以对 Jack 说：“Jack，今天的会议，你负责做魔鬼代言人。”


    魔鬼代言人，就是故意唱反调的人。被领导安排“故意”而不是自己“有意”唱反调，Jack 没有了“群体压力”。


    故意唱的反调，有用吗？有用。就算这些反调，不着调。


    后来很多人重复了阿希实验。结果发现，实验的 6 位助手中，只要有一位提供了不同答案（即使错误），受试者表达不同意见的勇气都会大增。37%的犯错率，显著降低。


    # 第二，头脑风暴（Brainstorming）'
  merge: -1
  img_proc: true
- pgno: 121
  md: '我们得到的同学，对“头脑风暴”一定再熟悉不过了。我在《5分钟商学院·基础》的工具篇，专门介绍过它的流程。


    可是，为什么头脑风暴能够切断群体压力调节回路？


    因为头脑风暴的核心技术是：1）重量而注重质；2）提出而不反驳。


    “大量不准反驳的想法”，这个设计，让每个人都“必须”发表不同观点，而不用担心受到群体压力的打击。


    # 第三，名义群体法（Nominal Group Technique）


    名义群体法的流程是：


    +   1. 在进行任何讨论之前，每个成员先独立写下自己的观点；

    2. 然后把观点交给群体，并逐一向大家说明自己的想法；

    3. 然后开始讨论；

    4. 最后，每个成员独立把各种想法排序，得分最高者作为群体决策。


    “先写观点，而不是先讨论”是关键，因为这样，成员就无法迫于群体压力，在讨论时放弃自己的观点。讨论依然必要，但没有一个观点被放弃。


    # 要点总结


    什么是群体？超过三人，就叫群体。群体，是一种没集体正式、比个体复杂的自发组织。比如公司管理层、羽毛球俱乐部，或者今天会议室里的所有人。


    那什么是群体压力？当成员发现自己的意见和群体抵触时，会产生巨大的压力，从而主动放弃观点，接受群体意见，这就是群体压力。'
