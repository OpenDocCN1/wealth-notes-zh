- pgno: 5
  md: '这四个训练场，“解决难题”、“看透人心”、“预测未来”、“终身练习”其实对应解决的，分别是你的：商业经营难题、管理难题、时间难题和思维难题。


    我把破解这些难题的思路，都封装进了这四个训练场中。


    祝你看透这个复杂的世界，做自己公司的商业顾问，做自己人生的战略顾问。


    不抽象，就无法深入思考；不还原，就看不到本来面目。


    《刘润·商业洞察力 30 讲》欢迎你的加入！


    # 01 | 系统：我们说洞察力时，到底在说什么？


    这一模块，我们学习洞察力的基本功：搭建模型。


    这一讲，我们从一个支撑起整门课程的基础概念开始：系统（System）。


    什么叫“系统”？


    我们内心深处，相信“人”的无穷力量。遇到困难时，我们期待力挽狂澜的卓越领导；遇到灾害时，我们渴望无所不能的超级英雄。我们相信：“人”对了，就什么都对了。某互联网公司创始人甚至说过：一切不行，都是“人”不行。


    但是，真的''是这样吗？


    给你讲个故事。


    1971 年，美国心理学家菲利普·津巴多，做了一个著名的实验，一个今天已经不被允许，也不可重复的实验：斯坦福监狱实验（Stanford Prison Experiment）。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '津巴多找到了 24 名生理、心理都很健康的志愿者，把他们随机分为两组，一组扮演囚犯，一组扮演狱卒，在斯坦福大学心理学系的地下室，体验“监狱生活”。


    一开始，“囚犯们”感觉挺好，觉得是种少有的体验；狱卒们也感觉挺好，觉得自己一定是知情达理的狱卒。他们都觉得，自己是不一样的人”。


    但第二天，事情就开始失控了。


    囚犯有些受不了监狱的环境，发起了一场小小的“暴动”，撕掉囚服上的编号，拒绝服从命令，取笑狱卒。狱卒觉得是可忍孰不可忍，为了控制局面，“镇压”了这场暴动，强迫囚犯做俯卧撑，脱光他们的衣服，拿走他们的东西，并让他们空手洗马桶。


    第三天，第四天，第五天，场面几乎完全失控，狱卒拼命虐待囚犯，有些囚犯失声痛哭，并出现了心理疾病的症状。第六天，实验被叫停。


    这个实验震惊了整个心理学界。


    明显是随机的两组人，但只要把其中一组“人”放在狱卒的位置上，不管他们具体是谁、受过什么教育、有么信仰，他们就会去虐待囚犯。这些“人”是谁似乎不重要，因为有一股你看不见的、远大于这些“人”的力量，牢牢一把抓住了他们的双手，左右他们的行为。


    这种远大于“人”的力量，就是：系统。


    什么是系统？


    系统，就是“一组相互连接的要素”。


    这个定义中，有两个关键词：1）要素；2）连接关系。'
