- pgno: 0
  md: '# 发刊词 | 半秒洞察本质的人，注定拥有开挂的人生


    看透复杂世界，破解决策难题。


    我是一名商业咨询顾问，给企业的现状把脉，然后绘制未来的战略地图是我的工作。现在，我想把自己的看家手艺，传授给你，让你和一名真正的商业顾问一样拥有直击本质的洞察力。


    # 洞察力是一种什么能力？


    什么是洞察力，这种能力到底有什么用？我给你举几个例子，你就明白了。


    消费者希望房间便宜，酒店却想卖得更贵，交易总是达不成。于是，一边是消费者没地方住，一边是酒店空着房间卖不出去。


    怎么办？用“逆向拍卖”改变交易模型：


    +   1）消费者出价；

    2）酒店用临近午夜即将浪费的房间竞标。这样，消费者享受了低价，酒店消化了库存。用这个模型创立的 Priceline 公司，今天市值超过 800 亿美元。


    员工想轻轻松松工作，老板却希望你加班卖命。于是，老板做经理的事，经

    理做员工的事，员工在谈天大大事。


    怎么办？用“运营合伙人”改变管理模型：


    +   1）基本利润归公司；

    2）超额利润 60% 归员工。


    用这个模型，永辉超市的员工收入上涨 14%，公司收入上涨 15%。'
