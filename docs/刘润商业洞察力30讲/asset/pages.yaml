  md: '我有个朋友，带着几个小伙伴创业。最近公司业绩不好，于是开会讨论怎么

    办。小伙伴们争论不休，说“这里可以改进，那里可以更好，我早就说公司这

    样早晚要出问题的”。“指导”完这位于朋友之后，大家“满意地”下班了。留

    他一个人精神在办公室，加班到凌晨1点。


    他很苦恼，问我怎么办。


    我说，你是花钱请了一堆老板来，指导你干活。为什么会这样？因为小伙

    伴们都是坏人吗？当然不是。你才是坏人。“有事我来干，有钱大家分”，是一

    种特别坏的态度。你用“抢着干活”的行为，硬生生把小伙伴们的心态，从“干

    活”，逼成了“旁观”。但凡动手就能行的话，谁愿意动手啊。你用错误的

    模型，成功地把好人变成坏后，来找我抱怨。


    一句话：自找的。


    那怎么办？改变模型。普通的人改变结果，优秀的人改变原因，顶级高手改

    变模型。改变人心，就是一场心脏手术。它的本质，不是改变心脏，而是改

    变心脏和周围器官之间的关系。它的本质，也是改变模型。


    怎么改？系统模型中，最主要的结构是增强回路，和调节回路。因此，改变

    人心模型，下面这三种方式是最基本的：激活正向增强回路，切断负向增强

    回路，和增加安全调节回路。


    # 1.激活正向增强回路


    问你自己一个问题：任何一件事情如果没做好，公司里有没有一个员工，比

    你这个老板更着急？


    你的公司里，有没有出现过这种场景？'
