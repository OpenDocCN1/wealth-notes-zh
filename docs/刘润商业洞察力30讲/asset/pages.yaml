    # 12 | 安装缓冲器：怎样让河流更平静？


    你好，欢迎收听《刘润·商业洞察力30讲》。


    提问。你觉得下面这几件事，有什么共性？


    +   1. 某地市场，大雨之前发生旱灾，大雨之后发生水灾；

    2. 某手机厂商，因为相机供应商断货，手机上市推迟 2 周；

    3. 公司发展一直不错，没想到现金流突然断裂，几百人的公司，一夜之间挣死；

    4. 项目开始时人手总是不够，项目结束时人手总是多余。


    它们有什么共性？这些事看上去毫无关系，但是戴上洞察力眼镜来看，它们都有个共性：缺乏缓冲器。'
