- pgno: 53
  md: '能帮助我们作出正确的商业决策。怎么识别和处理好“滞后效应”，以下三条，是我从大量咨询案例中总结出的心法，请你收下。


    # 第一，原因不一定在结果附近


    我们应该如何学习谷歌？很多人参观谷歌后恍然大悟，回去后也建了一个六星级食堂。这就是因为缺乏对“滞后效应”的洞察。


    因为存在“滞后效应”，所以原因不一定在结果附近，可能在几天前，几个月前，甚至几年前。学习今天谷歌为何成功，你要看 15 年前它做了什么，而不是今天有什么。


    你的公司业绩大涨，真是因为销售们浴血奋战吗？当然是。但更重要的原因，可能并不在结果附近，而是在三年前，你投入大量资金进行研发的决定。


    你持续培训员工，没有看到结果，说明培训没用吗？当然不。原因不一定在结果附近，结果可能在几个月后的一场大战役那里等着你。


    # 第二，减少滞后，增加确定性


    朋友请我试用一款智能音箱。我打开包装，按下开关……没有反应。我再按一下，还是没反应。我问他，他说按下开关后等几秒钟。果然，6 秒之后音箱亮了。


    这就是滞后。用户“按下开关”这个因，到“打开音箱”这个果，有 6 秒的时间差。因为这 6 秒的滞后，用户不断重复操作，最终迷失。


    怎么办？减少滞后，增加确定性。按下开关后，先亮起一盏小灯，或者震动一下。这个小改动，就可减少滞后，增加确定性，让用户不再像个傻瓜。'
