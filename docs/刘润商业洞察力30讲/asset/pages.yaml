- pgno: 205
  md: '小米发展到今天，已经有 3 亿用户了，其中 2.5 亿是活跃用户。他们除了需要小米手机、充电宝、手环等等科技产品之外，也需要毛巾、床垫等高品质的日常用品。


    所以与其让这些流量白白耗散掉，不如利用这些流量米转化一些营业额。就像一个火热的炉子，它的热气散就散了，不如借助余热顺便来烤一些红薯。


    你看，小米做这些产品的原因，是大量流量背后的用户需求被白白浪费了。


    刘德明可以发明一个词，比如叫“流量溢出”，然后再花半小时解释，什么叫流量溢出。


    但是，“流量溢出”这个概念，对大多数传统企业家是很难以理解的。于是他搜索自己的“模型库”，发现“烤红薯”有着同样的本质。于是，他用“烤红薯生意”来解释小米生态链的逻辑。


    短短 5 个字，就把这个事情概括清楚了，通俗易懂而又透彻传神。


    对比比这点能力特别“高级”，一个人同时理解两件事的本质，才能比方得让人拍案叫绝。对比方其实就是知识迁移的能力，最高的洞察力其实是流动的、迁移的。为什么我在介绍基模时为你介绍应用场景，就是希望你能学会不断回归事物本质，学会迁移内在规律的能力。


    # 要点总结


    公式思维、层次思维、演化思维，是终身练习洞察力的心法；储备模型，不断追问，和多对比方，是终身练习洞察力的剑法。


    前人的思考，都凝结在优秀的模型中。储备模型，可以避免让我们重新领悟别人的基本功；但是，储备模型，不能取代建立模型的能力。不断追问，建'
