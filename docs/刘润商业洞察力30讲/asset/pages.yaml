- pgno: 124
  md: '1960年，美国哈佛大学的心理学家罗森塔尔，在加州一所学校做了一个着名的实验。他请校长对两位老师说：你们是本校最优秀的老师，为了奖励你们，我们特地挑选了一些最优秀的学生给你们教。请好好表现。


    两位老师非常高兴。一年之后，这两个班级学生的成绩，是全校最优秀的。


    这时，校长告诉了两位老师真相：其实，这些学生都是随机挑选的，他们的智商并不比别人高。两位老师完全没想到校长还有这一手。这原来是一个考验，看看最优秀的老师，是否能把普通学生教成优秀。校长接着说：其实，你们俩，也是随机挑选出来的。


    可是，这两个班级，确实成为全校最优秀的啊？这又是怎么样回事呢？


    你告诉老师：“你很优秀，你手下的学生很有天赋。”老师就产生了一个期望（或者叫：目标、愿景、梦想）；原来我很优秀啊！我的学生潜力都很大啊！


    但显然，我们现在并非是成绩最好的班级。期望和现实之间，存在差距。这个差距，让两位老师如鱼鲠在喉、如芒刺在背，忍不住努力改进教学。他们的工作，就是往优秀教师带顶级学生的设想不断努力。最终他们的班级，成为全校最优秀的。当然，这个过程中，师生之间的互动反馈，让取得一点点的成绩都被不断地彼此印证，越滚越大，最终形成一个通畅、强劲的增强回路。


    而启动这个回路的，正是这种忍不住缩小期望与现实之间差距，否则就“如鱼鲠在喉、如芒刺在背”的力量，就是“结构性张力”，它是增强回路系统的“元动力”。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '如果用我“结构性张力”的视角找“元动力”，世界就不一样了。比如，美vel，是女孩买漂亮衣服的元动力吗？准确地说，不是。和美丽之间的“差距”，才是。成功，是企业家奋斗的元动力吗？不是。和成功之间的“差距”，才是。


    任何确定的目标，都不是人的元动力；和目标之间的差距所导致的“结构性张力”，才是。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_125_0.png)


    回到最开始的案例。要不要在年会上，公布每个部门的目标？要。因为公布目标，能强化“结构性张力”，激发员工“缩小差距的行为”。


    甚至这都不够。管理学界最具影响力的科学家之一，维克托·弗鲁姆（Victor H. Vroom）认为，我们甚至应该帮助员工，把粗放的“缩小差距的行为”，拆分细化为逻辑严谨、环环相扣的
    3 个“只要……就……” ，强化员工心中的“结构性张力”：


    +   1. 只要努力工作，就能提高绩效；

    2. 只要提高绩效，就能获得奖励；

    3. 只要获得奖励，就能缩小差距。


    这就是著名的“期望理论”。弗鲁姆的“期望理论”用系统循环图表示，其实就是一条由 4 段因果链组成的“调节回路”：


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_125_1.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '一切的激励的本质，都是先设计“差距”，再利用差距带来的人心中的“结构性张力”，完成目标。


    那么，理解了弗鲁姆的期望理论，又怎么样呢？有大用处。你可以不断检查期望理论中这 4 段因果链的有效性，增强人心中的“结构性张力”，达成目标。


    # 1）差距，是否增强个人努力？


    差距带来的结构性张力有多大，有没有到员工的极限？你可以用下面这张量表检查，结构性张力的强度。


    +   - *100%*: 不惜一切代价，不达目的不罢休，不设任何退路；

    - *99%*: 那几座放弃的念头，在关键时刻会决定是就缴还是坚持；

    - *70%～80%*: 努力工作，等待运气，努力过就对得起自己；

    - *50%*: 有了最好，没有也罢，最好不付出就能得到；

    - *20%～30%*: 只会空想，光说不做，过几天就忘记；

    - *0%*: 那就是不想做，或者害怕得不到


    那怎样提高“结构性张力”的强度？增强“差距感”。你要知道，亚马逊、小米等品牌的新品发布会，真的只是为了宣传造势吗？其实还有一个原因就是倒逼生产链的进度，向市场公开签下军令状。它们本质，都是增强差距，制造结构性张力。


    或者，设计一个排行榜。销售团队的业绩，开发团队的 bug 数，客服团队的

    满意度。只要有排行榜，就有“差距”，就会强化“结构性张力”，增强个人努

    力。


    # 2）个人努力，是否增强个人绩效？'
  merge: -1
  img_proc: true
- pgno: 127
  md: '销售人员努力工作，可以提升产品质量吗？行政人员努力工作，可以提升客户满意度吗？客服人员努力工作，可以提升销售业绩吗？其实不能。就算有关，关系不大。


    努力工作，能做到 100 万业绩；跳一跳，探一探，能做到 200 万。有的 CEO 喜欢把指标设为 1000 万， 心想 morale 月亮，万一打中云彩呢？这就是把员工完成指标的可能性降为零。


    把不论员工怎么努力，都无法提升的业绩，放在他的个人指标里，也会让员工失去“结构性张力”。


    # 3）个人绩效，是否增强公司奖励？


    你的公司，是做到什么业绩，就能拿到什么奖励吗？有一个网站、一个 Excel 表格，或者一个简单的心算公式吗？还是只有老板说：大家好好干，我不会亏待大家的？


    到了年底，每个员工都拿到了他“认为”自己应得的奖励了吗？公平吗？


    如果这条因果链断裂，或者模糊，员工的“结构化张力”也会断裂、模糊。


    # 4）公司奖励，是否能缩小差距？


    员工把 2/3 的收入拿去还房贷，每天紧衣缩食，你和他说人生的追求应该是自我实现？公司奖励和个人目标如果不匹配，就无法带来“结构性张力”，员工一定不会努力工作。


    怎么办？我在《5 分钟商学院·基础》篇讲过马斯洛的 5 层需求理论。你要记住，员工真正想要的，才是公司应该奖励的。'
