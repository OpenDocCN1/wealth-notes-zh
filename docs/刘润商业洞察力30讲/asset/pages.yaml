- pgno: 67
  md: '但是，我们搭建的模型脆弱吗？用力碰一碰，它会轰然倒塌吗？环境变化时，这个模型会自我适应吗？它僵化吗？它灵活吗？它内部沟通顺畅吗？它，健康吗？


    这一讲，我就教你检查系统模型是否健康的三个指标：


    +   1. 适应力，就是突然遇到外部冲击，系统自我修复的能力；

    2. 自组织性，就是为了适应变化，系统自我突变的能力；

    3. 层次性，是通过把整体切割为局部，来控制系统信息风暴的能力。


    这三个指标纵向串联起了我在前面讲到的 5 个结构模块，你可以试着套用一下，看看自己是不是完全掌握了。


    # 第一，适应力（resilience）


    之前的两季《刘润·5分钟商学院》是年度日更的课程。日更，那我白天新鲜写，晚上趁热发，可以吗？


    不可以。这种“写一篇、发一篇”的模型，缺乏“适应力”，所以不“健康”。一旦遭遇出差、游学、生病，或者就是突然想发呆，这些外部的冲击，课程就会断更，系统就会崩溃。


    怎么办？用“存量”这个结构模块，增强系统“适应力”，应对意外。存量，就是在一个“静止的时间点”上，变量的数值。在这里，存量表现为库存。


    得到团队要求所有老师，必须始终保持 10 节课的库存。而我对自己的要求是 30 节。写作是流(入)量，发布是流(出)量，30 节课库存就是存量。这个存量，就像水库，雨季储水，旱季排水，保持河流的水量稳定。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_68_0.png)


    你呢？是不是也在意外附近，安放了存量？


    除了存量，“调节回路”，也可以提高系统的适应力。调节回路，就是因增强果，果反过来减弱因，像橡皮筋一样抵抗变化的因果回路。


    做得再好的计划，只要开始执行，就会产生偏差。偏差偏移越大，结果就会越差。怎么办？


    开周例会，不断纠偏。


    有创业者说，开会是最浪费时间的事情。这是误解。创业公司必须开周例会。


    为什么？因为周例会是最重要的“调节回路”。


    上周走偏了一点？调整方向；效率不高？是方法哪里不对；啊？你和我做的事情重复了？沟通一下，不要浪费资源。'
  merge: -1
  img_proc: true
- pgno: 69
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_69_0.png)


    一个管理者，90%的时间应该用于沟通；沟通中，90%应该讨论风险；然后，迅速调节。


    你呢？也设计了各种调节回路，应对风险吗？


    建立存量和调节回路是有成本的。但是，没有存量和调节回路的企业，就是拿健身的时间去加班，最终会用健康还债。


    用存量和调节回路应对意外，让系统保持健康的适应力。


    # 第二， “自组织性” (self-organization)


    那么什么又是“自组织性”呢？2019年1月，我带领我的私董会企业家组员，参访阿里。听了很多，看了很多。但我对一句话印象最为深刻：乱七八糟的生命勃勃，好过井井有条的死气沉沉。


    2013年5月，陆兆禧接任CEO，两年后，就换成了张勇；马云说只做平台、不卖商品，很快就投了个盒马鲜生；来往挑战微信之战一败涂地，那就立刻再做一个钉钉。'
  merge: -1
  img_proc: true
- pgno: 70
  md: '乱七八糟的生机勃勃，就是不执念于任何一种模型，不断从有序回到混沌，再从混沌走向有序的“自组织”能力。


    什么叫从混沌中走向有序？


    每只大雁都是独立个体，可它们聚在一起，就能“一会儿飞成人字形，一会儿飞成一字形”，很整齐。这些大雁商量过吗，排练过吗？没有。后雁只知道一件事情：死死跟住前雁。


    “前雁的位置，影响后雁”这个简单的因果链，不断作用，层层叠加，传递到整体这个层面时，就体现出一些令人叹为观止的特征，如大雁整齐的队列，如鱼群绚丽的舞蹈，如龙卷风死神般的旋转。


    一个纪律严明、奖罚分明、不准越雷池半步的组织，是特别有执行力的。但是，这也是一个从此不再“生长”的组织，是一个“死于25岁，葬于75岁”的组织。


    那怎么办？


    你至少可以成立一个“特区”，比如海尔的小微企业、腾讯的赛马机制、华为的红牛蓝军，允许新的因果链、新的增强回路、新的调节回路、新的滞后效应，在混乱的特区里尝试，这样才会看到惊喜自然发生。没有自组织能力的系统，是老化的系统，越来越不“健康”的系统。


    你的公司，允许员工“自组织”吗？还是凡事必须“井井有条”？


    # 第三，“层次性”(hierarchy)


    2019年刚开年，小米就宣布组织调整。放弃创业之初“CEO→部门负责人→员工”的“超级扁平化”管理架构，设立10个员工等级，和层次的汇报关系。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '有人说：小米堕落了。


    其实并不是，是你天真了。超级扁平并不代表先进。有合理层级的系统，才健康。


    我们想想人体这个系统。


    人体系统，有呼吸子系统、消化子系统、循环子系统。消化子系统里，还有食道、肠、胃等器官。而每个器官，最终都是由细胞构成。


    既然最终都是细胞在工作，那为什么上帝不把人造成一堆随需而用的，“超级扁平”的细胞群呢？为什么不在需要吃饭时全去消化，需要氧气时全去呼吸呢？


    那是因为，大脑无法直接管理人体内 40 万亿~60 万亿个细胞。和每个细胞说一句话，几乎子就过去了。这就是信息风暴。信息风暴，让没有层次的复杂系统，变得不可管理。


    那怎么办？


    上帝帮助大脑这个 CEO，设置了几个事业部：呼吸事业部、消化事业部、循环事业部；然后又在消化事业部下，设立了食道部、胃部和肠道部。肠道部，又下设小肠组、大肠组和直肠组。


    这样，大脑只需胃部内部沟通的信息，就可以在高效地在这个“局域网”内完成，不会造成“信息风暴”。追求极端的“增强回路”，和喜爱平和的“调节回路”，也都有了自己的作用边界，局部器官出问题，不会危及整个生命。


    企业也是一样。复杂，是成熟的代价。没有层级，只能说明你还小。所有对“超级扁平”的怀念，都是成年人对童年的缅怀。


    # 要点总结'
