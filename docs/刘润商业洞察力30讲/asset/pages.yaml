  img_proc: true
- pgno: 198
  md: '所以，你要学哪个版本的谷歌？静止的，还是演化的？


    对一些连房租可能都快付不出的创业公司，不要抱怨招不到优秀的人。你自己必须变得优秀。“坚持雇用最优秀的人力”这个谷歌成功后的蜜糖，可能是把你毒死在创业期的砒霜。


    海尔最全盛的时期，每年光参观接待的收入就六千多万。去了那么多人学习，全国也只有一个海尔。为啥？因为大部分人都是用静止思维学它的今天，却没有顺着海尔的时间轴，去学习它最重要的演化过程。


    那么怎样才能终身练习自己的演化思维呢？给万物装上时间轴，看过去，看现在，看未来。


    # 第一，看过去


    学习先进最基本的方法，就是“看过去”。学习谷歌，要学习 2000 年的谷歌；学习苹果，要学习 1997 年的苹果；学习微软，要学习 1985 年的微软。


    2019 年 1 月，我带领 20 位企业家飞赴西雅图参访微软总部。微软华人最高管沈向洋先生接待了我们，并讲解了微软转型的努力。同时，我特意邀请了一位在微软工作了
    29 年的员工，与大家分享，微软如何“一路走来”。


    这就是“看过去”。在谷歌一个月，我建议把加入谷歌 20 年、10 年、5 年、2 年，和最近加入的人，都请来谈一谈，听听他们昨天那些艰难的决定。


    # 第一，看今天


    为什么外企的明星职业经理人，去民企担任 CEO 成功的很少？'
  merge: -1
  img_proc: true
- pgno: 199
  md: '这些明星经理人在外企管理着上万人的公司，非常成功。到民企后一看，天啊，这公司怎么可以这么乱！！报销流程没有，预算制度没有，员工的考核制度没有，薪酬计划也没有，什么都没有，全都靠老板拍脑袋，公司活到今天真ojen奇y!


    于是他大展拳脚，报销制度、审批制度、出差流程、员工手册……各种各样的规则制定出来了，然后发现，公司的业绩反而下降了。


    怎么会这样？


    给企业的发展装上一根时间轴的话，它大概有三个时间刻度：创业期、成熟期、转型期。明星经理人在外企担任管理者时，通常是在企业的“成熟期”，所以他积累的，都是企业在成熟阶段的经验、流程、制度、KPI考评等等。


    大公司的光环，让他们把这些管理手段，当成了“跨越时间的永恒真理”！


    那今天的民营企业呢？很多都处于创业期。明星经理人，把“成熟期”企业的蜜糖，带入“创业期”的民企时，就变成了砒霜。


    对自己有不偏不倚的自我认知，是“看今天”的关键。


    # 第三，看未来


    请问是创新好，还是模仿好？


    大部分人都会说：当然是创新好。这是跨越时间的，永恒的真理！


    不一定。著名经济学家熊彼特，给“创新”这件事，装上了一根时间轴，并在上面画了三个时间刻度：


    +   - 第一个时间刻度：创新。企业家开发出全新的产品，或者大幅度提高现有效率；

    - 第二个时间刻度：熊彼特租金。创新者享受一段时间受保护的超额收益；'
  merge: -1
  img_proc: true
- pgno: 200
  md: '第三个时间刻度：模仿。大量后进者不断追赶，终于可以做出一样水平的产品，竞争导致创新者丧失优势，收益稀薄，消费者受益。


    创新、熊彼特租金和模仿，是首尾相连的三个时间刻度。在第一阶段，你一定要在创新的道路上一路狂奔；在第三阶段，只有模仿，才能缩小你和对手的巨大差距。


    今天的中国，大量的模仿，带来过度竞争。成本低，一直是我们最大的竞争优势。但是如果看未来，下一个创新的周期，就在门前。做原子弹不如卖茶叶蛋的时代，即将过去。坚信创新的价值，才能赢得未来。


    # 要点总结


    什么是静止思维？静止思维就是，用不变的眼光，看待变化的事物。静止思维的人不知道的是，另一个阶段的蜜糖，可能是这个阶段的砒霜。静止思维典型的表达方式是：这是跨越时间的，永恒的真理！


    什么是演化思维？演化思维，就是给所有事情，加上 rink 时 间轴，然后观察事情在时间轴上的变化。上一秒钟正确的事情，下一秒可能就是天大的谬误。


    今天给你留下的思考题是，用演化思维给当下正在做的事情加上时间轴，然后分析，哪些事情现在时不我待，哪些事情最好的选择是等待？欢迎你在留言区和我互动。'
