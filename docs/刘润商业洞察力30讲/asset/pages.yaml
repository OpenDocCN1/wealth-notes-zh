  md: '什么是公式思维？就是用数学公式，来表达“要素”之间的“连接关系”，高手从系统模型中提炼公式，普通人站在高手的肩膀上学习公式。公式，就是高手们用洞察力，从上帝手中“偷来”的地图。

    但是，为了不会因为学了“公式思维”，就成了到处指点江山的键盘侠，你也需要记住：掌握最接近“要素”间“连接关系”的公式是关键。用错误的、不准确的、颗粒度大的公式解决问题，不但不能解决，还会死人。切忌买本《本草纲目》就去行医。切忌。

    思考题：请你用“公式思维”分析，你的产品潜在客户有多少？请别告诉我，每个中国人，都是我的潜在客户。欢迎你在留言区和我互动。


    建立公式思维，然后合理预估公式中的每个变量，表达“要素”之间的“连接关系”。从上帝手中偷地图。


