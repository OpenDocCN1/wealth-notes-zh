    # 第二，饮鸩止渴基模（Fixes that Fail）


    饮鸩止渴，是舍本逐末的升级版。它和舍本逐末不同的是，“鸩”这种“症状解”，不是没有营养的“末”，而是杀人于无形的“毒”。


