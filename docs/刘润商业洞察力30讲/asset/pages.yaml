- pgno: 103
  md: '# 4.


    跨越临界点，用来解决“一直挺好，突然变了”的“突变问题”。


    失效，停滞，波动，突变。这一讲，我们更进一步，来训练如何解决“根本问题”。


    你喜欢微信吗？喜欢。我也是。微信特别有用，而且重视用户体验。但是假设，我是说假设，今天成功的不 微信，而是另一家不断侵犯用户隐私、每天强推广告，甚至悄悄扣费，而且投诉无门的聊天软件“巨信”，你对其恨之入骨，但因为所有的朋友关系都在上面，还无法放弃不用。你怎么办？


    换一个角度，进一步思考。如果你不是用户，而是监管部门。现在，你接到潮水一样的投诉，说巨信店大欺客、欺压用户。你很恼火，责令巨信整改。


