    # 05 | 增强回路：每家伟大的企业，都有一个高速旋转的飞轮


    欢迎收听《刘润·商业洞察力30讲》。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '变量，是节点；因果链，是线段。但是线段有头就有尾，能量从头传到尾，就结束了。那么如果，我们把结尾和开头也用一条因果链连接起来，形成闭环呢？


    这就构成了一个“回路”（Loop）。回路相对于线段，有着完全不同的特性，它会一圈圈不断自我增强，一圈圈不断自我调节。


    这一讲，我们就来学习增强回路（Reinforcing Loop），这个系统中最强大的结构模块。这也是系统动力学理论中最核心的部分，所以你不妨对照文稿，多听几遍。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_36_0.png)


    一位朋友问我：润总，你的写作能力是怎么训练出来的？《5分钟商学院》写了2季600多节课，出版了18本书，怎么做到的？


    我说：其实，这都因为“幸运”。


    读小学时，我和绝大多数同学一样，很不喜欢写作文。数学多好玩啊。作文，呵呵。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '有一次，我在小学生报上碰巧读到一篇作文，叫《我的十岁生日》，于是心血来潮也写了一篇。写都写了，别浪费，我把这篇文章，交给了语文老师。


    然后，我的语文老师做了一件让我至今难忘的事：在课上朗读了这篇文章，并表扬了我。


    天啊！你知道我当时的感受吗？像吃了 5 个鸡腿、10 个冰淇淋。我居然找到了一点写作的乐趣。


    因为有了乐趣，我开始经常写，所以写作能力逐渐提高。一条“写作兴趣-(+)→写作能力”的因果链，出现了。


    写作能力提高，导致我的文章被更多认可，反过来又增强了写作乐趣。从“写作能力-(+)→写作乐趣”的因果链，反过来也接上了，一个闭环式形成。这就是“增强回路”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_37_0.png)


    什么是增强回路？因增强果，果反应来又增强因，形成回路，一圈一圈循环增强，就是“增强回路”。


    想象一下，你用麦克风对着扬声器说话的场景。麦克风、扬声器之间，形成了一条一圈圈增强的“回路”。你温柔的声音，被循环放大，几秒之内就成为尖锐的“嘶叫”，让所有人捂上耳朵。这就是“增强回路”的威力。


    写作乐趣，和写作能力，一旦闭合构成“增强回路”，就一发不可收拾了。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '初中，我开始写诗，送给美丽的实习老师；高中，给报社投稿，拿了人生中第一笔稿费；大学，写散文集，开始印刷成册；工作后，开设博客，写出传遍网络的爆文；再然后，开始写书，一本、两本、三本、四本；再再然后，连载专栏，《刘润·5分钟商学院》……


    停。倒带。把这一切不断倒带、倒带，都会回到一个场景：一个阳光明媚的下午，一位笑意盈盈的语文老师，给全班朗读作文。她一次不经意的朗读，激活了一个孩子体内的“增强回路”。


    商业世界，也是一样。创业公司 CEO 最重要的任务，就是找到自己的增强回路，然后使出吃奶的劲，推动回路，让公司一圈一圈循环增强。


    比如，腾讯的社交。用户数量越多，对其他用户就越有价值；越有价值，用户数量就越多。一圈一圈循环增强。这就是“社交增强回路”。


    比如，阿里的电商。买家越多，卖家就愿意来卖东西；卖家越多，买家就越愿意买东西。一圈一圈循环增强。这就是“电商增强回路”。


    比如，百度的搜索。收录的网页越多，来搜索的用户就越多；来的用户越多，广告商就越多；广告商越多，就有钱收录更多的网页。一圈一圈循环增强。这就是“搜索增强回路”。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 腾讯的“社交增强回路”


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_39_0.png)


    # 阿里的“电商增强回路”


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_39_1.png)


    # 百度的“搜索增强回路”


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_39_2.png)


    “增强回路”这个结构模块，原来这么厉害。你可能已经迫不及待想要建立自己的增强回路了，那么，在识别和建立增强回路前，有什么需要注意的地方吗？下面这三点，你想清楚了吗？


    # 第一，找到自己的飞轮


    1994年，一位深度思考者，决定开始创业。他在纸上，写下了创业必须面对的一些变量：


    +   1. 客户体验；

    2. 流量；

    3. 供应商；

    4. 低成本结构；

    5. 更低的价格。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '那么，什么带来了客户体验？更低的价格。谁都想用更低的价格，买到更多更好的商品。什么带来了更低的价格？低成本结构。成本低，价格才可能低。


    什么带来了低成本结构？规模效应。向供应商进更多货。怎样才能向供应商进更多货？巨大的流量，足够的用户。什么带来了巨大的流量？更好的客户体验。


    有趣的事情发生了。从客户体验出发，经过因果链不断增强，最后回到客户体验自己，一个闭环的“增强回路”，出现在链上：


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_40_0.png)


    这位深度思考者如获至宝，真的开始推动这个“增强回路”的旋转，越来越快、越来越快，最后变成一只高速飞轮。这位深度思考者，就是亚马逊的创始人；杰夫·贝佐斯。


    亚马逊今天大获成功。甚至有 Facebook 的高管出来做基金，都是大举买入亚马逊而非 Facebook。为什么？他说：因为亚马逊的成功是模式驱动的，而 Facebook
    是用户行为驱动的。亚马逊模式成功后会更成功，而用户行为一直在变，Facebook 永远不安全。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '小成功靠聪明才智，大成就靠增强回路。找到自己的飞轮。


    # 第二，确定第一推动力


    今天推动增强回路中任何一个变量，都是在加速飞轮。但是回到最开始呢？


    到底是先有鸡，还是先有蛋？第一推动力是什么？


    一定是消费者获益。


    2003 年，淘宝成立。淘宝的“电商增强回路”，就是买家越多，卖家越多；


    卖家越多，买家越多。但是，最开始，是先推动买家，还是卖家呢？


    淘宝决定，先推动买家。


    于是他们推出了支付宝。1）买家把钱打给支付宝；2）卖家发货；3）买家确认收货；4）支付宝把钱给卖家。


    这一流程，把无法上的权力交给了买家。只要不确认收货，钱就是自己的。因为解除了担心，买家飞速增长。


    但是，这个制度完美吗？当然不完美。买家也不全是“好人”啊，会不会有买家，明明收到货，就说没收到，骗取卖家商品呢？


    肯定会有。但是，让买家放心，比卖家放心更重要。后面的问题，后面解决。


    从买家出发，然后是卖家，然后是买家，然后是卖家，如此循环，不断增强。


    淘宝很快成长为最大的电商平台。淘宝选对了“第一推动力”。


    # 第三，坚持不懈地推动


    亚马逊的“飞轮效应”这几年非常有名，很多人学，但为什么至今没有第二个亚马逊？'
  merge: -1
  img_proc: true
- pgno: 42
  md: '因为“飞轮”推一天是没有用的。推一周、一个月、一年也是远远不够的。亚马逊自己推了 25 年。


    这 25 年里，亚马逊曾和书商翻脸，自己签约作者，就是为了给消费者“更低的价格”；它冒巨大风险推出“Prime 会员”，也是为了“更低的价格”；亚马逊公司自己非常挣钱，还是为了“更低的价格”。


    坚持不懈推动 25 年，亚马逊的飞轮的转速，才快到你只能<|start|>取。


    要总总结：


    什么是“增强回路”？因增强果，果反过来又增强因，形成回路，一圈一圈循环增强，这就是“增强回路”。但是，你要特别注意一点，所谓“增强回路”，说的仅仅是一个逻辑上相互强化的闭环，我举的例子都是正向强化回路，大白话就是越来越好；你可能很熟悉一个词“恶性循环”，那就是负向强化回路，也就越来越糟，总之，“增强回路”的判断特征就是“越来越……”。


    建立增强回路时，你要清楚三点：


    +   1. 找到自己的飞轮；

    2. 确定第一推动力；

    3. 坚持不懈推动。


    几千年来，人们给“增强回路”导致的大起大落现象，起了无数的名字，宗教学家叫它“马太效应”，经济学家叫它“赢家通吃”，金融专家叫它“复利效应”，互联网公司叫它“指数型增长”。但是这些如烟花一样绚烂的现象背后，都是同一个基础结构模块：增强回路。


    好的，这一讲就讲到这里。下一讲，我们要学习“增强回路”的孪生兄弟：调节回路。它的性格和它哥哥，截然不同。'
