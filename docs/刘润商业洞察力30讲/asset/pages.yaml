- pgno: 197
  md: '2017 年，有一本书很流行，叫《How Google Works》（中文名：《谷歌经营之道》）。书中说，谷歌之所以能获得今天这样的成功，最主要的原因之一，是谷歌坚持雇用最优秀的人才。


    这太有道理了！今天能在谷歌工作的，都是全世界最优秀的人才。没有优秀的人才，就不会有伟大的公司。读者心服口服：


    > “坚持雇用最优秀的人才”，这是跨越时间的，永恒的真理！


    真的是这样吗？


    现在我们把“静止思维”丢在一边，换上“演化思维”。演化思维，就是给所有事情，加上一根时间轴，然后观察事情在时间轴上的变化。


    把时间轴往回拉。过去的谷歌，尤其是刚刚创业、规模很小、办公室很破、完全没找到商业模式的谷歌，真能雇用“最优秀的人才”吗？


    很难。


    马云曾开玩笑说，阿里在早期创业时，街上只要会走路的人，不是太残疾，我们都招回来了。为什么？因为创业早期的।

    时候，待遇不高、前途不明、风险很大，不被人看好，所以很难招到优秀的人才。


    谷歌也一样。早期的谷歌，就和早期的阿里、今天你我的创业公司一样，很难招到优秀的人才。是后来的成功，吸引了“优秀的人才”，而不是所谓“优秀的人才”，造就了后来的成功。


    那谷歌是靠怎么走到今天的呢？


    和阿里一样，恰恰就是谷歌早期这些也許并非“最优秀”的人，依靠他们自己的创业精神、产品势能、战略思考和不懈努力，把自己变成“更优秀”，然后才带领谷歌获得了爆发性的成功。'
