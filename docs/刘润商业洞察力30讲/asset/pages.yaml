- pgno: 15
  md: '# 2）因果链


    这么多“变量”，一团乱麻。别急，用“因果链”，把它们连接起来。


    出生人数，带来城市人口增加，连起来；死亡人数，带来城市人口减少，连起来。这些是显而易见的。


    经济繁荣，带来城市移民增加，连起来；城市人口，带来生活空间减少，接着又导致了疾病蔓延，连起来。这些关系就不那么明显了，但洞察力可以帮你把它们找出来，理清楚。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_15_0.png)'
