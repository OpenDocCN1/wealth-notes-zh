    怎么办？开始用层级，用流程，用 KPI，用部门，提高管理效率。切断“管理复杂度”这个“调节回路”，释放进一步增长的潜力。


    这时候，你才会意识到，为什么大公司的前辈们经常说：向管理要效益。以前你能做到“没有管理的管理，就是最好的管理”，仅仅是因为你还太小，离管理复杂度这个“调节回路”还比较远。


    # 第二，建立“自我修复机制”'
