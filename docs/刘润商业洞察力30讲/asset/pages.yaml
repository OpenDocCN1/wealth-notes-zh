  md: '每个公司，都应该有个“超额业绩激励计划”。销售比目标多卖了产品怎么办？

    开发比计划早完成了怎么办？客户送来锦旗怎么办？他们会因此而获得“私利”吗？没有，那他为什么不选择懒惰？


    # 要点总结


    罗素·艾柯夫提出，这个世界上共有四套系统：机械系统、生物系统、生态系统，和社会系统。社会系统，是唯一一个系统（比如公司）和变量（比如员工）都有意识的系统。这是你第一次用系统动力学分析“集体”中的“个体”：是人心散了吗？队伍不好带了吗？人心从来没有散过。它从来都有自己的方向，只有有时和你不一致。管理人心的“根本解”，是改变模型，实现“上下同欲”。


    如何改变，记住两点：


    +   1. 参与约束。有意识的个体，必须获得超预期的收益；

    2. 激励相容。获得超预期收益的计划，符合“员工越自私，公司越盈利”的原则。


    彼得·德鲁克说：管理的本质，是激发善意。善意来自于哪里？来自于：上下同欲。


    今天给你留的思考题是，你的公司里是不是有些很难管理的“人”，你和他的目标不一致在哪里？如何改变？欢迎你在留言区和我互动。


