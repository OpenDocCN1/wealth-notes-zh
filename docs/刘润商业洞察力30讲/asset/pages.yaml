    # 第一，舍本逐末基模 (Shifting the Burden)


    有 A 和 B 两家公司，都是做“婚前培训”的，教夫妻如何相处。


    两家公司现在都想融资 100 万。A 公司用这 100 万请最好的人打磨产品，让新婚夫妻心甘情愿付费来学；B 公司用这 100 万宣传课程的社会价值，申请政府补贴，让新婚夫妻免费学。


    如果你是投资人，你觉得谁会有未来？你投给谁？


    我个人建议，不要轻易地投给 B。因为它的商业模式，符合典型的“舍本逐末”模型。


    B 用“政府出钱免学费”这个调节回路，解决“婚前培训”的销售问题，有没有 效？当然有效，这比 A 的“打磨产品付费学”调节回路有效得多。既然有人出钱，那我就听听啊。卖不出去的“症状”缓解了。


    但是，这个“症状解”治标不治本。“标”是卖不出去，“本”是产品力不够。


    B 不服气说：先赚了钱，我当然会开始治本，提升产品力的。


    真的吗？


    赚了钱之后，B 可以利用润做两件事情：


    +   1. 把“政府出钱免学费”的模式推广到全国；

