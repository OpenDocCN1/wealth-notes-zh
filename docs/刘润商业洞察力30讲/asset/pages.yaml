- pgno: 177
  md: '后来，各大航空公司的延误率大大降低。航空公司找到了一条降低“延误率”的方法：通过延长预计飞行时间的方法。侵蚀目标。顾客还抱怨怎么办？只需要把预计飞行时间延长为
    24 小时，就 可以消灭晚点。


    目标侵蚀，可以让人的自我感觉处于最佳状态。但是，正如英国小说家毛姆所说：只有平庸的人，才总是处于最佳状态。


    回到最开始的案例。那位互联网的创业者的问题是，目标过于模糊，“在产品上有长足的进步，销售上有巨大的提升”，给“目标侵蚀”留下了巨大的空间。


    那怎么办？目标一定要明确。


    2017 年，阿里加大对菜鸟网络的投资，并宣布目标：5 年内，要实现国内物流 24 小时必达，国际物流 72 小时必达。


    5 年、24 小时、72 小时。用非常明确的数字，把自己置于做到不到的风险中，而不是说: 线上线下稳步提升，国内国际共同加速。为什么？因为只有不给自己留余地，才能一往无前。


    # 要点小结


    我们学习了最后一个预测未来模型组：锁定模型组。这个模型组，有两个典型的 基础模型结构：恶性竞争，和目标侵蚀。


    恶性竞争的本质，就是：你自我修复的调节回路伤到别人，从而加强了对方的 调节回路，又反过来伤害到你。


    目标侵蚀的本质，就是：当用改变行为调节回路缩小差距遇到阻力时，改为用降低目标调节回路来缩小差距的方法。


    这两个都是调节回路遇到调节回路的模型，最后导致两条回路相互作用，直至“锁定”。'
