    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_185_0.png)


    # 26 | 公式思维：从上帝手中“偷”地图


    洞察力（Insight Skill），是一种“越练越强大”的“技能”（Skill），而不是“看一眼就获得”的“知识”（Knowledge）。三步上篮的规则，是知识；但是像乔丹飞人一样的三分步上篮，是他终身练习才获得的技能。洞察力，需要终身练习。


    前四个模块，我们学习：建立模型，解决难题，洞察人心，预测未来。这个模块，我们学习终身练习的方法。我会依次带你建立“公式思维”、“层次思维”和“演化思维”，再给你三个剑法，让洞察力伴随你终身。


    这一讲，先从练习破除“散点思维”，建立“公式思维”开始。'
