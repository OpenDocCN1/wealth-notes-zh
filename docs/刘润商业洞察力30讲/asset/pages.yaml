    # 13 | 跨越临界点：一直挺好，突然变了，如何管理“不连续”？


    你好，欢迎收听《刘润·商业洞察力30讲》。


    今天，我们来训练第四项“解决难题”的能力：跨越临界点。


    水一直都是液态，可一旦到达100摄氏度，“突然”变成气态；一家互联网公司发展挺好，可一旦C轮融资后，“突然”陷入衰败，投资人、媒体全消失了；客户一直喜欢你的产品，“突然”有一天投奔竞争对手，头也不回；公司业绩高歌猛进，“突然”某天刹车停止增长，收入50亿和收入5亿时，赚的一样多。


    这个世界上，怎么有这么多“突然”的事情。听上去就头疼。那就戴上洞察力眼镜看看吧。这些“一直挺好，突然变了”的现象背后，其实都有一个同样的系统结构：临界点。'
