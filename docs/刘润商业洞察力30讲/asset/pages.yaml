- pgno: 130
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_130_0.png)


    这一讲，我们要一起训练：如何用商业洞察力，看透创业之心。我会给你三个黑箱，用来测试哪些人，是你可以把后背放心交给他的人。


    我们都知道，激励很重要。传统的激励有三个基本工具：工资、奖金、股票。工资发给劳动者承担的岗位责任、奖金发给奋斗者创造的超额业绩、股票发给合伙人释放的无穷潜力。


    那是不是反过来说，给了股票，就能找到愿意释放无穷潜力的创业合伙人了呢？


    并不能。


    我有位企业家朋友，公司越做越大。虽然公司有不少高管，但他总觉得他们没有“合伙人心态”，无人担责、无人分忧，凡事最终都要自己扛板。没有“合伙人心态”，是因为他们不是合伙人。于是，他决定找一个人，分他股份，授他权力，给他责任，让他成为真正的“合伙人”。


    几次挑选，他从外企高薪挖了一位能力极强的“合伙人”，给了他股份和巨大的期望。这位合伙人表示，一定不辱使命。'
