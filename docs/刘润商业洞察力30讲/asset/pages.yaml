- pgno: 3
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_3_0.png)


    这种像几千个麻花拧在一起，要依靠图论、计算机软件才能掌握的系统动力学，吓退了很多人。


    但我要声明的是，这门学问的根本逻辑其实并不复杂，反而是直击本质的简单。这也是它能越来越广泛地被应用到商业领域的原因。


    我是一名商业顾问，我每天的工作，就是帮助企业家、创业者和管理者，看透他们正身处其中的“系统”，看清“动力”指演的走向，并作出改变。我是海尔、中远、恒基、百度等机构的战略顾问。在他们各自的领域，他们都是比我厉害100倍的专家，那我凭什么给他们做顾问？


    就是因为我从“系统动力学”中习得的洞察力。这是一名优秀的商业顾问，最最核心的竞争力，甚至是商业机密。


    系统动力学，是金字塔尖的学问。今天，我把这颗明珠摘下来，送到你手边。


    洞察力，是优秀商业顾问的秘密。今天，我要用最容易理解的语言，与你分享这个秘密。'
