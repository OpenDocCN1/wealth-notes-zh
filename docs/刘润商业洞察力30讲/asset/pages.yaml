    # 09 | 系统体检：复杂，是成熟的代价


    看透复杂世界，破解决策难题。欢迎收听《刘润·商业洞察力 30 讲》。这一讲的主题是：系统体检。


    “变量、因果链、增强回路、调节回路、滞后效应”。这几个概念你都清楚了，


    上一讲，我们还学习了如何用这 5 个结构模块，洞察商业本质，搭建系统模型。'
