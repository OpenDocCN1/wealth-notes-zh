- pgno: 211
  md: '“掷硬币→得到正面”，这条因果链成立吗？50%的时候成立；“掷骰子→得到6”，这条因果链成立吗？1/6的时候成立；“掷三个骰子→得到三个6”，这条因果链成立吗？1/216的时候成立。


    一个“因”，有50%、1/6，甚至只有1/216的可能性，会带来“果”，必然性因果，就变成了“概率性因果”。


    概率性因果，导致模型的输出，充满不确定性。


    我有一位在贵州的企业家朋友，非常成功，也非常睿智。在美国还没有成立的时候，他就做了今天被称为“O2O”的生活服务网站。因为当时没有O2O的概念，他把自己建立的商业模型，叫做“服务类的淘宝”。


    有一天，他来找我，给我看他的商业模型。我把他介绍给了中国最知名的一位投资人。聊了很久后，最终这位投资人没有投他。这位企业家说：总有一天，他们会看懂我做的事情。然后，用自己的财富，倾家荡产来做这个项目。


    果然过了几年，O2O大火。我立刻想起他的这个项目，由衷佩服他的眼光，和洞察商业本质的能力。然后赶紧去看他的网站，却发现，已经关闭了。


    最早搭建正确的商业模型，却没有走到最后。在睿智、财富和努力程度上，他都输给别人。他输给了“概率性因果”。


    “我找投资人→拿到投资”这个因果链中，他不够幸运，输给了概率；“正确模型→成功结果”这个因果链中，他起得太早，输给了概率；“拼命奔跑→脱颖而出”这条因果链中，他没跑出来，输给了概率。


    我这位朋友，把全部身家压在了三个六上。没赌中，黯然离场。背后，是赌中者的欢呼。'
