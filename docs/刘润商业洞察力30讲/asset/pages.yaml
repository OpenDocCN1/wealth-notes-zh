- pgno: 107
  md: '+   3. 如果喜欢晚饭的多，午饭、晚饭的供应商交换；


    +   4. 如果连续 6 个月，午餐都胜出的话，更换晚餐供应商。


    因为午餐的消费量，远远大于晚餐，两家供应商都想做午餐。微软行政部的


    小姑娘，在“成本提升的调节回路”旁边，增加了一条“收入提升的增强回路”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_107_0.png)


    然后呢？然后，为了不被淘汰，甚至最好一直做赚钱的午餐，供应商们变着花样提供好吃的、好喝的，脸上甚至洋溢出发自内心的微笑。


    这就是：普通的人改变结果，优秀的人改变原因，顶级高手改变模型。我想请你把这个认识牢牢刻在脑海中：改变模型，是 一切问题的根本解。


    # 要点总结


