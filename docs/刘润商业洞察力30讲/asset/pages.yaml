- pgno: 104
  md: '如果只能用一个聊天软件，你用哪个？当然是大家都用哪个，我就用哪个。


    巨信每月活跃用户数（MAU）已经超过10亿，为了保持和更多朋友的联系，你当然用巨信。你用巨信，你的朋友就更可能用巨信。巨信的用户越来越多，其他聊天软件（IM）的用户越来越少。


    这就是“网络效应”带来的赢家通吃。


    投诉我？那你别用啊！我就喜欢看着你不喜欢我，却不得不用的样子。


    怎么办？现在，你有三个治理巨信的选项：


    +   1. 设立专属服务监督小组，每天监听巨信客服电话，倾听用户声音，提出整改意见；

    2. 安排优秀公司，向巨信传授服务经验；

    3. 要求中国移动开发一款“移动信”，制衡巨信。


    你选哪一个？1，还是2，还是3？


    最好一个都别选。为什么？


    监听电话，解决“改什么”（What）的问题；传授经验，解决“怎么改”（How）的问题。但它们都不能解决“我不愿改”（Why）的问题。开发“移动信”呢？用竞争倒逼巨信？如果竞争有用，那么多类似应用，早就能干掉巨信了，哪会有今天。因为网络效应带来的赢家通吃，导致打败巨信的，一定不是另一个长得像巨信的东西。


    那怎么办？


    普通的人改变结果，优秀的人改变原因，顶级高手改变模型。要想从根本上治理巨信，就要改变巨信的商业模型。怎么改？出台一个规定：


    巨信和微信、支付宝，必须允许用户跨平台互加好友。'
