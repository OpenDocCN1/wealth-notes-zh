  md: '拖延症、管理复杂度……你可能觉得调节回路真坏。并不是。调节回路的目的只是回归平衡。


    这种平衡，通常表现为“自我修复”，这种修复能力，往往能在关键时刻力挽狂澜。


    人的体温为什么能一直保持在 37℃？因为调节回路的自我修复。温度低了，

    增加代谢，提供热量；温度高了，开始排汗，带走热量。如此平衡。


    对企业也是一样。你应该为重大风险，设计自我修复的调节回路。


    2005 年，盛大突然收购新浪 19.5% 的股份。一旦突破 20%，新浪就要面临失去控制权的重大风险。这个风险，激活了新浪早已设计好的调节回路：


    股权稀薄反收购措施，也就是着名的“毒丸计划”。这个计划主刺余 80% 的股东，可以用 15 美元，购买价格 35 美元的新浪增发股票，从而把盛大的股权稀释到
    20% 以下。最后盛大只难而退。


    项目管理中的“监控环节”，员工管理中的“1:1 沟通”，公司管理中的“例会制度”，都是 CEO 手中最有效的“调节回路”，用来帮助公司自我修复。


    没有调节回路的公司，炸弹会随时爆炸。


    # 第三，让“阻碍变革者”，成为变革受益者


    追求平衡的调节回路，会让身体排斥药物，精神不想走出舒适区，企业变革时困难重重。


    作为 CEO，你要发起一场生死攸关的变革。谁是变革最大的风险？不是外部环境，而是内部的既得利益者。变革增强了他们的抵抗，他们的抵抗削弱了变革。既得利益者，是组织变革最大的“调节回路”。'
