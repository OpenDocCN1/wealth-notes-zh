  md: '# 27 | 层次思维：如何像顶级高手一样俯视问题？


    这一讲我们要学习第二个终身练习洞察力的方法：破除“局部思维”，建立“层次思维”。


    什么叫局部思维？局部思维也有个典型的表达句式，就是：


    其他我不管，这才是最重要的！


    你是一名军官，你的部队埋伏山头，等待上级指示。而你好兄弟的部队，正

    在隔壁山头和敌人浴血作战，眼看就要扛不住了。按命令你只能按兵不动，

    但真不救，他团必然全军覆没。你心急如焚。怎么办？救，还是不救？


    也许，你不应该救。


    为什么啊？这可是几百条人命啊！少和我谈别的，人命才是最重要的！


    几百条人命当然重要，但是这种重要，是“局部”的重要。一旦营救，暴露了主力部队的位置，将可能破坏作战计划，输掉整场战争，造成更大的牺牲。


    只关注“一草一木、一兵一马、一城一池”的得失，看不到更高“层次”的目的，

    最终可能用救几百人的方法，帮助敌人杀害自己几万人。


    这就是局部思维。


    系统模型中，“要素”之间的“连接关系”，是有层次的。局部思维，指的是只关注低层关系，而看不见高层目的的思维习惯。


    局部思维的可怕之处，是让我们用快意恩仇的方式赢得一场战役，却用悲天悯人的方式输掉整场战争。


    那怎么办呢？'
