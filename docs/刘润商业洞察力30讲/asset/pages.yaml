    我先问你一个问题：你有拖延症吗？


    老板让你交一份报告。你想，不急不急，还有好几天呢，我先甄眼甄赖……然后，你就去刷朋友圈了。再然后一抬头，截止日期就到了。你一个字都没写。


    你把自己锁在椅子上，头发悬在梁上。终于，凌晨3点，眼皮夹断了好几根牙签之后，你从嗓欠里挤出了一份连自己都知所云的报告。


    这就是拖延症。


    拖延症的真正可怕之处，就是你明明早就站在了起点上，但却总要等到终点才开始奔跑。


    那么，到底是什么在阻止你及早开始？是懒惰吗？是不会做吗？


    都不是。阻止你的，是一条小时候就已经理下的，“用拖延抑制压力”的“调节回路”。


    小时候，你有没有过这样的经历？放学做完所有作业，本想玩一会儿。妈妈说：“这么快就把作业做完了，那把数学卷子也做了吧。”你做完数学卷子。妈妈说：“这么快！那多背一些托福的单词吧。”'
