- pgno: 118
  md: '斯坦福大学的所罗门·阿希（Solomon Eliot Asch）教授，用著名的“线段实验”找到了这个变量：群体压力。


    阿希教授让 7 位受试者坐在一起，先看一根标准线段 X，再看 3 根长短不同的线段 A、B、C，然后请他们依次回答：A、B、C 中哪一根，和 X 的长度是一样的。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_118_0.png)


    这还用测吗？当然是 C 啊！'
