    # 29 | 三个剑法：储备模型、不断追问、多打比方


    你好，欢迎收听《刘润·商业洞察力30讲》。


    +   - 破除散点思维，建立公式思维；帮你升级到二维认知世界，“关联地”看问题；

    - 破除局部思维，建立层次思维；帮你升级到三维认识世界，“整体地”看问题；

    - 破除静止思维，建立演化思维；帮你升级到四维认知世界，“动态地”看问题。


    公式思维、层次思维、演化思维，是终身练习洞察力的心法。但光有心法是不够的，这一讲，我们学习三个终身练习的剑法。


    # 第一，储备模型'
