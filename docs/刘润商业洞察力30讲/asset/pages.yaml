- pgno: 167
  md: '这个决策的本质，是对“一个比微信好 10 倍的产品，能不能干掉微信”的预测。


    能吗？几乎不可能。


    我给你讲个故事。


    在 PC 时代，一位创业者兴<|message|> 地来找我，给我看他“自主研发”的 PC 操作系统，说比 Windows 好用 10 倍，一定能帮中国软件业干掉微软。


    我说：爱国，就做点真正对国家有贡献的事吧。比如互联网，比如人工智能。


    就算你的操作系统真比 Windows 好 10 倍，也几乎不可能干掉微软了。


    为什么？


    今天，你拿你的操作系统去找用户。用户一看，真不错啊，而且是国产操作系统，必须支持。然后，他问你：那我常用的办公软件、财务系统、数据库、CRM/ERP/ABCDEFG……都在哪里呢？


    你说：哦，这些暂时还没有。但是你先用。等用的人多了，那些软件开发商就会来开发了。


    用户一听，一口鲜血吐在屏幕上：你开玩笑吧？这些是我每天的工作啊，没这些软件，操作系统有什么用啊？那还是等软件齐全了，我再用吧。


    你只好去找软件开发商：你们在我的操作系统上开发软件吧。


    软件开发商一看，真不错啊，我早就盼望有家公司能制衡微软，提升我们的谈判筹码了。开发！然后，他问你：那么，你有多少用户？


    你说：哦，我们还没有用户。但是你先开发。等应用软件齐全了，用户自然就会来了。'
  merge: -1
  img_proc: true
- pgno: 168
  md: '软件开发商一听，一口鲜血吐在屏幕上：你开玩笑吧？为你开发软件，我需要投入 400 个人千 3 年。还是等你用户过亿，再来找我吧。


    没有用户，就没有应用软件；没有应用软件，就没有用户。国产操作系统的“对手”，其实从来都不是微软，而是一条“前进一步，后退三尺，越竞争越遥远”的“负向增强回路”。


    即使“足够优秀”如苹果，挑战“负向增强回路”20 年，今天苹果电脑的市场份额依然不到 10%，大量的人还是使用 Windows 系统。


    这就是“富者愈富”这个模型的力量。


    什么是“富者愈富”？“富者愈富”的全名是“富者愈富、穷者愈穷”。我们搬上洞察力眼镜。它的本质是：当资源总量有限时，抢到最多资源的正向增强回路，会激活所有其他竞争者的负向增强回路，导致“赢家通吃”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_168_0.png)


    那怎么办？


    苹果公司决定，不为打翻的牛奶哭泣，转战下一个战场，建立全新的“正向增强回路”，等待微软。这个战场，就是手机。'
  merge: -1
  img_proc: true
- pgno: 169
  md: '在 iPhone 的世界里，当 App 开发者和手机用户之间，你越多我越多、我越多你越多的“正向增强回路”正式浮出水面时，微软大吃一惊，赶紧加入战局。


    但是苹果的“富者愈富”模型已经成型，强大如微软，也只可能“穷者愈穷”。


    那怎么办？


    微软新任 CEO 萨提亚·纳德拉决定，不为打翻的牛奶哭泣，放弃手机业务，

    转战下一个战场，建立全新的“正向增强回路”，等待苹果。这个战场，就是云计算。


    所以，如何解决“富者愈富”模型带来的“穷者愈穷”问题？不要恋战，你拿下一局，我就跑步进入下一局。


    90 年代末和 2000 年代初，大量以爱国之名，拿着国家补贴，开发 PC 操作系统，挑战“富者愈富”模型的公司，最终无一幸存。如果它们没有恋战，而是跑步进入下一局，发展材料技术、基因科技，甚至是人工智能，也许今天中国已经有
    100 个华为。


    回到最开始的问题：“一个比微信好 10 倍的产品，能不能干掉微信？”干掉微信的，可能是抖音，可能是穿戴设备，可能是人工智能，但不会是一个比微信好 10 倍的微信。


    那么，在商业世界中，有哪些“总量有限的资源战场”，我必须要跑步进入，以避免别人成功构建“富者愈富”模型，激活我的“穷者愈穷”呢？你需要关注下面 4 点：


    第一，用户'
