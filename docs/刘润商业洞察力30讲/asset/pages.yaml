- pgno: 4
  md: '# 课程设计：


    我的这门课程由五大模块组成。


    我会在第一个模块为你“搭建模型”，让你明白，一个事物再复杂，也不过是那几个固定要素组成的。在这个模块，你会掌握系统动力学的整个基础理论概念，学会透视和抽象这个复杂的商业世界。


    除了“复杂”这个刻板印象之外，系统动力学总是被人当做屠龙之术的另一个原因是，不够实用。所以这一次，我会通过实际商业案例来还原世界，并且给你具体的操作方法。


    学完第一模块的理论之后，接下来的四个模块，我们从系统动力学出发，戴上洞察力的眼镜，去四个训练场实操练习。


    第一个训练场是“解决难题”。我会把自己多年来，作为商业顾问最常遇到的5大问题，一一拆解分析，为你展示我解决这些难题时思考路径，让你和商业顾问一样深入思考。


    第二个训练场是“看透人心”。个体、群体、集体的管理千差万别，但是把它 们视作一个个不同级别、体量的系统，问题就能迎刃而解，我会在这个模块带你重新理解管理难题。


    第三个训练场是“预测未来”。商业咨询顾问的一大任务就是为企业制定发展战略，我会再给你解释一下系统动力学中，用来绘制“未来曲线”的四大模型组，让你像商业顾问一样看得更远。


    第四个训练场是“终身练习”。洞察力不是一朝一夕就能练成的，我会做除你顽固的三大思想误区，给你终身修练的秘笈，然后目送你下山。'
