- pgno: 29
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_29_0.png)


    然后，洞察本质的关键一步来了。我们要用带箭头的线段，把这些孤立的变量连起来，搭建系统的雏形。这些带箭头的线段，就是系统的第二给结构模块：因果链(Causal
    Chain)。


    为什么要知道“因果链”呢？因为我们大多数人，眼里只有当下的“果”，看不到潜藏的“因”，头疼医头，脚疼医脚；但是名医不一样，根据病症找到病源，药到病除；神医就更厉害了，能还原还能推演，防病于未然。


    那什么是因果链？因果链，就是变量之间增强或者减弱的连接关系。


    我先通过一个日常的例子，手把手教你吃透因果链。


    老王发现，小李最近的“工作效率”很低，于是找他谈话，说：你要提高工作效率啊。要提高啊。要提高。小李答应了。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '是什么，带来了小李“工作效率”的变化？老王认真观察，发现小李最近特别累，上班时瞌睡。疲劳程度越高，工作效率越低。老王从“疲劳程度”，画了一根带减号箭头的线段，通往“工作效率”。


    这根“带减号（-）箭头的线段”就是“减弱的因果链”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_30_0.png)


    那又是什么，带来了小李“疲劳程度”的改变？最近新产品上线，小李总在加班。工作时间越长，疲劳程度越高。老王又从“工作时间”，画了一根带加号箭头的线段，通往“疲劳程度”。


    这根“带加号（+）箭头的线段”就是“增强的因果链”。


    做完因果链分析，老王知道：“工作时间增强（+）了疲劳程度，疲劳程度减弱（-）了工作效率。”


    所以，他应该做的，不是重复“你要提高，你要提高，你要提高”，而是制订一个轮休计划，保证每一个员工都处于最好的战 Pete 状态。


    很多管理者喜欢说“我只看结果”。业绩不好，就严厉批评；开会沉闷，就强制发言；团队矛盾，就各打五十大板；有人贫穷，就走过去罚酒，警告他以后不许再贫穷。


    但是，“只看结果”，其实是最 low 的管理方法。而真正有洞察力的人，会用“因果链”顺藤摸瓜，找到与之相连的“原因变量”，解决问题。


    这就是：苦葫芦困，众生畏果。


    就这么简单？'
  merge: -1
  img_proc: true
- pgno: 31
  md: '是的，就这么简单。“因果链”，只有增强（+），和减弱（-），没有第三种。


    但看似“简单”的因果链，一段一段地连接了万千变量，才有了 一切“复杂”的系统。“用因果链连接变量”，是搭建模型的基本功。你必须认真练习。


    怎么练习？因果链看似“简单”，但其实并不“容易”，因为我们常常会对因果关系判断出错，我们总是在结果附近找原因。为了修该这项基本功，以下三个误区，你必须紧警惕：


    # 误区一：遗漏中间项


    我们说：喝咖啡可以让人精力充沛。但是，喝咖啡，和精力充沛之间，真有一条“增强的因果链”吗？


    其实并没有。喝咖啡，不会直接让人精力充沛。喝咖啡，只会增强你体内的咖啡因含量；咖啡因含量，会增强新陈代谢这只“马达”的转速；而新陈代谢，才会把储存的能量转化为精力。


    所以，我们遗漏了“咖啡因含量”，和“新陈代谢”这两个中间项。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_31_0.png)


    这不是一个意思吗？精力充沛这个“果”，用“因果链”追溯到最后，不还是“喝咖啡”这个“因”吗？


    不是一个意思。当你知道“新陈代谢”这个遗漏的“中间项”，才是直接原因时，也许就会找到更好的办法，比如“运动”，来提高新陈代谢水平。也就是说，'
  merge: -1
  img_proc: true
- pgno: 32
  md: '通过分析“因果链条”上的中间项，你可以发现那些藏得很深但至关重要的因素，找出来，它们，通常是你转变思考方法开始。普通人“找因果”，而你找的是“因果链上的中间项”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_32_0.png)


    # 误区二：迷信相关性


    在大数据领域，有个著名的“尿片和啤酒”的故事。沃尔玛通过大数据统计发现，每周五晚上，超市里尿片和啤酒的销量同步上升。于是，沃尔玛就把尿片和啤酒放在一起。结果销量大涨
    30%。


    得到的用户，听这个故事估计听了 100 遍了，甚至已经审美疲劳了。但，这就证明相关性，优于因果链吗？我们来看一个反例。


    有一次，深圳警方接受采访时说：天秤座、处女座、天蝎座的人更喜欢违章。还有这种事？迷信吧？


    警方还公布了数据支持：从某年 8 月 3 日至 8 月 9 日的行人、非机动车违章人的星座比率来看，这三个相连的星座（出生日期：8 月 23 日至 11 月
    22 日），违章人数分别是：10.5%、9.63%和 9.0%，确实占据前三。


    我就是天秤座的。所以，我们天秤秤，和交通违章之间，真的有“增强的因果链”吗？'
  merge: -1
  img_proc: true
- pgno: 33
  md: '当然没有。实际上，这是因为在北半球低纬度南部地区（如深圳），9—11月是生育高峰。所以，在深圳，这三个星座的人口比率，就要高一些。


    # 北半球国家出生高峰月与纬度的关系


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_33_0.png)


    相关，是未知的因果。真正的洞察力，要可以始于相关性，但终于因果链。


    # 误区三：颠倒因果链


    颠倒因果链，是我们常常犯的第三个错误。我举个例子。


    在商业世界里，到底是销售价格决定了生产成本，还是生产成本，决定了销售价格？


    你是不是认为：当然是生产成本，决定销售价格了！


    错了。正好相反，是销售价格，决定了生产成本。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '你花了更多的钱生产，并不会导致用户愿意花更高的价格买。价格，是由用户感受到的价值，和供需关系决定的。只有先确定了销售价格，才能决定生产成本。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_34_0.png)


    # 要点总结：


    因果链，是系统的5个结构模块里，第一个无法用眼睛观察、只能用头脑推理的模块。


    再复杂的系统，变量之间，也只有两种连接关系：增强，和减弱。“带加号（＋）箭头的线段”就是“增强的因果链”；“带减号（－）箭头的线段”就是“减弱的因果链”。


    是的。就这么简单。爱因斯坦说：白痴都可以让事情变得更复杂，只有智者才能让事情变得简单。任何复杂的系统，都构建于固有的简单性。


    但是，简单，并不代表容易。“用因果链连接变量时，要走出三个误区：


    +   1. 不要遗漏中间项；

    2. 不要迷信相关性；

    3. 不要颠倒因果链。


    希望你成为透视“因果”的神医，正确地还原“因”，药到病除；早早地推演“果”，防微杜渐。


    下 L 讲，我们终于要讲，系统的5个结构模块中，最有威力的一块了，那就是：


    增强回路。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '今天，我要留给你三道思考题：


    +   1）每次经济危机时，读书学习的人就会增加。你觉得，经济危机和读书学习之间，有直接的因果链吗？还是其中有“遗漏的中间项”？如果有，会是什么？


    +   2）有人说，喝红酒的人身体更健康。你觉得喝红酒和健康之间，有因果链，还是只是相关性？如果是相关性，那什么是它们隐藏的共同原因？


    +   3）你觉得，是经济增长导致了教育水平提升，还是教育水平提升导致了经济增长？谁是因，谁是果？


    欢迎你在留言区和我互动。


