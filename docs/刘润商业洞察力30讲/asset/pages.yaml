    # 5）滞后效应


    孩子出生，20 年后才能再生孩子，这叫滞后；新增人口，几十年后才会死亡，也是滞后；拥挤的加重，疾病的蔓延，都有滞后。


    因果之间，相差几十年，导致无数漫长的因果链交织在一起，让迷失在现象中的国王，难以作出准确判断。只好从因等到果。但等到果时，已经晚了。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_18_0.png)


    明白了。可是，为什么“茶文化”这个听上去不靠谱的选项，能带来小海港的经济繁荣呢？


