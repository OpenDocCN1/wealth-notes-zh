- pgno: 83
  md: '戴上洞察力眼镜，我们不仅要看到系统的“增长动力”，还要看到“刚性约束”。


    增长都有极限，系统都有边界。让一个野心勃勃的 CEO 承认，增长是有极限的，这确实太难了。但是，只有承认“有极限”，才能突破“边界墙”。这是 CEO 的重要职责。


    回到最开始的案例。是什么“刚性约束”设定了椰树“增长的极限”？


    椰汁行业的“用户规模”。小环境，椰树在椰汁领域的市场占有率，已超过 55%；大环境，整个饮料行业逐年疲软，2017 年第一次全面下滑。椰汁行业“用户规模”设定的“边界墙”就在眼前。


    那怎么办？学习雀巢，不要强攻，而要突破。椰肉的市场，是不是还有很大的增长空间？椰子酒呢？椰子面膜？椰奶沐浴乳？在任何一个远离刚性约束的市场上去拓展潜在用户，都有机会带来新的增速。


    可是，当我“止步不前，无法跨越”障碍时，我怎么知道是因为自己的努力不够，还是真的遇到必须绕行的“边界墙”了呢？


    你必须要知道“刚性约束”长什么样子。下面这四种“刚性约束”的样子，你应该贴在办公室桌上，时刻关注它们是否就在不远处。


    # 第一，市场规模


    椰树和雀巢，遭遇的都是市场规模的刚性约束。


    如果你开一家便利店，你的市场规模刚性约束，大约就是方圆一公里的 3000 户人家。你拍一部电影，你的市场规模刚性约束，就是全国电影院 6 万块屏幕面前能坐得下的观众。这叫“最大可触达市场规模”（Total
    Addressable Market）。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '同时你要注意，同样是电影，题材决定市场空间。动作大片的市场就是大于文艺片。你还需要注意，市场上除了你还有其他玩家。竞争对手的强弱，决定你“触达”最大市场规模的难度。


    一旦接近你的最大可触达市场规模，不要恋战。转换阵地。


    # 第二，资源限制


    靠“我认识谁”出来创业的，是资源型创业者。这是你的优势，也是你的“刚性约束”。因为你能掌握的资源或大或小，都是可以很快触达极限的。


    靠个人能力的创业者，比如我所在的咨询业，你的时间，是你的“刚性约束”。能力强的，可以很快触达“边界墙”。提高不解决咨询业的时间“刚性约束”问题，只会延迟。


    靠土地资源、稀有矿产资源，以及某个人的独家手艺等等这些不可再生资源创业的，刚性约束的边界墙，也在不远处。


    怎么办？试试把自己的商业模式，建立在高速可再生资源上。比如知识、流程、专利技术。


    # 第三，法规政策


    有些公司在小的时候不规范，不缴税，不缴纳社保，抄袭别人的专利，做虚假宣传。稍微做大，一转身就撞到“边界墙”了。


    所有这些小的时候耍过的小聪明、捞过的小机灵，长大都很有用了。及早地合规运营，不然公司永远长不大。


    # 第四，技术限制'
