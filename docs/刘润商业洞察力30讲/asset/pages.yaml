  md: '产品质量带来公司规模，公司规模推升产品质量。你明显感觉到，自己正在一个“增强回路”中“指数级增长”。


    但是很快，公司的的发展就到了几百人，甚至有些员工，你从来都没见过。“站起来吼一声”，“走，去吃火锅”，这些“没有管理就是最好的管理”，再也起不了作用了。各种问题层出不穷，产品
    bug 越来越多，客户不断抱怨。


