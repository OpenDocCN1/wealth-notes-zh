  md: '果手机。谁缺了谁都是灾难。大家是最紧密的兄弟。但是今天，微信抽出了一把青龙偃月刀，说是用来削水果的。你说，苹果会怎么想？


    小程序，把苹果和微信，拉入了“失控模型组”中的“意外之敌”基模。不管张小龙是什么性格，库克是不是第二个乔布斯，“意外之敌”基模都开始抓着他们的手，下一盘早已写好的棋谱：


