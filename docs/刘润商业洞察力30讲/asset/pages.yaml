  md: '群体压力其实是触发了“表达不同，增强群体压力；群体压力，反过来抑制表达不同”这条调节回路。导致的结果是，三个诸葛亮，可能还抵不上一个臭皮匠。


    那怎么办？


    你可以用“群体动力学”技术，比如：


    +   - 废鬼代言人；

    - 头脑风暴；

    - 名义群体法。


    切断群体压力调节回路，释放每个人的独立想法和创造力。


