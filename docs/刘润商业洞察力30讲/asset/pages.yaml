- pgno: 131
  md: '故事发展到这里，一直没问题。但是，几天后，问题就来了。


    周末，一位大客户遇到一个严重的产品问题，大发雷霆。老板发消息给合伙人：请速来办公室商量。


    合伙人回复：老板，今天是周末，周一聊可以吗？


    老板突然语塞，不知道怎么回答。问题等到周一吗。他只好自己处理。


    一段时间后，合伙人拿了一张清单找老板。里面包括孩子的国际小学费用，每年 2 次的海外滑雪费用，另加 4 周假期。请老板批准。老板傻眼了：这些都是外企的矩矩吗？合伙人说：不全是。但我充分分休息，也是为了好好工作。


    老板目瞪口呆，很苦恼，问我怎么办。


    我听完之后说，你知道你错在哪里了吗？你错在居然以为，只要给了高管股份，他就会自动变为合伙人。


    高管，和合伙人到底有什么区别？区别在于有没有“创业之心”。


    打工，是用确定的能力，换取确定的回报；创业，是用不确定的风险，对赌不确定的收益。创业时，你无法收获确定的创业回报。你唯一能确定获得的，就是创业过程本身。


    硅谷顶级投资人本·霍洛维茨在他的书《创业维艰》里说：


    > “在我担任 CEO 的 8 年多时间里，只有 3 天是顺境，剩下的 8 年几乎全是举步维艰。”


    8 年里，只有 3 天是顺境。如果 while 你用财富、声望、滑雪、休假这些不知道有或没有的创业回报，作为激励自己的增强回路，很可能坚持不了 8 年。'
  merge: -1
  img_proc: true
- pgno: 132
  md: '但是，反过来想，只有3天是顺境，霍洛维茨居然坚持了8年。他一定从创业里，获得了另一种“有魔力的东西”。这种“有魔力的东西”，不断点燃他快被磨灭的热情。这种“有魔力的东西”，就是对创业过程的热爱。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_132_0.png)


    什么是创业之心？创业之心，就是对不确定的创业过程，而不是确定的创业回报的热爱之心。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_132_1.png)'
  merge: -1
