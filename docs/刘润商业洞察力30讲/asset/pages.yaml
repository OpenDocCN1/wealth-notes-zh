- pgno: 12
  md: '“现实”世界中的系统变化万千，错综复杂，商业系统、组织系统、软件系统、生态系统等等。


    但是，如果撇掉一切细枝末节，去掉所有干扰选项，“抽象”来看，任何复杂的系统，都构建于其固有的简单性。


    # 这句话怎么理解呢？


    其实很简单，所有的系统，抽象来看，除了“要素”，就是“要素”之间的四种“连接关系”：因果链、增强回路、调节回路，和滞后效应；


    而“要素”在這 4 种连接关系的作用下，也会持续变化，这时就被赋予了一个新名字叫：变量。


    +   1 变量（要素）

    2 因果链（连接关系）

    3 增强回路（连接关系）

    4 调节回路（连接关系）

    5 滞后效应（连接关系）


    是的。就是这 5 个简单的，像乐高积木一样的“结构模块”，搭建了一切你见到复杂的系统。


    不抽象，就无法深入思考。


    我会用下面的 8 讲内容，帮你戴上“洞察力眼镜”，透彻理解这 5 个抽象的“结构模块”，获得深入思考的能力。


    这一讲，我们先从一个故事开始。


