- pgno: 192
  md: '想要拥有非凡的洞察力，必须破除局部思维，练习建立层次思维。


    什么是层次思维？


    人体内有各种功能的细胞，构成了心脏这种器官。心脏，是比细胞更高的层次。然后，心脏、脾胃、肾等器官，又构成了人体这个生命。人体，是比器官更高的层次。


    细胞、器官、人体，就是三个从低到高的层次。


    当人体生病时，我想大部分人都不会说：


    每个细胞都是我的家人，我要保护每一个无辜的细胞，其他我不管，这是最重要的！


    这时候，大部分人都会明白，细胞服从器官，器官服从人体。如果为了人体健康的需求，杀死一些细胞，甚至切除一些器官，都是可接受的代价。虽然人体最终是由细胞构成的，但是人体显然大于所有细胞之和。


    什么是层次思维？层次思维，就是用“整体大于局部之和”的思维方式，洞察层层叠加的系统模型。


    拥有层次思维的人，总能站在更高的位置思考问题，看到更大的“格局”；


    而顶级高手，总能从最大的“格局”，俯视难题。


    比如，到底是什么决定了企业的兴衰存亡？


    拥有“局部思维”的人会说是产品，产品不好一切都是空谈；有人说是管理，不能聚合人的力量，无事能成；有人说是合作伙伴，没有优秀的社会协作网络，寸步难行。这些“局部思维”，如盲人摸象。


    而拥有“层次思维”的人，可能会告诉你：是四个层次的要素，决定了企业的兴衰存亡。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '+   - 第一层：时代。时代抛弃你的时候，连一声再见都不会说。

    - 第二层：战略。不要用战术的勤奋，掩盖战略的懒惰。

    - 第三层：治理。结构不对，什么都不对。

    - 第四层：管理。管理的本质，是激发善意。


    在这四个层次中，时代高于战略，战略高于治理，治理高于管理。


    理清了这四个层次。现在我们来分析一些商业问题。


    比如，柯达的失败，到底是什么原因？有人总结，这是因为 CEO 管理水平不够。


    其实，柯达不管换管理水平多高的人做 CEO，都不容易转型成功。因为柯达的对手，是整个时代。数码相机的新时代，必然取代胶卷相机的旧时代。


    而整个柯达的利益，都来自胶卷。“时代”挑战这个第一层次的问题，是无法用“管理”水平这个第四层次的能力解决的。


    这也是为什么很多人说：你有一个永远打败不了的对手，那就是时代。


    那怎样才能建立“层次思维”呢？不断追问自己：自己眼前看到的整体，会不会是一个更高层次的局部？


    2018 年有一部电影很火，叫《我不是药神》。这部电影讲述了，慢粒白血病患者吃不起 4 万一盒的天价原研药，就通过主人工购买便宜的盗版药来维持生命的故事。可是这样，药厂利益受损。于是他们严打盗版药，导致很多病人吃不到正版药，吃不到盗版药，最终失去生命。


    很多人看完这个电影特别伤心，觉得药厂罪大恶极。一个具体的生命，在商业利益前面被无情牺牲。


    这种观点，对吗？


    我们不作“对、错、好、坏”这种价值 picturesque 判断。我们试着用“层次思维”来思考这个问题。'
  merge: -1
  img_proc: true
- pgno: 194
  md: '首先，站在“患者”的层次来看这件事，每个人都有活下去的权利，所有的不幸都应该被照顾。这毫无疑问。这也是很多反对药厂严打盗版的观众的善心所在。


    接着，我们追问自己：自己眼前看到的“患者”，会不会是一个更高层次的局部？


    之所以白血病患者有药可吃，是因为有人发明了药；有人发明药，是因为卖药收入、能覆盖前期投入；要在小病种上收回几十亿美元的投入，药价只能很贵；如果盗版药泛滥，药厂倒闭，将会有百倍，甚至千倍的患者，死于白血病。


    比“患者”更高的一個层次，是患者、药厂组成的“共同体”。“共同体”这个层次必须健康，才会有“患者”这个层次的希望。


    接着，我们再追问自己：自己眼前看到的“共同体”，会不会又是一个更高层次的局部？


    “共同体”的健康，必须以看着穷人去死为代价吗？


    当然不。我们再往上一层，站在国家“治理”行业的高度俯视问题，很小的患病率，一旦患病就要花天价吃药，这是保险最擅长解决的问题。把这种“天价药”纳入保险范围，让小概率大影响的风险在海量人群中均摊掉，也许是解决这个问题最好的办法。


    现在，我们有了看待这个问题的三个层次：患者、共同体、治理。我们不说对错好坏，只说如何解决问题。站在“治理”的层次，重构患者、药厂、保险三个“要素”之间的“连接关系”，才能找到问题的根本解。


    要点小结'
