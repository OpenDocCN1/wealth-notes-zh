- pgno: 59
  md: '2013 年，我离开工作近 14 年的微软。创立“淘米咨询”。我的第一个客户是自己。用咨询的术语说，是要帮这个“客户”搭建有效的商业模型，用大白话说就是，要让一名白手起家的创业者，能把事儿真正干成。


    怎么搭建？我决定，带上商业洞察力眼镜，看看咨询这个行业。


    # 第一，核心存量


    咨询行业有哪些核心存量，是关键？我找到麦肯锡的朋友，波士顿咨询的朋友，《商评评论》的出品人曹阳，晨兴资本的合伙人刘芹，向他们请教。


    麦肯锡的朋友说：成功案例。成功案例，会带来更多成功案例；波士顿咨询的朋友说：深刻的洞察。能治病，才是关键；曹阳掰着指头数：咨询、培训、演讲、文章、书写。这
    5 个核心变量相辅相成；刘芹说：声誉。那一切都是为了积累声誉。


    都有道理。这也是人们在面临重大选择时经常碰到的问题：好多要素都会影响你的成败，哪个好像都很重要，但是，到底哪个，或者哪几个才是真正核心？


    所以，你光知道要素本身是不够的，必须要先找到它们之间的“关键因果链”。


    # 第二，关键因果链


    对创业时的我而言，最关键的因果链，就是通向收入的因果链。是哪些关键的“因”，导致了收入这个必然的“果”？


    一圈访谈后，我从众多要素中提炼出一个关键的“因”，那就是：声誉。'
