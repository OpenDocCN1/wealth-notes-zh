- pgno: 170
  md: '前面说的 PC 操作系统、手机应用商店，以及微信，都是在“用户”这个“总量有限的资源战场”里竞争，用自己的“正向增强回路”，激活别人的“负向增强回路”。


    这场竞争，旁观者惊心动魄，参与者一路狂奔。


    # 第二，资本


    资本金越大，投资收益越大；投资收益越大，资本金越大。这个“正向增强回路”一旦形成，也很难扭转。


    科技越来越先进，世界越来越文明。请问，人类的财富差距，是越来越大，还是越来越小？


    很不幸，是越来越大。


    2010 年，全世界最有钱的 388 人所拥有的财富，超过最贫困的那一半人口的财富总和。388 人，一架波音 747 就能装下。2014 年，只需要 85
    人，一节高铁车厢。2015 年，62 人，一辆大巴。2017 年，8 人，一辆商务车就够了。


    为什么？因为在“资本”这个“总量有限的资源战场”，抢到最多资本的正向增强回路，必然会激活所有贫穷者的负向增强回路，导致“富者愈富、穷者愈穷”。


    # 第三，规模


    有些行业的竞争，本质是规模之争。比如插线板。


    假设开一个插线板的模具，价格是 100 万。A 用这个模具生产 1 万个插线板，每个插线板均摊模具成本 100 元；B 生产 100 万个，均摊成本降到 1'
  merge: -1
  img_proc: true
- pgno: 171
  md: '元。假如材料成本是 30 元。那么，A 必须卖 130 元以上的插线板，B 可以只卖 31 元。


    31 元当然比 130 元卖得好，于是 B 越卖越多，均摊价格越来越低，然后就卖得更多；A 越来越少，均摊价格越来越高，然后就卖得越少。


    规模效应。是“富者愈富”基模的一个别名。


    # 第四，品牌


    越有品牌，客户和优秀资源就越向你聚集中，你就越光环四射，然后越有品牌。


    对个人也是一样。


    我曾给一家创业公司投过 50 万，但后来项目失败了。虽然我们没有“股转债”条款，但创始人说：我承诺过你，如果赔了我承担。我会说到做到。


    后来，他真的每个月都给我转 1 万多  元钱。过了一段时间，我说不用转了，这些钱就留在你那里。以后不管你创业做什么，把它折成我的股份就好。


    # 要点总结


    什么是“富者愈富”？“富者愈富”的全名是“富者愈富、穷者愈穷”。我们戴上洞察力眼镜。它的本质是：当资源总量有限时，抢到最多资源的正向增强回路，会激活所有其他竞争者的负向增强回路。


    谁最需要理解吃鸡模型组？身处资源总量有限局中的创业者。这些战局是：


    用户战局、资本战局、规模战局，和品牌战局。它们，就是你的商业和人生，赢家通吃的起跑线。


    好的，这一讲，我们就讲到这里。


    下 一讲，我们将分享第四种，也是最后一种预测模型组：锁定模型组。'
