- pgno: 21
  md: '世间万物都是复杂系统，但是“抽象”来看，任何复杂的系统，都构建于其固有的简单性。


    《刘润·商业洞察力30讲》

    看透复杂世界，破解决策难题


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_21_0.png)


    # 03 | 变量：流量改变存量，存量改变世界


    看透复杂世界，破解决策难题。


    搭建任何复杂系统，只需要 5 个最简单的结构模块：变量、因果链、增强回路、调节回路、滞后效应。


    透彻理解这 5 个结构模块，我们才可能洞察本质。


    这一讲，我们学习第一个：变量（Variable）。这其中会涉及到两个你经常听到的概念：存量和流量，但是我相信，你听完我的解释，你会有新的思考。'
