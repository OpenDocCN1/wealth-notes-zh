    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_172_0.png)


    # 24 | 锁死模型组：你所谓的务实，可能只是目标侵蚀


    这一讲，我们学习“锁死模型组”（Relative Control），也就是九大基模中的最后两个基模：恶性竞争，和目标侵蚀，并试着用它们来“预测未来”。


    你准备好了吗？


    # 第一，恶性竞争（Escalation）


    上个世纪 50—60 年代，美国烟草业竞争非常惨烈。为了抢占用户心智，当时还合法的香烟广告，成了品牌间最重要的战场。而这些广告，今天看来简直是诱骗。


    +   - Lucky 香烟宣传：与其吃颗糖，不如抽根 Lucky 烟；'
  merge: -1
  img_proc: true
- pgno: 173
  md: '+   - Tipalet 香烟宣传：往女伴脸上吹一口烟，她就什么都听你的；

    - 万宝路甚至用孩子的照片，借他的口吻说：妈妈，你一定很享受你的万宝路香烟。


    1971 年，在全球“禁烟运动”的声势下，美国国会通过了禁止在电视和广播里做烟草广告的法律。现在，我想请你用你的商业洞察力预测一下，Lucky. Tipalet,
    和万宝路，哪一家烟草公司的利润，下降得最快？


    答案出乎不少人的预料。这三家的利润不但没有下降，还都获得了不小的增长。


    啊？为什么？


    因为政府无意中，帮助烟草业打破了一个叫做“恶性竞争”模型的诅咒。


    消费者的心智中，能了解、信任，最后偏好的烟草品牌，只有 2～3 个。每家公司都想成为其中之一，怎么办？用“投放广告，提高业绩；业绩提高，减少投放”这个调节回路，来抢占并保持自己的认知地位。


    这就是广告的本质，一个消费者心智的调节回路。


    但是，除了提升了自己的地位，猛烈的广告投放，还带来一个副作用：连带加强了别人的调节回路。


    不打广告之前，两人共赚 200 万，你 100 万，我 100 万。花 20 万发起“广告战”后，A 的利润明显增加，B 相应骤减。


    这还得了？还有王法吗？为了挽回损失，B 决定花 40 万迎战，A 的利润应声下跌。A 一咬牙，决定花 100 万反击。B 一踩脚，决定花 100 万再战。


    A 和 B 的总收入还是 200 万，但却凭空多花了 200 万广告费，利润双双降为零。利润清零，但是广告还不敢停。两人都在大喊“别打了，别打了，我数”'
