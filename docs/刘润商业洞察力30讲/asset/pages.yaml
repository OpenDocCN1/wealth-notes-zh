- pgno: 141
  md: '这张简单的 Excel 表格，就帮他激活了即时反馈的“正向增强回路”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_141_0.png)


    员工心中“努力有回报，懒惰就淘汰”的增强回路一旦被激活，他就会比你着急。


    第二天早上来，发现预计的业绩没完成，表格里的奖金少了 200 多块，急了。


