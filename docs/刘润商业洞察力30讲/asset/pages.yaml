  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_52_0.png)


    而因为存量的缓冲，以及流量的缓慢，“滞后效应”带来的时间维度上的复杂性，无处不在。


    从感染病毒到出现症状，有一定的“潜伏期”，让我们难以从症状追溯病因；


