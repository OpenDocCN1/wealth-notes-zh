  img_proc: true
- pgno: 54
  md: '管理也是一样。看到员工的优秀表现，怎么办？不要等到年会上统一表彰。


    这会让员工混乱，很难把奖励的果，联系到行为的因。


    怎么办？减少滞后，增加确定性。立刻表扬。这样员工才能建立因果链，知道什么行为是被奖励的。


    只有当你看见过“滞后”带来的混乱，才会明白“即时”的可贵。


    # 第三，警惕由“滞后效应”引起的“剧烈震荡”


    一家欧洲日用杂货公司公布过一个数字，他们生产一件产品需要45分钟，把产品卖到消费者手上需要150天。也就是说，制造商的生产计划，经过“制造商、批发商、零售商、消费者”这条长链，要滞后150天，才能得到市场反馈。


    市场作出积极或者消极的反馈后，制造商就计算立刻增产或者减产，也要150天后，长链才能触达消费者。150天后的需求早已变化。所以，整个供应链一会儿积压库存，一会儿供不应求，剧烈震荡。


    人们把这种商业世界中的长链波动，称为“长鞭效应”，你一定体会过拿着跳绳的一头上下甩动，勾起的波会慢慢传到绳子尾端。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_55_0.png)


    长鞭效应。最早是由宝洁公司提出。MIT 斯隆商学院的约翰·斯特曼教授，用一个“啤酒游戏”模拟了滞后供应链，并在大量学生中做了实验，发现不管是谁操盘，只要“消费者、零售商、批发商、制造商”导致的“滞后”结构不变，“慢半拍”，就必然导致库存的“剧烈震荡”。


    是“滞后效应”这个系统结构，而不是结构里的人，决定了结果。结构大于人。


    那怎么办呢？两个办法，缩短，和平滑。


    缩短，指的是用“短链经济”打破供应链环节，甚至用戴尔式直销、小米式预售的方式，缩短长鞭。


    平滑，指的是不要因为某天卖得多，就投机性生产，而要根据一周、一月或者若干年的历史数据安排生产，平滑长鞭的抖动。


    你一定听说过“有效市场假说”。价格高，更多人参与竞争，价格降低；价格低，不少人退出市场，价格上升。价格总是能反映价值。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '但学习了“滞后效应”这个调皮的结构模块，你就会明白：价格几乎永远不会等于价值。看不见的手调节时总有“滞后”。这个滞后，让价格围绕着价值震荡。而这个震荡带来的空间，就是创业者永不消失的机会。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_56_0.png)


    # 要点总结


    什么是“滞后效应”？


    因果链、调节回路，和增强回路虽然都很厉害，但是如果加上时间的维度，


    就会发现因果不是瞬间连接， 回路不是瞬间闭合。它们都在时间轴上，体现为一个时间跨度。


    这个跨度，就是滞后。


    滞后效应，并不是微不足道的“慢半拍”。滞后效应一旦缠上了“调节回路”，系统就会出现剧烈的震荡；而一旦缠上了“因果链”，原因和结果，就会在时空上远离，误导你的判断力。


    关于滞后效应，我教给了你三个看清并利用的好办法，其实不只是商业决策，你平时的日常决策也会用到：'
  merge: -1
  img_proc: true
- pgno: 57
  md: '+   1. 原因不一定在结果附近；

    2. 在产品设计、公司管理上，都要懂得减少滞后，增加确定性；

    3. 用缩短和平滑策略，提防“滞后”引起的“剧烈震荡”。


    了解了滞后效应的原理，你在分析问题时，就会加入时间的维度。从此，“时间”不再是随便左右你决策的因素，你的洞察力上到一个新台阶。


    好的，这一讲讲到这里。


