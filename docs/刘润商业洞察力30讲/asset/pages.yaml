- pgno: 60
  md: '你可能会说，这有什么稀奇的，所有的公司声誉都很重要啊。没错，但对其

    他类型-(?)的公司来说，声誉未必是第一因。


    一说到开咨询公司，很多人总会说：这个业务好啊，没什么成本，不就是人

    么？好像有道理啊，咨询公司不需要先行购置厂房、添置设备，也没有库存

    周转的压力，甚至也不需要高额的启动资金。


    但是，这些人忽略了一个常识，那就是咨询公司需要承担一笔巨大的成本：

    交易成本。


    成功的咨询公司各有各的成功，失败的咨询公司只有一条：客户不相信你的

    能力。


    因为不相信，所以交易成本就很高：说说看，你能做什么？你比 X 好在哪里？

    比 Y 强在哪里？还能再便宜一点吗？你能来竞个标吗？我们只能先付 30%

    的钱，等看到效果我再付尾款吧。这些高昂的交易成本，都会导致一家咨询

    公司的成交速度极慢、客户战略决心不够，所以效果不好，咨询公司自己因

    此也收不到钱。


    所以，声誉就是让客户相信的力量。只有用极好的声誉降低交易成本，润米

    咨询才可能建立战略势能，我才算把创业这事干成了。


    找到“声誉-(+)>收入”的关键因素链后，我给自己定了一条铁律：

    绝不去客户现场做售前。


    不管你是多大的企业家，只要你不愿到我的小办公室来聊，就说明我的“声誉”

    还没有强大到让你挪步。只要不是用“声誉”这个第一因赢来的客户，再有钱，

    也不是我真正的客户。不够强大是我的错。我的内心独白是：请原谅我无法

    服务你，因为我要用这个时间，继续拼命提升自己。'
