    # 23 | 通吃模型组：一个比微信好 10 倍的产品，能干掉微信吗？


    “如果”增强回路遇到调节回路，“就会”受阻；“如果”调节回路遇到增强回路，“就会”失控；“如果”增强回路遇到增强回路呢？“就会”通吃”。这一讲，我们学习“通吃模型组”，和其中唯一的基模“富者愈富”(Success
    to the Successful)。


    你有个朋友，非常优秀。有一次，他兴奋地来找你，说他找到了微信的10大痛点，比如，只能加5000个好友，播放语音时没有进度条，群聊没有管理工具，不能阅后即焚，等等。他说，他要开发一个“来信”，干掉“微信”这头年迈迟缓的大象，问你要不要投资他。


    你投，还是不投？'
