  md: '# 08 | 搭建模型：白手起家，创业者如何找到自己的战略势能？


    看透复杂世界，破解决策难题。欢迎收听《刘润·商业洞察力30讲》。


    这一讲的主题是搭建模型，我会告诉你，我是如何白手起家成为一个商业顾问的。


    一切的复杂，都源于其固有的简单：变量、因果链、增强回路、调节回路、滞后效应。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_58_0.png)


    逐一学习了这5个结构模块的特性后，这一讲，我将以我创立“润米咨询”的故事为例，示范如何用这些结构模块，搭建一个商业模型。


    为什么要举这个案例？


    我告诉你一个有点暗黑的秘密：想要考察一家咨询公司或者商学老师说的是不是真的有用，就看他们用不用自己的理论和方法来经营自己。'
