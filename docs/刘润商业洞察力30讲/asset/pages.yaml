  md: '# 要点总结


    员工自驱力到底能不能由外人建立？能！怎么做？找出他的“结构性张力”。


    什么是“结构性张力”？忍不住缩小小期望与现实之间的差距，否则就“如鱼鲠在喉、如芒刺在背”的力量，就是“结构性张力”，是你设计一条良性增强回路必须的元动力。


    任何确定的目标，都不是人的元动力；和目标之间的差距所导致的“结构性张力”，才是。一切的激励的本质，都是先设计“差距”，再利用差距带来的人心中的“结构性张力”，完成目标。


    那么，怎么通过强化员工的“结构性张力”，完成公司目标？


    用弗鲁姆的“期望理论”，加强 4 段逻辑严谨、环环相扣的因果链：


    +   1. 用差距，增强个人努力；


    +   2. 用个人努力，增强个人绩效；


    +   3. 用个人绩效，增强公司奖励；


    +   4. 用公司奖励，缩小差距。


    好的，这一讲就讲到这里。下 junction，我们从洞察集体之心、群体之心、个体之心，到洞察伙伴之心。


    今天给你留的思考题是，你觉得一家公司，在“期望理论”的 4 条因果链的哪一条上，最容易掉链子？为什么？欢迎你在留言区和我互动。'
