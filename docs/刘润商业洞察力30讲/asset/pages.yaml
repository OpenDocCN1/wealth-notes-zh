    iPhone 生态的“转移成本”。


    现在，我想请你用 4 大模型组、9 大基础模型“预测”一下，微信推出“可以在微信内被便捷地获取和传播，同时具有出色的使用体验”的小程序，苹果会怎么想？


    你可以暂停 1 分钟。认真预测。想想这种情况能对应到四大模型组、九大基模中的哪一条，你现在可以依次回顾一下 9 个“如果……就……” 。


    好了，时间到。你，是对的。苹果会觉得自己遇到了“意外之敌”。


    苹果和微信的关系，就像沃尔玛和宝洁的关系。你很难以想象，没有飘柔、潘婷、沙宣、海飞丝这些宝洁旗下商品的沃尔玛；你也很难以想象没有微信的苹果'
