  md: '某管理顾问参加过一个公司的内部会议。情况是这样的：这个公司盈利状况越来越差，管理团队束手无策，于是请了这个顾问前来把脉。


    这个顾问从旁听他们的会议开始介入。他发现，公司所有管理团队，都对一个重金投入的新项目，表现出激动的信心，和兴奋的期待。


    于是，他分别向 CEO、分管副总裁、项目负责人了解这个项目。他以为会听到激励人心的计划，但却听到了下面这些反馈：


    +   - CEO: 这个项目会带来流动资金压力，危及公司生存；

    - 副总裁：这个项目有些纸上谈兵，不具备实施可行性；

    - 项目负责人：这个项目所需要的技术，目前无法实现。


    这位顾问第一反应是：既然不看好，那为什么不会在会上说呢？于是追问下去。


    +   - CEO: 分管副总裁很看好，我拍打击他的积极性；

    - 副总裁：这件事 CEO 亲自挂帅，我尊重他的判断；

    - 项目负责人：老板们孤注一掷，我只能勇往直前。


    没有一个人看好，但也没有人指出。你以为自己会大胆说出皇帝没穿衣服，但却有股力量把你往回拉，往回拉。


    “有股力量把你往回拉”，已经学习了 15 讲《商业洞察力》的你，能不能半秒就洞察本质？有没有四个字，立刻闪现在你脑海里？那是什么？


    没错。“调节回路”。


    这三位高管“表达不同”的冲动，一定引起了某个“变量”的增强；而这个变量越强，就越减弱“表达不同”的冲动，把大家“调节”回表面的和谐一致。


    这个起到调节作用的“变量”是什么？'
