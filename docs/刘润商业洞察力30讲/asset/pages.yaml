- pgno: 61
  md: '这就是关键因果链，给你的战略定力。找到了关键要素“声誉”以及“声誉 -(+)> 收入”的关键因果链之后，怎么启动这个系统呢？


    # 第三，增强回路：推动增长的飞轮


    CEO 的核心职责，是“求之于势，不责于人”。我的职责是不斷增强“声誉”这个“势”。怎么做？建立“增强回路”。


    首先，是什么在推动“声誉”这个核心存量的提升？


    作品。我必须有好的作品，企业家发自内心认可的作品，比如醍醐灌顶的文章，透彻恢宏的书籍，才能提升声誉。


    然后，是什么在推动“作品”的出现？


    学识。纸上谈兵只会被人耻笑。我必须参与真实商业、解决具体问题、身处商业前沿，才有真才实学、真知灼见。


    那么，是什么在推动“学识”的积累？


    声誉。你只有具备极好的声誉，才会有很多企业，允许你陪伴，让你获得大量真实体感。


    “声誉 -(+)> 学识 -(+)> 作品 -(+)> 声誉”，一条增强回路，浮出水面。'
