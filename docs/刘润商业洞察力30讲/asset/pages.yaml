- pgno: 140
  md: '你问：小张，那件事怎么样了？


    小张：我正打算去做呢。


    你说：我三周前就和你说了！


    小张：老板，我这三周一直没闲着。


    一句诗噢回来。算了算了，谁都靠不住。还是我自己来吧。晚上，你加班把这件事情做好。


    为什么会这样？因为你是老板，你比他着急。为什么你比他着急？因为这件事失败了，你的损失比他大；成功了，他的收益比你小。所以，“这是你的事，不是我的事”。他没有把这件事情做成“正向增强回路”。


    那怎么办？在你的员工心中，植入一条“正向增强回路”。


    回到最开始的案例。我建议我这位朋友：


    做一张 Excel 表格，员工填入自己当天的业绩，就能“嗖”地立刻看到当月、本季，和全年的奖金能拿多少，精确到分。


    这太刺激了。每天的努力，直接反映在收益上。员工后来的行为，让他大吃一惊：


    +   1. 很多员工把自己全年每天的业绩都预填进去，推算自己能拿多少奖金；

    2. 然后反过来计划，我想拿到这么多奖金，每月、每周、每天要做多少业绩；

    3. 哪个月清淡，哪个月多做，哪个月冲刺，员工就像打策略游戏一样，不断调整。


    大部分公司，都有激励体系。但是，这些激励体系，因为“滞后”，而没有在员工心中，形成以季度、月度，甚至每天为单位的，“做什么，就能得到什么”的“正向增强回路”。'
