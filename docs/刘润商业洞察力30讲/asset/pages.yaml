- pgno: 176
  md: '公司业绩因此大跌。怎么办？神奇电脑决定加大营销。业绩短暂提升后，迅速下滑。最后，神奇电脑宣布破产。


    现在，让我们戴上洞察力眼镜。


    缩小现实与目标之间的差距，有两种方式：改变行为，和降低目标。


    当用改变行为为调节回路缩小差距遇到阻力时，改为用降低目标调节回路来缩小差距的方法，就是“目标侵蚀”。


    目标一点点被侵蚀，你越来越舒适，但却离真正的目标越来越远。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_176_0.png)


    这种愚蠢行为，现实中不会存在吧？当然存在，而且随处可见。


    我每年至少要坐 100 多次飞机，一直对国内航空公司的“延迟率”深深痛绝。


    突然有一次，我注意到，航空公司标注的，从上海到北京的预计飞行时间，


    从多年的 2 小时，改为为了 2 小时 20 分钟。


    你预测后来会发生什么？'
