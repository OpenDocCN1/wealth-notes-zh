  md: '# 28 | 演化思维：你要学哪个版本的谷歌？


    这一讲，我要和你一起，破除一个更顽固的认知障碍“静止思维”，并练习建立“演化思维”。


    提问：如果你是创业者，谷歌现在给你发内部邀请，对你开放，让你做观察员，任何办公室、会议、人员，随便看随便问。但是只有一个月，你会去哪个部门、做什么？


    +   - 有人说：我要去技术部，看看他们是怎么开发出这么牛的产品;

    - 有人说：我要去人力资源部，看看他们到底怎么招聘、管理员工的;

    - 有人说：我要去 Google X 未来实验室，看看谷歌有多注重对未来的投资。


    这些都值得看。特别值得看。我也很感兴趣。


    但如果是我，如果只有1个月，我会飞奔到谷歌的档案室，如饥似渴地翻看谷歌的历史文件。我对谷歌今天在做什么很感兴趣，但我更感兴趣的是，谷歌是怎么走到今天的。


    啊？难道谷歌正在做的事情，不是不谷歌走到今天的原因吗？做正确的事情，是跨越时间的，永恒的真理吧？


    这，就是典型的“静止思维”：静止思维的人，用不变的眼光，看待变化的事物。他们不知道的是，另一个阶段的蜜糖，可能是这个阶段的砒霜。他们喜欢说：


    这是跨越时间的，永恒的真理！'
