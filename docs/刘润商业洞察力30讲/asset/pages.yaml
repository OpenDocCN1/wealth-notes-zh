  md: '在电影《天下无贼》里，黎叔说：“人心散了，以伍不好带啊。”此时此刻，这家茶叶公司 CEO 的心情，大概也是如此。


    但是，人心真的散了吗？队伍真的不好带了吗？人心从来没有散过。它从来都有自己的方向，只是有时和你不一致。


    商业系统不是钟表，装电池就一定会走；商业系统也不是音乐盒，上发条就一定会转。商业系统，是由“人”构成的。钟表、音乐盒的每个部件，只需要知道该“如何做”（Know
    How）；而人，还需要理解“为什么”（Understand Why）。


    为什么一定要理解“为什么”？罗素·艾柯夫教授说，这是因为公司是个“社会系统”。


    罗素·艾柯夫(Russell L. Ackoff)是沃顿商学院的教授，系统动力学的泰斗。


    他在1957年出版的《运筹学》，把科学界的系统研究方法，带入了企业管理。他认为，这个世界上 provisionly 一共有四种系统。


    # 1.机械系统


    比如钟表。钟表作为整体，是没有意识的。它不会对你说，我有个梦想。钟表的零件也是没有意识的。它不会对钟表说，我今天心情不好，想请个假。


    手表、汽车、飞机，都是机械系统。


    # 2.生物系统'
  merge: -1
  img_proc: true
- pgno: 111
  md: '比如人体。人作为整体，是有意识的。人这个生物体，追求生存和繁殖，追求幸福生活。但人体的器官，是没有意识的。小库为了买新款 iPhone，卖掉一个肾，肾不会感到被抛弃的悲痛。


    人体、猫体、狗体，都是生物系统。局部没有个人英雄主义者，只有集体主义精神。


    # 3.生态系统


    比如自然。自然作为整体，是无意识的。阳光明媚、山崩地裂，都是“情绪”无关，只是局部涌现到整体的现象。但组成自然的生物体，是有意识的，鸟兽鱼虫，猪狗牛羊，为了生存竞争合作。


    城市、自然、宇宙，都是生态系统。


    # 4.社会系统


    比如公司。公司作为整体，是有意识的。想要规模，想要利润。公司的每个员工，也是有意识的。对公司认可，就好干；不认可，这就是一份工作。


    家庭、公司、国家，都是社会系统。社会系统，是唯一一个系统、变量都有意识的系统。'
