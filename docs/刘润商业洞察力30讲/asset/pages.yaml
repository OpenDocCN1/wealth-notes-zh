- pgno: 7
  md: '比如，在斯坦福监狱实验中，这24名志愿者，就是“要素”；而“狱卒和囚犯”就是他们之间的“连接关系”；


    斯坦福监狱实验告诉我们，要素其实无法完全决定自己的行为。


    但是，把要素和连接关系放在一起，也就构成了整个“系统”；是“系统”决定了个体要素的行为。


    获得“麦克阿瑟天才奖”的系统动力学家德内拉·梅多斯，在她的成名作《增长的极限》里说：


    > “真正深刻且不同寻常的洞察力，来自观察‘系统’如何决定自己的行为。”


    到底什么是洞察力？所谓洞察力，就是透过表象，看清“系统”这个黑盒子里，


    要素以及它们之间连接关系的能力。而我要做的是帮你戴上这副“洞察力眼镜”，


    一拍就能看到事物的本质。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_7_0.png)


    你可能还会问，我拥有了透视“要素”和“连接关系”的洞察力眼镜，有什么用？


    我要告诉你，所有你无法解决的问题，都是因为你看不清。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '因为要“真正解决问题”，通常不是改变要素，而是改变它们之间的连接关系。


    洞察力就是帮你找出连接关系，然后改变它。


    我举个例子。


    你在某海边旅游城市的一家海鲜餐馆吃饭，看见鱼缸里有一条从没见过的鱼，


    于是问老板：老板，这是什么鱼啊？没见过哎。


    你猜，这时老板会做什么？


    老板会一把捞出这条鱼摔死，说：这是什么什么鱼，300块一斤，一共20多斤，6000块。


    这种“花式宰客”的“现象”，在旅游城市屡禁不止。为什么？因为餐馆老板这个“要素”的良心被狗吃了 fréquence?


    并不是。是因为店主和你之间的“连接关系”不对。


    对大部分人来说，这辈子可能只会去这个城市旅游1~2次。只去1~2次，到同一家海鲜餐馆吃饭的概率，几乎为零。也就是说，对这家海鲜餐馆来说，几乎每个进店的客人，这辈子只会来一次。如果你是这家海鲜餐馆的老板，


    你的最佳策略是什么？


    宰死他为止啊，反正不会来第二次！如果你是他，你也未必比他好到哪里去。


    “花式宰客”的行为，不是عر餐馆老板这个“要素”决定的，而是你们之间单次博弈的“连接关系”决定的。


    那怎样真正解决这个问题？


    不要期望改变“要素”，比如教育餐馆老板“你要善良”，而要改变“连接关系”。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '比如，我们现在都会用“大众点评”先判断一家店是不是靠谱，因为线上累积的评价，形成了口碑，实现了餐馆与顾客的重复博弈。我再举一个国外的例子。


    麦当劳的顾客反映，他们在高速公路上的加盟店，食品和服务都很差。为什么？


    这是因为“要素”，也就是店长们的能力比较差吗？


    并不是。这是因為高速公路上的顾客，都是过路客，他们和麦当劳的关系，也是“单次博弈”。服务得不好，会伤害麦当劳的品牌，对加盟店的收入却几乎没有影响。


    怎么办？


    麦当劳决定改变“连接关系”，把高速公路加盟店收回为“直营”。这时，麦当劳和店长的关系，就变为了长期雇佣的“重复博弈”关系。高速公路店的服务水平，大幅度提升。


    我再举个例子。


    我们都听说过和尚分粥的故事。两个和尚分粥，负责分粥的和尚，当然想给自己多分一些。而另一个人当然不答应。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '改变“连接关系”。让一个和尚分粥；另一个和尚逃粥。选粥的和尚，当然会挑多的那碗。这样，为了不吃亏，分粥的和尚的唯一办法，就是把两碗粥分得尽量一样多。


    通过改变“连接关系”，而不是“要素”，两个和尚获得了他们都认可的公平。


    回到最开始的问题。“一切不行，都是人的不行”，这句话对吗？人当然很重要，但是人从来无法单独决定行不行。人这个“要素”，和它周围比人更强大的“连接关系”，共同决定着“行与不行”。


    真正有洞察力的人从来不说：一切不行，都是人的不行；真正有洞察力的人喜欢说：结构不对，什么都不对。


    要点总结：


    这一讲，是《刘润·商业洞察力 30 讲》的第一讲，我们学习了“系统”这个基石概念。


    # 什么是系统？


    # 系统，就是“一组相互连接的要素”。


    这个定义里有两个关键词：1）要素；2）连接关系。我们很容易看到眼前的“要素”，但常常忽略它们之间的“连接关系”。


    那么什么是洞察力？


    洞察力，就是透过表象，看清“系统”这个黑盒子里，要素以及它们之间连接关系的能力。


    普通的人观察一只手表，优秀的人洞察几百个零件之间的“连接关系”；


    普通的人观察一次合作，优秀的人洞察协议背后利益分配、风险转嫁的“连接关系”；'
  merge: -1
  img_proc: true
- pgno: 11
  md: '普通的人观察一个团队，优秀的人洞察团队里权力利益错综复杂的“连接关系”。


    普通的人会观察，优秀的人能洞察。


    下一讲开始，我要带你仔细拆解要素，和它们之间的连接关系。


    思考题：为什么大卫豪托尔斯泰，在他的巨著《战争与和平》里说：历史学家总是不能解释历史。你觉得他为什么这么说？你同意他的说法吗？欢迎你在留言区和我互动。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_11_0.png)


    # 02 | 结构模块：是什么，导致了大不列颠的强盛？


    上一讲，你知道了要素再重要，也没有系统重要，系统就是“一组相互连接的要素”。


    洞察力，就是透视其中“要素”和“连接关系”的能力。


    那么，到底什么是“要素”？


    把要素连接在一起的“关系”又有哪些？


    这一讲，我就为你揭秘系统，告诉你如何成为一个能拆解所有系统的“<|message|>丁”。'
