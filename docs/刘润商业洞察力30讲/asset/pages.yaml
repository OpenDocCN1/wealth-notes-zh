    观察因果链，你就会得出结论：疾病蔓延。


    城市人口，导致过度拥挤；过度拥挤，导致疾病蔓延；疾病蔓延，降低了出生率，增加了死亡率，又反过来减少了城市人口。这种“因增强果，果抑制因”的循环，就是“调节回路”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_17_0.png)


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_17_1.png)


