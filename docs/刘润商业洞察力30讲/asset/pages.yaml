- pgno: 114
  md: '那么，如何设计“上下同欲”模型，在集体中，管理人心呢？你要记住两个要点：参与约束，激励相容。


    # 第一，参与约束


    你如何约束“人”这个变量，参与你的系统，而不是别人的？让他参与系统获得的可能收益，一定要是比不参与多。


    茶叶公司的裁员减薪计划，就不具备“参与约束”效果。为了公司存亡而被降薪或被裁员，不如 më下去。所以，你公司的计划，员工肯定不参与。不是人心难测，是计算后不值得。


    那我公司不裁员，如何设计“参与约束”呢？


    比如，用年薪制，取代月薪制。


    年薪制，就是绑定了公司目标的年度总收入。它包括带来安全感的工资，汇报达成目标的奖金，和超额业绩激励计划。


    这个数字，一定 mark 大于员工的期望，才有让员工坐下来研究公司目标的可能，才有“参与约束”的效果。


    # 第二，激励相容


    茶叶公司的工会投资计划，就具备“激励相容”的效果。在两个新的“正向增强回路”中，员工为了“多赚钱”这个私利，唯有“努力工作，加大投资”，而这两个动作，也必然带来公司越来越盈利。'
