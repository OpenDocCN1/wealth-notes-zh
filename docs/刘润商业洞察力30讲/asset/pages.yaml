- pgno: 46
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_46_0.png)


    什么是调节回路？调节回路，就是因增强果，果反过来减弱因，从而抵抗系统变化的因果回路。


    如果说，增强回路是追求极端；调节回路就是追求平衡。你可以想象一条皮筋，增强回路就是使劲儿往长了扯，但扯得越长，往回弹的力量也就越大，往回拽的平衡力量就是调节回路。如果不拽着，肯定就扯断了。那么企业发展也像皮筋一样无法一路狂奔吗？没错，我要告诉你的是，这种平衡是注定的，也是必要的。那么，它何时出现？到底是好是坏呢？戴上洞察力眼镜，你需要依次看清下面这
    3 点：


    # 第一，打破“看不见的天花板”


    调节回路，在商业世界中，常常表现为天花板。但是，天花板往往是你碰得头破血流了，才意识到的。所以我要提醒你，一定要提前看到它，并且打破它。


    很多人创业时特别喜欢说：要是创业了，绝对不能像我老东家那么管公司，层级太多、流程太复杂、制度太死板。没有管理的管理，才是最好的管理。


    就十几个人，遇到什么问题，站起来一吼，都解决了。如果真解决不了，吃火锅呗。哪有什么问题，是一个锅解决不了的？如果有，那就两顿。'
