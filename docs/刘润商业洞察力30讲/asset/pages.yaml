- pgno: 142
  md: '员工 D 的业绩很差，但很努力。经理想批评，但怕打击老实人的积极性，说不出口。结果员工 D 以为自己做得挺好，至少比 A、B、C 好。不行的人误解自己挺好。公司业绩越来越差。


    戴上洞察力眼镜。“猜疑、误解”，导致“士气、业绩”越来越差；“士气、业绩”越来越差，导致更多的“猜疑、误解”。这是一条“负向增强回路”。


    为什么会这样？因为缺乏沟通，信息不透明。大量中层领导把信息当做权力，老板说了什么，有限传递；下属做了什么，选择汇报。他们就成了信息的“黑洞”。


    怎么办？


    切断缺乏沟通的“负向增强回路”：


    +   - 把每一个员工的年度目标、考核方法，公布给全公司；

    - CEO 每月发全员邮件，沟通方向、战略、组织调整；

    - 周会一定要开，不断修正方向；

    - 打开员工论坛，让正面反馈能传播，反面反馈能辟谣；

    - 要求每个经理和员工必须做每月的 1:1 沟通......


    沟通的目的，是信息透明。只有切断了“信息越不透明，员工越猜疑、越误解，然后越不愿意沟通，信息就越不透明”的负向增强回路，员工士气、公司业绩，才会回到正轨。


    # 3.增加安全调节回路


    一个员工和你提出离职，说压力大。你和他谈心，说要有远大梦想。然后，第二个员工、第三个员工和你提离职，都说压力大。这时，你要心中默念三'
