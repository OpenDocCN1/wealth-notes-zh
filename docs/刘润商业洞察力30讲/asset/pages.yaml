  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_90_0.png)


    # 3.项目开始时人手总是不够，项目结束时人手总是多余。为什么？


    很可能，它缺少了一个叫做“公共人才库”的缓冲器，用以缓解释放项目突然集中上马，带来的瞬间冲击。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_90_1.png)


    没有缓冲器，轻则波动，重则葬死。但是，这听上去也太“显而易见”了吧。


    这不需要专门向商业顾问来学吧？ CEO 不会连这也不知道吧？


    还真不一定。而且我发现我身边，越是优秀的 CEO，越容易因为“缺乏缓冲器”而翻车。因为，越优秀的 CEO，越追求“极致的效率”。'
