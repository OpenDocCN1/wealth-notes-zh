  md: '洞察了系统本质，搭建了正确的模型，不代表你一定能成功。下面你要战胜的，还有概率。


    # 3.认知力极限


    200 多年前，亚当·斯密提出了著名的“看不见的手”这个模型。他说：每个人追求自己的私利，公众将得到最大的福利。


    这个模型，可以说奠定了整个经济学的基石。


    后来，纳什提出了著名的“非合作博弈”。他发现，当两个囚徒在特殊条件下博弈时，追求自己的私利，不但没有得到最大的共同福利，反而个体损失加大。亚当·斯密的基本假设，被推翻。但是，经济学往前迈了一大步。


    我们站在巨人的肩膀上，牛顿、爱因斯坦，但巨人相对于宇宙来说，依然很渺小。敢于承认亚当·斯密有“认知力极限”，经济学才会进步。


    每个模型被挤制出来，就开始等待被打破。我们选择用一个模型解释过去、预测未来，不是因为它“永恒正确”，而是因为它“当下有用”。


    所以，我的朋友，我建议你，也提醒我自己，以后在和别人讨论问题的时候，不要说“你错的”，而要说“你的模型和我不太一样”；不要说“我是对的”，而要说，“我的观察角度是这样的”。


    这样，在解锁商业地图的道路上，我们才是一个谦卑的洞察者。


    # 毕业寄语


    这一讲，我希望和你谈的是，人类洞察力的三个边界：复杂度灾害、概率性因果，和认知力极限。


    +   - 复杂度灾害是指，因为我们的知识、智慧所限，我们能试图破解的系统是有复杂度上限的。我们可以努力洞察万物，但不要认为我们能够立刻透视宇宙。'
