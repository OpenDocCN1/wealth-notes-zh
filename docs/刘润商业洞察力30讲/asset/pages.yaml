- pgno: 88
  md: '什么叫缓冲器？缓冲器，是专门用来平滑流(入)量波动的存量。


    听着很拗口。我们就说说旱灾、水灾的例子。


    为什么近代以来，我们能够抵御的洪水级别，能从十年一遇到百年一遇，越来越高？因为河流安装了缓冲器，也就是水库，而过去没有。


    在过去，任何一段河床上水的流(入)量，都是上一段河床即刻的流(出)量，没有存量。因此，只要来自上游的水的流(入)量不稳定，下游就会时而旱灾、时而水灾。


    而一旦连接了水库就不同了。水库的存量，就是一个缓冲器。雨季水位高，旱季水位低，但是只要不见底、不溢出，下游就会获得平滑稳定的流(入)量。


    所以不管上游水量多么不稳定，只要在水库下游耕种农田，都可以旱涝保收。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_88_0.png)


    日对月，山对水，朝霞对夕阳，“缓冲对波动”。从系统的角度看，缓冲器的本质，是一个用来“缓缓释放瞬间冲击”的“存量”。它是自然界和商业界的法宝，默默扮演着“稳定”的角色。'
  merge: -1
  img_proc: true
- pgno: 89
  md: '每当有人问我：润总，我最近的业绩“起起落落，频繁波动”，我就知道，很可能，他缺少了至少一个缓冲器。


    回到最开始的案例。


    1. 某手机厂商，因为相机供应商断货，手机上市推迟 2 周。为什么？


    很可能，它缺少了一个叫做“配件库存”的缓冲器，用以缓解释放供应商不靠谱带来的瞬间冲击。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_89_0.png)


    2. 公司发展一直不错，没想到现金流突然断裂，几百人的公司，一夜之间夭折。为什么？


    很可能，它缺少了一个叫做“安全现金流”的缓冲器，用以缓解释放收入突然不稳定时，无法减少的支出，带来的瞬间冲击。'
