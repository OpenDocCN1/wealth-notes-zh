- pgno: 25
  md: '有些存量，它的增长能明显提升实力，它的减少会迅速带来危机。这些存量，是你的“核心存量”。


    一家互联网公司的“核心存量”是什么？用户。一家投资机构的“核心存量”是什么？案例。一个医院的核心存量是什么？社会信任。讲师呢？学员口碑。餐厅呢？回头客......


    找到你的核心存量后，不遗余力地往里注入流量。


    如果“社会信任”是你的核心存量，你应该做什么？


    上次吃饭时，说好 AA 的，后来你微信转账了吗？有个朋友帮了你，你认真地感谢了吗？出国旅行，记得给她带一样小礼物，作为心意了吗？你的品牌被客户投诉，确实是你的责任，你双倍赔偿了吗？客户在微博上贴出产品缺陷的照片，你解释了吗？3·15
    晚会，央视曝光你的质量问题，你“撤硬菜、道歉软”了吗？


    流量改变存量，存量改变世界。你的核心存量是什么？


    # 第二，关注“流量增速”


    普通的人关注流量大小，但优秀的人关注流量增速。


    国民财富，是存量；GDP，是国民财富今年新增的流量；6.5%的 GDP 增幅，就是“流量增速”。


    流量很重要，流量增速更重要。因为流量增速是存量的“放大器”。


    我有 10 万，邻居有 100 万。我们都投资了一个年收益 5% 的项目。年底，我们会变一样有钱吗？不会。不但不会，我们之间的“贫富差距”，会从 90 万，扩大为
    94.5 万。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '当流量增速一样时，我们和领先者的差距，只会越来越大。落后者必须找到更大的流量增速，才有机会“赶超”。


    如果你是一个打工人，不要太关注 35 岁之前的收入，不要为了 800 元、1000 元，跳槽到一家学不到东西的公司。把心思，放在“能力”这个流量增速的引擎上。35
    岁之后，你觉得今天这些钱，少得可笑。


    实力靠存量，潜力靠流量，赶超靠流量增速。


    # 第三，关注“周转时间”


    用存量除以流量得到的数值，就是周转时间。这是一个常被人忽视，但有杠杆一样威力的要素。


    你有 1000 件衣服的库存，是存量。每月能卖出 500 件，是流量。用 1000 的存量，除以 500 的流量，你 2 个月能把库存卖完。2 个月，是你的周转时间。


    周转时间，为什么重要？它是效率的刻度，而效率往往就是企业的生命线。


    2019 年 1 月，我带企业家团队去美国游学，参访了好市多超市（Costco）。


    好市多的高管 Jay 接待了我们。我问他，Costco 是怎么做到的，商品价格那么低，居然还赚那么多钱的？


    Jay 告诉我：因为我们的库存周转时间，只有 1 个月。


    1 个月意味着什么？意味着，同样的 1 块钱，Costco 可以搞成 12 块来花。Costco 的销售毛利率，大约是 6%，用 1 块钱进货，赚 6 分。而它的周转时间是
    1 个月，这样一年就可以周转 12 次。6 分钱乘以 12 次，一年能赚 7 毛 2 分钱。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '而效率低的公司呢？用 1 块钱进货，不受欢迎，一年才卖出去 1 次。就算销售毛利率是 50%，一年也就才赚 5 毛钱。


    这个世界上，从来没有什么一分价钱一分货。Costco 卖得比你便宜，还比你赚钱，秘诀就是：更短的周转时间。


    要点总结：


    透过表象，洞察系统本质，就必须首先透彻理解“变量”这个最基础的结构模块。


    关于变量，我们需要知道：


    +   1. 变量就像浴缸里的水一样，有两种状态：存量，和流量。

    2. 存量，就是时间点上变量的数值（比如浴缸里的水）；流量，就是时间段上数值的变化（比如水管里的水）。

    3. 流量改变存量，存量改变世界。


    一个有洞察力的人，要懂得看透变量的三个经验：


    +   1. 关注核心存量；

    2. 关注流量增速；

    3. 关注周转时间。


    下次讲，我们学习系统的 5 个基础结构模块中的第 2 个，把变量连接起来的：因果链。


