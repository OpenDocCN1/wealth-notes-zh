  md: '思考题：我留给你的思考题是：有人说，只要你愿意开始，什么时候都不晚。真的是这样吗？这句话成立，有什么前提吗？


    如何解决“富者愈富”模型带来的“穷者愈穷”问题？不要恋战，你拿下一局，我就跑步进入下一局。


    《刘润·商业洞察力30讲》

