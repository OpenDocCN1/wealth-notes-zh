- pgno: 91
  md: '曾经在日本有一个著名的管理理论，叫做 JIT（Just In Time）。中文叫“即时生产”。这是索尼非常引以为豪的制度。


    什么叫“即时生产”？


    索尼的流水线想生产某个电子产品。按照流程，今天下午 3 点，要装配某个元件。那 2 点钟，把元件从库房里拿出来吗？不。为了“极致的效率”，索尼不备元件库存。它通知元件供应商，请必须在今天下午
    2:30，把这个数量的元件，送到那个地点。


    2:30，供应商的元件准时送到。索尼立即卸货，直接进生产线开始生产。


    这就是“即时生产”。


    这个效率高不高？当然高。但是你觉得，这个制度有没有问题？


    有问题。万一呢？万一上游供应商没有及时送货呢？万一运货的车搁在路上了呢？索尼的生产线，必须马上停工。一个元件耽误几天，整个生产周期就要耽误几天。它的生产，会随着上游的供货风险，出现强烈的震荡。


    效率是商业进步的方向。但是很多对效率的极致追求，其实都是对缓冲器的放弃。


    没有库存当然只能提高效率，但是就会有波动的风险；把所有现金都拿去进货，当然提高效率，但是会有猝死的风险；没有“闲人”当然提高效率，但是会有重大项目无人可用的风险。


    只会提高效率的 CEO，不是好 CEO：懂得牺牲一定的效率，用必要的缓冲器对冲波动和猝死风险的，才是成熟的 CEO。


    那么，一个 CEO，应该安装哪些“必要的缓冲器”，对冲“波动和猝死”的风险呢？'
