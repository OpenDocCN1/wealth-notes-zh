  md: '到这一讲为止，我们终于学完了用来分析，甚至预测未来的 4 大模型组、9 大基础模型。这—讲，我会带你做两个练习，回到两个过去的时间节点，戴上洞察力眼镜，试着用我们的理论推演一下，看看能不能清晰地还原时间线，然后看出来的延伸线，把模型内化为预测能力。


    # 1. 微信小程序


