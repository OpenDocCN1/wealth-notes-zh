    # 要点总结


    在这一讲，我用润米咨询的案例，示范如何用5个系统的结构模块（变量、因果链、增强回路、调节回路、滞后效应），搭建成一个完整的商业模型。


    5年创业，看似纷繁复杂，但其实我只做了5件事：


    +   1. 找到核心存量：声誉；

    2. 找到关键因果链：声誉→(+)收入；

    3. 找到增强回路（声誉、学识、作品），推动增长的飞轮；

    4. 找到调节回路（时间限制），打破增长的天花板；

    5. 承认滞后效应，进行饱和式创业。


    一切的复杂，都源于其固有的简单。你学会如何用简单，搭建复杂了吗？


    好的，这一讲就讲到这里。


    下一讲，我要和你一起，给你搭建的系统做做体检。'
