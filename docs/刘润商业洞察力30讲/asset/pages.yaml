  md: '+   1. 你自己负责用影响力给餐厅带去流量；

    2. 但一定要找到有丰富经验的经理人，帮助提高转化率和客单价；

    3. 千万不要忘记持续监控菜品的质量，保证复购率。


    当你能够破除散点思维，建立公式思维时，整个世界在你眼中，不再是一个个“要素”，而是它们之间的“连接关系”。


    这些公式，就是高手们用洞察力，从上帝手中“偷来”的地图。


    我再举个例子。


    很多人认为，过量的碳排放是全球变暖的罪魁祸首。但是，如何解决碳排放的问题？专家们给出了成千上万的建议。有人说要少开车，有人说不准烧煤，有人说你都在瞎扯，这也限制那也限制，那为什么呼吸不限制？吵得不可开交。


    微软创始人比尔·盖茨，在一次 TED 的演讲中，给出了一个解决碳排放问题的“分解公式”：


    ```

    CO2 = P x S x E x C

    ```


    在這個公式中：


    +   • P，就是 People，人口；

    • S，就是 Service Per Person，每个人使用多少项服务，比如开车、壁炉、烧烤等等；

    • E，就是 Energy Per Service，每项服务使用多少能源；

    • C，就是 CO2 Per Unit Energy，每单位能源，排放多少二氧化碳。


    于是问题一下子清晰起来。解决碳排放问题，就是分别解决人口爆炸问题(P)，提倡环保的生活方式问题(S)，设备节约使用能源的问题(E)，和产生单'
  merge: -1
