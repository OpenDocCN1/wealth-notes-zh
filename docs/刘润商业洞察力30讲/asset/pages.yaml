  md: '# 17 | 结构性张力：如何帮员工建立自驱力？


    你好，欢迎收听《刘润·商业洞察力 30 讲》。

    这一讲的标题是：如何帮员工建立自驱力，你可能会觉得奇怪，自驱力不是内因吗？作为一个外人能起到什么作用呢？


    前两讲，我们用苔柯夫的“社会系统理论”，看透集体之心；用勒温的“群体动力学”，看透群体之心。这一讲，我们训练用弗鲁姆的“期望理论”看透个体之心。看看员工个体的自驱力到底怎么建立。


    有一次，我参加一家企业的年度战略研讨会。CEO 和高管制定完年度目标和计划后，非常兴奋，似乎胜利就在眼前。这时，CEO 顺势提出：我决定，在下周公司年会上，每个部门负责人公布自己的年度目标，让所有人知道彼此的工作，大家面向同一方向作战。


    他万万没想到，这个提议遭到了几位高管的反对：最好不要吧。如果每个人都知道了彼此的年度目标，就没有回旋余地了。万一完不成，士气会受打击。

    我们要向最好处计划，往最坏处打算。


    争论不休。用清晰的 KPI 激励成功，还是用模糊的 OKR 保护士气？他们问我：润总，你觉得呢？


    我想了想，说：你们知道，员工努力工作的元动力是什么吗？

    是名？是利？是实现个人梦想？是帮助公司完成业绩？还是世界和平？都不是。推倒你眼前的所有的现象，我们戴上系统动力学的眼镜，看看本质。其实，员工努力工作的元动力是：结构性张力（Structural
    Tension）。

    什么是“结构性张力”？'
