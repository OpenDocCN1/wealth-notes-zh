  md: '什么意思？就是，巨信用户可以添加微信、支付宝好友，微信、支付宝用户也可以添加巨信好友。巨信、微信、支付宝，甚至米聊、来往、易信、子弹短信的用户，可以在一个群里聊天。


    巨信你敢收费我？那我就用微信、支付宝。反正打开微信、支付宝，也能和巨信用户聊天。微信、支付宝也敢收费我？那我就用米聊。反正不管装什么聊天软件，都可以和所有人聊天。我选择聊天软件的标准，再也不是“大家都用哪个，我就用哪个”，而是“哪个把我当上帝一样伺候，我就用哪个”。巨信的“网络效应”，就被一针刺穿了。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_105_0.png)


    从今以后，任何聊天软件敢动一点“侵犯隐私、强推广告、悄悄扣费”的念头，用户就可以毫不犹豫地“携号转网”。监管部门不费一兵一卒，就治好了“赢家通吃”者的膨胀。


    改变模型，是一切问题的根本解。


