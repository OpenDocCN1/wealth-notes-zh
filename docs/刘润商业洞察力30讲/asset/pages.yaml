- pgno: 119
  md: '别急。精彩的部分在后面。其实，这 7 位受试者中，前 6 位都是阿希的助手。


    他们会故意给出错误答案，比如都选 B，然后看第 7 位，也就是唯一真正的受试者，能否回答正确。


    结果怎样？


    结果是，如果受试者单独接受测试，错误率平均低于 1%。因为实在太简单。但如果受试者在阿希的 6 位助手们之后回答，错误率从不到 1%，上升到 37%。


    这就是：群体压力。


    什么是群体？超过三人，就叫群体。群体，是一种没集体正式、比个体复杂

    的自发组织。比如公司管理层、羽毛球俱乐部，或者今天会议室里的所有人。


    那么什么是群体压力？当成员发现自己的意见和群体抵触时，会产生巨大的压力，从而主动放弃观点，接受群体意见，这就是群体压力。


    除了阿希的线段实验，还有谢里夫的灯光实验、米尔格兰姆的服从实验等等，有趣你可以去搜索一下，这些实验不断证实了“群体压力”这个变量的存在和作用，让我们终于合上了“表达不同，增强群体压力；群体压力，反过来压制表达不同”这条调节回路。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_119_0.png)


    戴上洞察力眼镜，看透人心，不仅要看透个体之心，更要看透个体相互作用形成的群体之心。个体时，每个人都正确；群体时，就走向错误。群体压力调节回路，让这家公司的三个诸葛亮，还抵不上一个臭皮匠。'
