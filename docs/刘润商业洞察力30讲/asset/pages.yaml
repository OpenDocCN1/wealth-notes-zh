- pgno: 112
  md: '# 罗素·艾柯夫：四种系统


    系统有意识


    生物系统

    人体，猫体，狗体


    社会系统

    家庭，公司，国家


    安置有意识


    空量无意识


    机械系统

    手表，汽车，飞机


    生态系统

    城市，自然，宇宙


    系统无意识


    我们总是憨慨“人心散了，队伍不好带了”，而从不抱怨“方向盘生气了，车不好开了”，是因为公司是个双意识的“社会系统”。“不好带了”，是因为人心和队伍的意识，没有统一。


    为什么要给你讲四大系统？因为理解了这四大系统，你就能理解“宁愿一起赴死，也不夹没难关”的问题。


    说“我老板，你必须服从”？这是把员工，当成了“机械系统”上的无意识的零部件，一定会遭遇反弹；宣讲“集体主义精神”？这是把员工，当成了“生物系统”里随时可以牺牲的器官，只会激发现生欲。


    那怎么办？


    茶叶公司联系了华盛顿管理学院。所有问题，都是尚未化解的冲突。华盛顿管理学院建议：由工会员工，买下关闭的门店。


    大家对这个办法，将信将疑。试试吧。两周后，600 名工会成员主动捐出 5000 万美元，成立了收购基金。公司大吃一惊。


    然后，公司和工会达成协议：'
