- pgno: 95
  md: '# 什么是临界点？临界点的本质，是主导结构模块之间的切换。


    什么意思？我就来以互联网公司的“Ｃ轮死”为例子。我先简单解释一下“Ｃ轮死”，就是说，在创投圈子里，绝大多数走到Ｂ轮融资的公司，是拿不到Ｃ轮融资的，因此，创业项目就会陷入困境而死。大家都以为“Ｃ轮死”就是创业团队融不到钱了，但你如果用系统动力学来透视一下，可没那么简单：


    互联网公司发展，最重要的资源是用户。用户越多，公司越值钱。一开始，公司Ａ和公司Ｂ都拼命烧钱，获得大量用户；大量用户，带来更多投资；更多投资可烧，用户增长更快。Ａ、Ｂ两家公司，各有一条“烧钱驱动”的“增强回路”，作为“主导结构模块”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_95_0.png)


    这种“烧钱驱动”的“增强回路”，很快遭遇了“总用户规模”这个“刚性约束”，撞上了“边界墙”。这时，公司Ａ和公司Ｂ，都只能从对方的池子里抢用户。'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'A 抢到的越多，B 就越少。甚至，当 A 抢到“足够多”的用户时，B 的用户发现留在 B 阵营的价值越来越低，会主动投奔 A。


    突然，赢家通吃的“网络效应驱动”的“增强回路”，取代了“烧钱驱动”，成为系统的“主导结构模块”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_96_0.png)


    公司 A，和公司 B 之间比的，其实不是谁先到终点，而是谁先到达“足够多”这个“临界点”。一旦到临界点，越来越多者就会越多，指数级增长；越少者就会越少，雪崩式坠落。胜负从此已分，以后的遭遇战，只不过是打扫战场而已。'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_97_0.png)


    投资者是不会再下注一个胜负已分的比赛的，他会果断输离离场。这就是为什么“投资人、媒体全消失了”。这个临界点，大概率出现在 C 轮融资。这就是互联网著名的“C
    轮死”。


    天啊，原来如此。但是，这也太可怕了吧？是的。系统中的“主导结构模块”的切换，常常突然发生，而且惊天动地。


    英语中“Lead”（领导）这个词，来自印欧语系的词根 Leith，意思就是“跨越临界点”（Cross a Threshold）。


    很多人 фигуры商业计划书中，会画一张直线型增长的预测图。其实，这个世界哪里有什么直线型增长。在你前面埋伏的，是各种各样的“主导结构模块”切换带来的“临界点”，等你跨越。跨过去了，继续前行；没跨过去，换条命再来。


    那么，商业世界有哪些“主导结构模块”的切换带来的“临界点”，等待我们跨越呢？戴上洞察力眼镜，你要时刻关注这四种“临界点”，随时跨越。


    # 第一，跨越质变点'
  merge: -1
  img_proc: true
- pgno: 98
  md: '我们都听说过“从量变到质变”，可是到底什么叫“质变”？所谓质变，就是“存量”超过一个阈值后，突然导致的“因果链转换”。


    水在 100℃时，会从液体变成气体，100℃，就是水的“质变点”。超过 100℃ 这个阈值后，系统的主导因果链从“加热→水温升高”，切换为“加热→气温升高”。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_98_0.png)


    温度降低，气体能变回液态。但是在商业世界，不少因果链一旦切换，就不可逆了。


    “客户抱怨”这个存量越来越高，会体现为投诉电话越来越多。可是突然有一天，投诉电话没有了。先别高兴。不一定是他们满意了，可能是他们离开了。当“客户抱怨→投诉”这条因果链，切换为“客户抱怨→离去”，爷不陪你玩儿了，就不可逆了。


    你见过碎在地上的镜子，拿起来可以复原的吗？


    # 第二，跨越引爆点


    最开始的案例中，A 公司成功跨越的，就是引爆点。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '所谓引爆点，就是“存量”超过一个阈值后，激活了一个“正向增强回路”。跨越引爆点的关键，是向阈值冲刺。


    比如，把产品做到多好，才是“足够好”？要好到“用户忍不住发朋友圈”。


    1 个用户忍不住发朋友圈，可能帮你获得了 500 个潜在用户；这些用户中也许有 100 人购买，最终 20 个成为你的忠实用户。20 个忠实用户中，有 4
    个人又忍不住发朋友圈。一个正向增强回路走完，1 条朋友圈变 4 条，如此往复，最终引爆层。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_99_0.png)


    # 第三，跨越灭绝点


    最开始的案例中，A 公司的引爆点，就是 B 公司的灭绝点。


    所谓灭绝点，就是“存量”低于一个阈值后，激活了一个“负向增强回路”，从而走向崩溃。


    遗传学上有一个“最小可存活种群”(Minimum Viable Population)的概念，意思是：在 100~1000 年内，一个物种为了有 90%~95%的存活可能，所需要的最小个体数量。


    有人经过计算机模拟，得出这个数量是：4169。 一旦小于 4169，因为代际叠加的交配难度，物种就会走向灭绝。4169，就是物种的灭绝点。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '企业中，其实也有很多这样的“灭绝点”，也许你还不知道。


    有的公司在不景气时，为了追求利润，砍掉研发人员。研发人员少于一个“阈值”，产品质量就会下降；产品质量下降，公司收入就会减少；公司收入减少，只能继续砍掉研发人员。


    一旦研发人员少于“灭绝点”，公司就会加速衰败。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_100_0.png)


    # 第四，跨越失速点


    有一次，和一家高速发展的互联网公司的人吃饭。他们问我有什么建议。我说：你们的公司很快会遭遇“失速点”，建议尽快布局线下。


    所谓失速点，就是“存量”增长到一个阈值后，激活了一个刹车式的“调节回路”。


    这家公司的产品质量确实很好，所以“新增用户”飞速增长；新增用户增长，“存量用户”扩大；存量用户扩大，降低了可开发的“潜在用户”总数。


    这家公司所在的赛道，市场规模非常有限，所以“存量用户”达到一个很高的阈值后，稀缺的潜在用户，开始像刹车一样限制着新用户增长，越来越慢，直到几乎失速。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_101_0.png)


    所有增长都会遇到“刹车式调节回路”，然后失速，只是有的赛道来得比较早。


    怎么办？通过发展线下，扩大“潜在用户”的规模，“突破边界墙”，才能重新获得速度。


    # 要点总结


    临界点的“本质”是什么？临界点的本质，是主导结构模块之间的切换。商业世界，哪里有什么“直线型成长”，你需要管理前方因为“存量”触达某个阈值，


    而必然遇到的四种“临界点”：


    +   1. 质变点，突然来临的“因果链”切换；

    2. 引爆点，一条“正向增强回路”被激活；

    3. 灭绝点，一条“负向增强回路”被激活；

    4. 失速点，一条“调节回路”被激活。


    “一直挺好，突然变了”这样的“突变问题”背后，很可能有一个临界点。


    好的，这一讲就讲到这里。下一讲，我会带你进行“解决难题”的第 5 项训练：


    找到根本解。'
