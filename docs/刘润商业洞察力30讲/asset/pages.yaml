- pgno: 145
  md: '# 20 | 预测未来：没有预测，就没有决策


    你好，欢迎收听《刘润·商业洞察力 30 讲》。


    从这一讲开始，我们进入课程的第四个模块，也是用系统动力学分析问题的第三个训练场：预测未来训练场。


    未来真的可以预测吗？不可能吧？只有巫师、算命先生，和骗子才会说自己能预测未来吧？这么说也太自大了吧？


    真的是这样吗？


    1965 年，摩尔对未来作出了一个著名的预测：


    集成电路上可容纳的元器件的数目，约每隔 24 个月便会增加一倍，性能也将提升一倍。


    翻译成普通话就是：计算机的性能每两年翻一番。


    摩尔预测对了嗎？2019 年的你，已经知道结果了。


    下面这张图，是从 1970 年到 2010 年这 40 年中，计算机性能的实际提升，和摩尔预测的对比。


    你可以看到，两条指数型增长的曲线，几乎完美匹配。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_146_0.png)


    那么，摩尔是蒙对的吗？


    如果你说，明天会下雨，真的有可能蒙对。你说后天也会下雨，有可能继续蒙对。但是，如果你说未来40天都下雨，还能“蒙”对，你一定就是雨神本人。


    那么，摩尔到底是用什么方法预测到呢？


    系统动力学。一条增强回路，和一条调节回路。


    计算机的性能每两年翻一番，听上去还不是明竟厉的样子。把“两年翻一番”再翻译得普通一点，其实就是：年均增进42%。


    1960年代，集成电路刚被发明出来，整个市场一片蓝海。只要在制作工艺的研发投入越多，单位面积上集成的电路越多，性能就越高，价格就越低，销售就越好，利润就越高。高额利润，又可以投入研发，进一步加快制作工艺进步。'
