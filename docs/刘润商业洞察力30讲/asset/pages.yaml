  md: '另外，“一价全包”而不是按课程付费，会导致优秀的作者无法脱颖而出，不能获得有足够吸引力的报酬。于是，优秀作者流失。优秀作者流失，又加剧忠实读者流失，只好再降价。一个掏心动魄的负向增强回路被激活。


