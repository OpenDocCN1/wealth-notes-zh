- pgno: 203
  md: '# 第二，不断追问


    但是，“储备模型”，不应该替代你自己建立模型的能力。如果有一天，你能优化，甚至挑战这些“储备模型”，你才真正学好了《商业洞察力》这门课程。


    如何做到？不断追问。


    哈佛大学的营销学教授西奥多·莱维特曾经说过一句著名的话：


    顾客不是想买一个 1/4 英寸的钻孔机，而是想要一个 1/4 英寸的钻孔！


    说得太有道理了。莱维特用他卓越的洞察力，在“众生畏果”的时候，建立了一条因果链：“需要一个孔”增强了“买钻孔机”的欲望。这是一条隐藏的“增强的因果链”。


    莱维特教授，点赞众人。


    但是，我们继续追问：顾客真的是想要一个 1/4 英寸的钻孔吗？


    其实不是。顾客真正想要的是，把照片挂在墙上。


    这条因果链，继续往上延伸：“需要挂照片”的因，增强了“需要一个孔”的果。


    如果你能找到这条藏得更深的因果链，就可能会突发奇想：挂照片为什么要打孔呢？用不伤墙面的强力胶，不是更好吗？用磁性墙呢？你可能会因此，找到巨大的商业机会。


    继续追问：顾客真的是想把照片挂在墙上吗？其实也不是。顾客真正想要的，是留住最美好的瞬间，时时回味。这条因果链，继续往上延伸：“留住美好的瞬间”的因，增强了“需要挂照片”的果。


    留住美好瞬间的方法很多啊，比如视频，比如能对人脸、地点、场景识别的人工智能存储。你只需要对着电视说“我想看看儿子小时候在海边的照片”，然后马上配好音乐自动播放。'
