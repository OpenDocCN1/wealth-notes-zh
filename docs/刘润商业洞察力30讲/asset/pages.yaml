- pgno: 133
  md: '普通的 колеба 高管，遇到困难时，可能会“累觉不爱”，因为他们在乎的是付出和回报的性价比；真正的合伙人，才会“爱觉不累”，因为他们热爱的是创业过程本身。我不在乎输赢，我就是喜欢比赛。


    回到最开始的案例。这位企业家犯的错误，就是把股权，这场“用风险换收益”比赛的入场券，交到了只在乎创业回报的高管手中。然后他把收益留下，风险还给了你。


    那么，如何判断一位高管，是否有创业之心，心中有汹涌的“创业过程增强回路”，可以做“合伙人”，还是只有“创业回报增强回路”，只能打工呢？


    用三个黑箱测试来筛选。把高管提拔为合伙人，或者从外部寻找到合伙人时，可以把他们放在这三个预设变化、挫折和动力模型的黑箱里，测试他们如何应对。


    # 1.变化黑箱


    英国科幻作家道格拉斯·亚当斯提出过一个科技三定律：


    +   1. 任何在我出生时已经有的科技都是稀松平常的世界本来秩序的一部分；

    2. 任何在我15~35岁之间诞生的科技都是将会改变世界的革命性产物；

    3. 任何在我35岁之后诞生的科技都是违反自然规律要遭天谴的。


    你听出来了。这是一个幽默的反讽，tooltip人们年龄越大，越不能接受变化。


    我用道格拉斯的句式，写过一个创业三定律：


    +   1. 任何在我创业前就已经有的产品，都是过时的、浑身是缺点的；

    2. 任何在我创业时做出来的产品，都是真正满足用户需求的、伟大的产品；

    3. 任何在我创业后别人做出来的产品，都只是满足夸大其词的伪需求。'
  merge: -1
  img_proc: true
- pgno: 134
  md: '这个创业三定律，反讽那些总觉得自己已经做到最好，不想改变的创业者。


    他们用“别人是错的”，来调节“变化”给自己带来的不确定性。


    那热爱创业过程的人，会怎么样呢？遭遇变化黑箱，他们会兴奋。天啊，又可以“学习”新东西了。你看他们“自费”去上了哪些课，每年花多少时间在「得到」上，手机上装了哪些
    App，订阅了哪些微信公众号号。这些，都是热爱创业过程的人，自发的“学习”欲望。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_134_0.png)


    # 2.搓折黑箱


    创业一定会面对挫折。怎么办？大部分人会抱怨。


    我在一家创业企业开会，遇到一位高管。谈到项目时，他非常愤怒地抱怨起来，供应商有问题，合作伙伴有问题，产品有问题，环境有问题，老板你无视这些问题，所以你也有问题。我几次想打断他都
    unsuccessful。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '抱怨完之后，他舒服了。为什么？因为抱怨，是把目前的挫折合理化的重要方法。你妈妈抱怨你爸爸，你噼嗤说两句“就是，就是”，她会加倍舒服。但是合伙人不行。因为抱怨只解决情绪问题，不解决现实问题。


    热爱创业过程的人、用什么面对挫折？斗志。


    面对挫折黑箱，有创业之心的人会想：“天啊，这事居然没做成？我的错，我的错，一定有我忽视的地方。这事有挑战，有意思。等我准备一下，再来一局。”


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_135_0.png)


    # 3.动力黑箱


    热爱创业过程的人、失去了创业动力怎么办？他们会坚持。


    2017 年的某一天，我发了一条朋友圈。说：


    今天特别不想去上班。但不知道向谁请假。只好去办公室。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '这条朋友圈获得了很多创业者的点赞。如果你是员工，累了就请假。但是如果你是创始人，再累，市场也不会帮你放假。有动力，就冲刺；没动力，就坚持。创业之心，就是一颗不能停的心。

    学习、斗志、坚持，是你判断“创业之心”，挑选合伙人的三个重要的黑箱测试。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_136_0.png)


    # 要点总结


    什么是创业之心？创业之心，就是对不确定的创业过程，而不是确定的创业回报的热爱之心。


    打工，是用确定的能力，换取确定的回报；创业，是用不确定的风险，对赌不确定的收益。高管不会因为拿到股份，自动变为合伙人，不要因果倒置。


    只有用“创业过程增强回路”，而不是“创业回报增强回路”激励自己，拥有创业之心的，才可以是你的合伙人。'
