- pgno: 147
  md: '是的，这是一条“性能+ → 利润+ → 研发+ → 性能+”，滚雪球一样的增强回路。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_147_0.png)


    可是，既然是滚雪球一样的指数级增长，为什么“滚的加速度”是 42%？不是 62%、82%，或者是 120%呢？


    因为还有一条调节回路。


    如果疯狂投入，技术进步的加速度，也许真的可以到年均 62%、82%，甚至 120%。但是，如此快的性能增速，可能导致市场上没有足够的大型软件，消化掉增多的算力，因此消费动力不足，大量的研发收不回成本。


    是的，这是一条“性能+ → 过剩+ → 风险+ → 性能−”，橡皮筋一样的调节回路。'
