- pgno: 148
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_148_0.png)


    # 摩尔定律的系统动力学模型


    研发投入疯狂踩下性能的油门；市场风险不断踩下性能的刹车。集成电路增长的车速，稳定在了42%，两年翻一番。


    从此以后，软件公司为2年后性能确定翻一番的硬件，设计复杂一倍的软件；硬件公司为2年后确定复杂一倍的软件，设计性能翻番的硬件。如此循环。


    有一次记者问摩尔：什么可以改变摩尔定律？


    摩尔回答：当我们想不出新的花样可以玩，人们觉得一个电子产品可以用4～5年，不再需要每年更换时，摩尔定律将会明显放缓。


    原来，这种神奇的“两年翻一番”，并不是灵光一闪的神谕，而是两个回路相互作用后的计算结果。摩尔之所以预测“年均增长42%”，只是因为太快、太慢，都不经济。


    所以，你现在觉得，未来可以预测吗？


    未来当然可以预测，也必须预测。我们所有的商业决策，都是基于对未来的预测。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '经济的走势会怎样？中美贸易战下一步会怎么发展？年轻人的消费习惯有什么变化？竞争对手明年会有什么新动作？


    就算明知不可能100%准确，甚至只有80%、50%、20%，我们都必须预测。可以说，没有预测，就没有决策。


    那么，如何预测未来？


    我们已经学会，如何把现实的商业世界，抽象为系统模型。模型的意义，不仅是解释过去，更是要预测未来，然后根据预测，作出大概率正确的决策。


    解释过去，是解决“Why”（为什么）的问题；预测未来，是解决“What...if...”（如果……就……）的问题。


    在这一模块，我要教你9个典型的“如果……就……”，9个系统动力学中的基础模型（简称：基模）。它们是：


    +   1. 公地悲剧基模：“如果”双方的收益，都是建立在抢夺有限的公共资源上，“就”会导致彼此此收益最终降低为零的悲剧；


    +   2. 成长上限基模：“如果”快速增长触发了一个抑制增长的调节回路，“就”会减缓、停顿，或者下滑；


    +   3. 成长与投资不足基模：“如果”快速增长导致研发、生产、投资等能力被忽视，“就”会更加导致减缓、停顿、下滑，甚至衰败；


    +   4. 舍本逐末基模：“如果”我们采取一个治标方案解决问题，“就”会离治本的方案越来越远；


    +   5. 饮鸩止渴基模：“如果”我们采取一个带有严重副作用的方案解决问题，“就”会出现情况越来越恶化的结果；


    +   6. 意外之敌基模：“如果”我们的行为误伤到盟友，“就”会双方对抗，然后两败俱伤；'
  merge: -1
  img_proc: true
- pgno: 150
  md: '7. 富者愈富基模：“如果”双方在一个资源有限的系统中激活了“增强回路”，“就”会导致富者愈富、穷者愈穷；


    8. 恶性竞争基模：“如果”双方都以超过对手为目标，“就”会把竞争推到谁都不期望的程度；


    9. 目标侵蚀基模：“如果”我们通过降低目标来完成难以实现的目标，“就”会导致目标越来越低，得过且过。


    这 9 个基模，9 个“如果……就……”，是变化万千的多米诺骨牌的 9 个基本形状。“如果”你推导了这个形状，“就”会看到那个结果。


    这 9 个很难记住？我知道。没关系。伍尔斯滕霍姆（E.F. Wolstenholme）把这 9 个模型，凝炼为 4 个模型组。他因此获得 2004 年国际系统动力学的最高奖：福瑞斯特奖。


    这 4 个模型组是：


    +   1. 受阻模型组（Underachievement）：包含了 ‐ 公地悲剧、成长上限，和 成长与投资不足。“如果”期望中的增强回路，遭遇意外的调节回路，“就”会增长受阻；


    +   2. 失控模型组（Out of Control）：包含了 恰本逐末、饮鸩止渴，意外之故。“如果”期望中的调节回路，遭遇意外的增强回路，“就”会情况失控；


    +   3. 通吃模型组（Relative Achievement）：包含了富者愈富。“如果”期望中的增强回路，遭遇意外的增强回路，“就”会赢家通吃；


    +   4. 镇死模型组（Relative Control）：包含了恶性竞争，和目标侵蚀。“如果”期望中的调节回路，遭遇意外的调节回路，“就”会零和博弈。


    从下一讲开始，我将用连续 4 讲，帮你建立用“如果……就……”预测未来的能力。'
