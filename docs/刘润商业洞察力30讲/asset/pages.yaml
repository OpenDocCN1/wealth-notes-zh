  md: '18 世纪中叶，一个欧洲小国，土地肥沃，城市热闹，国富民强。现在，国王想做件大事，让经济空前繁荣，立一世功名。


    做什么大事？大臣们，给了她四个建议：


    +   A） 向邻国发动战争；

    B） 请亚当·斯密来尝试他的经济理论；

    C） 引领一种喝早茶、下午茶的风俗；

    D） 给多生孩子的家庭，提供补贴。


    怎么选？


    战争可以抢夺短期财富，但让青壮年大量减少，经济可能一蹶不振；


    亚当·斯密是很有名，但另一位“经济专家”约翰·劳，刚刚“成功”摧毁了法国经济；


    茶文化太不靠谱，奢靡亡国，提这个建议的大臣，该杀。


    最后，这位睿智的国王，选择了 D：补贴生育。


    财富，是由人创造的。生育越积极，经济越繁荣。


    然后，你猜结果怎么样？


    这位国王耐心地等待了 20 年，也没有等来期待中的经济繁荣。她很苦恼。


    与此同时，一个和印度群岛有贸易的小海港，经济却高速增长。他来到这个海港视察，市长给他端上来一杯茶……


    合乎逻辑的“补贴生育”，没有效果；毫无道理的“茶文化”，却带来了经济繁荣。


    这还有天理吗？


    到底为什么？现在，我们戴上“洞察力眼镜”，透视“茶文化带来经济繁荣”这个表象下，“系统”这个黑盒子里面，有哪些“结构模块”。'
