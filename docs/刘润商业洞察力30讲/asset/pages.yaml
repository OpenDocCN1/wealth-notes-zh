  md: '那如何破解“公地悲剧”呢？把公共资源私有化，或者竞拍收费，切断无限占用公共资源这个“增强回路”。


    # 第二，成长上限基模（Limits to Success）


    这个世界 व्ह, 没有永恒的增长。你发展很快，只是因为你还小、小到没有“资格”触碰各种大规律的限制。比如市场规模的限制、人才数量的限制、管理能力的限制等等。


    2012 年底，王健林和马云打赌。十年后，电商规模如果超过 50%。他输给马云 1 个亿；反之，马云输给王健林一个亿。


    现在把你放在 2012 年底，请你预测并用 100 万跟投，你会用 100 万赌谁赢？


    马云如日中天，王健林意气风发，我建议你……谁都不要投。


    为什么？


    电商的增长回路，早晚会遭遇互联网总用户规模的调节回路，然后止步在平稳的高原。


    谁最容易上网买东西？容易接受新事物的年轻人、接触互联网更多的是大城市居民、物流系统发达地区的人。这些人的数量很大，但终究是有限的，只是对规模还小的电商，尚未形成约束。


    2015 年，整个互联网感受到，用户增长明显放缓。电商的发展，遭遇了“市场规模”所设定的成长上限。


    现在，我们戴上洞察力眼镜，把电商的困境，抽象为系统模型。'
