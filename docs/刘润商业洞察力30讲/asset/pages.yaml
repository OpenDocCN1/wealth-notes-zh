  img_proc: true
- pgno: 174
  md: '1、2、3，我们同时放下枪，1......2......3......”，然后......两人都加大了广告预算。


    这就是“恶性竞争”。我们戴上洞察力眼镜来看。恶性竞争的本质就是：你自己修复的调节回路伤到别人，从而加强了对方的调节回路，又反过来来伤害到你。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_174_0.png)


    恶性竞争，还有另外一个名字，就是我在《5分钟商学院·基础》第207课讲述的“囚徒困境”，它必将导致A、B的成本螺旋上升，最后两败俱伤。比如价格战、军备竞赛，或者是“吵着吵着就开枪了”。


    回到1971年，其实，禁止烟草业在电视、广播做广告的提案，就是烟草业自己提交的。他们谁也不会先放下枪，所以请求政府来数“1、2、3，同时放下”。然后，整个行业的利润大增。


    恶性竞争，听上去很“恶”，但在很多机构手中，却是武器。比如谷歌、百度、阿里的“竞价排名”广告，就是利用高效的“恶性竞争”模型，让你“不提价，就出局”，收取最高可能的广告费。'
  merge: -1
  img_proc: true
- pgno: 175
  md: '那怎么破解“恶性竞争”呢？让合作收益大于背叛诱惑，构建某种默契的协议，稳定的均衡。


    回顾《5分钟商学院基础》第207课。


    # 第二，目标侵蚀（Drifting Goals）


    有一次，和某位创业者聊天。聊到他新年的目标，他说：我新年的目标是，在产品上有长足的进步，销售上有巨大的提升。


    我叹了口气说：我预测，你的目标一定能实现。


    能实现，为什么要叹气呢？他不解。我说，因为你设定这个“目标”时，给自己留下了“侵蚀”的机会。


    1980年代，美国有一家突然爆红的高端电脑公司，叫做“神奇科技”（Wonder Tech），因为掌握了独特的技术，神奇科技几乎控制了“高端电脑”这一细分市场，每年的业绩都在翻番，订单远远超过他们的生产能力。


    然而，这也就导致了交货延迟。


    神奇科技的“目标”，当然是让客户最快拿到货。一开始，他们对“最快”的定义，是8周。但后来发现做不到了。神奇科技不是扩大产能，而是降低目标，把承诺交货时间调整为9周、10周。顾客投诉收货慢，他们解释：我们一直以来都保持着90%的准时交货率。但这个“90%”，是降低目标，延长承诺交货时间的结果。


    就这样，神奇科技不断“通过降低目标来实现目标”，他们甚至公开说：“我们的电脑如此优秀，顾客愿意等上14周。”然后，交货期就到了令人发指的16周。'
