- pgno: 106
  md: '普通的妈妈，骂孩子几句“教你这么多次，还是不会”，然后蹲下身子，帮孩子把鞋带系好。这位妈妈眼中看到的是“没系好”这个结果。帮孩子，是“症状解”。


    优秀的妈妈，提醒孩子鞋带散了，让他自己系，观察他系鞋带方法的问题，然后手把手地教他。这位妈妈眼中看到的是“不会系”的原因。教孩子，是“原因解”。


    顶级的妈妈，发现外公外婆每天帮孩子系鞋带。妈妈改变模型，禁止了代劳。孩子摔了几跤后，鞋带系得比妈妈还好。这位妈妈眼中看到的是“不想学”的模型。让孩子想学，是“根本解”。当然，在我一个“爸爸”眼中，我能提出的“根本解”是给孩子穿没鞋带的鞋子。


    改变模型，就是改变系统中的结构模块之间的关系，让结果自己发生。


    1999 年我们刚加入微软的时候，微软是有食堂的。很快，员工对食堂的口味厌倦了，希望改变。但是，供应商的动力不大。怎么办？


    开会？一起分析菜品口味？向隔壁 IBM 学习优秀经验？没用。因为这些最终都将提升供应商的成本。他们不会愿意。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_106_0.png)


    那怎么办？改变模型。微软行政部出台规定：


    +   1. 选 2 家供应商，一家提供午饭，另一家提供晚饭；

    2. 每 3 个月做员工调查，是喜欢午饭还是晚饭；'
