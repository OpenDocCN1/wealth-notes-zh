  md: '# 11 | 突围边界墙：为什么雀巢的收入超过 BAT 总和？


    这一讲，我们进行用模型解决难题的第二项练习：突围边界墙。


    2019 年春节，椰树椰汁火了。一贯 Word 排版风格的饮料包装上，居然学会插入图片了。大胸美女旁边配字：从小喝到大。让人不知道该不该联想。


    网友评价说：做个正经的饮料不行吗？感觉这几年，椰树牌在暴力美学的路上越走越放肆，越来越自我。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_80_0.png)


    一个明明可以高大上的品牌，却选择这样 low 的宣传，到底是为什么？


    因为椰树的增长，撞上了系统的“边界”。


    1988 年，椰树推出椰汁后，公司业绩一直迅猛增长。4 年后，椰树就从亏损企业变为中国 500 强，2014 年产值甚至高达 44 亿元。但从此之后，就在
    43 亿、40 亿、42 亿之间来回波动，止步不前，无法跨越。


    “止步不前，无法跨越”，每当听到这样的表述，我知道，这家公司多半撞上了系统的“边界”。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '什么？不只要努力，就能增长的吗？系统还有“边界”？增长还有“极限”？


    这都是给自己的无能，找的借口吧？


    当然不是。无论发展速度多快、多么势不可当的公司，最终都会撞上自己的“边界墙”。


    1867 年在瑞士成立的雀巢公司，是卖婴儿营养麦片粥的。当时瑞士 1 岁以下的婴儿死亡率高达到 20%，可服用它的麦片粥的婴儿，健康情况却非常好。


    雀巢的产品一炮而红。然后，雀巢又开发了炼乳和奶粉，也非常成功，势不可当。


    但是，1921 年，因为战后军队对罐装奶粉的需求下降，奶粉市场突然饱和。


    这导致雀巢奶粉价格下跌，库存高起。雀巢遭遇了奶粉市场规模的“刚性约束”。雀巢第一次，也是历史上唯一的一次，发生了亏损。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_81_0.png)


    怎么办？宣传奶粉能抗癌吗，然后咬牙努力卖吗？'
  merge: -1
  img_proc: true
- pgno: 82
  md: '不。雀巢没有强攻受“刚性约束”的奶粉市场，而是选择突破。它发明了“速溶咖啡”。是的，雀巢发明了速溶咖啡，绕开奶粉市场的刚性约束，找到一个全新的且巨大的“潜在用户”群，突破了“边界墙”。


    之后的雀巢，就一发不可收拾。它先后开发或者收购了美极汤料、雀巢冰爽茶、爱尔康眼科、胶囊咖啡、巴黎水、奇巧巧克力、宝路薄荷糖、欧莱雅眼霜、徐福记、妙多乐猫粮、太太乐鸡精等数百家公司。一旦增长到达刚性约束设定的“边界墙”时，雀巢就会卖掉它。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_82_0.png)


    2018 年，看似不再性感的雀巢，因为不断突破边界墙，收入高达 6185.7 亿元人民币，超过 BAT（百度、阿里、腾讯）的总和。


    什么叫“边界墙”？边界墙，用系统动力学来看，其实就是一种特殊的调节回路。一般的调节回路，像橡皮筋一样逐渐给增长限速。但是有些调节回路，就是竖在前方的钢铁南墙，一撞上去就头破血流，没有回旋余地。边界墙，就是刚性约束条件，设定的系统增长极限。'
