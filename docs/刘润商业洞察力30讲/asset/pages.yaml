- pgno: 92
  md: '# 第一，安装应对“缺乏型波动”的缓冲器


    一旦缺乏，就会给系统带来风险的流(入)量波动，叫做“缺乏型波动”。


    进行到关键阶段的项目，突然走了2个核心程序员，怎么办？这就是人才的缺乏型波动。可以稍微微招5%，用必要的“存量”，缓冲突然缺人又来不及招的风险。


    银行存款、共享单车用户押金，用户突然集体挤兑，怎么办？这是现金流的缺乏型波动。银行要有强制的存款保证金制度，共享单车公司应把至少一定比例的押金，存在第三方托管账户，缓冲波动的提现需求。


    # 第二，安装应对“过剩型波动”的缓冲器


    上游流量的洪水一样倾泻下来，给系统造成无法承受的负担。这就是“过剩型波动”。


    怎么应对“过剩型波动”？安装足够大的蓄水池。


    专门的山地车，通常都有个像弹簧一样的东西，叫“避震器”。这个避震器，就是一个“能量的蓄水池”，用物理压缩的方式，存蓄震动带来的过剩能量，然后再通过回弹，平滑释放。有了这个“蓄水池”，你就不会感觉一直在“起起落落”。


    软件公司闷下来闹死，没活干也要发工资，怎么办？


    这是人才的“过剩型波动”。可以建一个“农闲项目”，把所有不在项目上的过剩工程师，都投入这个项目，在“农闲”时，于点别的话。比如，把自己在项目中积累的代码，做成中间件，也就是那些并没有实际功用，只起连接作用'
  merge: -1
  img_proc: true
- pgno: 93
  md: '的软件。这样，就可以提高未来项目的效率。新项目来了，随时去做；一退出项目，就继续做中间件。


    这个“农闲项目”，就是软件公司过剩时间的蓄水池。


    # 要点总结


    流(入)量有时缺乏，有时过剩，导致“忙起来忙死，人手根本不够用，闲下来闲死，没干活也要发工资”这一类问题，带来系统波动，造成混乱。怎么办？


    你应该给系统安装“缓冲器”。缓冲器，是专门用来平滑流入量波动的存量。


    水库是河流的缓冲器，存款是消费的缓冲器，库存是销售的缓冲器，现金流是经营的缓冲器，人才库是项目的缓冲器。


    安装缓冲器，有两种办法。为了应对缺乏型波动，你可以在波动的上游，安装一个库存型缓冲器，比如银行的存款准备金，保证下游平稳稳定；为了应对过剩型波动，你可以在波动的上游，安装一个蓄水池型缓冲器，比如软件公司的农闲项目，保证过剩被滑吸收。


    缓冲器，是解决波动的重要工具，但是要记住：足够用就好。因为缓冲器有成本，还会降低系统响应变化的速度。


    好的，这一讲就讲到这里。下一讲，我会带你学习商业顾问解决难题的第四把刀：跨越临界点。


