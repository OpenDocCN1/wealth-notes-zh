    # 18 | 创业之心：我不在乎输赢，我就是喜欢比赛


    你好，欢迎收听《刘润·商业洞察力30讲》。

    前面三讲，我们训练了如何用商业洞察力，借助艾柯夫的社会系统，看透集体之心；借助勒温的群体动力学，看透群体之心；借助弗鲁姆的期望理论，看透个体之心。'
  merge: -1
