    # 16 | 群体压力：如何让员工说出真实的想法？


    你好，欢迎收听《刘润·商业洞察力30讲》。


    上一讲，我们向罗索·艾柯夫教授借用“社会系统”模型，看透“集体”。这一讲，我们向库尔特·勒温教授借用“群体动力学”模型，看透“群体”。和集体相比，群体是更小的一撮人，没有集体那样有组织性，而且身份构成、出现场合，都具有随机流动性。


    我们常说：三个臭皮匠，抵得上一个诸葛亮。真的是这样吗？恰恰相反。三个诸葛亮一旦组成“群体”，可能还抵不上一个臭皮匠。'
