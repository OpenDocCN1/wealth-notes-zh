    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_208_0.png)


    然后，他在“生态圈Ⅱ号”里，生态地建出了 5 个野生生物群落，2 个人工生物群落，并经过精确计算，选择了 3000 种动植物、1000 种微生物，共 4000
    个物种入住。'
