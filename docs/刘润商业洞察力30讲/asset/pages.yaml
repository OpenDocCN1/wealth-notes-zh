  md: '什么样的特征，背后是强大的“创业之心”？你可以 práv 三个黑箱去测试一下你的候选人，是不是能满足这三个标准：


    +   1. 用学习，面对遇到的变化；

    2. 用斗志，面对每天的挫折；

    3. 用坚持，面对失去的动力。


    吴军老师曾说他判断一个项目能不能投，要看给这个人安排一些脏活儿、累活儿，他能不能坦然接受，这也是一种黑箱测试吧。


    好的，这一讲就讲到这里。学习了如何看透集体之心、群体之心、个体之心、创业之心，下讲，我们来谈谈如何“改变人心”。就是从改变模型高度，去获得立竿见影的方法论，和操作指南。


