    友推荐的工具。试试“社交裂变”吧。


    这段话中有几个模型：


    +   1. 产品能量模型：产品提供势能、营销和渠道，把势能转化为动能；

    2. 渠道漏斗模型：销售=流量*转化率*客单价*复购率；

    3. 广告流量因果链：广告，增强了流量；

