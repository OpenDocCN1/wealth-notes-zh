- pgno: 164
  md: '# 第三，意外之敌基模（Accidental Adversaries）


    上世纪70年代，宝洁为了打击竞争对手，提高市场占有率，突然大规模打折促销。沒想到这一降，让盟友沃尔玛措手不及。低价带来的渠道利润骤减，让沃尔玛无以为继。


    好兄弟往我两肋插刀，沃尔玛决定“你不仁我不义”。它大规模囤积宝洁的打折商品，等恢复原价再卖。这一招，把宝洁的促销预算，都变成了沃尔玛的利润。


    真是商场上无兄弟。精彩。现在我想请你预测一下，这两兄弟，最后谁打败了对方？


    两败俱伤。因为兄弟俩上演了“意外之敌”基模。


    什么是“意外之敌”？意外之敌的本质，就是：改善自己业绩的调节回路，意外激活了一条_help_及盟友的增强回路。昔日盟友，反目成仇，最终两败俱伤。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_164_0.png)


    你觉得是宝洁更需要沃尔玛，还是沃尔玛更需要宝洁？其实谁也离不开谁。


    为了自己“赢”，而“消灭你，与你无关”，只会最后“两败俱伤”。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '这样的场景，还发生在销售，和工程师之间。销售想无条件答应用户的每一个需求，只为签单；工程师死守自己开发的每一个功能，寸步不让。你可以闭着眼睛预测：最后用户一定不满意；项目一定超预算，走向失控。


    那怎么办？


    盟友变成“意外之敌”，一定是因为一方使用了只对自己有利的方案。作为管理者，你可以让销售和工程师，各自承担对方 10%～20% 的业绩指标，你中有我，我中有你，实现利益一致。


    # 要点总结


    这一讲，我们学习了“如果”一个调节回路，遇遇一个增强回路，“就”会怎样的“失控模型组”，并练习用它预测未来。


    失控模型组里，可以用来预测未来的稀模有三个：


    +   1. 舍本逐末。它的本质是：一类根木解的调节回路，因为见效慢，遇遇一条被症状解打压的增强回路。最终，问题依旧，甚至更严重，直至崩塌；

    2. 饮鸩止渴。它的本质是：一类短期见效的调节回路，激活了一条长期恶化的增强回路。回光返照之后，灯枯油尽；

    3. 意外之敌。它的本质是：改善自己业绩的调节回路，意外激活了一条伤及盟友的增强回路。昔日盟友，反目成仇。最终两败俱伤。


    最需要学习失控模型组的，是面临艰难选择的创业者。人的天性是选最容易走的路。但是，正确的路，通常艰难；而难走的路，从不拥挤。


    好的，这一讲，我们就讲到这里。下一讲，我们学习惊心动魄的：通吃模型组。


    我留给你的思考题是：你有没有曾经做过饮鸩止渴的事情，让你今天都心有余悸？欢迎你在留言区和我互动。'
