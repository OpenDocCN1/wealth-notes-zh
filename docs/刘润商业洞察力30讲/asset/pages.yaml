  md: '我上中学的时候，英特尔的 CPU 是 286、386、486；我上大学的时候，是奔腾 1、奔腾 2、奔腾 3。现在，你很少听到英特尔宣传它的 CPU
    到“几 86”了，因为遭遇了技术的物理极限。


    每一项技术的发展，都会遭遇极限。Windows 再好，到后来也都足够好了。


    iPhone 再强大，很多现在也不愿意用“肾”换了。产品一旦到了足够好，就是技术的“刚性约束”到了。


    怎么办？是时候从奶粉，转向研究“速溶咖啡”了。


    # 要点总结


    每当你遇到“止步不前，无法跨越”的问题时，你很可能遇到了一个系统结构上的“刚性约束”。


    这些“刚性约束”，会设定你的增长极限。这就是系统的“边界墙”。因为“路径依赖”，你很自然地就会对“刚性约束”发起总攻。但是，绕行突破这堵“钢铁南墙”，也许才是正确的方法。为什么很多
    CEO 不承认“钢铁南墙”的存在？因为一路成长中遇到的都是高速成长的增强回路，和温柔以待的调节回路，没撞过墙，所以“不撞南墙不回头，不到黄河不死心”。


    那怎么办？


    首先，要识别哪些地方最容易有“边界墙”。这四个地方，需要尤其注意：


    +   1. 市场规模；

    2. 资源限制；

    3. 法规政策；

    4. 技术限制。'
