- pgno: 23
  md: '# 什么叫变量？


    所谓变量，就是系统中变化的数量。比如你的体重，忽高忽低地变化；比如公司财务，忽好忽坏地变化；比如门口顾客，忽多忽少地变化。


    所有的“变”化，都是以时间为轴的。“随时间而变”，带来了系统的复杂度、未来的不确定性，和洞察本质的难度，让你觉得什么都抓不住。


    那怎么办呢？


    用系统动力学中经典的“浴缸模型”，来理解变量，与时间之间的关系。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_23_0.png)


    在一个浴缸中，“水”这个“变量”，有两种不同的状态：


    +   1 存量（Stock），就是在一个“静止的时间点”，浴缸中积蓄了多少水；


    +   2 流量（Flow），就是在一个“动态的时间段”，有多少水流入浴缸（流入量），有多少水流出浴缸（流出量）。


    现在请问：让你能泡澡的，是浴缸里存量的水，还是水管里流量的水？


    当然是浴缸里存量的水。水管里流量的水再大，只要不能积蓄为足够的存量，你都无水可泡。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '互联网世界的“流量教信徒”，很难理解这件事。他们认为，流量当然是最重要的。但其实，流量确实是“必要”的，但只有能转化为存量的流量，才是“重要”的。


    “浴缸模型”如此简单，但足以帮你理解最开始的案例。


    为什么地铁站“流量”巨大，但亏损严重？因为每天上下班坐地铁的人，来去匆匆，甚至没时间抬头看一眼你的店面，更别说停留。在地铁站开店，相当于用啤酒瓶接雨。雨再大，啤酒瓶也很难接满；而落在啤酒瓶之外的雨，毫无价值。


    而在购物中心，顾客有的是时间。他们的目的是停留，而不是暴走，这些“停留”，不是这家店的存量，就是那家店的存量。也许不多，但“颗粒归仓”，丝毫不浪费。


    最后，这家日用百货连锁店，选择了购物中心的选址逻辑。今天，它已经在全球开了 3000 家门店，年收入超过 100 亿。


    它就是名创优品。


    厉害。我不是做百货连锁的，懂得把变量，拆解为“静态的存量”和“动态的流量”，对我有什么用呢？


    可以帮你花式拆解复杂问题，直接关注底层本质。现在，作为商业顾问的重要心法，我必须把我是如何解决，那些来咨询“存量”、“流量”难题的三个经验分享给你。


    # 第一，关注“核心存量”'
