- pgno: 64
  md: '那怎么办？我选择 recurso 和式创业。什么叫和谐式创业？它不是没日没夜地埋头干活儿，斤斤计较于性价比、回报率。而是把战略资源前置投入，让结果提前地、确定地出现。对我来说，就是为每一个果，设计三个因。然后，等待时间。


    我决定，用公众号、微博，以及后来的抖音这三个因，共同推动声誉这个飞轮；用商务咨询、企业家社群、企业家私董会这三个因，共同推动学识这个飞轮；用线下大课、5分钟商学院线上课程、图书出版这三个因，共同推动作品这个飞轮。


    到此为止，我给自己搭建的商业模型，就基本完成了。


    ![](img/6f056bbaaf951a7bda5ae38ae49529f1_64_0.png)


    然后，我开始推动飞轮。


    +   - 2013年11月，我写下了一本叫做《传统企业，互联网在踢门》的书，轻轻推动“声誉飞轮”；

    - 海尔集团战略部因此来找我，签署咨询合同，推动“学识飞轮”；

    - 然后我把尝洞洞察，写成书《互联网+：战略版》，推动“作品飞轮”；'
