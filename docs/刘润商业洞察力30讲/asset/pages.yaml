- pgno: 16
  md: '![](img/6f056bbaaf951a7bda5ae38ae49529f1_16_0.png)


    # 3）增强回路


    我们要开始问：什么是经济繁荣的关键？


    如果你想不清晰，那幺在因果链的图示上找关键节点，一定没错！


    观察因果链，你就会得出结论是：城市人口。


    城市人口增加，更多人创造财富，促进经济繁荣；经济繁荣，带来城市移民；


    城市移民，又增加城市人口，然后再创造财富。这种“因增强果，因增强因”的循环，就是“增强回路”。


    也就是因为看到这条“增强回路”中“城市人口”的关键作用，国王选择“补贴生育”。'
