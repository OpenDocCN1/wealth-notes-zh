    ## 經典案例解讀（三）


    ## 案例7


    1999年11月26日收一根大長黑，狂跌309點，聽說是中共再度舉行軍事演習，一聽到軍演大家就緊張了，害我那一天的多單認賠出場，雖然賠的不是太多，但也感覺到痛。我的策略自認為很整齊，但對於這根突如其來的長黑感覺很意外；也因為很意外，所以被氣到，盤中時血氣上衝，喪失思考能力。我自己也知道這種狀況，於是心一橫，把多單認賠賣掉。


    雖然我認為原先的操作計畫的方向是正確，可惜因為心理建設不夠，盤中情緒受到衝擊，怕自己在失去理智後會做出錯誤的行為，所以我就把眼睛一閉，狠下心腸，暫時先出場——這種作法對於心智脆弱的人而言，是非常重要的。除非已經練到不動如山的境界，否則不可以任意濫用「一動不如一靜」的保守策略，不夠成熟的人往往在保持不動之餘，成為慢半拍的落後者。這一點提供大家做為借鏡。


    這一根長黑的長度很長，好像打下了一根柱子一樣，成為了一個標竿。往後，只要不要繼續下跌，守住這根長黑經過的領域，也就是高點7955到低點7558這400點，那麼，多頭猶有可為！


    ## 案例8


    1999年12月24日，K線收三連紅，指數是收五連紅，而這個K線的三連紅，是一根比一根長，也就是實體的紅棒長度，連續成長，而且還帶著跳空上漲缺口。這些訊號都非常標準，告訴我們這邊有一個很好的上攻機會，而且幅度可能很大，原因是：從1999年11月23日開始，一直到12月21日，連續23天，大盤都在做一個收斂三角形，而這個三角形從12月21日開始，指數連漲5天，並且在12月24日那天創新高，新高是8225，後來就漲到了10000多點（詳見圖35、圖36）。


    1999年9月21日發生的大地震，死傷慘重，所以在這一年 的冬天，打開電視台大部分的股市分析師都看空，或者說，他們不敢看多，因為死了這麼多人，難道人死愈多，股市就漲愈多嗎？這種想法當然會被很多人罵，所以分析師不敢講或不敢去想，乾脆說「他們沒這個概念」。


    重大的天災人禍在歷史上不乏其例，都是值得深入學習去思考。這一點，我也是等到許多年之後才深刻明瞭。在我年輕的時代，就跟大部分的人一樣，希望知道很多的知識，也希望能夠真正去了解知識，但因為我們受到的教育是填鴨式，所以我們對於知識的認知有問題。其中一項最嚴重的就是：我們認為容易死背的條文才算是知識，而對於思考的疑問式命題，不認為那是一種知識。換句話說，我們認為制度與條文才是知識，卻不認為懷疑性的思考是學習知識的必備態度。這種錯得離譜的認知，就是台灣學生共同擁有的意識心態，可悲不可悲？


    我最早讀到的一本有關於天災人禍的書是《瘟疫與人》（Plagues And Peoples），這本書後來在2003年的SARS期間，帶給我非常重要的提示，讓我及時翻空為多，因為書裡提到一個非常奇怪卻非常重要的觀念：歷史上許多重大的瘟疫，其實都不是靠人類的努力才撲滅，而是突然消失的無影無蹤，這是現在科學無法解釋的，因為一般相信科學萬能的知識分子，絕對想不到會有這樣的事。


    因此，像是地震的自然災害，必須去了解這場災害能夠持續多久、範圍有多大、影響的層級有多高……，如此才算得上是一點簡單的科學性思考。可惜一般股民不會這樣做，也不會這樣問，分析師也不會這樣講，因為分析師的思考是跟著一般人走，於是大夥一起打混……這就是我在921大地震那年冬天所感受到的低迷氣氛，而這個低迷氣氛竟是對多頭比較有利！


