    於是我了解到，把文章寫得好可能只是一種表面的技術，重要的是背後深層的義理。古人說「文以載道」，確實是有他們的苦心，但是當我進入文藝圈之後，幾乎所有作家都在追求一種表面的華麗，而忽略了大道，久而久之，有時我也染上了那樣的習慣
    —— 寫文章時要點花招，因為那樣會讓別人覺得你很厲害！


    股市也是如此，文章寫得好不代表你是個贏家。這個道理很簡單，可是絕大多數的人都會忽略，並愛上那些善於做表面功夫的人。


    # 案例5


    1999年6月7日上漲163點，是一個跳空的中紅，而且創了好幾個月的炖高。在這之前，從4月中旬開始，大盤一直在7400點上下盤整，成為一個箱型，那個時候我是預測看空，為什麼呢？就是個人受到外界環境因素的影響，而產生一些欲望跟感受，然後不知不覺想要預先知道未來狀況，想先發制人，提早占一個對自己有利的位置……。換句話說，想跑在人家前面，而且把這種預先卡位看成是一種人生的勝利，所以我做了預測：「這個盤會掉下來」。


    恰巧那時我有一位高中同學去當營業員，他過來我家開戶，索性就聊聊這個盤。這同學一向很冷靜，做事不衝動，他告訴我：不要太看空這個盤，什麼事情預設立場或是太過'
