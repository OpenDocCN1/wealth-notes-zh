  - '[PAGE 121]


    包括了股市。


    於是，短線在他眼中就只是短線，每根K線都跟浮游一般，朝生暮死，每一根K線都是曇花一現……時間久了以後，在這種短線無常的閃爍變化中，因為缺乏永恆的真理貫穿其間，人就變得更容易失常，更容易迷糊，更容易墮落了。


    像2014年10月這種底部反攻模型或是高檔反轉模型，案例很多，只不過每個案例都需要時間養成才會成熟。然而，在養成的過程中，急躁的人視時間為大敵、視震盪為 Numerical  the
