    ## 王力群 k線操盤法


    # 案例2


    1998年7月22日，雖然收的是小紅十字線，但是下跌68點，「很明顯」跌破了自從6月11日以來的上升趨勢線。這一條上升趨勢線的畫法是：連接6月11日跟7月21日的兩個低點，也就是7073跟7949，成為一條斜斜向上的趨勢線，詳見圖25。這一條趨勢線在7月22日被跌破，留下一個跳空缺口。


