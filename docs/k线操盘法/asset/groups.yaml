    - 4-2 K線的第二層境界 243\n- 4-3 K線的第三層境界 253\n- 4-4 K線的倒數第二層境界 264\n- 4-5 請問王老師…… 271\n\
    - 〈學員分享〉一場自我發現的思辨與智慧之旅 陳志清 298\n\n# 我的K線學習之旅\n\n我最早接觸股市是念大學的時候，但是當時只知道黑黑白白的線叫做K線，除此之外，就沒什麼去想了。\n\
    \n1995年開始做短線，才算對K線有了正式的學習。我大概只花一個半月思考，並且用實戰驗證K線的道理，一個半月過去，就覺得自己「已經把K線這門學問弄懂了」，現在回想起來，那種浮誇的感覺實在非常幼稚可笑！K線這門學問博大精深，它的基本定義或許有限制，練功的層次與境界卻是沒有限制。如果你聽到有人講自己的K線很厲害，他大概是沒有把「境界」這個因素考慮進去。\n\
    \n這本書，主要是寫給稍微具備K線知識的朋友們看。至於最基本的K線常識，各大券商的網站都有相關資料，且免費提供，有需要的話可以自行查閱。如果實在不行，2016年夏天，我已經將K線基本知識的教學影片上傳到YouTube，只要輸入「王力群」三個字就可查到。那些基本知識雖然重要，但畢竟是入門，各位不妨安排兩個月時間學習，讓自己對K線有個書面文字上的初步認識。\n\
    \n跟其他股票書不一樣的地方在於：我在書中特別強調「思想」這塊領域。一般而言，技巧的形式只是表相，所謂表相就是沒有深入，有形有相的技術招式會讓人產生一種錯覺：「誤以為股市只要學會幾招江湖把式就能開始賺錢了」……最近二、三十年來，這樣的觀念不知道害死了多少投資朋友！\n\
    \n閱讀內容時，讀者要特別注意作者為什麼要這樣子去想，為什麼要花這麼多的精神與時間從不同的角度去思考？這種思考背後的熱情是對於利潤的熱愛，還是追求真理的熱情？我們要怎麼樣努力，才能夠讓這種思考熱情在股市中延續下去？……我要講的是：當我進入股市，K線是第一門誘使我在股市細節上用功的科目，這個細節可以說是短線，也可以說是在從事中長線投資時，當事人經常忽略掉的關鍵點。因此，透過這本書的引導，各位能夠進入一個全然不同的思考領域，在那裡體會股市波動的奧義。\n\
    \n此外，坊間的K線書籍都沒有提到K線的「垂直境界」。什麼是垂直境界？拿最通俗的例子來講：第一層境界就是「看山是山，看水是水」；第二層境界是「見山不是山，見水不是水」；第三層境界是「看山又是山，見水又是水」。這三層境界是人文境界，層序井然，必須一層一層練上去，\n\
    \n# 王力群 k線操盤法\n\n別好高騖遠。不過，幾乎所有股票書籍都不知道有這種層次的存在，於是很 容易陷入一團混亂，往往學了10年、20年、30年之後，還不知道K線的意義在哪裡，甚至在屢戰屢敗的盛怒之下，直接就把K線這門知識一腳踢掉，然後告訴別人「根本就沒有用」，此般例子屢見不鮮。\n\
    \n這是我第17本股市作品，從本書開始，我希望帶各位走進一個全新的領域，在財務方面可以經由股市智能的提升得到舒緩與挹注，但光是這樣，還沒有辦法取得真正的財務自由。想得到真正的自由，必須從改革我們思想的「根本錯誤」著手，同時建立起一套全新完整的思考系統，與我們的心智牢牢密切連合在一起。一旦達到如此境界的身心平衡，我們才有資格說：「真正享受到了一些幸福的自由。」\n\
    \n王力群\n\n## Part 1\n概念篇\n\n## 頂級操盤手\n眼中的K線\n\n### 1-1\n\n## K線學，\n跟你想的不一樣\n\n\
    K線是最基本的技術分析指標，說穿了，就好像是注音符號ㄅㄆㄇㄈ，或是英文字母ABCD。換句話說，懂了這些K線，只是具有小學一年級的程度而已，別說是贏家境界，即使距離成熟一點的大學新鮮人程度，也是非常遙遠。\n\
    \n基本上，K線比較偏重短線，但做短線的人，如果只是在掌握那個曇花一現，就得要小心，不要把曇花一現也搞成了浮光掠影。浮光掠影就是根本就沒有的東西，一閃而過，虛晃一招，單子下去了，還沒獲利，對我們有利的情勢就已經結束了。因此我一再強調，做短線的人必須懂中線跟長線（做長線的人不需懂短線）。\n\
    \n總之，K線是長、中、短三個戰場混合在一起作戰，各方人馬使出詭計，除了長期投資的人心機比較單純之外，短線跟中線的人馬則是各懷鬼胎、各出奇招、鬥智鬥狠、鬥力鬥勢，花招百出。除了要頭腦靈活、熟讀兵書之外，更要懂得隨機應變，因為戰場是活的，不是死的！\n\
    \n## 一根線，各人感受大不同\n\n如何解讀K線？以我手上這本經常被當成K線教科書的《強力陰陽線》為例，它的每一種解釋都偏向於：如果它講的趨勢成立，那麼，這個K線該怎樣「定義」才算是符合它講的趨勢。\n\
    \n這句話是什麼意思呢？舉例來說，書裡第一個講的反轉型態叫做「錘子」，它是在下跌趨勢中有一根收紅棒且留了很長下影線的K線。如果把下影線看成是把柄，K線的實體看起來就很像是一個鐵塊接上長柄，猶如一把鐵錘。有些地方稱它為「紅地樁」，因為那根長長的下影線像極房屋底下的基樁。\n\
    \n錘子如果放在反轉型態，通常是「由空轉多」的反轉訊號——本來是下跌，因為出現錘子，就有希望上漲，或者乾脆說它馬上就會漲。如此從空方的下跌到多方的上漲，這叫「反轉」。但是，不少教科書會偏向嚴謹的解釋，告訴你如何去估算實體的長度，以及上下影線的長度，藉此確定這根K線到底是不是錘子。如果是的話，反轉型態成立，股價即將止跌回升。\n\
    \n這種講法對不對呢？我認為只對了一些，而這些只有小學生程度而已。我的意思是，如果你把《強力陰陽線》全部的K線都消化完畢，基本上你大概算是有股市小學畢業的程度，距離實戰還差得非常遙遠。遺憾的是，它也沒有把K線\n\
    \n學習的重要結構及精神寫出來。不只這本書，所有的K線書統統都是如此。\n\n我曾在大陸網站看過關於K線的文章，他們嘗試用中國古代的《易經》、八卦，甚至連紫微斗數都搬出來，大賣其哲學背景，滿口哲學術語。你不能說他是洋洋自得，只能說他沉浸在一种自以為是的愉悅當中，把K線變成了中國的一種玄學，講得似是而非（誰叫K線又叫陰陽線）。\n\
    \n把這些情況告訴大家，無非是要提醒各位：市面看到的所有K線書籍，幾乎都停留在某一個程度，並沒有辦法再繼續發揮下去。為什麼？因為篇幅將多得驚人！\n\n##\
    \ K線只能當配角的份\n\n解讀K線最重要的原則是「多向思考」，然後再「多元思考」。\n\n我們可以順著一個方向去想。拿錘子當例子好了，如果錘子成立的話，那一根下影線就代表低檔有人在吃貨，這個人是什麼人呢？我們不知道。如果出現錘子之後，盤勢能夠順利反轉向上，我們就可以認為在這根下影線買貨的買方，應該是勝利的。但是，這個勝利者是贏家還是一~般大戶呢？不知道，因為這裡沒有跟你講要去觀察籌碼，所以也就沒有分析籌碼。\n\
    \n坦白講，這樣子是不太可以的！可是發明K線的人在有意\n\n無意之間，就已經把「籌碼分析」這個層面的知識活動給刻意排除在外了（這又是一種行為主義者所做出來的好事，只注重治標而不重視治本）。\n\
    \n因此，刻意排除籌碼分析並不能算是對的行為，而且所謂的K線，明明是短線，但當初發明K線時，竟然刻意去「模仿」中長線的單一指標的特色。單一指標的特色是，它在很多時候都能單打獨鬥，不太需要依靠其他指標做為參考。以白話文來說：你只要用這個工具就可以，其他工具就不必再用。好比有種工具叫瑞士刀，出門登山郊遊都能派上用場，因為它具有很多功能。\n\
    \n當然，你要引用更多的輔助資料來幫助單一指標，這是件好事，可是單一指標並非任何時間都需要輔助，而且它需要輔助的時間並非想像得那麼多，因此它才有資格被稱為單\n\
    \n## 圖 1 鏈子線是下影線較長，實體較小\n\n![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_13_0.png)\n\
    \n一指標。K線呢？剛好與單一指標顛倒，它不僅不是單一指標，還是一種非常標準的「非單一指標」。\n\n如果是大格局或是超長線，主流確實可以是單一指標（例如低檔大利空找買點，就這一個條件就夠了），可惜K線偏偏就不是單一指標，永遠須要別人輔助，但卻在發明時被刻意披上模仿單一指標的外表，把自己搞得非常像是一種萬能的工具。這樣一來，事情就毀了，一直毀到現在，造成大家錯誤的觀念，以為學會K線，就能解決大部分短線的問題，真是嗚呼哀哉！\n\
    \n## K線沒有任何獲利保證\n\nK線只是一種工具，跟追女朋友的各種方法一樣，方法是有方法，有方法並不代表有把握，有把握也並不代表一定會追到。道理很簡單，但換了個場景，換到股市，股民就搞不懂它的邏輯了。\n\
    \n例如送玫瑰花吧！追女朋友可以送玫瑰花，問題是，送玫瑰花能不能代表一定追得到呢？我相信絕大多數的人都會說「不一定」。既然送玫瑰花不一定追得到女朋友，那為什麼要送玫瑰花？多數人會在這個問題上愣了一下，然後說：「如果什麼都不送，就更沒指望了，起碼送玫瑰花還有希望」。OK！這個問題的癥結就在於：你做了表示有希望，儘管不一定代表會成功，但如果什麼都不做，那什麼希望都\n\
    \n沒有。\n\nK線學就是這樣誕生的。以錘子線為例，它的一根長下影線代表低檔有支撐，有希望上漲，但它沒有告訴你這個低檔的支撐到底可靠不可靠，只能自己去辨認。也就是說，它只是告訴你：有一根長下影線代表上漲希望濃厚一點而已，就這麼簡單！好比你送了玫瑰花，對方可能多感動一些，將來你追到她的希望就濃厚了些，至於最後能不能在一起白頭偕老？不得而知。為什麼呢？因為這個已經超出K線的解讀範圍了。\n\
    \n如果不送玫瑰花，改送巧克力可不可以呢？當然可以，但是送了巧克力是不是就代表一定追得到女孩子呢？當然也無法保證。那麼，請你告訴我：天底下到底有那種方法能確認我們可以追得到女朋友？我相信絕多數人會不假思索地說：天底下絕對沒有一種絕對方法讓你百分之百追到女朋友（如果有的話，請趕快告訴我，我願意花至少一千萬跟你買，然後再把它賣給天底下所有男人）。\n\
    \n現在問題來了，既然沒有一種方法能保證男人追得到女人，為什麼男孩子還要去追求女孩子呢？一旦了解天下沒有一種方法可保證我們能夠追得到女孩子，男孩子會不會感到恐慌呢？這個問題在我年輕時從來沒有認真想過，等到我差不多過了35歲過後，才猛然醒悟：天底下並沒有一種方法可以保證讓我們這些不受女孩青睞的宅男追得到理想的伴侶，\n\
    \n真的沒有……於是我感到恐慌了！！！不過，後來我為什麼沒有放棄結婚成家？因為我了解到一個長線原則：只要自己行得正、做得端、不要有太多邪念，認真在自己事業上打拚，默默這樣子做下去，就算將來討不到老婆，老天也會給我好報，搞不好在下一輩子能討到一個不錯的老婆啊……就是這樣的想法讓我活過來，人生也重新燃起希望了。\n\
    \n經過反覆不停地檢討，我認為以上這種人生的大原則並沒有錯誤，於是我繼續這樣做下去。因此，我對於目前當下遭遇到一些感情方面的挫折，我都看成是短線，而不是長線。短線本來就會有很多變化與紛爭，只要用智慧跟耐心就可以去化解。如果凡事見怪則怪，最後只會大驚小怪。\n\
    \n無論是做股票還是期貨，儘量要讓自己不要大驚小怪，因為股票市場的變化實在太多、太詭異，如果凡事都感到奇怪，表示我們的知識低落，智慧單薄，不能夠接受萬事萬物的變化。如果不能夠接受變化，心裡必然出生抗拒，此一抗拒勢必妨害我們的知識運作，更進一步妨害智慧成長，害處非常多。\n\
    \n## 充滿不確定的世界\n\n我發現，學習K線的人都有個錯誤的觀念，總認為一種K線就只有一種定義。拿錘子來講，當我們把它放在反轉型態時，多數人會認為，錘子的反轉就是止跌回升（本來是下跌\n\
    \n的，後來變成上漲的）。這種觀念就是定於一尊，標準填鴨式教育的產物。\n\n怎麼說？從正面解讀來講，錘子的下影線就是有實力的人大力買進，從反方來講，這根下影線可能只是盤中搶反彈的人，甚至只是回補的空單而已。「而已」的意思是「沒什麼大不了的」，它只是一個極短線的曇花一現\
    \ —— 過了今天的收盤，這股反彈的力量就沒有了。於是，錘子出現之後，它の下影線反而代表一種「多方勢力的反撲，但是很快又夭折了」，因此，錘子出現後盤勢又歸於下跌。\n\
    \n從以上的說明，我們得到兩種不同的觀感：錘子的下影線可能代表實力派的多方確實有做買進；錘子的下影線也可能代表買方非常虛弱，只是賺了一個短線就跑光，後繼無力、繼續下跌。就好比我送女孩子玫瑰花，可能會打動她的芳心，因為她喜歡玫瑰花；可是也可能讓我暴露出短處，因為我只買得起玫瑰花，買不起鑽戒，反而被對方看破手腳，知道我是個窮光蛋，只會送花，如此一來，送花反而得到反效果。\n\
    \n在生活中，處處都充滿了這種不確定，必須經過一番分析之後，才知道下一步該怎麼做。例如我去買一雙皮鞋，要在什麼時候穿呢？如果今天是下雨天，要不要穿皮鞋？如果我去的是奧斯卡頒獎典禮，那穿這雙價值只有四、五千塊的皮鞋，是不是顯得不夠隆重？我的這些懷疑，其實都可以成\n\
    \n立、都是有理由的，問題是，我買的那雙沒有明確目的的皮鞋，我是要幹什麼呢？\n\n相信絕多數讀者會覺得我的這些憂慮是多餘，因為買了皮鞋之後，什麼時候要穿這雙皮鞋，到時候就會知道了！請各位記住這一句話：「到時候就會知道了！」到時候為什麼就會知道？因為我們到了那時候會經過一番分析，例如看今天有沒有下雨，雨下得大不大，看出席的場合是否要更正式的服裝……經過層層考慮後，就會決定要穿哪雙鞋子才配合得了身分及場合。這一番分析的過程，跟我們在股市中分析的過程是一樣的！\n\
    \n鞋盒若有記載該皮鞋的使用時機及方法，相信各位會看看就算了，不會當真，因為到時候再講吧！如同遇到均線反壓的力量太強，那麼，錘子所代表的反轉向上的力量就會夭折……諸如此類的道理，比比皆是。\n\
    \n記住：我們的K線世界是一個變化的世界，而不是死板板的世界。\n\n## 學習看正反兩面的意義\n\n如果把錘子線的反轉型態顛倒過來，又會成為什麼樣子？就變成了「吊人線」。吊人線就是在上漲的過程中，出現一根小紅線，這根小紅線下面有一根很長的下影線。當吊人出現時，我們就會懷疑盤勢即將反轉，本來是向上的趨勢，因\n\
    \n為吊人線出現了一根長下影線，所以我們合理認為，它要下跌了。\n\n但反過來講，上漲中一根長下影線，並非代表拉高出貨。所謂的拉高出貨，是在這一根線中，本來是要殺成長黑的，因為有某種勢力的拉抬，結果到了收盤的時候，只留下了一根長下影線。而這根長下影線，其目的並不是在真實的拉抬，只是嘗試暫時把股價維持在高檔以方便他們繼續出貨，於是這根下影線就變成多頭在盤中出貨的一個罪證。至於他為什麼要拉上來，只是想賣到更好的價錢，或者是提振士氣，以掩眾人耳目，造成股價跌不下來的假象，讓大家誤以為在高檔有上影線代表高檔有支撐，其實是一場誤會。這個盤中的拉抬，是他們用盡最後力氣故意拉上去，為了出貨而已，並不是在進貨。以上所講的，是吊人線某一種看法，而\n\
    \n## 圖 2 鏟子線若發生在上漲頂端，不論紅黑都稱吊人線\n\n![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_19_0.png)\n\
    \n這種看法是負面的。\n\n不過，我在這裡又要提醒各位了，K線既然是不確定，那麼它一定有另外反向的解讀，就好像我送玫瑰花一樣，必有一個反向的解讀，那就是我小氣買不起昂貴的禮物，只好買玫瑰花。\n\
    \n任何一件事情都有其負面解讀；任何一個基本知識之所以為基本，就是如果它進了階，就會跳出來另外一種解讀的方式，有時候這種解讀是跟原來的言論完全相反。在此，上漲過程中出現了長下影線，可能是多方在尾盤發現今天要收黑棒了，既然收了黑棒，某些股票可能會出現低點，於是他們就真的大力買進。他們只不過就是奉行一種原則，叫做多頭市場逢拉回就是買點，於是那天本來要收黑的，結果沒有收成，留下了一根長長的下影線，代表著：未來的趨勢還是繼續上漲。這就跟原來看見吊人線而直接看空的結果相反。這兩種態度，一是正面的角度，另一則是反向思考。\n\
    \n## 搭配型態學和平均線才厲害\n\n礙於篇幅，在此無法詳述每一種基本K線，那恐怕要增加將近三百頁，出版社不會允許的。\n\n基本K線，就好像一支手錶或一條領帶，並不能夠顯現出一個人穿著的品味，還需要與其他衣著搭配，像是上衣、腰帶、褲子、鞋子、公事包，乃至於髮型、眼鏡，還有皮夾\n\
    \n……才能夠比較展現出一個人的品味。即使觀察到這些以後，我們還不能夠確定這個人的身分背景，得進一步參觀他的辦公室長什麼樣子，然後再去看他的家裡長怎麼樣子、他的臥室長什麼樣子、他喜歡的人長什麼樣子……林林總總全部加起來，有了大致的輪廓之後，才可以講：我們開始了解這個人了。\n\
    \n基本上，K線只是短線的一種記錄符號。至於它的整體趨勢，不論是長線、中線或是短線，都有賴於與其他工具做搭配，例如型態學、平均線、成交量等。總之，在做短線的時候，不能夠像做中線或長線那樣只把關愛放在一個單一指標上面，這是不行的。做短線時，必須四大工具（K線、型態學、平均線、成交量）一起上，四方面的知識融為一體，靈活運用，才能够解決問題。\n\
    \n以錘子線為例，如果我們不能夠確定這根錘子線的買方到底在想什麼，此時，就要注意錘子線附近有沒有重要的平均線，如果平均線在錘子線下面，而一根長下影線剛好又抵住下方的那一根平均線，我們就有比較多的理由相信錘子線的下影線在平均線的地方得到了支撐；如果倒過來，平均線是在錘子線的上方有一段距離，那麼我們就要小心，這根錘子線只是小小的反彈去測試上面的那一根重要的壓力線而已，而那根壓力線的勢力可能會很大，壓制住錘子線的反彈勢力。尤有甚者，錘子線的買方恐怕就是在看到上面那一根\n"
  merge: -1
- raw:
  - '[PAGE 22]


    # 王力群 k線操盤法


    均線沒有希望躍過了，才會在錘子線發生當天的盤中，留下 一根長長的下影線，意思就是，它在盤中的低點往上拉，拉 成一根長的下影線，在製造下影線的過程當中，股價從低點
    拉到相對當天的高點，在這段過程，買方就把手中的多單出 掉，讓給盤中那些回補的空單，或是搶短多的多單。如此的 反彈，可能就會提早夭折，或者只進行一天就失敗了。


    養成觀察平均線的習慣之後，緊接著就是型態學。以一根 曰K線為例，先去觀察它附近有沒有重要的中長期平均線經 過，接著再觀察它左邊，也就是在過往的歷史K線中，有沒
    有什麼地方被套牢，如果有地方被套牢，那就形成了所謂的 「壓力線」。於是，這根錘子線如果它可以反彈起來的話， 碰到壓力線也會產生挫折。同樣道理，我們把情勢反過來，
    如果在過往的歷史當中，某個歷史性的股價附近有個所謂 「底部的支撐」，那麼，錘子線發生的地方只要不要破當時 那個底部的低點，就會形成型態學的「W底」。W的意思是
    兩個底部，且右邊的低點比左邊的低點要高一點，就沒有破 底。既然沒有破底，右邊的低檔股價得到左邊低檔股價的支 援，這兩隻腳於是形成一個底部，也就有機會上漲了。以上
    是從一根K線觀察它左邊的歷史型態，看看以往的型態是否 能提供它支撐，或是以往的型態有沒有所謂的壓力線構成它 日後上漲的威脅潛伏。


    有一派技術分析的人士認為，應該另外尋找或發明新的'
  - '[PAGE 23]


    技術指標來做預測或操作，或是把現有的技術分析中某幾項傳統工具加以利用，就能夠得到更好的效果。這些人覺得更好、更進步的技術方法，已經藏在現有的古老技術工具中。不過，這些古老的工具並不包含一般認為比較難以解讀的平均線與型態學，而是某種更便利、更直接的技術指標。對於這樣的看法，我個人表示不贊成。


    我的練功方式是：先了解K線，再了解型態學，然後是平均線。因為不論是預測還是操作，這三種功力的混合使用，也就是融會貫通三者之後的綜合能力是很重要的 —— 本書正是為了這個信念而寫。'
  - '[PAGE 24]


    # 1-2


    # 碰到問題，

    贏家都這樣分析


    所謂「分析」，應該是科學式思考的一種。


    一個東西，可能不是外表看見的那樣，裡頭可能藏有其他東西，我們把它做分解，打開來看，就能看到藏在裡面的東西。這種工作表面看起來好像是破壞，其實是為了突破表相、深入真相。


    如果不把一個觀念分解掉，我們就無法發現它的真相。好比一塊蛋糕掉在地上，過了很久的時間，看來還是一塊蛋糕，但如果拿到顯微鏡底下觀察，就會發現很多細菌。顯微鏡就是一種分析工具，在它的觀察下，能看見很小的東西，而這些本來是肉眼看不到的。


    同樣道理，K線本身只是價格的紀錄而已，所以分析K線的正確說法應該是「分析價格」。如果操作者執著在K線的定義，就無法進入分析的領域。例如，一支股票價格200元，一般操作者會執著在「200元是貴還是便宜？」這在一般人的思想中，一定有個公定標準，依照這個公定的標準尺'
  - '[PAGE 25]


    度，即能很快知道200元是貴還是便宜……這就是執著在定義上面。


    「200元是貴還是便宜？」這個問題需要經過分析，不是一下子就能得到結論。進行分析時，首先要做的工作是「破壞成見」：先把自己心中原來對於價格先入為主的觀念拿掉，才有辦法繼續分析下去。至於如何思考分析？以下舉五個例子說明：


    # 案例一 上影線出現時……


    上影線的正方思考是：可能中線跟長線是看好的，於是中長線的買家在盤中買了較多的貨，把價格拉了上去，價格高了以後，短線出現比較大的價差利潤，因此短線的操作者率先獲利了結。這一賣，拉高的價格又掉了下來，留下一根上影線。但是這個部位是落入中長線的買家手上，將來還是會繼續上漲。


    上影線的反方思考是：贏家對於未來的局勢不看好了，於是盤中拉高出貨，把部位倒給實力不太好的人或是短線的買家，賣完之後，主力那一方就不再拉抬，於是行情可能會掉下去。


    對於多頭而言，正方思考是順向思考，反方思考是逆向思考；對於空頭而言，反方思考是順向思考，正方思考是逆向思考。'
  - '[PAGE 26]


    不論是作多還是作空，在思考K線的時候，先做某一方向的思考，然後再倒過來想，挑戰自己原先的思考，懷疑自己原先可能想的是錯的，這就是著名的「逆向思考法」。思考時，也就是處在分析的過程中，不是做結論，所以沒有對錯可言。對跟錯，是要等到做結論才出來。如果在思考中每個步驟都在問對或錯，那就是落入成見的陷阱。注意：


    思考的過程中，主角是邏輯的推動。邏輯的推動只有合理或不合理，不一定會有答案。沒有答案，也就暫時沒有對跟錯的分別。


    舉例來講，張三的老婆懷孕了，可能會生男的或是生女的。生男或生女，就是推理；至於到底是男是女，那是答案，不是推理，得等到懷胎十月呱呱落地之後才知道。對於懷孕的分析，合理的推理就是：「張太太會生一個男孩或生一個女孩」，而不是「張太太一定會生一個男孩」或是「張太太一定會生一個女孩」。

    現實生活中，我們看到張太太懷孕了，然後去問老張：「恭喜啊，是男還是女啊？」老張說：「不知道咧，胎兒還不到兩個月大，現在還檢查不出來」。此時我們絕對不會罵老張是笨蛋，竟然連胎兒是男是女都不知道。因為我們知道，超音波檢查胎兒性別要等3個月。


    反觀股市，絕大多數的K線操作者無法接受上面這種問答，只會認為老張是笨蛋，竟然還要等到3個月以後才知道'
  - '[PAGE 27]


    結果。他們總覺得「結果」是在懷孕的那一刻已經決定，怎麼可能不知道呢？同樣道理，他們以為看到一根K線後該作多還是作空，在K線誕生的那刻起就已注定，怎麼可能不知道呢？


    超音波已經算是進步的科技，卻還是要等3個月後才知道結果，換句話說，即使工具再犀利，也要「等一段時間」才能找出答案。因此，我們必須經過一段思考的時間，才能大概知道，看到這根K線後該作多還是作空。


    一般的操作者，並不了解K線的解讀需要思考的過程，只一心一意尋找定義。如同某個女明星準備出席金馬獎典禮，其他女明星都在苦惱該穿什麼樣的晚禮服出席盛會，她卻覺得「只要是禮服」就行，至於禮服是什麼花樣、什麼款式、什麼牌子統統不重要……你看過這種女明星嗎？應該沒有。但在股市中存著這樣思考的人一大堆！


    正方思考與反方思考，只是教你思考K線的起步。萬丈高樓平地起，萬事起頭難，好的開始是成功的一半。一步一步來，不要躁進，才是上策。


    # 案例三 下影線出現時……


    下影線的正方思考是：下影線代表低檔有人進貨，而這些進貨的人比較有智慧或是實力比較堅強的，於是他們的智慧結合財力就能讓盤勢止跌回升。因此，這根下影線代表的是'
  - '[PAGE 28]


    比較堅強且持久的買家，不太像是做短線。有時候我們會把下影線叫做「地樁」，如同樓房的地基打了長長的基樁，上面才能蓋更高的大樓，漲勢會比較確實。


    下影線的反方思考是：可能有人認為目前趨勢將要跌下去，而這些人是比較有智慧的，或是實力比較堅強的，他看得可能比較準確，因此在盤中倒貨，把價格打了下去。此時，另一方則是在盤中下跌後撿便宜買進，而這個動作可能在短線上造成盤中急拉，拉高了以後，那些有智慧的人也不動聲色，於是留下一根下影線。過了以後，中長期的主流買盤不再進場，買氣衰減，最後就真的跌了下去。


    不論是正方思考或是反方思考，只要有思考到就好。先正後反或是先反後正都無所謂，重要的是：正反兩種情況都要考慮，以免自己想錯的時候不知所措。


    # 案例三 實體紅棒出現時……


    實體紅棒的正方思考是：代表買氣強勁，猶如火箭升空，準備往上衝，未來看好。


    實體紅棒的反方思考是：買氣雖然強勁，但可能只是短線的買家在買而已，中長線的買盤可能沒有進場。因此，當天雖然拉出一根實體紅棒，但是力氣用完了，明天可能精疲力盡，這根紅棒就稱「竭盡紅棒」（俗稱「一日行情」）。'
  - '[PAGE 29]


    # 案例四 實體黑棒出現時……


    實體黑棒的正方思考是：代表賣壓沉重，猶如土石流，準備向下沉淪，未來看壞。


    實體黑棒的反方思考是：賣壓雖然沉重，但可能只是暫時的而已，或許只是做短線的人在搞鬼，故意製造悲觀的氣氛，中長線的部位並沒有賣出。所以當天賣完了以後，可能明天就不會再賣了，此時，雨過天晴、煙消雲散，盤勢重新恢復樂觀，恢復上漲。這根黑棒就稱「竭盡賣壓」，只痛苦一天，熬過去就沒事了。


    # 案例五 小黑星出現時……


    如果當天K線的實體長度很小，我們就可以按照自己的意思把它視為「小星星」。星星的意思是K線實體長度很小。實體愈小，表示多空爭鬥不激烈，收盤跟開盤的價差不大，當天行情震盪幅度小，甚至可以說乏味。基本上這種行情有兩種解釋：第一種是多空雙方正在等待機會決一死戰，但是目前沒有合適的機會或是雙方都還沒準備好，兩方都僵持在那裡，屬於暴風雨前的寧靜。


    另一種想法是：雙方已經打完了。有時是經過一場規模較大的生死決鬥，有時是在盤勢進行中邊走邊打（至於是哪一種，操作者要憑自己的智慧去判斷分析），雖然仗已經打完'
  - '[PAGE 30]


    了，其中有一方貨還沒有出乾淨（不論是多頭部位或是空頭部位）。因此，每天的買賣生意變少了，交易清淡，就變成了小紅或小黑，沒有什麼大行情，只是在拖延時間而已。至於將來要怎麼走？雙方還拿不出一個把握，大家只好騎驢看唱本走著瞧（唱本是指客觀環境的變動）。


    # 投資別想簡單了，換個角度看事情


    一般人在日常生活中，是不太習慣這種正反兩方思考法，只能順從單一方向思考。提供以上兩種角度的想法，不是去死看死背，而是希望讀者多多學習從不同的角度去思考，並且嘗試從收集到的零星證據裡，整理出一個完整合理的故事。如果給你一堆線索、一堆證據，結果還拼湊不出一個像樣的故事（我講的是合理的邏輯推理，而不是天馬行空的胡亂瞎拼），那麼，當事人的思考能力就有待加強了。


    有些K線操作者當初能夠進入短線領域，或許真的是比別人的天賦好一些，並對自己的思考能力有點自信，才跑過來操作K線。這些有天賦的朋友，在股市中因受各種環境的影響，可能會變得更具有自信，但未來若發展得不好，就會失控，變成一種長線的自大狂。


    在這幾年的股市生涯，我看過許多對K線稍有才華的朋友最後下場都不太好，盲點是：他們總認為自己比一般人厲害'
  - '[PAGE 31]


    很多，既然如此，就應該是贏家了。殊不知，大部分的人對於K線的天賦，其實是負數，就算你比對方厲害，在真正的贏家眼中只不過是比平常人「高出一公分」而已。可惜的是，不少人很難破除這種自信，最後就成為執著；有了執著，思想就很容易結塊，思路就堵塞了。


    這篇文章是寫給態度謙虛的朋友看的，鼓勵他們可以從事多方面的思考。畢竟，在人生的旅途 CKD，考慮周全一些，是大有好處的。


    # 正與反，都是正確的思考


    每一件事情，都有正反兩個角度的性質。例如：

    一個人沒錢很苦，但他可以選擇安貧樂道，不必為了錢太多而苦惱。不過，一個人若是錢太多，親人為了爭奪財產打來打去，每天還有騙子上門獻策，也是很苦、很煩惱。


    在股市中一次買進，有它的優點跟缺點；分批買進，也有它的優點跟缺點。


    做長線，有它的優點跟缺點；做短線，也有它的優點跟缺點。並不是說做短線就不對，只要做得有道理，一條線就成立；如果做得沒有道理，不論是任何一條線，都不成立。


    房子很大，有它的優點跟缺點，優點是廣闊，缺點是散財；房子很小，也有它的優點跟缺點，優點是聚氣，缺點是狹隘。'
  - '[PAGE 32]


    諸如此類的例子，多到舉不完。這些都充滿在我們的日常生活角落，只要留心，就一定可以發現；如果不留心，你就會走入填鴨式教育的陷阱，誤以為天底下每一件事情都有它的最佳方案。擁有最佳方案，可能就擁有它最大的弱點或缺點——這個道理，是中國哲學家老子告訴我們的。


    每根K線，基本上都有兩種成分所組成，一種是「多」，另一種是「空」，多空成分不一樣。記住：多空成分是依照戰場上面臨到的戰況變化而有所調整，它是忽大忽小、變化不定，所以才需要我們這些幕僚軍師做分析；如果光查手冊就查出來它的定義是什麼，然後直接歸類，那還要我們這些分析師幹什麼呢？


    天下萬物各有其優缺點，K線也不例外，每根K線都有其多方觀點及空方觀點，或者說它具有多方的性質及空方的性質。如果操作者本人的思考無法逆向，也就是沒有辦法換成其他角度思考，那麼，他的思考就會變得狹隘，無法應付千變萬化的世界，當然也就沒有辦法應付股市了。


    任何一種K線類型都有其多方解讀及空方解讀，只是成分的不同而已！有時我們可以憑直覺去感覺其中的成分多還是少，然後直接做出下多單還是下空單的決定。但是多數時我們都無法判斷，正如很多時候，並無法判斷只送一朵玫瑰花能否打動女朋友芳心，勢必要搭配其他動作，如請她出去玩、寫情書、唱情歌、做一件令她非常感動的大事情……這'
  - '[PAGE 33]


    些就是所謂的多元化手段（在股票市場叫做多元化指標或方法），目的是打動對方的心。我所主張的多元化手段前面已經講過了，就是平均線、型態學以及成交量。只有在多元化的觀點圍繞下，才能觀察到整個市場的大格局，我們的系統才可以比較完整。


    如果只用K線而不用其他的工具，那麼我們遺漏的東西一定非常多！


    一般人做K線為什麼常常失敗？就是因為他只拿一把超級小刀就跑到深山裡面打獵。超級小刀只能夠解決一些非常幼小的生物，碰到中型及大型的毒蛇猛獸，超級小刀就無法應付了！超級小刀就是短線的工具，而在股票市場中，K線是短線的工具，必須要搭配其他工具才能夠讓K線的功能比較客觀、真實地發揮出來。'
  - '[PAGE 34]


    # 1-3


    # 關鍵不在死技術，在於活的心


    我曾經花了一個星期，學會如何手工繪製K線而不依賴電腦，也順便了解基本K線類型，例如：陰線、陽線、大陽線、大陰線……後來花了至少七年，才比較熟練運用K線及掌握各種變化。又花了超過十年時間，才有辦法把K線跟其他操盤手法「比較地」融合在一起，並運用這些技術操盤賺錢。


    在學習K線的過程中，以及我對「學習」這件事情的理解，都沒有遭遇太大的問題。等到我開始銷售股市知識的前幾年，也沒有同學有任何學習障礙。直到近幾年，尤其過了2013年才赫然發現，一般人學習K線，不論是在態度或方法都有很大的落差，令我非常驚訝！


    # 大家都想找到完美的運算公式


    這些人對於K線的錯誤認知，究竟在哪裡？'
  - '[PAGE 35]


    K線，是一門偏重於人文的知識，而不是現代科技的知識，如果強行做分類，K線應該放在人文學科。可不可以硬放在理工學科？我的答案是：絕對可以，但不適合現在，而是在遙遠的未來。


    為什麼？因為每一種K線類型都是隨著戰場上的更替而變化，並非坐在家裡用頭腦就能嚴格定義出來。問題是，現代科學講究的是定義，如果定義不出來，就沒有辦法做定量分析；如果沒有辦法做定量分析，就無法進行嚴格的實驗；實驗如果出不來，現代科學也建立不起來了。奇怪的是，很多股市朋友都是以理工科的態度切入，他們會要求用一種很嚴謹的態度去看待K線。例如每條平均線的繪製都有其數學式的計算方法，100日平均線就是把最近100天的價格加起來，然後除以100，就是今天100日平均線所在的位置。


    # 無法一個蘿蔔一個坑


    相同邏輯，有人問我：三白兵的定義是什麼？我會說：三白兵就是連續三根紅色的K線。再圓滿一點的說法是：如果第三根K線比前面兩根明顯短很多，就叫「大敵當前」；如果第三根K線最短，第二根K線次之，第一根K線反而是最長，那我們會稱之為「步步為營」。所以，即使是一個最簡單的基本K線，至少有三種變化。


    剛才的三白兵是用「長度」來區分大敵當前及步步為營。'
  - '[PAGE 36]


    # 除了長度以外，K線的定義還受到什麼影響？我認為，還會受到「每個人認知」的影響。


    這句話是什麼意思？每個人對於K線的認知不同，了解的深淺不同，所以形成各式各樣的K線名稱與定義。即使是同一個操作者，也不太可能把自己所使用的K線名稱都做了嚴格的定義，因為嚴格的定義牽扯到嚴格的理論，大部分的實戰派操盤手對理論其實並不在行。跟打籃球一樣，我們無法嚴格定義每個籃球動作，更無法嚴格定義比賽進行時每種可


    # 圖 3 三白兵：三條白長陽線一次由左下方往右上方排列


    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_36_0.png)'
  - '[PAGE 37]


    能發生的狀況。千變萬化的臨場狀況，會決定我們使用K線的時機，以及影響我們操作時的決定，這些都是「臨時發生」，並非事先安排好的。


    學習K線的人最嚴重的錯誤認知之一，就是認為「K線學」跟他們過去學習理工科的知識一樣，都是已經在細節部分安排好，也因為在細節部分交待了非常清楚，這門知識才夠資格成為科學。也因為在細節部分定義得如此清晰，我們在操作進行時，才握有更強烈的證據去操作。


    # 圖 4 步步為營：上升趨勢中，K線實體愈來愈小


    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_37_0.png)'
  - '[PAGE 38]


    以上這番論述，是標準理工科朋友的思考模式。但是，我很遺憾地告訴各位：你們所認為的，在目前股市實戰中並不是常常發生！如同我們的人生，雖然理論部分可以定得很嚴格、很精密，但我們每個人的use人生基本上都是千變萬化，尤其是在動亂中更會遭遇更多、更詭異，更多無法用現代科學解釋的狀況及人生難題。


    儘管人類的哲學思考已經很發達、人類所發展的科技文明已經很進步，還是無法解決我們千變萬化的人生中，許許多多難以應付與難以回答的問題，如宗教的衝突、家庭紛爭的困擾、男女之間感情溝通的挫折、面對國家政府統治無力所感到的失望……這些令我們感到無力的情況，並不在我們嚴格定義的天堂裡面。


    # 沒有公式可套！「準備」才是王道


    由於理工科的朋友從國中就開始接受制式化訓練，凡事都以精確的計算為要求，目的在求得更精確的答案，而不是像問答題能讓你高談闊論。長久接受這種教育，會有一種嚴重的負面作用，誤以為天地萬物萬事，甚至人際關係都能用數學方式去做精密的計算。


    姑且不論這樣的思考，究竟是不是宇宙真理的實相，若把範圍縮小到股市，依我個人淺薄的經驗來看，人類的智能目前還沒有辦法用數學掌控股票市場全局，充其量只能够在一'
  - '[PAGE 39]


    個戰場上獲勝，可是那個戰場是有限的，不是全面性，更不是永恆！換句話說，理論上我們可以接受精密的數學控制整個宇宙，但在人類的有限能力下，對於數學的終極真理也不盡了解，當然就沒辦法談到用數學公式來統治股市。


    操盤者想知道K線的精確定義，如同嘗試用數學公式統治股市一樣 —— 在科學萬能或是數學萬能的概念下，我們的思想及行為都在一個可以嚴格控制掌握的法度之中。這種法度，有時候叫做制度，有時候叫做法則，有時候叫做公式，有時候叫做法律，有時候叫做道理，有時候叫做規則……各種事物因為人類理解的程度不同，而做出各種不同的文字規範。它具有約束人類的行為思想的功能，也具有導正人類行為思想的功能，可說是一體兩面，利弊互見。


    股民用理工科的態度，嚴格要求股市中每一門知識的嚴格定義，本來是件好事，可惜，在人類智能尚無法突破瓶頸的現在，這種想法會害了大家。一般人非常希望自己在股市中的每個動作都因為有嚴格定義的根據，也就是有確實的理由，最好是一種精密的數學程式，如此一來，接下去的動作及最後結果，都能用連環推理的方式計算出來。


    這種連環推理，在人文思考方面是一回事，用數字計算又是另外一回事，現在的股民剛好夾在其中，他們並不希望太複雜的數學計算，只希望有個簡單的流程，那就是「看到某個精密定義的K線類型，如果屬於多方類型的K線，就買'
  - '[PAGE 40]


    進；如果屬於空方類型的K線，就賣出或是放空」。這樣的思想就是我常講的「中了牛頓經典力學的毒」，把複雜的世界給簡單化了（亦即沒有道理的刻意簡化）。


    股市實戰猶如打籃球，你永遠不知道最後的分數是多少，也不知道在這場比賽之中，你的實力能不能發揮；就算是發揮了，能夠發揮到幾成，自己也不知道。我們能夠做的，就是盡量把自己的體能狀況調整到最好，如此而已。萬一受到場邊觀眾的吹噓聲干擾呢？此時，就要堅定自己的心理素質。


    股市實戰就是這樣，短線跟中線的人在場上的時間比較多，像是職業選手，而K線正是我們這些職業選手常用的工具，但有太多人並不認為我們是在打一場籃球賽，而是在進行精密的計算，就像寫數學考卷或是化學考卷那樣。你說，這種觀念對嗎？


    # 用人文思考解讀 K 線的方法


    近幾年來，最受歡迎的股票課程大概就屬K線學，其次是型態學，再其次是平均線。我們常常聽到坊間的券商或私人單位開設「K線班」，卻鮮少看到型態班或是均線班，可見股民相當熱中學習K線。


    儘管K線成為一門國民學，但它並沒有讓股民變得更聰明，反而讓大家的錯誤知識變得更多，就跟錯誤的K線書傳'
  md: '

    # 王力群 k線操盤法


    均線沒有希望躍過了，才會在錘子線發生當天的盤中，留下 一根長長的下影線，意思就是，它在盤中的低點往上拉，拉 成一根長的下影線，在製造下影線的過程當中，股價從低點
    拉到相對當天的高點，在這段過程，買方就把手中的多單出 掉，讓給盤中那些回補的空單，或是搶短多的多單。如此的 反彈，可能就會提早夭折，或者只進行一天就失敗了。


    養成觀察平均線的習慣之後，緊接著就是型態學。以一根 日K線為例，先去觀察它附近有沒有重要的中長期平均線經 過，接著再觀察它左邊，也就是在過往的歷史K線中，有沒
    有什麼地方被套牢，如果有地方被套牢，那就形成了所謂的 「壓力線」。於是，這根錘子線如果它可以反彈起來的話， 碰到壓力線也會產生挫折。同樣道理，我們把情勢反過來，
    如果在過往的歷史當中，某個歷史性的股價附近有個所謂 「底部的支撐」，那麼，錘子線發生的地方只要不要破當時 那個底部的低點，就會形成型態學的「W底」。W的意思是
    兩個底部，且右邊的低點比左邊的低點要高一點，就沒有破 底。既然沒有破底，右邊的低檔股價得到左邊低檔股價的支 援，這兩隻腳於是形成一個底部，也就有機會上漲了。以上
    是從一根K線觀察它左邊的歷史型態，看看以往的型態是否 能提供它支撐，或是以往的型態有沒有所謂的壓力線構成它 日後上漲的威脅潛伏。


    有一派技術分析的人士認為，應該另外尋找或發明新的


    技術指標來做預測或操作，或是把現有的技術分析中某幾項傳統工具加以利用，就能夠得到更好的效果。這些人覺得更好、更進步的技術方法，已經藏在現有的古老技術工具中。不過，這些古老的工具並不包含一般認為比較難以解讀的平均線與型態學，而是某種更便利、更直接的技術指標。對於這樣的看法，我個人表示不贊成。


    我的練功方式是：先了解K線，再了解型態學，然後是平均線。因為不論是預測還是操作，這三種功力的混合使用，也就是融會貫通三者之後的綜合能力是很重要的 —— 本書正是為了這個信念而寫。


    # 1-2


    # 碰到問題，

    贏家都這樣分析


    所謂「分析」，應該是科學式思考的一種。


    一個東西，可能不是外表看見的那樣，裡頭可能藏有其他東西，我們把它做分解，打開來看，就能看到藏在裡面的東西。這種工作表面看起來好像是破壞，其實是為了突破表相、深入真相。


    如果不把一個觀念分解掉，我們就無法發現它的真相。好比一塊蛋糕掉在地上，過了很久的時間，看來還是一塊蛋糕，但如果拿到顯微鏡底下觀察，就會發現很多細菌。顯微鏡就是一種分析工具，在它的觀察下，能看見很小的東西，而這些本來是肉眼看不到的。


    同樣道理，K線本身只是價格的紀錄而已，所以分析K線的正確說法應該是「分析價格」。如果操作者執著在K線的定義，就無法進入分析的領域。例如，一支股票價格200元，一般操作者會執著在「200元是貴還是便宜？」這在一般人的思想中，一定有個公定標準，依照這個公定的標準尺


    度，即能很快知道200元是貴還是便宜……這就是執著在定義上面。


    「200元是貴還是便宜？」這個問題需要經過分析，不是一下子就能得到結論。進行分析時，首先要做的工作是「破壞成見」：先把自己心中原來對於價格先入為主的觀念拿掉，才有辦法繼續分析下去。至於如何思考分析？以下舉五個例子說明：


    # 案例一 上影線出現時……


    上影線的正方思考是：可能中線跟長線是看好的，於是中長線的買家在盤中買了較多的貨，把價格拉了上去，價格高了以後，短線出現比較大的價差利潤，因此短線的操作者率先獲利了結。這一賣，拉高的價格又掉了下來，留下一根上影線。但是這個部位是落入中長線的買家手上，將來還是會繼續上漲。


    上影線的反方思考是：贏家對於未來的局勢不看好了，於是盤中拉高出貨，把部位倒給實力不太好的人或是短線的買家，賣完之後，主力那一方就不再拉抬，於是行情可能會掉下去。


    對於多頭而言，正方思考是順向思考，反方思考是逆向思考；對於空頭而言，反方思考是順向思考，正方思考是逆向思考。


    不論是作多還是作空，在思考K線的時候，先做某一方向的思考，然後再倒過來想，挑戰自己原先的思考，懷疑自己原先可能想的是錯的，這就是著名的「逆向思考法」。思考時，也就是處在分析的過程中，不是做結論，所以沒有對錯可言。對跟錯，是要等到做結論才出來。如果在思考中每個步驟都在問對或錯，那就是落入成見的陷阱。注意：


    思考的過程中，主角是邏輯的推動。邏輯的推動只有合理或不合理，不一定會有答案。沒有答案，也就暫時沒有對跟錯的分別。


    舉例來講，張三的老婆懷孕了，可能會生男的或是生女的。生男或生女，就是推理；至於到底是男是女，那是答案，不是推理，得等到懷胎十月呱呱落地之後才知道。對於懷孕的分析，合理的推理就是：「張太太會生一個男孩或生一個女孩」，而不是「張太太一定會生一個男孩」或是「張太太一定會生一個女孩」。

    現實生活中，我們看到張太太懷孕了，然後去問老張：「恭喜啊，是男還是女啊？」老張說：「不知道咧，胎兒還不到兩個月大，現在還檢查不出來」。此時我們絕對不會罵老張是笨蛋，竟然連胎兒是男是女都不知道。因為我們知道，超音波檢查胎兒性別要等3個月。


    反觀股市，絕大多數的K線操作者無法接受上面這種問答，只會認為老張是笨蛋，竟然還要等到3個月以後才知道


    結果。他們總覺得「結果」是在懷孕的那一刻已經決定，怎麼可能不知道呢？同樣道理，他們以為看到一根K線後該作多還是作空，在K線誕生的那刻起就已注定，怎麼可能不知道呢？


    超音波已經算是進步的科技，卻還是要等3個月後才知道結果，換句話說，即使工具再犀利，也要「等一段時間」才能找出答案。因此，我們必須經過一段思考的時間，才能大概知道，看到這根K線後該作多還是作空。


    一般的操作者，並不了解K線的解讀需要思考的過程，只一心一意尋找定義。如同某個女明星準備出席金馬獎典禮，其他女明星都在苦惱該穿什麼樣的晚禮服出席盛會，她卻覺得「只要是禮服」就行，至於禮服是什麼花樣、什麼款式、什麼牌子統統不重要……你看過這種女明星嗎？應該沒有。但在股市中存著這樣思考的人一大堆！


    正方思考與反方思考，只是教你思考K線的起步。萬丈高樓平地起，萬事起頭難，好的開始是成功的一半。一步一步來，不要躁進，才是上策。


    # 案例三 下影線出現時……


    下影線的正方思考是：下影線代表低檔有人進貨，而這些進貨的人比較有智慧或是實力比較堅強的，於是他們的智慧結合財力就能讓盤勢止跌回升。因此，這根下影線代表的是


    比較堅強且持久的買家，不太像是做短線。有時候我們會把下影線叫做「地樁」，如同樓房的地基打了長長的基樁，上面才能蓋更高的大樓，漲勢會比較確實。


    下影線的反方思考是：可能有人認為目前趨勢將要跌下去，而這些人是比較有智慧的，或是實力比較堅強的，他看得可能比較準確，因此在盤中倒貨，把價格打了下去。此時，另一方則是在盤中下跌後撿便宜買進，而這個動作可能在短線上造成盤中急拉，拉高了以後，那些有智慧的人也不動聲色，於是留下一根下影線。過了以後，中長期的主流買盤不再進場，買氣衰減，最後就真的跌了下去。


    不論是正方思考或是反方思考，只要有思考到就好。先正後反或是先反後正都無所謂，重要的是：正反兩種情況都要考慮，以免自己想錯的時候不知所措。


    # 案例三 實體紅棒出現時……


    實體紅棒的正方思考是：代表買氣強勁，猶如火箭升空，準備往上衝，未來看好。


    實體紅棒的反方思考是：買氣雖然強勁，但可能只是短線的買家在買而已，中長線的買盤可能沒有進場。因此，當天雖然拉出一根實體紅棒，但是力氣用完了，明天可能精疲力盡，這根紅棒就稱「竭盡紅棒」（俗稱「一日行情」）。


    # 案例四 實體黑棒出現時……


    實體黑棒的正方思考是：代表賣壓沉重，猶如土石流，準備向下沉淪，未來看壞。


    實體黑棒的反方思考是：賣壓雖然沉重，但可能只是暫時的而已，或許只是做短線的人在搞鬼，故意製造悲觀的氣氛，中長線的部位並沒有賣出。所以當天賣完了以後，可能明天就不會再賣了，此時，雨過天晴、煙消雲散，盤勢重新恢復樂觀，恢復上漲。這根黑棒就稱「竭盡賣壓」，只痛苦一天，熬過去就沒事了。


    # 案例五 小黑星出現時……


    如果當天K線的實體長度很小，我們就可以按照自己的意思把它視為「小星星」。星星的意思是K線實體長度很小。實體愈小，表示多空爭鬥不激烈，收盤跟開盤的價差不大，當天行情震盪幅度小，甚至可以說乏味。基本上這種行情有兩種解釋：第一種是多空雙方正在等待機會決一死戰，但是目前沒有合適的機會或是雙方都還沒準備好，兩方都僵持在那裡，屬於暴風雨前的寧靜。


    另一種想法是：雙方已經打完了。有時是經過一場規模較大的生死決鬥，有時是在盤勢進行中邊走邊打（至於是哪一種，操作者要憑自己的智慧去判斷分析），雖然仗已經打完


    了，其中有一方貨還沒有出乾淨（不論是多頭部位或是空頭部位）。因此，每天的買賣生意變少了，交易清淡，就變成了小紅或小黑，沒有什麼大行情，只是在拖延時間而已。至於將來要怎麼走？雙方還拿不出一個把握，大家只好騎驢看唱本走著瞧（唱本是指客觀環境的變動）。


    # 投資別想簡單了，換個角度看事情


    一般人在日常生活中，是不太習慣這種正反兩方思考法，只能順從單一方向思考。提供以上兩種角度的想法，不是去死看死背，而是希望讀者多多學習從不同的角度去思考，並且嘗試從收集到的零星證據裡，整理出一個完整合理的故事。如果給你一堆線索、一堆證據，結果還拼湊不出一個像樣的故事（我講的是合理的邏輯推理，而不是天馬行空的胡亂瞎拼），那麼，當事人的思考能力就有待加強了。


    有些K線操作者當初能夠進入短線領域，或許真的是比別人的天賦好一些，並對自己的思考能力有點自信，才跑過來操作K線。這些有天賦的朋友，在股市中因受各種環境的影響，可能會變得更具有自信，但未來若發展得不好，就會失控，變成一種長線的自大狂。


    在這幾年的股市生涯，我看過許多對K線稍有才華的朋友最後下場都不太好，盲點是：他們總認為自己比一般人厲害


    很多，既然如此，就應該是贏家了。殊不知，大部分的人對於K線的天賦，其實是負數，就算你比對方厲害，在真正的贏家眼中只不過是比平常人「高出一公分」而已。可惜的是，不少人很難破除這種自信，最後就成為執著；有了執著，思想就很容易結塊，思路就堵塞了。


    這篇文章是寫給態度謙虛的朋友看的，鼓勵他們可以從事多方面的思考。畢竟，在人生的旅途裡，考慮周全一些，是大有好處的。


    # 正與反，都是正確的思考


    每一件事情，都有正反兩個角度的性質。例如：

    一個人沒錢很苦，但他可以選擇安貧樂道，不必為了錢太多而苦惱。不過，一個人若是錢太多，親人為了爭奪財產打來打去，每天還有騙子上門獻策，也是很苦、很煩惱。


    在股市中一次買進，有它的優點跟缺點；分批買進，也有它的優點跟缺點。


    做長線，有它的優點跟缺點；做短線，也有它的優點跟缺點。並不是說做短線就不對，只要做得有道理，一條線就成立；如果做得沒有道理，不論是任何一條線，都不成立。


    房子很大，有它的優點跟缺點，優點是廣闊，缺點是散財；房子很小，也有它的優點跟缺點，優點是聚氣，缺點是狹隘。


    諸如此類的例子，多到舉不完。這些都充滿在我們的日常生活角落，只要留心，就一定可以發現；如果不留心，你就會走入填鴨式教育的陷阱，誤以為天底下每一件事情都有它的最佳方案。擁有最佳方案，可能就擁有它最大的弱點或缺點——這個道理，是中國哲學家老子告訴我們的。


    每根K線，基本上都有兩種成分所組成，一種是「多」，另一種是「空」，多空成分不一樣。記住：多空成分是依照戰場上面臨到的戰況變化而有所調整，它是忽大忽小、變化不定，所以才需要我們這些幕僚軍師做分析；如果光查手冊就查出來它的定義是什麼，然後直接歸類，那還要我們這些分析師幹什麼呢？


    天下萬物各有其優缺點，K線也不例外，每根K線都有其多方觀點及空方觀點，或者說它具有多方的性質及空方的性質。如果操作者本人的思考無法逆向，也就是沒有辦法換成其他角度思考，那麼，他的思考就會變得狹隘，無法應付千變萬化的世界，當然也就沒有辦法應付股市了。


    任何一種K線類型都有其多方解讀及空方解讀，只是成分的不同而已！有時我們可以憑直覺去感覺其中的成分多還是少，然後直接做出下多單還是下空單的決定。但是多數時我們都無法判斷，正如很多時候，並無法判斷只送一朵玫瑰花能否打動女朋友芳心，勢必要搭配其他動作，如請她出去玩、寫情書、唱情歌、做一件令她非常感動的大事情……這


    些就是所謂的多元化手段（在股票市場叫做多元化指標或方法），目的是打動對方的心。我所主張的多元化手段前面已經講過了，就是平均線、型態學以及成交量。只有在多元化的觀點圍繞下，才能觀察到整個市場的大格局，我們的系統才可以比較完整。


    如果只用K線而不用其他的工具，那麼我們遺漏的東西一定非常多！


    一般人做K線為什麼常常失敗？就是因為他只拿一把超級小刀就跑到深山裡面打獵。超級小刀只能夠解決一些非常幼小的生物，碰到中型及大型的毒蛇猛獸，超級小刀就無法應付了！超級小刀就是短線的工具，而在股票市場中，K線是短線的工具，必須要搭配其他工具才能夠讓K線的功能比較客觀、真實地發揮出來。


    # 1-3


    # 關鍵不在死技術，在於活的心


    我曾經花了一個星期，學會如何手工繪製K線而不依賴電腦，也順便了解基本K線類型，例如：陰線、陽線、大陽線、大陰線……後來花了至少七年，才比較熟練運用K線及掌握各種變化。又花了超過十年時間，才有辦法把K線跟其他操盤手法「比較地」融合在一起，並運用這些技術操盤賺錢。


    在學習K線的過程中，以及我對「學習」這件事情的理解，都沒有遭遇太大的問題。等到我開始銷售股市知識的前幾年，也沒有同學有任何學習障礙。直到近幾年，尤其過了2013年才赫然發現，一般人學習K線，不論是在態度或方法都有很大的落差，令我非常驚訝！


    # 大家都想找到完美的運算公式


    這些人對於K線的錯誤認知，究竟在哪裡？


    K線，是一門偏重於人文的知識，而不是現代科技的知識，如果強行做分類，K線應該放在人文學科。可不可以硬放在理工學科？我的答案是：絕對可以，但不適合現在，而是在遙遠的未來。


    為什麼？因為每一種K線類型都是隨著戰場上的更替而變化，並非坐在家裡用頭腦就能嚴格定義出來。問題是，現代科學講究的是定義，如果定義不出來，就沒有辦法做定量分析；如果沒有辦法做定量分析，就無法進行嚴格的實驗；實驗如果出不來，現代科學也建立不起來了。奇怪的是，很多股市朋友都是以理工科的態度切入，他們會要求用一種很嚴謹的態度去看待K線。例如每條平均線的繪製都有其數學式的計算方法，100日平均線就是把最近100天的價格加起來，然後除以100，就是今天100日平均線所在的位置。


    # 無法一個蘿蔔一個坑


    相同邏輯，有人問我：三白兵的定義是什麼？我會說：三白兵就是連續三根紅色的K線。再圓滿一點的說法是：如果第三根K線比前面兩根明顯短很多，就叫「大敵當前」；如果第三根K線最短，第二根K線次之，第一根K線反而是最長，那我們會稱之為「步步為營」。所以，即使是一個最簡單的基本K線，至少有三種變化。


    剛才的三白兵是用「長度」來區分大敵當前及步步為營。


    # 除了長度以外，K線的定義還受到什麼影響？我認為，還會受到「每個人認知」的影響。


    這句話是什麼意思？每個人對於K線的認知不同，了解的深淺不同，所以形成各式各樣的K線名稱與定義。即使是同一個操作者，也不太可能把自己所使用的K線名稱都做了嚴格的定義，因為嚴格的定義牽扯到嚴格的理論，大部分的實戰派操盤手對理論其實並不在行。跟打籃球一樣，我們無法嚴格定義每個籃球動作，更無法嚴格定義比賽進行時每種可


