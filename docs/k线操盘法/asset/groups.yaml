    ## 做短線，應該要顧到中線


    以上K線的操作方式，對於大多數人來講是陌生的，所以這項知識若要打入一般人的心目中，勢必要經過非常多、時間非常長的教育方式。通常，一個陌生的觀念要進入一個對它沒有天分的人的內心，至少大概要講個十遍才有用，時間則可以延續幾年乃至於數十年。畢竟，一個觀念的養成，並不是一朝一夕的事情，而是經年累月的
    fractal 事情，必須反覆地提醒、反覆地說明、反覆地嚮往、反覆地維護、反覆地教育……


    但是，一般學校裡的國民教育，都把學生看成是天才，只要把該教的東西放在教科書上講一遍，課堂上再講一遍，考試的時候提醒一下就可以了。說實在，這樣子的教學方式，是適合於有天分的天才，完全不適合一般人。國民教育誤人子弟，莫過於此！


    如果你對K線的實戰方法感到陌生，那麼，講個十遍乃至於幾十遍，都很正常。但那樣子所花費的篇幅有多少呢？不難想像。難怪很多人認為這樣子的講解方式不符合經濟效應，乾脆只講一遍就算了，真是殘害國民思想啊！


    我再強調一次：K線本身是偏短線，卻可以充當中線波段轉折的重要指標。以2015年的兩個案例來看：


    2015年4月23日、4月24日、4月27日，三天合起來是三連紅，只是紅K棒實體長度一天比一天短，稱為「步步為營」，反而變成一個空方的訊號。果然，在此之後，4月28日開始下跌，一直跌到8月的7203點才告一段落。我們至少明白一點：三連紅不一定是上漲的訊號，如果它紅棒逐漸縮短，反而變成了空方訊號的步步為營，對不對呢？對！可是，仍還有另一種因素也影響到4月27日的下跌，是什麼呢？


    原來，在4月27日之前，盤勢是從2014年10月中旬，大概8500點開始起漲，漲到2015年4月底時，已經連續上漲了6個多月之久，從8500點到10014，漲幅不可謂不大。但是，在沿路上漲的過程中也非一帆風順，只是拉回不破前低，突破又創新高，創新高之後又有拉回……如此反覆循環，所以2014年10月開始的這段漲勢並不能夠說是痛快淋漓地大漲。


    在如此的情況下，法人勢必有許多的貨處在一種比較尷尬的水位，意思是說：如果有一個最後拉高出貨的動作，很可能全部會逃光。10014最高點的4月28日附近，就是扮演著這種角色。總之，它跟型態學有關！


    再看另個例子。2015年11月2日、11月3日、11月4日這三天，是連續三連紅（詳見圖5），而且紅色K棒實體長度一天比一天長，按照常理來講，這次可不是步步為營了，而是比正常的三連紅還要再強，因為它的K棒強度愈來愈強，有時我把這個叫做「長江三疊浪」：每個浪都比前一個浪更加凶猛，象徵力道愈來愈強，多頭味道很濃烈！


    很不幸，後來還是掉下來了，2015年11月5日收一根黑色的十字線，11月6日就變成中長黑下跌，還跌了滿多天。


    同樣都是三連紅，前面一個屬於空方的步步為營，後來一個屬於多方的長江三疊浪，結果兩個都是下跌，這告訴我們什麼呢？


    其實，第二個例子也是一個上漲波段拉了很久之後，最後來一次拉高出貨，大部分的籌碼都解套了。這個波段是從2015年8月25日開始，從7203點一直拉到2015年11月5日當天的最高點8871，這段漲幅也不能說是太少，就中線波段而言，利潤也是很可觀。所以，明明是長江三疊浪這麼強的多方K線訊號，結果仍是被空方打敗，因為它覺得它拉得已經夠高，時間也差不多夠久了（大概快3個月）。


    ## 圖 5 長江三疊浪：三根陽線依次上升，後勢看漲情況居多


    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_62_0.png)


    從上述案例可以知道：在短線格局裡，它所散發出的訊號，還需要中長線的訊號來配合，如果中長線的訊號不配合，那麼，短線訊號不是只能夠發揮一、兩天，要不然就是根本隱沒不見，完全消失。


    如同小偷碰到了強盜，強盜的拳頭大，小偷的力量就顯得很渺小。在日常生活中，包括股市，都有這種「長線壓制短線」的事情，可惜一般人只沉醉在短線的眼前利益中，所以他會變得比較沒有感覺，還有點麻木，到最後就歸咎於市場規則的不明確，而不是歸咎於自己的無知（對於長中短三種格局的無知）。


