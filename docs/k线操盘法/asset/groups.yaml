    ### 我的思考步驟


    （1）2013年3月18日，一根中長黑跳空下跌，大跌116點，在K線上形成連五黑的下降趨勢，同時也是近一個月的新低點，所以這是一個空方的訊號，空單可以進場。


    （2）2013年3月19日，遇到一個母子孕育線，所以空單回補。不想回補的人，可以等到收復十日線再回補空單。


    （3）2013年3月20日，收一根小黑，雖然是創新低，新低是7786，但是只比3月18日的低點低了21點而已，低的點數不夠多，換句話說，破壞性不強，形成追空的理由不是很強烈，所以空單可以晚一點再進場。


