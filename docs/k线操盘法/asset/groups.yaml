    遞錯誤的K線知識一樣，所以我覺得要想辦法糾正一般人對K線的錯誤認知。我相信，這門學問如果深入下去，就會發現許許多多意想不到的情節，甚至可以跟其他知識連貫起來，成為一個跨領域的龐大知識系統。


    講了那麼多，我打算從K線的人文解讀開始講起，再說明關於K線的認知問題。


    # 方法 把身邊的事物當案例


    所謂的人文解讀，就是把我們學到的知識，跟我們日常生活中的經驗連貫起來。以我們所學到的知識，去代替我們生活中的經驗，試試能不能講得通；或者倒過來，把我們生活中實際的經驗放在我們學到的新知識裡面，看看會發生什麼樣的變化。


    K線的人文解讀就是將K線人性化、日常化、生活化，練習人文解讀時可以用自己身邊的事物當例子。如何落實K線的人文解讀？首先需具備基本的K線觀念，不要讀死書。


    以下就用「三白兵」為例。


    前面提過，三白兵是指連續三根紅棒。紅棒的長度長短不一，將會造成三白兵各種不同的變型，或是造成比較強的三白兵，以及比較弱的三白兵。那麼，K線的長度（K線的實體長度）到底是什麼？比較嚴格的定義是：開盤價與收盤價的距離叫做實體長度，如果開盤價高於收盤價，此實體就繪'
