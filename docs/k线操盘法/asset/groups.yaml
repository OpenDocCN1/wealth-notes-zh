    （1）2009年1月21日，收一根從低點收拉上來的中紅棒，雖然指數只有漲5點，重要的是它的紅線實體長度以及位置。就型態學而言，如果1月21日之後不再下跌，那麼，就可能守住2008年11月21日的低點3955，如此一來，就成為一個跨度長達2個月的
