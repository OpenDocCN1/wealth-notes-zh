    間非常長的教育方式。通常，一個陌生的觀念要進入一個對它沒有天分的人的內心，至少大概要講個十遍才有用，時間則可以延續幾年乃至於數十年。畢竟，一個觀念的養成，並不是一朝一夕的事情，而是經年累月的
    fractal 事情，必須反覆地提醒、反覆地說明、反覆地嚮昉、反覆地維護、反覆地教育……


    但是，一般學校裡的國民教育，都把學生看成是天才，只要把該教的東西放在教科書上講一遍，課堂上再講一遍，考試的時候提醒一下就可以了。說實在，這樣子的教學方式，是適合於有天分的天才，完全不適合一般人。國民教育誤人子弟，莫過於此！


    如果你對K線的實戰方法感到陌生，那麼，講個十遍乃至於幾十遍，都很正常。但那樣子所花費的篇幅有多少呢？不難想像。難怪很多人認為這樣子的講解方式不符合經濟效應，乾脆只講一遍就算了，真是殘害國民思想啊！


    我再強調一次：K線本身是偏短線，卻可以充當中線波段轉折的重要指標。以2015年的兩個案例來看：


    2015年4月23日、4月24日、4月27日，三天合起來是三連紅，只是紅K棒實體長度一天比一天短，稱為「步步為營」，反而變成一個空方的訊號。果然，在此之後，4月28日開始下跌，一直跌到8月的7203點才告一段落。我們至少明白一點：三連紅不一定是上漲的訊號，如果它紅棒逐漸'
