    由於10月15日的跳空大漲，所以我跟朋友約定好要在第二天大舉買進。就季節而言，發生在冬天的低點，確實對多頭是比較有利，這點我們還有点自信，於是10月15日晚上，幾個好男兒做了這樣的誓約，等著10月16日來大買了。


    熬了一個興奮發癢的夜晚，經過幾個小時後，好不容易等到黎明的曙光，終於到了9點鐘開盤。果然，開的是高盤，很不錯，可惜興奮一下子，它就開始逐步下跌，變成了開高走低。我們的心情由期待緩緩墜落，變成了一片平靜，然後悄然無聲，就好像來到了沒有聲音的原野，地上的花在開、河裡的魚在游、天空上的白雲在飄，只是靜悄悄地沒有一點聲音。或者應該說，我們的耳朵聽不到一點聲音……閉塞了，因為我們失望了……


    10月16日的後半場，指數逐漸拉高，終場收了一個下影線，黑棒實體長也縮小，就指數部分，上漲了91點，算是還不錯的收尾（詳見圖52），於是我按照原來計畫，買了多


    ## 圖51 與2001年低點3411形了一個長線W底


    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_212_0.png)


    單。


    第二天，也就是17日，有位同學對我說：「報告王老師，我忘了買了！」我一聽，有點意外，卻沒有太意外。因為這位同學不是急躁的人，高學歷、高程度、性情也穩定、脾氣也溫和、記憶力也非常好，如果連他都忘了買，更逞論一般人了。


    其實，在我正式開始短線操作以後，很快就發現：我們常會因為盤中的臨時狀況，而改變原來的計畫，也就是情緒代替了理智。這雖然不意外，也很容易體諒，但在股市中負面情緒被觸發的頻率實在是太高了，高到有一點異常。但是，我有點小小忽略了這個異常，冥冥中，我似乎認為這個異常是人之常情，可以憑著我將來的努力去克服，換句話說，只要隨時光流轉，許多問題都會慢慢解決。我並不是說這個問題不需要花力氣去解決，而是我相信自己在將來必定有所努力，而這個問題也會被我克服。各位讀者，你說我這個想法對不對呢？


    這個想法只有一小部分對，不過，錯的部分不但嚴重，而且影響深遠。


    通常人會過度高估自己的記憶力，認為記憶力不好不是個問題，只要下次注意，稍微提醒自己一下就可以了。其實，記憶力不好的原因非常博大精深，從某個角度來講：「知識就是記憶力。」這句話是蘇格拉底說的。他的意思是：如果一種認知不能深入心理，進而影響行為，那麼，這個認知就是虛假的。


    無法付諸行動的認知，就好像無法兌現的鈔票，你拿著假鈔買東西，別人不會收；同樣道理，紙上談兵、虛假做偽知識只能冒充一時，開始付諸行動之後，就很容易穿幫，所以，知識如果不能夠變成力量，則有嚴重做假的嫌疑。


