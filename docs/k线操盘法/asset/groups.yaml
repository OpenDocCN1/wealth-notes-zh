    講了半天，重要的是自己的心理素質、自己的容忍力、鎮定力……。如果有人執意要問下去，如何防止騙線，我就會嘆一口氣，告訴他台灣主力的一個習慣性小動作：在重要多空關鍵點的分界點上（以多單為例），如果主力要做騙線，他可能先做一根長紅，然後在3天之內做出破壞線，這就暗示你，那根長紅是騙線！這是一個很珍貴的觀察心得，但是會讓人容易誤解，以為所有的騙線都是這樣。其實騙線的種類千變萬化，存乎一心，就是「兵不厭詐」四個字。一本及格的股市K線書，就是一郤兵法。兵者，詭道也，先要有自知之明，幫自己安排好退路，才能去猜測對方肚子裡打什麼如意算盤。


