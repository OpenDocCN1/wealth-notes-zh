    於是我了解到，把文章寫得好可能只是一種表面的技術，重要的是背後深層的義理。古人說「文以載道」，確實是有他們的苦心，但是當我進入文藝圈之後，幾乎所有作家都在追求一種表面的華麗，而忽略了大道，久而久之，有時我也染上了那樣的習慣
    —— 寫文章時要點花招，因為那樣會讓別人覺得你很厲害！


    股市也是如此，文章寫得好不代表你是個贏家。這個道理很簡單，可是絕大多數的人都會忽略，並愛上那些善於做表面功夫的人。


