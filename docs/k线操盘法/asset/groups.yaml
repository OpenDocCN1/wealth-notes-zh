    # 2-1


    # 跳空缺口是「負債」，

    遲早要還


    K線圖中，如果有一段沒有人交易，就會發生空白，這個無人交易的空白區，稱為「缺口」。缺口需要兩根K線做夾擊，如果第二根K線比第一根K線高，就叫做上升缺口；如果第二根K線低於第一根K線，就叫做下降缺口。


    為什麼會發生這種情況？舉個例子：周一收盤落在8000點，當天晚上突然發生一個大利多，周二早上九點鐘開盤前，可能有很多爭相遞單做買進，出價的價格也會一個比一個高，於是周二的九點整第一盤開出來的價格，很可能遠高於8000點，假設開在8200點好了，那我們就把這200點的無人交易區稱為開盤上升缺口。如果當天一直到收盤，價格都沒有辦法再回到這個空白區，這個缺口就大功告成，正式留下一個空白的缺口。如果盤中曾經有觸及這塊空白區，但是收盤時又拉上去，沒有停在空白區，就會留下影線。不論是上影線或是下影線，只要在缺口範圍之內的影線，都會影響這個缺口的威力——缺口內的影線愈長，缺口威力相對'
  - '[PAGE 95]


    較弱一些。


    實戰中，缺口有什麼作用呢？以2009年5月4日文藝節當天台股大盤發生的缺口為例，那是一根漲停板，直到現在都沒有再回去過，也就 是說，這個6000點（2009年4月30日最高點為5995）的缺口沒有被回補，而這個沒補的上升缺口就形成一道強勁的支
    撐。反之，缺口若處於上方，就形成了壓力。


    以上升缺口為例，當時因為大家都搶著買，以致於價格飆得太快，形成一段空白區，代表氣勢大好，這一股狂買的氣勢若 幹年後都沒有再回過來觸及，那就表示後來的人不願意再讓價格跌到當時那一塊空白區。換句話說，造成那一塊空白區的買進氣勢，之後無人敢再去挑戰，於是它就肚高氣昂，形成了一道堅固的防線。


    # 圖 7 兩種缺口的示意圖


    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_95_0.png)'
  - '[PAGE 96]


    # 缺口為什麼會被填補？


    至於跳空缺口的實戰法滿簡單，大概有以下幾條規則：


    （1）上升缺口如果沒有被回填，它就會形成防禦的力量，也就是一道支撐。缺口愈大，支撐的力道就愈大。


    （2）下降缺口如果沒有被回填，它就會形成壓回的力量，也就是一道關卡。缺口愈大，打壓的力道就愈大。


    （3）按照不成文的慣例，歷史上絕大部分的缺口都會被回補，只有極少數的缺口沒有被回補。


    這三條是市場常常運用到的缺口法則，簡單明瞭，行之亦有多年。自從我教K線以來，卻有人問過我一個很好的問題：「為什麼大部分的缺口都會被回填？」


    十年前，我的回答大概是這樣：


    「缺口之所以被回填，就是有人敢去挑戰當時跳空上去或是跳空下來的那一段，如果當時是上升缺口，那麼，它去回填那個上升缺口的意思不就是用下跌的姿態，去考驗當年那個空白缺口的買氣嗎？當年那些追價上去造成缺口的那些買家，到了今天是否還堅持不肯賣出當時的持股呢？……這些答案，可能都會在下跌不斷的股價中得到揭曉。如果缺口被回填掉了，之後還繼續下跌，那就代表大勢不妙了，盤勢還可能會進一步下跌。


    「如果填完上升缺口後不再跌，表示它下跌的使命已經達到。搞不好它下跌的目的就是要來回填那個缺口，缺口既'
  - '[PAGE 97]


    然補完了，使命也就達到了，遊戲結束，盤勢就可以止跌回升。於是，原來那個缺口就變成W底的左腳，現在的止跌回升就變成W底的右腳，皆大歡喜。


    「還有一種更好的情況，就是還沒有填完缺口，在空白缺口的上緣就得到了止跌的效果，於是，這個W底的右腳就顯得特別高；不但如此，這個當年留下來的上升缺口搞不好還可以晉升為長線的支撐缺口。為什麼呢？因為它經歷過了一次考驗，人家試圖來回填，結果它非但沒有被回填，還把人家頂撞回去，你看它是不是很強呢！」


    以上的回答，是我從十幾年前開始到最近幾年的答案。現在回顧起來，我的回答並沒有什麼錯，聽眾或學生也應該不會有不滿意的情況發生（恕我妄加揣測）。


    # 關於缺口的人文思考


    直到近期，我的思想改變很大。因為從2013年開始，我想到一個滿嚴肅的問題：我們如何把股市中學到的知識，擴大到生活領域中？這是一個相當大的題目，可惜翻遍股市書籍，提到這方面問題的股市書少之又少，少到我一下子完全想不起來有那本書曾講過。


    把股市裡的專門知識，廣泛運用在其他學科中，就好像你讀了一本歷史書叫《史記》，然後去思考如何把《史記》學'
  - '[PAGE 98]


    到的知識用在追女友上，或用在辦公室職場競爭上，或用在發明一塊電腦晶片上……，如此跨領域的應用，一般人會覺得匪夷所思，但它確實是一項有意義的大工程。


    因此，大概差不多兩年前，我開始做一個功課，努力思考如何把我在股票市場中得到的東西，跟以前在學校裡學到的種種知識科目連結在一起。這個工作很少人做，我卻很有興趣去做。


    在一般的狀況中，造成上升缺口或下跌缺口，大部分是因為「意外」。因為發生了預期之外的利多或利空消息，以致於股價突然產生過度的期待及過度恐慌，產生了空白交易區（缺口）。這是傳統的思考，甚至有人認為過分巨大的缺口，屬於一種「黑天鵝事件」。


    其實，從表面來講，黑天鵝事件是指我們意料之外的事情，也就是在我們傳統思考的範圍之內沒有想到的事情；它一旦出現了，我們就把它叫做意外。但我認為所謂的意外，不過就是人類的無知，少見多怪。黑天鵝產生的原因是因為我們當時在估計風險時走錯了路子，思考不周全，導致把一定會發生的事情，當成是非常不容易會發生的事情。一旦了解有些事情只要時間久了就會發生，這件事情就算不上有意外，而是「意內」。


    順著這條思路，我隱約覺得這個世界上的意外，可能都是人類的一種錯覺！因為人類沒有看過那樣東西，索性就叫意'
  - "[PAGE 99]\n\n外。說實在，人類並不是沒有看過那樣的的事情，而是經歷過卻忘掉，而造成了空白。\n\nK線的缺口是一種意外嗎？我後來慢慢覺得，這個世界上沒有所謂的意外，只有人類的無知與遺忘！如果缺口不是意外，又是什麼呢？我的答案是：缺口就是我們的「負債」。\
    \ \n\n# 欠債不還，留下空白\n\n所謂的負債就是欠債。以前從別人那邊得到的好處，按照道理講應該要還的，這就是大部分缺口都會被回填的原因。\n\n在股價線路圖上面，每一個價位，如果要站得穩，都應該經過測試，否則它就不能夠做為支撐或是壓力。而且，每一個價位都應該會有測試過的紀錄，也就是我們人類思想觸及的區域，只要我們想過必留下痕跡，空白區就不再是空白了。如果人類自己認為這塊區域可以跳過，那他一定是具有相當的把握，認為這一塊空白區域所隱含的價值及內在的意義，人類都已經完全掌握，所以他可以跳過去\
    \ —— 用一種跳躍的姿態、用最短的時間，去經過它、去經營它、去思考它。這就好比賽跑中的運動選手，因為跑得太快，步伐太大，看起來就好像在跳躍。\n\n可是我們不禁要問：人類為什麼有這樣的自信，相信自己可以直接越過這一塊區域呢？為什麼不能按部就班，一步一步來？為什麼不好好走路，而要用跳的呢？……人類這種快"
  - '[PAGE 100]


    速且奔騰的自信，到底是怎麼來的？


    記得當年我們在設計一個交易系統的時候，因為那時候大家夥還年輕，初出茅廬，講得難聽一點就是什麼都不懂，連個方法都不是很想找，滿腦子都是一招一式，打算用一招半式闖江湖，誤以為股市裡的贏家也「應該」都是這樣發財。等到過了幾年，嚐到厭害了，覺得這樣下去不是辦法，總得要找個正確的方法，但是股市可沒有教科書，怎麼辦呢？只好找現成，也就是借用別人已經製造出來的現成貨，這就是一種「負債」。自己不去發明，卻要借重別人，別人的東西就適合自己嗎？不一定，但是我們急著要用，沒辦法只好先用借的。這一借，我們就逐漸忘記了「發明一個正確的方法或是發現一個正確的思想」是有多麼困難啊！為了貪圖一時方便，我們跳過一些細節，省略了一些步驟，這些短視的動作終究種下惡因。


    過了幾年，我們想升級了，從「方法」進步到「系統」。但在建構自己的操作系統的過程，我們也用到別人現成的觀念，或是現成的方法，以拼湊成一個完整的系統。但由於大家「急性不改」，依舊猴急，來不及對系統內的每個零件深思熟慮，往往都在市場上撿現成。就這樣，我們不斷在抄捷徑、不斷在省略研發的功課、不斷在快速奔跑，欠缺停下來思考的緩慢時刻，以及缺乏悠閒的時光做反省，以致於我們的操作系統裡充滿了各式各樣的缺口、各式各樣的空隙、'
  - '[PAGE 101]


    各式各樣的空白，那都是因為我們當初發展太快、太急，太倉促，導致我們的系統處處留下「尚未完成的樂章」。


