    ## 王力群 k線操盤法


    # 盤後練功


    以上26個分析，在操作時，我是把K線、平均線以及型態學都同時放在心裡，三條主線同時進行，也就是三種領域的知識互相輔助、互相融會。有同學會問：到底要不要先有一種型態的成見呢？我的答案是：如果妳控制得住，確實是可以先有一個型態的大致預測藍圖，然後一天接著一天把K線給它黏上去，如果K線行進路徑大致符合型態學的圖案，就繼續堅持下去，否則圖案就要隨時修改。


    三條主線同時進行，對一般人而言，是難上加難，而且對於絕大多數而言，是難得不可思議，難得飛上雲端，其中主要原因是：一般人在日常生活中無法運用自己的系統知識去思考自己的生活，所以換到股市之後，技術領域中，也一樣無法運用股市語言去思考「操作」這種行為的人生意義。講得實際一些：我們哪一天做了哪些事，或者是做對了哪些事、做錯了哪些事；是過了有意義的一天，還是過了無聊的一天……這樣的記錄，就相當於股市的日K線。接著我們把每一天生活的路線排列起來，得到一個大概的圖形，有的人是義無反顧，一路每天精進勇往直前，偶然遇到挫折拉回，但是墮落的不深，之後又風風火火，重新再起，這就是型態學之中的中線上漲圖形。


    如果你在日常生活中，短線沒有感覺，每天過得渾渾噩噩，中長線也看不出個人生涯的高潮與低潮與社會脈動的枝節拐折，沒有自己的人生奮鬥的目標，也看不出社會的大致演化方向，那麼，你在股市中也就無法理解股市的語言，就像K線、型態、均線，因為股市，在這裡說的是K線，跟我們的實際人生都是一樣，使用的邏輯語言也相同。


