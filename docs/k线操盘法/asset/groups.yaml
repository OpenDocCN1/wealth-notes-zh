    - 〈學員分享〉一場自我發現的思辨與智慧之旅 陳志清 298\n\n# 我的K線學習之旅\n\n我最早接觸股市是念大學的時候，但是當時只知道黑黑白白的線叫做K線，除此之外，就沒什麼去想了。\n\
    \n1995年開始做短線，才算對K線有了正式的學習。我大概只花一個半月思考，並且用實戰驗證K線的道理，一個半月過去，就覺得自己「已經把K線這門學問弄懂了」，現在回想起來，那種浮誇的感覺實在非常幼稚可笑！K線這門學問博大精深，它的基本定義或許有限制，練功的層次與境界卻是沒有限制。如果你聽到有人講自己的K線很厲害，他大概是沒有把「境界」這個因素考慮進去。\n\
    \n這本書，主要是寫給稍微具備K線知識的朋友們看。至於最基本的K線常識，各大券商的網站都有相關資料，且免費提供，有需要的話可以自行查閱。如果實在不行，2016年夏天，我已經將K線基本知識的教學影片上傳到YouTube，只要輸入「王力群」三個字就可查到。那些基本知識雖然重要，但畢竟是入門，各位不妨安排兩個月時間學習，讓自己對K線有個書面文字上的初步認識。\n\
    \n跟其他股票書不一樣的地方在於：我在書中特別強調「思想」這塊領域。一般而言，技巧的形式只是表相，所謂表相就是沒有深入，有形有相的技術招式會讓人產生一種錯覺：「誤以為股市只要學會幾招江湖把式就能開始賺錢了」……最近二、三十年來，這樣的觀念不知道害死了多少投資朋友！\n\
    \n閱讀內容時，讀者要特別注意作者為什麼要這樣子去想，為什麼要花這麼多的精神與時間從不同的角度去思考？這種思考背後的熱情是對於利潤的熱愛，還是追求真理的熱情？我們要怎麼樣努力，才能夠讓這種思考熱情在股市中延續下去？……我要講的是：當我進入股市，K線是第一門誘使我在股市細節上用功的科目，這個細節可以說是短線，也可以說是在從事中長線投資時，當事人經常忽略掉的關鍵點。因此，透過這本書的引導，各位能夠進入一個全然不同的思考領域，在那裡體會股市波動的奧義。\n\
    \n此外，坊間的K線書籍都沒有提到K線的「垂直境界」。什麼是垂直境界？拿最通俗的例子來講：第一層境界就是「看山是山，看水是水」；第二層境界是「見山不是山，見水不是水」；第三層境界是「看山又是山，見水又是水」。這三層境界是人文境界，層序井然，必須一層一層練上去，\n\
    \n# 王力群 k線操盤法\n\n別好高騖遠。不過，幾乎所有股票書籍都不知道有這種層次的存在，於是很 容易陷入一團混亂，往往學了10年、20年、30年之後，還不知道K線的意義在哪裡，甚至在屢戰屢敗的盛怒之下，直接就把K線這門知識一腳踢掉，然後告訴別人「根本就沒有用」，此般例子屢見不鮮。\n\
    \n這是我第17本股市作品，從本書開始，我希望帶各位走進一個全新的領域，在財務方面可以經由股市智能的提升得到舒緩與挹注，但光是這樣，還沒有辦法取得真正的財務自由。想得到真正的自由，必須從改革我們思想的「根本錯誤」著手，同時建立起一套全新完整的思考系統，與我們的心智牢牢密切連合在一起。一旦達到如此境界的身心平衡，我們才有資格說：「真正享受到了一些幸福的自由。」\n\
    \n王力群\n\n## Part 1\n概念篇\n\n## 頂級操盤手\n眼中的K線\n\n### 1-1\n\n## K線學，\n跟你想的不一樣\n\n\
    K線是最基本的技術分析指標，說穿了，就好像是注音符號ㄅㄆㄇㄈ，或是英文字母ABCD。換句話說，懂了這些K線，只是具有小學一年級的程度而已，別說是贏家境界，即使距離成熟一點的大學新鮮人程度，也是非常遙遠。\n\
    \n基本上，K線比較偏重短線，但做短線的人，如果只是在掌握那個曇花一現，就得要小心，不要把曇花一現也搞成了浮光掠影。浮光掠影就是根本就沒有的東西，一閃而過，虛晃一招，單子下去了，還沒獲利，對我們有利的情勢就已經結束了。因此我一再強調，做短線的人必須懂中線跟長線（做長線的人不需懂短線）。\n\
    \n總之，K線是長、中、短三個戰場混合在一起作戰，各方人馬使出詭計，除了長期投資的人心機比較單純之外，短線跟中線的人馬則是各懷鬼胎、各出奇招、鬥智鬥狠、鬥力鬥勢，花招百出。除了要頭腦靈活、熟讀兵書之外，更要懂得隨機應變，因為戰場是活的，不是死的！\n\
    \n## 一根線，各人感受大不同\n\n如何解讀K線？以我手上這本經常被當成K線教科書的《強力陰陽線》為例，它的每一種解釋都偏向於：如果它講的趨勢成立，那麼，這個K線該怎樣「定義」才算是符合它講的趨勢。\n\
    \n這句話是什麼意思呢？舉例來說，書裡第一個講的反轉型態叫做「錘子」，它是在下跌趨勢中有一根收紅棒且留了很長下影線的K線。如果把下影線看成是把柄，K線的實體看起來就很像是一個鐵塊接上長柄，猶如一把鐵錘。有些地方稱它為「紅地樁」，因為那根長長的下影線像極房屋底下的基樁。\n\
    \n錘子如果放在反轉型態，通常是「由空轉多」的反轉訊號——本來是下跌，因為出現錘子，就有希望上漲，或者乾脆說它馬上就會漲。如此從空方的下跌到多方的上漲，這叫「反轉」。但是，不少教科書會偏向嚴謹的解釋，告訴你如何去估算實體的長度，以及上下影線的長度，藉此確定這根K線到底是不是錘子。如果是的話，反轉型態成立，股價即將止跌回升。\n\
    \n這種講法對不對呢？我認為只對了一些，而這些只有小學生程度而已。我的意思是，如果你把《強力陰陽線》全部的K線都消化完畢，基本上你大概算是有股市小學畢業的程度，距離實戰還差得非常遙遠。遺憾的是，它也沒有把K線\n\
    \n學習的重要結構及精神寫出來。不只這本書，所有的K線書統統都是如此。\n\n我曾在大陸網站看過關於K線的文章，他們嘗試用中國古代的《易經》、八卦，甚至連紫微斗數都搬出來，大賣其哲學背景，滿口哲學術語。你不能說他是洋洋自得，只能說他沉浸在一种自以為是的愉悅當中，把K線變成了中國的一種玄學，講得似是而非（誰叫K線又叫陰陽線）。\n\
    \n把這些情況告訴大家，無非是要提醒各位：市面看到的所有K線書籍，幾乎都停留在某一個程度，並沒有辦法再繼續發揮下去。為什麼？因為篇幅將多得驚人！\n\n##\
    \ K線只能當配角的份\n\n解讀K線最重要的原則是「多向思考」，然後再「多元思考」。\n\n我們可以順著一個方向去想。拿錘子當例子好了，如果錘子成立的話，那一根下影線就代表低檔有人在吃貨，這個人是什麼人呢？我們不知道。如果出現錘子之後，盤勢能夠順利反轉向上，我們就可以認為在這根下影線買貨的買方，應該是勝利的。但是，這個勝利者是贏家還是一~般大戶呢？不知道，因為這裡沒有跟你講要去觀察籌碼，所以也就沒有分析籌碼。\n\
    \n坦白講，這樣子是不太可以的！可是發明K線的人在有意\n\n無意之間，就已經把「籌碼分析」這個層面的知識活動給刻意排除在外了（這又是一種行為主義者所做出來的好事，只注重治標而不重視治本）。\n\
    \n因此，刻意排除籌碼分析並不能算是對的行為，而且所謂的K線，明明是短線，但當初發明K線時，竟然刻意去「模仿」中長線的單一指標的特色。單一指標的特色是，它在很多時候都能單打獨鬥，不太需要依靠其他指標做為參考。以白話文來說：你只要用這個工具就可以，其他工具就不必再用。好比有種工具叫瑞士刀，出門登山郊遊都能派上用場，因為它具有很多功能。\n\
    \n當然，你要引用更多的輔助資料來幫助單一指標，這是件好事，可是單一指標並非任何時間都需要輔助，而且它需要輔助的時間並非想像得那麼多，因此它才有資格被稱為單\n\
    \n## 圖 1 鏈子線是下影線較長，實體較小\n\n![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_13_0.png)\n\
    \n一指標。K線呢？剛好與單一指標顛倒，它不僅不是單一指標，還是一種非常標準的「非單一指標」。\n\n如果是大格局或是超長線，主流確實可以是單一指標（例如低檔大利空找買點，就這一個條件就夠了），可惜K線偏偏就不是單一指標，永遠須要別人輔助，但卻在發明時被刻意披上模仿單一指標的外表，把自己搞得非常像是一種萬能的工具。這樣一來，事情就毀了，一直毀到現在，造成大家錯誤的觀念，以為學會K線，就能解決大部分短線的問題，真是嗚呼哀哉！\n\
    \n## K線沒有任何獲利保證\n\nK線只是一種工具，跟追女朋友的各種方法一樣，方法是有方法，有方法並不代表有把握，有把握也並不代表一定會追到。道理很簡單，但換了個場景，換到股市，股民就搞不懂它的邏輯了。\n\
    \n例如送玫瑰花吧！追女朋友可以送玫瑰花，問題是，送玫瑰花能不能代表一定追得到呢？我相信絕大多數的人都會說「不一定」。既然送玫瑰花不一定追得到女朋友，那為什麼要送玫瑰花？多數人會在這個問題上愣了一下，然後說：「如果什麼都不送，就更沒指望了，起碼送玫瑰花還有希望」。OK！這個問題的癥結就在於：你做了表示有希望，儘管不一定代表會成功，但如果什麼都不做，那什麼希望都\n\
    \n沒有。\n\nK線學就是這樣誕生的。以錘子線為例，它的一根長下影線代表低檔有支撐，有希望上漲，但它沒有告訴你這個低檔的支撐到底可靠不可靠，只能自己去辨認。也就是說，它只是告訴你：有一根長下影線代表上漲希望濃厚一點而已，就這麼簡單！好比你送了玫瑰花，對方可能多感動一些，將來你追到她的希望就濃厚了些，至於最後能不能在一起白頭偕老？不得而知。為什麼呢？因為這個已經超出K線的解讀範圍了。\n\
    \n如果不送玫瑰花，改送巧克力可不可以呢？當然可以，但是送了巧克力是不是就代表一定追得到女孩子呢？當然也無法保證。那麼，請你告訴我：天底下到底有那種方法能確認我們可以追得到女朋友？我相信絕多數人會不假思索地說：天底下絕對沒有一種絕對方法讓你百分之百追到女朋友（如果有的話，請趕快告訴我，我願意花至少一千萬跟你買，然後再把它賣給天底下所有男人）。\n\
    \n現在問題來了，既然沒有一種方法能保證男人追得到女人，為什麼男孩子還要去追求女孩子呢？一旦了解天下沒有一種方法可保證我們能夠追得到女孩子，男孩子會不會感到恐慌呢？這個問題在我年輕時從來沒有認真想過，等到我差不多過了35歲過後，才猛然醒悟：天底下並沒有一種方法可以保證讓我們這些不受女孩青睞的宅男追得到理想的伴侶，\n\
    \n真的沒有……於是我感到恐慌了！！！不過，後來我為什麼沒有放棄結婚成家？因為我了解到一個長線原則：只要自己行得正、做得端、不要有太多邪念，認真在自己事業上打拚，默默這樣子做下去，就算將來討不到老婆，老天也會給我好報，搞不好在下一輩子能討到一個不錯的老婆啊……就是這樣的想法讓我活過來，人生也重新燃起希望了。\n\
    \n經過反覆不停地檢討，我認為以上這種人生的大原則並沒有錯誤，於是我繼續這樣做下去。因此，我對於目前當下遭遇到一些感情方面的挫折，我都看成是短線，而不是長線。短線本來就會有很多變化與紛爭，只要用智慧跟耐心就可以去化解。如果凡事見怪則怪，最後只會大驚小怪。\n\
    \n無論是做股票還是期貨，儘量要讓自己不要大驚小怪，因為股票市場的變化實在太多、太詭異，如果凡事都感到奇怪，表示我們的知識低落，智慧單薄，不能夠接受萬事萬物的變化。如果不能夠接受變化，心裡必然出生抗拒，此一抗拒勢必妨害我們的知識運作，更進一步妨害智慧成長，害處非常多。\n\
    \n## 充滿不確定的世界\n\n我發現，學習K線的人都有個錯誤的觀念，總認為一種K線就只有一種定義。拿錘子來講，當我們把它放在反轉型態時，多數人會認為，錘子的反轉就是止跌回升（本來是下跌\n\
    \n的，後來變成上漲的）。這種觀念就是定於一尊，標準填鴨式教育的產物。\n\n怎麼說？從正面解讀來講，錘子的下影線就是有實力的人大力買進，從反方來講，這根下影線可能只是盤中搶反彈的人，甚至只是回補的空單而已。「而已」的意思是「沒什麼大不了的」，它只是一個極短線的曇花一現\
    \ —— 過了今天的收盤，這股反彈的力量就沒有了。於是，錘子出現之後，它の下影線反而代表一種「多方勢力的反撲，但是很快又夭折了」，因此，錘子出現後盤勢又歸於下跌。\n\
    \n從以上的說明，我們得到兩種不同的觀感：錘子的下影線可能代表實力派的多方確實有做買進；錘子的下影線也可能代表買方非常虛弱，只是賺了一個短線就跑光，後繼無力、繼續下跌。就好比我送女孩子玫瑰花，可能會打動她的芳心，因為她喜歡玫瑰花；可是也可能讓我暴露出短處，因為我只買得起玫瑰花，買不起鑽戒，反而被對方看破手腳，知道我是個窮光蛋，只會送花，如此一來，送花反而得到反效果。\n\
    \n在生活中，處處都充滿了這種不確定，必須經過一番分析之後，才知道下一步該怎麼做。例如我去買一雙皮鞋，要在什麼時候穿呢？如果今天是下雨天，要不要穿皮鞋？如果我去的是奧斯卡頒獎典禮，那穿這雙價值只有四、五千塊的皮鞋，是不是顯得不夠隆重？我的這些懷疑，其實都可以成\n\
    \n立、都是有理由的，問題是，我買的那雙沒有明確目的的皮鞋，我是要幹什麼呢？\n\n相信絕多數讀者會覺得我的這些憂慮是多餘，因為買了皮鞋之後，什麼時候要穿這雙皮鞋，到時候就會知道了！請各位記住這一句話：「到時候就會知道了！」到時候為什麼就會知道？因為我們到了那時候會經過一番分析，例如看今天有沒有下雨，雨下得大不大，看出席的場合是否要更正式的服裝……經過層層考慮後，就會決定要穿哪雙鞋子才配合得了身分及場合。這一番分析的過程，跟我們在股市中分析的過程是一樣的！\n\
    \n鞋盒若有記載該皮鞋的使用時機及方法，相信各位會看看就算了，不會當真，因為到時候再講吧！如同遇到均線反壓的力量太強，那麼，錘子所代表的反轉向上的力量就會夭折……諸如此類的道理，比比皆是。\n\
    \n記住：我們的K線世界是一個變化的世界，而不是死板板的世界。\n\n## 學習看正反兩面的意義\n\n如果把錘子線的反轉型態顛倒過來，又會成為什麼樣子？就變成了「吊人線」。吊人線就是在上漲的過程中，出現一根小紅線，這根小紅線下面有一根很長的下影線。當吊人出現時，我們就會懷疑盤勢即將反轉，本來是向上的趨勢，因\n\
    \n為吊人線出現了一根長下影線，所以我們合理認為，它要下跌了。\n\n但反過來講，上漲中一根長下影線，並非代表拉高出貨。所謂的拉高出貨，是在這一根線中，本來是要殺成長黑的，因為有某種勢力的拉抬，結果到了收盤的時候，只留下了一根長下影線。而這根長下影線，其目的並不是在真實的拉抬，只是嘗試暫時把股價維持在高檔以方便他們繼續出貨，於是這根下影線就變成多頭在盤中出貨的一個罪證。至於他為什麼要拉上來，只是想賣到更好的價錢，或者是提振士氣，以掩眾人耳目，造成股價跌不下來的假象，讓大家誤以為在高檔有上影線代表高檔有支撐，其實是一場誤會。這個盤中的拉抬，是他們用盡最後力氣故意拉上去，為了出貨而已，並不是在進貨。以上所講的，是吊人線某一種看法，而\n\
    \n## 圖 2 鏟子線若發生在上漲頂端，不論紅黑都稱吊人線\n\n![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_19_0.png)\n\
    \n這種看法是負面的。\n\n不過，我在這裡又要提醒各位了，K線既然是不確定，那麼它一定有另外反向的解讀，就好像我送玫瑰花一樣，必有一個反向的解讀，那就是我小氣買不起昂貴的禮物，只好買玫瑰花。\n\
    \n任何一件事情都有其負面解讀；任何一個基本知識之所以為基本，就是如果它進了階，就會跳出來另外一種解讀的方式，有時候這種解讀是跟原來的言論完全相反。在此，上漲過程中出現了長下影線，可能是多方在尾盤發現今天要收黑棒了，既然收了黑棒，某些股票可能會出現低點，於是他們就真的大力買進。他們只不過就是奉行一種原則，叫做多頭市場逢拉回就是買點，於是那天本來要收黑的，結果沒有收成，留下了一根長長的下影線，代表著：未來的趨勢還是繼續上漲。這就跟原來看見吊人線而直接看空的結果相反。這兩種態度，一是正面的角度，另一則是反向思考。\n\
    \n## 搭配型態學和平均線才厲害\n\n礙於篇幅，在此無法詳述每一種基本K線，那恐怕要增加將近三百頁，出版社不會允許的。\n\n基本K線，就好像一支手錶或一條領帶，並不能夠顯現出一個人穿著的品味，還需要與其他衣著搭配，像是上衣、腰帶、褲子、鞋子、公事包，乃至於髮型、眼鏡，還有皮夾\n\
    \n……才能夠比較展現出一個人的品味。即使觀察到這些以後，我們還不能夠確定這個人的身分背景，得進一步參觀他的辦公室長什麼樣子，然後再去看他的家裡長怎麼樣子、他的臥室長什麼樣子、他喜歡的人長什麼樣子……林林總總全部加起來，有了大致的輪廓之後，才可以講：我們開始了解這個人了。\n\
    \n基本上，K線只是短線的一種記錄符號。至於它的整體趨勢，不論是長線、中線或是短線，都有賴於與其他工具做搭配，例如型態學、平均線、成交量等。總之，在做短線的時候，不能夠像做中線或長線那樣只把關愛放在一個單一指標上面，這是不行的。做短線時，必須四大工具（K線、型態學、平均線、成交量）一起上，四方面的知識融為一體，靈活運用，才能够解決問題。\n\
    \n以錘子線為例，如果我們不能夠確定這根錘子線的買方到底在想什麼，此時，就要注意錘子線附近有沒有重要的平均線，如果平均線在錘子線下面，而一根長下影線剛好又抵住下方的那一根平均線，我們就有比較多的理由相信錘子線的下影線在平均線的地方得到了支撐；如果倒過來，平均線是在錘子線的上方有一段距離，那麼我們就要小心，這根錘子線只是小小的反彈去測試上面的那一根重要的壓力線而已，而那根壓力線的勢力可能會很大，壓制住錘子線的反彈勢力。尤有甚者，錘子線的買方恐怕就是在看到上面那一根\n"
