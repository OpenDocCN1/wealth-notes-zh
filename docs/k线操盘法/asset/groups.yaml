    ## 王力群 k線操盤法


    大概在8400～9200之間做震盪，如果有邪惡的第五波，那就是5月26日到6月8日的高點9209（附帶說明一下，第一波只有一天，就是5月5日的一根大長紅，俗稱一日行情）。


    2000年6月27日這一根黑棒，在我眼中，等於默默宣告未來3年台股空頭時代的來臨（2000～2003年）。


    通常盤勢在橫盤時，嚴格來講，我們不應該知道它到底是在做頭還是在做腰，如果橫盤做頭，將來就是下跌；如果橫盤做腰，將來就會是上漲……到底是哪一種？如果要預測的話，可不可以？有經驗的老手會勸你少預測，或者是根本不要預測，因為我剛剛講過了：一般人自以為的獨立思考，其實只是機器人式地隨意組合觀念，也就是隨機抓藥的配方，錯誤機率非常高（如果單純就思考方式評論，這種思考方式本身就是一種錯誤），所以不要亂猜底部、亂猜頭部。但是有時候，頭部跟底部的訊號確實非常明顯，很容易預測正確，雖然這種「非常容易預測正確的機會」不是那麼容易發生，但散戶只會挑軟的柿子吃，他們只會記得那些容易的機會，然後把大部分預測困難的時光給疏忽掉了。


    2000年締造了兩個高點10393跟10328之後，股價當然可以整理，但是不可以整理太久；整理久一點也沒關係，但是不可以被跌破。我們從兩個角度來分析跌破，第一個是不可以跌破重要的均線，第二個是不可以跌破箱型整理區，結果，指數在5月跟6月長達2個月的橫盤整理之後，在6月23日、26日、27日的三連黑下跌中，破了年線，同時也跌破了所有重要的中期均線——以上是技術分析（詳見圖39、圖40）。


    自從天安門事件（1989年6月4日）之後，很多台商把資金從大陸撤回台灣，差不多過2年之後，才重新陸陸續續回大陸探門路，這一股資金流經過十年的醞釀，終於在2000年突破，也就是在那一年，台商開始大量投資中國大陸，西進政策全面爆發（李總統提出的南進政策則冷冷清清）——以上是我認為最重要基本分析。


    K線本身是短線，兩根長黑就比一根K線的格局要大一點點，三根K線就更大一點點，K線愈加愈多，格局就愈來愈大；K線愈加愈多，也就愈來愈像型態了。當我們分析單根K線時，原則上可以依照自己的操作路線來做K線數量多寡的取捨，但通常我不會那樣做，而是把所有的格局從大到小都考慮一遍，防止有沒看到的敵人埋伏在暗處。因此，在前述案例9的2000年2月22日的這根K線，我使用了基本分析，因為它是很關鍵的K線，牽動了大格局；格局愈大，牽扯到的基本面就愈多。


    在操作的過程中，我始終會保持一點基本分析的覺知，不會任意放棄基本面的知識。如果是短線，那麼，有時候基本面並不是不需要去看，而是看了以後不需要管，因為有時短線的當下氣勢很強，它會延緩長線效應的到來。


