    ## 王力群 K線操盤法


    時代那樣天天做功課，才重新開始吸收資訊、學習知識。殊不知，過去在學校裡是一個小圈圈，資訊範圍出不了考試卷界限，但在現實世界中，最重要的並不是辨別資訊對錯的問題，而是要確立正確知識與有價值的資訊來源管道。然而，過去在學校中，這個來源管道已經幫你確定好了，就是課本與老師，或是考試卷與教育部，學生不必再花腦筋去自由選擇。等到進入成人世界後，所有的知識、資訊向我們湧來時，多數人還是跟以前在學校一樣，誤以為凡是資訊必有其價值，所以他們非常執著於解讀資訊，而不是先開闢一條正確的管道，以方便讓正確資訊循著這條軌道而來。群眾並不清楚天高地厚，誤以為資訊的領域就像以前的考試卷般，再大也大不過一張桌子。


    不論股市是不是在做頭，左右兩個高點相隔14天，也足夠讓一般人昏迷過去，因為資訊太多了，這是一個沒有遊戲規則的世界，各路人馬、各大門派、妖魔小丑、紳士淑女、富翁窮人……全都聚集在一起混戰，如果自己沒有一套過濾資訊的系統，勢必被資訊淹沒，而構成這個系統的，恰恰又是知識本身。換句話說，就是你以前在學校裡面應該學到的東西，但老師從來都不教。老師幾乎不會跟你講一個正確的人生系統是什麼，他們會叫你看很多書，不過，他們可能自己也不知道，一個具有嚴謹的科學邏輯的知識認知系統應該如何建構。


    在這半個月中，有兩件事情很重要：第一，要記得前波高點在哪裡；第二，在這14天中，有許多新的資訊會占據我們的腦海，讓我們忘掉原來原本知道的重要事項、忘掉前波高點在哪裡。或是說，前波高點變模糊了，或是我們變迷糊了。


    股市操作，本來就是一門學術、一個很正式的知識領域。在知識運作的時候，我們憑著記憶力讀取資料，記憶力一旦被混淆，讀取資料就會產生錯誤，這就好像你有一個檔案放在C硬碟，結果你在D硬碟中找，當然找不到。


    記得什麼東西在什麼地方，以及記得哪個地方曾經發生過什麼事，當時自己又是抱持怎麼樣的信念……這種態度就是一種負責任的歷史精神。


    學習股市知識，不論是K線分析或型態分析，腦袋裡都要記得之前重要事件的數字及圖形。歷史的記憶是扛在我們的肩膀上，或者說，我們的思想、甚至整個人，本來就是歷史的產物，無法自絕於歷史之外。如果一再地在世俗的訊息大海中被淹沒，那麼，最重要的是「重新喚起自我負責的歷史精神」，而不是認為「我沒有錯，錯是錯在這個資訊騙了我。」這類事情每天少說也有幾萬件，本來就是常態，而不是異狀。如果你把它當成異常狀況，認為是資訊本身出了意外，而不是自己還陷在老舊深淵中爬不出來，那麼，這種人就是一個沒有歷史的人。


    一個沒有歷史的人，很容易在現在的當下被短線給誘惑而迷失。


