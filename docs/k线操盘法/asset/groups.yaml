    上升孕出線，前 moniter我講的就是下降孕出線（孕育線又稱孕出線、母子孕育線）。不論是下降的孕育線還是上升的孕育線，都是以母子型態為主（長的是母親，短的是小孩）。


    # 你不知道的孕育線


    為什麼大家會對孕育線有如此高的興致？因為下降孕育線發生時，趨勢由跌反轉，成為漲勢的可能性「相當地高」。於是，同學普遍會做第一個動作是：要求孕育線的「嚴格定義」。定義愈嚴格，他們認為操作者就會看得愈清楚，也愈能夠經由嚴密的科學定義，了解這根K線到底是不是孕育線，如果確定是下降孕育線，不但空單要回補，還能反手作多。


    由於孕育線是很好的止跌訊號（印象中，它確實是滿靈驗的），大家就愈要求它的「嚴格定義」，這樣的動作算不算錯呢？在別的班級，我不敢說，但在我授課的班級，我必須明確地說：正如之前幾篇文章提到的，嚴格精確的K線定義並不能夠幫助你進一步了解K線。


    有人就問，怎樣才能進一步了解K線？我的建議是，不單要從K線下手，還必須從它周遭的環境下手，包括平均線、型態學、量價分析等。如同你想更了解一個人，可以從周遭的環境下手，例如他的成長背景、他的求學經歷、他的人際交遊、他的職業工作，以及他最好的朋友對他的看法……這'
  - '[PAGE 66]


    些查訪的工作，都是進一步了解這個對象的必經流程。


    # 從歷史統計機率？


    # 不可以！因為格局不同，方法也不同


    除了要求孕育線的嚴格定義外，很多人會進行一個自認為「屬於科學的實驗」，就是把歷史的孕育線找出來，再觀察這些孕育線將來上漲或下跌的可能性有多高，最後做一個統計，我以前習慣把這行為叫「跑報表」。當然，報表做出來以後，統計出（孕育線出現之後）上漲機率，我們希望能夠達到七成以上（以短線而言）。


    在某些年代，確實可以發現靈驗度達到七成以上的「上升孕育線」，同學因此受到了鼓舞，認為王老師教的孕育線真的很棒！但同學不曉得的是，如此一來，大夥會掉入一個窠臼，誤以為所有K線都要經由這樣的「統計」方式去找出它的上漲或下跌機率，也就是用數學統計的方式確認其價值。


    # 這種方法好不好呢？給各位一個明確的答案：不好！


    格局愈大，意義就愈明確，如果格局愈小，操作的周期愈短，要把事情做得好就變得不簡單，因為愈是短線、愈是操作周期短，裡面的轉折變化就會非常多，此時，如果我們依舊按著大格局的理想去切入短線，勢必會遭受許許多多的挫折。


    舉個例子。就人生的長期目標而言，我們要吃的食物必須'
