    # 王力群 k線操盤法


    率稀少所引起的时间感覺。


    有的人認為人應該「無憂無慮」過一生，而後再把它引伸擴大解釋為「無思無想」過一輩子。無思無想本來是叫你休息，應該趁這個機會減少妄想，去體會自己的本來面目，結果變成腦袋一片空白；本來應該浪漫天真的，卻變成渾渾噩噩，痴痴呆呆，對於當下的一分一秒沒有太多感覺，當然也就不能夠體會每一分每一秒的珍貴性，時間在他身上就被浪費掉了。


    1月3日之前的這17天，短線操作者大概都很難過，覺得度日如年。某些長線操作者乾脆不理會，就這樣抱著股票準備過年，好像時間會幫他解決問題，總認為只要等得夠久，股價終究會上漲。這種觀念從某個角度來講是很危險的，而這種人的思考習慣也<|message|>


    雖然因為減少思想而同時也減少思慮的憂煩，但也因為把思想拿掉了，而錯過鍛練思想的機會、忽略潛意識中的細節、缺乏對自己更精微深入的發掘，以致於愈活愈遲鈍，很容易不小心成為一個對時間麻木無感的人。


    研究K線，如果走對路，就會憑著豐富而深入的思考，了解K線的奧義；如果走錯路，那麼平凡冗長的思考過程，就容易走火入魔，引起許多不必要的觸發聯想，也就是妄想叢生，接著再由妄想引發錯誤的行為。我看過很多人就是這樣，明明很用功地研究K線，結果竟學到了一大堆錯誤的知'
  - '[PAGE 225]


    識，或者讓自己潛在的劣根性統統都發揮出來……各位，到底是要用功好呢？還是不要用功呢？


    任何事情都有正反兩面，有優點者，必有缺點；有缺點者，也必有優點。優點跟缺點是同時存在於同一件事物上面，只是分量的大小不同以及觀點的相異。過度執著於優點，容易犯自大的毛病而產生疏失；過度執著於缺點，則容易犯自卑的毛病而產生退縮。在正反邏輯的相互印證之下，邏輯系統的立體架構才可以成立，否則永遠是單線條或是扁平式的平面思考，不但沒有結構，一旦引伸出去，一維跟二維的思考比起三維，引伸出來的錯誤不知道多了幾百倍、幾千倍！


    天底下的事物，包括人，都是混合物。每個混合物都有各種參數不同的物質或非物質組合而成。不同的參數形成不同的維度，各種不同的維度交錯以後，形成立體結構的網狀，這就是我們知識系統的雛形。時間不過只是其中一種參數而已，但這個參數只要一變動，就會影響到系統內全部的東西。同樣道理，系統內其他的东西如果有變動，也會影響到時間，但是因為人類比較宇宙起來實在太小了，所以我們常常不管怎麼努力，都覺得沒什麼改變，這是因為改變的幅度太小，人類的感官系統沒有辦法去感覺而已，並不是真的完全沒有。


    一般人往往有一種錯覺，以為每一個事物互相獨立而不相'
  - '[PAGE 226]


    干預，這種觀念會使我們被困在封閉系統之中。


