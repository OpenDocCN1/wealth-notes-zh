    # 盤後練功


    在20個步驟中，操作者除了同時思考中線與短線之外，還要注意一件非常麻煩的事，那就是「如果沒有在標準的進場點進場的話，那該怎麼辦？」這種問題相當於「如果你考試只差0.1分就上榜，那該怎麼辦？是破例把你保送上榜呢？還是鐵面無私，請你下一次再來？」


    在世俗人的嚴肅邏輯中，恐怕是明年再來，但是在股市中，卻無人願意被如此苛刻對待。所以我的建議是：操作者如果錯過了第一個進場點，則要把握第二個進場點。不過，台灣人在以往所受的教育，所有問題都只有一個答案，只有最好，沒有次好。這種思考方式，把大家訓練成為完美的理想主義者，很多人有此完美理想，自己卻渾然不知，就像中了慢性毒。


    在此容許只有一個答案的狀況之下，絕大多數的人錯過了第一班車之後，就好像媽寶一樣，不知道該怎麼辦，這也是我在教授K線時發現的大問題。其實，解決問題的方法很簡單，要不就多等一天，要不就等下次的明顯訊號再來，但我相信大家比較會接受「多等一天」的策略吧！


    ## 3-7


    ## 經典案例解讀（一）


    做K線那麼多年，尤其是1998年8月台股加權指數期貨開跑之後，K線的操作生涯更是難忘。現在，我就把一些很經典難忘的案例寫在這裡，供各位深入領會。


    # 案例1


    1998年4月9日收了一根大黑棒，開高走低下跌173點，在這之前的7日跟8日是收高檔兩顆星，換句話說，漲勢已經停頓兩天了，而且在更之前的4月3日跟4月4日都是收跳空紅棒，市場人心大為振奮，認為股市將要再度上萬點。當時，有一位做股票很多年的大哥告訴我：不要怕利空、不要對股市感到失望，要從容布局……他那時候買了很多，自認為是很成熟的企業家，所以來訓斥我這個年輕人。但是4月9日的那根長黑「很明顯」是三尊頭的右肩成型的訊號，三尊頭的左肩在2月27日的高點9378，中間的頭在3月17日的高點9165。後來，第二天4月10日收雙烏鴉，再過一天，4月13日大跌190點，成為三烏鴉，詳見圖23，到年底一共跌了4000點，詳見圖24。


