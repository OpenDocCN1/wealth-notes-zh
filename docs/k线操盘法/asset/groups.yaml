    # 王力群 K線操盤法


    的、被污染的，例如，追求功名利祿、追求金榜題名、追求升官發財、追求考試第一名、追求比賽第一名……在俗世中，這種觀念很流行，但絕不是真理。於是這樣一來，人民就被弄糊塗了，因為進社會久了以後，就會被世俗觀念所污染，殊不知，這個從小把我們養大的社會世俗，恰恰就是殘害我們思想的幕後真兇，我們長大了以後卻喊他娘。


    股市中有許多道理，尤其在短線，我們可以經由充分的實戰訓練，澈底體悟到這些人生真諦，像是否極泰來、物極必反、居安思危、危邦不入、亂邦不居、潛龍勿用、亢龍有悔、後發制人、大死大悟……這些道理，建議投資人有機會的話，最好要慢慢學到。當然，最好要有那個機會。


