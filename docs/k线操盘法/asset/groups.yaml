    後來，第二天12月8日收雙烏鴉，12月9日跳空下跌收三烏鴉，之後這個盤就跌到5000多點去了。原來，市場利用選舉利多的消息拉高出貨，於是在短線或中線上變成了大跌。至於這個利多事件到底是真利多還是假利多？答案是：它只能決定長線而無法決定中線與短線
    —— 這點非常重要，請讀者一定要了解。總之，愈大的事件，往往只能影響愈大的格局，卻在中線跟短線上淪為有心人操弄的把柄，而這些操弄往往可能是反向的操作。


