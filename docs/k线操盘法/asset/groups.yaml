    ## 圖 45 2001年12月15日以連三紅突破所有重要均線


    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_199_0.png)


    日，又創了新高，但也不過是6048點而已，比2個月前的高點只多了200點（詳見圖45）。它確實有進步，但進步地如此之慢，讓人不禁納悶：這種進步其實是一種退步！


    接著，最想不到的事情發生了。從2002月2月18日開始，電子股產生大暴跌，這下子可好了，因為在12月5日買股票的人，大部分都是買電子股，沒想到3個月之後，新高沒有多高，卻發生了猛烈的跌勢，於是之前買進的大量股票部位，除了金融股之外，大多損失慘重。


    再回過頭去看看12月5日那一根紅K，確實是多頭啊，沒有問題啊，為什麼會這樣呢？一切問題都出在「K線本身只是個短線，但是在配其它訊號的同時，K線會誕生新的意義」，因此，在中長線也有了它一席之地，就是這種多重身分的重疊，一個人在不同的三個領域具有三個不同的定義，使得神經比較大條的操作者無法接受這個事實。在他們的想像中，漲就是漲，跌就是跌，如果漲是曲折離奇地上漲，那就超出他們的思考範圍了。


    在預測法中，大家都把預測想成是「預測結果」，很少人會把「預測過程」也包括進去。舉例來講，春嬌跟志明談戀愛，如果預測結果的話，只要預測他們將來會不會結婚就好；反觀如果是預測過程，就要把他們兩個談戀愛的過程到底是痛苦還是快樂，也要一併預測出來，如此一來，難度就升高了，而難度到底升得有多高？答案是：高得難以想像！


    在股市中，大多數人口頭上是要預測結果，但實際要能夠把過程也能預測正確，才能夠滿足絕多數投資人的胃口。因為如果過程充滿了艱辛困苦，一般人是熬不過去的；就算知道那個結果，最後也到不了，這就是俗話說的：「眼前有一塊肥肉，看得到，吃不到。」


    不論是在股市或是在人生中，都充滿了這種誘惑。許多事情都是看得到吃不到的，一般人卻誤以為，看得到的東西就吃得到，所以就讓自己的人生充滿了痛苦，這都是因為觀念上的無知啊！


    ### 案例14


    2002年9月17日，收一根大長紅，上漲176點。在前一天，9月16日收一根中黑，大跌123點，嚴重失守十日線。本來以為要繼續往下破底，但依照我的箱型震盪法則，這個地方應該有一個反彈，而規模是跟9月9日到9月11日的那個小反彈一樣，或者更大些。換句話說，在這個地方出現了一個非常好的短線搶反彈機會，我的短多單也就興沖沖地進場了。


    通常一個箱型震盪整理波，是在出現邪惡的第五波之後才掉下去的，所以第三波是一個很好的搶反彈契機。9月17日就是這樣的機會，是一個非常標準的短線反彈格局，也很適合做隔日沖。


    沒想到，9月18日開盤就開得很低，中場大跌151點，讓我


    這一張搶隔日沖的單子蒙受不小損失（詳見圖47、圖48）。在非常有把握的狀況下遭到這種損失，感覺真是複雜。


    做短線，一半靠運氣，一半靠技術。話雖如此，但很難領會到什麼叫做運氣。大致來說，技術跟心理要成熟到某一個程度之後，我們才能比較真切感受到運氣的存在。換個例子來講，就像練武功一樣，功夫必須要深到某個境界，才能夠感受到體內真氣的運行。所謂真氣的運行，其涵義就是運氣，也叫氣運。


    運氣有分為好幾種，較常見且容易理解的有三種，第一種是天生的運氣，此類運氣是前生注定，這輩子來驗收成果的；第二種是這輩子的後天努力，以現在的年輕人來說，大概就是你過去30年功力的累積，會形成一股氣運，這是屬於中線；第三種就是在當下對於氣場的即時感受，這需要敏銳的觸覺，而敏銳的觸覺更仰賴於當下身心的正確平衡感。


    以上三種運氣在短線操作中，大概占了50%的成分，分量不可謂不重，但大多數的人感受不到，多數人會很單純地認為技術成分在短線的成分很高。其實，技術成分才占不到一半，甚至有的人只占了三成到四成而已。少數操作者會有這樣的錯覺，是因為天賦的氣運在作祟，但他自己不知道，誤以為是他今世努力的後天成果，殊不知那是一種天賦；對於今世而言，過去世的遭遇與努力，只是一種莫名的無形氣


    場，自己沉浸在其中卻不自知，反而還常常受到愚弄，形成我們常說的「隨機致富的陷阱」。


    9月17日當天的感覺是太有把握了，那種純粹的感覺，要練到成熟是很困難的，原因是「格局的大小」。在大格局中，正確的判斷仰賴於全身智慧的發揮，不容許大錯誤的發生；但在小格局中，因為難以掌握的因素太多，常發生「後天的功德無法蓋過先天運氣」的狀況，所以對於短線的失敗，必須要練到一笑置之的坦然接受，才是正道。


    總而言之，9月17日當天的交易，到了9月18日就慘敗了。在金錢的輸贏上，這是一筆短線的交易，也是一筆短暫的失敗；但在失敗的理由上，它是深遠而長久，後來經過了許多年，我都常想到那一天失敗的隔日沖。


    在中線格局中，9月17日的K線是在所有均線底下，空頭氣氛濃郁，在這樣的氣氛之下搶反彈，失敗了當然要認命，但問題是：一旦過度自滿的信心以及對於技術的執著過於堅韌的時候，那就不是那麼好認命的了。


