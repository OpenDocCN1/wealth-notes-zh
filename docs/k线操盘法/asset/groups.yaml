    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_169_0.png)


    # 群眾經常是盲從的


    在上述的案例中，各位不難發現，我把「很明顯」這三個字都用引號給標註出來，表示這些情況都是顯而易見的。不過，在那個當下為什麼會放這麼明顯的訊號呢？答案是：訊號之所以這麼明顯，一定是因為那個訊號被大多數人忽視，而忽視的原因就在於「他們認為有更重要的訊號已經出來」。這個重要的訊號往往就是「當下共同的大潮流」，也就是「大家現在正在做的事」——
    目前最多人正在做的事情，不但形成了潮流，更聚集了一股非常強大的力量，把我們帶到某個方向去。就算我們不想去那個地方，也因為人在江湖身不由己，難免會被大潮流推著走。我們愈是想要違抗潮流，愈需要清醒的理智及強壯的體魄。


    雖然有這麼明顯的訊號出現，但大家看到以後都沒有反應，因為都跑去注意別的地方。由此可知，群眾的看法經常是錯的，唯有正確的理性才是終極的依歸。問題是：絕大多數的國民對理性缺乏正當的了解，他們可能認為只有學哲學的人在談理性，更遑論在各種艱難困苦的挑戰中，維持自己清醒的理性。


