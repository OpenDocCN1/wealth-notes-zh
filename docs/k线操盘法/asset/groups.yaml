    ## 王力群 k線操盤法


    大了。不過，就大資金者而言，更低的價格可能不是用來做賣出的（詳見圖12）。


    分析，最重要的是依照長中短線把資料分類，如此一來，原資料的強度可能會變化 —— 這也是目前一般操作者最弱的地方，因為不知道什麼叫做長線。不知道的原因是沒有受過那樣的知識訓練。


