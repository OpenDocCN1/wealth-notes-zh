    # 會騙人的

    統計學


    很多同學進入我們班之後，首先發生興趣的不是三連紅，而是孕育線。


    所謂的孕育線，就是在跌勢之後出現一根比較長的中長黑，接著在第二天開高走高，最後收一個小紅線，但小紅線的收盤價並沒有高於前一天中長黑的開盤點（詳見圖6）。


    基本上，孕育線有兩種，一種叫下降孕出線，另一種叫


    # 圖 6 反轉型態：孕育線


    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_64_0.png)'
