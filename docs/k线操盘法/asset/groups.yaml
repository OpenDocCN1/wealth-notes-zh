    ## 案例9


    2000年2月22日，一根黑棒跳空大跌180點，這是一根令人絕望的K線，不僅粉碎了台股站上萬點的希望，也暫時重擊了中華民國邁向康莊大道的期待。


    這一年的3月19日要選總統，國民黨是連戰，民進黨是陳水扁，還有一個宋楚瑜，其中最有希望的是宋楚瑜，但李登輝給他搞了個興票案，加上反國民黨政權的勢力已經成熟到一個高峰，所以大趨勢是傾向於「換人做做看」。


    不管怎樣，當時選舉的氣氛非常熱烈，從1999年的12月21日，7800點開始上漲，一直漲到2000年的2月18日，創下高點10393。當然我的心情也是很樂觀，認為隔了十年，依照景氣循環理論，台股這一次應該有機會站穩萬點。而且我還自己發明了一條技術分析，那就是「一個醞釀了這麼久的漲勢，頭部應該很大，應該不會這麼快下來才對」。這個觀念是我自己想出來的，為什麼會有這樣的想法呢？事後檢討起來，很可能是因為我有了樂觀的成見，所以才去尋找樂觀的理由，而且還自己發明樂觀的理由。這真是令人毛骨悚然的恐怖推理啊！


    我為什麼會如此輕率地預設立場？這是我的不對，我本來就不是一個會盲從群眾意見的人，所以這一年對高點的預設立場並不是跟隨大潮流的結果，而是在思考時犯了輕率的毛病。我的意思是，我不是因為複製別人的意見而犯下錯誤，而是自己在推理時太過草率而犯下錯誤。


    人的思想，如果背後沒有一個堅定的信仰、沒有一個正確的思考系統、沒有一條橫跨中長線的人生目標（就像筆直的高速高路），那麼，他的思想就會變成沒有骨幹的血肉碎片，或是像在天空中飄浮的灰色雲朵，不是支離破碎，就是漫無目的，成為一種脆弱的心智，不但容易盲從，自主運轉時更容易犯錯。


    沒有獨立主見的人，他們自認為的理性思考，往往是從一堆零碎的材料中胡亂組合，就好像看病隨機抓藥一樣，他們自認為是理性，其實背後是某種不匿名的潛意識在操控，這種潛意識會在暗中支配操作者在
    appropriated 大腦中自我合成許多新想法，可惜這些想法大多是錯的，只是因為外界有許多社會習俗，這些想法才能夠得到一些修正；若是沒有了這些社會習俗做第一條防線的規範，這些隨意合成的拼湊觀念，將會更失控氾濫。在股市中，這種情況超級明顯，可惜因為我的愚笨，所以比較晚才發現。


    不論是複製別人的觀念或是自我隨意組合新的觀念，都類似機器人的思考行為，換句話說，這不是我們本性的發揮。佛教禪宗說的開悟，悟的就是那個本性，如果不悟那個本性，或是沒有發現那個本性，就沒有辦法真正接受理性教育的有效訓練。所有學習或被灌輸的知識，不是大打折扣，就是全部歸零，有的人還會發生極大的負作用。在2000年，這個觀念才剛剛開始在我腦海中成熟，因此我真的算是比較晚才覺悟。


    2000年2月22日這一天，跌破了2月15日的低點9853，這個9853可說是一個小型頭部的頸線，當它在22日一被跌破，我的心突然冷了一下，感覺到有點不對勁，因為前一天的21日已經是中黑破十日線，22日可以橫盤，但是不能跳空下跌，結果它竟然是真的跳空下跌，刹那間我腦袋一片真空，持續了大概5秒鐘，然後我醒了過來，把所有的股票賣掉，結束了從1999年春天以來，長達一年的多頭市場的操作（詳見圖37、圖38）。


    後來，陳水扁當選了總統，台灣開始了另一個新時代，但是這個新時代究竟是上漲中的暫時拉回？還是像傳統中國一樣來個大橫盤，一橫就要橫許多了？……


