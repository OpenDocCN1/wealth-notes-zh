    我們接觸的大部分書籍，以及我們所熟知的一些人物，都不是我們所想像的那樣子，因為隨時隨地都在變。在這裡，我們先暫時不談別人是怎麼變的，而是只談我自己。對我而言，我雖然有了自己的系統，也願意努力上進，但是我卻沒有很高強的能力去處理在俗世中碰到的所有問題，每個問題都很可能耽誤我的進度、阻礙我的學習、破壞我的成果，搞到最後，即使自己原來有一個正確的系統，也會被自己親手搞砸。


    到了這個程度，我才隱隱約約體會到康德所講的理性是多麼艱難。在俗世中，大多數顯露在外的知識，只是像孔雀開屏的羽毛，是懷著某種不純正的目的，偏偏就是沒有知識本身原始的追求樂趣。無怪乎，那些人到最後都會背叛自己原來的信仰，因為他們的信仰原來就殘缺、不堅固，甚至沒有信仰！


