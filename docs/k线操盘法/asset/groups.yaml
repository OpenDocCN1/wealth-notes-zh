    股價線路圖」。這是技術分析最重要的中心思想，可是要遵守非常困難，因為它完全不帶感情，就好像是冷冰冰的法律守則，幾乎排除掉大部分的其他訊息，只專注在這個宇宙當下所呈現出來的一些現象。


    牛頓的萬有引律公式就是這樣，我們不知道為什麼會有萬有引力，只知道依照牛頓公式去計算萬有引力；同樣道理，我們不知道股價為什麼會變成這樣，但我們可以依照已經變成這樣的股價（股價形成了K線與型態及均線）去做分析，這就叫做技術分析，其中包含了K線分析。


    我想說的是：雖然是短短的17天，但是在非長線投資的投資人眼中，將近1個月的時間就如同半年，甚至10年那麼久。有的人會感到度日如年，有人會如坐針氈，如果他是抱多單的話……


    在古代的觀念，也就是在20世紀初之前，地球上的人認為時間是一種共通的尺度，不論在宇宙哪一個角落、不論在地球哪一個地方、不論是火星人還是地球人、不論是台北人還是綠島人、不論是股市投資人或是對股市一點興趣也沒有的人，對任何地方、每一個人，時間發生在他們身上的情況都是一樣的。換句話說，時間具有普遍的標準，不論我們怎麼做更改，都無法改變時間的尺度——這是古老人的舊觀念，包括牛頓也是這樣。直到愛因斯坦出現，這個舊觀念才被打破，原來時間不是不可以更改，而是一種會變化的東


    西。


    股市投資人之所以感到時間難熬，是因為在股市中，我們每個人身上的能量變動性都變得非常劇烈，也就是用不同方法、不同投資周期的人，他身上的能量的變化，比起股市之外的人要強烈許多倍，有人高達數十倍，甚至百倍。


    這些能量變化改變了我們的思想，使我們的思想變化程度跟股市之外比起來，波動更加劇烈。由於這個強大的變動，使得我們每個人身上的時間進行方式都受到了影響。原本應該珍惜當下的一分一秒，結果一分一秒是停下來了，時間尺度變慢了，因為我們的心思變得更集中、更單純，此時本來應該是更愛惜時間的，結果這一股聚焦的能量變得更鑽牛角尖，鑽進了潛意識的裂縫，不去探求埋藏在潛意識之中光明的那部分，反而被黑暗所誘惑，親近黑暗，然後在潛意識之中，不知不覺地被自己的惡業所包圍，然後不斷地觸發，妄想紛飛，錯誤的觀念一批又一批，猶如連環爆炸一樣。難怪這種人度日如年，感覺如坐針氈，如睡釘床。


    跟上面那一段相反的狀況是：腦袋裡面盡量少去胡思亂想，甚至根本就沒有什麼想法，有的人連正常的思考都省略，變成空白一片。時間對於這種人而言，就過得很快，有人就這樣子渾渾噩噩過了一生，從嬰兒呱呱落地，到躺在病床上一命嗚呼，也不過就是光陰似箭，白駒過隙，落葉飄零只不過在一瞬間，人生苦短
    —— 這就是腦袋裡思想發生頻


    ## 王力群 K線操盤法


    率稀少所引起的时间感覺。


    有的人認為人應該「無憂無慮」過一生，而後再把它引伸擴大解釋為「無思無想」過一輩子。無思無想本來是叫你休息，應該趁這個機會減少妄想，去體會自己的本來面目，結果變成腦袋一片空白；本來應該浪漫天真的，卻變成渾渾噩噩，痴痴呆呆，對於當下的一分一秒沒有太多感覺，當然也就不能夠體會每一分每一秒的珍貴性，時間在他身上就被浪費掉了。


    1月3日之前的這17天，短線操作者大概都很難過，覺得度日如年。某些長線操作者乾脆不理會，就這樣抱著股票準備過年，好像時間會幫他解決問題，總認為只要等得夠久，股價終究會上漲。這種觀念從某個角度來講是很危險的，而這種人的思考習慣也


    雖然因為減少思想而同時也減少思慮的憂煩，但也因為把思想拿掉了，而錯過鍛練思想的機會、忽略潛意識中的細節、缺乏對自己更精微深入的發掘，以致於愈活愈遲鈍，很容易不小心成為一個對時間麻木無感的人。


    研究K線，如果走對路，就會憑著豐富而深入的思考，了解K線的奧義；如果走錯路，那麼平凡冗長的思考過程，就容易走火入魔，引起許多不必要的觸發聯想，也就是妄想叢生，接著再由妄想引發錯誤的行為。我看過很多人就是這樣，明明很用功地研究K線，結果竟學到了一大堆錯誤的知識，或者讓自己潛在的劣根性統統都發揮出來……各位，到底是要用功好呢？還是不要用功呢？


    任何事情都有正反兩面，有優點者，必有缺點；有缺點者，也必有優點。優點跟缺點是同時存在於同一件事物上面，只是分量的大小不同以及觀點的相異。過度執著於優點，容易犯自大的毛病而產生疏失；過度執著於缺點，則容易犯自卑的毛病而產生退縮。在正反邏輯的相互印證之下，邏輯系統的立體架構才可以成立，否則永遠是單線條或是扁平式的平面思考，不但沒有結構，一旦引伸出去，一維跟二維的思考比起三維，引伸出來的錯誤不知道多了幾百倍、幾千倍！


    天底下的事物，包括人，都是混合物。每個混合物都有各種參數不同的物質或非物質組合而成。不同的參數形成不同的維度，各種不同的維度交錯以後，形成立體結構的網狀，這就是我們知識系統的雛形。時間不過只是其中一種參數而已，但這個參數只要一變動，就會影響到系統內全部的東西。同樣道理，系統內其他的東西如果有變動，也會影響到時間，但是因為人類比較宇宙起來實在太小了，所以我們常常不管怎麼努力，都覺得沒什麼改變，這是因為改變的幅度太小，人類的感官系統沒有辦法去感覺而已，並不是真的完全沒有。


    一般人往往有一種錯覺，以為每一個事物互相獨立而不相


    干預，這種觀念會使我們被困在封閉系統之中。


    2003年1月3日這根K線，讓我對時間的感覺有深一層的認知，從此以後，我看到許多投資人在時間的變化尺度中，因為不斷地去把自己跟其他參數隔離起來，讓自己成為孤立無援的獨立戶，以致於操作的旅途愈走愈窄、愈走愈孤獨、愈走愈喪失正常的知識……只不過，這些感受都是2003年以後的的事情，在這之前，我也跟善通人一樣，看不出這些混合物表相下那條分縷析的真相。


