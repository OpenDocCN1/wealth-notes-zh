    ![](img/61ecd8d7fbc6eaa3b468002a733c8f0e_118_0.png)


    刀劍，大聲喊叫：「你是漲假的，你騙我，我要砍死你！」當別的短線客已經跳上中線波段上漲的順風船，他依舊停留在原地，幻想自己還被困在震盪箱裡面，與劇烈震動的股價在做神聖的搏鬥（詳見圖11）。


    當最激烈的戰鬥已經結束的時候，這些不適應短線的短線客，把戰場移植到了自己的心裡面，讓自己活在自己的妄想中，與早已不在那裡的敵人繼續廝殺。上下翻飛的刀劍砍到了空氣，卻認為他將會紮紮實實地擊中魔鬼。


    ## 肉體為短線設計，心靈為長線設計


    人生就是震盪，就是一連串的考驗。如果沒有屬於自己一套正確的人生系統觀念，遇到一連串考驗時，可能會發生兩種狀況：一種是從一連串挫折中得到教訓，使自己成長茁壯；另一種是對世界上奇奇怪怪的打擊感到迷惘徬徨且不知所措，最後掉進虛無的深淵。


    現世生活中，隨手可觸皆是世俗。俗世裡有太多是短線，充滿著考驗，唯有通過了這些考驗，我們才可以升級，進入脫俗的境界。股市也是由一段一段的短線連接而成，就好像人體一樣，有108塊大骨骼所組成，我們總不能抱著自己的大腿說，這根大腿骨就代表著我，也不能對自己的老婆說：「妳只是我的一條肋骨而已。」


    表面上我們活在短線中，觸目可見都是小格局，那是因為


    人體被設計成需要應付立即的危機。例如，朝你奔跑過來的長毛象，還有馬路上失控的汽車朝你奔馳過來，此時你需要躲避。人體就是被設計成這樣的短線反射功能。


    短線的震盪見多了、習慣了、懂了、想開了，就容易放下。真正放下，才容易看得更透徹，才能夠真正適應短線這種反覆無常與喜怒無常，類似瘋子的行為。不了解的人把它叫做瘋狂，了解的人把它叫做考驗。通過考驗的人就會愈來愈正常，通不過考驗的人，如果不肯退出市場，有可能愈來愈瘋狂，陷入泥淖而不自知。


    在K線的世界中，許多短線的糾結只是為了中長線的熱身，並不是每一根K線都是為自己而打算，它們也會講究群體的共同目標，有時也有自己長遠的規畫與理想。但是，因為每一根日K線基本上就是當天發生的事情，以時間上來講嫌短了一點，於是它需要更多時間才能醞釀成熟。這種「以短線為根基，以中長線為目標」的風格，一般操作者很難了解，他們很難想像在無形無相的世界裡，這些價格的紀錄也會默默地追求一種比較長遠的趨勢。


    ## 做短線不是硬拚


    許多人，因為自己的庸俗，也把世界上其他人也看成是庸俗，進而認為支配這些庸俗人的天理也是庸俗。這種庸俗成了一種意識形態，不斷地框在他所經歷的每一件事情上面，


    包括了股市。


    於是，短線在他眼中就只是短線，每根K線都跟浮游一般，朝生暮死，每一根K線都是曇花一現……時間久了以後，在這種短線無常的閃爍變化中，因為缺乏永恆的真理貫穿其間，人就變得更容易失常，更容易迷糊，更容易墮落了。


    像2014年10月這種底部反攻模型或是高檔反轉模型，案例很多，只不過每個案例都需要時間養成才會成熟。然而，在養成的過程中，急躁的人視時間為大敵、視震盪為寇讎，固執地與市場站在不同的兩端，而不是順著市場。這種講究強硬個人風格的主觀，是與股市的自然大道相違背。


    不妨把自己想成一段浮木，飄浮在海上，不管潮水向東向西、向南向北，不論波浪怎樣上下湧動，都隨順往來，不強自做主。放鬆拳頭，而不用力；愈是放鬆，才愈能感受到這個盤真正的作風；愈是沒有雜念，才能夠順著趨勢的方向流動，而不是猜測下一秒的波浪要往哪個方向流去。


    ## 2-4


    ## 季節＋指數位置，

    掌握漲跌格局


    有人問我如何掌握漲跌格局？以下就以2015年12月4日的大盤來說明。


    就長線而言，先觀察外資的態度，不論是股票、期貨，都是持續買進或買超，加上國內也沒有經濟蕭條的慘況，所以長線沒有太大變動，差別只在於「現在是不是比較好的買進時機？」


    關於這點，可以從兩方面去想：第一個切入點是「季節」的觀點，也就是春夏秋冬哪個季節適合買進；另一個切入點則是「指數高低的位置」，現在是否恰當？對一般人而言，這就是所謂「摸頭猜底」——坦白講，底部在哪裡我也不知道！有時候我只管買跟賣，而不猜測市場的指數位置，我只是就著市場指數的位置去調整我的買賣策略而已。


    就中線而言，2015年8月24日的最低點7203，到底是不是當年的最低點呢？若不去猜測的話，7203還算是一條堅固的防線，如果7203被跌破了，也就是技術分析的關卡被跌破，


    依照我個人的方法，就要回頭看兩個因素，一是季節、二是基本面。不過，基本面向來都有遲到習慣，所以按歷史經驗來說，冬天的基本面基本上不會太好。


    再從短線上來看，2015年11月13日開始了橫盤震盪波，到12月4日已經第16天，快逼近21天的時空關卡（一個月交易日有20天，空間則是指橫盤整理箱），12月3日收一根小紅棒，力圖支撐，但12月4日禮拜五的跳空下跌，又把多頭的這一招給打回來。所以就短線而言，這裡是比較危險，有可能這個小反彈已經結束。這個小反彈是11月30日的低點8239開始往上反彈，其目的是回測被跌破的趨勢線或是試圖收復季線。12月4日收盤是小黑K帶一點點下影線，空中帶多，資料的清晰度不高。


    就短線而言，12月4日的開盤跳空下跌是一個空方訊號；就小型的中線而言，11月30日開始的小反彈到12月4日是第五天；就大一點的中線而言，8月24日的最低點7203是堅固的防線；再就長線而言，季節及外資的態度是目前主要的參考依據。


    收集了長、中、短線三條路線的初步結論之後，才能訂出從短線到中線的應對策略：如果你下星期一（12月7日）收得不好，則先挑戰9月30日的低點約8060，至於7203則是更遠的關卡。所以即使是作空，也只是短空而已。重要的一點是，如果短空做得不順，那只好回過頭抱怨季節的影響力太


    ## 王力群 k線操盤法


    大了。不過，就大資金者而言，更低的價格可能不是用來做賣出的（詳見圖12）。


    分析，最重要的是依照長中短線把資料分類，如此一來，原資料的強度可能會變化 —— 這也是目前一般操作者最弱的地方，因為不知道什麼叫做長線。不知道的原因是沒有受過那樣的知識訓練。


    ## 圖 12 2015年12月4日前的短中線格局


