  - 日课136 | 《倹省》解读1：追逐者的绝境
- - '####'
  - 1.简单道理
- - '####'
  - 2.追逐者
- - '###'
  - 第一个来源是跟别人比。我们时刻都想知道自己在社会中的相对位置，相对位置很多时候比绝对位置还要重要。我挣多少钱不重要，重要的是我比同事多挣或者少挣了多少钱。而且这个攀比还是常常在*上*比，这就是为什么奥运会银牌得主总是很不高兴。
- - '###'
  - 第二个来源是我们总是认为要想办成更多的事，就得动用更多的资源。我们常常忽略自己已经拥有的资源的价值。关于这一点咱们下次再说。
- - '###'
  - 第三个来源是，我们单纯就是想要“更多”。实验室里让受试者听音乐，你可以好好享受音乐，也可以打断音乐，听一段噪音——每听若干次噪音，你就可以赢取一块巧克力。研究者事先声明，所有巧克力必须在游戏结束后当场吃掉，不能带走——结果还是每个受试者都赢取了远超过自己胃口的巧克力。
