- - '##'
  - 周末放送｜既要《意会》，也要言传
- - '####'
  - 1. 看书名就知道，这本书围绕着“意会”这个词展开。所以，首先我们需要弄清楚什么叫做“意会”。
- - '####'
  - 2. 算法运用的正是客观的、可量化的数 据，也就说，今天我们面临的算法世界 放弃了“理解”。这是一个“理论终 结”的时代：
- - '####'
  - 3. 乍一看，“理论终结”似乎没什么不 好，我们可以省去很多麻烦，简单直接就 得出结果。事实上，从Google预测流感 爆发的例子中，我们就能看到，如果 不“理解”用户的动机，很难得出准确的
    结论。
- - '####'
  - 4. 拥护算法的人可能会提出反对意见，因为我们知道算法有一个技能叫做“深度学习”：
- - '####'
  - 5. 但是，“深度学习”并不能解决所有问题，尤其是在“研究人”这一点上。[日课165]中，我们引用了肿瘤学家穆克吉最新发表在《纽约客》杂志上的一个案例，关于深度学习并不能全面诊断黑素瘤。这个例子就显示出了人工智能的缺陷，和人类智能的机会。那算法不行，不就是数据不够吗？给它足够的数据不就行了！其实，这里包含的问题不是数据大小的问题，而是数据薄厚的问题。
- - '####'
  - 6. 这个复杂世界没法用量化的数据去描述，那是现阶段的算法不可能完成的任务。所以人类掌握“厚数据”的优势就显现出来了——可以利用“厚数据”来研究人。
- - '####'
  - 7. 关于“研究人”，[日课173]中提到的养老院照顾一位老人的故事，是一个很好的例子。《意会》这本书给出了六个意会的工具，可以帮我们学会如何意会：
- - '####'
  - 8. 考虑一个东西，必须考虑它的环境，其 实人脑处理信息，都不是处理抽象的信 息，而是把很多信息全盘考虑。这种全 局思维的水平，就决定了一个人的专业 水平。而要想成为专家，需要经历五级过
    程：
- - '####'
  - 9. 不过，成为专家并不是意会的最高层次，最高层次的意会是获得“洞见”：
