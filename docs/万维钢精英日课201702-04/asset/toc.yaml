  - 特别放送 | 放诸古今皆准的权力规则
- - '###'
  - 名义选民：在名义上有选举权和被选举权的全体公民。然而他们中的很多人，可能对当选领导人根本没有任何影响力。
- - '###'
  - 实际选民：那些真正对当选领导人有影响力的人。对美国来说这相当于选举这天出来投票的选民，对沙特这样的君主国来说这相当于皇室成员。
- - '###'
  - 胜利联盟：必须依赖他们，领导人才能维持自己权力的的人。对美国总统来说这相当于是在关键选区投出关键一票让你当选的人，对独裁者来说这是你在军队和贵族内部的核心支持者。
