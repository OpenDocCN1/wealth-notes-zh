- pgno: 0
  md: '提起网络大家首先想到 就是不需要拼爹；不需要技术过硬；不需要所谓人脉；不需要所谓风口；不需要融资烧钱；不需要阅历经验；不需要聘请一个漂亮能干的女秘书。


    ![](img/a0bc87da712b63b7926a2fc86fbe4e10_0_0.png)'
