- pgno: 1
  md: '+   1：什么是副业？【主业之外，另起一堆】

    2：项目选择思路【一针扎下去就能见到血的点】

    3：项目切入点【强调的是持续性和安全感】

    4：项目探讨【各种网赚项目眼花缭乱，其实无非这些分类】

    5：产品的选择【刚需、暴利、可持续】

    6：粉丝经济【流量在哪里，钱就在哪里】

    7：信息差【人类之中，但凡赚到大钱的，要么垄断，要么利用信息差。】

    8：虚拟运营之销售渠道避坑指南【要学会跳出思维框架去思考。不破，不立】

    9：资源整合【空手套白狼，一头整合买家，一头整合卖家】

    10：落地项目分享探讨【红利不在行业，而是在于营销】'
