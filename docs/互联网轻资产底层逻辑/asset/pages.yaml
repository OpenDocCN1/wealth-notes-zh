- pgno: 66
  md: '推广员类；此类项目，即是以类似中介的形式，帮助商家推广产品，从而获得一定比例的佣金，以淘宝客为代表。


    怎么说呢，这种形式对商家来说，是个好点子，本质上是计件分佣的 CPS 模式，成了单才给佣金，没有风险，且网民数量众多，相当于取之不尽用之不竭的“推广员”。


    但是，这对从事该活动的“推广员”来说，实在是很鸡肋。但凡推广商品，就一定要有客流量支撑，想拿佣金就必须持续引流，但话说回来，假设我有能力持续引流，干嘛还去推别人家的东西赚零钱？有那个能力，干嘛不自己当老板，起自己的盘，卖自己的货？


    这种模式，也就适合两类人群：一类是那种本身就拥有一a定流量来源的人作为副业来搞，比如各网站、各自媒体、各 IP、各文字工作者等；


    一类是那些拿到些蝇头小利就能满足的学生党、家庭主妇们，而且一般这类人也只能做一小阵子，等自身原始的流量（比如朋友圈）枯竭了，也就停了。'
