- pgno: 63
  md: '较典型的一种，类似枪手，关键词是：虚拟运营。


    各品牌或平台，想发展壮大，首先需要活跃人气，但没有知名度就不能有人气，没人气哪来知名度？这是个悖论，类似于：没有蛋就孵不出鸡，没有鸡哪来的蛋？


    所以就会雇水军，模拟真实用用户来增加活跃度带动人气，这种策略即是虚拟运营，会派出一些任务等人来做。特别是网游产业，看上去很多人玩，但其实是虚假繁荣，否则怎么诱惑你充值？


    这种项目，有很多人组建团队来做，类似刷 D 那种。本打算详细说说刷 D 这事，但骗子太多话题太敏感，就不多言了。


    # 5.薅羊毛类


    这个都各知道，就是到处占便宜捡漏，要的是一颗不嫌钱少、不怕折腾、持之以恒的心。一般是以各种“线报群”的形式存在，发布羊毛信息，当然也夹杂着广告。就像一场博弈，你把它当羊毛，它把你当韭菜，看谁揽的过谁；'
