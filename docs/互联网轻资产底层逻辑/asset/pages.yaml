- pgno: 89
  md: '但好景不长，突然有一天，跳出来一个流氓，说：别人用你家软件已经很给你面子了，你们竟然还要收顾客的钱？


    于是他也投资开发出一套杀毒软件，但是不收费，大家免费使用，还包升级，不仅如此，并且又花巨资在电视台打广告


    于是，瑞星、江民、卡巴斯基瞬间倒掉...


    这个好理解，因为他们的主业和产品被别人“免费”掉了，不死才怪。但问题是：这个流氓到底图什么？投资开发出产品却不去收费盈利，这不不符合逻辑啊。


    以正常的投资逻辑/盈利思维，很多人难以理解，360 软件本身它就不是用来赚钱的，事实是，人家是拿来“圈人”的。


    当所有电脑都装上了 360 软件，有一天当你杀毒的时候发现你的电脑跳出来一个弹窗广告，只要你点进去去了，360 就赚钱了。


    是不是似曾相识？'
