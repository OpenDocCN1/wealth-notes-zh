- pgno: 83
  md: "越想着随大流“跟上潮”，越容易沦为乌合之众。传统行业之所以迷茫艰难，正是因为已经被前人们硬生生搞成了红海，巨头 laboratory+马太效应。\n\n\
    即使产品暴利，即便你有钱、有经验、有资源，也是举步维艰。\n\n注意，现在已经 2022 年，淘宝、微商这些所谓“互联网行业”、“新兴行业”，也早已沦为红海，也变成“传统行业”。\n\
    \n也就是说我常说的：大路固然宽敞，地上有一分钱，也轮不到你捡，因为人潮人海挤破头；小路虽然孤独，一路别致风景，皆为你而绽放，因为没有竞争独自嗨。\n\n\
    一定要有“局部差断”的概念，打个比方：如果\trc  你卖“狗”，受众不但需要考虑：我需不需要一条狗？更要命的是他还要考虑：到底卖谁家的狗？\n\n但若你卖的是“像猫的狗”，受众不买则已，要买必买你，因为你在小范围内，实现了差断。"
