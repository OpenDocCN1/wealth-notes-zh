- pgno: 31
  md: '行成于思而毁于随，永远别跟风，要懂差异化。总在看别人，恨不得，哈都复制别人，生怕被落下了，永远无法脱颖而出，随大流只能吃剩饭。


    不要做着相同的事，却期待不同的结果。别总盯着大路，要善于走小路。大路固然宽敞，地上有一分钱，也轮不到你捡，因为人潮人海挤破头；小路虽然孤独，一路别致风景，皆为你而绽放，因为没有竞争独自嗨。


    捷径不是太过安全的大路，也不是太过冒险的小路，而是利用技巧的小路。


    越想着随大流“跟上趟”，越容易沦为乌合之众，操着卖白粉的心，赚着卖白菜的钱。


    如马云说：


    创业者都得靠自己走下去，如果信有人送你红利，基本上不会成功。'
