- pgno: 84
  md: '而且，这里讲的稀缺性，是以刚需性为前提的“蓝海”产品，脱离了刚需性，也就谈不上稀缺性，充其量算是“偏门”或“亚文化”，凡是偏门，一定不是刚需。防失联V:
    357607890


    另外，之所以追求稀缺性，也正是为了保证前文提到的暴利性，不稀缺，怎么可能暴利？


    # 可流通知（30 分）：


