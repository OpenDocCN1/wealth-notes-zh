    我知道有个人，雇了些人把“薅羊毛”这件事公司化规模化，再借助一些相关技巧和批量操作软件来实现利润最大化，2017年 AR 实景红包那会儿，一天就撸几千块，2018年的支付宝活动，几个月撸了
    80 万，21 世纪最啥？人才。


