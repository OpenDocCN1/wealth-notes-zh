  md: '理性探讨，说的比较直白，话粗理不粗，大家领会精神即可，如有冒犯，还望海涵。


    # 8.信息差类


    本质上就是出卖信息：你不知道的事，我知道，想知道吗？给钱我就告诉你。


    比如，怎样解决 XX 问题？如何实现 XX 目的？一般在技术领域、商业领域，以及咨询领域比较常见。


    我就曾经花五百元，向对方索取了一个某某自动发消息破解版权软件，对方动动手指，复制给我，五百元到手，这就是信息的价值。


    但前提是你得在某一领域内，掌握一定高价值的信息，能帮助别人解决某些实际的问题，有一定门槛。'
