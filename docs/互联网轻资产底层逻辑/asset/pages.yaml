- pgno: 26
  md: '# 互联网创业思维：我能搞定哪类项目的客流量？


    如果说传统生意思维是“正推逻辑”，那么互联网思维就是“倒推逻辑”，它不是从“赚钱”这个“结果”出发，而是从“流量”这个“起因”出发。


    它考虑的永远是，我能搞定那类型的“流量”？


    然后根据此种流量的属性去针对性制定设计相应的项目。


    流量是一切生意的本质，是所有商业行为的血液，不管线上还是线下。


    它解决的是“挟谁的钱”的问题。


    这种“流量思维”，正是互联网生意的精髓所在，在中国还没听说过“有流量却无法变现”的问题。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '有了流量加持，别说做正经生意，光收智商税都能发财，没有流量保证，任你产品一本万利，也依然孤芳自赏仅限自嗨。


    # 创业者分类：


    一般来讲分为六个梯队：


    操盘手梯队：此类人的关键词是资源整合。


    +   - 没钱？找有钱的合作；

    - 没技术？找技术人才合作；

    - 没产品？1688 网是干啥吃的？

    - 不会财务？雇个会计；办公室脏了？请个阿姨…

    - 核心工作可以分配股份嘞；外围工作可以外包雇人嘞。


    # 一句话：支个桌子组个牌局，我从中间抽水。


    项目失败了？'
