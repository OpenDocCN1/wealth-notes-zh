- pgno: 45
  md: '所以，格局要大，并非盲目“假大空”，而是一定要找到一个，一针扎下去就能见到血的点。


    除了盈利，其它层面都是浮云。

    挖不动的坑就别挖。


    要知道：高手做事，过程简单，结果粗暴，变数最少。


    其本质区别最重要的是：你的时间/劳动力只有一份，只能卖一次，而系统/信息是可以复制的，可以卖千千万万份。


    况且，靠劳动力赚钱，劳动力在收益就在，劳动力不在收益就没有，属于“青春饭”。


