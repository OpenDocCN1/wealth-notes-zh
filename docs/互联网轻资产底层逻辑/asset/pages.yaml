- pgno: 80
  md: '中国网民已经见底，能上网的都上了，虽然保有量庞大，但增幅放缓不再粗放，野蛮增长的红利期已过。所以，我们就需要：最大化利用流量，使其以一当十，让每个流量都值钱，产出最大价值。


    只有高客单价的暴利产品，才能做到这一点。可能比较抽象，那就来打比方：假设你有十万个流量，你的目标是赚一百万，怎么办？


    是让这十万人，无差别每人掏 10 块钱容易？还是从中筛选出一千个比较投缘的人，每人掏 1000 块容易？当然是后者。


    销售额=流量*转化率*客单价，既然流量吃紧，那就从转化率或客单价入手，同样吃香喝辣，这就是选择高客单价暴利产品的意义。


    注意这里讲的“暴利”，是以“高客单价”为前提的暴利因为，暴利又分为“伪暴利”和“真暴利”；'
  merge: -1
  img_proc: true
- pgno: 81
  md: '前者是由于产品价格的低廉，过于“不起眼”，而造成“受众懒于、羞于或不屑于去计较、追究其实际成本”的现象，展现出“伪暴利”的特征。


    举最常见的例子：十几块钱的老醋拌黄瓜，二十块钱的奶茶，都算是很“暴利”；后者是由于产品本身的刚需属性和稀缺属性并存，并带有强烈的信息差色彩，从而展现出“真暴利”的特征。


    举例：偏僻地段的修车补胎，高端人才的中介猎头等。


    谈到暴利，很多人乐于举一些“伪暴利”的示例，纯属抖机灵。


    因为此类“暴利”，没有从客单价入手，而只是从利润比例上来计算，即便利润率超高，也几乎没有任何实际意义和应用价值。


    因为十块八块的东西，就算它是利润率 100% 的“全利”、“纯利”，又能如何？


    客单价在这撑着呢，你得销售多少数量，才能达到预期营收？你需要多少客流量，才能支撑你去达成这个数量？'
  merge: -1
  img_proc: true
- pgno: 82
  md: '况且流量本身也是不可忽视的成本。纵然理论可行，问题就在于很难获取足够的流量，别说“暴利”，就算你“薄利”，也根本做不到“多销”。


    敲黑板，再强调一遍：互联网严冬来临，流量越来越贵，越来越难获取；我们需要最大化利用流量，使其以一当十，让每个流量都值钱，产出最大价值。


    稀缺性（20分）：重要的事情说三遍：差异化，差异化，差异化。


    如果说商场如战场，商人是战士；产品就是战士的枪，制胜的关键。


    没有枪就去打仗，或胡乱拿一把枪，都是必败的成因。


    同质化严重的产品，就像敌我双方标配的枪，你有，我有，大家都有，交战起来胜负各半，杀敌一万自损八千


    或者说，根本没有赢家，都属于失败者，都是炮灰罢了，即便有幸活下来，也只是苟且偷生，揣着卖白粉的心，赚着卖白菜的钱。'
