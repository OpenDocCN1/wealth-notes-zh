    这类人说起来都一套一套的，但其实都是故作者练而已，我猜是各种韩剧或网络小说看了多了仿佛只有当个“霸道总裁”才算创业。


    寄希望于“随便做做赚点钱”的“兼职项目”：此类“创业者”要求不高，不要要求发财致富飞黄腾达，就想着“兼职一下下”，“随便赚点钱补贴家用”就行。'
