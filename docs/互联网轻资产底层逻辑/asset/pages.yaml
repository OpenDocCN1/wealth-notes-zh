- pgno: 41
  md: '迷信所谓“万事俱备”：人生不是做菜，不一定非要等万事俱备才下锅。说什么阅历，资源，经验，人脉，心性，说什么顺其自然水到渠成，等各个层面各个维度都齐备了，我们的价值何在？


    我们要去到一个向往的地方，是不是要等沿途所有的路口都亮了绿灯再出发呢？


