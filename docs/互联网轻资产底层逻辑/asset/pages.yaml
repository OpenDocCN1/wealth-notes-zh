- pgno: 68
  md: '当然，我国地大物博，自然也人才济济，能找到取巧的办法，比如：找来些相关法律书籍，把身份、头像什么的包装一下，在某些平台上，自称律师接受某些特定领域的网上咨询，比如专门指导离婚案等，拗几句法律条文过去，实在不行临时翻书呗，这活儿也熟能生巧不是？


    真律师也不是在娘胎里就自带资格证书的。


    # 9.写作类


    说白了就是“内容创业”的一种，写手的一种，靠输出内容来换取价值，收入跟内容受欢迎程度成正比。头条号/百家号/大鱼号/企鹅号/知乎带货等等，总之就是各种号，有这么多呢：


    但，我作为一名文字工作者，能说这其实就是一个坑吗？越来越多的人拿起笔，导致写手这个行业，基本垮了。'
  merge: -1
