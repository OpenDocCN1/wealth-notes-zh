- pgno: 92
  md: '所以腾讯本质上是一家游戏公司，互联网能让企业赚钱的方式，其实并非其“主业”而是是“用户”，把主业拿来免费甚至倒贴，然后用“副业”来赚钱，这和传统行业刚好相反。


    这个时代是流量为王的时代，用户，即是“流量”。只要有流量，就能有源源不断的后端盈利。


    也就是说：所有互联网公司本质上都是以“贩卖人口”为主业的公司，


    不只是公司、APP，各类自媒体也是同理，都是通过优质的内容来圈人，拿来与大量的用户发生关系，而后通过“贩卖用户”来实现盈利。


    这既是“互联网思维”之“粉丝经济”的底层逻辑：手里有人，就有钱。


    所以又名“圈人思维”或“流量思维”。拓展话题：此种思维在理论上绝无问题，但需要注意一个点：'
