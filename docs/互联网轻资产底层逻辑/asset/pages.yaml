- pgno: 48
  md: '作为基本生活保障，类似于直销保险从业者乐于鼓吹的“管道收入”，这可能受传统观念影响，需要安全感，不然怎么会有那么多人扛起资疏通关系只为一个月薪几千的公务员职位？


