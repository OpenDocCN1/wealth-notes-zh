  md: '# 7：信息差：


    人类之中，但凡赚到大钱的，要么垄断，要么利用信息差。


    > ——洛克菲勒


    信息差这东西，是个人都知道，但往往容易忽视它的威力。


    因为总有一种声音在告诉你： “如今是信息社会，任何信息都趋向透明化，早已没有那么多空子可钻。”


    大众往往认为： “信息化程度高意味着：获取信息越来越容易，我知道的事情应该越来越多了才对。”


    但事实上并非如此，虽然人们知道的事情的确是越来越多了，但相对于整个世界而言，人们手中掌握信息的比例越来越小了，因为信息大爆炸，信息太 TM 多了！


    还是那句话：如今是信息社会，但只是相对于旧时代而言，实际上我们还是一个个相互分离的信息孤岛，而有价值的信息资源，'
