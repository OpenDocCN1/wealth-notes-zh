- pgno: 33
  md: '消失，我们应当从那种“流量取之不尽用之不竭”的错觉中醒悟过来；


    线上创业和线下不同。实体创业，A 地做不妨碍 B 地也做，完全可以共存，因为有区域隔离，但互联网相反，它呈现出强烈的马太效应：强者愈强弱者愈弱。因为受众找
    A 和找 B 的成本是相同的，对手比你强一丢丢，你就败了；


    即便你搭上了潮流末班车，也休想长久持续。因为上车的越来越多，车越来越沉，到最后注定的结局是：虽然在车上，却还不如下车步行走得快。


    有句话，话糙理不粗：这两年中国的市场，钱就像无头苍蝇一样，哪里有屎就一窝蜂扑过去，然后砰一声那地屎就炸了，无头苍蝇就四散而去，继续寻找下一坨屎。


    # 靠谱赚钱机会的特征


    比较隐藏，或者低调，绝不能是万众参与的类型。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '一句话，不是所有人都知道这个项目/产品/模式/套路，需要你自己去发现、判断、筛选、斟酌、决策。烂大街的东西，永远不值钱。


    举例：保险、微商、直销、POS 机、淘宝客...平心而论，这些东西模式都不错，理论上也能赚到钱，问题就在于，人人都知道赚钱，人人都去赚这份钱，于是都赚不到钱，苍蝇太多，屎不够吃罢了。


    还记得那句话吗：大路宽敞，但人潮人海挤破头，小路孤独，但没有竞争独自嗨：______


    带有不确定性。根据自己的判断觉得可行，但又有一定的难度和失败的风险。如果你有十成把握，那多半有问题，你认为百分百赚钱的机会，别人也会这么认为，那又轮不到你了。


    “做了就一定要赚到钱”，是一种典型的屌丝思维，只能去搬砖，搬多少挣多少，还能日结。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '所以，适当提升一些对不确定因素的包容性，很有必要。大家都看不清时，朝着混沌一斧头下去，才能开天辟地，而等到大家都看清楚，就不能指望这个发财了；


    有一定的门槛。不是所有人都做得来，或者是因为技术、能力、工具、资源等，或者是因为信息差，致使其他人没有条件/机会/见识去做。这也是为什么，新风口往往伴随着新机会，因为此时大家都是小白，处于同一一起跑线上，谁也没优势，乱也出英雄。


    关于风控可以试着问自己，以我的财力，能够承受的最坏结果是什么？


    假设该项目需要投入的资金即便全部打水漂了，也不至于伤筋动骨一蹶不振，就可以大胆试一下。


    对创业来讲，钱并不重要，重要的是机会，但机会是由资金来支撑的。我们提倡低成本创业，不是因为我们抠门，而是说：


    不是为了省钱，是为了省机会。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '保存实力，不行就撤，继续下一个，绝不能用所有身家孤注一掷。


    归根结底就是要：最小化可行。任何生意，同行不同利，有人开着奔驰去躲债，有人靠收废品买豪宅；有人含着金钥匙出生，却把一手好牌打得稀烂，比如那位号称“京城四少”的国内某—a线女星前夫；有人赤贫“成分”还不好，却能顷刻之间翻转乾坤，比如那位中年创业大器晚成的某儿童营养品开山大佬。


    创业看着像科学，却又像是玄学，具有一定随机性和偶然性。

    项目靠谱是必要条件，但并非充分条件，还要考虑“人”这个重要因素。


    # 生活中遇到的事情基本可以分为三类：


    +   - 第一类纯粹由随机性决定，比如布朗运动和运气彩票之类；

    - 第二类纯粹由能力决定，比如英语六级考试，百米成绩之类；

    - 第三类，也是我们最常遇到的，由能力和随机性共同决定，比如创业、投资、恋爱，或是梦想。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '很多项目，就算我行，你不一定行，我不行，你却不一定不行。


    这其中的“你”和“我”的区别，反而跟学历、能力、资源等硬件关系不大，倒更像是一种冥冥中的“猿粪”。


    不是所有人都“包赚”，各有不同因人而异。


    “包赚”的话只能去搬砖，搬多少挣多少还不能日结。不光是创业，事实上作为一个成年人，凡事都需要：学会面对不确定性。


    做最好的准备，做最坏的打算。而“最坏的打算”，即是项目的“风险量级”，还是那个问题：以我的财力，能够承受的最坏结果是什么？


    综上，如果你辩证过；有一半的把握成功；能够承受最坏结果。


    这个项目，就可以一试，但也需要知道，不管什么创收项目，既然入坑就一定要杜绝草率随意的“玩票心态”。'
