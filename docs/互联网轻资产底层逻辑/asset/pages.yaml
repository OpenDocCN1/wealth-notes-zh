- pgno: 32
  md: '因为你有极大可能，会被“轮空”。


    相反，这世上本没有红利，而当被你吃透了，就有了红利。


    # 所有的风口/趋势/红利都是：


    +   【初期靠智慧】：基本没人做，敢为人先，需要智慧去辩证；

    【中期靠眼光】：做的人不多，看到机会，需要眼光去判断；

    【后期靠资源】：大家都在做，红海求生，需要资源去拼杀。


    可惜的绝大多数人这三样东西都没有，只幻想随大流捡钱，注定只能凑个热闹。


    都已经形成气候了，没硬实力的话，注定是做炮灰。


    # 有人问了：


    中国之大，人口之多，难道市场上就不能多我这一家吗？这种想法本没有错，错在大家都这么想。


    人口体量再大，也是有数的，中国再大，也不是咱家的。中国网民数量已经见底，增幅骤降趋于平稳。之前的“流量红利”已经'
