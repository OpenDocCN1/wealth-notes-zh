    黑产灰产固然有大批人在做，我们不做不是因为没那个能力，而是没那个胆量和侥幸心理，再暴利也不心动，擦边球也不行，没起火的都是没做大的小鱼小虾，做大了虽然挣钱但大概率会起火，猪八戒照镜子两头不是人。


