- pgno: 90
  md: '这是百度的赚钱逻辑啊：它没有向顾客收费，但是商家却付费了。假设它圈了 3 亿的用户，某天有 100 万人点了一块钱的广告，那它就有 100 万的广告费收入。


    又有一天，你在上网的时候，它又突然给你弹出一个游戏，接着你发现这个游戏挺好玩的还免费，于是你开始玩了，但玩着玩着你发现要打好这个游戏，就必须升级装备，同样又有一小部分人付钱了，360
    就获得游戏的分成收入。


    后来呢，360 开始自己开发一些小游戏，于是收入都是他自己的了。再后来，你又通过 360 进入了一家商城，你看到上面有很多你喜欢的衣服鞋子，只要你一买 360
    又获得了分成。


    也就是说 360 赚了这三项收入：广告费：就像一个电视台或一家媒体，圈了这波用户之后，针对这波用户开始推广广告；游戏费用：一种是自营游戏，一种是别人家游戏的充值佣金；商城费用：即
    CPS 模式。'
