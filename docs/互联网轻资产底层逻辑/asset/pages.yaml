- pgno: 47
  md: '格局够大眼界够高，才能有野心有动机有信念有恒心执行。


    一句话：我并不介意一夜暴富，要有敢于去赚大钱的勇气。


    这跟贪婪是两码事，心里做最好的准备，同时做最坏的打算，以最大的眼界格局，去搏最现实的目标。


    我永远不相信会有哪个嘴上说“随便绊绊”的人，能取得任何实质性成果，我也从未见过任何一个自称“我不想绊得太大，像彭于晏那样就行”的人，真的绊成了彭于晏那样，哪怕是王宝强那样。总之，要干就别扭扭捏捏，将军赶路，不追小兔。


