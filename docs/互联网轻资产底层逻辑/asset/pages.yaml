- pgno: 30
  md: '创业的本质在于增长，增长的克星在于竞争，跟在别人后面，还自以为为鸡贼，自以为“有眼光”，实则炮灰专业户。


    被收割梯队：此类人关键词是傻的可爱。明明是小白一个，没有核心专业技能，也没有方法论作为指导，且不愿付出时间、精力、风险，却幻想着寻找某些：“可以网络兼职操作的项目”，最终往往被他人利用此种心理，被骗去金钱、人力、朋友圈人脉。


    一句话：自以为在创业，其实在被收割；自以为是“钩子”其实是“鱼”。


    对大部分来说，寻找创业项目这件事，并不是去“剜根问底”，反倒像是“求医问药”，搜索引擎上“XXX赚钱吗”的词条，永远如此浩荡，其火热；


