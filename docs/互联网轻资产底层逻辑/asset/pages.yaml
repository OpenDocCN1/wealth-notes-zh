- pgno: 44
  md: '人们在开始做之前，通常会习惯性去在脑中勾画理想的目标，宏伟的计划，这没错，也是人之常情。


    但绝对要避免一个问题，那就是前景可以很伟大，但过程一定要接地气，每次的执行都需要步步为营看到成果。


    十米之高台，固然是居高声自远，问题是谁都跳不上去，但如果能够把这十米分成十份，十个台阶，就能一步步最终登顶。


    特别是创业领域，很多人习惯于痴迷于各类“idea”，常拿“小黄车”、“共享充电宝”、“抖音”等


