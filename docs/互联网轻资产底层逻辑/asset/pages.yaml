    # 6: 粉丝经济【流量在哪里，钱就在哪里】


    今天来说说商业思维/“互联网思维”其中最重要的一个概念: 粉丝经济。


    粉丝经济中的“粉丝”二字，并非特指那些：明星的粉丝，网红的粉丝，大V的粉丝，各种自媒体的粉丝，而是指一切能与之发生关系的“流量”，因此也可称之为“流量思维”。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '商业模式之核心就是两个词：流量


    流量是一切生意的本质，流量在哪里，钱就在哪里，大流量赚大钱，小流量赚小钱，没流量不赚钱。


    所以谁家生意难做，实际上是他缺流量，要找钱，就得先找到流量。


    社交的流量：微信；


    电商的流量：阿里；


    支付的流量：支付宝；


    低价的流量：拼多多；


    二手货的流量：闲鱼；


    闲人们的流量：抖音；'
