- pgno: 38
  md: '互联网创业成本虽低，但这反而容易使人轻言放弃，因为项目丢了也不会太心疼，于是优点成了缺点，毕竟人都会有惰性。


    倘若换作实体创业的话，投个十几万几十万进去，反倒能逼着你克服惰性，去绞尽脑汁坚持不懈，因为一旦放弃，失去的太多。


    记住一句话：再优越的项目/产品，也不是不劳而获的工具，它只是你的一次“机会”，需要你动手去“抓住”，而不是像买彩票一样，随便去“赌一赌”。


