- pgno: 40
  md: '迷信所谓“包赚不赔”：前面已经说了，典型“屌丝思维”，只适合去搬砖，工资日结。


    迷信所谓“高投资才能高回报”：“一分付出‑一分收获”的原理，我十分同意，但是，高投资=高回报？


