- pgno: 93
  md: '只有当用户数量跨过某个“临界值”时，才会形成一个“生态闭环”，并持续产出价值，这也是很多自媒体或 APP 不能成功的原因：流量的规模太小，导致“圈人的成本”与“后端的盈利”达不到平衡，甚至入不敷出，最终破产下架，各类微商也是同理。


    # “粉丝经济”跟我们有什么关系？


    当然有关系，粉丝经济原理是“轻创业”领域极为重要的一种低成本创收模式。


    举例：自媒体范畴内很重要的一种形式即是：微信公众号。


    但公众号不是谁都能写的，需要文笔，需要知识，需要坚持，需要引流...


    虽然网上有很多人倡导以“写公众号”为副业/兼职/创业的切入点，我并不赞同初学者搞这一块，难度大、竞争激烈、很难看到收益，如果没有风雷手段，基本上属于白忙活。'
  merge: -1
  img_proc: true
- pgno: 94
  md: '别被那些不负责任的建议怂进去了。但自媒体可不只有微信公众号，还包含各大音频/视频平台，如喜马拉雅/蜻蜓 FM/抖音/快手等，话说现下为什么抖音这么火热？


    究其原因：抖音把自媒体最难逾越的门槛：出内容的难度，降到了最低，每个人都能来上一段，别说人，狗都能。


    话说有个农村小伙儿啊，自知文笔不好，长相也不上镜，便每天在喜马拉雅上发布鬼故事录音，素材都是从一些小说网站上找的，他只是用自己的话念出来而已，坚持一段时间后，粉丝量指数级上升，随着听众越来越多，越来越着迷，慢慢设置“付费收听”，直到后来的每天录音两小时，月入过万。


    （这其中也有很多技巧、捷径、工具可用，今后将展开篇幅专门讲这部分套路）


    其原理不过也是：用免费内容聚拢受众，后端用付费内容变现。这即是“粉丝经济”的终极奥义：得粉丝者，得天下，手里有人，就有钱。'
