- pgno: 2
  md: '关键是若真能挣到钱也委了，事实是基本上挣不到，都被交学费削韭菜了。


    即便是挣到钱，那也肯定：产出极低，低到发指，连业余去餐馆刷盘子十分之一都不到，不要指望这个增收，你说你要求不高也别干，这么说吧，干这个用挣到的钱买到的水，都没流的汗多。


    二、副业：副业这回事很宽泛，只要是能利用业余时间来赚钱的都叫副业。这在理论上是可行的，但想要一上手就看到收益的话，需要一定手头上的“硬货”来支撑，比如资源、知识、技术、工具、人脉等，没这些的话，基本行不通。


    别说时间也是资源，不是时间的问题，何况是业余时间。除非通过一段时间的积累，转型到“轻创业”类型，不过话说回来，到时候可以直接做主业了，干嘛还要当副业。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '除了传统行业的烧钱创业之外，现代人低成本赚钱方式很广泛，总体包含以下这几种：


    +   兼职： 闲暇之余，到处游击；

    副业： 主业之外，另起一摊；

    自由职业： 单枪匹马，独自坚强；

    轻创业： 最低成本，最大可能。


    # 一、兼职：


    兼职这东西，是网络上最容易忽悠人的，一般最多的类型是薅羊毛、干苦力、出卖自己的人脉等，大妈们和学生党是受骗重灾区。


    这是互联网的底层，用旧社会的话来说，属于下九流。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 三、自由职业：


    自由职业没那么神秘，也没那么美好，它也是一种“职业”而非“事业”。


    这类人群比较难受，一般是打工族中的佼佼者，却又突破不了“靠劳力输出换取价值”的桎梏。


    可以理解为，只是工作场所从办公室搬到了家里而已，不按时间计费，而是按成果计费。


    自由职业的要求也不低，作为一个独立的个体，对从业者专业水准的要求势必要远高于上班族水平，一般人玩不转。除非你在某行业有过硬的专业能力、口碑知名度、客户资源等，比如写作、做图、视频制作...


    一句话：你得念得一口好经。


    干得好的话虽然不能大富大贵，但也算满洒惬意，干的不好的也是发愁于竞争激烈找不到客户。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '对普通人来讲，自由职业并不美好，打工还能偷懒磨洋工混日子，自由职业不可能。


    在这里排除两类看似 “自由职业” 的模式：


    某些美女网红、女主播之类不在此列，她们只是傀儡或者工具而已，背后都是有团队和资本支撑的，当然赚的钱也只有一部分到她们手里；


    当你干的不错，想扩大规模时，雇了人手，就已经不算自由职业者了，因为你已经不是一线劳动输出者，转而成为一名 “老板”，转而成为一名 “老板”，这已经算作是下面提到的
    “轻创业” 了。


    # 四、轻创业：


    轻创业范畴也很大很大，并不比传统创业的话题小，也是我最为推崇的一种创收模式。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '同样是创业，但它很“轻”，筹备时间短、资金投入低、精力/体力付出少、可进可退、出入方便等，是之为“轻”。


    虽然“轻”，但却不可小觑它，做的趁手了，其营收能力丝毫不比那些看似人多势众的传统行业差，特别是互联网行业的轻创业。


    这类似于“皮包公司”的概念，“皮包公司”并非是诈骗，只是一个没有固定资产和正式员工，老板提着一个皮包出去赚钱的公司，是一种较为聪明的创业模式，俗话讲“空手套白狼”。


    举个例子，很多几个人甚至只有一个人的工作室，或者压根没有工作室直接就是在家里，闷声发大财的能力，堪比那些写字楼里的大公司，只是外人不知道而已，不知道有这么一个山头，更不知道有这么一个人。


    轻创业有一个硬性要求，那就是作为主人，你可以亲力亲为去操作，但产能的来源绝不是你自身的劳动力，包括体力劳动也包括脑力劳动。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '反例：一个律师在家接受网上法律咨询，算不算轻创业？不算。


    因为法律咨询服务也是劳动，没有劳动就没有产出，除非你雇了其他律师替你干活。那么，不靠自身劳动产出，那要靠什么？


    靠价值，但价值的体现不能是你本人劳动力的价值，而是体现在“系统”的价值，要知道：真正能赚钱的事情，都不辛苦，或者说，不是一直辛苦，你学历再高能力再强，只要是“人力”就不值钱。


    举例：可以是套路的运作，比如你是某种套路的拥有者，是背后的方法论在发挥价值，而你只起到设计布局的作用；可以是资源的变现，比如你是某种业务的中间人，因为重要的不是你这个人，重要的是你背后的资源


    可以是产品的溢价，比如你从某种产品的交易等，是货物的流通带来了收益，而非你的劳动。等等等等...


    虽然有的人觉得上述都差不多，但有本质区别，最主要的一点是：靠劳动力赚钱，劳动力在收益就在，劳动力不在收益就没有了，而且人不能分身，永远无法扩大。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '而轻创业模式，并非是靠“人”，而是靠“系统”带来收益，人不是系统，而是操作这个系统的幕后操盘手。


    一句话：你是车手，不是发动机；你劳动的目的是驾驶，而非提供运行的动力。


    回到本篇主题。


    问：所谓“兼职”和“副业”，到底有什么区别？

    答：兼职再大也是“职”，副业再小也是“业”。


    这类似于打工和创业的区别：打工是“狩猎模式”，行动就会有收获，不行动就没收获。另有比喻：挑水


    创业是“农耕模式”，需要前期积累劳作，后期旱涝保收。另有比喻：挖井。


    但同样的付出，却像是驴和马的区别：打工就像拉磨的驴，跑的再快，终究只能围着磨盘原地打转；'
  merge: -1
  img_proc: true
- pgno: 9
  md: '创业就像行路的马，走的再慢，终有一天能抵达向往的远方。


    关于“随便做做赚点钱”的项目：此类“创业者”要求不高，不要求发财致富飞黄腾达，就想着“兼职一下下”，“随便赚点钱补贴家用”就行。


    遗憾的是这种想法并不可行，问题不在于“兼职”，而在于其背后的潜台词：我不懂互联网赚钱技术；我更不想付出太多时间精力；我也不需要一个完整、自主的项目，只想做伸手党；我只想随便做做，不出家门时间自由很轻松，干不干看我心情。


    讲真，这种要求才是最难最要命的。人們赚钱无非是拿两样东西来换：要么操心，要么出力。


    互联网上基本没有需要“出力”的项目，只能是去“操心”，但操心的ibert是，你得“懂”些东西，否则没心可操。而寻求此类项目的人，恰恰是不懂的那一类人，因为真正“懂”的那类人，也绝不会问出这样的问题。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '这既是此类项目的“死穴”，它注定是一个“悖论”，规则的存在自有其成因。网上到处充斥着这种“项目”，因为抱有此类想法的人极


    或者说，你可以追求一个“副业”，但绝不要企图寻找一个“兼职”。


    兼职不是没有，可以下班后去送外卖当家教刷盘子，反而要靠谱得多，因为能真正挣到钱。


    虽然你要求低，但依然不现实，因为你不想操心，也没那个能力操心。


    不如找到一个完整而自主的项目，花些时间精力去钻研去操作，用点心其实并不那么难，等你找到方法和窍门，可能一天的收入，比别人一个月的都要多，这也正是互联网项目的魅力所在。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '冷水泼完，我只想说，需要兼职赚钱的人，一般没有轻松兼职的能力；有能力轻松兼职的人，一般不需要靠兼职赚钱。


    “兼职”这东西，还不如正式去打工，因为并不是靠专业技能，只是出卖廉价的时间，起码这东西在国内白菜价都不值，因为闲人太多太多，你可知有多少人整天蹲在群里，盯着屏幕就是为了抢那一分钱红包？你看见地上有一毛钱，不知道弯腰去捡；邻街有一百块钱，但需要走过去捡，你就懒得动了吗？


    作为一个已经离开学校踏入社会的成年人，千万要明白一件事：你的价值，并非取决于你的努力、你的能力，而是你的“不可替代性”。


    这种“不可替代性”可以表现为：人身的价值：如技能、知识、能力等；资源的价值：如资产、人脉、信息等；系统的价值：可理解为不依附于“肉身”而独立存在的“机器”。


    举例：老王，老张，老李是大学同学，都很优秀，能力一致，起点一致。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '老王当了大学教授：即是靠“技能”去工作，出卖“劳动力”，

    体现了人身的价值；


    老张做了名咨询师：靠业内各种“资源”，出卖“信息”赚钱，

    体现了资源的价值；


    老李自己做了生意：通过构建“商业系统”，通过“运作”盈利，体现了系统的价值。


    别把“系统”这东西想的那么高端，不光马云的集团公司是系统，


    一个公众号也是一套系统；一个知乎账号也是一套系统；

    一个靠信息差的小生意也是一套系统。


    小 A，小 B，小 C 三个人是同事，他们都很上进，不满足于现状

    他们都坚信：8 小时内求生存，8 小时外求发展'
  merge: -1
  img_proc: true
- pgno: 13
  md: '于是：小 A 找到了一份 “兼职”：如刷 D，下班继续劳动赚钱，虽然不多，但也够一杯奶茶钱，还工资日结；


    小 B 决定学习一种 “技能”：如英语，业余时间充实自己，虽然无法涨工资，但未来一定会用得上；


    小 C 选择经营一个 “副业”：如自媒体，慢慢积累读者，构建一个小的 “商业系统”，但没那么容易。


    一个月过去了：


    小 A 很快乐，因为提升了生活品质；


    小 B 很充实，因为学到了新的知识；小 C 很苦恼，因为万事开头难。


    半年过去了：'
  merge: -1
  img_proc: true
- pgno: 14
  md: '小 A 开始反思了，因为付出与收获不成正比，且影响了日常生活；小 B 升职加薪了，因为技能提高了，能创造更多价值；


    小 C 小有突破了，因为各种资源，都是可以慢慢“累积”的。


    # 一年以后：


    小 A 还是小 A，不同的是他每天牺牲业余时间，而能免费喝到一杯奶茶；


    小 B 比较厉害，提升了自己，工资很高，但能力越大责任越大，每天焦头烂额；


    小 C 已经是生意人了，因为有“系统”在运转，不但逆袭人生，而且几乎是躺赚。


    问题是：他们的选择，到底有什么不同？


    小 A 的做法，是出卖“重复性的廉价劳动力”，再努力也是杯水车薪，因为没有丝毫“不可替代性”，根本不值钱；'
  merge: -1
  img_proc: true
- pgno: 15
  md: '小 B 的做法，是提高“自身劳动力的不可替代性”，但这种不可替代性依然体现 contagios “劳动力”层面，人 的体力精力是有限 的；小 C 的做法，是构建属于自己的“系统”，它是种“身外
    之物”，可以积累、复制、放大，具备一定“自动性”，而且 已经建立了“壁垒”即“不可替代性”，别人抢不走。


    其实人们又何尝不知，想不想做小 C 是一回事，能不能做小 C 是另一回事。


    即：哪里有那么容易的事？


    所以这里有两点想说的：


    +   1. “系统”这个东西，完全是可以积累的，选择具有“积累性”和“增长性”的事物，虽然初期起步缓慢，但就像蚂牛爬一口井，迟早能达成，否则只能做青蛙，跳的再高，却每次都得落下来，一辈子也无望。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '2.，其实不管创业也好副业也好，并没有大众想象中的那么难，大众联想到创业时，往往和巨大的投入、超凡的能力、优质的人脉、足够的运气联系在一起，这是错误的。那些都不重要，重要的是视野和思维。别把这事想得太大。


    总之，我们需要思考的是：如何突破“靠劳力输出换取价值”的桎梏？不靠自身劳动产出，靠什么？靠“系统”的价值。


    前面讲：真正能赚钱的事情，都不辛苦，或者说，不是一直辛苦，你学历再高能力再强，只要是“人力”就不值钱。


    # 2：项目的选择思路【一阵扎下去就能见到血的点】


    任何人都有权利追求想要的彼岸：穷人想赚钱，改善生活逆袭人生，富人想赚钱，巩固优势规避风险，男人想赚钱，提升地位获得认可，女人想赚钱，经济独立能赚敢花，谁都想赚钱，没有哪个和钱有仇。


    成功不可复制，失败或可避免。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '别用战术上的勤奋，掩饰战略上的懒惰。


    我始终坚持我的看法，选择比努力更重要”绝不是一句无用的鸡汤，人生选择赛道比什么都重要。


    世上没有不赚钱的生意，只有不赚钱的人。

    同行不同利，同样的投入，不同的产出。


    成功和努力有关系，但是关系不大，行业选择不好，累死依然挣得少，勤劳致富是最魔幻的一句话，我们真正需要的是：构建自己独有的商人思维，而非鸡汤思维、技术思维、打工思维。


    这也是为什么，一旦外行们谈论所谓“创业”，往往像是在讨论“皇帝的金锄头”，让人哭笑不得。赚钱分哪些“模式”世界上没有任何一个人，是靠省钱实现理想生活的。然而，就像那句无厘头的调侃：钱不是问题，问题是没钱。同理，钱谁都想赚，问题是怎么赚？'
  merge: -1
  img_proc: true
- pgno: 18
  md: '既然，经济分[线下经济]和[线上经济]；销售分[线下销售]和[线上销售]；营销分[传统营销]和[网络营销]；商业分[线下模式]和[线上模式]；行业分[实体行业]和[互联网行业]。


    所以，赚钱也分[线下赚钱]和[线上赚钱]。


    都 2022 年了，无需多言，不管是成功率还是性价比，线上赚钱都要比线下赚钱更稳妥、更轻松、更精彩。


    “轻创业”实例若干说几个简单的实例，实效性不一定适用，仅供参考开拓思路：


    # 先说几个线下的：


    农村小伙到大城市打工，后来看准商机，租个民房雇个阿姨做大锅饭，每天去附近高级写字楼里发传单，送盒饭，连美团都不用申请，收入我不知道，但绝对能完爆那些所谓白领；'
  merge: -1
  img_proc: true
- pgno: 19
  md: '不少人在阿里巴巴上随便 OEM 一款几块钱的红酒，在超市收银台出口支个桌子，凭购物小票就可 39 元拿走两瓶礼盒装，具体收入不祥，这个项目行情好的时候，干几年够你在二线城市全款买房了；


    某大叔突发奇想，一头联系了几个学校，一头联系若干本地的制造企业，组织小学生们去工厂的生产线现场参观，名曰“工业旅游”，既能激发青少年的科学兴趣，又能为企业带来知名度，打点好几个校长，一周组织一次也轻松月入过万；


