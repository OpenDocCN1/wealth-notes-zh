- pgno: 69
  md: '取巧的做法是，先大量购买能够直接盈利的转正号，再雇人大规模批量洗稿操作，流程化+批量化。劣币驱逐良币，认真写都不如那些投机取巧的推手们赚得多。


    如今已经红海得不能再红海了，写的人比看得人还多，赚个毛线？况且平台越来越多，受众注意力越来越分散。


    最要命的是，抖音的横空出世火遍全国，夺走了相当大一部分文字类受众注意力，毕竟国民总时间是一定的。


    # 抖音最划时代的价值是什么？


    它成功的把出内容的能力门槛，降为零。从此，全民都有了出内容的能力，谁都能来上一段，别说人，狗都能。


    # 10.社群类


    啥是付费社群？就是：我们的群怎样怎样，能给你带来 XX 好处，来进我们的群吧，但需要交群费。'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 大致分三类：


    1: 内容型社群： 靠输出专业性内容，来提供价值，一般来说都和资源、行业、技术相关；


    2.关系型社群： 一般是在某些行业内部，由从业人员或相关人员组成，主要用于人脉的搭建，从而实现资源的互换或互补，互惠互利，资源整合，类似于行业交流俱乐部，取长补短狼狈为好呗；


    3.产品型社群： 以产品为中心，以产品粉丝为主体，衍生发展出的线上社群，像【小黑裙】、【大卫之选的咖啡】、【谦益农场】等，就是典型的产品型社群。


    群费一般按年收取，从几元到上万元不等。操作起来有门槛，但台子搭好以后，边际成本极低。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 11.课程类


    本质上就是搞知识付费项目，前几年也算是个风口。啥是知识付费风口？


    即是：全网已经达成共识，想获取相应的知识，就有必要支付相应的费用。


    【艾瑞咨询】称：2019 年中国知识付费产业规模约为 149.1 亿元，同比增长近三倍；未来三年，知识付费产业规模将保持较高成长性，预计 2022 年将达到
    635 亿元。


    此类平台有喜马拉雅、分答、得到、千聊、虎课，包括知乎 live，太多了。这类项目看起来高大上，其实并没有看起来那么高深，东拼西凑整理一套课程，转成语音或视频形式即可上架，销量好不好，就看手中资源和营销手段了，也可以找商业化推手联合推广炒作，赚了钱再分贿吧。


    也跟付费社群项目一样：操作起来有门槛，但台子搭好以后，边际成本极低。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 12.流量类


    流量是一切生意的本质，不论线上线下，这是商业的共识。任何生意，只有通过客流量来支撑，才能实现商品流通、产品变现。


    于是这时，流量本身也成为一种待价而沽的“商品”。

    流量是互联网时代的新兴词汇，但“卖流量”这种生意，绝对是历史悠久一脉相承。


    信息时代之前，大到报纸、电视台、广播电台、LED 屏幕，小到街边广告牌、电线杆小广告等


    本质上都属于流量生意，流量越大价值越大，就像各地方电视台广告费加起来也没中央电视台价格高，就是因其流量巨大、天大、世界最大。


    而互联网时代，流量最大的是啥，肯定是 BAT 了，虽然 B 是通过搜索引擎，A是通过购物平台，T是通过社交软件，但本质是相同的，堪称中国最大三家广告公司，世界最大三家流量贩子。（当然现在要增加一个后起之秀抖音系）'
  merge: -1
  img_proc: true
- pgno: 73
  md: '那么，作为个人，能不能卖流量？能，只要你有流量，就能出售。


    微信号、公众号、APP、网站都可以，知乎也可以，比如前阵子有人私信问我接不接点赞任务，一个赞 80 元，就是因为我账号有一定粉丝和流量。


    最多的形式是公众号形式，输出内容、汇聚粉丝、产出流量，这也是“内容创业”很重要的变现形式之一，但门槛高，周期长。


    卖流量的行为，俗称“派单、接广告”，而买流量的行为，业内黑话叫“增量、涨粉”。


    # 13.其它杂耍类


    此类项目的共性是：乍一看，哇，真 vergi 机巧万端大开眼界啊，原来还能这样赚钱！


    花样繁多层出不穷，但执行起来就会发现，全都是花拳绣腿不堪一击，不但很弱，而且很蠢，一句话：骗子太多，傻子明显不够'
  merge: -1
  img_proc: true
- pgno: 74
  md: '用… 个人见解是，凡是以套路为核心竞争力的项目，都没有搞头。


    因为套路这东西，是最靠不住的，传播最快门槛最低，更何况大部分人所知道的套路，都是那些已经公开的套路。


    说这类项目华而不实，“华” 是由于人们通常乐于杜撰、意淫此类歪门邪道，使其更具迷惑性和煽动性，导致劣币驱逐良币的现象，而实际上大多是屌丝幻想或庄家吸粉手段罢了。


    “不实” 是因为互联网发展至今，日造成熟规范，江湖格局尘埃落定，到处是玩家，到处是资本，到处是监管，都快算作“传统行业”了，早就没有那么多漏洞可钻，逐渐显现出其“单纯作为一个工具”的本质。


    不像前些年，东拼西凑一套减肥/赚钱/泡妞电子教程，再挂在搜索引擎上投 SEM 竞价广告就能日入过万了。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '一句话，时代使然。但这也并不代表互联网已无用武之地，而是说想要发展，必须建立在一定核心价值和方法论的基础上，去踏踏实实有章可循的运作，而不能简单粗暴的依赖于所谓“偏门套路”。


    任何行业都是：玩票的干不过钻研的，投机的干不过修炼的，兼职的干不过全职的，业余的干不过专业的。


    综上：透过现象看本质,各种副业项目眼花缭乱,其实无非这些分类,想到后再补充。


    # 5；产品的选择【刚需、暴利、可持续】


    互联网发展至今，日趋成熟规范，江湖格局尘埃落定，到处是玩家，到处是资本，到处是监管，都快算传统行业了，早就没有那么多漏洞可钻，逐渐显现出其单纯作为一个工具的本质。


    越是侥幸心理想投机，越是看啥都像是机会，连锁加盟、微商、网赚、虚拟币……'
  merge: -1
  img_proc: true
- pgno: 76
  md: '互联网浪潮的冲击，把有些人冲击富了，把有些人冲击傻了。


    当你被一茬茬收割，各类项目兜兜转转走过了多少次弯路，频频四处碰壁之后，才能彻底顿悟：想要持续的、大量的、稳定的盈利，终究还是要回归到产品上来。重剑无锋，大巧不工，大道至简，返璞归真。


    PS：这里所说的产品，不一定是实物类虚拟类产品也是产品，如课程、资源等；服务类产品也是产品，如美容、理发等。


    产品盈利的方式，最基本，最普遍，最万能：


    问：为啥要做项目？


    答：当然为赚钱。


    问：钱在哪里？


    答：别人兜里。


    问：别人兜哈给钱给你？


    答：当然是，用我的产品来换。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 这就是产品的意义：


    是“掏别人兜里钱”的工具；是“你和他人腰包”之间的桥梁；是决定“货币流向你账户”的理由。


    所以，选品之功夫，远重于推广之技术，能决定网赚之成败。


    那么，什么产品能够如破竹？


    如果，以 100 分为标准满分：


    # 刚需性（10 分）：


    情怀固然美好，就像一杯美酒，但永远没有刚需的白开水解渴，况且情怀这东西很娇情很脆弱，不稳定不持久不可控，也许时间/环境/心态变了，情怀也就就影无踪，但刚需永远是刚需。


    # 暴利性（30 分）：


    产品的推广，永远离不开客流量的问題。流量是一切生意的本质，是生意赖以生存的血液。这已经不只是互联网常识，也同样适用于线下。


    # 有一个营销概念：经典的“漏斗模型”。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '除了垄断行业，谁都不可能搞定所有人使成交率 100%。所以想要增加业绩，需要从展示量入手。


    销售额=流量*转化率*客单价


    # 假设：


    +   - 10000 个人看到我们的产品信息，

    - 1000 个人有兴趣了解信息，

    - 100 个人有意向来咨询，

    - 10 个人付款成交，

    - 即是：10000 次展示量=10 单成交量，


    # 同理：


    +   - 20000 次展示量=20 单成交量，

    - 30000 次展示量=30 单成交量，

    - 40000 次展示量=40 单成交量，

    - 50000 次展示量=50 单成交量'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 营销漏斗模型（简化版）


    ![](img/a0bc87da712b63b7926a2fc86fbe4e10_79_0.png)


    所以，营销的核心，永远是“有效流量”，设法扩大漏斗口径，从而实现增收。这一点大部分人都懂。


    但为啥把流量放到“暴力性”中来讲？


    因为很不幸，有一个残酷的事实；互联网流量越来越贵，越来越难获取。


    业内人都明显感觉得到，称之为“互联网的寒冬”。'
