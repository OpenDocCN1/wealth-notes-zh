- pgno: 25
  md: '打工思维之所以是打工思维，在于其局限性，因为尚未跳出诸如 “按劳分配”、“勤劳致富” 等儒家伪公知、伪真理，错把自己定位成一颗 “螺丝钉”。


    商业/生意/创业领域中，其产能价值从来不是来源于某项单一技能，更不依赖于当事人的 “劳动力”。


    房地产老板不一定会搬砖盖楼，酒店经理不一定会烧菜洗碗，马云也肯定不会写代码。


    传统生意思维：干什么能挣钱？


