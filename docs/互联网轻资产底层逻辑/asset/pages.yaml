  md: '因为：青蛙跳得高，也跳不出深井，因为每次都从零开始；蜗牛爬的慢，但迟早能上岸，因为从来都不会退步。


    即是：慢就是快，少就是多。这不是鸡汤，是事实。


    # 2.自动性：不管承认与否，有个残酷的事实是：职业也好、创业也好、副业也好，只要是靠人力来产出价值的事物，都是吃青春饭，没有例外。


    体力、脑力、精力，凡是人力，都不值钱，只不过体力相关的吃的时间短些，脑力相关的吃的时间长些罢了，因为人会累、会老、会生病、会倦怠。


    所以，不能完全寄希望于人力，而是依靠系统。


    啥是系统？这个很宽泛，大到公司，中到团队，小到自媒体，都可以看做一个系统，帮助赚钱的系统。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '拿最小的自媒体做例子，假设推广一款产品，其各维度的基本信息、功效亮点、使用方法、售后保障等，完全可以发布在自媒体上，而你所要做的，只是去寻找目标客源，引导其看到该自媒体，而不是每接触到一位目标用户，都苦口婆心的去做讲解员，从盘古开天辟地说起，口干舌燥一字一句沟通到地老天荒。


    如果是公司、团队的话，就更好理解了，亲手测试可行后，把方法流程交给他人来操作，自己只需管理团队、把握大方向、寻找测试更多方法即可，你是能手，不是水手。虽说是我们不是资本主义社会，但完全可以本着批判的精神，去榨取员工剩余价值喽，只要市场经济的供需关系存在，剥削就会一直存在。


    建立系统的目的，即是让系统当做发动机帮助人来赚钱，而不是把自己当成人肉发动机，人停了，项目就停了，永远是用时间精力体力换钱。


    但有了系统，大也好小也罢，可以代替双手和人工，甚至能脱产，把人解放出来去做更酷更有意义的事，就可实现下面即将讲到的目的，即可复制放大性。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 3.可复制放大性：


    前文说，当有了自己的系统，便可以把自己解放出来。那自己去干什么呢？


    当然是去改良优化、扩大升级、复制裂变已有系统。


    前面说到建立系统，听起来高大上的遥不可及，其实真没那么神秘，只要能自动化或半自动化盈利，哪怕利润再微薄，都是个好系统，因为系统即是机器，是机器就能做到：标准化执行。


    而只要能做到标准化执行，就一定能放大或复制更多的机器，实现扩产能的目的。其实这也正是互联网项目的迷人之处：想盈利固然有难度，它要比线下打工赚钱难得多，但一旦摸到门道掌握了思路，可能一天的收入就能顶线下打工一年赚的钱。


    因为只要在小范围内，验证了产品市场或商业模式的可行性，可以说能够几乎无限放大，谁叫我们生在世界第一人口大国呢，那'
  merge: -1
  img_proc: true
- pgno: 58
  md: '些芝麻绿豆大小的国家，一共就那点面积那点人口，想做大做强也没有那个条件。


    # 4: 项目探讨【各种网赚项目眼花缭乱，其实无非这些分类】


    1.产品类：这类的最常见、最普遍、最万能。

    产品流派，俗称“卖货的”，是我过去最忽视的，也是如今最推崇的。


    以前忽视是因为觉得流于平庸、陷于竞争、不够“偏门”和“套路”，但经历无数项目后发现，想长久持续的赚钱，没有产品作为依托，只依赖于那些所谓“套路”，基本都是空中楼阁，缘木求鱼。


    关键是：怎样去以辩证的思想，去选择一种产品？怎样去以标准化、持续化、规模化的方法，去推广这种产品？'
  merge: -1
  img_proc: true
- pgno: 59
  md: '这其中：推广很重要，因为“卖东西并不难，难的是把东西卖出去”选品很重要，因为“产品自身属性，很大程度上决定了，它好不好卖。”


    “卖的出去”这四个字，对产品来说太重要了，甚至可以说，是最最需要解决的普遍难题。若这个问题能得以解决，则百事大吉高枕无忧。


    也只有通过产品的形式，才能涵盖满足上一章节中所所述的：安全性；可控性；最小化可行；


    积累性增长性；自动性；可复制放大性。


    所以，本文将以大量篇幅围绕产品模式，来讨论副业话题。


    # 2.服务类


    即是通过自身技能，在网络上“接活儿”，用“兼职”二字来描述会更加贴切。'
