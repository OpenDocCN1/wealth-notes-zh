  md: '你会发现创业这件事，不一定要注册公司租场地雇员工组建 Team；不一定要砸锅卖铁投资个十万八万上百万；不一定要去搞“创新”，


    “高精尖”或“高科技”；不一定要是响应号召的“国家扶持项目”；不一定要一线城市 CBD 核心商务区 5A 级写字楼。


    不一定要为国家创造了 GDP；不一定要签约了南水北调工程或者一带一路；不一定要铤而走险孤注一掷。


