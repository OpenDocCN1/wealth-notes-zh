  md: '不是说创业很轻松很容易，也不是说打工有罪创业有理，但需要明白就目前的国情来看：


    第一，劳动力的价格太低太廉价，打工实在是性价比太低，令人发指不划算。反过来，这么低廉的劳动力，对当老板来说更有利；


    第二，咱们赶上了好时候，互联网发展迅速，新生事物如雨后春笋，社会面临巨变，只要你看准时机看准项目敢想敢干，正是乱世出英雄的时代。


    另外，不但赶上了好时候，还赶上了好地方。我国十几亿人，只要在小范围验证了行业市场或商业模式的可行性，可以说能够几乎无限放大。那些芝麻绿豆大小的国家，一共就那点地方那点人口，想做大做强都没有那个条件。


    常见“创业思维”点评打工思维：我能干什么？'
