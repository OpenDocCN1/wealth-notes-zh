  md: '# 调账前后分录


    | | 支出现金（收到现金） | 确认费用（确认收入） |

    |---|---|---|

    | 递延（Deferred） | 借：待摊费用（递延费用）

    贷：现金 | 借：费用

    贷：待摊费用（递延费用） |

    |  | 借：现金

    贷：预收账款（递延收入） | 借：预收账款（递延收入）

    贷：收入 |


    | | 确认费用（确认收入） | 支出现金（收到现金） |

    |---|---|---|

    | 应计（Accrued） | 借：费用

    贷：预提费用（应计费用） | 借：预提费用（应计费用）

    贷：现金 |

    |  | 借：资产（应收账款）

