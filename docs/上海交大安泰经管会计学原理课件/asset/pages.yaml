  md: '# 预计负债的确认


    如果与或有事项相关的义务同时符合以下条件，企业应将其确认为负债：


    +   1. 该义务是企业承担的现时义务；

    +   2. 该义务的履行很可能导致经济利益流出企业；

    +   3. 该义务的金额能够可靠地计量。


    多大概率是很可能？'
  merge: -1
  img_proc: true
- pgno: 411
  md: '该义务的履行很可能导致经济利益流出企业：


    “很可能”指发生的可能性为“大于50%但小于或等于95%”。通过“预计负债”账户核算。


    与“很可能”有关的其他概念的含义如下：


    “基本确定”指发生的可能性为“大于95%但小于100%”。


    “可能”指发生的可能性为“大于5%但小于或等于50%”。


    “极小可能”指发生的可能性为“大于0但小于或等于5%”'
  merge: -1
  img_proc: true
- pgno: 412
  md: '# 预计负债的计量


    或有事项的计量所涉及的问题是，当与或有事项有关的义务符合确认为负债的条件时，应以多少金额确认。


    或有事项的计量主要涉及两个问题：


    +   - 一是最佳估计数的确定；

    +   - 二是预期可获得的补偿的处理'
  merge: -1
  img_proc: true
- pgno: 413
  md: "# 最佳估计数的确定\n\n+   1. 如果所需支出存在一个金额区间，则最佳估计数应按该区间的上、下限金额的平均数确定。\n+   \n+   2.\
    \ 如果所需支出不存在一个金额区间，则最佳估计数应分别情况处理：\n+   \n+      （1）或有事项涉及单个项目时，最佳估计数按最可能发生金额确定。\n\
    +   \n+      （2）或有事项涉及多个项目时，最佳估计数按各种可能发生额及其发生概率计算确定。"
  merge: -1
  img_proc: true
- pgno: 414
  md: '+   - 例：2012年11月15日，乙股份有限公司因合同违约而涉一起诉讼案。在咨询了公司的法律顾问后，公司认为，最终的法律判决很可能对公司不利。2012年12月31日，乙股份有限公司尚未接到法院的判决，因诉讼须承担的赔偿金额也无法准确地确定。根据法律顾问的职业判断，赔偿金额可能是16万元至20万之间的某一金额。


    +   - 此时，乙股份有限公司应在资产负债表中确认一项金额为18万元［（16+20）÷2］的负债。'
  merge: -1
  img_proc: true
- pgno: 415
  md: • 例:2012年12月2日，乙股份有限公司涉及一起诉讼案。2012年12月31日，乙股份有限公司尚未接到法院的判决。根据公司法律顾问的职业判断，公司认为，胜诉的可能性为40%，败诉的可能性为60%。如果败诉，需要赔偿20万。此时，乙股份有限公司在资产负债表中确认的负债金额应为最可能发生的金额，即20万元。
