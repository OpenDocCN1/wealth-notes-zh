- pgno: 145
  md: '# 资产负债表


    # 资产负债表的作用：


    +   - 有助于解释、评价和预测企业的财务状况

    +   - 有助于解释、评价和预测企业的短期偿债能力、长期负债能力及资本结构

    +   - 有助于解释、评价和预测企业的财务弹性

    +   - 有助于解释、评价和预测企业的企业绩效


    # 资产负债表的局限性：


    +   - 原始成本报告基础不反映资产的市场价值

    +   - 货币计量的要求会遗漏许多重要的不能用货币计量的信息

    +   - 资产负债表包含了许多的估计数

    +   - 理解会计报表的含义必须依靠阅读者的判断'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 资产负债表的排列


    +   - 资产负债表各项目的排列比较关注各自的流动性和变现能力


    +   - 对于资产项目，流动性大的项目排列在前，流动性小的项目排列在后


    +   - 对于负债项目，则按照负债偿付的日期先后排列，也是流动性的一种应用


    +   - 对于所有者权益项目，按照其永久性大小，按大到小的顺序排列。实收资本、资本公积在前，盈余公积、未分配利润在后'
  merge: -1
  img_proc: true
