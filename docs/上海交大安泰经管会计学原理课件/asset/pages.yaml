- pgno: 333
  md: '# 存货成本与可变现净值孰低法


    如果市场价值低于存货的成本，期末存货应该以市场价值来报告，同时计提存货跌价准备


    市场价值定义为重置成本（replacement cost (not sales price)）或者可变现净值，符合conservatism principle.'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 表明可变现净值低于成本的迹象


    +   1）该存货的市场价格持续下跌，并且在可预见的未来无回升的希望；

    +   2）企业使用该项原材料生产的产品成本大于产品的销售价格；

    +   3）企业因产品更新换代，原有库存原材料已不适应新产品的需要，而该原材料的市场价格又低于其账面成本；

    +   4）因企业所提供的商品或劳务过时或消费者偏好改变而使市场的需求发生变化，导致市场价格逐渐下跌；

    +   5）其他足以证明该项存货实质上已经发生减值的情形。'
  merge: -1
  img_proc: true
- pgno: 335
  md: '+   - 表明可变现净值为零的迹象

    +   - 1）已霉烂变质的存货；

    +   - 2）已过期且无转让价值的存货；

    +   - 3）生产中已不再需要，并且已无使用价值和转让价值的存货；

    +   - 4）其他足以证明已无使用价值和转让价值的存货。'
  merge: -1
  img_proc: true
- pgno: 336
  md: '+   - 存货跌价准备的计提与转回

    +   - （1）成本与可变现净值进行比较

    +   - 成本>可变现净值 计提跌价准备

    +   - 成本<可变现净值 不计提跌价准备 或转回跌价准备

    +   - （2）计提方法 单项

    +   - （3）转回的条件


    +   三种方法:

    +   (1) 每一项存货

    +   (2) 每一类存货

    +   (3) 整个存货'
  merge: -1
  img_proc: true
