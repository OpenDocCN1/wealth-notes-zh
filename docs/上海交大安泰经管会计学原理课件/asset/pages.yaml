- pgno: 378
  md: '# 应付账款


    +   - 应付帐款指因购买材料、商品或接受劳务供应等而发生的债务。这是买卖双方在购销活动中由于取得物资与支付货款在时间上不一致而产生的负债。

    +   - 应付帐款入帐时间的确定，应以所购买物资的所有权转移或接受劳务已发生为标志。

    +   - 如有现金折扣，则按包括现金折扣的总价法处理

    +   - 应付帐款一般按应付金额入帐，而不按到期应付金额的现值入帐。获得的现金折扣，冲减财务费用。

    +   - 应付帐款一般在较短期限内支付。'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# 应付账款流程


    签订采购合同——收货通知——台账——入库单——会计审核制单——付款结算——对账。


    +   1. 参与采购合同文本会签。


    +   2. 物运达后，由采购部验收入查验数量和毁损情况，质检人员依据合同规定的标准检验质量后，采购经办人员制作：“收货通知单”经会计签字确认后，交仓库人员办理入库。


    +   3. 计在审核“收货通知单”时，登记采购管理台账备案。


    +   4、审核无误后，仓库人员开“入库单”，仓库负责人审核确认，采购经办人将“入库单”中的一联交给采购部备查，一联交给会计审核入账。


    +   5、会计审核入库单无误后，制作记账凭证，并在采购台账上做记录。


    +   6、会计依据企业管理程序办理付款，结算。


    +   7、会计和采购部门定期对账。及时处理差异。'
  merge: -1
  img_proc: true
