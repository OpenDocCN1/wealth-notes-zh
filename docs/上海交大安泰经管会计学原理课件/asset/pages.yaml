- pgno: 535
  md: '# SG&A


    +   - Payroll and benefit costs for retail and corporate employees;

    +   - Occupancy and maintenance costs of retail, services and corporate facilities;

    +   - Depreciation and amortization related to retail, services and corporate
    assets;

    +   - Advertising costs;

    +   - Vendor allowances that are a reimbursement of specific, incremental and
    identifiable costs to promote a vendor’s products;

    +   - Tender costs, including bank charges and costs associated with credit and
    debit card interchange fees;

    +   - Charitable contributions;

    +   - Outside and outsourced service fees;

    +   - Long-lived asset impairment charges; and

    +   - Other administrative costs, such as supplies, and travel and lodging.'
