- pgno: 395
  md: '# 其中的两项计划


    Employee Stock Purchase Plan. Our 2008 Employee Stock Purchase Plan, as amended
    ("ESPP") allows employees, including our NEOs, to purchase our common stock at
    a discount. The stock purchase price is 85% of the fair market value of the common
    stock, as measured by the closing price quoted on the NYSE at the beginning or
    at the end of a semi-annual purchase period, whichever is lower. There is a maximum
    purchase value per participant of $25,000 per calendar year for all plan participants.
    Beginning with purchases in September 2011, shares acquired through the ESPP are
    subject to a 12-month holding period except in limited circumstances (such as
    death or disability).


    Retirement Savings Plan. Our Retirement Savings Plan is intended to meet the requirements
    of Section 401(k) of the Internal Revenue Code of 1986 (the "Code"). All of our
    NEOs are eligible to participate in the plan. The plan provides a safe harbor
    that allows U.S.-based employees to contribute pre-tax income and immediately
    vest in Company matching contributions. The plan is expected to provide an improved
    opportunity for such employees to achieve retirement income security. However,
    the plan is not expected to provide sufficient income replacement relative to
    our NEOs'' anticipated retirement needs. The potential retirement income gap for
    our NEOs may be filled by other reward elements, including long-term incentives,
    or by the deferral of a portion of base salary or short-term incentive awards
    under the Deferred Compensation Plan. Under the Retirement Savings Plan, we match
    employee contributions, including those made by our NEOs, at rates approved by
    the Compensation Committee. Continuing in fiscal 2012, we matched 100% of the
    first 3% and 50% of the next 2% of eligible pre-tax earnings (up to Internal Revenue
    Service limits) contributed by plan participants.'
  merge: -1
  img_proc: true
