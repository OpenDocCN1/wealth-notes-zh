- pgno: 309
  md: '# 后进先出法（ LIFO ）


    假设后收进的存货先发出


    +   ◆ 优点：

    +   〈1〉 使现行收入与现行费用配比；

    +   〈2〉 在通货膨胀条件下，有利于财务稳健。

    +   ◆ 问题： 对政府税收有不利影响'
  merge: -1
