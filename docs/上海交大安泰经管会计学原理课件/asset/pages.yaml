- pgno: 418
  md: '# 预期可能获得补偿的处理


    +   - 如果企业清偿因或有事项而确认的负债所需支出全部或部分预期由第三方或其他方补偿，则此补偿金额只有在基本确定能收到时，才能作为资产单独确认，确认的补偿金额不能超过所确认负债的账面价值。

    +   - 预期可能获得补偿的情况通常有：发生交通事故等情况时，企业通常可从保险公司获得合理的赔偿；在某些索赔诉讼中，企业可通过反诉的方式对索赔人或第三方另行提出赔偿要求；在债务担保业务中，企业在履行担保义务的同时，通常可向被担保企业提出追偿要求。'
  merge: -1
  img_proc: true
