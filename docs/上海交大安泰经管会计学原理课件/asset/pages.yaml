- pgno: 260
  md: '# 坏账准备


    +   - 三种计算方法

    +     - 销货百分比法（当年销货赊销金额×计提比例）

    +     - 应收账款余额百分比法（应收款项期末余额×计提比例）

    +     - 应收账款的账龄分析法（根据应收款项账龄的长短来估计）'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# 销货百分比法


    # ①销货百分比法


    以赊销金额的一定百分比作为估计的坏账损失


    +   - 采用这一方法的理由：

    +   - 坏账仅和当期因赊销而发生的应收款项有关，与当期的现款销售无关，当期赊销业务越多，产生坏账的损失就越大

    +   - 根据过去的经验和有关资料，估计坏账损失与赊销金额之间的比率，也可用其他更合理的方法进行估计'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 销货百分比法


    +   - 例：根据过去5年的资料，赊销金额中估计坏账的百分比为2%，若本期实际赊销金额为200 000万元，则：

    +   - 本期估计的坏账损失=200 000×2%=4 000

    +   - 注意：在销货百分比法下，一般不需要调整坏账准备余额，如果坏账准备出现异常现象，应及时调整估计坏账的比例'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 应收账款余额百分比法


    +   - ②应收账款余额百分比法

    +   - 按应收款项期末余额的一定比例计算提取坏账准备

    +   - 理论上讲，这一比例应按坏账占应收款项的概率计算，发生坏账多的企业，比例就相应高一些，反之则低一些'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 应收账款余额百分比法


    +   - 计提公式（分两步）：

    +   - 坏账准备期末应有数

    +   - =应收款项期末余额×计提比例

    +   - 本期提取数

    +   - =坏账准备期末应有数-坏账准备贷方余额

    +   - 或=坏账准备期末应有数+坏账准备借方余额

    +   - 注意：此方法下，各年末，企业“坏账准备”的余额始终与应收款项年末余额成百分比关系'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 应收账款余额百分比法


    +   - 例：某公司某期应收账款的期末余额为 **100,000** 元，坏账准备的计提比例为 **2%**，坏账准备的贷方期末余额是 **500** 元

    +   - 坏账准备期末应有数 = 100,000 × 2% = 2,000

    +   - 本期提取数 = 2,000 - 500 = 1,500

    +   - 借：资产减值损失（坏账费用）　1,500

    +   - 贷：坏账准备　　　　　　　1,500'
  merge: -1
  img_proc: true
- pgno: 266
  md: '例：某公司从2011年开始使用备抵法预计坏账损失，2011年~2013年应收账款的年末余额均为1000万元，坏账准备的计提比例为5%，2012年发生坏账3万元；2013年发生坏账1万元，另外2012年核销的坏账中有2万元又收回。


    2011年：应计提的坏账准备为：

    1000×5%=5

    ①借：资产减值损失（坏账费用） 5

    贷：坏账准备 5


    2012年：发生坏账时：

    ②借：坏账准备 3

    贷：应收账款 3

    年末应补提的坏账准备为：

    1000×5%−2=3

    ③借：资产减值损失 3

    贷：坏账准备 3


    2013年：发生坏账时：

    ④借：坏账准备 1

    贷：应收账款 1

    以前年度核销的坏账又收回时：

    ⑤借：应收账款 2

    贷：坏账准备 2

    同时⑥借：银行存款 2

    贷：应收账款 2


    年末应补提的坏账准备为：

    1000×5%−6=−1（万元）

    即应冲销多提准备金1万元：

    ⑦借：坏账准备 1

    贷：资产减值损失（坏账费用） 1'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 账龄分析法


    +   - ③账龄分析法

