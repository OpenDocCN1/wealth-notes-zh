- pgno: 236
  md: '# 现金管理


    The goals of cash management are twofold:


    +   1. Plan cash receipts to meet cash payments when due.

    +   2. Keep a minimum level of cash necessary to operate.


    Effective cash management involves applying the following cash management principles:


    +   - Encourage collection of receivables.

    +   - Delay payment of liabilities.

    +   - Keep only necessary levels of assets.

    +   - Plan expenditures.

    +   - Invest excess cash.


    ![](img/a2796f05ebe2fd31075702d18360d28c_236_0.png)'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Internal Control Over Cash


    +   - **Segregate authorization, custody and recording of cash.** 现金的签发、保管、记录要职权分开、互相牵制

    +   - **Prepare a cash budget.** 编制现金预算

    +   - **Prepare a control listing of cash receipts.** 编制现金收据的控制清单

    +   - **Require daily deposits.** 要求现金收入当天存入银行

    +   - **Make all payments by check.** 用支票进行现金支付

    +   - **Verify every expenditure before payment.**

    +   - **Promptly reconcile bank statements.** 即时核对银行对账单


    ![](img/a2796f05ebe2fd31075702d18360d28c_237_0.png)'
