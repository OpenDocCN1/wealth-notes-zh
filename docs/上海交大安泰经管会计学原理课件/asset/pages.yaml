- pgno: 32
  md: '# 会计假设—会计核算前提


    +   - 会计假设是“对某些未被认识的会计现象，根据客观的正常情况或趋势所作的合乎事理的判断，而形成的一系列构成会计思想的基本公理或假设”（《经济大辞典》）

    +   - 会计假设也称为会计的基本前提，是会计工作的理论基础，是组织会计工作必须具备的前提条件'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 会计假设—会计核算前提


    +   - 原准则：

    +   - 会计主体

    +   - 持续经营

    +   - 会计分期

    +   - 货币计量


    +   - 新准则：

    +   - 会计主体

    +   - 持续经营

    +   - 会计分期

    +   - 货币计量

    +   - 权责发生制'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 会计信息质量的原则


    +   - 四大原则：相关性、可靠性、可比性、重要性

    +   - 会计信息的首要质量

    +   - 相关性——预测价值、反馈价值、时效性

    +   - 可靠性——忠实表达、可检验性、中立性

    +   - 会计信息的次要质量

    +   - 可比性

    +   - 需要考虑上述质量的起点：重要性（数量与质量）

    +   - 其他：实质重于形式、谨慎性'
  merge: -1
  img_proc: true
- pgno: 35
