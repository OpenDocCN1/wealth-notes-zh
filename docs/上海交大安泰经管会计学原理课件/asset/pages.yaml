- pgno: 462
  md: '# 可转换债券


    +   - 对投资者而言，可转换债券的好处：

    +     - 可保证投资者的利益；

    +     - 可享受股东的权利。

    +   - 对发行企业而言，可转换债券的好处：

    +     - 发行债券的代价较低；

    +     - 可保证资金的筹措。'
  merge: -1
  img_proc: true
- pgno: 463
  md: '可转换债券是按发行人依照法定程序发行、在一定期间内依据约定的条件可以转换成股份的公司债券。


    可转换债券既有债券的性质，又有股票的性质。


    第一种方法：将全部售价作为债券本身的售价，不必单独确认转换权价值。


    第二种方法：发行时，应根据债券本身及转换权的价值而分别入账。


    在我国，目前采用的是第二种会计处理方法。'
  merge: -1
  img_proc: true
- pgno: 464
  md: '+   - 分离交易可转债（**Bond with Warrants**）——“认股权和债券分离交易的可转换公司债券”，它是债券和股票的混合融资品种。

    +   - 分离交易可转债由两大部分组成，一是可转换债券，二是股票权证。

    +   - 可转换债券是上市公司发行的一种特殊的债券，债券在发行的时候规定了到期转换的价格，债权人可以根据市场行情把债券转换成股票，也可以把债券持有到期归还本金并获得利息。

    +   - 股票权证是指在未来规定的期限内，按照规定的协议价买卖股票的选择权证明，根据买或卖的不同权利，可分为认购权证和认沽权证。因此，对于分离交易可转债业已简单地理解成“买债券送权证”的创新品种。'
  merge: -1
  img_proc: true
