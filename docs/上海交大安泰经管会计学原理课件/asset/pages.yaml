- pgno: 57
  md: '# 结　论


    （1）每一项经济业务的发生都会引起两个或两个以上的资产和权益项目发生增减变化，但其变化结果不会破坏“资产=负债+所有者权益”这一基本会计等式的恒等关系。这一恒等关系是会计上设置账户、复式记账及编制资产负债表的理论依据。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 结论


    （2）企业单位内部发生的经济业务种类繁多，但归结起来不外乎四种类型：


    +   ◆ 资产和权益同时等额增加。如业务 1、3、4、12


    +   ❖ 资产和权益同时等额减少。如业务 5、9、11


    +   ◆ 资产内部有关项目有增有减。如业务 2


    +   ☒ 权益内部有关项目有增有减。如业务 6、7、8、10'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 结论


    （3）在以上四种类型中，第◆、�种类型将使企业的资产和权益总额发生增减变化，但不破坏其平衡关系，第◆、�种类型只影响资产和权益内部有关项目发生增减变化，而资产和权益的总额保持不变。'
  merge: -1
  img_proc: true
