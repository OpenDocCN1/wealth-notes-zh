- pgno: 482
  md: '# 普通股筹资的优缺点


    +   - **普通股筹资的优点**

    +     - 普通股筹资没有固定的股利负担

    +     - 普通股股本没有规定的到期日，无需偿还

    +     - 利用普通股筹资的风险小

    +     - 发行普通股筹集股权资本能增强公司的信誉

    +   - **普通股筹资的缺点**

    +     - 资本成本较高

    +     - 可能会分散公司的控制权

    +     - 可能引起股票价格的波动'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# 优先股的特点


    +   - 优先分配固定的股利

    +     - 优先股类似固定利息的债券。

    +   - 优先分配公司剩余财产

    +     - 当公司因解散、破产等进行清算时，优先股股东将优先于普通股股东分配公司的剩余财产。

    +   - 优先股股东一般无表决权

    +     - 仅在涉及优先股股东权益问题时享有表决权。

    +   - 优先股可由公司赎回'
  merge: -1
  img_proc: true
