  md: '# 应收账款


    +   - 1. 应收账款的确认

    +   - 根据收入的实现原则，在交易成立时确认

    +   - 确认时：

    +   - 借：应收账款

    +   - 贷：销售（或营业收入、或主营业务收入）

    +   - 收款时：

    +   - 借：现金

    +   - 贷：应收账款'
