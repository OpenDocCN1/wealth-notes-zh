- pgno: 218
  md: '# 常用财务比率


    # 表3-8　常用的财务比率


    +   1. **短期偿债能力（或流动性）比率**

    +      - 流动比率=流动资产/流动负债

    +      - 速动比率=（流动资产－存货）/流动负债

    +      - 现金比率=现金/流动负债

    +      - 净营运资本对资产总额的比率=净营运资本/资产总额

    +      - 间隔时间指标=流动资产/日均经营成本


    +   2. **长期偿债能力（或财务杠杆）比率**

    +      - 总负债率=（资产总额－权益总额）/资产总额

    +      - 债务权益率=债务总额/权益总额

    +      - 权益乘数=资产总额/权益总额

    +      - 长期负债率=长期负债/（长期负债+权益总额）

    +      - 利息保障倍数=EBIT/利息

    +      - 现金涵盖率=（EBIT+折旧）/利息


    +   3. **资产利用（或周转）比率**

    +      - 存货周转率=销售成本/存货

    +      - 存货周转天数=365/存货周转率


    +   - 应收账款周转率=销售收入/应收账款

    +   - 应收账款周转天数=365/应收账款周转率

    +   - 净营运资本周转率=销售收入/净营运资本

    +   - 固定资产周转率=销售收入/固定资产净值

    +   - 总资产周转率=销售收入/资产总额


    +   4. **获利能力比率**

    +      - 利润率=净利润/销售收入

    +      - 资产报酬率（ROA）=净利润/资产总额

    +      - 权益报酬率（ROE）=净利润/权益总额


    权益报酬率 = 净利润/销售收入 × 销售收入/资产 × 资产/权益


    +   5. **市场价值比率**

    +      - 市价-盈余比率=每股价格/每股盈余

    +      - 市盈率与增长比率=市价盈余比率/盈余增长比率

    +      - 价销比=每股价格/每股销售额

    +      - 市价-账面价值比率=每股市价/每股账面价值

    +      - 托宾Q=资产的市场价值/资产重置成本'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 财务比率的使用与局限


    # Uses


    # Limitations


    Ratios help users understand financial relationships.


    Ratios provide for quick comparison of companies.


    Management may enter into transactions merely to improve the ratios.


    Ratios do not help with analysis of the company''s progress toward nonfinancial
    goals.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 报表分析可能存在的问题


    +   - 由于缺乏理论的支持，很难找出相关性最强的财务比率来

    +   - 对多元化经营的公司来说，很难找到比较的标准

    +   - 全球化经营和竞争使得可比性更难以得到保证，因为不同国家的会计规范本身就存在着差异

    +   - 会计政策的变化，如存货计价时，可以选用先进先出法（FIFO）或者后进先出法（LIFO）

    +   - 各个公司之间的财务年度起止日可能不同

    +   - 特别突发事件的影响'
  merge: -1
  img_proc: true
