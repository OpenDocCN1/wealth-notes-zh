- pgno: 310
  md: '# 后进先出


    最近的成本


    商品销售成本


    过去的成本


    期末存货


    LIFO 方法目前仅仅用在 Japan 和 U.S.


    The difference between the cost of an inventory calculated under the FIFO and
    LIFO methods is called the LIFO reserve. This reserve is essentially the amount
    by which an entity''s taxable income has been deferred by using the LIFO method'
  merge: -1
  img_proc: true
- pgno: 311
  md: '# 加权平均法


    以各批购入（含初存）存货的数量为权重，计算可售存货的平均单位成本，并以此乘期末存货数量，计算期末存货价值


    +   ◆ 优点：①计算较简单；②从技术角度讲，加权平均比较合理（折中）


    +   ◆ 问题：在物价变动较剧烈的情况下，存货价值计量结果会失真'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 移动加权平均法


    在每次购货后即为存货计算出新的加权平均单位成本和新的存货价值，并以此新的单位成本作为后续发货的单位成本


    +   ◆ 优点：

    +     〈1〉 便于随时结转销货成本

    +     〈2〉 期末存货价值比较接近现行市价

    +   ◆ 问题： 计算工作量大'
  merge: -1
  img_proc: true
- pgno: 313
  md: '# 两种极端方法（FIFO与LIFO）的比较


    ◆基本倾向的差异：

    FIFO的基本倾向是“如实”反映资产负债表上的“存货”价值；

    而LIFO的基本倾向是“如实”反映利润表上的“销货成本”。即FIFO是资产负债表导向的；而LIFO是利润表导向的


    ◆基本目的的差异：

    FIFO的基本目的是向股东多报告收益

    而LIFO的基本目的则是少纳税'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 计划成本法


    +   - 存货业务的日常处理以计划成本进行，期末再将发出存货的计划成本及期末存货的计划成本调整为实际成本报告于财务报表之中的方法

    +   - 多用于原材料的日常核算

    +   - 实际成本=计划成本+/-成本差异

    +   - 合理制定并及时调整计划成本'
  merge: -1
  img_proc: true
