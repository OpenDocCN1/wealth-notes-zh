  md: '# Cost of Goods Sold


    +   - Total cost of products sold including:

    +     - Freight expenses associated with moving merchandise inventories from our
    vendors to our distribution centers;

    +     - Vendor allowances that are not a reimbursement of specific, incremental
    and identifiable costs to promote a vendor’s products; and

    +     - Cash discounts on payments to merchandise vendors;

    +   - Cost of services provided including:

    +     - Payroll and benefits costs for services employees; and

    +     - Cost of replacement parts and related freight expenses;

    +   - Physical inventory losses;

    +   - Markdowns;

    +   - Customer shipping and handling expenses;

    +   - Costs associated with operating our distribution network, including payroll
    and benefit costs, occupancy costs, and depreciation; and

    +   - Freight expenses associated with moving merchandise inventories from our
    distribution centers to our retail stores.'
  merge: -1
