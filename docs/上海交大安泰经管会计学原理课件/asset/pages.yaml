- pgno: 382
  md: '# 应付票据


    +   - 应付票据是由出票人出票，委托付款人在指定日期无条件支付确定的金额给收款人或者持票人的票据。应付票据也是委托付款人允许在一定时期内支付一定款额的书面证明。

    +   - 企业由于真实交易而开出、承兑的商业汇票，在会计核算上设置“应付票据”科目，反映这项流动负债的现存义务。应付票据按是否带息分为带息应付票据和不带息应付票据两种。'
  merge: -1
