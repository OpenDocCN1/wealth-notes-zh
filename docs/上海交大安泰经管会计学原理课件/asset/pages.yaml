- pgno: 430
  md: '# 不同行业的平均资产负债率


    +   - 一般行业企业的正常负债率在30%-50%，部分行业可以放宽在60%左右，而70%的负债率则是普遍认为的警戒线，除金融业和航空业外。

    +   - 金融类公司以86.72%成为负债率最高的行业，而信息传媒业公司的平均负债率最低，仅33.3%。

    +   - 平均负债率约45.98%

    +   - 平均资产负债率50%及以上的行业:农业、有色金属、交运设备、家电、公共事业5个行业，分别为50%、51.9%、52.53%、54.02%、50.69%。

    +   - 平均资产负债率低于40%的行业还有包括信息设备、食品饮料、医药三个行业，分别为37.057%、37.049%、37.69%。

    +   - 化工、采矿、建筑、电子元件、纺织、轻工、交通运输七个行业的上市前平均资产负债率则在40%-50%。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 长期借款


    +   • 企业向金融机构等借入的长期借款，在会计核算中设置“长期借款”科目核算。长期借款的核算需要注意以下几点：


    （一）长期借款所发生的利息支出，应按照权责发生制的原则按期预提计入在建项目的成本或计入当期财务费用。


    （二）长期借款的本金和利息，均应计入“长期借款”科目。'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# 长期借款


    +   - 本金借入时，借记“现金”，贷记“长期借款（本金）”。

    +   - 长期借款往往与固定资产购建相联系，此时，固定资产竣工结算前的应计利息，定期计入“在建工程”，贷记“应付利息”；固定资产竣工结算后的应计利息，借记“财务费用”，贷记“应付利息”。

    +   - 付息和/或还本时，借记“长期借款”，贷记“现金”

    +   - 利息资本化问题'
