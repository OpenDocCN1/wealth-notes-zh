- pgno: 343
  md: 'We value our inventory at the lower of the cost or market through the establishment
    of markdown and inventory loss adjustments.


    Our inventory valuation reflects markdowns for the excess of the cost over the
    amount we expect to realize from the ultimate sale or other disposal of the inventory.


    Markdowns establish a new cost basis for our inventory. Subsequent changes in
    facts or circumstances do not result in the reversal of previously recorded markdowns
    or an increase in that newly established cost basis.'
  merge: -1
  img_proc: true
- pgno: 344
