    | Oct 8 | 现金 | 1,030 | |\n|  | 利息收入（或财务费用） |  | 30 |\n|  | 应收票据 |  | 1,000 |\n\
    \n*Collected note and interest due*\n\n## 票据的特殊问题\n\n- 银行汇票与商业汇票\n- 票据贴现与贷款\n\
    - 票据融资\n- 票据转让\n- 案例分析:柳工\n\n## 本部分主要概念\n\n- I. What Determines Inventory cost（初始确认）\n\
    - II. How to recognize the cost of good sold（使用中的后续计量）：\n  1. Specific Identification（个别法）\n\
    \  2. FIFO（先进先出法）\n  3. LIFO（后进先出法）\n  4. Weighted Average（加权平均法）\n- III. How\
    \ to recognize the value of inventory at the end of period（期末存货计价）\n\n## 2012年中报\n\
    \n- 经济增速下滑，除给上市公司2012年上半年业绩带来影响外，上市公司整体存货也逐步攀升。剔除不可比数据后，1269家上市公司中期期末存货金额合计1.92万亿元，与2012年年初的存货金额1.79万亿相比增长7.5%，与2011年同期相比增长22.62%。\n\
