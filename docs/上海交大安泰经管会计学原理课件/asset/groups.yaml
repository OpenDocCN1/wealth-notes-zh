  md: "\n# 应付金额须视经营情况而定的流动负债\n\n- **特点：**\n\n只有到期末计算出本期的经营结果（利润）后，才能相应计算出负债金额，如应交税金（如所得税）、应付股利等\n\
    \n期末时，这类负债的金额也是“确定”的，但“日常”利润形成过程中，其金额是无法确定的\n\n- 世界上有两样东西不能够避免：那就是死亡和\n  税收\n\n\
    - 对于税收，你了解哪些？企业要交哪些税收？\n\n# 上海汽车\n\n2011年12月31日，单位：元\n\n| 项目 | 年末数 |\n|---|---:|\n\
    | 企业所得税 | 3,520,077,050.49 |\n| 营业税 | 598,728,734.77 |\n| 个人所得税 | 72,585,319.85\
    \ |\n| 土地使用税 | 10,968,526.24 |\n| 营业税 | 77,745,113.70 |\n| 增值税 | (1,733,597,708.25)\
    \ |\n| 城建税 | 72,259,079.74 |\n| 教育费附加 | 65,282,364.99 |\n| 其他 | 142,015,308.65\
    \ |\n| 合计 | 2,826,063,790.18 |\n\n# 或有事项：预计负债与或有负债\n\n- 什么是或有事项\n- 或有负债的主要问题是：在资产负债表日，还不能确定这些负债是否业已存在\n\
    \n# 或有事项的含义及其基本特征\n\n# 或有事项的含义\n\n或有事项指过去的交易或事项形成的，其结果须由某些未来事项的发生或不发生才能决定的不确定事项。\n\
    \n常见的或有事项有：商业票据背书转让或贴现、未决诉讼、未决仲裁、债务担保、产品质量保证（含产品安全保证）等。\n\n# 或有事项具有以下基本特征\n\n\
    1. 或有事项是因过去的交易或者事项形成的\n2. 或有事项的结果具有不确定性\n3. 或有事项的结果只能由未来发生的事项确定\n\n- 应付金额须予估计的流动负债——预计负债\n\
    - 或有负债\n\n# 预计负债的确认\n\n如果与或有事项相关的义务同时符合以下条件，企业应将其确认为负债：\n\n1. 该义务是企业承担的现时义务；\n\
    2. 该义务的履行很可能导致经济利益流出企业；\n3. 该义务的金额能够可靠地计量。\n\n多大概率是很可能？\n\n该义务的履行很可能导致经济利益流出企业：\n\
    \n“很可能”指发生的可能性为“大于50%但小于或等于95%”。通过“预计负债”账户核算。\n\n与“很可能”有关的其他概念的含义如下：\n\n“基本确定”指发生的可能性为“大于95%但小于100%”。\n\
    \n“可能”指发生的可能性为“大于5%但小于或等于50%”。\n\n“极小可能”指发生的可能性为“大于0但小于或等于5%”\n\n# 预计负债的计量\n\n\
    或有事项的计量所涉及的问题是，当与或有事项有关的义务符合确认为负债的条件时，应以多少金额确认。\n\n或有事项的计量主要涉及两个问题：\n\n- 一是最佳估计数的确定；\n\
    - 二是预期可获得的补偿的处理\n\n# 最佳估计数的确定\n\n1. 如果所需支出存在一个金额区间，则最佳估计数应按该区间的上、下限金额的平均数确定。\n\
    \   \n2. 如果所需支出不存在一个金额区间，则最佳估计数应分别情况处理：\n   \n   （1）或有事项涉及单个项目时，最佳估计数按最可能发生金额确定。\n\
    \   \n   （2）或有事项涉及多个项目时，最佳估计数按各种可能发生额及其发生概率计算确定。\n\n- 例：2012年11月15日，乙股份有限公司因合同违约而涉一起诉讼案。在咨询了公司的法律顾问后，公司认为，最终的法律判决很可能对公司不利。2012年12月31日，乙股份有限公司尚未接到法院的判决，因诉讼须承担的赔偿金额也无法准确地确定。根据法律顾问的职业判断，赔偿金额可能是16万元至20万之间的某一金额。\n\
    \n- 此时，乙股份有限公司应在资产负债表中确认一项金额为18万元［（16+20）÷2］的负债。\n\n• 例:2012年12月2日，乙股份有限公司涉及一起诉讼案。2012年12月31日，乙股份有限公司尚未接到法院的判决。根据公司法律顾问的职业判断，公司认为，胜诉的可能性为40%，败诉的可能性为60%。如果败诉，需要赔偿20万。此时，乙股份有限公司在资产负债表中确认的负债金额应为最可能发生的金额，即20万元。\n\
    \n# 预计负债——产品保证金\n\nA dealer sells a car for $32,000, on December 1, 2009, with\
    \ a warranty for parts and labor for 12 months, or 12,000 miles. The dealership\
    \ experiences an average warranty cost of 3% of the selling price of each car.\n\
    \n| Dec. 1 | 销售费用 | DR | 960 |\n| | 预计负债 | CR | 960 |\n| | *To accrue estimated\
    \ warranty expense* | | |\n\nOn February 15, 2010, parts of $200 and labor of\
    \ $250 covered under warranty were incurred.\n\n| Feb. 15 | 预计负债 | DR | 450 |\n\
    | | 库存商品 | CR | 200 |\n| | 应付职工薪酬 | CR | 250 |\n| | *To record warranty costs*\
    \ | | |\n\n# 上海汽车\n\n# 2011年12月31日，单位：元\n\n# 预计负债\n\n| 项目 | 年末数 |\n|---|---|\n\
    | 产品质量保证金 | 6,224,002,412.02 |\n| 其他 | 949,434,543.24 |\n| 小计 | 7,173,436,955.26\
    \ |\n| 减：一年内到期的预计负债(附注(六)37) | 3,154,749,364.35 |\n| 一年后到期的预计负债 | 4,018,687,590.91\
    \ |\n\n# 预期可能获得补偿的处理\n\n- 如果企业清偿因或有事项而确认的负债所需支出全部或部分预期由第三方或其他方补偿，则此补偿金额只有在基本确定能收到时，才能作为资产单独确认，确认的补偿金额不能超过所确认负债的账面价值。\n\
    - 预期可能获得补偿的情况通常有：发生交通事故等情况时，企业通常可从保险公司获得合理的赔偿；在某些索赔诉讼中，企业可通过反诉的方式对索赔人或第三方另行提出赔偿要求；在债务担保业务中，企业在履行担保义务的同时，通常可向被担保企业提出追偿要求。\n\
    \n# 或有负债\n\n![](img/a2796f05ebe2fd31075702d18360d28c_419_0.png)\n\n# 非流动负债\n\n\
