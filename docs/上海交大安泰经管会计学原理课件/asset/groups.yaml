    # 存货成本与可变现净值孰低法


    如果市场价值低于存货的成本，期末存货应该以市场价值来报告，同时计提存货跌价准备


    市场价值定义为重置成本（replacement cost (not sales price)）或者可变现净值，符合conservatism principle.'
