    # 应收账款


    +   - 应收账款是企业因销售产品、商品、提供劳务等应向购买单位收取但尚未收到的各种款项，并不表现为当期的库存现金流入

    +   - 应收账款的特点：

    +     - 因赊销商品（或劳务）而产生的

    +     - 是非书面的、无担保的信用活动，不计息，我国一般不转让，国外可以转让

    +     - 期限较短'
  - '[PAGE 249]


    # 应收账款


    +   - 1. 应收账款的确认

    +   - 根据收入的实现原则，在交易成立时确认

    +   - 确认时：

    +   - 借：应收账款

    +   - 贷：销售（或营业收入、或主营业务收入）

    +   - 收款时：

    +   - 借：现金

    +   - 贷：应收账款'
