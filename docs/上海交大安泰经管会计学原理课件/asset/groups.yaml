  md: "\nMerchandise inventories are valued at lower of cost or market using the last-in,\
    \ first-out (LIFO) retail inventory method. Under the retail inventory method,\
    \ inventory is segregated into departments of merchandise having similar characteristics,\
    \ and is stated at its current retail selling value. Inventory retail values are\
    \ converted to a cost basis by applying specific average cost factors for each\
    \ merchandise department. Cost factors represent the average cost-to-retail ratio\
    \ for each merchandise department based on beginning inventory and the fiscal\
    \ year purchase activity. The retail inventory method inherently requires management\
    \ judgments and estimates, such as the amount and timing of permanent markdowns\
    \ to clear unproductive or slow-moving inventory, which may impact the ending\
    \ inventory valuation as well as gross margins.\n\nCompanies that sell merchandise\
    \ goods in an inflation environment would obtain tax advantage by using LIFO.\n\
    \n## Inventories\n\nAll inventories are stated at the lower of cost or realizable\
    \ values. Cost for a significant portion of GE U.S. inventories is determined\
    \ on a last-in, first-out (LIFO) basis. Cost of other GE inventories is determined\
    \ on a first-in, first-out (FIFO) basis. LIFO was used for 39% of GE inventories\
    \ at both December 31, 2010 and 2009. GECS inventories consist of finished products\
    \ held for sale; cost is determined on a FIFO basis.\n\n![](img/a2796f05ebe2fd31075702d18360d28c_329_0.png)\n\
    \n## 存货计量的税收效应\n\nThe Internal Revenue Service (IRS) identifies several acceptable\
    \ methods for inventory costing for reporting taxable income.\n\nIf LIFO is used\
    \ for tax purposes, the IRS requires it be used in financial statements.\n\nInflation\
    \ or deflation?\n\n![](img/a2796f05ebe2fd31075702d18360d28c_330_0.png)\n\n## 存货成本核算方法使用的一致性\n\
    \n一致性原则（consistency principle）要求：a company to use the same accounting methods\
    \ period after period so that financial statements are comparable across periods.\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_331_0.png)\n\n## 存货的期末计量\n\n### 存货成本与可变现净值孰低法\n\
    \n如果市场价值低于存货的成本，期末存货应该以市场价值来报告，同时计提存货跌价准备。\n\n市场价值定义为重置成本（replacement cost, not\
    \ sales price）或者可变现净值，符合 conservatism principle。\n\n### 表明可变现净值低于成本的迹象\n\n- 1）该存货的市场价格持续下跌，并且在可预见的未来无回升的希望；\n\
    - 2）企业使用该项原材料生产的产品成本大于产品的销售价格；\n- 3）企业因产品更新换代，原有库存原材料已不适应新产品的需要，而该原材料的市场价格又低于其账面成本；\n\
    - 4）因企业所提供的商品或劳务过时或消费者偏好改变而使市场的需求发生变化，导致市场价格逐渐下跌；\n- 5）其他足以证明该项存货实质上已经发生减值的情形。\n\
    \n### 表明可变现净值为零的迹象\n\n- 1）已霉烂变质的存货；\n- 2）已过期且无转让价值的存货；\n- 3）生产中已不再需要，并且已无使用价值和转让价值的存货；\n\
    - 4）其他足以证明已无使用价值和转让价值的存货。\n\n### 存货跌价准备的计提与转回\n\n- （1）成本与可变现净值进行比较\n  - 成本 > 可变现净值：计提跌价准备\n\
    \  - 成本 < 可变现净值：不计提跌价准备，或转回跌价准备\n- （2）计提方法：单项\n- （3）转回的条件\n\n- 三种方法：\n  - (1)\
    \ 每一项存货\n  - (2) 每一类存货\n  - (3) 整个存货\n\n### 存货成本与可变现净值孰低法\n\nHere is how to compute\
    \ lower of cost or market for individual inventory items.\n\n| Inventory Items\
    \ | Units on Hand | Total Cost | Total Market | LCM Applied to Items | LCM Applied\
    \ to Categories | LCM Applied to Whole |\n| --- | ---: | ---: | ---: | ---: |\
    \ ---: | ---: |\n| Cycles: |  |  |  |  |  |  |\n| Roadster | 20 | $160,000 | $140,000\
    \ | $140,000 |  |  |\n| Sprint | 10 | $50,000 | $60,000 | $50,000 |  |  |\n| Category\
    \ subtotal |  | $210,000 | $200,000 |  |  |  |\n| Off-Road |  |  |  |  |  |  |\n\
    | Trax-4 | 8 | $40,000 | $52,000 | $40,000 |  |  |\n| Blazer | 5 | $45,000 | $35,000\
    \ | $35,000 |  |  |\n| Category subtotal |  | $85,000 | $87,000 |  |  |  |\n|\
    \ Total |  | $295,000 | $287,000 | $265,000 |  |  |\n\n### 存货成本与可变现净值孰低法\n\nHere\
    \ is how to compute lower of cost or market for the entire inventory.\n\n| Inventory\
    \ Items | Units on Hand | Total Cost | Total Market | LCM Applied to Items | LCM\
    \ Applied to Categories | LCM Applied to Whole |\n| --- | ---: | ---: | ---: |\
    \ ---: | ---: | ---: |\n| Cycles: |  |  |  |  |  |  |\n| Roadster | 20 | $160,000\
    \ | $140,000 | $140,000 |  |  |\n| Sprint | 10 | $50,000 | $60,000 | $50,000 |\
    \  |  |\n| Category subtotal |  | $210,000 | $200,000 |  | $200,000 |  |\n| Off-Road\
    \ |  |  |  |  |  |  |\n| Trax-4 | 8 | $40,000 | $52,000 | $40,000 |  |  |\n| Blazer\
    \ | 5 | $45,000 | $35,000 | $35,000 |  |  |\n| Category subtotal |  | $85,000\
    \ | $87,000 |  | $85,000 |  |\n| Total |  | $295,000 | $287,000 | $265,000 | $285,000\
    \ | $287,000 |\n"
  mdcn: "\n\n商品存货按成本与市价孰低法计价，采用后进先出（LIFO）零售存货法。在零售存货法下，存货按具有相似特征的商品部门进行划分，并按当前零售售价列报。存货零售价值通过应用每个商品部门的特定平均成本系数转换为成本基础。成本系数代表每个商品部门基于期初存货和本财政年度采购活动的平均成本与零售价比率。零售存货法本质上需要管理层作出判断和估计，例如为清理低效或滞销存货而进行的永久降价的金额和时机，这可能会影响期末存货估值以及毛利率。\n\
    \n在通货膨胀环境下销售商品的公司可以通过使用后进先出法获得税收优势。\n\n## 存货\n\n所有存货均按成本与可变现净值孰低列报。GE美国存货中很大一部分的成本采用后进先出（LIFO）法确定。GE其他存货的成本采用先进先出（FIFO）法确定。在2010年12月31日和2009年12月31日，GE存货中有39%采用LIFO法。GECS存货包括持有待售的产成品；其成本采用FIFO法确定。\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_329_0.png)\n\n## 存货计量的税收效应\n\n美国国税局（IRS）确定了若干可接受的存货成本计算方法，用于报告应税所得。\n\
    \n如果出于税务目的采用LIFO法，IRS要求在财务报表中也采用该法。\n\n通货膨胀还是通货紧缩？\n\n![](img/a2796f05ebe2fd31075702d18360d28c_330_0.png)\n\
    \n## 存货成本核算方法使用的一致性\n\n一致性原则（consistency principle）要求：公司应期复一期地使用相同的会计方法，以使财务报表在不同期间具有可比性。\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_331_0.png)\n\n## 存货的期末计量\n\n### 存货成本与可变现净值孰低法\n\
    \n如果市场价值低于存货的成本，期末存货应该以市场价值来报告，同时计提存货跌价准备。\n\n市场价值定义为重置成本（replacement cost，而非销售价格）或者可变现净值，符合保守性原则（conservatism\
    \ principle）。\n\n### 表明可变现净值低于成本的迹象\n\n- 1）该存货的市场价格持续下跌，并且在可预见的未来无回升的希望；\n- 2）企业使用该项原材料生产的产品成本大于产品的销售价格；\n\
    - 3）企业因产品更新换代，原有库存原材料已不适应新产品的需要，而该原材料的市场价格又低于其账面成本；\n- 4）因企业所提供的商品或劳务过时或消费者偏好改变而使市场的需求发生变化，导致市场价格逐渐下跌；\n\
    - 5）其他足以证明该项存货实质上已经发生减值的情形。\n\n### 表明可变现净值为零的迹象\n\n- 1）已霉烂变质的存货；\n- 2）已过期且无转让价值的存货；\n\
    - 3）生产中已不再需要，并且已无使用价值和转让价值的存货；\n- 4）其他足以证明已无使用价值和转让价值的存货。\n\n### 存货跌价准备的计提与转回\n\
    \n- （1）成本与可变现净值进行比较\n  - 成本 > 可变现净值：计提跌价准备\n  - 成本 < 可变现净值：不计提跌价准备，或转回跌价准备\n-\
    \ （2）计提方法：单项\n- （3）转回的条件\n\n- 三种方法：\n  - (1) 每一项存货\n  - (2) 每一类存货\n  - (3) 整个存货\n\
    \n### 存货成本与可变现净值孰低法\n\n以下是如何计算单个存货项目的成本与市价孰低。\n\n| 存货项目 | 持有数量 | 总成本 | 总市价 | 按单项应用LCM\
