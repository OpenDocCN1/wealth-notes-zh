    ## 调账


    调整跨期交易与事项


    ### 调账的框架


    调整


    在确认费用（或收入）之前支付（或收到）现金


    在确认费用（或收入）之后支付（或收到）现金


    预付（递延）费用*


    未赚取（递延）收入


    应计费用


    应计收入


    *including depreciation


    ## 调账前后分录


    | | 支出现金（收到现金） | 确认费用（确认收入） |

    |---|---|---|

    | 递延（Deferred） | 借：待摊费用（递延费用）<br>贷：现金 | 借：费用<br>贷：待摊费用（递延费用） |

    |  | 借：现金<br>贷：预收账款（递延收入） | 借：预收账款（递延收入）<br>贷：收入 |


    | | 确认费用（确认收入） | 支出现金（收到现金） |

    |---|---|---|

    | 应计（Accrued） | 借：费用<br>贷：预提费用（应计费用） | 借：预提费用（应计费用）<br>贷：现金 |

    |  | 借：资产（应收账款）<br>贷：收入（应计收入） | 借：现金<br>贷：资产（应收账款） |


    ## 调整的类型


    - ★ 将资产转为费用

    - ★ 资产转为费用


    - ⏱ 将负债转为收入

    - ⏱ 负债转为收入


    - ⏱ 计提未付费用

    - ⏱ 未支付的费用


    - ⏱ 计提未收收入

    - ⏱ 未收讫的收入


    ![](img/a2796f05ebe2fd31075702d18360d28c_121_0.png)


    ## 为什么要调账


    会计分期假设


    应计制会计（应计会计）


    调账原则：


    权责发生制原则


    配比原则


    ## 如何调整


    | 类型 | 资产负债表科目 | 利润表科目 | 调整分录 |

    |---|---|---|---|

    | **预付费用** | 资产高估<br>所有者权益高估 | 费用低估 | 借：费用<br>贷：资产 |

    | **未赚取收入** | 负债高估<br>所有者权益低估 | 收入低估 | 借：负债<br>贷：收入 |

    | **应计费用** | 负债低估<br>所有者权益高估 | 费用低估 | 借：费用<br>贷：负债 |

    | **应计收入** | 资产低估<br>所有者权益低估 | 收入低估 | 借：资产<br>贷：收入 |


    ## 结账


    - 在期末将收入、费用和取款账户余额重置为 **零**。

    - 有助于在 **损益汇总** 账户中汇总一个期间的收入和费用。


