    \ |\n\n## 谁来保障会计信息的真实性？\n\n监管：会计准则（GAAP、IFRS）、审计师、证监会（SEC）、媒体、法律（SOX）\n\n谁更为有效？\n\
    \n道德（CORNERSTONE）：不做假账\n\n![](img/a2796f05ebe2fd31075702d18360d28c_30_0.png)\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_30_1.png)\n\n## 核心内容\n\n- I. 会计：测量观与信息观\n\
    - II. 会计假设和原则\n- III. 会计等式\n- IV. 会计要素\n- V. 借贷记账法\n- VI. 会计循环\n\n## 会计假设——会计核算前提\n\
    \n- 会计假设是“对某些未被认识的会计现象，根据客观的正常情况或趋势所作的合乎事理的判断，而形成的一系列构成会计思想的基本公理或假设”（《经济大辞典》）\n\
    - 会计假设也称为会计的基本前提，是会计工作的理论基础，是组织会计工作必须具备的前提条件\n\n- 原准则：\n  - 会计主体\n  - 持续经营\n \
    \ - 会计分期\n  - 货币计量\n- 新准则：\n  - 会计主体\n  - 持续经营\n  - 会计分期\n  - 货币计量\n  - 权责发生制\n\
    \n## 会计信息质量的原则\n\n- 四大原则：相关性、可靠性、可比性、重要性\n- 会计信息的首要质量\n  - 相关性——预测价值、反馈价值、时效性\n\
    \  - 可靠性——忠实表达、可检验性、中立性\n- 会计信息的次要质量\n  - 可比性\n- 需要考虑上述质量的起点：重要性（数量与质量）\n- 其他：实质重于形式、谨慎性\n\
    \n## 新准则\n\n### 会计信息质量要求\n\n- 客观性（可靠性）\n- 相关性\n- 可理解性\n- 可比性\n- 一致性\n- 实质重于形式\n\
    - 重要性\n- 谨慎性\n- 及时性\n\n## 会计确认计量的原则\n\n- 权责发生制原则（收入确认原则）\n- 配比原则\n- 历史成本原则\n-\
    \ 全面披露的原则\n- 划分收益性支出与资本性支出的原则\n\n## 会计计量\n\n企业在将符合确认条件的会计要素登记入账并列报于会计报表及其附注（又称财务报表）时，应当按照规定的会计计量属性进行计量，确定其金额。\n\
    \n- 历史成本\n- 重置成本\n- 可变现净值\n- 现值\n- 公允价值\n\n企业在对会计要素进行计量时，一般应当采用历史成本，采用重置成本、可变现净值、现值、公允价值计量的，应当保证所确定的会计要素金额能够取得并可靠计量。\n\
    \n## 会计规范：规则导向还是原则导向\n\n- 打酱油的钱不能够买醋？\n- 谁的“小金库”？\n\n## 核心内容\n\n- I. 会计：测量观与信息观\n\
