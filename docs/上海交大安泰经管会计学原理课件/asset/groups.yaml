    Our Domestic segment’s SG&A grew $348 million, or 5.0%, in fiscal 2011 compared
    to fiscal 2010. The increase in SG&A was driven by the opening of new stores and
    an increase in the Best Buy Mobile profit share-based management fee, partially
    offset by lower incentive compensation costs. The following factors collectively
    contributed to the Domestic segment’s SG&A rate increase of 1.0% of revenue:


    +   - deleverage due to the comparable store sales decline;

    +   - continued growth in Best Buy Mobile (including the profit share-based management
    fee we paid to Best Buy Europe, which is offset in the International segment SG&A
    results and, therefore, has no net impact on our consolidated operating income);
    and

    +   - the change in the form of vendor funding as discussed above;

    +   - partially offset by lower incentive compensation costs.'
