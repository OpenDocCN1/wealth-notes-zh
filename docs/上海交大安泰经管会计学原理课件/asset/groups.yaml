    ## 现金流量表

    - 某一会计主体特定时期内有关现金和现金等价物的流入和流出情况的会计报表。

    - 编制基础：现金

    - 编制依据：现金制（与应计制相对应）


    ## 现金流量表的作用

    - 提供企业的现金流量信息以及企业现金流入和流出的构成情况；

    - 评价企业现金流量结构是否合理，了解企业当前的财务状况，预测企业未来发展趋势；

    - 反映企业偿债能力，估计企业近期现金支付能力以及获取现金的能力；

    - 揭示收付实现制下企业的经营净收益，弥补资产负债表的利润表的不足。


    ## 现金流量的分类


    企业活动


    经营活动

    operating activities

    销售商品或提供劳务、经营性租赁等活动。


    投资活动

    investing activities

    企业长期资产的购建和不包括在现金等价物范围内的投资及其处置活动。


    筹资活动

    financing activities

    导致企业资本及债务规模和构成发生变化的活动。


    ## 经营活动现金流量

    现金流入量

    - 1. 销售商品、提供劳务收到的现金

    - 2. 收到的税费返还

    - 3. 收到的其他与经营活动有关的现金


    现金流出量

    - 4. 购买商品、接受劳务支付的现金

    - 5. 支付给职工以及为职工支付的现金

    - 6. 支付的各项税费

    - 7. 支付的其他与经营活动有关的现金


    ## 投资活动产生的现金流量

    现金流入量

    - ① 收回投资所收到的现金

    - ② 取得投资收益所收到的现金

    - ③ 处置固定资产、无形资产和其他长期资产所收回的现金净额

    - ④ 收到的其他与投资活动有关的现金


    现金流出量

    - ⑤ 购建固定资产、无形资产和其他长期资产所支付的现金

    - ⑥ 投资所支付的现金

    - ⑦ 支付的其他与投资活动有关的现金


    ## 筹资活动产生的现金流量

    现金流入量

    - ① 吸收投资所收到的现金

    - ② 借款所收到的现金

    - ③ 收到的其他与筹资活动有关的现金


    现金流出量

    - ④ 偿还债务所支付的现金

    - ⑤ 分配股利、利润或偿还利息所支付的现金

    - ⑥ 支付的其他与筹资活动有关的现金

    - ⑦ 汇率变动对现金的影响


    ## 编制现金流量表

    - Preparing a statement of cash flows involves five steps:

    - 1. Compute the net increase or decrease in cash;

    - 2. Compute and report net cash provided or used by operating activities;

    - 3. Compute and report net cash provided or used by investing activities;

    - 4. Compute and report net cash provided or used by financing activities;

    - 5. Compute the net cash flow by combining net cash provided or used by operating,
    investing, and financing activities and then prove it by adding it to the beginning
    cash balance to show that it equals the ending cash balance.

