    \ |  |  | $12,650 |\n\nTMBC sold 43 bikes at a cash price of $350 each\n\n- First-in,\
    \ First-Out (FIFO)\n- Last-in, First-Out (LIFO)\n- Weighted Average\n\n## Last-in,\
