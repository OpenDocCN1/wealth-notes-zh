  mdcn: "\n\n## 存货跌价准备\n- 存货实质上发生减值时需要计提存货跌价准备\n- 账务处理：\n  - 借：资产减值损失\n  - 贷：存货跌价准备\n\
    \n## 存货的披露\n- 各类存货的期初和期末账面价值\n- 确定发出存货成本所采用的方法\n- 货可变现净值的确定依据，存货跌价准备的计提方法，当期计提的存货跌价准备的金额，当期转回的存货跌价准备的金额，以及计提和转回的有关情况\n\
    - 用于担保的存货账面价值\n\n我们通过建立 markdown 调整和存货损失调整，将存货按成本与市价孰低进行计价。\n\n我们的存货估值反映了成本超过我们预期从存货最终销售或其他处置中实现的金额的\
    \ markdown。\n\nMarkdown 确立了我们存货的新成本基础。随后事实或情况的变化不会导致之前记录的 markdown 的转回或该新确立成本基础的增加。\n\
    \n## BEST-BUY\n\n我们的存货估值还反映了自上次盘点以来发生的预期实物存货损失的调整，例如盗窃。定期进行实物盘点，以确保我们合并报表中报告的存货\n\
    \n我们的 markdown 调整包含不确定性，因为计算需要管理层对存货账龄、预测的消费者需求、促销环境和技术淘汰做出假设并运用判断。\n\n我们的存货损失调整包含不确定性，因为计算需要管理层对若干因素做出假设并运用判断，包括历史结果和当前存货损失趋势。\n\
    \n## Inventories\n\n存货按成本与市价孰低列示，成本采用先进先出法计算。如果存货成本超过其市价，则目前为成本与市价之间的差额计提准备。公司在所有列示期间的存货主要由组件和产成品组成。\n\
    \n商品存货采用后进先出法零售存货法按成本与市价孰低进行估值。根据零售存货法，存货按具有相似特征的商品部门进行划分，并按其当前零售售价列示。存货零售价值通过对每个商品部门应用特定的平均成本系数转换为成本基础。成本系数代表每个商品部门基于期初存货和财政年度采购活动的平均成本与零售比率。零售存货法固有地需要管理层的判断和估计，例如为清理无生产力或滞销存货而进行永久性\
    \ markdown 的金额和时间，这可能会影响期末存货估值以及毛利率。\n\n## 存货核算差异的财务报告效应\n资产负债表\n\n| Inventory\
