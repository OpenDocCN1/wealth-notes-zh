  md: "\n## Accounts Receivable Turnover Rate\n\n**Accounts Receivable Turnover**\
    \ = \\(\\frac{\\text{Net Sales}}{\\text{Average Accounts Receivable}}\\)\n\n**Accounts\
    \ Receivable Turnover** = \\(\\frac{\\$500,000}{(\\$17,000 + \\$20,000) \\div\
    \ 2}\\) =\n\n> This ratio measures how many times a company converts its receivables\
    \ into cash each year.\n\n![](img/a2796f05ebe2fd31075702d18360d28c_213_0.png)\n\
    \n## Days’ Sales Uncollected\n\nDay’s sales uncollected = Accounts receivable,\
    \ net / Net sales × 365\n\nProvides insight into how frequently a company collects\
    \ its accounts receivable.\n\n![](img/a2796f05ebe2fd31075702d18360d28c_214_0.png)\n\
    \n## Inventory Turnover Rate\n\nInventory Turnover = Cost of Goods Sold / Average\
    \ Inventory\n\nInventory Turnover = $140,000 / ($10,000 + $12,000) ÷ 2 = 12.73\
    \ times\n\nThis ratio measures the number of times merchandise inventory is sold\
    \ and replaced during the year.\n\n![](img/a2796f05ebe2fd31075702d18360d28c_215_0.png)\n\
    \n## Days’ Sales in Inventory\n\n| Day's sales in inventory = | Ending inventory\
    \ | × 365 |\n| | Cost of goods sold | |\n\nThis ratio is a useful measure in evaluating\
    \ inventory liquidity. If a product is demanded by customers, this formula estimates\
    \ how long it takes to sell the inventory.\n\n![](img/a2796f05ebe2fd31075702d18360d28c_216_0.png)\n\
    \n## Operating Cycle\n\nCash\n\nInventory\n\nAccounts Receivable\n\n1. Purchase\
    \ of Merchandise\n\n2. Sale of merchandise on account\n\n3. Collection of accounts\
    \ receivable\n\n## 常用财务比率\n\n## 表3-8　常用的财务比率\n\n+ 1. **短期偿债能力（或流动性）比率**\n   -\
    \ 流动比率=流动资产/流动负债\n   - 速动比率=（流动资产－存货）/流动负债\n   - 现金比率=现金/流动负债\n   - 净营运资本对资产总额的比率=净营运资本/资产总额\n\
    \   - 间隔时间指标=流动资产/日均经营成本\n\n+ 2. **长期偿债能力（或财务杠杆）比率**\n   - 总负债率=（资产总额－权益总额）/资产总额\n\
    \   - 债务权益率=债务总额/权益总额\n   - 权益乘数=资产总额/权益总额\n   - 长期负债率=长期负债/（长期负债+权益总额）\n   -\
    \ 利息保障倍数=EBIT/利息\n   - 现金涵盖率=（EBIT+折旧）/利息\n\n+ 3. **资产利用（或周转）比率**\n   - 存货周转率=销售成本/存货\n\
    \   - 存货周转天数=365/存货周转率\n   - 应收账款周转率=销售收入/应收账款\n   - 应收账款周转天数=365/应收账款周转率\n  \
    \ - 净营运资本周转率=销售收入/净营运资本\n   - 固定资产周转率=销售收入/固定资产净值\n   - 总资产周转率=销售收入/资产总额\n\n+\
    \ 4. **获利能力比率**\n   - 利润率=净利润/销售收入\n   - 资产报酬率（ROA）=净利润/资产总额\n   - 权益报酬率（ROE）=净利润/权益总额\n\
    \n权益报酬率 = 净利润/销售收入 × 销售收入/资产 × 资产/权益\n\n+ 5. **市场价值比率**\n   - 市价-盈余比率=每股价格/每股盈余\n\
    \   - 市盈率与增长比率=市价盈余比率/盈余增长比率\n   - 价销比=每股价格/每股销售额\n   - 市价-账面价值比率=每股市价/每股账面价值\n\
    \   - 托宾Q=资产的市场价值/资产重置成本\n\n## 财务比率的使用与局限\n\n## Uses\n\n## Limitations\n\nRatios\
    \ help users understand financial relationships.\n\nRatios provide for quick comparison\
    \ of companies.\n\nManagement may enter into transactions merely to improve the\
    \ ratios.\n\nRatios do not help with analysis of the company's progress toward\
    \ nonfinancial goals.\n\n## 报表分析可能存在的问题\n\n- 由于缺乏理论的支持，很难找出相关性最强的财务比率来\n- 对多元化经营的公司来说，很难找到比较的标准\n\
    - 全球化经营和竞争使得可比性更难以得到保证，因为不同国家的会计规范本身就存在着差异\n- 会计政策的变化，如存货计价时，可以选用先进先出法（FIFO）或者后进先出法（LIFO）\n\
    - 各个公司之间的财务年度起止日可能不同\n- 特别突发事件的影响\n\n## Average Ratios, by Industry\n\n| Table\
    \ 4.7 | LT Debt Assets | Interest Coverage | Current ratio | Quick ratio | Asset\
    \ Turnover | Profit margin (%) | Return on Assets (%) | Return on Equity (%) |\
    \ Payout Ratio |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n| All Manufacturing\
    \ | 0.22 | 2.58 | 1.43 | 1.03 | 0.77 | 5.19 | 4.02 | 12.94 | 0.43 |\n| Food Products\
    \ | 0.28 | 3.74 | 1.40 | 0.84 | 1.19 | 7.99 | 9.52 | 18.09 | 0.47 |\n| Clothing\
    \ | 0.21 | 9.60 | 1.39 | 0.54 | 2.01 | 6.99 | 14.04 | 22.48 | 0.09 |\n| Beverage\
    \ & Tobacco | 0.27 | 3.95 | 1.15 | 0.52 | 2.82 | 3.20 | 9.04 | -4.43 | -0.54 |\n\
    | Chemicals | 0.26 | 2.62 | 1.36 | 1.04 | 0.48 | 9.04 | 4.34 | 22.12 | 0.36 |\n\
    | Drugs | 0.24 | 3.19 | 1.56 | 1.28 | 0.38 | 11.00 | 4.20 | 26.08 | 0.29 |\n|\
    \ Machinery | 0.18 | 2.83 | 1.32 | 0.90 | 0.70 | 6.15 | 4.33 | 8.55 | 0.66 |\n\
    | Electrical | 0.12 | 4.30 | 1.10 | 0.72 | 0.59 | 8.02 | 4.75 | 9.55 | 0.54 |\n\
    | Motor Vehicles | 0.20 | -0.24 | 0.99 | 0.77 | 0.98 | -0.42 | -0.41 | -25.25\
    \ | -0.24 |\n| Computer and Electronic | 0.16 | 3.26 | 1.94 | 1.64 | 0.59 | 4.92\
    \ | 2.91 | 16.29 | 0.08 |\n| Paper | 0.32 | 2.68 | 1.27 | 0.90 | 0.89 | 7.96 |\
    \ 7.09 | 13.38 | 0.47 |\n\n*Source:* Authors’ calculations using data from U.S.\
    \ Department of Commerce, *Quarterly Financial Report for Manufacturing, Mining\
    \ and Trade Corporations*, March 2010. Available at http://www.census.gov/con/qfr/current/qfr_pub.pdf\n"
  mdcn: "\n\n## 应收账款周转率\n\n**应收账款周转率** = \\(\\frac{\\text{销售收入}}{\\text{平均应收账款}}\\\
    )\n\n**应收账款周转率** = \\(\\frac{\\$500,000}{(\\$17,000 + \\$20,000) \\div 2}\\) =\n\
    \n> 该比率衡量企业每年将应收账款转换为现金的次数。\n\n![](img/a2796f05ebe2fd31075702d18360d28c_213_0.png)\n\
    \n## 应收账款周转天数\n\n应收账款周转天数 = 应收账款净额 / 销售收入 × 365\n\n该指标有助于了解企业收回应收账款的频率。\n\n![](img/a2796f05ebe2fd31075702d18360d28c_214_0.png)\n\
    \n## 存货周转率\n\n存货周转率 = 销售成本 / 平均存货\n\n存货周转率 = $140,000 / ($10,000 + $12,000) ÷\
    \ 2 = 12.73 次\n\n该比率衡量企业在一个年度内存货被销售和替换的次数。\n\n![](img/a2796f05ebe2fd31075702d18360d28c_215_0.png)\n\
    \n## 存货周转天数\n\n| 存货周转天数 = | 期末存货 | × 365 |\n| | 销售成本 | |\n\n该比率是评估存货流动性的有用指标。如果某种产品有客户需求，该公式可估算销售该存货所需的时间。\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_216_0.png)\n\n## 营业周期\n\n现金\n\n存货\n\
    \n应收账款\n\n1. 购买商品\n\n2. 赊销商品\n\n3. 收回应收账款\n\n## 常用财务比率\n\n## 表3-8　常用的财务比率\n\n\
    + 1. **短期偿债能力（或流动性）比率**\n   - 流动比率=流动资产/流动负债\n   - 速动比率=（流动资产－存货）/流动负债\n   - 现金比率=现金/流动负债\n\
    \   - 净营运资本对资产总额的比率=净营运资本/资产总额\n   - 间隔时间指标=流动资产/日均经营成本\n\n+ 2. **长期偿债能力（或财务杠杆）比率**\n\
    \   - 总负债率=（资产总额－权益总额）/资产总额\n   - 债务权益率=债务总额/权益总额\n   - 权益乘数=资产总额/权益总额\n   - 长期负债率=长期负债/（长期负债+权益总额）\n\
    \   - 利息保障倍数=EBIT/利息\n   - 现金涵盖率=（EBIT+折旧）/利息\n\n+ 3. **资产利用（或周转）比率**\n   - 存货周转率=销售成本/存货\n\
    \   - 存货周转天数=365/存货周转率\n   - 应收账款周转率=销售收入/应收账款\n   - 应收账款周转天数=365/应收账款周转率\n  \
    \ - 净营运资本周转率=销售收入/净营运资本\n   - 固定资产周转率=销售收入/固定资产净值\n   - 总资产周转率=销售收入/资产总额\n\n+\
    \ 4. **获利能力比率**\n   - 利润率=净利润/销售收入\n   - 资产报酬率（ROA）=净利润/资产总额\n   - 权益报酬率（ROE）=净利润/权益总额\n\
    \n权益报酬率 = 净利润/销售收入 × 销售收入/资产 × 资产/权益\n\n+ 5. **市场价值比率**\n   - 市价-盈余比率=每股价格/每股盈余\n\
    \   - 市盈率与增长比率=市价盈余比率/盈余增长比率\n   - 价销比=每股价格/每股销售额\n   - 市价-账面价值比率=每股市价/每股账面价值\n\
    \   - 托宾Q=资产的市场价值/资产重置成本\n\n## 财务比率的使用与局限\n\n## 用途\n\n## 局限\n\n比率有助于用户理解财务关系。\n\
    \n比率可以快速比较不同公司。\n\n管理层可能仅仅为了改善比率而进行交易。\n\n比率无助于分析公司在非财务目标方面的进展。\n\n## 报表分析可能存在的问题\n\
    \n- 由于缺乏理论的支持，很难找出相关性最强的财务比率来\n- 对多元化经营的公司来说，很难找到比较的标准\n- 全球化经营和竞争使得可比性更难以得到保证，因为不同国家的会计规范本身就存在着差异\n\
    - 会计政策的变化，如存货计价时，可以选用先进先出法（FIFO）或者后进先出法（LIFO）\n- 各个公司之间的财务年度起止日可能不同\n- 特别突发事件的影响\n\
    \n## 行业平均比率\n\n| 表4.7 | 长期债务/资产 | 利息保障倍数 | 流动比率 | 速动比率 | 资产周转率 | 利润率（%） | 资产报酬率（%）\
    \ | 权益报酬率（%） | 股利支付率 |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n|\
