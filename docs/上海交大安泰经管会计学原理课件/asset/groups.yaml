    | Gross profit | $70,000 |\n| Operating expenses | 46,500 |\n| Net income | $23,500\
    \ |\n\n## 销售环节的周期\n\n从购买开始到销售收款结束\n\n### 销售周期\n\n- 收到现金\n- 购买原材料或者产品\n- 产品生产\n\
