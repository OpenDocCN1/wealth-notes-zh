    ## 资产负债率


    ![](img/a2796f05ebe2fd31075702d18360d28c_429_0.png)


    ## 不同行业的平均资产负债率


    - 一般行业企业的正常负债率在30%-50%，部分行业可以放宽在60%左右，而70%的负债率则是普遍认为的警戒线，除金融业和航空业外。

    - 金融类公司以86.72%成为负债率最高的行业，而信息传媒业公司的平均负债率最低，仅33.3%。

    - 平均负债率约45.98%

    - 平均资产负债率50%及以上的行业:农业、有色金属、交运设备、家电、公共事业5个行业，分别为50%、51.9%、52.53%、54.02%、50.69%。

    - 平均资产负债率低于40%的行业还有包括信息设备、食品饮料、医药三个行业，分别为37.057%、37.049%、37.69%。

    - 化工、采矿、建筑、电子元件、纺织、轻工、交通运输七个行业的上市前平均资产负债率则在40%-50%。


    ## 长期借款


    - 企业向金融机构等借入的长期借款，在会计核算中设置“长期借款”科目核算。长期借款的核算需要注意以下几点：


    （一）长期借款所发生的利息支出，应按照权责发生制的原则按期预提计入在建项目的成本或计入当期财务费用。


    （二）长期借款的本金和利息，均应计入“长期借款”科目。


    ## 长期借款


    - 本金借入时，借记“现金”，贷记“长期借款（本金）”。

    - 长期借款往往与固定资产购建相联系，此时，固定资产竣工结算前的应计利息，定期计入“在建工程”，贷记“应付利息”；固定资产竣工结算后的应计利息，借记“财务费用”，贷记“应付利息”。

    - 付息和/或还本时，借记“长期借款”，贷记“现金”

    - 利息资本化问题


    ## 应付债券


    - 长期债券是企业筹集长期使用资金而发行的一种书面凭证。


    ![](img/a2796f05ebe2fd31075702d18360d28c_433_0.png)


    ![](img/a2796f05ebe2fd31075702d18360d28c_433_1.png)


    ## 债券融资


    ### 优点


    ### 缺点


    不影响控制权


    要求定期支付利息,到期偿还本金


    债券利息可以抵税


    当债务资本成本高于投资回报率时,债券融资降低ROE


    增加ROE


    ## 三、发行总额


    本期债券的发行规模为 200 亿元。


    ## 四、票面金额和发行价格


    本期债券面值 100 元，按面值平价发行。


    ## 五、债券期限及规模


    本期债券分为 5 年期固定利率、10 年期固定利率和 15 年期固定利率三个品种，最终发行规模分别为 160 亿元、20 亿元和 20 亿元。


    ## 七、债券利率和还本付息方式


    本期债券三个品种均为固定利率，在债券存续期内固定不变。本期债券采用单利按年计息，不计复利。每年付息一次，到期一次还本，最后一次利息随本金的兑付一起支付。


    发行人和簿记管理人于 2012 年 11 月 21 日在网下向机构投资者进行了票面利率询价，根据网下向机构投资者询价统计结果，经发行人和簿记管理人充分协商和审慎判断，最终确定本期债券
    5 年期品种票面利率为 4.55%，10 年期品种票面利率为 4.90%，15 年期品种票面利率为 5.04%。


