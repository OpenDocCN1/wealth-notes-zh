    \ | 9.60 | 1.39 | 0.54 | 2.01 | 6.99 | 14.04 | 22.48 | 0.09 |\n| 饮料与烟草 | 0.27\
    \ | 3.95 | 1.15 | 0.52 | 2.82 | 3.20 | 9.04 | -4.43 | -0.54 |\n| 化学品 | 0.26 |\
    \ 2.62 | 1.36 | 1.04 | 0.48 | 9.04 | 4.34 | 22.12 | 0.36 |\n| 药品 | 0.24 | 3.19\
    \ | 1.56 | 1.28 | 0.38 | 11.00 | 4.20 | 26.08 | 0.29 |\n| 机械 | 0.18 | 2.83 | 1.32\
    \ | 0.90 | 0.70 | 6.15 | 4.33 | 8.55 | 0.66 |\n| 电气 | 0.12 | 4.30 | 1.10 | 0.72\
