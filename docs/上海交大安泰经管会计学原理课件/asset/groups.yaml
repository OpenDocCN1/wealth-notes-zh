    # 或有事项：预计负债与或有负债


    +   - 什么是或有事项

    +   - 或有负债的主要问题是：在资产负债表日，还不能确定这些负债是否业已存在'
  - '[PAGE 407]


    # 或有事项的含义及其基本特征


    # 或有事项的含义


    或有事项指过去的交易或事项形成的，其结果须由某些未来事项的发生或不发生才能决定的不确定事项。


    常见的或有事项有：商业票据背书转让或贴现、未决诉讼、未决仲裁、债务担保、产品质量保证（含产品安全保证）等。'
  - '[PAGE 408]


    # 或有事项具有以下基本特征


    +   1. 或有事项是因过去的交易或者事项形成的

    +   2. 或有事项的结果具有不确定性

    +   3. 或有事项的结果只能由未来发生的事项确定'
  - '[PAGE 409]


    +   - 应付金额须予估计的流动负债——预计负债

    +   - 或有负债'
  - '[PAGE 410]


    # 预计负债的确认


    如果与或有事项相关的义务同时符合以下条件，企业应将其确认为负债：


    +   1. 该义务是企业承担的现时义务；

    +   2. 该义务的履行很可能导致经济利益流出企业；

    +   3. 该义务的金额能够可靠地计量。


    多大概率是很可能？'
  - '[PAGE 411]


    该义务的履行很可能导致经济利益流出企业：


    “很可能”指发生的可能性为“大于50%但小于或等于95%”。通过“预计负债”账户核算。


    与“很可能”有关的其他概念的含义如下：


    “基本确定”指发生的可能性为“大于95%但小于100%”。


    “可能”指发生的可能性为“大于5%但小于或等于50%”。


    “极小可能”指发生的可能性为“大于0但小于或等于5%”'
  - '[PAGE 412]


    # 预计负债的计量


    或有事项的计量所涉及的问题是，当与或有事项有关的义务符合确认为负债的条件时，应以多少金额确认。


    或有事项的计量主要涉及两个问题：


    +   - 一是最佳估计数的确定；

    +   - 二是预期可获得的补偿的处理'
  - "[PAGE 413]\n\n# 最佳估计数的确定\n\n+   1. 如果所需支出存在一个金额区间，则最佳估计数应按该区间的上、下限金额的平均数确定。\n\
    +   \n+   2. 如果所需支出不存在一个金额区间，则最佳估计数应分别情况处理：\n+   \n+      （1）或有事项涉及单个项目时，最佳估计数按最可能发生金额确定。\n\
    +   \n+      （2）或有事项涉及多个项目时，最佳估计数按各种可能发生额及其发生概率计算确定。"
