    \n大型建筑业、造船业\n\n### 销售商品收入的计量方法\n\n- 基本原则：通常为已收或应收金额\n  - 现金折扣：扣除现金折扣前的金额确定收入；现金折扣发生时计入财务费用\n\
    \  - 商业折扣：扣除商业折扣后的金额确定收入\n  - 销售折让：通常冲减当期收入（资产负债表日后事项）\n  - 销售退回：通常冲减当期收入（资产负债表日后事项）\n\
    \n"
