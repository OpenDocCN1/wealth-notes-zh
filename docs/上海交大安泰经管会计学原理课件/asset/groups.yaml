  md: "\n## Use this information to calculate the profitability ratios for Babson\
    \ Builders, Inc. 2009\n\n| Babson Builders, Inc. 2009 | |\n|---|---|\n| Ending\
    \ market price per share | $15.25 |\n| Number of common shares outstanding all\
    \ of 2009 | 27,400 |\n| Net income | $53,690 |\n| Total shareholders' equity |\
    \ |\n| Beginning of year | 180,000 |\n| End of year | 234,390 |\n| Revenues |\
    \ 494,000 |\n| Cost of sales | 140,000 |\n| Total assets | |\n| Beginning of year\
    \ | 300,000 |\n| End of year | 346,390 |\n\n## Profit Margin\n\n\\[\n\\text{Profit\
    \ margin} = \\frac{\\text{Net income}}{\\text{Net sales}}\n\\]\n\nThis ratio describes\
    \ a company's ability to earn profit from each sales dollar.\n\n## Return on Assets\
    \ (ROA)\n\nThis ratio is generally considered the best overall measure of a company's\
    \ profitability.\n\n![](img/a2796f05ebe2fd31075702d18360d28c_187_0.png)\n\n```\n\
    ROA = Net income ÷ Average total assets\n    = $53,690 ÷ [($300,000 + $346,390)\
    \ ÷ 2]\n    = 16.61%\n```\n\n## Return on Equity (ROE)\n\n![](img/a2796f05ebe2fd31075702d18360d28c_188_0.png)\n\
    \nThis measure indicates how well the company employed the owners' investments\
    \ to earn income.\n\n```\nROE = Net income ÷ Average total equity\n    = $53,690\
    \ ÷ [($180,000 + $234,390) ÷ 2]\n    = 25.91%\n```\n\n## Earnings Per Share\n\n\
    \\[\n\\text{EPS} = \\frac{\\text{Net income}}{\\text{Average shares of capital\
    \ stock outstanding}}\n\\]\n\nLook back at the information from Babson and get\
    \ the values we need to calculate earnings per share.\n\n\\[\n\\frac{\\$53,690}{27,400}\
    \ = \\$1.96\n\\]\n\n![](img/a2796f05ebe2fd31075702d18360d28c_190_0.png)\n\n##\
    \ Market-Based Measures\n\n### Price-Earnings Ratio\n\n![](img/a2796f05ebe2fd31075702d18360d28c_191_0.png)\n\
    \n\\[\n\\frac{\\text{Current market price of one share of stock}}{\\text{Earnings\
    \ per share}} = \\text{P/E}\n\\]\n\n\\[\n\\frac{\\$15.25}{\\$1.96} = 7.78\n\\\
    ]\n\nThe measure shows us the relationship between earnings of the company and\
    \ the market price of its stock.\n\n![](img/a2796f05ebe2fd31075702d18360d28c_192_0.png)\n\
    \n### Dividend Yield\n\n\\[\n\\text{Dividend Yield Ratio} = \\frac{\\text{Dividends\
    \ per share}}{\\text{Market price per share}}\n\\]\n\nBabson Builders pays an\
    \ annual dividend of $1.50 per share of capital stock. The market price of the\
    \ company's capital stock was $15.25 at the end of 2009.\n\nThis ratio identifies\
    \ the return, in terms of cash dividends, on the current market price of the stock.\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_193_0.png)\n\n## Market Value Added\n\
    \n**What is it?**\n\n**Why is it useful?**\n\n**Defined:**\n\n```\nMarket Value\
    \ Added = [Share Price × Shares Outstanding] - Equity Book Value\n```\n\n## MVA:\
