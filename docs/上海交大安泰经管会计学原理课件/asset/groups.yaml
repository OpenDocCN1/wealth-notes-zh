    \ valuation reflects markdowns for the excess of the cost over the amount we expect\
    \ to realize from the ultimate sale or other disposal of the inventory.\n\nMarkdowns\
    \ establish a new cost basis for our inventory. Subsequent changes in facts or\
    \ circumstances do not result in the reversal of previously recorded markdowns\
    \ or an increase in that newly established cost basis.\n\n## BEST-BUY\n\nOur inventory\
    \ valuation also reflects adjustments for anticipated physical inventory losses\
    \ (e.g., theft) that have occurred since the last physical inventory. Physical\
    \ inventory counts are taken on a regular basis to ensure that the inventory reported\
    \ in our consolidat\n\nOur markdown adjustment contains uncertainties because\
    \ the calculation requires management to make assumptions and to apply judgment\
    \ regarding inventory aging, forecasted consumer demand, the promotional environment\
    \ and technological obsolescence.\n\nOur inventory loss adjustment contains uncertainties\
    \ because the calculation requires management to make assumptions and to apply\
    \ judgment regarding a number of factors, including historical results and current\
    \ inventory loss trends.\n\n## Inventories\n\nInventories are stated at the lower\
    \ of cost, computed using the first-in, first-out method, or market. If the cost\
    \ of the inventories exceeds their market value, provisions are made currently\
    \ for the difference between the cost and the market value. The Company’s inventories\
    \ consist primarily of components and finished goods for all periods presented.\n\
    \nMerchandise inventories are valued at lower of cost or market using the last-in,\
    \ first-out (LIFO) retail inventory method. Under the retail inventory method,\
    \ inventory is segregated into departments of merchandise having similar characteristics,\
    \ and is stated at its current retail selling value. Inventory retail values are\
    \ converted to a cost basis by applying specific average cost factors for each\
    \ merchandise department. Cost factors represent the average cost-to-retail ratio\
    \ for each merchandise department based on beginning inventory and the fiscal\
    \ year purchase activity. The retail inventory method inherently requires management\
    \ judgments and estimates, such as the amount and timing of permanent markdowns\
    \ to clear unproductive or slow-moving inventory, which may impact the ending\
    \ inventory valuation as well as gross margins.\n\n## 存货核算差异的财务报告效应\n资产负债表\n\n\
