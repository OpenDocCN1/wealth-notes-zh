    # 利润


    （1）营业利润 = 营业收入 - 营业成本 - 营业税金及附加 - 管理费用 - 销售费用 - 财务费用 - 资产减值损失 + 公允价值变动收益（-公允价值变动损失）
    + 投资收益（-投资损失）


    （2）利润总额 = 营业利润 + 营业外收入 - 营业外支出


