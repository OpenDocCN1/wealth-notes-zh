    # 四、票面金额和发行价格


    本期债券面值 100 元，按面值平价发行。


    # 五、债券期限及规模


    本期债券分为 5 年期固定利率、10 年期固定利率和 15 年期固定利率三个品种，最终发行规模分别为 160 亿元、20 亿元和 20 亿元。


    # 七、债券利率和还本付息方式


    本期债券三个品种均为固定利率，在债券存续期内固定不变。本期债券采用单利按年计息，不计复利。每年付息一次，到期一次还本，最后一次利息随本金的兑付一起支付。


    发行人和簿记管理人于 2012 年 11 月 21 日在网下向机构投资者进行了票面利率询价，根据网下向机构投资者询价统计结果，经发行人和簿记管理人充分协商和审慎判断，最终确定本期债券
    5 年期品种票面利率为 4.55%，10 年期品种票面利率为 4.90%，15 年期品种票面利率为 5.04%。'
