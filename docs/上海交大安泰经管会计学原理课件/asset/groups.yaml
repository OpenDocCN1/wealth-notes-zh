    - 坏账损失：因坏账而遭受的损失为坏账损失。\n\n![](img/a2796f05ebe2fd31075702d18360d28c_255_0.png)\n\
    \n## 坏账损失\n\n- （二）坏账损失的确认条件：\n- 对有确凿证据表明确实无法收回的应收款项，如债务单位已撤消、破产、资不抵债、库存现金流量严重不足等，根据企业的管理权限，经股东大会或董事会，或经理（厂长）办公会或类似机构批准作为坏账损失，冲销提取的坏账准备\n\
    - 坏账损失与坏账准备之间的联系和区别？\n\n## 坏账准备\n\n- (三) 坏账损失的核算方法：\n- 1. 直接转销法\n\n坏账损失发生时确认，增加“资产减值损失（坏账费用）”，冲减“应收账款”\n\
    \n- 2. 备抵法\n\n坏账损失发生之前预计损失，形成准备(增加“资产减值损失（坏账费用）”,增加“坏账准备”)\n\n发生时冲减准备，同时冲减应收账款(减少“坏账准备”,减少“应收账款”)\n\
    \n当以前年度已经确认为损失的坏账又收回，恢复应收账款和坏账准备（增加“应收账款”,增加“坏账准备”）\n\n注意：我国企业会计制度规定，企业应采用备抵法进行坏账的核算\n\
    \n## 坏账准备\n\n公司基于对各种因素的评估计提坏账准备。公司考虑历史经验、应收账款余额的账龄、客户的信用质量、当前的经济状况，以及其他可能影响客户付款能力的因素。\n\
    \n## 坏账准备\n\n- 三种计算方法\n  - 销货百分比法（当年销货赊销金额×计提比例）\n  - 应收账款余额百分比法（应收款项期末余额×计提比例）\n\
    \  - 应收账款的账龄分析法（根据应收款项账龄的长短来估计）\n\n## 销货百分比法\n\n### ①销货百分比法\n\n以赊销金额的一定百分比作为估计的坏账损失\n\
    \n- 采用这一方法的理由：\n- 坏账仅和当期因赊销而发生的应收款项有关，与当期的现款销售无关，当期赊销业务越多，产生坏账的损失就越大\n- 根据过去的经验和有关资料，估计坏账损失与赊销金额之间的比率，也可用其他更合理的方法进行估计\n\
    \n## 销货百分比法\n\n- 例：根据过去5年的资料，赊销金额中估计坏账的百分比为2%，若本期实际赊销金额为200 000万元，则：\n- 本期估计的坏账损失=200\
    \ 000×2%=4 000\n- 注意：在销货百分比法下，一般不需要调整坏账准备余额，如果坏账准备出现异常现象，应及时调整估计坏账的比例\n\n## 应收账款余额百分比法\n\
    \n- ②应收账款余额百分比法\n- 按应收款项期末余额的一定比例计算提取坏账准备\n- 理论上讲，这一比例应按坏账占应收款项的概率计算，发生坏账多的企业，比例就相应高一些，反之则低一些\n\
    \n## 应收账款余额百分比法\n\n- 计提公式（分两步）：\n- 坏账准备期末应有数\n- =应收款项期末余额×计提比例\n- 本期提取数\n- =坏账准备期末应有数-坏账准备贷方余额\n\
    - 或=坏账准备期末应有数+坏账准备借方余额\n- 注意：此方法下，各年末，企业“坏账准备”的余额始终与应收款项年末余额成百分比关系\n\n## 应收账款余额百分比法\n\
    \n- 例：某公司某期应收账款的期末余额为 **100,000** 元，坏账准备的计提比例为 **2%**，坏账准备的贷方期末余额是 **500** 元\n\
    - 坏账准备期末应有数 = 100,000 × 2% = 2,000\n- 本期提取数 = 2,000 - 500 = 1,500\n- 借：资产减值损失（坏账费用）　1,500\n\
    - 贷：坏账准备　　　　　　　1,500\n\n例：某公司从2011年开始使用备抵法预计坏账损失，2011年~2013年应收账款的年末余额均为1000万元，坏账准备的计提比例为5%，2012年发生坏账3万元；2013年发生坏账1万元，另外2012年核销的坏账中有2万元又收回。\n\
    \n2011年：应计提的坏账准备为：\n1000×5%=5\n①借：资产减值损失（坏账费用） 5\n贷：坏账准备 5\n\n2012年：发生坏账时：\n②借：坏账准备\
    \ 3\n贷：应收账款 3\n年末应补提的坏账准备为：\n1000×5%−2=3\n③借：资产减值损失 3\n贷：坏账准备 3\n\n2013年：发生坏账时：\n\
    ④借：坏账准备 1\n贷：应收账款 1\n以前年度核销的坏账又收回时：\n⑤借：应收账款 2\n贷：坏账准备 2\n同时⑥借：银行存款 2\n贷：应收账款\
    \ 2\n\n年末应补提的坏账准备为：\n1000×5%−6=−1（万元）\n即应冲销多提准备金1万元：\n⑦借：坏账准备 1\n贷：资产减值损失（坏账费用）\
    \ 1\n\n## 账龄分析法\n\n- ③账龄分析法\n- 根据应收款项账龄的长短来估计坏账的方法。\n- 账龄指的是顾客所欠账款的时间。\n- 理由：账款被拖欠的期限越长，发生坏账的可能性就越大\n\
    - 利用账龄分析表所提供的信息，确定坏账准备金额\n- 方法：按各类账龄分别估计其可能成为坏账的部分\n\n## 坏账损失估计计算表 2012.12.31\n\
    \n| 账龄 | 应收账款金额 | 估计损失比例 | 估计损失金额 |\n|---|---|---|---|\n| 未到期 | 25 000 | 1% |\
    \ 250 |\n| 过期1个月 | 20 000 | 3% | 600 |\n| 过期2个月 | 15 000 | 5% | 750 |\n| 过期3个月\
    \ | 10 000 | 7% | 700 |\n| 过期4个月 | 8 000 | 20% | 1 600 |\n| 过期5个月 | 5 000 | 50%\
    \ | 2 500 |\n| 破产或追诉中 | 2 000 | 80% | 1 600 |\n| 合 计 | 85 000 |  | 8 000 |\n\n\
    ## 例题\n\n- 承上图表，若该公司2011.12.31提取坏账准备前，\n“坏账准备”账户余额为3 000元，则：\n- 应提取坏账准备金额\n- =8\
    \ 000-3 000=5 000（元）\n- 借：资产减值损失（坏账费用） 5 000\n- 贷：坏账准备 5 000\n\n## 坏账准备\n\n- 在采用账龄分析法时，各期估计的坏账损失应同账面上原有的坏账准备进行比较，并调整“坏账准备”科目余额，使之与估计坏账损失数额一致（即应有数和计提数的关系）\n\
    - 账龄分析法比较直接地表明了应收款项的估计可变现数额\n\n## 三种方法总结\n\n| 销货百分比法 | 应收账款余额百分比法 | 账龄分析法 |\n\
    |---|---|---|\n| **强调配比** | **强调可实现价值** | **强调可实现价值** |\n| 赊销额 → 坏账费用 | 应收账款 →\
    \ 坏账准备 | 应收账款 → 坏账准备 |\n\n![](img/a2796f05ebe2fd31075702d18360d28c_271_0.png)\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_271_1.png)\n\n## 小组讨论题\n\n赊销百分比法与应收账款余额法的差异在哪里？\n\
    选择不同的方法，对于公司的财务影响是什么？\n\n## 案例讨论：神州股份(0968)坏账准备\n\n山西神州煤电焦化股份有限公司2001年年度报告披露：由于关闭小煤窑等因素影响，煤焦供不应求，公司应收账款首次呈下降趋势，公司2001年收回以前年度货款4614万元，应收账款期末比期初下降8.29%，为了更好地反映公司应收账款实际情况，公司第一届董事会第20次会议（2002年3月19日召开，年报公布时间是2002年3月22日）决定变更坏账准备政策。相关资料如下表所示。\n\
    \n"
