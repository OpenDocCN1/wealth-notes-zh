    \ | ---: | ---: | ---: | ---: |\n| +282 000 | +30 000 | +20 000 | 0 | +12 000\
    \ | +280 000 |\n|  |  |  | +20 000 |  | -20 000 |\n\n> 这类经济业务的发生，使会计等式的右方有增有减\n\
    \n业务10：2013年12月30日，昂立公司将其对服务中心投资60 000元，转让给慧谷公司，有关手续已办妥。\n\n![](img/a2796f05ebe2fd31075702d18360d28c_54_0.png)\n\
    \n| 银行存款 | 原材料 | 短期借款 | 应付账款 | 应付票据 | 实收资本 |\n| ---: | ---: | ---: | ---: | ---:\
    \ | ---: |\n| +262 000 | +30 000 | +20 000 | +20 000 | +12 000 | +240 000 |\n\
    |  |  |  |  |  | +60 000 |\n|  |  |  |  |  | -60 000 |\n\n> 这类经济业务的发生，使会计等式的右方有增有减\n\
    \n业务11：本月份服务中心在营运中，支付房屋租金3 600元，员工工资11 200元，水电费740元以及其他杂项费用460元，共计16 000元，耗用维修材料14\
    \ 000元。\n\n![](img/a2796f05ebe2fd31075702d18360d28c_55_0.png)\n\n| 银行存款 | 原材料\
    \ | 短期借款 | 应付账款 | 应付票据 | 实收资本 | 营业费用（-） |\n| ---: | ---: | ---: | ---: | ---:\
    \ | ---: | ---: |\n| +262 000 | +30 000 | +20 000 | +20 000 | +12 000 | +240 000\
    \ |  |\n| -16 000 | -14 000 |  |  |  |  | -30 000 |\n\n> 这类经济业务的发生，使会计等式的左右两方同时等额减少\n\
    \n业务12：本月份服务中心收入40 000元，收到现金28 000元，已存入银行，余款尚未收到。\n\n![](img/a2796f05ebe2fd31075702d18360d28c_56_0.png)\n\
    \n| 银行存款 | 原材料 | 应收账款 | 短期借款 | 应付账款 | 应付票据 | 实收资本 | 营业费用（-） | 营业收入（+） |\n| ---:\
    \ | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n| +246 000 | +16\
    \ 000 |  | +20 000 | +20 000 | +12 000 | +240 000 | -30 000 |  |\n| +28 000 |\
    \  | +12 000 |  |  |  |  |  | +40 000 |\n\n> 这类经济业务的发生，使会计等式的左右两方同时等额增加\n\n##\
    \ 结论\n\n（1）每一项经济业务的发生都会引起两个或两个以上的资产和权益项目发生增减变化，但其变化结果不会破坏“资产=负债+所有者权益”这一基本会计等式的恒等关系。这一恒等关系是会计上设置账户、复式记账及编制资产负债表的理论依据。\n\
    \n（2）企业单位内部发生的经济业务种类繁多，但归结起来不外乎四种类型：\n\n- 资产和权益同时等额增加。如业务1、3、4、12\n- 资产和权益同时等额减少。如业务5、9、11\n\
    - 资产内部有关项目有增有减。如业务2\n- 权益内部有关项目有增有减。如业务6、7、8、10\n\n（3）在以上四种类型中，第一、二种类型将使企业的资产和权益总额发生增减变化，但不破坏其平衡关系；第三、四种类型只影响资产和权益内部有关项目发生增减变化，而资产和权益的总额保持不变。\n\
    \n### 经济业务的发生对会计等式的影响类型图\n\n![](img/a2796f05ebe2fd31075702d18360d28c_60_0.png)\n\
    \n（4）在会计实务中，上述四种类型可以进一步分解为九种形式。\n\n### 经济业务的发生对会计等式的影响\n\n| 类型 | 资产 | 负债 | 所有者权益\
    \ | 业务 |\n| --- | --- | --- | --- | --- |\n| ① 资产增加，负债增加 | 增加 | 增加 |  | 3、4 |\n\
    | ② 资产增加，所有者权益增加 | 增加 |  | 增加 | 1、12 |\n| ③ 资产减少，负债减少 | 减少 | 减少 |  | 5 |\n| ④\
    \ 资产减少，所有者权益减少 | 减少 |  | 减少 | 9、11 |\n| ⑤ 资产内部有增有减 | 增加/减少 |  |  | 2 |\n| ⑥ 负债内部有增有减\
    \ |  | 增加/减少 |  | 6 |\n| ⑦ 所有者权益内部有增有减 |  |  | 增加/减少 | 10 |\n| ⑧ 负债增加，所有者权益减少\
    \ |  | 增加 | 减少 | 8 |\n| ⑨ 负债减少，所有者权益增加 |  | 减少 | 增加 | 7 |\n\n## 会计事项分析结果的呈报\n\n\
    至2013年12月底，交大服务中心经营一个月后，昂立公司想了解一下其投资的情形。其所关心的问题可归纳为以下几个方面：\n\n- （1）交大服务中心一个月经营的结果如何？是盈利还是亏损，金额多大？\n\
    - （2）昂立公司在交大服务中心所拥有的权益增减变动情况如何？\n- （3）月底时，交大服务中心的财务状况如何？现金流量如何？\n\n### 交大服务中心利润表\n\
    \n2013年12月　　计量单位：元\n\n| 项目 | 明细金额 | 汇总金额 |\n| --- | ---: | ---: |\n| 营业收入 |  |\
    \ 40 000 |\n| 营业费用： |  | 30 000 |\n| 　材料费 | 14 000 |  |\n| 　工资 | 11 200 |  |\n\
    | 　租金 | 3 600 |  |\n| 　水电费 | 740 |  |\n| 　其他杂项费用 | 460 |  |\n| 利润 |  | 10 000\
    \ |\n\n### 交大服务中心资产负债表\n\n2013年12月31日　　计量单位：元\n\n| 资产 | 金额 | 负债及所有者权益 | 金额 |\n\
    | --- | ---: | --- | ---: |\n| 货币资金 | 274 000 | 短期借款 | 20 000 |\n| 应收账款 | 12 000\
    \ | 应付账款 | 20 000 |\n| 存货 | 16 000 | 应付票据 | 12 000 |\n|  |  | 实收资本 | 240 000 |\n\
    |  |  | 留存收益 | 10 000 |\n| 资产总计 | 302 000 | 负债及所有者权益总计 | 302 000 |\n\n## 核心内容\n\
    \n- I. 会计：测量观与信息观\n- II. 会计假设和原则\n- III. 会计等式\n- IV. 会计要素\n- V. 借贷记账法\n- VI. 会计循环\n\
    \n## 借贷记账法概述\n\n借贷记账法是以“借”、“贷”二字作为记账符号，对每一项经济业务所引起的资金运动，都要用相等的金额在两个或两个以上有相互联系的账户中进行全面登记的一种复式记账方法。\n\
    \n### 记账符号\n\n- 借（Dr）\n- 贷（Cr）\n\n### 理论依据\n\n资产 = 负债 + 所有者权益\n\n### 记账规则\n\n\
    > “有借必有贷，借贷必相等”\n\n## 举例——会计分录\n\n昂立公司以200 000元开设一家家政服务中心，专门从事各种便民服务。该中心于2013年12月1日成立并开始营业，其发生的经济业务如下：\n\
    \n**业务1：**服务中心2013年12月1日获得昂立公司200 000元，当即存入该中心的开户银行。\n\n借：银行存款 200 000  \n贷：实收资本\
    \ 200 000\n\n**业务2：**2013年12月3日，服务中心以银行存款购买维修材料一批10 000元。\n\n借：原材料 10 000  \n\
    贷：银行存款 10 000\n\n**业务3：**2013年12月8日，服务中心借入短期流动资金借款100 000元。\n\n借：银行存款 100 000\
    \  \n贷：短期借款 100 000\n\n**业务4：**2013年12月10日，服务中心向思源公司购进修配材料一批，价值20 000元，款项尚未支付。\n\
    \n借：原材料 20 000  \n贷：应付账款 20 000\n\n**业务5：**2013年12月15日，服务中心以银行存款8 000元偿还12月10日所欠思源公司部分货款。\n\
    \n借：应付账款 8 000  \n贷：银行存款 8 000\n\n**业务6：**2013年12月25日，服务中心开出票据一张交给思源公司，约定3个月后归还所欠其余12\
    \ 000元货款，并一并支付利息。\n\n借：应付账款 12 000  \n贷：应付票据 12 000\n\n**业务7：**2013年12月27日，昂立公司代服务中心偿还80\
    \ 000元的银行借款，以此作为对服务中心追加的投资，有关手续已办妥。\n\n借：短期借款 80 000  \n贷：实收资本 80 000\n\n"
