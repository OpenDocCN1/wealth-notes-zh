    \ 存货丑闻\n\n- 1963年，植物油价格猛跌，由于不能偿还贷款，某大型公司彻底崩溃，致其于死地的即是公司的虚假存货\n- 原来该公司以其高估的存货做贷款抵押，当它无力偿还贷款时，贷款人扣留了它的植物油，却发现号称的17亿磅的油实际只有1亿磅\n\
    - 油没有了？怎么回事？\n\n## “鱼塘里有多少鱼，我们也不知道”\n\n- 蓝田股份有约20万亩围养湖面及部分精养鱼池，仅水产品每年都卖几个亿，而且全都是库存现金交易。然而，鱼网围着的20万亩水面到底装了多少鱼？没有人能说清楚，也就没有人知道有多少存货了。\n\
