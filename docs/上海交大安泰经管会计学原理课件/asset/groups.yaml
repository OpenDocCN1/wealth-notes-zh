  md: "\n## 应付账款\n\n- 应付账款指因购买材料、商品或接受劳务供应等而发生的债务。这是买卖双方在购销活动中由于取得物资与支付货款在时间上不一致而产生的负债。\n\
    - 应付账款入账时间的确定，应以所购买物资的所有权转移或接受劳务已发生为标志。\n- 如有现金折扣，则按包括现金折扣的总价法处理。\n- 应付账款一般按应付金额入账，而不按到期应付金额的现值入账。获得的现金折扣，冲减财务费用。\n\
    - 应付账款一般在较短期限内支付。\n\n### 应付账款流程\n\n签订采购合同——收货通知——台账——入库单——会计审核制单——付款结算——对账。\n\n\
    - 1. 参与采购合同文本会签。\n- 2. 货物运达后，由采购部验收人查验数量和毁损情况，质检人员依据合同规定的标准检验质量后，采购经办人员制作“收货通知单”，经会计签字确认后，交仓库人员办理入库。\n\
    - 3. 会计在审核“收货通知单”时，登记采购管理台账备案。\n- 4. 审核无误后，仓库人员开“入库单”，仓库负责人审核确认，采购经办人将“入库单”中的一联交给采购部备查，一联交给会计审核入账。\n\
    - 5. 会计审核入库单无误后，制作记账凭证，并在采购台账上做记录。\n- 6. 会计依据企业管理程序办理付款、结算。\n- 7. 会计和采购部门定期对账，及时处理差异。\n\
    \n### 会计处理\n\n借：原材料\n\n（或）固定资产\n\n贷：应付账款\n\n借：应付账款\n\n贷：现金\n\n### 应付账款与存货同步增长\n\
