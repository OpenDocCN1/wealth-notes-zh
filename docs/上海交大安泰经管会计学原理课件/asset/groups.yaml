    \ | 7.9% |\n| 产成品 | 223.23亿元 | 42.74% |\n\n- 原材料库存是领先性指标，反映生产厂商扩大生产的意愿；\n- 产成品库存是滞后性指标，是经济回落导致需求下行带来的库存积压\n\
    - 上半年原材料存货增长反映出企业对未来信心不足，开工生产意愿不强\n- 产成品库存的增长则反映出下游需求下滑明显，上市公司仍面临较明显的“滞销”问题\n\n\
    ## 四川长虹——让我一次跌个够\n\n- 2004年长虹将报出上市11年以来的第一次亏损，净亏损额36.8亿元。其净利润在1997年达到高峰26亿元后，在1999年则迅速下跌到3.86亿元，并随后数年赢利一直徘徊在3亿元以内。要赚到36亿元需要10多年的时间。\n\
