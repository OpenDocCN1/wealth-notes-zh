    \n![](img/a2796f05ebe2fd31075702d18360d28c_514_2.png)\n\n## 财务舞弊\n\n- 要增加利润么？\
    \ **是的**\n- 有什么办法呢？ **看利润的公式**\n- 利润=收入-费用？ **增加收入，减少费用**\n- 多招聘业务员，找个铁公鸡管费用支出？\n\
    \  - **so stupid，直接虚增收入！隐瞒费用！**\n\n有这么简单么，收入是怎样确认的呢？\n\n## 美国GAAP的规定\n\n- 1. 收入已实现或可实现（Realized\
    \ or Realizable）\n- 2. 收入已经赚取（Earned）时才予以确认\n\n销售商品而获得的收入一般在销售当日（通常是指将商品发运给顾客的日期）确认；提供劳务而获得的收入一般在履行了为顾客提供服务的责任并构成了向顾客收取服务费时确认。\n\
    \n## IFRS的规定\n\n与GAAP相比，IFRS着重从所售资产在所有权上的重要风险和报酬是否已经转移给买方来界定收入时点\n\n（1）商品的卖方已将所售资产在所有权上的重要风险和报酬转移给了买方，即卖方已经完成了所有主要销售环节，并不再以行使所有权的方式继续参与所转让商品的管理或不再实际控制已转让的商品；\n\
    \n（2）在以下方面不存在重大的不确定性因素：\n\n- ① 销售商品可望获得补偿；\n- ② 生产将要发生的有关成本；\n- ③ 可退货的幅度。\n\n\
    我国的规定与IFRS基本相同\n\n## 收入的概念\n\n- 销售商品\n- 提供劳务\n- 让渡资产使用权\n\n- 收入：企业在日常活动中形成的、会导致所有者权益增加的、与所有者投入资本无关的经济利益的总流入。\n\
    - 日常活动：企业为完成其经营目标所从事的经常性活动，以及与之相关的其他活动。\n\n根据“实现原则”与“稳健原则”，收入确认的基本原则是：\n\n- 〈1〉企业已经完成了为获取营业收入所必须做的工作（换言之，客户的正常需要已经得到满足）；\n\
    - 〈2〉已经收到了相应的营业收入款项或取得了收取款项的权利（当然，也可以是取得非现金资产或抵消负债）；\n- 〈3〉营业收入、相关费用、从而利润都可以“可靠”地加以计量，即不存在严重的不确定性。\n\
    \n## 销售商品收入\n\n- 销售商品收入的确认条件\n- 销售商品收入的计量方法\n- 销售商品收入确认条件的具体应用\n\n### 销售商品收入的确认条件\n\
    \n确认条件：\n\n- 企业已将商品所有权上的主要风险和报酬转移给购货方\n- 企业既没有保留通常与所有权相联系的继续管理权，也没有对已售出的商品实施有效控制\n\
    - 收入的金额能够可靠地计量\n- 相关的经济利益很可能流入企业\n- 相关的已发生或将发生的成本能够可靠地计量\n\n#### 企业已将商品所有权上的主要风险和报酬转移给购货方\n\
    \n- 通常情况，凭证或实物交付，风险和报酬随之转移\n- 某些情况，凭证或实物交付，主要风险和报酬随之转移\n- 某些情况，凭证或实物交付，主要风险和报酬未随之转移\n\
    - 1. 商品不符合要求且未根据保证条款弥补\n- 2. 收入能否取得取决于对方是否卖出商品\n- 3. 未完成安装或检验工作，且安装或检验工作是合同重要组成部分\n\
    - 4. 合同中有退货条款，且无法确定退货可能性\n\n#### 相关的已发生或将发生的成本能够可靠地计量\n\n示例：甲公司约定为乙公司生产并销售一台大型设备。甲公司因生产能力不足，委托丙公司生产某部件，丙公司发生的成本经甲公司认定后按成本总额的108%支付款项。假定甲公司、丙公司均完成生产任务，并将大型设备交付乙公司验收合格。\n\
    \n如丙公司未将有关成本资料交甲公司认定，且甲公司无法合理估计成本金额，则不满足本确认条件。\n\n如丙公司未将有关成本资料交甲公司认定，但甲公司能够合理估计成本金额，则视同满足本确认条件。\n\
    \n### 收入确认时间\n\n#### 销售时点确认\n\n- 交款提货：收到货款、发票账单、提货单交给对方\n- 预收货款：开出销售发票并将商品产品发出\n\
    - 委托代销：收到代销清单\n- 托收承付：办理托收手续\n\n#### 销售之后收款\n\n分期付款：分全部收款法和部分收款法\n\n#### 销售时点前收款\n\
    \n大型建筑业、造船业\n\n### 销售商品收入的计量方法\n\n- 基本原则：通常为已收或应收金额\n  - 现金折扣：扣除现金折扣前的金额确定收入；现金折扣发生时计入财务费用\n\
    \  - 商业折扣：扣除商业折扣后的金额确定收入\n  - 销售折让：通常冲减当期收入（资产负债表日后事项）\n  - 销售退回：通常冲减当期收入（资产负债表日后事项）\n"
