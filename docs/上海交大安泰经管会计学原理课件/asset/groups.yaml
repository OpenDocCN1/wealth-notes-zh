    ## Microsoft paid cash dividend first time


    17 January 2003 Microsoft has said it will pay shareholders dividends for the
    first time in its history.


    Microsoft''s dividend announcement surprised many analysts because the company
    has repeatedly resisted demands to redistribute some of its $40 billion in cash
    and other investment assets. Nevertheless, its decision to pay an annual dividend
    of 16 cents a share will only cost the company about $870 million


    CFO, Connors, said two reasons


    First, he cited Microsoft''s continued growth during the downturn in the technology
    industry.


    Second, he claimed that the resolution of the antitrust trial and the conclusion
    of several other legal cases against the company meant that Microsoft would not
    have to set aside as much money to cover legal costs in the future.


