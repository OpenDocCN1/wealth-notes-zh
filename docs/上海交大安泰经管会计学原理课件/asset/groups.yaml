    \ | 4.92 | 2.91 | 16.29 | 0.08 |\n| 造纸 | 0.32 | 2.68 | 1.27 | 0.90 | 0.89 | 7.96\
    \ | 7.09 | 13.38 | 0.47 |\n\n*资料来源：* 作者根据美国商务部 *《制造业、采矿业和贸易公司季度财务报告》*（2010年3月）的数据计算。可在\
