  md: "\n## Bond Retirement\n## At Maturity\n\nLet’s retire the Fila bonds at maturity\
    \ for $100,000 cash.\n\n|  | DR | CR |\n|---|---:|---:|\n| Dec 31 应付债券 | 100,000\
    \ |  |\n| 现金 |  | 100,000 |\n\n*Retirement of bonds at maturity*\n\nBecause any\
    \ discount or premium will be fully amortized at maturity, the carrying value\
    \ of the bonds will be equal to par value.\n\n## Issuing Bonds at a Discount\n\
    \nFila announces an offer to issue bonds with the following provisions:\n\n- Par\
    \ Value = $100,000\n- Issue Price = 96.454% of par value\n- Stated Interest Rate\
    \ = 8%\n- Market Interest Rate = 10%\n- Interest Dates = 6/30 and 12/31\n- Bond\
    \ Date = Jan. 1, 2009\n- Maturity Date = Dec. 31, 2010 (2 years)\n\n> Bond will\
    \ sell at a discount.\n\n## Issuing Bonds at a Discount\n\nOn Jan. 1, 2009, Fila\
    \ will record the bond issue as:\n\n|  | Amount |\n|---|---:|\n| Par value | $100,000\
    \ |\n| Cash proceeds | 96,454 |\n| Discount | $3,546 |\n\n*$100,000 x 96.454%*\n\
    \n|  | DR | CR |\n|---|---:|---:|\n| Jan 1 现金 | 96,454 |  |\n| 应付债券折价 | 3,546\
    \ |  |\n| 应付债券 |  | 100,000 |\n\n*Sold bonds at a discount on issue date*\n\n\
    Contra-Liability Account\n\n## Issuing Bonds at a Discount\n\n| Partial Balance\
    \ Sheet as of Jan. 1, 2009 |\n|---|---|\n| Long-term Liabilities: | |\n| Bonds\
    \ Payable | 100,000 |\n| Less: Discount on Bonds Payable | 3,546 | 96,454 |\n\n\
    Maturity Value\n\nCarrying Value\n\n## Amortizing a Bond Discount\n\nUsing the\
    \ straight-line method, the discount amortization will be $887(rounded) every\
    \ six months.\n\n$3,546 ÷ 4 periods = $887(rounded)\n\n## Amortizing a Bond Discount\n\
    \nFila will make the following entry every six months to record the cash interest\
    \ payment and the amortization of the discount.\n\n|  |  | DR | CR |\n|---|---|---|---|\n\
    | Jun 30 | 债券利息费用 | 4,887 | |\n|  | 应付债券折价 |  | 887 |\n|  | 现金 |  | 4,000 |\n\
    |  | *To record interest payment and amortization* |  |  |\n\n$3,546 ÷ 4 periods\
    \ = $887 (rounded)\n$100,000 × 8% × ½ = $4,000\n\nInterest Capitalization\n\n\
    ## Amortizing a Bond Discount\n\n| Straight-Line Amortization Table |\n| Date\
    \ | Interest Payment | Interest Expense | Discount Amortization* | Unamortized\
    \ Discount | Carrying Value |\n| 1/1/2009 |  |  |  | $ 3,546 | $ 96,454 |\n| 6/30/2009\
    \ | $ 4,000 | $ 4,887 | $ 887 | 2,659 | 97,341 |\n| 12/31/2009 | 4,000 | 4,887\
    \ | 887 | 1,772 | 98,228 |\n| 6/30/2010 | 4,000 | 4,887 | 887 | 885 | 99,115 |\n\
    | 12/31/2010 | 4,000 | 4,885 | 885 | - | 100,000 |\n|  | $ 16,000 | $ 19,546 |\
    \ $ 3,546 |  |  |\n| * Rounded. |\n\nInterest expense: $96454 × 10% × ½ = $4,822.7\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_460_0.png)\n\n## Bond Retirement\n\
    ## Before Maturity\n\n- Carrying Value > Retirement Price = Gain\n- Carrying Value\
    \ < Retirement Price = Loss\n\nLet’s retire the Adidas bonds on June 30, 2009,\
    \ after the first interest payment. The bond carrying value is $102,659, and the\
    \ unamortized bond premium is $2,659. Because the bonds are retired early, a call\
    \ premium of $3,000 must be paid to the bondholders.\n\n|  | DR | CR |\n|---|---|---|\n\
    | Jun 30 应付债券 | 100,000 |  |\n| 应付债券溢价 | 2,659 |  |\n| 债券偿还损失 | 341 |  |\n| 现金\
    \ |  | 103,000 |\n| *To record bond retirement before maturity* |  |  |\n\n##\
    \ 可转换债券\n\n- 对投资者而言，可转换债券的好处：\n  - 可保证投资者的利益；\n  - 可享受股东的权利。\n- 对发行企业而言，可转换债券的好处：\n\
    \  - 发行债券的代价较低；\n  - 可保证资金的筹措。\n\n可转换债券是按发行人依照法定程序发行、在一定期间内依据约定的条件可以转换成股份的公司债券。\n\
    \n可转换债券既有债券的性质，又有股票的性质。\n\n第一种方法：将全部售价作为债券本身的售价，不必单独确认转换权价值。\n\n第二种方法：发行时，应根据债券本身及转换权的价值而分别入账。\n\
    \n在我国，目前采用的是第二种会计处理方法。\n\n- 分离交易可转债（**Bond with Warrants**）——“认股权和债券分离交易的可转换公司债券”，它是债券和股票的混合融资品种。\n\
    - 分离交易可转债由两大部分组成，一是可转换债券，二是股票权证。\n- 可转换债券是上市公司发行的一种特殊的债券，债券在发行的时候规定了到期转换的价格，债权人可以根据市场行情把债券转换成股票，也可以把债券持有到期归还本金并获得利息。\n\
    - 股票权证是指在未来规定的期限内，按照规定的协议价买卖股票的选择权证明，根据买或卖的不同权利，可分为认购权证和认沽权证。因此，对于分离交易可转债业已简单地理解成“买债券送权证”的创新品种。\n\
    \n## 应付债券\n\n| 债券名称 | 面值及发行金额 | 年初余额 | 本年应计利息 | 本年已付利息及本金 | 年末余额 |\n|---|---|---|---|---|---|\n\
