    # 资产负债表


    # 资产负债表的作用：


    +   - 有助于解释、评价和预测企业的财务状况

    +   - 有助于解释、评价和预测企业的短期偿债能力、长期负债能力及资本结构

    +   - 有助于解释、评价和预测企业的财务弹性

    +   - 有助于解释、评价和预测企业的企业绩效


    # 资产负债表的局限性：


    +   - 原始成本报告基础不反映资产的市场价值

