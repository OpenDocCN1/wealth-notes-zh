    # “鱼塘里有多少鱼，我们也不知道”


    +   - 蓝田股份有约20万亩围养湖面及部分精养鱼池，仅水产品每年都卖几个亿，而且全都是库存现金交易。然而，鱼网围着的20万亩水面到底装了多少鱼？没有人能说清楚，也就没有人知道有多少存货了。


    > “鱼塘到底有多少鱼，到底能卖多少钱，我们只能借助专家的评估、预测。我们去的时候，也要求公司做评估。后来我们是在专家的评估判断后才签的字。”——华伦会计师事务所


