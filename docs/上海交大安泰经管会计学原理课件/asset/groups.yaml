    \ |  |  | - |\n| 一年后到期的应付债券 |  | 5,516,575,696.11 |  |  | 5,767,289,001.11 |\n\
    \n分离交易可转债的初始确认如下：\n\n| 项目 | 负债部分 | 权益部分 | 合计 |\n|---|---|---|---|\n| 初始确认金额 |\
    \ 4,874,744,332.84 | 1,425,255,667.16 | 6,300,000,000.00 |\n| 减: 交易费用 | 43,872,699.00\
    \ | 12,827,301.00 | 56,700,000.00 |\n| 于发行日的账面价值 | 4,830,871,633.84 | 1,412,428,366.16\
    \ | 6,243,300,000.00 |\n"
