    - 企业由于真实交易而开出、承兑的商业汇票，在会计核算上设置“应付票据”科目，反映这项流动负债的现存义务。应付票据按是否带息分为带息应付票据和不带息应付票据两种。\n\
    - 带息应付票据处理。应付票据如为带息票据，其票据的面值就是票据的现值。票据中的应付利息，于期末计算利息费用，金额不大时，到期时，计入财务费用。\n- 不带息应付票据的处理。需要计算应付票据的贴现息。\n\
