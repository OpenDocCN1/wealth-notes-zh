  - '[PAGE 327]


    Merchandise inventories are valued at lower of cost or market using the last-in,
    first-out (LIFO) retail inventory method. Under the retail inventory method, inventory
    is segregated into departments of merchandise having similar characteristics,
    and is stated at its current retail selling value. Inventory retail values are
    converted to a cost basis by applying specific average cost factors for each merchandise
    department. Cost factors represent the average cost-to-retail ratio for each merchandise
    department based on beginning inventory and the fiscal year purchase activity.
    The retail inventory method inherently requires management judgments and estimates,
    such as the amount and timing of permanent markdowns to clear unproductive or
    slow-moving inventory, which may impact the ending inventory valuation as well
    as gross margins.


    Companies that sell merchandise goods in an inflation environment would obtain
    tax advantage by using LIFO.'
