    \n# 案例分析：蓝田的故事\n\n## 存货的确认条件\n\n- 存货的确认\n- 1、符合存货的定义\n- 存货，是指企业在日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。\n\
