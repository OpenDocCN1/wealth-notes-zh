    \ the amount by which an entity's taxable income has been deferred by using the\
    \ LIFO method.\n\n## 加权平均法\n\n以各批购入（含期初）存货的数量为权重，计算可售存货的平均单位成本，并以此乘以期末存货数量，计算期末存货价值。\n\
    \n- 优点：①计算较简单；②从技术角度讲，加权平均比较合理（折中）\n- 问题：在物价变动较剧烈的情况下，存货价值计量结果会失真\n\n## 移动加权平均法\n\
    \n在每次购货后即为存货计算出新的加权平均单位成本和新的存货价值，并以此新的单位成本作为后续发货的单位成本。\n\n- 优点：\n  1. 便于随时结转销货成本\n\
    \  2. 期末存货价值比较接近现行市价\n- 问题：计算工作量大\n\n## 两种极端方法（FIFO与LIFO）的比较\n\n- 基本倾向的差异：FIFO的基本倾向是“如实”反映资产负债表上的“存货”价值；而LIFO的基本倾向是“如实”反映利润表上的“销货成本”。即FIFO是资产负债表导向的；而LIFO是利润表导向的。\n\
    - 基本目的的差异：FIFO的基本目的是向股东多报告收益；而LIFO的基本目的则是少纳税。\n\n## 计划成本法\n\n- 存货业务的日常处理以计划成本进行，期末再将发出存货的计划成本及期末存货的计划成本调整为实际成本报告于财务报表之中的方法\n\
    - 多用于原材料的日常核算\n- 实际成本=计划成本+/-成本差异\n- 合理制定并及时调整计划成本\n\n## 存货成本核算方法的财务报告效应\n\n###\
    \ 方法的优点\n\n| 加权平均 | 先进先出 | 后进先出 |\n|---|---|---|\n| 平滑存货价格的变化 | 期末存货更接近存货的重置成本\
    \ | 销售收入与商品销售成本更好地匹配 |\n\n## 实例分析\n\nThe following information relates to TMBC’s\
    \ Eraser bike.\n\n| 日期 | 交易 | 数量@单价 | = | 金额 |\n|---|---|---|---|---|\n| Jan.\
