    ## 调账


    当收入和费用的影响

    超过一个会计期间，

    就需要编制调整分录


    每个调整分录会涉及到

    revenue or expense

    and an asset or

    liability的变化


    ## 调账


    调整跨期交易与事项


    ### 调账的框架


    调整


    Paid (or received) cash *before* expense (or revenue) recognized


    Paid (or received) cash *after* expense (or revenue) recognized


    Prepaid (Deferred) expenses*


    Unearned (Deferred) revenues


    Accrued expense


    Accrued revenues


    *including depreciation


    ## 调账前后分录


    | | 支出现金（收到现金） | 确认费用（确认收入） |

    |---|---|---|

    | 递延（Deferred） | 借：待摊费用（递延费用）<br>贷：现金 | 借：费用<br>贷：待摊费用（递延费用） |

    |  | 借：现金<br>贷：预收账款（递延收入） | 借：预收账款（递延收入）<br>贷：收入 |


    | | 确认费用（确认收入） | 支出现金（收到现金） |

    |---|---|---|

    | 应计（Accrued） | 借：费用<br>贷：预提费用（应计费用） | 借：预提费用（应计费用）<br>贷：现金 |

    |  | 借：资产（应收账款）<br>贷：收入（应计收入） | 借：现金<br>贷：资产（应收账款） |


    ## 调整的类型


    - ★ Converting assets to expenses

    - ★ 资产转为费用


    - ⏱ Converting liabilities to revenue

    - ⏱ 负债转为收入


    - ⏱ Accruing unpaid expenses

    - ⏱ 未支付的费用


    - ⏱ Accruing uncollected revenues

    - ⏱ 未收讫的收入


    ![](img/a2796f05ebe2fd31075702d18360d28c_121_0.png)


    ## 为什么要调账


    会计分期假设


    应计制会计（Accrual accounting）


    调账原则：


    权责发生制原则


    配比原则


    ## 如何调整


    | Type | Balance Sheet Account | Income Statement Account | Adjusting Entry |

    |---|---|---|---|

    | **Prepaid Expenses** | Asset Overstated<br>Equity Overstated | Expense Understated
    | Dr. Expense<br>Cr. Asset |

    | **Unearned Revenues** | Liability Overstated<br>Equity Understated | Revenue
    Understated | Dr. Liability<br>Cr. Revenue |

    | **Accrued Expenses** | Liability Understated<br>Equity Overstated | Expense
    Understated | Dr. Expense<br>Cr. Liability |

    | **Accrued Revenues** | Asset Understated<br>Equity Understated | Revenue Understated
    | Dr. Asset<br>Cr. Revenue |


    ## 结账


    - Resets revenue, expense and withdrawal account balances to **zero** at the end
    of the period.

    - Helps summarize a period’s revenues and expenses in the **Income Summary** account.


