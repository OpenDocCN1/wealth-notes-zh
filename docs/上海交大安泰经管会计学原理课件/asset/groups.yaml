    # 优先股的特点


    +   - 优先分配固定的股利

    +     - 优先股类似固定利息的债券。

    +   - 优先分配公司剩余财产

    +     - 当公司因解散、破产等进行清算时，优先股股东将优先于普通股股东分配公司的剩余财产。

    +   - 优先股股东一般无表决权

    +     - 仅在涉及优先股股东权益问题时享有表决权。

    +   - 优先股可由公司赎回'
