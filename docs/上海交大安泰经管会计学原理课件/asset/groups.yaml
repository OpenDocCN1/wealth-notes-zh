    # 应付职工薪酬


    # 职工及职工薪酬的范围


    +   - 1、职工的范围

    +   - （1）与企业订立劳动合同的所有人员，含全职、兼职和临时职工。

    +   - （2）未与企业订立劳动合同，但由企业正式任命的人员。

    +   - （3）在企业的计划和控制下，虽未与企业订立劳动合同或由其正式任命，但为其提供与职工类似服务的人员。'
  - '[PAGE 391]


    # 2、职工薪酬的范围


    +   - （1）职工工资、奖金、津贴和补贴

    +   - （2）职工福利费

    +   - （3）医疗保险费、养老保险费、失业保险费

    +   - （4）住房公积金

