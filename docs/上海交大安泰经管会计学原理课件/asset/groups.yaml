    +   2. 收到的税费返还

    +   3. 收到的其他与经营活动有关的现金


    +   现金流出量

    +   4. 购买商品、接受劳务支付的现金

    +   5. 支付给职工以及为职工支付的现金

    +   6. 支付的各项税费

    +   7. 支付的其他与经营活动有关的现金'
