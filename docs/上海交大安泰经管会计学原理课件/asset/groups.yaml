    \n## 先进先出法（FIFO）\n\n1. 假设存货按“先进先出”的规律\n2. 发出存货的成本为较早购入的存货；结余存货的成本为较（最）迟购入的存货。\n\
    3. 优点：期末存货价值比较接近现行市价\n4. 问题：①计算工作量较大；②在物价上涨条件下，销货成本偏低，收益计量过于乐观。\n\n## 先进先出法\n\n\
    ![](img/a2796f05ebe2fd31075702d18360d28c_308_0.png)\n\n先到先得，first-come, first-served\
    \ (FCFS)\n\n## 后进先出法（LIFO）\n\n假设后收进的存货先发出\n\n- 优点：\n  1. 使现行收入与现行费用配比；\n  2. 在通货膨胀条件下，有利于财务稳健。\n\
    - 问题：对政府税收有不利影响\n\n## 后进先出\n\n最近的成本\n\n商品销售成本\n\n过去的成本\n\n期末存货\n\nLIFO 方法目前仅仅用在\
    \ Japan 和 U.S.\n\nThe difference between the cost of an inventory calculated under\
