  mdcn: "\n\n## 提前付款给与的优惠折扣\n\n信用期\n\n折扣期\n\n信用期\n\n时间\n\n收到的金额\n\n发票金额-现金折扣\n\n发票金额\n\
    \n发票日\n\n## 现金折扣条款\n\n2/10, n/30\n\n折扣百分比\n\n获得折扣的期限\n\n无折扣\n\n信用期\n\n## 商品销售的会计处理\n\
    \n11月3日，Z-Mart 赊销商品 $2,400。该商品对 Z-Mart 的成本为 $1,600。\n\nDr. Cr.\n应收账款 2,400\n销售收入\
    \ 2,400\n商品以赊销方式售出\n\n商品销售成本 1,600\n库存商品 1,600\n记录已售商品成本\n\n## 销售折扣\n\nZ-Mart\
    \ 于11月12日完成一笔 $1,000 的赊销，商品成本为 $800。付款条件为 2/10, n/60，且该账户在折扣期内全额付款。\n\n|  | Dr.\
    \ | Cr. |\n|---|---|---|\n| 应收账款 | 1,000 | |\n| 销售收入 | | 1,000 |\n| *以赊销方式售出商品*\
    \ | | |\n| 商品销售成本 | 800 | |\n| 库存商品 | | 800 |\n| *记录已售商品成本* | | |\n| 现金 | 980\
    \ | |\n| 销售折扣 | 20 | |\n| 应收账款 | | 1,000 |\n| *收取应收账款现金* | | |\n\n## 销售退回和折让\n\
    \n回顾 Z-Mart 售价 $2,400、成本为 $1,600 的销售。假设客户退回部分商品。退回商品售价为 $800，成本为 $600。\n\n|  |\
    \ Dr. | Cr. |\n|---|---:|---:|\n| 销售退回与折让 | 800 |  |\n| 应收帐款 |  | 800 |\n| *客户退回6月12日销售的商品*\
    \ |  |  |\n| 库存商品 | 600 |  |\n| 商品销售成本 |  | 600 |\n| *退回商品加入库存* |  |  |\n\n##\
    \ 销售退回和折让\n\n回顾 Z-Mart 向客户售出的 $800 商品。该商品有缺陷，但客户同意保留，因为 Z-Mart 提供 $100 的价格减免。\n\
    \n|  | Dr. | Cr. |\n|---|---:|---:|\n| 销售退回与折让 | 100 |  |\n| 应收账款 |  | 100 |\n\
    \n_记录销售折让_\n\n- 费用的含义\n- 费用的分类\n- 直接费用\n- 摊销费用\n- 期间费用\n- 销售费用\n- 管理费用\n- 财务费用\n\
    - 费用确认的基本原则\n- 资本性支出和收益性支出\n- 权责发生制\n- 配比原则\n\n## 销售成本\n\n- 已售产品的总成本，包括：\n  -\
    \ 将商品库存从供应商运至我们配送中心的运费；\n  - 不是为推广供应商产品而报销的具体、增量和可识别成本的供应商补贴；以及\n  - 支付给商品供应商的现金折扣；\n\
    - 提供服务的成本，包括：\n  - 服务员工的工资和福利成本；以及\n  - 备件成本及相关运费；\n- 实物盘点损失；\n- 降价；\n- 客户的运费和手续费；\n\
    - 与运营我们的配送网络相关的成本，包括工资和福利成本、占用成本和折旧；以及\n- 将商品库存从配送中心运至零售商店的运费。\n\n## SG&A\n\n\
    - 零售和企业员工的工资和福利成本；\n- 零售、服务和企业设施的占用和维护成本；\n- 与零售、服务和企业资产相关的折旧和摊销；\n- 广告费用；\n-\
    \ 为推广供应商产品而报销的具体、增量和可识别成本的供应商补贴；\n- 手续费用，包括银行费用和信用卡及借记卡交换费相关成本；\n- 慈善捐赠；\n- 外部和外包服务费；\n\
    - 长期资产减值费用；以及\n- 其他管理费用，如办公用品、差旅和住宿费用。\n\n我们国内部门的 SG&A 在 2011 财年较 2010 财年增长了 3.48\
    \ 亿美元，或 5.0%。SG&A 的增加主要由新店开业以及 Best Buy Mobile 利润分成管理费的增加推动，部分被激励薪酬成本的降低所抵消。以下因素共同导致国内部门\
    \ SG&A 率较收入增长了 1.0%：\n\n- 由于同店销售下降导致的经营杠杆下降；\n- Best Buy Mobile 的持续增长（包括我们支付给\
    \ Best Buy Europe 的利润分成管理费，该费用在国际部门 SG&A 结果中抵消，因此对我们合并营业收入没有净影响）；以及\n- 如上所述的供应商资金形式的变更；\n\
    - 部分被激励薪酬成本的降低所抵消。\n\n"
