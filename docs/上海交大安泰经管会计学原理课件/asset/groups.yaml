  - '[PAGE 329]


    # Inventories


    All inventories are stated at the lower of cost or realizable values. Cost for
    a significant portion of GE U.S. inventories is determined on a last-in, first-out
    (LIFO) basis. Cost of other GE inventories is determined on a first-in, first-out
    (FIFO) basis. LIFO was used for 39% of GE inventories at both December 31, 2010
    and 2009. GECS inventories consist of finished products held for sale; cost is
    determined on a FIFO basis.


    ![](img/a2796f05ebe2fd31075702d18360d28c_329_0.png)'
