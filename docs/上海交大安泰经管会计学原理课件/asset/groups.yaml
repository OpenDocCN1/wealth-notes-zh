    \n借：实收资本 20 000\n\n贷：应付账款 20 000\n\n## 举例—— 会计分录\n\n业务9：2013年12月29日，在办理有关手续后，昂立公司从服务中心抽回投资20\
    \ 000元，服务中心以银行存款支付。\n\n借：实收资本 20 000\n\n贷：银行存款 20 000\n\n## 举例——会计分录\n\n业务10：2013年12月30日，昂立公司将其对服务中心投资60\
    \ 000元，转让给慧谷公司，有关手续已办妥。\n\n借：实收资本——昂立公司 60 000\n\n贷：实收资本——慧谷公司 60 000\n\n## 举例——会计分录\n\
    \n业务11：本月份服务中心在营运中，支付房屋租金3 600元，员工工资11 200元，水电费740元以及其他杂项费用460元，共计16 000元，耗用维修材料14\
    \ 000元。\n\n借：销售费用 30 000\n\n贷：银行存款 16 000\n\n原材料 14 000\n\n## 举例——会计分录\n\n业务12：本月份服务中心收入40\
    \ 000元，收到现金28 000元，已存入银行，余款尚未收到。\n\n借：银行存款 28 000\n应收账款 12 000\n贷：营业收入 40 000\n\
    \n## 核心内容\n\n- I. 会计:测量观与信息观\n- II. 会计假设和原则\n- III. 会计等式\n- IV. 会计要素\n- V. 借贷记账法\n\
    - VI. 会计循环\n\n## 会计循环\n\n![](img/a2796f05ebe2fd31075702d18360d28c_85_0.png)\n\n\
    ## 会计循环\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_0.png)\n\n**Journalize\
    \ transactions.**  \n登记日记账\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_1.png)\n\
    \n**Post entries to the ledger accounts.**  \n过账  \n结账\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_2.png)\n\
    \n**Prepare trial balance.**  \n准备试算平衡  \n准备财务报表\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_3.png)\n\
    \n**Make end-of-year adjustments.**\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_4.png)\n\
    \n**Prepare adjusted trial balance.**  \n准备调整后的试算平衡\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_5.png)\n\
    \n**Prepare financial statements.**\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_6.png)\n\
    \n**Journalize and post closing entries.**\n\n![](img/a2796f05ebe2fd31075702d18360d28c_86_7.png)\n\
    \n**Prepare after closing trial balance.**\n\n## 会计循环：记账、过账、调账、关帐、报账\n\n分析交易与审核原始凭证\n\
    \n运用会计等式与借贷记账法\n\n过账：从分录到帐簿\n\n记账：会计分录\n\nAssets = Liabilities + Equity\n\nT-\
    \ Account\n(Left side) Debit\n(Right side) Credit\n\n![](img/a2796f05ebe2fd31075702d18360d28c_87_0.png)\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_87_1.png)\n\n![](img/a2796f05ebe2fd31075702d18360d28c_87_2.png)\n\
    \n![](img/a2796f05ebe2fd31075702d18360d28c_88_0.png)\n\n## 举例—— 过账\n\n## 通过账户记录可提供四个核算指标\n\
    \n期初\n余额\n\n本期\n增加额\n\n本期\n减少额\n\n期末\n余额\n\n## 通过账户记录可提供四个核算指标\n\n期初\n余额\n\n本期\n\
    增加额\n\n本期\n减少额\n\n期末\n余额\n\n上述四个核算指标间的关系是：\n\n=   +   -\n\n## ——丁字型账户格式\n\n##\
    \ 账户名称\n\n借方    （会计科目）    贷方\n\n说明：\n每个账户的本期增加额和本期减少额应分别记入上\n列账户的左右两方。\n\n## ——丁字型账户格式\n\
    \n账户名称\n\n借方      （会计科目）      贷方\n\n说明：\n如果左方记增加，右方应记减少；如果右方记增加，左方应记减少。\n\n##\
    \ ——丁字型账户格式\n\n账户名称\n\n借方    （会计科目）    贷方\n\n说明：\n期初、期末余额的方向与增加额的方向相同。\n\n## ——丁字型账户格式\n\
    \n## 账户名称\n\n借方    （会计科目）    贷方\n\n## 说明：\n\n借贷方的內容要依据账户所要反映的会计对象的具体内容，即账户的性质而定。\n\
    \n## 帐户的基本结构\n\n帐户名称\n\n期初余额\n（期初余额）\n增加\n（减少）\n减少\n（增加）\n期末余额\n（期末余额）\n\n期末余额=期初余额+本期增加发生额-本期减少发生额\n\
    \n## 银行存款\n\n(1) 200 000\n\n## 原材料\n\n## 短期借款\n\n## 应付账款\n\n## 应付票据\n\n## 实收资本\n\
    \n(1) 200 000\n\n## 销售费用\n\n## 营业收入\n\n业务1：服务中心2013年12月1日获得昂立公司200 000元。当即存入该中心的开户银行。\n\
    \n## 银行存款\n\n（1）200 000\n\n（2）10 000\n\n## 原材料\n\n（2）10 000\n\n## 应收账款\n\n## 短期借款\n\
    \n## 应付账款\n\n## 应付票据\n\n## 实收资本\n\n（1）200 000\n\n## 销售费用\n\n## 营业收入\n\n业务2：2013年12月3日服务中心以银行存款购买修配材料一批10\
    \ 000元。\n\n## 银行存款\n\n(1) 200 000\n(3) 100 000\n\n(2) 10 000\n\n## 原材料\n\n(2)\
    \ 10 000\n\n## 短期借款\n\n(3) 100 000\n\n## 应付账款\n\n## 应付票据\n\n## 实收资本\n\n(1) 200\
    \ 000\n\n## 销售费用\n\n## 营业收入\n\n业务3： 2013年12月8日，服务中心公司借入短期流动资金借款100 000元。\n\n##\
    \ 银行存款\n\n+   (1) 200 000\n+   (3) 100 000\n+   (2) 10 000\n\n## 原材料\n\n+   (2)\
    \ 10 000\n+   (4) 20 000\n\n## 应收账款\n\n## 短期借款\n\n+   (3) 100 000\n\n## 应付账款\n\
    \n+   (4) 20 000\n\n## 应付票据\n\n## 实收资本\n\n+   (1) 200 000\n\n## 销售费用\n\n## 营业收入\n\
    \n业务4：2013年12月10日，服务中心向思源公司购进修配材料一批，价值20 000元，款项尚未支付\n\n## 银行存款\n\n(1) 200 000\n\
    (3) 100 000\n\n(2) 10 000\n(5) 8 000\n\n## 原材料\n\n(2) 10 000\n(4) 20 000\n\n##\
    \ 短期借款\n\n(3) 100 000\n\n## 应付账款\n\n(5) 8 000\n\n(4) 20 000\n\n## 应付票据\n\n## 实收资本\n\
