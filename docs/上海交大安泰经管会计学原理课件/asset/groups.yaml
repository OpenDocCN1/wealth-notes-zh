  - '[PAGE 382]


    # 应付票据


    +   - 应付票据是由出票人出票，委托付款人在指定日期无条件支付确定的金额给收款人或者持票人的票据。应付票据也是委托付款人允许在一定时期内支付一定款额的书面证明。

    +   - 企业由于真实交易而开出、承兑的商业汇票，在会计核算上设置“应付票据”科目，反映这项流动负债的现存义务。应付票据按是否带息分为带息应付票据和不带息应付票据两种。'
  - '[PAGE 383]


    # 应付票据


    +   - 带息应付票据处理。应付票据如为带息票据，其票据的面值就是票据的现值。票据中的应付利息，与期末计算利息费用，金额不大时，到期时，计入财务费用

    +   - 不带息应付票据的处理。需要计算应付票据的贴现息。

    +   - 应付账款与应付票据

    +   - 应收账款与应收票据'
  - '[PAGE 384]


    # 应付票据的跨期调整


    发行日


    结账日


    到期日


    调整分录确认到期的票据利息'
  - '[PAGE 385]


    # 预收账款（预收收入或者递延收入）


    +   - 预收账款为企业一项流动负债


    +   - 预收账款的核算，应视企业的具体情况而定。如果预收账款比较多的，可以设置“预收账款”科目；


    +   - 如企业预收业务不多，也可直接通过“应收账款”科目核算，但其明细贷方余额应反映于资产负债表负债方，不能与其他明细科目借方抵消。'
  - '[PAGE 386]


    # 预收账款（预收收入或者递延收入）


