    # 存货成本核算方法使用的一致性


    一致性原则（consistency principle）要求：

    a company to use the same accounting methods period after period so that financial
    statements are comparable across periods.


    ![](img/a2796f05ebe2fd31075702d18360d28c_331_0.png)'
