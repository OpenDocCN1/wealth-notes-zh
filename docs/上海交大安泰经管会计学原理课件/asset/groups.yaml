    # 负债的性质


    负债，是指过去的交易、事项形成的现时义务，履行该义务预期会导致经济利益流出企业。


    ![](img/a2796f05ebe2fd31075702d18360d28c_367_0.png)'
  - '[PAGE 368]


    # 负债的性质


    +   - 企业的负债应按其流动性，分为流动负债和非流动负债”

    +   - 流动负债：一年或超过一年的一个营业周期内必须清偿的债务，包括：

    +     1. 一般短期债务；

    +     2. 一年内到期的长期债务。

    +   - 非流动负债：偿还期在一年或一个营业周期以上的债务。

    +   - 负债与权益的异同'
