    # Allowance for Doubtful Accounts


    The Company records its allowance for doubtful accounts based upon its assessment
    of various factors. The Company considers historical experience, the age of the
    accounts receivable balances, credit quality of the Company’s customers, current
    economic conditions, and other factors that may affect customers’ ability to pay.'
