    ## 现金管理


    现金管理的目标有两个：


    - 1. 规划现金收入以在到期时满足现金支付。

    - 2. 保持运营所需的最低现金水平。


    有效的现金管理涉及应用以下现金管理原则：


    - 鼓励应收账款的回收。

    - 推迟负债的支付。

    - 仅保留必要的资产水平。

    - 规划支出。

    - 投资多余现金。


