    LIFO methods is called the LIFO reserve. This reserve is essentially the amount
    by which an entity''s taxable income has been deferred by using the LIFO method'
  - '[PAGE 311]


    # 加权平均法


    以各批购入（含初存）存货的数量为权重，计算可售存货的平均单位成本，并以此乘期末存货数量，计算期末存货价值


    +   ◆ 优点：①计算较简单；②从技术角度讲，加权平均比较合理（折中）


    +   ◆ 问题：在物价变动较剧烈的情况下，存货价值计量结果会失真'
  - '[PAGE 312]


    # 移动加权平均法


    在每次购货后即为存货计算出新的加权平均单位成本和新的存货价值，并以此新的单位成本作为后续发货的单位成本


    +   ◆ 优点：

    +     〈1〉 便于随时结转销货成本

    +     〈2〉 期末存货价值比较接近现行市价

    +   ◆ 问题： 计算工作量大'
