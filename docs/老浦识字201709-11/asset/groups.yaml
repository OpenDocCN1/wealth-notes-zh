    # **问答**


    # 188【问答】砚台的“台”，是“臺”还是“檯”？


    188【问答】砚台的“台”，是“臺”还是“檯”？

    ①本文题字


    # → 《秋》 ←


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_0.png)


    字形演变：

    | 甲古文 | 金文 | 篆书 | 隶书 | 楷书 | 行书 |

    | :---: | :---: | :---: | :---: | :---: | :---: |

    | [秋] | [秋] | [秋] | [秋] | [秋] | [秋] |


    qiū


    文字原意：

    甲古文秋就是一头蚂蚁和谷穗，代表秋天收获的时节。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_1.png)


    思考题：

    这个甲骨文是一个蝎子的象形，也被借用了，请猜猜，这是什么字？


    答案：

    这是“万”，借用了蝎子的形象表示数字，金文、篆文、隶书、楷书这样演化过来。不过简化字“万”后代就已经出现了。


    # → 《乌》 ←


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_2.png)


    字形演变：

    | 甲古文 | 金文 | 篆书 | 隶书 | 楷书 |

    | :---: | :---: | :---: | :---: | :---: |

    | [乌] | [乌] | [乌] | [乌] | [乌] |


    wū


    文字原意：

    金文的“乌”是一只有大的眼睛、张嘴啼叫的夜鸟。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_3.png)


    思考题：

    甲骨文是一只大乌，有两个大大的眼睛和眉毛，这是猫头鹰象形，请你想猜，这是什么字？


    答案：

    这是观察的“观”，原意是形容像猫头鹰一样睁大双眼审视。

    全文加上猫头鹰的眼睛，强调观察的含义。篆文承继了全形的字形，繁体字“觀”保留了猫头鹰的形象，简化字“观”猫头鹰消失。


    # → 《写》 ←


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_4.png)


    字形演变：

    | 甲古文 | 金文 | 篆书 | 隶书 | 楷书 |

    | :---: | :---: | :---: | :---: | :---: |

    | [写] | [写] | [写] | [写] | [写] |


    xiě


    文字原意：

    汉代的“写”是“鸮”（猫头鹰）的异体字，本义是写（xiě）的借字，后借用为语气词。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_5.png)


    思考题：

    鸟儿头顶一个鸟巢是“写”，现在这个字形是鸟儿头顶一个“正”，为了降低度，我让你再看看它的金文和隶文，看出来这是什么字了吗？


    答案：

    这个字写的用户有很多，这是“焉”，原意是一种黄色的凤鸟，后借用为语气助词，本意消失。


    # → 《弯》 ←


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_6.png)


    字形演变：

    | 甲古文 | 金文 | 篆书 | 隶书 | 楷书 |

    | :---: | :---: | :---: | :---: | :---: |

    | [弯] | [弯] | [弯] | [弯] | [弯] |


    wān


    文字原意：

    “弯”字没有甲骨文和全形，是晚出的字。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_7.png)


    思考题：

    “弯”的本意是弯曲，加了三点的“湾”应该怎样读呢？


    答案：

    湾，表示有弯曲的地方，港湾，也能做动词，表示停泊，如“船舶湾”。


    # → 《台》 ←


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_8.png)


    字形演变：

    | 甲古文 | 金文 | 篆书 | 隶书 | 楷书 |

    | :---: | :---: | :---: | :---: | :---: |

    | [台] | [台] | [台] | [台] | [台] |


    tái


    文字原意：

    “台”的甲骨文是古代建筑的立柱底座，是一个独立的象形符号。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_60_9.png)


    思考题：

    用繁体字，砚台应该是哪个“台”，是“台”、“臺”还是“檯”？


    答案：

    很多同学都说“檯”，其实正确答案应该用“臺”，有座器的含义。


