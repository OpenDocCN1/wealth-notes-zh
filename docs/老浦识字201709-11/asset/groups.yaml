    贝币代表珍宝，宝贝就是这么来的。这里有一个甲骨文，是贝币藏在一个方框里，你来猜猜看，这是什么字？


    老蒲：

    这是贮藏的“贮”，贝代表珍宝，方框代表珍宝箱。本义是储藏、积存。字形演变见下图。


    贮 zhù

