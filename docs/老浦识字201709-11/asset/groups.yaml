    +   1. 纠的原意就是绳索纠缠

    甲骨文 是两根绳子缠在一起。


    说纠是很多股绳子绞合在一起，许慎老爷的解释很准确。


    金文增加了绞丝旁 进一步强调绳索丝线的性质；


    到篆文 就把字形符号化了，但从笔画而言，反而更加繁琐了；


    隶书 将篆文的繁琐的 形简写成 ，形成我们今日使用的“纠”。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_20_1.png)


    纠的原意是绳索缠绕在一起，纠缠、纠缠都是此意。


    由于纠结在一起，引申出约束、督查的含义。


    纠 的原意是绳索缠绕在一起，纠缠、纠缠都是此意。


    +   2. 纠缠怎样成为纠正

    古代木工有一种工艺，使用绳索绑紧有分叉的木头，使之成为想要的形状。


    制造弓箭、车轴，都要用到这样的方法，有一个成语叫“绳愬（qian）纠缪”（您）


    # 总结一下


    +   1. 纠的原意 是绳索交缠在一起，纠缠、纠结都是这个字的意思；

    2. 由于纠在一起，引申出约束、督查；

    3. 由于古代有用绳索校正木头的工艺，引申出通过束缚来改正错误的意义，即纠偏。


