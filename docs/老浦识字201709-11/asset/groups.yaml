    # 181【龟】从天上掉到泥里的动物


    ![](img/49696776a6cb1fac221b4a6b437da7b9_53_0.png)


    ## 识字卡片


    ![](img/49696776a6cb1fac221b4a6b437da7b9_53_1.png)


    | 字源演变： | 甲骨文 | 金文 | 篆书 | 隶书 | 楷书 | 简体 |

    |---|---|---|---|---|---|---|

    | | 龟 | 龟 | 龟 | 龟 | 龟 | 龟 |

    | 注音： | guǐ | | | | | |


    “一隻蔓蟮的台灣烏龜。”我们接着看这句话较劲，看看有多难。这次来着着乌龟的“龟”。


    繁体乌龟的“龜”笔画多的让人眼花，但是对于《老谱讲汉字》的用户来说，这个字非常好写，比简化字还好好写。我们从头说起。


    甲骨文的“龟”是一个典型的象形字，是乌龟的俯视图，长长的脖子从龟背向上伸出，两个爪子萌萌地露出来，仿佛在慢慢爬行。


    金文的“龟”改成了侧视图，基本就是我们今天的儿童简笔画，远远的背壳，四个小爪子，小尾巴俏皮地耷着。


    这似乎不好写字，尤其是篆文，笔画越来越多多了。


    ## 龟是“龟蛇”合体的汉字


    别急，我们来分解一下这个字，你就会发现这个字不仅写起来简单，而且可以上溯到中国传统文化中一个重要的概念。


    我们先把乌龟的头部分写下来，再把它中间的两个竖笔写下来，这是个什么字呢？是“它”，咱们以很多次碰到过这个字，最近的一次我们在思考题“池”字还说到“它”，这个字形后来分化出“它”、“也”、“虫”，本意是蛇的意象。


    对，我们先写一个代表蛇的“它”，再写一个乌龟头的侧视图，再加上两个小爪子，就完成了。篆字如此，楷书繁体字“龜”也是这样写。


    繁体字“龜”实际上是两个字：代表蛇的“它”和“龟”的侧视图。龟和蛇有关吗？


    ## 龟蛇合体—玄武


    对，这是龟和蛇的合体，传说中的四灵之一玄武。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_53_2.png)


    玄武是古代神话传说中的灵兽，属于传统文化中的四象之一，风水里面讲究左青龙、右白虎、前朱雀、后玄武。玄武的造型就是一条蛇盘在乌龟身上，方位属于北方，属水。


    为什么是两个动物叠在一起？原来古人误以为乌龟本身没有生殖能力，要和蛇交配才能繁衍，所以让它们在一起，起“龟蛇交尾”的生殖。又由于龟的寿命很长，因此它又是长寿的代表，龟鹤延年。


    在道教中，玄武的地位很高，被称为真武大帝，受到顶礼膜拜。


    这个时候你再写一遍“龜”字，先写“它”，在画 上龟壳和龟足，一个代表玄武的“龜”字就完成了。


    ## 龟崇拜


    中国人对龟的崇拜由来已久，传说女娲补天，最后是用四只龟足支撑起天的四个角。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_53_3.png)


    ## 问答


    ### 182 [问答] 优和虑分别代表了什么？


    欢迎到你《老浦识字》，今天是问答时间，我来为你解答一下本周的思考题。


    甲骨文“艮”分化出很、恨、很、狠三个字，请你分析一下另外两个字的含义。


    老浦


    都是回头瞪眼，“恨”是加上双立人，双立人是行的简写，表示道路、行为，“恨”的原意是违逆、不听从小。猴加上犬字旁，表示相斗，形容凶恶，好勇斗狠。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_54_0.png)


    甲骨文鸟的形象字形很多，这个字形是一只长尾鸟，旁边有一个指示符号，你来猜猜，这是什么字？


    老浦


    这是“风”，用长尾鸟长长的羽毛来展现风的效果，指示符号像船帆，表示风的力量。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_54_1.png)


    商朝超级好酒，所以甲骨文关于酒的很多，这里有一个字形，是一个跪坐在人酒坛旁，酒坛上还有三个点，请你猜猜这是什么字。提示一下，和咱们今天讲的这个“誉”有关。


    老浦


    这是配合的“配”，原意是配酒，中国古代的酒是粮食发酵产生的，酒精度很低，祭祀的时候会用专用的茅草过滤，为了增加香气会用草调配，因为古人认为香气会令鬼神祖宗高兴。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_54_2.png)


    高级文字能够精准表达事物非常细微的差别，汉字无疑在这方面及其传神。


    这是一个大篆字形，由“虎字头”和“思”组成，猜猜猜猜这是什么字，并分析这个字与“疑”、“忧”的微妙区别。


    老浦


    这是忧虑的“虑”，虎字头表示危险的大事，这是面临危机的思考。“疑”是大概念的考虑，担忧。“忧”是比较极端的情绪，忧愤；“虑”是面临危机的思考。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_54_3.png)


    现在这里有一个汉代的“花钱”，是当时用来辟邪、表示吉利的不流通的货币，相当于咱们今天的纪念币，请你猜猜这是什么字。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_54_4.png)


    老浦


    这是“唯言知足”四个字，它巧妙地利用了铜钱的方孔做四字共用的“口”字。


    背面的字是常规的“长乐”。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_54_5.png)


