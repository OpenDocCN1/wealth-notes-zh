    # 189【梦】梦可乱做，字可不能乱解


    ![](img/49696776a6cb1fac221b4a6b437da7b9_61_1.png)


    朋友转发给我一段视频，是一个旅游景点的导游在解说一块石碑上繁体的“梦”字，解说词很有意思。


    她说：草字头，是两个字“十”字，代表人的年轻时代；中间“四”字，代表表人的青壮年，正是立业的时候；五十六岁，一般都寿晚年，用一个官帽盖上；夕字，代表人生的晚年，如夕阳即将落下。这个时候想一生，不过是一场梦。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_61_2.png)


    这个解读脑洞开得有点大，想象力还真挺丰富的。咱们还是来看看这个字的正解是怎样的。


    # “梦”的甲骨文


    梦的甲骨文，有好几种写法，体现了古人做梦这件事情不同的表达方式。


    第一种字形![oracle-bone-1](small_image_1)，表现了一个人躺在床上，眼睛上的睫毛在抖动，说明人虽然睡着了，思想还在活动。


    第二种字形![oracle-bone-2](small_image_2)，也是躺在床上，但没有表现睫毛，是手在动，同样也是告诉我们，人睡着了，做梦手在动。


    大版“梦”字形，还表现清楚，古人还创造了两种字形，一种是眼睛、手都在动![oracle-bone-3](small_image_3)，一种是手、眼、嘴全动![oracle-bone-4](small_image_4)。这人睡觉也太不老实了。


    为了表现做梦的状态，古人真是煞费苦心。


    还有个很有意思的字形![oracle-bone-5](small_image_5)，这两个字形和第一种是一致的，眼睛在动，有意思的是，居然增加了一个像锤子的字形![oracle-bone-6](small_image_6)，这是在告诉我们，这人在做噩梦，要用锤子打醒他？


    # “梦”的金文


    尝试了这么多种表达方式，到商秋战国时期，人们又换了一种方式。


    这是金文“梦”![bronze-1](small_image_7)，取消了床，眼睛上的睫毛仍然晃动，眼睛下面仍然是人形，弯曲的线条表示手在动，然后增加了一个表示夜晚的“夕”![bronze-2](small_image_8)，把时间线索增加进去，表示这代人到了夜晚睡觉的时候做梦。


    # “梦”的篆文


    篆文的梦![seal-1](small_image_9)，基本继承了金文的思路，只是将金文字形中的眼睛画成人形，![seal-2](small_image_10)，使这个字更加规整，这个字形，就是基本确定了以后隶书、楷书的字形。


    唐代柳公权写的楷书“梦”![kaishu-1](small_image_11)，繁体字“夢”基本上按照这个字形定型。


    # 繁体字“夢”


    繁体字“夢”，正确的读法是：


    +   * 草字头来自甲骨文眼睛上的睫毛，表示人睡下了以后思想仍活动；

    * “四”是眼睛的变形，不能盖是人体形的变形；

    * “夕”表示夜晚，整个字形就是表现人在做梦。


    简化字“梦”有人说来自草书，这是王羲之写的草书“夢”![cursive-1](small_image_12)，怎么也看不出来用什么“林”代替了人的眼睛、睫毛和身体。


    # 黄粱一梦


    回到咱们开头那个“梦”字石碑，来自河北省邯郸市黄粱梦镇吕仙祠，是当代人书写的，讲了黄粱梦的故事。


    黄粱梦讲了一个叫卢生的故事，来自唐传奇《枕中记》，这个书生久试不第，在邯郸遇到了一个修道高人吕翁，吕翁给了卢生一个瓷枕，他就睡着了。


    梦中，他娶了白富美，科考成功，做了大官，享尽人生富贵，高考终考八十余定。


    卢生梦中的一场富贵醒来，旅店主人煮的黄粱粥，也就是小米米饭还没做，这就是黄粱一梦的典故。


    卢生通过这一场梦，感悟人生的追求功名富贵不过就是一场梦，还是现实中的黄粱饭实实在在。


    这个故事，其实就是《庄子》中庄生梦蝶的翻版，讲的是同一个道理，反映了道家的人生观。


    再多说一句，开头那个石碑上既有繁体字，也有简化字“梦”、“礼”，这是书法上的大意，大写字的时候，将功能字简化成可以写得很好，但不能繁简混用。


    # 总结


    +   1. 梦的甲骨文有几种写法，有的表示躺在床上眼睛在动，有的手脚在动，有的眼睛手都在动；

    2. 梦的金文取消了床，增加了表示夜晚的“夕”，形成梦、眠、跟、康体、花体构成的“夢”字，后世篆文、隶书、楷书，都是按照这个字形延续；

    3. 黄粱一梦反映了道家对人生的认识，认为功名富贵不过就是一场梦。


    # 思考题


    眼睛上边的字形有意思，文锦中有一个字形![eye-symbol](small_image_13)，眼睛上面对一条波浪线，你猜猜看，这个是什么字？


