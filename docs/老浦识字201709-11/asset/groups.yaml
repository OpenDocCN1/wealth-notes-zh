    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    # 识字卡片


    ![](img/49696776a6cb1fac221b4a6b437da7b9_37_1.png)


    金文：爱字的本义是一个跪坐的人，伸出双手捧着自己的心，表示将自己的心完全奉献出来，是疼惜、爱怜的意思。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_37_2.png)


    体无骨（體），爱无心（愛），这是简化字经常被诟病的字，爱字的原意也是外国人很好奇的地方，中国古代人是如何理解爱的呢？


    # 1.爱是无条件的奉献和倾诉


    金文 [篆书字体] 上面是“欠” [篆书字体] ，我们刚刚认识这个字，是一个跪坐的人在张着嘴巴打哈欠，我们还在这期的思考题中认识了“欠”，那是一个跪坐的人张嘴讲话唾沫星四溅。这里的“欠”，仍然表示呵气，或喃喃倾诉。下面是“心”
    [篆书字体] ，表示这是一种心理活动。合起来，表示疼惜、倾诉。有的金文 [篆书字体] 加手形，像一个喃喃倾诉的人 [篆书字体] 伸出手捧着 [篆书字体] 自己的心
    [篆书字体] ，表示将自己的心完全奉献出来。


    篆书 [篆书字体] 将金文的手形 [篆书字体] 改为倒写的“止” [篆书字体] 。表示走来，捧出自己的真心。隶书 [隶书字体] 将篆文的“欠” [篆书字体]
    简写为 [楷书字体] ，简化字 [楷书字体] 把“心”改成“友”。真心成为友情，也对。


    爱的原意是赤裸裸地捧出自己的心来倾诉，具有痛惜、倾诉的含义。在这一点上，和我们现代对爱的理解是一致的。爱情是一种毫无保留的奉献，丧失理性、世俗的算计的纯粹的冲动，因此格外纯洁、格外炽烈。也因为毫无保留，心赤裸裸地奉献，更容易受到伤害，也不可能持久。


    # 2.古人如何理解爱


    正是因为爱毫无保留，古人在使用这个字的时候，反而引申出吝惜和吝啬的含义。《左传·僖公二十二年》，有一段文字：


    > > 伤未及死，如何勿重？若爱重伤，则如勿伤；爱其毛，则如服焉。


    你还记得咱们以前讲过宋襄公的泓水之战吗？宋襄公依照古代礼节，拒绝攻击正在渡河的楚国军队，结果吃了败仗。战后，国人都攻击这位国君，后世孟京东也批评这是猪猪式的仁义道德。宋襄公说，按照礼仪，君子不第二次攻击受伤的人，不擒拿头发斑白的老人。子鱼评论这件事情的时候说了这段话，这句话意思是：敌人受了伤，还没有死，为什么不能再去杀伤他们呢？不忍心再去杀伤他们，就等于没有杀伤他们；怜悯年纪老的敌人，就等于屈服于敌人。这里面的“爱”，就是吝惜、怜悯的意思，在这个语境里，是贬义。


    《老子》中有一句话：


    > > 甚爱必大费。


    意思是说过于吝啬必然招致巨大的浪费。《宋史·岳传》也有：


    > > 文臣不爱钱，武臣不死战。


    这里的“爱”，就是吝啬、吝惜的意思。这样的用法，是古人对爱字赤裸裸毫无保留的一种否定，引申为它的反面。


    但“爱”吝惜的含义在现代汉语中已经不再使用了。


    # 总结一下


    +   1. 爱的原意是手捧真心表白，毫无保留，是珍惜、爱怜的意思；

    2. 爱字毫无保留毫无保护与现代汉语对爱的理解是一致的，这种极致的感情冲动最容易受到伤害，也难以持久；

    3. 古人对毫无保留的爱不认同，引申出吝啬、吝惜的含义。现代汉语已经不再使用。


