  md: "\n# 143 【科】科是一种标准\n\n老潘提示：订阅专栏后，文摘中的象形文字就可点击，放大来看，细细品读。\n\n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_13_0.png)\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_13_1.png)\n\n科这个字用法很多，科学、科长、作奸犯科，都是这个科。这个字是怎么来的，为什么有这么多用法？\n\
    \n### 1. 科的原意是计量\n\n科学是篆文时期才出现的，“科”左边一个不亩的禾「禾」，表示农作物，右边是一个「斗（dǒu）」。「斗」的甲骨文「斗」是一个有手柄的大勺。\n\
    \n金文「金文」稍作变形。\n\n直到篆文，字形才变得符号化了。\n\n和斗斝的「斗」不同，篆文「篆文」、隶书「隶书」和楷书的“鬥”都是两个人打架的象形。简化字把这两个字合成一个字了。\n\
    \n斗的原意是长柄勺子，用来盛酒，同时也是计量单位。与禾亩的禾合起来，表示计量粮食。\n\n> **《说文解字》**：科，程也。从禾，从斗。斗，量也。\n\n\
    **《说文解字》**解释说科就是程，程也是一种计量用品。字形由禾和斗会意，斗是量器。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_13_2.png)\n\
    \n科的本意是衡量，所以同时就有了标准、法规的含义。科长、科目、科以死罪、金科玉律、作奸犯科，以致我们今天所说的科学，都是这种用法。由于有了标准，就有了品类、等级的含义。比如我们今天说的文科、理科就是品类。\n\
    \n### 2. 科举制度核心是有科\n\n由标准，引申出按照标准考核，比如开科取士。按照标准考试录用公务员在古代叫科举。\n\n科举制度是中国古代延续了一千多年的官员录用制度，始于隋代。在此之前，当官主要靠家底出身，科举是按标准改选，这就让普通平民有了通过考试改变命运的机会，“朝为田舍郎，暮登天子堂。”中国的皇权制度能够延续两千多年，和科举制度是分不开的。直到今天，高考仍然被认为是相对公平的教育制度。\n\
    \n科的种类、等级之意，也衍生出科班的概念。科班是供戏剧演员学戏的机构，文人经过科举确定次第等级。戏子投师学艺也可以入某一科，同年入学者为同科。考人或经介绍加入某戏班子的某一科，就叫进班入科。\n\
    \n科班学戏很苦，要签字据，每天很早起来练习，打骂体罚是家常便饭，看过电影《霸王别姬》的同学一定有印象。在科班学戏叫坐科，一般要七年才能科满。这样的经历和出科经历介绍，今天把受过正规教育而非自学成才的也叫科班出身。\n\
    \n### 总结一下\n\n- 「科」的本意是计量禾谷，于是就有标准、法规的含义；\n- 按照标准进行考试就叫科举；\n- 按照标准进入学戏叫科班。\n\n\
    ### 思考题\n\n禾是农业社会非常重要的字，以“禾”为字符组成的字有很多。这是一个甲骨文字形「字形1」，禾「禾」下面有一个人「人」，这是什么字呢？\n\n\
    延伸阅读：【斗】斗斝古怎样量\n\n# 144【判】判的根本是公正\n\n老潘提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。\n\n##\
    \ 识字卡片\n\n| 字源演变 | pàn |\n|---|---|\n| 缺 | 缺 | 判 | 判 | 判 |\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_14_0.png)\n\
    \n### 1. 判是分牛\n\n判断的判来源于半，金文 \U0002A52D 上面是一个表示分开的“八”，下面是“牛”，表示把牛分成两半。篆文 \U0002A52D\
    \ 加上“刀”，另造了“判”。\n\n判的原意是剖开，《墨子·备穴》说：\n\n> 令陶者为瓦管，长二尺五寸六围，中判之，合而施之穴中，僵一，攫一。\n\n\
    意思是说令陶器匠预制瓦管，每根长二尺五寸，大六围，从中剖开并为两块，合起来安装在隧道里，两块上下合成圆状。埋在地下，再命熟谙冶炼鼓风的工匠鼓风熏烟，以打退从地道里进攻的敌人。\n\
    \n由剖开，引申出区别、判别 的含义。\n\n《庄子·天下》说：\n\n> 判天地之美，析万物之理。\n\n评判天地的美感，解析万物的道理。由判别，引申出裁决诉讼，判案、判刑、判罪，审理的官员就叫判官了。\n\
    \n### 2. 判和断的区别\n\n古代判案在民间俗语里也叫断案。但“判”和“断”还是有区别的。\n\n“断”是由甲骨文“绝”发展出来的，绝是在“两绳丝线”的中间各加“一短横”，表示将丝线割成两段，表示将物体彻底分开，一刀两断。\n\
    \n这样比较就清楚了，判是将牛剖开一分为二，断是一刀两断，都有区分、评判的意思，但“判”多了一分两半的公平公正的含义。所以在需要公平正义的场合，我们用“判”比较准确：判分、判卷、批判、裁判、审判、公判。\n\
    \n### 3. 通判是不小的官\n\n唐宋时期，以高位兼任低职，以京官出任州郡官的叫“判”。宋朝时为了防止州郡长官权力膨胀，设立通判这个官职，一方面，他是州郡长官的副手，另一方面，他有权直接向皇帝上奏折，起到监察作用。\n\
    \n《水浒传》里有一个反面人物黄文炳就是通判：\n\n> 这人虽读经书，却是阿谀谄（chǎn）佞（nìng）之徒，心地僻（biàn）窄，胜过己者害之，不如己者弄之，专在乡里害人。\n\
    \n说他是个闲官，没事跑知府那儿去钻营，这当然都是抹黑这个人，但客观地看，这家伙相当有才。\n\n怎么有才了？关于黄文炳这个人，我为你专门准备了一期彩蛋，记得关注周日的内。\n\
    \n### 总结一下\n\n我们这一期认识了两个字：判和断。\n\n- 判是将牛一分为两半，原意是剖开，引申为区分、判别。因为是一分两半的含义，引申出评判的公平正义，所以用于诉讼、考试、比赛等需要公正的场合；\n\
    - 断是由绝发展过来的，是在绝字旁加上表示斧头的“斤”，表示截断物体或事物，一刀两断；\n- 判在古代是官名，通判是宋朝州郡长官的副职，但有权直接上奏折，具有监察作用。《水浒传》里的通判黄文炳其实是一个很有才干的称职官员。\n\
    \n### 思考题\n\n斤的原意是斧头，那个字为什么会被借用为计量单位呢？你来分析分析。\n\n延伸阅读：【绝】是用绳子把色彩绑起来\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_14_1.png)\n\
    \n# 145【问答】为什么花落了要说花谢\n\n“花谢花飞飞满天”，“林花谢了春红，太匆匆”。说花落好理解，为什么花落要用“谢”字？你来分析一下，这是怎么回事？\n\
    \n**老浦**\n\n谢字的甲骨文 *偷*，是双手持着席子的会意。坐的地方有单独的席子，也就是席位。\n\n古代君王请大臣坐下，大臣会双手持席辞退，这个礼节叫“谢”。这种礼节一般用于隆重的祭祀礼仪中，后世已经不用了。后引申为大臣辞职、告别，以及逝去、凋落，再进一步引申为感激、酬谢。\n\
    \n花谢的谢，就是用了凋落的含义。\n\n今天“谢”的字形是篆文变形的结果，\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_15_1.png)\n\
    \n华是树木开的花，用“木”作基本字符的汉字有很多。这是“木” *树*，下面增加了三个圆点 *木*，你来猜猜看，这是个什么字？表示什么意思呢？\n\n**老浦**\n\
    \n*木* 是“本”字，根本的本，原意表示树根。\n\n欧阳修在《与高司谏书》中有“自足下为谏官来，始得相识。侃然正色，论前世事，历历可听，褒贬是非，无一谬说。”请通读全文，分析一下文章中“侃”的用法。\n\
    \n**老浦**\n\n这是欧阳修非常著名的一篇文章，从容不迫地痛骂了小人。注意这句话的后文，在“侃然正色”的后面，是说这位高司谏谈论以前的事物是非很分明，侃侃而谈，显得很正直。而这样的描写正是为后面斥责他小人做了铺垫：道理你都懂，谈论前朝不相干的事是非很分明，但在现实中，却对范仲淹这样的贤臣落井下石。“是足下不复知人间有羞耻事尔。”这句温文尔雅的骂人话把小人永远钉在历史的耻辱柱上。这个“侃”，还是从容不迫侃侃而谈的原意，但在本文中却有强烈的讽刺意义，勾勒的伪君子小人嘴脸栩栩如生。\n\
    \n禾是农业社会非常重要的字，用“禾”为字符组成的字有很多。这是一个甲骨文字形 *禾*，禾 *禾*，下面有一个人 *人*，这是个什么字呢？\n\n**老浦**\n\
    \n这是“年” *禾*，人 *人*，背着谷子 *禾*，将收割下来的谷子搬运回家，表示这是谷物成熟的的时候，过年了。\n\n斤 *斤* 的原意是斧头，那这个字为什么会被借用为计量单位呢？你来分析分析。\n\
    \n**老浦**\n\n石斧是人类最早的工具，也是生活最常用的工具，所以经常被用来交换，是最早的货币。由于过于沉重，被贝壳取代。也是由于它的重量，同时它是人人都认识的通用物品，就被借用为计量单位，斤。\n\
    \n好，本周的问答就是这样，祝你每天都有恍然大悟，下周再见。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_15_2.png)\n\
    \n# 146 【彩蛋】黄文炳\n\n今天是一期彩蛋。我想跟你说一个好玩儿的事儿。\n\n咱们在【判】那一期提到了通判黄文炳，今天来跟你详细说一说黄文炳这个人的故事。\n\
    \n《水浒传》里有一个反面人物黄文炳，他就是通判，“这人虽读经书，却是阿谀谄（chàn）佞（nìng）之徒，心地褊（biān）窄，胜如己者害之，不如己者弄之，专在乡里害人”。\n\
    \n说他是个闲官，没事跑到知府那儿去钻营，这当然是抹黑这个人。但是客观地看，这家伙相当有才。\n\n- 他看出来宋江的反诗。宋江杀死阎婆惜后刺配江州，在浔阳酒楼酒后在墙壁上写了一首诗：\n\
    \n  > 心在山东身在吴，飘蓬江海漫嗟吁。他时若遂凌云志，敢笑黄巢不丈夫。\n\n  黄巢是唐末的起义军领袖，笑黄巢不丈夫，那当然是要造反啊。\n\n-\
    \ 识破宋江装疯。黄文炳到知府那儿举报，把宋江抓了起来。宋江在戴宗的点拔下，装疯耍傻。知府蔡九面对装疯的宋江“没作理会处”，却被黄文炳识破。\n\n- 识破假家书。为救宋江，梁山专门请人伪造了蔡京的家书，这条假家书瞒过了江州的所有人，包括蔡京自己的儿子蔡九，可黄文炳凭着一枚印章又识破了吴用的计谋。这里是有学问不小，字是圣手书生萧让写的，印是玉臂匠金大坚刻的，都是做假字画的顶尖高手。问题是印章盖的不是地方，印在图书的封皮上，这是不符合官员书信常规的。最后逼的梁山只好劫法场，杀了很多人。黄文炳一家五十多口人也被都杀死了。黄文炳被李逵残忍杀死。\n\
    \n上面提到的这封家书，是找的圣手书生萧让代笔的，这个人特别善于模仿别人的字，用现在的话说，就是一个造假的高手。\n\n你知道咱们中国的造假高手是谁？张大千。张大千模仿的画，一直到现在，很多专业高手也很难辨别出来。这种模仿别人笔迹的本事，圣手书生萧让也有，很厉害。另外，又找了一个刻印章的高手，来一块儿伪造这封书信。\n\
    \n信送过去以后，蔡京的儿子蔡九毫不怀疑。就把犯人押过去，路途中，就被劫了。\n\n但是黄文炳看出了问题，他说：这不对啊，印章怎么能盖在信封上呢？蔡京是多严谨的人啊，他怎么会在给自己儿子的书信中盖这么郑重的章呢？这里面有诈。\n\
    \n没错，这是家书，家书一般是不盖印章的，也不会盖在信封上。\n\n然后把送信的人抓起来，严刑拷打，就破案了。\n\n在这件事上，黄文炳是一个很机智的人。\n\
    \n现在鉴定假画也是这样，笔迹、内容、印章，什么都是对的，但是印章盖的不是地方，或者落款的称呼不对，就值得被怀疑。\n\n在这一点上，黄文炳还是很让人佩服的。\n\
    \n今天的彩蛋就是这样的，咱们下周再见。\n\n每个字都让你\n\n# 147【课】上课和课以重税有关系吗\n\n老浦识字：订阅专栏后，文稿中的象形文字可能会有点看不懂，放大来看，细细品读。\n\
    \n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_17_1.png)\n\n上课是课书，课税是收税，这里面有什么关系？为什么都用“课”这个字？\n\
    \n### 1. 识课识果\n\n课是景文才有的新字，左边是言语的“言”，右边是果实的果。以后的字形变化不大，隶书将象形的“果”简写成“果”。\n\n要想认识“课”，得先来认识“果”。\n\
    \n甲骨文的“果”是树上的果实。\n\n金文将甲骨文字形进行了简化。\n\n篆文更加简化，成为我们今天使用的“果”字。\n\n果的原意就是树上的果实，你知道水果的特点是一颗一颗的，并且聚集在一起。树上是如此，餐桌上也是如此。所以用“果”组成的字，都有颗粒聚集、与别的东西有区别的含义，比如斛(hú)表示众多；颗表示颗粒；窠(kē)表示巢穴；棵表示树木等。言语的“课”，自然就有与言语有关的事物一个个分明又聚集在一起的状态，比如分阶段的科目学习、考核等。\n\
    \n白居易在《与元九书》中写道：\n\n> 二十已来，昼课赋，夜课书，间又课诗，不复遑暇矣。\n\n这是白居易在讲述自己年轻的时候读书的状况。白天学习辞赋，晚上学习四书五经，中间还常学着写诗，根本没时间睡觉。这里的“课”，就是分科学习的意思。课由于是按一定标准学习，由此引申为按一定标准试验、考核、普查。\n\
    \n《管子·七法》：\n\n> 成器不课不用，不试不臧。尹知章注：“兵器虽成，未经测试则不用臧。”\n\n这里的“课”，是考核、检查的意思。\n\n###\
    \ 2. 课也是占卜\n\n课有一个特殊用法，那就是占卜。由蓍草分门别类一颗一颗的特性，占卜就叫“课”，起一课意思就是占一卦，所以占卜的签筒叫“课筒”，胡说八道，就叫“诘诘语言”。\n\
    \n### 3. 收税为什么叫课税\n\n现在可以说说税的问题了。\n\n古代有一个制度，叫考课。考课是针对官员的，是按一定标准考核官员优劣，分别等差，决定升降赏罚，谓之“考课”。\n\
    \n《东汉·窦忌·张敏传》：\n\n> （刺史）考课众职。\n\n《三国志·魏志·夏侯玄传》：\n\n> 自长以上，课用迁用，转以能升。\n\n说明汉代就有这样的考核官员的制度。\n\
    \n这倒让我想起了《三国演义》中张飞怒鞭督邮的故事，督邮就是负责考课的，他来到刘备处为刘备担任县尉的安喜县巡查，妄想敲诈刘备，被性如烈火的张飞张飞三爸勒到树上一顿。这应该是官员考课中最著名的事了。\n\
    \n不过随便说一句，按照正史《三国志》记载，怒鞭督邮的不是张飞，而是刘备本人。\n\n> 督邮以公事到县，先求见主簿，不通，直入督邮部，杖二百，解缓系其颈着门，弃官亡命。\n\
    \n当时朝廷准备淘汰一批因为镇压黄巾起义而获得官位的人，派督邮来考察。刘备认为自己肯定在通撤名单里，就求见督邮，督邮不悦，刘备直接进去把督邮痛打一顿，然后把官印挂在督邮脖子上，弃官而去。可见历史上真正的刘备可不只是会哭的刘备了。\n\
    \n考核官员，最重要的指标是收税的业绩，为了完成考课业绩目标，收税就叫课税。\n\n### 总结一下\n\n- “果”字的甲骨文是树上结果的象形；\n- 有“果”字作字的汉字都有“由个体颗粒聚集在一起”的含义，比如够、颗、粟、棵等；\n\
    - 言语的“言”加上“果”表示与语言有关，颗颗分别，又聚集在一起的事物，比如上课、课本、课程等，引申为考核；\n- 由于课是分别不同的科目，占卜也是一件事占一卦，所以占卜叫起课；\n\
    - 古代有考核官员业绩的考课制度，刘备曾经怒鞭督邮的故事就和考课有关，《三国演义》将此事安到张飞身上；\n- 由于收税是官员考课最重要的项目，所以收税也叫课税。\n\
    \n### 思考题\n\n《三国演义》为了树立人物形象，常常张冠李戴。刘备的形象是仁厚，所以就把怒鞭督邮的事迹安到张飞头上。《三国演义》还有一些张冠李戴的事，比如《草船借箭》，描述周瑜为陷害诸葛亮，逼诸葛亮在十天内造好十万支箭，诸葛亮用计向曹操“借箭”，挫败了周瑜的暗算。但正史上，诸葛亮借箭并不存在。你知道草船借箭真正的主人公是谁吗？\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_17_2.png)\n\n> 每个字都让你恍然大悟\n\n# 148【克】对内克服，对外敌克\n\
    \n老浦提示：订阅专栏后，文稿中的象形文字可据可点，放大来看，细细品读。\n\n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_18_1.png)\n\
    \n### 1. 克是坚硬的肩膀\n\n克，是一个语感上有点软字的字眼。\n\n**《说文解字》说：**\n\n克，肩也。象屋下刻木之形。\n\n意思是说是克肩膀拱东西，字形像在房子下刻木头。字义是胜任。\n\
    \n看“克”的篆字形，的确有点像一个弯腰驼背扛东西的人形，所以《尔雅》解释这个字为“能也”，就是说肩膀够硬，扛得住。\n\n### 2. 克是顶盔携（guàn）甲的战士\n\
    \n但是甲骨文可看不出肩膀扛东西的意思。\n\n甲骨文的“克”，上面是一个大头甲，下面是一个曲线，曲线上面有一个膝盖骨。\n\n有的甲骨文在上方加了一个点，这究竟是什么意思呢？\n\
    \n用肩膀顶起下面那个膝盖骨肯定勉强，有人说这是杀人祭天的酷刑。还有人说这是用石斧攻击野兽的意思。\n\n要搞清楚这个字形，我们可以把这个甲骨文分解一下。这个有鼓包的字符是什么意思呢？\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_18_8.png)\n\n甲骨文又有一个相似的字符是。\n\n金文增加了一个“爫”即手的象形，表示用手处理牲畜的皮革。看来“克”的下部是披皮的缩写。\n\
    \n那上面的“口形”怎么理解？\n\n再来找一个相似的字符，这是甲骨文“胄”，即保护头部的头盔。\n\n古文的甲胄，甲是身体的护甲，胄是头盔。\n\n这个字上部是头盔的顶端，有羽毛装饰。下部是\U000293ED\
    （mào），这是“胄”的本字，表示帽子，合起来就是保护头部的头盔。\n\n“克”字的上部应该就算是“胄”的缩写。胄加上皮，合起来表示保护战士的盔甲。\n\n\
    我们再来看另一个甲骨文“克”的写法，这是一个戴头盔的人手持武器，一个顶盔携甲手拄戈矛的战士形象。\n\n这就清楚了，克的原意是戴胄持戈的战士，是胜利者的形象，所以克就是战胜，克敌制胜。\n\
    \n从克的甲骨身穿戴来看，这是一个防守的姿态。克服、克敌、克服困难、克己敬礼、克己复礼，这些用法都是防守的意思。但是，攻克、克复、克扣这些用法就纯粹是进攻型了。在上千年的使用中，词性会发生变化。\n\
    \n### 3. 克通“剋”\n\n在古文中，克和剋通假互用。《史记·李斯列传》中就有：\n\n> 更有司，平斗斛度量文章，布之天下，以树秦之制。罪五类。\n\
    \n这是李斯在被秦始皇赐下狱以后写的申诉状，意思是说我要有罪，然后罗列自己的功绩，其中就有一条更平斗斛，这是秦统一制度下，让全国度量衡、文书、法令统一标准。\n\
    \n“剋”是更，就是变，是改变，画成文字，变革书写的文字，就是指用秦文统一文字。\n\n由“剋”这样的通假，就引申出奇巧、刻薄的含义，如克薄、克心、克苦，进一步引申出克期、克宁克宁这样限定时间、空间的用法。\n\
    \n最后，由这样限定时间、空间的含义，活用于为小的重量单位“克”。克就是一个规定好的很小的单位。\n\n### 总结一下\n\n- 克的甲骨文字型为一个顶盔携甲，持戈抗敌的战士，寓意战胜；\n\
    - 克在使用过程中，既有防守型，克制，克己复礼，也有进攻型，攻克，克敌，词性发生变化；\n- 克和剋通假，引申出奇巧、刻薄的含义；\n- 引申为最小的计量单位。\n\
    \n### 思考题\n\n李斯统一文字第一人，他创立的篆文也称为小篆，这里有一篇李斯写的《峄（yì）山碑》，你来分析一下，对比甲骨文、金文，小篆有什么特点？\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_18_18.png)\n\n老浦\n\n本周对我来说有个好消息，就是万颖老师的《精美汉语》第二季上线了。\n\
    \n咱们《老浦识字》试图通过汉字向人们展现历史源头的真实世界，但什么是“真实世界”呢？\n\n万老师上来就向我们提出这个振聋发聩的问题：什么是真实世界？\n\
    \n万老师是这样回答的：真实世界没有主角，真实世界没有主题，真实世界没有完美结局，但是有一点，真实世界比任何故事都好。\n"
  mdcn: "\n# 143 【科】科是一种标准\n\n老潘提示：订阅专栏后，文摘中的象形文字就可点击，放大来看，细细品读。\n\n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_13_0.png)\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_13_1.png)\n\n科这个字用法很多，科学、科长、作奸犯科，都是这个科。这个字是怎么来的，为什么有这么多用法？\n\
    \n### 1. 科的原意是计量\n\n科学是篆文时期才出现的，“科”左边一个不亩的禾「禾」，表示农作物，右边是一个「斗（dǒu）」。「斗」的甲骨文「斗」是一个有手柄的大勺。\n\
    \n金文「金文」稍作变形。\n\n直到篆文，字形才变得符号化了。\n\n和斗斝的「斗」不同，篆文「篆文」、隶书「隶书」和楷书的“鬥”都是两个人打架的象形。简化字把这两个字合成一个字了。\n\
    \n斗的原意是长柄勺子，用来盛酒，同时也是计量单位。与禾亩的禾合起来，表示计量粮食。\n\n> **《说文解字》**：科，程也。从禾，从斗。斗，量也。\n\n\
    **《说文解字》**解释说科就是程，程也是一种计量用品。字形由禾和斗会意，斗是量器。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_13_2.png)\n\
    \n科的本意是衡量，所以同时就有了标准、法规的含义。科长、科目、科以死罪、金科玉律、作奸犯科，以致我们今天所说的科学，都是这种用法。由于有了标准，就有了品类、等级的含义。比如我们今天说的文科、理科就是品类。\n\
    \n### 2. 科举制度核心是有科\n\n由标准，引申出按照标准考核，比如开科取士。按照标准考试录用公务员在古代叫科举。\n\n科举制度是中国古代延续了一千多年的官员录用制度，始于隋代。在此之前，当官主要靠家底出身，科举是按标准改选，这就让普通平民有了通过考试改变命运的机会，“朝为田舍郎，暮登天子堂。”中国的皇权制度能够延续两千多年，和科举制度是分不开的。直到今天，高考仍然被认为是相对公平的教育制度。\n\
    \n科的种类、等级之意，也衍生出科班的概念。科班是供戏剧演员学戏的机构，文人经过科举确定次第等级。戏子投师学艺也可以入某一科，同年入学者为同科。考人或经介绍加入某戏班子的某一科，就叫进班入科。\n\
    \n科班学戏很苦，要签字据，每天很早起来练习，打骂体罚是家常便饭，看过电影《霸王别姬》的同学一定有印象。在科班学戏叫坐科，一般要七年才能科满。这样的经历和出科经历介绍，今天把受过正规教育而非自学成才的也叫科班出身。\n\
    \n### 总结一下\n\n- 「科」的本意是计量禾谷，于是就有标准、法规的含义；\n- 按照标准进行考试就叫科举；\n- 按照标准进入学戏叫科班。\n\n\
    ### 思考题\n\n禾是农业社会非常重要的字，以“禾”为字符组成的字有很多。这是一个甲骨文字形「字形1」，禾「禾」下面有一个人「人」，这是什么字呢？\n\n\
