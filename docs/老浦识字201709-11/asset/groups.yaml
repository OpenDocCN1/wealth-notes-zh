    最早的金文商代就有了，和甲骨文是同一时期。同样是早期文字，为什么甲骨文都是刚硬的线条，而金文都是弯曲的曲线呢？


    老蒲：

    甲骨文是用青铜刀契装在龟甲兽骨上的，由于材质有限，所以甲骨文都是刚硬的直线。金文是在铸造青铜器之前，用毛笔先在内模上写好，然后用青铜刀把文字挖成浅槽，浇铸成模具，在挖造青铜器时，浇铸铜汁成器。由于是浇铜而成，所以线条都呈曲线。


