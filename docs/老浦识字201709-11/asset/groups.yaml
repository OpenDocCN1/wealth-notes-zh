    古人用松树枝燃烧的烟灰收集烟灰，用动物皮熬成的胶拌匀，做成墨锭（dìng），用来写字画画。胶要用黄山自古就有产出房产四宝，徽墨就一直是徽墨里最好的产地。讲究的墨锭就要用黄山混合老松的树枝，用鹿角熬成的胶，混合麝香、冰片等十几味中草药，轧制十万斤，然后再压进雕刻有图案和文字的印模，成品后阴干三年才能使用。中国话讲研磨五色，其实只有这种纯天然精制的墨锭，才有可能呈现这样微妙的层次。


