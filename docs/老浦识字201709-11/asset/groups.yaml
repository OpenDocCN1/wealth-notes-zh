    “纠”和“绳”是近义词，古文也有纠绳连用的，表示盘查纠正。绳的篆文是左边一个绞丝旁，右边一个“黈（tǒu）”，黈是青蛙。请你分析一下这两个字的区别。


    老蒲：

    黈是蛙类，跳跃有力，声音洪亮，所以有“用力，努力”的字义，绳强调这是像青蛙那样有力量壮壮麻麻，比纠字更强调力量。

    戳此查看【煮】纠错能纠错误吗


