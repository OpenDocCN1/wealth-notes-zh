    ## 169【脸】打脸打在哪儿


    老浦提醒：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    ### 识字卡片


    ![](img/49696776a6cb1fac221b4a6b437da7b9_41_1.png)


    字源演变：liǎn


    文字原意：它是殷末时期新造的字，左边是代表人体器官的月字旁，右边是代表头部器官的监（jiān）。在古文中，脸是代表整张脸（包括下巴、腮等）。


    脸面，对于一些人来讲那是要命的事，所以，打脸，就成为现在网络使用频率很高的词汇。对于我们现代人而言，脸就是整个面部，包括所有五官，但是在古人看来，脸其实不是面部的全部。


    ### 1. 脸的原意


    脸（liǎn）在《说文解字》里都没有，是中古时期，也就是唐宋时期才新造的字。左边的“月”字旁，表示这是人体的器官，右边的“监（jiān）”的意思是众人聚集，在这里特指眼睛下面颧骨那一部分。《韵会》：


    > 脸，目下颊上也。


    温庭筠《菩萨蛮》：


    > 凤凰相对盘金盏，牡丹一夜微香雪。明镜照新妆，鬓轻双脸长。


    这是温庭筠14首菩萨蛮词组的第七首的上片，讲的是—个女孩思念恋人的情景：金线绣成的凤凰盘对相叠，绣成的牡丹好似一夜微香，格外的雍容鲜艳。新妆后在镜子里照看，只见双颊消瘦，鬓发轻舞薄如蝉翼。前两句是写景，金色的凤凰，鲜红的牡丹花，而衬托出由于思念而日渐消瘦的面庞，而鬓边的发丝轻轻飞舞，仿佛女孩子思念恋人的思绪。这里的“双脸”就是颧骨这一部分。


    相同的用法还有北宋词人晏殊《破阵子》的下片：


    > 巧笑东邻女伴，采桑径里逢迎。疑怪昨宵春梦好，元是今朝斗草赢，笑从双脸生。


    说在路上碰到邻居家采桑女，笑得如此开心。是昨天晚上做好梦了吗？原来是刚刚和小伙伴斗草游戏赢了，那纯真的笑意从眼下浮现出来，真是美好。


    脸是古代女子涂胭脂的地方，所以，诗词中常有“红脸”、“鹅脸”、“胭脂脸”这些描写。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_41_2.png)


    ### 2. 脸上的部位都叫什么


    在古文中，脸的整体叫“面”（miàn），是人脸的轮廓，里面有个眼睛，代表五官。“人面桃花相映红。”就是这个含义。面部也可称“颜”，三军过后尽开颜。


    眼睛上部，发际线以下是“额”，额头。也叫“题”，指人头的正面，特指额头。


    脸的两侧从眼下到下颌部分，叫“颊”，面颊，就是面中之颊，是面的两侧。


    脸下面，也就是颧骨部分以下，叫腮，也叫“颐”，颐后来引申为保养，颐养天年，颐和园。


    再往下，耳朵下面的骨头，叫“颌”，颌骨，也就是下巴骨。


    再往下，是下巴，古文言为颏（kē）。


    再往下，下颌下方，脖颈（gěng）上方的部分，叫“颔”（hàn），颌骨，指点头表示恭敬，或点头表示答应。颔首低眉，形容低着头，显得很谦恭恭顺的样子。


    现代汉语就没有这么细致了，统称脸。


    ### 总结一下


    - 脸的原意是眼睑以下颧骨部分，古人在这里施胭脂；

    - 宋词中碰见“脸”，都是特指颧骨的这一部分，整个面部是“面”字；

    - 古人对“脸”分的很细，从上到下分别是额或题、脸、腮或颐、颊、颌、颏、颔；

    - 现代汉语将面部统称为脸。


    ### 思考题


    有一个字本意也是面部器官，请你猜猜看这是什么字？


    每个字都让你恍然大悟


    ## 170【问答】牵着大象的鼻子是什么字


    欢迎来到《老派学字》，今天是本周的问答时间，我来为你解答一下本周的思考题。


    跪坐是古人日常的坐姿，有个甲骨文“䇂”像主干“丌”、“𠫓”围着食物“”相对而坐，彬彬有礼地一同进餐。请你猜猜，这是什么字？


    **老浦**


    答“饎”和“乡”都对，原意就是相向而食，后来分化出“公饎”的“饎”和“乡亲”的“乡”。


    （饎）曾经很答案


    ![](img/49696776a6cb1fac221b4a6b437da7b9_42_0.png)


    解是双手卸下牛牛角，这里有一个甲骨文字形，是用一只手牵着大象的鼻子“𩸀”，请你猜猜看，这是什么字？


    **老浦**


    这是“为”字，原意就是牵着大象工作，有作为。


    （为）解牛生剔解效


    ![](img/49696776a6cb1fac221b4a6b437da7b9_42_1.png)


    简化字方便了书写，但容易造成理解上的歧义。请你分析一下，斗室、斗士、星斗、奋斗都繁体字来写，应该怎样写。


    **老浦**


    斗(dǒu)室，表示像斗那么小的屋子；鬥(dòu)士，鬥的原意是两人打架，鬥士是战士，应该用“鬥”；星斗(dǒu)，是指北斗星，是星之指所有星座；奋斗(dòu)，是奋斗努力，应该用“鬥”。


    （斗）松树为什么会松呢


    ![](img/49696776a6cb1fac221b4a6b437da7b9_42_2.png)


    古今字义不同的字还有很多，比如鸡汤的“汤”；金文“𦈘”左边是“水”“氵”，字旁，右边是一个“𠬰”字，“𠬰”是“阳”的本字，现在请你分析一下，“汤”的原意。


    提示一下，成语“扬汤止沸”、“赴汤蹈火”都是“汤”字的原意。


    **老浦**


    汤的原意是温泉，后指热水，汤汤、赴汤蹈火都是热水的含义。现在有些地方名还用的古文原意，比如北京的“小汤山”，就是指这里的温泉。


    （汤）打鼾是哪种鼾


    ![](img/49696776a6cb1fac221b4a6b437da7b9_42_3.png)


    有个字本意也是面部器官“𩢝”，请你猜猜看这是什么字？


    **老浦**


    是耳而且的“而”，是面颊上的毛，也就是大胡子。准确地说，是下巴上的毛。


    而，下巴上的毛；頣，颔下之毛；𩳏，嘴周围的毛；髭(zī)，上嘴唇上面的毛。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_42_4.png)


    （臉）打扮打在哪儿


    ![](img/49696776a6cb1fac221b4a6b437da7b9_42_5.png)


    好，这就是本周的问答，祝你周末愉快，咱们下次再见！


