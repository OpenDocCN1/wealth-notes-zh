    # 163 【生】生生不息


    老猫提示：订阅专栏后，文稿中的篆形文字可戳可点，放大来看，细细品读。


    # 识字卡片


    ![](img/49696776a6cb1fac221b4a6b437da7b9_35_1.png)


    ![](img/49696776a6cb1fac221b4a6b437da7b9_35_2.png)


    生是我们生命中很重要的字，我们从出生、生长、生活、生儿育女、生命、生老病死，都离不开“生”，生的原意是什么呢？


    # 1.生的原意是小苗破土


    甲骨文的“生”![甲骨文‘生’](image_url)就是一株小苗破土而出。


    金文![金文‘生’](image_url)增加了一个点作为指事符号，表示生长这一事物。


    篆文![篆文‘生’](image_url)把金文的一点规范为一横。


    隶书![隶书‘生’](image_url)省掉了笔画，但是也失去了草木向上生长的象形。


    当然，后世的书法弥补了这个遗憾，你看这是王羲之写的“生”![王羲之‘生’](image_url)，又是生机勃勃了。


    生的本意就是草木破土而出，生长。“野火烧不尽，春风吹又生”。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_35_8.png)


    # 2.生的根本是成长


    由于生是小苗破土，就引申为从无到有，发生、生效、诞生。生出来的不一定都是成长，生气也是指怒火从无到有；生事指事端开始发生。


    由于有出生的意思，而中国人历来尊敬长者，所以对于岁数大有学问有经验的人，就称先生，医生是行医的先生，儒生是儒学先生。而出生晚需要学习的人，就谦称晚生、后生、学生。


    戏曲里的生旦净末丑的生是男性角色，老生、小生、武生和娃娃生，这个生应该也是先生的简称。


    由于生是破土而出，进而成长，而活着就是成长的过程，因此活着就叫生活；有活力就叫生机勃勃；活一辈子就是今生今世、一生一世；延绵不绝就是生生不息。


    # 3.为什么生还是不成熟


    既然生是成长，为什么不成熟也叫生呢？如生米、生铁。


    其实这都是成长的引申，不成熟意味着还要成长，还有发展空间，所以不成熟就叫生，生米煮成熟饭、生瓜蛋子。


    不成熟当然也有问题，就是青涩、僵硬，所以叫生涩、生硬、生搬硬套。


    我最佩服古人智慧的地方，是把孩子来到这个世界叫出生、诞生、树苗生活。而不是用下、出、来等等，因为人生是树苗破土而出，终将成长为参天大树。而出人生其实也像树木一样，慢慢成长，慢慢成为栋梁之才，一个生字，包含着对一个新生生命多少美好的期待，而我们的民族，正是这样生生不息的。


    # 总结一下吧


    +   1. 生的原意是草木小苗破土而出，意味着新的生命；

    2. 由于具有出生的含义，而中国人又尊敬长者，所以就有尊称先生、医生、儒生、京剧老生、小生等；

    3. 生意味着成长，意味着活着，所以引申为生长、生活；

    4. 生还意味着不成熟，不成熟就僵硬、生涩、生硬。


    # 思考题


    生是小苗向上生长，这里还有一个甲骨文![甲骨文‘生’](image_url)，它是向下伸展的，请你猜猜，这是什么字？


