    # **131 [奋] 奋斗就要挣脱束缚**


    老潘提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    # **— 识字卡片 —**


    ![](img/49696776a6cb1fac221b4a6b437da7b9_1_0.png)


    我们学习了夺取的夺 [图片]，是把藏在衣服里的小鸟抢走。汉字中还有一个字，[图片]，金文字形和夺很像，意思却完全相反，这就是奋斗的奋。


    # **1.奋的原意**


    金文奋斗的奋 [图片] 和夺 [图片] 一样，外面是衣服的衣 [图片]，里面也有一只小鸟 [图片]，不同的是，夺是衣服外面有一只手 [图片]，表示从衣服里把小鸟抢走，而奋斗的奋是衣服外面是广阔的田野
    [图片]，合起来，表示小鸟挣脱了衣服的束缚，在田野上奋飞。


    ![](img/49696776a6cb1fac221b4a6b437da7b9_1_1.png)


    想象一下，小鸟挣脱出来的一瞬间，一定是拼尽全力的。所以奋字就有了奋飞、振奋、激奋的含义。


    《史记高祖本纪》记载：


    秦末，怀王与诸侯约，先入定关中者王之。当是时，秦兵强，常乘胜逐北，诸将莫利先入关。项羽怨秦破项梁军，奋，愿与沛公西入关。


    意思是说秦朝末年时，怀王和诸将军约定：先进入关中的人可以称王。关中是指在函谷关、大散关、武关和萧关之间陕西地区，自古称天府之国。那时候，秦朝的兵马很强大，经常乘胜追赶打败的人。


    诸将军没有人认为先入关是有利的，只有项羽怨恨秦军打败过项梁的军队，十分激奋，自愿和沛公向进入关内。


    这个“奋”，既有激奋的含义，也有斗志昂扬的激奋含义，可以想见项羽的状态。


    # **2.奋就要挣脱束缚**


    然而我们看金文的奋 [图片]，是挣脱衣服束缚的小鸟。这告诉我们，奋斗的前提是挣脱束缚。


    讲个自己的故事吧。我曾经长期从事电视节目的策划工作，央视《艺术人生》、凤凰卫视《一虎一席谈》都是当时的作品，但栏目录制过程中，常常感觉露宾不能把自己策划的重点表达出来，于是就有心自己去嘉宾。但是我知道自己说话毛病很多，一个央视的老导演也是好朋友对我说：老潘你语速太慢，吐字也不清晰，甚至有点结巴，吃不了开口这碗饭。


    我自己明白，之所以有这些毛病，是自己害怕、紧张。最典型的案例就是在家网站采访瓦尔德尔，全程都在抖腿，被网友发现痛骂。我拜自己的学生编导为师，练习讲话。为了克服心理障碍，反复提示自己：你是人来疯，是最会表达的。经过反复锤炼，现在真成了人来疯，不怕当众表达了。


    我的体会，自卑就是束缚自己的衣服，这样的束缚，也许来自外部，也许来自不理解你的家庭，更多的是来自对自己的成见。要想奋飞，就要挣脱观念的束缚，战胜内心的怯懦，超越自己。


    # **— 总结一下 —**


    +   1. 奋 [图片] 的原意是鸟儿挣脱猎人的束缚在田野奋飞；

    2. 由于挣脱束缚的爆发力，就有了奋飞、振奋以及激奋的含义；

    3. 奋的原意告诉我们，奋斗，就是不断挣脱束缚的过程。


    # **— 思考题 —**


    和鸟有关的汉字非常优美，你看这个字 [图片]，鸟儿仿佛正在展翅飞翔。你猜猜，这是什么字？'
  - "[PAGE 2]\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_2_0.png)\n\n# 132 [问答] 东床快婿怎么来的\n\
    \n欢迎来到老谭识字，今天我来解答一下本期考题。\n\n打击乐器我们学习了鼓，现在有一个字形，也用作打击乐器，你猜猜看，这是个什么字？提示一下，张艺谋曾经用它很出风头，也很很。\n\
    \n老谰\n这是缶，瓦器，用来盛酒，民间老百姓的兴起，也用来敲击高歌。是一种粗黑的乐器。\n\n2008年奥运会开幕式，张艺谋设计了规模宏大的击缶舞，可惜第一，这样的瓦器原本是不登大雅之堂的，蔺相如曾经以命相抵，逼迫秦王击缶，用以羞辱秦国。击缶实在算不上中国文化的情价。\n\
    \n第二，张艺术用的所请缶的原型是湖北曾侯乙墓出土的青铜乐器，缶，缶有夹层，夹层里面放水，缶里面放食物饮料，这就是古代的冷藏设缶，并不是乐器，也不能敲击，所以我说张艺谋用缶击出风头，其实也是出槊，要是他听过《老谭识字》就好了。\n\
    \n咱们这次谈东字，东道主里引申出主人的含义，房东、股东等等。古代还有“东床”这个词，你能说说这是什么意思，并且说说他的来历吗？\n\n老谰\n东床指女婿，典故来自《世新说雅量》：\n\
    \n> 郗（郗鉴）太傅在京口（今江苏镇江市），遣门生与王（王导）丞相求女婿。丞相语郗信：“君往东阿，任意选之。”门生归，郗曰：“王家诸郎，亦皆可嘉，闻来觅婿，咸自珍饰，唯有一郎在东床上，坦腹卧，如不闻。”郗公云：“正此好！”访之，乃是逸少（王羲之），因嫁女而焉。\n\
    \n后称人婿为“令坦”或“东床”，此比。\n坦腹是典型的魏晋风度，自然、坦荡、孤高自许、不顾顾蜉蜉。\n\n你看这个字，是一只鸟，被一只手抓住了，猜猜看，这是什么字？\n\
    \n老谰\n这是“只”，原意是抓住了一只鸟儿，表示单独一个。繁体字“隻”还可以看出原意，简化学就看不出来了。\n顺便说一下，抓住一只鸟是“只”，抓住两只鸟呢？也是一个字，这是“双”，繁体“雙”。\n\
    \n手持物品可以组成很多汉字。这个字形是手持“肉”，你猜猜，这是什么字？\n\n老谰\n这是无的有，古代肉食是很珍贵的，手持一块肉，那就很容易啊，有了。所以有的原意是持有。\n\
    \n和鸟有关的汉字非常优美，你看这个字，鸟儿仿佛正在展翅飞翔。你猜猜，这是什么字？\n\n老谰\n这是燕子的燕，突出了长尾巴和剪刀形的尾羽，是不是很优美传神。\n\
    \n好，本周的问答就是这样了。明天继续为你复盘过往的内容，不要错过！\n\n+   - 本周回顾问题：\n  - [南] 南方传长的鼓声\n  - [东]\
