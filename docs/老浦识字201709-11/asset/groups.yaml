    \n古代有“局”字，是古文字“局”的变形，指棋子或棋盘。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_8_1.png)\n\
    \n《老浦识字》编辑：APP出品\n\n局，我们常说一个人应该有大局观，但常常受到各方面的局限。怎样理解“局”这个字呢？\n\n### 1. 局的原意究竟是什么\n\
    \n“局”的甲骨文、金文都没有，说明是后造的字。\n\n篆文“局”上面是一个“尺”，下面一个“口”，对于这个字，学者有不同的解读。\n\n**《说文解字》：**\n\
    \n> 局，促也。从口在尺下，度也。一曰博，所以行策 (qì) 。象形。\n\n意思是说：局是紧迫。字形是“口”在“尺”的下面，口的原意是指围合起来的一片区域，尺原意是量用具，尺和口合起来，表示被限制、控制住的一片区域，这就是局限。\n\
    \n另一种说法认为，“局”是博弃的用具，是棋盘的象形。\n\n《说文解字》给出了两种解读，一是像被尺子控制住的一片区域，表示局限。二是棋盘，棋盘是规定区域的，是在有限的空间辗转腾挪，解释为局限也说得通。\n\
    \n日本学者白川静认为，“形是埋葬死者屈折双腿的丧葬方式，即屈肢葬。而“形是坐尸形的墓碑，祈祷寄居灵魂安宁。由于屈体，所以有局限、阻限、局部的含义。\n\n\
    ![](img/49696776a6cb1fac221b4a6b437da7b9_8_2.png)\n\n屈肢葬是我国古代丧葬方式之一。其特征主要是把遗体骨肢屈折，使下肢呈蜷曲形状，然后葬入墓坑。春秋战国时期秦人采用这种方式较多。\n\
    \n# 139【问答】距你很远和离你很远一样吗\n\n鼎组成的字，以前我们见过“真”[图1]，这是“具”[图2]，现在有一个金文[图3]，是三足鼎里有“米”，猜猜，这是什么字？\n\
    \n这是大米粥的粥[图4]。古时候把米和肉末放到大鼎里煮，这就是“晋惠帝”“何不食肉糜”的那种肉糜。\n\n篆文形字增加了蒸汽[图5]。\n\n隶书[图6]去掉了大鼎，保留了蒸汽和米，就是我们现代认识的粥了。\n\
    \n在古汉子里，婚是男娶女，姻是女嫁男。婚的篆文字形[图7]，是女字旁加一个原因的“因”。因的甲骨文是[图8]一个人躺在席子上。现在你分析一下婚姻的姻的造字原理。\n\
    \n因的原意是人躺在席子上[图9]。《说文解字》解读为“就也”，就是贴上去，靠上去，躺上去。所以因的原意是躺上去、依靠。加上女字旁，表示女子出嫁，从此有了依靠，有了归宿。这当然是古人男尊女卑世界观的反应，现在不足取。\n\
    \n代表太阳的“日”照在“京”上是景[图10]，“日”照在小草上[图11]是个什么字呢？\n\n这是清早的早[图12]。太阳初升，映照在带露的小草上，这就是早。\n\
    \n在现代汉语中，我们把拒和离合起来用，但这两个字还是有区别的。有一个例子：“距县城50里”和“离县城50里”。你来分析一下这两个字的用法，有什么微妙的区别。\n\
    \n距的本意是抵拒、排斥，语意中是有一定的斗争性的，是此地到彼地。距城50里，是到达县城还有50里，县城是目的地。\n\n离是离开，出发点是县城，离开县城有50里。不过我们今天已经把它二者混合，不太区分了。\n\
    \n这次学习了“局”[图13]，是被圈合被限定在一定范围的状态。现在还有一个甲骨文[图14]，这是牛被圈禁起来了，甲骨文还有一种写法是[图15]，这是羊被圈禁起来了。猜猜，这是个什么字？\n\
    \n这是亡羊补牢的牢[图16]、[图17]，原意是圈养牲畜的围栏建筑。\n\n古代祭祀用的牲畜要专门精心喂养。有牛、羊、豕（shǐ，猪）三牲的祭祀仪式叫太牢，是高级的祭祀；只有羊、豕而没有牛的祭祀仪式叫少牢。\n\
    \n后来关人的建筑也叫牢房、监狱。\n\n由于圈养牲畜必须坚固，所以引申出坚固、耐冲撞的含义，牢固、牢记都来源于此。\n\n- 本周回顾阅读：\n  - 【具】具备与具体\n\
    \  - 【弃】结婚就是放弃吗\n  - 【景】景行是看风景吗\n  - 【距】由鸡爪产生的距离\n  - 【局】破局最有格局\n\n## 用户留言\n\n\
    **goldread**\n本周五有“具、婚、景、距、局”五字。\n\n凑合一下：\n别具一局距客外，不经市景嫁婚人。\n\n同学非常有意识！提前祝福潇老师节日快乐！\n\
    \n“距”字实在太形象了，连蒸汽都有，也表现了粥里要有米，谢谢老潇识字，让我领略了汉字的智慧，讲给朋友和孩子们听他们都很有兴趣\n\n**邓金非**\n这期的答案真是和物理里的矢量（或者数学上的向量）是一样的啊！好开心后三天的题目竟然都对了。不过，前两天老师给的胡答案。现在真的觉得老师给的甲骨文造字抽象概念的能力实在太强了。老师节日快乐！明天教师节提前祝老师节日快乐！老师讲“数”、要不说也讲“数”\n\
    \n# 140【花】为什么消费叫花钱\n\n老浦提示：订阅专栏后，文稿中的象形文字可截可点，放大来看，细细品读。\n\n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_10_0.png)\n\
    ![](img/49696776a6cb1fac221b4a6b437da7b9_10_1.png)\n\n### 1. 花是新造的字\n\n你知道吗，\"\
    花\"和\"华\"原来是同一个字。\n\n甲骨文的\"华\"是两棵上开满了花的样子，原意是木本植物的花，区别于草本植物的花——\"荣\"。\n\n金文将甲骨文字形进行了规整。\n\
    \n篆文基本延续了金文的字形。\n\n有的篆文字形增加了草字头\"艹\"，成为繁体字\"華\"的原型。\n\n我们现在使用的\"花\"字是隶书才有的，草字头下面是对简化的\"\
    化\"字，泛指所有的花。\n\n现在已经不用\"荣\"和\"华\"去细分草本植物和木本植物的花了。\n\n### 2. 化，意味死亡，也意味新生\n\n\"\
    花\"字造的特别好，要领会这个字的妙处，先要认识这个\"化\"字。\n\n甲骨文里的化，是两个人形，一个正常站立，一个却是大头朝下，人整个颠倒过来了，表示事物发生了根本性的改变。\n\
    \n这样的改变是怎样的改变呢？可能是死亡。\n\n古代管死亡叫大化，焚烧叫死化，和尚死亡也会叫坐化。\n\n但是化并不简单指死亡，它通常指一种很大，甚至是脱胎换骨的改变。\n\
    \n比如管教育用语化度、化缘，就是指通过行善、修行而达到人生的一种根本改变，臻于化境，进入更高的境界。\n\n所以化同时引申为生长、化育。化育万物就是指自然界生成万物的功能。\n\
    \n### 3. 花字天然很哲学\n\n由此看来，由草字头下面一个化构成的花，就具有哲学上的意义。\n\n- 1. 花是植物最绚烂的时候；\n- 2. 花是植物生长的一个过程，是变化；\n\
    - 3. 花是死亡，最绚烂的时候就意味着衰败死亡的时候；\n- 4. 花是新生，花的凋零固然令人惋惜，但花落正是结硕果实的开始。\n\n这样，我们就不难理解消费叫花钱。因为花是绚烂，消费金钱的时候就是实现价值的时候，是令人心花怒放的时候。但是同时，也是金钱消亡的时候，是变化的时候，是转换为新的价值的时候。\n\
    \n### 4. 落花不是无情物\n\n对待花开发花落，诗人们历来有两种态度，一种是惋惜：\n\n> 花谢花飞飞满天，红消香断有谁怜。\n\n这是林黛玉的自伤身世。\n\
    \n> 零落成泥碾作尘，只有香如故。\n\n这是陆游的风骨。\n\n还有一种态度是欢呼事物的新生：\n\n> 春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。\n\
    \n这是孟浩然的《春晓》，一夜风雨摧残了花朵，却迎来处处鸣鸟生机勃勃的早晨。\n\n人生境遇莫不如此。\n\n## 总结一下\n\n- 1. 化，是两个颠倒的人形，表示事物发生了根本性的改变，这样的改变，是死亡，也是新生；\n\
    - 2. 花是隶书才有的新字，甲骨文是\"华\"，原意是木本植物的花，草本植物的花是\"荣\"。新开花字泛指所有的花；\n- 3. 由\"化\"字作字的花具有了向死而生和化育新生的哲学含义；\n\
    - 4. 消费叫花钱，具有实现金钱价值、金钱消逝以及转换新价值的丰富内涵。\n\n## 思考题\n\n\"花谢花飞飞满天\"，\"林花谢了春花，太匆匆\"\
    。说花落好理解，为什么花谢要用\"谢\"字？你来分析一下，这是怎么回事？\n\n# 141【华】中国为什么叫中华\n\n老编提示：订阅专栏后，文稿中的象形文字可以点击，放大来看，细细品读。\n\
    \n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_11_0.png)\n\n**字源演变：**\n\
    huá\n\n**文字原意：**\n*《老编识字》《符码》App出品\n\n中国也叫中华，中华族，中华人民共和国。\n\n“中”字我们已经了解了，古人生活在黄河流域中原地区，他们认为这是天下的中心，由这个中心地区向外扩展，所以叫中国，中华。那“华”是怎么回事？\n\
    \n### 1. 华的原意是树上开的花\n\n我们在【花】那一期也已经了解，华的甲骨文是一棵树开满花的样子，原意是树木开的花。\n\n金文对甲骨文进行了规整。\n\
    篆文仍然是树上开花的造型。\n有的篆文加上了草字头，成为繁体“華”的原型。\n\n“華”字在隶书阶段分化出“化”字。\n\n由于华的原意是木本植物的花，所以引申为光彩、光辉、华丽、豪华，在文章中形容漂亮花朵，花草。古人也用来形容花白头发的“多情应笑我，早生华发。”这是苏东坡的名句。\n\
    \n### 2. 中国为什么叫中华\n\n距今大约一万到七千年前，在今天的陕西、甘肃地区，生活着一些母系氏族的族群，其中有以农业为生的华族和以采集狩猎为生的宵族，两个氏族的青年男女在清水河边弹歌取乐，戏水欢聚，互相通婚，生的孩子由母亲的氏族抚养。两个氏族后来合并为华宵氏，华宵氏的氏族首领相传踩了雷兽的脚印，生下了中国的人文始祖伏羲和女娲。于是这位华宵氏就成为中华民族的“始祖母”，后来的神农、黄帝都是这一繁衍的。\n\
    \n于是，这个民族就称为中华民族。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_11_1.png)\n\n华宵氏为什么用“华”作氏族的名称呢？有人说是因为华宵族在华山（hua）山脚下。其实了解“华”字的原意就很容易理解，华族是木本植物的花朵，指明这个氏族的生活方式由狩猎采集过为农业种植，是中国农业社会的开端。\n\
    \n相传华宵氏埋葬在今陕西省西安市蓝田县焦塬镇老坳村，附近有半坡遗址和一段热播电视剧《白鹿原》的故事发生地，有兴趣可以去怀古探幽。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_11_2.png)\n\
    \n华还应引申为丝绸服装，即华服。\n\n由于率先进入农业社会，并且相传黄帝的妻子嫘祖发明了丝绸纺织，文明程度明显高于周边蛮夷，所以称为华夏。华是看华服，夏是大人，意思是强大的文明部族。\n\
    \n华宵、华夏、中华，就是这么沿革下来的。\n\n### 3. 华表的来历\n\n说到中华，我们总是会想到天安门前的华表，觉得华表和天安门前一起，是祖国的象征。\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_11_3.png)\n\n华表古叫诽谤术，是上古君王尧设立的“意见箱”，在一个木头柱子上横杆一块木牌，树立在交通要道上，征集群众意见，古代帝王在宫殿前建立这样的柱子，表明自己纳谏。\n\
    \n诽谤原来是个褒义词，古代大臣上奏折说希望君王“开诽谤之路，纳忠谠之言”。“意是接受不同意见。后来词性演变，称为不实之词。\n\n天安门前后各有一对汉白玉华表。华表顶上蹲着的动物叫石吼（hòu），是神话传说中专登高山望远的北方食人之兽。下面横插玉板，柱身雕刻云纹。华表与天安门同建于明永乐年间，迄今已有500多年历史。\n\
    \n## 总结一下\n\n- 1. 华的原意是木本植物的花朵，引申为光彩、豪华；\n- 2. 之所以叫中华，是因为中华民族的始祖华宵氏民族叫华姓，诞下伏羲和女娲，使中华民族延续至今；\n\
    - 3. 华夏之华是丝绸华服，象征文明；\n- 4. 华表是尧设诽谤术征集群众意见沿革下来的。\n\n## 思考题\n\n华是树木开的花，用“木”作基本字旁构造的汉字有很多。这是“木”下面增加了两个圆点，你来猜猜看，这是个什么字？表示什么意思？\n\
    \n延伸阅读：\n《中国花》 花道\n【花】为什么满树叫花枝\n\n# 142丨侃 | 侃大山要有风度\n\n老潘提示：订购专栏后，文稿中的象形文字可点开放大来看，细细品读。\n\
    \n## 识字卡片\n\n**字源演变：**\n铁 侃侃 侃 kǎn\n\n甲骨文 金文 篆书 楷书 行书\n\n北京话把聊天称为侃大山，除了有谈话的含义，还有一点云山雾罩不看边际随口吹的感觉，这种能侃的人叫侃爷，通常有点不着调。但是你知道吗，这个字在《说文解字》里的解释是刚直，没想到吧？\n\
    \n### 1. 侃是刚直\n\n侃怎么会是刚直？《说文解字》：侃，刚直也。\n\n“侃”，古作“亘”（xìn），“亘”，古文本。从川，取其不舍昼夜。\n\n\
    《论语》曰：子路侃侃如也。\n\n《说文解字》说：侃是刚直的意思，字形采用“亘”作边旁。\n\n信 亠 我们 以 前 聊 过 ，人 字 旁 一个“信”，种，这个口，表示说话“亠”在神前发誓，以取信于人。下面的“川”，是孔子在河边发感慨的典故：\n\
    \n> 子在川上曰：逝者如斯夫！不舍昼夜。\n\n说孔子在奔流不息的河边说：河水就这样日夜不停地流走了。时间、人生不也是这样日夜不停地流逝吗？\n\n许慎引用《论语》“子路侃侃如也。”来解释侃这个字的用法。子路侃侃而谈，而孔子的学生孔子路我们都知道，性格刚直不阿，至死都要正衣冠。因此，侃就有了刚直的意思。\n\
    \n《论语·子罕》上面是这样的：\n\n> 阎子侍侧，间（yán）阎如也；子路，行行（háng）如也；冉有、子贡，侃侃如也。\n> 子路，“若由也，不得其死然。”\n\
    \n看出不对了吧。说孔子的几个学生侍立在孔子身边，表现都不一样。阎子“阎阎如也”，这是谦和中正的样子。子路是“行行如也”，行的原意是十字路，代表行进，在这里形容子路匆匆忙忙，一副停不下来的样子。冉有、子贡才是“侃侃如也。”这里的“侃侃”怎么解释，我们下面细谈。单说这句话，大概许慎老先生看了行，把形容冉有、子贡的话安到了子路身上了。\n\
    \n这么看，说“侃”刚直看不住脚，那“侃”到底什么意思？\n"
  mdcn: "\n# 136【景】“景行”是看风景吗\n\n老萧提示：订阅专栏后，文稿中的象形文字可点击，放大来看，细细品读。\n\n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_6_0.png)\n\
    ![](img/49696776a6cb1fac221b4a6b437da7b9_6_1.png)\n![](img/49696776a6cb1fac221b4a6b437da7b9_6_2.png)\n\
    \n**文字原意：**\n\n金文字形上面是日，下面是京。京代表高而大的台，在城墙上留下的影子，引申为光明高大。\n\n高山仰止，景行行止。\n\n这是司马迁称颂孔子的话，以前没深想，觉得这是形容孔子犹如高塔不可企及。但解字的眼光看，这句话很简单，尤其是“景行”，是看风景吗？\n\
    \n金文的“景”上面是“日”，下面是“京”。\n\n代表太阳；下面是“京”。\n\n### 1. 京的原意\n\n“京”的原意是城墙上高高的楼台，这个字形后来又分化出“高”和“影”三个字。由于拥有这样高大楼台的城池通常规模很大，只有都城才有，所以京也就是都城，京都，京师。\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_6_3.png)\n\n### 2. 景是日影\n\n明白了京，景就好理解了。景是太阳照在高高的城楼上，留下长影子。所以“景”就有了高大、明亮和影子的含义，进而引申出景物、仰慕和崇敬的含义。\n\
    \n### 3. 景代表光明\n\n《荀子·解蔽》里讲了一个故事，说有一个鲁国的人善于射箭并且喜欢思考，蚊蝇嗡嗡的声音都会妨碍他，于是他远离一切耳朵的娱乐，甚至远离蚊蝇这类最小动物的影响，这让他心息非常通达。但这样的人并没有达到最高境界，真正达到最高境界就没什么需要躲避的，也说明要思考的，\"\
    故清明外景，清明内景\"，浑浊聪明白道的人只能在外表显现出光彩，清楚聪明白道的人才能在心灵深处闪现出光芒。这里的\"景\"，就是光明的意思。\n\n# 137【距】由鸡爪产生的距离\n\
    \n老浦提醒：订完专栏后，文章中的象形文字可点可见，放大来看，细细品读。\n\n## 识字卡片\n\n| 汉字 | 读音 | 部首 | 笔画 |\n| :---\
    \ | :--- | :--- | :--- |\n| 距 | jù | 足 | 11 |\n\n**文字原意：**\n[小篆] 甲骨文、金文、小篆、隶书、楷书、行书等字形的演变过程。\n\
    \n美学上有一个原理：距离产生美感。比如欣赏珠穆朗玛峰要远远地观赏，身处其中是会很可怕的。空间上如此，时间上也是如此，比如大人对童年具有美好记忆，那是因为这个时间段有太多的美好记忆。但是，人是时间距离的“距”会舒适地发现，距的原意居然和鸡爪子有关。\n\
    \n### 1. 先认识巨\n\n**距的金文：**\n[金文字形] 左边是一个足字旁，右边是一个“巨”。\n\n**巨的甲骨文** [甲骨文字形] 原是木匠手里的直角曲尺，是矩（jǔ）的原字。\n\
    \n古代木匠的一个核心工具是放样，即将小尺寸的设计放大成为实际操作的墨线，而曲尺就是放样工具，由此引申为巨大。\n\n古代绘画伏羲女娲图中，伏羲手持的就是圆规，女娲手持的是曲尺，寓意没有规矩不成方圆。\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_7_1.png)\n\n### 2. 距就是鸡爪子\n\n足字旁加上巨，原意是公鸡鸡爪后面凸起的小爪子，叫距爪，也叫蹙（cù）爪，可当作攻击用的武器。由于距爪与其它爪子永远是分开的，所以有抗拒、排斥的含义。\n\
    \n### 3. 距也可指整个鸡爪。\n\n《左传.昭公二十五年》记载：\n\n季、郈（hòu）之鸡斗。季平子给他的斗鸡安上了盔甲，而郈昭伯则给他的鸡戴上金属的爪子。（后来谁赢？当然是有进攻性金属爪子的鸡赢了配备防御型盔甲的鸡。）\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_7_2.png)\n\n由于距的原意是鸡爪后面的距爪，所以它首先引申为钓鱼工具的倒刺。\n\
    \n《淮南子.原道》：\n\n> 引玄鱼临于渊，钩而不得盈卵，虽有钩针芒，微锐毒苦，加之 詹，鼷鼯之兽，就不能网兽（qu）争也。\n\n> 说在江上钓鱼，鱼很多但天多钩子不满一篓子，即使有很利的鱼钩和锋利的鱼钩倒刺，加上毒，鼷鼯这样的毒鱼钩高手，也不可能和渔网竞争。\n\
    \n又由于距是指鸡的鸡爪子，所以就有了抗拒、抵御的含义。\n\n《论语》里记述了一个小故事很有意思：\n\n> 子游为武城，弦歌之。\n> 夫子莞尔而笑，曰：“割鸡焉用牛刀？”\n\
    > 子游对曰：“昔者偃也闻夫子曰：‘君子学道则爱人，小人学道则易使也。’”\n> 子曰：“二三子！偃之言是也。前言戏之耳。”\n\n孔子的学生子游做了武城这个地方的行政长官。由于武城是鲁国边陲的一座城市，人们尚未开化，比较粗俗。子游到任后，致力于礼乐教化的教育工作，经过了几年努力，自己感觉悟理的功夫，就特意邀请孔子来到武城去观览。孔子带着弟子们进入武城，就听到弦歌之声。琴歌是一种很正派、礼乐教化的，即弹着琴歌唱学生阅读。孔子就笑着说：“杀鸡何用宰牛的刀呢？”\n\
    \n子游马上解释道：“老师，我记得以前听人家这么说，君子学礼乐，就能爱人；小人学礼乐，就容易使唤。”意思是这是您老人家自己的管理思路啊。孔子说这话并非真的，我刚才那句话不过是同他开玩笑罢了。\n\
    \n汉代的王充在《论衡·问孔》中评论这件事：\n\n> 孔子笑子游之谈，子游引前言以距孔子。\n\n意思是子游用孔子自己的话驳斥孔子，师生由此有了距离。由抗拒，引申为距离。\n\
    \n## 总结一下\n\n- 1. 巨大的巨 [甲骨文字形] 原意是木工用的曲尺，用于制作大样工具，引申为巨大；\n- 2. 距离的距 [金文字形] ，巨加上足字旁，原意是公鸡鸡爪子后面凸起的小爪子，叫鸡距，通常都是鸡爪子的凸起小爪子与曲尺很像，引申为鸡爪；\n\
    - 3. 由于是鸡爪子的后部，活用于钓鱼、倒刺；\n- 4. 子游用孔子自己的话驳斥孔子，师生由此有了距离，由抗拒，引申为距离。\n\n## 思考题\n\n\
    在现在汉语中，我们把拒和离合起来用，但这两个字，是有区别。有一个例子：“距县城50里”和“离县城50里”。你分析一下这两个字的用法，有什么微妙的区别？\n\n\
    # 138【局】破局要有格局\n\n老浦提示：订阅菜单栏后，文摘中的象形文字可查可点，放大来看，细细品读。\n\n## 识字卡片\n\n| 汉字 | 读音\
    \ | 部首 | 笔画 |\n| :--- | :--- | :--- | :--- |\n| 局 | jú | 尸 | 5 |\n\n**文字原意：**\n\
    \n古代有“局”字，是古文字“局”的变形，指棋子或棋盘。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_8_1.png)\n\
    \n《老浦识字》编辑：APP出品\n\n局，我们常说一个人应该有大局观，但常常受到各方面的局限。怎样理解“局”这个字呢？\n\n### 1. 局的原意究竟是什么\n\
    \n“局”的甲骨文、金文都没有，说明是后造的字。\n\n篆文“局”上面是一个“尺”，下面一个“口”，对于这个字，学者有不同的解读。\n\n**《说文解字》：**\n\
    \n> 局，促也。从口在尺下，度也。一曰博，所以行策 (qì) 。象形。\n\n意思是说：局是紧迫。字形是“口”在“尺”的下面，口的原意是指围合起来的一片区域，尺原意是量用具，尺和口合起来，表示被限制、控制住的一片区域，这就是局限。\n\
    \n另一种说法认为，“局”是博弃的用具，是棋盘的象形。\n\n《说文解字》给出了两种解读，一是像被尺子控制住的一片区域，表示局限。二是棋盘，棋盘是规定区域的，是在有限的空间辗转腾挪，解释为局限也说得通。\n\
    \n日本学者白川静认为，“形是埋葬死者屈折双腿的丧葬方式，即屈肢葬。而“形是坐尸形的墓碑，祈祷寄居灵魂安宁。由于屈体，所以有局限、阻限、局部的含义。\n\n\
    ![](img/49696776a6cb1fac221b4a6b437da7b9_8_2.png)\n\n屈肢葬是我国古代丧葬方式之一。其特征主要是把遗体骨肢屈折，使下肢呈蜷曲形状，然后葬入墓坑。春秋战国时期秦人采用这种方式较多。\n\
    \n# 139【问答】距你很远和离你很远一样吗\n\n鼎组成的字，以前我们见过“真”[图1]，这是“具”[图2]，现在有一个金文[图3]，是三足鼎里有“米”，猜猜，这是什么字？\n\
    \n这是大米粥的粥[图4]。古时候把米和肉末放到大鼎里煮，这就是“晋惠帝”“何不食肉糜”的那种肉糜。\n\n篆文形字增加了蒸汽[图5]。\n\n隶书[图6]去掉了大鼎，保留了蒸汽和米，就是我们现代认识的粥了。\n\
    \n在古汉子里，婚是男娶女，姻是女嫁男。婚的篆文字形[图7]，是女字旁加一个原因的“因”。因的甲骨文是[图8]一个人躺在席子上。现在你分析一下婚姻的姻的造字原理。\n\
    \n因的原意是人躺在席子上[图9]。《说文解字》解读为“就也”，就是贴上去，靠上去，躺上去。所以因的原意是躺上去、依靠。加上女字旁，表示女子出嫁，从此有了依靠，有了归宿。这当然是古人男尊女卑世界观的反应，现在不足取。\n\
    \n代表太阳的“日”照在“京”上是景[图10]，“日”照在小草上[图11]是个什么字呢？\n\n这是清早的早[图12]。太阳初升，映照在带露的小草上，这就是早。\n\
    \n在现代汉语中，我们把拒和离合起来用，但这两个字还是有区别的。有一个例子：“距县城50里”和“离县城50里”。你来分析一下这两个字的用法，有什么微妙的区别。\n\
    \n距的本意是抵拒、排斥，语意中是有一定的斗争性的，是此地到彼地。距城50里，是到达县城还有50里，县城是目的地。\n\n离是离开，出发点是县城，离开县城有50里。不过我们今天已经把它二者混合，不太区分了。\n\
    \n这次学习了“局”[图13]，是被圈合被限定在一定范围的状态。现在还有一个甲骨文[图14]，这是牛被圈禁起来了，甲骨文还有一种写法是[图15]，这是羊被圈禁起来了。猜猜，这是个什么字？\n\
    \n这是亡羊补牢的牢[图16]、[图17]，原意是圈养牲畜的围栏建筑。\n\n古代祭祀用的牲畜要专门精心喂养。有牛、羊、豕（shǐ，猪）三牲的祭祀仪式叫太牢，是高级的祭祀；只有羊、豕而没有牛的祭祀仪式叫少牢。\n\
    \n后来关人的建筑也叫牢房、监狱。\n\n由于圈养牲畜必须坚固，所以引申出坚固、耐冲撞的含义，牢固、牢记都来源于此。\n\n- 本周回顾阅读：\n  - 【具】具备与具体\n\
    \  - 【弃】结婚就是放弃吗\n  - 【景】景行是看风景吗\n  - 【距】由鸡爪产生的距离\n  - 【局】破局最有格局\n\n## 用户留言\n\n\
    **goldread**\n本周五有“具、婚、景、距、局”五字。\n\n凑合一下：\n别具一局距客外，不经市景嫁婚人。\n\n同学非常有意识！提前祝福潇老师节日快乐！\n\
    \n“距”字实在太形象了，连蒸汽都有，也表现了粥里要有米，谢谢老潇识字，让我领略了汉字的智慧，讲给朋友和孩子们听他们都很有兴趣\n\n**邓金非**\n这期的答案真是和物理里的矢量（或者数学上的向量）是一样的啊！好开心后三天的题目竟然都对了。不过，前两天老师给的胡答案。现在真的觉得老师给的甲骨文造字抽象概念的能力实在太强了。老师节日快乐！明天教师节提前祝老师节日快乐！老师讲“数”、要不说也讲“数”\n\
    \n# 140【花】为什么消费叫花钱\n\n老浦提示：订阅专栏后，文稿中的象形文字可截可点，放大来看，细细品读。\n\n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_10_0.png)\n\
    ![](img/49696776a6cb1fac221b4a6b437da7b9_10_1.png)\n\n### 1. 花是新造的字\n\n你知道吗，\"\
    花\"和\"华\"原来是同一个字。\n\n甲骨文的\"华\"是两棵上开满了花的样子，原意是木本植物的花，区别于草本植物的花——\"荣\"。\n\n金文将甲骨文字形进行了规整。\n\
    \n篆文基本延续了金文的字形。\n\n有的篆文字形增加了草字头\"艹\"，成为繁体字\"華\"的原型。\n\n我们现在使用的\"花\"字是隶书才有的，草字头下面是对简化的\"\
    化\"字，泛指所有的花。\n\n现在已经不用\"荣\"和\"华\"去细分草本植物和木本植物的花了。\n\n### 2. 化，意味死亡，也意味新生\n\n\"\
    花\"字造的特别好，要领会这个字的妙处，先要认识这个\"化\"字。\n\n甲骨文里的化，是两个人形，一个正常站立，一个却是大头朝下，人整个颠倒过来了，表示事物发生了根本性的改变。\n\
    \n这样的改变是怎样的改变呢？可能是死亡。\n\n古代管死亡叫大化，焚烧叫死化，和尚死亡也会叫坐化。\n\n但是化并不简单指死亡，它通常指一种很大，甚至是脱胎换骨的改变。\n\
    \n比如管教育用语化度、化缘，就是指通过行善、修行而达到人生的一种根本改变，臻于化境，进入更高的境界。\n\n所以化同时引申为生长、化育。化育万物就是指自然界生成万物的功能。\n\
    \n### 3. 花字天然很哲学\n\n由此看来，由草字头下面一个化构成的花，就具有哲学上的意义。\n\n- 1. 花是植物最绚烂的时候；\n- 2. 花是植物生长的一个过程，是变化；\n\
    - 3. 花是死亡，最绚烂的时候就意味着衰败死亡的时候；\n- 4. 花是新生，花的凋零固然令人惋惜，但花落正是结硕果实的开始。\n\n这样，我们就不难理解消费叫花钱。因为花是绚烂，消费金钱的时候就是实现价值的时候，是令人心花怒放的时候。但是同时，也是金钱消亡的时候，是变化的时候，是转换为新的价值的时候。\n\
    \n### 4. 落花不是无情物\n\n对待花开发花落，诗人们历来有两种态度，一种是惋惜：\n\n> 花谢花飞飞满天，红消香断有谁怜。\n\n这是林黛玉的自伤身世。\n\
    \n> 零落成泥碾作尘，只有香如故。\n\n这是陆游的风骨。\n\n还有一种态度是欢呼事物的新生：\n\n> 春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。\n\
    \n这是孟浩然的《春晓》，一夜风雨摧残了花朵，却迎来处处鸣鸟生机勃勃的早晨。\n\n人生境遇莫不如此。\n\n## 总结一下\n\n- 1. 化，是两个颠倒的人形，表示事物发生了根本性的改变，这样的改变，是死亡，也是新生；\n\
    - 2. 花是隶书才有的新字，甲骨文是\"华\"，原意是木本植物的花，草本植物的花是\"荣\"。新开花字泛指所有的花；\n- 3. 由\"化\"字作字的花具有了向死而生和化育新生的哲学含义；\n\
    - 4. 消费叫花钱，具有实现金钱价值、金钱消逝以及转换新价值的丰富内涵。\n\n## 思考题\n\n\"花谢花飞飞满天\"，\"林花谢了春花，太匆匆\"\
    。说花落好理解，为什么花谢要用\"谢\"字？你来分析一下，这是怎么回事？\n\n# 141【华】中国为什么叫中华\n\n老编提示：订阅专栏后，文稿中的象形文字可以点击，放大来看，细细品读。\n\
    \n## 识字卡片\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_11_0.png)\n\n**字源演变：**\n\
    huá\n\n**文字原意：**\n*《老编识字》《符码》App出品\n\n中国也叫中华，中华族，中华人民共和国。\n\n“中”字我们已经了解了，古人生活在黄河流域中原地区，他们认为这是天下的中心，由这个中心地区向外扩展，所以叫中国，中华。那“华”是怎么回事？\n\
    \n### 1. 华的原意是树上开的花\n\n我们在【花】那一期也已经了解，华的甲骨文是一棵树开满花的样子，原意是树木开的花。\n\n金文对甲骨文进行了规整。\n\
    篆文仍然是树上开花的造型。\n有的篆文加上了草字头，成为繁体“華”的原型。\n\n“華”字在隶书阶段分化出“化”字。\n\n由于华的原意是木本植物的花，所以引申为光彩、光辉、华丽、豪华，在文章中形容漂亮花朵，花草。古人也用来形容花白头发的“多情应笑我，早生华发。”这是苏东坡的名句。\n\
    \n### 2. 中国为什么叫中华\n\n距今大约一万到七千年前，在今天的陕西、甘肃地区，生活着一些母系氏族的族群，其中有以农业为生的华族和以采集狩猎为生的宵族，两个氏族的青年男女在清水河边弹歌取乐，戏水欢聚，互相通婚，生的孩子由母亲的氏族抚养。两个氏族后来合并为华宵氏，华宵氏的氏族首领相传踩了雷兽的脚印，生下了中国的人文始祖伏羲和女娲。于是这位华宵氏就成为中华民族的“始祖母”，后来的神农、黄帝都是这一繁衍的。\n\
    \n于是，这个民族就称为中华民族。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_11_1.png)\n\n华宵氏为什么用“华”作氏族的名称呢？有人说是因为华宵族在华山（hua）山脚下。其实了解“华”字的原意就很容易理解，华族是木本植物的花朵，指明这个氏族的生活方式由狩猎采集过为农业种植，是中国农业社会的开端。\n\
    \n相传华宵氏埋葬在今陕西省西安市蓝田县焦塬镇老坳村，附近有半坡遗址和一段热播电视剧《白鹿原》的故事发生地，有兴趣可以去怀古探幽。\n\n![](img/49696776a6cb1fac221b4a6b437da7b9_11_2.png)\n\
    \n华还应引申为丝绸服装，即华服。\n\n由于率先进入农业社会，并且相传黄帝的妻子嫘祖发明了丝绸纺织，文明程度明显高于周边蛮夷，所以称为华夏。华是看华服，夏是大人，意思是强大的文明部族。\n\
    \n华宵、华夏、中华，就是这么沿革下来的。\n\n### 3. 华表的来历\n\n说到中华，我们总是会想到天安门前的华表，觉得华表和天安门前一起，是祖国的象征。\n\
    \n![](img/49696776a6cb1fac221b4a6b437da7b9_11_3.png)\n\n华表古叫诽谤术，是上古君王尧设立的“意见箱”，在一个木头柱子上横杆一块木牌，树立在交通要道上，征集群众意见，古代帝王在宫殿前建立这样的柱子，表明自己纳谏。\n\
    \n诽谤原来是个褒义词，古代大臣上奏折说希望君王“开诽谤之路，纳忠谠之言”。“意是接受不同意见。后来词性演变，称为不实之词。\n\n天安门前后各有一对汉白玉华表。华表顶上蹲着的动物叫石吼（hòu），是神话传说中专登高山望远的北方食人之兽。下面横插玉板，柱身雕刻云纹。华表与天安门同建于明永乐年间，迄今已有500多年历史。\n\
    \n## 总结一下\n\n- 1. 华的原意是木本植物的花朵，引申为光彩、豪华；\n- 2. 之所以叫中华，是因为中华民族的始祖华宵氏民族叫华姓，诞下伏羲和女娲，使中华民族延续至今；\n\
    - 3. 华夏之华是丝绸华服，象征文明；\n- 4. 华表是尧设诽谤术征集群众意见沿革下来的。\n\n## 思考题\n\n华是树木开的花，用“木”作基本字旁构造的汉字有很多。这是“木”下面增加了两个圆点，你来猜猜看，这是个什么字？表示什么意思？\n\
    \n延伸阅读：\n《中国花》 花道\n【花】为什么满树叫花枝\n\n# 142丨侃 | 侃大山要有风度\n\n老潘提示：订购专栏后，文稿中的象形文字可点开放大来看，细细品读。\n\
    \n## 识字卡片\n\n**字源演变：**\n铁 侃侃 侃 kǎn\n\n甲骨文 金文 篆书 楷书 行书\n\n北京话把聊天称为侃大山，除了有谈话的含义，还有一点云山雾罩不看边际随口吹的感觉，这种能侃的人叫侃爷，通常有点不着调。但是你知道吗，这个字在《说文解字》里的解释是刚直，没想到吧？\n\
    \n### 1. 侃是刚直\n\n侃怎么会是刚直？《说文解字》：侃，刚直也。\n\n“侃”，古作“亘”（xìn），“亘”，古文本。从川，取其不舍昼夜。\n\n\
    《论语》曰：子路侃侃如也。\n\n《说文解字》说：侃是刚直的意思，字形采用“亘”作边旁。\n\n信 亠 我们 以 前 聊 过 ，人 字 旁 一个“信”，种，这个口，表示说话“亠”在神前发誓，以取信于人。下面的“川”，是孔子在河边发感慨的典故：\n\
    \n> 子在川上曰：逝者如斯夫！不舍昼夜。\n\n说孔子在奔流不息的河边说：河水就这样日夜不停地流走了。时间、人生不也是这样日夜不停地流逝吗？\n\n许慎引用《论语》“子路侃侃如也。”来解释侃这个字的用法。子路侃侃而谈，而孔子的学生孔子路我们都知道，性格刚直不阿，至死都要正衣冠。因此，侃就有了刚直的意思。\n\
    \n《论语·子罕》上面是这样的：\n\n> 阎子侍侧，间（yán）阎如也；子路，行行（háng）如也；冉有、子贡，侃侃如也。\n> 子路，“若由也，不得其死然。”\n\
    \n看出不对了吧。说孔子的几个学生侍立在孔子身边，表现都不一样。阎子“阎阎如也”，这是谦和中正的样子。子路是“行行如也”，行的原意是十字路，代表行进，在这里形容子路匆匆忙忙，一副停不下来的样子。冉有、子贡才是“侃侃如也。”这里的“侃侃”怎么解释，我们下面细谈。单说这句话，大概许慎老先生看了行，把形容冉有、子贡的话安到了子路身上了。\n\
    \n这么看，说“侃”刚直看不住脚，那“侃”到底什么意思？\n"
