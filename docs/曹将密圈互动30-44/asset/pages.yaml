  md: '起一片天，她被选中了，虽然觉得有些困难，但是她在自己也不会的情况下，竟然能从无到有一点点学习摸索并且搭建起一套自己的系统，不仅自己能够快速学会，并且做成模板带训其他小伙伴，这个能力让我十分佩服。当她又被调到经营分析部，也是一个新组织一个人从0开始的，而且她并不是一个专业的财务。刚接手马上面临着做年度预算这种让我们各仓头疼的事情，因为去年也是一个刚接手的同事，花了2个月给我们折腾了十几次，最后还是被大老板批了，本来一个没那么烦的事情大家开始十分恐惧。她当时花了很长的时间，在纷繁复杂的经营数据中通过跟各方的沟通，汇总出了一套共识的模板以及口径标准，所有的数据已经一个个仔细的核对并且清晰的标注说明了来源口径，结果大家一起一上午很快就提交了，效率很高。她总会把工作做在前面，并且能够帮大家减负。


