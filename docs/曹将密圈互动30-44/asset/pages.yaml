- pgno: 337
  md: '# 「曹将和朋友们」2023 年第 41 期密圈互动：


    “职场中，如何避免被边缘化？”


    由小助理星雨先开始。


    +   1.业务本身是支持岗，靠项目成果发光彩。


    支持岗的角色，比如财务、法务、hr 都往往因为不产生实际业务效果而被边缘化。


    这种情况，靠一次整合性的项目，能让自己的业务板块被看到和被重视。


    比如，项目中财务很好的发挥了成本管控和风险预警，让项目损失减少 xx 并在结算流程上打通了 xx。


    ![](img/fd2e610148b4a342dbf249dc1164d278_337_0.png)'
  merge: -1
  img_proc: true
- pgno: 338
  md: '一旦和某个项目，尤其是重要项目挂钩，业务价值就能很好的凸显。


    价值背后是人的贡献，那你自然不会被忽略。


    2. 要有自己的「小团队」，耳朵懂得「装聋」。


    虽然同事不一定个个都能成为朋友，但最好还是得有自己的工作圈子，至少落下什么信息，需要帮个忙的时候，可以有个照应的人。


    有了圈子，至少大家彼此之间是有存在感的，至少在快被别人边缘化的时候，是可以被圈子里的人激活、提起你的。


    同时，敏感信息要装聋装听不见，因为很有可能性听了不该听的东西，还别对方知道了，这就是很危险。'
  merge: -1
  img_proc: true
- pgno: 339
  md: '+   3.抱好大腿。


    通用型的方法，就是找到好「大腿」。


    这里主要取决于老板的话语权，如果直接上级本来就比较好吃得开，那一 般在执行的时候，跨部门的领导还是比较买账的。


    如果上级平平淡淡，那就主要是靠大老板的大腿，比如发掘了一些你非本职专业的一些能力，因为这些能力往往在执行落地过程中，不容易被大老板看到。


    反而，往往容易被看到的是一些「软技能」，比如 ppt 制作、office、演讲、表达培训等能力。


    通过一次次展现，逐步积累一些自己的能见度，至少不被忽略。'
  merge: -1
  img_proc: true
- pgno: 340
  md: '以上~


    期待星友们的精彩发言。'
  merge: -1
  img_proc: true
