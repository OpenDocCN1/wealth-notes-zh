  md: '# 03. 张苏言


    1、专业第一。


    因为我大学实习时曾在国有企业待过，带有一些央企国企工作的那种所谓办公室站队思维，所以刚正式开始工作的时候，身上还有一些搞办公室政治的想法和痕迹。


