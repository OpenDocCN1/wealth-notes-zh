- pgno: 166
  md: '看，在做的过程中我偶尔会问下效果如何。他说目前运行下来感觉不错。


    ②对于比较紧急出现的问题，那第一时间肯定不是发火，当然需要先【止损】之后再来一期分析，为什么会产生问题的原因，以及如何规避的具体措施，这样才能确保问题不再出现。


    ③对于出现重要的问题，先承担起责任。就在去年我差点获得了一个公司级的红头文件处罚，因为团队一个伙伴休产假，工作交接给了他人，对方信息没有了解清楚就安排作业，结果货品直接出现了货损，估值好几万，直接收到了买家的投诉到了公司。本来我准备自己承担不行就引咎辞职了，后来人资没同意，必须全部处罚，这个时候也没必要发火了，跟团队说清楚承担就是了，连坐人员也都愿意接受处罚。当时我们争取了一下修复货品，然后仔细盘下来，资损仅几十块，后来公司就放过了我们，事情处理完，


