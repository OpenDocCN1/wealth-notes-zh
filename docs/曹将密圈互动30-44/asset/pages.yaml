  md: '# ## 07.Hanson


    大家好，我是耳东陈（对，改名了），希望传播中文，哈哈。


    进入主题：首先，我来定义一下“边缘化”：


    1.在公司工作 3 年以上，得到不到部门提拔，工作做了很多、但每次晋升无望；


    2.接触不到部门的核心业务，只是做琐碎的工作，长期工作能力得不到提升；


    3.每次公司有好机会新机会，领导会告诉其他人，而自己会被选择性遗忘；


    “被边缘化”的后果肯定是不利的，主要有


    1.接触不到核心信息，资源、做项目的机会变少；'
  merge: -1
  img_proc: true
- pgno: 366
  md: '2.长期不被待见，需要有大量精力来消化内耗；


    3.消耗了宝贵的时间，失去未来可能的机会。


    认识到“被边缘化”的严重性，那我们在日常工作中，如何去避免被边缘化呢？


    1.保持稳定，不要犯低级错误，留下把柄。


    在意识到自己“被边缘化”了，就要开始积极给自己寻找出路。同时，保持稳定。


    包括做事稳定，和情绪稳定。


    做事稳定，指的是日常的工作质量和标准，不能下降，避免出现失误，而被公司开除；（HR 告诉你：公司开除人很少，除非自己作死）'
  merge: -1
  img_proc: true
- pgno: 367
  md: '情绪稳定，是自己的地位在公司还不稳固的时候，不要轻易发脾气，只会给别人留下坏印象。


    # 2.建立自己的分析网络


    “被边缘化”是一个渐进的过程，不太可能是一进入公司第一天就被边缘化，从自己身上找找原因，这是可以改变的方向。


    +   1）站在领导的角度想想、部门的“核心工作”会分配给谁？


    +   2）这个工作的核心能力要求是什么，是需要与人沟通，还是需要文本写作的能力？


    +   3）当前部门领导信任的员工有谁？为什么是他？


    +   4）目前部门的工作目标是什么，工作内容是否稳定？'
  merge: -1
