  md: '# 05. 琳琳


    最近在新单位刚工作一个月，每当换一份工作之后，我总会领悟到一些东西：


    +   局外人理念。其实每份工作就是一局游戏，打的次数多了，输赢不重要，游戏体验比较重要，所以不以物喜，不以己悲，要拥有局外人理念，这样情绪就会稳定很多，遇到糟心的事情和人，完全可以跳脱出来看问题：瞧，这个奇葩，又涨见识了。


    +   做人自私点。长到每段工作经历，短到每个工作任务，其实不用太在意结果，注重自身技能提升就OK啦，不必有太大的责任负担，有时候人常认为这个事情非自己不可，容易夸大自身对公司的影响力，其实战术上重视，战略上藐视即可，自私点，看看这份工作能给你带来什么技能。'
