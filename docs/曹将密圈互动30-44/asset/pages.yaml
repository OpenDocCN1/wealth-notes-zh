  md: '现在也很流行一个说法 “情绪稳定”，但每个人都有权利情绪不稳定。每一次情绪来袭都是一个入口，让我们有机会去深入了解自己的心智模式，最终去发现深处的基本欲望（安全生存、被认可、被爱、控制）。


    今年随着自我觉察的深入以及每日复盘，我发现了自己身上的一些限制性信念，比如以前我会希望有稳定的工作，希望生活有计划、有掌控，希望成为更好的自己，希望事事完美，希望能得到他人的认可，希望自己努力了就能有所不同······


    所以当生活有所变动、自己的期待落空，都会引起自己的情绪波动，而如果自己有一次次全然地接纳，及时看见，并借助健康的食物、大自然的力量、静心冥想或者是音乐等去做调整和释放，那干扰就会越来越少，自己的心理也会更加稳定。'
