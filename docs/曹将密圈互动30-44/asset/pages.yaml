- pgno: 328
  md: '# 05. 凡诺


    工作 3-5 年后，如何找到自己最舒服的状态？


    个人认为工作状态最舒服：自己开心、同事快乐、老板信任。


    +   1.自己开心。找到并激发让自己开心的点会舒服：如工作上有业绩，可以运用公司资源完成项目；又如沟通上有突破，独自与客户沟通取得突破维护了公司权益；再如学习上有收获，学习的理论知识刚好可以解决工作问题，当然很开心。


