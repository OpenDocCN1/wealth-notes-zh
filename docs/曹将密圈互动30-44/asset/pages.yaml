- pgno: 312
  md: '# 01.小彩


    大家好，我是小彩，一个工作了 7-8 年的 HR。


    今天是我的生日，家人相聚后，看到这个话题，特别想来聊聊这个话题。


    我觉得最舒服的状态是 工作上有小成就感，生活上有小幸福感，个人成长上有小满足感。


    +   1. 工作上的小成就感


    工作三五年后，对职场及岗位有了很多自己的认知，会了解自己所在公司及岗位它是有一个怎样的定位及发展空间，可谓越来越懂了。


    那么在看似一成不变的工作，很需要在日常不断收获小成就，小成就感就是你稍微努力一点，就能发生明显改善的事情。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '比如说，摘橘子，你原地伸手摘不到，踮起脚尖就能够得着，这就叫小成就感。


    大多数职场上的成长，不会惊天动地，比如你新员工一进公司就独立搞定一个大项目，反而更多是这种小成就的累积。


    比如你提的建议得到了领导认可，收获了客户的表扬，与同事的沟通配合更顺畅了一些。


    在日常工作中，一点点解决遇到的问题，一点点向目标迈进小碎步，都是职场中的小成就，也是促使我们不断进步的正向激励。不积跬步无以至千里，就是这个道理。


    这种小成就带来的舒适感非常短暂和有限，但从长期来看，每天都能有这样的“小确幸”存在，给人带来的成就感还是挺不错的。'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 2.生活上的幸福感


    工作三五年后，大部分的职场人都有一定积蓄和见识，会有一帮朋友和要好的同事，会在工作的城市有个相对稳定的住所，还会有一些自己的小爱好。


    我工作第五年的时候，从广州回到了离家更近的长沙，在离开广州之前，我跟朋友一起旅游了半个月，从广州出发，去了海南海口、三亚，云南昆明、丽江、大理，然后约着好友一起深圳聚了好几天。


    回到长沙后，没有急着找工作，也是约着好友聚会聚餐。现在回想那段时间真的很美好，很有幸福感。


    现在的生活更加舒服了，在家乡的城市定居，结婚生子，时常与好友相聚，定期家庭旅游，去没到过的城市，看没见过的景色，品尝过的美食。'
