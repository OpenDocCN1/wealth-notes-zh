  md: '# 02. 小彩


    1、什么是工作的本质？


    说到工作，我想起了前段时间看到李诞一句话：【工作的本质是交易，我们在用自己的时间和才能，通过一家公司，与市场交换金钱】。也就是说，我们每天投入 8h、每月
    176h+的时间给公司，公司每月定期回报给我们几千~几万不等的工资，这就是一场明码标价的交易。


    既然是交易，那就跟买东西一样，还是要考虑性价比的。我认为工作不是生活的全部，我现在觉得还是要考虑自己的想要什么，不要为工作做太多「牺牲」。


    2、身边拥有工作幸福感的人'
