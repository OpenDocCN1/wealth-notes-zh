    70%的事情，留下真正核心的 30%同我们沟通，这样效率就极大的提升。最让人佩服的是，她能够很好的协同前后端各部门的伙伴，是一个有自己独立思想的“中间人”，无论是哪方立场，她都能让我们觉得她的出发点都是为我们考虑的，并且总能清晰的定位边界，直到现在很多时候我拿不准的事情，也都会找她咨询寻求一些反馈建议。


