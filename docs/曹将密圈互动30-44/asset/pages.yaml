- pgno: 52
  md: '3. 大局观思想。我们往往总认为成功才能获得幸福感，不可否认，成功确实令人喜悦，但人生不如意事常八九，失败才是常态，升职加薪只是幸运儿的礼物囍，那其他人怎么办？吐槽抱怨不公？奋起直追成为超级加倍卷王？也许成功不止一种定义，“金钱，名利，家庭，健康，快乐，自由”，这些都可以选择组合，看你怎么选择定义了；也许成功没有截止时间，“而立，不惑，...，花甲”，这些时间点虽是岁月的积累，而不应是评判成功与否的标准；也许成功本身没什么值得炫耀赞美的，失败的经历过其实更可贵，当积累失败到一定程度，你会发现内心无比强大。所以当你站在人生的全局来看，小时候那次考试考砸了根本没什么影响，工作一时的得失反而也没有那么重要了。


    所谓的幸福感，其实都是自己给自己的，调整心态，想明白了真的也就无所畏惧，内心平静也'
