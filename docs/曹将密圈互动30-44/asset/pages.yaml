    跟老板沟通，自己带上笔记本电脑肯定显得不合适。我更喜欢带上纸笔，老板有一些反馈或者想法，能够方便我随时记录。我自己给下属做绩效反馈的时候，遇到不带纸笔的伙伴，我都会觉得这是不太重视的表现。


    # 03. 【沟通篇】


