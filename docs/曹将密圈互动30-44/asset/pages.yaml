  md: '# 「曹将和朋友们」2023 年第 31 期密圈互动：


    > “最近三个月，有哪些提升工作幸福感的小技巧？”


    由小助理星雨先开始。


    ——


    +   1. 控制「吐槽欲」。


    尤其针对比较外向的新人，有时候遇到不顺心，或者公司的一些操作流程和环境等问题，喜欢吐吐槽或者发牢骚。


    偶尔针对人，会对某些「奇葩」同事加一些自己的观点。偶尔可以，但不要养成一种习惯，因为「话多」「话密」很有可能不小心掉被有心人记住了，给你挖坑。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '言多必失，尤其是被上级听到了一些他判定为负 面的信息，就会留下极其不好的印象。


    建议，可以找到一个秘密基地，比如我们知识星 球，来抒发自己日常工作中的不顺和情感。


    +   2. 关键节点「留痕」。


    尤其针对新团队或者跨部门协作沟通的时候。


    如果不在工作沟通软件上，留下一些「证据 」或 者说是关键信息，极有可能会出现「甩锅」现象，因 为无迹可寻，就可能出现权力压制，或者经验压制， 比较吃亏的是新人，或者思考单线条的人。


    建议，重点确认型事项，一定要对方回复确认性 文字，汇报类事项一定要有明确的回复性文字，再开 始执行。'
  merge: -1
  img_proc: true
