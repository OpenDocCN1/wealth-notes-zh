- pgno: 1
  md: '# 「曹将和朋友们」2023 年第 30 期密圈互动：


    “工作这些年，感到最值得合作的一位同事是？”


    由小助理星雨先开始。


    最有印象的是一位业务线的财务同事，频繁的业

    务沟通，也使我们成为了不错的朋友。


    +   1. 接受一对一教学。


    刚换岗到新部门的时候，基本态度会偏【舔】一点，尤其是线上聊天会十分的客气。


    针对一些财务流程，很多不熟悉的，都需要问得

    很细节，但这位财务的同事，不仅没有烦我比较低级'
  merge: -1
  img_proc: true
- pgno: 2
  md: '的问题，一一耐心都进行了解答的同时，逻辑十分清晰。


    同时，因为流程很容易记不住，所以导致有些问题会反复询问，但她依然没有表现出生气或不满意的态度，只是会吐槽般的说一句：“这个上次不都告诉过你了么”。


    不仅耐心接受一对一，还接受多次加工，这样一位伙伴，给我留下了非常深刻的印象。


    2. 敢于担责任。


    有些时候，业务其实不复杂，但麻烦在流程上，尤其是大公司，涉及多层级多人员的确认，显得繁琐。


    其中最麻烦的是，明明到了流程节点的财务了，有时候还需要转签或者加签，也就是财务也不知道怎'
  merge: -1
  img_proc: true
- pgno: 3
  md: '么批复，又转给其他业务财务或者是业务领导，导致于过程耗时较长。


    但这位伙伴，财务节点上永远都是以业务为先，有些合理的，只要在线或者方面讲清楚，即使她不是专业的，也会很快批复，同时还会提醒你下次最好是带上 xx 附件，提高审核速度。


    贴近业务，且给与最落地的帮助，这是她岗位职责上的亮点所在。


    3. 快速补位。


    一年间，这位同事暂代了总监一职，除开临时找不到合适的人代替的外，专业够强，对内沟通链路够熟悉，是这位同事能快速补位的核心原因。


    组织迅速拔她补位，她也即时暂代了这个位置，虽然比原来忙碌了许多，但依然针对我反复的一些问


    3'
