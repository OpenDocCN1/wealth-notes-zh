- pgno: 357
  md: '别你和其他同事的关键点，如果在某个方面技能点有出彩的地方，在职场也会很容易出圈，难以被替代。比如隔壁组有个小姐姐，专业能力不错的同时擅长演讲和公众表达，凡有较正式场合，都会被大家推举作为公司代表去做提案或者分享，这种小姐姐应该很难被边缘化。


    练好心态，公司大领导跟团队说过的一句话，受益匪浅，他在给中骨干部培训时告诫大家“不要把自己看得太重要，也不要把自己看得太不重要”。第一句是想告诉大家摆正心态，公司离了谁都能转，不要把自己干的事情当做无可替代、减少傲慢；第二句是想提醒大家重视自身价值，职场拒绝玻璃心，大可不必为了时一味的被忽略，而自怨自艾、期期艾艾，影响自己的战斗力。翻译一下：不需要为了不被边缘化被努力不被边缘化（有点绕，总之就是别太在意这个事情）'
