- pgno: 180
  md: '# 10000 元等于什么？


    # 100000 元等于什么？


    # 1000000 元等于什么？


    针对上面问题，给出你 3 个答案。一开始你会觉得很简单，例如 1 元等于 1 个鸡蛋、1 颗棒棒糖等；10 元等于一趟地铁、一个快递；100 元等于 1 件衬衫、2
    张电影票……到了 1000 元，要想一下，到了 10000 元要动脑筋，到了 100 万也许对不上来，因为没有感知。


    上面问题的回答体现了消费水平，同时消费水平也意味着收入水平。通过对日常商品价格的关注，可以提升对钱的感知。


    还有一个很好的方法，就是像罗罗一样养成记账习惯并统计自己的财务状况，可以每个月或每天手动'
