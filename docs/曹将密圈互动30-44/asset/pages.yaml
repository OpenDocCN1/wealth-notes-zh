- pgno: 161
  md: '但因为意见不合而情绪上头的时候，我还有挺多的。我是如何做的呢？就比如之前针对双十一的策划问题，仓库针对策略的细节不清楚，于是我就对接了一下品牌运营了解情况，跟运营沟通了很久终于确认下来了之后，计划部门的同事说这是他们在统一对接的，并且已经做了很长时间了，其他人不应该绕过他们私自对接，还给我一通吼。我当场立马也火了，我说如果你对接为什么信息从来不同步我们呢？如果你说来对接我还省事了不用问了呢，为什么不告知呢？他说准备这两天就通知呢。我也很气，这件事情那么久了一点动静一个通知都没有，我主动去沟通对接问清楚这不也是我的职责所在吗？后来在火气上我也懒得说了，就挂掉了电话，自己也是气的不行。


