  md: '一度连跃 2 级晋升到了高级主管，虽然当时职级还未达到经理，但是已经成为了一个大仓的负责人。


    # 03. 管理初普中「战略 协作 高情商」


    当我进入从初级管理岗晋升到中层管理的时候，经历了一个坎。我一直觉得只要自己的结果达成的够好，从初级管理晋升到中层管理也就一定没问题，毕竟我已经有了实际的职权。现实是拿结果仅让我获得了面试门票但并未成功晋升。我还记得面试反馈的那个下午，四个领导一起给我一个人做反馈，那是我第一次在领导面前流眼泪，内心十分委屈。总监跟我说，我是一个很好的执行者，相对同职级的伙伴是尖子生，但中层管理更看重战略规划，着眼未来提前布局的能力。


    后来有一次我们总经理跟我聊天，他跟我分析为什么我当时没有成功晋升，问我对标当时成功晋升的人有哪些不足？他告诉我除了天时地利之外还更重要'
  merge: -1
  img_proc: true
