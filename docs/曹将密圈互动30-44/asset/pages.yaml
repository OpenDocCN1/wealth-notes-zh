- pgno: 309
  md: '将占比自己绩效考核最大的业务，作为核心业务。


    以输出一本「培训指南」为目的，将过往经历及经验总结，进行小标题类型的梳理，分门别类、分模块地进行”写书“。


    可采用「飞书」「语雀」「印象笔记」等工具进行整理输出。


    如：以拍摄图片+撰写文案为核心内容，小标题为「如何快速的拍图及写出一条合格文案？」


    针对该问题，过往经验可一一列举，并梳理二级标题「50 分的图片拍摄」「80 分的图片拍摄」「90 分  图片拍摄」「文案脚本撰写 SOP」「文案检查清单」……'
  merge: -1
  img_proc: true
- pgno: 310
  md: '2. 主动求取组织机遇，尝试不同纬度进行业务思考。


    “改变自己最快的方法，就是做你害怕的事情”。


    永远站在一个地方看业务模块，永远都会是一个「点」。


    尝试小地往前迈一步，如同部门不同岗位的业务，尝试「兼职」，跨部门的业务，尝试了解他们周报的撰写逻辑和数据含义。


    当「兼职」觉得不错，主动寻求转岗机会，或是提人效背景下的「加活」。


    或是「主动」承担一些跨部门项目，拉扯自己被迫进入当多线程沟通的背景下，养成「全局思维」，兴许结束后，你能对自己的业务有全新的了解。'
  merge: -1
