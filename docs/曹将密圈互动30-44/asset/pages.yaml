- pgno: 107
  md: '# 01. 罗罗


    过往工作中，我在给下属安排职责外任务的时候，我最关注的 2 个点是解决团队伙伴【接受度】&【合理性】的问题。


    一、如何提升下属对于任务的【接受度】


    +   1 多用“称呼+能不能帮我个忙？”句式


    这是我高中毕业的暑假去麦当劳兼职，跟我們们店长学到的知识。有一次我叫店长李经理，他很认真的告诉我：罗罗，以后直接叫我 LHY，叫我名字不用加职位。这让我立马觉得，我一个兼职学生，跟他是在一个对等的工作关系上而不是上下级，我觉得自己得到了尊重。直到现在，我也一直让我团队的所有伙伴直接叫我名字。另外，当你要跟别人聊天或者说话之前，如果能够先叫出对方的名字再说事情，往往给对方的感受以及接受度会更好（不信可以试试哦）。我'
  merge: -1
  img_proc: true
- pgno: 108
  md: '们麦当劳的店长安排我们做什么工作，从来不是命令式的，他都会说：罗罗，能不能帮我个忙？当我听到这句话，给我的感受是：店长没有把我当外人呀？我竟然也能帮店长的忙呢，心甘情愿的做事情。


    后来我才发现，这其实不是我们店长特有的习惯，而是麦当劳会给不同层级的所有员工，进行标准化的用语以及动作培训。这个事情给我的印象十分深刻，直到我在安排一些职责外的任务的时候，一般也会跟团队伙伴说：XX，能不能帮我个忙呀？得到的经常是肯定的回答，因为【帮我】【能不能】就从一个命令就变成了请求，很少人会拒绝上级给你的小请求。


    # 2 征询意愿不强求


    古语说：强扭的瓜不甜。尤其是职责之外的事情我更正喜欢强迫他人，我一般会提前征询意愿，如果确实没时间承接，那就换其他伙伴，如果是不意愿'
  merge: -1
  img_proc: true
- pgno: 109
  md: '承接，那我也会换其他伙伴。提前考虑清楚每位伙伴的工作任务量，以及通过日常交往可以预判一下意愿度，自己内心会有个排序，一般情况下都不太会拒绝。


    这里我曾经踩过一个坑，18 年我在带训我团队的一位组长的时候，我会教给她很多新东西，我觉得自己很无私的把很多东西都教给她了，希望她能够更快成长，但是我忽略了她内心的诉求，她并不希望短期内有太大的工作压力，因为她要照顾小孩，工作还有生活压力很大她心里十分难以承受，甚至一度考虑要不要离职。我才意识到每个人的诉求是不一样的，能力、意愿、机会，这三者当中都是需要考量的，现在的我会把意愿放在最前面。


    # 二、如何增强任务安排的【合理性】


    +   - 信息公开'
  merge: -1
  img_proc: true
- pgno: 110
  md: '职责外的事情，有时候大家一般都不太会想要承担，也有时候当自己直接安排了某人，做的人可能不开心觉得增加额外工作量，没做的人可能也会不开心，觉得自己不被重视。因此我一般会在群内询问，是否有愿意承接的伙伴，如果有伙伴主动承接，那就是第一顺位，如果没有人愿意承接，我再私下找大家。


    前段时间又个员工直接绕过了他的主管，过来找我投诉他的上级，说组长安排工作不合理，某项工作都安排给了其他人，他也想做但是没有机会，他很想提升自己，但是他擅长的工作都没能轮上他。我单独找他的主管了解了一下情况，发现确实是他直接安排的，但是他没有跟其他员工讲明为什么如此安排，以及未来什么时候轮到其他员工，主管本意是希望利益最大化，但是信息未公开透明，别人就觉得是内幕，组长以及主管都是凭喜好的安排。有的人把额外的工作看作是锻炼的机会，有的人会得是浪费时间，每'
  merge: -1
  img_proc: true
- pgno: 111
  md: '个人的想法不同。虽说没有绝对的公平，但是也需要有个相对公平的渠道，如果没有这个环节，可能大家会觉得这是“内定”好的事情。


    # 选择自由


    我记得之前看过刘润老师的《底层逻辑》讲到 “注射式洗脑” 也给我一些启发，【为什么+观点】的 句式就像一针注射器，比如为什么吃韭菜可以预防癌 症？在其中已经先给我们注射了一针大前提：吃韭菜
    可以预防癌症。这个句式让我们先假定了这件事是成 立的，然后再去找原因。刘润老师说狡猾的人会注射 别人，愚蠢的人会在注射自己，同样当我需要做一件非 做不可的事情，或许还可以增加一种相对友好的解
    法：【为什么+选项】


    我会发现这个方式在管理中还挺好用，说明清楚 事情的背景，并且思考几种选择方案，然后让大家选 择 1 还是 2 或者 3，可能有时候还会收获团队伙伴提'
  merge: -1
  img_proc: true
- pgno: 112
  md: '出的第 4 种方案，不过没关系，前提是这件事有了答案并且也有人能够承接。


    # 3 雨露均沾


    职责外的任务很难说只有一次，往往会有多次，在这个时候，我一般会雨露均沾，轮流【麻烦】大家。如果是一种能力锻炼，每个人都尝试过或者有机会，这样大家都能成长，如果是一种负担，每个人都被麻烦过，大家觉得都被轮到至少公平了。


    叮🔔~作为一个管理者，不仅要考虑意愿并且尊重团队伙伴，同时还需要兼顾公平，我始终相信管理最重要的是管心♡'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 02. 小彩


    大家好，我是小彩，我没有管理下属的经验；但是，我观察了身边一些管理者以后，看到他们有一些不错的做法，分享给大家。


    +   1. 了解为什么会有这个任务，确定任务的重要性和紧急性。


    首先，充分了解为什么需要分配额外任务。分析当前的工作负载以及可能的风险和机遇，以及确定任务的重要性和紧迫性。否则，贸然安排给下属，这可能会导致他们的工作负荷过重，影响他们的工作效率。


    +   2. 评估团队成员能力。


    既然是下属职责之外的事情，就会存在下属不会擅长处理工作。作为管理者需要整体审视团队成员的'
  merge: -1
  img_proc: true
- pgno: 114
  md: '技能、经验和兴趣，以确保找到有意愿，有能力，能够承担承担额外的责任。


    +   3. 与下属面对面沟通。


    在给下属安排职责之外的任务之前，先与他们进行沟通，了解他们的工作负荷和时间表。确保他们有足够能力和资源来完成额外的任务。同时通过沟通，明确你对任务的期待目标，包括任务完成的标准，时间期限及达到预期效果。


    +   4. 给予必要的支持和资源。


    如果下属需要额外的支持或资源来完成任务，作为管理者，你应该提供必要的支持和资源。这可能包括培训、技术支持或人员支持。比如给员工配一个项目组来快速推进工作。


    +   5. 与下属商定执行计划，并监控任务进展进度。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '与下属共同制定一个实际可行的计划，包括分阶段目标、时间表和关键里程碑。这将有助于确保任务按计划进行，避免延误或偏离目标。


    同时，定期检查任务的进展情况，并与团队成员沟通。提供必要的支持和指导，以解决可能出现的问题。当任务出现变化或面临挑战时，灵活调整计划并采取相应的措施。


    +   6. 及时表扬和奖励下属。


    当下属完成这个任务时，你要给予及时的表扬和奖励。比如在加薪，晋升等关键节点考虑下属，这将激励他们继续努力并在未来承担更多责任，也会提高他们的工作满意度和忠诚度。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '以上，就是我从身边同事那观察到的一些做法和建议。


    欢迎大家点赞评论交流～'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 03. 张苏言


    作为管理者，给下属安排职责之外的任务，我遇到过两种情况。


    一种是任务重时间紧，需要对方临时支持一下；一种是我考虑给对方做晋升，升职调薪的考察阶段，我会有意识的给对方安排一些职责之外的任务。


    1、时间紧任务重，临时安排给下属职责之外工作


    在这种情况下，我会考虑 4 个点：


    1）说清楚这件事情的意义。


    告知对方目前团队遇到的情况，为什么需要抽调他协助来支撑。因为明白了事情的意义，对方才能更好的理解这件事情的价值，当对方明白了这件事情的价值后，我认为才会更好的给予支撑。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '2) 尊重对方的时间和能力。


    因为临时安排职责之外的工作，所以我会尊重对方的时间，同时不会安排超过对方能力太多的工作，避免给对方带来太大的工作压力。


    3) 提供必要的支持和指导。


    职责之外的工作，可能对于对方来说，有些流程或者做法并不清楚，所以还得给对方提供必要的支持和指导，比如及时的沟通，了解进度，帮助对方做计划，遇到问题给与支持和建议等。


    4) 表达感激和认可。


    当对方完成这个工作的时候，我会在团队面前，对对方这次的支持表达感激和认可，以此增强对方的工作动力和积极性。


    15'
  merge: -1
  img_proc: true
- pgno: 119
  md: '以上是第一种情况。下面在说说第二种情况。


    +   2、考察对方时安排职责外的工作


    在这种情况下，我会注意下面3点：


    +   1）设定明确的期望。


