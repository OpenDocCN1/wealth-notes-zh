  md: '# 「曹将和朋友们」2023 年第 42 期密圈互动：


    > “下属比领导工作强，作为领导应该怎么办？”


    由小助理星雨先开始。


    1.要保持「上级自信」。


    自己的领导才升职，也很年轻，下面的人包括自己在内，都在各自的业务板块里比较精通，所以也会出现在某些时候感觉「比领导能力强」。


    站在领导的角度，一定不要「休」，要有作为上级的「职级自信」。


    能做到这个位置，一定是被老板看到了专业+管理双项的综合能力，才被提拔的。'
  merge: -1
  img_proc: true
- pgno: 375
  md: '所以，遇到能力强的下属，不要觉得自己能力差或者不服众，要保持对自己实力的自信，自己的综合能力一定是比下属强的，然后合理用权地管理团队。


    越谦卑越不自信，则越会让下属觉得「领导还不如自己，要他干什么」，从而失去领导的威信。


    2.充分调动下属能力，整合为团队能力，同时提高团队能见度。


    好的状况是，下属越强，则团队越强、领导越能有话语权。


    而不是下属自己做自己的，未和领导及其它团队成员形成合力，导致能力强的自己做自己，团队能力稍次的也一直没有什么提升。


    工作能力强的下属，作为领导不是「对抗」而是「使用」。


