- pgno: 43
  md: '把多余的东西扔掉，让办公桌电脑和电脑桌面都整洁清爽，事也会显得少些，找东西也方便。


    3) 学会记录，学会和身边人分享。


    用文字、视频、图片记录工作过程中的“美时美刻”，在这个记录的过程会给你带来不一样的收获，治愈你。就像上周我写了最值得的同事，和她分享时，又翻看了我们之前的一些照片，两个会心一笑，原来我们已经认识这么久了。


    不要把公司当成赚钱的场域，也不要把同事只当成工作伙伴。在公司可以约上几个同事聊聊天，聚聚餐。和同事一起吐槽，交换各自事业部的“八卦”，既能纾解自己工作压力，也能增进同事间感情，何乐而不为呢？'
