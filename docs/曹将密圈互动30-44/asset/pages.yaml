- pgno: 165
  md: '之前工作中我经常会因为别人犯的错而生气，情绪上头就很想发火。后来我发现如果自己在听到一些不好的消息的时候首先是发火的，那未来下属更不敢跟自己坦诚问题了。我开始换了一种心态以及方式去处理：


    ①对于已经解决没有酿成大错的问题，更多的是了解清楚前因后果，以及处理结果，帮助对方在处理的结果上去补充判断还有哪些需要完善的问题，规避未来的错误是关键，发火其实是最无用的。前几个月，我们团队的一个伙伴业务轮岗，负责了新的业务，然后他的考核时效超时了。他一早到办公室跟我说这个问题，然后我问他后续的优化方案是如何的，他发给了我他的改善措施，我问他还有需要补充的吗？他说暂时只想到这些，我又跟他分析了一下原因，从不同的角度补充了一些可以考虑完善的地方。然后他做了一下优化，我告诉他可以先去落实试试'
  merge: -1
