  md: '「曹将和朋友们」 2023 年第 39 期密圈互动：


    > “职场上，想要成长快过同期生，这些事必须要主动”


    由小助理星雨先开始。


    ____


    1. 主动沟通跨部门资源。


    如果不去「要」，一定没有资源。


    这是最近自己最深的感受，「以为」他可能不会答应，「以为」他肯定怕麻烦不会帮忙找人，「以为」……


    然后，不去开口争取一些利益或者资源合力。'
