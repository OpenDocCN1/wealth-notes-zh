  md: '# 02.苏言


    大家好，我是苏言，一名咨询顾问和培训师，下面是我关于这个话题的思考。


    我从两个维度来回答这个问题。


    第一个维度：如何避免被边缘化？


    # 1、主动去建立信任


    在职场中，与上级和同事建立信任非常重要。为了达到这个目标，你可以采取下面 2 个措施：


    +   a. 沟通与合作：与上级和同事保持良好的沟通与合作关系，积极参与团队活动并分享你的想法和观点。通过互相了解，获取领导的信任。


    +   b. 透明与诚实：在涉及利益问题时，保持透明和诚实的态度。多向上级请示汇报，并适时分享你的个'
  merge: -1
  img_proc: true
- pgno: 345
  md: '人生活和想法。展示你的可靠性和诚信度，让上级对你产生好感。


    # 2、展现自己的能力与价值


    避免被边缘化，你需要不断展现出自己的能力和价值。在工作中积极主动地承担责任，展现出你的能力和专业素质。通过承担艰巨的任务并成功完成，获得领导的认可。


    # 3、保持安全与可控


    翻译一下，就是听话，不跟领导争利。


    国有企业和一些大企业，领导对你边缘化，有可能是你锋芒太露，觉得不好管控，所以只好把你边缘化。在组织中保持可控性是避免被边缘化的关键。一方面让上级感受到你的忠诚和服从，同时也会适当地展示自己的弱点和不足、偶尔展示一些影响无伤大雅'
  merge: -1
  img_proc: true
- pgno: 346
  md: '的小缺点、小弱点，这样不仅可以让你上级对对你有更全面的了解，同时也可以让他觉得显得进加真实和可信。


    第二个维度：如果被边缘化了，应该怎么办？


    如果很不幸，你已经被边缘化了，怎么办，给大家几个思路作为参考：


    # 1、与直属领导进行沟通


    与直属领导交流，了解后续的工作安排和职业发展路径。这种职场交流非常正常，有助于你打开困惑之门，明确自己的问题所在，重新找到方向和目标。


    # 2、寻找内心的平衡


    如果你面临被边缘化但不会被裁员的困境，这表示你还可以获得一个较为稳定的收入。在这个阶段，你可以尝试读书和写作，发展自己的兴趣爱好，同时'
  merge: -1
  img_proc: true
- pgno: 347
  md: '积累经验和知识。虽然副业需要长期积累才能取得成功，但现在可以从读书写作开始，逐步培养自己的能力和优势。


