- pgno: 41
  md: '内心的诉求得到满足时，我们自然会感到幸福。工作亦是如此。当我们对于工作的期待和诉求被满足时，我们会获得幸福感。


    那么如何能够提高工作的幸福感呢？我有几点小建议想和大家来分享分享。


    1) 降低对工作的期待。了解我们工作的能够带来什么。


    在现代社会中，工作不像很多人认为工作是能够为我们带来的升职加薪，能够为我们提供发展空间、人脉资源，从而提升个人影响力。高速发展的时代已经过去了，现在发展速度慢了下来了，其实现在，我们现在工作晋升变得越来越难，职业上升的通道越来越狭窄了。现在很多人在失业中，在他们看来，有一份相对稳定的工作就已经是很好了。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '要尽可能地放低对工作的期望，降低期望就等于提升了幸福和满足的阀门。如果工作没有得到认可与晋升，那就算了，因为本来期望就很低：把工作当生活的一部分，如果有幸在工作上晋升获得领导的认同与肯定，那就把这个当成意外之喜。毕竟不如意十之八九，知足常乐嘛。


    2) 定期整理工作空间，把多余的东西扔掉。


    如果你的办公工位到处都是资料文件，电脑屏幕上也的是一堆的文件夹。让人看到觉得压力大。可以每周期清理一下不要用的文件资料，定期销毁。


    我个人的习惯是每周四或者周五整理一下工位的东西，对电脑上的文件按照时间和类别定期整理归档案。当然我会设置一个临时文件夹，并写上每周一清理的提示，这样就不会有负担。


    12


    公众号懒人搜索，懒人专属群分享'
  merge: -1
