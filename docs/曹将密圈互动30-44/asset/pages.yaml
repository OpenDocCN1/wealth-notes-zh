  md: '「曹将和朋友们」2023 年第 43 期密圈互动：


    “和老板 Ion1（老板给我做绩效反馈）的时候，应该做哪些准备？”


    由小助理星雨先开始。


    +   1.一页纸数据。


    亲测必做，老板一定会问到很多专业的业务数据、不是蜻蜓点水的那种，是深挖数据趋势及你的思考。


    往往数据比较多，所以建议拿出一页 A4 打印纸，上面写清楚自己的业务板块，及各板块的核心数据，重点用红色标注出关键数据指标。'
