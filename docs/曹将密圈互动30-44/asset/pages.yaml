  img_proc: true
- pgno: 277
  md: '但现实是，为了项目在复盘时更加有亮点，不再 是做之前雷同的规划，自己想加码额外的跨部门资 源、鼓起勇气去找其他部门同事询问，是否有意向， 或者可以帮忙找找合适的供应商一起加入项目。


    本来一区位被「拒绝」，但实际收获到的是「我 帮你问问」的回复。


    结论：别职想，想了一定不会有，去问去聊，就 有可能争取到意想不到的资源。


    2.主动汇报。


    别以为是你的上级，就理所应当的知道你在做什 么，过程跟进如何。


    但实际上，领导只是大概知道你最近「可能」在 哪些项目里，但实际有无额外工作量，以及有无同时 推进的辅助性项目和辅助性角色。'
