  md: '# 「曹将和朋友们」 2023 年第 32 期密圈互动：


    “你的领导曾经告诉你的，要升职必须做到哪几点？”


    由小助理星雨先开始。


    +   1. 让领导【最近】满意。


    人的脑容量有限，距离现在越近，记得越清楚。


    即使是之前有一些小的黑点，但如果最近的高光时刻比较多，最近的表现很受领导认可，那么「印象中」领导就是对你满意的。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '别小看这一点，很多时候，做了很多基础的工作，即使印象还不错，也可能抵不过最近一段时间的亮眼表现。


    这样，无论是领导自己，还是领导对其他平级领导推介你的时候，都可以用最近的案例加以说明。


    +   2.「积极主动」。


    很简单的四个字，但真的很难做到。


    常见场景：事情推不动，所有事情都是自己做的，从头到尾自己做，从策划到执行再到复盘，跨部门的人不理智解自己，业务难以推动，上面又催得急，自己受到夹气……


    都是自己常遇到的工作场景，所以积极性也愈发被消磨。'
  merge: -1
  img_proc: true
