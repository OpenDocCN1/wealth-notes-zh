  md: '# 04.枳木


    大家好，我是枳木，工作第六年，目前工作职位是公司办公室文员，办公室负责人，典型的职能部门、非业务部门，不直接产生收益，工作日常偶有“被边缘化”的危机意识，结合自己经历，斗胆回答一下此次作业。


    遇到一个问题，先找源头。个人认为，被边缘化的底层原因是【无法给公司或团队提供价值】，此价值可以是实打实的业务贡献，也可以有助于团队发展的“软业绩”。避免被边缘化，即需要放大自身价值，让团队有你没你不


    +   1.练内功。分为“练技能”和“练心态”两个层面。


    练好技能，也是很多人提到的练好软技能。比如公众表达能力、写作能力、PPT 技能、与其他团队的沟通协调能力等等。专业能力之外，这些技能才是区'
