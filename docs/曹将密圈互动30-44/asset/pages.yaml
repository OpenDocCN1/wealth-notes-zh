  md: '# 05. 罗罗


    自认为我是个相对感性的人，也经常会有情绪上头的时候，关于【化解】我把它分成两个部分：化解同别人的情绪，以及化解自己的情绪。关于自己的情绪如何化解，大家都说的十分全面了，我重点分享一下同别人的情绪如何化解。


    场景一：意见不合


    意见不合而产生冲突情绪上头，在工作中其实是十分常见的，无论是协作的同事以及上级，都很经常会产冲突上头。我上大学的时候，我们老师说过一句话：这个世界上其实没有你真正讨厌的人，其实你不是讨厌对方，只是你们的经历以及观念不同了。这句话给我十分深刻的印象，其实直到现在，如果让我说出一个我特别讨厌的人的名字，我真的说不出来，我好像几乎没有十分讨厌谁。'
