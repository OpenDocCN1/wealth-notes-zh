  md: '提前思考准备下月度工作目标计划，把自己提前想到的任务进行罗列，跟老板绩效沟通的时候，进行对标确认，可以邀请老板补充或者删减。这个举动其实很必要，一方面给老板一定的掌控感，另一方面也是自己提前主动思考的一种表现；


    # 3）个人对于工作的思考/卡点梳理


    这是我每个月跟老板绩效沟通最珍惜的珍惜模块，最近几年我深刻的发现，老板之所以成为老板，就是因为思考的高度以及格局是不一样的，因此可以借这沟通的机会，探索挖掘老板对于问题的思考以及建议，能够帮助我少走很多的弯路，并且请教老板问题困难，也能够很大程度上给老板发挥指导工作的空间。


    我上一任老板，是一个很强的思考者，对于问题的思考力以及深度都是我远远不能及的，所以每次沟通我会问很多战略方向的问题，他的一些想法总能给'
