    叮🔔～如果是矛盾冲突，先处理情绪然后问题可能会更容易解决，如果是被别人影响而情绪上头，可以先处理事情，随之情绪可能就没那么强烈了。总之，情绪上来的时候就像自己把大拇指放在自己眼前看，会觉得这个拇指很大很妨碍视线，当自己尝试着放远一臂的距离在看大拇指，好像也就没那么大了。这也是我学到的叫做【放宽一臂的距离】♡'
