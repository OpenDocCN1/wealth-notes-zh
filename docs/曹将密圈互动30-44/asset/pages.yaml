  md: '# 01.罗罗


    星球消失了一个月，终于我又回来了跳跳 补交一

    份迟到的作业，分享一下自己的思考（主打一个虽迟

    但到😉）


    01. 如何面对下属比领导工作强？


    理论出处：看到这个题目，我第一时间想到的

    是十年前，大学学习周三多版本的《管理学》的时

