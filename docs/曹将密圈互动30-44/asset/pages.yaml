  md: '我很多启发。我现在的领导，对于工作的框架思路是很强的，通过我的一些问题反馈，他也能给我很好的指导，让我更容易跟老板目标对齐。


    # 02. 【行动篇】


    +   1）提前一周预约老板下周的时间


    老板工作大都比较忙，我一般会提前一周主动约老板下周的时间，然后钉好日程及会议室，沟通前会再次确认一下是否需要变动，一般如果有变动，老板会提前通知我；


    +   2）数据资料打印


    我每次提前会把内容打印出来，需要标记的重点提前手写标记一下。老板不喜欢听废话，每次我准备的内容有 10 分，真正跟老板汇报去讲的时候，我需要总结提炼为 3-4
