- pgno: 67
  md: '者关注进步。我见过很多能力很强但是脸皮薄的人，往往受点委屈就甩手不干或者负气离职了，这样的话很难在一个地方深耕下去，也会容易失去很多机会。我刚入职场的时候，学习能力也不强，知识的消化吸收十分慢，只给我一周的带训我知道自己根本学不coming，当时就做了一件事，就是到各个仓库遍地拜师傅，跟师傅们搞好关系。回到新仓库当我遇到解决不了的问题就求助师傅们，幸运的是大家也很乐意帮我。


