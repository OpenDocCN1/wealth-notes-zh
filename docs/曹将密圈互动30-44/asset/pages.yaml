  md: '整体战略的理解、通过与业务讨论业务，近距离了解业务情况，懂得站在业务负责人角度思考未来人力配置，这样能让你在业务存在感更强。


    作为HRBP，一定要在所负责的业务板块一定要为业务负责人搞定与他相关的关键事件，建立信任。


    也就是说，通过关键事件的处理：你解决了业务负责人的棘手问题，从而和业务部门建立了信任基础。


    比如说我所在的业务是创新业务，所以我就通过招聘去获取市场上竞对企业的相关信息，及时积极反馈给业务部门并提供人力资源管理方面的专业意见，展现自己作为BP的价值，同时提升在业务中的地位和影响力。'
