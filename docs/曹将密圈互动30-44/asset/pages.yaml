  md: '# 02.Hanson


    大家好，我是Hanson，谈谈我的经验和看法。


    # 一、小工作


    工作三五年之后，对自己本职工作有了深入理解，不会有太大的变化。


    如果你喜欢本职工作，就可以把日常的内容形成SOP、标准化模板，把模式固定，周围同事和你配合，变得固定，那也不会有太大变数，从而获得自己可以掌控的安全感。


    如果要调整新工作，在公司内部积极寻求轮岗或晋升，也是不错的，因为有目标就有动力，时间也不会荒废。


    # 二、小生活'
