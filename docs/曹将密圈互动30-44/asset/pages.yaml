- pgno: 149
  md: '# 03. Hansön


    1. 深呼吸：马上呼吸 3 次，每次超过 30 秒，让自己情绪冷静下来。


    2. 远离现场：如果可能的话，暂时离开冲突中心，找一个安静的地方休息片刻（如茶水间）。帮助自己迅速调整情绪，避免情绪冲动行为。


    3. 寻求支持：找同事或朋友描述自己感受，或寻求他们的帮助。支持和鼓励可以帮助缓解压力和消除负面情绪。


    4. 出汗运动：进行身体活动，例如海边慢跑、游泳，让自己的身体出汗，然后洗个澡好好休息一下，有助于释放紧张情绪，提升心情。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '+   5. 第三者思维：假设生气的那个人不是自己，是第三者，从自己的角度给他建议。用积极的思维方式来看待问题，关注解决方案而非问题本身。


    +   6. 自我反思：事后思考情绪上头的原因，了解自己的情绪触发点，从而更好地管理情绪。例如，我讨厌迟到的人，如果一个人开会迟到，又在会议上不断反驳我，我就会生气。实际上，这是一种先入为主，他迟到可能是出了意外，但因为“迟到”行为，我先后会有想生气的引子。


    +   7. 专注于任务：将注意力集中在当前的任务上，反复问自己：“我通过这件事情，要达到的目标是什么？生气，不是我的目标，工作场合发飙，也不是好的结果”


    +   8. 寻求专业帮助：如果情绪问题持续存在，产生持续内耗，考虑寻求专业心理咨询师或医生的帮助。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '9. 尝试把自己放到更大的视角。我们的地球，只是宇宙中的一个小点点，而我们也只是这个星球上的一个小点点。今天发生的事情，在时间的视角，不会产生任何波澜，可能第二天你就会忘了。在更大的视角、更长的时间上，生气的事情不值一提。


    10. 数息法练习：平时休息时，找个不被打扰的位置，先盘坐 然后观呼吸， 用数息的方法练习一念不生， 吸气呼气的末端是"息"， 就是数这个息， 吸气呼气末端数
    1，再吸气呼气末端数 2，再数 3，…… 数到 10，再数回来 87654321，念头跑了再回到 1，重新数。


    以上 10 个方法，可以依次或多个一起实践，谢谢。'
