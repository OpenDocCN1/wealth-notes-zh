- pgno: 104
  md: '# 「曹操和朋友们」2023 年第 33 期密圈互动：


    > “作为管理者，要给下属安排职责之外的任务，你会怎么做？”


    由小助理星雨先开始。


    ----


    +   1. 优选「心腹」。


    因为私活儿麻烦别人，一般都是会找靠谱的下 属，否则私活儿万一没做好，或者这个下属大嘴巴说 漏了什么，反而不太好。


    优选平时工作能力还不错，且日常关系也还不 错，偶尔聚餐也能聊到一起的人，找他们，往往可能 性会更高，'
  merge: -1
  img_proc: true
- pgno: 105
  md: '从公+私情还不错的层面上，且如果是第一次麻烦他们，往往被拒绝的可能性偏低。


    +   2.  给到一定的「奖励」。


    毕竟是工作职责之外的，往往需要事前说清楚有什么「好处」。


    比如，事成以后请客一顿饭，或者这件额外的事能提高自已的能见度，又或者能拿到某种荣誉等等。


    +   3.  用大领导的权力「强压」。


    如果你担心自己说有点强硬，可以从大领导的口吻来讲。


    比如强调：这个项目是 xx 总亲自带领的全国性项目，s 级项目，所以目前需要额外的人力承担一定的事务。'
