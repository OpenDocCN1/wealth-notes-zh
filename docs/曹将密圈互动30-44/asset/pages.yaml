  md: '# 01. 罗罗


    工作6年，我见过的最值得合作的是M同事，她19年入职的身份是我们仓的计划BP，现在她的工作岗位是我们物流中心的经营分析师，从我仓的协作BP变成了我们物流中心6个大仓运营诊断经营达成的医生。这个话题让我十分想要唠唠她。


    背景情况：


    M同事家是在嘉兴的，之前在我们上海股份公司采购部工作了近10年，后来我们嘉兴园区开始运营，她为了离家近点，就毅然选择离开股份公司回来嘉兴园区工作了。那时候我们的子公司之间不允许人员调动，她也只能清零工龄从新入职到我们电商的物流中心，从一个资深采购转变为物流统计专员，一切都要重新开始。面对“降职降薪”的起点，她从0开始四年连升3级成为了部门的核心骨干，从一个计划专员


    5'
