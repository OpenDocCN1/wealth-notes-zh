  md: '当情绪来了，我们可以在纸上或者备忘录上写下自己的情绪觉察日记。我们可以利用情绪问题管理我们的情绪，从被情绪影响转变为管理情绪。


    以下是情绪觉察日记模版


    01 情绪：我刚才经历了一种什么样的情绪？如何描述它？


