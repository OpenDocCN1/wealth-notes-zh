  md: '尽管在工作中我们会遇到各种人际关系和组织问题，但以专业的方式处理这些问题，避免被情绪和偏见影响决策，才能让我们自己心里舒坦，问心无愧，从而不被人抓住把柄。


    +   2、主动寻求挑战。


