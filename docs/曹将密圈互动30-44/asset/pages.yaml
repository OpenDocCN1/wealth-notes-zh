  md: 'HRBP 跟外部供应商建立友好关系可节约很多时间。比如作为 HRBP 有时候需要组织组织内部活动，如果你有一些长期联系的场地、茶歇等供应商，你就省很多事，更加聚焦在活动核心事项上。甚至，这些人脉即便你离职后依然可以用起来的。


