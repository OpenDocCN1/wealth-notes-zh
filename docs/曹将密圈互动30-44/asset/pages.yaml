- pgno: 40
  md: '说到工作幸福感，我想先说说我的一个同事，因为我在她身上看到了工作幸福的状态。


    她是一个事业部销售管理部门经理，在我入职以来，我能够看到她每天为了完成工作积极沟通，任劳任怨的加班加点，只为响应事业部领导的需求。


    她私底下也会时常研究一些养生小技巧，比如按照节气来喝各种不同的茶水，熬不同的粥，吃不同的保健品。她经常加班，她在工作之余很少时间陪伴孩子，目前重心大部分放在了工作上，妥妥的一个工作狂。


    她在工作中获得了幸福感。她清楚地知道现阶段自己想要的是什么，而工作满足了她想要的需求。


    3、如何能够提高工作的幸福感呢？'
