- pgno: 168
  md: '# 06. 岸左的成长日记


    +   1. 马上中止当前的行为


    人们总是下意识地纠正和指出别人的错误，尤其是当对方已经生气，甚至愤怒表达的时候，已经超出了沟通本身传达信息的范围。


    这个时候，马上停止呼之欲出的下一句话。就停10秒后，你再说话，想必情绪已经比刚才好多了。


    +   2. 试着复述对方讲过的话


    比如刚才你提到……，再加上一句，我认真想了一下。你已经站在对方的角度思考的时候，也在引导对方思考刚才的表达。


    +   3. 拿起水杯去接水'
  merge: -1
  img_proc: true
- pgno: 169
  md: '为什么是这个动作呢？喝水往往是在需要放松的时候，身体做出的调整。尤其是你心里已经积压了负面情绪的时候，说明你此刻还在这个情绪场里，接水就意味着此时身体需要暂时离开一下，喝杯水，看看远处或者绿植，刚才影响你情绪的感受就会提醒你思考是什么原因让你这样的变化。


    总结一下刚才说的三点：


    +   中止当前行为：不稳定的情绪容易做出错误的表达


    +   换位思考：引导自己，也引导对方思考


    +   暂离情绪场：换个环境，身体放松下来，更容易找到背后的原因'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 07. 张成


    工作中难免会和同事或者客户等有分歧，有摩擦，当合作不愉快有情绪时，我一般通过以下方式化解：


    +   1. 暂时保持沉默。因为人的情绪上头后，一些带走明显情绪的话语更容易脱口而出，而这些话可能会严重影响双方的心情和工作的进展，所以当情绪上头想说话时先保持沉默，脑子里过一遍再说，总比事后后悔。


    +   2. 喝水。一般有情绪时，我觉得喝水可以使人心内平静下来，头脑更清醒一点，这样再去解决工作中遇到的问题更加有条理。


    +   3. 转移注意力，增强自己的钝感力。有情绪时，可以将工作暂时搁置，看看自己关注的公众号，搞笑视频或者朋友圈，暂时将烦恼放一边。等稍微放松，平静下来后，更好的保证效率。同时增强自己的钝感力，不要太过在意别人对自己的评价等，相信自己是最好的。'
  merge: -1
