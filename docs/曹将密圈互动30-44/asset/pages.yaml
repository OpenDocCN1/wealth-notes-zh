  md: '# 01. 罗罗


    我算是一个相对幸运的人，在公司 6 年时间晋升了 5 级，期间换了 6 个领导，而且我的团队 6 年时间核心成员 0 流失。回顾我过往的 6 年，我总共把它分成三个不同的阶段，我发现在不同的阶段需要的能力侧重也是不同的，很感恩我遇到的
    6 个领导，总结一下领导们所教给我的。


    # 01. 入职成长期「胆大 心细 脸皮厚」


    在我刚入职的时候，总监来给我们上第一课，在最后答疑的环节，我问了总监一个问题：您之所以做到现在的职位，您觉得其中最重要的是什么？他说：如果想要在物流这个行业做好，必须具备三个特质【胆大、心细、脸皮厚】从此这三个词就像我内心的一记烙印，深刻的印在了我心里。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '胆大是敢为人先、敢做敢当。当时正值我们新园区开仓，大家都很明白这是一件吃苦受累不讨好的事情，都在观望却没人愿意去。公司安排我过去问我的建议，我说可以。我很清楚的知道留在老地方，当时的经理也愿意勉强留下我，虽然安稳但其实已经没有合适的位置了，而且我一个新人根本没有任何竞争优势。新园区是未来的主战场，对我来说不如放手一搏，实在做不下去的时候，我离开就是了。打江山的过程确实很痛苦，也经历过付出很多仍然不被认可的时候，但这或许也是我之后获得很多机会的一个最重要的契机，只是一些付出并没有在当下那一刻兑现。就像我最近才明白的道理：在投资中敢于承受更高波动以及不确定性，才能够有更多的机会获得更高的回报。当时的我并不明白这个道理，只是觉得自己无路可退只能放手一搏的运气罢了。


    心细是能够敏锐细致的观察人或事。我刚开始上任管理第一天，补货组的十几个爷们十分看不起我这'
  merge: -1
  img_proc: true
- pgno: 66
  md: '个刚毕业的小女生，当晚通知加班他们就商量好全员罢工。我当时觉得业务都火烧眉毛了，人家根本不在意，为什么这些人都那么不敬业？第二天我就逐一约谈了那些人，不愿意干的当即就全部开除了。然后我在想：怎样才能让大家愿意做好自己的工作呢？有一天吃饭，我发现一个员工午饭竟然只买一份米饭，然后加点免费的辣椒酱对付一下。我的心咯噔了一下，从此我告诉自己，我要对得起自己的员工，我希望让大家都越来越好，在哪都能挣钱，我希望我能够让大家多挣钱且更开心的挣钱。当我开始关注大家的需求，帮助大家通过正确的方式多挣钱并且认真为团队伙伴解决问题的时候，大家也会开始在意我的考核指标。我意识到只有能够清楚的知道别人的需要，才能够做好自己的管理，因为管人最重要的是【管心】


    那脸皮厚又怎么说呢？用我第一任老板的话说就是我们做物流行业的一定要皮实，才能在这个行业能够很好的做下去。达里奥说，弱者在乎自尊，强'
  merge: -1
