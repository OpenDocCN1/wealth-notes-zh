- pgno: 425
  md: '红色的指标一定是要背下来的，因为不确定到 时候 1on1 的时候是否能携带。


    常见指标数据，绝对值达成，排名，同环比，问题数据及你做了什么来增强现有优势，或你做了什么扭转现在的劣势。


    +   2. 「热血」的未来规划。


    过程中一般会就业务模块进行探讨沟通，结束后领导往往都会留出一个口子，给你抒发情感。


    这个时候，也不必过于真情实感，先坦诚自己的规划，再表达自己的积极主动，不顾一切想要往前冲刺达成的态度即可。


    所以，准备的时候，除了务实的业务规划，还要准备几句「金句」，给领导一种此人未来可期的感觉。'
