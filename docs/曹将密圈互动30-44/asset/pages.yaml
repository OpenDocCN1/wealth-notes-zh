  md: '「曹将和朋友们」2023年第40期密圈互动：


    > “工作3-5年后，如何找到自己最舒服的状态？”


    由小助理星雨先开始。


    ————


    从新人的「自我燃烧」升级到后期的「稳定成长」，同一家公司任职3-5年后，往往会面临「工作内容愈发单一」「团队沟通趋于平淡」「个人成长趋于停滞」等心态上的变化。


    这种「碌碌无为」的工作厌恶型状态，如果不进行主动调节，很容易让自己被迫走上「下坡路」。


    +   1.  压缩成熟经验、“模块化”打包工作能力。


    1


    公众号懒人搜索，懒人专属群分享'
