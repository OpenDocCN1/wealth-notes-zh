  md: '# 01.小彩


    大家好，我是小彩，一个不谩正业 (HR)的简历优化师。看到这个话题，我脑海里想到的是刚进入职场的应届生、刚入职场的应届生、往往不了解、不清楚自己所加入的这家公司是怎样的。


    回想我几年前作为校招生进入第一家公司的情况，那时候也没有什么导师，更多是自己一边摸索一边成长。作为过来人，有以下几个建议想分享给刚进入职场的萌新。


    +   1. 关注行业动态及趋势，快速熟悉公司。


    行业的发展决定了企业的发展高度。可以通过关注行业相关的公众号、行业报告与资讯，了解行业的发展趋势和变化。'
  merge: -1
  img_proc: true
- pgno: 280
  md: '阅读行业相关的新闻和报道，掌握最新的行业市场情况，了解公司目前处于行业的位置及发展可能性。


    了解公司的组织架构、团队成员、产品及服务、企业文化、规章制度、工作环境，理解部门职责和岗位要求，便于快速适应环境及开展工作。


    这个过程中你可以寻求部门同事及 HR 的帮助。这将帮助你更好地适应公司环境，理解岗位职责和工作要求。


    +   2. 积极主动学习。


    在入职后不仅要加快掌握本职工作所需的技能、还要积极主动地学习与你所在行业或领域相关的知识。通过参加培训课程、行业论坛、阅读工作、职'
  merge: -1
  img_proc: true
- pgno: 281
