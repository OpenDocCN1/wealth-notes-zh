    # 特征小结：


    +   1. 靠谱：我们董事长说，「靠谱」是对一个人最高的评价。我想用这个词来形容她，她的靠谱体现在让人很放心，她所经手的每一份数据，不允许有任何一个数字的错误，别人给她的数据她也不是直接用，而是先确认信息的合理性，经常她给出的数据，他的上级甚至总监都不会再校验的。


