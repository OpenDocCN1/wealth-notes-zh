  md: '# ## 03.张苏言


    前面耳东陈老师的答案已经比较全了，我这里做两个小的补充吧：


    1.工作中老板做 one on one 的目的：


    老板跟员工做 one on one，更多的是期望帮助员工了解到自己的工作表现，以促进行员的自我反思和改进，并通过这种谈话，彼此之间建立更深的信任和合作的关系，为后面员工的晋升和职业发展提供帮助。


    一句话总结：工作中老板做 one on one 的目的其实是为了让员工更好的完成工作。


    2.员工做 one on one 的注意事项：'
  merge: -1
  img_proc: true
- pgno: 437
  md: '+   1) 员工应该主动发起，而不是被动的等老板来安排


    前面我们说 1 on 1 的目的是为了帮助员工完成工作。但很多公司的领导其实没有这种绩效反馈的文化，也不知道怎么做。这个时候，作为员工，如果有自我成长的追求，要学会主动发起
    1 on 1 的绩效谈话。最好每个月主动跟自己的领导沟通一次，了解他对你这个月工作的评价和反馈。


    +   2) 准备好问题和需求


    无论是主动发起还是被动接受，当跟老板约好要做 1 on 1 的时候，记得梳理自己近期的工作情况，特别是自己遇到的问题和需求，趁这个机会给老板提出来。如果是老板发起的，很多时候，老板要做很多场
    1 on 1，他并不一定了解得那么清楚，这个时候，你一定要做好充分的准备。'
  merge: -1
  img_proc: true
- pgno: 438
  md: '我跟团队成员做过很多场 1 on 1，我经常会发现一些我原本不知道的情况。而且你准备得越充分，你们聊得问题才可能更深入，这样你获得的资源也会更多。（具体准备可以见耳东陈老师的答案。）


    3）不要忽视负面反馈


    在 1 on 1 的过程中，你可能会面临老板给你的一些负面反馈，而这些问题是你自己在工作中没发现的。（这也是 1 on 1 的意义，帮员工发现不足。）这个时候，千万别过分的去辩护或争论，而应以积极的态度接受反馈，并试图找到解决问题的方法。如果你有任何疑问或需要解释的地方，可以以建设性的方式提出你的观点和想法，但要避免过度争论或情绪化。


    4）不要丧失信心


    虽然有时候，老板的反馈可能会让你感到不安或不确定，但不要缺乏自信。相反，应该以积极的态度'
  merge: -1
  img_proc: true
