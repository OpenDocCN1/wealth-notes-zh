  md: '1，学习就是寻找提供正反馈的工具的过程。以前学习语言更多是通过沉闷呆板的教材或者过度娱乐化的视听影音资料，尝试使用游戏化 APP 后感觉效率和正反馈都很不错，所以，很多时候学习没有结果，不一定是你的问题，而是没有找到合适的工具和方法。


    2，学习就是进行互动关系分类的过程。任何学习都不是个体孤立的行 为，而是一种关系互动、关系分类的过程，在这个过程中，你会和不同的事物互动，也会和不同的人（比如老师、同学、沟通者）互动，这个过程就是内化学习成果的一种途径。


    3，学习就是对知识框架进行迭代更新的过程。不论是语言知识，还是其他知识，从内容上来说都是相似的，或者至少是可以借鉴经验的，区别只在于要将新的信息、知识融入到我们已有的认知框架和信息系统当中，衣食住行、日常生活、场景行为等等，掌握'
