- pgno: 413
  md: '# 09.一丁


    正常的职场，其实不应该存在类似的问题，原因很简单，领导和下属的考核方式是不同的。


    比如技术部门，项目领导的职责是对整个项目负责，既要满足高层的需求，也要能够有实际的价值产出；而下属可能就是开发工程师，负责写代码。


    这个领导如果因为代码写得没自己下属好而觉得心态失衡，这个比得着吗？就算领导代码写得比下属还牛逼，也没有什么意义，那你去做工程师好了，不用去做领导了。


    搞清楚自己的定位、要求，把自己的事情做好，就可以了，术业有专攻，在具体细分领域，下属比领导强，这才是一个正常的团队。'
