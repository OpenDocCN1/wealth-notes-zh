    我自己在工作中就非常容易上头，当我觉得应该有所改变的时候，找了很多方法来调整。现在有了改善，有时候真的分不清是因为遇到事情太多，心态被磨平了，还是真的是方法起到了作用，今天这个话题也让我重新分析了一下。


