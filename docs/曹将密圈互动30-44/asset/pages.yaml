- pgno: 212
  md: '此外，自我赋能也很重要，简单说就是多和自己说积极的话。《早起的奇迹》中有提到自我肯定宣言，之前在看视频号的时候看过一段分享，是妈妈早晨给女儿梳头的时候，她们一起练习自我肯定宣言。我尝试着带着女儿一起试试，虽然她还不太明白这些语句的意思，但是那阶段，她很频繁的会说“我很自信，我可以按自己的想法做。。。。。。”


    我们的每一个行动、每一个想法，都有可能形成一个能量磁场，你越积极吸引的更多是积极的人事物，你的生活事业必定风生水起。


