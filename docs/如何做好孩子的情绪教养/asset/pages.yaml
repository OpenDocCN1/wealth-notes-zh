- pgno: 30
  md: '# # 4. 如何用绘本做情绪教养


    上一讲我们介绍了如何通过一些游戏来教孩子表达、理解和调节情绪。但是情绪真的有很多方面，比如说得意、害羞、尴尬、嫉妒等等，像这些情绪你就会发现，玩图卡好像还是不太够，那这时情绪绘本就派上用场了！


    这一讲呢，我要来说说如何使用绘本来帮孩子表达、理解和调节情绪。


    现在图书市场上，出了很多跟情绪相关的绘本，你都可以好好去利用。因为如果你不通过语言把情绪表述出来，它其实是一个朦胧的状态。但是如果你通过语言表述情绪，会发现它还可以做很多复杂细致的讨论。而孩子在这个讨论的过程中，就在经历情绪和理解情绪，这样的过程对于他在真实生活中的应用，会很有帮助。


    有时候孩子在读绘本的过程中，看着故事人物的经历，他很多哽在心里的结就会得到疗愈。所以，我们跟孩子讨论情绪绘本，是帮助孩子情绪成长的非常好的一个方法。


    那如何用绘本，来加深加广情绪的讨论呢？


    # ## 一、善于运用特别设计的情绪主题绘本


    首先，你就要去选择一些跟情绪有关的绘本。只要是有故事情节的，尤其是贴近孩子生活经验的，都可以成为很好的素材。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '接下来，我要介绍一些情绪相关的绘本。先介绍的这套，叫做“我的感觉”系列，我在“阅读启蒙课”也介绍过。它的内容包括，《我好难过》《我好害怕》《我好生气》《我好嫉妒》等好几本。


    这套书很不错，因为它其实是儿童心理学家写的。所以你会发现，它不是那种文学性的绘本。它基本的结构非常清楚，它会有一个故事主角，然后这个故事主角呢，他发生了一个情况。


    比如说《我好生气》这本，它一开始说：“我好生气，因为有人取笑我；我好生气，因为玩得正高兴，却要停下来整理房间；我好生气，因为终于可以去做游泳，可是却下雨了。”


    所以，它一开始就会告诉你，是哪些情况会导致生气这个情绪，然后在描述了各种情绪的原因之后，它接下来就会跟你说，生气是一种什么样的感受。比如说，生气是一种火辣辣的感觉；生气的时候，我想说难听的话、大叫，或是打人。


    描述完生气之后，它就会进入调节策略。他就會说，生气的时候，可以离开那个让我生气的人；还可以用力吸气，再大口吐出来；或是做我喜欢的事，让自己冷静下来。


    像这一系列的情绪绘本，它基本上是为了教导孩子情绪而特别去设计的。那你跟孩子讲这些绘本的过程中，你可以跟他讨论：“你有没有生气的时候啊，什么时候你会生气呢？对你来说，生气是什么感觉？”'
  merge: -1
  img_proc: true
- pgno: 32
  md: '或者你也可以问问孩子：“生气的时候，你都怎么办呢？”这些绘本对孩子来说，它有很清楚而且明确的教导效果。


    # 二、针对某种情绪，选择专门的绘本


    除了这样的绘本以外，你也可以针对某种特定情绪，去找一些本来跟孩子做讨论。


    比如说你想和孩子讨论生气这个情绪，相关的绘本很多，我介绍的这一本，叫做《我变成一只喷火龙了》。这本书的内容，就是有一只叫做阿古力的恐龙，它每次生气就乱喷火，就伤害别人，后来费尽千辛万苦它终于不喷火了。


    很有趣的是，这个故事讲完之后，我就跟小朋友们说：“好，听完这个故事之后呢，你可不可以告诉我，最后阿古力的火终于熄灭的时候，你觉得它是什么样的心情啊？请你把它画下来，好不好？”结果，小朋友们画出了各式各样的表达。


    我跟你分享一个最特别的表达。


    我问完上面的问题，大部分的孩子都画了阿古力的脸，它又笑、又哭，可是有个孩子画得很不一样，他画了一张海边的景色。


    我就问他说：“为什么阿古力的心情是这样的？”


    他就说：“经过了这一番过程，它的心情就像海浪在拍打，太阳出来了，然后微风吹过来。”'
  merge: -1
  img_proc: true
- pgno: 33
  md: '那个小孩，他把那个心情，变成一篇像诗一样的东西描述出来。你有没有发现，通过这些表达，孩子对于情绪是非常敏锐的。


    讲情绪绘本的时候，除了口语的讨论外，你也可以让孩子画画看“你觉得这个故事主角是什么感受”，然后再针对他画出来的东西，去跟他讨论“为什么你会有这样的感受呢”。你会发现，通过情绪绘本的讨论，可以带来非常丰富有趣的表达。


    # 三、善用解决情绪难题的贴心绘本


    孩子有时候会遇到像亲人过世、宠物死亡等比较难处理的议题，那你就会很难跟他谈这些情绪。


    比如说遇到亲人过世，我们自己往往都处在悲伤中，更不知道应该怎么跟孩子谈。这时，也可以用一些贴心的绘本来帮忙。


    例如这套叫做“我的小小忧伤”系列的绘本，它把孩子会经历的各种很困难的情绪，比如说父母离婚啊、宠物过世啊，或者在学校被朋友拒绝等等，都画进里面。


    这套绘本本身其实是无字书，就是它只有图没有文字。你在跟孩子看图的过程中，图本身就很丰富地传递情绪。你可以带着孩子一起看，然后让他讲讲他觉得当中发生了什么事，故事人物有什么感受，他自己又有什么感受。


    我们在教学过程中就使用这套绘本，发现它很贴近孩子的需求跟困难。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '很多时候，在分享的过程中，幼儿园那些很喧闹的小朋友，整个都安静下来，他们会非常投入到绘本的情绪中。


    看完绘本之后，他们会说出自己曾经经历过什么事，有什么感受。这样的情绪绘本，可以帮助孩子带出很多深层的困难的感受，对他的情绪学习有很大的帮助。


    # ## 四、给爸爸妈妈看的情绪绘本


    最后再跟你介绍一本情绪绘本，《大嗓门妈妈》。老实说，这本绘本我其实是要给爸爸妈妈看的。刚刚那些绘本是教孩子学习情绪，可是我们发现，很多父母其实连自己的情绪都掌控不好。


    你可以试试看，如果随便问一个小孩“妈妈最常有的情绪是什么”，我猜孩子一定会告诉你说“生气”，对不对？因为妈妈这么累，这么辛劳，就是很容易生气。


    可是你知道吗？如果你发现你已经陷入一种经常暴怒或生气的情绪，你可能要自己意识到，这对孩子是一种伤害。还有，我们过度的暴怒，其实是在示范给孩子看说，我这个当爸爸妈妈的人，当我遇到不如意、遇到挫折的时候，就只会发脾气。你看这是不是很不好的情绪教导？


    所以，如果你发现自己已经陷入情绪的困境中，你就要想办法了，你要休息，你要找支持。这是非常重要的，你要冷静下来、沉淀下来，回去看看'
  merge: -1
  img_proc: true
- pgno: 35
  md: '自己发生了什么事，还有很重要的是，为人父母的人，要给自己喘息的空间。


    这本《大嗓门妈妈》，给你看一小段：


    献给天底下正在生气的妈妈。“今天早上，妈妈冲着我大声吼叫，那声音把我震得四分五裂，脑袋飞上了宇宙，身体掉进了海里，翅膀迷失在热带雨林，嘴巴落到了山顶。”


    听到了吗？妈妈的愤怒把孩子整个都震碎了。


    你会发现很多时候我们会以为孩子这么小，跟他发完脾气，反正他也不懂，事情过去就好了。其实不是的，对这个小小的孩子来说，他最亲爱、最依赖的人对他的暴怒，是会让他破碎的。而且，不管你怎么凶他，他并没办法从你身边逃离。


    所以，父母如果经常性地责罚或打骂孩子，孩子就会被迫发展出一些说谎、掩盖、讨好、做表面功夫来应付他的爸爸妈妈等，结果孩子就开始在品性上出现问题，那他原本单纯的心性就被迫失去了。


    别再乱跟孩子生气了。如果你照顾孩子已经累到一种动不动就要发脾气的程度，你一定要稍微停一停，重新调整自己。


    即使过去你打都打了，骂都骂了，你还是可以重新来过的。请先练习先去爱自己、修复自己，让自己快乐起来，然后你才有能力好好去教导你的孩子。'
