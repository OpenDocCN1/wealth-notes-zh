- pgno: 41
  md: '还有对对方来说，天知道你刚刚是怎么叠你的宇宙战舰基地的，他要怎么帮你叠回原来的样子，这是在为难他嘛。


    父母和老师有时候会觉得自己给了一个非常合情合理、很明智的决定跟建议。但事实上对孩子来说，当事人既没有平复情绪，而那个要补偿他的人，也不知道该怎么补偿。


    所以，有时候你要去想，协商这个事情，是不是不要父母帮他做，而是留给孩子自己去做。


    +   - 要怎么教孩子协商呢？


    我们回到刚刚的场景，孩子把积木弄倒了，他就很生气，他表达说“他弄倒了我的积木，我很生气”，接下来你就要和他说“你很生气哦”来同理他。然后你要问说“那你很生气，要怎样才会不生气呢？”


    你让孩子去想，他到底想要怎样。


    我猜如果真的这样做，你会发现，孩子给出来的答案很可能非常出人意料。他要的很可能不是“我要他帮我堆回去”。他说的很可能是“那他要把他的怪兽王卡，给我三张”。


    这个绝对不是你想得到的答案，但是你知道吗，对当事人来说，如果他辛苦堆的积木被撞倒，而他因此真的得到那三张最珍贵的怪兽王卡，我告诉你，他所有的创伤都平复了。也就是说，这个协商的结果，才是当事人真正想要的。所以，解决问题的策略，其实你要让孩子自己去想。'
