    \n# # 发刊词 | 孩子为什么会大哭大闹\n\n你好，欢迎来到我的得到课程《如何做好孩子的情绪教养》。\n\n我是周育如，台湾清华大学幼教系主任，长期从事儿童早期教育研究，我在“得到”开过一个儿童阅读启蒙的课程《如何开发孩子的阅读潜力》。这次呢，我要来跟你谈一个很特别的题目：孩子的情绪教养。\n\
    \n在讨论怎么对孩子进行情绪教养之前，我们先来试想一个场景，相信很多家庭都遇到过类似的情况。\n\n今天孩子放学，你去接他。他说“妈妈，我想喝酸奶”，你轻声地跟他说：“不行哦！快吃晚饭了，我们晚点再喝好吗？”然后，孩子突然就生气了。他大吼大叫地说：“我要喝！我现在就要喝！”当场幼儿园的其他家长和老师小朋友全都看着你，你心想，奇怪了，我又不是不给你喝，就是晚点等吃饱饭再喝，不行吗？你发什么神经啊，当着这么多人的面跟我大吼大叫。然后，你就生气了，“你再吵，再吵就都不要喝”，孩子更加愤怒，边哭边大叫说“我要我要我就是要”。你忍不住要爆炸，天啊！养个孩子到底是想折磨死谁呢！今晚回家我一定叫你爸好好揍你一顿！\n\
    \n孩子很难搞，是吧？！\n\n但我们倒个带，把时间回到今天早上。"
  merge: -1
