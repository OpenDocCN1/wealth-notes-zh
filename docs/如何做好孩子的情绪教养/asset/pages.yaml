- pgno: 42
  md: '好，假设孩子就说“他那三张怪兽王卡要给我”，这时候你要做什么事？


    你就问对方“你把人家积木撞倒啦，你要给他三张怪兽王卡”，对方可能说“什么，不行啊，我只有三张，我才不要给他”。


    这时候你不要仲裁，不要给意见，只要穿针引线就好了。


    那你就问对方说“那可是你把积木撞倒了，你对不起人家哦”，对方的孩子可能就会说“给他三张不行，那这样好了，我给他五张昆虫卡”。


    你听到了吗，他也在协商，两个孩子都在协商。一个孩子是我现在受到伤害，我提出的条件是，我要你三张怪兽王卡，但对方说这个不行，可是我可以接受的是，因为闯了祸，我可以给你五张昆虫卡作为补偿。


    那这个时候对方提出了新的条件，五张昆虫卡，你这时候问孩子说“那他人给你五张昆虫卡好不好”，如果孩子说“好”，好，那就成交了，事情结束了！他们都得到彼此满意的结果。如果孩子说“五张不行啦，八张”，你就问他八张行不行，七张，六张，成交！


    你在做这个事情，很重要的就是教孩子去想，在这个情况下，什么样的东西是我可以接受的补偿。


    这个过程中，孩子要学到并不是我受到伤害就可以漫天要价。有些条件，比如我要打死他，我要 100 万，这根本就得不到。那这个时候孩子就认真去思考，什么才是一个合理的要求，我既可以得到补偿，而且这个补偿是对方给得出来的、合理的，我又可以满意的结果。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '爸妈不要随便出主意，你要做的就是在这个过程中，协助孩子来回地折中跟协商。如果在孩子小的时候，你就帮他学会协商能力，这可是他这一生极其珍贵的能力。


    再一次，当孩子面对冲突场景的时候：


    +   - 你可以问他想要怎样，如果他说得出来，让他们去协商；

    - 如果他说不出来，你可以给建议说，你想不出来，那妈妈想想看，如果这样好不好，如果那样好不好。

    - 然后这个协商的动作，最后还是要由孩子去完成。


    如果一个孩子学会协商，当他上小学的时候，隔壁同学没有经过同意把他的笔拿走，你猜状况会是怎样？


    他才不会那么无聊去跟老师告状，他可能会说"你干嘛拿我的笔，还给我"。


    那拿东西的小朋友如果还他就还他，如果小朋友不还他，他还可以继续讲"你不还我就跟老师讲喔"，他可以威胁他。


    但如果坐隔壁的不是那种好威胁的，他人高马大，还态度蛮横。这个时候这个孩子可以做什么，他可能看一看就说"好啊，借你没关系啦，来啦，我们交个朋友吧"。


    也就是说，如果你的孩子已经掌握了观察和协商的能力，那无论遇到什么情况他都是有能力去应付的，你根本就不用担心。


    所以，当孩子小的时候，他一定有很多机会跟手足争执啊，去幼儿园跟同学争执啊，你不要总是教训他，你反而要把这些争执当成机会拿来教他，教他怎么表达感受，怎么去跟别人协商。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '这种被好好教导过的孩子他会很熟练，他就会知道，面对这样的人，在这样的情况下，我要提出怎么样的条件，或者是我要怎么样去协商，才对我们两个最有利。这是非常重要、一辈子都受用的能力。


    所以如果可以，真的希望你的孩子在年幼的时候，就学到这些重要的能力，这样上了小学、中学之后，他一路可以非常顺利，而不是等到他长大了之后，才重新来学习。


    好，这一讲我们谈到了在真实情境中的应用，所谓养兵千日，用在一时。平时教导的时候功夫要下得深，孩子在真实生活中就会展现出他真正的能力。'
