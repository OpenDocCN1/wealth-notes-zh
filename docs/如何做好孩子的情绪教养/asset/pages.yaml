- pgno: 50
  md: '# 三、青少年后期：教孩子把性和爱连结到一起


    到了青少年后期，他开始性生理发展，但心智还非常的幼稚。你要帮助孩子在开始长大、开始有性欲、开始很冲动的这个时候，去把他的性跟爱这两件事，慢慢地拉在一起。


    你要帮助孩子体会到，绝对不是身体长大、有性冲动，我就可以随便怎么样，因为这个事情是跟我的感情绑在一起的，是跟我未来家庭的建立绑在一起的，甚至是跟我将来为人父母，要教导孩子绑在一起的。


    孩子如果对他的一生，有比较长远的预见，就不会放任自己身体的冲动，反而他会把身体的成长、性，跟爱、跟情感、跟婚姻、跟人生去做连结。经过这样仔细地教导孩子，你会发现他对自己身体的珍惜、情感的成熟度，还有他谈恋爱的时机，都会比较成熟、比较晚，而且比较稳重。


    所以，在青少年后期，你要记得，不要觉得性教育就是学校的生理卫生教育，是老师的事情。其实不是的，这个东西你不教，自然有电视媒体、社会大众、乱七八糟的人帮你教。你不要放弃为人父母的责任。


    当孩子开始发育、开始对感情好奇的时候，你的教导就要开始了。


    比如看电视剧的时候，可以问问女儿，“如果你是女主角，会选谁当你男朋友？为什么？”


    或是看了电影或新闻后，问问你家儿子，“那个男生交了一大堆女朋友，你有什么看法？”'
  merge: -1
  img_proc: true
- pgno: 51
  md: '你可以很轻松但真诚地听听孩子的看法，同时你也可以表达你对他交友和婚姻的看重和期待。甚至，也可以跟孩子分享你在爱情和婚姻中的体会，孩子是会很认真听的。


    在青少年时期，帮助孩子很慎重地去看待自己的情感跟身体，让情感和婚姻的教导在青少年的时候就打下基础，对孩子之后的发展非常的重要。


    # 本讲小结


    孩子进入儿童期跟进入青少年期，你要多听少说，保持沟通的畅通。


    另外，不要忘记你为人父母的职责，要把性教育、爱的教育、情感教育、婚姻教育、生命教育，一起给孩子。当孩子还在你身边的时候，用心、尽力地做到父母保护和教导的职责，这是把真正的祝福带进孩子的人生。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# # 7. 教孩子之前，先学会爱自己


    前面我们讲了很多教导孩子情绪的方法。最后这一讲，我要来讲大人的情绪学习。


    大人自己的情绪学习为什么重要？因为如果父母本身不快乐，自己的情绪处理很不健康，如何期待你能够给孩子一个好的教导。


    但是很多成人，包括我们自己，在成长过程中，也未必有好的父母来引导我们，遇到很多事情，也没有人教我们怎么处理。以至于有一天，当我们为人父母的时候，我们连自己的状况其实都是处理不好的。


    大人的情绪学习，首先，你要先拆掉自己的情绪地雷，然后，你要重新修复并建立你自己。


    # ### 第一步：拆掉情绪地雷


    +   * 你有没有情绪地雷？


    它是你成长过程中累积的一些情绪的节点，也就是你在什么事情上，会特别过不去。


    比如有时候你会发现说，别人讲一句话，你就觉得万箭穿心，受到好大的伤害。但换一个人听到类似的话，却不会有什么特别的反应，那为什么就我反应这么激烈？'
  merge: -1
  img_proc: true
- pgno: 53
  md: '这种让你情绪格外激动的事情，其实就是你的情绪地雷。这个地雷必定事出有因，你要去把它找出来、拆掉它，才能让自己重新获得自由。


    +   怎么把这些情绪的节点找出来呢？


    有一个很简单的方法，就是你可以随身带一个笔记本，如果遇到一件事情让你情绪波动，就立刻把笔记本拿出来，简单记录下来到底是谁？还是发生了什么事情？让你产生这种情绪。


    就这样，简单记录下来，不用评价，不用反省，不用写日记，就是简单写：什么时候，谁，为什么，然后搁置它。过一两天又遇到了什么事情，让你很难过或者很生气，你察觉到了，就再把笔记本拿出来，简单写下是谁，是什么事情，让你有这种感受。


    你试试看，一次一次地记录，只要一两个礼拜，你一定会找出自己的情感模式。而那个地雷，就是这些人、事、时、地物的交集点。比如说，你可能在好几次的记录中发现，啊！原来我每次都是因为这个人惹事，或者是每次遇到某一类的事情，我就受不了，你就会找到自己的情绪反应节点。


    +   我找到这个地雷之后，你就要好好地、勇敢地去面对它。


    如果总是这个人让你痛苦，你可以想一想，可以沟通吗？可以调整吗？还是我干脆就离这个人远一点。或是，如果你发现，自己特别不能被批评，一有人批评你，你就破碎得不得了，你就要好好地回想，为什么我会这样，是成长的过程中有过什么经历吗？还是我的个性需要调整呢？'
  merge: -1
  img_proc: true
- pgno: 54
  md: '有时我们被某个人或某件事给情绪绑架了，但因为没有察觉，就一直任由自己陷在当中。是父母也好，是同事也好，是夫妻的感情也好，当你能够分析清楚、想清楚到底你的人生要什么的时候，你就会找到方法去解决。


    有时候，甚至不解决也是一种解决，但必须是在你想清楚之后，做出的最好的决定。


    # ## 第二步：采取行动改变自己的情绪模式


    找到并拆掉情绪地雷之后，接下来你要做的是，采取行动来改变自己的情绪模式。


    我们知道每一个人的情绪人格大致是稳定的。


    比如说，有些人不管发生什么事，他大致上就是一个快乐的人，有没有这种人？有嘛。可是你一定也会遇到另外一种人，每天一副厌世的样子，也不知道为什么不高兴，有没有这种人？也有嘛。那你是一种什么人呢？


    找到自己情绪人格的水平之后，你会发现我们的情绪会在这个点上下波动，脱不了大概的范围。可是，这水平可不可以调整？其实可以。美国哈佛大学开了一门通识课程，非常地受欢迎，叫做“快乐学”，这门课就在探讨人类为什么会快乐。


    根据大量的研究资料发现，人类所能经历的快乐大概有三种层次。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '第一层最常见，叫做“感官的快乐”，比如说吃好吃的东西，穿漂亮的衣服，出去玩，也就是立即可以享受的快乐。像这种感官的快乐，大家都喜欢，这是很容易得到的快乐。


    第二层次的快乐跟感官的快乐不一样，叫做“幸福的快乐”。就是我要做一个事情，为了达成目标，暂时牺牲眼前的感官享乐，以得到更好的成果。


    比如说，你跟老公刚结婚的时候，夫妻两个爱怎样过日子就怎样过。有一天，你们有小孩了，好日子突然就过完了，再也不能下班去看电影、去喝咖啡了，感官的快乐都没有了。可是当你忙碌了一天累得要死，搞到晚上，孩子终于睡着了。你看着孩子那红红的、熟睡中的小脸，突然觉得，喔，我好幸福喔！


    这种幸福，跟你去喝咖啡、看电影的快乐，是完全不一样的。你得到的是一个更深层更持久的快乐，这就是“幸福的快乐”。


    人类能够经历的第三层次的快乐呢，叫做“意义的快乐”，就是你完成了一个对你的人生来说很重要的意义，它基本上没什么享乐的成分。


    比如说你去当志愿者，去服务弱势穷苦的人，你有没有什么感官享乐和幸福快乐？都没有。可是当你这样无条件的付出，真的帮助了需要帮助的人的时候，你会有一种我的人生有价值有意义的这种快乐。这就是更高层次的快乐。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '你再回头去看，这三个层次的快乐，都是人类可以经历的各种快乐，没有说哪一个层次比较高级、哪个层次比较低级。


    但对于教导孩子来说，我们的确是要帮助他们从感官的享乐往幸福的快乐，甚至是意义的快乐去追求，不能让他只停留在感官的享乐。


    可是我们自己呢？你可以想想看：


    比如说你是一个妈妈，每天被孩子搞得快要抓狂，你就真的可以跟你的老公说“你可不可以一个礼拜，放我一下午的假；你来带孩子，给我一个下午的时间好好休息一下”。你去逛逛街也好，去喝个下午茶也好，或者去做做头发，做任何你想做的事情。


    你会发现这几个小时的修复，可以帮助体会感官的享乐跟满足。当你再重新回来的时候，你又可以重新开始了。


    所以很重要是，想个办法，帮助自己重新找回快乐。不是要你放着孩子不管，但你的生活要重新有个平衡。


    尤其是对父母来说，有了这种快乐能量的增强，你才有心情好好地教养你的孩子。我想对孩子来说一定也想要有快乐的爸妈，而不是整天黏在身旁盯梢又愁苦着脸的爸妈。


    所以，希望你能够懂得帮自己找快乐，懂得适度对孩子放手，也懂得适度让自己放松，去找一个你喜欢做却已经好久没机会做的事情，好好地把它完成，重新把你人生的快乐找回来吧。'
