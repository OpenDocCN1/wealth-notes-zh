- pgno: 47
  md: '少年时期是一个很不好处理的阶段，但这也是孩子情绪学习很重要的一个转折阶段。


    如果你家裏有比较大的孩子，尤其是青春期前期的孩子，父母可能要做好心理准备，就是你一定会经历一个“你一言他九项”的过程。但是你可以换个思路看待这个问题，你一言，他想得出九种方法来顶你，你看，是不是很有创意，很有本事呢！


    还有，孩子多元思考能力开始出来了，他会用各种不成熟的方式，去反驳你的意见。所以你要做的事情不是去跟他生气，而是去支持他的这个发展。


    作为青少年的父母，你的心脏病强大一点，这几年熬过去，你就会发现又好多了。


    如果你的孩子还在青少年前期，你要做的一个事情，就是从现在开始，“少讲道理，不要唠叨”！给他吃，给他生活的照顾，仍然关心他，仍然爱他。但是再说一遍，不要啰嗦，你讲的道理其实他早就知道了。


    你要做的事情叫做“听”，如果你能够学会倾听，你就有办法跟孩子保持沟通；如果你学不会倾听，只想要一直讲，冲突一定来。


    那很多父母说，我有听他讲啊，可是你听听看，听了真是让人火冒三丈。


    其实你在倾听孩子的时候呢，老实说，只要做出倾听的“样子”就好了，并不需要真的把他讲的所有内容都听进去。因为这个时期的孩子说出来的话，根本不成熟。'
