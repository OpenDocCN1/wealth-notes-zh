- pgno: 49
  md: '孩子放学回家，他跑来跟你说“妈，我跟你讲，我们老师怎样怎样怎样，我真想把他给杀了”。


    你呢，该做什么还继续做，但是你要把他说的最后的话，再说一次。


    所以，你就说“真的喔，你要把老师杀啰”。


    孩子就会说“没有啦，当然不是真的杀啊，可是我觉得我们老师，真的怎样怎样，我真的是很气。好啦好啦，妈，我讲完了，我要去做功课了”。


    最后一句是什么，“我要去做功课了”对不对，那你就继续面不改色地说“喔，你要去做功课了”。够了，知道吗，就让他去做功课，孩子没有真的要去杀老师，青少年就是会用这种夸张的方式讲话的。


    当他讲完这一大串话之后，你复述他最后一句话的时候，孩子会觉得，妈妈有在听，妈妈完全理解他的情绪。然后他会把情绪抒发作，把要讲的讲完之后，发现也没有被妈妈骂。他就会心平气和地把今天一整天的怨气吐完之后，开开心心地回房间写功课去了。


    当你每次都这样做的时候，你会发现，孩子总有事情跟你讲，因为你会同理性，而且完全没有威胁性。长期这样保持畅通的沟通管道，孩子万一真的发生事情的时候，你就会知道，你就不会成为那个最后一个才知道的父母。


