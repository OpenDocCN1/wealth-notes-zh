- pgno: 3
  md: '我做亲子教育十几年了，能够和父母们谈情绪教养，或者说，父母们愿意听关于孩子情绪教养的题目，却是近几年才有的事。


    我想可能是因为父母们发现，要把孩子变聪明容易，但要搞定孩子的情绪却没那么简单；也或许，是因为父母们开始对自己的人生有了新的自省，会开始去想，人活着这么辛苦，到底是为了追求什么？那如今我要教养自己的孩子，我到底该带给孩子什么？


    不管是因为什么理由，我都要说，很高兴有机会和你分享这个情绪教养课，这真是亲子教育上一个重要的里程碑！情绪的学习事关孩子一生的幸福，希望整个课程听下来，不只对你的孩子有帮助，也让你有机会重新看见自己的人生！


    好，那我们现在就开始来谈谈孩子的状况。


    在做亲子推广的过程中，我的发现是，困扰很多父母的一个问题是，他的小孩很爱乱生气，有时甚至会一不顺心就大哭大闹、满地打滚。然后我就会问，小孩很爱生气，那你怎么办呢？父母就会说，所以我就被他搞得更生气啊！


    那父母生气又是怎么回事呢？显然我们当父母的，自己在情绪处理上比起小孩也高明不到哪里去！是不是？


    +   怎么会这样呢？


    首先呢，这是因为情绪的生理机制。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '这些年对大脑的研究发现，人类情绪主要并不在高层次的大脑皮质区运作，而是在边缘系统这些比较低层次、比较原始的脑区运作。


    而当情绪主要是在原始脑区运作的时候，造成的一种结果就是，我们人类的情绪运作可能比动物好不到哪里去。也就是说，如果在大脑皮质区运作，一个外界的讯息进来，经过处理，我们其实是经过学习，然后很好地做出回应。可是如果情绪在这种比较低等脑区运作，它就会以一种近似于本能或反射的方式在做回应。


    那么叫做反射？反射就是说，今天我如果拿一个手电筒去照眼睛，我们瞳孔是不是会收缩。那这候你需不需要告诉你的瞳孔说，来，我的眼睛被光照了，收缩一下！不用嘛！它自然就收缩了，所以不经思考它就回应了。


    另外一个情况是，就算你思考，它也不能不回应。就像我拿一个手电筒照眼睛，我也没办法跟瞳孔说，来，用意识去控制它不能收缩，这是做不到的。也就是说，你不用想就直接回应，即使想了也由不得你不回应！


    所以，当情绪是以一种接近于反射，或是本能的方式在做回应的时候，我们在情绪处理上，就出现一个很大的难题，叫做“情绪一来，就淹没了理智”。


    因为你来不及思考再反应，你也很难由意识去掌控它。于是，发生的状况就是，你明明知道我不该生气，可是你就生气了；你明明在知识上知道我应该要怎样回应，你就是做不到。'
