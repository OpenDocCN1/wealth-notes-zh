- pgno: 28
  md: '后来老师跟我说，当天，这个小男生并没有发言，但当其他孩子开始说自己有弟弟妹妹的时候，有多生气，多讨厌，多难过的时候，这个孩子非常专心地在听。


    你知道吗，有时光是听别人悲惨的经验也是一种疗愈。结果这个孩子就发现，原来我不是全天下最悲惨的人，别人竟然比我更惨。然后呢，老师说，这个孩子的表情就开始松动了，他发现，哇！别人有弟弟妹妹的时候，如果多吵一下，还会被爸爸妈妈骂，我的爸爸妈妈实在好太多了。


    等小朋友分享得差不多了，老师接着问了一个非常关键的问题——“当你们因为有弟弟妹妹很难过的时候，你是怎么才能变得不难过的呢？”


    孩子们就开始说，“妈妈照顾弟弟的时候，爸爸陪我玩，我就不难过了”......你看到吗，这就在引导孩子往解决问题的策略上去想了。情绪的表达、理解、调节一网打尽了。


    当日下午，老师也特别问了这个小男生，“你妈妈最近也生了弟弟，你会不会也有点难过？”孩子微微点点头，还有点故作轻松的样子说“还好啦”，然后老师问：“哦，这样了啊，那你怎么样才会不难过呢？”这个孩子想了想，就说：“嗯，妈妈睡觉前不要陪弟弟，陪我说故事，我就不难过了。”这是孩子自己想出的办法。


    然后，当日下午老师立刻打电话给妈妈支招。就这样，孩子纠结了好长一段时间的情绪，就在这个分享的活动之后，顺利地化解了。'
