- pgno: 6
  md: '除了对孩子，在婚姻上也是这样，华人婚姻的特性是所谓的“高稳定、低满意意度”。这跟我们在情绪表达上太弱有关系。


    从小成长的历程中，对于情感的忽视和压力，导致我们在进入真正重要的情感关系时，不管是亲子关系还是夫妻关系，我们往往都在情感这一块处理得很薄弱。因为我们练习的机会少、运作的机会少，不知道如何自我辨识，也不懂得如何辨识他人的情绪。某种程度上可以说，我们的幸福感降低了，所以情绪的影响层面真的很大。


    +   “听到这里，你可能会觉得感同身受，但现实的很多时候，你还是搞不定孩子，也搞不定自己，这可怎么办呢？


    我的这门课，就希望从这两方面帮到你和孩子。


    这门课，我会从以下几个角度来谈情绪教养。


    第一讲，如果把人类的情感模式比喻成浮在海面上的冰山，那么我先带你了解情绪教养冰山下的部分，也就是为孩子的情绪教养打底的部分。这个部分特别重要，如果做不好，后面的情绪教养就会很困难。


    第二讲，我会来讲冰山上面这一块，也就是你要教会孩子具体的“情绪的表达”“情绪的理解”和“情绪的调节”。


    第三讲到第五讲，我会提供实际的方法给你，让你通过玩游戏、读绘本，以及真实事件的处理，真正地教出孩子的情绪能力。'
  merge: -1
