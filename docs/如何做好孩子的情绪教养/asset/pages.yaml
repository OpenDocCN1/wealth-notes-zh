- pgno: 45
  md: '# 6. 青春期孩子的情绪疏导和情感教育


    前面几讲，讲完了幼儿时期的情绪学习，那这一讲我们要来讲，儿童跟青

    少年时期的情绪学习。


    # 一、儿童时期：打好情感根基


    儿童时期，也就是孩子 6～12 岁这个阶段，其实是一个情绪社会化继续延

    伸的过程。


    从幼儿期的晚期，一直到青少年前期的这段儿童时期，孩子开始比较懂事，

    表现比幼儿期更成熟稳定。孩子会去观察周围的人如何互动，他的观察和

    理解能力都会展现出来。


    在这个大概长达五六年的时间里，孩子最重要的观察对象是谁？其实就是

    父母。


    孩子生活在家里，父母如何对待彼此、如何相处，会成为一个不可抹灭的

    印象，成为他内建的互动模式，会影响到他之后的人际相处，甚至是之后

    的婚姻。已经有很多的研究发现，父母的婚姻品质跟孩子之后的婚姻品质

    是会代代相传的。


    所以，再提醒一下，给孩子一对相爱的父母和一个温暖的家庭，始终是非

    常重要的一件事。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '那除了这个情感根基要打稳了之外，其他的例如情绪的表达、情绪的理解，还有情绪调节的策略等，之前教你幼儿时期做的，儿童时期仍然可以继续做。


    而且你会发现，当你陪着儿童期的孩子继续做这些事，品质和深度会不一样，孩子的情绪表述和讨论的能力会比之前更加提升。


    # 二、青少年前期：少说多听 + 重复语尾


    那过了儿童期这个比较稳定的时期之后呢，我们就进入到最棘手的青少年时期，也就是孩子 12~18 岁这个阶段。


    这个时期，很多父母开始发现：啊，当年那个小天使，不知道什么时候突然就消失了，孩子变得很不讲道理，情绪变化多端，难以相处。


    你甚至会发现他们有一些很让人受不了的行为，比如说很爱强辩、以自我中心、故意找碴。


    可是这个行为的背后，并不是他翅膀长硬了，他讨厌你了，或是他变坏了。


    事实上，青少年的变化，很大一个因素，来自于性生理的变化。他体内性荷尔蒙的剧烈变化影响到他大脑的改组，身体的发育，认知的改变，以及情绪人格的发展。


    我有时候就比喻说，青少年期，好像人家里正在装潢施工打扫，然后你跑过去，又希望人家好好招待你，又要对你有礼貌。这是不太可能的要求，因为这正是大脑最忙、身体最忙、功课也最忙的时期。所以，你会发现青'
