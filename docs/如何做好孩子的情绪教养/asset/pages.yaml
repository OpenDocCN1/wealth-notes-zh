- pgno: 8
  md: '# 1. 童年经历构建情绪人格


    心理学或科学家，很喜欢把人类的情感模式比喻成浮在海面上的冰山。


    为什么这样说呢？因为我们自己意识可以察觉的部分，只是海面上那个冰山的一角；在那个冰山下面还有一大块，就是我们本能运作或内建情绪人格的部分，这是我们自己可能也没有察觉或无法察觉的更大一块。


    这一讲，我们就来说说，情绪教养冰山下的那一块。


    在谈孩子的情绪教育的时候，我通常不太说这是“教孩子情绪管理”，我喜欢用情绪教养来谈它。因为教养是个长期的人格内建的历程，而情绪管理只是后来知识上可以去学的，很有限的那部分。


    如果在孩子的情绪教导上，我们只做冰山上 面情绪管理的那一块，却不去管冰山下情绪人格的那一块，你会发现情绪的教导效果非常有限。


    比如说你是一个情绪人格很负面的人，可能会花大钱去上个什么 EQ 课程，上的过程你会觉得太有道理了，我应该怎么怎么改善自己。然后在回家的路上，你就告诉自己说，好，等一下看到老公，我要温柔，我要面带微笑，我要怎样怎样怎样……


    结果呢，回到家一打开门，看到老公把屋子弄得乱七八糟，你就一把火上来，结果什么 EQ 课堂全都丢到海里去了，对不对？


    +   为什么会这样？'
  merge: -1
  img_proc: true
- pgno: 9
  md: '因为如果知识的学习跟你原本的内建人格不一致的时候，你会发现那些学习其实很有限，效果也不好。所以，如果要教导孩子有良好的情绪，其实你要做的事情就是给他打好底子。


    也就是说，如果孩子的情绪人格原本就被建立得非常的健康、非常的正面，那本能就本能，反射就反射，谁怕谁对不对？不管你什么情况下来，我回应都很好啊、很正面啊！


    可是如果孩子原本的情绪人格就很负面，有很多的伤害和破损，那你说我通过一些知识的学习要来改善、来管理，其实就非常的困难。


    # 一、童年时的经验，建构一生的情绪人格


    要谈这个问题，我们接下来看看，这一百年来，关于冰山下面这一块，关于情绪人格的研究，到底有哪些重要的发现。


    谈到情绪人格的研究，就不能不提到弗洛伊德。你可能还有印象，当年在大学心理学课上听过一点弗洛伊德的东西，什么“本我、自我、超我”的有没有。


    弗洛伊德是个精神科医生，他的理论经过了很多年之后，其实很多都已经被后面的研究推翻掉了。


    可是呢，他说对一个很重要的东西，那就是他发现，他所研究的林林总总的精神病患，虽然这些人致病的原因非常多样，但是他们似乎有个共同'
  merge: -1
  img_proc: true
- pgno: 10
  md: '点，就是他们都似乎曾经有过不愉快的童年，或是曾经受虐、父母离异，或是遭遇过非常严重的情感创伤。


    在探讨过这么多精神病患的例子之后，弗洛伊德相信，童年时候的经验正在建构孩子的情感人格，而这个童年时候内建的情感人格，会跟着这个人一辈子。


    在弗洛伊德之后，行为学派兴起。在行为学派时期，教养孩子谈的就是行为奖惩。他表现好你就奖励他，表现不好你就处罚他，那时去谈情绪恐怕是会被嘲笑的。


    后来，直到那个著名的猴子依附实验出来，心理学家发现亲子依附被剥夺的猴子会自残而且无法交配，促使依附理论大大兴起，情绪研究才又重新成为新的显学。


    而依附研究发现，行为学派所诉诸的行为奖惩你拿来训练动物恐怕还管用，可人类的孩子却不能这样教。


    “爱”这个东西，并不是吃饱了穿暖了才额外需要的，爱其实是人类要正常健全发展的一个非常基本的条件，当你把这个条件剥夺了之后，人类就没有办法正常发展了。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 二、被爱的孩子更独立


    好，谈到依附，这里我要提一个概念，叫做“被爱的孩子更独立”。很多父母可能认为孩子独立，就是在孩子小的时候，我就尽量不让他一直跟在我身边，我要训练他独立，最好早一点自己睡觉，早一点自己做事情。


    可是，事实上，依附研究给我们的结果是完全相反的，并不是那些早期跟父母脱离，跟父母疏离的孩子比较独立，反而是早年家庭温暖，跟父母有紧密情感连结的孩子，比较早独立。


    其实，你到游乐场去看看就会发现，有的爸爸妈妈就跟小孩子说，你去玩啊，小孩就说，喔好，然后就跑去玩了。玩一玩之后，就会边溜滑梯边说，“妈妈你看我在这里”，妈妈就说喔，好好好，孩子就又继续玩。可是有的孩子不一样，妈妈说你去玩，他不要，然后就一直黏在妈妈身边。


    这种一直黏在父母身边的孩子，父母可能会觉得“你看，我的孩子多需要我，他跟我多亲啊”，甚至根据这样的行为就判断自己家的依附关系建立得很好。其实完全不是这样！这个孩子为什么紧抓着你不放？有那么诱人的游戏可以玩，他为什么不去？因为他生怕一放手，你就不见了。


    所以，那种紧紧抓着父母，不肯放手不敢去玩的孩子，表示他的依附关系其实是很不安全的。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '你如果有孩子送幼儿园的经验，就知道有的孩子父母一出现，他就会抓着不放，什么事都不做。你不要以为孩子很爱你，孩子是在告诉你“你爱我不够，你给我爱的方式不对”。


    而那种有安全依附的孩子，因为他确信父母不会离开他，所以我放手去玩一下没问题。当孩子心里有一个安全的确信，这种孩子就会比较早地展开探索行为，也比较早独立。


    相反的，那些在依附上不安全的孩子，就整天黏在爸爸妈妈身边，他们探索行为出现得晚，探索行为也比较少，就会直接影响他的智能发展。


    不仅如此，像这些情感需求得不到满足的孩子，很可能将在未来的人生中，不断地在各种关系中，在多样成就的追逐中，去寻求那个心中始终没有被填满的空缺。他的外表和行为虽然独立了，但心理上却一直就没有真正的独立。


    所以，你如果希望孩子早一点在身心方面都能够真正的成熟独立，其实你要给他爱的满足，而不是剥夺他爱的需要。如果有一天，你的孩子可以放手跟你说，“妈妈我去玩啰”，你就会知道你做对了。


    # 三、家庭的温暖对孩子的大脑发育最重要


    然后，我们来谈说最新的，大脑研究的发现。


    +   - 近年来最新的大脑情绪研究，开始在做受虐孩童的研究，为什么要做这个呢？'
  merge: -1
  img_proc: true
- pgno: 13
  md: '其实是这样，科学家发现，有一些受虐的孩子，就是长期被父母打、骂的孩子，当这些孩子从受虐的环境中被救出来，安置到好的家庭之后，给他好的环境，然后送他去上学，但这些孩子被重新安置之后，却普遍发生学习迟缓的现象。他们不只专注力很差，学习能力也很差。


    那为什么会这样？奇怪，这样的孩子受虐是身体受虐啊，他没有被打坏脑袋，为什么身体受虐，脑袋变笨呢，这是什么道理？


    所以，科学家就想要去知道这些孩子的大脑发生什么变化。结果对这些受虐孩子的大脑进行造影，一扫就发现，哇！受虐儿的大脑活化情况跟正常孩子不一样，受虐孩子脑部不活化的情况非常严重。


    +   - 怎么会这样呢？


    科学家因而推测，零到六岁是大脑发展最快速的时期，很可能是当孩子脑部快速发育的时候，这些受虐的孩童因为受虐过程中情绪上承受过高的压力，促使他的大脑里面分泌出过高的压力荷尔蒙，一个叫做皮质醇（cortisol）的荷尔蒙。


    这种压力荷尔蒙过量地分泌导致了孩子快速发展中的脑袋受到了严重的损伤，因而重创了他的注意力和学习能力。


    所以，有些父母会认为孩子不打不成器，我一定要严格要求孩子，但事实上研究的证据却告诉我们，为了学习而逼迫孩子是完全不科学的做法。在大脑发育的重要时期，给孩子情绪上的安全才是最重要的。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '而后续的研究更重要的发现是，孩子自己根本不必受虐，光是“长期目睹父母家暴”，意思就是孩子本身并没有受到任何损伤，但是父母长期感情不好，整天在家里吵架打架，这种家庭气氛很差的孩子，大脑也会出现类似的创伤形态。


    所以，我做公开演讲的时候，常常跟父母们说，如果你真的爱你的孩子，你这辈子可以给孩子第一个而且是最重要的一个礼物，不是拼命送他去上培训班或送去做潜能开发，而是要先给他一对相爱的父母跟一个温暖的家庭。


    如果你和你的另一半感情不好，让孩子长期处于高压的、不愉快的家庭中，其实你就直接在给孩子的脑袋造成创伤，那所有的学习就都不用谈了。


    # 本讲小结


    这一讲我说了那么多心理学家的实验和理论，并不是为了让你记住这些去考试的，而是为了拿科学研究证明给你看，让你知道如果你希望孩子有一个好的发展，你要做的第一件事情是，好好去爱你的另一半，给你的孩子一个健康温暖的家庭，因为童年时期的经历就在建构孩子的大脑回路，建构他的情绪人格。


    冰山下的那一块，情绪人格的建构，其实就在孩子的童年里，就在你身为父母的手中。这是情绪教养最大，也是最重要的前提。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # 2. 从情绪表达、理解到调节


    前一讲我们说了冰山下的一块，也就是情绪人格的打底。这一讲我们接着来讲冰山上这块，也就是我们要来讲情绪能力该怎么教！


    在情绪教养方面，我们给孩子的教育内容大概会分三个方面。第一个是“情绪的表达”，然后是“情绪的理解”，第三个是“情绪的调节”。接下来，我们一个一个来讲。


    # ## 一、情绪表达：口语描述+适当表达


    +   什么叫情绪表达？


    就是孩子把他内在的感受表达出来。但孩子表达的方式有很多，你会发现年幼的孩子，他有情绪的时候会怎样，他不高兴他就哭啊、闹啊、撒泼啊，在地上打滚啊，甚至有些孩子还拿东西丢人、咬人，这都是情绪表达。但这种表达是不合适的，是我们不想要的。


    所以，教导孩情绪表达分为两个层面：第一个层面，是“用语言策略取代肢体策略”；第二个层面，还要教孩子合适地表达自己的情绪。


    先来说“用语言策略取代肢体策略”，说得白话一点就是，“请你用说的，不要用哭的滚的闹的”。你要教孩子把内在的状态，通过他的口语“说出来”。


    当然有的爸爸妈妈可能会说这个我已经在用了，我每次都跟我的孩子说“请你用说的，不用要哭的，用说的妈妈才知道怎么帮助你！”但是你可能要意'
  merge: -1
  img_proc: true
- pgno: 16
  md: '识到你光这样讲是没有用的，重点在于你有没有教过孩子说什么、怎么说呢？


    所以，如果你要教孩子把内在的情绪状态，通过口语精准地表达出来，你平时，再强调一次，是“平时”，而不是等到他正在大发脾气、在满地打滚的时候才做，平时在他有各种情绪状况的时候，你就要先做一件事情，就是教他“先描述情境，再表达感受”。


    比如孩子有状况的时候，你就会“帮他说”：“哦！你收到了生日礼物，现在你很高兴，对不对！”或“哥哥弄倒了你的积木，你很生气，对不对！”然后他就知道，我现在这个感受、这个状况，这个名称叫做“高兴”或者“生气”，而理由是我收到了生日礼物和哥哥很可恶地弄倒了我的积木。


    一次又一次，你先帮他说，其实你就是在给孩子作示范，然后，当事情真的发生的时候，孩子才有能力说得出来“哥哥弄倒了我的积木，我很生气！”你要留意哦，有天孩子没有打人、没有骂人，他还真的把自己的情绪说了出来。


    当他真的这样说的时候，你一定要立刻回应他。然后小孩就会发现，我不用哭不用闹不用滚得满身大汗，我只要靠一张嘴说一句，妈妈就会自动帮我修理哥哥，真是太好了。这样，孩子下次就会愿意再尝试用说的。


    然后，一次又一次，孩子学到了、体会了，你就有机会真的听到，孩子会说“妈妈，你离开我去上班，我好难过。”“爸爸你陪我玩，我好高兴！”孩子就真的学会了把内在感受用口语的方式合宜地表达出来。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '这个是情绪表达教养的第一步：通过口语把他的内在状态传达出来。


    当你把孩子的这个能力教会了之后呢，情绪表达的教导还没有完成哦！你还要再教他情绪表达的第二层，“在适当的时候，面对适当的人，表达适当的情绪。”意思是说刚刚是教他我会表达，把内在的感受表达出来，现在呢，你还要教他更重要的一件事情——“不要乱表达”！


    什么意思呢？我举个例子给你听。


    你有没有遇到那种小孩，他坐公交车的时候，看到有一个人上车，然后呢，他就跟他妈说：“妈，你看，刚上来那个阿姨好胖喔，丑死了！”妈妈压低声音说：“你怎么可以这样讲？”结果小孩还提高音量、理直气壮地说：“那她明明就很胖，我又没有说错！”


    我问你，孩子有没有传达内在状态？有啊。他有没有通过口语精准表达？有啊。问题是，他这样的表达恰不恰当？其实是不恰当的，对不对。


    那这个时候父母要怎么回应？其实，这个时候你就要这样跟孩子讲，“对，那个阿姨是很胖，但是你把它说出来，用这么大声让全车人都听到，你可以告诉我你为什么要这样做吗？妈妈不喜欢你这样做的时候，你心里的那个小小的恶意。”


    我再举一个例子，我自己的儿子小的时候，有阵子很迷变形金刚，然后他生日快到的时候，他外公就打电话来问：“弟弟，你要什么礼物啊？”他挂上电话，超开心地跟我说：“妈妈，外公说要买变形金刚给我！”'
  merge: -1
  img_proc: true
- pgno: 18
  md: '我这一听吓坏了，我爸可能根本搞不懂什么是变形金刚，我猜对他来说变形金刚、原子小金刚、无敌铁金刚可能都差不多，就是某种机器人。万一他到时买来的不是我儿子要的，那可惨了！所以，我就警告我儿子说：“你听清楚，你生日的时候，不管外公买来的是什么，你都要笑着跟外公说谢谢！听到没有？”


    我为什么要这么做，叫孩子说谎吗？当然不是的，我是要让孩子知道，今天你会拿到礼物是因为外公爱你。所以，不管到时你收到的是什么，你都要努力露出笑容，开心地说谢谢，因为这是你在体贴外公的心啊！


    所以，你知道，为什么教孩子情绪的表达不只要教他表达出来就好，更要教他表达的时候要懂得体贴和爱人。


    这个就是情绪表达的第二个层面，也就是我们先要教孩子把自己的状态，诚实地表达出来以外，我们还要教孩子能够学习，在不同的情况下，能够因为人、事、情况，能够适当地、不伤人地，去表达自己的感受。


    这是非常非常重要的学习，孩子要把这两个层面都学习完整了，情绪表达的教导才算完成。


    # 二、情绪理解：了解情绪“是什么”和“为什么”


    情绪教导的第二个层面，叫做“情绪理解”。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '你知道情绪其实是一个很朦胧的感受，假设我眼睛瞪大，脸色泛红，双手握拳，你说我现在是什么感觉？我是生气吗，我激动吗，我兴奋吗，我怎样，你其实很难判断，对不对。


    所以，你会发现，情绪其实是需要被命名的，而能够正确命名的前提是，我必须要知道“我现在到底是什么状态”“我为什么会这样”，这个对“是什么”以及“为什么”的了解就是情绪理解的核心内涵。


    关于这个部分，我在下一讲会直接示范给你看。


    # ### 三、情绪调节：找到让情绪重回正轨的有效策略


    情绪教养的第三个层面，叫做情绪调节。


    +   * 什么叫情绪调节？


    说得白话一点就是，当你心情很不好的时候，你做什么事心情会好过一点？也就是说，情绪调节是“当我有一个很严重的、负向情绪的时候，我可以通过一个简单可行的方法，帮助我自己让我能够回到一个正常的水准”。这个能力非常重要。


    +   * 为什么重要呢？


    这些年，我看到很多孩子为了一点小事就一蹶不振，自己和他人都倍受困扰，甚至有的孩子都读到大学了，考试考不好，或是听到别人的负面评价，他就跑去跳楼。但后来你去看，他那个最后的节点，常常就是当下的那个情绪过不去。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '如果你再回过头去看他成长的历程，往往会发现，在这些孩子成长的历程中，他一直没有学到一个有效帮助自己调节情绪的方法。所以，很多的痛苦累积在他的心里，但是他并不太知道要怎么把它化解掉，点点滴滴的痛苦累积到某一个点，就变成了压死骆驼的最后一根稻草。


    你知道吗？这些孩子往往都是很乖的，如果他平常有情绪就表现出来，你还知道他怎么了，但这些柔顺乖巧的孩子却总是把情绪往心里头累积，等有一天我们发现有害状况，常常都太迟了。


    人生不可能没有挫折，但如果曾经有人教过他，情绪是可以调节的，你是有办法帮助自己的，那这些孩子就有机会把平常那些负面的情绪一次一次化解掉了，很多遗憾也许根本就不会发生。


    说到这里，我要问你，你知不知道对你的小孩来说最有效的情绪调节策略是什么？你的孩子知不知道当他很生气很难过的时候，他可以做些什么事情让自己好过一些呢？


    随着孩子不断长大，他的方法也会改变。比如很小的时候心情不好找妈妈抱抱啊、吃个糖果啊，大一点可能 就是打打球、听音乐啊。不管是什么方法，他至少要知道：当我有一个困难的情绪在这里的时候，即使身边没有人可以帮助我，即使父母不在我的身边，我还是有办法可以帮助我自己的。


    这个能力，我们从小就要教给他，这真的真的非常重要。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 本讲小结


    除了情绪人格的打底以外，在孩子成长的过程中，我们其实可以通过合宜的教导来帮助他学习情绪。


    情绪学习包含了三个部分：


    第一个是情绪表达，先学习通过语言表达内在的状态，再学习如何适当地表达；


    第二个是情绪的理解，了解自己情绪到底是什么状况，它的原因是什么；


    第三个部分，就是学习情绪调节策略。孩子要知道当他有一个很极端的情绪的时候，什么样的方法可以帮助自己调节回来。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 3. 如何用游戏做情绪教养


    前面一讲我介绍了情绪教养要教些什么内容，接下来的三讲，我们要进入实战环节，分别来说说，怎么用游戏、绘本以及在真实情景中帮孩子做好情绪教养。


    这三讲，主要针对 0~6 岁学龄前的孩子。对于这个阶段的孩子来说，玩游戏就是要孩子配合你最好的方法。所以接下来，我要先说怎样用游戏来帮助孩子学习情绪表达、情绪理解和情绪调节。


    # 一、练习情绪表达：照镜子+“我的感觉”游戏


    我们先来看情绪表达。情绪表达有很多方式，最简单的就是通过脸部表情了。


    你要让孩子看脸部的表情，有一个好方法是你带孩子去照镜子，然后和孩子一起对着镜子做出各式各样的表情。例如你可以跟孩子说“来，你看妈妈的脸，这样是‘高兴’！我的眉毛和嘴角上扬，然后眼睛亮亮的，有没有！换你，你也做个开心的脸给妈妈看！”


    就这样，你们可以对着脸做各种表情，然后彼此观察。哦！生气的脸长这样，好可怕！你老是哭，哭着的好难看是不是……然后，如果表情还不够，你还可以加上肢体动作。


    玩够了之后呢，你还可以带着孩子去观察周围的人，看看他们的表情，观察他们的动作，然后猜猜这些人现在是什么情绪。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '像这种观察表情和肢体动作的活动可以让孩子学会察言观色，提高对别人情绪的敏锐程度。


    然后孩子很快会发现，不是所有的情绪都可以用表情或动作表现出来，之后呢，你就可以带着孩子玩情绪图卡的游戏。


    +   怎么玩呢？


    你先找一张白纸，随便什么纸都行，裁成四张图卡的大小，像扑克牌那样就行。然后你在上面画 4 个表情的脸：高兴、生气、难过、害怕。随便画，看得懂就行。然后呢，你和孩子把这些情绪图卡放在桌上，最好是爸爸妈妈爷爷奶奶都一起来玩。


    首先来玩“我的感觉”。


    +   怎么做呢？


    就是先选一张最能代表你现在情绪的图卡，然后你就把它拿起来放在胸前给大家看，说出我觉得怎样，还有为什么。


    比如说你选了高兴的图卡，然后就说“我觉得很高兴，因为今天大宝跟我说‘妈妈我爱你’”。哦，不错吧，那下一个人是爸爸，他选的是生气的图卡，他就说“我觉得很生气，因为今天我被老板说了一顿”。


    通过这样非常简单的活动，孩子就学习到，原来情绪背后是有原因的，而且相同的情绪，很可能由很多不同的原因造成，比如说同样是高兴，大家高兴的事情可能都不一样。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 二、  练习情绪理解：玩“他的感觉”游戏


    不只如此，反过来孩子还会发现，相同的事情，每个人的感受可能都不相

    同，比如同样是看球赛，爸爸可能觉得超好看，妈妈却觉得无聊死了，而

    这个过程孩子就是在学情绪理解了！


    “我的感觉”玩完之后呢，你下一个游戏就可以玩“他的感觉”。


    +   • 什么叫“他的感觉”？


    就是一群人围一圈，顺时针或逆时针都可以，然后去猜你身边这个人他是

    什么情绪。


    比如说我先，假设我是小朋友，我就猜坐在右边的妈妈，我选一张图卡，

    然后就看着妈妈说“我觉得妈妈很生气，因为今天她烫了新发型，爸爸都没

    发现”。


    那妈妈这个时候要做什么事情？妈妈要做的叫做“确认”。假如妈妈真的很

    生气，就要说“喔，你说对了，我真的很生气”。那假如没有很生气呢，妈妈

    就要说“不是哦，没有哦，其实我没有生气，妈妈对爸爸最体谅了”。


    好，那接下来就换妈妈猜隔壁的人，逻辑就是你先猜隔壁人的情绪，然后

    说出你的理由，然后说完了之后呢，当事人就去做确认的动作，看他觉得

    你说对了还是说错了。'
