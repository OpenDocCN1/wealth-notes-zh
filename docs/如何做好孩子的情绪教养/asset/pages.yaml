  md: '好，他讲了，用说的了，但现在可不是假的了，是真实情境了，他也描述情境，也表达感受了，但你会发现这其实是不足的，因为你还没有解决问题。


    这时，最常见的就是爸爸妈妈或老师把两个小孩叫来“来来来，你们两个人都要告诉我刚刚发生了什么事，来，你先说”，说完就说“换你”，两个人就说说说，说完之后爸妈或老师说“好啦，我知道了，你搭积木很辛苦，但你听到没有，他也不是故意的，现在就两个人握握手好朋友哦”。


    我问你，矛盾这么深，我辛辛苦苦搭了快要一个小时的积木，你就冲倒了，谁跟你握握手好朋友，对不对？孩子还是非常生气啊！


    # 二、让孩子自己协商解决问题的方法


    那父母接下来常常怎么处理？“啊，他把你积木弄倒了，这样好了，我叫他帮你把积木堆回来，好不好呢？”


    你知道吗？很多时候，父母老师出的主意，叫做“馊主意”。可是你自己可能觉得很合理啊，发生冲突，先问他发生什么事，然后你告诉他，对方不是故意的啊，我也叫他补偿、叫他陪你堆回去啊，这样处理有什么不对吗？


    但你有没有想过，对这个孩子来说，原本我搭积木是我在玩。结果我辛苦搭完的积木，不只被别人撞倒了，现在妈妈还叫他来一起玩，我到底得到了什么补偿，我的情绪有什么平复，完全没有嘛。'
