  md: '如果你是一个严谨的、用心尽责的父母，我相信这一讲的内容，对你会有帮助。你知道吗？只有你自己活得更好，你才会同时成为更好的父母。


    # # 总结


    课程到这就进入尾声了。


    我们来复习一下孩子情绪教导的重点，你不要只教孩子追求成功，也要让他幸福。


    第一，先给孩子一对相爱的父母和一个温暖的家庭，给孩子好的情绪人格打底；


    第二，通过游戏、绘本等有效的方法，教会孩子情绪表达、情绪理解和情绪调节；


    第三，更重要的是，把你自己的状态调整好，让自己重新快乐明朗起来，有快乐的父母，才会有快乐的孩子哦！


    最后，在课程的结尾，我想再和你分享一个故事。在基督教的《圣经》中有一句话叫做"你用油膏了我的头，使我福杯满溢"。我有一次听一个老师这样分享这句话。


    以前在以色列那边的牧羊人，带了很多羊去放牧，但那些羊很笨还会乱跑，而且有的羊不是在草地上跑，还会跑到旁边有荆棘的地方去，那荆棘就会刺到它的毛里面。羊被刺到就会痛，就会挣扎，结果越挣扎，荆棘就越绞进毛和肉里去。那这时这个牧羊人怎么办呢？他不会直接伸手去拔除荆棘，因为这样小羊会奋力抗拒。所以牧羊人会做一个很特别的事情，就是会在这个羊身上淋上一层膏油。抹上去之后，他只要耐心地等待一下，羊的毛就顺了，很'
