- pgno: 2
  md: '因为公司要开会，你一早就把孩子拎到学校去。到了幼儿园，孩子很开心地想拿他昨天做的手工给你看，但因为你急着走，你就敷衍他说"妈妈下班再看"，就匆匆忙忙走了。孩子失落回到教室，然后呢，老师早上做活动的时候，孩子很努力地想要表现好，但老师就是没有点他发言，活动做完了也没称赞到他。到了下午的自由活动时间，孩子想继续把手工做完，结果刚好另一个孩子边打闹边冲过来，居然把孩子的手工给弄破了。孩子跑去找老师告状，老师说："哎呀，他不是故意的，你是好孩子不要计较，好不好？这没关系，我们要放学了，你明天再做哦！"孩子积了一整天的委屈，但乖巧的他，硬是把这些都给吞了下去，咬着牙一心等亲爱的妈妈来。等呀等，等到望穿秋水，终于等到你来了。见到妈妈，他跟你说了他仅剩的微小的愿望，"妈妈，我想喝酸奶"。然后，你说："不行"......


    你再回想一下，如果那时候，当孩子发脾气的时候，你对孩子情绪能够敏锐一点，你说的是"怎么了，告诉妈妈今天发生了什么事？"


    或者，如果当时你的孩子情绪表达是好一些的，他说的是"妈妈，我今天好难过，我可不可以喝一瓶酸奶？"


    一切都会不一样，是不是？！


    所以，你要做的事情不是去跟他生气，而是去了解孩子的情绪到底是怎么回事，一方面去提升自己理解孩子情绪的能力，一方面也教会孩子情绪表达的能力，这样才能根据孩子的需要真正地去帮助他。


    这就是我说的亲子情绪教养。


    能够谈亲子情绪教养这个题目，在华人社会其实是很不寻常的一件事。


    +   - 这怎么说呢？'
  merge: -1
