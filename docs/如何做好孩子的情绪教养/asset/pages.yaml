- pgno: 7
  md: '第六讲，我要从儿童再向上延伸一点，谈谈青少年的情绪教养。很多父母到了孩子青春期的时候，和孩子冲突对抗到不行，甚至产生一种“你不要以为你青春期，告诉你，我还更年期咧，我跟你拼了！”的感觉。那应该怎么做呢？我会教你一些具体的方法，把孩子这段难搞的时光先熬过去。


    第七讲，我要谈的是大人的情绪修复。终究，有快乐的父母才有快乐的孩子，如果你自己也不是个快乐的人，也常常因为教养孩子或其他事情挫折沮丧发脾气，很希望这一讲对你自己的提升有所帮助。'
