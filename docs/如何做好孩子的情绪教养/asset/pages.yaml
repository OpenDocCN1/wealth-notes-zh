- pgno: 38
  md: '# ## 5. 如何在真实情境做情绪教养


    前面几讲，我教你如何通过简单的情绪图卡游戏和绘本讨论，帮助孩子学习情绪。但是不管怎样，它毕竟还不是真实的情境。


    这一讲，我们来讲真实情境的情绪处理。


    不知道你有没有发现，现在的小孩，不要说是幼儿，甚至已经上一二年级的小学生，上课还会突然举手说“老师，他拿我的笔”。


    老师就看他一眼说“你自己跟他讲”。


    他就跟隔壁的同学说“老师叫你把笔还给我”，隔壁的就说“我不要！”然后呢，这小孩就又举手“老师，他说他不要”，然后等你再给他解决。


    你觉得这很夸张吗？不，这是很常见的场景。不要说是小学低年级，很多孩子到了中高年级，甚至是初高中，遇到各种很简单的互动，他还是不知道怎处理。


    小的时候会告状，大了之后呢就生闷气、装酷，然后人际关系就会出现一大堆问题。那你说这些孩子发生了什么事？其实就是没有人教他，在冲突情境中，可以通过很简单的情绪表达和协商去解决问题。


    接下来我就要来讲，我们怎么教孩子处理人际交往中的冲突。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 一、描述情境，表达感受


    对于 6 岁以前的孩子来说，最重要的情绪问题就来自他和其他小朋友交往时候发生的冲突。


    好，我现在举一个最常见的例子：


    比如说有一个小孩用积木正在盖一个巨大的宇宙战舰基地或城堡之类的大工程。这个小孩好认真地一直搭搭搭，搭了大概四五十分钟。这个时候，有一个冒失鬼突然冲过去，把他刚刚辛苦搭的积木，全部都冲倒了。


    那这个小孩怎样？抓狂了，拿了积木就要往人家身上丢。老师赶快就过来制止：“你不要生气，不要生气啊，怎么了？你说说看啊。”


    那小孩就说“我打死他”，对吧，是不是孩子这个时候就会暴怒，拿了积木要往人家身上丢。


    那如果是你，这个时候要怎么办？


    之前我们不是说，孩子要把内在情绪通过语言表达出来，对不对？那你就跟他说：“好，你不可以用打的，请你用说的，用说的老师或妈妈就知道怎么帮助你。”


    但是呢，他现在很生气，你要他说，说什么呢？还记不记得我在前几讲曾经说过，你平常就要教他怎么说。那我们现在就假设你教过了，他现在可能就会说：“他冲倒了我的积木，我很生气，我要打死他！”'
