  img_proc: true
- pgno: 5
  md: '其次，除了生理机制的设计以外，另外还因为在我们的华人文化里面，事 实上是缺少应有的情绪教育的。


    在我们华人的文化里面，很重视智能的教育、知识的教育，但是我们其实 不太在乎情绪的教育。这导致我们这些为人父母的人，在成长过程中，我 们知道要如何追求成功、追求卓越，却从来没人教过我们，怎么关照好自
    己的情绪。


    然后，到了有一天我们成为父母的时候，我们其实也不知道要怎么去教孩 子情绪。在长期的压抑跟忽略下，我们常常弄不清楚自己真正的情感状态， 也无法掌握怎么样才叫做合宜的情绪。


    在孩子成长的过程中，华人父母也不太关切孩子的感受，比如说孩子受伤 了，我们就会和他说“你不要哭”。孩子做了很棒的事情，还会有人告诫父 母说你不要称赞小孩哦，免得小孩得意忘形、太骄傲了。造成的结果就是
    孩子高兴也不敢高兴、生气也不敢生气、难过也不敢哭。长期来看，其实 是很不健康的。


    我猜很多父母恐怕对自己的情绪也不太清楚，比如说常常有父母看到小孩 跌倒了，心里明明是担心，当场反应却是生气，去骂小孩说“你为什么不好 好走？”甚至还揍他。


    这种状况很明显的是父母的情感表达不当，当场你应该说：“你有没有受 伤啊？”先表达你对孩子的关心，然后再和孩子说“走路要好好走，你如果 受伤会让妈妈很担心”，而不是当场以愤怒的情绪去取代你的焦虑。'
  merge: -1
