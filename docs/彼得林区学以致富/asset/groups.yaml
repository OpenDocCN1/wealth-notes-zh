    # 4 看不見的手


    # 誰是富人，他們如何致富


    每年《富比世》（Forbes）登出美國400大富豪的名單，這主題受商界人士矚目的程度，不下於運動迷喜愛《運動畫刊》（Sports Illustrated）泳裝專輯。這份名單很吸引人，因為它告訴你這些富豪是誰，他們如何致富，從中並可窺見美國長期以來的演變。


    當《富比世》1982年首度刊登這份名單時，榜首是船運大亨陸得維格（Donald K. Ludwig）；其後是蓋帝（J. Paul Getty），他靠著老方法致富——繼承。前十大富豪中有五位是韓特（Hunt）家族的成員，他們在德州到處鑽洞，發現大量石油；這令我們想起億萬富翁蓋帝的名言：想要出人頭地就得早起、勤奮工作、發現油礦。


    這份最早的富豪名單裡有來自洛克斐勒家族、杜邦家族的成員，還有一位來自佛利克（Frick）家族，一位惠特尼（Whitney）、兩位美隆（Mellon）——都是可追溯至19世紀的有錢家族。「繼承」兩字出現在簡介欄的次數不下65次，而除了65位繼承人外，至少還有12名兒子或女兒在家族企業占據重要職位。'
  - '[PAGE 221]


    1993年的名單上已不像1980年代有那麼多舊富豪家族成員了，這讓我們得到兩點有關美國財富的結論：第一，要守住財富並不容易，即使是億萬富豪也是如此。遺產稅會吃掉任何從上一代傳給下一代鉅額財富的一大塊。除非繼承人做好謹慎、明智的投資，否則他們虧損龐大財富的速度可能像祖先當初賺錢的速度一樣快。


    第二，美國仍然是機會的國度，聰明的年輕人像微軟的蓋茲可以登上富比世富豪名單，超越洛克斐勒家族、蓋帝家族和卡內基家族。


    1993年的名單上超越蓋茲的只有巴菲特，他靠著聰明的選股賺進他的100億美元。巴菲特是歷史上第一位成為美國首富的選股人。


    巴菲特遵守一個簡單的策略：沒有花招、不騙人、不玩弄市場，只是買進好公司的股票，並抱住它們，直到讓人感到很無聊。但成果卻一點也不無聊：如果你跟著巴菲特從四十年投資生涯的開頭投資1萬美元，到今日價值將達到8,000萬美元。大多數獲利來自你聽過、而且可以自己買進的公司股票，例如可口可樂、吉列（Gillette）和華盛頓郵報（Washington
    Post）。如果你有天開始懷疑擁有股票是否明智，只要再看一次巴菲特的績效就能讓你堅定信心。


    如果把杜邦家族算成一個人，1993年的美國400大富豪只有43人是靠繼承致富。我們看到昔日大亨的子孫較少上榜了，取而代之的是更多白手起家，靠著自己努力、運氣和好點子攀上財富高峰。赫爾姆斯利（Harry
    Helmsley）是黎歐娜（Leona Helmsley）的丈夫，也是多家族館的老闆，他從房地產公司的收發室職員展開他的職涯；音樂鉅子葛芬（David Geffen）原本在莫里斯經紀公司（William'
  - '[PAGE 222]


    Morris）當工友；把麥當勞擴建成速食王國的柯洛克（Ray Kroc）從牛奶攪拌機的推銷員起家；沃爾瑪創辦人華頓（Sam Walton）最早是JC潘尼百貨（J.C.
    Penny）的訓練員；裴洛（H. Ross Perot）曾是IBM的銷售員。此外還有贈品兌換券大王卡爾森（Curtis Leroy Carlson），他是瑞典移民雜貨店老闆之子，曾把他的送報路線發包給兄弟賺取微薄的差價；也曾為賣鹹賣肥皂，每月賺110美元。後來貸款50美元創立黃金債券贈品兌換券公司（Gold
    Bond Trading Stamp Company）。


    多得出乎意料的中輟生擠上400大富豪排行榜，排在最前面的長い？軟科技神童蓋茲，他離開哈佛，專心設計軟體，他發明的作業系統現在安裝在世上絕大多數的個人電腦上。


    還有柯寇瑞安（Kirk Kerkorian），他是亞美尼亞移民果農之子，高中沒唸完就離開學校了；前面提到的唱片製作人葛芬是大學中輟生；艾倫（Paul Allen）與蓋茲共同創辦微軟，他從華盛頓州立大學休學；透納傳播（Turner
    Broadcasting）的創辦人透納（Ted Turner）被布朗大學退學，但後來回去念研究所；甲骨文電腦的艾里森（Lawrence J. Ellison）是伊利諾大學的中輟生；梅多克（David
    Howard Murdock）靠房地產和企業併購致富，他是推銷員之子和高中中輟生；辛普洛特（John Richard Simplot）賣炸薯條用的馬鈴薯給麥當勞，他從八年級就離家並輟學，找到一份篩選馬鈴薯和餵豬的工作；惠仁嘉（Harry
    Wayne Huizenga）也是大學中輟生，他用一輛破舊的老卡車創立廢棄物管理公司（Waste Management），到31歲時已是全世界最大的垃圾處理業者。然後他把注意力轉向一家達拉斯的錄影帶店，將其打造成百視達公司（Blockbuster
    Video）。'
  - '[PAGE 223]


    別學這些人從學校輟學。在他們開創事業的年代，還有可能不需要大學教育就能找到不錯的工作——在今天這幾乎不可能。還有，他們每個人都精通必需的基本技術，才能在事業上出人頭地。他們退學不是為了逃避工件，而是為了開創一家公司，或追求他們的興趣。


    今日要賺進10億美元的方法有百百種：汽車零件、單柄水龍頭、黃頁、咖啡奶精、塑膠杯、翻修輪胎、塑膠工業廢棄物、快速苗條（Slim-Fast）、平恩高爾夫俱樂部（Ping
    Golf Clubs）、高風險汽車保險、免稅商店、嘉年華遊輪、披薩加盟連鎖店（達美樂〔Domino''s〕和小凱薩〔Little Caesar〕）和租車代理。名單上甚至還有律師，靠打醫療賠償官司致富。


    有些帶進億萬財富的創意在是地下室孕育的，或從小鎮的商店開始，靠極少的預算發跡。電腦巨人惠普的第一批產品是以價值538美元的電子零件在帕卡德的車庫組裝成的；沃爾瑪源自阿肯色州新港一家五美分商店，後來因為房東不續租而在班頓維爾（Bentonville）重新開張；安麗（Amway）從一個地下室發跡，狄弗斯（Richard
    Marvin De Vos）和安德爾（Jay Van Andel）以他們向底特律一位化學家買的配方，在那裡製造可生物分解的肥皂。


    這群坐擁龐大財富的人當中，只有31人靠房地產致富、18人靠石油發跡，所以蓋帝的座右銘用在今日已不如以往適用。有幾位億萬富豪（例如史華伯〔Charles Schwab〕）藉開創證券經紀公司和共同基金公司致富；另有約30人因有線電視和媒體業而致富；至少有20人從事電子和電腦業。'
  - '[PAGE 224]


    1982年至今最大的改變是400大富豪的財富規模。在當年，只要財富1億美元就可登上排名，如今至少要3億美元才能勉強擠進榜尾。在排名前端，有25人的淨值超過20億美元，而在1982年超過20億美元的只有5個人。


    費滋傑羅（F. Scott Fitzgerald）曾寫過，富人「與你我不同」，但你從富比世名單上無法證實這種說法。名單上有各式各樣的富人——矮的、胖的、高的、帥的、醜的、智商高的、智商不怎麼高的、愛花錢的、吝嗇的、儉約的、大方的。你會驚訝有這麼多人在發財後還保持節儉的舊習慣。沃爾瑪的億萬富豪華頓在1992年逝世，他只要拿出一點零頭就能買下一整隊大禮車，但他繼續開著一輛破舊的雪佛蘭，駕駛盤上還有狗咬的痕跡。他可以搬到巴黎、倫敦、羅馬和其他《富豪名人生活》（Lifestyles
    of the Rich and Famous）的拍攝地點，但他和妻子仍住在阿肯色州班頓維爾老家——只有兩間臥室的屋子。


    巴菲特是另一個沒有讓財務成功阻止他住在家鄉內布拉斯加州奧馬哈的富豪，他至今仍享受看好書、打橋牌的單純快樂。快捷半導體創辦人暨英特爾（Intel）共同創辦人摩爾（Gordon
    Earle Moore）每天開著他的老舊小貨卡到辦公室。有許多白手起家的百萬富翁和億萬富豪仍過著樸素的生活，避免出名，即使他們無須為支付帳單煩惱，卻仍然每天辛勤工作。「過著平靜的生活」和「避開媒體」是經常用來描述富比世400大富豪的詞句。


    這些人仍做著讓他們致富的事，而我們可以從中學到寶貴的一課：尋找你真正喜歡做的事，然後全力以赴，錢自然就會跟著你。到最'
  - '[PAGE 225]


    後，你的成就終於讓你可以後半輩子躺在游泳池畔喝飲料，但你很可能不會這麼做。你會因為太過享受在辦公室的樂趣，而不願停止工作。


    # 可口可樂是如何發跡的


    上帝不是有天往下看世界，說「要有可口可樂」，然後就有了可口可樂。造物者和可口可樂沒有半點關係，除非你認為祂在創造彭伯頓博士（Dr. John Styth Pemberton）時就想到可口可樂。彭伯頓1869年從喬治亞州哥倫比亞市遷到亞特蘭大，他在年紀大到足以吸引聽眾時就開始賣成藥了。


    這是在美國有廣告法和食品藥物管理局（FDA）可監管人們吃或喝的產品之前的事。所以當然沒有人能阻止彭伯頓摻一大堆原料（其中一項主要原料是酒精）在家裡的浴缸，然後把他的配方裝在瓶中，當成萬靈丹賣給大眾。


    彭伯頓的產品包括印地安女王染髮劑、染料、肝病藥丸，和一種異國風味的混合成分——包括糖、水、古柯葉的萃取物、可樂果和咖啡因。標籤上寫著這是一種「補腦藥、能治療各種神經痛」的藥水，且彭伯頓在他的推銷中宣稱，這藥水能醫治頭痛、歇斯底里和憂鬱症，並讓顧客感到精神愉悅。這就是原始的可口可樂。


    彭伯頓在第一年花了73.96美元打廣告，但他只賣出50美元的可樂糖漿，所以消費者其實並不相信他的推銷詞。五年後，消費者還是不要不買，而彭伯頓已厭倦於說服他們。所以他把配方、設備、古柯葉和可樂果賣給亞特蘭大的藥劑師坎德勒（Asa
    Candler）。坎德勒花'
  - '[PAGE 226]


    了2,300美元買下所有東西。


    坎德勒是個教徒，他寧可說實話而不像彭伯頓那樣天花亂墜。他把古柯葉從配方中去除，所以到了1905年，可口可樂已完全不含古柯鹼。他做對了這件事，因為在1914年古柯鹼被禁用後，人們可能因為喝可樂而被送進牢裡。修改過的可樂配方是美國保守得最嚴密的秘密，至今仍安全地存放在喬治亞信託公司（Trust
    Company of Georgia）的地窖裡。


    坎德勒也改變標示，刪除「補腦藥」、「能治療神經痛」以及其他可疑的宣傳。1916 年，他發明了曲線瓶，至今世界上大部分人一看就馬上能辨認那是可口可樂。


    在坎德勒的工廠裡，可樂果、糖、水、咖啡因——加上他自己的一些秘密成分——在一個巨大的鍋爐裡煮，用巨大的木漿攪拌，直到它們變濃稠成為糖漿。這些糖漿被送到藥店，由藥劑師添加會起泡泡的蘇打水，成了給坐在櫃檯前的人喝的可樂。喝可樂變得如此受歡迎，以致於藥劑師必須請幫手——稱為「蘇打販賣員」（soda
    jerk）——專門倒糖漿和加氣泡水。這成了美國各地成千上萬名青少年放學後打工賺錢的方法。


    1916年，國會對企業課徵新稅，坎德勒十分生氣。為了避免從他的可樂獲利支付更高的稅，他以2,500萬美元，把公司賣給亞特蘭大的銀行家厄尼斯特·伍德魯夫（Ernest
    Woodruff）。他的兒子羅伯特·伍德魯夫（Robert Woodruff）當上可口可樂總裁。


    伍德魯夫買下公司後不久，可口可樂公司便公開上市。1919年，他'
  - '[PAGE 227]


    們以每股40美元賣出100萬股。這是一檔很多人後悔買下的股票，尤其是在糖漿的成本大幅飆漲後。氣憤的裝瓶廠工人抗議價格上漲，揚言要取消與公司的合約。訴訟案接踵而來，可口可樂的銷售下降，公司在破產邊緣躊躇而行。


    拜羅伯特大幅削減成本所賜，可口可樂又撐過一段時間，直到大蕭條來臨。這對大多數公司來說是一段可怕的時期，但對可口可樂卻十分有利。雖然人們只有一點錢可花，而且許多人不買新鞋子、新衣服等東西，但他們還是繼續喝可樂。


    有個很有用的建議可以給投資人：要像一隻尋血獵犬那樣，不理會其他東西，而專注於鼻子嗅到的證據。經濟在1930年代惡劣到極點，但由於可口可樂很賺錢，股價從1932年的20美元漲到1937年的160美元。想像當你週遭的人都預測世界末日即將到來時，你的投資卻翻漲了八倍。


    羅伯特管理可口可樂公司三十年，他極力躲避記者，儘量避免名字出現在報紙上。他有好幾棟房子，而且至少有一座大牧場；但除此之外，以億萬富豪的標準來說，他過著相當儉約的生活。顯然他從來不閱讀書籍，也很少聽音樂或看畫展，除非畫裡有野鴨或鹿在裡面。他會舉辦宴會，但只在逼不得已時才舉辦。


    可口可樂不但從大蕭條這場災難獲益，另一場災難——第二次世界大戰——也讓它大發利市。全世界的人都看到美國大兵喝可口可樂，他們決定仿效這些英雄。美國大兵是商業廣告史上最有效的免費廣告贊助人。'
  - '[PAGE 228]


    經過二戰後，可口可樂變成第一家真正的跨國公司。可口可樂華麗的紅色看板在世界六大洲的牆壁和建築上都看得到——有時它們被用來裝飾建築上的孔洞。可口可樂變成美國生活方式的象徵，這也是俄羅斯的共產黨恨它的原因。（在1970年代，俄國領導人和百事可樂簽合約！）美國的飛彈瞄準俄國，俄國飛彈也瞄準美國，不只如此，他們還擔心被一種軟性飲料入侵。法國的共產黨甚至嘗試禁止可口可樂。


    要得到擁有可口可樂股票的所有好處，你必須耐心等候二十年，直到1958年股價再度大躍進。在1958年價值5,000美元的可口可樂股票，到1972年的價值將近10萬美元。人生中沒有多少機會可以在十四年間把5,000美元變成10萬美元，除非你贏了彩券或做什麼違法的勾當。


    在1972年的崩盤中，可口可樂與其他股票一起受害，很快跌掉63%，直到三年後才漲回來。再一次的，耐心獲得報酬，股價再度飛漲，可口可樂把1984年時的5,000美元變成1994年的5萬美元。


    在共產主義和可口可樂之間的戰爭中，可口可樂獲得全面勝利。因為當共產主義破產後，可口可樂仍然生意興隆。結果證明，它最大的威脅不是俄國人，而是百事公司。


    回想在1930年代，可口可樂原本可以用極低的價格買下在破產邊緣掙扎的百事，但它沒這麼做。五十年後，百事再度成為可口可樂的威脅。1984年，百事在美國市場的銷售超越可口可樂，可口可樂總部的主管被迫反擊。在雙方激烈戰鬥中，他們發明了健怡可樂，從此改變了軟性飲料業，並為人類的腰圍減輕了數百萬磅的重量。如'
  - '[PAGE 229]


    果沒有來自百事的競爭壓力，可口可樂可能永遠不會想到健怡可樂。


    伍德魯夫的時代在1950年代中期結束，羅伯特·伍德魯夫退休後以捐獻他賺得的錢打發時間。他捐出數億美元給醫療中心、藝術中心和埃默里大學（Emory University），他還捐出在亞特蘭大興建疾病防治中心（Center
    for Disease Control and Prevention）的用地。他對亞特蘭大藝術聯盟中心慷慨解囊，雖然他從不喜歡參觀博物館或聽交響樂。他的捐獻有許多是匿名捐出，但大家猜想是伍德魯夫捐的——否則在亞特蘭大有誰那麼有錢、又如此慷慨？他們稱他為「無名氏先生」。


    高茲耶達（Roberto Goizueta）在1981年接掌可口可樂，並擔任董事長。他和可口可樂前任總裁齊歐（Don Keough）變成最佳拍檔，他們推動國際銷售，讓195個國家的人喝可口可樂像喝水一樣普遍。


    高茲耶達本身就是個傳奇故事。他來自古巴一個富農家族，許多財產在卡斯楚的革命中被沒收。他在古巴為可口可樂工作，卡斯楚掌權後他被調派到巴哈馬的可口可樂辦公室。然後他從那裡再調至亞特蘭大可口可樂總部，並一路晉升到公司最高主管。


    可口可樂在世界各地受歡迎的情況似乎沒有止境，但華爾街經過好久的時間才發現這一點。部分「專家」到現在還無動於衷。


    # 籌牌如何崛起


    瑞格理（William Wrigley Jr.）1891年離開費城到芝加哥，在他父親'
  md: '

    有點不公平。華爾街方圓50哩內沒有一隻熊，除非你把紐約動物園的熊算在內，而且熊不會像股票在熊市那樣直線下墜。把熊市改稱為旅鼠市（lemming market）還比較有道理，用來形容投資人跟隨別人一起拋售股票十分恰當。


    「爸爸熊市」（Papa Bear market）從1929年開始，我們在前面已討論過。在1973-1974年的「媽媽熊市」（Momma Bear market），股票平均下跌50%。1982年還有一年熊市，接著是1987年的崩盤，道瓊指數在幾個月內下跌超過1,000點，其中包括在一天內跌掉的508點。1990年有「海珊熊」（Saddam
    Hussein bear），投資人因擔心波斯灣戰爭而大賣股票。但這些晚近的熊市都比1929年和1973-1974年的大熊市容易應付得多。


    持久的熊市可以測試每個人的耐心，混淆沒有經驗的投資人。不管你多擅長選股，你的股票都會下跌，而每次你以為底部已經出現，它們都會再往下跌。如果你持有共同基金的股票也無法倖免，因為共同基金股票也會下跌，其命運取決於基金的持股。


    在1929年高點買股票的人（幸好只有少數人），必須等待二十五年股價才會回升到當時的水準。想像你的股票虧損二十五年！從1973-1974年崩盤之前的1969年高點算起，股價過了十二年才又回到相同水準。也許我們再也不會看到像1929年那麼嚴重的空頭市場——也就是大蕭條之前的崩盤。但我們不能輕忽像1973-1974年的空頭市場再度來臨，這波空頭後股價回升的時間也長到小孩從進小學直到高中畢業。


    投資人無法避開修正和空頭市場，就像北方人無法避開暴風雪一樣。在持有股票的五十年間，你可能經歷25次修正，其中8次或9次會演變成空頭市場。


    如果能事先獲得警訊那該有多好，這樣你就能在空頭市場來臨前賣出股票和共同基金，把資金留待股票變便宜後再買進。問題是，沒人想出預測空頭市場的方法。預測空頭市場的準確度，和預測衰退不相上下。偶爾有人會正確預測空頭市場來臨，然後在一夕之間聲名大噪——名叫葛莎雷莉（Elaine
    Garzarelli）的分析師就因預測1987年的崩盤而出名。但你絕不會聽到有人連續料中兩個空頭市場。你聽到的只是成群的「專家」喊著「熊來了」，卻看不到熊的蹤影。


    既然我們都習於採取行動保護自己免於暴風雪和颶風侵襲，所以嘗試採取行動保護自己免於空頭市場之害也很自然，儘管這時像童子軍那樣做準備反而有害無益。投資人因嘗試預測修正所導致的虧損，遠超過修正本身帶來的損失。


    投資股票的大忌之一是頻繁進出股票或股票共同基金，期待避開修正的來臨。另一個錯誤是，在你投資股票前坐擁現金等待即將來臨的修正。人們往往因為嘗試預測市場時機以逃避空頭市場，而錯失把握多頭市場的機會。


    回顧1954年的標準普爾500指數，就可看出在股票大躍進的短暫時期沒有抱緊股票的代價有多高。如果你過去四十年間隨時把錢投入股票，你的年投資報酬率將達到11.5％。但如果你在四十年間的40個獲利最佳月份不投入股票，你的投資報酬率將跌到2.7％。


    我們在前面解釋過這些，但這值得再說一次。以下是另一個明顯的統計數字。從1970年開始，如果你幸運地每年都投資2,000美元在市場的高點，你的年報酬率是8.5%。如果估算市場時機很完美，把每年的2,000美元投資在市場低點，你的年報酬率是10.1%。所以最好和最差的市場時機預測，其差別僅有1.6個百分點。


    當然，你喜歡很幸運，能多賺1.6個百分點；但即使你沒算準市場時機，報酬率也還不錯，只要你繼續投資股市。買進好公司的股票，不管市場好壞都抱緊它們。


    空頭市場的問題有個簡單的解決辦法。擬訂一個買進股票或股票共同基金的時間表，每個月固定投資一小筆錢，或每四個月、每六個月投資一次。這會省掉你操心多頭或空頭市場的問題。


    ## 4 看不見的手


    ### 誰是富人，他們如何致富


    每年《富比世》（Forbes）登出美國400大富豪的名單，這主題受商界人士矚目的程度，不下於運動迷喜愛《運動畫刊》（Sports Illustrated）泳裝專輯。這份名單很吸引人，因為它告訴你這些富豪是誰，他們如何致富，從中並可窺見美國長期以來的演變。


    當《富比世》1982年首度刊登這份名單時，榜首是船運大亨陸得維格（Donald K. Ludwig）；其後是蓋帝（J. Paul Getty），他靠著老方法致富——繼承。前十大富豪中有五位是韓特（Hunt）家族的成員，他們在德州到處鑽洞，發現大量石油；這令我們想起億萬富翁蓋帝的名言：想要出人頭地就得早起、勤奮工作、發現油礦。


    這份最早的富豪名單裡有來自洛克斐勒家族、杜邦家族的成員，還有一位來自佛利克（Frick）家族，一位惠特尼（Whitney）、兩位美隆（Mellon）——都是可追溯至19世紀的有錢家族。「繼承」兩字出現在簡介欄的次數不下65次，而除了65位繼承人外，至少還有12名兒子或女兒在家族企業占據重要職位。


    1993年的名單上已不像1980年代有那麼多舊富豪家族成員了，這讓我們得到兩點有關美國財富的結論：第一，要守住財富並不容易，即使是億萬富豪也是如此。遺產稅會吃掉任何從上一代傳給下一代鉅額財富的一大塊。除非繼承人做好謹慎、明智的投資，否則他們虧損龐大財富的速度可能像祖先當初賺錢的速度一樣快。


    第二，美國仍然是機會的國度，聰明的年輕人像微軟的蓋茲可以登上富比世富豪名單，超越洛克斐勒家族、蓋帝家族和卡內基家族。


    1993年的名單上超越蓋茲的只有巴菲特，他靠著聰明的選股賺進他的100億美元。巴菲特是歷史上第一位成為美國首富的選股人。


    巴菲特遵守一個簡單的策略：沒有花招、不騙人、不玩弄市場，只是買進好公司的股票，並抱住它們，直到讓人感到很無聊。但成果卻一點也不無聊：如果你跟著巴菲特從四十年投資生涯的開頭投資1萬美元，到今日價值將達到8,000萬美元。大多數獲利來自你聽過、而且可以自己買進的公司股票，例如可口可樂、吉列（Gillette）和華盛頓郵報（Washington
    Post）。如果你有天開始懷疑擁有股票是否明智，只要再看一次巴菲特的績效就能讓你堅定信心。


    如果把杜邦家族算成一個人，1993年的美國400大富豪只有43人是靠繼承致富。我們看到昔日大亨的子孫較少上榜了，取而代之的是更多白手起家，靠著自己努力、運氣和好點子攀上財富高峰。赫爾姆斯利（Harry
    Helmsley）是黎歐娜（Leona Helmsley）的丈夫，也是多家族館的老闆，他從房地產公司的收發室職員展開他的職涯；音樂鉅子葛芬（David Geffen）原本在莫里斯經紀公司（William
    Morris）當工友；把麥當勞擴建成速食王國的柯洛克（Ray Kroc）從牛奶攪拌機的推銷員起家；沃爾瑪創辦人華頓（Sam Walton）最早是JC潘尼百貨（J.C.
    Penny）的訓練員；裴洛（H. Ross Perot）曾是IBM的銷售員。此外還有贈品兌換券大王卡爾森（Curtis Leroy Carlson），他是瑞典移民雜貨店老闆之子，曾把他的送報路線發包給兄弟賺取微薄的差價；也曾為賣鹹賣肥皂，每月賺110美元。後來貸款50美元創立黃金債券贈品兌換券公司（Gold
    Bond Trading Stamp Company）。


    多得出乎意料的中輟生擠上400大富豪排行榜，排在最前面的軟科技神童蓋茲，他離開哈佛，專心設計軟體，他發明的作業系統現在安裝在世上絕大多數的個人電腦上。


    還有柯寇瑞安（Kirk Kerkorian），他是亞美尼亞移民果農之子，高中沒唸完就離開學校了；前面提到的唱片製作人葛芬是大學中輟生；艾倫（Paul Allen）與蓋茲共同創辦微軟，他從華盛頓州立大學休學；透納傳播（Turner
    Broadcasting）的創辦人透納（Ted Turner）被布朗大學退學，但後來回去念研究所；甲骨文電腦的艾里森（Lawrence J. Ellison）是伊利諾大學的中輟生；梅多克（David
    Howard Murdock）靠房地產和企業併購致富，他是推銷員之子和高中中輟生；辛普洛特（John Richard Simplot）賣炸薯條用的馬鈴薯給麥當勞，他從八年級就離家並輟學，找到一份篩選馬鈴薯和餵豬的工作；惠仁嘉（Harry
    Wayne Huizenga）也是大學中輟生，他用一輛破舊的老卡車創立廢棄物管理公司（Waste Management），到31歲時已是全世界最大的垃圾處理業者。然後他把注意力轉向一家達拉斯的錄影帶店，將其打造成百視達公司（Blockbuster
    Video）。


    別學這些人從學校輟學。在他們開創事業的年代，還有可能不需要大學教育就能找到不錯的工作——在今天這幾乎不可能。還有，他們每個人都精通必需的基本技術，才能在事業上出人頭地。他們退學不是為了逃避工件，而是為了開創一家公司，或追求他們的興趣。


    今日要賺進10億美元的方法有百百種：汽車零件、單柄水龍頭、黃頁、咖啡奶精、塑膠杯、翻修輪胎、塑膠工業廢棄物、快速苗條（Slim-Fast）、平恩高爾夫俱樂部（Ping
    Golf Clubs）、高風險汽車保險、免稅商店、嘉年華遊輪、披薩加盟連鎖店（達美樂〔Domino''s〕和小凱薩〔Little Caesar〕）和租車代理。名單上甚至還有律師，靠打醫療賠償官司致富。


    有些帶進億萬財富的創意是在地下室孕育的，或從小鎮的商店開始，靠極少的預算發跡。電腦巨人惠普的第一批產品是以價值538美元的電子零件在帕卡德的車庫組裝成的；沃爾瑪源自阿肯色州新港一家五美分商店，後來因為房東不續租而在班頓維爾（Bentonville）重新開張；安麗（Amway）從一個地下室發跡，狄弗斯（Richard
    Marvin De Vos）和安德爾（Jay Van Andel）以他們向底特律一位化學家買的配方，在那裡製造可生物分解的肥皂。


    這群坐擁龐大財富的人當中，只有31人靠房地產致富、18人靠石油發跡，所以蓋帝的座右銘用在今日已不如以往適用。有幾位億萬富豪（例如史華伯〔Charles Schwab〕）藉開創證券經紀公司和共同基金公司致富；另有約30人因有線電視和媒體業而致富；至少有20人從事電子和電腦業。


    1982年至今最大的改變是400大富豪的財富規模。在當年，只要財富1億美元就可登上排名，如今至少要3億美元才能勉強擠進榜尾。在排名前端，有25人的淨值超過20億美元，而在1982年超過20億美元的只有5個人。


    費滋傑羅（F. Scott Fitzgerald）曾寫過，富人「與你我不同」，但你從富比世名單上無法證實這種說法。名單上有各式各樣的富人——矮的、胖的、高的、帥的、醜的、智商高的、智商不怎麼高的、愛花錢的、吝嗇的、儉約的、大方的。你會驚訝有這麼多人在發財後還保持節儉的舊習慣。沃爾瑪的億萬富豪華頓在1992年逝世，他只要拿出一點零頭就能買下一整隊大禮車，但他繼續開著一輛破舊的雪佛蘭，駕駛盤上還有狗咬的痕跡。他可以搬到巴黎、倫敦、羅馬和其他《富豪名人生活》（Lifestyles
    of the Rich and Famous）的拍攝地點，但他和妻子仍住在阿肯色州班頓維爾老家——只有兩間臥室的屋子。


    巴菲特是另一個沒有讓財務成功阻止他住在家鄉內布拉斯加州奧馬哈的富豪，他至今仍享受看好書、打橋牌的單純快樂。快捷半導體創辦人暨英特爾（Intel）共同創辦人摩爾（Gordon
    Earle Moore）每天開著他的老舊小貨卡到辦公室。有許多白手起家的百萬富翁和億萬富豪仍過著樸素的生活，避免出名，即使他們無須為支付帳單煩惱，卻仍然每天辛勤工作。「過著平靜的生活」和「避開媒體」是經常用來描述富比世400大富豪的詞句。


    這些人仍做著讓他們致富的事，而我們可以從中學到寶貴的一課：尋找你真正喜歡做的事，然後全力以赴，錢自然就會跟著你。到最後，你的成就終於讓你可以後半輩子躺在游泳池畔喝飲料，但你很可能不會這麼做。你會因為太過享受在辦公室的樂趣，而不願停止工作。


    ## 可口可樂是如何發跡的


    上帝不是有天往下看世界，說「要有可口可樂」，然後就有了可口可樂。造物者和可口可樂沒有半點關係，除非你認為祂在創造彭伯頓博士（Dr. John Styth Pemberton）時就想到可口可樂。彭伯頓1869年從喬治亞州哥倫比亞市遷到亞特蘭大，他在年紀大到足以吸引聽眾時就開始賣成藥了。


    這是在美國有廣告法和食品藥物管理局（FDA）可監管人們吃或喝的產品之前的事。所以當然沒有人能阻止彭伯頓摻一大堆原料（其中一項主要原料是酒精）在家裡的浴缸，然後把他的配方裝在瓶中，當成萬靈丹賣給大眾。


    彭伯頓的產品包括印地安女王染髮劑、染料、肝病藥丸，和一種異國風味的混合成分——包括糖、水、古柯葉的萃取物、可樂果和咖啡因。標籤上寫著這是一種「補腦藥、能治療各種神經痛」的藥水，且彭伯頓在他的推銷中宣稱，這藥水能醫治頭痛、歇斯底里和憂鬱症，並讓顧客感到精神愉悅。這就是原始的可口可樂。


    彭伯頓在第一年花了73.96美元打廣告，但他只賣出50美元的可樂糖漿，所以消費者其實並不相信他的推銷詞。五年後，消費者還是不要不買，而彭伯頓已厭倦於說服他們。所以他把配方、設備、古柯葉和可樂果賣給亞特蘭大的藥劑師坎德勒（Asa
    Candler）。坎德勒花了2,300美元買下所有東西。


    坎德勒是個教徒，他寧可說實話而不像彭伯頓那樣天花亂墜。他把古柯葉從配方中去除，所以到了1905年，可口可樂已完全不含古柯鹼。他做對了這件事，因為在1914年古柯鹼被禁用後，人們可能因為喝可樂而被送進牢裡。修改過的可樂配方是美國保守得最嚴密的秘密，至今仍安全地存放在喬治亞信託公司（Trust
    Company of Georgia）的地窖裡。


    坎德勒也改變標示，刪除「補腦藥」、「能治療神經痛」以及其他可疑的宣傳。1916年，他發明了曲線瓶，至今世界上大部分人一看就馬上能辨認那是可口可樂。


    在坎德勒的工廠裡，可樂果、糖、水、咖啡因——加上他自己的一些秘密成分——在一個巨大的鍋爐裡煮，用巨大的木漿攪拌，直到它們變濃稠成為糖漿。這些糖漿被送到藥店，由藥劑師添加會起泡泡的蘇打水，成了給坐在櫃檯前的人喝的可樂。喝可樂變得如此受歡迎，以致於藥劑師必須請幫手——稱為「蘇打販賣員」（soda
    jerk）——專門倒糖漿和加氣泡水。這成了美國各地成千上萬名青少年放學後打工賺錢的方法。


    1916年，國會對企業課徵新稅，坎德勒十分生氣。為了避免從他的可樂獲利支付更高的稅，他以2,500萬美元，把公司賣給亞特蘭大的銀行家厄尼斯特·伍德魯夫（Ernest
    Woodruff）。他的兒子羅伯特·伍德魯夫（Robert Woodruff）當上可口可樂總裁。


    伍德魯夫買下公司後不久，可口可樂公司便公開上市。1919年，他們以每股40美元賣出100萬股。這是一檔很多人後悔買下的股票，尤其是在糖漿的成本大幅飆漲後。氣憤的裝瓶廠工人抗議價格上漲，揚言要取消與公司的合約。訴訟案接踵而來，可口可樂的銷售下降，公司在破產邊緣躊躇而行。


    拜羅伯特大幅削減成本所賜，可口可樂又撐過一段時間，直到大蕭條來臨。這對大多數公司來說是一段可怕的時期，但對可口可樂卻十分有利。雖然人們只有一點錢可花，而且許多人不買新鞋子、新衣服等東西，但他們還是繼續喝可樂。


    有個很有用的建議可以給投資人：要像一隻尋血獵犬那樣，不理會其他東西，而專注於鼻子嗅到的證據。經濟在1930年代惡劣到極點，但由於可口可樂很賺錢，股價從1932年的20美元漲到1937年的160美元。想像當你週遭的人都預測世界末日即將到來時，你的投資卻翻漲了八倍。


    羅伯特管理可口可樂公司三十年，他極力躲避記者，儘量避免名字出現在報紙上。他有好幾棟房子，而且至少有一座大牧場；但除此之外，以億萬富豪的標準來說，他過著相當儉約的生活。顯然他從來不閱讀書籍，也很少聽音樂或看畫展，除非畫裡有野鴨或鹿在裡面。他會舉辦宴會，但只在逼不得已時才舉辦。


    可口可樂不但從大蕭條這場災難獲益，另一場災難——第二次世界大戰——也讓它大發利市。全世界的人都看到美國大兵喝可口可樂，他們決定仿效這些英雄。美國大兵是商業廣告史上最有效的免費廣告贊助人。


    經過二戰後，可口可樂變成第一家真正的跨國公司。可口可樂華麗的紅色看板在世界六大洲的牆壁和建築上都看得到——有時它們被用來裝飾建築上的孔洞。可口可樂變成美國生活方式的象徵，這也是俄羅斯的共產黨恨它的原因。（在1970年代，俄國領導人和百事可樂簽合約！）美國的飛彈瞄準俄國，俄國飛彈也瞄準美國，不只如此，他們還擔心被一種軟性飲料入侵。法國的共產黨甚至嘗試禁止可口可樂。


    要得到擁有可口可樂股票的所有好處，你必須耐心等候二十年，直到1958年股價再度大躍進。在1958年價值5,000美元的可口可樂股票，到1972年的價值將近10萬美元。人生中沒有多少機會可以在十四年間把5,000美元變成10萬美元，除非你贏了彩券或做什麼違法的勾當。


    在1972年的崩盤中，可口可樂與其他股票一起受害，很快跌掉63%，直到三年後才漲回來。再一次的，耐心獲得報酬，股價再度飛漲，可口可樂把1984年時的5,000美元變成1994年的5萬美元。


    在共產主義和可口可樂之間的戰爭中，可口可樂獲得全面勝利。因為當共產主義破產後，可口可樂仍然生意興隆。結果證明，它最大的威脅不是俄國人，而是百事公司。


    回想在1930年代，可口可樂原本可以用極低的價格買下在破產邊緣掙扎的百事，但它沒這麼做。五十年後，百事再度成為可口可樂的威脅。1984年，百事在美國市場的銷售超越可口可樂，可口可樂總部的主管被迫反擊。在雙方激烈戰鬥中，他們發明了健怡可樂，從此改變了軟性飲料業，並為人類的腰圍減輕了數百萬磅的重量。如果沒有來自百事的競爭壓力，可口可樂可能永遠不會想到健怡可樂。


    伍德魯夫的時代在1950年代中期結束，羅伯特·伍德魯夫退休後以捐獻他賺得的錢打發時間。他捐出數億美元給醫療中心、藝術中心和埃默里大學（Emory University），他還捐出在亞特蘭大興建疾病防治中心（Center
    for Disease Control and Prevention）的用地。他對亞特蘭大藝術聯盟中心慷慨解囊，雖然他從不喜歡參觀博物館或聽交響樂。他的捐獻有許多是匿名捐出，但大家猜想是伍德魯夫捐的——否則在亞特蘭大有誰那麼有錢、又如此慷慨？他們稱他為「無名氏先生」。


    高茲耶達（Roberto Goizueta）在1981年接掌可口可樂，並擔任董事長。他和可口可樂前任總裁齊歐（Don Keough）變成最佳拍檔，他們推動國際銷售，讓195個國家的人喝可口可樂像喝水一樣普遍。


    高茲耶達本身就是個傳奇故事。他來自古巴一個富農家族，許多財產在卡斯楚的革命中被沒收。他在古巴為可口可樂工作，卡斯楚掌權後他被調派到巴哈馬的可口可樂辦公室。然後他從那裡再調至亞特蘭大可口可樂總部，並一路晉升到公司最高主管。


    可口可樂在世界各地受歡迎的情況似乎沒有止境，但華爾街經過好久的時間才發現這一點。部分「專家」到現在還無動於衷。


    ## 籌牌如何崛起


    瑞格理（William Wrigley Jr.）1891年離開費城到芝加哥，在他父親

    '
  mdcn: '

    有點不公平。華爾街方圓50哩內沒有一隻熊，除非你把紐約動物園的熊算在內，而且熊不會像股票在熊市那樣直線下墜。把熊市改稱為旅鼠市（lemming market）還比較有道理，用來形容投資人跟隨別人一起拋售股票十分恰當。


    「爸爸熊市」（Papa Bear market）從1929年開始，我們在前面已討論過。在1973-1974年的「媽媽熊市」（Momma Bear market），股票平均下跌50%。1982年還有一年熊市，接著是1987年的崩盤，道瓊指數在幾個月內下跌超過1,000點，其中包括在一天內跌掉的508點。1990年有「海珊熊」（Saddam
    Hussein bear），投資人因擔心波斯灣戰爭而大賣股票。但這些晚近的熊市都比1929年和1973-1974年的大熊市容易應付得多。


    持久的熊市可以測試每個人的耐心，混淆沒有經驗的投資人。不管你多擅長選股，你的股票都會下跌，而每次你以為底部已經出現，它們都會再往下跌。如果你持有共同基金的股票也無法倖免，因為共同基金股票也會下跌，其命運取決於基金的持股。


    在1929年高點買股票的人（幸好只有少數人），必須等待二十五年股價才會回升到當時的水準。想像你的股票虧損二十五年！從1973-1974年崩盤之前的1969年高點算起，股價過了十二年才又回到相同水準。也許我們再也不會看到像1929年那麼嚴重的空頭市場——也就是大蕭條之前的崩盤。但我們不能輕忽像1973-1974年的空頭市場再度來臨，這波空頭後股價回升的時間也長到小孩從進小學直到高中畢業。


    投資人無法避開修正和空頭市場，就像北方人無法避開暴風雪一樣。在持有股票的五十年間，你可能經歷25次修正，其中8次或9次會演變成空頭市場。


    如果能事先獲得警訊那該有多好，這樣你就能在空頭市場來臨前賣出股票和共同基金，把資金留待股票變便宜後再買進。問題是，沒人想出預測空頭市場的方法。預測空頭市場的準確度，和預測衰退不相上下。偶爾有人會正確預測空頭市場來臨，然後在一夕之間聲名大噪——名叫葛莎雷莉（Elaine
    Garzarelli）的分析師就因預測1987年的崩盤而出名。但你絕不會聽到有人連續料中兩個空頭市場。你聽到的只是成群的「專家」喊著「熊來了」，卻看不到熊的蹤影。


    既然我們都習於採取行動保護自己免於暴風雪和颶風侵襲，所以嘗試採取行動保護自己免於空頭市場之害也很自然，儘管這時像童子軍那樣做準備反而有害無益。投資人因嘗試預測修正所導致的虧損，遠超過修正本身帶來的損失。


    投資股票的大忌之一是頻繁進出股票或股票共同基金，期待避開修正的來臨。另一個錯誤是，在你投資股票前坐擁現金等待即將來臨的修正。人們往往因為嘗試預測市場時機以逃避空頭市場，而錯失把握多頭市場的機會。


    回顧1954年的標準普爾500指數，就可看出在股票大躍進的短暫時期沒有抱緊股票的代價有多高。如果你過去四十年間隨時把錢投入股票，你的年投資報酬率將達到11.5％。但如果你在四十年間的40個獲利最佳月份不投入股票，你的投資報酬率將跌到2.7％。


    我們在前面解釋過這些，但這值得再說一次。以下是另一個明顯的統計數字。從1970年開始，如果你幸運地每年都投資2,000美元在市場的高點，你的年報酬率是8.5%。如果估算市場時機很完美，把每年的2,000美元投資在市場低點，你的年報酬率是10.1%。所以最好和最差的市場時機預測，其差別僅有1.6個百分點。


    當然，你喜歡很幸運，能多賺1.6個百分點；但即使你沒算準市場時機，報酬率也還不錯，只要你繼續投資股市。買進好公司的股票，不管市場好壞都抱緊它們。


    空頭市場的問題有個簡單的解決辦法。擬訂一個買進股票或股票共同基金的時間表，每個月固定投資一小筆錢，或每四個月、每六個月投資一次。這會省掉你操心多頭或空頭市場的問題。


    ## 4 看不見的手


    ### 誰是富人，他們如何致富


    每年《富比世》（Forbes）登出美國400大富豪的名單，這主題受商界人士矚目的程度，不下於運動迷喜愛《運動畫刊》（Sports Illustrated）泳裝專輯。這份名單很吸引人，因為它告訴你這些富豪是誰，他們如何致富，從中並可窺見美國長期以來的演變。


    當《富比世》1982年首度刊登這份名單時，榜首是船運大亨陸得維格（Donald K. Ludwig）；其後是蓋帝（J. Paul Getty），他靠著老方法致富——繼承。前十大富豪中有五位是韓特（Hunt）家族的成員，他們在德州到處鑽洞，發現大量石油；這令我們想起億萬富翁蓋帝的名言：想要出人頭地就得早起、勤奮工作、發現油礦。


    這份最早的富豪名單裡有來自洛克斐勒家族、杜邦家族的成員，還有一位來自佛利克（Frick）家族，一位惠特尼（Whitney）、兩位美隆（Mellon）——都是可追溯至19世紀的有錢家族。「繼承」兩字出現在簡介欄的次數不下65次，而除了65位繼承人外，至少還有12名兒子或女兒在家族企業占據重要職位。


    1993年的名單上已不像1980年代有那麼多舊富豪家族成員了，這讓我們得到兩點有關美國財富的結論：第一，要守住財富並不容易，即使是億萬富豪也是如此。遺產稅會吃掉任何從上一代傳給下一代鉅額財富的一大塊。除非繼承人做好謹慎、明智的投資，否則他們虧損龐大財富的速度可能像祖先當初賺錢的速度一樣快。


    第二，美國仍然是機會的國度，聰明的年輕人像微軟的蓋茲可以登上富比世富豪名單，超越洛克斐勒家族、蓋帝家族和卡內基家族。


    1993年的名單上超越蓋茲的只有巴菲特，他靠著聰明的選股賺進他的100億美元。巴菲特是歷史上第一位成為美國首富的選股人。


    巴菲特遵守一個簡單的策略：沒有花招、不騙人、不玩弄市場，只是買進好公司的股票，並抱住它們，直到讓人感到很無聊。但成果卻一點也不無聊：如果你跟著巴菲特從四十年投資生涯的開頭投資1萬美元，到今日價值將達到8,000萬美元。大多數獲利來自你聽過、而且可以自己買進的公司股票，例如可口可樂、吉列（Gillette）和華盛頓郵報（Washington
    Post）。如果你有天開始懷疑擁有股票是否明智，只要再看一次巴菲特的績效就能讓你堅定信心。


    如果把杜邦家族算成一個人，1993年的美國400大富豪只有43人是靠繼承致富。我們看到昔日大亨的子孫較少上榜了，取而代之的是更多白手起家，靠著自己努力、運氣和好點子攀上財富高峰。赫爾姆斯利（Harry
    Helmsley）是黎歐娜（Leona Helmsley）的丈夫，也是多家族館的老闆，他從房地產公司的收發室職員展開他的職涯；音樂鉅子葛芬（David Geffen）原本在莫里斯經紀公司（William
    Morris）當工友；把麥當勞擴建成速食王國的柯洛克（Ray Kroc）從牛奶攪拌機的推銷員起家；沃爾瑪創辦人華頓（Sam Walton）最早是JC潘尼百貨（J.C.
    Penny）的訓練員；裴洛（H. Ross Perot）曾是IBM的銷售員。此外還有贈品兌換券大王卡爾森（Curtis Leroy Carlson），他是瑞典移民雜貨店老闆之子，曾把他的送報路線發包給兄弟賺取微薄的差價；也曾為賣鹹賣肥皂，每月賺110美元。後來貸款50美元創立黃金債券贈品兌換券公司（Gold
    Bond Trading Stamp Company）。


    多得出乎意料的中輟生擠上400大富豪排行榜，排在最前面的軟科技神童蓋茲，他離開哈佛，專心設計軟體，他發明的作業系統現在安裝在世上絕大多數的個人電腦上。


    還有柯寇瑞安（Kirk Kerkorian），他是亞美尼亞移民果農之子，高中沒唸完就離開學校了；前面提到的唱片製作人葛芬是大學中輟生；艾倫（Paul Allen）與蓋茲共同創辦微軟，他從華盛頓州立大學休學；透納傳播（Turner
    Broadcasting）的創辦人透納（Ted Turner）被布朗大學退學，但後來回去念研究所；甲骨文電腦的艾里森（Lawrence J. Ellison）是伊利諾大學的中輟生；梅多克（David
    Howard Murdock）靠房地產和企業併購致富，他是推銷員之子和高中中輟生；辛普洛特（John Richard Simplot）賣炸薯條用的馬鈴薯給麥當勞，他從八年級就離家並輟學，找到一份篩選馬鈴薯和餵豬的工作；惠仁嘉（Harry
    Wayne Huizenga）也是大學中輟生，他用一輛破舊的老卡車創立廢棄物管理公司（Waste Management），到31歲時已是全世界最大的垃圾處理業者。然後他把注意力轉向一家達拉斯的錄影帶店，將其打造成百視達公司（Blockbuster
    Video）。


    別學這些人從學校輟學。在他們開創事業的年代，還有可能不需要大學教育就能找到不錯的工作——在今天這幾乎不可能。還有，他們每個人都精通必需的基本技術，才能在事業上出人頭地。他們退學不是為了逃避工件，而是為了開創一家公司，或追求他們的興趣。


    今日要賺進10億美元的方法有百百種：汽車零件、單柄水龍頭、黃頁、咖啡奶精、塑膠杯、翻修輪胎、塑膠工業廢棄物、快速苗條（Slim-Fast）、平恩高爾夫俱樂部（Ping
    Golf Clubs）、高風險汽車保險、免稅商店、嘉年華遊輪、披薩加盟連鎖店（達美樂〔Domino''s〕和小凱薩〔Little Caesar〕）和租車代理。名單上甚至還有律師，靠打醫療賠償官司致富。


    有些帶進億萬財富的創意是在地下室孕育的，或從小鎮的商店開始，靠極少的預算發跡。電腦巨人惠普的第一批產品是以價值538美元的電子零件在帕卡德的車庫組裝成的；沃爾瑪源自阿肯色州新港一家五美分商店，後來因為房東不續租而在班頓維爾（Bentonville）重新開張；安麗（Amway）從一個地下室發跡，狄弗斯（Richard
    Marvin De Vos）和安德爾（Jay Van Andel）以他們向底特律一位化學家買的配方，在那裡製造可生物分解的肥皂。


    這群坐擁龐大財富的人當中，只有31人靠房地產致富、18人靠石油發跡，所以蓋帝的座右銘用在今日已不如以往適用。有幾位億萬富豪（例如史華伯〔Charles Schwab〕）藉開創證券經紀公司和共同基金公司致富；另有約30人因有線電視和媒體業而致富；至少有20人從事電子和電腦業。


    1982年至今最大的改變是400大富豪的財富規模。在當年，只要財富1億美元就可登上排名，如今至少要3億美元才能勉強擠進榜尾。在排名前端，有25人的淨值超過20億美元，而在1982年超過20億美元的只有5個人。


    費滋傑羅（F. Scott Fitzgerald）曾寫過，富人「與你我不同」，但你從富比世名單上無法證實這種說法。名單上有各式各樣的富人——矮的、胖的、高的、帥的、醜的、智商高的、智商不怎麼高的、愛花錢的、吝嗇的、儉約的、大方的。你會驚訝有這麼多人在發財後還保持節儉的舊習慣。沃爾瑪的億萬富豪華頓在1992年逝世，他只要拿出一點零頭就能買下一整隊大禮車，但他繼續開著一輛破舊的雪佛蘭，駕駛盤上還有狗咬的痕跡。他可以搬到巴黎、倫敦、羅馬和其他《富豪名人生活》（Lifestyles
    of the Rich and Famous）的拍攝地點，但他和妻子仍住在阿肯色州班頓維爾老家——只有兩間臥室的屋子。


    巴菲特是另一個沒有讓財務成功阻止他住在家鄉內布拉斯加州奧馬哈的富豪，他至今仍享受看好書、打橋牌的單純快樂。快捷半導體創辦人暨英特爾（Intel）共同創辦人摩爾（Gordon
    Earle Moore）每天開著他的老舊小貨卡到辦公室。有許多白手起家的百萬富翁和億萬富豪仍過著樸素的生活，避免出名，即使他們無須為支付帳單煩惱，卻仍然每天辛勤工作。「過著平靜的生活」和「避開媒體」是經常用來描述富比世400大富豪的詞句。


    這些人仍做著讓他們致富的事，而我們可以從中學到寶貴的一課：尋找你真正喜歡做的事，然後全力以赴，錢自然就會跟著你。到最後，你的成就終於讓你可以後半輩子躺在游泳池畔喝飲料，但你很可能不會這麼做。你會因為太過享受在辦公室的樂趣，而不願停止工作。


    ## 可口可樂是如何發跡的


    上帝不是有天往下看世界，說「要有可口可樂」，然後就有了可口可樂。造物者和可口可樂沒有半點關係，除非你認為祂在創造彭伯頓博士（Dr. John Styth Pemberton）時就想到可口可樂。彭伯頓1869年從喬治亞州哥倫比亞市遷到亞特蘭大，他在年紀大到足以吸引聽眾時就開始賣成藥了。


    這是在美國有廣告法和食品藥物管理局（FDA）可監管人們吃或喝的產品之前的事。所以當然沒有人能阻止彭伯頓摻一大堆原料（其中一項主要原料是酒精）在家裡的浴缸，然後把他的配方裝在瓶中，當成萬靈丹賣給大眾。


    彭伯頓的產品包括印地安女王染髮劑、染料、肝病藥丸，和一種異國風味的混合成分——包括糖、水、古柯葉的萃取物、可樂果和咖啡因。標籤上寫著這是一種「補腦藥、能治療各種神經痛」的藥水，且彭伯頓在他的推銷中宣稱，這藥水能醫治頭痛、歇斯底里和憂鬱症，並讓顧客感到精神愉悅。這就是原始的可口可樂。


    彭伯頓在第一年花了73.96美元打廣告，但他只賣出50美元的可樂糖漿，所以消費者其實並不相信他的推銷詞。五年後，消費者還是不要不買，而彭伯頓已厭倦於說服他們。所以他把配方、設備、古柯葉和可樂果賣給亞特蘭大的藥劑師坎德勒（Asa
    Candler）。坎德勒花了2,300美元買下所有東西。


    坎德勒是個教徒，他寧可說實話而不像彭伯頓那樣天花亂墜。他把古柯葉從配方中去除，所以到了1905年，可口可樂已完全不含古柯鹼。他做對了這件事，因為在1914年古柯鹼被禁用後，人們可能因為喝可樂而被送進牢裡。修改過的可樂配方是美國保守得最嚴密的秘密，至今仍安全地存放在喬治亞信託公司（Trust
    Company of Georgia）的地窖裡。


    坎德勒也改變標示，刪除「補腦藥」、「能治療神經痛」以及其他可疑的宣傳。1916年，他發明了曲線瓶，至今世界上大部分人一看就馬上能辨認那是可口可樂。


    在坎德勒的工廠裡，可樂果、糖、水、咖啡因——加上他自己的一些秘密成分——在一個巨大的鍋爐裡煮，用巨大的木漿攪拌，直到它們變濃稠成為糖漿。這些糖漿被送到藥店，由藥劑師添加會起泡泡的蘇打水，成了給坐在櫃檯前的人喝的可樂。喝可樂變得如此受歡迎，以致於藥劑師必須請幫手——稱為「蘇打販賣員」（soda
    jerk）——專門倒糖漿和加氣泡水。這成了美國各地成千上萬名青少年放學後打工賺錢的方法。


    1916年，國會對企業課徵新稅，坎德勒十分生氣。為了避免從他的可樂獲利支付更高的稅，他以2,500萬美元，把公司賣給亞特蘭大的銀行家厄尼斯特·伍德魯夫（Ernest
    Woodruff）。他的兒子羅伯特·伍德魯夫（Robert Woodruff）當上可口可樂總裁。


    伍德魯夫買下公司後不久，可口可樂公司便公開上市。1919年，他們以每股40美元賣出100萬股。這是一檔很多人後悔買下的股票，尤其是在糖漿的成本大幅飆漲後。氣憤的裝瓶廠工人抗議價格上漲，揚言要取消與公司的合約。訴訟案接踵而來，可口可樂的銷售下降，公司在破產邊緣躊躇而行。


    拜羅伯特大幅削減成本所賜，可口可樂又撐過一段時間，直到大蕭條來臨。這對大多數公司來說是一段可怕的時期，但對可口可樂卻十分有利。雖然人們只有一點錢可花，而且許多人不買新鞋子、新衣服等東西，但他們還是繼續喝可樂。


    有個很有用的建議可以給投資人：要像一隻尋血獵犬那樣，不理會其他東西，而專注於鼻子嗅到的證據。經濟在1930年代惡劣到極點，但由於可口可樂很賺錢，股價從1932年的20美元漲到1937年的160美元。想像當你週遭的人都預測世界末日即將到來時，你的投資卻翻漲了八倍。


    羅伯特管理可口可樂公司三十年，他極力躲避記者，儘量避免名字出現在報紙上。他有好幾棟房子，而且至少有一座大牧場；但除此之外，以億萬富豪的標準來說，他過著相當儉約的生活。顯然他從來不閱讀書籍，也很少聽音樂或看畫展，除非畫裡有野鴨或鹿在裡面。他會舉辦宴會，但只在逼不得已時才舉辦。


    可口可樂不但從大蕭條這場災難獲益，另一場災難——第二次世界大戰——也讓它大發利市。全世界的人都看到美國大兵喝可口可樂，他們決定仿效這些英雄。美國大兵是商業廣告史上最有效的免費廣告贊助人。


    經過二戰後，可口可樂變成第一家真正的跨國公司。可口可樂華麗的紅色看板在世界六大洲的牆壁和建築上都看得到——有時它們被用來裝飾建築上的孔洞。可口可樂變成美國生活方式的象徵，這也是俄羅斯的共產黨恨它的原因。（在1970年代，俄國領導人和百事可樂簽合約！）美國的飛彈瞄準俄國，俄國飛彈也瞄準美國，不只如此，他們還擔心被一種軟性飲料入侵。法國的共產黨甚至嘗試禁止可口可樂。


    要得到擁有可口可樂股票的所有好處，你必須耐心等候二十年，直到1958年股價再度大躍進。在1958年價值5,000美元的可口可樂股票，到1972年的價值將近10萬美元。人生中沒有多少機會可以在十四年間把5,000美元變成10萬美元，除非你贏了彩券或做什麼違法的勾當。


    在1972年的崩盤中，可口可樂與其他股票一起受害，很快跌掉63%，直到三年後才漲回來。再一次的，耐心獲得報酬，股價再度飛漲，可口可樂把1984年時的5,000美元變成1994年的5萬美元。


    在共產主義和可口可樂之間的戰爭中，可口可樂獲得全面勝利。因為當共產主義破產後，可口可樂仍然生意興隆。結果證明，它最大的威脅不是俄國人，而是百事公司。


    回想在1930年代，可口可樂原本可以用極低的價格買下在破產邊緣掙扎的百事，但它沒這麼做。五十年後，百事再度成為可口可樂的威脅。1984年，百事在美國市場的銷售超越可口可樂，可口可樂總部的主管被迫反擊。在雙方激烈戰鬥中，他們發明了健怡可樂，從此改變了軟性飲料業，並為人類的腰圍減輕了數百萬磅的重量。如果沒有來自百事的競爭壓力，可口可樂可能永遠不會想到健怡可樂。


    伍德魯夫的時代在1950年代中期結束，羅伯特·伍德魯夫退休後以捐獻他賺得的錢打發時間。他捐出數億美元給醫療中心、藝術中心和埃默里大學（Emory University），他還捐出在亞特蘭大興建疾病防治中心（Center
    for Disease Control and Prevention）的用地。他對亞特蘭大藝術聯盟中心慷慨解囊，雖然他從不喜歡參觀博物館或聽交響樂。他的捐獻有許多是匿名捐出，但大家猜想是伍德魯夫捐的——否則在亞特蘭大有誰那麼有錢、又如此慷慨？他們稱他為「無名氏先生」。


    高茲耶達（Roberto Goizueta）在1981年接掌可口可樂，並擔任董事長。他和可口可樂前任總裁齊歐（Don Keough）變成最佳拍檔，他們推動國際銷售，讓195個國家的人喝可口可樂像喝水一樣普遍。


    高茲耶達本身就是個傳奇故事。他來自古巴一個富農家族，許多財產在卡斯楚的革命中被沒收。他在古巴為可口可樂工作，卡斯楚掌權後他被調派到巴哈馬的可口可樂辦公室。然後他從那裡再調至亞特蘭大可口可樂總部，並一路晉升到公司最高主管。


    可口可樂在世界各地受歡迎的情況似乎沒有止境，但華爾街經過好久的時間才發現這一點。部分「專家」到現在還無動於衷。


    ## 籌牌如何崛起


    瑞格理（William Wrigley Jr.）1891年離開費城到芝加哥，在他父親

