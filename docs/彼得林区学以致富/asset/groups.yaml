    幸運的是，法院和政府都努力對抗信託。1890年，國會通過謝爾曼反信託法（Sherman Antitrust Act，又稱反托辣斯法案），但數家觸犯法令的大信託公司又藉著變身為「控股公司」、並遷移到新澤西州而躲過制裁。新澤西州在之前已通過州級法律，讓潛在的信託事業更容易組成控股公司，藉以規避聯邦法律。巨大的美國鋼鐵公司當時就組成控股公司。


    1904年，美國最高法院再重擊違法的最大鐵路信託之一。當時擔任總統的老羅斯福（Teddy Roosevelt）再度援引謝爾曼法案對44家大信託提出控告。熱愛野營、打獵和各種戶外活動的老羅斯福綽號「悍騎兵」（Rough
    Rider），以他於美西戰爭中在古巴聖約翰山（San Juan Hill）率領騎士衝鋒陷陣而得名。但遠比贏得聖約翰山戰役更重要的是贏得對抗信託的戰爭。他變成了美國的「信託剋星」。1914年，國會通過第二項反信託法案，即克萊頓法案（Clayton
    Act）。


    從1911年的標準石油開始，許多美國最大的信託被拆解，主要產業的競爭因而恢復。此後政府持續監視規模太大、勢力太強的公司，唯恐形成產業的獨占。每當有這種情況發生，政府可提出反托辣斯控告，如果獲勝，法院就能強迫公司分拆成彼此獨立、規模較小的公司，以便確保產業的競爭。


