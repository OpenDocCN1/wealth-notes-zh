    # 彼得林區

    學以致富


    彼得·林區 Peter Lynch、

    約翰·羅斯查得 John Rothchild——著

    吳國卿——譯


    ## Contents


    ### 序言 005

    ### 前言 我們熟悉的公司 011

    ### 01 資本主義簡史 021

    ### 02 投資基本原則 099

