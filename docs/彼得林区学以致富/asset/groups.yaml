  - '[PAGE 129]


    這個新運動的目標是，製作較簡短、明瞭的說明書，讓人們不用讀法律系也能了解。如果運動成功，管理基金的公司和投資基金的持股人都將受益。


    經過長期遭到大眾的冷落後，共同基金在1960年代末再度受到歡迎，全美各地的都有兼職或加夜班的老師、店員、職員和各式各樣的人在社區推銷共同基金。但結果令人大失所望，因為數百萬名基金投資人正好趕上1969-1973年的空頭市場，是1929年以後最淒慘的空頭行情。


    在這段股票連續下跌的時期，部分共同基金股價重挫75%——這是擁有共同基金股票並非穩賺不賠的又一證明。投資人因虧損而大受衝擊，爭相退出股市，以遠低於買進價格拋售持股，寧可把錢存入儲蓄帳戶，並發誓下次接到基金推銷員的電話將馬上掛斷。


    此後將近十年間，股票共同基金遭到投資人唾棄，高品質的基金備受冷落而了無生機，聰明的基金經理人可以找到許多可買的好股票，而且價格十分低廉，但他們沒有錢可以買進股票，因為基金無法吸引顧客投資。


    隨著股市在1980年代回春，共同基金業也苦盡甘來，且此後一片欣欣向榮，基金數量達5,655檔，並持續增加，光過去兩年新設的基金就超過1,300檔。每天都有新基金成立：債券基金、貨幣市場基金和股票基金。如果以這麼快的速度增加，美國的股票基金檔數很快就會超過股票檔數。'
  - '[PAGE 130]


    # 現在就買基金


    光說明不同種類的股票基金就需要一整本書：全方位基金、單產業基金、多產業基金、小型股、大型股、純粹型、混合型、外國基金、本國基金、社會責任基金、無社會責任基金、成長型、價值型、收益型，以及成長收益型基金等。基金的分類複雜到還有專門購買其他基金股票的「組合基金」（funds
    of funds）。


    你可以日以繼夜研究如何選擇正確的基金，但你可能只看懂公開說明書一半的資訊。如果那些說明書、小冊子和文件全都倒在你身上，可能需要一支救援隊花幾個小時把你救出來。事實上，每年有那麼多精力花在選擇正確的基金上，這已變成一件會讓人發狂的麻煩事。如果能省下尋找完美共同基金的麻煩，人們會更快樂、更放鬆，對狗和小孩更和善，還可以省下大筆的心理醫師帳單。


    我們冒著可能加深這種偏執的風險，提出以下幾點建議：


    +   1. 你可以直接向管理基金的公司購買共同基金，例如德瑞弗斯（Dreyfus）、富達（Fidelity）和史卡德（Scudder）。你也可以透過股票經紀商購買基金，雖然經紀商可能無法賣你想要的基金。


    +   2. 經紀商必須賺錢，且有時他們賣自家產品可以獲得更高的佣金。說服你買自家共同基金可能符合他們的利益，但未必符合你的利益。如果經紀人推薦你產品，永遠要弄清楚那對經紀商有什麼好處。要求他（或她）提供所有可得的資訊。也許有一些基金和經紀人推薦的基金類似，但整體來看績效更好。'
  - '[PAGE 131]


    3. 如果你是長期投資人，別理會債券基金和混合基金（同時投資股票和債券的基金），只買純股票基金。股票在20世紀美國的九十年中，有八十年績效超越債券（債券在1980年代績效以些微差距名列第二，但股票仍然略勝一籌）。在1990年代上半，股票再度大幅領先債券。如果你不100%投資股市，長期來看你將少賺很多錢。


    4. 選擇正確的基金不比選擇正確的汽車機師容易，但在選擇基金時，至少有過去的績效指引你。除非你訪問數十名顧客，否則沒有簡單的方法可判斷汽車機師是優秀、怠劣或平庸，但你可以輕易判斷基金符合這些評語的哪一種。這一切歸結都是年報酬率。一檔過去十年每年報酬率18%的基金，比年報酬率14%、目標相似的同類基金傑出。但在你憑著過去的記錄投資一檔基金前，要先確定達成此卓越績效的經理人仍為該基金操盤。


    5. 長期來看，投資小公司比大公司的獲利高。今日成功的小公司將變成明日的沃爾瑪、家得寶（Home Depot）和微軟。所以投資小公司（所謂小型股）的基金以大幅差距打敗「大型股」基金也就不足為奇。（大型股指的是「市值」〔market
    capitalization〕金額較大的公司，也就是公司發行的總股票股數乘以目前的股價。）只要挑中兩家未來的沃爾瑪，就足以讓基金的績效脫穎而出。沃爾瑪的股價在二十年間上漲超過250倍。


    由於小型股的波動往往比大型股劇烈，小型股基金的漲跌幅度'
  - '[PAGE 132]


    會比其他類型的基金更大。但如果你有鐵胃可以承受較大的上下起伏，投資小型股可以給你更高的報酬。


    6. 如果能投資已延續好幾季、且交出亮麗績效的老牌基金，何必冒險投資剛成立的新基金？從理財雜誌如《巴隆》（Barron''s）和《富比世》可以找到許多連續多年保持頂尖績效的基金。
    《巴隆》每年兩次公布完整的基金介紹，由理柏分析（Lipper Analytical）提供詳盡分析；理柏分析是一家高品質的研究公司，由著名的基金觀察家理柏（Michael
    Lipper）經營。《華爾街日報》一年四次刊登類似的報導。


    如果仍需要更多有關特定基金的資訊，可從追蹤數千家基金、並每月公布報告的晨星公司（Morningstar）獲得。晨星為所有這些基金的安全性做排名，評比它們的績效，並提供經理人是誰，和投資組合有哪些股票等資訊，是目前提供投資人所需各種資訊的最佳來源。


    7. 經常更換基金划不來。有些投資人養成更換基金的習慣，希望搶搭最新的熱門績優基金。這不但麻煩且沒有價值。研究顯示，名列前茅一年的基金很少在第二年又重複同樣的好表現。嘗試抓住贏家是傻瓜瞎忙的事，結果可能反而找到輸家。你最好是挑選一家長期績效卓越的基金，然後長期守住它。


    8. 除了每年向投資人收取管理費外，有些基金也收取申購手續費（entry fee）。申購手續費通常是3%到4%，這表示當你投資收取申購手續費的基金時，你的錢一開始就先損失了3%到4%。'
  - '[PAGE 133]


    當然也有許多不收申購手續費的基金。平均來看，收取或不收申購手續費的基金表現一樣好。這就和收服務費的餐廳不一定服務更好的道理一樣。


    你留在一檔基金愈久，是否收取申購手續費就愈不重要。經過十年或十五年，如果該基金表現不錯，你就會忘記是否曾支付3%或4%的申購手續費加入它了。


    年度管理費比申購手續費更值得注意，因為那是每年從基金扣除的費用。維持最低水準開支的基金（低於1%），比開支較高的基金（2%或更高）具有根本的優勢。高成本基金的經理人在不利的條件下工作，他們每年表現必須比低成本基金多出0.5%到1.5%，才能交出同樣的績效。


    9. 絕大多數基金僱用經理人是希望打敗市場的平均報酬率。這是你付錢給經理人的原因——請他們挑選表現會比一般股票好的股票。但基金經常未能超越平均績效——有些年度會有超過半數的基金績效不如市場平均報酬率，原因之一是績效的計算必須減去手續費和管理費。


    部分投資人已放棄挑選超越平均績效的基金，因為那已證明是很困難的工作，他們轉而選擇保證不管什麼情況都能與市場績效相同的基金。這種基金稱為指數型基金（index
    fund），它不需要經理人，而採自動化的操作。它只是買進特定指數的所有股票，然後抱緊它們。'
  - '[PAGE 134]


    沒有額外的開支、不必支付專家薪水、不花管理費、不需要申購手續費和解約金，也不必做任何決定。例如，一檔標普500指數基金購買標普500指數所有的500種股票。標普500指數是很有名的市場平均指數，所以當你投資這種基金時，永遠可以得到和指數一樣的績效，而以近來基金的表現來看，這類基金表現往往超越許多管理型基金。


    或者，如果你決定投資「小型股」基金，以利用小公司潛在報酬較高的優點，你可以買一檔追蹤小型股指數的基金，例如羅素2000指數（Russell 2000）。這樣你的錢將平均投資在羅素指數的2,000種指數。


    另一種可能的做法是，把一部分錢放在一檔標普500指數基金，以便從較大型的公司獲利，然後將其餘的錢放在小型股指數，以便從小型公司獲利。如此你就再也不必閱讀任何挑選共同基金的文章了，而且你的成果將超過雖然下了許多研究功夫、買的基金績效卻不如大盤的投資人。


    # 自己挑選股票


    如果你有時間和興趣，也可以展開一種刺激的終身冒險：自己挑選股票。這比投資共同基金需要更多努力，但你可以從自己選股獲得莫大的滿足。長期下來，也許你可以獲得超越大部分基金的績效。


    你的股票不會全都上漲——從來沒有選股人曾達到100％的成功率。巴菲特曾經犯錯，彼得．林區的失敗經驗可以寫滿好幾本筆記簿。但你只需要在十年內出現幾檔大贏家就很足夠了。如果你擁有'
  - '[PAGE 135]


    10檔股票，其中3檔是大贏家，就足以彌補一、二檔虧損和六、七檔表現平平的股票。


    如果你一輩子能挑中幾檔飆漲三倍的股票，那麼不管你曾經挑過多少檔賠錢的股票，你就不愁沒錢可花用了。而一旦熟練追蹤公司的發展，你就可以把更多錢投入成功的公司，減少放在虧損公司的投資。


    你可能得花一些時間讓你的投資漲三倍，但只要一輩子碰上幾檔漲三倍的股票，就足以建立可觀的財富。試看以下的計算：如果你一開始投資1萬美元，並設法讓它漲三倍5次，你的投資就變成240萬美元；如果你讓它漲三倍10次，你可以賺到5,900萬美元；如果是13次，你就是美國最富有的人了。


    事實上，你可以既投資在共同基金，又自己買股票。許多投資人同時這麼做。前面有關共同基金的大多數建議——及早開始投資的優點、要有計畫、堅守計畫、不理會崩盤和修正——也適用於你自己挑選的股票投資組合。你馬上面對兩個問題：我該怎麼挑選股票？我從哪裡找錢買它們？由於在還不知道如何選股前就把錢投入股市很危險，你應該在拿錢冒險前先做一些操練。


    你會很驚訝，有這麼多人在完全不懂股票前就冒然投資，並因而虧損許多錢！這種事很普遍。一個一輩子沒有投資經驗的人，突然領到一大筆退休金，於是盲目地把它們全部投入股市，他甚至不知道什麼是股利。這種事應該有正式訓練才對，就像要開車得先到駕訓班上課。我們不會讓沒有在練習場開過車、學會交通規則的人，冒然開車上路。'
  - '[PAGE 136]


    如果沒有人訓練你，至少你可以訓練自己，在紙上嘗試各種策略，感覺不同類型的股票操作手法。同樣的，年輕人比較占便宜，你有充裕的時間實驗想像的投資，至少可以練習一陣子，因為你未來還有數十年。等到你有錢投資時，你已經準備好真槍實彈上陣了。


    你應該聽過夢幻棒球遊戲（fantasy baseball），在遊戲中可以挑戰想像的大聯盟球隊名單，試試你的球隊平均打擊率、全壘打數等表現是多少，與實際球隊或其他夢幻球隊相比又如何？你也可以用夢幻投資組合來訓練投資股票。假設你有一筆資金——也許是10萬美元；或者你資金較雄厚，有100萬美元——可以用來買你喜歡的公司股票。例如你最喜歡的五家公司是迪士尼、耐吉、微軟、班傑瑞（Ben
    & Jerry''s）和百事。你可以把10萬美元分成五份，各投資2萬美元。以1995年4月21日為你的投資起始日，你的夢幻投資名單看起來應該像這樣：


    | 公司 | 股價（1995/4/21） | 2萬美元可買到的股數（四捨五入） |

    |------|-------------------|-------------------------------|

    | 迪士尼 | 54.75 | 365 |

    | 耐 吉 | 73.125 | 274 |

    | 百 事 | 41.25 | 485 |

    | 班傑瑞 | 12.625 | 1,584 |

    | 微 軟 | 75 | 267 |


    選好股票並寫下股價後，你可以追蹤獲利和虧損，就好像真的投資一樣。你可以比較自己的假想績效，和你父母真正投資（如果有的話）的績效，或各家共同基金、或你朋友的夢幻投資組合的成果。'
  - '[PAGE 137]


    美國各地的學校已把假想的選股帶進教室，采用經濟教育證券業基金會（Securities Industry Foundation for Economic Education）贊助和推廣的「股市遊戲」（Stock
    Market Game）。在1994-1995學年，有超過60萬名學生玩過這套遊戲。


    他們分成數個隊伍，每隊必須決定用假想的資金買哪些股票。遊戲從開始到結束約花10週時間，結果都逐一記錄，到期末股票上漲最多的隊伍贏得遊戲。各校獲勝的隊伍再與來自地方、各郡、區域或各州的贏家競賽。


    玩股市遊戲可以寓教於樂，只要教導遊戲者投資的基本原則，並且對比賽結果不要太認真。這種訓練的問題是，在短短13週、26週甚至一年期間，股價的漲跌大體上是碰運氣。練習的期間不夠長，不足以給你真正的測驗。一檔股票可能在13週後是輸家，但三年或五年後卻是贏家。或者它可能在13週後是贏家，但長期下來卻是輸家。


    長期表現良好的股票屬於長期表現良好的公司。成功的投資關鍵在於找到成功的公司。要從你的訓練學到最多東西，你必須不只是追蹤股票的價格，還要儘可能認識你選擇的公司，了解它們成功的原因。


    這帶領我們來到人們用來選股的五種基本方法。以下是各種方法的概述，從最荒唐的方法開始，到最進步的方法結束。'
  - '[PAGE 138]


    # 一、擲飛鏢


    最低層次的選股方法是對一張股票的名單丟飛鏢，射中哪一家就買那檔股票。或者你閉上眼睛，以手指代替飛鏢來點選。也許你運氣好，正好點到表現好的股票——但你也可能點錯。


    擲飛鏢方法最大的好處只能說不用費太多功夫。如果你傾向於隨機挑選股票，倒不如連這點麻煩都省下來吧，直接投資共同基金更好。


    # 二、聽明牌


    第二種低層次的選股是，有人告訴你買一檔一定會漲的股票。那個人可能是你的好朋友、你的英文老師、你的哈利叔叔、水管工人、汽車機工或圍丁。或者你無意中在巴士上聽到的消息。不知道為什麼，偷聽來的消息讓人更興奮，好像那是註定的好事。


    很可能哈利叔叔與某家公司有直接關係，他說的話不是空穴來風。這種有根據的消息可能有用——值得進一步調查。但危險的是沒有根據、只是道聽塗說的明牌。以下是典型的例子：「家庭購物網路，識貨的人正在搶進這檔股票，趕快買，晚了就買不到了。看樣子這是一檔飆股。」


    買一台50美元的烤麵包機都會貨比三家問價錢的人，會輕易為了「家庭購物網路」這種明牌投入數千美元。他們會這麼做是因為如果忽視這則明牌，讓家庭購物網路飆漲四倍，他們將無法承受錯失良機的「損失」。事實上是，如果他們沒買家庭購物網路而它漲了'
  - '[PAGE 139]


    四倍，他們也不會損失一毛錢。


    未擁有的股票絕不會讓人虧損，只有當買了家庭購物網路、而它下跌、且以低於買進的價格賣出時，人們才會虧損。


    # 三、專家意見


    你從電視或報章雜誌引述的專家得到買賣股票的消息。基金經理人、投資顧問和其他華爾街大師也發表源源不斷的專家意見，你不是唯一聽到這些意見的人，數百萬名讀者和觀眾，都和你聽到一樣的見解。


    儘管如此，如果你無法抗拒聽消息買股票，寧可聽專家意見，也不要理會哈利叔叔的明牌。相對於哈利叔叔根本不明究裡，就得出「看樣子這是一檔飆股」的結論，專家很可能已經做了很多研究才得出看法。


    專家意見的問題是，你沒有辦法知道專家什麼時候會改變看法——除非他又上電視告訴觀眾，而你剛好看到節目。否則你還會抱著股票不放，因為你認為專家喜歡它，雖然他已經改變主意了。


    # 四、證券經紀商的買進名單


    「綜合型」的證券經紀商向來樂於推薦你該買哪些股票，通常這些股票不是來自經紀人的研究，而是在總公司幕後工作的分析師。這些訓練精良的分析師專門探究公司或企業集團的營運狀況，他們根據挖掘出來的證據發出買進和賣出股票的訊號。'
  - '[PAGE 140]


    證券經紀商蒐集旗下分析師的買進訊號，列成名單，寄給所有經紀人，包括你的經紀人——如果你有的話。通常這份買進名單經過分門別類：適合保守型投資的股票、適合積極型投資的股票，以及發放股利的股票等。


    你可以和經紀人一起從買進名單中挑選股票，建立一個極佳的投資組合。如此你就可以借助證券商的研究，同時能夠選擇你最喜歡的「買進」股票。比之仰賴專家意見，這有一個大優點：如果證券商改變主意，把你的股票從買進名單移到賣出名單，你的經紀人會告訴你。如果他不告訴你，就把這個經紀人列入你的賣出名單吧。


    # 五、自己做研究


    這是最高層次的選股。你選擇股票是因為你喜歡這家公司，而你喜歡這家公司是因為你徹底研究過它。也許你在挑選夢幻投資組合的五家最愛公司時已經做過研究，例如前面列出的迪士尼、耐吉、班傑瑞、百事和微軟。


    你愈研究如何投資公司，就愈不必依賴其他人的意見，也愈能評估別人提供的明牌。你可以自己決定該買什麼股票，及何時買進。


    你將需要兩種資訊：靠你深入觀察獲得的資訊，以及靠你研究數字獲得的資訊。第一種資訊可以從每次你走進麥當勞、太陽眼鏡屋（Sunglass Hut International）或任何上市公司擁有的商店就開始蒐集。如果你正好在這類商店工作最好。'
  - '[PAGE 141]


    你可以自己觀察營運是否有效率或很笨拙，人手過多或不足，組織條理分明或亂成一團。你可以評估員工的士氣是高或低，也可以感覺管理團隊花錢沒有節制或很謹慎。


    你也可以觀察商店的顧客，他們是否在收銀櫃檯前大排長龍，或人氣空虛？他們對商品很滿意，或經常抱怨？這些細節可以告訴你許多攸關公司本身品質的訊息。你看過亂糟糟的蓋普（Gap）和門可羅雀的麥當勞嗎？任何蓋普或麥當勞連鎖店的員工都可以看出自家公司的營運有多成功，並根據觀察把閒錢投資在公司。


    一家商店不必等到倒閉就可能流失顧客，只要有其他商店提供更好的商品和服務、賣同樣或更低的價格，顧客就會流失。員工是最早知道競爭者搶走顧客的人，沒有人能阻擋他們投資競爭者。


    即使你不是上市公司的員工，從顧客的角度也可看出端倪。每次你光顧一家商店、吃漢堡或買新太陽眼鏡時，都可獲得寶貴的訊息。藉由四處瀏覽，你可以看到哪些東西暢銷、哪些賣不出去。藉由觀察你的朋友，你知道他們買哪種電腦、喝什麼品牌的汽水、看什麼電影、銳跑鞋是否流行。這些都是可引導你正確選股的重要線索。


    你會很驚訝有多少人 supone 毫不在意這些線索。數百萬人在各行各業工作，每天接觸潛在的投資對象，卻從未利用第一手觀察的好機會。醫生知道哪家藥廠生產最好的藥，但他們不常買股票。銀行家知道哪家銀行最強健，但他們不一定買銀行股。商店經理人和商場的管理員可以看到每月銷售數字，所以他們知道哪些零售商賣出最多商品。但有多少商場經理藉投資特殊零售股來多賺點錢？'
  - '[PAGE 142]


    一旦你開始透過選股人的眼光看世界、尋找潛在的投資，你將開始注意你感興趣的公司跟哪些公司打交道。如果你<|message|>在醫院工作，你將接觸製造縫合線、外科手術衣、注射器、床與床墊、X光設備、心電圖機的公司；幫助醫院降低成本的公司；承保醫療保險的公司；處理帳務的公司。雜貨店是另一個觀察公司的好地方，每一條貨架通道都可找到數十家公司。


    你也開始注意到競爭者的表現是否超越僱用你的公司。當人們排隊買克萊斯勒廂形車時，知道克萊斯勒的獲利即將創新高的不只是克萊斯勒的銷售員，下個街區的別克（Buick）業務代表也知道，因為當他們坐在空蕩的展示間時，發現許多別克的顧客已轉投克萊斯勒的懷抱。


    接下來讓我們看數字。一家公司製造受歡迎的產品，不表示你應該自動買它的股票，你還必須知道更多才能決定是否投資。你必須知道這家公司是否花錢明智，或者隨便浪費。你必須知道它欠銀行多少錢，過去幾年來它賺多少錢，未來預期能賺多少。你必須知道股票的價格是否合理、便宜，或者太貴。


    你必須知道這家公司是否發放股利，如果是，股利多少，以及多久提高股利一次。盈餘、銷售、債務、股利、股價——這些是選股人必須追蹤的一些重要數字。


    人們進研究所學習如何閱讀和詮釋這些數字，所以這主題不是這本入門書所能深入討論的。我們能做的最大程度是，讓你概括了解公司財務的基本成分，以便你開始知道如何拼湊這些數字。你將在附錄〈解讀數字——如何看懂資產負債表〉中找到這些資訊。'
  md: '

    這個新運動的目標是，製作較簡短、明瞭的說明書，讓人們不用讀法律系也能了解。如果運動成功，管理基金的公司和投資基金的持股人都將受益。


    經過長期遭到大眾的冷落後，共同基金在1960年代末再度受到歡迎，全美各地的都有兼職或加夜班的老師、店員、職員和各式各樣的人在社區推銷共同基金。但結果令人大失所望，因為數百萬名基金投資人正好趕上1969-1973年的空頭市場，是1929年以後最淒慘的空頭行情。


    在這段股票連續下跌的時期，部分共同基金股價重挫75%——這是擁有共同基金股票並非穩賺不賠的又一證明。投資人因虧損而大受衝擊，爭相退出股市，以遠低於買進價格拋售持股，寧可把錢存入儲蓄帳戶，並發誓下次接到基金推銷員的電話將馬上掛斷。


    此後將近十年間，股票共同基金遭到投資人唾棄，高品質的基金備受冷落而了無生機，聰明的基金經理人可以找到許多可買的好股票，而且價格十分低廉，但他們沒有錢可以買進股票，因為基金無法吸引顧客投資。


    隨著股市在1980年代回春，共同基金業也苦盡甘來，且此後一片欣欣向榮，基金數量達5,655檔，並持續增加，光過去兩年新設的基金就超過1,300檔。每天都有新基金成立：債券基金、貨幣市場基金和股票基金。如果以這麼快的速度增加，美國的股票基金檔數很快就會超過股票檔數。


    ## 現在就買基金


    光說明不同種類的股票基金就需要一整本書：全方位基金、單產業基金、多產業基金、小型股、大型股、純粹型、混合型、外國基金、本國基金、社會責任基金、無社會責任基金、成長型、價值型、收益型，以及成長收益型基金等。基金的分類複雜到還有專門購買其他基金股票的「組合基金」（funds
    of funds）。


    你可以日以繼夜研究如何選擇正確的基金，但你可能只看懂公開說明書一半的資訊。如果那些說明書、小冊子和文件全都倒在你身上，可能需要一支救援隊花幾個小時把你救出來。事實上，每年有那麼多精力花在選擇正確的基金上，這已變成一件會讓人發狂的麻煩事。如果能省下尋找完美共同基金的麻煩，人們會更快樂、更放鬆，對狗和小孩更和善，還可以省下大筆的心理醫師帳單。


    我們冒著可能加深這種偏執的風險，提出以下幾點建議：


    - 1. 你可以直接向管理基金的公司購買共同基金，例如德瑞弗斯（Dreyfus）、富達（Fidelity）和史卡德（Scudder）。你也可以透過股票經紀商購買基金，雖然經紀商可能無法賣你想要的基金。


    - 2. 經紀商必須賺錢，且有時他們賣自家產品可以獲得更高的佣金。說服你買自家共同基金可能符合他們的利益，但未必符合你的利益。如果經紀人推薦你產品，永遠要弄清楚那對經紀商有什麼好處。要求他（或她）提供所有可得的資訊。也許有一些基金和經紀人推薦的基金類似，但整體來看績效更好。


    3. 如果你是長期投資人，別理會債券基金和混合基金（同時投資股票和債券的基金），只買純股票基金。股票在20世紀美國的九十年中，有八十年績效超越債券（債券在1980年代績效以些微差距名列第二，但股票仍然略勝一籌）。在1990年代上半，股票再度大幅領先債券。如果你不100%投資股市，長期來看你將少賺很多錢。


    4. 選擇正確的基金不比選擇正確的汽車機師容易，但在選擇基金時，至少有過去的績效指引你。除非你訪問數十名顧客，否則沒有簡單的方法可判斷汽車機師是優秀、怠劣或平庸，但你可以輕易判斷基金符合這些評語的哪一種。這一切歸結都是年報酬率。一檔過去十年每年報酬率18%的基金，比年報酬率14%、目標相似的同類基金傑出。但在你憑著過去的記錄投資一檔基金前，要先確定達成此卓越績效的經理人仍為該基金操盤。


    5. 長期來看，投資小公司比大公司的獲利高。今日成功的小公司將變成明日的沃爾瑪、家得寶（Home Depot）和微軟。所以投資小公司（所謂小型股）的基金以大幅差距打敗「大型股」基金也就不足為奇。（大型股指的是「市值」〔market
    capitalization〕金額較大的公司，也就是公司發行的總股票股數乘以目前的股價。）只要挑中兩家未來的沃爾瑪，就足以讓基金的績效脫穎而出。沃爾瑪的股價在二十年間上漲超過250倍。


    由於小型股的波動往往比大型股劇烈，小型股基金的漲跌幅度會比其他類型的基金更大。但如果你有鐵胃可以承受較大的上下起伏，投資小型股可以給你更高的報酬。


    6. 如果能投資已延續好幾季、且交出亮麗績效的老牌基金，何必冒險投資剛成立的新基金？從理財雜誌如《巴隆》（Barron''s）和《富比世》可以找到許多連續多年保持頂尖績效的基金。《巴隆》每年兩次公布完整的基金介紹，由理柏分析（Lipper
    Analytical）提供詳盡分析；理柏分析是一家高品質的研究公司，由著名的基金觀察家理柏（Michael Lipper）經營。《華爾街日報》一年四次刊登類似的報導。


    如果仍需要更多有關特定基金的資訊，可從追蹤數千家基金、並每月公布報告的晨星公司（Morningstar）獲得。晨星為所有這些基金的安全性做排名，評比它們的績效，並提供經理人是誰，和投資組合有哪些股票等資訊，是目前提供投資人所需各種資訊的最佳來源。


    7. 經常更換基金划不來。有些投資人養成更換基金的習慣，希望搶搭最新的熱門績優基金。這不但麻煩且沒有價值。研究顯示，名列前茅一年的基金很少在第二年又重複同樣的好表現。嘗試抓住贏家是傻瓜瞎忙的事，結果可能反而找到輸家。你最好是挑選一家長期績效卓越的基金，然後長期守住它。


    8. 除了每年向投資人收取管理費外，有些基金也收取申購手續費（entry fee）。申購手續費通常是3%到4%，這表示當你投資收取申購手續費的基金時，你的錢一開始就先損失了3%到4%。


    當然也有許多不收申購手續費的基金。平均來看，收取或不收申購手續費的基金表現一樣好。這就和收服務費的餐廳不一定服務更好的道理一樣。


    你留在一檔基金愈久，是否收取申購手續費就愈不重要。經過十年或十五年，如果該基金表現不錯，你就會忘記是否曾支付3%或4%的申購手續費加入它了。


    年度管理費比申購手續費更值得注意，因為那是每年從基金扣除的費用。維持最低水準開支的基金（低於1%），比開支較高的基金（2%或更高）具有根本的優勢。高成本基金的經理人在不利的條件下工作，他們每年表現必須比低成本基金多出0.5%到1.5%，才能交出同樣的績效。


    9. 絕大多數基金僱用經理人是希望打敗市場的平均報酬率。這是你付錢給經理人的原因——請他們挑選表現會比一般股票好的股票。但基金經常未能超越平均績效——有些年度會有超過半數的基金績效不如市場平均報酬率，原因之一是績效的計算必須減去手續費和管理費。


    部分投資人已放棄挑選超越平均績效的基金，因為那已證明是很困難的工作，他們轉而選擇保證不管什麼情況都能與市場績效相同的基金。這種基金稱為指數型基金（index
    fund），它不需要經理人，而採自動化的操作。它只是買進特定指數的所有股票，然後抱緊它們。


    沒有額外的開支、不必支付專家薪水、不花管理費、不需要申購手續費和解約金，也不必做任何決定。例如，一檔標普500指數基金購買標普500指數所有的500種股票。標普500指數是很有名的市場平均指數，所以當你投資這種基金時，永遠可以得到和指數一樣的績效，而以近來基金的表現來看，這類基金表現往往超越許多管理型基金。


    或者，如果你決定投資「小型股」基金，以利用小公司潛在報酬較高的優點，你可以買一檔追蹤小型股指數的基金，例如羅素2000指數（Russell 2000）。這樣你的錢將平均投資在羅素指數的2,000種指數。


    另一種可能的做法是，把一部分錢放在一檔標普500指數基金，以便從較大型的公司獲利，然後將其餘的錢放在小型股指數，以便從小型公司獲利。如此你就再也不必閱讀任何挑選共同基金的文章了，而且你的成果將超過雖然下了許多研究功夫、買的基金績效卻不如大盤的投資人。


    ## 自己挑選股票


    如果你有時間和興趣，也可以展開一種刺激的終身冒險：自己挑選股票。這比投資共同基金需要更多努力，但你可以從自己選股獲得莫大的滿足。長期下來，也許你可以獲得超越大部分基金的績效。


    你的股票不會全都上漲——從來沒有選股人曾達到100％的成功率。巴菲特曾經犯錯，彼得．林區的失敗經驗可以寫滿好幾本筆記簿。但你只需要在十年內出現幾檔大贏家就很足夠了。如果你擁有


    10檔股票，其中3檔是大贏家，就足以彌補一、二檔虧損和六、七檔表現平平的股票。


    如果你一輩子能挑中幾檔飆漲三倍的股票，那麼不管你曾經挑過多少檔賠錢的股票，你就不愁沒錢可花用了。而一旦熟練追蹤公司的發展，你就可以把更多錢投入成功的公司，減少放在虧損公司的投資。


    你可能得花一些時間讓你的投資漲三倍，但只要一輩子碰上幾檔漲三倍的股票，就足以建立可觀的財富。試看以下的計算：如果你一開始投資1萬美元，並設法讓它漲三倍5次，你的投資就變成240萬美元；如果你讓它漲三倍10次，你可以賺到5,900萬美元；如果是13次，你就是美國最富有的人了。


    事實上，你可以既投資在共同基金，又自己買股票。許多投資人同時這麼做。前面有關共同基金的大多數建議——及早開始投資的優點、要有計畫、堅守計畫、不理會崩盤和修正——也適用於你自己挑選的股票投資組合。你馬上面對兩個問題：我該怎麼挑選股票？我從哪裡找錢買它們？由於在還不知道如何選股前就把錢投入股市很危險，你應該在拿錢冒險前先做一些操練。


    你會很驚訝，有這麼多人在完全不懂股票前就冒然投資，並因而虧損許多錢！這種事很普遍。一個一輩子沒有投資經驗的人，突然領到一大筆退休金，於是盲目地把它們全部投入股市，他甚至不知道什麼是股利。這種事應該有正式訓練才對，就像要開車得先到駕訓班上課。我們不會讓沒有在練習場開過車、學會交通規則的人，冒然開車上路。


    如果沒有人訓練你，至少你可以訓練自己，在紙上嘗試各種策略，感覺不同類型的股票操作手法。同樣的，年輕人比較占便宜，你有充裕的時間實驗想像的投資，至少可以練習一陣子，因為你未來還有數十年。等到你有錢投資時，你已經準備好真槍實彈上陣了。


    你應該聽過夢幻棒球遊戲（fantasy baseball），在遊戲中可以挑戰想像的大聯盟球隊名單，試試你的球隊平均打擊率、全壘打數等表現是多少，與實際球隊或其他夢幻球隊相比又如何？你也可以用夢幻投資組合來訓練投資股票。假設你有一筆資金——也許是10萬美元；或者你資金較雄厚，有100萬美元——可以用來買你喜歡的公司股票。例如你最喜歡的五家公司是迪士尼、耐吉、微軟、班傑瑞（Ben
    & Jerry''s）和百事。你可以把10萬美元分成五份，各投資2萬美元。以1995年4月21日為你的投資起始日，你的夢幻投資名單看起來應該像這樣：


    | 公司 | 股價（1995/4/21） | 2萬美元可買到的股數（四捨五入） |

    |------|-------------------|-------------------------------|

    | 迪士尼 | 54.75 | 365 |

    | 耐吉 | 73.125 | 274 |

    | 百事 | 41.25 | 485 |

    | 班傑瑞 | 12.625 | 1,584 |

    | 微軟 | 75 | 267 |


    選好股票並寫下股價後，你可以追蹤獲利和虧損，就好像真的投資一樣。你可以比較自己的假想績效，和你父母真正投資（如果有的話）的績效，或各家共同基金、或你朋友的夢幻投資組合的成果。


    美國各地的學校已把假想的選股帶進教室，采用經濟教育證券業基金會（Securities Industry Foundation for Economic Education）贊助和推廣的「股市遊戲」（Stock
    Market Game）。在1994-1995學年，有超過60萬名學生玩過這套遊戲。


    他們分成數個隊伍，每隊必須決定用假想的資金買哪些股票。遊戲從開始到結束約花10週時間，結果都逐一記錄，到期末股票上漲最多的隊伍贏得遊戲。各校獲勝的隊伍再與來自地方、各郡、區域或各州的贏家競賽。


    玩股市遊戲可以寓教於樂，只要教導遊戲者投資的基本原則，並且對比賽結果不要太認真。這種訓練的問題是，在短短13週、26週甚至一年期間，股價的漲跌大體上是碰運氣。練習的期間不夠長，不足以給你真正的測驗。一檔股票可能在13週後是輸家，但三年或五年後卻是贏家。或者它可能在13週後是贏家，但長期下來卻是輸家。


    長期表現良好的股票屬於長期表現良好的公司。成功的投資關鍵在於找到成功的公司。要從你的訓練學到最多東西，你必須不只是追蹤股票的價格，還要儘可能認識你選擇的公司，了解它們成功的原因。


    這帶領我們來到人們用來選股的五種基本方法。以下是各種方法的概述，從最荒唐的方法開始，到最進步的方法結束。


    ## 一、擲飛鏢


    最低層次的選股方法是對一張股票的名單丟飛鏢，射中哪一家就買那檔股票。或者你閉上眼睛，以手指代替飛鏢來點選。也許你運氣好，正好點到表現好的股票——但你也可能點錯。


    擲飛鏢方法最大的好處只能說不用費太多功夫。如果你傾向於隨機挑選股票，倒不如連這點麻煩都省下來吧，直接投資共同基金更好。


    ## 二、聽明牌


    第二種低層次的選股是，有人告訴你買一檔一定會漲的股票。那個人可能是你的好朋友、你的英文老師、你的哈利叔叔、水管工人、汽車機工或圍丁。或者你無意中在巴士上聽到的消息。不知道為什麼，偷聽來的消息讓人更興奮，好像那是註定的好事。


    很可能哈利叔叔與某家公司有直接關係，他說的話不是空穴來風。這種有根據的消息可能有用——值得進一步調查。但危險的是沒有根據、只是道聽塗說的明牌。以下是典型的例子：「家庭購物網路，識貨的人正在搶進這檔股票，趕快買，晚了就買不到了。看樣子這是一檔飆股。」


    買一台50美元的烤麵包機都會貨比三家問價錢的人，會輕易為了「家庭購物網路」這種明牌投入數千美元。他們會這麼做是因為如果忽視這則明牌，讓家庭購物網路飆漲四倍，他們將無法承受錯失良機的「損失」。事實上是，如果他們沒買家庭購物網路而它漲了四倍，他們也不會損失一毛錢。


    未擁有的股票絕不會讓人虧損，只有當買了家庭購物網路、而它下跌、且以低於買進的價格賣出時，人們才會虧損。


    ## 三、專家意見


    你從電視或報章雜誌引述的專家得到買賣股票的消息。基金經理人、投資顧問和其他華爾街大師也發表源源不斷的專家意見，你不是唯一聽到這些意見的人，數百萬名讀者和觀眾，都和你聽到一樣的見解。


    儘管如此，如果你無法抗拒聽消息買股票，寧可聽專家意見，也不要理會哈利叔叔的明牌。相對於哈利叔叔根本不明究裡，就得出「看樣子這是一檔飆股」的結論，專家很可能已經做了很多研究才得出看法。


    專家意見的問題是，你沒有辦法知道專家什麼時候會改變看法——除非他又上電視告訴觀眾，而你剛好看到節目。否則你還會抱著股票不放，因為你認為專家喜歡它，雖然他已經改變主意了。


    ## 四、證券經紀商的買進名單


    「綜合型」的證券經紀商向來樂於推薦你該買哪些股票，通常這些股票不是來自經紀人的研究，而是在總公司幕後工作的分析師。這些訓練精良的分析師專門探究公司或企業集團的營運狀況，他們根據挖掘出來的證據發出買進和賣出股票的訊號。


    證券經紀商蒐集旗下分析師的買進訊號，列成名單，寄給所有經紀人，包括你的經紀人——如果你有的話。通常這份買進名單經過分門別類：適合保守型投資的股票、適合積極型投資的股票，以及發放股利的股票等。


    你可以和經紀人一起從買進名單中挑選股票，建立一個極佳的投資組合。如此你就可以借助證券商的研究，同時能夠選擇你最喜歡的「買進」股票。比之仰賴專家意見，這有一個大優點：如果證券商改變主意，把你的股票從買進名單移到賣出名單，你的經紀人會告訴你。如果他不告訴你，就把這個經紀人列入你的賣出名單吧。


    ## 五、自己做研究


    這是最高層次的選股。你選擇股票是因為你喜歡這家公司，而你喜歡這家公司是因為你徹底研究過它。也許你在挑選夢幻投資組合的五家最愛公司時已經做過研究，例如前面列出的迪士尼、耐吉、班傑瑞、百事和微軟。


    你愈研究如何投資公司，就愈不必依賴其他人的意見，也愈能評估別人提供的明牌。你可以自己決定該買什麼股票，及何時買進。


    你將需要兩種資訊：靠你深入觀察獲得的資訊，以及靠你研究數字獲得的資訊。第一種資訊可以從每次你走進麥當勞、太陽眼鏡屋（Sunglass Hut International）或任何上市公司擁有的商店就開始蒐集。如果你正好在這類商店工作最好。


    你可以自己觀察營運是否有效率或很笨拙，人手過多或不足，組織條理分明或亂成一團。你可以評估員工的士氣是高或低，也可以感覺管理團隊花錢沒有節制或很謹慎。


    你也可以觀察商店的顧客，他們是否在收銀櫃檯前大排長龍，或人氣空虛？他們對商品很滿意，或經常抱怨？這些細節可以告訴你許多攸關公司本身品質的訊息。你看過亂糟糟的蓋普（Gap）和門可羅雀的麥當勞嗎？任何蓋普或麥當勞連鎖店的員工都可以看出自家公司的營運有多成功，並根據觀察把閒錢投資在公司。


    一家商店不必等到倒閉就可能流失顧客，只要有其他商店提供更好的商品和服務、賣同樣或更低的價格，顧客就會流失。員工是最早知道競爭者搶走顧客的人，沒有人能阻擋他們投資競爭者。


    即使你不是上市公司的員工，從顧客的角度也可看出端倪。每次你光顧一家商店、吃漢堡或買新太陽眼鏡時，都可獲得寶貴的訊息。藉由四處瀏覽，你可以看到哪些東西暢銷、哪些賣不出去。藉由觀察你的朋友，你知道他們買哪種電腦、喝什麼品牌的汽水、看什麼電影、銳跑鞋是否流行。這些都是可引導你正確選股的重要線索。


    你會很驚訝有多少人 supuesto 毫不在意這些線索。數百萬人在各行各業工作，每天接觸潛在的投資對象，卻從未利用第一手觀察的好機會。醫生知道哪家藥廠生產最好的藥，但他們不常買股票。銀行家知道哪家銀行最強健，但他們不一定買銀行股。商店經理人和商場的管理員可以看到每月銷售數字，所以他們知道哪些零售商賣出最多商品。但有多少商場經理藉投資特殊零售股來多賺點錢？


    一旦你開始透過選股人的眼光看世界、尋找潛在的投資，你將開始注意你感興趣的公司跟哪些公司打交道。如果你

