    奇異公司執行長威爾許（Jack Welch）比艾爾頓強（Elton John）更重要嗎？協助默克藥廠（Merck）發展許多治療疾病新藥的瓦吉洛斯（Roy Vagelos），比茱蒂佛斯特（Jodie
    Foster）、黛安娜王妃或俠客歐尼爾（Shaquille O''Neal）重要嗎？如果用投票來決定，我會投給威爾許和瓦吉洛斯。然而在唐先生甜甜圈（Dunkin
    Donut）電視廣告上出現的糕餅師傅，可能比我們提到的大部分人還出名。


    你可能注意到，我們常提到兩種英雄——一種是創立公司的人，一種是讓公司保持營運的人。他們是今日市場的「看不見的手」，而我們相信他們會讓1776年時的亞當。史密斯感到欣慰。在其他國家與他們同類的英雄，正在世界各地執行資本主義家的任務。


    我們很遺憾看到女性和少數族群在這些英雄中只占少數，（在本書寫作時）只有一位女性擔任美國上市企業最高主管——蓋普共同創辦人費雪（Doris Fisher）。我們希望隨著愈來愈多年輕人被吸引跨入商界，女性和少數族群也會有更多掌管上市公司的機會。


