    沒落的産業中崛起的鋼鐵公司。艾弗森不浪費錢在瑣碎的事上，所以他把紐柯總部設在南加州達林頓一座零售商場的樓上。紐柯剛開始是一個鋼鐵買家，但很快學會製造自己的高品質鋼鐵，達到競爭對手美國鋼鐵一直無法企及的水準。紐柯的鋼鐵產量到2000年將趕上美國鋼鐵——美國史上第一家10億美元公司。


    史登柏格（Tom Sternberg）是史泰博公司（Staples）的英雄。他曾擬定一個辦公室用品超商的企業計畫，但沒有人注意，最後他自己付諸實行，在麻州布萊頓開設史上第一家辦公室用品超級商店。那不過是十年前的事，到今日，辦公室用品超商業即將變成一個100億美元的產業，而且以目前的成長速度，到2000年產業規模將達到200億美元。


    有一對兄弟同時登上英雄榜，他們原本走上不同的道路。吉姆．伯克（Jim Burke）進入大公司，最後坐上嬌生公司董事長的寶座，而丹恩．伯克（Dan Burke）走的是小公司的路，他加入的小傳播公司後來發展成極為成功的首都／美國廣播公司（Capital
    Cities / ABC），最近又同意與迪士尼合併。


    美國的富強仰賴小公司變大，以及大公司變得更有競爭力。如果25家小公司崛起時，25家我們名單上的舊公司也逐一倒閉，結果將是零就業成長，甚至可能是損失大量就業。


    想像有數十家財星500大公司（Fortune 500）破產而不是裁員和調整組織，美國可能在1980年代失去1,500萬個工作，那麼即使到今日有全國各地小企業創造的2,100萬個工作，美國的失業率也可能高達20%。


    別以為這不可能發生。如果公司決定不顧生產力留住每一名員工、坐等外國競爭者搶光它們的生意，這種情況就會發生。如果不是美國的英雄崛起，鼓舞他們的同事盡最大努力，這種情況也會發生。


    美國很幸運既有小公司不斷崛起，同時又有大公司持續表現優異。你在歐洲看不到這種組合，那裡缺少小公司。反觀我們的名單有這麼多選擇，可以列滿好幾頁。


    要把我們的名單刪減到25家很困難，我們不得不割捨許多其他優良公司的英雄。我們可以輕鬆選出250家在過去二十年快速成長的小公司，加上100家自我改造並更上一層樓的大公司。


    我們也可以列出全是軟體、電腦和電子業明星的名單（思科〔Cisco〕、昇陽〔Sun Microsystems〕和美光科技〔Micron Technology〕），使我們25家小公司的表現更亮眼，但我們嘗試從不同行業挑出代表，以顯示各式各樣的公司都能在美國快速成長。我們的名單包括玩具公司、薪資處理服務商、航空公司，甚至有一家生產用來強化輪胎的「碳煙」（carbon
    black）。這家公司叫卡博特（Cabot），曾經歷一段起伏不定的時期，最後終於扭轉頹勢。它是25家公司中唯一起死回生的例子。


    這些英雄名單也再度說明，投資大公司或小公司都可以賺錢，但如果你專精在小公司，你可以做得特別好。在大公司中你可以找到三個「10疊打」的公司，意思是投資人可以賺到10倍的錢——房利美、吉列，和可口可樂都算是。在1985-1995年間，在小公司中則有六家「10疊打」公司、三家「25疊打」，和三家「40到50疊打」的強棒。安進從1.36美元漲到84美元，甲骨文從0.83美元漲到42美元，康柏則從1.69美元漲到50美元。這些股票的表現確實令人刮目相看。


    現在你明白了，要想從投資股票賺錢不需要每一檔股票都買對。假設你擁有十檔小公司股票，其中三檔的銷售從4,000萬美元減少到零，股價從20美元跌到一文不值。這些損失將由一檔銷售從4,000萬美元成長到8億美元、股價從20美元飆漲到400美元的大贏家來彌補，而且還綽綽有餘。


    新公司上市的速度快得令人目不暇給，從1993年到1995年中，有超過1,700檔新股票初次上市。投資人在這些初出茅廬的公司押注1,000億美元，其中有些會失敗，但從1,700檔股票中，你將找到另一檔安進、另一檔史泰博，以及另一檔家得寶。


