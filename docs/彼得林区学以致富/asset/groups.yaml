    一個人的生命終結於葬儀社（undertaker）安排的墓碑下，一家上市公司的生命則始於承銷商（underwriter）刊登的一則墓碑。這是華爾街眾多奇怪的金融術語之一。


    「小投資人」（這個詞是用來形容投資組合的規模，而非人的身材）很少有機會在首次公開發行中購買小型、新創公司的股票，這些新發行的股票通常保留給「大投資人」，例如管理數千萬美元、甚至數十億美元資金的基金。


    這批460萬股蘋果股票在一小時內銷售一空，共同基金的經理人爭搶買進能買到的任何股數。一如慣例，新手投資人沒有機會參與買股，尤其是在麻州。許多州有「藍天」（blue-sky）法規保護公眾，避免他們被詐欺的促銷所騙，而麻州監管當局把蘋果列入此一類別。他們實在錯得離譜。


    不管如何，上市售股完成後，收入便由各方分配。一小部分錢給承銷商，即主辦巡迴說明會和上市事宜的投資銀行。另一部分錢給公司創辦人，以及天使和創投資本家，因為他們都各自貢獻一部分股票供銷售。其餘的錢歸公司，這些資本將用來擴張營運。


    在這時，公司有了一批新業主——在上市售股中購買股票的投資人。就是他們的錢被用來支付承銷商，分配給創辦人等股東，並協助公司擴張。接下來就是人人等待的時刻——股票開始在證券交易所交易。


    蘋果於1980年12月在那斯達克股市的店頭交易市場（over-the-counter market）上市。現在任何人都可以買蘋果股票了，包括所有在首次發行中被排拒在外的小投資人。通常剛發行的股票可能上漲幾天、幾週或幾個月，漲完後漸漸歸於平淡，股價也緩緩回跌。這是小投資人撿便宜的好機會。經過12個月的交易後，蘋果股價已從上市價22美元跌到14美元。


    這種情況不常發生，但發生的次數已多到小投資人經常有機會嘲笑那些以上市價買股的投資大戶。


    公司創辦人不大一定要在首次公開發行中賣出所有公司股票，正常情況下他們只會賣出部分持股，賈伯斯、沃茲尼克、馬庫拉就是這樣。他們留下大部分蘋果股票，這使他們在上市首日交易後的每人淨值都超過1億美元。對賈伯斯和沃茲尼克來說，四年前1,300美元的初始投資能有這樣的成果，算是相當不賴的回報了。（馬庫拉的投資是25萬美元——也是很不錯的投資。）


    只有在資本主義體制下，後院發明家和大學中輟生才能創立事業，並發展成僱用數千人、繳納稅金，和讓世界變得更美好的公司。共產主義國家的人民從未有這種機會。


    公司唯一從自家股票賺錢的機會就是公開發行時。當你買一輛二手克萊斯勒廂形車，對克萊斯勒沒有任何好處；當你在股票市場買一股克萊斯勒股票，對克萊斯勒也沒有好處。證券市場每週有數百萬股克萊斯勒股票換手，同樣對克萊斯勒也沒有益處。這些股票被持有股票的個人買進和賣出，就像人們彼此買賣二手車。錢直接從個人傳遞給另一個人。


    只有當你買下新的克萊斯勒汽車時，公司才能從中獲利。同樣的，只有在發行新股時，公司才能從賣股獲利。公司可能終其一生只發行新股一次，亦即在IPO時；但它也可以再度發行所謂的「增資股」（secondary）。


    ## 年輕的公司


    年輕的公司充滿活力、聰明點子，和對未來的希望。它富於期望，但缺少經驗。它擁有從公開發行籌得的資金，因此在這個階段很可能不必操心支付帳單。它期望能在初次募得的資金用光前就能開始賺錢，但這一點誰也無法保證一定會實現。


    在茁壯成長期間，公司能否生存還未有定數，許多壞事可能發生。公司可能有很棒的產品點子，但可能在製造產品並出貨到商店前，資金已經告罄。或者原本以為很棒的點子後來證明並沒有那麼棒，或者公司被某個宣稱更早有這點子的人控告盜用創意。如果陪審團同意原告的說法，公司可能被迫付出還沒賺到的數百萬美元。也可能那個好點子變成一項好產品後，卻未能通過政府的檢驗，所以不能在這個國家銷售。也許另一家公司設計出更棒的產品，功能更好、更便宜，或又好又便宜。


    在競爭激烈的產業，公司隨時在淘汰彼此。電子業是個好例子。新加坡一座實驗室的一些天才，發明出一種更好的繼電器開關，並在六個月後推出市場，使其他製造商生產的舊繼電器開關乏人問津。我們不難了解為什麼新事業有一半會在五年內倒閉，還有為什麼大部分破產發生在競爭的產業。


    由於有各種災難可能降臨一家尚處於高風險青少年期的公司，擁有股票的人必須藉著密切注視公司的發展，來保護他們的投資。你不能隨便買進股票後就不聞不問、忘掉它們，尤其必須密切注意年輕公司的每一步發展。它們通常處於危險階段，稍有不慎就會破產或倒閉。特別重要的是，要評估它們的財務實力——年輕公司最大的問題是資金耗盡。


    當人們出去度假時，他們帶的衣服往往是實際所需的兩倍，但帶的錢卻只有一半。年輕公司在錢這方面也有同樣的問題：他們身邊的錢太少。


    現在講到優點：年輕公司從零開始，成長速度可以很快。它規模小、躁動不安，有很大的空間可以往各個方向發展。這是年輕公司動起來可以超越中年公司的原因，因為後者已經歷成長的衝刺期，過了巔峰狀態。


    ## 中年的公司


    來到中年的公司比年輕公司穩定，它們已經建立信譽，也從錯誤中學到許多東西。它們的業務順利，否則也不會有今日的成就。它們已證明自己值得信賴，可能銀行裡有很多存款，並與銀行家建立起良好的關係，所以必要時它們可以借更多錢。


    換句話說，它們已進入一個舒服的穩定模式。仍在成長，但不像過去那麼快速。它們必須努力保持身材，就像我們達到中年時都會做的事。如果讓自己放鬆太久，更精實、更凶悍的競爭者就可能冒出來挑戰它們。


    公司可能出現中年危機，就像人一樣。過去做的事似乎已不再管用。它放棄舊常規，到處尋找新身份。這種危機很常見，蘋果就曾經發生。


    在1980年底蘋果剛上市後，它推出一顆檸檬：蘋果三號（Apple III）。生產陷於停頓，等候解決問題，但為時太晚。消費者已喪失對蘋果三號的信心，甚至喪失對整家公司的信心。


    一家企業最重要的莫過於信譽。一家餐廳可能有百年歷史，獎狀掛滿整個牆壁，但只要一次食物中毒，或一個新廚師搞砸了客人點的菜，一世紀的英名就付諸流水。因此為了從蘋果三號的慘敗復原，蘋果必須快速行動。於是管理部門的人頭滾落，好幾位主管遭降級。


    蘋果開發新軟體，並在歐洲成立辦公室，部分電腦款式率先配備硬碟。往好的方面看，蘋果1982年的營收達10億美元；但壞的方面是，它的生意被主要對手IBM搶走。IBM正入侵蘋果的領土——個人電腦。


    但蘋果未專注在最擅長的領域，反而嘗試切入IBM的領域——企業電腦市場——來還擊。蘋果設計出造型很時髦的麗莎（Lisa），配備新裝置滑鼠，但麗莎的銷售成績仍不理想。蘋果的盈餘大幅滑落，股價隨之重挫，在一年內跌了50%。


    蘋果創立不到十年，已完全進入中年。投資人大失所望，公司管理階層壓力沉重，員工信心低落，紛紛跳槽其他公司。總裁馬庫拉辭職，前百事總裁史卡利（John Sculley）被延攬來解救危機。史卡利不是電腦專家，但他深諳行銷之道，而蘋果正需要行銷。


    蘋果被分成兩個部門，麗莎和麥金塔（Macintosh）。兩個部門激烈競爭，麥金塔和麗莎一樣有滑鼠，其他方面也類似，但價格便宜許多，也更容易使用。很快公司就放棄麗莎，把所有資源投注在麥金塔上。公司買了電視廣告，並提出一個難以置信的提議：免費帶一台回家試用24小時。


    訂單湧進，蘋果在三個月內賣出7萬台麥金塔，公司因為這項優越的新產品重回正軌。但辦公室裡仍騷動不安，賈伯斯與史卡利發生爭吵。


    這是企業民主另一個有趣的面向：一旦股票落在大家手中，公司創辦人就不一定能為所欲為。


    史卡利做了幾項改變，解決了幾個問題，結果麥金塔達成了麗莎原本要達成的目標──搶進企業市場。新軟體讓它更容易與電腦網路中的其他麥金塔電腦相連。到1988年，麥金塔已賣出超過100萬台。


    公司的中年危機會讓投資人大感困惑。如果股價已經下跌，投資人必須決定是否賣出以避免蒙受更大損失，或繼續抱緊股票，希望公司能東山再起。以後見之明來看，預測蘋果重新振作似乎理所當然，但在危機時，誰也沒把握能力挽狂瀾。


    ## 邁入老年的公司


    20歲、30歲或50歲的公司已經度過它們最好的歲月，你不能怪它們很疲倦。它們已經歷過一切，什麼地方都去過了，大風大浪也都見識過了。


    以伍爾渥斯（Woolworth）為例，這家公司已屹立超過一百年，數個世代的美國人從小就在伍爾渥斯買東西。伍爾渥斯的商店一度遍布全美每個城市，但那也是這家公司的成長空間用盡之時。


    近來伍爾渥斯出現兩年未獲利的情況。它還能獲利，但再也無法像年輕時的獲利那麼驚人。你不能指望過去很會賺錢的老公司始終保持那股動力。少數幾家公司能辦到——例如箭牌、可口可樂、奇異和麥當勞——但它們是例外。


    美國鋼鐵、通用汽車和IBM是昔日光環褪色的三個好例子——雖然IBM和通用汽車正要重振雄風。美國鋼鐵曾經不可一世，是地球上第一家10億美元營收的公司。鐵路公司需要鋼鐵、汽車需要鋼鐵、摩天大樓需要鋼鐵，而美國鋼鐵提供了60%的鋼鐵。在20世紀初，沒有任何公司像美國鋼鐵那樣支配鋼鐵市場，也沒有股票像美國鋼鐵那樣受歡迎。它曾是華爾街交易最活絡的股票。


    當年若有雜誌要展現美國的力量和光榮，它們會刊登鋼鐵廠的照片，熔爐中燒著熊熊火焰，液體鐵漿像熔岩般倒進模具。當時美國是一個工廠的國度，許多財富和國力來自東部和中西部的工業城。


    鋼鐵工業是充滿傳奇色彩的產業，而美國鋼鐵的繁榮期經歷兩次世界大戰和六任總統。股價在1959年8月攀至歷史高點108.875美元。


    這是電子時代的開始，是工業時代與鋼鐵榮景的結束，也是投資人賣出美國鋼鐵、買進IBM的絕佳時機。但你必須是極有遠見和極度冷靜的投資人，才會知道要這麼做。畢竟，美國鋼鐵被認為是藍籌股（blue
    chip），受到華爾街的尊崇，且被期待能永遠保持卓越。很少人會料到，美國鋼鐵的股價在1995年會比1959年時低。


    我們不妨參考道瓊工業指數的走勢，道瓊在1959年突破500點大關，此後到1995年上漲超過4,000點。因此，在道瓊指數成分股上漲超過八倍的這段期間，美國鋼鐵卻一路走下坡。忠心的股東只能在死後上天堂等待美國鋼鐵恢復昔日的榮光。


    這裡有個教訓或許可為你省下未來的遺憾。不管今日看來多強大，任何公司都不能永遠保持領先。不管被稱為「藍籌股」或「世界級企業」，都無法挽救黃金時代已經過去的公司。就像被稱為「大」英帝國，也無助於扭轉英國的衰微。


    在大英帝國喪失帝國後很久，英國人仍認為自己的國家和過去一樣強盛，就像美國鋼鐵的股東一樣。


    國際收割機（International Harvester）支配農業機械設備市場半個世紀，但在1966年達到高峰後就未再恢復盛況，雖然該公司試著改名為納威斯達（Navistar）以改運。曼維爾（Johns-Manville）一度稱霸絕緣與建築材料界，在1971年達到巔峰。美國鋁業公司（The
    Aluminum Company of America, Alcoa）在1950年代備受華爾街寵愛，因為當時美國流行使用鋁箔、鋁板和鋁船，使公司股票在1957年漲至23美元（調整分割後價格）的高峰，但這價格直到1980年代才再度出現。


    通用汽車是全球最大、藍籌汽車股中最藍的公司，在1965年10月達到巔峰，但也直到近三十年後才再度出現這個價位。今日，通用汽車仍是美國最大的公司，總銷售排名第一，但已經不是最賺錢的公司了。在1960年代某個時點，它的反應開始變得遲緩。


    德國人帶著福斯（Volkswagen）和寶馬（BMW）登陸，日本人挾豐田和本田入侵。這波攻擊直指底特律，通用汽車卻遲於應戰。如果是較年輕、較有侵略性的通用汽車可能很快因應這些挑戰，可惜老年的通用汽車反應遲緩。


    儘管看到外國製的小型車銷路大好，通用仍繼續製造大型車。如果要製造與外國車款競爭的新汽車，通用必須翻修過時的工廠，花費數十億美元。然而待翻修完成、小型車從通用的生產線開出時，大眾的偏好又已轉回大型車了。


    美國的大型工業公司已有三十年不再那麼賺錢了，但如果你在1965年通用汽車的聲勢達到巔峰時預測這個結果，肯定不會有人相信。人們寧可相信貓王對嘴唱歌，也不會相信你的預測。


    接著是IBM，在1960年代末達到中年，大約是在通用汽車沒落時。從1950年代初起，IBM就是一家表現傑出的公司，是一檔值得擁有的好股票。它有一流的品牌，是高品質的象徵——IBM的商標和可口可樂一樣著名。該公司以其管理方法獲獎無數，其他公司都研究IBM，向它學習如何管理營運。直到1980年代，它在暢銷書《追求卓越》（In
    Search of Excellence）中都還備受推崇。


    各地的股票經紀人都推薦IBM是藍籌股中最藍的股票。對共同基金經理人來說，IBM是「非買不可」的，如果你沒有IBM股，一定是標新立異的投資人。


    但發生在通用汽車的事，同樣也發生在IBM。投資人對IBM過去的表現如此滿意，以致於他們忽視現在發生的事。人們不再購買IBM核心事業生產的大型電腦，大型電腦的市場已停止成長。IBM的個人電腦產品線遭各方製造低價品的競爭者攻擊，導致IBM盈餘滑落，不難想見的是，股價也跟著下跌。


    看到這裡你可能好奇，為什麼還有人投資笨重、老舊的公司如IBM、通用汽車和美國鋼鐵？有幾個理由你可能這麼做，第一，大公司風險較小，它們通常沒有倒閉的危險；第二，它們較可能支付股利；第三，它們擁有高價值的資產，可能變賣獲利。


    這些大公司曾盛極一時、稱霸市場，在過程中買下各種高價值的財產。事實上，研究一家老公司、分析其財務，可能就像翻尋一個有錢老嬤嬤的閨樓一樣刺激。你隨時可能在哪個黑暗的角落找出令人驚嘆的東西。


    不管是土地、建築物、設備、存在銀行保險箱裡的股票和債券，或一路收購的小公司，老公司都有價值不菲的「分拆價值」。股東就像年事已高的富嬌婆的親戚，等著想知道誰會得到什麼。


    老公司永遠有機會東山再起，就像全錄（Xerox）和美國運通（American Express）在過去幾年的表現一樣。


    另一方面，當老公司一旦步履蹣跚或跌倒時，它們可能要花二十年或三十年才能重新恢復活力。耐心是美德，但如果你擁有這種盛況不再公司的股票，耐心不見得能獲得回報。


    ## 公司肥皂劇


    公司之間隨時都在發生許多事，觀察它們就像一齣精彩的肥皂劇。它們不是結婚（所謂的「合併」〔merge〕），就是離婚（所謂的「脫售資產」〔divestiture〕或分割部門）。除此之外，還有「併購」，即一家公司併吞另一家。被併吞的公司不加抗拒時，稱為「友善併購」；如果抗拒被併購、嘗試擺脫這種安排，則稱為「敵意併購」（hostile
    takeover）。


    這其實不是壞事。在企業界，併購公司被認為是可接受的行為。這牽涉領土之爭，因為當一家公司公開上市，它就再也無法控制被誰擁有。它可以嘗試保護自己免於被併吞，但很少有公司能完全抵擋被併購。上市公司有權併購別家公司，所以若有其他公司嘗試併購，它們不該太生氣。


    不管是友善或敵意併購，被併購的公司將失去獨立，變成發動併購之公司的部門。卡夫（Kraft）就是個好例子。卡夫曾是獨立的乳酪製造商，任何人都可以買它的股票，個人、共同基金和退休基金都是它的股東，直到後來出現菲利普莫里斯（Philip
    Morris）。


    菲利普莫里斯的董事會認為，他們只賣香菸的風險太大，所以開始收購製造其他產品的公司，例如乳酪和啤酒。他們很早已買下來勒啤酒（Miller Brewing），後來又買下威斯康辛衛生紙（Wisconsin
    Tisue）、七喜（7 UP）和通用食品（General Foods）。1982年，他們買下恩滕曼公司（Entenmann''s），跨入甜甜圈事業；到1988年又併購卡夫。


    併購發生時，收購公司向被收購公司（在此例中即卡夫）的成千上萬名股東購買股票。通常發動併購的公司（在此例中是菲利普莫里斯）在「收購要約」（tender offer）中提出一個固定的價格。等菲利普莫里斯買到51%的卡夫股票後，交易已大勢底定，因為它控制了多數股權，之後要說服卡夫其餘49%的股東出售股票就容易多了。


    友善併購短暫而甜蜜，如果一家公司本身表現不佳，股東將歡迎更換管理團隊。在大多數例子裡，他們會樂於出售持股，因為併購公司提出的價碼通常遠高於股市當時的股價。當交易宣布後，目標公司的股價可能在一夕之間翻漲一倍、甚至兩倍。


    敵意併購可能演變成惡鬥、法院裡的長期纏訟，以及若有兩家以上的公司爭奪同一個目標，可能演出一場競價戰。這類爭鬥有持續數個月的例子。偶爾會發生跳蚤吞大象的例子，但通常是反過來，併購公司的規模大於被吞併的公司。


    當大公司開始尋找併購對象時，通常是銀行裡的現金多到不知該如何處理。公司可以把多餘的現金，以特別股利或紅利的方式發放給股東，但管理公司的人會說，寄支票給股東的刺激比不上策劃一樁併購，並把多餘的現金投注在這件事情上。不管公司計劃併購哪一類事業，他們相信可以比目前的領導團隊管理得更好、獲利更高。所以這類交易不只牽涉到錢，也與自我意識有關。


    最成功的合併與併購是參與的雙方都在同一個行業，或至少有相同

    '
