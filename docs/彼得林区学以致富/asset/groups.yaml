    有點不公平。華爾街方圓50哩內沒有一隻熊，除非你把紐約動物園的熊算在內，而且熊不會像股票在熊市那樣直線下墜。把熊市改稱為旅鼠市（lemming market）還比較有道理，用來形容投資人跟隨別人一起拋售股票十分恰當。


    「爸爸熊市」（Papa Bear market）從1929年開始，我們在前面已討論過。在1973-1974年的「媽媽熊市」（Momma Bear market），股票平均下跌50%。1982年還有一alon熊市，接著是1987年的崩盤，道瓊指數在幾個月內下跌超過1,000點，其中包括在一天內跌掉的508點。1990年有「海珊熊」（Saddam
    Hussein bear），投資人因擔心波斯灣戰爭而大賣股票。但這些晚近的熊市都比1929年和1973-1974年的大熊市容易應付得多。


    持久的熊市可以測試每個人的耐心，混淆沒有經驗的投資人。不管你多擅長選股，你的股票都會下跌，而每次你以為底部已經出現，它們都會再往下跌。如果你持有共同基金的股票也無法倖免，因為共同基金股票也會下跌，其命運取決於基金的持股。


    在1929年高點買股票的人（幸好只有少數人），必須等待二十五年股價才會回升到當時的水準。想像你的股票虧損二十五年！從1973-1974年崩盤之前的1969年高點算起，股價過了十二年才又回到相同水準。也許我們再也不會看到像1929年那麼嚴重的空頭市場——也就是大蕭條之前的崩盤。但我們不能輕忽像1973-1974年的空頭市場再度來臨，這波空頭後股價回升的時間也長到小孩從進小學直到高中畢業。


    投資人無法避開修正和空頭市場，就像北方人無法避開暴風雪一'
  - '[PAGE 217]


    樣。在持有股票的五十年間，你可能經歷25次修正，其中8次或9次會演變成空頭市場。


    如果能事先獲得警訊那該有多好，這樣你就能在空頭市場來臨前賣出股票和共同基金，把資金留待股票變便宜後再買進。問題是，沒人想出預測空頭市場的方法。預測空頭市場的準確度，和預測衰退不相上下。偶爾有人會正確預測空頭市場來臨，然後在一夕之間聲名大噪——名叫葛莎雷莉（Elaine
    Garzarelli）的分析師就因預測1987年的崩盤而出名。但你絕不會聽到有人連續料中兩個空頭市場。你聽到的只是成群的「專家」喊著「熊來了」，卻看不到熊的蹤影。


    既然我們都習於採取行動保護自己免於暴風雪和颶風侵襲，所以嘗試採取行動保護自己免於空頭市場之害也很自然，儘管這時像童子軍那樣做準備反而有害無益。投資人因嘗試預測修正所導致的虧損，遠超過修正本身帶來的損失。


    投資股票的大忌之一是頻繁進出股票或股票共同基金，期待避開修正的來臨。另一個錯誤是，在你投資股票前坐擁現金等待即將來臨的修正。人們往往因為嘗試預測市場時機以逃避空頭市場，而錯失把握多頭市場的機會。


    回顧1954年的標準普爾500指數，就可看出在股票大躍進的短暫時期沒有抱緊股票的代價有多高。如果你過去四十年間隨時把錢投入股票，你的年投資報酬率將達到11.5％。但如果你在四十年間的40個獲利最佳月份不投入股票，你的投資報酬率將跌到2.7％。'
