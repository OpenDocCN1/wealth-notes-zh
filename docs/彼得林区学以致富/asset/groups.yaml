    投資人的錢增值603倍，100美元變成6.03萬美元，1,000美元變成60.3萬美元。買麥當勞債券的人可沒有這麼好運，他們在投資期間可以獲得利息，但除了利息以外沒有任何報酬。


    如果你買1萬美元的十年期債券，十年後你收回本金加上利息，除此之外沒有任何收益。事實上，通貨膨脹讓你收回的錢變得更少。假如債券支付一年8%的利息，而那十年的平均通膨率是每年4%。那麼即使你賺得8,000美元的利息，通貨膨脹會讓你的利息損失近1,300美元。你初始的1萬美元投資經過十年每年4%的通膨率後，將只價值6,648美元。所以整個十年的投資只給你每年不到3%的報酬率，而且這還不算繳稅。如果把稅算進去，你的報酬率接近零。


    債券的好處之一是，雖然你錯過股票上漲的獲利，卻也避開了股市下跌的損失。如果麥當勞股票從13,570美元跌到22.50美元，而不是反過來，股票持有將呼天搶地，而債券持有將笑得合不攏嘴，因為麥當勞的債券不受股價影響。不管股市發生什麼事，公司必須在貸款結束的日期（即債券「到期」時），償還債券持有債務。這是債券的風險低於股票的原因。債券附帶償債的擔保，當你買債券時，你事先知道你會獲得多少利息，你不會半夜睡不著擔心股價會漲或跌。你的投資受到保護，至少比買股票更有保障。


    儘管如此，在三種情況下，債券會讓你蒙受損失。第一種危險發生在債券到期前出售債券，也就是債券發行者全額償還本金之前。提早出售債券意味你得承擔債券市場的風險，就像股市一樣，每天的價格有漲有跌。因此，如果你在債券到期前賣出，你收回的錢有可能比付出的少。


    第二種危險發生在債券發行者破產，無法償還債務時。發生這種事的機率取決於發行者是誰，例如美國政府絕不會破產——它隨時可以印更多鈔票。因此美國政府債券的買家會獲得全額償付，有萬無一失的保障。


    其他債券發行者如醫院、機場和各類公司，不見得能永遠提供這種保障。如果它們破產，債券持有⼈可能損失很多錢。通常他們能收回一部分錢，但⽆法拿回全部，有時可能全數泡湯。


    當債券發行者無法履行必要的償付時，就叫作違約（default）。為了避免碰上違約，聰明的債券買家會在考慮買債券前，先檢視發行者的財務狀況。有些債券有投保，那是保證償付的方法之一。還有債信評等機構會做債券安全評級，以便潛在買家預先知道哪些債券有風險、哪些債券沒有風險。像麥當勞這種財務穩健的公司，會獲得安全的高評級——麥當勞債券違約的風險幾近零。財務差的公司償付債務可能有問題，會獲得較低的評級。你聽過垃圾債券嗎？它們就是得到最低評級的債券。


    當你買垃圾債券時，你冒了較高的風險，你的錢可能收不回來。這是垃圾債券支付的利率比其他債券高的原因——投資人因為承擔額外的風險而獲得高報酬。


    除了最低等級的垃圾債券外，違約的情況很少見。


    擁有債券最大的風險是第三種風險：通貨膨脹。我們已經提過通貨膨脹會如何侵蝕投資。如果是投資股票，長期來看你可以趕上通膨，並獲得可觀的獲利。但投資債券就無法辦到。


    ## 五、股票


    除了房屋以外，股票可能是你的最佳投資。你不必餵養股票（不像你投資馬或參展的貓），它不像汽車會老舊，也不像房子會漏水，你不必像投資房地產得替草坪除草。你的棒球卡可能因為火災、盜竊或水災化為烏有，但你的股票不會。證明你擁有股票的證書可能被偷或燒毀，如果碰上這種情況，公司會重新寄一份給你。


    買債券時，你只是借錢出去；但投資股票時，你是買下公司的一部分。如果公司生意興旺，你就能分享財富；如果公司支付股利，你能分一杯羹。公司要是提高股利，你的獲利跟著增加。成百上千家成功的公司每年會照例提高股利，這是讓擁有股票更加可貴的紅利。公司從不會提高債券的利率！


    你可以從右頁的圖表看到，自有記錄以來，股票的投資報酬率就一直超越其他投資。也許在一週或一年內看不到，但長期來看，股票總是讓持有者獲得豐厚的報酬。


    超過5,000萬名美國人已發現擁有股票的樂趣和獲利，這表示每五個美國人中就有一個。這些人不是你在名人富豪生活雜誌中看到、開著勞斯萊斯（Rolls-Royces）的大亨，這些股票持有人大多數是小市民，從事一般的工作：老師、巴士司機、醫生、木匠、學生、你的親朋好友，以及住在隔壁公寓或同一個社區的鄰居。


    你不必是百萬富翁，甚至不必有好幾萬美元才可以開始投資股票。甚至如果仍沒有錢投資，因為你失業或太年輕所以沒有工作，或者


    你付完帳單後已經沒有剩餘的錢，你還是可以把挑選股票當成遊戲。這可以是零風險的絕佳訓練。


    接受飛機駕駛員訓練的人必須利用飛行模擬器，他們可以從錯誤中學習而不致於撞毀真的飛機。你也可以創造自己的投資模擬器，從錯誤中學習而不損失真正的錢。許多投資人如果從這種訓練學會投資，就可以不必從痛苦的經驗中學習了。


    親戚和朋友可能警告過你要遠離股市；他們可能也說過，買股票就像把錢丟到水裡，因為股市就像賭場一樣危險。他們甚至可以拿親身經驗來證明所言不虛。上面的表格可以反駁他們的說法。如果股票像賭博，為什麼一連數十年的報酬率如此之高？


    如果有人經常在股市賠錢，那不是股票的錯。股票的價值整體來看長期會上漲，買股票會賠錢的人有99％是因為他們的投資沒有計畫。他們買在高價，然後變得沒有耐心或開始恐慌，並且在股票不可避免的下跌期中以低價出售。他們的座右銘是：「買高賣低。」但你不必和他們一樣，你需要一套計畫。


    本書其餘部分將用於了解股票，和發行股票的公司。這些內容都是初步的介紹，但我們希望能為你奠定終身投資的基礎。


    ## 長期投資


    成功的股票投資人不必是數學天才。你不必是會計師，雖然學習基本的會計概念對投資股票有幫助。你不必是大學優等生或全國榮譽學會（National Honor Society）或門薩學會（Mensa）的成員。如果
    你能閱讀和做五年級的算數，就擁有投資的基本技巧。接下來你需要的是計畫。


    在股票市場，年輕給你超越年紀大者的優勢。你的父母或祖父母可能比你更了解股票，很可能他們是從慘痛的錯誤經驗中學習。當然，他們比你更有錢可以投資，但你擁有最可貴的資產——時間。


    右圖證明時間可以為你的帳簿創造神奇效果。你愈早開始投資愈好。事實上，早期的⼩額投資，長期來看勝過比較晚、較大金額的投資。


    你聽過古老的格言「時間就是金錢」嗎？這句話應該改成「時間創


    造金錢」。這是最佳組合，讓時間和金錢一起工作，而你只要舒服地坐著等候成果。


    如果你已決定以股票作為主要投資，並避開債券，你將消除一個混淆的主要來源，並做出明智的抉擇。當我們這麼說時，是假設你是長期投資人，決心無論如何都要抱緊你的股票。必須在一年、兩年或五年內賣出股票換錢的人，當初就不應該投資股票。我們無法預測股價在一年後會有什麽變化。當股市出現「修正」、股價下跌時，那些不得不拋售持股換錢的人，可能蒙受慘重的損失。


    二十年或更長是較恰當的時期，長到足以讓股票從史上最慘重的修正回升，也長到足以獲利累積。過去股市創造的總報酬率為每年11%。沒有人能預測未來，但經過二十年、每年11%，一筆10,000美元的投資會神奇地變成80,623美元。


    要得到11%的報酬率，你必須保證不管情況是好是壞，都對股票保持忠誠——這像婚姻一樣，是你的錢和投資之間的婚姻。你可能是分析公司的天才，但除非你有耐心和勇氣堅守股票，否則你很可能淪為一個平庸的投資人。好投資人和壞投資人的差別往往不是聰明才智，更重要的是紀律。


    不論好壞，堅守你的股票，不要理會勸你放棄的「聰明勸告」，只管「裝成笨驢」就好。這是五十年前一位前股票經紀商施韋德（Fred Schwed）在他的經典著作《顧客的遊艇在哪裡？》（Where
    Are the Customers'' Yachts?）中所說的，但這話到今日仍然適用。


    人們永遠在尋找股市致勝的秘訣，然而秘訣卻近在眼前：買獲利佳


    的好公司股票，沒有好理由絕不賣掉它們。股價下跌不是賣股票的好理由。


    要站在鏡子前發誓當長期投資人、並對股票保持忠誠很容易辦到。問一群人有誰是長期投資人，你會發現所有人都舉起手來。現在已經很難找到有人說自己不是長期投資人了，但真正的考驗來自股票下跌時。


    本書後面的章節將進一步討論崩盤、修正和空頭市場。沒有人能正確預測空頭市場何時來臨（雖然華爾街有不少人自稱是鐵口直斷的股市算命師），但當空頭市場真正來臨、90%的股票價格同步下跌時，投資人要想不害怕也很難。


    他們聽到電視新聞播報員用「災難」和「不幸」來形容股市的情況，他們開始擔心股價會跌到一文不值，投資會血本無歸。他們決定藉賣出股票來挽救剩餘的錢，雖然是以賠錢的價格賣出。他們告訴自己，救一點回來總比血本無歸好。


    就是在這時，有許多人突然變成短線投資人，儘管他們口口聲聲說自己是長期投資人。他們讓情緒掌控自己，忘記當初買股票的目的——持有好公司的股票。他們因為股價跌得如此低而陷入恐慌，以致於放棄等候股價回升，就在低價時賣出股票。沒有人強迫他們這麼做，但他們自願賠錢賣出。


    他們在不知不覺中落入想抓市場時機的陷阱。如果你說他們是「市場時機操作者」（market timer），他們會斷然否認。但任何人若因為股市或漲或跌而賣出股票，就一定是時機操作者。


    市場時機操作者嘗試預測短期的股價漲跌，希望從中快速獲利。少有人能靠這種方式賺錢，沒有人想出萬無一失的方法。事實上，如果有人想出如何持續預測市場的方法，他或她的名字早就登上世界富豪榜了，而且肯定超越巴菲特和蓋茲（Bill
    Gates）。


    嘗試預測市場時機，最後一定讓你在股市最低點、正要回升時賣出股票，而且在股票上漲到最高、正要反轉下跌時買進股票。人們認為這種事發生在自己身上是因為運氣不好，事實上是因為他們嘗試做不可能辦到的事。沒有人比市場還聰明。


    人們也認為在崩盤或修正時投資股票很危險，但那時只有賣股票才危險。他們忘記另一種危險——在股市大幅回升的美妙時刻卻沒有投資股票。


    少數幾個關鍵的日子就能決定你整個投資計畫的成敗，以下就是一個典型的例子。在1980年代連續五年的多頭市場裡，股市每年上漲26.3％。有紀律的投資人若堅守投資計畫，就能讓投資增值一倍多。但這些增值大部分發生在那五年股市開盤日1,276天中的40天。如果你那40天為了避開下一個修正而未持有股票，你的26.3％報酬率就會降到4.3％。當時銀行定期存單的報酬率都超過4.3％，而且風險小得多。


    所以想從股市得到最大的獲利，尤其如果你還年輕、時間站在你這邊，最好的方法是挪出永遠不會動用的閒錢，投資在股票上，長期緊抱。你會碰到行情不好的時候，但只要你不賣出，就永遠不會真的有損失。持續投資在股市能讓你在股市上漲最快的時刻，享有全


    部神奇而無法預測的獲利。


    ## 共同基金


    截至目前，我們已得出兩個結論：第一，如果可能的話，你應該投資股票；第二，只要發行股票的公司營運保持良好，你應該抱緊這些股票，愈久愈好。 下一個你要做的決定是，你要自己選股票，還是讓別人幫你選。


    選擇輕鬆的方式有許多優點，尤其是當你對數字不感興趣，根本不關心柯達（Kodak）的盈餘是增是減，或耐吉（Nike）製造的鞋是否比銳跑（Reebok）好。


    這就是發明共同基金的原因——讓想投資股票、但不想為細節操心的人投資。投資共同基金時，你唯一要做的事就是匯錢到帳戶，以便取得基金的股票。你的錢和許多其他人的錢聚集在一起（你不會真的和他們見面，但你知道他們確實存在），全部交給管理基金的專家。


    至少你希望是專家在管理你的錢，因為你指望他或她來決定該買哪些股票，以及什麼時候該買和該賣。


    除了有經理人幫你做所有工作外，共同基金還有一個優點，就是它會同時投資許多公司。一旦你與基金簽約，你就自動變成基金擁有股票的數十家、甚至上百家公司的股東。不管你投資50美元或5,000萬美元，你都一樣持有基金所有股票的一部分。這比只擁有
    一檔股票的風險小，而如果你是新手投資人，剛開始真的可能只買


    得起一檔股票。


    典型的基金讓你從小至50美元或100美元的金額開始投資，只要你有額外的現金就可以再增加更多持股。投資多少、多頻繁全由你決定。你可以每隔一個月、三個月或六個月投資相同金額，不必為投資多少傷腦筋。間隔多久不重要，重要的是你持續不斷。


    你能看出這種分期投資計畫的智慧嗎？你再也不必操心股市今年或明年走勢會如何。在修正行情或空頭市場時，你鍾愛的基金股票會變便宜，所以你會以低價買進更多股票；在多頭市場，你會在高價買進更多股票。長期來看，成本會攤平，而你的獲利將增加。


    另一個額外的優點是，許多基金以股利的形式支付現金紅利。你會定期獲得這筆支付——每年4次、每年2次，甚至每年12次。你可以任意支配這筆錢——看電影、買唱片、太陽眼鏡——以獎賞自己投資這檔基金。或者你可以幫自己一個大忙，把股利再投入買更多股票。


    這叫作「自動再投資」，一旦你選擇這麼做，你的股利將自動再投入基金。你擁有的股票愈多，未來在這檔基金的成功就愈大，如果你把股利也投資下去，你的錢將增值得愈快。


    你可以追蹤你的基金表現如何，就像你看迪士尼或溫蒂漢堡的股價。基金股票的價格每天有漲有跌，大致上與基金投資組合的所有股票價格保持同步。這就是為什麼你投資的基金必須有善於選股的經理人。你與經理人站在同一邊，因為他們表現愈好，你的獲利就愈多。


    退出基金很容易。你隨時可以贖回你的錢——不管是全部或一部分——基金會立刻匯錢給你。但除非有緊急事件，或你臨時急需用錢，否則退出基金應該是最後的選項。你的目標是以遠高於你買進的價格賣出持股，所以留在基金愈久，你的潛在獲利就愈大。


    在分享基金獲利之餘，你也得支付一部分的基金管理費用和開銷。這些費用和開銷是從基金的資產支付，通常每年投資人要負擔0.5%到2%不等的成本，視基金而定。這表示當你投資共同基金時，每年固定要損失0.5%到2%，另外加上基金每次買進或賣出股票必須支付的手續費。儘管有這些支出，經理人應該讓基金能賺錢，所以他們必須善加操作和選對股票。


    這些專業選股人擁有超越數百萬名業餘選股人的優勢。對業餘者來說，選股是興趣，但對專業者而言則是全職工作。他們念企管學院，學習如何研究公司和解讀財務報表。他們有圖書館、高性能電腦和研究團隊的支援。如果某家公司傳出重大消息，他們馬上會知道。


    另一方面，專業選股人也有所侷限，使得要與他們競爭更容易些。你我不可能在撞球大賽中打敗專業選手，我們也沒辦法像腦外科醫生那樣進行腦部手術，但我們卻很有機會打敗華爾街的專家。


    這些基金經理人像在同一片股票草地覓食的獸群，他們覺得和其他經理人買一樣的股票比較放心，會避免踏入不熟悉的領域。因此他們容易錯過獸群範圍之外的好機會。


    尤其他們會忽略較新、較沒有經驗的公司，而這類公司往往變成產業中的明星，股市的大贏家。


    ## 基金的歷史


    歷史文獻中最早的共同基金是由荷蘭國王威廉一世在1822年所創立，後來這概念傳播到蘇格蘭，儉樸的蘇格蘭人立即愛上它。蘇格蘭人被認為很節省，他們反對隨便浪費錢，並努力累積鉅額資金，以便投資在新創立的基金上。


    最後，美國的住民也聽說共同基金的做法，但直到19世紀末，共同基金才開始在美國流行。在當時，共同基金被稱作「股票信託」——最早的記錄是1889年的紐約股票信託。這些股票信託後來演變成1920年代很受歡迎的「投資公司」。


    第一檔自稱共同基金的美國本土基金是蕭路米斯塞利斯基金（Shaw-Loomis-Sayles fund），創立於1929年11月，就在股市崩盤後幾週。這對籌劃者來說是很不利的時機，因為股價持續下跌，到1932年才終於觸底。到1936年塵埃落定後，美國有一半的基金（仍稱作「投資公司」）已經倒閉。


    投資人從中學到一個重要的教訓：當股票重挫時，基金也會跟著虧損，這個道理至今仍適用。華爾街最優秀的基金經理人也無法在崩盤中保護你，不管是1929年的崩盤，或1972-1973年、1990年、2000年、2010年或2020年的崩盤都是如此。不管是你自己投資或專業
    prognosticator 投資，都沒有萬無一失的投資組合。


    1929年崩盤後的十一年，國會通過重要的1940年投資公司法（Investment Company Act）。這項至今仍有效的法律揭開了共同基金的神秘面紗，它要求各家基金詳細描述自己，以便投資人完全了解基金的作業，以及參與基金得花多少成本。


    美國登記的每一檔共同基金（目前超過6,000檔）必須解釋其整體操作策略，告知投資人風險有多高。它們必須解釋資金將如何投資，並揭露投資組合的內容，列出最大的持股名稱，和各持有多少股票。


    基金必須揭露管理費，以及管理公司負擔的任何其他費用。基金也必須報告過去各年度的獲利和虧損，讓所有人知道過去的績效是好是壞。


    除了這些要求基金誠實告知的規定外，基金也必須遵守投資的嚴格規定。它不能把超過5%的顧客資金投資在單一股票，以避免把太多雞蛋放在一個籃子裡。


    另外，證管會的政府官員持續監督，以使基金因戒慎恐懼而不敢違反規定。整體來說，基金業十分自律，並與證管會嚴格的監管官員保持良好關係。


    近年來在證管會的支持下，各個基金集團正進行一項極有價值的計畫。他們正嘗試取消說明書上的官樣文章，減少經常占用許多篇幅、但投資人從來不看的冗長內容。說明書上刊登這些內容大部分是應政府要求，但結果卻是浪費時間、混淆投資人，讓他們花更多錢。印製這些內容的成本是由基金資產支付。


