- raw:
  - '[PAGE 244]


    所以當艾斯納從他的迪士尼股票賺進5,000萬美元時，我們不該報以嘘聲，反而應該為他鼓掌，因為那表示迪士尼在他領導下業績蒸蒸日上，股價大幅攀升（在十年內上漲11倍），不管大小投資人都雨露均霑。


    除此之外，我們相信艾斯納不是為了錢做這件事。和大多數位居執行長高位的人一樣，他仍然每天上班。為什麼他還去上班？他樂於接受解決問題和面對競爭的挑戰。經營企業必須精明、傑出和靈巧，生產線的工作也許很單調，但董事會或辦公室裡卻一點也不沉悶。


    史密斯在給郵政局教訓的同時，也創造了就業機會。本章推崇的企業英雄都創造了許多就業機會，不是因為我們最近聽說了很多創造就業的故事，我們聽到的都是就業機會流失。


    看過去兩年來的新闻報導，你會以為美國沒有剩下任何工作了。每次你拿起報紙，就會看到又一家大公司裁員的消息。記者不必深入調查就能發掘這類報導，因為美國最大的500家公司在1980年代裁撤了300萬名員工，在1990年代裁員的速度也不遑多讓。


    裁員對失去工作的人來說永遠是痛苦的事，但裁員不致於形成全國危機。從更大的角度看，裁員有益經濟的健康。


    公司不會隨便把忠誠的員工趕出門，在大部分狀況下，裁員是採取缺不補的方式進行：有人退休的職務不找新人填補。但裁員有一個目的：讓公司更有競爭力，未來更能生存。'
  - '[PAGE 245]


    想像如果500家大公司在1980年代留住那300萬名原本該裁撤的員工，會是什麼樣的災難？到最後，膨脹的人事可能摧毀那些公司，它們將無法與更有效率的對手競爭，成本更低的對手將搶光它們的生意。其結果是，損失的不是大公司的300萬個工作，而可能是1,000萬個或1,500萬個，而整個美國可能再次陷入蕭條。


    這帶我們來到以下列出的25家大公司。它們至少有三種類別：持續成長數十年的公司（例如，沃格林〔Walgreen〕、麥當勞、雷神〔Raytheon〕）；在英雄拯救前迷失方向的公司；原本經營還可以、但又獲得大助力而完成非凡成就的公司——雖然它們年齡漸大，人們認為它們的黃金年代已過。


    克萊斯勒是絕處逢生的最佳例子，還有高露潔（Colgate）、聯合訊號（Allied Signal）、開拓重工（Caterpillar）、房利美（Fannie
    Mae）和花旗銀行（Citicorp），所以我們有各式各樣具代表性的公司。然後在「捲土重來」的類別裡，有再次以驚人速度成長的可口可樂，以及吉列、摩托羅拉和默克。


    房利美的故事有兩個英雄——麥斯威爾（David Maxwell）和強森（Jim Johnson）。舊稱聯邦貸款金融公司（Federal National Mortgage
    Association）的房利美，是美國最大的住宅房貸機構。在麥斯威爾剛到公司時，房利美的營運搖搖欲墜，時而賺錢、時而虧損，徘徊在破產邊緣。麥斯威爾整頓房利美，讓它轉虧為盈。


    強森在1991年接掌公司，在他的帶領下，房利美的盈餘增加了一倍多，並讓盈餘起伏變小、變得更加可靠。雖然房利美只僱用了'
  - '[PAGE 246]


    3,000人，但以一家大公司來說，員工人數相當少。房利美直接影響數千萬名屋主，並透過持有五分之一的美國住宅抵押貸款發揮間接的影響。


    房利美提供抵押貸款資金的能力，攸關龐大數量的就業機會。如果這家公司管理不善、經營陷於困境，美國的新住宅市場和整體房地產市場可能萎縮。住宅營建商、地毯製造商、房地產仲介業者、保險經紀人、銀行家、電器商店、五金商店和住宅裝修商店，都會跟著受害。


    惠普原本是一家舊科技公司，為電子業者製造檢測設備。在1975年，惠普的銷售為9.81億美元；二十年後，它的銷售已接近300億美元。這家公司的檢測設備部門現在只占11%營收，而印表機和電腦部門則占78%。惠普十五年前並不生產印表機，但它慢慢變成這個產業的巨人，每年估計銷售價值90億到100億美元的印表機和相關產品。印表機讓惠普變成高品質品牌，協助它銷售電腦，在全球個人電腦市占率排名第六。


    惠普的規模已成長到將近IBM的一半，但在1975年，它只有IBM的十五分之一。它的成長和快速發展，主要歸功於員工被鼓勵發明新產品和開發新點子。協助和刺激這項創新的英雄人物是惠普的執行長楊格（John
    Young）。


    這類提高公司競爭力的做法可回溯至1982年，美國剛經歷二次世界大戰後最嚴重的衰退，情況極其惡劣，汽車業瀕臨破產，失業率高漲，從東岸到西岸各地的美國人都感覺國家逐漸喪失活力。'
  - '[PAGE 247]


    在這個全面危機中，企業領袖做出劃時代的決定，他們改變了做生意的根本方式。在1982年以前，他們跌跌撞撞度過每一個經濟循環，在景氣大好期間增加員工，然後在景氣衰退時又裁撤員工。生意糟糕時，他們逐漸緊縮，先是取消加班，然後讓老員工提早退休等等。


    從1982年起，各式各樣的公司都致力於提升效率。在華爾街，人們稱之為組織再造、規模正確化、縮編或精簡化。不管怎麼稱呼，這代表降低成本和提升生產力，不只是為了度過衰退，而是變得更賺錢、更有競爭力。


    以嬌生為例，這家公司的盈餘幾乎連續三十五年增加，在舊環境下，嬌生不會把組織再造當成優先目標。但在新環境中，即使是像嬌生這種體質強健的公司也發現，必須採取保持優勢的策略，同時不斷發展新產品。


    這是我們過去十五年看到企業獲利激增的主要原因，同時股價也因而大幅攀升，漲幅超越歷史上的其他時期。美國現在的富裕已遠超過1982年，而富裕增加的主因之一是企業改變做生意的方式，包括藉裁員變得更有競爭力。媒體界很少人注意到這一點，他們仍然認為美國的企業領袖忙著打高爾夫球。


    公司再也不敢自滿，它們可能剛剛創下歷來最高的盈餘紀錄，但它們擔心的是十年以後的情況。它們不想步上泛美（Pan Am）、東方（Eastern）和布蘭尼夫（Braniff）的後塵，這三家因為喪失競爭優勢而倒閉的航空公司在消失後，有數萬名員工直接或間接跟著失業。'
  - '[PAGE 248]


    變得更有競爭力不只是開革員工、關掉幾座工廠以節省成本。如果一家公司花1億美元興建一座新工廠，來自舊廠的同一批員工在新廠可以提高15%的生產。


    這額外的15%可以幫助許多人。公司可以給員工加薪5%，讓員工開心；可以降低價格5%，讓顧客快樂；公司也可以增加自己的獲利，讓股東滿意。當然，分配這15%的方法有很多種，重點是當一家公司變得更有競爭力時，能帶來多重的好處。


    還有另一種提高生產力的方法：製造更好的產品，並在製造時少犯錯。少犯錯意味減少顧客的抱怨、減少打電話為錯誤道歉、減少更換已經出貨的產品、減少維修有瑕疵的產品。一家公司若能把不良率從5%降低到0.5%，就可以省下處理不良產品和應付顧客投訴的大量時間和金錢。'
