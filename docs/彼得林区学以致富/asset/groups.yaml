    耐吉股價在崩盤後跌回7美元，並在那個價位徘徊八天，所以你有很多時間打電話給你的經紀人。從那個價位開始，耐吉展開五年的攀升，在公司營運不斷更好中一路奔向90美元。到1992年底，耐吉的股價已是你在1987年買進時的12倍多。那就是你的12倍打股。


    即使你錯過在崩盤後以每股7美元買進耐吉的機會，你也可以在三個月、六個月或一年後每次收到季報告，看到耐吉業績持續好轉時加碼買進。即使你沒有獲利12倍，也可以賺進你投資的10倍、8倍或6倍。


    ## 嬌生


    另一家任何投資人都可研究的公司是嬌生。彼得．林區很喜歡這檔股票，但不是因為必須具備特殊天分才能了解這家公司。如果你看過1993年的年度報告，你也會得出相同的結論：投資這家公司。


    1993年度的報告在1994年3月10日寄出，你在內頁最先注意到的一件事是，過去兩年股票的表現，從1991年底約57美元穩定下滑。在報告寄達時，股價已下跌到39.625美元。


    一家這麼棒的公司在多頭市場的股價表現卻如此差，你會懷疑出了什麼差錯。你瀏覽年度報告想找點壞消息，但從頭到尾看到的都是好消息，有許多出現在第42頁的摘要裡。盈餘連續十年穩定上漲，在那段期間成長為四倍。銷售也持續增加。


    這家公司也提到連續十年提高股利，但沒有提到一個更不可置信的事實：它已連續三十二年提高股利。也許嬌生是想表現得含蓄一點。


    同樣在42頁，你得知這家公司近年來的生產力節節升高。在1983年，擁有77,400名員工的嬌生，製造並銷售價值60億美元的產品；到了1993年員工增加到81,600人，製造並銷售的產品價值已增加到140億美元。這等於增加4,200名員工，但製造和銷售的產品多出一倍多。從1989年到1993年，銷售從97億美元增至140億美元，而員工的數字不增反減。


    這告訴你嬌生變得更有效率，且更善於降低成本。公司的員工以更有效率的方式利用他們的時間，為公司、股東和自己創造更多價值（雖然你從股價看不出來）。許多員工擁有股票，或者即使未擁有股票，當銷售增加時，獲利隨之增加，員工也能獲得加薪。


    在第25和42頁，你發現嬌生持續買進自家股票：1993年買進300萬股，在之前十年期間則買進1.1億股。它花了數十億美元在這件事上。當公司以這種方法在市場買進自家股票時，投資人很可能受益。流通的股票減少意味每股盈餘升高，進而推升股價。但看到嬌生的股價，你不會想到公司在買回股票。


    嬌生年度報告29頁的資產負債表顯示，這家公司擁有超過9億美元現金和可變賣的證券，還有該公司有價值55億美元的權益總額（total equity）。擁有這麼堅強的財務實力，嬌生沒有營運難以為繼的危險。


    到這時候，你可能好奇到底問題出在哪裡。會不會是嬌生沒有為未來做好準備？年度報告的封面標題並非這麼寫的，上面幾個大字說：「新產品帶動的成長。」文字交代的詳情是：該公司1993年的銷售有34％來自過去五年推出市場的產品。


    在42頁，你發現嬌生1993年花10億美元在研發上，相當於銷售的8％。研發預算在十年間成長為兩倍。顯然該公司做了標題上說的：孕育新產品。嬌生沒有偷懶。


    ![](img/210fbe3bc55fc76fef28f1a2998180fc_179_0.png)


    把這種情況放在較大的背景，比較股價與盈餘。這家公司預期1994年每股盈餘3.10美元，1995年為3.60美元，本益比分別為12倍和11倍。未來的盈餘總是難以預測，但嬌生過去的盈餘預測向來很準確。因此如果這些預測正確，股價確實便宜。


    當時以1995年預估盈餘計算的股市平均本益比為16倍，而嬌生的體質遠優於一般公司，是一家卓越的公司，各方面的表現都很傑出：盈餘增加、銷售增加，展望光明。儘管如此，嬌生股價已跌到39.625美元，而且在報告抵達那幾週還繼續滑落到接近36美元。


    雖然很難相信，你還是達成了無可避免的結論：嬌生沒有任何問題，股價不應該跌到這麼低。公司不是問題，「健保恐懼」才是問題。在1993年，國會正在辯論不同的健保改革提案，包括由柯林頓政府提出的計畫。投資人害怕如果柯林頓的提案通過立法，醫療公司將受害，因此他們拋售嬌生和其他醫療照護股。


    如果柯林頓的提案立法成功，這些憂慮有一部分可能成真，但即使如此嬌生受到的影響也會比典型的醫療照護公司輕微。在年度報告41頁，你發現嬌生的獲利有超過50%來自不受柯林頓提案影響的國際業務。然後在第26頁，你發現公司獲利有20%來自洗髮精、OK洗髮和其他消費者產品，這些產品與柯林頓改革目標的藥品無關。不管你怎麼剖析，嬌生與那些人擔心的事沒有多大關係。


    只要花不到20分鐘讀年度報告，就可看到股價39.625美元的嬌生是十年來少見的便宜股票。嬌生不是一家很難了解的複雜公司，你不必是全職的專業投資人或哈佛商學院研究生就能搞懂它。


    這是一個簡單的決定：股價正在下跌，而公司的基本面正在改善。正如耐吉的例子，你不必急著買股票。彼得．林區在1993年底《今日美國報》（USA Today）的一篇文章推薦嬌生，當時股價為44.875美元。在1994年春季的《盧基塞華爾街週》（Wall
    Street Week with Louis Rukeyser）節目上，再度推薦它，當時股價回跌7美元到37美元。


    股價下跌7美元完全沒有影響林區的看法，因為最新的每季報告告訴他，銷售和盈餘正在上揚，所以投資的潛力正在增加，正好是低價加碼買進的好時機。


    林區在1994年夏季再度推薦嬌生，當時股價已回升到44美元，但本益比仍然很低。到1995年10月，股價已上漲超過80美元，在18個月內翻漲為兩倍。


    ## 3 公司的生命


    ## 公司的誕生


    故事從這裡開始。某人有了新點子，發明了一項新產品。這個人不必是重要人物、大學榮譽生或研究所畢業。這個⼈甚至可以高中沒唸完，或大學中輟生，以蘋果電腦的例子來說，就是大學中輟生。


    你會很驚訝有這麼多億萬美元的公司，是在某人的廚房餐桌或車庫裡發起的。美體小舖（Body Shop）從羅迪克（Anita Roddick）的車庫開始，她原本是英國的家庭主婦，想在丈夫出差時找點事情做。她開始製造乳液和護膚水，並把它們變成一個護膚帝國，在全世界各地有900家美體小舖。


    第一台惠普電腦出自帕卡德（David Packard）的車庫，第一台蘋果電腦則在賈伯斯（Steve Jobs）父母的車庫誕生。為了鼓勵更多創新問世，也許我們應該蓋更多車庫。


    讓我們再仔細探究蘋果的起源。這家公司創立於1976年，正好是美國建國後兩百年。今日蘋果每年銷售價值50億美元的電腦到世界各地，付給1.13萬名員工薪水。但1976年之前蘋果並不存在，只有兩個眼睛閃著亮光的加州年輕人。


    其中一個是賈伯斯，另一個是沃茲尼克（Steve Wozniak）。賈伯斯當時21歲，沃茲尼克26歲。兩人都是大學中輟生，和班傑瑞冰淇淋店的班·考亨（Ben
    Cohen）一樣。他們都提早離開學校，白手起家創立公司，並在35歲以前變成百萬富翁。


    這不表示你也得從學校退學，然後等著神奇的事情發生。這三個人知道如何讀、寫和計算，其中蘋果的兩個人都學了許多有關電腦的知識，他們離開學校不是因為可以賴床，然後整天無所事事。他們全神貫注在電晶體、配線和印刷電路板上。


    沃茲尼克是最早的「駭客」（hacker）之一，也就是精通電腦的天才，成天在家實驗自製設備，學會如何破解安全密碼，入侵資料庫，對政府機構和企業辦公室搞破壞的麻煩人物。在較有建設性的方面，他想到設計一台簡單的家用電腦，讓對電腦完全沒有概念的一般人使用，在當時，那就是99.9%的人口。


    因此沃茲尼克和賈伯斯就在賈伯斯家裡的車庫設立工廠，把市面上常見的電腦零件組裝在一個塑膠盒，並取名蘋果一號（Apple I）。兩人對自己生產的東西都很興奮，決定變賣所有財產——一輛舊廂形車和兩具計算機——把所得的錢全投入事業。


    他們籌得3,000美元的自有資金，以1976年的物價可用來生產50多台蘋果電腦。然後他們賣出那50台電腦，用那些錢來研發更進步的機型，並且再賣出數百台電腦。


    在這個初期階段，想出好點子的人必須拿出自己的錢來創業。當現金用完後，他們典當家裡的珠寶、賣掉第二部車，向銀行抵押房子貸款——想盡辦法讓事業延續下去。


    失去房子、穩當的工作和生活積蓄，是許多後院發明家為了創建新事業甘心承擔的風險。這些有勇氣、又有本事的人，願意跨入不可測的領域，就像在他們之前的開路先驅一樣。他們選擇開創新事業的刺激，寧願捨棄領固定薪水的穩定生活。光是投資所有的錢還不夠，他們必須長時間工作，投資大部分的時間。


    如果他們運氣好，未碰上阻礙，也沒有太早把錢花光，他們可以製造一個樣本或發明產品的縮小模型，或付錢請顧問寫一份詳細的事業計畫。在這時，他們進入一個需要更多錢的階段。他們開始向「天使」（angel）推銷計畫。


    天使可能是一位有錢的叔叔、遠房表親，或資金雄厚、願意冒險投資的朋友。天使拿錢出來不是做慈善，而是因為他們相信新點子有機會成功。他們貢獻資金，換取新事業的股份——通常是相當大的股份。


    你已經看出，有好點子的人要想成功，就不能自私地獨占100％的股份。當計畫進展到縮小模型或規劃以後的階段，就必須從更具財力的新投資人籌措更多錢。這些人就是創投資本家。


    創投資本家通常在產品已開始生產、並已僱用銷售人員來銷售它們的階段跨入。他們藉等待新公司建立、新點子已證明可行到某個程度來降低自己的風險。這些人對細節有很銳利的觀察力，他們全面檢驗公司簡短的歷史以尋找缺陷。他們想知道經營者是否真的有把握成功，以及是否有能力把營運從小做大。


    創投資本家提供財務援助時，也要求參與行動。這家年輕的公司已經有三組業主：湊出第一批資金的初始發明家；拿出第二批資金的天使；以及提供第三批資金的創投資本家。到這裡，初始發明人擁有事業的股份可能不到50％，因為餅做得愈大，就愈多人有份。


    讓我們再看看兩位蘋果創辦人的進展。他們感覺自己手上握著一種受歡迎的產品，於是聘請了一位也是行銷專家的退休電子工程師馬庫拉（Mike Markkula）。馬庫拉曾為電腦業的兩大公司工作——英特爾和快捷半導體（Fairchild
    Semiconductor）。他年紀已大到足以當蘋果兩位發明家的父親。


    馬庫拉可以拒絕兩位業界新手，但他不愧是識貨的老手。他不但同意為他們寫商業計畫，還以25萬美元買下三分之一的公司股權，使他變成蘋果的第一個天使。


    善於發明東西的人未必善於推銷、廣告、管理財務或人事費用，而這些都是決定新創公司存活之事。馬庫拉知道兩位創辦人需要的協助遠超過他所能給予，於是又招攬一位有經驗的主管史考特（Mike
    Scott）來擔任蘋果的總裁。


    蘋果也僱用麥坎納（Regis McKenna），是當地最好的廣告公司找來的文案老手，他設計出蘋果的商標。有了這些新同事來處理行銷和推廣，兩位創辦人就能專心改進產品。


    蘋果是第一家推出彩色影像個人電腦的公司，也最早使用電視顯示器作為螢幕。沃茲尼克裝設一部硬碟機取代當時用來儲存資料的卡帶機。1977年6月，他們賣出價值100萬美元的蘋果電腦。至1978年底推出蘋果二號（Apple
    II）時，蘋果已是美國成長最快的公司。


    隨著銷售持續攀升，兩位創辦人繼續埋首於蘋果實驗室（不再是當年的車庫了！），設計更多蘋果電腦。另一方面，在1979年，他們籌措更多資金：沃茲尼克賣掉他的部分股票給金融家沙洛費姆（Fayes
    Sarofim），另有一群由羅斯查爾德公司（L.F. Rothschild Company）召集的創投資本家投資720萬美元。


    蘋果在1980年12月上市時已生產第四款新電腦。像蘋果這樣等到已證明自己才上市是很典型的做法，而蘋果在公開上市之前股價就已經漲上天。


    ## 公開上市


    從這個階段起，股票市場開始扮演一個角色。現在已經把產品改善得很好，缺陷全都矯正，並準備全面擴張。或者，如果新點子是某種新類型的商店，此時第一家店已證明能獲利，公司已計畫開第二家或第三家店。野心勃勃的展店計畫需要更多資金，超過天使和創投資本家迄今所提供的，而資金最好的來源就是你和我。


    公司上市是一個重大決定，就像一個人準備競選公職。一旦你做出這兩種選擇之一，你就要公開自己，供外界的記者追問你的事務，政府機構也會監視你的一舉一動。政治人物的生活不再屬於他或她

