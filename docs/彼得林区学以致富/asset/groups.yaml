    # 2 投資基本原則


    # 現在就投資：你還等什麼？


    許多人等到他們已經三十幾、四十幾和五十幾歲時才開始存錢。他們突然想到自己已不再年輕，很快將需要額外的錢來供應退休所需，讓他們可以在湖邊買一間小屋或環遊世界。問題是，等他們發現自己應該投資時，已浪費了許多股票可以自己增值的寶貴歲月。


    他們的錢原本可以自己滾出許多錢來。但他們花掉所有錢，好像不會再有明天。他們有許多開支是省不了的，因為他們有兒女要撫養、要支付醫生帳單、學費、保險費、修理房子帳單等。如果沒有剩餘的錢，他們也無法投資，但通常總是有剩餘，只是他們依舊不肯投資。他們把這些錢用來上時髦的餐館吃飯，或用來支付最昂貴汽車的頭期款。


    不知不覺間，他們已經日暮西山，而口袋除了社會安全支票，卻沒有多少餘錢。他們在應該開始享福的時候，卻必須節衣縮食度日，因為光靠社會安全支票會讓他們捉襟見肘，連基本生活都難以應付。'
  - '[PAGE 99]


    避免這種命運的最好方法之一是儘可能提早儲蓄，從你還住在家裡時開始。否則你的支出怎麼可能少到能存錢？這時候你還不旁撫養小孩——你的父母可能還供養你。如果他們不收你的房租，那更好，因為要是你有工作，你可以把錢投入未來能獲得報酬的投資裡。你在父母還供養你時投資得愈多，等你搬出去住、支出大幅提高後才有能力過好生活。


    不管是一個月10美元、100美元或500美元，儘可能定期省下你能省的錢。


    根據新聞報導，許多二十多歲、三十多歲的人都搬回父母家住，以便有免費的房間，免費的電視、錄放影機、運動器材等。這趨勢似乎顯示出，美國已製造出一個白吃白住的新世代，他們缺少出去闯天下、自立門戶的雄心壯志。但這件事有一個我們很少聽人談起的好處，就像《華爾街日報》近來一篇報導所說的：「X世代開始為退休存錢了。」


    這則報導的重點是，二十多歲白吃白住的世代是所謂「失落的世代」，也稱為X世代，他們正悄悄把錢存起來。顯然這個族群的年輕人存錢的比率高於他們的父母，這些父母是嬰兒潮世代，他們偏好現在花錢、以後再存錢。X世代發現，他們不能指望社會安全計畫來保障他們未來的支出。他們看到父母辛苦賺錢償付信用卡債務，所以想避免重蹈覆轍。他們追求財務獨立，並趁著還住在家中時努力朝向這個目標，由父母來支付帳單。


    這是一個很好的發展，我們只希望更多年輕人追隨這些人的腳步，別掉入類似購買昂貴汽車的陷阱。許多孩子等不及做這件事，他們'
  - '[PAGE 100]


    一找到第一份工作，便立刻變成汽車貸款的奴隸。開著拉風的卡馬洛（Camaro）新車當然比二手的福特愛思寇（Escort）酷得多，但這種酷長期來看代價十分高昂。酷的代價有多高？想想下面兩個例子：畢貝利（Joe
    Bigbelly）和卡薇兒（Sally Cartwheel）。


    畢貝利在沃爾瑪找到一份工作，他住在家裡，省吃儉用以便支付一輛2萬美元的卡馬洛汽車頭期款2,000美元，其餘的1.8萬美元全部來自汽車貸款。他父母必須出面簽字貸款，但由畢貝利支付貸款。那是一筆利率11.67%的五年期貸款，他每個
    月得匯給金融公司400美元。他第一次匯錢時為那400美元心痛了一下，但當他開著卡馬洛車到處逛、聽他朋友誇讚那輛車有多酷時，心痛的感覺立刻拋到九霄雲外。


    幾個月後，車門上有了刮痕，車子的地毳有了污漬，當卡馬洛車開進停車場時已沒有人大驚小怪。現在那只不過是另一輛車罷了，但畢貝利已深陷汽車債務中。為了供養汽車並開車和女孩子約會，他兼了一份晚上的工作，但這表示他沒有太多時間約會。


    五年結束後，他已厭倦了卡馬洛車，而它也早就 anisotropy不酷了。他終於付完汽車貸款，且多花了額外6,000美元的利息支出，所以原本採購的價格加上貸款利息，畢貝利總共投資了2.6萬美元在這輛車上，這還不算稅金和規費、保險費、汽油、機油與維修保養的錢。


    到這時，那輛卡馬洛已經老舊斑駁，引擎聲音有點粗嘎。如果他把車賣掉可能賣到5,000美元，所以他的2.6萬美元投資，現在只剩一輛他甚至已經不再喜歡的、價值5,000美元的汽車。'
  md: '

    關門，員工失去工作和收入來源，這意味他們沒有錢買東西，所以商店沒有生意，進而使員工沒有薪資可領。經濟墜入災難性的境地，公司無法賺錢，股價因而下跌，且始終維持在很低的價格。


    大多數歷史學家會告訴你，大蕭條不是1929年崩盤造成的，雖然許多人把它視為罪魁禍首。當時只有極少數美國人擁有股票，因此絕大多數人沒有因為股市崩盤而損失任何金錢。大蕭條的起因是世界性的經濟不景氣，加上政府錯誤地管理貨幣供給，和在錯誤的時機提高利率。美國政府沒有挹注更多流動性以支撐經濟，反而做出完全相反的事——把流通中的錢抽走，使經濟緊急煞車。


    幸好政府從錯誤中學到教訓。現在當經濟減緩時，政府會很快增加貨幣供給和降低利率，以便經濟體系裡有更多錢，貸款的成本可以降低。貸款成本降低鼓勵人們購買住宅和昂貴的東西，也鼓勵企業擴張。購屋和企業擴張增加可推動經濟成長。降低利率可能要連續數次才足以重振經濟，但我們從二次世界大戰後經歷九次經濟不景氣，而九次經濟都重新復甦。


    在1930年以前，蕭條和恐慌頻繁發生，但自大蕭條以後，美國未再有蕭條。因此在過去約五十年，經濟不景氣轉變成蕭條的機率極其微小——事實上就九次不景氣來說，機率是零。沒有人敢說一輩子不會經歷一次蕭條，但截至目前，在過去半世紀你要是賭經濟會再次蕭條，一定會讓你破產。


    很可能我們已經找到永遠杜絕經濟蕭條的藥方，就像我們發明預防小兒麻痺的疫苗一樣？有幾個理由讓我們這麼想。第一，政府透過聯邦準備銀行體系隨時準備降低利率，在經濟出現減緩跡象時挹注資金到體系，讓它重新恢復活力。第二，我們有數千萬名靠社會安全和退休金生活的人，不管如何都有錢可花。再加上1,800萬名從聯邦到地方各階層的公務員，經濟又多了一支消費大軍。只要這一大群人繼續花錢，即使經濟可能減緩，卻不至於是1930年代那樣完全停頓的地步。


    第三，我們的銀行存款有保險，因此即使銀行破產，人們也不會損失全部的錢。在1930年代，當數百家銀行關門時，所有存款全化為烏有，這本身就足以把美國推落災難的境地。


    在所有變遷中最重大的改變是，政府的地位大幅提升。今日，政府在經濟中扮演最大的角色，相較於在1930年代只是輔助角色，甚至在1900年代以前更是微不足道。當你聽到人們抱怨大政府支配我們的生活時，記住就是同一個大政府進行飛航管制、避免飛機彼此相撞，也是它雄厚的支出能力使我們免於墜入第二次大蕭條。


    如果你相信我們不太可能再重蹈大蕭條的覆轍，你就能對股市下跌較為放心。只要經濟仍有活力，企業就能賺錢。企業賺錢，它們的股票價格就不會跌到零，絕大部分公司會存活到下一個繁榮期，股價也將回漲。


    歷史不必然重演。當有人告訴你歷史會重演時，提醒他或她，我們已有半個世紀不曾有過經濟蕭條。為了躲避1929年式悲劇而遠離股市的人，錯過了擁有股票的所有好處，這才是更大的悲劇。


    ## 有關崩盤的傳說


    有關1929年崩盤的許多迷信、傳說和道聽塗說被代代相傳，你可能聽過有許多絕望的投資人從紐約的摩天大樓窗戶跳樓自殺，但根據克林格曼（William Klingaman）的著作《1929：大崩盤那一年》（1929:
    The Year of the Great Crash），華爾街發生那場災難後數週的自殺率並沒有升高；只有幾個人跳出窗外，但不見得是因為股票的損失。


    厄爾無線電公司（Earl Radio Corporation）的副總裁，從雷辛頓大道\的楨爾登飯店（Hotel Shelton）11樓跳樓而亡，但那是在11月初，在10月24日崩盤之前數週；崩盤之後數天，一群人聚集在一個建築工地前，看到有個人坐在鋼樑上。他們以為他是知名的投資人，正準備了卻殘生，結果他是個正在吃午餐的建築工人。


    英國政治人物邱吉爾當時住在薩弗伊廣場飯店（Savoy Plaza Hotel），上一層樓的房間正好有人從15樓窗戶跳樓並當場斃命。這樁意外被視為股市崩盤導致，雖然没有任何證據證明與股市有關。大多數在這段期間自殺的人用槍了結自己生命、把頭伸進瓦斯爐裡，或選擇不是從高樓窗口跳出的方式。


    例如，康提信託公司（County Trust Company）的李歐登（James Riordan）對著頭部舉槍自盡；有家室的寇斯比（Harry Crew
    Crosby）死於和女友狂吸鴉片（這則新聞被報導成華爾街醜聞，因為寇斯比是摩根銀行一位投資銀行家的兒子，但他是個作家，與摩根銀行没有任何關係，銀行和他也沒有任何關係）；長島一位股票經紀人的妻子對著心臟開槍自殺（沒人知道她為什麼沒開槍殺她丈夫）；紐約州羅契斯特一位公用事業主管在臥室以瓦斯自盡；費城一位金融家在他的運動俱樂部開槍自殺；羅德島普羅維登斯一名投資人，在他的經紀商辦公室看行情電報機時暴斃；密爾瓦基一名投資人舉槍自盡並留下一張遺書說：「我的身體應捐作科學研究，我的靈魂則捐給美隆（Andrew
    W. Mellon，著名的匹茲堡大亨）。對於我的債主，我深表同情。」


    所以，我們從哪得來股市崩盤的受害者都從紐約的高樓跳樓自盡的概念？主要來源似乎是喜劇演員羅傑斯（Will Rogers）。在股市崩盤後不久，羅傑斯說：「情況已經嚴重到紐約的旅館櫃檯會問住進來的客人：『你是​​要睡覺的房間，還是跳樓的房間？』如果你想要有窗戶的房間，必須排隊等。」


    但羅傑斯只是想博君一笑。他開得起這種玩笑，因為他聽從著名華爾街大亨巴魯克（Bernard Baruch）的建議。聰明的巴魯克在股市崩盤前把股票全部賣光，羅傑斯也學他這麼做。在演藝人員中，坎特（Eddie
    Cantor）和馬克斯（Groucho Marx）就沒有如此幸運了。


    崩盤真正的受害者是借錢買股票的人，也就是所謂的「融資戶」。在當年，只要10%的資金就可以買100%的股票，所以如果你有1萬美元，就可以借入9萬美元來買價值10萬美元的股票。當崩盤跌掉股票一半的價值時，你手上的股票只值5萬美元，你無法償付的債務則有9萬美元。


    ## 大蕭條中的好消息


    即使是大蕭條也不見得人人都過得很悲慘。資金奇缺，數百萬人丟掉工作，所以整體來看情況非常糟；但對某些公司來說，他們的員工、投資人和營運都一帆風順。


    雜貨商店A&P就是一個好例子，當每個人都關閉商店時，A&P卻逆勢而為大舉展店。它的銷售和獲利雙雙增加，因為不管情況變得多惡劣，大家還是得買雜貨。國民所得從1928年到1933年減少約一半，但不管所得剩下多少，人們都會把錢花在食物上。


    某些類型的公司可以安度蕭條、衰退和其他資金困窘的時期。這類公司稱為消費者成長型公司，他們銷售不貴的產品：啤酒、軟性飲料、點心等東西，或者必需品，像是人們不可缺少的藥品。口香糖和糖果公司如箭牌，可能在衰退時生意大好，因為箭牌創辦人萊格利（Wrigley）就曾說：「人們愈悲哀，口香糖就吃得愈多。」


    不令人意外的是，《商業週刊》（Business Week）於1932年報導A&P的營運情況良好。但商場總是隨時有威脅潛伏在某處，問題是你永遠不知道威脅會是什麼。這是投資人最常犯的錯誤之一，他們專注在自認的大威脅上，也就是每個人都在談論的威脅（氣候暖化、核子彈頭爆炸、波士尼亞戰爭、日本的貿易問題），卻忽視了能決定他們投資的公司成敗的小事情。


    A&P安然度過大蕭條，但他們要擔心的威脅是小豬扭扭（Piggly-Wiggly）。小豬扭扭是一家位於田納西州曼菲斯的公司率先開設的自助式商店——顧客不必請櫃檯裡的店員從貨架拿貨品，可以任意在商場走道上拿自己想要的產品，然後到櫃檯結帳。這是新的做法，自助式服務意味商店可減少僱用店員，購物者也可以接觸更多產品。


    這對A&P而言是一個關鍵時刻，如果這家公司的管理階層太過安逸以致忽略了小豬扭扭的挑戰，它可能步上恐龍的後塵。很多公司經常如此：蕭條難不倒它們，戰爭它們可以應付，臭氧層的破洞影響不了它們，但競爭會讓它們倒下。


    公司必須迅速因應市場的變遷，否則將被淘汰。A&P看出它非做不可的事，而且也做了。它關閉數千家小商店，並開了幾家自己的超級市場。


    1935年，全美只有96家超級市場，只有24個城市有超級市場。然而小豬扭扭的創意很快就大受歡迎，A&P藉由改變小商店為大商場的策略，為自己創造出掌握二次世界大戰後雜貨業蓬勃發展的優勢。


    ## 美國復興


    第二次世界大戰對整體文明來說雖然造成可怕的破壞，卻使美國經濟重振活力。美國軍人返回家鄉後，郊區在城市四周紛紛建立起來。人們開始買汽車、房子、冰箱、洗衣機、電動吸塵器，和各式各樣節省體力的裝置。在19世紀大幅提高農場效率的機器，到了20世紀開始為家庭做同樣的事。


    每次有新的發現、節省時間的新電器、節省體力和麻煩的新發明和產品，總會有維護傳統的人作壁上觀、嘲笑，並悽嘆簡單、自然的生活已成過去，追念昔日家庭自己烹煮食物、和旅館由家庭經營的美好時代。但他們只是徒然抗拒一個進步的大潮流，因為人們看到好東西自然知所取捨。家庭主婦偏好吸塵器勝過簡單的掃把，喜歡洗衣機勝過簡單的攪拌槽，她們鍾愛調理食物勝過在熱爐子前熬煮飯菜。在公路上，家庭期待住進連鎖旅館、在連鎖餐廳用餐，因為他們知道在那裡可以得到什麼樣的服務。孩子們看到強森（Howard
    Johnson''s）假日旅館或麥當勞便歡欣鼓舞。


    戰後的年代對上市公司來說是忙碌的年代，每年有數百家新公司上市，但絕大多數美國人避開股市。1929年大崩盤的記憶猶新，人們堅決不肯拿畢生積蓄到股市賭運氣，即使許多優良企業的股票賣得極為便宜。少數勇敢的股票投資人無不獲得豐厚的報酬。


    ## 投資人保護


    當你買股票、債券或共同基金時，即使不包括被假資訊誤導或被欺騙的危險，你原本就已承擔許多風險。因此投資人應受到保護，免於碰上詐騙、哄抬或偽劣冒牌貨等情況，就像顧客在零售商店享有的權利一樣。


    你買夾克時，你會想知道那是不是像售貨員所說的那種夾克，是用標籤上寫的材料製造，你支付的也是公平的價格。這就是政府通過真實廣告法的原因。當你買股票時，你需要知道那家公司的營運狀況是否就像其宣稱的，財務報表是否可靠，而且大約說來你買到的是否符合支付的價格。這就是政府通過嚴格的法規，規範股票經紀人、交易員、共同基金和專業基金經理人、企業主管和公司本身的原因。


    在大蕭條之前，許多這類保護措施並不存在。沒有法規要求公司申報詳細的財報，因此公司可以對投資人隱瞞經營問題。能比別人更早知道公司利多或利空消息的所謂內部人，可在消息傳出前買進或賣出股票，從「內線交易」（insider
    trading）獲得暴利。內線交易在當時還是會引人側目，但許多內部人仍照做不誤。


    在1929年崩盤前，一些強盜大亨及他們的親信經常在股市炒作股票圖利，他們知道如何操縱市場，在低價時嚇唬投資大眾賣出股票，在股價高得離譜時卻能誘使投資人買回當初以低價賣出的股票。


    當時很少投資人想深入瞭解自己擁有的公司，因為他們知道股價的起伏循環與公司的基本面毫無關係。投資人反而嘗試尋找聰明的下注方法，但除非你是內部人，否則這是不可能做到的事。當年買股票就像和專業賭徒打撲克牌，專業賭徒可以看牌，你卻必須戴眼罩。他們應該在股市豎立一道警告牌：小心投資，風險自負。


    直到大崩盤後，國會針對華爾街的各種炒作手法舉行聽證會，政府才採取遏阻這類行為的措施。證券管理委員會（SEC）隨之創立，其職掌就是制訂法規和懲罰違規者。證管會把它的工作做得很好，受到舉世的讚揚，因為沒有一個國家的股市比得上美國的公平和實，很少外國投資大眾受到像在美國的保護。


    華爾街的情況當然稱不上完美，人們偶爾還會聽到內線交易的弊端，但今日在股市違法亂紀的人通常難逃被抓到和懲罰的命運。公司的員工上至執行長、下至處理郵件的工友，只要知道任何會影響股價的消息，進場買賣股票就屬違法。朋友、親戚、銀行家、律師，甚至在洗手間不小心聽到內線消息的人，都不能從這些消息買賣股票獲利。證管會對這一點相當嚴格。


    假設你是波音公司的副總裁，你剛聽說中國已同意購買500架新巨無霸客機。你的第一個本能是跑去打電話給你的經紀人，要他趕快下單再買5,000股波音股票，但你不能這麼做。你甚至不能打電話給妻子、丈夫、女朋友、男朋友、兒女、孫兒女、阿姨、叔叔、堂表兄弟和打壁球的夥伴，告訴他們快買波音股票，因為那就是內線交易，你會讓那些人捲入嚴重的刑事犯罪。


    做這種事的人通常是怎麼被抓到的？股票交易所和證管會有自己的執法人員，他們會觀察股票交易的模式，如果有任何異常數量的買進或賣出就會發出警訊，調查人員將立即採取行動，找出進行交易的人。如果他們發現大買家或大賣家與公司有任何關聯，或與內部人扯上任何關係，他們就會深入追究，蒐集足夠提出控告的證據。


    證管會也監視所有報導、聲明和其他來自公司、經紀商、共同基金等機構對大眾公布的資訊。每隔三個月，每家公司都得申報簡短的公司營運狀況；每隔一年則必須公布一份較長的年度報告。公司必須告知大眾真實的資訊，否則將被處以罰款，公司的主管或董事可能被告上法院。


    主管和董事只要買賣自家公司的股票，就必須通知證管會，並把資訊公告給大眾。了解這些內部人如何處理自己的投資對投資人很有幫助，因為他們參與公司日常的營運管理，如果有幾個內部人同時出售公司股票，他們可能對公司前途不是很樂觀。另一方面，如果他們買進股票，很可能是看好公司前景。


    股票交易所本身除了有自己的守法部門外，也受到證管會監視。這些監管人員是股票的警察，他們監視交易廳和電腦系統，尋找可疑的活動。


    ## 典型的持股人


    紐約證交所每隔幾年就清查哪些人擁有股票、哪些人沒有股票。從1950年代以來，買股票的人逐漸增加，這是一個好趨勢，因為持股人愈多，財富就分散得愈廣。


    大蕭條結束後二十年，絕大多數美國人仍對股票心存恐懼，寧可把錢放在銀行裡，認為較穩當安全。但把錢存在銀行固然安全，他們卻錯過了1950年代大好的多頭市場。1952年時，美國只有650萬名持股人，只占全國人口的4.2%，其中80%股票握在1.6%人口的手中。所有股票上漲的獲利都由這一小群不怕股票、了解其利益大過風險的人賺得了。


    1962年時（1960年代是另一個股市大好的十年），持股人的數量增為三倍，有1,700萬美國人持有股票，大約是美國人口的10%。股價漲得愈高，就愈多人跳上列車，到了1970年，美國持有股票者達到3,000萬人，占人口的15%。


    股市不再像1950年代一樣是個秘而不宣的話題，空前的持股人數長期來看是一件好事。但熱切的股票買家把股價推到危險的高點，因此到了1970年，大多數股票超漲的情況已經很嚴重。從各種標準衡量，人們買股票支付的價格都已高得離譜，他們因為愛上股市賣的任何股票而喪失理智。


    這種狂熱在百年內發生過幾次，而每次發生時，市場的「修正」就會讓股價下跌到較合理的水準，在高點買到股票的人難免遭到衝擊。他們無法相信自己在很短的時間內損失這麼多金錢。當然，除非他們賣出股票，否則不會真的有損失；但許多投資人總會賣出，在恐慌中拋售所有持股。他們以過高的100美元買進一檔股票，幾週後就以70美元或60美元的低價賣出。他們的損失正是新買家的獲利，因為如果賣家能夠守住持股、耐心等候修正完成，股價就可能回升到原來的價位。


    在1970年代初期殘酷的股市修正中，有極多人賣出股票，大約500萬名持股人集體退出市場，占美國人口的3%。五年後才有同樣多的人重回股市，使美國持股人口恢復到3,000萬人。


    到1980年代中期，投資股票的人口已膨脹到4,700萬人。每五個美國人就有一個持有股票，而這些持股人中有33%是透過共同基金投資。紐約證交所所有股票的市值突破1兆美元大關。


    1990年時，美國持股人口有5,140萬人，創歷來最高紀錄，而透過共同基金投資的人數增加到十年前的四倍。一般投資人不再有興趣自己挑選股票，而把這個工作交給當時有約4,000檔基金的專業基金經理人。


    1990年典型的持股人是約45歲的男性，或44歲的女性。男性的年所得為46,400美元；女性則為39,400美元。男性擁有價值1.35萬美元的股票，女性的持股價值則約7,200美元。後期的年輕投資人數量大幅增加，年齡21歲以下的持股人達370萬人，占該年齡層總數的7%。這是一個很好的發展。


    到1995年，紐約證交所所有股票的市值達到5兆美元，與同樣這些股票在1980年時價值1.2兆美元已不可同日而語。不管大投資人或小投資人在工作、遊戲、睡覺和過每日生活的同時，他們放在股票上的錢已經在十五年間為他們賺進至少4兆美元。這才是真正的錢滾錢！


    ## 2 投資基本原則


    ## 現在就投資：你還等什麼？


    許多人等到他們已經三十幾、四十幾和五十幾歲時才開始存錢。他們突然想到自己已不再年輕，很快將需要額外的錢來供應退休所需，讓他們可以在湖邊買一間小屋或環遊世界。問題是，等他們發現自己應該投資時，已浪費了許多股票可以自己增值的寶貴歲月。


    他們的錢原本可以自己滾出許多錢來。但他們花掉所有錢，好像不會再有明天。他們有許多開支是省不了的，因為他們有兒女要撫養、要支付醫生帳單、學費、保險費、修理房子帳單等。如果沒有剩餘的錢，他們也無法投資，但通常總是有剩餘，只是他們依舊不肯投資。他們把這些錢用來上時髦的餐館吃飯，或用來支付最昂貴汽車的頭期款。


    不知不覺間，他們已經日暮西山，而口袋除了社會安全支票，卻沒有多少餘錢。他們在應該開始享福的時候，卻必須節衣縮食度日，因為光靠社會安全支票會讓他們捉襟見肘，連基本生活都難以應付。


    避免這種命運的最好方法之一是儘可能提早儲蓄，從你還住在家裡時開始。否則你的支出怎麼可能少到能存錢？這時候你還不旁撫養小孩——你的父母可能還供養你。如果他們不收你的房租，那更好，因為要是你有工作，你可以把錢投入未來能獲得報酬的投資裡。你在父母還供養你時投資得愈多，等你搬出去住、支出大幅提高後才有能力過好生活。


    不管是一個月10美元、100美元或500美元，儘可能定期省下你能省的錢。


    根據新聞報導，許多二十多歲、三十多歲的人都搬回父母家住，以便有免費的房間，免費的電視、錄放影機、運動器材等。這趨勢似乎顯示出，美國已製造出一個白吃白住的新世代，他們缺少出去闯天下、自立門戶的雄心壯志。但這件事有一個我們很少聽人談起的好處，就像《華爾街日報》近來一篇報導所說的：「X世代開始為退休存錢了。」


    這則報導的重點是，二十多歲白吃白住的世代是所謂「失落的世代」，也稱為X世代，他們正悄悄把錢存起來。顯然這個族群的年輕人存錢的比率高於他們的父母，這些父母是嬰兒潮世代，他們偏好現在花錢、以後再存錢。X世代發現，他們不能指望社會安全計畫來保障他們未來的支出。他們看到父母辛苦賺錢償付信用卡債務，所以想避免重蹈覆轍。他們追求財務獨立，並趁著還住在家中時努力朝向這個目標，由父母來支付帳單。


    這是一個很好的發展，我們只希望更多年輕人追隨這些人的腳步，別掉入類似購買昂貴汽車的陷阱。許多孩子等不及做這件事，他們一找到第一份工作，便立刻變成汽車貸款的奴隸。開著拉風的卡馬洛（Camaro）新車當然比二手的福特愛思寇（Escort）酷得多，但這種酷長期來看代價十分高昂。酷的代價有多高？想想下面兩個例子：畢貝利（Joe
    Bigbelly）和卡薇兒（Sally Cartwheel）。


    畢貝利在沃爾瑪找到一份工作，他住在家裡，省吃儉用以便支付一輛2萬美元的卡馬洛汽車頭期款2,000美元，其餘的1.8萬美元全部來自汽車貸款。他父母必須出面簽字貸款，但由畢貝利支付貸款。那是一筆利率11.67%的五年期貸款，他每個
    月得匯給金融公司400美元。他第一次匯錢時為那400美元心痛了一下，但當他開著卡馬洛車到處逛、聽他朋友誇讚那輛車有多酷時，心痛的感覺立刻拋到九霄雲外。


    幾個月後，車門上有了刮痕，車子的地毳有了污漬，當卡馬洛車開進停車場時已沒有人大驚小怪。現在那只不過是另一輛車罷了，但畢貝利已深陷汽車債務中。為了供養汽車並開車和女孩子約會，他兼了一份晚上的工作，但這表示他沒有太多時間約會。


