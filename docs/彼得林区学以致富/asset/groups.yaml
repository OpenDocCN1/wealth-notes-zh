    ## 比學習解讀能讓你變成終身成功投資人的密碼還刺激？


    公司必須按照要求寄出所有報告，他們不能推說忘記寫報告，或任何堵塞的理由。他們不能取消年度股東會，或找藉口不舉行。他們不能隱瞞事實，不管是多少不愉快的事實。他們必須全盤交代清楚，好的和壞的，讓每一個股東都知道真正的情況。法律就是這麼規定的。


    如果生產線出了什麼差錯，或產品賣不出去導致公司虧損，或執行長捲款潛逃，或某人控告公司，公司都必須公告周知。


    在政治上，民選官員和候選人誇大事實來支持自身的論點很常見。當政治人物扭曲事實時，我們說那是搞政治；但當一家公司扭曲事實時，就成了華爾街醜聞。


    故意誤導股東的公司（這很少發生）得面對嚴厲的懲罰，犯罪者可能被罰款或送進監牢。即使是非故意的（較常發生），誤導股東的公司也會計在股市受到懲罰。只要知道公司隱瞞事實，許多大投資人會立刻拋售股票。大量賣出股票會導致股價大跌。我們看過不少公司在醜聞傳出當天，股價就暴跌一半以上。


    當一檔股票在一夕之間損失一半價格，這會衝擊所有投資人，包括從執行長以下的許多企業內部人，他們可能擁有大批股票，所以確保公司披露事實而不誇張符合他們的利益。他們知道事實遲早會被社會大眾知道，因為公司有數百個、甚至數千個股東在密切監視。棒球選手無法吹噓自己的打擊率是.320，實際上每天看運動統計分數的球迷知道他的打擊率是.220。華爾街也一樣，一家公司不能吹噓自己獲利打破紀錄而實際上卻沒有——有太多投資人的眼睛緊盯著看。


    ## 一切都是為了獲利


    公司營運只為了­de­一個基本目的，不管是上市公司或私人公司、由一個股東或百萬個股東擁有，目標都相同——獲利。


    獲利是支付所有開銷後剩下的錢，可分給企業的業主，不管是奇異、百事、漫威漫畫，或週末在社區提供洗車服務的公司都一樣。如果沒錢可賺，你不會頂著大太陽、提著水桶用海綿幫人洗車。也許你喜歡洗車，因為你可以偶爾拿水管澆澆自己，讓你在夏日豔陽下保持涼爽，但這不表示你願意提供免費服務。


    這個道理也適用於擁有公司股票的人，他們買股票不是因為被邀請參加年度股東會很好玩，或喜歡收到公司寄來的年度報告。他們買股票是因為預期公司能賺錢，並在將來某個時候會把部分獲利分給他們。


    一些人仍有錯誤的觀念，認為做事為了獲利是貪婪或卑劣的行為，是欺騙社會其他人，因為只要有人賺錢，就會造成社會其他人的虧損。


    三十年前接受這種觀念的人比今日多，但現在仍有一些人存有這種想法。一個人獲利就是另一個人的虧損，是共產主義的基本教條，也流行於校園和其他地方的社會主義者中，他們只要有機會就大肆譴伐資本主義者把自己擺第一、其他人擺最後，藉由剝削受薪階級而致富。


    前面我提到亞當·史密斯的《國富論》，這本書歷經兩百年仍很受歡迎，你可能想看看。只要有資本主義和獲利動機，史密斯的「看不見的手」就會指引金錢流向能做最多好事的地方。


    個人電腦是「看不見的手」運作的例子。當個人電腦發明出來、受到人們歡迎時，許多新公司隨之成立，投資人排隊買股票，把數十億美元資金投入電腦業。結果是更好和更快的電腦，以更低的成本製造，並且激烈的競爭讓價格下降。激烈的競爭也使許多公司倒閉，但存活的公司能以最低價格製造出最好的產品。


    適者生存不只動物界如此，也發生在資本主義世界。賺錢而管理良好的公司，在股市獲得獎賞，因為公司若績效良好，股價就會上漲。這會讓投資人很開心，包括擁有股票的經理人和員工。


    在管理不良的公司，績效平庸，股價因而下跌，所以管理不良遭到懲罰。股價下跌讓投資人生氣，如果他們夠生氣，可能施壓要求公司開除差勁的經理人，並採取提振公司獲利的其他行動。


    大體說來，一家高獲利的公司會比低獲利公司吸引更多資金，有了更多資金後，高獲利公司將變得更強壯，擁有可擴張和成長的資源；反之，低獲利公司難以吸引資金，可能日漸萎縮，最後因為缺少財務養分而死亡。


    適者生存弱者倒閉，所以錢不會浪費在它們身上。沒有弱者的阻礙，錢會流向最能善加利用它的企業。


    所有公司的員工都應該追求獲利，因為如果公司不賺錢，他們很快就會失業。獲利是成就的跡象，那表示有人製造出對他人有價值的東西，使他人願意花錢購買。創造獲利的人會受到激勵，想以更大的規模重複他們的成功，而這表示為他人創造更多就業和更多獲利。


    如果資本主義者和投資人自私而貪焉、一心只想累積自己財富的指控是真的，為什麼世上最富裕的國家也是慈善捐獻最多的國家？美國的捐款在世界上排名第一，其中以民間個人捐獻占大部分。例如在1994年，美國人從自己的口袋拿出1,050億美元來協助無家可歸、病弱、失業和老年人，以及醫院、教會、博物館、學校、退伍軍人、聯合勸募協會（United
    Way）、傑利的孩子（Jerry''s Kids）並從事許多善行。


    資本主義不是零和遊戲。除了少數的壞人，富人並非靠著讓他人變窮以致富。當富人變得更富有，窮人也跟著變富有。如果富人真靠著令他人變窮而致富，那既然美國是世上最富有的國家，現在應該已經在國內製造出世界上最貧窮的階級了。但美國的情況卻正好相反。


    美國仍有嚴重的貧窮問題，但比起印度、拉丁美洲、非洲、亞洲或東歐這些資本主義才剛立足之處所見的貧窮，美國的問題輕微多了。當公司成功並且變得更加賺錢，就表示有更多的就業機會與更少的貧窮。


    ## 成長工廠


    每個擁有股票的人都希望公司成長，但這不表示它會變得太自滿而必須搬進較大的建築，雖然搬進大建築是成長的跡象。成長指的是獲利的成長，代表公司今年賺的錢比去年更多。當投資人談到「成長」，他們談的不是規模，而是指獲利能力，也就是盈餘。


    假如你洗三輛車，每輛各6美元，而你花2美元買一瓶清潔劑、1美元買一塊新海綿，所以你賺了15美元——你洗車收入的18美元，減去買材料的3美元。再用同樣的清潔劑和海綿洗五輛車，你將再賺30美元，不必再花額外的原料成本。你的盈餘變成三倍了，這表示你的口袋裡有更多現金，所以你可以買唱片、電影票、新衣服和更多股票。


    一家公司在12個月內盈餘增為兩倍，會讓華爾街舉行狂歡慶祝會，因為企業成長這麼快很罕見。發展穩定的大公司一年盈餘若增加10％到15％就會很開心，而活力較充沛的年輕公司盈餘可能增加25％到30％，但不管是哪一種公司，它們追求的就是盈餘。那是投資人尋找的，也是股票上漲的原因。


    換一種思考的方法。假設你有個朋友正要組一個搖滾樂團，需要錢買樂器設備。所以他向你提出下列建議。如果你出資1,000美元買高功率擴大器，他會給你樂團10％的所有權。你們兩人簽了一紙這項安排的合約。


    在樂團初試啼聲之前，你感覺自己好像做了一樁蠢交易。它花了你1,000美元買10%的樂團所有權，而樂團唯一的資產是你付錢買的擴大器。這時你擁有自己的擴大器10%股權。但假如這個搖滾樂團被當地的俱樂部僱用，在週五晚上的時段表演，每週酬勞為200美元。現在樂團的價值己超過那具擴大器，它有盈餘了。你擁有盈餘的10%，每週能賺進20美元。


    如果樂團受到聽眾喜愛，酬勞提高到400美元，盈餘在一夜間增長為兩倍，你每週能賺進40美元。


    這時你擁有的那紙合約不再不值錢。如果你願意，甚至可以賣掉它。但如果你相信這個搖滾樂團，你就會守住你的股份，因為有天這個樂團可能錄一張唱片、上MTV，變成下一個當紅樂團。如果發生這種事，你將每週賺進數千美元，你10%股權的價值將遠超過當初你提供擴大器時所能想像。


    人們買進迪士尼或銳跑、或任何上市公司股票的理由都和你投資搖滾樂團一樣。他們寄望迪士尼、銳跑或任何上市公司的盈餘會增加，而盈餘的一部分能以股價上漲的形式讓他們獲利。


    這個簡單的道理——股票價格直接與公司的獲利能力相關——往往被忽略，甚至經驗老到的投資人也忘記這一點。觀察股票行情的人開始認為股價有自己的生命，他們追蹤股價的上漲和下跌，就像賞鳥人追蹤鼓動翅膀的雁子。他們研究交易模式，製作曲折起伏的圖形。他們嘗試思索「市場」在做什麼，然而實際上他們該追蹤的卻是自己股票的公司獲利的情況。


    如果獲利持續增加，股價註定會上漲。也許它不會立刻上漲，但最後一定會。如果獲利減退，很可能股票的價格將下跌。盈餘降低會減損公司的價值，正如流失聽眾和唱片賣不出去的搖滾樂團。


    這是成功選股人的出發點：尋找未來許多年盈餘可持續成長的公司。整體股票的平均價格長期每年成長約8％並非偶然，發生這種情況是因為整體公司平均每年盈餘增加8％，加上它們支付3％的股利。


    根據這些假設，當你投資一組具代表性的公司時，這個獲利的機率對你很有利。有些公司的表現會比其他公司好，但整體來說，他們盈餘會增加8％，並支付你3％股利，而你會獲得11％的年報酬率。


    股價本身無法告訴你是否做了一筆好交易。你會聽到有人說：「我不買IBM，因為每股100美元太貴了。」也許是他們沒有錢買每股100美元的IBM，但每股100美元與IBM是否太貴無關。一輛15萬美元的藍寶堅尼（Lamborghini）大多數人無法負擔，但就藍寶堅尼來說，這個價錢可能不算貴。同樣的，每股100美元的IBM可能很便宜，也可能不便宜，那取決於IBM的盈餘。


    如果IBM今年每股盈餘是10美元，那麼你以100美元買一股IBM等於支付盈餘的10倍，以今日的市場來說算便宜。另一方面，如果IBM每股盈餘只有1美元，每股100美元就等於支付盈餘的100倍。換句話說，本益比為100倍，對IBM來說實在高得離譜。


    本益比是一個複雜的主題，如果你對挑選自己的股票有興趣，值得進一步深入研究。但就目前來說，有下面幾個關於本益比的重點。


    如果挑選多家公司，把他們的股價加起來，然後除以它們的盈餘，你可以得出一個平均本益比。在華爾街，人們用這種方式計算道瓊工業指數、標普500指數和其他指數公司的本益比，得出所謂的「市場乘數」（market
    multiple），也就是市場的平均本益比。


    市場乘數是很有的數值，因為它告訴你在特定的時間，投資人願意以多高的價格買多少盈餘的公司。市場乘數起起伏伏，但通常維持在10到20的範圍內。1995年年中的美國股市平均本益比約16倍，這表示整體來說股票不便宜，但也不算太貴。


    總之，一家公司的盈餘成長愈快，就有更多投資人願意為它的盈餘買公司股票。這是積極進取的新公司本益比往往超過20倍以上的原因。人們寄望這些公司有很驚人的發展，願意支出較高價格擁有其股票。根基穩固的舊公司本益比約在10到15倍間，它們的股價相對於盈餘較便宜，因為穩固的公司往往成長較慢，不會有爆發式的成長。


    有些公司盈餘持續穩定成長，這是成長型公司。另一些公司盈餘成長不規則，時好時差，則屬景氣循環型公司——汽車、鋼鐵、重工業等產業在某些經濟情況下表現較好。它們的盈餘時好時壞，所以其本益比較盈餘穩定成長的公司低。它們每年盈餘的多寡取決於經濟情況，而經濟情況很難預測，這一點我們會在第四章談到。


