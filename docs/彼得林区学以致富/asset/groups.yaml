    卡薇兒也住在家裡，也在沃爾瑪的賣場結帳區工作，離畢貝利只有幾呎遠，但她沒有買酷車。她花了儲蓄的2,000美元，買了一輛二手福特愛思寇。因為卡薇兒支付現金，所以她不必繳汽車貸款，反而她每月匯400美元給那家金融公司，投資400美元在股票共同基金上。


    五年後，當畢貝利匯出最後一筆汽車貸款時，卡薇兒共同基金投資的價值已增加一倍。基金本身增值一倍，加上每月穩定貢獻400美元到基金，使卡薇兒現在擁有的資產達到3萬美元。她還擁有那輛愛思寇，這輛車足夠她上下班用，而且她不必煩惱車子的污漬和刮傷，因為她從沒把她的汽車當作投資。那只是交通工具罷了。


    在我們結束這則經濟寓言故事時，卡薇兒已經有足夠的錢分期付款買自己的房子，並搬出父母的房子，而畢貝利仍繼續當啃老族。他曾邀她約會，但她看上一個帶她到處看房子的房地產經紀人。


    ## 讓錢為你工作


    錢是很棒的朋友，只要你懂得怎麼讓它為你工作。錢能讓你不費吹灰之力，就能在口袋裡擁有額外的現金。舉例來說，你存了500美元在支付5%利息的儲蓄帳戶，一年後你多出25美元，而且不必為一塊草坪除草、或洗五輛車就能賺到它。這是你的錢幫你賺的。


    那25美元剛開始可能感覺不多，但如果你每年存500美元、連續十年，5%的利息以複利計算並累積起來會如何？等你第十次存款那年結束時，你將擁有6,603.39美元。其中5,000美元是你存的，1,603.39美元則是你的錢幫你賺的。


    如果你在股市一年投資500美元，而不是存放在銀行裡，那些錢就有機會在你過悠閒生活的同時，為你做更多事。平均來看，如果你把錢投資在股市，每隔七、八年你的錢將可增值一倍。許多聰明的投資人學會利用這一點，他們知道資本（錢）的重要性不下於他們的工作（努力）。


    巴菲特（Warren Buffett）就是靠儲蓄、然後投資股票而致富。他一開始做許多孩子會做的事：送報紙。他存下賺到的每一塊錢，年紀輕輕就了解金錢未來的價值。對他來說，他在商店裡看到一部400美元的電視機並不真的值400美元。他總是想著，如果他把那400美元拿來投資而非花掉，二十年後會值多少錢。這種想法讓他始終不浪費錢在他不需要的東西上。


    如果你很早就開始存錢和投資，你的錢將足以支持你。這就像有個有錢的叔叔或阿姨，一輩子給你所有你需要的花費，而你甚至不需要寄一張謝卡，或在他們生日時去探望他們。這是大多數人希望的事，是獲得財務獨立的機會，可以去任何地方、做任何事，而同時他們的錢留在家裡為他們賺錢。但除非你養成儲蓄和投資的習慣，每月存下某個金額的錢，而且要趁著年輕時做，否則將無法實現。


    最理想的「A+」情況是，你把薪水的一部分存下來做投資。等而下之的「C-」情況是，你把所有錢都花掉。不及格的「F」情況是，你的信用卡債愈來愈多，帳單一直付不完。當你必須支付別人利息時（通常是信用卡公司），你非但沒有讓你的錢幫你賺錢，而且還讓信用卡公司的錢賺你的錢。


    不管是西爾斯、殼牌（Shell）或發行信用卡的銀行，企業最愛你用信用卡買東西，只支付一部分現金。他們用自己的錢支付你的帳單，算是借錢給你，雖然你可能不這麼認為。他們對你未付的帳款餘額收取高利息，可能高達18%，所以他們從你口袋賺取的利潤，要遠高於投資股票的預期報酬。換句話說，對信用卡公司來說，投資你比投資股票好賺。


    當你用利息18%的信用卡購買一台400美元的電視機，你的貸款一年會讓你多花72美元。如果你每月支付最低應繳金額，讓貸款拖欠更長的時間，最後你可能花800美元買那部400美元的電視機。數百萬名信用卡使用者沒有搞清楚這些，否則美國人積欠銀行的信用卡債就不會高達3,400億美元了。據估計，光在1995年支付給銀行的信用卡債利息總額就高達450億美元。每年美國人多支付這450億美元，只為了能在沒有現金時立刻買東西。


    這叫作立即滿足，而購物者為此付出高昂的代價。他們看到廣告，找遍許多家店尋找最划算的電視機交易，為他們省下幾塊錢，然後用信用卡支付電視機的錢，結果讓他們多花幾百美元。他們自願這麼做，完全不思考這是怎麼回事。


    在古時候，大約四十五年前，晚餐俱樂部還沒有採用可在多家商店使用的信用卡前，人們真的得等手上有現金才能上街買東西。他們得先存錢才能買電視機、電器、家具，或是去渡假。他們可能花上半年、九個月，甚至一、兩年，以便存夠購物的錢，但他們不必支付利息。


    信不信由你，用這種原始方式購物，沒有立即的滿足，卻是一件快樂的事。當你存錢買下一台電視機，你可以坐在客廳談論擁有電視機是多麼有趣的事。想像那部電視機，或洗衣機，或那套新衣服，本身就充滿樂趣。


    當人們辛苦工作、為一次付清錢買東西做出某些犧牲時，他們會感到自豪。欠銀行錢會讓他們緊張，而當付清所有房屋貸款時，他們會開派對，邀請所有街坊鄰居一起慶祝。直到1960年代，美國人開始養成使用信用卡的習慣；到了1980年代，一般家庭都債務纏身，陷於深重的住宅抵押貸款、汽車貸款和信用卡債中。


    換句話說，許多家庭讓自己陷入「F」的情況——非但沒錢投資在股票或存在銀行，反而是銀行的錢在賺他們的錢。他們每年支付數百美元、甚至數千美元的利息。買房子或公寓支付貸款利息不是問題，因為房子會增值，但汽車、電器、衣服或電視機不會增值，它們的價值只會愈用愈少。


    債務是儲蓄的相反。債務累積愈多，你的生活就愈淒慘。我們從美國各地許多被債務逼迫的人看到這種情況。還有美國政府本身正深陷約5兆美元債務的深淵中。現在納稅人繳納的1美元稅金，就有15美分得用來償付國債的利息，而且這個數字還不斷升高。國債不斷增加是因為政府的花費比收入多，不夠的錢就向個人、退休基金、銀行、外國政府借——任何願意借的都行。我們常聽到平衡預算和削減赤字的討論，但我們每年還是累積有1,000億、2,000億、3,000億美元的新債務累積到舊債務上。


    想像一下，你去年用信用卡買了價值1,000美元的東西，今年你又用同一張信用卡買了900美元的東西。除了華府以外，任何地方的人會說你增加了900美元債務，因為你去年欠下信用卡債1,000美元，現在則欠1,900美元。但在華府，他們不這麼想，他們說你減少債務100美元，因為你沒有像去年那樣增加1,000美元的債務，只增加了900美元的債務。


    這就是政府自我陶醉說削減赤字、但實際上赤字持續增加的情況。例如今年的債務增加2,000億美元被說成「減少」，那是因為去年政府增加的債務是2,500億美元。實際上債務當然沒有減少，而是又增加了2,000億美元，加上利息，是我們的兒女和兒女的兒女總有一天必須還的債。這些債務會繼續累積，直到政府停止使用信用卡，而只花用它課徵得來的稅收。現在政府得到一個「F-」，並且為所有人立下反面的榜樣。


    美國曾經是一個儲蓄的國家，每個所得階層的人都儘可能把錢儲蓄起來，大部分放在地方銀行的儲蓄帳戶裡。這些存款為他們賺進利息，所以最後他們可用來支付房屋的頭期款，或買東西，或支應家裡的緊急需求。另一方面，銀行可以拿人們的積蓄借給購屋者，或房屋營建商，或各式各樣的企業。


    高儲蓄率的國家有錢支付興建道路、電話線、工廠、設備，以及各種最新的發明，以協助企業生產更好、更便宜的產品，賣到世界各地。日本就是一個好例子。日本幾乎毀於二次世界大戰，但它極力扭轉頽勢，變成一個經濟強權。日本人從製造塑膠玩具和裝飾品開始，起初「日本製造」是眾人的笑柄。但不久後，美國人開的汽車有三分之一是日本車，美國家庭的電視全都是日本電視，「日本製造」變成高科技和高品質的象徵。


    日本能夠重新打造工具、重建城市和鄉鎮，要歸功於高儲蓄率。到今日，日本仍是一個儲蓄國家。美國在這方面有許多要仿效日本之處，因為美國人已不再像以前那樣儲蓄了。在我們每年把4%的錢存下來的同時，日本、德國、中國、印度、台灣和許多其他國家的人卻每年儲蓄10%、20%或更多。在使用信用卡和借錢買馬上享用、卻負擔不起的東西上，美國領先世界各國。


    儘可能儲蓄愈多愈好！你將能幫助自己、幫助你的國家。


    ## 五種基本投資方法的優缺點


    有五種投資的基本方法：把錢存在儲蓄帳戶或類似的地方、買收藏品、買公寓或房子、買債券，以及買股票。讓我們逐一檢視這些方法。


    ### 一、儲蓄帳戶、貨幣市場基金、國庫券和定期存單


    以上各項都是短期投資。它們有一些優點：它們支付利息，你可以在相當短的時間內回收你的錢。在儲蓄帳戶、國庫券（Treasury bill）和定期存單（Certificates
    of Deposit, CD），你的錢保證不會損失，所以一定可以回收你的投資。（貨幣市場沒有這種保證，但在貨幣市場虧損的機率微乎其微。）


    短期投資有一個大缺點，它們支付你很低的利息。有時你在貨幣市場帳戶或儲蓄帳戶得到的利率趕不上通貨膨脹。從這一點看，儲蓄帳戶可能是虧錢的投資選項。


    通貨膨脹是物價上漲的委婉說法。當汽油從每加侖1.10美元漲到1.40美元，電影票4美元漲到5美元，那就是通貨膨脹。另一種解釋通貨膨脹的方法是：金錢的購買力下降。


    在最近這段期間，通貨膨脹大約還不到3％，這表示你擁有的每1美元每年損失近3美分。這種損失累積的速度很快，如果以現在的通膨率，十年間你擁有的每1美元都將損失30美分。


    儲蓄和投資的第一個目標是趕上通貨膨脹。你的錢是在一架不斷往後退的跑步機上，以近幾年來看，你的投資必須賺3％才能趕上它倒退的速度。


    右表清楚地顯示，貨幣市場和儲蓄帳戶支付的利息，往往不足以彌補通貨膨脹的損失。當你扣掉利息收入要繳的稅後，貨幣市場和儲蓄帳戶在下表顯示的二十年間，至少有十年會出現虧損。


    這是把錢放在銀行或儲貸機構的問題。那些錢短期內很安全，因為可以保證不損失，但長期來看，稅金和通貨膨脹卻可能帶來虧損。有一個要訣——當通膨高於你從定期存單、國庫券、貨幣市場帳戶或儲蓄帳戶得到的利率時，你的投資就是虧損的投資。


    儲蓄帳戶是暫時存放錢、但在你需要支付帳單時可以很快提領錢的好地方。它們也是暫時存錢、直到錢多到可以投資在別處的好地方。但就較長期來看，它們對投資沒有好處。


