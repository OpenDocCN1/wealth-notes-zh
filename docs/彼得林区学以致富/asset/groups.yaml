  - '[PAGE 271]


    Liabilities），這部分是公司的負債。在第一天，電腦說公司沒有任何負債，因為巴克萊的10萬美元銀行貸款是個人貸款——他以自己的房子抵押貸款。公司的負債是零。


    在流動負債底下，你會看到權益（Equity）。公司以兩種方式獲得權益：出售公司股票，或從營運赚钱。在第一天，電腦說公司還未從營運賺任何錢——注意「保留盈餘」（Retained
    Earnings）是零——它唯一的權益是巴克萊投資公司的10萬美元。這是投入資本（Paid-in Capital）。


    在權益之下是負債與股東權益（Liabilities & Shareholder Equity），就是總負債、投入資本和保留盈餘的總和。接著你看到發行在外股份（Shares
    Outstanding）。當巴克萊投資初始的10萬美元在公司時，他發行1萬股股票給自己，因此每股價值10美元，顯示在第一天的帳面價值（Book Value）為10美元。這可由巴克萊任意決定，他也可以發行1,000股給自己，每股價值100美元。


    不管是巴克萊的公司或通用汽車，資產負債表記載的方式都相同。你可以一覽無遺看到正方——現金、庫存等等——以及負方是什麼。


    過了第一天以後，我們看到資產負債表繼續發展。讓我們看看第一年結束的情況，回到資產負債表的頂端。在流動資產下，你看到現金只剩2.5萬美元——巴克萊已把其餘的錢花在營運和製造產品「介面」上。'
  - '[PAGE 272]


    然後你看到應收帳款（Accounts Receivable）為19,500美元，這表示巴克萊的部分顧客買了「介面」，但還沒有支付帳款。19,500美元是公司還沒有收到的錢——所以是應收帳款。這是顧客欠公司錢的總金額。


    接著我們來到庫存（Investories）為3萬美元，這表示價值3萬美元的「介面」還堆在巴克萊的車庫，等著被賣出——包括用來製造更多「介面」的零件。未賣出的商品被算成資產，雖然不保證巴克萊一定能以一般價格賣出這些。


    再看不動產、廠房與設備，你注意到減累計折舊金額為1萬美元。巴克萊已注銷（written off）價值1萬美元的機器。他花了5萬美元買這些機器，但現在記載在帳冊上的價值只剩4萬美元，因為他擁有的這種機器會很快過時，國稅局允許他每年注銷20%的價值。最早記載在不動產、廠房與設備項目下5萬美元支出的20%，就是1萬美元。


    在負債（Liabilities）部分，我們發現應付帳款（Accounts Payable）下的1萬美元。如果應收帳款是別人欠巴克萊的錢，應付帳款就是巴克萊欠別人的錢。它代表所有他還沒支付的帳單：電話費、電費、供應商的貸款等等。


    在負債底下的權益項目，你看到保留盈餘4,500美元。這就是盈虧的結果——巴克萊從第一年營運就獲利。公司現在擁有權益為10.45'
  - '[PAGE 273]


    萬美元。這包括巴克萊初始投資的10萬美元，加上第一年的公司盈餘4,500美元。


    巴克萊可以選擇如何處理他的獲利，他可以把4,500美元藉由發放股利放到自己的口袋裡。不過，他沒這麼做，而是把它留在公司，以便有額外的錢可投資在讓公司成長，所以我們稱這筆盈餘是「保留」盈餘。


    這筆盈餘加上他初始的10萬美元，讓巴克萊的公司現在價值10.45萬美元——這是第一年年底時的權益。由於巴克萊發行1萬股股票給自己，所以現在每股價值為10.45美元（10.45萬美元除以1萬股），這稱作公司的「每股權益」（equity
    per share），或「帳面價值」（book value）。


    進入第二年以後，數字顯示電腦說公司已擴張業務，銷售更多「介面」，應收帳款和庫存持續增加。在第二年，另一項因素加進負方：12.1萬美元的銀行債務。這一次不是巴克萊借這筆錢，而是由公司借款。電腦說公司需要資金擴張營運：買新機器、更多庫存、新員工等。


    你是否注意到銀行債務未被納入資產負債表底下的權益？當銀行借錢給公司，銀行並未成為業主。買公司債券的人也不會成為業主。巴克萊仍然擁有全部10萬股股票，在經過兩年的保留盈餘後，他的權益增加到11.45萬美元。


