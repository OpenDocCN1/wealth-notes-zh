    ## 序言


    美國的中學忘了教導一門最重要的課程：投資。這是一個嚴重的疏失。我們教導歷史，但卻不教資本主義大步邁進這部分，也不教公司在改變（大部分是改善）我們的生活方式時扮演什麼角色。我們教導數學，但不包括如何以簡單的算術來敘述一家公司的情況，協助我們判斷其營運會成功或失敗，以及我們能不能透過擁有其股票而獲利。


    我們教導家政課：如何縫紉、烹飪火雞，甚至如何編家用預算和記錄帳本。但我們忘了教導及早儲蓄是日後富裕的關鍵，以及把錢投資在股市是除了買房子之外最聰明的做法，還有愈早儲蓄和投資股市，你的長期獲利就愈可觀。


    我們教導愛國，但談論的是軍隊和戰爭、政治和政府，而不談數百萬家或大或小的企業如何營運，然而後者卻是國家繁榮強大的關鍵。如果沒有投資人提供金錢來創立會僱用新員工的新公司，或協助舊公司擴張、變得更有效率和支付更高的薪資，我們所知的世界將會崩潰，人們將會失業，而美國也將隨之衰亡。


    過去五年來，*昔日被稱作共產集團、被圍在鐵幕後的國家發生一件重大的事。這些國家的人民揭竿推翻他們的政府，把共產黨領導人趕下台，希望總有一天他們的生活可以改善。他們渴望民主政治、言論自由和宗教自由，然而除了各種人權外，他們也想要自由企業。這包括製造東西、銷售產品、在商店買東西、能擁有房子、公寓、汽車或自己的事業，這些都是直到不久前有半個世界的人口還無緣享受到的權利。


    俄羅斯人和東歐人走上街頭、示威抗議、罷工、集會、發出怒吼，並奮力爭取我們已經擁有的經濟體制。許多人為這個目標遭逮捕入獄，許多人喪失性命，然而我們自己國家的學校卻不教導這種經濟體制如何運作、有何優點，以及如何藉由變成投資人來善加利用它。


    投資很好玩，投資很有趣。學習投資可以變成一種讓人生在很多方面都更豐富的經驗。學習投資可以讓你生活於富足之中，但大多數人直到中年後才開始了解投資的竅門，而這時他們已經老眼昏花、腰圍有如水桶；他們在這時才發現擁有股票的好處，卻只能後悔沒有及早做投資。


    在我們的社會，向來是由男人處理大部分理財事務，女人則在旁邊觀看男人笨手笨腳處理事情。但在投資這方面，女人完全可以和男人做得一樣好。而且沒有人可以靠遺傳獲得投資的竅門，所以當你聽到有人說「他是投資的天生好手」時，別輕易相信。投資的天生好手都是神話。


    *譯註：本書出版於1996年1月。


    理財的原則很簡單、很容易掌握。第一個原則是儲蓄等於投資。你把錢存在撲滿或餅乾罐裡不算是投資，但你只要把錢存在銀行，或者買儲蓄債券，或買公司的股票，你就是在投資。有人會利用那些錢來開設新商店、蓋新房子或新工廠，進而創造就業。更多就業意味有更多員工領到薪水。如果員工設法把部分收入儲蓄起來和做投資，整個過程就此周而復始。


    每個家庭、每家公司和每個國家的財務都是如此。不管是比利時或波札那、中國或智利、莫三比克或墨西哥、通用汽車（GM）或奇異（GE）、你的家庭或我的，能為未來儲蓄和投資的人，未來就比一有錢就浪費的人更富裕。為什麼美國是一個如此富裕的國家？因為美國曾經是世界上儲蓄率最高的國家之一。


    一定有許多人告訴過你，接受良好的教育很重要，如此你才能找到有前景的工作，領到不錯的薪水。但他們可能沒告訴你，長期來看，你未來的富裕不只是取決於你賺多少錢，還要看你如何善用這些錢來儲蓄和做投資。


    開始投資的最佳時間是你年輕時，我們在後面章節將深入討論這點。你給投資成長的時間愈久，最後得到的財富就愈多。但這本介紹理財的書並不只是給年輕人看，而是寫給任何年齡的人，寫給任何對股票感到困惑、卻還沒有機會學到理財基本原則的投資初學者。


    人的壽命愈來愈長，這表示他們必須比過去的人支付更久的生活開銷。如果一對夫妻已經活到65歲，他們很可能繼續活到85歲；如果他們活到85歲，很可能其中一個能活到95歲。為了支應生活開銷，他們需要額外的錢，而要賺這些錢最保險的方法就是投資。


    從65歲開始投資不算太晚。今日65歲的人可能還有二十五年的時間讓他們的錢繼續成長，讓他們可以得到額外的收入，用以支付二十五年的額外開銷。在15或20歲時，你很難想像自己有天會變成65歲，但如果你養成儲蓄和投資的習慣，到那時你的錢將已為你工作五十年。五十年的儲蓄和投資將製造出驚人的成果，即使你每次只儲蓄和投資一小筆錢。


    投資愈多，你未來就愈富裕，而國家也會愈富裕，因為你的錢會幫助創造新事業和更多就業。


    ## 前言

    ## 我們熟悉的公司


    當一群人一起做生意，他們通常會組織一家公司。世界上大多數商務是由公司進行的。「公司」這個詞源自拉丁文，意思是「同伴」。


    公司的正式名稱是「股份公司」，這個詞源自另一個拉丁文「corpus」，意思是「群體」，這時候的意思是一群人聚集從事商業。「屍體」也源自「corpus」，但與這裡談到的主題無關，因為屍體不能做生意。


    要組織公司很容易，只要支付一小筆手續費，在你想登記地址的州填幾張表格，就可以完成手續。德拉瓦州是最受歡迎的選擇，因為當地的法律對企業很友善，但每一州每年都有成千上萬的公司組成。每當你看到公司名稱後面加了「Inc.」，就表示這家公司已經填寫表格成為股份公司。「Inc.」是「Incorporated」的簡寫，代表「已登記成為公司」。


    從法律的觀點看，股份公司是一個單獨的個體，可以因為不良行為而受懲罰，通常是被處以罰款。這是企業主不厭其煩要登記成股份公司的主要原因，如果他們做錯事而挨告，公司要承擔責任，而他們可以規避懲罰。想像如果你未經允許擅自開父母的汽車撞上樹，你一定想，要是你已經登記成為公司那該有多好。


    你記得埃克森石油的瓦爾狄茲號油輪在阿拉斯加擱淺，造成1,100萬加侖原油洩漏到威廉王子灣的災難嗎？這場浩劫花了好幾個月才清理完。油輪屬於美國第三大公司埃克森所有，在當時埃克森有數十萬名股東，他們都是這家公司的共同企業主。


    如果埃克森不是股份公司，這些人可能每個人都分別吃上官司，為了不是他們造成的原油洩漏而損失畢生積蓄。即使埃克森被判無罪，他們也必須支付法律費用來為自己辯護，因為雖然在你被證明有罪前都是無辜的，你還是得付錢給律師。


    這就是股份公司的妙處。它可能吃上官司，它的經理人和董事也可能挨告，但企業主——也就是股東——卻受到保護。他們根據法律就是不會被告。在英國，公司名稱後面會加上「有限」兩個字，表示企業主只承擔有限的責任，就和美國的公司一樣。（如果有人問你「有限」的意思，現在你知道怎麼回答了。）


    這對我們的資本主義體制是極為重要的保障，因為如果公司一犯錯股東就會挨告，像你和我這種人就會害怕買股票變成股東。為什麼我們要承擔嚴重的石油洩漏災難、或漢堡裡發現一根老鼠毛、或企業每天都會發生各種錯誤的風險？如果不是承擔有限的責任，沒有人會想買任何一張股票。


    ### 私人公司與上市公司


    美國絕大部分企業是私人公司，它們由一個人或一小群人擁有，而且所有權通常集中在一個家族。在每個城鎮每條大街的每個街區，你都可以找到私人公司的例子，它們也散布在美國和世界各國的都市，有理髮院、美髮沙龍、修鞋舖、腳踏車店、棒球卡店、糖果店、舊貨舖、古董店、二手店、蔬果攤、保齡球館、珠寶店、二手車銷售場，以及地方上的家庭餐廳。大多數醫院和大學也是私人公司。


    這些企業被稱作私人企業，是因為一般大眾不能投資它們。如果你晚上住在好夢屋汽車旅館，對那裡和經營的方式十分滿意，你不太可能去敲經理的門，要求變成旅館的合夥人。除非你與業主是親戚，或老闆有兒子或女兒想和你成親，否則你得到這家企業股票的機會幾乎是零。


    要是你晚上住在希爾頓或萬豪飯店，而且對那些地方印象很好，那會有什麽不同？你不必敲任何門或跟誰的兒子或女兒結婚，就能成為業主。你要做的就只是下單買股票。希爾頓和萬豪飯店在股票市場出售它們的股票。任何這麽做的公司就稱作上市公司。


    （雖然美國的私人公司比上市公司多，但上市公司通常規模大得多，這是大多數人為上市公司工作的原因。）在上市公司，你和你的父母、莎莉嬸嬸或你的街坊鄰居，都可以買股票，並自動變成業主。一旦你付錢後，就能得到一張憑證，稱作股票證書，證明你是股票擁有者之一。這張紙有真正的價值，你隨時可以賣掉它。


    就任何人都能成為業主來說，上市公司是世界上最民主的機構。它是真正機會平等的例子，它不管你的膚色、性別、宗教、星座、國籍，或者你是不是有姆囊炎腫、長痘痘或有口臭。


    即使麥當勞的董事長跟你有過節，他也無法阻止你變成麥當勞股東。股票都在股市流通，每週有五天、每天有六個小時不斷被買進賣出，誰有現金能支付其價格，愛買多少都可以。這適用於麥當勞，也適用於今日美國的其他1.3萬家上市公司。上市公司到處都有，它們從早到晚圍繞在你四周，你擺脫不掉它們。


    耐吉、克萊斯勒、通用汽車、蓋普、波士頓凱爾特人隊、聯合航空、史泰博、溫蒂、可口可樂、哈雷、太陽眼鏡屋、漫威漫畫、柯達、富士、沃爾瑪、樂柏美、時代華納和溫尼貝戈，這些公司有哪些共通點？他們都是上市公司。你可以玩字母遊戲，從A到Z，用每個字母代表一家上市公司。


    在家裡、在街上、在學校四周和在大賣場每個角落，你都一定會看到這些大公司的蹤影。幾乎所有你吃的、穿的、讀的、聽的、搭乘的、躺的，或漱口用的，都是它們製造的東西。從香水到小刀、浴缸到熱狗、螺絲釘到指甲油，都是由你能當股東的企業所製造。


    你的床單可能來自西點史蒂文斯公司；鬧鐘收音機來自奇異；馬桶、洗臉盆、水龍頭來自美國標準或艾爾傑；牙膏和洗髮精來自寶鹼；刮鬍刀來自吉列；乳液來自美體小舖；牙刷來自高露潔棕欖。


    穿上你的鮮果布衣內衣，和你在蓋普或Limited買的、由Hagar或Farah製造的襯衫和長褲，它們的布料來自Galey & Lord，而之前的纖維則由杜邦化學所生產。繫上你的銳跑鞋帶。或是你在Foot
    Locker買的、用花旗銀行威士卡刷卡付款的Keds帆布鞋。你已經跟十幾家上市公司發生關係了，而你連早餐都還沒吃呢。


    坐在早餐桌前，你將發現通用磨坊供應的Cheerios麥片；家樂氏的Pop Tarts果醬餡餅、Eggo鬆餅；海冠公司製造的純品康納柳橙汁，雖然海冠生產的威士忌還比果汁更出名；菲利普莫理斯供應的糕點，這家公司除了生產萬寶路香菸外，也製造卡夫乳酪和Oscar
    Mayer熱狗。你的土司可以從Toastmaster 生產的烤麵包機跳出來，這家公司從1920年代就開始營業，現在還生意興隆。


    咖啡壺、微波爐、瓦斯爐和冰箱都由上市公司製造，而你和你父母購買食物的大型超級市場，也都是上市公司開的。


    也許你搭乘由通用汽車製造的巴士上學，巴士使用的鋼鐵則來自伯利恆鋼鐵公司，擋風玻璃出自PPG Industries，輪胎由固特異製造，輪圈產自Superior
    Industries，所用的鋁則向美國鋁業採購。巴士使用的汽油來自埃克森、德士古或許多家上市石油公司之一。巴士向安泰保險公司投保；巴士本身可能由Laidlaw擁有，這家公司經營許多學區的巴士系統。


    你書包裡的書可能是由一家上市出版公司出版的，例如麥格羅希爾、霍頓米夫林或西蒙與舒斯特。西蒙與舒斯特正是本書的出版商，它是派拉蒙的子公司，而派拉蒙不久前才買下麥迪遜廣場花園、紐約尼克籃球隊、紐約遊騎兵冰球隊。另一家上市公司維康則在1994年的一樁併購案中併吞了派拉蒙。


    併購在企業界隨時都在發生。在華爾街發生的進攻與征服，遠多過派拉蒙製作的任何戰爭電影；或者由原本隸屬MCA旗下的環球製片廠所製作的戰爭片，環球製片已被日本人買下；或者MCA本身拍攝的電影，MCA現在已是海冠的一部分。


    也許你吃的學校午餐是由雷神公司在艾瑪納雷達農場烹飪的，而雷神也是製造愛國者飛彈的公司。或者你可能開車從校園到最近的一家上市漢堡連鎖店用餐，例如麥當勞、溫蒂或漢堡王；漢堡王的母公司是英國的上市公司大都會。你喝的可口可樂和百事可樂都來自上市公司，而百事公司也擁有塔可貝爾、必勝客、佛祿托來和肯德基，所以百事公司的股東也同時投資這麼多公司。


    賀喜巧克力、箭牌口香糖、Tootsie Rolls 糖，和大多數販賣機裡的糖果都是上市公司生產的，除了士力架巧克力是由瑪氏家族製造的。


    當你下午回家，拿起電話打給男朋友或女朋友時，你使用的服務由上市電話公司提供，如果是長途電話，那麼你將同時使用三家上市公司的服務：「小貝爾」服務短程的市內服務；長途電話公司則把電話接到市外；最後在電話那一頭又由另一家「小貝爾」提供服務。


    你可以買進這些公司中任何一家的股票，以及供應這些公司電纜、交換器等產品的供應商，或製造和發射電信衛星的公司，以及生產電話機的製造商。


    你的電視機是由上市公司製造，很可能是日本公司。如果你是有線電視訂戶，八九不離十會是一家上市有線電視公司。在三大電視網中，哥倫比亞廣播公司不久前被西屋收購，國家廣播公司由奇異擁有，而美國廣播公司則與迪士尼合併。西屋、奇異和迪士尼都是上市公司，擁有有線電視新聞網的透納廣播也是；透納也已經同意與時代華納合併。


    你可以透過買進金世界的股票，來投資《危險境地》、《幸運輪盤》和歐普拉等節目；金世界是一家上市公司，製作和發行這三個節目和其他節目。你可以藉購買梅鐸的新聞公司股票，來投資《辛普森家庭》或《警察實錄》；新聞公司擁有二十世紀福斯電視台，福斯則擁有這兩個節目。Nickelodeon電視網、Nick
    at Night電視網和MTV屬於維康，而維康也是百視達錄影帶店的母公司。


    大部分在電視上打廣告的產品都由上市公司製造。許多這類廣告是由上市廣告代理商寫文案和製作，例如Interpublic集團。


    要唸出一千家大型上市公司的名字，可能比想出十家大型私人公司還容易。雖然私人的小型家庭事業很多，但如果談到大公司，要找到一家未在公開市場出售股票的公司的確不容易。前面已經提到，生產瑪氏巧克力、星河巧克力和士力架巧克力的瑪氏公司還是私人公司。製造牛仔褲的利惠公司也是。幾家保險巨人如恆康天安屬於互助公司，但可能不會維持太久。


    幾乎所有的連鎖店，或你想得到的速食店、每一家大製造商、每一家有品牌產品的公司，你都可以當它們的股東。你得支付的錢可能不像你想的那般昂貴，事實上，只要花比神奇王國門票多一點的價格，你就能變成整個迪士尼帝國的部分股東，而只要20客麥香堡加上薯條的價格，你就能變成麥當勞的業主，和許多華爾街的大亨平起平坐。


    不管你年紀多大，或你這輩子會買多少股票，當你走進麥當勞、玩具反斗城或電路城，看到顧客排隊購買商品，而且知道你擁有如此大好生意的一小片，滾滾而來的獲利最後有一小部分會流入你口袋，你總是會感到十分欣慰。當你在電路城購買攝影機或在百視達租影片時，如果你是這些公司的股東，你花的錢真是肥水不落外人田。


    這是我們生活方式很重要的一部分，也是美國開國元老們做夢也沒想到的。從大西洋到太平洋，超過5,000萬名男女老少已成為1.3萬家上市公司的股東。成為公司股東是讓社會大眾參與國家成長與繁榮最樸的方法。這是一條雙向道，當一家公司出售股票時，它可以利用籌得的資金開新商店，或蓋新工廠，或更新產品，以便銷售更多產品給更多顧客，和增進公司獲利。當公司變得更大和更興盛，股票就變得更有價值，使投資人能從他們正確的投資獲得報酬。


    另一方面，生意興隆的公司有能力給員工加薪，並讓他們循序升遷到較高和較重要的職務。這些公司也會因為獲利增加而繳更多稅，因此政府會有更多錢可以花在學校、道路和其他造福社會的計畫上。這整個有益的循環是從像你這樣的人投資在公司開始。


    投資人是資本主義鏈結的第一環。你能設法儲蓄的錢愈多，能買到的公司股票就愈多，你未來的生活就可能更富有，因為如果你聰明地挑選股票，而且能保持耐性，你的股票在未來的價值就遠超過你購買它時的價值。

