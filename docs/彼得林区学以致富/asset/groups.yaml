    蕃茄醬、芥末醬、橄欖、酸黃瓜、調味料、今日人們加進漢堡裡的一切東西，都是亨氏最早開始大量生產的。當時亨氏在六個州有工廠、流通中心，在世界各地都有業務代表，有2,800名全職員工，加上2萬個農戶與他簽約種植他加進醬料產品的作物。


    在亨氏忙著生產番茄醬和其他56種醬料時，葛拉漢（Sylvester Graham）正在發明他聞名的餅乾。葛拉漢是一位牧師，極力提倡禁欲聯盟（Temperance
    Union），反對烈酒、吃肉、芥末，甚至反對吃亨氏的番茄醬（說會導致瘋狂），贊成洗冷水澡、睡硬床、吃水果生菜，全麥麵粉，這些是他發明的新零食的原料。根據他的看法，葛拉漢餅乾（Graham
    Cracker）不是普通餅乾，它是治療淫欲的療方，能夠馴服青少年因嗜吃肉類和脂肪而刺激的賀爾蒙。根據他的理論，吃葛拉漢餅乾的青少年顯得較平靜，行為表現較好
    較容易專注在學業功課上。


    當葛拉漢發動他的餅乾十字軍時，凱洛格博士（Dr. John Kellogg）也正以玉米片對抗青少年的淫欲（他稱之為「危險的欲望」）。凱洛格是一位素食者，也是流行健康倡導者，在密西根戰役溪（Battel
    Creek）經營一家著名的療養院。有天他正在實驗一種麵包食譜，想製造一種比一般人吃的硬麵包更容易咀嚼的新土司，結果他離開爐子太久，實驗的麵包變成碎片。不久後，凱洛格相信定期吃這種碎片，即使是最熱烈的戀情的火焰也可以被澆熄，讓美國的年輕人免於慾禍上身。


    沒有很多人同意凱洛格或葛拉漢的看法，但這並未阻止整個美國愛上葛拉漢的餅乾和凱洛格的麥片。


    凱洛格結識口若懸河的促銷者波斯特（C. W. Post），他是凱洛格療養院的病人，到療養院治療他的神經衰弱，並且首次吃到凱洛格的麥片。波斯特喜歡這種麥片，但他討厭凱洛格在早餐時供應的焦糖咖啡。為了有更好喝的飲料，波斯特發明一種用穀物釀造的飲料，嚐起來味道就像咖啡——至少波斯特這麼認為。波斯特成立一家公司，以便大規模銷售他的飲料，和他發明的數種穀物產品——葡萄堅果與波斯特飲料。


    當時還有賀喜（Hershey）和他的糖果棒。賀喜的全名叫密爾頓·史納弗雷。賀喜（Milton Snaveley Hershey），原本是一家小糖果店的老闆，他去參觀1893年的芝加哥世界博覽會，看到展示一部德國巧克力製造機，並為自己訂了一部。賀喜用那部機器生產裹著巧克力的焦糖，接著開始生產第一根大規模生產的巧克力棒，然後是1907年推出的賀喜Kiss巧克力，和1925年摻花生的賀喜Goodbar。賀喜的股票於1927年開始在紐約證交所交易。


    還有思麥克（Jerome Smucker）用俄亥俄州愛波席德（Johnny Appleseed）種植的蘋果，生產和銷售蘋果醬和蘋果汁。1897年，思麥克創立思麥克公司（J.
    M. Smucker Company），一世紀後這家公司變成美國最大的果醬公司。


    此時美國登記的商標約有1,000個，許多標語和廣告詞變成美國人的詞彙，例如「絕對純正」（absolutely pure）這個詞來自皇家烘焙公司；「你只管按鈕，其他一切交給我們」（you
    press the button, we do the rest）來自柯達；「它漂浮」（it floats）來自象牙肥皂；「讓密爾瓦基出名的啤酒」（the
    beer that made Milwaukee famous）來自施麗茲（Schlitz）；「所有適合刊登的新聞」（all the news that''s
    fit to print）來自《紐約時報》，還有「給白皮膚的人吃的粉紅藥丸」（pink pills for pale people）來自一個叫威廉斯博士的藥劑師賣的維他命丸廣告。


    這些產品的發明帶來新類型商店的崛起。在19世紀下半葉，美國還沒有超級商場，直到兩個茶葉的愛好者吉爾曼（George Gilman）和哈福德（George Huntington
    Hartford），才有人想到大商場的概念。這兩人在紐約市今世貿中心附近開了一家茶葉鋪，這店的生意雖小，卻取了很響亮的名稱——大美國茶葉公司（Great American
    Tea Company）。後來他們改了公司名稱，讓它聽起來更大了——大西洋與太平洋茶葉公司（Great Atlantic and Pacific Tea Company）。


    從一家茶葉店發展成在紐約有五家茶葉店。然後擴展到其他州，接著吉爾曼與哈福德開始把咖啡、奶油和牛奶放在貨架上。到1912年，他們已經擁有400家連鎖店，成為第一家大眾市場雜貨商；到了1920年代，他們在全美擁有1.5萬家店，年銷售額達10億美元。在美國各地很難找到沒聽過A&P雜貨商場的購物者。


    拜愈來愈多連鎖商店和郵購目錄公司所賜，人們可以購買大量生產的產品，享有可靠的品質，且價格遠低於巡迴小販或地方獨立商人收取的價格。在小鎮或農場上，郵包寄達是一件大事，尤其是如果郵包來自蒙哥馬利華德公司（Montgomery
    Ward，取名自創辦人華德，是他於1872年在芝加哥設立的首家郵購公司），或者來自1887年發出第一期郵購目錄的西爾斯公司（Sears Roebuck and
    Company）。


    西爾斯最早是賣手錶，但很快擴張到雜貨生意。故事始於阿拉斯加州諾姆鎮（Nome）的一名探礦者，寄給西爾斯一張預付訂單，要買100捲衛生紙，並且把錢附在信封裡。西爾斯寫信答覆他無法接受訂購目錄上沒有的東西。顧客回說：「如果我有目錄，就不需要衛生紙了。」


    隨著愈來愈多商品需要長程運送，鐵路運送的貨物愈來愈多，郵件在人的生活中也扮演愈來愈重要的角色。郵遞對資本主義十分重要，因為它是把大量生產的產品送到大眾手中最有效率的方法。即使是在當時，郵局也有服務水準低落的惡名，且製造商也抱怨連連。快速運送對企業如此重要，使得葛林特地從經營奈畢斯寇的百忙中擠出時間，推動一個改革郵政的運動。


    ## 工業時代與強盜大亨


    企業建立了工廠、經濟架構，以及現代美國的支柱。在19世紀中葉時，美國的生意不到四分之一是由企業進行的，但進入20世紀後，企業已經影響國內生活的每一部分。


    大量生產是那個時代的口號：產品可以直接從工廠運送到火車車廂，然後配銷到外州，使過去由小商店構成、只賣少數幾種產品的地方市場，擴大成區域市場。這種市場的擴張是社會的革命性變革，對人民生活的影響不亞於、甚至超越美國革命本身。在1820年以前，美國人穿的衣服有三分之二是家庭自製的；到19世紀結束時，大部分衣服都由工廠生產。


    公司名稱和品牌名稱如鑽石（Diamond）、皮爾斯貝利


    （Pillsbury）、康寶（Campbell）、亨氏（Heinz）、博登（Borden）、桂格燕麥片（Quaker Oats）、利比（Libby）和寶鹼（Procter
    & Gamble）都已家喻戶曉。家庭產品變成耳熟能詳的角色，知名的程度有如著名的作家、畫家、演藝人員和政治人物。到1880年代，象牙肥皂已是全國無人不知的產品。伊斯曼（George
    Eastman）在1884年發明出大量生產照相軟片的方法，十年後又開發出可照相的柯達軟片，用柯達相機拍照變成了全國的愛好。


    機器時代和大量生產來得如此迅速，使人幾乎沒有時間準備它們的到來。財產法必須重新修訂，新的商業規則建立，新企業組織也紛紛創設。一小群人善用這種情勢，累積出遠超過同時代的人所能想像的財富，甚至讓世界上最富有的貴族、蘇丹、王侯、征服者和帝王也難以企及。他們就是所謂的強盜大亨（robber
    baron）——由歷史學家約瑟夫森（Matthew Josephson）在1920年代末發明的詞。


    強盜大亨不是傳統定義的強盜，也不是為非作歹之徒，雖然其中有些人會扭曲法律，甚至讓法律改寫成符合他們的利益。他們是敢於冒險的投機客，大部分從貧困環境成長、建立信念，並且白手起家攀上美國企業的頂尖地位。他們把金錢的力量發揮到淋漓盡致。


    他們當中最知名 có 古爾德（Jay Gould），紐約州北部貧農之子，他用盡一切方法要打造一個巨大的鐵路帝國；卡內基（Andrew Carnegie）是蘇格蘭織工之子，他也擁有鐵路，並成為美國最有影響力的鋼鐵大亨；范德比爾特（Cornelius
    Vanderbilt）是紐約碼頭的流民，他建立一個蒸汽船隊，先控制船運業，接著擴張到鐵路。但儘管他既成功又有錢，多年來他一直住在一棟有著破舊地毯的小屋子；德魯（Daniel
    Drew）原本是一名趕牛人，他擅長炒作股票，


    賺取暴利；摩根（J. P. Morgan）的虔誠的教徒，他的銀行影響力如此大，一度被要求出資救援美國政府；庫克（Jay Cooke）是永遠樂觀的股票和債券交易商，他的投資公司勢力強大到在倒閉時幾乎連帶拖垮美國；「鑽石」費斯克（Jim
    Fisk）曾是街頭推車小販，也是馬戲團的愛好者，喜歡穿誇張的衣服，粗肥的手指戴滿戒指；沙吉（Russell Sage）是技巧高超的股市投機客和鐵路大亨；史丹佛（Leland
    Stanford）後來變成加州州長，並利用他的政治影響力在加州建鐵路而致富，後來用他的名字和資金創立史丹佛大學。


    最後是洛克斐勒（John D. Rockefeller），賣藥江湖郎中之子，他本人則是虔誠的浸信會教徒，兩者的結合創造出一個精明而可怕的資本家，他聚集所有石油公司成為一個巨大的獨占事業，可任意提高價格，並迫使所有競爭對手屈服。稍後我們將再談到他。


    除了一、兩個例外，強盜大亨的個人生活都很保守，往往是虔誠的宗教信徒，而且以他們擁有的財富來說相當節儉。他們大部分人興建或擁有鐵路，並隨時計劃接管彼此的鐵路線。他們知道如何控制股票市場，讓鐵路股價格忽漲忽跌，並利用起伏不定的走势賺進龐大獲利。


    「鑽石」費斯克被形容為最會賺錢的美國人並非浪得虛名。古爾德最擅長哄抬他的伊利鐵路（Erie Railroad）股票價格，所以買到這檔股票的人都花了遠超過真正價值的錢。伊利鐵路因為古爾德而被稱為「華爾街的紅字女」（Scarlet
    Woman）公司，信用評等低落，且在1873年到1942年未曾支付股利給股東。


    當庫克因為鐵路投資失利而關閉銀行大門時，他觸發了1873年的恐


    慌，造成數家證券經紀商跟著倒閉，幾乎讓華爾街的生意完全停擺。


    美國的人口從1864年到1900年代初增加一倍，鐵路網卻增加七倍，所有美國人居住的地方幾乎都聽得到火車汽笛的聲音。22歲的北軍退伍士兵西屋（George Westinghouse）發明了氣動式煞車，和取代瓦斯燈與煤油燈的電燈；普爾曼（Pullman）後來則以他製造的鐵路車廂崛起。


    雖然鐵路到處可見，人們卻在鐵路股票上虧錢。總是有危機或醜聞發生，把小投資人的錢通通賠光，而強盜大亨總是有辦法賺得暴利。在1877年，最成功的強盜大亨之一范德比爾特在紐約過世，把他驚人的財富1億美元全部留給兒子威廉·范德比爾特（William
    Vanderbilt）。


    老范德比爾特死時被認為是美國第一富豪，他從船運起家，然後擴張到鐵路，尤其是經營紐約中央鐵路。雖然他被讚譽為商業巨人，但也被咒罵為不知感恩圖報的吝嗇鬼，從來不回饋那些流血流汗為他建造鐵路和創造財富的人。


    大眾對他死時未留給社區一毛錢群情激憤。范德比爾特自認已經藉由建造鐵路做了夠多善事，而他的錢不干別人的事。他兒子威廉更是口無遮攔，曾經說：「去他的大眾。」


    在美國這個新興市場，不是一切都按照規矩來，這和現代的許多新興市場一樣。每隔二十年經濟會崩潰一次，人們會恐慌並忙著提領銀行的存款，而他們大部分的錢都已經被放款出去。銀行不可能立


    即讓所有人提領存款，倒閉事件因而發生。一旦銀行倒閉，社會的資金耗竭，各行各業也跟著倒閉，金融體系隨之崩潰。股市將崩盤，債券市場也一樣，因為發行債券的機構無法支付利息。


    歐洲人是1873年恐慌的大輸家，正如他們在之前這類災難中的遭遇。由於美國發生的崩盤和恐慌如此頻繁，因而有騙子國度的惡名，被認為在商業交易中充滿不可信任的人，就像近來人們對部分中國和俄羅斯創業家的批評。他們現在就是美國當年的寫照。


    在1893年的恐慌（較大的恐慌似乎間隔約二十年發生一次），有四分之一的鐵路公司破產。1903年有一次較小的恐慌。不管有沒有恐慌，一些在這段期間創立的好公司到今日仍然是好公司，僱用成千上萬員工，並為股東賺大錢。1900年的世界地圖上有半數國家至今已不復存在，但賀喜、桂格麥片、箭牌、美國電話電報公司（AT&T）、杜邦、波士頓銀行、美國菸草（American
    Tobacco）、美國鋼鐵（U.S. Steel），和許多從標準石油（Standard Oil）分割出來的公司（埃克森、雪弗龍、美孚、阿莫科〔Amoco〕等）至今仍屹立不搖。


    ## 可怕的獨占事業


    進入20世紀後，資本主義的發展顯然出了一些差錯，原本對所有人開放、只要有好點子的人都有成功機會的體制，逐漸變成由少數巨型企業獨霸和操縱的遊戲。這就是所謂的獨占。


    你可以說，除了希特勒和共產主義外，獨占是美國人生活方式最大的威脅之一。如果你玩過「大富翁」遊戲，你就瞭解這個概念。目


    標是買下所有的房地產，讓經過這些土地的人沒有別的選擇，只能乖乖支付高得嚇人的租金。能達到這個目標的玩家最後贏得所有的錢。


    在現實世界，獨占的情況完全一樣，但不只發生在房地產。它發生在一個產業只有一家大公司控制一切、並任由它決定價格的時候。例如，在烘焙業的獨占中，只有一家公司製造並銷售糕點和餅乾，因此顧客必須支付這家公司所定的任何價格，否則只能不吃蛋糕和餅乾了。不管是麵包店、玩具製造商或航空公司，當獨占形成時，顧客就沒有選擇。他們不能選擇其他烘焙商、玩具製造商或航空公司，因為所有競爭者不是已加入獨占集團，就是被迫關門。


    你已經讀到的維吉尼亞公司、聯合荷蘭東印度公司等貿易商，都是獨占事業，由歐洲的國王賜予經營特許，給他們在新世界廣大區域獨家經營生意的權利。這些公司在美國東部沿岸數千哩的地區，控制農業、漁業和與印地安人的貿易。沒有他們的允許，沒有人可以和他們競爭。


    最早了解獨占對世界未來繁榮造成威脅的人是亞當．史密斯，即《國富論》的作者。史密斯知道競爭是資本主義的關鍵，只要任何人都能自由地製造更好和更便宜的產品，企業就不敢指望欺騙消費者而能逃過制裁。競爭讓公司戒慎恐懼，他們被迫改善產品並儘可能降低價格，否則顧客就會被對手搶走。


    在19世紀中葉美國經濟快速成長時，各行各業都有許多公司，競爭因而十分激烈。這些公司的業主不見得喜歡這種情況，雖然照亞當．史密斯的說法，競爭對社會有利。事實上，他們認為競爭是一


    種威脅，他們對藉由改善產品來抵擋競爭者已感到厭倦。他們尋找機會提高產品的價格——強迫顧客不得不接受的價格。


    如果不加制止，任何行業的所有業主可能在某個地方的密室集會，決定為他們的產品定同樣的高價格。他們可以達成協議以避免彼此之間的競爭，他們可能形成策略聯盟。事實上，操縱價格的卡特爾（cartel）在1870年代和1880年代的美國就已建立，但後來通過的法律判定它們不合法。


    在1880年代初，一個聰明的律師叫陶德（S. C. T. Dodd），想出公司可組成信託（trust）來規避對抗卡特爾的法律。信託是把一堆財產交給一位經理人的古老方法。陶德在洛克斐勒旗下石油公司的法務部門工作時，向洛克斐勒提出這個點子。何不把一群石油公司交付給一個信託事業？這樣業主就可以操縱價格、達成協議、避免彼此競爭——而且還完全合法。


    洛克斐勒立即著手組織一家陶德式的信託，聚集了石油業40家最大的競爭者。洛克斐勒邀請他們參加，雖然這些業者也沒有別的選擇。要是有任何公司拒絕邀請，洛克斐勒揚言要用低到他們無法承受的價格來競爭，迫使他們關門。


    洛克斐勒的做法一點也不友善，但很有效。他和40家同謀的業者（有些是被迫參加）組織了標準石油信託公司（Standard Oil Trust），在一夕之間變成世界上最大、最具影響力的石油製造集團，控制大部分的美國油井和90%的煉油廠。洛克斐勒和他最親近的顧問成了石油的獨裁者，可任意提高油價。顧客沒有選擇，只能支付洛克斐勒高價，否則就無法取得石油。


    這些獨裁者也把他們新獲得的力量用在鐵路公司上，強迫他們降低運輸石油的價格。鐵路公司也沒有別的選擇，任何拒絕降低運費的公司都被洛克斐勒逼到結束營運。畢竟，如果拒絕載運洛克斐勒的石油，那
    hub 就沒有任何石油可運了，因為90％以上的美國石油生產都由此信託的成員提煉。


    標準石油將其獨占延伸到這個產業的每一面，從油井直到煉油廠。洛克斐勒掌控大局，而其他類型公司的業主聽到他成功的例子後，也開始組織信託。當時有糖業信託、威士忌信託、棉花油信託、鉛信託，和由杜克（James
    Duke）與菸草農戶組織的菸草信託，他們聯合起來變成美國菸草公司（American Tobacco Company）。


    當時還有火腿信託（史威福特兄弟）、水果信託（聯合水果）和餅乾信託（奈畢斯竾）。沒有組織信託的公司也可用不同的леты彼此聯合，例如透過合併。數家公司可合併為集團，這種方法創造出國際收割機公司（International
    Havester）、杜邦（Du Pont）、安那孔達銅業（Anaconda Copper）、鑽石火柴（Diamond Match）和現稱ASARCO的美國鎔煉公司（American
    Smelting and Refining）。鐵路業者也搭上這班車，數家最大的鐵路公司展開合併和收購，數十條鐵路線被整併成一個大集團——范德比爾特線、賓州線、哈里曼線、古爾德線和洛克島系統。當鐵路陷於財務困境時（且這種事經常發生），銀行家摩根已準備好重整它們。


    穿著背心西裝、戴著高頂禮帽的摩根，在華爾街是個人人敬畏的人物，他在1901年集合八家小鋼鐵公司，組成巨大的美國鋼鐵公司（U.S. Steel），是截至當時勢力最龐大的集團，也是美國第一家規


    模超過10億美元的企業。


    美國上市公司中，有三分之一在1895年到1904年間因合併成信託公司而消失。在大部分主要產業中，信託和集團都任意提高價格，他們把影響力伸進商務的所有領域。


    美國大眾看著競爭者一個接一個在產業裡消失，信託事業的業主賺進鉅額財富，他們在沿著羅德島新港海邊蓋的夏季「小木屋」，大到有如軍營。於是大眾開始起而反對信託。


    人們發現，大公司會箝制小公司，強迫它們加入信託，否則將被逐出行業。而如果這個趨勢繼續下去，一切產品的價格將跌掬到雲端，國民的荷包將被吸乾。在少數公司控制價格和薪資的情況下，自由市場資本主義將逐漸減絕。


    這是美國歷史最可怕的時期之一，但很少人討論它。當時的美國是一個125歲的國家，在經歷快速成長和繁榮後，正要進入一個新紀元，然而美國人卻逐漸喪失辛苦工作獲得的經濟自由，由少數幾家信託事業攫走。


    醜聞到處發生。作家辛克萊（Upton Sinclair）曝露肉品加工廠出售遭污染的肉——這類新聞報導即所謂的「扒糞」。人們開始加入工會以爭取較高薪資，扭轉信託公司導致的薪資降低。信託控制了就業機會，個人卻無依無靠。他們不能辭職不幹，另外找別的工作——因為沒有別的工作可找。


    工會、報紙、法院和一些勇氣可嘉的政治領袖，都參與了遏阻信託

