    # 1 資本主義簡史


    # 資本主義誕生


    當人們製造東西並銷售它們來交換金錢時，資本主義就誕生了。若不是製造東西，就是人們提供服務以交換金錢之時。在人類歷史大部分時候，資本主義是一個陌生的概念，因為大部分世界人口從未接觸到錢。數千年來，一般人終其一生沒有買過任何東西。


    許多人是農奴、奴隸、僕役，為擁有土地和地上一切東西的主人工作，換取免費住在小茅屋裡，並分配到一小畝田地可以種植自己的蔬菜。但是他們不領薪水。


    沒有人抱怨工作領不到薪水，因為沒有地方可以花錢。偶爾會有一小隊流動商販經過城鎮，形成一個市集，但通常是孤立的活動。國王、王后、王子、公主、公爵、伯爵等，這些人擁有所有的財產——建築物、家具、牲口、牛車，從珠寶到鍋碗瓢盆的所有東西——而且只供給家人使用。他們不曾想過賣土地，即使這麼做能從中獲得厚利，而且可以少花一些除草的力氣。城堡前面不會有「待售」的標示，取得房地產的唯一方式是繼承，或用武力奪取。'
  - '[PAGE 21]


    在世界許多地方，從最早的猶太教時期一直延續到基督教文明，以獲利為目的的商業是被禁止的活動，而借錢給他人並收取利息可能讓你被逐出教會或猶太教堂，並保證你將來在地獄有一席之地。銀行家惡名昭彰，人們往往避而遠之，會見他們時也得躲躲藏藏。從交易獲利，或追求富裕的生活，都被視為自私、不道德的行為，與上帝理想中井然有序的宇宙相違背。今日每個人都想改善自己的生活，但如果你活在中世紀，公開說你的目標是「獲得成功」或「改善自己的生活」，你的朋友會對你皺眉頭。成功的概念在當時不見容於社會。


    如果你想更了解有市場之前的社會，以及人們為薪資而工作、並能自由花錢以前的生活，可以閱讀海爾布羅納（Robert Heilbroner）的經典著作《俗世哲學家》（The
    Worldly Philosophers）第一章，你會發現讀起來一點也不沉悶。


    到18世紀末，世界已為商務廣開大門，國家之間有繁榮的貿易，市場在各地不斷興起。流通的金錢更加充裕，人們可以購買許多東西，商人也大發利市。店東、小販、貨運商和貿易商形成一個新商人階級，並且變得比擁有房地產和軍隊的王公貴族更富有、勢力更龐大。銀行家也走出密室，公開借錢給大眾。


    # 美國的投資先驅


    歷史書籍列出美國成功的許多理由——有利的氣候、肥沃的土壤、遼闊的國土、權利法案、優越的政治制度、不斷湧入的勤奮移民，以及兩側的海洋阻擋侵略者。後院的發明家、夢想家和策劃者，銀行、資金和投資人也應在這串名單上占有一席之地。'
  - '[PAGE 22]


    在美國歷史的第一章中，我們讀到有關印地安原住民、法國陷阱獵戶、西班牙征服者、弄錯航向的水手，傭兵、穿污熊皮的探險家，和第一個感恩節晚餐的清教徒。但在這些場景背後，有人必須支付船艦、食物以及所有冒險的帳單。這些錢大部分來自英國、荷蘭和法國投資人的口袋，沒有他們，就不會有人到這片殖民地來殖民。


    在建立詹姆斯鎮（Jamestown）和清教徒登陸普利茅斯岩（Plymouth Rock）的時代，沿著美國東岸有數百萬英畝的荒野，但你沒辦法任意把船開到那裡、選一個地點、從森林清理出空地，然後開始種植菸草，或與印地安人交易。你必須獲得國王或女王的許可。


    在那個年代，國王和女王掌控一切大權。如果你想在王室的土地上（也就是地球上大部分的地方）做生意，你必須取得皇家執照，亦即「公司特許狀」（charter of
    incorporation）。這些執照就是現代公司之前身，當時的企業家如果沒有取得特許，就無法開業營運。


    像賓州貴格教派（Quakers）這類宗教團體，當時就取得特許狀，許多商人團體也是，例如建立詹姆斯鎮的公司。取得王室批准屯墾一片土地和建立殖民地後，你還必須尋找資金來源。這就是最早期股票市場出現的背景。


    早至1602年，荷蘭人就已開始買賣聯合荷蘭東印度公司（United Dutch East India）的股票，這是全世界第一檔大眾化的股票，在全世界第一個大眾股票市場交易，地點就在阿姆斯特丹一座跨越阿姆斯特爾河（Amstel
    River）的橋上。成群喧鬧的投資人聚集在橋'
  - '[PAGE 23]


    上，嘗試吸引股票交易商的注意，當他們互相推擠的動作失控時，就得召喚警察來恢復秩序。荷蘭人花數百萬荷蘭盾（guilder）搶購聯合荷蘭東印度公司的股票；如果像今日許多公司以字首縮寫來代表，這家公司應該稱作UDEI。


    總之，這家荷蘭公司從銷售股票籌得龐大資金，並把錢用在裝備幾艘船上。這些船啟程開往印度和東部的許多港口，運回來自遙東的最新商品，因為它們是當時歐洲最受歡迎的東西。


    當樂觀者支付愈來愈高的價格購買聯合荷蘭東印度的股票、寄望這家公司能讓他們發財時，悲觀者則透過叫作「放空」的聰明操作方法來下注；這種17世紀發明的方法仍被今日的悲觀者使用。在聯合荷蘭東印度的例子裡，樂觀者證明是對的，因為股價在交易頭幾年就上漲一倍，而且股東定期獲得紅利，也就是今日所知的股利。這家公司持續營運了兩世紀，直到1799年後繼無力而結束生意。


    你一定聽過，哈德遜（Henry Hudson）為了尋找通往印度的航線，駕駛他的船半月號（Half Moon）溯哈德遜河（Hudson River）來到今日的紐約；他犯了和哥倫布（Christopher
    Columbus）一樣的錯誤。你想過誰在背後資助這種白費力氣的探險嗎？我們都知道，哥倫布的資金來自西班牙的費迪南德國王（King Ferdinand）和伊莎貝拉王后（Queen
    Isabella），而哈德遜的資金來源則是剛才提到的荷蘭聯合東印度公司。


    另一家荷蘭企業荷蘭西印度公司（Dutch West India Company），派遣第一隊歐洲人在曼哈頓島上殖民。當明努伊特（Peter Minuit）做了史上最著名的房地產交易、以價值60荷蘭盾（相當於24美元）'
  - '[PAGE 24]


    的一小堆裝飾品買下曼哈頓時，他是代表荷蘭西印度公司的股東做這筆生意。可惜這家公司存活得不夠久，沒能享受擁有所有昂貴的紐約鬧區辦公大樓的利益。


    看到荷蘭人資助他們的新世界冒險，英國人也效法其做法。倫敦的維吉尼亞公司（Virginia Company）擁有從卡羅來納到今日的維吉尼亞州、以及往北至今日紐約州這片廣大區域的獨占權。這家公司資助進駐詹姆斯鎮的第一支遠征隊，寶嘉康蒂（Pocahontas）就在那裡救了史密斯船長（Captain
    John Smith），不讓她生氣的族人敲破他的頭。


    詹姆斯鎮的移民在那裡工作，但並不擁有那個地方，這從一開始就是一個問題。他們受僱來開闢土地、種植作物和興建房屋，但所有的產業、進步和事業都屬於遠在倫敦的股東。如果詹姆斯鎮賺錢，真正的居民也分不到一分錢。


    詹姆斯鎮的移民經過七年激烈的抗爭，終於爭取到規則的改變，讓他們也可以擁有私人財產。在當時這個結果似乎無足輕重，因為初始的殖民地宣告破產。但從詹姆斯鎮可以學到一個重大教訓：擁有財產和在企業中擁有股權的人，比較願意勤奮工作，也感覺較快樂，比未擁有這些權利的人更能把工作做好。


    從馬里蘭（Maryland）到緬因（Maine）等沿海各地的商務獨占權，則被授予另一家英國公司——普利茅斯維吉尼亞公司（Virginia Company of
    Plymouth）。依照當年畫的地圖，新英格蘭大多被劃為北維吉尼亞的一部分。當清教徒在普利茅斯岩靠岸並跌涉到陸地上後，他們闖進了屬於普利茅斯公司的財產。'
  - '[PAGE 25]


    美國的小學生都學過，清教徒如何冒著生命危險追求宗教自由，他們如何搭乘一艘小船五月花號（Mayflower）渡過險惡的大海，如何捱過新英格蘭寒冷的冬季，與印地安人交朋友，獲得他們的南瓜食譜，但是這些故事從未交代他們如何取得所需的資金。


    讓我們暫時重溫一下這個故事。清教徒先是離開英國，在荷蘭找到安身之處，也就是第一個有股票市場的國家——雖然清教徒跟股票沒有關係。在荷蘭安頓幾年後，清教徒無法忍受那裡，決定再度遷移。他們想到三個可能的地點：南美洲的奧里諾科河（Orinoco
    River）；紐約一個由荷蘭人控制的地區；或是由倫敦維吉尼亞公司（Virginia Company of London）提供給他們的一片地。


    阻止他們行動的原因之一是缺乏現金。他們需要補給品和一艘船，但無力負擔這兩者。如果沒有財務協助，他們可能永遠滯留在歐洲，我們也不會在歷史書上讀到他們。韋斯頓（Thomas
    Weston）就是在這個時候出現的。


    韋斯頓是倫敦一位富有的五金商人，他在新英格蘭有財產，且坐擁許多現金。他和他的夥伴認為，清教徒是絕佳的投資對象，因此向清教徒提出一項他們無法拒絕的提議。


    韋斯頓的集團自稱「冒險家」（The Adventurers），雖然他們不是親自去冒險的人。他們同意集資讓清教徒到美洲，交換的條件是清教徒必須每週工作四天、連續七年，好讓殖民地賺錢。七年後合夥關係將結束，雙方分享獲利，然後清教徒就可以自由做他們想做的事了。'
  - '[PAGE 26]


    清教徒接受這些條件，因為沒有別的選擇，於是他們開始收拾行囊。然而到了最後一刻，韋斯頓突然大翻盤，改變了合約內容，把原本每週為企業工作四天的規定改為六天。這將使他們除了星期天外，沒有空閒時間種植後院的蔬果、修補衣服或敬拜他們的宗教。


    在與韋斯頓爭論沒有結果後，清教徒決定在不簽合約、沒有任何旅費下出航；在 drivers之前韋斯頓雖然已支付他們籌備的一切東西，但拒絕再提供任何金錢。他們必須出售為旅程製造的一部分奶油，以便繳納港口的稅捐，以便把他們在荷蘭裝備的虎尾草號（Speedwell）開出港口。


    虎尾草號會漏水，所以他們被迫返回港口，且懷疑是船長和水手與韋斯頓串通好，故意造成船身的裂縫。他們大部分人擠上另一艘比虎尾草號小、速度也更慢的船——五月花號。


    他們擠在五月花號上，啟程前往他們在維吉尼亞的應許之地，然而他們卻偏離航線，把船開到比目的地更遠的地方。在發現錯誤後，他們嘗試掉頭往南，但鱈魚角（Cape Cod）的岩石和淺灘阻擋了他們的通路。與其冒著在這片險惡的陌生水域沉沒的危險，他們決定在普若溫斯鎮（Provincetown）港下錨。


    他們從那裡遷移到普利茅斯，在普利茅斯蓋起住所，並栽種作物。由於韋斯頓已經斷絕資金供應，清教徒需要現金的新來源。他們與另一群投資人（由皮爾斯〔John Peirce〕帶領）和擁有土地的普利茅斯公司（Plymouth
    Company）達成一項新交易。'
  - '[PAGE 27]


    清教徒每人都有100英畝土地，不限用途供其使用；皮爾斯則有每位清教徒所分得之100畝土地的所有權。此外，皮爾斯和其他投資人各可獲得1,500英畝的土地，交換他們資助清教徒其餘的遷移支出，並為殖民地提供資金。


    在他們要操心的許多事中（例如，如何度過寒冬、如何與原住民和平共處等等），清教徒必須擔心如何償付資助他們大筆金錢的投資人，包括以皮爾斯和韋斯頓為首的兩群人。雖然我們喜歡把清教徒想成他們心心念念只有上帝，但他們跟我們所有人有著同樣的問題——帳單。


    在普利茅斯殖民地開張一年後，五月花號空著船倉返回英國——沒有皮毛、珠寶、作物，沒有任何投資人可以轉賣的東西。普利茅斯公司已經虧錢、而且持續一季又一季虧損下去，這讓投資人非常沮喪，就像投資報酬率掛零的投資人向來會有的反應。更糟的是，他們必須載運更多補給品到殖民地去，所以成本不斷升高。


    到1622年，韋斯頓已受夠了普利茅斯和資助沒有任何回報的清教徒，所以他把這個事業的股份送給他的夥伴「冒險家」。另一方面，皮爾斯則在其他投資人後面使計謀，企圖掌控普利茅斯公司，以便他可以當上「普利茅斯殖民地領主」。結果他沒有得逞。


    有五年之久，清教徒和投資人繼續為錢爭論不休：清教徒抱怨資助不夠，投資人則抱怨獲利太少。到了1627年，合夥關係告吹，惱怒的投資人把整個殖民地以區區1,800英鎊賣給清教徒。


    由於清教徒沒有1,800英鎊，他們不得不以分期付款方式買下'
  - '[PAGE 28]


    殖民地：每年支付200英鎊。這是美國歷史上首見的融資併購（leveraged buyout），也是1980年代著名的奈畢斯寇（RJR Nabisco）交易案之先驅；奈畢斯寇交易案後來被寫成書和拍成電影《登龍有術》（Barbarians
    at the Gate）。（在融資併購中，付不起錢的收購者利用借款方式買下一家公司。）清教徒的融資併購也是美國歷史上第一樁員工接管公司事業的案例。


    接下來是故事中最精彩的部分。清教徒在終於能自己作主後，馬上決定要過共產的生活方式：他們聚集資源，且個人不得擁有私有財產。當時的清教徒領袖布雷德福總督（Governor
    William Bradford）很快發現共產式的安排會失敗，他發現如果沒有私有財產，人們就沒有辛勤工作的誘因。如果殖民地的所有居民不管是工作或無所事事，都能得到相同的福利（食物、住家等等），他們何必辛苦工作？


    幾位有遠見的居民向布雷德福總督陳情，要求改變制度，讓農夫和漁夫可以擁有自己的農場和小船，以便從各自的努力賺錢。他們反過來藉由繳納獲利的稅金來支持社區。由布雷德福創設的這種自由企業制度，基本上和我們今日的制度相同。


    獨立仍不足以解決清教徒的財務問題。儘管他們勤奮工作，殖民地的債務仍從1,800英鎊增加到6,000英鎊。更多清教徒從荷蘭渡海而來，以便擴大捕魚船隊。他們希望靠捕魚的獲利來償付部分債務，但始終捕不到足夠的魚。在長達十年間，殖民地與債權人的協商持續進行，直到爭議在1642年徹底解決。


    清教徒協助建立了現代美國的社會、政治、宗教和經濟基礎，但對'
  - '[PAGE 29]


    投資人來說，他們只是一個倒閉的事業。韋斯頓、皮爾斯和他們的夥伴在這場創業中是大輸家，由於他們都不是傻瓜，因而更凸顯出投資是一件高風險的事，即使是再周詳的計畫也可能失敗。也或許他們罪有應得，因為他們是如此狡滑、不光明磊落，違背了初始的交易。


    在這個例子裡，社會大眾可能很慶幸沒有機會買股票——清教徒不是一家上市公司，不像荷蘭西印度和荷蘭東印度公司那樣。但歐洲的大眾還有其他機會可以參與發新世界財，並且得到同樣悲慘的結果。例如時運不濟的密西西比公司（Mississippi
    Company）和南海公司（South Sea Company），兩家公司都在18世紀初創立，並出售股票給巴黎和倫敦股市成千上萬容易受騙上當的顧客。


    密西西比公司是由工於心計、且能言善道的約翰．羅（John Law）所創立。約翰．羅是那個年代最具傳奇性的人物之一，他在家鄉蘇格蘭因生意失敗而與人決鬥，在殺死對手後跑到法國，靠著花言巧語得以晉見國王路易十五（Louis
    XV）。當時路易十五尚未成年，皇室的決定權都操在攝政王奧良公爵（Duke of Orleans）手中。


    結識皇室是當年出人頭地唯一的方法，而約翰．羅相信，攝政王和他可以解決法國龐大的國債問題。


    約翰．羅的計畫是讓法國僱用一家印刷廠，開始印鈔票，用來償付債務。紙鈔在當時世界各地都是相當新的概念，而攝政王很喜歡這個概念——事實上，喜歡到他讓這位來自蘇格蘭的移民完全掌控法國皇家銀行（Royal
    Bank of France）以及皇室印鈔廠。'
  - '[PAGE 30]


    不久後，約翰·羅的紙鈔已經流通各地。幾乎在一夕間，他從一個外國人變成掌控法國金融的國王，和富有程度僅次於路易十五本人的巴黎居民。


    隨著他在民意調查得到的支持度上升（不管當年他們用什麼方法調查），約翰·羅宣布了他第二個大計畫——密西西比公司。計畫的目的是從密西西比河鄰近地區帶回想像中的龐大財富。密西西比河流經路易西安那地區，最早由法國探險家（柯爾伯特〔Colbert〕、喬利埃特〔Joliet〕、馬凱特〔Marquette〕）發現，後來由法國宣布占領。在法國國內的人以為路易西安那是另一個墨西哥，富藏等著被搜括的白銀和黃金。約翰·羅本人從未到過密西西比，甚至從未踏上新世界的土地，但他有高明的推銷本事，可以讓大眾相信他們聽到的神奇故事是真的。


    就像搖滾音樂會的歌迷，歇斯底里的巴黎人衝進約翰·羅豪宅附近像迷宮般的巷弄，揮舞手中的法國新鈔，爭搶著要求約翰·羅的業務代表接受他們的購股申請。股票價格節節攀升，約翰·羅公司的（紙上）身價也水漲船高，甚至超過所有法國流通的黃金。而買家還繼續湧進。


    當時幾乎所有法國人都染上密西西比熱，夢想著並不存在的密西西比黃金。但他們沒有任何有關約翰·羅公司的資訊，除了他本人對外公布的事以外。且當時沒有《華爾街日報》或《晚間商業新聞》來告訴他們，約翰·羅的計畫不可能成功。事實上，每當有人質疑他或他的公司，就會悄悄被運到城外遙遠的監獄裡。


    每當一大群人把畢生積蓄押注在毫無希望的提議時，那就叫作「狂'
  - '[PAGE 31]


    熱」或「泡沫」。這個模式永遠相同。狂熱的投資人支付荒謬的價格，爭搶加入騙局的機會，最後價格終於崩潰而暴跌。在密西西比「泡沫」爆破後，人們發現約翰·羅的公司只是一個空殼，約翰·羅只不過是奧茲王國的金融巫師（financial
    Wizard of Oz），投資人嘗試拋售股票，卻發現沒人想買。他們損失畢生積蓄，密西西比公司倒閉，銀行體系也隨之崩潰。就像約翰·羅在一夕之間變成法國英雄一樣，他也在轉眼間淪為法國公敵。


    英國也有自己版本的密西西比公司——創立於1711年的南海公司。主事者的一切做法都模仿自約翰·羅。南海公司承諾，如果英國皇室能授予他們與「南海」國家交易的獨占權，特別是墨西哥和秘魯，他們將代為償付英國龐大的軍事債務。


    1720年，南海公司宣布一項新計畫，要借給政府足夠的錢，以償還整個國家的債務，包括軍事和其他債務，只要政府同意支付貸款5％的利息。在此同時，這家公司開始出售更多股票，半數倫敦人坐在馬車上，湧向股票市場所在的交易巷（Exchange
    Alley），一心一意想買股票。這造成嚴重的馬車塞車，附近的巷子一連數週難以通行。


    南海公司的股票需求如此高，以致於在英國國會通過債務交易後，股價在一夜之間翻漲三倍。一位英國政治人物甚至警告大家，應該把錢留在自己口袋裡。但在這類泡沫中，沒有人會想聽理性的勸說。


    當南海公司的aker因爲賣股票而致富的消息傳出後，其他想發財的人也紛紛創立公司。各家公司都有一個千奇百怪的騙局：一架永'
  - '[PAGE 32]


    不停止的機器、巴勒斯坦聖地的鹽田、從維吉尼亞進口胡桃木樹、用熱空氣乾燥麥芽、從鋸屑製造木材、發明一種全新的肥皂。一家公司拒絕告訴投資人打算怎麼利用他們的錢，其描述公司的目的如下：「建立一個具有莫大優勢的事業，但沒有人能知道是何種事業。」


    王公貴族和販夫走卒、商人和僕役，各行各業和社會各階層的人，都被吸入倫敦股市，期待能迅速致富。當泡沫終於爆破，英國人遭到和法國人一樣的痛楚，南海股票的價格直線下墜，人們損失畢生積蓄，英國金融體制也瀕臨崩潰邊緣。


    南海公司的董事一個個接受審判，財產被沒收，並被送進監牢，其中有一些住進惡名昭彰的倫敦塔。牛頓（Isaac Newton）爵士也遭到泡沫波及，損失了許多錢。他說：「我可以計算天體的運動，但無法計算人的瘋狂。」


    南海災難給了股市如此的污名，以致國會通過一項法律，禁止任何公司購買或出售股票，不管從事的事業是什麼。股市遭到廢除，所有交易陷入停頓。股票經紀人從城裡最受歡迎的人，頓時遭到眾人唾棄，名聲比扒手、強盜或娼妓都不如。


    這對股票來說是個悲哀的開始，但從此以後情況大為改善，尤其是在最近數十年。


    # 早期創業家


    在大西洋的另一方，原本受僱於企業而來到美洲殖民地的移民，漸'
  md: '

    ## 1 資本主義簡史


    ### 資本主義誕生


    當人們製造東西並銷售它們來交換金錢時，資本主義就誕生了。若不是製造東西，就是人們提供服務以交換金錢之時。在人類歷史大部分時候，資本主義是一個陌生的概念，因為大部分世界人口從未接觸到錢。數千年來，一般人終其一生沒有買過任何東西。


    許多人是農奴、奴隸、僕役，為擁有土地和地上一切東西的主人工作，換取免費住在小茅屋裡，並分配到一小畝田地可以種植自己的蔬菜。但是他們不領薪水。


    沒有人抱怨工作領不到薪水，因為沒有地方可以花錢。偶爾會有一小隊流動商販經過城鎮，形成一個市集，但通常是孤立的活動。國王、王后、王子、公主、公爵、伯爵等，這些人擁有所有的財產——建築物、家具、牲口、牛車，從珠寶到鍋碗瓢盆的所有東西——而且只供給家人使用。他們不曾想過賣土地，即使這麼做能從中獲得厚利，而且可以少花一些除草的力氣。城堡前面不會有「待售」的標示，取得房地產的唯一方式是繼承，或用武力奪取。


    在世界許多地方，從最早的猶太教時期一直延續到基督教文明，以獲利為目的的商業是被禁止的活動，而借錢給他人並收取利息可能讓你被逐出教會或猶太教堂，並保證你將來在地獄有一席之地。銀行家惡名昭彰，人們往往避而遠之，會見他們時也得躲躲藏藏。從交易獲利，或追求富裕的生活，都被視為自私、不道德的行為，與上帝理想中井然有序的宇宙相違背。今日每個人都想改善自己的生活，但如果你活在中世紀，公開說你的目標是「獲得成功」或「改善自己的生活」，你的朋友會對你皺眉頭。成功的概念在當時不見容於社會。


    如果你想更了解有市場之前的社會，以及人們為薪資而工作、並能自由花錢以前的生活，可以閱讀海爾布羅納（Robert Heilbroner）的經典著作《俗世哲學家》（The
    Worldly Philosophers）第一章，你會發現讀起來一點也不沉悶。


    到18世紀末，世界已為商務廣開大門，國家之間有繁榮的貿易，市場在各地不斷興起。流通的金錢更加充裕，人們可以購買許多東西，商人也大發利市。店東、小販、貨運商和貿易商形成一個新商人階級，並且變得比擁有房地產和軍隊的王公貴族更富有、勢力更龐大。銀行家也走出密室，公開借錢給大眾。


    ### 美國的投資先驅


    歷史書籍列出美國成功的許多理由——有利的氣候、肥沃的土壤、遼闊的國土、權利法案、優越的政治制度、不斷湧入的勤奮移民，以及兩側的海洋阻擋侵略者。後院的發明家、夢想家和策劃者，銀行、資金和投資人也應在這串名單上占有一席之地。


    在美國歷史的第一章中，我們讀到有關印地安原住民、法國陷阱獵戶、西班牙征服者、弄錯航向的水手，傭兵、穿污熊皮的探險家，和第一個感恩節晚餐的清教徒。但在這些場景背後，有人必須支付船艦、食物以及所有冒險的帳單。這些錢大部分來自英國、荷蘭和法國投資人的口袋，沒有他們，就不會有人到這片殖民地來殖民。


    在建立詹姆斯鎮（Jamestown）和清教徒登陸普利茅斯岩（Plymouth Rock）的時代，沿著美國東岸有數百萬英畝的荒野，但你沒辦法任意把船開到那裡、選一個地點、從森林清理出空地，然後開始種植菸草，或與印地安人交易。你必須獲得國王或女王的許可。


    在那個年代，國王和女王掌控一切大權。如果你想在王室的土地上（也就是地球上大部分的地方）做生意，你必須取得皇家執照，亦即「公司特許狀」（charter of
    incorporation）。這些執照就是現代公司之前身，當時的企業家如果沒有取得特許，就無法開業營運。


    像賓州貴格教派（Quakers）這類宗教團體，當時就取得特許狀，許多商人團體也是，例如建立詹姆斯鎮的公司。取得王室批准屯墾一片土地和建立殖民地後，你還必須尋找資金來源。這就是最早期股票市場出現的背景。


    早至1602年，荷蘭人就已開始買賣聯合荷蘭東印度公司（United Dutch East India）的股票，這是全世界第一檔大眾化的股票，在全世界第一個大眾股票市場交易，地點就在阿姆斯特丹一座跨越阿姆斯特爾河（Amstel
    River）的橋上。成群喧鬧的投資人聚集在橋上，嘗試吸引股票交易商的注意，當他們互相推擠的動作失控時，就得召喚警察來恢復秩序。荷蘭人花數百萬荷蘭盾（guilder）搶購聯合荷蘭東印度公司的股票；如果像今日許多公司以字首縮寫來代表，這家公司應該稱作UDEI。


    總之，這家荷蘭公司從銷售股票籌得龐大資金，並把錢用在裝備幾艘船上。這些船啟程開往印度和東部的許多港口，運回來自遙東的最新商品，因為它們是當時歐洲最受歡迎的東西。


    當樂觀者支付愈來愈高的價格購買聯合荷蘭東印度的股票、寄望這家公司能讓他們發財時，悲觀者則透過叫作「放空」的聰明操作方法來下注；這種17世紀發明的方法仍被今日的悲觀者使用。在聯合荷蘭東印度的例子裡，樂觀者證明是對的，因為股價在交易頭幾年就上漲一倍，而且股東定期獲得紅利，也就是今日所知的股利。這家公司持續營運了兩世紀，直到1799年後繼無力而結束生意。


    你一定聽過，哈德遜（Henry Hudson）為了尋找通往印度的航線，駕駛他的船半月號（Half Moon）溯哈德遜河（Hudson River）來到今日的紐約；他犯了和哥倫布（Christopher
    Columbus）一樣的錯誤。你想過誰在背後資助這種白費力氣的探險嗎？我們都知道，哥倫布的資金來自西班牙的費迪南德國王（King Ferdinand）和伊莎貝拉王后（Queen
    Isabella），而哈德遜的資金來源則是剛才提到的荷蘭聯合東印度公司。


    另一家荷蘭企業荷蘭西印度公司（Dutch West India Company），派遣第一隊歐洲人在曼哈頓島上殖民。當明努伊特（Peter Minuit）做了史上最著名的房地產交易、以價值60荷蘭盾（相當於24美元）的一小堆裝飾品買下曼哈頓時，他是代表荷蘭西印度公司的股東做這筆生意。可惜這家公司存活得不夠久，沒能享受擁有所有昂貴的紐約鬧區辦公大樓的利益。


    看到荷蘭人資助他們的新世界冒險，英國人也效法其做法。倫敦的維吉尼亞公司（Virginia Company）擁有從卡羅來納到今日的維吉尼亞州、以及往北至今日紐約州這片廣大區域的獨占權。這家公司資助進駐詹姆斯鎮的第一支遠征隊，寶嘉康蒂（Pocahontas）就在那裡救了史密斯船長（Captain
    John Smith），不讓她生氣的族人敲破他的頭。


    詹姆斯鎮的移民在那裡工作，但並不擁有那個地方，這從一開始就是一個問題。他們受僱來開闢土地、種植作物和興建房屋，但所有的產業、進步和事業都屬於遠在倫敦的股東。如果詹姆斯鎮賺錢，真正的居民也分不到一分錢。


    詹姆斯鎮的移民經過七年激烈的抗爭，終於爭取到規則的改變，讓他們也可以擁有私人財產。在當時這個結果似乎無足輕重，因為初始的殖民地宣告破產。但從詹姆斯鎮可以學到一個重大教訓：擁有財產和在企業中擁有股權的人，比較願意勤奮工作，也感覺較快樂，比未擁有這些權利的人更能把工作做好。


    從馬里蘭（Maryland）到緬因（Maine）等沿海各地的商務獨占權，則被授予另一家英國公司——普利茅斯維吉尼亞公司（Virginia Company of
    Plymouth）。依照當年畫的地圖，新英格蘭大多被劃為北維吉尼亞的一部分。當清教徒在普利茅斯岩靠岸並跌涉到陸地上後，他們闖進了屬於普利茅斯公司的財產。


    美國的小學生都學過，清教徒如何冒著生命危險追求宗教自由，他們如何搭乘一艘小船五月花號（Mayflower）渡過險惡的大海，如何捱過新英格蘭寒冷的冬季，與印地安人交朋友，獲得他們的南瓜食譜，但是這些故事從未交代他們如何取得所需的資金。


    讓我們暫時重溫一下這個故事。清教徒先是離開英國，在荷蘭找到安身之處，也就是第一個有股票市場的國家——雖然清教徒跟股票沒有關係。在荷蘭安頓幾年後，清教徒無法忍受那裡，決定再度遷移。他們想到三個可能的地點：南美洲的奧里諾科河（Orinoco
    River）；紐約一個由荷蘭人控制的地區；或是由倫敦維吉尼亞公司（Virginia Company of London）提供給他們的一片地。


    阻止他們行動的原因之一是缺乏現金。他們需要補給品和一艘船，但無力負擔這兩者。如果沒有財務協助，他們可能永遠滯留在歐洲，我們也不會在歷史書上讀到他們。韋斯頓（Thomas
    Weston）就是在這個時候出現的。


    韋斯頓是倫敦一位富有的五金商人，他在新英格蘭有財產，且坐擁許多現金。他和他的夥伴認為，清教徒是絕佳的投資對象，因此向清教徒提出一項他們無法拒絕的提議。


    韋斯頓的集團自稱「冒險家」（The Adventurers），雖然他們不是親自去冒險的人。他們同意集資讓清教徒到美洲，交換的條件是清教徒必須每週工作四天、連續七年，好讓殖民地賺錢。七年後合夥關係將結束，雙方分享獲利，然後清教徒就可以自由做他們想做的事了。


    清教徒接受這些條件，因為沒有別的選擇，於是他們開始收拾行囊。然而到了最後一刻，韋斯頓突然大翻盤，改變了合約內容，把原本每週為企業工作四天的規定改為六天。這將使他們除了星期天外，沒有空閒時間種植後院的蔬果、修補衣服或敬拜他們的宗教。


    在與韋斯頓爭論沒有結果後，清教徒決定在不簽合約、沒有任何旅費下出航；在之前韋斯頓雖然已支付他們籌備的一切東西，但拒絕再提供任何金錢。他們必須出售為旅程製造的一部分奶油，以便繳納港口的稅捐，以便把他們在荷蘭裝備的虎尾草號（Speedwell）開出港口。


    虎尾草號會漏水，所以他們被迫返回港口，且懷疑是船長和水手與韋斯頓串通好，故意造成船身的裂縫。他們大部分人擠上另一艘比虎尾草號小、速度也更慢的船——五月花號。


    他們擠在五月花號上，啟程前往他們在維吉尼亞的應許之地，然而他們卻偏離航線，把船開到比目的地更遠的地方。在發現錯誤後，他們嘗試掉頭往南，但鱈魚角（Cape Cod）的岩石和淺灘阻擋了他們的通路。與其冒著在這片險惡的陌生水域沉沒的危險，他們決定在普若溫斯鎮（Provincetown）港下錨。


    他們從那裡遷移到普利茅斯，在普利茅斯蓋起住所，並栽種作物。由於韋斯頓已經斷絕資金供應，清教徒需要現金的新來源。他們與另一群投資人（由皮爾斯〔John Peirce〕帶領）和擁有土地的普利茅斯公司（Plymouth
    Company）達成一項新交易。


    清教徒每人都有100英畝土地，不限用途供其使用；皮爾斯則有每位清教徒所分得之100畝土地的所有權。此外，皮爾斯和其他投資人各可獲得1,500英畝的土地，交換他們資助清教徒其餘的遷移支出，並為殖民地提供資金。


    在他們要操心的許多事中（例如，如何度過寒冬、如何與原住民和平共處等等），清教徒必須擔心如何償付資助他們大筆金錢的投資人，包括以皮爾斯和韋斯頓為首的兩群人。雖然我們喜歡把清教徒想成他們心心念念只有上帝，但他們跟我們所有人有著同樣的問題——帳單。


    在普利茅斯殖民地開張一年後，五月花號空著船倉返回英國——沒有皮毛、珠寶、作物，沒有任何投資人可以轉賣的東西。普利茅斯公司已經虧錢、而且持續一季又一季虧損下去，這讓投資人非常沮喪，就像投資報酬率掛零的投資人向來會有的反應。更糟的是，他們必須載運更多補給品到殖民地去，所以成本不斷升高。


    到1622年，韋斯頓已受夠了普利茅斯和資助沒有任何回報的清教徒，所以他把這個事業的股份送給他的夥伴「冒險家」。另一方面，皮爾斯則在其他投資人後面使計謀，企圖掌控普利茅斯公司，以便他可以當上「普利茅斯殖民地領主」。結果他沒有得逞。


    有五年之久，清教徒和投資人繼續為錢爭論不休：清教徒抱怨資助不夠，投資人則抱怨獲利太少。到了1627年，合夥關係告吹，惱怒的投資人把整個殖民地以區區1,800英鎊賣給清教徒。


    由於清教徒沒有1,800英鎊，他們不得不以分期付款方式買下殖民地：每年支付200英鎊。這是美國歷史上首見的融資併購（leveraged buyout），也是1980年代著名的奈畢斯寇（RJR
    Nabisco）交易案之先驅；奈畢斯寇交易案後來被寫成書和拍成電影《登龍有術》（Barbarians at the Gate）。（在融資併購中，付不起錢的收購者利用借款方式買下一家公司。）清教徒的融資併購也是美國歷史上第一樁員工接管公司事業的案例。


    接下來是故事中最精彩的部分。清教徒在終於能自己作主後，馬上決定要過共產的生活方式：他們聚集資源，且個人不得擁有私有財產。當時的清教徒領袖布雷德福總督（Governor
    William Bradford）很快發現共產式的安排會失敗，他發現如果沒有私有財產，人們就沒有辛勤工作的誘因。如果殖民地的所有居民不管是工作或無所事事，都能得到相同的福利（食物、住家等等），他們何必辛苦工作？


    幾位有遠見的居民向布雷德福總督陳情，要求改變制度，讓農夫和漁夫可以擁有自己的農場和小船，以便從各自的努力賺錢。他們反過來藉由繳納獲利的稅金來支持社區。由布雷德福創設的這種自由企業制度，基本上和我們今日的制度相同。


    獨立仍不足以解決清教徒的財務問題。儘管他們勤奮工作，殖民地的債務仍從1,800英鎊增加到6,000英鎊。更多清教徒從荷蘭渡海而來，以便擴大捕魚船隊。他們希望靠捕魚的獲利來償付部分債務，但始終捕不到足夠的魚。在長達十年間，殖民地與債權人的協商持續進行，直到爭議在1642年徹底解決。


    清教徒協助建立了現代美國的社會、政治、宗教和經濟基礎，但對投資人來說，他們只是一個倒閉的事業。韋斯頓、皮爾斯和他們的夥伴在這場創業中是大輸家，由於他們都不是傻瓜，因而更凸顯出投資是一件高風險的事，即使是再周詳的計畫也可能失敗。也或許他們罪有應得，因為他們是如此狡滑、不光明磊落，違背了初始的交易。


    在這個例子裡，社會大眾可能很慶幸沒有機會買股票——清教徒不是一家上市公司，不像荷蘭西印度和荷蘭東印度公司那樣。但歐洲的大眾還有其他機會可以參與發新世界財，並且得到同樣悲慘的結果。例如時運不濟的密西西比公司（Mississippi
    Company）和南海公司（South Sea Company），兩家公司都在18世紀初創立，並出售股票給巴黎和倫敦股市成千上萬容易受騙上當的顧客。


    密西西比公司是由工於心計、且能言善道的約翰．羅（John Law）所創立。約翰．羅是那個年代最具傳奇性的人物之一，他在家鄉蘇格蘭因生意失敗而與人決鬥，在殺死對手後跑到法國，靠著花言巧語得以晉見國王路易十五（Louis
    XV）。當時路易十五尚未成年，皇室的決定權都操在攝政王奧良公爵（Duke of Orleans）手中。


    結識皇室是當年出人頭地唯一的方法，而約翰．羅相信，攝政王和他可以解決法國龐大的國債問題。


    約翰．羅的計畫是讓法國僱用一家印刷廠，開始印鈔票，用來償付債務。紙鈔在當時世界各地都是相當新的概念，而攝政王很喜歡這個概念——事實上，喜歡到他讓這位來自蘇格蘭的移民完全掌控法國皇家銀行（Royal
    Bank of France）以及皇室印鈔廠。


    不久後，約翰·羅的紙鈔已經流通各地。幾乎在一夕間，他從一個外國人變成掌控法國金融的國王，和富有程度僅次於路易十五本人的巴黎居民。


    隨著他在民意調查得到的支持度上升（不管當年他們用什麼方法調查），約翰·羅宣布了他第二個大計畫——密西西比公司。計畫的目的是從密西西比河鄰近地區帶回想像中的龐大財富。密西西比河流經路易西安那地區，最早由法國探險家（柯爾伯特〔Colbert〕、喬利埃特〔Joliet〕、馬凱特〔Marquette〕）發現，後來由法國宣布占領。在法國國內的人以為路易西安那是另一個墨西哥，富藏等著被搜括的白銀和黃金。約翰·羅本人從未到過密西西比，甚至從未踏上新世界的土地，但他有高明的推銷本事，可以讓大眾相信他們聽到的神奇故事是真的。


    就像搖滾音樂會的歌迷，歇斯底里的巴黎人衝進約翰·羅豪宅附近像迷宮般的巷弄，揮舞手中的法國新鈔，爭搶著要求約翰·羅的業務代表接受他們的購股申請。股票價格節節攀升，約翰·羅公司的（紙上）身價也水漲船高，甚至超過所有法國流通的黃金。而買家還繼續湧進。


    當時幾乎所有法國人都染上密西西比熱，夢想著並不存在的密西西比黃金。但他們沒有任何有關約翰·羅公司的資訊，除了他本人對外公布的事以外。且當時沒有《華爾街日報》或《晚間商業新聞》來告訴他們，約翰·羅的計畫不可能成功。事實上，每當有人質疑他或他的公司，就會悄悄被運到城外遙遠的監獄裡。


    每當一大群人把畢生積蓄押注在毫無希望的提議時，那就叫作「狂熱」或「泡沫」。這個模式永遠相同。狂熱的投資人支付荒謬的價格，爭搶加入騙局的機會，最後價格終於崩潰而暴跌。在密西西比「泡沫」爆破後，人們發現約翰·羅的公司只是一個空殼，約翰·羅只不過是奧茲王國的金融巫師（financial
    Wizard of Oz），投資人嘗試拋售股票，卻發現沒人想買。他們損失畢生積蓄，密西西比公司倒閉，銀行體系也隨之崩潰。就像約翰·羅在一夕之間變成法國英雄一樣，他也在轉眼間淪為法國公敵。


    英國也有自己版本的密西西比公司——創立於1711年的南海公司。主事者的一切做法都模仿自約翰·羅。南海公司承諾，如果英國皇室能授予他們與「南海」國家交易的獨占權，特別是墨西哥和秘魯，他們將代為償付英國龐大的軍事債務。


    1720年，南海公司宣布一項新計畫，要借給政府足夠的錢，以償還整個國家的債務，包括軍事和其他債務，只要政府同意支付貸款5％的利息。在此同時，這家公司開始出售更多股票，半數倫敦人坐在馬車上，湧向股票市場所在的交易巷（Exchange
    Alley），一心一意想買股票。這造成嚴重的馬車塞車，附近的巷子一連數週難以通行。


    南海公司的股票需求如此高，以致於在英國國會通過債務交易後，股價在一夜之間翻漲三倍。一位英國政治人物甚至警告大家，應該把錢留在自己口袋裡。但在這類泡沫中，沒有人會想聽理性的勸說。


    當南海公司的經紀人因爲賣股票而致富的消息傳出後，其他想發財的人也紛紛創立公司。各家公司都有一個千奇百怪的騙局：一架永不停止的機器、巴勒斯坦聖地的鹽田、從維吉尼亞進口胡桃木樹、用熱空氣乾燥麥芽、從鋸屑製造木材、發明一種全新的肥皂。一家公司拒絕告訴投資人打算怎麼利用他們的錢，其描述公司的目的如下：「建立一個具有莫大優勢的事業，但沒有人能知道是何種事業。」


    王公貴族和販夫走卒、商人和僕役，各行各業和社會各階層的人，都被吸入倫敦股市，期待能迅速致富。當泡沫終於爆破，英國人遭到和法國人一樣的痛楚，南海股票的價格直線下墜，人們損失畢生積蓄，英國金融體制也瀕臨崩潰邊緣。


    南海公司的董事一個個接受審判，財產被沒收，並被送進監牢，其中有一些住進惡名昭彰的倫敦塔。牛頓（Isaac Newton）爵士也遭到泡沫波及，損失了許多錢。他說：「我可以計算天體的運動，但無法計算人的瘋狂。」


    南海災難給了股市如此的污名，以致國會通過一項法律，禁止任何公司購買或出售股票，不管從事的事業是什麼。股市遭到廢除，所有交易陷入停頓。股票經紀人從城裡最受歡迎的人，頓時遭到眾人唾棄，名聲比扒手、強盜或娼妓都不如。


    這對股票來說是個悲哀的開始，但從此以後情況大為改善，尤其是在最近數十年。


