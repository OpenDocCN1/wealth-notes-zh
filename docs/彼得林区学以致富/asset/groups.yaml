    Rider），以他於美西戰爭中在古巴聖約翰山（San Juan Hill）率領騎士衝鋒陷陣而得名。但遠比贏得聖約翰山戰役更重要的是贏得對抗信託的戰爭。他變成了美國的「信託剋星」。1914年，國會通過第二項反信託法案，即克萊頓法案（Clayton
    Act）。


    從1911年的標準石油開始，許多美國最大的信託被拆解，主要產業的競爭因而恢復。此後政府持續監視規模太大、勢力太強的公司，唯恐形成產業的獨占。每當有這種情況發生，政府可提出反托辣斯控告，如果獲勝，法院就能強迫公司分拆成彼此獨立、規模較小的公司，以便確保產業的競爭。


