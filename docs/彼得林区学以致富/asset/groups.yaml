    司會怎麼利用賺來的錢？基本上公司有四種選擇。


    公司可以把錢再投入營運，實際上就是投資自己。它用這些錢開更多商店或蓋新工廠，讓盈餘成長得更快。就長期來看，這對股東十分有利。快速成長的公司可能獲得20％的投資報酬率，遠高於把錢存在銀行的報酬率。


    或者公司可以把錢浪費在噴射機、柚木裝潢辦公室、大理石主管浴室、主管薪資比業界行情多一倍，或者以過高的價格併購其他公司。這種不必要的購買對股東不利，可能破壞原本很划算的投資。


    或者公司可以買回自己的股票，減少市場流通的股數，即實施所謂的庫藏股計畫。為什麼公司要這麼做？因為市場流通的股數變少，其餘的股票就更有價值。買回股票對股東很有利，尤其是公司以低價買回股票時。


    最後，公司可以發放股利。這是大多數公司的做法。發放股利不完全是有利的事——公司發放股利等於放棄把那些錢投資在自己身上。儘管如此，股利對股東是很有利的。


    股利是公司回報擁有股票者的方式。那些錢會定期直接寄給你——這是四種選擇中唯一公司獲利直接進入你口袋的選擇。如果你持有股期間需要收入，股利符合你的需要。或者你可以用股利購買更多股票。


    股利也有心理上的利益。在空頭市場或修正期，不管股價的走勢如何，你仍然收到股利，這給你另一個不因恐慌賣出持股的理由。


    有數百萬名投資人專門買進發放股利的股票，不買別的。如果你對這種投資感興趣，可連絡華爾街的研究業者穆迪投資服務公司（Moody''s Investors Service）。穆迪整理一份名單，列出連續多年提高股利的公司。有家公司曾連續五十年提高股利；有300家公司曾連續十年提高股利。


    這份名單登在穆迪的《股利追求者手冊》（Handbook of Dividend Achievers），附帶一份完整的統計表，列出會定期提高股利的所有公司。


    ## 如何抓住12倍打股


    如果你準備投資一檔股票，必須先了解這家公司。許多投資人在此處犯錯，他們買一檔股票卻不了解這家公司，他們追蹤股價，因為那是他們唯一了解的細節。當股價上漲時，他們認為公司的體質一定很好，但當股價下跌，他們便感到無趣或喪失信心，所以賣出股票。


    光憑股價而不了解一家公司就買進股票，可能是投資人所犯最嚴重的錯誤。這會讓人在崩盤或修正期間、股價跌到最低點時拋售持股，因為投資人以為這表示公司的體質一定很差。那會使投資人錯過在股價低、但公司體質還很好時買進更多股票的機會。


    了解公司讓你知道公司在未來能否創造獲利；或者如果營運惡化，會不會造成虧損。了解公司有時不太容易，有些公司的情況比其他公司複雜。有許多不同部門的公司，比只有單一產品的公司更難了解。即使公司的營運很單純，有時也難以判斷好壞。


    不過，有時展望一片明朗，一般投資人就能看出營運的前景令人振奮。這就是了解一家公司可以獲得豐厚報酬的時候。讓我們設想兩個不同時期的例子：1987年的耐吉和1994年的嬌生（Johnson
    & Johnson）。


    耐吉的營運很單純，它製造運動鞋。和速食店及專門零售業一樣，這類公司適合所有人追蹤研究。有三個要素：第一，耐吉今年是否比去年銷售更多運動鞋？第二，耐吉銷售運動鞋的利潤是否夠好？第三，耐吉明年和後年能否賣出更多運動鞋？在1987年，投資人從寄給他們的季報和年報獲得一些肯定的答案。


    自1980年上市以來，耐吉股大起大落，從1984年的5美元漲到1986年的10美元，跌回5美元後，又在1987年回升至10美元。看看這個過程的背景，運動鞋的前景是一片前所未見的光明，人人都穿運動鞋：學步的幼兒、青少年，甚至小時候不穿運動鞋的成年人也開始穿起運動鞋了。有各種不同的運動鞋：網球鞋、慢跑鞋、籃球鞋，應有盡有。運動鞋的需求很明顯在成長，而耐吉是大供應商。


    然而公司營運卻進入一段顛簸期，銷售、盈餘和銷售展望全面下滑。這是一個令人失望的發展，股東在收到1987年度第一季的報告時無不感到憂慮。（和許多公司的慣例相同，耐吉的年度從6月開始，所以1987年度第一季在1986年8月結束。）如果你擁有耐吉股票，你會在1986年10月初收到報告。銷售滑落22%，盈餘減少38%，而「未來展望」（未來的訂單）也減少39%。這不是買進更多耐吉股票的好時機。


    年度第二季的報告在1987年1月6日寄出，和第一季一樣難看，而第三季也好不了多少。但是出乎意料的，在1987年7月底與年度報告一起寄到的第四季報告，卻出現了轉機。銷售仍然下滑，但減幅只有3%；盈餘還是減少，但未來的訂單已經回升。這表示世界各地的店家已開始採購更多耐吉運動鞋。他們一定是認為可以賣出更多耐吉運動鞋，否則不會向耐吉下更多訂單。


    看了那一年度的報告，你也會發現，儘管盈餘連續幾季下滑，耐吉仍然有可觀的獲利。這是因為運動鞋是成本很低的產業，它不像鋼鐵業必須興建和維謢昂貴的工廠。在運動鞋業，你需要的只是一個寬敞的空間，安裝一些縫紉機，使用相對便宜的原料。耐吉手上有很多現金，財務體質相當強健。


    當打開1988年度第一季的報告（在1987年9月寄到），你幾乎不相信自己的眼睛。銷售上揚10%，盈餘激增68%，未來訂單增加61%。這證明耐吉會連續交出好成績。事實上，這一連續就是五年的時間：連續20季的銷售成長和盈餘增加。


    在1987年9月，你還不知道未來20季的事。你很高興公司已經扭轉頹勢，但你不會衝出去買更多股票。你擔心已經從7美元飆漲到12.50美元的股價。


    所以你等待進一步的發展，而這次你運氣很好。股價在1987年10月的股市崩盤中重挫，只知道股價而不了解公司的投資人把手上的所有股票賣掉，包括他們的耐吉股。他們聽到晚間新聞的評論員預測全球金融市場將崩潰，而驚慌拋售持股。


    在一片混亂中，你保持鎮定，因為你了解耐吉的營運正要好轉。股市崩盤送你一份大禮：以便宜價格買進更多耐吉股票的機會。


