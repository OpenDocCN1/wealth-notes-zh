    投資人是資本主義鏈結的第一環。你能設法儲蓄的錢愈多，能買到的公司股票就愈多，你未來的生活就可能更富有，因為如果你聰明地挑選股票，而且能保持耐性，你的股票在未來的價值就遠超過你購買它時的價值。'
