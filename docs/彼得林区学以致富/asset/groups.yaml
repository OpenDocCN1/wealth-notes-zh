  - "[PAGE 10]\n\n# 前言\n\n# 我們熟悉的公司\n\n當一群人一起做生意，他們通常會組織一家公司。世界上大多數商務是由公司進行的。「公司」（company）這個詞源自拉丁文，意思是「同伴」（companion）。\n\
    \n公司的正式名稱是「股份公司」（corporation），這個詞源自另一個拉丁文「corpus」，意思是「群體」，這時候的意思是一群人聚集從事商業。「屍體」（corpse）也源自「corpus」，但與這裡談到的主題無關，因為屍體不能做生意。\n\
    \n要組織公司很容易，只要支付一小筆手續費，在你想登記地址的州填幾張表格，就可以完成手續。德拉瓦州是最受歡迎的選擇，因為當地的法律對企業很友善，但每一州每年都有成千上萬的公司組成。每當你看到公司名稱後面加了「Inc.」，就表示這家公司已經填寫表格成為股份公司。「Inc.」是「Incorporated」的簡寫，代表「已登記成為公司」。\
    \ \n\n從法律的觀點看，股份公司是一個單獨的個體，可以因為不良行為而受懲罰，通常是被處以罰款。這是企業主不厭其煩要登記成股份公司的主要原因，如果他們做錯事而挨告，公司要承擔責任，而他"
  - '[PAGE 11]


    們可以規避懲罰。想像如果你未經允許擅自開父母的汽車撞上樹，你一定想，要是你已經登記成為公司那該有多好。


    你記得埃克森石油（Exxon）的瓦爾狄茲號（Valdez）油輪在阿拉斯加擱淺，造成1,100萬加侖原油洩漏到威廉王子灣的災難嗎？這場浩劫花了好幾個月才清理完。油輪屬於美國第三大公司埃克森所有，在當時埃克森有數十萬名股東，他們都是這家公司的共同企業主。


    如果埃克森不是股份公司，這些人可能每個人都分別吃上官司，為了不是他們造成的原油洩漏而損失畢生積蓄。即使埃克森被判無罪，他們也必須支付法律費用來為自己辯護，因為雖然在你被證明有罪前都是無辜的，你還是得付錢給律師。


    這就是股份公司的妙處。它可能吃上官司，它的經理人和董事也可能挨告，但企業主——也就是股東——卻受到保護。他們根據法律就是不會被告。在英國，公司名稱後面會加上「有限」兩個字，表示企業主只承擔有限的責任，就和美國的公司一樣。（如果有人問你「有限」的意思，現在你知道怎麼回答了。）


    這對我們的資本主義體制是極為重要的保障，因為如果公司一犯錯股東就會挨告，像你和我這種人就會害怕買股票變成股東。為什麼我們要承擔嚴重的石油洩漏災難、或漢堡裡發現一根老鼠毛、或企業每天都會發生各種錯誤的風險？如果不是承擔有限的責任，沒有人會想買任何一張股票。'
  - '[PAGE 12]


    # 私人公司與上市公司


    美國絕大部分企業是私人公司，它們由一個人或一小群人擁有，而且所有權通常集中在一個家族。在每個城鎮每條大街的每個街區，你都可以找到私人公司的例子，它們也散布在美國和世界各國的都市，有理髮院、美髮沙龍、修鞋舖、腳踏車店、棒球卡店、糖果店、舊貨舖、古董店、二手店、蔬果攤、保齡球館、珠寶店、二手車銷售場，以及地方上的家庭餐廳。大多數醫院和大學也是私人公司。


    這些企業被稱作私人企業，是因為一般大眾不能投資它們。如果你晚上住在好夢屋（Sleepy Holler）汽車旅館，對那裡和經營的方式十分滿意，你不太可能去敲經理的門，要求變成旅館的合夥人。除非你與業主是親戚，或老闆有兒子或女兒想和你成親，否則你得到這家企業股票的機會幾乎是零。


    要是你晚上住在希爾頓（Hillton）或萬豪飯店（Marriott），而且對那些地方印象很好，那會有什麽不同？你不必敲任何門或跟誰的兒子或女兒結婚，就能成為業主。你要做的就只是下單買股票。希爾頓和萬豪飯店在股票市場出售它們的股票。任何這麽做的公司就稱作上市公司。


    （雖然美國的私人公司比上市公司多，但上市公司通常規模大得多，這是大多數人為上市公司工作的原因。）在上市公司，你和你的父母、莎莉嬸嬸或你的街坊鄰居，都可以買股票，並自動變成業主。一旦你付錢後，就能得到一張憑證，稱作股票證書（stock
    certificate），證明你是股票擁有者之一。這張紙有真正的價值，你'
  - '[PAGE 13]


    隨時可以賣掉它。


    就任何人都能成為業主來說，上市公司是世界上最民主的機構。它是真正機會平等的例子，它不管你的膚色、性別、宗教、星座、國籍，或者你是不是有姆囊炎腫、長痘痘或有口臭。


    即使麥當勞（McDonald''s）的董事長跟你有過節，他也無法阻止你變成麥當勞股東。股票都在股市流通，每週有五天、每天有六個小時不斷被買進賣出，誰有現金能支付其價格，愛買多少都可以。這適用於麥當勞，也適用於今日美國的其他1.3萬家上市公司。上市公司到處都有，它們從早到晚圍繞在你四周，你擺脫不掉它們。


    耐吉（Nike）、克萊斯勒（Chrysler）、通用汽車（General Motors）、蓋普（Gap）、波士頓凱爾特人隊（Boston Celtics）、聯合航空（United
    Airlines）、史泰博（Staples）、溫蒂（Wendy''s）、可口可樂（Coca-Cola）、哈雷（Harley Davidson）、太陽眼鏡屋（Sunglass
    Hut）、漫威漫畫（Marvel Comics）、柯達（Kodak）、富士（Fuji）、沃爾瑪（Wal-Mart）、樂柏美（Bubbermaid）、時代華納（Time
    Warner）和溫尼貝戈（Winnebago），這些公司有哪些共通點？他們都是上市公司。你可以玩字母遊戲，從A到Z，用每個字母代表一家上市公司。


    在家裡、在街上、在學校四周和在大賣場每個角落，你都一定會看到這些大公司的蹤影。幾乎所有你吃的、穿的、讀的、聽的、搭乘的、躺的，或漱口用的，都是它們製造的東西。從香水到小刀、浴缸到熱狗、螺絲釘到指甲油，都是由你能當股東的企業所製造。'
  - '[PAGE 14]


    你的床單可能來自西點史蒂文斯公司（Westpoint Stevens）；鬧鐘收音機來自奇異（General Electric）；馬桶、洗臉盆、水龍頭來自美國標準（American
    Standard）或艾爾傑（Eljer）；牙膏和洗髮精來自寶鹼（Procter & Gamble）；刮鬍刀來自吉列（Gillette）；乳液來自美體小舖（Body
    Shop）；牙刷來自高露潔棕欖（Colgate-Palmolidve）。


    穿上你的鮮果布衣（Fruit-of-the-Loom）內衣，和你在蓋普或Limited買的、由Hagar或Farah製造的襯衫和長褲（它們的布料來自Galey
    & Lord，而之前的纖維則由杜邦化學〔Du Pont Chemical〕所生產）。繫上你的銳跑（Reebok）鞋帶。或是你在Foot Locker買的、用花旗銀行威士卡（VISA）刷卡付款的Keds帆布鞋。你已經跟十幾家上市公司發生關係了，而你連早餐都還沒吃呢。


    坐在早餐桌前，你將發現通用磨坊（General Mills）供應的Cheerios麥片；家樂氏（Kelloggs）的Pop Tarts果醬餡餅、Eggo鬆餅；海冠公司（Seagram）製造的純品康納（Tropicana）柳橙汁，雖然海冠生產的威士忌還比果汁更出名；菲利普莫理斯（Philip
    Morris）供應的糕點，這家公司除了生產萬寶路（Marlboros）香菸外，也製造卡夫（Kraft）乳酪和Oscar Mayer熱狗。你的土司可以從Toastmaster
    生產的烤麵包機跳出來，這家公司從1920年代就開始營業，現在還生意興隆。


    咖啡壺、微波爐、瓦斯爐和冰箱都由上市公司製造，而你和你父母購買食物的大型超級市場，也都是上市公司開的。'
  - '[PAGE 15]


    也許你搭乘由通用汽車製造的巴士上學，巴士使用的鋼鐵則來自伯利恆鋼鐵公司（Bethlehem Steel），擋風玻璃出自PPG Industries，輪胎由固特異（Goodyear）製造，輪圈產自Superior
    Industries，所用的鋁則向美國鋁業（Alcoa）採購。巴士使用的汽油來自埃克森（Exxon）、德士古（Texaco）或許多家上市石油公司之一。巴士向安泰保險公司（Aetna）投保；巴士本身可能由Laidlaw擁有，這家公司經營許多學區的巴士系統。


    你書包裡的書可能是由一家上市出版公司出版的，例如麥格羅希爾（McGraw-Hill）、霍頓米夫林（Houghton Mifflin）或西蒙與舒斯特（Simon
    & Schuster）。西蒙與舒斯特正是本書的出版商，它是派拉蒙（Paramount）的子公司，而派拉蒙不久前才買下麥迪遜廣場花園（Madison Square
    Garden）、紐約尼克籃球隊（New York Knicks）、紐約遊騎兵冰球隊（New York Rangers）。另一家上市公司維康（Viacom）則在1994年的一樁併購案中併吞了派拉蒙。


    併購在企業界隨時都在發生。在華爾街發生的進攻與征服，遠多過派拉蒙製作的任何戰爭電影；或者由原本隸屬MCA旗下的環球製片廠（Unviersal Studios）所製作的戰爭片（環球製片已被日本人買下）；或者MCA本身拍攝的電影（MCA現在已是海冠的一部分）。


    也許你吃的學校午餐是由雷神公司（Raytheon）在 лаз艾瑪納雷達（Amana Radar）農場烹飪的，而雷神也是製造愛國者飛彈（Patriot missile）的公司。或者你可能開車從校園到最近的一家上市漢堡連鎖店用餐，例如麥當勞、溫蒂或漢堡王；漢堡王的母公司是英國的上市公司大都會（Grand
    Metropolitan）。你喝的可口可樂和百事可'
  - '[PAGE 16]


    樂都來自上市公司，而百事公司（Pepsi）也擁有塔可貝爾（Taco Bell）、必勝客（Pizza Hut）、佛祿托來（Frito-Lay）和肯德基（Kentucky
    Fried Chicken），所以百事公司的股東也同時投資這麼多公司。


    賀喜（Hershey）巧克力、箭牌（Wrigley''s）口香糖、Tootsie Rolls 糖，和大多數販賣機裡的糖果都是上市公司生產的，除了士力架巧克力（Snickers）是由瑪氏（Mars）家族製造的。


    當你下午回家，拿起電話打給男朋友或女朋友時，你使用的服務由上市電話公司提供，如果是長途電話，那麼你將同時使用三家上市公司的服務：「小貝爾」（Baby Bell，包括NYNEX、PacTel等公司）服務短程的市內服務；長途電話公司（Sprint、MCI或原始的「媽貝爾」〔Ma
