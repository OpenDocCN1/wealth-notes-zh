    ## 著名的道瓊平均指數


    1884年，一位名叫查爾斯·道（Charles Henry Dow）的新闻記者，發明一種讓股票迷追蹤整體股市表現的方法。他集合11檔重要的股票，在每個交易日結束時記下每一檔股票的收盤價，把它們加起來除以11，得出一個平均數。道氏將每日的平均數刊登在一份稱為《顧客午後信》（Customer''s
    Afternoon Letter）的新通訊上。


    道氏的平均指數剛開始只是引起大家的好奇，沒想到最後竟讓他在青史上留名。它後來以道瓊平均指數而聞名（瓊斯〔Jones〕是道氏在新聞事業上的夥伴，因而稱為道瓊指數〔Dow
    Jones Average〕），成為過去一百多年來美國股市的主要指標。即使到今日，當人們問「股市情況如何？」或「股市收盤多少？」，他們說的就是道瓊平均指數。當有人說「股市漲30點」或「跌50點」時，他們指的也是道瓊指數。


    最早的道瓊指數包括9檔鐵路公司股票，因為當時鐵路公司在華爾街的地位極重要，人們認為鐵路公司將永遠支配美國商業。過了十二年後，道氏組合另一個平均指數，即工業平均指數，代表美國的基礎產業（石油與天然氣提煉廠、煤礦商、冶錬業等），包括把原料轉變成燃料、鋼鐵和橡膠等整個經濟所仰賴產品的產業。最早的道瓊工業指數都是獨霸市場的公司，規模大且具舉足輕重的影響力，有如今日的微軟和沃爾瑪，但大部分後來都消失得無影無蹤。


    誰聽過美國棉花油（American Cotton Oil）、芝加哥天然氣（Chicago Gas）、拉克德天然氣（Laclede Gas）、國家鉛業（National
    Lead）、田納西煤鐵（Tennessee Coal & Iron）或美國橡膠（U.S. Rubber）？這些公司都是道瓊工業指數初始的成分股。你唯一認得的名字是奇異（General
    Electric），它歷經這麼多年始終屹立不搖。


    投資人可以從中學到一個重要的教訓：商業就像運動，常勝軍和成功的組織不會永遠保持第一。在商業或運動中，要達到頂尖地位極其困難，要長保第一更是難上加難。紐約洋基隊在1970年代的黃金年代即將結束時發現這一點，匹茲堡鋼人隊（Pittsburgh
    Steelers）和波士頓塞爾提克隊（Boston Celtics）也是。田納西煤鐵、拉克德天然氣、美國棉花油何嘗不是如此。奇異是贏家保持常勝的罕見例子。


    藉由比較最早期的道瓊工業指數與今日擴增到30檔的指數，就能發現美國的變遷。麥當勞是今日的成分股之一——漢堡也是工業嗎？嚴格來說不是，但麥當勞是如此重要的公司，所以被納入道瓊指數。當道氏選擇初始的工業公司時，沒有一家餐飲公司大到合乎他的標準。可口可樂也是今日的道瓊指數成分股。像可口可樂營運如此廣泛、勢力如此龐大的公司，的確該列入其中，但在1920年代它的規模還很小，大多數投資人對它一無所知。迪士尼（Disney）也是今日道瓊的成分股，但它直到1940年才開始上市交易。當道氏發明道瓊指數時，迪士尼（Walt
    Disney）還沒畫出第一隻卡通米老鼠呢。


    今日的道瓊指數證明美國不再是當年的基本工業大國，仰賴煤礦、鋼鐵廠等重工業的生產。隨著工廠逐漸退至商業和華爾街的陪襯地位，餐廳、銀行、零售業、娛樂公司，以及晚近的電腦與軟體公司，也陸續登上舞台中央。


    ## 公司城


    在農場工作的美國人快速減少，到1920年以後，大多數人已住在城市，因為那是企業做生意的 主要地點，提供最多的就業機會。有些公司甚至建立自己的城鎮，以便員工有居住的好地方。美國鋼鐵公司創造了印地安那州的蓋瑞市（Gary），賀喜巧克力公司從零設計出整個賓州賀喜鎮（Hershey）——雖然沒有威利·旺卡（Willy
    Wonka）*想要的薑餅與水果糖屋及棒棒糖街燈，但人們還是很喜歡。賀喜鎮今日仍是居住的好地方，但有幾個公司城的結局並不好，最有名的例子是伊利諾州位於芝加哥邊緣的普爾曼鎮（Pullman）。


    當年想住在普爾曼，必須受僱於製造火車旅客車廂的普爾曼公司（Pullman）。將近9,000名的普爾曼員工和其家人，都住在完全一樣的房屋，環繞一個公園和一座湖。普爾曼鎮在「環境」這詞還未成為流行詞彙之前很久，就已經是環境規劃的典範。那座湖扮演冷卻水池的功能，供應工廠的用水。來自鎮民廁所的污水則被用作肥料。


    學校很棒，風景十分優美，人們受到很好的照顧，所以普爾曼是一個快樂的小鎮，直到火車車廂的生意變差，公司不再賺錢。普爾曼做任何不賺錢的公司會做的事——削減支出，包括減少給員工的薪資和福利。憤怒的工人展開罷工，而這場罷工和對公司的怨恨摧毀了這個城鎮。最後，公司賣出房子和其他建築，整個運作逐漸停頓。普爾曼宣告破產。


    *編按：威利·旺卡（Willy Wonka）是羅爾德·達爾（Roald Dahl）小說《查理與巧克力工廠》（Charlie and the Chocolate
    Factory）的主角，是一名糖果製造商。


    由公司提供住宅、教育、醫療和其他民生必需系統有一個危險：如果公司經營良好，提供社會服務就不成問題，但如果公司經營不善呢？這時有兩個選擇，一個是裁撤員工和削減支出以減少赤字，學校、醫院和公園可能被迫關閉，以便公司能夠生存下去。另一個選擇是所有服務和支出持續不變，直到公司不支而倒閉。


    資本主義最大的優點是，虧損的公司有機會嘗試扭轉頹勢，如果還是不行，它可以停止苟延殘喘。沒有生產力的企業可以死亡，工人繼續尋找其他體質較強健的行業。但當公司必須扮演第二種角色——當員工的醫生、老師和照顧者時，它可能為了讓員工能繼續享有全部福利而繼續營運。


    這是共產主義崩潰和社會主義出問題的原因之一。共產主義的企業不是真正的企業，它們存在是因為共產黨領導人和中央計劃者決定它們應該存在。例如，俄羅斯的中央計劃者喜歡興建鋼鐵廠，有一段時期俄羅斯人很擅長製造鋼鐵，國內到處都是鋼鐵廠。


    另一方面，為人民製造鞋子或衣服的工廠卻很少，這導致鞋子和衣服商店的供應短缺和顧客大排長龍。俄羅斯消費者產品有龐大的潛在市場，人們很希望有更多食物和更多衣服，但計劃者卻無動於衷，他們只想蓋更多鋼鐵廠。也許他們認為俄羅斯人可以開始穿鋼製的褲子。


    在共產主義經濟中，所有資源——一切製造出來、被購買或銷售的東西——都由一小群經理人控制。在資本主義經濟，如果鋼鐵廠太多，我們會出現鋼鐵供給過剩，價格會下跌，鋼鐵公司會虧損，人們會停止買鋼鐵股，銀行會停止借錢給鋼鐵公司。鋼鐵廠會被迫減產，因為沒有可供擴張的資金，它們會停止擴張。


    其結果是，未投資在鋼鐵公司的錢會被用在其他地方，用來興建鞋工廠、牛仔褲工廠、商場、滑水道遊樂場或住宅開發計畫——用來生產市場尚未飽和、仍有需求的產品。史密斯的「看不見的手」永遠不會出差錯。


    ## 馬克斯


    最有影響力的共產主義經濟理論出自馬克斯（Karl Marx）的腦袋。生於1818年的馬克斯是德國人，但他在倫敦發展出他大部分的思想——正當他的妻小住在倫敦的公寓裡挨餓受凍時。雖然他喜歡經濟學，他的個人理財卻不及格。


    馬克斯嘗試把資本主義簡化成一則公式，就像牛頓處理重力問題那樣。其著作《資本論》（Das Kapital）變成世界各地共產主義的聖經，你可以說，除了聖經以外，那是有史以來影響力最大的一本書。它說服列寧（Lenin）和其他有影響力的俄羅斯人，在贏得俄國革命後建立一個共產主義國家。


    根據馬克斯的想法，資本主義註定滅亡，因為隨著企業成長，愈來愈多人受制於機器，勞動力的價值勢必下降。全世界的勞工將必須工作更久，賺取更微薄的工資，直到最後他們忍受不了，憤而燒燬工廠，並加入共產黨。


    在馬克斯寫書時的工廠工作的確很辛苦，它們陰暗、嘈雜、骯髒且危險，女人和兒童被迫每天工作12到18小時照顧機器，只能賺取極少的工資。有些人在違背自己意志的情況下被關在工廠工作，許多人染患疾病。煙囪冒出的煙塵遮蔽天空，空氣遭到污染。


    馬克斯痛恨他看到的現象（雖然他家人的生活狀況並不比工廠工人好多少），他決心證明工廠的悲慘狀況不會永遠存在。但他的理論完全沒有料中，工廠工人非但沒有工時愈來愈長、工資愈來愈少，反而工時愈來愈短、工資愈來愈多，因為工廠添置了新設備，使每個工人得以在相同的時間製造更多產品。


    有了更有效率的機器後，工人就有更多時間，工廠也更有能力提高工人的工資。這些加薪往往是爭取得來的，但通常總是工人能如願以償獲得加薪。且不像馬克斯所說工人注定過悲慘的生活，反而工作環境變得更乾淨，工人帶回家的錢也更多了。這是最多工廠的國家——英國、美國和西歐——也最富裕的原因，相較之下，世界其他地區仍貧窮落後，由少數大地主擁有一切。


    結果證明馬克斯錯得離譜。註定滅亡的是共產主義，因為共產主義國家的生活水準持續滑落，而資本主義國家則不斷提升。俄羅斯和東歐國家的工人最後推翻了共產主義，轉而擁抱西方體制。


    ## 1929年崩盤前


    在1929年股市崩盤前，華爾街是一個忙碌的地方，尤其辦事員特別忙，因為大部分文書工作都以原始的工具進行，例如計算機和打字機。這個工作極花時間，而股票經紀公司需要很大的倉庫來儲存記錄。


    在紐約證交所交易股票的公司總市值約870億美元，比起今日5.4兆美元的總市值只有九牛一毛。現在光是埃克森公司的股票市值就遠超過870億美元，這家公司的股東人數也超過任何其他上市公司。


    在1929年，AT&T是股東最多的公司，也是全世界最大的企業，但鐵路業仍是最大產業，其次是石油，然後是鋼鐵。如果你想要安全穩當的投資，買鐵路公司就錯不了。鐵路公司支付優厚穩定的股利，雖然這個角色後來被電力公用事業取代。


    和AT&T一樣，鐵路股票在崩盤期間表現良好，但在股市回升時的表現卻沒有那麼好。很少經濟學家（更少算命師）料到鐵路公司日後會喪失領導產業的角色，退居到對大眾生活無足輕重的地位，且其股票在接下來數十年變成乏善可陳的投資。股票的好壞完全視時機而定。


    鐵路產業沒落的主因之一是汽車產業，這個趨勢自然引起投資人的注意。汽車產業展現出典型的新企業發展，在剛開始時，汽車製造只是家庭事業。汽車在全國各地的車庫裡製造。到19、20世紀之交，汽車製造廠主要分布在新英格蘭、中大西洋各州和中西部。


    亨利。福特（Henry Ford）就此時脫穎而出，他建立生產線，采用大量生產的方法，就像杜克生產香菸和亨氏生產酸黃瓜一樣。他製造出統一規格的高品質、低售價汽車，並深受大眾喜愛。人們買光福特生產的所有「T型車」，但他們無法購買股票，因為福特是未上市公司，由福特、其家人和朋友持有股票。另一方面，通用汽車是上市公司，在1929年已是一檔很受歡迎的股票——它是美國第三大股票，僅次於AT&T和美國鋼鐵。在福特專心生產T型車時，通用汽車則致力於生產多樣的車款供顧客選擇。事實上，通用雖然超越福特，但福特看到前景，並且也增添自己的新車款。當時汽車業中較小的競爭者還有克萊斯勒（Chrysler）、哈德遜（Hudson）和納許（Nash）。


    在當時，連鎖店已是美國各地城市和鄉鎮熟悉的景象，其中最著名的是來自賓州的伍爾渥斯百貨（Woolworth），創立於19世紀，也是歷史上首見的百貨連鎖。接著有麥克利（McCrory）、克雷斯（Kress）和克瑞斯吉（Kresge）。A&P也建立了全國性的超級市場連鎖。第一家購物中心鄉村俱樂部廣場（Country
    Club Plaza）1922年在堪薩斯市附近創立。


    今日藥房、糖果店、百貨公司和雜貨店的最大品牌，在1929年時都是小公司，比起美國鋼鐵或紐約中央鐵路這類強大的鐵路公司，都是微不足道的小咖。1929年領導業界的食品公司是聯合水果（United
    Fruit）、國家乳品（National Dairy Products）和博登（Borden）。通用磨坊（General Mills）和皮爾斯貝利麵粉（Pillsbury
    Flour Mills）在穀物和烘培業都是相對的新進者。可口可樂當時的股票市值只有1.34億美元；箭牌的市值為1.36億美元；吉列（Gillette）市值2.26億美元，而寶鹼市值則為3.45億美元。比較起來，可口可樂公司在1994年每天獲利將近700萬美元。


    西爾斯（Sears）當時是零售業的霸主，緊跟在後的是長期勁敵蒙哥馬利華德（Montgomery Ward）。伍爾淅斯擁有一個「五分或一角商店」的全國網絡，裡面所有東西的售價都不到10美分。


    郊區逐漸在城市週邊冒出，但當時的郊區還沒有商場，因為連絡郊區與郊區的道路和公路網尚未興建。例如，在波士頓外面，你可以搭火車或電車從 podnik 到布魯克萊恩（Brookline）或到納提克（Natick），但沒有路可從布魯克萊恩到納提克。因此如果布魯克萊恩有商場，只有住在那裡的人到得了。不但道路太少，汽車的供應也不足。


    人們到城市裡購物，在鬧區的百貨公司買東西，或在鄉鎮地方的家庭商店，但那裡不但價格高，而且商品種類有限；如果他們住在偏遠地區，他們會看蒙哥馬利華德或西爾斯的郵購目錄採購。


    今日每個街角都有一家商店，在每條公路的交流道出口都有一家大商場，因此我們很難想像一家零售商會像西爾斯那樣贏得購物者的心。在美國的偏遠地區，西爾斯不只是一家郵購目錄公司，而且對數百萬名忠誠的愛好者來說，它還是刺激和紓解沉悶無聊的來源。西爾斯活像商業的天賜禮物，喬治亞州州長塔馬吉（Eugene
    Talmadge）在對當地農民的競選演講中曾說：「你僅有的朋友是耶穌、西爾斯和塔馬吉。」


    名不見經傳的小企業逐漸茁壯成明日的億萬公司，這發生在1990年代，就像發生在1920年代和其他年代一樣。辦公室設備在1929年已不是家庭工業，當時這行業的前五大品牌分別是郵址印刷機公司（Addressograph-Multigraph）、博洛夫計算機（Burroughs
    Adding Machine）、國際商業機器公司（IBM）、國家收銀機（National Cash Register）和雷明頓蘭德（Remington Rand）。各家公司的市值介於900萬美元到6,500萬美元。五家中有四家（除了郵址印刷機公司）變成企業巨人。


    許多投資人在1929年的崩盤中傾家蕩產，但賣股票給他們的經紀公司度過這場浩劫。幾家較不著名的經紀公司破產，但大多數仍繼續營運。在當年，人們買股票可融資90%，這也是崩盤讓他們血本無歸的原因。最後他們的負債比當初投資的金額還多，證券商必須討回這些債務，他們想盡辦法追索顧客的資產。華爾街的公司也用借來的錢買股票，但借錢給他們的銀行較為寬容，給他們額外的時間償付債款。散戶投資人的運氣可沒有那麼好。


    ## 恐懼崩盤


    美國歷史上沒有一個事件像1929年崩盤那樣，讓如此多人、在如此長的時間裡憂慮煎熬，1929年以後出生的人也為它受苦，甚至1929年後出生者的下一代還受它拖累。


    美國安然度過革命戰爭和南北戰爭、兩次世界大戰、韓戰、越戰，以及許多次較小的致命衝突。美國也度過芝加哥大火、舊金山地震和大火、洛杉磯地震，加上無數次較小的地震和數十次或大或小的颶風。美國熬過傷寒瘟疫、肺結核大流行、小兒麻痺大流行、乾旱、水災、暴動、罷工以及情人節大屠殺，但我們尚未擺脫1929年股市崩盤的陰影。


    那是歷史上危害最大的集體恐慌，它讓數百萬名美國人至今仍不敢購買股票和從中獲利。許多人腦子裡仍潛藏股市正邁向另一次崩盤、將掃盡所有人畢生積蓄的恐懼，唯恐把錢投入其中將落得流落街頭、身裹舊毛毯、睡在遊民收容所、吃冷豆子、賣蘋果和鉛筆的下場。1930年代的人就是這麼說的：「喬大叔要出去賣蘋果和鉛筆了。」那在當時是個大產業。


    當然，以後可能再發生股市崩盤。1987年就發生過一次，在1981-82年有過一次小崩盤，1973-74年有另一次大的，但股市最後都再度回升，沒有一次例外。往好處看，崩盤正是低價買進股票的大好機會。


    崩盤最大的問題是，股票要花多久的時間才會回升。道瓊工業指數在1972年突破1,000點，十年後一度跌回800點以下。投資人的耐心在這段期間大受考驗，但這次考驗不像1929年崩盤後那樣嚴酷。1929年崩盤後花了近二十五年的時間許多股票才回漲，等了那麼久後，許多人已厭倦等待，並發誓絕不再買任何股票。


    但股市回升緩慢不能怪罪崩盤本身，而是與大蕭條（Great Depression）有關。大蕭條之所以稱為「大」，是因為其引發的經濟倒退、社會遭受衝擊的規模之大為歷來僅見。


    在持續約十年的大蕭條期間，資金極為短缺，就業機會稀少。商店

