    然後你看到應收帳款（Accounts Receivable）為19,500美元，這表示巴克萊的部分顧客買了「介面」，但還沒有支付帳款。19,500美元是公司還沒有收到的錢——所以是應收帳款。這是顧客欠公司錢的總金額。


    接著我們來到庫存為3萬美元，這表示價值3萬美元的「介面」還堆在巴克萊的車庫，等著被賣出——包括用來製造更多「介面」的零件。未賣出的商品被算成資產，雖然不保證巴克萊一定能以一般價格賣出這些。


    再看不動產、廠房與設備，你注意到減累計折舊金額為1萬美元。巴克萊已注銷價值1萬美元的機器。他花了5萬美元買這些機器，但現在記載在帳冊上的價值只剩4萬美元，因為他擁有的這種機器會很快過時，國稅局允許他每年注銷20%的價值。最早記載在不動產、廠房與設備項目下5萬美元支出的20%，就是1萬美元。


    在負債部分，我們發現應付帳款下的1萬美元。如果應收帳款是別人欠巴克萊的錢，應付帳款就是巴克萊欠別人的錢。它代表所有他還沒支付的帳單：電話費、電費、供應商的貸款等等。


    在負債底下的權益項目，你看到保留盈餘4,500美元。這就是盈虧的結果——巴克萊從第一年營運就獲利。公司現在擁有權益為10.45萬美元。這包括巴克萊初始投資的10萬美元，加上第一年的公司盈餘4,500美元。


    巴克萊可以選擇如何處理他的獲利，他可以把4,500美元藉由發放股利放到自己的口袋裡。不過，他沒這麼做，而是把它留在公司，以便有額外的錢可投資在讓公司成長，所以我們稱這筆盈餘是「保留」盈餘。


    這筆盈餘加上他初始的10萬美元，讓巴克萊的公司現在價值10.45萬美元——這是第一年年底時的權益。由於巴克萊發行1萬股股票給自己，所以現在每股價值為10.45美元，10.45萬美元除以1萬股，這稱作公司的「每股權益」（equity
    per share），或「帳面價值」（book value）。


    進入第二年以後，數字顯示電腦說公司已擴張業務，銷售更多「介面」，應收帳款和庫存持續增加。在第二年，另一項因素加進負方：12.1萬美元的銀行債務。這一次不是巴克萊借這筆錢，而是由公司借款。電腦說公司需要資金擴張營運：買新機器、更多庫存、新員工等。


    你是否注意到銀行債務未被納入資產負債表底下的權益？當銀行借錢給公司，銀行並未成為業主。買公司債券的人也不會成為業主。巴克萊仍然擁有全部10萬股股票，在經過兩年的保留盈餘後，他的權益增加到11.45萬美元。


    電腦說公司到第五年底已完全改觀，公司擁有18萬美元現金，加上其他流動資產，總值達到74.45萬美元。在流動資金下的不動產、廠房與設備中，我們發現巴克萊已增加他的資本支出，因為他的廠房和設備總值已從第二年年底的12萬美元，激增到第五年底的50萬美元。


    花了這麼多錢，他一定已經離開他的車庫，在別處蓋了一座小工廠，並添購最新的機器。在他購買設備時，他的折舊也隨之大幅增加。


    不同類型的公司需要不同水準的資本支出，例如鋼鐵廠的支出極其龐大，維護和升級要花很多錢。油井一旦鑽出油後，就只需要很少的資本支出。廣告公司幾乎沒有資本支出，他們只需要一間辦公室和幾張桌子。


    巴克萊需要的資本支出比鋼鐵廠少得多，但比起其他預算，資本支出仍是消耗許多資源的主要項目，這是他從事之高科技硬體業的特性。


    在負債部分較下方的項目中，我們看到巴克萊已償還他的銀行債務，因為到第五年底，債務已變回零。你會想，他償債的錢從哪裡來的？你在權益這個項目將找到答案。投入資本已從10萬美元躍增到70萬美元。巴克萊已發行並出售部分股票。注意到發行在外股份的改變嗎？以前是1萬股，全由巴克萊擁有；現在是1.5萬股。


    另一個投資人加入投資！在投入資本項目中可以找到。看到70萬美元的數字嗎？我們知道巴克萊一開始投入10萬美元，所以這個新投資人支付60萬美元買5,000股新發行的電腦說公司股票。新投資人擁有這家公司的三分之一股權。


    拜這筆迫切需要的資金挹注所賜，在第五年年底的每股權益已激增至59.63美元；或者也可以說，電腦說公司現在的帳面價值為每股59.63美元。這表示巴克萊自己的1萬股現在的價值為59.63萬美元。他的初始投資10萬美元以及辛勤工作所付出的心血，已經開花結果。


    為什麼那位神秘的投資人願意冒險投資60萬美元，支付每股120美元買巴克萊的公司股份？因為他看到巴克萊截至目前的優異表現，並認為銷售和獲利的成長將繼續。這家每年規模成長超過一倍的小公司，未來潛力無窮。


    你可以自己從損益表中的每股收益追蹤盈餘：第一年結束時的0.45美元，第二年結束時1美元，第五年結束達到6美元。神秘投資人支付每股120美元，買第五年每股盈餘6美元的公司股票。


    以股價120美元除以盈餘6美元，我們得到本益比price/earnings ratio，又稱價盈比為20倍。今日紐約證交所的平均本益比為15到16倍，所以這位神秘投資人購買電腦說公司股票的價格，略高於一般投資人買上市公司股票的平均價格。他這麼做是因為他知道快速成長的小公司潛力很大。他知道這很冒險，但如果一切順利，他認為電腦說公司將來有機會上市，這檔股票將變成一支10壓打、20壓打或50壓打，他的投資將回報好幾倍。


    如果巴克萊有選擇，他不會出售公司的三分之一股權。他這麼做是因為他需要錢擴張公司，支應維持庫存的成本、承擔應收帳款和支付薪資。他的成功製造了現金短缺，出售股票是籌措現金最簡單的方法。


    透過釋出三分之一的電腦說公司股票，他確保公司得以生存。他認為擁有一家資金充裕企業的67％股權，好過獨資擁有一家現金短缺、無法施展潛力的公司。


    幾年之後，巴克萊將達到需要更多錢的階段，那可能是上市的絕佳時機。在那之前，巴克萊為了追尋他的寶藏而做出重大犧牲。他放棄「真正的工作」，把全部時間投入在自己的公司，只領剛好足以維持基本生活的最低薪資。他用房子抵押二胎貸款的錢做初始投資，所以他的房貸負擔比以前更高。他忙碌到沒有時間休假，也沒有多餘的錢花在度假上。


    巴克萊的妻子加班做她的工作，以便儘可能支付家裡的開銷。他們兩人都在家吃飯，避免上昂貴的餐廳。他們不像過去那樣每隔四年買一部新車，現在一直開一部舊車。生活水準大幅下降，但兩人都默默忍受。巴克萊的妻子和他一樣，對電腦說公司充滿信心。


    讓我們回到數字的主题，再來看損益表。我們看到公司內部營運的細目：賺了多少錢，以及錢怎麼花掉。在第一年的銷貨收入項目下，我們看到電腦說公司出售價值20萬美元的「介面」。同時，留在公司存款帳戶的現金賺進2,500美元的利息。

    '
