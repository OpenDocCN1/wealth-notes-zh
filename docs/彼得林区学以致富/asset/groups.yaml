  md: "\n## 損益表（營運狀況表）\n\n| | 第1年 | 第2年 | 第5年 |\n|---|---|---|---|\n| 銷貨收入 | 200,000\
    \ | 400,000 | 1,900,000 |\n| 利息 | 2,500 | 1,000 | 10,000 |\n| 淨收入 | 202,500 |\
    \ 401,000 | 1,910,000 |\n| 成本 | | | |\n| 原料與製造勞動成本 | 110,000 | 204,000 | 1,000,000\
    \ |\n| 銷貨及一般總務與行政成本 | 55,000 | 111,000 | 448,000 |\n| 研發支出 | 20,000 | 40,000 |\
    \ 210,000 |\n| 折舊 | 10,000 | 24,000 | 102,000 |\n| 利息支出 | — | 6,000 | — |\n| 總成本\
    \ | 195,000 | 385,000 | 1,760,000 |\n| 聯邦及州稅前盈餘 | 7,500 | 16,000 | 150,000 |\n\
    | 稅（40%） | 3,000 | 6,000 | 60,000 |\n| 淨利 | 4,500 | 10,000 | 90,000 |\n| 發行在外股份\
    \ | 10,000 | 10,000 | 15,000 |\n| 每股淨利 | 0.45 | 1.00 | 6.00 |\n\n以電腦說公司第一年總收入是20.25萬美元。用會計的術語來說，這些總收入稱為「淨收入」（Net\
    \ Revenues）。\n\n在淨收入下面，我們看到大部分淨收入被花在哪裡。這是成本（Costs）部分，有原料成本和製造勞動成本，還有企業營運和促銷產品牽涉的銷貨及一般總務與行政成本（selling,\
    \ general, and administrative costs, SG&A）。\n\n在第一年，你也會注意到巴克萊花了2萬美元在研發上。他嘗試改善「介面」，以提升競爭力，避免被競爭者趕上。\n\
    \n並非所有公司都像電腦說公司有那麼多支出。這是你投資任何股票都必須先考慮的事：這是一個資本密集的事業嗎？它需要龐大資金來供養銷售團隊和研發部門嗎？如果是，許多原本可以落入投資人口袋的錢得花在支出上。\n\
    \n如果你投資一家採砂石公司，研發的成本將是零，因為公司不需要改進砂石的品質，以跟上科技進步。此外，銷售成本也會很低，因為公司不需要僱用複雜的銷售團隊來行銷砂石。\n\
    \n同樣的，在一家擁有連鎖漢堡店的公司，研發部門會很小，因為要改善漢堡很困難，而銷售人力的薪資可以很低，因為銷售漢堡不需要高學歷。\n\n在巴克萊的行業，僱用低薪的銷售人力可能付出沉重代價，他需要受過訓練的人手，能瞭解「介面」，可以向企業買主和電腦零售商店解釋他的產品。\n\
    \n巴克萊的一部分資本支出，和他所有的研發支出，都是所謂的「自由裁量性」（discretionary）支出。這表示他不一定得花這些錢，他沒有義務做研究或更新他的機器。\n\
    \n任何公司的主管都必須決定該花多少錢在改善和研究上，以及公司沒有這些改善能否過得下去。執行長和公司主管們必須隨時做這類調整。如果他們吝於研究、或不更新工廠和機器，就得冒著被推出更好產品、以更低成本生產的競爭者摧毀的風險。另一方面，如果他們削減資本和研發支出，短期內盈餘將大幅上升。\n\
    \n在大部分情況下，盈餘提高會提振股價，讓股東開心。不把錢花在升級和改善上，公司就能發放豐厚的紅利，讓股東更快樂。但如果公司喪失優勢，被競爭者搶走生意，這種快樂將難以持久。公司銷售將下降，盈餘跟著滑落，股價也會下跌。很快的，紅利就發不出來了。\n\
    \n藉由刪除研究和資本支出，巴克萊可以投機取巧，獎賞自己豐厚的紅利。藉提振短期盈餘，他可以讓公司更賺錢，吸引買家收購他持有的其餘股份。他可以賣光持股，每天打高爾夫球享清福。\n\
    \n但和很多你在第四章讀到的英雄一樣，巴克萊抗拒了賣掉公司的誘惑。他維持資本支出和研發支出的水準，因為他相信公司未來的發展前景。終有一天，當電腦說公司變成1億美元的事業時，他可以賣掉股份，買兩座高爾夫球場和一架噴射機。但他可能不會這麼做。他會忙著想辦法讓電腦說公司變成一家2億美元的事業。\n\
    \n在研發支出下面，我們看到已經介紹過的折舊。我們也提過，在第一年，巴克萊可以認列1萬美元的折舊，列為成本之一。不久後，巴克萊的設備將變得過時，他必須花1萬美元取代它，這就是政府允許公司扣抵折舊的原因。替換機器、工廠等成本是一項將來必須支付的企業支出。\n\
    \n下一站是聯邦及州稅前盈餘（Earnings Before Federal & State Taxes）。我們看到電腦說公司第一年在繳稅前的盈餘有7,500美元。許多人抱怨國稅局的個人所得稅率太高，但公司也得繳納很可觀的稅。在7,500美元的盈餘中，電腦說公司必須繳納40%的稅給政府，大約是3,000美元；剩下來的就是損益表中4,500美元的淨利（Net\
    \ Income）。如果公司不發放股利（電腦說公司就不發放），「淨利」就和「保留盈餘」相同，用一般人的說法，那就是「獲利」。\n\n電腦說公司成長很快，各項數字都迅速攀升，到第五年年底，公司銷售的「介面」已接近200萬美元，原料和勞動支出達100萬美元，研發支出為21萬美元。年度研發預算現在已是巴克萊當初投資公司時的兩倍多。電腦說公司一年的獲利達9萬美元。\n\
    \n現金流量表（Cash Flow Statement）協助你追蹤錢從一個地方移往另一個地方。第一年的淨利4,500美元再度出現在資金（Funds）這部分，同時折舊的1萬美元消失。加上巴克萊購買初始1萬股股票的10萬美元，還有應付帳款增加1萬美元，總資金來源（Total\
    \ Sources of Funds）一共是12.45萬美元。\n\n資金運用（Use of Funds）詳細交代更多支出：巴克萊花5萬美元在廠房設備；3萬美元在庫存；1.95萬是應收帳款。當你把現金流入的12.45萬美元，減去現金流出的9.95萬美元，剩下2.5萬美元，這就是從第一年資產負債表第一行出現的現金（Cash）。這種項目的對稱對會計師來說十分重要。\n\
    \n恭喜！你已經完成史上最簡短的會計課程。現在你已經有了基礎的認識，可以開始看真正的年度財報，你將開始瞭解其中的許多數字了。\n\n## 現金流量表\n\n\
