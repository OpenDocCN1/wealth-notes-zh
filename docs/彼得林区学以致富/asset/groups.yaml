  mdcn: '

    漸開始創立自己的事業。


    各式各樣的公司在18世紀初開始建立，獨自開業或與人合夥的商人很快發現成立公司的好處。過了不久，在美國獨立後，美國人接受公司概念的速度還遠比歐洲人迅速。沒有其他主要工業化國家——英國、法國、德國或日本——像美國那樣創立如此多的公司。


    事實上，有數家在近三百年前創立的公司至今還在營業！當你想到這期間經歷的戰爭、恐慌、蕭條和其他美國曾發生的災難時，你不得不讚嘆這是很了不起的事。許多世代來了又去，產品流行後又褪流行，城鎮燒毀、森林被砍伐、街區被拆除，很少有東西能從18世紀初留存到今日。但當年生產馬鞌的羅茲父子公司（J.E.
    Rhoads & Sons），從1702年屹立至今。


    如果不是1860年代有幾位聰明的經理人，羅茲父子公司早就可能消失了。他們看到鐵路興起，發現製造馬鞌在沒有馬車的世界沒有前途，於是重新改造工廠，開始生產輸送帶。


    德斯特公司（Dexter Company）1767年在康乃狄格州溫瑟洛克斯（Windsor Locks）是一座磨坊，兩百多年後仍舊生意興隆，但已經不做磨坊生意了。和羅茲父子一樣，它因為反應靈敏的經理人懂得與時俱進而得以長久生存。當磨坊產業逐漸沒落時，德斯特放棄磨坊，開始生產文具，後來又從文具轉變為生產茶袋，從茶袋再轉進膠水。今日這家公司為飛機生產高科技塗料和黏劑。


    巴爾的摩的蘭德雷斯種籽公司（D. Landreth Seed）從1784年靠蔬菜種籽生存至今。它販賣種籽給住在維吉尼亞莊園的傑佛遜（Thomas Jefferson），兩百多年後，它仍然販賣種籽給傑佛遜的莊園。如果一家公司生產絕不褪流行的好產品，它的生意就能長保興盛。


    由於這些早期的公司沒有一家是上市公司，人們無法擁有它們的股票。（德斯特公司在1968年、201歲生日時上市。）在美國革命當時，沒有一家本土上市公司。最早的本土上市公司出現在革命後，稱為北美銀行（Bank
    of North America），創立於1781年。紐約銀行（Bank of New York）創立於1784年，是最早在紐約證券交易所（New York
    Stock Exchange）交易的股票，至今仍在那裡掛牌。


    波士頓銀行（The Bank of Boston）跟隨紐約銀行之後上市，合眾國銀行（Bank of the United States）也不遑多讓，這家銀行的主要目的就是想辦法償付革命戰爭留下的債務。


    殖民時期的美國沒有銀行，因為英國當局不准它們設立。美國在革命後矯正了這個問題，但即使如此，聯邦政府資助成立一家銀行仍然經歷許多波折，許多開國元老——特別是傑佛遜——不信任銀行家和他們的紙鈔。


    美國最早期的股東和他們的歐洲前輩一樣，也支付太多錢購買銀行股票，而且他們對自己買的東西所知極少。買價愈喊愈高，直到價格漲到荒謬的程度，然而在華爾街，任何會漲的東西永遠也會下跌。銀行股在1792年的崩盤中墜落地而，那是華爾街歷史上第一次崩盤。一等塵埃落定，紐約州議會便通過一項類似倫敦曾通過的法律，規定股票買賣是犯罪行為，導致股票交易潛入地下。


    這對一個年輕的國家是很好的教訓，也很值得今日年輕投資人借鏡。當你成為一家公司的股東後，只有公司成功你才賺得到錢，但大部分公司無法成功，這就是買股票的風險：你持有股票的公司最後可能一文不值。人們正是因為承擔這種風險而能獲得豐厚的報酬——如果他們選對投資的公司。


    投資人很慶幸擁有在麻州查爾斯河（Charles River）興建那座橋樑的公司。漢考克（John Hancock）是那家公司的創辦人之一，而查爾斯河橋股票的銷售則在1786年邦克山戰役紀念日（Bunker
    Hill Day）11週年那天舉行。當時有遊行過橋的儀式，還發射禮砲，接著是招待83名原始股東的盛大餐會。那是一個充滿歡樂的場合，接著是許多歡樂的年頭，投資人年年收到股利。


    穩定的股利來自向過橋者收取的費用。使用這座橋的顧客可不像投資人那樣快樂，後來第二座跨越查爾斯河的橋蓋了起來，叫華倫橋（Warren Bridge），開始與第一座橋競爭。當時的計畫是等收到足夠償付第二座橋成本的過橋費後，就準備取消過橋費，讓人們可以免費過橋。但第一座橋的股東反對這項計畫，於是提出一直纏鬧到最高法院的訴訟。結果他們輸掉這個案子，坐收厚利的獨占事業也從此告終。


    另一個效法查爾斯河橋模式的成功公司，是賓州的蘭卡斯特收費公司（Lancaster Turnpike）。蘭卡斯特發售股票，並且支付不錯的股利。同樣的，股利來自收取費城到蘭卡斯特間60哩公路的通行費用。這條公路的顧客和查爾斯河橋的過橋人一樣不怎麼喜歡付費，但他們寧可付費而不願駕著輕便馬車穿越田野和樹林。


    收費公路、橋樑和運河公司，是後來興起的電車、鐵道和地下鐵公司的先驅。


    ## 金融制度之父


    我們都認得華盛頓（George Washington）是美國國父，但少有人知道漢密爾頓（Alexander Hamilton）是金融制度之父。歷史書漏記了這部分，但若沒有金融制度，政治制度將無法運作。漢密爾頓功不可沒，他比較聞名的事蹟是差勁的槍手，輸掉了與布爾（Aaron
    Burr）的決鬥，但實際上他是個精明的經濟規劃者，也是紐約銀行的創辦人之一。


    漢密爾頓知道國家沒有錢無法長治久安，而要有錢就必須設立銀行。這在今日看來是常識，但在當時，銀行是一個備受爭論的議題。


    華盛頓同意漢密爾頓有關銀行的主張，甚至自己投資了一家銀行。華盛頓是亞力山卓銀行（Bank of Alexandria）的股東，開設的地點就在他位於弗農山（Mount
    Vernon）的家附近。但許多重量級人士反對漢密爾頓的想法，尤其是傑佛遜。傑佛遜是一位農戶紳士，他堅信靠耕作田地維生是一種美德，厭惡工廠和跟隨工廠滋長的都市。對傑佛遜來說，銀行是萬惡的根源，尤其是政府的銀行。


    結果證明，傑佛遜不是個人理財的專家。他經手大筆的財富，但1826年過世時幾乎破產。他出手闊綽，尤其花費許多錢購買器具和書籍，其私人圖書館的藏書比哈佛大學還多，而哈佛早在傑佛遜出生前一百多年便已創立。他是思想家、書蟲、打從心裡是個農夫——把農田工作交給別人的紳士農人。


    傑佛遜希望美國變成牧草和麥田之國，由獨立的「自耕農」掌控地方政治，並在公共事務上有最大的決定權。他拒斥歐洲人對政府應由傲慢的貴族統治階級掌管的觀念。


    傑佛遜絕沒料到的是，工廠將吸引數百萬農場工人離開農場，遷入都市和工廠小鎮，並且重工業儘管帶來許多問題，卻提供美國人過著人類有史以來最高水準的生活。如果沒有龐大的資金投入道路、運河、公路、橋樑、工廠的建設，這一切都不會發生——而這些錢來自何處？傑佛遜最怕的銀行！


    儘管有傑佛遜的反對，第一家美國銀行（Bank of the United States）在1791年獲得國會批准設立，並設法存活了二十年。直到1811年，一群國會的銀行反對者拒絕延長銀行營業的特許，迫使這家銀行關門。


    第二家美國銀行在1816年獲准營運，這一次設在費城。但數年後傑克遜（Andrew Jackson）當選總統後又碰上問題。傑克遜出身自田納西州荒野之地，個性粗獷，人們戲稱他為「老山胡桃木」（Old
    Hickory），因為他高大如一棵樹（六呎一吋，在當年算是相當高大），皮膚粗硬有如樹皮，從小住在木屋長大。儘管有愛好戶外生活的名聲，傑克遜卻經常生病，必須留在戶內。和他的前輩傑佛遜一樣，傑克遜認為各州應擁有較多權力，而聯邦應該少些。


    第二家美國銀行被指控是1819年全國性金融恐慌的肇因，當時許多企業破產，人們損失畢生積蓄和丟掉工作。（這是後續一連串恐慌的第一個，美國各地都受創深重。）西部的農民加入東部的工廠工人，反對這家「怪獸銀行」，宣稱這是引發恐慌的罪魁禍首。


    因此當傑克遜在恐慌十年後當選總統時，他聽從這些人的話，把聯邦資助銀行的錢抽走，分別存進各州的銀行，第二家美國銀行因而被迫關門。從那時起，各州便控制銀行業務，並核發執照。不久後，良莠不齊的商人就紛紛開起銀行來了。


    數千家銀行從大城和小鎮的大街小巷冒出，就像今日的速食店到處開張的盛況。而由於這些州級銀行都可以發行自己的紙鈔，商務的秩序變得極其混亂，因為跨州交易很難決定各州貨幣的價值，許多商家完全不接受別州發行的紙鈔。在國內旅行猶如今日到海外旅行，你必須操心在各地兌換貨幣的問題。


    美國在這方面的發展和歐洲大不相同。歐洲向來有幾家銀行，各有許多分行，而美國則有極多不同的銀行。至1820年，美國有300家不同的銀行，相較於英國只有寥寥數家。今日若把各種儲貸機構和信用合作社算進去，美國有超過1萬家銀行，而英國則不到15家。


    許多美國的地方銀行資金微薄，在遭遇經濟危機時缺少度過難關所需的資本，而危機總是隨時可能發生。1810年到1820年間開張的銀行，有半數在1825年已經倒閉；1830年到1840年間開始營運的銀行，也有半數到1845年已經關閉。當你把錢存入銀行後，你的存款不像今日有保險，因此當銀行倒閉時，人們的儲蓄帳戶或支票帳戶便失去保護，所有錢隨之泡湯。換言之，存款毫無保障。


    銀行是存錢的危險地方，這並未阻止美國人把畢生積蓄存進銀行。


    銀行則拿這些錢放款給橋樑和運河的興建者、給收費公路計畫和鐵路計畫，因而促進美國的繁榮。當銀行把錢借給鐵路、橋樑公司或鋼鐵公司時，這些錢都來自銀行儲蓄帳戶的存款人。


    換句話說，所有這些帶來經濟進步的企業活動和計畫，都由街上男男女女口袋裡的錢所資助。


    當政府要推動一項計畫時，它有四個獲得財源的選擇：徵稅、向銀行貸款、出售彩券，或發行債券。（後面章節將進一步討論債券。）當公司需要錢時，它可以向銀行借錢、銷售債券，或發行股票。但在19世紀上半葉，股票是公司的最後選項，銷售股票給大眾的觀念發展十分緩慢。


    ## 現代經濟學之父


    市場在各地成立，人們積極從事買賣，對許多人來說，整個情況似乎已經失控。歷史上從沒有過如此眾多的個人被允許自由活動，並為自己的利益工作。這一切看起來毫無秩序和規則。


    這就是經濟學家出頭的時候，他們是新品種的思想家。過去數千年來，宗教哲學家嘗試參透人類如何依照上帝的旨意過生活。他們辯論政治、最好的政府形式，和領導人應該是什麼樣子。但個人擁有為自己追求財富的自由時會發生什麼事，則要由經濟學家來說明。


    最早和最聰明的經濟學家之一，是名為亞當．史密斯（Adam Smith）的蘇格蘭人，在他生活的美國革命時代被人看作一個書呆子。史密斯逃避宴會和野餐，寧可留在家思考和寫作。他如此專心於自己的想法，以致於以健忘聞名於同儕。他的偉大著作名為《國家財富的性質與原因研究》（*An
    Inquiry into the Nature and Causes of the Wealth of Nations*），今日被簡稱為《國富論》（*The
    Wealth of Nations*）。


    《國富論》出版於1776年，剛好是美國宣布獨立那年，可惜史密斯並未因這本著作而受肯定。他應該和洛克（John Locke）、富蘭克林（Benjamin Franklin）、潘恩（Thomas
    Paine）和其他主張政治自由是社會公平、和平與和諧關鍵的革命性思想家，享有同樣崇高的歷史地位。其他人並沒有告訴我們如何支付帳單——但史密斯提供了解答。他告訴我們什麼是經濟自由。


    史密斯說，當每個人從事各自選擇的行業時，整體社會的生活會更好，勝過國王或中央規劃者掌控大權、支配誰該做什麼事。他的論點在今日看來幾乎沒有人會反對，但在1776年是一個新奇的概念：數百萬人製造並銷售任何他們自己選擇的東西、各朝自己的方向同時前進，如此就能創造出一個井然有序的社會，在其中人人都有衣服可穿、食物可吃、房屋可住。如果100個人中有99人決定製造帽子，只有一個人決定種蔬菜呢？國家將被帽子淹沒，而大家都沒有蔬菜可吃。但這就是看不見的手來解救大家的時候。


    當然，不是真的有一隻看不見的手，而是史密斯想像在幕後運作的一股力量，會確保剛好有正確數量的人種植蔬菜、有正確數量的人製造帽子。他真正的意思是，供給和需求會保持產品和服務的平衡。例如，要是有太多帽子製造商生產太多帽子，帽子就會在市場堆積如山，迫使帽子銷售商降低價格。降低帽子價格會讓部分帽子製造商退出帽子事業，轉進較有利可圖的行業，例如種植蔬菜。到最後會出現剛好足夠的蔬菜農戶，和剛好足夠的帽子製造商，生產剛好數量的蔬菜和帽子。


    真實世界的運作並沒有這麼完美，但史密斯當時就已了解自由市場運作的基本原則，且這些原則直到今日還在運行。每當有一種新產品的需求，例如電腦，就有愈來愈多公司跨入這個行業，直到生產出太多電腦，商店不得不降價求售。這種競爭對你、我和所有消費者都很好，因為這迫使電腦製造商改進它們的產品和降低售價。這是它們每隔幾個月就推出更新奇的新機型、售價又比笨重的舊機型便宜的原因。如果沒有競爭，它們可以繼續銷售笨重的舊機型，消費者拿他們毫無辦法。


    看不見的手讓從泡泡糖到保齡球等所有東西的供給和需求保持平衡。我們不需要國王、國會或生產部長來決定要生產什麼東西、每一項產品數量多少，以及誰應獲准開工廠。市場會自動做出所有決定。


    史密斯也發現，想獲取最大利益是一種好的衝動，而非數百年來宗教領袖和輿論製造者嘗試消滅的壞事。他指出，自利並非完全只對自己有好處，它能激勵人們實事求是地把任何事做到最好。它促使人們發明東西、勤奮工作，把額外的努力投入手上的計畫。想像如果人們不准從自己的才能賺錢、成功不能獲得獎賞，那麼我們的社會將充滿無能的木匠、水管工人、醫生、律師、會計師、銀行家、祕書、教授、中外野手和四分衛。


    史密斯說，「累計定律」（law of accumulation）會把自利轉變成所有人的生活都獲得改善。當一家企業的業主變富有，他或她就會擴張事業，僱用更多人，進而使每個人變得更富有，其中有些人會自行創業，如此循環不已。這表示資本主義會創造機會，不像封建農業體制只有少數人擁有土地，並由家族繼承，如果你生來就是農民，你將一輩子過著身無恆產的生活，你的兒孫也將永遠困在同樣的窮苦生活中。


    在史密斯寫這本書的時代，和緊接著的一世紀間，偉大的思想家嘗試找尋一切事物的定律。科學家已經發現許多物理定律，如重力定律、天體運行定律，以及一些化學反應的定律。人們相信宇宙的運作呈現某種秩序，而如果行星如何移動和蘋果如何掉落樹下都有定律，那麼一定也有企業的定律、政治的定律，以及人們在不同情況下如何行為的定律。舉例來說，一旦想出錢如何流通的公式，你就可以正確地預測最後誰能得到多少錢。


    宣稱有一種供給與需求的定律、或錢如何流通的定律是一回事，但找出如何精確計算它的公式則是完全不同的事。經濟學家不斷嘗試、想出各種新理論，從紛亂的市場去蕪存菁，以便找出單一的方程式。


    ## 第一個百萬富翁


    根據記錄，殖民時代的北美洲沒有百萬富翁。麻州薩冷（Salem）的德比（Elias Hasket Derby）是一位拒絕介入奴隸貿易的遠洋商賈，他是當時最富有的人。今日他的房子屬於國家公園局，且開放給大眾參觀。那裡距離霍桑著名的小說場景七角樓（House
    of Seven Gables）只有數百碼。大家都知道霍桑是誰、卻很少人聽過德比，由此可見人們重視文學和金融的相對程度。


    往南數百哩有位巴爾的摩商人奧利佛（Robert Oliver），也累積了相當龐大的財富；不過，在革命以後，美國最富有的人據說是莫里斯（Robert Morris）。


    莫里斯建立一個買賣船隻的企業聯合集團，他的船往返於西印度群島和歐洲，運送菸草和食物到歐洲，然後帶回衣服和製造業產品到美洲。他是一個秘密委員會的主席，供應大衣、長褲、襯衫和火藥給革命軍，他旗下的公司獲得供應軍隊的合約。莫里斯變成邦聯條例（Articles
    of Confederation）下的財政總管，熱烈擁護漢密爾頓和他創立的第一家美國銀行。


    莫里斯相信國家應該交給上等人來管理。他認為像他自己這種紳士最優秀，且深信不疑。他完全反對傑佛遜主張的獨立小農戶是美國的骨幹、應該擁有投票權。


    莫里斯和後世許多追隨他的傑出個人利益追求者一樣，藉由從銀行借來的錢建立他的帝國。他有許多居高位的朋友，而且因為他最大的顧客是軍隊，我們可說他是最早的大型國防承包商。


    莫里斯也像川普（Donald Trump）這類現代個人利益追求者一樣，過度擴張自己，所借的錢超過其償付能力。當時船運業出現不景氣，導致他的金融帝國崩潰，莫里斯也宣告破產。


    在那個年代，宣告破產是很嚴重的事，因為欠錢不還是犯罪行為。莫里斯在費城的監獄關了三年，來探望他的人包括華盛頓。莫里斯在他的監牢發起廢除這種懲罰的運動，而拜他的努力所賜，現在還不起債的人已經不用進監牢了。如果現在還把欠債的人關在牢裡，那監獄應該會人滿為患，因為每年申請個人破產的美國人就有80萬人，大部分是刷爆信用卡所致。


    到了1815年，美國已有半打百萬富翁，主要靠船運和貿易致富。排名第一的是費城的吉拉德（Stephen Girard），他在1831年以82歲高齡去世，是當時美國第一富豪。


    吉拉德出生在法國，父親是船長。他少年時就出海，後來變成國際貿易商。他來到美國，投資土地、銀行股票和政府債券，而且這些投資都賺了大錢。吉拉德最後創立自己的銀行並加入聯合事業，與一位年輕的企業家阿斯特（John
    Jacob Astor）共同做生意。有關阿斯特我們稍後還會談到。


    吉拉德死時留下價值600萬美元的財產，在當時是一大筆財富，雖然這個金額在今日還不夠支付一位頂尖棒球明星一年的薪水。他把大部分錢捐給一所供男孤兒就讀的大學。吉拉德是堅定的無神論者，他厭惡宗教到在他的遺囑中註明，任何教派的牧師都不得踏足那所大學的土地。


    吉拉德的身價被阿斯特超越。阿斯特是德國移民，靠皮毛貿易起家，然後買下一艘船的部分股權，這艘船則往返中國從事貿易——中國是當時船運和貿易還能賺大錢的地方。阿斯特從一艘船擴張到二艘、三艘、四艘，最後他擁有一整隊被稱作剪刀船（clipper）的快艇。對美國人來說，建立這種船隊是很大的成就，因為那必須靠借貸才能完成；而美國的銀行比起英國等國家的銀行，可供借貸的資金十分有限。


    在歷史上的這段期間，錢都以貴金屬擔保，因此銀行可印製的鈔票數量，取決於它庫藏的黃金和白銀有多少。在倫敦，黃金的供應很充裕，所以銀行印製大量鈔票供企業大亨借貸。但美國的黃金和白銀供應量很少，因此銀行往往現金短缺，所以阿斯特和他的企業家同輩很難借到足夠的錢來進行他們的雄圖大略。


    當發現無法打敗競爭者時，阿斯特決定捨棄國際貿易，轉而專注於美國市場，且經營得有聲有色。到了1848年他以84歲高齡過世時，留下的財產價值超過2,000萬美元，大約是他的老朋友吉拉德留下財產的三倍。


    阿斯特的葬禮舉行後，所有的報導都在談論他留下的龐大財富，他的家族繼承了1,900多萬美元、只有50萬美元捐給慈善機構，引發群情激憤，一場全國性的辯論熱烈展開：如果
    你死後不能帶進棺材，誰應該獲得遺產？大眾認為阿斯特應該多留一點錢給整個社會、少留一點給家人，因為資本家應該為社會謀福利。


    這類辯論的熱度至今仍未稍減，所有人似乎都同意努力工作和力爭上游是好事，但對於賺得的錢該怎麼處理看法分歧。在今日，阿斯特不可能把95％的財富留給子女，因為他死後馬上會被課徵55％的遺產稅。現代的富人有另一類選擇：他們可以把錢留給私人慈善機構和基金會，包括大學、醫院、遊民收容所、愛滋病研究機構和食物銀行（food
    bank），如果他們不這麼做，政府將拿走大部分的遺產。

    '
