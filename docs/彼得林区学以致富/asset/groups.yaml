    公司可以把錢再投入營運，實際上就是投資自己。它用這些錢開更多商店或蓋新工廠，讓盈餘成長得更快。就長期來看，這對股東十分有利。快速成長的公司可能獲得20％的投資報酬率，遠高於把錢存在銀行的報酬率。


    或者公司可以把錢浪費在噴射機、柚木裝潢辦公室、大理石主管浴室、主管薪資比業界行情多一倍，或者以過高的價格併購其他公司。這種不必要的購買對股東不利，可能破壞原本很划算的投資。


    或者公司可以買回自己的股票，減少市場流通的股數，即實施所謂的庫藏股計畫。為什麼公司要這麼做？因為市場流通的股數變少，其餘的股票就更有價值。買回股票對股東很有利，尤其是公司以低價買回股票時。


