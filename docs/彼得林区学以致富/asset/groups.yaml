    買進迪士尼股票後的第二天，你匆匆打開報紙的商業版面，想知道它的股價是多少。這是每個持股人每天早上做的事，也是他們洗臉刷牙、穿上衣服並為自己倒上一杯咖啡後做的第一件重要的事。


    要分辨誰是投資人的方法之一是，看他們怎麼看報紙。投資人不像其他讀者先看漫畫、或運動新聞、或安・蘭德斯（Ann Landers）的專欄。他們會馬上打開商業版，搜尋股價行情表，看他們持有之股票昨日的收盤價。


    他們的心情可能在幾秒鐘內轉變，全看他們看到的結果是什麼。也許你已經在自己家裡看過這些。你坐在早餐桌前，你父親正在瀏覽股票行情表（通常是父親做這件事，但愈來愈多女性也對這感興趣）。如果他臉色變難看，並且第無數次告訴你別忘了關浴室的燈以免浪費電，你大概可以猜中他的股票下跌了。另一方面，如果他開始哼《向統帥致敬》（Hail
    to the Chief），並提議增加你的零用錢，或者說他會付錢僱大禮車送你參加學校舉辦的舞會，你可以篤定他的股票上漲了。


    在股票交易所開張的營業時間，股票以極快的速度換手，價格每一分鐘都在上漲或下跌。但在下午4時收盤時，交易停止，每一檔股票進行完當天最後一筆交易。最後交易的價格就叫做收盤價，也就是第二天早上報紙刊登的價格。當投資人打開商業版尋找行情表上的數字時，他們找的就是這個價格，它呈現類似以下的格式：


    | 365日高一低 | 股票 | 股利 | 收益率（%） | 本益比 | 成交股數 | 高 | 低 | 收盤 | 漲跌 |

    |---|---|---|---|---|---|---|---|---|---|

    | 62⁷⁄₈<br>37¾ | 迪士尼 | 0.36 | 0.625 | 23 | 11,090 | 57³⁄₄ | 56³⁄₄ | 57⁵⁄₈ | +¹⁄₄
    |


    許多資訊包含在這個小空間裡，股票名稱迪士尼出現在左邊第二欄，第一欄「365日高一低」有兩個數字，62⁷⁄₈和37³⁄₄，代表美元價格，一個是在過去12個月裡有人買賣迪士尼股票的最高價格，另一個則是最低價格。同樣一檔股票交易價格的區間可能很大。


    事實上，紐約證交所任何一年的平均股價上下波動大約是57%，更具體地說，每三檔在紐約證交所交易的股票就有一檔一年的價格漲跌為50%到100%，而有8%的股票漲跌超過100%。一檔股票可能在年初賣出為12美元，在樂觀的期間漲到16美元，並在悲觀期間跌到8美元。顯然有一些投資人在同一年買到同一家公司的價格，比其他人買到的便宜很多。


    你也會注意到股價是以分數報價，而不是常見的小數，因此37.75美元是以37³⁄₄美元呈現。這種舊式的數字源自西班牙人以八進位計算錢——這也是為什麼海盜電影的鸚鵡總是聒噪著說「八里爾銀幣」（pieces
    of eight，即每一枚值八里爾的銀幣）。


    華爾街保留了這種八進位計算法，所以你不會聽到某一檔股票今天「漲了10美分」，而會聽到漲「¹⁄₈點」；你也不會聽到人們說「漲25美分」，而是說「漲1/4點」。一點在華爾街等於一美元。


    從右邊的「高」、「低」、「收盤」和「漲跌」欄，可以概略看到昨日交易的情況。以這個例子來說，就是在這個特定的交易日，買賣迪士尼股的最高價是57³/₄美元，最低價是56³/₄美元，當日最後交易的價格是57⁷/₈美元，也就是每個人在報紙上尋找的收盤價，而它比前一個交易日的收盤價上漲1/4美元。


    緊鄰「股票」欄右邊的是「股利」。股利是一家公司回報買股投資人的方法之一。部分公司發放高股利，部分公司發放很少的股利，有些則完全不發放。本書後面章節還有談到更多有關股利的主題。


    這裡顯示的數字0.36代表「36美分」，是目前迪士尼的年股利——你擁有的每一股可獲得36美分。


    再右邊一欄為「收益率%」，這是有關股利的額外資訊，讓你可以拿來與儲蓄帳戶或債券的收益率做比較。這裡是拿迪士尼發放的36美分年股利，除以收盤價（57.625美元），結果是0.625%——如果你以目前的價格投資迪士尼，你可以從股利獲得的報酬率。


    0.625%是很低的報酬率，相較之下儲蓄帳戶目前的報酬率為3%。所以迪士尼不是一檔你只為了股利而買的股票。


    在「收益率%」右邊的一欄是「本益比」（P/E）。本益比是「價格一盈餘比率」（price-earnings ratio）的縮寫，把股價除以公司的年盈餘就得到這個數字。但你不必自己計算，因為本益比可以從每日的報紙上查到。


    當人們考慮是否購買特定公司的股票時，本益比幫助他們判斷股價是便宜或昂貴。每個產業的本益比差異很大，甚至每家公司的標準也不同，因此利用這個工具最簡單的方法是，比較公司目前的本益比和過去的紀錄。


    在今日的市場，股票的平均本益比約16倍，而迪士尼的本益比是23倍，比一般股票略高。但因為迪士尼過去十五年的本益比從12倍到40倍上下起伏，所以目前23倍就過去紀錄來看算很正常。迪士尼比一般股票昂貴，是因為該公司的績效向來很好。


    最後的「成交股數」是昨日在證交所盤中買賣的股數。這個數字要乘以100，所以11,090代表成交的迪士尼有約110萬股。知道這個數字不是很重要，但你可以了解股市的交易有多活絡。


    如果把三大主要股市（紐約證交所、美國證交所和那斯達克股市）的成交量加起來，每日的總交易股數達5億股。


    拜家用電腦和電子行情系統所賜，人們不必等明日的報紙就能查到股票價格。他們可以看電視上的行情，或從電腦得知一天的行情，甚至有透過衛星傳送資訊的行動式行情接收器，可隨時隨地查閱行情——在泛舟之旅、在遊輪上，或登山探險時。


    但這些科技都有一個缺點：它們會讓你過度專注於每日的漲跌。讓情緒隨股價上下起伏是一件極耗損精神的事，對你沒有任何好處。如果你是長期投資人，不管迪士尼今天、明天或下個月的上漲、下跌或保持平盤，都不值得操心。


    ## 擁有股票的額外好處


    股票十分民主，它們沒有偏見，不在乎屬於誰，不管是黑人或白人、男人或女人、外國人或本國人、聖人或罪人都一視同仁。它不像講究氣派的鄉村俱樂部，你得通過入會委員會審核才能加入。如果想買股票、成為你中意的上市公司的股東，那家公司也無法阻止你。一旦你成為股東，它們永遠不能趕你走。


    如果你只擁有一股迪士尼，你也與數百萬股的股東一樣擁有基本權利。你會被邀請參加年度股東大會，就在加州阿納海姆（Anaheim）最早的迪士尼樂園裡舉行，在那裡你可以坐在華爾街專業人士旁邊，聽迪士尼高階主管解釋他們的策略。你可以享用免費咖啡和甜甜圈，擁有投票決定重要事務的機會，例如由誰來當迪士尼的董事。


    右表是一些公司給股東特別優惠的例子，是持有股票之外的紅利。


    這些董事並非迪士尼的職員，也不向公司的主管負責。他們做策略性的決定，並監督主管的所作所為。公司是為股東而存在，而董事則代表股東的利益。


    上市公司的選舉採用一股一票制，因此如果你持有一股迪士尼，你的一票很難與擁有100萬股的股東相抗衡。儘管如此，公司對每一票都很重視，它知道大多數股東不能抽出空閒時間、遠道參加決定重大事務的年度股東會，所以會寄缺席選票給你。如果你忘記填寫寄出，他們還會寄給你提醒通知。


    一旦你不喜歡公司的管理團隊、策略或發展方向，隨時可以自由投出終極的否決票——賣出股票。


    一年有四次，你會收到報告卡，告訴你公司的狀況，銷售好不好，在上一期賺了或虧損多少錢。每年有一次公司會寄年度報告給你，詳細記錄一年的經營情況。大多數年度報告印在漂亮的紙上，有好幾頁的照片，一不小心就會把它們錯當成高檔雜誌。


