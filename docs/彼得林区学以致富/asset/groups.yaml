    組織、挽救美國淪入少數貪婪者手中。如果不是這些信託剋星的努力，美國人可能淪落到不比俄羅斯農民好過的境地。然後美國可能爆發一場類似俄羅斯革命的運動，還有隨之而來的類似悲劇。


    幸運的是，法院和政府都努力對抗信託。1890年，國會通過謝爾曼反信託法（Sherman Antitrust Act，又稱反托辣斯法案），但數家觸犯法令的大信託公司又藉著變身為「控股公司」、並遷移到新澤西州而躲過制裁。新澤西州在之前已通過州級法律，讓潛在的信託事業更容易組成控股公司，藉以規避聯邦法律。巨大的美國鋼鐵公司當時就組成控股公司。


