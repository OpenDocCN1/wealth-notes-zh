    的肥皂公司當推銷員。除了肥皂，這家公司也製造烘焙發粉，而為了促銷發粉，他們會免費贈送烹飪食譜。這種烘焙發粉大受歡迎，他們決定放棄肥皂業務。


    有一度他們停止贈送烹飪食譜，改送口香糖。這種口香糖又大受歡迎，所以他們又放棄烘焙發粉，改賣口香糖。


    瑞格理的荷蘭薄荷口香糖在1893年問世，但和可口可樂一樣，並不是一開始就大紅大紫。不過，到了1910年，它已經成了美國最受歡迎的品牌。1915年，為了進一步提振銷售，瑞格理寄給美國電話簿上登記的每個人一份免費樣品。


    # 康寶濃湯


    約翰·多蘭斯（John T. Dorrance）博士是個化學迷，他拒絕四所大學的教授職聘約，到他叔叔亞瑟（Arthur Dorrance）與康寶（Joseph
    Campbell）擁有的肥皂公司工作。多蘭斯發明製造濃縮肥皂的製程，然後買下他叔叔的股份，變成公司唯一的業主。顯然他叔叔做了一個錯誤的決定，因為康寶公司的盈餘繼續成長，到今日變成一家年營收114億美元的公司。


    多蘭斯在閒暇之餘是個狂熱的選股人，他聽從股票經紀人的建議，在1929年之前賣光他的股票。這是股票經紀人有史以來給過的最好建議。'
