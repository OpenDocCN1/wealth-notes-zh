    ## 附錄

    ## 解讀數字——

    如何看懂資產負債表


    如果一張照片勝過千言萬語，就企業來說，一個數字也有同樣功效。不管執行長在年度報告的文字說什麼，報告後面的數字可以對公司的行為做出完全、未加偽飾的解釋。如果選股變成你的興趣，你應該好好上一堂會計課。


    為了幫助你解讀數字，我們模擬一個範例，讓你認識典型的公司財務報告包含哪些內容。這家成立五年的假想公司叫「電腦說」（Compuspeak），我們先從介紹一個假想的人物巴克萊（Barclay）開始。


    巴克萊是矽谷的研究科學家，他利用閒暇開發一項新裝置「介面」（Interface），可讓使用者對個人電腦下達口語命令——例如「開」、「關」、「換視窗」或「拷貝到磁碟片」。他已經達到在自家車庫的代用實驗室（工廠）製造產品的階段，並且用自己的房子做二胎抵押貸款，以支付帳單。


    要說明故事的其他部分，我們直接來看後面列出的資產負債表（balance sheet）。資產負債表列出一家公司擁有的所有資產，以及所有負債，類似於你對自己的個性列出一張優缺點清單。我們稱它為資產負債（平衡）表，是因為兩邊永遠保持平衡，資產加起來，和負債加起來相同。通常一張資產負債表分成左邊和右邊，但在我們的範例資產負債表中，我們分成上面和下面。


    電腦說公司從巴克萊以房子抵押貸款10萬美元而誕生。他把這筆錢投資在他的新公司。在第一天，它顯示在資產負債表正方「流動資產」（Current Assets）項下的兩個地方：5萬美元現金（Cash），和5萬美元不動產、廠房和設備（Gross
    Property, Plant & Equipment）。巴克萊花5萬美元購買設備——用來生產產品的機器。這時他沒有廠房，因為他以自己的車庫權充工廠。


    這帶我們來到折舊（depreciation）這個項目。折舊來自工廠、辦公室、機器、電腦、桌椅等東西，會因逐漸老舊而喪失價值。美國國稅局容許企業在設備與建築過時或老舊時，扣除它們喪失的價值。


    未開發地不會折舊，但國稅局有一套公式計算從錄音機到日曬床等所有東西的折舊。建築物通常可以在二十到二十五年間全部折舊；機器、打字機、電腦等設備折舊期間短得多——三到五年，視項目而定。這是因為它們比建築物更快變舊。


    在第一天，你可以看到在不動產、廠房與設備項下沒有減累計折舊（Less Accumulated Depreciation），那是因為巴克萊沒有認列任何折舊。


    這就是正方——資產。現在我們看下半邊的「流動負債」（Current Liabilities），這部分是公司的負債。在第一天，電腦說公司沒有任何負債，因為巴克萊的10萬美元銀行貸款是個人貸款——他以自己的房子抵押貸款。公司的負債是零。


    在流動負債底下，你會看到權益（Equity）。公司以兩種方式獲得權益：出售公司股票，或從營運賺錢。在第一天，電腦說公司還未從營運賺任何錢——注意「保留盈餘」（Retained
    Earnings）是零——它唯一的權益是巴克萊投資公司的10萬美元。這是投入資本（Paid-in Capital）。


    在權益之下是負債與股東權益（Liabilities & Shareholder Equity），就是總負債、投入資本和保留盈餘的總和。接著你看到發行在外股份（Shares
    Outstanding）。當巴克萊投資初始的10萬美元在公司時，他發行1萬股股票給自己，因此每股價值10美元，顯示在第一天的帳面價值（Book Value）為10美元。這可由巴克萊任意決定，他也可以發行1,000股給自己，每股價值100美元。


    不管是巴克萊的公司或通用汽車，資產負債表記載的方式都相同。你可以一覽無遺看到正方——現金、庫存等等——以及負方是什麼。


    過了第一天以後，我們看到資產負債表繼續發展。讓我們看看第一年結束的情況，回到資產負債表的頂端。在流動資產下，你看到現金只剩2.5萬美元——巴克萊已把其餘的錢花在營運和製造產品「介面」上。


