    在260頁開始的「企業英雄」表中，你將發現一份把小公司變成大公司的英雄名單。這是就業故事很少被人傳述的一面。你已經知道大公司在1980年代裁撤約300萬個工件——1990年代也一樣多——但你聽過中小企業在1980年代創造約2,100萬個工作嗎？報紙很少報導這方面的事。


    沒有人精確地計算過小公司創造的就業，但我們確實知道1980年代有210萬家新事業開張。有些企業較大，有些較小，有些成功，有些失敗，但假設平均每家小企業僱用十個人，那就有2,100萬個新工作，是那些廣被報導的大裁員損失工作數量的七倍。


    這210萬家事業中，有一小部分極成功的事業最後變成上市公司，其中25家最成功的登上我們的英雄榜，它們崛起速度之快令人大為驚嘆。1985年，這25家公司加起來的營業額只有三百多億美元，不


    到埃克森（Exxon）的一半；IBM在1985年的盈餘是這25家公司盈餘的四倍。


    在當時，這25家小公司為35.8萬名員工提供就業，我們名單上所列的大公司則提供逾260萬名員工的就業機會。


    看看在十年間發生什麼事。當名單上的大公司在這段期間裁撤超過42萬個工作時，我們的小企業卻茁壯成巨人。在1995年，它們的總營收達到2,250億美元，總員工人数則接近140萬人，為勞動人口增加100萬個就業。


    在1975年，迪士尼合乎小公司的標準；今日它已變成大公司。華德。迪士尼是迪士尼故事的超級英雄；艾斯納則是英雄。迪士尼龐大的組織正要打瞌睡時，艾斯納適時把它戳醒。在舊時代，迪士尼會重新發行舊經典動畫，而且在艾斯納上台前，公司已不再製作新動畫。艾斯納掌舵下，公司推出《獅子王》（Lion
    King）、《阿拉丁》（Aladdin）和《美女與野獸》（Beauty and the Beast）等新動畫；變成劇情片的主要製片商；重振既有的主題公園和開設新主題公園；推出與電影同樣受歡迎的主題曲唱片，在音樂事業上旗開得勝；並推出商品行銷活動，把迪士尼的紀念品賣到世界各地的商店。


    玩具反斗城（Toys "R" Us）在1985年是一家中型企業，但今日銷售已超過吉列或高露潔，員工比固特異輪胎多2萬人。沃爾瑪是1985年最大的小公司，但今日其規模超越我們名單上除了埃克森以外的每一家公司。


    安進（Amgen）在1975年還不存在，到1985年它的員工還不到200人。今日它每年生產20億美元的藥品優保津（Neupogen）和依泊津（Epogen）。這些重要的藥品協助世界各地的病患之餘，也為安進在1995年賺進3億美元。安進故事中的英雄是拉斯曼（George
    B. Rathmann）和賓德（Gordon Binder）。


    然後是裘洛（Ross Perot）創立的電子資料系統公司（Electronic Data Systems, EDS）在1984年被通用汽車收購。裘洛曾為IBM工作，他嘗試說服IBM協助企業解決資訊處理問題，但IBM對此興趣缺缺，因此裘洛自行創立EDS。EDS在1975年銷售1億美元，1985年成長至34億美元，到1995年銷售已突破100億美元。裘洛從1986年就已退出EDS，但這家公司在他離開後仍大幅成長。對通用汽車來說，這實在是值回票價的收購。


    這告訴你英雄的重要性。IBM至少有二十年時間缺乏英雄的領導，這家支配市場的大公司在毫無防備的情況下，把資訊服務業務拱手讓給裘洛的EDS、把軟體業務讓給微軟、把微處理器業務讓給英特爾。另外，IBM原本排名第一的個人電腦銷售讓給康柏電腦，同時把一大部份大型電腦記憶體事業讓給EMC。這五家挑戰IBM成功的競爭者都在我們由小變大的企業名單上。


    麥高文（Bill McGowan）和羅勃茲（Bert Roberts）是MCI的英雄，他們不理會別人的譏笑，敢於在長途電話市場挑戰AT&T。有長達十年的時間MCI一直虧損，但它仍生存下來，並開始轉虧為盈。因為有MCI的競爭，美國人的長途電話費才得以降低。


