    股東，而只要20客麥香堡（Big Macs）加上薯條的價格，你就能變成麥當勞的業主，和許多華爾街的大亨平起平坐。


    不管你年紀多大，或你這輩子會買多少股票，當你走進麥當勞、玩具反斗城或電路城（Circuit City），看到顧客排隊購買商品，而且知道你擁有如此大好生意的一小片，滾滾而來的獲利最後有一小部分會流入你口袋，你總是會感到十分欣慰。當你在電路城購買攝影機或在百視達租影片時，如果你是這些公司的股東，你花的錢真是肥水不落外人田。


    這是我們生活方式很重要的一部分，也是美國開國元老們做夢也沒想到的。從大西洋到太平洋，超過5,000萬名男女老少已成為1.3萬家上市公司的股東。成為公司股東是讓社會大眾參與國家成長與繁榮最樸的方法。這是一條雙向道，當一家公司出售股票時，它可以利用籌得的資金開新商店，或蓋新工廠，或更新產品，以便銷售更多產品給更多顧客，和增進公司獲利。當公司變得更大和更興盛，股票就變得更有價值，使投資人能從他們正確的投資獲得報酬。


