    ## 股票發展的遲滯


    1800年時，美國有295家公司，絕大部分都由私人擁有，一般大眾無緣參與。公司的組織型態引發許多爭議，支持者認為是民主政治的一大助力，可以造福廣大的社會；批評者則認為公司是反民主、行事詭祕和具顛覆性的組織，只關心自身利益。


    對股票投資人來說，那是一段充滿挫折的時期。各州已通過法律限制公司被控告時股東應負的責任，因此人們可以放心投資而不致使損失超越股票的價值。但真正投資的人還是不多。想在親朋好友間找到志同道合、可以談論最愛哪一家上市公司的人很難，不像今日相對容易很多。


    當時的報紙沒有商業版，沒有《錢》（Money）雜誌，或討論如何選股的書。事實上，也沒有多少股票可供挑選：一打左右的銀行，兩、三家保險公司，兩、三家石油公司，如此而已。在1815年3月當時很受歡迎的報紙《紐約商業報》（New
    York Commercial Advertiser）所印出的所有上市公司名單，只有24檔股票，大多數是銀行。到1818年增加到29檔，1830年達到31檔。


    最早的股票買賣地點是在華爾街的一棵大樟桐樹下，後來股票交易移到租來的小房間或在小咖啡館裡進行。有一次，交易的小房間失火，交易商立即轉移陣地到一座乾草棚繼續交易。


    當年的紐約證券交易所不是你想像中充滿刺激的地方，你可能站在那裡打哈欠等候一檔股票交易。交易進行如此緩慢，以致交易商從上午11時30分才開始買賣，到下午1時30分就收盤結束一天的生意。股市生意清淡到在1830年3月16日創下歷來交易量最少的紀錄，只有31股成交。這與1995年平均每天有3.38億股的交易量有天壤之別。


    股票交易到1835年已變得熱絡些，紐約證券交易所已有121家公司掛牌交易。美國各地紛紛興建運河、收費公路和橋樑，這種狂熱的進步需要資金，而資金主要來自銷售股票和債券。銀行股已不像二十年前那麼炙手可熱，當時新的熱門股是鐵路股票與債券。有
    一度人們搶購任何名稱上有「鐵路」的股票，不管價格有多高。他們也以不斷攀升的價格爭買任何靠近鐵路的土地。如果人們沒有現金買土地，他們可以向銀行貸款。當時的銀行在這些房地產交易中借出鉅額資金，許多農戶不再種植田裡的作物，搖身變成房地產大亨。


    這是一個美國自家製造的泡沫，類似倫敦的南海泡沫，到1836年終於爆破。投資人爭相拋售資產，導致股價和土地價格怎麼漲上來、就怎麼跌下去。那些借錢買股票和土地的準大亨無法償付積欠銀行的債務，銀行資金告罄，紛紛倒閉關門，把錢放在儲蓄帳戶的人血本無歸。不久後，現金的供給短缺到沒有人買得起東西。金融體系瀕臨崩潰邊緣。這就是1837年的恐慌（Panic）。


    美國經濟（以及大多數國家的經濟）不斷在樂觀和恐慌間來回擺盪。在樂觀期時，價格上揚，到處都有就業機會，投機客會花掉剛賺得的薪資、抵押他們的珠寶，甚至借錢和做任何事來買股票、債券或土地，唯恐錯過大好的行情。然後在恐慌時，崩潰和蕭條接踵而至，投機客得到因果報應，人們終於恢復清醒。


    股市在1853年崩盤，在1857年又再度崩盤，當紅的股票伊利鐵路（Erie Railroad）從每股65美元跌到11美元。當時仍只有極小比率的人口擁有股票——以股票震盪如此激烈來看，也許這是不幸中的大幸。損失最慘重的仍然是歐洲人，他們未能從過去的經驗學到教訓，依舊投資大筆錢在美國。到1850年代，有近半數的美國股票由外國人持有，主要是英國人。


    ## 美國人的發明才能


    美國人曾被較優雅的歐洲人視為粗俗的暴民，教育水準低落，粗魯而愚蠢。因此當所有偉大的發明開始從美國人的腦袋蹦出來時，歐洲人當然大感驚訝。美國人的天才是人力短缺的結果，在一個幅員遼闊、人口稀少的國家，必須發明機器來取代部分人工。雖然有聰明的發明家構思新機器，但機器並不會自動製造出來，是資本主義讓人們願意把錢投資在製造機器，並促成了美國發明的黃金時代。


    當時有富爾頓（Robert Fulton）的汽船、卡巴特（George Cabot）的磨坊、羅威爾（Francis Cabot Lowell）的全面工業化工廠、麥考密克（McCormick）的巨型收割機，為農民省下勞累的工作。康乃狄克州的修補匠韋特尼（Eli
    Whitney）在南方的農場當教師時，發明了能自動去除棉籽的軋棉機，一夕間把南方變成棉花生產的聖地。麥考密克的收割機、柯爾特（Samuel Colt）的自動手槍，以及一種新式的掛鎖，是1851年倫敦水晶宮一場著名的工業機械展中，讓參觀者讚嘆不已的三項美國發明。歐洲人除了對美國產品大感驚訝之外，對美國的製造系統能將品質標準化，讓工廠生產出的所有產品具有完全相同的規格，更是讚不絕口。


    同樣的，要把這些發明從設計圖變成產品需要資金。這些資金一部分來自向銀行借貸，但大部分從股票市場籌措。因為持有股票在美國日漸普及，在國外更是司空見慣。當年外國人透過投資美國這個新興市場來推動美國快速進步，一百五十年後，美國也反過來在亞洲、非洲和拉丁美洲的新興市場投入鉅額資金。


    在農場上，機器改善了農民的生活；直到1850年代之前，農民使用的生產方法仍然和數千年前的埃及人一樣原始。農民用牲畜拉的犁耕田，許多粗重的勞動則由奴隸來做，他們是這種制度的受害者，和古代美索不達米亞的奴隸沒有兩樣。


    奴隸制形成的原因中，原始的農業是一大罪魁。直到旁觀者覺醒並發出怒吼來阻止這種惡行後，奴隸制才終於被廢除，不過資本主義在這個過程中也功不可沒。資本主義促使投資人投入資金興建工廠，製造農場設備（打穀機、收割機、圓盤耙、鋼犁、穀塔等），永遠改變了農業。有了新機器代替過去由奴隸和農奴做的辛苦勞役後，強迫人們過奴役生活已不符經濟利益。


    一百年前數家製造農場設備的公司至今仍然健在——迪爾（Deere）、國際收割機（International Harvester，現稱納威司達〔Navistar〕），和開拓重工（Caterpillar）。在他們發明和銷售能耕耘、種植和收割的機器時，其他公司也忙著發明除草劑和肥料，用來殺蟲、除草和為土壤施肥。新設備結合新化學品，把美國農業區變成全世界最有效率的穀倉，每英畝生產的小麥、玉米等穀物遠超過農業史上任何國家的農場。


    美國確實有肥沃的土地，有數億英畝富饒的土壤綿延於開闊的平原，不像歐洲和亞洲被農民無情地利用數世紀之久，以致土壤的養分已經耗竭。但不可否認的是，創新和發明使美國的土地更加物產豐饒，也讓美國農民變成舉世欽羨的對象。在100萬名愛爾蘭人死於馬鈴薯欠收造成的飢饉、中國人因稻米短缺而挨餓，以及世界上眾多人口每天餓肚子的同時，美國生產的糧食始終遠超過其國民消耗的數量。


    不過，當時農耕機械雖改變農民栽種作物的方法，卻未改變美國人平淡而單調的飲食。大多數家庭仍生產自己的食物，基本的菜單是麵包、馬鈴薯、根類蔬菜和乾果，偶爾配上一些鹹肉或煙燻肉。人們會在早餐吃羊腰子。廚房裡沒有冰箱，因此水果和蔬菜只能在生產的「當令」季節趁新鮮吃。


    在冬季，你吃黃瓜沙拉、酸黃瓜沙拉，或完全沒沙拉可吃。如果不住在靠近水邊的地方，就沒有鮮魚可吃。鮭魚是奢侈品，橘子是你一年只在耶誕襪裡看到的東西——如果你有耶誕襪的話。許多人不敢吃從墨西哥進口的番茄，因為蕃茄被大多數人認為有毒。葡萄柚通常只在佛羅里達看得到。


    沒有冷凍卡車或鐵路車廂可以把某地生產的蔬菜運送到另一地，罐頭工業則尚未發展保存蔬菜的方法。人們在自家用玻璃罐保存生產剩餘的食物。牛、羊和豬就是活的牛排、羊排和烤豬肉，被活生生從農場運到城市，以便顧客買回去自己宰殺和醃製保存。


    近來我們聽到許多追念「昔日黃金時代」的懷舊想法，認為過去的生活較「單純」、較「自然」，但提倡懷舊的人如果親身體験過真正的單純生活，可能會改變說法：單純的生活必須從日出到日落承受流汗和背痛的辛勞。要供應一個家庭食物、衣服和舒適的住所必須整天工作，在沒有現代生活的便利和產品協助下，女性必須整日操持家務，正如男性得成天勞動。


    大多數房屋是人力興建的，衣服、布簾、家具和肥皂的製造也一樣。一般人可能幾週都不會買一件由公司製造的產品，不管是不是上市公司。烹調食物得花上數小時，照料園圃也是，砍伐爐灶燒的木材又得花更多時間。爐灶的煤煙是主要污染來源，受污染的地方也包括人們度過大部分時間的住家和鄰近區域。說當時的人們能夠享受新鮮空氣，恐怕是誇大其詞。


    當時沒電視可能是一件好事，因為大部分人不會有時間看電視。今日我們談論「家庭娛樂」，但在那個年代，娛樂真的來自家裡——打牌、解謎、彈奏音樂、說故事和講笑話。


    如果這種娛樂這麼美好，為什麼後來有這麼多人偏愛聽廣播和看電視？


    ## 鐵路與商業


    股市在19世紀繼續獲得愈來愈多人喜愛，這有一部分要歸功於愛迪生第一項在商業上獲得成功的發明——紙帶收報機（tickertapes）。這是一架上面蓋著一個玻璃碗的印刷裝置，看起來像泡泡糖販賣機。每次有一檔股票被買進或賣出，交易記錄就透過電報發給世界各地的紙帶收報機。


    收報機把交易記錄印在紙帶上，成捲的紙帶不斷吐出，上面顯示股票代號、價格和交易的股數。監看紙帶收報機的人便可隨時看到最新的股價。


    在愛迪生發明這架機器前，除非是站在交易所的交易大廳，否則沒有方法可以知道股票的價格變動。裝置紙帶收報機後，投資人就可以跟著華爾街的消息靈通人士一起追蹤最愛的股票。


    美國經濟從1790年代到內戰期間成長了八倍，這表示人們生產和銷售的財貨是殖民時代居民的八倍。美國正逐漸邁向全世界最強大的工業國。隨著內戰結束，奴隸制度遭廢除（雖然種族歧視顯然未根除），美國人向西擴展，城市的天際線變得更廣闊，美國各地也一片欣欣向榮。


    到1855年，紡紗工廠沿著新英格蘭的河流周邊不斷冒出，在波士頓證券交易所上市的棉紡織公司至少有46家。當士兵從內戰解甲歸田，他們已習慣於穿制服，現在他們上街買另一種制服——已經縫製好的成衣。肥皂和蠟燭、皮革製品和楓糖，所有傳統上自製的產品現在都能在商店裡買到。州與州間的貿易障礙已被打破，以便大量製造的產品可以跨過州界。


    兩家鐵路公司——聯合太平洋（Union Pacific）和中央太平洋（Central Pacific）——被選中可以拓展鐵路線到太平洋。愛爾蘭人、德國人或中國人間偶爾爆發打鬥，但他們共同把力氣貢獻在鋪設鐵軌和敲打鐵釘上。


    國會總共授予1.7億英畝土地，給美國各區域的多家鐵路公司——這是美國歷史上最大手筆的財產贈與，也是最引起爭議的事件之一。


    鐵路公司把部分土地賣給農民，並利用部分土地當作他們龐大貸款的擔保，而貸款則用於支付工人和買鐵軌、鐵路車廂和其他昂貴的設備。


    數家今日的鐵路公司，仍然擁有當年政府授予的廣闊而珍貴的土地。對它們來說，那就像天上掉下來的寶貴資產。


    鐵路載運貨物和乘客，而興旺的生意則把大批新買家帶進股市。在第二次鐵路榮景中，投資人總共投資3.18億美元在鐵路股上，資助鐵路公司鋪設1.3萬哩鐵軌。聯邦政府提供大部分土地，西部的最大贏家不是牛仔和神槍手，而是鐵路公司。沒有投資人的資金和政府的優惠，誰知道這些領土何時才能開發？


    鐵路股成了美國從東岸到西岸的投資人都不可能忽視的目標，因為看到鐵路線綿延到全國每個角落、冒煙的火車頭一路奔馳，人們相信鐵路是萬無一失的投資機會。


    很多農民跟進炒作鐵路股、鐵路土地，以及1862年公地放領法案（Homestead Act）造就的土地公司。一些這類鐵路計畫和土地計畫結果證明是曇花一現的騙局，正如許多緊隨鐵路所到之處的金礦和銀礦開採計畫。


    馬克·吐溫（Mark Twain）據說曾形容金礦是「騙徒擁有的地洞」，而且許多這類騙徒還發行股票。靠這類未經證實的金礦賣股票賺的錢，比帶著淘洗盤和鶴嘴鋤湧進加州的所有淘金客賺的錢還多。這些騙局的受害者沒有聯邦或各州的法律可以保護他們，而禁止公司發布虛假或誤導訊息的法律也還沒有制訂。


    在大概只持續約二十五年的牛仔全盛時期，一連串的牛隻牧養股出現在股票交易所。到了1860年代末，美國人口有3,900萬人，牛則有3,800萬頭，約等於每個人有一頭牛。參與這波多頭市場的東部人，都對牛仔十分著迷。


    到1869年，紐約證交所有145檔不同的股票。保險公司首度在華爾街掛牌，鋼鐵公司和鑄鐵工廠也紛紛上市。它們的規模日益壯大，吸引農民離開土地，激勵移民橫越大西洋來到美國的工廠城。


    鐵路軌道已延伸到全國每個角落，大湖區間的運河交通往返也十分繁忙，駁船載運鐵和煤到鋼鐵工廠以便加工製造，工廠煙囪噴出的有毒濃煙污染了空氣，但一船船滿載的移民仍不斷湧進美國尋找工廠的工作。


    他們從愛爾蘭、歐洲大陸，以及遙遠的中國湧進紐約港，逃避馬鈴薯飢饉、戰爭、秘密警察、不公平、迫害、不安全，以及各式各樣的動盪不安。他們從事低薪的工作，如成衣工、肉品包裝工、鉗接工、釘釘工和修理工，在不健康和經常充滿危險的環境下工作。他們寧願待在這些惡劣的工作和生活環境，因為不管這裡的環境有多糟，都比家鄉有人餓死或深陷戰火的環境好。如果這裡的環境沒有更好，為什麼有這麼多人摩肩擦踵遠道而來？


    他們也知道，如果留在波蘭、希臘或其他地方的故鄉，就沒有進步的希望。因為每個國家都由一小群貴族占有農場、蓄積龐大財產，並且控制政府。在美國他們有希望，不只是希望，他們也敢於期待。這裡不就是機會的國度嗎？工人看到四周街區愈來愈繁榮，他們期待能分享這種繁榮——如果他們享受不到，他們的子女將來一定也能享受到，而且確實如此。


    移民工人的後代有機會進入大學，當醫生、律師、主管，甚至投資他們的父母和祖父母曾經超時工作、賺取低薪的公司。


    大體來說，19世紀末的美國工人不會花大把錢在昂貴的假期或香檳宴會——至少大部分人不會這麼做。他們把錢存在銀行，而當時情況已經不像銀行由各州管理的時代那樣混亂。1860年代中期貨幣種類繁多造成購物困擾的情況已經消失，因為新的聯邦銀行體系已經建立。從這時起，美國開始有單一的國家貨幣——美元。


    美國人儲蓄鉅額的錢在銀行，從內戰到第一次世界大戰期間，總金額達到美國總工業生產的18%。由於現金被用來興建更好的工廠和更好的道路，以便從工廠運輸產品到各地，使得工人變得更有效率。他們做同樣時數的工作，可以生產更多產品。


    貨幣的供給增加了四十多倍，但幾乎沒有任何通貨膨脹。在今日，當一個新興國家如俄羅斯印刷更多紙鈔時，我們會看到貨幣的價值立即大跌，物價一飛沖天。但在19世紀下半葉美國仍是新興國家時，物價卻保持穩定。雖然銀行瘋狂地印製鈔票，但當時未引發通貨膨脹的原因是美國的工業生產成長與貨幣供給並駕齊驅。


    另一個美國繁榮的因素是，美國的邊界透過極高的關稅而對許多外國製產品關閉。現在我們聽到許多自由貿易和它有多好的言論，但在美國經濟飛快成長、美國的工廠全速生產的那段時期，外國競爭者很難進入美國市場，使美國的工業受到相當的保護，免於海外競爭的威脅。


    美國人繼續想出各種新發明的點子：電報、電話、汽車、硫化橡膠輪胎。也有人發明更好的捕鼠機、更好的某種產品，或取代人工的某種機器。在1880年代，國會通過一項關閉美國專利局的法案，因為國會認為所有重要的發明都已經發明出來了。那證明是錯得離譜！


    當時有捲香菸的機器，由一家叫朋沙克（Bonsack）的公司製造，最早被一名叫杜克（James Duke）——杜克大學（Duke University）的杜克——的加州菸草農採用。還有製造火柴的機器、一種製造麵粉的機器（皮爾茲貝利〔Pillsbury〕買了一部）、一種濃縮牛奶的機器（伯登牛奶公司〔Borden〕擁有專用權）、一種製造鋼鐵的新方法（柏西默〔Bessemer〕製程）、和製造湯罐頭的機器（最早被康寶〔Campbell''s〕採用）。還有一種機器用來製造漂浮象牙肥皂（Ivory），而這種肥皂原本是寶鹼（Procter
    & Gamble）的實驗室誤打誤撞製造出來的。


    一旦新機器發明出來，就有人必須發明更多機器來製造新機器，加上零件和修理它們的工具。機器非但沒有像許多批評者預測的搶走人們的工作，反而創造出新工作。因為機器而失去的每一個工作，都會產生出二個新工作。而機器愈進步和愈精良，工作就更容易。工廠製造的產品比手工產品更便宜，在很多時候品質比手工產品更好，或至少品質更穩定。顧客因為產品便宜買得更多，因此產業機器化能提高顧客的購買力。


    ## 全國品牌的成長


    在進入20世紀時，美國有很繁榮的零食產業，生產各種果凍、果醬、餅乾、糖果和口香糖，並由在證交所上市的公司銷售到全國各地。你可以吃這些東西，同時投資生產這些東西的公司。


    我們從零食只有硬麵包、奶油餅乾、方形蘇打餅乾和圓甜餅乾可供選擇的單調年代，到今日已有長足的進步。過去這些小點心都由街坊的麵包店製造，並由地方的雜貨店裝在餅乾桶裡販賣。


    當時美國最有名的餅乾是優尼達（Uneeda），這個品牌響亮的程度有如今日的可口可樂，是由全國餅乾公司（National Biscuit Company）製造，也稱作奈畢斯寇公司（Nabisco）。奈畢斯寇是數十年合併的結果，由許多家家族麵包店整併成兩大區域性烘焙事業——中西部的美國餅乾公司，和東部的紐約餅乾公司（New
    York Biscuit Company）——再由這兩家超大烘焙業者結合成奈畢斯寇公司，並在約跨入20世紀時公開上市，發售價值約3,000萬美元的股票。初始的股東有1,300人，包括一些名人，但任何人都可以從市場買進股票。


    在葛林（Adolphus Green）英明的領導下，奈畢斯寇終結了以餅乾桶賣餅乾的美國傳統，並在零食中添加更多樂趣。奈畢斯寇開始包裝餅乾，使餅乾保持脆度和乾燥，並且在餅乾桶裡不會被髒手污染。奈畢斯寇繼續生產優尼達餅乾的同時，也開發一連串新產品——紐頓無花果（以麻州的紐頓〔Newton〕為名）、精選鹹餅乾（Premium
    Saltines）、巴倫動物餅乾（Barnum''s Animal Crackers，1902年）、杜尼斯奧利奧餅乾（Lorna Doones and Oreo
    cookies，1912年），以及麗滋餅乾（Ritz Crackers，1934年）。


    奧利奧後來變成全世界最暢銷的餅乾，至今仍是如此。奧利奧已經存在這麼久，我們忘記它是在奈畢斯寇的工廠製造的。奈畢斯寇也收購第一種狗食餅乾「牛奶骨頭」（Milk
    Bone）的製造權。


    當時還有紳士牌（Planter）花生，發明者是推車攤販奧比西（Amadeo Obici），他在19世紀末、20世紀初靠著在賓州韋基斯貝爾（Wilkes-Barre）街上叫賣起家。奧比西有天決定在他的花生上撒點鹽，這種鹹花生在1906年大受歡迎，讓他得以和一位合夥人創設紳士堅果與巧克力公司（Planter''s
    Nut & Chocolate Company），也就是日後RJR奈畢斯寇公司旗下的紳士公司（Planter''s Life Savers Company）。


    還有亨氏（Heinz）番茄醬，由賓州的酸黃瓜製造商亨氏（Henry J. Heinz）調製。曾在1873年恐慌中傾家蕩產並宣告破產的亨氏，東山再起後變成世界第一的酸黃瓜大王、調味醬大王，和番茄醬的推廣者。他的配方源自一種東方的滷汁（ketsiap），主要成分是醃魚。亨氏捨棄魚而添加蕃茄。


    在殖民時期和19世紀初期，美國人認為番茄有毒。甚至在勇敢的軍官Colonel Johnson於紐澤西州薩冷（Salem）郡法院前的台階當眾吃下一顆番茄、證明它無毒後，許多人還是不敢輕易嘗試。但等到亨氏把蕃茄裝進瓶子裡，人們很快就養成把番茄醬擠到各種食物上的習慣，而且到今天仍然如此。尼克森（Nixon）總統喜歡把番茄醬灑在他的炒蛋上。

