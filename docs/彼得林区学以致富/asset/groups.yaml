    # 閱讀證券版新聞*


    買進迪士尼股票後的第二天，你匆匆打開報紙的商業版面，想知道它的股價是多少。這是每個持股人每天早上做的事，也是他們洗臉刷牙、穿上衣服並為自己倒上一杯咖啡後做的第一件重要的事。


    要分辨誰是投資人的方法之一是，看他們怎麼看報紙。投資人不像其他讀者先看漫畫、或運動新聞、或安・蘭德斯（Ann Landers）的專欄。他們會馬上打開商業版，搜尋股價行情表，看他們持有之股票昨日的收盤價。


    他們的心情可能在幾秒鐘內轉變，全看他們看到的結果是什麼。也許你已經在自己家裡看過這些。你坐在早餐桌前，你父親正在瀏覽股票行情表（通常是父親做這件事，但愈來愈多女性也對這感興趣）。如果他臉色變難看，並且第無數次告訴你別忘了關浴室的燈以免浪費電，你大概可以猜中他的股票下跌了。另一方面，如果他開始哼《向統帥致敬》（Hail
    to the Chief），並提議增加你的零用錢，或者說他會付錢僱大禮車送你參加學校舉辦的舞會，你可以篤定他的股票上漲了。


    在股票交易所開張的營業時間，股票以極快的速度換手，價格每一分鐘都在上漲或下跌。但在下午4時收盤時，交易停止，每一檔股


