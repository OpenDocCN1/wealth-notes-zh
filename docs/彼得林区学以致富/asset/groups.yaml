    ### 二、收藏品


    收藏品包括骨董汽車、郵票、舊錢幣、棒球卡、芭比娃娃等物品。當你把錢投資在這些東西上，你是希望未來賣出時可以獲利。有兩個原因可能創造獲利：這些東西放愈久愈受喜愛，人們願意付更高的價格購買它們；此外，通貨膨脹侵蝕現金的購買力，會使所有東西的價格水漲船高。


    投資收藏品的問題是它們會遺失、遭竊、變形、污損、破裂，或被火、水或風損害，如果是骨董家具可能被白蟻蛀咬。有保險可以保障這類損失，但保費很昂貴。整體來看，收藏品會因磨損而喪失價值，雖然也會因為保存時間更久而增值。收藏家永遠期望收藏愈久所增加的價值，會超過收藏品損耗所減少的價值。


    收藏是很專門的工作，而成功的收藏家不但得專精於他們收藏的物品，也必須熟悉市場和價格。要學習的事很多，有些可以從書籍學到，其餘的就得不厭其煩地從經驗學習。


    潛在收藏家（尤其是年輕的收藏家）要學的第一課是，買一輛新車不是投資。最近有一則汽車電視廣告出現「投資」兩字，如果你看到這則廣告不要被它說動了。骨董汽車是投資——如果把它們放在車庫、很少開它們。但每天使用的新車很快就會減損價值，甚至比金錢減損價值的速度還快。除了遊艇以外，沒有比汽車耗錢更快的東西了。別犯了和畢貝利一樣的錯。


    ### 三、房屋或公寓


    買房子或公寓是大多數人獲利最豐厚的採購。房屋有兩大優點比其他類投資強——你在等候價格上漲時可以住在裡面，還有你以借來的錢買下它。讓我們算算看。


    房屋有增值速度和通貨膨脹率一樣快的習慣。在這方面你不賺不賠，但你不必立刻支付所有買房的款項。通常你先支付20%（頭期款），銀行借給你其餘的80％（抵押貸款）。你在償付貸款的期間支付利息，時間通常從十五年到三十年不等，視你與銀行達成的交易而定。


    在此同時，你住在房子裡，而且你不會因為房屋市場市況很差而嚇得賣出房子，像在股市崩盤或修正時因害怕而拋售股票那樣。只要你住在房子裡，房屋就會增值，但你不必因為增值繳任何稅。而且你一輩子有一次機會，政府在你賣出房子時給你減稅的優惠。


    如果你購買一棟10萬美元的房屋，一年增值3％，一年過後它的價值將比你支付的價格高3,000美元。乍看之下你會說那是3％的報酬率，就像你從儲蓄帳戶獲得利息一樣。但有個秘密讓房屋變成很棒的投資：在買房的10萬美元中，只有2萬美元來自你的口袋。所以等一年結束時，你將從2萬美元的投資獲得3,000美元的獲利。所以這棟房屋給你的獲利不是3％，而是15％。


    當然，在這過程中，你必須支付抵押貸款的利息，但可以獲得稅務抵減（除非政府決定取消這項抵減），而在你繳納抵押貸款時，你是在逐漸增加對這棟房子的投資。這是一種許多人沒有想過的儲蓄方式。


    十五年後，如果你的抵押貸款也是十五年，而你也住在這房子裡這麼久了，不但抵押貸款已經還清，而且拜每年增值3％所賜，你以10萬美元買的房子將價值155,797美元。


    讓我們接續畢貝利和卡薇兒的例子。他們都升上沃爾瑪的副經理職位，領同樣多的薪水。卡薇兒住在自己的房子，而畢貝利的父母也把他趕出去住了。他希望自己買一棟房子或公寓，但因為沒有錢付頭期款，不得不租公寓住。


    畢貝利每月的房租比卡薇兒每月的抵押貸款繳款低一些，加上她必須買房屋保險、支付草坪服務和偶爾得修繕房子，所以一開始畢貝利的口袋裡有較多現金。理論上，他可以把多出來的現金投資在股票市場，建立他未來的資產，但他沒有這麼做。他把錢花在音響設備、潛水裝置、上高爾夫球課等方面。


    一個不存錢買公寓或房子的人，不太可能存錢投資股票。一個家庭必須每個⽉犧牲一點享受，才有能力擁有一棟房子；但你聽過家庭犧牲享受以便買第一檔共同基金嗎？


    卡薇兒已經從買房子養成儲蓄和投資的習慣，只要她持續繳納房貸，她就被迫投資在房子上，而由於她已經從投資共同基金獲得房貸的頭期款，很可能她將來只要有多餘的錢，也會拿來投資共同基金。


    十五年後，當她的房貸還完後，卡薇兒將住在一棟價值不菲的資產裡，而她最大筆的每月帳單將消失。畢貝利則因為付房租而沒有多少剩餘的錢，因為房租將比他當初搬進公寓時要高得多。他繳納的房租也會比卡薇兒最後支付的分期付款要高得多。


    ### 四、債券


    你可能聽過新聞播報員談到「債市」、「債市大漲」，或「債券價格全面下跌」。也許你認識有人持有債券。也許你曾想：「債券是什麼？」


    債券是說起來好聽一點的借據，印在漂亮的紙上，邊緣有線條裝飾，頂端有圖樣，但它的作用和潦草寫在餐巾紙上的借據沒有兩樣。它記錄了你借錢給別人的事實，顯示借錢的金額，償還的期限。它也記載借款人必須支付的利率。


    雖然是說「買一張債券」，但你並非真正買任何東西，而是借錢給別人。債券的出售者（也叫發行者〔issuer〕）向你借錢，而債券本身則是交易的證明。


    世界上最大的債券發行者是山姆大叔。每當美國政府需要額外的錢時（這幾年是隨時需要），就印製一批新債券。這就是5兆美元國債的由來——美國政府積欠所有購買公債者的錢。國內外的個人和企業、甚至外國政府，都參與借了這5兆美元給山姆大叔。他們把證明借款的借據收在他們的保險箱裡。


    最後，這些人的錢都得償還——這就是預算赤字的由來。在這個過程中，美國政府必須支付這5兆美元借款的利息——山姆大叔就快被這些利息給壓垮了。這是政府自己製造出來的爛攤子。美國政府欠了這麼多債，導致聯邦稅收有15%得用來支付利息。


    比較可能和年輕人扯上關係的債券是美國儲蓄債券（U.S. Savings Bond）。許多爺爺奶奶送儲蓄債券給孫子和孫女，這是間接送錢給孫兒女的方法。祖父母不直接把錢交給他們，而是藉由購買債券把錢借給政府。幾年後政府加上利息償還這些錢——但不是給祖父母，而是給孫兒女。


    美國政府不是唯一發售債券的機構，各州和地方政府也出售債券籌措現金。醫院和機場、學區和運動場、各式各樣的公共機構，以及成千上萬的公司也發行債券。債券的供應很充裕，任何一家股票經紀商都賣債券。你可以輕易買到債券，就像你開一個銀行帳戶或買一檔股票。


    基本上，債券很類似我們前面談過的定期存單和國庫券。你買債券是為了賺取它們支付的利息，而且你事先知道多少利息和何時支付，以及何時可收回初始的投資。債券與定期存單或國庫券的主要不同之處是，定期存單和國庫券償還你的時間較快（從數個月到兩年不等），債券償還你的時間較長（你可能等上五年、十年或長達三十年）。


    債券償還的時間愈長，通貨膨脹在你收回借款前侵蝕金錢價值的風險就愈高。這就是債券利率往往高於短期投資如定期存單、儲蓄帳戶或貨幣市場的原因。投資人因為承擔較高風險而要求較高的報酬。


    在其他條件相同的情況下，三十年期公債支付的利息高於十年期公債，而十年期的利息又高於五年期。債券的買家必須決定他們要投資多久，還有他們賺取的利息是否值得他們的錢被套住這麼久的風險。這是很難做的決定。


    就目前來說，美國投資人持有的各種債券總共價值8兆美元。另一方面，投資人也持有各大交易所交易的股票價值超過7兆美元（不包括在地區性或櫃檯市場的交易）。而兩種投資孰優孰劣至今仍爭論不休，各有優點和缺點。股票的風險高於債券，但獲利的潛力也較大。要了解這個事實，先讓我們看看兩個選項：一是買麥當勞股票，一是買麥當勞債券。


    買股票時，你是一家公司的股東，擁有各種應有的權利和特權。麥當勞對你無微不至，他們寄給你財務報告，邀請你參加年度股東大會。他們也派發股利給你當作分紅。如果他們的1.6萬家漢堡連鎖店今年的生意特別好，他們就會加發股利，給你更多分紅。但即使不發股利，如果麥當勞的漢堡生意好到沒話說，股價也會跟著上漲。你可以用遠高於買進的價格賣出股票，靠這種方式獲利。


    儘管如此，沒有人能保證麥當勞的生意一定好、股東一定能得到分紅，或股價一定會上漲。如果股價跌到你買進的價位以下，麥當勞不會退錢給你。他們不給你任何承諾，也沒有還錢給你的義務。身為股票持有人，你沒有擔保，你必須自己承擔風險。


    當你買麥當勞債券或任何債券時，情況就大不相同了。這時候你不是股東，你是放款人，把錢借給麥當勞一段固定的時間。


    如果你是麥當勞債券的持有人，而麥當勞正好經歷漢堡史上生意最好的一年，他們也不會想到要分紅給你。公司總是不斷提高股票的股利以獎賞股東，但你從沒聽過公司提高債券的利息來獎賞債券持有人。


    債券持有人最難受的是，眼看著股價漲上雲端，卻知道自己不會因此多賺一毛錢。麥當勞就是絕佳的例子。從1960年代以來，麥當勞股價（調整分割股票後）從每股22.50美元飆漲到13,570美元，讓投

