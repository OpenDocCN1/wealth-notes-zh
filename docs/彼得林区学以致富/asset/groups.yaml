    # 序言


    美國的中學忘了教導一門最重要的課程：投資。這是一個嚴重的疏失。我們教導歷史，但卻不教資本主義大步邁進這部分，也不教公司在改變（大部分是改善）我們的生活方式時扮演什麼角色。我們教導數學，但不包括如何以簡單的算術來敘述一家公司的情況，協助我們判斷其營運會成功或失敗，以及我們能不能透過擁有其股票而獲利。


    我們教導家政課：如何縫紉、烹飪火雞，甚至如何編家用預算和記錄帳本。但我們忘了教導及早儲蓄是日後富裕的關鍵，以及把錢投資在股市是除了買房子之外最聰明的做法，還有愈早儲蓄和投資股市，你的長期獲利就愈可觀。


    我們教導愛國，但談論的是軍隊和戰爭、政治和政府，而不談數百萬家或大或小的企業如何營運，然而後者卻是國家繁榮強大的關鍵。如果沒有投資人提供金錢來創立會僱用新員工的新公司，或協助舊公司擴張、變得更有效率和支付更高的薪資，我們所知的世界將會崩潰，人們將會失業，而美國也將隨之衰亡。'
  - '[PAGE 5]


    過去五年來，*昔日被稱作共產集團、被圍在鐵幕後的國家發生一件重大的事。這些國家的人民揭竿推翻他們的政府，把共產黨領導人趕下台，希望總有一天他們的生活可以改善。他們渴望民主政治、言論自由和宗教自由，然而除了各種人權外，他們也想要自由企業。這包括製造東西、銷售產品、在商店買東西、能擁有房子、公寓、汽車或自己的事業，這些都是直到不久前有半個世界的人口還無緣享受到的權利。


    俄羅斯人和東歐人走上街頭、示威抗議、罷工、集會、發出怒吼，並奮力爭取我們已經擁有的經濟體制。許多人為這個目標遭逮捕入獄，許多人喪失性命，然而我們自己國家的學校卻不教導這種經濟體制如何運作、有何優點，以及如何藉由變成投資人來善加利用它。


    投資很好玩，投資很有趣。學習投資可以變成一種讓人生在很多方面都更豐富的經驗。學習投資可以讓你生活於富足之中，但大多數人直到中年後才開始了解投資的竅門，而這時他們已經老眼昏花、腰圍有如水桶；他們在這時才發現擁有股票的好處，卻只能後悔沒有及早做投資。


    在我們的社會，向來是由男人處理大部分理財事務，女人則在旁邊觀看男人笨手笨腳處理事情。但在投資這方面，女人完全可以和男人做得一樣好。而且沒有人可以靠遺傳獲得投資的竅門，所以當你聽到有人說「他是投資的天生好手」時，別輕易相信。投資的天生


    *譯註：本書出版於1996年1月。'
  - '[PAGE 6]


    好手都是神話。


    理財的原則很簡單、很容易掌握。第一個原則是儲蓄等於投資。你把錢存在撲滿或餅乾罐裡不算是投資，但你只要把錢存在銀行，或者買儲蓄債券，或買公司的股票，你就是在投資。有人會利用那些錢來開設新商店、蓋新房子或新工廠，進而創造就業。更多就業意味有更多員工領到薪水。如果員工設法把部分收入儲蓄起來和做投資，整個過程就此周而復始。


    每個家庭、每家公司和每個國家的財務都是如此。不管是比利時或波札那、中國或智利、莫三比克或墨西哥、通用汽車（GM）或奇異（GE）、你的家庭或我的，能為未來儲蓄和投資的人，未來就比一有錢就浪費的人更富裕。為什麼美國是一個如此富裕的國家？因為美國曾經是世界上儲蓄率最高的國家之一。


    一定有許多人告訴過你，接受良好的教育很重要，如此你才能找到有前景的工作，領到不錯的薪水。但他們可能沒告訴你，長期來看，你未來的富裕不只是取決於你賺多少錢，還要看你如何善用這些錢來儲蓄和做投資。


    開始投資的最佳時間是你年輕時，我們在後面章節將深入討論這點。你給投資成長的時間愈久，最後得到的財富就愈多。但這本介紹理財的書並不只是給年輕人看，而是寫給任何年齡的人，寫給任何對股票感到困惑、卻還沒有機會學到理財基本原則的投資初學者。


    人的壽命愈來愈長，這表示他們必須比過去的人支付更久的生活開'
  - '[PAGE 7]


    銷。如果一對夫妻已經活到65歲，他們很可能很可能繼續活到85歲；如果他們活到85歲，很可能其中一個能活到95歲。為了支應生活開銷，他們需要額外的錢，而要賺這些錢最保險的方法就是投資。


    從65歲開始投資不算太晚。今日65歲的人可能還有二十五年的時間讓他們的錢繼續成長，讓他們可以得到額外的收入，用以支付二十五年的額外開銷。在15或20歲時，你很難想像自己有天會變成65歲，但如果你養成儲蓄和投資的習慣，到那時你的錢將已為你工作五十年。五十年的儲蓄和投資將製造出驚人的成果，即使你每次只儲蓄和投資一小筆錢。


    投資愈多，你未來就愈富裕，而國家也會愈富裕，因為你的錢會幫助創造新事業和更多就業。'
