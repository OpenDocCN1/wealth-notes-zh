    老練的投資人知道，股價可能因為預期衰退而下跌，或因為華爾街擔心通貨膨脹，但嘗試預測這兩種不利的情況都沒有意義，因為經濟氣候無從預測。你必須有信心，通貨膨脹最後一定會冷卻下來，而衰退一定會觸底回升。


    ## 牛市與熊市


    在平常的交易日中，許多股票價格會上漲，其他股票則下跌。但偶爾會像獸群狂奔一樣，數千檔股票朝同一個方向奔跑，像潘普洛納（Pamplona）的奔牛節一樣。如果獸群往上奔跑，我們稱為「牛市」（bull
    market）。


    當牛群狂奔時，有時十分之九的股票每週創新高價。人們搶進買得到任何股票。他們和股票經紀人說的話比和最好的朋友還多。沒有人想錯過大好行情。


    只要好行情持續，數百萬名持股人每天都很開心。他們在洗澡時唱歌，工作時吹口哨，扶老太太過馬路，每天晚上睡覺時細數投資組合的獲利，感謝老天的恩賜。


    但牛市（又稱多頭市場）不會永遠持續，狂奔的獸群遲早會開始跑下山。股價將下跌，每週有十分之九的股票創新低價。在上坡路上爭搶買股票的人們，在下坡時一路拋售持股，唯恐晚一天賣股票就會賣不出去了。


    當股價從上一個高峰下跌10%時，我們稱為「修正」（correction）。我們在20世紀（截至1995年）出現過53次修正，平均每隔兩年就有一-次。當股價下跌超過25%就稱為「熊市」（bear
    market，又稱空頭市場）。在53次修正中，有15次轉變成熊市，平均每六年一次。


    沒人知道誰創造「熊市」這個詞，但把熊牽扯到金融損失，對牠們

    '
  mdcn: '

    之處。在愛情，我們稱之為「尋找適配的夥伴」；在企業，我們稱之為能發揮「綜效」（synergy）的結合。


    喬治亞太平洋（Georgia Pacific）是伐木業巨人，曾併購兩家較小的木材公司——普吉特灣紙漿木材公司（Puget Sound Pulp & Timber）、哈德遜紙漿紙業公司（Hudson
    Pulp & Paper）——藉以擴張營運。這是典型的「綜效」併購，因為三家都是木材業者。它們合併在一起獲益的原因就和男女從結婚獲益一樣——兩個人（在此例中是三家公司）一起生活的成本比單獨生活低。


    另一個典型「綜效」的例子是賀喜在1960年代併購利斯糖果（H. B. Reese Candies）。這是一家知名的花生醬蛋糕公司和一家巧克力棒公司的策略結盟，兩家公司從此過著快樂幸福的生活。


    百事併購肯德基炸雞、塔可貝爾（Taco Bell）、必勝客，以及數個其他品牌，都獲得很好的結局。速食餐廳和軟性飲料間有很明確的綜效，百事旗下速食餐廳的墨西哥餅、炸雞和披薩，搭配銷售許多百事可樂。


    就菲利普莫里斯來說，要找到香菸、乳酪、啤酒、甜甜圈和衛生紙之間的綜效可能較難。但慢慢的你終於發現，菲利普莫里斯買了許多消費者熟悉的好品牌。


    亨氏收購星琪鮪魚（Star Kist）、歐爾艾達馬鈴薯（Ore-Ida）和體重觀察公司（Weight Watchers）有一種諷刺的綜效。公司的一部分銷售雜貨食品，另一部分卻銷售控制飲食的產品。許多人嘲笑體重觀察公司，但亨氏懂得如何打造品牌和在商店販售產品，結果是一炮而紅。


    早期稱作莎拉李廚房的莎拉李公司（Sara Lee）大肆收購，買下布斯漁業公司（Booth Fisheries）、牛津化學（Oxford Chemical）和富勒刷子（Fuller
    Brush）；然後又買下伊萊克斯（Electrolux），跨入吸塵器事業。在當時，莎拉李賣的是蛋糕，和可以吸起地上蛋糕屑的設備，兩者要說有綜效實在太過牽強。不過莎拉李最聰明的一樁併購是買下黎格斯襪子（L''eggs），生產風靡半數美國婦女的絲襪產品。黎格斯是個成功的開始，讓莎拉李從此一帆風順。當一家公司收購一連串彼此很少或沒有關係的公司時，其結果是變成一個集團。集團在三十到四十年前很受歡迎，但不久後漸退流行，因為大部分結果都不如預期。集團的經理人發現，要跨行管理不同的事業並不容易。


    集團化的世界紀錄可能非美國工業公司（U.S. Industries）莫屬，這家公司有時一度幾乎每天都進行一樁不同的併購。另一個集團高手是海灣與西方公司（Gulf
    & Western）的布魯東（Charles Bluhdorn），他沒看過一家他不想併購的公司。他併購的公司多到他死時海灣與西方的股票大漲！股東相信新管理團隊會賣出布魯東併購的部分資產，並獲得可觀的利潤，而果真被他們料中。海灣與西方變成派拉蒙通訊公司（Paramount
    Communications），而派拉蒙後來又被維康（Viacom）併購。


    還有一家美國罐頭公司（American Can）進行無數次併購，從多家礦業公司到古迪公司（Sam Goody）都網羅在內。整個集團後來合併成美邦公司（Smith
    Barney）和商業信貸公司（Commercial Credit），並把集團名稱改為普美利加（Primerica）。普美利加向美國運通收購喜森（Shearson），並併入美邦。然後普美利加收購旅行家保險（Travelers
    Insurance），並把普美利加的名字改成旅行家集團（Travelers Group）。


    最後是結婚次數比伊麗莎白泰勒（Elizabeth Taylor）還多的ITT。從1961年以來，ITT合併與收購的企業不下31家，後來賣出6家。併購的名單包括艾維士租車（Avis
    Rent-A-Car）、大陸烘焙（Continental Baking）、李維特家具（Levitt Furniture）、喜來登旅館（Sheraton Hotels）、康庭公司（Canteen）、伊頓石油（Eaton
    Oil）、明尼蘇達國家人壽、雷歐尼爾（Rayonier）、索普金融（Thorp Finance）、恆福保險（Hartford Insurance）和賓州石英砂（Pennsylvania
    Glass Sand）。ITT還買下凱撒世界（Caesar''s World）和麥迪遜廣場花園。


    在二十五年間，所有併購活動都對ITT沒有多大助益，股價表現平平。在1990年代，這家公司藉由削減成本和債務來自改造，股價在1994-1995年間很快翻漲為三倍。ITT已宣布分割為三部分的計畫，凱撒世界和麥迪遜廣場花園就納入其中一個部分。


    ## 絕種的公司


    每年都有許多公司死亡，有些年紀輕輕就夭折，它們試著跑得太快、太遠，借太多還不起的錢，終於挫敗而亡。有些中年過世，因為其產品有缺陷、款式太陳舊，以致於乏人問津。也許它們跨進錯誤的行業，或在錯誤的時機跨入正確的行業；或更糟的是，時機和行業都錯了。大公司和小公司及年輕的公司一樣會死亡，美國棉花油公司、拉克利德天然氣（Laclede
    Gas）、美國精神（American Spirits）、鮑德溫機車廠（Baldwin Locomotive）、勝利留聲機（Victor Talking Machine）和萊特航空（Wright
    Aeronautical），都曾經又大又重要，足以納入道瓊工業指數，但如今都已不復存在，又有誰記得它們？史都德貝克（Studebaker）、納許（Nash）、哈德遜汽車（Hudson
    Motors）、雷明頓打字機（Remington Typewriter）和中央皮革（Central Leather）也步上相同的命運。


    有個方法可以讓公司停止存在、但實際上並非死亡，那就是在併購中被其他公司吞併。另外，公司也經常藉由尋求破產保護以避免馬上死亡。


    破產法院是公司無法償付債務、需要時間清理爛攤子時要去的地方。這些公司聲請破產法第11章的保護，讓它們可以繼續營運，並慢慢償付債務。法院指派信託人監督這個過程，確保牽涉的每個人都受到公平待遇。


    如果是末期的病症，公司沒有希望恢復獲利，就可以聲請破產法第7章保護，這時企業就得關門，員工遣散回家，桌子、檯燈和文字處理機都搬走變賣。


    通常在這類破產中，與公司有關的各方（員工、經銷商、供應商、投資人）會彼此爭奪剩下的資產。爭戰的各方僱用昂貴的律師爭取權利，律師收費很高，但很少讓債權人拿回所有該拿的錢。破產的公司不會舉行葬禮，但激起的悲傷和痛苦絕不會少，尤其是失去工作的員工，還有血本無歸的債券和股票持有人。


    公司對國家興盛與繁榮很重要，可惜沒有一個紀念堂可追悼逝去的公司。也許國家的歷史保護部門，可在這些滅絕的公司曾經營業的地方設立紀念碑。應該有一本書記述那些從經濟版圖消失的公司，描寫它們如何活躍、如何死亡，以及在資本主義的演進中扮演什麼角色。


    ## 經濟氣候


    公司活在經濟氣候之中。公司仰賴外在世界生存，植物和人類亦是如此。公司需要穩定的資本供給，也就是所謂的貨幣供給（money supply）；需要有人購買製造的產品，有供應商提供產品的原料；需要政府讓其自由做生意，不課重稅令其不堪負荷，也不會用法規綁死它們。


    當投資人談到經濟氣候時，他們指的不是晴天或雨天、冬季或夏季，而是公司必須競爭的外界力量。這些力量將決定公司賺錢或虧損，以及最終它們能存活或枯萎。


    在80%的人口擁有農田或從事農業時，經濟氣候指的正是天氣，若乾旱曬死作物或大雨淹沒農田，農民就賺不了錢。當農民沒有錢時，地方的雜貨店就沒有生意可做，雜貨店的供應商亦然。但當天氣有利時，農田大豐收，農民的口袋裡裝滿現金。農民在雜貨店花錢買東西，把錢裝進雜貨店老闆的口袋。雜貨店老闆為店裡補貨，再把錢裝到供應商的口袋，如此循環下去。


    難怪天氣——不是股市——是街角午餐吧最熱門的話題。天氣對人的生計如此重要，所以《農民曆》（The Farmer''s Almanac）多年來始終暢銷。今日你在暢銷書排行榜上找不到任何有關天氣的書，倒是有關華爾街的書經常上榜。


    今日務農的人口不到1%，天氣已失去許多影響力。在企業界，人們已不甚重視氣象報告，反而較注意利率、消費者支出等來自政府和華爾街的報導。這些是影響經濟氣候的人為因素。


    經濟氣候有三種基本情況：熱、冷、溫和。熱氣候讓投資人緊張，冷氣候讓他們憂鬱，人們想要的是溫和的氣候，也就是一切都恰到好處的「金髮女孩氣候」（Goldilocks
    climate）。但要維持「金髮女孩氣候」可不容易，多數時候經濟都朝向兩種極端之一發展：從熱到冷，然後再從冷到熱。


    先談熱氣候。商業蓬勃發展，人們湧入商店，買新車、新沙發、新錄放影機，什麼都是新的。商品很快在貨架上流轉，商店僱用新店員應付購物的人潮，工廠加班以製造更多產品。當經濟達到最熱階段時，工廠生產的產品多到每個環節都堆滿貨物：商店、倉庫和工廠本身。商店業主都屯積更多貨品，以避免臨時補貨不及。


    工作很容易找，任何符合一半資歷的人都找得到，報紙上的徵才廣告有好幾個大版面。經濟正熱的時候，是青少年和大學應屆畢業生進入勞動市場的最佳時機。


    這聽起來是很完美的狀況：各行各業都在賺大錢；申請失業救濟的隊伍縮短許多；人們感覺富足、充滿信心、工作有保障。這是他們看到什麼就買的原因。但在金融世界裡，熱經濟被認為是壞事，會讓華爾街的專業投資人志忑不安。如果你注意商業新聞，你會讀到像這樣的標題：「經濟強勁，國家富裕，股市下跌100點。」


    熱經濟的主要疑慮是過度繁榮會導致通貨膨脹——也就是物價上漲。產品和服務的需求很高，導致原料短缺，甚至勞動力不足。只要任何東西出現匱乏，價格通常會隨之上漲。汽車製造商必須花更多錢買鋼鐵、鋁等原料，所以他們也提高汽車的售價。當員工感覺高物價的壓力時，他們要求提高薪資。


    一物漲價會抬高另一物的價格，企業和員工也競相把上漲的價格轉嫁給他人。公司支付更多錢在電力、原料和工資上；員工領到更高的薪資，卻未享受到好處，因為他們買的一切東西都比過去昂貴。房東也提高租金彌補增加的成本。很快的，通貨膨脹失去控制，物價以每年5%的速度上漲，然後10%，或者在更極端的例子裡達到20%。從1979年到1981年，美國每年的通貨膨脹都達到雙位數比率。


    新商店紛紛開張，各地的工廠也加緊擴張，許多公司借錢支應它們的營建計畫。另一方面，許多消費者用信用卡借錢支付他們買的所有東西。以上情況導致對銀行的貸款需求增加。


    看到人們大排長龍等著貸款，銀行和金融公司也隨著汽車製造商和其他行業的腳步，提高價格——在放款時收取較高的利率。


    不多久後，資金的價格也隨著一般物價上漲——只有股票和債券的價格下跌。投資人賣出股票，因為他們擔心公司賺錢的速度趕不上通貨膨脹。在1970年代末和1980年代初的通貨膨脹時期，股票和債券價格都大幅滑落。


    熱經濟無法長久維持，到最後，資金成本升高會導致熱經濟崩潰。房屋貸款、汽車貸款、信用卡貸款和所有貸款的利率全面上揚，導致少有人買得起房屋和汽車。所以人們保持現狀，延後買新房，或者繼續開他們的老爺車，暫時不買新車。


    突然間，汽車業不景氣了，底特律賣不掉最新款汽車的龐大庫存。汽車製造商打折促銷，價格開始下滑。成千上萬名工人遭裁撤，申請失業救濟的人龍變長了。沒工作的人沒錢買東西，開始緊縮開支。


    人們不到迪士尼世界度年假，反而窩在家裡看迪士尼電視頻道。這對奧蘭多（Orlando）的旅館業有不利影響。人們不買新款秋裝，只穿去年的衣服湊合，這對服裝業也有不利影響。商店流失顧客，賣不掉的產品堆積在貨架上。


    所有的價格都在下跌，各層級的企業無不嘗試提振營收。裁員的消息每天傳出，申請失業救濟的行列出現更多新面孔，更多空蕩的商店，更多家庭削減支出。經濟從熱到冷只有數個月的時間。事實上，如果經濟再冷下去，整個國家就有掉進經濟深淵的危機，也就是所謂的衰退（recession）。


    下表呈現從二次世界大戰以來的所有衰退。你可以看出它們平均持續11個月，平均每次導致162萬人失業。


    在衰退期間，商業從糟糕變成可怕。銷售軟性飲料、漢堡、藥品等民生必需品或平價產品的公司，可以安度衰退。銷售汽車、冰箱和房屋等高單價產品的公司，較難熬過衰退期間。它們可能損失數百萬、甚至數十億美元，除非它們在銀行有足夠現金可撐過艱困時期，否則可能有倒閉的風險。


    許多投資人學到如何讓投資組合對衰退免疫。他們只買麥當勞、可口可樂或嬌生這類傾向在冷經濟氣候表現良好的「消費者成長」公司股。他們避開通用汽車、雷諾茲金屬（Reynolds
    Metals）或美國住宅公司（U.S. Home Corp），這些是「景氣循環」類公司，會在冷經濟氣候中吃苦頭。「景氣循環」類公司不是賣昂貴的產品、或為昂貴產品製造零件，就是生產用於昂貴產品的原料。在衰退期間，消費者會停止購買昂貴的商品。


    對公司及其投資人最有利的情況是「金髮女孩氣候」：不太熱，也不太冷。但每當我們進入「金髮女孩氣候」時，它總是無法持久。大多數時候經濟不是正在變熱，就是正在變冷，雖然各種跡象十分混淆，往往很難分辨正朝向什麼方向。


    許多情況政府無法控制，尤其是天氣。但政府對經濟氣候可發揮很大影響力。從戰爭到對抗貧窮等聯邦政府的職責中，最重要的可能是避免經濟太熱或太冷。如果沒有政府，我們可能早就再次陷入大蕭條。


    聯邦政府的規模已經比大蕭條時代大很多。在當時，聯邦政府沒有多大的經濟影響力，沒有福利制度，沒有社會安全計畫，沒有住宅部門，也沒有今日的數百種政府機構。在1935年，整個聯邦預算只有64億美元，約占全美經濟產值的十分之一。今日（1995年）的聯邦預算為1.5兆美元，占總經濟近四分之一。


    我們不久前才跨過一個重要的分水嶺：1992年，在地方、州級和聯邦政府工作的人，比在製造業工作的人還多，這個所謂的公共部門支付這麼多薪水、挹注這麼多錢到經濟裡，所以能避免經濟陷入衰退。不管景氣是好是壞，數百萬名政府僱員、領社會安全救濟金者，和社會福利的受益者，都還有錢可花。如果有人被裁員，他們可以領數個月的失業保險金，並利用這段期間找工作。


    此種情況的負面影響是，政府的負擔沉重，龐大的預算赤字耗盡投資資金，使經濟無法快速成長。好事做得太過，就成了壞事。


    主管經濟氣候控制的機構是聯邦準備體系（Federal Reserve System），又稱聯邦準備理事會（Fed，簡稱聯準會），它有一套特殊的方法可為冷加熱、為熱降溫——透過增加或減少貨幣供給。儘管這是極重要的職責，但很少人知道聯準會如何運作。


    根據數年前的調查，有人以為聯準會是國家公園，還有人說是威士忌品牌。事實上，它是控制貨幣供給的中央銀行。每當經濟太冷時，聯準會就做兩件事。聯準會會降低銀行向政府借錢時支付的利率，這會促使銀行也降低向顧客收取的利率，讓人們負擔得起借更多錢，買更多房子和汽車。於是經濟開始加溫。


    聯準會也會直接挹注資金到銀行體系，以便銀行有更多錢可以放貸。挹注資金也會導致利率降低。在某些狀況下，政府可以藉由花更多錢來刺激經濟，就像你花更多錢在商店採購一樣。


    如果經濟過熱，聯準會可採取相反的方法：提高利率、減少銀行體系裡的資金。這會導致貨幣供給萎縮，利率攀升。發生這種情況時，銀行貸款的成本變高，許多消費者負擔不起，因而停止買車買房。經濟開始冷卻，企業生意減少、員工失業，商店變得冷清，不得不降價來吸引顧客。


    到了某個時點，經濟已完全冷透，聯準會再度介入，嘗試為它加溫。這個過程不斷循環，華爾街無時無刻不在操心這事。


    在過去五十年，我們經歷九次衰退。所以在你一生中，可能經歷一打以上的衰退。每次衰退發生時，你會聽到記者和電視評論員說國家即將崩潰，擁有股票的風險太高。但我們不能忘記一件事：從大蕭條以後，我們安然度過每一次的衰退。從前面的表格可見，衰退平均持續11個月，失去162萬個工作；而復甦平均持續50個月，創造924萬個工作。


    老練的投資人知道，股價可能因為預期衰退而下跌，或因為華爾街擔心通貨膨脹，但嘗試預測這兩種不利的情況都沒有意義，因為經濟氣候無從預測。你必須有信心，通貨膨脹最後一定會冷卻下來，而衰退一定會觸底回升。


