    Green）法官在一次著名的判決中，強迫AT&T拆解成八個部分，其中母公司媽貝爾（Ma Bell）保有長途電話事業，七家小貝爾（Baby Bell）則獲得地方電話事業。在這次關鍵的判決後，數十家公司崛起與媽貝爾和小貝爾競爭，這也是電話費愈來愈便宜的主要原因。這對維繫長途的愛情大有幫助，因為這讓許多配偶保持溝通，不會像AT&T那樣不得不分手。


    AT&T是絕佳的例子，說明為什麼獨占是錯的，而為什麼競爭符合所有人的利益。在AT&T拆解前，該公司僱用100萬名員工——每100個美國人就有一個為AT&T工作。今日，媽貝爾和七家小貝爾總共只僱用60萬名員工，但打電話的數量卻增加為三倍多。


    競爭迫使電話公司削減成本和變得更有效率。他們還是得遵守一些規定，例如必須提供電話服務給區域裡的每個人——否則住在架設電話線成本昂貴的偏遠地區的人，將永遠沒有電話可用。但我們都該感謝競爭的是，只要較少的員工就能提供打更多電話的服務，我們的電話費也因而降低。


