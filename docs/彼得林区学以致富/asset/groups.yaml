  - '[PAGE 143]


    投資人不可能追蹤在美國主要交易所掛牌的所有公司，因此不管是業餘或專業投資人都必須縮小選擇，只專注在少數種類的公司。例如，有些投資人只買會經常提高股利的公司股票，有些人則專找盈餘每年成長至少20%的公司。


    你可以專攻某個產業，例如電氣設備或餐廳或銀行。你可以專精在小公司或大公司、新公司或舊公司。你可以專攻在艱困時期沒落、並嘗試東山再起的公司（這類公司稱作「轉機」〔turnaround〕公司），專攻的方法則有百百種。


    投資並非精確的科學，不管多努力研究數字、了解公司過去的績效，你永遠無法確定它未來的表現。明日會發生的事永遠只是揣測，投資人的職責是做有根據的揣測而不盲目。你的工作是挑選股票，並且不以過高的價格買進，然後密切注意公司發布的利多或利空消息。你可以運用知識把風險降到最低。


    # 真正擁有股票


    你可以每天玩股市遊戲，但真正擁有股票的刺激沒有任何事能取代。人們記得買第一檔股票就像記得初吻一樣。不管以後你會擁有幾十檔股票，你永遠忘不了初次擁有的股票。


    在這時，如果有任何事阻止你，那一定是錢。年輕人有時間投資，但不一定有錢。那牽涉的不只是有閒錢可投入股市，而是你可以生活無虞地挪出可以投入許多年的錢，以便讓錢增值。如果你有兼職工作，有能力投資部分薪水在股票最好。如果不是，你可能得找個'
  - '[PAGE 144]


    好時機向家人開口了。


    這是父母、祖父母、姨嬸和叔舅可以扮演重要角色的地方。年輕人投資資金的最大來源是親人。當他們問你想要什麼生日禮物、耶誕禮物、光明節禮物等等時，告訴他們你要股票。讓他們知道如果可以選擇擁有一雙新耐吉鞋或一張耐吉股票（價值約等於一雙鞋）時，你寧可擁有股票。


    這保證會出乎多數大人的意料，他們會對你的有遠見和成熟感到驚訝。如果他們自己也擁有股票，他們可以轉移一股或許多股給你，助你踏上投資之路。辦理手續很簡單，不必支付手續費或佣金。每個世代都有許多年輕人以這種方式展開投資，藉由長輩送給他們第一張股票。


    有些祖父母定期送給孫兒女股票。但也有許多祖父母以儲蓄債券取代股票。如果你有這種祖父母，應該告訴他們，送績優公司的股票會更好，原因是我們前面討論過的，股票有許多凌駕債券的優點。


    雖然有父母或祖父母定期送給少量股票，年輕人仍很難自己購買少量股票。事實上，直到不久前，年輕投資人仍不被鼓勵買股票，因為有兩個障礙：第一，大多數股票交易由證券經紀商處理，必須滿21歲才能在經紀商開戶；第二，大多數經紀商收取額外佣金，25美元到40美元不等。如果你買一股47美元的百事股票，必須支付經紀商40美元佣金，幾乎和股票的價格一樣。成功的投資人不可能花87美元買47美元的股票。


    這種不利投資的情況正在改變，因為公司已開始繞過經紀商，直接'
  - '[PAGE 145]


    出售少量股票給大眾。畢竟，如果麥當勞可以賣給你漢堡，為什麼不能賣給你它的股票？


    已經有80家公司採取所謂的直接投資計畫，讓個人可直接購買少量股票，並支付遠低於經紀商佣金的手續費，甚至完全無需支付。這是華爾街從1960年代邀請披頭四（Beatles）到交易大廳以來，對年輕人最大的貢獻了。根據帶頭提倡直接投資計畫的第一芝加哥信託公司副總裁弗爾普（Jim
    Volpe），至少還有850家公司已表示有意加入直接售股給大眾的行列，且持續增加中。相關的法律阻礙已被劃平。


    你可能無法透過直接投資計畫只買一股股票，因為大部分公司要求最低購買250美元到1,000美元，視不同公司而定，所以你必須把錢存起來，直到你有250美元或達到要求的金額。但想到直接投資計畫遠為低廉的佣金，這只是個小缺點而已。


    最棒的是，一旦你初次購買後，你隨時可以直接向這家公司購買股票，不用支付分文佣金。且每當這家公司發放股利時，你的股利會透過股利再投資計畫自動轉換成更多股票。在大部分情況下，你直接與公司的股權轉移代理商打交道，不涉及股票經紀商。


    繼續注意這個令人振奮的新計畫，它將讓數百萬名原本被阻隔在股市外的人變成股票投資人。


    如果你仍想一次買一股股票，有一套計畫可以讓你這麼做。但你的家庭必須先加入全國投資人協會（National Association of Investors
    Corporation, NAIC），此協會是美國各地數百個投資俱樂部的支援'
  - '[PAGE 146]


    團體。


    截至1996年1月，加入協會的年費為35美元。個人會員或家庭每年支付14美元後，立即自動訂閱一份稱為《卓越投資》（Better Investing）的月刊，裡面有各種協助你成為更佳選股人的有用資訊。這些資訊大多適合有經驗的投資人，但有些也適合新手，可讓你獲益良多。除了月刊，你也有機會購買151家公司中任一家的一股到十股股票，每筆交易只需支付7美元的手續費。


    這個「買一股股票計畫」是專為兒童所設計，雖然它還有年齡限制問題。各州的規定不盡相同，但你可能必須滿18歲或21歲才能自己購買股票。否則需要父母之一或監護人代理你買股——他們之一必須加入俱樂部成為會員。


    這個計畫運作的方式如下：NAIC提供你可以買的151家公司名單，你決定想買哪一檔股票，弄清楚每股的價格，然後把買進的清單寄給NAIC，連同你買股票金額的支票，再加上10美元的股價「波動」。舉例來說，如果麥當勞目前的股價是40美元，你得寄出57美元。


    為什麼額外加上10美元？如果股價在你寄出信件到處理買單之間上漲，多餘的錢將用於彌補差額。不管如何，10美元不會被浪費。不管你買了第一股股票後還剩下多少錢，將用來買另一股的一部分。所以最後你可能買到1
    1/16股，或1 1/8股，或1 1/4股。


    這時候NAIC不參與其中，你是直接與溫蒂或麥當勞、或任何你買股公司的代表（股權轉移代理商）交涉。由於NAIC名單上的公司'
  - '[PAGE 147]


    都有股利再投資計畫，只要公司支付股利，你就會額外獲得一小部分股票。你也可以隨時購買更多股股票，只支付極少的手續費，甚至免手續費。


    如果你決定出售持股，可以透過股票經紀商出售（同樣的，高佣金可能使你拒絕這個選項），或以書面通知公司的代理商，他們將在第二天預定的時間、以當時的價格賣出股票。你要等股票賣出後才知道價格是多少。


    只要你已經不厭其煩加入NAIC，應該沒有什麼事會阻止你加入它的投資俱樂部。NAIC的會員俱樂部遍布美國各都市、城鎮和學校，甚至某些監獄也有。


    參與投資俱樂部就像加入股市遊戲的隊伍，差別是如果加入俱樂部，你投資的是真正的錢。大多數俱樂部一個月在會員家裡聚會一次，擬訂最新的選股構想。會員以多數決投票決定買賣哪些股票。


    每個會員同意每月投資固定的金額，可能是50美元或100美元——由多數票決定。結果證明，大多數人在俱樂部裡的投資績效比自己投資好。這是因為俱樂部讓他們更有紀律，他們不能在驚慌中賣股，團體裡較冷靜的人會投票反對。如果不能說服團體某股票值得買進，就不能買股票。這會強迫會員做功課。如果有人說：「我建議買迪士尼，因為我在市場聽到有人報明牌。」他會引來眾人的嘲笑。


    要成為投資俱樂部的會員，你至少要18歲，這一點我們已經說過，但即使你還未滿18歲，也可以參加聚會、推薦股票，在討論中發表'
  - '[PAGE 148]


    意見。如果已超過法定年齡的俱樂部會員願意當你的監護人，你就可以透過監護人的帳戶投資你自己的錢。


    # 在證券交易所買股票


    如果有人要你列出美國不能缺少一、兩個月的五個機構，你會怎麼回答？軍隊？警察？國會？法院？電力公司？自來水事業？醫院？閉眼想一分鐘，列出你的五個選擇，先別看下一段。


    你是否把股市或債市列入清單？大多數人不會列入。當我們思考給我們食物、汽油、住所、通訊、阻止盜賊上門的基本服務時，不會馬上想到華爾街。但事實是，金融市場對所有人的生活都極其重要，而不只對債券和股票持有人如此。白宮可以放假一個月，世界仍會照常運轉，但若沒有股市或債市，整個經濟體系將停頓。


    如果沒有市場、沒有買家，必須出售股票籌措現金的公司或個人將周轉不靈。已經背負5兆美元債務的美國政府，將無法像平日那樣出售債券以支應其開銷。它將只有兩種選擇，而且都不是好選擇：一種是印製大量新鈔，讓美元貶值，並使物價一飛沖天；另一種則是停止償還債務，使數百萬名美國人失去主要收入來源。公司將破產，銀行也可能倒閉。失控的民眾衝到最近的銀行搶救他們的錢，卻發現銀行已經沒錢可領。商店將關門、工廠停工，數百萬人將失業。他們將遊蕩街頭，尋找垃圾箱裡吃剩的披薩餅。我們所知的文明將很快結束，只因為金融市場關閉。因此這些市場的重要性遠超過我們的認知，沒有它們，我們無法長久生存。'
  - '[PAGE 149]


    # 經紀人的角色


    假設你有足夠的資金購買股票，所以適合遵循正規的買股票途徑——透過經紀人。如果你對投資很認真，你終究會來到這個階段。經紀人是你進入股市的管道，他們是今日世界不可或缺的角色。


    由於你無法自己走進股市買賣股票，必須透過證券經紀公司的經紀人才能辦到。你已經聽過這些名字：美林（Merrill Lynch）、美邦（Smith Barney）、嘉信理財（Sharles
    Schwab）等。


    像這些證券經紀商嘗試給人歷史悠久、相當穩定的印象，事實上它們經常合併和改變名稱。這是一個變遷迅速、業者經常合縱連橫、不適者難以生存的行業。


    主要證券商都交易股票、債券、共同基金，且必須遵守政府制訂的規範。除此之外，它們彼此有著懸殊的差異。所謂的全方位服務證券商如美林或美邦，收取的手續費高於「折扣經紀商」如嘉信。近來還有「大折扣經紀商」，提供的服務更少。


    你支付全方位服務證券商較高的費用，讓你有權利用該券商的諮詢。大致說來，折扣證券商不提供諮詢，他們只根據你的指示買賣股票。


    這時候你得做另一個決定。除了挑選你的第一檔股票，你還要善加挑選經紀人。最好的方法是和你附近地區的幾個經紀人談過——尤其是你朋友或親戚推薦的經紀人。如果你不喜歡談過的第一個經紀'
  - '[PAGE 150]


    人，附近還有很多人選可挑。有些經紀人經驗很豐富，對投資股票懂很多，有些則剛從短期訓練課程結業，對市場瞭解很少。和經紀人保持良好關係是投資樂趣的一部分。


    解決了證券經紀商和經紀人的問題後，下一步是開帳戶。這帶我們碰上另一個障礙：除非你已經21歲，否則你不能擁有自己的帳戶。在大多數州，投資年齡和喝酒年齡一樣。你16歲就可以開車，16歲也可以從軍，但除非你達到「法定成人年齡」，否則不能和經紀人做生意。


    你可以繞過「法定成人年齡」問題，方法是和父母之一或監護人一起開帳戶。這就像擁有限制性駕照，你可以控制汽車，但乘客座得坐一個大人來為你加油，或者在你偏離車道時對你大叫。


    假設你已經開了監護人帳戶，簽了必要的文件，把你想投資的金額交給經紀人，並告訴經紀人你對迪士尼感興趣。全方位服務的經紀人會在專用電腦上鍵入迪士尼，讀有關這家公司的最新消息給你聽。


    他或她也會給你公司內部專家或分析師準備的迪士尼研究報告，如果這些分析師真正下了功夫，這會是很寶貴的資訊來源。


    有可能分析師當時不喜歡迪士尼，認為它價格太高、或主題公園的遊客太少會影響公司獲利。也可能你的經紀人會想說服你買證券商偏愛的其他股票。


    但如果你自己已用心研究過，認為迪士尼是買進的好對象，那麼你'
  - '[PAGE 151]


    不妨堅持買進它，畢竟，你花的是自己的錢。


    下一個要考慮的是，你想用什麼價格買迪士尼。同樣的，你得做選擇。你可以用「市價」買一檔股票，也就是你的買單傳到華爾街當時的任何價格。或者你可以用所謂「限價」的特定價格買進股票，希望有人接受你開的價格賣出。以限價委託買股的風險是：你以特定價格等候買進股票，但無法確定能不能買到。


    假設你的經紀人查過電腦後，告訴你迪士尼的股價是每股50美元，你決定以「市價」買進，經紀人把你的買單透過電腦傳到紐約證交所。


    紐約證交所是全世界最古老、最知名的證券交易所，位於華爾街附近的布羅德街（Broad Street）82號一座漂亮的建築，正面有希臘圓柱，是一棟讓你聯想到法院或郵政局的建築。美國還有其他證券交易所，但紐約證交所是迪士尼「掛牌」的地方——意思是迪士尼股票在這裡買賣。


    如果你偶爾到紐約市，閒來無事可以到紐約證交所參觀。一進紐約證交所就先來到一個房間，裡面陳列許多照片和展示櫃，你按鈕就可以看到這個股票交易所如何在1790年從一棵樹下開始的故事。你將聽到一些最早的投機客和馬匹交易商站在戶外的樹下，買賣馬匹、小麥、糖和各式各樣的東西，嘈雜的拍賣不間斷地進行。美國獨立戰爭後，這些交易商獲得機會拍賣政府償付戰爭經費的借據（IOU），這就是美國的市場首度出售的金融商品。


    後來華爾街築起一道圍牆以抵擋入侵者，這就是「牆街」（Wall'
  - '[PAGE 152]


    Street）的由來。樹下的交易商都很能吃苦耐勞，但漸漸地他們厭倦於站在大雨和風雪中，所以移到附近的咖啡館或至少有屋頂可遮蔽的地方。隨著生意逐漸興旺，他們租下附近地下室和閣樓的空間，直到找到一個長期租賃的地點。到1864年，他們蓋了一棟建築，從此成了紐約證交所的家，離當年那棵樹所在的位置不超過擲飛盤能及的距離。


    走過那些照片和展示櫃時，你也聽完導遊做完簡短的介紹，現在可以參觀訪客走廊，那裡是最有趣的的部分。你從一片巨大的觀看窗看出去，可以鳥瞰100呎下的交易大廳，所有的交易都在那裡進行。交易廳看起來有一座足球場那麼長，忙亂和嘈雜的程度就像比賽正在進行的體育場。


    股票交易所裡的人穿著球鞋和多種顏色的工服；有數百人忙進忙出，揮舞手臂，叫嚷著吸引彼此的注意，而不到處走動的人則聚集在大廳各處稱作「站」（post）的 地方。每一個交易站有一部掛在頭頂上的電視機，由錯綜複雜的支架和管線支撐著，電視螢幕上顯示超過2,500家公司的股票交易情況。


    你可以從訪客參觀區看到迪士尼的交易站，如果你搭電梯下樓，設法避開安全警衛，就可以很快來到交易大廳，擠進人群中，親自購買一股迪士尼股票。不過，實際運作的方式不是這樣，你的買賣單必須透過經紀商傳到這些穿著工作服的交易員，由他們進行買賣，有時候他們也為自己交易，但大多是為像你這樣、從世界各地把買賣單傳進來的顧客。


    交易站的例行工作數十年來未曾改變，你可以把它想成一場不停止'
  - '[PAGE 153]


    的拍賣，同樣的產品持續在這裡買和賣。在此處的例子裡，產品就是迪士尼股票。


    假設迪士尼交易站的交易員喊出「49.875賣1,000」，這表示他的顧客想以每股49.875美元賣1,000股迪士尼。如果交易站的另一名交易員有顧客想以49.875美元買進1,000股，兩名交易員就達成交易。但情況不見得這麼順利，也許在當時沒有人想支付這個價格，因此想賣迪士尼股的交易員必須降價到49.75美元或49.5美元，直到他能吸引買家為止。


    或者可能有買家想以49.875美元買進，但沒有人想以那個價格賣出。在這種情況下，買家必須提高買價到50美元或50.125美元，直到買價高到足以吸引賣家。


    交易就這樣持續進行，從上午9時30分開盤直到下午4時收盤，股票每分鐘都隨著拍賣持續進行而上下跳動。一名稱為專業會員（specialist）的人，站在繁忙的交易站中央，聽著交易員喊進和喊出的價格，觀察手勢，撮合買家和賣家，並記錄每一筆交易。


    目前紐約證交所每天買賣的迪士尼股超過100萬股，其他2,600家上市公司交易的股數則超過3.38億股。你可能好奇，光靠一個站在交易站的迪士尼專業會員，怎麼可能處理如此大量的交易。答案是，他確實力有不逮。


    雖然大多數投資人不知道，但85％的買賣單是透過電腦傳到專業會員的交易站。電腦處理交易所和非交易所的交易數量愈來愈龐大，華爾街投資業者的交易部都透過電腦，直接與其他業者的交易部交'
  - '[PAGE 154]


    易。當你從訪客走廊往下看交易廳時，你所見多彩多姿的交易景象正快速變成歷史陳跡。


    有了完善的電腦網路後，你就不需要數百人穿著運動鞋跑來跑去，喊到喉嚨沙啞了。所有股票的買賣都可以在電腦螢幕上進行，而且絕大多數已經如此。


    紐約證交所有一套供小額交易的特別撮合系統，可處理類似你的交易。你購買迪士尼的買單直接被傳到紐約證交所的電腦，它會自動與來自別處的賣單撮合。


    股票交易完全匿名，不像你在跳蚤市場或車庫拍賣，在股票市場你永遠不會與另一方面對面。也許這樣最好，因為你不必坐在那裡聽迪士尼股的賣家告訴你為什麼要賣股票，就像你買二手車時聽鄰居談他為什麼要賣車。


    交易對手賣出你買進的股票可能有許多原因，也許他需要錢支付大學學費，或重新裝潢住家，或去度假。也許他不喜歡最新的迪士尼電影，對於公司前景他不如你樂觀。也可能他發現另一檔更想擁有的股票。但不管他賣出的動機如何，那應該不干你的事。如果你已經做過研究，你知道自己為什麼要買。


    等電腦撮合你和賣家的交易後，成交的消息將從交易系統電視螢幕下方的電子跑馬燈上跑過。你看過那些不斷從跑馬燈跑過的數字嗎？每一個數字都是一筆真正的股票交易記錄。例如「迪士尼，50，$50」代表50股迪士尼股票剛以每股50美元賣出。所以如果你以50美元的價格買進50股迪士尼股票，全世界都會看到它，因為你'
  - '[PAGE 155]


    的「迪士尼，50，$50」記錄，就會在證券商和投資公司的電視螢幕電子跑馬燈上跑過，不管是在波士頓或北京的公司都一樣。


    為康寶濃湯（Campbell''s Soup，另一家很棒的上市公司）畫罐子的著名畫家沃荷（Andy Warhol）曾說，我們周遭圍繞這麼多媒體，每個人都應該出名15分鐘。沃荷只是在開玩笑，但每筆50股以上的股票交易都可以在全世界出名五秒鐘。


    # 其他交易股票的地方


    一百年前，美國有許多證券交易所，其中包括兩家最大的，紐約證券交易所和美國證券交易所。當時密爾瓦基有一家、舊金山、費城、第蒙（Des Moines）和達拉斯也各有一家。股票迷可以利用休假時到全國各地的交易所參觀交易盛況，就像棒球迷到不同的球場觀賞比賽一樣。但小交易所逐漸喪失重要性，大多數悄悄關門。


    今日的兩大交易所是紐約證交所和那斯達克股市（Nasdaq）。Nasdaq這個縮寫代表「證券自營商全國協會自動報價系統」（National Association
    of Securities Dealers Automated Quotations System），你可以考倒許多人——Nasdaq代表什麼？——因為連華爾街的許多專業人士也答不出來。就因為很繞口，所以從沒有人說全名。


    在過去，規模太小、無法在一般證券交易所上市的公司，就會在鄰近的股票行出售它們的股票，交易就在櫃檯的兩邊進行。底特律的買家可能為同一天買的同樣股票，支付比在聖東尼奧貴10%到20%的價格，只因為人們沒有最新的行情收報機可以追蹤最新的價格。'
  - '[PAGE 156]


    櫃檯市場是當時賭徒和狂熱投機客的最愛，但一般的投資人會聰明地避而遠之。


    櫃檯市場的經理人最早看出，電腦可以為股票交易帶來革命性的變革，他們發現股票交易不需要像紐約證交所那麼龐大的交易廳，也不需漂亮的建築，或幾百個穿著工作服的交易員忙進忙出，揮舞著手臂叫賣。他們需要的只是幾部電腦終端機，和足夠的人坐在終端機前在螢幕上進行交易。普列斯托（Presto）、那斯達克都有自己的電子交易廳，就技術上來說，那不是交易廳，而是電腦網路。


    當你想買一家在那斯達克交易的公司股票，例如微軟，你的經紀人會把你的買單傳進那斯達克電腦系統，那裡把所有想買進或賣出微軟股票的買賣單都列在螢幕上。那斯達克的「造市者」（market
    maker）便坐在自己辦公室的終端機前撮合交易，他們可能身在美國的任何地方。


    紐約證交所的專業會員必須站在他的交易站整天，腳可能站到抽筋，而那斯達克的造市者可以坐在舒服的椅子上工作。紐約證交所的專業會員扮演撮合者的角色，那斯達克的造市者則充當每一筆股票交易的中間人。他向賣家買進股票，並立即以略高的價格賣出股票給買家。價格的差距就是他的利潤，稱作「價差」（spread）。


    在那斯達克創立以來的二十五年間，它的系統成長十分迅速，今日已是紐約證交所最大的對手，也是美國第二忙碌的股市。許多名不見經傳的小公司在1970年代和1980年代從那斯達克發跡——微軟、蘋果、MCI、英特爾等——今日已變成僱用數萬名員工、每年銷售數百億美元產品、揚名全世界的企業巨人。他們還在那斯達克交'
  md: '

    投資人不可能追蹤在美國主要交易所掛牌的所有公司，因此不管是業餘或專業投資人都必須縮小選擇，只專注在少數種類的公司。例如，有些投資人只買會經常提高股利的公司股票，有些人則專找盈餘每年成長至少20%的公司。


    你可以專攻某個產業，例如電氣設備或餐廳或銀行。你可以專精在小公司或大公司、新公司或舊公司。你可以專攻在艱困時期沒落、並嘗試東山再起的公司（這類公司稱作「轉機」〔turnaround〕公司），專攻的方法則有百百種。


    投資並非精確的科學，不管多努力研究數字、了解公司過去的績效，你永遠無法確定它未來的表現。明日會發生的事永遠只是揣測，投資人的職責是做有根據的揣測而不盲目。你的工作是挑選股票，並且不以過高的價格買進，然後密切注意公司發布的利多或利空消息。你可以運用知識把風險降到最低。


    ## 真正擁有股票


    你可以每天玩股市遊戲，但真正擁有股票的刺激沒有任何事能取代。人們記得買第一檔股票就像記得初吻一樣。不管以後你會擁有幾十檔股票，你永遠忘不了初次擁有的股票。


    在這時，如果有任何事阻止你，那一定是錢。年輕人有時間投資，但不一定有錢。那牽涉的不只是有閒錢可投入股市，而是你可以生活無虞地挪出可以投入許多年的錢，以便讓錢增值。如果你有兼職工作，有能力投資部分薪水在股票最好。如果不是，你可能得找個好時機向家人開口了。


    這是父母、祖父母、姨嬸和叔舅可以扮演重要角色的地方。年輕人投資資金的最大來源是親人。當他們問你想要什麼生日禮物、耶誕禮物、光明節禮物等等時，告訴他們你要股票。讓他們知道如果可以選擇擁有一雙新耐吉鞋或一張耐吉股票（價值約等於一雙鞋）時，你寧可擁有股票。


    這保證會出乎多數大人的意料，他們會對你的有遠見和成熟感到驚訝。如果他們自己也擁有股票，他們可以轉移一股或許多股給你，助你踏上投資之路。辦理手續很簡單，不必支付手續費或佣金。每個世代都有許多年輕人以這種方式展開投資，藉由長輩送給他們第一張股票。


    有些祖父母定期送給孫兒女股票。但也有許多祖父母以儲蓄債券取代股票。如果你有這種祖父母，應該告訴他們，送績優公司的股票會更好，原因是我們前面討論過的，股票有許多凌駕債券的優點。


    雖然有父母或祖父母定期送給少量股票，年輕人仍很難自己購買少量股票。事實上，直到不久前，年輕投資人仍不被鼓勵買股票，因為有兩個障礙：第一，大多數股票交易由證券經紀商處理，必須滿21歲才能在經紀商開戶；第二，大多數經紀商收取額外佣金，25美元到40美元不等。如果你買一股47美元的百事股票，必須支付經紀商40美元佣金，幾乎和股票的價格一樣。成功的投資人不可能花87美元買47美元的股票。


    這種不利投資的情況正在改變，因為公司已開始繞過經紀商，直接出售少量股票給大眾。畢竟，如果麥當勞可以賣給你漢堡，為什麼不能賣給你它的股票？


    已經有80家公司採取所謂的直接投資計畫，讓個人可直接購買少量股票，並支付遠低於經紀商佣金的手續費，甚至完全無需支付。這是華爾街從1960年代邀請披頭四（Beatles）到交易大廳以來，對年輕人最大的貢獻了。根據帶頭提倡直接投資計畫的第一芝加哥信託公司副總裁弗爾普（Jim
    Volpe），至少還有850家公司已表示有意加入直接售股給大眾的行列，且持續增加中。相關的法律阻礙已被劃平。


    你可能無法透過直接投資計畫只買一股股票，因為大部分公司要求最低購買250美元到1,000美元，視不同公司而定，所以你必須把錢存起來，直到你有250美元或達到要求的金額。但想到直接投資計畫遠為低廉的佣金，這只是個小缺點而已。


    最棒的是，一旦你初次購買後，你隨時可以直接向這家公司購買股票，不用支付分文佣金。且每當這家公司發放股利時，你的股利會透過股利再投資計畫自動轉換成更多股票。在大部分情況下，你直接與公司的股權轉移代理商打交道，不涉及股票經紀商。


    繼續注意這個令人振奮的新計畫，它將讓數百萬名原本被阻隔在股市外的人變成股票投資人。


    如果你仍想一次買一股股票，有一套計畫可以讓你這麼做。但你的家庭必須先加入全國投資人協會（National Association of Investors
    Corporation, NAIC），此協會是美國各地數百個投資俱樂部的支援團體。


    截至1996年1月，加入協會的年費為35美元。個人會員或家庭每年支付14美元後，立即自動訂閱一份稱為《卓越投資》（Better Investing）的月刊，裡面有各種協助你成為更佳選股人的有用資訊。這些資訊大多適合有經驗的投資人，但有些也適合新手，可讓你獲益良多。除了月刊，你也有機會購買151家公司中任一家的一股到十股股票，每筆交易只需支付7美元的手續費。


    這個「買一股股票計畫」是專為兒童所設計，雖然它還有年齡限制問題。各州的規定不盡相同，但你可能必須滿18歲或21歲才能自己購買股票。否則需要父母之一或監護人代理你買股——他們之一必須加入俱樂部成為會員。


    這個計畫運作的方式如下：NAIC提供你可以買的151家公司名單，你決定想買哪一檔股票，弄清楚每股的價格，然後把買進的清單寄給NAIC，連同你買股票金額的支票，再加上10美元的股價「波動」。舉例來說，如果麥當勞目前的股價是40美元，你得寄出57美元。


    為什麼額外加上10美元？如果股價在你寄出信件到處理買單之間上漲，多餘的錢將用於彌補差額。不管如何，10美元不會被浪費。不管你買了第一股股票後還剩下多少錢，將用來買另一股的一部分。所以最後你可能買到1
    1/16股，或1 1/8股，或1 1/4股。


    這時候NAIC不參與其中，你是直接與溫蒂或麥當勞、或任何你買股公司的代表（股權轉移代理商）交涉。由於NAIC名單上的公司都有股利再投資計畫，只要公司支付股利，你就會額外獲得一小部分股票。你也可以隨時購買更多股股票，只支付極少的手續費，甚至免手續費。


    如果你決定出售持股，可以透過股票經紀商出售（同樣的，高佣金可能使你拒絕這個選項），或以書面通知公司的代理商，他們將在第二天預定的時間、以當時的價格賣出股票。你要等股票賣出後才知道價格是多少。


    只要你已經不厭其煩加入NAIC，應該沒有什麼事會阻止你加入它的投資俱樂部。NAIC的會員俱樂部遍布美國各都市、城鎮和學校，甚至某些監獄也有。


    參與投資俱樂部就像加入股市遊戲的隊伍，差別是如果加入俱樂部，你投資的是真正的錢。大多數俱樂部一個月在會員家裡聚會一次，擬訂最新的選股構想。會員以多數決投票決定買賣哪些股票。


    每個會員同意每月投資固定的金額，可能是50美元或100美元——由多數票決定。結果證明，大多數人在俱樂部裡的投資績效比自己投資好。這是因為俱樂部讓他們更有紀律，他們不能在驚慌中賣股，團體裡較冷靜的人會投票反對。如果不能說服團體某股票值得買進，就不能買股票。這會強迫會員做功課。如果有人說：「我建議買迪士尼，因為我在市場聽到有人報明牌。」他會引來眾人的嘲笑。


    要成為投資俱樂部的會員，你至少要18歲，這一點我們已經說過，但即使你還未滿18歲，也可以參加聚會、推薦股票，在討論中發表意見。如果已超過法定年齡的俱樂部會員願意當你的監護人，你就可以透過監護人的帳戶投資你自己的錢。


    ## 在證券交易所買股票


    如果有人要你列出美國不能缺少一、兩個月的五個機構，你會怎麼回答？軍隊？警察？國會？法院？電力公司？自來水事業？醫院？閉眼想一分鐘，列出你的五個選擇，先別看下一段。


    你是否把股市或債市列入清單？大多數人不會列入。當我們思考給我們食物、汽油、住所、通訊、阻止盜賊上門的基本服務時，不會馬上想到華爾街。但事實是，金融市場對所有人的生活都極其重要，而不只對債券和股票持有人如此。白宮可以放假一個月，世界仍會照常運轉，但若沒有股市或債市，整個經濟體系將停頓。


    如果沒有市場、沒有買家，必須出售股票籌措現金的公司或個人將周轉不靈。已經背負5兆美元債務的美國政府，將無法像平日那樣出售債券以支應其開銷。它將只有兩種選擇，而且都不是好選擇：一種是印製大量新鈔，讓美元貶值，並使物價一飛沖天；另一種則是停止償還債務，使數百萬名美國人失去主要收入來源。公司將破產，銀行也可能倒閉。失控的民眾衝到最近的銀行搶救他們的錢，卻發現銀行已經沒錢可領。商店將關門、工廠停工，數百萬人將失業。他們將遊蕩街頭，尋找垃圾箱裡吃剩的披薩餅。我們所知的文明將很快結束，只因為金融市場關閉。因此這些市場的重要性遠超過我們的認知，沒有它們，我們無法長久生存。


    ## 經紀人的角色


    假設你有足夠的資金購買股票，所以適合遵循正規的買股票途徑——透過經紀人。如果你對投資很認真，你終究會來到這個階段。經紀人是你進入股市的管道，他們是今日世界不可或缺的角色。


    由於你無法自己走進股市買賣股票，必須透過證券經紀公司的經紀人才能辦到。你已經聽過這些名字：美林（Merrill Lynch）、美邦（Smith Barney）、嘉信理財（Charles
    Schwab）等。


    像這些證券經紀商嘗試給人歷史悠久、相當穩定的印象，事實上它們經常合併和改變名稱。這是一個變遷迅速、業者經常合縱連橫、不適者難以生存的行業。


    主要證券商都交易股票、債券、共同基金，且必須遵守政府制訂的規範。除此之外，它們彼此有著懸殊的差異。所謂的全方位服務證券商如美林或美邦，收取的手續費高於「折扣經紀商」如嘉信。近來還有「大折扣經紀商」，提供的服務更少。


    你支付全方位服務證券商較高的費用，讓你有權利用該券商的諮詢。大致說來，折扣證券商不提供諮詢，他們只根據你的指示買賣股票。


    這時候你得做另一個決定。除了挑選你的第一檔股票，你還要善加挑選經紀人。最好的方法是和你附近地區的幾個經紀人談過——尤其是你朋友或親戚推薦的經紀人。如果你不喜歡談過的第一個經紀人，附近還有很多人選可挑。有些經紀人經驗很豐富，對投資股票懂很多，有些則剛從短期訓練課程結業，對市場瞭解很少。和經紀人保持良好關係是投資樂趣的一部分。


    解決了證券經紀商和經紀人的問題後，下一步是開帳戶。這帶我們碰上另一個障礙：除非你已經21歲，否則你不能擁有自己的帳戶。在大多數州，投資年齡和喝酒年齡一樣。你16歲就可以開車，16歲也可以從軍，但除非你達到「法定成人年齡」，否則不能和經紀人做生意。


    你可以繞過「法定成人年齡」問題，方法是和父母之一或監護人一起開帳戶。這就像擁有限制性駕照，你可以控制汽車，但乘客座得坐一個大人來為你加油，或者在你偏離車道時對你大叫。


    假設你已經開了監護人帳戶，簽了必要的文件，把你想投資的金額交給經紀人，並告訴經紀人你對迪士尼感興趣。全方位服務的經紀人會在專用電腦上鍵入迪士尼，讀有關這家公司的最新消息給你聽。


    他或她也會給你公司內部專家或分析師準備的迪士尼研究報告，如果這些分析師真正下了功夫，這會是很寶貴的資訊來源。


    有可能分析師當時不喜歡迪士尼，認為它價格太高、或主題公園的遊客太少會影響公司獲利。也可能你的經紀人會想說服你買證券商偏愛的其他股票。


    但如果你自己已用心研究過，認為迪士尼是買進的好對象，那麼你不妨堅持買進它，畢竟，你花的是自己的錢。


    下一個要考慮的是，你想用什麼價格買迪士尼。同樣的，你得做選擇。你可以用「市價」買一檔股票，也就是你的買單傳到華爾街當時的任何價格。或者你可以用所謂「限價」的特定價格買進股票，希望有人接受你開的價格賣出。以限價委託買股的風險是：你以特定價格等候買進股票，但無法確定能不能買到。


    假設你的經紀人查過電腦後，告訴你迪士尼的股價是每股50美元，你決定以「市價」買進，經紀人把你的買單透過電腦傳到紐約證交所。


    紐約證交所是全世界最古老、最知名的證券交易所，位於華爾街附近的布羅德街（Broad Street）82號一座漂亮的建築，正面有希臘圓柱，是一棟讓你聯想到法院或郵政局的建築。美國還有其他證券交易所，但紐約證交所是迪士尼「掛牌」的地方——意思是迪士尼股票在這裡買賣。


    如果你偶爾到紐約市，閒來無事可以到紐約證交所參觀。一進紐約證交所就先來到一個房間，裡面陳列許多照片和展示櫃，你按鈕就可以看到這個股票交易所如何在1790年從一棵樹下開始的故事。你將聽到一些最早的投機客和馬匹交易商站在戶外的樹下，買賣馬匹、小麥、糖和各式各樣的東西，嘈雜的拍賣不間斷地進行。美國獨立戰爭後，這些交易商獲得機會拍賣政府償付戰爭經費的借據（IOU），這就是美國的市場首度出售的金融商品。


    後來華爾街築起一道圍牆以抵擋入侵者，這就是「牆街」（Wall Street）的由來。樹下的交易商都很能吃苦耐勞，但漸漸地他們厭倦於站在大雨和風雪中，所以移到附近的咖啡館或至少有屋頂可遮蔽的地方。隨著生意逐漸興旺，他們租下附近地下室和閣樓的空間，直到找到一個長期租賃的地點。到1864年，他們蓋了一棟建築，從此成了紐約證交所的家，離當年那棵樹所在的位置不超過擲飛盤能及的距離。


    走過那些照片和展示櫃時，你也聽完導遊做完簡短的介紹，現在可以參觀訪客走廊，那裡是最有趣的的部分。你從一片巨大的觀看窗看出去，可以鳥瞰100呎下的交易大廳，所有的交易都在那裡進行。交易廳看起來有一座足球場那麼長，忙亂和嘈雜的程度就像比賽正在進行的體育場。


    股票交易所裡的人穿著球鞋和多種顏色的工服；有數百人忙進忙出，揮舞手臂，叫嚷著吸引彼此的注意，而不到處走動的人則聚集在大廳各處稱作「站」（post）的 地方。每一個交易站有一部掛在頭頂上的電視機，由錯綜複雜的支架和管線支撐著，電視螢幕上顯示超過2,500家公司的股票交易情況。


    你可以從訪客參觀區看到迪士尼的交易站，如果你搭電梯下樓，設法避開安全警衛，就可以很快來到交易大廳，擠進人群中，親自購買一股迪士尼股票。不過，實際運作的方式不是這樣，你的買賣單必須透過經紀商傳到這些穿著工作服的交易員，由他們進行買賣，有時候他們也為自己交易，但大多是為像你這樣、從世界各地把買賣單傳進來的顧客。


    交易站的例行工作數十年來未曾改變，你可以把它想成一場不停止的拍賣，同樣的產品持續在這裡買和賣。在此處的例子裡，產品就是迪士尼股票。


    假設迪士尼交易站的交易員喊出「49.875賣1,000」，這表示他的顧客想以每股49.875美元賣1,000股迪士尼。如果交易站的另一名交易員有顧客想以49.875美元買進1,000股，兩名交易員就達成交易。但情況不見得這麼順利，也許在當時沒有人想支付這個價格，因此想賣迪士尼股的交易員必須降價到49.75美元或49.5美元，直到他能吸引買家為止。


    或者可能有買家想以49.875美元買進，但沒有人想以那個價格賣出。在這種情況下，買家必須提高買價到50美元或50.125美元，直到買價高到足以吸引賣家。


    交易就這樣持續進行，從上午9時30分開盤直到下午4時收盤，股票每分鐘都隨著拍賣持續進行而上下跳動。一名稱為專業會員（specialist）的人，站在繁忙的交易站中央，聽著交易員喊進和喊出的價格，觀察手勢，撮合買家和賣家，並記錄每一筆交易。


    目前紐約證交所每天買賣的迪士尼股超過100萬股，其他2,600家上市公司交易的股數則超過3.38億股。你可能好奇，光靠一個站在交易站的迪士尼專業會員，怎麼可能處理如此大量的交易。答案是，他確實力有不逮。


    雖然大多數投資人不知道，但85％的買賣單是透過電腦傳到專業會員的交易站。電腦處理交易所和非交易所的交易數量愈來愈龐大，華爾街投資業者的交易部都透過電腦，直接與其他業者的交易部交易。當你從訪客走廊往下看交易廳時，你所見多彩多姿的交易景象正快速變成歷史陳跡。


    有了完善的電腦網路後，你就不需要數百人穿著運動鞋跑來跑去，喊到喉嚨沙啞了。所有股票的買賣都可以在電腦螢幕上進行，而且絕大多數已經如此。


    紐約證交所有一套供小額交易的特別撮合系統，可處理類似你的交易。你購買迪士尼的買單直接被傳到紐約證交所的電腦，它會自動與來自別處的賣單撮合。


    股票交易完全匿名，不像你在跳蚤市場或車庫拍賣，在股票市場你永遠不會與另一方面對面。也許這樣最好，因為你不必坐在那裡聽迪士尼股的賣家告訴你為什麼要賣股票，就像你買二手車時聽鄰居談他為什麼要賣車。


    交易對手賣出你買進的股票可能有許多原因，也許他需要錢支付大學學費，或重新裝潢住家，或去度假。也許他不喜歡最新的迪士尼電影，對於公司前景他不如你樂觀。也可能他發現另一檔更想擁有的股票。但不管他賣出的動機如何，那應該不干你的事。如果你已經做過研究，你知道自己為什麼要買。


    等電腦撮合你和賣家的交易後，成交的消息將從交易系統電視螢幕下方的電子跑馬燈上跑過。你看過那些不斷從跑馬燈跑過的數字嗎？每一個數字都是一筆真正的股票交易記錄。例如「迪士尼，50，$50」代表50股迪士尼股票剛以每股50美元賣出。所以如果你以50美元的價格買進50股迪士尼股票，全世界都會看到它，因為你的「迪士尼，50，$50」記錄，就會在證券商和投資公司的電視螢幕電子跑馬燈上跑過，不管是在波士頓或北京的公司都一樣。


    為康寶濃湯（Campbell''s Soup，另一家很棒的上市公司）畫罐子的著名畫家沃荷（Andy Warhol）曾說，我們周遭圍繞這麼多媒體，每個人都應該出名15分鐘。沃荷只是在開玩笑，但每筆50股以上的股票交易都可以在全世界出名五秒鐘。


    ## 其他交易股票的地方


    一百年前，美國有許多證券交易所，其中包括兩家最大的，紐約證券交易所和美國證券交易所。當時密爾瓦基有一家、舊金山、費城、第蒙（Des Moines）和達拉斯也各有一家。股票迷可以利用休假時到全國各地的交易所參觀交易盛況，就像棒球迷到不同的球場觀賞比賽一樣。但小交易所逐漸喪失重要性，大多數悄悄關門。


    今日的兩大交易所是紐約證交所和那斯達克股市（Nasdaq）。Nasdaq這個縮寫代表「證券自營商全國協會自動報價系統」（National Association
    of Securities Dealers Automated Quotations System），你可以考倒許多人——Nasdaq代表什麼？——因為連華爾街的許多專業人士也答不出來。就因為很繞口，所以從沒有人說全名。


    在過去，規模太小、無法在一般證券交易所上市的公司，就會在鄰近的股票行出售它們的股票，交易就在櫃檯的兩邊進行。底特律的買家可能為同一天買的同樣股票，支付比在聖東尼奧貴10%到20%的價格，只因為人們沒有最新的行情收報機可以追蹤最新的價格。


    櫃檯市場是當時賭徒和狂熱投機客的最愛，但一般的投資人會聰明地避而遠之。


    櫃檯市場的經理人最早看出，電腦可以為股票交易帶來革命性的變革，他們發現股票交易不需要像紐約證交所那麼龐大的交易廳，也不需漂亮的建築，或幾百個穿著工作服的交易員忙進忙出，揮舞著手臂叫賣。他們需要的只是幾部電腦終端機，和足夠的人坐在終端機前在螢幕上進行交易。普列斯托（Presto）、那斯達克都有自己的電子交易廳，就技術上來說，那不是交易廳，而是電腦網路。


    當你想買一家在那斯達克交易的公司股票，例如微軟，你的經紀人會把你的買單傳進那斯達克電腦系統，那裡把所有想買進或賣出微軟股票的買賣單都列在螢幕上。那斯達克的「造市者」（market
    maker）便坐在自己辦公室的終端機前撮合交易，他們可能身在美國的任何地方。


    紐約證交所的專業會員必須站在他的交易站整天，腳可能站到抽筋，而那斯達克的造市者可以坐在舒服的椅子上工作。紐約證交所的專業會員扮演撮合者的角色，那斯達克的造市者則充當每一筆股票交易的中間人。他向賣家買進股票，並立即以略高的價格賣出股票給買家。價格的差距就是他的利潤，稱作「價差」（spread）。


    在那斯達克創立以來的二十五年間，它的系統成長十分迅速，今日已是紐約證交所最大的對手，也是美國第二忙碌的股市。許多名不見經傳的小公司在1970年代和1980年代從那斯達克發跡——微軟、蘋果、MCI、英特爾等——今日已變成僱用數萬名員工、每年銷售數百億美元產品、揚名全世界的企業巨人。他們還在那斯達克交

