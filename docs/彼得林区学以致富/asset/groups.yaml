    的肥皂公司當推銷員。除了肥皂，這家公司也製造烘焙發粉，而為了促銷發粉，他們會免費贈送烹飪食譜。這種烘焙發粉大受歡迎，他們決定放棄肥皂業務。


    有一度他們停止贈送烹飪食譜，改送口香糖。這種口香糖又大受歡迎，所以他們又放棄烘焙發粉，改賣口香糖。


    瑞格理的荷蘭薄荷口香糖在1893年問世，但和可口可樂一樣，並不是一開始就大紅大紫。不過，到了1910年，它已經成了美國最受歡迎的品牌。1915年，為了進一步提振銷售，瑞格理寄給美國電話簿上登記的每個人一份免費樣品。


    ## 康寶濃湯


    約翰·多蘭斯（John T. Dorrance）博士是個化學迷，他拒絕四所大學的教授職聘約，到他叔叔亞瑟（Arthur Dorrance）與康寶（Joseph
    Campbell）擁有的肥皂公司工作。多蘭斯發明製造濃縮肥皂的製程，然後買下他叔叔的股份，變成公司唯一的業主。顯然他叔叔做了一個錯誤的決定，因為康寶公司的盈餘繼續成長，到今日變成一家年營收114億美元的公司。


    多蘭斯在閒暇之餘是個狂熱的選股人，他聽從股票經紀人的建議，在1929年之前賣光他的股票。這是股票經紀人有史以來給過的最好建議。


    ## 利惠公司


    史特勞斯（Levi Strauss）是來自德國巴伐利亞的移民。他用帆布製作褲子，賣給在1849年淘金熱時來到加州想致富的探礦人。大部分探礦人最後都空手而返，但史特勞斯卻靠他的藍色牛仔褲致富。他在1873年申請到斜紋布牛仔褲的專利。


    史特勞斯的公司直到1971年以前都是私人公司，他賣出股份掛牌上市後，又在1985年買回股份下市。


    利惠、康寶濃湯、箭牌口香糖和可口可樂都創立於一百多年前，當時的世界還不像今日這樣複雜，也沒有那麼多律師會阻礙進步。但這不表示你在現代就不能白手起家。班傑瑞（Ben
    & Jerry）、蓋茲和馬庫斯（Bernard Marcus）就各自創立了冰淇淋、軟體和五金商店的王國。


    ## 班傑瑞如何闖出天下


    班．考亨（Ben Cohen）和傑瑞．格林菲爾德（Jerry Greenfield）在長島的七年級體育課上初次認識，幾年後他們變成嬉皮。班從大學退學，開過計程車、煎過漢堡肉、抹地板、當賽車場警衛，學過陶藝。他曾住在阿第倫達克山區（Adirondacks）的一棟木屋，有木製壁爐，卻沒有水管。他有一顆寬大的心，和同樣也不小的肚子。


    另一方面，傑瑞唸完俄亥俄州歐伯林學院（Oberlin College），他在那裡除了學習正規的學科外，還學會玩小魔術和耍把戲。他申請讀醫學院卻遭拒絕，他接受一份把牛心塞進試管的工作。他比班瘦，而且早在邋遢外表開始流行前就一副邋遢樣了。


    兩人的命運在紐約州薩拉托加泉（Saratoga Springs）再度交會，並且決定既然兩人都沒有更好的事情做，為什麼不開一家冰淇淋餐廳？傑瑞花5美元上了一個郵購課程，學習如何製造冰淇淋。他們花掉6,000美元積蓄，加上向班的父親借的2,000美元，自己動手為佛蒙特州伯靈頓的一座舊加油站修屋頂、漆牆壁，將它改名為一勺店（Scoop
    Shop），當時是1978年。


    來到一勺店的人忍不住一勺一勺地享受班與傑瑞的冰淇淋。他們的冰淇淋又濃又多奶油，裡面充滿大塊水果或巧克力，或他們加進的各種東西。那是高脂肪和高膽固醇的配方，但在1978年，人們不在乎膽固醇，所以他們大快朵頤班傑瑞的冰淇淋而沒有罪惡感。不久後，班和傑瑞賣的冰淇淋已多到那個加油站應付不了。他們決定蓋一座冰淇淋工廠。原本他們可以找創投資本家籌募資金，後來決定直接股票上市。在1984年，他們以每股10.50美元賣出7.35萬股股票，籌措大約75萬美元，這對大企業來說是九牛一毛，但蓋一座他們需要的工廠已經綽綽有餘。


    為了確保公司由當地人擁有，他們規定只有佛蒙特州居民能在首次公開發行中買股票。佛蒙特不是富有的州，所以許多投資人只買1股——他們只買得起這麼多。十年後，他們的股票價值已經是當初買進的十倍。


    班傑瑞是有史以來最有趣的上市公司之一。老闆穿著T恤和連身褲上班，從來不穿西裝——他們沒有任何西裝。他們把一種冰淇淋取名為櫻桃賈西亞，以表示對死之華合唱團（Grateful
    Dead）搖滾巨星傑瑞·賈西亞（Jerry Garcia）的尊崇。在年度股東會上，班會躺下來，肚子上放一塊磚，讓傑瑞用一只大鎚把磚頭打碎。


    你分辨不出主管和一般員工的差別，停車場裡停滿車身有凹痕的福斯汽車，高層主管的薪資以一般標準來看偏低——他們的哲學是人人都有賺錢生活的權利，但沒有人有不勞而獲、狠賺一票的權利。薪資差別縮小創造出勞工與管理階層間的融洽關係，也讓週末的派對更加歡樂。


    班與傑瑞把搖滾樂帶進工廠，以激勵員工跳舞和拿出最好的表現。他們夏季時在伯靈頓播放免費戶外電影。他們從當地農戶買了那麼多牛奶，振興了整個佛蒙特州的酪農業。他們甚至用較高的價錢買牛奶以幫助農民，並把7.5％的年獲利作為慈善用途。


    除了美國以外，還有哪個國家的兩個嬉皮可以投資5美元在郵購課程，然後打造出全國第三大的冰淇淋工廠？數年前這家公司出現中年危機：人們發現膽固醇有礙健康後，不再吃那麼多讓班傑瑞成名的富含奶油的冰淇淋。


    公司也順應時代改變，推出一系列酸乳酪和低脂產品，取代過去顧客讚不絕口的高奶油冰淇淋。


    1994年，班卸下執行長職務，雖然他的工作一直比較像是冰淇淋品嚐長。公司舉辦選拔接班人的比賽，要想贏得這個職務，應徵者除了一般的履歷表外，還必須寄一些有趣的東西。最後贏得這工作的人寫了一首詩。


    ## 微軟


    蓋茲（Bill Gates）1955年生於華盛頓州貝爾優市（Bellevue）附近，唸附近的湖濱中學（Lakeside School）。湖濱有一間電腦實驗室，這在1960年代很不尋常，而蓋茲充分利用了這個優勢。


    蓋茲對電腦十分痴迷、專注，把全部精神用在上面。他把大部分時間花在實驗室裡，和比他大兩屆的朋友兼夥伴艾倫（Paul Allen）一起做研究。蓋茲對電腦如此執迷，他的父母被迫下令他必須暫時不能碰電腦。不情願的蓋茲遵守父母的禁令，但這只是更加深他對電腦的熱愛。


    不久後，蓋茲和艾倫又沉浸在他們最喜歡的實驗，研究當時才出現不久的原始硬體和軟體。市面上買不到操作手冊可以指導他們——蓋茲和艾倫自己發明磁碟作業系統（DOS）。他們是軟體先驅，而在距離他們南方數百哩之處，賈伯斯和沃茲尼克正在製造蘋果電腦。


    在時髦的研究實驗室裡工作的科學家和工程師，無法做到這些穿著牛仔褲和T恤的年輕「駭客」獨力完成的事。在高中還沒畢業前，蓋茲和艾倫已成了電腦程式寫作這個新領域的專家。


    蓋茲進入哈佛大學，以為自己將來會當律師；艾倫則在新墨西哥州一家叫MITS的小電腦公司找到一份工作。蓋茲把時間用在上課、打撲克牌和上電腦室，很快他就對大學生活感到厭倦。到了終於無法忍受時，他便從哈佛退學，投靠他在新墨西哥州的老朋友。他們兩人已發明一套叫BASIC的新電腦程式語言。


    MITS僱用艾倫為英特爾生產的電腦晶片設計新的BASIC程式語言，但BASIC獲得熱烈反應，幾家不同的電腦製造商也想在自己的電腦上以它作為作業系統。這導致一場訴訟惡鬥，爭議BASIC究竟是屬於誰的：蓋茲和艾倫，或MITS？法院判決歸屬發明者，因為他們在被MITS僱用前就已開發出BASIC。現在他們可以自由銷售BASIC，並自己留住利潤了。


    蓋茲在還沒逃脫MITS的掌控前就創立了自己的公司微軟，等訴訟解決後，他把所有精力投入微軟。公司的運作缺乏制度、組織散漫，員工瘋狂地長時間工作，電腦散置在辦公室各處，但帳冊都用手寫記錄。訪客會探頭進老闆的辦公室，並問：「那個坐在蓋茲桌子後面的孩子是誰？」那孩子就是蓋茲本人。他才25歲，看起來還更年輕。


    成功接踵而來。1980年時，這家小公司和電腦巨人IBM進行嚴肅的磋商，IBM已發展一系列新個人電腦，它需要搭配一套軟體系統。蓋茲出席會議，讓IBM的主管大開眼界，並爭取到千載難逢的好合約。蓋茲和他的同事日以繼夜趕工，秘密打造出MS-DOS作業系統。


    人類曾嘗試創造統一的語言卻沒有成功，但微軟幾乎為電腦達成這個目標——MS-DOS多數個人電腦使用的語言。


    如果當初IBM夠聰明，要求擁有MS-DOS的部分權利，它的股價會比現在高得多。IBM讓微軟保留所有權利，這是微軟後來崛起成為一家百億美元公司的原由。這故事的教訓是：如果
    你準備讓某個人發大財，記得要分一杯羹。


    ## 家得寶（Home Depot）


    家得寶創始於三名韓迪丹家用品連鎖店（Handy Dan Home Center）的主管被開除時。他們相信自己可以比開除他們的人做得更好，於是自己創立類似韓迪丹的商店。韓迪丹如今已不存在，家得寶商店卻到處可見。


    這個決定只是這幾人大展鴻圖的序曲。他們說服一個創投集團集資在亞特蘭大興建第一家超級五金商店，但盛大的開幕慘遭挫折，廣告承諾每個走進大門的人都可獲得1美元，但人群稀落到一天結束時，他們還剩下一大堆零錢。在那時，即使是送錢也吸引不了美國人上家得寶。


    但不久後人群開始湧進家得寶，吸引他們的是種類繁多的商品、低廉的價格，以及訓練良好的店員可以回答從地板到泛光燈的各種問題。在衰退時多數零售商業績受到打擊，但廣受歡迎的家得寶銷售仍然大好。事實上，當衰退迫使JC潘尼百貨結束亞特蘭大附近四家購物中心時，家得寶接收所有租約，多開了四家店。


    一旦發現手上拿的是一張王牌，主事者便計劃快速擴張。他們從股市籌措資金，1981年家得寶首次公開發行股票，上市股價為每股12美元。今日這檔股票（調整一次分割股票後）每股價值3,308美元！


    在1984年，家得寶有19家店；1985年公司遭遇一些挫折，因為利潤下滑，它犯了常見的擴張過快錯誤。到1986年，它出售更多股票，並利用籌得的資金償還部分債務。三年後，它變成美國最大的家庭裝修連鎖商店。1995年時，家得寶的商店超過365家，每年銷售逾140億美元的五金產品。


    ## 還沒結束


    儘管你常聽說美國愈來愈衰弱、競爭力滑落，正逐漸喪失領導世界的地位，但美國在新創意上仍然保持領先。美國的音樂、電視和電影產業仍然是世界第一；低成本的林木產品、紙張、鋁和化學品也是第一。華爾街仍然是全世界的股票金融首都，而且正逐漸收復銀行業的領先地位，相較之下日本銀行業則面臨重重難題。


    不管你相不相信，美國鐵路運輸貨物的效率如此高，世界其他國家都爭相學習美國的做法。美國的貨運體系是世界各地貨運業的標竿。（美國的旅客載運則有許多地方需要改進。）


    美國的行動電話、電子測試設備、藥品、電信和農業機械都領先世界。美國的基因工程、半導體和醫療進步都出類拔萃。經過多年的衰落後，美國占出口市場的比率已開始回升。這表示其他國家的消費者正購買更多美國製產品。


    美國出口鋼鐵到首爾、電晶體到東京、汽車到德國；美國也賣史班德斯布料（Spendex）到義大利、腳踏車零件到孟買。世界六大洲的男人都用吉列刮鬍刀刮鬍子。天空上飛的盡是波音飛機。日本原本應該是電子大國——記憶體晶片、電視和傳真機——但日本人已經趕不上美國公司如英特爾、美光科技（Micron
    Technology）、微軟和康柏電腦（Compaq Computer）不斷冒出來的創意。


    美國在個人電腦領先世界。在軟體、工作站、雷射印表機、電腦網路和微處理器，美國也稱霸世界。


    許多美國最棒的發明來自小公司，美國在小公司的發展上也獨步全球。前面已談到幾個微軟和蘋果電腦的年輕人，如何永遠改變了電腦業。二十年後，軟體實驗室的另一群人正要讓歷史重演一遍。


    不久以前報紙和新聞雜誌還責備我們痴肥、懶惰、坐領高薪。我們有新聞自由，而新聞喜歡隱善揚惡，因為報導壞事比好事更能增加報紙銷量。


    所以我們再三聽到日本人工作比美國人勤奮，德國人也比美國人勤奮，而美國人不是在家整天坐著看電視，就是在校園裡擲飛盤（另一項美國人的偉大發明），所以其他國家即將超越美國。


    悲觀者說，美國註定變成一個什麼都不做、什麼都不會的國家，除了美國人可能還聰明到會製造插在雞尾酒杯上裝飾的小傘。


    汽車業是最明顯的問題產業。在1960年代以前，美國無論在戰爭或承平時期都最強大，汽車業也最繁榮，底特律是愛車人的聖地。但1960年代以後，美國汽車公司進步遲緩，工廠日漸老舊，工人透過強大的工會要求愈來愈高的薪資。日本人和德國人在這時以他們漂亮、製造精良、價格低廉的汽車攻擊底特律。數百萬美國消費者喜歡外國汽車，更甚於笨重、粗糙而且價格高昂的美國車。


    新聞界和學術界為文討論美國汽車業的沒落，認為那是美國生活方式沒落的表徵。最有影響力的一本書是哈伯斯坦姆（David Halberstam）的《大清算》（The
    Reckoning）。


    你可能邊讀哈伯斯坦姆的書，邊為福特、通用汽車、克萊斯勒，以及美國的未來掉眼淚；但這本書出版的1986年，也是克萊斯勒從破產邊緣絕地大反攻的一年，而福特也開始大舉振作，相對於日產（Nissan）等日本汽車製造商則開始吃敗仗。美國這個輸家又開始反敗為勝。


    有做研究且注意到這種發展的投資人，都因為買福特、克萊斯勒和通用汽車而獲利豐厚。如果他們買的時機正確，克萊斯勒的股票可能為他們賺15倍獲利，福特賺10倍，通用汽車也有3倍之多。


    這不是一年或五年就能達成的改善，而是一個極長期的趨勢。正如底特律花了很長的時間才喪失汽車業龍頭的地位，它的東山再起也需要許多年。許多人對美國汽車業捲土重來感到驚訝，但那只是因為他們不了解情況。我們聽到許多舊新聞，說日本人掌控了汽車業。但發明廂形車的不是日本人，而是克萊斯勒。發明新一代時髦、低價汽車的不是日本人，而是福特、克萊斯勒和通用汽車。重新改款吉普車（Jeep）的不是日產，而是克萊斯勒。在歐洲變成暢銷車款的不是豐田，而是福特Fiesta。


    在美國國內，日本車正逐漸喪失市場占有率，而美國汽車正開始搶回市場。


    美國人已經翻修工廠，讓它們變得更有效率。美國人的工資已經下降，製造成本也因而降低，所以美國產品可以用較低的價格來和外國產品競爭。


    過去二十年來，美國人的自信心低落，但美國的勞動力在全世界已變得最具生產力。今日美國的工人每年生產價值4.96萬美元的產品，比德國多5,000美元，比日本則多1萬美元。美國工人比德國人工時更長、休假更少；德國工人每年有五週的支薪假期。


    事實上，美國勞工如此忙碌和如此有生產力，以致於哈佛教授修爾（Juliet Schor）寫了一本書叫《工作過度的美國人》（The Overworked American）。新聞媒體很成功地說服我們相信美國人都在偷懶，尤其是與日本的工人相比之時；所以聽到有人說我們工作過度，實在令人大感驚訝。


    但這並不表示美國沒有問題。過去二十年來，美國的經濟成長率落後之前數十年的速度，最低階工作的薪資水準只有小幅上漲，甚至沒有上漲。美國城市的內城區有高犯罪率和高失業率，那裡有近半數兒童未完成學業。如果不受教育，這些人將無法爭取到由電腦和先進科技帶來的各種好工作。


    儘管這些問題很棘手，但它們不是悲觀的理由。美國社會在1940年代也有類似的悲觀氣氛，在那個戰後的年代，有1,000萬到2,000萬名美國人失去與戰爭有關的工作，例如軍職或國防工業。超過三分之一的勞動人口必須另尋工作，帶來一場遠比今日裁員潮都嚴重的就業危機，但今日報紙的標題會讓你以為美國現在的狀況比二次大戰後還淒慘。


    事實上，1950年代是對經濟和股市都很有利的十年——在20世紀僅次於1980年代。所以當時人們對未來感到悲觀和不抱期待是錯誤的，正如在1990年代上半人們錯誤的悲觀一樣。


    ## 英雄


    在學校，我們辯論哈姆雷特是英雄或懦夫，李爾王是愚蠢或被貪婬的女兒所害，拿破崙是偉大的將領或野心勃勃的暴君。但我們從未辯論華頓（Sam Walton）是壞人或英雄。華頓藉由創立沃爾瑪而致富：這是一件好事或壞事？我們又怎麼看迪士尼執行長艾斯納（Michael
    Eisner）？艾斯納是個有錢的壞人或公司救星？


    美式足球明星蒙坦納（Joe Montana）是美國名人，他因為對社會的貢獻幾乎被捧為神明。他有貢獻是不容置疑的，但被視為英雄的蒙坦納又該如何與華頓或克萊斯勒的艾科卡（Lee
    Iacocca）比較？例如，誰創造了更多就業機會？


    艾科卡從未像蒙坦納那樣，帶領美國職業足球聯盟（NFL）的隊伍在比賽的第四節反敗為勝，但他讓在1981-1982年時瀕臨破產的克萊斯勒起死回生——想像在那關鍵的時刻，要是没有艾科卡的帶領，克萊斯勒會有什麼下場？


    不只是克萊斯勒115,948名員工將被遣散回家，那些輪胎製造商、鋁與鋼鐵供應商、汽車玻璃供應商、座椅皮革供應商等等，都會因為克萊斯勒倒閉而被迫裁員。艾科卡拯救克萊斯勒可能救了超過30萬人的飯碗。蒙坦納救了多少人的飯碗？


    蒙坦納藉由吸引球迷到球場看比賽，直接造福了一些售票員和熱狗小販的生意，這當然很了不起；但艾科卡拯救的工作機會不是熱狗小販這類，它們有許多屬於高技術工作，每小時薪資超過20美元。有超過30萬名待遇優渥的工人能去度假、買第二棟房子，或有錢讓孩子上大學，艾科卡功不可沒。


    奇異公司執行長威爾許（Jack Welch）比艾爾頓強（Elton John）更重要嗎？協助默克藥廠（Merck）發展許多治療疾病新藥的瓦吉洛斯（Roy Vagelos），比茱蒂佛斯特（Jodie
    Foster）、黛安娜王妃或俠客歐尼爾（Shaquille O''Neal）重要嗎？如果用投票來決定，我會投給威爾許和瓦吉洛斯。然而在唐先生甜甜圈（Dunkin
    Donut）電視廣告上出現的糕餅師傅，可能比我們提到的大部分人還出名。


    你可能注意到，我們常提到兩種英雄——一種是創立公司的人，一種是讓公司保持營運的人。他們是今日市場的「看不見的手」，而我們相信他們會讓1776年時的亞當．史密斯感到欣慰。在其他國家與他們同類的英雄，正在世界各地執行資本主義家的任務。


    我們很遺憾看到女性和少數族群在這些英雄中只占少數，（在本書寫作時）只有一位女性擔任美國上市企業最高主管——蓋普共同創辦人費雪（Doris Fisher）。我們希望隨著愈來愈多年輕人被吸引跨入商界，女性和少數族群也會有更多掌管上市公司的機會。


    也許讀完本書後（這是指定的家庭作業），林區家的三個女兒瑪麗（Mary）、安妮（Annie）和貝絲（Beth），以及羅斯查得家的兩

    個女兒柏恩絲（Berns）和莎士佳（Sascha）會大受鼓勵，加入企業的行列。


    美國大企業領導人不是一群搶錢族、人生目的也不只是搭乘里爾噴射機（Learjet）往返世界各地的 selecionar 高爾夫球場。史密斯（Fred Smith）創立聯邦快遞（FedEx）不是因為他想賺錢，他原本就已經很有錢。他是為了接受挑戰，想創造一個比郵政局更有效率的郵遞系統。因為史密斯的成功，美國郵政局才大肆整頓。現在除了下雨、下冰雹、下冰雪和下大雪照樣遞送郵件外，郵政局甚至已經有隔夜送達的服務。


    那些經營公司的人因為賺了大錢，往往被說成壞人，被歸為銀行搶匪和騙子的同類。你可能以為他們開給自己1,000萬美元的薪水支票，帶著錢揚長而去。但實際上他們的錢並非來自薪水，這是一個被冷嘲熱諷者忽視的重點。


    在大部分例子裡，大公司的財富主要來自擁有公司股票。你在企業的位階愈高，你獲得股票以代替現金的可能性就愈高。主管也獲得「股票選擇權」（options），讓他們可以用特定的價格買更多股票。


    但這些好處只有在公司表現良好、股價上漲時，主管才享受到。如果公司表現不佳，股價下跌，這些人勢必虧錢，而且可能獲得的利益遠不如支領高薪。頒股票讓公司領導人跟股東站在同一邊，當他們從股票賺大錢時，投資人也從擁有的公司股票獲利。這是雙贏的安排。

    '
  mdcn: '

    的肥皂公司當推銷員。除了肥皂，這家公司也製造烘焙發粉，而為了促銷發粉，他們會免費贈送烹飪食譜。這種烘焙發粉大受歡迎，他們決定放棄肥皂業務。


    有一度他們停止贈送烹飪食譜，改送口香糖。這種口香糖又大受歡迎，所以他們又放棄烘焙發粉，改賣口香糖。


    瑞格理的荷蘭薄荷口香糖在1893年問世，但和可口可樂一樣，並不是一開始就大紅大紫。不過，到了1910年，它已經成了美國最受歡迎的品牌。1915年，為了進一步提振銷售，瑞格理寄給美國電話簿上登記的每個人一份免費樣品。


    ## 康寶濃湯


    約翰·多蘭斯（John T. Dorrance）博士是個化學迷，他拒絕四所大學的教授職聘約，到他叔叔亞瑟（Arthur Dorrance）與康寶（Joseph
    Campbell）擁有的肥皂公司工作。多蘭斯發明製造濃縮肥皂的製程，然後買下他叔叔的股份，變成公司唯一的業主。顯然他叔叔做了一個錯誤的決定，因為康寶公司的盈餘繼續成長，到今日變成一家年營收114億美元的公司。


    多蘭斯在閒暇之餘是個狂熱的選股人，他聽從股票經紀人的建議，在1929年之前賣光他的股票。這是股票經紀人有史以來給過的最好建議。


    ## 利惠公司


    史特勞斯（Levi Strauss）是來自德國巴伐利亞的移民。他用帆布製作褲子，賣給在1849年淘金熱時來到加州想致富的探礦人。大部分探礦人最後都空手而返，但史特勞斯卻靠他的藍色牛仔褲致富。他在1873年申請到斜紋布牛仔褲的專利。


    史特勞斯的公司直到1971年以前都是私人公司，他賣出股份掛牌上市後，又在1985年買回股份下市。


    利惠、康寶濃湯、箭牌口香糖和可口可樂都創立於一百多年前，當時的世界還不像今日這樣複雜，也沒有那麼多律師會阻礙進步。但這不表示你在現代就不能白手起家。班傑瑞（Ben
    & Jerry）、蓋茲和馬庫斯（Bernard Marcus）就各自創立了冰淇淋、軟體和五金商店的王國。


    ## 班傑瑞如何闖出天下


    班．考亨（Ben Cohen）和傑瑞．格林菲爾德（Jerry Greenfield）在長島的七年級體育課上初次認識，幾年後他們變成嬉皮。班從大學退學，開過計程車、煎過漢堡肉、抹地板、當賽車場警衛，學過陶藝。他曾住在阿第倫達克山區（Adirondacks）的一棟木屋，有木製壁爐，卻沒有水管。他有一顆寬大的心，和同樣也不小的肚子。


    另一方面，傑瑞唸完俄亥俄州歐伯林學院（Oberlin College），他在那裡除了學習正規的學科外，還學會玩小魔術和耍把戲。他申請讀醫學院卻遭拒絕，他接受一份把牛心塞進試管的工作。他比班瘦，而且早在邋遢外表開始流行前就一副邋遢樣了。


    兩人的命運在紐約州薩拉托加泉（Saratoga Springs）再度交會，並且決定既然兩人都沒有更好的事情做，為什麼不開一家冰淇淋餐廳？傑瑞花5美元上了一個郵購課程，學習如何製造冰淇淋。他們花掉6,000美元積蓄，加上向班的父親借的2,000美元，自己動手為佛蒙特州伯靈頓的一座舊加油站修屋頂、漆牆壁，將它改名為一勺店（Scoop
    Shop），當時是1978年。


    來到一勺店的人忍不住一勺一勺地享受班與傑瑞的冰淇淋。他們的冰淇淋又濃又多奶油，裡面充滿大塊水果或巧克力，或他們加進的各種東西。那是高脂肪和高膽固醇的配方，但在1978年，人們不在乎膽固醇，所以他們大快朵頤班傑瑞的冰淇淋而沒有罪惡感。不久後，班和傑瑞賣的冰淇淋已多到那個加油站應付不了。他們決定蓋一座冰淇淋工廠。原本他們可以找創投資本家籌募資金，後來決定直接股票上市。在1984年，他們以每股10.50美元賣出7.35萬股股票，籌措大約75萬美元，這對大企業來說是九牛一毛，但蓋一座他們需要的工廠已經綽綽有餘。


    為了確保公司由當地人擁有，他們規定只有佛蒙特州居民能在首次公開發行中買股票。佛蒙特不是富有的州，所以許多投資人只買1股——他們只買得起這麼多。十年後，他們的股票價值已經是當初買進的十倍。


    班傑瑞是有史以來最有趣的上市公司之一。老闆穿著T恤和連身褲上班，從來不穿西裝——他們沒有任何西裝。他們把一種冰淇淋取名為櫻桃賈西亞，以表示對死之華合唱團（Grateful
    Dead）搖滾巨星傑瑞·賈西亞（Jerry Garcia）的尊崇。在年度股東會上，班會躺下來，肚子上放一塊磚，讓傑瑞用一只大鎚把磚頭打碎。


    你分辨不出主管和一般員工的差別，停車場裡停滿車身有凹痕的福斯汽車，高層主管的薪資以一般標準來看偏低——他們的哲學是人人都有賺錢生活的權利，但沒有人有不勞而獲、狠賺一票的權利。薪資差別縮小創造出勞工與管理階層間的融洽關係，也讓週末的派對更加歡樂。


    班與傑瑞把搖滾樂帶進工廠，以激勵員工跳舞和拿出最好的表現。他們夏季時在伯靈頓播放免費戶外電影。他們從當地農戶買了那麼多牛奶，振興了整個佛蒙特州的酪農業。他們甚至用較高的價錢買牛奶以幫助農民，並把7.5％的年獲利作為慈善用途。


    除了美國以外，還有哪個國家的兩個嬉皮可以投資5美元在郵購課程，然後打造出全國第三大的冰淇淋工廠？數年前這家公司出現中年危機：人們發現膽固醇有礙健康後，不再吃那麼多讓班傑瑞成名的富含奶油的冰淇淋。


    公司也順應時代改變，推出一系列酸乳酪和低脂產品，取代過去顧客讚不絕口的高奶油冰淇淋。


    1994年，班卸下執行長職務，雖然他的工作一直比較像是冰淇淋品嚐長。公司舉辦選拔接班人的比賽，要想贏得這個職務，應徵者除了一般的履歷表外，還必須寄一些有趣的東西。最後贏得這工作的人寫了一首詩。


    ## 微軟


    蓋茲（Bill Gates）1955年生於華盛頓州貝爾優市（Bellevue）附近，唸附近的湖濱中學（Lakeside School）。湖濱有一間電腦實驗室，這在1960年代很不尋常，而蓋茲充分利用了這個優勢。


    蓋茲對電腦十分痴迷、專注，把全部精神用在上面。他把大部分時間花在實驗室裡，和比他大兩屆的朋友兼夥伴艾倫（Paul Allen）一起做研究。蓋茲對電腦如此執迷，他的父母被迫下令他必須暫時不能碰電腦。不情願的蓋茲遵守父母的禁令，但這只是更加深他對電腦的熱愛。


    不久後，蓋茲和艾倫又沉浸在他們最喜歡的實驗，研究當時才出現不久的原始硬體和軟體。市面上買不到操作手冊可以指導他們——蓋茲和艾倫自己發明磁碟作業系統（DOS）。他們是軟體先驅，而在距離他們南方數百哩之處，賈伯斯和沃茲尼克正在製造蘋果電腦。


    在時髦的研究實驗室裡工作的科學家和工程師，無法做到這些穿著牛仔褲和T恤的年輕「駭客」獨力完成的事。在高中還沒畢業前，蓋茲和艾倫已成了電腦程式寫作這個新領域的專家。


    蓋茲進入哈佛大學，以為自己將來會當律師；艾倫則在新墨西哥州一家叫MITS的小電腦公司找到一份工作。蓋茲把時間用在上課、打撲克牌和上電腦室，很快他就對大學生活感到厭倦。到了終於無法忍受時，他便從哈佛退學，投靠他在新墨西哥州的老朋友。他們兩人已發明一套叫BASIC的新電腦程式語言。


    MITS僱用艾倫為英特爾生產的電腦晶片設計新的BASIC程式語言，但BASIC獲得熱烈反應，幾家不同的電腦製造商也想在自己的電腦上以它作為作業系統。這導致一場訴訟惡鬥，爭議BASIC究竟是屬於誰的：蓋茲和艾倫，或MITS？法院判決歸屬發明者，因為他們在被MITS僱用前就已開發出BASIC。現在他們可以自由銷售BASIC，並自己留住利潤了。


    蓋茲在還沒逃脫MITS的掌控前就創立了自己的公司微軟，等訴訟解決後，他把所有精力投入微軟。公司的運作缺乏制度、組織散漫，員工瘋狂地長時間工作，電腦散置在辦公室各處，但帳冊都用手寫記錄。訪客會探頭進老闆的辦公室，並問：「那個坐在蓋茲桌子後面的孩子是誰？」那孩子就是蓋茲本人。他才25歲，看起來還更年輕。


    成功接踵而來。1980年時，這家小公司和電腦巨人IBM進行嚴肅的磋商，IBM已發展一系列新個人電腦，它需要搭配一套軟體系統。蓋茲出席會議，讓IBM的主管大開眼界，並爭取到千載難逢的好合約。蓋茲和他的同事日以繼夜趕工，秘密打造出MS-DOS作業系統。


    人類曾嘗試創造統一的語言卻沒有成功，但微軟幾乎為電腦達成這個目標——MS-DOS多數個人電腦使用的語言。


    如果當初IBM夠聰明，要求擁有MS-DOS的部分權利，它的股價會比現在高得多。IBM讓微軟保留所有權利，這是微軟後來崛起成為一家百億美元公司的原由。這故事的教訓是：如果
    你準備讓某個人發大財，記得要分一杯羹。


    ## 家得寶（Home Depot）


    家得寶創始於三名韓迪丹家用品連鎖店（Handy Dan Home Center）的主管被開除時。他們相信自己可以比開除他們的人做得更好，於是自己創立類似韓迪丹的商店。韓迪丹如今已不存在，家得寶商店卻到處可見。


    這個決定只是這幾人大展鴻圖的序曲。他們說服一個創投集團集資在亞特蘭大興建第一家超級五金商店，但盛大的開幕慘遭挫折，廣告承諾每個走進大門的人都可獲得1美元，但人群稀落到一天結束時，他們還剩下一大堆零錢。在那時，即使是送錢也吸引不了美國人上家得寶。


    但不久後人群開始湧進家得寶，吸引他們的是種類繁多的商品、低廉的價格，以及訓練良好的店員可以回答從地板到泛光燈的各種問題。在衰退時多數零售商業績受到打擊，但廣受歡迎的家得寶銷售仍然大好。事實上，當衰退迫使JC潘尼百貨結束亞特蘭大附近四家購物中心時，家得寶接收所有租約，多開了四家店。


    一旦發現手上拿的是一張王牌，主事者便計劃快速擴張。他們從股市籌措資金，1981年家得寶首次公開發行股票，上市股價為每股12美元。今日這檔股票（調整一次分割股票後）每股價值3,308美元！


    在1984年，家得寶有19家店；1985年公司遭遇一些挫折，因為利潤下滑，它犯了常見的擴張過快錯誤。到1986年，它出售更多股票，並利用籌得的資金償還部分債務。三年後，它變成美國最大的家庭裝修連鎖商店。1995年時，家得寶的商店超過365家，每年銷售逾140億美元的五金產品。


    ## 還沒結束


    儘管你常聽說美國愈來愈衰弱、競爭力滑落，正逐漸喪失領導世界的地位，但美國在新創意上仍然保持領先。美國的音樂、電視和電影產業仍然是世界第一；低成本的林木產品、紙張、鋁和化學品也是第一。華爾街仍然是全世界的股票金融首都，而且正逐漸收復銀行業的領先地位，相較之下日本銀行業則面臨重重難題。


    不管你相不相信，美國鐵路運輸貨物的效率如此高，世界其他國家都爭相學習美國的做法。美國的貨運體系是世界各地貨運業的標竿。（美國的旅客載運則有許多地方需要改進。）


    美國的行動電話、電子測試設備、藥品、電信和農業機械都領先世界。美國的基因工程、半導體和醫療進步都出類拔萃。經過多年的衰落後，美國占出口市場的比率已開始回升。這表示其他國家的消費者正購買更多美國製產品。


    美國出口鋼鐵到首爾、電晶體到東京、汽車到德國；美國也賣史班德斯布料（Spendex）到義大利、腳踏車零件到孟買。世界六大洲的男人都用吉列刮鬍刀刮鬍子。天空上飛的盡是波音飛機。日本原本應該是電子大國——記憶體晶片、電視和傳真機——但日本人已經趕不上美國公司如英特爾、美光科技（Micron
    Technology）、微軟和康柏電腦（Compaq Computer）不斷冒出來的創意。


    美國在個人電腦領先世界。在軟體、工作站、雷射印表機、電腦網路和微處理器，美國也稱霸世界。


    許多美國最棒的發明來自小公司，美國在小公司的發展上也獨步全球。前面已談到幾個微軟和蘋果電腦的年輕人，如何永遠改變了電腦業。二十年後，軟體實驗室的另一群人正要讓歷史重演一遍。


    不久以前報紙和新聞雜誌還責備我們痴肥、懶惰、坐領高薪。我們有新聞自由，而新聞喜歡隱善揚惡，因為報導壞事比好事更能增加報紙銷量。


    所以我們再三聽到日本人工作比美國人勤奮，德國人也比美國人勤奮，而美國人不是在家整天坐著看電視，就是在校園裡擲飛盤（另一項美國人的偉大發明），所以其他國家即將超越美國。


    悲觀者說，美國註定變成一個什麼都不做、什麼都不會的國家，除了美國人可能還聰明到會製造插在雞尾酒杯上裝飾的小傘。


    汽車業是最明顯的問題產業。在1960年代以前，美國無論在戰爭或承平時期都最強大，汽車業也最繁榮，底特律是愛車人的聖地。但1960年代以後，美國汽車公司進步遲緩，工廠日漸老舊，工人透過強大的工會要求愈來愈高的薪資。日本人和德國人在這時以他們漂亮、製造精良、價格低廉的汽車攻擊底特律。數百萬美國消費者喜歡外國汽車，更甚於笨重、粗糙而且價格高昂的美國車。


    新聞界和學術界為文討論美國汽車業的沒落，認為那是美國生活方式沒落的表徵。最有影響力的一本書是哈伯斯坦姆（David Halberstam）的《大清算》（The
    Reckoning）。


    你可能邊讀哈伯斯坦姆的書，邊為福特、通用汽車、克萊斯勒，以及美國的未來掉眼淚；但這本書出版的1986年，也是克萊斯勒從破產邊緣絕地大反攻的一年，而福特也開始大舉振作，相對於日產（Nissan）等日本汽車製造商則開始吃敗仗。美國這個輸家又開始反敗為勝。


    有做研究且注意到這種發展的投資人，都因為買福特、克萊斯勒和通用汽車而獲利豐厚。如果他們買的時機正確，克萊斯勒的股票可能為他們賺15倍獲利，福特賺10倍，通用汽車也有3倍之多。


    這不是一年或五年就能達成的改善，而是一個極長期的趨勢。正如底特律花了很長的時間才喪失汽車業龍頭的地位，它的東山再起也需要許多年。許多人對美國汽車業捲土重來感到驚訝，但那只是因為他們不了解情況。我們聽到許多舊新聞，說日本人掌控了汽車業。但發明廂形車的不是日本人，而是克萊斯勒。發明新一代時髦、低價汽車的不是日本人，而是福特、克萊斯勒和通用汽車。重新改款吉普車（Jeep）的不是日產，而是克萊斯勒。在歐洲變成暢銷車款的不是豐田，而是福特Fiesta。


    在美國國內，日本車正逐漸喪失市場占有率，而美國汽車正開始搶回市場。


    美國人已經翻修工廠，讓它們變得更有效率。美國人的工資已經下降，製造成本也因而降低，所以美國產品可以用較低的價格來和外國產品競爭。


    過去二十年來，美國人的自信心低落，但美國的勞動力在全世界已變得最具生產力。今日美國的工人每年生產價值4.96萬美元的產品，比德國多5,000美元，比日本則多1萬美元。美國工人比德國人工時更長、休假更少；德國工人每年有五週的支薪假期。


    事實上，美國勞工如此忙碌和如此有生產力，以致於哈佛教授修爾（Juliet Schor）寫了一本書叫《工作過度的美國人》（The Overworked American）。新聞媒體很成功地說服我們相信美國人都在偷懶，尤其是與日本的工人相比之時；所以聽到有人說我們工作過度，實在令人大感驚訝。


    但這並不表示美國沒有問題。過去二十年來，美國的經濟成長率落後之前數十年的速度，最低階工作的薪資水準只有小幅上漲，甚至沒有上漲。美國城市的內城區有高犯罪率和高失業率，那裡有近半數兒童未完成學業。如果不受教育，這些人將無法爭取到由電腦和先進科技帶來的各種好工作。


    儘管這些問題很棘手，但它們不是悲觀的理由。美國社會在1940年代也有類似的悲觀氣氛，在那個戰後的年代，有1,000萬到2,000萬名美國人失去與戰爭有關的工作，例如軍職或國防工業。超過三分之一的勞動人口必須另尋工作，帶來一場遠比今日裁員潮都嚴重的就業危機，但今日報紙的標題會讓你以為美國現在的狀況比二次大戰後還淒慘。


    事實上，1950年代是對經濟和股市都很有利的十年——在20世紀僅次於1980年代。所以當時人們對未來感到悲觀和不抱期待是錯誤的，正如在1990年代上半人們錯誤的悲觀一樣。


    ## 英雄


    在學校，我們辯論哈姆雷特是英雄或懦夫，李爾王是愚蠢或被貪婬的女兒所害，拿破崙是偉大的將領或野心勃勃的暴君。但我們從未辯論華頓（Sam Walton）是壞人或英雄。華頓藉由創立沃爾瑪而致富：這是一件好事或壞事？我們又怎麼看迪士尼執行長艾斯納（Michael
    Eisner）？艾斯納是個有錢的壞人或公司救星？


    美式足球明星蒙坦納（Joe Montana）是美國名人，他因為對社會的貢獻幾乎被捧為神明。他有貢獻是不容置疑的，但被視為英雄的蒙坦納又該如何與華頓或克萊斯勒的艾科卡（Lee
    Iacocca）比較？例如，誰創造了更多就業機會？


    艾科卡從未像蒙坦納那樣，帶領美國職業足球聯盟（NFL）的隊伍在比賽的第四節反敗為勝，但他讓在1981-1982年時瀕臨破產的克萊斯勒起死回生——想像在那關鍵的時刻，要是没有艾科卡的帶領，克萊斯勒會有什麼下場？


    不只是克萊斯勒115,948名員工將被遣散回家，那些輪胎製造商、鋁與鋼鐵供應商、汽車玻璃供應商、座椅皮革供應商等等，都會因為克萊斯勒倒閉而被迫裁員。艾科卡拯救克萊斯勒可能救了超過30萬人的飯碗。蒙坦納救了多少人的飯碗？


    蒙坦納藉由吸引球迷到球場看比賽，直接造福了一些售票員和熱狗小販的生意，這當然很了不起；但艾科卡拯救的工作機會不是熱狗小販這類，它們有許多屬於高技術工作，每小時薪資超過20美元。有超過30萬名待遇優渥的工人能去度假、買第二棟房子，或有錢讓孩子上大學，艾科卡功不可沒。


    奇異公司執行長威爾許（Jack Welch）比艾爾頓強（Elton John）更重要嗎？協助默克藥廠（Merck）發展許多治療疾病新藥的瓦吉洛斯（Roy Vagelos），比茱蒂佛斯特（Jodie
    Foster）、黛安娜王妃或俠客歐尼爾（Shaquille O''Neal）重要嗎？如果用投票來決定，我會投給威爾許和瓦吉洛斯。然而在唐先生甜甜圈（Dunkin
    Donut）電視廣告上出現的糕餅師傅，可能比我們提到的大部分人還出名。


    你可能注意到，我們常提到兩種英雄——一種是創立公司的人，一種是讓公司保持營運的人。他們是今日市場的「看不見的手」，而我們相信他們會讓1776年時的亞當．史密斯感到欣慰。在其他國家與他們同類的英雄，正在世界各地執行資本主義家的任務。


    我們很遺憾看到女性和少數族群在這些英雄中只占少數，（在本書寫作時）只有一位女性擔任美國上市企業最高主管——蓋普共同創辦人費雪（Doris Fisher）。我們希望隨著愈來愈多年輕人被吸引跨入商界，女性和少數族群也會有更多掌管上市公司的機會。


    也許讀完本書後（這是指定的家庭作業），林區家的三個女兒瑪麗（Mary）、安妮（Annie）和貝絲（Beth），以及羅斯查得家的兩

    個女兒柏恩絲（Berns）和莎士佳（Sascha）會大受鼓勵，加入企業的行列。


    美國大企業領導人不是一群搶錢族、人生目的也不只是搭乘里爾噴射機（Learjet）往返世界各地的 selecionar 高爾夫球場。史密斯（Fred Smith）創立聯邦快遞（FedEx）不是因為他想賺錢，他原本就已經很有錢。他是為了接受挑戰，想創造一個比郵政局更有效率的郵遞系統。因為史密斯的成功，美國郵政局才大肆整頓。現在除了下雨、下冰雹、下冰雪和下大雪照樣遞送郵件外，郵政局甚至已經有隔夜送達的服務。


    那些經營公司的人因為賺了大錢，往往被說成壞人，被歸為銀行搶匪和騙子的同類。你可能以為他們開給自己1,000萬美元的薪水支票，帶著錢揚長而去。但實際上他們的錢並非來自薪水，這是一個被冷嘲熱諷者忽視的重點。


    在大部分例子裡，大公司的財富主要來自擁有公司股票。你在企業的位階愈高，你獲得股票以代替現金的可能性就愈高。主管也獲得「股票選擇權」（options），讓他們可以用特定的價格買更多股票。


    但這些好處只有在公司表現良好、股價上漲時，主管才享受到。如果公司表現不佳，股價下跌，這些人勢必虧錢，而且可能獲得的利益遠不如支領高薪。頒股票讓公司領導人跟股東站在同一邊，當他們從股票賺大錢時，投資人也從擁有的公司股票獲利。這是雙贏的安排。

    '
