    # 说起狗狗


    # 每 6 个月...


    # 你就能拥有一只全新的狗狗!


    来自：霍维M·伯吉斯

    通用食品盖恩斯研发部


    在你阅读本文的 2 分钟内，蜷缩在你脚边的大狗，就 h 会发生变化。事实上，从现在起，大约 6 个月，它就会几乎变成一个全新的狗狗——从生理上来说。表面上看起来它还和以前一样——一样快乐地摇着尾巴，一样可爱的眼神。但是，它每根毛发上的每个细胞，每颗牙齿，没块儿肌肉，每滴血，事实上都被新细胞取代了。


    和所有生物一样，你的狗狗体内的细胞不断被新细胞所取代。因为这些细胞主要由蛋白质构成，所以，狗粮中的蛋白质至关重要。不仅蛋白质的数量很重要，而且它的种类也很关键，因为蛋白质并非都一样。


    一般来说，蛋白质由氨基酸构成，它被称为蛋白质的“基石”。在这些氨基酸中，有 10 种被认为是身体生长和维持的必要元素。最近营养研究表明，特别是其中一种被称为蛋氨酸的氨基酸，对于细胞的成长尤为重要。然而，这种氨基酸正是许多狗粮中含量偏低的元素。在你的狗狗的饮食中，加入少量蛋氨酸，可以让狗狗更好地吸收饮食中的其他蛋白质。


    当然，蛋白质只是营养中的一部分。和人一样，狗狗要想健康，不可能只吃蛋白质。这就是为什么好的狗粮中，还会包括比例均衡的其他 4 组关键营养元素——碳水化合物、脂肪、维生素和矿物质。但是，不管你的狗狗年龄大小，都要确保它的饮食中含有足够的优质蛋白质，确保它健康、强壮。'
