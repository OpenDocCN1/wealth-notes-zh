    “你难道没有用过攻牙钻头吗，医生？”


    科学家朝坐在椅子上的病人笑了笑，“在这个诊所，我们不用攻牙钻头。”


    “但是，如果你发现了蛀牙，你会怎么做？”


    “我们会建议你去看你的牙医，”科学家回答道。“我们唯一的目标就是，研究一种新的方法，来预防蛀牙。”


    这个诊所的工作就是，测试一种全新的含氟化亚锡的牙膏——现在被称为佳洁士。通过检查成千上万的志愿者刷牙用的牙膏，该诊所能找出佳洁士的防蛀牙效果有多好。


    如今，该诊所的测试，得出了新的牙科学记录。佳洁士和普通牙膏相比，能让蛀牙发生率减少几乎一半——不管是对成人，还是对儿童。


