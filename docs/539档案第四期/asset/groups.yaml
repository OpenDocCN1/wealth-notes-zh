    ## 10、超重的女性人数是男性的 2 倍！


    Who are America''s 60 million overweight? How did they get that way? What can
    they do about it?


    # The ladies lead by nearly 2 to 1!


    Nationwide research reveals that almost twice as many women as men are overweight!


    by Robert S. Kleckner

    Science Writer, Chicago Sun-Times


    A shocking 49.2% of America''s total adult population today is overweight. And
    the women outnumber the men by a ratio of nearly 2 to 1. Women, perhaps, are more
    prone to the harmful habit of "social overeating" which medical opinion emphatically
    defines as the basic cause of most overweight cases.


    But in men or women, the pattern is the same ... a gradually increasing tendency
    to eat more food than the body''s daily activity can convert into energy. And
    the pattern of attempted correction is largely the same, too ... periodically
    "going on a diet." Together, these "dieting" men and women add up to an estimated
    16 to 17 million at any given time. And both are most easily lured by the various
    fad or miracle diets.


    Of course, the basic and incontestable truth, for man and woman alike, is this:
    to take off extra pounds and keep them off, you must reduce your daily caloric
    intake. Fewer calories, fewer pounds ... it''s as simple as that. For when you
    go beyond the limit of calories your body can use each day, the overage is stored
    in your body as fat.


    But within that daily limit, you can keep your body weight where it belongs, and
    still have fun at the table. Foods you really enjoy eating can provide the nourishment
    and energy your body needs. Naturally, it isn''t wise to use up your calorie quota
    in a single big meal. And particularly, it isn''t wise to skimp at breakfast.


    In fact, nutritional authorities consistently advise a nourishing breakfast for
    dieters every day. That''s where a fine high-protein oatmeal breakfast enters
    the diet picture. For while an average serving of hot, delicious oatmeal with
    sugar and milk adds up to only 210 calories ... it provides 9 whole grams of high-quality
    protein.


    With a good, stick-to-the-ribs breakfast like this, a weight-watcher can feel
    well-fed and satisfied, all morning long. No nibbling or midmorning snacks required,
    or even missed.


    It really works.


    One of a series by the makers of Quaker Oats, Mother''s Oats, and Mother''s Oats
    with Premiums ... America''s favorite oatmeal for generations.

