    问：燕麦片真的对促进孩子的成长有好处吗？


    答：是的，因为：蛋白质是所有活细胞最基本，最关键的组成部分。是拥有强壮的身体，健康的血液所“必须”的基本元素。燕麦片比其他任何常见谷物为身体提供的蛋白质都要丰富。


    问：燕麦片早餐对成年人真的重要吗？


    答：是的，如果你想一上午都保持精力旺盛，体能好的话，燕麦片对你很重要。生理学家指出，早餐应该提供你全天所需大约四分之一的蛋白质和热量，并推荐早餐选择水果、燕麦片、牛奶、面包、黄油作为理想的基本早餐。燕麦片最适合早餐，因为它比其他任何常见谷物的蛋白质都要丰富。


    问：这么有营养的食物，是不是一定会让人发胖？


    答：不一定。高蛋白食物能控制食欲。早餐食用燕麦片后，饥饿感就会来的迟一些...但是，你依旧能获得身体所需的能量。一碗加有牛奶或糖的母亲燕麦片，或同类产品，只有
    210 卡路里，却包含了 9 克蛋白质。


    问：早餐吃鸡蛋，培根，难道不比燕麦片蛋白质更高吗？


    答：按克算的话，这些优质食品的蛋白质，实际上并不优于燕麦片。（一个中等大小的鸡蛋...或 3 片培根中才含有 6 克蛋白质。）而且，一顿燕麦片早餐，成本只有几便士。


    问：新桂格快速燕麦片或母亲燕麦片有什么“新变化”吗？


    答：没有多大变化...除了烹煮更快速，燕麦片更薄了，只要 50—60 秒就能煮熟，有乳脂的口感，应该会有更多人喜欢。


    问：多大的宝宝能辅食燕麦片？


    答：专家说，3 个月大就可以，因为它的口感好，营养价值高，而且实惠。（给宝宝食用的时候，烹煮时间稍微长一点；见包装。）


    问：老包装的燕麦片是什么样的？


    答：和新包装的品质一样。除了麦片比较厚，需要煮 5 分钟以外。喜欢它的风味和口感的，可以购买老包装的桂格燕麦片或母亲燕麦片。


    问：如今桂格燕麦片的受欢迎程度如何？


    答：长久以来，它一直比其他谷物都受欢迎，不管是冷食还是热煮。如今，和往常一样，人们更喜欢它了，因为经过烹煮，它食用起来更美味，而且饱腹感很强，一上午都不觉得饿。


