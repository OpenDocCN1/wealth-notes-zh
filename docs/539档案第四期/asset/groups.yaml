    ## 49、学校的孩子教给科学家关于蛀牙的一堂课


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_211_0.png)


    # The School Children Who Taught Scientists A Lesson About Cavities


    By Marguerite Higgins

    Noted Journalist and Pulitzer Prize Winner


    RECENTLY, youngsters in Bloomington, Minnesota, schools were given mighty unusual
    "homework." What''s more — they enjoyed it!

    The assignment: to brush their teeth every day with a "mystery" toothpaste.

    Dental hygienists handed out the toothpaste at school, to be sure each pupil did
    his "homework" with the right kind. Half the children got a toothpaste marked
    "H," half a toothpaste marked "E."

    At the end of one year, scientists from the health department went from school
    to school and examined the youngsters'' teeth.

    Afterwards, the scientists revealed what the project was all about — and the good
    news they had learned.

    Toothpaste "H" was ordinary toothpaste. But toothpaste "E" was a new decay-preventing
    toothpaste, containing stannous fluoride — now known as Crest with Fluoristan.


    And the lucky children who brushed with Crest had far fewer new cavities than
    the others.

    In fact, many of the "Crest kids" developed no new cavities at all (the happy
    situation dramatized by Norman Rockwell on the opposite page).

    These results confirmed years of testing at a famous university — in which Crest
    cut tooth decay drastically for grownups as well as children.

    For instance, in one typical test, adults who brushed with Crest had 42% fewer
    new cavities than those who used ordinary toothpaste.

    This reduction in decay is possible, scientists explain, because of Crest''s stannous
    fluoride formula, Fluoristan. It enables Crest to strengthen "soft spots" on teeth,
    and stop them from turning into cavities.

    I think there''s a lesson for all of us in the impressive record against cavities
    set by this new toothpaste, Crest.


    > A Dental Health Message from Procter & Gamble, makers of Crest Toothpaste.


