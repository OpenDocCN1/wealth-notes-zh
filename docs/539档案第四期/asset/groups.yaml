    《你的狗狗从幼犬到大狗》以及其他狗狗类书籍的作者


    问问你的狗狗，它多久该洗一次澡，它可能会告诉你“永远不要洗澡！”然而，大多数人都认为，每4—8周洗一次澡，会让狗狗看起来更漂亮……和狗狗相处时，也更舒适。


    用温和的言语和一些应用心理学方法给狗狗洗澡，你和它都会感受到乐趣。或者说是一点愉悦吧。首先，在浴缸里铺上橡胶垫，这样，狗狗不会失去平衡，不会不知所措。水温要适宜，就和给宝宝洗澡一样——用肘部测试水温——水位不要超过狗狗的腿中部。然后，用棉花松松地遮住它的耳朵，开始为它洗澡。然后，用温和的肥皂，轻轻地搓洗，直至全身遍布肥皂泡泡。肥皂水要远离它的眼睛和耳朵——整个过程中，要和狗狗友好地交谈，让它安心。


    两块肥皂应该足够了。用手动喷雾器进行最后的冲洗，最后冲洗的时间一定要足够长，彻底洗干净，直到你和狗狗都觉得可以了为止。洗完后，花点时间，相互庆祝一下，舒口气，然后用毛巾把狗狗裹上，直到2小时候，它身上的毛完全干了，再让它去户外。


    让我们面对现实吧……有些狗狗特别不喜欢在浴缸里洗澡，你再怎么做，都是徒劳无功。所以，这里有个方法，就是干洗洗发剂。其实给狗狗吃普通玉米粉就很好。6个月以下的幼犬，不用洗澡。但是，不管多大的狗狗，每天都要刷刷毛。每天刷刷毛，再喂食营养均衡的高蛋白食物，会让狗狗的毛发光泽，健康。偶尔再洗个澡，它就是狗狗中的佼佼者！'
