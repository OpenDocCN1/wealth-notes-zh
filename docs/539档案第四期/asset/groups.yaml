    ## 13、为什么燕麦片是你早餐的正确选择


    Modern findings about growth, energy, mental and physical efficiency and weight
    control show...


    ## Why you have always been right to like hot oatmeal for breakfast


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_77_0.png)


    You have been so familiar with oatmeal for such a long time, that you may feel
    you already know all there is to know about it. But here are a few facts that
    you may not know:


    Q: Is oatmeal really superior for promoting child growth?

    A: Yes, for this reason: The basic, essential part of all living cells is protein.
    It is the fundamental "must" for building strong bodies and good red blood. And
    far more protein is furnished to the body by oatmeal than by any other leading
    cereal.


    Q: Is an oatmeal breakfast actually important to adults?

    A: Yes, if you want to maintain mental and physical efficiency in late morning
    hours. Physiologists say the morning meal should provide approximately one-fourth
    of your day''s protein and calories, and recommend fruit, cereal, milk, bread
    and butter as an ideal basic breakfast. Oatmeal fits in best because it is far
    richer in protein than any other leading cereal.


    Q: Isn''t such a nourishing food bound to be fattening?

    A: Not necessarily. A high-protein food is the body''s automatic appetite control.
    With oatmeal for breakfast, the return of hunger is delayed ... yet you get the
    energy and strength you need. There are 9 grams of protein, and only 210 calories,
    in a bowl of hot Quaker or Mother''s Oats (same product) with sugar and milk.


    Q: Wouldn''t eggs, bacon, provide even more protein at breakfast?

    A: Gram for gram, these fine foods actually are not superior to oatmeal as a source
    of protein. 16 grams of protein in one medium egg... or in 3 bacon slices.) And
    an oatmeal breakfast costs only a few pennies.


    Q: What is actually "new" about New Quick Quaker or Mother''s Oats?

    A: Nothing... except that it cooks quicker (flakes are rolled thinner and cook
    completely in 50-60 seconds) and has a somewhat creamier taste that more people
    seem to prefer.


    Q: How soon should oatmeal be fed to infants?

    A: As early as 3 months, authorities now agree, for its palatability, nutritional
    values, and economy. (Baby''s portion is cooked longer; see package.)


    Q: What is Old Fashioned Oatmeal?

    A: Precisely the same as the modern product ... except the flakes are thicker,
    require 5 minutes to cook. Those who prefer its taste and flavor buy Old Fashioned
    Quaker Oats or Mother''s Oats.


    Q: How does Quaker Oats rank today in popularity?

    A: It is still more popular than any other cereal, hot or cold. Today, same as
    always, people like it better because it is hot, tastes more delicious, and "sticks
    to their ribs" all morning long.

