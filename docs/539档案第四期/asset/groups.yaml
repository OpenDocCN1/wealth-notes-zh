    \n在这些医疗先驱中，有像耶恩·汉贝格医生，拉尔斯·埃森医生和卡尔·奥托·阿里医生等，在瑞典医疗界具有很高声誉的医生。他们的治疗方法不需要通常的药物和注射；相反，临床表明，他们的方法实际上是让身体自我治愈关节炎。\n\
    \n我们首次出版了一本书，向美国公众报告对瑞典治疗关节炎的成功案例。我们可以免费寄给你一本。\n\n帕沃·艾罗拉是在欧洲学医成功的加拿大自然疗法医生。虽然他自己不是治疗关节炎的权威人士，但是他一直对这个困扰着大约1700万美国人口的疾病很感兴趣。艾罗拉最近在瑞典花了几个月的时间，来参观瑞典健康诊所的生物医学临床实践。在那里，他作为助理医生，研究了病人记录，并采访已经被治愈的病人。他的书，就是一个记者对他看到的，以及听到的信息的一个记录。\n\
    \n## 下面是艾罗拉在瑞典调查的2个临床病例：\n\n…阿托扬·维斯特兰德，一位瑞典农民，因患有关节炎，他的胳膊和腿几乎不能移动。十二年来，通过人造假体、药物、x射线治疗，都没有效果。后来，在布兰达莱尔诊所治疗，仅一个月的时间，他的痛苦消失了。他的四肢恢复了活动能力，在完全治愈后，他又回到了农场工作。\n\
    \n…凯萨·安德森夫人，五个孩子的母亲。在自己的医生治疗5年，没有效果，她的病情恶化，剧烈的疼痛使得她都无法自己回房。结果，用自然生物疗法，不到一个月的时间，她就完全被治愈了。5年后，她仍然十分健康。\n\
