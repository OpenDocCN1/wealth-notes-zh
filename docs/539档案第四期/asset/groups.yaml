    ## 警告：除非你很有钱，否则不要读！


    如果你想知道有些人是如何从一个简单的想法开始……逐渐取得年销售额超过 51000000 美元的成就.....那么，下面的信息，将是你读过的最有趣的信息。


    原因是：加利福尼亚有个叫卡尔·帕尔默的人，很富有，很无聊，最近他想做点事情。他当初致富（第一桶金）源于 1970 年的创业公司，3 年后，也就是 1973
    年，他把它卖给了可口可乐公司。但是，作为交易的一部分，他必须签订“竞业禁止”协议，期限为五年。


    5 年结束后，他又回到商界，成立了另一个公司，这个公司很快就被大企业 AMF 公司收购。之后，卡尔为沙克利斯公司发明了反渗透家庭用水过滤系统...并且...在第
    1 年...他们的这款产品就创造了 5100 万美元的销售额。


    等等。


    说道这里，你应该明白了。这个人做的事情就是发明一些非常有价值的东西，然后成立公司，销售这些发明.....很快...他受不了经营公司的繁琐和麻烦......所以......他把公司（以巨大的利润）卖给了一些有资源，有影响力，能用他发明的东西给人民带来最大价值的巨头公司。


    但是现在，他战胜了自己。应赛舌尔科技公司的要求，他发明了一款世界上每个人都需要...并且...


    ## 几乎能创造数十亿美元销量的产品！


    下面是他想出这个发明的过程。他在加利福尼亚州，波莫纳附近新得了一个马场，有一天他出去骑马...他感到无聊透顶！看到了吧，


    这个家伙有一颗永远不会放弃的心。因此，他想：“这个世界上最好的发明是什么？有什么是地球上每个人都必须拥有的吗？”


    是的，有。那就是水。它无色、无味，0 卡路里...但...它对地球上的所有生命都至关重要。不管是一条狗、一只猫、一个人、一头大象，还是微生物，水都是非常重要的。而且没有替代品。地球上有五十多亿人口，每个人每天需要大约
    2 - 1/2 夸脱的水......才能生存，并保持健康。


    没有水，就没有生命。


    但是，那又怎样呢？地球上的水比土还多呢，不是么？是，确实是。然而，这些水里 97% 都是海水。海水，当然富含盐。如果人只喝海水，很快就会因为干渴，脱水而死，因为人体拼命地想清除体内多余的盐。当然，如果除去海水中的盐，我们也可以饮用海水。但是，成本会非常昂贵！


    海水也不是农业或工业的最佳选择。它会杀死大多数农作物，会很快腐蚀掉大多数机器。


    事实上，世界上只有 3%的水是新鲜，不含咸的。但是，几乎所有淡水，至今都仍存在于冰川、冰帽或地下深处。这意味着...


    ## 地球上只有区区 1% 的的水是人类可以饮用的！


    而且，大多数水都受到了严重污染，每天都会夺去数千人的生命......此外，它每天还会导致数百万人生病。


    你有房子吗？如果有，拿着钢锯到地下室，把水管切断约一英寸。然后，找个光线强大的手电筒，仔细观察水管里面。很有可能你会看到一些让人不是很舒服的东西。生锈...沉积物铅...污垢......小生物的排泄物，如粪便...氮...汞...以及...各种其他垃圾，把这些东西喝进去，真不是什么好事。


    想想这意味着什么：即使你住的城市，净水工作做得非常好（通常都做得不好，离做得好还差的很远）……


    ## 你的水，穿越几英里的管道之后，

    从水龙头里出来时，仍可能带有许多可怕的东西！


    但很有可能，你所在的城市，无法对居民用水进行完美的净化。因为供应量实在太大了。所以，他们的方法是，在水里加氯！某种程度上，这种方法很好……因为……氯可以杀死水中脏腑、致病的微生物。但是，你知道为什么它能够杀死这些微生物吗？很简单…


    ## 因为氯是一种毒剂！


    这就是为什么大多数美国居民都很少有蛀牙；因为我们的饮用水中的氯，能够杀死那些侵蚀牙釉质的微生物。然而，使用像氯这样的毒剂，杀死“坏的”微生物，就像给癌症病人做化疗一样。化疗时，不仅杀死了癌细胞，许多非癌细胞也会被杀死……而且……病人会掉头发，会感到非常累，对生活的热情大大减弱。


    说到癌症，美国环境保护总署、马萨诸塞州总医院、阿拉巴马大学、佐治亚大学和佛罗里达大学发表过5篇相关文章，都证明……


    ## 饮用含氯的水，死于癌症的几率会增加 44%！


    此外，它对你的健康还有一些其他可怕（非常可怕）的”影响。


    但是，等等！不要怪市政水务公司。为了解决水污染的最大问题，这可能是他们最好的选择。氯对人体确实不好。但是，饮用水中的“坏蛋”如果不去除……如果不用氯……会给我们的健康带来噩梦。


    大肠杆菌、地依嵴牙杆菌、隐孢子虫等等，都是“生物恶棍”能导致……


    ## 你甚至都不想知道的健康问题!


    再说一次，氯就像化疗：两弊相衡，取其轻。但是，不管从哪个角度看，它依旧让人心生恐惧。


    那，该怎么办呢？如今数百万美国居民家中都有滤水设备......它可以解决部分问题。然而，通过调查，卡尔·帕尔默发现，我们一生中喝的水量中 50%—60%......


    ## 都不是在家喝的!


    诡怪瓶装水行业如此庞大。它有多大？问得好，仅在美国，每年瓶装水的销量...就超过...42 亿美元


    但是，瓶装水有几个问题：(1)首先，瓶装水大约有 350 个不同的品牌，并不是所有品牌的水质量都好。有些和普通的自来水一样糟糕。其中一些更糟。事实上，有些就是直接灌装的普通自来水。多会投机取巧：把水龙头里的水，直接灌装到塑料瓶中...然后...以成本的
    2000%的价格销售！(2)其次，不管好坏，所有的瓶装水都比较贵。


    例如，在迈阿密滩当地一家便利店，一瓶 1 盎司毕雷矿泉水售价为 1.40 美元。如果仔细算算，你会发现，含着每加仑水 16.29 美元。因为迈阿密滩是度假胜地，所以毕雷矿泉水是比较昂贵的瓶装水品牌，它的每加仑水的价格要高于平均水平。然而，即使在非度假地区，通常的瓶装水，平均价格仍然非常高，一般每加仑
    7.00—8.00 美元。


    另外，几乎每个购买瓶装水的美国人，一般都会买很多。真的很多！让我们面对现实吧：你每天都需要水。如果你锻炼，你需要的水比其他人更多。这就是为什么许多健身运动的美国人...


    ## 每年在瓶装水上的消费超过 1600 美元!


    现在，让我们来谈谈真正令人兴奋的东西。想象你去商店买一瓶依云，毕雷，箭牌，或任何其他品牌的瓶装水。然后，你直接喝完……但是，与其扔掉瓶子，再去商店买一瓶……你选择了一种用空瓶子装水龙头里的水，或湖里的水，或河里的水，甚至公共泳池里的水灌满……然后盖上盖子……因为这个盖子下面有一种非常有效的过滤网，所以，从这个瓶子里出来的水就和你原来购买的水（味道和纯度）一样，甚至更好。


    你再也不用重新购买！


    这就意味着，你不用再花钱购买每加仑7美元，或8美元的瓶装水（这些水甚至都不能确保纯净），你现在可以得到一加仑只要几美分，而且保证纯净的水。


    此外，你想喝水的时候，也不用再跑到商店去买了。


    而且，你可以随身携带者带有前所未有的魔法过滤器瓶盖的瓶子…去任何地方…甚至墨西哥…不管到哪里，都有无限供应的最纯净的水可以喝。


    听起来像在做梦，是吗？好消息是，卡尔·帕尔默为塞舌尔科技公司发明了一样东西，让这个梦想成为了现实。你看，卡尔是反渗透滤水系统的发明者，后来他把它卖给了可口可乐公司，AMF公司，和沙克利斯公司。但是，这是卡尔27年前发明的。现在仍然非常有效，且被广泛使用。如今，卡尔专门为塞舌尔科技公司发明的这款绿水系统，和市场上的其他滤水系统，以及他27年前发明的那个滤水系统相比，技术上领先了很多年……


    卡尔能够发明这款神奇的新过滤器，原因之一是，他拥有一款名为“吸附剂”的产品的全球发售权…这款产品被证明很可能是目前世界上最好的滤水材料。原因之一是，它有只有两微米大小的孔隙（许多滤水器的孔隙为50—100微米），这意味着更多的有毒“坏”物质无法通过这种过滤器。


    此外，这种物质非常薄，如果你把压缩在这个轻小，极效的过滤器里的滤网展开.....


    ## 它能够覆盖 15000 平方英尺的面积！


    这个过滤器还具有离子性质...这意味着...它能够通过化学作用，使受污染的水中的有机混合物挥发出去。换句话说，它能够延伸出去，抓住它们（这些令人恶心的“有毒恶棍”），把它们带到过滤器表面。最重要的一点：水通过这个过滤器就相当于.....你在世界任何地方能买到的瓶装水的质量.....甚至更好。


    另外一个重点：因为这个过滤器采用的独特材料，它能够缩小到一个核桃大小的体积，但是依旧可以净化大量的水。现在，塞舌尔科技公司准备推向市场的，不是水，而是这个能净化水的‑水瓶。它是塑料的。和依云，毕雷，箭牌或你见到的其他瓶装水的瓶子大小一样.....但不同的是.....它的瓶盖底部有一个神奇的离子微量过滤设备（这是最主要的一个商业秘密）...还有一个通向瓶盖顶部的小塑料吸管。


    （用各种水源）灌满瓶子，拧上盖子.....你可以用吸管喝水.....在全球任何地方，你都能喝到安全的水了！


    这个高级极效净水瓶的零售价为 29.95 美元，它能净化这么多的水...


    > “这个世界上最好的发明是什么？有什么是地球上每个人都必须适宜的呢？”


    ## 你能够重复灌装 1000 次！


    要购买等量的纯净水（我们假设你购买到的是纯净水），你需要花费大约 1700.00 美元！


    此外，购买瓶装水，你还要一次次去商店。


