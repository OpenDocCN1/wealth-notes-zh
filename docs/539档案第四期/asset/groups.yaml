    ## 改变了美国人习惯的一双鞋


    一双鞋是如何减轻美国人双脚的负担，开启鞋子新时代的


    在人们穿高跟鞋，硬底鞋或没鞋穿的年代，网球运动员一直面临一个问题。他们的双脚需要这样一双鞋：“既要赤脚般的自由，又要没有赤脚受伤风险。”


    19 世纪 80 年代，他们拥有了这样的鞋，一些天才美国制造商，发明了帆布鞋面，橡胶鞋底的“网球鞋”。这双鞋非常轻巧，它的灵活性和舒适性，简直令人难以置信。


    于是，其他运动员也开始穿这种鞋了。（它的抓地力好，而且双脚非常自由！）孩子们穿着它去健身房。（这双鞋非常耐洗！）节俭的人也开始穿它。（它非常经济！）有些农民，甚至穿着它去耕种。（十分耐用！）


    到 1916 年，这双鞋的发明者们认为，那时，这双鞋还被称为美国橡胶鞋，他们需要给这双鞋起个独特的名字，把它和其他模仿的鞋区分开。因为他们最终定下的名字 “Peds”
    无法获得版权。所以，他们把名字中的首字母 “P” 换成了 “K”，他们做梦都想不到，他们从此创造出了一个美国大品牌。他们当初只是想让科迪斯（Keds）成为
    “同类中最好的鞋。”


    所以，科迪斯是第一个生产高品质帆布鞋的品牌。 多年来虽然有很多品牌都在模仿，但没有哪个品牌的质量能和它相较。


    科迪斯是第一个注重帆布颜色的品牌（20 年代时，科迪斯为网球明星推出一款带有蓝色的帆布鞋）。科迪斯还是第一个使用海绵橡胶鞋垫的品牌。它还是第一个推出超轻软胶底男装休闲鞋（超轻科迪斯，是世界上被模仿最多的鞋）。


    无论是什么价位的美国橡胶鞋，科迪斯都始终保证高品质，让你穿着舒适，感觉良好。科迪斯必须给脚部足够的支撑。科迪斯专利拱垫，必须真正地吸收冲击，达到缓震效果。科迪斯必须能满足不同尺寸、宽窄脚型的需求。美国橡胶鞋测量了数千双脚，为的就是制作出合适比例的科迪斯。


    第二次世界大战结束后，大量人群选择了到郊区或更休闲的地方生活，“运动鞋”获得了整个社会的认可，更不用说年轻人了。


    历史悠久的“网球鞋”现在是多么流行啊！如今，科迪斯全国各地都有售。既有“专业版”科迪斯网球鞋、又有划船、徒步、高尔夫、足球、篮球、手球和小联盟棒球时穿的网球鞋。科迪斯女鞋有
    20 种不同的款式。13 种不同的面料，34 种不同的颜色，每双鞋的耐磨性和可洗性都经过严格检测。科迪斯有 136 种不同的型号，50 种不同的风格。每个型号，每个风格都各有特色。任何年龄段，从蹒跚学步的小孩，到老人，都能在科迪斯找到适合自己的款式。


    这是大多数美国人都会选择的一款鞋，不管年龄、性别、季节或收入——一双穿着会感到非常快乐的鞋——这就是美国科迪斯。


