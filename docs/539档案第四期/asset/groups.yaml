    # 19、改变了美国人习惯的一双鞋


    # The Shoe That Changed America’s Habits


    > How one shoe took a load off the country’s feet and started a whole new kind
    of footwear


    BACK WHEN people either wore high, stiff shoes or no shoes, tennis players had
    a problem. Their feet needed “barefoot freedom without barefoot risk.” They got
    it in the 1880’s, when some ingenious American manufacturers made a “tennis shoe,”
    with canvas uppers and rubber soles. It was incredibly light, unbelievably flexible
    and comfortable. Other athletes took it up. (Such grip, such freedom!) Kids wore
    it to gym. (It was washable!) Thrifty folks took to it. (It was economical!) Some
    farmers even plowed in it. (So durable!) By 1916 the inventors, known by then
    as United States Rubber, needed a name to set their shoe apart from imitations.
    Unable to copyright their choice, “Peds,” they substituted the strong letter “K”
    for “P,” never dreaming they were creating one of America’s great brand names.
    They simply meant Keds to be “the best shoes of their kind.” So, Keds were first
    to put quality into canvas shoes. And, with all the imitations over the years,
    no shoe has been able to touch them for quality. Keds were first with color in
    canvas (in the ’20s, Keds put blue in a shoe for a tennis star). Keds were first
    with a sponge rubber insole. First with a buoyant crepe-and-cork soled men’s casual
    (Booster Keds, the world’s most copied shoe).


    Whatever the cost to U. S. Rubber, Keds had to feel good and be good for feet.
    Keds had to give proper support. Keds patented arch cushion had to really absorb
    shocks. Keds had to fit perfectly on long, short, narrow or wide feet. “U. S.”
    measured thousands of feet to get the right proportions for each Keds last. As
    World War II ended and people swanned to the suburbs for a more casual life, the
    “sneaker” won complete social acceptance, not to mention the teenager’s heart.
    How that “tennis shoe” of long ago has grown! Today, Keds are sold in every corner
    of the country. There are “pro” Keds for tennis, boxing, track, golf, football,
    basketball, handball and Little League baseball. 20 different women’s Keds. Keds
    in 12 fabrics and 34 colors, each rigorously tested for wear and washability.
    Keds in 156 sizes and 30 styles, with each size of every style made on individually
    designed lasts. Keds for every age from toddlers on. The shoe most Americans live
    in regardless of age, sex, season or income—the shoe that’s pure pleasure to wear—that’s
    U. S. Keds.'
