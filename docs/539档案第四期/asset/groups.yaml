    # “The doctor’s coming right away!”


    IN AN HOUR of urgent need, you may have had the feeling of relief and reassurance
    that comes when you know your family doctor will soon step through your doorway.


    Of course, any physician would respond to an emergency call. It is not quite the
    same, however, as having your own doctor who has known you through the years.
    When he comes, you rely on him not only as a physician, but also as a friend.


    This warm relationship can be as important, in a way, as the doctor’s knowledge
    of medicine. This is because the family physician, in treating a patient, considers
    not only the current medical phases of the case but also the patient’s personal
    medical background. Furthermore, a doctor who has year-to-year contact with you
    can help ease many worries which illness often magnifies.


    There are other equally good reasons for having a family doctor. Through periodic
    health check-ups, he can often detect trouble early and take prompt action. Moreover,
    by consulting him periodically, you get his advice about keeping in good physical
    condition... with proper diet and sensible living habits.


    Your friend, the family doctor, is the first to know when hospital care is needed...
    and when a specialist should be called to advise and assist him. Specialists,
    because of their detailed knowledge and experience in diagnosing and treating
    diseases falling within their particular field, are important allies of the family
    doctor.


    One of the most practical steps that you can take for future health and happiness
    is to consult your family doctor now... and keep in touch with him over the years.


