    对想减肥的人：蛋白质是一种可以让身体自动控制饥饿的食物元素。一般而言，食物中的蛋白质含量越高，饥饿感出现的就越晚。当身体的血糖水平维持在足够高的水平时，“胃口”就不会很活跃。蛋白质能提高血糖水平，并将它维持在饥饿线以上，维持时间比其他任何食物都长。


    高蛋白饮食，对超重的人价值在于，可以减少饥饿感。同时，能给他们提供身体所需的能量。例如，一碗加了糖和牛奶的热燕麦片，只有221卡路里的热量......却含有9克蛋白质。这就是早餐喝了燕麦粥后，一上午都觉得很饱的秘密所在。'
