    是什么让人们明明已经很饱了，却依旧疯狂地想吃东西？

    他们是真的想吃东西吗——还是他们的食欲欺骗的自己？

    糖如何帮助你使自己的食欲和身体实际所需相符合？


    问：有可能养成吃得少的习惯吗？


    答：是的，有可能。有时，人们会把饥饿-需要食物，以及食欲-对食物的渴望混淆。你可以训练你的食欲，降低食欲，让它和你对食物的真正需求相吻合。这是控制体重的一个自然的方法。


    问：怎么开始最好？


    答：知名营养学家建议：吃你自己习惯吃的食物，饮食多样化。只要减少食用量就可以了。这个计划可能需要加入一些糖，来为身体供能，帮助你减少食量。


    问：糖怎么能让你吃更少的食物，却仍然感到满足？


    答：科学证明，糖比任何食物都能更迅速地满足食欲。所以，当母亲希望孩子能多吃饭的时候，一般在饭前就禁止他们吃糖果。如果你想吃得少，就可以利用这个优势，用糖来帮你减少摄入卡路里。


    问：糖有助于满足人体基本营养需要吗？


    答：是的。碳水化合物，如糖，是为身体各种活动供能的主要能量来源。如果饮食控制过于清淡，严格，能快速供能的食物太少，你就很容易感到疲劳。你的新陈代谢就会变慢。当你的新陈代谢变慢后，你燃烧的卡路里就少，从而无法实现减肥的目的。没有哪种食物，能比相同单位的糖，以更少的热量，更快速地为身体供能。


