    # 18、店里有服务员吗？


    # WHO''S WATCHING

    THE STORE?


    Here''s the ultimate in self-service: No clerks,

    no cashiers, no attendants ... just customers:


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_97_0.png)


    Imagine, if you can, 20,000 stores with no attendants whatsoever, open 24 hours
    a day, seven days a week, taking in millions of dollars in nickels and dimes,
    and you''ll get a rough idea of one of the most amazing business success stories
    since the end of World War II.


    These stores are coin-operated laundries. Along with their spectacular success,
    these unattended laundries have revealed a great deal about American women. How
    do they act when no one''s looking?


    "Women amaze me," reports Bill Shorb, a water heater salesman who invested in
    an ECON-O-WASH coin-operated laundry as a sideline.


    "I wondered if I was going too far when I set aside a lounge area in my ECON-O-WASH.
    It has soft drink, hot-coffee, candy and popcorn machines, even a coin-operated
    hair dryer, and a card table.


    "As it has turned out, my ECON-O-WASH has become a social center for the neighborhood.
    The girls seem to look forward to meeting here to do their washing! Because I
    took a little care in outfitting my laundry, they help me keep it neat and tidy.
    Last Christmas I put in a color TV set, just to show my appreciation."


    Sometimes this owner interest backfires: An attorney in a southern city put a
    juke box in his ECON-O-WASH laundry, because he thought his customers would enjoy
    the music. Driving by one night he found the juke box going full blast, one housewife
    doing her laundry, and three teen-age couples happily dancing in the lounge area!


    Another surprise: A recent survey revealed that 78% of the ECON-O-WASH customers
    have their own washers at home. So why do they need a self-service laundry? As
    one owner put it:


    "If a woman has five loads of wash to do at home, she washes one load after another
    and it takes all day. Here at ECON-O-WASH she simply puts the five loads in five
    washers at once, and does the whole week''s wash and dry in one hour. Then she
    has the rest of the day for more important things.


    "Besides, she gets her clothes cleaner here with our soft water, and they dry
    softer and fluffier in our big professional dryers."


    J. A. Coleman, manager of the Small Equipment Division of The American Laundry
    Machinery Company, Cincinnati, which franchises ECON-O-WASH coin-operated laundries
    to independent businessmen, explains it this way:


    "If you show the women of this country that you can do a job for them better,
    for little money, at a great savings of time, you''ve got a business. In the next
    24 hours, thousands of housewives will wash over 2,000,000 pounds of wash in ECON-O-WASH
    coin-operated laundries. They must like them!"


