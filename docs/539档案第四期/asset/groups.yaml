    # The Day I Switched

    to Instant Tea


    By Mary Margaret McBride, Author, Lecturer and Radio Personality


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_105_1.png)


    Frankly, I was pretty skeptical the day that the Standard Brands people invited
    me to try their new instant tea. Like most women, I''ve found many instant foods
    great work-savers. But instant tea? Would it really save much trouble, I wondered...
    and what about the flavor? Only one way to find out—I made myself some iced tea
    with Instant Tender Leaf and immediately I agreed it saved lots of fuss. No waiting
    for tea to brew. No drippy tea bags. I just dissolved a spoonful of the pure tea
    crystals in a little boiling water, stirred, filled up the glass with ice and
    tap water.


    Then came the most important test—I tasted it. In fact I sat down and drank the
    whole glass. It really tasted just as good as tea made from loose tea or tea bags.
    They tell me that''s because Instant Tender Leaf is 100% pure tea. It''s the only
    instant tea without fillers, dextrine and maltose to dilute the flavor. The day
    I switched to instant tea? It was the day I first tried Instant Tender Leaf. After
    all, not many people would go back to the horse and buggy after automobiles. ANOTHER
    FINE PRODUCT OF STANDARD BRANDS INC.


