    Q. Is it possible to get used to eating less?

    A. Yes, it is. Sometimes people confuse hunger, the need for food, and appetite,
    the desire for food. You can train your appetite and re-educate it to match your
    real needs. This is the natural way to weight control.


    Q. What is the best way to start?

    A. Leading nutritionists suggest this: Eat the same foods you are accustomed to,
    in good variety. Simply cut down on portions. This plan may include sugar for
    energy and as an aid in cutting down.


    Q. How can sugar help you stay satisfied on less food?

    A. It is a scientific fact that no other food can satisfy appetite faster than
    sugar. When mothers want children to eat more food they forbid the eating of sweets
    before mealtime. When you want to eat less you can turn this to your advantage
    and use sugar to help you subtract calories.


    Q. Does sugar contribute to basic nutritional needs?

    A. Yes. Carbohydrate foods, such as sugar, are our primary source of energy needed
    to maintain all life processes and to carry on every activity. When a too drastic
    diet provides too little quickly available energy you tire easily. You’re apt
    to slow down. When you slow down you burn up fewer calories and thus defeat the
    purpose of the diet. Ounce for ounce, no other food supplies energy so fast, with
    so few calories, as sugar.


    Q. Can artificial sweeteners help to train the appetite?

    A. No. These drugs supply only sweetness without any of the physiological satisfaction
    or energy value you get from sugar. From every standpoint, the natural way to
    effective and lasting weight control is a sensible diet which may includes sugar.


