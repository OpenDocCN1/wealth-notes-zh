    # “Lick-And-A-Promise”


    # Toothbrushing:


    # What To Do About It


    By Marguerite Higgins

    Noted Journalist and Pulitzer Prize Winner


    Have you watched your children brush their teeth lately? How long did they spend
    at it?

    Probably not long enough. Or often enough. Or thoroughly enough. Probably nothing
    like the two full minutes, three times a day that dentists recommend!

    “Lick-and-a-promise” brushing like this is an open invitation to all the pain,
    heartache, and expense that tooth decay can cause.

    What can you do about it? Well, the experts I consulted recommend two things.

    First, set a good example for your children. Whenever possible, brush your own
    teeth right alongside them. This helps tell them how long and how well to brush.

    Second, use Crest, the fluoride toothpaste. Crest with fluoride hardens tooth
    enamel, makes it far more “immune” to damage by decay acids.

    The fluoride in Crest works. It works in exactly the same way as the fluoride
    that so many dentists now “paint” on patients’ teeth to prevent decay.

    And it works dramatically. Dental scientists at one of our leading universities
    proved that Crest can reduce new cavities by almost half.

    In fact, your children may have no new cavities between examinations by the dentist—like
    many children who used Crest in the tests. This is the happy result dramatized
    by Norman Rockwell opposite.

    Don’t you agree it’s worth it to form the same toothbrushing habits I’ve formed
    — regular, thorough toothbrushing with Crest?

    Won’t you enjoy knowing that you’re doing your very best—for your children and
    for yourself?


