    ## Charting a safer course against CANCER...


    Just as the pilots of ships chart safer courses by heeding signals, so, too, have
    many people been made safe by recognizing warning signals of possible cancer and
    taking proper action. In fact, thousands of people are alive and well today because
    they knew cancer''s warning signs and were treated in time. For your own protection,
    know the danger signals listed here. Remember, however, that these signals do
    not always indicate cancer. Rather, they may just be signs that something is wrong—and
    that you should see your doctor promptly. If cancer is found, precious time will
    be gained by starting treatment immediately. Even if no symptoms occur, it is
    important to have periodic health examinations, particularly if you are 35 years
    of age or older. Studies show that about 95 percent of all cancers are found in
    people over 35.


    ### Cancer''s Seven Warning Signals

    - 1. Any sore that does not heal

    - 2. Lump or thickening in the breast or elsewhere

    - 3. Unusual bleeding or discharge

    - 4. Any change in wart or mole

    - 5. Persistent indigestion or difficulty in swallowing

    - 6. Persistent hoarseness or cough

    - 7. Any change in normal bowel habits


    If people would act promptly when a danger signal is noticed ... if apparently
    well people would have their doctors examine them regularly ... the American Cancer
    Society believes that the annual number of cancer cases saved could be increased
    50% with weapons now at hand.


