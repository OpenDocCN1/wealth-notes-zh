    # 25、每 6 个月...你就能拥有一只全新的狗狗！


    Speaking of Dogs


    # You own

    a brand-new dog...

    every six months!


    by Hovey M. Burgess

    Manager of Research and Development

    Gaines Division, General Foods


    IN the two minutes it will take you to read this article, Towser there, curled
    up at your feet, will have changed. In fact, about six months from today he''ll
    be an almost totally new animal — biologically speaking, that is. Outwardly he''ll
    look much the same — the same happy wag in his tail, the same loving look in his
    eye. But every living cell in every hair of his coat, every tooth and muscle,
    every ounce of blood will have been actually recreated.


    You see, as with all living things, the microscopic cells that make up your pet''s
    body are constantly being replaced by new ones. And since these new cells are
    made up mostly of protein, the protein in your dog''s diet is vitally important.
    Not just the amount, but the kind of protein, because all proteins are not the
    same.


    Basically, proteins are composed of "building blocks" called amino acids. Ten
    of these amino acids are considered essential to body growth and maintenance.
    And recent nutritional studies show that one in particular, Methionine, is especially
    important for the growth of cells. Yet this is the amino acid most likely to be
    at a low level in many dog diets. The addition of small amounts of Methionine,
    however, enables your dog to make far better use of all the protein in his diet.


    Proteins, of course, are only a part of the nutrition story. No dog can live on
    proteins alone, any more than you can. That''s why good commercial dog foods also
    include properly balanced amounts of the four other groups of food essentials
    — carbohydrates, fats, vitamins and minerals. But whether your Towser is a bouncing
    pup or a sedate old-timer, make sure that his food contains enough high-value
    protein to keep him healthy and strong.


    By the way... as a human animal, you''ll be a "new" person yourself in just about
    two years from now!


