    # The Dental Clinic That Never Filled A Cavity


    # By Marguerite Higgins


    Noted Journalist and Pulitzer Prize Winner


    "Don''t you ever use a drill, doctor?" The scientist smiled down at the patient
    in the chair. "Not in this clinic." "But suppose you find I have a cavity. What
    will you do about it?" "We''ll refer you to your dentist," was the answer. "Our
    only purpose is to study a new way to prevent cavities." The clinic''s job, the
    dental scientist continued, was to test a new stannous fluoride toothpaste—now
    called Crest. By examining the teeth of thousands of volunteer brushers, the clinic
    could find how well Crest prevents decay. Today, the results of the clinic''s
    tests are a matter of scientific record. Crest cut cavities almost in half, compared
    with ordinary toothpaste—for both grownups and children. Putting it another way,
    the brushers who used ordinary toothpaste developed nearly twice as many cavities
    as those who used Crest.


    In fact many people who brushed with Crest were found to have no new cavities
    at all between checkups at the clinic. This wonderful result has been dramatized
    by Norman Rockwell on the opposite page. What makes these remarkable results possible?
    I''m told that, unlike ordinary toothpastes, Crest strengthens "soft spots" on
    teeth against decay. Soft spots are weak places where cavities are likely to start.
    Now, because of Crest, you may find that your dentist, too, has less need to use
    his drill.


    If you use Crest, you can make a simple test of its anti-decay ability— with the
    help of your dentist. Ask him to compare your cavity record before you started
    using Crest, with your cavity record since. You can see how much less decay Crest
    has meant for you.


    A Dental Health Message from Procter & Gamble, makers of Crest Toothpaste


