    # Official Report:


    # Will a Real "Dream Car" Ever Be Designed?


    REMEMBER those rumors about the secret car that delivers 50 miles per gallon?
    Or the special chemical pill that you drop in your gas tank so your car can run
    on water? And how about the radar car that can''t collide with others? Well, for
    the next ten years at least, all these things will stay just plain "rumor". Today''s
    average American car doesn''t do better than 12-14 miles per gallon, and on super-premium
    fuel, at that.


    But the answer to gas economy and easier driving has been found. European car
    makers have been producing cars that will do over 40 miles per gallon on regular
    fuel, for years. The only catch is that most European cars have been either ugly,
    noisy, or too small. There wasn''t enough luxury in economy cars.


    But that''s where Paris comes in. As fashion and design capital of the world,
    Paris is more conscious of comfort and luxury in cars. So it came as no surprise
    that France''s most important car makers, SIMCA, should try to design a realistic
    "dream car". The goal was a car that had everything.


    Here''s what SIMCA did. They designed a car that is really good looking, roomy,
    economical, powerful, quiet running and luxurious to drive, too. On paper it was
    great, but actually producing it for less than $2,000 was the main problem.


    The miracle is, that they did it. Production costs were figured so expertly that
    the "dream" SIMCA can be sold in America for less than $2,000. But there was still
    a long way to go. Production cars had to be tested, and service facilities had
    to be set up all over the United States. A tremendous job. But it was done beautifully.
    SIMCA service today is a vast network that rivals most American car set-ups.


    To test the "dream" SIMCA, they ran it for 600 consecutive hours at top speed,
    averaging 70.02 miles per hour for 62,137 miles. Result? Perfect performance,
    and a new world''s high-speed endurance record. For economy, they ran two SIMCAs
    from San Francisco to Los Angeles. Average? 42.6 miles per gallon! To prove the
    "dream" SIMCA''s power, they actually pulled a huge 9-ton bus.


    Today, the roomy 4 door SIMCA "dream car" is sold everywhere. For your dealer
    name and address write SIMCA Inc., 445 Park Avenue, New York 22, N. Y.


