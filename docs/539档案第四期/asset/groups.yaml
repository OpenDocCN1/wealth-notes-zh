    当然，如果你打紧急电话，任何医生都会登门为你解决问题。然而，有个多年为自己服务，对自己十分了解的家庭医生，情况却截然不同。当家庭医生到家里时，你对他的依赖，不只是一名医生，还是一个朋友。


    这种朋友般温暖的关系，在某种程度上，和他作为医生的医学知识一样重要。这是因为，家庭医生在为病人治疗时，不仅会考虑当前的病情，用药方法，还会综合病人以往的用药历史。此外，和家庭医生常年接触，还能缓解由于生病而放大的很多烦恼，忧虑。


    拥有家庭医生，还有很多其他好处。通过定期健康体检，医生通常可以及早发现问题。立即采取措施。此外，通过定期向医生咨询，遵循他的建议，养成良好的饮食和生活习惯，有助于保持健康的身体状况。


    你的朋友，家庭医生，最清楚什么时候需要住院治疗。什么时候应该咨询专家建议，并请专家协助他治疗。专家，因为他们在自己专业领域研究的深入，对该领域疾病的诊断和治疗经验丰富。所以，是家庭医生的重要盟友。


    为了你未来的健康和幸福，最实用的方法就是，立即咨询你的家庭医生。长期和他保持联系。


