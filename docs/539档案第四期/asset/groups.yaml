    # H型号使用的低压磁发电机和电流断续器的优势


    > "一款有声誉的汽车"


    我们已经充分证明,在过去,我们新H型汽车采用的点火系统,是绝对可靠,并且有效的。


    我们目前用来闭开触点打火的希姆斯博世低压磁电机,能在每个气缸中提供强大的火花。这是最近范德比尔特国际公路比赛中,获胜的大多数汽车都使用的低压磁电机类型,当齿轮驱动时,如斯图贝克汽车,我们发现它几乎是完美的。


    在闭开触点打火装各上使用我们的低压磁电机,需要不到两英尺的线路,避免了短路问题和火花塞烦恼。


    我们的点火系统中,所有的控制机制,都位于汽缸顶部,取放方便。斯图贝克汽车的每一部分,都经过了漫长而艰苦的考验。不断改进,为的是给车主提供更好的服务,而非为了抬高价格。


    我们将在纽约和芝加哥进行展览,欢迎前来参观。


