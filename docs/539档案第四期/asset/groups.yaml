    # All America This Week Helps Itself to Puffed Grains


    Full-Size Package Free

    At Your Grocer''s


    This week your grocer will accept this coupon for a package of Puffed Wheat. Not
    a sample, but a full-size package. We will pay him 12 cents for it.

    All over America—in every town and hamlet—grocers are waiting for these coupons
    now. Cut out this one and present it. There are no conditions—there will be no
    obligation. Let your folks enjoy Puffed Grains tomorrow at our cost.


    Puffed Wheat, 12c Except in Extreme West

    Puffed Rice, 15c 10c


    # Whole-Wheat Bubbles


    You will find that package filled with bubbles—airy, thin and tasty—puffed from
    grains of wheat.

    The grains are roasted by a fleeting heat until they taste like roasted nuts.
    They are puffed to eight times normal size by internal steam explosions. They
    are porous and fragile and crisp.

    They are sized for digestion as grains never were before. Prof. Anderson’s process—chopping
    them grain—has liberated every granule to please. Every element and atom is made
    available as food.

    Millions enjoy Puffed Grains morning, noon and night. They serve with cream and
    sugar—clear rice, those with berries—they float them in bowls of milk. And countless
    children when as play carry Puffed Grains with them.

    This offer is made to let other millions know them. We want your folks included


