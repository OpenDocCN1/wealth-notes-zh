    Only circus performers, like the one here, risk life and limb by using their teeth.
    Nevertheless, good teeth are mighty important to all of us.


    Your teeth deserve good care for many reasons. They aid in maintaining general
    health, for unless food is chewed properly, it cannot be easily digested. Healthy
    teeth also make us look more attractive, help us speak clearly and distinctly.


    Yet, few of us escape dental troubles, as shown by these findings from the American
    Dental Association:


    +   1. Too many Americans have lost half of their natural teeth by age 40. 2.
    Cavities occurring in the teeth of children between 6 and 18 years old run into
    the millions—all of which should be treated.


    Dental discoveries of great value to children have been made. For instance, direct
    applications of sodium fluoride to a child’s teeth may prevent as much as 40 percent
    of the cavities that otherwise would be expected to occur.


    Because early dental care is so important, visits to the dentist should start
    around age three. While little or no treatment may be needed at this age, it is
    a good idea simply to let the child meet the dentist. The first visit, if made
    pleasant and interesting, can give the child a favorable attitude toward dental
    care that may last for the rest of his life.


    Adults should also see the dentist regularly … at least twice a year. If unhealthy
    conditions of the teeth and gums are not treated early, they may lead to premature
    loss of teeth … to say nothing of costly and extensive care.


