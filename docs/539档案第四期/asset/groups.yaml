    # The Secret of Mrs. Rudkin''s New Stuffing


    By Mary Margaret McBride


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_169_0.png)


    ROASTING a turkey for your Thanksgiving and Christmas family dinners is a cherished
    American tradition. It''s fun, too. But making the stuffing is another matter
    — a real chore that has often taken me hours as I mixed, tasted and mixed again.
    So, I''m really glad to announce that this year our festive birds can come from
    the oven bursting with a delicious new stuffing that takes less than 60 seconds
    to prepare! The clever person who created this instant stuffing is none other
    than Margaret Rudkin, the red-haired New England housewife who bakes Pepperidge
    Farm Bread. The recipe for Mrs. Rudkin''s stuffing is a secret. But after long
    and enthusiastic sampling, my guess is that she blends her golden bread crumbs
    with thyme, sage, onions, celery, bay leaves, basil, and marjoram.


    You can get this fine Pepperidge Farm stuffing at almost all good grocers. One
    package will stuff a five-pound chicken generously. Two packages are plenty for
    a turkey, and well worth the price — your bird will taste more succulent and serve
    more people.


    Of course, you may want to add some ingredients of your own, but if you are like
    me, you''ll let Mrs. Rudkin do the whole job. Anyway, the great thing is to know
    that the tedious job of making your stuffing from scratch is now a thing of the
    past. Yet Pepperidge Farm stuffing tastes so homemade everybody will be sure you
    made it all yourself!


