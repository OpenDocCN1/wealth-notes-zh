    ## 说到狗狗


    ## 大热天，狗狗的感受


    来自：詹姆斯R·基尼 兽药学博士

    《如何在城市以及郊区养狗》合著者


    当热浪来袭时，你是否担心你狗狗的不舒服？不要着急。你的狗狗可能要比你的其他朋友更能泰然处之呢！


    例如，正常的狗狗不会冒着中暑的危险，在酷热的阳光下打网球。他也不会光着膀子，晒太阳。通常，他只会找个最阴凉的地方，懒洋洋地躺着，直到气温降下来。


    所以，在大多数情况下，让你的狗狗以自己认为最好的方法来对待高温。如果你住在城市，那么，在凉爽的早晨和晚上带它出去溜溜。因为，它也会出汗，（大多通过它的舌头排汗），所以，让它喝点新鲜，清凉的水——它可不像你一样，喜欢不新鲜的水。


    如果你想给狗狗把毛剪短，千万不要！大自然已经帮它换上了一件夏天的外套。（还记得你每天清扫的狗毛吗？）褪毛剃下的，不仅可以防止太阳晒到它的皮肤，像热绝缘体一样，让它保持凉爽，还有助于保护它不受蚊子和苍蝇的侵扰。


    如果你的狗狗因为炎热，食欲似乎有点下降，不要把它的食物换成沙拉和冰茶！它仍然需要和去年冬天一样的必需食物。依然喂它营养均衡，高蛋白的狗粮吧——减少食物数量就可以了。你的狗狗越健康，它在炎热的天气也就越快乐。


    也许你想了解更多信息，帮助你的狗狗拥有健康，亮丽的毛发。那么，请写信到伊利诺伊州坎卡基，盖恩斯狗狗研究舍，4 部门，免费索取《宠物美容小贴士》手册。


