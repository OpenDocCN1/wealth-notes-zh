    ## 24、谁说狗狗该洗澡了？


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_118_0.png)


    ### Speaking of Dogs


    ### Who Says

    It''s Time for a Bath?


    by Josephine Z. Rine

    Author of "Your Dog from Puppyhood to Old Age" and other dog books


    ASK A DOG how often he should be bathed, and he''ll probably give you a loud "Never!"
    Most humans, however, would agree that a tub every 4 to 8 weeks keeps a dog easier
    to look at . . . and live with.

    With kind words and a little applied psychology, bathing Bowser can be fun for
    both of you. Well, almost fun. First, put a rubber mat in the tub so he won''t
    lose his balance and his nerve. Check to see that the water is just moderately
    warm as you would for a baby—use the elbow test—and don''t run it higher than
    about the middle of his legs. Then prepare him for the great adventure by plugging
    his ears loosely with cotton. From here on, lather up finally, but gently, with
    mild soap. Keep the suds away from his eyes and ears—and keep on making friendly,
    reassuring conversation.

    Two soapings should do the trick. Rinse with a hand spray, and make the last rinsing
    as long and thorough as you both can stand it. Take a moment to congratulate each
    other and draw breath, then give him a brisk rubdown with heavy towels and keep
    him in the house for two hours or until his coat is completely dry.


    Let''s face it, however . . . some dogs are so tub-shy that the battle is not
    worth it. The answer here is a dry shampoo. For that matter, plain corn meal works
    well, too. As for puppies under six months, no tub baths. But all dogs, no matter
    what age, need a brushing every day. Daily grooming, plus a balanced diet with
    high-protein value, will keep your dog''s coat sleek and healthy. Add an occasional
    bath, and he''ll be the Beau Brummell of his bailiwick!


    Perhaps you''d like more information on helping your dog to a healthy, glossy
    coat? Just write to Gaines Research Kennels, Dept. 5, Kankakee, Illinois for "Grooming
    Tips." The booklet is free.


