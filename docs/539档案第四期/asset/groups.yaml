    ## 店里有服务员吗？


    终极自助服务：这里没有工作人员，没有收银员，没有服务员，只有客户


    想象一下，20000 家门店，没有服务员，一天 24 小时，一周七天，每天收到数百万美元的硬币，会是怎样的情景？这是二战结束以来，最惊人的成功商业故事之一。


    这些商店就是投币洗衣店。这些无人值守的洗衣店取得巨大成功的同时，也在很大程度上反映了美国女性的另一面。在没人注意的时候，她们会怎么做？


    “这些女人让我感到很惊讶，”比尔·肖特，一个投资自动投币洗衣店作为副业的热水器推销员说道。


    “我很好奇，如果我离开洗衣店，去了较远的地方，在洗衣店的休息区供应上饮料，热咖啡，糖果以及爆米花机，甚至还有投币吹风机、和牌桌，会发生什么。


    “结果令我非常惊讶，我的洗衣店成了社区活动中心。女孩子们似乎很期待来这里洗衣时，碰碰面！因为我很少关心我的洗衣设备，这些女孩子们会帮我把它们保持得十分整洁，干净。去年圣诞节时，为了表达我的感激，我在店里为她们安装了彩色电视。”


    有时，这种让顾客宾至如归的感觉，也会带来适得其反的效果：南部城市的一个律师，认为来洗衣服的顾客会很享受店里的音乐，于是自助洗衣房安置了自动唱片点唱机。有一天晚上，他开车路过洗衣店，发现点唱机的音响被开到了最高。一个家庭主妇在洗衣服，三对年轻的夫妇在休息区高兴地跳舞！


    另一个惊喜：最近一项调查显示，在自助洗衣房洗衣服的顾客中，78%的人自己家里都有洗衣机。那为什么他们还要来自助洗衣店


    洗衣服呢？某位洗衣店老板说：


    “如果家里有 5 桶衣服要洗，主妇们就得一桶一桶地接着洗，这可能需要花费她一天时间。但是在自助洗衣房，她只需要把衣服一次性放到 5 个洗衣桶里，一周积攒的衣服，一个小时就洗完了。她接下来的时间就可以去做更重要的事情了。”


    “此外，这里软水水质好，在把衣服洗干净的同时，她们还可以在我们大型专业烘干机里把衣服烘干，衣物会变得既干净，又柔软，蓬松。”


    J· A· 科尔曼，美国辛辛那提洗衣机械公司小型设备部经理，自助洗衣房特许经营权的人，这样解释道：


    “如果你向这个国家的女人展示，只要很少的成本，你就可以为她们把工作做得更好，为她们节省很多时间，你就会有生意。在接下来的 24 小时内，成千上万的家庭主妇，会在自助洗衣房投币清洗超过
    2000000 磅的衣物。他们一定很喜欢这种洗衣方式！”


