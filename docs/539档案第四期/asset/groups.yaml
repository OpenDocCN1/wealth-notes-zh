    # Advantages of Low Tension Magneto and Make-and-Break Spark as Employed on the
    Model H STUDEBAKER


    > "The Automobile with a reputation behind it."


    WE have amply demonstrated during the past season, that the ignition system as
    employed on our new Model H Car is absolutely reliable and effective. The Simms-Bosch
    low tension magneto, which we use to furnish the current for our make-and-break
    spark, gives an extremely large and hot spark in each cylinder. This is the identical
    type of magneto employed on the winning cars in the recent Vanderbilt international
    road races, and when gear driven, as in the Studebaker car, we have found its
    service to be practically perfect.


    In furnishing the current for the make-and-break spark with our low tension magneto,
    less than two feet of wiring is required, short circuiting troubles are avoided
    and spark-plug annoyances are eliminated. All the controlling mechanism of our
    ignition system is located on the top of cylinders and is readily accessible.
    Every part of the Studebaker Car is the result of long and painstaking experience.
    Our improvements have all been for better service, not for exploitation. See our
    exhibit at the New York and Chicago shows.


