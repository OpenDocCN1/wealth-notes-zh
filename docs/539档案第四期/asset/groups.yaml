    # America’s Most Shocking Eating Habit


    An interview with Dr. Herman N. Bundesen, a leading authority on public health


    by Robert S. Kleckner


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_126_0.png)


    "Inadequate breakfasts are endangering the health of the nation ... and particularly
    that of school children!"


    Hale, hearty at 73, working 12 to 14 hours a day, Dr. Herman N. Bundesen, president
    of Chicago’s Board of Health and its chief officer for 35 years, made that indictment
    of parents and other adults for what he said had become a national bad habit.


    “The habit of breakfast skimping,” the doctor stated, “or of no breakfast at all,
    was begun by adults in a hurry. It has spread alarmingly to youngsters.


    “A thought-provoking breakfast study has revealed that about 80 per cent of our
    children go to school with an inadequate breakfast under their belts. Some had
    none at all before tacking their three R’s. This is damaging


    to a person’s well-being, and creates a physical and mental handicap. Once behind,
    you don’t catch up on food.”


    An ideal breakfast, for youngsters and adults alike, would consist of fruit, a
    cereal like oatmeal, milk, bread and butter. “This,” said Dr. Bundesen, “gives
    the nutritional values ... vitamins, minerals, body-building protein ... needed
    to last through the morning hours and prevent let-downs.”


    The bouncy, often outspoken health official who, incidentally, received no remuneration
    for this interview, added: “I practice what I preach, too. My breakfast is always
    oatmeal, orange slices, milk, bread and one cup of coffee. I take oatmeal because
    of its high-protein content. I like a hot breakfast, both winter and summer, that
    really sticks to the ribs. Needless to say, my own children and grandchildren
    were raised on oatmeal.


    “It is the responsibility of all adults to keep themselves and their children
    fit and healthy. This is impossible without proper nutrition. An adequate breakfast
    is imperative, for young and old alike.”


