    ## 作业


    ## 23、大热天，狗狗的感受


    ### Speaking of Dogs


    ### Dog Sense

    for Dog Days


    by James R. Kinney, V.M.D.


    Co-author of "How to Raise a Dog in the City and in the Suburbs"


    ![](img/5142c325ef645c1205e4b3ac2db7a75e_115_0.png)


    WHEN a heat wave hits, do you worry about how your dog will take it? Don''t be
    alarmed. Chances are your pet is showing more common sense than most of your other
    friends! For instance, no dog in his right mind romps around with a tennis racquet
    under a blistering sun and risks sunstroke. Nor does he strip to the waist and
    invite sunburn. Usually, he simply finds himself the coolest, shadiest spot within
    range and lazily lies down till the temperature comes down.


    So for the most part, let your dog handle the heat as he thinks best. Just make
    sure there''s some place where he can get out of the sun. If he''s a city dog,
    take him out for exercise only in the morning and evening, when it''s cooler.
    And because he perspires, too, (mostly through his tongue) keep his drinking bowl
    filled with fresh, cool water—he dislikes stale water as much as you do.


    If you''re tempted to give him a close clip, resist! Nature has already stripped
    him down to a summer coat. (Remember all that hair you''ve been sweeping up?)
    What''s left of his coat not only keeps the sun off his skin and acts as insulation
    against heat... it also helps protect him from gnats, mosquitoes and flies.


    And, if your pet seems to go a little off his feed during a hot spell, don''t
    switch him to salads and iced tea! He still needs all the food essentials he needed
    last winter. Stay with a well-balanced, high-protein dog food—just reduce the
    quantity. The healthier your dog is, the happier he''ll be during hot weather.


    > For more information on keeping your dog happy this summer, send for a free
    booklet, "Hot Weather Care of Dogs." Just write to Gaines Research Kennels, Dept.
    4, Kankakee, Illinois,


