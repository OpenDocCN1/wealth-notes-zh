    其次，使用佳洁士，含有氟化亚锡的牙膏。含有氟化亚锡的佳洁士能坚固牙釉质，让它能 “抵抗” 酸性蛀牙物质的侵蚀。


    佳洁士中的氟化亚锡的作用。氟化亚锡，和现在很多牙医给人们牙齿上喷的一种防止蛀牙的 “牙漆” 效果一样。


    它的效果非常显著。国内一所著名大学的牙科学家证实，佳洁士能防止 50% 的新蛀牙产生。


    事实上，和很多在佳洁士测试中，使用佳洁士牙膏的孩子一样，你的孩子用了佳洁士，也不会再有新的蛀牙产生。通过和使用普通牙膏的另一部分儿童的对比，更突出了这种新型牙膏的优势。


    养成和我一样的刷牙习惯——定期，彻底地用佳洁士刷牙，是非常值得的，你同意吗？


    你给了孩子和自己最好的牙齿保护，难道你不开心吗？


