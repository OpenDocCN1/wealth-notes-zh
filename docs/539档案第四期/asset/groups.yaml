    \n## 她坐着轮椅来到诊所......成功治愈后，高兴地跳起了波尔卡舞\n\nF.G.太太，72岁，因为关节炎，无法自由活动，经诊断，医生确定其无法治愈。去瑞典一个诊所时，她还需要服务人员抬进去。六周后，她健康地摆脱了轮椅，在出门时，甚至高兴地跳起了波尔卡舞！\n\
    \n## 治疗前他的胳膊和腿几乎不能动——现在他可以滑雪了\n\n卡尔·恩贝格，46岁，曾是一个运动员，由于风湿性关节炎，结束了他的职业生涯。他的关节发炎、肿胀，他的胳膊和腿几乎不能动。经过8个月的治疗，他被完全治愈了，如今又回到了滑雪场！\n\
    \n## 遭受关节炎的折磨6年——在短短3周成功治愈\n\n吉尔迪·戴贝，一个年轻的家庭主妇，患关节炎，服药6年都无济于事。她的关节炎渐渐地变得更严重，其中一种药物还使她视力受损。然而经过比约克花园诊所的治疗，3周她就摆脱了关节炎的折磨......这是病例记录中，见效最快的一位患者。\n\
