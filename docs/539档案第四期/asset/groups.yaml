    立可舒在美国，以及在其它国家的销售权，都是以相应比例的金额进行购买的。我们之所以要提及这个事实，就是想要表明立可舒的价值——对你的价值。之前从来没有人为购买某种治愈疾病的发明投入这么多资金。


    我们不需要再向您赞述，我们在购买立可舒之前，已经证实过它的效果了。因为，多年以来，它已经通过美国和其它国家的医生和医院试验过了。它在细菌疾病的每一个阶段都可以使用，在最严重的情况下也都能实现其效果。通过成千上万个曾经被认为无法治愈的康复病人，我们便可以证明，立可舒可以做到药物无法做到的事情。这样，只有这样，我们所支付的价钱才是值得的。


    从那时以来，我们已经花费了将近200万美元来使立可舒为世人所知。我们购买第一瓶之后，将它免费送给每一位我们知道的病人。这些人会告诉其他人，而其他人又会告诉其他的人。最终的结果是：现在，立可舒的使用率已经比其它任何药物都高了。并且，没有人会质疑立可舒为病人带来的效果，它要比所有药物混合在一起使用的效果都大。


    # 杀死内部细菌


    立可舒最大的价值，在于它在杀死体内细菌的同时，不会杀死健康组织。没有其他任何方法能做到这点。任何能杀死细'
  - '[PAGE 38]


    菌的药物都是毒药，不能内服。因此，药物对任何细菌引起的疾病几乎都束手无策。


    立可舒是一种杀菌剂，这点毫无疑问，所以，我们敢在每个立可舒瓶子上都印有，如果有一种细菌我们无法杀死，我们会赔偿 1000 美元。它不仅无害，而且还具有神奇的好处——这些好处，世界上任何其他杀菌剂都无法带给你。一个人，不论他有多么健康，都可以从这款产品受益。


    原因是，细菌都是植物性的；立可舒——就像浓浓的氧气——对植物性有致命的伤害。对人体，立可舒则有活化细胞，振奋精神，排除毒素的效果——它可能是人体最需要，对人体最有益的物质。但是，它对细菌则有强大的摧毁力，确定无疑。


    # 细菌疾病


    现在已知的细菌疾病，都是因为细菌或细菌产生的毒素引起的。这些疾病并不适合用药物治疗，因为药物无法杀死内部细菌。


    所有那些说能够治疗细菌疾病的药物，都是一些滋养品，帮助身体打败细菌。但是，这些效果都不是直接的，而且也很不确定，因为它取决于病人的身体状况。使用药物是否有疗效，很难确定，并且有些细菌疾病药物永远也无法治疗。


    而立可舒可以摧毁这些疾病的根源。它会融入在血液里，到达血液经过的任何地方，所以没有任何细菌能逃避它。几乎是百分之百见效。药物多年都无法治愈的疾病，立可舒一次就能治愈。“无法治愈的疾病”被它治愈了。下面这些疾病，不管处于什么阶段，立可舒都肯定能带来治愈效果，我们愿意给任何病人绝对的保证。


