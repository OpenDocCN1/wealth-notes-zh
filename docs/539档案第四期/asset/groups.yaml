    # 失败是成功之母


    …必须有人去奋斗。承诺能达到效果的，最后无疾而终。在世界各地的研究，一无所获。在实验室度过的漫长夜晚，黎明时也只是哀叹。


    必须有人去奋斗。医生和药品行业科学家联手工作。经过顽强，永不放弃的努力，他们终于发现一种新药物。或许是为了给双腿残疾的人带来自由，或让人勇敢面对现实。


    每当医生开一副新药时，背后都会有这样的故事：为了研究这种新药，经过了多年的挫折，资金投入了数百万。（某公司花了 12000000 美元研究一种市场上目前从未有过的疫苗。）但最终，病人将得到最好的效果：拯救生命、缓解疼痛。


    这就是美国的药物研究——全力以赴去研发新药，以比以往治愈这种疾病成本都低的价格，给患者带去最好的效果。


    数百万人因为昨天的研究，保住了生命。还有数以百万计的人，将受益于现在正在做的研究。


    这则广告由处方药制造商赞助，药品制造商协会成员，其目的是通过不断地研究，发现更好的药物。


