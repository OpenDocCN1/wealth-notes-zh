    ## 美国最令人震惊的饮食习惯


    专访公共卫生权威人士赫尔曼·N·邦德森博士


    来自：罗伯特·S·克莱克纳


    > “早餐吃的不充足，正在威胁着国民的健康……尤其是学生！”


    73 岁依旧身体硬朗，精神矍铄，每天工作 12 到 14 小时的赫尔曼·N·邦德森博士，担任芝加哥健康委员会主席和首席官 35 年，他指出，父母和其他成年人不好好吃早餐，已经成为一个全国性的坏习惯。


    “不好好吃早餐，”邦德森博士说，“或者直接不吃早餐的习惯，刚开始是匆忙的成年人养成的。现在已经危及到年轻人。”


    “一份发人深省的早餐的调查显示，大约 80%的学生去上学时，早餐都吃不好。有些在上课前甚至不吃早餐。这对人的健康更有害，会造成生理和心理障碍。一旦身体亏损了，你就无法只通过饮食弥补了。”


    一份理想的早餐，年轻人和成年人都一样，包括水果、谷类麦片、牛奶、面包和黄油。邦德森博士说，“早餐要给身体提供丰富的维生素、矿物质、蛋白质等营养价值，能量需要持续一上午，防止疲惫。”


    这位精神抖擞，经常直言不讳的卫生官员，顺便说一下，本次采访，他没有收取任何报酬，补充道：“我也亲自实践我说的东西，我的早餐通常包含燕麦片、橙片、牛奶、面包和一杯咖啡。我食用燕麦片，因为它蛋白质含量高。不管是冬天，还是夏天，我都喜欢吃一顿热乎乎的早餐，燕麦片的饱腹感真的很强。不用说，我自己的孩子和孙子也在吃燕麦片。


    “让自己和孩子健康是所有成年人的责任。没有营养均衡的早餐，不可能做到这点。不管是老人，还是年轻人，都需要充足的早餐。”


    这是桂格燕麦,母亲燕麦制造商桂格燕麦公司的一则公益广告。


