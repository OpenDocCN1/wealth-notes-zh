    都没有效果，她的病情恶化，剧烈的疼痛使得她都无法自己回房。结果，用自然生物疗法，不到一个月的时间，她就完全被治愈了。5年后，她仍然十分健康。


    # 来自一位瑞典医药学医生：


    > “许多患者在各种常规治疗都失败后，通过生物医学疗法恢复了健康。生物医学和自然疗法将脱颖而出，将越来越多成功替代传统疗法；和那些徒劳无功的传统疗法相比，他们现在是唯一的选择。”——拉尔斯·埃森医学博士


    # 这些真实案例表明关节炎可以治愈


