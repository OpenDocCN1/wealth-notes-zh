    # “我不清楚你是怎么做到的”

    “这辈子见过的最划算的交易”

    “从来没有这么物超所值”

    “妙不可言”

    “我带着这些书旅行了数千英里了”


    数百页的《国家地理杂志》中,充满了这套美丽的《小皮卷》购买者比上面更加热情洋溢的评价。但还有一个更让人印象深刻的“无声投票”。那就是,已经有将近 2000
    万套《小皮卷》,被各行各业爱书人士所购买。每卷都享 30 天零风险退款保证。卖出去的这 2000 多万本书,都可以被退回,并拿到退款,但是没有一个人这么做:没有什么比这更能让人相信这套书的非凡价值了!


    # 这个提议是不是太好了,你都觉得不敢相信?


    想想,购买 30 卷《小皮卷》,里面全是最伟大的文学杰作,只要 2.98 美元。这些作品,包括,如莎士比亚、吉卜林、史蒂文森、爱默生、坡、柯勒律治、彭斯、奥玛开阳、麦考利、林肯、华盛顿、奥斯卡·王尔德、吉尔伯特、朗费罗、德拉蒙德、柯南道尔、爱德华·埃弗雷特·黑尔、梭罗、丁尼生、勃朗宁等等不休作家的经典作品。每卷都有完整的内容,精美的包装,包装外面的浮凸,使包装看起来非常像皮革,专家甚至都无法区分。整套包含超过
    3000 页。甚至我们出版社的朋友,都非常惊讶,我们是怎么做到的。答案很简单:因为我们一次印刷 100 万册。


    # 退款保证


    没有任何文字,或图片,能恰到好处地描述这本书。你必须亲眼看看。如果你还有一点怀疑,我们可以给你邮寄这 30 套书,包退。你现在不用支付任何费用——只要邮寄下面优惠券,或给我们来信。当你收到书后,只要给快递员支付
    2.98 美元,加邮费——如果你看后,有“一丁点的失望,你都可以把它回寄给我们,我们不仅会退还 2.98 美元给你,而且邮费也会退给你。


    # 如果你立即订购


    # 还能免费获得吉卜林 4 套书!


    如果你立即订购,我们还会额外赠送 4 套吉卜林的书籍给你。这 4 套书包括：《吸血鬼》、《各种各样的人》、《人力车怪影》、《权力的会议》、《伊姆雷归来》、《通道尽头》、《小牛的叛乱》、《我自己的真实鬼故事》等。


