    当一个文明崛起了，一个国家富强了，这个国家的所有资产价格都会上涨，所有文化符号都会产生价值，甚至对全世界有溢出效应，这是必然的。


    如果一个文明衰落了，那么兵败如山倒，残存亦无路，绝大部分人除了被收割，是没有选择的。有没有意外呢？有的，广州十三行的买办，上海租界的大买办，这是“幸存者偏差”，被影视剧和文艺青年所怀念的。


    那么我们如何做多？


    达叔在上一篇文章里，有匆匆提到三个问题，在接下来的内容里会尝试着进行分解。


    **是节奏型问题还是结构型问题：**


    这个问题，是推荐给各位分析自己所在的行业的。比如达叔身边曾经有一个500强公司的CFO，有着一颗文艺青年的心。


    在一次职业选择的关口，让达叔给分析一下，有机农庄庄园的生意，他想尝试一下，达叔花了一个下午的时间，就反劝他不要去做。


    本质上很简单，但也很残忍，中国几十年快速崛起的原因有很多，但其中有一条很重要就是：中国城乡二元结构。


    这个基本结构，解决的是中国不靠对外掠夺，对内转移支付，通过几十年对农产品价格的压制，把更多的剩余价值转移去支持工业建设，看达叔文章的人有没有对农村熟悉的？如果你熟悉的话，就应该知道，几十年农产品的价格，几乎没有什么增长，无论城里的房子、农药化肥种子、货币M2增长了多少，它就是几乎不长。


    但是大规模的集中化经营会不会改变不赚钱的状况呢？可能会，但是需要赌，大规模集中化经营的目的是解决效率问题，效率问题在一定程度以上可以归为节奏型问题，肯定不是结构型问题。


    如果城乡二元结构不变，那么你就很难在农业上赚到大钱。


    **是周期型问题还是趋势型问题：**


    达叔一直认可王家卫电影中的一句话：“念念不忘，必有回响”。


    ![](img/d747a49dab77676cf44faebe24df049c_398_0.png)


    说的俗一点，就是有那么一个事，你得老惦记着。


    比如中国所有的政府旁边、马路上时不时的立一个石碑“不忘初心”，这个估计很多人是无感的，但达叔每次看到的时候，都在想，这个初心是什么？


    是带领国家富强，使人民过上好日子，是一个有使命的组织。有使命就比没有使命要好，有宏大的目标就比没有目标要好，有长远规划就比短期急功近利要好。


    对于个人呢？要趁着年轻多思考自己做的事情、从事的行业目前存在的问题是一个周期型的问题，还是一个趋势型的问题。


    比如，如果你是一个鸡农，周期型的问题是什么？公司好坏坏坏，眼见他起高楼、眼见他宴宾客，眼见他楼塌了。


    趋势型的问题是这个 IT 行业的黄金时间是不是正在过去？新技术在更新，新的语言被发明，大量的年轻人被大学供应出来，这些对于日渐年长的你，何以自处？


    周期和趋势，本质上都是时间的概念，只是一个周而复始的往复，如同经济周期，成长—繁荣—泡沫—衰退—复苏—成长，只要现金流不断、不下的牌桌，就永远都有机会，但是趋势一旦判断错了，就没有回头路了。


    **是局部型问题还是整体型问题？**


    这段时间我想写一篇文章，叫“年轻人在愤怒什么？”，后来没有时间耽搁了，就暂时还没写。


    愤怒出诗人，但是愤怒应该不是一个特别良好的情绪，尤其是在关于赚钱和财富积累上。很多人在职场里，看到公司里的一些阴暗面、遇到的一些挫折，有生气骂街的，有愤而离职的，但真正认真分析背后原因的人少而又少。


    经济学里有一个基本的假设，就是假设每个人都是自私的理性人。这一假设可能很多人不认可，也有很多经济学家不认可，但是不重要，因为先有了这个假设，才会有后面一大堆的理论推导和结论。


    一些在你看来不合理、难以接受的事情，在当事人身上就是极其合理的，甚至把你的屁股放在那个位子上，你也会这么做。比如贪官，比如滥用职权，比如以权谋私等等。


    越是资源少的人，越容易坚持原则，因为你的原则兑换价低，因而特别容易高估自己的品格，低估资源远远多于自己的人的品格。


