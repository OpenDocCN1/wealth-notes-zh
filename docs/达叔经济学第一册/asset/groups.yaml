    \n人口疯狂流入，郑州常住人口已破千万，河南省当之无愧的单核城市。\n\n达叔预测，郑州未来的人口规模也会达到2000多万，很多人没有这个想象力。\n\n\
    郑州已经彻底甩开曾经的老大哥洛阳，而且差距会越拉越大。\n\n郑州的房价如下图：\n\n![](img/d747a49dab77676cf44faebe24df049c_85_0.png)\n\
    \n不熟悉郑州的朋友，看一眼房价，感受郑州的中心在哪里？\n\n郑州房价的天花板在郑东新区，就是那个曾经被誉为亚洲最大鬼城的地方。\n\n河南省政府北边一点，二手房价格3万元左右，比比皆是。\n\
    \n达叔为什么今天再写一次郑州？\n\n因为要写一个角度：权贵的迁徙。\n\n人是流动的，逐利而居，一堆堆来，一堆堆的走，我们要跟上时代的步伐。\n\n上次达叔去拜访L总，在硕大的茶桌后面喝茶。\n\
    \n就是之前写过移民加拿大的那个L总，他住的小区原来是郑州最好的小区，在郑州市中心，现在已经破败，只剩下老人。\n\n而千年古城的洛阳，现在资产价格如何？\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_86_0.png)\n\n已经和郑州逐渐拉开了距离，未来距离还会越来越大。\n\
    \n当郑州房价均价破5万/ $m^2$ 的时候，洛阳只会被甩的越来越远，为什么？\n\n因为洛阳的权贵们，都会把资产投向郑州，人往高处走，水往低处流。\n\n\
    你要是想收益更高，跟着权贵们的步伐，他们有更多的投票权，会把资源更多的截留到自己身边，为自己修地铁、建医院、建学校。\n\n你是地方官员，你也这么搞。\n\n\
    利益永远是自上而下分配，风险永远是自下而上承担。你不坐在桌子前，就得躺在桌子上。\n\n今年发洪水前，达叔就举例98年洪水泄洪区选在了安徽境内，上保武汉，下保南京。很不幸，今年又遇洪水，又是泄洪安徽。\n\
    \n达叔发文章的时候，只是讨论房价，不知道今年会有洪水。但是年初抗疫，年中抗洪，安徽又一次站出来，现身说法。\n\n明明是一个悲剧片，又被拧成了一个感动中国片。\n\
    \n# 安徽洪排坝倾夫多高清在线观看\n\n![](img/d747a49dab77676cf44faebe24df049c_87_0.png)\n\n达叔再劝一句，如果有读者在这个区域的，把房子、土地处理掉，赶紧跑。\n\
    \n跑向合肥，跑向南京，跑向自己力所能及的最高能级城市。\n\n你所在的地方，已经被放弃了，个人在泰坦尼克上再努力，也于事无补。\n\n很多时候，你要的不是多努力，而是要会选择。选择大于努力。\n\
    \n你在阿里巴巴做前台，能身家过亿，走上人生巅峰。你在中兴做前台，年纪轻轻就得打包走人。\n\n这和你工作能力没关系，你做笑笑露出八颗牙齿、早到晚退、勤快无比，都不重要。\n\
    \n大到城市，小到公司，就是你的平台，就是你的电梯，你能走多高，拥有多少财富，不仅仅是你个人的努力，更是平台给的机遇。\n\n### 城市的限购\n\n每个人对限购的态度，最说明他的思维复杂程度。最近深圳、宁波、南京等7个城市，在疫情之后，限购升级，你怎么看待这个事？\n\
    \n达叔先说一个观点：不限购的城市，是没有前途的。什么东西需要限购？有价值的好东西，人民需求极其旺盛，但是供给有限。\n\n比如疫情期间的口罩，比如高能级城市的房子。\n\
    \n7月，南京的限购政策进一步收紧，达叔有个朋友在南京，刚和老婆离婚，为了多拿一个南京的房票。\n\n结果来福建开了个半年会，回去楼市政策变天了，急得给达叔打电话，说房产中介店里，买家和卖家打起来了。\n\
    \n除了限购收紧，南京还出台了个特别烧脑的“摇号”政策：\n\n![](img/d747a49dab77676cf44faebe24df049c_89_0.png)\n\
    \n看着这个图，各位能想到哪几件事情？\n\n达叔先来说几个：\n\n- 达叔之前的文章里曾经说过，楼市比股市要公平的多，楼市里最大的庄家 是政府。\n\n\
    \  这个庄家为了要继续高价卖地，不会砸盘，土地是一级市场，楼市平稳上涨，最符合地方政府的利益。\n\n  你买了这个城市的房子，就是买了这个城市的股票，享受这个城市的红利，你屁股就坐在了庄家这一侧，对面的都是空军。\n\
    \n- 在部分限购、限价严重的城市，比如杭州、南京等，出现万人摇号的宏大场面。为什么？因为一二手房价倒挂严重，一旦摇中，就相当于地方政府送了上你上百万。\n\
    \n  这比买彩票都刺激，买彩票还要花钱，而摇号几乎不用，只要动脑筋，就有资格。\n\n- 这个摇号有漏洞可以钻么？以前有，现在达叔能保证的是，上海、杭州、南京肯定是没有，没人敢顶风作案。\n\
    \n  有漏洞可以操作的城市，都衍生出了茶水费、号头费等一系列灰色地带，每一楼盘，都遣富一批新贵。\n\n- 摇号对人才的倾斜。\n\n  闭着眼猜想一下，你是地方政府长官，你会怎么对待人才？是欺负他们，还是呵护他们？有好东西是想着给他们，还是给其他人？\n\
    \n  如果你想清楚了，再来倒推，政府把摇号的房子给人才优先，是不是可以倒推出这个房子是个大福利？要是个炸药包，会去炸人才么？\n\n  既然是大福利，要不要去抢？不抢，是不是傻？\n\
    \n- 对无房人士的倾斜。\n\n  中国目前绝大部分家庭，最大的资产构成就是不动产。那么推理出有房子的普通家庭，就比无房家庭要有钱。地方政府除了对人才有政策倾斜之外，是不是还充当了利益再分配的作用？\n\
    \n  贫富差距虽然越拉越大，是全世界共有现象，但是能够通过微操，减缓一些，不是利好？\n\n  如何微操？让无房人能够买到优质的资产——摇号 的房子。\n\
    \n  如果无房的穷人，摇号买的房子，结果房价还跌了，你觉得政府是不是很混蛋？除了售楼处的砸，会不会连市政府 都受牵连？\n\n  毕竟，穷人是最不好惹的。\n\
    \n  既然是照顾穷人、缩小贫富差距，那么房价会跌么？不仅不会跌，还会继续涨，这才是政府的良苦用心。\n\n  让房产成为一种普惠型的金融资产。\n\n \
    \ 限购区域，给你留的机会。\n\n![](img/d747a49dab77676cf44faebe24df049c_92_0.png)\n\n这张图，是宁波2017年的限购图。\n\
    \n宁波作为一个人854万，2019年人口净流入40万，GDP破万亿，千年不败的民营经济之城。\n\n城市骨架不断拉大，看这个限购图，你觉得哪里不对么？\n\
    \n只是看图形，是不是右上角有一个缺口？缺口的这个地方叫庄市。是这一轮限购中，宁波楼市最火的区域。\n\n从1万左右的房价，一路飙涨到均价23000元左右，次新房价格25000元以上。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_93_0.png)\n\n右上角的块庄市板块，孤零零的站在那边，价格和老城区的天一广场核心区均价2.6万相差无几，是不是特别的令人拍案惊奇？\n\
    \n这就是限购的魅力。\n\n还有什么因素？宁波把市政府搬到了东部新城。\n\n和郑州一样，宁波的权责们会跟着新政府办公地迁徙，东部新城的房价，未来才是宁波的天花板。\n\
    \n政府亲自下场，指挥资金去哪里，一听指挥。\n\n等这些边角角落发展起来了，宁波市骨架拉大。\n\n2017年后，这一轮宁波的涨幅远远超过杭州。\n\n\
    宁波的翅膀变硬了，市政府2020年7月，又画了一个圈，新的限购圈。\n"
