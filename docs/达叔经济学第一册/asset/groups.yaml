    ## 第三十四篇 SK#140 流水不争先，争的是滔滔不绝，一周年记


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    周末连续两天网上，现实踩点，在给父母寻找能照顾失能老人的养老院，前几天不舒服，导致左眼有点感染，像兔子一样，昨晚就没写文章了。


    顺手接了一个广告，就学会了连发两篇文章，把星哥对达叔的投资，顺便也发了一下。


    不出意外，就有读者，在后台给达叔留言，你这货不是刚吹完牛逼，不接整版广告，要讲一千零一夜的故事，你怎么解释？


    不解释，就是牛逼吹大了。并且，学会了一天发两篇的技能后，达叔猛然发现，恰饭和日更，竟然也并不冲突。


    今天眼睛没好利索，缓解了一些，达叔提醒俺，今天是您账号的一周年生日，你可得写一篇好文。


    她一边说，一边在厨房切莴笋，达叔站在旁边问，什么样的文章，叫做好文章？你想看啥样的？


    达婶一转身，把菜刀伸向了达叔，就写千了这一年，你有啥感谢，进步，帮大家开阔一下发家致富的思路。


    那达叔就写几个点，与各位共勉，只代表个人观点，不一定对，随便看看。


    今天的文章，是每月的一次付费阅读，文末打赏、丰俭由人。


    ### 选择


    1、命运对人的考验，不是在你在忙的时候，而是你在闲的时候，你会做什么选择。


    达叔第一次觉得自己有丰沛的表达欲，想写文章，是 2015 年。


    那一年，达婶正在怀孕，职场也不是很顺，达叔拿个小本子，里面画满了自己的自媒体路线图，给她讲了半天，要如何如何。


    就如同达叔给她吹的无数个牛，达婶是无视的，事实证明，她是对的，达叔写了几篇，就没坚持下来，后来工作一忙，就荒废了。


    完美错过一次发家致富的机会，没有赶上公众号等文字自媒体的超级红利。


    再次想起这事，是 2020 年初，被疫情关在家里，憋坏了，才开始写自媒体。


    刚开始，在知乎上写，从零起步，很快成为 8000 多关注的小 V，势头很猛，经常能有几十万的阅读，几乎每周都能杀入作者的 1%，也就是超越 99% 的作者。


    每周都有统计，达叔开心坏了，但很快就被反噬了，因为达叔的文字，过于血腥，被多次警告，最后一次被关进了小黑屋，长达 7 天。


    那时候，每天傍晚，达叔都要去小区门口取快递、拿菜，怀里抱着一堆东西，脑子里突然想：


    > 这个平台既然关我小黑屋，我干嘛不去其他平台玩呢？


    于是，一年前的今天，315，达叔经济学公众号开张了，去年没有安排打假，出了这么个玩意。


    所以，很多组织，不要天天试图去遏止谁、惩罚谁，大家是合作关系，过于折腾，会失人心的，人是会跑的。


    2、红利期。


    达叔为了严肃玩自媒体，花了一千多块钱，报了个班，买了一堆的书，几乎头部大 V 的书，俺都看了一遍。


    理性的数据，都在告诉俺，公众号的红利期，已经过去了，现在是玩视频的时代。


    达叔照了一下镜子，好像也只能吃文字这碗饭，知人者智，自知者明。


    达叔专门写过 SK#34 什么是大生意？什么才是你的大生意？，视频是个大生意，但不是俺的大生意。


    除非哪天，我想到了其他更好的切入点，当然，也要变得更有时间。


    人生的绝大部分时间，都是处于没啥红利的状态，有红利是幸运，没红利拼命努力，才是常态，不能因为没红利，就不干了。


    占不到便宜，就生气，那得多么愚蠢的人才干的事。


    微信系统，即使再不是红利期，它仍然是客户量最大的载体，对内容最包容的载体，关注者最有价值的载体。


    以上三点，微信远高于其他平台，就如同房地产市场一样，虽然被骂，被抖音频、视频的轻视，但其地位没变、本质没变，只是舆论变了而已。


    为此，昨晚体外诊断网李光宇的视频说，流水不争先，争的是滔滔不绝，说出了达叔的心中所想，既然没赶上红利期，那就好好写，慢慢写，争取滔滔不绝。


    ### 本质


    3、要分清，什么是本质，什么是流言，什么才是适合自己的。


    现在信息太多了，我们要每天要经历，无数个流言、无数个惊悚的新闻，甚至很多荒诞的政策。


    比如，如果你要是一个农民，听到有一个人在搞事情，口号是“阎王来了不纳粮”，你开心么？想不想阎王赶紧来？


    如果你鼓掌欢迎，当你放下拍肿的手，再得想一步，阎王带一大群人，是不从事劳动的，不纳粮，怎么养活？用什么养活？


    如果你发现他们没有特异功能，那这个口号，就是个骗术，是暂时的，是幻觉。


    任何一个口号，背后都有代价，任何一个貌似善意的政策，背后都有成本。


    如果你环顾四周，没有找到那个代价，那么你就是那个代价，你就是成本。


    这一条，适用于所有，包括职场、孩子、教育、养老、金融、房产等，凡事多想几步。


    如果不能获利、避害，是没有人去推动任何政策的。


    到目前为止，我们在大问题上，没有能力推动任何政策，只能去分析每个政策，谁是最后的受害者，只有把他们找出来，才可以安心。


    4、链接产生财富。


    如果可以，达叔建议各位找到一个自己的才华，用某个产品，把它放大，去链接潜在的合作伙伴。


    这一年，达叔是切实的受益者，这种获益程度，能达到一年顶十年，速度之快、规模之大，极其令人震惊。


    5、愿意承担风险。


    达叔平日里，和文章中，都是一个很开放的人，说话直来直去，不屑于绕弯子，这本身是一种高效的表现，很多人和达叔说，这是你的风险点。


    为了高效，我们愿不愿意承担风险？


    有读者远道而来见他，让达叔给他分享致富秘笈，只要见过的，基本都知无不言。但真正能实践的，没有几个。


    风险偏好，骨子里本就不同，勉强不来，即使是帝王伟业，有的人活成了曹操，有的人活成了司马懿。


    但是，要记得一句话，你不干就不干，别怪命运多舛，环境不好。


    上下几千年前，我们这代人，肯定生活在罕见的黄金年代，环境是大大的好。


    ### 专注


    6、所有行当，都是内行人赚外行人的钱。


    达叔做医疗行业的，在医疗系列里，写过精妙的骗局，就发生在身边。


    真正能长期赚钱的医疗人，基本都是盯着某个细分领域，做专、做精、做深，成为业内专家，才能赚持久的大钱。


    所有的二道贩子，没一个做大的，人行十几年，东一榔头西一棒，吃百家饭，没有任何忠诚，亦没有任何积累。


    这一点，无论是职场、还是投资，都是如此，你玩股票、基金、期货、房产、比特币，能玩的就那几个，玩什么自己好深造。


    不学习就盲目跟风的，没一个有好下场。


    要选择一两个方向，长期投入、拼命进攻，打穿、打透，成为最专业的人，然后你不仅不会被骗，还能赚到外行人的钱。


    中国人有三座大山，教育、医疗、房产，达叔选了后两个，能干一辈子的行业，是永远的热点。


    你选的攻击点，是什么？准备干多久？你能干多久，不认输？


    7、主动剔除。


    无论我们做什么，都会有人指手画脚，如果你坚定自己提供的价值，是独特的，是有复制的，是有长期收获的。


    对这些指手画脚的人，进行主动剔除，一个不做事的人，最擅长的，就是告诉你，你这么做，是没意义的，放弃吧。


    他们是真诚的，但也是错误的。


    悲观者往往正确，乐观者往往成功，我们要个毛正确，我们要的是成功啊。


    离他们远一点，别像个苍蝇一样，打扰我们干活。


    还有三观不同、经历不同，志向不同，教育成本太高的，不必勉强，世界辽阔，各玩各的。


    8、不追热点，多研究趋势，什么是不变的，不因人的意志为转移的。


    人口结构老龄化是趋势，医疗是趋势、养老地产是趋势，少子化是趋势。


    利率下降是趋势，负利率时代是趋势。


    农业时代，土地盐铁茶酒，千年不变，碰者非富即贵；工业化后，同样属性的金融、石油、矿产、电力、自来水、房产等，碰者非富即贵。


    这里面，政府亲自坐庄，无法完全垄断，给民间唯一留的缝隙，就是房产。


    其他所有游戏，都可以抛开你，庄家自己玩，普通人只有买单的份。


    最后的缝隙，也在收网，严格限制了，又打又骂不让进，各位看着办。


    9、对标原则。


    达叔一直的原则，进入一个领域，我要找一个偶像，作为对标。


    找到偶像，学习偶像，打败偶像，这是对偶像最大的致敬，这是对偶像衣钵的传承。


    比如某个细分领域，偶像年长、能量强，我就数量大、频率多。


    偶像比我多写了 2 年，多积累了 2 年，我就把时间跨度拉长，以十年为期进行决战，到时偶像的积累是 12 年，我的是 10 年，已经相差无几了。


    当然，更大的可能是，偶像做着做着，自己就放弃了，干别的去了。


    自我放逐，是绝大部分人，享受完某个事之后，最多的选择。


    只要他是人，不是神，就可以追上，关键是，你真的很想么？你愿意为此，付出什么？


    理想，从来都不是口号，理想的另一个名字，叫代价，是你愿意付出什么。


    你什么都不愿意付出，不愿意出钱，不愿意花时间，不愿意辛劳，你有个毛线理想。


    ## 第三十五篇 FC#35 借汝人头一用，以平众怒


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    2021 年 4 月 8 日，星期四，中午 11:57。


    达叔收到微信，我们到咯，在大厅等你。


    达叔回，好，我下来。


    随后给广东的同事打电话，潜在的经销商到了，咱们到酒店大堂拎一下，过会一起吃个午饭。


    电话挂后，从酒店的房间，匆匆把工作的相关数据整理完毕，开始去大堂碰头。


    一见面，经销商老板穿个 T 恤衫、短裤，一脸佛相，很随和，旁边站着一位美女，淡蓝色的一席连衣裙。


    寒暄握手，同事也到了，一行四人，坐电梯到酒店四楼中餐厅吃饭。


    以下内容，只代表个人观点，不一定对，随便看看。


    1


    落座之后，大家相互介绍。


    这位美女是深圳的楼宇大 V，达叔这个账号，除了医疗的读者之外，另外一波读者就来自于房产投资。


    达叔说，你老公昨晚给我发微信，说他去北京了，干啥去了？


    美女一脸淡定的说，去 JH 去了。


    广东的同事，筷子差点吓掉了，一脸惊讶的看着我，完全没有听懂的样子。


    达叔看着对方，双手抱拳，佩服佩服。


    旁边的经销商老板，就开始陈述自己这几年的经历，做医疗生意的，搞房产投资的，说他和美女住一个小区，眼睁睁的看着美女夫妻俩迅速崛起，从百万起步，做到资产数千万。


    经销商老板问，达叔，我那个医疗公司能不能卖掉？


    达叔听完很震惊，很严肃的说：


    - 第一，你的医疗公司年营业额不到 3 千万，体量不够；

    - 第二，你这两千多万的生意里，产品不够专注，是由多个产品组成的，这也是个硬伤之一；

    - 第三，更大的问题是，这些产品拿的都是二级代理商，没有一个是 一级代理，这样的生意，在买家看来，是很危险的，即使你的终端客户抓得再牢，也很难卖掉；

    - 第四，很多经销商为了避税，把公司拆成好多个，把每个公司的营收做低，成功避税，避的是小钱，大概率就赚不到资本上的钱了。


    江湖上，有人说过一句话，多交税的生意，才是好生意，不交税的生意，不是赚钱少，就是风险高。


    我之前的文章中写，医疗的黄金 20 年，才刚刚开始，别的年轻人都在打鸡血的往前冲，你却想跑，太奇怪了。


    对方被打击到了，觉得手里的公司，卖是卖不掉了，指着美女说，我觉得她的生意特别好，赚钱也很多，我本来想把公司卖掉，跟着她们一起搞房子生意的，你觉得如何？


    达叔说，你只看到贼吃肉，没看到贼挨揍。她那个生意，有多难，你知道么？


    对方摇头说，不知道，看着很简单啊。


    达叔对着美女说，我自己没做过，但是我对一些生意，换位思考的能力有一点，我瞎说一下试试，如果说错了，你给纠正一下，可以么？


    美女点头说，好。


    2


    达叔说，这两个生意相比较，医疗的生意，医院在哪里、客户在哪里，几乎永远在哪里，只要你人跑到了，能够坚持不懈，你就肯定能赚到钱，目标客户非常明确。


    他们房管家的客户在哪里？知道么？


    完全是刷流量的生意，看着容易，其实非常艰难，流量是非常贵的，而且未来，会越来越贵。


    这个月流量好，生意好，下个月流量不好，连续几个月流量起不来，生意不好，顿时公司就人心涣散，队伍没法带了。


    这种流量，还受政策影响极大，和你的努力，几乎没有关系，就像现在的深圳、上海等城市，严厉的政策下来之后，整个城市的交易量，瞬间暴跌。


    这种冰冻，会冻几年？谁都不知道。


    手底下的这些人，怎么办？无事就要生非，必须得找点活干。


    美女狂点头说，把团队的人，派到杭州和武汉去开拓市场了，就怕没活干。


    达叔说，这些培养起来的人，一旦解散了，下次机会来的时候，再培养，根本就来不及。


    今天解散的人，未来大概率就是失散了，还有可能在未来，成为你的竞争对手。


    在这里相比，医疗领域 IVD 的政策，比楼市的政策，那是小巫见大巫，日子还是太爽了。


    除了客户明确、稳定，政策优势之外，更重要的是，客户的素质。


    我们医疗玩家面对的客户，不出意外，是所有行业里，最高端的客户群之一。


    有哪个行业的销售、面对的客户，几乎都是硕士、博士、教授级别的？


    客户明确、稳定，还特别有文化，这是多么神奇的存在。


    我们医疗同行销售，在医疗行业待久了，几乎没有意识到，自己有多幸运。


    这叔身边的朋友，干啥的都有，以阿里巴巴的同学为例，他们出去卖诚信通，客户都是做进出口贸易的小老板。


    打电话是要骂人的，见面是要摸大腿的，很多人都是泥腿子出身，路子都特别野，纯商人，几万块钱的生意，能把你折磨死，数量多，素质参差不齐。


    这种客户，就像盒子里的巧克力，你永远不知道，下一个是什么口味。


    见完一个客户，下一个客户在哪里，茫茫网海，哪怕公司有数据库，都找不到，拔剑四顾心茫然，这才是其他很多行业销售的痛苦。


    说回流产生意的顾客，素质必然也是参差不齐的，你做医疗 IVD 生意，客户即使拒绝你，一般也不会骂你的吧？


    对方点头说，是的，没被骂过。


    这叔接着说，那就对了，因为医生客户是坐商，我们是行商，他们是固定地点经营的，我们是行走江湖的，他们为了安全，一般都是与人为善。


    但是，在网上流量的生意，那就要野蛮多了，有了网络这种高科技，有些人千里之外，就能把你气的头疼。


    越是匿名的、免费的，越是容易被骂，无休无止的纠缠，虽然我没有经历过，但我能想象的出来。


    美女坐在对面，一脸悲伤的狂点头说，是的，刚开始我的咨询，是免费的，后来全部改成付费的了。


    一改成付费的，整个客户素质，就提高了很多，成单率，也提高了很多，以前免费的时候，被骂、被喷的概率，要高很多。


    经销商老板很惊讶，你之前咋没说过，还有这么多的糟心事？


    美女老板说，这些糟心事，和你说干嘛？你又帮不上啥。


    达叔说，以上的情况，还不是最严重的，更严重的，还在后面。


    能伤害你的人，都是你的身边人；有能力伤害你的人，大概率都是你信任的人。


    这是刑事犯罪里，破案的铁律，出了命案，大概率就是身边人，有交集的人干的。


    3


    房价涨的时候，这些付费用户，你帮助过的客户，涨的几百万，他们都不会分你一分钱的。

    '
