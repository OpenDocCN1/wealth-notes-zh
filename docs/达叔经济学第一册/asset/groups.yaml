    # 第十五篇 SK#63 一个草根是如何爬起来的，关于成长和投资的一点思考


    今天的文章会写一点达叔对成长和财富的思考，仅是个人经历和感悟。


    不熟，不做。


    这个道理，看着十分的简单，但是很多人不交一遍学费，就永远不知道自己的边界。


    好多年前，达叔在上大学的时候，有一天，某学弟兴冲冲的跑到达叔宿舍，说在网上一批运动鞋，价格非常便宜，50 块钱一双，总共有 600 双，要不要做？


    算一下账，50*600=3 万，达叔和学弟还有另外一个同学，每人凑了一万，去淮海路把货给拿了。


    那一年，达叔大二。


    鞋子是耐克，是高仿，肯定不是真货，这我们三个心理都是有预期的。看着质量挺好，觉得拿回来，卖 100 块一双，1-2 个月翻一倍，是肯定没问题的。


    为什么这么自信？


    因为达叔当年在学校也算是一个小小的风云人物，搞校园旅游等，能调动的资源还是挺多的，掐指一算，能覆盖三个大学城，十几万的潜在客户。加上觉得运动鞋这个东西是个刚需，就把货给进了，连价都没讲。


    # 为什么？


    觉得 50 块钱一双，很便宜。


    卖家是一个住在上海淮海路，老破小，一个女的，浓妆艳抹。


    这批货是他一个朋友的，鞋子堆在她的房间里，除了床，全部堆满了。等达叔再长大一些，推测这应该是一个性工作者，鞋子是她一个客户的。


    中间有很多的故事和艰辛，在这里就不展开了，除了直销之外，达叔慢慢发现，好像掉进坑里了。


    - 1、鞋子是有尺码的，好销的尺码卖的较快，越到后面，偏大和偏小的尺码，滞销了，这一点，年轻时代的达叔，竟然没想到，绝大多数的生意人，最后都是死在库存上。


    - 2、开始做分销。发现同样是学生，隔壁一个同济的，研究生，比达叔大 4 岁左右，明显工作就做的很扎实。


    他过来看了一下产品成色，达叔当时给他的报价是 60-70/双，他回去做了 3 天的调研，告诉达叔，你手里的货价格大概在 15 元/双。


    这种震撼，好多年过去了，一直深深印刻在达叔的脑海里，达叔本能的反应，就是觉得这个家伙是个骗子，是杀价的策略，完全不相信。


    这个同济的研究生，一脸怜悯看着年轻的达叔，问，你的拿货价是多少？我把研究的路径和你说一下，你研究一下是不是拿高了。


    于是，达叔从网上的阿里巴巴店找到福建、广东货源，再到学校周边找了几家实体店老板，调研一番之后。


    他是对的。


    晴天霹雳，这种信仰的崩塌对人气土的打击是巨大的。


    当你拿货价是 50 时，卖 60，是理直气壮的，当你知道


    自己的产品价格是在 15 左右，再卖 60，内心的障碍就要高很多。


    这是很多经销商老板，不告诉自己手下销售产品底价的原因之一，怕影响士气和心理微妙变化。


    后来，经过一番操作，直销 + 分销 + 尾货处理给了劳保店，折腾一个学期，财务上来算，不赚不赔。


    但从机会成本来看，损失惨重。


    后面的一些年里，任何生意，达叔都变得谨慎很多。


    达叔身边也有很多精彩的经销商老板被骗故事，年营收做到 8000 多万，久经沙场 20 年，仍被精妙的骗局骗去几十


    万，甚至上百万。


    但由于是其他人的故事，设计太精妙，在此就不展开了。


    但无论设计的多精妙，底层的逻辑都是，陌生的我们走进了别人熟悉的领域，徒遭收割。


    P2P 再火热、股市的起起落落，比特币的教父级讲座早年讲座达叔在现场听了，都没去参与，肯定错错过一些机会，但躲过了很多坑。


    公众号懒人搜索，懒人专属群分享


    达叔花了好多年的时间，把房产领域研究了一遍，边研究、边实践，足够打光手里所有的子弹。


    也许，哪天达叔开始仔细研究证券市场，几年之后，达叔也开始练手了，在这之前，还是要耐得住寂寞。


    因为现在达叔不懂这个市场。


    没有杠杆的生意，不是个好生意。


    杠杆的本质，是一种以小博大的模型。


    两千多年前的司马迁都懂这个道理，他在《史记-贷殖列传》中写道，人生在财货追求上，分为三个阶段：无财乏力---少有斗智---既饶争时。


    无财乏力：当你是草根，啥也没有的时候，就安心靠出卖体力赚钱，没有资本积累，能赚大钱的路子基本上都写在刑法里了。


    达叔这个账号的口号是，让我们一起慢慢变富。


    因为暴富应该不属于我们绝大多数人，你要是能暴富，你也不会看达叔这么个账号。


    少有斗智。看达叔文章的各位，至少都是中产阶级了，属于有一定经济基础的，达叔说的上杠杆，基本就是这个阶段。


    在中国的金融政策，对个人是很不友好的，只留了一个房贷的口子，给个人可以上3倍以上的杠杆，这是国家给所有中产阶级的福利。


    对于房贷的认知是福利，还是毒药，把人分成了两类，多军和空军。


    这个认知和选择，在过去的十几年，拉开了一大批人的财富差距。


    很多人对投资房产者的财富增长，愤愤不平，但没看到他们所承担的风险。


    当空军在说要腰斩的时候，多军坚定看多；


    当空军吃喝玩乐的时候，多军节衣缩食；


    每一年，空军在媒体的大肆渲染下，过着愉快的内心生活，身心愉悦，等着看多军的笑话，等着多军被腰斩，被彻底套牢。


    多军咬着牙关，吃糠咽菜，从此现金是路人，上足杠杆，衔枚疾行，部分城市（包括杭州）曾经阴跌5年，在家里多军受尽白眼，是什么让多军前进？


    是智力，是对趋势的判断，是对纸币的不信任，是对经济发展和不动产价格之间底层逻辑的判断。


    只有足够的信念，才敢持续的加杠杆，多军觉得规律比口号更有效。


    除了加不动产的金融杠杆，其他和我们普通人相关的，还有职场贵人杠杆，婚姻杠杆，这些都可以把我们的人生带到新的阶段。


    在本职工作中，以达叔的工作为例，来分析一下杠杆模型。


    同样的人，同样的卖力气，达叔在之前的公司，生意额一年只有 300 万左右，上面领导相互打架，弄的鸡飞狗跳，关键还赚不到钱。


    后来，达叔就跑了。


    换到现在的公司，同样的上海区域，只是换了一个公司和产品，5 年左右的时间，生意额从 1700 万涨到 7000 万左右。


    生意快速增长，职位有进展，区域有扩大，生意规模每年几千万的上涨。别忘了，同样的人，同样的干活卖力，一个好的公司，好的产品，就是个人能力的杠杆支点。


    达叔写过 JJ#28 弄懂沉没成本，发现劝你坚守的都是骗子，各位如果还很年轻，都要学会分析自己所在的公司、产品与自己能 力 和 付 出 的 匹 配 程 度
    ， 如 果 没 那 么 合 适 ， 该 跑 要 赶 紧 跑 。


