    ## 第四十九篇 JJ#9 大人，钱都会被吹牛的人赚走了！\n\n达叔本来想起的标题是《你以为你以为的就是你以为的么？》。\n\n想了半天，太绕了，大家应该不会喜欢。\n\
    \n关注这个号的应该还是喜欢，简单粗暴的。\n\n上海虹桥那边的国际会展中心附近，达叔今天过去见个朋友，他过去做副总了，打电话让一定过去一起坐坐，和他大老板一起聊下。\n\
    \n上午十点，到了一楼大堂来接。\n\n气势恢宏，整个园区，两栋高大的写字楼，都是自己公司的。\n\n先由副总和两个秘书陪着，逛了几层展厅，各国产品，机器人之类的。\n\
    \n大老板到了，聊了个把小时，达叔还有别的安排，就先撤了。\n\n下楼的时候，看着满墙的荣誉证书，不由感慨，太能吹了。\n\n这里里面绝大部分都是一口一吹出来的。\n\
    \n很多人都不喜欢吹牛，甚至认为吹牛的绝大部分都是骗子。\n\n为什么？\n\n因为骗子的确太多。\n\n但更重要的是，我们含蓄的文化，耽误了我们发现吹牛之美。\n\
    \n吹破了，是骗子；吹成了，就是传奇，是预言的自我实现。\n\n但绝大部分人，是远离骗子的，包括杭州城里、湖畔花园里的这个。\n\n很多人感慨命运不公，但你问一下自己，当年坐在这个屋里，内心不呵呵么？\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_408_0.png)\n\n关于如何创造财富，很多国家的精英，都是犯了大错的。\n\
    \n如果你不信，达叔问你，请问是生产创造财富，还是交易创造财富？\n\n给你五秒钟的时间，闭上眼睛想一下。\n\n中国建立后，1997 年才取消了 “投机倒把罪”，2008\
    \ 年才最终撤销了 “投机倒把” 条例。\n\n生产虽然创造财富，但创造更大财富的是交易。\n\n只要是交易，就会产生信息不对称，连相声都知道，“从南京到北京，买的没有卖的精”。\n\
    \n工匠精神是吹，寿司之神也是吹，当然达叔这样对匠人的评论可能会伤害了文艺青年的心。\n\n但真相就是这样，老年人的味觉会伴随着年龄逐步退化，舌乳头萎缩、味蕾减少，这是生理性的。\n\
    \n你相信一个八九十岁、自己味蕾都退化严重的老人，能做出顶级的美食，支付高昂的成本，这本身就是一种广告的力量。\n\n当然寿司之神，被米其林摘星除名了，后来还打官司，达叔不表了。\n\
