    达叔花了好多年的时间，把房产领域研究了一遍，边研究、边实践，足够打光手里所有的子弹。


    也许，哪天达叔开始仔细研究证券市场，几年之后，达叔也开始练手了，在这之前，还是要耐得住寂寞。


    因为现在达叔不懂这个市场。


    没有杠杆的生意，不是个好生意。


    杠杆的本质，是一种以小博大的模型。


    两千多年前的司马迁都懂这个道理，他在《史记-贷殖列传》中写道，人生在财货追求上，分为三个阶段：无财乏力---少有斗智---既饶争时。


    无财乏力：当你是草根，啥也没有的时候，就安心靠出卖体力赚钱，没有资本积累，能赚大钱的路子基本上都写在刑法里了。


    达叔这个账号的口号是，让我们一起慢慢变富。


    因为暴富应该不属于我们绝大多数人，你要是能暴富，你也不会看达叔这么个账号。


    少有斗智。看达叔文章的各位，至少都是中产阶级了，属于有一定经济基础的，达叔说的上杠杆，基本就是这个阶段。


    在中国的金融政策，对个人是很不友好的，只留了一个房贷的口子，给个人可以上3倍以上的杠杆，这是国家给所有中产阶级的福利。


    对于房贷的认知是福利，还是毒药，把人分成了两类，多军和空军。


    这个认知和选择，在过去的十几年，拉开了一大批人的财富差距。


    很多人对投资房产者的财富增长，愤愤不平，但没看到他们所承担的风险。


    当空军在说要腰斩的时候，多军坚定看多；


    当空军吃喝玩乐的时候，多军节衣缩食；


    每一年，空军在媒体的大肆渲染下，过着愉快的内心生活，身心愉悦，等着看多军的笑话，等着多军被腰斩，被彻底套牢。


    多军咬着牙关，吃糠咽菜，从此现金是路人，上足杠杆，衔枚疾行，部分城市（包括杭州）曾经阴跌5年，在家里多军受尽白眼，是什么让多军前进？


    是智力，是对趋势的判断，是对纸币的不信任，是对经济发展和不动产价格之间底层逻辑的判断。


    只有足够的信念，才敢持续的加杠杆，多军觉得规律比口号更有效。


    除了加不动产的金融杠杆，其他和我们普通人相关的，还有职场贵人杠杆，婚姻杠杆，这些都可以把我们的人生带到新的阶段。


    在本职工作中，以达叔的工作为例，来分析一下杠杆模型。


    同样的人，同样的卖力气，达叔在之前的公司，生意额一年只有 300 万左右，上面领导相互打架，弄的鸡飞狗跳，关键还赚不到钱。


    后来，达叔就跑了。


    换到现在的公司，同样的上海区域，只是换了一个公司和产品，5 年左右的时间，生意额从 1700 万涨到 7000 万左右。


    生意快速增长，职位有进展，区域有扩大，生意规模每年几千万的上涨。别忘了，同样的人，同样的干活卖力，一个好的公司，好的产品，就是个人能力的杠杆支点。


    达叔写过 JJ#28 弄懂沉没成本，发现劝你坚守的都是骗子，各位如果还很年轻，都要学会分析自己所在的公司、产品与自己能 力 和 付 出 的 匹 配 程 度
    ， 如 果 没 那 么 合 适 ， 该 跑 要 赶 紧 跑 。


    趁年轻。


