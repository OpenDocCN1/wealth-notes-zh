    那达叔为啥要聊这一块？


    因为今天谈者的问题，面临的是人生最大的一个选择，一旦选错，基本就废了。


    外地户口，未婚，女，研究生，不想读博。


    要不要留在北京？要不要去做医生？要不要北京户口？


    在北京，目前只能找到三甲医院急诊科的工作，到外地，能进专科。


    小姑娘，头脑还算清楚，觉得要留在北京，城市大于职业，这个见识，不是每个人都有自己的。


    你们也别和达叔杠，一杠你们就是对。


    达叔聊的不是地域差别，而是人域差别。


    达叔一路从小地方拼杀出来，知道人才济济，和人才凋敞，分别是啥样的。


    来上海后，达叔几乎没有一天，敢懈怠，身边的人，一个比一个牛，见识一个比一个厉害。


    就像今天这样，拆解亲密关系的课程，你在小地方，去哪听？


    上网？


    你怎么链接到真人？怎么建立信任？怎么产生合作？


    每往前走一步，都是困难重重，任何一步，都有可能是你再也无法翻越的门槛。


    有一次，达婶在泡茶，达叔和她聊见识的事儿儿，我说，你知道我刚来上海时候，谁给我的帮助最大么？


    达婶说，难道是我？'
