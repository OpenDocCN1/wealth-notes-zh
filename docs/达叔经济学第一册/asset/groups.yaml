    当一个文明崛起了，一个国家富强了，这个国家的所有资产价格都会上涨，所有文化符号都会产生价值，甚至对全世界有溢出效应，这是必然的。


    如果一个文明衰落了，那么兵败如山倒，残存亦无路，绝大部分人除了被收割，是没有选择的。有没有意外呢？有的，广州十三行的买办，上海租界的大买办，这是“幸存者偏差”，被影视剧和文艺青年所怀念的。


    那么我们如何做多？


    达叔在上一篇文章里，有匆匆提到三个问题，在接下来的内容里会尝试着进行分解。


    **是节奏型问题还是结构型问题：**


    这个问题，是推荐给各位分析自己所在的行业的。比如达叔身边曾经有一个500强公司的CFO，有着一颗文艺青年的心。


    在一次职业选择的关口，让达叔给分析一下，有机农庄庄园的生意，他想尝试一下，达叔花了一个下午的时间，就反劝他不要去做。


    本质上很简单，但也很残忍，中国几十年快速崛起的原因有很多，但其中有一条很重要就是：中国城乡二元结构。


    这个基本结构，解决的是中国不靠对外掠夺，对内转移支付，通过几十年对农产品价格的压制，把更多的剩余价值转移去支持工业建设，看达叔文章的人有没有对农村熟悉的？如果你熟悉的话，就应该知道，几十年农产品的价格，几乎没有什么增长，无论城里的房子、农药化肥种子、货币M2增长了多少，它就是几乎不长。


    但是大规模的集中化经营会不会改变不赚钱的状况呢？可能会，但是需要赌，大规模集中化经营的目的是解决效率问题，效率问题在一定程度以上可以归为节奏型问题，肯定不是结构型问题。


    如果城乡二元结构不变，那么你就很难在农业上赚到大钱。


    **是周期型问题还是趋势型问题：**


    达叔一直认可王家卫电影中的一句话：“念念不忘，必有回响”。


    ![](img/d747a49dab77676cf44faebe24df049c_398_0.png)


    说的俗一点，就是有那么一个事，你得老惦记着。


    比如中国所有的政府旁边、马路上时不时的立一个石碑“不忘初心”，这个估计很多人是无感的，但达叔每次看到的时候，都在想，这个初心是什么？


    是带领国家富强，使人民过上好日子，是一个有使命的组织。有使命就比没有使命要好，有宏大的目标就比没有目标要好，有长远规划就比短期急功近利要好。


    对于个人呢？要趁着年轻多思考自己做的事情、从事的行业目前存在的问题是一个周期型的问题，还是一个趋势型的问题。


    比如，如果你是一个鸡农，周期型的问题是什么？公司好坏坏坏，眼见他起高楼、眼见他宴宾客，眼见他楼塌了。


    趋势型的问题是这个 IT 行业的黄金时间是不是正在过去？新技术在更新，新的语言被发明，大量的年轻人被大学供应出来，这些对于日渐年长的你，何以自处？


    周期和趋势，本质上都是时间的概念，只是一个周而复始的往复，如同经济周期，成长—繁荣—泡沫—衰退—复苏—成长，只要现金流不断、不下的牌桌，就永远都有机会，但是趋势一旦判断错了，就没有回头路了。


    **是局部型问题还是整体型问题？**


    这段时间我想写一篇文章，叫“年轻人在愤怒什么？”，后来没有时间耽搁了，就暂时还没写。


    愤怒出诗人，但是愤怒应该不是一个特别良好的情绪，尤其是在关于赚钱和财富积累上。很多人在职场里，看到公司里的一些阴暗面、遇到的一些挫折，有生气骂街的，有愤而离职的，但真正认真分析背后原因的人少而又少。


    经济学里有一个基本的假设，就是假设每个人都是自私的理性人。这一假设可能很多人不认可，也有很多经济学家不认可，但是不重要，因为先有了这个假设，才会有后面一大堆的理论推导和结论。


    一些在你看来不合理、难以接受的事情，在当事人身上就是极其合理的，甚至把你的屁股放在那个位子上，你也会这么做。比如贪官，比如滥用职权，比如以权谋私等等。


    越是资源少的人，越容易坚持原则，因为你的原则兑换价低，因而特别容易高估自己的品格，低估资源远远多于自己的人的品格。


    公众号懒人搜索，懒人专属群分享


    你分析的框架总是纠结于道德、品格，没有看到背后巨大的利益，没有看到巨大的势能，从而发生了错判。


    中国的经济增长不会因为你看到的一些腐败，一些阴暗而停止，甚至有理论曾经尝试论证腐败是改革开放硬启动的润滑剂，让一部分人先富起来，你也不要问达叔认不认可这一观点。


    另一个是中国经济增长的双轮驱动，除了改革开放释放出来的小老板们、企业家群体，还有地方政府公司化竞争的地方官员，前者居功至伟，后者亦是功不可没。


    车轮滚滚向前，亦是滚滚向钱，你准备好了吗？


    今天写到这个地方，没找到发红包的小程序，关注公众号，回复抽奖，应该可以抽，其他的命题再发。


    关注达叔经济学，让我们一起慢慢变富。


    ## 第四十八篇 JJ#8 如何看待逆全球化？还能好好赚钱么？


    这两天，美帝特朗普又发疯了。


    5月14日在接受福克斯电视台采访的时候，口出狂言：如果美国和中国“彻底切断关系”，可以省下5000亿美元。虽然全球除了他之外，没人知道这5000亿是怎么算出来的。


    话毕，道琼斯指数在 30 分钟内，急跌 450 点。


    随后，美国疑似启动全面针对华为的进一步打压政策，引起全球广泛关注。


    全球化结束了么？如何看待逆全球化？


    看“逆全球化”，要先看懂“全球化”。


    而全球化的概念又要分为两个：“广义全球化”和“狭义全球化”。


    广义全球化，是一个大概念，是从发现美洲大陆开始的，长达500年的大历史。


    期间发生过无数次的波折，无论是西班牙、葡萄牙的崛起与衰落，还是荷兰、英国的崛起，德国崛起、美苏争霸，全球化，是一种秩序安排。


    只要是秩序，就要有维护秩序的成本，这个成本由谁承担？


    由这个秩序的最大受益者承担，一般都是全球化的顶尖霸权帝国。


    很长一段时间，都是由英国来维持秩序，后来英国衰落了，就主动退下了。


    美帝国接棒，建立了一大堆的国际组织，收服了一大堆小弟，学习古罗马体系，用“杠杆原理”，低成本高效率的追求地缘政治和战略目标。


    在这五百多年里，逆全球化发生过无数次，甚至好多次的规模都比现在要大的多，比如一战、二战、大萧条、美苏争霸、两套体系。


    但500年整体上来看，全球化，并没有被抑制，反而都在加速。


    因为资本永不眠，它不因个别人的意志而转移，全球流动，全球追求利润。


    在每一个时代，都有人崛起，有人没落。有人赚的盆满钵满，有的人输的倾家荡产。所以，在关注大趋势的同时，更应该时刻研究时代的特性，顺势而为，赚自己能赚的那笔钱。


    在航海时代，科技不发达的时刻，不停的战争都无法抑制全球化，何况现在大家都拥有相互毁灭的能力、IT信息技术全球互联的年代？


    那么这次所谓的逆全球化，逆的是什么？


    逆的是“狭义的全球化”。


    狭义全球化是指 1970s 里根、撒切尔夫人为代表的美、英领导的全球新自由主义。


    尤其是美国打造的全球化，美好理想中的全球体系是：


    ![](img/d747a49dab77676cf44faebe24df049c_403_0.png)


    资料来源：笔者自制。


    这是中国人民大学 霍东升教授画的图，美国就是全球化的中心国家，通过美元霸权，收割全世界。


    在这个体系里，任何一个老二，想要挑战老大的地位，到目前为止，无论是德国、日本、苏联统统都失败了。


    为什么？


    因为只要你还在大规模的使用美元，一切以美元计价，那么你在和印刷美元的国家打架时，你也在体系中被美国吸血、你一边挑战老大、一边在资敌，成功可能性很低。


    全球化，美国才是最大的受益者，但是这个获益主要被大财阀、金融集团、华尔街截留了，美国底层的人民反而因产业空心化，受损。


    美帝现在是谁的代表？底层蓝领亲手选上来的民粹派代表。


    底层人民想要脱钩，要制造业回流，懂帝无论能不能办到，得尝试向选民回应。


    而真的能彻底逆全球化么？达叔对此是不乐观的，美帝人民很可能会南柯一梦。


    而面对全球化，中国的态度更有意思：


    从1980s-1990s 中国人民极力反对、心不甘情不愿的缓缓打开国门。


    到加入世贸，全民喊狼来了，中国制造业要完蛋了。


    结果中国制造业没完蛋，把整个世界的制造业都快弄完蛋了。


    到现在全面拥抱全球化，有任何一个外资的工厂要走，都哭着喊着，不能走，不能让xx跑了。


    无论是对手，还是我们自己的理论界，都容易低估这个民族的战斗力和耐操性。只要深化改革，向改革要红利，进一步开放，向人民向往美好生活的欲望要红利，这个民族不会输的。


    就像我们打开国门的路径一样：


    不要嘛---好可怕---狼来啦---要玩了---赚钱了---再来点---别走嘛---坚决捍卫全球化，抵制开倒车。


    英美等老牌帝国主义：不玩了，不玩了，没钱了。


    美国主导的全球体系如果是一棵树，那么全球绝大部分国家都是在这棵树上的小动物。


    中国以前小的时候，也是这棵树上的动物之一。


    但是，你长的太大了，这棵树枝被你压死了，它不敢再玩了。


    是时候，重新构造新的全球化体系了。


    所以，达叔认为：逆的是美国主导的“狭义全球化”。


    而只有摆脱美国主导的单极体系，老二才可能真正战胜老大。


    广义全球化，不可逆，而且必定会构建中国发挥更大作用的更高效率的全球化。


    ![](img/d747a49dab77676cf44faebe24df049c_405_0.png)


    之前中国人民银行的国际化，国内的主流经济学家智囊们也分成两派，不断相互辩论，长读多年。


    中国目前应该已经确定了人民币国际化的道路，各种中国主导的国际性银行、基金，如雨后春笋般出现。

