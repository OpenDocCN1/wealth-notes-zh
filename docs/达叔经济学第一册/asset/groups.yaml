    # 第二十五篇 FC#24 制度是用来遵守的，还是用来挑战的？


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    今天被网友（沈亦周）拉去虹桥机场，得到大学的上海办，听了一场《亲密关系的四个飞轮》，他和他太太联合分享的。


    也是一对撒狗粮的夫妇，分享的内容也很有意思。


    为防止侵犯版权，俺就不剧透了。


    沈老师在分享过程中，每每尝试从最底层的逻辑，去拆解亲密关系，这个拆解的过程，引起了达叔的兴趣。


    比如，在传统亲密关系中，维系的一般就是爱和性，两个维度。


    但这两个维度，又存在着内在冲突和挑战。


    爱，这个玩意，看不见摸不着，科学家说是分泌多巴胺，产生的幻觉，幻觉让人快乐。


    保鲜期一般只有 18 个月，最多也就 2-3 年，然后多巴胺就不怎么分泌了。


    而性，这个玩意，大家都懂，男人本身就带着到处播撒基因的天性。


    于是，这两者之间，就冲突了。'
  - '[PAGE 216]


    那该如何化解这个冲突？于是就有了《亲密关系的四个飞轮》，据说是沈老师自创的，有兴趣的可以找他去学。


    结束，握手合影，下楼，取车，准备回家。


    刚好，有医学生来问达叔，她的职场该如何取舍，平时很多年轻医生，都有这个困惑。


    两个事儿撞到一起，就有意思了。


    达叔尝试梳理一下，可能不对，各位随便看看。


    1


    制度是用来遵守的，还是用来挑战的？


    前面开篇，达叔貌似是在分享亲密关系，爱情之类的，其实呢？


    是在讲人生伴侣，在讲婚姻。


    而婚姻这个玩意，沈老师说，200年前，都是血缘、财产制度的衍生品，是以财产制度作为基础的。


    近200年，在中国估计才几十年，婚姻是以爱情为基础的。


    爱情是一件奢侈品，不是每个人都能拥有，拥有之后也未必能够驾驭的。


    于是，非常不稳定。


    很多家庭，明明不幸福，爱情早就木有了，但还在继续苟且，归根到底，还是血缘和财产制度，在发挥余热。


    全国都知道上海的房子，是优质资产，但很多外地人，并不知道，外地人单身在上海，即使准备了一麻袋的钱，破限购也得满足结婚这一条。'
  - '[PAGE 217]


    # 图片


    你说这制度合理么？侵犯人权么？


    达叔不知道，也不敢问。


    但制度就是这么设计的，你说你是顺着规章制度往下玩呢？还是要去挑战一下？


    反正达叔好多年前，牛逼哄哄的，对居住证这个制度，轻视过，唾弃过，后来啪啪啪把脸都打肿了。


    很多制度，设计出来，就是让人服从的，不是让你挑战的。


    你服从，就给糖吃，不服从，就把你彻底打服。


    教育制度、户籍制度、积分制度、财产制度、婚姻制度，甚至包括各个城市的汽车牌照制度，都是如此。


    你反对？


    你怎么反对？你找谁反对？去办事窗口摔热水瓶么？


    有个毛线用。


    所有神仙没法管的东西，都有一个名字，叫做妖。


    你胡闹，就是作妖，没人搭理你，你就是把办事窗口炸了，制度还是制度。


    年底了，很多公司，要开始发奖金了，也要制定 2021年的奖金制度了，调皮捣蛋不跟着奖金制度走的，马上就要傻眼了。


    都是同一个道理。


    2 见识。'
