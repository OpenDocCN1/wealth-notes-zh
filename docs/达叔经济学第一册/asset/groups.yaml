    达婶说，难道是我？


    达叔说，不是，见到你的时候，我的见识已经涨了很多。我最感激的一个人，叫彪哥，是我的大学同学。


    因为他带我第一次做地铁，第一次使用银行ATM机，等等，无数个第一次，在城里人看来，都是最基本的见识，而我啥都没见过。


    那他是上海的么？


    不是。


    他是杭州的，他爸是杭州的公交车司机，但见识仍然比苏北农村的，要高出很多倍。


    再比如，后来，达叔的第一份工作，是搞高端会务的，天天和西门子、花旗银行、可口可乐、通用汽车等公司高层打交道。


    出入都是五星级酒店，接待都是成龙等明星，你说赚到啥大钱了么？


    穷的跟鬼一样，完全没有医疗行业赚钱。


    但是，彻底打开了见识。


    举个例子：


    人有三急，一般人都是找公共厕所，找肯德基，达叔首先的反应是，看看身边有没有五星级酒店。


    如果没有这段经历，俺是绝对不敢有这个想法的。


    我们平时遇到很多人，你从他们身上的气场，基本上能判断他的财力，除了演技突出的骗子，大多数是能看出来的，至少穷人还是富人，能判断出来。


    有些人，穿上龙袍，都不像太子。


    小姑娘提到一个细节，才是达叔想分享的主要原因，这个细节是北京户口和编制。


    如果是早十年，她来问达叔，那时候达叔肯定告诉她，这都哈哈玩意，一点都不重要，要自由，要翱翔。


    但最近这些年，要么是达叔被社会给爆锤了，要么是体内分泌变差，总之，从倾向上，变得越来越保守。


    每次看到知乎上，还有很多热血青年，刚留学回来，父母让混个上海户口，却嗤之以鼻，达叔就在心里大骂，这帮货读书读傻了。


    这玩意，你看不上的东西，在黑市上价值上百万，没了这玩意，不让你买房，不让你孩子上学，不让你用一大堆你未来想用的东西。


    这不是一个户口的问题，是对方一整套利益分配的抓手，是划分资源优先级的依据。


    为什么要划分？


    因为好东西，太少，不够分。


    但在不懂事的家伙看来，这是腐朽的，是落后的，是该被唾弃的，看不上的。


    这是幼稚病，没被社会爆锤过，有知识，却没见识。


    即使它是错的，只要它一天没改，你敢逆着来，都是要被揍的。


    比如，你很难想象，全面放开二胎的今天，达叔仍然能收到，独生子女光荣证，独生子女费申领登记，之类的短信。


    这种黑色幽默，让人哭笑不得，但这就是现实。


    ### 3. 选择


    达叔最近几年，一直在华东到处跑，出差到各个城市，除了工作，就是买当地的地图，研究山川形便，研究人口，研究产业，研究经济增长和财政体系。


    为什么？


    因为这些东西，比你出去喝酒打牌，好玩多了，无论是对你的投资，还是对你的谈资，都有巨大的利好。


    而且，研究地图，也是有讲究的。


    比如达叔上周从昆明飞回上海，起落的时候，从窗外外面看云南，你只要看一眼，就知道这个地方，经济肯定是困难的。


    你再买一个3D的立体地图，你就知道，为什么长三角会富裕，为什么四川在历史上经常可以独立。


    ![](img/d747a49dab77676cf44faebe24df049c_221_0.png)


    具体到个别城市，以南京为例。


    所有的城市规划，都是有山川形便，作为约束条件的，你把山、江、湖、铁道、机场、军区等标出来。


    ![](img/d747a49dab77676cf44faebe24df049c_222_0.png)


    南京，看着很大，但真正能拉开阵势、好好发展的土地，有的选么？


    就在红框里，这种选择，不会因为任何人来当领导，而发生变化，除非他脑子坏掉了。


    各位可以根据同样的逻辑，去推演自己感兴趣的城市，大概率是对的。


    城市选对了，板块选对了，大概率就不会错，有人在楼层、朝向上废了半天劲，结果城市和板块选错，都是跑偏的。


    不要只看热闹，要沉下心，去研究数字，去研究背后的东西。


    比如，南京和杭州，谁在新闻传播领域的名声响？互联网小编们都快把杭州吹上天了。


    但在过去10年，表现：


    - 2010年，杭州全国第8，南京第17；

    - 2020年，杭州全国第9，南京第10。


    房价你觉得是南京高，还是杭州高？有兴趣的，可以去查一下。


    就如同一个销售，努力很重要，赢赚更重要。在错的赛道上，废了半天劲，肯定是赚不到钱的，因为错的赛道，整个行业都在衰退。


    别人的细分领域每年增长20%多，你每年增长-3%，你再牛，赚个毛线钱。


    好的赛道，就像高能级的城市，增长迅猛，人口持续流入。


    只要还有新的土地，地方官员，就没有动力，去做旧城拆迁和改造，一座座新城崛起，成为新的权贵聚集地，这是必然的。


    部分旧城，产品价格开始分化巨大，未来会进一步衰落，这一点在无数个城市，都在上演。


    任何人的任何理论，都是有前提的，都是有约束条件的。


    比如有读者来问，是不是要去某城投资，达叔首先问的是，你的资金体量是多大？


    读者说，首付200万。


    达叔说，那你肯定就没必要跟着去了，因为那边的资产承不下。


    为什么？


    因为任何一套游戏，都是有边界作为约束的，比如房产投资，大家的资金约束，就是几十十万到千万级别的。


    过亿的那种，俺们普通人，只听过，没见过。


    一旦你低于这个级别，或者高于这级别，这个游戏，都很难玩。


    低于的，很好理解，因为穷，除非激进的操作，否则根本上不了车。


    但资金体量几个亿，几十个亿，甚至更多，这个游戏，你仍然玩不了。


    达叔和很多朋友，都分享过，不要觉得赚钱难，给你十个亿，让你花掉，去投资，更特么的难。


    债券、股权、信托、外汇、土地等等，就变成了你不得不去玩的游戏了，即使你本人玩不了，也得交给专业人士帮你玩。


    因为，其他任何游戏，都承不下了，你没的选。


    ## 第二十六篇 FC#25 这一次，他们选择让烧开的水壶别出声


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    最近一口气，写了很多医疗系列的文章，房圈的读者不开心了，给达叔发信息，你咋不写楼市了？


    像这样的读者，就是看热闹，不嫌事儿大。


    帝都和魔都，两个地方的房产大V，短期內都收到黄牌警告了，你们还掉操达叔这样一个医疗账号，去写楼市，真是良心大大滴坏了。


    达叔写楼市，只是出于好心，唤醒一部分医生、医疗朋友，好好利用自带金融属性的身份，好好投资，然后慢慢变富。


    目的，就是这么简单而已。


    无意参与任何多空对决，理论争论，更没空搞数据分析。


    因为看懂大逻辑的人，不用分析了，一切都只是在打明牌，你选择赢面最大的那一方，就够了。


    达叔唯一看不懂的，就是部分人，患上了严重的精神分裂。


    一方面觉得自己祖国牛逼坏了，肯定未来是世界第一；另一方面，却又完全接受不了，作为世界第一强国，就要汇集世界最顶尖的人才，就得承受世界最贵的不动产价格。


    强盛，是有代价的。


    不能连这个，都不让讨论。


    ### 1. 夜壶和水壶


    以前地产行业，有个夜壶论，这个理论是说房地产行业是地方政府的夜壶。


    地方政府憋不住了，拿出来用一下，用完又嫌这玩意脏，一脚踢到床底下，藏起来，羞于见人，嘴里还骂骂咧咧的。


    正经人谁写日记啊，在这里，说的是，正经人谁用夜壶啊。


    但是，年龄到了，就是得夜里起来，憋不住，经济也和生物体一样，是一个有机体，有自己的周期和生老病死。


    憋的久了，就得起床，否则要么把自己憋死，要么得尿床上，两个成本都不划算。


    每一次，睡觉的时候，都告诉自己，今晚的我和以前不一样，结果，每晚都一样。


    不一样的是，这次你是憋到了夜里两点，还是夜里四点，反正你是憋不到天亮。


    因为，这就是生理期啊，你和周期较个什么劲，该用就用嘛，不丢人。


    经常尿床的人，凌晨两点爬起来，发了个朋友圈，炫耀一下：


    > 大家快来看，俺这次没尿床，今晚真的和以前不一样。


    朋友，请把手机放下，躺好，能撑到天亮，才是真的牛逼，先别喝粥。


    当然，除非你准备在床上干点别的，比如要搞点芯片啥的，要弄点高科技，一时半会不方便起床。


    别忘了，憋的太久，会把膀胱憋坏的，达叔是做过泌尿科生意的，对这块多些懂一些。


    但是，人一旦要是犟起来，不吃点亏，是不会乖乖收手的。


    这样人定胜天的口号，我们过去70年，喊过好几次，每次被经济规律暴揍一顿，也就老实了。


    知错、改错，不认错，套路是一致的。


    达叔今天要聊的，不是夜壶理论，要聊点水壶。


    达叔小时候，生活在农村，自己在煤球炉上烧开水，用个大水壶，一烧开，冒白烟，呼呼响。


    这个时候，不让这个水壶叫，有2个办法：


    - 1. 把水壶赶紧拎下来，不烧了。

    - 2. 把炉子里的火给灭了，也是不烧了。


    从来没见过，炉子里的火很旺，是憋了好几年的，新上的灵长类碳水化合物，还从天上撒下来一堆又一堆的纸币，作为引燃物。


    你舍不得把水壶拎下来，现在却对着水壶，呼哧吹口哨的聋嘴喊，我命令你，不允许再吹口哨了，否则惊醒了一屋子睡觉、打游戏的人。


    不知道，有没有小朋友，闲得蛋疼，尝试着去拿个东西，把水壶的口给堵上。


    达叔小时候，干过，很危险。水壶盖子都掀翻了，水壶恨不得在火炉上跳了起来。瓦特研究水壶，发明了蒸汽机，达叔研究水壶，差点就毁容了。


    而真正懂沸点、烧水原理的人，早就知道了，只要水壶没拎下来，过一段时间，水都会烧开。


    这个水壶即使不叫，也会冒白烟，以另外一种形式提醒专业的玩家，水要开了，赶紧动手吧。


    所以，那些网络写手，就是水壶的嘴，水要是不开，他们口哨吹的再响，也没用。


    但当水要开了，水壶的嘴，却被要求不允许吹口哨时，你不要欢呼，不要觉得大快人心，只要这个纸马还在往炉子里不停的添，水还是要开的。


    只是有的人，早就知道了，在远处等着了，而你不知道，哨儿一下被烫伤，而已。


    楼市和渣男是一样的，吹过一次牛逼，做过一次违约的承诺，出过一次轨，是很难收心的。


    除非年纪到了，真的玩不动，才会收心的。


    你要研究的是生理周期、内分泌和结构，渣男的躁动，只能疏，不能堵。


    他要出前门，你应该把他榨干，再放出去。你该干的不干，却把他堵在门口做道德教育，说你给我保证，这次出门，不干坏事，这是傻逼。


    保证个屁。


    ### 2. 经济学人


    达叔看了一下最近一期的《经济学人》，中国目前对房地产市场的调控，引起了全球的关注。主题是《China’s property market, The Great
    Escape》，站在外国人的视角，梳理了一圈中国的调控政策。


    最近这些年，外媒面对中国经济、多少学了一点谦卑。为什么？


    因为按照他们的理论架构、中国经济已经崩过好几轮了。


    可惜，并没有。


    尤其是房地产市场，2008-2009年，那一拨玉石为主观点论，外媒体普遍认为，这是要崩，事实如何，各位都看到了。


    不是脸都打肿了，是头都打掉了。


    中国目前，有头有脸的商业大佬，所有人的话，都不太可信了，尤其是站在台上，抛头露脸大众传播的。


    这是典型的语言腐败，张继莲在《理念的力量》里，尝试论述过，语言的腐败，是极其可怕的。

    '
