    # 1


    研究成果。'
  - '[PAGE 235]


    比如你读这个商业杂志，看很多富豪排行榜，不能只看热闹，要善于总结规律。


    那个年代，出来的富豪，一大堆在地产行业、能源行业、金融行业。


    那时候，互联网才刚刚起步，还看不到首富的影子，互联网是对我们这代年轻人来说，是一个黑天鹅。


    这种事，不是每一代人，都有机会遇上的。


    但地产、能源、金融对于普通人来说，一直是致富的行业。


    除了研究行业，还要研究富豪的产地，瞄一眼，很多都在北上江浙粤。


    财富所在的行业和产地，你要仔细想，这是因，还是果？


    哪怕就是那边风水好，你是不是也该往风水好的地方，挪一挪呢？


    小地方的老师、班主任眼界很窄，为了毕业率等指标，恨不得学生随便报个专业，赶紧走，根本就不在乎你的前程。


    当时南京头部高校来我班招生，说你来我们这，专业随便选，班主任开心坏了，说了几个他认为牛逼的专业，怂恿俺去。


    达叔头都不抬，心里默念，你懂个啥，俺要一步到位，去上海。'
  - '[PAGE 236]


    所以，达叔强烈建议，高中生要多看一些商业杂志，尤其是《财富》排行榜之类的。


    除了看商业杂志，还要看一类书，那就是要多看小说，政商类的小说，官场类的。


    达叔对当官、做公务员，一点都没兴趣，俺生性自由，吊儿郎当的，但是为啥要看这个类型的小说？


    因为小说，展开了讲，就是“小声的说”。


    一般在讲台上拿喇叭喊的，大声说的，都不可信，小声说的，很多都是真话，都是真相。


    你看这类的小说，你会知道地方政府官员在想什么，在和什么样的人打交道，他们被谁管，受谁的约束，他们的考核机制是怎样，相互之间怎么配合。


    还能看到，为什么所有的城市主政者，都喜欢建新城，不喜欢搞旧城改造。


    项目是怎么招标的，怎么围标的，怎么写标书的，怎么打点的，怎么收尾的。


    你多看几本，问问自己，这些书里的人物命运，有哪些共性？事物发展有哪些共性？财富流淌的方向，有哪些共性？


    是所有的作者，都是一个老师教的，还是不同地区的人，都是这么生活的？


    你想通了，就能治好一身的文艺病，不再像个傻逼一样，站在宇宙中心呼唤爱，更不会天天去和别人探讨政治和道德。'
  - '[PAGE 237]


    具体的执行层面，达叔列一个研究路径，包括三个方面：


    +   1、这个领域最顶尖的人，怎么看，怎么想，怎么说。

    2、这个领域的教材、小说，怎么写，怎么论述的，基本原理是什么。


    3、这个领域里，最调皮、最简洁、最傻瓜的版本，是怎么说的。


    举地产投资行业为例：


    +   1 类，是欧神、德科、任等，达叔很早之前，写过文章尝试总结，FC*5 大神们的争吵，我们该相信谁？。


    +   2 类，达叔毕业的学校，有专门的房地产专业，有很多的教材，各位自寻。


    +   3 类，就是财上海，王马丁之类的，无比调皮的。


    除了这个研究框架，有别的方法么？


    还有一个小技巧，那就是你去研究说话的人。


    一种是说话四平八稳的，官话套话连篇，身居高位的，这种一般说话，都不太可信。


    另一种是生性狗介，魏晋逸风，甚至有自毁倾向的，这种人说的话，无论你听起来，有多不舒服，有多刺耳。


    一定要耐着性子听完，这帮家伙，大概率说的是真话，是在帮你的。


    你今天不听，明天这帮家伙简就被撕电了，想听都没的听。'
