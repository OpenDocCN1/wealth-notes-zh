    # **第七篇 #CF7 如何看待北大毕业当房产中介？**


    很多人都知道达叔开了两个号，名字一样的，一个在知乎，一个在这里。


    今天知乎的热门榜上有一个题目，引起了达叔的兴趣。为了写这个题目，达叔还专门研究了如何 P 图。


