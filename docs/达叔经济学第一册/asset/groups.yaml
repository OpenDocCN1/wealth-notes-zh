    这种事，在所有二三三四五线城市，都发生过，未来也会继续发生。


    在艰难时刻，最想降价的，是开发商，背负高周转、高利息、高负债压力，浑身上下被扔了臭鸡蛋，却被抱着不能降价，不能走。


    这个锅，你不背，就是不讲政治。


    领导有领导的大事，这个锅，就是领导安排给你的大事，不要乱动，小心掉地上。


    摔碎了，大家都没饭吃。


