    限字当头，但是，限与限，性质是不一样的，执行的力度和长短，也不一样。


    按照正常人，朴素的价值观，啥东西会限？


    1、好东西；

    2、需求大；

    3、数量不够。


    上一次这么玩的时候，是粮票、布票、肉票等票据时代，结果现在玩出一个词汇，叫房票。


    懂经济的都知道，任何一种票据，但凡有价值，都会衍生出金融属性，有人收，有人买卖，有人做这块生意。


