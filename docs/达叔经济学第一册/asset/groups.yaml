    ## 第三十二篇 FC#31 限你一万年


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    如果不出差的话，都是达叔早上七点爬起来，送孩子去上学，俺很珍惜每天相处的这点时间。


    最近女儿，特别喜欢让达叔问问题考她，她看了一点西游记，就一直让俺出题。


    达叔就问，孙悟空为啥被压在五指山下了？


    女儿说，是因为调皮，不读书，天天打架。


    达叔问，后来被谁救出来了？


    女儿说，被唐僧。


    达叔问，救出来，干嘛去了，是不是去读书了？还去很远的地方去上学。


    女儿点点头说，是的，但是爸爸，上学读书之后，就不用被欺负，不用被山压着什么？


    达叔一下子就犹豫了，觉得这是个好问题，遇到一个事儿，能问然后呢？再然后呢？


    顺着逻辑，一路推演下去，这个小家伙，以后长大应该不是个笨蛋。


    但是，有很多人，几十岁了，考虑所有的问题，能想到的，最多只有一步，简单粗暴，鼠目寸光，一辈子都没学会多问几句，然后呢？


    比如，达叔今天忙完，回家之后，本来想探讨一下医疗话题的，结果吃饭的时候，看了一眼手机，被一些人的愚蠢，震惊了。


    在故事会里的乌有国，某个城市，今天新出了一个限售的政策，如果一定要给这个限售加一个期限，这个城市的主政官，一咬牙说，那就 5 年。


    结果，有很多人，是不买账的，觉得要十年，要一万年，买了就不许卖。


    ![](img/d747a49dab77676cf44faebe24df049c_276_0.png)


    达叔就顺着问一句，限一万年，然后呢？


    以下内容，是俺瞎想的，不一定对，随便看看。


    ### 1. 微循环


    今天早上，送完孩子去上学，达叔一路往公司飞奔，去听一个培训。


    可不可以不参加？


    当然可以。


    但是，屁颠屁颠跑去听课，有几点考虑：


    - 1、今年额外接了新兴市场，民营医院，要多卖一些产品，不能总卖原来的老三样。

    - 2、要卖好任何一个东西，都要深刻的理解这个东西，得弄明白，你卖的到底是个啥东西，说的通俗点，就是得专业。

    - 3、成年人的记忆曲线，一路下滑，容易遗忘，刚学完就忘了，得不断学，不断练，才能记住一点点。


    年纪大了，自己要有这个觉悟，勤能补拙，对新知识要多学几次。


    当然，以上的三点，不是最重要的，最重要的是，讲产品的姑娘，是很聪慧的，这个家伙是少见的，能把复杂产品简单化、讲清楚的人。


    她讲了很多，达叔晚上回来，能记住的已经不太多了，但是有一个观点，极其深刻。


    她说，人体，是一个很奇妙、很聪慧的组织。血管分为大动脉和小动脉，呼吸还分为大循环和微循环。


    大概的图，就是这样的。


    ![](img/d747a49dab77676cf44faebe24df049c_277_0.png)


    当一个人，身体是健康的时候，末梢循环里的氧气，和大动脉里氧气是差不多的。


    但是，当这个人，一旦生病，进入休克状态，人体组织非常聪明，立马会在主动脉和毛细血管连接处，关上闸门。


    氧气坐着红细胞的小火车，只在主干道上行驶，只供应主要器官，远端的神经末梢，氧气几乎全断了。


    几万年的生命进化，活下来的，都是一个套路，保大、保大、保大弃小。


    这还不是最有意思的，姑娘说，一个休克的患者，慢慢恢复，走向健康的路上，所有的指标，都在变得正常，而微循环里的数值，是最晚变正常的。


    也就是说，微循环这块，在生命体征遇到危险的时候，被最先放弃、被最先停止供应氧分。


    但是，等身体在慢慢变好的时候，其他地方都慢慢恢复供应了，微循环这个地方，最晚恢复。


    简单点说，就是达叔之前讲过的，利益总是自上而下分配，风险总是从下往上承担。


    在生活中的案例，达叔在 SK#129 逃不开的周期和趋势，有人假装不存在，文中探讨过。


