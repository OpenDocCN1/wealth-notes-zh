    ## 第二十三篇 FC#22 以《资本论》架构、土地视角，分析一下欧洲和中国


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    今天，是南京大屠杀的纪念日，满朋友圈都在纪念这一个特别的日子。


    昨晚写的 FC#21 这一次的屠杀静悄悄，被屠刀屠杀的生命值得纪念，被纸币屠杀的生命，也应该值得纪念。


    但是，很多人意识不到，这种静悄悄的屠杀，是在剥夺生命权。


    为什么意识不到？


    因为时间跨度太长，逻辑链太长，看不清、看不懂，就当做成不存在了。


    所有人，在年轻时所做的劳动，如何把这些劳动成果储存下来，保值、增值，在晚年，丧失劳动的时候，进行变现，支付医疗。


    这一个过程，就是生命权。


    别人生病，有钱治疗，能多活几十年。


    你一生的劳动剩余没有完成积累，没钱，挂掉，这一切，就是被剥夺了本该属于你的生命权。


    当然，第一步先被剥夺的，是很多人父母的生命权。达叔最近两个月，父亲脑出血，最大的感慨就是，如果达叔没钱，他就挂了。


    他能重新张嘴说话，很大一部分是人民币的功劳。


    昨晚达叔说文章阅读过 4000，写一写《资本论》哲学角度，分析土地视角下的欧洲和中国。


    现在，兑现一下承诺。


    下面内容，可能不对，各位随便看看。


    土地，财富之母，全世界都是如此。


    很多人，书没读过几本，却对土地，以对土地为依托的房地产业，产生强烈的厌恶和鄙视。


    达叔不知道，到底是飘柔，还是沙宣，给他们的自信。狂妄且无知。


    翻开全球所有历史书，所有财政改革，千百年来，绝大部分都是围绕土地。


    一次次革命、暴动、起义，千百万人流血牺牲，来来回回的口号，无非就这几个：


    - “耕者有其田”

    - “均田免粮”

    - “打地主分田地”


    纳粹杀进莫斯科和电影投名状，口号都是“抢钱、抢地、抢女人。”


    能让人愿意拿人头去换的东西，肯定是好东西，其他说大天来，都是骗子。


    下面，让我们来打开《资本论》，研究一下土地。


    达叔说过，从经济学的角度，马克思不是一个靠谱的经济学家，但人家马克思也不认为自己是一个严肃的经济学家。


    正如《资本论》，有一个副标题《政治经济学批判》，所以人家研究的不仅仅是经济学范畴，人家研究的是哲学批判范畴。


    马克思提出了一个理论：


    在资本主义诞生之前，社会运转的公式是 W--G--W。


    其中，W 是物品，G 是货币。


    > 废了半天劲，货币只是媒介，人们最终还是追求物品。


    而资本主义诞生之后，标志性事件，是社会运转逻辑的变化，从 W--G--W，变成 G--W--G’。


    从货币出发，组织生产，卖掉赚钱，回归货币，货币变成了财富的主体。


    这个公式的变化，马克思称之为，令上帝都感到惊奇。


    讲理论，不是达叔的风格，达叔来讲点故事。


    ### **中国旧社会：**


    由于土地可以买卖，贵族早年被消灭，继承较少，货币长期可以购买土地。


    加上，有科举制的社会上下流动阶梯存在，状元及第、范进中举，都可以获得权力和土地。


    于是，中国数千年来，所有人的梦想，就是成为地主，W 土地--G 货币--W 土地。


    ### 为什么？


    因为土地本身就是财富，就是财富之母，就能够获得货币的增殖。


    注意，达叔用的这个词汇“增殖”，是货币增长、繁殖。


    这是打开《资本论》扉页，达叔看到的，第一个令达叔震惊的词汇，很生动，形象。


    哪怕，历史课本上说中国明末清初，产生了资本主义萌芽，如果不被拔，肯定能自己发展出资本主义。


    达叔读完《资本论》，对这一结论，是极其悲观的。


    为什么悲观？请看下方分析。


    我们来看一下欧洲，是怎么被出资本主义的，根源还是土地制度。


    欧洲长期生活在封建时代，封建封建，分封、建国，土地这玩意都是王室分给贵族的，而且还是世袭。


    平民即使做生意，侥幸赚了钱，那也是暴发户，没有资格购买土地的，因为你们不配。


    W—G—W，这条用货币购买土地实现货币增殖的道路，在欧洲根本走不通。


    那怎么办？


    逐利，实现资本增殖，是所有人的梦想，此路不通，就开启了旁路建设。


    欧洲拼命追求资产增殖，G—W—G’，其中一顿忙活下来，必须实现 G’ > G。


    欧洲商人，拿钱去中国买奢侈品，转手高价卖给贵族，赚取利润。


    土地，是不动产；货币，是动产。


    资产阶级崛起的过程，是动产战胜不动产，是商人打败贵族，实现占有土地的过程，是土地服从资本的过程。如果你看懂了这一点，就知道，欧洲的商人梦寐以求的，就是占领土地，获取永恒的财富，求之不得，退而求其次，追求货币增殖。


    除去土地，追求财富都是冒险的、追求效率的，要创新的，要组织社会劳动的。


    这样，才有了后来的资本主义。


    如果你接受了这一个逻辑，那么中国有钱就能买地，就不可能有技术创新，不可能无限追求效率，不可能天天冒险。


    所以，中国即使明朝末年有萌芽，也不会发展出高效率的资本主义。


    因为目的和公式，都不对。


    举例：


    在欧洲，为了提高效率，行会手工业转向工厂手工业，这一过程中，在哲学的逻辑上，大机器生产就已经诞生了。但在事实上，还没有发生。


    还在等一个人，这个人叫瓦特，发明了蒸汽机，被应用在工业生产上，提高效率。


    如果没有这个资本主义生产关系，没有对技术、效率提升、资本增殖的内在线求，即使蒸汽机被瓦特发明了，也不会被应用于工厂生产。


    只会被运到贵族的城堡里，变成王公贵族们的新玩具。康熙、乾隆们，对西洋玩意，就是这个态度，知道的一点都不晚，都当做奇怪技巧。


    不是骂清朝皇帝，而是由于土地制度的存在，财富有了依托，发财有了目的。


    四大发明的火药，应用于烟花爆竹；指南针被应用于风水。


    在欧洲火药被应用于提高开矿效率，提高杀人效率；指南针被应用于航海等等。


    所有技术和发明，你这边不是不会做，而是做出来，都拿去玩了。


    人家看到啥，都想着该怎么用来赚钱。


    > 这特权就是人和人之间的差距，时间久了，活该你被人奴揍。


    这特权之前在文章里写，评价一个人，不看他多有钱，不看他的地位如何，就看他把时间花在哪里，就是这么个意思。


    要动态，放在时间的维度里去看。


    中国奢侈品助力欧洲资本主义诞生。


    现在去欧洲旅游、翻看欧洲贵族画册，能看到点啥？


    欧洲皇宫贵族身上穿着中国的丝绸，桌子上、墙上挂着中国的瓷器，各种锅碗瓢盆，拉过去就是顶级奢侈品。


    要是开个中国茶盘、茶壶，再泡点中国茶叶，那能喝 198 大半年，邀请一大堆亲戚朋友来家开 party，好好喝 198。论玩奢侈品，中国是鼻祖。


    现在倒过来的两百年，只是一个例外，很快还得再反过来，达叔说了，你们爱信不信。


    那么为什么中国奢侈品，能助力欧洲资本主义崛起？


    因为贵族们，想买奢侈品，想喝 198，想享受生活，但是中国太遥远，奢侈品太少，太贵，买不到。


    于是，一群冒险家出现了，也就是欧洲那批商人，说难听点，就是一群做代购的。


    你们想买啥？青花瓷，丝绸，茶叶，香料啥的，和俺说，俺带一帮兄弟去帮你买。


    为了做代购，又是和中东阿拉伯打架，打不过，就驾船出海找商路，坚持做代购，去赚钱。


    逻辑链出来了：


    土地----贵族世家----贵族买东方奢侈品----要花大钱-----花钱变穷----穷还要装逼-----驱做仆人，出卖贵族头衔、出租土地、变卖土地。


    货币----G-W-G’商人要赚钱----做代购-----熟悉市场，知道客户要啥-----对手工业提出生产要求-----不被满足-----雇佣被解散的仆人----租或买的土地-----自己组织生产。


    劳动力----本来都是仆人、贵族庄园里的奴奴----贵族要买奢侈品----变穷----解放仆人、奴奴----进入城市----成为自由劳动者----被雇佣----成为无产阶级。


    到此，资产阶级联合无产阶级，发动大生产，实现货币不断增殖，向贵族不断挑战。


    王权，面对新崛起的资产阶级，又惊又喜。


    为什么？


    因为王权的敌人，一直都是贵族，绝大部分时间，还是围绕土地。


    贵族利用自己的封地，动不动就挑战王权，发动政变，争斗千年不止。


    现在有一群有钱人，又纳税，又帮忙代购，又去打击贵族，把贵族弄穷，购买贵族土地，王权开心的不得了，纷纷颁发特许经营。


    代购小伙子们，好好干，你们好样的，给你们弄个东印度公司。


    为什么要弄东印度公司？干的事，出了欧洲。


    还是那个原因，资本的生命就是增殖，不断增殖。


    它诞生于欧洲，但必须突破欧洲的疆域，冲向世界，向全世界要增殖，这是一个全新的怪兽。


    日本一旦学会，走向了青涩的资本主义，为寻求资本增殖，必要进入大陆市场，中国一旦反对，还想保护一下民族资本，日本就要打中国。


    无论你是满清，还是民国，这是必然的，服从资本增殖的内在逻辑。


    何况，你还那么弱，小身板一单薄，那就是找揍的。


    然后，就有了今天的南京大屠杀纪念日。


    这世界，永远是这样，资产阶级要打败贵族，不仅要资产阶级强，还要贵族堕落。


