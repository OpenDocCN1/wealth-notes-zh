    # 第十七篇 FC#16 不懂就是不懂，即使他职位再高，说的也是错的


    # 2011-2019年中国出生人口及出生率情况


    ![](img/d747a49dab77676cf44faebe24df049c_130_0.png)


    尤其是2018年，全国出生人口的暴跌，引发轰动。


    于是，逻辑链条推到下一步，另一个长期国策发生变化——户籍政策松动。


    之前一直被弃之不用，在人口方面被边缘化的经济学家，把理论模型拿出来，推导未来中国的出生人口，大概是这样的图，开始有人相信了。


    ![](img/d747a49dab77676cf44faebe24df049c_130_1.png)


    请各位，闭上眼睛，如果你是执政者，你的应对策略是什么？


    增人口没指望了，只能对存量人口进行有效配置——全面放开户籍限制。


    在农业社会，人口既是生产者也是能量的消费者，周而复始，发生瘟疫、战争等手段，不停上演周期律。


    进入工业社会之后，伴随科技和经济的发展，人口作为生产者和经济的消费者，比重越来越重。


    在现代社会，所有执政者都意识到，人口不再是负担，而是经济增长的发动机，是力量的源泉。


    所有发达经济体，都在绞尽脑汁，刺激人口增长，鼓励生育。但是，错过了，就是错过了。


    到目前为止，没有一个发达经济体，在人口刺激上，取得很好的成果。


    当新增人口指望不上之后，如何将存量人口进行有效配置，放到经济效率更高的地方，就是中国未来经济发展的重中之重。


    2018年，全国出生人口的数据啪啪打脸之后，2019年上半年开始，从上到下，迅速反应——全面放开户籍限制。


    ![](img/d747a49dab77676cf44faebe24df049c_131_0.png)


    ![](img/d747a49dab77676cf44faebe24df049c_131_1.png)


    看到中央全面放开户籍限制之后，最考验的是地方政府执政班子的领悟能力和反应能力。


    发令枪一响，能看懂的，立马就把抢人变成地方政府的第一要务。


    就如同，年初公司公布完奖金政策之后，各个地区销售的反应能力一样，有的快一些，有的慢一些，一晃一年就过去了。


    现在我们来看一下 2019 年的成绩单。


    ![](img/d747a49dab77676cf44faebe24df049c_132_0.png)


    从全国来看，人口净流入排名前十的城市，南中国占 8 个，北中国只有 2 个。


    北中国的两个，一个是背靠亿级人口的河南单核城市郑州，一个是抢人大战中手段最硬朗的西安。


    简单图表的背后是百万、千万个活生生的人，用脚投出的票，代价是自己一生的日子在哪里度过。


    中国经济的未来，在中国南部。8比2的数据，看似悬殊，达叔举一个切身的例子，达叔所在的公司也分为南中国和北中国两块业务，生意比例是7：3，同样悬殊。


    我们研究一个数据，尽量拉长时间，拿动态的数据来进行比较，能解读出的信息会更多。


    # 图表：33个都市圈近年人口年均净流入情况


    ![](img/d747a49dab77676cf44faebe24df049c_133_0.png)


    资料来源：各地统计局，恒大研究院


    长三角，珠三角，民营经济最发达的两块区域，尤其是广东和浙江，在包括人口引进在内的所有政策应对上，长达20年就没来退缩过，如果不岀意外，未来也大概率不会输。


    为什么要拍抢人为地方政府的第二要务？要从目前地方政府的经济和财政逻辑来看。


    - 1、受央地分税制影响，目前绝大部分地方政府财政大头靠土地财政，也就是卖地。

    - 2、抢人也是有门槛的，刚开始，各家还要点面子，说本科及以上学历才能落户口。


    各位网友经常会笑，本科就能落户口，觉得门槛好低。


    根本不知道在中国，即使经过那么多年的招扩，本科及以上学历在总人口中占比，只有4%，这个数字，超出了很多人的想象。


    身边即世界，会害死人的。


    中国太复杂，太过阔。


    绝大部分地方政府，很快发现，装逼装大了，本科生根本就不够用，于是迅速做出调整，大专生也可以，中专生也可以。


    因为，只要这个孩子来了，这个家庭的6个钱包，基本都来了。买房、装修、家电、教育、纳税，数百万支出，都有了。


    这抢的是人么？


    这抢的明明是钱。


    而钱会继续生钱，有的城市进入良性循环，城市更好、人口更多，人口更多，城市更美好。


    有的陷入万劫不复的人口流失，进入恶性循环。


    当好多年之后，人们在分析某城衰落时，原因可能有很多，人口流失既是因，又是果。


    而这一切，是可以从 2014 年的一场电影推导出来的。


    最后，来聊一下上海。


    达叔生活在上海，好多年前就来了。达叔之前在文章中


    举过即使是上海这样顶级城市，为了卖房子，也发放蓝印户口的案例。


    ![](img/d747a49dab77676cf44faebe24df049c_135_0.png)


    这个手段，从 1994 年起开始使用，到 2002 年开始废


    弃，总共用了 8 年。


    经常看达叔文章的都知道，达叔经常使用的一个分析


    框架，目的和手段。


    户籍政策是手段，经济发展是目的。只要目的达不 到，


    曾经用过的手段，就可以拿出来再用一次。


    和深圳相比，上海的户籍制度极其不友好。深圳、杭州


    人口流入极其强劲，达叔身边认识的一批很优秀的小伙伴，


    有的落户深圳，有的落户杭州。


    每年收入大几十万，近百万，纳的税能够养好多拿退


    休金的上海老太太，还得排队等户口，是什么玩意儿。


    不和上海玩了。


    在这一轮的城市人口战中，上海因为傲慢，正在付出代价。


    今天的上海落户政策新政，在一定程度上，是上海对自身人口结构的修正，所有的政策都是表象，所有的表象都是由内部经济结构催生的。


    达叔是什么时候开始觉得上海的户籍政策，可能会有一丝松动的？


    2016年，除了开放二胎政策之外，还有一个细节。


    上海交通大学有一个教授，叫陆铭，在这一年出了一本书——《大国大城》。


    这本书从底层逻辑上，驳斥了限制城市人口规模、人口负担等理论，提出要尊重经济原理，让城市自发成长，中国目前的城市不是太大，而是太小了。


    ![](img/d747a49dab77676cf44faebe24df049c_136_0.png)


    没出过书的人，根本不知道，在中国哪些内容可以出书，哪些内容不能出书，有多么严格的限制。


    某出版社的编辑主动找到达叔让我出书，达叔把大纲和草稿交上去之后，审了几天，说写的太路货了，尤其是房地产这块，要删改，否则出不了。


    中国在很长一段时间内，都在极力限制大城市的发展，严格的户籍制度，限制人口流动，即使是牺牲效率，有损公民权，也在所不惜。


    但，这本书的顺利出版，从一个侧面反映，学术内的讨论，正在出圈，去获得更多的广泛认同，凝聚共识。


    这是在为放开户籍政策和放开城市发展，凝聚更多共识。


    达叔再说一遍，中国的所有改革政策，都是渐进的，可控的，边走边观察。


    但很多事情，都能从逻辑上推导出最终的结果，聪明的人，会在终点进行资产布局，等待结果的到来。


    于是，现在开始逐步出现粤港澳大湾区，长三角一体化，户籍全面放开，上海户籍松动等等，所有的实践背后都有理论基础，很多时候，理论是早于实践的。


    即使跑偏了，最后还是要回来。


    如果你也想一叶知秋，达叔推荐你买一本陆铭教授的《大国大城》看看，达叔放了个链接，是京东的，这个时间点，全网最低价。


    达叔几年前，时间自由，工作之余，在上海某学校教了两年《经济学原理》。


    面对一群群懵懂的少年，每次在第一节课，和最后结业，达叔都会提醒一句，你们所听的，可能都是错的。


    你们还很年轻，不要轻易迷信任何人、即使他是你的老师，他是你的领导。


    经济学，是一个非常年轻，内部学派相互打架的学科。未来步入社会，面对的社会学，亦是如此。


    正确的，未必有用；有用的，未必正确。


    人，要对自己负责。


    M 总，是达叔接触过最有能量的领导者，极具领袖气质。


    在 500 强公司，先后两家都待了十几年，前一个做到了中国区总监，后一个担任中国区总经理，年收数百万。


    但长期以来，一直坚定的认为中国房产存在泡沫。


    在言论上鼓吹中国房产泡沫的人、分为三种：


    第一种是买不起的，因为自身所处的阶层，看不懂为什么会有人去买那么贵的房子。这种属于陷入身边即是世界的陷阱里，没有睁开眼，看世界。


    第二种是揣着明白装糊涂，知道 D S 们喜欢听什么，有需求，就有供给，发表所有的观点，都是冲着收割流量去的。


    比如当年的牛刀，就属于最坏的代表。一边让大家再等等，一边自己出书宣讲镰刀，早早上车了。


    留下所有相信他的人，在风中凌乱，人生彻底废了，听君一席话，白读了十年书。


    第三种就是 M 总和谢国忠这种，在各自领域，都是精英。


    一个是 500 强公司中国区总经理，一个是前摩根士丹利董事总经理和亚太区首席经济学家。


    而且这种人，发表的观点，都是很真诚的，他不仅喜欢说，也真的信，但是很可能，最后还是错了。


    2019 年，夏，达叔和 M 总出差武汉。


    M 总知道达叔是坚定的多军，我们两个拜访完客户，在楼下聊天，就聊到房价问题。


    达叔问，听说老板你前几年把上海的房产抛售了，是真的么？


    M 总说，是真的，当时觉得严重泡沫，就赶紧卖了，现在上海目前只有一套了。


    达叔问，后悔么？


    M 总说，后悔倒是谈不上，毕竟是自己认知不够。直到现在我仍然认为房价是泡沫，但最近才想清楚，如果我这辈子看不到破裂的那一天，又有什么关系呢？


    达叔说，老板是低估了操盘手的实力，相信了正确却无用的理论。中国决策者对所有外来的理论，都是持有实用主义态度的，没有被任何主义绑架，包括马列。


    合适就用，不合适就改，再不合适，就再也不提了。


    有一个口号，很多人理解不深，稳定压倒一切。


    但凡有损稳定的，都是要被控制的，房价就是其中一个。


    很多人分析问题，都喜欢从简单的经济学角度来看。但凡从租售比，房价收入比等技术细节来思考问题的，都陷入了战术细节的泥潭里，爬都爬不出来。


    为什么？


    因为样本选错了。


    租售比，房价收入比等这些研究的技术，都是建立在发达经济体，比较稳定的社会结构上来研究的。


    收入稳定，房价稳定，用稳定的指标，研究稳定的社会，还多少有点价值。即使有价值，也丝毫不能萌发达经济体的头部城市不动产持续上涨。


    中国稳定么？


    从时间角度，两千年来阶级流动速度最快、宽度最广的时期。以前的出路只有当官，现在士农工商，商字当头，一切向钱看，对普通人来说，最幸运的时代。


    从空间来看，全球最有活力的市场，配上新大的技术革命加持，各个行业都不停涌现出看不懂的有钱人。


    有钱人，怎么样才能证明自己有錢了？


    土地是共有的，兼并不了，房产就变成了千百年爱好的变种。


    人，从家里，到公司，到餐厅，到酒店，到商场，到电影院，甚至坐飞机、汽车，本质是什么？


    本质是人在不同空间里移动，一辈子，都是从一个空间到另外一个空间。


    对空间舒适度的追求，造就了阶级，造就了豪宅、豪车、高端酒店、商场，这才是财富的载体和最终归宿。


    否则，大家这辈子，在忙活什么呢？


    话说回来，谈稳定压倒一切。


    有人已经从金融的角度分析过，一个房子，个人首付三成，银行贷款七成。就注定了这个资产下跌幅度，极其有限。


    否则，就会引发系统性金融风险。美国次贷危机，历历在目，中国决策者不傻。


    如果从金融系统风险的角度理解不了，那讲点打砸抢的事件。


    房子涨了，你好，我好，大家好，一片祥和气氛。


    哪次新楼盘二期，三期降价，不会引发大规模打砸楼盘的事件？这就完事了么？跟地方政府的，也是比比皆是。


    社会学、统治屠龙术，多尝试站在操盘手的角度，理解一下：稳定压倒一切。


    M 总，掐掉了烟头，默默的说了一句，我在美股上也没少赚，就是有点对不住身边人，被我劝说早早卖了房子的同事。


    记得，即使他职位再高，说的也是错的。


    但生活是你自己的。


    人们对资产增值收益的误解。


    昨晚，虹桥天地，达叔和医业观察的大 V 星哥吃饭聊天。


    星哥是做投资的，聊到一个事，他去惹了另外一个投资者大 V，也是医疗行业的。


    对方的观点是，之所以这么多人都觉得买房能赚钱，其实就是这最近十年的趋势强化了认知。比如北京、上海、深圳、厦门等城市都是 10 年翻了 2-3 倍。


    折算成年化回报，北京是 11%，深圳是 14%，他认为作为投资品，回报并不高，其他城市则更少，比如苏州、天津、南京等，年化回报 7-8%。


    如果话到这里，是不值得反驳的，因为太小科种。


    还加了一句，之所以感觉赚到了很多钱，主要是因为加了 3 倍的杠杆。但是你的杠杆资金成本是每年 5%，如果未来房价跑不赢每年 5%，你用杠杆去投资，其实都是亏的。还不算折旧和各种费用。


    听着是不是头头是道：熟悉的配方，熟悉的味道。


    可惜，全部是错的。


    达叔这个账号的口号是“一起慢慢变富”，关键点在哪里？


    在慢慢两个字。


    为什么？


    因为暴富不属于普通人。


    那么收益率是多少比较合适？


    各位年轻人，看一下你从毕业开始，公司每年给你上涨工资是多少？


    达叔每年都会审批给手下兄弟们的工资上涨幅度，平均上涨幅度，6%！


    这还是业绩每年 20%以上增长，医疗朝阳行业，全球第一品牌，外资公司给一线员工的薪水平均涨幅。


    这就是普通人劳动回报率的增长幅度，中国统计局每年公布的通胀率是 2%，请问有谁觉得自己的收入涨幅跑赢了通胀？


    P2P 全国大暴雷的时候，有无数专家出来，苦口婆心的说，投资回报率高于 8% 的项目，基本上都是骗子，达到 12%的百分百是骗子。


    为什么？


    因为这么好的项目，轮不到普通人，甚至最顶尖的金融机构，都无法长期做到。


    有一项统计数据，在过去 20 年里，在股市里，做到连续 20 年，平均年化收益达到 8% 的只有两个人，巴菲特和索罗斯。


    敲一下黑板，人家玩的是美股，人家在全球范围内寻找标的物，人家有庞大的研究团队。


    我们普通人，通过买优质城市的房子，能达到 8%，甚至 10%，持续十年以上，还不够么？


    贪心是会被反噬的。


    在中国，除了房子，其他任何金融资产，但凡加杠杆的，有几个有好下场的？


    绝大多数被强制平仓，一夜回到解放前。


    加杠杆也是个技术活，普通人拿什么去融资，去上杠杆？


    在金融机构眼里，人家只认土地证和房产证。你是百分百没有土地证的，那把房产证交出来吧。


    是不是又绕回房产去了？


    最后聊，资金成本 5%。如果货币停发，那这 5% 就是你的成本。


    如果货币仍然保持现在的印发速度，就是福利。


    中国最顶尖的房地产公司，世界 500 强级别的，融资成本是多少？


    境内融资成本年化 12% 以上，境外发债综合年化成本 15%，甚至会更高。


    央企，亲儿子，融资成本是多少？不用绕道信托等，直接从五大银行拿，年化成本 8-10%。


    这才是真实的世界。


    利率是什么？是钱的价格。


    你拿到了这辈子在中国，最便宜的钱，而且是作为个人唯一规模最大的钱。


    还不满意？脑子就是坏掉了。


    如果真的发生你买的房子不涨，问题不是出在 5%上，问题出在自己选等能力上。


    不要跑偏了。


    谁要是来杠，请加达叔下面个人微信，把手里的资金打给达叔，达叔愿意每年给他年会 5%的利息，并且承诺坚持给三十年。


    说到做到，量大从优，可以提高到 6%，欢迎联系。


    在中国，除了这个赛道，还有什么能让普通人睡得着，还能稳要赚到钱的？


    做红糖，对钱包不好。


    # 第十八篇 FC#17 心口不一的自救者，深圳和天津的两条路


    昨天晚上，达叔在书桌前正在写文章，朋友说我带了一些东西，你帮忙给看一下能卖多少钱。


    然后，从包里掏出几个大信封和两卷东西，一打开，是一些字画。


    外包装上还标着价格，2万-20万不等。


    朋友问，你接触的人比较多，这个玩意能卖掉么？


    达叔看了半天，问你这是哪来的？


    朋友说，自家哥哥是当地小有名气的书法家，一部分是哥哥给的，一部分是别人送给当地官员的，流到我手里了，看看能不能变现。


    达叔问，你手里的那个医疗设备市场价多少钱？


    朋友说，大概一台20万。


    达叔问，你能搬一台送给地方官员，说是送了20万么？甚至说是10万，会不会挨打？


    朋友说，会挨打。


    很多东西的价值，只有在圈子里，才会被认可，一旦出了圈子，就啥也不是。


    比如这个字画，比如医疗设备，甚至不同城市的房产价值，个人的工作能力，亦是如此。


    你认为是价值投资，低价买入，甚至别人看着价格高了，你仍然认为很低；但我可能认为是垃圾，免费给，都不要，占地方，费事。


    反之亦然，双方能相互说服么？


    说服个屁。


    最后时间会用金钱来证明谁是对的，谁是错的。


    说服别人，用的都是利益，傻X才会奢望用嘴皮子说服别人，那是对对方的侮辱，也是对自己智商的高估。


    ### 1. 科目不同，各自安好


    有人把人生当作比赛。


    扯出了很多理论，不能输在起跑线上，等等，自己把自己给吓了个半死。


    但人生是一场大综合大考，甚至是一个有很多项目的游乐场，大家来玩一遭。


    每个人的科目是不一样的。


    比如疫情当中，李兰娟院士和李佳琦，两个都姓李，年纪也都不小了，这两人考的科目完全不同。


    一个治病救人，一个拉动经济。有名有利，在各自的领域里好好发挥，小日子都过的很好。


    但是，有很多人，到了三十多岁，都不知道自己考的科目是什么。看别人干这个赚钱，就想着也去做，做了几天，觉得很辛苦，又觉得原来好。


    看别人买房子赚钱，也想买，上网看了几个热文，看到一片“房住不炒”，房价大跌，思前想后，又黄了。


    这种人，有救么？


    完全没有。


    因为他什么都想要，却又什么都不想付出。


    达叔之前写过一篇文章，SK#67一边热泪盈眶，一边惊慌张，你为川普感染做了什么，说过一点这种人。


    一边坚信相信中国必胜，美国必败；一边又不相信最强大的国家，资产价格是最高，有泡沫，得腰斩。


    这就是人格分裂，心口不一的自愚者。


    想要荣光，却不愿承担代价。


    你是当地执政者，看着这样的家伙，想更好的学校，想要地铁，想要高级医院，想要更好的道路基础设施建设。


    钱呢？我不愿意出。


    那政府印钱，搞基础设施建设，可不可以？


    可以，但是通货膨胀，物价上涨，我可是要骂人的。


    那我找个蓄水池，把多发出去的钱，给存起来，可不可以？


    可以，但是房价上涨，我可是要骂人的。


    尼玛，你什么都想要，什么都不愿意付出，还真把自己当主人了么？


    你纳了几毛钱的税？给城市建设，够买一包水泥，还是够买一捆钢筋？


    瞧把你给能的。


    开车，不上车的拉倒，拜拜了您呢。


    不同的资产，在不同的圈子里，都是各自的信仰。


    信仰之间，有没有大小？如果你问文艺青年，他们会和你说，信仰无大小，众生平等，信仰自由。


    事实上呢？


    端着枪炮、带着病菌的欧洲人，踏上美洲大陆，把整个玛雅文明所有信仰，连根拔起，全部干掉。


    然后，后世文青，一脸无辜的问，卧槽，玛雅文明怎么就消失了呢？


    真是世界未解之谜。


    未解之谜，不是消失的文明，是这种清新逼风的脑洞。


    你想赚钱，不要生逼哄哄的只关心自己的资产信仰，因为你的信仰算个屁，微不足道，分分钟就被灭了，被连根拔起，全部清零之后，还不知道辛苦赚的工资咋就消失了呢？


    你要关心当地政府的信仰。


    他信什么？他靠什么赚钱？他每次遇到困难的时候，都是怎么度过的？多灾多难、命运坎坷的新中国，提供了无数个样本。


    经济数字好点的时候，尤其是身边国家更差的时候，那是可以吹牛逼的，不炒这个，不炒那个。


    就和各位在公司里一样，一场新冠，周围同事业绩都负增长，全年只完成60%，你完成了101%，这就是吹牛的资本。


