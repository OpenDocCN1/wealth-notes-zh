    不要争论，一争论，你就是对的，达叔忙的很，没时间和你辩论。


    你永远是对的，好好玩去吧，祝你永远快乐。


    昨天开车江沪苏一日游，从上海到苏州，忙完再到宁波。


    路上，夫人抱着手机说，有个新闻，上海沪牌出新政了。


    达叔问，什么新政？


    夫人说，上海外牌车辆行驶范围进一步收紧，外牌接下来进市区，基本废了。


    达叔，沉吟良久，哦了一声。


    这一个“哦”，是两年前半的回声。


    达叔说，上一次达叔听到这个新闻，是 2018 年的 4 月。


    那天，达叔和同事们正在合肥开季度会，上海同事，呷呷把手机拍桌子上，耶耶，上海的外牌全废了。


    达叔问了一下消息出处，发现是来自于微博和个别微信自媒体，于是坚定的说，是谣言。


    那一次，达叔赢了。


    夫人问，当时你为什么说是谣言？


    达叔说，我一般的经验，评判任何一个信息，第一步，要先看出处，看来源。如果是一惊一乍的劲媒体，好多叹号的那种，大概率不可信。


    如果是珍惜羽毛，比较严肃的媒体、个人判读推演，或官方一锤定音，那基本是对的。


    除了看出处，还要想逻辑和利益，也就是人性和钱。违反逻辑和利益，脱离“钱”的一切推导，大概率都是错的。


    一个事，谁受损，谁获益？


    没人获益，是不会有人推动的；获益不够大，是推不动的。


    当时达叔虽然没看新闻，但当时想的逻辑是：


    长三角一体化，每天有多少江浙皖的人来上海出差做生意，进来就要罚钱么？


    人家从苏州开车来上海，一个小时就到了。消费，出差，办公，投资，是给上海送钱，临走还被扣几分，罚款几百，这样不合适吧？


    除了这些给上海送钱的外地人，上海本地，也有大量土著买不起，或者不愿买十万两块的上海牌照。


    一旦禁止，不让这帮人回家了？


    达叔一直对上海市政府，是很有信心的，所以断定是个谣言。


    正在执行的这个尺度，已经可以了，把上下班几个小时高峰禁掉外牌。以缓解交通压力为名，每年卖铁皮 150 亿人民币。


    已经是极大的经济学在交通管理方面的创新。


    达叔正在开车，问夫人，这次信息出处是哪里？


    夫人嘿嘿笑，说，这次微信公众号一一上海发布。你是不是被打脸了？


    两年半前的谣言，再一次成真了。


    达叔不免感慨，在这片土地上，类似这样的事情，发生的多了，谣言基本当做预言看。


    夫人问，那为什么上一次的谣言，这一次就是官方发布了，这两年多，发生了什么？


    达叔说，我个人推测，是力量的对比结构，发生了变化，上一次有了想法，但时机不成熟。


    这世界，没有无缘无故的爱与恨，也没有无缘无故的政策放松与收紧。我们来推理一下看看。


    2018 年 Q2，有消息，上海外牌要收紧，被辟谣，假新闻。


    2019 年 1 月 7 日，尼古拉·特斯拉逝世纪念日，特斯拉官方宣布，上海建厂。


    2019 年 12 月底，特斯拉交付了第一批电动汽车。


    2020 年底，特斯拉全面实现国产化。


    中国政府寄希望于特斯拉这条鲶鱼，带动整个中国电动汽车上下游产业链完成迭代，再上演一遍手机行业的好戏。


    苹果和三星盘活智能手机上下游，国产智能手机进厂，玩拼装，谁能玩过咱们中国人，打扫战场，再出门去吊打别人。


    夫人问，那电动车不是已经开始卖了么？量还不小的样子。


    达叔说，还不够。一个产业要起来，规模，规模，还是规模。


    绝大部分人，现在还是继续买燃油车。


    产能都上来了，新菜单都做好了，新菜也买来了，顾客不按照菜单点新菜，还是点原来那几道菜，你是饭店老板，你怎么做？


    一种做法，承认错误，菜单重做。


    一种做法，把菜单换一下，把想卖的新菜价格调低点，把不想卖的老菜，价格拔高一些。如果效果不好，那就再拔高。


    夫人说，这个饭店老板，是按照第二种方法来的。举世无双，全世界最贵的铁皮——上海车牌，真正的贵金属。


    达叔问，你印象中，有没有比这个成本更低，售价更高的金属？


    夫人说，有一个，“免税金牌”，算不算？达叔说，不要调皮。


    你给我的微信上发几个字，我要列一个大纲：外牌的黄昏。


    沪牌——自造的武器。价格是最好的驱赶工具。电动车与房地产。


    夫人说，你又在鬼扯、一个沪牌新政，你能扯出这么多？前面几个还好理解。电动车和房地产，是什么鬼？


    达叔说，你要有举一反三的能力，一叶知秋，所有的玩法、看似眼花缭乱、互不关联、但很多底层逻辑、都是相通的。


    夫人说，那你来鬼扯看看、我看你还能编出什么。达叔问，我们从古代人类发展来看，人类刚有马车的时候，你买了一辆马车、需要找官府报备么？


    夫人说，应该不用。


    达叔说，对了、达叔小时候、在农村、家家户户都有平板车，也不用上牌、照样上路、照样干活。那为什么小汽车、就要上牌了呢？


    夫人说，为了确认车辆信息，违章，追责，管理交通。达叔说，胡扯，这些都是表象，都是借口。真正的动机，上牌是为了确权，明确产权。


    确权，是为了收税。


    夫人说，你这个家伙，三句话不离本行，脑子里全是钱。那平板车也可以搞上牌，去收税，为啥不干？


    达叔说，因为成本和收益，划不来。收税是有成本的，农民穷，土地广，价值低，藏匿容易，收税人员下不去，收不上来。


    所以，即使平板车天天在农村出车祸，天天违章，拥堵交通，都没人管。


    达叔问，你小时候，上初中，有没有警察，去你们中学，给自行车上牌照？


    夫人说，我不会骑自行车，所以不知道。


    达叔说，我小时候经历过，在自行车上打个钢印，挂个小牌子，20 块。当时我年纪小，很好奇，就问那个警察，满大街都是自行车，你为什么只来挂学校的车牌？


    警察乐呵呵的给达叔扯了很多理由，什么安全，违章，有序，追责，防盗等。


    达叔不信，就继续问，是不是因为我们这批较集中，好抓，满大街的自行车，你抓不到？


    警察说，臭小子，别瞎说。


    夫人问，那你说的这个和房地产，有什么关系？


    达叔问，汽车牌照和房产证的背后逻辑，是一样的。


    汽车工业刚起步时，牌照根本不值钱，特定时期，买车还有各种优惠，补贴等。再后来，税也收了，车也卖了，行业养大了，想开车？


    得继续交钱。


    车子我自己买的，还给啥钱？


    嗯，有点道理，那交个牌照钱。


    多少钱？


    绿牌免费，蓝牌 9 万。


    所以，价格是最佳的驱赶工具。


    经济学研究的是稀缺和选择，背后都有价格的影子。


    夫人问，那房子也是这么玩的？


    达叔说，你是不是忘了上海的蓝印户口了？上海房地产刚起步的时候，哭着喊着，也没人买，硕大无比的资产列车，没有燃料，发动不起来。


    夫人问，什么是燃料？


    达叔说，人民口袋里的钱，就是燃料。


    为了把老百姓捂着的紧紧的的钱，挖出来，免费给蓝印户口，可以首付一成，各种优惠，各种吸引。


    ![](img/d747a49dab77676cf44faebe24df049c_165_0.png)


    这种投入和优惠，从 1994 年，一直玩到 2002 年，前后 8 年时间。


    房地产的游戏大家都会玩了，都很配合了，然后蓝印户口停掉，游戏规则开始收紧，不停收紧，玩这个游戏的成本、越来越高。


    从买房送户口，一步步进化到，想买房你必须得结婚，得交 5 年社保，得只能买一套，从首付一成变成至少 3.5 成。


    结束了么？


    未来还有房产税等着你呢。


    所以，沪牌的游戏，也才刚刚开始，只要规则还掌握在人家的手里，这个游戏，可以一直玩下去。


    从蓝牌免费，到蓝牌 10 万，绿牌免费，未来几十年，对于绿牌的命运。达叔也是不乐观的，玩到最后，也要收钱。但凡需要登记的东西，大概率都有税收在前面等着你，否则，出人、出力、出场地，真的为人民服务么？不收点钱上来，怎么为人民服务。


    大城市的车子和房子，本质上都不是普惠的，都是奢侈品。


    在社会中，都是有钱人的东西，既然你们有钱，那你们交点出来，大哥做事要花钱，你们赶紧的。


    达叔在公司里，经常和同事聊天，说规则是死的，人是活的，当没有工具的时候，我们可以自己造。


    规则一响，黄金万两。


    ## 第二十篇 FC#19 冯是慈眉善目的坏人，欧是怒目圆睁的金刚，要警惕闯入你生活中的高能量者


    今天周二，达叔昨晚开车回了上海，明天上午进公司开个会，然后出差。


    有经销商朋友约达叔见面，聊完生意，问，你有看一个节目叫《共识》么？


    达叔说，最近忙成狗，我们这个时代，啥话题都能吵起来，还有啥共识？就差府院之争了。


    朋友说，有一期请的吴晓波和冯仑，题目是《年轻人应该趁早买房？》


    达叔说，你先别剧透，达叔来猜一下，两个人谈话的大概观点。


    冯仑的观点大概是，不要着急买，然后给出一堆理论。吴晓波大概会用自身的经历，每年一套房，来聊要趁早买。


    对么？


    朋友说，嗯，大概的方向对。你怎么猜到的？


    达叔说，因为冯总是个坏人，一个慈善善目的坏人，太懂得年轻人爱听什么了，一个典型的商人，就是对准目标客户投其所好。


    朋友反问，大家不都是这样么？


    达叔说，不都是这样。还有一类人，走的是另外一条路，逼着大家买房，手把手的教，你要是不买，对你又打又骂，冷嘲热讽，甚至送你两字套餐。


    这类人的极致，是欧神，算是怒目金刚。


    普通人，如果只是碎片化学习，没有任何理论框架，是容易分不清方向的。


    分不清方向的人，很脆弱，也很危险，来一个能量场强大的人，他就被带跑偏了。


    朋友说，你之前好像提过一个理论，说要警惕高能量场的人。


    达叔说，是的。我在公司的一些内部会议上，也给大家分享过，自己要不不断学习，要成为高能量场的人，你说的话，才有人信，才有人追随，你要成为一面旗帜。


    但是，很多人觉得达叔是在讲一个笑话，但达叔很多时候，说的每一个笑话，都是很真诚的建议。


    朋友说，那高能量场的人出现，不是人生的贵人么？


    达叔说，是贵人，还是要灭者，要看这个高能量场者的心性，向善还是向恶，阶段性的向善，还是阶段性的收割。你要分清，他的理论框架，还有他出现的时间点。每个人，都认为自己的价值观，是很稳定的。


    同一件事情，有自己的看法和意恶。


    事实上呢？绝大部分人的价值观，都极其不稳定。


    朋友说，你给举例一下。


    达叔说，随便举个例子，你别生气啊。


    朋友说，不生气。达叔问，现在咱俩在喝咖啡，你老婆出轨了，你生气不生气？


    朋友连忙摆手，吐槽，你这过分了，乌鸦嘴。


    达叔说，你先正面回答问题，生气不生气？


    朋友说，那特定肯定生气啊。


    达叔继续问，那你一回家，发现老婆和刘德华躺在床上，是真的刘德华，你还生气么？


    朋友顿时有有点懵逼，一时语塞。


    达叔问，你是不是顿时有惊讶，有点开心，有点愤怒，甚至有点好奇，刘德华怎么跑到你家的，你老婆和刘德华怎么好上的？


    基本上忘了出轨这个事，赶紧把他们拉到客厅，倒上茶水，说一下你们的故事。


    自己的老婆，出轨刘德华，离婚改嫁给刘德华，好像不是一件坏事，反而是一件脸上有光的事。


    朋友说，好像有点这个可能。


    达叔说，你看，这就是高能量场人闯入你生活的下场，普通人完全招架不住。你怎么做营销？


    朋友说，骗人的玩意，不能干。


    达叔问，那马云或马化腾，要拉着干，你干不干？

