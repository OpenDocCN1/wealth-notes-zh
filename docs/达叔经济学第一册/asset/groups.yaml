    ## 第二十七篇 FC#26 只有强者才会天天想着要公平


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    达叔今天在朋友圈里，分享了一个图，是最新出的胡润百富榜。


    ![](img/d747a49dab77676cf44faebe24df049c_233_0.png)


    达叔配上了一段话，说自己是十几岁开始，第一次进县城，读高中，有了图书馆，别的同学都去读名著，达叔花了一个学期，在图书馆里翻《福布斯排行榜》等商业杂志。


    这个玩意好好研究，能研究出很多有意思的认知。


    达叔每研究一个新的领域，都会用一个新的笔记本，从框架开始搭建，把相关的书籍、数据、观点，都梳理出来。


    这个习惯，是从中学就养成的，所以达叔的书柜里，有很多自己的笔记，达叔以后要是老了，从头排起来，能看到达叔每一年，都在思考哪些事情，如何形成思考框架的。


    这个方法，分享给大家，用不用就看自己了。


    达叔那么费劲的研究自己感兴趣的领域，为了什么？


    是为了和大家公平竞争么？


    公平个屁。是为了效率啊。


    所有肯地里下苦功夫的人，都是在给自己加杠杆，提高效率，找到更优方案，去快速打败对手，甩开对方。


    我们上学、工作、改善、拼命努力，都是在努力避免和别人公平竞争。


    所有外力强行塑造的公平，都是对智力上乘、积极努力者的压迫，是对弱者的象征性保护。


    而这些所有手段，绝大部分，都是一时的，牺牲效率的，是另外一种不公平。


    而被保护的人，大概率是没有获得感的，不会感恩的。


    本文所有观点，都是俺瞎想的，不一定正确，随便看看。


    ### 1. 研究成果。


    比如你读这个商业杂志，看很多富豪排行榜，不能只看热闹，要善于总结规律。


    那个年代，出来的富豪，一大堆在地产行业、能源行业、金融行业。


    那时候，互联网才刚刚起步，还看不到首富的影子，互联网是对我们这代年轻人来说，是一个黑天鹅。


    这种事，不是每一代人，都有机会遇上的。


    但地产、能源、金融对于普通人来说，一直是致富的行业。


    除了研究行业，还要研究富豪的产地，瞄一眼，很多都在北上江浙粤。


    财富所在的行业和产地，你要仔细想，这是因，还是果？


    哪怕就是那边风水好，你是不是也该往风水好的地方，挪一挪呢？


    小地方的老师、班主任眼界很窄，为了毕业率等指标，恨不得学生随便报个专业，赶紧走，根本就不在乎你的前程。


    当时南京头部高校来我班招生，说你来我们这，专业随便选，班主任开心坏了，说了几个他认为牛逼的专业，怂恿俺去。


    达叔头都不抬，心里默念，你懂个啥，俺要一步到位，去上海。


    所以，达叔强烈建议，高中生要多看一些商业杂志，尤其是《财富》排行榜之类的。


    除了看商业杂志，还要看一类书，那就是要多看小说，政商类的小说，官场类的。


    达叔对当官、做公务员，一点都没兴趣，俺生性自由，吊儿郎当的，但是为啥要看这个类型的小说？


    因为小说，展开了讲，就是“小声的说”。


    一般在讲台上拿喇叭喊的，大声说的，都不可信，小声说的，很多都是真话，都是真相。


    你看这类的小说，你会知道地方政府官员在想什么，在和什么样的人打交道，他们被谁管，受谁的约束，他们的考核机制是怎样，相互之间怎么配合。


    还能看到，为什么所有的城市主政者，都喜欢建新城，不喜欢搞旧城改造。


    项目是怎么招标的，怎么围标的，怎么写标书的，怎么打点的，怎么收尾的。


    你多看几本，问问自己，这些书里的人物命运，有哪些共性？事物发展有哪些共性？财富流淌的方向，有哪些共性？


    是所有的作者，都是一个老师教的，还是不同地区的人，都是这么生活的？


    你想通了，就能治好一身的文艺病，不再像个傻逼一样，站在宇宙中心呼唤爱，更不会天天去和别人探讨政治和道德。


    具体的执行层面，达叔列一个研究路径，包括三个方面：


    - 1、这个领域最顶尖的人，怎么看，怎么想，怎么说。

    - 2、这个领域的教材、小说，怎么写，怎么论述的，基本原理是什么。

    - 3、这个领域里，最调皮、最简洁、最傻瓜的版本，是怎么说的。


    举地产投资行业为例：


    - 1 类，是欧神、德科、任等，达叔很早之前，写过文章尝试总结，FC#5 大神们的争吵，我们该相信谁？。

    - 2 类，达叔毕业的学校，有专门的房地产专业，有很多的教材，各位自寻。

    - 3 类，就是财上海，王马丁之类的，无比调皮的。


    除了这个研究框架，有别的方法么？


    还有一个小技巧，那就是你去研究说话的人。


    一种是说话四平八稳的，官话套话连篇，身居高位的，这种一般说话，都不太可信。


    另一种是生性狗介，魏晋逸风，甚至有自毁倾向的，这种人说的话，无论你听起来，有多不舒服，有多刺耳。


    一定要耐着性子听完，这帮家伙，大概率说的是真话，是在帮你的。


    你今天不听，明天这帮家伙简就被撕电了，想听都没的听。


    这个世界，终于不刺耳了，也没有真相了。


    万马齐喑。


    SK#64 那些咥肾参半的人终于不再说话了，SK#66 很快就没人逼你赚钱了，


    达叔 2020 年 9 月份写的文章，在 2021 年的今天，再次应验了。


    ### 2. 屠龙刀。


    很多人看武侠，看小说，全都白看了。


    只顾着看尹志平和韦小宝了，忘记了武林人士，为啥要去抢倚天剑、屠龙刀，为啥要去抢《葵花宝典》。


    拿到这个，就能功力大增，削铁如泥，号令武林。


    小说里，没说拿到屠龙刀，该怎么用才牛逼，该怎么用，才能号令武林。


    就告诉你，拿到了，就可以。


    这个公平么？


    不公平，但这就是生活，就是武林。


    有人一生出来，家里有墙上就挂着屠龙刀和倚天剑，书柜里全是《葵花宝典》、《九阴真经》、《乾坤大挪移》。


    你明明知道，有一些东西，是可以加杠杆的，可以提高效率的，偏偏幻想让人家把祖传的剑刀放下，和你一起扎马步。


    人家是傻逼么？


    ![](img/d747a49dab77676cf44faebe24df049c_238_0.png)


    你刚才打好马步，人家一刀就把你劈了，还特别对称的那种，左右两边一样重。


    这就是水平。


    达叔是什么时候想通的？


    是来了上海，遇到了一堆上海的同事，这帮家伙，每个家里都有好几套房子，看着工作能力不咋地，每年赚的也没达叔多。


    但是，每当达叔想喝怒，就被上海资产一波涨幅，弄崩溃了。


    这就是人家爸妈、祖辈留下的屠龙刀，家里的孩子，资质再平庸，只要把这屠龙刀握在手里，就干掉一大片呜呜哇哇练武的。


    优质资产，是屠龙刀，达叔默默的拿出笔记本，写了好几本，把能研究的课程和理论，全研究了一遍。


    卧槽，那还瞎忙活着，练啥啥拳击，直接搞屠龙刀去吧。


    这就是观察、思考的价值。


    如果哪一天，大家真的不玩屠龙刀，开始玩马克沁机枪、核弹了。


    达叔也肯定会跟着玩的，拿出小本子，看看谁家的马克沁最牛逼，给达婶、女儿买几把，放在家里存着。


    达叔说过，经济的本源，不是经世济民，是希腊语的词根，就是经营家庭。


    千万不要安慰自己，别人都是这么做的，所以我这么做，没问题。


    达叔观察过了，绝大部分家庭，都是不幸福的，也是不团结的，更是无效率的，你不要和他们比。


    一个最简单的指标，两口子能坐下来，安静的吃一顿饭，平静的交流一天各自的所见所闻所思，90%的家庭，都是无法满足的。


    每天，鸡飞狗跳，内部都不团结，还搞个毛线屠龙刀。


    你弄了本《乾坤大挪移》，她就给你垫桌角，或者扔火炉里烧着取暖了。


    达叔分享过一个观点，鼓励我们的大概率是陌生人，低估我们的大概率是身边人，拖累我们的绝对是身边人。


    如果你不相信，你去问警察，是不是每次命案出来，查了半天，大概率都是身边人干的？


    所以当你哭着喊着要公平的时候，别人一生都在追求不公平，通过学习、通过管理、通过添置工具，获取局部优势，实现突围，获取最大的胜利。


    你们追求的东西，就不一样，别跑偏了。


    听达叔一句劝，别追求那些虚无缥缈的东西，谁都追不到，还惹了一肚子气。


    最后，针对最近发生的一些事儿，FC#25 这一次，他们选择让烧开的水壶别出声，达叔在此基础上再补充一点。


    学术问题，学术解决。——这是孟子的方案，长期没人搭理。


    学术问题，政治解决。——这是董仲舒的方案，用了两千年。


    经济问题，由于惯性，全世界的政府，都想用政治解决，但成功的不多，最后还得用经济解决。


    说到底，因为学术和老百姓没太大关系，上面筛选一些愿意提供顺耳理论的学者，就可以了，政治家需要什么，学者就提供什么。


    但经济，和每个老百姓息息相关，是正儿八经的人心所在，过度的扭曲，会被反噬的。


    ## 第二十八篇 FC#27 新春假期，如何与烧钱的父辈好好聊


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    每次过年，达叔的心情都非常沉重，一方面是假期打断了达叔的工作节奏，另一方面是要见很多人，看到的很多是每况愈下的人生，很悲伤。


    这两个沉重，很多人是体会不到的，比如你不是工作狂，你就不会被假期困扰；你不对生活百态敏感，不对家庭财富选择敏感，你就不会对别人悲伤。


    所以，每次放假，达叔都想在家里宅着，看点书，喝点茶，哪都不想去。


    但是，领导权在达婶手里，去哪，见谁，得听安排，所以每次放假，都会看到一些故事。


    以下内容，不一定正确，各位随便看看。


    ### 1. 舅舅。


    达婶带达叔去见了她的大舅，一个患了严重肺病的老人，现在每天要吃很多药，已经基本丧失了劳动能力。


    达婶感慨，这个大舅是她小时候，整个家族里，最有钱的，自己家里如果实在缺钱了，基本上都是向这个大舅借。


    他大舅和达叔一样，也棋内，偷偷摸摸的借一两万块钱，这在当时也是大钱。


    他是干啥的？


    九十年代，是一个工厂的厂长，有技术，又是管理岗位，又红又专的人才，是当地镇上第一批万元户。


    达婶有一个表姐，也就是这个大舅的女儿，当年是标准的白富美，是达婶最羡慕的人之一，人漂亮，爸爸又有钱，生活仿佛永远都是幸福。


    现在看呢？


    生活已经一团糟，嫁的男人，在当地工作普通，收入微薄，在内心深处完全没有信心驾驭自己漂亮的老婆，生活充满了冲突。


    达婶感慨，你说的那个理论，虽然凶残，但是好像真的是对的，婚姻是女人的第二次生命。


    达叔说，这个理论，在这个家庭里，不完全对，这户人家的衰落，是从父辈开始的。


    达叔在前一篇文章中写过，同样是乡镇企业起步，同样兴衰一轮走完，地方不同，命运截然不同。


    在长三角的，但凡置业了，多买点房子，后代都拥有千万规模的、可传承资产，只要孩子不是个败家子，家业还是在的。


    但像你们这个的地方，距离城市群比较远，又没有投资理念，2000年左右，手里的十几万，全部用来在村里盖个大房子。


    资产没有增值属性，也没有流动性。


    所以，这个家族的衰败，是从父辈的认知开始的，怪不得别人。


