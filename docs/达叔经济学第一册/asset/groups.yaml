  - '[PAGE 79]


    不敢相信自己的眼睛吧。


    在中国所有省会城市里，长沙房价排名倒数第三，比长沙还低的省会是西宁和乌鲁木齐。


    拉萨和呼和浩特，均价都比长沙高，是不是很诡异？


    长沙，缺少曝光率么？芒果台大本营，娱乐圈一霸。


    GDP 高，房价低，是不是所有国民口中的良心城市？


    地方政府不依赖土地财政，人民安居乐业，过着幸福而美满的生活。


    但事实真的是这样吗？


    再说一遍，价格是由供需决定的，和地方政府官员素质没关系。


    长沙房价低，浅层次原因：和重庆一样，长沙土地供应量 大，特别大，不缺房子。


    不对啊，达叔，你前面那个分析重庆的表格里，没有看到长沙的土地供应影子啊。


    对，这就是长沙的隐情：


    长沙“福利分房制度”结束得特别晚，房子分的多，不缺房子，所以房价低。


    这是一个只属于长沙的故事。


    所有的城市要发展壮大，都要先拉开骨架。


    什么是城市的骨架？路网、地铁、轨道交通。


    76


    公众号懒人搜索，懒人专属群分享'
  - '[PAGE 80]


    关于城市骨架，很多城市差异非常大，比如一直相互 PK 的南京和杭州。南京在骨架上一直就遥遥领先杭州，杭州近些年才开始奋起直追。


    1990s，长沙就开始起跑，路网输的比多数城市都要大。


    铺路是要花钱的，1990s，大家都没钱，长沙也不例外，怎么办？


    看过达叔之前文章的都知道，土地就是钱，拿地抵。


    长沙地方政府没钱给基建公司，就给土地，基建公司被动的也多了。


    注意，基建公司不是房地产公司，这两者之间有很大的区别，他们要的是工程款，当年的土地又不值钱，没有现金流，公司会死掉的。


    怎么把土地变成钱？基建公司就和各种公家单位合作，给公家单位盖房子，低价卖给公务员、企事业单位。


    早年单纯的基建公司，只想着赶紧把钱拿回来，根本没想要靠房地产赚大钱。


    比如芒果台的明星们住在哪？自己盖的小区里。长沙的各个公家单位，都是如此。


    1998 年，国家要求全国停止 “福利分房制度”，这在需求侧，为房地产的腾飞做好了准备，你们把钱包都准备好，我要开始玩土地财政了。


    长沙地方政府，一看兜里，没多少土地了，发出去的土地太多了。'
  - '[PAGE 81]


    直到今天，当年发出去的土地都还没消化完。具体发出去了多少呢？没有人统计过，长沙也从来没有披露过，版本很多，但是有一点是肯定的，那就是数量巨大。


    这就是隐形的“福利分房”，价格十分便宜。


    长沙市精微在公单位里的，手里都有很多房子，如果长沙不控制房价，这些人哪还有心思干活？


    而地方政府从这里，再也得不到任何好处，我得不到好处，你们还想卖高价？限价、调控，慷基建公司之慨，出自己的业绩，这是目前主政官员的主观因素。


    客观因素是长沙地方政府，不是不依赖土地财政，而是无法依赖。


    不是不想，是干不成。


    长沙想不想依赖土地财政，看一个地方，就明白了——梅溪湖新城。


    楼特别高，路特别堵。


    为什么？梅溪湖新城规划先进，但是后来不断增加容积率。


    为什么要加容积率？因为要多卖土地款。


    为什么要多卖土地款？


    因为城市之间竞争，是要花钱的。其他城市还能卖土地，长沙无法依赖土地财政，钱从哪里来？


    靠税收？别闹了。'
  - '[PAGE 82]


    在分税制时代，GDP 再高，税收大头 70% 归中央，小头 30%归地方。


    单纯靠税收，没有一个城市能发展起来，等着一起穷吧。


    还有别的办法么？


    最后一招：地方债。


    达叔在 JJ#19 独山县烧掉的 400 亿，其中有你的一部分，里面有讲过，一个小小的独山县，财政收入一年只有 10 个亿，却搞出了 400 亿规模的地方债。


    400 亿地方债的利息是年化 10% 左右，一年的利息就 40 个亿，独山县财政收入全部还利息都不够，相当于破产了。


    那么长沙到底举了多少地方债呢？


    说不清楚。地方债是一个黑洞。


    长沙今天的繁荣，是在透支未来：


    +   1、大幅度举债；

    2、贱卖土地。


    土地是不可再生的国有资产，这种行为算不算国有资产流失？


    所以，你觉得重庆和长沙的低房价模式，会推广到全国么？


    最后，达叔说一下，重庆房价已经开始涨了一波了。长沙早年发出去的土地，库存早晚会消化完，当长沙可以玩土地财政的时候，长沙会不会高价卖地来还债呢？'
  - '[PAGE 83]


    你是一把手，你会不会？你再不卖地还债，你的财政收入也要和独山县一样，不够还债的利息了。


    看懂了这篇文章，能赚上百万。


    关注达叔经济学，让我们一起慢慢变富。'
  - '[PAGE 84]


    # 第十二篇 FC#12 权贵迁徙纪，城市生死劫


    中国城市的格局演变，剧烈、宏伟，我们生活在百年一遇的大变局时代。


    我们这代人正在见证着一批小县城，成长为人口千万规模的超大城市。


    躬逢盛世，很多人却浑然不知。


    郑州，左洛阳、右开封，两边都是千年名城，帝王之气。


    1954 年 10 月 30 日，河南省政府由开封迁往郑州，郑州从此成为河南省省会。


    在这之前，郑州规模也就是一个小县城，和合肥一个德行，都是被新中国选中的省会。


