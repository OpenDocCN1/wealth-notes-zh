    所有限制政策，都只能限制普通人，不能限制“刁民”，结果，惩罚了顺民，奖励了“刁民”。


    历史从来不会惩罚胜利者，因为这批胜利者，会在史书上，横平竖直的写，老子不是“刁民”，老子是掌握了科技树的专家，老子代表着先进生产力。


