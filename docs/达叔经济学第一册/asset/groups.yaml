  - '[PAGE 26]


    # 第五篇 FC#5 大神们的争吵，我们该相信谁？


    2020 年突如其来的新冠疫情席卷全球，各国抗疫，波及巨大。


    伴随着中国新冠疫情收尾，知乎等平台开始陆续多了一些话题，就是 2020 年的房子还能不能买？会不会涨？


    从 20 年前开始，这种多空对块的舆论就没有停息过，每次都是空军气势汹汹，人多势众，言论广受欢迎，最后都被空军吊打，满地找牙，在此孰对孰错去权就不复述了。


    这是世界观的问题，道不同不相为谋。


    达叔长期投资长三角城市群的楼市，这一点在之前的个别文章里一定的陈述，今天这篇文章，主要来梳理一下多军内部的几个大神观点分歧，各有道理，供君参考。


    达叔长期关注的有很多，但比较代表性的头部有这三个人：


    开宗立派的水库欧神，吴晓波阵营的刘德科，还有草根起家的卢俊。


    其他的比如平米、朱红之泪、城市挖掘者、地图、楼市大酱、三鱼说等都是衍生出来的小分支，或是联盟。


    由此，达叔感慨还是那句话：穷人都在相互撕逼，富人都在相互扶持。'
  - '[PAGE 27]


    一个有组织的联盟体系，可以成为庄家，对无组织的个人形成暴虐和收割。


    以下是大神们的分歧：


    +   1、关于城市人口选择：


    欧成效认为：只有大城市才有房地产，1000万人口以下的城市都是危险的，至少要800万，否则流动性和接盘侠很差。


    刘德科认为：中国的城市化红利还有20年，即使是长三角地区的县域，好一点的也有上百万人口，也就是文艺青年口中的“涛冷翠”，人口只有39万、不足50万，照样有房地产。所以中国比较好的县域、及以上能级的城市，都是值得投资的。


    ![](img/d747a49dab77676cf44faebe24df049c_27_0.png)


    卢俊：承认前者理论，后者城市有楼盘生意，也一直做，实用主义者。'
  - '[PAGE 28]


    2、关于城市具体选择：


    欧成效：除了备受争议的酉滩卖地外，国内极力推荐的城市有三个：重庆、沈阳、深圳，而且都有详细的理论基础，并以身作则，带头冲杀。近日无一，又有图片显示正在重庆看房子，这种精神令人敬佩。


    刘德科：看好的城市有很多，在这个文艺青年的眼里，稍具规模的城市就没有不看好的。但在楼市大脑的相关节目里，对被价值低估的城市有一定的论述：长沙、合肥都是他喊着要去买的。


    长沙是被极大的低估，合肥是成长性最快的长三角城市。但德科自己最近买房字时，还是买了大木营杭州的钱塘江边大平层，对得起自己的生活。


    卢俊：人生买 4 套房子就够了，最近应该是在上海换了房子，期待详细分析。


    3、关于新房、二手房选择：


    欧成效：“看房 200 套”、“新房癌”、这些词汇应该都是欧神发明出来的，欧神旗帜鲜明的鄙视几乎所有买新房的人，觉得买新房的就是懒情，就是交智商税。达叔不论其对错，这种旗帜鲜明的态度，在含糊其辞的众多大神里就很难得，副作用就是经常送两字套餐。


    刘德科：对新房、二手房没有特别的强调，但是有一个观点是很明确的，那就是要买新时代的产品，不要买上一个'
  - '[PAGE 29]


    时代过时的产品。以此延伸出来的户型、小精美（同样户型下面积极要小，精装修不要毛坯，物业费要贵）。


    这种对很多人的常识具有一定的颠覆性，其中的逻辑要自己去品，至少汝叔是认可的。


    卢俊：我们靠新盘吃饭，肯定推新盘嘛，这一点德科也有类似的倾向。


    4、关于房企品牌选择：


    欧成效：旗帜鲜明的反对一切品牌溢价，认为投资最重要的原则之一就是标的物：要便宜。并给所有买新房、品牌楼盘的投资者起了一个名字：“贵妇流”，对之嗤之以鼻。尤其是买了仁恒、万科、碧桂园等头部房企的，那是一个恨铁不成钢、痛心疾首。


    刘德科：万科、万科、万科，德科应该是万科的死忠粉，在节目里无数分析万科，那叫一个爱啊。近期做的一个系列节目，拿的所有案例都是万科的楼盘，涉及的城市有十个，汝叔看了徐州万科的那一期，看的都心动了，差点去徐州买一套。所以德科应该是推线品牌房企的，尤其是一线房企。


    尤其是节目最后还来一个《彭城怀古》，太风骚了。


    > 占徐州形胜，消磨尽、几英雄。

    想铁甲重瞳，乌骓汗血，玉帐连空。

    楚歌八千兵散，料梦魂，应不到江东。

    空有黄河如带，乱山回合云龙。'
  - '[PAGE 30]


    汉家陵阙起秋风，禾黍满关中。更戏马台荒，画眉人远，燕子楼空。人生百年如寄，且开杯，一饮尽千钟。回首荒城斜日，倚栏杆目送飞鸿。


    卢俊：人生要买四个品牌的房子，如果达叔没记错的话应该是：万科、融创、金茂、龙湖。当然也有可能达叔记错了个别的，但整体应该是对的。其他楼盘的呢？生意也是接的，达叔就很喜欢卢俊同学的务实精神。


    甚至是账户被封了一次，还能再爬起来，达叔很佩服。


    5、关于地段选择：


    欧成放：谁买新城谁傻叉，要买老城区、成熟区域、成熟板块，新城都是骗子，都是 GDP 堆积出来的。


    刘德科：要买半热区、买城市裂缝地带，这一轮论也是比较特别的，很多人要么赌新城中心区，要么买老城区，德科建议买中心的裂缝区，那可真的是长持啊。


    卢俊：观点不明，从广告推送来看，支持新区的更多一些，毕竟老城区的新盘推出的少，广告主也少，达叔对卢俊同学的软文撰写能力相当佩服，纵横捭阖、吾辈学习之楷模。


    达叔的观点和倾向并不重要，重要的是给各位看一下，即使是大方向一致的情况下，内部也有很多不同的观点，多看看，多思考，有助于我们的成长。


    最后，引用一个《彭城怀古》中的一句送给各位：'
  - '[PAGE 31]


    # 第六篇 FC#6 你与脚下的土地共命运


    你能量的源泉是什么？


    达叔之前在相关文章里，一直陈述一个观点：你能量的源泉来自于你脚下的土地。


    这一点，很多人都没认清楚，比如很多贪官在国内耀武扬威、前呼后拥，一呼百应。赚了很多钱之后，畏罪潜逃跑到美国，基本上就过上了富足且枯燥的生活，与整个美国主流社会脱节，没有了社会关系和朋觉，基本也能干的工作也就是一些不入流的了。


    人是社会动物，一旦沦为二等公民，基本也就废了，至少是精神上废了。


    比如《人民的名义》里丁义珍，出场时，光彩夺目、意气风发，所有大老板都来敬酒。出逃美国后，想依靠资源再赚钱就难了，被黑社会勒索，沦为刷盘子的。


    人还是那个人，但是原来的能量，没有了


    这就是个人与脚下的土地，与组织之间的关系，赋能，能量是被赋予的。


    但很多人，没有机会进入到这阶段，更多的是一步步攀爬，争取赚更多钱的阶段。


    电梯理论


    三个人同时乘一部电梯去 21 楼。'
  - '[PAGE 32]


    A 在电梯里呼呼大睡，B 一直在做俯卧撑，C 在认认真真的看书。


    过了一会，到了 21 楼。


    A 觉得睡的很舒服，轻轻松松的到了，B 觉得是自己做俯卧撑才让自己能到达，C 觉得是因为自己努力看书才能到。


    重要的是你乘的哪部电梯，而不是你在电梯里做的事。


    这句话，看着好像很丧。在关于中国人资产管理里面，这个电梯就是你脚下的土地，你所在的城市。


    同样的结婚，买房子。上一代人，在上海内环里的稀里糊涂买了一个，二十年后就是千万富翁了，而在鹤岗结婚的，房子万把块都没人买。


    那么奋斗的意义是什么呢？这是很多年轻人崩溃的点，一两年工作赚的钱，还不够一个月深圳房价的涨幅。


    经常读达叔文章的人应该知道，达叔和不悲观的人聊天。


    努力奋斗的意义，就在于，树挪死、人挪活。


    电梯理论除了楼市之外，还能应用于行业分析，有的行业薪水就是高，也更容易创业。


    努力奋斗的意义就在于让我们拥有更多的选择权，让我们能分清哪个是更高、更快的电梯，并且能过桥挤进去。


    一、能辨别出；二、能挤进去。'
  - '[PAGE 33]


    听着好像很容易，但是很多人沉浸在每天忙忙碌碌的生活里，自怨自艾，无暇思考，也无力思考，就这么踩着者，满眼看到的都是困难。


    # 未来二十年的机会


    无论从哪个角度，全球各大智库对中国的分析，中国经济增速、城市化进程还有 20 年的机遇期。


    我们所遇到的任何一个困难，不要激动，不要盲目跟风，沉下来思考一下，比如这次新冠疫情是一个什么性质的困难？中国的楼市是一个什么样的资产发展？


    +   一、是节奏问题还是结构问题？

    二、是周期问题还是趋势问题？

    三、是局部问题还是普遍问题？


    疫情会打断中国的城市化进程吗？大概率是不会。疫情会打断中国的经济增长吗？大概率也不会。疫情会改变土地财政模式、纸币发行的温和通胀么？更不会。


    那么，我们应该一手研究自己所在的行业努力充实自己的现金流，一手研究自己脚下的土地、自己所在的城市性质。


    近期，中国发改委印发《2020 年新型城镇化和城乡融合发展重点任务》再度提到 “收缩型城市要瘦身强体”，这是一个很严肃的警告，只是很多人没有意识到而已。


    《中国城市人口新变局》报告显示，目前城市分成三个类型：'
  - '[PAGE 34]


    “扩张型城市”、“饱和型城市”和“收缩型城市”，他们三个的比例是 4:5:1，人口正在加速向一二线大都市，都市圈聚集。


    长三角城市圈，珠三角城市圈，国家级中心城市等等，都在不停的提醒我们电梯在哪里，甚至连电梯的高度，都在尝试着告诉你，北上深必定是世界级的，未来价格肯定也是世界级的。


    如果你的脚下是资源枯竭、被大城市虹吸、产业变迁、偏远、欠发达、行政调整收缩等，请尽快逃离，请尽快逃离，请尽快逃离。


    当然，有的人会说，疫情让很多人都没钱了，楼市怎么涨呢？一个城市的楼市增长从来都不是存量的关系，而是增量的关系


    达叔以上海为例，人口 2500 万，存量房 780 万套，2019 年楼市成交量 25 万套，25/2500=1%.考虑到个人和家庭合买比例，每年 5%的人发财就可以支撑起楼市的健康成长，巨大多余的存量房、不改善、不置换、不交易，与
    market 涨跌无关


    达叔做一个预测，有可能，2020 年下半年，部分扩张型城市又要开始上涨了，当然，达叔也希望自己是错的。'
