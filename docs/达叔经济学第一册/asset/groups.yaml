    ![](img/d747a49dab77676cf44faebe24df049c_193_0.png)


    一叶知秋。


    8 月 24 日，这个叫陆韬的学者，和林毅夫一起，总共6 个专家进京，给大领导做汇报。


    达叔推荐过陆韬的作品，林毅夫的经济主张，大家基本都知道。


    所以，一切未来的推演，在聪明人眼里，都是打明牌。不是猜。


    原来摇摆的城市化路线，正在变得更加彻底。


    你要是再反向投资，那就是“最蠢逆行者”。


    资本，放在哲学里去理解。


    达叔这个账号的口号，是让我们一起慢慢变富，每天喊一次，太俗。


    但是，当你一旦把变富、资本等概念，从经济学的范畴，挪到哲学的范畴，就冷的令人发指。


    什么是资本？


    资本就是你过去积累的劳动剩余。'
  - '[PAGE 194]


    这个积累起来的劳动，你可以拿会直接花掉，也就是变成消费品，哲学里叫购买生活资料。


    蹦迪、旅游、泡吧、浪，都是这种。


    除了花掉，你还有一种选择，就是把积累的劳动，变成生产资料。


    所有的经济活动，本质上，都是生产资料行使对话劳动的支配权。


    而一切的经济竞争，本质上，就是一部分人对另外一部分人支配权的竞争。


    这种生产资料，在古代，主要就是土地，在当代是什么，达叔也不方便说。


