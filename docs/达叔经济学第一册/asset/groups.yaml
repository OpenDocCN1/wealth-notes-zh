  - '[PAGE 46]


    首都柏林，才是德国的第一大城市，人口 400 万左右，却只排名 13 名！！


    图表中柏林的价格只是慕尼黑的一半。


    请问为什么？？


    这才是各位对资产感兴趣的朋友，真正该研究的，不要只发泄情绪。


    德国在很长一段时间内，房款控制的非常好。


    但是 2012 年开始，德国从金融危机的泥潭逐步走出，欧洲整体表现一般。


    德国经济最强劲、欧盟的火车头，德国资产受到欧洲所有有钱人的追捧。


    为了走出上一次经济危机，刺激经济增长，利率下降，资产价格上升，房价上升。这一轮新冠疫情的经济影响，看看中国目前的操作，就大概知道未来的走势了。'
  - '[PAGE 47]


    ![](img/d747a49dab77676cf44faebe24df049c_47_0.png)


    数据来源：NUMBEO网站，房价增幅为2012年12月到2018年12月的增幅


    柏林上涨速度最快，6年翻一番。


    所以中国那些以德国房价为崇的文艺青年，不要再异想天开了。


    德国的经济增长速度快，还是中国的经济增长速度快？？


    答案显而易见。


    德国之前可以长期保持房价平稳，是有一定历史原因的，分析任何一个地区，都要掰开来看，看仔细了，自己是否够复制。


