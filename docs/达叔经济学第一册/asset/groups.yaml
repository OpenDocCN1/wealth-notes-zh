    58'
  - '[PAGE 62]


    面临如此情况，请问作为市长的你，如何破局？闭上眼睛，想一会。


    一般来说，其他领导的操作方法，无非几招：


    +   1、印钞，让经济保持流动性。


    +   2、减税，让快死的企业能再坚持坚持，解决部分就业。


    +   3、基建、地摊，让所有人都有事干，不能闲着，闲着容易出事。


    明眼人，都能看出来这几招都有一定的问题。


    比如，印钞权是在中央，地方政府是没有印钞权的，地方政府如何做呢？


    发债。


    地方政府的债务，就是地方政府的印钞机，但是所有市长都知道，所以很多地方政府的债务都是很高的。


    你看看你接手的东山市，原来的地方债务就已经很高了，利息还起来都很难，有其他办法么？搞城投平台借债。


    城投平台公司能干什么呢？


    高科技是肯定干不了的，普通的行业也同样干不了，能干的有一些业务：


