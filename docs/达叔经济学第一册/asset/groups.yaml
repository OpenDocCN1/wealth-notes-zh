    但是，一旦像杭州 2011-2015 阴跌 5 年，不仅房产的原有些意会崩盘，那些你协助过的客户，瞬间就有人要翻脸。


    这几年，大家都赚钱了，所以一片太平盛世，你好我好大家好，但是，一旦资金成本太高，或者政策太紧，导致阴跌或长期不涨，那么这批客户就是这个公司的仇敌。


    会举报这个公司的，就像砸售楼 处一样，恨不得砸死你，这就是这批人狂野的人性。


    中国政府，这么多年来，严肃认真的推动任何事情，第一波就是宣传教育，但是真正的宣传者，都知道一件事儿，讲理论，是没有用的。


    要讲故事。


