    \n同事一下就懵逼了，感慨起来，卧槽？你这个问题，很有意思，你要是这么问，那我真得好好想想，至少先把刀放下来。\n\n达叔问，你现在的情绪，是不是变的很复杂？不是生气，而是好奇？自己的老婆怎么就和他秃在一起了？\n\
    \n这是正常人的正常反应，每个人都是如此。\n\n一般人认为的所有观念，都是可以摧毁的，重建的。\n\n如果你是一个晚辈，对方轻视你，觉得你是个毛孩子，那你就没资格指指点点的，你说的一切都是个屁。\n\
    \n这个时候，如果你还想推销自己的方案，有两个路子：\n\n- 1、自己变强，成为高能量、高势能的家伙，能够在知识储备、财富属性等方面，建立自己的权威。\n\
    \  - 比如达叔在原生家庭、在丈母娘家，两个家庭里，都有一定的权威，四个老人对达叔的方案，深信不疑。\n  - 比如达叔写两个文章，FC#27 新春假期，如何与烧钱的父亲好好聊天，基金金经理，都是建立了自己的权威。\n\
    - 2、自己建权威来不及的话，就借权威之能量。\n  - 比如达叔在文中说的，拉着他们去高能级城市，名义是旅游，其实是推销自己的方案，这个方案是走出去。\n\
    \  - 还可以看看谁是他们的仰视者，拉过来一起聊天，比如村长在干什么，他们身边的有钱人，在干什么。\n\n以达叔的岳父为例，他摇摆那段时间，最后下决定心的原因，就是达叔给他心里种草之后，他回家转了一圈，才发现很多朋友，也都在慢慢抛弃他，都要和孩子进城了。\n\
    \n不要以为你固守在原地，别人也会在原地等你。都是匆匆过客，你想多了。\n\n大家都在追求美好生活。你要固守的小地方，只有一个命运，就是凋敝。\n\n这样的故事，每一天都在上演。\n\
    \n达叔有个朋友，住在上海某郊区，小区里有四户人家，亲热的不得了，达婶很羡慕，说你看看人家多有人情味，一个小区的亲如一家，年年过生日，过节都在一起。\n\n\
    达叔一脸不屑的说，这样的日子，坚持不了几年，就会分崩离析的。\n\n五年不到，有的人搬到了市区，有的换了学区房，有的搬离了上海，有的去了北方，有的去了杭州。\n\
    \n为啥四户人家，去了五个地方？\n因为四户人家，有两户人离婚了。\n要用动态的眼光看世界，你眼前的一切，都是暂时的。\n不要等到自己被所有人抛弃，留下自己独自在风中凌乱，才如梦初醒。\n\
    \n## 第三十篇 FC#29 只有地产，能给高科技公司的结局留点尊严\n\n大家好，我是达叔。\n\n一个想和大家一起慢慢变富的家伙。\n\n今天遇到三波人，感觉到一个奇怪的事儿，俺可能真的红了，至少在小圈子里，红了，像个刚出锅的螃蟹一样。\n\
    \n三波人，样样不同，却都认识达叔，都看我的文章，还都挺神秘的。\n\n1. 中午和年轻有为的富二代吃饭，对方想搞医疗，说了几个医院，说能搞定，请达叔吃饭，问产品，算是读者来对接资源的。\n\
    \n对方家里开厂，踏入医疗行业，是因为疫情，搞了口罩和手套生产，还玩商业地产，非常认可达叔的判断，未来20年，是医疗行业的黄金二十年。\n\n达叔为啥见他？\n\
    \n因为他把达叔近百万字的文章，全读了，达叔的文章絮絮叨叨的，很不正经的样子，能看完，那是真爱。\n\n2. 和达叔的经销商务经理，去拜访医院，在等客户时，对方神神秘秘的问，有个公众号叫达叔经济学，是不是你写的？太牛逼了。\n\
    \n达叔问，你哪里看到的？对方说，是2020年，夏天，一个主任推荐给我的，我看了很久，觉得应该是你。\n\n达叔说，这个客户对你是真爱，把这么好的东西，推荐给你，不容易。\n\
    \n3. 晚上，有个读者来找达叔聊天，某三甲医院的外科医生，达叔说，我正在忙，你有事留言一下。\n\n对方给俺发来一张截图，是和一个视频博主大V聊天，两个人探讨深圳房价，对方就给他推荐了一个公众号，达叔经济学。\n\
    \n他过来和达叔说，你现在真的是红透半边天。\n\n三个人的故事讲完了，俺写了一年不到的账号，在小圈子里，就能有一点影响力，希望能够激励到各位，在坚持输出的道路上，不要轻易放弃。\n\
    \n牛逼吹完了，今天要聊的内容，是俺瞎想的，可能不对，随便看看。\n\n### 1. 结局\n\n达叔和那个富二代聊天，很顺畅，为啥？\n\n因为我要聊的很多问题，在文章中，都有讲过。\n\
    \n比如，他要深入做医疗，我问你，你在开始做之前，就要开始想着如何收场，你这个公司的最后结局是怎样？\n\n对方很开心的说，你文章中写过，结局有三种：\n\n\
    - 1、自己搞上市；\n- 2、卖掉，卖给其他公司；\n- 3、一直干到倒闭。\n\n这是一个组织的解决，搞上市和卖掉，本质上都是找人接盘，一个是卖给大众投资者，一个是卖给另一个组织。\n\
    \n研究经济史的人，思想稍微深邃一点的，都会用动态的眼光去看问题，从来不是静止的，在你低谷的时候，在你辉煌的时候，永远都是清醒的，这一刻，是暂时的。\n\n\
    如果你拿这个问题，去研究组织，甚至去研究个人，都能发现每个人的选择，有云泥之别。\n\n达叔之前写过，中产阶级和富人的区别，就是你手里的东西，能不能传承，是否能经的起岁月的摧残。\n\
    \n你是个主任、是个局长，是个总监，是个上校，是个法官，是个律师，是个医生，等等，看似光鲜，受人尊敬。\n\n但是，请放在历史长河里，动态的去看，这些抬头，全部都是暂时的，是速朽的，是经不起考验的，是无法传承的。\n\
    \n达叔为啥又想起这个事了？\n\n因为达叔在开车回上海的路上，听一个教授讲课，讲的是特朗普谈判技巧。\n\n举的例子是，特朗普要在纽约买一块地，盖特朗普大厦，对方不愿意卖，原因是他不想留一大堆现金给孩子，肯定被糟蹋了，他要把这块土地，签一个租期长达几十年。\n\
    \n达叔听到这里，心里咯噔一下，有钱人就是会玩，知道现金是速朽的，知道纽约的土地是财富之母，是永恒的，是可传承的。\n\n很多医生来找达叔，除了探讨生意，探讨职业发展，第三个主题，就是探讨房产，觉得被唤醒了。\n\
    \n不愿再忙死，累到头秃了。\n\n当你们发财的时候，身家千万、破亿的时候，请记得告诉孩子：你爸妈之所以有点财富可以传承给你，都是因为2020年那场疫情，有个叫达叔的医疗人写了公众号。\n\
    \n当然，还有一些读者，就太过分了，和达叔聊天没几句，就发来一张图，家里的房本有十几个，请你们克制一下，不要刺激俺。\n\n### 2. 高光时刻的选择\n\
    \n达叔之前举过一个例子，讲的是两个公司对比，一个落寞的，一个高光的。\n\n落寞的是重庆力帆汽车，靠卖掉之前的重庆土地，起死回生，继续硬杠，没有那块地，它就倒闭了。\n\
    \n卖掉之后，还了债。在重庆的更远郊，继续买一块地，继续开汽车，没有下牌桌。\n\n高光的是OPPO手机，手机市场竞争惨烈，当年的诺基亚、摩托罗拉、三星、LG，当年都是巨无霸，结果呢？没有超过20年，巨无霸全没了，或租、或卖北京的总部大楼，赚了一大笔钱。\n\
    \nOPPO手机，技术壁垒，核心技术，品牌影响力，比前面几个品牌，何如？\n\n吾与城北徐公孰美？\n\n不如也。\n\n如果不出意外, OPPO 手机大概率活不了\
    \ 20 年, 就可能被下一代技术或品牌干掉, 所有科技类的公司, 命运都是一样的。\n\n来来往往, 生生死死, 最后留下了什么? 主要看高光时刻的选择。\n\
    \n于是 OPPO 在深圳, 在杭州, 在成都, 在重庆, 在东莞, 在很多热点城市, 拼命拿地, 迎合所有地方政府的所谓总部经济, 你们喜欢招商、喜欢兑总部,\
    \ 我就配合给你搞各种名字的总部。\n\n请给地, 给政策, 给贷款, 我要建总部大楼。\n\n这是中国特色么?\n\n不是。\n\n这是全球科技公司的特色,\
    \ 也是所有科技公司的宿命。\n\n我们这代人, 见证了太多公司崛起, 再没落, 迭代太快了, 说国际上的大家可能不知道。\n\n国内的, 早期门户网站、搜狐、校内网(人人网)、开心网、博客等,\
    \ 甚至游戏类的盛大公司等, 很多都被抛弃了。\n\n想到这些, 你再看看现在的当红炸子鸡, 比如 B 站在上海以科技的名义, 斥资 80 亿建总部大楼,\
    \ 比如阿里、百度、华为、甚至抖音的字节跳动等, 全部都在全国各地, 跑马圈地做土地储备。\n\n达叔经常出差, 和大家分享一点感受。\n\n从郑州东站出来，能看到阿里大楼，在上海开车，能看到阿里大楼，去苏州路上，能看到阿里大楼，到了南京，还能看到阿里大楼，去北京，还能看到阿里大楼。\n\
    \n真正懂行的，才知道，中国最大的商业地产商，恰恰是告诉你房价如葱的马同学。\n\n马同学说，阿里要活101年，要跨越3个世纪。\n\n达叔追问一句，101年之后呢？留下一群代码，还是一堆地标、地产？\n\
    \n达叔也不知道，看文章的你，今年几岁了，应该能分清一个简单的道理：\n\n> 好听的和好用的，经常不一致。\n\n达叔所在的医疗行业，同样如此，国内上市的医疗公司，都在玩同样的套路。\n\
    \n昨天，之江生物斥资4.8亿，在上海闵行买楼。\n\n2个月前，在新冠疫情中大放异彩的圣湘生物，斥资3.5亿，在上海莘庄摘基地摘楼。\n\n等疫情结束后，所有因为疫情上了市、赚到钱的公司，但凡没买地、没买楼的，都会后悔的。\n\
    \n业绩会下滑，股价会下跌，生意会暴跌，只有土地和大楼，是实实实在在增值，在关键时刻能救命的。\n\n20年后，以上的公司，大概率或者苟延残喘，或已关门大吉，一个组织和一个人一样，在晚年，是否能体面收场。\n\
    \n你说能量靠什么？\n\n人亦如此，无论你今天的职位是什么，都不可靠。\n\n### 3. 幸与不幸\n\nIT 时代赋予我们这代人最大的诅咒，也是最大的自由，就是信息从匮乏，变成了信息泛滥。\n\
    \n在信息匮乏时代，谁家里有书籍，谁就能当官，能赚钱，能实现阶级翻越，那个时候，统治的一种方法，就是烧书，限制书的发行。\n\n而在信息泛滥年代，很多信息真假难辨，无论你如何选择，都有理论支持你，你都能找到同行者，你混迹其中，走夜路、吹口哨，自己给自己壮胆，混的心安理得。\n\
    \n这个年代，除了过滤信息，对方更牛逼的是，拼命给信息质量兑水，拼命提供奶头乐，转移你的注意力，别研究阶级攀爬了，看小姐姐扭腰跳舞吧。\n\n这是另一种，供给侧改革。\n\
    \n最后，说一个小秘密，来找找叔做自我介绍的一群人里，买房最多的，都是体制内的人。\n\n有钱的科技公司在买楼、买地，有权的人，也在买房、买楼。\n\n就你相信，只生一个好，政府来养老，房住不炒。\n\
    \n你还坚信自己比有钱、有权的人更聪明，你说巧不巧。\n\n## 第三十一篇 FC#30 集中力量办大事，该如何解读\n\n大家好，我是达叔。\n\n一个想和大家一起慢慢变富的家伙。\n\
    \n今天是每月一次的付费阅读，看完后，文末自觉打赏，丰俭由人。\n\n今天出门，见了三波人，两个院长，一个经销商，两个医疗创业者。\n\n两个医疗创业者，一个是上次达叔说过的那个博士，搞医生网红经济的，上次文章介绍过，有几个医生找他合作，特地来请达叔吃饭，说是答谢。\n\
    \n达叔拉了个群，把他引荐给凯叔药械升职记和遇见木叔两个公众号的作者，让他们自己去对接。\n\n凯叔说，我知道你们，你是头条系健康垂直类，头部十大 MCN。\n\
    \n卧槽，达叔净顾着吃饭，听对方吹牛逼了，不知道博士这么厉害，各位有兴趣的临床医生，去抱一下博士的大腿。\n\n这个家伙，是真的能让你慢慢变富，每年增加几十万，是没问题的，还都是阳光的。\n\
    \n另一个创业者是搞癌症早筛研发的，和达叔年纪一样大，聊了两个多小时，会谈、思路清晰，聊完之后，要和达叔合影。\n\n俩大老爷们，在星巴克，我隔壁的小姑娘给咱俩拍照，小姑娘看我俩的眼神，充满了暧昧，那是一种大都市才有的包容与理解。\n\
    \n拍完照，对方问，这照片我能发朋友圈不？\n\n达叔说，长的太丑了，不方便出镜。\n\n心里想，要给读者们留点幻想的空间，alphagirl等姑娘发文章带照片，那是涨粉的，俺一发，仅有的30%女读者，估计全跑了。\n\
    \n两人道别后，看了个新闻，这个公司刚完成亿元 B 轮融资。\n\n达叔猛拍大腿，刚才点的咖啡，应该给对方加个蛋，照顾太不周到，失敬了。\n\n这个公司正在广招销售英才，有兴趣的小伙伴，消化科的，IVD\
    \ 领域的，可以去看看，老板又年轻，又牛逼。\n\n第三个读者，竟然是达叔的客户，级别很高，理想很大，达叔就不透露了。\n\n和达叔聊了很多，DRGs 对民营医院的影响，IVD\
    \ 会不会被集采，第三方实验室面临 DRGs 等措施，是利弊还是利好，等等。\n\n在回家的路上，这叔一边开车，一边想，这三波人，有没有共同的特点？\n\n\
    都认可达叔说的，我们处于黄金年代，都乐观，都在努力集中力量办大事。\n\n这句话，非常耳熟，但是该如何理解？\n\n要分三步走。\n\n- 第一步，如何集中力量；\n\
    - 第二步，什么是大事；\n- 第三步，如何办。\n\n以下内容，是俺瞎想的，可能不对，随便看看。\n\n### 如何集中力量\n\n达叔昨天写了一篇 FC#29\
    \ 只有地产，能给高科技公司的结局留点尊严，很多读者捶胸顿足，卧槽，好像是这么个道理。\n\n达叔再补充一点，今天很多文青痛骂的房地产，不仅是中国的主柱产业，也是美国的主柱产业之一。\n\
    \n> 房地产，在全世界任何一个经济靠谱的国家，都是支柱产亚，这是经济繁荣、人民富足的奖状，不是伤疤。\n\n达叔昨天说，所有的高科技，都是违朽的，很多人不理解。\n\
    \n回顾近五百年经济史，什么是高科技？\n"
