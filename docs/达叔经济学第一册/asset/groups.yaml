    \ 10 亿，中国城市化还\n\n有十年以上的路要走，前途无限。\n\n关注 大叔经济学，让我们一起慢慢变富。\n\n## 第二篇 FC#2 美股暴跌，会影响中国的房价么？\n\
    \n### 一、美股连续发生熔断，和疫情有关系么？\n\n肯定是有关系，但疫情只是一个小小的导火索。\n\n我们不能把第一次世界大战责任都推在萨拉热窝上，对结构性矛盾视而不见。\n\
    \n换而言之，即使没有这疫情来捅破吸了十年的泡沫，几乎所有人的预期美股无以为继，最多坚持到大选之后。\n\n在疫情的加持下，出现熔断，且多次大幅度下跌，国运已尽的象征。\n\
    \n当中国发生疫情的时候，A 股和全世界的股票稍微波动、比较稳定，说明世界对中国控制疫情是充满信心的。\n\n但按照欧美目前这个装傻充愣的尿性，能通过媒体骗得了普通民众，可骗不了掌握真实数据的大财阀。金融的涨跌本质是对未来的预期，目前来看，只有越演越烈的趋势，继续发生金融踩踏也是正常的。本来一个预计大选后软着陆的事，活生生被一个蝙蝠给搅黄了。\n\
    \n### 二、会影响中国房价吗？\n\n会。\n\n但美股熔断对中国房价的直接影响比较微弱，因为中国目前坚持房住不炒，而且限购、限贷、房票、户籍等政策，坚持\
    \ 3~4 年几乎没有松绑，这需要一定的政治定力。即使是在经济增长率从 8% 换挡到 6%，\n\n也没有动摇。\n\n中国到目前为止，金融对外开放程度并不高，这也是美帝等西方国家不满意的地方之一。虽然贸易战\
    \ 后，有进一步开放的趋势，具体程度还需要观察。\n\n全球的资金现在急需避险，美欧金融市场现在都靠不住，日本自身难保，韩国体量太小，只有中国体量和质量足够。\n\
    \n各位可以期待黄金市场和中国 A 股市场的态势，如果外资进来被 A 股给割了韭菜，那么也算是为中国上市企业做贡献了。中国目前的住宅不是你想买，想买就能买的。接下来就看商业地产领域了，比如黑石团购斥资\
    \ 40 亿美元现金 +47 亿美元债务，总额为 87\n\n亿美元购买了潘石屹的 SOHO。\n\n这规模的资金，买普通住宅，该买到啥时候？肯定是要购买中国企业发行的企业债、股票等。\n\
    \n有时候钱很多，找出路，也是一个麻烦事。\n\n当优质投资渠道少的时候，有钱人才是真的的痛苦，持有现金的话，每年 10%以上的贬值。\n\n### 三、那么中国的房价在疫情后不涨了？\n\
    \n有句话比较流行：短期看金融、中期看土地、长期看人口。\n\n伴随着大湾区、长三角一体化、国家级中心城市等政策的开展，未来中国楼市肯定呈现逐步分化的趋势。\n\
    \n很多人会问，中国房价有泡沫么？\n\n有，但这个泡沫在三四五线房价都近万的城市，有下跌的风险。一线城市、强二线城市，省会城市等，疫情后，仍是最终能跑赢通胀的优质资产。\n\
    \n人和人最终的区别，就是战略选择的区别，道路选错了，多努力都白费。\n\n### 四、疫情对房价的影响。\n\n即使没疫情，自从 2016 开始在全国各地执行的楼市限购政策，中央坚持房住不炒政策之下，给地方政府留了一个“因城施策”的小口子。\n\
    \n上海、北京、南京、苏州等一线和强二线城市在积蓄了三年的购买力之后，都预期春节后会出现一个小阳春，疫情前的成交数据能够看到复苏的势头，但被一场疫情打断了。\n\
    \n疫情期间，包括苏州、南京、杭州在内的数十个城市在陆续出台了以人才落户、土地资金暂缓等方式，温和救市。\n\n伴随着新一轮号称 N 万亿新基建，货币贬值是大概率事件。而降息和\
    \ LPR 转换又引发了人们的关注。如果不出意外，疫情后楼市会发生微妙的变化，但不会再出现暴涨了。\n\n### 五、新基建的长远影响。\n\n新闻放出来的\
    \ 13 个省市新基建项目投资 37 万亿，投资的都是高科技行业。\n\n货币就是水，不论你开始的时候往哪个方向喷，最后都会流向一个方向。\n\n所谓 “科技赚钱、金融炒钱、房产存钱”，如果你理解不了，一起思考下：\n\
    \n新基建项目出来了，你是华为的 5G 工程师，一年赚 100 万，现在没房，请问你接下来买房么？\n\n你是高铁的高级工程师一年 80 万，现在住在小房子里，疫情期间一家人窝在一居室，请问疫情后你想改善住房么？\n\
    \n你是人工智能、工业互联网工程师，一年赚 60 万，疫情结束后会给自己换个三居室把父母接过来住不？\n\n所有的新基建行业都会造就一批新的富人，这些人除了给自己换个车、旅游之外，还能怎么花掉这些收入呢？唯一能够贮存你的财富的只有房子。\n\
    \n### 六、租房同权的破灭。\n\n疫情期间人们的切身遭遇，彻底打碎了一个推了两三年的美好愿望—— “租房同权”，那些在城市里没有房子的租客们，面临回不去、又难、房租涨价等。\n\
    \n无论是经济还是自尊都受到了冒犯。等疫情后，这批人中会出现坚定的买家。\n\n近期股市也是蠢蠢欲动，涨涨跌跌的很是刺激，一般楼市大涨都是在股市破灭，一批新的韭菜被彻底教育之后，才会老老实实的买房子。\n\
    \n达叔以后会陆续讲解：\n\n土地财政、租售比、城市选筹、板块选择等问题。\n\n关注达叔经济学，让我们一起慢慢变富。\n\n## 第三篇 FC#3 疫情之后，普通人要拥抱股票还是房产？要拥抱善人性的资产\n\
    \n在全篇开始前，达叔先来介绍投资界一直有个理论，资产有三性：收益性、安全性、流动性，号称三角不可兼得。\n\n![](img/d747a49dab77676cf44faebe24df049c_12_0.png)\n\
    \n楼市、股市和债市，三个资产品类中，债市尤其是国债由于安全性很高、流动性也不错，收益性一般，甚至跑不赢通货膨胀的速度，关心的人较少。\n\n达叔今天就应部分粉丝要求，主要探讨股市和楼市。\n\
    \n如果从安全性和收益性来讨论，每个人的认知不同，难免众说纷纭，难以达成一致，达叔就挑一个各位普通能达成一致的流动性来讨论。\n\n楼市和股市，谁的流动性更高？毋庸置疑，肯定是楼市的流动性更高，一个股市软件，手指动一动，就可以买卖了。\n\
    \n除了交易时间极大缩短外，交易费率股市也比楼市的费率要低很多，楼市的各种契税、中介费，一次交易成本从几万到几十万不等。\n\n那么达叔来说一个理论：“用流动性来换取利润”，你看是不是高大上？他的另一个名字，本质上就是巴菲特的“价值投资”，选准标的，买入、长期持有。\n\
    \n到此，达叔就要开始探讨一下人性的弱点，面对同样一个资产标的：\n\n如果是一支股票，连续两个涨停板之后，第三天回撤 5%，第四天涨停，第五天回撤 8%，第七天涨停，来回跳动大半年，涨涨跌跌螺旋上升，你能坚持拿在手里面多久？\n\
    \n而如果是 一个房子，你付款之后，如果是新房，你两年左右才拿到不动产证。如果是二手房，等你流程走完，加上部分地区对二手房限售政策，怎么着也要两年以上，有的时候，不是你主观上想要持有，是整个资产属性决定的。\n\
    \n达叔讲一个亲身经历得案例：\n\n2016 年 10 月，杭州，达叔想在杭州投资一套房产，G20 刚刚结束。\n\n之前 2011 年-2015 年，杭州楼市经历了一场长达\
    \ 5 年之久的阴跌，达叔判断杭州应该时机已到，拎着钱袋子，从上海开车入杭，准备入手一套。\n\n研究了一段时间，选定钱江新城，在中介局与一户人家签了合同、付了五万定金，开心回沪。\n\
    \n当时房子总价 200 万左右，记住这个价格 200 万，记住这个时间点 2016 年 10 月初，G20 刚结束。\n\n卖方是一对小夫妻，女孩子怀孕了，才发现老公竟然结过婚，住的房子在房产证上竟然还有老公前妻的名字，这哪里要的，温婉的姑娘，每天以泪洗面，哭着喊着即便不离婚，也要换房子。\n\
    \n房子当年是男方爸爸买的，所以要经他们家庭会议讨论一下，这一讨论的时间，杭州房价经 G20 刺激，一路狂涨，越涨卖方越犹豫，然后毁约，房子不卖了。\n\n\
    一年后，达叔后来看了一眼当时选的那个小区，基本上翻了一番，400 万，一年涨了 200 万左右。\n\n所以每次谈到流动性时候，达叔就想提一下这个案例，如果当时是债券或股票，可能就波立马抛售，很可能就与这波上涨无缘了。\n\
    \n有人会反驳，卖掉我再买回别的，即使再买别的，股市从 3000 点涨到 6000 点，你摸着自己的胸口，你敢一直跟么？\n\n如果你敢一直跟，那达叔再问一下，你敢加\
    \ 3 倍杠杆、且一直跟么？\n\n房子，除了居住属性外，还有金融属性，甚至对于很多人来说，有可能是这辈子最大的一笔金融属性投资。\n\n200万的房子，房票优质的话，可以付3成、贷7成，如果当年大叔在杭州能够有幸买下，涨200万的资金变化是60万变成了400万，即使扣掉贷款成本140多万，60万变260万左右，这就是金融杠杆的左右。\n\
    \n国家银行体系对个人的大额金融支持，利率极低的资金政策仅限于此。很多人不用，甚至是全款买房，大叔就不做评论了。\n\n而这一切都是建立在楼市居住属性和投资属性基础上的，你能抓住，是这项资产的低流动性，阻止了你做傻事。那么楼市的流动性真的低么？如果你要是只看买卖关系的话，那流动性是低。如果你的思维再拓宽一些，把他看成是你的资产包，看成一个变现的工具，那流动性是不错的，在银行体系里，目前最认的资产也就是房产了，无论是对个人，还是对企业，各种贷款产品的第一抵押品。\n\
    \n最后，大叔想讲的是：楼市的普惠性。\n\n很多人都认为中国的房产过热了、泡沫了等等，大叔以后会专门论述，无论是横向从国际上比较、纵向从时间上比较，中国的房地产都比较健康。\n\
    \n之所以调控，是中国政府全心全意为人民服务的体现，在踩着刹车片，等更多的人上车。\n\n楼市是保护中产阶层不被富人阶层甩开太远的利器，是阻止社会贫富分化的利器。大叔这么说，很多人肯定是反对\n\
    \n的，污名化房产行业在中国已经成为了媒体小编和白领们的政治正确。\n\n但如果你仔细想一想，富人阶层的资产主要构成是什么？尤其是亿元以上身家的，遑论十亿元以上级别的富人，他们的主要财富是各大公司股权，财富在股市里，楼市对他们来说反而是小头。\n\
    \n以 2008-2009 年全球金融危机为例，美国经济刺激后的绝大部分钱流向了股市，导致的结果就是美股长达十年左右的繁荣，而中国的资金最后主要流向了楼市，导致了中国两轮楼市繁荣。\n\
    \n那么问题来了，股市的繁荣是庶民的繁荣么？绝大部分人不炒股的。\n\n在美国股市里绝大部分是富豪阶层和金融机构，散户占比很小。\n\n即使中国，股市机制没健全的情况下，大量资金流入股市，无论是\
    \ 2007 年还是 2015 年，两次股灾，无数普通家庭不仅没吃到肉，没喝到汤，甚至连碗都被人家砸了。\n\n幸好流向的是楼市，以中国城市居民为例，绝大部分家庭家里都是有房子的，只是一套还是多套的问题，那么楼市的涨，相对股市来说，就是对人民具有普惠性的。\n\
    \n那么有没有人吃亏呢？有的，不看法叔文章的人，以后还会继续吃亏。\n\n## 第四篇 FC#4 93 年女生拥有 400 栋楼事件是真是假？\n\n今天是五四青年节，达叔写这个账号之前很少蹭任何热点，但今天看到一个全网讨论的热帖，实在受不了了。\n\
    \n达叔作为长期的房产投资者，看完直接就懵逼了。\n\n1、广州作为北上广深一线城市，限购房贷是假的么？\n\n因为楼市里所有投资的玩家最关心的就是房票、房票、房票。\n\
    \n即使是开创了水库论坛的欧成效等一众水库大神，衍生出的众多流派以及科技树，也是围绕房票和贷款、流水展开的。欧神在离婚之前，几十年的积累，房产也就数十套。\n\
    \n开宗立派、一战封神的欧成效估计看到 93 年的小姑娘，在广州，400 套，不对，是 400 栋，估计立马就跪了。\n\n我们先来看一眼广州历年的限购政策，限购从\
    \ 2010 年开始的，2013 年加码，正好是小姑娘开始号称买房的那一年，达叔很好奇，买完之后，是如何破限购的呢？\n\n结婚离婚大法？2013 年，小姑娘\
    \ 20 岁出头，这离婚证得叠起来得比人还高了吧？\n\n民政局 VIP 白金卡客户啊。\n\n找人代持？代持人、代持合同，这些环节都是极其谨慎的，有巨大风险的，那心也是够大的。\n"
