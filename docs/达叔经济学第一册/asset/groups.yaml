    ## 第二十五篇 FC#24 制度是用来遵守的，还是用来挑战的？


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    今天被网友（沈亦周）拉去虹桥机场，得到大学的上海办，听了一场《亲密关系的四个飞轮》，他和他太太联合分享的。


    也是一对撒狗粮的夫妇，分享的内容也很有意思。


    为防止侵犯版权，俺就不剧透了。


    沈老师在分享过程中，每每尝试从最底层的逻辑，去拆解亲密关系，这个拆解的过程，引起了达叔的兴趣。


    比如，在传统亲密关系中，维系的一般就是爱和性，两个维度。


    但这两个维度，又存在着内在冲突和挑战。


    爱，这个玩意，看不见摸不着，科学家说是分泌多巴胺，产生的幻觉，幻觉让人快乐。保鲜期一般只有18个月，最多也就2-3年，然后多巴胺就不怎么分泌了。


    而性，这个玩意，大家都懂，男人本身就带着到处播撒基因的天性。


    于是，这两者之间，就冲突了。


    那该如何化解这个冲突？于是就有了《亲密关系的四个飞轮》，据说是沈老师自创的，有兴趣的可以找他去学。


    结束，握手合影，下楼，取车，准备回家。


    刚好，有医学生来问达叔，她的职场该如何取舍，平时很多年轻医生，都有这个困惑。


    两个事儿撞到一起，就有意思了。


    达叔尝试梳理一下，可能不对，各位随便看看。


    ### 1. 制度是用来遵守的，还是用来挑战的？


    前面开篇，达叔貌似是在分享亲密关系，爱情之类的，其实呢？


    是在讲人生伴侣，在讲婚姻。


    而婚姻这个玩意，沈老师说，200年前，都是血缘、财产制度的衍生品，是以财产制度作为基础的。


    近200年，在中国估计才几十年，婚姻是以爱情为基础的。


    爱情是一件奢侈品，不是每个人都能拥有，拥有之后也未必能够驾驭的。


    于是，非常不稳定。


    很多家庭，明明不幸福，爱情早就木有了，但还在继续苟且，归根到底，还是血缘和财产制度，在发挥余热。


    全国都知道上海的房子，是优质资产，但很多外地人，并不知道，外地人单身在上海，即使准备了一麻袋的钱，破限购也得满足结婚这一条。


    ![](img/d747a49dab77676cf44faebe24df049c_217_0.png)


    你说这制度合理么？侵犯人权么？


    达叔不知道，也不敢问。


    但制度就是这么设计的，你说你是顺着规章制度往下玩呢？还是要去挑战一下？


    反正达叔好多年前，牛逼哄哄的，对居住证这个制度，轻视过，唾弃过，后来啪啪啪把脸都打肿了。


    很多制度，设计出来，就是让人服从的，不是让你挑战的。


    你服从，就给糖吃，不服从，就把你彻底打服。


    教育制度、户籍制度、积分制度、财产制度、婚姻制度，甚至包括各个城市的汽车牌照制度，都是如此。


    你反对？


    你怎么反对？你找谁反对？去办事窗口摔热水瓶么？


    有个毛线用。


    所有神仙没法管的东西，都有一个名字，叫做妖。


    你胡闹，就是作妖，没人搭理你，你就是把办事窗口炸了，制度还是制度。


    年底了，很多公司，要开始发奖金了，也要制定2021年的奖金制度了，调皮捣蛋不跟着奖金制度走的，马上就要傻眼了。


    都是同一个道理。


    ### 2. 见识


    那达叔为啥要聊这一块？


    因为今天谈者的问题，面临的是人生最大的一个选择，一旦选错，基本就废了。


    外地户口，未婚，女，研究生，不想读博。


    要不要留在北京？要不要去做医生？要不要北京户口？


    在北京，目前只能找到三甲医院急诊科的工作，到外地，能进专科。


    小姑娘，头脑还算清楚，觉得要留在北京，城市大于职业，这个见识，不是每个人都有自己的。


    你们也别和达叔杠，一杠你们就是对。


    达叔聊的不是地域差别，而是人域差别。


    达叔一路从小地方拼杀出来，知道人才济济，和人才凋敝，分别是啥样的。


    来上海后，达叔几乎没有一天，敢懈怠，身边的人，一个比一个牛，见识一个比一个厉害。


    就像今天这样，拆解亲密关系的课程，你在小地方，去哪听？


    上网？


    你怎么链接到真人？怎么建立信任？怎么产生合作？


    每往前走一步，都是困难重重，任何一步，都有可能是你再也无法翻越的门槛。


    有一次，达婶在泡茶，达叔和她聊见识的事儿儿，我说，你知道我刚来上海时候，谁给我的帮助最大么？


    达婶说，难道是我？


    达叔说，不是，见到你的时候，我的见识已经涨了很多。我最感激的一个人，叫彪哥，是我的大学同学。


    因为他带我第一次做地铁，第一次使用银行ATM机，等等，无数个第一次，在城里人看来，都是最基本的见识，而我啥都没见过。


    那他是上海的么？


    不是。


    他是杭州的，他爸是杭州的公交车司机，但见识仍然比苏北农村的，要高出很多倍。


    再比如，后来，达叔的第一份工作，是搞高端会务的，天天和西门子、花旗银行、可口可乐、通用汽车等公司高层打交道。


    出入都是五星级酒店，接待都是成龙等明星，你说赚到啥大钱了么？


    穷的跟鬼一样，完全没有医疗行业赚钱。


    但是，彻底打开了见识。


    举个例子：


    人有三急，一般人都是找公共厕所，找肯德基，达叔首先的反应是，看看身边有没有五星级酒店。


    如果没有这段经历，俺是绝对不敢有这个想法的。


    我们平时遇到很多人，你从他们身上的气场，基本上能判断他的财力，除了演技突出的骗子，大多数是能看出来的，至少穷人还是富人，能判断出来。


    有些人，穿上龙袍，都不像太子。


    小姑娘提到一个细节，才是达叔想分享的主要原因，这个细节是北京户口和编制。


    如果是早十年，她来问达叔，那时候达叔肯定告诉她，这都哈哈玩意，一点都不重要，要自由，要翱翔。


    但最近这些年，要么是达叔被社会给爆锤了，要么是体内分泌变差，总之，从倾向上，变得越来越保守。


    每次看到知乎上，还有很多热血青年，刚留学回来，父母让混个上海户口，却嗤之以鼻，达叔就在心里大骂，这帮货读书读傻了。


    这玩意，你看不上的东西，在黑市上价值上百万，没了这玩意，不让你买房，不让你孩子上学，不让你用一大堆你未来想用的东西。


    这不是一个户口的问题，是对方一整套利益分配的抓手，是划分资源优先级的依据。


    为什么要划分？


    因为好东西，太少，不够分。


    但在不懂事的家伙看来，这是腐朽的，是落后的，是该被唾弃的，看不上的。


    这是幼稚病，没被社会爆锤过，有知识，却没见识。


    即使它是错的，只要它一天没改，你敢逆着来，都是要被揍的。


    比如，你很难想象，全面放开二胎的今天，达叔仍然能收到，独生子女光荣证，独生子女费申领登记，之类的短信。


    这种黑色幽默，让人哭笑不得，但这就是现实。


    ### 3. 选择


    达叔最近几年，一直在华东到处跑，出差到各个城市，除了工作，就是买当地的地图，研究山川形便，研究人口，研究产业，研究经济增长和财政体系。


    为什么？


    因为这些东西，比你出去喝酒打牌，好玩多了，无论是对你的投资，还是对你的谈资，都有巨大的利好。


    而且，研究地图，也是有讲究的。


    比如达叔上周从昆明飞回上海，起落的时候，从窗外外面看云南，你只要看一眼，就知道这个地方，经济肯定是困难的。


    你再买一个3D的立体地图，你就知道，为什么长三角会富裕，为什么四川在历史上经常可以独立。


    ![](img/d747a49dab77676cf44faebe24df049c_221_0.png)


    具体到个别城市，以南京为例。


    所有的城市规划，都是有山川形便，作为约束条件的，你把山、江、湖、铁道、机场、军区等标出来。


    ![](img/d747a49dab77676cf44faebe24df049c_222_0.png)


    南京，看着很大，但真正能拉开阵势、好好发展的土地，有的选么？


    就在红框里，这种选择，不会因为任何人来当领导，而发生变化，除非他脑子坏掉了。


    各位可以根据同样的逻辑，去推演自己感兴趣的城市，大概率是对的。


    城市选对了，板块选对了，大概率就不会错，有人在楼层、朝向上废了半天劲，结果城市和板块选错，都是跑偏的。


    不要只看热闹，要沉下心，去研究数字，去研究背后的东西。


    比如，南京和杭州，谁在新闻传播领域的名声响？互联网小编们都快把杭州吹上天了。


    但在过去10年，表现：


    - 2010年，杭州全国第8，南京第17；

    - 2020年，杭州全国第9，南京第10。


    房价你觉得是南京高，还是杭州高？有兴趣的，可以去查一下。


    就如同一个销售，努力很重要，赢赚更重要。在错的赛道上，废了半天劲，肯定是赚不到钱的，因为错的赛道，整个行业都在衰退。


    别人的细分领域每年增长20%多，你每年增长-3%，你再牛，赚个毛线钱。


    好的赛道，就像高能级的城市，增长迅猛，人口持续流入。


    只要还有新的土地，地方官员，就没有动力，去做旧城拆迁和改造，一座座新城崛起，成为新的权贵聚集地，这是必然的。


    部分旧城，产品价格开始分化巨大，未来会进一步衰落，这一点在无数个城市，都在上演。


    任何人的任何理论，都是有前提的，都是有约束条件的。


    比如有读者来问，是不是要去某城投资，达叔首先问的是，你的资金体量是多大？


    读者说，首付200万。


