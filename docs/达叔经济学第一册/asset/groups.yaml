    于是，有了这一篇文章。


    ## 电影院的本质


    电影院可能没必要，但是肯定不是被电脑取代。


    达叔看了一些答主从艺术的角度、观影效果、仪式感的角度来，肯定都是对的。


    达叔尝试从感官和经济的角度来陈述一下：


    有人把电影称之为：绘画、雕塑、建筑、音乐、文学、舞蹈、戏剧之后的第八大艺术。


    这些所有艺术，都是工具，目的是：对人的感官提供刺激。


    如果从这个视角来看，人类的进展方向是口味越来越重的，从单方面的视觉刺激、语言刺激、听觉刺激，到电影全方位的刺激，那么电脑相对电影来说，在感官刺激层面，是前进了还是倒退了？


    肯定是倒退了。


    单凭这一点，电脑就无法取代电影院，因为相比微不足道的电影票钱，人的感官刺激更重要，这个是一有一定成瘾性的。


    这个“成瘾性”就导致了经济学上的“价格弹性”变得偏刚性，尤其是出了好片时，达叔是一定要到电影院里好好爽一下的。


    ## 微妙的社交场所


    何况，电影院对很多青涩的年轻人来说，还是最微妙的社交场所。


    男生女生能不能一起看电影，成为关系能否进一步的关键。


    这个刚性需求，短期内不会被任何场所取代，当然差点毁在了陌陌手里。


    在疫情的末期，这个场景也会有所改变。


    电影院开门，如何确保安全，有一定的特殊要求。


    文件要求，经批准复工复映的影院要对放映场所进行全面消毒，洗手间等场所应配备洗手液或消毒用品，公共区域每天消毒不少于 8 次，每个影厅每部影片放映结束后须彻底消毒一次，并进行通风。


    广受欢迎的“隔排隔座”观影也被点了名。指引指出，复映初期一定时间内，应按隔排隔座售票。看来，看电影的情侣隔排而坐已经成为了可能，一些网友也表示，“隔排隔座观影”为我们单身狗出口恶气”、“想看看情侣隔一个座位坐的场景”、“情侣约会就和单身一样，无差别袭击”。


    最后，江湖上有一个理论叫：即时满足 PK 延迟满足。


    虽然在理财、致富、成长等层面，延迟满足有很大的优势，但是在消费娱乐、社交属性很强的电影领域，院线上映的及时性、有效增加了谈资、社交，甚至是影评人引领时尚和话语权的生产手段。


    加上媒体、社交软件、身边小伙伴玩梗，玩的也是个即时性。


    当然你要是在电脑上看盗版，来满足即时性，甚至看一些没在国内上映的外国大片，嗯，你说的很对，但毕竟是小众。


