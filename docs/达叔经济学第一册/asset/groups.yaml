    因为房产这个东西，有笋盘。


    每年都有各种小老板破产、家庭离婚分财产、出事被抓、准备移民、突患大病等等的各种急需资金的单子出来。这种单子第一时间肯定是被中介获得。


    由于对当地整体的楼市平均成交价、火热程度都心知肚明。


    这才是个真正赚钱的机会。


    第一、有能力判断是不是笋盘；


    第二、有资金能够拿下笋盘。


