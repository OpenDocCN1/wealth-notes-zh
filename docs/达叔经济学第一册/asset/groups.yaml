    # 第五十四篇 中国最好的学生，可能走上邪路了


    经常看达叔文章的人，知道达叔很少去分析宏观，但今天看到知乎上一个关于越南的帖子，忍不住写了一点。


    - 越南 国际贸易 欧盟联盟（EU） 自由贸易协定（FTA） 中越关系


    ### 欧盟-越南自由贸易协定正式通过对越南有什么影响？


    这两天看到消息“欧洲议会通过对欧盟-越南自由贸易协定，越南成为第二个与欧盟扩大自由贸易的国家。”英国刚脱欧，越南就进港，别人都说英商在下一盘大棋（...展开全部
    v这个题目。


    达叔的答案如下，供各位参考，算是一个小的分析问题的框架。


    在研究任何经济决策之前，一定要先看看这个经济体的地理位置、历史、人口结构和资源约束。


    ### 地理位置和历史：


    越南是典型的东南亚、发展中国家，背靠中国太近，中国穷或弱的时候，它日子可能会好点。


    中国一直说自己是一个友善温和、不尚武力的文明型国家，绝大部分的网友也是这么认为的。


    但是中国周边任何一个国家，都不这么认为。


    翻开周边所有国家的历史书，几乎都是一部挨揍史，被谁揍？


    千百年来，很多国家动不动就挨揍，达叔只能说道，也不敢问。


    现在中国又崛起了，你让周边小国不担心，那是可能的。


    小国的立国策略，自古以来，都是“间于齐楚”。


    达叔开公司，要是怕隔壁青龙帮来抢，策略是什么？


    1、请青龙帮入股，大哥不劳您动手，一人一半，主动给；

    2、请隔壁的竹帮入股，大哥，我钱包里的钱，大部分是您的，关键时刻，青龙帮要是想动粗，您得照顾一下。


    看来，最近一次挨揍是青龙帮打的，又是竞争关系，那越选择第二个方案了。


    那达叔，你咋不报警？


    国际经济领域，没有超越主权国家的终极暴力机构，要是能报警，帮忙把报警电话告诉达叔或越南方一下。


    这个九段线，都划到人家餐厅门口了，是不是也没人敢管？


    ![](img/d747a49dab77676cf44faebe24df049c_450_0.png)


    ### 人口结构和资源约束：


    2019 年 4 月 1 日，越南人口普查结果：96208984 人，近 1 个亿。


    东南亚排名第三，规模相当于一个河南。


    城市人口占比只有 34.4%，绝大部分还是农民。


    越南近些年的发展，几乎就是中国最好的学生，儒家文化圈，人口红利，一党执政，从农业国开始向工业国攀爬。


    充分利用廉价劳动力，成本优势，比较优势，低人权优势。


    大力吸引外资，办厂，吸纳劳动力，加工贸易。


    日本---四小龙---四小虎---中国大陆，现在轮到了越南。


    ![](img/d747a49dab77676cf44faebe24df049c_451_0.png)


    这个图是当年日本国给自己规划的工业转移路线图一一雁阵模型。


    计划赶不上变化，想的挺好，没料到的是四小虎是付不起的阿斗。


    中国这个巨兽又崛起的太快，人力、土地、资源成本都高之轮。


    轮到越南抄作业了，越南在全球范围内，抄的特别好，在小国内，一枝独秀。


    这是经过社会化改造，打下的基础。


    达叔在这里，说一个经济学上的结论：


    所有的发达经济体，理论界都说喜欢自由，喜欢民营经济，不喜欢国企、不喜欢政治僵化。


    但是外商来投资的时候，看看真金白银都投哪?


    中国民营经济最好的是不是浙江？浙江的民营经济肯定比江苏好吧？


    为什么欧美外资绝大部分都投了上海、北京、苏南地区？


    嘴上说不要，身体很诚实。


    转回来越说越南。


    巨额外商投资越南，看上的你是儒家文化圈里的人民，吃苦耐劳，战斗力爆表。


    更看中的是你社会稳定有秩序，不用政局动荡，天天换领导，朝令夕改没保障。


    出事，能稳住，不被民粹裹挟、不会动不动就拉着横幅上街浪。


    乱改，会被反噬的。


    中国早期改革开放坚定执行三外路线：


    外资、外贸、外汇。


    但中国之所以能玩的溜，玩的久，别人都玩的半身不遂，最重要一条是什么？


    是外汇管制，进来的钱，不能随便走。


    说到这里，是不是想起来某个县长和王健林的对话了？要长期发展这个县，那个县长做的没错，正因为没错，王健林才生气的。


    但悖论又出现了，王健林为什么一个县不让他走，他生气了，那就不过了，谈不拢。


    但是国家不让王健林出去乱投，他就乖乖听话了，全线收缩了，不仅仅因为政治原因。还因为中国市场足够大，池子里的水足够多，赚的钱继续投，还有很多生意机会。


    看在能继续赚钱的份上，外汇管制就管制吧，反正拿出去也没更好的地方投资。这是很多国外大资本来中国投资，接受了比较苛刻的条件，也能忍受的原因之一。


    看在钱的面子上，很多问题都不是问题，如果还是问题，那就是金额不够。


    但是越南这个小池子，能满足大资本的要求么？大概率是不能。


    不能持续下蛋的鸡，很多时候会被杀掉的。


    泰国、印尼等 97 年前都是经济红火了好十几年，资本自由出入，索罗斯为代表的游资发起攻势，一招毙命，瞬间打回原形。


    越南太激进地改革，放弃外汇管制的后果，目前来看没几个好下场的。


    下面来看规模：


    - 2018 年，越南 FDI 规模 255 亿美元，真正落实的有 191 亿美元，相当于 2018 年中国的 15%，考虑到规模和体量，越南每单位 GDP
    的 FDI 能力是中国的 8 倍。


    所以，各位不能轻易嘲笑小弟。


    小弟虽然小，但是嘲笑小弟的老大，一般没啥好下场，平时还是要客气点。


    一百多年前，被小弟打过两次，不能刚爬起头，就又嘲笑另一个小弟了。


    中国对外资的策略是什么？


    8个字：积极、合理、有效利用。


    具体到执行层面，还是8个字：


    利用、选择、限制、引导。


    不是什么钱都要的，来撞工厂，搞生产的，几年免税几年税收减半，都可以谈。


    要来搞金融、资金空转的，不好意思，不缺这个钱。


    欧美一直在施压，中国一直在拖延。


    对经济有长期观察的小伙伴，中国在今年4月也在金融开放迈开了步子。


    越南这一招，学习了么？


    之前一直在学习。


    但越南面对金融开放，能抗多久？手里的筹码够么？


    这次应该是扛不住了。


    为什么？


    因为想发家致富，手里筹码又不多，只能赌了。


    ### 欧盟—越南自由贸易协定对越南经济当前的主要影响：


    一、加剧产业结构不平衡：


    - 农业相比工业和服务业增长几乎停滞。

