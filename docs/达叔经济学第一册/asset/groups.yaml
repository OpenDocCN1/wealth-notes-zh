    也就是说，除了西南成渝加双雄，在中部武汉几乎是是没有对手的，郑州、西安、长沙等，都不是一个数量级的。


    如果你把高校教育这块放进去，武汉更强。


    历史上重要，现在重要，未来更重要。


    中国投资了那么多真金白银，全球大公司投了那么多真金白银，武汉对整个湖北的人口虹吸，是彻底毋庸置疑的。


    除了人口规模、政治地位、更重要的要看货币。


    普通人在2020年，只看到了湖北疫情，只看到了万众一心，只看到了感动。


    达叔盯着数据看的是，湖北损失了什么，国家给湖北提供了多少资金，提供了多少政策支持，提供了多少税收减免，这些政策有哪些，一直到2021年，仍然在继续执行？


    这个思考的路径，才是最重要的。


    为国家做出贡献的城市，一般都会得到相应补偿，尤其是人命关天的，武汉现在不仅仅是中国的一个普通城市，他现在担负了一个重要的使命，向世界去展示，新冠疫情冲击之下，变的更强。


    这是一个窗口，当2021年，所有城市都被带上紧箍咒的时候，武汉在国家级中心城市里，肯定是一个被偏爱的孩子。


    武汉解封之后，有一个湖北的家伙，到上海见达叔，要做医疗的生意，是一个姑娘，搞政府媒体的。


    达叔问，你在武汉买房了么？


    姑娘说，正准备买。


    达叔问，为什么？


    姑娘说，我工作接触到的那批人，厝过拔毛，家里现在全都是大把的现金，钱太多了，他们让我弄点豪车去卖，但是我觉得，他们不会买豪车的，最后只能买房子。


    那天是一个中午，我们在咖啡厅聊完，送她走的时候，达叔就在想，这个小姑娘，未来肯定要赚大钱的，因为她看到了一个更大的世界。


    > 在疫情期间，别人只看到了悲伤，她看了更豁达的世界。


    等她见过，她就不相信书本上写的那些东西了。


    这一年，她26岁，她没有浪费一场危机。


    关注达叔经济学，让我们一起慢慢变富。


    ## 第三十九篇 PC#39 不要去干别人看一眼就懂的生意


    大家好，我是达叔。


    一个想和大家一起慢慢变富的的家伙。


    昨天出差，来了某省会，有点失策了，遇上五一假期，明天回家的火车票，差点没买到，这要是耽误了回家，估计达婶那边就解释不清了。


    在知识星球里，发布了一下行程，约了几个潜在的医疗人，谈合作，不见面还好，大家都存在幻想。


    一见面，竟然发现对方是医疗行业的省市级管理单位，其配偶还是我们的客户，某重点目标科室的。


    见完，对方问，一直以为你是那种油腻干练中年男，没想到，还是个温润如玉，才貌双全的小伙子。


    你们那些在朋友圈里夸达婶、惹达叔的家伙，好好学习一下，这就是中国体制内，优秀共产党员、国家的中层干部，对达叔的评价。


    就这评价，连达婶都说不出口，目前能把俺夸成这样的，除了这位读者，就剩达叔的女儿了。


    这次过来，两天时间，见了7个人，聊一下关于赚钱的感慨。


    以下内容，只代表个人观点，不一定对，随便看看。


    ### 1


    首先第一个感慨，是我昨晚在知识星球里单独分享的第一个话题：


    #### 能力和忠诚，哪个更重要？


    ![](img/d747a49dab77676cf44faebe24df049c_341_0.png)


    这个话题，达叔年轻的时候，几乎是不过脑子的，第一次严肃认真的想这个问题，是几年前，在某个主任的办公室里，很严肃的问我。


    我随口就给了一个答案，这个答案，是本能的反应。


    对方乐呵呵的看着俺，说了一句，你再想想。


    又过了很长时间，有一次，达叔和这位主任吃完饭，散个步，一起探讨这个话题，是俺的第一次开窍。


    但是虽说是开窍，但心中仍然有一朵乌云，那些牛逼的创业者，会不会是一个例外？


    等我最近这一年，通过这个账号，链接的人更多，见到的世界更大，那些顶尖投资人所选择的人，能力当然重要，但也是一个基础的能力。


    为什么选你，才更重要。


    人的这张脸、这个名字、这个代号，是有信用记录的，你的信用积分越高，越能降低交易成本，越容易成功。


    过来见达叔的人，有一个是搞金融支付环节，做灰产的。属于没怎么上学的富二代，第一代个体户的后代，时间很自由，赚过很多钱，但最后，还是被P2P金融给收割了，一口气亏了300万。


    去维权，然后又被第二轮收割，又亏了十万。


    不要轻易踏入任何一个你不懂的行业，处处都是暗礁和镰刀，就等着你了，永远是资深玩家，收割小白。


    就如同很多人，来找达叔要做医疗，达叔一看隔行很远，就劝退了，原因有二：


    - 1、你现在什么都不懂，我舍不得收割你，你瞎搞，就会被别人收割，几十万、几百万的贷压在心里，很正常。

    - 2、如果没人带你，这个行业，你几乎是永远摸不清门路的。


    为什么？


    因为你即使看到了别人赚钱，你也不知道是怎么赚的，有很多行业，你看一眼，就懵了。


    有很多行业，即使对方把逻辑给你讲了一遍，你想去做，发现根本没没法入手。


    这就是壁垒。


    现在这位灰产小伙，做的很不错了，达叔给他讲了医疗行业的操作方式，可以把他的规模，翻几倍，而且更稳定，昨天讲完，今天就开始去执行了。


    这个家伙发财，是肯定的，有执行力，敢冒风险，唯一吃亏的，就是见的行业太偏，不够大、不够深。


    别人的文章，都在和你讲道理，达叔的文章，都在和你讲我观察到的世界，每一个小故事，都是可以验证的。


    比如，达叔在2020年，6月6日，写了一篇文章，SK#24 达叔这个月的见闻和思考。


    里面讲了一个故事，达叔送女儿去上英语课，和店长聊的天，达叔和他说，你这个生意不是个好生意，要尽快转型。


    因为你这个生意模式，我看一眼，就懂了，你要是真的赚钱，就会吸引大批的竞争者，迅速就把毛利干下来了。


    绝大部分这样的店，无论早期多么赚钱，最后都要以倒闭为终点。


    上一次达叔这么写的时候，还是疫情爆发期间，达叔断言，这场疫情看似让很多餐饮店、实体店倒闭。其实呢？


    这场疫情本质上，拯救了很多小老板，让这些老板终于找到一个台阶，两手一摊，关店了，认命了，受疫情影响，非战之罪也。


    一些早就不赚钱的生意，终于可以体面的结束了，文章一出，好多店老板给达叔发信息，你这货咋什么都懂？俺就是这样的。


    出差前，达叔送孩子去跳舞，路过这家英语培训机构，关门了。


    距离达叔写那篇文章，一年不到。


    ### 2


    话题聊到这，有一个读者，是开城市民宿的，算是这个城市的拆二代，放下手机给达叔说，你这个观点非常对。


    民宿说，你们猜我们这个城市里，那个著名的某某楼，连锁的餐饮店，净利率是多少？上次我和他们老板吃饭，才知道，只有4-5%，太惨了。


    我们行业还能达到30%左右呢。


    达叔笑着说，那是因为你们这个行业，刚起步没多久，最后的结果，也是这个德行，这几年的利润率背定会持续下滑的。


    民宿很震惊说，你咋知道？


    达叔说，因为从本质上来看，你们的技术壁垒，没啥区别，都属于看一眼，就能懂的生意。


    只要赚钱，你就会忍不住拉你的亲戚朋友来搞，一传开，钱是最聪明的，哪里赚钱就流到哪里去，直到蓝海杀成红海。


    民宿很焦虑的说，那你说咋办？


    达叔说，所以你要研究各个行业的迭代进程，每个行业的兴衰历程，是完全不同的，周期跨度也完全不同。


    星哥之前举过一个例子，比如在互联网领域，3年的时间，一场战役就结束，从开始到结束，千团大战、支付战争、移动巨头都是这么玩的。


    起的快，死的也快。


    但是，你看在医疗行业里，我们集团里，有一款产品，从发明上市到现在，已经在全球卖了20多年了，从来没更新，也不换代。


    就这么硬卖，每年的增长，还不低。


    这个现象特殊么？


    一点都不特殊。


    一款药、一款诊断设备、一个器械、一个耗材，从上市到生命周期结束，20-30年很正常。


    那个拜耳的阿司匹林，是1899年开始在全球开始卖的，现在都卖120多年了，还在咣咣猛卖，丝毫没有衰退的迹象。


    官员说，对的，从这个领域来看，其实很多医生，看似牛逼，本质上就是医疗公司的打工仔。


    这就属于，一看就能看透本质的家伙。


    然后官员问，我爱人作为医生，有什么出路可以走？


    达叔问，在那个科室，能杀到大主任么？


    官员说，不能。


    ### 3


    达叔说，那我给你介绍一个生意模式，供你俩参考，如果能操作成功，非常赚钱，得看你爱人的组织能力，目前面上有非常成功的模式。


    而且，这个领域医生缺口非常大，但所有严肃医疗，又都离不开这个群体，尤其是很多民营医疗崛起，这个领域，有很大的操作空间，就看你们能不能抓住。


    肯定不亏钱，具体能赚多少，能把规模做大，看本事。


    为什么达叔的文章受欢迎，很多客户愿意和我聊天，因为我的文笔虽然不咋地，但我看得多，能帮你更高效的赚钱，能够给你新的方案。


    这比拉客户去吃唱娱乐 KTV，高级多了。


    吃喝娱乐 KTV，别人看一眼就懂了，其他人想学俺，怎么学？


    今天和同事把这个省的生意，再梳理一遍，在6月底，要交出一个漂亮的数字。


    达叔以前在某个场合做销售分享的时候，说过一个观点，做销售、做业务、做生意、甚至战争、投资，本质上都是一样的。


    都是拿时间换空间，再拿空间换时间，最重要的是控制节奏。

    '
