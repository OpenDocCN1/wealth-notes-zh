    \n## 第三十篇 FC#29 只有地产，能给高科技公司的结局留点尊严\n\n大家好，我是达叔。\n\n一个想和大家一起慢慢变富的家伙。\n\n今天遇到三波人，感觉到一个奇怪的事儿，俺可能真的红了，至少在小圈子里，红了，像个刚出锅的螃蟹一样。\n\
