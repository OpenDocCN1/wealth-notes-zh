    #### 武汉有多强，可能很多人没意识到。


    疫情有改变任何一个基本面么？


    没有。


    达叔可以从 GDP 规模、增长率、人口规模、净流入、净流出、城市化进程、产业定位、交通网（航空、高铁网、水运）等角度来分析，无论从哪个角度来看，武汉在中部城市群里都超强。


    但达叔尝试从中国的规划以及外资巨头如何看待来分析：


    现在中国主做的事情，中国自由贸易区的发展路线图：


    ![](img/d747a49dab77676cf44faebe24df049c_333_0.png)


    从时间顺序上来看，越重要的越靠前，上海是第一个。


    后面的基本上大部分是沿海省份：广东、天津、福建、辽宁、浙江。


    但是，请注意，已经开始出现**内陆省份**了：河南、湖北、重庆、四川、陕西。


    请注意这一整套路径，在中国的所有改革措施，基本都是按照这个套路来的：


    选一个城市，小范围试点，如果效果好，作为奖品，依次颁发给相关地区。


    一线—沿海—中部—内陆，这是从东向西的路径推进。


    还有一条路径，就是从上到下，一线—省会—副省级—普通市级—县级，再往下连骨头都没了，只能喝点汤。


