    ## 第四十一篇 JJ#1 疫情让我们思考：财富的源头是什么？


    经济学是一门刚刚起步、派系林立的学科，但本质都是在探讨财富如何产生和分配。


    中国发展到今天，目前所有的主流学术思想都来自西方，无论是左翼思想计划派，还是右翼思想自由派，都是西学东渐的结果。


    伴随着中国经济的腾飞，中国重新崛起，在话语权、社会科学知识体系如何升级？摆脱左右之争，讲好中国故事，成为更加急切的 任务。


    话语权的重要性，在疫情期间表现的尤为明显，同样的事，中国做和西方国家做，得到的评价截然相反。财富的源头是人还是物？


    达叔以前看过央视的纪录片《大国崛起》，其中非常感慨的是葡萄牙、西班牙平分地球，占领美洲最好的拉美，土地肥沃、矿产丰富。而后来的英国，只有更贫瘠的北美，后来的故事大家都都看到了。


    从时间轴上看，古自至今，人的能力在不断提升，努力摆脱自然的束缚。


    从空间轴上看，世界各国，越是经济发达的经济体，其第三产业在经济中的占比就越高。


    几十年前，石油危机，人类活在资源耗尽的恐惧之下，加上马尔萨斯人口陷阱的理论，一些国家纷纷制定消极的人口政策。


    目前来看，石油勘探的数量更多、石油价格在下降，页岩气、风能、太阳能、核能等新兴能源不断崛起，人类会逐渐摆脱对资源的恐惧。


    各个发达经济体都在积极鼓励生育，制定积极的人口政策，尽量推迟陷入人口老龄化陷阱。“资源诅咒”：富饶的自然资源不但不是财富的源头，反而会消灭财富和长期的繁荣。沙特、中东、俄国、委内瑞拉、中国的山西等都是如此，甚至连荷兰这样的老牌欧洲发达国家都难以避免。


    “荷兰病”：荷兰在发现丰富的天然气资源后，制造业相对衰落，资源出口过度发展，削弱了制造业，使得一国的技术创新和人才相对滞后。


    资源出口型国家，整个社会对人的技能需求低，缺乏人力资本投资的激励。


    统治阶层只需要通过武力控制资源，和几个国际能源公司签订合同，就可源源不断的获得财富，根本无需通过收税这么麻烦，也就无需和人民分享权力。


    由于对人力的不依赖，也为独裁、腐败等创造了条件。形成恶性循环。


    成本是什么？是人。


    教科书上成本有很多定义，但我们来做一个思想实验，看看成本到底是什么？任何一个商品，无限拆解，最终总能拆解成“原材料成本+人力加工成本”。


    但是原材料都是从自然界开采的，是无需付费的，是零。所以一个商品的成本就是人力成本，社会消费支付的费用等于生产者的工资。


    比如：达叔买一个冰箱，100%国产，那么我支付的8000元钱，必然转化为中国人的报酬，这些中国人可能是生产线上的工人、管理人员、销售员、老板、经销商、售后服务人员等。


    ### 人力资本逆袭


    二战后，崛起的发达经济体：日本、韩国、台湾、香港、新加坡，甚至中国大陆，都无法称之为资源国。


    看看全国各个板块里，人口流失最严重的东北，经济陷入困境。


    而一线城市对全国优秀人才的虹吸效应，强二线城市近几年展开的人才落户抢夺大战，新一轮残酷的城市竞争，才刚刚开始。各个城市在发展制造业、服务业的同时，通过吸引外部年轻人流入本地，扩大本地市场规模，有利于本地财政的可持续发展。


    通过开放落户，甚至对外地年轻人进行购房补贴，将其家庭原本在别处买房的巨额资金一次性转至本地。


    公众号懒人搜索，懒人专属群分享


    房价中的 50%以上都会转化成当地政府的财政收人，建设更好的医院、地铁、学校，吸引更多的人和公司，年轻人工作机会更好、工资更高、资产升值，进入良性循环。


    看达叔文章的很多朋友应该是年轻人，闭上眼睛，好好思考一下自己的机遇，你们就是日本的昭和一代，未来是整个中国最有钱的一代人。


    关注 达叔经济学，让我们一起慢慢变富。不要把困难留给下一代。


    既然资源不重要，人更重要，那全世界各地穷的连裤子都穿不上的失败国家，资源也贫瘠，贫瘠到连西方都会不得用导弹去炸，浪费钱。


    为什么不富？


    制度与文明至今全世界走上发达经济体道路的只有两个文明，一个是基督教文明，


    一个是儒家文明。目前的局面就是，儒家文明对基督教文明的全面挑战。


    二战后崛起的发达经济体，几乎都是儒家文明圈的，虽然有几个逆子不承认。


    达叔预测，下一个有机会迅速崛起，进入发达经济体的国家是：越南。


    如果在国内没有找到太好翻身机会的，可以到越南闯一闯，无论是经济增长率，还是越南大城市的资产价格都会迎来二十年以上的高速增长。


    达叔你是不是支持海外投资？


    不是，达权认为最好的机会还是在中国。


    儒家文明是世俗文明，骨子里是实用主义，和西方对神仙的崇拜、恐惧完全不同。


    儒家和神仙都是交易的关系，要生孩子才找观世音、要发财找财神、要考试拜文昌星等等。这个文明的缺点，西方已经分析得很多了。但这个文明的优点，很多人


    重视不足，而形成了文化的自我矮化，甚至至今都有一批专家学者著书主张教文明拯救国家。


    ### 儒家文明带来的大政府主义


    无论是英国优秀毕业生李克强辉的新加坡，还是德国模式东亚版的日本，都是实行国家主义，国家制定和干预产业政策，对发达经济体进行追赶，只是披的皮不一样而已。


    国内的国师级别经济学家，张维迎和林毅夫之间的争论最为典型，目标一致，手段不同，各有道理。


    冷战后，新自由主义经济学派一家独大，几乎变成了教条主义。其理论精髓：政府是必要的恶，自由和民主的选举制政府，多管制、小政府大市场。


    这一套，号称放之四海而皆准的理论，除了在新教文明个别国家取得成功外，其他几乎全败。


    甚至土地肥沃、资源富饶、国家精英全套进口芝加哥学派的拉美，也陷入经济停滞、社会动荡。而中东叙利亚、伊拉克等的遭遇，让 2015 年的诺贝尔奖获得者 Angus
    Deaton 发表 “邦弱国穷”的主张和言论。


    ### 制度是文明派生


    欧洲的发展路径，首先要分析上千年来，欧洲的长子继承制和中国的分家文化。


    欧洲长子继承制，产生的根源是游牧文化，为什么？因为草原不能私有，不能分割成越来越小的地块，所以长子继承制就流行，非长子和他们的后代就沦为平民乃至贫民。


    但在东亚的农耕文明，土地是财富之母，富贵家族就是占用了更多的土地，儿子们是主要劳动力，肯定不能实行长子继承制，加上“多子多福”，土地越分越少，也就无法形成巨额财富长期积累，“富不过三代”。


    欧洲更盛产贵族，一直到 1918 年第一次世界大战之后，才大体消灭了贵族，但整个欧洲至今还活在贵族阴影中，隐形的财阀、帝国家族。而封建贵族在秦朝统一后，已基本从根基上消除了，隋唐后的科举文官体制，长达上千年形成“王与士共天下”，中央帝国对平民提供上升阶梯。


    ### 国家的功能：向人民提供必要的公共产品


    国家垄断暴力，才能向人民建立必要的公共产品。


    市场创造财富，但怎么才能建立有效的市场？政治稳定、社会信任、基础设施，这三大基石，都是由政府提供的，而提供这些需要高昂的成本。


    比如这次疫情期间，一旦人无法流动，无法交易、企业倒闭、股市暴跌、财富蒸发。


    Government isn''t about good and evil. It''s about order or chaos. 中国政府有能力采取全民作战的形式，令行禁止，秩序井然。


    欧美政府维持不了这样的秩序，防疫的手段也就是现在这个样子。


    看策略，要看策略背后的资源制约，政府是否有能力、在较低的成本之下提供秩序这一公共产品。


    综上，


    财富的源头是人，不是物。


    人创造财富，需要政府提供安全、秩序等公共品。


    关注 达叔经济学，让我们一起慢慢变富。


    ## 第四十二篇 JJ#2 如何精益管理工作，提高财富增长效率？


    达叔小时候，生活在一个小村庄，对这个世界的财富没什么概念。


    第一次感受到巨大的冲击，是在小学的时候。


    邻居大哥哥在上海打工，回来说，在上海剪一个头发，要5块钱，这个就是达叔后来立志长大要来上海的原因之一。


    因为达叔当时在村里剃一个头，只要5毛钱，而同样一个头，在上海剃一次，竟然要5块钱，上海的钱也太好赚了吧？


    这个故事，就是今天达叔要讲的内容：

    如何管理工作，提高财富增长效率。


    同样的一个理发师、同样的手艺、同样的服务、一模一样的时间和劳动，在村庄就是5毛钱，在上海就是5块钱。直到今天，差异仍然存在，其他服务也有类似情况。


    区别在哪里？背后的原理是怎样？对我们有什么启发？

    可贸易品与不可贸易品的区别：

    理发这样的服务，在经济学里的名称叫什么？

    不可贸易品（non-tradable goods），它和可贸易品存在怎样的区别？

    不存在异地套利。


    比如一个手机，就属于可贸易品，就存在异地套利空间，你在小村花长 3000 元买了，同样的手机在上海卖5000 元的话，就存在大量的套利空间，很多生意就是在这种情况下产生的，把
    A 地的货运到 B 地去卖。


    但是可贸易品，只要存在高额的非地套利空间，就会吸引更多商家参与。


    在互联网、高铁、高速公路、快递等技术的推动下，异地套利空间必然受到极大的格压。


    如果是这样的生产企业主，解决方案大概是：

    - 走差异划路线解决同质化现象；

    - 或提高技术壁垒增加卖点；

    - 或降低成本，走价格战；

    - 等等。


    可贸易品，本质上是遵布“一价原理”，同样的产品价格应该是差不多的。


    很多普通制造业等实体经济都面临这个局面。

    看达叔文章的小伙伴，是制造业企业主的肯定不多，普通打工或从事非贸易品的比较多。


    达叔重点来聊一下非贸易品，如何提高财富积累效率，也就是干同样的活，如何赚更多的钱。


    当我们比较困难的时候，很多人都会鼓励我们：你要加油，努力提升自己。


    对吗？对。


    有用吗？没用。

    '
