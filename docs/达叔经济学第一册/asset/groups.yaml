  md: "\n新房数量，是当地政府控制房价增幅的利器，只要大量增加供给，必然可以把价格打下去。\n\n谁手里的子弹最充足？又是重庆。又是2~10倍的供应量。\n\
    \n请问为什么？\n\n下面就要讲“重庆地票制度”。\n\n达叔之前的文章里提到过，中国“18亿亩耕地红线”的事，这条红线存在是否合理，理论界有争论，在论战结束之前，这条红线不能破，是毋庸置疑的。\n\
    \n在过去200年的世界经济史里，农民进城之后，耕地面积是越来越多了，还是越来越少了？\n\n不好意思，从世界来看，是越来越多了。\n\n从统计学上来看，农民进城成为市民，平均使用面积100平米顶天了，在农民一个宅基地加上院子，至少要250~300平米。\n\
    \n算上城里高楼林立，一家三口人均30平米，住个90平米的房子就不错了，一栋楼20~30层，可以节约多少土地？\n\n一亿人进城，至少可以多出1.5~2万平方公里。\n\
    \n城市化过程，农民进城，是城市建设用地适当增加，农村建设用地大量减少，耕地面积大幅增加，这是全世界的经验。\n\n无论是发达国家，还是发展中国家，都是如此。\n\
    \n但是为什么，中国过去改革开放四十年，4亿农民进城，原来20亿亩的耕地，却在减少，要誓死保卫18亿亩耕地红线呢？\n\n因为农民两头占地。\n\n一方面，大量农民进城，买了房子，城市大幅度扩张，4亿农民，就是400亿平米。\n\
    \n另一方面，大量的农民即使进了城，在农村还有宅基地没有退出，仍然保持原状。4亿农民，大概有10万平方公里的农村建设用地没有退出。\n\n比如达叔，父母都进了城，在浙江买房生活，达叔在上海生活，但是在东北老家，却有一个几百平米的荒院儿房子和十几亩地。\n\
    \n如何让农民把农村的建筑用地合理退出，不侵犯农民的利益，价格又要合适，这是一大难题。\n\n最近山东等省份搞合村并居，就是一个趋势，在媒体上闹的沸沸扬扬。\n\
    \n这，就是改革的深水区。你搞不定这个，就必须得继续忍受高房价的压力。\n\n达叔之前的文章里，提过一个人，科斯定理的科斯，那个拿过诺贝尔经济学奖的家伙。\n\
    \n重庆就按照他的理论，成立了重庆土地交易所，设计了一个地票制度。\n\n说白了，就是用指标空间上进行划拨。\n\n农村建设用地分为三块：\n\n- 宅基地地：老家农村的房子能卖掉么？卖个两三万就不得了，但是你要是拆掉，复耕为耕地，政府补偿你十万八万的。你愿意不愿意？\n\
    - 乡镇企业：改革开放初期，曾经红火一时的乡镇企业，无法适应工业化大生产的潮流，无论是税制改革、还是土地、环保的指标，纷纷倒闭。复耕为耕地，也是增加政府的地票。\n\
    - 农民闲置的粮站、校舍等一切公共设施，复耕为耕地，增加政府地票。\n\n政府出资购买地票，再把地票额度用在城市和郊区，城市建设用地大幅度增加。建设房地产地，农民拿了钱，也可以进城买房子，或者进城做生意作为启动资金。\n\
    \n重庆把这个事，向中央汇报，建设部、国土部、发改委等联合研究，支持重庆搞这个试点。\n\n地票原来每亩9万，后来涨到每亩20万，换成钱，也就是几百亿的人民币发给了农民。\n\
    \n这个地票改革，到2020年，重庆房价稳定，重庆3400万亩的土地，多年操作下来，不仅没有减少耕地，还多了100多万亩。\n\n你看重庆的方案，既能把房价摁在较低水平，又能守住耕地红线，为什么不全国推广？\n\
    \n非不能也，是不愿为也。\n\n所以，各位一定要看清楚，房住不炒，不是房价不涨，而是要慢涨。\n\n政府把居民的绝大部分权力，居住权、教育权、户籍、医疗等所有重要权力，全部与房子捆绑，来通迫你买。再用涨价来引诱你买。\n\
    \n前有引诱，后有强迫，这是什么？房子是国家抽取民间资本的最大抽水机。\n\n房子是古代社会的盐，是税收的大头，是中国经济的压舱石。\n\n有无数种方法，可以让房价降下来，但是没有采用任何一种。\n\
    \n所以，指望房价降的，洗洗睡吧。\n\n除了重庆之后，再来看一个楼市里的网红城市：长沙。前段时间，研究楼市的人都知道，疫情之后，深圳房价暴涨30%以上，一两个月涨上百万，比比皆是。\n\
    \n深圳住建局赶长沙“取经”，回来之后，深圳楼市调控新一轮加码。\n\n但是看完了重庆，你知道了重庆的房价低，是地票制度，中央同意的改革试点。\n\n长沙，湖南省会，湖南单核城市，人口840万，GDP破万亿，11573亿，在全国排第15名，前面排着第14名青岛，第13名无锡，第12名宁波。长沙近几年肯定会超越青岛、无锡和宁波，应该是大概率事件。\n\
    \n看一下房价，青岛均价：\n\n![](img/d747a49dab77676cf44faebe24df049c_78_0.png)\n\n青岛市人口770万，GDP和长沙相差无几，长沙还是个省会城市，长沙人口840万，那么长沙的房价均价如何？\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_78_1.png)\n\n看着这个图，两者一对比，是不是小心脏砰砰跳？\n\
    \n不敢相信自己的眼睛吧。\n\n在中国所有省会城市里，长沙房价排名倒数第三，比长沙还低的省会是西宁和乌鲁木齐。\n\n拉萨和呼和浩特，均价都比长沙高，是不是很诡异？\n\
    \n长沙，缺少曝光率么？芒果台大本营，娱乐圈一霸。\n\nGDP高，房价低，是不是所有国民口中的良心城市？\n\n地方政府不依赖土地财政，人民安居乐业，过着幸福而美满的生活。\n\
    \n但事实真的是这样吗？\n\n再说一遍，价格是由供需决定的，和地方政府官员素质没关系。\n\n长沙房价低，浅层次原因：和重庆一样，长沙土地供应量大，特别大，不缺房子。\n\
    \n不对啊，达叔，你前面那个分析重庆的表格里，没有看到长沙的土地供应影子啊。\n\n对，这就是长沙的隐情：\n\n长沙“福利分房制度”结束得特别晚，房子分的多，不缺房子，所以房价低。\n\
    \n这是一个只属于长沙的故事。\n\n所有的城市要发展壮大，都要先拉开骨架。\n\n什么是城市的骨架？路网、地铁、轨道交通。\n\n关于城市骨架，很多城市差异非常大，比如一直相互PK的南京和杭州。南京在骨架上一直就遥遥领先杭州，杭州近些年才开始奋起直追。\n\
    \n1990s，长沙就开始起跑，路网修的比多数城市都要大。\n\n铺路是要花钱的，1990s，大家都没钱，长沙也不例外，怎么办？\n\n看过达叔之前文章的都知道，土地就是钱，拿地抵。\n\
    \n长沙地方政府没钱给基建公司，就给土地，基建公司被动的也多了。\n\n注意，基建公司不是房地产公司，这两者之间有很大的区别，他们要的是工程款，当年的土地又不值钱，没有现金流，公司会死掉的。\n\
    \n怎么把土地变成钱？基建公司就和各种公家单位合作，给公家单位盖房子，低价卖给公务员、企事业单位。\n\n早年单纯的基建公司，只想着赶紧把钱拿回来，根本没想要靠房地产赚大钱。\n\
    \n比如芒果台的明星们住在哪？自己盖的小区里。长沙的各个公家单位，都是如此。\n\n1998年，国家要求全国停止“福利分房制度”，这在需求侧，为房地产的腾飞做好了准备，你们把钱包都准备好，我要开始玩土地财政了。\n\
    \n长沙地方政府，一看兜里，没多少土地了，发出去的土地太多了。\n\n直到今天，当年发出去的土地都还没消化完。具体发出去了多少呢？没有人统计过，长沙也从来没有披露过，版本很多，但是有一点是肯定的，那就是数量巨大。\n\
    \n这就是隐形的“福利分房”，价格十分便宜。\n\n长沙市精英在公单位里的，手里都有很多房子，如果长沙不控制房价，这些人哪还有心思干活？\n\n而地方政府从这里，再也得不到任何好处，我得不到好处，你们还想卖高价？限价、调控，慷基建公司之慨，出自己的业绩，这是目前主政官员的主观因素。\n\
    \n客观因素是长沙地方政府，不是不依赖土地财政，而是无法依赖。\n\n不是不想，是干不成。\n\n长沙想不想依赖土地财政，看一个地方，就明白了——梅溪湖新城。\n\
    \n楼特别高，路特别堵。\n\n为什么？梅溪湖新城规划先进，但是后来不断增加容积率。\n\n为什么要加容积率？因为要多卖土地款。\n\n为什么要多卖土地款？\n\
    \n因为城市之间竞争，是要花钱的。其他城市还能卖土地，长沙无法依赖土地财政，钱从哪里来？\n\n靠税收？别闹了。\n\n在分税制时代，GDP再高，税收大头70%归中央，小头30%归地方。\n\
    \n单纯靠税收，没有一个城市能发展起来，等着一起穷吧。\n\n还有别的办法么？\n\n最后一招：地方债。\n\n达叔在JJ#19独山县烧掉的400亿，其中有你的一部分，里面有讲过，一个小小的独山县，财政收入一年只有10个亿，却搞出了400亿规模的地方债。\n\
    \n400亿地方债的利息是年化10%左右，一年的利息就40个亿，独山县财政收入全部还利息都不够，相当于破产了。\n\n那么长沙到底举了多少地方债呢？\n\n\
