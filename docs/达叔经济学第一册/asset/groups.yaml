    因为你只要勤奋一些，你就能比同行赢得更多的信任。


    任何一个行业之所以存在，都是因为能赚到钱。


    但竞争充分的行业，很多人都是辛苦的陪跑，那钱都被谁赚到了？


    行业的头部公司，公司里的头部人员，他们赚了钱。


    所以，一个人，在任何一个行业里，能赚多少钱，是看你能领先同行多少决定的。'
  - '[PAGE 39]


    ![](img/d747a49dab77676cf44faebe24df049c_39_0.png)


    你有点文化要是能够舞文弄墨、写点文章，带个相机，把城市里各个板块的图文并茂、介绍个清清楚楚，加上自己的观点。


