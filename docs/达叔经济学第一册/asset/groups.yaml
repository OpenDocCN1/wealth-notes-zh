  - '[PAGE 109]


    同学说，原因有三个：


    +   1、你的收入不稳定，你的职业也不稳定，经常跳来跳去，看天吃饭，而我们选的人轻易不会跳，很稳定，稳定在银行眼里就代表着可控、安全。


    +   2)、你没啥灰色收入，在中国无亏夜草不肥，我们选的从业者不靠工资收入。


    +   3)、自己人总是要照顾一下的，你们外企算是个啥东西，自己玩去吧。


    达叔被惹的没脾气，也就老实了，乖乖去玩别的。


    +   3、房贷：年限最长可以达到30年，利率也是基准利率上下浮动一点。按照目前的通货膨胀率，就是当权者给人民仅有的一项金融福利。


    就这个福利，还被广大社畜无限吐槽，不要做房奴。


    对房贷的态度，是普通人一生财富上限的分水岭，彼之砒霜、吾之蜜糖。


    达叔有的时候想，这个世界真是太魔幻，分不清楚爱还是嫌。


    +   4、其他经营贷等产品，需要成立公司，普通人更不敢玩，在此不表。


    危机中的选择，一年胜十年。


    达叔曾经在疫情期间，刚玩自媒体，在知乎上，写过一篇关于通货膨胀的文章，和一帮傻了吧唧的文艺青年激辩，再后来也懒得理这些人了。'
  - '[PAGE 110]


    每年全球央行的行长，都会在德克萨斯的一个小镇上开个年会，这个小镇名叫 Jackson Hole。


    以前，全部都是闭门会议，各国央行行长们对货币政策、货币体系的主张、意见、实践进行分享。


    我们普通人的命运，很多时候，都是被别人的一个政策改写的，普通人浑浑噩噩、全然不知，度过一生。


    今年受疫情影响，全球央行行长会议改为了线上会议，历史上第一次给了普通人围观吃瓜的机会。


    全球大杀手——美元，掌舵人美联储主席鲍威尔老师，慢悠悠的吐出了三个词“Average Inflation Targeting”（平均通胀目标）。


    很多事情，能做不能说，一旦说出来了，事情的性质就变了。


    在比较负责的政府那里，一直而努力把通胀率控制在 2%，另外一个货币政策和财政政策的准绳就是看失业率。就这么个曲线，画出的人，拿了个诺贝尔经济学奖。


    ![](img/d747a49dab77676cf44faebe24df049c_110_0.png)'
  - '[PAGE 111]


    如果失业率过高，就考虑降息来刺激经济，如果失业率过低，就会考虑加息。


    有的小伙伴读到这里，又懵透了，失业率过低，也不好？


    是的。


    失业率过低，代表经济过热，经济过热可能导致高通胀，高通胀是所有执政者的噩梦，是要被人民唾弃的。


    那么 2% 的通胀率，这么多年来，绝大多数国家能实现这个目标么？


    从结果来看，很难。


    中国的通胀率只有在统计局的努力下，才能实现 2%，各位的真实感受是多少，达叔也不方便展开说。


    虽然很难实现，但是都是私底下通过玩数字游戏，把结果弄的没那么离谱。但是这次美联储主席鲍威尔老师，在全球央行行长会议上，撕下了最后一块遮羞布。


    这个 “Average Inflation Targeting”（平均通胀目标），简称 AIT，号称不再死死盯住通胀数字 2%，而允许通胀率在 “一段时间”
    内、“适度” 高于 2%。


    直白点，就是放松通胀膨胀标准，为了实现总体经济和财政政策，可以容忍更高的通货膨胀。


    比如，定一个 2 年内 3% 的 AIT，加入第一年通胀才 1%，那么后面的一年，可以容忍 5% 的通胀率，因为计算公式 = (1%+5%)/2=3%，如果还没讲明白，达叔拉讲个例子。'
  md: "\n![](img/d747a49dab77676cf44faebe24df049c_94_0.png)\n\n蓝图为2017年出台的限购圈\n红圈为2020年最新出台的限购圈\n\
    \n制图：宁波晚报\n\n你能不能再分析出一些机会？\n\n达叔今天举了三个城市的例子，郑州、洛阳一起一落，河南的权贵跟着省政府驻地迁徙，宁波的权贵们跟着宁波市政府迁徙。\n\
    \n各位不要只低头工作，要努力研究自己所在的城市，研究自己所在的行业，自己所在的公司。\n\n这些是你的平台，是你的船，是你的电梯。\n\n很多人终其一生，职场上赚的钱，并没有资产升值来的多。\n\
    \n跟着权贵走，不要跑偏了。\n\n推荐一本书，北大教授徐远的《城里的房子》，希望对各位有帮助。\n\n## 第十三篇 FC#13 泡沫制造繁荣，拒绝泡沫，就是拒绝财富\n\
    \n泡沫，是一个被妖魔化的词汇，没有泡沫，就没有繁荣，就没有人类科技的进步。\n\n泡沫被妖魔化，就如同“改革”被神话了一样，都是中国目前特定语境下的产物。\n\
    \n历史上各种改革、变法，有成功的，有失败的，改革是个中性词，没人保证一定会成功，但目前所有人都觉得改革，深化改革，带有褒义的色彩，这本身就是40年的思维惯性，是一种思维懒惰的行为。\n\
    \n泡沫，中国所有人闻“泡沫色变”，新中国建国以来，什么资产有过泡沫？什么泡沫破灭过？\n\n除了连赌场都不如的股市，韭菜收割机，谁能给达叔举出几个例子？\n\
    \n所有媒体小编嘴里说的楼市泡沫，完全是一派胡言。\n\n经济发展必然伴随之资产膨胀，这种货币现象，不叫泡沫，叫繁荣。\n\n繁荣和泡沫，如影随形。\n\n\
    世界三大坚不可摧的泡沫，美国的股市，日本的债市，中国的楼市。\n\n这是三大经济体的命脉，是政权攫取财富、保持繁荣的压舱石，只要他泡沫不破，就是繁荣。\n\n\
    无泡沫，不繁荣。\n\n中美对抗，科技封疆，举国体制下，中国必将迎来科技史上的最大泡沫。\n\n没有泡沫，无法完成强国攀升，没有尸骨累累，就没有屹立于世界的强者。\n\
    \n美国纳斯达克科技股泡沫历史，1999年-2001年间上市的科技公司，存续率只有6.8%，其他的全部死掉，投资者血本无归。\n\n但是存活下来的企业，称霸全球，深刻影响全世界。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_96_0.png)\n\n1995年到2000年，从743点一路冲到5132点，涨幅590%，\n\
    \n随后19个月暴跌78%，一路跌至1108点。\n\n这个叫泡沫破裂。\n\n一将功成万骨枯，期间亚马逊，奈飞，苹果，英特尔无一幸免，最多跌去90%的市值。\n\
    \n中国股票市场，动辄市盈率高达100多的科技、医药类公司，就是典型的泡沫。\n\n1999年，有记者问比尔盖茨，你们微软是不是泡沫？\n\n盖茨说，当然是泡沫，但泡沫有什么不好？问题不在于泡沫，而在于泡沫对网络行业带来了巨大的新资本，高回报必然伴随着高风险，必然推动行业更快创新。\n\
    \n多年以后，亚马逊的贝索斯承认，是泡沫顶峰时的融资让亚马逊在2000年末，账上还有11亿美元的现金，保证其没有死掉，一路走到今天，持续创新。\n\n特斯拉，成立17年，亏损17年，没有泡沫带来的巨大财富效应，就没有人才走入这个行业，就走不了这么漫长的黑夜。\n\
    \n泡沫，是这个世界上最伟大的，最合法的财富创造活动。\n\n索罗斯有一句名言，世界经济史是一部谎言史，人生要发财，就必須识别泡沫，拥抱泡沫，在泡沫之前离开泡沫。\n\
    \n泡沫，只会发生在科技领域么？\n\n不是。\n\n世界经济史拉开序幕之后，泡沫就伴随着每一个帝国的崛起。\n\n工业革命带来运河热，蒸汽革命和铁路革命带来铁路热，能源革命带来能源热，所有技术革命背后，必然带来金融泡沫。\n\
    \n没有金融泡沫的技术，不配叫新技术。\n\n技术兴起→高速发展→繁荣过热→破裂衰退，形成寡头，称霸世界，繁荣持续。\n\n| 轮次 | 技术革命(核心产业)\
    \ | 次产业 | 热门期 | 时间 | 热门期概述 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 第一次\
    \ | 工业革命(蒸汽、能源) | (1777) | 运河热 | 1769~97 | 大英帝国时代的盛世 |\n| 第二次 | 蒸汽机时代(煤气、钢铁) |\
    \ (1829) | 铁路热 | 1848~50 | 维多利亚时代的繁荣 |\n| 第三次 | 钢铁、电气、重工业时代(汽车、飞机) | (1876) |\
    \ 信贷资金化的全球市场(美欧股灾，德国) | 1880~98 | 1896~1914欧洲美好时代，1890s~1920s美国进步时代 |\n| 第四次 |\
    \ 石油、汽车和大规模产业时代(汽车，航空航天) | (1908) | 美国咆哮的20年代 | 欧洲1929~33 美国1929~43 | 1930s大萧条，二战后的黄金年代\
    \ |\n| 第五次 | 信息和智能时代(美国) | (1977) | 新兴市场互联网泡沫 | 美国2007~2008~??? | 2077 |\n| 大爆炸\
    \ | 大规模生产制造网络 | 泡沫 | 制造重组 | | |\n\n旧世界需要被打破，打破是要代价的，这个代价谁来支付？国家力、新秩序的组织。这个组织可以是公司，可以是新的国家力量。\n\
    \n但旧世界会心安理得的放弃既得利益吗？不会的。\n\n新旧交替，如果不是战争力量解决，就是经济力量解决。\n\n没有泡沫化，就无法集中规模巨大的金融力量，无法吸引到最尖端的人才，无法绑架最强大的权贵，无法打赢新旧交替之战。\n\
    \n达叔之前在文章中有过说，#J#17 #对不起来，在决策者眼中，穷人不缺钱，富人才缺钱，这个钱放在穷人的手里，是没有多大意义的，不如集中起来帮助国家一起打赢科技战。\n\
    \n如果你扒开底层研究目前支持中国造芯片的国家基金，资金来源来自于哪里？\n\n大基金一期成立于 2014 年 9 月 24 日，一期总规模为 1387 亿元，重点投向了集成电路芯片制造业，兼顾了芯片设计、封装测试、设备和材料等产业。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_99_0.png)\n\n![](img/d747a49dab77676cf44faebe24df049c_99_1.png)\n\
    \n而近期国家集成电路信息公示系统显示，国家集成电路产业投资基金二期股份有限公司（大基金二期）已于 2019 年 10 月 22 日正式注册成立，注册资本\
    \ 2041.5 亿元。大基金二期主要发起人和投资人共有27家，股东包括财邦国际、国开金融有限责任公司、中国烟草总公司等国家部委和央企，还有多地省市的投资公司，大基金二期的投资重点主要聚集集成电路产业链布局，不仅继续支持大企业、链主导骨干企业做大做强，同时，全面关注下游应用，希望下游产业需求带动半导体行业发展。\n\
    \n烟草，央企，国企，省市投资公司，所有的资本都来自于隐形税收。\n\n烟草，移动，电信等含税量，大家都是知道的，省市级的投资公司，资金主要来自于哪里？\n\
    \n土地财政收入。\n\n部分金融公司的资金来自于哪里？股票市场的骚操作。\n\n金融市场，股票市场的泡沫可以破裂，不破裂怎么支持科技建设。\n\n但你看到整个市场上，任何一个发达国家的崛起，有房地产泡沫破裂么？\n\
    \n除了日本东京，这个有自患倾向的金融系统内斗，主动刺破泡沫，其他没有一个国家楼市泡沫破裂。\n\n一线城市，持续上涨两百年。\n\n为什么？\n\n因为科技创造财富，金融分配财富，地产贮存财富。\n\
    \n即使是富人，财富传承也没得选，地产财富至少占一半。\n\n科技泡沫可以破，一线城市泡沫永不破，不破的泡沫，就是必须要押据的财富。\n\n代表高科技的产业，从纺织业，到电力、重工业，到汽车，到互联网、芯片，每一轮新科技崛起，原来的行业就逐步沦为产能过剩，利润薄如刀片。\n\
    \n泡沫带来新晋富豪，原来老行业的人，如果大量持有不动产，就还能安享晚年，实现财富传承。\n\n如果没有不动产，科技交替之时，就是老一代人破产清算之日。\n\
    \n一生之努力，全部白费，这是中国很多传统行业里，小老板们最终的下场分水岭。\n\n大而不能倒。\n\n科技创造财富，金融分配财富，楼市贮存财富。\n\n\
    请问，中国的楼市贮存的财富规模是多少？400万亿人民币。\n\n这是个什么概念？\n\n中国目前 M2 是 200 万亿，是 M2 的两倍。\n\n中国目前\
    \ GDP 规模是 100 万亿，是中国 GDP 的 4 倍。\n\n中国整个 A 股市场，3777 家上市公司，总市值 60 万亿，流通市值 50 万亿，楼市是股市的\
    \ 8 倍。\n\n中国股市，是行情市，是赌场，自由交易，恐慌情绪来的时候，国家队都救不过来，扶不起的阿斗，重融资而轻分红，是支援国家搞建设的提款机。\n\n\
    即使说股市和楼市，两个都有泡沫。\n\n哪个市场更容易掌控？\n\n楼市完胜。\n\n限购、限售、限贷、房票等一顿骚操作，把交易量扼住，把整个市场冷冻，想稳就稳，想升就升，本来想写想降就降，但是降对谁都没好处，所以就不想降。\n\
    \n泡沫，是正常的市场现象，是市场经济的自然结果，你彻底搞计划经济，那就没有泡沫了，但你想过那样的日子么？\n\n经常有新闻报道，说某企业危难关头卖房子度过难关，文章主要是抨击房价高，这是典型的逻辑混乱。\n\
    \n任何企业，都会有躲不开的经济周期，就会有行业或企业本身的起步期--成长期--成熟期--衰落期。这和普通人的一生轨迹是一样的。\n\n在成长期-成熟期，购置房产，形成财富增值效应，在衰落期用来自救，不是一个很励志的故事么?\n\
    \n为什么一个励志的故事，被讲成了一个悲情的故事？\n\n企业或个人，在事业高峰期赚的钱，不用来购置资产，只拿去挥霍，吃喝玩乐，在衰落期或晚年的时候，买房子，博同情么？\n\
    \n财富是需要贮存的，节奏是要自己去设置的。\n\n举个例子，2020年，有两个公司的决策，供各位参考。\n\n一个是力帆汽车，当年国产造车势力中不可小觑的角色，现在已经基本掉队了。\n\
    \n力帆是一家重庆的公司。伴随着重庆城市的扩大，力帆鸳鸯造车库周围已很是繁华，卖掉这块地，扣除所有费用，包括搬迁费用，还可以净赚20个亿左右。\n\n卖掉这块地760亩，在重庆更远的地方，再买一块地，800亩，十年后也会很值钱。\n\
    \n如果没有这块地，力帆集团现在主业非常差，欠债很多，差不多可以破产清算了。\n\n这是一个衰落期的故事。\n\n达叔接下来，再说一个明星级别的公司—-OPPO。\n\
    \n对，就是你知道的那个做手机的 OPPO，达叔说这个公司处于上升期，没人质疑吧？\n\nOPPO 的骚操作，利用各地政府，都喜欢总部经济，大力招商让某知名公司把总部落在自己的城市。\n\
    \nOPPO 总部在哪里？在深圳。\n\n但是，谁说一个公司只能有一个总部？\n\nOPPO 在杭州、重庆、东莞、成都等新一线城市，不停地拿地建总部，价格极其便宜。\n\
    \n土地不是招投标么？\n\n不好意思，问出这样的问题，一看就是没有投过标，没有做过生意，达叔每年各种投标几十次，太知道真实的玩法了，只要你来建总部，地方政府保证你能拿到。\n\
    \n那总部在深圳，怎么玩？\n\n起名字，是最大的创意。\n\n- OPPO 在深圳是新总部；\n- 在杭州是全球终端总部，做手机和电视；\n- 在重庆是重庆科技园，算科技总部；\n\
    - 在成都有研发中心，算研发中心；\n- 在东莞是科创园，叫科创总部。\n\n总之，全是总部，只要盖的足够华丽，叫个总部，没有问题。\n\n趁有钱，趁着企业上升期，企业在囤地。\n\
    \n趁有钱，趁着事业上升期，个人要囤房产。\n\n公众号懒人搜索，懒人专属群分享\n\n房子，无论是对企业，还是对个人，都是抵御人生不测的重要工具。\n\n\
    只要泡沫不破，就不是泡沫，而是繁荣，拒绝拥抱泡沫的人，就是拒绝拥抱财富。\n\n但是有些人宁愿相信月薪几千元的小编胡言乱语，也不相信有钱人的真金白银做的选择。\n\
    \n达叔尽力了，祝各位幸福。\n\n## 第十四篇 FC#14 职业有贵贱，发展有快慢，危机中的选择一年胜十年\n\n这个世界有太多谎言，而绝大多数都是用来骗穷人的。\n\
    \n就像宗教一样，是人民的鸦片，这句话好像是马克思说的。\n\n三百六十行，行行出状元；职业没有贵贱之分：新华字典里是这么写的：\n\n| 名称 | 符号\
    \ | 用法说明 | 举例 |\n| :--- | :--- | :--- | :--- |\n| 冒号 | : | 3. 用于总说性话语的后边，表示引起下文的分说。\
    \ | 北京紫禁城有四座城门：午门、神武门、东华门和西华门。 |\n| | | 4. 用于需要解释的词语后边，表示引出解释或说明。 | 外文书书展销会日期：10月20日至11月10日\
    \ 时间：上午8时至下午4时 地点：北京市朝阳区体究路15号 主办单位：中国图书进出口总公司 |\n| | | 5. 用于总说性话语的前边，以总结上文。 |\
    \ 张老师叫“二子”“二丫”；我在百货公司当售货员，我们都有光明的前途。 |\n| | | 1. 用于行文中直接引用的部分。 | “偷机拐顶，逮婆这”，这句话，流传到今天至少有两年半了。\
    \ 达经济学 |\n\n张华考上了北京大学；李萍进了中等技术学校；我在百货公司当售货员：我们都有光明的前途。\n\n所以，《新华字典》，只有在小学的时候用一下，长大就不再用了，有毒。\n\
    \n职业有贵贱。\n\n达叔以前讲过，达叔小时候在农村放牛、很长时间，都以为自己将来能成首富的，为了这个事，从高中开始，还真的谋划过。\n\n别的同学，上体育课、自由活动时跑去谈恋爱、打篮球了。\n\
    \n达叔一个人跑到操场前面的图书馆，把所有商业杂志拿出来研究，尤其是财富排行榜，主要研究两个方向：\n\n- 1、富豪们出自于哪些行业；\n- 2、富豪们出自于哪些地方。\n\
    \n达叔上高中那会，IT 类科技新贵还没爆发，富豪主要集中在地产、能源、金融几个领域；地理的分布上，就主要集中在北上广江浙。\n\n掐指一算，上海距离最近，金融中心，考大学就去上海，挑了一个上海的经济类院校，稀里糊涂还考上了。\n\
    \n虽然最后没有从事金融行业，原因和经过在 YL 05 医疗经济学，构建个人发展和投资的方法论，这篇文章里写过。\n\n但心里一直清晰的知道，如果没有金融的加持，一个人或组织，甚至产业，是翻不出什么花来的。\n\
    \n金融的本质是对资金跨时间、跨空间的重新配置。\n\n在这里，钱就是生产资料。\n\n国家每次对一个战略产业大力扶持，最简单的方法就是金融方面的支持。比如目前对芯片领域，更低的贷款利息、更长的贷款周期、税收减免等措施。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_107_0.png)\n\n所有的支持，说到底就是给钱、给政策，其他都是虚的，在职场亦是如此。\n\
    \n那么作为个人，我们能利用的金融方案有哪些？\n\n- 1、信用卡：额度高低不一，给你的账期最长50多天，一旦分期，实际年利率就15%左右了。\n- 2、信用贷：由于授信金额较大，是最体现职业贵贱的。达叔当年刚开始玩房产投资的时候，一度还挺喝瑟，觉得自己是500强投资企业，那还不是一高人一等？选了个不错的产品，优点如下：\n\
    \    - 1）、采用信用方式一一无需担保、无需抵押，授信金额为50万、40万、30万、20万四种；\n    - 2）、授信时间长——提供最长时间为3年的授信，到期后可申请延期；\n\
    \    - 3）、手续简便，高效快捷——一次授信，循环有效，授信期间内，可通过柜台或网上银行交易，办理贷款手续；\n    - 4）、关键利率还便宜，甚至可以是基准利率，上下浮动\
    \ 10%。\n\n在华东地区某知名信用贷银行办理，问了一圈，心都凉 了。\n\n### 适用对象\n\n- 白领通道主要对白领阶层，主要包括：\n   \
    \ 1. 公务员；\n    2. 教师、医生或其他事业单位编制人员；\n    3. 企业单位的中高层管理人员（企业注册资本金原则上1000万以上）；\n\
    \    4. 通信、电力、烟草、炼化、盐务、律师、会计师等行业稳健工作人。\n\n![](img/d747a49dab77676cf44faebe24df049c_108_0.png)\n\
    \n各位即使是一线外资名企，收入较高的销售或地区经理，在银行眼里，不好意思，都不值钱。\n\n在金融系统眼里，公务员、事业编制、央企等才是真正 的自家人。达叔当年年纪小，第一次感受到“官本位”思想的肆虐，权力和位子真的可以\
    \ 和金钱画上等号。\n\n职业有没有贵贱，看看金融机构对 待你的眼神，就知道了。\n\n达叔有一帮同学在银行，当年年轻气盛，还找其中 一个聊天，我明明流水不错，一年也能有\
    \ 20-30万，为啥我申请不到这个产品？\n\n同学说，原因有三个：\n\n- 1、你的收入不稳定，你的职业也不稳定，经常跳来跳去，看天吃饭，而我们选的人轻易不会跳，很稳定，稳定在银行眼里就代表着可控、安全。\n\
    - 2)、你没啥灰色收入，在中国无亏夜草不肥，我们选的从业者不靠工资收入。\n- 3)、自己人总是要照顾一下的，你们外企算是个啥东西，自己玩去吧。\n\n\
    达叔被惹的没脾气，也就老实了，乖乖去玩别的。\n\n- 3、房贷：年限最长可以达到30年，利率也是基准利率上下浮动一点。按照目前的通货膨胀率，就是当权者给人民仅有的一项金融福利。\n\
    \n就这个福利，还被广大社畜无限吐槽，不要做房奴。\n\n对房贷的态度，是普通人一生财富上限的分水岭，彼之砒霜、吾之蜜糖。\n\n达叔有的时候想，这个世界真是太魔幻，分不清楚爱还是嫌。\n\
    \n- 4、其他经营贷等产品，需要成立公司，普通人更不敢玩，在此不表。\n\n危机中的选择，一年胜十年。\n\n达叔曾经在疫情期间，刚玩自媒体，在知乎上，写过一篇关于通货膨胀的文章，和一帮傻了吧唧的文艺青年激辩，再后来也懒得理这些人了。\n\
    \n每年全球央行的行长，都会在德克萨斯的一个小镇上开个年会，这个小镇名叫 Jackson Hole。\n\n以前，全部都是闭门会议，各国央行行长们对货币政策、货币体系的主张、意见、实践进行分享。\n\
    \n我们普通人的命运，很多时候，都是被别人的一个政策改写的，普通人浑浑噩噩、全然不知，度过一生。\n\n今年受疫情影响，全球央行行长会议改为了线上会议，历史上第一次给了普通人围观吃瓜的机会。\n\
    \n全球大杀手——美元，掌舵人美联储主席鲍威尔老师，慢悠悠的吐出了三个词“Average Inflation Targeting”（平均通胀目标）。\n\n\
    很多事情，能做不能说，一旦说出来了，事情的性质就变了。\n\n在比较负责的政府那里，一直而努力把通胀率控制在 2%，另外一个货币政策和财政政策的准绳就是看失业率。就这么个曲线，画出的人，拿了个诺贝尔经济学奖。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_110_0.png)\n\n如果失业率过高，就考虑降息来刺激经济，如果失业率过低，就会考虑加息。\n\
    \n有的小伙伴读到这里，又懵透了，失业率过低，也不好？\n\n是的。\n\n失业率过低，代表经济过热，经济过热可能导致高通胀，高通胀是所有执政者的噩梦，是要被人民唾弃的。\n\
    \n那么 2% 的通胀率，这么多年来，绝大多数国家能实现这个目标么？\n\n从结果来看，很难。\n\n中国的通胀率只有在统计局的努力下，才能实现 2%，各位的真实感受是多少，达叔也不方便展开说。\n\
    \n虽然很难实现，但是都是私底下通过玩数字游戏，把结果弄的没那么离谱。但是这次美联储主席鲍威尔老师，在全球央行行长会议上，撕下了最后一块遮羞布。\n\n这个\
    \ “Average Inflation Targeting”（平均通胀目标），简称 AIT，号称不再死死盯住通胀数字 2%，而允许通胀率在 “一段时间”\
    \ 内、“适度” 高于 2%。\n\n直白点，就是放松通胀膨胀标准，为了实现总体经济和财政政策，可以容忍更高的通货膨胀。\n\n比如，定一个 2 年内 3%\
    \ 的 AIT，加入第一年通胀才 1%，那么后面的一年，可以容忍 5% 的通胀率，因为计算公式 = (1%+5%)/2=3%，如果还没讲明白，达叔拉讲个例子。\n"
  mdcn: "\n![](img/d747a49dab77676cf44faebe24df049c_94_0.png)\n\n蓝图为2017年出台的限购圈\n\
    红圈为2020年最新出台的限购圈\n\n制图：宁波晚报\n\n你能不能再分析出一些机会？\n\n达叔今天举了三个城市的例子，郑州、洛阳一起一落，河南的权贵跟着省政府驻地迁徙，宁波的权贵们跟着宁波市政府迁徙。\n\
    \n各位不要只低头工作，要努力研究自己所在的城市，研究自己所在的行业，自己所在的公司。\n\n这些是你的平台，是你的船，是你的电梯。\n\n很多人终其一生，职场上赚的钱，并没有资产升值来的多。\n\
    \n跟着权贵走，不要跑偏了。\n\n推荐一本书，北大教授徐远的《城里的房子》，希望对各位有帮助。\n\n## 第十三篇 FC#13 泡沫制造繁荣，拒绝泡沫，就是拒绝财富\n\
    \n泡沫，是一个被妖魔化的词汇，没有泡沫，就没有繁荣，就没有人类科技的进步。\n\n泡沫被妖魔化，就如同“改革”被神话了一样，都是中国目前特定语境下的产物。\n\
    \n历史上各种改革、变法，有成功的，有失败的，改革是个中性词，没人保证一定会成功，但目前所有人都觉得改革，深化改革，带有褒义的色彩，这本身就是40年的思维惯性，是一种思维懒惰的行为。\n\
    \n泡沫，中国所有人闻“泡沫色变”，新中国建国以来，什么资产有过泡沫？什么泡沫破灭过？\n\n除了连赌场都不如的股市，韭菜收割机，谁能给达叔举出几个例子？\n\
    \n所有媒体小编嘴里说的楼市泡沫，完全是一派胡言。\n\n经济发展必然伴随之资产膨胀，这种货币现象，不叫泡沫，叫繁荣。\n\n繁荣和泡沫，如影随形。\n\n\
    世界三大坚不可摧的泡沫，美国的股市，日本的债市，中国的楼市。\n\n这是三大经济体的命脉，是政权攫取财富、保持繁荣的压舱石，只要他泡沫不破，就是繁荣。\n\n\
    无泡沫，不繁荣。\n\n中美对抗，科技封疆，举国体制下，中国必将迎来科技史上的最大泡沫。\n\n没有泡沫，无法完成强国攀升，没有尸骨累累，就没有屹立于世界的强者。\n\
    \n美国纳斯达克科技股泡沫历史，1999年-2001年间上市的科技公司，存续率只有6.8%，其他的全部死掉，投资者血本无归。\n\n但是存活下来的企业，称霸全球，深刻影响全世界。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_96_0.png)\n\n1995年到2000年，从743点一路冲到5132点，涨幅590%，\n\
    \n随后19个月暴跌78%，一路跌至1108点。\n\n这个叫泡沫破裂。\n\n一将功成万骨枯，期间亚马逊，奈飞，苹果，英特尔无一幸免，最多跌去90%的市值。\n\
    \n中国股票市场，动辄市盈率高达100多的科技、医药类公司，就是典型的泡沫。\n\n1999年，有记者问比尔盖茨，你们微软是不是泡沫？\n\n盖茨说，当然是泡沫，但泡沫有什么不好？问题不在于泡沫，而在于泡沫对网络行业带来了巨大的新资本，高回报必然伴随着高风险，必然推动行业更快创新。\n\
    \n多年以后，亚马逊的贝索斯承认，是泡沫顶峰时的融资让亚马逊在2000年末，账上还有11亿美元的现金，保证其没有死掉，一路走到今天，持续创新。\n\n特斯拉，成立17年，亏损17年，没有泡沫带来的巨大财富效应，就没有人才走入这个行业，就走不了这么漫长的黑夜。\n\
    \n泡沫，是这个世界上最伟大的，最合法的财富创造活动。\n\n索罗斯有一句名言，世界经济史是一部谎言史，人生要发财，就必須识别泡沫，拥抱泡沫，在泡沫之前离开泡沫。\n\
    \n泡沫，只会发生在科技领域么？\n\n不是。\n\n世界经济史拉开序幕之后，泡沫就伴随着每一个帝国的崛起。\n\n工业革命带来运河热，蒸汽革命和铁路革命带来铁路热，能源革命带来能源热，所有技术革命背后，必然带来金融泡沫。\n\
    \n没有金融泡沫的技术，不配叫新技术。\n\n技术兴起→高速发展→繁荣过热→破裂衰退，形成寡头，称霸世界，繁荣持续。\n\n| 轮次 | 技术革命(核心产业)\
    \ | 次产业 | 热门期 | 时间 | 热门期概述 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 第一次\
    \ | 工业革命(蒸汽、能源) | (1777) | 运河热 | 1769~97 | 大英帝国时代的盛世 |\n| 第二次 | 蒸汽机时代(煤气、钢铁) |\
    \ (1829) | 铁路热 | 1848~50 | 维多利亚时代的繁荣 |\n| 第三次 | 钢铁、电气、重工业时代(汽车、飞机) | (1876) |\
    \ 信贷资金化的全球市场(美欧股灾，德国) | 1880~98 | 1896~1914欧洲美好时代，1890s~1920s美国进步时代 |\n| 第四次 |\
    \ 石油、汽车和大规模产业时代(汽车，航空航天) | (1908) | 美国咆哮的20年代 | 欧洲1929~33 美国1929~43 | 1930s大萧条，二战后的黄金年代\
    \ |\n| 第五次 | 信息和智能时代(美国) | (1977) | 新兴市场互联网泡沫 | 美国2007~2008~??? | 2077 |\n| 大爆炸\
    \ | 大规模生产制造网络 | 泡沫 | 制造重组 | | |\n\n旧世界需要被打破，打破是要代价的，这个代价谁来支付？国家力、新秩序的组织。这个组织可以是公司，可以是新的国家力量。\n\
    \n但旧世界会心安理得的放弃既得利益吗？不会的。\n\n新旧交替，如果不是战争力量解决，就是经济力量解决。\n\n没有泡沫化，就无法集中规模巨大的金融力量，无法吸引到最尖端的人才，无法绑架最强大的权贵，无法打赢新旧交替之战。\n\
    \n达叔之前在文章中有过说，#J#17 #对不起来，在决策者眼中，穷人不缺钱，富人才缺钱，这个钱放在穷人的手里，是没有多大意义的，不如集中起来帮助国家一起打赢科技战。\n\
    \n如果你扒开底层研究目前支持中国造芯片的国家基金，资金来源来自于哪里？\n\n大基金一期成立于 2014 年 9 月 24 日，一期总规模为 1387 亿元，重点投向了集成电路芯片制造业，兼顾了芯片设计、封装测试、设备和材料等产业。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_99_0.png)\n\n![](img/d747a49dab77676cf44faebe24df049c_99_1.png)\n\
    \n而近期国家集成电路信息公示系统显示，国家集成电路产业投资基金二期股份有限公司（大基金二期）已于 2019 年 10 月 22 日正式注册成立，注册资本\
    \ 2041.5 亿元。大基金二期主要发起人和投资人共有27家，股东包括财邦国际、国开金融有限责任公司、中国烟草总公司等国家部委和央企，还有多地省市的投资公司，大基金二期的投资重点主要聚集集成电路产业链布局，不仅继续支持大企业、链主导骨干企业做大做强，同时，全面关注下游应用，希望下游产业需求带动半导体行业发展。\n\
    \n烟草，央企，国企，省市投资公司，所有的资本都来自于隐形税收。\n\n烟草，移动，电信等含税量，大家都是知道的，省市级的投资公司，资金主要来自于哪里？\n\
    \n土地财政收入。\n\n部分金融公司的资金来自于哪里？股票市场的骚操作。\n\n金融市场，股票市场的泡沫可以破裂，不破裂怎么支持科技建设。\n\n但你看到整个市场上，任何一个发达国家的崛起，有房地产泡沫破裂么？\n\
    \n除了日本东京，这个有自患倾向的金融系统内斗，主动刺破泡沫，其他没有一个国家楼市泡沫破裂。\n\n一线城市，持续上涨两百年。\n\n为什么？\n\n因为科技创造财富，金融分配财富，地产贮存财富。\n\
    \n即使是富人，财富传承也没得选，地产财富至少占一半。\n\n科技泡沫可以破，一线城市泡沫永不破，不破的泡沫，就是必须要押据的财富。\n\n代表高科技的产业，从纺织业，到电力、重工业，到汽车，到互联网、芯片，每一轮新科技崛起，原来的行业就逐步沦为产能过剩，利润薄如刀片。\n\
    \n泡沫带来新晋富豪，原来老行业的人，如果大量持有不动产，就还能安享晚年，实现财富传承。\n\n如果没有不动产，科技交替之时，就是老一代人破产清算之日。\n\
    \n一生之努力，全部白费，这是中国很多传统行业里，小老板们最终的下场分水岭。\n\n大而不能倒。\n\n科技创造财富，金融分配财富，楼市贮存财富。\n\n\
    请问，中国的楼市贮存的财富规模是多少？400万亿人民币。\n\n这是个什么概念？\n\n中国目前 M2 是 200 万亿，是 M2 的两倍。\n\n中国目前\
    \ GDP 规模是 100 万亿，是中国 GDP 的 4 倍。\n\n中国整个 A 股市场，3777 家上市公司，总市值 60 万亿，流通市值 50 万亿，楼市是股市的\
    \ 8 倍。\n\n中国股市，是行情市，是赌场，自由交易，恐慌情绪来的时候，国家队都救不过来，扶不起的阿斗，重融资而轻分红，是支援国家搞建设的提款机。\n\n\
    即使说股市和楼市，两个都有泡沫。\n\n哪个市场更容易掌控？\n\n楼市完胜。\n\n限购、限售、限贷、房票等一顿骚操作，把交易量扼住，把整个市场冷冻，想稳就稳，想升就升，本来想写想降就降，但是降对谁都没好处，所以就不想降。\n\
    \n泡沫，是正常的市场现象，是市场经济的自然结果，你彻底搞计划经济，那就没有泡沫了，但你想过那样的日子么？\n\n经常有新闻报道，说某企业危难关头卖房子度过难关，文章主要是抨击房价高，这是典型的逻辑混乱。\n\
    \n任何企业，都会有躲不开的经济周期，就会有行业或企业本身的起步期--成长期--成熟期--衰落期。这和普通人的一生轨迹是一样的。\n\n在成长期-成熟期，购置房产，形成财富增值效应，在衰落期用来自救，不是一个很励志的故事么?\n\
    \n为什么一个励志的故事，被讲成了一个悲情的故事？\n\n企业或个人，在事业高峰期赚的钱，不用来购置资产，只拿去挥霍，吃喝玩乐，在衰落期或晚年的时候，买房子，博同情么？\n\
    \n财富是需要贮存的，节奏是要自己去设置的。\n\n举个例子，2020年，有两个公司的决策，供各位参考。\n\n一个是力帆汽车，当年国产造车势力中不可小觑的角色，现在已经基本掉队了。\n\
    \n力帆是一家重庆的公司。伴随着重庆城市的扩大，力帆鸳鸯造车库周围已很是繁华，卖掉这块地，扣除所有费用，包括搬迁费用，还可以净赚20个亿左右。\n\n卖掉这块地760亩，在重庆更远的地方，再买一块地，800亩，十年后也会很值钱。\n\
    \n如果没有这块地，力帆集团现在主业非常差，欠债很多，差不多可以破产清算了。\n\n这是一个衰落期的故事。\n\n达叔接下来，再说一个明星级别的公司—-OPPO。\n\
    \n对，就是你知道的那个做手机的 OPPO，达叔说这个公司处于上升期，没人质疑吧？\n\nOPPO 的骚操作，利用各地政府，都喜欢总部经济，大力招商让某知名公司把总部落在自己的城市。\n\
    \nOPPO 总部在哪里？在深圳。\n\n但是，谁说一个公司只能有一个总部？\n\nOPPO 在杭州、重庆、东莞、成都等新一线城市，不停地拿地建总部，价格极其便宜。\n\
    \n土地不是招投标么？\n\n不好意思，问出这样的问题，一看就是没有投过标，没有做过生意，达叔每年各种投标几十次，太知道真实的玩法了，只要你来建总部，地方政府保证你能拿到。\n\
    \n那总部在深圳，怎么玩？\n\n起名字，是最大的创意。\n\n- OPPO 在深圳是新总部；\n- 在杭州是全球终端总部，做手机和电视；\n- 在重庆是重庆科技园，算科技总部；\n\
    - 在成都有研发中心，算研发中心；\n- 在东莞是科创园，叫科创总部。\n\n总之，全是总部，只要盖的足够华丽，叫个总部，没有问题。\n\n趁有钱，趁着企业上升期，企业在囤地。\n\
    \n趁有钱，趁着事业上升期，个人要囤房产。\n\n公众号懒人搜索，懒人专属群分享\n\n房子，无论是对企业，还是对个人，都是抵御人生不测的重要工具。\n\n\
    只要泡沫不破，就不是泡沫，而是繁荣，拒绝拥抱泡沫的人，就是拒绝拥抱财富。\n\n但是有些人宁愿相信月薪几千元的小编胡言乱语，也不相信有钱人的真金白银做的选择。\n\
    \n达叔尽力了，祝各位幸福。\n\n## 第十四篇 FC#14 职业有贵贱，发展有快慢，危机中的选择一年胜十年\n\n这个世界有太多谎言，而绝大多数都是用来骗穷人的。\n\
    \n就像宗教一样，是人民的鸦片，这句话好像是马克思说的。\n\n三百六十行，行行出状元；职业没有贵贱之分：新华字典里是这么写的：\n\n| 名称 | 符号\
    \ | 用法说明 | 举例 |\n| :--- | :--- | :--- | :--- |\n| 冒号 | : | 3. 用于总说性话语的后边，表示引起下文的分说。\
    \ | 北京紫禁城有四座城门：午门、神武门、东华门和西华门。 |\n| | | 4. 用于需要解释的词语后边，表示引出解释或说明。 | 外文书书展销会日期：10月20日至11月10日\
    \ 时间：上午8时至下午4时 地点：北京市朝阳区体究路15号 主办单位：中国图书进出口总公司 |\n| | | 5. 用于总说性话语的前边，以总结上文。 |\
    \ 张老师叫“二子”“二丫”；我在百货公司当售货员，我们都有光明的前途。 |\n| | | 1. 用于行文中直接引用的部分。 | “偷机拐顶，逮婆这”，这句话，流传到今天至少有两年半了。\
    \ 达经济学 |\n\n张华考上了北京大学；李萍进了中等技术学校；我在百货公司当售货员：我们都有光明的前途。\n\n所以，《新华字典》，只有在小学的时候用一下，长大就不再用了，有毒。\n\
    \n职业有贵贱。\n\n达叔以前讲过，达叔小时候在农村放牛、很长时间，都以为自己将来能成首富的，为了这个事，从高中开始，还真的谋划过。\n\n别的同学，上体育课、自由活动时跑去谈恋爱、打篮球了。\n\
    \n达叔一个人跑到操场前面的图书馆，把所有商业杂志拿出来研究，尤其是财富排行榜，主要研究两个方向：\n\n- 1、富豪们出自于哪些行业；\n- 2、富豪们出自于哪些地方。\n\
    \n达叔上高中那会，IT 类科技新贵还没爆发，富豪主要集中在地产、能源、金融几个领域；地理的分布上，就主要集中在北上广江浙。\n\n掐指一算，上海距离最近，金融中心，考大学就去上海，挑了一个上海的经济类院校，稀里糊涂还考上了。\n\
    \n虽然最后没有从事金融行业，原因和经过在 YL 05 医疗经济学，构建个人发展和投资的方法论，这篇文章里写过。\n\n但心里一直清晰的知道，如果没有金融的加持，一个人或组织，甚至产业，是翻不出什么花来的。\n\
    \n金融的本质是对资金跨时间、跨空间的重新配置。\n\n在这里，钱就是生产资料。\n\n国家每次对一个战略产业大力扶持，最简单的方法就是金融方面的支持。比如目前对芯片领域，更低的贷款利息、更长的贷款周期、税收减免等措施。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_107_0.png)\n\n所有的支持，说到底就是给钱、给政策，其他都是虚的，在职场亦是如此。\n\
    \n那么作为个人，我们能利用的金融方案有哪些？\n\n- 1、信用卡：额度高低不一，给你的账期最长50多天，一旦分期，实际年利率就15%左右了。\n- 2、信用贷：由于授信金额较大，是最体现职业贵贱的。达叔当年刚开始玩房产投资的时候，一度还挺喝瑟，觉得自己是500强投资企业，那还不是一高人一等？选了个不错的产品，优点如下：\n\
    \    - 1）、采用信用方式一一无需担保、无需抵押，授信金额为50万、40万、30万、20万四种；\n    - 2）、授信时间长——提供最长时间为3年的授信，到期后可申请延期；\n\
    \    - 3）、手续简便，高效快捷——一次授信，循环有效，授信期间内，可通过柜台或网上银行交易，办理贷款手续；\n    - 4）、关键利率还便宜，甚至可以是基准利率，上下浮动\
    \ 10%。\n\n在华东地区某知名信用贷银行办理，问了一圈，心都凉 了。\n\n### 适用对象\n\n- 白领通道主要对白领阶层，主要包括：\n   \
    \ 1. 公务员；\n    2. 教师、医生或其他事业单位编制人员；\n    3. 企业单位的中高层管理人员（企业注册资本金原则上1000万以上）；\n\
    \    4. 通信、电力、烟草、炼化、盐务、律师、会计师等行业稳健工作人。\n\n![](img/d747a49dab77676cf44faebe24df049c_108_0.png)\n\
    \n各位即使是一线外资名企，收入较高的销售或地区经理，在银行眼里，不好意思，都不值钱。\n\n在金融系统眼里，公务员、事业编制、央企等才是真正 的自家人。达叔当年年纪小，第一次感受到“官本位”思想的肆虐，权力和位子真的可以\
    \ 和金钱画上等号。\n\n职业有没有贵贱，看看金融机构对 待你的眼神，就知道了。\n\n达叔有一帮同学在银行，当年年轻气盛，还找其中 一个聊天，我明明流水不错，一年也能有\
    \ 20-30万，为啥我申请不到这个产品？\n\n同学说，原因有三个：\n\n- 1、你的收入不稳定，你的职业也不稳定，经常跳来跳去，看天吃饭，而我们选的人轻易不会跳，很稳定，稳定在银行眼里就代表着可控、安全。\n\
    - 2)、你没啥灰色收入，在中国无亏夜草不肥，我们选的从业者不靠工资收入。\n- 3)、自己人总是要照顾一下的，你们外企算是个啥东西，自己玩去吧。\n\n\
    达叔被惹的没脾气，也就老实了，乖乖去玩别的。\n\n- 3、房贷：年限最长可以达到30年，利率也是基准利率上下浮动一点。按照目前的通货膨胀率，就是当权者给人民仅有的一项金融福利。\n\
    \n就这个福利，还被广大社畜无限吐槽，不要做房奴。\n\n对房贷的态度，是普通人一生财富上限的分水岭，彼之砒霜、吾之蜜糖。\n\n达叔有的时候想，这个世界真是太魔幻，分不清楚爱还是嫌。\n\
    \n- 4、其他经营贷等产品，需要成立公司，普通人更不敢玩，在此不表。\n\n危机中的选择，一年胜十年。\n\n达叔曾经在疫情期间，刚玩自媒体，在知乎上，写过一篇关于通货膨胀的文章，和一帮傻了吧唧的文艺青年激辩，再后来也懒得理这些人了。\n\
    \n每年全球央行的行长，都会在德克萨斯的一个小镇上开个年会，这个小镇名叫 Jackson Hole。\n\n以前，全部都是闭门会议，各国央行行长们对货币政策、货币体系的主张、意见、实践进行分享。\n\
    \n我们普通人的命运，很多时候，都是被别人的一个政策改写的，普通人浑浑噩噩、全然不知，度过一生。\n\n今年受疫情影响，全球央行行长会议改为了线上会议，历史上第一次给了普通人围观吃瓜的机会。\n\
    \n全球大杀手——美元，掌舵人美联储主席鲍威尔老师，慢悠悠的吐出了三个词“Average Inflation Targeting”（平均通胀目标）。\n\n\
    很多事情，能做不能说，一旦说出来了，事情的性质就变了。\n\n在比较负责的政府那里，一直而努力把通胀率控制在 2%，另外一个货币政策和财政政策的准绳就是看失业率。就这么个曲线，画出的人，拿了个诺贝尔经济学奖。\n\
    \n![](img/d747a49dab77676cf44faebe24df049c_110_0.png)\n\n如果失业率过高，就考虑降息来刺激经济，如果失业率过低，就会考虑加息。\n\
    \n有的小伙伴读到这里，又懵透了，失业率过低，也不好？\n\n是的。\n\n失业率过低，代表经济过热，经济过热可能导致高通胀，高通胀是所有执政者的噩梦，是要被人民唾弃的。\n\
    \n那么 2% 的通胀率，这么多年来，绝大多数国家能实现这个目标么？\n\n从结果来看，很难。\n\n中国的通胀率只有在统计局的努力下，才能实现 2%，各位的真实感受是多少，达叔也不方便展开说。\n\
    \n虽然很难实现，但是都是私底下通过玩数字游戏，把结果弄的没那么离谱。但是这次美联储主席鲍威尔老师，在全球央行行长会议上，撕下了最后一块遮羞布。\n\n这个\
    \ “Average Inflation Targeting”（平均通胀目标），简称 AIT，号称不再死死盯住通胀数字 2%，而允许通胀率在 “一段时间”\
    \ 内、“适度” 高于 2%。\n\n直白点，就是放松通胀膨胀标准，为了实现总体经济和财政政策，可以容忍更高的通货膨胀。\n\n比如，定一个 2 年内 3%\
    \ 的 AIT，加入第一年通胀才 1%，那么后面的一年，可以容忍 5% 的通胀率，因为计算公式 = (1%+5%)/2=3%，如果还没讲明白，达叔拉讲个例子。\n"
