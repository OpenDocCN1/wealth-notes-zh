    \n3. 晚上，有个读者来找达叔聊天，某三甲医院的外科医生，达叔说，我正在忙，你有事留言一下。\n\n对方给俺发来一张截图，是和一个视频博主大V聊天，两个人探讨深圳房价，对方就给他推荐了一个公众号，达叔经济学。\n\
