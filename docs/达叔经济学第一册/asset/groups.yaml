    我找到了钱流动的方向，谁靠钱最近，谁就能崛起，其他都是骗人的。


    有一个小故事，达叔之前在文章里讲过：


    孩子问他做银行家的爸爸，咱家银行里的钱，都是储户的，咱家怎么赚钱的？


    爸爸让孩子去把冰箱里的肉拿出来，孩子拿出来了。


    爸爸让他再放回去，孩子放回去了。


    你看，肉还在冰箱里，你看看你手上多了什么？


    一手的油。


    同理，大组织的采购是肥缺，投资公司的投资经理是个肥缺，阿里巴巴管理商家的店小二都是反腐的高发地。


    为什么？


    因为离钱近。


    中国强势的利益集团有哪几个？


    官产学媒，四大集团。


    拆开讲就是，公务员系统，企事业单位系统，高校研究学术圈，最后一个是媒体系统（这个正在没落）。


    这叔说的观点，可能不够积极，但是绝对不会坑你。


    大萧条危机来临的时候，这四大集团会裁员么？不会。


    不仅不会，甚至可能会扩大招收，各个有关系的人，都把身边人塞进这些系统，这也是中国老一辈劝孩子拼命考公务员、进企事业单位的原因之一，铁饭碗。


    在经济繁荣期，铁饭碗是很多奋斗青年瞧不上的，但在萧条期，的确是牺牲效率、维持社会稳定的一个缓冲器。


    不是这四个体系的普通人，该怎么办？


    任何一个体系，都有它的外溢。


    以医疗系统为例，1 万亿元抗疫特别国债，直通地方，2020 年必然是各大医疗系统突击花钱的时机。和 2003 年 SARS 后的中国一样，会崛起一批医疗人。


    ### 都给地方花


    - 1万亿元抗疫特别国债 主要用于地方公共卫生等 基础设施建设和抗疫相关支出

    - 3.75万亿元地方政府专项债券 提高专项债券可用作项目资本金的比例 中央预算内投资安排6000亿元 有效支持补短板、惠民生、促消费、扩内需

    - 财政赤字1万亿元+抗疫特别国债1万亿元 全部转给地方 缓解地方财政困难 建立特殊转移支付机制，资金直达市县基层、直接惠企利民。主要用于保就业、保基本民生、保市场主体


    如果要摆摊，这才是最大的摊位。


    这个摊位，天上在撒钱，你需要的是找到产品，找到人脉，弱水三千，取一瓢饮。


    如果你是在一个江湖遥遥的城市、或者县城，可以重点关注一下，这比你摆地摊，要强的多。


    有医疗系统人脉的，可以加达叔文文微信，达叔给你推荐相关朋友去合作。


    再说一遍，不要干没有门槛的生意。


    没有人脉，做不了对公业务怎么办？


    有的人会鼓励你，多吃几顿饭，就熟悉了，这是一条路。


    但如果你实在提不起兴趣，开拓一下思路，还是有很多门路。


    贫穷是不需要学习的，只要在那躺着就可以了。


    所有个人奋斗和崛起，都是艰辛的。


    上个世纪美国大萧条时代，大批人破产、失业，但还是有人能够逆风发财。


    达叔举几个例子，供各位开拓一下脑洞：


    - 1920年美国颁布了禁酒令，美国大萧条是1929-1931年，在这期间私酿、私运酒水的生意，崛起了包括肯尼迪在内的很多家族。达叔不是教你走私啊，只是和你说，有类似这样的故事，富贵险中求。

    - 有个姑娘是在富豪中倒卖二手游艇的，经济萧条，富豪也养不起游艇了，卖也不掉。姑娘转念一想，私运酒水用掉也可以用船，用货运的船又特别容易被抓。姑娘找到走私酒水的贩子，建议他们用游艇，改装后运酒，能够大幅度提高安全性。走私贩子正面临困境，欣然同意，游艇买卖走起，佣金6%，请问姑娘有在犯法么？并没有。游艇是工具，工具是中性的。这又是一个在金矿旁边卖铲子的故事。

    - 如果你手里有一些钱，不愿意冒风险做生意，就思考资产价格在货币滥发情况下，是涨还是跌，赌对了，疫情过后，经济再次繁荣时，就赚得盆满钵满。具体，可以见达叔上一次写的文章：JJ#3
    如果大萧条来了，普通人应该怎么办?


    综上，


    - 不要被媒体忽悠，分清真假，别干没门槛的事。

    - 努力向钱多的地方靠，大萧条期间，财政放水，做对冲生意。

    - 任何时期，都有崛起的机会，不要轻易放弃，多思考，多交流，赌通货膨胀，择机买入资产，赌危机后，资产价格上涨。


    ## 第五十三篇 JJ#13 不忘初心，什么才是你该关心的经济学


    有几个读者给达叔发微信，说达叔你写的文章有点特色，很少写宏观的事。


    这就是属于特别聪慧的读者，在读文章的时候，还在动脑子，会总结，懂辨别。


    在中国，太多人天天关心中美关系、中东局势、石油价格、华为制裁，这些和你有关系么？


    上知天文，下知地理，世界局势，尽在掌握，就有一条，不赚钱。


    这是穷病，是一种知识吗啡，把有限的脑容量，挤占了，浪费了。


    你看的，都是人家想让你看到的，它既不是真相，甚至也不是假象。就是一段操纵你情绪，让开心、让你愤怒，塑造你价值观的道具。


    静下心来，关心一下自己的家庭，自己的钱包，别天天自嗨。


    达叔平时脾气不太好，但开始玩自媒体之后，见识了更多的网友之后，经常把达叔给气笑了。


    有一个家伙，曾经给达叔留言：你懂个啥经济学，现在什么世道，怎么啥人都来说几嘴经济学。


    达叔坐在书桌前，喝着冰镇苏打水，和达姩笑了半天。


    什么是经济学？有几个人懂？


    达叔之前在给学生上课的时候，教了三年的书，每次上完课，几乎都会提醒一句：教科书记上的内容、和达叔讲的可能都是错的，仅供各位参考。


    很多学生会问，老师你为啥总是这么说？


    因为经济学是一个年轻的学科，内部流派众多，每一个流派，都是逻辑自洽，却又相互打架。在具体的执行过程中，又指导出了不同的经济政策。


    ![](img/d747a49dab77676cf44faebe24df049c_441_0.png)


    请问，哪个流派是正确的？


    谁也说服不了谁，你想干什么，都能找到理论支持的。正确的，就一定有用么？


    香蕉大，香蕉皮也大。这种正确而无用的理论，我们是经常碰到的。


    达叔是一个实用主义者，正确与否达叔不太关心，达叔更关心的是，这能对我们发家致富，能带来多少帮助。


    鞋合不合脚，只有自己知道。否则，满嘴宏观经济政策，各种国际局势，如数家珍，家里穷的老婆都快跑了。生意做不了，打工升职不了，写文章不会，赚钱不行，满嘴跑火车第一名。


    知易行难，想的太多，做的太少，各位遇到这种人，躲远点。


    达叔经常在路上看到四个字，不知道各位每次看到，有没有感慨，达叔每次看到，经常要回味很久的。


    四个字：不忘初心。


    ![](img/d747a49dab77676cf44faebe24df049c_442_0.png)


    像这样的石碑，在中国的各个城市，随处可见，绝大多数是在提醒各级政府班子，不忘初心，牢记使命。


    但是，我们的初心是什么？


    娶了人家姑娘，不是为了让人家过上好日子，就让人家来听你吹牛逼的么？


    经济的初心是什么？


    世界上，本来就没有经济学这门学科，东西方都是摸着石头过河。


    翻开古代全球各国的历史书，都是王侯将相史，王侯将相们在干什么？在打架。


    打架才是历史书的主旋律，要么是政治上的打架，要么是军事上的打架，你死我活的，经济是为了更好的打架服务的。


    中国理论界一股囫囵吞枣，理论大而全，追求终极解释；西方人逻辑性强点，条理清晰，分门别类，弄出了战争论、国富论、经济学。


    两百年前，欧洲四分五裂，几百个王子公主，没事干，天天互相打架，打架空隙就相互结婚联姻，弄个更大的地盘，为了下一次打架。


    什么最烧钱？战争。打架是要钱的，巨额的。


    欧洲就屁大点地方，分裂成几十个小镇，规模有多大？放在中国也就是乡镇级别的，最大的也差不多是县级级的。


    各位不要笑，翻开日本的战国史，被日本人吹成各种战神的，织田信长、德川家康、武田信玄、丰臣秀吉等等，各个大名，使出吃奶的力气，能凑出 2-3 万兵力，平时打架几千人对几千人，还不如我们乡镇之间的械斗。


    欧洲早期战争也是这个鬼样子，经常打仗，军费怎么办？没有稳定的税收来源，打一次，能打赢就算完了，架不住常年打。


    那怎么办？借钱打架。


    那时候货币是什么？金、银等贵金属，权贵是没有印钞权的，不能随意印钞，就只能借钱了。


    先借钱，去打架，打赢了，拿到赔款，来还钱。不小心战争规模搞大了，战争时间拖久了，能不能分期付款？


    打仗就是打钱，欧洲有各种雇佣兵，花钱就能上战场卖命，谁的錢多，就听谁的。如果这是战争的真相，那么请问各个小国大臣主要工作是什么？


