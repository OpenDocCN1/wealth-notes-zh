    但那份较真的劲儿，很像达叔吹牛逼的样子，这个就对了。


    房地产增值，就是大事，是所有地方政府的大事。


    任何一个城市，但凡有新房大幅降价的趋势，居民还没生气，地方政府就会把所有想降价的家伙，关起来，开闭门会议。


