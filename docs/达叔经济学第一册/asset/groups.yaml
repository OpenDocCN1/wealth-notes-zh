    ## 1、不熟不做


    这是达叔给自己立的规矩，达叔对泰国不熟，对苏梅岛更不熟。


    ## 2、不做任何旅游地产


    虽然你说最近几年每年房价上涨 20% 以上，但是你这是一手房价，没有意义。有意义的是二手房，也就是个人与个人之间的资产交易，交易量还要大，持续的大，资产的价格才有意义。


    ## 3、没有产业支撑的城市


    苏梅岛人口 5 万，没有任何本土消费力，完全是候鸟式人口，靠旅游是没有什么意义的。买了这里的资产，大概率是砸在手里。就是自己住，天天对着海，人也会发疯的。


    ## 4、资产增值的机会


    在中国，中国的机会还会非常非常多。


    林姑娘就眉头紧锁了，开发的楼盘 60 多套房，好几年了只卖了一半，越卖心里越慌，都准备转行了。


    过江龙，战斗力打七折，跑到他国投资，还是很危险的，林姑娘算是尝到了。


    国外的绝大部分城市，都不值得投资，看着便宜，其实一点都不便宜。


    人口少，50 万的人口都算是大城市了，导致的结果就是资产流动性差。


    达叔之前讲过资产分为：安全性，流动性，收益性。


    不动产在政局稳定的国家，安全性一般都有保障，流动性差的话，国外房产收益性如何？


    收益率并不高，主要体现在持有成本高，各种税费加起来每年在房价的 2%，即使大城市名义房租能达到 4%，最后的每年收益也就在 2% 左右。


    房价增长呢？一般是跑不赢中国大陆的，经济增长数据摆在那。


    ## 国内的楼市投资有哪些坑？


    也是很多的。


    - 不要碰旅游地产。


    和前面的苏梅岛一样，当年山东等沿海地区四五线的小城市，推出的度假型地产、养老型地产，基本上都是坑。


    土地供应充足，新盘无数，接盘寥寥，谁买砸在谁手里。那我去度假、自己住行不行？有那个钱，你能天天住当地的五星级酒店了，吃住一条龙，有专业人士伺候着。


    - 对待资产的态度，还是要严肃一些，不能凭个人喜好。尽量不要碰商住公寓。


    这一点可能会让已经买了商住公寓的人不适，毕竟达叔当年刚毕业的时候，也租住过商住公寓。


    如果是因为没有所在城市的房屋而买的，达叔仍然建议你谨慎，因为很多城市在限购政策里，认房也认贷。


    有商业贷款记录后，等你有房票了，对你购买住宅也是。


    除了产权时间 40-50 年不如住宅的 70 年，更重要的是土地属性，导致持有成本高昂。


    水电煤价格都是按照商业标准来算，价格要贵。有人说这个是小钱，每个月我能承担的了。


    最后的杀手锏在于，交易成本。即使你的房子买的时候 50 万，几年之后房价涨到 100 万，涨出来的 50 万，各种税费扣除完，所剩无几，白忙活。


    在投资回报方面，商住公寓和普通住宅没法比，不要嘴硬。


    - 尽量买自己能够到的最高能级的城市，中小城市买房投资，最好时机已过。


    人口正在向大城市流动，这一趋势，不会因任何人的意志而改变。


    在知乎里，有一个关于上海楼市的探讨，达叔说人口在往大城市流入，有人反驳，拿人口规划说事。


    哪些东西能信，哪些东西不能信，本身就是考验智商的。


