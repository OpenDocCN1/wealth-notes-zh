    \n考验的是你下一步的学习能力和创造力。\n\n但是，机会都拿不到，这个事就永远和你无缘了，过都无缘。\n\n人生哪得几回搏？！富贵险中求。\n\n会吹，能给人带来确定性，确定性是预期的一种，能让人心安，让人心安本身就是一种价值。\n\
