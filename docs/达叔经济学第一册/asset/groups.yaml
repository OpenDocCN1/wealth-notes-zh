    其他的，全都是虚的。


    如何实现？


    博士说，我们要让医生这个群体，从手工劳动者，让他们变成企业家，达叔你让他们变成资本家。


    我们肯定在面临一个新时代，就是生产资料重组，这个医疗领域可能会发生另一种意义上的家庭联产承包制。


    然后博士给我讲了很多方案，如何通过这个账号，链接医生等群体一起发家致富。


    你们听懂了么？


    反正俺是听的不太懂，只觉得很牛逼。


    为啥我说我没听懂，因为从逻辑上讲，好像是通顺的，但是没法特别具体的落实步骤。


