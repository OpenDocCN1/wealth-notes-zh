    ## 第四十一篇 JJ#1 疫情让我们思考：财富的源头是什么？


    经济学是一门刚刚起步、派系林立的学科，但本质都是在探讨财富如何产生和分配。


    中国发展到今天，目前所有的主流学术思想都来自西方，无论是左翼思想计划派，还是右翼思想自由派，都是西学东渐的结果。


    伴随着中国经济的腾飞，中国重新崛起，在话语权、社会科学知识体系如何升级？摆脱左右之争，讲好中国故事，成为更加急切的 任务。


    话语权的重要性，在疫情期间表现的尤为明显，同样的事，中国做和西方国家做，得到的评价截然相反。财富的源头是人还是物？


    达叔以前看过央视的纪录片《大国崛起》，其中非常感慨的是葡萄牙、西班牙平分地球，占领美洲最好的拉美，土地肥沃、矿产丰富。而后来的英国，只有更贫瘠的北美，后来的故事大家都都看到了。


    从时间轴上看，古自至今，人的能力在不断提升，努力摆脱自然的束缚。


    从空间轴上看，世界各国，越是经济发达的经济体，其第三产业在经济中的占比就越高。


    几十年前，石油危机，人类活在资源耗尽的恐惧之下，加上马尔萨斯人口陷阱的理论，一些国家纷纷制定消极的人口政策。


    目前来看，石油勘探的数量更多、石油价格在下降，页岩气、风能、太阳能、核能等新兴能源不断崛起，人类会逐渐摆脱对资源的恐惧。


    各个发达经济体都在积极鼓励生育，制定积极的人口政策，尽量推迟陷入人口老龄化陷阱。“资源诅咒”：富饶的自然资源不但不是财富的源头，反而会消灭财富和长期的繁荣。沙特、中东、俄国、委内瑞拉、中国的山西等都是如此，甚至连荷兰这样的老牌欧洲发达国家都难以避免。


    “荷兰病”：荷兰在发现丰富的天然气资源后，制造业相对衰落，资源出口过度发展，削弱了制造业，使得一国的技术创新和人才相对滞后。


    资源出口型国家，整个社会对人的技能需求低，缺乏人力资本投资的激励。


    统治阶层只需要通过武力控制资源，和几个国际能源公司签订合同，就可源源不断的获得财富，根本无需通过收税这么麻烦，也就无需和人民分享权力。


    由于对人力的不依赖，也为独裁、腐败等创造了条件。形成恶性循环。


    成本是什么？是人。


    教科书上成本有很多定义，但我们来做一个思想实验，看看成本到底是什么？任何一个商品，无限拆解，最终总能拆解成“原材料成本+人力加工成本”。


    但是原材料都是从自然界开采的，是无需付费的，是零。所以一个商品的成本就是人力成本，社会消费支付的费用等于生产者的工资。


    比如：达叔买一个冰箱，100%国产，那么我支付的8000元钱，必然转化为中国人的报酬，这些中国人可能是生产线上的工人、管理人员、销售员、老板、经销商、售后服务人员等。


