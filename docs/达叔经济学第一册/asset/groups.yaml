    ## 城市化路线摇摆，不彻底的后果


    达叔从底层出来，身边有很多原生家庭的亲戚，在各个城市打工，观察他们，就知道这个社会上很多人，都在品尝恶果。


    很多人，在城里打工赚了钱，回农村去盖房子，盖了一层又一层，然后继续在城里打工。


    这些房子，最后没有任何价值，没有流动性。


    他们的孩子，在城里出生，在城里生活，最后达叔断定这些孩子不会回农村。


    这些房子的命运只有一个，荒废，直到被拆除。


    一生中，辛苦打工赚的钱，全部浪费。


    对个人来说，是浪费。


    对国家来说，不是浪费么？是更大的浪费。


    对城市化政策的摇摆，不够坚定，导致舆论引导混乱，一味夸赞农村乡镇的美好。


    严重忽略了一个最基本的经济规律，如果真的美好，人们为什么跑到城市里来讨生活？


    在哪里有美好的生活，人就往哪跑，这是最基本的人性。


    把一辈子的劳动剩余，换成没有经济价值的砖头，是可悲的。


    除此之外，还有一个更大的恶果，严重侵占了耕地面积。


    每天都在喊粮食危机，18 亿亩红线。


    但只要你是一个严肃的学者，看具体的数字，你就会知道，真正侵占耕地的，不是城市的扩张。


    是退耕还林。


    是农民在城市和农村双重复占有房子，是农民在农村超标建房子。


    是经济发展后，口粮发生变化，对家禽鱼肉要求激增，这些生产场所占用耕地。


    但是，为什么人们只骂城市扩张？


    因为这帮文艺青年，只看到了城市扩张。


    达叔讲过一个观点，城市里没有穷人，真正的穷人，在山里，在农村，在遥远的黄土高坡、悬崖深处。


    真正的穷人，各位完全看不到。


    很多人，搞扶贫，要给人家穷人送温暖，送产业进行脱贫。


    你可拉倒吧。


    达叔是从穷人那关读书之后，爬出来的，知道这个世界是怎么回事。


    别往里面送了，没用的。


    所有的贫穷，都是户籍制度和土地制度的副产品。


    你就老老实实，放开户籍制度，鼓励人口流动，让所有生产要素流动起来，让人去城里打工，并且能留下来。


    这样，是解决贫穷的最优方式之一。


    这一项政策，以前没人提，甚至提了，政策制定者，也没人听。


    那为什么现在达叔能说？


    因为之前的路，走不通，终于开始听这一派经济观点了。


    原理很简单，按照经济规律，资本不愿意到深山、交通不便的地方去，因为成本太高，算不过来账，去了就亏钱。


    你硬逼着资本过去，最后也是被更有优势的地方，用市场规律打垮。


    资本过不去，你要解决的是贫穷人口，剩下的方法，就是把这批人弄出来。


    不是更简单么？同样达到脱贫的目的。


