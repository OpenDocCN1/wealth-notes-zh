    慢慢印，一直印，杀人于无形。'
  - '[PAGE 445]


    这才是经济。


    这才是纸币的“不忘初心”，只要一天我们还生活在纸币时代，我们就一天被剥削和洗劫。


    普通老百姓就不敢懈怠，不能说自已实现财富自由了，不干了，回家喝茶打麻将去了，得一直工作、一直为社会贡献劳动价值。


    八十年代的万元户是个香饽饽，你在九十年代身家百万现金，一个月的生活费 1000 块，吃香的喝辣的，拿出计算器一算，一年花费一两万，100 万够花 83 年，这辈子够了。


    如果真的有人这么玩，30 年不到，快变成贫困人口了。


    但是很多人，还是看不到这个纸币的本质。


    经济学，在中文的词汇里，翻译的太高大上了，给的经济这两个字，有经世济国的宏大格局在里而。


    但是经济学，在发源地，拉丁语里，就是管理家庭，经营家庭的意思。没那么高大上，你就是你自己的经济学家，你对财富的判断，就决定了你家庭未来的财富上限。


    缪尔达尔，瑞典经济学家，1974 年，和哈耶克一起获过诺贝尔经济学奖，在他口中，世界上就没有纯粹的经济问题。


    经济问题，无处不在，影响着你的家庭，你的爱情，你的亲情，你的职业，你的事业，缠绕在你的整个人生，出摇篮到坟墓。'
  md: '

    越是劳动密集型，越赚不到钱，因为中国的人口太多了，劳动力在这个年代，是大量供应的，尤其是疫情期间，大家都没事干。


    想赚到钱，要么在技术上实现突破，要么在资金上增加壁垒，也就是从劳动密集型转向技术密集型，或资金密集型，否则最后都是白搭。不要轻易去干没有什么门槛的事，比如摆摊，比如开餐厅，都是一片红海。你能做的，别人都能做，连各路明星开餐厅，都几乎没有成功的，你就别去掺和了。


    开餐厅，是中产阶级的一台收割机。


    当然，你可能不信。


    餐饮是百业之王，不信的可以去试试，早点遭受社会的毒打，也是一件好事，反正大叔自己身边人，都被毒打过了。


    除了机会成本之外，还有一个角度，就是复利积累。有的人，每一年都在进步。


    更多的人只是把前两年的工作经验，在后面的二十年里不断重复，直到被公司抛弃，因为有更便宜、更好使的年轻人出现了。


    摆摊可以长久么？会长久么？


    不会长久，没有积累。


    什么时候可以摆？什么时候会被禁？背后的大逻辑是什么？


    就业和财政的博弈。


    上一次地摊经济大潮，发生在什么时候？


    上个世纪九十年代，国企员工大下岗。


    有人就摆起地摊卖水果，赚到钱了？赚到了，赚的比在工厂上班多很多。


    电视台正缺下岗职工再就业的典型，进行了报道，很励志。


    一夜之间，各大城市开满了水果摊，全部亏损，励志的报道典型也无法幸免。


    那除了水果摊，其他的呢？一样的，只要被报道，全部得倒闭，整个行业的倒。赚钱的生意，要低调，都是独家秘笈，生死线，藏着掖着。


    那时候为什么可以摆地摊？


    因为失业人口太多了，无事就要生非，为了社会稳定，吸纳更多的就业，不能让人闲着，得找点事做，管不了那么多了。


    孙红雷演的《征服》，刘华强大概就是那个年代的时代背景，黑社会横行，社会秩序混乱。


    ![](img/d747a49dab77676cf44faebe24df049c_427_0.png)


    当年极其红火的地摊经济，后来为什么各大城市都禁止了？


    甚至闹出无数个城管和摊主发生的暴力事件，引发一轮又一轮的网络热议。


    压力那么大，当年为什么还是要禁，今年为什么又可以放开？


    当年禁止，明面上的理由是：挤占道路，阻碍交通，影响城市美观。


    达叔一直倡导，不要看表面，要看看本质。


    本质是什么？基本上都是钱。


    嘴上都是主义，心里全是生意。没有利益的变革，是推动不了的，更没有去推动。


    - 大量的地摊挤占道路，影响交通，就是影响城市运转效率，对经济建设是有害的。

    - 几乎所有的地摊，都不交税，严重影响当地财政收入。

    - 大量的地摊，会挤压商铺和商场的经营收入。


    正规商家赚不到钱，政府就收不到税，下一个商场就建不起来，当地政府挂出来的商业地块，就卖不上价格，甚至都没有开发商来买。


    为什么？因为商场之所以赚钱，靠的是人流量，被电商打劫之后，商家本身就岌岌可危了，再被地摊打劫一下，生存就更艰难了。


    店铺赚不到钱，商场就招不到商，招不到商，开发商为啥要再买地盖商场？


    没有土地出让金，很多地方政府连工资可能都发不起。


    - 创建文明城市、卫生城市，这是本次两会前，十几年里各个城市铆足劲，争夺的名额，上下级干部，一荣俱荣，一损俱损。城市的面貌，决定能否抢到文明城市的名额，进一步影响到地方官员的升迁。所以当年发生再多城管和小商贩的冲突，还是要严禁地摊。

    - 大下岗之后，二十一世纪初，中国加入了WTO，外贸迅速发展，东南沿海工厂轰鸣，中国制造业的崛起，吸纳了极大的劳动人口，社会趋于稳定，为当年整治地摊腾挪出了空间。


    综上，达叔的判断是，目前放开地摊经济，只是应对疫情的权宜之计。


    因为大逻辑没变，那么也只能是权宜之计，请珍惜烟火气。


    这也预示本次疫情对经济的影响，不会很快过去，各位至少要准备3年左右的时间，国家看到了问题，开始保就业，维护社会稳定。


    放开地摊经济，迅速给的配套政策之一，就是放松文明城市考核，不再把地摊经营列入考核范围。


    这一点，就非常的接地气。没有这一条，放开地摊经济，就是一句空谈。


    因为继续考核，地摊经济就和地方官员的利益相悖、和执行人利益相悖的政策，就是一张废纸，没有人会去执行。


    综上，


    各位工作或做生意，轻易不要去做没有壁垒、没有积累的事情，比如摆摊就不是个好生意。


    即使做了，一定要选好品类，这直接影响收入上限。


    看问题要看本质，什么是长期政策，什么是权宜之计。


    权宜之计的事情，是不利于积累的。


    愿各位一起慢慢变富，用钱生钱，获得更多非职务性收入，更多“睡后收入”。一起熬过这个经济周期的底部，一起进入到下一个繁荣期。


    ## 第五十二篇 JJ#12 大萧条来了，一批人失业，一批人崛起，他们的区别是什么？


    新冠疫情导致的全球动荡，看样子，一时半会是解决不了了。


    东亚地区基本控制住，欧洲也在逐渐缓和，北美人民忙着游行，仿佛新冠已经被忘记了。


    北半球的夏天已然到来，南半球即将进入冬天。


    拉美、非洲等第三世界的疫情即将上演。拉美和非洲的社会治理以及医疗水平，面对新冠，基本上躺平，真的要靠上帝了。


    如果南半球和北美控制不住，那么全球经济在新冠阴影下，冬天夏天一轮，就又是一年，新冠在很长时间内，都要和人类共存了。


    直到一年以后，疫苗被研发出来，再过一年，逐步完成接种。


    如果是这样发展，全球经济中，东亚保全自己，已然非常艰难。


    大萧条来了，达叔本篇来探讨一下，历史中的大萧条，普通人是如何被收割，又是如何崛起的？


    对世界的认知，什么是本质，什么是假象。


    比如这次地摊经济，如火如荼，中央放开了口子，网络热炒，摆摊要是没有年入百万，根本就抬不起头。


