    但是如果整个西方世界受到疫情，重创，由于制造业空心，导致物资匮乏，

    而中国没有及时出手解救的话，

    疫情之后，整个西方世界都会弥漫着要求：政府强制重建制造业，不惜代价。


    ![](img/d747a49dab77676cf44faebe24df049c_377_0.png)


    如果重建制造业，在西方变成了政治正确，那么中国将会面对非常艰难的局面。


    现在他们的政治正确是 LGBT、是环保、是人权、是民主，不要打扰他们，


    让他们继续嗨，继续搞的，这个前提是什么？


    中国加大生产卖给他们，我生产，你们放心，千万不要民粹这个不给、那个不卖的。


    中国的崛起，一直是被西方世界所不信任的。


    如果中国不镇，被民粹绑架，以医疗产品等“供应链武器化”，


    就如同美国利用高科技制掎华为一样，一旦断供，那么整个西方就会彻底反弹，资本家都会被迫被政治家严酷打压，不惜代价，搞产业链脱钩。


    在任何一个组织里，共识的凝聚，代价是绝大的、旷日持久。


    就如同中国在到底要不要自己做芯片这个事情上，摇摆不定好多年。


    直到特朗通过断供，帮中国从产业到智库，从政府到民众，迅速凝聚了共识，从这点来看，真的是要感谢特朗普的鲁莽。


    一旦真的硬脱钩，对中国的经济影响巨大。


    上面高科技还有很多没有掌握，靠中低端产业赚钱、维持稳定、慢慢往上爬。


    柿子一撇，就掉到地上了。


    那么中国有什么应对政策？


    坚定不移的拥抱全球化，坚定不移的全力支持世界人民、至少是欧洲人民的抗疫行动。


    把自己人搞得多多的、把对方人搞得少少的。


    历史上有没有国家面对过类似的困境，并且成功过？


    有。


    二战后的德国。


    短短三十年内，挑起了两次世界大战，二战后的德国百废待兴，面对两难：


    - 1、如果不快速工业化，大量的人民没有工作，会倒向社会主义苏联；

    - 2、如果快速工业化，身边法国、英国、荷兰等全都害怕，肯定把你打趴下。


    德国如何解决的呢？西德首任总理 阿登纳，找到化解第二条路的办法：


    解决信任问题。


    ![](img/d747a49dab77676cf44faebe24df049c_379_0.png)


    让德国放弃“德国是德国人的德国”，让德国变成“欧洲人的德国”，


    拉着法国、意大利、荷兰、比利时和卢森堡，一起搞欧洲煤钢联营。


    煤炭、钢铁是战争的必备物资，咱们公开透明一起搞，是不是就没事事了？


    几十年后的今天，德国是不是欧洲的德国达权不确定，但欧洲肯定是德国的欧洲了。


    所以，希望我们积极拥抱改革开放，一带一路，打造中国是世界的中国，是一带一路沿线国家的中国，千万不要民粹，


    至少打造出欧亚非大团结。


    中国一定要向世界解决信任问题：


    我生产，你们放心，你们继续嗨、继续玩，没事的，只要花钱买就可以了，有我呢。


    这套思路，对我们普通人有哪些启示呢？


    我们无论是自己创业，还是在组织里打工，都要解决信任问题，无非解决的是外部客户的信任，还是内部老板和下属的信任。


    信任的本质是一种能够互相伤害的暴力平衡。


    人与人之间，从不熟悉到熟悉，从熟悉再信任，每个阶段衡量标准是什么？


    是信息。


    信息分为：公开信息，半公开信息，隐私，这三种。


    如果双方掌握的信息越往隐私方向发展、数量越多，就会产生信任，由于信任也会相互知道更多的对方隐私信息，形成正循环。


    弱者如何能赢得强者的信任？


    达叔建议，主动逐步坦露自己的信息，以期换得对方的信息，用三条换一条，以时间作为浸泡，逐步赢得信任。


    再往深一层次的，达叔就不展开了，否则要被骂是厚黑学了。


    那有没有其他的方法呢？有的。


    达叔会在以后的章节里，逐步展开。


    江湖上始终有那么一句话叫：消费者是上帝，是商家的衣食父母。也正因为这个道理的指引，很多的商家是比较谦卑的，相互竞争，最终消费者得利。


    但是，今年的母亲节，有个崽子，让妈妈们很不开心，它的名字叫丰巢。


    ![](img/d747a49dab77676cf44faebe24df049c_382_0.png)


    丰巢，小时候还是挺乖的


    | 字段 | 内容 |

    | :--- | :--- |

    | 公众号名称 | 丰巢 |

    | 所属行业 | 快递，物流 |

    | 成立时间 | 2015年8月19日 |

    | 经营范围 | 智能化快递物流交互业务 |

    | 公司简介 | “丰巢”很快将行业最高“一公里末端服务 |

    | 法人关系 | 刘峻峰 |


    如图所示，2015 年 6 月 6 日，顺丰、申通、中通、韵达、普洛斯 5 家物流公司宣布投资 5 亿元成立丰巢科技。其中，顺丰持股 35%，申通、中通、韵达各持股
    20%，普洛斯持股 5%。


    公司的口号和定位是：提供快递行业最后一公里方案服务。


    达叔一直是研究经济和商业模式的，从定位的角度来说，这绝对是物流行业的一个痛点，无论是物流公司，还是对消费者。


    很多人可能不知道，物流公司除了顺丰、京东坚持走高端路线，走直营之外，其他的几家巨头包括四通一达，在很多地区走的都是承包制、野蛮生长。


    快递行业在过去的二十年内，受整个电商行业爆炸式增长，也迎来了高光时刻，造就了一大批“前浪”。


    但是快递行业的“后浪”们生存状态是怎样呢？达叔说的后浪主要指的是快递承包商和配送小哥。


    如果是顺丰的员工，则是正规军待遇，收一单是 2~3 元提成，派一单是 2 元左右提成，但是顺丰走的高端路线，它的市场占有率 8%左右，也就是说正规军不代表大多数“后浪”。


    其他公司的情况怎样呢？承包制是很野蛮的，流动性大，工资低，社保能不交就不交，即便交了也是按照最低比例的，主要靠收派件提成，每派一单提成 8 毛到 1 块左右。挖煤挖的又快、又大、又圆，却永远做不了煤老板。


    每个人的时间都是有限，劳动力也有上限，每个快递小哥平均每天派件 150 个左右，你算算一天可以赚多少钱？


    不知何时起，网络上开始流传着快递员月薪上万，这个段子就像和北大学生卖猪肉一样，是真的，但是之所以是新闻，就是经济学意义上的“幸存者偏差”。如果写《北大学生月新过万》、《快递员转行卖猪肉》就不是个新闻了，新闻之所以是新闻，就是因为罕见。


    快递行业的蓬勃发展，快递小哥和业主的时间错配，导致了时间上的大量浪费，快递柜的出现，算是一种比较好的解决方案，但前提是免费的。


    一个新物种，在诞生初期的时候，都是娇小可爱、眉目清秀的，一副人畜无害的样子，丰巢亦是如此，默默的扩张，免费的，培养用户使用习惯。


    很多人虽然明明在家，但是快递还是被快递小哥给扔到丰巢快递柜里了，悄无声息的，除了愤怒，也别无选择，能忍也就忍了，毕竟是免费的。


    ## 丰巢露出了獠牙


    和每一个快递崛起的商业组织一样，当强大之后，有溢价能力了，就开始露出了它的青面獠牙。


    2020 年 5 月 5 日，顺丰控股发布公告，丰巢拟与中邮智递（中邮速递运营主体）进行股权重组。待收购交易正式完成后，丰巢市占率将达到 69%，远超菜鸟、京东物流等其他品牌快递柜。


    市场占有率 69%，这意味着，快递最后一公里的战斗即将结束，新的巨头、一个巨大的利维坦正式崛起。


    那个娇小可爱、眉目清秀的小家伙，华丽转身为利维坦，亮出獠牙，也就是必然了。


    ## 母亲的愤怒


    今天是母亲节，mothers 最大的愤怒就是乖巧可爱的小家伙，变成了叛逆、调皮、捣蛋、甚至反智的家伙。


    于是发生了，各种版本的硬核对抗：


    - 杭州最大经适房小区 直接断电停用


    ![](img/d747a49dab77676cf44faebe24df049c_385_0.png)


    上海某中环小区对丰巢快递柜停用，并发洋洋洒洒的公开信进行回应：


    # 上海市中环花苑小区致丰巢公司的公开信


    深圳市丰巢科技有限公司：


    最近几天，因为贵方单方面决定对软件用户采取超时收费举措，一石激起千层浪，引发了全国网民和媒体的广泛关注和讨论，我中环花苑小区作为贵公司丰巢智能柜产品的使用单位，根据我小区业主的反馈诉求并结合受众人（业主）问卷调查数据统计结果，业委会已于
    2020 年 5 月 8 日决议立即起暂停我小区对贵


    为什么会这样？因为收费不是这么收的。


    无论你说的自己有多么委屈，亏本亏成怎样怎样，都不会得到母亲们的原谅，因为这一套逻辑，在中国是行不通的，那么在中国收费是怎么收的呢？


    盐铁论，官山海


    盐叔从财政学中 “税收” 成本的角度来分析一下丰巢这个愚蠢的政策：


    收钱是门技术活，自古以来都是如此。


    比如财政、税收的所有改革都有一个核心：


    - 1、如何剪更多的羊毛； 2、羊还不叫唤，甚至都没发现。


    古代的做法：盐铁论、官山海。

