    ## 第三十八篇 FC#38 武汉有多强，很多人都没意识到


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    今天的文章头条，是房产大V水原十口的广告，去武汉旅游学团的，平时有很多人来找达叔做广告，俺一般都是不接的。


    不乱接广告的自媒体，还被自媒体研究者——池骋老师，作为典型，在案例里进行了分享和解读，好好写作，不乱接广告，也能活的很好。


    其他人夸俺，还是骂俺，俺是不太在意的，但池老师在俺心目中，有比较高的地位，因为我在写自媒体之前，买过很多书，研究了很多，还在插坐学院上买了他的1299元的课。


    这是我除了房产之外，在2020年，最成功的一笔投资，他的课上升到一定的哲学高度，这是很难得的。


    他的课，我每天晚坐要在书桌前，写很多的笔记，最后课虽然没有上完，但是我已经知道，我肯定会成为一个很牛逼的大V。


    因为经高人指点之后，我开悟了，精准选了定位，然后开干，1299元的投资，获得未来上百万的收益，其他链接和长期回报，更是天量的。所以，当任何一个人，和你读书无用，学习无用的时候，你就把他拉黑吧，这个家伙是反智的，学习和思考，永远都不晚，永远都能帮助你赚钱。


    尤其是等你毕业之后，还热爱学习，渴望进步，那是自我驱动的热血，碰到一个机会，就能崛起的。


