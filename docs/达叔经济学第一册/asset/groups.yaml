    但是在长期的操作过程中，大家是怎么玩的，业内玩家基本上也都到道，整个行业形成了默契，有的尺度大一点，有的尺度小一些，都无可厚非。


    突然，全球最大的医疗公司、行业巨头玩家，明确的站出来说，为了公司的整体业务增长，可以“在一段时间”内、“适当的”放松合规管制。


