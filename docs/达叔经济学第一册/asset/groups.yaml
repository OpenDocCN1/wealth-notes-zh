    ## 第三十八篇 FC#38 武汉有多强，很多人都没意识到


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    今天的文章头条，是房产大V水原十口的广告，去武汉旅游学团的，平时有很多人来找达叔做广告，俺一般都是不接的。


    不乱接广告的自媒体，还被自媒体研究者——池骋老师，作为典型，在案例里进行了分享和解读，好好写作，不乱接广告，也能活的很好。


