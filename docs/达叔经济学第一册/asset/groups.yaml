    - 非贸易品不存在异地套利，提供非贸易品的小伙伴要想提高收入，要迁移自己的工作地点。

    - 服务半径：可贸易品的服务半径很大，你的产品理论上可以卖到全世界，多从销售渠道和扩大销量的角度来思考，应该可以找到很多路径。

    - 非贸易品的服务半径小，能服务的人群也相对固定，受时间的限制，效率提高有限，如何提高客单价是主要思考方向。

    - 周围人员：可贸易品，比如一些制造业，一般选址选在人力成本较便宜的地方，综合结合一下工人的熟练度，主要考虑如何提高效率、降低成本。

    - 而非贸易品，比如理发师，周围的人员越有钱越好，城市越繁华收益越高，周围的人更愿意为好服务支付更高的价格。


    技术：生产可贸易品一般对技术要求高，越复杂越精密，价格越高。


    如果你只是一个经销商，那就是一个皮包公司，如何更高效的实现异地套利，是你能赚到多少钱的关键。


    非贸易品对技术要求一般较小，这也是一般普通人打工或创业的首选。服务业、第三产业一般都属于这个范畴，想赚更多的钱，去大城市，去一线城市。


    价格：可贸易品一般需要遵循一价定理，可操作空间不大，个别场所的价格歧视策略除外。


    而非贸易品在价格层面，由于受到区域的限制，供给和需求更不平衡，价格可比性更差，价格在区域之间、在人与人之间，有巨大的差异。


    ![](img/d747a49dab77676cf44faebe24df049c_367_0.png)


    竞争水平：可贸易品的竞争面临的是全球的竞争，更加惨烈，一旦实现规模化，赚钱效应也更可观。


    而非贸易品由于受到区域的限制，一般竞争较小，和当地的风俗、习惯、口味、消费水平息息相关。


    从财富的角度来看，可贸易品一般是在创造财富，这也是国家大力支持制造业和实体经济的重要原因，通过交换创造更多财富，甚至实现了杠杆效应。


    非贸易品更多的是实现财富再分配的作用，让有钱人支付更高的价格购买差不多的服务。


    比如一线城市的建筑工人、快递、月嫂、保姆、司机等等，实现月入上万现在是可以实现的，未来会更常见。


    伴随着老龄化的到来，上一代踏实肯干的老人逐渐老去，新一代受教育的人不再愿意提供辛苦的蓝领服务，蓝领收入将会进一步提高。


    我们之前在网上看到的那个上海创业公司即将倒闭，保洁阿姨出资千万帮助渡难关的故事，现在很大一批即使家里拆迁的老人，还是困不住会来找个保洁工作。


    再下一代受教育更多，就不会再出现了，一线城市的蓝领服务价格肯定会向欧美等发达国家看齐。


    技术的进步，比如互联网、冷链运输、航空、高铁等，解决了空间和时间的问题，把很多非贸易品变成了可贸易品，打破了区域之间的差异，对财富的影响也很深刻。


    比如达叔在上一篇文章《SK#3 从国际分工思考个人如何积累财富》中提到的，一个篮球运动员，本来只是向球馆里的观众提供观赏服务，但是由于电视机的出现，整个行业和收入发生了巨变。这个观赏服务通过科技的手段，可以实现对全球观众服务，顶尖球员实现了财富暴增，非贸易品向可贸易品实现了转移。


    原来传统的非贸易品比如餐饮、住宿、零售、交通、教育和金融服务，都在技术的影响下，逐步变得非本地化，可贸易化。


    比如异地搬住宿交易就诞生了携程这样的巨头、近几年迅速崛起的网上教育、还有个人凭借万豪酒店集团的铂金卡，在网上替人订房等等服务。


    总览全球，一般技术的进步都会进一步扩大贫富收入的差距，房产、金融手段致富会越来越容易。


    我们是生活在技术变革的大时代，比前面的两代人更熟悉互联网，比后面的 00 后更有一定的资本积累。


    该如何善加利用这一机会，也正是达叔希望和各位探讨的。


    # 第四十三篇 JJ#3 如果大萧条来了，普通人应该怎么办？


    达叔这篇文章是为了回答知乎的一个问题：

    https://www.zhihu.com/question/380644941，原问题是：如果大通胀和大萧条来了，普通人该怎么办？我们2020年是不是遇到了经济危机？目前来看是的。那么会不会遇到大通缩？达叔对着头上的电灯保证：绝对不会。


    而且，大通缩的时代，再也不会了。如果你连这个都没搞清楚，你还上个哈B呼。为什么？因为全球的货币体系发生了巨变。纸币的时代太短了，以至于绝大多数人没有意识到纸币的本质。


    全球货币体系演化轨迹：

    复本位时代----金本位时代----金汇兑本位时代----美元霸权纸币时代。


    以前为什么会发生大通缩？

    是因为遇到危机的时候，人们不愿意花钱，市场流动性紧缺、物品价格暴跌，加上劣币驱逐良币，人们更不愿意花钱，导致恶性循环。

    谁可以解决这个问题？政府。


    怎么解决？政府向市场中强行注入货币，解决流动性，缓解恐慌。


    但以前政府为什么很难解决？


    因为以前的货币是铜镍等贱金属，或者金银贵金属，产能有限，


    说到底，以前的政府不掌握货币发行权。所以面对通缩，工具寥寥。


    打开你的历史教科书，这一切都变了。


    1971 年 8 月，布雷顿森林货币体系，正式解体之后，意味着什么？


    全世界的货币，贵金属的最后一个制约货币滥发的锚，消失了。


    ![](img/d747a49dab77676cf44faebe24df049c_371_0.png)


    纯纸币的时代，正式到来。


    至今，短短 50 年不到。


    而中国是什么时候真正建立纸币的货币化时代的？


    苏联集体，1992年，中国才正式废除各种粮票、布票等票据化，正式进入全面货币化，也就是全面拥抱纸货币化。


    时间太短，有什么副作用？


    人群缺少必要的代际更迭。


    小的时候，一批人生活在通缩的阴影下，拼命的存钱，对抗通缩。


    等他长大的时候，时代在巨变，而人的见识没有跟上时代的变化。


    这也是很多父母给孩子的职业建议，很多效果不好的原因之一。


    现在美元，充当了全球央行的一部分角色，遇到危机，拼命印钱、大放水，向全世界提供流动性。


    欧美大放水，中国跟不跟？肯定要跟。


    怎么跟？


    以工代赈，新基建项目，徐徐拉开序幕。


    纸币的时代，无限量、无底线QE，你说会大通缩？？？信你个鬼哦。


    以上，达叔的观点是：没有大通缩，可能会有大萧条。


    普通人应该怎么做？判断一下，未来几年这些货币的流向，判断对了，就能不被大水淹死。


    问：A股与美股孰美？


    答：美股美甚，A股不如也。


    问：新基建发货币没？


    答：发了。


    问：多不多？


    答：甚多。


    问：货币是水否？


    答：是。


    问：蓄水池还是楼市否？


    答：房住不炒。


    问：那生活用品能涨否？


    答：影响不好，不好大涨。


    问：如之奈何？


    答：要不 A 股涨？


    问：A 股与美股孰美？


    答：不能比也。


    问：A 股涨，会跌否？


    答：更惨。


    达叔很惆怅。


    这三个里肯定有一个要松绑，猜对就有奖。


    达叔奉劝各位要多读书，否则被悄无声息的收割，跑都不知道往哪跑。


    上一次中国大通缩的时候，中国是怎么解决的？


    经济沙皇废除票据、拥抱纸币、大学扩招、停止福利分房、进入房地产市场化。


    你想不花钱？想的美。


    以前中国农民是不是特爱存钱？


    把大学门槛一降低，大学拼命扩招，你的孩子可以上大学了，你还存钱么？砸锅卖铁上大学。


    上完大学，要住在城里，不愿回农村，继续砸锅卖铁，城里买房子。


    你告诉达叔，这个钱你怎么存？整个过程没人逼你哦，一切为了孩子。


    中国政府的财政税收体系是流转税，货币不流转起来，政府怎么收税？


    收不到足够的税收，国家怎么运转？！


    只要中国政府想让你花钱，有的是办法。


    现在某个夜壶产业被调控压制着，很多城市在适度解绑，只要一松，上下游无数个产业立马活力满满。


    达叔最烦的就是拿中国和日本比：


    东京房价崩了，你们要和日本比；


    日元国际化基本失败，你们要和日本比；


    日本长久以来，战术高能、战略低下的小国，你们拿一个主权国家和一个半殖民地、他们土地上还有美国驻军、没有自己的正规军队，土地上有治外法权，你们比啥？


    拿一个 14 亿人口战略腾挪空间巨大的国家，和一个被人逼着签广场协议的国家比；


    拿一个年轻气血活力满满的血气方刚小伙子，和一个被人阉割了垂垂老矣的比；


    你们是想嘛的？就为了证明中国不行了？


    世界上如果美国、德国、法国、英国等一线主权独立的国家都通缩，达叔就认你们的道理。


    悲观者往往正确，乐观者往往成功。如果达叔来选，肯定不选正确而无用的，达叔选择乐观。


    在货币日韩化、人口老龄化、城市化进程结束，三者都走到尽头的时候，中国的经济才会停滞。


    在这之前，达叔旗帜鲜明的支持各位购买资产。


    # 第四十四篇 JJ#4 疫情让大量企业外流？普通人该如何自保


    2020 年 4 月 10 日《福布斯》杂志发文：日本政府已宣布要支付 22 亿美元支持日资企业迁出中国，其中 20 亿美元直接贷款用来支持企业回到日本，其余支持去东南亚等。


    同日，美帝表示，从中国迁回美国的企业，将受到 100% 直接报销，


    包括厂房、设备、知识产权、基建等等，也就是美国政府全部买单。


    虽然目前来看，大量企业外流，还是一个小概率事件，全球化的今天，产业脱钩也不是一件容易的事。但是疫情让中国的制造业产业链，面临极大的挑战和不确定性：


    二战后，人类有了长达 70 多年整体上的和平，


    经济持续发展、科技不断进步、人均寿命延长、持续城市化。


    尤其是冷战后，一超多强，繁荣昌盛三十年，我们有幸生活在这一年代。


    老牌帝国主义产业链不断转移，金融发达、制造业空心化，


    白左横行、环保至上、每个人都是高贵的好人，丛林法则和达尔文主义，变成了贬义词。


    公众号懒人搜索，懒人专属群分享


    373


    但是一场疫情，就像一场战争一样，让裸泳的人现了原形。


    “一超”好像也没有那么超，

    所谓的“多强”中更多的是滥竽充数，一点都不强。

    中国三十年的迅速强大，除了自身的艰苦奋斗外，

    更重要的是始终牢记：以经济建设为中心，坚持一百年不动摇。

    根本不相信西方虚头巴脑的那一套，

    中国人相信的：是落后就要挨打，是三体、是黑暗森林，

    是生存本身就是幸运，什么时候生存变成了必然？

    但是，一场疫情可能像一场打醒中国人的鸦片战争一样，再次打醒西方人。

    如果真的打醒了，那么西方是否会不惜一切代价，重建制造业？


    这个概率很低，但是如果中国应对不当，一旦变成黑天鹅事件，世界格局巨变。

    最近几年，黑天鹅事件频发，不是个好现象。

    虽然制造业，美帝喊着回流，喊了快十年了，

    但是如果整个西方世界受到疫情，重创，由于制造业空心，导致物资匮乏，

    而中国没有及时出手解救的话，

    疫情之后，整个西方世界都会弥漫着要求：政府强制重建制造业，不惜代价。


    ![](img/d747a49dab77676cf44faebe24df049c_377_0.png)


    如果重建制造业，在西方变成了政治正确，那么中国将会面对非常艰难的局面。


    现在他们的政治正确是 LGBT、是环保、是人权、是民主，不要打扰他们，


    让他们继续嗨，继续搞的，这个前提是什么？


    中国加大生产卖给他们，我生产，你们放心，千万不要民粹这个不给、那个不卖的。


    中国的崛起，一直是被西方世界所不信任的。


    如果中国不镇，被民粹绑架，以医疗产品等“供应链武器化”，


    就如同美国利用高科技制掎华为一样，一旦断供，那么整个西方就会彻底反弹，资本家都会被迫被政治家严酷打压，不惜代价，搞产业链脱钩。


    在任何一个组织里，共识的凝聚，代价是绝大的、旷日持久。


    就如同中国在到底要不要自己做芯片这个事情上，摇摆不定好多年。


    直到特朗通过断供，帮中国从产业到智库，从政府到民众，迅速凝聚了共识，从这点来看，真的是要感谢特朗普的鲁莽。


    一旦真的硬脱钩，对中国的经济影响巨大。


    上面高科技还有很多没有掌握，靠中低端产业赚钱、维持稳定、慢慢往上爬。


    柿子一撇，就掉到地上了。


    那么中国有什么应对政策？


    坚定不移的拥抱全球化，坚定不移的全力支持世界人民、至少是欧洲人民的抗疫行动。


    把自己人搞得多多的、把对方人搞得少少的。


    历史上有没有国家面对过类似的困境，并且成功过？


    有。


    二战后的德国。


    短短三十年内，挑起了两次世界大战，二战后的德国百废待兴，面对两难：


    - 1、如果不快速工业化，大量的人民没有工作，会倒向社会主义苏联；

    - 2、如果快速工业化，身边法国、英国、荷兰等全都害怕，肯定把你打趴下。


    德国如何解决的呢？西德首任总理 阿登纳，找到化解第二条路的办法：


    解决信任问题。


    ![](img/d747a49dab77676cf44faebe24df049c_379_0.png)


    让德国放弃“德国是德国人的德国”，让德国变成“欧洲人的德国”，


    拉着法国、意大利、荷兰、比利时和卢森堡，一起搞欧洲煤钢联营。


    煤炭、钢铁是战争的必备物资，咱们公开透明一起搞，是不是就没事事了？


    几十年后的今天，德国是不是欧洲的德国达权不确定，但欧洲肯定是德国的欧洲了。


    所以，希望我们积极拥抱改革开放，一带一路，打造中国是世界的中国，是一带一路沿线国家的中国，千万不要民粹，


    至少打造出欧亚非大团结。


    中国一定要向世界解决信任问题：


    我生产，你们放心，你们继续嗨、继续玩，没事的，只要花钱买就可以了，有我呢。


    这套思路，对我们普通人有哪些启示呢？


    我们无论是自己创业，还是在组织里打工，都要解决信任问题，无非解决的是外部客户的信任，还是内部老板和下属的信任。


    信任的本质是一种能够互相伤害的暴力平衡。


    人与人之间，从不熟悉到熟悉，从熟悉再信任，每个阶段衡量标准是什么？


    是信息。


    信息分为：公开信息，半公开信息，隐私，这三种。


    如果双方掌握的信息越往隐私方向发展、数量越多，就会产生信任，由于信任也会相互知道更多的对方隐私信息，形成正循环。


    弱者如何能赢得强者的信任？


    达叔建议，主动逐步坦露自己的信息，以期换得对方的信息，用三条换一条，以时间作为浸泡，逐步赢得信任。


    再往深一层次的，达叔就不展开了，否则要被骂是厚黑学了。


    那有没有其他的方法呢？有的。


    达叔会在以后的章节里，逐步展开。


    江湖上始终有那么一句话叫：消费者是上帝，是商家的衣食父母。也正因为这个道理的指引，很多的商家是比较谦卑的，相互竞争，最终消费者得利。


    但是，今年的母亲节，有个崽子，让妈妈们很不开心，它的名字叫丰巢。


    ![](img/d747a49dab77676cf44faebe24df049c_382_0.png)


    丰巢，小时候还是挺乖的


