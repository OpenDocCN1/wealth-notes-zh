    2020 年 1 月 23 日，全国电影院，停摆至今，已经 3 个多月了。


    对于一般青年，可能无所谓，但对于和电影心心念念的文艺青年，就仿佛隔了好多个春秋。


    “我的快乐，要回来了。”


    这几天，迎来了电影院 “恢复营业” 的好消息。


    2020 年 5 月 8 日，国务院联防联控机制印发指导意见，要求落实防控措施前提下，采取预约、限流等方式，开放影剧院、游艺厅等密闭式娱乐休闲场所，可举办各类必要的会议、会展活动等。


    达叔如果是一个研究电影的公众号，那么达叔会问，你还记不记得上一次进电影院，你看的电影是什么？


    时隔三个多月，你最期待的电影是什么？


    但是达叔是研究经济的，是思考如何赚钱的，看着电影院流血至今，倒闭上百家，达叔看到一个知乎上有一个问题：“电影院真的有必要么？会被电脑代替么？”


    于是，有了这一篇文章。


    # 电影院的本质


    电影院可能没必要，但是肯定不是被电脑取代。'
  - '[PAGE 391]


    达叔看了一些答主从艺术的角度、观影效果、仪式感的角度来，肯定都是对的。


    达叔尝试从感官和经济的角度来陈述一下：


    有人把电影称之为：绘画、雕塑、建筑、音乐、文学、舞蹈、戏剧之后的第八大艺术。


    这些所有艺术，都是工具，


    目的是：对人的感官提供刺激。


    如果从这个视角来看，人类的进展方向是口味越来越重的，


    从单方面的视觉刺激、语言刺激、听觉刺激，到电影全方位的刺激，


    那么电脑相对电影来说，在感官刺激层面，是前进了还是倒退了昵？


    肯定是倒退了。


    单凭这一点，电脑就无法取代电影院，因为相比微不足道电影票钱，


    人的感官刺激更重要，这个是一有一定成瘾性的。


    这个“成瘾性”就导致了经济学上的“价格弹性”变得偏刚性，尤其是出了好片时，达叔是一定要到电影院里好好爽一下的。


    # 微妙的社交场所


    何况，电影院对很多青涩的年轻人来说，还是最微妙的社交场所。'
