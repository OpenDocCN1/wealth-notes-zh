    # 第四十三篇 JJ#3 如果大萧条来了，普通人应该怎么办？


    达叔这篇文章是为了回答知乎的一个问题：

    https://www.zhihu.com/question/380644941，原问题是：如果大通胀和大萧条来了，普通人该怎么办？我们2020年是不是遇到了经济危机？目前来看是的。那么会不会遇到大通缩？达叔对着头上的电灯保证：绝对不会。


    而且，大通缩的时代，再也不会了。如果你连这个都没搞清楚，你还上个哈B呼。为什么？因为全球的货币体系发生了巨变。纸币的时代太短了，以至于绝大多数人没有意识到纸币的本质。


    全球货币体系演化轨迹：

    复本位时代----金本位时代----金汇兑本位时代----美元霸权纸币时代。


    以前为什么会发生大通缩？

    是因为遇到危机的时候，人们不愿意花钱，市场流动性紧缺、物品价格暴跌，加上劣币驱逐良币，人们更不愿意花钱，导致恶性循环。

    谁可以解决这个问题？政府。


    怎么解决？政府向市场中强行注入货币，解决流动性，缓解恐慌。


    但以前政府为什么很难解决？


    因为以前的货币是铜镍等贱金属，或者金银贵金属，产能有限，


    说到底，以前的政府不掌握货币发行权。所以面对通缩，工具寥寥。


    打开你的历史教科书，这一切都变了。


    1971 年 8 月，布雷顿森林货币体系，正式解体之后，意味着什么？


    全世界的货币，贵金属的最后一个制约货币滥发的锚，消失了。


    ![](img/d747a49dab77676cf44faebe24df049c_371_0.png)


    纯纸币的时代，正式到来。


    至今，短短 50 年不到。


    而中国是什么时候真正建立纸币的货币化时代的？


    苏联集体，1992年，中国才正式废除各种粮票、布票等票据化，正式进入全面货币化，也就是全面拥抱纸货币化。


    时间太短，有什么副作用？


    人群缺少必要的代际更迭。


    小的时候，一批人生活在通缩的阴影下，拼命的存钱，对抗通缩。


    等他长大的时候，时代在巨变，而人的见识没有跟上时代的变化。


    这也是很多父母给孩子的职业建议，很多效果不好的原因之一。


    现在美元，充当了全球央行的一部分角色，遇到危机，拼命印钱、大放水，向全世界提供流动性。


    欧美大放水，中国跟不跟？肯定要跟。


    怎么跟？


    以工代赈，新基建项目，徐徐拉开序幕。


    纸币的时代，无限量、无底线QE，你说会大通缩？？？信你个鬼哦。


    以上，达叔的观点是：没有大通缩，可能会有大萧条。


    普通人应该怎么做？判断一下，未来几年这些货币的流向，判断对了，就能不被大水淹死。


    问：A股与美股孰美？


    答：美股美甚，A股不如也。


    问：新基建发货币没？


    答：发了。


    问：多不多？


    答：甚多。


    问：货币是水否？


    答：是。


    问：蓄水池还是楼市否？


    答：房住不炒。


    问：那生活用品能涨否？


    答：影响不好，不好大涨。


    问：如之奈何？


    答：要不 A 股涨？


    问：A 股与美股孰美？


    答：不能比也。


    问：A 股涨，会跌否？


    答：更惨。


    达叔很惆怅。


    这三个里肯定有一个要松绑，猜对就有奖。


    达叔奉劝各位要多读书，否则被悄无声息的收割，跑都不知道往哪跑。


    上一次中国大通缩的时候，中国是怎么解决的？


    经济沙皇废除票据、拥抱纸币、大学扩招、停止福利分房、进入房地产市场化。


    你想不花钱？想的美。


    以前中国农民是不是特爱存钱？


    把大学门槛一降低，大学拼命扩招，你的孩子可以上大学了，你还存钱么？砸锅卖铁上大学。


    上完大学，要住在城里，不愿回农村，继续砸锅卖铁，城里买房子。


    你告诉达叔，这个钱你怎么存？整个过程没人逼你哦，一切为了孩子。


    中国政府的财政税收体系是流转税，货币不流转起来，政府怎么收税？


    收不到足够的税收，国家怎么运转？！


    只要中国政府想让你花钱，有的是办法。


    现在某个夜壶产业被调控压制着，很多城市在适度解绑，只要一松，上下游无数个产业立马活力满满。


    达叔最烦的就是拿中国和日本比：


    东京房价崩了，你们要和日本比；


    日元国际化基本失败，你们要和日本比；


    日本长久以来，战术高能、战略低下的小国，你们拿一个主权国家和一个半殖民地、他们土地上还有美国驻军、没有自己的正规军队，土地上有治外法权，你们比啥？


    拿一个 14 亿人口战略腾挪空间巨大的国家，和一个被人逼着签广场协议的国家比；


    拿一个年轻气血活力满满的血气方刚小伙子，和一个被人阉割了垂垂老矣的比；


    你们是想嘛的？就为了证明中国不行了？


    世界上如果美国、德国、法国、英国等一线主权独立的国家都通缩，达叔就认你们的道理。


    悲观者往往正确，乐观者往往成功。如果达叔来选，肯定不选正确而无用的，达叔选择乐观。


    在货币日韩化、人口老龄化、城市化进程结束，三者都走到尽头的时候，中国的经济才会停滞。


    在这之前，达叔旗帜鲜明的支持各位购买资产。


    # 第四十四篇 JJ#4 疫情让大量企业外流？普通人该如何自保


