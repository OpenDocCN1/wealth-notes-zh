    # 适用对象


    +   白领通道主要对白领阶层，主要包括：


    1、公务员；


    2、教师、医生或其他事业单位编制人员；


    3、企业单位的中高层管理人员（企业注册资本金原则上1000万以上）；


    4、通信、电力、烟草、炼化、盐务、律师、会计师等行业稳健工作人。


