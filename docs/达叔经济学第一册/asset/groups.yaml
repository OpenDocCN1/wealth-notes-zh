    截止到 2015 年，中国的大城市化率是 23.8%，大城市化率，是指百万以上城市人口占比，日本是 64.7%，韩国是 45.8%，美国是 45.3%。


    那么单纯的城市化率呢？

    中国目前是 60% 左右，美英法德主要发达国家是 80% 左右，日本是 90% 左右。


    中国城市化率以每年 1% 左右的速度前进，这几个数字是中国所有学术界的一致观点。


