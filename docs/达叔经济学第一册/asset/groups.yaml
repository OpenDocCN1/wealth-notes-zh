    ### 大主任的困惑


    2019年，夏。


    某人口大省的顶级医院，6个主任，一个护士长，由经销商销售带队，来上海参观考察，达叔负责接待。


    第一天晚上，吃香港菜，包厢，大家先破个冰，瞎聊，主要聊两地的行业发展。


    大主任说起自己那个省医学会内部争夺名利，用了一个词，叫“热闹”，然后问达叔，你们上海这边好像更热闹，对么？


    达叔听完，狂点头，钦佩不已，多么杂梁血腥的场面，被人家用一个喜庆的词汇给表达了，这特么真是高手。


    一年半过去了，达叔对“热闹”这个词，还是记忆犹新。


    能在这个人口大省的头部医院干到主任，大专家，情商智商都是一流的，业务水平也是一流的。


    但是，第二天中午吃饭，日料店包间，困惑了。


    日料店，在上海某大医院旁边。


    达叔点了很多刺身拼盘啥的，中间两个寿喜锅，达叔一边吃，一边观察，觉得不对劲了。


    我们三文鱼蘸酱油，直接吃了，几个主任和护士长，都把三味鱼和贝类，放在寿喜锅里煮熟了再吃。


    达叔心里一凉，这餐厅可点错档了。


    得赶紧找个刺激的话题，转移一下注意力，想了半天，什么话题够刺激，还不低俗？


    ### 上海房价。


    达叔指着包厢窗外，一个破破烂烂的老小区，问几个主任，你们觉得这个房子，多少钱一平米？


    几个主任，猜了几个数字。


    达叔说，具体的我也不知道，我用链家看看谁猜的准啊。


    打开一看，均价 8 万/平米。


    大主任把筷子一放，就开始大骂房价泡沫，太特么贵了，然后就是一顿房地产拖累中国经济等言论。


    达叔在那边笑着问，你在省会有几套房子？


    大主任说，有两套，一套自己住，还有一套近期正准备卖，2016-17 年那一波涨幅，直接翻了一番，泡沫太大，准备抛了。


    达叔说，我在你们那边出差，除了做业务，还研究你们那的楼市，你要是想卖，咱俩可以聊聊啊。


    大主任问，你不觉得有泡沫么？涨了那么多。


    达叔说，之前涨了多少，那是你感受到的，未来还能至少再翻 1-2 倍，是我看到的。


    在座的各位主任，你们的身家未来都能破亿，即使年龄大点，好好操作，也能破 5000 万。


    几个主任，齐刷刷的把筷子放下，直勾勾的看着达叔。


    达叔知道，上课时间到了。


    ### 换个战场。


    为什么要聊房价？


    这个玩意，就和聊明星一样，大家都熟悉，都有一定的认知，懂不懂，都能插上几嘴。


    达叔问，在座的几位主任，老家都是哪里的？有没有本身就是省会城市的？


    结果，和达叔的预测差不多，包括经销商销售在内，都是外地来的。


    为什么？


    因为这个省会，原来就是个小县城，几十年前被指定为省会，是个偶然事件，现在人口近千万，都是新来的。


    但是，你上来直接讲城市化、人口迁徙，对方能耐心听么？


    不会的。


    太大的词汇，耳朵都听出茧子来了，没直观感受。


    结果一个桌子上吃饭的家伙，全都是外地来的，都在这边买房、安家立业，这现象就有说服力了。


    达叔问大主任，你刚毕业当医生那一年，工资是多少？


    大主任说，工资一个月500。


    达叔问，那现在你们科室里，最年轻的医生，一个月工资是多少？


    大主任想了一下，说要么几千块，明面上的。


    达叔说，那你觉得现在的医学生，和当年刚毕业的你，有什么差别？为啥你刚毕业只能拿500，他一毕业就是你的十倍以上？


    大家开始七嘴八舌。钱越来越不值钱，通货膨胀，大家都开始畅想聊了。


    聊起过去，大家都看的很清楚，分析的头头是道。


    推测未来，就又分成两派，3 个看空，4 个看多。


    达叔讲印钞机轰鸣不停、讲土地财政、讲印钞化解债务，讲市政府搬迁、省政府搬迁，讲这个省会的卖地收入占当年财政支出比例。


    讲房地产，相比股票，是更普惠的金融，是缩短中产阶级和富豪之间贫富差距的最好工具。


    最后讲，说好的人人平等，具体执行的时候，平等还是不平等，有一个简单的衡量指标，就是找国家金融机构去借钱。


    找朋友借钱，能分辨出自己朋友心中的地位；找国家银行借钱，能迅速分清自己到底是几等人。


    公务员、教师、医生、烟草、电力石油等，都是自带融资属性，但有几个医生发现了自身的金融属性？


    很少。


    为什么发现不了？


    知识学的太专、太窄；工作太忙、太累，无暇东顾。


    一句话，捧着金饭碗要饭，跑偏了。


    绝大部分医生，利用自己的金融属性，玩房产投资，阳光型收入，就可以轻松破千万。


    不用在桌子底下，费太大劲，风险又大，动作容易变形，很危险。


    但达叔和他们说这话的时候，对方手术刀都吓掉了，真的吗？你说的是真的吗？


    达叔一把拉起客户的手，跟着我走，一起慢慢变富。


    很多公司天天给销售讲，要给予客户提供价值，你一手就生产那几款产品，卖来卖去，就是那点子生意。


    说破天，对方也只觉得你就是个出来卖的，一手交钱，一手交货，除此之外，有啥特别的价值？


    所以，作为销售，要懂得开辟第二战场。


    人，都是有主场优势的。


    你聊他熟悉的领域，就是他想着你打；他聊你熟悉的领域，就是你摆着他打。


    你在他办公室聊不出来的东西，把他带出去开会，到陌生的城市，陌生的酒店，就能聊出来了。


    离开了他的王者应许之地，人才能平等的交流。


    人和人之间，平等了，提供的价值才是价值，否则就是进贡。


    只要还在进贡模式里，那就是应该的，给多少，都是应该的。


    所以，要换一个战场。


    ### 不动产的含义。


    上次达叔带着老板见也做民营医疗的同行，就是昨天提到的那个帅哥总监。


    聊起疫情和房价。


    达叔说，有一些灾难，是对优质资产的价格，起助推作用的。


    这个灾难，有时候是天灾，比如这次疫情，有时候是人祸，比如次贷危机等。


    为什么？


    因为灾难来的很突然，年度财政预算里，没这块支出，但是多米诺骨牌咣咣猛倒，不赶紧救灾，就全倒没了。


    怎么救？


    最快的就是财政政策、货币政策，说到底就是发债、印钞，不管你名字起的多酷炫，多新颖，说到底，本质就是放水。


    房地产，又叫不动产。


    不动产是啥意思？


    就是有些人一辈子，买了之后，就不动了，买也买不起，换也换不起。


    一个小区里800套房子，可能600套，长期是不动的。


    在接下来十几年的时间里，只有200套，会逐步上市交易。


    每过几年，有几套房，刷出一个新价格，新高度，剩下不动的600户人家，都觉得自己家的纸面富贵，又有钱了。


    所以房产的价格，和一般人的收入，没多大关系，因为一般人的收入，大概率跑不赢通胀。


    未来，大城市房价，只和这个城市里的中高收入者有关。


    文科小编们，天天算的房价收入比，计算公式都是错的。


    真正的公式：


    房价收入比=现在的房价÷未来的中高收入x100%


    划重点：


    - 1、未来：


    住宅是城市的股票，优质公司的股价肯定是高的，是对未来收入的提前反应。


    所以房价，也会对城市的未来价值，进行提前反应。


    鹤岗就是垃圾公司，北沪深就是阿里、腾讯。


    这几个城市，不是一回事，不能相互比较，就如同公司之间的股权，也没有比较的意义一样。


    前几天晚上，有个读者，成都的，来问达叔房价的问题，他第一个问题，就把达叔给气晕了。


    他问的是中国房价未来走势，一个城市各个板块都走不齐，你还问整个中国的，达叔就没法往下聊了，你就是给钱，这个天也不能聊。


    容易被问题噎死。


    一场沟通的盛宴和欢愉，是从问对问题开始的。


    - 2、中高收入。


    放眼全世界的城市，只有中高收入才买得起房，纽约、东京、香港、首尔等，自有住房率，只有5~6成。


    剩下的，全部老老实实租房子，年轻人能租的起，就不错了。


    中国目前房价收入比低，是因为预期收入增长快，是朝气蓬勃的代价，是对自己未来收入增长有信心的代价。


    像美、欧、日，收入水平高，但未来预期收入增长也慢，他们是稳态社会。


    我们是剧烈动态的社会。


    你不能拿一个稳态社会的衡量指标，去测量一个剧烈动态的社会。


    特斯拉的营收远比通用、福特低，但股票市值吊打传统车企，为什么？


    这售卖的是潜力，是未来，是希望。


    你信，就买；不信，就不买。


    生命即是选择。


    只有经济才能处于平均水平以下的人，才会渴望追求平等，追求政府管制；


    而那些才智过人的家伙，永远渴望自由，渴望宽松。


    几千年的经济史，大部分时间，都是智力更超群的人，得偿所愿。


    否则，就是一起饿死。


    ## 第二十二篇 FC#21 这一次的屠杀静悄悄


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    在疫情刚爆发的时候，达叔就写过一系列文章，都是关于资产价格走势的。


    - FC#1 疫情后一线城市的房价会大涨么？

    - 美股暴跌，该如何保卫自己的财富？

    - SK#3 从国际分工思考个人如何积累财富。

    - JJ#3 如果大萧条来了，普通人应该怎么办？

    - FC#3 疫情之后，普通人要拥抱股票还是房产？要拥抱普惠性的资产


    这些所有文章，都是写于 3-4 月份，当时账号刚开始写，也没啥人看。


    深圳大涨、上海涨、宁波等一大堆热点城市，开始出现了价格倒挂严重的一二手新房摇号，摇中即得百万的彩票游戏。


    以上所有观点，全对。


    但除了深圳闹的动静比较大，其他城市的价格上涨，你有听到么？


    没有。


    因为，这一次的屠杀，静悄悄。


    这才是对不关心资产价格，只知道闷头打工的普通人，最残忍的地方。


    如果早点动手，2020 年，是一个资产大年，听达叔的话，应该多少还是能赚点钱的。


    当然，以上的全对，不代表下面的内容也正确，各位随便看者。


    ### 为什么？


    这个世界的真实运转，和一般人的普通直觉，是有很大差别的。


    换而言之，绝大部分人，读了那么一辈子的书，上了那么多年的学，全是白忙活。


    如何赚钱的事儿，学校一概不教。


    无论是天灾，还是人祸，救人都是要花钱的，钱只要印出来，就会向它保值、增值的地方流去。


    这一资金流动过程，不因任何人的意志为转移。


    任何一个撕开的货币宽松口子，低利率的经营贷，等等金融手段，目的都是为了帮助小微企业共渡难关。


    银行从业者，专业炒案者，真正的小微企业主，都是相视一笑，默默的拿去他们认为最安全的地方去了。


    这就是默契。


    ### 几十年下来，最大的默契。


    达叔上一次，在郑州开会，晚上带同事和地产界的老板吃饭，老板姓王，怒态可掬。


    王总信阳人，86 年的，刚去郑州的时候，全身上下 的资产，只有一辆电瓶车。


    现在，在郑州有房产中介门店近 20 家，两个娃，名下 资产甚多，他也没和达叔细说。


    王总问，郑州楼市现在风雨飘摇，未来还有机会么？


    达叔说，你就看看在座的几个人，有谁是土生土长的郑 州人，就知道了。


    全是新来的，河南的未来，就是郑州，单核的，未来人 口不出意外，还要再翻一番。


    直到人口规模，达到 2000 万，这是郑州未来最低的人 口数字。


    2019 年，郑州人口就流入了 46 万。


    未来房价，不会低于 5 万/平。


    现在郑东新区的房价，部分已经突破五万，这是远超很 多人想象的。


    为什么？


    因为普通人，最缺的就是想象力。


    你总觉得，房产的价格和普通人的收入是相关的，其实 呢？


    相关个屁。


    在郑州这样的省会城市，未来的房价，只和河南近一个 亿的人口冲，最优秀的 1% 人口有关系。


    这 1%，就是 100 万个人，只要他们分布在不同的年 份，因缘际会发财了。


    因为疫情，因为贪污，因为新技术，因为创业，因为直播带货，因为今年重启的货币化安置，等等。


    太多人发财的门路，我们想都想不到。


    不只是你想不到，连银行的行长们，都想不到。


    达叔前几天和大老板聊天，他说他在上一个高端课程，里面有个同学是南京那边的银行支行行长。


    行长很痛苦，为什么？


    因为他的几个 VIP 客户，都是九零后，公司 15 个人，一年的营收是 4 个亿，做游戏的。


    行长想去走动一下，维护一下关系。


    结果九零后老板要带他打游戏，他不会。


    到吃饭的时间点，高端餐厅不去，客户拉他去路边摊，吃串串。


    行长懵逼了，心里很没底，慌的很，因为他原来那一套，不管用了。


    他开始看不懂客户了。


    是这帮奇奇怪怪的有钱人，在决定着优质资产价格走势。


    关键是，这帮奇怪的有钱人，层出不穷。


    王总端起酒杯，拼命点头，说前几天，刚遇到一个女孩子，做直播的，拿了上千万，全款找他买房子。


    把他也弄懵了。


    他满肚子的技巧，首付比例、贷款技巧、如何选筹，全部无用武之地。

    '
