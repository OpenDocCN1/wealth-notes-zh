    很多人担心负债，你担心个毛线，你该担心的不是负债，而是现金流，是和达叔一起努力工作，去增收。


    负债分为：政府债、企业债、居民债。


    你猜哪个债最大？


    你猜那个债最大的，最后如何还钱？


    中国怎么还，俺不方便说，达叔举个欧洲的例子：一战后，德国和英国打仗都欠了一屁股债，德国还钱要赖、拼命印，引发剧烈通货膨胀。


    英国稍情加大度量印，慢慢把钱还上的。


    其他的俺不知道，反正伦敦的房价涨了一百年。


    ## 图表21：伦敦房价 50 年涨幅达 106 倍


    ![](img/d747a49dab77676cf44faebe24df049c_274_0.png)


    资料来源：英国国家统计办公室，恒大研究院


    哪段时间开始涨的最凶？


    1971 年，布雷顿森林体系瓦解，美元与黄金脱钩，全球货币进入无锚时代。


    你的身边，都是要集中力量办大事的。


    当然，以上内容，达叔可能都是瞎说的，爱信不信。


    所有的生活，都是合理的，我们没必要相互理解。


    今天是每月一次的付费阅读，看完别忘了打赏，丰俭由人。


    ## 第三十二篇 FC#31 限你一万年


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    如果不出差的话，都是达叔早上七点爬起来，送孩子去上学，俺很珍惜每天相处的这点时间。


    最近女儿，特别喜欢让达叔问问题考她，她看了一点西游记，就一直让俺出题。


    达叔就问，孙悟空为啥被压在五指山下了？


    女儿说，是因为调皮，不读书，天天打架。


    达叔问，后来被谁救出来了？


    女儿说，被唐僧。


    达叔问，救出来，干嘛去了，是不是去读书了？还去很远的地方去上学。


    女儿点点头说，是的，但是爸爸，上学读书之后，就不用被欺负，不用被山压着什么？


    达叔一下子就犹豫了，觉得这是个好问题，遇到一个事儿，能问然后呢？再然后呢？


    顺着逻辑，一路推演下去，这个小家伙，以后长大应该不是个笨蛋。


    但是，有很多人，几十岁了，考虑所有的问题，能想到的，最多只有一步，简单粗暴，鼠目寸光，一辈子都没学会多问几句，然后呢？


    比如，达叔今天忙完，回家之后，本来想探讨一下医疗话题的，结果吃饭的时候，看了一眼手机，被一些人的愚蠢，震惊了。


    在故事会里的乌有国，某个城市，今天新出了一个限售的政策，如果一定要给这个限售加一个期限，这个城市的主政官，一咬牙说，那就 5 年。


    结果，有很多人，是不买账的，觉得要十年，要一万年，买了就不许卖。


    ![](img/d747a49dab77676cf44faebe24df049c_276_0.png)


    达叔就顺着问一句，限一万年，然后呢？


    以下内容，是俺瞎想的，不一定对，随便看看。


    ### 1. 微循环


    今天早上，送完孩子去上学，达叔一路往公司飞奔，去听一个培训。


    可不可以不参加？


    当然可以。


    但是，屁颠屁颠跑去听课，有几点考虑：


    - 1、今年额外接了新兴市场，民营医院，要多卖一些产品，不能总卖原来的老三样。

    - 2、要卖好任何一个东西，都要深刻的理解这个东西，得弄明白，你卖的到底是个啥东西，说的通俗点，就是得专业。

    - 3、成年人的记忆曲线，一路下滑，容易遗忘，刚学完就忘了，得不断学，不断练，才能记住一点点。


    年纪大了，自己要有这个觉悟，勤能补拙，对新知识要多学几次。


    当然，以上的三点，不是最重要的，最重要的是，讲产品的姑娘，是很聪慧的，这个家伙是少见的，能把复杂产品简单化、讲清楚的人。


    她讲了很多，达叔晚上回来，能记住的已经不太多了，但是有一个观点，极其深刻。


    她说，人体，是一个很奇妙、很聪慧的组织。血管分为大动脉和小动脉，呼吸还分为大循环和微循环。


    大概的图，就是这样的。


    ![](img/d747a49dab77676cf44faebe24df049c_277_0.png)


    当一个人，身体是健康的时候，末梢循环里的氧气，和大动脉里氧气是差不多的。


    但是，当这个人，一旦生病，进入休克状态，人体组织非常聪明，立马会在主动脉和毛细血管连接处，关上闸门。


    氧气坐着红细胞的小火车，只在主干道上行驶，只供应主要器官，远端的神经末梢，氧气几乎全断了。


    几万年的生命进化，活下来的，都是一个套路，保大、保大、保大弃小。


    这还不是最有意思的，姑娘说，一个休克的患者，慢慢恢复，走向健康的路上，所有的指标，都在变得正常，而微循环里的数值，是最晚变正常的。


    也就是说，微循环这块，在生命体征遇到危险的时候，被最先放弃、被最先停止供应氧分。


    但是，等身体在慢慢变好的时候，其他地方都慢慢恢复供应了，微循环这个地方，最晚恢复。


    简单点说，就是达叔之前讲过的，利益总是自上而下分配，风险总是从下往上承担。


    在生活中的案例，达叔在 SK#129 逃不开的周期和趋势，有人假装不存在，文中探讨过。


    在乌有国，有一个三农专家，叫温铁军，他在《去依附》和《八次危机》中，探讨过很多，有一个群体，在历次危机中，都作为最后的劳动力蓄水池，作为危机成本最后转嫁之地。


    最后，他得出的结果是，《告别百年激进》，不要加速城市化，让这批人老老实实在农村乡镇待着，快乐的生活。


    到目前为止，他在年轻人群体里，非常受欢迎。这位憨厚的长者，是达叔目前看到最神奇的学者之一，这批喜爱他的读者，也是最神奇的存在。


    一个主器官，告诉微循环的神经末梢，你们这样挺好，不要激进、不要挤进主器官。


    神经末梢猛点头，啥也别说了，鼓掌吧。


    然后，就被断氧了。


    ### 2. 一万年


    达叔在很多文章中，都尝试探讨时间的概念，很多问题，我们现在看不清楚，但是放进时间的长河里，找找样本，基本上都知道了。


    太阳底下无新事。


    但是，达叔胆子再肥，再敢吹牛逼，最多也就吹了几个小的：


    - 1、研究人口结构，接下来是医疗行业，黄金 20 年。

    - 2、研究医保结算和全球经验，接下来是民营医院、新王当立 20 年。

    - 3、人类真正进入纸币时代，货币无锚时代，是从1971年布雷顿森林体系瓦解开始的，至今50年。在此之前，和在此之后，无论是哪个国家，历朝历代，但凡能发纸币的，没有一个不作恶的，没有一个能控制超发的，没有一个能忍住不掠夺的。

    - 4、伦敦房产价格上涨200年；

    - 5、大航海时代至今商业史，400-500年。


    也就是说，达叔平时读书，写文章，吹牛逼，胆子再肥，也就是最多扯到百年为单位，讲历史时间能扯一两千年。


    结果，搞个房产限售，有人能喊出限售一万年。


    达叔不知道，这位先生平时生活里，对时间有什么样的感知，知不知道三十年，就已经彻底沧海桑田、世事变迁了。


    三百年，很多王朝就覆灭了，上一个喊出要把一个坐垫，传千秋万代的，姓秦，到第二代，就传没了，还被身边人给勒死了。


    有一个伟人，用尽一生的力气、拼命喊出的一个政策，以经济建设为中心，100年不动摇。


    到现在为止，你们多久没听到这句话了？


    这距离他逝世，2021-1997=24年。


    24年，多少政策，烟消云散了。


    ### 3. 限售


    达叔弱弱的问几个问题，不回答也没关系，就是随便探讨一下。


    - 1、房子是不是一个商品？

    - 2、购买者是否拥有所有权？是否拥有支配权？公民的所有权，支配权，是否受法律保护？

    - 3、乌有国，说要建立一个法制社会？是真的，还是假的？怎么证明是真的？

    - 4、地方政府，限制公民支配自己的财产，这项权力，是谁赋予的？是否侵犯财产权？


    当然，以上只是从法律角度，问着玩的。


    作为一个一年交易三十万套，绝大部分是二手房的城市，一手房限售 5 年，对于房价的压制，到底有多少，达叔不方便说。


    这种手段，杀伤力不强，但是侮辱性极大。


    最后，尝试说点严肃的，一点猜测，随便看看。


    限字当头，但是，限与限，性质是不一样的，执行的力度和长短，也不一样。


    按照正常人，朴素的价值观，啥东西会限？


    1、好东西；

    2、需求大；

    3、数量不够。


    上一次这么玩的时候，是粮票、布票、肉票等票据时代，结果现在玩出一个词汇，叫房票。


    懂经济的都知道，任何一种票据，但凡有价值，都会衍生出金融属性，有人收，有人买卖，有人做这块生意。


    小地方的人，只能想到结婚要彩礼，还被骂，大城市的人，玩结婚用房票，比收彩礼刺激多了。都是用几块钱的结婚证来赚钱，地方能级不同，连身都不用出。


    当然，说新 xx 人不结婚不能买房的是你，说离了 3 年内不能买房的也是你，在一个城市里，彻底把婚姻物质化的，不是别人，就是你。


    最后，聊点限与限不同。


    #### 1、限售


    所有城市的限售，都坚持不了多久，都是侵犯财产权，也都是减少供给，本质上都是助推房价上涨。


    但凡知道一点经济常识，都知道，价格是由供给和需求决定的，不是由那只又粗又糙的手决定的，减少供给，是吓唬人的，是不对的。


    什么时候会停？


    当另外一个神仙，站出来挑战这个神仙的时候，神仙也会打架的。


    限售是一把双刃剑，肯定不用等一万年，就砍着自己了。


    #### 2、限价


    扭曲价格信号，增加寻租空间，这种事，历史上没有一次有好结果，都是一地鸡毛，不利于解决问题，只能拖延问题。


    最惨的人，是这一代人，估计再也看不到啥好产品了，产品质量堪忧，当然，这是你摇号中标，少付几十万的代价。


    喜忧参半，而已。


    #### 3、限购、限贷


    这俩估计会长期存在了。


    一直想把这个产业的投资属性和居住属性分开，能不能成，达叔不方便说。


    达叔能说的是，30年前，这块是个香饽饽，是朱老板花大气力，才干成的支柱产业。


    30年后，是这个待遇，挺有意思的。


    允许居住，限制投资，防止房价快速上涨，导致贫富进一步扩大。


    但是，有一群“刁民”，被启蒙运动的发源地—欧什么启蒙之后，再也不相信别的主义了。


    所有限制政策，都只能限制普通人，不能限制“刁民”，结果，惩罚了顺民，奖励了“刁民”。


    历史从来不会惩罚胜利者，因为这批胜利者，会在史书上，横平竖直的写，老子不是“刁民”，老子是掌握了科技树的专家，老子代表着先进生产力。


    这才是一万年跨度，一直发生的事。


    ## 第三十三篇 FC#32 从两千年前的那次抢劫讲起，房地产商是当代盐商


    大家好，我是达叔。


    一个想和大家一起慢慢变富的家伙。


    最近上海的天气，阴晴不定的，俺不知道这天气到底是变暖了，还是变冷了，反正现在是穿着羽绒服，躲在书房里，给大家码字。


    昨天写了一个文章，SK#139 我在尝试着贿赂你，前面讲了同一时空，不同人群在平行世界里，各行其是，是想和大家说，只要你肯折腾，无论有没有专业知识，都能赚到钱。


    绝大多数人，平日生活，圈子太小，达叔天天接触很多人，在外面浪，很早之前就写过，SK#108 边界与荒谜，见过的人，更容易有钱，这些都是掏心掏肺的话，能看懂多少，就看各位造化了。


    但是，昨天文章落笔收尾，最后一个章节，才是俺最想说的，做任何事情，一定要研究结构，经济结构、人口结构、变化趋势等。


    有部分读者，给达叔留言，说没看懂，达叔今天休息，在家看书，很惆怅，我都这么直白了，还能怎么讲？


    要不，今天讲个小历史故事，看看能不能好点。


    讲一个两千年前，发生的抢劫案。


    阐述一下，以前为什么不抢？后来为什么抢？再后来还抢了什么？抢的标准是什么？


    以下内容，只代表个人观点，不一定对，随便看看。


    ### 1. 结构


    各位都看各种历史剧，《大秦赋》、《汉武大帝》之类的，身边也有很多人，推荐达叔看。


    达叔年纪小的时候，特别喜欢看电视，小时候家里没电视，天天赖在邻居家看电视，一直把邻居家人都看睡着了，我把他家的电视机关了，把他们家的门给关上，一路跑回家。


    为此，小时候，没少挨打，有了一个外号，叫“电视迷”，俺最初的很多知识结构，都是来自电视节目。


    等再到来，看书看多了，把之前部分结构推翻，加上时间太忙，电视就看的少了。


    但最大的一个原因，就是电视节目，信息含量太少，太纠结于人物细节，个人的恩怨情仇，不利于理解这个世界，更不利于跳脱出来，思考全局。


    以秦皇汉武为例，电视看多了，只知道谁喜欢谁，谁杀了谁、但弄不明白，谁必须死，为啥一个人，慢慢就变成了这个德行。


    这是制度性结构造成的，不以任何人的意志为转移，也就是说，无论是谁，坐在那个位置上，只要想做事，最后都会变成那个局面。


    这种根本性的变化，结构性的研究，才是我们每天该思考的东西。


    而任何一个既有的组织，上到国家，小到公司，来回问，研究的制度，无非主要就是四种：


    - 1、如何分配：政治制度、组织的力量，各个部门，如何划分势力范围，相互制约等；

    - 2、如何产生：靠武力，枪、选举、考试、KPI完成率，血缘、亲疏，新旧代缴等；

    - 3、如何养活：赋税制度，营收、成本、毛利、净利等；

    - 4、如何保卫：国防和兵役制度，遇到风险，如何捍卫自己的权利。


    这种结构性的研究，在电视里，外行人只能看个热闹，已经看不出来了，达叔这个号，是一个庸俗的经


    类账号，研究如何变富的，我们就把第三步，如何养活的赋税制度，单独拿出来，剖析一下。


    ### 2. 规模的意外


    历史上，发生过好几次意外的事件，每一次都导致了规模的错配，最后引发新的抢劫。


    有一个姓马的说过，他弄了一个什么宝，在于的那天开始，就想清楚了，只要国家需要，随时随地，都可以献给国家。


    其实，当一个产业，规模大到一定程度的时候，不是你献不献的问题，而是必然要被抢的问题。


    但凡，一个产业还没有被抢，那是因为你太小，没有被抢的资格，导弹炸茅厕，不值得。


    两千年前，经济制度和政治制度，也是相互匹配的。


    在政治上，皇权之外，还有相权，皇室和政府，是分开的。


    在经济上，赋税制度与之对应，全国的农田租入归政府性收入，收钱的人叫大司农，这是大宗收入。


    而山海池泽，这方面的收入，专供皇帝私用，收钱的人叫少府，这部分钱是少数。


    但是，一个奇怪的事情，发生了。


    经济慢慢发展之后，人口暴增，盐铁之利大增，本来占小头的山海池泽，收入开始大于全国田租。

