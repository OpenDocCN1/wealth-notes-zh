    # 1


    夜壶和水壶。


    以前地产行业，有个夜壶论，这个理论是说房地产行业是地方政府的夜壶。


    地方政府憋不住了，拿出来用一下，用完又嫌这玩意脏，一脚踢到床底下，藏起来，羞于见人，嘴里还骂骂咧咧的。


    正经人谁写日记啊，在这里，说的是，正经人谁用夜壶啊。


    但是，年龄到了，就是得夜里起来，憋不住，经济也和生物体一样，是一个有机体，有自己的周期和生老病死。


    憋的久了，就得起床，否则要么把自己憋死，要么得尿床上，两个成本都不划算。


    每一次，睡觉的时候，都告诉自己，今晚的我和以前不一样，结果，每晚都一样。


    不一样的是，这次你是憋到了夜里两点，还是夜里四点，反正你是憋不到天亮。


    因为，这就是生理期啊，你和周期较个什么劲，该用就用嘛，不丢人。'
  - '[PAGE 227]


    经常尿床的人，凌晨两点爬起来，发了个朋友圈，炫耀一下：


    大家快来看，俺这次没尿床，今晚真的和以前不一样。朋友，请把手机放下，躺好，能撑到天亮，才是真的牛逼，先别喝粥。


    当然，除非你准备在床上干点别的，比如要搞点芯片啥的，要弄点高科技，一时半会不方便起床。


    别忘了，憋的太久，会把膀胱憋坏的，达叔是做过泌尿科生意的，对这块多些懂一些。


    但是，人一旦要是犟起来，不吃点亏，是不会乖乖收手的。


    这样人定胜天的口号，我们过去70年，喊过好几次，每次被经济规律暴揍一顿，也就老实了。


    知错、改错，不认错，套路是一致的。


    达叔今天要聊的，不是夜壶理论，要聊点水壶。


    达叔小时候，生活在农村，自己在煤球炉上烧开水，用个大水壶，一烧开，冒白烟，呼呼响。


    这个时候，不让这个水壶叫，有2个办法：


    +   1、把水壶赶紧拎下来，不烧了。


    +   2、把炉子里的火给灭了，也是不烧了。


    从来没见过，炉子里的火很旺，是憋了好几年的，新上的灵长类碳水化合物，还从天上撒下来一堆又一堆的纸币，作为引燃物。'
  - '[PAGE 228]


    你舍不得把水壶拎下来，现在却对着水壶，呼哧吹口哨的聋嘴喊，我命令你，不允许再吹口哨了，否则惊醒了一屋子睡觉、打游戏的人。


    不知道，有没有小朋友，闲得蛋疼，尝试着去拿个东西，把水壶的口给堵上。


    达叔小时候，干过，很危险。水壶盖子都掀翻了，水壶恨不得在火炉上跳了起来。瓦特研究水壶，发明了蒸汽机，达叔研究水壶，差点就毁容了。


    而真正懂沸点、烧水原理的人，早就知道了，只要水壶没拎下来，过一段时间，水都会烧开。


