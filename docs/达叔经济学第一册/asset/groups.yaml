    柏林上涨速度最快，6年翻一番。


    所以中国那些以德国房价为崇的文艺青年，不要再异想天开了。


    德国的经济增长速度快，还是中国的经济增长速度快？？


    答案显而易见。


    德国之前可以长期保持房价平稳，是有一定历史原因的，分析任何一个地区，都要掰开来看，看仔细了，自己是否够复制。


    德国经验不可复制原因如下：


    - 1、德国所有的城市，规模都不大，更没有超级城市。


    就像前文提到的，德国最大城市，首都，柏林，人口规模只有 400 万左右。


    这个规模放在中国，相当于谁？


    相当于青岛，西安，这样的规模。


    上海的人口规模统计口径不同，大概是 2500 万，相当于 6 个柏林。


    人口压力，不可同日而语，各位读者可以对比一下，柏林和自己所在城市的人口规模。


    人口越少，房价上涨压力越小。


    而拥有超级城市的英国和法国，资产价格表现，完全不一样。


    英、法、德三国人口规模都在 6000-8000 万之间，但伦敦和巴黎人口规模都是 1200 万左右，远远高于柏林，属于典型的单核国家。


    英法的首都人口规模是第二名城市的 6 倍左右，下图是之前英美法德四国的 20 年房价累计增长，达叔敲一下黑板，是 20 年，复利增长，拿出计算器算一下。


    ![](img/d747a49dab77676cf44faebe24df049c_48_0.png)


    中国是有北京上海等超级城市的。


    部分省份人口也是 8000 万左右，人口相当于欧洲一个国家，GDP 也差不多了，省会相当其首都，人口向省会涌去，压力极大。


    关于 GDP 的规模，达叔给一张图，让各位看一下，各自的省份相当于哪个国家。


    ![](img/d747a49dab77676cf44faebe24df049c_49_0.png)


    - 2、德国独特的历史：


    德国是超级强国，经常在历史上不断有高光时刻，但是很多人忘记了，德国是一个历史很短的国家。


    俾斯麦统一德国、至今也就 200 年左右的历史，历史上是数百个公国，各个公国都有自己的传统工业，每个公国都有自己的首都。


    独立之后就没调皮，去凑别人，又被别人揍。


    二战后，又被割裂为东德、西德两个国家，人口是无法自由流动的。


    重新统一之后，人口开始向柏林流动，但是各个城市带都有自己特色的就业、学校、医疗，中国哪个省可以说自己手里的各个城市均衡发展，都有特色？


    ![](img/d747a49dab77676cf44faebe24df049c_50_0.png)


    还有别的因素么？


    有的。


    德国住房供应整体充足，工业化起步较早，长达两百年左右的工业史，存量房体系完整，质量较高。中国工业化、城市化只有短短几十年，存量房市场极少，质量又差，缺少高品质小区。


    德国也迎来老龄化，而且是老龄化也很严重，对住房的需求有一定抑制。


    还有就是货币政策，德国是欧元区的主要国家，整体保持了货币稳定，物价稳定，在全球主权国家里，没有滥发货币。


    只要不滥发货币，人民对手中资产，保值增值的动机就会稍微低一些，不会那么焦虑。


    但即使如此，最近 8 年时间，柏林的房价还是一飞冲天。


    在房价增长方面，全球主要城市已经无一幸免。


    德国的经验或模式，不仅对中国没有借鉴意义，对全球主要发达经济体都没有借鉴意义。


    任何一个国家的政治或经济模式，都要根据自己的历史、地理和文化约束，找到适合自己的道路。


    在中国至少还有整体经济的快速增长，没有像发达经济体那样陷入停滞，中国青年哭喊的阶层固化，那是没有看到欧美日韩的阶层，什么叫做真正的固化。


    有人谈，中国和德国的房价收入比，如果自己的收入和德国人一样，就不抱怨，这个逻辑一塌糊涂，更没有财富的逻辑思维。


    房价收入比，很多人都算错了，不是现在的房价除以你的现在的收入。


    房价收入比=现在的房价/未来的中高人群收入*100% 中间标红的字体要好好看，好好思考。


    房价是一个城市的股票，即使是股票，那么现在的房价就是对未来这个城市收入的提前反应，优质股票高估值，是很正常的吧？大家都不傻。


    未来肯定不是所有人都买得起房子，全球一线城市里租房率，纽约 68%，东京 54%，香港 55%，首尔 60%，这才是世界的真相。


    一半人只能租房子，能买的起房子都是中高收入人群，或者早买的人。收入越高的人，隐形收入就越高，收入来源渠道就越多，这么听着是不是又让人绝望了呢？


    最后一点，其他国家房价收入比低一些，是因为？因为中国目前收入水平低，但是未来预期收入增长速度快，每年工资都有增长，甚至每年增长 8% 以上。


    但是欧美等国家，中产阶级的收入早已陷入停滞，他们收入水平高，但是预期收入增长慢了下来，属于稳态社会，真正的阶层固化。


    全世界的年轻人，日子都不好过，不仅仅是中国的年轻人不好过。


    奋斗吧，骚年，不要把困难留给下一代。


