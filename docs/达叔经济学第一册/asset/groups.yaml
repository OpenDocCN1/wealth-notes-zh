    当然，说新 xx 人不结婚不能买房的是你，说离了 3 年内不能买房的也是你，在一个城市里，彻底把婚姻物质化的，不是别人，就是你。


    最后，聊点限与限不同。


    #### 1、限售


    所有城市的限售，都坚持不了多久，都是侵犯财产权，也都是减少供给，本质上都是助推房价上涨。


    但凡知道一点经济常识，都知道，价格是由供给和需求决定的，不是由那只又粗又糙的手决定的，减少供给，是吓唬人的，是不对的。


    什么时候会停？


