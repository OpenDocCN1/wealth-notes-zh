    ## 第十篇 FC#10 如果你做老大，你会让什么样的手下赚钱？


    达叔这几天在开个总裁公益会，开个眼睛都快睁不开了，但是尽量还是要写一篇文章，不能断更。


    本文的标题，是这几天开会想到的，以此展开，探讨一下财富的逻辑。


    假设的背景：


    2020 年 7 月 1 日，你被任命为东山市市长，管辖人口 500 万，请问在当前情况下，你如何带领大家走出困境？


    受疫情影响，服务业萧条，工厂开工不足，公司倒闭，失业暴增，税收严重下降，财政出现严重负增长。


    失业暴增，会导致一个直接的后果就是社会治安下降，大批悍匪出没，当年的李嘉诚儿子，今年美的百亿老板何享健遭绑架。


    ![img](img/d747a49dab77676cf44faebe24df049c_61_0.png)


    面临如此情况，请问作为市长的你，如何破局？闭上眼睛，想一会。


    一般来说，其他领导的操作方法，无非几招：


    1. 印钞，让经济保持流动性。

    2. 减税，让快死的企业能再坚持坚持，解决部分就业。

    3. 基建、地摊，让所有人都有事干，不能闲着，闲着容易出事。


    明眼人，都能看出来这几招都有一定的问题。


    比如，印钞权是在中央，地方政府是没有印钞权的，地方政府如何做呢？


    发债。


    地方政府的债务，就是地方政府的印钞机，但是所有市长都知道，所以很多地方政府的债务都是很高的。


    你看看你接手的东山市，原来的地方债务就已经很高了，利息还起来都很难，有其他办法么？搞城投平台借债。


    城投平台公司能干什么呢？


    高科技是肯定干不了的，普通的行业也同样干不了，能干的有一些业务：


    - 自来水、煤气、热力、公交系统、学校、医院、公园、房地产开发，建筑等。


    资金规模大，就业多，行业垄断、稳定，不会亏钱，还能扩大就业。


    所以各位近期可以看一下自己所在的城市，有没有在修路，如果这个时间点没有修桥铺路的，你们这个城市太没出息了，赶紧跑吧。


    减税，会导致什么？


    目前中央和地方的财税体制，税收七成上交中央，三成留给地方，目前税收急剧下降的话，你作为市长，下面一大堆兄弟跟着你吃饭，你是不是连工资都快发不出了？


    再减税，日子还过不过了？


    请问眼巴巴的上万名不从事生产的公务员和事业编、研究院要发工资，怎么办？


    看看隔壁几个市是怎么解决的。


