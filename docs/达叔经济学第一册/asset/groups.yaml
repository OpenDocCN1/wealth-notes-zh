    # 第十六篇 FC#15 从上海落户新政开展，聊点规律和预测


    中国人口总数，大概率到顶了。


    换句话说，就是人口不再有增量，剩下只有城市之间的人口存量竞争。


    头部的城市，也不例外。


    在今天之前，全中国只有两个城市的落户政策还极其不友好，一个是北京，一个是上海。


    今天，上海出现了一丝的松动。


    ![](img/d747a49dab77676cf44faebe24df049c_126_0.png)


    此外，《办法》还明确提出，将之前以北京大学、清华大学为试点，探索建立对本科起点为国内高水平大学的应届毕业生，符合基本申报条件可直接落户的政策，范围扩大至在沪“世界一流大学建设高校”。


    在沪“世界一流大学建设高校”包括上海交通大学、复旦大学、同济大学、华东师范大学，因此四校应届本科毕业生符合基本申报条件即可落户。


    这也意味着：博士，双一流硕士，清华、北大、复旦、交大、同济、华东师范大学等六校的本科毕业生，将都可以直接落户上海。


