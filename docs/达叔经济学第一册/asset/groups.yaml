    # 第十五篇 SK#63 一个草根是如何爬起来的，关于成长和投资的一点思考


    今天的文章会写一点达叔对成长和财富的思考，仅是个人经历和感悟。


    不熟，不做。


    这个道理，看着十分的简单，但是很多人不交一遍学费，就永远不知道自己的边界。


    好多年前，达叔在上大学的时候，有一天，某学弟兴冲冲的跑到达叔宿舍，说在网上一批运动鞋，价格非常便宜，50 块钱一双，总共有 600 双，要不要做？


    算一下账，50*600=3 万，达叔和学弟还有另外一个同学，每人凑了一万，去淮海路把货给拿了。


    那一年，达叔大二。


    鞋子是耐克，是高仿，肯定不是真货，这我们三个心理都是有预期的。看着质量挺好，觉得拿回来，卖 100 块一双，1-2 个月翻一倍，是肯定没问题的。


    为什么这么自信？


    因为达叔当年在学校也算是一个小小的风云人物，搞校园旅游等，能调动的资源还是挺多的，掐指一算，能覆盖三个大学城，十几万的潜在客户。加上觉得运动鞋这个东西是个刚需，就把货给进了，连价都没讲。


    # 为什么？


    觉得 50 块钱一双，很便宜。


    卖家是一个住在上海淮海路，老破小，一个女的，浓妆艳抹。


    这批货是他一个朋友的，鞋子堆在她的房间里，除了床，全部堆满了。等达叔再长大一些，推测这应该是一个性工作者，鞋子是她一个客户的。


    中间有很多的故事和艰辛，在这里就不展开了，除了直销之外，达叔慢慢发现，好像掉进坑里了。


    - 1、鞋子是有尺码的，好销的尺码卖的较快，越到后面，偏大和偏小的尺码，滞销了，这一点，年轻时代的达叔，竟然没想到，绝大多数的生意人，最后都是死在库存上。


    - 2、开始做分销。发现同样是学生，隔壁一个同济的，研究生，比达叔大 4 岁左右，明显工作就做的很扎实。


    他过来看了一下产品成色，达叔当时给他的报价是 60-70/双，他回去做了 3 天的调研，告诉达叔，你手里的货价格大概在 15 元/双。


    这种震撼，好多年过去了，一直深深印刻在达叔的脑海里，达叔本能的反应，就是觉得这个家伙是个骗子，是杀价的策略，完全不相信。


    这个同济的研究生，一脸怜悯看着年轻的达叔，问，你的拿货价是多少？我把研究的路径和你说一下，你研究一下是不是拿高了。


    于是，达叔从网上的阿里巴巴店找到福建、广东货源，再到学校周边找了几家实体店老板，调研一番之后。


    他是对的。


    晴天霹雳，这种信仰的崩塌对人气土的打击是巨大的。


    当你拿货价是 50 时，卖 60，是理直气壮的，当你知道


    自己的产品价格是在 15 左右，再卖 60，内心的障碍就要高很多。


    这是很多经销商老板，不告诉自己手下销售产品底价的原因之一，怕影响士气和心理微妙变化。


    后来，经过一番操作，直销 + 分销 + 尾货处理给了劳保店，折腾一个学期，财务上来算，不赚不赔。


    但从机会成本来看，损失惨重。


    后面的一些年里，任何生意，达叔都变得谨慎很多。


