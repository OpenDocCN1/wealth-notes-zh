    \ 当东方太阳升起的时候，根本不需要灯塔---危机时代的经济学\n\n美国一直自诩是山巅之城，是全世界自由文明的灯塔。美国倡导的新自由主义经济学，从里根时期开始流行，苏联解体后，横行全世界，势不可挡，成为全世界国家效仿的对象。\n\
    \n直到，有一个坏学生。\n\n一边学著、一边批判，学什么只学一半，成长为全球第二大国。\n\n经济学是一个年轻的学科，学科内部四分五裂，泰斗之间观点打架，是常有的事，其他学科打架，是可以通过实验验证真伪的。\n\
    \n经济学理论是指导人类行为实践的。\n\n每一次实验，都是千万上亿级别的人，几十年的灾难，比如苏联，比如我国的前面三十年，一代人的青春，就毁了。\n\n\
    达叔反复强调，框架比努力更重要。\n\n新自由主义诞生于上个世纪 30 年代，全球道路大论战时代。\n\n代表学派有奥地利学派，也就是江湖上简称的奥派，代表人物米塞斯，哈耶克。其中哈耶克凭借《致命的自负：社会主义的谬误》系统理论，指出苏联模式计划经济的问题，伴随苏联解体，声名大噪，享誉全球。\n\
    \n新自由主义经济学派的基本主张：\n\n- 全面私有制，把所有制全部私有化；\n- 财富分配观：贫富差距两极化是正常现象，有助于提高经济效率；\n- 反对国家干预经济，政府是必要的恶，即使干涉，也要做到尽量小；\n\
    - 主张一切产业自由竞争，无需产业政策，更无需产业保护。\n\n这一套玩法，非常激进。\n\n在东方和社会主义经济理论争夺市场，在西方内部也和凯恩斯主义强烈碰撞。\n\
    \n20 世界 30 年代，只是作为理论在学术圈讨论，在 1970s 撒切尔、里根的英美时代，开始逐渐主导经济政策。\n\n没有什么国家会拿自己的政治前途和国家命运做赌注，除非局面彻底混乱。\n\
    \n新自由主义经济学家，登堂入室，代表人物：美国经济学家 杰弗里·萨克斯（Jeffrey Sachs）在拉美濒临崩溃的玻利维亚，受聘为国家经济顾问，实行“休克疗法”，一战成名。\n\
    \n苏联解体，萨克斯满怀喜悦，调转枪头进入东欧和苏联，再次充当起了国师的角色，最终的结果，俄国变成了穿头的俄国，彻底失去了往日的荣光。\n\n新自由主义迎来了最大的客户，却失败了。随后的实验，在拉美失败、在非洲失败、在中东失败。\n\
    \n东方的大国，看在眼里，一边努力学习其精华，一边警惕其糟粕，摸着石头过河。\n\n达叔之前的文章里提到过，中国的经济模式理论界，主要还是从西方过来的。\n\
    \n只不过第一个老师是苏联，第二个老师是美国，两个老师都学习，都批判，结合了自己的文化底色，形成了自己独特的混合所有制、国家主义、重商主义，从而快速崛起。\n\
    \n但是中国模式真的特殊么？经济崛起之路，没有多少特殊的。\n\n前面日本是德国的东亚版，苏联是德国的斯拉夫版，国家主义动员力量这一套是有迹可循的。\n\n\
    另外经济的渐进主义，韩国在中国前方 20 多年走过的路，中国亦亦步亦趋再走一遍，只是我们规模更大、人口更多、崛起的力量和震撼更强。\n\n1960 年代，韩国从低收入国家进入高收入国家，进入城市化，人口迅速向首尔集中，每一步是怎么做的，旁边的大个子都看在眼里。\n\
    \n- 第一步：发展纺织、玩具等劳动密集型行业，靠卖力气赚钱，形成原始积累，也解决就业，让人民有获得感，从而支持改革。\n- 第二步：发展钢铁、化工等资本密集型产业，从劳动力密集型到资本密集型。\n\
    - 第三步：汽车、电脑等进行技术升级。\n- 第四步：发展微电子、半导体等高精尖行业，进入技术密集型阶段。\n\n再往上，就是美国的玩法收割全球、全球吸血，其他国家都玩不了，美国独霸。\n\
    \n韩国和日本基本都是这么玩起来的，也都止步于此。\n\n韩国创造的所谓 “汉江奇迹”，中国也创造了震惊全球的 “中国奇迹”，但是骨子里，是差不多的。\n\n\
    中国走到哪一步了？第三步到第四步之间，就有人使绊子了，大家都看到了。\n\n贫穷的原因可能各不相同。\n\n致富的道路，本质上就两条：一个是生产，一个是抢劫。\n\
    \n西欧的老牌帝国主义，靠黑奴贸易、殖民地掠夺，实现了原始积累，工业革命后向全世界输出工业品，把世界作为市场倾销地，谁拒绝和它做生意，它就船舰利炮干掉谁。\n\
    \n为什么？当然是要贸易自由啊。\n\n富强起来的人，是有资本讲故事的，每一段残暴的历史，都可以漂白，讲成是完美的民主体制造就了富裕，绝大部分人也分不清什么是因，什么是果。\n\
    \n成功的人，说什么，就是什么。\n\n新的美帝，靠着军事霸权、美元霸权，吸血全球半个世纪，印钱就是抢劫。\n\n几场局部战争打完后，债台高筑，贸易逆差，民众没有获得感。\n\
    \n民粹上台后，突然发现自己玩不动了。产业空心化，生产逐渐不行了，主要靠打劫。但打劫是有成本的，维持暴力机器和全球秩序是要花钱的，如果花不起了，就该收编了。\n\
    \n新自由主义经济的道路，可能要终结了。\n\n凯恩斯主义的第一次闪亮登场，也是大危机时刻。\n\n那一次，有一个上了课本的名字，叫罗斯福新政。\n\n这一流派主张：政府要发挥作用，扩大开支、实行赤字财政、刺激经济繁荣。\n\
    \n这一次新冠疫情导致的全球经济衰退，我国又在推动新基建项目，就是这个理论指导下的结果。\n\n其他国家呢？也差不多。美国为了救股市，把美元都印毛了。\n\n\
    经济是一张网。\n\n你看到的是——— 餐馆倒闭了，但不仅餐馆没有了，餐馆里的就业也没有了。\n\n餐馆上下游的经济活动都受了影响，锅碗瓢盆、辣椒酱油、萝卜青菜、猪肉牛肉、水电煤气，一荣俱荣，一损俱损。\n\
    \n连锁反应：餐厅倒闭---农场倒闭---银行倒闭，最严重的结果就是整个金融系统崩溃。\n\n在新自由主义的指导下，经常出现灭国级的大危机。\n\n在凯恩斯主义的指导下，世界平静了很多，再也没有出现上个世纪大萧条那样的大危机。\n\
    \n更没有出现，因为大萧条导致的战争，因为人们找到了更好的解决方案，印钱、放水，把问题往后延，直到把竞争对手拖死。\n\n腐尸可以喂饱一群野兽。倒下的苏联，让整个欧洲吃饱、满血复原，再次繁荣三十年。\n\
    \n有人会问，为什么之前的危机不发烧？因为那个时代是金本位时代，央行并不掌握真正的货币发行权，是货币形式限制了政府的货币政策。\n\n布雷顿森林体系瓦解之后，全世界的央行都获得了解放、自由，剩下的就看各国央行下手重一点，还是轻一点了。\n\
    \n那我们该如何应对？参见达叔之前的一篇文章：[JL#3](3) 如果大萧条来了，普通人应该怎么办？\n\n极端自由主义者，怀念的时代，一去不复返了。\n\n\
    饱受争议的国企政策。\n\n达叔小的时候，学习经济学，算的是小账。\n\n只从经济学的角度看待国企，看到的满眼都是代理风险、国企效率低、产权激励不清晰，等等，都是问题。\n\
    \n等达叔后来工作、创业，做的事越多，越能理解，不仅要算小账，还要算大账。不能只从经济效率的角度来看，更应该从财政税收、社会稳定的角度来看。\n\n中国自古以来，就有官山海、盐铁专卖的传统，薅羊毛、而羊不叫唤。\n\
    \n财政支出按照国际惯例理论上需要公开，如果是国企收入，收的钱多，还可以自由支配，又可以增加就业人口，维持社会稳定。\n\n在国家需要的地方，民企、外企不愿意干的活，由国企来操作。无论是为人民服务的宗旨，还是国家安全，一举多得。\n\
    \n于是我们有了全世界覆盖最广的铁路高铁，全世界最广的邮政、信号网络。\n\n当然，优点并不能掩盖其缺点，新一轮的国企改革，又开始了，未来会更加市场化、更有效率。\n\
    \n实事求是，是一种态度，不是说着玩的。\n\n苏联解体的时候，美国学者福山，曾经发表观点《历史的终结》，最近出来承认错误了，历史不仅没有终结，道路选择也没有必然，新一轮的模式之争才正式打响。\n\
    \n疫情是一场考验，高科技的封锁也是一场考验，内部治理更是一种考验。\n\n一边是稳定压倒一切，只有稳定，才能发展的实用主义。\n\n一边是无法呼吸、游行示威、纵火抢劫的所谓自由主义。\n\
    \n这个世界，只听一种故事的时间太久了。\n\n![](img/d747a49dab77676cf44faebe24df049c_420_0.png)\n\n\
    灯塔的灯光太微弱，当东方太阳升起的时候，人们可以看的更清晰、看的更遥远，根本就不需要灯塔。\n\n## 第五十一篇 JJ#11 不到万不得已，不要掺和地摊经济\n\
    \n今天达叔出差，碰到个朋友，说自己工作不顺，问达叔可不可以去摆地摊，前几天两会，总理记者会里，不点名表扬明星城市成都，全面放开地摊经济。\n\n达叔来聊一下，普通人的崛起很难，不到万不得已，不要掺和地摊经济。\n\
    \n达叔小的时候，生活在农村，赶集，卖过辣椒、蒜苗等农产品。\n\n上学的时候，在上海摆过地摊，卖过运动鞋。\n\n这两段经历，都是贫穷且惨痛的，风吹日晒，不赚钱。\n\
    \n一直到 2008 年，达叔率队参加创业大赛，百联集团举办的，杀入决赛，有了更多的体验。\n\n决赛的规则，简单且粗暴：\n\n四只队伍，在百联商场上百家店铺中，挑选一个店铺的产品，在商场门口摆摊销售，8\
    \ 个小时，销售额最高者，成为最终冠军，赢取创业奖金。\n\n半决赛的时候，达叔的队伍是第一名，所以达叔拥有优先选择权。\n\n每个队伍有 4 个人，达叔和另外三个小伙伴，研究了商场的各个品牌，结合当时的季节交替，最终选择了当时比较火的一个服装品牌—佐丹奴。\n\
    \n是的，达叔这个队伍选择了服装这一品类，信心满满。其他三支队伍中，有另外两支也选择了服装的品类，只有一支队伍出来摆摊的时候，让我们三组都很困惑。他们选的是纪念品——2008年的奥运吉祥物、和奥运纪念币。\n\
    \n我们三组，嘴都快笑歪了，这个玩意，会有人买？\n\n一套正版福娃1000元左右，奥运纪念币便宜的数百元，贵的一套数千元。\n\n![](img/d747a49dab77676cf44faebe24df049c_422_0.png)\n\
    \n比赛开始了，一个小时后，胜负已经没有必要悬念。后面的赛程，只是单方面的屠杀。胜负与个人的努力，毫无关系。\n\n比赛结束，卖奥运纪念品的那一组营业额八万多，我们卖衣服的三组，没有任何一组破万，这个时候，三千还是五千都不重要了。\n\
    \n重要的是，给达叔带来的震撼，是贫穷限制了我们这群穷学生的想象。\n\n比赛结束，当天复盘，我们几顿吃饭聊天：\n\n- 我们每个人的月生活费在800-1000左右，我们不会买，就本能的也认为其他人不会买。\n\
    \  用自我的视角，代替了这个世界的真实面貌，上演了一次，井底之蛙。\n  中行原油宝爆仓前，几乎没有多少人知道原油宝的理财产品，投资者投资规模上千万。\n\
    \  上千万的房子，到底是谁在买？在深圳和上海等一二线城市，好产品出来，还排队买着家买。\n  当然，这些都是达叔后来知道的，但达叔很多年前，就不惊讶了。\n\
    - 完全低估了有钱人的消费力。尤其是带孩子来逛商场的，孩子喜欢，刷卡买单。千把块钱对很多人来说，是个小钱。\n  类似这样的问题，还经常有人在公众号和知乎里问达叔，真的有那么多人钱么？有的。\n\
    - 低估了奥运等盛大节日带给人民的喜悦和狂欢，这种喜悦和狂欢，真的是一个商机，情绪是很值钱的。\n  每一个盛大活动来临的时候，不要只做一个旁观者。\n \
