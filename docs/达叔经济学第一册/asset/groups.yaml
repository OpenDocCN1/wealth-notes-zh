    ## 第八篇 FC 48 怎么看待全球住宅价格最高的十大城市, 中国占 4 个?


    最近全国楼市蠢蠢欲动，知乎上关于房价的讨论，又开始多了起来。


    有一个帖子，耸人听闻，就是今天的标题。


    + 城市 经济 房价 房地产 如何看待/评价 X


    ### 怎么看待全球住宅价格最高的十大城市中国占4席?


    中国4城市成为CBRE世邦魏理仕《2020全球生活报告》全球住宅价格最高十大城市，套均价分别为：香港1,254,442美元、上海905,834美元、深圳783,855美元、北京763,498美元。


    ![](img/d747a49dab77676cf44faebe24df049c_41_0.png)


    达叔看了半天，没几个人说在点子。


    知乎上最惨的就是一群医生、律师、科研、IT、大学生等受了一定高等教育，但是财商教育几乎为零的家伙。


    自视文化程度甚高，却没有系统的经济学思维，对财富规律完全不懂，头越硬，被爆头的风险越高。


    最终沦为《穷爸爸富爸爸》书中有才却无财的教授型爸爸。


    这个表单的所有逻辑几乎都是错的，排名见下。


    一、住宅不能玩“套均价格”，原因有二：


    1、各国房产产权差异极大，你拿私有产权和合作公寓，进行价格平均，完全是胡扯。


    以纽约为例：


    纽约的房子分为：


    - 私有公寓（condos），性质上，在上海相当于商品房，个人拥有百分百产权，可自由交易，这个比例在纽约占多少？在纽约的所有住宅房产中只占30%左右。这30%的房子，可自由交易，价格非常贵，属于有钱人的资产。

    - 合作公寓（co-ops）：性质上相当于上海的经济适用房、廉租房，个人只拥有部分产权，很难买卖，这种房子的数量在纽约占比是70%，数量极其庞大，价格也很低。


    上海和北京也有经济适用房、廉租房，但是占比是多少？


    截止到2018年底，北京共有产权房只有9万套，上海只有13万套。


    但是两个城市的房子规模是多少？


    不同口径的统计，


    北京大概在700万套左右，上海780万套左右。


    共有产权房占比2%不到。


    共有产权房，在上海也推了好几年了，价格也很低，政府出土地，占一定的产权比例，你出钱，价格便宜，你卖的时候，政府有优先购买权，


    增值的部分，政府也要分，你买么？很多人不买。


    自己国家的共有产权房，价格低，自己不买，还要羡慕人家的共有产权房价格低。


    双标？


    拿 70% 的共有产权房，和 2% 的共有产权房，城市价格比“套均价格”。


    双标？


    中国未来肯定会打造出：


    - 商品房

    - 共有产权房

    - 廉租房


    三是独立模式，拉低套均价格，目前正在大力推进。


    这三种类型，分别满足：中高收入人群、中低收入人群、低收入人群。


    分配方式不同，但是肯定不会改变 100% 产权商品房的房价走势。


    2、要真正的比价格，要拿地段比地段。


    纽约的楼市根据地段分布，价差极大。


    ![](img/d747a49dab77676cf44faebe24df049c_43_0.png)


    中央公园一带是豪宅区，均价 4 万美元/㎡，人民币 28 万元/㎡。


    北京上海的高端住宅区，目前均价只有十几万/㎡，是纽约的一半。


    分为三层：


    - 第一层：曼哈顿，均价大概在 2.3 万美金/㎡，16 万人民币/㎡左右，北京城区目前价格在 8 万/㎡。

    曼哈顿岛是纽约的核心，面积相当于北京的 2 环，岛内价格相差也极大。


    上面的中央公园，就是例子之一。


    一旦离开曼哈顿，价格迅速下降，急跌。


    - 第二层：纽约市

    - 第三层：纽约都会区。


    一旦离开曼哈顿岛，


    布鲁克林岛价格排名第二，但价格只有一半，均价 1 万美金/平米，是不是和北京差不多了？


    皇后区的价位排第三，价格只有 5000 元美金/平米，价格是不是只和北京的昌平、上海的嘉定南翔差不多？？


    综上，


    达叔的观点：“套均价格”进行统计，是框架性错误。如果要真的研究楼市，这个表格中，还有一个特别有意思的点，供各位思考：


    在所有文艺青年的脑海中，德国是房价控制最好的国家。


    但是慕尼黑为什么在榜单中排名世界第二？！


    竟然还差距一点点，借数给房价疯魔——香港！！


