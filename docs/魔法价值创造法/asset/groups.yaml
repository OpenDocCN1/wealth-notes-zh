    ## 扫描添加获得顶级新资讯


    ![](img/890ce61ca06d64617114fb3cd49e7cba_2_0.png)


    李炳池公众微信号 **LBC333**


    李炳池直接营销机构 版权所有


    如何利用鲜为人知的价值创造法来增加你的想法、技巧以及产品的价值——“魔力”价值创造法让你立即赚大钱……


    亲爱的朋友：


    我希望以下内容不会“让你感觉太枯燥”……


    我会迅速列出几个词语。你来告诉我当你听到它们的时候最先想到的是什么。


    不要细想。


    只要告诉我当你听到他们时最先想到的东西就可以了……


    听好了：


    巫毒……


    巫术……


    魔法……


    魔术……


    炼金术！


    好了，当你听到这些词语时最先想到的是什么呢？


    当你听到它们时是什么感觉？有没有一种神秘而有趣的感觉？抑或感觉有点危险？


    好吧，我故意用这些词语营造一点“神秘效果”，因为我想吸引你的注意。


    现在，我不会真的向你展示什么“魔法或巫术”（对不起，永远不要费心学习黑魔法）。不过我要向你展示的东西可能与之十分相似。对你来说这个更有价值……


    “炼金术”一词如何能在你销售策划案，点子，文案写作，技能培训，服务推广，等等信息类产品的时候帮你赚大钱……


    现在你可能注意到我之前列举的一系列“惊人”的词语中，最后一个词语是“炼金术”。


    你之前听说过这个词语吗？这个词比较奇怪。


    但它同时也是个比较酷的词。说它酷是因为它代表着一些无法单纯用一个词描述的东西……代表着能够让你成功以及改变你的生活的东西。


    当听到“炼金术”这个词的时候，大多数人会想到一个试图把铅变为金子的中世纪的疯狂科学家……或者一个站在沸腾的“魔法药水”罐旁边的魔术师。


    当我想到“炼金术”这个词的时候，我会想到一个名叫保罗·皮尔泽的人。


    ![](img/890ce61ca06d64617114fb3cd49e7cba_5_0.png)


    保罗·皮尔泽（Paul Pilzer）出生于1954年1月17日，是美国经济学家，纽约时报畅销书作家，企业家。是花旗银行最年轻的副总裁。曾先后担任布什、克林顿两位美国总统经济顾问的著名经济学家，他也是六家公司的创始人。于2009年12月首次受邀访华。


    他写了好几本书，如：《点石成金》、《上帝要你富有》、《财富第五波》、《下一波财富狂潮》等。他是一个有趣的人，他通过自己的事业赚了很多钱。也帮助其他人取得了成功。他对
    “经济炼金术”这个概念进行了探讨-这个概念阐述的主要是当我们用完能源后，如何寻找创造并使用新能源的办法————以及如何更有效地利用旧能源。


    比如：在过去的几年中，人们一直倍感忧心，担心土地被用光，无法再种植食物，担心人口过度增长，人们在大街上不得不为抢一个土豆而大打出手。


    解决方法——**炼金术**。


    足智多谋的农民以及科学家找到了一种方法，可以仅仅在一小块土地上种植相同数量的农作物。


    我曾经看到过一个预言，说我们可以在相同的土地上种植相当于一百年前三十倍数量的农作物。想想吧——同样的土地，三十倍的农作物。简直不可思议。


    欣慰的是：人们不必在街上大打出手了（至少像我们这样生在富裕国家的人士）。


    我不是说世界上所有的问题都解决了，或者所有人都有饭吃了。而是想举例说明“炼金术能改变万物。


    或者是在电力方面？


    或者是在家用电脑方面？


    或者是在电话方面？


    所有的方法都是创造性的，都是对周边资源的新利用……都用来改善每个人的生活。


    不久之前还没有人敢想像每个人都会有智能手机、平板电脑（只有少数人这么认为，包括在汽车中安装电脑，电话甚至是厨房设备）。


    富有创新力的“科技魔法师们”每天都在寻找让它们变得更小巧、更快捷，更便宜的方法。


    ### 那这和你利用自媒体，公众微信，微博，邮件，及信息产品赚取更多钱有什么关系呢？


    很高兴你这么问……


    以下是我的解释：


    生活中，许多东西无法轻易被“转换”“增值”。无法把它们从一种状态转换成另一种状态……无法从一种价值转变另一种价值。把一元变成两元也并非易事。


    那么把种子变成植物呢？也很困难。


    **但是信息，啊，信息可以。**


    信息是少数能都被变得更有价值的东西之一——需要的时间、精力以及付出少得惊人。


    信息的表现方式不同，结果也截然不同。没人愿意听千篇一律的话。但是换种不同的方式，人们就会扛枪卫国，主动投票或者主动掏腰包。


    下面你将学到信息产品营销中最重要的一课：


    **怎么说，很关键！**


    用一种稍微不同的方式说，你就可以把该信息的价值从非常低变得非常高……


    你可能没有办法把铅轻易变成金子，但是如果你懂得了这种方法 ,你就可以把你的想法轻易地变成金钱。


    顺便说一句，你可以( 也应该 )运用我教你的这种营销方法。事实上，这种方法最适合用于信息产品营销了。


    总之：生活中很少有地方能够不投入更多钱就赚取更多钱，或者不投入更多的资源就取得更大价值，很少。


    但是肯定有这样的地方，我非常痴迷于寻找这样的地方，方法以及机遇。


    请允许我在此和你分享我发现的我最喜欢几个方法。


    我用了几年时间才找到、确定这些方法并把它们建立成一个体系，这样我就可以迅速并简单的教会别人。请尊重我为找到这些方法而花费的时间以及精力……


    # **警告：这些是武器——要万分谨慎地运用……**


    这个信息是 “独孤求败” 式训练。它是剑魔。


    事实上，我将要救你的是一系列危险的武器。


    有趣的是，它们却是好武器。


    它们是非常有威力的工具，你可以运用它们直接杀入你的顾客群 ,和他们取得联系……并向他们展示你的产品和服务多么有价值。请把这些工具运用到好的方面，不要用来欺骗别人或窃取别人的东西……


    这些方法中每一个都为我赚了很多钱。如果你运用它们创造并销售你的产品，我相信你也可以赚很多钱。


    如果你用它们干“坏事”，我一定会发现的，我会撤销你的“营销大师证！” 😃


    好了，我们继续吧！


    快速回答这个问题：这两本不同书名的书，哪本销量大……


    - 书名1：《一个聪明人的详细减肥指导及运动计划》

    - 书名2：《瘦妹子》


    《一个聪明人的详细减肥指导及运动计划》是由两个博士根据其他几个博士通过实验研究法得出的结果而写的。


    《瘦妹子》是由一个退休的模特和一个退休的模特经纪人写的。


    时间到了。哪一个销量更好呢？


    根据亚马逊统计，《一个聪明人的详细减肥指导及运动计划》销量排行437,317，然而《瘦妹子》排行56。


    我的问题是......


    # 为什么？


    为什么没有博士学位，而没有荣誉，没有“科学”作后盾的人却卖了很多书，挣了很多钱......而“专家”的书却排行437,317？


    令人伤心的是博士们可能为了写这本书花了多年时间。但是你觉得有人会读吗？


    不会。


    下面是一个善于抓住机会的人的做法：写《瘦妹子》的女士们又接着出版了一本姊妹篇：《厨房里的瘦妹子》——一本烹饪书。


    此书销量在亚马逊上曾排名到179。不错的成绩。


    这两类书的作者，有一位像消费者，像市场营销人那样思考了……而另一位没有。


    我希望《瘦妹子》这个书名没有冒犯你。我举这个具体的例子是因为这两个女人具有大多数人都没有的东西。


    不知道你有没有注意到，有段时间 “炫酷” 很流行。这是未成年女孩（也有成年女人）想要变得时尚，深沉以及凸显个性的 “个人宣言”。


    总之，这些词作为书的标题非常有魔力。


    # **以下是运用这个信息赚钱的方法……**


    当你创造下一款产品的时候，在你开始之前，停下来想想你的顾客。


    **比如，你准备写一本关于高尔夫球的书。**


    不要写你想写的，停下来问自己几个问题：


    1. “谁是我的潜在客户或客户？”

    2. “他们面临的最大的问题是什么？”

    3. “我的潜在客户想要得到的结果或收获是什么？”

    4. “他们对自己以及高尔夫球有什么样的非理性或强烈的喜好？”

    5. “他们一直在寻找什么样的信息，却找不到答案？”


    如果你真的想要客户喜欢你的主意，你就问问你的客户以及潜在客户他们是谁、他们想要什么（顺便说一句，你一定可以学到一些你不知道的东西）。


    比如，你给你的客户名单上的一千个人发邮件，问他们以上问题。让我们打比方你发现你的潜在户平均：


    - ◎ 45岁。

    - ◎ 都是男性，而且是总经理。

    - ◎ 很沮丧。他认为其他人不尊重他，是因为他的高尔夫球打的不好。

    - ◎ 想要把高尔夫球打的更好，让他的同事及老板觉得自己是“高手”。

    - ◎ 痴迷于能走在高尔夫球场上，把球打直，打远，打败所有的经理。

    - ◎ 正在寻找迅速提高高尔夫球技术的“秘诀”。


    以上这些“答案”可能对你来说听起来有点牵强。我是说，难道高尔夫球手并不是都想要同样的东西？


    **答案是：不！他们要的并非同样的东西。**


    但是专家们的潜意识里会认为他们很懂，知道他们的潜在客户想要什么，以及需要什么……认为他们是最适合给出答案的人。但是当你花时间对潜在客户以及客户进行调查的时候，你将会学到许多你不知道的东西。


    上面的例子中，一个不去问他们的潜在客户他们是谁，以及他们想要什么的专家，很可能写一本书，并命名为：


    《*发球，切球进洞，像职业选手一样一击进洞*》


    但是精明的营销人就会在调查完他的潜在客户，并仔细考虑过他们的答案后，给他的书起名为：


    《**在高尔夫球上打败你的老板（顺利如愿加薪！）**》


    标题真的那么重要吗？


    # 是的！


    很明显, 对于上面的例子, 我很有 “创造性” 。但是你下次创造并销售产品（不管是书、课程、视频, 还是任何其他形式的建议, 或信息产品）时, 能够考虑并运用这种方法才是最重要的。


    如果你的产品不能立即引起你的潜在客户共鸣——给他们内心以强烈的冲击, 你就会像上面写减肥书的那些人一样——一个月可能只能卖出一两本——给他们的朋友们。


    相信我, 你一定不想排名在437,317。


    你想要人们争先恐后的订购你的产品。或者去你家或公司, 把钱放到你的面前! 当你学会像消费者一样思考, 营销人员一样思考, 把你教的东西转变成能打动顾客, 让他们购买你的产品的文字以及想法后,
    这一切就会成为现实。


    我刚才分享的可能是“营销新手”，常犯的，代价最惨重的错误。


    # 避免这类错误, 增加成功的机会。


    现在让我来救你一些炼金术……


    # 营销炼金术1：


    # 转换你的想法的价值，这样人们才会从你手中购买它们……


    我将要教你的第一个方法是最重要的。


    我称之为“转换法”。


    道理很简单，**只有买家认为你的信息值钱，它才值钱。**如果你想要买家付更高的价格，*你就必须把你的信息价值转换成为他们能够理解的语言。*


    每个有欲望或问题的人，<u>都会一直惦记着那个欲望或问题。</u><u>他们会受到一些动机的驱使，驱动他们寻找解决办法。</u>


    对于那个人来说，能够使他们的欲望得到满足，或者问题得到解决的方法才值高价。


    事实上，一个有强烈欲望或经历痛苦的人，能够找到他们想要的解决办法才是他们心中或生活中最重要的事……


    多数销售信息产品的“专家”都完全忽略了这个事实，而是想他们认为什么是有价值的……以及他们认为他们的潜在客户应该需要什么。


    这会导致你犯给自己的书起名为《一个聪明人的详细减肥指导及运动计划》这样的错误——导致你“觉得”你就是你的潜在客户。


    事实上，给《一个聪明人……》命名的人很明显下了很大功夫，却没有真正动脑思考……


    # 想想潜在客户是怎么想的，然后把你的产品价值转化成浅显易懂的语言！


    我们举个例⼦。在亚马逊这本书的描述中，第⼀句话是这么写的：


    “该书介⼦了记录体重以及运动计划的突⽬性⽅法……”


    现在，你告诉我：想减肥的人关心“记录体重以及运动计划的突⽬性⽅法”吗？


    不！


    想减肥的人关心的是……


    **一觉醒来就能变瘦，永远不用去考虑制定减肥计划或者运动的事！**


    写这本书的“专家”，给书起的这个书名，写的这个描述，其实是弄错方向了。


    完全是浪费。


    与其从《一个聪明人……》的角度出发，还不如给这本书命名为《**如何在不经意间减肥**》，可能这样销量更好。


    用这样的描述，可能更能吸引我的注意力……


    > “想必你已经知道节食以及运动，都没有办法帮你成功减肥并保持下去。不要再折磨你自己了，用一个有效的方法……”


    为什么这些信息更有效呢？


    因为他们正能顺应人的心理。他们没有使用空洞，让人厌烦，没有人爱听的词语。


    换句话说，它们有效，是因为……


    # 顾客认为它们很有价值！


    试试这个：


    拿出一张10元和一张100元的人民币，盯着他们看一会儿。问自己一个简单的问题：“为什么其中一张的价值是另一张的10倍呢？”


    是因为图案不同？


    是因为编号不同？


    是因为人民币特征不同？


    不，都不是。


    其中一张之所以那么“值钱”，是因为……


    # 钱上印的数字！


    我现在不想卷入人民币是否真的“有价值”的哲学争论——或者说100元是不是代表更大的“承诺”——这不重要。


    重要的是人们看到面值大的钞票立刻就会觉得它更值钱，不自觉的、潜意识的......就是那样。


    这又怎样？


    这对你有什么帮助？


    只要你细细想想，你就会意识到......


    # **人并不擅长辨别信息的价值！**


    如果人们不擅长辨别信息的价值，你又想通过销售信息赚钱，那你就必须擅长......


    # **帮他们转换价值！**


    换句话说，你需要“在账单上清楚地印上数字”这样你的准客户才知道他们应该付多少钱。


    以上的例子中，“专家”作者给他们的书起的名字，写的描述，让人感觉他们就像是把100元拿出来，擦去数字“100”写上“10”！


    这时候你应该明白我的用意了吧。来，我们讨论一下如何把它立刻运用到你的业务中，立刻为你赚更多钱。


    # 帮你成为以更高的价格，销售更多的产品，赚更多钱的“价值转换”的方法……


    拿一张纸，写下你的潜在客户三个最大的，最令他们担心的问题。


    要迅速，时间不要超过30秒。


    好。


    从你的列表中挑出最令人头疼，最令人担心的一个问题。我想要你选出在情感上最让人感到“痛苦”——最让人担忧和忧虑的问题。


    然后，我希望你把该问题为你的潜在客户真正地转化成一个真实的，有形的实际费用。


    比如你是投资领域的专家。你的利基市场或市场关注点是引导年轻父母为他们的家庭进行长期证券投资。


    比如你的潜在客户面临的 最大问题————他们最大的情感上的问题————是担心他们上年纪后，孩子没有能力承担大学教育费用。（顺便说一句，我正在构思一套完整的方案，跟着我的例子走，你将会学到很多......）


    我想问你几个问题：


    1. 让他们知道自己 的孩子长大后有钱上 大学，这值多少？

    2. 为他们排除这个问题的困扰，又值多少钱？

    3. 他们知道有个 有效的办法能够帮他们省钱，保证他们的孩子以后能够上大学，值多少钱？


    现在，你可能说：“父母得知孩子能够上大学，不用再担心孩子的上学问题，肯定是无价的。”


    我可能会赞同你的观点。


    我依然想让你估计一个数字.....并解释为什么是这么多。跟着我的思路走......


    比如，我们的潜在客户平均35岁，有个7岁和9岁的孩子。


    一对夫妻一年一共能挣10万元。


    这对夫妻非常想让孩子接受大学教育，以后每年能至少挣10万元。但是他们担心孩子上不起大学，最后只能从事体力活，每年只能挣5万元。


    我们还有一些问题要解决。据此，我就能够开始策划一个营销方案……一个能够把问题的价值转化成实实在在的，可衡量的金额。


    可能是这样：


    **如果你的孩子正在上高中，你很担心，因为你没有为他们的大学生教育投资基金，最后你可能损失比你预料中更多的钱。**


    **如果你从现在开始每月攒747元，把它存入一个账户，每月赚取5%的利息，你将能够积攒足够的钱，供孩子上学。**


    **如果你每月投资不了747元，你的孩子可能就上不了他们心仪的大学（或者根本上不了大学），他们最终可能只能从事一份自己不喜欢的“工作”，赚的钱远低于他们的价值。**


    有了那个学位，孩子每年就可以多挣5万元————每年。


    每月投资747元，投资十年，你的孩子30年就能够获得150万元（不用从事他们讨厌的“没有技术含量”的工作），值吗？


    更不用说 :你不用担心孩子上大学的事值多少钱？知道自己孩子肯定有能力上大学，你可以高枕无忧，又值多少钱？


    难道不值每月747元吗？


    现在，你可能猜到了，我使用的这些数据。你懂的！我做了一个一千个“专家”中都没有一个人能想到的方法。


    我体会到了潜在客户正在经历的情感伤痛，并且确实……


    把它转换成了金额！


    我还可以做一些其他工作，（像让潜在客户面对他们为了兴趣爱好而正在逃避的问题……细心构思一个询问类的“推销词”），在此我就不细说了————但是此处探讨的关键点是,你的潜在客户现在正以一种全新的不同的方式思考问题。


    他们思考问题的方式能够给他们动力，让他们立即采取行动。


    最重要的是，你现在已经“构思”了这个问题，并计算了如果不以某种方式解决这个问题的代价，使得你能够……


    # 以高利润销售你的产品或服务，但是却能让顾客觉得依旧很划算！


    如果按照以下的说法，恐怕该信息的价值连原先的十分之一都没有：


    > “如果你想学习如何为你的孩子未来的教育更好地投资，给我打电话吧。我是一个注册投资专家，我可以帮你为将来的生活选择正确的投资……”


    没力量。甚至不沾边。


    我的那则信息有力量，是因为我了解了潜在客户想法，我站在他们的角度看问题，我把他们最关心的情感问题转化成了可以解释的“价值”。


    以下是运用这一概念赚取更多钱的方法……


    你的每个潜在客户都有个令他们头疼的问题（或一些欲望）。不管怎样，这种强烈的情感动力能够被直接转换换成潜在客户能够明白的价值。


    # 可能是钱


    # 可能是时间


    # 可能是感觉好


    # 可能是吸引异性


    不管是什么，价值是你真正要“销售”给你的潜在客户的。


    首先，你必须确定价值。


    如果你的潜在客户想要减肥，那么这个价值可以是每磅多余的脂肪耗费的价值。


    如果你的潜在客户想要找一份更好的工作，那么这个价值可以使他们在新职位上增加的薪资。


    如果你的潜在客户想要在家工作，这样他们可以照看孩子，那么这个价值可以是他们可以和 孩子多在一起相处的时间。

