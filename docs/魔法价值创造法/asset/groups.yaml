    \n我将再教你一个方法，教你如何使你的信息更有价值。\n\n我会告诉你我是如何一个一个地利用这些方法，并把他们结合起来，这样你就可以为你的信息和建议收取更合理的费用。\n\
    \n以下是另一个赚取“百万元”的方法，它可以增加你的信息产品的价值……\n\n## 营销炼金术 2：\n\n## 为你的方法，技术以及想法命名，让它们感知价值增值10-100倍……\n\
    \n再问你一个问题：\n\n为什么超市里一般的咖啡只要12元一杯，而星巴克的咖啡，要35元一杯？\n\n或者，为什么一克拉钻石在普通的商店里20000元就可以买到……而在蒂芙尼公司要卖35000元？\n\
    \n是不是因为名称不同而造成的差异？\n\n你可能听说过测试证明麦当劳的咖啡比星巴克咖啡口感更好。\n\n下面是在美国的MSNBC上一篇关于消费者的调查报道节选……\n\
    \n“该报道说麦当劳的咖啡‘味道好，浓度适中。尽管它没有那么华丽的名字，让它显得品位那么高雅，但是它很完美。”\n\n而对于星巴克，该杂志说其‘很浓，但是焦味和苦味会呛得让你流泪，睁不开眼睛。”\n\
    \n该杂志最后推荐：“自制咖啡吧——给它起个特别的名字就可以了。”\n\n终于！有人发现其中的奥妙了！\n\n“给它起个特别的名字……”\n\n让我们打起精神，讨论一下你能够利用这则信息做什么。\n\
    \n作为你的领域的专家，你为人们提供方法，技术以及系统，使他们得到自己想要的结果。\n\n- 你可能为他们提供通过锻炼来改善体能并减肥的计划。\n- 你可能是位提供写信的模板，帮他们吸引心仪的异性。\n\
    - 你可能是提供销售脚本及话术，帮他们更好地运用营销和销售方法来销售更多产品。\n\n不管你在教什么，它们都可以被称为“想法和策略”。许多“专家”错误地认为策略本身才是价值所在。\n\
    \n允许我从不不同的角度分析一下。你的顾客并不认为你的策略部分价值最高。\n\n看到了吧，许多专家认为他们拥有最好的“策略”。他们觉得只有人们付给他们费用，他们才会告诉他们自己的策略。\n\
    \n但是，事实上是策略无处不在。\n\n现在“策略”是免费共享的。\n\n打开百度，输入关键词，再输入“方法”或“策略”。\n\n你就会得到许多答案。你可以上优酷看视频来一天24小时学习策略。\n\
