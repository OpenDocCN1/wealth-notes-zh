- pgno: 345
  md: '# 弗里德曼的货币数量论中概念识别


    +   - **恒久收入(permanent income)**

    +     一个人所拥有的各种财富在长期内获得的收入流量。

    +     恒久收入等于过去收入加上现在和未来已知的收入之和,若以年度为权数加权平均,则相当于年度平均值。


    +   - **人力财富(human wealth)**

    +     - 个人获得收入的能力,包括一切先天和后天的才能与技术。

    +     - 人力财富转化为现实收入的条件是就业。

    +     - 人力财富带来的收入是不稳定的。


    +   - **非人力财富(nonhuman wealth)**

    +     - 总财富中扣除人力财富的部分,主要指物质性财富。

    +     - 非人力财富同样具有获得收入的能力。'
  merge: -1
  img_proc: true
