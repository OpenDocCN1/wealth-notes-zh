- pgno: 80
  md: '# 永续债券Consol or Perpetuity


    +   - 以固定票息C偿付的无到期日、无需偿付本金的永久性债券


    P = C / i_c

    P_c = price of the consol

    C = yearly interest payment

    i_c = yield to maturity of the consol


    can rewrite above equation as this : i_c = C / P_c


    年息票利息除以证券价格得到的i_c称为当期收益率，通常作为长期债券利率的近似值。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# 贴现债券 Discount Bond


    For any one year discount bond


    i = (F - P) / P


    F = Face value of the discount bond


    P = current price of the discount bond


    The yield to maturity equals the increase in price over the year divided by the
    initial price.


    As with a coupon bond, the yield to maturity is negatively related to the current
    bond price.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 回报率 Rate of Return  P64-65


    The payments to the owner plus the change in value expressed as a fraction of
    the purchase price


    RET = C/P_t + (P_{t+1} - P_t)/P_t


    RET = return from holding the bond from time t to time t + 1

    P_t = price of bond at time t

    P_{t+1} = price of the bond at time t + 1

    C = coupon payment

    C/P_t = current yield = i_c

    (P_{t+1} - P_t)/P_t = rate of capital gain = g'
  merge: -1
  img_proc: true
