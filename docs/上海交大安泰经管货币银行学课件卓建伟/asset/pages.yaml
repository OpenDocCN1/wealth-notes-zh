- pgno: 116
  md: '# 其他关于货币供应量与利率的观点


    +   - 流动性偏好理论最重要的结论：货币供应量增长将会调低利率--流动性效应。

    +   - 弗里德曼对此的批判：（承认流动性效应，但有其它因素影响）

    +   - 收入效应—货币供应量的提高会对经济运行产生扩张性影响，从而增加国民收入和财富水平。流动性偏好理论和债券供求理论认为利率由此上升。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# Everything Else Remaining Equal?


    +   - 物价效应—货币供应量的提高将会导致整体经济中物价总水平的上升，流动性偏好理论认为这将会提高利率。因此，货币供应量提高的物价效应是物价水平的提高将会导致利率的上升

    +   - 通货膨胀的预期效应—货币供应量的提高，使得人们对未来物价水平的预期值相应提高，由此产生了更高的通胀预期，导致利率上升'
  merge: -1
  img_proc: true
