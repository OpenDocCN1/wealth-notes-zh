  md: 3、中央银行货币政策的工具可分为一般性的货币政策工具、选择性的货币政策工具及其他货币政策工具。其中，一般性的货币政策工具有三种；即存款准备金政策、再贴现政策和公开市场业务。选择性的货币政策工具和其他货币政策工具则种类很多。各国中央银行可根据本国实际和货币政策的目标加以选择和运用。
