- pgno: 277
  md: '# 推导货币乘数 I


    假设公众愿意持有的现金水平 $C$ 及超额准备金 $ER$ 与支票存款 $D$ 同比例增长那么，


    $c=\{C/D\}=\text{现金比率}$


    $e=\{ER/D\}=\text{超额准备率}$'
  merge: -1
