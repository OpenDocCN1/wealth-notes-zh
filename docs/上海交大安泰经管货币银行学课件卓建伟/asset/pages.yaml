- pgno: 278
  md: '# 推导货币乘数 II


    准备金总额（R）等于法定存款准备金（RR）和超额准备金（ER）之和


    $$R = RR + ER$$


    法定存款准备金总额等于法定存款准备金率乘以支票存款总额


    $$RR = r \times D$$


    用上式替换第一个公式中的 RR


    $$R = (r \times D) + ER$$


    美联储制定的 r 小于 1'
  merge: -1
  img_proc: true
