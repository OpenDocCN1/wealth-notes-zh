- pgno: 342
  md: '# 四、弗里德曼的新货币数量说


    1956年，米尔顿·弗里德曼发表《货币数量说的重新表述》，提出新货币数量说。


    一方面采纳凯恩斯把货币看作是一种资产的核心思想，利用它把传统的货币数量学说改造成货币需求函数；


    另一方面基本否定了传统货币数量说的结论，即M量的变化反映在物价的变动上，M量的变化从长期看只影响总体经济中M部门的名义量，如物价、名义所得等，但不影响实质部门的真实量，如就业、实际利率、生产率等。'
  merge: -1
