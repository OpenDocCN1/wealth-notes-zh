- pgno: 205
  md: '# 资本充足性管理：股票持有者的收益


    资产回报率：每一美元资产的税后净利润


    $$ROA=\frac{\text{税后净利润}}{\text{资产}}$$


    股权回报率：每一美元股权（银行）资本的税后净利润


    $$ROE=\frac{\text{税后净利润}}{\text{股权资本}}$$


    资产回报率和股权回报率之间的关系可以表达为：


    股本乘数：每一美元股权资本所对应的资产数额


    $$EM=\frac{\text{资产}}{\text{股权资本}}$$


    $$ROE=\frac{\text{税后净利润}}{\text{股权资本}}=\frac{\text{税后净利润}}{\text{资产}}\times\frac{\text{资产}}{\text{股权资本}}$$


    $$ROE=ROA\times EM$$


    ![](img/de700a751c37c64a7972840982459f09_205_0.png)'
  merge: -1
  img_proc: true
