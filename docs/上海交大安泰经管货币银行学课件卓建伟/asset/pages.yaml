- pgno: 240
  md: '# 基本简介


    +   • 中国人民银行（简称央行或人行）是[中华人民共和国](#)的中央银行，于1948年12月1日组成。中国人民银行根据《中华人民共和国中国人民银行法》的规定，在国务院的领导下依法独立制定和执行货币政策，履行职责，开展业务，不受[地方政府](#)、各级政府部门、社会团体和个人的干涉。中国人民银行总行分别位于[北京](#)和[上海](#)，2005年8月10日在上海设立中国人民银行上海总部。


    ![](img/de700a751c37c64a7972840982459f09_240_0.png)'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 历史沿革


    +   1）人民银行的历史，可以追溯到第二次国内革命战争时期。1931年11月7日，在江西瑞金召开的全国苏维埃第一次代表大会上，通过决议成立“中华苏维埃共和国国家银行”（简称苏维埃国家银行），并发行货币。


    +   2）1948年12月1日，以华北银行为基础，合并北海银行、西北农民银行，在河北省石家庄市组建了中国人民银行，并发行人民币，成为中华人民共和国成立后的中央银行和法定本位币。


    +   3）1983年9月，中国国务院决定中国人民银行专门行使国家中央银行职能。


    +   4）1984年国家将商业银行的职能剥离出去成立中国四大银行（中国银行、中国农业银行、中国工商银行、中国建设银行）后，中国人民银行成为专职的中央银行。


    +   5）1995年3月18日，第八届全国人民代表大会第三次会议通过的《中华人民共和国中国人民银行法》第一次以法律形式确定了中国人民银行是中华人民共和国的中央银行。'
  merge: -1
  img_proc: true
