- pgno: 40
  md: '# 2.5 金融中介机构的功能：间接融资


    +   - 交易成本 Lower transaction costs (time and money spent in carrying out financial
    transactions).

    +     - 规模经济 Economies of scale

    +     - 流动性服务 Liquidity services

    +   - 风险分担

    +     - 个人借贷——一家企业（较大风险），中介——众多企业（分散了风险），保险业中的例子：个别明星运动员保险案例

    +     - 可以实现资产组合'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Function of Financial Intermediaries: Indirect Finance


    +   - 信息不对称

    +     - （before the transaction）逆向选择：try to avoid selecting the risky borrower.

    +       - Gather information about potential borrower.

    +     - （after the transaction）道德风险：ensure borrower will not engage in activities
    that will prevent him/her to repay the loan.

    +       - Sign a contract with restrictive covenants.


    对于金融市场的健康运行而言，逆向选择和道德风险会成为严重的障碍，而金融中介机构能够减少此类问题的发生。


    中小企业贷款难的原因，明白了吗？'
  merge: -1
  img_proc: true
