- pgno: 292
  md: '# 第一节 货币政策的目标


    货币政策的目标是指中央银行制定和实施某项货币政策所要达到的特定的经济目的。货币政策目标可以分为三个层次，即最终目标，中介目标和操作目标。'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 一、货币政策的最终目标


    # （一）西方发达国家的最终目标


    # 1. 稳定物价


    所谓稳定物价的货币政策目标，一般是指通过实行适当的货币政策，保持一般物价水平的相对稳定，以避免出现通货膨胀或通货紧缩。


    # 2. 充分就业


    作为货币政策的最终目标，充分就业也只是意味着通过实行适当的货币政策，以减少或消除经济中存在的非自愿失业，而并不意味着将失业率降低为零。'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 3. 经济增长


    世界大多数国家都以人均实际国民生产总值或人均实际国民收入的增长率作为衡量经济增长速度的指标。


    # 4. 国际收支平衡


    作为货币政策的一个目标，所谓国际收支平衡，是指一个国家对其他国家的全部货币收入与全部货币支出保持基本平衡。'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# （二）货币政策目标之间的矛盾及其协调


    # 1. 货币政策目标之间的矛盾


    四大目标中的任何两个目标之间都有着一定的矛盾和冲突。


    其中最典型的是稳定物价与充分就业这两个目标之间的矛盾。


    这一矛盾可用著名的菲利普斯曲线来加以说明。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 2. 协调货币政策目标之间矛盾的主要方法


    在货币政策的实践中，协调不同目标之间矛盾的方法主要有如下三种：一是对相互冲突的多个目标统筹兼顾，力求协调或缓解这些目标之间的矛盾；二是根据凯恩斯学派的理论，采用相机抉择的操作方法；三是将货币政策与财政政策及其他政策配合运用。'
  merge: -1
