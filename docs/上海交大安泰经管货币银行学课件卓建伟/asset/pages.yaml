- pgno: 271
  md: '# 多倍存款创造的公式推导


    假设银行不持有超额准备金


    法定存款准备金（RR）= 准备金总额（R）


    RR = 法定存款准备金率（r）乘以支票存款总额（D）


    替换


    $r \times D = R$


    等式两边同除以 r


    $D = \frac{1}{r} \times R$


    等式两边同时变动可以得到


    $\Delta D = \frac{1}{r} \times \Delta R$'
  merge: -1
  img_proc: true
