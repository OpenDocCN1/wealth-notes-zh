- pgno: 139
  md: '# Liquidity Premium Theory


    ![](img/de700a751c37c64a7972840982459f09_139_0.png)


    $i_{nt} = \frac{i_t + i_{t+1}^e + i_{t+2}^e + ... + i_{t+(n-1)}^e}{n} + l_{nt}$


    where $l_{nt}$ is the liquidity premium for the $n$-period bond at time $t$


    $l_{nt}$ is always positive


    Rises with the term to maturity'
  merge: -1
  img_proc: true
