  md: '# （一）鲍莫尔的存货模型对凯恩斯理论的发展


    鲍莫尔（W.J.Baumol）通过分析，发现即使是交易动机的货币需求，也同样是利率的函数，而且同样是利率的递减函数。平方根公式： K = √(2bT / r)


