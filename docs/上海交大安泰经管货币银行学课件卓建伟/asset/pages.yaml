  md: '# 流动性管理：足够的超额准备金


    | 资产 | 负债 |

    | --- | --- |

    | 准备金 $20M | 存款 $100M |

    | 贷款 $80M | 银行资本 $10M |

    | 证券 $10M |  |



    | 资产 | 负债 |

    | --- | --- |

    | 准备金 $10M | 存款 $90M |

    | 贷款 $80M | 银行资本 $10M |

