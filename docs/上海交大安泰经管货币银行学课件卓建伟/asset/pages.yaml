- pgno: 199
  md: '# 流动性管理的总结


    +   > 是指商业银行能够随时满足客户提现和必要的贷款需求的支付能力。包括资产的流动性与负债的流动性两重含义。

    +   > 资产的流动性是指资产在不发生损失的情况下迅速变现的能力。

    +   > 负债的流动性是指银行能以较低的成本随时获得所需要的资金。


