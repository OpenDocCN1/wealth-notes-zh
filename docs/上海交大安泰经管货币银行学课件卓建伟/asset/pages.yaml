- pgno: 29
  md: '# 2.1 金融市场的职能


    +   - 金融市场的基本功能是向居民、企业和政府提供资金金融通服务，将资金从收大于支而有盈余的经济主体那里转移到收小于支出出现赤字的经济主体手中。

    +   - 在直接融资模式下（图2-1），借款者通过向金融市场里的贷款者出售证券（又称为金融工具），直接从后者手中获取资金。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 金融市场的职能


    +   - 金融市场能够将资金从缺乏生产性投资机会的人那里转移到拥有此类机会的人手中。因此，金融市场的重要意义在于它能够有效地配置资本，从而提高整体经济的产出水平和效率。

    +   - 通过帮助消费者更好地安排购买时机，功能健全的金融市场能够直接提高他们的经济福利。金融市场向年轻人提高融资，使他们可以购买那些自己需要并且最终能够负担得起的商品，让他们不必等到存够全部货款的那一天。因此，有效运行的金融市场可以改善社会中每个人的经济福利。'
  merge: -1
  img_proc: true
