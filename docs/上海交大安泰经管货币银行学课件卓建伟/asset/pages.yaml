- pgno: 298
  md: '# 二、中介目标


    # 1. 中介目标的选择标准


    +   ① 可测性: 中央银行能够对这些被作为货币政策中介目标的变量加以比较精确的统计。所以，这种变量必须具有比较明确的定义，以便于中央银行对它加以观察、分析和监测。同时，中央银行能够迅速地获取这一变量的准确数据。

    +   ② 可控性: 中央银行所选择的货币政策中介目标必须与它所运用的货币政策工具具有密切的、稳定的联系，以便较有把握地将它控制在确定的或预期的范围内。

    +   ③ 相关性: 作为货币政策中介目标的变量与货币政策的最终目标有着紧密的关联性。


    # 2. 经常采用的中介目标：


    银行信贷规模，货币供应量，长期利率'
