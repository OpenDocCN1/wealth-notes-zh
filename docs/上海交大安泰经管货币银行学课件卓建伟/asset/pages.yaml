- pgno: 92
  md: '# 5.1 资产需求的决定因素


    +   - 财富：个人拥有的全部资源，包括所有资产。在其它因素保持不变的条件下，财富的增长会导致资产需求量的上升。

    +   - 预期收益率：即与其它资产相比，某种资产在下一个时期实现收益率的预期值。在其它因素保持不变的条件下，相对于其它可替代性资产，某种资产的预期收益率上升将会导致该项资产需求量的上升。

    +   - 风险：与其它资产相比，某种资产收益率的不确定性。在其它因素保持不变的条件下，相对于其它可替代性资产，某种资产的风险水平上升将会导致其需求量的下降。如希腊债务危机。

    +   - 流动性：与其它资产相比，某种资产变现的速度和难易程度。'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# 资产需求理论


    包含前面讨论的四大因素，该理论认为：


    +   1. 资产需求量和财富之间存在正相关关系。

    +   2. 相对于其它可替代资产而言，资产的需求量和该资产的预期收益率之间存在正相关关系。

    +   3. 相对于其它可替代资产而言，资产的需求量和该资产的风险之间存在负相关关系。

    +   4. 相对于其它可替代资产而言，资产的需求量和该资产的流动性之间存在正相关关系。'
  merge: -1
  img_proc: true
