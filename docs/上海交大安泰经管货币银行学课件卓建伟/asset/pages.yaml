- pgno: 314
  md: '# 3、托宾的q 理论


    q 是一个比值，它等于企业市场价值比企业的资本重置成本。

    托宾认为，企业的投资决策取决于q 值是否大于1。当q 大于1 时，企业就会投资；当q 小于1 时，企业就不会投资。


    q = V / (p_k · k)    V→企业股票的总市值

    p_k · k→企业拥有的实物资产总值

    p_k→单位实物资本的价格

    k→实物资本的数量'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# 结论推导：


    如果q 大于1，那么企业投资收益率就会大于企业的资金成本。

    企业价值的确定：


    V_t = c_{t+1}/(1+r_k) + c_{t+2}/(1+r_k)^2 + ……


    假定各期现金流均为c_0，则有：

    V_t = c_0 / r_k


    企业收益率的确定：

    p_k · k = c_0/(1+ρ_k) + c_0/(1+ρ_k)^2 + ……'
  merge: -1
  img_proc: true
- pgno: 316
  md: '方程可以简写成： $p_k \cdot k = \frac{c_0}{\rho_k}$


    $q = \frac{V}{p_k \cdot k} = \frac{\frac{c_0}{r_k}}{\frac{c_0}{\rho_k}} = \frac{\rho_k}{r_k}$


    显然，只有当资本的预期收益率为 $\rho_k$ 大于资本成本 $r_k$ 时，即 $q > 1$ 时企业才会进行投资。

    托宾的货币传导机制：


    $\frac{M}{P} \uparrow \Rightarrow V \uparrow \Rightarrow q \uparrow \Rightarrow
    I \uparrow \Rightarrow Y^d \uparrow$'
  merge: -1
  img_proc: true
