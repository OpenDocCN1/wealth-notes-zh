- pgno: 329
  md: '# 一、马克思的货币需求理论


    以金币流通为假设条件或背景的。研究的是人们对货币的交易需求。


    观点：（1）商品是带着价格进入流通的。（2）商品价格有多少，就需要有多少货币来实现它。（3）货币始终存在于流通之中，发挥媒介作用。


    公式表示： 执行流通手段职能的货币量＝商品的价格总额/货币流通速度


    结论：


    +   1、商品流通决定货币流通。\n2、一定时期流通中货币的必要量是由商品的价格、数量和货币流速三因素决定。\n3、金币能自发地调节流通中货币量。'
  merge: -1
  img_proc: true
