- pgno: 323
  md: '# 货币需求的存量与流量


    +   - 分析货币需求量，通常是从存量意义上来观察和计算的，但由于货币本身固有的流动性属性，讨论货币需求仅仅局限于存量概念是不够的，必须同时考察货币需求的流量。


    # 货币需求研究的宏观与微观角度


    +   - 宏观分析是从一个国家的社会总体出发，强调货币作为交易工具的职能，在分析市场供求、收入及财富指标的变化上，探讨一国需要多少货币才能满足经济发展对货币的需求。


    +   - 微观分析是从社会经济个体出发，分析各部门的持币动机和持币行为，研究一个经济单位在既定的收入水平、利率水平和其他经济条件下，所需要持有的货币量。'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# 名义货币需求与实际货币需求


    +   - 名义货币需求指社会各经济部门所持有的货币单位的数量

    +   - 实际货币需求指名义货币数量在扣除了通货膨胀因素之后的实际货币购买力，等于名义货币需求除以物价水平。区分并研究名义货币需求对于判断宏观经济形势和制定并实施货币政策具有重要意义。

    +   - 货币需求量的弹性区域。货币需求量是经济运行系统内部决定的内生变量，但因社会经济背景有很大的伸缩性，所以货币需求量本身总处在不断的变化之中。'
  merge: -1
  img_proc: true
