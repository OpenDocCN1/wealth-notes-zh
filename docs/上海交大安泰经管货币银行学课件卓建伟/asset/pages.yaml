  md: '# 市场分割理论


    +   - 不同期限的债券之间不能任意替代

    +   - 不同期限债券的利率是由该债券需求和供应所决定

    +   - 每一类投资者都有一个债券期限的首选项

    +   - 如果投资者通常更喜欢有较低的利率风险的较短期限的债券，这说明为什么收益率曲线通常向上（事实 3）'
