- pgno: 164
  md: '# 金融危机影响因素


    +   - 资产负债表的资产市场效应

    +     - 股票市场的下跌

    +       - 公司的资产净值下降。

    +     - 未预料到的价格水平下降

    +       - 负债的实质增长，净资产的降低。

    +     - 本币的意外贬值

    +       - 增加外币债务并减少净资产。

    +     - 资产贬值


    结果：资产负债表中的资产价值下降，负债价值上升。逆向选择和道德风险加剧、信贷收紧、经济活动萎缩。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# 金融危机影响因素


    +   - 金融机构的资产负债表的恶化

    +     - 主要是银行，银行资产恶化（坏账增加）--资本金损失--银行的信贷资源数量将会大幅度降低—信贷萎缩—抑制投资和经济活动。

    +   - 银行危机（恶化到一定程度，破产）

    +     - 银行资产恶化—储户提款—银行资金链断裂—银行破产—金融市场中介缺失—借贷市场信息下降—逆向选择和道德风险上升—生产性投资活动进一步紧缩。

    +   - 不确定性的增加（市场恐慌）

    +     - 大型金融机构或者非金融类机构的破产、经济衰退和股市崩盘等因素都可能造成金融市场中不确定性的大幅增长。放贷者丧失了解决逆向选择问题的能力，最终降低了信贷规模，导致投资活动和经济活动出现收缩。'
  merge: -1
  img_proc: true
