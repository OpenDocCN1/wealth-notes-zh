- pgno: 97
  md: '# 市场均衡


    +   - 在经济学中，市场均衡是指在给定价格条件下，人们愿意购买（需求）和出售的数量相等时的状态。在债券市场上，债券的需求量和供给量相等的时候，就实现了市场均衡。

    +   - Bᵈ = Bˢ 定义的平衡（或市场结算）价格和利率。

    +   - When Bᵈ > Bˢ，有过度需求，价格就会上涨和利率将下降

    +   - When Bᵈ < Bˢ，有供应过剩、价格将下降，利率将上升'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# 债券需求的变动（P77）


    +   - 财富： 财富不断增长(经济扩张、储蓄倾向等) 的拓展，债券的需求曲线右移

    +   - 预期收益率：长期债券的到期收益率越高，其预期的持有期收益率越低，导致债券需求减少，向左移需求曲线

    +   - 预期通货膨胀:预期通货膨胀率的提高，降低债券持有的实际利率水平，导致债券的需求减少，债券需求曲线向左发生位移。

    +   - 风险：债券风险增加，投资者将资金转入其他低风险资产，需求下降，需求曲线左移。

    +   - 流动性:债券交易活跃流动性增强，曲线右移，相反，若其他资产如股票流动性增强，债券需求曲线左移。'
  merge: -1
  img_proc: true
