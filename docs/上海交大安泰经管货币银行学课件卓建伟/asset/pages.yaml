- pgno: 108
  md: '# 5.4 货币市场的供给和需求：流动性偏好理论


    Keynesian model that determines the equilibrium interest rate in terms of the
    supply of and demand for money.


    There are two main categories of assets that people use to store their wealth:
    money and bonds.


    Total wealth in the economy = Bˢ + Mˢ = Bᵈ + Mᵈ


    Rearranging: Bˢ - Bᵈ = Mˢ - Mᵈ


    If the market for money is in equilibrium (Mˢ = Mᵈ), then the bond market is also
    in equilibrium (Bˢ = Bᵈ).'
  merge: -1
  img_proc: true
