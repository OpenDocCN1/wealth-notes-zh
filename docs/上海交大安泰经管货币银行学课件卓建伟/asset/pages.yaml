- pgno: 344
  md: "# 弗里德曼货币需求函数的含义\n\n+   （1）使用了恒久性收入的概念。\n+   \n+   （2）将物价水平与物价变动率考虑在内，确定了预期因素在货币需求理论中的地位。\n\
    +   \n+   （3）引进了债券收益率与股票收益率。因为市场竞争越来越激烈，使得 Rb-Rm、Re-Rm、P-Rm 这三个差额变得越来越小，所以可以删除掉。\n\
    +   \n+   （4）引进了非人力财富占个人总财富的比率。\n+   \n+   （5）引进了综合变数 u。认为 u 比较固定，对货币需求有影响的就剩下了两个因素：预期物价变动率\
    \ P 和人们实际的恒久收入 Yp。"
  merge: -1
