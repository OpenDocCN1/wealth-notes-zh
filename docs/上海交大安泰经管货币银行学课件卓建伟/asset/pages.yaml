- pgno: 341
  md: '# （二）托宾的资产选择理论对凯恩斯理论的发展


    托宾（J.Tobin）的资产选择理论是对凯恩斯投机动机的货币需求理论的发展。


    托宾的资产选择理论不仅得出了投机性货币需求与利率呈反向变动关系的结论，而且还通过人们资产组合的选择和调整行为，解释了货币与其他各种金融资产同时被人们所持有的现象。


