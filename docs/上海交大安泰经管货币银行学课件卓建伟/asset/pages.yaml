- pgno: 69
  md: '# 将来值的贴现 **Discounting the Future**


    Let *i* = .10


    In one year  $100 X (1 + 0.10) = $110


    In two years  $110 X (1 + 0.10) = $121


    or 100 X (1 + 0.10)²


    In three years  $121 X (1 + 0.10) = $133


    or 100 X (1 + 0.10)³


    In *n* years


    $100 X (1 + *i*)ⁿ'
