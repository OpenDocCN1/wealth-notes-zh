- pgno: 349
  md: '# 第三节 我国有关的货币需求理论


    # 一、我国的货币需求公式


    马克思的货币必要量理论是我国实践中货币需求量的理论依据。


    假设我国经济运行结构和经济技术条件不发生大的变化，或者变化缓慢，在短期内可以忽略，因此，可用国民生产总值与货币数量之间的比例关系来计算货币的需求量。则有：**M=kY**


    K：货币量与国民生产总值的比率，Y：国民生产总值


    通常在计算将来时期的货币需求量时，用增量概念来确定，即：


    **M=kY＋k△Y**


    此即为我国在实践中确定货币需求量的主要方法。'
  merge: -1
  img_proc: true
