- pgno: 301
  md: '# 第二节 货币政策工具


    # 一、一般性的货币政策工具


    # （一）存款准备金政策


    存款准备金政策是指中央银行通过调整法定存款准备金比率，来影响商业银行的信贷规模，从而影响货币供应量的一种政策措施。


    ![](img/de700a751c37c64a7972840982459f09_301_0.png)'
  merge: -1
  img_proc: true
- pgno: 302
  md: '+   - 目的：(1) 保证银行的资金流动性和现金兑付能力，

    +     (2) 通过建立法定准备金制度，使中央银行多出了一种控制货币供给的手段，(3) 通过各商业银行准备金的集中来达到特定的政策目的。

    +   - 内容：(1) 确定法定存款准备金率，(2) 对法定存款准备金的资产种类的限制。

    +   - 优点：通过调整法定准备金可以直接影响货币乘数，从而对货币供给产生巨大的影响。

    +   - 缺点：优点就是缺点，所以不宜频繁变动。'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# （二）再贴现政策


    再贴现政策是指中央银行通过提高或降低再贴现率来影响商业银行的信贷规模和市场利率，以实现货币政策预期目标的一种手段。这种货币政策工具的运用对一国的信贷规模、货币供给和市场利率都将产生一定的影响，而且其影响是比较缓和的，它有利于一国经济的相对稳定。但是，在利用这一政策工具时，中央银行处于被动的地位。这种政策能否取得预期的效果，将决定于商业银行或其他金融机构对它的反映。'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# （三）公开市场业务


    公开市场业务（也称“公开市场操作”），是指中央银行通过在公开市场上买进或卖出有价证券（特别是政府短期债券）来投放或回笼基础货币，以控制货币供应量，并影响市场利率的一种行为。'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 公开市场业务的优点：


    中央银行处于主动的地位，其买进或卖出有价证券的规模完全由它自主决定。


    公开市场业务具有很大的灵活性。


    公开市场业务可根据经济形势的变化和政策目标的调整而随时作出逆向的操作。


    公开市场业务的运用符合政策目标的需要。'
