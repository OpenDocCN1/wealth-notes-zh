- pgno: 149
  md: '# 8个基本谜团


    +   1. 对于工商企业而言，股票不是最为重要的外部融资来源

    +   2. 在企业为其经营活动进行融资过程中，发行可流通债务工具和股权证券不是主要的融资方式

    +   3. 与直接融资相比，间接融资的重要性要大得多

    +   4. 金融中介机构，特别是银行是企业外部融资的最重要来源'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 8个基本谜团（续）


    +   5. 在各种经济部门中，金融体系是受到最为严格监管的部门之一

    +   6. 只有那些规模庞大、组织完善的公司才能易于利用证券市场为其经营活动提供融资

    +   7. 对于家庭和企业而言，抵押品是债务合约的一个普遍特征

    +   8. 典型的债务合约是极其复杂的法律文件，它对于借款者的行为施加了严格的限制'
