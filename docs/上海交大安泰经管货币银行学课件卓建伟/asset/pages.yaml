- pgno: 332
  md: '# （一）费雪方程式： M V = P T


    公式中，M表示一定时期内流通货币的平均数量，是一个外生变量；V表示货币流通速度，由制度因素决定，在短期内是稳定的；P表示各种商品的加权平均价格，T为各类商品的交易量，由生产决定，在一段时间内相对稳定，因此，货币数量的变化会影响商品的价格。


    费雪方程式侧重于宏观分析，即货币总量和总产出及总的价格水平的关系，因而没有注意微观经济主体行为对货币需求量的影响，成为其理论的一大缺陷。'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# （二）剑桥方程式：Md = k PQ


    其中，Q相当于费雪方程式中的T，K表示以货币形式保有的财富占名义总收入的比例。其它与费雪方程式含义相同。


    剑桥方程是与费雪方程式的差别在于：强调微观经济主体行为对货币需求量的影响，即公众持有货币的主观愿望，是从微观的角度解释货币需求量。'
  merge: -1
  img_proc: true
- pgno: 334
  md: "# 现金交易说和现金余额说的比较\n\n+   1. 交易说看重货币的交易媒介功能，余额说强调货币的持有和货币的财富保存功能。\n+   \n+  \
    \ 2. 余额说重视人们持有货币的动机，交易说注重货币流通速度以及经济社会等制度因素\n+   \n+   3. 交易说没有对货币供求所起的作用作明显的区别，余额说则对货币供求同样重视，并以之作为决定价格水平的分析基础使货币价值的决定与商品供求决定规律相吻合。\n\
    +   \n+   4. 两者所强调的货币需求的决定因素有所不同：交易说用货币数量的变动来解释价格，反过来再确定货币需求，没有区分真实货币需求与名义货币需求；余额说认为微观主体要在权衡利弊中决定货币需求，其货币需求是真实货币需求，不受价格水平的影响，价格水平的变动只影响名义货币需求。"
  merge: -1
  img_proc: true
- pgno: 335
  md: '# 共同的缺陷


    +   1. 以充分就业的假定前提

    +   2. 是一种长期的均衡理论和静态理论

    +   3. 假定产量、货币流通速度及货币持有比例不变，处于静止状态，而不深入探讨这些因素的变化过程和原因

    +   4. 将利率排除在货币分析之外

    +   5. 除了认为货币量变动会直接影响物价同比例变动外，对其他各因素相互间的关系没有深入探讨'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# 三、凯恩斯的流动性偏好理论(the liquidity preference theory)


    1936年《就业、利息与货币通论》的出版标志着凯恩斯主义的形成。

    货币的总需求决定于流动偏好。

    流动偏好是指人们要以货币形式保持其一部分资产的意愿。原因在于三种动机：


    +   1、 交易动机(transactions motive).

    +   2、 预防动机(precautionary motive)。

    +   3、 投机动机(speculative motive)。'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# 凯恩斯的“流动性陷阱”说


    在一种极端情形下，当利率低到一定程度时，整个经济中所有的人都预期利率将上升，从而所有的人都希望持有货币而不愿持有债券。


    在这种情况下，投机动机的货币需求将趋于无穷大，此时，若继续增加货币供给，将如数地被人们无穷大的投机动机的货币需求所吸收，从而利率不再下降。这种极端的情形，就是所谓的“流动性陷阱”（liquidity
    trap）。'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 流动性陷阱(liquidity trap)


    * 货币需求发生不规则变动的一种状态。


    当利率降到一定的低点后,人们的货币需求可能变得无限大,此时如果中央银行增加货币供应,将全部被货币需求所吸收,从而对市场利率不起作用。


    ![](img/de700a751c37c64a7972840982459f09_338_0.png)


    流动性陷阱图示'
  merge: -1
  img_proc: true
