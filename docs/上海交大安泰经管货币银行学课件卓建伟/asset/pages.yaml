  md: 4、货币政策对实际经济活动的作用是间接的。中央银行运用一定的货币政策工具，往往不能直接地达到其预期的最终目标，而只能通过控制某一个目标，并通过这一个目标的传导来间接地作用于实际经济活动，从而达到最终目标。货币政策中间目标的选择必须满足可控性、可测性和相关性这三个基本特性的要求。
