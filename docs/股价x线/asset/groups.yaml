    # 15-2 頭肩頂反轉型態


    最常出現、最可靠的頂點反轉型態是頭肩頂。


    多頭市場第二部曲末尾，週線圖上有上升 X 線碰到


    時，在日線圖上就要注意頭肩頂反轉來臨。


    在日線圖上，多頭市場第二部曲股價加速上升，碰


    到一條權威的上升 X 線後，忽然一個下跌，形成左肩。


    緊接著一個上升，衝過左肩，但是，不久又跌落左


    肩之下形成頭。然後，一個軟弱上升（成交量少）達到


    左肩高度開始回頭，形成右肩。一旦回頭，跌破頸線，


    收盤價離頸線 3 % ，頭肩頂完成了，空頭市場來臨。


    頭肩頂形成過程，有一連串警兆。左肩有上升 X 線


    碰到是第一警兆，跌破左肩支撐是第二警兆，右肩上升


    成交量很少是第三警兆，右肩停止在上升 X 線的二度阻


    力（圖 15-1）是第四警兆，跌破頸線已經是第五警兆。'
  - '[PAGE 217]


    ![](img/114f067fd2db153a6ed238c66e83de58_217_0.png)


    圖 15-1 頭肩頂和二度阻力關係。第一次碰到上升 X 線形成頭肩頂的左肩，二度阻力出現在右肩。從頭部回落至上 升X線之下已經是非常狀況了，要密切注意二度阻力的發展。


    頭肩頂成交量，一般以左肩最多，有時頭部最多，右肩最少。跌破頸線後，有一暫時回升，回升至頸線附近就回頭。一旦頭肩頂完成，最少會跌頭部至頸線的高度那麼多（牛對數圖），叫最小測量（S），一般都會跌比
    S 還多，一直到碰到一條下降 X 線，開始反彈。


    頭肩頂會變形而形成複合頭肩頂（圖 15-2）。


    # 頭肩頂的策略


    （1）利用上升 X 線在左肩，或頭部最高點賣出。


    （2）在右肩上升 X 線二度阻力處賣出。


    （3）跌破頸線時，不限價賣出。'
