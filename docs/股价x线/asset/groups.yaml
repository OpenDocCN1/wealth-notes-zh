  md: "\n## 5-7 時間問題\n\n毫無疑問的，支撐和阻力現象會隨著時間而模糊。\n\n股價 X 線是支撐和阻力的演變。因此，股價 X 線的效果是受時間影響的。說明如下：\n\
    \n- 日線圖上，由次級點連成的股價 X 線，大約在半年內有效。\n- 日線圖上，由中級點和比較明顯的次級點連成的股價 X 線，大約在一年內有效。\n- 日線圖上，由原始點和原始點連成的股價\
    \ X 線（在週線圖上已經同時出現），大約在 5 年有效。\n- 週線圖上的股價 X 線，大約在 5 年左右有效。\n- 月線圖上的股價 X 線，在 10\
    \ 年左右有效。\n\n隨著時間的遷移，新的股價 X 線不斷產生。除非是由中級點所連成的股價 X 線，可延續若干年。一些次級點所連成的股價 X 線，將逐漸失去效用。\n\
    \n一年以上股價 X 線，以週線圖來畫最好，一旦畫出股價 X 線，可以使用 5 年。\n\n股價 X 線長時間使用，會有股價除息、除權而影響圖面的問題。一般除息只有一、二元，沒有影響。\n\
    \n週線圖上除權 20% 以內造成的缺口，可以不予理會，不必填回除權缺口，好像股票正常漲跌一樣去畫、去使用股價 X 線即可。\n\n日線圖上除權 10% 可以正常使用，不必填回除權缺口。但是除權大於\
    \ 10% 時，要把缺口移回去，因為日線圖上的股價 X 線使用時間較短，大的除權在短時間內，多少是會影響股價 X 線的效用的。\n\n現在股票衆多，碰到除權太大的股票，可以暫時不在這種股票上畫股價\
    \ X 線，另尋其他目標即可。但是股票圖還是要延續下去，等待未來的機會。\n\n註：次級點是次級頂點或底部，股票圖上最小的點。\n\n中級點是中級頂點或底部，比次級點明顯許多。\n\
    \n原始點是原始頂點或底部，原始點是多頭市場（或空頭市場）的起點和終點（圖 5-6）。\n\n![](img/114f067fd2db153a6ed238c66e83de58_102_0.png)\n\
    \n## 5-8 不斷有上升 X 線及下降 X 線\n\n一張股票圖上，不斷有上升 X 線及下降 X 線出現。幾乎每產生一個頂點或底部，便可以畫出新的股價\
    \ X 線。您也必須把它畫出。\n\n有些股價 X 線，可能永遠沒有碰到它。有些比較平緩而有權威的股價 X 線，很久以後才發生效力。\n\n不論如何，遇到可以畫出股價\
    \ X 線時，就要把它畫好。然後，以守株待兔的方法，靜靜的在那裡等著，您的努力終會有報酬。\n\n![](img/114f067fd2db153a6ed238c66e83de58_103_0.png)\n\
    \n隨著時間的推移，上升及下降 X 線不斷產生，您也必須畫出，守株待兔。\n\n![](img/114f067fd2db153a6ed238c66e83de58_104_0.png)\n\
    \n圖 5-8 B 型和正統下降 X 線交叉。B 型下降 X 線 ($X_3$) 在空頭市場初期較差，但和下降 X 線 ($X_2$) 配合，在 C 可買進。\n\
    \n# 股價 X 線\n\n![](img/114f067fd2db153a6ed238c66e83de58_105_0.png)\n\n圖 5-9 不權威股價\
    \ X 線。圖中 X 線都由同一個盤檔相互畫出，基本點也不明顯，所以都是不權威股價 X 線，不能使用。\n\n![](img/114f067fd2db153a6ed238c66e83de58_106_0.png)\n\
    \n圖 5-10 下降 X 線失效。碰到 $X_1$ 並未反彈，而在二週後才又回到 $X_1$ 之上。一條權威下降 X 線暫時失效，不久也會補漲。\n\n\
    ![](img/114f067fd2db153a6ed238c66e83de58_107_0.png)\n\n圖 5-11 賣到最高價。敬鵬一條上升 X 線在\
