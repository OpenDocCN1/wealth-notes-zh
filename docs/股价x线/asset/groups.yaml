    # 7-1 剪刀原理


    剪刀是一種槓桿工具，槓桿構造有三點：


    +   施力點 (A)：剪刀把手施力的地方


    +   支撐點 (B)：螺絲固定處


    +   受力點 (C)：剪刀刀口


    剪刀有三類型：


    +   中等的（一般用的，AB = BC），


    +   省時的（如剪布的，AB < BC）。


    +   省力的（如剪鐵皮，AB > BC），


    這分類是和 ABC 三點位置有關。


    假如，有三條不一樣的 股價 X 線，它們用以連線的 AB 兩點和碰線的 C 點之間的關係和三種剪刀相比擬，那麼可以分成三類 股價 X 線：


    +   第一類 股價 X 線： AB 長度等於 BC （AB = BC）


    +   第二類 股價 X 線： AB 長度小於 BC （AB < BC）


    +   第三類 股價 X 線： AB 長度大於 BC （AB > BC）'
  - '[PAGE 117]


    它們權威性依次排列： 第一類 股價 X 線最好


    第二類 股價 X 線次之


    第三類 股價 X 線最差


    雖然第一類比第二類權威，但是，第一、第二類股價 X 線都可以用來買賣股票。至於第三類只要 AB: BC 的比不要太大，例如 5:3 而已，仍然可用。如果比達到
    5:1 就不好了，達到 10:1 是不能用的。


    以上 AB 或 BC 至少有 12 天（週線圖上 12 週，月線圖上 12 月，圖上 12 根線就是）


    所謂 AB=BC 並非一天不差，相近即可，剪刀原理分類舉例如表 (7-1)，讀者可以舉一反三。


    # 7-2 二週原則


    以上三類 股價 X 線 中，AB 或 BC 的時間都要受二週原則 的限制。


    二週原則是 AB 或 BC 的時間至少 2 週。（12 根日線），週線圖上至少 12 週，月線圖上至少 12 月，圖上'
