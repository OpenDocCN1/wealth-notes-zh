    - （5）不要放空。\n- （6）成交量在此階段逐漸增加，不要太過憂慮。\n\n## 12-5（b） 多頭市場第二部曲\n\n多頭市場第二階段的上升，也叫做第二個中級上升，稱為多頭市場第二部曲。\n\
    \n### 起源\n\n- （1）起源於第一部曲結束，大盤檔完成之後。\n- （2）起步前的形狀，如第一部曲結束之後，所形成的 9 種形狀（如前述）。\n\n\
    事實上，第一階段盤檔完成之後，您要做好進入第二階段的準備。\n\n圖 12-1 頭肩頂整理與頭肩頂反轉。春池在 A 形成頭肩頂整理，接著進入多頭市場第二部曲，在\
    \ B 形成頭肩頂反轉。\n\n![](img/114f067fd2db153a6ed238c66e83de58_171_0.png)\n\n### 上升特色\n\
    \n- （1）上漲速度和第一部曲差不多，有時更快。\n- （2）每上升 7～10 天會有次級回跌，回跌以旗形或細長三角形爲多。\n- （3）整個第二部曲常有三個次級上升。\n\
    - （4）上漲途中隨便賣出股票，要高價才能補回。\n- （5）空頭愈拋空，行情愈漲，直到空頭死心，並在高價，不計一切補回爲止。\n\n### 尾聲\n\n\
    - （1）週線圖上有上升 X 線碰到。\n- （2）日線圖上有三條上升 X 線碰到。\n- （3）發生二次、三次阻力或二度阻力。\n- （4）漲幅已和第一部曲差不多。\n\
    - （5）完成三個次級上升，竭盡缺口（跳空）出現。\n- （6）出現新頂點時，成交量反而減少。\n- （7）跌破一條權威的上升趨勢線。\n- （8）跌破前一個次級頂點支撐（即支撐失敗）。\n\
    - （9）頭肩頂、雙重頂或增大頂已完成並向下突破。\n\n以上信號陸續出現時，您要逐漸減少股票。當反轉型態完成時，完全拋出股票，空頭市場快來臨。\n\n###\
    \ 結束\n\n空頭市場進入第二部曲尾聲，市場會反轉進入空頭市場，最常見的反轉型態如下（詳見 220 頁）：\n\n- （1）頭肩頂\n  ![](img/114f067fd2db153a6ed238c66e83de58_173_0.png)\n\
    - （2）雙重頂\n  ![](img/114f067fd2db153a6ed238c66e83de58_173_1.png)\n- （3）增大頂點\n \
    \ ![](img/114f067fd2db153a6ed238c66e83de58_173_2.png)\n  ![](img/114f067fd2db153a6ed238c66e83de58_174_0.png)\n\
    - （4）下降三角形\n  ![](img/114f067fd2db153a6ed238c66e83de58_174_1.png)\n- （5）倒 V 形\n\
    \n當以上型態完成，並向下決定性突破，空頭市場來臨，您要參加空頭陣容。\n\n### 多頭第二部曲操作\n\n- （1）利用下降 X 線及成交量遞減信號，在多頭第一部曲之後的盤檔末期買進。\n\
    - （2）上漲途中，如有上升 X 線碰到，酌量賣出，回跌立刻補回。狂飆時採行逐級的停止損失委託。\n- （3）利用週線圖上升 X 線在最頂點脫手。\n- （4）利用日線圖上升\
    \ X 線三次阻力或二度阻力出貨。\n- （5）反轉型態完成，空頭市場確認，參加空頭陣容。\n\n### 是否有第三、第四部曲？\n\n多頭市場是否有第三、第四部曲呢？不能期待每次皆有。但是，假如在第二部曲之後，反轉沒有來臨，只是不斷盤旋，當技術性情況，或客觀環境的確對多頭有利時，再考慮買進，並做下停止損失委託即可。\n\
    \n## 12-6 空頭市場\n\n股價下跌一波比一波低，好像落潮。股價跌多漲少，下跌幅度至少 30%，下跌時間至少三個月，主要趨勢是下跌的市場叫空頭市場。\n\
    \n空頭市場主要趨勢可以分成三個階段：出貨期、恐慌期及斷頭期。\n\n### 出 貨 期\n\n它真正形成，是在前一個多頭市場的最後一個階段，也就是多頭市場沸騰噴出期的末尾。在這個階段有遠見的人，察覺到景氣高峰已過，企業盈餘預期達不到正常的高點，衰退將要開始。\n\
    \n於是加速出貨，這時成交量仍然很高，出貨很容易，時有快速回落及彈升，回落時成交量放大，彈升時成交量減少，此時大眾仍然熱衷於交易，但是，開始感覺到獲利不易，偶有短暫套牢。\n\
    \n### 恐慌期\n\n由於第一階段詭異的末端，想要買進的人，開始退縮，而想賣出的人，急著脫售。股價快速下跌，有些公司還宣布調降盈餘目標，更是火上加油。股價連續下跌，成交量稀少，散戶驚恐莫名。\n\
    \n這一階段的末尾，恐慌結束時，成交量放大，顯然是空頭回補及一些想搶反彈者進場了。回頭看看企業現況，沒有想像的壞，可能還有盈餘分配（前一景氣賺的）。這一次會有一個中級反彈，時間超過三週。\n\
    \n### 斷頭期\n\n有些投資人，經歷第一、第二階段的風暴，咬緊牙關，希望風暴趕快過去，不過現在也失望了。上一階段才買進者，也失去信心。新聞報導顯現了惡化情況，不只經濟上出現的問題，可能還有政治、社會及國際戰爭上的問題。投資人完全崩潰。\n\
    \n股票跌，經濟不好，資金調度困難。融資追繳急如星火，斷頭處處，哀鴻遍野。\n\n空頭市場會在大量壞消息中結束，最壞的情況已經出現了，好像沒有任何理由買進任何一張股票。事實上，在壞消息出盡前，空頭市場已悄悄過去，進入多頭市場的進貨期。有遠見的人，進場接收沒人要的股票，例如國揚建設有一年的空頭市場跌至\
    \ 5 元，後來漲到 200 多元；台基從 291 元跌到 13.5 元，後來漲到 129 元，都是極端的例子。不久前，鬧得滿城風雨的台開股票內線交易案，和上面例子比較，台開漲幅還是小巫見大巫。\n\
    \n在股票市場，逢低買進，有時是賺大錢的方法（要判斷公司會倒閉否）。\n\n如果您有足夠的股票圖，翻出來看看，過去五年或十年間，它們的多頭市場和空頭市場，是如何的進行，對於股價變動，就可以做合於邏輯的推演了。\n\
    \n## 12-7 空頭市場三部曲\n\n空頭市場的大環境，以技術性分析，分成三個階段，稱之為空頭市場三部曲，以便和多頭市場二部曲相連貫，完成多頭市場和空頭市場循環。空頭市場三部曲，每一部曲由一個型態導致一大波段下跌。當然，有時候小型的空頭市場，只跌兩部曲，不能完全遵照空頭市場三部曲特定模式。\n\
    \n如果，空頭市場二部曲之後，週線圖上已經碰到下降 X 線了，日線圖上已經碰到三條下降 X 線。如此，空頭市場就會結束，但是，空頭市場至少跌兩部曲，是不可少的。\n\
    \n## 12-8 何謂空頭市場三部曲\n\n空頭市場起源於頭肩頂、雙重頂、增大頂點及下降三角形等型態。此後，它的下跌，可分成三個比較大的階段，每一個階段的醞釀型態，及下跌都各有不同的特色，稱之為空頭市場三部曲。\n\
    \n一個完整的空頭市場，必定包含三部曲。但是，股票市場中所有股票，有時行動並不一致。有些股票或許只跌二部曲，有些股票只是緩慢下跌，分不出大階段。\n\n###\
    \ 12-8（a）空頭市場第一部曲\n\n從多頭市場最頂點，可能是一個頭肩頂的頭部，到完成反轉型態的最小測量，是空頭市場第一部曲。\n\n#### 起源\n\
    \n- （1）頭肩頂反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_179_0.png)\n- （2）雙重頂反轉\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_180_0.png)\n- （3）增大頂點反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_180_1.png)\n\
    - （4）下降三角形反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_180_2.png)\n- （5）倒 V\
    \ 形或圓形反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_180_3.png)\n\n多頭市場走完接著而來，可能出現如上面所列的反轉型態（詳見第\
    \ 15 章）。這些型態向下突破頸線，暫時回升之後，繼續下跌，直到完成最小測量，是空頭市場第一部曲。\n\n空頭市場第一部曲下跌動力，是多頭市場第二部曲完成後的反轉型態而來。也就是頭肩頂或雙重頂等反轉型態，不但有反轉潛力，本身也構成空頭市場第一部曲下跌推動力量。\n\
    \n#### 下跌特色\n\n- （1）從頭部下來到頸線，下跌非常迅速，常有二、三個跌停板幅度。\n- （2）跌破頸線後往往有暫持回升。\n- （3）暫持回升後下跌非常快，一直到完成最小測量，並有下降\
    \ X 線碰到爲止。\n- （4）這一部曲，會把前一個多頭市場第二部曲的上漲幅度，大部分跌掉。\n\n#### 尾聲\n\n完成最小測量，碰到下降 X 線，或多頭市場第二部曲的上漲，大部分跌掉時，就到了尾聲。\n\
    \n#### 空頭市場第一部曲操作\n\n- （1）空頭市場第一部曲是承接多頭市場第二部曲。\n- （2）因此，依照多頭市場第二部曲的操作，儘早在頂點賣出股票，也可酌量放空。\n\
    - （3）向下突破頸線時加碼拋空。\n- （4）完成最小測量之後，碰到下降 X 線要補空，並以少量資金搶反彈。\n\n### 12-8（b） 空頭市場第二部曲\n\
    \n空頭市場第一部曲完成之後，接著中級反彈發生，一～三週之後，開始作一個小頭，股市漸漸進入空頭市場第二部曲了。\n\n#### 起源\n\n空頭市場第一部曲走完，一個中級反彈後會形成：\n\
    \n- （1）頭肩頂整理型態\n  ![](img/114f067fd2db153a6ed238c66e83de58_182_0.png)\n- （2）雙重頂整理型態\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_183_0.png)\n- （3）對稱三角形整理型態\n  ![](img/114f067fd2db153a6ed238c66e83de58_183_1.png)\n\
    - （4）側腰式整理型態\n  ![](img/114f067fd2db153a6ed238c66e83de58_183_2.png)\n  （小 M 頭右側較低）\n\
    \n以上型態的頂點，大都回升到第一部曲反轉型態的頸線爲止。有時市場惡劣時，還沒辦法回升那麼多。\n\n這些型態會向下突破，導致第二部曲的下跌。因此，第二部曲除了承受第一部曲的餘威外，本身仍有一個頭，引起第二部曲的下跌。這個頭，就是上面的四種。\n\
    \n#### 下跌特色\n\n- （1）下跌速度和幅度和第一部曲差不多。\n- （2）有時下跌比第一部曲緩慢，波折較多。\n- （3）一些認為空頭市場已跌這麼多的人逐漸買進（後來可能證明是錯的）。\n\
    \n#### 尾聲\n\n- （1）完成第二部曲推動力量的頭肩頂、雙重頂及三角形的最小測量。\n- （2）下跌幅度和第一部曲差不多了。\n- （3）有下降\
    \ X 線碰到。\n\n#### 空頭市場第二部曲操作\n\n- （1）空頭可以在第二部曲頂點處，有一條上升 X 線碰到時拋空。\n- （2）次級反彈有限，不可買進。\n\
    - （3）此部曲末期，可能並不會進入多頭市場，不要抱長期買進之心。\n\n### 12-8（c）空頭市場第三部曲\n\n空頭市場第二部曲走完，一個反彈之後，接著形成下列八種型態，而進入空頭市場第三部曲，這些型態有：\n\
    \n- （1）上升楔形（最常發生）\n  ![](img/114f067fd2db153a6ed238c66e83de58_185_0.png)\n- （2）對稱三角形\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_185_1.png)\n- （3）圓形回升\n  ![](img/114f067fd2db153a6ed238c66e83de58_185_2.png)\n\
    - （4）反圓形回升\n  ![](img/114f067fd2db153a6ed238c66e83de58_185_3.png)\n- （5）下降三角形\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_186_0.png)\n- （6）半增大型\n  ![](img/114f067fd2db153a6ed238c66e83de58_186_1.png)\n\
    - （7）增大型\n  ![](img/114f067fd2db153a6ed238c66e83de58_186_2.png)\n- （8）蝸牛型（有時出現在空頭第二部曲）\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_186_3.png)\n\n以上 8 種型態，發展時間超過 3 週，是第三部曲下跌的動力，有時會引起恐慌下跌。\n\
    \n形成這些型態，及後來下跌的心理，乃是空頭市場已經跌了這麼多，這麼久了，多頭市場可能要開始了吧？但是，隱藏在這牛皮行情的後面，卻是恐慌下跌的危機。\n\n\
    如果，此時有政治上的，或經濟上的不利因素，恐慌下跌就難免了。等到想買進的人都買了，空頭發動攻勢，讓這些上轎的人紛紛跳下來。當然，那時也幾乎是股票發行公司壞消息頻傳的時候。\n\
    \n#### 起源\n\n空頭市場第三部曲起源於上述 8 種型態。\n\n#### 下跌特色\n\n- （1）開始幾天緩慢下跌。\n- （2）愈跌愈兇。\n\
    - （3）中間只反彈一次，時間二、三天。\n- （4）下跌幅度可能達 50%。\n- （5）成交量極度萎縮。\n- （6）空頭雀躍，多頭慘兮兮。\n\n####\
    \ 尾聲\n\n- （1）高敏感度的股票，下跌已有 50%（從第三部曲算起）。\n- （2）下跌幅度和第一二部曲差不多。\n- （3）中間已經過一個次級反彈（煞車）。\n\
    - （4）週線圖上有下降 X 線碰到。\n- （5）日線圖上有三條下降 X 線碰到。\n- （6）下降 X 線有二次支撐、三次支撐、二度支撐。\n- （7）市場利空消息頻傳，散戶空手多，成交量奇少。\n\
    - （8）業績好的股票，已有轉穩趨勢，投機股仍然大跌。\n\n#### 空頭市場第三部曲操作\n\n- （1）下跌之初，不可買進，若有股票要賣出。\n- （2）尾聲時，試圖利用下降\
    \ X 線買進。\n- （3）下跌多，成交量少的股票，一旦進入多頭市場則上漲快。\n- （4）注意底部發展過程，做好進入多頭市場的準備。\n\n## 12-9\
    \ 空頭市場結束\n\n空頭市場第三部曲結束時，已是空頭市場終點。到此整個下跌已有半載，或一年了，多頭潰不成軍，信心盡失。但是，聰明的技術性分析者，則躍躍欲試，準備迎接多頭市場來臨。\n\
    \n## 12-10 空頭市場是否只跌二部曲\n\n空頭市場是否只跌二部曲呢？\n\n技術性的空頭，可能只跌二部曲。景氣大循環的空頭市場則有三部曲。\n\n\
    有的時候，每一位分析者分段方法不同，所分出來的段落就不一樣。有時候盤檔不足三週，也不能算一部曲，只能算一個次級下跌而已。\n\n不管如何分段，碰到權威的下降\
    \ X 線，買進股票總是有利可圖。這是股價 X 線可以肯定的。\n\n![](img/114f067fd2db153a6ed238c66e83de58_190_0.png)\n\
    \n圖 12-2 頭肩頂反轉。鉑德在 1997 年 7-8 月間形成一個巨大而不平衡的頭肩頂，跌突破頸線後沒有暫時回升。\n"
  mdcn: "\n下降 X 線交叉，給您買進信號。\n\n- （2）下降 X 線有三次支撐和二度支撐現象。\n- （3）空頭市場底部反轉型態完成：如頭肩底、雙重底、V\
    \ 字形等（請看 248 頁）。\n- （4）潛伏底或高爾夫路徑。\n\n空頭市場走完，就要做進入多頭市場第一部曲的準備，最好利用下降 X 線在最低價買進，不準要靠如頭肩底、雙重底、V\
    \ 字型、潛伏底或高爾夫路徑買進。\n\n## 上升特色\n\n- （1）股市一旦進入多頭市場，迫不及待的多頭，和長期空頭都想進貨。因此，股價走大漲小回的路子，不易有明顯的回檔。\n\
    - （2）每上升 7 天到 10 天，忽然會有一個次級下跌。但是，不會跌超過兩個停板幅度。\n- （3）高敏感度股票上升很猛，中低敏感度跟在後面。\n- （4）整個第一部曲又分二到三個次級上升。\n\
    - （5）認清大勢，長期持有的多頭獲大利，膽小的多頭賣了再追高價，不信邪的空頭損失不貲。\n\n## 尾聲\n\n- （1）高敏感度的股票上漲已有 100％，上漲時間超過\
    \ 4 週以上。\n- （2）有權威的上升 X 線碰到，且有二次阻力現象。\n- （3）完成雙重底或頭肩底的最小測量。\n- （4）碰到前一個空頭市場中級底部的阻力帶。\n\
    - （5）竭盡缺口出現，高成交量出現。\n- （6）中級上升趨勢線已經往下跌破。\n\n以上信號出現時，可以考慮暫時賣出股票。\n\n## 回檔\n\n第一部曲碰到前面尾聲信號時，會產生幅度較大，時間較長的回檔整理，而且形成容易辨認的特別型態。這些大盤檔或大整理的特別型態，有下列\
    \ 9 種形式：\n\n- （1）形成對稱三角形\n  ![](img/114f067fd2db153a6ed238c66e83de58_168_0.png)\n\
    - （2）形成頭肩底整理型\n  ![](img/114f067fd2db153a6ed238c66e83de58_168_1.png)\n- （3）形成雙重底整理型\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_168_2.png)\n- （4）形成下降楔形\n  ![](img/114f067fd2db153a6ed238c66e83de58_168_3.png)\n\
    - （5）形成頭肩頂整理形，右肩拖很長，有時還假突破頸線。\n  ![](img/114f067fd2db153a6ed238c66e83de58_168_4.png)\n\
    - （6）形成矩形\n  ![](img/114f067fd2db153a6ed238c66e83de58_168_5.png)\n- （7）直接把第一部曲的上漲回落\
    \ 1/2～1/3\n  ![](img/114f067fd2db153a6ed238c66e83de58_169_0.png)\n- （8）做下降扇形線修正\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_169_1.png)\n- （9）不斷上下跳動，振動愈來愈小，成交量減少。\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_169_2.png)\n\n當大盤檔進行到末期，成交量已經減少到第一部曲結束時的\
    \ 1/3 以下，碰到下降 X 線時可以大膽買進，準備第二部曲行情的來臨。\n\n## 多頭第一部曲操作\n\n- （1）利用下降 X 線，在空頭市場最低價買進。\n\
    - （2）當多頭趨勢愈來愈明顯時，不輕易賣出股票。\n- （3）上漲途中，如有碰到上升 X 線，酌量賣出，回跌時立刻補回。\n- （4）進入尾聲時賣出股票觀望。\n\
    - （5）不要放空。\n- （6）成交量在此階段逐漸增加，不要太過憂慮。\n\n## 12-5（b） 多頭市場第二部曲\n\n多頭市場第二階段的上升，也叫做第二個中級上升，稱為多頭市場第二部曲。\n\
    \n### 起源\n\n- （1）起源於第一部曲結束，大盤檔完成之後。\n- （2）起步前的形狀，如第一部曲結束之後，所形成的 9 種形狀（如前述）。\n\n\
    事實上，第一階段盤檔完成之後，您要做好進入第二階段的準備。\n\n圖 12-1 頭肩頂整理與頭肩頂反轉。春池在 A 形成頭肩頂整理，接著進入多頭市場第二部曲，在\
    \ B 形成頭肩頂反轉。\n\n![](img/114f067fd2db153a6ed238c66e83de58_171_0.png)\n\n### 上升特色\n\
    \n- （1）上漲速度和第一部曲差不多，有時更快。\n- （2）每上升 7～10 天會有次級回跌，回跌以旗形或細長三角形爲多。\n- （3）整個第二部曲常有三個次級上升。\n\
    - （4）上漲途中隨便賣出股票，要高價才能補回。\n- （5）空頭愈拋空，行情愈漲，直到空頭死心，並在高價，不計一切補回爲止。\n\n### 尾聲\n\n\
    - （1）週線圖上有上升 X 線碰到。\n- （2）日線圖上有三條上升 X 線碰到。\n- （3）發生二次、三次阻力或二度阻力。\n- （4）漲幅已和第一部曲差不多。\n\
    - （5）完成三個次級上升，竭盡缺口（跳空）出現。\n- （6）出現新頂點時，成交量反而減少。\n- （7）跌破一條權威的上升趨勢線。\n- （8）跌破前一個次級頂點支撐（即支撐失敗）。\n\
    - （9）頭肩頂、雙重頂或增大頂已完成並向下突破。\n\n以上信號陸續出現時，您要逐漸減少股票。當反轉型態完成時，完全拋出股票，空頭市場快來臨。\n\n###\
    \ 結束\n\n空頭市場進入第二部曲尾聲，市場會反轉進入空頭市場，最常見的反轉型態如下（詳見 220 頁）：\n\n- （1）頭肩頂\n  ![](img/114f067fd2db153a6ed238c66e83de58_173_0.png)\n\
    - （2）雙重頂\n  ![](img/114f067fd2db153a6ed238c66e83de58_173_1.png)\n- （3）增大頂點\n \
    \ ![](img/114f067fd2db153a6ed238c66e83de58_173_2.png)\n  ![](img/114f067fd2db153a6ed238c66e83de58_174_0.png)\n\
    - （4）下降三角形\n  ![](img/114f067fd2db153a6ed238c66e83de58_174_1.png)\n- （5）倒 V 形\n\
    \n當以上型態完成，並向下決定性突破，空頭市場來臨，您要參加空頭陣容。\n\n### 多頭第二部曲操作\n\n- （1）利用下降 X 線及成交量遞減信號，在多頭第一部曲之後的盤檔末期買進。\n\
    - （2）上漲途中，如有上升 X 線碰到，酌量賣出，回跌立刻補回。狂飆時採行逐級的停止損失委託。\n- （3）利用週線圖上升 X 線在最頂點脫手。\n- （4）利用日線圖上升\
    \ X 線三次阻力或二度阻力出貨。\n- （5）反轉型態完成，空頭市場確認，參加空頭陣容。\n\n### 是否有第三、第四部曲？\n\n多頭市場是否有第三、第四部曲呢？不能期待每次皆有。但是，假如在第二部曲之後，反轉沒有來臨，只是不斷盤旋，當技術性情況，或客觀環境的確對多頭有利時，再考慮買進，並做下停止損失委託即可。\n\
    \n## 12-6 空頭市場\n\n股價下跌一波比一波低，好像落潮。股價跌多漲少，下跌幅度至少 30%，下跌時間至少三個月，主要趨勢是下跌的市場叫空頭市場。\n\
    \n空頭市場主要趨勢可以分成三個階段：出貨期、恐慌期及斷頭期。\n\n### 出 貨 期\n\n它真正形成，是在前一個多頭市場的最後一個階段，也就是多頭市場沸騰噴出期的末尾。在這個階段有遠見的人，察覺到景氣高峰已過，企業盈餘預期達不到正常的高點，衰退將要開始。\n\
    \n於是加速出貨，這時成交量仍然很高，出貨很容易，時有快速回落及彈升，回落時成交量放大，彈升時成交量減少，此時大眾仍然熱衷於交易，但是，開始感覺到獲利不易，偶有短暫套牢。\n\
    \n### 恐慌期\n\n由於第一階段詭異的末端，想要買進的人，開始退縮，而想賣出的人，急著脫售。股價快速下跌，有些公司還宣布調降盈餘目標，更是火上加油。股價連續下跌，成交量稀少，散戶驚恐莫名。\n\
    \n這一階段的末尾，恐慌結束時，成交量放大，顯然是空頭回補及一些想搶反彈者進場了。回頭看看企業現況，沒有想像的壞，可能還有盈餘分配（前一景氣賺的）。這一次會有一個中級反彈，時間超過三週。\n\
    \n### 斷頭期\n\n有些投資人，經歷第一、第二階段的風暴，咬緊牙關，希望風暴趕快過去，不過現在也失望了。上一階段才買進者，也失去信心。新聞報導顯現了惡化情況，不只經濟上出現的問題，可能還有政治、社會及國際戰爭上的問題。投資人完全崩潰。\n\
    \n股票跌，經濟不好，資金調度困難。融資追繳急如星火，斷頭處處，哀鴻遍野。\n\n空頭市場會在大量壞消息中結束，最壞的情況已經出現了，好像沒有任何理由買進任何一張股票。事實上，在壞消息出盡前，空頭市場已悄悄過去，進入多頭市場的進貨期。有遠見的人，進場接收沒人要的股票，例如國揚建設有一年的空頭市場跌至\
    \ 5 元，後來漲到 200 多元；台基從 291 元跌到 13.5 元，後來漲到 129 元，都是極端的例子。不久前，鬧得滿城風雨的台開股票內線交易案，和上面例子比較，台開漲幅還是小巫見大巫。\n\
    \n在股票市場，逢低買進，有時是賺大錢的方法（要判斷公司會倒閉否）。\n\n如果您有足夠的股票圖，翻出來看看，過去五年或十年間，它們的多頭市場和空頭市場，是如何的進行，對於股價變動，就可以做合於邏輯的推演了。\n\
    \n## 12-7 空頭市場三部曲\n\n空頭市場的大環境，以技術性分析，分成三個階段，稱之為空頭市場三部曲，以便和多頭市場二部曲相連貫，完成多頭市場和空頭市場循環。空頭市場三部曲，每一部曲由一個型態導致一大波段下跌。當然，有時候小型的空頭市場，只跌兩部曲，不能完全遵照空頭市場三部曲特定模式。\n\
    \n如果，空頭市場二部曲之後，週線圖上已經碰到下降 X 線了，日線圖上已經碰到三條下降 X 線。如此，空頭市場就會結束，但是，空頭市場至少跌兩部曲，是不可少的。\n\
    \n## 12-8 何謂空頭市場三部曲\n\n空頭市場起源於頭肩頂、雙重頂、增大頂點及下降三角形等型態。此後，它的下跌，可分成三個比較大的階段，每一個階段的醞釀型態，及下跌都各有不同的特色，稱之為空頭市場三部曲。\n\
    \n一個完整的空頭市場，必定包含三部曲。但是，股票市場中所有股票，有時行動並不一致。有些股票或許只跌二部曲，有些股票只是緩慢下跌，分不出大階段。\n\n###\
    \ 12-8（a）空頭市場第一部曲\n\n從多頭市場最頂點，可能是一個頭肩頂的頭部，到完成反轉型態的最小測量，是空頭市場第一部曲。\n\n#### 起源\n\
    \n- （1）頭肩頂反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_179_0.png)\n- （2）雙重頂反轉\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_180_0.png)\n- （3）增大頂點反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_180_1.png)\n\
    - （4）下降三角形反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_180_2.png)\n- （5）倒 V\
    \ 形或圓形反轉\n  ![](img/114f067fd2db153a6ed238c66e83de58_180_3.png)\n\n多頭市場走完接著而來，可能出現如上面所列的反轉型態（詳見第\
    \ 15 章）。這些型態向下突破頸線，暫時回升之後，繼續下跌，直到完成最小測量，是空頭市場第一部曲。\n\n空頭市場第一部曲下跌動力，是多頭市場第二部曲完成後的反轉型態而來。也就是頭肩頂或雙重頂等反轉型態，不但有反轉潛力，本身也構成空頭市場第一部曲下跌推動力量。\n\
    \n#### 下跌特色\n\n- （1）從頭部下來到頸線，下跌非常迅速，常有二、三個跌停板幅度。\n- （2）跌破頸線後往往有暫持回升。\n- （3）暫持回升後下跌非常快，一直到完成最小測量，並有下降\
    \ X 線碰到爲止。\n- （4）這一部曲，會把前一個多頭市場第二部曲的上漲幅度，大部分跌掉。\n\n#### 尾聲\n\n完成最小測量，碰到下降 X 線，或多頭市場第二部曲的上漲，大部分跌掉時，就到了尾聲。\n\
    \n#### 空頭市場第一部曲操作\n\n- （1）空頭市場第一部曲是承接多頭市場第二部曲。\n- （2）因此，依照多頭市場第二部曲的操作，儘早在頂點賣出股票，也可酌量放空。\n\
    - （3）向下突破頸線時加碼拋空。\n- （4）完成最小測量之後，碰到下降 X 線要補空，並以少量資金搶反彈。\n\n### 12-8（b） 空頭市場第二部曲\n\
    \n空頭市場第一部曲完成之後，接著中級反彈發生，一～三週之後，開始作一個小頭，股市漸漸進入空頭市場第二部曲了。\n\n#### 起源\n\n空頭市場第一部曲走完，一個中級反彈後會形成：\n\
    \n- （1）頭肩頂整理型態\n  ![](img/114f067fd2db153a6ed238c66e83de58_182_0.png)\n- （2）雙重頂整理型態\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_183_0.png)\n- （3）對稱三角形整理型態\n  ![](img/114f067fd2db153a6ed238c66e83de58_183_1.png)\n\
    - （4）側腰式整理型態\n  ![](img/114f067fd2db153a6ed238c66e83de58_183_2.png)\n  （小 M 頭右側較低）\n\
    \n以上型態的頂點，大都回升到第一部曲反轉型態的頸線爲止。有時市場惡劣時，還沒辦法回升那麼多。\n\n這些型態會向下突破，導致第二部曲的下跌。因此，第二部曲除了承受第一部曲的餘威外，本身仍有一個頭，引起第二部曲的下跌。這個頭，就是上面的四種。\n\
    \n#### 下跌特色\n\n- （1）下跌速度和幅度和第一部曲差不多。\n- （2）有時下跌比第一部曲緩慢，波折較多。\n- （3）一些認為空頭市場已跌這麼多的人逐漸買進（後來可能證明是錯的）。\n\
    \n#### 尾聲\n\n- （1）完成第二部曲推動力量的頭肩頂、雙重頂及三角形的最小測量。\n- （2）下跌幅度和第一部曲差不多了。\n- （3）有下降\
    \ X 線碰到。\n\n#### 空頭市場第二部曲操作\n\n- （1）空頭可以在第二部曲頂點處，有一條上升 X 線碰到時拋空。\n- （2）次級反彈有限，不可買進。\n\
    - （3）此部曲末期，可能並不會進入多頭市場，不要抱長期買進之心。\n\n### 12-8（c）空頭市場第三部曲\n\n空頭市場第二部曲走完，一個反彈之後，接著形成下列八種型態，而進入空頭市場第三部曲，這些型態有：\n\
    \n- （1）上升楔形（最常發生）\n  ![](img/114f067fd2db153a6ed238c66e83de58_185_0.png)\n- （2）對稱三角形\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_185_1.png)\n- （3）圓形回升\n  ![](img/114f067fd2db153a6ed238c66e83de58_185_2.png)\n\
    - （4）反圓形回升\n  ![](img/114f067fd2db153a6ed238c66e83de58_185_3.png)\n- （5）下降三角形\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_186_0.png)\n- （6）半增大型\n  ![](img/114f067fd2db153a6ed238c66e83de58_186_1.png)\n\
    - （7）增大型\n  ![](img/114f067fd2db153a6ed238c66e83de58_186_2.png)\n- （8）蝸牛型（有時出現在空頭第二部曲）\n\
    \  ![](img/114f067fd2db153a6ed238c66e83de58_186_3.png)\n\n以上 8 種型態，發展時間超過 3 週，是第三部曲下跌的動力，有時會引起恐慌下跌。\n\
    \n形成這些型態，及後來下跌的心理，乃是空頭市場已經跌了這麼多，這麼久了，多頭市場可能要開始了吧？但是，隱藏在這牛皮行情的後面，卻是恐慌下跌的危機。\n\n\
    如果，此時有政治上的，或經濟上的不利因素，恐慌下跌就難免了。等到想買進的人都買了，空頭發動攻勢，讓這些上轎的人紛紛跳下來。當然，那時也幾乎是股票發行公司壞消息頻傳的時候。\n\
    \n#### 起源\n\n空頭市場第三部曲起源於上述 8 種型態。\n\n#### 下跌特色\n\n- （1）開始幾天緩慢下跌。\n- （2）愈跌愈兇。\n\
    - （3）中間只反彈一次，時間二、三天。\n- （4）下跌幅度可能達 50%。\n- （5）成交量極度萎縮。\n- （6）空頭雀躍，多頭慘兮兮。\n\n####\
    \ 尾聲\n\n- （1）高敏感度的股票，下跌已有 50%（從第三部曲算起）。\n- （2）下跌幅度和第一二部曲差不多。\n- （3）中間已經過一個次級反彈（煞車）。\n\
    - （4）週線圖上有下降 X 線碰到。\n- （5）日線圖上有三條下降 X 線碰到。\n- （6）下降 X 線有二次支撐、三次支撐、二度支撐。\n- （7）市場利空消息頻傳，散戶空手多，成交量奇少。\n\
    - （8）業績好的股票，已有轉穩趨勢，投機股仍然大跌。\n\n#### 空頭市場第三部曲操作\n\n- （1）下跌之初，不可買進，若有股票要賣出。\n- （2）尾聲時，試圖利用下降\
    \ X 線買進。\n- （3）下跌多，成交量少的股票，一旦進入多頭市場則上漲快。\n- （4）注意底部發展過程，做好進入多頭市場的準備。\n\n## 12-9\
    \ 空頭市場結束\n\n空頭市場第三部曲結束時，已是空頭市場終點。到此整個下跌已有半載，或一年了，多頭潰不成軍，信心盡失。但是，聰明的技術性分析者，則躍躍欲試，準備迎接多頭市場來臨。\n\
    \n## 12-10 空頭市場是否只跌二部曲\n\n空頭市場是否只跌二部曲呢？\n\n技術性的空頭，可能只跌二部曲。景氣大循環的空頭市場則有三部曲。\n\n\
    有的時候，每一位分析者分段方法不同，所分出來的段落就不一樣。有時候盤檔不足三週，也不能算一部曲，只能算一個次級下跌而已。\n\n不管如何分段，碰到權威的下降\
    \ X 線，買進股票總是有利可圖。這是股價 X 線可以肯定的。\n\n![](img/114f067fd2db153a6ed238c66e83de58_190_0.png)\n\
    \n圖 12-2 頭肩頂反轉。鉑德在 1997 年 7-8 月間形成一個巨大而不平衡的頭肩頂，跌突破頸線後沒有暫時回升。\n"
