    畫圖要有資料來源：報紙、網路、有線電視等，有當天最高、最低、收盤價及成交量就可以。


    一個人需畫多少股票圖？這要看您的工作和時間。


    如果，您是股市專業人員，像營業員、操盤人及專業投資者畫 200 種也不嫌多，因爲您是靠股票吃飯的。


    業餘投資者，大概有能力畫 100 種，各行各業股票挑一些畫，電子股比重大，可多畫幾種。時間夠時，日線及週線均畫，時間不夠時，只畫週線即可。每個禮拜花幾小時去畫股票圖是需要的。


    親自畫圖，比較快進入技術性分析領域，也可保存有長時間的股票圖，這是您寶貴的資產。


    畫圖經驗的累積，加上熟練的股價 X 線，您就可以在股市立足了。


    畫圖的工作，需要每天不間斷的接下去，停幾天不畫，您就會懶惰，時效也差。


    從事股票投資，賺錢不用繳所得稅，這可能是您一生的事業，當然要投入一些時間和心力。


