    \n剪刀是一種槓桿工具，它的支點好像股價 X 線的 B 點，支點不能太複雜，否則剪刀轉不動。\n\n股價 X 線的 B 點交叉要單純，不然股價 X 線不權威。\n\
    \n## 7-4 基本點要明顯\n\n前面已經討論過，基本點愈明顯愈好。\n\n不明顯的基本點不要勉強使用，但是，電腦圖經過放大或壓縮，改變了基本點的原始模樣。電腦圖放大時，不明顯的基本點會變明顯，造成誤判。電腦圖壓縮時，明顯的基本點卻看不出來，反而不知要畫股價\
    \ X 線。如此這般，擾亂了判斷。\n\n還是自己用半對數圖紙畫一些圖，不足的再用電腦圖補充，比較實際。\n\n## 7-5 其他試驗\n\n股價 X 線除了受剪刀原理、二週原則、交叉要單純、基本點要明顯考驗外，尚須注意：\n\
    \n- (1) 空頭市場和多頭市場的基本點互連，特別權威。\n- (2) 在同一個變動，如楔形、三角形、小幅盤局的基本點不要互連，連起來的股價 X 線不權威。好像親族不婚配一樣。即使勉強連起來，也只能考驗附近變動而已。\n\
    \n經過這些權威性試驗，您就可以確認一條股價 X 線可靠性了。然後，據此以執行您的買賣，勝算很大。\n\n## 7-6 失效情形\n\n股價 X 線也有極少數失效情形，這些不外：\n\
    \n- **A. 在多頭市場：**\n  - （1）碰到上升 X 線 2 天內沒有回跌，結果會在第 3 天或第 4 天，快速下跌，一旦下跌會迅速跌至原來上升\
    \ X 線之下，也就是超出上升 X 線以上的部分屬於超漲，撐不了多久，跌回去還人家吧。\n    口訣：*超漲快跌回*\n  - （2）多頭市場起步時，大漲若干天，碰到上升\
    \ X 線，奇怪的是，第二天只有小跌（譬如跌 3%），這種情形第三天會開始再大漲，多頭市場起步，其上漲潛力是很大的，這可以理解。\n  - （3）基本點不明顯、不符合剪刀原理、二週原則，這種失效不能怪股價\
    \ X 線失效。\n  - （4）未使用半對數紙。方格紙股票圖碰到股價 X 線時問不對。這是圖紙問題，非股價 X 線失效問題。\n\n- **B. 在空頭市場：**\n\
    \  - （1）碰到下降 X 線 2 天內沒有上漲，結果會在第 3 天或第 4 天，加速上漲，迅速回升到下降 X 線之上，也就是超出下降 X 線以下的部分屬於超跌，撐不了多久，漲回來還我們吧。\n\
    \    口訣：*超跌快漲回*\n  - （2）空頭市場起步時或未期時，大跌若干天，碰到下降 X 線，奇怪的是，第二天只有小漲（譬如漲 3%），這種情形第三天會開始再大跌，空頭市場起步，其下跌潛力很大。空頭市場末期時市場相當恐慌，下降\
    \ X 線反應猶豫一些，這也可以理解。\n\n空頭市場不輕易買股票，除非確認已到終點了。\n\n權威性的股價 X 線，真正失效的情形很少，可以大膽的使用，十次有九次成功的機會。\n\
    \n股價 X 線是您操作股票的厲害武器！\n\n![](img/114f067fd2db153a6ed238c66e83de58_125_0.png)\n\n\
    圖 7-4 基本點明顯。矽統基本點明顯，連成的股價 X 線特別權威，只是在圖上尚未碰到，先畫出 X 線等著，有一天若股價下跌碰到您畫出的股價 X 線，就可採取行動。\n\
    \n![](img/114f067fd2db153a6ed238c66e83de58_126_0.png)\n\n圖 7-5 上升 X 線失效。 華泰 B\
    \ 型上升 X 線在 C 點碰到，第二天小回一下，繼續漲。注意碰線第二天小回會繼續上漲。\n\n![](img/114f067fd2db153a6ed238c66e83de58_127_0.png)\n\
    \n是回檔中心點。這一條上升 X 線往往可決定多頭市場終點。\n\n![](img/114f067fd2db153a6ed238c66e83de58_128_0.png)\n\
    \n基本點明顯，交叉單純。所以是權威的下降 X 線。在 1 買進就漲起來了。這條下降 X 線初學者也容易畫出來。\n\n# 8 半對數圖紙和股價 X 線\n\
    \n半對數圖紙用於股價技術性分析，它的好處我們已經討論好幾次了。\n\n## 8-1 等比例圖紙\n\n圖上同樣垂直高度代表相同的百分比，打開半對數圖，上漲高度大的，上漲百分比也高。上漲高度幾公分相當於百分比多少也是固定的，使用一把尺就知道上漲百分比，不必計算機。\n\
    \n## 8-2 圖不會變形\n\n半對數圖不會因股價暴漲或暴跌而變形，畫出的各種線準確好看。半對數圖上的趨勢線經常是一直線，這是很迷人的地方，它為何要成一直線呢？這使得股票變成可以預測。股票一跌破趨勢線就知道了，它代表趨勢的改變。\n\
    \n同樣的，股價 X 線在半對數圖上也是一直線，也可以預測。\n\n方格紙上的股票圖，上漲時圖被拉長，上升 X 線會提早碰到；下跌時圖被壓扁，下降 X 線會晚幾天碰到，股價\
    \ X 線就沒有那麼準了。恐慌下跌幅度太大時，則碰不到下降 X 線。趨勢線也不能畫直的，變成彎曲的趨勢線。所以，如果您研究股票，一開始想走正確的路，使用半對數圖紙不可少。\n"
  mdcn: "\n## 5-7 時間問題\n\n毫無疑問的，支撐和阻力現象會隨著時間而模糊。\n\n股價 X 線是支撐和阻力的演變。因此，股價 X 線的效果是受時間影響的。說明如下：\n\
    \n- 日線圖上，由次級點連成的股價 X 線，大約在半年內有效。\n- 日線圖上，由中級點和比較明顯的次級點連成的股價 X 線，大約在一年內有效。\n- 日線圖上，由原始點和原始點連成的股價\
    \ X 線（在週線圖上已經同時出現），大約在 5 年有效。\n- 週線圖上的股價 X 線，大約在 5 年左右有效。\n- 月線圖上的股價 X 線，在 10\
    \ 年左右有效。\n\n隨著時間的遷移，新的股價 X 線不斷產生。除非是由中級點所連成的股價 X 線，可延續若干年。一些次級點所連成的股價 X 線，將逐漸失去效用。\n\
    \n一年以上股價 X 線，以週線圖來畫最好，一旦畫出股價 X 線，可以使用 5 年。\n\n股價 X 線長時間使用，會有股價除息、除權而影響圖面的問題。一般除息只有一、二元，沒有影響。\n\
    \n週線圖上除權 20% 以內造成的缺口，可以不予理會，不必填回除權缺口，好像股票正常漲跌一樣去畫、去使用股價 X 線即可。\n\n日線圖上除權 10% 可以正常使用，不必填回除權缺口。但是除權大於\
    \ 10% 時，要把缺口移回去，因為日線圖上的股價 X 線使用時間較短，大的除權在短時間內，多少是會影響股價 X 線的效用的。\n\n現在股票衆多，碰到除權太大的股票，可以暫時不在這種股票上畫股價\
    \ X 線，另尋其他目標即可。但是股票圖還是要延續下去，等待未來的機會。\n\n註：次級點是次級頂點或底部，股票圖上最小的點。\n\n中級點是中級頂點或底部，比次級點明顯許多。\n\
    \n原始點是原始頂點或底部，原始點是多頭市場（或空頭市場）的起點和終點（圖 5-6）。\n\n![](img/114f067fd2db153a6ed238c66e83de58_102_0.png)\n\
    \n## 5-8 不斷有上升 X 線及下降 X 線\n\n一張股票圖上，不斷有上升 X 線及下降 X 線出現。幾乎每產生一個頂點或底部，便可以畫出新的股價\
    \ X 線。您也必須把它畫出。\n\n有些股價 X 線，可能永遠沒有碰到它。有些比較平緩而有權威的股價 X 線，很久以後才發生效力。\n\n不論如何，遇到可以畫出股價\
    \ X 線時，就要把它畫好。然後，以守株待兔的方法，靜靜的在那裡等著，您的努力終會有報酬。\n\n![](img/114f067fd2db153a6ed238c66e83de58_103_0.png)\n\
    \n隨著時間的推移，上升及下降 X 線不斷產生，您也必須畫出，守株待兔。\n\n![](img/114f067fd2db153a6ed238c66e83de58_104_0.png)\n\
    \n圖 5-8 B 型和正統下降 X 線交叉。B 型下降 X 線 ($X_3$) 在空頭市場初期較差，但和下降 X 線 ($X_2$) 配合，在 C 可買進。\n\
    \n# 股價 X 線\n\n![](img/114f067fd2db153a6ed238c66e83de58_105_0.png)\n\n圖 5-9 不權威股價\
    \ X 線。圖中 X 線都由同一個盤檔相互畫出，基本點也不明顯，所以都是不權威股價 X 線，不能使用。\n\n![](img/114f067fd2db153a6ed238c66e83de58_106_0.png)\n\
    \n圖 5-10 下降 X 線失效。碰到 $X_1$ 並未反彈，而在二週後才又回到 $X_1$ 之上。一條權威下降 X 線暫時失效，不久也會補漲。\n\n\
    ![](img/114f067fd2db153a6ed238c66e83de58_107_0.png)\n\n圖 5-11 賣到最高價。敬鵬一條上升 X 線在\
    \ C 賣到最高價。\n\n![](img/114f067fd2db153a6ed238c66e83de58_108_0.png)\n\n圖 5-12 下降\
    \ X 線和恐慌下跌。 光寶 $X_1$ 發揮煞車作用，碰到 $X_2$ 就真正反彈。 $X_2$ 落底線下，可以移至中央線。\n\n# 6 股價 X 線理論根據\n\
    \n## 6-1 支撐和阻力是水平——不可靠\n\n支撐和阻力的理論，常用來決定買賣時機，在股價技術性分析上佔有重要地位。\n\n支撐和阻力都是使用在水平狀況，也就是如果在某一價位有大量成交，下一次股價又回到此價位時，必會遭遇一些麻煩。有人利用支撐和阻力，作箱形操作，據說十分成功。\n\
    \n## 6-2 股價 X 線是斜的支撐和阻力——可靠、準確\n\n股價 X 線是支撐和阻力的一種特殊狀況，一種斜的支撐和阻力。\n\n從（圖 6-1）裡您可以簡單的理解，如何由水平的支撐和阻力，發展成斜的支撐和阻力，形成股價\
    \ X 線。\n\n從（圖 6-1）的上半部的第二種情形看來，下降 X 線是從支撐狀況演變而來，只因為從第二頂點跌下來，在第一頂點的價位 A 未獲得足夠支撐而下壓了一點，這種過度的壓力，表示買方力量有所不足。當股價從第三頂點跌下來時，不會很快獲得足夠支撐，而需要跌到更\
    \ 低價位 C，碰到這一條現在叫做下降 X 線時，買方力 量，才能勝過賣方而終於產生回升了，於是下降 X 線誕 生了。B 點愈低，C 點跟著降下來，下降 X\
    \ 線傾角愈大 （愈斜向右下方的意思）。\n\n從（圖 6-1）上半部的第一種狀況情形，若從第二頂點跌下來，在第一頂點的價位上方，已獲得足夠支撐而跌不下去。這種提早獲得支撐，表示買方力量略勝一籌。當股價從第三頂點跌下來時，跌少許就已獲得支撐而停止矣，C\
    \ 點比 B 高了，碰到這一條現在叫做 B 型下降 X 線時，買方力量已勝過賣方，而提早產生回升了，於是 B 型下降 X 線誕生了。B 點愈高 C 點跟著抬更高。B\
    \ 型下降 X 線的仰角就愈大（愈斜向右上方的意思）。\n\n從（圖 6-1）下半部的第三種情形看來，上升 X 線是從阻力狀況演變而來。當股價從第二底部上來，多頭較強，衝過\
    \ A 到達 B 才回檔。既然多頭較強，下一次股價上升到達這條現在叫做上升 X 線才會回檔，於是上升 X 線誕生了。\n\n演變下去，B 點愈高時。表示多頭愈強，從第三底部的上升，C\
    \ 點跟著更高，上升 X 線的仰角更大（愈向右上方傾斜的意思）。\n\n從（圖 6-1）下半部的第四種情形看來，當股價從第二底部上來時 在抵達前一底部 A\
    \ 之前已遭到阻力，表示賣方力量較強或多頭力量不足，到達 A 之前已退下來。既然多頭力量不足，下一次從第三底部上升會提早遭遇阻力，於是 B 型上升 X 線誕生了。演變下去，B\
    \ 點愈低時，C 點跟著更低，B 型上升 X 線的傾角更大（愈向右下方傾斜的意思）。\n\n![](img/114f067fd2db153a6ed238c66e83de58_112_0.png)\n\
    \n圖 6-1 支撐與阻力的演變\n\n上半部由水平支撐，逐漸演變成 B 型下降 X 線和下降 X 線；\n\n下半部由水平阻力，逐漸演變成上升 X 線和\
    \ B 型上升 X 線。\n\n## 6-3 股價 X 線較敏感\n\n不論上升 X 線或是下降 X 線，它們比一般支撐和阻力更明確，也更敏感些。只要在碰到\
    \ X 線的當天或第二天就會產生作用。\n\n這好比一個從高處落下的皮球，碰到水平的地面和碰到傾斜的地面，反跳的方式不一樣。\n\n皮球碰到水平的地面，只單純往上彈；而皮球碰到傾斜的地面，不只往上彈，而且瞬時往旁邊跳開，看起來彈跳比較敏感些。\n\
    \n所以股價 X 線比支撐和阻力更敏感，也更明確。只要在碰到 X 線的當天，或第二天就會產生作用。\n\n## 6-4 學院派新研究課題\n\n近年來，諾貝爾經濟獎也有由市場派獲得者，不一定由學院派包辦。\n\
    \n新竹市是科技、經濟及人文重鎮，曾經出過諾貝爾獎得主。\n\n新竹市有位吳先生，自從股價 X 線問世以來，就利用股價 X 線縱橫股票市場，凡出師大多告捷。\n\
    \n這件事引起新竹某國立大學企業管理研究所所長的注意，為何這種流形於市場的股價 X 線，如此管用？\n\n企管研究所所長為了一探股價 X 線究竟，親自繳費，來聆聽\
    \ 敝人 所開的股價 X 線精修班課程，還全程錄影，慎重之至。\n\n所長要和他所帶領的六、七十位研究生中的若干人，把股價 X 線當作企管研究主題，研究股價\
    \ X 線爲何如此準確，有意找出股價 X 線的理論根據，窺視諾貝爾獎。將來要是真能得獎， 敝人 應該也有一份吧。\n\n其實，十多年前，就有成功大學的某位人士，利用股價\
    \ X 線理論當做研究題目，獲得碩士學位，還把論文印成書上市。\n\n您對股價 X 線有興趣了嗎？\n\n您可以買一本股價 X 線回去，不管您是想作股票賺錢，或是想獲得學位，甚至想得什麼大獎。\
    \ 股價 X 線任您選擇，馳騁去也。\n\n# 7 股價 X 線權威性試驗\n\n股價 X 線的最大好處，是碰線即回跌或漲升。\n\n但是，用以連成股價 X\
    \ 線的頂點和底部，是否具有代表性，這兩點和碰線位置三點之間的關係，我們仍要加以討論，以免囫囵吞棗。\n\n權威性試驗就是指這條股價 X 線有多大的權威，有多少的可靠性。和趨勢線一樣，股價\
    \ X 線也必須經過權威性試驗，以確認它的可靠性，進而執行買賣。\n\n一條權威性股價 X 線，可以幫您賺到錢的，而不權威或錯誤的股價 X 線，可能會導致虧損，豈能不慎。\n\
    \n## 7-1 剪刀原理\n\n剪刀是一種槓桿工具，槓桿構造有三點：\n\n- 施力點 (A)：剪刀把手施力的地方\n- 支撐點 (B)：螺絲固定處\n\
    - 受力點 (C)：剪刀刀口\n\n剪刀有三類型：\n\n- 中等的（一般用的，AB = BC），\n- 省時的（如剪布的，AB < BC）。\n- 省力的（如剪鐵皮，AB\
    \ > BC），\n\n這分類是和 ABC 三點位置有關。\n\n假如，有三條不一樣的 股價 X 線，它們用以連線的 AB 兩點和碰線的 C 點之間的關係和三種剪刀相比擬，那麼可以分成三類\
    \ 股價 X 線：\n\n- 第一類 股價 X 線： AB 長度等於 BC （AB = BC）\n- 第二類 股價 X 線： AB 長度小於 BC （AB\
    \ < BC）\n- 第三類 股價 X 線： AB 長度大於 BC （AB > BC）\n\n它們權威性依次排列：\n\n第一類 股價 X 線最好\n\n\
    第二類 股價 X 線次之\n\n第三類 股價 X 線最差\n\n雖然第一類比第二類權威，但是，第一、第二類股價 X 線都可以用來買賣股票。至於第三類只要 AB:\
    \ BC 的比不要太大，例如 5:3 而已，仍然可用。如果比達到 5:1 就不好了，達到 10:1 是不能用的。\n\n以上 AB 或 BC 至少有 12\
    \ 天（週線圖上 12 週，月線圖上 12 月，圖上 12 根線就是）\n\n所謂 AB=BC 並非一天不差，相近即可，剪刀原理分類舉例如表 (7-1)，讀者可以舉一反三。\n\
    \n## 7-2 二週原則\n\n以上三類 股價 X 線中，AB 或 BC 的時間都要受二週原則的限制。\n\n二週原則是 AB 或 BC 的時間至少 2\
    \ 週。（12 根日線），週線圖上至少 12 週，月線圖上至少 12 月，圖上至少要 12 根線的意思，多一些更好。\n\n二週原則，其實是用以保證基本點明顯而已。一個次級點如果前後不足\
    \ 3 天（全部是 6 天），就不是一個明顯的基本點，是不能使用的。一個基本點要 6 天，連接股價 X 線的兩個點，當然需要 12 天了。以前 12 天剛好是\
    \ 2 個交易週。因此，稱爲二週原則。現在改爲每周交易 5 天，仍然沿用二週原則。如果 AB 或 BC 都只有 10 天如何？只能用來考量附近的短期變動而已。\n\
    \n## 7-3 交叉要單純\n\n前面討論過，股價 X 線好像蹺蹺板，轉軸只能有一根。太多根就轉不動了。股價 X 線和趨勢交叉地方，最好是一天或兩天，三、四天比較差，如果交叉的地方上下漲跌好幾次，就不能使用。\n\
    \n初學者常以一個底和遠方的頂相連，中間會與股價趨勢交叉好幾次，形成好幾個 X。這是嚴重錯誤，力求避免（圖 7-1）。\n\n![](img/114f067fd2db153a6ed238c66e83de58_119_0.png)\n\
    \n圖 7-1 錯誤的上升 X 線連法。 A 直接和 C、D 連是不對的。\n\n![](img/114f067fd2db153a6ed238c66e83de58_119_1.png)\n\
    \n圖 7-2 上升 X 線和股價趨勢交叉太複雜。 這條上升 X 線不權威，用來買股票不可靠。\n\n表 7-1 股價 X 線權威性試驗舉例。按照表中 AB、BC\
    \ 的時間，第一類股價 X 線、第二類股價 X 線均可用來買賣股票。 第三類股價 X 線也可用，但只能小買賣。若第三類股價 X 線 和一、二類交叉於一點，則可發揮大效果，可大買賣。\n\
    \n| 第一類股價 X 線 | | 第二類股價 X 線 | | 第三類股價 X 線 | |\n| :--- | :---: | :--- | :---: |\
    \ :--- | :---: |\n| **AB** | **BC** | **AB** | **BC** | **AB** | **BC** |\n| 15\
    \ 天 | 18 天 | 25 天 | 40 天 | 20 天 | 12 天 |\n| 35 天 | 30 天 | 30 天 | 50 天 | 50 天 |\
    \ 15 天 |\n| 50 天 | 40 天 | 50 天 | 100 天 | 100 天 | 40 天 |\n| 3 週 | 4 週 | 3 週 | 5\
    \ 週 | 15 週 | 4 週 |\n| 4 週 | 3.5 週 | 5 週 | 10 週 | 20 週 | 5 週 |\n| 6 週 | 8 週 | 12\
    \ 週 | 18 週 | 30 週 | 6 週 |\n| 12 週 | 15 週 | 30 週 | 45 週 | 40 週 | 10 週 |\n| 16 週\
    \ | 13 週 | 40 週 | 70 週 | 12 週 | 4 週 |\n| 8 月 | 10 月 | 10 月 | 18 月 | 4 週 | 1 週\
    \ |\n| 2.5 年 | 3.0 年 | 1.0 年 | 1.6 年 | 3 年 | 1 年 |\n| 3.5 年 | 4 年 | 1.5 年 | 4\
    \ 年 | 5 年 | 2 年 |\n| 5 年 | 4 年 | 3 年 | 5 年 | 7 年 | 3 年 |\n\n![](img/114f067fd2db153a6ed238c66e83de58_121_0.png)\n\
    \n剪刀是一種槓桿工具，它的支點好像股價 X 線的 B 點，支點不能太複雜，否則剪刀轉不動。\n\n股價 X 線的 B 點交叉要單純，不然股價 X 線不權威。\n\
    \n## 7-4 基本點要明顯\n\n前面已經討論過，基本點愈明顯愈好。\n\n不明顯的基本點不要勉強使用，但是，電腦圖經過放大或壓縮，改變了基本點的原始模樣。電腦圖放大時，不明顯的基本點會變明顯，造成誤判。電腦圖壓縮時，明顯的基本點卻看不出來，反而不知要畫股價\
    \ X 線。如此這般，擾亂了判斷。\n\n還是自己用半對數圖紙畫一些圖，不足的再用電腦圖補充，比較實際。\n\n## 7-5 其他試驗\n\n股價 X 線除了受剪刀原理、二週原則、交叉要單純、基本點要明顯考驗外，尚須注意：\n\
    \n- (1) 空頭市場和多頭市場的基本點互連，特別權威。\n- (2) 在同一個變動，如楔形、三角形、小幅盤局的基本點不要互連，連起來的股價 X 線不權威。好像親族不婚配一樣。即使勉強連起來，也只能考驗附近變動而已。\n\
    \n經過這些權威性試驗，您就可以確認一條股價 X 線可靠性了。然後，據此以執行您的買賣，勝算很大。\n\n## 7-6 失效情形\n\n股價 X 線也有極少數失效情形，這些不外：\n\
    \n- **A. 在多頭市場：**\n  - （1）碰到上升 X 線 2 天內沒有回跌，結果會在第 3 天或第 4 天，快速下跌，一旦下跌會迅速跌至原來上升\
    \ X 線之下，也就是超出上升 X 線以上的部分屬於超漲，撐不了多久，跌回去還人家吧。\n    口訣：*超漲快跌回*\n  - （2）多頭市場起步時，大漲若干天，碰到上升\
    \ X 線，奇怪的是，第二天只有小跌（譬如跌 3%），這種情形第三天會開始再大漲，多頭市場起步，其上漲潛力是很大的，這可以理解。\n  - （3）基本點不明顯、不符合剪刀原理、二週原則，這種失效不能怪股價\
    \ X 線失效。\n  - （4）未使用半對數紙。方格紙股票圖碰到股價 X 線時問不對。這是圖紙問題，非股價 X 線失效問題。\n\n- **B. 在空頭市場：**\n\
    \  - （1）碰到下降 X 線 2 天內沒有上漲，結果會在第 3 天或第 4 天，加速上漲，迅速回升到下降 X 線之上，也就是超出下降 X 線以下的部分屬於超跌，撐不了多久，漲回來還我們吧。\n\
    \    口訣：*超跌快漲回*\n  - （2）空頭市場起步時或未期時，大跌若干天，碰到下降 X 線，奇怪的是，第二天只有小漲（譬如漲 3%），這種情形第三天會開始再大跌，空頭市場起步，其下跌潛力很大。空頭市場末期時市場相當恐慌，下降\
    \ X 線反應猶豫一些，這也可以理解。\n\n空頭市場不輕易買股票，除非確認已到終點了。\n\n權威性的股價 X 線，真正失效的情形很少，可以大膽的使用，十次有九次成功的機會。\n\
    \n股價 X 線是您操作股票的厲害武器！\n\n![](img/114f067fd2db153a6ed238c66e83de58_125_0.png)\n\n\
    圖 7-4 基本點明顯。矽統基本點明顯，連成的股價 X 線特別權威，只是在圖上尚未碰到，先畫出 X 線等著，有一天若股價下跌碰到您畫出的股價 X 線，就可採取行動。\n\
    \n![](img/114f067fd2db153a6ed238c66e83de58_126_0.png)\n\n圖 7-5 上升 X 線失效。 華泰 B\
    \ 型上升 X 線在 C 點碰到，第二天小回一下，繼續漲。注意碰線第二天小回會繼續上漲。\n\n![](img/114f067fd2db153a6ed238c66e83de58_127_0.png)\n\
    \n是回檔中心點。這一條上升 X 線往往可決定多頭市場終點。\n\n![](img/114f067fd2db153a6ed238c66e83de58_128_0.png)\n\
    \n基本點明顯，交叉單純。所以是權威的下降 X 線。在 1 買進就漲起來了。這條下降 X 線初學者也容易畫出來。\n\n# 8 半對數圖紙和股價 X 線\n\
    \n半對數圖紙用於股價技術性分析，它的好處我們已經討論好幾次了。\n\n## 8-1 等比例圖紙\n\n圖上同樣垂直高度代表相同的百分比，打開半對數圖，上漲高度大的，上漲百分比也高。上漲高度幾公分相當於百分比多少也是固定的，使用一把尺就知道上漲百分比，不必計算機。\n\
    \n## 8-2 圖不會變形\n\n半對數圖不會因股價暴漲或暴跌而變形，畫出的各種線準確好看。半對數圖上的趨勢線經常是一直線，這是很迷人的地方，它為何要成一直線呢？這使得股票變成可以預測。股票一跌破趨勢線就知道了，它代表趨勢的改變。\n\
    \n同樣的，股價 X 線在半對數圖上也是一直線，也可以預測。\n\n方格紙上的股票圖，上漲時圖被拉長，上升 X 線會提早碰到；下跌時圖被壓扁，下降 X 線會晚幾天碰到，股價\
    \ X 線就沒有那麼準了。恐慌下跌幅度太大時，則碰不到下降 X 線。趨勢線也不能畫直的，變成彎曲的趨勢線。所以，如果您研究股票，一開始想走正確的路，使用半對數圖紙不可少。\n"
