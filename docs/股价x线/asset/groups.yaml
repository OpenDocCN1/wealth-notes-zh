    | 12 | 口紅膠（圖紙黏接） | 1 條 |

    | 13 | 兩頭黑色簽字筆（細與極細） | 1 支 |

    | 14 | 錄放音機（錄好行情再畫也可） | 1 台 |

    | 15 | 電腦及掃描器（儲存資料） | 1 套 |


    B 硬度鉛筆最適合，太硬不容易畫，太軟容易污染。鉛筆 2 支削尖，4 支削平頭（像一字形螺絲起子頭寬 1.2 mm）。尖形用以註記，平頭用以畫股票價格。


    三角板放好位置，每天只要（週線圖是每週）畫一筆，收盤價在左邊點一點即可。


    成交量用橘色的筆畫出，每支約 10 元的利百代 4 號紙捲軟心色筆適用，以鉛筆或原子筆劃成交量不太適合。其實，如果只用股價 X 線操作，成交量不畫也沒關係。三角板及直尺選用透明無色的，紅藍兩用原子筆（單支紅筆或藍筆也可以）用以畫趨勢線和股價
    X 線。


    橡皮擦選用製圖用上品，小朋友用的那種不太適合。小鋼捲尺一個約 50 元，有時可補直尺不足。


