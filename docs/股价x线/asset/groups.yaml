    # 13-6 下跌趨勢線的權威性試驗


    和上升趨勢線相同，下跌趨勢線需要權威性試驗：


    +   （1）頂點愈明顯愈好。


    +   （2）愈多的頂點相連愈好。兩頂點間距離要適當。


    +   （3）頂點太近（小於一週）不好。


    +   （4）下跌趨勢線愈長愈好。


    +   （5）角度不要太陡。


    # 13-7 下跌趨勢線的突破及暫時回跌


    一條下跌趨勢線建立後，若股價以高成交量向上突破，且收盤價離下跌趨勢線有 3 % ，叫決定性突破。


    如果以低成交量突破下跌趨勢線，或收盤價離下跌趨勢線不足 3 % ，或盤中突破，收盤未破，都要對下跌'
