    ## 17-3 楔形


    楔形有上升楔形和下降楔形。


    多頭市場有下降楔形整理；空頭市場則有上升楔形整理。楔是尖形木片，用以擠入細縫撐緊。


    下降楔形是向右下方傾斜的尖而細的三角形，整理時間約一月，整理完後繼續上漲。它出現在多頭市場第一部曲結束的大盤檔。


    上升楔形是向右上方傾斜的尖而細的三角形，整理時間約一月，整理完後繼續下跌。它出現在空頭市場第二部曲結束的大盤檔。


    ![](img/114f067fd2db153a6ed238c66e83de58_259_0.png)


    ![](img/114f067fd2db153a6ed238c66e83de58_259_1.png)


    圖 17-3 楔形整理。 楔形以整理居多，整理時間約一個月，整理後會繼續先前的走勢。


    ### 17-4 矩形


    真正矩形整理比起前面那些形狀少。


    矩形和對稱三角形類似。只是整理區域中，矩形上下線比對稱三角形水平。


    上漲途中的矩形整理，出現在多頭市場第一部曲結束後的大盤檔（175 頁），此有別於出現在多頭市場末期的旗形或細長三角形。


    空頭市場的矩形整理，可能出現在空頭市場第一部曲結束後的反彈，但是不常見（圖 17-4）。


    ![](img/114f067fd2db153a6ed238c66e83de58_260_0.png)


    圖 17-4 矩形整理。 矩形整理後繼續前面走勢。


    ### 17-5 頭肩整理形


    頭肩整理形分爲頭肩底整理形，和頭肩頂整理形。兩者都出現在多頭市場第一部曲結束後大盤檔（175頁），而後者只出現在空頭市場第一部曲反彈（189頁）。


    頭肩整理形整理時間超過一月，右肩部分拖長，成交量有規則的減少。整理完後繼續前面的大趨勢。


    ![](img/114f067fd2db153a6ed238c66e83de58_261_0.png)


    非反轉，參看多頭市場二部曲和空頭市場三部曲，就知道它會出現在那一階段。


    ### 17-6 雙重底整理形


    雙重底整理形，出現在多頭市場第一部曲結束的大盤檔，整理時間超過一個月，整理過程成交量逐漸減少。


    一旦向上突破，多頭市場上漲會繼續下去。


    ![](img/114f067fd2db153a6ed238c66e83de58_262_0.png)


    圖 17-6 雙重底整理。整理後繼續前面走勢，突破前，在上線會小回停頓一下，緊接著以高成交量向上突破。雙重底整理的上下線如果複雜一些，看起來類似矩形。股票圖上型態的解釋有時是主觀的，隨個人看法而有不同。


    ### 17-7 半增大型及蝸牛型整理


    半增大整理型及蝸牛型出現在空頭市場第一、二部曲結束後大盤檔。半增大整理型和增大頂點比較，少了第三頂點，因此叫半增大整理型，整理時間約一個月。整理後繼續空頭市場下跌，有時還會恐慌下跌。


    蝸牛型以形狀像蝸牛稱之，特色是最後上衝失敗，原因是空頭市場還未跌夠，多頭像蝸牛頭一碰就縮了。


    ![](img/114f067fd2db153a6ed238c66e83de58_263_0.png)


    ![](img/114f067fd2db153a6ed238c66e83de58_263_1.png)


    圖 17-7 半增大型及蝸牛型整理。 兩者常常出現在空頭市場第一、第二階段反彈後的大整理（12章）。 半增大型比增大型少一個頂，一般人會誤以為 W 底已形成，然而在突破前一頂時，成交量不高，不久就往掉，會大跌一波段。


    蝸牛型特色是整理到尾聲，突然往上衝，隨即快速下跌。


