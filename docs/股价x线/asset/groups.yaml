    ## 9 股價X線


    ## 和其他技術性關係


    ### 9-1 相輔相成


    股價X線 雖然有獨到的優點，但是，並不否認其他技術性分析。


    不論您怎麼研究股票，總會碰到本書第一章所言的問題：


    - （1）不能在一個變動的最高點賣出，或最低點買進。

    - （2）不能非常明確指出，股價上漲在那裡會遭遇阻力；而在下跌途中，在何處會有支撐。


    股價 X 線 可以克服這兩項缺點。


    在股票圖上加上股價 X 線並不困難，也不用花多少時間。假如在您的股票圖上，畫上股價 X 線。這樣，在您原來的技術性分析系統，配上股價 X 線，兩者相辅相成，更加光輝。


    ### 9-2 洞燭機先


    不論何種技術性分析，都比不上 股價 X 線銳利。


    頂點或底部反轉，第一步總是先碰到 股價 X 線，進一步再發現其他型態。


    上升 X 線在上涨途中，明確指出在那裡會回跌；


    下降 X 線在下跌途中，明確指出在那裡會漲升。


    股價 X 線可以洞燭機先，而毫不含糊。


    所以，股價 X 線可以透视股票市場，而彌補任何技術性分析的缺點，彷彿 X 光可以透视眼睛看不到地方，而彌補視力的不足。


    ### 9-3 初學指南


    股票市場上，每年都有成千上萬的生力軍加入，每一個人懷著夢想，夢想著有一天藉著股票賺到很多錢，實現人生的許多願望。


    假如，您是一個初學者，想要利用一種可靠的方法作股票。有一天，偶然遇到 股價X線 這本書，買下了這本書，您已經踏出正確的第一步。


    熟讀之後，開始畫 股價X線，按照 下降X線買 股票，按照 上升X線賣 股票，也能有些收穫，是一個好的開始。


    但是，證券知識浩瀚，最好以股價X線為基幹，再涉獵其他技術，奠定穩固根基，才能立於不敗之地。


    首先，把本書後半段的經典技術性分析看看，這一部分本來預定在 1998 年出版的，拖到現在，併入股價X線出版。


    您再找到找美國股市權威 John Magee 經典之作的原文本或翻譯本好好看一看（初學者很費力）。


    但是，該書中強調頂點和底部是不能交叉畫出的，這一點 John Magee 疏忽了，非常可惜！


    這就是 敵人 發明的 *股價 X 線* 啊！所以，唸前人的書總要存有一點疑惑，並加以突破，這樣知識才會有所進歩。


    如果，您對股價 X 線吸收較慢，願意速成，也可以參加作者的 *股價 X 線* 精修班。


    進入股市，應不斷精進，才不會被淘汰。


