    \n## 6-1 支撐和阻力是水平——不可靠\n\n支撐和阻力的理論，常用來決定買賣時機，在股價技術性分析上佔有重要地位。\n\n支撐和阻力都是使用在水平狀況，也就是如果在某一價位有大量成交，下一次股價又回到此價位時，必會遭遇一些麻煩。有人利用支撐和阻力，作箱形操作，據說十分成功。\n\
    \n## 6-2 股價 X 線是斜的支撐和阻力——可靠、準確\n\n股價 X 線是支撐和阻力的一種特殊狀況，一種斜的支撐和阻力。\n\n從（圖 6-1）裡您可以簡單的理解，如何由水平的支撐和阻力，發展成斜的支撐和阻力，形成股價\
    \ X 線。\n\n從（圖 6-1）的上半部的第二種情形看來，下降 X 線是從支撐狀況演變而來，只因為從第二頂點跌下來，在第一頂點的價位 A 未獲得足夠支撐而下壓了一點，這種過度的壓力，表示買方力量有所不足。當股價從第三頂點跌下來時，不會很快獲得足夠支撐，而需要跌到更\
    \ 低價位 C，碰到這一條現在叫做下降 X 線時，買方力 量，才能勝過賣方而終於產生回升了，於是下降 X 線誕 生了。B 點愈低，C 點跟著降下來，下降 X\
    \ 線傾角愈大 （愈斜向右下方的意思）。\n\n從（圖 6-1）上半部的第一種狀況情形，若從第二頂點跌下來，在第一頂點的價位上方，已獲得足夠支撐而跌不下去。這種提早獲得支撐，表示買方力量略勝一籌。當股價從第三頂點跌下來時，跌少許就已獲得支撐而停止矣，C\
    \ 點比 B 高了，碰到這一條現在叫做 B 型下降 X 線時，買方力量已勝過賣方，而提早產生回升了，於是 B 型下降 X 線誕生了。B 點愈高 C 點跟著抬更高。B\
    \ 型下降 X 線的仰角就愈大（愈斜向右上方的意思）。\n\n從（圖 6-1）下半部的第三種情形看來，上升 X 線是從阻力狀況演變而來。當股價從第二底部上來，多頭較強，衝過\
    \ A 到達 B 才回檔。既然多頭較強，下一次股價上升到達這條現在叫做上升 X 線才會回檔，於是上升 X 線誕生了。\n\n演變下去，B 點愈高時。表示多頭愈強，從第三底部的上升，C\
    \ 點跟著更高，上升 X 線的仰角更大（愈向右上方傾斜的意思）。\n\n從（圖 6-1）下半部的第四種情形看來，當股價從第二底部上來時 在抵達前一底部 A\
    \ 之前已遭到阻力，表示賣方力量較強或多頭力量不足，到達 A 之前已退下來。既然多頭力量不足，下一次從第三底部上升會提早遭遇阻力，於是 B 型上升 X 線誕生了。演變下去，B\
    \ 點愈低時，C 點跟著更低，B 型上升 X 線的傾角更大（愈向右下方傾斜的意思）。\n\n![](img/114f067fd2db153a6ed238c66e83de58_112_0.png)\n\
    \n圖 6-1 支撐與阻力的演變\n\n上半部由水平支撐，逐漸演變成 B 型下降 X 線和下降 X 線；\n\n下半部由水平阻力，逐漸演變成上升 X 線和\
    \ B 型上升 X 線。\n\n## 6-3 股價 X 線較敏感\n\n不論上升 X 線或是下降 X 線，它們比一般支撐和阻力更明確，也更敏感些。只要在碰到\
    \ X 線的當天或第二天就會產生作用。\n\n這好比一個從高處落下的皮球，碰到水平的地面和碰到傾斜的地面，反跳的方式不一樣。\n\n皮球碰到水平的地面，只單純往上彈；而皮球碰到傾斜的地面，不只往上彈，而且瞬時往旁邊跳開，看起來彈跳比較敏感些。\n\
    \n所以股價 X 線比支撐和阻力更敏感，也更明確。只要在碰到 X 線的當天，或第二天就會產生作用。\n\n## 6-4 學院派新研究課題\n\n近年來，諾貝爾經濟獎也有由市場派獲得者，不一定由學院派包辦。\n\
    \n新竹市是科技、經濟及人文重鎮，曾經出過諾貝爾獎得主。\n\n新竹市有位吳先生，自從股價 X 線問世以來，就利用股價 X 線縱橫股票市場，凡出師大多告捷。\n\
    \n這件事引起新竹某國立大學企業管理研究所所長的注意，為何這種流形於市場的股價 X 線，如此管用？\n\n企管研究所所長為了一探股價 X 線究竟，親自繳費，來聆聽\
    \ 敝人 所開的股價 X 線精修班課程，還全程錄影，慎重之至。\n\n所長要和他所帶領的六、七十位研究生中的若干人，把股價 X 線當作企管研究主題，研究股價\
    \ X 線爲何如此準確，有意找出股價 X 線的理論根據，窺視諾貝爾獎。將來要是真能得獎， 敝人 應該也有一份吧。\n\n其實，十多年前，就有成功大學的某位人士，利用股價\
    \ X 線理論當做研究題目，獲得碩士學位，還把論文印成書上市。\n\n您對股價 X 線有興趣了嗎？\n\n您可以買一本股價 X 線回去，不管您是想作股票賺錢，或是想獲得學位，甚至想得什麼大獎。\
    \ 股價 X 線任您選擇，馳騁去也。\n\n# 7 股價 X 線權威性試驗\n\n股價 X 線的最大好處，是碰線即回跌或漲升。\n\n但是，用以連成股價 X\
    \ 線的頂點和底部，是否具有代表性，這兩點和碰線位置三點之間的關係，我們仍要加以討論，以免囫囵吞棗。\n\n權威性試驗就是指這條股價 X 線有多大的權威，有多少的可靠性。和趨勢線一樣，股價\
    \ X 線也必須經過權威性試驗，以確認它的可靠性，進而執行買賣。\n\n一條權威性股價 X 線，可以幫您賺到錢的，而不權威或錯誤的股價 X 線，可能會導致虧損，豈能不慎。\n\
    \n## 7-1 剪刀原理\n\n剪刀是一種槓桿工具，槓桿構造有三點：\n\n- 施力點 (A)：剪刀把手施力的地方\n- 支撐點 (B)：螺絲固定處\n\
    - 受力點 (C)：剪刀刀口\n\n剪刀有三類型：\n\n- 中等的（一般用的，AB = BC），\n- 省時的（如剪布的，AB < BC）。\n- 省力的（如剪鐵皮，AB\
    \ > BC），\n\n這分類是和 ABC 三點位置有關。\n\n假如，有三條不一樣的 股價 X 線，它們用以連線的 AB 兩點和碰線的 C 點之間的關係和三種剪刀相比擬，那麼可以分成三類\
    \ 股價 X 線：\n\n- 第一類 股價 X 線： AB 長度等於 BC （AB = BC）\n- 第二類 股價 X 線： AB 長度小於 BC （AB\
    \ < BC）\n- 第三類 股價 X 線： AB 長度大於 BC （AB > BC）\n\n它們權威性依次排列：\n\n第一類 股價 X 線最好\n\n\
    第二類 股價 X 線次之\n\n第三類 股價 X 線最差\n\n雖然第一類比第二類權威，但是，第一、第二類股價 X 線都可以用來買賣股票。至於第三類只要 AB:\
    \ BC 的比不要太大，例如 5:3 而已，仍然可用。如果比達到 5:1 就不好了，達到 10:1 是不能用的。\n\n以上 AB 或 BC 至少有 12\
    \ 天（週線圖上 12 週，月線圖上 12 月，圖上 12 根線就是）\n\n所謂 AB=BC 並非一天不差，相近即可，剪刀原理分類舉例如表 (7-1)，讀者可以舉一反三。\n\
    \n## 7-2 二週原則\n\n以上三類 股價 X 線中，AB 或 BC 的時間都要受二週原則的限制。\n\n二週原則是 AB 或 BC 的時間至少 2\
    \ 週。（12 根日線），週線圖上至少 12 週，月線圖上至少 12 月，圖上至少要 12 根線的意思，多一些更好。\n\n二週原則，其實是用以保證基本點明顯而已。一個次級點如果前後不足\
    \ 3 天（全部是 6 天），就不是一個明顯的基本點，是不能使用的。一個基本點要 6 天，連接股價 X 線的兩個點，當然需要 12 天了。以前 12 天剛好是\
    \ 2 個交易週。因此，稱爲二週原則。現在改爲每周交易 5 天，仍然沿用二週原則。如果 AB 或 BC 都只有 10 天如何？只能用來考量附近的短期變動而已。\n\
    \n## 7-3 交叉要單純\n\n前面討論過，股價 X 線好像蹺蹺板，轉軸只能有一根。太多根就轉不動了。股價 X 線和趨勢交叉地方，最好是一天或兩天，三、四天比較差，如果交叉的地方上下漲跌好幾次，就不能使用。\n\
    \n初學者常以一個底和遠方的頂相連，中間會與股價趨勢交叉好幾次，形成好幾個 X。這是嚴重錯誤，力求避免（圖 7-1）。\n\n![](img/114f067fd2db153a6ed238c66e83de58_119_0.png)\n\
    \n圖 7-1 錯誤的上升 X 線連法。 A 直接和 C、D 連是不對的。\n\n![](img/114f067fd2db153a6ed238c66e83de58_119_1.png)\n\
    \n圖 7-2 上升 X 線和股價趨勢交叉太複雜。 這條上升 X 線不權威，用來買股票不可靠。\n\n表 7-1 股價 X 線權威性試驗舉例。按照表中 AB、BC\
    \ 的時間，第一類股價 X 線、第二類股價 X 線均可用來買賣股票。 第三類股價 X 線也可用，但只能小買賣。若第三類股價 X 線 和一、二類交叉於一點，則可發揮大效果，可大買賣。\n\
