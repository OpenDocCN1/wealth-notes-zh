    現在, 您既興奮又迷惑, 怎樣動手作圖呢? 工欲善其事必先利其器, 畫圖必先有好的工具 (表 20-1)。


    ### 表 20-1 畫圖工具表


    欲畫股票圖需要一些工具，表列如下，酌量選用。


    | 編號 | 工具 | 數量 |

    | :--- | :--- | :--- |

    | 1 | B 硬度畫圖鉛筆 | 半打 |

    | 2 | 30 公分三角板 | 1 組 |

    | 3 | 45 公分透明直尺 | 1 支 |

    | 4 | 30 公分透明直尺 | 1 支 |

    | 5 | 紅藍兩用原子筆 | 2 支 |

    | 6 | 色筆（橘色） | 4 支 |

    | 7 | 橡皮擦 | 2 個 |

    | 8 | 美工刀 | 1 支 |

    | 9 | 鋼捲尺（2 米） | 1 個 |

    | 10 | 筆記本 | 1 本 |

