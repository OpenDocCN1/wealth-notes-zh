    ## 3-14 利用上升 X 線決定多頭市場終點


    討論上升 X 線的最終目標，是如何利用它來決定多頭市場終點。確定了多頭市場終點，可以賣光股票，暫時離開市場，或加入空頭陣容。


    多頭市場終點決定，通常由反轉型態：如頭肩頂、雙重頂(M 頭)、增大頂點及下降三角形等決定。但是，等待這些型態往下突破，再賣出股票，獲利減少許多。


    誰不希望在高點賣出？


    雖然，一些自誇在高點賣出股票的人，常被人認爲是吹牛，不過上升 X 線確實可以幫您達成這個願望。


    多頭市場的漲升，一般至少都有兩個階段，第一階段上漲後，進行大盤檔，大整理，然後才有第二階段的上漲。所以，多頭市場終點一定在第二階段之後，可能是第二階段或第三階段，其中以第二階段最常發生。


    如何在股價尚未完成反轉型態前，利用上升 X 線，決定多頭市場終點，是重要課題。


    利用上升 X 線決定多頭市場終點的方法：


    1. 遇線圖上碰到一條或一條以上的上升 X 線。

    2. 月線圖上碰到一條上升 X 線。

    3. 日線圖股價碰到三條上升 X 線的交叉點。

    4. 日線圖發生二度阻力或三次阻力。

    5. 日線圖碰到一條由多頭市場起點，和多頭市場第一階段上升之後，中級回檔的中心點，所連成的上升 X 線。此點不容易懂，示範如（圖 3-9）：


    ![](img/114f067fd2db153a6ed238c66e83de58_34_0.png)


    圖 3-9 通過回檔中心點的上升 X 線。這條上升 X 線往往可以決定小型多頭市場的終點。


    股價遇到上面 5 種上升 X 線，在大勢很強時，可能是反轉型態的左肩。但是，在大勢不強時，或者出現在落後補漲股時，可能是最高價了。


    落後補漲股往往在抵達終點時，整個大勢已快要反轉完成了，因此落後補漲股，沒有時間在頂點多停留一些時間發展反轉。好比一群登山的人，落後登頂的人會遇到最先登頂的人，已經快要下山的情形，您爲了跟上隊伍，沒有多少時間停留在山頂了。


    如果，您有落後補漲股，遇到上面 5 種上升 X 線，要快速賣出，脫離市場。


    賣出股票後，股價若是沒有反轉，而是盤旋整理，三週之後，能確認出可能又有一段漲升（景氣循環的大多頭市場才有可能），才可以酌量買進，並作停止損失委託。這次反轉沒有成功是一種警告，下次反轉會真的。


    不過，股價遇到上面 5 種上升 X 線後，再漲一段情形很少發生。有上面 5 種上升 X 線信號，最後都是反轉居多，要有心理準備。


