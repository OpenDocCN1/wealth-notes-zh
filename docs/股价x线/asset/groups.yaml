    # 3-12 很多股票碰到上升 X 線


    在同一時間，很多種股票碰到上升 X 線（譬如 有 20%）。這會造成一種氣勢，尤其是領導股和熱門股，有一大半碰到上升 X 線，這種情況顯示，大勢會有明顯回跌，也有可能反轉進入空頭市場。


    所以，很多股票碰到上升 X 線時（包括指數線），要仔細檢查您的股票有無碰到上升 X 線，有無遺漏上升 X 線而尚未畫到者，並考慮賣出股票。當然，此時不能再買股票了。我們看過下一章後，會利用下降
    X 線買進，此刻只考慮賣股票就對了。


