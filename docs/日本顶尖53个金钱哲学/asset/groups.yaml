    # ## 3

    # 以十年規模來思考事物


    若有金融投資的經驗，就會知道市場價格總是在變，我們常常因為「終於有獲利了」、「虧錢」等狀況，時而欣喜、時而擔憂。稍微有點獲利就急忙脫手，入袋為安，事後冷靜回想又心生後悔，「應該再等等才對」。確保短期利益並不一定是錯，但是若想獲得更大的利益，這樣或許不夠。


    大富豪投資會看得更遠。股票的走勢可以從一天、一週、一個月，到五年、十年來看，大富豪們關注的都是十年的長期走勢。如果沒有十年走勢圖，他們也會特地請人去查明，有時候甚至要調出二十年、三十年的走勢。他們長期觀察社會的變化，思考該如何才能獲取最大利益，從長期、中期、短期的角度分別來觀察，追求最大的價值。


    換句話說，他們會想像三十年後的未來，為了在十年後獲得最大利益，判斷現在應該怎麼做。'
  - '[PAGE 158]


    以前，我曾經見過一位在地方建立穩固地盤的大富豪，他經營建築相關的公司，原本在同業的大型企業工作，年薪五百萬，後來辭掉工作。放棄職位已經是很大的決心，但他並沒有馬上創業，轉職當市議員秘書，薪水相當微薄，聽說是「只能勉強維持生活」而已。


    他爲什麼沒有馬上成立建築公司？其實這是大富豪展望未來的眼光。議員的支持者中有從事土木、建築業人士，有時候這些人會有陳情委託，他便可以融入社區、認識居民、踏實傾聽大家的心聲。這樣的秘書生活過了五年，做足充分準備後，在故鄉成立建設公司，現在已經是當地無人不知的優良企業了。


    雖然不清楚具體的數字，不過他個人應該累積一筆可觀的資產，以建設公司來說，雖是未上市的家族企業，但公司的保留盈餘將近一○○%，業務的利潤部分亦持續維持高檔，未來的成長令人期待。


    我問他是如何建立起這麼大的企業，他回答：「這與我當秘書的經驗有很大的關係，藉著各種工作，我獲得在地各界人士的信賴，建立起真正的人脈。"如果只是想知道議員秘書怎麼樣，如果只是想增加交換名片的人數，沒有什麼用。'
  - '[PAGE 159]


    必要花上五年的時間，但是對將來要創業的他來說，這五年是必要的歲月。




    緊要關頭可以幫忙應急的人脈，不是見過一面就能形成的。受理地區居民的陳情，盡全力去調解處理，總會獲得回報。透過工作的交流，累積彼此的信賴關係，才會獲得願意提供支援的支持者。


    前些天我與一位投資信託公司的負責人見面，他有三年的國會秘書書經驗。




    三十歲時創業，現在也才第三年，是一位青年才俊。我想他應該二十歲的時候，就已經描繪出十年後自己的模樣，冷靜判斷當下應該做的事吧。


    現在即使在優良企業領高薪，未來也不一定有保障，特別是希望功成名就、懷抱理想的人，不要只捉住眼前的小收穫，應該放眼十年後的豐厚獲利，可能會更有作爲。即使當下沒有成果，先提升自己的技術或資訊能力，建立真正的人脈，未來才有獲得更大利益的可能。從大富豪的人生态度，我深深感覺這就是真理。


    > 現在的幸福就是十年後的利益。'
  - '[PAGE 160]


    # 4  速度可以創造財富


    我的公司也接受不少各界人士前來諮詢有關大富豪取向的事業。曾經有某家醫院來找我諮詢「以富裕階層爲對象的醫療禮賓服務」。這家醫院的老闆本身就是個大富豪。所謂醫療禮賓服務就是依照患者的要求，爲其解決不安和疑問，協助接受正確的診療科別診治。


    此項服務除了必須通曉醫院業務，還要有接待的專業知識，以滿足眼高手高的富裕階層。同時具備專門知識和接待技巧的人才並不多，依照過去的經驗，從一開始規畫課程，培養人才到不亞于高級飯店的程度，大概需要三年。


    但是，這家醫院的老闆卻不想等那麼久，他說：「初期投資花多少都沒關係，我想一個月就搞定。三年等下來，豈不要產生機會損失。」雖然感覺很心急，不過他判斷眼前的成本多花一些，一個月就讓服務上路，這比損失三年可得的利益要划算得多。這正是大富豪們的共通點。他們做任何事都追求速度。'
  - '[PAGE 161]


    比如說，要快速成立新事業，物色有經驗的人就是方法之一。


    這雖然是個節省時間的方法，但是從頭規畫一個事業的體制需要時間，來自各種背景的人齊聚一堂，營造組織的整體感也需要一定的時間。不想浪費時間的大富豪會選擇併購的方法，買下已在這個產業有成績的公司。


    實際上，積極運用併購成功拓展業務的大富豪不在少數：「不是單純買公司而已。藉著併購獲得必要的技術人才，加上通曉事業營運方法的組織，甚至這家公司的顧客，都可以一次到位。要是從頭做起不知道要花幾年，併購就是花錢買快速。」


    失去時間，就是連機會都溜走了。如果大富豪遇到「感覺是好機會」的投資案，即便地點偏遠，還是會取消所有行程，搭著私人飛機前往，就是為了將這潛藏在世界角落的寶貴機會掌握在自己手裡。大富豪之所重視快速，是因為他們總在稍縱即逝的時間中追求最大的機會。


    我有一位客戶在美國經營事業。他很喜歡公司附近一家咖啡店的咖啡。喝一杯由技術超群的咖啡師用嚴選咖啡豆所煮出來的咖啡，是他消除疲憊的良方。'
  - '[PAGE 162]


    # 重視速度，避免機會流失。


    天都要去這家咖啡店報到。據說現在已經有一家分店進駐他的公司了。


    光聽這樣，我們可能會以為「不過是有錢人的作派嘛」，其實不然。不管離得多近，為了喝一杯現煮的咖啡，包含交通的時間最少也要花十五分鐘。他衡量每天去光顧花費的時間和自己的時薪，冷靜判斷請他們開一家自己專用的分店，他可以将時間投注在事業上，會更有效率。


    最近也開始有一些大企業注意到這一點。如果許多員工不惜花十分鐘去附近便利商店買咖啡或飲料，不如在公司裡供應簡單的飲料和點心。抽於浪費時間，就勸導員工戒菸，要求戒菸的最大目的雖然是為了員工的身體健康，卻也很有效地減少員工為了去抽菸而離開座位的時間。


    成立類似事業的公司有很多，成功或失敗有著很殘酷的差別。別人要花三年完成的事，大富豪一個月就搞定，因為他們深知速度就是生財的泉源。'
  - '[PAGE 163]


    # 5 絕不借錢給別人


    大富豪們絕不借錢給別人，但也不會把來借錢的人趕出去，因爲他們不願與人爲敵。那麼，要怎麼辦呢？他們不借錢，而是給錢。例如，有人來找大富豪：「我想成立新事業，但是手邊沒有資金，可以借我三百萬嗎？」大富豪拿出三百萬，也不過問事業內容之類的細節，只說：「這個拿去當本錢，你有錢再還我就好了，我不會催你。」嚴格來講，應該是「無期限貸款」，也沒有借據，很可能也要不回來。


    怎麼會做這麼荒唐的事呢？我曾經問過大富豪，他的回答讓我很意外。「我借他錢，萬一真的還不出來就會想逃跑吧，如果我說『有錢再還』，他就不會逃走，所以總有一天能要回來。」想想他說得有道理。若要對方在「一定期限內還錢」，還不出來就想逃走，但如果是「有錢再還」，就沒有逃的必要性。而且，沒有要求任何擔保又無限期地借錢，對方會對大富豪滿懷感謝，決'
  - '[PAGE 164]


    心有朝一日一定還錢，就會拚命努力。大富豪融通金錢是看得如此長遠。


    有時候對方還沒提出要借錢，大富豪就先拿出錢來了。例如，曾經有一位因故失去財富的朋友來找大富豪。對方什麼都還沒說，大富豪拿出一筆錢說：「這筆錢你拿去東山再起，有錢再還我就好了。」我不明白爲什麼對方都還沒說，他就拿錢出來借，他的回答也令我驚訝：「因爲他先說的話，就是要他借我兩百萬」，大富豪可能會不好意思拒絕，只好勉強自己接受這個數字，爲了避免這種尷尬，才先提出來。自己樂意拿出的金額就不會傷人傷己。這是非常聰明的作法。


    話說回來，大富豪也不是對誰都這麼爽快。先前曾經說過，大富豪那些交情較好的朋友頂多也就二十人左右。他們只和那些如「家族」般彼此信賴的人交往，身邊本來就沒有不想借錢給他的人，或是借錢不還的人。


    > 有錢再還，不催討，比較有可能把錢收回來。'
  - '[PAGE 165]


    # 6


    有錢是人生的修行


    你想成爲有錢人嗎？


    當然，金錢不是一切，但生活中還是有很多事情的確是有錢好解決。每個人都需要最低限度的生活費，想要稍微奢侈一下、享受人生，實現自己的夢想，有錢總是比較容易達成。那麼，擁有大筆財富是什麼樣的狀態？也不是什麼都好，人一有錢就會成爲別人忌妒的對象。


    一位實業家夫人因爲在超市結帳時等太久，便在網絡社群貼文發發牢騷：「不用給我打折沒關係，讓我先結帳吧。」或許她沒有什麼惡意，但知道她有財富的朋友反而都不屑這種行爲。


    擁有許多資產的人，如果稍微有一點引起社會反感的舉動，就會遭受超乎常人的抨擊，最可怕的是失去大家的信任，連朋友或一直以來的支持者也疏遠'
  - '[PAGE 166]


    了。『有錢容易遭受的負面影響』，大富豪對此了然於心。


    我有一位客戶很愛車，擁有好幾台高級車，一般大衆看到的都是較爲普通的车種，他最喜歡的最高等級車種放在地下的秘密車庫中。他的地下停車場連我也沒見過，甚至不知道他還有車子停放在別處，當我忍不住好奇地問他，卻得到這樣的回答：『秘密車庫的事你絕對不要說出來喔。我停放于一個沒有人知道的地方，那裡放的都是我要自己一個人玩的車，我不想讓人家說『那小子專買高級車』。『''


    如果夠有錢，幾乎是想做什麼就做什麼，例如爲求刺激花大筆錢賭博、不顧家人與倩婦虧混。但是過著縱慾的生活就會迷失自己，愛擺闊會引人覬覦龐大的資產，受到各種誘惑的機會也會增加，都不會有什麼好結果。


    正因爲可以隨心所欲，所以更要懂得自律。


    普通人中了彩券得到一大筆錢，人生卻因此而一塌糊塗，這樣的故事不勝枚舉。維持龐大的資產，增加更多的財富，並不是一件簡單的事。


    # 戰勝一切誘惑，隨時抱著自律的堅強意志和覺悟。這就是小有資產與大富'
