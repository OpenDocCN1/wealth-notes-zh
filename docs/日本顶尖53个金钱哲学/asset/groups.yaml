    # 9 重視小信賴，勝過大權威


    大富豪不會因招牌的大小而左右對事物的判斷。例如，一般人要存大筆金額時，多半都會選擇大型銀行，或所謂的巨型銀行，但大富豪們卻比較常找私人銀行或地方銀行、信用金庫等。


    一般人之所以選大型銀行，是因爲感覺大型銀行比較有信用。但是，大富豪選擇銀行的標準並不是看公司的規模，而是自己已被看重的程度。即使擁有一千五百億的資產，在大型銀行頂多被當成部分上市公司，但是一千五百億若拿到信用金庫，連同企業都會被當成貴賓禮遇。


    這對一般人也是一樣，辛苦把錢一點一滴存進大型銀行，就算存了三百萬、六百萬，銀行的贈品頂多是從小包面紙變成盒裝面紙。當我們要辦理房貸或創業貸款時，以爲會比其他存戶得到更好的利率，其實並沒有。若是在小銀行存五百萬就可算是大戶了。此外，銀行對長期的存戶也有較高的信賴。'
  - '[PAGE 135]


    大富豪不選大型銀行而偏好小銀行，還有另一個理由。小銀行比較不會常常換承辦人。我要再說一次，**大富豪做生意看的是人**。他們看的是業務承辦者是否會為自己著想，與看順眼的人長期來往。大型銀行可能因人員調職或跳槽，承辦人大概三年換一次，無法建立長久的關係，所以大富豪比較喜歡小銀行。


    不過，大富豪還是會與大型銀行交易，但是跟著信賴的承辦人跳槽到別人銀行的事也時有所聞。事實上，大型銀行的行員跳槽，連客戶都一起帶走的例子並不少。由此可知，比起公司的權威，有錢的客戶們更重視的是對承辦人的信賴。


    大富豪不以招牌判斷別人的態度，在商場上也是一樣。在異業交流的聚會上看到別人名片的頭銜響亮，是不是就莫名地佩服？大富豪才不管大企業或小企業，他都一視同仁。大富豪知道小公司有更多憑自己實力的人，這是公司'
