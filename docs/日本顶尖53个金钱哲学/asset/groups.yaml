    # 第一章

    ## 大富豪的致富之道


    # **1 不投资会被火烧毁的项目**


    大富豪们对投资各有独到的观点和想法，其中令我感到惊讶的是“不投资会被火烧掉的东西”这一项，要先在脑海中想象投资商品是否“可燃”的意思。富豪说：“即使发生无法预料的灾害或战争，实物可以保存，价值不会有大改变的东西。”


    钞票遇到大火就烧成灰烬，保证价值的国家如果财政破产，钞票也将形同废纸，失去了现有价值，就算不是被烧掉也差不多。回顾世界历史，一国货币贬到一文不值的例子不胜枚举，但是现在实际为这种“万一”做准备的人应该不多吧。


    大富豪总会假设现在使用的货币有一天可能会一文不值，这样的想法不只住在政局不稳国家的大富豪才有，日本富豪也屡根不相信“日圆”。因为即使是相对稳定的日圆也不能掉以轻心，他们对于几乎每天都有人提案的投资企

