    # 9 對住家環境相當講究


    有許多大富豪住在高級住宅區，關東地區的話就是田園調布或松濤一帶，關西則是以蘆屋爲代表。

    如果有人認爲他們想要體面氣派，其實並非如此。大富豪們愛住哪就住哪，資金也很充足，但是還是選擇高級住宅區，其中有著深奧的道理。

    我有一位客戶很早以前就在高級住宅區建了豪宅，據說更早前他就住在同一個社區的高級大樓。當時他雖已小有財產，但還不足以建一棟宅院，只好稍微擺個闊，先搬到這個社區，他說：「住在這裡的人水準不同啊！周圍都是這樣的人，與他們成爲街坊，就可以知道他們平常都聊些什麼，觀察他們的行爲舉止，讓自己沉浸在其中。成爲這個社區的一員就會告訴自己要更加努力，每天接受刺激，自己的水準也漸漸提升上來。」

    我們身邊的生活也有類似的事。例如學校，比起私立高中，選課自由度較'
  - '[PAGE 175]


    低的公立學校每年都有好幾名學生考上門檻超高的大學。這些學校並沒有安排什麼異於其他公立學校的特別課程，教師也是依照各地方政府的規章定期異動，並沒有集結什麼特別優秀的老師。


    到底是哪裡不同呢？這些升學率超高的公立學校從以前就是當地的名校，歷史悠久，培養出重視自主性的校風。因此，懂得自立學生和願意積極用功的學生都會聚集在這所學校，每天接觸這樣的同學，自己的意識也會跟著升高。


    企業也是如此。許多有名的特定企業常有改變社會的創新之舉，這些公司人才輩出，總是追求革新，風氣自由，讓員工發揮所長，沒有人會偷懶摸魚。他們不是一個口令一個動作，而是發揮自己的創意，爲提升技術而努力向上。周圍都是意識高昂的同伴，每天磨練下來，自己的實力也會有所長進。


    家是經營生活基本的地方，我也因爲工作的關係，經常要拜訪高級住宅區，接觸這個區域的氣氛久了，從站姿、用餐、到購物時篩選商品的方法，都會變得不同。我只是來這裡工作，自然而然就會抬頭挺胸，社區的成員每天都'
