    # 序  大富豪最初也只是個普通人


    我在二〇〇八年創辦了私人管家服務公司，專門為「大富豪」提供私人管家服務，從日常生活到公司業務都由我們提供協助，滿足客戶的各種要求。我的客戶大多身價超過十五億，年收一億元以上的頂尖人士，其中不乏擁有數兆資產，或者世界富豪榜上有名的國外大富豪。


    我創業八年來已服務過上百位富豪，也有幸結識數位百位富豪。在此之前，我完全不知道世上有那麼多有錢人，而且他們多數不是繼承家業或資產，而是白手起家致富。有的人自己創業成功，有人投資成功，也有人接收別人公司成功，他們各有致富之道，成為富豪的方法令我嘖嘖稱奇。但是，他們有一個共通點——都是很普通的人。


    我從事這個工作之前，總是以為大富豪和普通人不一樣，應該一般人都


    是這麼想的吧！不少人一聽我是大富豪的私人總管，就會毫不客氣地拿著這種'
  - '[PAGE 9]


    # 老是遲到而被炒魷魚的大富豪


    上班經常遲到的人可說是公司的冗員，但是竟然有早上總是起不來，上班


    刻板印象來問我：「擁有數十億、數百億資產的人，都是像上流階層那種特集合團的吧？」「他們都有特殊才能，躺著就有錢賺吧！」「擁有大筆資產，錢就像滾雪球一樣越來越多，真令人羨慕。」在認識各方大富豪之前，我也有過類似的誤解，後來發現這種印象和實際情形有很大差距。白手起家的富豪幾乎都是出身自普通的家庭，也沒聽過小時候受過什麼特別的教育。學生時代過著很普通生活，多數都經歷過找工作或當上班族，也有人在短短幾年內累積財富，卻感嘆「十五年前日子可苦了」，也有在一般公司待不下去的異類，才成為大富豪的。


    如果我們能找出他們的共通點，應該就是成為大富豪的捷徑了。接下來我就介紹幾個實例。'
  - '[PAGE 10]


    遲到，最後卻成為大富豪的例子。


    大富豪們多半是日出而作且精力充沛的晨型人，我要介紹的這位客戶卻是少見的夜貓子。他的口頭禪就是「早上起不來啊！」因為他愛喝酒，長年熬夜，越晚精神越好的夜貓子大富豪。


    他現在已經年過六十，雖然不再暢飲到宿醉，但年輕時喝過一家又一家可說是家常便飯，跟酒有關的糗事和英勇事蹟更是不盡其數。不過，他的嗜酒貪杯竟也是晉身為大富豪的契機。


    這位客戶來自東北，從技職専門學校畢業後就來到東京，在一家专营大樓設備維修的公司上班，過著極為普通的上班族生活。這段時期他每天晚上都去喝酒，喝到天亮，早上常常因為宿醉而起不來。身為茱烏卻經常中午才上班，一年下來，上司終於受不了，要他不必來了。他說：「公司無預警地就炒我魮魚，一時之間也找不到工作，當時真是窮途末路。我只會做大樓設備維修，一年下來大致掌握了工作內容，想想乾脆自己開公司。當時才二十出頭，天不怕地不怕，沒想到還真是走對了呢！」'
  - '[PAGE 11]


    這位客戶現在倒能像事不關己似地笑說這段往事。不過，這個在失業又走投無路的狀況下所做出的決斷，正是邁向大富豪的第一步，人生真是難以預料。


    一開始他就像一般個人公司那樣，拜託熟人幫忙介紹大樓設備的定期檢修。創業的時候幾乎沒有資金，卻有一樣不同於金錢的巨大財產，那就是每天晚上出去喝酒時所結識的人脈。同業間的人脈就不用說了，加上交遊廣闊，大家想到「他失業有困難」，都紛紛幫他介紹工作。


    此外，他決定創業的時機也是恰到好處，當時日本正處於高度經濟成長期的最高峰，一窩蜂地建設高樓大廈。不久後，生意接踵而來，他一個人幾乎忙不過來，後來雇用幾名工程師，自己更努力接洽生意，業績便蒸蒸日上。


    「我們不是廠商系統，而是獨立公司，所以一開始很辛苦，不過也因爲這樣磨練出技術來。我們甚至可以自己做出維修需要的零件，遇到大問題，都必須自己去解決，創業以來，我已經有十年都沒能去兩天以上的旅行了。」


    公司成立四十餘年，已有上千名員工，分公司、分店遍布全國。他現在仍'
  - '[PAGE 12]


    然每晚出去飲酒作樂，尤其喜歡和員工們喝酒，每到傍晚下班時間，就看他在辦公室找人去喝一杯。他的個性隨和，員工們也都樂意參與。


    愛喝酒，早上沒精神，作爲上班族，他的確是失敗的，但是個性隨和、人面廣，我倒覺得他充分具備了成爲大富豪的資質。


    # 把大學的註冊費和學費都投入創業資金的大富豪


    白手起家的大富豪幾乎都是勤奮努力型的人，其中不少人篤信「腳踏實地」，不過學校的課業又是另一回事。有許多大富豪在學生時期不愛念書。我有一個客戶就是這樣，二十幾歲創業開廣告公司，現在已是身價達數十億的大富豪。


    這位客戶出身自北陸，高中一畢業就希望到東京發展，無奈家人不許他毫無計畫就貿然前往，於是他便報考東京的大學，也如願考上。只是他原本就不愛念書，拿著父母給的註冊費和學費來到東京，竟然沒有去學校註冊，找到房'
  - '[PAGE 13]


    子安頓下來，靠著父母寄來的生活費和每年的學費，開心地過起都市生活。


    不過，也不能一直遊手好閒，他開始在原本就有興趣的廣告業打工。〔一開始盡是些夾報或在電線桿張貼廣告的工作，後來在這行人面廣了，便私下接案子做。漸漸有一些活動企畫之類的大案子，一個人都快忙不過來了，才想說應該可以開個公司。〕


    有想法馬上就付諸行動也是大富翁們的共通點。開始接到大案子後，他便僱用幾名職員，成立了一家小廣告公司，創業資金就是父母寄來的大學註冊費和四年學費。〔我當然對父母保密，他們到現在還相信我乖乖上大學，然後畢業了呢。所以我對家裡謊報學歷。〕看似玩笑話，但經過三十年，這仍是一個把所有親戚都蒙在鼓裡的秘密。


    讓他的公司壯大的秘訣就是他有人人之明，例如把上門推銷商品的推銷員挖角來自己公司的事，就發生好幾次。而且他的大哥性格強烈，很會照顧人，因此深得人心，也懂得將自己不擅長的工作大方的交給下屬，態度誠懇，讓員工很自然地願意接下重擔。'
  - '[PAGE 14]


    雖說他的創業資金是欺騙家人所得，但現在已是個擁有兩百多名員工的老闆，還在東京的高級住宅區田園調布購置豪宅，這樣的成功也算是回報父母的孝行吧。當年的註冊費和學費衍生出來的財富已不下數千倍，不禁讓人想像如果當時他去上大學的話……


    事業或賺錢與在學校的學習實是兩回事，從這些大富豪的經歷來看就能清楚明白。我聽過一位個人資產額排在全球前十名的外國客戶聊起他在學生時代幾乎不念書，還拿父母給的學費去投資。他靠著投資順利增加資產後，爲了得到某家公司便想辦法找上那裡的員工，收購他們手上的股票。「對他們來說，公司的股票不如現金來得有魅力，想到可以小賺一筆，馬上就賣給我了，也多虧了當年國家經濟體制有重大改變。」這些持股竟然超過五○%，他成了公司的老闆，接著更再接再厲增加財富，晉身爲世界頂尖的大富豪。


    成爲大富豪的人，只要手上有一筆錢，即便是註冊費或學費，在他們眼中可能都是可以用來挑戰的資金。這是所謂「金錢就是用來投資」的哲學，他們平時就在腦中思考具體的計劃，只要有錢就可以馬上投入。'
  - '[PAGE 15]


    # 從阿宅玩家變成身價五百億的大富豪


    大富豪們的另一個共通點是，他們都很重視人際關係，在言行舉止上謹慎小心，不得罪人，親切隨和，受位高者賞識，也令下屬仰慕。如此看來，人面廣、交情深似乎正是大富豪們致富的關鍵。有前瞻性的生意點子或是踏實的投资案，的確可以藉著人脈發展。不過，還是有不諧與人交往卻建立了巨富的例子。


    我這位客戶在大學時期曾經一度窩在公寓裡，足不出戶，他迷上有名的家用電視遊樂器遊戲，不去上學，每天窩在房間裡不分晝夜地打遊戲，原本在學校就沒有什麼好朋友，也沒有人會留意到他從未在校園中出現過。


    但是，父母對他畢業了也不去找工作頗有微詞，不再寄生活費，他才发现自己的處境，不能只顧著打遊戲了，必須振作起來。「當時剛好有幾家專線線上交易的證券公司，在偶然的情況下我留意到網路上的股票投資。我手邊的钱就是壓歲錢或打工存下來的，大概有十五萬左右，我拿這些錢當作籌碼，挑戰'
  - '[PAGE 16]


    網絡交易。」


    只要在網絡證券公司開戶，就可以在家進行股票買賣交易，這對不擅與人交往又討厭外出的人是最適合不過的了。當冲客必須在股票市場交易時間內一直坐在電腦前面看行情，若連國外市場都觀察更加不分晝夜了，這對本來就沉迷打遊戲的客戶來說，並沒有造成太大困擾。


    不過投資和打遊戲不同，他是完全外行，十五萬的資金一轉眼少了一半，他才急急忙忙地認真學習投資，就像沉迷遊戲一般，他開始熱衷於投資。他開始投資股票時機剛好搭上一九九九三年以來的科技股泡沫浪潮。急速成長的科技企業股票可賺取龐大的利潤，他拿十五萬積蓄投資，不到一年資產就迅速增加到一億。


    後來他運用這筆資金，讓資產增加到三億，卻在二〇〇一年毅然決然地退出股票交易。「我的體力已經到達極限……那兩年我埋頭研究投資標的，睡眠時間搞不好比沉迷遊戲時還少。」這位客戶退出股票投資後沒多久就發生科技泡沫，進入不景氣時代，而他收山的時機也真是剛好。'
  - '[PAGE 17]


    他怎麼花這些錢？不外乎是一人旅行，或回老家看看朋友。他既沒有車，闊氣的吃喝玩樂也不是他的作派，因為不愛出門，衣服或日常用品幾乎都是網路上解決。後來有一次遇到一個許久不見的朋友，對方問：「既然你那麼會投資，我出錢，你來幫我理財。」因此他又再重啓股票買賣。這次剛好碰上日本景氣回升，一直到二○○八年金融海嘯發生的五年期間，他的資產激增到五百億。


    我們公司一開始為他提供的服務是介紹女傭，當時他才三十出頭。之後每次新年他都會獨自出國旅行，我們便派一名同行管家為他服務，並且充當翻譯。


    現在三十多歲的他，穿著打扮相當樸素，生活也很簡單，我想應該沒有人一眼就看出他是個身價上千億的大富豪。


    這位客戶是因為父母不再寄錢給他，才想到「接下來該怎麼養活自己」。


    如果當時他急病亂投醫，隨便找個兼職，或許就一直是個打工族了。這一切都


    是因為他並非存著一夕致富的野心，而是利用小額利潤的再投資，腳踏實地努'
  - '[PAGE 18]


    力，慢慢累積資產。我想這就像是打遊戲一樣，他只是單純地從投資的勝利中獲得樂趣，對一件事的完全投入，爲他帶來了巨額的財富。

    即便不擅與人交往，也不喜歡拋頭露面，也還是有機會致富，他就是最好的例子。


    # 東大畢學卻找不到工作，後來竟接手公司成為大富豪


    有時候我會問比較熟的客戶：「爲什麼能擁有這麼多財產？」多數富豪都回答我：「是運氣好。」我想起那位年紀輕輕就買股票致富的客戶，他開始投資的時候、中途一度暫停，後來又再度進場交易，事後回想起來，真的算「運氣好」。


    但是，說自己成功的祕訣是「運氣」的大富豪們，隨後又必定異口同聲地補充：「每個人都會遇到好運和機會，許多人都沒看出來，或是運氣來了也因為沒有做好準備而錯過。任何選擇都一定有風險，覺悟和決心也是必備的。'
  - '[PAGE 19]


    # 如果成為大富豪有祕訣，應該就是培養不放過好運的眼力，平時做好充分準備，還有覺悟。


