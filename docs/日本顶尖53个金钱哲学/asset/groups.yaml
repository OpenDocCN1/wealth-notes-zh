    # 11 信任的都是親戚或死黨


    大富豪們都一定有「代理人」。所謂代理人就是在富豪忙碌時，有權幫大富豪在公事上做出決定的人。代理人通常是大富豪的親戚，或是從幼稚園、小學、中學都在一起，超過三十年交情的死黨。


    說到大富豪的代理人多是親戚或死黨的理由，這些人不太可能背叛大富豪。說穿了，他們與大富豪並非是一對一的關係。例如大富豪的叔伯或舅舅，就是父母任一方的兄弟，叔伯如果闖了什麼禍会受到全家族的指責。親戚是切也切不斷的關係，所以他們不會無端要辭職，也不能圖謀不軌做出背叛的事。


    從小一起長大的朋友也一樣，從幼稚園時期就常來家裡玩，彼此多半是兩家人的交流，有什麼事也會馬上傳到父母耳裡。小孩如果闖禍，父母必須出面解決，有這一層交錯的人關係就無法作怪。換句話說，親戚和死黨包含了周圍的人際關係，形成一個牢牢的結，大富豪就是信賴這樣的人。'
  - '[PAGE 141]


    不只代理人，在公司的經營上，由親戚任職副社長或董事等要員的例子也不少，這就是所謂家族經營。家族企業的经营基礎穩固，即便發生困難，親戚間也會團結一致，一同度過難關。


    假設公司資金周轉困難，如果是親戚，甚至可以商量一段期間不支薪。我的客戶中也有人經歷過創業初期經營困難，付不出薪水給親戚的窘境。據說他的叔父看公司如此困難便主動說：「這段期間我就不支薪了。」將近兩年都沒領薪水。但是叔父自己也要生活，所以白天在别的公司上班，晚上和周末到大富豪的公司幫忙。大富豪的太太也是每天理所當然地做白工，這絕非易事，正因為是親人才願意「不支薪也要幫到底」。


    長大後結交的朋友就不一樣了。遇到聊得來又志氣投合，利害關係也一致的朋友便一起創業，這樣的例子時有所聞，很多到後來因爲金錢問題起爭執，沒幾年就拆夥了。


    有人認爲若是賺錢就不會有金錢糾紛，但是設備投資上的開銷或是薪水的分配等，很可能有意見衝突，萬一方索性辭職，公司也只好解散。另外，也有'
  - '[PAGE 142]


    公司不賺錢，雙方互相指責，最後導致感情破裂絕交的例子。


    創業最初的一、兩年不能保證有利潤，就算不是做白工，也可能付不出約定的薪水，這樣的狀況下，能否不忘初衷一起吃苦將決定公司的存廢。大富豪非常了解這種事，在創業的時候，選擇可以同甘共苦的人，成功之後就指定他當代理人。


    親戚和從小長大的死黨不會背叛。


