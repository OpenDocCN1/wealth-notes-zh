    下面我要教给你三个方法，你可以通过平常和孩子一起练习，帮助孩子掌握社交主动权，并且做到得体地社交。不管是内向还是外向的孩子，这些方法都很管用。


    # 方法一：传球游戏


    教给慢热型的内向孩子如何不冷场，自来熟的外向型孩子如何不夸夸其谈招人烦，传球游戏就是一个好方法。


    我平时在家里是这么跟孩子玩的：


    我们一般面对面站着，相隔两米左右，我手里拿着一个网球。


    我先提一个问题，比如：“你喜欢哈利·波特的书吗？”然后我把球扔给他。


    如果孩子只是简单地回答：“喜欢”，那么球就只能停在他手里，不能再传给我。


    但是如果他说：“喜欢，因为这本书很有趣，我喜欢哈利·波特和伏地魔斗争的故事”，那么他就可以把球再传给我。


    通过上面的例子，想必你也发现了这个游戏的核心在于，一方提出的问题，另一方的回答必须深入、具体，能给提问者一些新的由头来提出更多的问题，让谈话可以继续下去，球才能来回传递。缺乏内容的对话，或者不着边际的闲聊都不能把球传递下去。


    这个游戏一共有四个要点：'
  - '[PAGE 20]


    **要点一，** 小孩子一般很快就能掌握游戏规则，但刚开始玩的时候，也容易卡壳，不知道该怎样接话，这时你要注意启发他。


    比如，还是上面的场景。我接着问，“你最喜欢书中哪些人物？”孩子回答：“哈利·波特和赫敏。”我会说：“这样的话，我就没法问出下一个问题，球又不能传给我啦……说说你为什么喜欢哈利·波特和赫敏吧？”孩子就会认真想想，然后回答：“我喜欢哈利·波特，因为他很勇敢。我喜欢赫敏是因为她聪明机智，又漂亮。那么，你最喜欢谁呢？”看，这样回答就很赞了。


    **要点二，** 你要使用一些话术，不断鼓励孩子把对话进行下去。


    比如“真棒，我喜欢你的回答。”或者“这真是一个好的开始，这个话题真有意思。”或者“太好了，我们进行了10分钟的传球游戏了，都没停过。”


    **要点三，** 你可以进一步鼓励孩子开启新的话题。


    比如，“妈妈，你今天过得开心吗？”“爸爸，为什么我们很久都没去动物园了？”通过这样的一问一答，一家人交换对过去发生的事、家庭未来计划等的看法，很有点“真心话大冒险”的意思，非常有趣。


    **要点四，** 你要寻找恰当的时机，让孩子明白传球游戏在生活中的意义。


    等到孩子比较熟练地掌握了传球游戏，我会在他们状态不错的时候，提示以前发生过的和朋友或其他成年人的对话场景。'
  - '[PAGE 21]


    比如有一次我跟老大说：“记得今天下午张阿姨邀请你去她家和她儿子小明玩，在吃饭的时候，她问你玩得开不开心？她是想跟你开始一个对话。但你只是说：开心。你觉得这样的球能扔回给她吗？”


    这样，孩子就明白我的意思了，“球”——也就是话题，停在了他的手中，游戏就没法进行下去了。然后我们就开始讨论他应该怎么回答，才能把“球”再传出去。


    # 方法二：赞美游戏


    内向的孩子观察能力强，善于分析，我们不妨利用这个优势，让孩子主动寻找他人的亮点，并加以赞美。


    外向型的孩子容易更多地关注自己，这个游戏可以让他们学习观察别人，关注别人，分享自己的赞美给他人。可以作为家庭会议中一个常规环节，每周都可以练习。


    我们家一般是在周末的晚餐后做这个游戏。到了吃甜点的时间，全家坐在餐桌前，每个人都要说出挨着你的下一位在这一周内值得表扬的事情。


    比如从我的小儿子亚当开始，他要告诉大家他从哥哥亚力身上发现的亮点，他说：“哥哥在听说我要做手术的时候，很关心我，跑过来安慰我，说可怜的亚当，不要害怕，我们都会一直陪在你身边。”'
  - '[PAGE 22]


    哥哥听了很高兴，拍了拍亚当的肩膀，然后看了看坐在旁边的我，说：“妈妈很善于启发别人，她的学生这周跟她说因为上了妈妈的课，改变了自己的生活。”


    我说：“亚力，原来妈妈和爸爸说话的时候，你都注意听了，谢谢你赞美我。这周我注意到爸爸每天晚上都给我们打电话，我觉得他出差那么辛苦，还想着每天和你们睡前聊天，值得表扬。”


    轮到先生了，他看着亚当说：“亚当上一周承诺他会收拾玩具房，这周他果然做得不错。承诺过的事情就负责做好，赞一个。”


    你看，这样的赞美游戏除了鼓励孩子发现家人身上的优点，还让家庭气氛更融洽、更活跃了。


    其实，除了关注家庭成员，你还可以让孩子注意观察周围的人或者同学的优点。


    我有时会在孩子吃完早餐上学之前，给他们留一个挑战作业。要求他们当天去观察别人做得好的地方，并真诚地赞美一个同学或者老师。


    这种游戏似的挑战，孩子们很喜欢。因为经常赞美别人，他们也时常会得到他人的正面回应。回家后，他们还会兴高采烈地汇报给我听，说自己是'
  - '[PAGE 23]


    赞美他人的训练除了让孩子学会关注他人的优势，见贤思齐外，还让他们具备了一个社交优势，就是赢得别人的好感。因为任何人都希望自己被关注，善意地关注他人，就会赢得对方的好感。


    # 方法三：邀请其他孩子来自己家玩


    通过邀请其他孩子来自己家玩，占据主场优势，内向孩子会更主动积极，外向孩子也不容易失礼。


    内向的孩子更善于一对一交往，你可以每-周或每两周让孩子约一个要好的小朋友到家里来玩。外向的孩子你就可以同时邀请几个小朋友一起来玩。


    因为是在自己家，内向孩子对环境更熟悉，会更积极、放松，外向孩子则会把注意力放在跟别的小朋友互动上，而不是因为对环境好奇、兴奋而翻箱倒柜，上蹿下跳的。


    你可以跟孩子一起提前准备好要玩的游戏，比如-般男孩子喜欢枪战，搭乐高，或者到户外玩球；女孩子喜欢玩过家家，做手工，画画等等。


    小主人要为客人提供几个不同的选项，充分的准备会让内向的孩子觉得更踏实，也能从对活动的掌控中获得更多的乐趣和自信。


    对外向孩子来说，准备好要玩的游戏，也能提前给他们建立规则和边界意识，防止游戏过程中注意力不集中或者有不合适的举止行为发生。'
  - '[PAGE 24]


    在这个过程中，家长最好不要干预孩子之间的游戏。因为孩子是主人，他需要对如何跟客人互动，如何照顾好客人的需要负起责任。哪怕结果是他們各玩各的，你也不必担心。


    等到活动结束后，送走了客人，你再跟孩子做个“采访”，让他讲一讲今天为什么玩得很开心或者不太开心，下一次打算邀请什么样的小伙伴。你还可以跟孩子讨论小客人身上有哪些亮点或特长，有什么可以学习的地方。


    需要提醒你的是，内向的孩子容易在与人际交往中感到刺激过度，需要通过独处来恢复精力，所以每次游戏的持续时间不要太长，通常一个小时之内比较好。社交活动也不要安排得太频繁，最多一周一次。让孩子有足够的时间在家里休息，给自己充电。


    而对外向的孩子，你要特别注意他们是否能够尽到地主之谊，关注和照顾到小客人的需要。


    # 本讲小结


    今天我们讲了内、外向孩子在社交习惯上的区别。


    我们还分享了触发孩子社交主动性和得体社交的三个方法，分别是：通过传球游戏练习一对一的对话；通过赞美游戏寻找别人身上的亮点；通过邀请小伙伴到家里玩，来掌握社交主动权。'
  - '[PAGE 25]


    # 3. 帮孩子打开自我的三个场景


    ![](img/f7924a16eadda2b2ba9acbb62108f604_25_0.png)


    康妮


    2018-06-28 12:13:03


    3. 帮孩子打开自我的三个场景


    建议 WiFi 环境下播放


    不知道你有没有这样的体会？带孩子参加一些社交活动，有的孩子比较紧张，常常躲在角落或是大人身后，对周围事物反应冷淡；有的孩子比较兴奋，叽叽喳喳说个没完，要么干脆直接闯进别人的游戏中，不顾他人的感受。


    成年人的社交讲究第一印象，这对孩子来说也是一样。太安静腼腆的孩子，不太有存在感；太活泼闹腾的孩子，显得不懂规矩，没有分寸感。不论哪种情况，都难以被其他人接纳，更别说受欢迎了。


    也许你会说，孩子的性格就是如此，你也没办法啊。那你就错了，问题不在于孩子的天性怎样，而是他们在参与社交活动时，有没有打开自我，能不能有意识地调整自己去适应环境。'
  - '[PAGE 26]


    也就是说，不论他们表现出来的是冷淡还是热情，如果只是凭着本能或直觉，下意识地对周围环境做出反应，那么，他们内在的自我就始终是封闭的，外在的表现也会跟周围环境格格不入。


    想让孩子更好地融入陌生环境，可以遵照由近到远的原则，从三个方面循序渐进地加以改进：


    +   第一，在家庭内部给孩子安全感。帮他们放下戒备心，保持好奇和自信。


    +   第二，培养对周围人的同理心。懂得换位思考的孩子，更容易根据周围人的反应，及时纠正自己的言行。


    +   第三，在陌生的环境下，教会孩子在社交活动中主动介绍自己，以寻找和陌生人的共同点。


    针对这三个方面，接下来我要推荐三个方法，来帮助孩子在社会活动中更好地打开自我。


    # ## 一、家庭内部：定期举行家庭会议


    定期召开家庭会议，建立充满爱和信任的沟通关系。


    作为成年人，你可能挺不爱开会的。但如果把这种有仪式感的活动引入家庭，还是很有魔力的。


    好奇是孩子的天性，只不过到了不太熟悉的环境，他们会因为紧张或者恐惧，而缩回到自己的世界里。为了帮助孩子消除压力，尽快放松下来，你'
  - '[PAGE 27]


    跟孩子之间，是否能建立有深度、充满信任的沟通关系，就显得非常重要了。


    当你的陪伴能让孩子感觉安心，当孩子愿意把自己的尴尬窘迫一五一十地说给你听时，你的安慰和鼓励才会有效果。


    为此，我建议定期召开家庭会议，最好是每周一次。让孩子知道这是对所有家庭成员都很重要的活动，一家人围在一起，开心地分享故事，玩游戏，吃东西的温暖氛围，更容易让孩子打开内心。


    家庭会议每次都要有一个讨论议题，比如说礼貌、尊重、感恩、友情、家庭预算等等。话题的选择由包括孩子在内的全家人轮流负责。讨论时，可以围绕这个话题，分享上一周每个人遇到哪些有趣或者糟糕的事情。


    分享时要注意两点：一是平等的姿态，二是自然的语气。


    1. 什么是平等的姿态呢？


    比如，告诉孩子你工作上的一些事情、家庭收支计划等，让他们知道自己是重要的家庭成员之一，你尊重他们的意见和建议，你对他们是开诚布公，没有秘密的。


    再举个例子。你可以主动分享自己的糗事，并发起讨论。'
  - '[PAGE 28]


    比如，“昨天跟一个客户谈判，我紧张得手心全是汗。谁能告诉我，应该怎么办？”让孩子看到你不回避问题、主动寻求理解和帮助的态度。同时，让孩子明白家庭是完全可以信赖的地方，遇到困难，要先分享，再分担。


    你的神态越自然，语气越轻松，孩子越能感受到，主动提出并讨论问题不是批评打击，而是一种祝福和鼓励。


    这样，当孩子日后遇到类似的困境，也会很自然地跟你分享、商量，而不是把糗事或秘密藏在心里，害怕受到惩罚，或者觉得难为情。


    # ## 二、学会互动：做故事人物的心理分析


    分析故事人物的心理，培养孩子的同理心。


    相信在很多家庭，亲子阅读、睡前故事，已经成为你跟孩子之间的一个日常沟通必不可少的重要内容。一些经典的绘本或故事，蕴含着人际关系和价值取向的道理，是很好的社交启蒙工具。


    比如《绿野仙踪》就是一个关于成长和友谊的故事，温暖又充满想象力。


    在跟孩子一起读这个故事的时候，你可以和孩子分析稻草人、铁皮人、狮子等角色的心理活动和性格特点，引导孩子说出人和人之间的差异，相互沟通的重要性，提出如何克服困难，战胜恐惧的方法等。


    提示你注意两个细节：'
  - '[PAGE 29]


    细节一：给孩子挑选故事时要有针对性，要针对孩子目前可能存在的问题，选择有启发性的内容。


    你可以用故事里的人物、场景，启发孩子换位思考。比如这样做为什么不对，这个角色为什么不受欢迎，有没有更好的解决办法，等等。


    细节二：在讲故事的时候不要过多点评，也不要每次都把话题拉回到当下的场景。


    让孩子觉得你是在借讲故事之名给他讲道理，时间长了会让他们感到扫兴，甚至产生逆反的情绪。


    教育是潜移默化的，我们要做孩子成长路上的拉拉队长，而不是裁判。对孩子多一点耐心，让他们自己从故事发现问题，主动跟你讨论，这样他们才能由内而外地持久转变。


    # 三、陌生环境：帮孩子准备有亮点的自我介绍


    知道了在家庭中怎么跟孩子建立爱和信任的沟通关系，跟周围人互动之前学会换位思考后，接下来你可以教给他们一些具体的方法，帮助他们在陌生的社交环境中，大方得体地展现自己。


    一个简单易用的办法是准备一个 30 秒钟的自我介绍，让别人知道你是谁，有什么爱好、特长，先积极地展示自己，再慢慢寻找跟别人的交集。'
  - '[PAGE 30]


    下面我就从自我介绍的内容、语气、眼神和身体语言四个方面，来谈谈如何帮孩子准备一个精彩的自我介绍。


    # 1. 内容


    在30秒内，孩子除了讲出自己的名字，还要强调两个自己的亮点和至少一个可能和别人建立链接的共同点。


    说出自己的亮点，是为了给对方留下深刻印象，让对方记住你。找到和其他人的共同点，可以引起他人的好感，让对方想主动和你交朋友。


    那么，两个亮点怎么找？


    每个孩子都有亮点。比如自己名字的意义，在学校最喜欢的科目，感兴趣的活动等等。还记得第一讲里我们提到的优势游戏吗？你可以平时在家训练孩子发掘自己的优势，再从里头找亮点，孩子会更自信。


    找到亮点之后，怎么说出来，用什么样的语言说出来，是有讲究的。


    如果孩子只是说“我对花样滑冰有兴趣”，这个说法就不够吸引人。


    如果说：“我特别喜欢花样滑冰，每周都会花几个小时练习，一滑上冰，时间过得飞快，每次都舍不得走。”这样介绍，特点就突出了，容易被别人记住。


    再比如孩子说：“我喜欢画画。”这样听的人也印象不深。'
  - '[PAGE 31]


    但如果改成：“我特别喜欢画油画，画画让我有耐心，帮我克服完美主义。我的作品已经在少年宫得过奖了。”这样一说，会让人觉得画画是孩子很重要的一个亮点。


    除了亮点，跟其他人的共同链接点又该怎么样找呢？


    方法是，刻意提示孩子从自我介绍的场合和听众入手，孩子只要说出一个跟场合或者听众相关的共同点就可以了。


    如果是在一个新的班级介绍自己，那么孩子最喜欢的科目、电子游戏、食物、儿童电影等等，就可能是链接点。如果是去参加一个才艺表演，孩子可以说说自己最擅长的才艺是什么，最喜欢的艺术家是谁，平时喜欢什么活动，这些都可能是链接点。


    # 2. 语气


    没必要在介绍自己的时候过分谦虚，说“我其实没做什么......”“我没有什么特别的地方......”等等。


    提醒孩子，自我介绍时，一定要使用强烈的、正面的、肯定的词语。


    比如“我非常喜欢......”“我热爱......”“我很擅长......”“我特别希望......” 这样才能让别人感受到你的热情和自信。一个情绪饱满、意志坚定的人，更容易获得别人的尊重和信任。


    # 3. 眼神'
  - '[PAGE 32]


    告诉孩子，在做自我介绍的时候，眼睛要看着其他人。


    如果人很多，就采取环视，从左看到右，或者在人群中找到几个点，然后轮流看着那几个人，这些目标点应该是面带笑意的人，温暖正面的回应能让孩子更放松，受到鼓励。


    # 4. 身体语言


    讲话时，尽量让身体舒服、舒展，让自己的身体和四肢，占用更大的空间，这样可以增加信心和气场，让听的人感受到你是开放的和邀请性的。


    千万不要把身体四肢缩起来，这样会显得自信心不足。


    说了这么多，相信你已经发现了，在短短 30 秒钟内既要说出亮点也要说出链接点，还要注意语气、眼神、身体语言，这个要求对成年人来说已经不低了，何况大部分孩子还不具备张嘴就来的能力，所以你要帮孩子提前准备。


    在家帮孩子准备自我介绍的时候，可以让孩子站在镜子前练习，也可以帮他录像，一起回放录像，来纠正表情和手势。


    反复练习，直到孩子能够流利自信地介绍自己。然后，让孩子把这样的自我介绍，变成他和别人建立链接的随时可用的一个工具。


    我还要提醒你的是，孩子的自我介绍，不是只有一个版本。带他出门的时候，针对今天特定的场景或者人，你们可以讨论 5 分钟，排练一下。'
  - '[PAGE 33]


    # 本讲小结


    这一讲我教了你三个帮助孩子打开自己的场景，分别是：定期举行家庭会议，搭建爱和信任的亲子关系；分析故事人物，激发孩子的同理心，以及准备一个 30 秒的有亮点和链接点的自我介绍。'
  - '[PAGE 34]


    # 4. 帮孩子跟同龄人交朋友


    我们知道，人和人之间有共同的兴趣爱好，才能聊到一起，玩到一块儿。但小朋友之间的交往，可不像大人社交时那样，有较强的主动性和目标感。


    比如说，大人社交时，先聊聊天气、交通，再分享信息，然后判断对方是值得继续交往。而孩子是单纯而又直接的，如果他对你不感兴趣，就会扭头黏着爸爸妈妈，或者干脆自己玩自己的。


    遇到跟龄人聊天冷场的情况，社交能力还不错的孩子，会寻找合适的时机礼貌地退出交谈。


    而受欢迎的孩子，会试着了解对方，在寻找共同点、尊重差异点的基础上，主动开启新的话题，懂得欣赏别人，也让别人喜欢自己。


    这是怎么做到的呢？


    我的秘诀是多做客，鼓励你的孩子去别人家做客，以及邀请别的孩子来你家做客。这就要让孩子扮演好两个角色：“爱分享的主人”和“受欢迎的客人”。


    # 一、怎么做爱分享的主人


    先说第一个角色，别的孩子来你家的时候，做“爱分享的主人”。


    具体怎么做呢？你可以教孩子玩画布游戏。


    当孩子邀请其他小朋友到家里来玩的时候，你可以先准备几张大孩子可以躺在上面的纸或画布，如果是有颜色的更好。'
  - '[PAGE 35]


    **第一步**，让每个小朋友选一张纸，然后轮流躺在自己的纸上。让其他小朋友帮忙，用笔勾勒出躺在纸上的身体外形。


    **第二步**，等所有小朋友都拿到了自己的轮廓画像，再让他们自己动手，在画像上，写出自己喜欢的东西。


    +   - 在嘴巴的位置，写出自己喜欢吃的东西和喜欢聊的事情。

    - 在胸口，写上手的人。

    - 在手上，写自己喜欢用手玩的东西。

    - 在腿和脚上，写喜欢用脚玩的东西和做的事。


    如果没有那么大的纸，让孩子们在一张 **A4** 纸上画出自己的自画像也可以。


    如果孩子年纪小，还不会写字，那就随便画画，只要其他小朋友能看明白就行。一个人画，其他人猜，也很有趣。


    **第三步**，等大家都写好或画好了，把这些图画展示出来，让每个孩子对照其他人的信息，找找有哪些跟自己相似或不一样的地方，就像在玩寻宝游戏。


    三步下来，通常孩子们都会玩得很开心。最重要的是，试着让你的孩子作为“小主人”去主导这个游戏，比如宣布游戏规则，把握各环节的时间、节奏等。


    让他在游戏中明白两件事：


    第一，交朋友要先找那些共同点。找到共同点之后，话匣子就打开了。以共同点为基础，更容易建立友谊。'
  md: "\n2. 如果他感觉不舒服，可以提前退场或者到一个安静的角落做自己喜欢的事。\n\n> 触发内向孩子的社交主动性应该从家庭内部开始做起，从家长的影响和鼓励开始，再邀请周围的人参与，帮孩子慢慢打开社交圈。\n\
    \n## 问题二：外向孩子，怎样设立社交边界？\n\n外向的孩子热情、健谈、精力旺盛，他们本身需要从和他人的交往中获得能量和满足感，这样的孩子也容易获得家长和社会环境的认同。\n\
    \n但是不是他们在社交上就没有问题了呢？当然不是，外向孩子很容易以自我为中心，过分关注自我表现，有时会令人烦，有时会让人感到热情过度，甚至会惹人反感。\n\n\
    外向孩子的家长要注意两点：\n\n- 第一：在家立规矩。孩子基本的礼貌和教养一定要在家从小培养，你要教会他基本的礼貌和礼仪；\n- 第二：出门划界限。跟孩子约定，注意观察所在环境和周围人的表现，关注别人的感受。一旦孩子有热情过度或反应过激的言行，家长有权力立刻制止他们，甚至是带他们离开现场。\n\
    \n下面我要教给你三个方法，你可以通过平常和孩子一起练习，帮助孩子掌握社交主动权，并且做到得体地社交。不管是内向还是外向的孩子，这些方法都很管用。\n\n\
    ### 方法一：传球游戏\n\n教给慢热型的内向孩子如何不冷场，自来熟的外向型孩子如何不夸夸其谈招人烦，传球游戏就是一个好方法。\n\n我平时在家里是这么跟孩子玩的：\n\
    \n我们一般面对面站着，相隔两米左右，我手里拿着一个网球。\n\n我先提一个问题，比如：“你喜欢哈利·波特的书吗？”然后我把球扔给他。\n\n如果孩子只是简单地回答：“喜欢”，那么球就只能停在他手里，不能再传给我。\n\
    \n但是如果他说：“喜欢，因为这本书很有趣，我喜欢哈利·波特和伏地魔斗争的故事”，那么他就可以把球再传给我。\n\n通过上面的例子，想必你也发现了这个游戏的核心在于，一方提出的问题，另一方的回答必须深入、具体，能给提问者一些新的由头来提出更多的问题，让谈话可以继续下去，球才能来回传递。缺乏内容的对话，或者不着边际的闲聊都不能把球传递下去。\n\
    \n这个游戏一共有四个要点：\n\n- **要点一**，小孩子一般很快就能掌握游戏规则，但刚开始玩的时候，也容易卡壳，不知道该怎样接话，这时你要注意启发他。比如，还是上面的场景。我接着问，“你最喜欢书中哪些人物？”孩子回答：“哈利·波特和赫敏。”我会说：“这样的话，我就没法问出下一个问题，球又不能传给我啦……说说你为什么喜欢哈利·波特和赫敏吧？”孩子就会认真想想，然后回答：“我喜欢哈利·波特，因为他很勇敢。我喜欢赫敏是因为她聪明机智，又漂亮。那么，你最喜欢谁呢？”看，这样回答就很赞了。\n\
    - **要点二**，你要使用一些话术，不断鼓励孩子把对话进行下去。比如“真棒，我喜欢你的回答。”或者“这真是一个好的开始，这个话题真有意思。”或者“太好了，我们进行了10分钟的传球游戏了，都没停过。”\n\
    - **要点三**，你可以进一步鼓励孩子开启新的话题。比如，“妈妈，你今天过得开心吗？”“爸爸，为什么我们很久都没去动物园了？”通过这样的一问一答，一家人交换对过去发生的事、家庭未来计划等的看法，很有点“真心话大冒险”的意思，非常有趣。\n\
    - **要点四**，你要寻找恰当的时机，让孩子明白传球游戏在生活中的意义。等到孩子比较熟练地掌握了传球游戏，我会在他们状态不错的时候，提示以前发生过的和朋友或其他成年人的对话场景。比如有一次我跟老大说：“记得今天下午张阿姨邀请你去她家和她儿子小明玩，在吃饭的时候，她问你玩得开不开心？她是想跟你开始一个对话。但你只是说：开心。你觉得这样的球能扔回给她？”这样，孩子就明白我的意思了，“球”——也就是话题，停在了他的手中，游戏就没法进行下去了。然后我们就开始讨论他应该怎么回答，才能把“球”再传出去。\n\
    \n### 方法二：赞美游戏\n\n内向的孩子观察能力强，善于分析，我们不妨利用这个优势，让孩子主动寻找他人的亮点，并加以赞美。\n\n外向型的孩子容易更多地关注自己，这个游戏可以让他们学习观察别人，关注别人，分享自己的赞美给他人。可以作为家庭会议中一个常规环节，每周都可以练习。\n\
    \n我们家一般是在周末的晚餐后做这个游戏。到了吃甜点的时间，全家坐在餐桌前，每个人都要说出挨着你的下一位在这一周内值得表扬的事情。\n\n比如从我的小儿子亚当开始，他要告诉大家他从哥哥亚力身上发现的亮点，他说：“哥哥在听说我要做手术的时候，很关心我，跑过来安慰我，说可怜的亚当，不要害怕，我们都会一直陪在你身边。”\n\
    \n哥哥听了很高兴，拍了拍亚当的肩膀，然后看了看坐在旁边的我，说：“妈妈很善于启发别人，她的学生这周跟她说因为上了妈妈的课，改变了自己的生活。”\n\n我说：“亚力，原来妈妈和爸爸说话的时候，你都注意听了，谢谢你赞美我。这周我注意到爸爸每天晚上都给我们打电话，我觉得他出差那么辛苦，还想着每天和你们睡前聊天，值得表扬。”\n\
    \n轮到先生了，他看着亚当说：“亚当上一周承诺他会收拾玩具房，这周他果然做得不错。承诺过的事情就负责做好，赞一个。”\n\n你看，这样的赞美游戏除了鼓励孩子发现家人身上的优点，还让家庭气氛更融洽、更活跃了。\n\
    \n其实，除了关注家庭成员，你还可以让孩子注意观察周围的人或者同学的优点。\n\n我有时会在孩子吃完早餐上学之前，给他们留一个挑战作业。要求他们当天去观察别人做得好的地方，并真诚地赞美一个同学或者老师。\n\
    \n这种游戏似的挑战，孩子们很喜欢。因为经常赞美别人，他们也时常会得到他人的正面回应。回家后，他们还会兴高采烈地汇报给我听，说自己是赞美他人的训练除了让孩子学会关注他人的优势，见贤思齐外，还让他们具备了一个社交优势，就是赢得别人的好感。因为任何人都希望自己被关注，善意地关注他人，就会赢得对方的好感。\n\
    \n### 方法三：邀请其他孩子来自己家玩\n\n通过邀请其他孩子来自己家玩，占据主场优势，内向孩子会更主动积极，外向孩子也不容易失礼。\n\n内向的孩子更善于一对一交往，你可以每周或每两周让孩子约一个要好的小朋友到家里来玩。外向的孩子你就可以同时邀请几个小朋友一起来玩。\n\
    \n因为是在自己家，内向孩子对环境更熟悉，会更积极、放松，外向孩子则会把注意力放在跟别的小朋友互动上，而不是因为对环境好奇、兴奋而翻箱倒柜，上蹿下跳的。\n\
    \n你可以跟孩子一起提前准备好要玩的游戏，比如一般男孩子喜欢枪战，搭乐高，或者到户外玩球；女孩子喜欢玩过家家，做手工，画画等等。\n\n小主人要为客人提供几个不同的选项，充分的准备会让内向的孩子觉得更踏实，也能从对活动的掌控中获得更多的乐趣和自信。\n\
    \n对外向孩子来说，准备好要玩的游戏，也能提前给他们建立规则和边界意识，防止游戏过程中注意力不集中或者有不合适的举止行为发生。\n\n在这个过程中，家长最好不要干预孩子之间的游戏。因为孩子是主人，他需要对如何跟客人互动，如何照顾好客人的需要负起责任。哪怕结果是他們各玩各的，你也不必担心。\n\
    \n等到活动结束后，送走了客人，你再跟孩子做个“采访”，让他讲一讲今天为什么玩得很开心或者不太开心，下一次打算邀请什么样的小伙伴。你还可以跟孩子讨论小客人身上有哪些亮点或特长，有什么可以学习的地方。\n\
    \n需要提醒你的是，内向的孩子容易在与人际交往中感到刺激过度，需要通过独处来恢复精力，所以每次游戏的持续时间不要太长，通常一个小时之内比较好。社交活动也不要安排得太频繁，最多一周一次。让孩子有足够的时间在家里休息，给自己充电。\n\
    \n而对外向的孩子，你要特别注意他们是否能够尽到地主之谊，关注和照顾到小客人的需要。\n\n### 本讲小结\n\n今天我们讲了内、外向孩子在社交习惯上的区别。\n\
    \n我们还分享了触发孩子社交主动性和得体社交的三个方法，分别是：通过传球游戏练习一对一的对话；通过赞美游戏寻找别人身上的亮点；通过邀请小伙伴到家里玩，来掌握社交主动权。\n\
    \n## 3. 帮孩子打开自我的三个场景\n\n![](img/f7924a16eadda2b2ba9acbb62108f604_25_0.png)\n\n\
    康妮\n\n2018-06-28 12:13:03\n\n3. 帮孩子打开自我的三个场景\n\n建议 WiFi 环境下播放\n\n不知道你有没有这样的体会？带孩子参加一些社交活动，有的孩子比较紧张，常常躲在角落或是大人身后，对周围事物反应冷淡；有的孩子比较兴奋，叽叽喳喳说个没完，要么干脆直接闯进别人的游戏中，不顾他人的感受。\n\
    \n成年人的社交讲究第一印象，这对孩子来说也是一样。太安静腼腆的孩子，不太有存在感；太活泼闹腾的孩子，显得不懂规矩，没有分寸感。不论哪种情况，都难以被其他人接纳，更别说受欢迎了。\n\
    \n也许你会说，孩子的性格就是如此，你也没办法啊。那你就错了，问题不在于孩子的天性怎样，而是他们在参与社交活动时，有没有打开自我，能不能有意识地调整自己去适应环境。\n\
    \n也就是说，不论他们表现出来的是冷淡还是热情，如果只是凭着本能或直觉，下意识地对周围环境做出反应，那么，他们内在的自我就始终是封闭的，外在的表现也会跟周围环境格格不入。\n\
    \n想让孩子更好地融入陌生环境，可以遵照由近到远的原则，从三个方面循序渐进地加以改进：\n\n- 第一，在家庭内部给孩子安全感。帮他们放下戒备心，保持好奇和自信。\n\
    - 第二，培养对周围人的同理心。懂得换位思考的孩子，更容易根据周围人的反应，及时纠正自己的言行。\n- 第三，在陌生的环境下，教会孩子在社交活动中主动介绍自己，以寻找和陌生人的共同点。\n\
    \n针对这三个方面，接下来我要推荐三个方法，来帮助孩子在社会活动中更好地打开自我。\n\n### 一、家庭内部：定期举行家庭会议\n\n定期召开家庭会议，建立充满爱和信任的沟通关系。\n\
    \n作为成年人，你可能挺不爱开会的。但如果把这种有仪式感的活动引入家庭，还是很有魔力的。\n\n好奇是孩子的天性，只不过到了不太熟悉的环境，他们会因为紧张或者恐惧，而缩回到自己的世界里。为了帮助孩子消除压力，尽快放松下来，你跟孩子之间，是否能建立有深度、充满信任的沟通关系，就显得非常重要了。\n\
    \n当你的陪伴能让孩子感觉安心，当孩子愿意把自己的尴尬窘迫一五一十地说给你听时，你的安慰和鼓励才会有效果。\n\n为此，我建议定期召开家庭会议，最好是每周一次。让孩子知道这是对所有家庭成员都很重要的活动，一家人围在一起，开心地分享故事，玩游戏，吃东西的温暖氛围，更容易让孩子打开内心。\n\
    \n家庭会议每次都要有一个讨论议题，比如说礼貌、尊重、感恩、友情、家庭预算等等。话题的选择由包括孩子在内的全家人轮流负责。讨论时，可以围绕这个话题，分享上一周每个人遇到哪些有趣或者糟糕的事情。\n\
    \n分享时要注意两点：一是平等的姿态，二是自然的语气。\n\n- 什么是平等的姿态呢？比如，告诉孩子你工作上的一些事情、家庭收支计划等，让他们知道自己是重要的家庭成员之一，你尊重他们的意见和建议，你对他们是开诚布公，没有秘密的。再举个例子。你可以主动分享自己的糗事，并发起讨论。比如，“昨天跟一个客户谈判，我紧张得手心全是汗。谁能告诉我，应该怎么办？”让孩子看到你不回避问题、主动寻求理解和帮助的态度。同时，让孩子明白家庭是完全可以信赖的地方，遇到困难，要先分享，再分担。你的神态越自然，语气越轻松，孩子越能感受到，主动提出并讨论问题不是批评打击，而是一种祝福和鼓励。这样，当孩子日后遇到类似的困境，也会很自然地跟你分享、商量，而不是把糗事或秘密藏在心里，害怕受到惩罚，或者觉得难为情。\n\
    \n### 二、学会互动：做故事人物的心理分析\n\n分析故事人物的心理，培养孩子的同理心。\n\n相信在很多家庭，亲子阅读、睡前故事，已经成为你跟孩子之间的一个日常沟通必不可少的重要内容。一些经典的绘本或故事，蕴含着人际关系和价值取向的道理，是很好的社交启蒙工具。\n\
    \n比如《绿野仙踪》就是一个关于成长和友谊的故事，温暖又充满想象力。\n\n在跟孩子一起读这个故事的时候，你可以和孩子分析稻草人、铁皮人、狮子等角色的心理活动和性格特点，引导孩子说出人和人之间的差异，相互沟通的重要性，提出如何克服困难，战胜恐惧的方法等。\n\
    \n提示你注意两个细节：\n\n- **细节一**：给孩子挑选故事时要有针对性，要针对孩子目前可能存在的问题，选择有启发性的内容。你可以用故事里的人物、场景，启发孩子换位思考。比如这样做为什么不对，这个角色为什么不受欢迎，有没有更好的解决办法，等等。\n\
    - **细节二**：在讲故事的时候不要过多点评，也不要每次都把话题拉回到当下的场景。让孩子觉得你是在借讲故事之名给他讲道理，时间长了会让他们感到扫兴，甚至产生逆反的情绪。教育是潜移默化的，我们要做孩子成长路上的拉拉队长，而不是裁判。对孩子多一点耐心，让他们自己从故事发现问题，主动跟你讨论，这样他们才能由内而外地持久转变。\n\
    \n### 三、陌生环境：帮孩子准备有亮点的自我介绍\n\n知道了在家庭中怎么跟孩子建立爱和信任的沟通关系，跟周围人互动之前学会换位思考后，接下来你可以教给他们一些具体的方法，帮助他们在陌生的社交环境中，大方得体地展现自己。\n\
    \n一个简单易用的办法是准备一个 30 秒钟的自我介绍，让别人知道你是谁，有什么爱好、特长，先积极地展示自己，再慢慢寻找跟别人的交集。\n\n下面我就从自我介绍的内容、语气、眼神和身体语言四个方面，来谈谈如何帮孩子准备一个精彩的自我介绍。\n\
    \n#### 1. 内容\n\n在30秒内，孩子除了讲出自己的名字，还要强调两个自己的亮点和至少一个可能和别人建立链接的共同点。\n\n说出自己的亮点，是为了给对方留下深刻印象，让对方记住你。找到和其他人的共同点，可以引起他人的好感，让对方想主动和你交朋友。\n\
    \n那么，两个亮点怎么找？\n\n每个孩子都有亮点。比如自己名字的意义，在学校最喜欢的科目，感兴趣的活动等等。还记得第一讲里我们提到的优势游戏吗？你可以平时在家训练孩子发掘自己的优势，再从里头找亮点，孩子会更自信。\n\
    \n找到亮点之后，怎么说出来，用什么样的语言说出来，是有讲究的。\n\n如果孩子只是说“我对花样滑冰有兴趣”，这个说法就不够吸引人。\n\n如果说：“我特别喜欢花样滑冰，每周都会花几个小时练习，一滑上冰，时间过得飞快，每次都舍不得走。”这样介绍，特点就突出了，容易被别人记住。\n\
    \n再比如孩子说：“我喜欢画画。”这样听的人也印象不深。\n\n但如果改成：“我特别喜欢画油画，画画让我有耐心，帮我克服完美主义。我的作品已经在少年宫得过奖了。”这样一说，会让人觉得画画是孩子很重要的一个亮点。\n\
    \n除了亮点，跟其他人的共同链接点又该怎么样找呢？\n\n方法是，刻意提示孩子从自我介绍的场合和听众入手，孩子只要说出一个跟场合或者听众相关的共同点就可以了。\n\
    \n如果是在一个新的班级介绍自己，那么孩子最喜欢的科目、电子游戏、食物、儿童电影等等，就可能是链接点。如果是去参加一个才艺表演，孩子可以说说自己最擅长的才艺是什么，最喜欢的艺术家是谁，平时喜欢什么活动，这些都可能是链接点。\n\
    \n#### 2. 语气\n\n没必要在介绍自己的时候过分谦虚，说“我其实没做什么......”“我没有什么特别的地方......”等等。\n\n提醒孩子，自我介绍时，一定要使用强烈的、正面的、肯定的词语。\n\
    \n比如“我非常喜欢......”“我热爱......”“我很擅长......”“我特别希望......” 这样才能让别人感受到你的热情和自信。一个情绪饱满、意志坚定的人，更容易获得别人的尊重和信任。\n\
    \n#### 3. 眼神\n\n告诉孩子，在做自我介绍的时候，眼睛要看着其他人。\n\n如果人很多，就采取环视，从左看到右，或者在人群中找到几个点，然后轮流看着那几个人，这些目标点应该是面带笑意的人，温暖正面的回应能让孩子更放松，受到鼓励。\n\
    \n#### 4. 身体语言\n\n讲话时，尽量让身体舒服、舒展，让自己的身体和四肢，占用更大的空间，这样可以增加信心和气场，让听的人感受到你是开放的和邀请性的。\n\
    \n千万不要把身体四肢缩起来，这样会显得自信心不足。\n\n说了这么多，相信你已经发现了，在短短 30 秒钟内既要说出亮点也要说出链接点，还要注意语气、眼神、身体语言，这个要求对成年人来说已经不低了，何况大部分孩子还不具备张嘴就来的能力，所以你要帮孩子提前准备。\n\
    \n在家帮孩子准备自我介绍的时候，可以让孩子站在镜子前练习，也可以帮他录像，一起回放录像，来纠正表情和手势。\n\n反复练习，直到孩子能够流利自信地介绍自己。然后，让孩子把这样的自我介绍，变成他和别人建立链接的随时可用的一个工具。\n\
    \n我还要提醒你的是，孩子的自我介绍，不是只有一个版本。带他出门的时候，针对今天特定的场景或者人，你们可以讨论 5 分钟，排练一下。\n\n### 本讲小结\n\
    \n这一讲我教了你三个帮助孩子打开自己的场景，分别是：定期举行家庭会议，搭建爱和信任的亲子关系；分析故事人物，激发孩子的同理心，以及准备一个 30 秒的有亮点和链接点的自我介绍。\n\
    \n## 4. 帮孩子跟同龄人交朋友\n\n我们知道，人和人之间有共同的兴趣爱好，才能聊到一起，玩到一块儿。但小朋友之间的交往，可不像大人社交时那样，有较强的主动性和目标感。\n\
    \n比如说，大人社交时，先聊聊天气、交通，再分享信息，然后判断对方是值得继续交往。而孩子是单纯而又直接的，如果他对你不感兴趣，就会扭头黏着爸爸妈妈，或者干脆自己玩自己的。\n\
    \n遇到跟龄人聊天冷场的情况，社交能力还不错的孩子，会寻找合适的时机礼貌地退出交谈。\n\n而受欢迎的孩子，会试着了解对方，在寻找共同点、尊重差异点的基础上，主动开启新的话题，懂得欣赏别人，也让别人喜欢自己。\n\
    \n这是怎么做到的呢？\n\n我的秘诀是多做客，鼓励你的孩子去别人家做客，以及邀请别的孩子来你家做客。这就要让孩子扮演好两个角色：“爱分享的主人”和“受欢迎的客人”。\n\
    \n### 一、怎么做爱分享的主人\n\n先说第一个角色，别的孩子来你家的时候，做“爱分享的主人”。\n\n具体怎么做呢？你可以教孩子玩画布游戏。\n\n\
    当孩子邀请其他小朋友到家里来玩的时候，你可以先准备几张大孩子可以躺在上面的纸或画布，如果是有颜色的更好。\n\n- **第一步**，让每个小朋友选一张纸，然后轮流躺在自己的纸上。让其他小朋友帮忙，用笔勾勒出躺在纸上的身体外形。\n\
    - **第二步**，等所有小朋友都拿到了自己的轮廓画像，再让他们自己动手，在画像上，写出自己喜欢的东西。\n    - 在嘴巴的位置，写出自己喜欢吃的东西和喜欢聊的事情。\n\
    \    - 在胸口，写上喜欢的心上人。\n    - 在手上，写自己喜欢用手玩的东西。\n    - 在腿和脚上，写喜欢用脚玩的东西和做的事。\n- **第三步**，等大家都写好或画好了，把这些图画展示出来，让每个孩子对照其他人的信息，找找有哪些跟自己相似或不一样的地方，就像在玩寻宝游戏。\n\
    \n如果没有那么大的纸，让孩子们在一张 **A4** 纸上画出自己的自画像也可以。\n\n如果孩子年纪小，还不会写字，那就随便画画，只要其他小朋友能看明白就行。一个人画，其他人猜，也很有趣。\n\
    \n三步下来，通常孩子们都会玩得很开心。最重要的是，试着让你的孩子作为“小主人”去主导这个游戏，比如宣布游戏规则，把握各环节的时间、节奏等。\n\n让他在游戏中明白两件事：\n\
    \n第一，交朋友要先找那些共同点。找到共同点之后，话匣子就打开了。以共同点为基础，更容易建立友谊。\n"
  mdcn: "\n2. 如果他感觉不舒服，可以提前退场或者到一个安静的角落做自己喜欢的事。\n\n> 触发内向孩子的社交主动性应该从家庭内部开始做起，从家长的影响和鼓励开始，再邀请周围的人参与，帮孩子慢慢打开社交圈。\n\
    \n## 问题二：外向孩子，怎样设立社交边界？\n\n外向的孩子热情、健谈、精力旺盛，他们本身需要从和他人的交往中获得能量和满足感，这样的孩子也容易获得家长和社会环境的认同。\n\
    \n但是不是他们在社交上就没有问题了呢？当然不是，外向孩子很容易以自我为中心，过分关注自我表现，有时会令人烦，有时会让人感到热情过度，甚至会惹人反感。\n\n\
    外向孩子的家长要注意两点：\n\n- 第一：在家立规矩。孩子基本的礼貌和教养一定要在家从小培养，你要教会他基本的礼貌和礼仪；\n- 第二：出门划界限。跟孩子约定，注意观察所在环境和周围人的表现，关注别人的感受。一旦孩子有热情过度或反应过激的言行，家长有权力立刻制止他们，甚至是带他们离开现场。\n\
    \n下面我要教给你三个方法，你可以通过平常和孩子一起练习，帮助孩子掌握社交主动权，并且做到得体地社交。不管是内向还是外向的孩子，这些方法都很管用。\n\n\
    ### 方法一：传球游戏\n\n教给慢热型的内向孩子如何不冷场，自来熟的外向型孩子如何不夸夸其谈招人烦，传球游戏就是一个好方法。\n\n我平时在家里是这么跟孩子玩的：\n\
    \n我们一般面对面站着，相隔两米左右，我手里拿着一个网球。\n\n我先提一个问题，比如：“你喜欢哈利·波特的书吗？”然后我把球扔给他。\n\n如果孩子只是简单地回答：“喜欢”，那么球就只能停在他手里，不能再传给我。\n\
    \n但是如果他说：“喜欢，因为这本书很有趣，我喜欢哈利·波特和伏地魔斗争的故事”，那么他就可以把球再传给我。\n\n通过上面的例子，想必你也发现了这个游戏的核心在于，一方提出的问题，另一方的回答必须深入、具体，能给提问者一些新的由头来提出更多的问题，让谈话可以继续下去，球才能来回传递。缺乏内容的对话，或者不着边际的闲聊都不能把球传递下去。\n\
    \n这个游戏一共有四个要点：\n\n- **要点一**，小孩子一般很快就能掌握游戏规则，但刚开始玩的时候，也容易卡壳，不知道该怎样接话，这时你要注意启发他。比如，还是上面的场景。我接着问，“你最喜欢书中哪些人物？”孩子回答：“哈利·波特和赫敏。”我会说：“这样的话，我就没法问出下一个问题，球又不能传给我啦……说说你为什么喜欢哈利·波特和赫敏吧？”孩子就会认真想想，然后回答：“我喜欢哈利·波特，因为他很勇敢。我喜欢赫敏是因为她聪明机智，又漂亮。那么，你最喜欢谁呢？”看，这样回答就很赞了。\n\
    - **要点二**，你要使用一些话术，不断鼓励孩子把对话进行下去。比如“真棒，我喜欢你的回答。”或者“这真是一个好的开始，这个话题真有意思。”或者“太好了，我们进行了10分钟的传球游戏了，都没停过。”\n\
    - **要点三**，你可以进一步鼓励孩子开启新的话题。比如，“妈妈，你今天过得开心吗？”“爸爸，为什么我们很久都没去动物园了？”通过这样的一问一答，一家人交换对过去发生的事、家庭未来计划等的看法，很有点“真心话大冒险”的意思，非常有趣。\n\
    - **要点四**，你要寻找恰当的时机，让孩子明白传球游戏在生活中的意义。等到孩子比较熟练地掌握了传球游戏，我会在他们状态不错的时候，提示以前发生过的和朋友或其他成年人的对话场景。比如有一次我跟老大说：“记得今天下午张阿姨邀请你去她家和她儿子小明玩，在吃饭的时候，她问你玩得开不开心？她是想跟你开始一个对话。但你只是说：开心。你觉得这样的球能扔回给她？”这样，孩子就明白我的意思了，“球”——也就是话题，停在了他的手中，游戏就没法进行下去了。然后我们就开始讨论他应该怎么回答，才能把“球”再传出去。\n\
    \n### 方法二：赞美游戏\n\n内向的孩子观察能力强，善于分析，我们不妨利用这个优势，让孩子主动寻找他人的亮点，并加以赞美。\n\n外向型的孩子容易更多地关注自己，这个游戏可以让他们学习观察别人，关注别人，分享自己的赞美给他人。可以作为家庭会议中一个常规环节，每周都可以练习。\n\
    \n我们家一般是在周末的晚餐后做这个游戏。到了吃甜点的时间，全家坐在餐桌前，每个人都要说出挨着你的下一位在这一周内值得表扬的事情。\n\n比如从我的小儿子亚当开始，他要告诉大家他从哥哥亚力身上发现的亮点，他说：“哥哥在听说我要做手术的时候，很关心我，跑过来安慰我，说可怜的亚当，不要害怕，我们都会一直陪在你身边。”\n\
    \n哥哥听了很高兴，拍了拍亚当的肩膀，然后看了看坐在旁边的我，说：“妈妈很善于启发别人，她的学生这周跟她说因为上了妈妈的课，改变了自己的生活。”\n\n我说：“亚力，原来妈妈和爸爸说话的时候，你都注意听了，谢谢你赞美我。这周我注意到爸爸每天晚上都给我们打电话，我觉得他出差那么辛苦，还想着每天和你们睡前聊天，值得表扬。”\n\
    \n轮到先生了，他看着亚当说：“亚当上一周承诺他会收拾玩具房，这周他果然做得不错。承诺过的事情就负责做好，赞一个。”\n\n你看，这样的赞美游戏除了鼓励孩子发现家人身上的优点，还让家庭气氛更融洽、更活跃了。\n\
    \n其实，除了关注家庭成员，你还可以让孩子注意观察周围的人或者同学的优点。\n\n我有时会在孩子吃完早餐上学之前，给他们留一个挑战作业。要求他们当天去观察别人做得好的地方，并真诚地赞美一个同学或者老师。\n\
    \n这种游戏似的挑战，孩子们很喜欢。因为经常赞美别人，他们也时常会得到他人的正面回应。回家后，他们还会兴高采烈地汇报给我听，说自己是赞美他人的训练除了让孩子学会关注他人的优势，见贤思齐外，还让他们具备了一个社交优势，就是赢得别人的好感。因为任何人都希望自己被关注，善意地关注他人，就会赢得对方的好感。\n\
    \n### 方法三：邀请其他孩子来自己家玩\n\n通过邀请其他孩子来自己家玩，占据主场优势，内向孩子会更主动积极，外向孩子也不容易失礼。\n\n内向的孩子更善于一对一交往，你可以每周或每两周让孩子约一个要好的小朋友到家里来玩。外向的孩子你就可以同时邀请几个小朋友一起来玩。\n\
    \n因为是在自己家，内向孩子对环境更熟悉，会更积极、放松，外向孩子则会把注意力放在跟别的小朋友互动上，而不是因为对环境好奇、兴奋而翻箱倒柜，上蹿下跳的。\n\
    \n你可以跟孩子一起提前准备好要玩的游戏，比如一般男孩子喜欢枪战，搭乐高，或者到户外玩球；女孩子喜欢玩过家家，做手工，画画等等。\n\n小主人要为客人提供几个不同的选项，充分的准备会让内向的孩子觉得更踏实，也能从对活动的掌控中获得更多的乐趣和自信。\n\
    \n对外向孩子来说，准备好要玩的游戏，也能提前给他们建立规则和边界意识，防止游戏过程中注意力不集中或者有不合适的举止行为发生。\n\n在这个过程中，家长最好不要干预孩子之间的游戏。因为孩子是主人，他需要对如何跟客人互动，如何照顾好客人的需要负起责任。哪怕结果是他們各玩各的，你也不必担心。\n\
    \n等到活动结束后，送走了客人，你再跟孩子做个“采访”，让他讲一讲今天为什么玩得很开心或者不太开心，下一次打算邀请什么样的小伙伴。你还可以跟孩子讨论小客人身上有哪些亮点或特长，有什么可以学习的地方。\n\
    \n需要提醒你的是，内向的孩子容易在与人际交往中感到刺激过度，需要通过独处来恢复精力，所以每次游戏的持续时间不要太长，通常一个小时之内比较好。社交活动也不要安排得太频繁，最多一周一次。让孩子有足够的时间在家里休息，给自己充电。\n\
    \n而对外向的孩子，你要特别注意他们是否能够尽到地主之谊，关注和照顾到小客人的需要。\n\n### 本讲小结\n\n今天我们讲了内、外向孩子在社交习惯上的区别。\n\
    \n我们还分享了触发孩子社交主动性和得体社交的三个方法，分别是：通过传球游戏练习一对一的对话；通过赞美游戏寻找别人身上的亮点；通过邀请小伙伴到家里玩，来掌握社交主动权。\n\
    \n## 3. 帮孩子打开自我的三个场景\n\n![](img/f7924a16eadda2b2ba9acbb62108f604_25_0.png)\n\n\
    康妮\n\n2018-06-28 12:13:03\n\n3. 帮孩子打开自我的三个场景\n\n建议 WiFi 环境下播放\n\n不知道你有没有这样的体会？带孩子参加一些社交活动，有的孩子比较紧张，常常躲在角落或是大人身后，对周围事物反应冷淡；有的孩子比较兴奋，叽叽喳喳说个没完，要么干脆直接闯进别人的游戏中，不顾他人的感受。\n\
    \n成年人的社交讲究第一印象，这对孩子来说也是一样。太安静腼腆的孩子，不太有存在感；太活泼闹腾的孩子，显得不懂规矩，没有分寸感。不论哪种情况，都难以被其他人接纳，更别说受欢迎了。\n\
    \n也许你会说，孩子的性格就是如此，你也没办法啊。那你就错了，问题不在于孩子的天性怎样，而是他们在参与社交活动时，有没有打开自我，能不能有意识地调整自己去适应环境。\n\
    \n也就是说，不论他们表现出来的是冷淡还是热情，如果只是凭着本能或直觉，下意识地对周围环境做出反应，那么，他们内在的自我就始终是封闭的，外在的表现也会跟周围环境格格不入。\n\
    \n想让孩子更好地融入陌生环境，可以遵照由近到远的原则，从三个方面循序渐进地加以改进：\n\n- 第一，在家庭内部给孩子安全感。帮他们放下戒备心，保持好奇和自信。\n\
    - 第二，培养对周围人的同理心。懂得换位思考的孩子，更容易根据周围人的反应，及时纠正自己的言行。\n- 第三，在陌生的环境下，教会孩子在社交活动中主动介绍自己，以寻找和陌生人的共同点。\n\
    \n针对这三个方面，接下来我要推荐三个方法，来帮助孩子在社会活动中更好地打开自我。\n\n### 一、家庭内部：定期举行家庭会议\n\n定期召开家庭会议，建立充满爱和信任的沟通关系。\n\
    \n作为成年人，你可能挺不爱开会的。但如果把这种有仪式感的活动引入家庭，还是很有魔力的。\n\n好奇是孩子的天性，只不过到了不太熟悉的环境，他们会因为紧张或者恐惧，而缩回到自己的世界里。为了帮助孩子消除压力，尽快放松下来，你跟孩子之间，是否能建立有深度、充满信任的沟通关系，就显得非常重要了。\n\
    \n当你的陪伴能让孩子感觉安心，当孩子愿意把自己的尴尬窘迫一五一十地说给你听时，你的安慰和鼓励才会有效果。\n\n为此，我建议定期召开家庭会议，最好是每周一次。让孩子知道这是对所有家庭成员都很重要的活动，一家人围在一起，开心地分享故事，玩游戏，吃东西的温暖氛围，更容易让孩子打开内心。\n\
    \n家庭会议每次都要有一个讨论议题，比如说礼貌、尊重、感恩、友情、家庭预算等等。话题的选择由包括孩子在内的全家人轮流负责。讨论时，可以围绕这个话题，分享上一周每个人遇到哪些有趣或者糟糕的事情。\n\
    \n分享时要注意两点：一是平等的姿态，二是自然的语气。\n\n- 什么是平等的姿态呢？比如，告诉孩子你工作上的一些事情、家庭收支计划等，让他们知道自己是重要的家庭成员之一，你尊重他们的意见和建议，你对他们是开诚布公，没有秘密的。再举个例子。你可以主动分享自己的糗事，并发起讨论。比如，“昨天跟一个客户谈判，我紧张得手心全是汗。谁能告诉我，应该怎么办？”让孩子看到你不回避问题、主动寻求理解和帮助的态度。同时，让孩子明白家庭是完全可以信赖的地方，遇到困难，要先分享，再分担。你的神态越自然，语气越轻松，孩子越能感受到，主动提出并讨论问题不是批评打击，而是一种祝福和鼓励。这样，当孩子日后遇到类似的困境，也会很自然地跟你分享、商量，而不是把糗事或秘密藏在心里，害怕受到惩罚，或者觉得难为情。\n\
    \n### 二、学会互动：做故事人物的心理分析\n\n分析故事人物的心理，培养孩子的同理心。\n\n相信在很多家庭，亲子阅读、睡前故事，已经成为你跟孩子之间的一个日常沟通必不可少的重要内容。一些经典的绘本或故事，蕴含着人际关系和价值取向的道理，是很好的社交启蒙工具。\n\
    \n比如《绿野仙踪》就是一个关于成长和友谊的故事，温暖又充满想象力。\n\n在跟孩子一起读这个故事的时候，你可以和孩子分析稻草人、铁皮人、狮子等角色的心理活动和性格特点，引导孩子说出人和人之间的差异，相互沟通的重要性，提出如何克服困难，战胜恐惧的方法等。\n\
    \n提示你注意两个细节：\n\n- **细节一**：给孩子挑选故事时要有针对性，要针对孩子目前可能存在的问题，选择有启发性的内容。你可以用故事里的人物、场景，启发孩子换位思考。比如这样做为什么不对，这个角色为什么不受欢迎，有没有更好的解决办法，等等。\n\
    - **细节二**：在讲故事的时候不要过多点评，也不要每次都把话题拉回到当下的场景。让孩子觉得你是在借讲故事之名给他讲道理，时间长了会让他们感到扫兴，甚至产生逆反的情绪。教育是潜移默化的，我们要做孩子成长路上的拉拉队长，而不是裁判。对孩子多一点耐心，让他们自己从故事发现问题，主动跟你讨论，这样他们才能由内而外地持久转变。\n\
    \n### 三、陌生环境：帮孩子准备有亮点的自我介绍\n\n知道了在家庭中怎么跟孩子建立爱和信任的沟通关系，跟周围人互动之前学会换位思考后，接下来你可以教给他们一些具体的方法，帮助他们在陌生的社交环境中，大方得体地展现自己。\n\
    \n一个简单易用的办法是准备一个 30 秒钟的自我介绍，让别人知道你是谁，有什么爱好、特长，先积极地展示自己，再慢慢寻找跟别人的交集。\n\n下面我就从自我介绍的内容、语气、眼神和身体语言四个方面，来谈谈如何帮孩子准备一个精彩的自我介绍。\n\
    \n#### 1. 内容\n\n在30秒内，孩子除了讲出自己的名字，还要强调两个自己的亮点和至少一个可能和别人建立链接的共同点。\n\n说出自己的亮点，是为了给对方留下深刻印象，让对方记住你。找到和其他人的共同点，可以引起他人的好感，让对方想主动和你交朋友。\n\
    \n那么，两个亮点怎么找？\n\n每个孩子都有亮点。比如自己名字的意义，在学校最喜欢的科目，感兴趣的活动等等。还记得第一讲里我们提到的优势游戏吗？你可以平时在家训练孩子发掘自己的优势，再从里头找亮点，孩子会更自信。\n\
    \n找到亮点之后，怎么说出来，用什么样的语言说出来，是有讲究的。\n\n如果孩子只是说“我对花样滑冰有兴趣”，这个说法就不够吸引人。\n\n如果说：“我特别喜欢花样滑冰，每周都会花几个小时练习，一滑上冰，时间过得飞快，每次都舍不得走。”这样介绍，特点就突出了，容易被别人记住。\n\
    \n再比如孩子说：“我喜欢画画。”这样听的人也印象不深。\n\n但如果改成：“我特别喜欢画油画，画画让我有耐心，帮我克服完美主义。我的作品已经在少年宫得过奖了。”这样一说，会让人觉得画画是孩子很重要的一个亮点。\n\
    \n除了亮点，跟其他人的共同链接点又该怎么样找呢？\n\n方法是，刻意提示孩子从自我介绍的场合和听众入手，孩子只要说出一个跟场合或者听众相关的共同点就可以了。\n\
    \n如果是在一个新的班级介绍自己，那么孩子最喜欢的科目、电子游戏、食物、儿童电影等等，就可能是链接点。如果是去参加一个才艺表演，孩子可以说说自己最擅长的才艺是什么，最喜欢的艺术家是谁，平时喜欢什么活动，这些都可能是链接点。\n\
    \n#### 2. 语气\n\n没必要在介绍自己的时候过分谦虚，说“我其实没做什么......”“我没有什么特别的地方......”等等。\n\n提醒孩子，自我介绍时，一定要使用强烈的、正面的、肯定的词语。\n\
    \n比如“我非常喜欢......”“我热爱......”“我很擅长......”“我特别希望......” 这样才能让别人感受到你的热情和自信。一个情绪饱满、意志坚定的人，更容易获得别人的尊重和信任。\n\
    \n#### 3. 眼神\n\n告诉孩子，在做自我介绍的时候，眼睛要看着其他人。\n\n如果人很多，就采取环视，从左看到右，或者在人群中找到几个点，然后轮流看着那几个人，这些目标点应该是面带笑意的人，温暖正面的回应能让孩子更放松，受到鼓励。\n\
    \n#### 4. 身体语言\n\n讲话时，尽量让身体舒服、舒展，让自己的身体和四肢，占用更大的空间，这样可以增加信心和气场，让听的人感受到你是开放的和邀请性的。\n\
    \n千万不要把身体四肢缩起来，这样会显得自信心不足。\n\n说了这么多，相信你已经发现了，在短短 30 秒钟内既要说出亮点也要说出链接点，还要注意语气、眼神、身体语言，这个要求对成年人来说已经不低了，何况大部分孩子还不具备张嘴就来的能力，所以你要帮孩子提前准备。\n\
    \n在家帮孩子准备自我介绍的时候，可以让孩子站在镜子前练习，也可以帮他录像，一起回放录像，来纠正表情和手势。\n\n反复练习，直到孩子能够流利自信地介绍自己。然后，让孩子把这样的自我介绍，变成他和别人建立链接的随时可用的一个工具。\n\
    \n我还要提醒你的是，孩子的自我介绍，不是只有一个版本。带他出门的时候，针对今天特定的场景或者人，你们可以讨论 5 分钟，排练一下。\n\n### 本讲小结\n\
    \n这一讲我教了你三个帮助孩子打开自己的场景，分别是：定期举行家庭会议，搭建爱和信任的亲子关系；分析故事人物，激发孩子的同理心，以及准备一个 30 秒的有亮点和链接点的自我介绍。\n\
    \n## 4. 帮孩子跟同龄人交朋友\n\n我们知道，人和人之间有共同的兴趣爱好，才能聊到一起，玩到一块儿。但小朋友之间的交往，可不像大人社交时那样，有较强的主动性和目标感。\n\
    \n比如说，大人社交时，先聊聊天气、交通，再分享信息，然后判断对方是值得继续交往。而孩子是单纯而又直接的，如果他对你不感兴趣，就会扭头黏着爸爸妈妈，或者干脆自己玩自己的。\n\
    \n遇到跟龄人聊天冷场的情况，社交能力还不错的孩子，会寻找合适的时机礼貌地退出交谈。\n\n而受欢迎的孩子，会试着了解对方，在寻找共同点、尊重差异点的基础上，主动开启新的话题，懂得欣赏别人，也让别人喜欢自己。\n\
    \n这是怎么做到的呢？\n\n我的秘诀是多做客，鼓励你的孩子去别人家做客，以及邀请别的孩子来你家做客。这就要让孩子扮演好两个角色：“爱分享的主人”和“受欢迎的客人”。\n\
    \n### 一、怎么做爱分享的主人\n\n先说第一个角色，别的孩子来你家的时候，做“爱分享的主人”。\n\n具体怎么做呢？你可以教孩子玩画布游戏。\n\n\
    当孩子邀请其他小朋友到家里来玩的时候，你可以先准备几张大孩子可以躺在上面的纸或画布，如果是有颜色的更好。\n\n- **第一步**，让每个小朋友选一张纸，然后轮流躺在自己的纸上。让其他小朋友帮忙，用笔勾勒出躺在纸上的身体外形。\n\
    - **第二步**，等所有小朋友都拿到了自己的轮廓画像，再让他们自己动手，在画像上，写出自己喜欢的东西。\n    - 在嘴巴的位置，写出自己喜欢吃的东西和喜欢聊的事情。\n\
    \    - 在胸口，写上喜欢的心上人。\n    - 在手上，写自己喜欢用手玩的东西。\n    - 在腿和脚上，写喜欢用脚玩的东西和做的事。\n- **第三步**，等大家都写好或画好了，把这些图画展示出来，让每个孩子对照其他人的信息，找找有哪些跟自己相似或不一样的地方，就像在玩寻宝游戏。\n\
    \n如果没有那么大的纸，让孩子们在一张 **A4** 纸上画出自己的自画像也可以。\n\n如果孩子年纪小，还不会写字，那就随便画画，只要其他小朋友能看明白就行。一个人画，其他人猜，也很有趣。\n\
    \n三步下来，通常孩子们都会玩得很开心。最重要的是，试着让你的孩子作为“小主人”去主导这个游戏，比如宣布游戏规则，把握各环节的时间、节奏等。\n\n让他在游戏中明白两件事：\n\
    \n第一，交朋友要先找那些共同点。找到共同点之后，话匣子就打开了。以共同点为基础，更容易建立友谊。\n"
