  md: '# 前哨小议｜关于脑机接口相关问题的补充


    王煜全


    本周四，杜乾博士带来了关于脑机接口相关技术的介绍，今天根据用户的留言再作补充。


    # 主题一：所谓大脑的信号是什么？这些信号是如何被采集的？


    脑机接口信号传递是不是也是基于生物电路？信号传导是如何甄别出相应神经元的？如何保证信息不失真？电极植入大脑会产生副作用吗？


    搜集的都是大脑表面的数据吗？


    脑机接口用换电池吗？所用介质材料的安全性、寿命、维护是怎样的？


    王煜全


    以下回答转自杜乾博士：


    这类问题是理解技术本身的基础和入口，很高兴大家问到了这个点，说明你们是踏实的技术派。所谓大脑的信号，一般意义上讲，就是指神经细胞活动时表现出的电信号，即各种带电离子穿越细胞膜的进出进出，和细胞膜两边电位差的起起伏伏。如果我们将一根电极（不锈钢或钨材料金属丝）插入大脑，电极附近神经细胞的膜电位变化就会被检测出来。这跟基于氧化还原反应的生物电路是两回事。


    侵入式接口常用的这种细胞外记录方法记录到的信号，其实并非来自于单个神经细胞，而是多个神经元信号的混合，只不过由离电极最近的神经细胞主导，而且信号的精度也取决于电极的尺寸。滤波得到的场电位信号，更是大范围细胞群体活动的体现，其中也包含着有用的信息。侵入式接口通常使用含有几百根电极的电极阵列，同时记录数百处神经细胞的活动。大脑的表面被大脑皮层覆盖，其正是大部分感觉、运动和高级认知功能发生的场所，脑深层核团主要参与情绪、进食等活动。采集皮层和深层的电极都存有，采用哪种取决于应用目的。


    电极阵列植入会引起免疫反应和胶质细胞对电极的包裹，长期植入存在细胞死亡和信号丢失的问题，因此新材料新植入方法正是目前科研的重要方向。无线信号传输和无线供电是多方正在积极解决的问题。除了电信号，通过近红外光成像、核磁共振等间接测量神经活动的脑机接口也存在，比如Facebook
    Building8想要研制的打字接口预计会基于近红外光成像。


    # 主题二：除了读取，反向的控制、写入呢？


    是不是人脑神经元都已经研究完了？除了读取，反向的控制、写入是不是也已经有所突破？是否可能被用于控制人类 思考？


    安装了假肢的病人主要通过视觉得到假肢运动的反馈，而通过传感器模拟触觉是否现有技术还很难达到？


    王煜全


    以下回答转自杜乾博士：


    所谓反向的控制、写入，就是刺激型接口要实现的目标。这一部分音频没有提及，文稿的后半部分有介绍。写入相对乎读取要难很多，但如果能够实现，将极大提升我们与大脑交互的深度，这就如同我们与基因间的故事。我们早就有对基因序列读取的能力，但直到最近才有了较好的基因编辑技术，而这项技术之所以如此火爆，正是因为它让我们有了写入遗传信息的能力，极大地提升了我们与基因信息交互的深度。大脑对神经信息的编码，大致有两个层面，一是单个神经细胞放电的频时特性，二是大脑神经网络的结构。写入的实现之所以难，就是由于我们距离真正了解大脑信息编码的原理还很遥远。目前有非常初级的触觉重建的接口，仅能让患者分辨哪根手指受到触碰，但温度、疼痛、物体质地等信息还远远无法重建。“控制思考”这样的复杂功能更是遥远。


    # 主题三：脑洞大开的各种应用


    脑机接口是否可以治疗癫痫这种疾病或者给精神类疾病予以干预？实现脑机接口，是否可以实现恢复记忆或者篡改记忆？


    脑机接口进入游戏领域有可能吗？有企业探索吗？


    我觉得最先大规模运用应该在军事领域，远距离灵活控制战斗机或机器人。


    除了帮助失明失聋的人，还可以提升智商吗？


    是否可以通过脑机接口技术实现知识胶囊一样 的快速学习？


    王煜全


    以下回答转自杜乾博士：


    中短期，脑机接口是否可以实现某种应用，取决于精度要求，和相应脑功能 的复杂程度。游戏控制、远程开关、无人机飞行等可以分解为简单的二选一操作 的应用，利用非侵入的脑电图采集集就可以完成，可以关注Neurable公司。癫痫
    的脑电活动表现相对简单，利用脑深部 刺激治疗癫痫也已得到应用（可以复听文稿）。经颅刺激帮助运动员快速提升 训练表现，算是很浅淡的快速学习。操作 记忆目前仍在动物上
    tri 过非常初步的试验。提升智商还很遥远，因为关于智商到底是什么也恰有 一点点科研探索。至于战斗机远程操作，可以用手 喇，不过军事情报领域脑机接口大有可为。


    # 主题四：安全与伦理，意识与永生


    科学家去哪里找愿意做开颅的实验的人？


    未来正常人是否也可以定制一条手臂？


    如果全球人脑机联网，会不会有黑客、病毒入侵，反制人脑？普通人会不会成为另一部分人的控制对象？


    未来是否可以实现，以数字化的形式生活于虚拟世界中？不需要肉体，将意识上传，甚至通过将意识、情感、记忆从一个老化的 大脑转移到另一个年轻的大脑获得永生？


    王煜全


    以下回答转自杜乾博士：


    开颅实验确实是不可以随便进行的。根据接口的类型和应用目的，FDA会明确 规定可参与实验的病患的类型和损伤程度，比如BrainGate的被试者，要求必须 是因脊椎损伤、中风、肌萎缩、侧索
    硬化症和运动神经元丢失双手运动能力的 人。脑机接口给这些人带来的生活质量提升必须大于开颅手术带来的影响。 因此真正参与侵入式接口实验的病人屈指可数，实现快速打字的Dennis
    Degray，实现7自由度机械臂运动的 Cathy Hutchinson，实现触觉感知的 Nathan Copeland等等，让我们记住他们的名字并致以敬意。理论上在很久很久以后我们有可能生活在一个虚拟世
    界中，但目前连意识是什么，科学界都 只有非常浅的探索。脑机接口也有可能 受到黑客、病毒的入侵。但如何将伤害 降到最小，是否应该将意识上传得到永 生，是需要大家共同关心和讨论的话题。


    # 主题五：大脑和机器谁适谁？


    经过练习驾驭脑机接口可能吗？


    安装了脑机接口的人，也需要慢慢练习掌握它。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '掌握它。


    王煜全


    以下回答转自杜乾博士：


    这里涉及的问题非常有趣。脑机接口的顺利运转，需要一段时间的训练，这个过程中，不仅仅是机器学习的程序在飞快运行，人类的大脑也在进行快速的适应，甚至有学者认为，“人脑学习”在其中的贡献更巨大。其实广义上讲，你学开车，学拉琴的过程，也是你的大脑在适应和学习操纵一个原本不属于你肢体的外界设备。机器智能和人脑智能在此合作愉快。如果实战的时候和训练脑机接口的时候你想象不一样的指令，脑机接口就被你“骗”了。


    # 主题六：如何参与到这个技术中？


    这些仿佛遥远的学习系统有一天会向大众开源吗？


    类似技术，中国有吗？离中国患者有多远？


    王煜全


    以下回答转自杜乾博士：


    脑机接口硬件的开发和植入是有一定门槛的，但信号处理的算法开发是大家可以积极参与的，尤其是在今天这个人工智能开源且被广泛应用的时代。不管你身处金融、IT还是生物领域，只要你接触过机器学习，也许未来都可以为脑机接口发展贡献力量。而脑机接口更多应用场景的拓展，则是人人可以参与，并且需要各行业的人集思广益的。脑机接口的研发者队伍中，不乏华人团队。技术是无国界的，阻碍技术惠民的从来都是政治和经济因素。


    王煜全


    感谢杜博士的答疑，你可以回顾6月1日的“创新地图”版块的内容。也欢迎在留言区写下你的知识笔记。


