  md: '# 前哨小议｜关于超声波3D打印技术相关问题的补充


    王煜全


    本周四，张柳健博士带来了关于超声波3D打印技术的介绍，今天根据用户的留言再作补充。


    第一个想法是WiTricity，超声波打印可以内嵌传感器（甚至电器），那如果传感器需要电，可以用无线充电来补充，整体结构格局都改变了，世界会变成啥样？第二个想法就是，超声波打印是一种颠覆，最早的3D打印是层层堆积，是二维向三维拓展的概念，而金属切割是从外面向里面切割，虽然是三维的概念，但实际上还是表面处理，层层递进，还是个二维的概念。而超声波3D打印技术，是纯三维理念，先做出形状，然后粘贴，这是一种真正的三维思路去构建结构。


    王煜全


    +   1. 前几天看到，WiTricity都已经可以为电动汽车充电了。不过，我也不知道传感器外部的包裹层对输电量的衰减大不大，不过可以的话，传感器的數據采用无线输出，再加上无线充电，感觉可以用一辈子，前提是不喜新厌旧的话（_
    _）。

    2. 超声波焊接的一个好处就是焊接处的空洞率几乎为零，层与层之间可以很好的结合，并且在分子层面，振动摩擦产生的热量可以加速分子的相互扩散。无论是对于同种金属还是异种金属都能取得理想的固结质量。图1为钛-钢的分界面(25μm尺度下观察)，镍-不锈钢的分界面(500μm尺度下观察)，铝-不锈钢的分界面，钽-钢的分界面(100μm尺度下观察)。在高倍显微镜下，从图1可以看到两种不同的材料很好地相互渗透，并且Fabrisonic公司称在拉伸实验中，不同材料组成的物质，拉伸强度很高，所以可以理解为两种材料结合得很好。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_192_0.png)


    用户 静妹：我的问题是超声波打印现在面对功率缺陷有哪些可以解决的方向的研究呢？还有可供打印的材料也很关键，还有哪些材料在开发呢？


    王煜全


    制约超声波金属焊接技术发展的技术瓶颈之一为超声波换能器的功率。受限于换能器压电陶瓷转换效率，实际输出的超声能量很难大幅度提高。实际上，现在的超声波设备中使用到的超声波频率为
    20KHz、25KHz、28KHz、35KHz、40KHz，而更高的频率就尚未大规模地使用，制造高输出的超声波发生器成本很高，出于价格的考虑，现在的超声波打印的采用20kHz左右。


    事实上，Fabrisonic公司一直在和俄亥俄州立大学合作开发新的材料，例如金属基复合材料 (MMC, metal matrix composite)。例如在其它金属中加入具有高强度铝合金，或者硼，碳化硅纤维，最终的完成品可以获得优良的高性能复合结构。这些材料可以同时拥有高强度，重量轻，高应力等特性，还有异种材料的结合叠层复合材料。无论是对于同种金属还是异种金属，都能取得理想的固结质量。在层状材料中，超声波增材制造技术有着相比其他制备方法更加迅速、节能的优点，并能达到近100%的界面结合率及良好界面结合强度。


    王煜全


