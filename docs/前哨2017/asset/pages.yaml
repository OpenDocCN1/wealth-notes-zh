  md: '# 科技概念股｜知识服务的核心是推动社会协作


    知识服务的核心是推动社会...


    王煜全


    昨天回顾了知识付费的浪潮，尤其强调了头部内容已进入收荻期。


    今天将继续给大家介绍知识服务的下半部分，我们从一个最近刚刚流行起来的应用来看知识服务的另外一部分其实是社群。


    以下是于货笔记，完整内容欢迎收听音频。


    # ——◆ 社群付费 ◆——


    最近很火的应用小密圈主要解决了两个问题：一方面，在一个小群体里知识如何得到更高效的分享；另一方面，群体应当付费。


    未来付费内容的下一波潮流就是付费社群。


    社群由来已久，但大家只进行完全免费义务的互动，群主也是义务服务，往往很难持久，例如微信群。社群热度下降、效率变低，不是因为没有需求，而是社群需要更好的组织。


    付费是让组织者更有动力的绝佳模式。


    # ——◆ 线下付费社群 ◆——


    线下社群中，付费社群同样做得最好。例如正和岛、黑马营、混沌研习社，都是典型的以知识为纽带，以企业发展为共同目标，将大家聚集起来。非营利，但也不是公益组织。它利用一系列培训或者会员来收费，实际上提升了效率，也使社群的连接更加强大。


    社群很重要，付费是社群发展的重要特征之一。未来除了线下社群付费，线上社群也可能付费。


    # ——◆ 社交的目的与功能 ◆——


    参与社群的核心目的并不是社交，其实是构建一个信用体系。即当我能够加入某个社群时，实际上我被这个社群认可，同时这个社群的标签就会贴到我身上，证明我拥有那个社群的特定属性。我被社群认可的同时，也具有了这个社群能够赋予我的信用。


    社交网络有两大主要功能：


    一个是弱连接，让人和人之间更迅速地连接起来。互联网（尤其社交网络）出现后，六度分隔的联系被大大缩短。但弱连接导致你虽然能够接收对方的信息但无法互动。所以弱连接的作用是传递信息。


    另一个是强连接，双方可以形成互动与协作，强连接的作用是引发行动。但双方如何成为好友，中间有一个信用的构建过程，所以强连接最大的区别不在于是否联系，而是双方是否有信用的相互认同。只通过付费学习、购买知识服务很难建立强连接，在相对小的封闭圈子里进行长期互动，才能建立信用。


    在知识服务里，社群同样非常重要。付费参与社群获得的不是社群本身，而是获得信用，利用信用就可以引发行动。这也是长板协作、新木桶理论、强弱联手的基石。在知识服务的基础上，未来很有可能出现付费社群的潮流。


    # ——◆ 互联网将振兴师徒制 ◆——


    付费社群不仅仅是一个平行社群，很可能出现师徒制。例如孔子有三千弟子，但是有七十二贤人，相当于整个系统里要有名师，同时还 taim 有一大堆跟随者，但跟随者里有能够和师父建立强关系、甚至能够借助师父信用从而提升自己信用的徒弟，而非学生。


    互联网来临使社会又回到了部落化时代，形成一些紧密稳定 的小圈子。


    汤敏老师（国务院参事，友成基金会副理事长，著名经济学家，教育研究专家）发表关于未来教育的专文，认为互联网上的教育很有可能会重新振兴师徒制。这与我的判断一致，希望在各个行业里，有真知灼见的专家能借助互联网带出更多的徒弟，徒弟们也可以因为师父的认可而得到更好发展。


    学习的最终目的是提升工作效率，进而提升社会效率。目前整个知识服务明显仍在进化当中，它的判断标准是能够使每个参与者在事业上得到成长的平台会最终胜出。


    我认为，知识服务潮流还会继续发展并演化成不同形式，最终使社会提升到更高层次，甚至知识服务可能变成未来终身学习的主流平台。


    # ——◆ 总结 ◆——


    首先，碎片化的系统学习很可能成为终身学习的主流；


    其次，关键不是学知识，而是学见识，增长自己的能力；


    再次，利用社群和师徒的方式构建信用；


    最后，这一轮知识服务的核心是推动整个社会协作效率的提升。无论内容付费还是社群付费，都通称为知识服务，通过学习、利用知识提升工作能力，和他人合作发展事业。


