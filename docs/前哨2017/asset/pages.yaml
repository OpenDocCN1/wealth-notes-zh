  md: '# 创新地图 | 纳米药物 ——肿瘤新克星


    纳米药物——肿瘤新克星


    冯强，北京大学药剂学硕士，国家纳米科学中心博士，从事纳米药物研究。


    纳米药物是一种新型的药物。这一领域虽然年轻，却已经有了广泛的应用，特别是在抗肿瘤中的应用。本文将着重为你解释什么是纳米药物，纳米药物的原理和优势，以及对纳米药物未来的展望。


    # 药剂学的“终极奥义”


    在介绍纳米药物之前，我们首先要考虑一个问题：提到药物，我们在日常生活中接触到的，大部分是药盒里的药片、药丸、胶囊、瓶中的注射液、软膏等等。那么，为什么要把药物分子做成片剂、胶囊、注射液、软膏呢？


    原因大致有两个：


    +   1. 为了让药物分子稳定不被破坏。例如某种药物在酸性环境下不稳定，那就用肠溶胶囊裹起来：在酸性的胃里，药物躲在胶囊内部，到肠道的碱性环境中再释放出来发挥作用。

    2. 为了让更多的药物蓄积在疾病部位，更少的药物到达非疾病部位，从而提高疗效，降低副作用。


    例如：


    含有激素的某某软膏，抹在疮痂上，止痒消红肿，不需要吃下去改变全身激素情况。


    我们常见的胶囊、软膏等都可以称为载体系统，就像一辆车，一艘船，为货物（药物）遮风挡雨，把货物运送到它该去的地方。而想法法根据药物分子和疾病的特点去设计制备合适的载体系统，可谓是药剂学的“终极奥义”。


    # 纳米药的起源和发展


    那么，纳米科技和载体系统之间又有什么关系呢？


    众所周知，纳米是一种长度计量单位，在药剂学中，纳米颗粒的尺寸界定于1-1000nm之间。早期理论和实验征表明显，纳米颗粒在实际药物递送上有着先天的优势。首先，对于装载药物而言，尺寸越小的颗粒（尤其是多孔结构），其相对比表面积（指单位质量物料所具有的总面积）也越大。由于药物是吸附在纳米颗粒内部的表面的，因此科学家认为纳米颗粒可以比普通载型装载更多药物。其次，对于血管运输而言，常规血管内径在微米级别，纳米颗粒可以在血管内自由通行。


    +   1. 把药物装进纳米颗粒；

    2. 纳米颗粒带着药物在血管中游走；

    3. 纳米颗粒找到特定部位；

    4. 把药物释放出去。


    # 纳米药物重磅炸弹的产生


    事实上，纳米药物已经不再仅仅是纸上的论文，实际落地的产品已经崭露头角。


    首当其冲的是FDA批准的第一个纳米药物 DOXIL®。DOXIL® 是 ALZA 公司（2001年被强生收购）研发的一种包载有抗肿瘤药物的阿霉素长循环脂质体，被FDA批准用于乳腺癌、卵巢癌、骨髓瘤等肿瘤的治疗。阿霉素（Doxorubicin）是一种抗肿瘤药物，可以有效抑制诸如白血病、淋巴瘤、乳腺癌等肿瘤。然而，它的人体应用却面临巨大的毒性风险。除了常规化疗药物几乎都会有的引起病人体重下降、白细胞减少外，其严重的心脏毒性，让病人承受巨大的痛苦。于是，人们开始尝试使用纳米载体系统来为其减毒增效。DOXIL®就是FDA批准的第一个纳米药物和脂质体类药物。抗肿瘤药物阿霉素被包载在脂质体的内部。早期的临床试验表明，在多种肿瘤模型中，同样给药剂量下，DOXIL®相对于阿霉素溶液，可以将更多的阿霉素递送到肿瘤部位，因此推断，DOXIL具有更强的抗肿瘤活性和更低的副作用。'
