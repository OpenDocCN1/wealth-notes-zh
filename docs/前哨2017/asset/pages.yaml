    # 王煜全


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_243_1.png)


    你好，我是王煜全。


    前哨第二季内容的筹备正在稳步进行中，内容规划已经完成，我们争取尽快和你见面。


    今天，我们惯例发布一篇《征集：你的前哨一年》征稿活动的文章，由前哨用户牧钗元，分享他和“前哨”的故事。


    4月22日下午，参加王煜全老师的前哨大会，这个是元旦之前就开始策划了，不过那个时候定的时间是4月19号，后来为什么改成22号，据开场嘉宾罗老师说那是他下的一个套，也不知道是什么样的眼，反正我自己是放弃了本来要考的基金从业资格考试以及要去上海的行程。


    自从去年八月无意间在混沌听了王老师的一堂大课后深受启发，此后便一路紧跟，不仅开始关注作为文科生从感兴趣的最前沿科技，前哨专栏、北大分享会、上海私享会、黑天鹅群主持人，以及被遗憾拒签的美国CES之行，都是积极跟进，认知上的提升、拓展指明了我的投资方向，并不仅仅局限于热炒的互联网+，而是科技+。


    更关键的是奠定了开放拥抱科技的理念，以前分析政策主要是政治派系、人事调度、以及经济纲领、数据，现在开始着重关注世界前沿科技的论文、以及我国制造业的现状，并深入其间考察研究，虽然不能和浸泡其间的行业大拿相比，但与各领域大拿的深入交流已经足以让我对制造业现状和未来有相对清晰的把握。


    我一向是靠分析政策做投资，以前是不会那么深入的，顶多就是看个PMI、非农等金融相关数据，所以要不是王老师和前哨，也就不会马上行动在国家政策扶持下落实产业引导基金，更何况要不是美国签证被拒后的心有不甘踌躇邀请一聚，就不会有关于宗教、人性、科技、投资的交流，也不会有我现在方向清晰的文化事业。


    对了，我关于教育的思考就是去年11月5号，在上海听完王老师一整天的分享及持续到深夜的深度交流的第二天早上，灵感思绪喷涌而出，得出“阶层固化的征兆始于教育”的结论，富一代开始考虑传承伪效美国八大藤校，为子女建立属于自己的私校是水到渠成的事，先是商业对接、再是信任联盟、继而资源共享、再建立子女共同成长的同侪圈，最后联姻，代代反哺自家的私校，阶层就此建立。


    去年3月份开始约朋友交流，起因很简单，每天写作持续两个多月后感觉积攒十年的收获精华写完了，于是被迫找人交流寻找灵感素材，那个时候还是以采访为主，最大收获是明晰了“千江有水千江月”的含义，每个个体基于自己的成长经历对同一概念、事物都有独特的认知角度，让我经常有大开脑洞的感觉，也就从那会开始隐约觉得与人交流似乎是不错的成长方式。


    得到就是这样一个可以和大牛交流的平台。王煜全老师是咨询出身，去年11月的分享从早9点讲到下午六点，仅中间午饭一个半小时，4月22号的科技大会又是不间断讲了4个小时，语调平和、节奏从容，就连以语言称雄的罗振宇老师都说折服于王老师的穷征博引，就像罗老师的得到为例，看那些专栏大牛们的工作范围和强度，他们聚在一起对彼此此产生何等的助益，如此正向循环，那个同侪圈是什么样的层次？


    高密度、高强度、高精度的深度交流让我受益极大，我成长的主要方式便是这“人工”深度学习法，这个得益于同样是得到专栏作者的古典老师，借用这个方法，我物质、人脉、认知都有了指数级增长，欣喜、感慨、惭愧于自己的成长。过去一年做得不错，然而愈成长愈焦虑，因为越往上爬，放眼望去全部都是领域精英、行业翘楚，他们在做人品格、认知深度、生活节奏方面都还不是我可以比肩的，见识过高山，自然会想着见贤思齐，对于一个以成长为最大乐趣的人来说，没什么比真切地感受到自己有巨大的进步空间更让人愉快了，焦虑在我眼里是唯一停滞不前的
    conexão。


    人类的发发展其实不过就是在不停地解决困难而已。


    通过王煜全老师和前哨，我开始了解最前沿的科技资讯和发展成果。21世纪最具发展潜力的四大领域：认知科学、生物科技、纳米技术、信息技术（大数据、智能）都在初级开发应用阶段，如果50年后科技历经数次指数级爆发，“神人+智能”的世界模式将是无比真实的可能，人类的精神需求也可以通过脑科学来满足，那么就有可能动摇宗教的存在根基，但应该乐观的是：人类进化至今，雄踞全球，就是因为总能找到与时俱进的“想象体”来供所有人协作，而这个“想象体”将是未来世界的运行规则。


    我们不妨设想一下，在人类目前掌握的力量足以毁灭地球的情况下，我们假定不会再有世界级的战争发生，那么跟以往历史完全不同的是，不会有极端式如人口大量毁灭、社会秩序崩溃的世界性变革，可以说核威慑迫使人类只能是战略性的保守主义，就只能是在现有的这种社会规则上更迭，政治、军事、文化、制度、宗教、意识形态在科技发展的节拍下融合、博弈，相辅相成、相互制约，自美索不达米亚文明以来，六千年未有之变局，但是大争之世无疑，可类比的是春秋战国时期，列国纷争、变法，可以说是当时全球最具开创性的思想荟萃，百家争鸣激荡出各领风骚的思想巨匠，而今在四大科技领域的突破关口，面临着全面取代人类的智能压力，我们该如何自处？该如何把握趋势在未来占有一席之地？什么才是最大的生意思？


    昔日吕不韦见异人，认为奇货可居，问其父曰：种地可得利几何？答曰：十倍；又问：珠宝？答：百倍；再问：如果把大意之人捧为君王进而掌管天下财富呢？其父大惊曰：那可无法计算了，这就是吕不韦和异人后来成为大秦庄襄王的双赢合作。


    从这个故事我们可以借鉴：要么成为异人，要么成为吕不韦，故到眼下的处境，异人则是代表21世纪尖端的四大科学领域，年轻人或者我们的下一代可以往这方面努力，王煜全老师介绍的LightSail创始人兼首席科学家Danielle
    Fong，12岁读大学，17岁考入顶级名校普林斯顿大学读热力学博士，中途輟学拿着自己的专利创业，投资人有彼得·蒂尔、比尔·盖茨、还有海银资本，光看这豪华股东就知道前景极为广阔，全球范围内这种情况比比皆是，而且未来20年内不管是专利还是科技进步都将会以井喷式的增长，这些可以改变世界的科技就是奇货可居的异人。


    而吕不韦则是代表资本的投资人以及懂得如何把技术成果转化为商品的企业家，还有手握足够权力的政府和更重要的文化意识、价值体系。人类发展的底层逻辑就是经济规律，现如今商业理念是主流价值观，货币、金融体系、商业逻辑都属于“想象体”，而包括各
    种宗教、以及传统文化的意识形态在商业运行中博弈，那么未来最大的“想象体”必然是以现在普世的民主、专制、佛、道、儒、伊斯兰、基督这几个全球范围内影响最大的为基础，融合商业、科技发展出来的新意识。新的、适应时代发展的、让更多人相信的“想象体”，到底是何等模样无人可知，但就像吕不韦亲闻之大惊那样，其中价值是无法计算的，从这个角度看，全新意识形态塑造才是必然的趋势，而这不只是商业角度的兆亿市场，更是传承千古的伟业。


    而这些思考和方向，全部都来源于CES群内和王老师关于宗教、人性、投资的对话，随后频繁约见各领域的精英深度交流，在自己拓展认知的同时，渐渐确立了奋斗终生的文化事业。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_243_2.png)


    # 王煜全


    每个时代，都有机遇发生，也都有相应的时代的英雄和成功者，因为科技的进步，机会其实越来越多了，不需要你是技术出身，只需要你懂得用科技，懂得掌握科技的诀窍，你就能把握科技领域的机会。


    我是王煜全，你的全球科技前哨侦察兵。


