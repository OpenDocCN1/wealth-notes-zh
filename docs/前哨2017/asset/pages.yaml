  md: "# 创新地图｜能源行业变革，信息技术的下一个风口\n\n![](img/b82c97eb199a9276887cadbbbaa84d1f_144_0.png)\n\
    \n能源行业的变革\n\n陈珤博士，德国DNV GL 新能源咨询认证项目经理 & 控制系统高级工程师，8年新能源行业从业经验，现常住德国汉堡。\n\n# 能源行业变革，信息技术的下一个风口\n\
    \n在物联网概念已经炒得火热的今天，大家似乎很少提到一个已经存在了上百年，并已经深深嵌入城市和家庭每个角落的一张大网：电网。这张网不仅将所有发电以及用电设备连接了起来，并且还要要求发电量和用电量必须时刻保持平衡。这就意味着，我们打开一盏灯都可能会引发电网千里之外发电端的一个微小调整。\n\
    \n这张大网之所以让大家觉得离自己很遥远，是因为在大多数情况下，我们只是电力的消费者，而电网背后的复杂运行机制和普通人没有任何联系。而这一切即将被蓬勃发展的新能源产业以及随之而来的能源行业的变革所打破。\n\
    \n# 新能源的两大特征是分散性和不确定性。\n\n与传统能源主要控制在大型发电集团不同，德国大部分新能源发电设备都属于个人或小业主。对于电网来说，这一变化所带来的影响是革命性的。前文曾经提到，为了维持电网的稳定，发电量和用电量必须保持平衡。\n\
    \n过去，这种平衡主要是通过调节发电端的发电量来实现的。而当分散在全国各个角落且不可控的新能源发电所占的比例越来越高的时候，这一调节方式越来越难以为继。从另一方面来说，如果不能解决电网稳定性问题，新能源的发展将受到极大的局限，而这正是信息技术可以大显身手的痛点。\n\
    \n首先是解决新能源由它的分散性所带来的不可控的问题。利用信息技术可以将分散的新能源发电单元协同组织起来，形成一个大型虚拟电场。\n\n这一领域已经涌现出很多初创公司，代表企业是德国的\
    \ Next Kraftwerke，目前已经接入4000多个新能源发电单元，总发电功率已经达到2.7 GW，相当于一个大型火电站的发电能力。\n\n它的运行模式是在每个发电单元安装一个称为Next\
    \ Box的通信和控制组件，Next Box通过一个专门的加密GPRS信道与中央服务器相联，一方面将发电单元的实时数据传送到服务器，另一方面接收服务器的控制指令，这样就可以对电网以及电力市场进行实时响应。\n\
    \n它的商业模式一是可以将小型发电单元打包成大型发电厂，从而可以直接进入电力市场进行交易，获得更高的电价。另一方面可以利用自己的快速响应能力为电网提供调峰服务从而获得进一步的收益。\n\
    \n其次是解决新能源发电不稳定的问题，它基本可以分为三个技术方向。\n\n第一个方向是运用信息技术对新能源发电量进行预测，从而可以通过电力市场机制提前对未来新能源的发电量作相应反应，从而避免电网大的波动。\n\
    \n针对欧洲电力市场的要求，法国初创公司 Steadysun 根据不同的预测的周期和精度为太阳能发电量预测提供了一个三级系统：\n\n第一级系统SteadyMet主要基于气象模型和太阳能发电单元的历史运行数据，并综合运用智能学习算法，可以提供未来几天的太阳能发电量预测，主要可用于电力日前交易市场。\n\
    \n第二级系统SteadySat在此基础上加入了每小时更新1-4次的实时卫星图片信息，从而比较准确地预测太阳能发电单元被云层遮盖的程度，可以提供最多6小时后的太阳能发电量更精确的预测，主要可用于电力日间交易市场，并及时对第一级系统的预测误差进行修正，从而减少损失。\n\
    \n第三级系统SteadyEye则可以提供未来15分钟的精确预测，它通过在太阳能发电单元附近加装一个观测云层运动的摄像头，可以捕捉云层的运动轨迹，并通过对云层运动的物理建模，实现对云层遮盖非常精确的预测，主要用于实时电网稳定控制。\n\
    \n在风能发电量预测方面比较有特色的是德国初创公司 Enercast，它开发了基于云端智能算法的发电量预测服务。对于风能来说，不仅仅众多的气象参数，甚至周围的地形和附近的其他风力发电机都会对发电量产生不同程度的影响，因此，用传统的物理建模预测方法很难进行精确预测。\n\
    \nEnercast推出了基于人工神经网络的风力发电量预测算法，它首先使用历史数据，包含气象参数和特定风力发电机发电量对神经网络进行训练，然后再由神经网络基于第一部分的气象参数预测得到发电量预测。并且在运行过程中还会持续地将实测数据反馈回神经网络进行迭代训练，从而可以不断提升预测精度以及跟踪风力发电机本身运行状态的变化。\n\
    \n对于Next Kraftwerke这样的虚拟电厂运营商来说，由于电力交易需要提前进行，新能源发电量预测服务是不可或缺的。甚至对于传统能源发电企业来说，新能源发电量的预测服务也越来越重要，它不仅可以避免前文提到的负荷价的情况，而且如果根据预测，未来几天电价由于大量新能源电力...\
    \ \n\n第二个技术方向是通过用端的自主调整来适应新能源的不确定性。在工业用电方面，有很多工业过程是可以在一范围内灵活调整电力..."
