  md: '层出不穷的中国创新者。而这些拥有先进科技的企业家、创业者才是世界最先进的生产力，他们有才华、有实力，却未必从属于大公司。

    2人笔记


    # 小结


    中国军团这次参展主要是在展示自己，但我认为，未来中国在参展时也要向别人学习，学会如何更好地展示自己，甚至说能够借助参展来建立更多的合作。尤其特朗普上台后，中国的企业必须要做深度的国际化，中美交流如果像以前一样只是做贸易，肯定会受影响。而CES正好是中国人出去学习如何更好国际化的一個良机。


    我们用两周时间给大家做了有关CES展的完整介绍，希望大家能够有更深的了解。


    我和“得到”的同事商量，将1月7日在“得到直播间”的直播做成了音频，没来得及参加直播的朋友，可以收听。


