  md: '# 产业理解｜产业政策制定需听取企业家意见


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_164_0.png)


    产业政策制定需听取企业家...


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_164_1.png)


    王煜全


    中国产业政策的制定多年来习惯于听取专家意见，但今天的产业理解想告诉大家——产业政策制定应该多听取企业家的意见。


    以下是于货笔记，完整内容欢迎收听音频。


    # 计划经济的遗留问题


    中国有多年计划经济基础，并在各个产业设立了负责决策的相关研究机构，延续至今成为中国现在产业政策的决策辅助机制。


    中国的产业政策至今基本没有脱离计划经济的影响，制定产业政策需要听专家的意见。但中国专家主要是科学家、学者，属于理论家，往往离产业较远，容易误用科研替代科技。


    # 科学家常常误把科研当产业


    科研指学校的基础研究，强调单项领先，但科研转化为产品需要经历研发（将多项科研成果综合到一个产品上）的过程。科技对社会的影响是间接的，以目标、用户、体验为导向，通过研发变成产品，才能将科研成果的利益带给社会，使科技真正推动社会发展。


    中国学者普遍缺乏对研发过程的相关了解，例如曾经在移动通信建设上，缺乏对产业成熟度的充分分析，直接大力推广自主标准TDSCDMA，实际发现距离产业化很远。


    在真正的产业实践当中，问题相当复杂，还要考量产业中的竞争对手。例如电子产业，全球竞争的焦点是CPU（芯片）和显示（屏幕），中国在这两个方面大量投资并希望实现海外并购，但实际效果很不理想。原因：只关注产业前沿，忽略很多大企业已经重兵布局，格局很难撼动。


    全球科研成果转化已进入新阶段，中国需要改变只把世界五百强当标杆的产业习惯，应该更加重视小公司的科技发展情况和科研成果转换思路。


    中国学者常常混淆科研和研发，误把科研目标当作产业目标。


    # 学者做产业往往只追求结果


    中国的产业政策总是又大又全，覆盖全球科技发展各项制高点，目标伟大，但实践难度高，同时也容易吓到其他国家或产业的制定者。中国希望建立一个自给自足的完备系统，同时还要保证大量出口，这样“只出不进”，很容易被其他国家当成假想敌。


    学者没有置身产业实践，往往只追求获取尖端科技的结果，忽略产业的复杂性，尤其对实现路径、产业协作等缺乏考虑。例如山寨模式，对专利缺乏重视；要求跨国大公司必须在中国设厂甚至分享核心知识才能获得中国市场，不符合自由贸易原则。这两种模式都无法继续延续，在新形势下，要学会“投资先行、企业主导、政府支持”。


    # 产业政策制定需要听取企业家意见


    传统的产业政策制定容易出现路径依赖问题，一方面只强调科技，忽视研发和产业；另一方面沿用旧有思路，只关注夺取制高点，而不考虑实现路径和别人的接受度。新时期的产业政策制定，应当多听取置身产业当中的企业家的意见。


    中国目前一个普遍缺陷是学术界和产业界难以对接，缺乏产业研发环节。企业家要学习如何进行产业研发，参与产业政策的制定，有效提高可执行性。


    自主创新是目的和结果，但手段需要学习世界最前沿的机制（积木式创新），尤其学习国外小公司主导的产业研发思路，和最先进的科技公司合作，进行全球性、战略性的布局，逐步建立中国在全球科技前沿的影响力。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_164_2.png)


    王煜全


    今日思考：对于中国产业政策的制定，你有哪些自己的思考？欢迎到留言区写下你的看法。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_164_3.png)


