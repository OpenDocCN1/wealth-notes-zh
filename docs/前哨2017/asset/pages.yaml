  md: '# 周末问答 | 国家队现实，但并不短视


    国家队现实，但并不短视


    王煜全


    由于周日将会报道周六下午前哨大会的相关内容，所以本周《周末问答》提前到今天。


    无法到前哨大会现场的朋友可以通过优酷、腾讯、爱奇艺三家网站的直播收看。


    同时，前哨大会上我们会公布和国外机构的合作，你也可以通过周日的产业新闻进行了解。


    今天回答的问题主要和产业结构相关，尤其是对创新的支持。


    以下是干货笔记，完整内容欢迎收听音频。


    节目中提到，一旦有大公司介入，那么创业公司退出的可能性就大大增加。对于这句话，我实在不知道怎么去理解，王老师能否稍加解释？


    王煜全


    准确来说，一旦大公司参与投资，创业公司的投资人和创业者退出的可能性就会大幅增加。


    风险投资，公司经过融资，价值增加，但始终是纸面价值，最后真正兑现价值（也被称为“退出”）只能通过上市和被并购。上市后，股份转换成股票，就可以在股市上流通，相当于和现金交换；而通过被上市公司收购和并购，相当于把自己的投资间接转换成了上市公司股票。


    如果创业公司最初就被上市公司投资（战略布局），意味着未来被收购的可能性很大，公司创业者和投资人套现退出的可能性大大增加。


    中国是个实用主义国家，特别喜欢用市场和资本的力量直接入股或者并购那些科技成熟的公司，但国家议这种并购的行为是不是对大部分公司都合适，还是只对小部分公司合适？


    王煜全


    中国并不完全是实用主义，准确来说，中国是个现实的国家。但现实并不代表短视，众多失败案例已经证明——直接并购而不考虑未来长期布局，是不可行的。


    原因：首先会为政治付出溢价，政治上可能遭遇阻挠；其次会为经济付出溢价，就像你计划买走别人正在下蛋的鸡，对方就会把未来的预期收益都算进来，你肯定要付出更高昂的价格；最后，还要为文化差异付出溢价。


    就硬件领域的战略来说，VC和天使轮的提前入场和有国家队参与的硬件孵化器相比，王老师觉得利弊如何？我觉得虽然良莠不齐，但国家队财大气粗，一不在于乎、二不会错失机会。


    王煜全


    不能全部依赖国家，科技已经在各个行业井喷，国家实现全覆盖是不可能的。而在科技前沿领域，国家只适合在局势明朗时介入，因缺乏风险机制，国家队更追求稳妥，不参与早期投入。


    孵化器也和早期投入相关，建议交给民营企业做；国家队可以为创业提供一部份优惠政策，包括提供办公场所等，降低创业成本。


    另外，孵化器的租房和帮助企业发展的职能应当分开，多数孵化器只是租房，没太大意义；而帮助企业发展才是孵化器真正的值值，例如国外的 Y Combinator或MassChallenge。


    4月22日，前哨大会就要开始了。我们制作了一个帮助报名朋友更方便抵达现场的参会指南，长按下面即可保存。


