  md: '# 产业理解 | 重视你的“绝对长度”


    重视你的“绝对长度”


    王煜全


    未来是一个协同的时代，没有老板和雇员的区别，小企业间相互协作来完成大企业的任务，经常单元小型化、个人化、协同化，每个人都好像经营公司一样经营自己，公司也要学会友好相处之道。


    所以今天的产业理解将给大家讲讲如何找到自己的长板，既适用于个人，也适用于公司。


    以下是货笔记，完整内容欢迎收听音频。


    # ——◆ 新木桶理论 ◆——


    积木式创新有一个很重要的支撑理论——新木桶理论，即未来大量的事业获得成功是大家协同的结果。原则是个人或公司都专注于擅长领域，其他部分交给最擅长的别人来做。强强联手，组成一个新木桶。


    以前的木桶理论强调短板是一个桶最大盛水量的决定因素，因此要把自己的短板修长。然而新木桶理论更强调你的长板，只要有一个长板，虽然别的短板很明显，但相应的其他长板愿意跟你合作，强强联手才能做好事情。


    当今时代，成功的关键因素是拥有<|message|> 一块足够长的长板。未来每个人一定要找到自己的长板，并把它发展延长。


    # ——◆ 重视“绝对长度” ◆——


    中国科研过去的误区是强调进口替代，但进口替代表示你现有水平只达到国外出口中国 的产品的“板长”，这一定没有达到它正在储备当中的、研发更优的产品水平。即你只追赶了一半路程，如果国外储备中的新产品投入量产就会立刻战胜我们。因此，我强调的长板必须是全球性的研发长板。


    不在乎“板”的宽窄，不在乎你是否能同时进行生产、研发、销售；而在乎“板”的绝对长度，是否是世界最长。


    # ——◆ 选择有价值的长板 ◆——


    如果你 的长板只是比人类强、但比机器弱，那么就会成为被机器替代的目标。这种长板不可取，一定 要选择在未来有价值的长板。主要 有三种：


    # 第一，判断趋势。至少目前，人工智能的预测能力还非常弱，无法在一个非常错综复杂的环境里同时考虑多种综合因素，例如世界各国经济走势、产业爆发时间点等。这种对未来的洞察力是可以着重培养的长板，在未来非常需要，但机器无法做到。


    # 第二，创新。人工智能只能模仿、学习、复制，无法做到创新。


    # 第三，连接能力。机器和机器的连接是被动的，需要听从命令；但人和人的连接是主动的。


    # ——◆ 培养长板的方法 ◆——


    首先，知识升级，建立自己的系统。


    其次，找到自己的行业领域，把知识升级的能力构建带入行业。


    然后，经过长期锻炼，将知识能力变成自己下意识的部分。例如世界最著名的游泳运动员菲尔普斯，一方面要掌握正确的泳姿，另一方面必须刻苦训练，将正确泳姿固化到自己的行动当中。知识升级需要和产业结合，把自己变成产业里真正有价值的那个长板。


    最后，重视取舍，将重心放在自己的长板上，不够强的部分要舍得放弃，交给擅长的对方进行合作。


    中国企业家现在的合作精神越来越强，但还需要进一步加强。这个时代的特点是——只做自己擅长的事情，不擅长的事情一定不做。不做的部分交由他人，以协作的方式解决。


    例如《前哨》的长板是扫描全球的科技前沿，深入分析产业趋势，但并不擅长做组织知识的大平台，而在这方面明显是《得到》更擅长，因此《前哨》不能做《得到》，要做《得到》的一个栏目。


    在锻炼自己的能力时，也要舍得放弃，尤其对CEO而言，同时做好几件事情其实是最大的忌讳，要把自己所有的时间、精力集中在一件事情上。


    当没有别的长板来寻找你时，说明你的长板还不够长，需要继续修炼，当它达到一定程度，一定会有其他长板邀请你合作。


    例如《得到》里有很多专家之前相互之间并不认识，但因为各自的特长，强强联手，很快形成了合作。


    修炼长板前需要先确定是否是自己真正愿意坚持做的事情，即使短期之内不会成功，依然乐此不疲的坚持去做。所以，找到你的长板是现代企业和个人的必修课。


    推荐 “GRIT”（坚毅）这本书。据国外科学家系统分析认为，“GRIT” 这项素质是最能判断一个人甚至一个企业能否成功的标尺，即是否能够长期坚持、有兴趣做一件事。


    棉花糖实验认为如果小孩子能够延迟幸福，长大后就会获得更多成就。


    《一万小时理论》和《刻意练习》都强调了坚持一万小时的刻意练习就会成功，这其中的本质也不容忽视，即你的坚持需要内在动力，唯一能让你真正坚持下去的原因是你发自内心的热爱与喜欢。


    找到长板的最好即进入独孤社会，未来社会和谐一定是局部最佳和整体最优的统一。每个人都能找到自己的长板，整体优化，组成新木桶，推动社会发展。


    不论个人还是企业，都希望你能找到自己的长板。


    # 棉花糖实验：棉花糖实验是斯坦福大学沃尔特·米歇尔博士1966-1970年代早期、在幼儿园进行的有关自制力的一系列心理学经典实验。


    在这些实验中，小孩子可以选择一样奖励（有时是棉花糖，也可以是饼干、巧克力等等），或者选择等待一段时间直到实验者返回房间（通常为15分钟），得到相同的两个奖励。


    在后来的研究中，研究者发现能为偏爱的奖励坚持忍耐更长时间的小孩子通常具有更好的人生表现。


    王煜全 今日思考：关于培养自己的长板，你有哪些自己的经验吗？欢迎到留言区和我分享。


