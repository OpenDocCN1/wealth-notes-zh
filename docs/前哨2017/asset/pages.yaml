  md: '# 全球科技新闻｜“超级隧道”将彻底颠覆未来交通


    “超级隧道”将彻底颠覆未来...


    王煜全


    今年航天产业、太空产业大热，尤其美国私人航天产业的迅速兴起，也有机会引爆中国的私人航天产业的发展。Elon Musk再度开辟新战场，公布“超级隧道计划”。


    以下是干货笔记，完整内容欢迎收听音频。


    # Elon Musk引爆美国太空产业


    2017年8月21日，美国的东岸、西岸十几个州都能清晰观测到日全食。日全食虽然每年在全世界各地都会发生，但遇到好的观测机会并不容易。例如中国最近一次将于2020年6月21日才能在南部看到日环食，但最好的观测时刻是早晨6点左右；下一次日全食发生在2034年3月20日早上10点左右。而美国8月21日的太阳食，中国无法观测。


    Elon Musk功不可没，他的各种大胆尝试极大推动了美国整个私人航天产业的兴起。除此以外，还有Jeff Bezos、XCOR等，都促进了新一波热潮。


    # 超级隧道计划


    上周TED大会，Elon Musk对外公开了“超级隧道计划”（与“超级高铁”相呼应）。


    The Boring Company（挖据公司）致力于建立地下隧道，解决未来交通问题。地下隧道将有效解决地面交通拥挤，空中交通受天气、航线限制以及安全性等隐忧。并且未来地下隧道是立体的，可以达到很深的深度，各层隧道之间没有任何干扰，完全不会产生拥堵、相撞。


    地下隧道将主要用来运载两类物品：


    +   一类直接把小轿车放置在承载工具上，然后在地下隧道里行驶，到了另一端再回到路面，使得城际交通可以借助地下隧道摆脱拥挤。

    另一类则是利用地下隧道相对容易实现的真空环境，承载超级高铁HyperLoop。


    # 隧道挖掘技术已相当先进


    我认为，Elon Musk提出超级隧道一方面是为了超级高铁的实现，另一方面是大胆提出了一个解决未来交通的方案，并已经开始着手实施。看似激进，其实也是建立在可行基础上的。


    隧道挖掘技术已经相当先进，目前德国、日本实力最强。


    全断面掘进机是一次成型的，它是一个巨大的圆盘，盘子一面装载各种旋转道具，通过不断旋转去切割正前方的泥土、岩石，并把切下来的碎屑传递到圆盘后面，再输送走，所以当圆盘往前推进时，一个整体隧道就形成了。


    硬岩掘进机主要用于野外，例如穿山。硬岩掘进机会把岩石全打碎，从而造出一个洞来。


    盾构机是软土专用，主要用于城市地铁，它的刀盘相对硬岩掘进机来说没有那么坚硬，但它有一个盾构装置，往前推进过程中不断对周围的洞窘进行加固，使隧道一次成型。盾构机在国内很多城市的地铁建筑当中已经开始使用。


    # Elon Musk的创业示范


    Elon Musk提出的设想和他以前的设想很类似，虽然看起来惊世骇俗，但主要是观点上的革新，即认知升级。一旦接受了交通可以这样实现，就会发现它具有技术实现的可能性。例如超级高铁，通过实验发现真空管道里高速运行的可能性非常大，所以虽然看似打破常规，但实际上非常有可能实现。


    很多人将Elon Musk和乔布斯作对比，认为Elon Musk是乔布斯的继承人，这具有一定道理。因为这两个人都特别善于把现有科技运用到全新领域，想像非常大胆。这和我的一贯主张也很一致，科技不能直接推动社会，必须要交到企业家手里才能够推动社会发展，所以掌握前沿科技的企业家才是社会的最先进生产力。


    和乔布斯比起来，Elon Musk更大胆：


    +   一方面，Elon Musk涉足领域更多，已经成立大家公司，还在不断孵化新公司；

    另一方面，Elon Musk涉及的行业难度更大，因为消费类电子产品市场壁垒相对不高，但类似汽车行业、超级高铁所在的铁路行业以及隧道掘进等都是市政、铁路建设相关，处理问题更加复杂。


    虽然超级高铁、超级隧道实现难度较大，但我认为这也是另一种尝试，甚至可能引爆更多类似尝试，会有越来越多的创业者由于Elon Musk的示范作用进入这些原来只能被大公司占领的领域。例如没有特斯拉的示范，如今也不会有那么多汽车创业公司。


    Elon Musk非常好地体现了各个领域的禁区都可以被创业者利用高科技来突破。


    今天产业新闻的主题就是Elon Musk又开辟了新战场，未来也许会彻底颠覆交通方式，希望他能够实现，也希望Elon Musk的示范作用能进入更多行业领域，使创业者敢于冲击、颠覆那些被大公司、巨头所把持的行业。


    中国需要诞生更多世界级、拥有全球眼光的企业家，能够对全球科技前沿了如指掌，同时熟悉各个产业，能够熟练运用先进科技给自己的产业带来全新革命。


    今年即将开办科技特训营第二期，特训营将面向企业家、创业者、投资人，作为全球科技前沿的系统介绍与分析，帮助企业家找到最合适的先进科技去改造自己的产业。欢迎有需求的企业家、投资人、正在创业或即将创业的创业者积极报名参与。


    如果你身边有适合参加科技特训营的企业家，也请你帮个忙，将 Barn


    参与方式：前往“全球风口”公众号——回复关键词“科技营”，即可参与报名。


