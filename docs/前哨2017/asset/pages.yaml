  md: '# 春节特餐（五）｜科技与就业：心态决定未来


    科技与就业：心态决定未来


    王焱全


    大年初三，我们继续来讨论科技相关的话题，今天的主题是科技与就业。


    以下是干货笔记，完整内容欢迎收听音频。


    # 心态制胜，人机大战引深思


    人工智能从诞生至今，数次挑战代表人类最高智慧的棋类运动。国际象棋和围棋已被攻克，双方的反应引人深思。


    围棋选手输给了AlphaGo之后，有人很沮丧，有人找借口，也有人开始反思。另一方面，国际象棋特级大师卡斯帕罗夫败于深蓝后，积极地拥抱人工智能时代的来临，甚至发起人机自由组队的世界自由国际象棋比赛。而两个同时操作六七台电脑的国际象棋业余选手的最终夺冠也为世人提供了人机结合、共同进化的启示。


    面对人工智能崛起的不同反应告诉我们——拥有开放心态的人会拥抱变化，而拥有封闭心态的人则惧怕变化。敢于面向未来、敢于冒险往往意味着更多的成长壮大的机会，而不愿冒险往往会被淘汰。这一点上，百年不衰的肯尼迪家族为人类作出了很好的示范。


    # 就业变局，人机分工


    未来不可期，这就要求人类在信息有限的情况下尽可能地理性预测，即找到未来发展的规律。接下来，我们就讨论一下科技与就业的相关规律。


    在过去这几十年里，人类从单纯出卖体力到出卖智力，再到出卖创意，呈现出不断延伸的特征。在体力劳动和信息处理逐渐被机器替代后，未来世界只有人类才能胜任的工作剩下三种——创新、连接、领导。因此，未来的就业规律之一就是工作种类有序增减——人类和机器相比不占优势的工作种类会消失，而胜过机器的工作种类会增加。


    # 需求上移，自我实现促进步


    依据马斯洛需求层次理论，最基本的生存需求得到保障后，人的需求会向上迁移，追求自我价值实现。当全社会有更多的人去追求更高层次需求的时候，整个社会的进步就会加速。


    因此，未来科技与就业相关的第二条规律，是在构建全面的社会福利体系的同时，引导人们积极追求向上。随着科技经济的不断进步，相信中国的社会保障也会越做越好，从而通过促使人们追求自我实现而达到整个社会的进步。


    # 人机结合，超有机体主导未来


    达尔文进化论强调物竞天择、适者生存——单项强、整体弱的物种通过深度结合形成“超有机体”，其整体的优势会得到彰显，从而实现进化。


    这就启迪了未来的第三条就业规律，积木式创新。公司或个人用最优的长板与别人的最优长板结合，形成最优的木桶。而积木式创新不光指人和人结合，也包括人和机器结合。未来最优秀的一定是人机结合的超有机体，当然全社会都会因为这种结合而向前发展。


    而成功的人机结合，需要人机相互理解。在未来，有更高机器智商的人才能驾驭机器，更能理解人类需求的机器才能更好地服务于人。


    # 海纳百川，学无止境


    基于前文提到的三个规律，不难推知，第四个规律就是每个人都应该保持开放的心态，让终身学习成为一种常态。


    总结来看，在未来，个体在因为共同兴趣而结成的联盟中找到自己的位置，未来就会充满了各种惊喜。希望你能够充分地把握未来，更好地自我实现，对社会带来更大的价值。


    以上是本期春节特餐“科技与就业”的全部内容，后续更多科技相关的探讨，欢迎您持续关注。


    王焱全


