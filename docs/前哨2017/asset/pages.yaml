  md: '# 科技概念股 | 国内巨头争相布局虚拟现实


    国内巨头争相布局虚拟现实


    王煜全


    虚拟实在 2016 年初大热，下半年降温，2017 年回温，但决定它未来走势的关键性时刻是 2018 年。


    谷歌在 2014 年推出廉价 VR 解决方案 Cardbox，国内诸多厂商迅速复制且获益良多（例如暴风影音推出暴风魔镜），但由于技术不成熟，热度迅速退减。


    与此同时，国内巨头纷纷在虚拟现实领域布局，今天就给大家盘点大公司都有              哪些行动。


    以下是于货笔记，完整内容欢迎收听音频。


    阿里巴巴


    # 1、VR/AR 领域投资


    2016 年 2 月，领投 Magic Leap 7.94亿美元C轮融资；


    2016 年中，投资光场数据采集公司 Lytro；


    2016 年 11 月，以 1500 万美元投资以色列 AR 引擎和解决方案公司 Infinity AR；


    2017 年 1 月，以 600 万美元参投以色列 AR 头显镜片制造商 Lumus C 轮；


    2017 年 1 月，阿里资本以超过 1000 万美元投资瑞士车载 AR 导航技术公司 WayRay。


    # 2、VR 生态建设


    2016 年 3 月，成立 VR 实验室，将专注于优化未来购物体验，并联合阿里影业、阿里音乐、优酷土豆等建立 VR 内容输出标准，推动高品质 VR 内容产出。


    同月，阿里启动“造物神”计划，意图打造全球最大 3D 商品库。


    # 3、Buy+


    2016 年 7 月，在淘宝造物节上展示基于 HTC Vive 的 Buy+ Demo。


    2016 年 11 月，手机淘宝上线 Buy+ 页面，消费者通过手机就能使用；Buy+ 是阿里巴巴旗下的 VR 购物产品，利用计算机图形系统和辅助传感器，生成可交互的三维购物环境；Buy+
    还与支付宝整合，消费者无需摘下 VR 设备即可完成支付。


    # 4、内容


    阿里巴巴旗下的优酷、土豆均已上线全景视频。


    我的观点：


    阿里在全球 VR 关键领域的布局更偏底层技术；


    在国内的操作和它的战略思路相吻合——提升购物体验；


    在没有明确针对硬件的解决方案产生时，阿里输出 VR 内容标准为时过早。


    腾讯


    腾讯并不想做自己的 VR 硬件，而是把产品交给硬件厂商制造，自己只负责产品的交互设计和应用体系。


    # 1、Tencent VR SDK 及开发者支持计划


    腾讯在 VR 方面追求“软硬兼施”。2015 年底，腾讯 VR 在北京举办开发者沙龙，正式公布 Tencent VR SDK 及开发者支持计划，并表示将在
    2016—2017 年，分三步推出 PC 主机、游戏主机和移动 VR 这三种硬件；内容方面将覆盖游戏、影视、社交、直播、地图等。


    此外，腾讯还推出了一款兼容 VR 的 ministation 游戏机，可接入腾讯的 VR 设备。不过，腾讯的 VR 设备迟迟未实现。


    # 2、腾讯云 VR 解决方案


    2015 年底，推出腾讯云 VR 解决方案，让腾讯 VR 平台的开发者都可以通过腾讯云获得适用于 VR 场景的云服务支持；


    与之前开放的 Tencent VR SDK 相结合，腾讯已形成比较完整的 VR 立体支持方案；


    腾讯云的 VR 解决方案首先与游戏场景结合，但未来还将扩展到影视、社交、旅游、在线教育等更多可能领域。


    # 3、内容


    腾讯 VR 的 IP 优势集中在直播上，主要分为体育赛事直播、真人秀直播、演唱会直播三大类。


    未来，腾讯 VR 将会推广到更大的 VR 开放平台，入驻点播的影视综艺内容及用户 UGC 内容等，构建付费点播/直播、广告分成、VR 定制三大商业模式。


    # 4、投资初创公司


    投资 AR 公司 Meta（与 Magic Leap 对标）；


    投资虚拟现实社交初创公司 Altspace VR；


    8000 万人民币投资 VR+ 旅游公司赞那度；


    投资好莱坞制片厂 STX，拿到腾讯投资后不久，STX 就收购了沉浸式内容制作商和分销商 Surreal，正式进军 VR 内容领域。


    我的观点：


    腾讯在软件投资多于硬件；


    应当先投资硬件；


    先做好垂直应用，再扩展成平台。


    百度


    2015 年 12 月 4 日，百度视频宣布进军虚拟现实，推出 VR 频道，聚合市场上优质的 VR 内容链接，为 VR 爱好者和潜在用户提供丰富的 VR 视频，游戏，资讯等内容。


    此外，百度视频计划在全国 10 多个大中型城市的 100 多家购物中心、影城举办大规模的 VR 线下免费体验活动。旨在通过线上内容聚合与线下体验活动相结合的方式，使得全面实现虚拟现实成为大众娱乐的目标。


    2016 年 5 月，百度上线 VR 社区，期望打造内容资讯和爱好者交流的平台。


    联想


    在硬件方面，联想选择与多家技术公司合作推出硬件设备。早在 2015 年，联想就同蚁视合作推出了乐檬蚁视 VR 眼镜；2016 年，微软与联想合作推出 VR
    头盔；2017 年的 CES 展上联想还发布了自己的首款 VR 头盔，不过尚处于原型机阶段。


    在 AR 方面，联想与谷歌联手，推出了基于谷歌 Project Tango 的 AR 手机。此前，联想与视觉处理芯片商 Movidius 达成战略合作伙伴关系，并联合
    Nvidia 推出 VR 支持性电脑。


    # 1、投资


    先后投资了计算机视觉和深度学习公司旷视科技、VR 游戏公司铃空游戏，张艺谋的 VR 内容品牌 SoReal。


    我的观点：


    联想在硬件上的布局和中国结合紧密；


    底层技术发展，将缩小算法差距，联想是否能在硬件上形成壁垒，还有待观察。


    盛大


    在 VR 领域的布局以投资为主，基本完成了整个 VR 产业链的布局。


    2014 年至今，共投资超过 12 个 VR/AR 项目，包括 AR 专用镜片供应商 Atheer Labs、 Iceland VR 技术开发公司 Sólfar
    Studios、美国 VR 媒体 Upload VR、Space VR（提供外太空虚拟现实体验）、美国犹他州的 The Void 公司（打造全球首家 VR
    主题公园 The Void，盛大将与其合作，将主题公园引入中国）。


    我的观点：


    全球的 VR 硬件核心部分还未完全确定，'
