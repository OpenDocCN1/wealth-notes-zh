  md: '# 复盘｜前哨•全球科技行动报告


    # 王煜全


    你好，我是王煜全。


    前哨第一季已经结束，第二季正在筹备，我之前说过，这个期间我们也不会停止更新。今天我们整理了一篇《前哨•全球科技行动报告》，希望能帮第一季的用户进行复盘。当我们回过头去看过去的一年，你会发现，虽然人们活在同一个世界，但你看到的世界，已经有所不同。


    以下是全年的行动报告：


    # 行动背景 Background


    科技是人类进步和发展的核心驱动力。技术的进步，推动着全球经济发展，改变社会协作方式，深刻影响个人未来的工作学习和生活。然而，真正掌握“硬科技”知识的门槛极高，既需要有宏观的系统理解，又需要回到行业细节。立志把握未来机会，领跑发展趋势的你，需要一位帮你理解全球科技的“前哨”，帮你拆解和消化“硬科技”。


    # 行动目标 Object


    前哨过去一年的目标是帮助你：


    +   1. 接收最新的全球科技资讯和动态，看透科技新闻背后的道理；

    2. 看懂技术推动下的未来发展趋势，更好地把握机会，拿到“未来通行证”；

    3. 用对科技知识的积累，建立技术视角看问题的能力，形成对未来的判断力；

    4. 读懂行业的科技，而后理解整个行业，进而看懂世界经济。


    # 行动准备 Preparation


    # 装备3项科技创新理论武器


    # 1. “积木式创新”


    用搭积木的方式与外部企业合作，迅速获取发展所需的资源，以实现企业的高速发展。这种协作的模块化，因为是“即插即用的”，是提升社会生产效率的重要手段。


    # 2. “新木桶理论”


    企业和个人的水容量取决于长板，因为它不再是自己组成木桶，而是和其他长板协作。


    # 3. “一千小时领先理论”


    信息不对称在消解，行业经验成为公共知识，用1000小时把不同产业和领域的知识串联，即可成功实现突破。


    # 3项理论的应用


    这3个理论是“前哨”的行动理论基础。前哨深度解读的科技行业，多数都是通过积木式创新的方式，通过学术界和产业界的联合或者组建企业间的创新协作系统，实现科研成果转化。当你积累足够对科技的认识，掌握行业的洞察，采取行动的指导理论就是把自己的能力模块化，找到并强化自己的长板优势，参与社会协作，了解科技领域和不同产业的信息，打造个人的多维竞争力。


    # 掌握5套科技创新方法论


    # 1.全球科技趋势核心理念


    “美国科技+中国创新+全球市场”。


    # 2.投资前沿科技的方法论


    投资全球前沿科技企业要问四大问题：技术是否领先，壁垒是否成立，市场是否存在，时机是否成熟。


    # 3.人工智能时代的竞争法则


    未来的协作经济，不再是一个企业而是一个企业生态系统。


    有3类人不会被机器替代：创新者、连接者、领导者。


    未来最有竞争力的就是具备“人类智商”和“机器智商”的人机结合的超有机体。


    # 4.科技的十大话题


    科技是社会进步的第一推动力。在掌握基础的科技硬知识的同时，你还要站在更高的层面上去，建立起对“科技的价值和趋势”的完整认知，理解科技与创新、经济、国际化、社会、就业、教育、城市化、环境、健康、未来的关系。


    # 5.企业前瞻性经营方法论：


    现代企业要长盛不衰，就要懂得前瞻性经营的重要性。经营思路要从经验总结转变为提前做判断；只有预测科技才能预见未来；要理解科技创新大突破和小革新之间的差异；利用科技对未来进行布局；掌握产业化思维，跨过科技产业的三重境界。


    王煜全用7篇系列内容“企业前瞻性经营”为你系统阐述现代企业的经营思路（5月3日~6月14日）。


    # 5套理论的应用：


    前哨的科技概念股、产业理解分析、前哨团创新地图、全球科技新闻都在为你的实践提供知识和见识的储备，真正掌握足够的细节，才能有对科技的理解、直觉和认知，这5个方法论是你把见识变为能力的关键。


    # 行动任务 Missions


    以下是前哨全年内容和关键知识点的梳理，这是一幅“全球科技创新地图”，也是一份“2016~2017年全球科技大事记”，还是一册“全球科技行业报告”。


    理解30大科技概念股

    掌握31条产业必备知识

    协同29位科技前沿大咖成立前哨团，制定35篇科技前沿报告，绘制最新的全球科技创新地图

    深度解读45条全球科技新闻

    组织4次前哨特别行动（美国考察、CES展探访、硅谷访问、科技十大话题）


    # 理解30大科技概念股


    前哨从以下6个评价维度，筛选出全球30大科技概念股：


