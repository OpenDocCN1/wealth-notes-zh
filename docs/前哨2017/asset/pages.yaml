  md: '# 全球科技新闻｜贝佐斯和马斯克，谁的太空策略更靠谱


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_150_0.png)


    贝佐斯的太空新策略


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_150_1.png)


    王煜全


    本周的节目顺序稍作调整，周一我们先介绍一则和太空相关的产业新闻。


    以下是干货笔记，完整内容欢迎收听音频。


    # 全球私人航天业爆发


    第一部分是运载工具爆发，包括火箭、航天飞机大量兴起。


    第二部分是卫星产业爆发。


    第三部分是太空探索逐渐清晰，最终将实现应用并获取利润；例如：第一，服务地面；第二，捕获小行星获取稀有金属、矿物质等资源；第三，发展薄膜太阳能，输送回地面。


    # 中国面临再度被甩下的局面


    现在是全球私人航天业的爆发期，而中国私人航天最近才出现复苏迹象，我们无疑在全球新一轮产业拓展当中稍显落后。


    虽然中国也有长征二号、重载火箭、小卫星发射等，但几乎都由国家相关机构直接领导。看起来国家领导的机构实力强大，但实际存在隐忧。因为和灵活协作、积累资源的开放式创新相比，传统结构化的创新可能再度落后。尤其当大量新科技创新爆发时，传统的国企式创新不易适应。


    太空产业经历将近二十年的发展，正在进入爆发期，中国必须迎头赶上。


    # Blue Origin蓝色起源


    # 1、Blue Origin备受关注


    近期与太空相关的产业新闻频出，例如著名的Space X公司成功回收火箭，并再次成功发射这枚回收的火箭。这条新闻吸引了全球目光，以至于国内很多人忽略了另外一家国际重要公司——Blue
    Origin（蓝色起源）。


    Blue Origin之前就广受关注，曾宣布早就可以回收火箭箭体，但Blue Origin回收的中型火箭相对较轻，且只能完成亚地球轨道发射，不能把人或物送到地球轨道，只适合载人旅游。


    以前太空旅游主要采用相对更为舒适的航天飞机，例如Virgin Galactic（维珍银河公司）和XCOR公司（海银资本参与投资）都在进行私人航天飞机方案。但Blue
    Origin提出了用火箭载人的太空旅游方案。


    今年3月底，杰夫·贝佐斯（亚马逊公司创始人）进一步公开了载人太空舱照片，这个太空舱将安置在已成功回收的中型火箭上完成载人太空旅游任务。这个太空舱设计优良，舒适度较高，人可垂直坐立，且每个座位前都有一个用来欣赏地球景色的大窗口。这个方案一经提出就备受瞩目。


    4月5日，在第33届年度太空大会上，杰夫·贝佐斯私人拥有的公司Blue Origin又宣布了两件重要大事，吸引更多关注。其一是由CEO宣布了他们的登月计划Blue
    moon，另一件是杰夫·贝佐斯公布了他们近期研发的新型重载火箭研发成功。


    # 2、Blue Origin的布局


    Blue Origin全方位布局，第一是要实现可回收；第二研究重载火箭；第三载人上天成功后，最终实现载人登月。


    据说Blue Origin希望在2018年实现载人上天发射，2020年前后实现利用重载火箭载人上天。


    如果最终能由一家私人公司实现载人登月，意义巨大。人类在月球定居的可能性极大，在实现月球定居后，再总结规律进一步向火星定居，或许比伊隆·马斯克的目标更可行。


    # 3、杰夫·贝佐斯的价值


    杰夫·贝佐斯在4月5日的年度太空大会上首次公布了Blue Origin的研究成本，仅重载火箭的成本就高达25亿美元。


    Blue Origin是杰夫·贝佐斯的私人公司，并不像Space X开放渠道募资，但杰夫·贝佐斯更聪明，利用业绩收入亮眼的亚马逊公司实现了非常强大的正向现金流，每年从亚马逊公司变现10亿美元补给Blue
    Origin作为充分的预算和费用，以实现长远发展。一边有成熟的产业，另一边利用成熟产业不断补给新兴产业，脚踏实地并实现良性循环。


    以上是今天对杰夫·贝佐斯和Blue Origin公司的介绍，希望能对你有所启发。


