  md: '# 创新地图｜糖电池与糖氢电池


    糖电池与糖氢电池


    朱之光，中国科学院天津工业生物技术研究所的研究员，入选中科院百人计划。主要研究方向为生物化工、生物电化学、生物燃料电池、生物纳米技术等。2013年在美国弗吉尼亚理工大学获得生物系统工程专业博士学位。13-16年期间，在美国与博士生导师张以恒教授创业，担任Cell-Free
    Bioinnovations公司的CTO。2016年回国加入中科院，担任研究员。


    随着电子信息技术的飞速发展，电池越来越成为限制很多技术的瓶颈。我们的智能手机功能越来越强大，但是是耗电速度也是越来越快，现有的手机锂电池难以满足人们的需求。它有着几方面的问题，比如能量密度限制，单位重量存储的能量有限；有一定的安全隐患，比如要受到航空管制，在飞机上无法托运；基于非可再生资源，不环保、不可持续。


    为了取代锂电池，现在各种新型电池技术层出不穷，包括锂空气电池、锂空气电池、超级电容、液流电池、太阳能电池、燃料电池等等。其中，燃料电池的应用较为成熟，氢燃料电池驱动的汽车几年前已被宝马、现代、丰田等大公司抛向市场。基于氢气或甲醇燃料电池的移动供电设备也有商业化进展。


    其实，除了这些电池，我们平时所吃的糖类也可以作为发电、制氢的来源，做成糖电池或者糖氢电池。在电影《回到未来2》中，有这样一个镜头，博士和主人某一时没有时光机汽车的燃料，情急之下，他们将房间里随便找来的糖果、可乐、巧克力等一股脑儿地丢进车的燃料箱，然后点火，车成功发动，“嗖”的一束光，飞回到未来。


    为了实现这部电影中的场景，让人类在未来能够有着取之不尽的可再生清洁能源，全世界的科学家正在试图从来源广阔、可持续的糖废物中，通过生物催化的方法获取氢能、电能等。科学上来讲，叫做生物制氢和生物燃料电池。


    # 糖（氢）电池与生物燃料电池简介


    我们所说的糖电池的全称应该是以糖为底物的依靠生物酶催化的燃料电池，糖通过酶反应直接产生电子。所谓底物，就是参与生化反应的物质，就像化学反应中的反应物。糖氢电池则是两步，先是糖通过体外酶反应产生氢，再和现在传统的氢燃料电池偶联。


    # 为什么用糖来产生电能？试想一下我们人体或者绝大多数生物体，通过摄入糖分，在体内，经过几十步的生物化学催化反应，将糖分中的能量转化为自身生长与物质合成所需的能量。糖作为自然界创造的一大类物质，具有很高的能量密度。虽然它的能量密度不及我们通常使用的汽油，也不及自然界另一大类储能物质脂肪，但是糖的能量密度较离子等金属电池，高出十倍之多。并且糖的分解相对容易，不像脂肪那么复杂。没有人会整天吃脂肪获取能量。此外，糖类可从生物质获得。生物质可以是植物、秸秆、有机垃圾、废弃物等等，其可利用的主要成分为糖类，主要来自于纤维素和淀粉。我们可以通过种草或者利用农业废弃的秸秆获取糖，是一种可持续、环保的方式。


    # 为什么用酶催化？生物催化，是指利用细胞或者酶为催化剂进行化学反应。生物催化较化学和物理方法来说，具有条件温和、能耗低、安全、催化剂可持续、选择性高等优势。当然，也有一些普遍的问题，包括稳定性较差、催化活性较低、生产成本高等。目前，主流的生物催化方法，还是使用细胞催化，通过发酵，让细胞生长，同时产生我们需要的产物，如氢气、电能等。酶催化是将酶先分离出来，在细胞外进行生化反应。较细胞催化，酶催化具有更快的反应速度和更高的产品得率。因为酶比细胞要小得多，单位重量或者体积上的催化能力因此大很多。比如，酶催化的生物燃料电池就比微生物（细胞）燃料电池有更高的反应速度，因而有更大的功率。微生物燃料电池目前只是在污水处理中有一些应用，把一个零成本的东西，变成一点点有价值的电。而酶燃料电池是要把糖废物变成更多的电，用于电子产品等使用，价值也更高。此外，由于没有细胞生长的需求，酶催化可以将底物百分之百地转化为产物，更加高效。酶催化的生物制氢比微生物细胞产氢，效率高了几倍。传统微生物制氢有个生理极限，一分子糖只能产生4分子氢，而通过酶催化，可以产生12分子氢，达到了理论值。


    # 糖（氢）电池研究进展


    利用酶催化的糖电池，最早在上世纪60年代被美国NASA提出，意在给宇航员提供清洁能源，同时处理人体在太空中产生的废弃物。然而此研究的进展不是那么顺利，几十年来进步十分缓慢，始终存在着三个大问题：


    +   1. 人们一直无法将底物高效地转化为电能；

    2. 产生的功率微乎其微；

    3. 系统的稳定性较差，使用寿命短。


    其中，第一个问题主要原因在于，在之前的糖电池研究中，科学家们通常只使用了1~2个酶，无法将糖完全氧化，完全释放储存的能量。这几年，来自美国弗吉尼亚理工大学的张以恒教授和朱之光博士团队在这一问题上有了突破性的成果。他们构建了一套多酶反应体系，又叫多酶分子机器，模拟人体在细胞内消耗糖类产生能量的过程，成功地将糖类完全氧化，一分子糖产生了24个电子，从而证实了糖电池比锂电池有着更高的能量密度，该结果于2014年发表在nature
    communications上。最近，该团队又发出了可以同时利用蔗糖、葡萄糖、果糖三种混合糖的电池，并可直接利用可乐饮料中的糖分作为发电的底物。


    糖电池的输出功率，直接决定了应用前景。目前科学家都在攻克这一难题。朱之光博士团队的技术目前可达到2毫瓦每平方厘米的功率密度，属于最高的几个糖电池功率之一。世界上最高的是日本索尼公司开发的糖电池，他们能达到10毫瓦每平方厘米。这一功率，较氢燃料电池是极低的，原因主要在于，酶催化的活性还是比基于钯镍等饰有贵金属的催化剂要低一些，并且生物反应需要在液体的环境下进行，不像氢燃料电池直接通过气体，其传质（即物质浓度不均匀时发生的质量转移过程）和电子传递都会受到一定影响。为了进一步提高功率密度，需要整合更多生物化学、电化学、化学工程、纳米材料等一系列领域的知识。


    在糖电池的稳定性方面，大家通常都认为酶是很脆弱的，不稳定。不过，很多酶其实是可以很稳定的。比如在我们的洗衣粉中的蛋白酶、血糖仪上的氧化酶等。一方面，研究人员需要去选取一些天然热稳定性高的酶；另一方面，可以通过蛋白质工程的方法，去改造酶分子，使之变得更稳定。


    生物制氢与糖电池有着相似的原理，只不过是把电极换成了氢酶，不直接提取电子，而是生产氢气。张以恒教授团队从2007年到现在，同样利用多酶分子机器技术，获得了一系列体外酶法产氢的突破。目前该技术可从葡萄糖、蔗糖、木糖、果糖、淀粉、纤维素、生物质等底物中产生氢气，得率均达到理论每分子12个氢气。在产氢的速度方面，比糖电池直接产电速度快不少。十年来，张教授团队已经把速度又提高了3-400倍，目前为世界最高的糖产氢的速度，距离产业化用在氢燃料电池上只需再提高10倍。


    # 糖（氢）电池商业化前景


    # 未来世界的电能，朱之光博士认为分为两种：


    +   第一种是电网供电，主要用于家庭、办公室、充电站等主要通过电网，或者通过太阳能电池等提供电能；

    第二种是移动供电，主要用于汽车等交通运输，以及人们的移动电子设备，如手机、笔记本电脑、可穿戴设备等供电。


    如果糖电池和糖氢电池能最终实现产业化，可能形成一个糖-氢-电循环的移动供电方案。糖作为能量的载体，有多种优点，如便于携带、运输、安全、能量密度高、可持续等等。在未来，可以从太阳光和二氧化碳固定得到大量的生物质糖，然后当作一种能源物资交易和使用。糖氢电池生产速度较高，可以与氢燃料电池偶联'
