    除该团队以外，来自美国哈佛大学的Beth Israel Deaconess实验室的Dr. George Cheng所领导的团队也属于该领域突出的团队，此外美国西北大学的Professor
    Guillermo Ameer and Associate Professor Cheng Sun和佛罗里达天主大学的Dr. Yuqing Kang团队也在该领域进行尝试并有所突破。


    # 前景总结及判断


    定制心脏支架目前尚处于研发的早期，其所需要的核心技术比较多元化，再加上时间和成本的叠加，目前距离真正推向市场到逐渐普及并被广泛采纳应用还具有相当长的一段距离。


    接下来的五到十年的时间应该还是以标准的携药支架和可降解支架为主，但是，一旦技术层面的问题不断被突破，可定制心脏支架一定会成为一项具有革命性的产品，必将在人类健康发展的历史上留下自己的烙印。


