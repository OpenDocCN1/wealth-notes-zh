  md: "# 前哨学习报告 | 满怀对未来的希望\n\n王煜全\n\n你好，我是王煜全。\n\n前哨第二季的筹备工作已经完成，大家期盼已久的《前哨·王煜全（第二季）》将在7月31日（下周一）正式上线，这是得到APP中第一个进入第二季的订阅产品。\n\
    \n第二季的内容，每周会发布一份全景式的科技报告，从5个版块着手，每天8分钟，提前5年，让你掌握50个行业机会。\n\n全年的内容将分为“高科技与风口”、“高科技与生活”、“高科技与社会”、“重大科技突破”四大知识模块，每个模块结束后会有一周的总结，帮助找到真正的机会。\n\
    \n每个季度会发布一次全新课程表，根据当季度科技领域的最新变化，动态调整内容，保证第一时间和你同步全球科技创新的最新动向。\n\n全年在得到APP举办4次前哨发布会，还有不定期的科技专题，给你绝对前沿的科技创新趋势！\n\
    \n请大家在7月31日（下周一）订阅，也请推荐给你的朋友，多谢！\n\n今天，我们依然照惯例发布一篇第一季的《征集：你的前哨一年》征稿活动的文章，由前哨用户宋国明分享他和“前哨”的故事。\n\
    \n# 尊敬的王煜全老师及全体前哨伙伴：\n\n转眼之间已经订阅前哨栏目整整一年了，王煜全老师和前哨团的伙伴和大咖们兢兢业业、一日不落地持续为我们提供了365天的科技前沿盛宴！这一年在人类前沿科技这场饕餮盛宴上，我是吃得脑满肠肥！相信任何一个加入这场欢愉的朋友也定会大呼过瘾！\n\
    \n自己是前哨团的原住民，从第一天就开始跟随王煜全老师的步伐畅游于科技的海洋之中。当初到底是出于对罗胖推荐的信服，还是对王煜全老师本人的迷恋，自己已然记不清楚了，但总之幸运的是我第一时间订阅了！这一年多来自己受益匪浅！\n\
    \n# 一、改变了对世界的认知\n\n原来这世界有那么多那么新奇炫酷的科技，生活可以在不远的将来变得无比舒适和便捷，无人驾驶、柔性材料、超级高铁、无线充电、外骨骼、光场技术，每一项的未来应用都会极大地改变我们的生活。世界原来在自己的眼里好象许久都没有变化过了，但是现在认识到其实每一天都有无数的\x06\
    新科技出现，每一项都在进步都在剧烈地改变着我们的生活，我只是缺少一扇窗户，现在从前哨的落地窗望去，每郁都在变化的世界真的好美！\n\n# 二、未来满满的希望\n\
    \n盲人眼镜、家用无人机、私人航空、基因编辑技术、癌症新药新疗法、基因治疗、纳米药物、储能新技术。人类社会每一个当下都会有困扰当下人们的困惑，但是只要将眼光放得足够远，在科技的飞速进步面前，很多曾经我们忧心忡忡的问题都算不得问题了。尤其是随着医疗水平的进步，克服一些生理上疾病的方法已经很普及，人类的寿命在未来十年延长到100岁已经不是什么幻想，随着科技指数级别的增长，重大疾病也必将会被一一攻克，每天醒来想到自己可以活到100岁是多么令人兴奋的一件事呀！最兴奋的是我们不知道当我们99岁那年还会有怎么振奋人心的消息出现呢！谁知道呢，如果前哨愿意一直办下去，在100岁时我还会一直跟随。\n\
    \n# 三、重新认知中国的世界科技地位\n\n不知道是中了中学课本的毒，还是上了落后家乡的当，总以为全世界最厉害的东西都在欧美，未曾想过我们还有什么优势可以给我们这一代带来什么机会，通过老师一次次对全球科技形式的分析，以及产业合作机构的讲述，自己看见了一个不一样的市场格局，重新认知了这个世界科技的格局，也给自己以后的流动指明了方向。不再把眼光一直定在虚无缥缈的异国他乡，看看深圳的格局自己兴奋不已，原来大好的机会就在自家门前，何苦梦里寻她千百度？前哨告诉我，那人就在灯火阑珊处。\n\
    \n# 四、了解了行业机会\n\n其实自己这一年也正处于一个传统行业的挣扎转型期，正是老师的产业理解和分析，让自己有了明确的方向，知道了未来哪些产业会有机会，哪些产业即将被取代甚至消亡。自己在老师的产业理解的指导下，根据自己自身特点做出了适合自己的职业选择。与此同时，自己也是心机满满地做了一些小小的投资，而且获得了不错的收益，这些都得益于自己跟随老师一起建立起来的对产业最科学的理解。\n\
    \n# 五、升级了对商业的理解\n\n原来的自己貌似没有什么商业素养，也是小打小闹的创业，基本上是野路子蛮干型的土匪作风。但通过老师不断对商业、资产、信用等等一系列概念和实例的分析，我自己才真正开始考量自己以前的一招一式，复盘自己的一些想法和做法时，真的可以被当即自己的行为逗笑。学了老师正规军的套路后，自己试着去应用，真的是事半功倍！有模有样地做事就是比匪里匪气的胡闹高出不止百倍的效率。\n\
    \n带着对这个世界新的理解，满怀对未来的希望，手握升级自己的武器，每天都开心地跟随前哨一起成长。新一季前哨我们不见不散。\n\n王煜全\n\n我是王煜全，你的全球科技前哨侦察兵，期待在第二季与你相见。"
