  md: '# 创新地图｜从软银的发展看日本企业发展模式的变迁


    王煜全


    今天是《前哨》的第366天，前哨团供稿时间，之前这个版块主要介绍大开脑洞的“黑科技”，今天我们转换口味，讲一个企业经营的话题，聊一聊日本软银公司的发展模式。同时，大家还可以点击下方的第二条音频，我为大
    家准备了“补充”内容，希望中国企业未来也能像软银一样进行海外并购。


    从软银的发展看日本企业发… ↓


    新藤晴臣教授，日本国立大阪大学研究生院企业管理学博士，曾任职于软银集团风投部门。新藤教授是企业经营管理学的专家。从上世纪90年代中期开始关注技术型创新中小企业，并且在日本最先提出“大学科研成果转化型创新中小企业”的概念。
    现在的研究方向是大学科研成果转化型中小企业，创新型企业家的经营管理理论。本文由前哨特心用户张涵根据新藤教授的论文编写。


    阅读提示：你可以点击上方音频，收听我为你做的内 容转述。


    补充：软银收购波士顿动力… ↓


    软银公司大家都不陌生，它诞生于上世纪80年代初期，崛起于90年代中后期。我们都知道，这段时期恰恰是日本的泡沫经济时期，而软银业务取得快速发展的90年代中后期又恰恰是泡沫经济崩溃的所谓“失去的十年”的时期。那么为什么软银能够逆势向上，取得长足的进步呢？今天我们就结合日本大阪市立大学新藤晴臣教授的研究成果一起分析一下背后的原因。


    # 在介绍软银之前，我们先来了解一下战后日本制造业的发展路径。日本经济在二战后经历了3个阶段：


    +   1954年12月到1973年11月第一次石油危机为止的“高度经济增长期”；

    1973年12月到1991年2月的“安定经济增长期”；

    1991年3月到现在的“泡沫经济结束期”。


    我们熟悉的很多日本企业的创业发展时期主要集中在前2个阶段。比如本田（1946年创业，1957年上市），索尼（1946年创业，1958年上市），发那科（1972年从富士通独立，1976年上市）。这段时期，特别是在第一次石油危机之后，日本制造业开始特别关注减产能消耗，注重产品质量的提升。


    那个时期的世界制造业还是“标品生产”的时代。企业之间竞争的比较优势主要体现在产品的数量和质量上。而因为日本先天资源匮乏的生产条件制约，再加上随后的石油危机打击，使得日本制造业率先开始进入“精益生产”的阶段：在生产端尽力缩减制造成本，在消费端尽力缩减产品的维护成本，把有限的生产资源尽可能集中到新产品的开发制造中去。


    这样做的结果，首先是明显树立了和同类产品竞争的比较优势：在投放到市场上的同类产品在数量上大致相当时，日本产品可以用更低廉的价格和更长的周期来确保自己的市场份额，并利用市场份额持续扩张自己的商业优势。


    其次，这样做的结果还导致了一种以产品为中心的“战略论+组织论”的企业发展模式，也就是把针对产品的战略当作企业发展的唯一指导战略，根据它组织调动各方面的人力，财力，技术和渠道资源。这样做固然能够保证企业获得自己理想的产品，但也很可能导致一种被称为“加拉帕戈斯现象”的产品陷阱：即仅仅通过线性地增强产品的各个性能指标，而不去颠覆产品的整个结构框架，就以为能够开发出“最适应市场需求的产品”的倾向。（日本的商业用语，指在孤立的环境（日本市场）下，独自进行“最
    适用化”研发，丢 失和区域外的互换性，面对来自外部（外国）适应性（泛用性）和生存能力（低价格）高的品种（产品或者技术），最终陷入被淘汰的危险，以进化论中的加拉帕戈斯群岛生态系作为警语）


    形象一点说，这就像大家比谁家做的馒头更白，但却没有人想到往馒头里面加肉，创造出“包子”这个新产品来满足市场的需求一样。


    这种“产品战略论+组织论”的企业如同一个字母“I”型的企业，当产品失败，整个企业也就垮台。特别是到90年代中后期，市场不再以标品决胜负的阶段，由大量“I”型企业构成的日本制造业界就迅速地丢失了优势，直到iPhone这样的新的业界整合方案出现，日本制造彻底失去了原有的竞争优势。


    # 软银：F型的组织架构，“战略论+资金论” 的再出发


    在这种情况下，软银率先使用了“战略论+资金论”的F型组织架构。


    软银公司创立于1981年9月，最早的业务是电脑软件分销商。但软银并没有在所谓的“本业”上停留太久。1994年，软银在日本证券业协会登记备案。同年12月，软银收购美国Ziff
    Communication Company的展会业务部门，同时投资了2家日本本土的人才派遣公司：Persona-OA 和 Persona-Personnel。并在1995年把这2家公司整合为Persona-Softbank，标志着软银正式从一家“电脑软件销售公司”转变为了一家风险投资公司。


    但是软银的风险投资并不是简单的VC，而是将自身拥有的资金、组织、渠道组合起来，在外部对市场内各个单元进行资源整合，进而开拓全新商业领域的CVC式风险投资（
    CVC ： Corporate Venture Capital investments ）。它的特点是运用金融和组织方面的优势，去和市场上 有成长潜力的拥有技术或独特优势的公司合作，实现双方在组织资源和经济利益方面的共享。这意味着凡是被软银投资过的关联企业都可以通过软银的整合变成一种新的组织资源，去对接下一个新...'
