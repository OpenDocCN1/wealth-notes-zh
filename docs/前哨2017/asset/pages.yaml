  md: '# 科技概念股｜智能投顾公司Wealthfront开辟第二战场


    智能投顾公司开辟第二战场


    王煜全


    目前智能投顾行业发展遭遇瓶颈，战略调整才能实现自救与发展。有鉴于此，美国智能投资顾问领域领头企业Wealthfront开辟第二战场，于4月20日宣布开始提供小额贷款服务。


    以下是于货笔记，完整内容欢迎收听音频。


    # Wealthfront转型提供小额贷款


    4月20日，美国智能投资顾问（后文简称“智能投顾”）领域领头企业Wealthfront（财富前线）宣布开始提供小额贷款服务。这家公司是美国智能投顾行业最大的创业公司，直接管理资金已近60亿美。


    银行审批小额贷款程序复杂，并且很有可能不受理，此时你到线上提出申请，Lending Club之类的P2P贷款公司综合各方面的信用数据做出信用评估，决定是否贷款。


    同时，Lending Club的贷款平台是开放的，对于有理财需求、资金又不够充足的人来说，可以分成多份分别贷给需要的人，以此获取利息。


    Lending Club是一个互联网化的平台，无需在各地设立分支机构，利用技术保证成本低，收费低，能够吸引大量的借方和贷方，从而实现盈利。


    Lending Club的局限是只有想借和想贷的人才会关注。但Wealthfront是资产管理公司/投资顾问公司，用户数量庞大。长年服务积累，使得原本具有资产管理需求的人很容易变成贷款人，本身具有流量优势。


    例如中国的滴滴进入网约车市场后，易道反而无法招架，e代驾也损失惨重，传统称之为“高频打低频”。


    Wealthfront原有业务遇到的竞争越来越大，它开辟第二战场的转型之举很可能也是为了自救。


    # 智能投顾竞争空前激烈


    投资理财顾问门槛很高，但随着人工智能、大数据、算法、计算机等方面的发展，智能投顾逐渐成熟。


    智能投顾始于2011年，Wealthfront是该领域的首家公司，最初定位是硅谷工程师（非亿万富翁，但具有极强理财需求），一经推出就受到中产阶级热烈欢迎，发展极其迅速。


    智能投顾竞争空前激烈，虽然Wealthfront唤醒了中产阶级的理财需求，但它自己没有能力拿下整个市场。


    随后出现了类似Betterment的创业公司；嘉信理财、Schwab等老牌金融机构推出智能投顾新业务，后来居上，管理的资产数额竞超过了Wealthfront；BlackRock等基金直接收购了Wealthfront这类创业公司。


    总体来看，整个智能投顾市场正在井喷，Wealthfront市场份额不断下降。


    例如中国的蚂蚁金服为普通消费者服务，普通消费者在支付宝里存钱支付，多余部分存进余额宝。仅此原因，由于余额宝服务大众极其广泛，现已成为世界上最大的基金，管理相当于1650亿美元的资金。未来它的管理数额还会大幅上涨，资产管理的市场是无比巨大的。


    # 智能投顾业务的两大短板


    第一个短板是用户侧分析太简单，服务太粗糙。


    我曾试用Wealthfront服务，它对客户的了解仅通过一系列问卷完成，不够深入。Wealthfront的大数据其实集中在市场侧，用户除非把钱委托给它管理，否则暂时还无法利用这些数据做出最好决策，仅能够提供比较粗糙的建议。


    例如股票市场的买卖时点非常关键，智能投顾如果只能提供建议，而需要用户自己决策，其实很难把握时机。所以，理论而言，智能投顾的建议只适用于投资长线，不能投资短线。


    第二个短板是人工智能正在普及，并且金融市场数据全面开放，任何智能投顾公司都很难拥有明确优势。即使算法先进，也无法做到绝对领先，目前看来智能投顾发展遇到了瓶颈。


    Wealthfront 前任 CEO 是 Andy Richleff（美国著名的老牌风险投资基金Bechmark Capital的创始人）。


    2008年参与创建Wealthfront前身；2011年正式推出投资顾问服务后更名为Wealthfront，Andy Richleff担任CEO；2014年，让位给Adam
    Nash（数据专家，曾任苹果、eBay、LinkedIn工程师，2012年担任Wealthfront的COO）；2016年2月31日，Adam Nash退位，Andy
    Richleff再度做回CEO。


    我认为Andy Richleff是一个更加战略型的人，他发现利用技术优势不可能打败其他投资顾问公司，所以必须从战略上解决问题。Wealthfront于4月20日起开始提供小额贷款服务，应该就是Andy
    Richleff回归后的决策。


    智能投顾不仅要做大数据、做科技，还得讲故事、讲概念。2017年以后，智能投资管理领域还会发生大动作。更多的相关内容，明天我将继续为你介绍。


    王煜全


