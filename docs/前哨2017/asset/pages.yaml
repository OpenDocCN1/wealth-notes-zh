  md: '# 科技概念股｜智能芯片，巨头跟班各边忙


    智能芯片，巨头跟班各边忙


    王煜全


    昨天我们介绍了第十三支科技概念股，为大家解读了人工智能芯片的全球市场格局，今天进一步了解一下，都有哪些企业在里面扮演重要的角色。


    由于篇幅较长，国际和国内情况，会分两天讲述。


    以下是于货笔记，完整内容欢迎收听音频。


    # 首先看国际市场，人工智能芯片制造领域存在三种角色——


    +   因为异构计算被人工智能普遍采用而异军突起的企业；

    在人工智能领域深入布局的传统IT硬件巨头；

    希望在此领域分得一杯羹的创业公司。


    接下来，为您详细解读。


    # 异构计算技术各异，大小公司命运不同


    随着人工智能向各个行业扩散，CPU+GPU的技术架构成为人工智能的标准结构，这让CPU制造商们获利颇丰。


    # Nvidia


    异构计算的领域中最大的获利者是英伟达（Nvidia）。其创始人黄仁勋说，从一直专注于GPU的高端、小众市场的边缘角色一跃成为人工智能芯片领域的巨头，英伟达靠的就是运气——以吴恩达为代表的斯坦福大学人工智能领域的专家们，向其提出以GPU进行人工智能的计算。


    英伟达作为全球最大的CPU制造商其利润已然不菲，同时它还希望做更深层次的开发，提出下一代计算方式，称之为特斯拉，并推出特斯拉P100的GPU。


    # Movidius、Nervana、Altera被并购


    异构计算除了GPU以外，主要应用FPGA或者ASIC技术。而ASIC的典型厂家就是在2016年9月被因特尔以3.62亿美金收购的Movidius。其开发的产品叫做VPU(Visual
    Processing Unit)，专注于视觉图像处理。此项技术已被应用于谷歌、联想、大疆等公司。


    # 深挖高筑？吃碗看锅？IT巨头两边忙


    # 因特尔


    # 高通


    # 谷歌


    # IBM


    # 班门不弄斧，小厂生存有妙招


    # KnuEdge


    # Flex Logix


    # Krtkl


    # 中国智能芯片前瞻，产业整合是关键


    然后我们将视野拉回到国内。中国市场缺乏像因特尔、高通这样的巨头们的竞争，相对宽松。但这也意味着中国企业会缺乏产业整合能力——芯片产业是一个整合度非常高的产业，整合能力差，即使你做出很好的产品，也很难打入产业链。'
