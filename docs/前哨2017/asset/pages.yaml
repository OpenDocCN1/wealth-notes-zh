    同时，在美国也有了一些反对在线教育的声音。比如硅谷一家著名的中学引入了在线学习系统后，受到了大量的学生家长的反对，最后被迫放弃。究其原因，在线学习系统虽然加了很多人工智能，却仍然不及一个好老师对学生特点的了解和针对性的辅导。


    事实上，在线教育就像人工智能一样，虽然可能在很多领域并不能替代经验丰富的人来作最后的决策、判断，但是可以大大减少人类的工作量。


