    这一轮技术革命中，底层技术往往由大企业（例如微软、IBM）主导，而创新小公司往往选择从应用场景突破，因此这里面便存在着机会。底层开发不太可能由创新者完成，但行业应用与行业结合就需要小企业作主导。


