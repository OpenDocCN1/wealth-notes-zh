    Autodesk 的华丽转型


    王煦全


    今天将为你介绍世界最大的自动绘图软件供应商—— Autodesk 公司，全球市值 180 亿美元。


    以下是于货笔记，完整内容欢迎收听音频。


    # | Autodesk 近期两大热点新闻


    +   1、CEO Carl Bass 批评美国总统特朗普后辞职


    2 月 6 日，Carl Bass 批评特朗普是介于独裁者和小企业主之间的滑稽人物，此言一出，舆论大哗。


    2 月 7 日，Carl Bass 辞职。


    Carl Bass 澄清并非因得罪总统而辞职，只是按个人计划行动。


    +   2、Autodesk 年终业绩巨额亏损，股票反涨


    根据 3 月 2 日的新闻，Autodesk 年终大赔，2016 年第四季度亏损 1.7 亿美元，折合每股赔 0.28 美元；与此同时，股票不跌反涨，元旦至今上涨了
    18%，而在过去的 12 个月里上涨了 60%。


    股票不跌反涨，是因为亏损低于预期（华尔街的股票分析师预计 Autodesk 每股应赔 0.33 美元，实际亏损 0.28 美元），公司反而得到认可。


    # | Autodesk 华丽转型


    Autodesk 作为自动绘图产业的领头羊，发展空间受限，但近期 Autodesk 华丽转型，采用了值得称道的三招对未来进行战略布局。


    +   1、从出售许可转为出售订阅


    过去卖 “许可”，现在转卖 “订阅”，付费从一次性改为交年费，表面上看，用户每一次需交的金额减少，实际持续付费金额较高。


    这是现在整个软件产业的新趋势，Software-as-a-Service，软件即服务。


    采取此措施，有望逐渐缩小亏损，2018 年将实现扭亏为盈。


    +   2、介入未来实际生产，控制机器人


    Autodesk 多年前就开始赞助奇点大学的创业者开发区域，希望 AutoCAD 不仅是传统做图软件，更应当主动介入生产，成为核心环节，甚至和机器人联动。


    例如，Autodesk 在公司网站上发布视频显示，只需输入雕刻家想要的 3D 模型，AutoCAD 即可驱动机器人手（例如 ABB）在石膏或金属材质上实现高精度雕刻创作。


    +   3、生成设计


    Autodesk 一直积极提倡时下最新的概念——Generative Design。


    传统设计偏向机械式，而非自然形状，例如设计汽车的底盘、横梁、防撞杆等，往往是比较生硬的结构；目前西方设计界越来越流行生成设计，向自然界、有机物学习，让整个设计结构自发生长出来。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_106_0.png)


    生成设计不仅可以设计车辆，也可设计飞机，减轻飞行重量同时形成更好的强度。


    也可用于建筑设计，使各个大楼有机联系，未来甚至整个城市都会像一个有机体。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_106_1.png)


    # | 前沿科技已走近身边


    世界前沿科技时刻推动着社会进步，我们需要不断吸收新知识，走在世界前沿。


    +   1、王烨老师在《大学问》栏目里提到美国设计大师 Donald Norman，很遗憾这位受万人崇拜的设计大师目前并未深入思考人工智能对设计的影响，对生成设计这类新潮流一无所知。大师也会老，不接受新科技就会落后于世界前沿。


    +   2、9.11 事件后重新建立的美国世贸中心，作为北美第一高楼的世贸一号楼就采用了生成设计。


    +   3、Autodesk 展示用它的设计软件来控制机器人搭桥。不再像从前那样先设计图纸再建设，现在机器人可分别从桥的两端用 3D 打印模块将桥的结构打印出来，两边合拢，桥就建成了。


    # | 中国的山寨模式


    山寨模式只学习、模仿或抄袭硬件，创新生态里的 “软” 成分容易被忽略，无法形成完整的生态系统。


    中国式山寨在过去跟随世界前沿时是成功的，但在未来必须形成真正的创新生态，才能引领全球科技发展。中国企业在走向全球时，应当摒弃山寨思路，真正形成国际化。关于这一点，下周将会跟大家进一步详细解释。


