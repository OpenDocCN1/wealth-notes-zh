  md: '的一个例子是2013年初海正药业投资Celsion 公司的 ThermoDox®了。ThermoDox®是由Celsion开发的一种含有阿霉素的热敏感型脂质体。当加热到40℃附近时，脂质体裂开，快速释放药物。当初研究者设想，如果在肿瘤局部加热，就可以大大增加药物在肿瘤部位的蓄积量。于是，联合使用ThermoDox®（给药）和射频消融术（加热）治疗的肝脏肿瘤的临床研究被寄予厚望。在看到一些“令人为之振奋”的一期临床实验数据后，FDA甚至给Celsion开了绿色通道——直接上三期临床！也正是这时，海正药业与Celsion签署了合作协议，直接投资500万美元支持他们的临床研究，以获得该药物在中国市场投放的一些特权。然而，仅仅在交易一周之后，临床试验结果揭晓：这种治疗方案，并不能显著增加患者的生存率。Celsion股价应声而跌，海正的500万美元打了水漂！


    另一个不得不提的人就是MIT著名的生物工程学者Robert Langer。他是MIT为数不多的学院教授之一，在学术上造诣极高，仅他的实验室每年科研经费就高达1000万美元。Robert
    Langer在工业转化和工程开发上同样引领时代的潮流，从1987年起陆续创办了20余家公司。然而，纳米药物领域最近的一个重磅的打击，就来源于他创办的著名纳米药物公司BIND
    Therapeutics。他们的助攻产品之一BIND-014在临床二期试验中的失败，导致公司无法偿还债务申请破产保护。


    BIND-014是一种由聚合物构成的纳米载体，内部包裹了化疗药物阿霉素，表面修饰了可与前列腺特异性膜抗原（PSMA）结合的靶向配体。研究人员希望这种纳米载体可以更加准确地将药物带到表达有这种抗原的肿瘤部位，以实现减毒增效。临床前的一系列实验结果表明，该系统可以有效地杀灭动物模型上的肿瘤。


    2013年BIND Therapeutics以7050万美元上市，引起投资者争相涌入。然而不久之后的临床试验结果却令人大跌眼镜。结果表明，这一产品对宫颈癌和头颈癌无效，对某些肺癌有效但是并不能比现有手段（紫杉醇治疗）更加有效。于是BIND-014项目被撤，BIND
    Therapeutics大幅裁员，股价应声而跌。投资者和债权人前来讨债，无力偿还的公司只好申请破产保护。


    到底是什么原因，导致了从原理到初期动物试验表现都不错的纳米药物面临如此巨大的危机屡战屡败？为何有些纳米颗粒有效，而有些又无效呢？面对惨痛的临床试验结果，科学家们开始追根溯源，重新审视纳米药物的作用原理。


    我们回到之前提到的“迷你飞船”设想里面的关键四步。这四步看起来简单容易解决，事实却远非如此。


    第一步，飞船的设计建造，即高品质纳米颗粒的制备。从米到厘米并不复杂，因为原理基本不变，只是把模具变小了。而从厘米到纳米却需要完全全全的从头设计。做一个并不十分恰当的类别：就像经典力学到量子力学的跨越，基本原理需要重新确认。许多纳米药物的研发中面临的第一个障碍就在于是此。工业中也许只能采用妥协的方式——造一些简陋点的飞船。


    第二步，在血管中的隐形运输。越来越多的研究表明，即使经过“隐形化”处理的纳米颗粒，仍然会有一定的免疫原性，并且在表面吸附一定量的蛋白，导致整体结构的变化和尺寸的变化。换句话说，飞船一旦进入体内，就不是原来的样子了！


    第三步，肿瘤的靶向。纳米药物的靶向一般有两种，一种是被动靶向，一种是基于配体识别的主动靶向。近年来的研究发现，被动靶向并非简单的血管间隙变大，颗粒通过，而是一个复杂、动态、受肿瘤类型肿瘤大小影响、受颗粒大小影响的极其复杂的过程。不是简单的能够通过或者不能通过。动物和人体的被动靶向，也是不同的。那么，主动靶向分子修饰呢？可能受到颗粒表面蛋白层的相影响，没有办法确定靶向分子是否可以有效暴露在外面。设想，如果靶向分子的外面还有一层蛋白，那靶向怎么起作用呢？更进一步讲，即使纳米颗粒到达了肿瘤部位，如何继续进一步靶向到特定细胞，特定亚细胞器和特定蛋白和核酸？


    第四步，肿瘤部位药物的释放。如何保证纳米颗粒在血液中不释放，到达作用部位再释放？体内环境复杂而又精细，肿瘤部位与正常组织的区别也是很小的，如何设定最优的释放条件？除此之外，随着肿瘤生物学研究的曰渐深入，人们又意识到，肿瘤的异质性，实体瘤穿透性，微小转移灶的发现，肿瘤血管坏死……这些复杂的问题，都会影响纳米药物在肿瘤病灶的精准释放。


    上述两个临床试验失败的药物，可能是以上某一个或者某几个步骤出了问题，药物飞船并没有按照人们设想的情况发挥作用。究竟是哪里出了问题，要如何改善，都是科研人员下一步需要回答的问题。


    # 纳米药物还有“九九八十一难”


    诸多的问题，尤其是原理上的问题，严重阻碍着纳米药物的未来发展和临床转化。


    但是，我们并不认为纳米药物要就此画上句号。实际上，纳米药物的发展才刚刚开始。对比人类近期的重大药物发现“抗体药物”来看，纳米药物现在正处于发展的早期。2000-2014年期间，纳米药物领域的研究论文数量，每两年都会增加一倍，势如破竹。我们大胆推断，在不远的将来一定会有这样的小飞船，游走在体内，清除患病的组织，治愈疾病。那大概要多久呢？也许是三十年。多伦多大学纳米技术科学家Warren
    Chan在最近的一篇展望中给出了这个时间轨迹：2015年开始基础研究，到2035年时在动物模型上开始试验，2045年后进入临床试验。纳米药物发展至今，底层空间仍有很大。尽早尽快地探明这些内容，也许正是我们短期内的使命。


    王煜全


