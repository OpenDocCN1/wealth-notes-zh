  md: '高校应该如何跟企业合作，张翔教授给出了示范；企业又该如何与高校合作，如何延伸现有技术，如何孵化下一个革命性的创新企业，这是企业家们应该思考的。


    从投资者角度来看，如果能够从高校获取创业信息，抓住高科技创业企业量产的机会，就能和中国的制造业对接。如果从现在起，和国际上最先进的高校建立合作，也许5年之后，中国的企业家们就可以在CES上展示世界最新科技了。


    # 合作方式与机会


    每年4月中旬，伯克利都会组织教授与外部VC（投资人）、企业家进行交流会，希望在4月份伯克利的交流会当中，见到更多的中国企业家。


