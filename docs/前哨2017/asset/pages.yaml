  md: '# 前哨小议 | 关于私人航空航天领域的补充


    王煜全


    本周，孙揿博士给我们带来了关于航天航空领域的内容分享，今天根据前哨用户提出的好问题，再作解答。


    简单在网上查阅了一下孙揿博士供稿中提及的公司与人，其中张福林博士已经67岁，拥有1/4华人血统，在太空时间18小时16分钟，毕生从事航天事业。


    采访视频中他也在鼓励年轻人要追逐自己的梦想，不要听别人告诉你行或不行，要自己实践之后再去判断。


    很巧的是昨天一个朋友发给我“国防科工局总工程师、国家航天局秘书长田玉龙在2017年‘中国航天日’新闻发布会上的发布词”。其中提到了“2016年中 国 航 天
    白 皮 书”，明确指出了政府要推动军民融合、互联网+卫星应用，加快商业航天发展。我想我们的政府也意识到了商业小公司才是创新的最佳途径。


    关于鼓励年轻人追逐自己的梦想，不要拘泥于条条框框，不要被权威所<|start|>悠，这我也是很支持的。


    由于国内传统教育主要是传播知识，而不是启迪思维，所以造成了我们成长之后的思维模式和小时候发自对世界和其他未知事物的好奇心有了很大的偏离。


    笔者在国内接受基础教育，之后在美国接受研究生教育，美国都有要求自己独立完成的课题。这个课程可能需要花费一个月的时间，从最基本的想法构思，查找大量文献、网上资料，再到整理思路，最后完成，这过程
    中潜移默化的锻炼了自己的思维。


    虽然说很多资料其实不是你创造的，但你在把这些资料粘接到来再加上自己想法的时候，其实就是已 经完成了一个创新的过程。


    另外一个就是，每个人都需要有批判性思维（critical thinking），诺贝尔奖得主也有很多常识错误，很多商界领袖往往是靠运气上位，然后马上后做青年导师误人子弟，很多公司的老板一般的知识结构都比不上底下的工程师，美国主流媒体整天炮轰美国总统，揭其短，在推特上互相攻击，其实背后都隐含着批判性思维的痕迹。


    而批判性思维，恰恰是我们做好科技创新，改进产品，优化商业模式最本质的思维方法。


    > "Critical thinking is in short, self-disciplined, self-monitored and self-corrective
    thinking. It requires rigorous standards of excellence and mindful command of
    their use. It entails effective communication and problem solving abilities."


    > “批判性思维简要的说，就是自我约束，自我监督，自我纠正的思维，它需要有追求完美的标准，需要有意识的来运用它，最终就会让我们的沟通更加有效，让我们解决问题的能力更强”。


    这里用 了三个“自我”，说明批判性思维是一个自己思考的过程，而不是条件反射性的接受老板、上级、权威、领导、精英给我们灌输的各种知识和理论，只有经过自己思考吸收的东西，才能为我们所用。


    这是很大的话题，可以说上一天，虽然这个回答跟航天无关，但笔者觉得很重要，特别想借这个机会跟前哨用户，跟大家讨论一下。


    看到留言里有朋友问为什么其他国家没有像美国这样涌现出一些技术领先的私人航天企业？

    在想是否是国家政策的问题？又是别的国家不像美国那样看得足够远？


    除了美国以外，欧洲和其他国家也有一些比较有意思的公司。


    这里再举两个例子：


    比如新西兰的 Rocket Lab。这家公司专注于开拓轻量，成本节约的火箭发射系统。“电子火箭”项目是专门为当前的立方纳米卫星（CubeSat）打造的火箭发射平台系统综合服务系统。


    电子火箭一般可以搭载 150 千克的负重到达 500 km 的太阳同步轨道。今年初开始测试，年底开始商业发射，起步价是 $4.9M。这些卫星可以作为农稼的优化检测、天气预测、灾害预警、海洋数据、紧急救援等等。下图是目前该公司的发射基地，坐落于新西兰的玛希亚半岛。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_166_0.png)


    另外一家是法国的 Arianespace。这家虽然没有为广大中国人所熟知，但他却是全球第一家商业发射公司，早在 1980 年就已经开始运营了。公司比较知名的火箭比如重型
    Ariane 5，中型 the Soyuz-2，轻型 the Vega 等等。


    在 2004 年的时候，公司在发射卫星到地球同步转移轨道（geostationary transfer orbit，GTO）的市场上还占有 50%，之后由于来自新秀
    Space X 的不断挑战，市场萎缩。再之后 Arianespace也不断向欧洲航天局喊话，请求补贴来对抗 Space X 的竞争，而且不断降价和缩紧成本来加强它的竞争力。但作为私人航天的“老前辈”，还是有很多我们需要学习的地方。


    老师，今天讲了国外的火箭领域的研究，重点在能源、发射、政策和投资。

    那有没有卫星本身的发展呢？比如更好的手机信号？


    关于卫星有很多话题可以讲，针对你说的手机信号问题，也就是我们平常关心的通信卫星问题，是很大的一块。


    比如 Facebook 租赁的造价约 2 亿美 元的卫星 AMOS-6 就是为了给撒哈拉沙漠以南的非洲大陆地区提供网覆盖。也 是 Facebook 的项目
    internet.org 的一部分。


    当然 AMOS-6 后来出现 了一些状况，去 年用 Space X 擎天 9 号发射时不幸发生爆炸，但这是另外一回事。说明国际巨头在布局卫星互联的步伐没有停过。还有就像我们在正文里提到的，Space
    X 在去年 11 月给美国联邦通讯委员会（FCC）递交的申请中提到了关于全球互联接入的宏大计划。


    这个计划分两步走：


    首先，向一个轨道高度发射 1600 颗卫星，然后再发射 2825 颗卫星并将它们安置在不同轨道高度的 4 个壳层中。大致的高度在 1150 公里到 1175
    公里。


    比如下图显示了 1150 公里的高度卫星所能覆盖的范围，大致是一个宽度为 1060 公里的椭圆，这大概相当于北京到上海的直线距离，这是一个卫星覆盖的范围。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_166_1.png)


    Space X 计划书也透露了一些有意思的信息。比如，通过卫星覆盖，把全球其他地方 42 亿因为种种原因没法上网的人，可以通过卫星上网，为全球每一个用户提供
    1G 的带宽，相当于目前全球人均网速的 200 倍。


    还有就是终端设备要求很低，一般情况下，目前的通信卫星终端设备可以接入安卓系统、车载等，而 Space X 采用的相控阵天线设计对用户所用终端的要求很低，这些终端很容易安装在墙面或屋顶，操作也很简单。


    再有就是上网更便宜，Space X 在设计这个系统时考虑了成本效率和可靠性，从设计和制造位于太空和地面的各种设备，到'
