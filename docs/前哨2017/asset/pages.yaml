  md: '![](img/b82c97eb199a9276887cadbbbaa84d1f_19_0.png)


    车将和万世万物相连接，简称V2X。5G马上要到来了，而支持5G的硬件，高通也已经发明出来了，但这些仍然属于基础设施，只是底层。高通的CEO提出创新的革命，当5G基础设施到来时，我们每个人都可以成为创新者，将5G作为工具，设计和建设还没有出现的世界。


    以上是高通主题演讲的分享，希望我们能够一起设计和建设出更美好的世界。


    我是王煜全，您的全球科技前哨侦察兵。今天是前沿侦察的第209天。


