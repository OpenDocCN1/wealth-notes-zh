  md: '# 科技概念股｜未来个人投资的突破方向


    未来个人投资的突破方向 ↓


    王煜全


    今天将继续为大家介绍智能资产管理，主要讲述整个智能资产管理的现状以及未来个人投资有机会突破的三个方向。


    以下是干货笔记，完整内容欢迎收听音频。


    # 智能投顾创业公司业绩还能增长


    未来会有越来越多的传统金融机构进入智能资产管理领域，甚至银行都会把智能资产管理作为标准配置提供给客户，Wealthfront这类创业公司的竞争压力并不会缓解，但依靠少收甚至不收交易费、管理费的互联网惯常打法，业绩依然能够增长。


    例如，国外股票交易中间平台也要收取佣金，而使用新型创业公司Robinhood的app进行股票交易并不需要佣金，除非是高端客户的特殊安排。这虽然限制了它的利润，但可以实现低成本扩张，提供给高端客户的服务已经使它有足够本钱去和传统大交易平台竞争。


    未来智能投顾的交易费还会进一步下降。


    # 智能投顾局限于被动的指数基金


    最关键的问题是投资顾问的局限性太大，为了保证建议的有效性，也为了用户投资后能获取稳定利润（低风险），Wealthfront这类公司主要业务并不是推荐股票，而是推荐ETF（Exchange
    Traded Fund，交易所交易基金），国内称作“交易型开放式指数基金”，它的风险相对低，流动性高，可以立即套利或迅速避开。


    美国ETF规模高达2.7万亿美元，现在还在迅速扩张，今年新流入超过1600亿美元，上月被批评是大规模杀伤性武器，抬升整个股市。如果大家都投资ETF，看似每个人都很保险，但从整体来看，反倒不再保险。


    中国的类似情况是创业公司主推理财产品，2012年10月12日，时任中国银行行长的肖钢在《中国日报》上批评很多理财产品类似庞氏骗局，需要我们警惕。


    现有的很多智能投资顾问只推荐无风险基金，而这些基金主要是被动式的指数基金，大量资金涌入导致其风险上升。


    > 庞氏骗局：对金融领域投资诈骗的称呼，很多非法的传销集团就是用这一招聚敛钱财，这种骗术是一个名叫查尔斯·庞茨的投机商人“发明”的。庞氏骗局在中国又称“拆东墙补西墙”，“空手套白狼”。简言之就是利用新投资人的钱来向老投资者支付利息和短期回报，以制造赚钱的假象从而骗取更多的投资。


    # 主动投资股票基金


    主动的资本管理更为有效，但要证明自己的管理能力几乎是不可能的，唯一可参照的是历史业绩。但投资参与者会影响市场走向，也会影响竞争者，而且大机构收管理费就早游获保收了，很难有内在动力继续提升投资水平，而且名气可以保持很久。


    所以历史业绩好的机构往往迅速扩大招致惨败、或者变得愈加平庸，也有可能为了维持优势而控制基金规模，逐渐变为只给自己管钱。


    例如股神巴菲特的公司现在基本是自己控股，严格限制基金规模；当然，当年巴菲特刚出道时，你也很难慧眼识别出股神。


    巴菲特现有公司名为伯克希尔哈撒韦，前身是纺织公司。1962年，研究股票的巴菲特发现一个规律，这家公司每关闭一个旗下的纺织厂，股票就会上涨，巴菲特就趁关闭时机买进，但忽视了整个纺织业的下滑，结果巴菲特被套牢。当时的CEO答应应回股票，结果食言只给低价，巴菲特生气之余干脆把公司剩下股票全部买走，直接控股，并开除了食言的CEO。


    主动投资管理的曝光是人工智能投资公司，例如Ben Goertzel（通用人工智慧协会主席，Hansonrobotics汉森机器人公司首席科学家）的Aidyia公司，用人工智能算法来做股票投资。但从量化交易的Considering
    history，最後依然会转变为基金形式，无法惠及所有人。


    普通人有望参与的是之前提到的智能算法平台，例如Quantopian和中国的优矿。


    Quantopian把所有上市公司的开放数据进行整理，便于使用者基于这些数据做算法，并利用历史数据校验，以此预估未来股票走势并进行交易，从而获得更高利润。据称利润已经得到一些验证，人工智能算法的交易确实回报更高。


    但我认为好的算法很可能会迅速被大基金吸收，普通人依然用不上；除此之外，平台本身的盈利性也难以保障。


    # 公司股权投资


    股权投资利润巨大，风险也未必高，但问题是门槛太高，大众无法参与。我认为随着众筹的兴起，有望改变这个格局。最近吴晓波的“企投家”概念特别好，值得深入发掘和设计。


    股权投资平台有机会，但平台上融资的企业往往是模式型创新企业，一旦成功，回报很高，但成功率低、风险高，所以我投资了AngelList（世界上最大的股权投资平台），但没有投资平台上面的公司。


    # 总结


    未来个人能够参与的投资主要有三个方向：


    第一，被动的指数基金。智能投资顾问公司能够提供合理建议，但由于越来越多的人购买被动基金，业绩也会下降。


    第二，主动的股票基金。关键需要选对好的管理团队，但事先很難慧眼识珠。


    第三，股权投资。除了前期识别难度大，更重要的是投资门槛过高。


    资产管理功能正迅速下降到中产阶级，引爆了这个万亿级的市场，新的模式可能造就未来的金融巨头。机会诱人，关键在于创新能力，希望中国创新能够走在世界前列。


    王煜全


    今日思考：对于未来个人投资的方向，你有哪些自己的思考？欢迎到留言区写下你的看法。'
