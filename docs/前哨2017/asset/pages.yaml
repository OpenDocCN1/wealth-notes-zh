  md: '# 科技概念股 | 人工智能芯片的现状与未来


    人工智能芯片的现状与未来


    王煜全


    今天是科技概念股第十三期，我将给大家做通俗易懂的人工智能芯片介绍，因为人工智能在2017年将会持续大热，所以人工智能芯片也会备受关注。


    以下是干货笔记，完整内容欢迎收听音频。


    # 发展人工智能芯片的原因


    传统计算架构无法满足人工智能需求：传统计算架构是串行处理；但人工智能模仿大脑结构（深度神经网络），是超低能耗的并行处理结构，对于上亿次的并行，传统的串行计算结构无法完成。


    # 目前的调整方式


    # CPU加异构计算：核心部分采用传统CPU（串行处理结构），将可重复的简单计算分离出来，采用并行处理结构。


    异构计算部分，全球目前有以下几种类型：


    第一种——


    CPU+GPU，例如谷歌AlphaGo战胜李世石；与此同时，CPU数量也需要增大且具有一定的并行能力，例如因特尔提出的MIC（Many Integrated
    Core）多个集成核心，但它依然只是一个相对简单的中央处理程序。


    GPU的主要提供者是Nvidia和AMD，AMD推出了一个领先世界的框架——APU，将CPU和GPU整合到一个芯片上。


    第二种——


    CPU+FPGA，例如大疆无人机采用了Lattice公司提供的FPGA。


    FPGA的主要提供者是Xilinx、Altera、Lattice。


    第三种——


    CPU+ASIC，这个模式更加专业化。


    ASIC的主要提供者是Movidius和创业公司 Nervana，Movidius 提出了 VPU（Visual Processor Unit），专做视觉处理。


    ASIC是专为人工智能设计的集成电路芯片，比FPGA效率高、省电，更适合服务于人工智能应用或其他特定用途。例如Mobileye现在的目标是打造出专为自动驾驶使用的人工智能芯片；谷歌做AlphaGo，开发出TPU（Tensor
    Processing Unit），和它的TensorFlow人工智能算法相匹配，使算法最优化。


    第四种——


    CPU+DSP（Digital Signal Processer），更适合处理流媒体信号，例如TI、Freescale、CEVA。


    DSP的主要提供者：CEVA是领军企业。


    # 将来的发展趋势


    # ASIC，针对人工智能的特定芯片开发


    例如谷歌的TPU，Nvidia的Tesla，Wave Computing，Kneron，中国的寒武纪、地平线机器人。


    # Neuromorphic Cumputing


    未来Neuromorphic Cumputing模式会打破异构计算的 powietrza，它由加州理工的Carver Mead教授提出，现在的主要研发者是IBM和高通，还有海银资本本投资的Neuralla。


    Neuromorphic Cumputing的设计思路是去掉了CPU部分，核心处理部分完全改为并行结构。随着对大脑的认识进步、计算机研究进步，形成了更加类脑的计算能力Neuromorphic。


    # 发展神经网络芯片的原因


    +   1. 网络延迟无法满足需要实时反应的应用需求，例如自动驾驶辅助、安防监控。2. 网络带宽有限,如果未来把大量的本地数据传送到网络侧处理，会加剧网络交通堵塞。3.
    把所有数据传回云端，存在数据安全问题，一旦数据在传输过程中被劫持，后果就很严重。最好的办法是将更多的内容放在本地进行处理。


    我认为，下一阶段随着人工智能的普及化，计算能力又会向手持终端偏移。未来的计算能力发展，终端与网络侧将互此消弭长的态势，互相促进发展。


    # 创业者的窘迫与出路


    +   1. 目前创业者还没有足够能力做此类前沿技术的开发；2. IBM和高通已经做了前瞻性布局，一旦成功，就会立即将创业公司淘汰；3. 传统巨头重兵布阵，例如因特尔在2015年以167亿美元收购Altera（FPGA领域全球第二大企业），又在2016年8月以4.08亿美元收购Nervana（专为人工智能计算做ASIC结构），去年9月以3.22亿欧元收购Movidius（提出VPU，是视觉处理方面的黑马）；4.
    直接做人工智能芯片的企业，不如本身在一定应用领域有所专长、并做好该领域需求的人工智能芯片开发的企业，例如Mobileye和大疆。


    人工智能芯片领域，看似蓝海，但实际要比拼科技水平、资金实力、产业链协调能力，对初创公司来说困难重重。


    我认为，2017年人工智能芯片会得到持续关注，创业者如果能秤与应用相结合，做专用性更强的人工智能芯片开发，将有机会突出重围。


    以上是人工智能芯片相关内容的 Steak 部分，我们对人工智能芯片市场做了总的回顾，明天的下半部分将为大家介绍在人工智能芯片领域的领导性企业。欢迎大家持续关注。


