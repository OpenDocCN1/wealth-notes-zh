  md: '# CES展・第7期｜会讲故事的Under Armour


    会讲故事的Under Armour


    王煜全


    今天是CES系列报道的第7期，我想继续和大家分享一个主题演讲。这一次的主题演讲嘉宾不太一样，不同于往常的汽车公司、科技公司，它是一家运动服装公司——Under
    Armour（安德玛）。


    这一期的主题演讲是由Under Armour的创始人Kevin Plank发起，他在21年前创立了Under Armour。这一次来到CES展会，不仅带来了新产品，他的演讲技巧也值得其他技术公司借鉴。


    以下是于货笔记，完整内容欢迎收听音频。


    # 现有的竞争对手


    虽然Under Armour公司成立只有21年，但骄人的业绩不少。如今，Under Armour有14,000人的团队，全球收入有40亿美元，市值已经达到了125.9亿。市场上，它的两个主要竞争对手分别
    üst大家熟知的耐克和阿迪达斯：


    1964年成立的耐克，全球收入有320亿美元，是Under Armour的8倍。由于Under Armour主要在北美发展，没有做太多的国际化扩张，而耐克的北美收入只有150亿美元。所以，这些年很多股票分析师一直有些唱衰耐克，力挺Under
    Armour，因为Under Armour的成长速度实在是太快了，仅有20年的时间，逐渐地追近了一个有五十多年历史的企业。


    另外一个竞争对手是1949年成立的阿迪达斯，全球有55,000人的团队，但全球收入只有159亿美元。


    数据显示，运动服饰中的两大巨头还是面临着Under Armour所给予的压力的。


    一般情况下，在CES展会中做主题演讲是需要实力的。所以，即使Under Armour不是一家纯粹的技术公司，但它懂得如何讲故事。这也是我今天想要分享的演讲重点：技术公司应该多向消费品类的公司学习说说、讲故事的能力。


    虽然我们知道运动品牌的确需要一定的技术支持，但是它主要还是一个消费品类的公司。所以即使它自称自己是技术公司，但和类似高通、英特达、英特尔等硬技术公司相比较，还是相对弱了一些。


    但Under Armour的优势在于它懂得讲故事，这无异于如虎添翼。这一次的CES演讲，甚至可以作为一个示范案例，供更多技术公司学会演讲的技巧，学会这项技能，对于技术公司来说绝不是什么坏事。


    # 数据是公司发展的新能源


    如今，Under Armour正在积极地引入各种技术，Kevin Plank在演讲中提及的Connected Fitness Platform（联网的运动平台）让我印象深刻。这个运动平台是目前最大的数字健康社区，社区中有若干个小应用，例如：UA
    Record（使用Under Armour服饰后的运动数据记录）、Map My Fitness（用图标标注出运动轨迹）等。


    Under Armour的CEO认为数据已经成为了公司发展的新能源，如果一家公司想要有持久的动力，就必须要利用数据作为能源。这便是这款联网运动平台被开发的原因。


    而正因为有了大数据的支持，所以Under Armour提出了一个全新指标，叫SDOC（Single Deal of the Consumer），有了大数据，我们得以能够对每个客户做深入的分析，而若要跟踪到每个客户的每一单交易，就不能只是一个笼统的统计，而应该是通过对每一个细节的数据汇总，以此来形成对整体的理解。


    在演讲中，为了将这种理解呈现得更通俗易懂，他还做了一系列的演示。


    Under Armour推出了一款新的运动鞋，运动鞋内置了电子传感器，能够衡量肌肉疲劳程度，同时可以将数据上传，使得肌肉疲劳程度的数据可以被用作大数据分析，然后将结果智能地反馈给用户。这样用户便可以随时掌握自己的疲劳程度，从而改善运动的节奏和频率。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_21_0.png)


    Kevin Plank在演讲中对这一产品还作了相关的背景阐述：


    > 你应该学会更聪明的运动方法，我们的肌肉疲劳是我们无法感知的。有时候，我们的身体感觉到了疲劳，但实际上肌肉未必疲劳；有时候，我们肌肉疲劳已经到达了一定程度，但是我们身体却无法感知。所以，肌肉的疲劳需要通过传感器才能最准确地被感知。


    而Under Armour带有传感器的跑鞋，只要你跳一下，跑鞋内的数据就会传送至云端，将数据进行分析并且发送给你。这样，人们就可以通过具体的数据了解自己的肌肉疲劳程度了。


    Under Armour不愧是一家非常棒的消费类公司，它甚至请来了著名游泳选手菲尔普斯为大家作示范。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_21_1.png)


    # 懂得讲故事让技术公司如虎添翼


    Under Armour和约翰霍普金斯大学一起做了关于睡眠的研究，它们强调了人体就是一个生物钟，应该有规则的睡眠和休息，才能让身体达到最好的状态。


    为了说明睡眠的重要性，Under Armour请来了Huffington Post（《哈芬顿邮报》，美国非常著名的社交媒体）的创始人Arianna Huffington，她被认为是美国最成功的女性创业者之一。Arianna
    Huffington最近辞去了CEO的职务，组建了一个新公司，专门帮用户改善健康。


    当Arianna Huffington在台上作分享时，其中的一个小细节让我印象深刻。她讲了一个美国著名的橄榄球运动员，Tom Brady的例子。Tom Brady是新英格兰爱国者橄榄球队的四分卫，他的运动生涯非常长。


    我们都知道，在长期剧烈运动的情况下，运动员多多少少会身体受伤，因此运动生涯往往比较短。但Tom Brady岁数很大了却仍然在球场坚持，而且成绩非常出色。而他的秘诀恰也来自于对睡眠状况的关注，Tom
    Brady的生活非常规律。


    通过这则小故事，Under Armour展示出了睡眠周期的重要性。Tom Brady的睡眠周期，从周一到周日，起床时间和睡觉时间基本上都保持着规律性。


    对此Under Armour的CEO，Kevin Plank的睡眠时间分布图来看，Kevin Plank作为创业者，睡眠时间是非 常零乱的。


    故事讲到这里，便迎来了Tom Brady的分享，Tom Brady表示，作为运动员仍然保持着良好的睡眠，正是因为他用了一款远红外作布料的床单。


    远红外的布料有什么特点呢？它能够吸收远红外，让身体保持温暖。但Tom Brady表示，这个产品有不足的地方，他认为仅有床单是不够的。因为床单只是垫在身子底下，并不能完全保证睡眠的舒适度。并且在演讲中对Kevin
    Plank发出提问：你能不能研发一个新产品，让我们每个人都有更好的睡眠呢？


    故事讲到这儿，该抛出产品答案了，Under Armour的CEO Kevin Plank说，以上的问题实际上是在两年前，Tom Brady向他提出的。


    于是，Kevin Plank经过两年的时间，将精力都集中于研发并推出新产品——Recovery Sleepware（远红外的睡衣），并且在演讲当天，将此产品作了发布'
  merge: -1
  img_proc: true
- pgno: 22
  md: '衣），并且在演讲当天，将此产品作了发布。


    到这里，大家才对这场演讲的整体流程恍然大悟，原来他只不过是要推出一个新产品，却绕了一个如此大的圈子。而这也正是Kevin Plank高明的地方。


    试想，如果Kevin Plank一上台就推出新产品，效果估计不会太好，但是Kevin Plank利用了几个例子将产品更加巧妙地展示，大家便都会认为这款产品是为了响应橄榄球运动员Tom
    Brady的呼吁而推出的。而Tom Brady的呼吁，更是建立在自己曾经获得的受益之上的，因此更令人信服。


    技术是产品的必要条件，但并不充分，如果要让用户更加充分地了解产品，还需要为产品附加一个具有想象力、可以自传播的故事。我觉得，这是大部分演讲可以学习的地方。


    23人笔记


    很多产品如同Under Armour公司的产品一样，是具有可传递的情感的。若你只谈数据参数和各类指标，消费者未必能够清晰地感知。所以，将理性的数据转换成感性的用户感知，往往能够达到更好的效果。


    以上是给大家分享的一场演讲的呈现形式，作为技术公司，Under Armour有值得学习的地方，我相信这也是Under Armour能够如此迅速进步的一个重要原因。如果你是创业者，在产品发布时不妨也试试如何讲好一个故事。


    我是王煜全，您的全球科技前哨侦察兵。今天是前沿侦察的第211天。


