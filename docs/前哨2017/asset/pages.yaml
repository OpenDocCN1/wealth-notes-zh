  md: '# 创新地图 | 超声波3D打印技术


    超声波3D打印技术


    张柳健，曾任Renault Sport声学工程师，法国普瓦捷大学博士生，研究高速流体产生漩涡及产生的声音。


    3D打印近年来十分火热，这个词最初是由MIT发明的一种快速成型技术的名字，旨在短时间内制造出CAD文件所绘的产品。3D打印也叫做增材制造，一个与传统的减材制造相反，利用3D模型数据，通常以逐层堆叠累积的方式将材料连接起来构造物体的过程，可以用来制作传统的冲压、铸造、车床等减材工艺难以制作的零部件，进行小批量的生产作为传统工艺的补充。


    而近期，美国的Fabrisonic公司推出了“超声波增材制造”工艺为核心的工业金属3D打印机。这是一种类似将传统的减材与增材相结合的技术，即采用超声波焊接层层放置的金属箔得出大致形状（3D打印增材过程），然后用铣床切割（传统减材过程），以得到最终零件。这种技术比传统工艺省料，与3D打印技术相比，相同成本下成型件表面更光滑。


    之前，Fabrisonic公司推出了两款超声波3D打印机：SonicLayer 4000和7200。去年3月份，他们升级了超声波3D打印机，使其可以在普通平面3D打印的基础上再增加一个维度：在圆柱体表面进行3D打印。也就将金属层通过超声波增材制造工艺焊接在圆柱体形状的零件表面。这种工艺主要将应用于为各种圆柱体零件、轴、管的外表面添加贵金属层或其他金属特征。最近几年他们一直在开发超声波3D打印所需要的材料。去年12月份，他们声称其使用超声波增材制造工艺的金属材料，拉伸强度达到部分钢的水准，但重量与同体积的铝差不多，这对于对重量很敏感的航空航天工业来说是个好消息。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_188_0.png)


    其实，对于3D打印，人们首先想到的就是粉末在激光加热下凝结成物体。而这位于俄亥俄州的Fabrisonic公司则采用金属箔薄膜，逐层添加，然后增加一些减材加工，以实现良好的精度。虽然Fabrisonic才成立于2011年，但已经开始为NASA、波音等客户提供服务，供应钯、稀土、钛、钨等材料的打印服务。Fabrisonic现在更多的是通过制造服务而不是卖设备获得收入。2016年NASA兰利研究中心与Fabrisonic公司合作，使用Fabrisonic的超声波3D打印机将传感器嵌入到金属零部件中，以长期监测零件的温度、速度等变量。


    # 1.超声波增材制造技术历史


    超声波增材制造是一种基于传统加工工艺“超声波焊接”的技术。超声波焊接是指利用超声波的振动能量使两个需要焊接的表面摩擦，形成分子间融合的一种焊接方式。超声波增材制造就是将这种焊接方式应用到3D打印机上形成新的3D打印工艺。


    在连续的超声波振动压力下，两层金属箔之间会产生高频率的摩擦，而在摩擦过程中金属表面覆盖的氧化物被剥离，进而通过超声波的能量辐射（或外部加热）将较为纯净的金属材料软化填充至已焊接完毕的金属箔片的表面，在这个过程中，两片金属箔片的分子会相互渗透融合，进一步提高焊接面的强度，因此也就更加地保留其原先材料的机械性能，而后周而复始，层层累加，最终成型。此工艺不同于以往的3D打印的熔融机制，其超声波驱动器对箔施加超声波振动，产生的震动摩擦去除表面氧化物和污染物，同时新的薄片填平原来表面的粗糙，并在压力下瞬时结合形成新表面。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_188_1.png)


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_188_2.png)


    超声波增材制造技术最初于1999年被福特的研究人员Dawn White发明，随后Dawn White建立Solidica公司将超声波增材制造技术商业化。2007年，爱迪生焊接研究所(EWI，一家致力于开发、测试和实施业界先进制造技术的非盈利性工程和技术组织)和Solidica开始合作，开发了更高效的超声波3D打印材料。而后2011年，EWI与Solidica合资创立了Fabrisonic并进一步开发该技术，将改进的超声波增材制造工艺商业化，目前也是唯一一家使用该技术的公司。Fabrisonic还得到了Ohio''s
    Third Frontier基金的支持。公司创始人兼首席执行官Mark Norfolk毕业于俄亥俄州立大学，学的是焊接工程，在创办公司之前就在EWI中领导开发超声波3D打印技术。而现在Fabrisonic公司就位于俄亥俄州立大学校园内一个1.5万平方英尺的工厂里，并和俄亥俄州立大学展开合作。现在其使用的薄金属条是委托一家叫做U.S.
    Foils的公司生产的，而SonicLayer 4000和7200两款机器则由同样位于俄亥俄州的Ultra Tech Machinery公司制造，Fabrisonic公司仅贡献专利。由此可见，Fabrisonic公司深深扎根于整个美国制造业，有助于其更早地步入商业化。


    # 2.超声波增材制造优势


    超声波增材制造技术的最大优势是在低温下就可以进行3D金属打印。Fabrisonic的超声波3D打印平台工作温度通常小于金属基体熔融温度的50%，因此具有将多种金属类型连接在一起的能力，允许温度敏感材料的嵌入，例如我们能够在打印过程中直接嵌入传感器。而整个工作过程是低温的，也不会损坏传感器。这个过程像是为传感器打造金属保护壳，可以减少对传感器的维护成本，解决由于腐蚀、磨损和冲击等原因而带来的老化失效，延长使用寿命。


    而超声波增材制造低温的特性可以更多地保留原材料机械性能，也不会产生热残余应力和热变形。例如，在使用铝的过程中，最高温度低于120°C，由于材料仅被稍微加热，所以材料不会改变晶粒尺寸及产生相应的变化。其生产的零件内部不会产生热应力，也就不需要对零件进行后期处理。可以大大减少生产零件的周期，降低公司的库存压力。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_188_3.png)


    举个例子，2016年，NASA兰利研究中心与Fabrisonic公司合作，使用Fabrisonic的超声波3D打印机将FBG传感器嵌入到金属零部件中，以长期监测零件的温度、速度等变量。FBG是一种可以精准地测量位移、速度、加速度、温度的传感器，主要应用于桥梁建筑、航空航天、石油化学工业等领域。普通的金属3D打印过程中会产生高温，这会导致嵌入的FBG传感器失去敏感性。而Fabrisonic公司的超声波3D打印机在整个制造过程中，温度始终低于94°C，在这样的温度环境下嵌入传感器可以避免传感器被损坏。经过NASA兰利研究中心的测试，嵌入到零部件中的传感器可以正常完成检测任务。'
