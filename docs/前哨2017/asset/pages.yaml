- pgno: 15
  md: '自动驾驶除了替代人，现在看来还有一个大好处是帮助人。NVIDIA的董事长黄仁勋讲到，不仅可以做到车外的智能（让车能够在路上智能的行駛），也可以做到车内的智能（能够监控驾驶员的状态）。例如驾驶员长时间抬头偏向一边，没有看向前方，汽车就可以提醒他；甚至可以监控驾驶员的眼睛，发现他在犯困，就提醒他赶紧下车休息。所以驾驶汽车中的行为都会被记录，变成大数据，然后用来指导开车的人，使驾驶更安全。


    所以，人工智能实际有两条路，一条路是替代人，而另一条路是协助人，使人变得更强大。人机结合，甚至会超越机器。目前的自动驾驶，主要是替代人，但未来很有可能是协同人，让人有一个更安全的驾驶环境。如果人机结合可以比机器做的还好，那就应该把人介入进来。


    # 有趣的提问


    # 1、网络安全


    2017年是网络安全很重要的一年，以前担心病毒，而现在更担心被控制。当你开车时，车的系统如果被黑客控制会非常危险。


    # 2、成立与政府交流的组织


    美国的传统车厂组织了非常强大的集团，用于游说政府（包括汽车企业的新研究、推出的新成果、对相关法律法规的诉求）。目前自动驾驶汽车厂商也已成立了相关组织，与政府进行交流，针对自动驾驶相关规定的修改，希望允许更多的自动驾驶汽车上路。


    消费者了解和学会使用自动驾驶很重要，相关法律法规的制定也很重要。例如未来交警看到一辆自动驾驶的汽车在路上行驶，而人在后座睡觉，他是否应该把这辆车拦下来开罚单，这都是规则来制定的。所以，交通规则要有相关的修改。


    这也是中国汽车业很薄弱的环节，我们的企业普遍没有和政府进行相关交流的心态。这其实不是和政府讨价还价，因为作为从业者，我们对未来更加了解，那就应该及时把未来可能发生的情况和需要调整的法规跟政府做沟通。比如：


    滴滴打车作为新经济的代表，应当更加积极主动去沟通，使相关部门了解你的进展、配合你做一些规则上的修改。这对所有的新经济排头兵和创业者来说，是很重要的义务。


    在海外投资的创业企业也都经历过类似的事情，例如Angelist，以前美国在网络上众筹是不合法的，所以Angel Bundestag积极向美国相关政客游说，最后通过了新的法规，使网上众筹变成了合法。


    还有我们投资的飞行汽车公司Terrafugia，以前小的创业公司想做飞机的设计和试飞都非常难，但Terrafugia的CEO卡尔经过各种努力，最终通过了美国立法，使小创业公司也可以研发飞行汽车了。


    这些例子都提醒创业者，必须有足够的眼光和胸怀，有足够的战略布局能力，同时也要有与政府、公众沟通的强大能力。


    # 3、是否能够跳过3级自动驾驶


    目前的自动驾驶还没有达到3级的，我们都知道达到第3级非常难，所以能否直接跳到第4级。福特首席工程师的回答让人兴奋，福特已经准备放弃第3级，直接做第4级。


    我们之前提到2020年是自动驾驶的关键节点，很多自动驾驶汽车的技术在那一年要推出更新一级的技术，3级或者4级。结合福特首席工程师所说的话，2020年福特一方面将推出它的新一代车，而另一方面可能会跳过3级，直接推出4级自动驾驶。


    # 我的听后感


    一方面，还有很多新东西需要我们探讨，自动驾驶和传统驾驶确实相差甚远。另一方面，我也很自豪，国内已经做过关于自动驾驶的相关研讨，例如驭势科技的吴甘沙老师给大家做过分享，大家一起讨论了自动驾驶的未来趋势。


    总的来说，中国在前端科技和前端科技如何影响社会形态、影响法律法规监管等方面，已经很前瞻了。而且，讨论的深度、广度、复杂度甚至超越了国外。


    因为我们中国更鼓励创新，对创新的行动和思考都更积极，更坚决。所以听了讲座，有了收获，同时也坚定了信心，只要中国持续不断地关注高科技、投入高科技、经营高科技，我们一定能够在世界上占有非常强大的地位，最后成为全球科技的领跑者。希望我们所有人一起努力，能让这一天早点到来。


    以上是在CES展上听完自动驾驶汽车讲座后的感想，与你分享。


    我是王煜全，您的全球科技前哨侦察兵。今天是前沿侦察的第207天。


    王煜全


