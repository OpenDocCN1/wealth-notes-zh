  md: '# 周末问答 | 电子竞技未来前景无量


    电子竞技未来前景无量


    王煜全


    昨天介绍互联网女皇 Mary Meeker 发布的“2017年互联网趋势报告”里提到“游戏是对未来人机互动的准备”，我非常认同，未来人适应世界的最核心的能力就是人机互动，即人类的机器智商，所以无论从事任何工作，我们一定要通过游戏互动提高自己的机器智商，学会驾驭人工智能。本周的问答正好也基本都和电子竞技相关，大家对这类面向未来的行业关注较多。


    以下是干货笔记，完整内容欢迎收听音频。


    今年第21届机器人世界杯将在日本举办，包括中国队在内的世界很多队伍都会参加。关于组织大家共同参观这场盛事的行程安排是怎样的？


    王煜全


    机器人世界杯日本游学“亲子团”已经开始报名。


    报名方式：在“全球风口”微信公众号回复关键词“日本游学”，查看详细信息。


    行程安排：7月底，“前哨”将联合创客教育机构“少年创学院”，邀请10组家庭，和我一起参观名古屋 RoboCup 机器人世界杯，同时一起体验日本的 STEAM
    教育。行程共计6天，可以让孩子们在实践中体验科技创新的乐趣，其间大家也有机会与参赛的优秀团队和教授交流学习，让孩子们开拓眼界、增加兴趣，未来成为能够掌握人类机器智商的高手。相信这是送给孩子最好的礼物。


    在体育、娱乐市场整体发展的情况下，电子竞技对标的是竞技体育还是娱乐，或者是二者的混合体？它部分替代的是谁的市场，又部分被谁影响呢？


    王煜全


    对标是谁不重要，这些市场是相互联通的，最重要的是对用户具有什么样的吸引力。例如微软的比尔·盖茨早在互联网刚刚兴起时就说过互联网是和电视竞争用户时间的，这和罗振宇所说的“未来只有两种产品”
    是高度一致的，即节省时间的产品和消磨时间的产品。例如《得到》中的各个栏目帮你节省时间，更高效地利用碎片时间系统学习；而电子竞技帮你消磨时间，这也是电子竞技、竞技体育、娱乐的目标市场。在让用户最快速度得到最大程度的满足方面，电子竞技无疑具有明确优势，未来的市场前景不可估量。


    读完老师的文章，我更关心的是电竞行业在世界如此受追捧的系统成因是什么？有没有其他行业也具备的精神服务特质是我们还未挖掘出来的？


    王煜全


    不仅是电竞，整个游戏世界都很吸引人，所以有人特意总结游戏吸引人的原因 并 形成了 “ 游戏化（Gamification）” 这门学问。


    相关的深度阅读，建议参考 Mary Meeker 的2017互联网趋势报告里的游戏解读部分；也可以阅读 Jane McGonigal（一位美国女游戏设计师）的书《游戏改变世界（Reality
    is Broken）》，该书系统描述了游戏的作用和价值。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_217_0.png)


    看了别人的留言，再结合自己身边的所见所闻，电竞和游戏的主力军确实还是主要是学生。看到王老师文章里讲的国外主要是有高学历、较高收入的人群，感觉国内外的基本情况差距较大。国内电竞行业，如果主要群体还是目前我所理解的学生群体，那压力会大于潜力，叫好叫座，但不能变现的情况还是很难有变化。个人理解，请多多指教。


    王煜全


    现有游戏群体年龄未必低，80后已经有很多款游戏可玩，且80后玩家占用户比例相当高；高收入人群也玩游戏，只是不容易被看到而已。


    策略类游戏不需要太快的反应速度，但需要布局和思考，受到高学历和高收入人群的喜欢。不要通过自己的周边简单地判断市场，很多市场潜在于水下，必须有数据支持。


    叫好叫座一定能变现，未来游戏市场一定相当庞大，而市场的潜力也一定可以被充分兑现，详情参考当年的腾讯。


    王煜全


