  md: '# 产业理解 | 女性大脑，连接者的力量


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_103_0.png)


    女性大脑，连接者的力量


    王煜全


    上周的产业理解时间介绍了黑天鹅行动，这周接着讲其中的关键长板——连接者。实际上女性很适合做连接者，今天我们将结合积木式创新理论，探讨“连接者”的巨大价值。


    以下是干货笔记，完整内容欢迎收听音频。


    人工智能时代来临，很多重复性的工作会被机器替代，只有创新者、整合者（模式识别者，能够从多个错综复杂的环境因素中找到发展规律，目前人工智能无法做多项因素交叉分析）、连接者（机器无法相互理解和协同）幸存。


    # “女性大脑”更适合成为连接者


    +   1、创新者和连接者没有性别限定


    例如，美国纪念环球女飞行员Amelia Earhart；很多男性交友广阔、擅于倾听。


    +   2、从思维方式定义男性、女性


    现代心理学理论认为男性和女性、狩猎和采集的区别更多是心理上的，而非生理，即应当是男性大脑、女性大脑的区别。


    例如，有人认为贝克汉姆是男性身体、女性大脑，因此细腻合群，是连接者。


