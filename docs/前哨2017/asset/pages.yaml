- pgno: 181
  md: '型电子设备（如蓝牙）来远程监控我们的健康情况，并且在必要时进行治疗。


    # ——♦ 未来挑战 ♦——


    生物电路使人体信息可以更高效地被整合到数据网络中，令实时监控和自动化医疗成为了可能。不过，这项技术在商业化之前还需要克服一系列的难题。


    # 第一个难题便是该系统的工作范围。


    无论是检测还是基因调控，检测物和细胞必须非常靠近电极从而与壳聚糖膜上的氧化还原分子发生反应。


    换句话说，现实实验室阶段的生物电路系统的工作范围非常小，仅不到1厘米。如何增加工作范围或者找到与现有工作范围匹配的应用，是一个挑战。


    # 另一个难题是生物电路系统的稳定性。


    该系统的关键氧化还原分子，仅依赖物理方法聚集在壳聚糖膜中，随着时间推移，这些分子会不断从膜中流失。一旦失去这些分子，生物电路便无法工作。如何保证系统的稳定性也是商业化之前必不可少的。


    这项研究从长远来看意义非凡，不过该技术仍处在实验室阶段，距离真正意义上的实用化阶段还有很长的路要走。


    王煜全


