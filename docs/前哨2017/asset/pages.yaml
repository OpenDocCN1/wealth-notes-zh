  md: "# 春节特餐（一）| 科技与创新：时间与方向的游戏\n\n科技与创新：时间与方向的...\n\n# —— 前情提要 ——\n\n常听前哨的你一定知道，我常从很多行业的细节入手，解读科技的发展与行业动向。细节虽然琐碎，但只有对科技的细节有完全的掌握，才可能对社会未来的发展作出相对准确的判断。\n\
    \n正逢新春佳节，作为总结也好，换换口味也罢，这次我不从细节入手，以纵观宏观的方式为你梳理一下与科技相关的十大话题——科技与创新，科技与经济，科技与国际化，科技与社会，科技与就业，科技与教育，科技与城市化，科技与环境，科技与生命，科技与未来。\n\
    \n第一天，先来聊聊科技与创新的关系。\n\n# —— 时间与方向的游戏 ——\n\n# 创新有门道，科技平衡财富分配\n\n科技与创新这个话题已经从行业命题变成全民理念，那么创新是不是真的需要全民皆动、渗透到社会各个领域呢？\n\
    \n从整个人类社会发展的历史来看，创新属于边缘势力。以生物学的“进化稳定策略”来看，当大家都从众的时候，整个生态、社会系统会更假如定；当大家都创新的时候，整个系统变化的风险会增加。因此，首先可以肯定地说，创新有风险，并非方方面面都需要及时创新。那么，创新这块钢铁，应该用在哪个刀刃上？\n\
    \n科技是推动社会生产力的不二之选，创新应该用在科技领域。何以见得？《二十一世纪资本论》这本书里专门指出美国是“资本滚雪球”效应（有钱人更有钱，贫富差距拉大）的例外，为什么呢？因为美国有大量的科技创新涌现，使得整个社会的财富结构不断重整，产生了很强的流动性。随着先进科技的扩散，整个社会的效率提升，财富被重新分配，贫富差距也会缩小。\n\
    \n因此，可以说通过科技创新，可以达成推动生产力和平衡社会财富的双赢局面。\n\n# 善用科技，找好创新切入点\n\n提到创新，很多人会联想到业务模式创新。实际上业务模式创新由于不容易建立起壁垒，失败率非常高。\n\
    \n+   1. 社会变革产生的不连续性。\n   比如战争、改朝换代，欧洲或者日韩的跨国公司基本上都起源于二战之后。但是这类社会变革往往可遇而不可求，使得创业创新具有偶然性。\n\
    \n+   2. 人群的不连续性。\n   借着不同年龄段人群的特征和偏好的变化，把握创业机会。比如很多时尚品牌不断地兴起，迎合新兴的时尚人群的胃口。但是，这类人群的不连续性往往集中在时尚领域，不容易扩散到更广阔的行业领域里去，使得创业创新的周期被拖长。\n\
    \n+   3. 科技造成的不连续性。\n   即随着新的科学技术的突破带来了整个产业的转变，从而产生创业创新的机会。比如说蒸汽机、汽车、石油、电力、通讯等行业领域，都是随着新科技的普及而成就了一番事业。\n\
    \n综上所述，历史周期当中不连续性的最大机会来自于科技，掌握了先进科技，就意味着你有机会去创新。\n\n# 如何掌握科技？三招走遍天下\n\n+   1.\
    \ 全球的科技处于“积木式创新”的时代。\n\n+   2. 在别人的先进科技基础之上做应用层的开发。\n\n+   3. 新的科技带来社会行为转变的趋势形成之后，基于新科技，设计新的应用模式、业务模式也能够取得巨大的成功。\n\
    \n# 创业创新有风险，行业领域须看准\n\n# 创新基石 = 技术壁垒 + 产业变局\n\n# 企业不分大小，科技是第一生产力\n\n> 科技是创新的重要武器，而一项科技能否颠覆一个产业，是判断要不要进行创业创新的重要标准。只要看准方向，利用科技才能真正的推动创新的持续涌现。\n\
    *1笔者注\n\n以上是今天“科技与创新”的全部内容，明天为你继续解读“科技与经济”的关系。"
