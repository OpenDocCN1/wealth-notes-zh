  md: '# 科技概念股 | 中国企业积极布局人工智能芯片


    中国企业积极布局人工智能...


    王煜全


    经过两天的介绍，已经为大家解读了人工智能芯片的全球市场格局和重要的国际企业，今天将继续为大家解读中国企业在人工智能芯片领域的布局。


    以下是干货笔记，完整内容欢迎收听音频。


    # 互联网巨头专注搭建服务平台


    +   1、百度


    引进斯坦福大学吴恩达教授（原Google brain负责人，最早提出GPU帮助人工智能实现深度学习算法）担任百度的首席科学家，负责百度大脑的研究。除了研发算法、积累数据，同时尝试开发用FPGA打造AI，涉及硬件相关的研究。


    +   2、阿里巴巴


    阿里云的云平台有望和亚马逊AWS一争高下，但它并没有自己的硬件研发，仍然主要采用GPU；


    阿里巴巴声称触及量子计算部分，和中科院共同投资建立了量子计算实验室（位于硅谷中心地带），与英伟达公司合作频繁。


    +   3、腾讯


    打造深度学习、深度神经网络的平台 Mariana DNN（DNN是“深度卷积神经网络”的简称）；


    主要是业务驱动，然后逐渐加大投入，腾讯投资了很多人工智能公司并组建了多个研究团队和实验室，与此同时还收购了一批优秀的国内外公司，但大多集中在软件和应用层面上，没有涉及芯片的自主研发。


    # 创业企业积极成长


    正因为BAT三大巨头都是偏互联网、偏服务的，中国缺乏IT硬件巨头，所以在类脑计算的开发和设计上，给中国的小企业提供了巨大机会。同时，由于巨头缺位，小公司才有可能获得巨额投资。


    +   1、地平线公司


    2015年成立于北京，拿到了众多知名投资，创始人余凯（曾在斯坦福大学教授人工智能，是百度的自动驾驶项目之父，同时也是百度深度学习研究院的创办者），立志打造出面向未来的人工智能芯片
    NPU（Neural Processing Unit），并希望能在两大领域发挥作用：


    a.安 mitig 生平台，智能家居和智能玩具；

    b.雨果平台，自动驾驶的先进辅助驾驶系统。


    +   2、中科院的寒武纪芯片


    已获得科大讯飞的战略投资，并和上市公司中科曙光签订了合作协议。2016年3月，中科院计算技术研究所发布了全球首个能够深度学习的神经网络处理器芯片——寒武纪，课题负责人是两个亲兄弟——中科院计算所的陈云霄教授和陈天石。陈云霄的专业是芯片研发，在国际上享有盛誉；陈天石的专业是人工智能。


    目前已推出寒武纪1号（英文名 DianNao）、寒武纪2号（英文名 DaDianNao）、寒武纪3号（英文名 PuDianNao）。1号是面向神经网络的原型处理器结构，希望在终端上使用；2号面向大规模神经网络，在服务器端布设；3号是多种机器学习算法的多功能芯片。


    +   3、深鉴科技


    成立于2016年2月，得到金沙江和高榕资本的天使投资。首席科学家韩松一直致力于深度压缩技术研究，科研水平强劲。


    在去年1月已设计出基于DPU（Deep Processing Uni）的深度学习处理单元解决方案，从他们自己提供的数据来看，产品性能超过Nvidia，同时功耗和售价仅为后者的四分之一左右。


    +   4、Kneron


    创始人刘俊诚资历深厚，曾在UC Berkeley、UC LA、UC SD等名校学习，获UC SD博士学位；曾参与NASA的火箭推动中心JPT Baer Lab的项目研发；也曾在三星研发中心和高温任职。


    主要提供NPU（Neural Processing Unit）和配套的解决方案，除了芯片，也做智能算法研究。


    客户众多，包括国内著名的互联网巨头、台湾的著名代工厂、国内的手机通讯公司等。


    国内的软实力和台湾的硬实力相结合，是一条很好的发展之路。


    +   5、北京智能管家科技有限公司


    成立于2014年，在2016年4月宣布完成了由科大讯飞领头的1亿美元A轮融资。


    开发人工智能平台Roobo；提供架构在ASIC、DNN的云识别芯片，据说是国内第一颗商业量化的人工智能芯片；除此以外，还提供智能图像的芯片、整合本地感知和控制能力的人工智能芯片等。


    +   6、联咏科技、瑞芯微电子


    利用知识产权授权来生产芯片。


    # 上市公司积极参与


    +   1、科大讯飞


    过去几年投资了很多专攻AI芯片的创业团队，例如地平线、寒武纪、Roobo等；


    推出自己的嵌入式语音合成芯片模块，可以实现中文、英文的语音合成，并且集成了语音编码解码功能，可支持用户进行录音和播放；同时，创新性地集成了轻量级的语音识别功能，支持30个命令词的识别，并支持用户命令词定制需求。


    在智能客服、智能汽车、电视入口等方面都有良好布局。


    +   2、中科曙光


    除了合作研发寒武纪芯片，早在2013年，中科曙光就和捷生联发展战略合作，涉及图像识别应用；2015年，联手中科院计算所和Nvidia，共同建立了深度学习联合实验室，布局开拓中国的深度学习市场。


    +   3、北京君正和景嘉微


    开发相对通用的芯片。


    景嘉微市场较明确，拥有国内自主研发的首款GPU芯片，率先使军用GPU国产化。


    +   4、紫光国芯


    前身是同创国芯，主要提供FPGA，如果能量产，未来将大有作为。


    +   5、清华紫光


    承载着提高中国IT技术、尤其是芯片制造能力的重担。


    2013年底收购展讯、锐迪科、西部数据、闪迪、力成科技等公司；2015年11月向台湾发表科资料合作意愿；台积电的董事长张忠谋也表示，欢迎紫光集团入股。


    # 我的观点


    一方面，国家正在积极推动资源整合，把国内外芯片企业整合起来，使中国逐步具有独立开发、生产芯片的能力；另一方面，国际收购暂时未成熟，应当积极和台湾的电子企业合作，加快中国芯片领域的突破。


    希望中国企业能够抓准机会，实现革命性的变革，未来将大不一样。


