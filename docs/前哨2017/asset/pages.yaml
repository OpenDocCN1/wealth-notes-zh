  md: '# 科技概念股｜政务大数据（上）


    政务大数据（上）


    王煜全


    “前哨”的第一期是在2016年6月15日播出，所以本应在6月14日就结束第一季的内容。但是，6月14日是周三，为了保证完整性，我们还会做完这一周的完整内容。第一季完结后的节目内容主要是由前哨用户来分享他们的心得（参与方式见文稿下方）。很快前哨就会推出第二季，故请期待。


    今天是科技概念股之三十一——政务大数据。


    以下是于货笔记，完整内容欢迎收听音频。


    # 政府对科技产业的作用很大


    我们一直的观点都是政府应该在市场机制下对重点领域的企业进行支持。


    之前前哨有一句口号：投资先行，企业主导，政府支持。但有一个领域，政府的作用要比最起码的支持作用大得多，那就是大数据领域。


    # 大数据的特殊性


    +   1. 大数据的数据量很大。尤其随着互联网、物联网的发展，带来了大量有关人的行为的数据，这些数据会使我们对个体、群体、社会都产生更深刻的理解。为了避免隐私泄露，必须由具有公信力的政府负责“清洗”。


    +   2. 大数据是公共基础设施，要通过对数据的深度挖掘，才能找到应用价值。所以在商业公司对大数据挖掘时，必须要由政府来负责大数据系统的基础设施的建设和数据的存储，以及制定规则。


    +   3. 大数据往往也需要惠及多数人。这也需要政府做相对公正的判断和公正的监督。大数据的掌握者不仅比普通人更了解社会，也了解每一个人。同时他们也有机会左右舆论，甚至左右每个人的命运。所以需要政府强力介入，这些都是由大数据的特殊性决定的。


    # 数字化的时代，数据就是货币


    政府是大数据产业的第一批用户：美国最著名的大数据公司Palantir创立于2004年，2005-2008年间，CIA是其唯一客户。Palantir曾帮助CIA成功通过数据分析找到了本拉登的线索，进而海豹突击队成功地击毙了本拉登；还曾通过对各个银行系统、数据交易系统的综合分析，帮助各个银行追回了在华尔道夫诈骗案中被诈骗的几十亿美元财产。


    大数据产业的一个很大的特点就是：政府是数据的来源和数据的提供方，同时也是客户。由于大数据的特殊性，所以政府必须订立产业标准，才能使得这个产业良性发展。


    # 政府水平决定了大数据产业水平


    一方面因为整个大数据产业的一大块业务就是政务大数据，另一方面是因为大数据产业受政府的管制和影响。


    全世界都越来越重视大数据建设，我国也不例外。2017年5月17日的世界电信和信息社会日大会上，工信部总工程师张峰表示，我国将建设全国一体化的国家大数据中心，推动公共数据开放和基础数据资源跨部门、跨区域共享，提高数据应用效率和使用价值。可以预期，中国的大数据市场也会腾飞。


    据《2016中国大数据交易产业白皮书》统计，2015年，政府大数据应用市场规模达到16亿元。预计今后的两三年内，政府大数据应用市场规模将成倍增长，2020年政府大数据应用市场规模将达1407.5亿元。


    所以，政务大数据的市场将会得到市场资本界的广泛关注，这也是我们把最后一个科技概念股给到了政务大数据的原因。


    王煜全


