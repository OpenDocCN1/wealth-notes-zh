  md: '# 创新地图｜脑机接口：让黑客帝国成真的技术


    脑机接口：让黑客帝国成真...


    杜乾，纽约州立大学上北医学院博士生，在神经科学和认知科学领域有深入的研究。


    脑机接口，即实现生物脑与机器互联沟通的技术。对于这种技术你一定不陌生。无数科幻电影小说，从上世纪的《黑客帝国》到仍在热播的《黑镜》，所谓“念念”控制外物、与他人分享思维与记忆、甚至完全生活在另一处靠大脑想象的虚拟世界中，依靠的核心技术，都是脑机接口。其实脑机接口不光是科幻作家放飞想象力的舞台，在现实生活中，也已经充分展示出其重要价值，如为意外失去运动能力的人提供操纵外设设备的可能，为盲人聋人等感官缺失者提供重新感知世界的机会，也让普通人提高工作效率和生活品质。总之，脑机接口是实现未来诸多科技设想所绕不开的技术，也是神经科学中最靠近应用转化的领域，因而值得创业者和投资人关注。


    # 那么，什么是脑机接口技术？它是用来解决什么问题？


    若将大脑的功能粗略分类，可以概括为感知世界（如视觉听觉等感官）、肢体运动（如四肢运动、眼动、说话等）以及其他更加内源性的功能（如决策、记忆、情绪等）。除了大脑这个“中央处理器”，为了实现感知和运动功能，神经系统还需要如视网膜这样的探测器、神经肌肉接头这样的效应器、以及脑干脊髓这样连接大脑与外周探测器效应器的链路系统。在许多疾病和意外中，遭受损伤的多是外周的探测器效应器和链路系统，而大脑的正常功能并未受影响。此时，如果用人工假体等替代原有受损部位的功能，并与大脑连接起来，这些运动与感觉功能的缺失将会被重建。不难看出，这其中的难点在于如何与大脑连接，如何用大脑听得懂的语言向其发送信息，又如何解读大脑传出信息，而这就是脑机接口技术所要解决的问题。此外，除了对感官和运动的重建，任何由外源设备对大脑信号的干预或解读，都是脑机接口技术。


    脑机接口大体上可以分为读取型与刺激型，以及侵入式与非侵入式。


    # 侵入式读取型脑机接口


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_214_0.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '的界面。理想的脑机界面要能同时记录和刺激更大的神经细胞群，并保证高速、高保真度的无线信号传输，以及更高的空间分辨率。这个方向的佼佼者比如Paradromics公司，他们已经开发出一种由10万根电极组成，每根电极直径仅20微米，可实现每秒8G数据传输的电极束，产品预计在2018年第一季度问世。环顾新
    вашего脑机接口创业公司，你会发现，对新一代脑机界面硬件的开发是它们不谋而合的战略部署，这个技术同样也是国家支持的重要项目，DARPA甚至野心更大，它的目的是能同时记录100万个神经细胞的电活动，能同时刺激10万个神经细胞，几千倍于现有的技术极限。这样


    +   首先会给神经科学研究带来革命性的改变，因为如此不同量级上的细胞群体活动能揭示出很多以前无法研究的脑功能机制；

    其次，这会促使脑机界面像互联网一样，在未来成为平台级的基础设施，成为许多科技应用生长的土壤。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_215_0.png)


    # 侵入式刺激型脑机接口


    侵入式刺激型脑机接口的主要应用包括帮助残障人士视觉、听觉、触觉的感官重建，以及对非正常神经活动进行干预，以治疗帕金森、癫痫等疾病的脑深部刺激。这个领域中最成功的技术其实大家并不陌生，那就是人工耳蜗。人工耳蜗是目前应用最广泛的脑机接口，截至2012年，全世界已经有32万人接受过植入，FDA更是早在1980年和2000年就通过了成人和儿童用人工耳蜗的植入许可。然而人工耳蜗的成功并不能说明刺激型脑机接口技术的成熟，相反，这个技术刚刚起步。人类听觉系统对声音的编码相对简单，耳蜗中的听觉神经是按照其最敏感的声音频率的高低依次排列的，对相应频率的听觉神经施加相应强度的刺激，已经可以还原出我们大部分的听觉。


    与之相反的例子是视觉。人类大脑对视觉的编码非常复杂，我们的感官信息80%来源于视觉，全脑参与视觉信息处理的皮层更是占比过半。而相比运动、记忆等功能缺失，视觉功能缺失的发生率高得多，失去视觉对生活的影响最大。然而相对于巨大的需求，可以造福于视觉重建的脑机接口（即视觉假体）研究却非常有限。领域的先驱者Dobelle和Brindley利用500-600根电极刺激盲人视皮层使其可以识别出物体，或识别出字母并完成简单的阅读。然而这些工作早在上世纪60-70年代就已做出，之后并无重大的突破。Dobelle做了商业化的尝试，但他的视觉假体一直没有通过FDA的许可，随着Dobelle的去世，相应的研发也被搁置。目前视觉假体领域走在最前端的是Second
    Sight公司研发的Argus 视网膜刺激系统，其二代产品Argus II正在进行二期临床试验。另一家 Bionic eye technology还在做临床前的研发。不同于Dobelle的视皮层刺激器，这两家公司做的都是刺激外周视神经或视网膜的假体，需要盲人的部分视网膜细胞，或者视神经功能完好，因而其实际用人群更少。此外需要指出的是，以上所有研发中，盲人产生的视觉都是由光点组成的简单图形，对这些图形的感知，其实借助触觉可以更简单地达成（比如前面介绍过的Wicab）。而自然状态中，人类从视觉刺激中获取的信息要比这繁杂得多，从基本的颜色、远近到高级的情绪、人脸识别等等。如果有一天可以让盲人感知到这些信息，视觉假体需要能将视觉刺激的特定属性准确传递到视皮层或视网膜的特定细胞群，而这些知识我们大部分还未探索清楚，因而可以说刺激类脑机接口的发展才刚刚起步。从积极的角度看，每一点神经科学知识的积累，都有可能转化为这一类脑机接口进步的空间。


    如果说视觉重建还比较遥远，脑深层刺激则离我们近得多，是近年来侵入式刺激类接口中最热门的。癫痫是细胞细胞过度兴奋或异常电活动引起的，常体现为大规模神经细胞同步放电引起的非正常脑电大幅震荡，导致运动神经控制的肌肉痉挛，代谢率骤升，神经细胞缺氧坏死等不可逆的损伤，危害巨大。此时如果在神经细胞同步放电的时候，引入外源电流干扰、抵消震荡，就可以有效控制癫痫发作。再如帕金森是由于负责调节运动的深部神经核团细胞坏死引起的运动迟缓、震颤，如果在这些核团引入刺激电流，则帕金森的症状可以得到有效缓解。这些植入脑中病灶，通过导入刺激电流调节异常神经活动的脑机接口，就叫脑深层刺激器。这项技术的优势是作用直接、迅速，且可以避免传统药物治疗的副作用和耐药性的产生，为传统疗法下疗效甚微的患者提供了一个新的选择。FDA早在1997年和2009年就分别批准了这项技术用于帕金森和强迫症的治疗。领域里的明星公司Neuropace，致力于用该技术治疗癫痫，在2013年获得了FDA批准，到2017年初，已经为1000位病人植入了刺激器。


    除了这些人们早已知道的适用疾病，脑深层刺激的潜力还在被不断挖掘，正在被尝试用于治疗越来越多的疾病，比如慢性疼痛，重度抑郁症、甚至肥胖症等等，这些尝试也正在受到越来越多的关注。虽然这项技术还有许多细节有待进一步探索和完善，但是深层刺激比感官重建还是简单不少，它只需要两个电极，而非含有几百个电极的电极阵列，接受刺激的目标细胞群选取也不要像感官重建中那样精细，所以说，用深层刺激治疗脑疾病距离我们近得多，也因此成为许多雄心勃勃的脑机接口公司短期目标的落脚点，可能成为近期行业的爆发点之一。比如Elon
    Musk的Neuralink公司在实现将AI嵌入人脑这个长期目标之前，将用脑机接口治疗慢性疼痛作为短期目标。


    # 总结


    侵入式读取型接口的科研成绩斐然，应用价值极大，虽然还有硬件和数据传输等工程技术有待优化，但距离我们不会太遥远，是脑机接口技术中期发展可以期待的爆发点。侵入式刺激型接口中，较为简单的脑深层刺激现在正处在
    Month？但涉及更复杂和高级的脑功能重建则还遥远，瓶颈在于神经科学知识的积累，是脑机接口技术远期发展可以期待的方向。


    脑机接口应用价值巨大，但涉及的学科、技术实现多样。希望本文为你打开了一个关注和思考脑机接口的角度，去发现更多脑机接口中有趣的内容。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_215_1.png)


    王煜全

