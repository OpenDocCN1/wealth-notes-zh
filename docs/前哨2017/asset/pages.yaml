  md: '# 全球科技新闻｜苹果全球开发者大会WWDC


    苹果全球开发者大会WWDC ↓


    王煜全


    本周的全球科技新闻热点——6月5日，苹果召开了“全球开发者大会WWDC”（Worldwide Developers Conference），来自全球的5600多名苹果应用开发者参会，成为全球各大媒体报道的焦点，我把几家媒体的报道综合起来，给大家解读一下。


    以下是干货笔记，完整内容欢迎收听音频。


    # 《连线》杂志总结了这次大会的九大看点：


    +   1. 推出了新产品HomePod，即智能家庭音箱。这本质上是Siri服务的延伸，在应用上相对单调，和亚马逊的音箱比功能弱不少。


    +   2. 推出了新Mac机，性能超越其它台式电脑很多。


    +   3. 推出了新操作系统MacOS（High Sierra）。


    +   4. 苹果TV吸引到了亚马逊的加入。但因为亚马逊有和苹果的Apple TV类似的服务，对亚马逊来说又多拓展了一个频道。因此，其实亚马逊和苹果的这次合作，是亚马逊加分了。


    +   5. 苹果的手表（Apple Watch）有了更强的人工智能能力。此次苹果的手表可以把手机里的歌单同步到苹果新发售的无线耳机里。之前苹果手表虽然销量不错，但功能相对单调。如今有了更多智能功能，让人们更有理由使用手表了，未来人们需要掏出手机操作的机会会越来越少。有了无线耳机和手表，苹果的产品系列可以强大很多，这是苹果的真正亮点。


    +   6. 推出了新的手机操作系统，iOS11。增加了很多功能，比如开车勿扰模式。


    +   7. 提供了一套AR系统（增强现实），可以通过手机屏幕看到在现实环境里叠加虚拟的人物，而且能用3D场景叠加，不会显得生硬。这意味着扩展现实未来的应用有可能会形成潮流。所以即使我们觉得苹果的创新力不够了，但在技术上，它依然还是有强大的优势的。


    +   8. 更新了语音应用。Siri越来越智能化，而且能够提供五种语言的翻译功能。未来，语音的实时翻译很有可能会变成标配，Siri已经在向这个方向努力了。


    +   9. 苹果推出了10.5寸的iPad Pro，据说苹果已经明确了要用Pad作为未来移动计算的平台，所以它推出功能更强大、足以当计算机使用的iPad
    Pro。


    # 华尔街日报文章评论：


    +   1. 苹果很早就推出了Siri，到现在六七年了，但功能却乏善可陈。它想强调通用智能，但做得又不够好。Siri的功能太过于集中在手机上，不像亚马逊能把很多实际的应用整合到智能音箱上，所以亚马逊后来居上，苹果失去了先机，非常遗憾。


    +   2. 三星则直接把智能语音互动功能整合到自己的家电产品里。Siri被苹果收购后，Siri的创始人就跳出来做了Viv，后来被三星收购，成了三星语音互动的基础。所以说，相当于Siri帮助三星建立了智能语音互动的能力。


    # 《计算机世界》文章评论：


    +   1. 其实现微软早早就认为移动计算的重心应该放在Pad上，所以微软推出了Surface，如今苹果也将重点放在了Pad上。另外，微软一直都在为Pad配笔，如今苹果的Pad也加了笔，可以说这是苹果向微软学习的结果。


    +   2. 苹果的iPod音乐播放器开启了数字音乐时代，如今它终于推出实时在线音乐收听服务了，而微软在将近两年前就在自己的游戏机XBOX上面推出了XBOX
    Music，实现了实时在线收听音乐的服务。所以，大家认为苹果这次的展示是对微软已经走过的路的确认，让大家都认同原来微软的路真的是对的。


    # 苹果依然有上升空间：


    +   1. 虽然苹果遭到了很多负面报道，但苹果依然是一家优秀的公司。因为苹果已经形成了一个相对完整的生态，它的产品系列最健全，让一个人使用电子产品的时候可以将各个电子产品之间打通。苹果的整合优势强大，因此业绩依然会向上走。


    +   2. 苹果有Apple Watch和AirPods，而智能耳机在未来一两年里也是一个特别重要的领域，耳机里除了有很强的处理能力，甚至也有很强的存储能力，再加上智能语音互动的能力，智能耳机会成为非常亮眼的产品，苹果其实还是领先的。


    +   3. 另一方面，股市相对是后知后觉的，都是对现有业绩的评判。所以，股市对苹果的反馈也还会继续向好。


    王煜全


