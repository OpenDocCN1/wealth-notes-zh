  md: '利研究中心的测试，嵌入到零部件中的传感器可以正常完成检测任务。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_189_0.png)


    此外，超声波3D打印机还能通过调整超声波的频率与幅度，对摩擦损坏的表面或者裂缝进行裂痕超声波焊修复，实现零件的重复使用，进而节省成本。


    目前，超声波3D打印的技术专利基本上由Fabrisonic所垄断。之所以还没有产生颠覆性的影响在于一些技术层面的难题：


    +   1. 超声波换能器的功率限制——由于受压电陶瓷换能器转换效率的制约，实际输出的超声能量难以大幅提高，超声波发生器的频率一般在20kHz左右；


    +   2. 超声波所带来的机械共振——超声波的使用不可避免地引入机械振动，鉴于成本的考虑和技术制约，超声波发生器的频率一般在20kHz，而工件很容易在20kHz频率上引发共振，共振会导致工件基板与上层金属箔片之间的摩擦显著减弱，从而引发焊接质量下降甚至完全失效。这些因素一定程度上限制了制造工件的几何尺寸与形状结构，使得超声波增材制造的普及受到一定的影响。


    国内在这一方面的研究才刚刚起步，目前哈尔滨工程大学对此技术有研究，并和广东的楚鑫机电合作研发。楚鑫机电是超声波金属焊接设备专业制造商，拥有长期从事超声波基础研究和超声波焊接应用技术研究的工程师，所以有一定的基础和技术储备，但也仅仅停留在点焊、滚焊等点、线焊接层面，还没有达到面与面间的大尺度焊接能力。哈尔滨工程大学在2016年发表了数篇论文，但也仅仅属于实验室的成果，离商业化还有一段距离。


    # 总结


    对于超声波3D打印技术来说，目前最大的优势在于低温制造，从目前来看，很难被其它技术取代。在制造高精度的零件方面，超声波3D打印机的成本较之其它的3D打印有优势，制造周期也短，打印速度比其它的要快很多，一般3D打印速度在5mm/s-300mm/s，而超声波3D打印机速度可达100
    mm³/s。而要实现高精度，激光烧结打印技术速度会进一步降低，而超声波3D打印却不存在这个问题，它的高精度是由后期的数控加工来实现的。


    相信随着技术难点的解决，超声波打印机将在越来越多的领域应用。


    王煜全


