  md: '# 全球科技新闻 | 海银资本与美国NCET2机构达成战略合作


    海银资本与美国NCET2的...


    王煜全


    昨天下午我们成功举办了前哨大会，在会上我们公布了海银资本和美国创业技术转让国家委员会（NCET2）达成战略合作。


    以下是干货笔记，完整内容欢迎收听音频。


    # NCET2的背景


    中国人对NCET2不太熟悉，它的全称是National Council of Entrepreneurial Tech Transfer创业技术转让国家委员会。“2”是指简称里有两个“T”的意思。


    我们曾介绍过美国高校技术经理人协会AUTM（Association of University Technology Managers），是在高校里负责把技术转让给公司的协会。与此相对应，NCET2的会员就是拿到了高效技术转让的创业公司，同时他们还邀请世界五百强里负责战略投资的负责人做评委，评选出拿到了技术转让的优秀科技企业，以此来促进和大企业间的战略投资、深度合作。


    NCET2的会员公司CEO不一定和学校相关，只是得到了高校转让的先进科技；但大部分CEO往往是这些高校的校友。在往期内容中，我们曾介绍过美国这些科技企业的CEO大多是资深从业者，而高校善于运用校友关系，每当推出先进技术，都会优先转让给值得信赖的成功校友。这些公司的CEO一般不会参加对外公开路演（road
    show或demo day，更适合业务模式创新型公司或年轻人），但非常看重与世界五百强企业合作，因此他们更愿意参加NCET2。


    # 海银与NCET2的战略合作


    4月20日，NCET2在美国首都华盛顿召开高校创业企业大会，并正式宣布和海银资本达成独家战略合作。NCET2通常是只限邀请的闭门会议，现在海银成为了它的独家合作伙伴，相当于NCET2向中国的企业和投资人开放。所以这次合作意义重大。世界最先进的科技转化型企业从高校拿到最先进的科技专利，而中国可以对这些科技转化型企业进行系统性的投资。


    未来，海银将和NCET2共同成立基金，用来投资从高校拿到最先进技术的科技企业。作为基金或者作为投资人，与世界五百强企业合投，收益更有保障；作为中国企业，可以向世界五百强企业学习战略投资，学习布局，这也是企业国际化的必修课。


    具体来说，我们将在今年10月组织访问美国的企业家代表团，希望有实力、又有国际化需求的中国企业家共同参加。我们一起到美国参加NCET2组织的大会，和世界五百强企业共同了解先进科技项目，一起投资。除此之外，代表团还会参加很多和国外企业家的交流活动，互相建立信任，期待未来能一起合作。


    # 《纽约时报》报道海银资本


    最近，《纽约时报》专文报道中国人工智能的发展状况，其中在研究中国对海外人工智能领域投资情况的部分，第一条就报道了海银资本。其实我们的斥资额度并不是中国企业里最大的，但被我们投资的那家美国人工智能公司非常优秀，所以可能美国人认为这个重要性更大。


    《纽约时报》认为中国正在投资美国的敏感科技，并报道海银是国有控股。其实这里出现了两个偏差：


    首先，海银是纯私有，股东也都是纯私有，有限合伙人里有少数国有资产背景的公司，但它们也都是完全市场化运作，并且作为有限合伙人并不参与公司决策，也不是公司股东；


    其次，海银投资的这家人工智能公司，科技水平很高，曾给美国国防部做过项目，但我们作为小股东是不可能获取知识产权的，同时我们看重的是智能玩具部分，和国防无关。


    当中国实力逐渐强大以后，由于不了解，美国人对中国人的担心也随之抬头。尽管如此，我们依然愿意加强对美国的宣传和沟通。之后，我们的代表团还会去访问美国政要，争取能够得到美国整体社会的理解，相互信任。海银资本、《前哨》愿意为大家搭建这个互信的平台。


    王煜全


