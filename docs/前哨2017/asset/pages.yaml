    王煜全


    本周的产业新闻带来的有关农业科技研发的一则消息——3月初，一个农业网站刊登消息称，中国政府的农业科技投入已经远远超过了美国。


    接下来，就农业科研的相关话题，带来解读和分析。


    以下是于货笔记，完整内容欢迎收听音频。


    # 农业科研，政府和产业的双簧戏


    # 1、行业概况


    ——美国扛鼎，中国超车


    美国是全球的农业科研大国，在其国内一半的土地和全球20多个国家的4.4亿亩的土地上，都种植着美国研发出来的转基因作物。


    然而，过去多年美国政府的研发投入不仅没有增长，甚至开始减少。反之，中国政府的农业研发投入从十年前开始迅速增长。到2009年，中国政府在农业上的研发投入已经超过美国，到2013年更是比美国多了1倍。


    # 2、中国


    ——自主研发+海外收购


    作为美国农产品的第一大进口国，近年来中国在农业科研领域强势崛起。


    一方面，中国在加强自主研发；另一方面，国内对美国转基因作物的审批非常严格。


    此外，中国近几年在加强先进农业科技公司的全球收购。如此此前中国化工集团斥资430亿美元收购全球种业和化肥巨头先正达公司（瑞士）。


    # 3、美国


    ——政府收缩，业界补充


    当然，美国的农业研发依然是领先的。


    究其原因，在政府投入萎缩的同时，产业研发的投入在持续增加。不光弥补了政府投入的缺失，还有增长——过去十年，政府投入和产业界投入的比例由1：1增长为1：3。


    # 科技研发，机遇和政策的博弈


    从本次的产业新闻出发，我认为以下的几点值得探讨。


    # 1、创新需要培养


    但凡新兴科技，不可能一上来就推枯拉朽，改造社会。


    它需要一个成长过程，甚至需要特定的“温室”进行培养。


    而“温室”，指的就是特殊的政策和扶植。


    # 2、短期效益VS长期红利


    在美国，此前的奥巴马政府积极推动科技进步，一方面加大对科技研发的投入，另一方面积极倡导全社会在科技上进一步投入。


    目前的特朗普政府则反其道而行，奉行“科技靠边，基建先行”。然而，这样的“杀鸡取卵”却因为立竿见影的经济效应而得到美国老百姓的拥护。


    问题在于，基础建设饱和后，投入欠缺的科技难以带动经济，社会长期发展会出问题。


    # 3、“自主创新”还是“合作双赢”？


    # 资金投入和环境塑造


    在科技研发中，政府除了加大投入，更重要的是去除科技创新发展的阻力，营造“创新友好型”社会环境。


    # 1、新兴VS巨头，美国带来的启示


    # 2、创新政策倾斜，中国可圈可点


    以上是本周产业新闻的全部内容，给大家带来了对科技创新与政府作用的解读。'
