  md: '# 全球科技新闻 | 2017年互联网趋势报告


    解读2017年互联网趋势报告


    王煜全


    本周的全球科技新闻再度跟踪热点——（美国时间）5月31日，有“互联网女皇”之称的玛丽·米克发布了“2017年互联网趋势报告”。玛丽·米克坚持撰写互联网趋势报告多年，已成为互联网界的一大盛事。


    以下是于货笔记，完整内容欢迎收听音频。


    # 一、2017年互联网趋势报告要点


    这次报告长达300多页PPT，分成11章，我用音频为你做了简单的串讲，欢迎点击收听。


    《互联网趋势报告》要点介...


    第一章，全球互联网趋势：全球互联网用户还在稳定发展，但增速已经放缓（尤其是智能手机用户）。未来，互联网缓慢发展的局势将成为常态。


    第二章，在线广告加电子商务：Mary Meeker以分析互联网广告见长，在报告中讲述了不少相关案例，掌握在线广告的技巧是一个公司的标准必备技能。


    第三章，交互游戏：交互游戏是很多科技产品创新的摇篮，也是现代化学习的基地。


    第四章，媒体：Mary Meeker只讲颠覆，没有讲新建。


    第五章，云服务：云服务在加速企业改变。


    第六章，中国互联网：娱乐的黄金时代+交通。


    第七章，印度互联网：国际巨头和本土企业的竞争加剧。


    第八章，医疗保健：Mary Meeker认为到了数字转折点，但由于美国的医疗保健数据电子化是一个大趋势并已经延续多年，所以中国目前的情况（医疗保健的基础设施及电子化方面相对落后、监管分割太多）未必能效仿。


    第九章，对全球上市和私有互联网公司的常规分析：中国有不少公司上榜，腾讯和阿里排名靠前，分别位列第五和第六。


    第十章，宏观趋势分析：缺乏让人眼前一亮的深刻分析。


    第十一章，结语


    完整版查看链接


    # 二、新变化、新概念、新信息


    Mary Meeker在业外的名气远大于业内。她 fade 报告深入程度不够，通常是数据叠加案例，缺乏对产业的洞察，尤其缺乏对未来趋势的深刻分析。


    # Mary Meeker今年的报告出现了有趣变化：


    第一，单列了中国和印度。尤其中国部分直接说明由高瓴资本撰写；但她强调中国是娱乐的黄金时代加交通，这个属于总结，没有预示未来的趋势性。


    第二，重点关注交互游戏和医疗行业。


    # Mary Meeker今年的报告出现了新概念，容易被忽略，但属不错的亮点：


    第一，Subscription Store（订阅商店），提供订阅管理，使你能够清楚了解自己订阅了哪些服务（例如按月交付的手机订阅、互联网提供的有线电视服务等）。


    第二，扎克伯格定律（每过1年人们在互联网上共享的内容会翻番）会持续很久，即共享经济具有非常强大的生命力，未来着手共享、社交、互动方面，还有很大机会。


    # Mary Meeker今年的报告也提供了新信息：


    第一，美国电商加速增加。美国收发快递增多，正在向中国学习，或者说步中国后尘，进入电子商务蓬勃发展的阶段。所以，美国的电商机构有更大成长空间，包括亚马逊（尤其亚马逊的云服务AWS）。


    第二，美国游戏界的平均年龄是35岁，在游戏行业，中国一定会步美国后尘，中国游戏玩家的平均年龄也会越来越大。Mary Meeker总结认为游戏产业比传统产业领先很多，包括积分系统、互动系统、在线更新、图形处理等，都值得传统产业学习。Mary
    Meeker提出游戏是未来人机交互工作的准备阶段。


    # 三、趋势报告中存在的问题


    一方面，流于表面数据，缺乏洞察，今年的报告并没有涉及太多趋势，大部分是回顾，尤其没有提到人工智能，虚拟现实也没有深入。


    我认为根本原因是，在她眼里人工智能和虚拟现实都不属于互联网，但我认为这是一个巨大偏差也错误，整个互联网越来越基础设施化，只考虑传统，眼光太局限了。人工智能和虚拟现实其实就是互联网更新的下一步，互联网趋势一定要包括这些方面。


    另一方面，对中国的趋势缺乏了解，“娱乐+出行”完全是过去式的总结，只字未提中国的“互联网+科技”，尤其人工智能在中国的 development 是一个世界瞩目的大潮流。


    # 四、我对互联网趋势的预判


    第一，除了人工智能、虚拟现实这种大趋势外，我也在《前瞻》中提到了很多其他趋势，互联网现在的特征就是多个趋势并行。


    第二，更重要的，我认为互联网整体正在工具化，搭载在互联网上的工具在迅速升级。


    第三，新的分工协作正在形成。大公司负责基础功能的升级（云计算到人工智能平台），小公司探索新应用。


    未来应用的趋势很明确，但并不确定具体哪个应用能够胜出，大公司无法全部覆盖，针对某个应用下赌注风险更大。所以，大公司为小公司提供基础功能支撑，希望未来成功的小公司成长在自己支撑的平台上，同样，小公司也利用大公司的科技能力来探索应用领域，得到非常好的机遇。


    我们始终在不断修正自己对创新的看法，全球创新生态都在迅速演化，大公司意识到自己的创新不小公司，千疮百孔思路，变成小公司的支持者和扶植者，我认为这是一种新的生态。大公司的边缘必须更加开放，才能容纳小公司和自己深入合作。小公司也要学会利用大公司的资源，才能跑得更快、更远。所以未来创新协作的整个系统都在不断演化，还有很多值得我们学习和研究的地方。


    互联网一直对创新生态提供了非常强大的支持，我认为这个支持还会延续。但是我们关心的是如何延续，因为下一个创富机会可能就诞生在这个延续的方法当中。


    王煜全


