  md: "# 前哨科技创新地图｜私人定制心脏支架，引领心血管疾病治疗未来\n\n私人定制心脏支架，引领...\n\n李双，澳大利亚墨尔本大学生物工程在读博士，主攻心血管疾病，支架研发，同时也是澳洲property\
    \ crowdfunding startup estatebaron创始人。\n\n# 什么是心脏支架？\n\n心脏支架是一种植入体内的微型医疗器械，作用主要在于将堵塞的血管部分支撑打开，从而促进血液在心血管里的流动，并避免及减缓心血管疾病的发生。\n\
    \n世界上第一例心脏支架植入手术发生在1986年，由法国心脏学家Jacques Puel与德国心脏学家Ulrich Sigwart完成。随后该技术被广泛应用在临床治疗上，成为治疗心血管疾病的主要治疗方法。\n\
    \n# 心脏支架的种类\n\n第一类是最传统的支架为纯金属材质的支架（bare metal stent）。\n\n第二类支架则在第一类的基础上添加了药物在支架内用于提升治疗效果，这也是目前为止最为广泛应用的携药支架（drug\
    \ eluting stent）。\n\n第三类支架也就是最新一代的支架称为可降解支架，植入体内后，过一段时间可自己降解消失在体内，例如 Abbott Vascular公司的Absorb支架，是首个FDA批准的可降解心脏支架，植入体内三年内可完全降解，已在全球一百多个国家开始销售，并已应用到超过十五万例临床治疗当中。\n\
    \n# 心脏支架市场\n\n当今，全球心脏支架的市场大约在50亿美元左右，从品类来分，第二类携药支架目前处于市场主导地位，几乎占到市场80%以上的份额，但第三类可降解支架的市场份额增长速度快，预计在接下来的两到三年会逐步应用到临床治疗当中。\n\
    \n从区域划分，美国是市场占有份额最大的国家，2013年占比42%，紧随其后的是中国与日本，各占18%。随着亚太地区老龄化问题的凸显，预计在2020年左右，亚太地区尤其是中国与日本的市场份额会快速增加，并挤压美国的市场份额。该行业的领导企业主要有三家，Abbott\
    \ Vascular，Boston Scientific 和 Medtronic。三家所占市场份额相近，均占总市场的25%左右。\n\n# 当前心脏支架涉及的问题\n\
    \n随着科技的进步和发展，心脏支架也在不断地迭代更新，治疗效果有了显著的提升。但是，在临床应用当中依然会产生许多问题，不只阻碍了治疗效果的提升，甚至也威胁到了病人的生命。\n\
    \n# 两大主要问题：\n\n+   - 第一个叫做In-Stent Restenosis，即与支架接触的血管壁部分再次狭窄，顾名思义就是原本被支架撑开的血管壁部分又一次让血管变得堵塞。\n\
    - 第二个问题就是我们常说的血栓症（thrombosis），也就是植入心脏后可能在支架支撑的血管壁部分，也可能在支架附近的血管塑形血栓，从而造成心脏的再次堵塞。\n\
    \n# 这些问题产生的主要原因：\n\n主要的原因在于植入支架后，血管内皮受到了破坏，血管内皮可以理解成保护血管壁的一层保护膜，从而导致构成血管壁的细胞遭到破坏甚至死亡。并且因为支架的存在，血管内皮的恢复也变得缓慢，最终会引起支架内再狭窄以及血栓的形成。\n\
    \n# 那到底哪些因素导致支架的植入会产生这些问题呢？\n\n这是一个比较复杂的问题，也是现在研发支架的团队主要想要寻找到的答案，总结一句就是支架形态以及设计会影响到血液本身的物理变化从而带来血管壁的物理变化，并导致以上问题。其中最重要一个物理变量叫做细胞内膜剪切应力（endothelium\
    \ shear stress）。\n\n当心脏支架植入后，在支架附近以及与支架接触的血管壁会因为与流过的血液的“摩擦”而产生这个剪切应力，如果在某个血管壁区域内，这个力的大小在1帕以内，那很可能引起血管再狭窄，如果该区域的剪切应力大于7帕以上，则会引起血栓症。\n\
    \n决定这个剪切应力大小的关键在于支架的形态和设计，这里涉及的因素很多：\n\n+   - 材料与血管的兼容性，\n- 材料密度，\n- 支架本身的形状，长度，弯曲度，\n\
    - 支架模截面的形状，厚度，\n- 很重要的一点：支架植入后是否完全与血管壁紧贴在一起，还是与血管壁之间存在缝隙，缝隙大小是多少\n- ……\n\n现阶段的研究依然在寻找所有因素当中，到都哪些因素是主要因素，哪些是次要因素，不同因素之间有哪些关联。\n\
    \n与此同时，因为人体个体差异，每个病人的患病心血管的形状都不相同，在现今支架生产还是标准统一化生产的情况下，同一个支架运用在不同的人身上，甚至同一个患者不同的患病心血管当中时，所产生的治疗效果以及可能引发其他疾病的概率也会不同。\n\
    \n# 解决的方法——私人定制支架\n\n近几年来，科学家以及心脏学家提出了私人定制心脏支架的概念。即，根据每个病人的血管壁构造以及患病心血管的几何结构，为患者量身定制支架植入体内，从而最大化程度提高治疗效果以及减少其他症状被引发的概率。\n\
    \n# 制作定制支架流程：\n\n+   1. 通过高精度成像技术在电脑里生成病人心血管的模拟模型；\n2. 根据病人心血管模型，在电脑中画出定制的心脏支架，并植入病人的心血管模型当中，以模拟真实的心脏植入步骤；\n\
    3. 通过计算流体力学，模拟血液及血管壁在支架植入后的物理变化，如计算出在植入支架后剪切应力（或者其他判断再狭窄，血栓形成的参数）在血管内的分布情况，从而模拟判断出血管哪些区域内可能产生之前提到的问题。根据模拟的结果，调整支架的结构和设计，不断重复这个步骤直到植入支架后效果达到最优化；\n\
    4. 最后再利用3D打印技术将设计好的定制支架打印出来，应用于患者身上。\n\n这个框架看似比较简单，实则非常复杂。要想实现这个目标，首先有几个技术关键需要克服：\n\
    \n+   1. 3D打印技术\n   因为支架是微型医疗器材，并且它所使用的材料要能和血管壁兼容，同时也要满足常<|start|>支架的其他属性，比如可见度，精密度等等，所以对3D打印技术本身也提出了很高的要求。\n\
    2. 3D血管成像技术\n   心血管的直径仅在2至5毫米之间，只有极高精度的成像技术才能将3D血管的构造清晰地完整地构建成电脑模型。\n3. 计算流体力学\n\
    \   一般需要超级计算机来完成，电脑硬件和算法直接影响了计算速度。\n4. 其他问题\n   除此之外，医用类产品在监管上本来就比较严格，如果按照以上设想，是否每打印一个支架出来还需要做动物实验，临床实验才能使用在患者身上现在也不得而知，如果是那样，从制作到应用的整个周期必然将大大拉长，这显然失去了实效性，你不可能让患者等一个年半载才用上支架。\n\
    \n# 定制支架科研团队\n\n现阶段的在定制支架方面的科研还尚属于早期，因其技术难度，时间及成本的要求，参与研发的机构并不普遍，主要的科研团队集中在美国以及澳大利亚的院校。\n\
    \n其中比较出名的团队包括由澳大利亚墨尔本大学的心血管专家Professor Peter Barlis（即本文作者的导师）所领导的团队。该团队由心脏学家，机械工程师以及生物工程师组成，在3D打印材料，3D成像，计算流体力学这几个核心领域都掌握"
