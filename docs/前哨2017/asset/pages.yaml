  md: '# 创新地图｜生物电路的未来前景


    生物电路将如何改变我们的...


    尚午，美国马里兰大学生物工程博士。


    # ——►生物电路的应用背景◄——


    微型电路（Microelectronics）的发明和应用极大地影响了我们的生活。从笔记本电脑到智能手机，从互联网到物联网（微型传感器），这些基于微型电路的设备将我们连接到了一个更大的网络中，延伸和扩展了我们的视野，改变了我们收集、处理和传播信息的方式。


    然而，这些电子设备在生物医疗领域中的应用还存在着非常大的提升空间。例如，我们还无法轻松地将智能手机连接到我们的皮肤中来获取自身的健康信息（比如，身体是否被病菌感染）。就算是我们知道自己已被某种病菌感染，我们也无法编写程序让智能手机生产药物并进行治疗。


    其中一个很重要的原因就是现有的电路系统和生物系统在信息传递方面有着非常大的区别：电路系统利用自由电子传递信息，而生物系统则通过化学物质传递。如何打通这两大系统之间的沟通障碍是长久以来的一大难题。


    美国马里兰大学生物工程系的Bentley实验室和Payne实验室近年通过电化学，生物材料和合成生物学的手段合作研制出了一套全新的方法，名为生物电路（Bio-electronic
    circuit），来实现电路和生物系统之间的双向“对话”。


    具体的说，研究人员不但可以通过电路系统检测目标环境中的生物化学信息，也可以通过控制电信号的输入改变目标细胞的基因表达。


    # ——►什么是生物电路◄——


    生物系统与微型电路装置最大的不同就是信息流动方式的不同。在生物体内，几乎所有的活动都是基于分子的传递，比如在细胞和组织间传递的葡萄糖，胆固醇，肾上腺素和胰岛素。


    病原体也是通过分子作用，比如表面受体和毒素，寄存在我们的体内并影响我们的健康。所以，我们必须检测这些分子来识别病原体，然后建立起相应的反制措施。


    另一方面，微型电路装置（如手机）基本是由生物体内不含有的硅，金，硼和磷等元素构成，并通过自由电子的流动来传递信息。同样，这些自由电子在生物体内也是不存在的。由此可见，电路和生物系统之间的连接存在着障碍。


    幸运的是，有一种存在于生物体内的分子具有稳定运输自由电子的能力。这些分子被称为“氧化还原分子（redox-molecule）”。它们可以像电线一般传输电子。不同的是，在电线中，电子的位置是不受限制的；而氧化还原分子必须通过氧化反应或者还原反应来传递电子。


    这些氧化还原分子就是整个生物电路技术的核心。


    生物电路的关键部位包含了一块电极和电极表面的一层壳聚糖膜（chitosan film）。这块电极通过背后的电路系统连接到外部电源和装置；同时通过这层膜与生物世界进行“对话”。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_180_0.png)


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_180_1.png)


    # ——►应用前景◄——


    生物电路主要在实时检测和自动化 immunotherapy 上有广阔的应用前景。


    # 首先是实时检测。


    传统检测手段过度依赖实验室里的生物化学检测试剂盒或大型检测仪器，其费时费力的操作使得这些检测无法做到实时。相比之下，使用生物电路进行检测非常方便且快速，而且对人工依赖程度低，使得实时检测变为可能。


    目前为止，生物电路的一个局限便是它只能检测带有氧化还原性的目标物。为了突破这一限制，研究人员正在研究将基因改造后的细胞（如大肠杆菌）添加到壳聚糖膜中来扩展检测的范围。


    # 其次是自动化医疗。


    受益于电子系统的自动化能力，研究人员正在研究将检测和基因调控两个功能整合到同一个系统中。'
