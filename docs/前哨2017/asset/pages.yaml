  md: '# 创新地图｜私人航空航天业迎来春天


    私人航空航天业迎来春天


    孙瑜，博士毕业于全美第一的高分子专业——俄亥俄州阿克隆大学（University of Akron，USA）高分子系。


    目前在亚特兰大全球最大的碳黑碳素公司任职科学家，主要从事石墨烯纳米复合材料的研发。


    2010年左右开始，由于专业原因，开始关注航天航空和有关殖民开拓火星的话题。


    # 私人航空航天业迎来春天


    航空航天产业属于战略性先导产业。目前，全球航空航天产业正处于技术和市场快速发展的鼎盛时期。


    国际上来说由于美苏争霸带来的六七十年代空间国际拓展的热潮在90年代退去之后，近年来又有复苏景象。


    但不同的是，国际特别是美利坚的这一波热潮主要是由私人航空航天、小卫星采矿与国际空间站所衍生的一系列配套运输、居住、供给设施以及网路卫星、私人太空旅游，更不用说SpaceX去年在墨西哥航天大会上所呼吁的火星之旅，都给美国的航空航天工业打入不小的强心针。


    # 关于航空航天发展的预期


    我们预期，在接下来的3到5年里，美国的军工国防科技与航空航天也会迎来一个发展，主要是基于以下两个原因：


    首先是特朗普的当选，由于其保守孤立主义的立场，会刺激军工国防工业的迅猛发展。


    # 市场繁荣对航空航天提出更高要求


    +   1. 复合材料用量的提升。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_162_0.png)


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_162_1.png)


    +   2. 可替代燃料的使用。'
