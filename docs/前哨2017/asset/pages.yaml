  md: '# 全球科技新闻 | 科技创新中的资金投入和环境塑造


    王煜全


    今天节目开始之前，先宣布一件大事儿：三周以后，4月22号，第一届前哨大会就要在北京举行了。


    这次大会的主题是“2017年全球科技创新地图”，我将以我们的全球分析数据和多年投资经验为基础，来为你全面梳理2017-2018年度全球科技创新的趋势和走向。有boom新技术将会有到来，未来的产业将如何布局。


    在前哨大会上，我们会深入探讨关于你个人和企业该如何感知趋势、抓住机会，让你在认知升级之外，还能有更多的收获。


    为了感谢前哨用户这近一年的陪伴，我预留了一些早鸟票和双人票，你可以带着你的朋友或者合伙人，一起来现场。


    现在你就可以在文章末尾进入购买链接，锁定早鸟票。


