  md: '# 产业理解｜进化论是企业经营的第一性原理

    （4/7）


    进化论是企业经营的第一性...


    王煜全


    今天是“企业前瞻性经营”的第四讲——“预见未来”之《进化论是企业经营的第一性原理》。在之前的产业理解时间我们侧重企业前瞻性经营的具体分析，近期的两讲将会介绍如何行动。


    以下是于贵笔记，完整内容欢迎收听音频。


    # 一、保守者or适应者


    前几天我和家人一起在纽约的海滩玩，发现了一大群鲎（hòu），它是具有4.5亿年历史的活化石类动物。今天的生物经过若干次演化已经和过去的祖先完全不同，但鲎始终和祖先长得一模一样。


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_203_0.png)


    ![](img/b82c97eb199a9276887cadbbbaa84d1f_203_1.png)


    实际上，在变化面前，其实就是这两种态度：


    +   第一种是不斷強化自己最優勢的地方， 不斷守着自己的邊界，以不變應萬變；

    第二種是找到新的規律，適應新的規律。 前者體現了鼇的哲學，它也是成功的，而人類顯然是第二種態度的典型。


    以不変應万变固然好，但往往以固步自封、失去成长空间为代价；适应新的规律也非一帆风顺，需要经历自我蜕变之痛，保持自我革命的勇气，但也因此才可能在未来的发展中取得更有利的地位、获得更大的成功。


    在变化面前，企业同样有两种选择，保守者或适应者。


    # 二、进化论是企业经营的第一性原理


    唯一能够被 Djokovic 到几乎任何领域（包括企业经营管理）的理论（尤其科学理论），其实没有物理学那么基础，不是相对论，而是进化论。


    变化总是会来的，适应变化才是永恒不变的规律。我们应当保持对“黑天鹅”的警觉，保持“禅者的初心”，即对外部环境的变化保持足够敏感，永远保持一定的焦虑，保持不断学习和生成新长板的能力（保持进化的能力），这才是企业最终应该掌握的核心技能。


    进化论是企业经营的第一性原理。


    # 三、拥抱未来的科技企业


    具体到科技产业，如何把重大的科技突破变成自己事业腾飞的风口，有如下四条建议：


    # 第一，观念认同：科技是对未来影响最大的因素，例如美国的强大源于它拥有能让科技自由发展的丰富而健全的生态；科技变化正在加速，真正能够推动社会发展的是掌握先进科技的企业家；科技几乎对所有行业都带来巨大影响，未来没有企业不是科技企业。


    因此，科技变化不可回避，也不是威胁，而是使你发展壮大的机会。


    # 第二，视角认同：顺应趋势，投身趋势。


    无我：不要从自己的角度觉得受到了影响从而形成防御心态，而要积极主动思考科技会给社会、给大 家带来的好处。


    利他：不要思考自己如何利用科技的好处，而是思考我如何能促成科技的成功，从而加快造福社会。


    一旦换角度思考，你就会找到如何借助科技打造长板的机会。


    # 第三，行为认同：没人能够预测未来，未来是涌现出来的。但经验是积累出来的，“有20岁的编程天才，没有20岁的产业专家”，人对复杂模式的识别能力是人工智能尚不具备的，但人的识别能力也非先天，而是通过后天的学习和训练。人类最大的能力就是锻
    炼出强大的后天直觉能力。


    我推荐托马斯·库恩的《科学革命的结构》，这本书认为每次重大的科学革命都会带来思想和认知模式的变化，即“范式转移”，现在科技加速推动社会变化，未来，在一个人的有生之年，他可能会经历若干种范式，老人的价值会再度得到认同。


    因此，我所说的“行为认同”是指在行动上做好准备，在新的范式出现时积极适应，这种适应并非理论讨论出来的，而是通过锻炼和经验得来的。


    # 第四，身份认同：现阶段科技产业革命的范式是积木式创新，是建立创新生态，是用领导力带动大家跟随。所以你需要大家认同你在这个范式中的身份，也需要和同样认同这个范式的人一起协作奋斗，你会更容易成功。


    今天的解读和《反脆弱》的核心观点类同——当变化来临，不仅仅要活下去，更要适应新的模式，抓住机遇繁荣起来，变成能够真正拥抱未来的科技企业。希望大家都是这样的企业！


    # 前瞻性经营系列预告


    我将利用每周三的产业理解时间，给大家做个系统介绍：企业如何实现前瞻性的经营？因为我认为这是未来成功企业必备的知识。以下是内容安排：


    # 1、预见未来


    +   科技创新与应用创新：跳跃式与连续性

    科研成果与产品转化：偶然性与必然性


    # 2、经营未来


    +   《反脆弱》：不是活下去，而是繁荣起来，如何制定足够宏大又有可能实现的目标（本周内容）

    企业能力培养：新形势下的新打法，企业如何具备快速进化能力


    # 3、布局未来


    +   闪电战：基于技术和社会变革的战略、战术的根本性提升'
