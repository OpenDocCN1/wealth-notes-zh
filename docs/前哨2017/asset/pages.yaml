  md: '# 科技概念股｜从狂热到降温的虚拟现实


    从狂热到降温的虚拟现实


    王煜全


    虚拟现实在 2016 年成为炙手可热的创新科技产业。


    它有一个有趣的现象，就是在 2016 年出现了先热后冷。


    为什么它在 2017 年依然是一个科技热点呢？今天继续为你分析。


    以下是干货笔记，完整内容欢迎收听音频。


    # VR 行业从狂热到降温


    2016 年早些时候，多家报告认为 VR/AR 领域将会出现令人瞩目的增长。高盛发布的 VR/AR 报告称，该市场规模在 2025 年有望达到 1820 亿美
    元，其中 1100 亿美 元为硬件营收，720 亿美 元为软件营收。


    市场研究公司 Super Data 曾在去年 6 月份预计，2016 年的全球 VR 用户会达到 5580 万人，VR 设备出货量为 3890 万部，收入为
    51 亿美 元。


    但是，这种增长并没有出现，据 Super Data 的数据显示，去年 VR 行业的设备出货量仅为 630 万部，创收 18 亿美 元。这一巨大落差不禁让人
    们对 VR/AR 的前景产生了怀疑。


    而在资本市场，投资者在注意到 VR 硬件初创公司的风险后也趋于冷静，开始更加谨慎地对待 VR 硬件投资。


    2015 年第四季度，AR/VR 领域的投资成交量一度达到了 51 笔，紧接着 2016 年一、二季度，VR 领域的投资成交量开始下滑，第三季度虽有所回升，但已经无法与
    2015 年第四季度资本市场的繁荣景象相提并论。


    尽管 2016 年 VR/AR 领域的投资数额高达 1.8 亿美金，比 2015 年增长了 140%，但是别忘了，几家明星企业贡献了很大一部分的投资额。


    +   Magic Leap 的 C 轮融资贡献了 7.94 亿美 元；

    VR 系统制造商 Mind Maze 贡献了 1 亿美 元；

    内容平台 Next VR 的 B 轮融资贡献了 8000 万美 元；

    耳机制造商 Osterhout 设计集团贡献了 5800 万美 元。


    # 初创公司受冲击


    IDC 近期发布的一份报告指出，去年随着一些 VR 巨头的进入，包括三星、HTC、索尼、乐视、小米、华为、微软和联想等厂商的进入，初创公司因此受到的冲击依然还是比较大的，一些甚至还没有坚持到发货阶段就已经对外宣布倒闭。


    而 VR 市场的整体出货量也不容乐观，直到第二季度才开始慢慢复苏，到第三和第四季度时，得益于索尼 PSVR 在全球范围内的发货，VR 市场实现了较高速的发展，在
    2016 年第三季度的出货量达到了 2 万多台，是前一年同一时期 的 367.9%。


    根据 IDC 预测，索尼的 PSVR、微软以及 HTC Vive 将会成为中国顶尖的几个 PC 端 VR 平台，而谷歌的 Daydream 将会成为领先的移动端
    VR 平台。HTC、索尼和微软将继续推动 VR 头显的发展，而移动端 VR 头显在这一年将会占据所有 VR 头显市场的 62.9%。


    这就意味着真正的 VR 时代还没有到来，因为真正的 VR 时代应该遍布高端产品。


    # 中国 VR 创业企业中的优秀者


    ——蚁视——


    2016 年 6 月份，蚁视发布了二代头显，有头部跟踪、室内环境感知等一套系统，可以让游戏者在自由移动时位置更精准。它是中国目前自主研发中最高端的头显，且均价约
    4000 元，属于 PC 端。


    但蚁视用户仍然在使用后反馈了两类问题：


    # 硬件能力似乎跟不上


    这个问题倒不能怪蚁视，其实大部分头显是需要连接 PC 的，而且越是较高级的头显，就需要越端端的 PC 端支持。


    # 相关的软件不够多


    在虚拟现实领域，未来最大的应用带依然是游戏，游戏会带动其他的行业应用发展和繁荣。但是，当硬件实力不够时，游戏开发者自然也就不够多，好游戏的数量也尤其稀少，因此造成了高端
    VR 的尴尬局面，没有好游戏可玩。


    ——大朋——


    相对中低端的 VR 设备中，最值得一提的是大朋，大朋 VR 价格走亲民化路线。它的 一体机非常强调影体体验，你买了大朋 VR，就相当于购买了一个免费的电影库。


    虽然 VR 在游戏体验中还有欠缺，但是用 VR 看电影的话，显示效果是可以做得比较好的。


    # 思考：是什么原因导致 VR 行业在短短的一年就经历了从狂热到降温？


    很多行业都会出现这种情况。行业初期会出现快速的增长，但是不久之后，市场作出判断：到底是泡沫，还是真正的繁荣。


    用户体验决定一切。市面上很多（特别是国内）的 VR 设备给消费者很糟糕的用户体验，大量的 VR 盒子充斥着市场（这种 VR 盒子甚至都无法称作 VR 头戴设备）。失败的用户体验一方面导致消费者对
    VR 市场的信心下降，另一方面也使投资者在投资硬件时变得更加谨慎。


    # 有待解决的技术问题：


    # 1、5G 技术


    对于画面质量和视场角的要求，目前的 4G 网络速率都不能满足，只能等待超高速的 5G 网络到来。另外，VR/AR 的 3D 计算机图形处理、3D 音效等，都要消耗大量的数据流量，4G
    网速达不到要求，需要 5G 来解决。


    现在看起来，5G 还需要等待几年，中国初定于 2020 年启动 5G 商用计划，最早试用估计也要在 2019 年以后了。


    # 2、光场技术


    光场的技能能使得外界的 3D 信息被完整采集，解决在移动当中失真的问 题。目前有不少国内外初创公司正在尝试使用光场技术完成最景视频的拍摄，例如美国光场技术公司
    Lytro。


    # 3、计算能力


    真正复杂计算的处理还没有完全做到手机上，依然需要 PC 的支撑，目前显示不够流畅、长时间观看导致头晕等问题还不能完全解决，因此计算能力还需花费不少时间。


    # 4、周边设备


    玩游戏时，需要一个比较完整的游戏体验，所以虚拟现实游戏绝不只是头显，甚至需要全身套装。


    2017 年 2 月 9 日，扎克伯格公布了一款虚拟现实手套，带上它，你就可以虚拟地处理各种事情，而手套的动作可以被跟踪，整合到虚拟现实中，再加上一个体感，基本上，虚拟现实的服务就会慢慢浮现出来。


