  md: '# 总结 | 盘点和科技相关的10大话题


    盘点和科技相关的10大话题


    王煜全


    熟悉而喻的朋友都知道：科技是社会进步的第一推动力。当然对科技的细节有完整的掌握，才能对社会的未来作出相对准确的判断。过去一年，我们都在帮助你掌握最基础的科技硬知识。


    今年春节，我们跳出细节，在更高的层面上，学习和理解了《科技相关的十大话题》。第一季的专栏接近尾声，我再次为你盘点回顾这部分内容，希望能够帮助你建立起对“科技的价值和趋势”的完整认知。


    # 1.科技与创新


    创新会增加风险，而把创新应用在科技领域，是推动社会生产力的最优选择。


    掌握科技有三个层次的机会：


    +   1. 从高校和研究机构拿到科技专利授权。 2. 在别人的先进科技基础之上做应用层的开发。 3. 基于新科技，设计新的应用模式和业务模式。


    最后，找到科技能够颠覆产业结构的切入口，利用科技才能真正地推动创新的持续涌现。


    # 2.科技与经济


    全球经济的核心驱动力是科技。但是，科技对经济难以形成短期影响，中期和长期的影响很大。比较中美两国的现状和未来预期可以分析：


    中国在创新生态当中有点长板——制造业、市场、资金支持，但暂且未能形成完整的创新生态。社会对科技的接受程度和实践水平，有着巨大的城乡差距，面临科技人才储备不足的险境。


    把IT纳入义务教育，坚决拥抱全球科技创新的新环境，获得长期的科技效益。


    # 3.科技与全球化、国际化


    全球化的本质是由发达国家主导的资源再分配和利益重在组，中国在全球化布局中，有弊端也有利好，是比较独特的存在。


    发展中国家可以先做好国际化，即先学会和一个国家合作，以此为基础才能更成功地扩展多边合作。


    对中国企业而言，在对全球科技前沿脉络足够理解的基础上，学会战略投资做布局——风险投资基金来布局，企业跟上扩大合作，就迈出了国际化最重要的一步。


    # 4.科技与社会


    科技平台使得经济的流动性大大增加，产生越来越多的上升通道，加上全球化、互联网的信息延展，使得个体可以迅速地、大范围地做出颠覆性的事业。


    科技进步推单身，但是单身反过来促进多样性，多样性可以带动创新，创新又进一步带动科技进步。因此单身其实是一个社会进步的表现。


    # 5.科技与就业


    +   1. 工作种类有序增减——人类和机器相比不占优势的工作种类会消失，而胜过机器的工作种类会增加。 2. 在构建全面的社会福利体系的同时，引导人们积极追求向上。
    3. 积极式创新。公司或者个人用最优的长板与别人（包括机器）的最优长板结合，形成最优的木桶。 4. 每个人都应该保持开放的心态，让终身学习成为一种常态。


    # 6.科技与教育


    知识可以被体外存储的互联网时代，教育有三个导向：


    +   1. 未来导向，学习并掌握IT语言。 2. 目标导向，即STEAM，掌握 Science（科学）、Technology（技术）、Engineering（工程）、Art（艺术）、Mathematics（数学）这五门技能。
    3. 兴趣导向，只有热爱才有可能努力成为专家。


    作为基础的通识教育也是必要，需要具备信息素养和关键思考能力（批判性思维）。


    # 7.科技与城市化


    城市化是人类进步的重要原因。


    城市化促使社会分工极大细化，提升整个社会的效率，生活成本大大降低，社会生活极大丰富。所以未来会出现超级城市。


    未来超大型城市化过程中，有以下关注点。


    +   1. 个人生活。个体既实现了自我存在的价值，又从属于多个不同的群体。 2. 社区生活。线上线下的社会生活（体育、教育、娱乐、服务）非常丰富。 3.
    城市生活移动化、数据化。城市网络全部覆盖，物联网普及，能源无所不在，人工智能有效应用。


    # 8.科技与环境


    从长远看，雾霾问题一定能够彻底得到解决，持续地发展经济是治理雾霾的根本手段。


    在环保问题上，最终的解决方案一定是由科技提供的，但是有效的政策可以极大地促进科技提供解决方案的速度。


    # 9.科技与健康


    未来医学新趋势是：点对点医疗，监测越来越个人化，诊断和治疗也会越来越地方化。


    因此医学会呈现以下新趋势：


    +   1. 小型的医疗器械，会大行其道。 2. 社区医疗将会复兴，在数据采集完善的前提下提供更快且更个性化的诊断和治疗，小型社区诊所会越来越普及。 3.
    实时IG云服务会大面积发展，随着可穿戴设备和智能设备的普及，在云端可实时进行诊疗的医学云服务、云诊断、云监测、云治疗。


    随着科技发展，人类一定会越来越健康，越来越快乐。


    # 10.科技与未来


    科技在社会变革中发挥着重要的作用：


    +   1. 长远来看，科技是推动社会发展的核心动力。 2. 科技更替的背景下，整个社会以指数级的速度发展。 3. 人工智能在短期内不会威胁人类。相反，人工智能的发展会进一步解放人类的生产力、创造力、探索能力。
    4. 最大的科技市场是基于技术的应用开发及销售，所以我们不仅要了解科技的研究，还要了解应用的进展。同时，要兼顾科技对社会的改变，这些改变里往往蕴藏着巨大的创业机遇。


    科技只是工具，善于利用科技的人类本身，才是社会前进的最终动力，我们需要：


    +   1. 充分地了解趋势和机会，做一个积极主动的分析者。'
