    \n1. 他做这个需要时间。\n2. 你有可能来掀桌子，我就不请你。\n3. 你有可能不在这吃饭，我就不告诉你。\n4. 你家办喜事之前，就需要和怡关系。（注：“和怡”应为“和谐”。修正为：就需要和谐关系。）\n\
