    35. 人类的小动作：（1，被别人猜中了事情，你会抄手。2听到别人有错，你会忍不住在背后敲击一声而出声响。3孩子会忍不住，用脚画数字。4每个人，车辆走路声音都有不同。5每天准时敲出声响，鱼蛇会应声而动。）\n\
    36. 他也认识这个东西。\n37. 你和他人对菊，让他人在局中。（强力的武力支撑。）（注：“对菊”应为“对局”。修正：你和他人对局，让他人在局中。）\n\
    38. 发现端泥。（注：“端泥”应为“端倪”。修正：发现端倪。）\n39. 人也是你，鬼也是你。\n40. 不好的东西，已经消失或者式微。（陷害你的人，会让你反其道而行之）\n\
