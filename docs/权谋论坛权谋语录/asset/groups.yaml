    \n144，下以直为美，上以媚为忠。直而无媚，上疑其忠。\n\n145，赌钱，就像谈合同。谁会谈，谁就能成功。\n\n146，什么叫会做人？卖个顺水人情。\n\
    \n147，你偷我一只鸡，我偷你一只鸭。外面人做事，就是这个吊样。\n\n148，世上本没有路，人走多了，就成了路。\n\n149，当你生来到这个世界，你就参加了生活的那场斗争游戏。\n\
    \n150，江湖，就是抢劫暗花，就看谁的手段高明。\n\n151，人与人之间应该如何相处：刺猬理论。\n\n## 十一：生意经\n\n- 1．商人言利，无可非厚。\n\
    - 2．京东上，不要买衣服鞋帽，上面的衣服鞋帽全部是农村农贸市场的质量。\n- 3．弄虚作假，短斤少两。\n- 4．大的工程，做一个模型。\n- 5．买基金：就是拿你的钱去赌。买股票：就是在参小丁股。\n\
    - 6．货卖当时。\n- 7．政企合一：政府官员在企业有股份。\n- 8．有关商业机密的事情：人家也有可能不告诉你。\n- 9．盗尽先机：让别人的秘密，没有秘密。（但你不能奉献给别人）\n\
    - 10．君子爱财，取之有道。\n- 11．创收。\n- 12．物以稀为贵。\n- 13．美女经济。\n- 14．做生意不能置气。\n- 15．公司和部门领导一起卖。——《杰克·韦尔奇自传》\n\
