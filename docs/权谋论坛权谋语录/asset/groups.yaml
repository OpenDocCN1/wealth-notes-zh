  md: "\n139，人靠衣装，佛靠金装。衣着，是人的第二层皮肤。\n\n140，这世间的 人情是：你帮助了别人，别人还说你是傻逼。\n\n141，我们要小心，不要成为大人物相斗下，牺牲的小人物。\n\
