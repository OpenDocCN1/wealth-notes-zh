  md: '# 第六章


    ![](img/096f27f926d0436b0d17a31b2e36cf78_123_0.png)


    竞痛的是心，而不是脑。


    那么如何做以让头脑的改变带来心理的改变？我上面的描述当然并不是很清楚。下面我简单描述一下这种心理机制：


    +   1. 当我认知到城市和乡村仅仅是人类鼓捣地球的不同结果，我被洒虐震来源于社会的游戏规则时，我仅仅具有认知优势，而毫无心理优势，也就是说，我的心理结构还被定于那个让我心理上自卑、弱小的当时的特定情境以及背后的社会心理背景，我仍被它们“结构”住。


    +   2. 当我笑时，这意味着什么呢，意味着我感受到了给我以心理震馁的这一切的荒谬和虚弱。这个时候，认知已经开始渗透到我的心理结构的表层，我的情绪已经被带动并和认知一起协调。


    +   3. 当我大笑，别人把我看成神经病，而我无视他们的存在，这时候发生了什么？我的认知，经过情绪已经变成我的心理反应了，这个时候不仅仅是头脑，而且是心理，整个身体在对外界作出反应。我的头脑和认知不再处于相互分离当中，而是相互协调。头脑的优势这个时候转变成了心理的优势，经过情绪的带人，我的心理从那个给我以自卑弱小的心理情境、心理背景里挣脱了出来。它改变了，而它的改变，意味着我某种意义上上的改变！


    不一定只要一次情绪带人就能成功，也不一定在一件事上只带人一次情绪就能成功，但无论如何，在认知中带人情绪，就是让情绪把你的心理从那个给你自卑弱小的情境、背景里拉出来！'
