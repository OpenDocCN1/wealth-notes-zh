  md: '![](img/096f27f926d0436b0d17a31b2e36cf78_105_0.png)


    得到显现。体现在人类的精神和心理结构上，就是只有“说理”才能真正让人信服。这种“说理”体现为严谨的理性论证、逻辑推理、质疑和辩驳，它们既符合自然界的规律，也符合人心的“普遍法则”。理性不是心理的暗示，不是头脑在心理的影响下想当然的认为，更不是强行的灌输，它让人口服心服。真理是借助于理性的思考和论证、检验得出的。坚持真理的人之所以不畏强权，不畏惧死亡，是因为在真理面前，强权和死亡都没多少力量。理性具有恒久性、严谨性、程序性，是一个不可破坏的链条。在当今世界上，即使是一个最独裁的政府，也不敢公开说“我就独裁，怎么了”，而是会把自己打扮成是民主的，其原因就在于对政治合法性的理性追问在理论上可以颠覆任何一个不符合它的内在逻辑要求的政府。在日常生活中，我们总会找些理由来让自己坚持什么或放弃什么，也是因为只有理性的力量才让我们心安理得；尽管我们常常只是在对付事情进行理性化，我们用的只是理性化这一理性的赝品来安慰我们。


    正是如此，对于哲学家来说，死亡是一个严肃的哲学问题。这有两层含义，一是死亡问题对于人类的生存来说如此生死攸关，法国存在主义作家加缪甚至说它是唯一严肃的哲学问题，因此它必须成为一个真正的哲学问题。二是对死亡进行哲学思考，可以最大限度地克服死亡恐惧。那么死亡意味着什么？生与死之间是什么关系？死局是一种怎样的状态？几千年来哲学家们一直绕不开对这些问题的追问。'
