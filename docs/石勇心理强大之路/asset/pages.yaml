  md: '或者他成为了我的上司就在心理上开始莫名地排斥他，疏远他，（他们都一定的背景各种关系的）我就不能正常地交往了！和陌生人基本没有话说，和自己的亲人无话不说，她们都开始烦我！（网友“niuguaiguai”）


    # 解析


    第一面时一个人呈现给你的信息只是外貌。但是熟悉后，信息就多了，他的身份、金钱等，都会刺激到你。正如我前面所说的，它们对应于一定的社会中价值排序位置，而且可能都比你高，当然你的上司更不用说了，不仅比你高，还可以用权力威胁你。


    如果你屈服于社会价值排序，他人的身份就会威胁到你的心理生存，让你显得没有价值，或你总感觉到一种强势的挤迫，因此你只能避开。


