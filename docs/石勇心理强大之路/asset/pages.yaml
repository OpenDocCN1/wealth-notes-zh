- pgno: 28
  md: '到很多钱。但他不屑于这么做，因为这在他那儿根本不重要。


    在社会这个迷宫里，哲学家非常清楚金银财宝在哪儿。但他仅仅是身体在这个社会，心灵却在高空。他超越了这个社会结构与情境，俯瞰着这个社会，正由于此，他心理极为强悍。对迷宫里的路他看得一清二楚，但他并不会下来拿。


