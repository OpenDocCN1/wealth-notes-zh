  md: '# 我们为何在心理上那么弱小


    每个人都不想心理上弱小，过得痛苦不堪。每个人都想提高自己的心理素质，即使不是为了追求成功。


    但对于很多人来说，由于缺乏必要的认知和心理强大的训练，多年来一直跋涉在心灵的黑暗深处，看不到心理强大的阳光。


    为什么我们在很多时候处于心理弱势？到底是哪些东西在让我们经受心理弱小的煎熬？


    一、死亡恐惧。死亡是人类的宿命，是永远无法反抗的威胁。死是绝对的虚无和空虚，对于存在是一种最根本的否定。因此，作为一种会死的存在，对于我们来说死亡恐惧是影响最为深远的恐惧，除非我们能战胜死亡恐惧，否则我们在心理上还是弱者。


    二、对人生和世界的无把握性。人类是一种偶然的存在，偶然被抛到这个世界，因此，对秩序和确定性的寻求同样是一种深远的内驱力。不幸的是，并没有什么必然的东西。人生充满了偶然性。如果我们感觉到对自己的命运无法把握，我们的软弱马上会暴露出来。特别是在“现代性”逻辑支配了我们生活的时代，一切坚固的东西都烟消云散，我们的自我常常处于风雨飘摇之中。


    三、“自我”的虚妄。佛教说，不是自我有什么问题，


    ![](img/096f27f926d0436b0d17a31b2e36cf78_6_0.png)'
  merge: -1
  img_proc: true
- pgno: 7
  md: '而是自我本身就是一个问题。作为一种心理功能，没有一个“自我”我们就无法生活下去，或者变成精神病患者。但有一个“我”，必然就有一个“他者”；有一个“他们”和“我们”。这样，我们就一边把自己看成了某个事物的一部分，一边又与另外的事物割裂开来。于是：我们在把自己突出去受到控制的同时，也把自己暴露在不属于“我”和“我们”范畴的世界的枪口之下。我们的心理既受到操纵，又受到威胁。


    四、价值排序。在人类的社会里，有一个“价值排序”，按照金钱、地位、身份、学历、容貌、出身等来给人的价值分等分级，从而确定一个人的“价值”。比如，一个农民就比一个白领的价值排序低得多。这就制造了伤害、焦虑、愤怒、自卑和羞辱。它也引发了心理竞争，每个人都不甘在价值排序上偏低。这个价值排序是一种威胁人的心理生存的强大力量，在它面前，人的无价值感、羞辱感和渺小感总是油然而生。


    五、社会结构性暴力。社会是分层的，而资源的分布则不均衡。整个社会构成一个复杂的结构；在这个结构里面，有各种各样的科层化组织，权力在其中运作。只要你处于社会中，你就会受到结构的权力支配，你能够在其中分得多少资源就由这个结构决定。而正因为这样，在这个结构里面，对资源分配具有权力的人，就可以支配结构里面比他弱的人，甚至还可以羞辱比他弱的人。这就是社会的结构暴力，总是有多数人，要受到少数人的支配和羞辱。比如你是一个职员，在上司面前，你就得恭恭敬敬，并且战战


