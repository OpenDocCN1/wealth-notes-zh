- pgno: 57
  md: '# 通过认同，人们交出了

    自我让他人来占领


    有人说，谦卑的人心理强大，是因为他们能放下自己的身段，这很有道理。但这是一种预先的心理防御，先把自己设想成一个不牛的人，并对此进行暗示性的认同。有了心理准备，即使事情的发生真是自己设想的这样，那也是不怕的；如果事情更好一点，当然更不怕了。


    同时，有人还说到，大学生的心理之所以弱，在于他们总觉得自己是“天之骄子”，看不清自己，这可谓目光敏锐。这其实也是诉诸于认同：社会对大学生的评价，转化成了他们的自我认同。别人认为他们是那么一回事，于是，他们也真的认为自己就是这么一回事，而不管事情的真相是什么。然而社会的现实却不是那么一回事，因此他们的自我认同要遭受到社会结构的冲击。


    这样的例子或现象在现实生活中俯拾皆是。有一个人，他从小学一直到中学毕业考上大学，都是老师和家长心目中的好孩子，学习好，听话，不会给别人添麻烦，在一片赞扬声中长大。因此已经习惯于以这种形象出现。他小心翼翼地维护着光环，做任何事都尽力做到最好，得到别人的认同。不过，这种认同显然因不符合内心而是一种负担。长此以往，对人的内心形成重压，使工作生活受到严重影响。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '先声明一下，我所指的认同包括两个层面，一是自我认同，二是社会认同。因为自我认同和社会认同常常纠缠在一起，作为一种心理机制控制着我们，所以我没有分开讲。


    认同之所以是一种控制我们的神秘的力量，我们几乎在劫难逃，它的秘密就在于我们有一个“自我”，这个“自我”的很多内容不一定真是我们的，而很可能是社会赋予或强加给我们的。它本来不是我们内心想要或从我们的内心里产生出来，但社会通过种种机制，让它在我们的自我结构里内化，变成了我们的东西，以致我们都没有意识到无形中它对我们心灵的奴役。


    在讨论“自我”之前，我想请问一个问题：为什么我们记不起三四岁以前的事？而三四岁以后，或者七八岁以后，经过努力的回忆我们为何总有印象？


    请别用“因为三四岁前大脑神经发育如何如何”这样的话来回答我。这完全走错了方向。答案非常简单：三四岁前人的意识基本上混沌一片，根本没有“自我”的意识——“我”又怎么可能回忆得起还没有“我”的时候的事情呢？


    婴儿的世界就是母亲，母亲就是整个世界，婴儿完全和这个世界融合，体验不到有“我”存在。心理学家们认为，一般来说，儿童要到三四岁以后，才能明显地把自己与外界分开。此时一个重要的标志就是对“我”的表达。这时其“自我意识”虽没有涉入他的存在所置身的社会情境而使自己与外界完全分裂开，但他有了“我”和“他




