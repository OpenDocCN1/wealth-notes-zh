  md: '人”之别的意识。


    这就是自我的产生。而一旦产生，它就会贪婪地吸纳很多社会的东西，纳入它的结构。而这些东西，有的是人的生存真正需要的，而有的则是垃圾，是用来控制人的。


    还记得我以上讲的存在属性吗？想一下。你靠什么来确认你的那个“我”？是因为你是一个男人，你是某地方的人，你身高多少，你喜欢什么，你什么性格，你什么职业，你的亲人是谁，你的相貌如何，你信仰什么……对不对？那么，你一定知道，所有的这些东西，实际上都是生物和社会属性；它们变成了你的“自我”。那么，假如我现在把它们全部抽掉，你还有什么？你拿什么来确认你的存在？


    看起来，你被抽空了。


    这意味着什么呢？意味着你在心理上将无法生存。你会体验到一种虚无化的恐惧。


    所以，自我是一种心理功能，你必须依赖于它而生存。这就意味着，你如果不认同于你的自我，或者不认同你的自我心理能量投注的对象，你在心理上就无法生存。


    但是，问题也恰恰在这里。你的自我并不一定能够帮你，你所认同的东西，恰恰可能是用来控制你、奴役你的心灵的。甚至，你根本就并没有了自我，你的那个自我压根是假的；换言之，是社会和他人所强加给你的，你已经把自己的那个真正的自我杀死了。这个假的自我就像他人派来驻扎在你的心灵里的占领军一样，你屈服于他，听它的摆布。它占领你的方式，就是认同。'
