- pgno: 70
  md: '源，一是你缺乏一个独立的自我，二是你性格的懦弱（我无法判断是家庭或环境的影响或是其他），三是你对权威的认同。


    缺乏独立自我的人，极易受外界的影响，他人的语言和行为习惯，在很大程度上决定了他对自我的判断。所以，易变的世界让他的自我一直处于风雨飘摇之中。而这样的人，非常容易认同于权威。


    正如你叙述的，你当班干部的经历对你产生了很大的影响。你的讨好他人不再仅仅是一种自我保护，而是变成了来源于你对角色承担的一种义务。这种义务是权威（也就是你的老师）的强加。


    这在心理上会出现什么后果呢？就是你讨好他人已经被权威合理化了，而你无力挣脱这样的权威，因为这会引起你的道德焦虑。这样，你的讨好他人不仅仅是为了消除自己得罪他人的恐惧，而且还是消除你的内心冲突的一种方式，但消除这种内心冲突，恰恰又强化了你的懦弱性格。


    这就是心魔啊！你的内心世界不完整，缺乏一个独立的自我，陷入分裂，让你在外界面前几无防御能力。


    在巨大的痛苦之中，你已经意识到了你的懦弱性格，但对于权威的认同似乎还没有足够的反思，尽管你明白自己从心里面可能抗拒权威对自己的操纵。而在你缺乏一个独立的自我上，你没有意识到。你所有的一切行为，包括要与未必爱的人结婚，都只是心理的产物，是你恨自己的表现。'
