    这里的“自己”，代指人的种种本能，或者宗教中所谓的“原罪”。比如说，“懒惰”、“暴怒”、“淫欲”等。我们每个人都在自觉或不自觉得与这些本能进行斗争，终其一生，但更多时候是在妥协。所以，一开始我们都有一个梦想，最终大多数人梦想成空。


