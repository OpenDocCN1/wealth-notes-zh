  md: '![](img/096f27f926d0436b0d17a31b2e36cf78_122_0.png)


    而当我又继续想到人类把现代社会的“文明”夸得不得了，并贬斥原始人，但原始草棚和钢筋水泥其实只是捏弄得不一样时，我的笑声已招来了车上几个人的轻蔑。我承认，这是有点“神经病”的大笑，特别是在公共场合里（所以我建议你在按这个方法训练时，最好或如果没有必要不要在公共场合里，如果你的心理素质还行的话）。


    但我都要在这里告诉你，我从未如此拥有巨大的心理优势。一方面以往被酒店或其他事物所震慑的自卑弱小心理一扫而空，另一方面，这几个人在我眼中居然不存在——他们的轻蔑根本无法触及到我心理结构，纯粹就像是一些乌云一样，在我心里漂了一下马上就自行消散！


    原因（原理）是什么呢？其实非常简单。


    我们的头脑在很大程度上决定了我们是客体还是主体。如果我们对外界没有多少认知，反应迟钝，我们在心理上是体会不到多少优势的，因为这个时候头脑都自身难保，它陷入混沌之中，无法把我们化为主体，把认知的“力”指向外部世界（所以思考能力是多么重要！）。


    但我们当然没有这么糟糕。我们的头脑可以具有超越性，即与外部世界拉开距离，从高处、远处看它们。拉开距离，既不被它威胁吞没，同时又能确立对它的认知优势。这是人类的理性能力。


    但为什么我们经常明知该怎么做，却还是做不了，而只能忍受痛苦呢？原因在于，头脑具有超越性，可是，你不知道该如何做，以让你的心理也具有超越性。头脑的认知只是第一步，不转化为心理，痛苦还是存在的——毕'
