  md: '经历有关系。刚上小学时，由于学习不错，老师让我当干部，那时灌输个我的观念是当干部就是要为大家服务的，于是这种所谓的服务意识深深地植入我脑海中。我内心深处讨好着每一个人，对每一个人都毕恭毕敬，对每一个人的要求都有求毕应。我看着每一个人的脸色，只要别人对我表现出一点不满意，我心里就难受得要命。我想，一种奴性可能就是那样产生了。


    当然这也和我的性格有关。小学初中还好，我成绩一直非常拔尖，所以一般大家都很尊重我。在高中，由于是省里最好的中学，我也就成为很普通的一员了。当时我是个组长，和我一组的几个女生是自费进来的，比较刁蛮，便开始欺负我。


    有一次，有个女生在上自习时在我后面低声骂我：好厚一张皮。虽然完全是她无理，我也不敢和她吵。我怕大家看我的笑话，在大庭广众之下丢脸，因为我知道自己不是她的对手。这样的小事使我的心理发生了巨大的变化，我开始痛恨自己的懦弱无能，痛恨自己的性格，而且心理出现了极端的防御状态，在做任何一件事情时总是先想别人的反应，特别害怕别人不高兴，别人给我难堪。


    我害怕和人发生矛盾，这样我会难受得要死。我想过改变自己，我甚至专门去和别人吵架，可是吵架时我真的很害怕别人的气势，我怕别人的冷嘲热讽，甚至怕别人的一个不友好的眼色。我拼命告诉自己不要在乎别人，可是不管用，内心的难受是最真实的。我曾经为我自己的这种个性痛苦地想自杀，因为我感觉自己太没用了，这个世界'
