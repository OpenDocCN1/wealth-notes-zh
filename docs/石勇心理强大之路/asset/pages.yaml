    心理强大有四种：


    一、世俗意义上的强大。其实这不是真正意义上的心理强大，因为你的心理并不强，之所以感觉很强，是因为你占有很多“强”的东西：金钱、地位、权力、文凭、容貌……这些东西我们叫做一个社会中的“稀缺资源”，人'
