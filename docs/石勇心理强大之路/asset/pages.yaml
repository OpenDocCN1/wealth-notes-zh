  md: '的问题解决了，老陈还能回到原来的老陈吗？


    3. 如何才能让老陈走出现在的心理困境。


    # 解析


    我想，从表象上看，很多人都会这样给老陈下一个结论，那就是老陈具有责任感，追求一种一家之主的角色担当，希望能给家庭带来幸福。他在心里认同这是自己的道德义务，以此来维持自我认同。但因为没有能力履行好这种义务，他无法获得自我认同，即感觉自己没有价值，没有面子，所以采取了逃避的方式。只要他和老婆在一起，老婆的存在本身就会给他压力，因为这等于老婆在说他称职，这会刺痛他。


    然而，我想说，这只是表象。


    首先，我想请问一下：既然是为了家庭幸福，在老婆并没有逼他的时候，为什么还要分居？难道他不知道这样实际上会导致老婆孩子痛苦吗？


    可见事情并不那么简单。


    我想说，老陈属于那种自我中心主义较强的人，但这种自我中心主义，却不是与个性的张扬联系在一起，而是与社会价值排序联系在一起。


    我们承认，他对家庭的的确具有角色担当，他认同于一家之主的角色，并且想要履行好。但是，把自我认同押在这种角色担当上，却暴露出这样一个问题：老陈的目的并不是追求这种角色担当，而是把角色担当作为他确认自己价值的手段。


    显而易见，老陈是很认同于这个社会的价值排序的。


