    精神分析认为，童年极大地影响了一个人，我们的很多心理问题，都可以追溯到童年的心理创伤。因此，在治疗一个神经症患者时，自由联想实在是个好方法。一个人只要回忆起他当初被压抑的情景，并且发泄出了本应是当初发泄的情绪，他的心结也就打开了，“病”也就治好了。


