  md: '# ## 附录


    他的痛苦消除。如果他还有同情心，他不得不这样做，否则他的“自我”便会来反对他，他会陷入主要以对“人”这一存在属性的认同为主的“自我认同”的焦虑，承受道德上的压力。这样，他的心理生存就会受到威胁。


    从这里我们得到的启发是：情绪的传染也无法离开人的认同焦虑，并且诉诸以威胁到人的心理生存的道德压力。上面我们已讲到，个体进入群体后，必须认同于群体的属性和目标，并且以这一目标作为道德准则来检验自己的行动。他必须通过语言、姿势和动作表现出与这一目标方向一致的情感与信念来，以便通过这一道德准则的检验。显而易见，在群体中，当某个人表现出了某种与这一目标方向一致（情绪如果太强烈有可能会摧毁这一目标，但对于群体来说，再强烈的情绪也是与这一目标方向一致的）的情绪（这种情绪通常与愤怒有关，愤怒常常能加强群体的凝聚力，而恐惧则常常会导致群体瓦解。因此，群体鼓励愤怒，暗中赋予它以正面的道德性），它便给别人造成了一种认同焦虑，使这个人承受着因他的情绪所带来的道德压力。我们看到，即使是喊着口号在大街上游行的群体里，成了“无名氏”的人们之间也存在着被勒庞、弗洛伊德等所忽略的心理竞争。在群体中，当一个人的情绪表现出来，即等于给他人发出了一个信号，告诉他人他的存在更符合群体的道德准则，从而更具道德优势，而道德优势对应于心理优势，使他人相形之下处于心理劣势，威胁了他人心理上的生存。因此，基于心理竞争，他人也必须表现出这样的情绪。'
