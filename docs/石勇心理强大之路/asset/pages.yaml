  md: '以一开始就打破你被社会所同化的那种思维模式，而这种思维模式恰恰又和价值排序在结构上是同构的。当然，社会价值排序的打破不是一天可以做到了，因为你不一定马上让你的思维模式所产生的认知渗透入你的心理结构，从而改变你。但这是一个好的开始，让你有信心改变自己的弱小状态。


