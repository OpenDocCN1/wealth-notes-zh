- pgno: 96
  md: '他必须在心理上告诉自己他永远是“伊拉克现职总统”，否则他的存在就彻底虚无化，他在心理上就会彻底崩溃。


    害怕虚无化，这是死亡恐惧的精神折射。


    死是一个生物学规律。生命本身就逻辑地意味着必死。人与人之间或许在社会上千万差别，但在这一点上，国家主席与下岗工人、亿万富翁与乞丐没有任何区别。在这一点上，大家是平等，谁都没有凌驾于死亡之上的特权。死亡是绝对的平等主义律令。


    仅仅是死亡本身并不会产生问题，比如它在动物那儿就不会产生问题，因为死亡完全是一个自然过程，和出生一样是自然链条中的一环。由于只能以本能对外界作出反应，只有死亡的过程让动物产生肉体痛苦。它们没有死亡恐惧。


    但对于有思维和精神的人来说，死亡却是一个很大的问题。并不仅仅是死亡的过程让人恐惧，人们害怕的是死亡本身。它代表了绝对的虚无和沉寂。它是对一切可能性的终结，是不可穿透的黑暗。


    人们并不是死亡真正来临时才害怕死亡。死亡本身的不确定性让人随时都可以想象它的来临。正因为如此，死亡恐惧像幽灵一样在我们的精神结构中挥之不去，它是潜伏在我们身边的猎手，我们只是待宰的猎物。


    我们既害怕死亡过程的痛苦，更害怕死后绝对的虚无。这是虚无是对存在的根本否定。因此，死亡恐惧实际上扩散到我们生活的诸多领域中，比如，一个人拥有可以


