    5. 把死亡哲学化（理性化）。前面我们已经说过，死亡恐惧的力量是相当强大的。但它为什么那么强大？其中一个非常重要的原因是：我们对它的反应，更多地是一种心理反应，换言之我们被我们的本能、我们的情绪所主宰。我们藐视死亡，在日常生活中是借助于愤怒之类的情绪，这终究不能持久，难以变成日常生活中的态度；我们可以在精神上变成一个狂热的宗教徒或意识形态分子，从而藐视死亡，但可惜我们不是，也不应该是；我们可以认为
    自己可以接受死亡，但这更多是暗示或强迫自己这样认为，这只是头脑在告诉我们这样，从内心里，我们实际上仍是怕死的，这只是一个自己欺骗自己的骗局。在死亡面前，心理结构的力量非常之弱。


