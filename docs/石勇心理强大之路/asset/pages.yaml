    # 苏格拉底


    搞哲学的人没有谁不知道苏格拉底和他被审判的故事。两千多年来，他一直是哲学家心目中的圣人。这位古希腊哲人两千多年来一直影响着人类社会。在今天，我们仍然受惠于他的思想和人格遗产，以至我在写这本书的时候，对他仍然高山仰止。


    他是人类精神的一道丰碑。


    即使不搞哲学的人，只要读过一些书，大致也知道苏格拉底，知道与他有联系的这两句话：“认识你自己”“我所知道的就是我一无所知”。


    公元前399年，他被控不敬神和毒害青年而被雅典公民大会判处死刑。他为自己做了辩护，但只是“无罪”的辩护，而不是对不想死的开脱。审判是不公正的。他的朋友克里托曾经到牢房来劝他逃走，并妥善安排了一切，他不仅没有逃走，反而说服了克里托。在他生命的最后时'
