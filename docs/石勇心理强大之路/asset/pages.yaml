  md: '![](img/096f27f926d0436b0d17a31b2e36cf78_147_0.png)


    成的群体中，当危险出现时个体可能拔脚就跑，而在一个“亲戚团”里，个体则对危险毫无畏惧。这一点离事实的真相并不远。


