- pgno: 31
  md: '语言有时虽然对于我们的感知是一种遮蔽，但对于认知来说却是我们进入真相大门的钥匙。要了解置我们于心理洞穴秘境的原因，看穿那些操纵我们的表面强大但却内在虚幻的东西的幻像，必须了解几个用来描述和界定它们的关键性概念。


    # # 自我


    每个人都说“我”。“我”就是一个人的身体、一个人的观点、一个人的偶像，一切进入、驻扎在一个人的心理世界操纵他的东西。攻击到一个人所认同的观点、一个人所信仰的对象，就是攻击到他的“自我”。


    精神分析的鼻祖弗洛伊德讲过一个关于人格结构的故事。这个故事的主角是“本我”、“自我”、“超我”。


    在弗洛伊德的故事中，反映生物本能欲望的那部分人格结构被称为“本我”，它只遵循“快乐原则”，只想满足，不管其他。


    人原本是动物，因此：在一开始的时候，也只有“本我”。“自我”沉睡在“本我”中，而“超我”要到出现了社会才有。


    随着“本我”与外部世界的接触，通过知觉——意识系统，“自我”从“本我”这个母体中分裂出来，就像一个孩子降生。它根据“现实原则”行事（一个人不能放纵自'
  merge: -1
  img_proc: true
- pgno: 32
  md: '己想怎么样就怎么样，而是要考虑现实），调节“本我”与外界的冲突。“超我”是代表良心、道德等东西的人格结构部分，它一旦形成，就以强有力的“命令”对“自我”作出道德规约和理想要求。


    这样，在弗洛伊德的故事中，“自我”实际上是一个受气包，既要考虑“本我”的本能冲动，又要考虑“超我”的道德命令和理想要求，同时还要考虑现实种种条件的限制，小心谨慎地调节“本我”、外界、“超我”之间的冲突，谁也不能得罪，疲于奔命。这是一个复杂的动力结构，要维持心理正常，必须保持这三种动力的平衡。


    需要强调的是，弗洛伊德的那个“自我”是ego，而不是self，不是我们通常讲的自我。很多哲学家、精神分析学家、心理学家、社会学家在讨论自我的问题时，指的是self而不是ego。所谓的“自我认同”，指的是self-identity，而不是莫名其妙的ego-identiIy。在前面和以后的论述中，除非说到弗洛伊德用的“自我”概念时指的是ego，否则“自我”一律指self。


    之所以如此强调，是因为ego和self含义差得太多，前者只是后者的一部分。用弗洛伊德的“自我”概念难以解释很多心理问题，真正能解释的只是self。从弗洛伊德对于“本我”、“自我”、“超我”的界定中已经可以看出这一点了。在他的理论中，“自我”（ego）已经说明不代表人格的全部，而在我们平时所说的“自我”（self）中，它在某种意义上已经包含了“本我”、“超我”。也就是说弗洛伊德的“自我”（ego）的内涵和外延要比我们一般所说


