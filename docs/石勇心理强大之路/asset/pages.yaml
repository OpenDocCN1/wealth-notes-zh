  md: '你的心灵来说是一种强大的控制力量，但是，这种强大的力量在驱动你的时候，你面对的恰恰是一个险恶的世界，一个在博弈中遵从伦理规范者处于守势甚至要输掉的世界。


    为什么会这样？


    哲学家康德在他的伦理学理论中有这样的表述，就是一种伦理规范要真正成为伦理规范，它必须可普遍化，就是说，如果一种伦理规范你只希望自己这样，但不希望别人用来对付你，那么它就不能成为规范。比如说，你想说别人的坏话，但却不希望别人说你的坏话，那么“说别人的坏话”就不能成为伦理规范。康德说，当你做某件事情的时候，你要想到你这是在为所有人“立法”，所以，只要你不想让别人用你的规则来对付你，那件事情就不要去干。


    我们反过来推导就是，一种伦理规范，必须是大家都遵守的，只有依赖于这一点，伦理规范才能给大家，特别是给遵守它的人带来好处。如果有的人遵守而有的人不遵守，那么不遵守的人就占了便宜了，势必要伤害遵守者。很不幸，现实就是这样。


    我想你一定明白了，当你遵守伦理规范的时候，你玩的是一套和现实不同的规则，你被这套规则排斥在外，这套规则恰恰是以伤害你这类人为目的的。你所遵守的伦理规范一让你利益损失，二让你没有心理防御，你自然感觉不到道德给你的强大。'
