  md: '怕做错，所以总是拖延，最终不了了之，然后非常沮丧。接下来，我会再次分析自己所面对的情况，再次做出完善的计划，继续下一个循环……如同苦海轮回。


    怎样才能战胜自己呢????


    我知道，我缺乏的就是成功学所说的“行动力”，已经到了极为严重的程度。我曾经离家出走，去寺庙里求神的帮助。也尝试着学习尼采的“强力意志”，也尝试着去接触什么大师的所谓“成功学”。但都没有什么用!!!


    我非常迷惑，并且有着时不我待的强烈感受。


