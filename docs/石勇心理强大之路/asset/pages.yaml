  md: '# 第7章

    死亡恐惧


    生活。害怕死亡的人必然害怕生活，他难以承受生活本身所意味着的各种打击、苦难、挫折。不过，我在这本书里讲的心理强化训练，目的就是为了做到这一点，因此不把不害怕生活作为一种方法进行阐述。


    1．找到平衡。找到平衡的本质基于一种死前占有多少的社会比较，它是心理竞争在死亡问题上的延续。人们喜欢在日常生活中在社会占有物上进行比较，从而进行身份、地位、优越感、价值感的竞争，竞争的目的是把别人比下去，让自己在心理上占据优势。在死亡的威胁之下，人要克服死亡恐惧，也可以用这一招，既然在死亡上人人都是平等的，那么，如果一个人生前占有得很多，把别人比了下去，以致别人在生前与他相比根本没有什么价值，那么，即使是死亡，他也赚了；在这个占有更多的心理背景之下，他似乎获得了不惧死亡的勇气。这一方法运用到极致，就是战争场面或街头痞子的斗殴中有人狂吼的那样：“老子够本了！”他们杀死一个人，死就获得了平衡，而他们杀死两个人，在他们看来已经赚了。


    我想指出，就对于死亡恐惧的克服来说，找到平衡这一心理动机是非常隐秘的，只有在砍砍杀杀的场面才显现。在日常生活中它常常化为一个人对于社会稀缺资源的疯狂占有。他们能够意识到，人生苦短，人总要死的，只有占有很多才能显得人生有价值，在死亡面前才不留下“遗憾”。很多贪官和对金钱崇拜的人就是这样。


