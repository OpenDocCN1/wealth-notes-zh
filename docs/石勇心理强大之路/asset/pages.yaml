    在人类的理性面前，任何外部事物都无法对人构成威胁。


    当我说到苏格拉底的时候，也许你已经明白，我会说到“认识你自己”。是的，这是你必须做的。但在这个方法里，暂时还不要求你达到那个高度。


    你需要做的是：对一个让你痛苦的事情，或你自己的心理活动进行反思、观察（如果有时间和心情，在一些高兴的事情上，也可以问问自己为什么高兴），追问这意味着什么，为什么会这样。


