    刻，他还在与来看他的人讨论严肃的哲学问题。当毒酒端来的时候，他镇静地、毫无畏惧地一饮而尽。朋友们都流下了眼泪，而苏格拉底反过来安慰他们勇敢些，安静下来。他慢慢地在屋子里踱步，然后说腿发沉，躺了下去，最后安详地闭上眼睛。他在死亡面前的沉静惊心动魄。他无愧于那个时代“最勇敢、最聪明、最正直”的人的称号。


    苏格拉底在心理上为何那么强大，甚至在死亡面前都如此心灵平静？原因在于，他的哲学思考，他的理性能力在力量上远远超过了死亡恐惧的力量。他的存在对于生死已构成一种超越，更不用说世间荣辱。而理性之所以有那幺强大的力量，是因为它对人构成了一种真正的说服。在后面讲克服死亡恐惧的那一章我有详细讲述，想从一开始就了解得比较深的读者可以先翻开后面阅读，再返回这里接着读下去。


