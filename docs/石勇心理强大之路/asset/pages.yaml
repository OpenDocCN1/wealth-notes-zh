  md: '# # 学会用理性应对外部世界


    # ## 原 理


    有一种心理防御机制叫做“合理化”（或“理智化”），就是当一个人做了一件他后悔或让他痛苦的事情时，为了消除自己的痛苦，他便找理由由安慰自己说这么做是对的，就是把这么做“合理化”。


    这个“合理化”的结果是什么，就是一个人为了消除痛苦，不敢正视自己的内心。的确，这样干痛苦可以慢慢地变得不再袭扰你，但你的内心已被你的心理反应所否认。久而久之，你会成为自己的陌生人。


    这就带来一个可怕的后果，你在心理上很软弱。第一是本来就没有勇气正视自己，第二就是你消除痛苦——其实并没有消除，只是被掩盖或转移了——的方法恰恰强化了你的软弱。因为合理化、理智化依赖的并不是真正的理性。它不是经过你的大脑真正思考的，而是被你的心理所操纵。


    因此，这种让痛苦的消失的方法，只是饮鸩止渴。你也许永远也改变不了让这种心理防御机制运作，但是，从今天开始，你的确需要对心理防御机制做出反思。你的确可以让自己获得理性的能力，而不任由你的心理'
