    # 价值排序支配着人们，但人们浑然不觉


    商品是分档分级的，从形式上以价格来衡量。比如，老百姓自家酿造的散酒与茅台根本不能相提并论，它比茅台在价格上低得多，根本不成比例。地摊上几十元的衣服，当然也永远无法与精品店里动辄千元以上的衣服相比。


    除了这种价格上的反差可以让我们确认商品的档次以外，我们还发现，商品其实也有“没有牌子”、“普通牌子”和“名牌”的区别。这种区别并不一定是由质量决定，而只是和质量有交集。这样，依赖于名牌与否，它们在价值上也有一个高低不等的排列，构成一个我们选择的序列。


    所有这些现象都在我们的经验之内，完全就是常识。我们可以为常，甚至都不会想到要思考一下。它已经成为'
