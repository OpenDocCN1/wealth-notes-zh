  md: '![](img/096f27f926d0436b0d17a31b2e36cf78_107_0.png)


    # # 第7章


    完成了死亡进程而已。


    但我们为何害怕死亡？一个重要的原因是，在心理上和社会上我们感觉我们没有“活够”。我们中的许多人，一辈子从未反思过自己的生活，而苏格拉底早已说过，没有反思过的生活是不值得过的。怕生活的人虽然不一定怕死（自杀者就不怕死，但他怕生活），但怕死的人肯定怕生活。苏格拉底的心理强大，与他真正生活过有关。


    以上的话的意思是：无论我们如何用世俗的很多东西掩盖我们的内心渴望，无论我们如何追求世俗的成功来标榜我们的自我价值，只要我们没有真正地对生活进行思考并获得人生的意义，我们的存在是有缺陷的。尽管已被压抑，但内心里的声音会隐约告诉我们没有真正有意义地生活过。我们不想死，因为我们还没有找到生的价值，我们隐约感觉到白来了世间一趟，我们对世间有着眷恋。


    但人生本无意义，意义是赋予的。正因为如此，思考人生的价值何在就成为我们心理强大的一个要件。它可以让我们尽量少受一些我们在内心不需要但却具有很大诱惑性的东西的影响。它可以让我们判断并驱使我们该去做些什么。


    在这里我不提供选择，也不作价值判断，因为每个人都有他的价值观。但是，我想一个人多思考人生，多做推动社会进步的事情，无论是提升自己的素养，还是打造强大的心理，都是很有用的。


