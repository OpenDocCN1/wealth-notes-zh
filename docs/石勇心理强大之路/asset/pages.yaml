    蔑视尽管是基于虚弱，但对于死亡恐惧的克服来说是成功的（人本来在死这一确定的永恒力量面前就是虚弱的）。只不过，它有一个缺陷，即情境化、短时化，无法成为一种常态。因此，在日常生活中，仅仅是蔑视死亡，一个人还是不能躲过死亡恐惧的追杀。


