  md: '在此我要说的是，有些问题他们并没有解释清楚；而在另一些问题上，他们的解释却显得片面乃至错误。


    # 三


    让我们首先来考察一下群体形成的心理机制。在睁开他们的一双慧眼观察群体时，勒庞和弗洛伊德都有意无意地假定了一个“领袖”的存在，“他”（实际上也可能是“它”）乃是群体凝聚力的粘合剂。一群羊似乎总得有一个领头的，就像勒庞所讲的，群众不管需要什么，首先都需要一个上帝。但在我们所考察的群体中，并不需要存在一个领袖。游行队伍里当然有组织者，但没有一个人位于万众瞩目的中心。除此之外，勒庞和弗洛伊德还假定，当个人进入群体时，他即已被催眠，作为个人他已经消失，变成了“无名氏”。这是一个有可能带来误解的假定。事实上，在群体中，消失的只是个人与群体目标、群体属性无关的社会属性，而一个人的“存在”并没有消失。在群体中，确证他的“存在”仍然是他行动的一个深远的驱力。而也因为假定了个人的消失，勒庞和弗洛伊德都没有看到在群体中人与人之间仍然存在心理竞争。这一心理竞争恰恰是群体的情绪得以相互传染，情感得以引互强化的根源。还有必要指出，尽管在群体中个人的心理特征与他单独一人时的心理特征颇为


