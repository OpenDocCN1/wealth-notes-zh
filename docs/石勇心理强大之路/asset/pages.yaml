    # 解析


    你说的不正确。如果你没有战胜那个虚假的“自己”，你在外部世界面前根本无法做到心理强大。


    我先要说一下我们平常所说的“战胜自我”是什么意思。我们把一个能够“战胜自我”的人当成了不起的强者，他在和自己的战争中赢了。


    但其实如果一个人和自我作战，他必输无疑，因为他会陷入自我的冲突与分裂之中。但为什么我们又赞扬他呢？原来，他所战胜的那个“自我”并不是真正的“自我”，而是假的“自我”，是外部世界来控制、奴役他的东西。


    千万不要被自己的感受给骗了。由于我们实际上并不太警觉，当我们“想要”什么时，并没有弄清楚这是内心的声音还只是在重复他人的声音。


    但战胜自己绝不是和自己作对。心理强大的秘密之一


