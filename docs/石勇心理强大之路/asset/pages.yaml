  md: '孔明分拨已定，先引五千兵退去西城县搬运粮草。忽然十余次飞马报到，说：“司马懿引大军十五万，望西城蜂拥而来！”时孔明身边别无大将，只有一班文官，所引五千兵，已分一半先运粮草去了，只剩二千五百军在城中。众官听得这个消息，尽皆失色。孔明登城望之，果然尘土冲天，魏兵分两路望西城县杀来。孔明传令，教“将旌旗尽皆隐匿；诸军各守城铺，如有妄行出入，及高言大声者，斩之！大开四门，每一门用二十军士，扮作百姓，洒扫街道。如魏兵到时，不可擅动，吾自有计”。孔明乃披鹤氅，戴纶巾，引二小童携琴一张，于城上楼堞前，凭栏而坐，焚香操琴。


    却说司马懿前军哨到城下，见了如此模样，皆不敢进，急报与司马懿。懿笑而不信，遂止住三军，自飞马远远望之。果见孔明坐于城楼之上，笑容可掬，焚香操琴。左有一童子，手捧宝剑；右有一童子，手执麈尾。城门内外，有二十余百姓，低头洒扫，傍若无事。懿看毕大疑，便到中军，教后军作前军，前军作后军，望北山路而退。次子司马昭曰：“莫非诸葛亮无军，故作此态？父亲何故便退兵？”懿曰：“亮平生谨慎，不曾弄险。今大开城门，必有埋伏。我兵若进，中其计也。汝辈岂知？宜速退。”于是两路兵尽皆退去。孔明见魏军远去，抚掌而笑。众官无不骇然，乃问孔明曰：“司马懿为魏之名将。今统十五万精兵到此，见了丞相，便速退去，何也？”孔明曰：






