    这真是奇怪了。一个人仅仅因为他喝的是茅台，在我们眼中就比一个仅仅喝散酒的人“高档”。同样，在同等容貌下，当一个身披千元以上衣服的女人走过我们面前时，我们无疑认为她比只穿几十元一件的地摊衣服的妇女要“高档”得多。


    我们无法无视这样的事实：脱了衣服，人与人之间根本没有区别。这一哲学命题我们同样无法反驳：抽象的人与人之间根本无法在价值上进行比较（所以才要法律面前人人平等）。但是，我们更是无法忽视这样的事实：人与人之间，在我们的视野里确实是有“低档”、“高档”之别的，用正式的说法就是有“上等人”、“下等人”的区别。


