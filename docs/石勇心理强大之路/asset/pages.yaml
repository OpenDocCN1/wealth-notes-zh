    论证较长而且复杂，占去了《斐多篇》的大量篇幅。出于简便起见，我只在这里把他的逻辑梳理如下：


    第一，哲学家和常人不同，他更关注知识而不是意见。他关注不会消失、朽腐的美本身（理念），而不是美的事物。一个人要想获得真理，必须摆脱身体的诱惑。真正的哲学家能够摆脱身体欲望，超越于可见的身体而专注于不可见的灵魂，使灵魂摆脱与身体的联系。苏格拉底一生都在实践他的哲学，他极少受感官欲望影响，比如总是


