    当个体进到群体后，其行为便不可避免地要受到他人行为的影响。几乎所有人都看到了群体中情绪的传染和所带来的巨大威力。但在解释这一情绪传染的心理机制之前，我们必须进行限定，即这种得以传染的情绪与群体存在本身及目标一致，比如愤怒。而恐惧的传染则不适用于我们的这个解释（稍后我将解释），因为它的传染会带来群体的瓦解。


    关于群体中的情绪传染，勒庞作了天才的描述，但却认为不易解释清楚，必须“把它看成一种催眠方法”。而弗洛伊德则试图作出“心理学解释”，拿出了他的拿手好戏“利比多”，认为这是一种“利比多联系”。然而弗洛伊德是错误的。情绪的传染实际上来自于心理竞争下的道德压力。事实上，在群体中，某人身上有某种情绪，然后在另一个身上也有某种情绪，用“传染”来表达最多只是一个类比；否则即容易形成误导，以为某人真把情绪“传”给了另一人。疾病的传染可能通过人的接触进行，但情绪的传染并不能简单诉诸于人与人的接触来'
