- pgno: 152
  md: '看穿了存在的真相的人，二是完全不知道存在的真相的人。在群体中，如果个体所体验到的始终并非个人，而只是“群体中的一员”，他当然不会怕死，他会为群体及其目标慷慨赴死。然而，在某种与死亡有关的信号的强烈刺激下，哪怕只是一瞬间，原先铁板一块的群体也会瓦解，从而群体中的人总会被带回到个体的命运层面，他的生存本能总会被激发。而恐惧这一情绪的表现，同样是无意识的。


    恐惧这一情绪无法被传染和强化取决于如下因素：当某个人的恐惧表现出来时，立即遭到他人的语言、行动压力。自身的负罪感（恐惧违背了他作为群体一员的自我认同）和害怕群体的惩罚使他倾向于压抑这一恐惧。而他对恐惧的压抑对于那些想表现出恐惧情绪的人又是一种道德压力。这样，基于个体的心理生存，在群体中潜伏的恐惧很可能会改变方向，变为愤怒。而恐惧得到传染和强化则取决于：借助于与群体属性（群体从来不会认为自己是“人”的集合，而总是某“类”人的集合）无关的人与人之间人性或“人”这一存在属性的心理联系，一个人的恐惧所暴露出来的个体孤弱无助的命运的迅速让另一个人看到自己相似的命运，进而生存本能也被激发，他也体验到了恐惧。他的恐惧情绪的外露（或表现）因第一个人对于恐惧的表现（这种表现没有马上受到惩罚）而得到了合法化的确认，而这种恐惧本身恰恰又是对第一个表现恐惧情绪的人的一种支持，一种合法化。就这样，恐惧在群体中经过“人际互动”，就得到


