    这种情况说明你的心理上还是很弱的。你不敢面对未知的世界，这个世界一定要有得到证实的确定性你才有安全感。你希望用“完善的计划”来给自己增强一点确定性以便消除恐惧，但这是徒然，只要结果还未确定，你仍然恐惧。


