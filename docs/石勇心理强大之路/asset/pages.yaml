  img_proc: true
- pgno: 151
  md: '# # 附录


    与群体存在本身及目标不一致的情绪的相互传染、相互强化的心理机制和与群体存在本身及目标一致的情绪的相互传染、相互强化的心理机制并不一样。我们上面讲到，与群体存在本身及目标一致的情绪总是被赋予某种正面的道德性，而像恐惧等与群体存在本身及目标不一致的情绪则总是遭到非法化。身上具有这种情绪的人，是不可能通过群体的道德准则的检验的。准确地说，这一情绪会给他造成“自我认同”的焦虑，使他承受来自自身的道德压力。不仅如此，他的这一情绪还要遭受来自集体的道德压力、他人惩罚性行动的挑战，他很有可能被视为“动摇分子”、“变节分子”而遭到围攻。当一个人无法预测他这一情绪会获得认同时，让这种情绪表现出来总是危险的。这里的原因在于，一个人身上只要具有这种情绪，就说明他的存在已经裸露并被自己体验到，从而在某种意义上已从群体的束缚中挣脱出来，实现了个体性的回归——而情绪蔓延下去群体即被“解构”，还原成一个个作为社会原子的人。这是对群体及其目标最大的背叛。所以在军队中，“动摇军心”总是一项不可饶恕的罪名，而革命队伍对于“悲观主义”则总是表现出仇视。


    然而如果在群体面临严重的威胁时，比如在我们所设定的枪响后的情境中，恐惧完全有被激起并得到相互传染、相互强化的可能。它之所以能够战胜个人及集体的道德压力、惩罚压力，是因为它获得了生存本能这一同样巨大的力量的支持。只有两种人才不会怕死，一是'
