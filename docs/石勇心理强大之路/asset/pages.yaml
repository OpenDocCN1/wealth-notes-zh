  md: '# 序曲 心理强大是可以通过思考和训练来实现的


    “除了想方设法地逃避痛苦，人没有任何生活目标可言。”


    十年前，当我读到 20 世纪最重要的思想家之一、精神分析大师弗洛姆的这句话时，可谓心惊肉跳。


    但是，这么多年来，我不得不承认，对于太多的人来说，在这个险恶的世界，不要说能够获得幸福，连避免痛苦都难以做到。现实的险恶对于我们的心灵来说无异于一个地狱。我们在心理上是多么弱小。


    心理弱小表现为“情商”很差，表现为“心理素质”很差，表现为总是有着难以排遣的焦虑、自卑、抑郁、燥狂、不安、恐惧、迷茫、慌乱……它们不仅在生活中折磨我们，而且可以让我们弱化，在关键时刻无法冷静、理性地应对外界，从而犯下一些愚蠢的错误。


    因为心理弱小，我们的生存根基其实一直在动摇。生活的一次变动、残酷现实的一次打击、他人的一次伤害，都让我们感觉到心理世界的风雨飘摇。很多人甚至因此而'
  merge: -1
  img_proc: true
- pgno: 4
  md: '被吞没下去。


    一百年前，精神分析的鼻祖弗洛伊德认为，在“自我”的家里，我们都无法自为主宰。这是因为我们没有理性能力看穿外界对我们的心理操纵，没有勇气可以抗拒外界对我们心理上的威胁。


    这本书，就是驱散心理弱小幽灵的一次尝试。


    只要你对以下问题中的某一个作了肯定回答，并且想改变自己，那么你有必要成为本书的读者，和我以及人类历史上的思想大师、灵性大师们进行一次头脑和心灵都参与的对话：


    +   - 你是否感觉到，在比自己漂亮、比自已有钱、比自已 有地位的人面前自卑，并且这种自卑对于你的生活、学习和工作都构成妨碍？


    +   - 别人对你的伤害是否让你感觉“很受伤”，并且当时缺乏任何防御与反击的能力？


    +   - 在某些场合，你是否犯过一些事后觉得非常愚蠢并且后悔的错误？


    +   - 他人和环境是不是容易激起你的情绪，在不知不觉中你被操纵而浑然不觉，你是否在事后意识到这一点？


    +   - 童年、少年的阴影是否仍然在笼罩着你，你是否痛苦不堪但却无法摆脱？


    +   - 在一个环境里，你能否敏锐地对事物作出判断，并不受任何因素干扰地行动？


    ……'
