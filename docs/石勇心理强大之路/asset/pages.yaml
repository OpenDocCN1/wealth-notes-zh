  md: '还原成一个和动物一样的生物体，承认自己的大限。他不再认为自己是英雄，不再企图通过疯狂地占有社会稀缺资源来避免自己的虚无化，事实上，对于很多曾经让人醉心不已的感官欲望他已经看穿，而不再盲目投身其中。死亡否认任何占有社会稀缺资源的意义，否认任何生存构架的意义；否认任何挣扎和对抗。一个人要能够做到对死亡的接受，必须在心理上已经历了太多，或触摸到了死亡。因此，真正运用接受这方法来战胜死亡恐惧的，要么是有太多生活经历的老年人，要么是亲眼目睹至亲至爱的人死亡，产生的心理巨痛无异于自己死亡一次的人。


