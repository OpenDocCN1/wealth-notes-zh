- pgno: 154
  md: '![](img/096f27f926d0436b0d17a31b2e36cf78_154_0.png)


    ![](img/096f27f926d0436b0d17a31b2e36cf78_154_1.png)


    先来看个体对群体的认同程度对于他的行动的影响。也许不难想象，在一个异质性群体里，如果冲上去只是找死，那么估计很多人不会再前进一步。在排除后面并不承担多少风险的人的行动压力的情况下，冲在前面的人如果看到身边的伙伴中枪倒地，而他们彼此并不认识，甚至也不属于同一组织（比如同是工会会员），那么他不敢再冲上去的可能性非常之高。在他的心理背景中，这个人在他的“自我”中并不占多少分量，甚至根本就没有分量，因此，他选择止步或逃跑很难威胁到他的心理生存。他哪怕再勇猛、再鲁莽，只要他并不想自杀，都无法对抗生存本能。而如果他对信念的持守没有达到随时随地都可以为之付出生命的程度，生存本能也会把他从警察的枪口下拉回来。


    与此不同，在一个同质性群体里，一个人的死会引起其他人的巨大反应，因为他们的心理生存遭受到了严重的威胁。我们可以想象，在一个“亲戚团”里，一个人的死完全可以激起一种复仇的强烈情感，这种情感很有可能让群体中的人战胜死亡恐惧。个人的性格特征将在他的行动中发挥重要的作用。他人行为的影响将使冲在前面的人的行动瞬间爆发。危险可能已不再被评估，因为此时最危险的是自己的心理状态。因此，在“亲戚团”这样具有血缘关系的群体里，群体往前冲的可能性实在是太大了。紧密的信仰团体（比如某个视信仰如生命的宗教团体）中的个体往前冲的机率也非常之高。他们虽没有血缘关系，但具有强烈的信仰联系，而这一信'
