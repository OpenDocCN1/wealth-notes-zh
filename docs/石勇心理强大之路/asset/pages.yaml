  md: '请首先想一下，在人类历史上，为什么迷信那么流行？是因为人们的智力低下吗？还是有某种东西干扰或干脆越过人的智力结构而影响人们的判断？好，暂时这样认为。那么，即使是在当代，在科学技术如此发达的今天，为什么还有很多
    人倾向于把很多不能解释的现象视为神仙或魔鬼所为？为什么在黑暗之中，当我们看到一个恐怖的黑影时，我们像自动的机器一样把它反应为“鬼”？


    也许这些问题太空了。但这样的情境你肯定不陌生：假设你和你的朋友正在一个地方谈话，突然有一个陌生人闯进了你们中间并且短时间并不会离去。在这个时候，你和你的朋友（至少是你）会感觉到一种不温和莫名的焦虑，对吧？为什么？


    我们还可以在现实生活中捕捉到大量这类现象。一个可能不会让很多人陌生的现象是：当你加入某个团体时，团体的价值观念、游戏规则总会对你构成压力，换言之，他们一定要同化你。而如果同化成不，你就要遭到排斥。你要么投降，要么付出代价。也就是说，要么把“我”融人“他们”，要么让“我”成为“他们”的敌人，没有中间道路可走。


    你对以上现象可以找出种种解释。但是，如果一一拿'
