    # 群体行动的逻辑


    不同，但后者仍然作为一个心理背景被带进了群体中，与在群体中他所受到的影响一起决定他的行动。


    毋庸置疑，个人进入群体的过程是一个“弱智化”的过程。勒庞甚至夸张地认为，在某种神秘机制的作用下，个体会退化成“动物、痴呆、幼儿、原始人”。这里的秘密在于：进入群体时，与群体属性及目标无关的其他社会属性已被个体所舍弃，他变成了“单面人”。有两种因素对于个人进入群体时的心理变化过程产生影响。一是群体的属性，个体要参与到群体，就必须认同于群体。二是群体的目标（同时也是个体的目标，正因为这一目标他才主动或被动地进入群体），个体不仅必须认同于群体的目标，而且必须把这一目标作为一种道德准则来检验自己的行动。莫斯科维奇看到了这一点，虽然表达较为模糊：群体会“强调那些把他们召集到一起的东西，即在他们聚集成一个派别前所有共同的东西。这些因素使有可能导致相互对立的个人差异减到最小程度。在交往和交换的整个过程中，不断抑制并消除区分个体以及使他们互相不同的个体意识。把他们召到一起的他们自身那部分因素变得越来越强烈，这一点适用于他们所有的人”。（莫斯科维奇，2006）


    这样，在刚进入群体时，个体的理性便已经不起作用，而是受心理力量支配。这种心理力量即是“自我认同”，它由他对群体属性与目标的认同所转化而来。所以，真正的问题并非群体有什么神秘的力量把个人俘获、吞噬，让他的个性心理消失，而是个人从群体中找到了'
