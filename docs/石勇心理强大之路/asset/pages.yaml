  md: '卑等心理的事物有了一种认知，只要我们发泄出与这种认知相对应的情绪，我们对它将不再恐惧或自卑。


    说一下我的经历吧，当初有这种感觉的时候，我对精神分析还一无所知，对哲学也未有any涉猎。但是，我真的应该感谢那次经历。当时不知道我突然变得心理不那么弱小是怎么一回事，但现在清楚了。


    当时，由于另两个人的原因，我有幸也一起被人“请”去吃饭。那是一家装修得非常豪华的饭店。原谅我当时根本没有什么“星级”的概念。


    你可以想象一下刘姥姥进大观园是什么情景，也可以想象一个从未到过城市的农民进城时是什么情景。请别笑，我长那么大，还从未到过那么豪华的、几乎可以说只有“高等华人”在那里出没的地方。


    不用我告诉你了，那个房子所透露出来的气势把我震慑住了。在吃饭的时候，甚至面对非常职业性的服务员，我都显得笨拙难堪。明眼人一眼就可以判断，我是个没过见什么世面的人，而且出身的阶层，在中国社会的阶层金字塔中是很低的。


    仅仅是一栋建筑里的结构、颜色、形形色色的装置、摆设等，能有多大的威慑力？当时我从未去想过这些，也从未去想，它们事实都是人造出来的，自身并没有任何生命力，而且基本上出自于在阶层等级上很低的工人之手。我非常“自然”（后来我才明白，根本不是“自然”，而是“社会性地”）地把它们看成高档、气派、威武，并屈服务于它们。同时，我对社会价值排序加以屈服的心理反应马上'
