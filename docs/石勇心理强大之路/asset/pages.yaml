  md: '动，一种死亡本能，由此可以解释人类的很多行为，比如战争、屠杀和自杀。这一理论显然是想当然的结果，弗洛姆已经准确地指出，人类的这些破坏性冲动（无论是指向自己还是指向他人）是生命受阻的结果。人还是希望发挥其生命潜能的，只有受阻了（无论是在小时还是在成年时，无论因何原因受阻）才走向破坏。换言之，人是怕死的。很多人不敢看死人，特别是死得很惨的人，这并不仅仅是害怕晚上做恶梦，而且是怕看到自己终会死亡的命运。他从死人身上可以看到自己的影子，这个影子让他害怕。很多人也害怕黑暗和黑暗中的事物，害怕坟墓，原因就在于它们的那种氛围都与“鬼”、与死亡相联系，人在这种氛围里容易产生被吞没、被攫住的恐惧。


