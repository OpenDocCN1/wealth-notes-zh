- pgno: 60
  md: '# 主动按社会要求去做去表演，

    内心却感受到真我的痛苦


    为什么会这样呢？


    上面我说过，自我一旦产生，就会贪婪地吸纳很多社会的东西纳入自己的结构里面，就是说，它总是要扩大自己的地盘。然而，吸纳的这些西些，有些是用来让人更好地生存，而有的则可能是垃圾，对人的心理结构有害。换言之，是社会和他在你没有意识或有意识但却只能屈服的情况下灌输给你的。它内化成了你的自我的一部分。


    社会通过哪些方式把它的东西用来灌输给你，内化成你的自我呢？


    大家都知道有几种重要的方式。一是社会化，这是没有人能够逃脱的宿命，除非你不在这个社会中生存。社会化可以让你掌握一定的社会生存技能，但如果一个社会实在不那么美妙，它也会把很多有害的东西灌输给你。二是社会互动，就是“再社会化”，你通过奖惩机制发现，只有这样想这样做才能带来好处，于是你便努力去符合它的要求。三是意识形态的规训，比如叫你爱祖国。四是权威的训导。


    无论怎样，一些东西只要变成你的自我，利用认同的力量控制你就非常容易。即使是一些有利于你的生存，并且不威胁你的心理结构的东西，也往往会成为你的弱点。






