  md: '# 恐惧死亡实际上是恐惧虚无


    绝大多数人都怕死，害怕我们的生命在不可预知的那一天消失。当我们看到死人，恐惧感总会猛烈地袭来。不仅是死人，与死亡联系在一起的各种象征性的实物、符号也会让我们产生恐惧感或阴森感，它们是棺材、坟墓、花圈……


    死人或这些象征让我们看到了我们最终的命运，但我们在心理上拒绝接受它。


    这是就本原层面的死亡恐惧而言。


    2005年10月19日，巴格达当地时间中午刚过，位于绿区的前复兴党国家指挥总部戒备森严，被称为“世纪审判”的萨达姆审讯在这里拉开帷幕。在法庭上，萨达姆脾性一切，毫不在意法官的指令，坚称自己仍是伊拉克现职总统。


    也许你会得出萨达姆心理很强的印象。但这是一个幻觉。他和被国际法庭逮捕的前塞尔维亚总统米洛舍维奇不同，后者可以反戈一击把审判自己的法庭变成“审判”北约的场后，但萨达姆却只是被自己的死亡恐惧所操纵。米洛舍维奇是心理上的真正强者，而萨达姆只是心理的奴隶：多年的独裁统治的“自我定位”在心理上的固化已让'
  merge: -1
