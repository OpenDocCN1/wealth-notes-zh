  md: '# 心理强大训练四：把死亡哲学化


    # 原理


    在生物学上人原本赤身裸体，文明和社会生活给他穿了一件衣服。因此，就理论而言，人可以与他的社会属性对抗，他可以抹掉某种身份，蔑视某种价值观，换言之，褪去他穿的任何“衣服”，因为这些“衣服”既不具有终极性，也不具有确定的不变性，它们永远是相对的、易变的。


    但是，人却无法与他的生物属性对抗，他是必死的，无法改变，这是一个具有确定性的残酷的真理。他注定要遭受生物属性的主宰，在恐惧之下，他只能改变对生物属性的表达方式和态度。对于死亡恐惧的克服来说，人只有六种方法：


    +   - 找到平衡

    - 蔑视它

    - 接受它

    - 把死亡宗教化

    - 把死亡哲学化（理性化）

    - 不害怕生活


    这里的最后一种方法，就是具有存在的勇气，不害怕'
