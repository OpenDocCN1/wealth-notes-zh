  md: '把死亡哲学化是如何让人对它的恐惧消散的，前面我在讲苏格拉底的时候已经讲过了，在此不再重复。


    # 步 骤


    对于死亡恐惧的克服来说，既然它是对死亡的想象和对恐怖事物的恐惧，那么，方法论就是用理性思考来驱散想象的不确定性，用认知和经验来消除恐怖事物对于心灵的影响。


    但除非受到强烈的刺激而改变了自己的心理结构（比如至亲至爱的人的死亡），否则想在短时间内克服死亡恐惧，难度非常之大。因此，这个训练要有长期性的打算，说“步骤”是不太恰当的。甚至，也许我们根本不能把克服死亡恐惧作为一种目标，因为我们的训练或说修炼也许不可能达到苏格拉底的层次，这样，对于很多人来说，这个训练的目的并非是为了克服死亡恐惧，而是为了带来自己真正的转变。


