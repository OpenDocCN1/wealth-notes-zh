- pgno: 155
  md: '仰已化为他们强烈的情感。不往前冲，他们要承受他们所信仰的神的谴责。具有情感关系的同质性群体在危险未来临时完全不可能被解构成一堆社会原子，危险来临时被解构的可能性也不大。在这类群体里，密切联系群体的心理纽带（无论是血缘关系所带来的道德责任还是对神的信仰所带来的道德责任，以及相伴而生的群体情感）已充分内化，以致抹去了一切外在约束的特征。在危险来临时，它远比那些依赖外在权力约束的群体在心理上强大得多，这就更别提那些因偶然的原因临时拼凑成一个心理群体，危险来临时就“大难临头各自飞”的乌合之众了。


    然而如果我们考虑风险在人群中的不平等分配，情况可能又不一样。我们知道：在群体中，冲在前面的人与处于后面的人的处境根本不一样。前面的人面对的是警察的枪口，他的行动直接决定警察是否再开枪。而处于后面的人并没有面对警察的枪口，他的行动几乎没有风险，因为前面有人帮他挡子弹。因此，他不需要对自己的行为承担责任，他已把这一责任转嫁给了前面的人。而且，他还可以用自己的行动给前面的人施加道德压力（尽管前面的人也可以用行动给他施加道德压力，但这一道德压力对他来说可以轻易承受，因为他的行动没有多大风险）。前面的人同时要承担自身的行动和后面的人的行动所带来的风险，而且他还要承担后面的人由语言、动作等所传递而来的道德压力。如果这种道德压力足够大，比如说后面的人一直在高呼“血债血还”之类，怒


