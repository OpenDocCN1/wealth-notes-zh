  md: '心理优势，必须寻找到另外的方法，这也恰恰是我在本书重点要讲的。


    二、智力层面上的心理强大。这种心理强大很好理解。我相信，在一个比你笨的人面前，一种智力上的优越感总可以在你的心底里油然而生。这种优越感就是一种心理优势，即是说你在他人面前，心理上是强悍的。发达的智力之所以能让一个人心理强大，在于智力可以让你看穿一些事情会发生或不会发生，从而消除了不确定性所带来的不安全感。你感到你可以把握一些事物。在这些事物面前，你是主体，而不是客体。


    三、哲学—宗教意义上的心理强大。这种心理强大在这个世界上只有少数人能获得：比如宗教隐修者、古典哲学家。在这些高人面前，世间的一切纷扰根本就不存在，甚至死亡都不存在。那些被奉为价值的东西在他们眼里一钱不值，社会价值排序对于他们丝毫不起作用。在心理上，没有什么能够战胜他们。


    要求世俗中人获得这种心理强大是不现实的，因为这需要极为艰苦的训练，彻底改变一个人的心理结构、思维结构。但它可以是一个理想的观照，我们可以从它那儿找到一些让我们在心理上变得强大的方法。


    也就是说，我们训练心理强大，但我们并不出世。在思维上我们超越我们的社会情境，学会像哲学家、灵性大师们一样思考，但我们的生活仍然在这个社会。以出世的方法做入世之事，以超越的眼光看待现实，以强大的理性能力培养强大的心理素质，正是我写作本书的方法'
