- pgno: 146
  md: '一种让他迷醉的新的自我认同。我们知道，个人独处时的自我认同不可避免地要遭受到一系列来自社会、他人和自身的挑战，并且依赖于一个对比结构，从而或多或少都具有“强迫”性质。但在群体中，个体所获得的自我认同消除了这一系列挑战，别人和他为一个共同目标而聚在一起本身就是对他的自我认同的一种支持和确证；他并且还取消了比较结构，一大堆人取消各自与群体属性无关的属性意味着他们的存在属性一样。因此，进入群体中的个体不仅顺利地逃避了自由，而且获得了远比独处时强大得多的心理力量，在心理上他成了群体的一部分，而群体则变成了他。群体的魅力首先并不在于它的人多势众，而在于它为个体创造了一种可以爽到极点的新的自我认同。


    对于个体在群体中所获得的与他人一样的心理特征来说，区别不同的群体可能没有意义：只要是群体，人们就会这样。但是，不同的群体给个体的认同感、责任感是不同的，从而，个体在群体中对行动——特别是应对特殊情境的行动——具有影响的心理背景也不一样。显而易见，一个同质性的群体在个体心中所占的份量比一个异质性群体大得多，而一个亲缘性群体所给予个体的认同感与责任感则让所有的群体都望尘莫及。在这里，认同感和责任感并非外在的东西，它们已内化入个体的人格结构，成为他的“自我”中的一部分。个人的行动严重受到他的“自我”的影响，因为作为“心理人”，谋求心理生存乃是他最深远的驱动力。在一个由陌生人组'
