  md: '“此人料吾生平谨慎，必不弄险；见如此模样，疑有伏兵，所以退去。吾非行险，盖因不得已而用之。此人必引军投山北小路去也。吾已令兴、苞二人在彼等候。”众皆惊服曰：“丞相之机，神鬼莫测。若某等之见，必弃城而走矣。”孔明曰：“吾兵止有二千五百，若弃城而走，必不能远遁。得不为司马懿所擒乎？”


    诸葛亮为何要玩“空城计”，上述引文已经讲得很清楚：


    第一，实属无奈。身边没有大将，只有两千五百人马在城中。这么少的人根本就不是司马懿大军的下饭菜。逃跑只有死路一条，按常规防守也守不住。因此，必须想一个让司马懿不敢攻城办法。


    第二，他有发达的智力，而他恰好遇到了司马懿。诸葛亮知道，司马懿知道自己平生谨慎，必不会冒険。因此，如果他冒险，司马懿必然会怀疑这不是在玩计谋引自己上钩。毕竟“空城”和“平生谨慎”的反差是非常大的，这必然给司马懿一个强烈的心理冲击。在这种心理冲击下，只要表演得逼真一点，就会印证司马懿平时对诸葛亮的判断。


    空城计是发生在两个高人诸葛亮与司马懿之间的智力博弈，同时它也是一场心理博弈。看谁在智力上更厉害，更容易转换成心理上的强悍。因为对人心和局势的透彻了解与分析，能让一个人突破不确定性的危险所带来的限制，超越于局势并操纵这场游戏。越能看清这个局，心里'
