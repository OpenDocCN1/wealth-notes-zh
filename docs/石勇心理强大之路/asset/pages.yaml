    # 人们在比较中屈服于他人，

    成为心理弱小者


    社会的价值排序的秘密到底在哪儿？


    上面我们讲了，社会的价值排序是根据社会稀缺资源在人们中间的分配状态来确定的，占有多的人就高档，占有少的人就低档。每一个社会的资源都有一定的分布状态，而决定着这一资源分布状态的，牵涉到复杂的政治制度、经济体制、政策安排、个人努力、社会排序机制（利'
