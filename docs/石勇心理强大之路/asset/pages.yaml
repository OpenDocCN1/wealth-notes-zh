  md: '# # 别把自己暴露在别人的火力下


    弗洛伊德在他的人格结构理论中早已指出过，自我实际上是一个受气包，一方面要应付强大的外界，一方面又要承受超我（道德自我）的指手划脚，另一方面还不能无视本我（本能）的欲望，在三个鸡蛋上跳舞。自我的弱小可想而知。而那些坏人则不存在这个问题，他们就是现实本身。


    我并不主张你成为一个不讲道德的人，只是揭示一个残酷的现实：那就是讲道德者总是输。而要求我们既不放弃道德也不输掉，我们该做什么？我的意见是，道德完全可以给你强大，你不需要放弃道德，只要改变心理结构，你不仅可以人格完善，在心理上也可以不可战胜。而唾弃道德者，人格必然畸形，事实上也活在自我憎恨和对世界的憎恨之中，并没有真正的安全感，无论他们所获多少，都不能挽救人生的失败。人本不应该这样存在的，但他们把自己弄成了这样。


    我要指出，在你讲道德的时候，改变你的心理弱小，防止自己受伤害并不需要你做多少，你只要保持防御心理即可。其实这一点并不复杂。在看电视的时候，你不是经常听人说“不要相信任何人”甚至“包括自己都不要相信”吗？所谓的不相信，就是不要把自己暴露在别人的火'
