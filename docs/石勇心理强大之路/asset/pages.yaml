  md: '# 消除掉他人强大的幻像


    你一定看过戏吧？无论它如何煽情，你仍然在看过了以后明白，这只是戏而已。也就是说，你骨子里有这样的一个认知背景在提醒你：那都是表演，是装出来的。如果你有幸走到后台，会发现一切都不再神秘。它已被还原：无非就是为了捕捉观众，传达某种东西，把各种因素组合一下显现出来而已。而这种组合所显现出来的东西，在你和它有一段距离时，由于它对你心理的作用，你就会觉得它还真像回事。


    假如你对此没有体会，那么，你肯定看过电视时政新闻。你有没有发现那些主持人的语调、神态等实际上都是装出来的？


    对于你来说，体会到这一点很有意义，因为当你知道它们都是表演，它们表现出来的那些东西（威严、高贵、强大、正义，如此等等）实际上已被祛魅。


    你会领悟到，强大或高贵之类东西并不是你面前的实体本身所具有的，而是借助于一定的表情、姿态、服饰等，使它们对应于一定的社会角色，契合背后的社会价值排序等“烘托”出来的。也就是说，它们不是自然物，而是无论是有意识还是无意识、个人性地还是社会性地装出来的。




    ![](img/096f27f926d0436b0d17a31b2e36cf78_113_0.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: '而既然你知道这一切是装出来的，它们对于你所拥有的力量就会消失。当你在心里面可以说“你就装吧！”，你实际上已有心理优势。人类的心理是这样的：对于真实的东西，可能有心理弱势，但对于“假”的东西（不一定是认知层面的假），则有心理优势，因为“真实”对应于无法否认其存在的实体，这意味着力量，而“假”的东西，则可能是一种虚幻，隐含着没有力量的设定。


    人本质上是一种善于表演的社会动物。不仅戏台上是在表演（本义上的），巫师作法、体育运动、求爱、待人接物的规矩等等，都是表演。因为是社会动物，我们所看到的首先并不是“人”，而是社会“角色”、“人格”，我们就是在与这些表演性十足的东西打交道。我想很多人都知道，在英语中，“人格”有“面具”的意思。


    +   1. 看新闻联播，仔细观察播音员的表情、眼神、语气，从中寻找“表演”的痕迹，不是强行认定，而是自然地感觉他在表演。当他露出一丝非常不自然的微笑时，一定要捕捉到。


    +   2. 同时，在电视上或有机会的情况看一些官方大人物的讲话，注意捕捉他表演的痕迹。


    +   3. 思考一下，如果你到别人家，或别人到你家，在你们并没有放得开的情况下，为什么还要说一些套语、做一些被视为尊重或友好的行为来表现你们的“关系”。


    +   4. 至少训练两次。'
