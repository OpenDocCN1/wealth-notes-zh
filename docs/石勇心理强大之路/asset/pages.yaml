- pgno: 66
  md: '值符号或信息的语言和行为引起的。由于你屈服于社会的价值排序，他人携带价值符号或信息的语言和行为，就此与你的情绪、情感对应，就像一按开关灯就亮一样——当然，你的心理是他人的电灯。


    这样，他人的语言和行为，就会非常容易地绕过你的大脑，作用于你的心理，也就是说，绕过你的智力结构，进入你的心理结构。此时，你就是他人的一个客体，没有防御能力，处于弱势。


    为了在心理上变得强大，你就需要打破这一点，不让他人的语言和行为进入你的心理结构。简单来说就是要挣脱社会的价值排序。只要你对他人的语言和行为不作价值判断，它就无法进入你的心理结构，而只停留在你的智力结构里面。而恰恰是这样，你不再是他人的客体，反而成为解读他人语言与行为的主体。在他面前，因这种主客体关系的转变，你拥有了心理优势。


    +   1.  想象一个人（比如你的上司）在你面前狠狠地骂你。这个时候，一定要克制住自己的情绪。这不是怕你冲动地回骂或揍他，而是说，一定要克制住自己的愤怒、恐惧或耻辱感之类。在心里面一定要告诫自己。在这方面，开始的时候一定要对自己狠一点，这是非常关键的一步，因为你这是要切断他的语言、行为与社会的价值观念的联系，褪去他的语言、行为的价值属性，消解掉它们所携带的价值信息。


    +   2.  同时，你冷静地盯住他因为骂你而呈现为某种表情的脸，观察到他的表情的扭曲更好，直视他的眼睛。告'
