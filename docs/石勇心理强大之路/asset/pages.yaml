  md: 攻击的这个人并不认为自己得罪过他。事实上，他不知道，他的存在本身就是对攻击者的一种得罪。事实的真相是：被攻击者的存在方式与攻击者当年（或许是在学生时代）的存在方式一模一样，但后来攻击者因利益等原因背叛、扼杀了当初的“自我”。为了合法化这种背叛和扼杀（特别是这种背叛和扼杀已经紧密地与利益联系起来，而在心理对当初的“自我”的体验和认同则有让这种利益失去的危险），攻击者必须彻底非法化那个当初的“自我”，并防止它再次出现。然而被扼杀的“自我”并没有完全死去，它在黑暗的无意识的地下室里仍在谴责这一行径。故而，当被攻击者出现时，攻击者从他身上看到了当初那个被背叛和扼杀的“自我”，犹如他的过去已经复活，并对他进行道德拷问，使他为利益而建构的那个“自我”瞬间崩溃。因此，他必须单方面地与被攻击者进行一场心理较量，借助于对后者的攻击而攻击过去的“自我”，使自己现在的“自我”在道德上获得正当性，谋求心理上的生存。
