  md: '吗？我想，他们无论如何不会因为这样的行为处死一个人，因为，如果人们所说的是真实的，那么他们除了拥有超过我们的幸福的其他幸福，他们现在已经是不朽的了。


    这样对死亡的哲学思考是否让你觉得死并不可怕？也许，这只是一个哲学家的一种看法。一种对世界的看法即是对世界的一种解释，这种解释会使世界看起来是一种样子而不是另外的样子。世界存在于你的智力结构中。于是，在对世界这样的“设定”下，你的智力结构中的世界图景会对你的心理结构产生影响，正如你的心理结构会对你的智力结构产生影响一样。关于何为智力结构，何为心理结构，它们之间如何相互影响，下面马上讲到。


    苏格拉底之所以不害怕死亡，是因为在他眼里，死亡或者并不是绝对的空虚，而是一场漫长的无梦的睡眠；或者死后并不意味着一个人的彻底消散和虚无化，而是灵魂从一处迁往了另一处。作为一种对生的延续，无论是哪一种，死亡都并不可怕，甚至可能还是一件好事。在认知结构上对死亡的这两个事实设定影响和改变了他的心理结构，使他在心理上能坦然接受和面对死亡。


    或许你也看出来了，在这里他并没有论证，而只是“设定”，严格来讲并没有诉诸于理性，所以还是很难让人从心里认为死亡就是这样。但作为一个实践自己的哲学的哲学家，苏格拉底不怕死当然不是暗示或强迫自己认为死亡不可吓的结果。在柏拉图的《斐多篇》里，他进行了影




