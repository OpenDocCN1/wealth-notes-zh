  md: '判断就越不可靠。就认知层面来说，事物的演变很少出现断裂，如果你的知识和经验都很欠缺，你就很难判断一个新出现的事物或新出现的一种现象究竟是怎么一回事，你的预测能力也要打折扣。


    我们要忘记，人是心理动物。童年期的诸多经验（无论是否造成心理创伤）会在人的一生发挥出重大的影响。不借助头脑的超越，我们根本无法斩断历史。而我们的诸多心理问题，恰恰就在于对我们的历史进行了遗忘（压抑）。


    在时间的链条中，过去、现在和未来是三个紧密相连的环。缺少了任何一个，时间的链条就会中断。而时间链条的中断意味着我们的心理某种意义上的悬空，意味着焦虑。我们被逐出一个不断延续的时间序列。如果我们既不了解历史，也不对未来有所畅想，在心理结构上我们和时间序列建构的世界就会失去联系，我们的存在就容易被淹没。一个能够与逝去的亡魂对话的人，一个能够设想未来的人，比一个悬空的人更不怕死，因为他的存在更体现为一种“自然”，站在历史和未来的高度上，他比后者更少焦虑，更能合理化死亡。


    多读历史是有好处的。能够在读史时设想历史的情境，发思古之幽情更好。


