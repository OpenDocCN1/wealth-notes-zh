  md: '力之下。当然，这些人可能不属于我所讲的有道德的人，但他们的话却是一种极端的心理防御。


    怎么在讲道德的时候保持防御心理，也很简单。


    你要想到，讲道德不是为了得到什么，而是为了你的人格完善，因此，它的价值在于你的行为，而不是行为的后果。后果不一定是你能控制的，但你的行为为你却可以控制。这是观念的转变。


    同时，当你在心理上投入某种人际或道德情境时，在智力上一定要超脱它。因此，不是叫你不要去相信任何人，而是说，在你相信的时候，一定要假设一个坏的结果，就是你的相信会被利用，或会出现你不想看到的结果。当你的大脑这样工作的时候，你已经建立了心理防御。


    # 怎样在小人面前保持心理强大


    # 提问


    当道德已经被人们逐渐抛弃的时候，那些少数的道德坚持者非常容易被世间疯狂的掠夺所伤害，也面临内心的道德挑战。请问：在不放弃我们道德坚持的同时，也积极参与世间利益的争夺，还能在心理上变得非常强大，这样的目标如何去达到？'
