- pgno: 33
  md: '# 第二二章


    的“自我”（self）狭窄得多。在弗洛伊德的语境中，“本我”、“自我”、“超我”可以打得天昏地暗；“自我”可以被折磨得疲惫不堪。但在我们所说的“自我”（self）中，它们都“代表”一个与他人区别开来的人，“本我”、“超我”的受挫，最终都会威胁到“自我”。比如，宗教的“爱邻如爱汝”这一“命令”在弗洛伊德那儿只是一种“超我”，可在我们的心理生活中，它却可以变成我们的自我。


    可以准确而简单地进行这样的区分：弗洛伊德的“自我”（ego）指的只是人格结构中的一部分，而我们在这里所说的自我（self）却是一种心理功能。本书所讲的自我，一律是指
    self。它构成了一个关于心理功能的结构，即“自我结构”。


    我们的心理之所以弱小，与自我这一心理功能息息相关。因为当它把很多东西（无论是真的假的，无论是自己的还是他人的）都变成一种心理功能的时候，一刺激这些东西，我们就被操纵。我们因自我的存在而被纳入了一个残酷的生活游戏。在这个游戏里，我们只是他人和社会的心理奴隶。


    所以佛教要破“我执”。我们的心理强大训练，则是要实践“认识你自己”的哲学训诫。通过对自己和世界的认识来看穿社会、人生和世界的幻像，从而超越那些置自己于心理弱小的情境。'
