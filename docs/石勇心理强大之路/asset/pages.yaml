    +   1. 上司（或任何其他让你敬畏的人）的所有让你在心理上处于弱势的东西，都是社会结构中的“角色”所赋予他的，并不是他本身，所以，他希望保持和你进行角色交往，希望你叫他某长某总，借此保持对你的心理威慑，但你要解构他这一手法，恰恰不要把他看成某个角色，而就是看成一个人。当你和他见面时，你需要在心里面告诫自己：这个角色是虚的，我不是在和1个角色打交道。


