  md: '# 心理强大训练三：狙击他人的语言和行为

    进入你的心理结构


    # 原 理


    在狙击他人的语言和行为进入你的心理结构（见方法二）时，在一开始你实际上仍是处于守势，如果你的训练有效果，他人伤害不了你。但你仍有可能无法快速地作出反应，随时准备破译和消解掉他人的语言、行为所携带的对你有威胁的信息。


    这是因为，一个对你具有利益或心理上的威胁的人（比如上司）站在你面前。你们的地位是不对等的。你相对于他比较透明（因为你是他语言、行为的承受者），而他在你面前更多处于黑暗之中（因为他说什么、要对你做出什么你不一定知道，而这些都可能会威胁到你）。在明处的人在心理上永远处在黑暗处的人更处于没有防御的状态，这就是为什么人类有一种窥视偏好，而且能带来快感，而被窥视的人则感到羞辱愤怒的原因。


    因此，你还必须狙击他，在心理上彻底占据优势。你无法改变你的透明状态，就按方法二切断他的语言行为与你的心理结构的联系。但这只是防守，你还必须赶在他的语言、行为发出之前狙击他，把他从黑暗里拖出，置于你智力结构的审视之下。在他说话之前，你应根据当时的情况，预测他要说什么，并先一步说出你的反应。


