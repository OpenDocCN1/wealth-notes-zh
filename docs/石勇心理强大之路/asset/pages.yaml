- pgno: 150
  md: '这样，情绪就得以“传染”。


    可以说情绪相互传染的心理机制并不复杂。那么情绪的相互强化又是怎么回事？其心理机制又是什么？


    从上面的分析可以看出，当一个人表现出某种情绪时，基于心理竞争，另一人也表现出这样的情绪。对于第一个人来说，别人对他的反应同时有两种功能，一是通过对他的情绪的支持使他的情绪合法化，二是反过来给他以道德压力。故而，他人的反应对于他一方面是鼓励，一方面是强迫，可谓“胡萝卜加大棒”，使他的情绪升级。放在别人身上也是这样。因此，情绪在相互传染之中，就得以相互强化。


    情绪的相互传染和相互强化都在无意识下进行。情况如勒庞所讲的，群体是无意识的奴隶。也如弗洛伊德所讲的，人在“自我”的家里，都无法自主主宰。


    愤怒等与群体存在本身及目标一致的情绪的相互传染和相互强化会让一个群体显出惊人的力量，看起来甚至可以吞噬一切——我们对于那些响彻云霄的口号、群情激奋的场面总是记忆犹新。但恐惧等与群体存在本身及目标不一致的情绪的相互传染和相互强化则可以轻易让一个群体瓦解。这到底是怎么回事？'
