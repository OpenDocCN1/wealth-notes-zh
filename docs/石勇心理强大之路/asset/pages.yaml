  md: '![](img/096f27f926d0436b0d17a31b2e36cf78_143_0.png)


    # 群体行动的逻辑


    体行动的逻辑”虽只有一字之差，却完全是两回事。“集体行动的逻辑”建立在“经济人”假设上，是一种理性逻辑，而我们的“群体行动的逻辑”建立在“心理人”的假设上，是一种心理逻辑。在“集体行动的逻辑”视野中，人基于理性的利益最大化原则对外界作出反应时，并没有“自我”的力量支撑，而在“群体行动的逻辑”的制约下，人对外界的反应恰恰服从于“自我”这一强大的心理功能的命令。“集体行动的逻辑”只涉及利益盘算，而“群体行动的逻辑”则涉及到情绪、情感、信念、信仰、人与人之间的认同、他人行为所给自己的道德压力或行动的合法性的确认，以及权威的监督作用等——人就是受这些东西所支配。这么说吧，一个人，在奥尔森的视野中可能在享受集体提供的公共物品时并不想为此付出成本，但在我们的视野中，一个宗教徒却可能为了他的上帝，为信仰他的上帝的教会去死。


    “群体行动的逻辑”简单地说就是群体形成的心理机制与在群体中个人行动的心理机制。它需要解释以下几点：心理群体是如何形成的，或者说群体形成的心理过程为何？在一个心理群体中，情绪、情感（包括愤怒和恐惧等）如何相互传染、相互强化，即心理机制为何？在一个心理群体里，一个人的行动受制于何种因素？在特定情境中，这些因素对于人的心理的影响是否会导致一个人战胜死亡恐惧？


    对这些问题的思考，实际上是在勒庞、弗洛伊德、莫斯科维奇等人的肩膀上重新审视一下群体心理学理论。


