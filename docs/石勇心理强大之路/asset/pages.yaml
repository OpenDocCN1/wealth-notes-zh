  md: '你一定可以想到，在花圈、棺材、坟墓与死亡的象征关系中，不是它们本身，而是它们的功用或功能使它们与死亡产生了联系。它们体现为特定的颜色和形状，但这些颜色和形状本身并没有什么象征意义，象征意义是人赋予的。既然人可以给它们赋予某种象征意义，同样也可以祛除它。


    祛除的方法就是思考。把它们作为你的认知客体来加以审视。如果你能够考虑清楚它们和死亡的关系，对于死亡本身你就可以客观看待。


    +   5. 多读书思考，消除对世界的陌生感。


    想一想，如果我们的亲人死了，我们会不会害怕？显然，即使你害怕，也害怕不到哪儿去。为什么呢？一方面，因为他是你的亲人，没有陌生感，而没有陌生感就没有威胁，因此，你看着他不会害怕，而只会悲痛；另一方面，你从内心一直不希望他死，潜意识里你仍然处于他还活着的情境中。亲人在你内心占的比重是相当大的，可以说是你的自我的重要部分，而这在心理上就相当于“是你”，那么，既然亲人的死不让你害怕，你自己对死又有什么可怕的呢？所以我们看到，很多在亲人死的时候，对于死亡的恐惧彻底消失了（虽然以后又冒了出来）。


    死亡的虚无是我们无法把握的，但我们对死亡的想象却可以修改。作为心理强大的训练，无论我们有没有过经历过亲人离去的悲痛，都可以从这个假设的情况中得到启示：知识和思考是消除世界的陌生感的最有力武器。当你能够客观、全面地看待死亡，在一定程度上你就减弱了死'
