- pgno: 34
  md: '# ## 价值排序


    一个低档的皮包和一个高档的皮包摆在一块，不仅其价格不同，折射的价值也不同。它们构成了一个价值的等级，一个位于高端，一个位于低端。这就是物品的价值排序。


    人也讲究价值排序。或者准确地说，物品的价值排序本身，恰恰是为了人进行价值排序。


    从古到今，总有一种主流的社会价值观念把人分成不同的身份等级，赋予人以高低贵贱的不同价值。古希腊有贵族、平民、奴隶，古印度有婆罗门、刹帝利、吠舍、首陀罗，古代中国有皇帝、官僚、士兵、农民、官僚、乞丐……你可以说“高贵者最愚蠢，卑贱者最聪明”，但作为一种事实，你不得不承认这一点：每个人骨子里都承认有这样的价值排序，谁都不想在身份上显得“低档”。


    在古代，人在社会价值排序上的位置很难移动，金钱虽然在提升一个人的身份上起过作用，但主要还是权力及世袭，而这一点基本上把人的位置钉死。但在现代社会，情况不一样了，由于世袭制被打破，一个人靠他的聪明才智，靠他的经济能力，完全可以在社会等级的阶梯上实现向上流动，使他的位置从低端移到高端。


    但是，这只是意味着，一个人可以有更多的机会通过


    ![](img/096f27f926d0436b0d17a31b2e36cf78_34_0.png)'
  merge: -1
  img_proc: true
- pgno: 35
  md: '努力从价值排序较低的位置向上攀爬，从下流社会爬人上流社会。而恰恰因此，价值排序的功能不仅没有弱化，反而强化了。在古代，由于身份、阶级的固化，价值排序偏低的人基于心理生存的需要，还能认同于自己的低贱地位，但在现代这已经不可能，因为阻止向上流动的硬性约束在理论上已经不存在，从而价值排序让处于低端的人充满了焦虑，并陷于狂热。


    以当代农民为例。四五十岁的农民就很安于自己的命运，在价值排序上他们已经麻木。而“80 后”“90 后”的农民工则难以认同自己的身份，价值排序给他们以很大的刺激。


    价值排序给我们带来的心理上的后果就是：我们因自己的价值排序偏低而总是充满焦虑，总是在价值上受到怀疑，总是具有自卑感，总是不自信。一句话，因身份、容貌等的价值排序偏低，一个人总是处于心理弱小的境地中。比如，在一个有身份的人面前，出身低贱的你在心理上就处于劣势。这自然会影响到你和他的交往。


    心理强大，要求一个人看穿社会价值排序的虚弱本质，摆脱它的控制，在心理上战胜它。


    # 思维结构和心理结构


    简单地讲，思维结构（也就是智力结构）对应的是人'
  merge: -1
  img_proc: true
- pgno: 36
  md: '的大脑功能，代表着无情感、冷静、理智；心理结构对应的是人的心理功能，代表着情感情绪以及价值偏好。


    思维结构很好理解。但心理结构是一个很复杂也很有歧义的概念，并没有一个统一的说法，正如哲学、心理学中的很多概念一样，包括像“理性”这样的概念。


    在本书中，它主要是指以下东西：人格（本我、自我、超我，它们也组合成“结构”）、性格（人的性格不是单一的，它们也组成“结构”）、价值偏好（不同的价值偏好也组成“结构”），以及这三者有关的情感、情绪等（更是“结构”）。


    思维结构和心理结构不是截然分开的，它们共同对外部事物起作用，一方会参与另一方对外部的反应，只是不同情境中各自的比重不同而已。比如，当你修电视机时，主要是你的智力结构在起作用，而当你被一个人骂时，主要是你的心理在作反应。但当一个漂亮的女人走到你面前时，你的大脑和心理同时起作用。


