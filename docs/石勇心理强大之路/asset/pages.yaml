- pgno: 25
  md: '响人类历史两千多年的精彩论证，他的观点被称之为“灵魂不朽”，并受到一些批判。不过我们在这里不要理会，我们需要注意的是理性的力量是如何体现出来的，而拥有这种理性力量的哲学家在心理上是多么强大。


    苏格拉底：现在我要对你们，我的法官，解释一下为什么在我看来一个真正把一生贡献给哲学的人在临死前感到欢乐是自然的，他会充满自信地认为当今生结束以后，自己在另一个世界能发现最伟大的幸福。西米亚斯和克里，我要清楚地告诉你们，这种事如何可能。


