- pgno: 46
  md: '用文凭、证书等把没有这些东西的人排掉）等。不是我在这里要讲的。


    但占有不同的资源，怎么可能让人在价值上分等分级？


    一个人要确证自我的存在和存在的价值，一定要和别人进行比较。社会就是这么运作的。存在本身是无法比较的，所幸大多数人的存在方式都是“占有式的”，所以可以通过他们的占有物去互相比较。它们的差别被纳入了社会的比较性结构，成为一个高低有别的价值序列。


    社会的这个比较性结构所运用的原理，就是美国经济学家凡勃伦所说的“歧视性对比”。他认为，歧视性对比的存在是因为有一个有闲阶级制度。在古代，一个人从事的侵占性工作（表征的是力量）具有荣誉性，有价值性，而一个人从事生产劳动则是低贱的。现代的价值排序只是这一区别的变种。


    我们不追问“歧视性对比”的社会历史。但有必要记住它的规则：力与美永远排在最高位置。


    因此，在从事的工作上，离泥土最近的工作永远是最低贱的。


    这种价值排序是如何做到让一个人屈服的？


    姑且不说古代在阶级或阶层上的隔离和禁忌（比如某种衣服只准上等人穿，下等人穿了就要受惩罚），从而保持上等人与下等人的身份分野，以利于识别，从而维护价值排序不被颠覆，事实上，大多数人即使没有这种隔离和禁忌，也会屈从于它。


