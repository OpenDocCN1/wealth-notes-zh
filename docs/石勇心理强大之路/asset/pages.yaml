  md: '# 提问


    在公众场合演讲，怎么样保持一个合适的心态呢？


    （网友“怀念○小时候”）


    # 解析


    最好的演讲就是善于洞悉听众的心理并调动他们的情绪。心态是前提。


    如果你在内心确实不自信的话，那么只能采用这样的方法：在一开始的时候，不要看听众的眼睛和脸，假装看他们但只是在虚看他们。你想象你面前是一个只有你一个人的世界。也就是说，告诉自己你不是在对一帮人演讲。


    假如你感觉到你的演讲自然了，有了自信，那么，就可以先顾一下听众看他们的反应，捕捉他们对于你演讲的态度的信息。如果有不被你打动的迹象，继续上面第一步。如果有被你打动的迹象，就可以看他们的眼睛和表情，调动他们的情绪。


    这样干都是有理由支撑的。在没有自信的情况下，第一步不要看听众是因为此时你是他人审视的客体，你在心理上是处于弱势的。你假装看他们但实际上视他们如无物，就是要消除你的客体地位。第二步，就是把你变成一个主动的主体。


