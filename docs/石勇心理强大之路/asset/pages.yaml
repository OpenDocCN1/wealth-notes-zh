  md: '# 第一章

    心理强大是一种强大的心理能力


    人都想得到，但只有少数人才能获得。它们只有通过比较才有意义，所以永远是稀缺的。


    这种“心理的强大”是怎么得到的？真相是，是否拥有稀缺资源，对应于一定的社会阶层、角色、身份。是否拥有稀缺资源和这些阶层、角色、身份组合，在社会上便构成了一个有高低之分的价值序列。人们根据资源、身份等自动地对一个人的“价值”进行排序，并在心理上屈服于这个价值排序。所以，如果你很有钱，你有权力，你是博士，不管你是否很牛，别人在你面前的确没有心理优势，你会感觉自己很牛。


    在此必须强调：这种心理优势依赖于占有社会稀缺资源的优势。之所以后者会转化为前者，是因为人们的心理结构与社会结构契合。如果能够打破这种心理结构与社会结构的契合，你就根本没有心理优势。而当你并不占有社会稀缺资源，处于心理弱势时，只要你能够打破这种心理结构，你仍然可以获得心理优势，并摧毁别人的心理优势。


    对于少数幸运者来说，这种心理优势是相对的：永远有人比你更有钱更有权。因此既然你是靠获得这些稀缺资源才获得心理优势，那么在比你占有更多的人面前，你仍处于心理弱势。即使你一切都拥有，你也要面对死亡，在自然规律面前你仍是个弱者。


    而对于大多数人来说，因为并没有占有多少社会稀缺资源，因此并没有多少心理优势。而问题是：获得心理优势恰恰是你获得这些稀缺资源的一个重要条件。你要获得'
