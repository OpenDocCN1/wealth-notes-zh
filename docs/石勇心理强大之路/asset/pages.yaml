  md: '被启动：这样的酒店是高等华人出没的地方，我这样的人来此，好像不具“合法性”。


    在此后的两年时间里，我似乎没有再想起这件事。当然，你应该猜想到，这件事并不是不存在了，它已经在我的心里存在。我被激起的心里的弱小并没有改变，它在其他一些问题上经常给我带来麻烦。


    两年后，某一天坐公交车从郊区到市里。看着窗外的农地，及时不时出现的远处一栋栋高楼，我突然想到：那些看起来气派的房子，其材料不最终都是来自于那些泥土吗？


    这个一念念其实根本谈不上任何“发现”可言，它只是我对最基本的常识的回归而已。可惜，在多年的社会生活中（以后我会专门讲到我们怎么摆脱社会对我们的洗脑和心理操纵）我已经遗忘了这样的常识，以致当有了这样的感觉时，对于我来说无异于一次头脑风暴。


    灵感闪现，就绝不能丢开，而必须继续深挖，因为这是愚蠢和智慧、黑暗和光明的分界点。


    我继续思索。当想到城市只是在一片野地里弄出的庞大的钢筋水泥丛，相对于广袤的乡村它实际上很虚弱时，我差点笑了：那不过是人类对地球的鼓捣，但人们却都习惯了装模作样。换言之，人类对地球的鼓捣就像一个小孩玩积木游戏——真的只是游戏而已，高低贵贱的游戏规则都不是自然的，而是社会制定的。


    两年前在酒店里被震慑的那一幕，非常自在地浮现在我眼前。我开始笑出声来了。是的，太滑稽了！


