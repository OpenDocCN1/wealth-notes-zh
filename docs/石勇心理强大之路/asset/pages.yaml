  md: '相互传染和相互强化。群体的无坚不摧的力量迅速消失，群体宣告瓦解。


    # 六


    行笔至此，我们已在理论上揭示了“群体行动的逻辑”。可以说并不复杂。然而，当我们回过头来要对本文开头的问题作出解答的努力时，却发现要给出一两个答案并非易事。


    原因在于，枪响前，个体的行动没有受到生存本能支配，他只是作为一个“心理人”在行动；而在枪响后，个体不仅受制于他与群体的心理联系，受制于生存本能，同时还受到他人行为的影响。而由于每个人的行动所承担的风险并不平等（游行队伍里冲在前面和位于后面的人，他们对行动的风险预期根本不同，而且在枪响后后者仍可以表现出那些会带来危险的語言行动，但危险却强加给了前者），我们便无法用同一种标准来衡量每个人。我们发现了可以影响个体行动的诸多变量，比如对群体的认同程度、生存本能、他人行动的影响、个体对信念的持守程度、特定情境中他对危险性的评估、个体的性格特征、每个个体不同的风险担当，等等。枪响后，他所采取的行动，无论是什么都可以视为这些变量综合作用的结果。'
