  md: '暗的林子里或山间静坐半个小时，你会发现，这是一个与白天的现实完全不同的情境。当恐惧袭来时，你强迫自己冷静，感受一下这种氛围，会获得难以言喻的体验。这种体验可能是与宇宙交融，可能是独自承受虚无的包围而感触人类的渺小，但只要你不害怕，你就有经验用来减弱死亡恐惧对你的影响，因为你想象中的死后的情境，无非是这种黑暗情境的高级版本而已。


    +   4. 思考死亡的象征物。


    不知你看到花园、棺材、坟墓是否害怕？它们的确实具有阴凉恐怖的特征。


    在这个世界上，太美或太丑、太温馨或太恐怖的事物都可以轻易地绕过我们的头脑而刺激我们的心理结构。换言之：它们具有很强的刺激性，它们的性质立马就会激起我们的心理反应，从而在我们的心理结构产生特定的情境。花园、棺材、坟墓之类东西，只要你一看到：它们立马就会让你产生心理效应。我曾听一位50多岁的司机讲他看到棺材都害怕。


    但花园、棺材、坟墓真的那么可怕吗？并非如此。可怕的是它们的象征：死亡。


    所以问题不在于它们有多么可怕，而是它们轻易地绕开你的智力结构，对你产生了心理效应。你被恐怖的情境捕获。


    作为克服死亡恐惧的一个必要训练，就是要看穿死亡象征的虚弱本质。当你看到花园、棺材、坟墓时，一时也许会觉得害怕，或受到震慑，但不妨冷静下来想一想。


