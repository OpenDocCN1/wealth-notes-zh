  md: '# 两幅图画


    本书倡导以出世的眼光和心理状态来解决人世的问题。因此，我必须先描述下面这两幅图景。


    第一幅：


    整个社会就是一个迷宫。迷宫里有金银财宝。当然，这些财宝只有少数人才能拥有。


    从生下来的第一天开始，大家就在这个迷宫里想占有金银财宝。可惜，只有那些认识迷宫的道路，或拥有便利条件的人才能得到它们；绝大多数人要么找不到路，要么根本没有便利条件。便利条件就不想说了，因为这不适合大多数人的情况，比如你生为权贵，那你还没有条件？


    我想谈的是“路”。这个“路”就是决定资源分配的社会游戏规则。谁看清、掌握、能够影响游戏规则，谁就能够占到那些金银财宝。这个游戏规则及其内容无非是权力、金钱、名气、关系、文凭，以及努力、不放弃、聪明、心理强悍、厚颜无耻、吹牛拍马、拉帮结派……


    哪些人能够拿到金银财宝，大家都看到了，是特权阶层、聪明人、有能力的努力者。


    但是，需要注意的是，哲学家们并不是没有能力可以拿到这些金银财宝。早在哲学的最初期，西方哲学的始祖古希腊的泰勒斯运用气象知识预知橄榄油丰收在即，于是租下所有的榨油机，到收获季节果然大获其利。泰勒斯以此事向那些嘲讽他的人证明，哲学家只要想赚钱，就能赚'
