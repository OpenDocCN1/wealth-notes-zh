    上面已经说过，人类需要设置一道保护装置来应对死亡恐惧的威胁。大多数宗教和文化是借助于一套把死亡庄严化的仪式。如果人类看到自己同类的死，结局就像看到蚂蚁之类生灵的死那样悲哀和渺小，那么打击是相当大的。但在一套把死亡庄严化的仪式中，人的死有别于动物的死，死是一件庄严的事情。当然，仅仅是这一点并没有消除人类的死亡恐惧；因此，很多宗教无一例外地要继续'
