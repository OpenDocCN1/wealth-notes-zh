  md: '# 掌握筹码思维，轻松秒杀同龄人


    十节思维课，让你秒杀同龄人


    ![](img/6cb073bd511b44c977146f123dcb2138_0_0.png)


    我是丙丙，今天跟大家分享【十节思维课】的第一课——让你轻松领先同龄人的筹码思维。


    让我们从一个有趣的场景模拟开始：


    你和你的同学都是二十多岁。


    你毕业后进入体制，在基层公务员岗位上卷生卷死，十年过去，你终于混到了科长级别，拿着15W年薪，继续被领导当工具人磨合，你不断感受着中年人的疲惫和痛苦。


    而你的同学则连续不断跳槽、折腾副业，甚至混了很多奇怪的圈子，你不理解他在做什么，但32岁的时候，他参与的好几个项目都实现稳定分红，让他年入大几百万甚至几千万。


    你们的差距，到底在哪里呢？'
  merge: -1
  img_proc: true
- pgno: 1
  md: '其实，你们的差距，从你20岁那一年，就已经种下了。


    你的同学，有一种极强的天赋——


    他天生对“筹码”有感知：


    他知道人生是一个“积累筹码”的过程。


    他知道，人生是一场反复多次，不断交换对手的谈判和博弈。


    而在“战场”中得不到的，在“谈判桌”上也要不来。


    想要在社会中不被人欺负，靠的是实力，靠的是“手握现实博弈筹码”，而不是粉红色的美好想象。


    他能识别哪些事情是在积累自己的筹码，而哪些事情是在消耗自己的筹码。


    他的每一个行为，都在努力扩大自己手中的“筹码”。


    相反，你每天下班喝奶茶、打游戏，刷短视频，像大多数一样漫无目的而庸庸碌碌，和酒肉朋友逛街、看电影、吹牛皮消耗时间。


    让你的生命在无聊和庸常中打转。


    当青春燃尽，35岁危机袭来，你才恍然，原来那个幻想中的瑰丽世界，自始至终就是你的想象。


    风花雪月和岁月静好是一种华丽而充满诡计的装点，目的就是为了驯化你。


    更多资源，关注公众号【懒人找资源】'
