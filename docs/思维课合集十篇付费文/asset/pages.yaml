    当别人给你造梦，给你画饼，给你制造良好的“上头”体验时，请你不要沉迷其中，真的自我感觉良好，让自己的情绪被拿捏住；


    而是反向造梦，反向画饼，回馈以更多的情绪价值，制造更多“烟雾弹”。


    当你自己就很会提供情绪价值时，你就会很清楚“嘴巴甜、不值钱”，这个东西就是大家随便说说，让氛围和体验更好。


    当你知道“魔术”背后的所有机理，其他“魔术师”便不能通过制造幻梦和惊喜，拿捏住你，轻易对你施加实质的影响。'
