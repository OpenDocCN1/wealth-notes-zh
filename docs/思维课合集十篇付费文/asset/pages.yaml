  md: '如果你能清醒地判断出双方筹码和实力的差距，那么就能更清楚地意识到自己处于客观“低位”；


    那么哪怕对方表现得再慷慨大度，也不要有“软饭硬吃”、“站着要”的姿态，避免陷入“捧杀”。


    而是放低自己的姿态，提供更多情绪价值。


    有些逼数不够的人，很容易觉得我和大佬谈合作，我们是平等的，大佬也在我这里拿到好处了，于是表现的很牛逼很拽，让大佬觉得很不舒服。


    这样的人，往往对客观局势没有清醒把握，虽然“价值交换”和“交易”是世界的底层逻辑，但想跟大佬谈交易的人太多了，供需格局严重不对称。


    在这种情况之下，你必须意识到自己没有相对稀缺性，要谈成这个交易，必须通过提供情绪价值来加分。


