  md: '选择跪舔，是一种我要达成我目的的“手段”和“策略”，而不是我真骨子里“低姿态”，觉得自己毫无价值，产生“托付心态”，只能去攀附他人生存。


    我是我人生唯一的女主角。


    其他人再优秀、再牛逼闪闪，也必须“为我所用”、“为我赋能”。


    为了让大佬们“为我所用”和“为我赋能”，我将努力展现自己的“高价值”、体现自己的“低姿态”，给予大佬各种情绪价值。


    但倘若某些大佬骨子里信奉的不是“共赢”，而是“霸凌”，玩的就是欺负你、压榨你、消耗你的那一套；


    那他们就算再光环夺目，我都会勇敢且迅速地筛选和屏蔽掉他们。


