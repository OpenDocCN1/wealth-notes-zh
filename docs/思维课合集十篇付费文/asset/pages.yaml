  md: '# 掌握价值思维，让你的人生更值钱


    大家好，我是丙丙，今天讲十节思维课的第九课——掌握价值思维，让你的人生更值钱。


    与其说这节课是在讲“价值思维”，不如说是在给大家讲宇宙第一定律——“价值定律”。


    我想用这一节课，跟大家讲清楚什么是“价值”。人性的本质是不断向“有价值”的人和物靠拢；


    而让自己“活的高价值”，则是通往“自由”的唯一之路。


    -1-


    之前，丙丙已经在《财富的本质》中给大家讲过，财富的本质，是对“稀缺”社会资源的掌控。


    而“稀缺性”就是价值的本质。


    在这里，我们浅浅复习一下“稀缺性”的概念，这个概念出自经济学的“供求关系”。


    稀是指，这种社会资源的总量非常有限，最终只能由少数人把握，大多数人都把握不到，根本上不了牌桌。


    缺则指的是社会运转中“必不可少”，没他不行的重要资源，意味着这种资源有着巨大的社会需求。客观上，它被许多人“渴望”着。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 118
  md: '于是我们可以看到，“稀缺性”其实就是当“供给”小于“需求”时，自然产生的“奇货可居”，而它的价值自然也就上升到了极高的高度。


    之前有读者留言问过我，世界是否只能是“金字塔结构”？


    应该说，在私有制的条件下，价值定律必然发挥作用；


    这意味着只有少数社会资源的掌控者能够掌控大多数的稀缺资源，他们就是“高价值者”。


    而绝大多数人都只能是低价值者，处于金字塔的下端，这本身是“稀缺性”的价值定律必然带来的结果。


    而人的本性，就是追逐“稀缺性”，无论是在婚恋、还是在商业、在生活中都是如此。


    比如说，人都追逐漂亮、聪明、有钱的异性，因为漂亮、聪明、有钱都是“稀缺”的特质。


    再比如，你会发现一个商场中，网红餐厅人声鼎沸，门口排队的人络绎不绝，而另外一家普通餐厅却冷冷清清，门可罗雀。


    因为人性就是追逐更稀缺、更炙手可热的“网红餐厅”，甚至网红餐厅越是“饥饿营销”、越是“需求旺盛”，越能激起人们的追逐和等待欲望。


    再比如，奢侈品牌牌限购、排队，态度高冷，但它就是引人趋之若骛，让人想要拥有，甚至让你不惜献祭两个月的工资，也要买一只LV的包包。'
