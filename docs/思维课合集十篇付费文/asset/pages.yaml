  md: '公权力是一个虚幻的概念，但力量博弈，利益分配是实打实的。


    如果大家有点社会阅历就会知道，其实很多基层的执法人员，都跟当地的地头蛇关系密切。


    如果给不到实打实的利益或者损害，哪怕是名义上掌握公权力的领导，也会很难指挥下属办事。


    正所谓“上有政策，下有对策”，阳奉阴违，拉虎皮做大旗，给自己谋私利才是人性的日常。


    比如说某些在江浙颇有成就的领导干部，空降西北落后省份，大多数都是一事无成。


    因为当地势力、风气盘根错节，光靠个人难以指挥手下的干部，最后只能是自己“和光同尘”。


    所以，一个越是成熟的人越不会被高大上的概念所蒙蔽，例如“国家”、“公权力”、“爱情”。


    而是去探究这些概念下的内核究竟是什么样的，核心的驱动法则又是什么。


    如果看不清抽屉里真实发生的“力量对比”和“交易”，普通人非黑即白的线性思维往往很容易意气用事，冲动和情绪化地考虑问题：


    比如觉得某些富豪和政客很傻，自己都比他们行。


    再比如说不能理解一些妥协权宜之计，觉得没有血性，没有尊严。


    要搞清楚想要在现实事成事，“力量对比”才是一切的核心，除此之外，任何抱怨和情绪宣泄都没有意义。


