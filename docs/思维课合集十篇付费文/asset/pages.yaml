- pgno: 81
  md: '如果答案是"是"，那么无论已投入多少时间、精力或金钱，都要勇敢做到"断舍离"。


    控制你的"不甘心"，警惕幻想的引诱和美化，不要畏惧失去，拿回你的主场。


    而这个法则，在各个领域都能侧面得到印证。


    比如说"捞女"的核心方法论：


    是通过引导大佬"投资和持续下注"，让大佬舍不得离开一段关系，上头和自我美化，从而愿意给"捞女"花更多钱/给更多资源等等。


    从另一个角度来说，当你无法控制自己的不甘心，不能及时止损，那么势必会有人利用你的"人性弱点"，给你带来更严重的损失。


    所有向上攀登的路，都是"拿捏"自己的过程，学会"及时止损"，是克服自己人性弱点的重要环节。


    - 5 -


    而另一条丙丙想分享的"买单思维"，则是"及时止盈"，见好就收。


    其实，能做到"止盈"的人，要远比能做到"止损"的人更少。


    因为止损，需要克服的是人性里的"损失厌恶"；


    但止盈，则意味着哪怕此时此刻胜券在握，形势大好，你仍能不迷失，不被暂时的胜利冲昏头脑；


    而是有更高的格局，能够保持理智，看到更长期的利益和战况的斗转星移，对变化敬畏，不去图谋"自己拿不住"的东西。


    更多资源，关注公众号【懒人找资源】'
