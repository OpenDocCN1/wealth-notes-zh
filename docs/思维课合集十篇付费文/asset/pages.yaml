  md: '老周家的几个小孩里，老大和老二毕业于北大，工作优秀，掌控了稀缺社会资源，尽管他们对于赡养父母上并没做出突出贡献，但却仍然是父母最喜欢的孩子。


    而老三学习不行，工作不行，虽然陪伴在父母身边，对父母极度孝顺、付出一切；


    但对于父母来说，他就是“养口体”的工具人，不像老大和老二，是用来“装门面”心尖尖上的人，对工具人的待遇，和对社会资源掌控者的待遇，当然截然不同。


    看明白了这个逻辑，你就会知道，一味地付出并不能得到你想要的，只有做大自己的“价值”，你才能升级自己的待遇，让他人自动向你靠拢。


    也因此，倘若你想要在社会上拥有更多的话语权，那么就必须同比做大自己的价值——


    无论是颜值、身材、财富或者阶层地位，把自己能做到的方方面面临做到极致，增加自己的“稀缺性”。


    让他人对你产生渴望和需求，这才能拥有话语权和影响力。


    倘若你还想着什么“无条件的爱”，幻想着他人“理应”给你更好的待遇。


    那么丙丙只能说，认清现实，在战场上要不到的在谈判桌上也得不到。


    “无条件的爱”，在绝大多数情况下，是低价值者想要高攀高价值者时，对自己的自我美化；


    因为没有别的筹码能同高价值者做交换，只能用“给他无条件的爱”，提供情绪价值来绑定对方。


    当你是“高价值者”的时候，你会发现世界上有无数人想给你提供“无条件的爱”，因为只要靠近你，你溢出的光环就能带给他们无数好处。


