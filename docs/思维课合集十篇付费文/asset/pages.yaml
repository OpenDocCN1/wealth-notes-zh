- pgno: 127
  md: '而人的本性就是不想和“配不上自己”的人在一起，所以被分手乃至被劈腿就成为了—种必然。


    除非对方觉得他自己也是“低价值”，只能凑合着过；


    否则但凡有点选择权，他就会去找高价值的对象试试，有时高价值的对象不一定好掌控，一种可能的情况是找—个好掌控的低价值的，然后再去外面追逐高价值的对象。


    当然，在另外—种情况中，舔狗舔到最后应有尽有，那就是表面上舔，实际上内心却有自己的主场。


    —开始的舔，其实是—种欲取先予，先通过“舔”温水煮青蛙，按摩了对方的自恋，并制造了对方对自己的“需求缺口”。


    然后舔着舔着不舔了，就是在控制和收缩了“供给”，而此时“需求缺口”却仍然存在，打对方—个措手不及。


    通过这种方式，人为制造了紧张的“供求关系”，制造了自己的“稀缺性”。


    这个时候，对方往往会突然感受到你的“价值”变高了，从而对你“反扑”、“上头”，甚至加大付出。


    通过这个例子，是想告诉大家想要制造“稀缺性”，就必须维持好自己的框架，把你的“供给”牢牢把握在自己手上。


    不要在对方没有给到相应的筹码做交换时，自己无条件付出，加大供给。


    就好像奢侈品之所以昂贵，就在于限产，—旦无限供应就会瞬间不值钱。


