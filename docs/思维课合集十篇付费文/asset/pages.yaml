  md: '我之前写过很多次，互联网上的党同伐异，各种极端撕裂的指点江山和情绪发泄，本质上都是人性的一种对外"自我投射"；


    人们通过这种方式"确信"自己的存在，并因此感到自我意志的无限舒展和愉快。


    而商业社会的特点是，人性有这种"固有"需求，便会出现能满足这种"需求"的丝滑生意。


    人有不断对外索取"自我认同"的需求，那么便会出现一系列丝滑的奶头乐，来按摩你的"自尊心"；


    让你沉沦在全能自恋的"巨婴"爽感之中，并消耗掉自己宝贵的注意力资源。


    **当你已经习惯以这种方式来获得"自我认同"，你就会像吸毒一样，无法认清客观现实，逐渐变成一个装满情绪的罐头。**


    **你所有的言行，渐渐的目标都变成了"情绪发泄"，让自己"感觉好一点"。**


    比如说，明明是自己没有赚钱的能力，但为了让自己自我感觉好一点，就要说"只有坏人才 能大富大贵"，从道德上"美化"自己，让自己心安理得的摆烂。


    长此以往，你会越来越丧失"目标导向"，深陷于"自我陶醉"和"自我麻痹"之中。


    **而这一切，都会让你分不清"自我"和"现实"的边界；分不清哪些是你的"愿望"，而哪些是 客观规律，不以个人意志为转移。**


    除非有一天，你开始"内观"和"觉察"自己，你突然意识到这种奇怪的"自我投射"毫无意义， 并开始有意识地与这种廉价的"自我满足"获得机制保持距离。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 61
  md: '你开始有意识克制自己无时无刻在外物上的“自我投射”，你将你的“自我”与客观认知世界区隔开 来；


    只有进入“无我”之境，你才能有勇气和力量彻底打破固有的认知，真正客观地认识世界。


    有趣的是，能够在现实社会中穿越周期、取得惊人成就的人，无一例外都懂得“尊重客观”比“捍卫自我认同”更重要的道理。


    比如说比尔盖茨和瑞达利欧都说过：“和聪明人相处的好处是，你不用考虑他们的自尊心。”


    因为真正的“强者”，都知道他们真正想要的，是“自己真的一天天在变得更好”、“手握更多稀缺资源和筹码”，而不是阿Q般的“自我感觉良好”。


    经济学家凯恩斯曾说过：“只要有了新的事实和证据，我随时准备改变我的观点”。


    他们懂得不在客观事物上去投射“自我认同”，理解“客观性”是“不以个人意志为转移”的；


    在理解客观规律时保持“无我”姿态，不对抗规律，不扭曲规律，而是尊重并且利用规律，让客观事物“为我所用”。


    事实上，这在现实中非常难以做到。


    因为绝大多数人，甚至意识不到自己的“观念”如何绑架了“自我认同”，进而让自己无法客观认知世界。


    丙丙举个自身的小例子：'
  merge: -1
  img_proc: true
- pgno: 62
  md: '老读者都知道丙丙精通玄学，会看八字紫微还有星盘。


    三年前，玄学还没有今天这么的被“普遍接受”，打开一个B站的玄学视频，许多弹幕都在刷“封建迷信”的字样。


    这就是一个我们的“观念”不自觉绑架了我们“自我认同”，进而让我们无法客观认知世界的例子。


    当许多人下意识认为“玄学”都是迷信时，有没有考虑过，为什么会产生这样的观念？


    是因为过去受的教育让我们认为“唯物”就会高人一等，相信玄学就是“无脑”、“个人低价值”的体现。


    当我们的“观念”与我们的“自我认同”捆绑在一起之后，那么我们就很少会去主动尝试探索、颠覆自己的认知。


    因为我们不想颠覆对自我的认同，不想破坏内在的优越感心理。


    而对于丙丙来说，我首先做的一件事，就是将我的“观念”与我的“自我认同”解绑。


    首先在自己脑海里植入一个想法：


    我的观念很可能是错的，我允许一切发生，我随时随地准备颠覆我的认知。


    在此基礎上，我们才能尽情打开带宽，主动探索和冒险，并怀着“空杯心态”，以一种“无我”的、“不对抗”的姿态去接受一切发生；


    并期待和欢迎事物突破我们的预期，甚至修正我们的观念。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 63
  md: '正是怀揣着这样"开放"和"包容"的心态，所以我认真研究玄学，发现它确实不止是封建迷信，而是有它的道理和底层逻辑。


    然后我写了"十神看世界"系列，通过易学的辅助，帮助我更好地构建自己对世界的底层认知框架，更加辩证和圆融地把握客观规律；


    任何框架、任何体系，都可以并行不悖地为我所用。


    在这里，丙丙想请大家回忆一下我们第二节课学习的"资源利用思维"和第四课学习的"主场思维"。


    其实，这两节课的要点，就是要让大家有"资源利用"的意识，并且能够理解，世间万事万物本该为我所用。


    然而，当我们被自己的"观念"和"自我认同"绑架的时候，当我们无时无刻不再对外投射自我时；


    每当观念被冲击，我们难免会感到自我被冒犯，进而产生对抗、抵触心理，升起情绪，开始激进地捍卫情绪和自我认同。


    这些都会阻碍我们获得和分析信息，让我们无法客观认知事物本质，更别提让"万事万物"为我所用。


    丙丙的私人微信号签名是"愚者"，"愚者"是塔罗牌中的0号：'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/6cb073bd511b44c977146f123dcb2138_64_0.png)


    它意味着在生命之初，每个人都是怀揣着“愚者”的心态上路；


    没有预设观点，没有对外投射自我认同，没有对抗和恐惧，有的只是对生命的热忱和原始的激情。


    “愚者”的心态，就是一种“无我”的心态。


    而这种“无我”的心态，能帮助你最大化地把握客观规律，将万事万物无抵抗地化为己用，最大化资源利用。


    相反，任何固化的观念和思想，都将降低你的资源利用效率。


    除了将你牢牢地捆绑在较低的生态位上，享受情绪罐头之外，别无好处。'
