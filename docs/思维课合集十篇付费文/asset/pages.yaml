    同样，沉迷于外在认可，同样意味着会被外在认可所累；


    执着于他人的眼光，为了迎合能够给予自己认可的人而亦步亦趋，完全丧失掉自己的主场和自我，最终被当做耗材吃干抹净后被弃如敝履，成为空心人。


