  md: '如果只有温良恭俭让，而没有雷霆手段，就难免会被恶人侵害。


    比如说，丙丙之前在《为什么圣人不死，大盗不止？》中讲过，所谓高风亮节、不求回报的“无条件付出”，最终只能招致白嫖和霸凌者的变本加厉，嫡走善良者的生存资料和精神能量。


    最终，因为嫡你能量的成本太低，收益却极高，在趋利避害的人性驱使下，反而使得“白嫖”和“霸凌”成为了优势策略。


    通过上面这个例子，丙丙是想让大家明白，即使是“好的发心”，但如果无法客观认知人性，手段错误，最终实现的结果，很可能是和你的目标背道而驰。


