- pgno: 129
  md: '当你要展示高价值形象时，需要有高配得感、硬框架，才能打赢同他人的“心理战”。让别人更多为你付出，而不是相反。


    因为“越多付出”，“越多沉没成本投入”，才代表所追逐的事物是“高价值事物”。这是人骨子里对价值的衡量标准。


    “越是上赶着”、“越是过度付出”，“越是失去自我”，越代表这是“低价值事物”。


    看明白这一点，你才能平衡好“付出”和“投入”的限度，避免“赌徒心理”一般过度付出；


    而是有一个“欲取先予”的界限，在发现无法实现自己诉求的情况下（对方不给你想要的回报），公号·智学成长社，果断收回投资，及时止损，稳住自己的“高价值”。


    因为“高价值”的特质，就是不怕失去，无惧离开。


    这一点，适用于任何人际博弈之中。


    最后，丙丙想对这节课的内容做一个简单的总结和华：


    一个高价值的人，必然是能够做自己的庄，拿捏住自己主场，不轻易被他人所控制和夺舍的。


    否则，他必然会急得得失，难以维持自己的框架，不能调控自己的供需格局，从而无法维持自身的稀缺性，不断被压榨底线，当了他人的血包。


    一个高价值的人，必然是要让渴望和需要你的人变得更多，而不是变得更少。


