- pgno: 6
  md: '当然，事物的发展是变化的，今天天真感伤的小表妹，明天可能会成为极度清醒的女强人。


    我们只是判断当下，而不是铨口直断人的一生。


    第二，当你建立了无时无刻不去审视自己和他人的筹码之后，下一步，是有意识地去观察那些发展地更好的人，从开局一无所有，到飞黄腾达，他们是怎么累积自己的筹码的？


    举个例子，丙丙曾在《赘婿篇》中写过自己小伙伴小铜的真实经历。


    小铜是一个家境贫寒大帅哥，但非常善于提供情绪价值，本科时曾同时交往 5 个女朋友，都没翻车，还能让所有女孩都记得自己的好。


    后来他努力学习，赚取奖学金，赢带去枫叶国交换的机会，并在那里，通过展现自己的学习价值和社交价值，情绪价值，成功拿下了一位家产过亿的“白富美”小花。


    当然，白富美小花也有缺点，那就是习惯性地出轨，让小铜头顶一片绿油油。但目标明确的小铜并不在乎，仍然为白富美提供“独一无二”的情绪价值。


    展现出的忠诚和靠谱收获了老丈人的肯定，最终同白富美结婚，在老丈人资源的助力下青云直上，完成了阶层跃升。


    我们来看看小铜是如何实现筹码升级的。


    一开始，小铜手中的筹码是优秀的颜值（虽然不是顶级，否则可以直接出道），较好的社交和情绪价值才干，然后他通过在大学里交往 5 个女朋友，担任学生会主席，更好地历练和滚大了自己的社交和情绪价值筹码。


