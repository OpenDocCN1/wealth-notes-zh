- pgno: 43
  md: '# 建立主场思维，活出闪闪发光的自己


    ![](img/6cb073bd511b44c977146f123dcb2138_43_0.png)


    大家好，我是丙丙，今天我们讲十节思维课的第四课，建立主场思维，活出闪闪发光的自己。


    # 【1】


    首先，我想请大家思考一个问题，当你看到今天的课程标题时，你下意识会认为什么是“主场思维”？


    比如说，“当舔狗”这件事，你觉得是你有“主场思维”还是“没有主场思维”的体现呢？


    现在，你脑海里可能想到了一个“答案”，别着急，往下看，后面的内容，可能会打破你的认知。


    我身边有一些体制内的朋友，因为畏惧领导的权威，所以不断“讨好”领导，当“舔狗”，幻想着领导会会因为自己的“乖巧”和付出而给自己甜头；


    但结果却是，让领导觉得他是个好拿捏的软柿子，从而不断被压榨底线。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 44
  md: '还有些朋友，疯狂地讨好“男神”或者“女神”，无条件的付出，对他们好，幻想着“男神”、“女神”有朝一日会回头，会发现自己的好；


    可结局却是，男神和女神和别人在一起了，舔到最后仍然一无所有。


    于是，江湖中流传着这样一句话：“不要当舔狗，舔狗最后一无所有”。


    可另一方面，似乎也有很多“舔狗”上位的反例：


    有些对领导分外谄媚的同事，就是比你升迁的快；


    在第一课“筹码思维”中，丙丙写的“小铜”的故事，小铜疯狂地给白富美做“舔狗”，“舔到最后应有尽有”，甚至“舔”出了阶层的跃升。


    所以，到底什么时候“舔狗”会一无所有，什么时候“舔狗”又会应有尽有呢？


    现在，丙丙来揭晓这个问题的谜底：


    当你有“主场思维”时，你的“舔狗行为”将会最终让你“应有尽有”；


    相反，当你没有“主场思维”，坠入他人的框架中亦步亦趋，失去了“自我的配得感”，不再“以我为主，“甚至把某个人给你的肯定当做神赐和奖赏时；


    你的“舔狗行为”将会让你不断被“压榨底线”，最后彻底被吸血和献祭。


    那么，究竟什么是“主场思维”呢？


    从根本上来讲，就是对“自我的重视”，坚信“我”是一切的本源，我是宇宙的中心，一切“以我为主”，一切“为我所用”。


