  md: '比如说丙丙会在几个外卖平台反复横跳，避免被其中一家绑定和收割。再比如我之前提到的，出门住一阵时间五星级，就会住一阵普通酒店；


    进的了豪华餐厅，也下的了街边排挡，这是练习对物质的戒断，从而避免被某些能带给你巨大“物质”冲击的人所绑定进而杀价。


    坚持自己的主场思维，“向内求”，生活丰富精彩，有自己的事和目标去攀登和完成，并在这个过程中感受到自我的价值感和高能量；


    而不是过度依赖某个特定对象的陪伴、关心，包容，从而给予他对你“温水煮青蛙”的机会。


    在职场中也是同理，有自己的副业，有其他的收入来源，或者有核心竞争力，随时可以在市场化竞争中跳槽找到更好的工作；


    这才是你减少对公司or环境的需求，摆脱“办公室潜规则”、不被“体制”驯化的核心点位。


    另一个非常重要的降低对他人需求度的方法：


    **是做到冷静清醒地洞察实质，每一分每一秒都不要放弃对博弈方的观察**，而不是轻易被对方营造出来的“稀缺”、“完美”形象和光环、大饼所迷惑；


    放弃考察，甚至扑上去讨好，陷入他人的主场，并被杀价。


    我有个朋友，机缘巧合认识了一位富豪，带她出入各种高档场合，画各种精彩生活的大饼。


    朋友很快沦陷了，一心想要讨好富豪。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '当她跟我们几个闺蜜讲这个故事时，除了我之外，所有的闺蜜都说：加油，这个男人条件很好，你要成功把他攻略下来。


    只有我当时说，别着急，别上头，多观察观察，他是否真的那么有实力，还是只是出来装逼泡妞的？他对你有几分诚意，核心诉求点位是什么？


    他的那些饼就算是真的，也未见得能落实到你头上。没观察清楚之前，可以甜甜的相处，提供情绪价值，但不要那么快被他所“攻略”。


    **当你觉得对方无比稀缺时，你必然会产生恐惧，害怕失去，继而被对方捩出来，拿捏和杀价。**


    **而当你能头脑清醒理智地去观察判断，不轻易被他人的画饼、言语和光环所迷惑时；**


    **你就能在无数个别节中，捕捉到对方的真实价值，看透这个人，发现他也“不过如此”，从而彻底解构对方的“稀缺性”，降低对对方的需求。**


    这一点，不止适用于情场，在找生意合作方时，道理是一模一样的。


    **另一个解构他人稀缺性的方式，是想办法增加他人对自己的“供给”。**


    这一点比较难操作，因为我们终其一生，其实能控制的只有自己，**想控制他人，则需要玩弄许多技巧和人心。**


    比如说经典的PUA手段：先打压对方的价值，表示他这么差，只有自己才能看得上，让对方感到自卑，甚至自我怀疑；


    然后通过道德或者爱情绑架的方式，指责对方“不够爱”自己，不够“为自己付出”，不够“孝顺”，或者编织甜蜜陷阱，说各种“我养你”的话，使得对方主动增加“供给”，解构对方的稀缺性。'
