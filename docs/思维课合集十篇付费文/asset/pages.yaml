  md: '当你知道这三个问题的答案，并且不断行进在追求理想的路上，过五关斩六将地达成你的目标；


    你走的步履如风，你在一天天变成自己理想中的样子，并不断在挑战困难的过程中感受到自我的强大和存在。


    这就是你的自我认可感，它来自于你和自己的对弈，终其一生，你的对手只有你自己。


    所以，我在思维课开篇的几节课里，就不断请大家思考一个问题：


    你是谁，你想做什么样的事，你的目标是什么？


    注意，是你的目标，是你想做什么事，而不是父母希望你做什么事，社会对你有什么期待。


    自我认可感的充盈，必然意味着你有自己的一套完整的价值评判体系，独立于世俗规则之外；


    也因此，你能够挣脱世俗的枷锁，一心朝着自己的目标前进，贡献出最华美的表演。


    诸葛亮说“夫志当存高远”，论语说“君子立长志”——


    说的都是要为自己的人生做长远的打算，立下远大的目标，而在努力攀登这个目标、排除万难的过程，就是我们不断“向内求”，感受自己“生长”的过程。


    我非常推荐大家去看一部反应教员年轻时代的励志剧《恰同学少年》：


    你们可以看到一个人有自己的理想、目标和追求时，他将会焕发出什么样的光彩，爆发出什么样的潜力和能量。'
