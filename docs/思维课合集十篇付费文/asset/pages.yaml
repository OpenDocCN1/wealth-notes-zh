- pgno: 5
  md: '当然，这是她男神做出的排序，不同人的价值观会导致对筹码的排序不同，但你大概能判断这么几个问题：


    首先，这位男神认为，阶层的重要性大于颜值和情绪价值；大概率，他是一个非常清醒、而且注重自身筹码积累的人。


    这里面有一个隐含逻辑，那就是伴侣的阶层筹码，能够被置换为自己的阶层筹码，让自己也升阶；而颜值和情绪价值，则无法交换到个人筹码的积累。


    ![](img/6cb073bd511b44c977146f123dcb2138_5_0.png)


    其次，这位男神手中的颜值、情绪价值以及其他的综合筹码，远大于你的小表妹，以至于他能轻松找到跨阶层的对象，从而升阶自己手中的筹码。


    而你的小表妹，显然还处于懵懂的状态，她甚至根本没有“筹码思维”，更遑论如何将手上的筹码打出价值。


