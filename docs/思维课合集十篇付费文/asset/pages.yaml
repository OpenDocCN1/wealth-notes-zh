- pgno: 2
  md: '世界是一场残酷的博弈，而你沉迷于那些粉红色的安慰剂，从没有为自己积累过哪怕一分筹码。


    到了35岁，你已经失去了最重要的筹码，“青春和时间”，你不再有“莫欺少年穷”的潜质，你的未来不再是无限可能。


    你已经被定型了。


    于是，世界华丽的装点被赤裸撕开。


    在职场中，你没有筹码，只能被动地任尸位素餐的领导欺凌；


    在家庭中，你没有筹码，你的伴侣瞧不起你，你的父母觉得你没出息，你的小孩觉得你没本事，一心拿你当反面教材，发誓以后不能活得像你一样。


    当然，在有些时候，我们也会遇到珍贵的、勠力同心的家人。


    但最可怕的是，那些无条件爱你的、比金子还要珍贵的家人生了重病，没有筹码，你就没办法挽留住他们，让他们多看看世间的美好。


    而你天真可爱、聪明正直的孩子，你甚至无法给他一个公平竞争的环境，你的孩子未来只能去给别人打工，继续当螺丝钉，珍贵的才华被淹没在琐屑和无聊中，没有自由，也没有自我。


    本质上，这是因为你没有筹码，所以在社会这个谈判桌上处于下风。


    处于下风，就只能“被拿捏”，我们在巴黎和会上的遭遇，就是最好的注解。


    被拿捏是很不舒服的，可改变不了环境，就只能改变自己。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 3
  md: '于是，必须出现各种个打手文化，各种斯德哥尔摩综合征，来让自己适应“被拿捏”的状态，甚至异化出一种爽感，来让自己能够没有心理负担的活下去。


    这也是“牛头人”的心理结构。


    当然，总有人不愿意“被拿捏”，一百年前，我们有五四运动，有无数先驱团结起来，以流血牺牲，为我们换来谈判桌上的筹码。


    我希望今天的你，也“支棱”起来，不要自暴自弃，而是积极进取。


    如果你今年20岁，恭喜你，今天这篇文章，你读懂了，理解了掌握现实博弈筹码的重要性，以及如何去掌握现实博弈筹码，把自己手里的牌打出价值，并且行动起来。


    那么，我敢肯定，不出十年时间，你就可以远远将你的同龄人甩在身后，取得他人羡慕的成就。


    而如果你已不是20岁的年轻人，你越早一天理解这篇文章的认知，你便能早一天，为自己的人生争取到更多自由和选择权。


    我不希望你们有一天醒来，突然发现自己一无所有，只能阿Q的自我安慰说，至少我还有美好的精神，通过给自己打安慰剂来让自己好受一点。


    现在，我再划一遍重点：


    请你理解，世界是一张“谈判桌”，你和所有人都是种“博弈关系”。


    而想在博弈中处于上风，至少不“受制于人”，那你就需要不断积累你的现实博弈筹码。


    接下来，我拆解具体应该怎么做，并搭配具体的案例，来帮助你理解和消化。


