- pgno: 110
  md: '**你必须头脑清醒地看清此刻的力量对比，如果实力悬殊，就务必暂时隐忍、妥协和交易，然后想尽办法猥琐发育，提升自己的力量，从而改变力量对比。**


    而这，也是为什么金字塔顶的政治家、大商人，往往没什么道德感，大都冷血无情或者非常善于逢场作戏和表演。


    因为这批人能爬到那个位置，他们是把社会法则玩明白的：


    他们最擅长的一件事，就是"识时务"，和"审时度势"，无时无刻不在判断"力量对比"；


    进而决定苟一苟，隐藏锋芒，韬光养晦，和光同尘，还是已经到了可以走向台前，纵横捭阖的时刻。


    无论怎么做，**其目的都是为了"提升力量对比"。**


    在这个过程中，**可以采取任何手段，哪怕为世俗道德所不解**。


    -5-


    相反，越是下沉市场的普通人，越容易沾沾自喜于自己的道德高尚。


    因为对于普通人来说，大家往往除了"自尊感"之外一无所有。


    既没有任何真切的、能推动自己攀梯和前进的野心和抱负，也缺乏对现实博弈和拼杀中，玩法和交易的阅历和理解。


    因此普通人生存的第一要务，往往就是维护让自己自我感觉良好的幻觉。


    这也是为什么，很多普通人说着"公平正义"，但却停留在口头上，没有半分行动。


