- pgno: 119
  md: '**人们疯狂追求“稀缺性”的本质，是因为有人有“自我存在”的焦虑，人要彰显自己的存在感，**

    **要彰显自己的特别感，从而感受自己是“活着”的。**


    **而对于世界上80%的人来说，并不具备“向内求”的品质，而是要通过“向外求”，拼命去抓**

    **那些看起来“高价值”的“外物”，来证明“我”是独特的，“我”是稀缺的。**


    因为“独特”的我，自然该得到这些高价值、稀缺的东西。


    往往，一个人越是“自视甚高”，越是对自我有很高的评价，越会想要追逐和掌控“高价值”的

    外物，如物质、财富、权力和社会地位等等。


    很多人不理解为什么富豪会喜欢“奢侈品”、“豪车”“名表”这些东西，这里面原因很多，之后

    丙芮会再写文章专门来谈这个话题；


    但其中一个非常重要的原因是，上流社会的人都“自恋”，都觉得自己是世界上个顶个的“牛

    逼”。


    而绝大多数人的“自恋”都做不到“向内求”，必须通过外物来区分自己的阶级，证明自己的

    “唯一”和“独特”。


    在之前的课程中，我举过富豪追求明星的例子：


    实际上，明星不一定比衬花漂亮，但是明星的“价值”高于衬花，因为明星具有强大的“稀缺

    性”，明星被数以百万级别的人渴望和需求，因此产生了巨大的“光环溢价”。


    富豪追逐明星，本质上是在按摩自己的“自恋”，因为自己足够“高价值”，所以也要拥有如此

    高价值的“明星”。


    而就算是普通人，也很难抵挡世俗意义上“高价值”的攻击。'
