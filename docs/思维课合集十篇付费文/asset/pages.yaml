    必然是超脱了“我执”的贪婪恐惧，能客观地看到别人身上的不容易，知道这个世界上没有谁欠自己。


    他人的每一分帮助，都是他人的境界，是人闪光的体现。


    而不仅仅是你多么牛逼。


    更进一步的说，你的牛逼和别人的闪光也不冲突，越是牛逼的人，越能尊重和欣赏他人的闪光和牛逼。


