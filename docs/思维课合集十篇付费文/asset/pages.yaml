- pgno: 134
  md: '大部分时候，你看不清前者是一抹花团锦簇的陷阱，而当你自我麻痹，吞下玫瑰色的糖衣时，就开始在“吃屎”的路上狂奔。


    比如说，很多男人在追求女孩时，甜言蜜语、海誓山盟，给出各种“我养你”的大饼。


    一开始高冷矜持的女孩被打动，被宠成公主。


    她们深陷爱情之中，渐渐离不开男人，等结婚有了娃，被男人吃定，男人不着家花天酒地，女人开始丧偶式育儿，变成深闺怨妇。


    事实上，男人的甜言蜜语和深情款款，是一重“捧杀”；


    为的是能够让女人快速上头，离不开自己。从而以更低成本拿捏住女人，用包装出来的“爱”操控女人，为他无限付出。


    这些操作的本质，都是为了增加自己在博弈中的主动权，开局的做小伙低、深情万分也都是在演绎。


    被这种玫瑰色糖衣欺骗的女人，就好像《消失的她》中的李木子，闭着眼睛甘愿跳入“囚笼”之中；


    最终一定是失去所有主动权，任人拿捏，只能将希望寄托于男人的良心发现。


    而那些对男人的大饼保持戒断，不会被廉价的情绪价值打动的女性，不会在感情中丧失自我，而是专注于自身的内外修炼、事业发展，经济地位独立；


    则自然而然能在婚恋关系、家庭关系中保持主动权，让人不敢轻视和拿捏。'
