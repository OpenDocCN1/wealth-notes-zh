  md: '一些恋爱脑的女孩，始终纠结于对方“爱不爱她”，而不能认清人与人之间的关系，是价值交换的本质，也不能理性地考虑现实利益和筹码博弈。


    究其根源，是因为她将全部的“自我认同”都寄挂在了“对方爱不爱她”上；


    她如饥似渴地索求着对方的每一个回馈，因为对方的反应产生巨大的心理波动。


    只有通过“作”、“闹”，索取的方式，才能证明“对方爱她”，也才能让她感受到“自我”的舒展。


    一旦不通过“虚无缥缈”的“爱”来投射自我，为自己制造幻梦和自我美化；


    一旦要她理性认清关系的底层是“交换”和“价值的匹配与互补”；


    这些看似“冰冷”的现实会彻底摧毁她“自我认同”赖以生存的“幻梦”，她会瞬间感到人生没有意义，不明白自己是谁，为什么而活着。


    人性本能，是每时每刻都在寻找“我”、确认“我”。


    而大部分人寻找和确认“我”的方式，是无时无刻地向外去投射“自我”。


    而当外界的一切事物，都蕴含着你的“自我投射”时，你便会难以客观认知事物。


    因为每一次客观认知，都在摧毁你的“自我投射”，继而演变成对“自我”的攻击和冒犯。


    找不到“自我”的状态是很恐怖的，于是世界上的绝大部分人，都会宁可扭曲客观世界，也要迎合“自我认同”。'
