- pgno: 128
  md: '你必须守好自己的主场，做好自己的庄。


    可以玩点“欲取先予”，类似于搞点“超市试吃”，创造需求。


    但绝不能轻易扩大供给，必须等对方给你足够的回报，才能偶尔打开你的供给，从而始终维持自己的“高价值”状态。


    这点不仅适用于婚恋和人际关系中，在生意场，职场中都是一模一样的。


    你提供的价值，必须得到对方的等价交换。否则，你就是在自降身价，自己让自己变得不值钱。


    第四，建立高配得感，敢于提要求，展现自己的硬框架。


    在“向上社交”中，我们要有遁处地分析双方筹码，有意识在硬筹码不足时放低姿态，给大佬提供情绪价值，避免软饭硬吃（当然，底线是不能被白嫖和霸凌）。


    但是在筹码相近的生意场、婚恋等博弈谈判中，心态就很关键：


    在该展示自己高价值的地方，必须要绷住自己的“高配得感”和“硬框架”，避免被对手方嗅出“怂”的味道，进而无限杀价。


    配得感非常重要，许多打工人会下意识把自己放在低姿态位置上，这很容易让谈判对手方觉得你低价值，觉得你不要那么多，可以杀你的价，压榨你的底线。


    只有你拥有高配得感，对对方一些浅层付出和试探表现出云淡风轻的样子，别人才会判断你高价值，并为了和你谈成交易，主动为你追加更多付出和投资。


    类似于顶级奢侈品绝不打折，否则就是一种掉价一样。'
