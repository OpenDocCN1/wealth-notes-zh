- pgno: 48
  md: '我会要求我每天都容光焕发，光彩照人，把所有我能捣鼓的好的地方都捣鼓的非常好，每天走出去的时候，都是闪闪发光的大女主状态。


    而每当我的底层心态坚持“我的主场”，闪闪发光时，这种能量也会辐射到方方面面周围的人，会自动吸引他们的崇拜、欣赏，追随乃至到投资和下注。


    复盘我自己过去的经历，**每当我** **不专注于自身，丢弃了“以我为主”的“主场意识”的时刻，就会被他** **人牵着鼻子走**；


    目标感涣散，能量低下，患得患失，不停猜测别人的看法，陷入精神内耗，被他人意识到恐惧和怯懦，并被不断压榨底线。


    **更** **可怕的是，一旦失去“主场意识”，幻想着有一个避风港能够解救** **自己，幻想着有人能庇护** **自己，让自己“岁月静好”；**


    从而不再坚持“我的主场”，不再升级自己，**选择寄生他人，** **最终的结果只能是因为离不开对方而被拿捏，要么被榨干，要么被丢弃**。**


    这就是“主场思维”的重要性。


    失去“主场意识”，你终其一生只能和其他人一起陷入低质内卷，终其一生只能被支配，被掌控，没有话语权。


    必须按照他人的规则亦步亦趋地模塑自己，把自己打磨成工具人，并被动地等待他人的审判。


    你将不断自我消耗，成为时代的耗材。


    **因此**，我希望看到这节课的你，**都必须意识到“我的主场”有多么重要。**


