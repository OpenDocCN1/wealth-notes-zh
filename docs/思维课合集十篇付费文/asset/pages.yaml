- pgno: 69
  md: '这也是为什么，你会发现顶级的政治家、企业家100%都非常“理性”，甚至看上去“无道德感”。


    因为向上攀登的道路，本来就是你学会驾驭“客观”的过程。


    -6-


    最后，让我们来结合上一节课的“主场思维”，来更进一步辩证把握“有我”和“无我”之间的关系。


