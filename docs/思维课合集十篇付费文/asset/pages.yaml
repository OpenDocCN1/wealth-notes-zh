  md: '**当然，这里需要注意的是要坚持“主场思维”，客观分析，而不是被大佬的“光环”诱惑，产生幻想，不能理性分析，亦步亦趋地落入他人的主场。**


    最后，丙丙想说，想在现实世界中做成事，是一个和自己的人性做斗争、和他人的人性作斗争的过程。


    **不要去恐惧兽性和力量，而是学会利用兽性和力量，去制约人性恶的一面，学会去驾驭工具，而不是被工具所驾驭。**


    放下从小说和影视剧中学习得的“苍白无聊”、充斥着“自我感动”的所谓三观，开眼去看真实的世界，在实践和感悟中去理解真实的人性。


    今天的内容，也许不适合90%的普通人，因为被豢养的状态，是不需要理解底层真相的。


    **今天的内容，是给立志于不做普通的人的人看的。**


    不想做普通人，就意味着“反人性”，意味着不情绪化，意味着“无我”，你可以坚持自己的底层信仰：


    **但在客观认知事实层面，不要过多做道德标兵，而是更多关注力量对比，利弊得失，如何增加自己的筹码和力量。**


    正如我们当年成功建国，靠的不是道德说教，而是枪杆子里面出政权。


    道德可以用来感召他人，从而为你汇聚“势能”，助力于目标的实现；


    道德也可以是你的某种底层立场，但不该妨碍你用各种手段去采取行动，更不该成为自我感觉良好的享乐工具。


