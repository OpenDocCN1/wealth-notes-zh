- pgno: 47
  md: '他们在每一次的人际互动中，都没有做到始终围绕着自己的“目标”；而让他人察觉到了“自卑”、“怯懦”、“害怕失去”和强烈的托付、寄生心态。


    于是，他们不断被杀价，不断被压低底线，然后节节败退，一无所有。


    “应有尽有”的舔狗，底层的建设，都是极度清醒和“目标导向”的；


    他们可以通过各种手段来达到自己的目的，但心态的底层，始终没有放弃过“我的主场”，一切以我为主，一切为我的目标服务。


    这就是“主场思维”——


    我有我的人生主线，我有我的目标，我在围绕着我的目标而不断自我成长，不断精进自己，不断修炼对自己方方面面的把控能力。


    没有任何人和事可以干预我的人生主线。


    当你是个有“主场思维”的人，那么你会发现自己有不竭的生命动能，极度旺盛而引人艳羡的生命力；


    你良好的磁场和能量，将让你闪闪发光，让你不断吸引他人的追随。


    我就是一个“主场意识”极强的人，我知道我的终其一生追求的是“自我挑战”，我在这个世界上唯一的对手就是我自己。


    所以不内耗、不对抗，不被任何无关我的目标的人和事牵扯精力，斩断一切“烂人烂事的纠缠”。'
