- pgno: 40
  md: '# 我是谁，我的目标是什么，这个人/这段关系能满足我的需要吗？


    第二步：按照第一课的“筹码思维”，认真积累自己的筹码。


    大多数时候，你害怕失去，是因为你没有筹码，没有博弈能力，一旦失去就会招来损害或者无法继续得利。


    而如果你有了筹码，有了能够平衡利益和损害的能力，那么你就会不再恐惧失去。


    比如你是一个特别优秀的女孩，每天追你的帅哥能占满一条街，那么就算你分手了也没多可怕；


    因为你手上的筹码很多，你就是能在婚恋这场“价值匹配”的游戏中有更多选择权。


    升级自己的筹码，让你能够给别人施加得利，或者带来损害，是让你不畏惧失去最好的办法。


    永远有人对你有需求，那么你便掌握了“筛选”的权力。


    第三步：明确你的奖惩机制，不逃避冲突，表达你的原则框架。


    筛选掉“白嫖”和“霸凌”的吸血鬼，这些人本质上并不认可你的“价值”，他们对你“没有需求”，与他们为伍，你在毁灭自己的价值。


    只同尊重自己“价值”，对自己“有需求”的人互动。


    对尊重你规则的人，给予正向奖励，让大家知道，按照你的框架来行事会得到奖赏；


    对于不尊重你规则的人，直接拉黑屏蔽，不给予任何价值和利益。'
