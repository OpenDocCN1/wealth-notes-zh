    **高价值，是源于人性的一种追求，无论你是谁，都会渴望在哪怕一个瞬间，你是独一无二的。**


    并且当你获得一个高价值的事物或者伴侣时，人会本能地渴望抓住它，因为它让自己显得更“贵”和更“好”；


    而当低价值的事物或者追求者在你身边时，你会本能的嫌弃，觉得它“配不上”自己，它让自己变“low”了。


