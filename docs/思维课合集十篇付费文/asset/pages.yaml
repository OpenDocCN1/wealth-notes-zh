    而如果，你还能做到像我这样，每次经历，无论是恋爱、向上社交还是投资、创业，都写深度复盘，由表及里全盘分析，提炼理论框架，融会贯通，迁移运用，那你的成长就会更加迅速。


    再比如说，我前几天被朋友邀请体验了一节高阶瑜伽课，课程很难，我完全跟不上。


    在这种情况下，绝大多数人会感觉自卑、紧张，并知难而退。但我坚持完了整节课，有些动作做不到就做简单版，但绝不放弃，始终笑脸和自信以对。


    面对自己不擅长的事物，绝大多数人都会下意识失去自信，感到丢脸。


    但是有“生长思维”的人会说，没关系，进一步有进一步的欢喜，无论如何我坚持下来了，就是一重自我突破。


    而这，就是坚持“正向思考”，“正念”的力量。


    我希望大家觉察自己的念头，时时刻刻去转换那些负面的念头，让你能做到“境随心转”——


    让正向的念头帮你克服挑战困难，而不是让负向的念头加重你的畏难和逃避情绪。


    永远只将注意力集中在改变自己能改变的部分，并为自己的每一分超越而欢呼喝彩，而不是在改变不了的事情上怨天尤人，觉得自己十分渺小、无能为力。


