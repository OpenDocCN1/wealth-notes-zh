  md: '但如果你是弱者，那么世界上80%的人都是吸血鬼，而更可怕的是，你可能都没意识到，你自己也是吸血鬼。


    当你理解到人性都是潜在的“吸血鬼”之后，你便会知道，建立“筛选屏蔽思维”，立下自己原则和框架的重要性。


    这不仅仅会帮你筛选掉“吸血鬼”，也会最大程度让你与人性良性互动，避免原本的“正常人”被你捧成了不知好歹的“吸血鬼”。


    在电影《教父》中个，教父有一句经典台词：“我可以帮你，但我也会提一个你无法拒绝的要求”。


    ![](img/6cb073bd511b44c977146f123dcb2138_32_0.png)


    本质上，就是教父作为一个强者，建立了“筛选屏蔽思维”，立下自己的原则和框架，避免将“正常人”鼓励成“吸血鬼”，且筛选掉“白嫖吸血鬼”的策略。


    而建立“筛选屏蔽思维”，立下原则和框架，听起来非常简单，但总有人跟你说他做不到：'
