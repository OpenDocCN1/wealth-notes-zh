  md: '不要忘记人性的本质是“鹅城百姓”，谁赢他们帮谁，所以关键是，制造“优势在我”的预期。


    比如说你是个打篮球非常好的男孩，当你想要追求一个女孩，让女孩去篮球场看你英武的身姿，就会事半功倍。


