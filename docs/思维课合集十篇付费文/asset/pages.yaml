  md: '想要继续坐庄收割，就要坚持“长期利益”，而不是“竭泽而渔”，因此整体来看，普通人在有秩序时期的生活总是好过失序的时期。


    如果大家对“制度史”有所研究，就会发现，世界上根本没有完美的制度和秩序，所有的制度和秩序都必须与时俱进的修补和变动；


    这是因为人性的恶意，寻找现行版本的bug，不断向外索取，倾轧他人的底线的诉求永恒。


    因此，指责和幻想制度和秩序没有意义，人能够做的只有“自立自强”，让自己拥有更多筹码和实力，而非被动等待神仙或者天降猛男的救援。


    因为人性的本质就是趋利避害，不断压榨他人的底线，故而弱者指望有人能够完全保护自己的权益，本身就是反人性的。


    所有乞求的“被保护”，都必须上供自己的“财富”或者“精神”、“自由”来作为“保护费”。


