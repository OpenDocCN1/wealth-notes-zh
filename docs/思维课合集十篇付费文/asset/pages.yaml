- pgno: 122
  md: '而当你是一个“低价值者”的时候，你会发现世界的真相是“贫贱夫妻百事哀”，是相互怨怼，是一地鸡毛，是求而不得的困苦。


    以上，我们讲明白了为什么人性在不断追逐“高价值”，以及让自己成为“高价值者”的重要性。


    接下来，丙丙想谈下一个问题：


    如何做一个“价值”的识别者和判断者，避免自己被“夺舍”，被不需要的“伪价值”入侵了主场，从而丧失了自己的目标和主场。


    -4-


    刚才我们说过，人性的本质，是不断的追求价值，追求“稀缺性”，来感到我是独特的，我是存在的。


    而这个过程常常是“向外求”的。


    这也意味着，人们很容易在追逐财富、权力，奢侈品的过程中，逐渐迷失在物欲之中，沦为欲望的奴隶，从而失去了自己人生的主场和主线。


    也因此，我们需要注意的是，必须有自己的“价值评判体系”，来判断什么是对我来说“高价值”的。


    这也意味着，你需要有能力去解构所谓的、世俗意义上的“稀缺性”；


    并且有足够的能力，去建立自己精神世界中的“稀缺性”和“价值”，从而让自己能够通过“向内求”，来感受到自我的价值；


    更多资源，关注公众号【懒人找资源】'
