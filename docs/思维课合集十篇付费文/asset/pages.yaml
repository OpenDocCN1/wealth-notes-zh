  md: '举个丙丙自己的例子，我高中的时候，性格比较高冷，我爸带我去饭局上，我也不敬酒，活得像个公主。


    我爸那时候每天唉声叹气，觉得这孩子这么不识数，以后在社会上一定混不开。


    我研究生毕业回国以后，一直在折腾自己的副业，有一年在家过年，和我爸妈一块正吃着饭呢，突然接到了一个生意上的电话；


    我立刻上演什么叫“川剧变脸”，脸上堆起厚厚的微笑，一口一个“张姐过年好”，“李哥最近忙啥呢，嫂子好不好”……


    我爸妈当时就惊呆了，他们没想到，我竟然这么会来事。


    我说那当然，我的生意张姐和李哥能帮我放大杠杆，他们对我有价值，我肯定要认真维护好关系。


    我爸说，那怎么不见你去认真维系之前那个MCN公司的关系？


    我说因为那个MCN公司没有诚意，他们想的不是和我合作共赢，而是仗着自己名头响，流量大，就想霸凌和拿捏我，让我给他们当工具人。


    **这种从根源上来说“就是要压榨你的底线”的人脉有什么维护的必要？**


    何况我就算不理他们，他们也没有能量对我造成任何损害，**不与烂人烂事纠缠才是最优解。**


    **这就是我超强的“主场思维”。**


    **我可以高冷，也可以跪舔，但我知道我内心是有“主场”的。**


