- pgno: 92
  md: '为什么我们一直到第七课才讲“向上社交”？因为放在前面讲，大家对世界的底层逻辑理解不深，很难真正做到看清本质。


    你脑海中要对什么是“烟雾弹”，什么是真正的局势，有相当清醒的把握，才能不被名利场和场面话中的社交艺术、光环和形象所迷惑，透过现象看本质。


    举个简单的例子，体制内的领导夸你穿着时髦，大概率并非出自真心，而是委婉地暗示你的着装不得体，太高调。


    你如果听不出笑意盈盈的“明褒实贬”，大概率无法做到“有逼数”。


    那么自然，你就会被大佬“下调评级”。


    在星球里我们多次分享过，高级社交中很多时候是“逢场作戏”，用语言互放烟雾弹。


    这是一种迷惑对手、保护并隐藏自己真实意图的战略手段，与此同时，这种手段也能很好地鉴别对手的段位。


    如果别人夸你几句你就迅速上头，蹬鼻子上脸，那么你就会被识别为是无法克制自己的贪婪和欲望，没有自知之明和逼数的low货。


    多说一句，这一点在恋爱中也同样适用。


    要做到看清本质，摆正自己的位置，通过大佬的“棒杀”试探；


    最重要地是通过第一课的“筹码思维”，梳理彼此的筹码，判断大佬的需求，说话的真实动机和目的。


    更多资源，关注公众号【懒人找资源】'
