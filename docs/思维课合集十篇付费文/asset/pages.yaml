  md: '当你了解到了自己的热爱和渴望，明确了自己的方向和目标，你就可以结合前三课的学习，开始在实践中不断升级自己的筹码。


    在这个过种中，你的主场思维会不断强化，你会在每时每刻感受到自己的生命力和对自我的控制力，这些都会让你的自信更加强大。


    当你拥有了这种内生的“自信”之后，你反而不会在乎外显的自己该如何表现；


    任何手段和行为，都只是为了达成“你的目的”的一种方式方法而已，它不应该影响你的自我评价和自我认知。


    举个例子，我有个朋友，认为自己是独立坚强的女性，不该在任何情况下说出“示弱”的话，所以哪怕是面对很有好感的异性，也必须维持高冷的言行。


    但实际上，越是真的“独立坚强”的女性，越因为内在有强大的“主场自信”，能够灵活地用更容易实现自己“目的”的方式来与人相处和互动。


    “示弱”或者讲“甜言蜜语”如果能让互动氛围更好，让大家相处更加愉快，那为什么不去做呢？


    为什么很多大佬都会“逢场作戏”？


    因为越是高的阶层，越分得清“场面话”是一种社交互动中的调剂和润滑；


    它本就不该和你的自我认知所绑定，只是一种优雅的氛围制造和社交艺术。


    越是表面上会说“场面话”，骨子里却能够“冷静自持”，不为外物所迷和所惑；'
