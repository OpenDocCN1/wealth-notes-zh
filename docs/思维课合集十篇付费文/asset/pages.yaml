- pgno: 65
  md: '以上，我们分析了“无我思维”的重要性，接下来，我来讲几个具体的要点，帮助大家更好地“打开带宽”、“保持空杯”：


    第一步，时刻提醒自己不预设任何立场，假定自己的观念可能错误，并在此基础上，尽可能地探索丰富而多彩的现实世界。


    觉察到“我的自我”不等于“我的观点”或者“我的想法”。


    然后无抵触、怀揣着热烈的心情去探索和实践，这是“打开带宽”的要义。


    比如说，你只有在无抵触地研究过玄学后，才会意识到它确实不是封建迷信；


    于是你才会更进一步地反思自己头脑中的其他认知，并且更有意识地去避免“对外自我投射”，更客观地理解世界。


    再比如说，文章开头提到的外国友人，必须无抵触地了解中国，甚至来中国游玩和定居后，才可能会意识到中国确实和他以前的认知大有不同；


    在此基础之上，他才会进一步去反思自己头脑中的“观念”和“优越感”是如何互相捆绑的，并在未来的生活中保持觉察，更加无抵触地认知客观世界。


    第二步：尽量避免以“爱憎好恶”为学习和生活的评判标准。要练习在不喜欢的人、事、物上去学习和汲取养分，为我所用。


    在不喜欢的人身上，也能够学到东西，这是我们人生境界的体现。


    我之前有一个同事，很会“向上社交”搞关系，但人品不好，总给同事穿小鞋，大家都非常讨厌他。


    更多资源，关注公众号【懒人找资源】'
