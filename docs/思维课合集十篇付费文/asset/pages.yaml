  md: '时时刻刻牢记你是谁，你想要什么，你的目标是什么，围绕着你的目标展开行动，摒弃“等靠要”思想；


    明确“我的人生终究而言只能靠我自己，其他人都只是我生命中的过客”。


    # 【3】


    上面，我们说了“主场思维”的重要性，接下来，我们则重点展开，怎么做，能让我们更好地培养出“主场思维”。


    首先，你需要有意识地去寻找自己的“内心热爱”和“内心渴望”。


    你有哪些特长和天赋？你有哪些兴趣和爱好？


    你想做什么副业或者事业？


    你在做什么事的时候，动力满满，让你看起来闪闪发光，而你从中也感受到了巨大的乐趣和价值呢？


    你在做什么事的时候，感受到自己的生命力充盈，能量蓬勃浩瀚，万物生机勃勃？


    这里当然离不开你对自我的深度探索，你需要更多认知你自己，聚焦和专注于观察自己的起心动念，觉察自己的情绪和思维。


    复盘自己过去的经历，看看自己做什么能够比较轻松地获得结果，往往，这就是你的优势所在。


    当然，大家也可以通过“盖洛普测试”来做到这一点，盖洛普测试我在第一讲的时候给大家介绍过了，可以作为辅助自己探索禀赋的一项工具。


