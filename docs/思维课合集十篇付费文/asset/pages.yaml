- pgno: 126
  md: '好的情绪价值提供者，就如同一个好的游戏，或者一个名贵的包包，也自然能够交换到更多稀缺的资源和价值。


    第二，是注意做高自己的“身份”，以孔雀开展的方式去表达自己的“稀缺”。


    无论是把自己的方方面面都雕琢的很好，制造更多人对你的需求和渴望；


    还是说在一对多的平台、朋友圈上发表内容，建立影响力，核心都是要制造“趋之若鹜”、“行情很好”的感觉，为自己造势。


    在日常的言谈和表达中，也要有意或无意地“孔雀开屏”，展示自己良好的状态和实力，给予潜在合作伙伴以信心。


    一言以蔽之，你需要展现出一个“高价值”者的言行、谈吐和状态。


    第三，避免一味舔狗式付出，而是在“欲取先予”后，控制投入，掌控自己的供需格局。


    很多人对情感关系有误解，认为只要自己“付出”更多，就一定能收获对方的爱。


    但事实并非如此，根据价值定律，只有“高价值”才会被珍惜，因此一味舔狗式的付出，往往会 被定义为是丧失了“稀缺性”。


    因为本质上，只有更没价值的一方才需要更多付出来挽留住关系。


    所以我们会发现很多舔狗舔到最后一无所有。


    很多人以为，无条件顺从对方，言听计从是自己“爱”的体现，并渴望能够换回对方的爱。


    但真相并非如此，当你对对方言听计从时，人类基因里的价值定律开始作祟，他会判断你比 他低价值，你离不开他，所以你只能言听计从乃至失去自我。


