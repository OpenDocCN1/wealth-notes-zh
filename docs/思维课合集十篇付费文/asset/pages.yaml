- pgno: 114
  md: '而这样的人，靠劝是劝不住的，只能是看他自己栽了跟头之后，有没有反思和悟性，让自己吃一堑长一智，通过“交学费”的方式“升级自己的认知”，从而避免下一次被更大的收割。


    我以前也不能深刻的理解这个道理，直到前段时间跟一个创业暴富的朋友聊天；


    他说他刚暴富的时候，在澳门的赌场被收割过，后来就深刻地理解了“赌场是个局”，升级了很多认知，变得很难被收割，反而使他的财富能够更好地被保存在手上。


    从这个角度上来讲，还应该感谢当时在赌场收割他的庄家。


    从辩证的视角来看，因为有“骗子”的存在，所以金字塔顶的攀登之路，社会资源的掌控者必须更加聪明，更加理性，才能握住自己手中的稀缺资源。


    所以，不必太过执着于“主动助人”，保持边界感，不要去干预别人的人生课题，专注于自己，不要沉迷于廉价的自我道德感动。


    第三， 有意识地向上的，不要因为自尊心作祟而远离比你优秀、或者比你高阶层的人，放低姿态，提供情绪价值，谦卑地去虚心学习。


    很多人会去贬低比自己掌握稀缺资源更多的人，来让自己感觉爽一点。


    但事实上，如果你系统性地学习了思维课到现在，应该可以理解，没有人可以随随便便成功，哪怕是风口飞猪，他们也一定成功地做对了什么。


    向拿到了结果的人学习，向更高阶层的人学习，在跟大佬结交的过程，听其言、观其行；


    看看他们是如何为人处世、战略决策的，你才能更深刻地理解什么是真正的底层规则，并对“混沌思维”有更深刻的把握。


    更多资源，关注公众号【懒人找资源】'
