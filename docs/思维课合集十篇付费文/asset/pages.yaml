  md: '再拿丙丙自己举个例子，2月份时候的爆剧《狂飙》，丙丙和小伙伴们都刷的不亦乐乎。


    但小伙伴们刷完爆剧，最多和朋友、同事吐槽几句，或者在B站评论区里抒发感慨。


