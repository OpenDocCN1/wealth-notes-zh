- pgno: 41
  md: '这便是恩威并施、奖罚分明。奖惩机制的明确，会让人性在自发的“趋利避害”之下，按照你的框架行事。


    如此，你的筛选屏蔽机制，才能最大化建立。


    而实际上，这节课的内容，不仅适用于大家处理人际关系中，也适用于政治、商业和职场：


    如果你在创业，不妨思考一下自己的商业模式，是否被某些“吸血鬼”拿捏和卡了脖子？


    如果想摆脱这种拿捏，你应该积累哪些筹码，如何取得突破？


    如果你是一个博主，白嫖用户过多，你应该思考一下，你是否被你的用户定义成了“工具人”？


    白嫖和拿捏“工具人”，是用户的本能。


    只有用户认为你很强，跟着你会有肉吃，他们才会因为“慕强”改变自己的“白嫖”风格。


    看到这里你或许发现了，十节思维课里的很多道理，可以迁移运用到各个领域：


    人一生遇到的无数人和事，本质上是为了“见自己”。


    是为了让我们学会“拿捏”自己的人性，拿捏我们的贪嗔痴，恐惧、欲望和情绪。


    穿越“害怕失去”的幻想，避免陷入无节制讨好，找到自己的人生主线，活出最精彩的自己。


    你的内在有多强大，你就会有什么样的人生。


