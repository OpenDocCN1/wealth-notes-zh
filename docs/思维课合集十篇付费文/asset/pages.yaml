  md: '注意，这个和精神胜利法，不管发生了什么都洗脑自己是“最屌”的并不一样。


    因为精神胜利法是在为自己的“躺平”找借口；


    而正向思考，你是在调整自己用积极的态度面对挑战，从而能够更好的直面困难，战胜自己，让万事万物成为你的养分，为你所用，为你赋能。


    所以别人遇到渣男，失恋了，会觉得倒霉、沮丧和愤怒。


    而我遇到渣男或者失恋了，我会觉得这是老天在给我上一课，每个男人都是我生命中的一个老师，他们的到来是为了让我学到更多东西，从而精进和提升我自己。


    这就是“向上生长”的魅力，因为你相信你始终在上行，你的每一天都比昨天更美好，所以一切都不是终局，你的终局如何，始终取决于你的心态、意志和努力。


    故而你容错率，你能接受自己暂时的失败，你不会因为一次失败就全盘否定自己。


    因此，你能够穿越一城一地之得失，不与烂人烂事纠缠，而是火速抽离，专注自身，舞出最美的你自己。


    也因此，你能够平静地将生命中的每一段经历，都当做养分，而不是抱怨、指责，和甩锅，从而白白浪费了经历的价值。


    而如果你“不再生长”，那么必然陷入短期主义的斤斤计较之中，陷入琐屑的争端和零和博弈，因为只有赢了这一局，你才能感觉到“存在感”，因为你无法在生长中获得“自我认可”。'
