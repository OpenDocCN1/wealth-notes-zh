  md: '你要能看到大佬身上独特闪光的特质，并真诚谦逊、大方有礼地表达出来，让大佬觉得你和其他人不一样，你真的很想他；


    而你能看到这一层，很不容易，这彰显了你的格局与价值。


    比如说丙丙之前在一个局上，想链接一位退休了的体制内大佬前辈。


    于是丙丙非常真诚地夸大佬：


    虽然他早已功成名就，仍然非常愿意提携晚辈，这是极度不容易的，这是他为人有远见格局的体现，他对众生极度尊重，而他不求回报的施与，本身就是一种人生境界的体现；而越是不求回报的施与，反而会带来越多正反馈。我们身为后辈也要学习他身上海纳百川的格局和精神。


    我当时说完这番话，大佬眼睛都亮了，后来帮我链接了很多贵人。


    这种情绪价值就给的相当高级。


    首先，在丙丙这个年龄阶段，几乎没几个人能看明白大佬费劲提携晚辈的真正意图，其实是一种下注和投资，来延续自己的影响力。


    我看出来了，且懂得用更漂亮的话来进行包装，按摩大佬的“自尊心”和“自我价值感”。


    大佬们都是老江湖了，你说这么几句话，他马上就能判断出你的段位；


    你看出了他的意图，你这个孩子还很上道，懂得用漂亮话包装，你对人性有理解，你在恭维他。


    这就是比较高级的情绪价值提供，你让大佬受用，同时也做高了自己的身份。


    更多资源，关注公众号【懒人找资源】'
