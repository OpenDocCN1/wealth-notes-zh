- pgno: 23
  md: '这些消息被传开后，所有人看她都带着异样的目光。


    莉莉非常委屈，在她看来，打扮的漂漂亮亮是她的生活方式和生活态度，但不知道为什么，这反而给她带来了伤害和困扰，而不是价值的提升。


    **其实，这便是筹码和资源（平台）不匹配导致的，你需要做到的是将你的筹码放在合适于它的资源（平台）上，才能最大化打出它的价值，而如果不理解这一点，则不但打不出价值，反而可能是负收益。**


    比如说，莉莉的美貌和时髦都是相对稀缺的筹码，但这些筹码只有在她选择去当小红书或B站时尚博主时，才能为她打出最大的价值。


    选择了“体制内工作”，就意味着需要在日常工作中收敛起这部分筹码。


    这当然会有筹码和资源浪费的问题，你可以选择做副业，或者发展业余兴趣爱好，等副业做起来升级成主业都是完全可以的。


