- pgno: 58
  md: '大部分人之所以活了大半生，仍庸庸碌碌、深陷于自己的认知和死循环中，恰恰是在于无法做到“保持空杯”和“打开带宽”。


    因为“活在自己的世界里”、“不借扭曲世界也要迎合自己的认知”，最能让自己“自我感觉良好”。


    前两天我在《聊聊高考志愿填报》中讲过我自己的经历：


    大三那年我在瑞士交换，当地同学跟我聊起他们认知中的中国，我意识到他们脑海中的中国是被妖魔化了。


    尽管我也在各项嘉年华活动中教外国朋友包粽子、包饺子，试图潜移默化改变偏见，但效果远远说不上好。


    因为很大一部分外国友人眼中，中国就是贫穷、落后、不自由，需要被先进思想加以拯救的；


    而他们往往认为自己国家的文化显然更加“优越”，理所应当充当“拯救者”。


    他们对中国朋友往往非常友好，但这种友好不是建立在平等的尊重之上，而是建立在“你是需要被我拯救”的优越感之上。


    而当你试图摆事实，让他们搞明白中国不是他们想象中的样子时，**反而会冒犯他们内在的“优越感”和“自我认同”。**


    大部分人，会下意识将自己的观点和认知等同于“自己”；


    他们不能接受自己的观点被挑战，这会让让们觉得他们的“自我”受到了攻击。


    类似的例子，还有很多。


