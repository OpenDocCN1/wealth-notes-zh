- pgno: 143
  md: '不让对方轻易看到你的底牌，他便不能轻松解构你的稀缺性。


    说简单点，就是他拿捏不住你，吃不透你。


    可以扮猪吃虎，给对方放烟雾弹，是想办法麻痹对手，让对方误以为自己“吃定”，好大喜功，从而露出马脚，暴露出他的底牌，让你能轻松解构他的稀缺性。


    比如说知名的“郑伯克段于鄢”的故事：


    可以制造“捧杀”，来试探对方是不是有逼数、知进退，会不会给点阳光就灿烂，恃宠生娇，误以为自己“稀缺性”更高，然后着急来杀价。


    基本上所有高端局，大佬都会用语言和行动等烟雾弹，来试探下面的人是不是知进退、知冷暖，好不好拿捏，值不值得重点栽培。


    内核不稳，不够有自知之明的人很容易会露出马脚。


    所以丙丙一直在星球里让大家不要别人稍微夸几句，就上头，一定不要飘，要有逼数，能拿捏住自己，才能避免被捧杀。


    否则，你是个好拿捏的，那就别怪自己会被吃干抹净。毕竟这个世界上，狠人只会和狠人惺惺相惜。


    你自己维护不了自己的稀缺性，就不能期待别人会为你的利益负责。


    第二，维持好自己的阳光人设，事事占理，感召他人，维持自己的稀缺性。


    让所有人如沐春风，本身就是一重最好的迷惑。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 144
  md: '能够放松他人的警惕，别人对你没有防备，就很容易和盘托出一些事情，在你面前暴露底牌，让你将对方看的更加清楚。


    解构对方的稀缺性，并能够在一些利益冲突的点位，随时拿出雷霆手段，对对方予以反制。


    一个极端的反例，就是有些人很喜欢给别人讲自己有心计、有城府的故事，觉得自己厉害和牛逼的体现。


    但实际上，这种做法也会让他人对你产生防备，使得你后续的任何合作和博弈都受到限制。


    人性就是“趋利避害”，大家吹牛逼立人设一定要注意，把握政治正确和阳光面向，不该说的话不要说。


    人就是一种极度容易被语言迷惑的动物，一个人行事再恶毒，只要嘴上仁义，就能够迷惑大多数人；


