- pgno: 82
  md: '以股市为例，一旦一只股票涨起来，大家的情绪和欲望都会跟着起来，总觉得还会继续涨，再拿拿，问题不大，结果往往贻误了战机。


    我去年卖以岭卖在了50块左右的相对高点上，就是因为我大概计算了以岭的合理价格范围；


    一旦股价的涨幅超出了我的认知，就必须及时止盈，不在乎它后续会冲高到多少。


    不试图去赚超出自己认知的钱，才能不被自己的贪欲所控制。


    去年有很多小伙伴跟着我一起操作，结果没能在高点跟着我一起卖出，本质上还是被“心怀侥幸”的弱者心态控制了：


    一旦你开始寄希望于外界而不是相信自己，就意味着长期必然会崩盘。


    所以大家看到某些“股神”不必过分神话，大部分不过是风口飞猪，难以长胜。


    真正能长胜的，必然是强者思维下对自己的把控，而非对运气的寄托。


    再比如说，一些“失衡的感情关系”里，一方一开始条件非常好，另一方法通过跪舔、丧失自尊的方式建立了关系。


    条件好的一方仗着“优势自我”，非常嘚瑟，得寸进尺，不断压榨对方的底线，这也是一种不懂“及时止盈”的体现。


    这种做法往往让对方积攒了很多怨气，等找到报复的机会一击即中。


    如果懂得“及时止盈”，就会懂得尊重他人的底线，而不是无限控制和压榨他人的自尊，站在高位颐指气使，索取情绪价值。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 83
  md: '当然，真正懂得“及时止盈”的人，一开始就不会接受一段自己完全处在高位，另一方必须献祭“自尊”的关系。


    其实，在商业中，道理也是相通的。


    虽然在激烈的搏杀中，需要去压榨他人的底线，以掌控更多的稀缺资源。


    但倘若不能及时止盈，失了人和，时移世易之下，其实增加的是自己长期的成本。


    所以，懂得“及时止盈”，就是不要仗着“优势在我”，作威作福，把本该是朋友的变成了敌人，平白无故积累了许多怨气。


    而是要“师出有名”，凡事都占着“理”，“以德服人”，才能降低自己长期与他人交易和互动的成本。


    其实，及时止盈，是一种为人的“境界”，能做到“及时止盈”，就能克制自己在顺境中爆棚的“自恋”和“自我膨胀”。


    把别人当人，给予别人尊重，尊重他人的利益。


    否则，长期压榨他人的底线，损害他人的利益和能量；


    把他人当自己的工具，只懂索取、不懂回馈，不能与世界形成良性互动，最终必然走向邪路招来反噬。


    故而及时止盈，是一种强大的自控，是你为人处世极度有逼数，摆的正自己的位置，也对众生敬畏和尊重的体现。


