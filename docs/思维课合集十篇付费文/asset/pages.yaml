  md: '当然，为了壮大自己的力量，也需要通过“分利让利”团结一部分人死心塌地跟着自己干，比如说让小弟马仔们能吃香喝辣。


    让小弟兄们“报君黄金台上意，提携玉龙为君死”。


    而高启强，就是这个“以恶制恶”的搏杀过程中，自然诞生的秩序龙头。


    这本身说明他是被当时客观环境所选择的强者。


    高启强奠定了自己的势力范围，有了话语权，在一定范围内能够按照自己的“利益分配方案”来分配利益。


    而孟德海和高启强的合作，是当公权力把控力度不强，无法彻底收拾其他势力之前，一种比较好的“交易方案”：


    孟德海需要高启强的手段来控制和打压其他的黑恶势力，保证拆迁等工程的顺利完成，而高启强也需要公权力的某种“背书”和“安全感”。


    而从某种程度讲，这也是“识时务者为俊杰”。


    # ## 什么是识时务？


    **识时务就是看清你所处的位置，你所在场域的规则，你能分多大一块蛋糕，跟你的实力筹码和位置关系密切。**


    **孟德海想高效快速，没有风浪地搞拆迁，就不能不给很有实力的高启强一块蛋糕，否则高启强稍微添点乱，就够你喝一壶。**


    **社会的博弈，终究是靠实力说话，而不是大家幻想的那样，什么时候“公权力”都能降维打击一切，极度牛逼。**


