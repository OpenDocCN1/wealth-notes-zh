- pgno: 136
  md: '**美丽的词汇背后，掩藏着话语权的争夺。**


    它们往往被自私者使用，来操控脑子不好的猪猪男孩和女孩。


    而如果你是看不穿真相的猪猪男孩和女孩，就必然会被操控，践踏底线，沦为血包。


    **只有首先直面真实的世界，看清残酷的底层真相，重建你对人性和世界的认知；**


    **有能力去解构那些漂亮的话语和包装，保持清醒，戒除幻想，你才有机会再博弈中占据上风。**


    上面的内容，我是想请大家理解世界的残酷面向，理解我们和任何人的关系，本质上都是一重博弈；


    而放弃独立，放弃博弈，在梦幻中沉沦，意味着人为刀俎，我为鱼肉。


    接下来，我们来具体聊聊，**如何才能博弈中胜出，最大程度保全自身利益，避免被他人践踏底线、沦为血包。**


    -3-'
