- pgno: 142
  md: '再比如引入“竞争机制”——


    类似于古代的皇帝，在多个政治派系中搞平衡，做大自己的稀缺性，并解构了每个派系的稀缺性，使得每个派系都有求于皇帝，因此主动向皇帝增加自己的“供给”（让渡更多利益）。


    以上，我们讲清楚了在一个博弈之中，能够胜利的本质，是自己相对他人，掌握了更强的稀缺性。


    例如拼多多独占上下游的绝对稀缺地位，并不顾一切地解构中小商家在体系中的稀缺性，让自己拿到更多主动权。


    再比如苹果在产业链上占据绝对稀缺地位，把控所有的关键环节，只会把可替代性强的环节交给外包工厂去做，以此拿到绝对的主动权。


    小到婚恋与家庭，中到职场与商业，大到国际政治和中美博弈，道理都是相通的。


    明白了这一点，就会明白我们在和任何人博弈，最核心的“道”，都是不断做大自己对他人的稀缺性，并不断解构他人对自己的稀缺性。


    -5-


    接下来，我来提供几个技巧，帮助大在在一场博弈中，快速做大自己对他人的稀缺性，并解构他人对自己的稀缺性。


    第一，开局时冷静地判断双方的筹码和诉求，在对方手中的筹码和诉求不是非常明确的时候，不要让对方清晰地看到你的底牌，而是要采取“战略模糊”，给对方放烟雾弹。


    更多资源，关注公众号【懒人找资源】'
