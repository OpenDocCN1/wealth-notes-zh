- pgno: 124
  md: '首先，不要被“炙手可热”的假象所蒙蔽，不管一个人或物有多少人喜爱和追逐，它对你来说的“价值”都必须与你有关，能给你提供实打实的帮助，而不是带来消耗。


    否则，它对你来说就是没有价值的。


    比如说我之前举过的例子——


    有些行业大佬，看起来有很多光环和资源，但打的主意是“白嫖”你，这个时候他对你就是没有价值的，“让他从你的生命中离开”，是一个能够理性分辨价值的人的必修课。


    其次，警惕荷尔蒙一时上头带来的幻想和美化，克制自己冷静下来，在脑海里过一遍终局的几种情况，思考这个人或物对自己实现阶段性小目标，或者终局的大目标到底有没有价值。


    比如说，你可能因为某个异性的美貌或者风度翩翩陷入了热恋，但好景不长，你发现他身上有很多会在长期相处中给你带来危害的点，乃至带来诸多负能量；


    这个时候，就必须有意识地拉开距离，强制自己下头，重新评估这段关系的价值，舍弃一段“弊大于利”的关系。


    或者是重新定位这段关系，退回到朋友等浅层社交关系，把它控制在能够“利大于弊”、能给你带来正向价值的界限之中，确保自己的能量精纯，始终在自己的人生主线上狂奔。


    第三，大方承认客观世界中“高价值”事物的“价值”，不要走向“吃不到葡萄说葡萄酸”的极端。不带情绪、客观认知，甚至享受“物质”；但要理性控制“物欲”，有所戒断，稳住自己的主场。


    比如说丙丙也有喜欢的LV和香奈儿包包，不会走向另一个“奢侈品都是智商税”的极端。'
