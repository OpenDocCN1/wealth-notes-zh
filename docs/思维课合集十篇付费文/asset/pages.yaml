  md: '而当我自己出来创业折腾了几次，经历过了一系列风吹雨打，理解了自己的优势和局限 ——


    我为自己定下了新的阶段性目标，是分享认知、心力和格局给更多人，帮助更多人从蒙昧和枷锁中解脱出来，活得清醒，活得能量满满，并 在动荡时代抓住正酝酿中的新机遇做好
