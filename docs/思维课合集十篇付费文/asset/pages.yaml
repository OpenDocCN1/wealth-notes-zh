    所以让自己的“情绪爽”就成了唯一重要的事情，必须通过党同伐异，排除异己，来实现自我意志的无限征服。


    但实际上，这种发泄毫无价值，因为上一节课我们已经聊得很明白：


    世界是一张大型谈判桌，你在战场上得不到的，在谈判桌上也得不到。


    情绪发泄很爽，但她也断送了你所有的链接机会，你其实无时无刻不再进行资源的浪费。


    而那些有向上动能，有目标感，想要升级自己筹码的人，将会有意识地利用互联网资源；


    通过提供一定的价值来链接到大佬和高人，积极向大佬们请教，提升自己的认知，来实现自己筹码的升级。


