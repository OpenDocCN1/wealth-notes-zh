- pgno: 11
  md: '你甚至没有认知和觉察过你自己。


    # 说白了，这是一个“自我认知”的问题。


    古人说“自知者明”，但绝大多数现代人，都没有这个能力。在奶头乐的裹挟下，大家被当做巨婴豢养，在网上实现全能自恋感是很容易的。


    可在网上越爽，在现实中就越是迷航，你不知道自己哪里有优势，禀赋和才干是什么，也意识不到自己的缺点和劣势。


    根本上来说，这一方面是你经历、试错的太少了；另一方面，是你不懂得复盘和观照自己的内心，难以从经历中“明心见性”。


    这个问题，西方的人本主义占星学，是可以帮助大家解决的。


    许多心理咨询师都掌握人本主义占星学，因为利用大家的星盘，能够很好地帮大家去挖掘天赋地图和思维方式，让你能够更好地认知自己，觉察自己。


    不过，这种方式价格是比较昂贵的，优秀的心理咨询师，起价可能就要800元每小时甚至更高。


