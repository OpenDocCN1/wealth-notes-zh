- pgno: 34
  md: '当你对一个东西“有所需要”时，意味着它可以为你招来“得利”，或带来“损害”。为了“趋利避害”，你会尽量避免失去。


    当博主的觉得白嫖粉丝总归是粉丝，也许以后还有机会转化成商业价值，不能失去粉丝；


    追女神的觉得女神是自己能找到的最高价值的异性，一旦失去凭自己的条件就再也找不到更好的；


    受困于“吸血”原生家庭的，觉得自己需要有一个“健全”的家庭关系，才能显得自己是一个优秀的、符合世俗道德的人。


    这里面，有些“需要”是非常客观的——


    比如说你在体制内被领导磋磨，但不敢提离职。因为你很清楚自己没什么筹码，离开体制会更活不下去，两害相权取其轻，你的“害怕失去”是客观的。


    就是因为你没有筹码，没有议价力去“掀桌子”。


    这种情况解决思路也很清晰，就是丙丙在《拼多多和职场PUA，同频共振》里提到的：


    你要顺着第一节课学习的“筹码思维”，去猥琐发育、积累自己的筹码，增加自己的稀缺性和博弈能力，让自己有“不害怕失去”的资本。


    比如说你副业成为了年入千万的大博主，这个时候主业再怎么垃圾的领导和我人际关系都拿捏不了你，你可以随时和他们说再见。


    再比如你不断提升自己的颜值、身材，事业和阶层地位，这个时候你完全不在乎之前爱慕的“男神”或者“女神”；'
  merge: -1
  img_proc: true
- pgno: 35
  md: '甚至你过去爱慕的“男神”、“女神”可能会反扑你，你生命中会出现更多喜欢你的优质“异性”，而你是否接受还要看你自己的心情。


    世界是非常现实的，一切的一切，本质都是“筹码”的博弈，在战场上要不到的，在谈判桌上也要不到。


    避免“受制于人”、想要追求自己的“心之所向”唯一的正道就是提升自己的筹码，让自己有议价力，有选择权。


    其他所有告诉你“求神问卜”、“三招秒杀男神女神”、“三招让你嫁给有钱人”、“两节课看完，你就可以变得有钱”之类；


    激发人性“不劳而获”、“渴望用极少的付出索取到极大的回报”、“破格获取”的弱者思维和欲望的，最终无一例外都只会导向“被诈骗”和“被收割”。


    刚刚说的是“你的需要”是客观的情况下，你要去积累自己的筹码。


    而在另一种情况下，“你的需要”则是主观的。


    很多人没意识到，其实自己被洗脑了，被灌输了一些根本上违背自己利益的观念，这也是无法建立“筛选思维”的第二个原因：


    第二个原因：你无法识别什么是真正对自己有价值的。


    你没有建立属于自己的“价值评价体系”。而只是盲目地跟随者世俗的评价亦步亦趋去追求“看似珍贵”的东西。


    这件事情的本质，是你没有找到自己。


