- pgno: 137
  md: '博弈的核心，是理解任何一个场，无论是人际、婚恋还是职场、商业，哪怕表象是看起来再缤纷美丽，其实质都有"战场"的一面。


    而在战场中，自我保护是第一位的。


    所以，要理解人性的自私，接纳自己的自私，也允许和预设他人的自私。


    在战场中，要想尽力法拿到主动权，以便进行自我保护，并谋求更多利益。如果拿不到，创造条件也要让自己有主动权。


    当谈判的双方参与博弈时，各自都有自己的筹码，也都有自己的诉求。


    每个人都希望付出更低的成本来拿到更大的收益。因此会进行一系列的试探、服从性测试，乃至杀价。


    而想要在博弈中拿到主动权，需要引入我们上一节"价值思维"课中的核心概念：稀缺性。


    当我们在与对方博弈时，想要掌握主动权，始终处在优势地位，就要：


    +   1. 永远提升自己对他人的稀缺性。


    +   2. 永远解构他人对自己的稀缺性。


    这个方法论广泛适用于人际、婚恋，职场乃至商业之中。在这里，丙丙尝试用更多的案例来帮助大家理解。


    首先，是永远提升自己对外人（博弈对手方）的稀缺性。


    主要思路是：


