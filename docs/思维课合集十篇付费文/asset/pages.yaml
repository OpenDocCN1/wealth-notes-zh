- pgno: 39
  md: '那么你就**要勇敢地在现阶段屏蔽掉这段关系，坚持朝自己目标行动；**


    等日后积攒的筹码开始变现，你和父母的关系自然会根据筹码被重新定义，到时候，你自然会拥有更多主动权。


    所以，我们看到了，一切的核心是，你是谁？你的人生目标是什么？什么是你需要的？什么是你不需要的？


    **不要被世俗洗脑，一切不能为“你”的目标服务的人和物，无论看起来再怎么闪闪发光，它都没有价值。**


    **你应该拥有这种“自定义我的价值评价体系”的思维和自信。**


    然后，从世俗的洗脑和PUA中解脱出来。


    以上，丙丙分析了大多数人无法建立“屏蔽筛选思维”的两个根本原因。


    **接下来，我们来谈谈具体如何操作：**


    **第一步，重新梳理当前自己面对的各项关系，思考在哪些关系中，你实际上处于内耗的低位？**


    思考你究竟在“恐惧”什么？你因为什么而“害怕失去”？


    尝试去树立自己的人生目标，思考我是谁，自定义自己的价值体系，明确什么是“我需要的有价值的事物”。


    **并在日后每一次你感到自己的“框架”有所动摇的时刻，都复盘这件事——**'
  merge: -1
