  md: '**第三，与自己较劲，和自己对弈。把生命中的其他人都看做是过客，是点缀自己生命的颜色，不对他人有任何过高的期待和依赖。**


    当你对自己有要求，你不断和自己较劲，让自己不断变成自己心目中更好的样子。那么你自然感到自我充盈，自己对自己充满了认可。


    也因此，你不会在他人身上寻求对你的认可，不必通过控制和打压别人来彰显自己的存在。


    因为你不不在他人身上投射自我的存在，因此你对他人无所求，因为无所求，你不会过度付出、不会讨好来期待获得他人的认可和回报。


    你不会与烂人烂事纠缠，不被道德绑架，不需要世俗认可；白嫖和霸凌的人都会被你屏蔽和压制，所以你终能保持自己能量的充盈。


    于是你能对全世界温柔以待，因为你对人性足够理解，没有期待和幻想；


    所以你能尊重理解任何人，哪怕是极端自私利己的人，而你有足够的手腕，让他们无法在你这得逞，甚至被你驯服。


    你能用一种豁达、宽容的态度去看待生命中的其他人，和其他色彩。


    你发自内心尊重每一个独立的生命个体，而不是用自己的标准要求所有人，施加压力，打压别人的生命能量，来彰显自己的存在感。


    相反，你充盈的能量溢出，反而能给予他人力量、成就他人，让每个人都活出真实的自己。并自然而然地赢得心人的凝聚和靠拢。


