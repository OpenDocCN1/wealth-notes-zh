- pgno: 155
  md: '因为“吃精神上的苦”这件事无法作弊，否则焦虑和不安永远如影随形地住在你的潜意识中，你仍然会感到自己底层自我的虚弱和萎靡。


    必须直面真实、直面真相、直面自己，并在做难而正确的过程中朝目标靠拢，感受自我的存在，认可自己。


    在这里，跟各位读者们分享几个“生长思维”，帮助大家直面挑战，不怯懦、不逃避：


