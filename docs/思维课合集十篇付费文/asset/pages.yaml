- pgno: 139
  md: '这一点，我在“主场思维”和“价值思维”都反复跟大家强调过，一定要坐稳自己“精神上的庄”，不能轻易打开“供给”，任人予取予夺。


    表现在你始终专注自身发展和目标，有自己的事情做，不过多把时间精力放在讨好他人身上（特别是对方不能对你实现目标有什么帮助的情况下）


    # 你的每次供给，都应该是 一种“欲取先予”的“有效供给”——


    即虽然你提供了供给，但同时更多增加了对方对你的需求，这样才能维持稀缺性和“不掉价”。


    比如说拼多多的百亿补贴，看似是提供“供给”，但实际上在增加消费者对拼多多的“需求”和改善对拼多多的品牌形象，从而让拼多多更稀缺。


    这种供给就是有效供给，永远不要“肉包子打狗”式的“做慈善”，拉低自己的身价。


    比如有些女生一谈恋爱，对方没付出什么，也没表达出应有的诚意，就因为“爱情”上赶着给男生做老妈子；


    除非这是一种“欲取先予”的舔狗战术，能够在培养用户粘性后立刻停止“舔狗行为”，主动收回供给，否则就是一种极度掉价的行为。


    除了提升自己对他人的稀缺性之外，同时要做到，永远降低他人对自己的稀缺性。


    同样分为两个维度：一个是减少自己对他人的需求度。


    练习对任何事物的“戒断”能力：


