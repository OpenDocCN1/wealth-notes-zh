- pgno: 113
  md: '世界的混沌，来自于人性的混沌。


    工具本身是中性的，人们的金钱观与权力观，决定了他们将会怎样看到工具，怎样利用工具，以及能否掌握工具。


    而想要在现实中去落地你的理想和目标，首先要做的，就是摒弃下意识的道德评判，发挥“混沌思维”，客观看待世界。


    在这里，芮芮提三个行之有效的做法：


    第一， 任何时刻，不带道德判断和情绪的，去理解自己所处环境的游戏规则，看清自己的位置，明确自己的目标，并付出果断的行动。


    举个例子，有些行业比如说娱乐圈，这种行业的游戏规则就不是走“健康向上的努力”就能成功的，选择了这个赛道，如果没有原生家庭的助力，筹码不够，那就必须低姿态，找大佬抱大腿才能度过初始阶段。


    那么，如果你明确了你的目标是要在这个行业崭露头角，那么就必须放下道德感，不在乎他人的评价，拿出嗜血的一面，冷静地向上攀登。


    第二，保持边界感，放下助人情节，尊重他人命运，不要好为人师，不要纠缠在他人的因果中。


    不必过于同情被“收割”或者被“诈骗”的人，因为掌握了混沌思维，你就会明白，一个人被“收割”或者“诈骗”，一定是他自己的人性出了问题，自己被自己的贪婪恐惧拿捏住了。'
