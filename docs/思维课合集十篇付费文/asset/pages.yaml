- pgno: 123
  md: '让自己能坐稳自己的主场，而不沦为外物的奴隶。


    这样说起来有些抽象，丙丙来举几个例子：


    比如说，在金融行业工作，经常出差都是五星级酒店，但是住一段时间五星级酒店，我就会有意识地让自己去住一些条件较差的酒店，乃至青年旅社。


    这里面的核心原因是，我要培养自己对物质享受的“戒断”，避免“由奢入俭难”，控制自己在什么物质条件下，都能保持情绪的稳定，心态的独立。


    这是对我自己人格的要求，某种程度上，这是一种精神上的“稀缺性”，我在和自己较劲、自我控制的过程中感受到我的价值和存在；


    而不是因为我住高档酒店，就高人一等等来感受自己的价值和存在。


    再比如说，丙丙从来不会排队去吃网红餐厅或者喝网红奶茶，除非是有重要的客户或者朋友点名要去吃某一家。


    因为在我心中，我的时间和精力是最有价值的，排队去吃网红餐厅或者奶茶是消耗我价值的行为，我不会因为追赶所谓的潮流，来妥协我的时间和精力。


    我有我自己对价值的评判标准，不会因为人群对某件事物的趋之若鹜，就陷入羊群效应，加入一场无脑的对所谓“高价值”的追逐和狂欢之中。


    作为一个投资人，我无时无刻不再判断“价值”，已经成为了某种本能。


    在这里，分享几个判断“价值”的方式给各位读者朋友们：


