- pgno: 112
  md: '在缺乏“混沌思维”，不能够理解人性底层的普通人心目中，往往把这句话理解为是为了控制他人“不择手段”，极度邪恶功利。


    但如果你有“混沌思维”，足够认知底层人性，就会知道每一个社会资源的掌控者，必须能够同时操控人性的“善”与“恶”，于是就必须同时有“阳光”和“野兽”的面向。


    刚才，我们讲的是秩序。


    而财富也具备相似的属性。


    许多刚出大学的小朋友，往往非常理想主义，很容易粪土当年万万户。


    对政治或者金钱抱有很负面的看法。但实际上，无论是权力亦或是财富，他们的本质都是中性的“工具”。


    这些“工具”存在的问题，是因为人性固有的问题，而不是工具的问题。


    要看到“秩序”存在的必要性，同样要看到价值的创造和传递，同样需要通过金钱的流转来进行。


    很多人认为，“搞钱”就是要利用人性的贪婪和恐惧等欲望来“割韭菜”。


    而实际上，贪婪和恐惧是人性固有的属性，只要贪婪和恐惧存在，就一定会有人去“割韭菜”，有人“被割”，这本身是客观的，而不是金钱的问题。


    相反，人性也有追求自由解放，不断向上攀登的欲望，所以各种学习类的内容也同样具有价值，能够完成财富的积累。


    因此，财富和权力就像一面镜子，如实的观照着人性，随着不同人的**人性**，摆弄出不同的样子。'
