  md: '但倘若你每天都以“升级自己的筹码”为目标的“盘活资源”，那么过不了两三年，你会发现你能调动的资源和筹码，已经远远甩开了同龄人。


    而大部分人则恰恰相反，没有目标，也没有升级自己筹码的思维，每天庸庸碌碌，将注意力集中在不值一提、鸡毛蒜皮的琐事，或者牵动自己情绪爽感的小事上。


