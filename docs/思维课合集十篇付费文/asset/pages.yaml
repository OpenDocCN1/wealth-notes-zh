  md: '# 把握“无我思维”，一秒洞察事物本质


    ![](img/6cb073bd511b44c977146f123dcb2138_57_0.png)


    大家好，我是丙丙，今天我们来讲十节思维课第五课，把握无我思维，一秒洞察事物本质。


    - 1 -


    有很多读者都私信询问过我，应该读什么书，学习什么课程，才能像我一样，洞察和把握住底层规律？


    实际上，一些书籍和课程或许有所帮助，但在理解世界和人性这件事上，绝不是“按部就班”学习就能填鸭式地进步，而是需要“保持空杯”、“打开带宽”。


    更多资源，关注公众号【懒人找资源】'
