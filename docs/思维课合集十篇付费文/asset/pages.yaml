- pgno: 42
  md: '最后，丙丙想说，掌握筛选屏蔽思维，不意味着你要深陷于对人性的失望和抱怨之中，而是豁达而平静、“不受力”地穿越他们。


    因为每一重失望和抱怨，代表了你仍然在倾注自己宝贵的“注意力”资源。


    真正重要的是你的目标，你的渴望，你的需要，“他们怎么样”，与你无关。


    自定义属于自己的价值评价标准，他人被筛选掉，是因为他人不同频，不是你配得。


    你不需要按照他人的标准亦步亦趋，只需要按照自己内心真正的渴望去攀登巅峰。


    你知道自己的心之所向，你不被他人的规则限制和拿捏，你建立你自己的规则和框架，筛选能与你共同前行的同频者。


    一边走一边交新的朋友，也许路上又会聚聚散散，但聚散离合，本就是人世间美丽的风景本身。


    愿你终能找到心之所爱，无畏生长。'
