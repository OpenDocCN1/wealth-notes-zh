- pgno: 68
  md: '![](img/6cb073bd511b44c977146f123dcb2138_68_0.png)


    对于看客来说，从“爱憎好恶”的角度做价值判断，本身是彰显“自我认同”的一种享乐活动，这是很自然的。


    但丙丙作为一个IP创业者，要学习曲曲为什么能成功，就必须客观归因，客观复盘。


    我研究后发现，曲曲的成功绝非偶然，她选择了一个有“刚性痛点”的赛道：


    如果我们脱离道德判断，将富豪的情妇看做一份工作，这个行业之所以能存在，锚定的是富豪的生理和情感需求。


    曲曲做的事其实是“职场升级培训”，传授给富豪情妇提供“情绪价值”的技巧和能力，让他们能在职场中“升级加薪”。


    那么曲曲团队也自然能在这个“高薪行业”中分得一杯羹，甚至因为“高薪”，能够锚定更高的客单价。


    对于曲曲商业模式的分析，丙丙另外撰写了文章，在思维课里就不多赘述。


    举这个例子，只是想告诉各位读者朋友，当你要在现实中做事，参与真实竞争时，环境会逼迫你从“理性”出发、从“客观”出发，把握规律，并化为己用。


