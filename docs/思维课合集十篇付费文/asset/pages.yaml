- pgno: 33
  md: '比如说，身在自媒体这个行业，丙丙有很多博主朋友总是被白嫖，我建议他勇敢筛选，结果他说一筛选哗哗掉粉，阅读量就更低了。


    再比如，丙丙的某朋友道“女神”当了几年“舔狗”，我说你要勇敢筛选，表达自己的框架和要求；


    结果他说不敢筛选，要是表达了自己的框架和要求，女神肯定立马就走了，再也不理自己了。


    还有个朋友，总跟丙丙抱怨原生家庭“打压”自己，我说你要向他们表达你的框架和原则，如果他们不尊重你，那你就要勇敢“屏蔽”，同他们减少接触乃至断联。


    结果朋友说她做不到，因为家人是最珍贵的，一定要照顾他们的情绪和利益，否则则是不孝。


    上面这些案例，大家不妨思考一下：


    到底是什么，让你明知道该“筛选屏蔽”，但事实上却很难做到，阻碍重重？


    在这里，丙丙总结了最重要的两个原因：


    第一个原因，你害怕失去，你被自己的恐惧和贪婪，欲望和情绪压制住了。


    能够建立“筛选屏蔽”思维的底层逻辑是你不畏惧失去，不怕因为勇敢表达自己的框架和原则后，你会失去对方。


    而为什么你会“畏惧失去”？因为你内心对它“有所需要”。


