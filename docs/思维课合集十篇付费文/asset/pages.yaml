    # 【2】


    回到文章开始时，我们提出的问题，为什么有的舔狗到最后一无所有，有的舔狗到最后应有尽有？


    “一无所有”的舔狗，都忘记了甚至根本没有意识到：


    你自己才是你人生“唯一的主角”，你应该优先考虑自己的利益，自己的目标，自己的感受。


