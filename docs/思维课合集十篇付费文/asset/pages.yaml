- pgno: 133
  md: "互相博弈，彼此竞争合作，这是再正常不过的关系。无论是在家庭，在人际、职场还是婚恋之中。\n\n比如说，很多人都被一种错误的观念洗脑，那就是父母是无条件为你好的。\n\
    \n实际上，这只是一种政治正确的话术，而非真相本身。\n\n如果你足够清醒冷静地观察的话，就会发现，绝大多数人父母所谓的“为你好”，其实是为他们自己利益服务，而搞出的话术。\n\
    \n比如说当你想创业时，你的父母大概率不支持，而是让你去考公务员，美其名曰为你好。\n\n但实际上，真正的原因是，父母认为创业会让他们晚年的生活很波动，很可能不能靠你养老，说不定还要把养老钱贴给你;\
    \ \n\n而你考公务员，对他们来说是很确定、还要面子，靠你养老很确定。\n\n**连父母和子女都存在利益冲突，更遑论其他人，我们每时每刻都生活在因利益冲突而带来的种种博弈之中。**\n\
    \n在利益冲突的核心点位上，到底该听谁的?\n\n是盲目听信他人“为你好”的烟雾弹，为了博得一个“听话、懂事”的美名，放弃自己的利益，走向被动和被拿捏？\n\
    \n还是坚持自己的想法，勇敢穿越他人的指点、口诛笔伐，也坚持做大自己的筹码，提升力量对比，反向拿捏他人？"
