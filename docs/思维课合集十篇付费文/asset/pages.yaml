- pgno: 38
  md: '于是，这件事情又变成了，你需要联动第二课——资源利用思维中讲的内容去思考：


    # 究竟什么是你人生的主线，什么是你内在的渴望？


    只有当你非常清楚自己的目标是什么，你才知道什么是自己真正的需求，你才知道什么东西真正对自己有“价值”的；


    然后把那些看起来非常世俗意义“高价值”、闪闪发光，但对你实现自己的目标一文不值、甚至有所阻碍的人和事物筛选掉。


    # 让我们珍贵的注意力资源，始终锚定在“对自己有价值”的事物上。


    把那些带给你内耗的人和事物都屏蔽和筛选掉，静心滋养自己的生命能量，这也是将第二课“资源利用思维”做的非常好的体现。


    比如说，“男神”的确闪闪发光，但你的目标是成为“更好的自己”；


    而他带给你的只有内耗、无聊和控制，那么他对你来说就是没有“价值”的，你应该勇敢地筛选掉他。


    再比如说，你机缘巧合结识了大佬，但大佬却满心拿捏和控制你，让你给他献祭，无法积累自己的筹码。


    那么，这个大佬就算再成功名就，对你来说也是没有“价值”的。


    要勇敢地戳破“指望大佬良心发现”的幻想，勇敢地筛选掉他，坚定地走自己的路，积累属于自己的筹码。


    再比如，你的原生家庭，父母尽管偶尔也会关心你，但更多是打压、操控，带给你消耗和阻碍。'
