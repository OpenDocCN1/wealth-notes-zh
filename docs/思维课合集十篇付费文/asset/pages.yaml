- pgno: 67
  md: '比如说，普通人往往会认为有钱人私生活混乱，是道德败坏的体现。


    而实际上，不从价值判断的角度出发，而是先思考客观条件，会发现有钱人之所以会私生活混乱，是因为他们掌握了稀缺资源，就是有源源不断的优质异性往他们身上扑。


    而普通人私生活不混乱，往往不是因为道德水准高尚，而是因为客观上不掌握稀缺资源，无法获得优质异性的青睐。


    优先考虑“客观条件”，能帮助我们客观认知人性；


    而不是一上来就搞些“爱憎好恶”的价值判断，在脑海中无限“美化自己”，贬低他人，获得优越感，让自己好受点。


    这种思维，能有效帮助我们“对自己诚实”，而不是活在对自己的滤镜之中，既不知人，也不自知。


    从客观出发、接纳人性，不要将自我认同锚定在幻想的地基上，你才能客观归因，并化为己用。


    第四步：发挥目标导向和主场思维，当你有自己的事要做的时候，你就算排除万难也必须把握客观规律，否则你自然会在残酷的现实竞争中落败。


    当我们没有正事要做的时候，第一要务很容易就变成了捍卫情绪和自我认同。


    但当我们有正事要做时，情况就会大不相同。


    比如说，情感届的顶流IP——曲曲大女人，一直被大家认为是“捞女”IP，割韭菜的。'
