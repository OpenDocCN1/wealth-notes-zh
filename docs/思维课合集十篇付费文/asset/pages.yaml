- pgno: 135
  md: '同样的道理，当你听父母的话，做一个“孝顺”的孩子，离开一线城市回到三四线城市留在父母身边，做一份“稳定”的工作；


    没有强大的物质实力傍身，你将逐渐成为给父母养老的“工具人”，人生就是围着伴侣，小孩和父母转，不断感受那些“轻视”和“冷眼”。


    而当你选择哪怕他人不理解，也要坚持做自己的事业，积累自己的物质筹码，尽管短期因为你“冒犯”了他人的利益，会被“口诛笔伐”的唾骂；


    但当你做到一定成就，你掌握的物质筹码能给他人带来更多“利益”或施加更多“损害”时：


    你将会惊讶地发现，之前的“唾骂”变成了“赞美”；


    你和家人的关系会自然和解，更多人愿意成为你的“工具人”，鞍前马后为你效劳，因为每个人都想从你这里获得更多利益。


    这也是为什么，许多原生家庭极差，从底层杀出重围并做到社会金字塔尖的大佬，都是“六亲不认”，世俗道德感极低，有极度冷酷的一面。


    因为如果不对自己的目标极度明确，不对自己的主场足够坚定，不对花团锦簇的梦幻宣言极度戒断；


    便会在任何一个时刻，被形形色色的人拿“道德绑架”，沦为他人的血包，丢失自己的人生主线。


    可以说，强者“向上攀登”的一生，就是“反PUA”，挣脱绑架和束缚，拒绝成为任何人“血包”的一生。


    在这里，丙丙希望读者朋友们能看清楚，依托于价值和利益的博弈，才是世界的本质。


    更多资源，关注公众号【懒人找资源】'
