  md: '或者说，要认知世界的底层真相，仍有一个看山是山，看山不是山，到看山还是山的扬弃过程。


    而绝大多数人的所谓“三观”，其实是被“灌输”、“洗脑”乃至于“从众”后无意识的产物，而未经过个体实践经历的修正，以及体系化的深刻反思。


    所以大部分人，在精神上都是实质被操控的。


    人性本能，是无法接受世界和自己认知不一样，除非遇到重大的挫折和挑战，极度颠覆过去的三观和认知；


    否则，绝大多数人都会快乐的躺在自己的认知舒适区中，享受这种自洽的安全感。


    而商业社会的特点，就是通过不断满足人的“需求”，交换人们手中的物质财富。


    因此，为了按摩绝大部分人的认知，会出现各种内容，并倾向于极化，把情绪价值拉满，满足人们内心深处对自我按摩爽感的需求。


    从根本上来讲，是因为大部分人的生存状态是“被豢养”，只需要完成某个环节，他们也不需要知道世界的真相，只要“爽”就完事了。


    但是越是有志于向上攀登，成为真正意义上的“社会资源掌控者”，参与世界的底层竞争；


    那么就越是不能被主流文化和道德观中，非黑即白的认知和情绪所裹挟，沉迷在廉价的爽感之中。


    需要对人性有清醒的认知，需要你有霹雳的手段和实力，才是你能取得成就的关键。


    对人性的清醒认知，就是人性并非“善良”，而是“有善有恶”的混沌体，你需要引人向善；但同样需要有手段和武力，来制“恶”。


