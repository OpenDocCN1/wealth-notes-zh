  md: '而这个丙丙在《说掠夺才是赚钱王道的，还没入门》里系统性分析过，实际上"掠夺"并不是对于普通人来说最好的思路；


    因为"掠夺"也需要建立在实力的基础上，且需要通过做局、拿捏对方的把柄等等，来置换他人的下注。


    但这种方式是一种"失人和"的方式，尽管可以成功一时，但因为失了人心，人都是趋利避害的，必然会被他人处处提防，乃至联合算计，最后难免在阴沟中翻船。


    陈友谅就是一个典型的例子。


    而当我们认知到，因为人性存在固有的"恶"，本能地想要去压榨他人的底线，来为自己谋求更多的话语权，掌控更多稀缺资源。


    所以就必须衍生出种种秩序和制度，来压制和平衡这种恶意，确保社会仍然能够正向运转。


    尽管，这些衍生出的秩序和制度，因为人性的原因，必然是不完美的，它往往会带来另外的恶意。


    比如说千百年来官场的"寻租"行为等等。


    张养浩的诗句"兴百姓苦，亡百姓苦"，其实就讲了这个道理。


    失序的年代往往对普通人更难，因为社会是负向运转的，各种流寇占山为王，追逐短期利益，疯狂向下收割，流民更加生不如死。


    而当有序时，尽管掌握着秩序的既得利益群体也会压迫普通人，从老百姓身上提取剩余，但他们同时也和百姓有一种最基础的"共生关系"。


