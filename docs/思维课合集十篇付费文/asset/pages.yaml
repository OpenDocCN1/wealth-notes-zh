  md: '# 掌握博弈思维，拿捏人生主动权


    大家好，我是丙丙，今天我们讲**十节思维课的第十课——掌握博弈思维，拿捏人生主动权**。


    - 1 -


    有道无术，术尚可求。有术无道，止于术。


    前面的九节课，丙丙更多是给大家搭建“道”的框架，目的是防止单纯的聊“术”，聊手段和技巧。失去了“道”的发心，**微信：2786488513**，反而让大家迷失在下乘之中。


    但我们不能忽视，去掉文明包装的人类社会，底层逻辑遵从的仍然是“丛林法则”。


    人性中固有动物性、嗜血、野兽的一面。


    **而只要是野兽，就会想要撕咬猎物，吞噬他人来满足自身的利益。**


    **并借助文明社会的种种旗帜、种种意识形态、美丽的话术来进行包装，以便能更低成本榨取他人的价值，来为自己的利益服务。**


    **首先明确，我们跟所有人的关系，都在无止尽的博弈之中。**


    不要理会所谓的“我养你”、“我爱你”，“我们是一家人”，“公司就是员工的家”的“烟雾弹”。


    每个人在事实层面，都是独立的个体，都有各自的利益诉求。


