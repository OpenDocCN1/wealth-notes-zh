- pgno: 9
  md: '你要有目的地展开社交活动，在和他人的相处中，考虑他们有什么筹码？他们缺什么筹码？我有什么筹码？我缺什么筹码？


    我该如何用我有的筹码，来打动他们的筹码？从而让我手中的筹码实现升级？


    此外，我该如何更好地把手上的筹码都结合起来，并在合适的平台、合适的场域施展他们，打出更大的价值？


    **这里再拿自己举个例子。**


    我的初始筹码有哪些呢？我从初中就开始写小说，高中就是晋江和起点的签约作者，这就是我的筹码之一——妙笔生花。


    此外，我还能说会道，拿过好几次最佳辩手。


    然后，我做研究，做投资，创业，搞事情的经历丰富，善于捕捉趋势、框架，认知能力远超同龄人，甚至能跨阶层链接大佬。


    最后，我还精通玄学，大学时就做心理咨询室的助管，在心理学上很有造诣，帮助解决过三位数学弟学妹的心理问题，洞察人的能力极强。


    那么以上这些筹码，我该怎么结合呢？


    首先是开自己的公众号，一是继续磨炼升级自己的“写作筹码”；二是积累个人IP，积累更多粉丝和知名度，积累“名气筹码”和“流量筹码”；第三是体系化梳理自己的认知，升级自己的“认知筹码”；第四是通过公众号内容和流量、合作机会等链接到更高阶大佬，降低解释成本，积累“人脉筹码”。


    然后是继续搞自己的投资工作，一是继续升级自己的“认知筹码”，二是将积累的“人脉筹码”做变现，参与到更多优质项目中，变现更多利润，而在这个过程中，又能不断积累更多'
  merge: -1
  img_proc: true
- pgno: 10
  md: '“人脉筹码”，三是将公众号积累的“名气筹码”做变现，让我有机会接触到更多优质的项目，甚至分到股权。四是变现和升级“洞察人心”的“识人筹码”，在做投资的“识人”和判断上有巨大帮助和精进。


    而我做的这一切，都会让我受众的筹码越来越多，而这一切行为，都是**我经过战略思考后的主动选择**。


    **你看，掌握了“筹码思维”，你便对自己的人生拥有了战略眼光。**


    **你会知道什么事是重要的，什么事是不重要的。**


    **所有能帮助你积累筹码的事，是一等一重要的事；**


    **所有跟积累筹码无关的事，都是不必放在心上的事；**


    包括但不限于“失恋“、和同事有摩擦”、再比如说沉浸在宏大叙事里，每天讲什么“阶层固化”让人绝望、“男女对立”让人沮丧等等。


    掌握了“筹码思维”，你将不会再羡慕同学群、小红书里别人晒豪车、晒豪宅炫富，亦或是因为博主的高颜值而感到焦虑。


    **因为你会知道唯一重要的事，是按照你的初始禀赋去积累你的筹码。**


    于是，**你开始按照目标努力行动和攀爬，等待有价值的事物在某一日自然而然给到你回馈**。


    不过，根据芮芮之前接待付费咨询的观察来看，**我发现绝大多数小伙伴，对自己到底有什么初始“筹码”都没有概念**。


    完全不知道自己有什么相对的优势、或者说劣势。


