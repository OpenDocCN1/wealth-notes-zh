    对自己的框架和底线清晰，对霸凌和白领坚定说不。


    一边打造自己的“稀缺性”，制定自己的规则和框架，筛选信奉“互利共赢”的同频者，并带领大家一起进步。


    **第五点，对自己诚实，主动选择，愿赌服输，买单离场。**


    **一个拥有“主场思维”的人，不会活在抱怨和责怪中，而是坚持“主观能动性”，相信我在任何时刻都能够自己做选择，并为此不懈努力，积攒筹码。**


