  md: '但别着急，请听我说，人性存在固有缺陷：


    80%的人，骨子里都是“欺软怕硬”。


    无论外表将自己包装的怎么高大上，但实际信奉的就是“能占便宜就占便宜”、“能白嫖就白嫖”、“能坑就坑”，反正“不坑白不坑”。


    而这样的人一旦执掌了“权力”，就会把“白嫖”升级为“霸凌”。


    人与人之间的每一次人际互动，本质上都是一场暗暗的“交锋”和“试探”。


    双方都在试探对方的底线如何、能量场如何，是不是比自己弱小，能不能被自己轻松拿捏。


    尽管这种试探常常发生在潜意识中，大部分人没有能力意识到自己的“虚伪”和“势利”；


    还非常喜欢把自己包装成盛世白莲花，站在道德制高点上，来索取更多价值。


    而如果你被试探为强者，有自己坚定的节奏和框架，那么对方就会知道他拿捏不住你，要想同你这里拿到“价值”，就必须“尊重”你，按照你的规矩办事。


    但如果你没有自己的框架和节奏，轻易就被对方带着跑路，钻进他人的框架中“亦步亦趋”；


    那么你就会顺理成章被定义为“工具人”和“软柿子”，活该被吸血和献祭。


    因此，做一个强者，有自己的框架和原则，非常重要。


    如果你是强者，那么你会发现世界上99%的人都是好人。


