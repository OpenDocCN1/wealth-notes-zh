- pgno: 111
  md: '因为他们想要的实际上是那个“追求公平正义”的自己的美好形象，而真的要实现这个理想，却缺乏踏踏实实展开行动的能力和认知、以及正确的行动思路。


    不能理解在现实中想做出每一分成就，都需要关注“力量对比”，需要有实力说话；


    需要尊重客观，理解人性，能够驾驭人性的恶意，来扭转局势，提升自己的胜率。


    而理解了这一点，你就会理解“混沌思维”。


    目标和手段，不一定是对称的。


    按照真善美的手段行动，往往无法实现目标；而唯有按照牌桌之下的底层法则，提升力量对比，才能实现你想要的目标。


    当然，这并不意味着“真善美”的价值观本身是错误的。


    因为如果每个人都不相信“真善美”，那么整体秩序只会更混乱无序，人人互相收割，社会更加负向运转。


    但如果你只有“真善美”的价值观，那么终身就只能在中下层徘徊；


    必须得有“雷霆手段”，去过滤和压制豺狼虎豹们的“恶意”和“劫夺”，才有机会上升为社会资源的“掌控者”。


    这也是《君主论》为什么说：


    > 理想的君主，表面上要看起来儒雅随和，仁慈稳重，来感召人心；但也需要有狮子般“兽性”的一面，来镇压豺狼虎豹的撕咬和夺权。


