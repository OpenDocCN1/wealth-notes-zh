    当我们追寻目标，活出自己，养出自己的生命能量，需要“有我”，而且是饱满充盈的自我。


    “有我”和“无我”，是对立统一的概念，我希望大家能游刃有余掌握好其中的边界。


    其实，更进一步说：


    “无我“是一种更高级的“有我”——


    只有你对“自我”有相当清晰的认知时，你才不会把自己的情绪和观点看做是“自我”，不会因为任何客观现实不符合认知和预期，而感到自我被冒犯了。


    你能够以“无我”状态客观认知世界，把有用的部分化为己用；把无用、不符合自我目标的部分及时“摒弃”。


    每一个在这个社会上取得了成就的人或商业模式，身上一定有值得学习的点，有客观性在。


