  md: '更进一步地说，人生本就是一场体验和修行，我们的修行是为了锻炼对自己方方面面画的控制能力，并从对自我的控制感中找到强大的“自信”和“底气”。


    这很难，这需要反复、刻意的大量练习，需要在骨子里清醒冷静地看清我们自己的“欲望”和“幻想”，需要去清晰地区分“幻想”和“现实”的边界。


    这背后，需要深刻的对世界底层逻辑的认知和对人性的理解和拿捏。


    需要你既能享受“做梦”的美好体验，但又不沉迷于“做梦”，乃至不肯清醒。


