- pgno: 130
  md: '从这个角度来讲，我们的生命意义是同为他人创造价值绑定在一起的。


    去尋找能够为社会、为更多人满足需求，实现共赢的机会点，深耕其中，并获得你应得的财富份额。


    这个过程，就是创造价值的过程。


    当然，上一节课我们在“混沌思维”中讲过，人性是混沌的，人的需求同样是混沌的；


    比如说黄赌毒，对多巴胺的过度追求，同样是人的本质追求，也同样会衍生出满足这些需求的业态。


    阴暗面必然存在，但需要被限制在一定的范围之内。


    对于丙丙来说，我不将这种“负向大于正向“的需求满足定义为“价值”。


    在我的定义中，“价值“是能带来增量和进步的，“价值“意味着更多的创造和共赢。


    当然，大家可以有各自不同的定义。


    我对价值的定义，蕴含着我所追求的目标，我所秉持的立场，我所坚持的理想。


    我希望，在过去的九节课中，大家也找到了自己的目标，自己的立场和自己的理想。


    我希望这九节课，不止是在给大家一些具体的“方法论”，更是能让大家去思考：


    我究竟想“做什么”，什么才是我的“道”？什么才是我的“使命”？


    毕竟，有道无术，术尚可求；而有术无道，止于术。


