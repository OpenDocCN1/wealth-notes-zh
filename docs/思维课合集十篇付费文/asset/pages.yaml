  md: '越能够体现你是一个能够用理性驾驭感性，自我认知和“主场思维”异常强大的“高级”选手。


    # 【4】


    另外一条养成“主场思维”的要点，是时刻记得，掌控你自己，是人生最重要的“主线”。


    一个人对自己情绪的掌控力度，和他的阶层地位往往是成正比的。


    这里面，女性对自我情绪的掌控力度，普遍会比男性更差：


    主要是深受各种“言情小说”和“影视剧”的毒害，那种“失控”和“上头”的情绪价值和体验，会像吸毒一样让女人爽和沉迷。


    “失控”和“上头”确实会带来极度的情绪价值；


    但当你失控，当你的情绪起伏波动，你就不再能专注于自己的目标，不能再专注于自己的“主场”，你的能量感开始涣散，你会容易被他人所拿捏。


    在“筹码思维”中，我讲述了“小铜”是如何通过给白富美提供极致的“情绪价值”，让白富美失控和上头，拿捏住了白富美一家，成功“赘入豪门”，实现了阶层逆袭。


    现实中，通过操控情绪，让他人上头，从而丢弃了对自己的掌控力，乃至于丧失“主场意识”，无限付出和被榨取价值的“杀猪盘”不要太多。


    这反过来也说明，当我们想要向上攀登时，必须时时刻刻保持“主场意识”，不断修炼“自持”和“冷静”，避免因为“失控”而被他人拿捏住。'
