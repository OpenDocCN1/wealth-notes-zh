- pgno: 125
  md: '只有不带情绪和爱憎判断，才能客观认知，出席商业场合需要奢侈品进行包装，展示自身实力，降低信任成本。


    但要做到的是，不能将奢侈品与自身的心理认同联系在一起，好像不穿戴名牌自己就没价值了一样。


    **理性控制物欲，不被自己的欲望所夺舍，始终坚持住自己人生的主线和目标，在攀登、自我控制的过程中，寻找自己存在的意义。**


    以上，我们讲了如何判断“价值”，明确“向内求”、精神上的“稀缺性“才是真正的“稀缺性”，也是我们能够守住自己主场的唯一方式。


    但我们活在现实世界中，就需要尊重物质世界的价值定律，不断做大自己的价值。


    -5-


    **接下来，芮芮提供几个在现实世界中，能够有效帮大家“做大价值“的小技巧：**


    **首先是我们 在星球和第七课上社交中讲到的成为“情绪价值“的提供者。**


    归根结底，这是因为情绪价值是一种极度稀缺的价值。


    我们刚才已经分析过，每个人都渴望自己是“稀缺”的，是独一无二的，这是人性本质的需求，必须得到满足。


    因此，通过提供情绪价值，做大自己的稀缺性，就是往按摩他人的自恋，想办法让他们觉得他们很“稀缺”、很“美好”的方向去按摩。


