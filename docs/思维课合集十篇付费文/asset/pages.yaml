  md: '当你在大佬面前是个low货，你的任何行为都无法打动对方，你给对方的价值就是当工具人献祭的价值。


    那么，正确的链接方式是什么样的呢？


    这点我们在星球里写过了，那就是“欲取先予”，先通过大方的分利让利来展现格局，给他以利益，再通过观察判断筛选同频者。


    在这里不多赘述。


    能做到“欲取先予”，是你足够高格局，克制我执，精神境界足够强大的体现。


    你能够站在他人和上帝视角思考问题，知道越是强求越不能成功，越想要什么，越要先满足对方的需求，解决对方的顾虑，才能拿到你想要的。


    而当你能活到这种境界，那么就必然能提供“感恩之心”这种非常高级的情绪价值。


    因为世界上大多数人都深陷“我执”之中，想吸血和索取，能坑则坑。


