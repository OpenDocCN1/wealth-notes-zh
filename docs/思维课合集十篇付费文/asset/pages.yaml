  md: '联合上节课的内容，那就是将注意力集中在“升级我的筹码”的目标上，从而能够以资源利用的目光看待自己的生活。


    第二步，识别与自己的筹码和目标匹配的“负向资源”，想办法降低其负向影响，并发挥出其正向作用。


    有一句话叫做“甲之蜜糖、乙之砒霜”。事物很多时候是福祸相依，利弊参半。


    有些对他人来说是能够升级筹码的“正向资源”，但如果不能正确地利用，就会变为“负向资源”。


    而在这种情况下，想办法盘活“资源”，让其发挥正向作用非常重要，否则，你的筹码不但不会在资源的加持下升级，反而会受损。


    举个例子，体制往往会被认为是非常珍贵的平台和资源，因为它能带来稳定，带来安全，并且有一定的社会地位，做的好的情况甚至能掌握权力。


    但往往，体制也是双刃剑，比如会说消耗你的进取心和冒险心，磨损你对时代风向的敏锐程度，打压你的个性和自我等等。


    当你利用体制这个资源的时候，你需要知道这个资源该如何有效利用，怎么做它会给你带来升级，而怎么做它会给你带来损害。


    丙丙有位朋友莉莉，是远近闻名的大美女，而且衣着打扮非常时尚和有品位，走在路上经常会会被网红公司要联系方式，希望捧她做网红。


