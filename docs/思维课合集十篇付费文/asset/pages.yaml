- pgno: 91
  md: '但事实上，我只能看到他骨子里的无聊和孱弱，不尊重自己的时间，也不尊重他人的时间，把宝贵的时间浪费在获得一些“廉价的自我优越感”上。


    我虽然嘴上不说，但心里已经下调了对这个人的评级，也不可能给他资源、认知上的倾斜。


    从资源利用最大化的角度来讲，我建议大家从0到1后，再寻找大佬赋能。


    让大佬能清晰地知道你能带给他们什么价值，与此同时你需要什么价值。


    当一个人没有0-1时，他因为缺乏内核，思路往往是“寄生性”的，很容易幻想“傍一个大佬”去走捷径。


    而越是缺乏内核，大佬越无法带给你有效帮助。


    相反，你很容易迷失在他人的光环和主场中，有些非正派的大佬感受到你的幻想，很可能会利用你的幻想，白嫖或者献祭你来达成他的目的。


    比如说在台湾政治电影《血观音》中，棠夫人就是献祭了记者一家，为自己的上位铺路。


    强者必须有自己的内核，你要明白你是在“借势”而不是“依附”或“寄生”，这才是唯一避免被白嫖和献祭的心法。


    以上，我们讲了三个“向上社交”中容易踩的雷点，接下来，我们来讲讲什么是正确的做法。


    首先，要看得清本质，摆的正自己的位置，做到有退数。'
