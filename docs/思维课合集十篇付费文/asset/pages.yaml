  md: '# 把握买单思维，让你保持人间清醒


    ![](img/6cb073bd511b44c977146f123dcb2138_72_0.png)


    大家好，我是丙丙，今天我们讲十节思维课的第六课，让你及时止盈止损，保持人间清醒的买单思维。


    之前的几节课，我给大家更多讲的，是如何更加积极进取，更加心无旁鹜，提升自己的认知和心力。


    但事实上，在充满了不确定性的世界中一味求取，也可能被无法填补的欲望所捆绑，迷失本心。


    所以今天，我们来讲“买单思维”，知道什么时候该停下来，暂时止步离场，“暂时的放弃”是为了更好的得到。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 73
  md: '我们首先从电影《消失的她》中，何非的例子出发来思考：


    何非本是个工作和存款都普普通通的人，因为想“搏一搏”，赚更多钱，所以落入了互联网赌博，在尝到了甜头、赚到些快钱之后，越赌越大、越陷越深；


    但仍不肯下牌桌，总觉得只要继续 在牌桌上，就会得到老天的青睐，一把翻身。


    就算是负债累累，也仍然沉迷其中，无法自拔。


    一个原本健康向上的普通人，就这样滑入了贪欲的深渊。不仅普通人如此，哪怕是世界冠军，也同样可能沉迷于“情绪上头”的刺激之中。


    其实，追求“幸运”，享受外界突然不可预期的正反馈，是人的本性。


    这也是抽卡游戏、盲盒等产品风靡全人类的核心原因。


    在单纯的概率游戏中，人们无法控制“输赢”，享受的是运气突然降临的感觉，在那一刻仿佛获得了来自上天的确认；


    然后在反复的得失、情绪的起落之中投入了过多沉没成本，被唤起了“不甘心”，从而越陷越深，逐渐背离和忘却自己的人生主线和目标。


    再比如，大家有没有深爱或者迷恋上一个“不可得”的人的经历：


    在这种经历之中，对方既有高价值和高光环，又展现出了强大的不确定性，忽冷忽热，若即若离。可当你想要放弃时，对方又总能恰到好处地给到你一些甜头；'
  merge: -1
  img_proc: true
- pgno: 74
  md: '可很快，甜头过去，又是一盆冷水，你在反复的纠结、猜疑对方的想法中不断精神内耗，投入时间、精力等沉没成本，而对方对你的种种引诱，让你被唤起了“不甘心”，总觉得自己再努力一点点就可以得到“对方”。


    于是，你不断越陷越深，情绪完全被对方所牵引，对方想让你哭你就能哭，想让你笑你就能笑。


    你沉沦在这种失控的快感之中，在这种情绪的被操纵之中，反复经历情绪从潮涌到低谷再到高潮的“爽虐结合”的体验。


    -2-


    其实，如果大家将前几节思维课学的融会贯通，很可能已经发现了问题的所在：


    无论是沉迷赌博、还是陷入一段失控的关系，它们的本质都是一样的——


    那就是你不再坚持自己人生的“主场”，你让他人或者你的欲望成为了你精神上的“庄家”。


    你深陷于他们制定的规则之中，你给了他人或者你的欲望，能够对你极大地施加“得利”或者造成“损害”的力量。


    从而使得你自己不断向他人或者欲望献祭自我，拱手谦让自己的财富、精力乃至于宝贵的注意力和能量。


    其实，无论是赌徒心理，亦或是陷入失控的爱情，本质都是陷入了“弱者思维”之中。


    在“弱者思维”之中，我们失去了自己的主场——


    沉沦在他人制定的规则之中亦步亦趋，继而对他人和外界产生了种种期待，并不断对外索取自我认同，索取存在感。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 75
  md: '当外界满足我们时，我们感觉志得意满、神采飞扬；而当外界或他人不满足我们时，我们又感到迷茫失控，无所适从；


    于是按照外界和他人的要求来改变并模塑自己的行为，以期能获得“一口糖的奖赏”。


    我们就像被主人驯化的“狗”一样，被主人引导着，按照主人的要求亦步亦趋，以吃到“肉骨头”作为自己的“快乐来源”。


    而这个过程，往往就是你向所谓的“主人”、“主流文化”，你的领导献祭自我，模塑自我，压抑自我的过程。


    而因为喜怒哀乐全都寄托于外界，所以很容易在预期得不到满足时，产生种种抱怨的情绪。


    但因为本质上没有筹码和实力来迫使他人满足自己的预期，所以这些抱怨会被以各种方式合理化、情绪宣泄，从而让自己舒服些。


    这也是为什么，绝大多数人，在35岁后都活成了同一幅失去了生机的面孔。


    但从另一个角度讲，“弱者思维”是芸芸众生的“本性”。


    因为将希望、喜怒哀乐寄托于外界是最容易的：


    这意味着不必吃“精神上的苦”，不必费心去控制自己的欲望，不必努力攀登目标和高峰；


    不必去挑战一个个问题和困难，披荆斩棘地解决他们，并在这个过程中去感受自我的存在。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 76
  md: '只需在生活的困顿之中，幻想着会有一个“神仙”救自己脱离苦海、只需不断抱怨世界的不公；


    在互联网上说些情绪发泄的话，幻想存在一个“乌托邦”，在那里不用付出任何东西，就可以轻松地实现自己所有的欲望。


    -3-


    不过，“强弱”实际上不是静态的、一成不变的，而是时刻在相互转化：


    哪怕是一个生活中的“强者”，也可能会在挑战现实的问题中，阶段性地被自己的欲望或者他人给做了“庄”，陷入“弱者思维”之中。


    比如说，哪怕是像丙丙这样的专业投资者，也要反复面对“人性”的考验：


    当股票走高时，很容易因为“贪心”，觉得股票还可能再涨一涨，而不敢及时“卖出”止盈，最终的结果是“黄粱一梦”，玩了个寂寞；


    而当股价走低时，又往往因为“恐惧”很快割肉，没有看到趋势即将反转，最终结果是“一卖就涨”。


    当人被自己的情绪和欲望做了庄时，就难以理智地分析当前的局势，在赢的时候不知道自己为什么赢，在输的时候不知道自己为什么输。


    完全寄希望于运气（破格获取）的时刻，就是最危险、最弱者思维的时刻。


    人赚不到认知之外的钱，即使凭运气赚回来，早晚也还要还回去。


    如果大家对投资有些研究，应该能非常理解这句话。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 77
  md: '其实投资就是一场“对自我心性的修行”，对自身“强者思维”的把控；


    对自己的认知极度清醒，知道自己的边界，不是寄希望于侥幸，而是寄希望于自律和自我。


    人生最大的问题，就是因为“求不得”和“不甘心”而产生种种怨气，执念，最终吞噬自己，开始想着“博一个大的”，让自己背离目标导向，离初衷越来越远。


    当事情超出我们的预期和掌控时，要做的不是孤注一掷，而是合理把控风险，避免自己死掉，或者失去“东山再起”的机会。


    思危、思变、思退，其实是一种大智慧的体现。


    而“买单思维”，就是在发现事情已超出了自己的认知和掌控时，能立刻切断欲望的引诱，及时抽离下桌；


    不被沉淀成本牵动决策，牢牢守住自己的主场，不让任何其他人、事、物，代替自己，做了自己精神上的“庄”。


    比如说，丙丙有个朋友，早年自己做生意亏了钱，不甘心其他小伙伴都过得比自己好，就负债加杠杆玩期货，希望能“博一个大的”；


    结果没想到从亏六位数，到亏了大七位数，差点从天台上跳下去寻短见。


    这个小伙伴就是典型的负面案例，“买单思维”极差。


    他不能接受自己的失败，不能接受“沉淀成本”已经打水漂的现实，不能直面残酷的现实和结果；


    不能为自己过往的决策“及时买单”、认真复盘、愿赌服输，并寻找合适的机会“东山再起”。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 78
  md: '而是开始寄希望于命运、寄希望于侥幸，期待着“运气”来为自己“买单”，只要老天眷顾我“赢一次”，就说明我一点都不失败，我是幸运儿，我是成功者。


    说到底，他没有能力也没有意愿为自己的人生承担责任。最终的结果只能是咽下更深刻的苦果。


    面对同等的境遇，强者思维则会迅速认亏、买单离场，不与烂人烂事纠缠。而这种及时买单背后的底层逻辑是：


    +   我不期待任何人为我负责，我不寄希望于外界或者奇迹发生，我不相信天上会掉馅饼，我有能力也必须为我自己的人生负责；


    +   我不是真的“亏了”，而是交学费，等我进行深刻的复盘总结，提升了认知，后续自然能把这些“亏损”再赚回来。


    因为对自己“主场”的坚持，因为对自身能力和未来的确信，故而足够的清醒理智、爱惜羽毛，所以能在种种欲望和诱惑面前戒除幻想、保持清醒。


    “买单思维”的强大，来源于“主场思维”的强大，坚持做自己精神上的庄，绝不掉入他人的框架亦步亦趋。


    而如果不懂得自己能力的边界，被欲望驱使，产生了“以小博大”的侥幸心理，不能及时“买单离场”，那么必然会落入他人的框架，迷失在外物之中。


    丙丙虽然一贯让大家向内求，但生活在现实中，我们每个人都不可能对外界一无所求。


    可只要有所求，就必须面对外界的“不确定性”，就要去接受有些事可能“脱离了我们的控制”。


    > 更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 79
  md: '而当事情脱离我们控制时，最考验我们是否还能继续维持“向内求”，而不是向外界去投射期待，渴求“破格获取”。


    而“买单思维”，就是告诉我们如何正确地处理与不确定性之间的关系，不是冒险梭哈，而是克制欲望，戒除幻想，为自己负责。


    -4-


    接下来，丙丙想跟大家分享两个最重要的“买单思维”，分别是“及时止损”与“及时止损”。


    首先是“及时止损”：


    人们在投入巨大沉没成本之后，还拿不到回报，往往会产生种种不甘心，不愿买单认栽离场，产生“赌徒心理”，期待奇迹发生。


    我们之前讲的例子，无论是赌博、恋爱还是创业，都是这种心态的反应。


    而在这种时刻，必须首先认清自己“心怀侥幸”，打破幻想，认清自己掌控不了局面。


    此时要做的，不是继续对外投射期待，而是先买单离场，专注自身，提升自己的认知等方方面面，再来把握下次机会。


    以专业投资为例，我们买入一只股票后，无论涨跌，都要去探究原因是什么，是否在自己的认知和预期之内；


    一旦股价下跌超出了自己的认知，仓位又比较重，经过理性的判断、最坏的结果无法承担，那么就要选择及时止损，降低仓位乃至清仓，而不是贪恋“奇迹发生”。


    丙丙有些读者，上来就说满仓了几百万在股市里，想搏一波大的，问起投资的核心逻辑，会发现他们根本没什么核心逻辑和认知。


    更多资源，关注公众号【懒人找资源】'
  merge: -1
  img_proc: true
- pgno: 80
  md: '要么是情绪上头赌“国运”，要么是觉得“应该"差不多，甚至有些是从某大V的评论区问了财富密码，就觉得可以冲了。


    这种心怀幻想，将一切寄托于运气的“赌徒心理”，必然无法捍卫住自己的财富和权力，哪怕偶然得到，长期也必将失去。


    而强者思维，则是把握规律，专注自身，相信按照规律办事，自己可以把握自己的生活，不需要寄托于运气。这也是为什么“善易者不占”。


    再举个情感方面的例子，游戏规则（世间法）同样生效。


    比如说电影《消失的她》里，李木子被救命恩人何非的追求和陪伴打动，准备和何非结婚，正在这时，她得知何非是个“赌徒”。


    此时她选择了包容和帮助，而非及时止损，将何非踢出自己的生活，最终导向了自己被何非杀害。


    实际上李木子“陷入爱情”，同赌徒“陷入赌博”是一样的——


    都因为投入了很多沉没成本，而感到“不甘心”，陷入“弱者思维”，侥幸心理发作，被粉红泡泡引诱，开始美化自己的行为决策，自我感动自己是为了“爱”。


    最终丧失了对自己生活的把控，乃至丢掉了宝贵的生命。


    “及时止损”，就是在任何时刻，当你发现情况不对劲，超出了自己的认知或预期，不要本能地自我美化和合理化，而是尊重自己的感受，静下心来暂时抽离；


    冷静地思考：这个人/这件事是否已影响了你去实现主线目标，或者可能带来重大风险。


    更多资源，关注公众号【懒人找资源】'
