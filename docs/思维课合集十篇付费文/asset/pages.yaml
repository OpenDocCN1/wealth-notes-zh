- pgno: 66
  md: '但讨厌归讨厌，我还是不断观察他的社交，在他身上学习到了很多“向上社交”的思路和法则，潜移默化地提升了自己的技能。


    再比如说，很多女生会觉得某个女生看起来“绿茶”就和她不来往；


    但真正有格局的做法是，永远不从道德上judge他人，学习“绿茶”身上的闪光点，提升自己为人处世的情商，同时增强自己对人际关系底层逻辑的理解和把握。


    丙丙之所以年纪不大，却对世事有很通透的看法和理解，恰恰是因为我一直践行“never judge”的原则，不在和他人的相处中去投射“自我认同”。


    因此三教九流的人能够在和我的相处中感受到我是“包容”、是“开放”，是“无抵触”的，所以他们都能成为我的朋友，向我敞开他们的圈层和思想。


    也因此，我才能看到各个圈层最真实的面向，进行提炼和总结，构建属于我的认知框架，并分享给各位读者朋友。


    我希望，大家都能学会有意识地锻炼自己的“客观性”，不“抵触”，任何事物都可以成为你能加以利用的资源。


    “我”不是我的“爱憎好恶”，我是一团生命力旺盛的海绵，我将你们的一切都化为了我的养分，然后坚定地按照我的意志去生存。


    - 5 -


    第三步：树立一个基本认知——-存在的事物，便有其合理性。


