- pgno: 36
  md: '前两天我发了一个朋友圈，说真正的强者，无论是创业还是爱情，都会勇敢地追求对自己真正有价值的事物，哪怕需要冒险，哪怕可能会失败，哪怕会失去。


    这是稀缺的赌性和生命力本身。


    然后有读者把这句话理解成了，我要去当舔狗追男神/女神，排除万难也要去“舔”。


    为什么会产生这样的误读？


    因为绝大多数人，都无法识别什么是真正“有价值”的。


    所谓的“有价值”一定是针对“我的需求”而言。


    比如说丙丙非常不喜欢吃“冬阴功”，我对“冬阴功”没有需求，那么“冬阴功”对我就没有价值。


    哪怕全世界人都喜欢“冬阴功”，都对这道菜趋之若鹜。


    但是“对我没价值”，就是“没价值”。


    我不会因为“冬阴功”火锅店排着长队就消耗我的注意力，也去跟着排；


    因为我非常清楚“我的真实需求”，“冬阴功”对我没价值，我不会在上面发挥一分钱的精力。


    “冬阴功”只是一个小例子。


    可对于绝大多数人来说，都无法看清自己真正的“需求”，大家所谓的“需求”，都是被社会主流价值观驯化的产物。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '如果一个人从来没有自己，不知道**自己是谁**，**人生目标是什么**，**要往哪里去**，他就不可能知道自己到底“需求”什么。


    他以为自己的“需求”，其实是别人灌输给他的，**而别人灌输给他这些虚假的“需求”，使他被这些虚假的“需求”套牢，并不断上供自己的精力、财富和劳动**。


    而对于那些知道**自己是谁**，关注自己内在真正的渴望的人，他们会树立自己清晰明确的人生目标，并根据这个目标产生了种种“需求”。


    然后他们会根据自己的“需求”，去寻找那些能够满足和解决这些需求的人和事，**这才是“追求对自己有价值的人和事物”的原意**。


    举个例子，你的人生目标之一是抓住时代风口，成为“超级个体”，实现阶层跃升，并对自己的人生有绝对的把控权。


    这个时候遇到了一个各方面条件都很不错的世俗意义上“高价值”的男孩，说和我结婚吧，以后可以不用这么累。


    那么你的最优解其实是，筛选掉这个看起来“高价值”的男孩。


    为什么？因为他也许对其他人很“有价值”，他可以满足很多人的需求，但是他无法满足你的“需求”，公众号：智学行用，他无法尊重你的事业心，甚至会限制你的自由和未来。


    而你需要把一切无法满足你需求的所谓“高价值”人和物，全部屏蔽筛选掉。


    当然，在现实中，这种“筛选”是不容易的。


    因为你周边会有很多声音告诉你，**这个人多么多么“高价值”，他们无时无刻不再左右着你对价值的判断，试图混淆你自己的目标和“价值评判体系”。**


    更多资源，关注公众号【懒人找资源】'
