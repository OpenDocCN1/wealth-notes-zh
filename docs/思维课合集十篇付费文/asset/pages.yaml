    只有能够施加足够的威慑和损害，才能最大化地增加他人的作恶成本，确保“作恶”不会成为优势策略。


    这也是为什么有句古话：“雷霆手段，菩萨心肠”。


    当然，世界上不缺乏骨子里就是“嗜血”和“侵略性”的人会走向另一个极端，完全无视道德，总想要“掠夺他人”。


