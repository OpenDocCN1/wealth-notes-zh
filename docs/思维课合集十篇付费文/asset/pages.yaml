- pgno: 138
  md: '+   1.制造or增加他人（博弈对手方）对自己的需求。


    比如说大家找婚恋对象or做生意，都会有意识地包装自己，孔雀开屏，开豪车，穿奢侈品，秀自己的光环、实力，其目的是为了提升自己在他人眼中的形象，制造他人对自己的需求。


    再比如，通过“欲取先予”的手段，搞“超市试吃”；当年美团和饿了么疯狂给用户亏钱发补贴券，培养用户吃外卖的粘性和习惯；


    在婚恋中一上来搞“甜蜜轰炸”、投其所好、无限同频，拉满情绪价值，这些方式的本质都是在制造他人对自己的需求。


    再比如，利用人们的损失厌恶心理，引导对方付出，拉高对方的沉没成本，进而让对方感觉“不甘心”，不能果断地买单离场，从而绑定对方。典型的例子就是“赌场”和“赌徒心理”，以这种方式做大他人对自己的需求。


    需要注意的是，**这些制造的需求，可替代性越小，就会越牛逼。**


    比如说第一节筹码思维课中，小铜对小花的温水煮青蛙——


    最终实现的结果是除了嫁给小铜，小花嫁给任何其他人都会不舒服、不快乐，那么小铜在小花那里就有了无与伦比的稀缺性，从而能够对小花无限杀价。


    这也是为什么毒品不能沾，因为毒品制造的多巴胺需求，几乎无法通过其他健康的方式获得，所以沾了毒，就意味着彻底丧失了自己的主场，沦为了毒品的奴隶。


    **第二个提升自己对他人的（博弈对手方）稀缺性的方式，是减少or降低or自主控制自己对他人的供给。**'
