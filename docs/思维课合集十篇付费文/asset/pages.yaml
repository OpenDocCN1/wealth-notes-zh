- pgno: 149
  md: '外显的部分，是不断提升自己的价值，不断精进自己和攀登，在这个过程中不断提升自己对他人的稀缺性；


    通过保持独立、对欲望的戒断，对他人的不依赖，不断解构他人对自己的稀缺性，确保自己人生的主动权始终握在自己手中。


    我们在第一课筹码思维、第九课价值定律，以及第十课博弈思维，讲的是这个道理。


    而在我们不断提升自己的价值，不断精进自己和攀登的过程中，需要不断在现实中应对重重考验，通过重重挑战，也即需要不断地见天地、见众生和见自己。（第四课主场思维&第五课无我思维）


    通过见天地、见众生和见自己，我们掌握了世界的底层逻辑、掩藏在迷雾下的游戏规则和真相（第八课混沌思维），并因此能够降低预期，豁达地接纳人性，从而修炼出自己的稳定内核（第六课买单思维）。


    而为了能够实现我们的目标和理想，我们需要有明确的行动方案，动用各种资源来达成自己的目标。（第二课资源利用思维&第七课向上社交）


    与此同时，我们也需要跨越来自他人的重重阻碍（第三课筛选屏蔽思维），从而始终保持所有的能量和注意力都集中在自己的目标上，不断在攀登的过程中感受我们的“内在力量”，我们自我的存在。


    而当我们回顾这十堂课，会发现一切的底层驱动其实是“生长思维”。


    外显的提升自己的价值只不过是我们内在“生长”的一重显化，是因为我们必须借由“事上磨”；'
