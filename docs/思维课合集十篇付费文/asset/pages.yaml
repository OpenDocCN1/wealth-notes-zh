    这种思维将让你永坠深渊，永远活在虚假、膨胀、恐惧、焦虑和嫉妒中，必须一刻不停地去寻找新的存在感证明依据，靠吞噬他人的能量，来填满了自己的空洞。


    永远谨记，唯有向内求的“向上生长”，志存高远，才是唯一通往自由之路，你的对手始终只有自己。


