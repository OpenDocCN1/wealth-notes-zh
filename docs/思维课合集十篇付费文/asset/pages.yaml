  md: '这就是“枪杆子里出政权”。


    想明白了这一点，就会明白上个世纪风靡的思潮“无政府主义”为什么会行不通——


    因为人性总想斯取更多利益，故而必须有秩序，来裁决纷争。


    而在社会中，如果有公序良俗和良好的法律能帮助普通人捍卫自身权益，向侵害者施加损害，实现社会层面的正面运转，那么这就是有效运转的“秩序”。


    刚出社会的年轻人，或者生活在比较单纯的工作环境中的人，往往没有同他人赤裸裸博弈、撕道，因为利益冲突赤裸相对的经历，往往对人性有粉红色 的不切实际的期待。


    他们很难理解，必须掌握筹码，能对他人施加利益和损害，才能有效避免他人侵犯你的利益。


    而对普通人来说，所谓雷霆手段，说的就是你有现实筹码和手段能对试图侵占你底线的人施加损害；


    进一步延展，你有能力维持在你自己的场域中，一个相对正向和有序的秩序。


    -4-


    我之前在星球里留了作业，为什么《狂飙》中的孟德海需要高启强做白手套？


