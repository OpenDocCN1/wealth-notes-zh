- pgno: 84
  md: '更高级的，甚至能反哺整个生态系统，做大蛋糕，给予他人以能量和利益，引导生态的正向积极互动。


    说到底，我们同世间万物的关系，都是和自己的关系。


    我们的待人接物，都是自身修养境界的映射。


    比如说，许多人的理解中，创业是赌博，炒股也是赌博。


    但实际上，创业和投资并非像赌博那样寄托运气，而是在不确定性之中，想尽办法，利用方方面面的资源、策略、智慧和行动，来尽可能减少不确定性，提升自己的胜率。


    这个过程，并非心怀侥幸，而是完全考验自控、自持，自我成长和自我精进。最终让自己成长为能够配得上财富和权力的样子。


    更一步地说，爱情也是同理。


    在小说和电视剧的荼毒下，大家本能认为爱情就是轰轰烈烈、要死要活。


    但如果你恋爱经验比较丰富，并且恋爱对象都是高价值者（强者思维者）。就会知道吸引力的本质：


    是因为一个人始终坚持自己的主场和自控，不肯被他人精神上坐庄，专注于提升自己，然后让另一个人因为“慕强”，不断去追逐这种不可被驯服的“生命力”本身。


    能谈好恋爱的人，都是坚持“买单思维”的人：'
  merge: -1
  img_proc: true
- pgno: 85
  md: '他们不深陷于爱情，不落他人的框架，不要死要活，而是有自己的人生主线，不断攀登 和进步，不断闪闪发光。


    你会发现，无论是创业，投资，还是恋爱，世间法的一切都是相通的：


    我们首先该处理好与自己的关系，掌握“买单思维”——


    学会并坚持永远相信自己，永远自己对自己负责，对自己有要求，为自己的想法果断下注 和投入，为自己的行为和决策买单。


    坚决穿越“向外求”，寄托外界，心怀侥幸的幻想，哪怕是华美的粉红色泡泡；


    坚持自己的“主场”，及时止盈，及时认亏，在所有经历中专注自己，提升自己，强大自 己。


    愿不确定性成为你生命的养分，风浪越大，你越能保持自己，遇强则强。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 掌握向上社交思维，提升你的向上管理力


    大家好，我是芮芮，今天我们来讲十节思维课的第七课，**掌握向上社交思维，提升你的向上管理力**。


    关于向上社交，芮芮已经在星球写过很多内容，**今天这篇，我想做的更多是透过表象，从底层逻辑上进行穿透**。


    -1-


    还是从有趣的场景模拟开始：


    不知道大家有没有发现，**在向上社交中，经常会出现以下三种雷区**——


    **第一种雷区，** 大多数人面对大佬时，会不能被对方的气场碾压，不敢主动上前链接，认为自己没什么筹码能给对方，害怕自己会被拒绝，索性不开始。


    在和比我们“高价值”的人打交道时，我们很容易产生这种“又卑又亢”的心理。


    有点类似你面对自己喜欢的异性，很容易产生紧张、胆怯、“不配得”的小情绪。


    好不容易鼓起勇气找对方说话，只要对方几个小时不回复，你就容易陷入负面思维，觉得人家看不上你；


    然后因为自尊心受到了伤害，又卑又亢，甚至控制不住情绪删除拉黑对方，或者和对方沟通中变的非常“拧巴”。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '而这种情绪反应，则让你们的关系继续滑向深渊。


    这种状态，看似是无法和“高价值”、和自己在乎的人相处。


    **但从根本上来说，是没有处理好和自己的关系。**


    从骨子里，你认为自己是“低价值者”，你在内心深处对自己的价值不确信，有很强的不配得感；


    所以在和你心目中的“高价值者”打交道时，你会下意识认为对方看不上你，你的自尊受受损。


    而为了代偿式地维护自己的自尊，要么你会选择主动放弃和大佬的链接机会，洗脑自己“没什么大不了的”；


    要么你链接了大佬，也会表现得非常拧巴，又卑又亢，让大佬下调对你的评级。


    因为当链接者不够自信，不够有主场思维，太过在意他人的反馈，且在得矢心和自尊上头的时候，无法理智思考，只能站在自己的角度无限索取。


    这种“弱者心态”很难在社会中做出成就，当然也无法被大佬所欣赏和投资。


    而如果我们逆练这个案例，就会知道，**能主动链接大佬，保持情绪稳定，不因对方没有回馈或者反馈较晚就情绪剧烈波动；**


    **其实是你“高价值”、“强心力”，有自己的主场意识，有“强者思维”的体现，而只有这样子的“潜在强者”，才能被大佬所欣赏。**'
  merge: -1
  img_proc: true
- pgno: 88
  md: '第二种雷区，则是第一种场景的另一个极端，表现在非常积极主动、毫无注意地链接大佬；


    但极度没有逼数，喋喋不休地表达自己，还试图傲慢地指点、PUA大佬，输出“自我意识”。


    比如说很多在互联网平台上前来链接你的读者，先对你进行一番评头论足，指点江山，然后让你帮他干这个那个，索取价值。


    我之前有一个粉丝，从知乎一路追我到小红书，给我发私信说非常欣赏我，然后画风一转，建议我出一个两位数的咨询，满足他这样学生党的需求。


    我没有回复他，因为我知道以他当前有意识或无意识“自我为中心”的认知模式，极易演变成“升米恩、斗米仇”。


    他还需被社会教教为人处世的基本原则。


    很简单的一个道理，为什么一个比你有价值的人理所应当该满足你的欲望和需求？


    当然，他显然不是“笨蛋”。


    他的策略，是在自己筹码不够的时候，下意识地采取“道德绑架”的方式，试图拉平筹码差距，以期能够通过较低的付出，博得更高的收益。


    他的言行，看似是“链接”，实则是“试探”，试探能否通过压榨大佬底线、PUA大佬的方式，来索取更多的利益。


    这种人，就是我们在第四课“筛选屏蔽思维”里提到的白嫖“吸血鬼”。'
  merge: -1
  img_proc: true
- pgno: 89
  md: '实际上，互联网上80%都是这样的人，因为不断压榨对方底线，来谋求个人利益，是人性的一种本能。


    而越是在底层和下沉市场，通过PUA“白嫖”和“吸血”，越是优势策略。


    因为越是底层，越是弱者林立，许多弱者没有自我，极易落入他人的框架，成为血包工具人，所以在底层社会“白嫖”的胜率很高。


    很多深谙PUA大法的“白嫖”者无往不利，吃到了甜头，就试图用同样的方式“搞大佬”，向上社交，“软硬碰吃”。


    可事实上，这种方式极度不适用于“向上社交”，因为每一个靠自己能力爬到金字塔上方的社会资源掌控者，都是“强者”；


    是屏蔽了无数吸血鬼、白嫖者和霸凌者的压榨底线，才爬到了今天的位置上。


    大部分时候，以你的段位，根本无法PUA到这样的强者。


    而这种试探，反而彰显出了你的没有逼数，看不清自己的位置，对世界底层逻辑缺乏了解，脑袋是一团浆糊。


    这种人会立刻被大佬用筛选屏蔽思维筛选掉，在不知不觉中，丧失掉很多机会。


    而如果我们逆练这个案例，就会知道“有逼数”、“低姿态”在向上社交中是决定性的；


    这不仅仅是给大佬提供情绪价值，更重要的是体现出了你较高的认知水平，你脑海中的认知框架符合现实世界，而不是装满了浆糊。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '第三种常见的向上社交雷区，是迷恋大佬的光环，于是漫无目的的跪舔大佬，亦步亦趋。


    这种情况很容易被某些心怀鬼胎的大佬当工具人献祭，对自己的加持也会非常低。


    因为不是以自己目标为导向，而是被他人的光环吸引着“舔大佬”，**其实是一种落入他人主场的体现**。


    **而不是你有自己的业务、资源，事业，有目的地寻求大佬赋能，你有自己的主场**。


    当你没有自己的主场，落入他人的主场时，就不能责怪别人在“精神上坐庄”，因此可以对你施加得利和损害，甚至压榨你的利益和底线。


    江湖不相信眼泪，只有强者才会被尊重。


    当我们向上社交的时候，首先要牢牢坚持“主场思维”和“目标导向”，而不是被大佬的光环迷惑，心生幻想，亦步亦趋。


    **想清楚，我们到底想从大佬身上获得什么？**


    **是认知？是资源？还是其他什么东西？**


    **总之，决不能是漫无目的的。否则，你不仅是浪费自己的时间，其实也是在浪费大佬的时间**。


    这一点看起来很容易，但在这里犯错的人屡见不鲜。


    比如说，有个学弟，经常隔三差五来找我，聊些有的没的，评头论足我的朋友圈，给我发一些他认识的其他大佬和他的聊天记录等等。


    他可能自以为自己在“维护优质人脉”，并且用和大佬的聊天记录彰显个人价值。


    更多资源，关注公众号【懒人找资源】'
