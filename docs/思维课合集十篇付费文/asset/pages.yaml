- pgno: 96
  md: '本质上，这是因为你的精神力量远远超越了您当前的阶层，于是你被大佬识别成为了“强者”。


    在这里，丙丙举个反例：


    之前有个品牌商想和丙丙合作，为了表达自己的诚意，跟我说买我的星球，交个朋友。考虑到知识星球要抽手续费，不划算，不如直接微信转账给我。


    于是直接微信转账了我415。


    这笔钱我没收，他的话我也没接。


    因为通过这次互动，我已看出了他为人处世的“格局之低”，目光之短浅，对金钱急功近利的渴求。


    大家可以思考一下这个案例中，品牌商的问题出了在哪里？


    首先，他缺乏换位思考能力，无法站在对方的立场上考虑，对方的需求到底是什么？


    对方的产品，并不仅仅是为了“赚钱”，而是对方“价值”的体现。


    你不买对方的产品，而是直接转账，看似让对方拿了“更多钱”，好像自己很“体贴”，可实际上，这意味着你既不认可对方产品的价值，也不认可对方的价值。


    你看似“给了钱”，但这种“钱”是侮辱性的：


    你仿佛在跟大佬说，你就值这几百块钱，看到了吗？你收了我的几百块钱，就要好好替我办事，替我推广产品哦。


