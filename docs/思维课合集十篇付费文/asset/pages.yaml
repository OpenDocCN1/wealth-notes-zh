- pgno: 70
  md: '所以我们“师夷长技”、化为己用，但坚定地摒弃他们不被我们所欣赏的“价值观”部分。


    **其实，能够转换思维，避免党同伐异般地指点江山和攻击；而是每一分每一秒都去寻找能够“为我所用”的部分，并坚定地不被带跑偏：**


    **这本身是一种极度强大的“主场思维”。**


    我清醒地知道我是谁，我要去哪儿，我有什么目标要去实现。


    我将汲取一切养分，助力我完成我的目标。


    我不被我的爱憎好恶影响情绪，进而打乱行为节奏，我不将自我认同锚定和投射在外物之上。


    我也不会被他人带节奏，继而走偏走歪；


    我清醒地知道自我和他人的边界，我清晰地知道自我与他人的局限。


    我有我的路要走，别人的路可以学习、可以借鉴，但不能照搬，更无法彻底复制。


    **我就是我，我化一切为我所用，但绝不在他人的框架中亦步亦趋。**


    比如说，丙丙也经常看曲曲的视频，学习她对大佬的认知和理解。


    但这不代表我赞同她的价值观，也不代表我也要通过“雌竞”的手段来成为“社会资源掌控者的依附者”。


    我将一切为我所用，但坚定地走自己的路。


