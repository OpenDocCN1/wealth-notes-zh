  md: '可事实上，刘慈欣是很典型地对自己想要什么、想做成什么事非常清醒的人——


    他在自己的目标和热爱上不断精进自我，创作出一篇又一篇的经典科幻故事，而名声和财富，不过是他不断精进和攀登，最终实现了"稀缺性"后，自然而然而带来的显化。


    前几天我去上瑜伽课，老师从09年开始练瑜伽，已经14年，境界相当之高。


