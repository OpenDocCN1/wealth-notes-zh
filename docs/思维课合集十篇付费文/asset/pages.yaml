- pgno: 95
  md: '这里还有一层隐含的逻辑，那就是在觥筹交错的场面中说这种漂亮话，能让在场所有人提升对大佬的评级，增加大佬的权威；


    **做大佬的“水军”，本身也是一重你提供给大佬的价值。**


    **而为什么丙丙能提供高级的情绪价值？**


    **说白了仍然有赖于对世界底层逻辑、对人性的理解和把握。**


    **你必须既清醒地知道牌桌下的真相，也懂得利用人性对“面纱”、“对自我价值感”、“对自身华美形象”的追逐，从而刺激人们的精神高潮。**


    **与此同时，你必须修炼“无我思维”，不带情绪和我执地客观看待万事万物，站在不同人的立场思考问题。**


    这时你会发现你确实能跟大佬共情，因为站在他的立场（而非你的立场），你会发现他在某些事上确实有非常独到的闪光点。


    **然后你自然会真诚地表达，而非违心的尬夸，让对方感觉你毫无诚意。**


    **这就是高级的解语花，让人如沐春风，也是你的言行能够直戳人心的关键。**


    **因此，顶级的情绪价值提供，一定同你自己为人处世的“大格局”分不开：**


    **你的自我评价体系自洽圆润，你的情绪稳定，你在“无我之态”，不从外界获取自我认同感；**


    **于是你才能做到无偏见、无我执的向上兼容，理解更高阶层的大佬，并展现出无攻击的温柔、包容和理解。**'
