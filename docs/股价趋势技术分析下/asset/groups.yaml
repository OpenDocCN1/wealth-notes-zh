    # 第20-A章 挑選適當的股票：長期投資觀點


    分」,投資顧問與經理人會收取手續費與管理費。這些費用通常遠少於一般積極管理型基金；可是，即使是如此，投資大衆實際上還是沒有必要支付這類費用。為什麼？縱使是初學投資人，也可以直接使用DIA、SPY、QQQQ……等「指數股」(Index
    Shares)或其他類似工具，幾乎不需另外付費，就可以模仿基金公司或專業玩家在這方面的操作。原則上，「指數化」就是試圖複製股價指數的表現，這類策略在馬基活躍的時代，可以說不可能或非常困難（代價昂貴）。（第9版附註：編者認為，花錢聘傭投資管理機構操作指數型策略是不明智的，而且也很浪費。投資人最好是直接購買相關產品，並且在趨勢反轉的時候，賣掉該產品。這遠勝過那些「被動型指數化」策略，後者是永遠複製股價指數的表現，不論上漲或下跌。）


    # 長期投資人想要的股票


    本書第8版的最重要更新部分之一，或許是充分反映股價指數在目前市場上的功能；請注意，股價指數現在已經像一般股票一樣，可以直接進行交易。這可以說是現代金融市場的一大進展。有關長期投資人運用的戰術與戰略，相關細節已經在第18—A章處理了。本章只是說明股價指數之交易與投資的工具。


    1993年，美國證交所（AMEX）引進SPDRs（Standard & Poor''s Depository Receipts，標準普爾信託憑證），這是在集中市場掛牌交易的單位信託基金，其表現複製S&P
    500綜合股價指數。AMEX稱這種產品為「指數股」（Index Shares），此名稱後來也用以稱呼其他類似產品。如同稍早曾經提到的，大額投資人與基金公司經常運用這類代表S&P
    500的「一籃」股票，但相關操作顯然涉及龐大的資金。某些'
  md: "\n# 股價趨勢技術分析（下冊）\n\n濾網（馬基建議採用 2% 的突破濾網，但也可以根據市況而調整為 3%，或直接透過行情實際的價格波動率決定濾網百分率）。至於執行戰術的交易工具，則包括前文提到的\
    \ SPDRs、DIAMONDS、指數期貨與選擇權。\n\n每種策略都要有出差錯的準備，針對可能發生的空頭走勢擬定因應計畫。如果一般人不堅持只從多邊進行操作，空頭市場並沒有那麼可怕。當紐約證交所的交易大廳染血之後，很多長期投資策略都被拋到九霄雲外。可是，對於準備充分的技術投資人來說，他們有針對這類狀況的因應計畫，而且也應該可以實際按照計畫出脫部位。\n\
    \n這些因應計畫，包括針對執行順利的部位持續調整停止點，至於執行不順利的部位則斷然認賠。不妨把投資組合看成一棵果樹，必須經常修剪雜枝，才能提升收穫。本書很多地方會討論如何設定停損（停止）（請參考第\
    \ 27 章）。對於長期投資人來說，停止點可以設定在一一舉例說明而已，編者並沒有實際建議這麼做——價格跌破 200 天移動平均或／與跌破長期趨勢線。一般認定\
    \ 200 天移動平均是長期趨勢指標，而這種普遍看法也讓該均線因此而扮演重要的角色。第 9 版附註：「200」只是一個參數而已，針對個別市場進行研究，或許可以找到更好的參數。\n\
    \n實際操作上，應該考慮的對象不只是 200 天移動平均或趨勢線而已。投資組合個別股票、以及整體大盤或類股指數的價格形態，也是重要考量因素。另外也要考慮各種股指數與其成分股的技術狀況：是否做頭、陷入盤整、呈現趨勢或其他等等。\n\
    \n## 按照市況韻律進行投資\n\n另外，投資人或許可以按照行情發展的自然韻律，並配合馬基的評估指數，慢慢把投資組合由多轉空（這是本書第 31 章「分散投資」的內容重點）。這是本書作者與編者偏愛的策略。\n\
    \n當然，這一切都取決於投資人本身設定的目標、個性。如果各位準備整天泡在市場，或許就不是長期投資者。長期投資者通常可以吃得好、睡得好。至於短線交易者，則隨時覺得飢渴、準備採取行動（未必是為了錢）。每位市場參與者都應該瞭解自己是投資人或交易者。不過，各位最好不要在市場內評估自己的個性或類型，因為市場可能是尋找自我的最昂貴場所。\n\
    \n長期投資人沒有理由不能針對中期趨勢進行操作，這取決於投入資本的數量，也取決於個人準備花多少時間與精力於股票市場。長期投資策略不需花多少時間與精力。投資人只需要留意大盤指數與主要類股指數，在向上突破、底部盤整或拉回走勢中買進。然後在價格跌破趨勢線、計算基準點（參考第\
    \ 28 章）與支撐區遭到貫穿的情況下賣出。\n\n相較於中期交易者或投機客，長期投資人願意忍受更大的行情擺動。讓我們利用第 28 章的基準點方法做為例子來說明，投機客可能採用「3\
    \ 天法則」，長期投資人可能運用 4 星期的基準點。另外，如果願意的話，投資人一旦認定多頭行情已經接近頭部，也可以改採 3 天法則，甚至每天調整出場停止點。可是，請注意，專業玩家都知道很多投資人把停止點設定在前一天收盤價的稍下方。\n\
    \n長期投資與買進—持有是完全不同的，後者曾經在 1970 年代蔚為風潮，被視為「單一決策的投資」。讓我們舉例說明這種想法的可怕之處。1972 年，華爾街「最精明」的投資分析家（基本分析者）幫該世代長期投資人（20\
    \ 年期）挑選出最棒的股票投資組合。這些股票都沒有什麼可議之處，算得上是美國最頂尖企業的精華。誰會挑剔雅芳產品、柯達、IBM、柏利得（除非各位剛好看到圖 253）、希爾斯或全錄等公司呢？即使是今天，只要對於股票市場稍有瞭解，看到這些股票，最直覺的反應也是「藍籌股」。不過，有關這些股票的長期表現，請參考下列表格。\n\
