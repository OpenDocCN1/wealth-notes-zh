    有選擇權或指數可供交易的話，大約在紐約時間1分鐘之內就會出現（如同每個人瞭解的，紐約的1分鐘只有59秒）。這是本版修訂所要考慮的重大事實。本書前言有詳細的說明。因應新科技與金融環境變化而新增添的章節，都會特別標明，例如：第18-A章（但第23章是例外，該章是完全新增加的）。


    # # 再論必要的修訂


    很多情況下，在少數交易所具有獨佔經營權而能夠控制佣金費率的年代，本書傳遞的資訊還繼續有效，譬如說，經紀商收取的佣金與交易成本。現在，一般書籍已經不適合提供這類的資訊，因為金融資訊變化太快。目前，如果必要的話，應該上網查詢最新的資料。因此，對於這種變化快速的資料，讀者應該上網查詢。


