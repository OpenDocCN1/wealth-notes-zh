    ## 第 37 章 相同的舊有型態


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_267_0.png)


    圖257. ABC日線圖，1961年4月～6月。這份走勢圖相當複雜、有些混淆，但其中包含一些值得進一步分析的現象。首先，請注意4月份與5月份形成的頭肩頂排列，尤其是股價最後挫跌之前的最後一波漲勢，成交量明顯縮小。另外，股票在6月份進行分割，這對於股價走勢沒有顯著影響，只是單純的1股分割為2股，股票數量增加一倍，但股價則減為一半，不過平均成交量有稍微增加的現象。請注意，整個盤勢的發展明顯向下，幾波漲勢（尤其是7月中旬的反彈）不能向上穿越4、5月份頭部的延伸線。下降趨勢持續發展超過一年，1962年10月的低點為11
    1/4。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_268_0.png)


    等腰三角形可以是主要趨勢的連續排列，但也可以是反轉排列。三角形排列之內的第一個轉折點，成交量通常較大，然後大體上就呈現萎縮狀態，價格波動愈來愈緊密。排列過程，該股票等於是同時處在上升趨勢與下降趨勢，排列下限可以視為上升趨勢線，排列上限則視為下降趨勢線。請注意，排列（向上）突破過程出現大量。另外，價格向上突破之後，三角形「支點」（也就是三角形上限與下限的延伸交叉點）是後續走勢的下檔支撐。4月份到6月份之間，股票漲跌幅微超過三角形排列開口位置的垂直距離。股價漲勢到達目標價位，未必代表主要趨勢將結束；1963年8月，CDP股價為33
    1/4。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_269_0.png)


    圖259. XA日線圖，1963年3月～8月。這是上升三角形排列的典型例子，排列內的漲勢都在相同價位折返，折返走勢的下檔支撐則愈墊愈高。這種型態的發展過程，就透露多頭氣息（下降三角形排列則有空頭意涵）。請注意，排列過程中，上限22附近的成交量有放大跡象，8月份的向上突破則爆出大量。如果向上突破的效力還需要其他證據的話，那麼8月12日星期一開盤的跳空缺口應該可以提供。這類突破之後，通常都會現獲利回吐的賣壓，價格可能拉回到三角形排列上限22附近，甚至稍微穿越，這都不會妨礙排列的多頭格局。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_270_1.png)


    圖260. SOC日線圖，1962年6月~11月。評論11月份發生的突破走勢之前，我們需要特別強調一點，在1961年10月份的古巴危機，這支股票並沒有跌破6月份谷底或創新低。這份走勢圖顯示雙重底的典型例子。雙重底的兩個谷底，價格不需完全相同，只要相當接近就可以了。重點是，股價跌勢在某一檔價位獲得支撐，然後上漲，不久之後又下跌，並且在先前的谷底附近再度獲得支撐。兩個谷底之間，應該有相當的時間距離，至少是6個星期，不過最好更多一點。另外，兩個谷底之間的價格漲勢，其峰位距離谷底至少要有15%的漲幅。當第二個谷底出現之後，價格一旦夾著大量穿越兩個谷底所夾的峰位水準，就視為型態完成。就目前這個例子而言，向上突破發生在11月13日星期二，並展開多頭漲勢，直到1963年5月出現高點1559為止，漲幅超過500點。雙重頂具有相反的意義；結構與雙重底很接近，兩個峰位發生在約略相同的價位，相隔幾個星期或幾個月，當價格跌破兩個峰位所夾谷底的水準，雙重頂排列即告完成。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_271_0.png)


    GSI日線圖，1962年11月～1963年4月。對於不熟悉股票行為的一般人來說，股價只是做無意義的波動而已。這些人即使知道市場趨勢，通常也只曉得大盤指數，不清楚某些個別股票的表現可能更好或更差。當然，趨勢未必能夠利用一條直線來代表（雖然有時候可以）。就此處考慮的GSI走勢，長期漲勢是毫無疑問的，雖然中間夾雜著一些不重要的回檔整理。請注意，股票在3月初進行分裂，1股分裂為2股，這並沒有干擾當時的上升趨勢，只是成交量稍微放大，因為流通籌碼增加了。至於對應的下降趨勢，請參考圖250。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_272_0.png)


    這個例子很適合用來說明支撐_壓力現象。順便提一點, 在1963年春天與夏天, 股票市場基本上處於多頭趨勢, 但這支股票則例外呈現跌勢 (雖然這類例外的股票數量不少)。3月與4月份,
    股價數度上漲到31, 5月初跌破下檔支撐。5月份與6月份, 股價漲勢都受阻於3月份低點的压力。6月中旬, 股價再度跌破支撐, 後續漲勢受阻於4月底的低點。股價在7月份又跌破支撐,
    後續漲勢受阻於6月份底部25。這是很典型的支撐/壓力行為。價格一旦跌破支撐, 則該支撐將成為後續漲勢的上檔壓力; 同理, 價格一旦突破壓力, 則該壓力將成為後續跌勢的下檔支撐。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_273_0.png)


    某些情況下，走勢會突然發生，但沒有造成持續性影響。此處提出這份走勢圖，主要是想說明價格突破某重要支撐/壓力關卡，可能產生重大走勢。請注意，由1月中旬到5月14日星期二之間，走勢圖大體上呈現矩形排列，下限在
    $10 \frac{1}{8}$ 或 $10 \frac{1}{4}$ 位置，上限在 $11 \frac{3}{4}$。排列過程出現數波漲勢。至於5月中旬的向上突破，基本上是反映糖市場的行情，類股內的所有相關個股都發生類似走勢，但整個上漲行情只是曇花一現。漲勢雖然很短暫，但漲幅確實驚人；交易者的膽子如果夠大、身手夠俐落，可以在5月14日星期二收盤之後，考慮投機性操作。隨後5個交易日，股價由星期三開盤
    $12$，上漲到5月21日的 $17 \frac{1}{2}$，漲幅高達 $46\%$。我們通常不建議讀者進行這類需要大量勇氣、經驗的操作，而且要有斷然認賠的心理準備。可是，短線交易者看到5月21日的單日反轉線形，而且伴隨著異常大量與跳空缺口，可以在隔天開盤賣掉股票，或起碼也應該根據最近收盤價設定停止點，譬如在
    $17 \frac{3}{8}$。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_274_0.png)


    圖264. 3月底與5月初，CDA出現的小型跌勢，透露一些警訊。接著，在1965年5月與6月初，股價回升，這段發展特別值得重視。回升走勢的上限與下限彼此收斂，構成向上傾斜的楔形排列，具有明顯的空氣意涵。如果楔形排列向下傾斜，則代表價格很可能向上突破。請注意楔形排列過程內，盤中價格最高的兩支楔形，當天價格都收在最低價附近。隨後，當這個不太常見的價格型態向下突破時，曾經爆出大量。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_275_0.png)


    圖265。這份走勢圖有幾個技術現象值得觀察。7月份、8月份與9月份的大部分期間，價格呈現潛在的W底排列。9月27日，價格向上突破，隨後出現一個星期的狹幅整理，成交量很小，然後再度夾著大量向上挺進。請注意10月份與11月份的整理，這是相當大型的等腰三角形排列。如果繪製排列的上限與下限，可以清楚看到12月1日星期三的大量向上突破，上升趨勢持續發展。由28
    $\frac{1}{2}$ 到62以上的整段漲勢過程，幾乎完全沒有顯示任何弱勢。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_276_0.png)


    圖266. LVO週線圖，1965年1月～1966年1月。這是觀察主要底部排列的範例。1965年上半年的走勢非常疲軟，這可以由5月份的向下跌空缺口看出來。另外，請留意整個下跌過程的成交量都很大。可是，由7月份到10月中旬，成交量急速萎縮，股價波動的震幅愈來愈小，構成等腰三角形排列。10月份，價格夾著大量向上突破，心中存疑的投資人，甚至有「第二次機會」在11月份第一個星期的回檔走勢進場，當時股價拉回到三角形排列上限附近。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_277_0.png)


    圖267. PKB在1965年8月到1966年1月之間，出現相當漂亮的技術走勢。首先是9月份與10月份的旗形整理，這是相當典型的「飄揚在旗桿中央的旗形」；漲勢恢復之後，漲幅稍大於旗形排列之前的漲幅（請參考圖223）。請注意10月份到1月份之間的整理走勢，排列上限為水平狀，下限則向上傾斜，成交量在排列過程呈現萎縮狀（上升三角形排列），然後在1966年1月的第二個星期向上突破。就目前這個案例觀察，由9月份到1月份之間，實在沒有理由賣掉股票。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_278_0.png)


    - 圖268. 此處呈現一個相當平坦的頭頂頂排列，也可以看成是圓形頂，2月份跌破60，則屬於明確的空頭訊號。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_279_0.png)


    圖 269.


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_280_0.png)


    圖269. 1970年1月，股價在一天之內「腰斬」，這不是我們經常可以看到的股價發展。可是，由另一個角度來說，這也屬於很「正常」的現象，因為我們過去看過一些這類案例，相信將來也會繼續發生。出現這種狀況，通常都代表「麻煩」。ADA股票原本走勢正常，處在很健全的上升趨勢內。可是，經過1月15日的暫停交易之後，股票一旦重新恢復交易，就落得這種下場，最後在9月份停止交易。某些讀者或許還記得過去發生的一些類似案例，包括：Mack
    Trucks與Fifth Avenue Coach，還有多年前的American Woolen。這類價格重挫走勢，起因都是公司內部的突發狀況或變動；可是，交易者沒有必要知道事件發生的原因，走勢圖已經說明一切。1971年4月30日，Villager
    Industries也發生類似的「跳空缺口」，股價在一天之內由$7 \frac{3}{8}$下跌到$4 \frac{1}{4}$，跌幅為$42\%$。這種突發性的走勢，幾乎都是向下發展，很少看到類似程度的向上跳空缺口。股票價格一旦發生這種程度的重挫走勢，雖然可能出現短暫的反彈，但最後幾乎一定會繼續下跌，甚至經常是以下市收場。任何持有這類股票的人，不應該認為自己買錯股票，也沒有必要責怪自己沒有察覺股價暴跌的跡象（這類走勢通常都沒有預兆）。可是，持股者應該立即脫離股票，避免損失進一步擴大。可是，我們也要強調，這類走勢畢竟是很罕見的。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_281_0.png)


    圖269.1. 為了讓讀者瞭解這類的泡沫還繼續存在，請看看這個世紀轉折期間的案例。這類跳空缺口經常是由盈餘報告異常造成的，這種現象經常發生在第21世紀轉折期的諸多股票，交易者可以在盈餘報告公佈前，放空一些技術面呈現弱勢的股票，風險不高，但往往可以碰到目前這個例子的賺錢機會。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_282_0.png)


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_283_0.png)


    圖270. PEG是很典型的公用事業股票。這類股票很多，主要是提供相關地區的水、電、瓦斯……等服務。公用事業股票經常有類似的表現，因為它們在性質上很類似。


    沒錯，公司盈餘、股利與股價之間存在某種關係，但不論盈餘或股利，都不能完全決定股票「價值」，因為還有很多東西可能影響股票價值，譬如：盈餘穩定性、未來展望、稅金考量、公司的研究發展投資……等。


    在大部分地區，公用事業都享有法律保障的獨占地位，收入相當穩定；而且，這類股票也有明確的成長能力，因為人們對於能源的需求穩定成長。這類股票價格長期以來都有呈現很固定的型態，類似此處的PEG。各位可以發現，公司盈餘由1959年到1970年之間，每年都成長。另外，除了1970年沒有變動之外，股利也是每年都增加。任何人如果想根據「本益比」之類的簡單公式衡量股票「價值」，因該認為1970年的本益比2.5倍（就如同1965年的情況一樣）很便宜。


    當然，情況沒有那麼單純。如果有「好機會」的話，大型基金與大股東絕對不會放棄。股價走勢之所以低迷，實際上透露公用事業類股面臨的困境，包括：成本高昂的新設備、控制環境污染的設施，以及包括自由化在內的種種問題。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_284_0.png)


    圖271. 對於大多數股票來說，1969年屬於空頭市場，但MRX卻享受著長達4年多頭漲勢的最後階段。請注意11月、12月與1月份的高點頸部，這段期間的成交量很少。2月初，出現向下的跳空缺口，這已經足以解釋一切。請參考圖269。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_285_0.png)


    圖 272. 由 1967 年的高價 48 1/2 開始，FLY 股票進入 2 年半的空頭市場，股價曾經跌到 11 1/4。可是，在 1970 年春、夏之間，股價見底而呈現頭肩底反轉排列，突破之後股價大幅上揚，到了
    1971 年 2 月，幾乎就收复了 2 年半跌勢的「失土」。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_286_0.png)


    圖273。此處呈現各位非常熟悉的排列，經常出現在本書其他場合或各位自己的圖譜內。ACX日線圖在1971年12月與1972年1月份，出現一個大型的上升三角形排列。請注意價格如何進行突破，以及突破之後的拉回走勢，然後繼續展開上升趨勢，直到1972年4月。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_287_0.png)


    圖273.1. 戴爾電腦月線圖。此處有兩個現象特別值得注意。這是由大學宿舍裡孕育出來的大型企業（當然是電腦企業），其次是經常性的缺口（下一份圖形顯示得更清楚）。對於不喜歡遭逢意外的人，顯然不該持有這類股票。每個人都應該根據自己的個股投資股票。戴爾電腦跌破長期趨勢線，後者可以輕易繪製於本圖，在多少頭陷阱之後，股價跌到20，呈現很多向下跳空缺口的警訊（參考下一份走勢圖）。圖形最右端出現非比尋常的大量，這是嚴重警訊。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_288_0.png)


    圖273.1.1. 戴爾電腦日線圖。精明的交易者察覺股價跌破趨勢線之後，或許可以即時避開隨後發生的向下跳空缺口。一般技術分析者應該會賣掉股票，並且放空隨後的突破缺口。看過一隻鬱金香狂熱型的股票，就瞭解其他相同類型的股票。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_289_0.png)


    英特爾週線圖。根據趨勢線狀況，交易者可能已經多次進出這支股票。對於1997年7月1998年9月之間形成的「矩形狀楔形」，長期投資人可能耐心等候，價格在排列過程從來沒有跌破下限。趨勢線愈陡峭，代表突破愈確定。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_290_0.png)


    圖273.3．諾基亞。先前峰位與谷底代表的支撐／壓力非常重要。技術分析者利用這些水準來衡量行情，就像道氏談到如何在海邊沙灘上設定樁柱來衡量潮水。請注意，2004年的漲勢如何受制於1999年的峰位壓力。價格在跌破上升趨勢線之後，又跌破1999年峰位支撐，這對於技術分析者有重大啟示。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_291_0.png)


    圖273.4. AMD日線圖。股價走勢反映出半導體產業瞬息萬變的狀況，還有包括英特爾在內的強烈競爭，AMD提供很多交易機會，包括多頭與空頭部位在內。當價格向上穿越短期趨勢線，代表中期交易者的理想進場點。


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_292_0.png)


