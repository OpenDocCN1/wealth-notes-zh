    採用某種統計方法反映圖形組合的趨勢，並藉此調整交易組合的結構與資金規模（編者附註，馬基的評估指數）。另一種方法，是順著趨勢發展而進行加碼；還有一種方法，是逆著趨勢發展而攤平成本，換言之，在空頭行情裡，分批向下買進，或在多頭市場，分批向上放空。


    前述任何方法本身，都不可能完全解決何時買進、何時賣出的問題。本書的主旨，是研究個別股票的技術現象。如果能夠由走勢圖判斷何時買進、何時賣出，則已經掌握了交易成功的基本關鍵。另一方面，如果所設定的買、賣點總是發生淨虧損，那麼如何調整資金規模與組合結構就沒有差別，因為最後結果都相同，交易資本將完全耗盡。編者附註：投資人如果發現自己的情況正是如此，應該設定一個基準。譬如說，如果交易資本損失到達50%，就停止交易，轉而購買共同基金。共同基金的表現應該不至於更差。


    所以，首先必須處理的問題是：學習如何運用技術工具，包括：型態、趨勢、支撐／壓力……等。然後，再考慮投入多少資金與相關的調整方法。


    我們已經釐清一點，如何運用資本確實會造成不同的結果；事實上，往往是非常不同的結果。本章準備討論綜合槓桿指數，及其各種構成因子，包括：股票價格、股票敏感度與融資程度；稍後，我們會提出明確的定義。另外，前一章已經做了充分說明，所以當我們由綜合槓桿角度討論交易組合，讀者應該瞭解我們的目的何在。


    當然，各位應該不至於心態過於保守而幾乎排除所有的獲利機會。如果各位決定不違背主要趨勢，那麼在漫長的次級修正過程，必須無所作為，靜待主要趨勢恢復發展。若是如此，勢必放棄所有不明確訊號與收斂趨勢，也不會在噴出行情或恐慌性賣壓高潮之後建立部'
  - '[PAGE 345]


    位。無庸置疑地，這種過份謹慎的態度，一定可以提高交易的成功機率；換言之，交易成功機率將不是60%、70%或80%，而是90%或接近95%。可是，這種保守的心態，意味著各位只會在最理想的市況下進行交易，當時的機會非常明確、清楚。當然，這種機會也不會很多，結果雖然是獲利，但獲利程度或許不足以彌補各位在圖形研究上所花費的功夫。即使不進行任何研究，也不需承擔太高的風險，任何人都可以輕鬆賺進2%、3%或4%的報酬。如果花費很深的功夫從事研究，當然希望賺取較高的報酬。


    編者附註：「這類最起码的報酬」是指公債或其他類似投資工具而言。債券交易者與投資人總認為這類投資「沒有風險」，但這種態度顯然拒絕面對現實。如同大衛．德拉曼（David
    Dreman）所顯示的（請查閱參考書目），由資產購買力的角度衡量，債券是一種價值持續減少的資產。


    如果想要發揮技術分析的功能，我們就必須接受獲利潛能較高的股票，並因此而接受較高的風險。相較於那些買進「安全」證券而擱入保險箱的投資人，我們必須願意承擔更大的風險。


    各位應該採納某種固定的綜合槓桿程度（編者附註：投資組合風險），這是經驗與判斷告訴我們在特定市況下的應該採納的安全水準，如此可以避免發生過度保守的問題。更重要者，如果維持固定的綜合槓桿程度，也可以避免不經意的過度交易。這個毛病的普遍程度，更甚於過度謹慎；過度交易是很危險的，即使各位的理論勝率很高也是一樣。挑選明確的綜合槓桿程度之後，除非市況發生變動而需要做調整之外，都要嚴格遵守，如此可以讓自己的情緒保持在安全界限內，永遠清楚自己承擔的風險程度。'
