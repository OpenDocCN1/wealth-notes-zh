    $ 20,000。哪棟房子比較適合居住？答案沒有任何疑問。可是，就現況判斷，獨門獨院住宅的行情顯然低迷，公寓房子的需求旺盛。所以，如果想要投資的話，6單位公寓可能是比較適當的對象。


