    # 時間長度


    14天是RSI最常見的期間長度，但也可以採用其他期間。當日沖銷或短線交易者經常採用6天期RSI做為獲利了結的工具：當指數向上穿越75而重新折返，代表賣出訊號。短期RSI對於當時市況的反應比較敏感。某些交易者甚至採用3天期RSI，用以判斷非超買、超賣區（換言之，介於30～70之間）交易的重新進場點。金融期貨也經常採用10過RSI背離訊號；這通常適用於股價指數、債券與外匯。可是，對於其他市場，週的訊號比較罕見而不精確
