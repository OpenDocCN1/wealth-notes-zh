    # 電腦進行圖形分析是最單純的方式


    事實上，電腦可以做為一種完成簡單工作的簡單工具。運用電腦從事圖形分析，原則上沒有什麽複雜的地方。任何電腦安裝軟體都能提供長條圖。很多（或大多數）軟體也能提供其他圖形功能，由陰陽線，乃至於擺盪指標。一般的操作程序很簡單，實在不需要在此花費時間講解（請參考本書附錄D），原則上只是擷取資料、更新資料，'
