    \n## 第 18-A 章 長期投資的戰略與戰術\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_67_0.png)\n\
    \n圖 201.1. IBM 月線圖。這份走勢圖可以說明「單一決策投資」的問題或荒謬之處。首先，「最精明」分析師建議在當時的 10 年期高價買進 IBM，結果價格很快就跌了一半。稍後，股價雖然回升，甚至漲到當初買價的一倍。看起來好像很不錯。然而，不幸地，在\
    \ 20 年投資期限結束的時候，股價較當初買價下跌了將近 40%。前述分析已經點出這支股票的可能交易方式。如同我所說的，投資人有公牛（多頭）、熊（空頭）與駱鳥（自欺欺人者），任何人如果相信這種「單一決策投資」，就能證明我的論點。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_68_0.png)\n\n圖 201.1.1 全錄月線圖。如同先前 IBM\
    \ 的情況一樣，最精明的投資專家建議在應該賣出的價位，買進全錄股票。前一份圖形的評論，也適用於此。只要看看股價的長期擺動，就能說明這種「買進 - 持有」或「單一決策投資」的愚蠢之處。技術分析就是嘗試矯正這類愚蠢的行為。\n\
    \n## 摘要結論\n\n長期投資人試圖掌握主要的行情走勢，也就是道瓊指數上漲數百點、甚至上千點的行情，持續時間可能長達好幾個月或好幾年。\n\n在這種時間架構上，長期投資人會針對次級走勢做出反應。至於反應的對策，則取決於投資人的性向，他可以針對次級修正走勢進行避險。\n\
    \n關於股票選擇，長期投資人通常會挑選市場領導股、主要指數的成分股，也可能挑選一些投機股做為點綴。\n\n雖然傾向於長期投資，但投資人不該容忍表現不佳或持續虧損的股票。長期投資人還是要講究即時認賠、讓獲利持續發展的原則（這是失敗投資人最難以瞭解的市場終極法則）。還有另一個投資人很難理解的觀念是「趁著強勢買進，趁著弱勢賣出」。\n\
    \n真正精明的投資人，也會試圖掌握空頭市場的賺錢機會。這也是專業玩家與一般投資大眾的最大差別，專業玩家不排斥做空。\n\n為了當日沖銷者查詢方便起見，此處列舉賭徒專用的網址：\n\
    www.gamblersanonymous.org。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_70_0.png)\n\
    \n# 第 19 章 重要細節\n\n本章與下一章討論的內容，主要是提供給從來沒有繪圖經驗的讀者參考。所以，對於有經驗的讀者來說，或許會覺得內容過於淺顯或無聊，但此處討論的某些細節，還是可以簡化繪圖程序。初學者應該詳細閱讀這兩章，做為往後參考。\n\
    \n瞭解繪圖細節，雖然不能保證獲利，但如果不能把這些細節納入例行的繪圖程序，就不能期待圖形有條不紊，當然也難以獲利。\n\n繪製圖形與相關分析並不困難，也不需花費很多時間，但所追蹤的圖形數量不宜太多，而且要安排固定的工作時間，絕對不可以拖延。\n\
    \n首先，各位需要資料來源，包括每天的價格與成交量。如果各位住在大城市，晚報就可以提供所需要的資料。你可以安排晚上的一段固定時間，用來登錄與分析圖形。如果晚上實在抽不出時間，也可以在清晨工作。總之，你必須安排固定的時間，絕對不可以中斷，否則很難避免失敗的結果。編者附註：透過電腦的自動下載程序，以及國際網絡提供的資源，繪圖工作當然變得非常簡單。可是，原則還是相同的。\n\
    \n你應該找一個適合繪圖的工作場所。如果是在家裡，餐廳或客廳應該不錯，但家裡的成員必須瞭解你正在從事重要的工作。工作的時候，需要把門關起來，不要受到打擾。燈光需要明亮，儘可能不要有陰影。（如果處理大量圖形，燈光因素很重要。）一般的桌燈可能會反光，最好採用吊燈，大約擺在頭頂上幾英吋的距離。如果採用日光燈，可以用兩支\
    \ 40 瓦的燈管。當然，前述建議是假定房間採光不佳，不能直接靠著日光工作。\n\n工作的空間儘量大些。大型書桌或餐桌都可以，需要有足夠桌面來擺放圖形、方格紙、草稿紙、鉛筆、米突尺、計算尺或其他繪圖與分析工具。一般桌面高度大多是\
    \ 30 英吋，並不適合繪圖工作，桌面距離地上的高度最好是 28 或 29 英吋，比較不容易覺得疲倦。\n\n每個人可以根據自己的習慣，採用鉛筆或鋼筆繪圖。如果採用鉛筆，可以先試試各種不同硬度的筆。鉛筆硬度需要恰當，太軟會造成線條暈開，硬度太高又會造成線條不夠清楚。總之，如果使用的鉛筆不恰當，會搞得心煩氣躁。另外，要準備足夠數量的鉛筆，至少一打以上，每枝筆都削尖，每當鉛筆稍微禿了，就可以換筆。\n\
    \n利用活頁方式裝訂圖形，洞孔打大一點，翻閱才容易。每本圖冊不要裝訂太多圖形。如果圖形太多而不易翻閱，就另外裝冊。佔滿紙面空間的圖形可以歸檔，圖冊只需要保留目前繼續更新的圖形。儘可能採用\
    \ 7 孔的夾子；2 孔或 3 孔的夾子，圖形很容易脫落。\n\n隨著時間經過，圖形涵蓋的期間愈來愈長，參考價值也愈來愈高。過去的圖形很重要，找個地方儲藏，按照時間順序擺放，邊製一套方便查閱的索引。另外，其他相關資料也應該編製為檔案，包括：經紀商的回報條與對帳單、股利通知書、公司財務報表、新聞或文章剪貼、有關交易方法與行情分析的評論……。\n\
    \n每筆交易都應該保留完整的紀錄，例如：買賣價格、股利……等。申報所得稅的時候，這方面資料很有用。另外，這也可以提供所有的統計數據，藉以評估交易績效。\n\n\
    編者附註：在我剛踏入金融投資領域的初期，甚至是在發展過程中，覺得前進程序都屬於最基本的智慧。在這個領域內打滾愈久，愈認為這種基本功夫是最重要的投資準備，這有點像馬克吐溫所描述的，他很驚訝地發現，他父親隨著自己年齡增長而智慧愈來愈高。\n\
    \n我們可以重申前述教誨：要認真，要有方法，維持紀律，要敬業。任何在投資領域获得成功的人，都必須具備這些條件，否則就純屬運氣，隨時可能跌倒。\n\n各位或許會好奇，關於電腦科技對於技術分析與投資的影響，馬基究竟有何看法？他可能會說：「這些工具有什麼用呢？！神奇而令人厭惡！！」\n\
    \n一般電腦安裝軟體的功能，表面上看起來，令人眼花撩亂，所以投資人務必抓緊自己的立場。電腦只是協助我們從事技術分析，而技術分析最重要的任務究竟是什麽？千萬不要忘掉這點。\n\
    \n## 電腦進行圖形分析是最單純的方式\n\n事實上，電腦可以做為一種完成簡單工作的簡單工具。運用電腦從事圖形分析，原則上沒有什麽複雜的地方。任何電腦安裝軟體都能提供長條圖。很多（或大多數）軟體也能提供其他圖形功能，由陰陽線，乃至於擺盪指標。一般的操作程序很簡單，實在不需要在此花費時間講解（請參考本書附錄\
    \ D），原則上只是擷取資料、更新資料，然後按某個鍵，就能繪製圖形了。套裝軟體本身提供的解釋，可能更超過我們在此所能夠做的。可是，我們希望在此強調一些根本立場。\n\
    \n就這方面來說，繪圖功能可以透過相當昂貴的電腦軟體來完成，但也可以採用一些免費軟體。網路上也提供一些互動式的繪圖軟體。除了基本的長條圖之外，套裝軟體還可以提供很多技術分析工具，例如：移動平均、攤盪指標，以及其他等等。可是，這也造成一些危險。圖形分析本身屬於定性分析。在很多計量導向的資料圍繞下，一般投資人可能會迷失方向，產生困惑而不能做決定。\n\
    \n所以，圖形分析者的首要任務，就是讓整個過程儘可能保持單純。取得資料。繪製走勢圖。分析型態排列。考慮成交量。繪製一些協助分析的線條。這些工作通常可以直接透過電腦程式在螢幕上進行，但最好是把圖形印製出來，然後用手工方式繪製趨勢線。這段評論也凸顯出多數套裝軟體的問題所在：螢幕上的圖形很差，至少對於老派的分析者而言是如此，很容易造成分心。尤其過去習慣採用\
    \ Teknplat 繪圖紙的分析者，非常不習慣看電腦螢幕。關於這個問題的解決辦法，請參考附錄 D。（第 9 版附註：自從本書第 8 版發行以來，發生了兩件事：編者慢慢適應了現代科技，而科技進步也慢慢符合挑戰分析者的胃口。一些技術分析網站，例如：stockcharts.com\
    \ 與 prophet.net 的服務品質都大幅改善，廉價提供很多珍貴的資訊，有些甚至還免費。）\n\n關於圖形如何代表事實的問題，是很值得探討的。在某種程度內，每個人都必須自行解決這個謎題，根據圖形環境調整自己的肉眼與心智，固定採用一種圖形方法，評估該方法與市場事實之間的關係。關於約翰·馬基對於這個問題的解決辦法，請造訪\
    \ www.edwards-magee.com。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_74_0.png)\n\
    \n本書的附錄 D 內，讀者可以看到一些非常簡單、便宜的套裝軟體，以及網站，它們具備的功能或提供的服務，對於技術分析繪圖已經相當足夠了，當然也有一些更複雜、計量導向的分析。\n\
    \n## 摘要結論\n\n- 電腦是非常重要的分析工具，具備下列功能：\n  - 資料可以由網際網路或接撥站自動下載，成本低廉或完全免費。有些甚至提供即時資料，這可以讓一些沒有經驗的交易者很快破產；可是，對於一般投資大眾來說，在其進行交易的當天，通常都希望取得這些資料。這些網站提供的分析範圍很廣，包括正統的技術分析（通常太過複雜）。\n\
    \  - 電腦套裝軟體與網際網路投資組合網站，通常都能讓分析者輕鬆的管理投資組合帳戶，每天都按照市價試算組合價值，如此可以讓投資人避免搞混「現金」與「應計」會計。\n\
    \  - 電腦讓分析者可以處理一些過去難以想像的工作。分析者所能夠處理的股票數量，在電腦協助之下，幾乎已經不受限制。至於如何透過電腦挑選交易對象，請參考第\
    \ 20 章與第 21 章。\n  - 本書附錄 D 提供一些有關電腦套裝軟體的資料，這些軟體的價格相當合理。大體上來說，即使是價格最便宜的軟體，其功能也足夠一般投資人運用。另外，我選簡單討論一些網站與資料來源。\n\
    \n# 第 20 章 挑選適當的股票：投機客觀點\n\n我們希望登錄的股票圖形種類很單純，數量也不多。我們要的是那些價格區間夠大，足以交易獲利的股票。換言之，價格走勢夠大而值得進行交易的股票。某些投資人主要關心本金的安全，以及收益的穩定性。有些股票確實符合這種條件。你可以（實際上或許也會）保留一部份資金購買這類股票。它們的價格區間很窄，具有強勁的抗跌能力，但跟隨大盤上漲的能力也（必然）相對有限。這類股票非常適合保守型投資人。可是，它們不適合於股票操作，因為價格擺動幅度太小，佣金成本將抵銷絕大部分交易獲利。另外，相對於投機性股票來說，它們缺乏明確而清楚的價格型態，通常會呈現圓弧狀緩慢走勢。（第\
    \ 9 版附註：這段評論所反映的時代已經過去了。就像遠古時代的恐龍，這類股票大體上已經絕跡了。保守型股票在市場上已經沒有容身之地，除了債券之外，如果股價不動如山，將會因為通貨膨脹或美元貶值而喪失真實價值。即使是債券，也經常要用本書討論的工具重新評估價值。）\n\
    \n為了進一步闡述我們考慮的根本因素，假定某家公司發行兩種股票：優先股與普通股。假定該公司往後可以取得穩定的最低獲利，藉以發放優先股的股利；換言之，繼續發放股利似乎沒有什麼問題。可是，優先股股利為固定，假定為\
    \ 6%，其他獲利將分派給普通股。某一年，普通股股利為每股 50 美分。隔年，普通股股利為 $2.00。這種情況下，假定其他條件不變，優先股價格可能不會有太大變化，但普通股價格將發生「槓桿」擴張效應，價格可能是前一年的\
    \ 4 倍。投機性較高的股票，可能代表公司業務經營性質不穩定，每年的獲利波動很大，也可能代表大部分「穩定」獲利將用來支付優先性較高的債權。除此之外，還有許多其他的因素可能影響股價的投機性攪動；因此，某些股票非常敏感，另一些股票極端保守，兩者之間當然還存在各種不同程度的敏感性或風險。請注意，公司業務經營性質，未必可以決定「股性」，因為還有很多重要影響因素。可是，大多數股票都有相當明確的「攪動」能力，通常可以根據過去的表現，判斷未來股價攪動的幅度。（第\
    \ 9 版附註：我們或許可以說，短期價格波動與長期區間。）\n\n順便提及一點，對於短線交易來說（第 9 版附註：在目前環境下，馬基所謂的短線交易，是指趨勢長度小於道氏理論波浪者），我們考慮的「股性」只有一部份取決於公司業務經營性質。假定有兩家公司，一家的過去獲利表現不穩定，波動很大，另一家的過去獲利表現穩定，經營很保守；這種情況下，購買前者股票所具有的保守程度，可能超過購買後者的高槓桿股票。稍後會討論這方面涉及的風險因素。\n\
    \n另外，放空股票並不代表你覺得整體經濟將衰退，或該公司業務將衰退。放空股票只代表你覺得該公司股價暫時被高估，或該公司盈餘或股利率水準近年來偏高而難以繼續維持，很可能向下修正；總之，你之所以放空股票，是因為你基於某些理由認為該公司股價將下跌。\n\
    \n就技術交易角度來說，我們希望挑選投機性股票，股價在多頭行情內將大幅向上擺動，在空頭行情內則向下大幅擺動。適合投資的穩定性股票，通常不適合交易。某些範圍條件內（隨後將討論），股票的投機性愈強，愈適合交易需要。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_77_0.png)\n\n機會與安全的比較。右圖是固特異優先股走勢圖，該股票每年都可以取得\
    \ $5.00 股利，但沒有權利參與其他獲利的分派。左圖是固特異普通股走勢圖，可以取得公司清償優先債務之後的所有獲利。這兩份半對數月線圖涵蓋相同的 54 個月期間，普通股漲幅高達\
    \ 300%，優先股漲幅只有 25%，由於後者的每股獲利最多只有 $5.00，股價只能上漲到投資人所願意接受的最低殖利率水準。\n\n# 第 20-A 章\
    \ 挑選適當的股票：長期投資觀點\n\n## 保守投資的觀點變動\n\n現實世界幾乎已經沒有第 20 章描述的所謂保守投資人了，除了仍處於遠古時代的信託單位。當然，或許還有少數極端排斥風險的人，繼續採用前述描述的投資方法。銀行信託部門也可能繼續這麼做。為什麼？因為防止信託受益人控告他們。當然，即使是如此，信託受益人還是可能控告他們不勝任。可是，這正是信託機構之所以存在的理由：當信託受益人控告時，給予受託人法律保障（所謂的「謹慎管理人條款」）。目前，多數開明的信託機構或受託人，都會採用指數型產品，或其他更有效的策略，因為這才符合謹慎管理人條款的新定義。如果管理不當或績效顯著不彰，信託受益人需要另外尋找適當的管理人。\n\
    \n「指數化」是建構某投資組合，藉以複製或充分反映 S&P 500 或道瓊工業指數等普遍受到重視之股價指數的相關措施。這些投資組合的表現，絕對不可能與根本指數完全相同，因為「雞蛋過手輕三分」，投資顧問與經理人會收取手續費與管理費。這些費用通常遠少於一般積極管理型基金；可是，即使是如此，投資大眾實際上還是沒有必要支付這類費用。為什麼？縱使是初學投資人，也可以直接使用\
    \ DIA、SPY、QQQQ……等「指數股」(Index Shares) 或其他類似工具，幾乎不需另外付費，就可以模仿基金公司或專業玩家在這方面的操作。原則上，「指數化」就是試圖複製股價指數的表現，這類策略在馬基活躍的時代，可以說不可能或非常困難（代價昂貴）。（第\
