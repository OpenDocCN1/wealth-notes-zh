    # ## 股價趨勢.技術分析（下冊）


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_146_0.png)


    圖210. 調整多頭部位的保護性停止單。這是ACR的日線圖，前一個多頭市場結末於1944年7月，股價隨後陷入整理，1945年夏天出現圓形底排列，9月12日夾著大量向上突破，往後的拉回走勢就代表買進機會。根據第27章的表格，第一個停損點可以設定在8月21日小型底部下側的6%處，相當於$9
    \frac{7}{8}$。9月19日與20日的價格區間完全位在月17日線形的上側；另外，9月28日的走勢完成「隨後三天法則」，使得9月17日的低點成為設定停止單的基準點。將停止點調整到9月17日底部下側的6%處，相當於$10
    \frac{5}{8}$。下一波漲勢中，10月11日收盤價創新高，高於10月1日小型頭部的3%。停止點調高到$11 \frac{7}{8}$（譯按：將10月1日的小型頭部視為設定停止單的基準點）。11月2日，收盤價再創新高，高於10月15日小型峰位的3%；停止點調升到$12
    \frac{3}{4}$。11月15日，收盤價又創新高，高於11月7日小型峰位的3%；停止點調升到$13 \frac{1}{2}$。11月29日，走勢又符合「隨後三天法則」，使得11月26日的低點成為底部，停止點調升到$13
    \frac{3}{4}$。12月5日收盤價高於11月17日高價的3%，停止點調升到$14 \frac{7}{8}$。最後，1946年1月3日，停止點遭到引發。


    處在空頭行情中，空頭部位的停止點也是利用相同方法向下調整。'
  - '[PAGE 147]


    # 第 28 章 何謂底部？何謂頭部？


    會碰到模稜兩可的情況。雖說如此，我們還是可以設定一些運作上的判斷準則，而且這些準則失敗的機會不大。


    關於多頭部位的停止單基準點，可以採用一種不錯的原則來判定最近的底部：當可能的低點發生之後，如果隨後三天的價格都高於該低點線形的最高價，則該低點將視為最近的底部。舉例來說，上升趨勢出現連續幾天的折返，某天曾經創低價
    24，當天高價為 25。這種情況下，如果隨後三天的盤中價格都不曾低於 25 1/8，則 24 視為最近底部。隨後三天的整個價格區間，必須完全高於底部發生當天的線形（譯按：三天不必連續）。這就是所謂的「隨後三天法則」。相同的觀念也可以用來判定先前的頭部；換言之，隨後三天整個價格區間，必須低於頭部當天的線形。


    這個法則可以用來設定最初的停損點，也可以用來調整後續的停止點。一旦隨後三天走勢決定底部之後，就可以把停止單移到最近的底部下側（第 27 章已經解釋如何根據最近底部為基準點而設定停止點）。


    多頭部位的保護停止價位只可以向上調整；換言之，停止點設定之後，除非股票除息或除權（需要根據現金股利或權值向下調整），否則就不得朝相反方向調整。同理，空頭部位的保護性停止點，只可以調降而不能調升。（如果發生除息或除權的狀況，空頭部位停止點應該調降。）


    某些情況下，很難判斷頭部或底部的位置；盤勢似乎出現整理或修正，但價格並沒有明顯朝次級趨勢方向發展。這種情況下（相對於一系列明顯的向上或向下波動），就必須仰賴個人的經驗與判斷，決定基準點位置。'
  - '[PAGE 148]


    # 基準點


    我們把設定停損的頭部或底部，稱為「基準點」（basing points）。多頭行情中，每個小型折返底部都視為基準點，只要符合「隨後三天法則」，就可以利用該基準點來設定停止單。我們也利用多頭行情的每個小型頭部做為基準點。同理，空頭行情中，每個漲勢頭部與每個小型底部，也都是設定停止單的基準點。


    如果股價顯著主要趨勢方向發生一段重大走勢（譬如15％），然後股價折返先前走勢幅度的40%，只要股價再朝主要趨勢方向發展，折返走勢的端點，當然是基準點。可是，如果折返走勢的幅度小於40%，甚至是在先前順勢端點附近盤整幾個星期，然後又朝主要趨勢方向發展，則折返走勢的端點，也是基準點（當然還需要成交量配合）。


    每天的成交量，就像醫生手中的體溫計一樣：成交量所蘊含的內容，遠超過價格本身透露的表面徵兆。三種情況下，我們可能發現不尋常的大量：（1）價格突破型態的當天，尤其是向上突破；（2）走勢朝主要或次要趨勢方向創新的極端價位，換言之，價格在多頭市場向上穿越前一個小型頭部，或在空頭市場向下穿越前一個小型底部；（3）當小型走勢完成或即將完成的時候，換言之，多頭市場的小型頭部附近，或空頭市場的小型底部附近。除了前述三種情況，凡是順著主要趨勢方向發展的走勢，如果爆出大量，就代表該走勢告一段落了，不能完成預期中的漲勢或跌勢。


    股價一旦穿越先前的小型頭部，則進入創新高的領域，這時候如果爆出大量，股價通常會拉回整理。一般來說，會出現幾天或一個星期以上的跌勢。可是，所謂的整理，也可能是好幾個星期的橫向盤'
  - '[PAGE 149]


    # 第28章 何謂底部？何謂頭部？


    整，股價沒有明顯下跌。如果股價向下修正，可能會逼進或跌到前一個小型峰位（支撐）。另外，修正走勢也可能帶動價格回到基本趨勢線（銜接先前兩個或多個小型底部的直線），或是平行折返線（銜接先前兩個或多個小型峰位的直線）。如果修正走勢採取橫向盤整的方式，很可能會止於前述的兩類趨勢線之一。


    不論修正走勢如何發展，觀察重點都在於「成交量萎縮」。新的頭部發生之後幾天內，不論價格折返或停頓，如果成交量萎縮（允許不規則發展，但整體而言必須有縮小的趨勢），則可以合理判定這是小型修正走勢。接著，如果股票繼續朝主要趨勢方向發展，而且符合「隨後三天法則」，就可以將該底部視為新的基準點（如果修正走勢採取橫向整理的方式，可以採用繪製趨勢線穿越的點，不一定要採用極端點）。


    如果股價先出現一段橫向波動，然後進行突破，並展開新的漲勢；這種情況下，我們經常很難判斷最近底部位在何處。突破之前，可能出現好幾波不重要的走勢，成交量很小。若是如此，我們將以大成量為突破訊號，並將訊號發生之前的最近期低點，視為基準點。


    前述有關多頭市場基準點的種種評論，也同樣適用於空頭市場，但向下突破不一定伴隨大量。


    還有一種非常棘手的情況，假定股價經過一段直線狀飙漲走勢，然後出現顯然是旗形排列的折返。當折返走勢超過前一段漲幅的40%時，我們在成交量縮小的情況下進場買進，結果股價繼續下跌，沒有任何反彈或成交量放大的微兆。這是很不尋常的發展，但不論在漲勢或跌勢中偶爾還是會發生。面對這種情況，必須在日前價位之下尋找支撐，合理的支撐應該位在前一波下跌走勢過程（整理型態、多重的頭部或其他）。我們應該利用這些支撐做為設定停損的基準點，而不'
  - '[PAGE 150]


    是垂直狀漲勢的極端低點。


    關於前述情況，往往很難找到支撐力道夠強勁的基準點。所以，長期飆漲走勢發生整理時，通常不該進場買進，除非（1）股價下檔存在強勁支撐，可以做為設定停損的基準點；（2）股價創數年來的新高價，處在「海闊天空」的領域。（主要下降趨勢的空頭部位當然相反：上檔存在強勁的壓力，或股價創最近幾個月以來的新低價。）總之，當股價出現延伸性快速、直線狀走勢，如果打算在隨後的整理走勢中進場，這些旗形或三角旗形排列務必要有成交量顯著萎縮的現象。


    關於中期趨勢之內的短線交易，我們還希望提出一些警告。構成中期趨勢的小型波動，發展或許非常有規律；其中可能有明顯的趨勢線；小型折返幅度可能是前一波小型漲勢的40%或50%，價格可能拉回到先前的小型頭部。修正走勢過程的成交量可能萎縮。我們或許很容易在這些階梯狀走勢進行交易，預期後續走勢還會繼續先前的規律。可是，趨勢不可能永遠發展下去。任何小型頭部都可能是中期頭部。基準點的功能，是讓我們得以及時脫身：最好的情況下，當收盤價跌破基準點就應該出場；最糟糕情況下，所設定的保護性停止單會被引發。什麼時候應該結束中期趨勢之內的短線交易呢？成交量可以提供一些幫助。雖然頭部都會發生大量，但我們所關心的是遠超過先任何小型頭部（或空頭市場小型底部）成交量的大量。趨勢內最後一個或倒數第二個頭部，通常都會出現爆發性「天量」，如果見到這類高潮狀的大量，就應該準備退場觀望，股價很可能會大波段的中期折返。幾個星期或幾個月之後，我們可能發現股價修正幅度高達前一波中期整體漲勢的40%或以上，而且成交量又萎縮到窒息程度。這個時候，我們可以嘗試尋找主要趨勢方向的交易機會。'
