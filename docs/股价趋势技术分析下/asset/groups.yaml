    # 附錄 E


    第4單位 29.50+ 1/2 1.20 相當於 30.10


    # 一致性


    龜族得到嚴格的指示，務必遵守進場訊號，因為每年的最主要獲利可能發生在少數 2、3 筆交易中，萬一錯過其中一筆重要交易，勢必會嚴重影響續效。


    表現最好的龜族，都是那些嚴格遵守進場訊號的人。至於那些半途而廢，或不能嚴格遵守每個進場訊號的人，績效通常最差。


    # 第5章 停損


    龜族採用N為基礎的停損，避免帳戶淨值發生嚴重損失。


    有種說法，「市場上有年長交易者，也有勇敢交易者，但沒有既年長、又勇敢的交易者。」不採用停損，交易者就註定破產。龜族絕對採用停損。


    對於多數人來說，寧可期待虧損部位能夠轉敗為勝，也不願直接認賠，承認失敗。


    讓我們先釐清一點。斷然認賠是絕對必要的。不願認賠的交易者，就不可能成功（長期而言）。幾乎所有發生失控的金融機構，例如：霸菱銀行、長期資本管理公司與其他，都是聽任交易員不願及時認賠而累積虧損，最終演變為傷及筋骨的損失。


    關於及時停損，最重要者，是在建立部位之前，就必須設定停損點。如果價格觸及停損，交易者就必須出場，沒有其他選擇，一次例外都不能有。關於這點，如果抱著討價還價的心理，遲早會發生災難。'
  - "[PAGE 440]\n\n# # 股價趨勢技術分析（下冊）\n\n# ## 龜族停損\n\n永遠設定停損，並不代表龜族會實際遞入停損單。\n\n由於我們的部位規模很大，不希望因為遞入停損單而洩漏部位資料或交易策略。反之，我們是把停損設定在特定價位，一旦該價位遭到觸及，就必須採用限價單或市價單結束部位。\n\
    \n這些停止價位都不能計價還價。只要停損價位遭到觸及，相關部位就必須出場；沒有任何例外。\n\n# ## 停損設定\n\n龜族根據部位風險程度設定停損。沒有任何一筆交易承擔的風險可以超過2%。\n\
    \n由於1個N的價格走勢，代表帳戶淨值的1%盈虧，如果風險最大不得超過2%，相當於是2個N的價格走勢。所以，龜族多頭部位的停損，設定在進場價位下方的2個N距離，空頭部位停損則設定在進場價位上方的2個N距離。\n\
    \n為了儘量降低整體部位承擔的風險，如果部位加碼，則稍早建立的部位，停損必須調緊 1/2N。這種情況下，整體部位停損位置與新加碼價位之間的距離通常為2個N。可是，新加碼部位如果因為行情變動速度太快或開盤跳空而出現滑移價差，則前述距離將大於2個N。\n\
    \n範例：\n\n+   *   原油\n    *   N＝1.20\n    *   55天期突破＝28.30"
