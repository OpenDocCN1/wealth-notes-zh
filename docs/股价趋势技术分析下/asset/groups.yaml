    # 第33章 圖形戰術評論


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_205_0.png)


    圖220。這是DG呈現的直角三角形震盪排列。價格突破多重頭部之後，出現一波重要漲勢。可是，這只是適合由事後角度觀察的有趣案例，交易者當時很難掌握這個機會。DG分別在1938年、1940年與1942年的A附近完成重要的底部，然後展開多頭漲勢。這份圖形起始於1945年，當時DG已經開始加速上漲，最後於1946年在70之上形成圓形頂（參考圖213）。


    股價由12上漲到20之後，出現大幅的修正。2月底與3月份的第一個星期，股價創多頭市場以來的新高價，然後折返到19～19 1/2支撐區，3月17日當週的漲勢沒有再創新高。10天之後，DG回檔到18
    1/2，收盤價低於前一個小型底部。這個時候，沒有經驗的交易者可能認為這是「雙重頂」而準備賣出，甚至考慮放空。可是，這個型態涵蓋的期間顯然不夠長，兩個峰位之間的回檔走勢也不夠深，完全不符合雙重頂的條件，也不是任何其他可以辨識的反轉型態。另外，由成交量判斷，也沒有出現重要頭部應該具備的大量。


    4月初漲勢出現明確的突破（幅度超過3%），4月18日收盤價為22 7/8。這波漲勢顯然穿越中間的頭部，重新確認上漲趨勢。如果投資者仍然持有股票，當然不該隨便賣出；如果是空手，可以考慮在突破之後的回檔走勢進場。如果把買點設定在21
    1/2支撐，將買不到股票；買點設定在22，獲利則不錯，因為當股價上漲到25 7/8之後，收盤停止賣單將在25 3/4被引發。'
