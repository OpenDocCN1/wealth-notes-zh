    ## 第8版 編輯說明


    修訂一部經典作品，壓力確實很大。關於應該如何修訂，每位批評者或讀者都有意見，包括是否應該不著痕跡地修改作者的原文，假裝作者當時能夠預知未來，讓整本書看起來像是在2000年編寫而不是1948年，其他還包括：編輯錯誤與年份錯誤是否應該保留，或者做註腳，以及其他等等……等等。（我不理解英文作文老師長久以來的抗議，仍然引用馬基最愛使用的「等等……等等」（etc.,
    etc., etc.）因為我喜歡這種好像能夠召喚無限擴張宇宙的感覺）。


    雖然每位讀者都可以有意見，但我相信所有批評者應該都希望在第21世紀，能夠繼續引用這本編寫於第20世紀的技術分析經典作品。


    ## 維持原文的完整性


    大體上，我採用第5版當作原文。令人訝異地，該版原文在格式與文義方面，幾乎完全不需修訂。這主要是因為原文的格式與內容寫得非常清晰，甚至可以說是「好的可怕」，但這種形容詞似乎有些陳腔濫調了。請注意，該版本是編撰於20世紀中期，而且是處理非常複雜的主題，當前的市場複雜程度可能還不到目前的十分之一，所以「好得可怕」是相當貼切的形容詞。該版本的技術言論與分析沒有必要變動或更新。這些文字的目前適當性，就如同1948年的情況一樣。


    雖然保留作者的原意與文字，但我決定重新安排某些章節的位置。對於那些希望學習如何透過手工方式繪圖的初學者，可以在本書最後的附錄內找到適當章節。另外，有關綜合槓桿倍數（Composite
    Leverage）與敏感指數（Sensitivity Index）的章節也是如此。


    ## 明顯的年代問題


    批評者如果不瞭解長期交易成功的關鍵，或許認為討論「1929年發生的事件」或「1946年遠古時代的走勢圖」跟目前的市場毫無關係。這些人可能會指出，AT&T已經不復存在（至少整個結構已經不同了），紐哈芬（New
    Haven）已經下市，很多走勢圖代表的公司早就作古了。這種評論完全忽略走勢圖象徵的意義。股價走勢圖代表的是人們在市場上的行為模式，這些行為很可能明天就會重複發生在某支網絡或高科技股票上。更重要者，這種批評不瞭解過去歷史對於目前交易的重要性。關於這點，容我引用傑克·史瓦格（Jack
    Schwager）在其經典作品《新金融怪傑》（The New Market Wizards）（中文版，請參考寰宇出版公司）內訪問亞爾·懷斯（Al Weiss）的一段問答。「你研究的走勢圖，最久可以回溯到什麼時候？」回答：「各個市場的情況差別很大，而且也要看資料的完整程度。以穀物市場為例，最久能夠回溯到1840年代的图形。」「有必要回溯到那麼早嗎？」「絕對有必要，長期图形分析的目的之一，是瞭解市場在不同經濟循環週期下的不同表現。要找出這些重複發生和持續變動的長期型態，需要很多歷史資料。首先必須確定當時處在經濟週期的那個階段（譬如說，通貨膨脹階段或通貨緊縮階段），這點很重要，因為這樣才能解釋當時演變中的排列型態。」


    ## 辨識原稿與修訂


    此處呈現的是愛德華與馬基當初著述的原文，包括相關的走勢圖與評論在內。本書第5版以來的編者變更與評論，則予以重新安排，如果必要的話，並且特別註明是編者的修訂。


    第8版繼續維持這個政策，但還是依據目前實際環境做必要的內容更新，我的評論都會註明是「編者附註」，新增加添了的插圖也標示為「圖 x.1」或「圖 x.2」。


    ## 絕對必要的修訂


    不久前，我的小兒子聽到我提起「計算尺」，於是問我：「什麼是計算尺？」沒錯，目前距離愛德華與馬基的時代已經很遠了，差距就如同計算尺與計算機一樣。隨著時代變遷，原稿的某些文字已經不恰當或無意義，這些場合必須做些必要的修改。


    對於那些因為時代變遷而過時的評論，我會在註腳說明，或在各章末端特別註明。這些文字都會標示「編者附註」。讀者絕對有必要閱讀這些附註，否則可能會迷航到20世紀。


    某些情況下，這些附註可能整理為新的章節，譬如說，馬基時代不能針對股價指數直接交易。目前，某個股價指數或一籃股票如果沒有選擇權或指數可供交易的話，大約在紐約時間1分鐘之內就會出現（如同每個人瞭解的，紐約的1分鐘只有59秒）。這是本版修訂所要考慮的重大事實。本書前言有詳細的說明。因應新科技與金融環境變化而新增添的章節，都會特別標明，例如：第18-A章（但第23章是例外，該章是完全新增加的）。


    ## 再論必要的修訂


    很多情況下，在少數交易所具有獨佔經營權而能夠控制佣金費率的年代，本書傳遞的資訊還繼續有效，譬如說，經紀商收取的佣金與交易成本。現在，一般書籍已經不適合提供這類的資訊，因為金融資訊變化太快。目前，如果必要的話，應該上網查詢最新的資料。因此，對於這種變化快速的資料，讀者應該上網查詢。


    ## 關於性別


    容我引用我在馬基的《華爾街一般語言學》（Magee''s General Semantics of Wall Street，依據最新流行重新命名）第2版所寫之前言的一段評論：


    > 我是女性主義者。現代男人（某可敬女人的兒子、某賢淑女人的丈夫、可愛女兒的父親）怎麼會不支持女性主義呢？關於語言運用、文法與風格，我的態度相當傳統而單純。所以，採用男性代名詞來代表一般中性對象，關於這種作法，不知道立場與我相同的男人（還有女人）看法如何？


    現代美語使用字典（Dictionary of Modern American Usage）作者表示，「英文有很多兩性通用的一般文字，例如：人（person）、任何人（anyone）、每個人（everyone）或沒有人（no
    one），但也有非共通性別的人稱單數代名詞。所以，我們有他（he）、她（she）與它（it）。一般使用上都採用男性代名詞「他」來代表所有性別的『他』與『她』……某些情況下，代表兩性的男性代名詞如果不太適用的話，英文在這方面的缺陷就暴露出來了。」


    不論適當與否，最好還是採用涵蓋所有性別的代名詞（she/he/it）與其他英文髒話。（「賤種」「bastard」從不用來罵女人，即使這個女人真的是私生女，這點很有趣，不是嗎？）關於男性代名詞的中性用法，我傾向於佛勒（Fowler）的說法，共有三種權宜之計，第一是任何人（他或她）都心裡明白者；第二是任何人（他們）都可以自行琢磨者；第三，任何人（他）都明白者。不得已的情況下，採用第一種；可是，這種用法很笨拙，除非狀態緊急，否則看起來很好笑，而且也有一些故意顯得幽默的味道。第二種是最常見的辦法；強調「man」的原始、真正意義，然後在全然不同的情況下，如果不願冒險採用第三種的話（這是此處建議的用法），努力讓自己看起來像是採用這種用法。至於第三種用法，是在性別不顯得重要的情況下，允許採用男性格式來代表中性對象，用man（人類）來取代man（男人）。


    雖然基本教義派信徒會挑剔，但即使我強調man的原始、真正意義也是如此；所以，凡是泛指一般中性對象者，我都採用男性代名詞。這些文法上的吹毛求疵終究會變得毫無意義，那些不斷在這方面仔細琢磨、藉以取悅文法恐怖份子的人（所謂「人」，我是指男人与女人），將看起來一定很好笑，甚至沒有女人會接受。請問，珍·奥斯丁（Jane
    Austen）又會怎麼做呢？


    ## 有關投資人的性別


    既然談到性別的話題，不妨也順便討論投資人的性別，雖然這些結論沒有科學根據。就我身為交易顧問、老師與理財專家的經驗觀察，我認識的女性投資人，似乎都具有先天的優勢（相較於男人來說）。我見過一些女性賭徒，也認識一些。可是，我沒有在金融市場見過女性賭徒。我認識很多這類的男人。在我的學生與客戶之中，我也發現女人（整體而言）比較具有耐性。所謂的耐性，我是指精明投資人應該具有的耐性。


    以上純屬個人的觀察。我沒有做過深入研究，所以不能談論整體女性，而且我也不認識芭芭拉史翠珊，她據說是不同凡響的投資專家，尤其精通新上市股票。我相信，如果有更多女性政府或警察主管，美國一定會變得更好；同樣地，如果有更多的女性投資人與經理人，社會的數人會愈來愈多。


    ## 重要問題：敏感指數與貝他值


    早在投資市場正是採用貝他值（beta，衡量個別股票相對於整體市場之價格波動程度）之前，馬基與愛德華就採用敏感指數（Sensitivity Index），兩者基本上是相同的東西。讀者如果對這方面運用有興趣，請參考本書附錄D，其中利用貝他值代入「綜合槓桿比率」（Composite
    Leverage）做計算，馬基用以衡量風險水準。關於敏感指數的舊有附錄，則移到附錄A，另外還探討綜合槓桿比率，這兩部分內容都根據目前的金融理論與實務做必要的調整。


    ## 1/8美元與12.5美分


    本版發行的時候，金融界又揚言要改採十進位計算的小數計算股價。過去，股價採用1/8為一檔，因為這種計價方式對於業者比較有利，允許經紀人與專業報價商賺取較大的報價碼差。對於本書與股票交易來說，改採十進位小數報價自然有其重要性。馬基建議停損應該設定在高價或低價外緣的1/8處，追蹤性停止單也採用1/8間隔。改採十進位小數報價之後，究竟會造成什麼影響，我們還不太清楚，心理上的計價單位將是12.5美分、10美分或其他的9美分或11美分，還有待進一步觀察。至於本書的走勢圖，則仍然引用過去版本的計價單位。


    ## 編者代名詞「我」


    讀者將發現，馬基與愛德華都自稱「我們」，而本人則自稱「我」，這應該不會造成混亂，因為他們兩位採用複數的「我們」，本人則採用單數的「我」。至於用「我」來強調「自我」，讀者可以放心，因為在金融市場混了40年，已經沒有剩下多少「自我」了。有關編輯的立場，或許可以引用強詹森博士（Dr.
    Johnson）對於字典編輯者的定義。有些人認為，強森博士的重要性，完全來自於他編輯的字典。「字典編輯者，就是字典的作者。是一份無害而沈悶的工作。」我扮演的角色大概就是如此。


    至於本書的出版公司，認為本版很重要，把本人視為第8版的共同作者之一。對於這種處理，約翰・馬基應該覺得很高興。我們兩個人存在著師生之誼，大師最樂見的，莫過於把法統傳承給熱忱的弟子。


