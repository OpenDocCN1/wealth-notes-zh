    # 第 8 版 序


    一本編寫於20世紀中期的書，到了今天不只還適用，而且還非常重要，確實不尋常。事實上，《股價趨勢技術分析》(中文版第六版，請參考寰宇出版公司）仍然是股票圖形分析方面最權威著作。市面上雖然有很多類似讀物或模仿品，就像海鷗追逐著漁船而想要沾些好處。可是，對於愛德華當初編寫而馬基持續編號到第5版的這本經典著作，那些新發行的書籍完全沒有擴增我們的知識、開拓我們的視野。


    一本書究竟要具備哪些條件，才能成為經典呢？事實上，不只是經典，這是一本適合目前交易使用的手冊。


    回答這個問題之前，還需要考慮另一個問題。什麼是圖形排列（chart formation）？根據本書兩位作者的看法，圖形排列是代表人們在各種複雜市況下的不變行為模式。


    圖形排列透過單一變數（價格）描述各式各樣的人類行為。價格變數展現的影響因素，涵蓋範圍很廣，包括：恐懼、貪婪、慾望、狡詐、惡意、欺騙、純真、盈餘預估、經紀人需要收入、專業經理人需要績效與工作安全、股票供需、貨幣流動性與資金流量、自我破壞、被動、陷'
