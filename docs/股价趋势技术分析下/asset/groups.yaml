    經過價格波動金額調整的部位單位


    龜族採用「單位」來衡量部位規模大小。每個「單位」是讓1個N的金額代表帳戶淨值的1%，換言之，


    單位=帳戶淨值的1%/價格波動金額


    也就是：


    單位=帳戶淨值的1%/N×每點金額


