    # 股價趨勢技術分析(下冊)


    # 過度交易與矛盾現象


    這引發另一個問題。固定百分率的盈與虧，並不代表兩者的金額相等而可以彼此抵銷。這是很值得推敲的嚴肅問題，尤其是那些讓自己過度緊繃的交易者，這方面問題的影響更嚴重（問題雖然都存在，但如果懂得如何規劃，倒也不用太擔心）。


    讓我們探討這個矛盾陳述：相同百分率的盈與虧並不相等。首先，考慮最極端的情況。某個人不論從事什麼投資，都投入全部資本，期待100%的盈或虧。如果第一次投資發生虧損，他將耗盡全部資本。若是如此，他就結束了，因為他既然已經兩手空空，就不能無中生有。反之，假定第一次投資成功，他會連本帶利地做第二次投資。如果第二次投資失敗，他也會被一筆勾消。所以，不論曾經成功多少次，只要一次失敗，就徹底失敗。編者附註：這是「賭徒毀滅心態」的問題，很多作者曾經做這方面的分析，包括倪德厚夫（Niederhoffer）的精彩說明在內（請參考附錄D的相關討論）。（倪德厚夫的相關著作《投機客養成教育》及《倪德厚夫的投機術》請參閱寰宇出版公司）。


    我們想要討論的情況，可能比較沒有那麼極端。換言之，投資人不會讓全部資本承擔風險而期待「變成兩倍或完全沒有」。可是，我們仍然假定投資人相當具有冒險精神，每筆交易都願意承擔40%虧損，藉以換取40%獲利的機會。假定起始資本為$1000，連續發生10次虧損之後，資本只剩下$6（譯按：$0.6^{10}=0.00605$）。現在，假定隨後的10筆交易都很成功。結果會如何呢？經過10次成功與10次失敗之後，每次的盈或虧都是40%，剩餘的總資本將不超過$100。請注意，10次成功與10次失敗的發生順序並不重要，結果都一樣。換言之，投資人可能先遇到10次成功，也可能先是3次成功，然後4次失'
  - '[PAGE 347]


    敗，接著7次成功，最後又6次失敗。總之，結果都相同。經過10次成功與10次失敗，不論成功與失敗的順序如何，結果都會損失90%以上的資本。


    反之，如果整體資本每次都投資20種對象，其中10種的淨獲利8% ，另外10種的淨虧損8%，在10次盈虧之後，總資本只會減少為$937。換言之，原始資本還剩下94%左右（譯按：0.92¹⁰×1.08¹⁰=0.9378≈94%）。所以，對於目前這種情況（就短線交易而言，8%盈虧是相當合理的數據），前述矛盾現象導致的劣勢，每筆交易大約只是1/3%。


    連續10筆交易都失敗的可能性是存在的，雖然發生的可能性很低（編者附註：但完全可以預測）。主要趨勢實際反轉與道氏理論反轉訊號之間，我們見過相隔10個月的例子。沒錯，新趨勢一旦出現之後，可能持續很久，走勢幅度也很可觀，可以彌補先前的損失，並提供不錯的獲利。可是，在這10個月的艱困期間，假定每筆交易都歷經30天，就可能連續發生10筆錯誤的交易，使得起始資本由$1000減少為$434（譯按：0.92¹⁰=0.434）。


    重點是隨後的10筆成功交易，可以把$434又重新拉高到$937；換言之，在8%的基礎上，我們有機會重新調整船舵，駛向正確方向，至於前述的40%基礎，船隻已經沉沒，成為過度交意的犧牲品。


    因此，保持合理的綜合槓桿指數，讓平均律有發揮功能的空間，如此才能掌握數學上的勝算。如此一來，技術分析的相關研究才能找到創造獲利的基礎。否則，只因為過度交易，技術分析就不可能協助我們成功。'
  - '[PAGE 348]


    # 個別股票的綜合槓桿


    我們可以根據這篇附錄第A章（編者附註：第7版的第24章）介紹的方法，計算每支股票的敏感性指數，然後再根據下列方法計算每筆買進或放空交易的綜合槓桿指數：


    +   S代表股票的敏感性指數。


    +   N代表價格正常波動區間（以最初進行交易的價位為準）。


    +   T代表最初交易所支付或收取的總淨額。


    +   C代表該筆交易的自付款。如果現金買進股票或支付100%的保證金放空股票，則這項數據將與分子的T相互沖銷。


    於是，


    綜合槓桿 =  $ \frac{SNT}{15.5 \times C} $


    （請注意，15.5是股價25的正常波動區間，也是我們任意選擇的基準。）


    # 整體交易組合的綜合槓桿


    整體交易組合的綜合槓桿，即是成分股承擔風險的總和，計算公式如下：


    交易組合綜合槓桿 =  $ \frac{Sum\ of\ SNT}{15.5 \times Total\ Capital\ or\ New\ Worth}
    $


    讓我們再看一個更極端的例子，藉以說明綜合槓桿的重要性。假定融資成數為70%，我們可以拿＄1,000現金購買價值＄3,300的高投機性股票ABC。假定ABC當時股價為＄25，根據前述公式計算的結'
