  - '[PAGE 241]


    # 第 37 章 相同的舊有型態


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_241_0.png)


    1月25日星期五，價格夾著大量跌破支撐。雖然當天收盤價買穿幅度不大，但排列的技術型態明顯惡化，還是應該立即賣出股票。下降三角形具有空頭意涵，即使在突破之前也是如此。突破之後，價格完全沒有向上拉高。因為我們不能仰賴突破之後的拉高走勢，所以最安全的做法是立即賣出，或當價格跌破型態時，立即根據收盤價設定逐次停止單（就目前這個例子來說，跌破型態需要考慮除息金額）。


    請注意1月底暴跌走勢的大成交量。一般來說，重要跌勢不一定需要配合大成交量，但如果經過成交量確認，走勢的意義更顯著。


    問題：由這份走勢圖判斷，1月底的股價，是否代表TXT很便宜了？各位是否會因為下列理由而買進：「股價不可能再跌了」、「應該反彈了」或「股價遠低於實際價值」。


    假定TXT確實出現技術性反彈，各位認為反彈走勢可以回升到什麼程度？難道預期股價可以在短期之內向上穿越20嗎？1957年1月底，各位認為整個盤面呈現多頭格局嗎？'
  - '[PAGE 242]


    # 圖形不完全相同


    絕大部分股票雖然都會反映大盤走勢，但在時間上與程度上則為必相同。某些股票可能不理會大盤，呈現獨特的走勢。1920年代曾經出現大多頭走勢。然後，1929年10月發生恐慌性跌勢。可是，這種說法並不涵蓋所有股票，某些個股出現截然不同的走勢。如果持有平衡而分散的投資或交易組合，可以避免不必要的損失。


    我們曾經研究676支股票在1924～35年期間的走勢，其中只有184支股票的多頭市場峰值是發生在1929年8月到10月之間，並在該年的10月與11月出現重大跌勢。事實上，有262支股票的主要下跌趨勢發生在1929年之前。總共有181支股票的多頭市場峰值，發生在1929年最初9個月內，主要跌勢在夏天結束之前已經展開。其中有5支股票的跌勢開始於1929年之後；44支股票在1929年之後還繼續創新高。此處所列舉的3支股票，在1927～30期間有著非常不同的走勢。'
