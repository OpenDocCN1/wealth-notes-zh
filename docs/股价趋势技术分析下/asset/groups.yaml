    就這方面來說，繪圖功能可以透過相當昂貴的電腦軟體來完成，但也可以採用一些免費軟體。網路上也提供一些互動式的繪圖軟體。除了基本的長條圖之外，套裝軟體還可以提供很多技術分析工具，例如：移動平均、攤盪指標，以及其他等等。可是，這也造成一些危險。圖形分析本身屬於定性分析。在很多計量導向的資料圍繞下，一般投資人可能會迷失方向，產生困惑而不能做決定。


    所以，圖形分析者的首要任務，就是讓整個過程儘可能保持單純。取得資料。繪製走勢圖。分析型態排列。考慮成交量。繪製一些協助分析的線條。這些工作通常可以直接透過電腦程式在螢幕上進行，但最好是把圖形印製出來，然後用手工方式繪製趨勢線。這段評論也凸顯出多數套裝軟體的問題所在：螢幕上的圖形很差，至少對於老派的分析者而言是如此，很容易造成分心。尤其過去習慣採用Teknplat繪圖紙的分析者，非常不習慣看電腦螢幕。關於這個問題的解決辦法，請參考附錄D。（第
