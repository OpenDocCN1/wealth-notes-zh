    # 附錄 E


    相關程度高的市場包括：熱燃油 & 原油；黃金 & 白銀；瑞士法郎 & 德國馬克；國庫券 & 歐洲美元……等。


    相關程度低的市場：彼此相關程度很低的市場，任何特定方向的總部位不得超過10單位。相關程度低的市場包括：黃金 & 銅；白銀 & 銅；很多穀物組合（由於部位限制的問題，龜族沒有交易穀物）。


    單一方向：單一方向的多頭或空頭部位，單位總量不得超過12個。所以，每個人頂多可以持有12單位多頭部位，以及12單位空頭部位。


    龜族用「裝滿」來形容某層級風險已經到達高限。譬如說，「裝滿日圓」代表日圓部位已經到達4單位高限。「完全裝滿」代表持有12單位部位。


    # 調整交易大小


    市場往往會連續好幾個月沒有明確的趨勢。若是如此，帳戶淨值可能會發生相當嚴重的耗損。


    重大獲利部位平倉之後，帳戶淨值也會增加，可以用來調整部位。


    龜族不採用起始淨值計算的常態帳戶。我們都採用某特定帳戶大小而起始淨值為零的名目帳戶。舉例來說，當我們在1983年2月開始進行交易的時候，很多人都得到一個 $
    1,000,000 的名目帳戶。每年的年初，帳戶規模都會調整，通常是根據理查的主觀判斷，帳戶調整大體上會反映前一年交易的績效。


    如果損失到達起始帳戶的10%，名目帳戶規模會向下調整20%。所以。假定某龜族原來的帳戶規模為 $ 1,000,000，如果發生10%或 $ 100,000
    的損失，則名目帳戶將減少為 $ 800,000，直到隔年重新調整'
  - '[PAGE 436]


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_436_0.png)




    為止。如果又虧損10%（換言之，＄800,000的10%，也就是＄80,000，總損失累積為＄180,000），帳戶大小又往下調整20%，名目帳戶大小只剩下＄640,000。


    如何根據帳戶盈虧來調整淨值，或許還有更好的辦法，但龜族採用的規定就是如此。


    # 第4章 進場


    龜族採用兩種相關的系統進場，兩者都建立在董誼（Donchian）的通道突破系統之上。


    談到交易系統，絕大多數人都會馬上想到進場訊號。他們相信，交易系統的最重要功能，就是提供進場訊號。


    對於這些人來說，他們可能會覺得很訝異，龜族採用非常簡單的進場訊號，兩者都是取自理查·董誼的通道突破系統。


    龜族採用兩套不同而相關的突破系統，分別稱為系統1與系統2。我們可以隨意決定採用哪套系統。某些人完全採用系統2，另一些人則把資金分為50－50%（或其他組合）而分別採用系統1與系統2。


    系統1：屬於短期系統，運用20天期突破。


    系統2：屬於較長期系統，運用55天期突破。


    # 突破


    所謂「突破」，是指價格穿越某特定天期的最高價或最低價。所以，如果採用20天期突破系統，只要價格穿越最近20天的最高價或最低價，就視為突破。


    龜族都是在盤中價格出現突破的時候，立即採取行動，不會等到'
  - '[PAGE 437]


    # 附錄 E


    收盤或隔天開盤。對於開盤跳空缺口，如果開盤時段出現突破，龜族在開盤進場建立部位。


    系統1進場——如果盤中價格穿越最近20天的最高價或最低價，即使穿越程度只有1檔，龜族也會進場建立部位。如果價格穿越最近20天的最高價，龜族進場買進1單位，建立相關商品的起始多頭部位。反之，如果價格跌破最近20天的最低價，龜族進場放空1單位，起始建立空頭部位。


    如果最近的突破曾經導致獲利，則忽略這次的系統1突破進場訊號。附註：就這個檢定來說，最近突破是指特定商品最近發生的突破，而不論該突破訊號被接受，或是否因為目前這個規定而被忽略。突破訊號被接受之後，在價格還沒有到達10天期獲利了結價位之前，如果朝相反方向出現2個N的走勢，則視為失敗部位。


    最近突破的方向與這個規定無關。所以，失敗的多頭突破或失敗的空頭突破，其引發的新突破將被視為有效進場訊號，不論突破方向如何（可以建立多頭或空頭部位）。


    可是，如果因為前一筆交易成功而造成系統1突破進場訊號被忽略，則要根據55天期突破訊號進場，避免錯失主要走勢。這個55天期突破被視為「萬全突破點」（Failsafe
    Breakout point）。


    任何時候，如果我们停留在場外，總有某個價格會引發放空進場訊號，並有不同而更高的價格引發買進訊號。如果前一次突破訊號造成虧損，相較於前一次突破訊號造成獲利來說，新的進場訊號會更接近目前價位（換言之，20天期突破）；如果前一次突破訊號造成獲利，則新的進場點會距離目前價格更遠（在55天期突破位置）。


    系統2的任何突破訊號都必須接受，不論前一個突破訊號成敗與否。'
  - "[PAGE 438]\n\n突破進場訊號發生當時，龜族建立1個「單位」的部位，當價格距離起始成交價格1/2N，再加碼1個「單位」。請注意，所謂的1/2N是由實際成交價位起算，不是由訊號位置起算。譬如說，如果成交價格出現1/2N的滑移價差，則加碼價位與訊號價位之間的距離將是1整個N。\n\
    \n# 加碼\n\n加碼將持續到特定市場允許持有的最大「單位」數量。如果行情移動速度夠快，很可能在一天之內就持有最高的4單位。\n\n# 範例：\n\n黃金\n\
