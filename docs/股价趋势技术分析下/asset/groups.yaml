    基礎上提供建議……。這個紀錄本身很不理想，如同《拜倫週刊》(Barron''s）在6月4日文章上提到的，對於道瓊工業指數的30支成分股來說，即使會計年度已經結束，盈餘預測仍然有18%的誤差，隔年盈餘預測則有54%的誤差。可是，真正的致命關鍵在於一項假設：正確的盈餘預測，能夠篩選真正的股票贏家。根據先前提到的《拜倫週刊》文章，購買道瓊工業指數盈餘預測最佳的10支股票，10年累積獲利為40.5%，但如果買進盈餘預測最差的10支股票，同期獲利為142.5%。」


    普烈西特採用的技術分析方法不同於我們，但他對於基本分析的看法，我們則非常認同。


    # ## 第8節 套件軟體與技術分析網站


    最早的人類，只能赤手空拳爭取生存。等到某個聰明人找到一支適合戰鬥的木棍，人類鬥爭從此踏入另一階段。無知、傲慢的交易者，大聲嘲笑懷可夫（Wyckoff）的股價走勢圖。當布萊‧胡爾開始採用各種報表從事選擇權交易，太平洋選擇權交易所的造市者都抱著看笑話的態度。最初，採用木製網球拍的選手們，看到合成碳纖維球拍都深惡痛絕。


    情況不再如此了。最後採用新武器的人，都是死人。價格走勢圖能夠展現其力量，胡爾的B-S選擇權訂價模型報表也是如此。輸家很快就發現，他們需要新武器。我準備在此討論一些我個人最喜愛的武器：套件系統與網站。當然，我提供的資訊絕對不完整。另外，我的選擇只是不過反映我個人的喜好，並不代表其他的軟體或網站不值'
