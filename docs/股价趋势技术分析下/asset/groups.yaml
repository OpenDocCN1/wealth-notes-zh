  md: "\n# 股價趨勢技術分析（下冊）\n\n旗形經常發生在這類走勢的中央，也就是所謂「旗形飄揚在旗桿中央」。投機性漲勢如果出現旗形整理，當價格向上突破旗形排列之後，通常至少會複製一段先前的漲勢。第二段漲勢之後，可能出現另一個旗形整理，並繼續上漲。當然也可能不會。經過兩波段的這類走勢之後，最好退場，剩下的錢讓別人賺。只要觀察足夠多的走勢圖，涵蓋足夠長的期間，將發現很多這類完美的排列。當然也有一些失敗的例子。可是，由於成功案例蘊含的獲利可觀，所以每當飆漲走勢之後出現整理排列，我們往往就會忍不住進場。這類情況必須有嚴格條件配合：先前出現令人難以置信的直線狀漲勢，隨後出現成交量很低的狹幅盤整。如果狹幅整理或回檔整理超過3個星期，最好賣掉股票；這很可能屬於失敗案例。\n\
    \n前述情況當然也會發生在急跌走勢，交易上也可以「如法炮製」。第12章曾經深入討論跳空缺口的衡量意涵。逃逸缺口（連續缺口）是唯一具有預測意義的跳空缺**口**。這類缺口發生在快速走勢過程，大約可以代表整段走勢的中點位置；如果發生兩個或以上的逃逸缺口，需要根據成交量與先前走勢幅度來評估可能的中點位置，然後衡量可能的目標價位。\n\
    \n其他一些型態也具有衡量目標價位的功能，精確程度則各自有別。可是，整體來說，衡量目標價位的最理想工具，是趨勢線、支撐／壓力，以及重要的成交量訊號。\n\n\
    第9版附註：關於目標衡量，我的態度始終很謹慎。如果衡量目標不至於讓交易者沈迷於預期，並因此而忽略實際走勢透露的訊息，那就沒有關係。所以，做為一種簡單的參考工具，衡量目標確實有些用途。當價格抵達衡量目標時，永遠要觀察當時的實際情況。唯有這個時候、在這裡才可以擬定決策，而不是在先前衡量目標的時候。\n\
    \n## 第33章 圖形戰術評論\n\n### 道氏理論\n\n自從道瓊指數正式開始使用以來，如果根據每個道氏理論主要多頭市場訊號（參考第3、與5章），買進代表性股票組合，然後根據隨後的主要空頭市場訊號賣出股票，多年以來的績效非常可觀（編者附註：請參考第5章與第5—A章的表格）。雖然這些表格沒有包括放空股票（第9版附註：本版考慮放空股票在內），但我們也可以根據每個主要空頭市場訊號放空股票，然後根據隨後的主要多頭市場訊號回補。就道瓊工業指數來說，如果由多、空兩邊進行操作，總獲利是很傑出的（第9版附註：買進—持有到2004年的總獲利為$39,685.03。按照道氏理論只由多邊操作的總獲利為347,895.51。按照道氏理論多、空操作的總獲利$1,914,490）。\n\
    \n對於每位投資者或交易者來說，這份紀錄代表非常重要的意涵。我們準備藉此機會做簡短的評論。\n\n可是，評論之前，我們要指出，很少投資人能夠確實按照道氏理論的每個訊號進行操作。\n\
    \n首先，這方面的評估，需要假定投資人有很長的交易生涯，而且從一開始就接受正統的道氏理論，信念從來沒有動搖，相關定義與交易方法也始終不變，整段期間都沒有抽離資本。\n\
    \n其次，我們一方面假定這位投資人具有無比的勇氣，當主要趨勢似乎嚴重威脅其部位時，仍然堅持道氏理論的訊號；另一方面，假定他具有無比的耐心，能夠忍耐長達幾個月的沈悶走勢，整個市場趨勢似乎陷入停頓。\n\
    \n最後，假定投資人買進或賣出的股票，能夠確實反映道瓊工業指數的表現。事實上，如果投資組合足夠分散，這個假定大體上應該可以成立。\n\n我們雖然提出許多假定，要求這位投資人必須符合種種條件，然後才能算是嚴格的「道氏理論」交易者。可是，就實際交易來說，我們當然不建議任何人一成不變地遵循這類計畫。編者附註：由目前回顧，為什麼不這麼做呢？處在網路時代，以及目前可供運用的各種交易工具\
    \ (DIA、SPY) ，這實際上是很不錯的點子。在馬基時代，這類操作很麻煩，成本也很昂貴，但現在則完全可行。\n\n總之，此處談論的重點是：如果大盤指數的紀錄，顯示主要趨勢訊號可以提供可觀的長期理論性獲利，而且大盤指數是由許多成分股構成，我們就可以根據大盤指數的主要趨勢，買賣代表性股票而獲利。根據證據顯示，主要趨勢通常會延伸好幾個月或好幾年。因此，「最可能的獲利」是順著主要趨勢操作。\n\
    \n在這個基礎上，我們可以相當合理歸納出一個結論：如果發生某重要趨勢而足以讓大盤指數產生主要訊號，則順著該趨勢發展之個別股票提供的交易機會，應該多於逆勢發展的股票。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_189_0.png)\n\n圖211. 頭肩頂排列。1941年到1946年的多頭行情，SX股價由8上漲到70，最後在1946年6月形成頭肩頂排列。請注意左肩的大成交量，頭部與右肩的成交量逐漸減少。7月15日發生有效突破，多頭部位應該立即按照市價賣出（大約在63附近），不應該繼續等到停止單被引發（大約在61附近）。7月底，在突破走勢的低點58\
    \ 1/2附近，成交量再度放大，這恰好是頭肩頂排列突破的最低衡量目標。\n\n由這個低點開始，價格展開4個星期的弱勢反彈（成交量很少）。由弱勢技術結構判斷，反彈過程適合放空，位置可以挑選右肩到低點之距離的40～50%，或在頸線附近（例如：63附近）。結果，反彈走勢一度觸及頸線（64），然後出現向下跳空缺口，成交量明顯放大，隨後3個月內，價格下跌到40之下，後來跌得更深。\n\
    \n頭肩頂型態有一個特色，其規模經常不大（例如目前案例），但足以引發一波主要走勢，期間可能長達幾個月或幾年。當然，並不是所有頭肩頂都會造成目前這個例子的重大後果，但只要發生頭肩頂排列，就絕對不可以掉以輕心。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_190_0.png)\n\n讀者或許應該重復閱讀前一段內容，這意味著我們並不嘗試在多頭市場「賣在最高價」，也不試圖在空頭市場「買在最低價」。我們不會故意逆勢而為，因為根據歷史資料顯示，主要趨勢通常會持續很長一段期間。\n\
    \n此處所強調的立場，與前幾版內容並沒有太大差別。請注意，我們並沒有說投資人絕對不可以在多頭市場放空股票，也沒有說不能在空頭市場做多股票。確實有很多股票的走勢，是逆著主要趨勢發展，就這些股票的技術面結構來說，或許有理由逆著大盤的趨勢進行操作。\n\
    \n可是，我們覺得，這類交易必須非常謹慎，投資人必須充分了解，絕大部分股票是呈現相反趨勢。舉例來說，我们可以針對部分個股的技術型態，建立逆勢部位，並以此做為整體交易組合的避險。假定多頭行情已經持續數年之久，而且推定繼續有效，但某些個股出現明顯的空頭走勢。對於這種情況，交易者或許可以繼續持有四分之三的多頭部位，但把剩餘的四分之一資金用來放空疲弱的個股。如果多頭行情持續發展，這些空頭部位或許必須認賠，但這部分虧損可以視為合理的避險成本。另一方面，如果整體大盤走勢轉弱，最後演變為主要趨勢反轉，則空頭部位的獲利，可以彌補反轉訊號發生之前的多頭部位損失。（第9版附註：這是編者主張的「自然避險」理論。現代股票市場的結構相當複雜，風險部位與避險部位實際上都可能同時獲利，這也是交易者希望達成的目標。）\n\
    \n除了大盤指數之外，如果還採用評估指數（Evaluation Index，參考第38章），則可能認定市場的多頭成分為60%或55%，而不是單純的兩分法。這可以反映一項事實：各種行情具備的多、空氣勢各自不同，投資人應該自行調整多、空組合，不需採用「黑白分明」的立場。（第9版附註：我稱此為「韻律交易」，Rhythmic\
    \ Trading。）\n\n請注意，投資人雖然可以逆著（推定的）主要趨勢建立某些部位，**待**大部分資金還是應該順著主要趨勢方向操作。換言之，投資組合絕大多數屬於順勢部位，建立任何逆勢部位都應該有所體認，這只是一種保險措施，這些部位很可能會被追認賠。\n\
    \n讓我們把前述討論的重要內容摘要整理如下：\n\n- 投資組合的絕大多數部位，不可逆著主要趨勢。\n- 在多頭行情很可能發生反轉的潛在期間內，可以逐漸降低多頭部位的比率，針對少部分技術結構疲弱的股進行放空；不要嘗試猜測大盤的主要頭部或主要底部位置，千萬不要逆著主要趨勢而「孤注一擲」。\n\
    \n### 頭肩頂排列\n\n- **A. 多頭部位。** 如果價格有效跌破頸線（收盤價穿越程度至少為3％），隔天早晨將停止單設定在最近收盤價下側1/8點處。停止單當天如果沒有被引發，繼續採用收盤價停止單，每天都把停止點設定在最近收盤價下方1/8點處。\n\
    - **B. 突破之後。** 如果價格拉回頭線附近，可以進行放空，放空價位取下列兩者先出現者：計算「右肩」峰位與突破點之間的距離，當反彈走勢到達此距離的40%位置，或反彈走勢觸及「頸部」與「右肩」銜接的延長線。價格突破頸線之後，如果繼續下跌一天或數天，反彈40%是根據右肩峰位到最低點的距離計算。\n\
    \n### 頭肩底排列\n\n編者附註：編者始終不習慣「頭肩底」的名稱，所以主張將此名稱改為「基洛伊底部」（the Kilroy Bottom），請參考圖23.1。\n\
    \n- **A. 空頭部位。** 價格如果夾著大量突破頸線，收盤價貫穿幅度至少為 3%，隔天早晨將停止單設定在收盤價上方 1/8 點處。停止單當天如果没有被引發，繼續採用收盤價停止單，**每**都把停止點設定在最近收盤價上方\
    \ 1/8 點處。\n- **B. 突破之後。** 如果價格折返頸線附近，可以做新的買進（價格回檔必須量縮），買點取下列兩者先出現者：計算「右肩」谷底與突破點之間的距離，當回檔走勢到達此距離的\
    \ 40% 位置，或回檔走勢觸及「頭部」與「右肩」銜接的延長線。價格突破頸線之後，如果繼續上漲一天或數天，反彈 40% 是根據右肩谷底到最高點的距離計算。\n\
    \n### 複雜或多重頭肩排列\n\n戰術運用與簡單頭肩排列相同。關於這些排列的定義與說明，請參考第 7 章。\n\n### 圓形頂與圓形底\n\n在趨勢緩慢變動的過程，我們很難提出明確的交易法則。就圓形頂來說，當排列逐漸形成，涵蓋好幾個星期，價格由逐漸上升，轉變為緩慢下降，成交量在頭部位置縮小，在跌勢過程開始放大。一旦前述技術結構明朗化之後，多頭部位應該賣出股票。在圓形頂排列放空股票，獲利潛能很高；但我們不能提出明確的交易法則或基準點，只能強調一點：任何放空行為都必須確定圓形頂已經完成。圓形頂必須發生在延伸性漲勢之後，排列本身涵蓋好幾個星期的期間。另外，空頭部位必須在排列頭部的稍上方設定停損（參考第\
    \ 27 章）。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_193_0.png)\n\n圖 212. 1945年，BNF形成頭肩底排列。嚴格來說，這是多頭市場次級修正走勢過程發生的頭肩底連續排列。如果是主要底部（由主要空頭趨勢轉為主要多頭趨勢），通常需要耗費更長時間。\n\
    \n排列過程，左肩成交量相當大，頭部成交量稍微縮小，右肩成交量顯著縮小。9月21日，當價格向上突破頸線，成交量明顯放大。突破之後，價格由頸線拉回，成交量縮小，提供一個很理想的買進機會（大約在23）。價格回升之後，第二次向頸線拉回，這算不上異常。10月19日收盤價為22\
    \ 3/4，低於前一個小型底部，而且成交量放大，情況有些不妥。可是，就整個排列的技術結構與強勢突破來判斷，似乎沒有理由賣出股票，設定在21 7/8的停損單也沒有受到威脅。10月25日，價格出現跳空缺口、恢復上升走勢，而且漲勢持續到29\
    \ 1/2；這波走勢的端點，先是出現竭盡缺口，然後是單日反轉。\n\n請留意小型頭部29 1/2之後的發展，BNF發生長達3個星期的整理，構成上升三角形排列，向上突破之後，價格上漲到37\
    \ 1/2。另外，請注意（不妨讓我們「物盡其用」，充分發揮這個範例的功能），上升三角形大約位在整段漲勢的中點，快速走勢的中點，經常出現整理排列。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_194_0.png)\n\
    \n圖213. DG多頭市場趨勢發生圖形頂排列。這份日線圖涵蓋1946年最初的6個月。\n\nDG股價在31/2年內，由4上漲到72。由月線圖觀察，整個漲勢呈現平滑而加速發展的曲線，起點是1938年到1942年的5年期底部排列。現在，讓我們觀察最後峰位發生之前的6個月走勢，首先注意1月份與2月份的線形排列。DG在1945年最後一季出現快速上漲走勢，照道理應該有一段整理行情或次級修正。當價格上漲到48之後，回檔到45，接著上漲到50\
    \ 1/2與51，最後挺進到52，然後在2月底回檔到44。如果1月22日的價格更低一些，收盤價低於1月3日的低價，而且2月26日的收盤價更低一些，我們就認為1~2月份的走勢完成擴張頂排列，代表明確的反轉訊號。可是，整個排列畢竟不完整，所以不屬於有致的擴張頂，但情緒化價格走勢已經顯露疲態。\n\
    \n多頭行情的最後階段，一般投資大眾經常會瘋狂買進，造成噴出行情。目前這個例子就是如此。3月25日出現5點的突破缺口，價格繼續挺進到63 1/2，稍做回檔之後，又跳到68以上。\n\
    \n由此處開始，漲勢的步伐變得很沉重，趨勢逐漸下滑，出現一系列的「頭」與「肩」，峰位附近成交量萎縮。6月4日，價格跌破6月7日的小型底部之後，成交量增加，顯示圖形頂已經完成。如果手中還持有股票，應該賣出。6月18日，當「頸線」被貫穿之後，型態已經無庸置疑了。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_195_0.png)\n\n圖 214. 灰狗巴士發生在 1945 年的圓形底，這是\
    \ 5 月份上漲到 29 之後形成的連續排列，低點支撐在 24，也是 1944 年的高價。\n\n7 月份的跌勢，成交量相當大，但 8 月份成交量顯著萎縮，8\
    \ 月 10 日曾經出現突兀線形，成交量遽增，但隨後又陷入沈悶走勢。\n\n8 月份與 9 月份的許多小型波動，完全不適合進行交易。8 月 31 日曾經創排列內的新高價，意味著上升趨勢，9\
    \ 月 19 日與 20 日也是如此，價格推升到 26。可是，這還稱不上是結論性的發展。\n\n10 月 13 日前一週的走勢比較明確，價格夾著大量走出「碗底」。漲勢雖然稱不上凌厲，但趨勢方向很清楚。價格回檔之後，應該尋找買點，位置可以設定在排列低點以來整段漲勢的\
    \ 40～50% 折返，或在 26 支撐附近。實際買點可能在 26 1/2 附近。請注意，回檔走勢的成交量縮小。\n\n漲勢隨後直接挺進到 30，創多頭市場以來的新高價。11\
    \ 月 3 日週末爆出大量，收盤價為 30。由於這筆巨量並非發生在突破過程，因此星期一早晨把停止單調整到 29 7/8 準備出場（除非我們決定等待次一波漲勢，願意在隨後拉回走勢繼續持有部位）。\n\
    \n兩個星期之後，當價格折返到合理支撐水準，我們在 29 附近再度進場（不能期待最低價），次一波漲勢在 2 天之內上漲到 34 1/4。這個時候，多頭部位可以獲利了結，或改為長期持有。最後，股價上漲到\
    \ 54 才結束整個多頭行情。\n\n圓弧形排列過程，一般人不會持有空頭部位。在漫長而平緩的圓弧形走勢過程，交易非常沈悶，成交量極度萎縮；接著，交投突然轉趨熱絡。這種情況下，即使不幸持有空頭部位，也應該立即回補。至於買進方面，在整個沈悶而漫長的走勢過程，應該等待第一波突發大量。當走勢出現向上的突兀線形，價格隨後幾乎一定會拉回，應該在拉回過程進場。\n\
    \n### 等腰三角形\n\n- **A. 持有部位。** 等腰三角形排列過程，投資人或許沒有辦法改變部位。假定我們是在多頭走勢的回檔過程買進股票，次一波漲勢不能創新高，但小型頭部也沒有發生成交量賣出訊號。次一波折返走勢低點，價位高於前一個小型底部。所以，我們被「套在」三角形排列之內，多頭部位不適合賣出，因為價格可能突破而朝原先趨勢方向發展（事實上，等腰三角形屬於連續排列的可能性較高）。如果價格確實向上突破（當然必須夾著大量），可以考慮先獲利了結（根據前文已經討論的交易法則），然後在回檔過程重新進場。\n\
    \  - 如果收盤價向下突破（不論成交量是否放大），隔天早晨在收盤價下方 $1 / 8$ 點處設定停止單；如果停止單沒有被引發，隨後每天按照最近收盤價設定逐次停止單，直到出場為止。\n\
    \  - 如果持有空頭部位，前述法則也適用（方向當然相反），但向下突破不需經過成交量確認，向上突破则需要配合大量。\n- **B. 空手。** 不要在等腰三角形排列過程進場，等待有效突破。如果價格向上突破，而且主要趨勢向上，在次一個回檔走勢進場買進。如果價格向下突破，而且主要趨勢向下，在次一個**反彈走勢進場放空**。前文已經討論這類部位的交易法則。\n\
    \n附註：如果等腰三角形持續發展，突破的發生位置過於接近三角形頂點，則視為無效突破。最可靠的突破，應該發生在排列過程的**三分之二**位置附近。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_197_0.png)\n\
    \n等腰三角形排列。這是LS在1946年跌勢之後發生的連續排列。請注意9月10日第一個反轉點，當天曾經發生大量，然後排列內的成交量顯著萎縮。就圖及圖來說，這類型態稱為「鐘擺」，因為形狀就像鐘擺。對於有效的三角形排列，雖然反轉點的成交量會稍微增加，但整個型態還是應該呈現量縮的傾向。\n\
    \n這個時候，如果不幸持有LS多頭部位，應該把停止點設定在33¹/₈，相當於型態低點36下側的8%。可是10月4日與5日（星期五與星期六），價格有效突破排列，雖然成交量沒有擴大（請記住，向下突破不需成交量確認），可以在星期一開盤根據市價結束多頭部位，價格大約是38¹/₂。可是，如果打算建立空頭部位，收盤價至少必須到達三角形外側的3%。隨後，價格夾著少量回升到40（三角形下限邊緣），然後在10月9日與10日夾著大量展開真正跌勢。\n\
    \n向下突破的有效性，全然無庸置疑。反彈過程，空頭部位可以建立在三角形下限附近，或在突破跌勢的40～50%反彈位置（大約是38¹/₂～39）。反彈走勢曾經挺進到三角形頂點，然後一路下跌到33；10月30日發生賣壓高潮，形成單日反轉，這也是空頭部位獲利了結的訊號。\n\
    \n請注意8月份的小型頭肩頂型態，這是下跌跌勢的連續排列，構成反彈走勢的頭部，然後出現9～11月份的重挫跌勢。\n\n### 直角三角形\n\n等腰三角形的相關法則，也同樣適用於直角三角形（請參考三角形排列的相關章節）。就如同等腰三角形的情况一樣，較早發生的突破，通常比較可靠。上升三角形的向上突破，需要成交量確認，但下降三角形的向下突破，並不需大量配合。已經持有的部位，將保留到突破發生為止，然後部位按照正常方式了結。\n\
    \n由於上升與下降三角形可以預先顯示突破的可能方向，這與等腰三角形不同，所以新部位可以建立在上升三角形的回檔走勢，或下降三角形的反彈過程。可是，我們不清楚直角三角形水平邊界代表的供給或需求數量，這類三角形還是可能朝反方向突破，所以最好還是在有效突破發生之後，才建立新部位。\n\
    \n### 擴張頂排列\n\n照道理說，擴張頂排列過程內，通常不會持有多頭部位。如果遵循趨勢線戰術法則，遠在排列完成之前，最早的反轉就應該促使投資人結束多頭部位。排列過程中，交易者應該也不會試圖買進，因為當時呈現的趨勢顯然不利於多頭部位。\n\
    \n反之，擴張頂排列完成之後，則代表很理想的放空機會。當價格"
  mdcn: "\n# 股價趨勢技術分析（下冊）\n\n旗形經常發生在這類走勢的中央，也就是所謂「旗形飄揚在旗桿中央」。投機性漲勢如果出現旗形整理，當價格向上突破旗形排列之後，通常至少會複製一段先前的漲勢。第二段漲勢之後，可能出現另一個旗形整理，並繼續上漲。當然也可能不會。經過兩波段的這類走勢之後，最好退場，剩下的錢讓別人賺。只要觀察足夠多的走勢圖，涵蓋足夠長的期間，將發現很多這類完美的排列。當然也有一些失敗的例子。可是，由於成功案例蘊含的獲利可觀，所以每當飆漲走勢之後出現整理排列，我們往往就會忍不住進場。這類情況必須有嚴格條件配合：先前出現令人難以置信的直線狀漲勢，隨後出現成交量很低的狹幅盤整。如果狹幅整理或回檔整理超過3個星期，最好賣掉股票；這很可能屬於失敗案例。\n\
    \n前述情況當然也會發生在急跌走勢，交易上也可以「如法炮製」。第12章曾經深入討論跳空缺口的衡量意涵。逃逸缺口（連續缺口）是唯一具有預測意義的跳空缺**口**。這類缺口發生在快速走勢過程，大約可以代表整段走勢的中點位置；如果發生兩個或以上的逃逸缺口，需要根據成交量與先前走勢幅度來評估可能的中點位置，然後衡量可能的目標價位。\n\
    \n其他一些型態也具有衡量目標價位的功能，精確程度則各自有別。可是，整體來說，衡量目標價位的最理想工具，是趨勢線、支撐／壓力，以及重要的成交量訊號。\n\n\
    第9版附註：關於目標衡量，我的態度始終很謹慎。如果衡量目標不至於讓交易者沈迷於預期，並因此而忽略實際走勢透露的訊息，那就沒有關係。所以，做為一種簡單的參考工具，衡量目標確實有些用途。當價格抵達衡量目標時，永遠要觀察當時的實際情況。唯有這個時候、在這裡才可以擬定決策，而不是在先前衡量目標的時候。\n\
    \n## 第33章 圖形戰術評論\n\n### 道氏理論\n\n自從道瓊指數正式開始使用以來，如果根據每個道氏理論主要多頭市場訊號（參考第3、與5章），買進代表性股票組合，然後根據隨後的主要空頭市場訊號賣出股票，多年以來的績效非常可觀（編者附註：請參考第5章與第5—A章的表格）。雖然這些表格沒有包括放空股票（第9版附註：本版考慮放空股票在內），但我們也可以根據每個主要空頭市場訊號放空股票，然後根據隨後的主要多頭市場訊號回補。就道瓊工業指數來說，如果由多、空兩邊進行操作，總獲利是很傑出的（第9版附註：買進—持有到2004年的總獲利為$39,685.03。按照道氏理論只由多邊操作的總獲利為347,895.51。按照道氏理論多、空操作的總獲利$1,914,490）。\n\
    \n對於每位投資者或交易者來說，這份紀錄代表非常重要的意涵。我們準備藉此機會做簡短的評論。\n\n可是，評論之前，我們要指出，很少投資人能夠確實按照道氏理論的每個訊號進行操作。\n\
    \n首先，這方面的評估，需要假定投資人有很長的交易生涯，而且從一開始就接受正統的道氏理論，信念從來沒有動搖，相關定義與交易方法也始終不變，整段期間都沒有抽離資本。\n\
    \n其次，我們一方面假定這位投資人具有無比的勇氣，當主要趨勢似乎嚴重威脅其部位時，仍然堅持道氏理論的訊號；另一方面，假定他具有無比的耐心，能夠忍耐長達幾個月的沈悶走勢，整個市場趨勢似乎陷入停頓。\n\
    \n最後，假定投資人買進或賣出的股票，能夠確實反映道瓊工業指數的表現。事實上，如果投資組合足夠分散，這個假定大體上應該可以成立。\n\n我們雖然提出許多假定，要求這位投資人必須符合種種條件，然後才能算是嚴格的「道氏理論」交易者。可是，就實際交易來說，我們當然不建議任何人一成不變地遵循這類計畫。編者附註：由目前回顧，為什麼不這麼做呢？處在網路時代，以及目前可供運用的各種交易工具\
    \ (DIA、SPY) ，這實際上是很不錯的點子。在馬基時代，這類操作很麻煩，成本也很昂貴，但現在則完全可行。\n\n總之，此處談論的重點是：如果大盤指數的紀錄，顯示主要趨勢訊號可以提供可觀的長期理論性獲利，而且大盤指數是由許多成分股構成，我們就可以根據大盤指數的主要趨勢，買賣代表性股票而獲利。根據證據顯示，主要趨勢通常會延伸好幾個月或好幾年。因此，「最可能的獲利」是順著主要趨勢操作。\n\
    \n在這個基礎上，我們可以相當合理歸納出一個結論：如果發生某重要趨勢而足以讓大盤指數產生主要訊號，則順著該趨勢發展之個別股票提供的交易機會，應該多於逆勢發展的股票。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_189_0.png)\n\n圖211. 頭肩頂排列。1941年到1946年的多頭行情，SX股價由8上漲到70，最後在1946年6月形成頭肩頂排列。請注意左肩的大成交量，頭部與右肩的成交量逐漸減少。7月15日發生有效突破，多頭部位應該立即按照市價賣出（大約在63附近），不應該繼續等到停止單被引發（大約在61附近）。7月底，在突破走勢的低點58\
    \ 1/2附近，成交量再度放大，這恰好是頭肩頂排列突破的最低衡量目標。\n\n由這個低點開始，價格展開4個星期的弱勢反彈（成交量很少）。由弱勢技術結構判斷，反彈過程適合放空，位置可以挑選右肩到低點之距離的40～50%，或在頸線附近（例如：63附近）。結果，反彈走勢一度觸及頸線（64），然後出現向下跳空缺口，成交量明顯放大，隨後3個月內，價格下跌到40之下，後來跌得更深。\n\
    \n頭肩頂型態有一個特色，其規模經常不大（例如目前案例），但足以引發一波主要走勢，期間可能長達幾個月或幾年。當然，並不是所有頭肩頂都會造成目前這個例子的重大後果，但只要發生頭肩頂排列，就絕對不可以掉以輕心。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_190_0.png)\n\n讀者或許應該重復閱讀前一段內容，這意味著我們並不嘗試在多頭市場「賣在最高價」，也不試圖在空頭市場「買在最低價」。我們不會故意逆勢而為，因為根據歷史資料顯示，主要趨勢通常會持續很長一段期間。\n\
    \n此處所強調的立場，與前幾版內容並沒有太大差別。請注意，我們並沒有說投資人絕對不可以在多頭市場放空股票，也沒有說不能在空頭市場做多股票。確實有很多股票的走勢，是逆著主要趨勢發展，就這些股票的技術面結構來說，或許有理由逆著大盤的趨勢進行操作。\n\
    \n可是，我們覺得，這類交易必須非常謹慎，投資人必須充分了解，絕大部分股票是呈現相反趨勢。舉例來說，我们可以針對部分個股的技術型態，建立逆勢部位，並以此做為整體交易組合的避險。假定多頭行情已經持續數年之久，而且推定繼續有效，但某些個股出現明顯的空頭走勢。對於這種情況，交易者或許可以繼續持有四分之三的多頭部位，但把剩餘的四分之一資金用來放空疲弱的個股。如果多頭行情持續發展，這些空頭部位或許必須認賠，但這部分虧損可以視為合理的避險成本。另一方面，如果整體大盤走勢轉弱，最後演變為主要趨勢反轉，則空頭部位的獲利，可以彌補反轉訊號發生之前的多頭部位損失。（第9版附註：這是編者主張的「自然避險」理論。現代股票市場的結構相當複雜，風險部位與避險部位實際上都可能同時獲利，這也是交易者希望達成的目標。）\n\
    \n除了大盤指數之外，如果還採用評估指數（Evaluation Index，參考第38章），則可能認定市場的多頭成分為60%或55%，而不是單純的兩分法。這可以反映一項事實：各種行情具備的多、空氣勢各自不同，投資人應該自行調整多、空組合，不需採用「黑白分明」的立場。（第9版附註：我稱此為「韻律交易」，Rhythmic\
    \ Trading。）\n\n請注意，投資人雖然可以逆著（推定的）主要趨勢建立某些部位，**待**大部分資金還是應該順著主要趨勢方向操作。換言之，投資組合絕大多數屬於順勢部位，建立任何逆勢部位都應該有所體認，這只是一種保險措施，這些部位很可能會被追認賠。\n\
    \n讓我們把前述討論的重要內容摘要整理如下：\n\n- 投資組合的絕大多數部位，不可逆著主要趨勢。\n- 在多頭行情很可能發生反轉的潛在期間內，可以逐漸降低多頭部位的比率，針對少部分技術結構疲弱的股進行放空；不要嘗試猜測大盤的主要頭部或主要底部位置，千萬不要逆著主要趨勢而「孤注一擲」。\n\
    \n### 頭肩頂排列\n\n- **A. 多頭部位。** 如果價格有效跌破頸線（收盤價穿越程度至少為3％），隔天早晨將停止單設定在最近收盤價下側1/8點處。停止單當天如果沒有被引發，繼續採用收盤價停止單，每天都把停止點設定在最近收盤價下方1/8點處。\n\
    - **B. 突破之後。** 如果價格拉回頭線附近，可以進行放空，放空價位取下列兩者先出現者：計算「右肩」峰位與突破點之間的距離，當反彈走勢到達此距離的40%位置，或反彈走勢觸及「頸部」與「右肩」銜接的延長線。價格突破頸線之後，如果繼續下跌一天或數天，反彈40%是根據右肩峰位到最低點的距離計算。\n\
    \n### 頭肩底排列\n\n編者附註：編者始終不習慣「頭肩底」的名稱，所以主張將此名稱改為「基洛伊底部」（the Kilroy Bottom），請參考圖23.1。\n\
    \n- **A. 空頭部位。** 價格如果夾著大量突破頸線，收盤價貫穿幅度至少為 3%，隔天早晨將停止單設定在收盤價上方 1/8 點處。停止單當天如果没有被引發，繼續採用收盤價停止單，**每**都把停止點設定在最近收盤價上方\
    \ 1/8 點處。\n- **B. 突破之後。** 如果價格折返頸線附近，可以做新的買進（價格回檔必須量縮），買點取下列兩者先出現者：計算「右肩」谷底與突破點之間的距離，當回檔走勢到達此距離的\
    \ 40% 位置，或回檔走勢觸及「頭部」與「右肩」銜接的延長線。價格突破頸線之後，如果繼續上漲一天或數天，反彈 40% 是根據右肩谷底到最高點的距離計算。\n\
    \n### 複雜或多重頭肩排列\n\n戰術運用與簡單頭肩排列相同。關於這些排列的定義與說明，請參考第 7 章。\n\n### 圓形頂與圓形底\n\n在趨勢緩慢變動的過程，我們很難提出明確的交易法則。就圓形頂來說，當排列逐漸形成，涵蓋好幾個星期，價格由逐漸上升，轉變為緩慢下降，成交量在頭部位置縮小，在跌勢過程開始放大。一旦前述技術結構明朗化之後，多頭部位應該賣出股票。在圓形頂排列放空股票，獲利潛能很高；但我們不能提出明確的交易法則或基準點，只能強調一點：任何放空行為都必須確定圓形頂已經完成。圓形頂必須發生在延伸性漲勢之後，排列本身涵蓋好幾個星期的期間。另外，空頭部位必須在排列頭部的稍上方設定停損（參考第\
    \ 27 章）。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_193_0.png)\n\n圖 212. 1945年，BNF形成頭肩底排列。嚴格來說，這是多頭市場次級修正走勢過程發生的頭肩底連續排列。如果是主要底部（由主要空頭趨勢轉為主要多頭趨勢），通常需要耗費更長時間。\n\
    \n排列過程，左肩成交量相當大，頭部成交量稍微縮小，右肩成交量顯著縮小。9月21日，當價格向上突破頸線，成交量明顯放大。突破之後，價格由頸線拉回，成交量縮小，提供一個很理想的買進機會（大約在23）。價格回升之後，第二次向頸線拉回，這算不上異常。10月19日收盤價為22\
    \ 3/4，低於前一個小型底部，而且成交量放大，情況有些不妥。可是，就整個排列的技術結構與強勢突破來判斷，似乎沒有理由賣出股票，設定在21 7/8的停損單也沒有受到威脅。10月25日，價格出現跳空缺口、恢復上升走勢，而且漲勢持續到29\
    \ 1/2；這波走勢的端點，先是出現竭盡缺口，然後是單日反轉。\n\n請留意小型頭部29 1/2之後的發展，BNF發生長達3個星期的整理，構成上升三角形排列，向上突破之後，價格上漲到37\
    \ 1/2。另外，請注意（不妨讓我們「物盡其用」，充分發揮這個範例的功能），上升三角形大約位在整段漲勢的中點，快速走勢的中點，經常出現整理排列。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_194_0.png)\n\
    \n圖213. DG多頭市場趨勢發生圖形頂排列。這份日線圖涵蓋1946年最初的6個月。\n\nDG股價在31/2年內，由4上漲到72。由月線圖觀察，整個漲勢呈現平滑而加速發展的曲線，起點是1938年到1942年的5年期底部排列。現在，讓我們觀察最後峰位發生之前的6個月走勢，首先注意1月份與2月份的線形排列。DG在1945年最後一季出現快速上漲走勢，照道理應該有一段整理行情或次級修正。當價格上漲到48之後，回檔到45，接著上漲到50\
    \ 1/2與51，最後挺進到52，然後在2月底回檔到44。如果1月22日的價格更低一些，收盤價低於1月3日的低價，而且2月26日的收盤價更低一些，我們就認為1~2月份的走勢完成擴張頂排列，代表明確的反轉訊號。可是，整個排列畢竟不完整，所以不屬於有致的擴張頂，但情緒化價格走勢已經顯露疲態。\n\
    \n多頭行情的最後階段，一般投資大眾經常會瘋狂買進，造成噴出行情。目前這個例子就是如此。3月25日出現5點的突破缺口，價格繼續挺進到63 1/2，稍做回檔之後，又跳到68以上。\n\
    \n由此處開始，漲勢的步伐變得很沉重，趨勢逐漸下滑，出現一系列的「頭」與「肩」，峰位附近成交量萎縮。6月4日，價格跌破6月7日的小型底部之後，成交量增加，顯示圖形頂已經完成。如果手中還持有股票，應該賣出。6月18日，當「頸線」被貫穿之後，型態已經無庸置疑了。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_195_0.png)\n\n圖 214. 灰狗巴士發生在 1945 年的圓形底，這是\
    \ 5 月份上漲到 29 之後形成的連續排列，低點支撐在 24，也是 1944 年的高價。\n\n7 月份的跌勢，成交量相當大，但 8 月份成交量顯著萎縮，8\
    \ 月 10 日曾經出現突兀線形，成交量遽增，但隨後又陷入沈悶走勢。\n\n8 月份與 9 月份的許多小型波動，完全不適合進行交易。8 月 31 日曾經創排列內的新高價，意味著上升趨勢，9\
    \ 月 19 日與 20 日也是如此，價格推升到 26。可是，這還稱不上是結論性的發展。\n\n10 月 13 日前一週的走勢比較明確，價格夾著大量走出「碗底」。漲勢雖然稱不上凌厲，但趨勢方向很清楚。價格回檔之後，應該尋找買點，位置可以設定在排列低點以來整段漲勢的\
    \ 40～50% 折返，或在 26 支撐附近。實際買點可能在 26 1/2 附近。請注意，回檔走勢的成交量縮小。\n\n漲勢隨後直接挺進到 30，創多頭市場以來的新高價。11\
    \ 月 3 日週末爆出大量，收盤價為 30。由於這筆巨量並非發生在突破過程，因此星期一早晨把停止單調整到 29 7/8 準備出場（除非我們決定等待次一波漲勢，願意在隨後拉回走勢繼續持有部位）。\n\
    \n兩個星期之後，當價格折返到合理支撐水準，我們在 29 附近再度進場（不能期待最低價），次一波漲勢在 2 天之內上漲到 34 1/4。這個時候，多頭部位可以獲利了結，或改為長期持有。最後，股價上漲到\
    \ 54 才結束整個多頭行情。\n\n圓弧形排列過程，一般人不會持有空頭部位。在漫長而平緩的圓弧形走勢過程，交易非常沈悶，成交量極度萎縮；接著，交投突然轉趨熱絡。這種情況下，即使不幸持有空頭部位，也應該立即回補。至於買進方面，在整個沈悶而漫長的走勢過程，應該等待第一波突發大量。當走勢出現向上的突兀線形，價格隨後幾乎一定會拉回，應該在拉回過程進場。\n\
    \n### 等腰三角形\n\n- **A. 持有部位。** 等腰三角形排列過程，投資人或許沒有辦法改變部位。假定我們是在多頭走勢的回檔過程買進股票，次一波漲勢不能創新高，但小型頭部也沒有發生成交量賣出訊號。次一波折返走勢低點，價位高於前一個小型底部。所以，我們被「套在」三角形排列之內，多頭部位不適合賣出，因為價格可能突破而朝原先趨勢方向發展（事實上，等腰三角形屬於連續排列的可能性較高）。如果價格確實向上突破（當然必須夾著大量），可以考慮先獲利了結（根據前文已經討論的交易法則），然後在回檔過程重新進場。\n\
    \  - 如果收盤價向下突破（不論成交量是否放大），隔天早晨在收盤價下方 $1 / 8$ 點處設定停止單；如果停止單沒有被引發，隨後每天按照最近收盤價設定逐次停止單，直到出場為止。\n\
    \  - 如果持有空頭部位，前述法則也適用（方向當然相反），但向下突破不需經過成交量確認，向上突破则需要配合大量。\n- **B. 空手。** 不要在等腰三角形排列過程進場，等待有效突破。如果價格向上突破，而且主要趨勢向上，在次一個回檔走勢進場買進。如果價格向下突破，而且主要趨勢向下，在次一個**反彈走勢進場放空**。前文已經討論這類部位的交易法則。\n\
    \n附註：如果等腰三角形持續發展，突破的發生位置過於接近三角形頂點，則視為無效突破。最可靠的突破，應該發生在排列過程的**三分之二**位置附近。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_197_0.png)\n\
    \n等腰三角形排列。這是LS在1946年跌勢之後發生的連續排列。請注意9月10日第一個反轉點，當天曾經發生大量，然後排列內的成交量顯著萎縮。就圖及圖來說，這類型態稱為「鐘擺」，因為形狀就像鐘擺。對於有效的三角形排列，雖然反轉點的成交量會稍微增加，但整個型態還是應該呈現量縮的傾向。\n\
    \n這個時候，如果不幸持有LS多頭部位，應該把停止點設定在33¹/₈，相當於型態低點36下側的8%。可是10月4日與5日（星期五與星期六），價格有效突破排列，雖然成交量沒有擴大（請記住，向下突破不需成交量確認），可以在星期一開盤根據市價結束多頭部位，價格大約是38¹/₂。可是，如果打算建立空頭部位，收盤價至少必須到達三角形外側的3%。隨後，價格夾著少量回升到40（三角形下限邊緣），然後在10月9日與10日夾著大量展開真正跌勢。\n\
    \n向下突破的有效性，全然無庸置疑。反彈過程，空頭部位可以建立在三角形下限附近，或在突破跌勢的40～50%反彈位置（大約是38¹/₂～39）。反彈走勢曾經挺進到三角形頂點，然後一路下跌到33；10月30日發生賣壓高潮，形成單日反轉，這也是空頭部位獲利了結的訊號。\n\
    \n請注意8月份的小型頭肩頂型態，這是下跌跌勢的連續排列，構成反彈走勢的頭部，然後出現9～11月份的重挫跌勢。\n\n### 直角三角形\n\n等腰三角形的相關法則，也同樣適用於直角三角形（請參考三角形排列的相關章節）。就如同等腰三角形的情况一樣，較早發生的突破，通常比較可靠。上升三角形的向上突破，需要成交量確認，但下降三角形的向下突破，並不需大量配合。已經持有的部位，將保留到突破發生為止，然後部位按照正常方式了結。\n\
    \n由於上升與下降三角形可以預先顯示突破的可能方向，這與等腰三角形不同，所以新部位可以建立在上升三角形的回檔走勢，或下降三角形的反彈過程。可是，我們不清楚直角三角形水平邊界代表的供給或需求數量，這類三角形還是可能朝反方向突破，所以最好還是在有效突破發生之後，才建立新部位。\n\
    \n### 擴張頂排列\n\n照道理說，擴張頂排列過程內，通常不會持有多頭部位。如果遵循趨勢線戰術法則，遠在排列完成之前，最早的反轉就應該促使投資人結束多頭部位。排列過程中，交易者應該也不會試圖買進，因為當時呈現的趨勢顯然不利於多頭部位。\n\
    \n反之，擴張頂排列完成之後，則代表很理想的放空機會。當價格"
