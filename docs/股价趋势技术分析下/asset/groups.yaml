    12月10日，價格向上突破，突破的有效性無庸置疑；隨後兩個星期的回檔走勢，成交量顯著縮小，這可以更進一步確認先前的突破。2月初，價格再度夾著大量創新高。


    截至本文撰寫當時（編者附註：1957年），我們還不能說NOC是否會持續目前的漲勢，甚至攻克31的壓力。可是，我們認為，由2月份開始，NOC已經處於上升趨勢，除非有明顯的反向證據，否則應該推定股價將維持目前的上升趨勢。如果股價可以挺進到$30~31$附近，很可能會發生一段整理走勢，出現明確的型態排列，然後再設法向上突破31。


    順便提及一點，上圖圖形涵蓋期間內，許多飛機製造業者，股價都普遍下跌。'
  md: "\n## 第36章 移動平均：自動化趨勢線\n\n天期移動平均的敏感性，高於10天期移動平均。愈短期的移動平均，雖然比較能夠提供最及時的趨勢訊號（比較敏感），但訊號也比較容易反覆。商品交易適用短期的移動平均，經常採用30小時、3天或6天的移動平均。\n\
    \n一般來說，最好同時採用兩條移動平均，一條短期，一條長期。另外，也可以採用移動平均通道，舉例來說，分別取每天最低價與最高價的移動平均。\n\n### 穿越與貫穿\n\
    \n我們可以根据價格曲線穿越或貫穿移動平均，藉以提供交易訊號。\n\n- 1. 上升趨勢：如果價格停留在移動平均上側（換言之，價格高於移動平均），繼續持有多頭部位。\n\
    \  - A. 價格向上穿越移動平均，引發買進訊號。\n  - B. 如果價格位在200天移動平均之上而突然下跌，雖然逼近而沒有穿越移動平均，這是買進訊號。\n\
    \  - C. 當價格跌破移動平均，但移動平均仍然處於上升狀態，這可能是買進訊號。\n  - D. 如果價格突然快速下跌，遠低於下降中的移動平均，很可能發生短期反彈，但也可能是反覆走勢的陷阱。\n\
    - 2. 下降趨勢：如果價格停留在移動平均之下，繼續持有空頭部位。如果價格趨勢到達底部而向上回升，穿越移動平均是買進訊號。\n  - A. 價格向上穿越移動平均，而移動平均仍然向下，這是賣出訊號。\n\
    \  - B. 當價格位在移動平均之下而向均線逼近，如果沒有穿越而又回挫，這是賣出訊號。\n  - C. 如果價格快速上漲，遠高於上升中的移動平均，很可能發生短期回檔，但也可能是反覆走勢。\n\
    \  - D. 移動平均的穿越位置，往往很接近趨勢線的貫穿位置，這種情況下，根據貫穿的方向而代表買進或賣出訊號。\n- 3. 水平、對角或橫向走勢：相對於移動平均的長度來說，如果價格波動幅度很寬，價格將來回穿越均線，不論就本質上或交易上而言，這都屬於橫向走勢。\n\
    - 4. 缺口：移動平均穿越位置，經常發生在突破缺口附近，尤其是在中期循環的主要階段初期，或是發生在中期循環修正階段初期的突破缺口附近。\n\n區域型態經常讓移動平均束手無策。一般來說，移動平均會擺動在型態排列的中央，造成反覆的買進與賣出訊號。所以，在區域型態中，交易者不容易參考移動平均，因為很難區別趨勢持續發展的穿越或反轉確認的穿越。\n\
    \n如果價格呈現上升、下降或等腰三角形排列，移動平均會通過三角形中心。技術分析者可以掌握一些優勢，由一系列移動平均穿越過程，判斷何者最重要。當三角形排列到達其頂點附近，股價朝某個方向突破，而且穿越移動平均，這個穿越可能代表整個三角形橫向走勢最重要的貫穿。當價格穿越趨勢線，經常會來回貫穿移動平均。\n\
    \n由於移動平均是由價格衍生而來，可以配合趨勢線來顯示趨勢發展。雖然如此，但还是應該將移動平均視為整個技術分析架構的一項輔助工具。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_230_0.png)\n\
    \n下面這份圖形，顯示150天移動平均。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_231_0.png)\n\n\
    圖227. 道瓊工業指數月線圖與150天移動平均（虛線）。一直到1980年代（當時，雷根總統讓聯邦債務擴增3倍），根據150天移動平均進行交易（價格向上穿越均線則買進，價格向下穿越均線則賣出），績效類似於道瓊理論提供的交易訊號。到了1980年代，這套系統不再有效。可是，就1929年經濟大蕭條來說，這可是救命的訊號。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_232_0.png)\n\n## 第37章 相同的舊有型態\n\n初學者一定覺得市場是一個充滿神奇與奧妙的場所，就像太空人初次踏上火星的感覺一樣。一切都顯得陌生，不可解釋的高低起伏，詭異的發展。一支默默無聞的股票，突然脫離債務與赤字困擾，股價一飛沖天。在穩定的經濟背景下，一支老牌績優股突然暴跌。表面看起來平靜而安全，然後地面忽然裂開，一波可怕的跌勢吞噬所有的價值。\n\
    \n初學者或許不瞭解，這些不尋常與駭人聽聞的現象，只不過是市場不斷發生的正常波動與調整，無數參與者因為害怕、貪婪與猶豫不決而造成變化。這位初學者可能遊走在許多騙子之間，打電話，研究報紙金融版的消息，與朋友討論，累積各種相互矛盾的資訊，最後閉上眼睛、隨便做個決定，期待這就是正確的答案。\n\
    \n某些人即使在股票市場打滾了幾十年，仍然沒辦法找到明確的交易方法。\n\n可是，關於股票趨勢的基本性質，還是可以透過學習而瞭解的。某種程度內，我們可以知道某些情況的可能後續發展，也可以找到方法來處理這些情況，包括例外情況的意外發展在內。重複強調一次：我們可以成功地處理例外情況，以及那些無法精確預測的發展。\n\
    \n由另一個角度說，我們偶爾會發生錯誤，但整體而言還是能夠成功。為了達成這個目標，我們需要有足夠的經驗來判斷某些情況的正常後續發展，瞭解例外情況發生的可能性有多高，而且知道如何處理意外發展。這屬於一般性的問題，太空人、化學家、物理學家，乃至於日常生活中的每個人都會遭遇。\n\
    \n長期而深入地觀察市場，將發現意外情況發生的頻率並不如初學者想像那麼高。\n\n本書提供的圖形，大體上與1947年第一版的圖形相同。某些是取自1928年與1929年，某些是來自1930年代與1940年代。編者附註：另外還新增添一些1990年代與2000年代的例子。讀者絕對不該忽略各種股票在不同期間之對應趨勢階段或轉折點呈現的相似性。\n\
    \n任何正常交易的股票或商品，我們可以在任何時間架構的走勢圖上，察覺這些不斷重複發生的型態、趨勢線與支撐／壓力現象。\n\n為了說明這點，第五版的這部分內容，增添了一些典型的技術範例，這些例子都類似過去版本討論的案例，但取自1947年到1966年的市場。編者附註：本書第八版又增添一些取自1990年到與2000年代的例子。事實上，我們可以輕鬆提出十倍數量的例子，藉以說明過去所發生的一切，仍然重複發生於最近幾年。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_234_0.png)\n\n圖228. UV發生在1952年主要趨勢過程的頭肩頂排列。這支股票超越於1950年的底部33，最高峰值是此處顯示的88。隨後，股價下跌到37。頭肩頂排列過程，「左肩」出現典型的大成交量，「頸」的成交量稍高於「標準型態」，「右肩」成交量萎缩，代表明後的警訊。請注意8月份最後一個星期的拉高走勢，以及11月份與12月份的次級回升走勢。另外，位在圖形左半部，1951年還發生一個漂亮的上升三角形，顯示行情即將恢復先前的漲勢。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_235_0.png)\n\n下降趨勢很少出現規律性的趨勢線，不同於上升趨勢。可是，雖然反彈走勢與成交量缺乏規律性，但基本分析原則仍然類似上升趨勢。在這份走勢圖涵蓋的6個月期間，反彈峰值始終沒有超越前一個漲勢峰值。如果發生這種明確的下降趨勢，應該假定該趨勢將繼續發展，直到價格與成交量型態發生顯著變動為止。當IC突破52的重要歷史關卡，請注意成交量擴增，以及後續發展。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_236_0.png)\n\n圖230. 7月份與8月份的矩形排列長達6個星期，高限47曾經遭到3次觸及，低限在44位置。如同多數矩形排列一樣，7月19日發生第一個矩形反轉點時，成交量擴大；然後，排列發展過程，成交量萎縮；最後，8月29日向上突破時，成交量又再度放大。\n\
    \n價格向上突破之後，出現典型的旗形折返走勢，成交量顯著萎縮；折返走勢雖然跌破矩形上限支撐，但從來沒有穿越矩形下限。10月15日，當價格向上穿越9月初的高點，成交量放大。（類似現象也發生在12月中旬，當時價格向上穿越11月14日的高價。）11月下旬的折返走勢，成交量縮小，在9月份高點獲得支撐。這份圖形中，請注意52扮演支撐／壓力功能，這個關卡曾經是兩波漲勢的壓力，當價格由10月份峰位折返之後，則是隨後三波回檔走勢的支撐。\n\
    \n12月初展開的漲勢，又出現類似情況，57扮演壓力／支撐角色。當價格在12月中旬突破壓力創新高之後，回檔走勢停止於57。\n\n趨勢的正常運作，如果沒有因為消息面因素受到干擾，主要趨勢都是由這些小型波浪起伏構成。如果市場或產業內發生重大消息，走勢可能出現長期整理或次級折返。可是，主要趨勢非常「耐操」。我們不該隨便假定主要趨勢發生反轉。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_237_0.png)\n\n圖231. 這份走勢圖幾乎與圖230完全相同，只是方向相反而已。\n\
    \n假定各位持有的股票，發生MNC在1956年下半年的走勢，如果仍然期待趨勢向上翻升，恐怕需要「非比尋常」的樂觀心態，要不然就是對於股票走勢性質全然無知。可是，如果持有空頭部位，那當然有樂觀的理由。\n\
    \n這個例子中，一系列跌勢的反彈峰值，始終不能穿越先前的小型峰值，而且可以繪製相當明確的下降趨勢線，這是很罕見的情況。\n\n我們發現，幾乎每波反彈都在前一波的谷底遭受壓力，譬如：44、41、38與36。12月底，當價格向上突破下降趨勢線，我們當然不認為趨勢已經反轉；這類突破頂多意味著次級回升走勢。如果趨勢將因此發生重大變化，成交量應該會透露一些訊息，目前情況顯然不是如此。這支股票首先要出現反轉型態，我們才會考慮買進的可能性。事實上，當股價反彈到40附近，應該是進一步放空的時候。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_238_0.png)\n\n圖232. 「如何判斷某種技術排列或價格突破確實有效？」這是我們經常聽到的問題。多數情況下，成交量可以提供明確的答案，尤其是價格向上突破型態。成交量確認訊號雖然未必都像目前這個DL例子那麼清楚，但這屬於向上突破的典型現象。矩形排列過程，成交量明顯萎縮，上限與下限發生5個顯著的反轉點。\n\
    \n11月4日星期四，價格夾著大量向上突破矩形排列，而且收盤價正式穿越排列上限。隔天（星期五），價格仍然收高，成交量配合也很恰當。由這點開始，上升趨勢已經很明顯。\n\
    \n由這份走勢圖觀察，當價格突破矩形排列之後，始終沒有出現反轉徵兆，頭部出現在3月份的25 1/2。\n\nDL的矩形突破特別強勁。正常情況下，突破之後都會發生小型回檔，類似如圖230的GRC。可是，即使突破之後發生回檔走勢，也絕對不會減弱多頭氣勢。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_239_0.png)\n\n假定我們真的放空LA。請注意11月4日（星期四）與11月5日（星期五）的「價漲一量增」關係；隔週的星期一與星期二，價格稍微收低，交易區間很小，成交量也萎縮。然後，星期三價格大漲，成交量顯著放大。截至當週結束的一週半整體走勢，基本上還是維持價漲量增、價跌量縮的傾向。等到12月的第一個星期（如果不是更早的話），已經可以清楚看出危險的訊號，應該回補空頭部位。\n\
    \n這種結果並不是一場悲劇，甚至不該覺得沮喪。某些交易者很容易因為些許損失而情緒激動；若是如此，將不能掌握反轉部位的機會。\n\n1955年3月，這波走勢直奔26⅜高點。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_240_0.png)\n\n圖 234. 打 底 過 程 耗 費 的\
    \ 時 間 ， 通 常 都 超 過 盤 頭 。 這 也 是 此 處 採 用 過 線 圖 的 理 由 之 一 ， 如 此 才 能 觀 察 一 年 半 的 走\
    \ 勢 。 1953~54 期 間 ， FNL 在 21 附 近 形 成 多 重 底 型 態 ， 經 過 一 段 漲 勢 之 後 ， 出 現 上 述 圖 形\
    \ 左 側 的 整 理 排 列 。 這 個 上 升 三 角 形 的 上 限 ， 大 約 對 應 1953 年 4 月 的 峰 位 。\n\n1955 年 初\
    \ ， 當 價 格 開 始 呈 現 三 角 形 排 列 時 ， 我 們 當 然 不 能 判 斷 這 個 型 態 ， 尤 其 是 2 月 份 高 點 曾 經\
    \ 穿 越 排 列 的 水 平 狀 上 限 。 可 是 ， 在 第 一 次 突 破 的 前 7 個 月 裡 ， 情 況 逐 漸 明 朗 ， 每 波 漲 勢\
    \ 總 是 在 32 ½ 折 返 ， 回 檔 過 程 量 縮 ， 而 且 底 部 不 斷 墊 高 。\n\n9 月 份 的 第 一 個 星 期 ， 出 現\
    \ 乾 淨 俐 落 的 向 上 突 破 ； 由 此 處 開 始 ， 展 開 主 要 漲 勢 的 典 型 波 浪 狀 走 勢 。 請 注 意 11 月 份 的\
    \ 突 破 缺 口 ， 然 後 在 12 月 、 1 月 與 2 月 的 回 檔 過 程 。 成 交 量 都 顯 著 縮 小 。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_241_0.png)\n\
    \n1月25日星期五，價格夾著大量跌破支撐。雖然當天收盤價買穿幅度不大，但排列的技術型態明顯惡化，還是應該立即賣出股票。下降三角形具有空頭意涵，即使在突破之前也是如此。突破之後，價格完全沒有向上拉高。因為我們不能仰賴突破之後的拉高走勢，所以最安全的做法是立即賣出，或當價格跌破型態時，立即根據收盤價設定逐次停止單（就目前這個例子來說，跌破型態需要考慮除息金額）。\n\
    \n請注意1月底暴跌走勢的大成交量。一般來說，重要跌勢不一定需要配合大成交量，但如果經過成交量確認，走勢的意義更顯著。\n\n問題：由這份走勢圖判斷，1月底的股價，是否代表TXT很便宜了？各位是否會因為下列理由而買進：「股價不可能再跌了」、「應該反彈了」或「股價遠低於實際價值」。\n\
    \n假定TXT確實出現技術性反彈，各位認為反彈走勢可以回升到什麼程度？難道預期股價可以在短期之內向上穿越20嗎？1957年1月底，各位認為整個盤面呈現多頭格局嗎？\n\
    \n### 圖形不完全相同\n\n絕大部分股票雖然都會反映大盤走勢，但在時間上與程度上則為必相同。某些股票可能不理會大盤，呈現獨特的走勢。1920年代曾經出現大多頭走勢。然後，1929年10月發生恐慌性跌勢。可是，這種說法並不涵蓋所有股票，某些個股出現截然不同的走勢。如果持有平衡而分散的投資或交易組合，可以避免不必要的損失。\n\
    \n我們曾經研究676支股票在1924～35年期間的走勢，其中只有184支股票的多頭市場峰值是發生在1929年8月到10月之間，並在該年的10月與11月出現重大跌勢。事實上，有262支股票的主要下跌趨勢發生在1929年之前。總共有181支股票的多頭市場峰值，發生在1929年最初9個月內，主要跌勢在夏天結束之前已經展開。其中有5支股票的跌勢開始於1929年之後；44支股票在1929年之後還繼續創新高。此處所列舉的3支股票，在1927～30期間有著非常不同的走勢。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_243_0.png)\n\n圖236.（左上）在1929年恐慌性下跌過程，Libby,\
    \ McNeil & Libby沒有發生顯著跌勢，在1930年3月與4月繼續創新高。\n\n圖237.（中上）克萊斯勒是市場指標股之一，多頭市場峰位發生在1928年，頭部出現在恐慌性跌勢的一年之前。1929年10月崩盤時，克萊斯勒股價已經下跌60%。\n\
    \n圖238.（右上）Eagle—Picher Lead完全沒有出現多頭行情，除了1928年曾經小幅上漲之外，整個期間的走勢都處於下降趨勢。\n\n這些例子都不屬於罕見的例外，還有許多股票沒有追隨大盤。個股表現是市場的_normal_現象。目前的情況仍然是如此。股票走勢「不完全相同」，每支股票都需要個別研究。讓我們再由1953~56年的行情觀察3個例子；重複強調一次，這些都不是特例。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_244_0.png)\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_244_1.png)\n\
    \n圖239. （左上）1956年底，大盤走勢沈悶而稍顯疲軟。可是，West Indies Sugar突破連續弧狀排列，展開自己的多頭行情。\n\n圖240.\
    \ （中上）1956年春天，大盤雖然持續創新高，但西屋電器較大盤提早一年做頭，展開主要的空頭走勢。\n\n圖241. （右上）這是25年之前Eagle—Picher的翻版。許多類似如Kresge的藍籌績優股都沒有參與1953～56年的多頭行情。\n\
    \n這6份走勢圖都取自Graphic Stocks （F. W. Stephens, New York）。1927～30年的圖形是取自特別版，涵蓋1924～35年的700支股票。1953～56年的圖形是取自稍後的版本。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_245_0.png)\n\n14 1 11 18 25 1 1 8 1\
    \ 15 22 29 1 5 12 19 26 1 2 9 16 23 30 1 7 14 21 28\n\n圖242．這份圖形是Northrop Aircraft在1954～55年形成的漂亮頭部排列。這波主要行情起漲於1953年底部$6\\\
    \ 1/4$，終止於1955年1月的$39\\ 3/4$。\n\n在下降三角形排列過程，2月與3月的漲勢峰位發生不尋常大量；除此之外，這是相當典型的反轉排列。3月14日價格向下突破，下跌過程也出現常見的回升走勢，但只持續2天而已。\n\
    \n讀者可以發現，向下突破與隨後的下跌過程，成交量都不大，甚至小於三角形排列過程小型頭部的成交量。可是，正如我們稍早不斷強調的，跌勢不同於漲勢，成交量並非必要條件。\n\
    \n一直到第一波跌勢末期，成交量才開始出現。請注意，不論是上升或下降，小型走勢末期通常都會發生大量。\n\n請注意，4月中旬的上升旗形發生大量，這個排列的下檔衡量目標大約是在1個月之後完成。\n\
    \n隨後一年半之內，NOC股價再也沒有回升到31。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_246_0.png)\n\
    \n圖243. 前一份圖形涵蓋1954~55年的走勢，目前這份圖形則涵蓋1956年下半年與1957年初的走勢。我們要知道：主要下降趨勢是否仍然有效？或已經出現重要的向上轉折？\n\
    \n如同往常一樣，成交量是觀察重點。請注意月14日與24日的小型峰位，成交量明顯放大。9月份的向下整理過程，成交量萎縮。然後，10月中旬的小型峰位成交量又放大。回檔走勢再度量縮，回升走勢把價格推高到$25\
    \ 1/2$；12月中旬，整個排列已經相當清楚，這是上限水平狀的上升三角形。\n\n12月10日，價格向上突破，突破的有效性無庸置疑；隨後兩個星期的回檔走勢，成交量顯著縮小，這可以更進一步確認先前的突破。2月初，價格再度夾著大量創新高。\n\
    \n截至本文撰寫當時（編者附註：1957年），我們還不能說NOC是否會持續目前的漲勢，甚至攻克31的壓力。可是，我們認為，由2月份開始，NOC已經處於上升趨勢，除非有明顯的反向證據，否則應該推定股價將維持目前的上升趨勢。如果股價可以挺進到$30~31$附近，很可能會發生一段整理走勢，出現明確的型態排列，然後再設法向上突破31。\n\
    \n順便提及一點，上圖圖形涵蓋期間內，許多飛機製造業者，股價都普遍下跌。\n"
  mdcn: "\n## 第36章 移動平均：自動化趨勢線\n\n天期移動平均的敏感性，高於10天期移動平均。愈短期的移動平均，雖然比較能夠提供最及時的趨勢訊號（比較敏感），但訊號也比較容易反覆。商品交易適用短期的移動平均，經常採用30小時、3天或6天的移動平均。\n\
    \n一般來說，最好同時採用兩條移動平均，一條短期，一條長期。另外，也可以採用移動平均通道，舉例來說，分別取每天最低價與最高價的移動平均。\n\n### 穿越與貫穿\n\
    \n我們可以根据價格曲線穿越或貫穿移動平均，藉以提供交易訊號。\n\n- 1. 上升趨勢：如果價格停留在移動平均上側（換言之，價格高於移動平均），繼續持有多頭部位。\n\
    \  - A. 價格向上穿越移動平均，引發買進訊號。\n  - B. 如果價格位在200天移動平均之上而突然下跌，雖然逼近而沒有穿越移動平均，這是買進訊號。\n\
    \  - C. 當價格跌破移動平均，但移動平均仍然處於上升狀態，這可能是買進訊號。\n  - D. 如果價格突然快速下跌，遠低於下降中的移動平均，很可能發生短期反彈，但也可能是反覆走勢的陷阱。\n\
    - 2. 下降趨勢：如果價格停留在移動平均之下，繼續持有空頭部位。如果價格趨勢到達底部而向上回升，穿越移動平均是買進訊號。\n  - A. 價格向上穿越移動平均，而移動平均仍然向下，這是賣出訊號。\n\
    \  - B. 當價格位在移動平均之下而向均線逼近，如果沒有穿越而又回挫，這是賣出訊號。\n  - C. 如果價格快速上漲，遠高於上升中的移動平均，很可能發生短期回檔，但也可能是反覆走勢。\n\
    \  - D. 移動平均的穿越位置，往往很接近趨勢線的貫穿位置，這種情況下，根據貫穿的方向而代表買進或賣出訊號。\n- 3. 水平、對角或橫向走勢：相對於移動平均的長度來說，如果價格波動幅度很寬，價格將來回穿越均線，不論就本質上或交易上而言，這都屬於橫向走勢。\n\
    - 4. 缺口：移動平均穿越位置，經常發生在突破缺口附近，尤其是在中期循環的主要階段初期，或是發生在中期循環修正階段初期的突破缺口附近。\n\n區域型態經常讓移動平均束手無策。一般來說，移動平均會擺動在型態排列的中央，造成反覆的買進與賣出訊號。所以，在區域型態中，交易者不容易參考移動平均，因為很難區別趨勢持續發展的穿越或反轉確認的穿越。\n\
    \n如果價格呈現上升、下降或等腰三角形排列，移動平均會通過三角形中心。技術分析者可以掌握一些優勢，由一系列移動平均穿越過程，判斷何者最重要。當三角形排列到達其頂點附近，股價朝某個方向突破，而且穿越移動平均，這個穿越可能代表整個三角形橫向走勢最重要的貫穿。當價格穿越趨勢線，經常會來回貫穿移動平均。\n\
    \n由於移動平均是由價格衍生而來，可以配合趨勢線來顯示趨勢發展。雖然如此，但还是應該將移動平均視為整個技術分析架構的一項輔助工具。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_230_0.png)\n\
    \n下面這份圖形，顯示150天移動平均。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_231_0.png)\n\n\
    圖227. 道瓊工業指數月線圖與150天移動平均（虛線）。一直到1980年代（當時，雷根總統讓聯邦債務擴增3倍），根據150天移動平均進行交易（價格向上穿越均線則買進，價格向下穿越均線則賣出），績效類似於道瓊理論提供的交易訊號。到了1980年代，這套系統不再有效。可是，就1929年經濟大蕭條來說，這可是救命的訊號。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_232_0.png)\n\n## 第37章 相同的舊有型態\n\n初學者一定覺得市場是一個充滿神奇與奧妙的場所，就像太空人初次踏上火星的感覺一樣。一切都顯得陌生，不可解釋的高低起伏，詭異的發展。一支默默無聞的股票，突然脫離債務與赤字困擾，股價一飛沖天。在穩定的經濟背景下，一支老牌績優股突然暴跌。表面看起來平靜而安全，然後地面忽然裂開，一波可怕的跌勢吞噬所有的價值。\n\
    \n初學者或許不瞭解，這些不尋常與駭人聽聞的現象，只不過是市場不斷發生的正常波動與調整，無數參與者因為害怕、貪婪與猶豫不決而造成變化。這位初學者可能遊走在許多騙子之間，打電話，研究報紙金融版的消息，與朋友討論，累積各種相互矛盾的資訊，最後閉上眼睛、隨便做個決定，期待這就是正確的答案。\n\
    \n某些人即使在股票市場打滾了幾十年，仍然沒辦法找到明確的交易方法。\n\n可是，關於股票趨勢的基本性質，還是可以透過學習而瞭解的。某種程度內，我們可以知道某些情況的可能後續發展，也可以找到方法來處理這些情況，包括例外情況的意外發展在內。重複強調一次：我們可以成功地處理例外情況，以及那些無法精確預測的發展。\n\
    \n由另一個角度說，我們偶爾會發生錯誤，但整體而言還是能夠成功。為了達成這個目標，我們需要有足夠的經驗來判斷某些情況的正常後續發展，瞭解例外情況發生的可能性有多高，而且知道如何處理意外發展。這屬於一般性的問題，太空人、化學家、物理學家，乃至於日常生活中的每個人都會遭遇。\n\
    \n長期而深入地觀察市場，將發現意外情況發生的頻率並不如初學者想像那麼高。\n\n本書提供的圖形，大體上與1947年第一版的圖形相同。某些是取自1928年與1929年，某些是來自1930年代與1940年代。編者附註：另外還新增添一些1990年代與2000年代的例子。讀者絕對不該忽略各種股票在不同期間之對應趨勢階段或轉折點呈現的相似性。\n\
    \n任何正常交易的股票或商品，我們可以在任何時間架構的走勢圖上，察覺這些不斷重複發生的型態、趨勢線與支撐／壓力現象。\n\n為了說明這點，第五版的這部分內容，增添了一些典型的技術範例，這些例子都類似過去版本討論的案例，但取自1947年到1966年的市場。編者附註：本書第八版又增添一些取自1990年到與2000年代的例子。事實上，我們可以輕鬆提出十倍數量的例子，藉以說明過去所發生的一切，仍然重複發生於最近幾年。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_234_0.png)\n\n圖228. UV發生在1952年主要趨勢過程的頭肩頂排列。這支股票超越於1950年的底部33，最高峰值是此處顯示的88。隨後，股價下跌到37。頭肩頂排列過程，「左肩」出現典型的大成交量，「頸」的成交量稍高於「標準型態」，「右肩」成交量萎缩，代表明後的警訊。請注意8月份最後一個星期的拉高走勢，以及11月份與12月份的次級回升走勢。另外，位在圖形左半部，1951年還發生一個漂亮的上升三角形，顯示行情即將恢復先前的漲勢。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_235_0.png)\n\n下降趨勢很少出現規律性的趨勢線，不同於上升趨勢。可是，雖然反彈走勢與成交量缺乏規律性，但基本分析原則仍然類似上升趨勢。在這份走勢圖涵蓋的6個月期間，反彈峰值始終沒有超越前一個漲勢峰值。如果發生這種明確的下降趨勢，應該假定該趨勢將繼續發展，直到價格與成交量型態發生顯著變動為止。當IC突破52的重要歷史關卡，請注意成交量擴增，以及後續發展。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_236_0.png)\n\n圖230. 7月份與8月份的矩形排列長達6個星期，高限47曾經遭到3次觸及，低限在44位置。如同多數矩形排列一樣，7月19日發生第一個矩形反轉點時，成交量擴大；然後，排列發展過程，成交量萎縮；最後，8月29日向上突破時，成交量又再度放大。\n\
    \n價格向上突破之後，出現典型的旗形折返走勢，成交量顯著萎縮；折返走勢雖然跌破矩形上限支撐，但從來沒有穿越矩形下限。10月15日，當價格向上穿越9月初的高點，成交量放大。（類似現象也發生在12月中旬，當時價格向上穿越11月14日的高價。）11月下旬的折返走勢，成交量縮小，在9月份高點獲得支撐。這份圖形中，請注意52扮演支撐／壓力功能，這個關卡曾經是兩波漲勢的壓力，當價格由10月份峰位折返之後，則是隨後三波回檔走勢的支撐。\n\
    \n12月初展開的漲勢，又出現類似情況，57扮演壓力／支撐角色。當價格在12月中旬突破壓力創新高之後，回檔走勢停止於57。\n\n趨勢的正常運作，如果沒有因為消息面因素受到干擾，主要趨勢都是由這些小型波浪起伏構成。如果市場或產業內發生重大消息，走勢可能出現長期整理或次級折返。可是，主要趨勢非常「耐操」。我們不該隨便假定主要趨勢發生反轉。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_237_0.png)\n\n圖231. 這份走勢圖幾乎與圖230完全相同，只是方向相反而已。\n\
    \n假定各位持有的股票，發生MNC在1956年下半年的走勢，如果仍然期待趨勢向上翻升，恐怕需要「非比尋常」的樂觀心態，要不然就是對於股票走勢性質全然無知。可是，如果持有空頭部位，那當然有樂觀的理由。\n\
    \n這個例子中，一系列跌勢的反彈峰值，始終不能穿越先前的小型峰值，而且可以繪製相當明確的下降趨勢線，這是很罕見的情況。\n\n我們發現，幾乎每波反彈都在前一波的谷底遭受壓力，譬如：44、41、38與36。12月底，當價格向上突破下降趨勢線，我們當然不認為趨勢已經反轉；這類突破頂多意味著次級回升走勢。如果趨勢將因此發生重大變化，成交量應該會透露一些訊息，目前情況顯然不是如此。這支股票首先要出現反轉型態，我們才會考慮買進的可能性。事實上，當股價反彈到40附近，應該是進一步放空的時候。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_238_0.png)\n\n圖232. 「如何判斷某種技術排列或價格突破確實有效？」這是我們經常聽到的問題。多數情況下，成交量可以提供明確的答案，尤其是價格向上突破型態。成交量確認訊號雖然未必都像目前這個DL例子那麼清楚，但這屬於向上突破的典型現象。矩形排列過程，成交量明顯萎縮，上限與下限發生5個顯著的反轉點。\n\
    \n11月4日星期四，價格夾著大量向上突破矩形排列，而且收盤價正式穿越排列上限。隔天（星期五），價格仍然收高，成交量配合也很恰當。由這點開始，上升趨勢已經很明顯。\n\
    \n由這份走勢圖觀察，當價格突破矩形排列之後，始終沒有出現反轉徵兆，頭部出現在3月份的25 1/2。\n\nDL的矩形突破特別強勁。正常情況下，突破之後都會發生小型回檔，類似如圖230的GRC。可是，即使突破之後發生回檔走勢，也絕對不會減弱多頭氣勢。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_239_0.png)\n\n假定我們真的放空LA。請注意11月4日（星期四）與11月5日（星期五）的「價漲一量增」關係；隔週的星期一與星期二，價格稍微收低，交易區間很小，成交量也萎縮。然後，星期三價格大漲，成交量顯著放大。截至當週結束的一週半整體走勢，基本上還是維持價漲量增、價跌量縮的傾向。等到12月的第一個星期（如果不是更早的話），已經可以清楚看出危險的訊號，應該回補空頭部位。\n\
    \n這種結果並不是一場悲劇，甚至不該覺得沮喪。某些交易者很容易因為些許損失而情緒激動；若是如此，將不能掌握反轉部位的機會。\n\n1955年3月，這波走勢直奔26⅜高點。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_240_0.png)\n\n圖 234. 打 底 過 程 耗 費 的\
    \ 時 間 ， 通 常 都 超 過 盤 頭 。 這 也 是 此 處 採 用 過 線 圖 的 理 由 之 一 ， 如 此 才 能 觀 察 一 年 半 的 走\
    \ 勢 。 1953~54 期 間 ， FNL 在 21 附 近 形 成 多 重 底 型 態 ， 經 過 一 段 漲 勢 之 後 ， 出 現 上 述 圖 形\
    \ 左 側 的 整 理 排 列 。 這 個 上 升 三 角 形 的 上 限 ， 大 約 對 應 1953 年 4 月 的 峰 位 。\n\n1955 年 初\
    \ ， 當 價 格 開 始 呈 現 三 角 形 排 列 時 ， 我 們 當 然 不 能 判 斷 這 個 型 態 ， 尤 其 是 2 月 份 高 點 曾 經\
    \ 穿 越 排 列 的 水 平 狀 上 限 。 可 是 ， 在 第 一 次 突 破 的 前 7 個 月 裡 ， 情 況 逐 漸 明 朗 ， 每 波 漲 勢\
    \ 總 是 在 32 ½ 折 返 ， 回 檔 過 程 量 縮 ， 而 且 底 部 不 斷 墊 高 。\n\n9 月 份 的 第 一 個 星 期 ， 出 現\
    \ 乾 淨 俐 落 的 向 上 突 破 ； 由 此 處 開 始 ， 展 開 主 要 漲 勢 的 典 型 波 浪 狀 走 勢 。 請 注 意 11 月 份 的\
    \ 突 破 缺 口 ， 然 後 在 12 月 、 1 月 與 2 月 的 回 檔 過 程 。 成 交 量 都 顯 著 縮 小 。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_241_0.png)\n\
    \n1月25日星期五，價格夾著大量跌破支撐。雖然當天收盤價買穿幅度不大，但排列的技術型態明顯惡化，還是應該立即賣出股票。下降三角形具有空頭意涵，即使在突破之前也是如此。突破之後，價格完全沒有向上拉高。因為我們不能仰賴突破之後的拉高走勢，所以最安全的做法是立即賣出，或當價格跌破型態時，立即根據收盤價設定逐次停止單（就目前這個例子來說，跌破型態需要考慮除息金額）。\n\
    \n請注意1月底暴跌走勢的大成交量。一般來說，重要跌勢不一定需要配合大成交量，但如果經過成交量確認，走勢的意義更顯著。\n\n問題：由這份走勢圖判斷，1月底的股價，是否代表TXT很便宜了？各位是否會因為下列理由而買進：「股價不可能再跌了」、「應該反彈了」或「股價遠低於實際價值」。\n\
    \n假定TXT確實出現技術性反彈，各位認為反彈走勢可以回升到什麼程度？難道預期股價可以在短期之內向上穿越20嗎？1957年1月底，各位認為整個盤面呈現多頭格局嗎？\n\
    \n### 圖形不完全相同\n\n絕大部分股票雖然都會反映大盤走勢，但在時間上與程度上則為必相同。某些股票可能不理會大盤，呈現獨特的走勢。1920年代曾經出現大多頭走勢。然後，1929年10月發生恐慌性跌勢。可是，這種說法並不涵蓋所有股票，某些個股出現截然不同的走勢。如果持有平衡而分散的投資或交易組合，可以避免不必要的損失。\n\
    \n我們曾經研究676支股票在1924～35年期間的走勢，其中只有184支股票的多頭市場峰值是發生在1929年8月到10月之間，並在該年的10月與11月出現重大跌勢。事實上，有262支股票的主要下跌趨勢發生在1929年之前。總共有181支股票的多頭市場峰值，發生在1929年最初9個月內，主要跌勢在夏天結束之前已經展開。其中有5支股票的跌勢開始於1929年之後；44支股票在1929年之後還繼續創新高。此處所列舉的3支股票，在1927～30期間有著非常不同的走勢。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_243_0.png)\n\n圖236.（左上）在1929年恐慌性下跌過程，Libby,\
    \ McNeil & Libby沒有發生顯著跌勢，在1930年3月與4月繼續創新高。\n\n圖237.（中上）克萊斯勒是市場指標股之一，多頭市場峰位發生在1928年，頭部出現在恐慌性跌勢的一年之前。1929年10月崩盤時，克萊斯勒股價已經下跌60%。\n\
    \n圖238.（右上）Eagle—Picher Lead完全沒有出現多頭行情，除了1928年曾經小幅上漲之外，整個期間的走勢都處於下降趨勢。\n\n這些例子都不屬於罕見的例外，還有許多股票沒有追隨大盤。個股表現是市場的_normal_現象。目前的情況仍然是如此。股票走勢「不完全相同」，每支股票都需要個別研究。讓我們再由1953~56年的行情觀察3個例子；重複強調一次，這些都不是特例。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_244_0.png)\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_244_1.png)\n\
    \n圖239. （左上）1956年底，大盤走勢沈悶而稍顯疲軟。可是，West Indies Sugar突破連續弧狀排列，展開自己的多頭行情。\n\n圖240.\
    \ （中上）1956年春天，大盤雖然持續創新高，但西屋電器較大盤提早一年做頭，展開主要的空頭走勢。\n\n圖241. （右上）這是25年之前Eagle—Picher的翻版。許多類似如Kresge的藍籌績優股都沒有參與1953～56年的多頭行情。\n\
    \n這6份走勢圖都取自Graphic Stocks （F. W. Stephens, New York）。1927～30年的圖形是取自特別版，涵蓋1924～35年的700支股票。1953～56年的圖形是取自稍後的版本。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_245_0.png)\n\n14 1 11 18 25 1 1 8 1\
    \ 15 22 29 1 5 12 19 26 1 2 9 16 23 30 1 7 14 21 28\n\n圖242．這份圖形是Northrop Aircraft在1954～55年形成的漂亮頭部排列。這波主要行情起漲於1953年底部$6\\\
    \ 1/4$，終止於1955年1月的$39\\ 3/4$。\n\n在下降三角形排列過程，2月與3月的漲勢峰位發生不尋常大量；除此之外，這是相當典型的反轉排列。3月14日價格向下突破，下跌過程也出現常見的回升走勢，但只持續2天而已。\n\
    \n讀者可以發現，向下突破與隨後的下跌過程，成交量都不大，甚至小於三角形排列過程小型頭部的成交量。可是，正如我們稍早不斷強調的，跌勢不同於漲勢，成交量並非必要條件。\n\
    \n一直到第一波跌勢末期，成交量才開始出現。請注意，不論是上升或下降，小型走勢末期通常都會發生大量。\n\n請注意，4月中旬的上升旗形發生大量，這個排列的下檔衡量目標大約是在1個月之後完成。\n\
    \n隨後一年半之內，NOC股價再也沒有回升到31。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_246_0.png)\n\
    \n圖243. 前一份圖形涵蓋1954~55年的走勢，目前這份圖形則涵蓋1956年下半年與1957年初的走勢。我們要知道：主要下降趨勢是否仍然有效？或已經出現重要的向上轉折？\n\
    \n如同往常一樣，成交量是觀察重點。請注意月14日與24日的小型峰位，成交量明顯放大。9月份的向下整理過程，成交量萎縮。然後，10月中旬的小型峰位成交量又放大。回檔走勢再度量縮，回升走勢把價格推高到$25\
    \ 1/2$；12月中旬，整個排列已經相當清楚，這是上限水平狀的上升三角形。\n\n12月10日，價格向上突破，突破的有效性無庸置疑；隨後兩個星期的回檔走勢，成交量顯著縮小，這可以更進一步確認先前的突破。2月初，價格再度夾著大量創新高。\n\
    \n截至本文撰寫當時（編者附註：1957年），我們還不能說NOC是否會持續目前的漲勢，甚至攻克31的壓力。可是，我們認為，由2月份開始，NOC已經處於上升趨勢，除非有明顯的反向證據，否則應該推定股價將維持目前的上升趨勢。如果股價可以挺進到$30~31$附近，很可能會發生一段整理走勢，出現明確的型態排列，然後再設法向上突破31。\n\
    \n順便提及一點，上圖圖形涵蓋期間內，許多飛機製造業者，股價都普遍下跌。\n"
