    # 股價趨勢技術分析(下冊)


    阱、人為操縱、傲慢、炒作、欺瞞、月亮盈缺、太陽黑子、經濟循環與相關信念、大眾情緒、人們想要證明自己正確的無法克制慾望……等。


    圖形排列是市場傳遞訊息的語言，告訴我們某支股票的垂死掙扎，顯示某支股票即將一飛沖天，透露某支股票正在進行生死關頭的戰爭，預示某支股票的買方已經擊敗賣方，價格即將向上突破。


    總之，這是人們從事僅次於血淋淋戰爭的最劇烈掙扎，所遺留下來的指紋。


    如同佛洛伊德呈現人類的心理層面一樣，愛德華與馬基關心的是金融市場，呈現的是人類的心靈與情緒。他們不只能夠精準呈現這些現象，而且還提供解釋的方法，能夠從這些人類行為中攫取利益。在人工智慧與電腦科技能夠產生重大突破之前，我們很難想像這方面的知識還能更進一步。


    # 既然是經典，為何要有新版？


    不同於法國星象學家諾斯特德拉馬斯（Nostradamus）與法國科幻小说家茱利斯·佛尼（Jules Verne）或很多當代投資顧問，作者沒有水晶球或時光機器。馬基不曉得將來會發明電腦，所以只採用了計算尺。即使知道將來會有電腦，大概也沒有想到其運算能力與普及程度竟然會發展到這種程度。總之，時間經過與科學進步。


    非常令人訝異的，本書絕大部分內容完全沒有更新的必要。還有誰能夠更精準描述圖形排列，說明其意義呢？


    可是，為了反映科技進步，以及市場結構與性質的變動，則又是另一回事了。人性或許不會改變，但21世紀的市場結構與性質似乎就代表變動。市場的管理法規雖然未必一致，但相關變動基本上是朝向'
  - '[PAGE 17]


    的方向發展，更有利於投資人與商業用途使用者。當然，霸菱銀行與其他某些機構則屬例外。


    # 新增內容反映時代、科技與市場變動


    大體上說，新增添內容、附註或更新資料，是要讓一般讀者瞭解投資成功的相關必要條件。當然，由於所涉及的資料實在太多，所以我們並不打算提供絕對完整的資訊。這部分努力，只希望讓讀者能夠由適當的立足點看待金融市場；如果各位願意的話，也提供一些資料與指引，讓讀者能夠做進一步研究。事實上，各位詳細閱讀本書正文之後，還可以在本書附錄找到相關的「參考資料」。


    各位甚至可以只運用本書提供的知識（還有紙、筆、尺與繪圖紙）而在金融市場獲致成功。


    # 科技


    為了讓本書能夠當作手冊或指南，因應第21世紀的金融市場，第5版與第7版需要增添一些新內容。顯然地，科技神速進步的事實需要被處理，並且擺在原來的架構上呈現分析方法與內容。為了要在這個強悍的新世界獲得成功，投資人必須瞭解如何運用電子化市場、網際網路、微電腦、無線電傳輸，以及市場提供的任何可想像新奇產品。


    進階投資人也應該要瞭解一些金融、投資理論與相關科技的新發展，例如：布萊克-薛里斯選擇權訂價模型（Black-Scholes Model）、現代投資組合理論（Modern
    Portfolio Theory）、量化分析（Quantitative Analysis）。很幸運的，我們沒有必要在這裡處理這些議'
