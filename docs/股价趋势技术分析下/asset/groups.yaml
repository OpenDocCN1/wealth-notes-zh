  md: "\n# 股價趨勢技術分析（下冊）\n\n交易系統的成分之間，存在複雜的關係。換言之，除非考慮進場、資金管理與其他因素，否則沒有辦法恰當評估獲利了結的出場策略。\n\
    \n成功部位究竟如何獲利了結，這是交易最重要的關鍵之一，但很少人能夠體會其重要性。總之，這往往代表成敗之間的分野。\n\n### 龜族出場策略\n\n系統1出場：價格一旦跌破10天期低點，則結束多頭部位；價格一旦穿越10天期高點，則結束空頭部位。換言之，只要價格反向穿越10天期極端價，部位的所有單位都必須出場。\n\
    \n系統2出場：價格一旦跌破20天期低點，則結束多頭部位；價格一旦穿越20天期高點，則結束空頭部位。換言之，只要價格反向穿越20天期極端價，部位的所有單位都必須出場。\n\
    \n如同進場的情況一樣，龜族部位實際遁入獲利了結的停止單，而是密切留意行情的發展，一旦出場訊號出現，才打電話給經紀人，下單結束部位。\n\n### 出場法則最困難\n\
    \n對於多數交易者來說，龜族的獲利了結出場策略，可能是最難以付诸執行的部分。等待價格反向突破10天或20天期極端價，可能意味著我們必須眼睜睜看著20%、40%或甚至100%的既有獲利化為一場空。\n\
    \n想要提早獲利了結的衝動，是可以理解的。唯有紀律嚴明的交易者，才能為了掌握重大走勢而看著既有獲利消失。總之，為了掌握真正的賺錢機會，往往必須做這種犧牲；可是，這也正是頂尖交易者與一般交易者之間的分野。\n\
    \n## 第7章 戰術\n\n關於龜族交易系統的其他雜項規定。\n\n著名建築師密斯·范·德·羅厄（Mies van der Rohe），談到克制的時候，曾經說過：「上帝隱於細節」（God\
    \ is in the details）。交易系統的情況也是如此。接下來，我們準備討論一些龜族交易法則運用上，可能顯著影響續效差異的細節。\n\n## 進場交易指令\n\
    \n如同前文曾經提到的，理查·丹尼斯與威廉·艾克哈特建議龜族不要採用停止單（停損單）。龜族會留意行情發展，一旦預設的停止價位遭到觸及，才實際逃單。\n\n\
    另外，龜族也被告知，一般情況下，限價單優於市價單，因為限價單的成交價格與滑移價差程度都優於市價單。\n\n任何市場都會有買進報價與賣出報價。買進報價顯示買方願意買進的價位，賣出報價則顯示賣方願意賣出的價位。任何時候，如果買進報價超過賣出報價，交易就發生了。如果流動性足夠充裕，市價買單會成交於賣出報價，市價賣單會成交於買進報價；如果市價單的規模很大，則實際成交價格可能變得更糟。\n\
    \n一般來說，市場價格多少都會呈現隨機走勢，也就是沒有明顯意義的波動。採用限價單，就是希望能夠成交於這種隨機波動的最有利一端。限價單如果不大，不至於影響行情；如果交易指令涉及的數量很大，限價單對於行情的影響程度，絕對會小於市價單。\n\
    \n至於如何設定限價單的價位呢？這涉及一些技巧，但只要經過一些練習，價格限定在市價附近的限價單，撮合價格應該都會優於市價單。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_446_0.png)\n\
    \n## 快速發展的行情\n\n有時候，行情的發展非常快，我們遞入的限價單根本來不及成交。碰到這種市況，幾分鐘之內，每口契約的輸贏可能就是好幾千塊。\n\n\
    這種情況下，龜族的訓練是「不得驚慌」，靜待市場恢復秩序，然後才下單。\n\n多數初學者很難應付這種場面。他們會激動或恐慌，遞入市價單追價。這種時候採用市價單，往往是最不恰當的，換言之，市價單通常成交於當天最糟的價位。\n\
    \n行情變動快速，市場流動性會暫時消失。如果行情飆漲，賣方會暫時保持觀望，等待更好的價格。這種情況下，賣出報價會掛在很高位置，買進與賣出報價之間的差距會拉得很開。\n\
    \n由於賣方不斷提高賣價，買方如果真的想買進，就必須提高買價，這種情況一旦發展到某種程度，最後會吸引新的賣盤進場，行情也會恢復穩定，而且經常會朝相反方向做修正。\n\
    \n在快速上漲的行情中，如果遞入市價單買進，經常會買在最高點，通常也就是賣盤受不了引誘而大量進場的價位。\n\n對於龜族來說，我們會等待，直到至少有某種徵兆顯示行情已經暫時折返，然後我們才會下單，如此的成交價格通常都優於市價單。行情回穩之後，如果價格已經穿越我們設定的停止價位，那就結束部位，但不是恐慌的情況下結束部位。\n\
    \n## 同時發生的進場訊號\n\n很多時候，市場可能連續好幾天沒有行情，我們除了留意手頭上的既有部位之外，沒有什麼事情可以做。我們經常連續好幾天沒有下單。另一些情況下，交易訊號可能每隔好幾個鐘頭出現一次。對於這種情況，我們就根據規定處理訊號，直到部位到達最高限度為止。\n\
    \n可是，有時候，幾乎每件事都會同時發生，我們也會在一、兩天之內由空手而載滿部位。一般來說，高度相關市場會一起產生訊號，使得整個步調更瘋狂。\n\n如果進場訊號受到跳空開盤引發，情況更是如此。我們可能看到熱燃油、原油、無鉛汽油等市場，同時在開盤時段出現買進訊號。對於期貨來說，各種不同交割月份的契約，也很可能同時出現訊號。\n\
    \n## 趁著強勢買進，弱勢賣出\n\n如果許多市場同時出現訊號，我們會買進最強勢的市場，或放空最弱勢的市場。\n\n對於特定市場，我們同一個時間只會進場一單位。舉例來說，我們不會同時買進2月份、3月份與4月份熱燃油，我們會挑選最強勁、流動性最高的交割月份。\n\
    \n這點很重要。在某相關產品類別內，最好的多頭部位應該建立在走勢最強勁的市場（其表現幾乎一定勝過相同類別的其他市場）。同理，最好的空頭部位應該建立在走勢最弱的市場。\n\
    \n我們龜族有一些方法可以衡量行情的強弱程度。最簡單、最常用的辦法，就是直接觀察走勢圖，看哪個市場看起來最強或最弱。\n\n有些人會估計價格由突破點起算，已經出現幾個N的走勢，然後買進最強者（N個數最多者）。\n\
    \n另一些人會計算目前與3個月前的價格差距，然後除以目前的N進行常態化。最強勢的市場，前述數值最大，最弱勢的市場，數值最小。\n\n任何這些方法都可以採用。重點是，多頭部位應該建立在最強勁市場，空頭部位應該建立在最弱勢市場。\n\
    \n## 到期展延\n\n期貨契約到期展延為新契約之前，需要考慮兩項重要因素。\n\n第一，很多情況下，最近交割月份契約的趨勢很顯著，但遠月份契約則沒有類似的價格走勢。所以，除非遠月份契約呈現既有部位的類似價格走勢，否則不做展延。\n\
    \n第二，契約展延必須在成交量與未平仓量還沒有顯著下降之前進行。何謂顯著下降，當然取決於部位規模。原則上，龜族都會在既有契約到期之前的幾個星期之前進行展延，除非當時持有的既有月份契約，其價格表現明顯優於遠月份契約。\n\
    \n## 結語\n\n以上就是完整龜族交易系統的法則。各位或許認為，並不複雜！\n\n可是，瞭解這些法則，並不能實際幫助各位，除非各位能夠嚴格遵守。\n\n\
    請記住，理查·丹尼斯說過：「各位隨時可以把我的交易法則公布在報紙上，因為沒有人會遵循。關鍵是一致性與紀律。幾乎任何人都可以擬定一份類似的法則，甚至不會顯著比我們的法則差。可是，問題是這些人沒有辦法嚴格遵守法則，尤其是在情況不順利的時候。」——摘錄自傑克·史瓦格的《金融怪傑》(中文版，請參閱寰宇出版公司)。\n\
    \n關於前一段的評論，最直接的證據就是龜族交易者本身的表現；很多龜族成員也沒有賺錢。這不是因為這套法則沒用，而是因為交易者不能嚴格遵守法則。同樣地，各位閱讀這份文件，卻只有少數人能夠成功運用龜族交易法則。這不是因為這些法則無效，而是因為多數讀者沒有足夠的信心。\n\
    \n龜族法則之所以不容易執行，主要是因為真正的致勝趨勢之間，經常間隔很長一段時間。換言之，交易者可能在連續幾個月，甚至長達1、2年的期間內，持續發生虧損。處在這段艱困期間內，很容易產生懷疑而放棄系統：\n\
    \n- 萬一交易法則已經失效，那麼怎麼辦？\n- 如果行情性質已經改變了呢？\n- 我是不是忽略交易法則內的某些重要事項？\n- 我怎麼知道這套法則確實有用？\n\
    \n龜族的第一期學員，有位交易者在第一年結束之前就被開除了，他始終相信理查故意隱瞞了一些真正的秘訣。這位交易者沒有辦法面對一項簡單的事實：他的操作績效不佳，是因為他心中存疑，沒有安全感，這使得他不能嚴格遵守交易法則。\n\
    \n還有另一個問題：很多人經常想要修改交易法則。有些龜族，為了減少系統承擔的風險，往往會稍微修改交易法則，但結果總是適得其反。\n\n舉例來說，有些人故意拖延建立部位的時間（每隔1/2個N加碼1單位）。表面上看起來，這似乎比較保守一點，但就龜族使用的系統來說，延遲加碼可能造成折返走勢比較容易觸及既有停損，結果造成不必要的虧損。在某種市況下，這種細微的變動，就可能顯著影響系統的獲利能力。\n\
    \n不論是龜族系統、其他類似系統，或是完全不同性質的系統，為了培養必要的信心，使用者必須自己利用歷史資料進行測試。道聽途說絕對是不夠的；各位也不能聽信別人的研究結果。總之，一切都必須自己來過。\n\
    \n不要介意把手弄髒，自己進行必要的研究。實際瞭解交易的狀況，仔細觀察每天的淨值變動，讓自己充分熟悉交易系統的運作程序，體會可能發生的連續虧損程度。\n\n\
    萬一碰到連續8個月的虧損期間，如果我們知道這套系統過去20年來，經常碰到類似程度的連續虧損，或許就比較容易忍受。如果我們知道儘快加碼能夠提升系統的獲利能力，或許就能夠更及時採取行動。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_450_0.png)\n\n## 第8章 進階研究\n\n然後呢？實際經驗是不可取代的。\n\
    \n幽默作家Barry Le Platter說：「好的判斷力來自於經驗，經驗則來自於差的判斷力。」如果想成為交易者，就必須進行交易。沒有其他辦法。而且，我們都會犯錯。\n\
    \n犯錯是交易不可避免的部分。除非各位開始用實際的資金進行交易，而且是輸贏足以造成真正影響的大筆資金，各位就不能學到交易的教訓。紙上模擬不能取代實際資金的交易。如果沒有真正投入資金，就不能體會「期待」、「恐懼」、「貪婪」會如何造成影響。\n\
    \n另外，各位也要徹底瞭解交易的根本性質。透過這方面的知識，交易過程比較不容易犯錯，也比較容易由錯誤中汲取經驗。\n\n以下列舉一些進階研究的方向：\n\n\
    ## 交易心理\n\n交易心理是至關重要的，務必要瞭解自己的個性，這與交易績效之間會有密切關連。整個學習過程，是要真誠而開放地設法瞭解真正的自己，而不是找到一本神奇的心理學教科書尋找所有的答案。\n\
    \n## 資金管理\n\n對於機械化交易系統來說，資金管理是非常重要的。唯有適當地控制風險，交易者才能安然渡過不可避免的連續虧損，如此才能讓一套好系統有發揮獲利潛能的機會。然而，關於進場訊號、出場與資金管理之間的互動關係，有時候不是很明顯的。好好研究最先進的資金管理技巧，絕對是有幫助的。\n\
    \n## 交易研究\n\n設計機械化交易系統的過程，絕對需要採用歷史資料，做統計上有效的測試。換言之，讓交易系統根據歷史資料進行交易，看看績效如何，電腦可以從事這方面的測試。\n\
    \n討論曲線套入（curve-fitting）、過度最佳化（over-optimization）、交易系統測試統計知識與測試方法的資訊，可以在網路或相關書籍內找到。總之，心胸要開放，但也要保持適當的質疑態度，各位的研究一定會帶來效益的。\n\
    \n## 最後的警語\n\n很多自稱為「專家」的人，總是想要推銷自己或其建議。對於這些人宣稱的一切，千萬不要輕易相信。如果各位需要建議的話，應該找那些不會推銷自己的人，以及那些實際由交易賺錢的人。關於如何交易成功，有很多書籍與傳記值得參考。\n\
    \n學習如何成為優秀的交易者，甚至是頂尖的交易者，這是可能的，但需要非常辛勤的工作，也要保持適當的懷疑。如果各位決定踏上這條路，旅程將沒有終點。那些持續成功的人，永遠不會到達目的地，但過程將充滿愉悅。\n\
    \n## 名詞解釋\n\n編者附註：名詞解釋是本書第7版編輯理查·麥德莫特的貢獻。些許修改，附有說明。\n\n第9版附註：某些條文是由其他分析師提供，適當場合會註明分析師的名字。\n\
    \n- **Accumulation（承接）：** 多頭市場的第一階段。這段期間內，有遠見的投資人開始買進股票，那些覺得沮喪、挫折的賣方持續出場。當時的經濟狀態通常最惡劣，一般大眾對於股票市場深惡痛絕。成交量很少，但漲勢開始出現成交量擴大的現象。\n\
    - **Activity（交投）：** 參見「成交量」（Volume）。\n- **ADX（Average Directional Movement Index）（平均趨向變動指數）：**\
    \ ADX是威爾斯·韋達（Welles Wilder）根據趨向變動概念設計的順勢指標，用以衡量證券的趨勢程度。ADX經常可以用來避開沒有明確趨勢的市場，並在趨勢程度到達某水準時，發出訊號。如果沒有明顯趨勢，ADX會提供「避開」的指示。\n\
    \    - 趨向變動值是衡量特定期間的價格淨變動總值。首先，計算正數與負數的趨向變動值，這是分別計算向上與向下的高、低價區間超出部分，然後分別除以真實區間作為常態化，並表示為百分率格式。\n\
    \    - ADX是取代趨向變動值的指數移動平均與比率。ADX通常與另一項指標ADXR繪製在一起。ADXR是ADX的移動平均。\n    - ADX上升代表顯著的趨向變動，也表示市況愈來愈適合交易。ADX下降則意味著當時的市況不適合順勢系統進行交易。一般來說，ADX大於25，代表趨向變動很顯著，適合進行交易。\n\
    - **Apex（頂點）：** 最高點，三角形排列的端點。\n- **Arbitrage（套利）：** 同時買進與賣出兩種不同而高度相關的證券，藉以賺取兩者之間的差價利潤。編者附註：對於購併交易，買進購併者股票而賣出被購併者股票，這類交易也經常被稱為套利，事實上不正確的用法。這種交易屬於價差交易，不適稱之為套利。\n\
    - **Area Gap（區域缺口）：** 參見「普通缺口」（Common Gap）。\n- **Area Pattern（區域型態）：** 當股票或商品的上升或下降動能暫時耗盡，隨後出現的橫向走勢，通常會呈現特定格式的行狀。某些條件下，這些區域型態（或排列）具有預測上的功能。參照「上升三角形」（Ascending\
    \ Triangle）、「擴漲排列」（Broadening Formation）、「下降三角形」(Descending Triangle)、「菱形」(Diamond)、「旗形」(Flag)、「頭肩排列」(Head—And—Shoulders)、「逆向三角形」(Inverted\
    \ Triangle)、「三角旗形」(Pennant)、「矩形」(Rectangle)、「直角三角形」(Right Angle Triangles)、「等腰三角形」(Symmetrical\
    \ Triangle)與「楔形」(Wedges)。\n- **Arithmetical Scale（算術刻度）：** 縱軸上的價格或成交量刻度（換言之，垂直距離），一律代表相同的金額或股數。\n\
    - **Ascending (Parallel) Trend Channel（上升〔平行狀〕趨勢通道）：** 上升趨勢發展過程，漲勢峰位經常可以銜接為一條直線（稱為「折返趨勢線」），這條直線與基本趨勢線相互平行（基本趨勢線是銜接波浪狀走勢谷底的直線，其斜率向上），這兩條平行線所夾的區域，稱為「上升通道」（Ascending\
    \ or Up Channel）。\n- **Ascending (Up) Trendline（上升趨勢線）：** 股票或商品價格的上升波浪，是由一系列漣漪構成。如果這些漣漪的底部，可以銜接為（或十分接近）一條斜率向上的直線，就是基本的上升趨勢線。\n\
    - **Ascending Triangle（上升三角形）：** 這屬於「直角三角形」的一種區域型態，其特色是三角形兩條邊界之一，幾乎呈現水平狀，與另一條邊界相互收斂。如果上限為水平狀，則下限向上傾斜，兩條邊界向右收斂，這種型態稱為「上升三角形」，具多頭意味，價格通常朝水平狀上限突破。衡量公式：由突破點向上衡量三角形內部的最寬距離。\n\
    - **At—The—Money（價平）：** 選擇權術語，是指選擇權履約價格等於根本契約價格。\n- **Averages（股價指數，平均）：** 參見「道瓊工業指數」(Dow—Jones\
    \ Industrial Average)、「移動平均」(Moving Average)、「道瓊運輸指數」 (Dow—Jones Transportation\
    \ Average)、「道瓊公用事業指數」 (Dow—Jones Utility Average)。\n- **Averaging Cost (攤平成本)：**\
    \ 投資人在不同價格分批買進股票或商品的一種方法。如果根據較低價格分批買進，稱為「向下攤平」 (Averaging Down)；如果根據較高價格分批買進，稱為「向上攤平」\
    \ (Averaging Up)。\n- **Axis (座標軸，軸心)：** 繪製圖形的座標軸，是衡量刻度的一條基準直線。有時候，「軸」也代表排列內真實或想像的一條直線，整個排列能夠以「軸心」為準而旋轉。\n\
    - **Balanced Program (平衡式交易計畫)：** 將資本 (或一部份資本) 劃分為兩等份，分別做多與做空市場。\n- **Bar Chart\
    \ (長條圖)：** 又稱為「線路圖」 (line chart)。利用圖形表示價格資料的一種方法，以一條垂直線段銜接特定時間單位內最高價與最低價；開盤價在線段左側標示為小橫劃，收盤價在線段右側標示為小橫劃。長條圖可以取任何長度的時間單位，只要該時間單位可以提供繪圖用的價格資料。最常見的時間單位是小時、天、週與月。可是，隨著個人電腦與即時報價系統的普及化，交易者往往可以根據「分鐘」為單位繪製長條圖。\n\
    - **Basic Trendlines (基本趨勢線)：** 參見「趨勢線」 (Trendlines)。\n- **Basing Point (基準點)：**\
    \ 價格走勢圖上，決定停止價位的重要參考點。當技術條件發生變化時，基準點與停止點可以調高 (多頭部位發生有利漲勢) 或調低 (空頭部位發生有利跌勢)。參見「逐次停止單」\
    \ (Progressive Stops)。\n- **Basis Points (基點)：** 債券殖利率的衡量單位，每基點等於0.01%的殖利率。\n\
    - **Basket Trades（一籃交易）：** 由多種股票構成的大筆交易。\n- **Bear Market（空頭市場）：** 簡言之，空頭市場是指價格基本上處於跌勢的一段期間（通常很長）。空頭市場大体上是由三個階段構成。第一階段是「出貨」，第二階段是「恐慌」，第三階段是「消耗」，即使投資人持股超過第一與第二階段，往往也耐不住第三階段的折磨而賣出股票。\n\
    - **Bent Neckline（彎曲的頸線）：** 參見「頸線」（Neckline）。\n- **Beta（貝他）：** 對於行情攪動很敏感。\n- **Beta\
    \ (Coefficient)（貝他係數）：** 一種數據，衡量證券市場風險（也就是未分散風險）。\n- **Block Trades（巨額交易）：** 就特定股票而言，數量很大的單筆交易。\n\
    - **Blow—Off（噴出行情，飆漲）：** 參見「高潮頭部」（Climactic Top）。\n- **Blue Chips（藍籌股）：** 這是指盈餘績效果理想與價格穩定的績優股。又稱為「金邊證券」（\
    \ gilt-edged securities）。例如：IBM、AT & T、通用汽車、奇異電器等。\n- **Blue Parallel（藍色平行線）：**\
    \ 由某谷底開始繪製的一條直線，該直線與藍色趨勢線（參見「藍色趨勢線」的定義）平行，藉以衡量次一個低點。\n- **Blue Trendline（藍色趨勢線）：**\
    \ 銜接至少兩個峰位的直線。為了避免混淆，愛德華與馬基利用「藍線」代表峰位所繪製的趨勢線，「紅線」代表谷底所繪製的趨勢線。\n- **Bollinger Bands（BB）（包寧傑帶狀）：**\
    \ 包寧傑帶狀是由兩條\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_456_0.png)\n"
  mdcn: "\n# 股價趨勢技術分析（下冊）\n\n交易系統的成分之間，存在複雜的關係。換言之，除非考慮進場、資金管理與其他因素，否則沒有辦法恰當評估獲利了結的出場策略。\n\
    \n成功部位究竟如何獲利了結，這是交易最重要的關鍵之一，但很少人能夠體會其重要性。總之，這往往代表成敗之間的分野。\n\n### 龜族出場策略\n\n系統1出場：價格一旦跌破10天期低點，則結束多頭部位；價格一旦穿越10天期高點，則結束空頭部位。換言之，只要價格反向穿越10天期極端價，部位的所有單位都必須出場。\n\
    \n系統2出場：價格一旦跌破20天期低點，則結束多頭部位；價格一旦穿越20天期高點，則結束空頭部位。換言之，只要價格反向穿越20天期極端價，部位的所有單位都必須出場。\n\
    \n如同進場的情況一樣，龜族部位實際遁入獲利了結的停止單，而是密切留意行情的發展，一旦出場訊號出現，才打電話給經紀人，下單結束部位。\n\n### 出場法則最困難\n\
    \n對於多數交易者來說，龜族的獲利了結出場策略，可能是最難以付诸執行的部分。等待價格反向突破10天或20天期極端價，可能意味著我們必須眼睜睜看著20%、40%或甚至100%的既有獲利化為一場空。\n\
    \n想要提早獲利了結的衝動，是可以理解的。唯有紀律嚴明的交易者，才能為了掌握重大走勢而看著既有獲利消失。總之，為了掌握真正的賺錢機會，往往必須做這種犧牲；可是，這也正是頂尖交易者與一般交易者之間的分野。\n\
    \n## 第7章 戰術\n\n關於龜族交易系統的其他雜項規定。\n\n著名建築師密斯·范·德·羅厄（Mies van der Rohe），談到克制的時候，曾經說過：「上帝隱於細節」（God\
    \ is in the details）。交易系統的情況也是如此。接下來，我們準備討論一些龜族交易法則運用上，可能顯著影響續效差異的細節。\n\n## 進場交易指令\n\
    \n如同前文曾經提到的，理查·丹尼斯與威廉·艾克哈特建議龜族不要採用停止單（停損單）。龜族會留意行情發展，一旦預設的停止價位遭到觸及，才實際逃單。\n\n\
    另外，龜族也被告知，一般情況下，限價單優於市價單，因為限價單的成交價格與滑移價差程度都優於市價單。\n\n任何市場都會有買進報價與賣出報價。買進報價顯示買方願意買進的價位，賣出報價則顯示賣方願意賣出的價位。任何時候，如果買進報價超過賣出報價，交易就發生了。如果流動性足夠充裕，市價買單會成交於賣出報價，市價賣單會成交於買進報價；如果市價單的規模很大，則實際成交價格可能變得更糟。\n\
    \n一般來說，市場價格多少都會呈現隨機走勢，也就是沒有明顯意義的波動。採用限價單，就是希望能夠成交於這種隨機波動的最有利一端。限價單如果不大，不至於影響行情；如果交易指令涉及的數量很大，限價單對於行情的影響程度，絕對會小於市價單。\n\
    \n至於如何設定限價單的價位呢？這涉及一些技巧，但只要經過一些練習，價格限定在市價附近的限價單，撮合價格應該都會優於市價單。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_446_0.png)\n\
    \n## 快速發展的行情\n\n有時候，行情的發展非常快，我們遞入的限價單根本來不及成交。碰到這種市況，幾分鐘之內，每口契約的輸贏可能就是好幾千塊。\n\n\
    這種情況下，龜族的訓練是「不得驚慌」，靜待市場恢復秩序，然後才下單。\n\n多數初學者很難應付這種場面。他們會激動或恐慌，遞入市價單追價。這種時候採用市價單，往往是最不恰當的，換言之，市價單通常成交於當天最糟的價位。\n\
    \n行情變動快速，市場流動性會暫時消失。如果行情飆漲，賣方會暫時保持觀望，等待更好的價格。這種情況下，賣出報價會掛在很高位置，買進與賣出報價之間的差距會拉得很開。\n\
    \n由於賣方不斷提高賣價，買方如果真的想買進，就必須提高買價，這種情況一旦發展到某種程度，最後會吸引新的賣盤進場，行情也會恢復穩定，而且經常會朝相反方向做修正。\n\
    \n在快速上漲的行情中，如果遞入市價單買進，經常會買在最高點，通常也就是賣盤受不了引誘而大量進場的價位。\n\n對於龜族來說，我們會等待，直到至少有某種徵兆顯示行情已經暫時折返，然後我們才會下單，如此的成交價格通常都優於市價單。行情回穩之後，如果價格已經穿越我們設定的停止價位，那就結束部位，但不是恐慌的情況下結束部位。\n\
    \n## 同時發生的進場訊號\n\n很多時候，市場可能連續好幾天沒有行情，我們除了留意手頭上的既有部位之外，沒有什麼事情可以做。我們經常連續好幾天沒有下單。另一些情況下，交易訊號可能每隔好幾個鐘頭出現一次。對於這種情況，我們就根據規定處理訊號，直到部位到達最高限度為止。\n\
    \n可是，有時候，幾乎每件事都會同時發生，我們也會在一、兩天之內由空手而載滿部位。一般來說，高度相關市場會一起產生訊號，使得整個步調更瘋狂。\n\n如果進場訊號受到跳空開盤引發，情況更是如此。我們可能看到熱燃油、原油、無鉛汽油等市場，同時在開盤時段出現買進訊號。對於期貨來說，各種不同交割月份的契約，也很可能同時出現訊號。\n\
    \n## 趁著強勢買進，弱勢賣出\n\n如果許多市場同時出現訊號，我們會買進最強勢的市場，或放空最弱勢的市場。\n\n對於特定市場，我們同一個時間只會進場一單位。舉例來說，我們不會同時買進2月份、3月份與4月份熱燃油，我們會挑選最強勁、流動性最高的交割月份。\n\
    \n這點很重要。在某相關產品類別內，最好的多頭部位應該建立在走勢最強勁的市場（其表現幾乎一定勝過相同類別的其他市場）。同理，最好的空頭部位應該建立在走勢最弱的市場。\n\
    \n我們龜族有一些方法可以衡量行情的強弱程度。最簡單、最常用的辦法，就是直接觀察走勢圖，看哪個市場看起來最強或最弱。\n\n有些人會估計價格由突破點起算，已經出現幾個N的走勢，然後買進最強者（N個數最多者）。\n\
    \n另一些人會計算目前與3個月前的價格差距，然後除以目前的N進行常態化。最強勢的市場，前述數值最大，最弱勢的市場，數值最小。\n\n任何這些方法都可以採用。重點是，多頭部位應該建立在最強勁市場，空頭部位應該建立在最弱勢市場。\n\
    \n## 到期展延\n\n期貨契約到期展延為新契約之前，需要考慮兩項重要因素。\n\n第一，很多情況下，最近交割月份契約的趨勢很顯著，但遠月份契約則沒有類似的價格走勢。所以，除非遠月份契約呈現既有部位的類似價格走勢，否則不做展延。\n\
    \n第二，契約展延必須在成交量與未平仓量還沒有顯著下降之前進行。何謂顯著下降，當然取決於部位規模。原則上，龜族都會在既有契約到期之前的幾個星期之前進行展延，除非當時持有的既有月份契約，其價格表現明顯優於遠月份契約。\n\
    \n## 結語\n\n以上就是完整龜族交易系統的法則。各位或許認為，並不複雜！\n\n可是，瞭解這些法則，並不能實際幫助各位，除非各位能夠嚴格遵守。\n\n\
    請記住，理查·丹尼斯說過：「各位隨時可以把我的交易法則公布在報紙上，因為沒有人會遵循。關鍵是一致性與紀律。幾乎任何人都可以擬定一份類似的法則，甚至不會顯著比我們的法則差。可是，問題是這些人沒有辦法嚴格遵守法則，尤其是在情況不順利的時候。」——摘錄自傑克·史瓦格的《金融怪傑》(中文版，請參閱寰宇出版公司)。\n\
    \n關於前一段的評論，最直接的證據就是龜族交易者本身的表現；很多龜族成員也沒有賺錢。這不是因為這套法則沒用，而是因為交易者不能嚴格遵守法則。同樣地，各位閱讀這份文件，卻只有少數人能夠成功運用龜族交易法則。這不是因為這些法則無效，而是因為多數讀者沒有足夠的信心。\n\
    \n龜族法則之所以不容易執行，主要是因為真正的致勝趨勢之間，經常間隔很長一段時間。換言之，交易者可能在連續幾個月，甚至長達1、2年的期間內，持續發生虧損。處在這段艱困期間內，很容易產生懷疑而放棄系統：\n\
    \n- 萬一交易法則已經失效，那麼怎麼辦？\n- 如果行情性質已經改變了呢？\n- 我是不是忽略交易法則內的某些重要事項？\n- 我怎麼知道這套法則確實有用？\n\
    \n龜族的第一期學員，有位交易者在第一年結束之前就被開除了，他始終相信理查故意隱瞞了一些真正的秘訣。這位交易者沒有辦法面對一項簡單的事實：他的操作績效不佳，是因為他心中存疑，沒有安全感，這使得他不能嚴格遵守交易法則。\n\
    \n還有另一個問題：很多人經常想要修改交易法則。有些龜族，為了減少系統承擔的風險，往往會稍微修改交易法則，但結果總是適得其反。\n\n舉例來說，有些人故意拖延建立部位的時間（每隔1/2個N加碼1單位）。表面上看起來，這似乎比較保守一點，但就龜族使用的系統來說，延遲加碼可能造成折返走勢比較容易觸及既有停損，結果造成不必要的虧損。在某種市況下，這種細微的變動，就可能顯著影響系統的獲利能力。\n\
    \n不論是龜族系統、其他類似系統，或是完全不同性質的系統，為了培養必要的信心，使用者必須自己利用歷史資料進行測試。道聽途說絕對是不夠的；各位也不能聽信別人的研究結果。總之，一切都必須自己來過。\n\
    \n不要介意把手弄髒，自己進行必要的研究。實際瞭解交易的狀況，仔細觀察每天的淨值變動，讓自己充分熟悉交易系統的運作程序，體會可能發生的連續虧損程度。\n\n\
    萬一碰到連續8個月的虧損期間，如果我們知道這套系統過去20年來，經常碰到類似程度的連續虧損，或許就比較容易忍受。如果我們知道儘快加碼能夠提升系統的獲利能力，或許就能夠更及時採取行動。\n\
    \n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_450_0.png)\n\n## 第8章 進階研究\n\n然後呢？實際經驗是不可取代的。\n\
    \n幽默作家Barry Le Platter說：「好的判斷力來自於經驗，經驗則來自於差的判斷力。」如果想成為交易者，就必須進行交易。沒有其他辦法。而且，我們都會犯錯。\n\
    \n犯錯是交易不可避免的部分。除非各位開始用實際的資金進行交易，而且是輸贏足以造成真正影響的大筆資金，各位就不能學到交易的教訓。紙上模擬不能取代實際資金的交易。如果沒有真正投入資金，就不能體會「期待」、「恐懼」、「貪婪」會如何造成影響。\n\
    \n另外，各位也要徹底瞭解交易的根本性質。透過這方面的知識，交易過程比較不容易犯錯，也比較容易由錯誤中汲取經驗。\n\n以下列舉一些進階研究的方向：\n\n\
    ## 交易心理\n\n交易心理是至關重要的，務必要瞭解自己的個性，這與交易績效之間會有密切關連。整個學習過程，是要真誠而開放地設法瞭解真正的自己，而不是找到一本神奇的心理學教科書尋找所有的答案。\n\
    \n## 資金管理\n\n對於機械化交易系統來說，資金管理是非常重要的。唯有適當地控制風險，交易者才能安然渡過不可避免的連續虧損，如此才能讓一套好系統有發揮獲利潛能的機會。然而，關於進場訊號、出場與資金管理之間的互動關係，有時候不是很明顯的。好好研究最先進的資金管理技巧，絕對是有幫助的。\n\
    \n## 交易研究\n\n設計機械化交易系統的過程，絕對需要採用歷史資料，做統計上有效的測試。換言之，讓交易系統根據歷史資料進行交易，看看績效如何，電腦可以從事這方面的測試。\n\
    \n討論曲線套入（curve-fitting）、過度最佳化（over-optimization）、交易系統測試統計知識與測試方法的資訊，可以在網路或相關書籍內找到。總之，心胸要開放，但也要保持適當的質疑態度，各位的研究一定會帶來效益的。\n\
    \n## 最後的警語\n\n很多自稱為「專家」的人，總是想要推銷自己或其建議。對於這些人宣稱的一切，千萬不要輕易相信。如果各位需要建議的話，應該找那些不會推銷自己的人，以及那些實際由交易賺錢的人。關於如何交易成功，有很多書籍與傳記值得參考。\n\
    \n學習如何成為優秀的交易者，甚至是頂尖的交易者，這是可能的，但需要非常辛勤的工作，也要保持適當的懷疑。如果各位決定踏上這條路，旅程將沒有終點。那些持續成功的人，永遠不會到達目的地，但過程將充滿愉悅。\n\
    \n## 名詞解釋\n\n編者附註：名詞解釋是本書第7版編輯理查·麥德莫特的貢獻。些許修改，附有說明。\n\n第9版附註：某些條文是由其他分析師提供，適當場合會註明分析師的名字。\n\
    \n- **Accumulation（承接）：** 多頭市場的第一階段。這段期間內，有遠見的投資人開始買進股票，那些覺得沮喪、挫折的賣方持續出場。當時的經濟狀態通常最惡劣，一般大眾對於股票市場深惡痛絕。成交量很少，但漲勢開始出現成交量擴大的現象。\n\
    - **Activity（交投）：** 參見「成交量」（Volume）。\n- **ADX（Average Directional Movement Index）（平均趨向變動指數）：**\
    \ ADX是威爾斯·韋達（Welles Wilder）根據趨向變動概念設計的順勢指標，用以衡量證券的趨勢程度。ADX經常可以用來避開沒有明確趨勢的市場，並在趨勢程度到達某水準時，發出訊號。如果沒有明顯趨勢，ADX會提供「避開」的指示。\n\
    \    - 趨向變動值是衡量特定期間的價格淨變動總值。首先，計算正數與負數的趨向變動值，這是分別計算向上與向下的高、低價區間超出部分，然後分別除以真實區間作為常態化，並表示為百分率格式。\n\
    \    - ADX是取代趨向變動值的指數移動平均與比率。ADX通常與另一項指標ADXR繪製在一起。ADXR是ADX的移動平均。\n    - ADX上升代表顯著的趨向變動，也表示市況愈來愈適合交易。ADX下降則意味著當時的市況不適合順勢系統進行交易。一般來說，ADX大於25，代表趨向變動很顯著，適合進行交易。\n\
    - **Apex（頂點）：** 最高點，三角形排列的端點。\n- **Arbitrage（套利）：** 同時買進與賣出兩種不同而高度相關的證券，藉以賺取兩者之間的差價利潤。編者附註：對於購併交易，買進購併者股票而賣出被購併者股票，這類交易也經常被稱為套利，事實上不正確的用法。這種交易屬於價差交易，不適稱之為套利。\n\
    - **Area Gap（區域缺口）：** 參見「普通缺口」（Common Gap）。\n- **Area Pattern（區域型態）：** 當股票或商品的上升或下降動能暫時耗盡，隨後出現的橫向走勢，通常會呈現特定格式的行狀。某些條件下，這些區域型態（或排列）具有預測上的功能。參照「上升三角形」（Ascending\
    \ Triangle）、「擴漲排列」（Broadening Formation）、「下降三角形」(Descending Triangle)、「菱形」(Diamond)、「旗形」(Flag)、「頭肩排列」(Head—And—Shoulders)、「逆向三角形」(Inverted\
    \ Triangle)、「三角旗形」(Pennant)、「矩形」(Rectangle)、「直角三角形」(Right Angle Triangles)、「等腰三角形」(Symmetrical\
    \ Triangle)與「楔形」(Wedges)。\n- **Arithmetical Scale（算術刻度）：** 縱軸上的價格或成交量刻度（換言之，垂直距離），一律代表相同的金額或股數。\n\
    - **Ascending (Parallel) Trend Channel（上升〔平行狀〕趨勢通道）：** 上升趨勢發展過程，漲勢峰位經常可以銜接為一條直線（稱為「折返趨勢線」），這條直線與基本趨勢線相互平行（基本趨勢線是銜接波浪狀走勢谷底的直線，其斜率向上），這兩條平行線所夾的區域，稱為「上升通道」（Ascending\
    \ or Up Channel）。\n- **Ascending (Up) Trendline（上升趨勢線）：** 股票或商品價格的上升波浪，是由一系列漣漪構成。如果這些漣漪的底部，可以銜接為（或十分接近）一條斜率向上的直線，就是基本的上升趨勢線。\n\
    - **Ascending Triangle（上升三角形）：** 這屬於「直角三角形」的一種區域型態，其特色是三角形兩條邊界之一，幾乎呈現水平狀，與另一條邊界相互收斂。如果上限為水平狀，則下限向上傾斜，兩條邊界向右收斂，這種型態稱為「上升三角形」，具多頭意味，價格通常朝水平狀上限突破。衡量公式：由突破點向上衡量三角形內部的最寬距離。\n\
    - **At—The—Money（價平）：** 選擇權術語，是指選擇權履約價格等於根本契約價格。\n- **Averages（股價指數，平均）：** 參見「道瓊工業指數」(Dow—Jones\
    \ Industrial Average)、「移動平均」(Moving Average)、「道瓊運輸指數」 (Dow—Jones Transportation\
    \ Average)、「道瓊公用事業指數」 (Dow—Jones Utility Average)。\n- **Averaging Cost (攤平成本)：**\
    \ 投資人在不同價格分批買進股票或商品的一種方法。如果根據較低價格分批買進，稱為「向下攤平」 (Averaging Down)；如果根據較高價格分批買進，稱為「向上攤平」\
    \ (Averaging Up)。\n- **Axis (座標軸，軸心)：** 繪製圖形的座標軸，是衡量刻度的一條基準直線。有時候，「軸」也代表排列內真實或想像的一條直線，整個排列能夠以「軸心」為準而旋轉。\n\
    - **Balanced Program (平衡式交易計畫)：** 將資本 (或一部份資本) 劃分為兩等份，分別做多與做空市場。\n- **Bar Chart\
    \ (長條圖)：** 又稱為「線路圖」 (line chart)。利用圖形表示價格資料的一種方法，以一條垂直線段銜接特定時間單位內最高價與最低價；開盤價在線段左側標示為小橫劃，收盤價在線段右側標示為小橫劃。長條圖可以取任何長度的時間單位，只要該時間單位可以提供繪圖用的價格資料。最常見的時間單位是小時、天、週與月。可是，隨著個人電腦與即時報價系統的普及化，交易者往往可以根據「分鐘」為單位繪製長條圖。\n\
    - **Basic Trendlines (基本趨勢線)：** 參見「趨勢線」 (Trendlines)。\n- **Basing Point (基準點)：**\
    \ 價格走勢圖上，決定停止價位的重要參考點。當技術條件發生變化時，基準點與停止點可以調高 (多頭部位發生有利漲勢) 或調低 (空頭部位發生有利跌勢)。參見「逐次停止單」\
    \ (Progressive Stops)。\n- **Basis Points (基點)：** 債券殖利率的衡量單位，每基點等於0.01%的殖利率。\n\
    - **Basket Trades（一籃交易）：** 由多種股票構成的大筆交易。\n- **Bear Market（空頭市場）：** 簡言之，空頭市場是指價格基本上處於跌勢的一段期間（通常很長）。空頭市場大体上是由三個階段構成。第一階段是「出貨」，第二階段是「恐慌」，第三階段是「消耗」，即使投資人持股超過第一與第二階段，往往也耐不住第三階段的折磨而賣出股票。\n\
