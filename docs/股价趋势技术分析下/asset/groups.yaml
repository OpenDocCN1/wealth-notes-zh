    ...題，因為一般投資人只需要紙筆與一台報價機，就可以進行交易，不過這是另一個故事了，本書稍後會探討。前述某些議題，本書會做適當的討論，然後提供一些參考資料供進一步研究之用。我認為，對於個人投資人來說，前述議題並沒有真正必要。一般投資人如果想和金融市場獲致成功，瞭解考克斯．羅斯．魯賓斯坦選擇權分析模型（Cox-Ross-Rubinstein
