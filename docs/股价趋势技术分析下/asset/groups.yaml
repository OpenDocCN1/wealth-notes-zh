    ## 投資與交易工具


    可供運用的投資與交易新工具，也需要考慮在內。若有如此廣泛的工具可供運用，兩位作者一定樂翻了。處在這個未來世界，他們可以交易股價指數本身（這也是本書最需要更新的部分）；採用期貨與選擇權契約做為投資與避險工具；運用許多過去所難以想像的套利策略；總之，就像踏進投資百貨公司一樣。如果能夠掌握圖形分析技巧，這些新產品的功能就可以大幅提昇。舉例來說，我認識的某位著名專業交易者，在下降走勢中銷售股票買權（反之亦然），就讓他海撈一筆；這對於技術交易者而言，是很明顯的，但絕對不是沒有經驗的業餘玩家可以嘗試的。運用這類技巧，有時候會造成破產，譬如1987年的大崩盤。


    ## 技術分析的變動與發展


    自從本書第5版發行以來，是否產生新的圖形排列（換言之，人性與人類行為是否發生改變）？就我所知，沒有，雖然某些人根據相同的資料，卻可以歸納出不同的結論。除了說我們有一些新的、不同的、較好的東西之外，還能說什麼呢？我們可以由不同的角度看待資料，這點很有意思，有時候甚至是很重要的，而且也可以帶來實際利益。我認識的某些交易者能夠有效運用圈又圈，陰陽線也能夠由不同角度處理資料。還有，由於獲得電腦的協助，很多技術分析家得以發展各種數值導向的分析工具：（經常採用令人迷惑的名稱）隨機指標、擺盪指標、指數或其他格式的移動平均，以及其他等等、等等、等等。本書並不打算詳細探討這些工具。等待將來另有機會吧。本書附錄提供簡略的探討，這是由第7版編輯理查·麥德莫特（Richard
    McDermott）整理的資料。


    我另外增添一些新篇幅（第18—A章）討論長期投資的問題，因為馬基在本書第II篇專門探討投機戰術。為了闡述投資組合管理與風險管理的新觀念，第24章與42章的內容做了很大的更動。我進一步探討韻律交易（rhythmic
    trading）的觀念，這是本書原稿稍微談到的。我也用更多篇幅說明趕路行情，如此更能說明1990年代的網際網路類股行情（第23章）。


    然後是思維基本架構（paradigms）。如同各位現在都知道的，當一切都失敗時，思維根本架構是基本分析者的最後避風港。


    ## 思維架構變動


    每當行情發展不再適用正常的股票價值評估標準（如同20世紀末的情況），基本分析者（那些相信可以根據盈餘、現金流量……等固定數據，藉以決定股票價值的人）就被迫變更思維架構。股票價值可以取決於本益比嗎？或者應該採用銷貨、現金流量、月亮盈缺或——如同1990年代末期的情況——採用虧損乘以價格來決定股票價值？技術分析者沒有必要被迫玩弄這些戲法。股票價值是取決市場目前的交易價格。


    ## 水晶球


    投資人會變得愈來愈聰明，首先是那些閱讀本書的人。至於專業玩家，可能還有一些優勢，因為他們的本性比較精明，因為他們花很多時間盤算如何掌握優勢，但這方面的優勢愈來愈不顯著。軟體與硬體會繼續進步，但不會變得更聰明。機械性交易系統適用於某些領域，但某些地方則不行。機械性系統頂多只能反映設計者的程度與構想。購買這些系統，等於自找麻煩。每個人都要找到自己的方法（我認為，通常都是馬基方法的某種變形）。沒有永不結束的好光景，也沒有永不結束的倒楣事。那些欺騙投資大眾的花俏玩意兒，已經愈來愈沒有玩弄的空間；這些人可能會另外設計一些更吸引人的東西。人類的無知程度，畢竟是不可限量的。某人剛汲取了一些經驗，就有另一位初學投資人加入行列。20世紀末，那斯達克與紐約證券交易所的股東，竟然想把交易所掛牌上市，這類發展似乎讓人覺得很古怪，是否代表某種不祥的徵兆？


    根據我所瞭解，本書的介紹的系統、方法、程序與想法等發展，是防範有害變化的唯一保護措施。


    伯西第（W.H.C. Bassetti）

    美國—加州—San Geronimo

