    \n## 第4節 夏普率\n\n這個公式雖然不正確，但不會妨礙讀者瞭解夏普率（Sharpe Ratio）的觀念。可是，相信或不相信這種觀念，那又是另一回事了。夏普率的公式如下：\n\
    \nSR = (E—I) / sd\n\n其中\n\nE = 期望報酬\nI = 無風險利率\nsd = 報酬率標準差\n\n這種毫無彈性的公式，在交易實務運用上毫無意義。這個公式假定標準差衡量的報酬波動率也就等於風險（學術界的普遍問題）。標準差計算沒有彈性，沒有辦法衡量交易者最關心的淨值最大減損，這也是交易者實際上可能碰到的最大災難。更明確說，這是最大期望損失，也就是由淨值最高點到最低點之間的距離。\n\
    \n## 第5節 價格波動率計算說明\n\n計算投資組合的價格波動率，首先取得投資組合各期報酬率（Ri）與其平均數（µ）之間的差值。然後計算這項差值的平方（[Ri—µ]²），加總取得各期平方總和（∑[Ri—µ]²），再除以總期數減1（n—1）。結果就是變異數（variance）。取變異數的平方根，結果就是標準差，也即是價格波動率。\n\
    \n第1步驟：計算各期報酬率的平均數。\n\n第2步驟：計算各期報酬率與其平均數之間的離差。\n\n第3步驟：取離差的平方。\n\n第4步驟：加總離差平方的總和。\n\
    \n第5步驟：把前述總和除以期數減1。\n\n第6步驟：計算前述結果的平方根。\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_414_0.png)\n\
    \n圖解12. 價格波動率計算公式。計算步驟如下：（1）計算各期報酬率的平均數；（2）計算各期報酬率與其平均數之間的離差；（3）取離差的平方；（4）加總離差平方的總和；（5）把前述總和除以期數減1；（6）計算前述結果的平方根。\n\
    \n圖解13與14處理投資組合風險與獲利分析。這兩份圖解是戴菲克選擇權研究公司幫助S&P交易系統與保德信證券執行交易而提供的投資組合量化獲利／風險報告，目的是顯示專業玩家對於風險與投資組合分析的處理方法，也讓讀者瞭解其深度與複雜程度。這份報告的原稿，是由布萊．胡爾與李斯特．盧布斯設計而專供本身造市之用。\n\
