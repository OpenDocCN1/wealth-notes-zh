    # ## B、TEKNIPLAT圖形紙


    如果從來沒有採用過這種半對數（比率或比例）圖形紙，這部分說明有助於各位瞭解與分析這類走勢圖，而且有助於各位自行繪製圖形。


    對於工程師或有經驗的繪圖者，這種圖形紙絕對不會造成困擾，但很多人從來沒有繪圖經驗，或只利用垂直距離固定的算術刻度方格紙，他們對於不斷變動的一方格垂直距離，可能覺得很迷惑。可是，一旦熟悉之後，這種圖形紙更方便使用，因為不同價格的相同百分率變動，始終位在相同的距離之外，我們可以憑藉著肉眼判斷位置，不需參考左側的座標刻度。


    如果圖形準備用來顯示工作時數、溫度變化或水深，可以采用一般算術刻度的方格紙，每個「小時」、「度數」或「英呎」都在圖形上代表相同的垂直距離。在圖形上，5呎與10呎之間的垂直距離，一定等於105呎與110呎之間的距離。


    可是，股價變動不適合採用前述方式表示。沒錯，某支股票由$5上漲到$10，變動是$5，每100股的價值變動為$500；另一支股票由$100上漲到$105，變動也是$5，每100股的價值變動也是$500。可是，就後者而言，需要投入的資本顯然較多。


    舉例來說，如果投入$1,000資金分別購買前述兩支股票。對於股價$5的股票，可以買進200股，稍後賣在$10，獲利為$1,000，報酬率是100%。對於股價$100的股票，$1,000可以買10股，稍後賣在$105，獲利是$50，報酬率是5%。


    如果圖形紙的價格刻度是利用相同距離代表相同的百分率變動，就很容易比較不同交易的盈虧百分率。這也正是TEKNIPLAT圖形紙'
  - '[PAGE 366]


    # 股價趨勢技術分析（下冊）


    提供的功能。圖形紙上某特定垂直距離，都代表相同百分率變動。如果趨勢以固定角度變動（換言之，斜率固定），代表百分率變動也固定，不論股票價位如何。


    讓我們考慮股價變動1點的情況。如果股價原本是$5或$6，這1點變動代表的意義，當然大於股價原本是$100或$101。所以，在圖形紙上，5與6之間的距離，應該遠大於100與101之間的距離。對於低價股來說，每1點、半點或⅟點變動，都代表相當大的百分率變動，應該清楚顯示在圖形上。事實上，如果股價在100以上，TEKNIPLAT圖形紙沒有辦法顯示⅟/8點的價格變動。可是，這也正說明⅟/8點變動對於100以上之股票不重要。我們顯然會在意⅟/4與1⅟/8之間的股價變動，但不會太關心103與103⅟/8之間的股價變動


    由於股票都採用比率價格刻度繪製圖形，所以可以直接在圖形上比較兩支股票之間的趨勢與型態。股價16與股價56的股票，可以直接比較。可是，雖然圖形上的相同距離都代表相同百分率變動，但我們必須指出一點，高價股的走勢百分率通常小於低價股。


    TEKNIPLAT圖形紙上，價格刻度分為兩大部分，分別佔據圖形紙上半部與下半部。對於每部分，上側價格都是下側價格的兩倍，所以不論中線設定的數據如何，最上端的價位是中線價位的兩倍，最下端價位是中線價位的一半。舉例來說，如果中線價位設定為20，最上端價位為40，兩者之間的9條濃線，按照秩序分別標示22、24、26、28、30、32、34、36與38；每兩條濃線之間由淡線區分為8個小方格，每個小方格代表1/4點。同理，在下半部，最下端價位是10，10與20之間也有9條濃線，按照順序分別標示11、12、13、14、15、16、17、18與19；每兩條濃線之間也由淡線區分為8個小方格，每個小方格代表⅟/8點。當然，我们可以把最上端設定為20，中線為10，最下'
  - '[PAGE 367]


    # 附錄 B


    端為；也可以把最上端設定為10，中線設定為5，最下端為2 1/2。


    剛開始的時候，對於不同價位的股票，可能不知道每小方格究竟代表幾點，每個方格可能代表 1/4點或 1/8點，甚至可能是1整點。不要讓這個問題造成困擾。我們可以觀察上側濃線與下側濃線的價位，如果兩者分別為19與20，則19
    1/2的價位顯然位在兩條濃線的中間，19 1/4則位在下側濃線（19）之上的四分之一位置。經過一段時間練習，就可以心眼合一、憑直覺判斷。


    如果股價穿越圖形紙上端或下端價位，只需要重新標示價格刻度。舉例來說，如果價格穿越最上端的40，重新在圖形紙中央標示 40；然後，由這個時候開始，最上端為80，最下端為20。


    基於圖形紙結構，以及處理上的一致性起見，我們必須採用5、 10、20、40、80、160……等價格來標示中線、最上端與最下端價位，然後分別標示中線上側與下側各10條濃線的價位，讓每個小方格代表股價最小跳動單位。準備繪製新圖形時，可以參考下列表格來標示價格刻度。'
