    # 股價趨勢技術分析(下冊)


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_272_0.png)


    這個例子很適合用來說明支撐_壓力現象。順便提一點, 在1963年春天與夏天, 股票市場基本上處於多頭趨勢, 但這支股票則例外呈現跌勢 (雖然這類例外的股票數量不少)。3月與4月份,
    股價數度上漲到31, 5月初跌破下檔支撐。5月份與6月份, 股價漲勢都受阻於3月份低點的压力。6月中旬, 股價再度跌破支撐, 後續漲勢受阻於4月底的低點。股價在7月份又跌破支撐,
    後續漲勢受阻於6月份底部25。這是很典型的支撐/壓力行為。價格一旦跌破支撐, 則該支撐將成為後續漲勢的上檔壓力; 同理, 價格一旦突破壓力, 則該壓力將成為後續跌勢的下檔支撐。'
