    ## 股價趨勢技術分析（下冊）


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_206_0.png)


    圖221. 菱形排列。這份日線圖涵蓋1946年12月到1947年5月之間的走勢。首先，讓我們提供一些背景資料，AC在1945年10月創多頭市場峰位112。在多頭市場，高價續優股經常領先出現頭部，我們稍早已經提到這種現象。股價在第一波回檔大約跌到90附近，然後反彈到106左右。接著，股價一度跌破80，第二波反彈即是目前這份走勢圖顯示的情況。根據走勢圖觀察，股價有逐漸形成圓形頭頸部的味道，這是因為高價續優股通常不會出現大幅百分率的走勢。如果我們把價格刻度放大，整個排列就會顯示投機股的韻味。


    型態的第一部份類似「擴張頂」。第一個小型峰位在96，折返到92。第二個峰位稍高在98，折返到91 ¼；第三波漲勢將股價推升到99。截至目前為止，我們已經有擴張頂的5個反轉點，只要價格跌破91
    ¼，就可以確認這個空頭排列完成。可是，接下來的跌勢，並沒有跌破91 ¼，隨後幾個星期的價格波動震幅愈來愈小，呈現等腰三角形的排列。


    最後，股價明確跌破89，這是多頭部位出場訊號，也可以考慮在次一個反彈過程建立空頭部位。事實上，隨後3個星期的反彈過程，股價再也沒有回升到等腰三角形頂點（94）之上。


    雖然完成菱形排列，但股價並沒有出現嚴重跌勢，這是很容易理解的現象，因為先前的跌幅已經很大，整個大盤的氣勢還很強，而且這是一支續優的保守型股票。可是，價格也沒有回到94；事實上，隨後逐漸盤跌到80。


    就菱形排列的一般性質來說，這是一種不常見的排列，有些類似於頸線稍微呈現V狀轉折的複雜頭肩型態。排列前半部類似擴張頂，後半部則類似等腰三角形。


    ## 楔形排列


    我們沒有必要詳述說明這種排列過程的交易法則，因為趨勢線相互收斂的情況一旦明朗化之後，支撐╱壓力與趨勢線的一般法則，應該可以讓持股人及早脫身。即使在最糟情況下，停止單也應該可以讓投資人在局面嚴重惡化之前出場（當然，前提是投資人必須設定停止單）。


    如果考慮建立新的多頭部位（下降楔形向上突破）或空頭部位（上升楔形向下突破），應該要觀察成交量變化：向上突破需要成交量確認，向下突破的第一階段不需明顯大量。新部位可以建立在突破之後的折返走勢（回檔或反彈）。


    ## 單日反轉


    相較於先前討論的反轉或連續排列來說，單日反轉不是一種適合交易的技術型態。這種排列的主要功能，是用來判斷小型走勢的頭部與底部，藉以保護既有部位。當小型走勢發展數天之後，如果出現單日反轉、竭盡缺口或不尋常大量，都是既有走勢即將結束的強烈徵兆；其中任何一種訊號都值得參考；如果是兩種同時出現，可靠性更高；倘若若是三者同時出現，幾乎可以代表明確的小型頭部或底部。


    如果希望根據單日反轉線形進行交易，不免有些賭博意味，而且只適合極短線的進出，性質上不同於本書討論的大部分交易。有關單日反轉的交易意涵與一般建議，請參考本書第10章。


    ## 股價趨勢技術分析(下冊)


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_208_0.png)


    1945年上半年出現一個漂亮的楔形排列。這波漲勢是GFO大多頭行情完成的最後頭部。


    楔形排列向下方突破之後，價格直接下滑到 $18\frac{1}{4}$ ，然後由這個8月份的中期走勢低點向上反彈，在 $23\frac{3}{4}$ 與 $26\frac{3}{4}$
    之間形成矩形排列，矩形排列突破之後，經過一系列崩跌走勢，1947年5月的低價為 $6\frac{1}{8}$ ！


    對於楔形排列，我們很難判斷上側與下側趨勢線什麼時候會開始收斂。4月底的向上突破很正常；我們可以在次一個折返走勢進場買進。接下來，5月份高點 $23\frac{1}{2}$
    發生之後，銜接最近兩個高點的直線，顯然沒有與基本趨勢線相互平行，這時候趨勢線已經出現相互收斂的傾向。隨後三波漲勢還繼續確認楔形排列結構；在最後峰位，我們發現漲勢停頓。對於機警的交易者來說，或許應該在6月4日與5日的小型頭部出場，該處的成交量相當大。即使當時沒有出場，也應該調緊停止價位，防範價格向下方突破。


    ## 旗形與三角旗形


    很多情況下，上升趨勢發展過程出現的旗形排列，其回檔幅度可能到達我們根據一般交易戰術估計的水準；換言之，回檔幅度可能是先前「旗桿」長度的40~50%，或回到基本（紅色）趨勢線或藍色平行線。如果先前漲勢代表整個旗桿的第一段，或先前漲勢坡度不是很陡峭，則可以考慮在第一個機會買進，通常也是在藍色平行線附近。若是如此，回檔走勢很可能還會進一步發展，但我們應該以「及早進場」為主要考量，因為折返走勢可能很短暫，或許不會觸及另外兩個修正目標。拉回走勢過程，務必留意成交量變化。成交量必須縮小，而且維持偏低水準。整個旗形排列過程，只要成交量擴大，就會危及型態的可信度；當然，突破走勢開始時，成交量照道理一定會放大。突破走勢的勁道通常很猛烈，所以只要旗形或三角旗形發生大成交量，我們就可以把停止點移到收盤價下
    1/8點處。如此一來，如果大成交量顯示型態失敗，我們很快會被停損出場；可是，如果大成交量代表突破走勢，停止單應該不會被引發，因為這類走勢通常不會折返，而且经常出现突破缺口。


    如果主要趨勢屬於空頭行情，前述建議也同樣適用，但有一個例外。旗形漲勢的最後一天，可能爆出大量，當然也可能出現竭盡缺口或單日反轉。如果這一天發生大成交量、竭盡缺口或單日反轉，可以立即進場建立空頭部位，停損設定在旗形峰位的上方，防範排列發生反向突破。


    旗形不論是發生在上升或下降趨勢過程，排列上限與下限也可能是水平狀（換言之，矩形排列）。如果成交量與其他條件都配合（包括先前發生的快速漲勢或跌勢），就屬於旗形狀態整理，我們可以在第6個反轉點進場（或型態內任何一點，因為我們預期這是連續排列，而且不會發生長期整理）。


    如果旗形或三角旗形的排列時間過長（超過3個星期），型態的有效性就值得懷疑。所以，我們需要按照一般做法，在排列最高點之上或最低點之下（取決於多頭或空頭部位）設定停損。旗形狀排列最後可能失敗，這是很不幸的發展；一旦建立部位之後，由於我們很難在整理過程主動放棄希望，所以需要設定3個星期的期限，儘量避免股價折返到先前設定的停損。另一方面，如果旗形排列確實屬於連續排列，突破之後的走勢通常很快速，屬於最容易獲利的行情之一。


    這裡還需要處理另一種可能性：在旗形或三角旗形排列過程，我們原本已經持有部位。如果在上升趨勢持有多頭部位，或在下降趨勢持有空頭部位，一碰到旗形整理，顯然應該繼續保留部位。可是，如果嚴格遵守交易法則，這種情況通常不會發生。一般來說，在旗形排列之前的旗桿過程，通常應該會發生某種訊號，讓我們可以把部位停止點調整到收盤價附近的
    1/8點位置。換言之，在先前快速走勢過程，部位應該已經獲利了結，出場點可能是旗桿的端點（當然，我們不能仰賴這方面的運氣）。


    可是，萬一沒有發生出場訊號，當旗形出現時，我們仍然持有部位；碰到這種情況，千萬要保留部位。排列朝原先趨勢方向繼續發展的可能性很高。


    假定我們在上升趨勢持有多頭部位，而且股價向上突破而創新高價，例如由20上漲到32。稍後。我們發現漲勢停頓，設定在30的停止賣單被引發，接著發生幾天的回檔，成交量急遽萎縮，幾乎完全沒有交易量（請注意，必須是「急遽萎縮」）。若是如此，我們可以重新進場，即使價格高於前幾天的水準也一樣。


    ## 第33章 圖形戰術評論


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_211_0.png)


    圖223. 旗形與三角旗形是快速走勢過程常見的整理型態，排列經常位在整段走勢的中點附近（其他結構緊密的型態也可能如此）。


    MRT由1944年低點4，上漲到12附近，然後在10～12之間形成長達7 個月的矩形排列。5月初，價格夾著大量向上突破，然後出現3個星期的旗形排列。請注意旗形排列之前的快速漲勢，以及該波漲勢端點的大成交量。當價格進入旗形排列之後，成交量顯著萎縮。整個排列的折返幅度不大，在先前小型峰位14
    1/2附近獲得支撐。


    突然之間，價格又夾著大量向上突破，該波漲勢直奔24 3/4。如果交易者仍然持有股票，或在旗形排列買進（大約在15），應該會在6月6日價格到達19 7/8時賣出，因為當時的成交量顯著放大。


    ## 股價趨勢技術分析（下冊）


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_212_0.png)


    圖224. LV在1945年底到1946年初的日線圖，充滿許多跳空缺口。當時，LV正完成次級修正走勢，接下來將進行另一波漲勢（結果也是最後一波），試圖穿越1945年位在17的頭部。此處討論的情況，可以視為雙重頂（譯按：第二個頭部沒有顯示），因為價格在1946年夏天跌破兩個頭部所夾的谷底水準，然後繼續下跌到5。


    不是每個缺口都具有意義；舉例來說，10月3日的缺口發生在狹幅整理區，成交量很小。11月3日的缺口發生在星期六，成交量增加一倍，顯然是重要缺口。當天的收盤價穿越幅度不足3%，所以稱不上真正的突破缺口，但多頭意涵已經表達得很清楚，可以在小型回檔過程買進。回檔過程，成交量縮小，沒有特殊意義。一直到1月份的第3個星期，我們才見到另一個缺口，看起來像是真正的突破缺口。1月14日，LV夾著大量上衝，1月16日的高價為15
    7/8，收盤價為15 1/2，出現第二次大量。第一次大量發生時，如果多頭部位採用收盤價逐次停止單，將在15 1/2出場，如果在第二次大量採用逐次停止單，將在15
    3/8出場。當價格折返到14 1/2，可以考慮重新進場。1月23日出現突破缺口，展開第二段漲勢。第二天（1月24日）又發生跳空缺口，如果視為逃逸缺口（衡量缺口），上檔應該出現17
    3/4的目標價位。可是，1月28日又發生第三個缺口，當天線形為單日反轉，而且爆量高潮大量，清楚顯示這波走勢將告一段落，在收盤價設定逐次停止單，結果在16 3/4出場。請注意下跌過程的反彈走勢，曾經出現跳空缺口而在15形成單日的島狀反轉。

    '
