    \n## 長期投資人想要的股票\n\n本書第 8 版的最重要更新部分之一，或許是充分反映股價指數在目前市場上的功能；請注意，股價指數現在已經像一般股票一樣，可以直接進行交易。這可以說是現代金融市場的一大進展。有關長期投資人運用的戰術與戰略，相關細節已經在第\
