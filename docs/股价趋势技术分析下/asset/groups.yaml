    # 商品期貨


    期貨是一種可供投資人按照目前價格買賣未來交割之根本商品的契約，期貨根本商品包括：農產品（例如：玉米、燕麥、小麥、黃豆、牲口等）；金屬（例如：黃金、白銀、白金、鉈等）；森林、纖維與食品（例如：木材、棉花、橙汁、糖、可可、咖啡等）；能源（例如：源由、熱燃油、汽油、天然瓦斯）；金融與其他衍生性產品（例如：美國公債等債務工具、股價指數、外匯等）。


    美國的期貨產業起始於1800年代初期，最初是為了讓穀物生產者與使用者能夠讓未來交割的商品鎖定目前的市場價格，使得相關收益更穩定。隨著期貨市場的發展與標準化，開始出現一些投資與避險策略。目前，期貨與選擇權的根本商品，已經擴展到很多投資工具，而且也成為全球性產品。


    實際經驗顯示，凡是在集中市場進行交易的股票與其他金融產品，都存在價格型態。商品交易也是運用這類圖形排列的另一個領域。交易活躍的資產，也同樣受限於經濟供需定律，其價格如果繪製為走勢圖，同樣存在有意義的趨勢與型態，就如同個別股票一樣，這些走勢圖也同樣可以看到上升趨勢與下降趨勢、密集成交區域、整理、反轉等。事實上，不論所交易的對象是股票或期貨，投機客的活動與投資人的根本心理，都是一樣的。


    只要是交易活躍的商品期貨，例如：玉米、棉花、可可、咖啡、小麥……等，都適用技術分析的原理。可是，商品期貨與股票／債券之間還是存在一些本質上的差異，此處說明其中四點。


    1. 有限壽命：商品期貨的最主要特點，是其契約只存在有限期間；換言之，期貨契約會在特定時間到期。每種期貨契約本身'
  - '[PAGE 374]


    雖然只存在有限壽命，但所呈現的價格型態仍然類似於現貨與其他對照契約。由於契約壽命有限，這對於長期支撐／壓力會造成影響，比較不具備分析價值，雖然還是有短期意義。


    2. 避險：商品與股票分析的另一項重要差異，是很多投資人利用期貨進行避險，而不是從事投機。基於這個緣故，期貨的支撐／壓力比較沒有意義（相較於股票來說）。一些具有成長週期的商品，例如：穀物，其價格走勢往往存在季節性型態，這是避險者與投機客都很重視的性質。季節性因素會影響商品技術分析訊號的可信程度。


    3. 成交量：第三項主要差異在於成交量。股票交易的成交量關係並不複雜。對於任何股票，可供交易的股票數量都固定。總發行股數的任何變動，必須透過公開程序進行，而且必須經過核准。對於特定股票，可以計算每天的平均成交量，做為評估成交量多寡的基準。至於期貨交易，雖然個別投資人對於特定期貨契約所能夠持有或放空的数量有一定限制，但整體市場可供交易的總契約數量則幾乎沒有任何限制。某商品的未平倉部位總量，可能超過該商品所能交割的數量。事實上，絕大部分期貨契約部位都會在到期之前平倉。


    4. 氣候：對於某些商品來說，類似如洪水、乾旱之類的氣候新聞，可能顯著影響期貨市場的走勢。股票市場通常不會受到這項因素影響。編者附註：可是股票市場有亞倫·葛林斯班與聯準會。'
  - '[PAGE 375]


