    # 股價趨勢技術分析（下冊）


    品處在區域型態內，而價格與成交量發生預期的發展，並且符合真正突破的最低條件。對於道氏理論，這是指工業指數與運輸指數在相同的漲勢或跌勢都創新高或新低。如果只有單一指數創新高（或新低），而另一個指數沒有配合，這稱為「未經確認」（non-confirmation）或「背離」（divergence）。擺盪指標的用法也是如此。為了確認價格所創的新高或新低，擺盪指標也需要創新高或新低。如果擺盪指標不能確認價格所創的新高或新低，這也稱為「背離」，代表潛在反轉的早期警訊。


    Congestion (密集交易區)：這屬於區域型態發展的橫向交易區間。可是，不是所有密集交易區間都有可資辨認的型態。


    Consolidation Pattern (整理型態)：又稱為「連續型態」（continuation pattern），這種區域型態將朝原先的趨勢方向進行突破。參見「上升三角形」（Ascending
