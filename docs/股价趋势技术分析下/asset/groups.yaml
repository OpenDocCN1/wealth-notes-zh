    # 股價趨勢技術分析 (下冊)


    第37章


    # # 相同的舊有型態


    初學者一定覺得市場是一個充滿神奇與奧妙的場所，就像太空人初次踏上火星的感覺一樣。一切都顯得陌生，不可解釋的高低起伏，詭異的發展。一支默默無聞的股票，突然脫離債務與赤字困擾，股價一飛沖天。在穩定的經濟背景下，一支老牌績優股突然暴跌。表面看起來平靜而安全，然後地面忽然裂開，一波可怕的跌勢吞噬所有的價值。


    初學者或許不瞭解，這些不尋常與駭人聽聞的現象，只不過是市場不斷發生的正常波動與調整，無數參與者因為害怕、貪婪與猶豫不決而造成變化。這位初學者可能遊走在許多騙子之間，打電話，研究報紙金融版的消息，與朋友討論，累積各種相互矛盾的資訊，最後閉上眼睛、隨便做個決定，期待這就是正確的答案。


    某些人即使在股票市場打滾了幾十年，仍然沒辦法找到明確的交易方法。


    可是，關於股票趨勢的基本性質，還是可以透過學習而瞭解的。某種程度內，我們可以知道某些情況的可能後續發展，也可以找到方


    232'
  - '[PAGE 233]


    法來處理這些情況，包括例外情況的意外發展在內。重複強調一次：我們可以成功地處理例外情況，以及那些無法精確預測的發展。


    由另一個角度說，我們偶爾會發生錯誤，但整體而言還是能夠成功。為了達成這個目標，我們需要有足夠的經驗來判斷某些情況的正常後續發展，瞭解例外情況發生的可能性有多高，而且知道如何處理意外發展。這屬於一般性的問題，太空人、化學家、物理學家，乃至於日常生活中的每個人都會遭遇。


    長期而深入地觀察市場，將發現意外情況發生的頻率並不如初學者想像那麼高。


    本書提供的圖形，大體上與1947年第一版的圖形相同。某些是取自1928年與1929年，某些是來自1930年代與1940年代。編者附註：另外還新增添一些1990年代與2000年代的例子。讀者絕對不該忽略各種股票在不同期間之對應趨勢階段或轉折點呈現的相似性。


    任何正常交易的股票或商品，我們可以在任何時間架構的走勢圖上，察覺這些不斷重複發生的型態、趨勢線與支撐／壓力現象。


    為了說明這點，第五版的這部分內容，增添了一些典型的技術範例，這些例子都類似過去版本討論的案例，但取自1947年到1966年的市場。編者附註：本書第八版又增添一些取自1990年到與2000年代的例子。事實上，我們可以輕鬆提出十倍數量的例子，藉以說明過去所發生的一切，仍然重複發生於最近幾年。'
  - '[PAGE 234]


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_234_0.png)


    圖228. UV發生在1952年主要趨勢過程的頭肩頂排列。這支股票超越於1950年的底部33，最高峰值是此處顯示的88。隨後，股價下跌到37。頭肩頂排列過程，「左肩」出現典型的大成交量，「頸」的成交量稍高於「標準型態」，「右肩」成交量萎缩，代表明後的警訊。請注意8月份最後一個星期的拉高走勢，以及11月份與12月份的次級回升走勢。另外，位在圖形左半部，1951年還發生一個漂亮的上升三角形，顯示行情即將恢復先前的漲勢。'
  - '[PAGE 235]


    # 第37章 相同的舊有型態


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_235_0.png)


    下降趨勢很少出現規律性的趨勢線，不同於上升趨勢。可是，雖然反彈走勢與成交量缺乏規律性，但基本分析原則仍然類似上升趨勢。在這份走勢圖涵蓋的6個月期間，反彈峰值始終沒有超越前一個漲勢峰值。如果發生這種明確的下降趨勢，應該假定該趨勢將繼續發展，直到價格與成交量型態發生顯著變動為止。當IC突破52的重要歷史關卡，請注意成交量擴增，以及後續發展。'
  - '[PAGE 236]


    # 股價趨勢技術分析 (下冊)


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_236_0.png)


    圖230. 7月份與8月份的矩形排列長達6個星期，高限47曾經遭到3次觸及，低限在44位置。如同多數矩形排列一樣，7月19日發生第一個矩形反轉點時，成交量擴大；然後，排列發展過程，成交量萎縮；最後，8月29日向上突破時，成交量又再度放大。


    價格向上突破之後，出現典型的旗形折返走勢，成交量顯著萎縮；折返走勢雖然跌破矩形上限支撐，但從來沒有穿越矩形下限。10月15日，當價格向上穿越9月初的高點，成交量放大。（類似現象也發生在12月中旬，當時價格向上穿越11月14日的高價。）11月下旬的折返走勢，成交量縮小，在9月份高點獲得支撐。這份圖形中，請注意52扮演支撐／壓力功能，這個關卡曾經是兩波漲勢的壓力，當價格由10月份峰位折返之後，則是隨後三波回檔走勢的支撐。


    12月初展開的漲勢，又出現類似情況，57扮演壓力／支撐角色。當價格在12月中旬突破壓力創新高之後，回檔走勢停止於57。


    趨勢的正常運作，如果沒有因為消息面因素受到干擾，主要趨勢都是由這些小型波浪起伏構成。如果市場或產業內發生重大消息，走勢可能出現長期整理或次級折返。可是，主要趨勢非常「耐操」。我們不該隨便假定主要趨勢發生反轉。'
  - '[PAGE 237]


    # 第37章 相同的舊有型態


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_237_0.png)


    圖231. 這份走勢圖幾乎與圖230完全相同，只是方向相反而已。


    假定各位持有的股票，發生MNC在1956年下半年的走勢，如果仍然期待趨勢向上翻升，恐怕需要「非比尋常」的樂觀心態，要不然就是對於股票走勢性質全然無知。可是，如果持有空頭部位，那當然有樂觀的理由。


    這個例子中，一系列跌勢的反彈峰值，始終不能穿越先前的小型峰值，而且可以繪製相當明確的下降趨勢線，這是很罕見的情況。


    我們發現，幾乎每波反彈都在前一波的谷底遭受壓力，譬如：44、41、38與36。12月底，當價格向上突破下降趨勢線，我們當然不認為趨勢已經反轉；這類突破頂多意味著次級回升走勢。如果趨勢將因此發生重大變化，成交量應該會透露一些訊息，目前情況顯然不是如此。這支股票首先要出現反轉型態，我們才會考慮買進的可能性。事實上，當股價反彈到40附近，應該是進一步放空的時候。'
  - '[PAGE 238]


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_238_0.png)


    圖232. 「如何判斷某種技術排列或價格突破確實有效？」這是我們經常聽到的問題。多數情況下，成交量可以提供明確的答案，尤其是價格向上突破型態。成交量確認訊號雖然未必都像目前這個DL例子那麼清楚，但這屬於向上突破的典型現象。矩形排列過程，成交量明顯萎縮，上限與下限發生5個顯著的反轉點。


    11月4日星期四，價格夾著大量向上突破矩形排列，而且收盤價正式穿越排列上限。隔天（星期五），價格仍然收高，成交量配合也很恰當。由這點開始，上升趨勢已經很明顯。


    由這份走勢圖觀察，當價格突破矩形排列之後，始終沒有出現反轉徵兆，頭部出現在3月份的25 1/2。


    DL的矩形突破特別強勁。正常情況下，突破之後都會發生小型回檔，類似如圖230的GRC。可是，即使突破之後發生回檔走勢，也絕對不會減弱多頭氣勢。'
  - '[PAGE 239]


    # 第37章 相同的舊有型態


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_239_0.png)


    假定我們真的放空LA。請注意11月4日（星期四）與11月5日（星期五）的「價漲一量增」關係；隔週的星期一與星期二，價格稍微收低，交易區間很小，成交量也萎縮。然後，星期三價格大漲，成交量顯著放大。截至當週結束的一週半整體走勢，基本上還是維持價漲量增、價跌量縮的傾向。等到12月的第一個星期（如果不是更早的話），已經可以清楚看出危險的訊號，應該回補空頭部位。


    這種結果並不是一場悲劇，甚至不該覺得沮喪。某些交易者很容易因為些許損失而情緒激動；若是如此，將不能掌握反轉部位的機會。


    1955年3月，這波走勢直奔26⅜高點。'
