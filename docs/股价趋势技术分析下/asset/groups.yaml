    \ 42,000）} = 16.88$ 口\n\n刪除非整數的部分，所以是 16 口契約。\n\n讀者可能會問：「關於 N 與單位大小，每隔多久需要重新計算一次？」每個星期的第一天，龜族都會收到一份表格，上面列示每個相關市場的\
    \ N 與單位大小。\n\n## 部位規模的重要性\n\n分散交易是把風險分散到多種交易工具，藉以增加理想交易機會的掌握程度，也可以因此提升獲利。適當的分散交易，需要對於很多不同交易工具，進行類似（如果不是完全相同的話）的下注。\n\
    \n龜族系統利用市場價格波動程度來衡量每個市場的風險。我們利用這種風險衡量做為部位調整大小的單位，後者代表固定的風險程度（價格波動金額）。如此可以提升分散交易的效益，使得成功部位沖銷失敗交易的可能性。\n\
    \n請注意，如果資本不足的話，比較難以進行前述的分散交易。就先前討論的熱燃油範例來說，如果帳戶資本為 $ 100,000，每單位的契約口數只剩下 1 口，因為\
    \ 1.688 的整數部分為 1.0。對於小額帳戶來說，這種調整單位的影響很大，嚴重降低分散交易的效益。\n\n### 衡量風險的單位\n\n龜族採用「單位」來衡量部位規模，而且這些「單位」是根據價格波動風險進行調整，所以「單位」同時衡量個別部位與整體交易組合的風險。\n\
    \n龜族必須接受風險管理條款的規範，在 4 種不同層次上，限制每個人特定時間所能持有的「單位」數量。原則上，這些規定會控制每位交易者所承擔的總風險，並侷限連續虧損期間或重大價格波動期間的虧損程度。\n\
    \n重大價格波動的一個典型例子，發生在 1987 年 10 月股市大崩盤的隔天。美國聯準會在一夜之間調降利率數個百分點，試圖強化股票投資人的信心。龜族持有大量的利率期貨多頭部位，包括：歐洲美元、國庫券與公債。當天發生的損失非常可觀。對於某些人，一天的損失高達帳戶淨值的\
    \ 20～40%。如果沒有部位規模限制的話，損失想必更嚴重。\n\n相關的限制如下：\n\n| 層次 | 類型 | 最高單位 |\n| :--- | :---\
    \ | :--- |\n| 1 | 單一市場 | 4單位 |\n| 2 | 相關程度高的市場 | 6單位 |\n| 3 | 相關程度低的市場 | 10單位\
    \ |\n| 4 | 單一方向:多頭或空頭 | 12單位 |\n\n- **單一市場**：每個市場最多不超過 4 單位。\n- **相關程度高的市場**：對於相關程度很高的市場，任何特定方向的總部位不得超過\
    \ 6 個（換言之，多頭部位 6 單位，空頭部位 6 單位）。\n  - 相關程度高的市場包括：熱燃油 & 原油；黃金 & 白銀；瑞士法郎 & 德國馬克；國庫券\
    \ & 歐洲美元……等。\n- **相關程度低的市場**：彼此相關程度很低的市場，任何特定方向的總部位不得超過 10 單位。相關程度低的市場包括：黃金 &\
    \ 銅；白銀 & 銅；很多穀物組合（由於部位限制的問題，龜族沒有交易穀物）。\n- **單一方向**：單一方向的多頭或空頭部位，單位總量不得超過 12 個。所以，每個人頂多可以持有\
    \ 12 單位多頭部位，以及 12 單位空頭部位。\n\n龜族用「裝滿」來形容某層級風險已經到達高限。譬如說，「裝滿日圓」代表日圓部位已經到達 4 單位高限。「完全裝滿」代表持有\
    \ 12 單位部位。\n\n## 調整交易大小\n\n市場往往會連續好幾個月沒有明確的趨勢。若是如此，帳戶淨值可能會發生相當嚴重的耗損。\n\n重大獲利部位平倉之後，帳戶淨值也會增加，可以用來調整部位。\n\
    \n龜族不採用起始淨值計算的常態帳戶。我們都採用某特定帳戶大小而起始淨值為零的名目帳戶。舉例來說，當我們在 1983 年 2 月開始進行交易的時候，很多人都得到一個\
    \ $ 1,000,000 的名目帳戶。每年的年初，帳戶規模都會調整，通常是根據理查的主觀判斷，帳戶調整大體上會反映前一年交易的績效。\n\n如果損失到達起始帳戶的\
    \ 10%，名目帳戶規模會向下調整 20%。所以，假定某龜族原來的帳戶規模為 $ 1,000,000，如果發生 10% 或 $ 100,000 的損失，則名目帳戶將減少為\
    \ $ 800,000，直到隔年重新調整為止。如果又虧損 10%（換言之，$ 800,000 的 10%，也就是 $ 80,000，總損失累積為 $ 180,000），帳戶大小又往下調整\
    \ 20%，名目帳戶大小只剩下 $ 640,000。\n\n如何根據帳戶盈虧來調整淨值，或許還有更好的辦法，但龜族採用的規定就是如此。\n\n## 第 4\
    \ 章 進場\n\n龜族採用兩種相關的系統進場，兩者都建立在董誼（Donchian）的通道突破系統之上。\n\n談到交易系統，絕大多數人都會馬上想到進場訊號。他們相信，交易系統的最重要功能，就是提供進場訊號。\n\
    \n對於這些人來說，他們可能會覺得很訝異，龜族採用非常簡單的進場訊號，兩者都是取自理查·董誼的通道突破系統。\n\n龜族採用兩套不同而相關的突破系統，分別稱為系統\
    \ 1 與系統 2。我們可以隨意決定採用哪套系統。某些人完全採用系統 2，另一些人則把資金分為 50－50%（或其他組合）而分別採用系統 1 與系統 2。\n\
    \n- **系統 1**：屬於短期系統，運用 20 天期突破。\n- **系統 2**：屬於較長期系統，運用 55 天期突破。\n\n### 突破\n\n\
    所謂「突破」，是指價格穿越某特定天期的最高價或最低價。所以，如果採用 20 天期突破系統，只要價格穿越最近 20 天的最高價或最低價，就視為突破。\n\n\
    龜族都是在盤中價格出現突破的時候，立即採取行動，不會等到收盤或隔天開盤。對於開盤跳空缺口，如果開盤時段出現突破，龜族在開盤進場建立部位。\n\n**系統 1\
    \ 進場**：如果盤中價格穿越最近 20 天的最高價或最低價，即使穿越程度只有 1 檔，龜族也會進場建立部位。如果價格穿越最近 20 天的最高價，龜族進場買進\
    \ 1 單位，建立相關商品的起始多頭部位。反之，如果價格跌破最近 20 天的最低價，龜族進場放空 1 單位，起始建立空頭部位。\n\n如果最近的突破曾經導致獲利，則忽略這次的系統\
    \ 1 突破進場訊號。附註：就這個檢定來說，最近突破是指特定商品最近發生的突破，而不論該突破訊號被接受，或是否因為目前這個規定而被忽略。突破訊號被接受之後，在價格還沒有到達\
    \ 10 天期獲利了結價位之前，如果朝相反方向出現 2 個 N 的走勢，則視為失敗部位。\n\n最近突破的方向與這個規定無關。所以，失敗的多頭突破或失敗的空頭突破，其引發的新突破將被視為有效進場訊號，不論突破方向如何（可以建立多頭或空頭部位）。\n\
    \n可是，如果因為前一筆交易成功而造成系統 1 突破進場訊號被忽略，則要根據 55 天期突破訊號進場，避免錯失主要走勢。這個 55 天期突破被視為「萬全突破點」（Failsafe\
    \ Breakout point）。\n\n任何時候，如果我们停留在場外，總有某個價格會引發放空進場訊號，並有不同而更高的價格引發買進訊號。如果前一次突破訊號造成虧損，相較於前一次突破訊號造成獲利來說，新的進場訊號會更接近目前價位（換言之，20\
    \ 天期突破）；如果前一次突破訊號造成獲利，則新的進場點會距離目前價格更遠（在 55 天期突破位置）。\n\n系統 2 的任何突破訊號都必須接受，不論前一個突破訊號成敗與否。\n\
    \n突破進場訊號發生當時，龜族建立 1 個「單位」的部位，當價格距離起始成交價格 1/2N，再加碼 1 個「單位」。請注意，所謂的 1/2N 是由實際成交價位起算，不是由訊號位置起算。譬如說，如果成交價格出現\
    \ 1/2N 的滑移價差，則加碼價位與訊號價位之間的距離將是 1 整個 N。\n\n### 加碼\n\n加碼將持續到特定市場允許持有的最大「單位」數量。如果行情移動速度夠快，很可能在一天之內就持有最高的\
    \ 4 單位。\n\n#### 範例：\n\n- **黃金**\n  - N＝2.50\n  - 55 天期突破＝310\n  - 1. 第 1 起始單位：310.00\n\
    \  - 2. 第 2 單位：310.00 + 1/2 2.50 相當於 311.25\n  - 3. 第 3 單位：311.25 + 1/2 2.50 相當於\
    \ 312.50\n  - 4. 第 4 單位：312.50 + 1/2 2.50 相當於 313.75\n\n- **原油**\n  - N＝1.20\n\
    \  - 55 天期突破＝28.30\n  - 1. 第 1 起始單位：28.30\n  - 2. 第 2 單位：28.30 + 1/2 1.20 相當於\
    \ 28.90\n  - 3. 第 3 單位：28.90 + 1/2 1.20 相當於 29.50\n  - 4. 第 4 單位：29.50 + 1/2 1.20\
    \ 相當於 30.10\n\n### 一致性\n\n龜族得到嚴格的指示，務必遵守進場訊號，因為每年的最主要獲利可能發生在少數 2、3 筆交易中，萬一錯過其中一筆重要交易，勢必會嚴重影響續效。\n\
    \n表現最好的龜族，都是那些嚴格遵守進場訊號的人。至於那些半途而廢，或不能嚴格遵守每個進場訊號的人，績效通常最差。\n\n## 第 5 章 停損\n\n龜族採用\
    \ N 為基礎的停損，避免帳戶淨值發生嚴重損失。\n\n有種說法，「市場上有年長交易者，也有勇敢交易者，但沒有既年長、又勇敢的交易者。」不採用停損，交易者就註定破產。龜族絕對採用停損。\n\
    \n對於多數人來說，寧可期待虧損部位能夠轉敗為勝，也不願直接認賠，承認失敗。\n\n讓我們先釐清一點。斷然認賠是絕對必要的。不願認賠的交易者，就不可能成功（長期而言）。幾乎所有發生失控的金融機構，例如：霸菱銀行、長期資本管理公司與其他，都是聽任交易員不願及時認賠而累積虧損，最終演變為傷及筋骨的損失。\n\
    \n關於及時停損，最重要者，是在建立部位之前，就必須設定停損點。如果價格觸及停損，交易者就必須出場，沒有其他選擇，一次例外都不能有。關於這點，如果抱著討價還價的心理，遲早會發生災難。\n\
    \n### 股價趨勢技術分析（下冊）\n\n### 龜族停損\n\n永遠設定停損，並不代表龜族會實際遞入停損單。\n\n由於我們的部位規模很大，不希望因為遞入停損單而洩漏部位資料或交易策略。反之，我們是把停損設定在特定價位，一旦該價位遭到觸及，就必須採用限價單或市價單結束部位。\n\
    \n這些停止價位都不能計價還價。只要停損價位遭到觸及，相關部位就必須出場；沒有任何例外。\n\n### 停損設定\n\n龜族根據部位風險程度設定停損。沒有任何一筆交易承擔的風險可以超過\
    \ 2%。\n\n由於 1 個 N 的價格走勢，代表帳戶淨值的 1% 盈虧，如果風險最大不得超過 2%，相當於是 2 個 N 的價格走勢。所以，龜族多頭部位的停損，設定在進場價位下方的\
    \ 2 個 N 距離，空頭部位停損則設定在進場價位上方的 2 個 N 距離。\n\n為了儘量降低整體部位承擔的風險，如果部位加碼，則稍早建立的部位，停損必須調緊\
    \ 1/2N。這種情況下，整體部位停損位置與新加碼價位之間的距離通常為 2 個 N。可是，新加碼部位如果因為行情變動速度太快或開盤跳空而出現滑移價差，則前述距離將大於\
    \ 2 個 N。\n\n#### 範例：\n\n- **原油**\n  - N＝1.20\n  - 55 天期突破＝28.30\n\n| | 進場價位 |\
    \ 停損 |\n| :--- | :--- | :--- |\n| 第 1 單位 | 28.30 | 25.90 |\n\n| | 進場價位 | 停損 |\n\
    | :--- | :--- | :--- |\n| 第 1 單位 | 28.30 | 26.50 |\n| 第 2 單位 | 28.90 | 26.50 |\n\
    \n| | 進場價位 | 停損 |\n| :--- | :--- | :--- |\n| 第 1 單位 | 28.30 | 27.10 |\n| 第 2 單位\
    \ | 28.90 | 27.10 |\n| 第 3 單位 | 29.50 | 27.10 |\n\n| | 進場價位 | 停損 |\n| :--- | :---\
    \ | :--- |\n| 第 1 單位 | 28.30 | 27.70 |\n| 第 2 單位 | 28.90 | 27.70 |\n| 第 3 單位 |\
    \ 29.50 | 27.70 |\n| 第 4 單位 | 30.10 | 27.70 |\n\n由於開盤跳空的緣故，假定第 4 單位加碼價格稍高：\n\n\
    | 上漲到 30.80： | | |\n| :--- | :--- | :--- |\n| | 進場價位 | 停損 |\n| 第 1 單位 | 28.30\
    \ | 27.70 |\n| 第 2 單位 | 28.90 | 27.70 |\n| 第 3 單位 | 29.50 | 27.70 |\n| 第 4 單位\
    \ | 30.80 | 28.40 |\n\n### 替代停損策略：反覆\n\n飆族（注：原文誤植，應為龜族）還可以採用另一種停損策略，獲利能力能夠改善，但執行起來比較困難，因為會發生更多失敗交易，使得成敗比率下降。這種策略稱為「反覆」（whipsaw）。\n\
    \n每筆交易承擔的最大風險不是 2％，停損設定在 1/2N 距離外，所以最大風險是帳戶淨值的 1/2%。假定採用這種策略，遭到停損的單位，如果價格再來原始進場點，則重新進場。某些採用這種策略的龜族，績效相當不錯。\n\
    \n採用反覆策略還有另一個優點，當我們進行前進加碼時，不需調整停損點，因為整體 4 個單位的總風險絕對不會超過 2%。\n\n繼續引用先前的例子說明反覆停損策略：\n\
    \n#### 原油\n\n- N = 1.20\n- 55 天期突破 = 28.30\n\n| | 進場價位 | 停損 |\n| :--- | :--- |\
    \ :--- |\n| 第 1 單位 | 28.30 | 27.70 |\n\n| | 進場價位 | 停損 |\n| :--- | :--- | :---\
    \ |\n| 第 1 單位 | 28.30 | 27.70 |\n| 第 2 單位 | 28.90 | 28.30 |\n\n| | 進場價位 | 停損 |\n\
    | :--- | :--- | :--- |\n| 第 1 單位 | 28.30 | 27.70 |\n| 第 2 單位 | 28.90 | 28.30 |\n\
    | 第 3 單位 | 29.50 | 28.90 |\n\n| | 進場價位 | 停損 |\n| :--- | :--- | :--- |\n| 第 1 單位\
    \ | 28.30 | 27.70 |\n| 第 2 單位 | 28.90 | 28.30 |\n| 第 3 單位 | 29.50 | 28.90 |\n\
    | 第 4 單位 | 30.10 | 29.50 |\n\n### 龜族系統停損的效益\n\n由於龜族停損採用 N 為基準，會隨著行情價格波動程度而調整。行情波動愈劇烈，停損距離就自然放寬，但持有的契約口數也會相對減少。所有部位都採用等量的風險策略，更容易進行分散交易，風險管理也更健全。\n\
    \n## 第 6 章 出場\n\n龜族採用突破為基準的獲利了結出場策略。\n\n還有另一種說法，「獲利了結永遠不會讓你破產。」龜族不相信這種說法。過早結束獲利部位，換言之，太早獲利了結，這是順勢交易系統使用者最經常發生的嚴重錯誤。\n\
    \n價格不會呈現直線狀走勢；所以，如果我們想儘可能掌握趨勢，有時候就必須看著價格朝反向發展。剛建立部位的時候，這可能意味著我們必須看著既有的 10～30%\
    \ 獲利轉盈為虧；處在中期階段，則 80～100% 的既有獲利可能縮水為 30～40%。所以，交易者難免會遇到「鎖定既有獲利」的強烈誘惑。\n\n在哪裡獲利了結，這個選擇可能是成敗的分野。\n\
    \n龜族是根據突破訊號進場。多數進場訊號並不能演變為明確的趨勢。換言之，龜族的多數交易最終都造成虧損。少數成功部位的獲利，如果不足以彌補多數失敗交易的虧損，最終結果將是賠錢。每套可行的交易系統，都有不同的最佳出場點。\n\
    \n讓我們稍微思考龜族系統；如果成功部位在 1 個 N 位置獲利了結，失敗部位在 2 個 N 位置認賠，這意味著成功交易的發生頻率，至少必須是失敗交易的兩倍，才不至於造成整體虧損。\n"
  mdcn: "\n## 經過價格波動金額調整的部位單位\n\n龜族採用「單位」來衡量部位規模大小。每個「單位」是讓 1 個 N 的金額代表帳戶淨值的 1%，換言之：\n\
    \n單位 = 帳戶淨值的 1% / 價格波動金額\n\n也就是：\n\n單位 = 帳戶淨值的 1% / (N × 每點金額)\n\n### 範例\n\n熱燃油\
    \ HO03H：關於 2003 年月份熱燃油契約，請考慮下列價格、真實區間與 N 值：\n\n| 日期 | 最高價 | 最低價 | 收盤價 | 真實區間 |\
