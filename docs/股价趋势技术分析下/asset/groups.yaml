    # 明顯的年代問題


    批评者如果不瞭解长期交易成功的关键，或许认为讨论「1929年发生的事件」或「1946年远古时代的走势图」跟目前的市场毫无关系。这些人可能会指出，AT&T已经不复存在（至少整个结构已经不同了），纽哈芬（New
    Haven）已经下市，很多走势图代表的公司早就作古了。这种评论完全忽略走势图象徵的意义。股价走势图代表的是人们在市场上的行为模式，这些行为很可能明天就会重复发生在某支网络或高科技股票上。更重要者，这种批评不瞭解过去历史对于目前交易的重要性。关于这点，容我引用傑克·史瓦格（Jack
    Schwager）在其经典作品《新金融怪傑》（The New Market Wizards）（中文版，请参考寰宇出版公司）内访问亚爾·懷斯（Al Weiss）的一段问答。「你研究的走势图，最久可以回溯到什麽时候？」回答：「各个市场的情况差别很大，而且也要看资料的完整程度。以穀物市场为例，最久能够回溯到1840年代的图形。」「有必要回溯到那麽早吗？」「绝对有必要，长期图形分析的目的之一，是瞭解市场在不同经济循'
