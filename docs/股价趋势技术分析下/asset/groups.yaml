  - "[PAGE 229]\n\n# 第36章 移動平均：自動化趨勢線\n\n天期移動平均的敏感性，高於10天期移動平均。愈短期的移動平均，雖然比較能夠提供最及時的趨勢訊號（比較敏感），但訊號也比較容易反覆。商品交易適用短期的移動平均，經常採用30小時、3天或6天的移動平均。\n\
    \n一般來說，最好同時採用兩條移動平均，一條短期，一條長期。另外，也可以採用移動平均通道，舉例來說，分別取每天最低價與最高價的移動平均。\n\n# 穿越與貫穿\n\
    \n我們可以根据價格曲線穿越或貫穿移動平均，藉以提供交易訊號。\n\n+   1. 上升趨勢：如果價格停留在移動平均上側（換言之，價格高於移動平均），繼續持有多頭部位。\n\
    \    A. 價格向上穿越移動平均，引發買進訊號。\n    B. 如果價格位在200天移動平均之上而突然下跌，雖然逼近而沒有穿越移動平均，這是買進訊號。\n\
    \    C. 當價格跌破移動平均，但移動平均仍然處於上升狀態，這可能是買進訊號。\n    D. 如果價格突然快速下跌，遠低於下降中的移動平均，很可能發生短期反彈，但也可能是反覆走勢的陷阱。\n\
    2. 下降趨勢：如果價格停留在移動平均之下，繼續持有空頭部位。如果價格趨勢到達底部而向上回升，穿越移動平均是買進訊號。\n    A. 價格向上穿越移動平均，而移動平均仍然向下，這是賣出"
  - '[PAGE 230]


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_230_0.png)


    # 股 價 趨 勢 技 術 分 析（下 冊）


    訊號。


    +   B. 當價格位在移動平均之下而向均線逼近，如果沒有穿越而又回挫，這是賣出訊號。


    +   C. 如果價格快速上漲，遠高於上升中的移動平均，很可能發生短期回檔，但也可能是反覆走勢。


    +   D. 移動平均的穿越位置，往往很接近趨勢線的貫穿位置，這種情況下，根據貫穿的方向而代表買進或賣出訊號。


    +   3. 水平、對角或橫向走勢： 相對於移動平均的長度來說，如果價格波動幅度很寬，價格將來回穿越均線，不論就本質上或交易上而言，這都屬於橫向走勢。


    +   4. 缺口： 移動平均穿越位置，經常發生在突破缺口附近，尤其是在中期循環的主要階段初期，或是發生在中期循環修正階段初期的突破缺口附近。


    區域型態經常讓移動平均束手無策。一般來說，移動平均會擺動在型態排列的中央，造成反覆的買進與賣出訊號。所以，在區域型態中，交易者不容易參考移動平均，因為很難區別趨勢持續發展的穿越或反轉確認的穿越。


    如果價格呈現上升、下降或等腰三角形排列，移動平均會通過三角形中心。技術分析者可以掌握一些優勢，由一系列移動平均穿越過程，判斷何者最重要。當三角形排列到達其頂點附近，股價朝某個方向突破，而且穿越移動平均，這個穿越可能代表整個三角形橫向走勢最重要的貫穿。當價格穿越趨勢線，經常會來回貫穿移動平均。


    由於移動平均是由價格衍生而來，可以配合趨勢線來顯示趨勢發展。雖然如此，但还是應該將移動平均視為整個技術分析架構的一項輔助工具。'
