    圖243. 前一份圖形涵蓋1954~55年的走勢，目前這份圖形則涵蓋1956年下半年與1957年初的走勢。我們要知道：主要下降趨勢是否仍然有效？或已經出現重要的向上轉折？


    如同往常一樣，成交量是觀察重點。請注意月14日與24日的小型峰位，成交量明顯放大。9月份的向下整理過程，成交量萎縮。然後，10月中旬的小型峰位成交量又放大。回檔走勢再度量縮，回升走勢把價格推高到$25
