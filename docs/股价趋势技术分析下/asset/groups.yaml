    弧狀左側端點到谷底的距離，大約是20～30%。每個弧狀的涵蓋期間，通常介於5～7個星期，很少在3個星期之內。成交量呈現凹狀（碗狀）


    **Secondary Trend（次級趨勢）**：參見「中期趨勢」（Intermediate Trend）。


    **Selling Climax（賣壓高潮）**：經過一段重大跌勢之後，許多投機者沒有能力補繳保證金而遭到斷頭，投資者則因為恐懼或缺乏耐心，紛紛賣出股票，造成股價暴跌，發生不尋常的大成交量。當恐慌性走勢發生時，單日成交量可能超過先前漲勢的任何單日成交量。所以，賣壓高潮又稱為「清倉日」（Clean—Out
    Day），將改變當時的技術面結構。賣壓高潮通常會呈現很長的「單日反轉」線形，但整個走勢也可能涵蓋數天。


    **Semilogarithmic Scale（半對數刻度）**：圖形縱軸（價格或成交量）刻度代表百分率變動；換言之，相同垂直距離代表相同百分率變動。


    **Sensitivy（敏感度）**：愛德華與馬基提出的一種指數，藉以衡量大盤發生某個百分率走勢時，個別股票可能發生的走勢百分率。


    **Shakeout（震盪洗盤）**：一種突然而重大的價格修正，藉以震出「浮額」，然後又恢復主要趨勢。


    **Short Interest（融券餘額）**：個別股票放空而尚未回補的總股數。紐約證交所每個個月都會公布這項數據。


    **Short Sale（放空，做空，拋空）**：一種交易方式，先賣出股票或商品，然後嘗試低價買回。在股票市場，這是先向經紀商借取股票而賣出，將來再買回股票而清償先前借取的股票。至於商品交易，只要交易雙方同意買進與賣出（透過集中市場），契約就成立，所以放'
