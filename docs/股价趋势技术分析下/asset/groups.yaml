    # 讀數0與100的誤解


    當%K出現0%或100%的極端讀數，有些人會誤會其意義。即使%K的讀數為100%，並不代表價格不會繼續上漲。反之亦然，即使%K讀數為0%，價格仍然可能繼續下跌。換言之，0並不代表價格底部；事實上，情況可能剛好相反。極端值100%與0%只代表價格走勢的強弱程度
    $ ^{2} $ 。這方面的誤解，主要是源自於「超買」或「超賣」的概念。當%K與%D呈現75%以上的讀數，通常代表超買。反之，當隨機指標讀數低於25%，通常代表市場處於超賣狀況（有些交易者根據80%與20%定義超買與超賣）。請注意，對於持續性走勢，即使隨機指標已經進入嚴重超買或超賣狀態，價格可能持續朝該方向發展很長一段期間。


    # 檢視週線圖與月線圖


    不論是隨機指標或價格走勢，永遠要注意更高一層或更細一層的狀況。假定我們通常都觀察日線圖，必要情況下，也要分析週線圖，才能瞭解更長期走勢的狀況。更長期的走勢圖，有助於我們判斷目前市況隨後可能的發展。


    隨機指標如果配合傳統的圖形分析與普通常識，相信可以運作得很好。舉例來說，如果趨勢沒有被破壞，而且沒有出現整理或反轉價格型態，那麼隨機指標提供的訊號很可能是假訊號。反之，如果出現等腰三角形，而且趨勢已經被破壞，這等於確認了隨機指標的訊號。'
