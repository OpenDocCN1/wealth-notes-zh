    8則可以隨時透過網路取得所需要的資料。對於一些懶人而言（包括編者本人在內），這確實是很有用的功能。Tradestation原本就是以交易系統建構與測試聞名，現在還是如此。透過「簡易語言」（EasyLanguage），使用者幾乎可以把任何交易構想付諸執行，而且還能夠與該套裝軟體的使用者社群在線上討論、聊天。這個社群提供很多有關交易系統、交易概念的資料。


    # 網際網路：prophet.net


    對於一些更懶惰、更漫不經心的投資人來說，還有一個技術分析資訊的專門網站prophet.net，其提供的免費服務，應該能夠滿足一般投資人的技術分析繪圖需要。該網站提供各種互動式圖形與投資組合報告，一些精打細算的投資人可以經由這個網站節省不少錢。如同馬克士溫說的，省下一塊錢，等於賺到一塊錢。換言之，每省下的一塊錢，都可以作為交易資本運用。這個網站使用者構成的社群，則是另'
