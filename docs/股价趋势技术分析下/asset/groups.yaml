    # 股價趨勢技術分析 (下冊)


    ## 序


    整個宇宙快速變化，金融市場也是如此。當這部經典著作第8版發行時，股票市場似乎已經進入黃金時代的虛幻世界，正如同馬凱（McKay）形容的鬱金香狂熱，股票價格將繼續上漲到永遠，投資人願意支付任何價格買進公司名稱附有
    (.com) 的任何股票。沒錯，道瓊工業指數 36,000 點指日可待。當然，泡沫正快要破滅。可是，在泡沫破滅之前，不少冒險家、或只憑藉著一部筆記型電腦的粗魯年輕駭客，確實在股票市場撈了不少財富。某位年輕企業家的評論最有意義：「難道我不該賺取這些財富嗎（在新上市股票賺取
    $ 1 億）？我花了 3 年時間在這個計畫上。」


    現在，這些人之中，很多正關在監牢裡，或處於消化不良的狀態。謊言、詐欺與赤裸裸的偷竊。由恩隆 (Enron) 到亞瑟·安德森（Arthur Anderson）都是如此。數以億計的資金被吸入黑洞。關於所有這一切發展，我在約翰·馬基網站的投資通訊中明白指出，必然大崩塌。這方面的判斷，不需憑藉什麼神奇力量或聰明才智，只要充分體會愛德華與馬基本書的教誥，就自然能夠看清楚這些最合理的發展結局。就如同教宗班納迪克16世在另一個領域一樣，只是葡萄園內的謙卑工人而已。


    我試圖把他們的研究變得更現代化一點（如果有必要的話），更能夠融入目前的環境，讓當代的短線交易者與投資人覺得更能接受。


    對於這份持續性的心愛工作，我受到舊金山金門大學研究生與同事們的大力協助。我經常與他們溝通，得到很多啟發，更能體會愛德華與馬基之貢獻在各方面的意義，這些東西都呈現在我的教材與本版內容中。


    詳細而言，不論短線交易者或長期投資人，都會在本書新版找到新的重要內容。在我的研究所課程裡，我體會到馬基所謂「基準點」程序的力量，所以本版加入很多這方面的資料。我對於道氏理論的興趣與尊敬，最近又向上提升，主要是受到布萊恩·布鲁克（Brian
    Brooker）在市場技術分析家協會（Market Technicians Association）發表的一篇論文影響（「剖析道氏理論」[Dissecting
    Dow Theory]）。本版納入這篇文章討論的內容。短線交易者與期貨投機客應該會喜歡本版納入的商品交易資料。近年來，這些玩家受到機械性交易系統的影響實在太大了，或許應該重新體會本書倡導的技術方法。


    本書絕對沒有要預測或分析目前行情的意圖，本書宗旨是研究過去的歷史，藉以提昇目前與未來的處理能力。關於目前行情的分析或預測，請造訪約翰·馬基的網站。雖說如此，為了要掌握最新的狀況，勢必會涉及一些當前的市況與交易工具。就2005年來說，這包括主要指數、黃金、白銀與石油。我們不知道行情發展結果如何。可是，我們可以根據現有資料進行分析。事實上，這也是專業分析師每天面臨的狀況。我們不知道最後結果將如何，但根據本書教導的方法與原理，可以讓自己站在勝算較高的一方。


    此處沒有打高空的餘地。關於古典圖形分析的效力,我們可以檢驗過去關鍵時刻的分析紀錄。各位可以在約翰·馬基網站看到我們在2000年1月份所做的評論：


    道瓊指數：道瓊指數預估會在10000點獲得支撐，該處可以買進，但買進數量不要太多，最好只是整個投資組合的一部份，或稍微加碼。我們估計未來一段時間內，行情會在9000～12000點之間大幅震盪，高檔應該做積極避險，低檔超賣區域則可以解除避險部位。2000年11月18日的評論如下：


    市場基本上只有一種圖形排列，而且是歷經12個月以上的大型排列：一條彎曲的巨蟒。這代表什麼意思？正如莎士比亞說的，不代表什麼意思。當圖形排列具有意義時，我們怎麼知道呢？嗯，在我們確實知道之前，實在不能確定到時候是否真能知道，但如果我們知道的話，絕對會讓各位知道。所以，我們還是繼續挑選適合放空的對象，採取短線交易策略，在頭部進行避險，在底部取消避險。根據目前的走勢排列與上個星期的疲軟走勢判斷，我們不會針對那斯達克的反彈走勢進行交易。如果想要進場的話，只能放空，但風險很高。


    這些投資通訊清楚顯示本書方法的效力，各位如果想要進一步瞭解，請採用下文列示的網址。請注意，我之所以能夠提供這些分析，不是因為本人是天才；關鍵是所採用的方法。就如同任何勝任的圖形分析師一樣，我教導的學生們也大多能夠做相同的分析。


    讀者請不要略過第8版的前言，因為本版仍然採用該處列舉的一些處理方式。馬基曾經說過，本書並不適合擺在書架上偶爾「隨便翻閱」，而是要一讀再讀，仔細斟酌。所以，請聽從馬基的建議，務必仔細閱讀。


    道氏理論分析大师德查·羅素（Richard Russell）據說曾經表示，道瓊指數與黃金價格在未來幾年內會交叉。另外，他也表示，S&P指數正呈現長達10年的頭肩排列。羅伯·普烈希特（Robert
    Prechter）相信，我們正處於浪潮的顛峰，海嘯將至。


    不論道瓊指數36000點或3000點，本書都提供各位應付未來的最佳工具。


    伯西第（W.H.C. Bassetti）

    美國—加州—舊金山


