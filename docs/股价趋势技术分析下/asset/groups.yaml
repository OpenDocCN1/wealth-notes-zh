    艾佛利·德克森參議員（Senator Everett Dirksen）曾經說過，想要聚集美國參議員而讓他們朝單一方向移動，就好比利用手推車運送牛蛙一樣困難。同樣地，要讓所有道氏理論分析師都有一致性的意見，幾乎也不可能。沒有任何權威可以供大家必須遵守的最後決斷。為了避免在孤立狀態做判斷，我在金門大學成立一個委員會，針對相關交易訊號做評估，彙整大家對於訊號有效性的意見。各位如果想與這個委員會聯絡，可以在本書附錄D查閱郵址：cbassetti@ggu.edu。


