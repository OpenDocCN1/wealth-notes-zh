    \ Education of Speculator）（中文版，請參閱寰宇出版公司）。相關引用經過允許。\n\n適用於所有的投機狀況的典型賭徒毀滅問題，可透過下列方式陳述。某位投機客擁有起始資本，來到賭場，每把賭博贏得\
    \ $1.00的發生機率為P，輸 $1.00的發生機率為Q（Q=1-P）。這位投機客準備繼續賭博，一直到下列兩種之一發生為止：總賭本成長為A，或減少為0。對於這場賭博，投機客徹底破產的機率為：\n\
    \n$$\\frac{(Q/P)^{A}-(Q/P)^{C}}{(Q/P)^{A}-1}$$\n\n把相關數據帶入上述公式，假定投機客每賭一把成功的機率為60%，起始資本為\
    \ $1.00，想要把總賭本累積為 $10.00。這種情況下，徹底破產的機率有66.1%。由於他有33.9%＝（100%－66.1%）的機會會最後取得 $10.00，所以最後擁有的期望金額為\
    \ $3.39。起始賭本為 $1.00，期貨獲利為 $2.39。\n\n下列表格顯示期望獲利的數據，假定起始資本為C，每把賭博成功機率為P。如果P固定為60%，則賭本C的多寡將成為最後結果的關鍵。如果起始資本C＝\
    \ $4.00而不是 $1.00，則投機客最後的期望獲利將由 $2.39增加為 $4.17，這方面的改善，類似撲克賭局中，資本雄厚之賭客擁有的優勢。一旦起始賭本超過\
    \ $4.00，則最後結果改善的程度，其抵銷破產風險的效益會遞減。譬如說，如果起始資本C＝ $9.00，雖然破產的可能性變得很低，但最後結果改善的程度只較\
