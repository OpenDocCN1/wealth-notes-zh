    # 第 37 章 相同的舊有型態


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_267_0.png)


    圖257. ABC日線圖，1961年4月～6月。這份走勢圖相當複雜、有些混淆，但其中包含一些值得進一步分析的現象。首先，請注意4月份與5月份形成的頭肩頂排列，尤其是股價最後挫跌之前的最後一波漲勢，成交量明顯縮小。另外，股票在6月份進行分割，這對於股價走勢沒有顯著影響，只是單純的1股分割為2股，股票數量增加一倍，但股價則減為一半，不過平均成交量有稍微增加的現象。請注意，整個盤勢的發展明顯向下，幾波漲勢（尤其是7月中旬的反彈）不能向上穿越4、5月份頭部的延伸線。下降趨勢持續發展超過一年，1962年10月的低點為11
    1/4。'
  - '[PAGE 268]


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_268_0.png)


    等腰三角形可以是主要趨勢的連續排列，但也可以是反轉排列。三角形排列之內的第一個轉折點，成交量通常較大，然後大體上就呈現萎縮狀態，價格波動愈來愈緊密。排列過程，該股票等於是同時處在上升趨勢與下降趨勢，排列下限可以視為上升趨勢線，排列上限則視為下降趨勢線。請注意，排列（向上）突破過程出現大量。另外，價格向上突破之後，三角形「支點」（也就是三角形上限與下限的延伸交叉點）是後續走勢的下檔支撐。4月份到6月份之間，股票漲跌幅微超過三角形排列開口位置的垂直距離。股價漲勢到達目標價位，未必代表主要趨勢將結束；1963年8月，CDP股價為33
    1/4。'
  - '[PAGE 269]


    ![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_269_0.png)


    圖259. XA日線圖，1963年3月～8月。這是上升三角形排列的典型例子，排列內的漲勢都在相同價位折返，折返走勢的下檔支撐則愈墊愈高。這種型態的發展過程，就透露多頭氣息（下降三角形排列則有空頭意涵）。請注意，排列過程中，上限22附近的成交量有放大跡象，8月份的向上突破則爆出大量。如果向上突破的效力還需要其他證據的話，那麼8月12日星期一開盤的跳空缺口應該可以提供。這類突破之後，通常都會現獲利回吐的賣壓，價格可能拉回到三角形排列上限22附近，甚至稍微穿越，這都不會妨礙排列的多頭格局。'
