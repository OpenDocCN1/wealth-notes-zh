    \n投機客每把賭注不該下得太大（相對於賭本而言），如此才能降低毀滅的可能性，但又不能太小，否則無法取得足夠的報酬。不幸地，在現實世界裡，投機客不知道每筆交易的成功機率，所以也沒有辦法透過前述表格設定每筆交易的最佳投入金額。\n\
    \n如果每筆賭博或交易的勝算不到50%，情況就不同了。\n\n投機客或賭徒如果擁有優勢（勝算超過50%），就應該想辦法「積少成多」，每筆賭注不該太大。可是，如果勝率不到50%，就應該想辦法打「全壘打」，每筆賭博都儘可能投入最大的賭注，因為唯有如此才可能成為贏家。正因為這個緣故（或至少是一部份理由），賭場要限制賭客每筆賭注的上限；同樣的道理，交易所也有部位上限的規定（換言之，一般大眾頂多只能持有某種數量的部位）。\n\
    \n## 第7節 基本分析觀念\n\n取自1984年12月15日的〈約翰·馬基市場通訊〉\n\n（作者：理查·麥德莫特）\n\n### 艾略特波浪理論：觀點與評論\n\
    \n這個星期，我們很高興能夠參加紐約市場技術分析師協會（Market Technicians Association of New York，MTANY）的12月份聚會。\n\
    \n長期訂閱者應該清楚，MTANY曾經在1978年推選約翰·馬基為「年度最佳分析師」。當時的演講者是羅伯·普烈斯特（Robert Prechter，「艾略特波浪理論家」[The\
    \ Elliott Wave Theorist]的發行者），他根據艾略特的股票市場理論進行預測。\n\n關於普烈斯特的評論，大家最有興趣的，是他對於技術分析本身的看法。艾略特波浪理論實際上只是股票市場價格走勢的一份「目錄」，顯示這些走勢如何一層疊著一層，直到所謂的超級或根本型態浮現為止；換言之，也就是純粹的技術分析。普烈斯特對於基本分析所做的定義如下：\n\
    \n1. 「首先，讓我們界定「技術」相對於「基本」資料的定義……技術資料是相關市場行為產生的資料。」\n2. 「基本分析的主要問題，是其指標是由市場本身抽離的。分析師假定外部事件與行情走勢之間存在因果關係，這幾乎可以確定是錯誤的概念。可是，還有一點同樣重要而較少人留意的問題，基本分析在達成任何結論之前，幾乎必定要針對基本資料本身做預測。所以，分析師被迫採取第二步驟，他必須根據所預測的東西來預測另一項東西。技術分析師只需要採行一個步驟，這讓他們享有根本優勢。技術分析者不需預測所使用的指標。」\n\
    3. 「更糟者，基本分析的第二步驟，也可能是建立在流沙之上……基本分析經常預測企業當年度與隔年的盈餘，然後在這個基礎上提供建議……。這個紀錄本身很不理想，如同《拜倫週刊》(Barron's）在6月4日文章上提到的，對於道瓊工業指數的30支成分股來說，即使會計年度已經結束，盈餘預測仍然有18%的誤差，隔年盈餘預測則有54%的誤差。可是，真正的致命關鍵在於一項假設：正確的盈餘預測，能夠篩選真正的股票贏家。根據先前提到的《拜倫週刊》文章，購買道瓊工業指數盈餘預測最佳的10支股票，10年累積獲利為40.5%，但如果買進盈餘預測最差的10支股票，同期獲利為142.5%。」\n\
    \n普烈斯特採用的技術分析方法不同於我們，但他對於基本分析的看法，我們則非常認同。\n\n## 第8節 套件軟體與技術分析網站\n\n最早的人類，只能赤手空拳爭取生存。等到某個聰明人找到一支適合戰鬥的木棍，人類鬥爭從此踏入另一階段。無知、傲慢的交易者，大聲嘲笑懷可夫（Wyckoff）的股價走勢圖。當布萊‧胡爾開始採用各種報表從事選擇權交易，太平洋選擇權交易所的造市者都抱著看笑話的態度。最初，採用木製網球拍的選手們，看到合成碳纖維球拍都深惡痛絕。\n\
    \n情況不再如此了。最後採用新武器的人，都是死人。價格走勢圖能夠展現其力量，胡爾的B-S選擇權訂價模型報表也是如此。輸家很快就發現，他們需要新武器。我準備在此討論一些我個人最喜愛的武器：套件系統與網站。當然，我提供的資訊絕對不完整。另外，我的選擇只是不過反映我個人的喜好，並不代表其他的軟體或網站不值得推薦。\n\
    \n就我個人觀察，對於任何技術分析者來說，有三套桌上型電腦套裝軟體最值得考慮：AIQ Trading Expert Pro (aiqsystems.com)；Metastock\
    \ 9.0；（equis.com）TradeStation 2000i (tradestation.com)。本書採用不少這些軟體繪製的圖形，但多數是馬基提供的精緻手工繪製走勢圖。所有這些套裝軟體都能夠繪製技術分析師需要的基本圖形，也可以繪製投資組合與相關資料的圖形。我曾經說過，圖形分析師真正需要的，是在走勢圖上繪製直線，然後觀察走勢曲線、長條圖或K線，以及其他等等。然後，這些套裝軟體還有各種特殊的功能，有助於分析，使得基本分析工具能夠發揮更大作用。當我們看著超賣指標的時候，有時候會認為：「這對我有什麼用？價格走勢圖已經顯示相關資訊了。」分析師可能希望多瞭解一些%R指標，這個指標如果對於拉利·威廉斯（Larry\
    \ Williams）有用，那就有些內容。\n\n### AIQ—TRADING EXPERT PRO\n\nAIQ套裝軟體包括螢幕控制面板與捲軸指標盒，後者標示各種顏色。資料管理很容易進行，使用者可以自行建立系統模組，藉以測試某種構想。另外有各式各樣的報告可供運用。對於短線交易者而言，即時警訊是這套系統的特色之一。投資組合模組協助投資人進行管理，對象不只是投資組合而已，還包括部位的停損設定。總之，擁有這套系統，就好像有位技術大師隱藏在幕後，隨時提供建議與指示。\n\
    \n### METASTOCK 9.0\n\nMetastock 9.0提供一系列令人印象深刻的工具與指標。「系統專家」（System Experts）隨時彈出提供指示，涵蓋系統測試與探索。「專家」還可以提供買、賣建議。圈叉圖也是不錯的功能。這套軟體可以建構與測試交易系統，提供各種重要的資料分析，確實是非常值得重視的工具。最後，這套系統也很容易掛上額外的軟體，史勞森的「強力攻擊」（Powerstrike，尋找關鍵支撐／壓力的量化工具）就是很好的例子。\n\
    \n### Tradestation 2000i & Tradestation 8\n\nTradestation 2000i是Tradestation 8的獨立系統，後者是一套即時線上套裝系統，可以透過Tradestation經紀商網路進行交易。這套系統的功能非常強大，線上的專業或半專業使用者，或許可以結合本身的軟體與經紀商的設施，取得最大的運用效益。2000i系統則需要由使用者本身處理自己的資料庫，Tradestation\
    \ 8則可以隨時透過網路取得所需要的資料。對於一些懶人而言（包括編者本人在內），這確實是很有用的功能。Tradestation原本就是以交易系統建構與測試聞名，現在還是如此。透過「簡易語言」（EasyLanguage），使用者幾乎可以把任何交易構想付諸執行，而且還能夠與該套裝軟體的使用者社群在線上討論、聊天。這個社群提供很多有關交易系統、交易概念的資料。\n\
    \n### 網際網路：prophet.net\n\n對於一些更懶惰、更漫不經心的投資人來說，還有一個技術分析資訊的專門網站prophet.net，其提供的免費服務，應該能夠滿足一般投資人的技術分析繪圖需要。該網站提供各種互動式圖形與投資組合報告，一些精打細算的投資人可以經由這個網站節省不少錢。如同馬克士溫說的，省下一塊錢，等於賺到一塊錢。換言之，每省下的一塊錢，都可以作為交易資本運用。這個網站使用者構成的社群，則是另一項可供運用的資源。當然，使用者沒有必要自行建立資料庫。另外，這個網站的編輯，偶爾還會提供一些行情評論與分析。總之，這個網站絕對承受得了《拜倫週刊》、《富比士》與《技術分析雜誌》的讚譽。\n\
    \n### 網際網路：stockcharts.com\n\n這個網站也提供類似等級的服務，同樣得到《富比士》與《技術分析雜誌》的讚譽，但stockcharts.com另外還提供一向珍貴資源：圖叉圖。本書並沒有討論圖叉圖，但這是一種重要的技術分析方法，對於有耐心的投資人尤其有用。當然，任何該有的東西，stockcharts.com都提供，包括：陰陽線、長條圖……等。著名分析師約翰·墨菲（John\
    \ Murphy）以此為老本營，還有陰陽線專家葛雷克·摩里斯（Greg Morris）也在此。另外還有「偷窺」（Voyeur）功能，讓使用者可以看到別的交易者正在做什麼。\n\
    \n### 摘要結論\n\n知識即力量。知道在哪裡找到知識，則更重要。有興趣的投資人，可以留意《拜倫週刊》、《富比士》或其他金融媒體對於這類網站的每年評估。\n\
    \n## 附錄 D\n\n第9版附註：柯蒂斯·費司（Curtis Faith）是里查·丹尼斯（Richard Dennis）最初訓練的「龜族」（Turtle）成員，他非常慷慨地編寫了一份龜族的期貨市場交易系統。這份文件可以在orginalturtles.org找到，可以算是現代一般交易的主要模型。我個人擁有一些交易系統與程序的手冊。這些文件的主要目的與功能都很類似。我認為，費司的龜族手冊可能是其中最棒者之一，而且也是我最認同的。\n\
    \n我個人非常認同這份文件，主要是因為我偏好「自然」系統，而不是「數值導向」的系統。圖形判讀很自然地反映市場事實，就像手掌與手套很自然地結合在一起。高價／低價系統就像龜族系統，也像道氏理論根據市場韻律的自行調整。而且也像所有的機械化系統一樣，有其優點與缺點。機械化系統的最大缺點，就像真正的機械一樣，如果市場韻律與交易系統之間不能協調，就會讓交易資本像是進了絞肉機的牛排。慘不忍睹的血腥風雨。尤其是你自己養的牛被絞碎。\n\
    \n我如果建議各位直接採用這套系統，那就太魯莽了。可是，我相信這套系統（或許經過某些調整）非常適用於趨勢明確的行情。\n\n我要求研究所的學生們，每人都要提供一份這類的手冊，而目前這份文件就是典範。\n\
    \n### 第1章 完整交易系統\n\n龜族交易系統屬於完整的系統，涵蓋交易的所有層面，幾乎完全不容許交易者有主觀判斷的空間。\n\n成功的交易者，多數都採用機械化系統。這種現象絕非巧合。一套好的機械交易系統，可以透過自動化程序完成整筆交易。這套系統能夠讓交易者擁有穩定的績效，因為其中蘊含著一套明確的法則，規定交易者在什麼情況下、採取什麼行動。換言之，系統的機械化性質，讓交易者沒有主觀判斷、計價還價的餘地。\n\
    \n如果我們知道自己的系統具有長期獲利能力，那麼萬一碰到連續虧損期間，比較容易繼續遵守系統的指示，堅持運用該系統。反之，如果我們都是自行判斷交易機會，往往會在最需要大膽採取行動的時候，變得謹慎或畏首畏尾。\n\
    \n如果我們擁有一套機械化交易系統，而且固定根據該系統進行交易，操作績效應該很穩定，即使我們的情緒可能因為連續獲利或連續虧損而起伏不定。一套經過完整測試的機械化交易系統，能夠提供信心、穩定與紀律，這些正是交易成功的關鍵所在。\n\
    \n龜族交易系統屬於完整的系統，涵蓋交易的所有層面，幾乎完全不容許交易者有主觀判斷的空間。這套系統具備完整交易系統的所有必要成分。\n\n#### 完整系統的必要成分\n\
    \n一套完整的交易系統，必須涵蓋交易成功必要的每項決策：\n- 市場——買進或賣出什麼\n- 部位大小——買進或賣出多少\n- 進場——什麼時候買進或賣出\n\
    - 停損——什麼時候結束失敗部位\n- 出場——什麼時候結束成功部位\n- 戰術——如何買進或賣出\n\n##### 市場——買進賣出什麼\n\n第一項決策是：買進或賣出什麼。換言之，針對哪個市場進行交易。如果交易的市場太少，比較不容易碰到適合進行交易的顯著趨勢。另外，如果市場交易不夠活絡、趨勢不夠明顯，我們也不希望進行交易。\n\
    \n##### 部位大小——買進或賣出多少\n\n買進或賣出多少，這是非常根本的問題，但經常被忽略，甚至處理不當。\n\n部位規模大小會影響分散投資程度與資金管理。分散投資可以讓風險分散在更多投資工具，也會有更多可供獲利的機會。適當的分散投資，需要採用類似而不同的交易工具。資金管理實際上就是控制風險，免得我們在掌握理想趨勢之前，就因為虧損而耗盡資本。\n\
    \n「買進或賣出多少」是交易操作的最重要層面之一。太多初學者，他們每筆交易投入的資金太大，顯著提升破產的機率，即使擁有最棒的交易系統，或許也沒有發揮的機會。\n\
    \n##### 進場——什麼時候買進或賣出\n\n什麼時候買進或賣出，這經常稱為進場決策。如果採用自動化交易系統，不論是買進或賣出，系統都會顯示明確價格與市況條件。\n\
    \n##### 停損——什麼時候結束失敗部位\n\n不願及時認賠的人，沒有辦法獲取長期成功。關於認賠出場，最重要的是在建立部位之前，就必須設定停損價位。\n\
    \n##### 出場——什麼時候結束成功部位\n\n很多自詡為完整系統的「交易系統」，對於如何結束成功部位，並沒有明確的處理方法。事實上，就系統的獲利能力而言，何時結束成功部位，是最重要關鍵之一。任何交易系統如果沒有明確說明如何處理獲利部位，就不能稱為「完整系統」。\n\
    \n##### 戰術——如何買進或賣出\n\n交易訊號一旦產生，究竟如何執行，這方面的戰術考量很重要。大型帳戶尤其是如此，因為其部位進出往往會顯著影響行情，造成價格往不利方向發展。\n\
    \n### 摘要結論\n\n想要透過金融交易穩定賺錢，最好的辦法是採用機械化交易系統。如果我們知道自己的系統具有長期獲利能力，那麼萬一碰到連續虧損期間，比較容易繼續遵守系統的指示，堅持運用該系統。反之，如果我們都是自行判斷交易機會，往往會在最需要大膽採取行動的時候，變得謹慎或畏首畏尾。\n\
    \n如果擁有一套高勝算的交易系統，而且嚴格遵守系統指示，應該可以穩定獲利，即使我們的情緒因為連續獲利或連續虧損而起伏不定，交易系統也會協助我們渡過難關。\n\
    \n龜族使用的系統，屬於完整交易系統。這是我们得以成功的關鍵之一。這套系統的性质，使我們能夠穩定進行交易，而且獲取成功，因為這套系統沒有留下任何模糊空間可供交易者自由心證。\n\
    \n### 第2章 市場：龜族的交易對象\n\n龜族的交易對象包括芝加哥與紐約之美國集中市場掛牌交易的高流動性期貨。\n\n龜族都是期貨交易者，過去習慣稱之為商品交易者。我們從事美國商品交易所提供的最常見期貨契約。\n\
    \n由於我們的交易金額很大，所以不會選取那些每天成交量只有幾百口契約的市場，否則我們下單的數量會嚴重影響行情，必須花費大量額外成本才能建立或結束部位。龜族只介入流動性最高的市場。\n\
    \n原則上，龜族接受任何流動性夠高的美國市場，但穀物與肉品例外，因為理查．丹尼斯本身的帳戶，已經用光這些市場的配額，如果我們又從事這些市場的交易，部位規模會超過交易所的規定。\n\
    \n我們不從事肉品交易，主要是因為肉品交易軔的交易員涉及一些不法事件。龜族解散的幾年之後，聯邦調查局對芝加哥的商品交易軔進行大規模調查，懷疑很多場內交易員涉及價格操縱與其他不法行為。\n\
    \n以下是龜族進行交易的期貨市場：\n\n- 芝加哥期貨交易所\n    - 30年期美國長期公債\n    - 10年期美國中期公債\n- 紐約咖啡—可可—糖交易所\n\
    \    - 咖啡\n    - 可可\n    - 糖\n    - 棉花\n- 芝加哥商品交易所(CME)\n    - 瑞士法郎\n    - 德國馬克\n\
    \    - 英鎊\n    - 法國法郎\n    - 日圓\n    - 加拿大元\n    - S&P 500股價指數\n    - 歐洲美元\n \
    \   - 90天期美國國庫券\n- 紐約商業交易所\n    - 黃金\n    - 白銀\n    - 銅\n- 紐約商業交易所\n    - 原油\n\
    \    - 熱燃油\n    - 無鉛汽油\n\n龜族可以自行決定交易哪些市場。可是，如果某位交易者決定不從事某特定市場的交易所，那大概就永遠不會進入該市場。我們不會有一搭、沒一搭的從事交易。\n\
    \n### 第3章 部位規模\n\n龜族採用價格波動率為基準的固定百分率風險，做部位規模控制。\n\n對於任何交易系統，部位規模是最重要、但也是最容易被忽略的關鍵。龜族採用的部位規模計算方法，當時屬於最先進的觀念，因為部位規模是根據市場的價格波動金額調整，所以是把價格波動金額常態化為部位單位。換言之，不論哪個根本市場的價格波動程度如何，相同單位的部位規模，其每天價值波動都是一樣的。\n\
    \n為什麼？價格波動愈劇烈，每單位代表的契約口數會對應變小；所以，價格波動非常劇烈的市場，其每口契約的價值波動雖然很大，但由於部位的契約口數較少，整體部位的價值波動將類似於其他採用相同單位的部位。\n\
    \n這種價格波動常態化的程序非常重要，因為不同市場的部位，所發生的盈虧金額會趨近於相同。這可以讓分散交易更有效地降低風險。\n\n即使某市場的價格波動很小，但只要出現夠大的趨勢，還是可以創造顯著的獲利，因為對於這類市場，龜族會持有相對龐大的部位。\n\
    \n#### 價格波動率——N的意義\n\n龜族採用理查·丹尼斯與比爾·艾克哈特（Bill Eckhardt）所謂的N，藉以代表某特定市場的根本價格波動率。N實際上也就是真實區間（True\
    \ Range，現在都簡稱為ATR）的20天期指數移動平均（EMA）。概念上，N代表特定市場當時的每天平均價格波動區間。相較於一般計算的最高價一最低價區間，N還考慮開盤跳空缺口在內。\n\
    \n每天真實區間的定義如下：\n\n真實區間＝Max（H-L，H-PDC，PDC-L）\n\n其中：\n- H＝當天盤中最高價\n- L＝當天盤中最低價\n\
    - PDC＝前一天收盤價（Previous Day's Close）\n- N則定義為真實區間的20天期EMA：\n\n![](img/1d6bd8f62a9f7f0ac427f3300ba0344b_431_0.png)\n\
    \n其中：\n- PDN＝前一天的N（Previous Day's N）\n- TR＝當天的真實區間\n\n根據前述公式，由於每天的N需要採用前一天的N（PDN），所以最初需要計算真實區間TR的20天簡單平均數，以此作為基礎來計算第一個N。\n\
    \n#### 價格波動金額調整\n\n關於部位規模大小，首先要決定代表特定市場之價格波動程度（由N衡量）的價格波動金額。聽起來似乎蠻複雜的，實際上很簡單：\n\
    \n價格波動金額＝N × 每點金額\n"
