  md: '# 每年10分鐘，讓你的薪水變活錢


    # 【表3-12】2008-2014年關先生四種方式績效總表


    | 進場原則 | 方式 | 資金進場次數 | 進場次別 | 開始進場時間 |

    | :--- | :--- | :--- | :--- | :--- |

    | **藍燈啟動** | A | 5 | 1 | 2008-08 |

    | | | | 2 | 2011-12 |

    | | B | 10 | 1 | 2008-08 |

    | | | | 2 | 2011-12 |

    | **黃藍燈啟動** | C | 5 | 1 | 2008-06 |

    | | | | 2 | 2011-12 |

    | | D | 10 | 1 | 2008-06 |

    | | | | 2 | 2011-12 |


    從表3-12中看到結果有很大差異，其中投資方式C，落後0050長抱不動的操作，原因是2008年這樣的股災，後半段下跌得快，幅度又大，時間也比預期的長一點，就會造成股市還未到底部，子彈就已用完了，因此以黃藍燈即將進入經濟衰退，而不是以已經進入經濟衰退的藍燈啟動進場，股市進場的次數太少，速度太快，無法應對股災，所以10次進場的方式比較穩妥。


    總結的說，兩種方法都是經過基本分析，透過景氣對策燈號包含九種考量因素，用一個非常有效的方法來過濾，已避開了高點進場的殺傷力，到了一個合理的安全點，不管是我的紀律投資，加上操作力道變化，或邱小'
