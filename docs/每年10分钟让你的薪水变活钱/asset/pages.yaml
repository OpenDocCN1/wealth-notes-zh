    怎會有此現象？美國所得稅高，節稅工具有限，房貸利息是其一，退休帳戶其二，光是這管道，資金就像連接了永不枯竭的水庫，以2015年為例，小到個人帳戶IRA可放入5,500美元，到公司的401K計畫，每年可放1萬8千美元，若是確定福利計畫（Defined
    Benefit Plan），那金額更高，這可從所得中扣除，政府當你沒有這筆收入，是很大的省稅福利。


