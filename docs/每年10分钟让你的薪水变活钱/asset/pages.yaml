    那天我打電話換票，對方英語流利，但口音很明顯是東方人，態度親切，完成手續厚我好奇地問，「你在美國哪一州？」她說在馬尼拉，我一看下午 6 點鐘，老美下班了，亞洲接上來了，美國的勞工有抱怨嗎？美國人面臨全'
