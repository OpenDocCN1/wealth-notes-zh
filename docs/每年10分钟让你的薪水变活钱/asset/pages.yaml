  md: '人在股市的低點出場，也就是說，好的投資方法，碰到了不對的時間，以及對自己風險承受力的瞭解不夠，都可毀掉一盤好棋。


    那有沒有方法可彌補？有的，資產配置的設計就是解決此一難題，資產配置有它成功的基礎條件，但許多人未必會用，也未必願意用，什麼原因？還是我所說的，觀念的問題，和是否瞭解透徹，這部分內容不少，以後有機會再論。


    使用資產配置可以讓風險承受力低的族群，也可投資股市，分享經濟的成長，對想進入股市卻因劇烈波動而卻步的，那麼資產配置是值得借重的好方法。


    # 鐘擺理論


    股市是經由人的操作，只要有人的地方，就有情緒的因素，而貪怕的反應又讓股市在漲與跌、高與低之間都做一個極端的搖擺，甚至在超漲和超跌的階段，都戴上了僞裝的面具，看不清楚特質和現象的投資者，通常要付出慘痛的代價。


    所以能利用這鐘擺現象，抓出「相對」高低點的，則是多了一層保護，特別是在台股，所以介紹了三種相對高低點的判斷，從數據來看，這做法是有效的，至於美股的'
