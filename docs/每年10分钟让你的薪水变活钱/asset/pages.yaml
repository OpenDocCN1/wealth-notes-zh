    # 台股穩操勝算的操作


    施先生、邱小姐和我都建議台灣投資者，使用相同的投資工具0050，把我們三位的心得再做一個調整或混搭，也就是以邱小姐的穩定基礎，景氣對策信號212買282賣，先立於不敗之地；有興趣的人再加上我的方法，買在兩個區段，使用定時定額或定時不定額，彷如彈簧槍的打法，越跌時反而越買，好處是資金會多少分布在相對低點，這個做法攻擊性比較強，出場時分三次，一定賣完為止。對在這個基礎上還想利用施先生短線進出，創造額外的利潤，他的分析也使用了簡單的工具，交出的成績應該會優於多數的個股投資者，這樣的成功基礎有共同特點：


