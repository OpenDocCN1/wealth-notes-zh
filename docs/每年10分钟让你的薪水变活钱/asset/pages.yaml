  md: '# 每年10分鐘，讓你的薪水變活錢


    幾個論點值得你注意，分別是：


    +   1. 推手（Builder），推手擅長鼓勵，總會把你推向終點。他會真心希望你成功，即使他們必須為你承擔風險。


    +   2. 支柱（Champion），支柱會永遠站在你這一邊，他們懂得讚美，讓你的生活多姿多采，你可以安心與他們分享一切，不管別人怎麼說。


    +   3. 同好（Collaborator），同好是與興趣相近的朋友，這類朋友是許多親密友誼的基礎。


    +   4. 夥伴（Companion），只要有需要，夥伴總會在你身邊，他們幾乎是可以性命相託的朋友。


    +   5. 中介（Connector），中介會搭起橋梁，讓你得到自己想要的東西。


    +   6. 開心果（Energizer），這個「好玩的朋友」總會讓你有好心情，非常擅長找出正面的能量。


    +   7. 開路者（Mind Opener），開路者開拓你的視野、鼓勵你接受新事物。他們很懂得如何激發你的創意。


    +   8. 導師（Navigator），導師可以給你建議，找到正確的方向。他們會為你諳析利害，找到解答。


    上面所提到人生的8個朋友，不會是一個人扮演全部的角色，每個人可能只有上述一、兩項特質，我覺得值得你好好投入一些時間，在你的周遭朋友中用心觀察，和他們建立起一個良好又穩固的友誼。很重要的是，你必須先'
