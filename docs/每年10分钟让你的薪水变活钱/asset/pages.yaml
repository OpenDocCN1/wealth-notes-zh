    +   3. 阿甘的投資法跟面上所說的投資成本平均法，還是有一點不同，雖然都是持續性的投資，不管股市漲跌，但最大的不同點，多數的投資機構，對投資對象沒有嚴格限定，彷彿適用所有的共同基金，而阿甘投資法則只有嚴選定美國的道瓊和標普500，勉強可以做第二種考量的全球指數基金以及全球股債混合的指數基金。對台灣投資者而言，可以考慮和台灣的指數基金代號0050混搭，這個部分另有章節討論。如何進入美股選用道瓊和標普500的ETF也另有章節，你只要跟著方向走，就不會離目標太遠。


    +   4. 就算一般不管是定時定額，或定時不定額的投資平均成本法，也未必適用於單一股票的管理，因為單一股票有可能破產，共同基金會好一些，但也不是所有的共同基金都適用，還是要做足功課，瞭解基金的投資風格，謹慎篩選。'
