  md: '# 每年10分鐘，讓你的薪水變活錢


    唱催眠歌，進入夢境，幻想著各種童話奇景，也就是這首〈夢幻曲〉。因廣受歡迎，有各種樂器的版本，小提琴有它特殊的韻味，一併附上，但一定要聽原汁原味的鋼琴曲，由20世紀著名的鋼琴家霍洛維茲（Vladimir
    Horowitz）所演奏，當時近82歲高齡，在離開故鄉六十一年後，對舒曼兒時情景（kinderszenen）的詮釋。


    1856年那一年，布拉姆斯離開了克拉拉，但他的心未曾離開，仍然停泊在「愛」與「琴」海。那段期間，他資助克拉拉全國巡迴演奏舒曼的所有作品；也寫過無數給克拉拉的情書，他們保持聯繫，時時關心對方的生活，空間隔離，心卻相繫，這對布拉姆斯的創作有深遠的影響，自此他的作品，常流露內心深處情感的吶喊，布拉姆斯讓自己的愛慾與思念的巨浪，用音樂創作來表達，達到了巔峰。


    當然，愛情的花不會只開一次，和克拉拉分別的若干年後，喜歡上一位女歌唱家，卻沒有結婚，後來她成為法柏夫人，布拉姆斯寫了一首曲子慶賀她第二個兒子的誕生，就是那首著名的搖籃曲。


    1896年，77歲的克拉拉去世前，體力虛弱，依稀記得布拉姆斯的生日，用顫抖的手寫下了祝福的話語寄給他。不久布拉姆斯接到克拉拉去世的電報，63歲的他正在距離法蘭克福200公里的瑞士療養病體，一路奔波，想見最後'
