    # 理財學堂


    共同基金以美國的交易為例，下午4點前收到的購買單，以當天的收盤價做為買賣依據；比較不能反應這一天之內隨時的波動；而指數基金（ETF），因為是模仿和追蹤，所以漲跌跟指數幾乎同步，股價也跟著隨時反應變化著，不只這個變化，它幾乎產生了許多多樣的組合和設計，可以有雙倍甚至三倍這樣使用財務槓桿，也有反向進行，先在高點借別人的股票賣出，然後低點補回歸還，賺取價差，這種放空（short
    sale）操作的反向指數基金，是看跌股市時的一個操作工具。'
