  md: '夏威夷而是漢城，不是看韓星而是韓航最便宜，加上老師說機上紅酒隨你喝，所以選了這條費時又不順的路線，那是窮學生用時間換鈔票的做法。


    當時美國的校園台灣留學生人數龐大蔚為主流，韓國學生稀稀落落，課堂上的表現也沒特別突出，但三十年下來，世界在不停的變動，河東河西互相異位了。


    出國前，三位工專的老友世銦、國鋒、志平，送了我名牌的飛利浦電動刮鬍刀，讓我每天早上都想起他們三位的情誼。看到飛利浦 (Philips) 品牌時，有什麼聯想呢？我想到的是市值第一的台積電，飛利浦當時是第二大股東，二十年來獲利近
    300 倍，創下外商在台灣的投資奇蹟。當時台灣缺少資金，但創造了一流的企業。


    1987 年畢業的我們，面臨兩種選擇，一是回台發展（台積電也在同年 2 月創立），另外是留下來先學國外的經驗，這一留，許多人在美待了下來。回頭一看二十五年前蓬勃的台灣證券市場，指數在最高點
    12,682，同期美國的道瓊指數約 2,791 點，而 2014 年道瓊已創下 1 萬 8 千點（不考慮股利再投資），相差近 5 倍，可以說美國的華爾街並不缺台灣的資金，而台灣可能欠缺像美國華爾街這樣一個國際舞臺所擁抱的投資機會。


    我的留學生涯早已告了段落，驀然回首，看到台灣投資者現在所面臨的困局，真有多感觸，中鋼 2014 年籌'
