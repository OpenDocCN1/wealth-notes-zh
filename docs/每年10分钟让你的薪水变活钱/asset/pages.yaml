    投資就對了，以他這麼多年的奮鬥，應該在步入中年，進 入被裁員的高峯期時，早就應該有一個賺錢的分身。


    你認為問題出在哪裡？我們常說知識就是力量也是財 富，他也想投資，要不不然不會一直找尋進場的切入點，但 他並不瞭解股市的本質，也不瞭解美國股市的特性，如果 他能對股市有一個寬闊的視野，瞭解每一項投資工具的限制，以及如何利用這個限制，就像我們這本書從頭到尾，
