  md: '股市最簡單的เครื่องมือ，不但省事而且還省錢，因為它的交易費比一般購買股票來得低，一般股票的交易稅是千分之三，但台灣 50 卻只要千分之一。


    台灣 50 雖沒有標普 500 歷史悠久，世界知名企業也沒有標普 500 多，但除了交易稅低廉外，還有一個被推薦的最主要原因是和標普 500 共同的特質，就是股價掉下來總有一天會彈回去，除非台灣整個消失，雖沒有像標普
    500 彈性那麼高，但它是參與台股最有代表性，既好操作又安全的工具。


    有了這個我們最想要的穩定性和恢復性之後，再來求變化，就是後面要討論的技巧問題，因為有穩定性，所以適合多數的投資者，因為有恢復性，剛開始就算犯錯，也不至於兵敗如山倒，無法彌補，不像有些公司一旦失去競爭力走向下坡甚至面臨破產，台灣
    50 有可能表現不夠好，但幾乎沒有消失的困擾。


    然而台灣畢竟是一個淺碟型的市場，無法與標普 500 這樣的航空母艦相比，但台灣 50 也算是台灣市場的航空母艦，因為它的交易稅便宜，所以要玩短線也比較有本錢，淡妝濃抹總相宜，長抱短進也可以，應該是一般投資者的首選。


