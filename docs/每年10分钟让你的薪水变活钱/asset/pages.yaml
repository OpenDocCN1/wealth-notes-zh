  md: '# 結論


    # 登高後的再回首——見林也見樹


    你怎麼定義成功？有人說成功是一個過程，而不是一個結果，對人生而言可以如此注解，盡心盡力的過程本身就是美麗的，因結果有時非能所願，中國人所謂的盡人事、聽天命就有這樣的味道，但對投資而言，就不能只看過程，要的是結果，就是早日達到財務自由，或借助獲利，讓金錢做事，實現你的理想。


    如何做到？這有觀念的指引、對的方法和管理，在我的職業生涯中，幫助了許多人達到財務自由，我一直認為觀念比技巧更重要，因為觀念是一個方向，如果方向錯誤，加速只會離目標更遠，這也是本書在觀念和投資情緒上的管理，不厭其煩一再加強的原因。


    方法當然也重要，因有較高的效率，可少走許多彎路，但現代人喜歡很炫或複雜的操作技巧，以為那是致富的捷徑，心想不複雜怎麼可能獲利，其實百年來的華爾街只有三個敵人：貪、怕、沒有耐心，能夠克服這三天敵，離投資成功就不遠了。'
