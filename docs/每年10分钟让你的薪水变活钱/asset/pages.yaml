    台灣大戶應該瞭解，一個多數散戶不會賺錢成交量萎縮的市場，絕對不會是雙贏的，大戶綁架了散戶，以成交量的下跌做為談判的籌碼，一個不能對股市和房產所得課稅的國家，怎能讓社會和諧，國家強大，也不公平，套句一位政治家所說，一個富人如果旁邊都是窮人，對富人而言不會是一個舒適和安全的環境。


