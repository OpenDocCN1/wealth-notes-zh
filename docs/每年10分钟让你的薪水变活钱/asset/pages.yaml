    # 最傲人的財富


    2005年6月，賈伯斯在史丹佛大學的畢業演講致詞，那是他人生最後一個畢業致詞，他有限的生命結束了，在人間的工作也告一段落，但他之前所做的努力、成果，還在我們的生活中持續發酵，繼續激起漣漪震盪的擴散，人已蓋棺，對他的評價卻還無法論斷。難怪古人說：「人生有三不朽，立功，立德，立言。」這三不枯應該是這生命中的極致，也是最傲人的財富之一，銀行中的存款、股市中幾個漲停板，當然也是財富的一種，不過和用生命所創造出來的財富，這些有形的資產相對的重量相對就減輕了許多。


    我身為一個財務規畫師和投資管理者，當然知道有形財富的重要，但凡事過與不及都值得商榷，人生還有許多其他的財富，其重要性不亞於金錢，誠如布萊恩·戴森所說，「健康、家庭、友情和靈魂，如何在人生旅途中均衡的全面追求，是一個不簡單的挑戰。」通常是要錯過了、失敗了，才能夠深切的感受，那就是四個球的脆弱性跟時間'
