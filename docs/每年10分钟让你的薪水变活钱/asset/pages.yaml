    # ## 拜託你不要再買了！


    當時我使用融資持續加碼台股，電話那一端的營業員極力拜託我說，「關先生你能不能不要再買了？」她擔心股價再下跌，我會違約不付款。她表示，有個客戶原本有 5,000萬台幣資產，現在全賠了，還欠證券行500萬，而且人已經跳樓了。


    2008年10月29日，我寫了電郵給她。提到：「憑什麼投資可以賺錢？不就是「買低賣高」嗎？什麼時候是最低，沒有人知道，但是連專家都想跳樓，甚至連著名的財經專家A先生也建議大家保守的時候，很可能就是「相對」的低點。如果在低點不敢參與投資，或者不能參與投資，那又如何獲利呢？


    所以，兩年後回顧，很可能最近的股價是應該買，而不是拚命的逃離，但你我都可能同意的，要有現金部位的管理，和持續進場的安排。 」


