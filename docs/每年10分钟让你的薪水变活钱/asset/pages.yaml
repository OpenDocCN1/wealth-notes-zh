    2. 更令人擔心的是，這些年美國二十年政府公債的利率節節下降，2013年結束之後，老王如果還想續約下一個二十年的美國政府公債，在2013年利率市場的環境下，只能找到3.72%的利率，也就是20萬美元本金歸還以後，重新購買的政府公債的利息減少了，得到的利息只有7,440美元（20,000美元×3.72%），比二十年前的12,960美元下降許多。


    老王確實被保證收得到利息，本金到期歸還，但與二十年前相比，不但是利息收入損失了42%，再加上通貨膨脹造成幣值購買力下降37%，這兩個雙重打擊，使得當年看起來安全萬無一失的投資一點也不安全。


