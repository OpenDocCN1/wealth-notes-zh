  md: '# 每年10分鐘，讓你的薪水變活錢


    # 把握人生禁得起股市震盪的二十年黃金期


    股市當然也有它的缺點，例如短期價格的劇烈波動，這會讓人卻步，特別是接近退休時，所以要充分把握人生某一時段，可以禁得起股市短期震盪的黃金期，把握這十五到二十年的時間，可以有較多的資金能進入標普500，打下基礎，如果可以承受風險時，卻選擇過度保守，那麼就像該搭飛機的旅程，卻選擇了步行，緩不濟急且難達目的。


    # 欲抓完美時機，反錯失成長契機


    台灣股市長達二十五年在區間整理，所以長抱不動的做法難有優勢，這形成了多數台灣投資者短進短出的習性，但若投資美股，這思維要略調整，避免為了抓完美時機，反而錯失了在場內累積成長的契機。阿甘投資法的兩個不同時段的數據在在證明，就算碰到百年罕見的股票災，只要有二十年的投資時間，有下列兩種效果：


    一、再倒楣的人，只要持續投資全球有競爭力的市場，依然可以獲利；阿甘投資法顛覆了許多人的認知，二十年的投資下來，極端好和極端壞的投資，兩者成果的差異並沒有大到大多數人的想像，所以不花時間待在場內的'
