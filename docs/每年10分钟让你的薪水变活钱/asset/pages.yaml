  md: '# 成長篇：幫助年輕人脫離「薪貧族」的10封信


    當美股價格偏高時，美國投資者就到海外找尋更好的投資機會，台灣的投資者也應學習這策略，也要懂得利用自己的資金，面向全球，這觀念的再教育，再啟迪，都有助於台灣資金的活絡、利用和獲利。


