  md: '# 每年10分鐘，讓你的薪水變活錢


    長的坡，美國的標普500就有這味道，你只要避開一夜致富的迷思，讓我們重溫一下：截至2014年8月底，你手邊的20萬美元投入標普500，過去十年會成長1倍，過去二十年成長了6倍，達到123萬美元，過去三十年成長了23倍，達到475萬美元，以上的成果，投資報酬並不需要很高，年複利分別為：過去十年的是7.25%，二十年的是9.55%，三十年的是10.81%，這個數字會讓許多人訝異，致富的年複利根本不需要20%，長期連15%的年複利都是高難度的。


    追求合理投資報酬的人，比較不容易受到傷害，因為高速的結果容易翻車，如果你的目標只是千萬富翁，那麼勤儉再加上合理的投資報酬，只要照著本書的方法做，那千萬富翁絕對不是問題。


    # 瞭解標普 500 和台灣0050 的缺點和限制


    談了那麼多指數基金的好處，難道沒缺點嗎？當然有，每種工具都有它的限制和不完美之處，就算老張和阿甘成功的投資法，可能有一半的人照做都會失敗，什麼原因？


    因高估了自己的風險承受力，也就是在某個階段無法承受股市的劇烈波動而出局，不相信看看金融風暴有多少'
