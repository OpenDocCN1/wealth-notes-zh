  md: '結語：登高後的再回首——見林也見樹


    # 為什麼整本書都不涉及個股的分析和操作


    因為這是一個專家都未必能駕馭好的工作，它有一定的難度，需要方法和經驗，而經驗的獲得通常是伴隨著昂貴的學費和時間的付出，一旦你走入那個方向，你有80%的機會是失敗的。


    所以不做個股的分析和操作，使用標普500或台灣0050這樣的指數基金，至少可以得到三項重大福利：


    一、節省時間成本，將管理個股的時間投入你的專業和生產，再將這份收入進行投資，有較高的產值和效益；


    二、避免昂貴學費，投資的經驗不可能憑空而來，通常要交學費，而偏偏投資不同於其他的競賽，下棋輸了明天重來，棋盤上的子兒一個都不少，投資完全不一樣，輸掉了一半，你要百分之百的成長才能打平，這當中沒有人平白給你錢財和資源，一失足，有時未必還有資源再讓你站起來，這殘酷的事實，許多人還不理解就已投入，不使用個股，上面的兩大陷阱就可以避免；


    三、大幅提高成功率，只要有十年以上的投資期，以上的兩項指數型基金，都是掉下去還會彈回來，立於不敗之地，也大幅提高了成功的機會。


