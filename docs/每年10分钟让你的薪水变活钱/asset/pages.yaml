    3. 都知道有所節制，所以在接近高點時，不管是用景氣對策信號的分數（邱小姐），或是燈號（我的方法），或是KD線圖的管制（施先生），都在高點之前懂得出場，避開了貪的陷阱。


    4. 不期望進場買在最低點，而是買在「相對」的低點，買完之後，都可以忍受短期的下跌，因我們三位對股市都有清楚的認知，不會驚慌，避開了怕的干擾，又因可在相對合理低點進場，所以是一個穩當的方式，對的方法又可以避開貪怕的干擾，這是一個一定可以獲利的模式，放諸四海而皆準。


    唯一美中不足的就是所謂結構性問題，1990年台股在最高點12,682時，美國道瓊大約2,700點，二十五年過去了，台股還未回到歷史高點，而道瓊已經跨過1萬8千點，這段期間台股美股相差了近5倍以上，簡單說，美國多數投資者是獲利的，台灣投資者多數是賠錢的，在一個大盤指數沒有成長的經濟環境下，你在股市賺來的錢，不全是整體經濟帶動所產生的獲利，而只是你比別人抓到了較好的進出點，也就是說你賺的錢可能是別人賠掉的，希望哪天台灣股市盡快脫離困境，也跟道瓊一樣發光發熱。'
