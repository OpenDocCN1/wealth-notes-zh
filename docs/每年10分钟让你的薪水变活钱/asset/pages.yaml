  md: '做法，所省下來的時間和精力的整體效益，不會低於找尋完美時間點的操作，畢竟股市再行，你不在場，也不行。


    二、小兵可以立大功，再小的資金都可以發揮功效；適用多數人，特別是剛進社會的年輕朋友，要好好利用，投資可以涓滴成河，許多投資者失敗，是大錢賺不到，小錢看不上，錯失了小錢持續累積成長的時間。


    # 第一桶金是非常重要的關鍵和轉折點


    人生免不了要面臨許多的轉折，這也通常是關鍵點，就理財而言，第一桶金的獲得是一個非常重要的關鍵和轉折點，有了第一個10萬美元，你可以建立分身的小雛形，就不再是單打獨鬥，越晚獲得，你後面越辛苦，越早搶下這個灘頭，你的理財路上就多了一個幫手，慢慢的會變成兩個幫手。


    接下來會發現，人其實就只有兩條腿，但是錢卻有四隻腳，年輕的族群要搶下這一桶金，只有兩個密碼，百年有效，千古顛撲不破，那就是勤與儉。


