    # 價格的合理是最主要的一個憑藉


    當世界變成地球村時，全球的資金此起彼落的找尋投資機會，且快速的移動，資金是被吸引進來，還是逃離，最後的關鍵都還在於是否有那個投資的價值，這部分有參考的指標來做判斷，但沒有絕對的數值，台股是否是在合理價格的進出點，景氣對策信號的指標和分數，有相對準確的參考意義，至於美股部分，通常我用四個面向來概算，標普的盈餘成長率、本益比、利率環境、國際局勢，但對想要更精準抓到高低點的人，對股市合理價值的評估要下較多的功夫，資產配置中會討論股市投資是否有G點，是這方面的心得分享。


    知識是力量，懂得運用就能創造財富，這些財富原本就是屬於你的，只是許多人沒有開發利用，希望這本書能夠解開你的一些盲點，進而採取行動，而且是用對的方法、對的工具，再進入對的灑瀟灑的草地，滾出你財富的雪球。


    然而均衡的人生財富，錢財只是其一，許多其他更重要的人生財富，在成長篇中，利用書信和你分享。理財投'
