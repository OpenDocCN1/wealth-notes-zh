    每個時代都有他們各自的優勢和挑戰，我們那時候接受美援，捐贈的麵粉吃完了，麵粉袋做成內褲，上教堂除了聽牧師講道之外，更關心是結束後的生活補助品，當年很追求物質，因為要照顧基本的生存。我們現在更講究心靈，你們一開始就在一個很講究心靈財富的時代，但未來的競爭不見得比我們輕鬆，我們是漸入佳境，以前要挑一百斤，現在才挑五十斤，你們可能剛好反過來，未來世界競爭力弱的，都會「新」如止水。


    既然環境這麼競爭，如果我是你，會用什麼方式快速的突破現狀呢？中國的老祖先早已告訴我們密碼，這個連老外都在偷學。


    著名的基金管理者，約翰·坦伯頓（John Templeton）提到他大學畢業十五年來，每年存下50%的收入，這還真讓我嚇了一跳，因為以一個外國人的消費習慣，很少有這麼高的儲蓄力，這個連老中都未必做得到，表示他有相當的紀律和自持能力，也難怪他可以成功。


    我的實務經驗也可以證明這點，不僅是我，在我客戶中可以快速達到財富自由的，其實都跟坦伯頓先生的做法非常接近，沒有傳奇，頂多是公開的密碼，為什麼說是公開呢？因為許多人都知道，但做不到。


