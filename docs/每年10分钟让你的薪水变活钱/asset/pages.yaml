    # 《信函 1》

    # 第一桶金來自何方


    興秀：


    比爾蓋茲曾說過，「如果你把我全身扒光了丟在沙漠裡，只要有一隊商旅經過，我就可以東山再起。」這說明什麼呢？他已掌握了成功的方法和竅門。


    台灣新聞報導，60%年收入4萬以上的人，還無法存到第一桶金（指100萬新台幣約3萬美元），這當中，許多人勤奮有為，但如果多年來還未擁有第一桶金，代表有思考上的盲點，和做法上的錯誤。


    今天就想跟你分享一些看法，告訴你幾個原則，雖未必都適用，因每個人的企圖心和想過的生活並不一樣，所以挑選你適合的，如果你的企圖心和方法都用對，挖到的不只是一桶金，一座金山都有了。


