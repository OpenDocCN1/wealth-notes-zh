  md: '# 結語：登高後的再回首——見林也見樹


    「黃藍燈」啟動買點，分10次進場的D案，績效最穩、最理想，金融海嘯期間，領先長抱不動的做法約30%（95%v.s.71%），1995–2007年，領先幅度更大，近1倍（294%v.s.136%），而且過去二十年，適合台股的各種形態，以總成績671%領先大盤180%，是大海中為你打撈的金鑰匙。等心得和熟悉時，景氣衰退的藍燈股底區域，可以改為「定時不定額」的方式，在底部加大資金投資的力度，並且在接近高點時，如再參考邱小姐28的警戒分數，兩者搭配，效果更佳，如虎添翼，是簡單、穩健且有良好績效可以證明的投資心法。


    # 台股美股混搭


    美國由於特殊的競爭體質，長期獲國際資金的青睞，但依然也逃離不了漲多拉回、跌深反彈的一個發展趨勢，美股價格偏高時，美國國內資金必然在國際上尋求新的投資機會，標普500和國際基金，也常有此起彼伏、各領風騷時，所以台股美股的混搭，也可以做某種程度的互補，任何一方價格偏高時，另外一方都可以做相對安全的資金停泊，加上台股還有一個高收益指數基金的0056，從過去三、四十年的紀錄來看，美股的表現確實優於台股，未來是否還保有相同的成長力度，就美國的體質來說，是有'
