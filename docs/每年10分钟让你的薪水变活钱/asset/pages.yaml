    姐脫離谷底不遠時進場，這兩者方式都相對簡單、安全、績效也不差，由於每次股市下跌和反轉方式及力道都不同，兩者成績在某個階段就互有領先，我的做法因個人的經驗和對股市的理解有較大的空間，如果再以我的做法使用「定時不定額」，對有經驗的投資者，就像有些人會吃魚頭，吃到乾淨的程度會讓你訝異，但不會吃的人，會吃到滿嘴都是刺。而邱小姐的方法適用於多數的投資者，因為規則相對簡單、清楚。


    我這樣的操作方式在經驗的判讀上有很大的發揮空間，用得好的，成績比邱小姐來得好，用得不順手，把握不住要領的，成績就會輸給邱小姐，細節請見表3-12。'
