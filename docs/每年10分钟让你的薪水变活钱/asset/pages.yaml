  md: '以一次股災做為測試，基礎點是不夠的，這四種方式，我把時間拉長到了同邱小姐 1995 年一樣開始的時間，這接近二十年的檢驗證期，涵蓋了台股各種不同形態的績效表現，這裡面包含了各種奇奇怪怪的股市發展走勢，例如有急漲急跌、緩漲急跌、不漲不跌，這如同戰爭的形態，有叢林式的戰爭，沙漠、海洋、高山，當一個操作模式都能適用各種狀況時，我才能比較敢輕聲的說，這是值得推薦給你的操作模式。


    當時間的測試起點和邱小姐一致時，見表 3-14，就可以很清楚看出，從 1995 年開始，我這四種使用燈號的投資策略，以黃藍燈啟動 10 次進場得到最好的績效是
    300%，接近邱小姐 301% 的績效（因為 0050 在 2003 年以前尚未問世，所以股利率的部分以邱小姐的股利水準做類似的推算）。


