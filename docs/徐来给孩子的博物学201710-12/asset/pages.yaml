    李森科的理论是错的，用的他名字来标榜的“穿秋裤会让我们退化”的观点自然也是错的。实际上，不只是中国，很多国家的人都穿秋裤。当然，在一些发达国家的，比如，有些人就不太喜欢秋裤，但是没有原因，他们的需求不是少量，但想要跟大家讨论一下，这是为什么呢？'
