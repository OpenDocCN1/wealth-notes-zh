  md: "# **问答+颁奖 | 双黄蛋能不能生出两只小鸡?**\n\n问答+颁奖 | 双黄蛋能不能...\n\n徐来  \n你好，我是徐来，非常感谢你学习我的专栏，跟许多爱来课面的朋友，一起学习博物学，也是一件非常有趣的事嘛。\n\
    \n前两天，我接受了一个采访，节目在《新闻周刊》节目里的一个采访，电视台在江苏南通海里的一个大型别墅。别墅的别墅，就别墅在别墅的大别墅，我几乎不可能被数，要数它们就真的太慢了。有些人觉得，是人类有必要去爱它们，是它们自己不小心弄坏的。就这么让它自然，自生自灭好了。\n\
    \n其实是不这样的，就之前也出现过类似裂、迷言，最后传播这样的事，在相当多的时候，是和人类的行为有关的，在这个问题上，我们是有责任的，当然是有政府部门的义务。但是，如果确实从人为对它们的影响，以及帮助它们——这是需要更多相关的专业知识了。\n\
    \n从小了解博物学，更好地理解我们和动物、植物以及其他万物的关系，才有可能在未来真正地帮助它们，也帮助我们人类自己。你说是不是呢？\n\n好，今天同样是回答你知问答题，先来看看今天的五个问题吧。\n\
    \n猫头鹰的脖子为什么能360度转?\n\n![](img/006dd6eb3352591458031b454d04d0b1_81_0.png)\n\n徐来\
    \  \n这个问题本身，有一点问题。因为猫头鹰的脖子其实并不能转360度。它们的脖子，在所有方向上，无论是水平还是垂直方向，最多只能转270度，虽然不到360那么多，但是已经比其他动物强太多了。咱们人类，差不多也就是90度，对吧。不信你自己在转转看。\n\
    \n大家都知道，猫头鹰比较擅长在夜里活动。白天的夜晚不像是在城市里，有灯光，但自然界的夜晚却几乎一片漆黑的，所以猫头鹰的听觉和视觉都非常灵敏感，能在漆黑的夜里找到食物。所以，猫头鹰的眼睛非常大，我不知道你们注意到没有，猫头鹰的双眼和鸟类在头顶太不一样了。其他鸟类的眼睛是长在头的两边的，一边儿一个。猫头鹰的眼睛是在同一面中间的一个，就像人和猿类一样，猫头鹰因此有个别名叫做脸。这是为了让猫头鹰有好的立体视觉，能盯紧老鼠。\n\
    \n但因为没有两个特点，猫头鹰的眼睛无法自由转动，导致它们的视野只能是朝向头的前方正。在这种情形下，如果能转脑袋，那么就能在身体不动的前提下看到更大范围内的东西了，这对它来说是很有好处的。所以，这样的特征在猫头鹰的进化中逐渐保留了下来。\n\
    \n我每天坚持写这个专栏，我想问：为什么人的眼睛不能像鹰的眼睛那么厉害呢?\n\n![](img/006dd6eb3352591458031b454d04d0b1_81_1.png)\n\
    \n徐来  \n这个问题的直接原因非常简单，眼睛之所以能看到东西，是因为我们的视网膜里有感光细胞。它们能感受到光线，然后产生电信号再传给大脑。大脑把这些信号整合起来，就形成了视觉。鹰眼里感光细胞的密度比人眼的大。换句话说，如果大小一样，那么鹰眼里的感光细胞比人的多。那自然能看到更清楚吧。\n\
    \n那么，鹰为什么视力好得更好呢？因为它们需要在高空下来搜寻食物。如果视力不够好的话，自然会饿死，或者没办法留下自己的孩子，久而久之，鹰类的视力也就越来越强好吧。\n\
    \n双黄蛋能不能生出两只小鸡?\n\n![](img/006dd6eb3352591458031b454d04d0b1_81_2.png)\n\n徐来  \n\
    这个问题很有意思。实际上，一开始我也不知道这个问题的答案，所以我费去查了一下资料，发现真的有科学家研究过双黄蛋。\n\n那早在1966年的时候，美国一所大学做过双黄蛋的研究。他们取了1400多个双黄蛋，其中有607个是受精的，也就是说是里面有胚胎，而可能有人养的小鸡蛋的，这607个受精的鸡蛋，有些有1个胚胎，有些有两个，然而，科学家就去孵化了，其中一个个胚胎的双黄蛋，说出了158只鸡，而444个双黄孵化了，孵化出88只小鸡，孵化成功率是27%。\n\
    \n不知道这算不算回答了你的问题。\n\n人的指纹是什么决定的，为什么指纹会不一样?\n\n![](img/006dd6eb3352591458031b454d04d0b1_81_3.png)\n\
    \n徐来  \n这个问题，说容易也容易，说难也是真的很难回答。\n\n先容易的部分，人的指纹是什么决定的？是基因和发育共同决定的。为什么会不一样呢？因为人的发育的过程中会发生变化，你的指纹一般到14岁才会定型。\n\
    \n说到说难的部分，指纹是基因和发育共同决定的，那么我们如何研究呢？这就很难说清楚了，因为我们指纹不一样不是两个基因决定的，而是有一系列基因参与了这个工作。但我们只知道哪些基因和指纹有关，但是具体负责什么，和谁谁谁井开了。还，有没有其他基因参与呢？我们也不知道了。\n\
    \n接下来说就说不清楚了，发育是怎么影响指纹的。我们太长了，我们知道胎儿在妈妈肚子里成长到三到四个月的时候，指纹已经形成了，然后在长大的过程中，会略微变化，直到14岁左右会定型。\n\
    \n因为这说明来一个，所以说导致了一个问题，那些其实我们并不确定，是否真的只有两个人的指纹完全不一样，没有发现过。到目前为止，还没有明确的记录，某两个人的指纹是完全一样的。\n\
    \n榴莲为什么那么臭呢?\n\n![](img/006dd6eb3352591458031b454d04d0b1_81_4.png)\n\n徐来  \n榴莲我很喜欢的，不知道你喜欢不喜欢。我发现有些人不喜欢榴莲，因为它的味道太臭了。榴莲为什么这么臭，这个问题可以拆解为两个，什么东西导致了榴莲的臭味，以及它跟与榴莲有什么关系？\n\
    \n榴莲的臭味来自内部产生的一些挥发性物质。是一种物质，就是很多东西，你觉察的部分，一般是都是化合物。\n\n那么这么臭有什么好处呢？果实的味道和花朵的气味，很多都和动物有关系，比如会有香味或者臭味，目的是吸引动物过来分作传粉，果实也是这样，特别的味道会引来一些传播动物注意的，吸引它们可以吃掉，然后种子才到你的地方去。\n\
    \n榴莲的臭味当然也是起到这样的作用。"
