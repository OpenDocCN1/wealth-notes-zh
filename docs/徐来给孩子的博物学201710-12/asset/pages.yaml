    宇宙·环绕 | 失重就是没有重力吗？


    +   1. 引力和两个指标有关：距离和质量。如果一颗恒星的质量足够大，那么由此产生的引力会让恒星坍缩成为黑洞。科学家发现，形成黑洞的质量下限是3.8倍太阳质量；


    +   2. 目前已知最早描述黑洞的是英国科学家约翰·米歇尔，伟大的法国天文学家拉普拉斯随后也对此进行过计算。不过，真正让大家认识到黑洞的存在，还需要在爱因斯坦确立广义相对论之后；


    +   3. 我们无法看到黑洞，更无法知道黑洞里面到底发生了什么。只能通过数学计算，做出一些猜想和推断。


    > 黑洞（black hole）：根据广义相对论所推论，在宇宙中存在的一种质量相当大的天体和星体。黑洞是由质量足够大的恒星在核聚变反应的燃料耗尽后，发生引力坍缩而形成的。


