  md: '# **问答 | 宇航员在太空上怎么洗澡？**


    问答 | 宇航员在太空上怎么...


    徐来


    你好，我是徐来。又到了每周帮大家互动问答的时间了，这周有大家又有17条学习微博呢？现在已经进入到了2017的最后一个月了，这一年就要结束了。希望能带着满满的科学知识，准备迎接新一年。


    好的，来看看我们今天学会做些什么吧。今天同样回答 5 个问题，最后是获奖时间。


    宇宙大爆炸之前，宇宙是什么样子的？


    ![](img/006dd6eb3352591458031b454d04d0b1_93_0.png)


    徐来


    简单回答你的问题，就是：人类还不知道答案！


    但是这背后有很多种理论：


    比如，从其中一个角度来看，这个问题没有意义，因为大爆炸可能是最开端，没有再之前了。目前有一个理论是，时间跟空间一样，诞生于宇宙大爆炸。换句话说，时间有一个起点，这个起点就是大爆炸那一刻。在起点之前才有意义。既然大爆炸是时间的起点，那“之前”自然也就没有意义了。


    是不是觉得不好理解？那换一个方式来思考。在地球上，有东西南北4个方向，如果你朝着正北方向一直前行，最终你会抵达北极。北极就是最北边，再没有比这里更北的地方了。站在这里，所有方向全都是南方。好了，现在问问，北极的北边是什么地方，你怎么回答？很显然，这个问题没有意义。


    但是，这只是其中一个理论哟；还有别个理论。比如有的理论认为，大爆炸之前的宇宙是一个反向大挤压的过程，还有多的模型十分复杂，我没办法在这里一一解释。


    总之，这个问题的最终答案还没有被揭晓，这也是我们努力学习科学和知识的动力。


    我替我们家小朋友问：宇航员在太空上怎么洗澡？


    ![](img/006dd6eb3352591458031b454d04d0b1_93_1.png)


    徐来


    最早的时候，宇航员在太空中都是不洗澡的。因为没有没有水源，水都要从地面上去，技术成本太高。所以一般宇航员身体脏了，要么忍着，要么只能用湿毛巾擦一擦。


    后来美国 NASA 在早期太空站里尝试建造了淋浴器，洗澡后的水可以回收再利用，但是发现这样很麻烦。因为太空中水不会往下坠，喷在身上的水都会像小水珠一样挂在身上，喷到空中就会到处飞溅，洗澡也不是很方便。


    所以现在宇航员又回到了老办法：用毛巾蘸水加上洗涤剂把身体擦洗干，然后再用毛巾擦干。用过的水还是尽量回收利用。这样做既方便又节水，水珠也不会乱飞，这样以来，国际空间站的宇航员每天都以这样洗澡。


    兔子在被狼追击时候的逃跑方式和路线是怎样的，有没有什么固定的套路？


    ![](img/006dd6eb3352591458031b454d04d0b1_93_2.png)


    徐来


    食草动物作为食肉动物的捕猎目标，它们逃跑的路线并没有太多规律可言，毕竟不同的地方，环境不一样，条件也不一样，它们不可能按照某一条固定路线逃跑，要么整体，要么在逃跑的时候还是有一些固定套路。


    比如说，它们在逃跑的时候，总会不停地改变方向，经常拐弯。


    因为，食草动物都没有它们的犬敌快，总是比敌人慢上一截，所以如果能捕猎者不断加速，那有可能就追不上。但捕猎者很难加，拐弯弯度是很大的。


    所以，拐弯跑对食草动物有利。


    再比如，食草动物会尽量跑群，提高概率。


    因为当一群动物在狼食食面前时，捕食者有可能无法确认到底该抓哪一个，然后因为犹豫而丢失目标。


    我觉得，人类最原始还迁徙，这狩猎采摘的生活。后来发展出了农业，人类开始定居下来，但是农业定居生活让类的器官变得单一化，而且容易让某些病毒和元素容易传播，这样看来是一种倒退，那人类为什么要这样倒退呢？'
