    # 博物学家养成记


    这就是我们人类演化的历史。当然，古人类学家已知的人类历程要远比这个复杂得多。比如，最初人们认为南方古猿是最早的人科成员。但一些新的发现显示，人类的历史还可以往前推很多，现在，他们认为一个叫做地猿的类群是比南方古猿更早的人族成员。


    听到这么多属和种的分类，你是不是有点晕呢？试试看，找张纸，找支笔，画一下人类的各个古代远亲的关系图吧。你还可以把自己画的图分享在学习小组里。学习小组的入口就在咱们专栏文稿的底部。


    遗传学 人类 | 地球上的人多少年前是一家？

    演化学 人类 | 人类为什么不是毛茸茸的？

    医学 人类 | 如何获得永生？


    +   1. 人是从猿演化而来的，但是今天你在动物园里看到的黑猩猩、大猩猩、红毛猩猩，不是我们的祖先，而是我们祖先的兄弟；


    +   2. 最早出现的人族物种是地猿和南方古猿，其中南方古猿“露西”是最有名的古人类。傍人是另一支古人类，他们是素食者，并且很早就灭绝了；


    +   3. 真正的人类也就是人属物种当中，已知最早出现的是能人。但他们可能和我们并没有关系。匠人演化成了直立人，并演化成了智人，最终扩散到了全世界。


    人类演化：人类也指人属，人类演化的研究往往包括其他人科动物，如南方古猿，人属是在大约230万至240万年前的非洲，从南方猿人属分支出来的。


