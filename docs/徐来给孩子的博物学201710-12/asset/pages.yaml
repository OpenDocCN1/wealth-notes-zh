  md: '会被海水给淹掉。如果倒在上面的水真的足够多的话，多出来的光和热，足以毁灭地球上的所有生命。


    +   1.  **终末速度：**包括雨滴在内，所有的东西在从高空落下的时候，都会受到重力和空气阻力的双重影响。如果掉落的位置足够高，那么它将因此达到一个恒定的速度，被称为“终末速度”；


    +   2.  **逃逸速度：**如果不考虑空气阻力的话，那么水滴掉落到地面上时所能达到的最快速度是一定的，大概是每秒钟11公里。这也是地球的逃逸速度，要想飞离地球，我们必须达到这个速度；


    +   3.  太阳无时无刻不在进行核聚变，并为地球提供光和热。如果向太阳滴许多水，那么太阳质量增加之后，会提高核聚变的速度，释放更多的光和热。


    终末速度：所有的东西从高空落下的时候，都会受到重力和空气阻力的双重影响。如果掉落的位置足够高，它将因此达到一个恒定的速度。


