  md: '+   1. 蓝鳍金枪鱼不是一种鱼类，而是三种，它们分别是北方蓝鳍金枪鱼、南方蓝鳍金枪鱼和太平洋蓝鳍金枪鱼。这三种蓝鳍金枪鱼目前都属于濒危动物，其中南方蓝鳍金枪鱼属于极度濒危的级别；

    2. 蓝鳍金枪鱼可以长到很大，太平洋蓝鳍金枪鱼可以长到3米长。目前公认的蓝鳍金枪鱼确切的体长记录是3.7米。这种鱼身体呈流线型，尾柄细而有力，速度非常快，是温血动物；

    3. 在上世纪70年代之前，金枪鱼并非优质食用鱼，因为富含脂肪，所以它们很容易变质，只能当饲料或者做成罐头。后来日本人发现它非常适合生吃，对金枪鱼的需求随之增加。现在也有人尝试通过人工养殖的方式解决对野生种群的依赖，但因为它们的习性特殊，难度很大。


    蓝鳍金枪鱼：温血动物，已被IUCN列为极危保护动物，堪称“水中的大熊猫”。分布于全球各大洋热带至温带海域，体长可达245公分。


    ![](img/006dd6eb3352591458031b454d04d0b1_110_0.png)


    今天，是博物学陪伴你的第 246 天，恭喜你，又收集了一个新知识！下一期我们继续研究。'
