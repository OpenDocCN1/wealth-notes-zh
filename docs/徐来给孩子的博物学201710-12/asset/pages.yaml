  md: '# 气候：地球|为什么说氧气有“毒”？


    世界好大，奇妙的事情每天都有，我们一起来发现吧！


    也许你已经发现了，这么个专烂的标题，就是跟大家原本的逻辑反着来。今天的你可能会想：“氧气是地球生命的基石，没氧气，就没有我们啊。”


    # 氧气到底有多重要？


    你是不是觉得我越说越玄乎了，氧气就氧气嘛，怎么还能毒死大？


    也不光是我们人类，实际上地球上大部分生命，一旦离开了氧气，很快就会死掉—动物是这样，植物也是这样。


    ![](img/006dd6eb3352591458031b454d04d0b1_77_0.png)


    # 什么样的生物不需要氧气？


    不知道你有没有注意到我刚才那句白话，我说的，“地球上大部分生命，一旦离开了氧气，很快就会死掉”——“大部分”，所以，也会有些少说，生命氧气也能活下来。


    ![](img/006dd6eb3352591458031b454d04d0b1_77_1.png)


    ![](img/006dd6eb3352591458031b454d04d0b1_77_2.png)


    # 氧气怎么导致了生物灭绝？'
