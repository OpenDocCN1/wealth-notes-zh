  md: '# 医学人类 | 打开了心脏，人还能活着吗？


    世界好大，奇妙的事情每天都在发生，我们一起去发现吧！


    今天先跟我做一个动作，把手放在胸口偏左一点的地方，安静下来，你能感受到咚直咚的声响，在停滞住跳动，那就是心脏。大多数古代文明都把心脏看做是人体脏器当中最重要的一个。随着科学的发展，人类对自己身体的了解越来越多，生理学家和医学家们发现，心脏对于人们来说，确实意义重大——它把血液送到我们身体每个地方，把氧气和能量带到各处，又把代谢产生的副产品收集起来。


    所以，如果一个人的心脏出了什么问题，那可就有 点糟糕了。有些人出生 时，心脏就不太好，这会让他们 患有很多疾病——我小时候有个同学，就有这种困扰，他不能剧烈运动，身体也一
    直不太好。


    你能想象吗，心脏要是出了 问题，就不能治好？


    很多人都想过要把心脏的毛病治好。有些药相对来说容易，即医生开起来不冒风险，也可以控制。还有些病，治起来就难多了，比如我们提到的先天性心脏病，它是常见于在胚胎时期，心脏的发育出了些问题，没有长好。由此带来的问题，一般没办法吃药来治，可能需要动手术。


    ![](img/006dd6eb3352591458031b454d04d0b1_129_0.png)


    # 在伤口上缝合伤口


    心脏那么重要的一个器官，真的用手刀 切开再修复修补了，真的好装回去，医 生是风险很大。对于这个问题，奥地利医生 比哈尔罗特有一个很重要的观点：谁想在心 脏上动手，他一定会死得很难看。这不是个
    比哈尔罗特可是个很厉害 的医生，号称“外科 之父”。连这么伟大的医生都这么说了，其他医生也都 不敢轻易举刀了。


    问题是，医生不主动给人做心脏手术，可病人会往医生那边 敲。就在“外科之父”比哈尔罗特去世之后没 多久，在德国 有个叫雷霆的产科医生就碰到了这么一桩 事。那是1896年9月的一天，雷
    霆在 医院里洗个手，突然有警察闯进了医院，他们送来一个小伙子。这个小伙子 头脸受伤，浑身湿着血，吸气都上不来了，他的 心上被刺伤了。


    这个情况是非常危急，可是按比哈尔罗 特这么说，非要救这个小伙子，那雷 霆下场就是自身收个裂了。不过，到了这个 时候，雷霆也顾不了那么多了，医生嘛，救 死扶伤是天职。不行不行，反正先试试，试试看。他决定切开这个小伙子的心脏，给他做个手术。有手心里没，他发现这个小伙子的心脏上有一个
    1.5厘米的切口，差不多就是 比哈尔罗特指的第一个伤口小一点， 像 伤口就缝合嘛，缝缝第三针的时候，这个小 伙子的情况就稳定下来了。


    “外科之父”的观点被修正了：心脏是可以 接手手术。然而，缝合伤口手术是很高级 的工作，真的要做好心脏手术，接下来走 有很长的路要走。


    ![](img/006dd6eb3352591458031b454d04d0b1_129_1.png)


    # 拯救蓝血小孩


    下一个突破是针对先天性心脏病的。美国 女医生塔迪格是一家大医院小儿心脏病专业的 开创者，在她的工作当中，见过太多受 先天性疾病影响的孩子，其中很多 孩于都死于先天性心脏病。她一直都想希望找到方法，治疗这类患
    的孩子。


    不过，先天性心脏病种类多，原因各异。 其中有一种，是心脏没有发育 好，导致部分供血不足，有这种供病的孩子，嘴唇是青紫色的。塔迪格 觉得，这 一类病症是比较容易治疗的：既然肺供血
    不足导致了问题，那就让血液恢复就正常 不不就好了。最简单的手术方案就是：在 心脏上开个小口子，然后 从这个孔子接一根 血 管出来，连在肺部的动脉上，把血液
    给切。


    不过，说是最简单的方法，但是执行起来 真是难得不敢想象。她找到一个医生，希 望合作这位手术：这位医生能够把血管给 上，连上 起来，能够上血管，也就说 能够新打开血管。但塔迪格的提议被拒绝了，这位医生
    没有信心做这个手术。1944年，一个 叫东莱洛克的医生重新和她合作。


    手术的对象是一个只有15个月大的孩子。 为了保证手术成功，布莱洛克到处 准备开 刀手术，准备三次失败的手术 力而准备。然后 ，病人的情况变化得很快，布莱洛克只手
    试了一次，但是孩子手术了。手术难度 非常大，但 是成功孩子了。那是1944年 的11月29日，在场的所有人都看到，这 孩 子的脸色由蓝紫渐渐 变为 红润。所有人都在欢呼，人类
    正式迈入了心脏手术的时代。


    当然，还是有很多问题没有解决。


    # 血液循环不能停


    比如说，在做其他手术的时候，为了避 免失血过多，以及让医生看清楚 需要被操 作的部位，通常要先扎止血带，把该 手术的地方一这个 方法 术来说叫“ 手术野”，
    在手术 视野当中是不见血的。


    但心脏不行。这是让血液循环的器官， 如果 让它在手术的时候，把 里面的 血都放 干净 了， 连全身的血 也不 会停下来 了， 人 肯定 活 不下来了。那有什么办法
    能让手 术进行呢？


    有一个来自加拿大的医生叫比西格，他突 发奇想，有了 一个 意思：加拿大大 地 北 方， 一直 很冷 ，要不 能 把 人的体温 降 来 来 吧？比西格的这个
    思 想法 的，降低体 温 这 是 很 实际 意 ，因 为 体 温 低 ，能 的 体 的 转 运 速 度 就 下 降 ， 对 氧 气 ， 整 体 的 供 应
    ， 要 求 就 低 。 这 个 时 候 就 有 机 会 中 断 人 体 的 血 液 循 环 ， 当 然 ， 这 么 维 持 时 间 不 许 常 常 ， 可
    这 个 时 间 已 经 够 一 些 心 脏 术 来 使 用 了 。


    接下来，另外 些医 生 也 开 始 就 这 个 方向 研 究 ， 并 且 开 始 对 动 物 做 试 验 。 1952 年 9 月 ， 一 个 叫 古 利
    可 斯 的 医 生 让 这 个 方 法 为 一 个 5 岁 的 小 女 孩 做 了 心 脏 手 术 ， 手 术 非 常 成 功 。


    也 有 一 些 人 在 思 考 其 他 的 方 法 ， 其 中 一 个 人 很 特 别 ， 叫 林 德 格 伦 ， 他 写 了 一 篇 很 棒 的 论 文
    ， 记 录 了 一 个 想 法 ： 把 血 液 抽 到 机 器 里 ， 让 它 在 机 器 依 里 帮 下 工 。 林 德 格 伦 一 位 非 常 优 秀
    的 工 程 师 ， 也 是 世 界 上 最 有 名 的 “ 飞 行 员 之 一 ” ， 他 的 想 法 启 发 了 很 多 人 。


    一 位 叫 吉 本 的 医 生 开 始 把 这 些 想 法 付 诸 实 施 ， 他 设 造 了 血 液 流 在 身 体 外 循 环 的 机 器 ， 并 开
    始 进 行 动 物 实 验 。 一 开 始 事 并 不 顺 利 ， 由 于 动 物 分 析 的 代 价 ， 很 多 不 太 对 付 ， 他 不 断 改 进
    自 己 的 机 器 ， 最 终 大 就 多 的 动 物 活 了 多 。 到 1953 年 ， 他 终 于 迎 来 了 自 己 的 第 一 个 病 人 ， 尽
    管 手 术 的 过 程 并 不 顺 利 ， 但 最 终 还 是 获 得 了 成 功 。


    — 博物学家养成记 —'
