  md: '成的过程中被包裹进去的。而地球上大部分钻石都已经有超过20亿年的历史了。所以，如果能打开这些钻石，研究那些碎屑，我们或许可以知道20亿年前地球的状况——那可真是好久好久之前。


    实际上，有些科学家已经得到了一些小块的钻石，并且打开了它们。科学家因此得到了一些金属小碎屑，并且得到了一些来自早期地球的气体。科学家得出结论，这些钻石实际上诞生在液态金属当中，通过复原这样的环境，科学家正在尝试勾勒早期地球的样子。


    # ## 博物学家养成记


    没想到吧，钻石还有这样的作用。


    实际上，钻石并不一定只会出现在地下，它们也有可能出现在我们的头顶，在宇宙当中也可能存在几乎完全由钻石构成的星星。结合一下我们今天讲的内容，你来琢磨一下，形成这样的钻石星球，需要怎样的条件呢？欢迎在留言区分享你的想法。


    +   1. 世界上最大的钻石原石是库里南一号，它的重量超过3000克拉，一共切出来9颗大钻石和90多颗小钻石；

    2. 钻石和石墨都是碳构成的，只不过两者的结构不同，导致了巨大的外观差异；

    3. 钻石的生成需要巨大的压力，所以它们通常出产于很深层的地下，需要借助熔岩的挤压力量才有可能达到靠近地面的位置；

    4. 钻石当中有可能包裹一些碎屑，通过研究这些碎屑的特点，科学家正在复原早期地球的模样。


