  md: '是长在鱼的肌肉之间的小刺。鲫鱼、草鱼确实会有很多肌间刺，因为肌间刺是鲤形目的一个重要特点。不光是鲫鱼、草鱼，鲤鱼、鳊鱼、胖头鱼，都有肌间刺。也不是只有鲤形目有肌间刺，比如海水里的鲱形目，鲱鱼，也就是鲱鱼罐头的那个鲱鱼。鲱形目也有很多常见的鱼比如沙丁鱼、很名贵的鲥鱼等等，也有肌间刺。


