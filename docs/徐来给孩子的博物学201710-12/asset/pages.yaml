  md: '除了长着30厘米长的袋子，这种兰花还有更特别的一点：它还常常扮演骗子的角色，让虫子们白干活，空欢喜一场！


    # 兰花到底有多少种骗术？


    兰花的骗术非常简单。它们会让自己的花朵，开成一些特殊的形状，看起来很像 是其他的东西。然后，利用一些昆虫眼 神儿不太好的特点，让它们误闯进来，再 失望地离开。但它们离开的时候，身上已
    经沾满花粉，成了这些花的“花粉快递员” 了。


    大体来说，兰花的骗术可以分成三种：


    第一种叫巢穴欺骗。有些兰花，比如 一种叫西藏构兰的兰花，花瓣很宽厚，颜 色很深，花瓣包围起来的开口，乍一看起 来有点像某种蜜蜂的巢穴。它就在那儿等 着，有些蜜蜂在外面劳作了许久，准备
    回到蜂巢里休息。昏头昏脑地就把这个兰 花误当成自己的蜂巢了，一头扎进去。等 到发现走错路的时候，身上已经沾满花粉 了。


    第二种，叫做食源 性欺骗。有些兰花，开出来的花朵，跟其他 植物的花朵非常相似，而且总是挑和它们 一样的时间开花。人家那些花里面，装满了 花蜜，吸引蜜蜂过来采蜜传花蜜，顺便帮
    它们传粉，而这些兰花，啥都不准备，就 是空壳一个。但蜜蜂不知道啊，也会跑过 来采蜜，不但会扑个空，而且，还得被迫 做花粉快递员。


    食源 性欺骗里面还有一种情况，就是兰花干脆 把自己的花朵伪装成某些昆虫的 食物了。比如说一些苍蝇或者 甲虫。它们 可不是吃花蜜的，而是吃死 鱼 烂虾，腐烂
    的水果之类的东西。所以，这些 兰花干脆开 成这些食物的样子，甚至释 放出 类似的 腥臭味来，让虫子们以为 这里有食 物，兴冲冲跑来看个究竟。


    第三种，叫性欺 骗。有些兰花干脆 把花朵开成了某些雌 性昆虫的样子，吸引那些雄性 过来。然后还真有好多傻乎乎 的雄性虫子就扑过来找女朋友， 于 是一个一个做了兰花的花
    粉快递员。


    # 博物学家养成记


    虽然兰花这样欺骗 别的昆虫，有点不好，不过这也是兰花自己的 生存之道，也是自然演化的奇妙之处。你 身边有种过兰花的长辈 或者朋友吗？如果有 的话，向他们请教一下种植兰花的方法，
    以及请他们描述一下兰花开花的 样子吧。


    如果家里的空间允许，也可以 买一两盆兰花，自己养着玩，但 那样的话，你必须更加勤奋，要去 学习更多跟兰花有关 的知识，多观察，当然 了，你付出了 辛苦，兰花也会给你带来很多意
    想不到的惊喜。


    +   1. 兰花 对中国人来说，具有一种特别的文化含义。不过最早中国 古人说兰花，说的是 佩兰。它和著名的 君子兰都不是真正的兰花；


    +   2. 真 正的兰花属于兰科的兰属，有五种兰花，在中国被普遍栽培，并被统 称为“国兰”；


    +   3. 兰花 和帮它授粉的昆虫们成了非常紧密的共 生关系，有些兰花可以 为昆虫提供花蜜，有些兰花则 会利用巢穴欺骗、食源欺骗和性欺 骗的方式诱骗昆虫。


