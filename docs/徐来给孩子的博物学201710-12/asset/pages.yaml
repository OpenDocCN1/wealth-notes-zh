  md: '# 问答 | 为什么打呵欠会传染？


    > > 徐来


    你好，我是徐来。假期过得好吗？前两天我给了在专栏里尾放了 一个关于如何逛博物馆的清单，有没有趁着假期去博物馆、展览馆之类的地方看看，学习一点新的博物学知识呢？当我们去博物馆亲眼着一些展品的时候，确实能感受到很多看照片或者听别人描述时无法呈现的体验。


    比如说，荷兰的阿姆斯特丹的国立博物馆，最重要的藏品就是伦勃朗的不朽名作《夜巡》，它被放在博物馆的中心位置，非常大的画幅。当我真的由远及近，一点点走到它前面的时候，都能看得格外细致，靠一跳到无。无论是左下角的「男孩，还是右下角阴阳形中狗，都变得格外清晰，甚至能看到长衣衣上象征城市的玫瑰花，真的得值亲眼去看一看。


    今天周末，我没有办法带大家去看《夜巡》，但是，可以在这里回答大家 5 个问题。


    ![](img/006dd6eb3352591458031b454d04d0b1_12_0.png)


    人为什么一听到摩擦的声音就会发抖？


    ![](img/006dd6eb3352591458031b454d04d0b1_12_1.png)


    > > 徐来


    擎柱大哥你好。没想到，变形金刚也会对人类的行为产生疑问。

    你问的这个现象确实存在，类似的声音有很多，比如，用指甲划玻璃，粉笔在黑板上滑来滑去，用叉子划铁或者泡沫塑料等，甚至刚刚我听到一些音乐时我这种描述，就让你觉得很难受了。


    但为什么会有这个现象，科学家也不太清楚。有些科学家确实进行了一些研究，他们发现，这样的声音都集中在一些特定的频段当中，如果正在听的歌曲中加入这些频段的声音，也会让一些人产生反感。

    研究认为，人类耳道中的不同形状可能是造成这一切的原因，耳道会放大某些特定的频段，造成令人痛苦的感觉。


    巨石阵是做什么用的？


    ![](img/006dd6eb3352591458031b454d04d0b1_12_2.png)


    > > 徐来


    这个问题可真是的把我给难住了。因为答案是：不知道。

    不过我知道，到目前为止，没有人确切知道巨石阵到底是用来看什么的——有一点点可以肯定的，它肯定是用来某种变换形的，嘿嘿。

    关于巨石阵，我们知道的确确实事实并不多，比如说，它到底是什么时候建造的——历史上第一次记录巨石阵是在 12 世纪的时候，所以很多研究者认为，它远早于看到的巨石阵不会太古老，否则不可能没有人记录。而且还有一点是可肯定的：这个地方很早就有一些大土块和土台，然后人们陆续在这些地方上加台。'
