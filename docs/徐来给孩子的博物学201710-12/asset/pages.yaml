    # 博物学家养成记


    怎么样，鸮鹦鹉其实是一种非常可爱，非常有意思的动物吧。不过很可惜，它们现在都被集中在远离人群的小岛上，被严密保护着，轻易不让人靠近。所以我们最终没能拍摄到。不然，我就可以带着它们的影像来给你讲这段故事啦。


