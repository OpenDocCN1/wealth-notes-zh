  md: '另外，新世界猴子大都生活在热带雨林地区。这个地区，树都很高大，而且在树身上有很多蔓藤什么的，叶子都很大，可以说是遮天蔽日。所以，在热带雨林地区，森林的内部光照是非常差的，是一个暗光环境。所以，它们的生活环境，有很多时候更像是晚上而不是白天。


