  md: '# 生态学·植物 | 土豆是怎么把人饿死的？


    世界你好，神奇的事情每天都有的，我们一起去发现吧！


    爱慕薯 这 个“薯”却很便宜 说 的 是，这个薯就是土豆（Potato）， 大 家 都 很 喜 欢 它。以 前，对 大 多 数 中 国 人 来 说，土 豆
    都是种 薯 茎 的，大 盘 鸡、刀 豆 炒 土 豆 这 都 是 常 吃 的。但 是，咱 国 家 人，又 在 搞 主 豆 根 化，也 就 是 想 让 土 豆
    成 为 水 稻、小 麦、玉 米 之 后 的 第 四 大 主 粮，也 就 是 把 它 当 成 米 饭 或 馒 头 来 吃。


    可是，你一定 会 问，菜 又 怎 么 能 变 成 主 粮 了呢？


    ![](img/006dd6eb3352591458031b454d04d0b1_14_0.png)


    # 什么是块茎？


    其实，在很多地方，土豆就是被当成粮食的，而且跟水稻、小麦、玉 米 这 样 的 谷 物 相 比，土 豆 有 很 大 的 不 同，你 们 一 眼 就 能 想 到，它
    们 拿 来 吃 的 部 分 就 到 了。水 稻 和小麦，吃的都是它们一颗一颗的种子，而土豆，吃的是一大坨圆 圆 的 东 西。这个 东 西 不 是 土 豆 的
    种 子，实 际 上 是 它 一 部 分 埋 在 泥 土 里 的 根 茎，它 发 生 了 变 化，变 得 很 大，储 存 了 很 多 养 分，发 成 了 这
    么 大 一 坨 可 以 吃 的 东 西。土 豆 这 个 秆 儿，也 就是 植 物 的 茎，变 成 了 块 状 的，所 以 植 物 学 家 管 这 个 部 分，叫
    做 块 茎。


    水稻和土豆，分别代表两种不同的生存策略。前者是把营养都留给后代，后者是都留给自己。


    水稻、小 麦、玉 米 这 些 植 物 就 是 都 留 给 后 代 的。这 些 植 物 长 得 好 好 的，环 境 也 不 坏，也只能活一年。一 年 之 后，就
    死 了。所以，对它们来说，就是得尽快的把繁殖后代都得到种子里面，留给你自己的东西，让全后代吃得饱饱的，方便它们去闯荡世界呀。


    这个 策 略 对 后 代 很 好，但 对 它 们 自 己 就 不太好。因为留给自己的东西很少，所以，水稻、小 麦、玉 米 这 样 的 植 物 抗 天 灾 的
    能力很弱，天旱了，或者发大水的时候，如果没有人照应，它们就很 容 易 全 部 死光。


    所以，很多植物就采取了第二种生存策略—— 尽量 多 留 给 自 己 要 用 的 营 养，多余 的，再 分 给 孙 子 孙 女。土 豆 就 是 这 种 比 例
    极 大 的。话 说 得 好，留 得 山 在，不 怕 没 柴 烧。只 要 土 豆 那 一 大 坨 块 茎 没 出 问 题，它 就 能 一 直 活 下 去。


    ![](img/006dd6eb3352591458031b454d04d0b1_14_1.png)


    # 不用种子就能繁殖下一代


    更 重 要 的 是，因 为 土 豆 的 块 茎 里 含 有 许 多 的 营 养 物 质，它 要 想 繁 殖，实 上 并 不 需 要 依 靠 开 花 结 种
    子，只 需 要 把 块 茎 上 生 出 新 芽 就 可 以 了。这 样 的 新 芽 可 以 长 成 一 棵 和 原 来 的 土 豆 生 体 一 样 的 新
    土 豆。


    这 种 繁 殖 方 式 对 土 豆 来 说 挺 好，但 是 对 人类，简直 就 是 造 成 了 点 点 麻 烦 的。因 为 要 想 这 样 繁 殖，土 豆
    在 它 的 块 茎 当 中，就 要 储存好一切需要利用的东西来，保证在任何不利的条件下，都能顺利地发芽成长。


