    # 博物学家养成记


    好了，我们今天说的是彗星。古时候中国人就照着天空上的样子，画了很多彗星的形象。我给你在文末放了一张，你可以临摹一下，并把你的作品发在咱们的学习小组里，我会选出优秀的作品，为大家展示出来。


