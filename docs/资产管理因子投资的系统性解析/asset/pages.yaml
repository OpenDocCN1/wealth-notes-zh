  md: '生根、发芽，带来收获。基金公司通过私募的形式成立多个基金，在考察期结束之后，将其向公众开放。孵化偏差是指基金发起人倾向于只把成功的基金向公众开放和销售的现象。开放的基金有选择偏差。Evans（2012）研究显示，孵化的基金业绩比未孵化的基金业绩高约10%①。当这些基金对公众开放，资金就会流入这些基金。但这些基金在孵化期的成功多半源于偶然。Evans发现在孵化期后，基金的超额收益消失了。在Evans的数据库中有几十支Janus孵化的基金，但Janus不是唯一实行孵化的公司。事实上有23%的新基金是来自孵化。


    一些基金公司从事着提高孵化期基金收益的可疑行为。基金公司可能将好的投资优先分配给孵化的基金。例如，首次公开募股（IPOs）一般在第一个交易日股价飙升，达到远高于发行价的水平。Van
    Kempen和Dreyfus都因向孵化基金不公平地分配首次公开募股而受到罚款处罚②。


    # 3.8 其他代理问题


    公司治理对于共同基金很重要。基金董事持有着大量所有权的基金业绩更好③。拥有较少、较独立的董事的共同基金费用更低。在公司治理最好的公司，收费与业绩一致。拥有独立董事会的基金费用上涨幅度较小，且费用削减的幅度更大。


    另一方面，共同基金的公司治理也有黑暗的一面③。基金董事和咨询公司优先雇佣彼此的人员，经常不是任人唯贤。以基金的股东利益为代价，共同基金家族在策略上倾向于能够增加公司利润的基金。


