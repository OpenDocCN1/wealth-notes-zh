  md: '更好地联系起来。


    # 4.1 合同


    对冲基金收取管理费，也称为费用率（expense ratio）。典型的管理费为2%，基于（无杠杆的）基金资产（或净资产值，net asset value/NAV）收取。


    对冲基金也收取业绩费，或称为激励费（incentive fee）。典型的业绩费为20%，基于基准之上的收益来计算。常见的基准一般是现金收益基准，例如LIBOR，标准500指数和某些通用的市场指数，或是例如零的常数。


    业绩费的计算比较复杂。如果一支对冲基金有高水位线，那么业绩费只在净资产值超过此前最高净资产值时收取。例如，假设一支对冲基金的净资产值如下：


    | 时间 | 1 | 2 | 3 | 4 |

    | :--- | :--- | :--- | :--- | :--- |

    | 净资产 | 100 | 120 | 110 | 145 |


    那么在时间点3上不需支付业绩费，因为净资产值在高水位线120以下。到时间点4，该对冲基金已挽回了损失，净资产值为145。时间点4，基金收取业绩费，高水位线此时变为145。如果基金设有业绩门槛（hurdle
    rate），例如4%，则仅在收益超过4%之后收取业绩费。如果既有高水位线又有业绩门槛，则只在两个条件都满足的情况下才收取业绩费。


    虽然费率的一般组合是管理费和业绩费分别为2和20（2/20），但也有一些变化：James Simons建立的文艺复兴技术公司（Renaissance Technologies）管理的大奖章基金是表现最好的对冲基金之一，或许是历史上最好的对冲基金。该基金收取的费率是5/44（该基金已关闭，投资者不能投资）。对冲基金的平均管理费和业绩费是1.4/16.0。规模较小的基金倾向于收取较低的管理费和较高的业绩费（规模较小的基金也往往有更好的表现¹）。


    最后，对冲基金有时也在投资者赎回时收取赎回费用（withdraw fees）。


    # 利益一致性


    业绩费是否带来更好的业绩呢？答案是肯定的。Ackermann，McEnally和Ravenscraft（1999）研究显示在其他条件相同的情况下，投资者从不收取业绩费的对冲基金转投收取20%业绩费的对冲基金，可使夏普比率增加0.15.
    Agarwal，Daniel和


    ¹: 参见Deuskar et al.（2011）.'
