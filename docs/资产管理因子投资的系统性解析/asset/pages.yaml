  md: 'Yaari最初的设定是有限制性的：他假设年金定价合理，没有费用或摩擦，个人不想储蓄任何财富传承给后代，而且没有不能投保的风险。将这些因素都纳入考虑后，会减少年金的吸引力，但年金仍会带来很大好处。Yogo（2011）将健康冲击、遗产动机以及其他因素考虑进来，发现如果家庭购买额外年金的话（即除了社会保险已经包含的之外），将获得超过家庭金融财富15%以上的收益<sup>①</sup>。


    有年金之后，你就不用担心年老之后没钱。个人活到储蓄耗尽的风险在稳步增加，因为人的寿命在逐渐延长。精算师协会（The Society of Actuaries）报道说，对于男性而言，每过十年平均寿命会提高2年左右，从1960年的66.6岁延长到2010年75.7岁；对于女性而言，每过十年平均寿命大概提高1.5年，从1960年的73.1岁延长到2010年的80.8岁<sup>②</sup>。“人们对“平均寿命”的含义有一种普遍误解，当他们得知自己可以活到80岁或85岁时，他们并没有意识到这意味着他们有50%的可能性可以活到超过这个年纪。”一位保险精算师说。很多人甚至不知道平均寿命到底是多少，约41%的人低估其预期寿命至少5年。长寿风险是很大的：到65岁时，处于平均健康水平的美国男性有40%的概率活到85岁以上，女性则有超过50%的概率。对于健康人士而言，男性的概率上升至50%，女性的概率则上升至62%。


    罗德岛养老金计划的受益人不会面临长寿风险，因为州政府替他们承担了该风险。不断延长的寿命大大提高了退休金的支付成本，这也是导致罗德岛养老金计划资金不足的原因之一。长寿风险在经济衰退时也相应增加——经济衰退时期人们往往活得更久——也许是因为失业和未充分就业的人有更多闲暇时间，锻炼更多，并在衰退时期花更多时间跟家人在一起<sup>③</sup>。养老金固定收益计划的出资方在衰退时期面临着双重打击：资产价值下跌，而负债随着更长寿命和更低利率而快速上升。


    尽管理论上看年金是很好的投资，但现实中它们并不是很流行，不到6%的家庭购买年金<sup>④</sup>。Modigliani（1986）将这种现象称为“年金之谜”。为什么人们不愿意购


    +   ① Davidoff, Brown and Diamond (2005)也证明即使有健康风险或者当可选的年金产品不能完全满足个人消费需求时，年金仍然有很大的好处。


    +   ② 引自McKeown, K. and E. Michalak, “Retires Underestimate Life Expectancy, Risk
    Underfunding Retirement”, 前精算师协会新闻稿，2012年7月30日。全文报告参见精算师协会的2011 Risks and Process
    of Retirement Survey.


    +   ③ Steven et al. (2012)还指出了另一个原因：在经济繁荣时期，那些低技能医疗保健工作人员（尤其是在疗养院或者门诊中心工作的）更容易找到其他工作；而在经济衰退期，这些人会回到他们在医疗保健领域的低技能工作，所以衰退期的护理水平有所上升。


    +   ④ 参见Inkmann, Lopes and Michaelides (2010)。那些购买年金的人所买的年金通常也不是最优的。很多人购买“定期”(period
    certain)年金，像债券一样在一定年限内每年支付固定金额的收益。这种年金不是我们在文中讨论的人寿年金。投资者还不如直接购买普通债券并同时购买可在债券到期后开始支付收益的递延年金。参见Scott,
    Watson and Hu (2011)。'
