  md: '很好地反映了Grossman-Stiglitz（1980）的近有效市场论，即投资者会很快利用这些异象。这样看来，规模就不应该是系统性因子，而且应该从Fama-French模型中移除。


    需要注意的是，小盘股平均来说比大盘股有更高的收益。其他因子的效应也在小盘股中表现更显著，如我们后面会讨论的价值和动量因子$^{①}$。而且小盘股的流动性通常不如大盘股。纯规模效应是指在调整CAPM模型的贝塔值以后，小盘股可能获取的超额收益。如今来看规模效应较弱，这意味着资产所有者不应该仅为追求更高的风险调整后收益而倾向于投资小盘股。投资者偏好小盘股的原因可能只是想在不能做空市场（以去除小盘股的市场敞口）的情况下追求更高投资回报，或者说投资者倾向于小盘股是因为他们想获取更高回报但又不能使用杠杆。然而，在没有限制条件、只追求投资回报的情况下，偏好小盘股的理由就不够令人信服。


    # 3.3  价值因子


    与规模因子不同，价值因子的溢价更加稳健。图7.5显示了价值策略$HML$的累计收益。价值因子在过去50年里创造了良好收益$^{②}$。从图7.5能看出价值策略在好几个时期有过较大的损失，有的时期长达几年：如20世纪90年代早期的经济衰退，20世纪90年代末互联网泡沫造就的牛市，以及2007~2008年金融危机时期价值策略损失惨重。价值策略的风险在于，尽管长期来看价值股表现优于成长股，但在某些时期价值股可能表现不佳。因此，从这个角度看价值策略是有风险的。


    从20世纪30年代开始，价值策略的好处就为人所知。Graham和Dodd于1934年出版了一本有名的著作《证券分析》（Security Analysis），为如何选取相对于基本面价值而言股价便宜的公司提供了指引。当今学术界和业界采用资产负债表上的各种变量或其转化形式，来作为基本面价值的代理变量。Graham和Dodd曾在哥伦比亚大学商学院任教（也是我任教的地方），这里有很强的价值投资传统，还成立了格雷厄姆&多德投资赫尔布伦中心（Heilbrunn
    Center for Graham & Dodd Investing）。对价值效应展开探讨的现代学术研究始于Basu（1977），最近几十年涌现了大量文献对价值溢价作出各种解释。这些解释与其他大多数金融文献一样，主要可划分为两大阵营：理性学派和行为学派。


    ①  关于规模一价值交互作用可参见 Longran（1997），关于规模一动量交互作用可参见 Chen，Hong and Stein（2007）。


    ②  有意思的是，一些作者包括 Ang and Chen（2007）的研究显示价值因子在20世纪上半期并不存在。'
