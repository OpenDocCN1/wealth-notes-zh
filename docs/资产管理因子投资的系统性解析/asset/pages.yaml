  md: '元。相对而言，Florence等人（2010）估算，美国（直接投资的）商业地产市场在2009年末的总值超过9万亿美元，尽管该市场已于2006至2010年之间损失了4万亿美元：


    如果REITs有很大的流动性优势，那么为什么投在REITs的资金量不到商业地产市场的1/10呢？为什么REITs并不那么受欢迎？


    从结构上来看，REITs与直接房地产投资是不同的。在1990年代早期以前，REIT行业规模很小，因为REITs按规定必须使用外部顾问来选择和执行投资策略。1986年，REITs被允许自由地选择和管理资产，随后在1990年代早期，很多REITs对这些职能进行了内部化重组¹。因此，1990年代以后被称为新REIT时代（New
    REIT Era）。


    但即使在今天，REITs的法律结构也与直接房地产投资差异很大。Graft（2001）有力地说明了REITs的法律监管要求产生了很大的代理成本²（参见本书第III部分，委托资产管理的代理问题）。收入审查（1986年有所放松）要求REIT收入的75%须来自房地产投资，这个要求使得REIT管理人相比于私募房地产合伙企业更有动力去收购价格被高估的资产。此外，REIT管理人通过管理费的形式可以获得持续的收入，而封闭式基金通常要在预定日期进行变现，开放式基金在收到投资者赎回要求时也会进行变现：5-50
    检验可以使REIT免于重复征税，该检验是指每组投资者（5个或更少）不能持有超过50%有投票权的股票，这意味着REITs不能被接管并解雇表现不佳的管理层。如表11.4所示，REITs的平均回报率高于NCREF回报率，这符合REITs比直接房地产投资风险高的特性，它们的高回报率是对高风险的补偿。


    即使不考虑代理问题，REITs的法律结构仍会导致其与直接房地产投资的差异。REITs每年要支付90%的收入，意味着REITs管理人倾向于投资已经产生稳定现金流的项目，而不是投资于现在需要现金、未来才产生现金流的在建项目。另一方面，最近REITs在很多新板块上都有很多创新，例如医院、数据中心、存储设施。但是由于这些新板块的规模较小——与办公地产市场相比，自助存储中心和服务器农场占比很小——NCREF仍然聚焦于包括公寓、零售、办公和工业在内的传统“核心”板块。


    然而总的来说，我相信代理问题和法律结构的差异都是次要的。尤其是在长期看来，REITs和直接房地产投资之间有更多的相似性。这与经济理论的预期一致，因为两者都是基于建筑物和土地，这也有实证研究支持。直接房地产投资回报率和REITs回报率在短期内的差异，很大程度上是由于直接房地产投资的回报率并不是一种可通过现实投资获得的回报率。


    ¹ 参见Decker（1998）以及Ambrose and Limmerman（2001）


    ² Sagaly（1996）记录了REITs的代理问题。'
