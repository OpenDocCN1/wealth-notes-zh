- pgno: 634
  md: '对数收益率也被称为增长率（growth rates），并且该增长呈指数级。也就是说，长期来看，该增长最终会导致投资组合增加到正无穷或者减少为零。


    与 10% 的算术收益率相对应的对数收益率为 $\bar{r}_{t, 1}=\ln(1.10)=9.53\%$。算术收益率 $r_{t, 1}=10\%$
    与对数收益率 $\bar{r}_{t, 1}=9.53\%$ 是等效的，因为它们都表示期初投资的 1 美元在期末会获得 1.10 美元或者说总收益率是 $R_{t,
    1}=1.10$。使用算术收益率时，我们只在期末获得利息，而对数收益率则假设每时每刻都在获得利息（因此又被称为“连续复利”）。由于获得的利息又会每时每刻继续生利，连续复利率并不需要那么高——只有
    9.53%——就可以使期末总收益率也达到 1.10。


    对数收益率在时间上是可加的。如果我们持有一种连续三年每年获得总收益率 $R_{t, 1}=1.10$ 的资产，我们可以将每年的对数收益率 $\bar{r}_{t+1}=9.53\%$
    加总来计算在三年年末的累积财富：


    ```

    $\begin{gathered}\bar{w}_{t, 3}=\exp\left(\bar{r}_{t, 1}\right) \exp\left(\bar{r}_{t+2}\right)
    \exp\left(\bar{r}_{t+3}\right) \\ =\exp\left(\bar{r}_{t, 1}+\bar{r}_{t+2}+\bar{r}_{t+3}\right)
    \\ =\exp\left(3 \times 0.0953\right)=1.3310\end{gathered}$

    ```


    但是，不同资产的对数收益率不可以累加。假设我们拥有总收益率 $R_{t, 1}^{A}=1.10$ 的资产 A 与总收益率 $R_{t, 1}^{B}=1.05$
    的资产 B。这两种资产的对数收益率分别为 $\bar{r}_{t, 1}^{A}=\ln(1.10)=9.53\%$ 和 $\bar{r}_{t, 1}^{B}=\ln(1.05)=4.88\%$。如果我们的投资组合中持有
    50% 的资产 A 和 50% 的资产 B，那么该投资组合的对数收益率为


    ```

    $\begin{gathered}\bar{r}_{t, 1}^{P}=\ln(0.5\exp\left(\bar{r}_{t, 1}^{A}\right)+0.5\exp\left(\bar{r}_{t,
    1}^{B}\right)) \\ =\ln(0.5\exp(0.0953)+0.5\exp(0.0488))=\ln(1.075)=7.23\% \\ \neq
    0.5 \times \bar{r}_{t, 1}^{A}+0.5 \times \bar{r}_{t, 1}^{B}\end{gathered}$

    ```


    这表明投资组合的对数收益率并不等于各个资产的对数收益率的加权平均值。


    # 1.4 算术收益率与对数收益率的对比


    对于算术收益率和对数收益率这两种表达方法哪种更优，许多业界人士和学者们一直在争辩$^{\text{(1)}}$。争论应该采用算术收益率还是对数收益率，就像是争论在制作苹果派的菜谱中，究竟是应该用磅还是用千克来作为计量单位。它们所代表的是相同的内


    > (1) 这场争论还在继续进行。算术收益率的拥护者们通常是喜欢其无偏的特点。对数收益率的拥护者们认为对数收益率衡量了财富的真实变化，而且对数收益率自动假设资本再投资。参见
    Cooper（1996），Jacquier, Kane and Marcus（2003）和 Missiakoulis, Dimouliou 和 Eriotis（2010）。'
