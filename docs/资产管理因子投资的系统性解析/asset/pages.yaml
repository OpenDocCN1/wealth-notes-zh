  md: '![](img/e2a8f768e844f37dcab93b54b9e826d9_608_0.png)


    这种顺周期性导致当分配给PE的资金最高时PE投资所获得的收益率却最低。为什么私募股权投资者会这样做？部分原因是由于私募股权收益率无法被直接观测到。PE基金通常不公布其收益率。


    # 3. 私募股权的风险和收益


    缺乏市场价格和对被投资公司的低频交易导致业界使用以下三种主要的业绩衡量方法：①内部收益率（IRRs）；②投入资本总值倍数（total value to paid-in
    capital multiples），被称为TVPs或简称倍数；③公开市场等价物（public market equivalents）或PMEs⁽¹⁾。这都是通过定期估值计算出的净资产估值（net
    asset valuations，NAVs），


    ⁽¹⁾ FAS 157促使 NAVs 更多反映其市场价值是因于经常没有市场交易，估价是基于CPs的大致判断，即使市场有交易时、也存在选择偏差问题（参见第13章）'
