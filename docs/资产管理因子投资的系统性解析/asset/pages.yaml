  md: '![](img/e2a8f768e844f37dcab93b54b9e826d9_58_0.png)


    市场之后，波动率策略才重新开始盈利。作为对比，图2.1也描绘了将1美元投资于标普500指数的累计收益曲线。股票回报表现出比波动率策略更大的振幅，并且从2000~2010年间，股票基本没有收益（失去的十年）。股票就像坐过山车一样，在21世纪初的衰退中向下俯冲，在2005年前后开始向上攀升，随后又急速下挫，但金融危机期间下行幅度与波动率策略相比要更小。


    波动率策略的配置比例应当是多少呢？考虑到显著的（左侧）尾部风险，那么什么类型的投资者适合在压路机前捡硬币呢？


    # 2. 选择


    经济学家希望每个市场参与者（个人、企业或机构）有尽可能多的选择，并引导每个参与者做出最优选择(1)。这些选择反映了资产所有者的偏好。偏好是权衡取舍的集合：我如何平衡风险和收益？权衡可能会出现在某一时间点，比如，究竟是选择持有波动较小但收益亦不高的国债，还是选择投资在压路机前捡硬币的波动率策略？权衡也会跨


    (1) 我在哥伦比亚商学院的同事Sheena Iyengar（2010）证明了一些情况下，太多的选择最终不利于消费者做出选择。我将不采用这条思路。正如我将在2.6节中要讨论的，框架效应等心理因素对坚持最优资产组合选择策略起到重要作用。'
