    # 2. 行业特征


    # 2.1 什么是私募股权


    私募股权由来已久。“commenda”是一种兴起于10世纪的商业合同，用于为商船航运提供融资：被动所有者（passive owner）提供部分或全部资金，主动所有者（active
    owner）则负责实际航运。双方共享利润，但是被动所有者可能损失的金额上限是他们提供给行程的资金（他们的责任是有限责任）。而另一方面，主动所有者


    ① 参见 fisnews.com 上的The Real Pension''Pay-to-Play（2012年2月3日）.'
