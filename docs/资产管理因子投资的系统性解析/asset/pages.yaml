    # ## 3.2  对冲基金倒闭


    对冲基金是基金业中高风险的投资品种。每一年，10%至15%的对冲基金从数据库中消失，因此大多数对冲基金存续时间并不长$^{1}$。我与Vanderbilt大学金融学教授Nicholas
