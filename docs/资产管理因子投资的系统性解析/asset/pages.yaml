    在这里想告诉投资者的是，投资债券时不应当只考虑宏观风险、增长和通货膨胀，还应当考虑到美联储的行为。美联储风险包括：①货币政策冲击，指美联储在应对不同的产出和通货膨胀水平时，实际行为与市场预期之间的差异；②政策立场的改变，尤其是美联储对于通货膨胀风险的应对方式。


    # ## 2.5 新货币政策


    我们当前生活在“后金融危机”的世界，在讨论影响债券价格的货币政策风险时，我们需要考虑投资者对于美联储采取的新的非常规货币政策应当如何反应，因为这些非常规政策在未来很有可能变成常规政策。除了量化宽松之外，这些政策还包含很多其他以首字母缩写命名的形式，比如货币市场投资者融资工具（MMIFF，MONEY
    MARKET INVESTOR FUNDING FACILITY），资产支持的商业票据货币市场基金流动性工具（AMLRF，ASSET-BACKED COMMERCIAL
    PAPER MONEY MARKET MUTUAL FUND LIQUIDITY FACILITY），商业票据融资工具（CPFF，COMMERCIAL PAPER
    FUNDING FACILITY），一级交易商信用工具（PDCF，PRIMARY DEALER CREDIT FACILITY），定期证券借贷工具（TSLF，'
