  md: '用非线性契约来雇佣最好的代理人并确保这些最佳代理人选对正确的投资组合。


    标准委托代理问题与委托组合管理问题之间这些显著的区别导致委托组合管理领域较之于契约理论的其他领域发展得相对缓慢。在Stracca（2006）的出色调研中，他指出，正是由于这些不同，“研究文献往往得到更负面而不是更具建设性的结果，即便在最简单的设定下，对最优契约的探寻也被证明尚无定论。”$^{①}$
    Stracca是对的——经济学家还未找出一种万全的方式来确保你不会组合管理人欺骗。但也不是所有情况都令人沮丧。我相信有许多有用的原则可供资产所有者利用，只不过其中有些原则在行业实践中不幸地被忽视了。


    # 3.2 无相关性结果（Irrelevance Result）


    奖励基金管理人的一种常见方式是基于其战胜了基准，基准通常被设定为一个资产类别指数，比如标普500。代理人的薪酬通常为线性结构，所以代理人会获得基本 工资再加上超额收益的一部分或几倍。我们经常选择线性契约并不是因为它们最优（它们通常并不是最优的），而是因为它们较为方便。在标准代理问题中，线性契约满足了参与约束（一份足够高的基本工资吸引有才能的代理人来工作）和激励相容约束（有才能的代理人具有动力来努力工作）。


    令人惊讶的是，线性契约并不能让管理人以对资产所有者最优的方式来行动。Stoughton（1993）以及Admati和Pfleiderer（1997）发现了这种无相关性结果，其指出线性契约在委托组合管理中并未起到有用的作用。同时掌控着组合均值和风险的代理人总是能不按委托人希望达到的目标去做。换言之，“无相关性结果”是指管理人的努力程度并不取决于他得到多少报酬。这点非常值得注意，因为基于业绩超越资产类别基准的线性支付方式如此之普遍，而这却无益于资产所有者。


    Stoughton-Admati-Pfleiderer的研究设定非常现实：委托人从多个代理人中进行选择，正如资产所有者有多种（假定是有才能的）基金管理人可供选择那样，所有管理人都在兜售其特有的创造超额收益的能力，并且由于资产所有者无法密切监控他们雇佣的所有基金管理人从而判断他们是否在偷懒，所以代理人的努力程度不为资产所有者所知。基于标普500或类似的资产类别基准的线性业绩指标，没有最优地分担风险，没有让委托人实现最优化，会削弱管理人试图努力的动力，对筛除较差管理人没有帮助，对如何将管理人偏好与投资者偏好一致化也没有起到任何作用。


    ① 还可参见Bhattacharya et al.（2008）的研究调查。还有一份时间久远但表述很清楚的评论是Lakonishok et al.（1992）。'
