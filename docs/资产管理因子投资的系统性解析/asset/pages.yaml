  md: '口之后，小盘股就不再有更多回报。小盘股共同基金的创立，使得普通投资者能参与并承担与规模相关的风险。业界不断创新新产品来利用规模溢价，使得经济体的风险承受能力相应有所改变，这些发展导致规模效应逐渐消失。小盘股的早期投资者走了鸿运。当小盘股价格上升至长期均衡点时，早期投资者获取了可观的风险调整后资本利得。


    本书撰写之际，业界不断涌现出许多试图获取因子风险溢价的新产品。我对利用低风险股票获取高平均收益的基金，即本书第10章所描述的风险异象特别感兴趣。低波动率或低（历史）贝塔的股票看起来过于便宜，因为它们有着不寻常的高收益。根据我前面所阐述的因子标准，低波动率可能是个因子，但必须承认学术界对该风险异象的研究文献仍远不如价值、动量、卖出波动率保护等因子丰富。随着资产管理行业会创造出更多产品来交易低波动率风险——正如业界积极涌现的那样（尽管可能不如资产所有者希望的那么便宜）——新投资者可能会增加对低风险股票的持仓。届
    时低风险股票的价格将上升至应有价格，使得早期的低波动率投资者获取可观的资本利得，然后这种风险异象会像规模溢价一样逐渐消失。我真希望这会发 生，因为这样一来低风险之谜就能得到解答，但我并不预期这会发生。


    # ### 3.2 从因子到资产


    资产所有者应该挑选出合适的风险因子，然后通过合适的资产来实现这些因子敞口。图14.4说明了这一过程。有些风险因子本身也是资产大类，比如能以低成本方式实施的普通股票和债券。投资者通过在股票或债券市场上简单做多就能获取上述被动因子。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_469_0.png)


    ① 也可参见Cochrane（2013b）。'
