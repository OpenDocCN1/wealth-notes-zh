  md: '范畴，而美国宪法及大量的法庭裁决限制了联邦政府的行动范围。


    我与Richard Green曾通过布鲁金斯学会（Brookings Institution）的汉密尔顿项目（the Hamilton Project）呼吁，地方政府可以通过集体行动来解决许多效率低下的问题¹。地方政府可以团结在一起，这样一来会有更好的渠道获得更专业的金融顾问建议，掌握更多的资源，并彼此帮助完成自己无法单独完成的事情。这样做可以带来巨大的潜在好处。按照公式（12.7），如果市政债券具有与国债相同水平的流动性，那么地方政府的借款成本会比目前水平降低1%。这会给纳税人每年节省超过300亿美元。


    # 3.3 期限利差


    公式（12.7）揭示的利差分解贯穿了整个收益率曲线。不过税收影响随着到期日的变化而变化。尤其是市政债券的收益率曲线比国债曲线更陡，但陡峭程度随着时间的推移发生变化。这是市政债券相关文献中提及的标准性事实（stylized
    fact）之一，被称为市政债券之谜（muni puzzle）。


    我们预期市政债券的收益率（$y_{muni}$）与国债收益率（$y_{tgy}$）相关，即$y_{muni} = (1-\tau)y_{tgy}$，这里$\tau$指适用的税率²。比方说，一个人投资美国国债赚得4%，但税后回报为$(1-0.396)
    \times 0.04 = 2.4\%$。因此，我们猜想市政债券的收益率也在2.4%，这样一来应税国债与免税市政债券二者的税后回报相同。这种关系适用于到期日不满一年的债券，但对于更长期限的债券则不再有效。事实上，长期市政债券的收益率比这个简单公式预测的要高出很多³。这是市政债券之谜以外的另一个标准性事实：即市政债券收益率曲线从未向下倾斜，而国债则经常出现（参见第9章）。


    目前关于市政债券之谜已有多种说法，其中我曾经的合著者Richard Green（1993）提出的解释最为引人注目。Green构建了一个由应税国债组成的无风险投资组合，实现了对收入的转化，收入按资本利得征税。从本质上讲，相对于一些简单的分析，Green演示了如何构建应税债券组合来减少税收的影响，使得市政债券之谜看上去不再那么明显。Green在提及他的模型时，非常谦虚地称之为“一个简单的分析”（他写在了文章的标题之中），但其实解读这个模型需要一定的理解水平。


    +   1. 参见Ang and Green（2011）。该文对市政债券市场效率低下的情况做了很好的总结，本章节部分数据引自该文。


    +   2. Miller（1977）一文提出该公式。


    +   3. 另一种描述市政债券之谜的方法是，市政债券曲线与国债曲线之间的比率所隐含的边际税率要远低于根据联邦所得税税率所预计的结果。但是，通过其他市政债券相关产品的价格所预测的隐含税率极高。Longstaff（2011）预测市政债券互换（muni
    swaps）所隐含的税率大约在38%。Ang，Bhansali and Xing（2010）预测市政市场贴现债券所隐含的边际税率超过100%。'
