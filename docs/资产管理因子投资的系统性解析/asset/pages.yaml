  md: '# 1. 纽约州共同退休基金


    纽约州共同退休基金（New York State Common Retirement Fund，简称NYSCRF）在2011年时拥有1406亿美元资产和超过一百万的参与者，是世界上最大的养老金计划之一$^{①}$。这笔巨额资产仅由一人掌控——州审计长，即由一位经选举产生的政府官员来担任唯一受托人。


    多年以来，许多人试图改革纽约养老金体系的治理结构，然而尽管丑闻不断出现，所有的改革尝试仍然全都失败了。当所有权力都授予一人时，很容易招致麻烦，这正是过去几十年出现的情况。例如：Edward
    Regan是1979~1993年的审计长，他于1989年被纽约政府公正委员会（New York Commission on Government Integrity）调查，原因是其将州政府业务介绍给那些曾为他政治竞选捐款的投资银行和律师。H.
    Carl McColl在1993~2002年担任审计长，他因向该养老金投资的公司写信让这些公司考虑他朋友和家人的简历而受到抨击，更甚的是他用的还是州政府的信头。McColl还被指控将该养老金的法律业务介绍给其政治竞选的贡献者。McColl的继任者Alan
    Hevesi被迫于2006年辞职，他最终对其收取了一百万美元介绍费而将NYSCRF的养老金资产投向某些特定投资公司一事认罪，最后锒铛入狱。


    Thomas DiNapoli于2007年被任命接替Hevesi在余下的任期内担任审计长，他引入了一系列改革措施来提高透明度和防止欺诈。DiNapoli使用了外部顾问、咨询公司、法律专家，成立了由专业人士组成的委员会来给他提出关于退休体系、投资、房地产、精算估值等方面的建议。然而归根到底，这些架构和人员都仅仅只是顾问性质，审计长本人仍保留了绝对控制权$^{②}$。


    $^{①}$ 这一例子基于案例 “Who Watches the Watchmen? New York State Common Retirement Fund”,
    哥伦比亚大学案例, ID#110307.


    $^{②}$ 严格地说，州审计长对除房地产以外的所有资产有直接的全面控制权。根据纽约退休与保障法（New York State Retirement and
    Security Law）的423（b）条，所有房地产交易需经过房地产咨询委员会（Real Estate Advisory Committee）的批准。然而该委员会的成员是由审计长任命的。关于唯一受托人功能和审计长其他职责的进一步信息，参见Sanzillo（2012）。'
