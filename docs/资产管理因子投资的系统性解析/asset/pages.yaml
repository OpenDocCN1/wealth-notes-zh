- pgno: 273
  md: '票价格，$P$，是未来股息贴现后的现值：


    $$P = \frac{D}{E(r)-g}$$ 公式（8.2）


    其中，$D$ 是下一时期的预期股息，$E(r)$ 是贴现率，$g$ 是股息的增长率。公式（8.2）是一个估值公式。如果保持 $D$ 不变，当前股票价格高是因为
    $1/(E(r)-g)$ 低：要么是未来预期收益低，要么是未来增长高、或者两者都是。我们通常认为，高股价的出现是因为增长将会较高。例如，本书撰写之时，苹果公司（Apple
    Inc.，代码 AAPL）和脸书公司（Facebook Inc.，代码 FB）的高股价意味着这些公司未来的增长还会持续。但总的来说，高股价预示着低增长（这是价值效应，参见第7章）。


    公式（8.2）中的 Gordon 模型可以等价地表达为：


    $$\frac{D}{P} = E(r)-g$$ 公式（8.3）


    这表示：高股息率是由于未来预期收益高，或未来增长低，或两者都有。我们也可以写成：


    $$E(r) = \frac{D}{P} + g$$ 公式（8.4）


    这表示：预期收益是股息率加上现金流增长率。公式（8.4）表明股息率应该可以帮助预测预期收益，金融界从 Dow（1920）就开始对此进行研究。


    学术界研究了股息率的方差分解（variance decomposition），即通过对公式（8.3）的两侧求方差来计算。这样一来，我们可以将股息率的变动分解为由预期收益或贴现率
    $E(r)$ 引起的变动、增长率 $g$ 引起的变动以及两者联动所引起的变动：


    $$\operatorname{var}\left(\frac{D}{P}\right)=\operatorname{var}\left(E(r)\right)+\operatorname{var}(g)-2\operatorname{cov}\left(E(r),
    g\right)$$


    对于后面的讨论，我们假设可以忽略协方差项，所以可写成①：


    $$\operatorname{var}\left(\frac{D}{P}\right) \approx \operatorname{var}\left(E(r)\right)+\operatorname{var}(g)$$
    公式（8.5）


    显然，股息率随着时间而变动。图 8.5 展示了 1900 年 1 月至 2011 年 12 月标普 500 的股息率和盈利收益率。两条数据线协同地移动，相关性达
    73%。由于价格是出现在股息率和盈利收益率计算公式的分母中，当股票市场处于萧条时，这两个收益率通常较


    ① 一些严格的研究没有忽略协方差项。他们通过正交化（通常是 Cholesky 分解）过程将协方差项分解到其他的方差项中。'
