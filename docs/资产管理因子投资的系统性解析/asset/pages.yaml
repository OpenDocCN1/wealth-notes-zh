  md: '值—方差效用并不能让我们捕捉到除这两者之外的其他因素。


    均值—方差效用无须假设回报率服从正态分布。人们经常将均值—方差效用与回报率服从正态分布的假设混淆。这个错误是因为正态分布只有两个参数——均值和方差，二者完全地描述了正态分布（它们被称为充分统计量（Sufficient
    Statistics））。由于正态分布中只有均值和方差起作用，因此对正态分布而言，均值—方差效用就是完美的。Levy和Markowitz证明，对非正态分布的回报率而言，采用均值—方差效用通常也是一个很好的近似。但这种近似偶尔也会很糟糕。让我们回到图2.1，它展示了波动率策略和标普500指数的累计财富。二者的最终回报率大致相同，且有相近的均值（在10%左右）和标准差（在15%左右）。但是，波动率策略就像在迎面驶来的压路机前捡硬币——偏度为-8，峰态为104。标普500指数更接近正态分布。仅使用均值和方差判定波动率策略和标普500指数会得出二者大致相同的结论，但显然这两者并不一样。这样你还会坚持仅使用均值和方差吗？


    尽管如此，我们现在仍将继续使用均值和方差，并将在第4节讨论更为实际的效用函数。


    # 3.1 无差异曲线


    我们用无差异曲线（Indifference Curves）形象地代表均值—方差效用。每条无差异曲线都代表某种特定水平的效用。图2.5展示了风险厌恶系数为3的资产所有者在不同效用水平下的三条不同的无差异曲线。我们用y轴和x轴描绘均值—标准差空间。沿着一条特定的无差异曲线，所有的均值—波动率组合对于投资者来说是没有差异的。例如，图2.5中在三角符号表示的效用$U
    = 0.15$的无差异曲线上，资产所有者并不关心他持有哪种均值—波动率组合，因为所有组合带来的效用都相同。投资者寻求尽可能高的效用，效用更高的曲线位置更靠左。较高的无差异曲线具有更高的均值和更低的波动率，对应于公式（2.4）中更高的效用。虽然图2.5仅画出了三条无差异曲线，但对于每个投资者来说，实际上都有无穷多个无差异曲线族。这些无差异曲线相互平行$^{\mathbb{D}}$。


    在第2.3节中，我们解释了效用函数的形状受到风险厌恶系数的影响。无差异曲线同样如此。投资者越是风险厌恶，其无差异曲线的斜率就越陡。在图2.6中，我画出了三种风险厌恶程度下的无差异曲线。风险厌恶系数$y
    = 3$的无差异曲线斜率最陡：如果


    $^{\mathbb{D}}$ 它们是抛物线，因为公式（2.4）是$\sigma_P$的二次函数。'
