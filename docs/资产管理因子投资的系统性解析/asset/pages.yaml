  md: '资PMEs约为1.5，但从2006年以来就在1.0附近或低于1.0。风险投资基金的情况类似。图18.3显示风险投资基金倍数的平均值为2.5，而其相应的PMEs则降至1.5。如图18.4所示，虽然风险投资基金的PMEs在20世纪90年代中期超过了4.0，但从1999年以后其平均值就降至1.0以下。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_614_0.png)


    PMEs假设资本召集和分红具有与市场组合相同的风险。在现实中，分母包括管理费，这主要是无风险的负债。而分子中产生分红的被投资公司，很可能有比市场组合更大的风险。对分子使用一个更高的折现率会减少PME值。因此，在谨慎考虑风险的情况下，PME应该超过1才能赚取超额收益。Sorensen，Wang和Yang（2012）研究指出，如果被投资公司的贝塔为0.5，则LP需要的盈亏平衡PME值在1.2~1.7；如果被投资公司的贝塔为1.0，则实现盈亏平衡的PME值在1.8~2.1。如果以后者为基准，那么只有20世纪90年代早期的并购投资对LPs创造了价值。


    # 3.4 风险调整后的收益率


    衡量PE的风险和收益率不是一件容易的事情，因为PE不会直接公布收益率，而且IRR、倍数和PME都不是收益率指标。研究表明，在20世纪80年代和90年代初期，未经调整的PE投资业绩领先于公开市场业绩。Harris，Jenkinson和Kaplan（2011）研究结果指出，例如“并购基金在20世纪八九十年代和21世纪初的业绩看上去均超过公开市场业绩。”但一旦考虑了风险因素后，投资者就无法判断PE基金是否能真正创造收益，尤其是在当前的市场环境下。事实上，PE基金的风险调整后收益大多低于公开'
