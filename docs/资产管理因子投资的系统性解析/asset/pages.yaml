  md: '当预期收益率和波动率随时间发生变化时，最优的短期权重随之改变。在公式（4.5）中，我们将下标$t$标在资产的均值和标准差上，$\mu_t$与$\sigma_t$分别表示在时点$t$对该资产在$t$到$t+1$期的预期收益率和波动率的条件估计。无风险利率同样也可能变动（注意，这里已知的是期初的无风险利率，所以从$t$期到$t+1$期的无风险利率记为$r_{f,t}$）。公式（4.5）中，随时间而变化的短期权重现在变为：


    短期权重$(t)=\frac{1}{\gamma} \frac{\mu_{t}-r_{f t}}{\sigma_{t}^{2}}$


    公式（4.14）


    当收益率随时间变化并且可预测时，最优的长期策略便由随时间变化的短期策略加上机会型组合组成：


    长期权重$(t)$=短期权重$(t)+$机会型权重$(t)$


    公式（4.15）


    随时间变化的短期权重由公式（4.14）给出，被称为短视组合（myopic portfolio）。机会型权重被Merton称为对冲需求（hedging demand），该名字是源于对冲需求组合对投资机会集的改变进行了对冲。我更倾向于将机会型权重理解为长期投资者如何机会性地利用随时间变化的短期收益率$^\circled{1}$。


    # 战术与战略资产配置


    Campbell和Viceira（2002）将公式（4.15）的Merton-Samuelson组合拆解为：


    长期权重$(t)=$长期短视权重


    $\quad+[\text{短期权重}(t)-\text{长期短视权重}(t)]$


    $\quad+$ 机会型权重$(t)$


    公式（4.16）


    其中，我们将公式（4.15）中的短期权重分拆为两部分：平均的长期短视权重和对于恒定的再平衡权重的偏离。我们可以将公式（4.16）中的前两项分别理解为长期固定权重（Long-run
    Fixed Weights）和战术资产配置（Tactical Asset Allocation）。公式（4.16）中总体的长期权重有时候也被称为战略配置（Strategic
    Allocation）。


    公式（4.16）中第一项，即是公式（4.14）中短期权重的平均值：


    长期短视权重$=\frac{1}{\gamma} \frac{\overline{\mu}-\overline{r}_{f}}{\overline{\sigma}^{2}}$


    公式（4.17）'
