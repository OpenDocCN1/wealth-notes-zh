  md: '表10.2

    | | 系数 | $T$统计值 |

    |---|---|---|

    | 阿尔法 | 0.65% | 1.96 |

    | $MKT$系数 | 0.67 | 8.94 |

    | $SMB$系数 | -0.50 | -4.92 |

