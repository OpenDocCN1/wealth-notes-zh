  md: '损失，即意味着NBIM通过再平衡所获得的收益。简而言之，对于每个买家，市场上必然存在一个卖家。在均衡状态下，每个人不可能都同时卖出或买人①。再平衡并没有被市场赋予价值。事实上，与此相符合的，持有市场组合的平均投资者并没有进行再平衡：市场本身就是“买入并持有”的②。


    再平衡能给投资者带来的好处因人而异。将股价极低或极高时的收益换为股价居中的收益（如图4.9-D所示），这对于投资者而言是最优的，因为此举降低了风险。在我们的例子中，当风险厌恶程度$
    y = 0.51 $时，60%股/40%债的组合对于投资者而言是最优的。确定性等价计算（参见第2章）表明，如果投资者被迫采用“买入并持有”策略，而不是实施最优再平衡，那么其初始财富的每1美元都需要被补偿0.29美分③。长期投资者重视再平衡，因为该策略可以降低风险、提高效用。而市场并非如此，这是因为市场上必然有部分投资者没有进行再平衡。


    因为再平衡等同于卖空波动率，它自动地赚取了波动率风险溢价。在我们的例子中，波动率是不变的（股票波动率等于0.75），但是在现实生活中，波动率是随时间发生变化的。波动率是一个风险因子，其风险溢价为负（Negative
    Risk Premium）。投资者通过卖出期权或卖空波动率，获取波动率风险溢价。我将在第7章进一步讨论这个问题。


    由于再平衡策略是一种将收益移向中间值的卖空波动率策略，它在市场不断下跌时会扩大损失，它在市场不断上涨时表现不如“买入并持有”策略，因此我们可以清楚地看到，再平衡策略是从市场反转中获取收益。这是该策略在1926~1940年以及1990~2011年期间表现良好的原因之一（如图4.5和图4.6所示）。当市场在最剧烈的崩盘后强劲反转时，再平衡策略的表现就将如奇迹一般。在大萧条时期，以及最近的


    > ① 因此，Sharpe（2010）提倡长期投资者采用“适应性的”资产配置策略，即随着市场上下波动，而不是积极地进 行再平衡。第2节所示的独立同分布收益率假设下的再平衡策略要严格地优于这种适应性的策略。也可参见Perold
    and Sharpe（1988）。


    > ② 我们将在第7章中提到，在CAPM和多因子模型中，平均投资者持有市场组合。平均投资者不实施再平衡。个人投资者能够实施再平衡的前提是有一些投资者不进行再平衡操作。Hayne
    Leland and Mark Rubinstein于1976年提出的投资组合保险策略建议在股价下降时卖出股票——这与再平衡策略相反（参见Rubinstein
    and Leland（1981））。Kindall et al.（2011）开发了一个均衡再平衡的模型。Chien，Cole and Lustig（2012）的均衡模型中也假定部分投资者实施再平衡、而其他投资者没有再平衡。


    > ③ 对于再平衡策略而言最优的效用是 $ \frac{1}{1-y} [ (0.5)^{y} (2.6896)^{1-y} + 2 \times (0.5)^{y}
    \times (1.2136)^{1-y} + (0.5)^{y} \times (0.5476)^{1-y} ] = 2.3303 $。对于买入并持有策略而言最优的效用是
    $ \frac{1}{1-y} [ (0.5)^{y} \times (2.8840)^{1-y} + 2 \times (0.5)^{y} \times
    (1.0840)^{1-y} + (0.5)^{y} \times (0.6340)^{1-y} ] = 2.3270 $。相对每1美元的初始投资资金，投资者如果采用买入并持有策略而非最优再平衡策略的话，所要求获得的确定性等价补偿为
    $ \frac{(2.3303)^{\frac{1}{1-y}}}{(2.3270)^{\frac{1}{1-y}}} - 1 = 0.29 $ 美分。可以注意到，这些计算是仅有的确实使用了现实二中二叉树里的上行概率0.5的计算。所有的期权定价都是基于风险中性概率空间。'
