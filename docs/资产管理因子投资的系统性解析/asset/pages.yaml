  md: '投资交易方式——动态调整持仓、运用杠杆和做空、进行衍生品交易等——使得对冲基金注重一些风险因子，而这些风险因子在投资于同样证券的单边做多的被动型基金中影响不大；在我们衡量对冲基金的风险敞口（或者说Beta）之前，值得注意的是构成对冲基金收益的是什么。


    # 3.1 数据偏差


    去世的人讲不出故事。对冲基金自愿对公共数据库报告数据的形式导致了幸存者偏差（survivorship bias）。对冲基金在业绩差的时候不喜欢向数据库报告数据，因此在其陷入困境之后会停止报告。所以，我们在数据库中很少会看到有破产或者清算关闭的对冲基金，它们一般会在死亡之前就数据库中自行清除。这也导致了基金收益统计中出现向上的数据偏差。另一类幸存者偏差来自于成功的基金向数据库提供其追溯过去历史业绩（该过程也称为回填，backfilling），一般也是历史业绩较好的基金会提供这样的信息。


    另外，对冲基金向数据库报告也是为了做广告（对冲基金不能面向公众募集资金）。如果不是为了吸引投资者，为什么还要报告业绩呢？还是保密的好。由于最好的对冲基金一般也不对数据库报告业绩，对于统计的业绩也有向下的数据偏差。


    因此，向数据库报告的对冲基金遗漏了左尾和右尾的极端情况。那么哪种情况占主导地位呢？研究者总结出，停止报告的坏的对冲基金比从不报告的好基金要多得多（技术层面讲，数据库截断了左边的尾部）。因此对冲基金数据库反映的收益数据过高。


    幸存者偏差有多大呢？至少2%，很多研究者甚至认为偏差在3%~4%之间^(1)^。Malkiel和Saha（2005）估计对冲基金业绩回溯的收益率为14.7%，而不回溯业绩的基金收益率仅为7.3%。两者之中由于业绩回溯带来的偏差高达7.3%。他们估计幸存者偏差为4.4%，该差值等于存活的对冲基金业绩均值与停止报告或死亡的对冲基金业绩均值之差。Fung，Xu和Yan（2004）认为即使超额收益存在，幸存者偏差足以全部抵消对冲基金相对传统股票和债券资产的超额收益。


    Aiken，Clifford和Ellis（2013）巧妙地运用了一组不向主要数据库提供数据的对冲基金样本来估算幸存者偏差。他们能发现那些开始报告、后来又停止报告的对冲基金究竟发生了什么。他们的结论是“商业数据库并未将对冲基金业中最差的基金纳入统


