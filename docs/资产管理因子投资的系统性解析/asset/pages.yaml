- pgno: 14
  md: '如何控制不景气时期所遭受的损失，以及如何减轻由委托管理人所造成的不景气时期的负面影响。资产配置，即选择合适的资产类别和投资标的的具体实践，实际上是因子管理。


    本书的视角主要是针对资产所有者。我对银行、保险公司和其他金融企业也有所探讨，但我将它们都视为资产所有者——从最大的资产所有者，即国家（通过主权财富基金投资），到代表集体资产所有者的养老基金、捐赠基金和基金会，再往下到个人和家庭——的中介。所有议题都是从资产所有者的角度来展开讨论。


    本书是带有个人观点的，书中的许多议题都正面临着积极且重要的争论和探讨。我猜会有很多读者对我的某些观点不认同，理应如此。如果读者能够被我的分析启发而做出投资应对进而成为一个更好的投资者，便是对我的最高褒奖。


    本书适合的读者范围广泛，即使不能完全理解书中的数学公式也不影响阅读，因为本书重在强调直觉逻辑和应用。由于我在商学院任教，案例分析是我们教学的一种重要方式，因此本书的每章我都以真实案例开篇。本书主要基于我所撰写的案例分析。


    如果你是受托人、董事或者代表他人保管资金的个人，而且你想避开数学和统计分析，那么你应该阅读第1章《资产所有者》；第14章《因子投资》；第16章至第18章，分别关于《共同基金和其他40法案基金》、《对冲基金》、《私募股权》。很多受托人还关注如何管理大宗商品投资和非流动性资产，这在第11章《“实际”资产》和第13章《非流动性资产》有所探讨，尽管上述章节含有一些数学公式，但大部分材料对于不具备相关技术性背景的投资者也应该是可读的。


    如果你直接管理基金——不管是资产所有者还是资产所有者的委托管理人——那么我建议你在阅读时增加以下章节：第2章《偏好》，我认为投资者在资产管理中太过于依赖均值—方差优化模型，这章强调了投资者所持有的不同偏好；第3章《均值—方差投资》，我在这章讨论了均值—方差模型，但更侧重于涵盖社会责任投资和“风险平配”（基于波动率来进行资产配置的一种方法，该方法正变得越来越受欢迎）；然后阅读第4章《长期投资》，这章涵盖了动态组合选择，以及第10章《阿尔法（低风险异象）》，这大概正是你在资产管理工作中所试图获取的。低风险异象也是我本人特别感兴趣的话题。第6章至第9章则讨论了因子风险的基本要点，分别包括《因子理论》、《因子》、《股票》和《债券》。最后这两种资产类别我认为它们本身也是可投资的因子。


    个人投资者会对第5章《生命周期投资》和第12章《节税投资》等相关章节感兴趣。第5章主要探讨了如何在工作期间最优化储蓄以在退休后安享晚年。第12章则重'
