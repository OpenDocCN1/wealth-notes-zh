  md: '# # 1. 挪威与沃尔玛公司


    2006年6月6日，挪威财政部宣布挪威主权财富基金（官方称为“挪威政府全球养老金基金”）以“严重且系统性地违反人权和劳动者权利”为由出售了沃尔玛公司股票$^{①}$。作为世界上最大的基金之一和道德投资的领跑者，挪威基金剔除沃尔玛股票的这一决定立即引起了人们的关注。美国驻挪威大使Benson
    Whitney抱怨称，这一武断的决定是基于不可靠的研究结果，并且不公平地唯独挑出一家美国公司。沃尔玛公司对挪威基金的这一决定提出异议，并且派出两名高级主管向挪威财政部提出申诉。


    挪威是世界上最大的石油出口国之一。1969年，挪威在北海首次发现石油并迅速意识到石油带来的收入正在使其经济结构发生扭曲。在20世纪七十年代，挪威经历了荷兰病（the
    Dutch Disease）（参见第1章）的多种症状，逐渐增加的石油收入使得制造业变得缺乏竞争力并且逐渐萎缩。当石油价格在20世纪80年代中期暴跌时，对石油收入的过度依赖导致了经济增长速度放缓。于是，挪威明智地决定要进行分散化投资。


    挪威于1990年设立了“政府石油基金”，从而将部分石油收入转化为一种长期储蓄机制。该基金的设立有两个目标：①将石油带来的财富分散化为由国际证券产品组成的更丰富的资产组合，以提高挪威的风险收益比；②通过将财富隔离在海外来预防挪威也出现荷兰病，让石油带来的财富只能缓慢流入经济体。2006年1月，该基金被重新命名为“挪威政府全球养老金基金”，尽管它并没有担负明确的养老金负债。这一新的命名表明，该基金旨在通过管理其资金以满足政府的长期职责并且惠及后代。


    起初，该基金仅投资于政府债券。1998年，它的投资范围被扩大，允许配置40%至股票，这一比例在2007年上升至60%。2010年，该基金获得批准可以将不超过其总资产的5%投资于房地产；2011年，挪威基金在伦敦和巴黎买了第一批房地产。尽管该基金的投资范围逐步扩大，但“挪威基金管理者们”自基金成立之初便一直致力'
