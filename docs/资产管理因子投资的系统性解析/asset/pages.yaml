    | 资产类别 | 权重 | 评论 |

    | --- | --- | --- |

    | 现金 | 2% | 目标：匹配预期债务，管理再平衡的流动性需求 |

    | 利率 | 6% | 例子：安全的主权债<br>目标：为防止与股票市场的高相关性提供保险，提供高流动性 |

    | 公司敞口 | 55% | 例子：全球股票，公司债，银行贷款，私募股权<br>目标：在经济增长和繁荣时期获益 |

    | 实物资产 | 19% | 例子：实际债券，房地产，基础设施<br>目标：对冲通货膨胀风险 |

    | 特殊机会 | 18% | 例子：绝对收益和实际收益组合，新兴市场，困境债<br>目标：利用特殊投资机会，该配置不是固定的，尚未投出的配置将归于公司敞口风险大类
    |


    简而言之，阿拉斯加基金的宏观因子投资会透过资产类别标签，根据不同资产类别对经济增长、通货膨胀和其他宏观风险的不同反应来进行分类。'
