  md: '行风险厌恶程度的一种替代方法，这个框架下的资产配置类似于我们即将要讨论的损失厌恶。


    # ## 4.2  损失厌恶或前景理论


    损失厌恶是由Kahneman和Tversky在1979年发表的一篇具有里程碑意义的论文中提出，它的产生最初是为了替代纯粹的、理性预期效用。不过，它其实是广义定义下预期效用的一种变形，因为它采用（主观）概率可分函数和回报效用函数来测量风险。Daniel
    Kahneman因其将心理学与经济学相结合的研究工作，尤其是他在前景理论上的研究，荣获了2002年诺贝尔奖。他的长期合作者Amos Tversky很遗憾在此之前已经去世，而未能获此殊荣。Kahneman和Tversky基于人们实际上如何做出决策形成了前景理论（这是一个实证理论）<sup>①</sup>。


    前景理论由两部分组成。


    ### （1）损失厌恶效用


    投资者发现，损失带来的痛苦要多于收益带来的喜悦。损失厌恶效用使收益和损失拥有不同的斜率（边际效用）。


    ### （2）概率转换


    Kahneman和Tversky的研究超越了概率——甚至是主观概率。他们将概率转换为不一定服从概率法则的决策权重（*Decision Weights*）。例如，该权重不一定像概率一样加总为1。决策权重可以让投资者对于低概率事件赋予极高的权重，比如自然灾害和彩票中奖。


    我们可用类似于公式（2.1）的预期效用形式来描述前景理论：


    $$ U = \sum_{s} w(p_s)U(W_s) $$


    公式（2.11）


    其中，概率权重函数w（·），损失厌恶函数为U（·），不同状态s发生的概率为p<sub>s</sub>。


    现在我们来重点分析损失厌恶效用。图2.10画出了典型的损失厌恶效用函数。效用相对于某参考点来定义，在此图中为原点。参考点可以是零（绝对收益），也可以是无风险利率（确定收益）或风险资产收益率（基准收益）。收益被定义为x轴上正值部分，损失被定义为负值部分。效用函数在原点上出现拐点，所以投资者对待收益'
