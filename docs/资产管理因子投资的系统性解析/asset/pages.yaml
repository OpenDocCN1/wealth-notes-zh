- pgno: 289
  md: '上通过隔夜拆借资金（联邦基金）来满足准备金要求。拥有超额准备金的银行将联邦基金借给需要准备金的银行。该市场是双边的，即资金需求方和供给方是“一对一”的配对关系，每对银行之间进行资金拆借的利率都不尽相同。我们将所有银行之间进行拆借的利率通过拆借量加权平均后，得到有效联邦基金利率（Effective
    Fed Funds Rate）。美联储通过公开市场操作（即买入或卖出债券）来干预该市场，使得有效联邦基金利率接近美联储设定的目标联邦基金利率（Target
    Fed Funds Rate）。从2008年12月16日起，美联储设定了目标联邦基金利率的波动区间为0%～0.25%。


    货币政策通过隔夜市场（收益率曲线的最短端）在银行间传导。但是美联储最终希望影响收益率曲线的长端，即10年至30年的区间，以及公司债和机构债的价格。我们将这种通过短端货币政策影响经济的方式称为传导机制（Transmision
    Mechanism）①。自金融危机以来，美联储实施了一系列非常规货币政策，包括直接买卖长端国债和各类风险性信用工具等。量化宽松（Quantitative Easing）即属于这类非常规货币政策。而在金融危机以前，如果通过货币政策直接买卖以下产品，一定是不可思议的：商业票据、机构债、政府支持机构（房地美、房利美、联邦住房贷款银行）发行的债券、住房抵押债券、商业地产抵押债券，担保债券凭证等，以及对摩根大通（Maiden
    Lane）、AIG（Maiden Lane II 和 Maiden Lane III）、花旗集团和美国银行的贷款。我认为，非常规货币政策在未来很可能成为常规货币政策，干预联邦基金市场仅仅是美联储武器库中的众多武器之一。


    现在，我们将重点讨论常规货币政策。美联储通过干预银行隔夜拆借市场的利率来影响三十年期公司债收益率的做法看起来有些难以置信，不过这些货币政策的确是影响所有债券的价格的最重要因素之一。


