  md: '许多更为丰富的效用模型会将上述内容全部纳入考量。其中一些模型符合本章前几节提到的预期效用框架，因此前述所有关于直观逻辑和经济机制的内容都将适用。在经济学中，有很多效用函数切实地描述了人们的行为。遗憾的是，在资产管理行业，只有一个效用函数占主导地位——且是遥遥领先的，即限制性均值一方差效用模型。我们希望可以有一个商业化的优化器，能实现在多种效用函数之间进行切换，尤其是那些包含了下行风险厌恶情绪的效用函数。最好还有一个应用程序可以将一系列不利情景以及投资者如何感知这些不利情景的风险映射到不同类别的效用函数中。遗憾的是，就我所知，在撰写本书时尚未有资产配置模型应用能做到这些。不过，所有的经济理论和优化方法都已是公开资料。


