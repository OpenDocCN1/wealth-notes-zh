- pgno: 150
  md: '行为学的框架来看，暂时的错误定价可以导致价格较低。这同样可以被长期投资者所利用，因为他们知道从长期来看价格会回归到公允价值⁽¹⁾。简单的再平衡策略是逆周期的并且偏向于价值资产，而一些最好的机会型策略甚至更加逆周期并且具有更强的价值倾向。危机对于真正的长期投资者来说是机会。著名的价值投资者Howard
    Marks（2011）曾清晰地解释：“处在危机期间时，关键是要（a）克服被迫卖出的压力，（b）反而开始建仓买入。”这正是再平衡会驱使投资者去做的事。


    学术文献中对于这些对冲需求、长期机会型效应究竟有多大存在争议。Campbell和Viceira（1999）的重要论文中估计，对冲需求非常大，可以达到短期投资者对股票平均总需求的两倍。在Campbell和Viceira的模型中，从1940年至20世纪90年代中期，股票在长期投资者组合中的权重可能从−50%到接近400%。然而，与Campbell和Viceira的文章几乎同期发表的另外两篇文章，Brandt（1999）以及Ang和Bekaert（2002）则认为对冲需求较小。长期机会型需求的大小主要取决于收益率的可预测性和估计该预测性时所使用的模型。在第8章我会指出关于可预测性的证据很不充分，所以我认为战术权重和机会型权重在实际中较小。一旦投资者了解预测收益率的难度或者将估计误差纳入考量时，机会型对冲需求将变得更小⁽²⁾。


    在关于组合选择的文献中，Stambaugh（1999）体系是被最为广泛研究的可预测股票收益率体系，该体系认为股票收益率是由估值比率（例如股息率（Dividend
    Yield）或盈利率（Earnings Yield））所驱动的。估值比率可以很方便地捕捉随时间变化的预期收益率。当股息率上升（或股价下降）时，未来的预期收益率将增加。股息率本身也会随时间而持续地变化⁽³⁾。在Stambaugh体系中，长期机会型组合的预期收益率为正，并且随着投资期限延长组合相应增大⁽⁴⁾。如图4.8所示，当预期收益率增加时，短期的短视权重和长期总权重也相应增加，投资机会变得更具有吸引力。长期投资者实际上是使用了杠杆的短期投资者：如果短期投资者想在预期收益率高的时候买入，那么长期投资者则会买入更多。机会型投资使得长期投资者比短期投资者能够更加深入地利用可预测性⁽⁵⁾。


    +   ⁽¹⁾ 参见第7章关于风险溢价的理性和行为学决定因素的讨论。

    ⁽²⁾ 参见Brandt et al.（2005）及Pástor and Stambaugh（2012a）。

    ⁽³⁾ 第8章展示了该体系可以很好地捕捉到可预测性。虽然可预测性通常很弱，但最好的预测变量是估值比率。

    ⁽⁴⁾ 该体系在诸如Campbell和Viceira（1999，2002）等研究中被采用，并被Pástor and Stambaugh（2009，2012a）推广。

    ⁽⁵⁾ 正如Liu（2007）使用不同的可预测性模型所展示的那样，机会型需求并不总是正向的。'
