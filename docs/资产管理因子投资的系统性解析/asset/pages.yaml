  md: '现良好时能提供给员工一些上行收益，同时每年都能支付给员工一个最低额度（生前都有保障）$^{\textcircled{1}}$。这种保障是由 United
    Technologies 从保险公司定期购买的。（用金融术语来说，United Technologies 的员工收到的是一个普通年金加上看涨期权，或 Dybvig
    棘轮支出模型的递延版。）在罗德岛州的养老金改革中，Raimondo 试图保留养老金支付制度中的生活成本调整（cost-of-living adjustments，COLAs），而不像其他州那样取消这项。在她的提议下，COLAs
    被保留，但支付的金额取决于养老金计划的资金状况和投资回报。这样一来，州政府就不会承担年金支付的所有通货膨胀风险$^{\textcircled{2}}$。


    但如果年金产品本身有缺陷，所有推广年金的努力也只能做到这步了。在资产管理领域出现市场指数基金之前，投资者没有可以低成本购买全面、多样化的股票组合的渠道。他们只能选择昂贵的积极管理产品，而积极管理产品的表现平均来看不及市场（参见第16章）。市场指数基金的出现改变了这一切。它的引入是基于很多专业人士的极大努力（一大部分是投资者的教育），首先尝试它的公司相对而言也是资产管理行业的外行。市场指数基金曾几近夭折——第一次尝试以失败告终。这种结构性转变很少是由从维持现状中获利的公司来推动的$^{\textcircled{3}}$。


    年金市场也到了需要创新的时候。目前还没有与市场指数基金相类似的年金产品：一种非常便宜、简单的年金，能够大规模出售，避免昂贵的中介费用，而且实际上是由投资者主动购买而不是推销给他们。与市场指数基金相比，这样的年金会面临着更多挑战，因为保险监管根据不同州而有所不同，逆向选择又使得定价困难。但如果年金产品的创新成功了，这对投资者会带来很大的好处。


    # 4.5 我们在退休后充分使用储蓄了吗？


    对那些足够幸运或足够有远见可以享受舒适退休生活的人，最后还有一个“退休储蓄之谜”（retirement savings puzzle）：与简单的生命周期模型所预测的相比，老年人动用储蓄的速度往往慢得多。实际上，Poterba,
    Venti 和 Wise（2011b）指出，对于那些有相对较多退休储蓄的人，退休金账户在个人不工作后仍会持续增加。少于20%的家庭会在70.5岁——法律强制要求家庭提取最小支付额的年龄——之前提取退休金。当他们真的提取时，提取比例也非常低。即使在70.5岁之后，提取比例通常也


