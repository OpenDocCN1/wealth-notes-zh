  md: '得收益。虽然行业中普遍使用套利这个术语，但是这些基金通常找不到稀缺的纯套利机会，而是寻求中和市场走势，在各种证券之间的错误定价中寻求收益机会。


    在这两种方法之间，又有两种主要的投资风格：①主观判断的方式（discretionary styles）基于交易员的判断（或者缺乏判断）；②系统化的方式（systematic
    styles）更加基于规则和依赖量化模型。遭遇2007年8月危机的量化基金属于后一类。


    Lo（2007）认为量化基金的损失反映了系统风险的深层根源。很多对冲基金未能在2008～2009年金融危机期间产生绝对收益，而是出现了大幅损失——不论它们是择时投资或非方向性投资，不论它们采用主观判断或系统化方式——这表明，所有对冲基金，不仅仅是量化基金，都存在对共同风险因子的敞口。事实上，对冲基金是一些标准风险因子的集合。


    最重要的两个因子早为人熟知。


