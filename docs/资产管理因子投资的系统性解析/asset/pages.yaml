    # ## 6.2 社会责任投资


    从均值—方差投资的观点看，社会责任投资（SRI）由于降低了分散化优势，一定会赔钱。那么，它能否作为一种积极管理（阿尔法）策略赚钱呢？诸如Kempf和Osthoft（2007）的一些研究发现，按
    KLD指标排名高的股票有着较高的收益率。指数编制公司明晟（MSCI）在其KLD指数中给公司排序时，考虑了多种社会及环境的标准。虽然挪威基金剔除了沃尔玛公司股票，但沃尔玛公司的KLD排名较高，部分是由于其在减少碳排放量方面采取了很多措施。另一方面，Geczy、Stambaugh和Levin（2004）发现，践行SRI的共同基金每月业绩比同业低30个基点。SRI领域的顶尖学者之一、普林斯顿教授Harrison
    Hong在Hong和Kacperczyk（2009）的研究中指出，与其他可投股票相比，烟草、军火制造商及博彩业等“罪恶”行业的股票有着更高的风险调整后收益率<sup>①</sup>。


    凯恩斯在其1936年撰写的代表作中写道：“没有明显证据表明，对社会有利的投资政策与最赚钱的策略相一致。”基于我对SRI研究著作的了解，凯恩斯的评论在今天同样适用。


    <sup>①</sup> Hong, Kubik and Scheinkman（2012）反驳了“做正确的事情来获取良好的收益”的假说，并且论证了完全相反的观点。他们指出，企业社会责任对公司来说是有代价的，公司只有在经济条件下不受限制时才会做有益的事情。从这个意义上来说，企业社会责任对公司成本甚高。'
