  md: '及高收益债券；机会型组合则包括对一个朋友公司的私募股权直接投资（占Daniel总财富的10%）和一些其他投资工具（例如对冲基金与私募股权基金等），这些工具允许基金经理对市场择时并且承担在传统指数型基金中无法获得的因子风险（参见第14章）。


    2008年，Daniel的组合损失惨重。当时全球金融市场暴跌，而Daniel像很多投资者一样眼睁睁地看着自己的组合受到重创。全球各国股票在2008年的跌幅约为30%至50%。Daniel的组合损失了30%。她的私募股权投资血本无归。到了2009年4月，尽管全球经济仍然处于衰退之中，但大家认为市场将不再如自由落体般下滑。可Daniel仍然非常担心她的组合。幸运的是，她并不需要这部分财富来维持她的生活水准。她也没有立即的变现需求迫使她从组合撤回资金。Daniel仍然未婚，但正
