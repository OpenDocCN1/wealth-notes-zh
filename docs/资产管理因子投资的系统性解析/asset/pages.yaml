- pgno: 511
  md: '线性契约。即使选择了错误的基准而导致管理人偷懒，采用类期权（option-type）的业绩费也将有助于激励管理人加大努力程度①。因此，非线性契约应该被更广泛地采纳。


    一般代理理论认为，限制条件构成了基于行为的契约的重要部分并将减轻委托人所面临的代理问题。在Stoughton-Admati-Pfleiderer的研究中，对组合管理人所能持有的组合仓位不设限，这使得他们能很好地同时控制组合的收益和风险，并完全消除激励费的影响。我们可以设置限制条件来作为促使管理人努力工作的一种方式。设置限制条件使得我们在有些情况下可以越过无关性结果的障碍，现实世界中我们也看到了许多对管理人行为的限制：关于组合风险（久期、跟踪误差、贝塔、集中度等）以及可以持有什么、不可以持有什么（投资范围、衍生品等）的限制。理论证明，限制条件构成了最优契约的一个重要部分②。


    # 透明度与披露


    在选择投资管理人时，资产所有者还有另一个重要考量因素，而且这点应尽可能体现在最优契约中。假设有两类投资者：有技能的投资者（Warren Buffet们）和没有技能的投资者（Bernie
    Madoff们）。Bernie Madoff们无法创造真实的超额收益，但他们很聪明，能在一段时间内模仿获得看上去与Warren Buffet们差不多的高回报，比如通过卖出期权（参见第10章），但他们最终还是会失败。Foster和Young（2010）指出，没有任何薪酬契约能仅仅基于历史业绩来区分有技能的和没技能的管理人。这与我们在第10章中讨论过的防操纵组合评估措施形成了对比，那些措施确实让我们能够（最终）从统计上辨别真实技能。但任何一种能筛选仿仿者Bernie
    Madoff们的薪酬契约也会妨碍所有具备真实才能的Warren Buffet们的参与。这似乎将资产所有者置入了困境：如果你能辨别出Bernie Madoff，你将无法雇到Warren
    Buffet；而如果你能雇到Warren Buffet，你可能也雇佣了Bernie Madoff。


    若要越过Foster和Young（2010）上述令人沮丧的结论，关键是要注意到，在他们的分析中薪酬契约是个仅仅基于管理人历史收益的函数。这其实非常普遍：它出现在奖金、回补款以及所有线性和非线性契约中，但它限制资产所有者只看历史收益。一个直接的启示是，我们应该不仅只看历史收益。我们需要管理人持仓和投资策略具有透明度，还应考虑管理人名誉以及与他们投资管理业务相关的其他所有信息。机构投资者应该对单独管理账户（separately
    managed account）可作为一种让管理人交易完全透明化的方法比较熟悉。


    ① Li and Twari（2009）展示了这点。


