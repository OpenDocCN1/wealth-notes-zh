    # 费用之迷


    共同基金公司 with 经纪商、营销公司、分投投资顾问、咨询公司和其他中介机构之间的一些复杂的补偿方式也构成了隐性费用：包括收入分享计划、回扣补偿方案和各种捆绑服务。


    Edelen, Evans和Kadler（2012）研究显示，在费用支付方面较好的透明度可以降低代理成本，带来更高的投资收益。但当市场环境艰难时，较为不透明的费用却能减少基金的资金流出，这可能是由于投资者不能直接看到他们支付的费用情况。Barber,
    Odean和Zheng（2005）研究发现，相对于例如运营费等不太明显的费用，共同基金投资者仅对显而易见的费用敏感，例如前后端费用和佣金。积极型基金公司倾向于复杂度高、透明度低的费率结构。这可使得投资者的资金粘度更高①。


    即使是清晰披露了所有费用，投资者可能也不会对这些费用特别上心（对投资者不利）。Choi, Laihson和Machrian（2010）对哈佛大学工作人员、沃顿商学院工商管理硕士和哈佛届毕业生这些社会上最具金融知识的人群进行了一次实验。他们发现在选择标普500指数型基金时，实验对象始终基于历史收益来选择基金，而其实对于这类简单的产品仅基于费用做出选择即可。即使在得到显著的金钱激励和做出最佳选择的协助之后，实验对象们仍然忽略了费率情况②。


    # 共同基金公司的高利润率


    表16.2是Janus在2011财务年度的损益表。Janus从2000年代初期的灾难中恢复过来，在随后的十年里实现了高达32%的利润率。共同基金公司普遍取得了高水平的利润，共同基金行业是一个很有利可图的行业。


    表16.2显示，Janus的收入仅有一小部分来自业绩费。在2011年，Janus因业绩不佳仅失去了1%的业绩费（40法案只允许对称的业绩费，因此基金管理人在跑输基准时会有损失）。基金公司大多数的收入与其管理的资产总额挂钩。因为很大一部分费用随着资产规模波动，即使是在2000年代初期，Janus仍然能够维持正的营业利润。特别地，超过一半的费用是工资支出。Janus也支出了高额的分销和营销成本，这部分占总


