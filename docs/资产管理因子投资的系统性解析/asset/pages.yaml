    持怀疑态度的读者现在可能会问：“那又如何呢？”消费本来就变动不大，而且有其它变量能更好地反映经济增长（参见第7章）。我曾指出，大部分市场参与者的效用函数并不是均值一方差类型的，CRRRA就是一个例子（参见第2章）。那么，这个风险溢价之谜——即股票收益高于这个非常程式化的、人为设定的Mehra–Prescott经济模型中的收益——究竟纯粹只是学术上的结论，还是确实关系到我们如何在现实世界中投资各类资产呢？


    股票溢价之谜十分重要，因为许多投资者正是基于历史上的高收益而持有大量股票。未来这种高收益还会持续，正如前面令人鼓舞的例子一样吗？还是说，股票收益将永久地进入一个新阶段，正如2000年以来“失去的十年”的持久版一样呢？理解产生股票溢价的原因，将对我们决定未来是否应继续持有大量股票提供合理的基础，而不是简单地由于我们以前持有就该继续这样做。经济学家给出了多种解释，我将介绍与投资者最相关的四种。


    # ## 3. 股票溢价之谜的解释


    # ### 3.1 市场风险厌恶程度（有时）很高


    关于股票溢价之谜的第一个解释是，市场的风险厌恶程度非常高。市场风险厌恶程度$\gamma$的下限，或者说代表性参与者的风险厌恶程度下限，满足以下公式：'
  merge: -1
  img_proc: true
- pgno: 261
  md: '$$\gamma > \frac{Sharpe Ratio}{\sigma_{c}} \qquad \text{公式 (8.1)}$$


    其中，Sharpe Ratio代表股票市场组合的夏普比率，$\sigma_{c}$是实际消费增长的波动率$^{1}$。


    表8.1中数据给出的风险厌恶程度下限约为20。这比Mehra和Prescott所指出的以及第2章所讨论的“合理”风险厌恶程度的上限10要大很多。如果我们完全假定消费增长呈对数正态分布来计算隐含的风险厌恶程度，那么与股票溢价相匹配的平均投资者风险厌恶程度则大于120。类似这样的估算，在Hersen和Singleton（1983）开创性工作之后兴起的研究文献中很普遍。


    或许代表性参与者的风险厌恶程度很高，甚至可能高于120。但这显然是有问题的，因为个人并没有那么高的风险厌恶程度。还有第二个原因，即Philippew Weil（1989）提出的无风险利率之谜（risk-free
    rate puzzle）。虽然很高的风险厌恶程度能在数据上与股票溢价相匹配，但高风险厌恶程度也会提高Mehra–Prescott模型中的无风险利率水平。一个很厌恶风险的代表性参与者会要求获得高溢价才愿意持有股票，但该参与者又希望长期有非常稳定的消费水平，因此，需要有很高的无风险利率来促使他们不去平滑消费水平。于是“为何股票收益如此之高？”的问题其实就是“为何无风险利率如此之低？”的另一面。如果投资股票获得的收益是被过度补偿，那么投资债券获得的收益则是被补偿不足。


    具有随时间变化的风险厌恶水平（time-varying risk aversion）的一组模型可以解释股票溢价之谜。我们通过习惯效用（habit utility）模型来说明它们是如何起作用的。此前我们已在第2章见过这些效用函数，用它们来构建相对某个水平的财富效用，而不是直接采用财富效用本身。在习惯效用模型中，代表性参与者的效用取决于相对过去水平或习惯水平的消费。一个典型的模型是由Campbell和Cochrane（1999）提出。


    我们设想一个年轻的大学毕业生，她习惯于睡沙发、与别人合租公寓、开二手车。她找了一份咖啡师的工作，结果突然被解雇。这显然很糟糕，但对她的伤害并不是很大，因为她已习惯了简朴的生活，她的消费水平相对于其习惯水平并没有降低太多。现在，假设她毕业后拿到了一份高薪工作。她的消费水平会提高，因为她现在收入很高。她搬进拥有很好视野的自住房，买了辆全新的车，开始穿设计师品牌的衣服。她的消费习惯已经有所提升，现在如果她突然被解雇，这就会变得非常糟糕。实


    ① 推导过程参见Cochrane（2011）。这是Hansen和Jagannathan（1991）所提出的定价核（参见第6章）的更常见界限的一种特殊情况。Lars
    Hansen于2013年获得诺贝尔奖。'
