  md: '# ### 推荐序


    2017年2月我应邀在《资产管理杂志》（Journal of Portfolio Management）举办的圣迭戈论坛讲演。排在我前面讲演的正是马科维茨（Harry
    Markowitz）教授。马科维茨时年90岁，距他获得诺贝尔经济学奖已经27年了，我向他问候道：“我上次见到您是25年前，我这次来圣迭戈主要是想请教一些财富经济学的问题，而我不想再等25年了。”马科维茨狡黠地微笑了一下说：“其实没关系，我会等着你的。”在场的人都大笑不已。马科维茨又加了一句，“至于说到财富，财富的功能不在于它的数量本身，而在于它的变化速度。”（The
    utility of wealth is not in its quantity but in its speed of change）。一语点醒梦中人。从英国哲学家休谟（David
    Hume）和边沁（Jeremy Bentham），到刚刚获得2017年诺贝尔经济学奖的现代行为金融学家塞勒（Richard Thaler），在这一观点上竟也是一脉相承的。


    正是马科维茨在1952年创建了“最优化的均值方差组合”（Optimal mean-variance portfolio），也被称为“马科维茨边界”。马科维茨的理论虽然当时被弗里德曼（Milton
    Friedman）骂得体无完肤，但却被誉为“现代组合理论”（Modern Portfolio Theory）的开山鼻祖，至今仍深刻地影响着西方投资学的理论发展和实践。70年代以来众多教科书均收纳了马科维茨“有效前沿”的模型。而70年代末期以来，诸多学者又在大量数据分析的基础上，将马科维茨的以“充分分散”“均值预期收益计算”“风险方差”等概念进一步推演以优化组合风险收益特征，提出以组合内含的“因子”而不是资产类别为计算基础的“后现代组合理论”（Post-Modern
    Portfolio Theory）。这本书的作者，青年才俊Andrew Ang就是后现代组合理论的代表之一。


    本书的翻译组织者陆清洁女士已经对“因子投资”这一组合构建方式做了很好的归纳，读者可以参考她所做的序言，或者互联网上浩如烟海的资料。'
