  md: '为主权财富基金，二者之间界限模糊。澳大利亚及新西兰的主权财富基金是专门设立用来满足国家未来养老金负债的需求，它们欣然接受了主权财富基金的称呼。而另一方面，加拿大养老金计划（Canada
    Pension Plan）则煞费苦心地为释为为什么它不应该被称为主权财富基金①。


    目前有四种类型的养老储蓄：


    +   ① 国家养老计划，例如社会保障；


    +   ② 私营固定收益计划（defined benefit plan），即私营企业承诺受益人可以在未来收到一定的或预定的收益；


    +   ③ 私营固定缴纳计划（defined contribution plan），即按照预定的金额缴纳，但未来收到的收益金额不固定；


    +   ④ 私人管理的基金，这在美国包括个人退休账户（IRA）、自雇人员退休金计划（Keogh）和401(k)计划等，可以享受税收优惠但对缴纳有严格限制（参见第12章）。


    经济学家在谈及养老保险制度设计时，通常会提到多层次、多支柱的概念②。社会保障是第一支柱，旨在为绝大多数公民提供最低限度的保障。第二支柱则包括与工作有关的退休金，包括上述第②项和第③项，在美国这两项构成了人们退休储蓄的很大一部分。第三支柱是个人自愿储蓄，即上述的第④项、同时还包括没有税收优惠的其他退休储蓄。当然现在还有第四支柱：当退休储蓄不足以维持生计时，连老奶奶恐怕也不得不重返职场。


    # 3.1 固定收益计划与固定缴纳计划


    根据固定收益计划，雇主会根据雇员的年龄、工作年限、现在及过去的工资水平来支付退休收益。因此，退休收益已经被明确规定。退休时支付收益的常见计算方法是“收益系数×三年期限内的最高平均薪酬×任职期限”，其中收益系数可能会随着年龄增长而增加。例如，美国最大的养老金计划——加州公务员退休基金（California
    Public Employees'' Retirement System, CalPERS）规定教师在55岁退休时收益系数等于2%。对于年满63岁的教师，收益系数会增至2.5%。由于雇员在退休时的福利金额是可以预测的，雇主（在多数情形下）会承担投资风险。


    相比之下，根据固定缴纳计划，雇主缴纳的金额是固定的。因此，缴纳金额已经'
  merge: -1
  img_proc: true
- pgno: 36
  md: '被明确规定。退休金账户的运作模式类似于银行账户，投资于一系列资产类别例如股票、债券、房地产等。雇员自司投资，但可供投资的基金类型通常由雇主决定^{1}。由于投资收益随时间波动，雇员个人承担投资风险，并且因为一些雇员在养老金计划中比其他人投入更多的自有资金，因此退休时的福利金额是不固定的。


    在过去的三十年里，养老金发展的最大变化是固定收益计划越来越少见。宾夕法尼亚大学沃顿商学院一位研究养老金的专家Olivia Mitchell指出：“固定收益计划正在被淘汰。”^{2}对政府工作人员而言，固定收益计划仍占主流，但许多公司已冻结他们已有的固定收益计划，不再接纳新成员。有的公司还将固定收益计划转换到固定缴款计划^{3}。养老金规模庞大。在美国，养老金资产合计超过国内生产总值的70%。养老金规模在其他国家甚至更为显著，比如澳大利亚和荷兰，养老金资产总额分别占到国内生产总值的90%和135%以上^{4}。


    图1.2-A展示了美国私营养老基金历年的规模（图1.2中所有数据是根据基金资金流量统计得出）。截至2012年年底，私营养老基金的资产规模达到6.6万亿美元。私营养老基金的资产规模以每年8.2%的速度增长，不过在2000年互联网泡沫破灭时出现了骤降，2008年金融危机爆发时也使得养老金在管资产大幅缩水29%。造成在管资产规模大幅下降的原因是养老基金热衷与追求风险回报，所增持的股票和其他风险资产在市场低迷时期表现不佳。


    图1.2-B显示，私营养老基金投资组合中非固定收益类资产所占比重从20世纪50年代初的不足20%上升到2012年的70%以上。这种多元化的投资先是在20世纪60年代投资美国股票，然后在20世纪七八十年代增加了对全球及新兴市场股票的投资。自20世纪90年代中期以来，特别是21世纪初，养老基金开始争相投资另类资产，特别是对冲基金和私募基金，不过本书第17章和第18章会分别解释这些另类投资其实并不是真正的资产类别，而只是资产所有者与中介之间合约类型的不同标签。


    养老金资产规模的增长主要源于固定缴款计划的兴起。图1.2-C展示了固定收益计划及固定缴款计划各自在管资产规模所占比重。1984年固定收益计划管理近70%的总资产规模，但在2012年比重已经下降到35%。固定缴款计划所占比重的增长基本来


