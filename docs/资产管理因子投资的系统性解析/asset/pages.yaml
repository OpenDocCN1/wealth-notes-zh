    Maynard Keynes）是20世纪最伟大的经济学家之一，但鲜为人知的是，他也是一家捐赠基金的管理人。凯恩斯当时负责管理剑桥国王学院（King’s College）的捐赠基金，是最早进入股票市场的先驱之一
    ${ ^2 }$ 。股票在资产配置中的更高比例已被证明从长远来看是非常有利的，但在当时许多人对捐赠基金管理人这么做是否明智提出质疑'
