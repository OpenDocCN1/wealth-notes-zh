  md: '确实如此，我们将在后续章节对此进一步探讨。那些小市值的股票以及在信息并非公开有效、流动性欠佳的市场中交易的股票对CAPM模型的偏离最为明显。


    总的来说，我们认为当CAPM模型背后的假设不成立时，就会产生额外的风险溢价。这包括能对投资者非金融面产生影响的宏观因子、不对称风险所带来的影响、非流动性和交易成本、税收等。我们预期在流动性欠佳、有效性较低的市场会看到CAPM模型的缺陷更为明显。尤其是完美信息的假设，是现代经济学家不再相信市场是有效的（传统CAPM理论认为市场有效）原因之一。


    # 6. 有效市场理论的失效


    现在，经济学家不再相信完全有效市场$^①$。事实上市场不可能完全有效。市场近有效（market near−efficiency）理论这种现代提法是由Sanford
    Grossman和Joseph Stiglitz（1980）发展起来的，这也是令Stiglitz获得2001年诺贝尔经济学奖的系列论文之一。Grossman和Stiglitz所描述的世界是一个近有效市场，他们试图解决CAPM模型关于信息成本为零的假设所带来的难题。假设收集信息和交易信息是有成本的、如同在现实世界中一样。那么，如果所有信息已经反映在价格中，谁还愿意投资去获取这些信息呢？如果没人愿意投资去获取信息，那这些信息又如何能反映在股票价格中、市场又如何有效呢？因此，市场不可能是完全有效的。


    Grossman和Stiglitz创立了一种市场是近有效的模型。积极管理人不断找寻市场无效带来的机会，而这种活动本身会导致市场越来越有效。在市场无效带来的这些投资机会中，积极管理人获取超额收益，以作为对收集和运用信息所花费成本的补偿。在前面讨论的CAPM假设中，我们可以预期，市场无效带来的机会会存于流动性欠佳、信息传播不畅，以及超额利润难以获取的细分市场，因为这样的交易机会很可能会影响股票价格。至于积极管理人是真的为投资者（而非他们自己）赚取了超额收益，我们将在本书的第三部分集中展开探讨。


    Grossman和Stiglitz提出的近有效市场理论与Ross（1976）创立的APT理论下的多因子风险框架相辅相成。Ross的多因子模型指出，积极管理人和套利者驱动着资产的预期收益，使其达到与均衡状态下的风险收益相比匹配的一个值。APT模型中的因子


