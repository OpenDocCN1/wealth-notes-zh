  md: '能力的受益者是共同基金管理人，而不是基金的投资者。共同基金跑输市场，或在最好的情况下打平市场，投资者涌入历史收益高的基金，而这些收益未来不再重现。


    # 4. 封闭式基金


    因为封闭式基金的股份数量固定，并且能够在二级市场交易，所以它是持有流动性不佳资产的理想工具。这意味着基金不会有赎回的问题。因此封闭式基金能赚取非流动性溢价$^{①}$。但是，封闭式基金的交易价格和基金净资产的潜在价值之间存在差异。这种差异可能较大，通常是负数，并随时间变化而变化。这种现象被称为封闭式基金折价之谜（closed-end
    fund discount puzzle）。


    图16.7显示了1934 ~ 2012年封闭式基金的折价情况，它更新了Baker, Wurgler和Yu（2012）的研究数据。数据的最后部分是专门经营封闭式基金的Thomas
    J. Herzfeld Advisors构建的封闭式基金折扣指数。平均折价率为11%，但随着时间变化有相当大的差异。


