- pgno: 15
  md: '在探讨如何配置资产以最小化支付给山姆大叔的税金。研究显示税收也会影响资产价格，并且也是一个因子。


    我认为所有的资产所有者都应该尤为关注其与委托管理人的关系，本书将在第15章《委托投资》对此进行探讨。功能失调的委托代理关系对于资产所有者来说是如同寻找合适投资（实际上是因子）策略一样的大问题。事实上，公司治理和投资策略是相辅相成的。我在第16章至第18章从因子风险敞口和代理问题的角度，分别对共同基金、对冲基金和私募股权进行了探讨。


    资产管理专业的学生会发现本书不太一样，因为这不是严格意义上的教科书，尽管书中也运用了很多金融课程所涵盖的概念。我希望他们认为本书更为生动有趣，因为本书涉及的理论都与具体的个人、基金或公司直接相关联，而且我也没有假装力求客观。我将本书用于关于基础投资的MBA课程以及一门关于资产管理的高级课程，还辅以课堂演示材料（有比书中更多的数学公式）、大量习题集、案例分析以及嘉宾演讲（最好的部分是案例分析和嘉宾演讲）。本书涵盖的内容十分丰富，难以在一个学期完成讲授，因此如果你是大学教授，我建议你先挑选最为相关的章节进行讲授（如有需求，每章我可以提供一些课程讲义）。每章的内容设计得相对独立，但也有提及其他章节的相关讨论。


    学术界应该会对本书感兴趣，因为书中涵盖了大量的最新文献。本书的重要目标之一就是将学术理论中的相关内容进行提炼用以改进资产管理实践。我无法在书中提及关于相关议题的所有文献，所以选择性地引用了更多年份较远的经典文献和更近期的文献，而介于这之间的参考文献则引用相对略少。我在此对文献引用有所遗漏的学术界同仁表示歉意。


    我由衷地认同公开披露是让资产所有者与委托人利益一致的重要工具。因此，我也在此披露本人从书中提及的下述公司和机构收取了咨询费或酬金：美银美林集团、加拿大退休金计划投资委员会（CPPIB）、Commonfund、欧洲央行（ECB）、美联储纽约分行（FRBNY）、美国联邦储备委员会（Federal
    Reserve Board of Governors）、富达基金、挪威国内养老基金（Folketrygdfondet）、布鲁金斯学会汉密尔顿项目、哈佛大学肯尼迪学院、国际货币基金组织（IMF）、Martingale资产管理公司、摩根斯坦利、挪威财政部、挪威央行，以及世界银行。我从金融行业的其他公司也收取过相关咨询费或酬金，包括资产管理公司、中央银行、商业银行、投资银行和对冲基金。


    本书的相关资料可通过以下网页查询：www.oup.com/us/asset.management。'
