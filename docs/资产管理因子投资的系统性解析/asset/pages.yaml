  md: '回报率和更低的风险呢？当投资者将美国股票和日本股票组合起来时，投资组合的风险会降低，这是因为当一种资产表现不佳时，另一种资产可能表现出色。这就像买保险一样（只是购买保险的人平均来看会亏钱，而分散化投资者平均来看会赚到更多钱）。当美国股票表现相对不佳时，例如在20世纪80年代时，日本股票有可能表现出色。美国股票头寸的部分风险是可避免的，并且可以通过持有日本股票作为保险而抵消掉。


    那么反过来又如何呢？在20世纪90年代，日本股票萎靡不振而美国股票却蓬勃发展。后见之明告诉我们，美国投资者如果只持有美国股票应该会有更佳收益。没错，事后来看的确如此。但是准确预测总是很难。在20世纪90年代初，从事前分析角度看，投资者持有包含美国和日本两国股票的投资组合应该会有更好的收益。但如果角色互换，日本在20世纪90年代初成功统领了世界，美国与日本交换了地位，那么情况又会怎样呢？在1990年持有日本股票分散掉了一部分事前分析得出的风险。


    分散化背后的正式理论由Harry Markowitz（1952）提出，他于1990年被授予诺贝尔奖。具有革命性意义的资本资产定价模型（Capital Asset
    Pricing Model, CAPM）是在均值—方差投资的基础上发展的，我们会在第6章讨论这一模型。CAPM将分散化的概念进一步深化，并衍生得到资产的风险溢价与该资产的（或缺少）分散化优势有关的结论。这就是资产的Beta值。


    从数学角度看，分散化的好处可以用协方差或者相关系数来度量。将投资组合的收益记作$r_p$，投资组合收益的方差可以由以下公式得到：


    ```

    $\text{var}(r_p) = w_{US}^2 \text{var}(r_{US}) + w_{JP}^2 \text{var}(r_{JP}) +
    2w_{US}w_{JP}\text{COV}(r_{US}, r_{JP})$

    $= w_{US}^2 \text{var}(r_{US}) + w_{JP}^2 \text{var}(r_{JP}) + 2w_{US}w_{JP}\rho_{US,JP}\sigma_{US}\sigma_{JP}$

    ```


    $r_{US}$ 表示美国股票收益率，$r_{JP}$ 表示日本股票收益率，$w_{US}$和$w_{JP}$分别表示投资组合中美国股票和日本股票各自的权重。投资组合的权重可以为负数，但加总之和为1，即$w_{US}
    + w_{JP} = 1$，这是由于组合权重之和为100%（这一约束条件称为可容许性条件（admissibility condition））。公式（3.1）第一行中的协方差cov（$r_{US}$，$r_{JP}$）可以等价地表示为美国股票和日本股票的相关系数（$\rho_{US,JP}$）与美国股票和日本股票的波动率（分别是$\sigma_{US}$和$\sigma_{JP}$）的乘积，即有cov（$r_{US}$，$r_{JP}$）$=
    \rho_{US,JP}\sigma_{US}\sigma_{JP}$。


    资产之间的相关性越低，分散化效果越显著。从数学角度来看，公式（3.1）中的低相关系数降低了组合的方差。从经济学角度来看，低相关性意味着当美国股票表现不佳时日本股票更有可能表现较好，即日本股票的保险价值增加。这就可以使'
