  md: '# ### 3.3 随时间而变化的因子敞口


    CAPM模型的发明者之一William Sharpe在1992年建立了一种有效的分析框架，用以处理随时间而变化的基准。他称之为“风格分析”。在我们的讨论中，风格分析是一种因子基准，该基准中的因子敞口都会随时间而变化^(1)。


    我们以如下四只基金来举例说明Sharpe的风格分析中的随时间而变化的因子敞口：


    +   LSVEX：LSV价值型股票基金。LSV是一家“为机构投资者提供积极管理服务的量化价值型股票管理人”，它以其三位创始人学者的名字命名：Josef Lakonishok、Andrei
    Shleifer和Robert Vishny^(2)。

    FMAGX：富达麦哲伦基金。它是世界上最知名的零售共同基金之一，在20世纪八九十年代，它在超级明星基金经理Peter Lynch的管理下业绩突出，声名鹊起。

    GSCGX：高盛资本成长基金。我们怎能漏掉高盛公司的产品呢？

    BRK：伯克希尔·哈撒韦。既然我们此前用过Buffett的例子，这里继续使用。


    我用从2001年1月至2011年12月间的月度数据来进行分析。


    以下是“Fama–French加动量因子”模型的回归结果，我们此处采用固定的因子权重：


    表10.6  |  | LSVEX | FMAGX | GSCGX | BRK |阿尔法 | 0.00% | -0.27% | -0.14% | 0.22%
    | t统计值 | 0.01 | -2.23 | -1.33 | 0.57 | MKT系数 | 0.94 | 1.12 | 1.04 | 0.36 | t统计值
    | 36.9 | 38.6 | 42.2 | 3.77 | SMB系数 | 0.01 | -0.07 | -0.12 | -0.15 | t统计值 | 0.21
    | -1.44 | -3.05 | -0.97 | HML系数 | 0.51 | -0.05 | -0.17 | 0.34 | t统计值 | 14.6 |
    -1.36 | -4.95 | 2.57 | UMD系数 | 0.2 | 0.02 | 0.00 | -0.06 | t统计值 | 1.07 | 1.00
    | -0.17 | -0.77


    ^(1) Ang and Kristensen (2012)指出，如果各因子的系数随时间而变化，甚至阿尔法本身也随时间而变化，那么计算阿尔法的标准误差是比较复杂棘手的。如需了解关于风格分析的总结，参见Ter
    Horst, Nijman and de Roon (2004)。


    ^(2) 参见http://www.lsvasset.com/about/about.html。'
