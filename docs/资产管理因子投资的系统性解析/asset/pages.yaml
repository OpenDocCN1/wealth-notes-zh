  md: '许多动态因子打破了资产类别的边界。价值—成长策略买入有高收益率、价格便宜的证券，卖出收益率较低、价格昂贵的证券。外汇市场中的价值策略是套息：套息策略会做多高利率的货币，做空低利率的货币①。在固定收益市场，买入收益率较高的长期债券，卖出收益率较低的短期债券，这是与久期风险溢价相关的骑乘收益率曲线策略（参见第9章）。在大宗商品市场，购买便宜的远期期货合约，合约价格随着到期日临近而上涨，从而实现正的展期收益（参见第11章）。最后，股票市场的价值—成长策略也就是我们通常所说的价值—成长策略。


    动量策略会超配近期价格上涨的资产，低配价格下跌的资产②。动量效益在股票、固定收益、外汇、房地产和大宗商品（大宗商品市场中追求动量策略的基金类型常被称为CTA）等资产类别内部或资产类别之间以及全球化资产类别中都普遍存在③。类似的，投资者可以在标的资产为股票、固定收益、大宗商品或外汇的期权市场上卖出波动率保护。投资者应该就动量策略或波动率策略是否适合自己做出决定，并采用尽可能便宜的方式通过合适的资产类别来实现。


    # 3.3 加拿大养老金投资委员会


    CPPIB是加拿大养老金的基金管理人，其采用两个简单的因子——股票和债券④。CPPIB持有许多其他资产类别——如私募股权、基础设施和其他听上去诱人的非流动性资产，但CPPIB并不将它们视为资产大类。CPPIB
    透过“私募股权”和其他资产类别的标签，将上述投资视为股票和债券两个因子的组合。


    图14.5-A和B图分别显示了CPPIB的因子投资（被称为“总组合方法”），来源于CPPIB的2013年年报。我们来看A图中的一项私募股权（收购）投资。CPPIB没有对私募股权投资进行单独配置，理论上CPPIB可以将几乎全部的组合头寸都投资于私募股权，只要是在基金的总风险限制范围以内。在这个具体例子中，每投资于私募股权资金的1美元，经济上等同于在公开市场股票投资1.3美元并相应做空部分债券头寸。这笔私募股权投资使用了杠杆，CPPIB是通过负0.3美元的固定收益头寸来实现的。在实践中，CPPIB会运用一种更复杂的匹配程序，按照行业、地区来匹配私募股权投资，并会对公布


    > ① 或许价值—成长因子用股票市场的套息来表述会更好。


    > ② 这是一种横截面策略，其在某个时点持有不同资产的头寸。这不同于时间序列的动量，后者指的是过去有较高历史收益的某种特定资产还会继续上涨的倾向。


