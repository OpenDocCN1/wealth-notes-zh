    Christmas Carol）中，主人公Ebenezer Scrooge做了一个噩梦，梦中他的财富已经萎缩成了“一种美国证券”。他并没有梦见美国国债而是梦见了当时在英国广泛流行的市政债券。


    在19世纪七八十年代，十个州发生了违约事件，包括一些已有过违约历史的州：阿拉巴马州、阿肯色州、佛罗里达州、佐治亚州、路易斯安那州、明尼苏达州、北卡罗来纳州、南卡罗来纳州、田纳西州和弗吉尼亚州。除明尼苏达州以外的其他州均遭受了内战的负面影响，而明尼苏达州破产的原因是未能按期偿付铁路债券。


    1933年，阿肯色州再次违约。作为唯一一个三次违约的州，阿肯色州因此有了不太光景的名声。


    所有这些违约事件中都没有引入破产机制。州政府是宪法规定下的主权实体（尤其是基于宪法第十一条修正案）。更何况，联邦政府并没有介入提供援助。联邦政府在未来会对州政府违约进行干预吗？我十分怀疑这一点。纽约市在1975年几乎发生违约。纽约市以其都市圈的国内生产总值超过了大多数州（还有大多数国家）而享誉盛名。当时的市长Abraham
    Beame呼吁联邦政府和福特总统给予帮助，但遭到拒绝。《每日新闻报》（The Daily News）为此登出过一个精辟的头版头条，“FORD TO CITY：DROP
    DEAD”。联邦政府没有义务为市政债出手救市，也从来没有救过市；在我看来，当下一个州发生违约时（但愿不是阿肯色州的第四次违约），联邦政府也将不会提供救助。


    我认为Whitney有一点是正确的：未来发生的违约事件金额将会高达“数千亿美元”。但是我不相信，大量违约会发生在市政债券市场。地方政府会发生隐性违约（即不是法律层面的违约而是在社会契约层面的违约），即缩减或裁撤提供给居民的各项服务和福利。地方政府会削减公共养老金支出，这有可能被认定为显性违约，它取决于养老金义务在债务等级中的排序。这样的违约情况已有发生，只不过后果不会由市政债券持有人来承担。


    # ### 3.5 对投资者的建议


    我总结了以下几点建议：


    +   1. 总体来说，在其他固定收益市场发挥作用的因子，例如经济增长、通货膨胀、货币政策、波动性等，同样会对市政债券利率产生影响。'
