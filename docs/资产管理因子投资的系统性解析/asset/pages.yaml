  md: '式可以增加投资者福利（参见第17章。免除40法案注册的对冲基金可自由制定管理人的费率）。大多数共同基金不收取业绩费。Elton, Gruber和Blake（2003）研究表明，收取业绩费的少数管理人相对不收取业绩费的同类型基金具有轻微的优势。但是，有业绩费的基金倾向于在表现不好之后增加风险水平。


    40法案除了规定注册投资公司管理人有避免对投资者过度收费的受托责任之外，对于投资管理人收取管理费的费率结构的限制较少<sup>①</sup>。通常，管理费是按投资规模的某一比例进行征收。


    # ### 2.3 仍存在的代理问题


    信息披露虽然是强制进行，但其措辞可能相对晦涩。很少有人投资前阅读招股说明书，这些厚重的招股说明书需要一定能力才能充分理解。虽然公布费率，但很少投资者会留意，AARP（前身是美国退休人员协会）于2011年2月进行的一项调查显示71%的受访者为认为他们并不支付任何费用<sup>②</sup>。


    美国在公布退休资产管理费用方面落后于其他国家。在退休计划中支付给基金的费用中也包含管理人、投资顾问和其他一些费用。共同基金的费用必须披露，但那些为退休储蓄的投资者几乎不清楚他们支付的费用情况，包括他们退休金投资的共同基金的费用情况。在2012年8月30日，对退休储蓄计划有着管辖权的美国劳工部才开始要求提供费用明细给退休计划的参与者<sup>③</sup>。根据投资公司研究所（ICI）的统计，共同基金资产总量为4.7万亿美元，占美国2011年年末17.9万亿美元退休金资产总量的26%。美国家庭持有的缴费确定型养老金计划（defined
    contribution pension plan）中55%的资产投资于共同基金，个人退休账户（IRA）持有的45%的资产也投资于共同基金。


    共同基金的治理比一般公司弱很多<sup>④</sup>。共同基金在法律上独立于推广、出售和管理


