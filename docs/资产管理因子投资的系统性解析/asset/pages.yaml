  md: '“总价格”的一部分，将再投资的股息计算在内）①。平滑化会摊平不同时期的多个冲击，但它仍会将所有冲击都计算在内。在图13.1中，我们可以看到由于低频取样导致第一个和最后一个观测值没有变化，因此去平滑化仅会改变对波动率的估计。


    # （2）如果观测收益率不相关，那么去平滑化不会产生影响


    在许多情况下，公布的非流动性资产收益率是自相关的，这是因为非流动性资产价值是通过评估得出的。评估过程会导致数据平滑化。因为评估人员正如他们所应该做的，采用了与历史评估价值（是估计价值或认知价值）相关的最新和最可比售价（交易售价）。这种来自评估过程中人为的平滑促使人们在房地产领域构建纯粹基于交易的指数，而非基于评估的指数②。一些更不可靠的主观估值过程也会导致自相关性——如管理人不愿意在市场下行时进行逐日盯市。


    许多情况下，我们预期非流动性资产的真实收益率也是自相关的④。非流动性资产市场——例如房地产、私募股权、林业种植业和基础设施——这些市场的信息不是所有市场参与者都能获取，信息不会迅速扩散，而且资本不会立即配置到新的投资中。信息无效率的市场伴随着缓慢的资金流动使得非流动性资产市场呈现出稳定收益的特征④。


    # （3）去平滑化是门艺术


    公式（13.1）和公式（13.2）中的去平滑化示例采用了最简单的自相关流程，即AR（1），来描述公布的收益率。许多非流动性资产存在超过一阶的滞后效应。例如，房地产季度数据有着众所周知的四阶滞后效应，因为许多房产都是每年才被重新评估一次⑤。一个好的去平滑化过程会采用与公布的收益率数据拟合良好的时间序列


    ① 技术上讲，对公式（13.2）左右两边取均值会导致大样本下有相同的平均值。


    ② 该文献包含重复销售方法论（参见Goetzmann（1992））和只运用交易数据的指数构建（参见Gitzlaff and Geltner（1998）和Fisher,
    Geltner and Pollakowski（2007））。指数构建时，上述一些方法会根据具体房产的不同特征进行相应调整，比如出售的是公寓还是别墅，离水源是远还是近，或者房子是一层还是两层。这些被称为“用户体验调整”。这些方法适用于在其他非流动性市场上构建指数，比如艺术品（Goetzmann（1993）和Moses
    and Mei（2002），邮票（Dimson and Spencers（2011）和红酒（Krasker（1979）和Masset and Weisskopf（2010））。非流动性收益指数构建的汇总过程会导致数据进一步平滑。指数合并了许多价值的单个含义，如市场交易价值或评估价值，并且这些价值通常在一年不同的时点被评估。需要注意的是，假如$\phi=0$，那么公式（2）和（3）重合且非平滑化的收益与公布的收益一致。图13.1显示的低频观测值的影响是由同比自相关系数0.4造成的。


    ③ 当真实收益存在自相关时，投资期限会对波动率、相关性和夏普比率产生重要影响。从第一期来看，平均值不受影响。参见Lo（2002）关于不同投资期的风险度量公式如何转化。


    ④ 参见Duffie（2010）和Duffie and Strelowicz（2012）。


    ⑤ 参见Geltner（1991）和Ross and Zisler（1991）的开创性论文。'
