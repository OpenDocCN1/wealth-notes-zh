    投资者也应该警惕对冲基金指数。因为对冲基金指数一般是不可投资的（not investable），一般投资者并不能获得指数收益。在对冲基金业，并没有等同于标普500指数基金那种能够以较低成本复制整个股票市场的产品。投资者也不能投资大多数指数中的所有基金。一些基金已经关闭，一些有很高的投资门槛，此外对冲基金数量庞大。另外受流动性限制，投资者一般不能在基金退出指数时成功赎回该基金。因为投资者不能持有对冲基金指数中的所有基金，他们投资对冲基金时将面临相对于指数而言更多的个别风险（idiosyncratic
    risk）、指数比投资者更能分散风险¹。本章中使用对冲基金指数收益，但读者应该知道，指数一般美化了真实的收益情况。


    因为对冲基金自愿报告收益，所以也存在其他一些偏差。Agarwal，Daniel和Naik（2011）发现圣诞老人善待了对冲基金：12月的平均回报率高于1月至11月1.3%。对冲基金在一年中的前些时候少报收益并将来年一月的部分收益提前计入12月，为何对冲基金虚增12月的收益？因为对冲基金按照截至每年12月末的收益进行收费。Bollen和Pool（2009）发现，月度收益为正的月份数量多于收益为负的月份（由于对冲基金标榜自己是绝对收益策略，所以“零”收益这条分界线对于对冲基金来说很重要）。如果以两个月为间隔来度量其收益，这个扭曲就消失了，表明了为了避免报告损失，部分月收益是虚增的。当对冲基金积累了一系列良好的收益之后，这些虚增的收益就被逆转。


    对冲基金普遍存在修订过去数据的现象。Pattison，Ramadorai和Sneathfield（2013）称在2007～2011年，在其样本中的12128支对冲基金有一半修订过先前报告的收益。1/5的对冲基金修订收益率超过1.0%，该数字相对于0.6%的平均月收益幅度很大。对于（额度较大的）投资者来说避免数据修订的最佳方式是使用独立管理账户（separately
