  md: '# 买年金呢①？


    # （1）信用风险


    一旦你购买了年金产品，就会面临出售年金的保险公司的信用风险。对消费者而言，不幸的是现在很多保险公司都不像以前那样保守地投资了。在2011年，保险公司Liberty
    Life Insurance Co.被Athene Holding Ltd公司收购，Athene是由私募股权投资公司Apollo Global Management出资成立。在被Athene收购之前，Liberty
    Life持有的资产组合“非常干净”，包含政府（市政）债券和高信用评级公司债。但被收购之后，Liberty Life的产品背后则投向了证券化次级住房抵押贷款、分时共享度假屋以及哈萨克斯坦的一个铁路项目。“如果投资成功，所有上行回报都归于Athene，但如果失败的话所有下行风险都会由年金持有者承担。”Liberty
    Life的前债券组合经理说②。这种现象在被私募股权投资公司和投资银行（包括Apollo，Goldman Sachs，Harbinger以及Guggenheim）所收购的保险公司中一再重现。


    如果一家保险公司倒闭的话，其年金产品会受到保护，但这个保护是有上限的，而且不同州的最大保护额度各不相同。在我的家乡纽约州，上限是500000美元，这可能远低于本书平均读者所购买的年金价值。在加利福尼亚州，上限是250000美元。消费者可通过选择评级最高的保险公司来最小化这种风险，但仍不能保证年金无风险。AIG曾一直被认为是家安全的保险公司，直到2008年9月它被降级，如果不是后来联邦政府出手相救它就已经破产倒闭了，这在当时是美国历史上对私营公司最大的一次紧急援助。个人可以通过在几家保险公司购买年金来分散这种风险，但让退休者去购买哪怕一个年金产品都很困难。部分原因在于下文。


    # （2）年金产品很复杂


    有确定年金（certain annuities），期末付年金（immediate annuities），递延年

    金（deferred annuities），变额和指数型年金（variable and indexed annuities），投

    资连结型年金（investment-linked annuities），联合和生存者年金（joint and survivor

    annuities），固定担保（fixed guarantees），或有担保（contingent guarantees），有亏


    ① 上述所有考虑都同样存在于长期护理保险产品（long-term care insurance product）中，除了有时保险公司实际上对该保险产品定价过低。参见Brown
    and Finkelstein（2011）。年金市场和长期护理保险的一个区别是，社会保险的经济状况审查成为为私人市场提供长期护理保险的障碍物（是一种隐性税收）。参见Pauly（1990）以及Brown
    and Finkelstein（2007）。


    ② 引用和更多细节来自Milder，Z. R.，“Apollo-to-Goldman Embracing Insurers Spurs State Concerns”，Bloomberg，2013年4月22日。'
