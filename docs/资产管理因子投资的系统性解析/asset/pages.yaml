  md: '组合或者最大夏普比率组合来衡量——这两种概念对于那些从富时指数的行业中进行选择的投资者来说是相关的。我没有考虑相对于整体富时指数的跟踪误差以及事后的收益率差异（这对于那些需要跟踪富时指数的投资者来说是相关的）。


    剔除股票的代价极其微小，并不是因为投资组合中未持有被剔除的行业。在整体指数范围中，最大夏普比率组合中烟草业占比1.53%，航空航天及国防业占比1.19%，银行业占比9.52%。从分散化优势损失的角度来看，即使剔除占比约10%的银行业，影响也可忽略不计。


