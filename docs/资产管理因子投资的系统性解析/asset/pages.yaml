    # 2.4 预期效用


    预期效用将结果发生的概率（这些事件是否经常发生？）与投资者是如何看待结 果（这些对我来说是不是景气时期吗？）结合起来：


    ```

    $$U=E\left[U(W)\right]=\sum_s p_s U(W_s)$$


    公式(2.2)

    ```


    在公式(2.2)中，下标s表示结果s发生，所以预期效用即是发生概率$\underline{p}_s$乘以该事 件在该状态下的效用$U(W_s)$。从技术层面，我们认为预期效用涉及对概率和结果的
    可分离转换。概率是用于衡量不景气时期出现的频率，结果转换则是用于衡量投资者 对不景气时期的感受


    预期效用概念的提出可以追溯到18世纪的数学家Gabriel Cramer和Daniel Bernoulli。 而普遍将其作为决策工具来应用，则是在John
    von Neumann和Oskar Morgenstern于1944 年发表《博弈论和经济行为学》（The Theory of Games and Economic
    Behavior）将预期 效用规范化之后。Von Neumann是现代最伟大的数学家之一，他在物理学和计算机科学 上也做出了开创性的贡献。他和经济学家Morgenstern开创了经济学的新领域——
    博弈论。博弈论研究参与者应该如何制定策略来互相竞争与合作，囚徒困境便是著 名的例子。Von Neumann和Morgenstern最初将预期效用应用于靠碰运气取胜的游戏；
    预期效用理论只是博弈论整体理论的一个附属品。股票市场是一个靠碰运气取胜的游 戏——但不同于扑克，股票市场的概率空间是未知的。作为该理论的重要扩展，Savage
    (1954)指出当概率不是给定的，而是主观的、源自于参与者行为时，预期效用函数 仍然适用。因此，公式(2.2)中的概率既可以是客观也可以是主观的⁽¹⁾。


    ⁽¹⁾ 参见Schumaker (1982)中关于预期效用模型及其变型的总结。'
