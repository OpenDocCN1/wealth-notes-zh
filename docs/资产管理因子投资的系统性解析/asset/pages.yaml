  md: '者而言是不景气的时期对我来说并非真正的不景气。因此，我具有相对优势来持有价值股，并能够获取价值溢价。其他投资者则不愿意持有价值股（而是持有成长股），因为他们无法承受价值股在不景气时期带来的损失。总的来说，尽管有的投资者偏好价值股，有的投资者偏好成长股，但平均投资者仍持有市场组合。你是属于哪种类型——偏好价值股还是成长股——取决于上述不景气时期你的行为。


    # 3.5 价值溢价的行为学解释


    价值溢价的行为学解释大多集中在投资者对近期新闻事件的过度反应（overreaction）或过度外推（overextrapolation）。这一解释最早由Lakonishok，Shleifer和Vishny（1994）提出。投资者往往会将过去的增长率过度外推至未来的增长率。我撰写本书时最好的成长股例子是苹果公司（Apple
    Inc），其过去几年因为推出一系列消费者认为必须拥有的产品而获得惊人的增长。投资者误将苹果公司过去的高增长视为未来的高增长。成长型公司通常具有较高的增长率。这些公司的价格会不断被抬高，反映了人们过度乐观的情绪。而当增长率不再显著时，股票价格下跌，导致成长股收益低于价值股。行为学解释不像之前提到的理性解释，不是说价值股从根本上比成长股的风险更高：价值股之所以便宜是因为投资者低估了其成长前景。相反，成长股比较贵则是因为投资者高估了其成长前景。


    价值效应也可由投资者的其他心理偏差产生。Barberis和Huang（2001）通过运用两大心理偏差来生成价值效应：损失厌恶（loss aversion）和心理账户（mental
    accounting）。我们曾在第2章对损失厌恶有所介绍。由于投资者承受损失的痛苦程度高于其获得同等收益的欢喜程度，一个损失接着一个损失所带来的痛苦程度高于单个损失。至于心理账户，是指投资者单独看待每只股票，而不是考虑其总组合的获利或损失。Barberis-Huang对价值股的解释是，高账面市值比股票是由于之前业绩不好所以价格才相对便宜。这导致投资者认为价值股的风险性更高，因此在持有价值股时要求获得更高的平均收益。


    行为学模型提出的关键问题是：为什么没有越来越多的投资者购买价值股，从而推升价值股价格并最终消除价值溢价，正如投资者对规模溢价所做的那样（至少根据Grossman-Stiglitz的解释）？换言之，为什么没有更多的价值投资者？这绝非投资者的疏忽，因为Graham和Dodd的观点从20世纪30年代以来就已广泛传播，正如价值投资大师沃伦·巴菲特（Warren
    Buffett）主持的伯克希尔·哈撒韦公司（Berkshire Hathaway）年会或者是哥伦比亚商学院的Graham & Dodd早餐会上参会者的热情洋溢所'
