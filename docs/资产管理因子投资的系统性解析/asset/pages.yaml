  md: '是在横截面上将表现优异的一组股票与表现欠佳的一组股票进行对比，而不是在一段时期观察单个股票。优胜者和失败者都是相对的——单个股票相对其他股票而言是表现优异或表现不佳，而市场作为一个整体则可能上涨也可能下跌。


    动量收益远远高于规模或价值收益。图7.6展示了从1965年1月至2011年12月间 $SMB$、$HML$ 和 $WML$ 各自的累计收益，结果显而易见：动量策略的累计利润比规模和价值策略的累计利润高出了一个量级。动量效应也存在于各资产类别中：我们观察到国际股票、大宗商品、政府债、公司债、行业和板块以及房地产中均存在动量效应
    $^{①}$。在大宗商品中，动量因子与大宗商品交易基金走势一致。动量策略也被称为“趋势”投资，正如业界所说的“趋势是朋友”。


