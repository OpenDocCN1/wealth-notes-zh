- pgno: 522
  md: '将在下文作出解释。


    从财务顾问的角度看，基于AUM的费用模式的劣势之一是使得财务顾问的收入很大程度上受到市场变幻莫测的影响。按照因子理论的说法，因子选择应该是客户的决策而非财务顾问的决策。而财务顾问获得的薪酬仍是基于不受其控制的因子风险函数。


    净资产和收入的一定比例： 这类似于基于AUM的费用模式，只不过它允许财务顾问对一个（通常）更大得多的值收取比例费用。对财务顾问的好处是，这使得他能对那些正常情况下不满足最低AUM条件的客户收取费用。因此，该模式拓展了可供服务的新客户，但对于客户来说这具有与基于AUM的费用模式同样的缺点，即投资者为什么会愿意为你没有付出的时间付费呢？


    固定费用：代理理论指出，固定费用应设得足够高以吸引最好的财务顾问。该模式对客户来说是个有吸引力的选择，但缺点是没有可以促进努力的激励费用。也就是说，客户可能能够吸引来最好的财务顾问，但由于没有激励费用，全世界最好的财务顾问可能是在打高尔夫而不是在为你工作。然而，只要固定费用设得足够高以满足参与约束，这种模式可能是最优的，我将在下文作出解释。


    小时费用： 这种模式比较少见，但它确实是按代理人实际付出的努力来支付报酬。这使得财务顾问的薪酬更像律师费。一般的“低成本”小时费是300美元①。


    基于相对于基准的超额收益付费： 这种模式也比较少见，但越来越受到欢迎。这正是代理理论所提倡的激励费用。它会受到无关性结果的影响。你需要有正确的基准，而在线性契约为正确的基准本身还不够。因此3.3节和3.4节的所有结论在这里都同样适用。然而，我建议这种模式仍只作为顾问薪酬的一小部分，原因如下。


    财务顾问承担着很多种任务，包括他们自己也经常要在进一步的委托代理资产管理问题中担任委托人。此外，他们还担任治疗师、法律和税务顾问、家庭顾问和调解人。许多财务规划师认为，这些角色事实上比真正管理客户组合还更重要（我在第4章的论述支持这点）。即便是再平衡这一行为，它既是一个经济学决策，也同样是一个心理学决策）。


    财务顾问的多维度角色是即机构投资者中大部分委托基金管理人（包括我在第17章和18章分别讨论的对冲基金和私募股权管理人）都不具备的，这让财务顾问的薪酬较为特殊。我同意Holmstrom和Milgrom（1991）的建议，即机构投资者中常见的激励费用不应成为财务顾问薪酬结构中的主要部分。Holmstrom和Milgrom指出，当代代理人有多项不同任务要执行时——正如财务顾问所做的——那么激励代理人在一项任务上表现良好会分散他在其他任务上的注意力。代理人会将时间或努力不成比例地集'
  merge: -1
  img_proc: true
- pgno: 523
  md: '中到那些报酬较好的任务上。当代理人被要求执行多项任务时，或者任务不容易被衡量时，最优的激励契约接近于不含任何激励契约的固定工资模式。Holmstrom和Milgrom认为，这正是为什么在许多情况下我们并未看到激励薪酬或只看到很少的激励薪酬。对于个人投资者，财务顾问提供的是难以衡量的多维度服务，所以财务顾问的薪酬刚好符合Holmstrom和Milgrom所说的类型。财务顾问的薪酬中只有很小一部分应该该基于激励机制。


    与此同时，基于AUM的费用或是按净资产和收入一定比例收取的费用都有许多缺点。对于小的散户投资者，我的建议是找到一个收取固定费用或小小时费用的财务顾问（这种财务顾问的数量正在不断上升）。确保你支付足够多的报酬，以使最好的财务顾问来为你工作。对那些固定费用并不涵盖的服务，再支付额外费用。


    然而，基准仍然非常重要。基准使得投资者能看到财务顾问增加了哪些价值，即使顾问所收到的相对于基准的激励报酬很少。使用的基准应该是投资者自己也能在没有顾问的情况下以低成本进行投资的标的，例如：指数基金的简单组合，一个“标准”目标日期基金（“default”
    target-date fund）（尽管这有许多缺点；参见第5章），或者对更成熟的投资者来说，一个简单的因子组合（参见第14章）。其实，大部分财务建议都导致客户的业绩落后于简单基准：在俄勒冈大学系统（Oregon
    University System）的研究中，Chalmers和Reuter（2012b）发现，使用经纪人的投资者其业绩落后于没有使用经纪人的投资者1.5%以上。客户支付的经纪人费用占了0.9%，剩余部分则是由于经纪人推荐了风险更高的组合，那些组合中塞满了费用昂贵、表现还不如简单基准的产品。当顾问给出好的建议时，你应该支付较好的薪酬，但想要识别出好的建议，你需要一个透明且较难战胜的基准。


    # 3.6 小结


    在资产管理中，代理关系往往有多样性。例如，咨询顾问的角色经常会导致另一系列的代理问题，而不是解决资产所有者与基金管理人之间现有的问题。解决一个代理关系可能会加重另一个代理关系的问题。


    我提供几条建议：


    +   ①采用传统的静态（类似于标普500）基准的线性契约本身用处不大，而且在最糟糕的情况下会导致管理人破坏组合价值。（这是无关性结果。）'
  merge: -1
  img_proc: true
- pgno: 524
  md: '+   ②更有效的基准，尤其是因子基准，运用在线性契约中会减轻代理问题。

    ③非线性、类期权的薪酬契约能最优化地激励基金管理人。

    ④限制条件在契约中起到重要作用，对更有才能的基金管理人可以设置更少的限制条件。

    ⑤披露至关重要：最优契约应该尽可能地透明。

    ⑥基于AUM来对个人投资者收取1%的费用（或对机构投资者收取50个基点的费用）实在过高。应该最小化基于AUM的费用支付。

    ⑦财务顾问的激励费用应该只是其总薪酬的一小部分。散户投资者应该支付固定费用或按小时付费。

    ⑧采用由指数基金构成的一个简单、固定的组合作为财务顾问的基准。


    # 4. 董事会


    如同在公司架构中一样，很多委托人通常是由董事会来代表。长期以来，董事会被认为是⼀种可以减少代理人的机会主义的良好监督机制。公司财务领域有许多文献从理论和实证⽅⾯都强调了董事会中独⽴董事的重要性⑴。有效的董事会能够维护委托⼈利益。通过监督和诠释相关信息，董事会能减轻委托代理问题⑵。


    尽管董事会本身就是他们所代表群体的代理⼈，比如受益⼈、家族办公室的家族成员、整个国家（对主权财富基金来说），本节我将集中讨论作为委托⼈的董事会及其在与作为代理⼈的基金管理⼈的关系中所扮演的角色。


    本节我将重点关注NYSCR F所关心的问题。1979 ~ 1993年间担任审计长的Edward Regan曾试图将NYSCR F的治理结构改为董事会形式，并尝试通过改革将他自己从唯⼀受托⼈的角色中解放出来。他回忆说：


    > 在20世纪80年代，当我是审计⻓时，我提议了⼀项⽴法以呼呼为该养老基金建⽴⼀个由投资专家组成的⼩型董事会，来代表当地政府以及在职的和退休的州政府员⼯。然而，该法案在被引⼊的⼏周之内就⾯临要被修订，意⻅是将更多的


    ⑴ 参见Fama and Jensen (1983) 以及Hermalin and Weisbach (2003) 的总结。

    ⑵ 监督和限制是相互替代品。Almazan et al. (2004) 发现，当董事会不够独⽴时，共同基金更有可能受到投资限制。'
