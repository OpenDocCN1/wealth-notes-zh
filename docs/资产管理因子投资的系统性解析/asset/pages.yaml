  md: '关闭或合并业绩表现不佳的基金让Janus的营销团队可以板着脸说：“100%的Janus股票基金自成立开始打败了业绩基准。”①幸存者偏差即是指那些最差的基金，例如Janus
    Worldwide，有通过合并或者解散消失的趋势。结果是，通过不报告已经安乐死的基金的情况，汇报业绩的基金展现出来的是过于美好的画面。


    幸存者偏差有多大？


    所有的40法案基金必须向美国证券交易委员会汇报业绩，因此我们可以观察到整个基金领域。我们通过比较存活基金（例如Janus Global Research）的回报和死亡或合并的基金（例如Janus
    Worldwide）之间的差距来衡量幸存者偏差的影响。当Mark Carhart还是芝加哥大学的一名博士生时，他建立了第一个没有幸存者偏差的大型共同基金数据库。他的数据集随后被逐步更新和改进，并被广泛使用。Carhart毕业于1995年，开始在南加州大学担任金融学教授，不久之后加入了高盛资产管理公司。他最终在2000年代中期联席管理了最大的量化对冲基金之一（该基金在金融危机之后解散，参见第17章）。


    相对既有存活也有死亡的基金数据，仅使用存活基金的数据会将共同基金的收益率高估1%至2%②。但存活基金和不再存续基金之间的业绩差异约为4%。Carhart等（2002）估计存活基金和未存活基金之间风险调整后的收益差为3.7%；Malkiel和Saha（2005）研究表明存活基金和死亡基金的收益差距为4.3%。不幸的是，共同基金管理公司对投资者只强调存续基金的收益。细心的学者总是使用类似Carhart建立的包含存活基金和死亡基金的数据库；去除死亡的基金之后，共同基金的业绩被大幅夸大。


