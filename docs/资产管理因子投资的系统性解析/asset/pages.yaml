- pgno: 62
  md: '我们将效用定义为财富（$W$）的函数，因此不景气时期是指我们贫穷的时候（为便于表示，我们记为$U$（$W$），其中效用$U$是财富$W$的函数）。投资者的效用并不是财富本身——效用是将财富转化为投资者对于财富的主观价值判断。图2.3展示了三种常用的关于财富的效用函数：指数效用函数、对数效用函数和常数相对风险规避系数效用函数（CRRA），CRRA也被称为幂次效用函数（Power
    Utility）。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_62_0.png)


    图2.3 多种效用函数


    我有意省略了x轴和y轴的单位。这些效用函数是排序性（Ordinal）的，因此效用的实际数值并没有意义。数值仅表示排序：我们可以用效用函数$\alpha +
    \beta U$来代替效用函数$U$，而不改变偏好排序，其中$\alpha$和$\beta$是任意正的常数（也就是说，在仿射变换（Affine Transformations）下效用的排序不变）。


    图2.3中所有的效用函数均随财富增加而增加，这真实地反映了资产所有者通常都是贪婪的这一事实。此外，效用函数均是财富的凹函数（Concave）。凹性用来衡量投资者对每增加1美元财富有多看重。当投资者还贫穷时，其位于图2.3中靠近y轴的位置，所有曲线的斜率都很陡：当你只有1美元时，从1美元增加到2美元对你非常重要。而当财富很多时，效用曲线变平：当你已经有1000万美元时，财富从10,000,000美元变为10,000,001美元时，边际效用几乎为零。效用曲线显示了财富的边际效用递减。这是凹效用函数的重要特性。


    效用函数的斜率（随财富增加而变化的边际效用）是我们衡量投资者感觉有多好或有多坏的方式。财富减少时效用下降非常快的函数，代表那些对损失非常敏感的投'
