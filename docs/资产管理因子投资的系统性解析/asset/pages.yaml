  md: '市场股票；在机构投资者开始投资私募股权大约30年后，Kaplan和Schoar（2005）首次记述了这一事实。


    私募股权的整体收益率具有很强的顺周期性。给定年份的已投资本与当年的收益率之间呈负相关<sup>①</sup>。Philippou（2011）发现在每个投资年份募集基金的数量与IRR以及倍数这些衡量业绩的指标之间呈现较大的负相关性。这并不奇怪：并购基金的退出往往取决于公开市场的热度。首次公开发行的数量呈现波浪形，其在市场最高位时达到峰值。并购活动也同样具有很强的顺周期性<sup>②</sup>。


    # 私募股权收益率的偏差


    学术研究对PE数据中存在的两个严重偏差加以考虑：①基金或公司价值的不频繁观测值和②选择偏差<sup>③</sup>。后者指的是那些更成功的公司或者基金在数据中有被过分代表的趋势，导致PE投资收益率看上去比实际上的更好。交易只有在被投资公司估值高时才能被观测到——只有当公司运转良好并获得下一轮融资时，只有当公司估值高且公司会IPO时等——那些业绩不好的公司（僵尸企业）经常会被当作壳公司而苟延残喘，不会有市场估值。


    对僵尸公司的估值往往被写入PE合同中，表述如“投资将以成本估值除非有重大变化证明需要采用不同的估值方法。”<sup>④</sup>正如一位估值专家所说：“基金管理人……存在明显动机，继续持有投资前景不佳的投资，只不过是为了从中得到更多的基金管理费。”<sup>⑤</sup>根据咨询公司
    TorreyCove Capital Partners的调查结果，僵尸公司在PE投资中占比超过5%以上。由PE投资公司 Colter Capital开展的另一项调查显示，在2011年有57%的北美LP在他们的投资组合中持有僵尸基金<sup>⑥</sup>。


    学术界在解决由低频抽样和选择造成的偏差上主要采用两种方法，但这两种方法都有缺陷。第一，我们可以检查单个被投资公司层面的信息。这能提供更多数据，所以会有实际的收益率（不同公司的时间间隔不规则），但选择偏差是一个主要问题。


    +   ① Kaplan和Stromberg（2009）和Kaplan和Lerner（2010）分别记述了并购基金和凤投基金的这种影响。也可参见Gompers和Lerner（2000）和Axelsson
    et al.（2012）的研究。

    ② 相关的文献很多。参见Rhodes-Kropf、Robinson、和Vishwanathan（2015）关于兼并购趋势和Ritter and Welch（2012）关于IPO趋势的研究。Robinson
    and Sengoy（2011h）和Philippou（2011）则对并购基金和凤投的周期性进行了阐述。

    ③ 学术研究里也有报告和幸存者偏差。表现较好的基金更有可能掩盖他们的业绩。Philippou and Zolla（2005）指出将选择偏差纳入考虑会导致IRR少减少约3%。第13章详细描述了这些偏差。

    ④ 参见Philippou（2009）。

    ⑤ 报价和评价来自于Pulliam, S. and J. Eaglesham, “Investor Hazard: Zombie Funds”，华尔街日报（2012年5月31日）。

    ⑥ Caller Capital. Global Private Equity Barometer. Winter. 2011−2−12.'
