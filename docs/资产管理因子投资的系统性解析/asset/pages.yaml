- pgno: 463
  md: '遭受重创，非流动性风险策略相应遭受重大损失。投资者寻求安全性，所以风险债券暴跌，信用利差迅速上扬。波动率“直上云霄”，这对购买了波动率保护的投资者有利，但提供波动率保护的投资者则损失惨重。金融公司受创时，动量策略投资者做
    空了金融公司，导致在2009年春天当紧急救助和低息贷款的浪潮抬升了金融公司股价 时，动量策略组合大幅下跌。


    正是因为因子在不景气时期会短暂地亏损，所以其会在长期对投资者所承担的因 子风险敞口给予补偿。因子溢价是对投资者在不景气时期忍受损失的补偿。


    # 因子在大型组合中起主导作用


    在大型组合中，很难找到与因子不相关的超额收益。许多错误定价的机会（或称 为阿尔法，参见第10章）并不具备规模性——我们可以预期，非有效性带来的投资机 会存在于流动性欠佳或信息并非自由获取的市场中。由于很难找到真正独立的组合策
    略，管理人的决策往往具有相关性，无论是内部管理人还是外部管理人的决策。大型 投资者持有成千上万只证券，其对具体证券的决策往往会在组合层面被宏观经济和因 子风险所淹没。这不是说大规模的证券选择不可能，但对于越大的组合来说通常难度越
    大。举例来说，一位农民很可能擅长挑选出有最好土壤和种植条件的农场（农场相当于 证券选择），但如果遭遇严重干旱，即使选出最好的农场也无济于事（雨水是因子）。


    管理人所做的成千上万个相关的单个决策会有效地成为对因子的大的决策。一 位股票管理人做$1000$只价值股并低配$1000$只成长股，这并不是$1000$次单独的决策，
    而是基于价值—成长因子的一个大的决策。一位固定收益管理人通过做$1000$只流动 性好的债券（通过回购市场）并相应做多$1000$只流动性相对较差的债券来赚取更高收
    益，这其实是基于非流动性因子的一个大的决策。


