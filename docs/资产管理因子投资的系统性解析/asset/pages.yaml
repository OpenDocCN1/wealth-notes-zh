  md: '条期间，那时政策制定者对资产价格也有重要影响。在非常时期，动量投资似乎反映了货币政策和政府方面的风险。这些时期同时也是市场高波动率时期。


    其他还有什么因素能解释动量效应呢？文献中一些具有说服力的建议指出，至少有部分动量获利是与宏观因子相关的。比如，动量策略的获利在不同经济周期会有所变化，取决于股票市场状态，同时也与流动性相关^{1}。在动量的理性解释中（相关文献还远未达到非常充实的地步），资产所有者应该检验当面临前述不同来源的宏观风险时，他们会做何反应。


    被最为广泛引用的理论是从行为学来解释。在主流行为学理论中，投资者对信息的解读或反应有所不同，这种偏差会导致动量效应的产生。假设有关于某股票的好消息出炉，动量可通过两种方式产生。第一，投资者对此消息有延迟的过度反应，这会导致股票价格持续上升；第二，投资者对此消息反应不足，价格在一开始上涨，但没
    能上涨到好消息实际应该带动股票上涨的点位，而后期投资者意识到之后会推动股票再次上涨。因此，行为学解释可划分为两大阵营：动量是种过度反应现象，或者动量 是种反应不足现象。要区分这两大阵营颇有难度，学术界也深感困惑^{2}。


    经典的过度反应模型当属Barberis, Shleifer和Vishny（1998）和Daniel, Hirshleifer 和Subrahmanyam（1998）的研究。Barberis,
    Shleifer和Vishny（1998）所描述的投资者 有保守主义偏差，由于他们固执地坚持旧信念从而导致他们对信息过度反应。这会造 成动量效应。在Daniel,
    Hirshleifer和Subrahmanyam（1998）的模型中，投资者也会由 于心理偏差而导致动量效应。在该模型中，投资者过度自信且过高估计其预测公司未
    来现金流的能力。他们还有自我归因偏差：即当他们成功时，他们认为这是由于自己 高超的技能；而当他们不成功时，他们认为这是因为运气不佳。消息灵通、过度自信 的投资者（比如散户和过度自信的对冲基金管理人）观察到某些表现良好股票的积极
    信号，他们将好的业绩归因于自己的技能，导致进一步过度自信。由于自信心不 断膨胀，他们容易过度反应而将股票价格抬升至其基本面价值之上，从而带来动量 效应。


    关于反应不足理论的标准参考文献是Hong和Stein（2000），Hong和Stein的研究 依赖于拥有有限信息的“有限理性”投资者。Hong和Stein模型中的动量效应是由“新
    闻观察员”造成的，新闻观察员会接收关于公司价值的信号但会忽略历史价格中的信 息。其他投资者仅依据历史价格信号进行交易，而忽略基本面信息。新闻观察员所接


    ① 分别参见 Chordia and Shivakumar (2002), Cooper, Gutierrez and Hameed (2004) 和 Pastor
    and Stambaugh (2003) 的研究。


    ② 可参见Jegadeesh and Titman (2001)。'
