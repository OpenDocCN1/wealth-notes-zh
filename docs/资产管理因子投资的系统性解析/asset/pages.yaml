    Ang等人强调的另一个问题是格林斯潘看跌期权（Greenspan Put，在他卸任后则是伯南克看跌期权，Bernanke Put），即当经济面临负面的外部冲击时，美联储总是会开闸放水，为市场注入流动性。这种做法在批评家眼里相当于是拯救那些总是做出冒险决策的投资者，并且会激励他们不计后果地去冒更大的风险。包括John
    Taylor在内的评论者认为，美联储在“911”恐怖袭击事件及随后的经济萧条时期让短期利率在过低水平维持了过长时间 (1) 。摘自Ang等人（2011）研究中的图9.6显示了2001年以后短期利率的路径（实线），与之对照的是，如果美联储按照应对2000年产出和通货膨胀的方式应当设定的短期利率（虚线）。实线（真实数据）和虚线（与事实相反）之间的利差即可看作是对格林斯潘看跌期权的量化测度。如果美联储没有改变其应对通货膨胀的方式，那么2002~2005年间的短期利率应该明显更高。例如，短期利率在2003年6月降至0.9%，而如响应方式不改变，短期利率应该为2.7%。图9.6的下半部分展示的是五年期债券的收益差，实线和虚线分别为真实收益率差以及如果美联储并未实行宽松政策时应有的利差。这两条线非常相似，因此，格林斯潘看跌期权


