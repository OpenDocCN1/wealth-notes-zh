  md: '资。Philipou（2008）发现约有一半的并购投资公司是将各基金先归集到一起，然后再计算整体IRR；而不是首先计算每个基金的IRR，然后再根据各基金的权重来计算所有基金的加权平均IRR。甚至有些LPs也采用这种汇总策略来使得他们的PE投资业绩看起来更好$^{①}$。


    即使IRR的数值为正，也并不意味着资产所有者的投资业绩较好，因为其承担的风险——被投资公司的潜在风险，以及非流动性、高费用、LP与GP之间严重的代理问题等风险。Sorensen,
    Wang和Yang（2012）开发了一个模型，从LP的角度将所有这些风险都考虑在内。如果被投资公司的贝塔为0.5，那么对应愿意承担低到中等风险的资产所有者的合适盈亏平衡IRR应在13%~17%之间。如果被投资公司的贝塔为1.0，即与市场组合的贝塔一致，那么IRR的盈亏平衡应在17%~19%。图18.2显示并购投资基金的平均IRR为16%，所以适度规避风险的投资者仅达到了盈亏平衡。而且自2004年起，并购投资基金就没有为投资者创造价值。


    # 3.2 倍数


    投入资本总值倍数的计算公式为LPs的总资本回报（扣除费用后的净值）除以总资本本承诺额或已投资额（包括费用）。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_611_0.png)


    倍数要比IRR难以被操控，但同样是没有意义的。


    图18.3展示了由Harris, Jenkins和Kaplan（2012）整理的并购投资基金和风险投资基金的倍数。像IRR衡量指标一样，倍数显示出与IRR相似的随时间而发生较大波动（并购投资基金和风险投资基金的倍数与内部收益率之间的相关性分别为77%和85%）。在20世纪80年代，并购投资基金和风险投资基金的倍数大多超过2.0，且风险投资基金倍数在20世纪90年代中期高达6.5，并从21世纪初以来持续低迷。自1999年开始，风险投资基金的倍数略高于1.0，2006年以来并购投资基金的倍数约为1.0。


    ① Philipou（2011）为CalPERS准备的文件。CalPERS是美国最大的公共养老基金。'
