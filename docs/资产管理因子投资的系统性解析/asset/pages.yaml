- pgno: 349
  md: '间的正相关性确实存在。


    Fama和French在1992年写的一篇重要论文直击CAPM理论的核心。他们的主要结论是发现规模和价值效应主导了单只股票的贝塔值，并且指出“贝塔值无法解释平均回报率”。事实上，他们估计的贝塔值和回报率的关系在统计上不显著。更甚的是，他们的点估计表明贝塔值与回报率呈负相关。


    # 滞后期贝塔值与未来回报率


    在图10.10中，基于用过去一个季度的每日回报率估算的贝塔值，我构建了5个等分组合（每季度进行组合再平衡），按贝塔值由低到高进行排序，并计算每个组合的月度回报率。这些组合都是等权重构建的，这样可以尽量拉开它们的回报率和夏普比率之间的差距。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_349_0.png)


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_349_1.png)


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_349_2.png)


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_349_3.png)


    图10.10'
