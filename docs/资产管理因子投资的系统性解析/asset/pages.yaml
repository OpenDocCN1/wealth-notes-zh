    ③ 案例请参见Comstock，C.，2011 “Founder Myron Scholes Retired From His Hedge Fund”，商业内幕杂志，2011年2月10日。


    ④ 例情参见，Burton，K.and S.Kishan， “Meriwether Said to Shut JWM Hedge Fund After Losses”，彭博，2009年7月8日。'
