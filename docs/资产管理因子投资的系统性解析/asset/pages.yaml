  md: '在退休时，股票权重仍很高。退休后，家庭会尽可能长时间地持有股票而不是立刻转向债券等其他低风险资产。


    # （3）富家庭比穷家庭持有更多股票


    关于家庭在生命周期中的消费行为也有三点典型性事实${}^{\mathfrak {\mathrm {①}}}$。


    # （1）消费非常平滑


    生命周期模型预测当某人的永久性收入突然增加时，此人会消费更多——毕竟你刚发了一笔意外之财。但是实际中支出不会对收入变化做出快速反应。这在文献中被称为“过度平滑之谜”（excess
    smoothness puzzle）。


    # （2）消费过度敏感


    尽管当预期收入变化时消费并不发生变化，但消费确实会对收入过去的变化有所反应——而且是反应过度了。


    # （3）消费在生命周期中呈骆驼状


    消费的顶峰期是中年时期。退休时，消费会随着更低的劳动收入而有所下降。图5.6根据美国劳工统计局（Bureau of Labor Statistics）进行的消费支出调查展示了1984年至2011年期间不同年龄区间的消费支出情况。我将处于消费顶峰期的45～54岁区间的消费设为100%。需要注意的是，近年来退休的人比起20世纪80年代退休的人消费得更多。


    现在在生命周期领域有许多令人兴奋的研究成果。最新的模型能通过嵌入很多现实特征来解释上述现象：模型考虑了无法借贷的限制（特别是年轻人），采用能捕捉显著消费行为的效用方程，并对劳动收入和资产回报的复杂动态性进行建模${}^{\mathfrak
    {\mathrm {\mathfrak {2}}}}$。这些模型能匹配人们在生命周期中的典型性行为。在所有这些模型中，你的劳动收入是类似股票还是类似债券都是决定你生命周期资产配置的决定性因素。


    > ① 这方面的文献比生命周期资产组合选择方面的文献更多。权威的参考文献包括Deaton（1991），Carroll（2001）以及Gorinchakas
    and Parker（2002）。Attanasio and Weber（2010）是一篇文献综述。但大部分文献都没有讨论涉及风险资产的组合选择决策。


    > ② 具有财务约束的生命周期模型请参见Ramppi and Viswanathan（2013）。Laierson、Repetto and Tolacmann（2012）以及Pagel（2012）分别开发了包含双曲折现效用（hyperbolic
    discounting utility）和参考依赖偏好（reference-dependent preferences）的行为学生命周期模型。Peijenburg（2011）在生命周期模型中采用了模糊厌恶（ambiguity
    aversion）。除了正文中提到的文献，还可以参见Gomes and Michaelides（2005）。'
