- pgno: 303
  md: '这就是“预期假设”的部分。但在实际市场中，这并不成立。连续8个三个月短期国债收益率的平均值并不等于两年期国债的收益率¹。短期国债的展期是存在风险的：宏观经济可能发生改变，通货膨胀率可能上升，波动率可能改变，投资者可能突然更加厌恶风险。对于国债，尤其是长期国债，风险溢价部分无疑会非常大。


    有另一种分解方法是基于Fisher（1930）的费雪假设（Fisher Hypothesis）：


    名义长期收益率= 实际收益率+预期通货膨胀率+风险溢价

    下划线部分：实际收益率+预期通货膨胀率

    标注：这部分称为费雪假设

    公式 (9.3)


    纯费雪假设认为，长期收益率等于实际收益率与预期通货膨胀率之和，忽略掉风险溢价的部分。该假设与预期假设一样，都未得到实际数据的支持。然而，在预期假设和费雪假设中，相似期限债券的风险溢价部分一定是紧密相联的：十年期债券价格与九年期债券价格一定是同向变动的。


    期限结构模型指明了风险溢价的类型以及风险溢价如何变化。这些模型可以捕捉到两年期国债收益率如何偏离当前和未来短期国债收益率的平均值（与预期假设的偏离），也可以捕捉到长期收益率如何偏离实际收益率与预期通货膨胀率之和（与费雪假设的偏离）。这些模型包含三个组成部分：


    +   ① 潜在的风险因子；


    +   ② 短期利率怎样变动；


    +   ③ 短期利率和风险因子溢价如何影响长期债券。


    第②点短期利率的动态变化，可以看作是对美联储如何根据风险因子（泰勒原理中的通货膨胀率和产出）设定收益率曲线最短端的利率进行建模。第③点中的风险溢价是用来补偿投资者面临的久期风险、货币政策风险、不确定性、通货膨胀和增长冲击引发的宏观风险以及其他风险。模型最重要的结论即是，风险溢价随时间发生变化，也会随着债券期限的变化而变化②。当今最流行的模型是一系列的仿射期限结构模型（Affine
    Term Structure Models），这些模型包含了随时间变化的波动率、宏观和潜在因子，以随时间而变化的风险溢价③——它对于解释收益率变化尤为重要。


    ① 从Fama and Bliss（1987）起，有很多文献检验预期假设理论。但美国的数据却无法支持该假设。

    ② 期限结构模型中的无套利假设意味着所有债券给予投资者的风险调整后收益是相同的。

    ③ 仿射期限结构模型在Duffie and Kan（1996）中被正式明确，但是其早期模型是Vasicek（1977）开发的一个纯高斯模型。Oldrich
    Vasicek对指数基金行业的发展起了重要作用（参见第17章）。仿射框架中的一个特例是Cox, Ingersoll and Ross（1985）中著名的异方差模型。Dai
    and Singleton（2002）研究表明，时变风险溢价对于解释预期假设的偏差是必须的。如需了解一些关于期限结构模型的归纳汇总，参见Piazzesi（2010）。'
