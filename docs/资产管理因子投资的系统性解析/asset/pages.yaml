- pgno: 635
  md: '容；问题只是哪种表述方式更加有用而已。但其实最关键的还是菜谱本身——你需要使用正确的模型来计算收益率；否则不论用磅还是千克来称量苹果都无济于事。


    在分析投资组合时（如我们在第7章所做的），由于算术收益率在我们构建组合时可以跨资产累加，所以使用算术收益率更方便。而在分析跨时间的资产收益时（如我们在第8章和第11章所做的，分别关注于长期股票收益率的可预测性和不同资产在长期抵抗通胀的表现），我们使用对数收益率，因为可以跨时间累加。在两种情况下，我们都是在描述同一件事——收益率。


    这并不是说关于采用磅还是千克的选择不重要。每个通过计算摄人热量来节食的人都知道，你不可能在卡路里和千焦之间来回切换，却不出现计算错误从而导致自己摄入过多热量。我们来考虑下面的总收益率回报路径：


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_635_0.png)


    上图表示有一系列的50%−50%的概率事件使算术收益率要么为正50%、要么为负50%，这些概率事件在时间上相互独立。投资者若投资该资产，最终会亏掉所有资本（当你先赚50%后再亏50%，你实际总计亏损25%）。算术收益率均值为0，$E[r_{t+1}]=\frac{1}{2}
    \times 0.5+\frac{1}{2} \times-0.5=0$，这可能会投资者评估财富累积的长期收益率产生误导。长期来看，投资者的财富会缩减为0！对数收益率均值为


    $$E[\tau_{t+1}]=0.5 \times \ln(1.5)+0.5 \times \ln(0.5)=-14.38\%$$


    因此，负号至少表明该投资策略在长期会导致财富亏损。对数收益率均值也被称为几何均值（geometric mean）（当收益率有风险时，算术均值总是大于几何均值）^(1)^(2)。但更好的办法是看收益率的整体分布，这可以由概率分布函数或概率密度函数来体现（参见第2章）。上述例子中的概率密度函数非常简单——它给你带来了风险（有离散或方差）却没有任何收益。你首先必须有一个充分的理由才会去投资，对吗？从这个角度来看，算术收益率的均值与方差是很有用的统计量。


    这里还有另一个例子，是通过算术均值得到了正确结果，而几何均值却是错的。假设有资产A和资产B，它们的平均总收益率分别是$E[r_{t+1}]=1.5$和$E[r_{t+1}]=0.5$。如果一个投资者持有50%资产A和50%资产B，平均而言他会盈亏平衡，算术均值为零。但如果计算资产A和资产B的几何收益率的平均值，得到的结果实际上却小于零。对数收益率不能跨资产累加。然而，在上述两个例子中，我们都最好要看收益率的整体分布。


    > (1) 一个近似的等式是$E[\tau_{t+1}] \approx E[r_{t+1}] - \frac{1}{2}\sigma^2$，$\sigma^2$是算术收益率的方差。这个差异来源于Jensen不等式项，它导致了再平衡溢价。参见第4章。'
