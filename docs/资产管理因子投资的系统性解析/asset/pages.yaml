  md: '# 资产管埋

    园予投资的系统性解释


    # | 第3章 |


    # # 均值一方差投资


    # 本章概要


    多元分散化是均值—方娄投资的关键所在。通过利用不同资产间的相互作用，一种资产带来的收益可以弥补另一种资产带来的损失，多元分散化可以使投资者在减少风险的同时增加预期收益。在实际操作中，我们对均值—方娄投资组合的均值、波动率以及相关性这些输入变量进行约束，从而减小抽样误差，这样的组合通常比无约束投资组合表现好很多，等权重加权、最万方娄以及风险均配等投资组合均是有约束投资组合的特殊形式。'
