  md: '![](img/e2a8f768e844f37dcab93b54b9e826d9_188_0.png)


    Benzon i, Collin-Dufresne和Goldstein（2007）以及Lynch和Tan（2011）定义了劳动收入过程，其符合平均投资者劳动收入与股票回报相关度很低的特征，但同时允许劳动收入与股票回报在经济周期以及更长时期内可以同向变动的现实动态。这比较直观：我们预期劳动收入与股票回报在长期是相关的，因为人力资本和股票资本都会从经济增长中获益。任何在大萧条时期丢失工作的人都知道劳动收入与股票回报在某些短期内可能高度相关。


    Benzon i, Collin-Dufresne和Goldstein允许劳动和股票在长期同向变动（劳动与股票回报是协整的（cointegrated））。由于这种长期的同向变动，未来寿命较长的年轻人有着类似股票的人力资本，未来寿命较短的老年人有着类似债券的人力资本。因此，年轻人最好不要持有股票（如果可以，他们实际上应该做空股票），资产组合中的股票比例应该随着年龄增长而增加$
