  md: '即所有因子权重或因子系数之和等于 1。公式（10.14）右边的各因子权重构成了一个对基金i的复制组合。


    风格分析的主要意义在于，我们在因子基准中使用了现实中可交易的基金。我在公式（10.14）中使用的是 SPDR系列ETFs，但我也可以使用其他ETFs或者指数型共同基金作为基准组合。


    请注意公式（10.14）中的时间点。我们在估计时采用的 是截至时间t时的信息。该基金在下一时期t+1时的回报率等于t时所构建的复制组合在t+1时期的回报率，加上残值\u03b5_{t+1}，再加上该基金在t时期的阿尔法\u03b1_i。这些权重可以随时间而变化。公式（10.14）提出的一个是：
    “我们可否使用机器人对SPY、SPYV和SPYG进行随时间变化的投资，来复制Buffett的回报率？”


    图10.5画出了这四只基金的因子权重（风格权重）。我采用过去60个月（t - 60至t）的数据来估计这些因子，以获得在t时的基准权重。除了所有因子权重之和为
    1这个限制条件，我还限制了这些因子权重必须为正值（即禁止做空）。第一个因子权重是在2006年1月的估计值。


    从图10.5-A可以看到，LSV仅仅包含了市场（SPY）和价值（SPYV）两种风格。富达麦哲伦起初在2006年时包含了所有三种ETFs的风格，但是在2012年底时体现的完全是成长（SPYG）风格。高盛成长基金在样本前期大部分是市场敞口（SPY）和成长（SPYG）风格，但是到后期就只有成长（SPYG）风格。Buffett的因子敞口最为有趣：在2006年时是很强的价值（SPYV）风格；在金融危机期间，风格转换为成长型；在金融危机之后，风格又转回到很强的价值型。


