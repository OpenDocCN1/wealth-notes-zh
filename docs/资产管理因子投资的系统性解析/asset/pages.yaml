  md: '挪威在1969年发现了石油①。该国在20世纪七八十年代经历了荷兰病的诸多症状。当石油价格在20世纪80年代中期下跌时，其经济出现长时间的低速增长。为促进实施更可持续的财政政策以及让国家资产不再集中在石油产业并呈现多元化，挪威于1990年创建了主权财富基金，最初起名为石油基金。政府于2006年将基金名称改为政府全球养老基金（Government
    Pension Fund–Global），尽管它与养老基金并无任何直接关联。通过把钱投入基金，政府可以使本国经济免受石油价格波动的影响，并且国家在资源枯竭时可持续增加消费。


    东帝汶设立了主权财富基金，使得新财富不会破坏该国的小经济体结构并摧毁一切与油气无关的产业。在自家门口赢得石油的头彩后，东帝汶会不会重蹈尼日利亚的覆辙？还是东帝没有可能治愈荷兰病，走向一个光明的未来？


    东帝汶政府从来自挪威和其他国家的专家那里获得了许多建议；Torres Trovik（在此感谢Torres为我引荐了挪威主权财富基金）就效力于石油基金咨询委员会②。东帝汶面临着更多挑战，不仅是荷兰病：在许多贫穷国家，石油带来的意外财富有随时消失的趋势，消失在政客们或其他人的口袋里。位于美国首都华盛顿的研究机构——彼得森国际经济研究所（Peterson
    Institute for International Economics），基于结构、治理、透明度和问责制将东帝汶的主权财富基金排在第三位③，仅次于挪威和新西兰。


    # 2.4 融入政府政策


    与博茨瓦纳、智利、韩国及其他国家一样，东帝汶把主权财富基金的运营视为国家经济发展总体政策的一部分。《石油基金法》（Petroleum Fund Law）将东帝汶石油总财富的3%界定为预计可持续收入（Estimated
    Sustainable Income，简称ESI），而石油总财富等于当前石油基金的资产加上未来石油收入的净现值。换言之，ESI等同于3%的石油总财富——包括基金现有的金融财富再加上未来从储备中开采的石油和天然气财富。鉴于其他行业严重疲软，石油总财富本质上是东帝汶所拥有的全部。ESI用于指导依托石油收入的政府支出，同时也具有一定灵活性。


    挪威的情况类似，也明确了一个灵活的支出原则，即基金规模的4%。本书第5章将介绍东帝汶的做法其实更接近于这样一种经济理论，即主张消费规则应基于总财富


