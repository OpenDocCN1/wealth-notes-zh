  md: '率为80个基点（参见图16.6），而交易所交易基金平均费率为20个基点（参见French（2008））。由于流向普通共同基金的资金流趋缓，很多传统的共同基金公司推出了交易所交易基金产品。基金公司其实并不情愿这样做，因为交易所交易基金利润较低，并且会有蚕食高利润率的传统基金生意的危险。例如Janus迟迟未跟上交易所交易基金的潮流。Janus于2010年9月3日在美国证券交易委员会登记发行积极型交易所交易基金，但在2013年我写作本书时尚未推出任何一支产品。


    在2011年末，最大的三家交易所交易基金发行公司为iShares，StateStreet和Vanguard，其管理的资产规模分别为4480亿美元，2670亿美元和1700亿美元（其他管理公司的规模显著小于这三家）。这三家大型资产公司陷入了“基点收费战争”，使得交易所交易基金的费率降低¹。一些覆盖面广泛的指数交易所交易基金现在的费率甚至低于0.05%。


    在写作本书时，单纯的交易所交易基金管理公司中只有WisdomTree Investments一家上市企业。这是唯一一家我们能够直接观察其交易所交易基金业务盈利能力的公司，而其他公司都通过旗下部门发行交易所交易基金，且并不单独报告交易所交易基金的收益情况。2011年末，WisdomTree的资产规模为122亿美元，名列美国第七大交易所交易基金发行公司。WisdomTree于2006年6月发行了它的第一支交易所交易基金，并于2011年7月在NASDAQ上市。在2011财务年度，WisdomTree首次报告盈利，运营利润率为5%，相对Janus当年32%的运营利润率低很多（参见表16.2）。


    交易所交易基金的低利润率意味着管理公司需要规模化经营。Barclays Global Investors（BG1），现在是BlackRock的一部分，于1999年成立了iShares部门²。这个计划风险很高，因为BG1需要1000亿美元的资产规模才能实现盈亏平衡。BG1涉足该业务之后，成立了全平台的交易所交易基金，并且对投资者开展了全面的教育活动。这是当时BG1首席执行官Blake
    Grossman和iShares首席执行官Lee Kranefuss做出的一个大胆的公司层面的决定。事实证明他们做出了正确的决定，BG1的交易所交易基金业务得到了蓬勃发展。


    交易所交易基金需要很大规模才能获得收益。并且在费率下降的环境下，它们需要不断扩大规模。


    交易所交易基金仍然需要开发的一个领域是401(k)市场。投资顾问和共同基金公


