  md: '在将计划参与者导向自身管理的基金方面有着利益冲突。Pool, Sialm和Stefanescu（2013）研究表明，受托人发起的基金相对非受托人基金平均跑输3.6%。受托人基金被从401(k)菜单移除的可能性较低，而被添加的可能性则较高。受托共同基金公司更易超配发起公司的股票——第3章显示了缺乏分散度有害于受益人——受托基金在股东会议上投票的方式取决于其发起人的业务联系ᵍ。


    个人投资者可以通过投资于机构基金来改善公司治理，机构基金有更多的监控资源，并可以通过撤出大量资金来惩罚基金：Evans和Fahlenbrach（2012）显示，有机机构投资者的零售共同基金产品平均每年跑赢无机机构投资者的产品1.5%。


    为何投资者坚持投资于公司治理和业绩差的基金呢？税收是其中一个原因，但通过支付资本利得税转投更好的基金，投资者的情况一般能够获得好转ᵍ。另一个原因是，投资者缺乏相关知识及其学习过程比较缓慢，要确定基金管理人是否未能带来价值较为困难。


    行为学上的解释或许对个人投资者更能产生共鸣。投资者可能不愿意实现损失（这就是所谓的处置效应，disposition effect）ᵍ。另外，当然希望总是存在的，或许基金的业绩会反转（但事实上不会）。Gennaioli,
    Shleifer和Vishny（2012）研究声称，共同基金投资者和基金顾问之间的关系如同病人和医生之间的关系。投资者信任共同基金公司，并且在基金受挫的时候信任也不会消失。基金管理人利用这种信任，资金粘度高，即使在基金管理人没有投资能力的情况下也能持续收取高额费用。


    # 3.9 总结


    Tkac（2004）将共同基金行业的利益冲突称为永远的泥沼，并特别注意到“投资者作为共同基金公司出售的基金的客户”与“投资者作为共同基金所有者、却被董事会代表从共同基金公司购买服务的法律关系”之间的矛盾。但40法案已经消除了最坏的委托代理问题，使得共同基金行业能够繁荣发展。


    共同基金也鼓励了大众储蓄。人们的确需要储蓄（参见第5章）。如果没有共同基金，储蓄会更少。个人投资者获得了通过经营自己的投资组合无法取得的投资能力，他们的资金也避免了遭受基金管理人最严重的侵犯。不幸的是，平均看来投资


