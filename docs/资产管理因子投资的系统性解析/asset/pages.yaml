- pgno: 348
  md: '过去一个季度的每日数据，按照Fama-French（1993）的因子分析方法来计算这5个组合的非系统性波动率，再由低到高进行排序（如果是按总波动率排序，结果会非常相近）。每个等分组合内都采用市值加权法构建，与Ang等（2006，2009）的研究方法相似。


    图10.8展示了每个组合回报率的均值和标准差（左轴）。组合的波动率从组合1（低波动率）至5（高波动率）依次增加。前三个组合的平均回报率都在10%以上，组合4跌至6.8%，组合5（波动率最高的组合）跌至只剩0.1%。高波动率的股票确实显现了“异常低”的回报率。右轴展示了各组合的原始夏普比率，即均值与标准差之比。可以看到，随着组合波动率上升，夏普比率从0.8往0.0不断单调递减。


    # 同期的波动率与回报率


    在相同时期中，高波动率的股票会有高回报率吗？


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_348_0.png)


    在图10.9中，我在每个时期结束时，基于已实现的非系统性波动率构建了5个等分组合，并衡量这些组合在该时期内实现的回报率。需要注意的是，这些组合并不是在现实中可交易的组合。图10.9展示了这些等分组合的平均已实现波动率和平均已实现回报率；可以看到，同期的波动率和回报率仍然呈负相关。因此，波动率最高的股票在同期就会出现损失（无法预测），并且在未来也很可能继续损失（可以预测）。


    # 4.3 贝塔值异象


    1970年代对CAPM模型的最早检验确实发现贝塔值和预期回报率之间存在正相关性，但是并没有发现纯CAPM模型是有效的。例如，Black、Jensen和Scholes（1972）发现，贝塔值与回报率之间的相关性远没有CAPM模型预测的那么高，但至少两者之'
