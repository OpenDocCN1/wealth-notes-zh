  md: '纪20年代的恶性通胀所累，然后当1948年引入新货币Deutsschmark时出现了对以原货币Reichsmark计价债权的违约。当然，在一些国家，包括俄罗斯和中国，股票持有者和债券持有者的投资都灰飞烟灭了。但在许多有结构性暂停交易的国家，股票持有者勉强获得了一定（有时候很很少的）长期收益，而债券持有者则大批以失败告终。如果股票溢价是相对于债券来衡量的，那么市场的这种幸存者偏差便加剧了股票溢价之谜。灾难时期股票相对于债券的更优历史业绩确实对因子投资有一定的启示，我会在第14章讨论这点。


    # 3.3 长期风险


    我们从数据中看到，实际消费增长的自相关性接近零。例如，表8.1中的数据展示出的季度自相关性为0.08。基本的Mehta-Prescott模型假设消费冲击是独立同分布的（independent
    and identically distribution，简称i.i.d），或者说是无法预测的。在一篇具有影响力的文章中，Bansal和Yaron（2004）更改了这个假设，具体指出消费增长的均值不是恒定的，而是非常缓慢地上下游离以至于很难区分i.i.d过程与这种缓慢而持续、可预测性很小的过程¹。这种变化的消费过程被Bansal和Yaron称为长期风险²。Bansal和Yaron还修改了Mehta-Prescott模型中的基本CRRA偏好，使得代表性参与者更在意长期风险³。Bansal-Yaron长期风险模型被调整应用到不同的情境中，解释了很多种典型化事实，包括本节的股票溢价之谜和无风险利率之谜⁴。


    本书撰写之时，欧洲正是长期风险之说的极好例子。比如，某个欧元区国家的一场沸沸扬扬的议会投票所带来的当前冲击，会对我们现在对未来经济增长的预期产生影响，但同时也会对未来十到二十年的经济增长产生影响。这个投票可能会削弱现在的生产率，而降低现在的生产率则可能会让欧洲长时间处于低增长通道。长期风险是存在的。Bansal和Yaron采用的特殊偏好区分了这些冲击的短期和长期效果。股票对长期风险尤为敏感，这并不奇怪，因为股票是一种长期存在的（事实上，永续存在的）证券。


    Bansal和Yaron所做的第二个修改是，让基本面消费因子展现出随时间变化的波动性。市场参与者们不喜欢波动率，资产价格则反映了波动率风险。随着波动率增加，


    +   1.  Bansal and Yaron (2004) 还具体指出消费的条件均值的波动率会随着时间变化。

    2.  以前也有人考虑过消费增长的可预测性，但在CRRA效用的前提下，允许消费增长有简单的自相关性实际上却让股票溢价之谜更难解释，因为它平滑了消费，要求有更高的风险规避程度才能与数据相符。早期的研究尝试参见Dunn
    and Singleton (1986)。

    3.  具体来说，代表性参与者希望有平稳的消费水平，但这些消费水平被平稳的方式不同于风险规避，后者衡量的是一个市场参与者在给定时点如何看待不同的风险事件。这被称为Einstein
    and Zin (1989) 偏好，也被运用在灾难模型中。

    4.  这类研究文献当时已经较多。相关总结参见Bansal (2007)。'
