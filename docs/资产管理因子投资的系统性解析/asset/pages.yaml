- pgno: 372
  md: '如果从消费（Consumption）角度来解释，实际利率可以被视为是消费者将当前消费转移到未来的代价。它反映了放弃今天消费而在明天进行消费的成本。通常，人们更喜欢今天进行消费，例如今天吃1个水果的效用等于明年吃1.02个水果的效用。但是在实际利率为负的情况下，消费者更倾向于进行储蓄：明天消费比今天消费更好。这反映了一种极端的预防性储蓄。消费者愿意将今天的消费推迟到未来，因为他们认为糟糕的时候将要到来——税负加重，经济增速放缓，甚至会有更重的监管层面的负担，以及更大的政治不确定性。


