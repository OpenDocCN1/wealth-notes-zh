  md: '年12月的价值为7.12美元。用点线表示的股票组合出现了两次大的起落：20世纪90年代末的大牛市与随后21世纪初的互联网泡沫破裂，21世纪第一个十年初期至中期的股价回升与随后2007年至2008年的金融危机。2011年12月股票组合的最终价值为6.10美元。与图4.5类似，实线表示实施再平衡的60%股/40%债的组合，同样是在每季度末进行再平衡操作。与纯股票组合相比，该组合通过持有相对较少的股票，波动率相对更低。它在2011年12月的最终价值为7.41美元，收益率高于纯债券组合和纯股票组合。


