  md: '时期，有些投资者可能会面临有约束力的融资限制，迫使他们以非常厌恶风险的方式行动，这在他们对股票的卖出上有所体现。例如，投资银行无法对它的债务展期，或者资产管理人出现资产流出，这两种情形都可以类似地增加不景气时期经济体的总体风险厌恶程度。


    对一个正在考虑大量持有股票的资产所有者来说，异质性提示他不仅应该考虑他与市场（或边际/代表性参与者）有何不同，还应该考虑相对于所有投资者分布，他是什么类型的投资者。其他投资者的行为以及他们之间如何互动都会影响资产价格。不景气时期的主要直观逻辑也适用于这些异质性模型——股票溢价高是因为有些市场参与者（不一定要有很多人，但当他们起作用时会有很大影响）发现在他们界定的不景气时期股票不具有吸引力。但这些时期对她来说可能并非不景气时期，如果是这样，那么他应该持有平均水平以上的股票配置。


    将异质性参与者模型中的观点应用到投资政策中的问题在于，世界太过异质了。我们并不清楚到底应该强调什么维度——是风险厌恶程度、财富、损失容忍度、杠杆容忍度、（较少）负债、收入，还是对下行风险事件的规避程度。要衡量不同投资者类型的横截面特征通常很难（如果
    不是不可能的话），异质性参与者经济体模型预测认为这些横截面特征应该是有用的候选因子。既然代表性参与者经常出现在这些模型中，我建议投资者在考虑自己与市场有何不同时，还是应该集中关注对股票风险溢价的前三种解释上。异质性参与者模型带来的启示是，我们不仅可将“市场”理解为“平均投资者”，也可理解为“边际投资者”。


    # 4. 股票与通货膨胀


    # 4.1 股票是较差的通货膨胀对冲工具


    股票是一种实际证券，因为它代表着对企业具有生产力的实际资产的一种权益。但从“实际”意味着“通货膨胀调整后”或者“名义”的反义词这个角度来看，会发现股票其实并不是实际证券。事实上正好相反：股票对冲通货膨胀风险的效果很差^{①}。


    这可能令你感到意外，但请看图8.3，分别画出了1926 ~ 2010年通货膨胀与股票'
