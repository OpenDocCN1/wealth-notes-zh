  md: '表11.4汇总了从1978年初至2011年末，直接和间接房地产投资回报率以及股票回报率的均值、标准差、自相关系数和相关系数矩阵，所有数据均采用季度数据。直接房地产投资的回报率来自美国国家房地产投资信托委员会（NCREIF），该机构从它的所有会员处收集房地产数据。NCREIF每季度根据房地产估值计算一个价值加权的指数。间接房地产投资的回报率是FTSE
    NAREIT All Equity指数的回报率，计算频率同样是每季度一次。我将这两项回报率与标普500股指的回报率进行比较。


    **表11.4**


    **相关系数矩阵**


    在表11.4中可以看到，NCREIF回报率（季度自相关系数为78%，波动率仅为2.2%）与REIT回报率和股票回报率（自相关系数接近于0，波动率在8% ~
    9%之间）相比，显得非常平滑。REIT回报率与股票回报率之间的相关系数高达63%，而NCREIF回报率与REIT回报率的相关系数低至15%。这样REITs看起来更接近于股票，而不是直接房地产投资。在所罗门兄弟任职的房地产从业者Hartzell和Mengden于1986年率先发现了这种现象，并掀起了关于房地产回报率特性的大讨论。房地产确实是一种独立的资产类别吗，或者它只是另一个版本的股票（和债券）？


    关于这个问题的讨论延续至今。我从众多文献中为投资者总结了如下几点内容。


    **直接房地产投资回报率并不是种可通过现实投资获得的回报率**


    NCREIF数据序列（和在欧洲广泛使用的Investment Property Databank数据序列）存在很多数据偏差，因为这些数据并不是基于现实中的市场交易。而REIT回报率，是一种可通过现实投资获得的回报率。NCREIF数据序列有两个重大的数据偏差¹：


    ¹除此以外还有两个小的数据偏差。一是指数构建偏差，即重复销售指数是一种等权重的横截面估计量，而等权重组合的回报率是横截面上各个资产回报率的算术平均值。二是一套房产在市场上待售的时间在“火热”和“遇冷”的房地产市场环境下差异很大。Fisher等人（2003）讨论了这四个偏差。'
