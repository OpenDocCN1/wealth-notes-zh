  md: '如同承认管理人没有技能，哪个管理人愿意这么想呢？指数基金最早的开拓者之一Oldrich Vasicek说过：“他们认为我们是疯子……你想买所有正好在交易的垃圾吗？”①


    哈佛商学院的管理学大师Clayton Christensen（1997）令人信服地证实，是局外人（特别是小公司）在寻求创新。这在金融行业也成立。莽撞地开始发展指数基金机构是一家银行——Wells
    Fargo——当时该银行几乎没有股权投资客户。三个银行成员领导了这次变革：John McQuown，James Vertin和Williams Fouse。用Bernstein在他1992年的论文中的话说“是他们把礼服带进了城市”。这种说法很恰当，因为McQuown把资产管理部门变成了一个学术发电厂，金融学术界的大人物，包括Black、Fama、Jensen、Markowitz、Miler和Sharpe（很多人之后获得了诺贝尔奖）都于不同时期在Wells
    Fargo工作过。


    最早的市场指数基金失败了。在1971年，Wells Fargo创造了一个由Samsomite公司养老金提供启动资金的等权重指数基金。这个基金交易起来像个噩梦，最终关闭。


    在1973年，Wells Fargo进行了第二次尝试，这次很成功。该现代指数基金使用了市值加权的方法，该方法成为以后指数基金的范本。为了给这支基金提供启动资金，Wells
    Fargo自己的养老金和Illinois Bell投人了资金。


    指数基金的另外两个早期的开创者也是局外人：由稍后成立了DFA的 Rex Sinquefield领导的美国国家银行（American National Bank）和由Dean
    LeBaron领导的Batterymarch Financial Management。这两家机构现在都已不再家喻户晓。


    如果不是Vanguard集团，指数基金可能到现在都是一种小众的投资方式。Vanguard集团现在是全球最大的资产管理公司之一②。John Bogle于1975年使用一种创新的结构创立了Vanguard。公司由共同基金所有，共同基金的股东只需要支付给Vanguard运营所必须的资金（数额并不高）。Vanguard是“共同”的共同基金。Vanguard抛弃了财务顾问，直接向投资者销售，保持了低成本。该公司于1976年首次推出了指数基金，这很大程度上归功于Vanguard的努力，指数投资在20世纪80年代后期成为了一般投资者熟悉的词汇，并于90年代中后期吸引了大量的投资。虽然现在Vanguard已经成了一个巨兽，最初却并不成功，但它顽强地坚持下来了。Vanguard管理的资产额在1998年才超过10亿美元这个基金管理界的关键门槛③。


    大部分传统的积极型共同基金公司也被迫提供低费率的指数基金。这些基金出


