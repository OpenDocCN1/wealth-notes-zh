  md: '付的顺序后于债券持有者。股东相当于是向债券持有者借入了等于债务面值（在上述例子中是100美元）的资金。当公司价值太低时，股东可以一走了之，直接把公司抵押给债券持有者。这相当于是股东买入了一份看涨期权。根据买卖期权平价关系，股东拥有公司的看涨期权——股东做多头率，债券持有者做空头率。从另一个角度来看，股东拥有全部的上行收益空间，即公司资产的看涨期权。债券持有者只有下行风险，在公司价值上涨时无法获得任何额外收益。因此，债券持有者计入了这种下行风险，即卖出看跌期权。


