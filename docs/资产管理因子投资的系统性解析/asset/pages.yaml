  md: '然而，我们应该对交易成本的解释持怀疑态度。幸运的美国投资者并不需要直接投资于外国市场——外国公司早已通过交易费用很低的美国存托凭证（ADRs）实现了自己的股票在美国交易所流通$^{\textcircled{1}}$。还有许多擅长于投资国际资产的金融中介，例如共同基金，也是美国投资者可以很容易接触到的。从更为广泛的角度来看，交易成本也可以包括获悉分散化优势的成本。不管是真实的交易成本还是获得金融知识的成本，都与经济模型所预测的能匹配投资者明显本土偏好的必要成本不一致。例如，Glassman和Riddick（2001）估算出，交易成本必须非常之高——高于每年12%——才能解释观察到的本土偏好现象。


    # （4）信息不对称


    美国投资者可能在外围市场中处于劣势，因为外国人比美国投资者对当地市场更了解。由于比外国人掌握更少的信息，美国投资者的更优选择便是持有更少的外围股票$^{\textcircled{2}}$。弦外之音是本国投资者应该比外国人在本土市场表现得更好。


    然而，实证研究却出现两种结果。一方面，Shukla和van Inwegen（1995）发现，在美国市场中，本国投资经理表现好于外国投资经理。Coval和Moskowitz（2001）记载了“本土的本土偏好”（home
    bias at home），这是指即使在美国国内，着眼于本地公司的美国共同基金经理比着眼于全国范围投资的同行表现更好。另一方面，Grinblatt和Keoharju(2000)、Seasholes（2000）以及Karolyi（2002）均发现了相反的现象：本国居民和机构在本土市场的表现不及外国投资者。


    # （5）行为偏差


    Huberman（2001）认为“人们只是喜欢投资于熟悉的事物”。缺乏国际认知的分散化就是因为人们只着眼于他们所了解的事物。Morse和Shive（2011）研究称本土偏好是出于爱国主义，并发现那些民众爱国热情更弱的国家展现出更弱的本土偏好。


    关于本土偏好之谜的相关文献是实证经济学（参见第2章）的一个很好的例子。然而，我们仍然不知道是什么阻止了投资者抓住这些分散化机会。均值一方差投资引出的分散化概念则是规范的；第2.1节至2.4节证明国际化投资具有显著优势。投资者应该抓住机会进行分散化投资并优化风险收益比。你的资金应该像急性的青少年迫不及待地离开家那样：进行海外投资并收获利润。


    +   (1) 参见Errunza, Hogan and Hung (1999)。


    +   (2) 第一个模型由Gehir (1993) 提出。近期的模型包括 Van Nieuwerburgh and Veldkamp (2009)，在该模型中，投资者在均衡状态下内生地选择不去了解外国股票。'
