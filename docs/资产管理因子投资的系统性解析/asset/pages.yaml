  md: '低于退休金资产所赚取的收益率。所以很多人在去世时还有大量储蓄，这并不令人惊讶。


    支付医疗费用是“退休储蓄之谜”的一个重要原因。另一个原因与人们对自己房产的依恋有关，房产是大部分人最大的投资①（房产是非常缺乏流动性的资产，有巨大的非系统性风险，需做空债券头寸来融资）。虽然基本的生命周期模型预测个人应该在他们退休时将房产换成小房子，但是房屋所有者通常选择尽可能长时间地待在原有住房里，而不会轻易地用它们来抵押贷款。这种现象可以通过反向抵押贷款（reverse
    mortgages）得到缓解，但反向抵押贷款市场仍然很小，并且有很多与年金市场类似的缺陷。房产财富通常不在退休后用于消费，大部分情况下只在配偶去世或者房主被迫搬到疗养院时才对其变现。即使在这种情况下，变现房屋财富也不是用来支持非房产的消费。退休后继续储蓄的另一个原因是个人不仅仅考虑他们自身的生命周期，他们还想给予子女和其他亲属留下遗产。


    # 4.6 小结


    最重要的事情是现在开始储蓄以便退休后可以消费。储蓄，储蓄，储蓄！重要的事情说三遍。尽管年金可以满足退休者的大部分需求——消除长寿风险和在退休后提供有保障的平滑消费——但是大部分人不持有年金。现在的年金市场高度无效，而且消费者很难理解年金产品；当然这反过来也意味着年金市场对新的市场参与者来说还有很大的创新空间。


    # 5. 对罗德岛州员工退休体系的回顾


    2011年11月17日，由Raimondo领导主张的养老金监管方案在罗德岛州的众议院和参议院获得通过，第二天“罗德岛州退休保障法案2011”（Rhode Island
    Retirement Security Act of 2011）由州长签字变成正式的法律。由此，ERSRI的养老金负债缺口从73亿美元下降到43亿美元，纳税人2012～2013年贡献给养老金的资金从超过6亿美元削减到3亿美元。预计ERSRI的提存比率在未来几年还会稳步上升。惠誉国际评级公


