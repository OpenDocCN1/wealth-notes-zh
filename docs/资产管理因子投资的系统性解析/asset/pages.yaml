  md: '了检验，指出如果今天研究人员才发现规模效应，那么“其溢价大小并不会值得特别关注，也一定不会提出投资小盘股能获得明显的‘免费午餐’”。Fama和French（2012）的研究对近期大量国际数据进行了检验，也没有发现规模效应。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_244_0.png)


    # 图7.5 市场调整后的SMB和HML策略收益情况


    对于规模效应的消失，主要有两种解释。一是，最初发现规模溢价可能仅仅是数据挖掘的结果。Fischer Black（1993）在Fama和French的论文发表后很快就做出了类似评价。“发现”规模效应只是Rosenthal（1979）提出的“抽屉问题”的例子之一，现在是“硬盘问题”（正逐渐演变为“云问题”）。研究人员将统计上不具有显著性（采用标准的P值0.05来判断显著性）的95%的研究结果保存在硬盘上，而仅发表在统计上具有显著性的那5%。规模溢价的发现者纯属运气好，偶然掉入这5%的范畴。数据挖掘的一个明显结果就是，某种效应在样本内（in
    sample）——即初始研究的模型中显著、但在样本外（out of sample）——即效应发现后的检验模型中不显著。因此，Banzl提出的规模效应可能一开始就并不真实存在，Banzl和Reinganum的发现仅仅是运气而已^(1)^。


    二是，规模效应本来确实存在，但由于理性的积极投资者基于该发现采取了行动，抬升了小盘股的价格直至规模效应不再显著^(2)^。在这种情况下，规模效应的消失


