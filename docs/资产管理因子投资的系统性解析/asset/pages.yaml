    ② 参见 Goyenko, Subrahmanyam and Ukhov (2011)。

    ③ 参见 Musto, Nini and Schwarz (2011)。

    ④ 也可参见第9章，Bao, Pan and Wang (2011)，Lin, Wang and Wu (2011)，以及 Dick-Nielsen, Feldhutter
