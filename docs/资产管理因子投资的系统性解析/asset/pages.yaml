  md: '# 3.4 信用风险


    2010年12月19日，著名的银行业分析师兼梅勒迪斯惠特尼咨询集团有限责任公司（Meredith Whitney Advisory Group LLC）的首席执行官Meredith
    Whitney，在著名电视节目《60 Minutes》中预测“自2011年起市政债券违约造成的损失将达到数千亿美元”。她的评论引起了广泛关注。但我们目前还没有看到市政债券的大规模违约潮。Whitney提出这一预测可能为时尚早，不过她提出了一个比较激进的观点。鉴于市政债券通常被视作低风险产品，那么其真实的信用风险水平究竟如何呢？


    美国地方政府破产的情况时有发生。1994年，加利福尼亚州的橘子县申请破产时曾引起巨大轰动。2013年，底特律市申请破产保护，成为美国迄今为止最大的一宗地方政府破产申请、债务规模接近200亿美元。自金融危机以来，各地出现零星违约，部分原因是房价下跌和次贷危机的遗留问题。部分违约城镇的清单如下：2008年，加利福尼亚州的瓦列霍市（Vallejo）；2009年，阿拉巴马州的普里查德市（Pritchard）；2011年，罗德岛州的中心瀑布市（Central
    Falls），宾夕法尼亚州的哈里斯堡市（Harrisburg），阿拉巴马州的杰斐逊县（Jefferson County）；2012年，加利福尼亚州的斯托克顿市（Stockton）。但总的来说，市政债券的信用风险水平极低。Ang、Bhansali和Xing（2012）在公式（12.7）中预测的利差分解显示：信用风险对市政债券利差的影响可以忽略不计，但这一结论是基于该文献作者选取的自20世纪90年代中期起的数据样本。或许市政债券现在的风险水平更高？


    根据穆迪发布的报告，在1970~2009年期间地方政府仅发生过四起违约事件，同期市政事业单位的违约也仅有54起$^{①}$。投资级市政债券和投资级公司债券平均5年累计违约率分别为0.03%和1%。可见，市政债券信用风险水平非常低，比投资级公司债券的信用风险水平低了一个数量级。穆迪的报告中还提到，市政债券发生违约后，一美元能收回60美分；相比之下，投资级公司债券发生违约后，一美元仅能收回38美分。Hempel（1971）重点考察了20世纪二三十年代的市政债券违约，研究发现市政债比公司债券违约率要低得多，回收率也更高。


    Whitney的预测有可能成为现实。州政府破产的情况已有发生$^{②}$。早在19世纪三四十年代，美国八个州和一个地区发生过违约，包括：阿肯色州、佛罗里达领地、印地安那州、路易斯安那州、马里兰州、密歇根州、密西西比州和宾夕法尼亚州。在那个时代，美国仍属于新兴市场，有大量的基础设施借款无法偿还（按John
    Cochrane


    $^{①}$ 参见U.S. Municipal Bond Defaults and Recoveries, 1970~2009, Moody''s Investors
    Service, Feb. 2010.

    $^{②}$ 更多细节参见Ang and Longstaff（2013），该文比较了美国各州与欧元区国家的信用风险水平。美国各州是一个货币联盟的主权借款人，正如欧元区国家一样，但德国不会派军队去阻止一个国家离开欧元区，而美国则发生过葛底斯堡（Gettysburg）战役。'
