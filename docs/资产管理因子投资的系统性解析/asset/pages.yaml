  md: '资策略，比如那些具有波动率风险敞口的策略，最好采用能明确解释非线性风险的动态因子来衡量。


    无关性结果中的基本设定是一个一次性委托模型，即资产所有者在单一投资期内找到组合管理人。从这个角度看，它类似于资本资产定价模型。如第4章所展示的，单一投资期通常不是限制条件，因为如果投资者能做再平衡，动态问题则不过是一系列的单一投资期问题。然而，对大型投资者来说，会有两个（有时三个或四个）阶段的投资流程，即最高层先做出资产配置决策（应该是因子配置决策），然后选择在单一资产类别方面有专长的资产管理人。这种两阶段流程会导致利益不一致，对资产所有者是有代价的。


    在多阶段委托的情况下，静态资产类别基准还会带来除无关性结果以外的其他成本¹。Van Binsbergen, Brandl和Kojien（2008）研究显示，更有效的非静态基准能克服分散式投资管理的缺点。这类基准通常涉及杠杆以及行业、子资产类别、持仓的非常规仓位，在现实情况中较难采纳。然而，总体观点仍然有效：目前业界所普遍采用的静态资产类别基准对资产所有者来说是不利的。业界应该改为采用更有效的基准。因此，因子基准可以起到重要作用，既能作为衡量投资业绩的工具，又能作为减轻代理问题的方法。


    # 3.4 最优契约


    无关性结果指出，线性契约不会让基金管理人以资产所有者的利益为目标来行动。所以我们可考虑采用非线性业绩契约。


    # 非线性契约


    Bhattacharya和Pfleiderer（1985）的开拓性研究开创了委托资产管理领域，推导出一种最优的非线性契约。该契约是二次方程式，对收益相对于基准的正偏离和负偏离都会进行惩罚。通常我们会自然地认为，当管理人业绩落后于基准时，报酬应该更低些。而二次方程式契约看起来似乎有点不合理，因为当管理人超越基准时也会获得更低的报酬，且超额收益越多，惩罚越大²。我们在现实世界中未见到二次方程式契约（至少目前还没有），但我们确实在对冲基金和其他另类资产工具中看到了许多非


    > ① 最早由Sharpe（1981）进行研究。


    > ② 二次方程式契约会惩罚过度波动性。在现实世界里面，波动率限制是通过使用跟踪误差限制来施加的。限制条件在最优契约中确实扮演著重要角色，我会在3.4节进一步阐述。'
  merge: -1
  img_proc: true
- pgno: 519
  md: '线性契约。即使选择了错误的基准而导致管理人偷懒，采用类期权（option-type）的业绩费也将有助于激励管理人加大努力程度ⁱ。因此，非线性契约应该被更广泛地采纳。


    一般代理理论认为，限制条件构成了基于行为的契约的重要部分并将减轻委托人所面临的代理问题。在Stoughton-Admati-Pfeilerer的研究中，对组合管理人所能持有的组合仓位不设限，这使得他们能很好地同时控制组合的收益和风险，并完全消除激励费的影响。我们可以设置限制条件来作为促使管理人努力工作的一种方式。设置限制条件使得我们在有些情况下可以越过无关性结果的障碍，现实世界中的我们也看到了许多对管理人行为的限制：关于组合风险（久期、跟踪误差、贝塔、集中度等）以及可以持有什么、不可以持有什么（投资范围、衍生品等）的限制。理论证明，限制条件构成了最优契约的一个重要部分。


    # 透明度与披露


    在选择投资管理人时，资产所有者还有另一个重要考量因素，而且这点应尽可能地体现在最优契约中。假设两类投资者：有技能的投资者（WarrenBuffetts）和没有技能的投资者（Bernie
    Madoffts）。Bernie Madoffts无法创造真实的超额收益，但他们很聪明，能在一段时间内模仿获得看上去与Warren Buffett们差不多的高回报，比如通过卖出期权（参见第10章），但他们最终还是失败。Foster和Young（2010）指出，没有任何薪酬契约能仅仅基于历史业绩来区分有技能的和没技能的管理人。这与我们在第10章中讨论过的防操纵组合评估措施形成了对比，那些措施确实让我们能够（最终）从统计上辨别真实技能。但任何能筛选仿仿者Bernie
    Madoffts的薪酬契约也会妨碍所有具备真实才能的WarrenBuffetts的参与。这似乎将资产所有者置干困境：如果能辨别出Bernie Madoff，将无法雇佣Warren
    Buffet；而如果你能雇佣WarrenBuffet，你可能也雇佣了BernieMadoff。


    若要越过Foster和Young（2010）上述令人沮丧的结论，关键是要注意到，在他们的分析中薪酬契约是个仅仅基于管理人历史收益的函数。这其实非常普遍：它出现在奖金、回补款以及所有线性和非线性契约中，但它限制资产所有者只看历史收益。一个直接的启示是，我们应该不仅仅看历史收益。我们需要管理人持仓和投资策略具有透明度，还应考虑管理人名誉以及与他们投资管理业务相关的其他所有信息。机构投资者应该对单独管理账户（separately
    managed account）可作为一种让管理人交易完全透明化的方法比较熟悉。


    ① Li and Tiwari（2009）展示了这点。


    ② 参见Dybvig, Farnsworth and Carpenter（2010）以及He and Xiong（2011）。'
  merge: -1
  img_proc: true
- pgno: 520
  md: '披露是解决委托投资管理中代理冲突的一种重要方法。大量研究表明，费用支付的更大透明度能够降低代理成本，为投资者带来更好业绩⁽¹⁾。遗憾的是，基金管理人利用费用的模糊化为自己谋利。绑销销售或者让费用结构更不透明会导致投资者的收益更低或基金管理人的报酬更高。财务顾问通常从共同基金公司收取回扣，因此其有动机将投资者引向业绩不佳的产品或者不适合资产所有者的产品。如果这些回扣越透明，那么资产所有者越能看清其他代理关系对其利益的影响。


    # 代理人也有职业生涯考虑


    代理人为现有委托人服务，但他们也希望培养与未来委托人的关系。也就是说，代理人也有职业生涯的考虑。Chevalier和Elli son（1999）对共同基金管理人的劳动力市场进行了研究。研究发现，当业绩不好时，年轻的经理人更容易被开除。年轻的经理人不愿与众不同————他们紧跟基准并愿意持有更传统的组合。这样更有理由要采用有效的因子基准：一个年轻的经理人通过承担非线性因子风险（这种因子风险没有反映在普通的标普500基准中）来为委托人的最大利益而行动，如果仍然采用普通的标普500基准来衡量，那么当经理人业绩落后于标普500时，其很可能会被解雇。因子基准对代理人和委托人都有利。


    # 3.5 支付财务顾问和资产管理人


    支付方式有多种。


    **佣金**：许多财务顾问的角色就是经纪人，他们通过向客户卖出产品而获得报酬（有可能很多）。这让财务顾问有动机将客户引向错误的基金，也鼓励他们向客户推荐进行过度交易以最大化交易费用。Bergstresser,
    Chalmers和Tufano（2009）研究指出，经纪人销售的基金业绩往往落后于直接销售的基金，甚至在扣除任何分销费用之前！对于他们的客户而言，经纪人并未展现出市场择时能力或更胜一筹的资产配置能力。我将Bergstresser,
    Chalmers和Tufano这一令人沮丧的研究结果看作是委托代理问题的最佳例子之一：经纪人将其自身利益放在首位。投资者应该尽量不以这种方式来向财务顾问支付报酬。


    **基于AUM的费用**：基于在管资产规模（AUM）的费用是顾问费中常见的形式，


    > ⁽¹⁾ 例如，参见Gabtzow and Laibson（2006）、Stoughton, Wu and Zechner（2011）以及Edeleen,
    Evans and Kallor（2012）。有些经济学家，比如Carlson and Manso（2010），甚至构建了基金管理人可用来欺骗资产所有者的费用模糊化（fee
    obfuscation）最优化的模型。'
  merge: -1
  img_proc: true
- pgno: 521
  md: '代表着85%的顾问公司收入¹。基于AUM的费用模式在机构投资者中占大多数。按资产的一定比例来确定费用的问题在于，如果市场表现好，即使代理人毫无作为，AUM也会增长。那么资产所有者为什么要为顾问或基金管理人并未付出的时间和精力而支付费用呢？


    基于AUM的费用模式的历史由来比较有趣。第一位独立投资顾问Arthur Clifford于1915年在加利福利亚州帕萨迪纳市开始经营，他对其服务收取固定费用²。这与基于佣金的费用模式形成对比，后者会带来较大利益冲突。在美国另一端的波士顿，Theodore
    Scudder于1919年创立了Scudder, Stevens & Clark公司为客户提供独立的投资建议。该公司收取所有交易额的1%作为费用——这是一种基于佣金的机制。Scudder发现这样并不能产生足够多的收入，而且这会鼓励过度交易从而与公司的投资理念相悖。所以他转换至一种利润高得多的模式——按比例收取在管资产的1%作为费用。上述两个例子中，Clifford和Scudder都是革新者，因为其他人都是收取基于佣金的费用。在很长一段时间，免佣金的顾问仅限于给富有的客户提供投资建议。遗憾的是，Scudder的比例费用而非Clifford的固定费用最后成为行业的惯用模式。


    机构投资者大部分都基于（主要是经纪业务）佣金来支付费用的现象一直持续到20世纪60年代。那时，有几家机构确实是按1%收费，但会用经纪佣金来抵扣这些费用³。摩根银行（Morgan
    Bank）在20世纪60年代末率先按在管资产的0.25%来收费，当时人们预测摩根银行会损失一些业务，但事实上仅有一个账户离开，而摩根银行成为整个行业的领头羊。慢慢地，比例费用开始逐渐升高（而不像预计的那样因为竞争而下降）至现在的水平。


    如今，基于AUM的费率对个人投资者高达1%，对机构投资者略低于50个基点。正如Charles Ellis（2012）所说，“投资者本来就拥有这些资产，因此投资管理费用实际上应该是基于投资者所获取的管理人为其创造的收益。”在代理理论的框架下，Ellis其实是说，吸引代理人参与的固定费用实在是有些过分的高了，而能反映代理人所真正增加的价值的激励费用又太低了。投资者支付较高的费用也可以，如果这些费用能够促使业绩上升从而增加AUM而不是立刻减少AUM的话。尤其对于机构投资者来说，这意味着更多的费用应该基于激励机制，而基于AUM的费用应该少得多。个人投资者也应该不再采用基于AUM的费用模式，但我也不推荐激励费用的比例太大，我


    +   ① FA Insight of Tacoma 2010年的调查。报道于“ How to Pay Your Financial Adviser ”，华尔街日报，2011年12月12日。

    ② 摘自Charles Schwab 2007年出版的书*The Age of Independent Advice: A Remarkable History*。

    ③ 参见Ellis（2012）。'
