    同样的，我们可以用这个逻辑来解释信用利差之谜$^{\textcircled{1}}$。低增长或衰退对于股票和债券都是一段“不景气时期”（这与第8章对股票的分析相同）。这些股票的“不景气时期”，对于公司债也是“不景气时期”。在这些时期中，公司业绩不佳，出现了更多的违约事件，股东为保住公司价值而选择提前进行公司清算。根据4.2节的结构性信用模型，当发生衰退时，清算边界就随之上升。即相比于公司在经济繁荣时违约，如果公司在经济衰退时违约，债券持有者可以回收的资金比例也将变少。这样，在“不景气时期”，公司债投资者与股东都面临着相同类型的宏观风险敞口。高信用利差相对于信用损失率偏高，反映了投资者的风险厌恶情绪，因为当公司债损失发生在经济衰退时，这恰好是投资者承受能力最低的时间点。只有当投资者在经济衰退时承受住高损失，才能最终将公司债的风险溢价收入囊中。


    # ### 4.4 公司债的流动性风险


    流动性风险——在市场上以低成本进行交易的能力——是决定公司债回报率的重要因素。Collin-Dufresne、Goldstein和Martin（2001）认为流动性风险、宏观经济风险以及整体金融环境风险合起来可以解释40%的信用利差变化。Longstaff、Mithal和Neis（2005）发现，信用利差中所有的非违约成分都可以被归因于流动性。在金融危机中，流动性对于决定公司债回报率起了至关重要的作用。图9.14显示了从2006年1月至


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_315_0.png)


    **图9.14 Baa级债券与国债的利差和流动性，相关系数 = 0.96**


    ① 如需了解这些模型，参见Chen、Collin-Dufresne和Goldstein（2007）和Chen（2010）。'
