- pgno: 159
  md: '中很常见，由Sharpe（1992）提出。这与下面一种情况相关，并且经常一同被采用。


    # （4）资产—负债匹配


    这是比久期匹配更为普遍的一种情况。在资产—负债的匹配中，我们可以使用除了久期之外的其他因子来对负债的特征进行匹配：除了利率、期限以外，还包括流动性和因子敏感性。


    我们将Merton和Samuelson对于长期资产配置的建议扩展到负债便是：首先偿付债务，然后用第2节与第3节中的相同方法对扣除负债现值之后的额外财富进行投资，将短视市场组合与机会型长期组合结合使用。


    对于长期投资者而言，美国国债通常既不是无风险资产，也不是最优的负债对冲资产。就像一些主权财富基金和家族基金会遇到的情况一样，如果投资期限超过可获得的无风险债券的最长期限，那么投资者就无法投资与之期限相匹配的无风险资产。此外，很多投资者的负债属于实际负债（Real），而非名义负债（Nominal）。但是，如果要考虑其他的因子，那么长期实际债券也不算是最优的负债对冲资产。对于养老金计划来说，这些因子包括长寿风险，经济增长和信用风险。个人投资者可能面临通货膨胀风险，例如医疗费和大学学费，这些通常并未被完全计入广义的通胀指数中。负债对冲组合关注的是，哪些类型的资产（或更广义地说，哪些类型的因子，参见第14章）能在投资者面临最糟糕的情况时，仍能在负债到期时提供偿付支持。比如，如果负债水平在信用利差收窄时上升，正如养老基金所面临的状况，那么负债对冲组合必须持有大量对信用风险敏感的资产。


    万一从一开始就无法偿付这些债务呢？很遗憾的息，这种情形目前发生在很多投资者身上，特别是公共养老基金。比如CalPERS，截至2010年6月30资金比率（即资产对精算负债的比例）仅为65%。严格来说，第2节和第3节提到的Merton-Samuelson资产配置建议，只适用于能够偿付债务的情况，无论是看债务的现值还是构建了负债对冲组合之后的情况。如果资产不足以偿付现有负债，那么投资者必须面临的事实是，在某些情况下可能发生违约。构建组合可以使得违约概率最小化，但是如果想避免破产，则需要一个不同的最优化，而不是仅仅最大化公式（4.2）中的效用。在某些情况下，如果资产价值远低于负债价值，那么对于投资者而言，提高风险偏好是最优的。这被称作孤注一掷（Hail
    Mary pass）的选择——没有什么可以失去的，反正可能无论怎样都会破产①。


    ① Ang, Chen and Sundaresan（2013）表明，在一个有着下行风险的负债驱动投资框架下，这种行为是最优的。Andonov，Bauer
    and Cremers（2012）认为美国的公共养老基金因其使用的折现率是基于其资产收益率，所以有动机承担更多的风险。他们认为，基金的资金越是不足，对于风险资产的投资比例就越高。'
