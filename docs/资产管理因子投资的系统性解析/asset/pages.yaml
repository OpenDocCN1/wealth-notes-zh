    # # 4.1 安全第一


    在安全第一的效用框架中，正如该名字所示，投资者追求的是资产安全第一。Roy（1952）提出的效用非常简单：只取决于资产组合的收益率低于还是高于预设水平，若低于预设值，取值为0，反之取1。也就是说，如果收益率低于该水平，则是灾难性的结果；如果高于该水平，那么灾难则会被避免。安全第一即是最小化灾难发生的概率，它对于那些首要任务是偿付债务的投资者来说是理想选择。这并不令人意外，因为安全第一首先控制了下行风险，在此框架下的资产配置方法非常直截了当：先保守性地持有安全资产，直到满足预设水平，在满足安全水平后，再去承担尽可能多的风险。


    一个相关的理论是 Manski（1988）和Rostek（2010）提出的分位数效用最大化理论。在该理论中，投资者关心给定概率水平下可能发生的最糟糕结果。分位数指的是在概率密度函数上所对应的概率截点。分位数是对于投资者悲观情绪的直观衡量。例如，资产所有者可能会关注在90%的情况下可能会发生的最糟糕结果。在这个例子中，相关结果就是在0.1分位数（第一个十分位数）上会发生什么\(1\)。另一位资产所有者可能关注的是有50%可能性会发生的最糟糕结果，即在0.5分位数（中位数）上会发生什么。在Manski-Rostek效用下，分位数像风险厌恶水平一样，是一个参数选择，用于衡量投资者对待下行风险的态度。因为分位数参数选择是衡量投资者对下


