  md: '费之后会跑输市场，在收费前的收益略微跑赢市场或打平市场¹。Treyner（1965），Sharpe（1966）和Jensen（1969）是最初集中研究业绩的学术文献。现已退休的哈佛商学院教授Michael
    Jensen所著文章，被引用的次数最多²。这些研究报告发现积极型共同基金并没有打败市场，而这个结果也在很多后续的学术研究中证实。


    Russell Wermers（2000）的论文很好地总结了相关历史文献。在他的样本中，标普500取得的年收益率为15.4%。共同基金在费前的收益为16.9%，跑赢了市场；但在费后的年收益率为14.6%，平均每年跑输市场0.8%。但是，历史收益高的共同基金可能只是在市场上升时期大量持有风险高的股票。在对市场因子和其他风险因子（特别是市值、价值—成长和动量因子，参见第7章）进行调整后，Wermers发现费前超额收益（或称alpha，参见第10章）为0.8%。而在收费之后，其超额收益为-1.2%。


    两名研究实证资产定价的巨头，分别就职于芝加哥大学和达特茅斯大学的Eugene Fama和Kenneth French（2010）估算股票共同基金费前超额收益仅为0.2%，在统计上等于零，而在调整市场因子之后的费后超额收益为-1.1%³。积极型的共同基金费后跑输市场1.3%。在控制了更复杂的风险因子之后，共同基金的费前超额收益仅为0.1%，相应的费后超额收益为-1.0%。


    在成为美国金融协会主席的致辞中，French（2008）更进一步阐释了这一点。他计算了包括美国股票市场的个人投资者、共同基金、养老基金和其他机构投资者，以及对冲基金的积极管理成本。他估计如果从积极管理转向指数基金投资，一般投资者每年可以多获得0.7%的收益。


    虽然作为一个整体，积极型基金跑输市场，但是在熊市或者经济衰退时期它们是否跑输得较少（或许略有增加价值）？相关证据是喜忧参半的。一方面，Moskowitz（2000）和Kosowski（2012）研究发现积极型共同基金在经济衰退时期（根据美国国家经济研究局定义）有显著的超额收益。但De
    Souza和Lynch（2012）研究发现刚好相反。


    说到底，不管是否调整风险，典型的积极型共同基金带来的平均超额收益为负。


    > 本段中为未提到的其他重要研究包括Grinblatt and Titman（1989）、Sharpe（1992），Mal Kiel（1995），Gruber（1996）、Fama
    and French（2010）。关于进一步的文献综述，参见Ang, Goetzmann and Shafer（2011）。


    > Jensen由于引入了以期权形式对公司管理人进行激励的激想法而闻名。他的论文Jensen and Murphy（1990）导致了90年代期权支付形式的盛行。此类实践与90年代互联网泡沫齐头并进。Treyner（1965）、Sharpe（1966）和Jensen（1969）研究也很引人注目，因为这些是CAPM模型最初的应用。Treyner和Sharpe也是该理论突出的发展人（见第6章）。


    > 一般的债券共同基金业也不产生超额收益。参见Blake, Elton and Gruber（1993）和Person, Henry and Kissen（2006）根据Buss,
    Gaya and Wahal（2010）的研究，机构型基金表现也不佳。'
