  md: '一基金而言，最重要的决策是承担多大的风险和追求何种因子风险溢价$^{1}$。负责做出该决策的是董事会成员，通常他们拿到的薪酬最低且知悉的情况最少。而报酬最高的基金外部管理人，处于倒金字塔的最底层，通过寻找难以捉摸的阿尔法
    $\alpha$（相对于基准的超额收益，参见第10章）实现的收益其实对基金的影响最小。他们得到的报酬最多，但 他们所做的事情却最不重要。


    公共养老计划以及许多私营养老计划，常常表现出低效率的官僚主义。这些基金为其所能支付的薪酬水平所束缚；人才和技能为对手方所掌握，使自己沦为华尔街掠食者的猎物。打造一个汇聚投资精英的机构并非易事。薪酬水平很重要。但最为重要的是搭建一个强调责任和问责制的管理架构，对员工要有足够严格的考核基准，并且考核不达标的员工要承担后果。一些机构通过创建独立的管理组织来对抗官僚主义。加拿大养老金计划（Canada
    Pension Plan）是由一家独立的国有公司进行管理，该公司可以设定自己的工资标准，雇佣自己想要的员工。其目的是尽可能远离政客的干扰$^{2}$。挪威主权财富基金是由中央银行下属的一个单独部门进行管理，这种结构允许基金的运营一定程度上独立于央行的其他部门。


    # 代际公平（Intergenerational Equity）


    国家养老金计划和固定收益计划通过几代人付出和得到不同的退休金金额来保障退休安全。支付给一代人的社会保障养老金必须由他们的下一代人来提供资金，而私营固定收益计划则必须由家长式的公司长期出资。


    在一个可持续的养老金计划中，所有各代人账户的总和必须为零：一代人享受的退休福利必须由另一代人来提供。Blake（2006）指出社会保障体系中存在着巨大的代际不平等现象。出生于20世纪二三十年代的人成为“根据各代人账户来看，历史上最受青睐的一代”，而最不受青睐的是如今的年轻一代。


    某些形式的代际不平等实际上是最优的。代际风险共享的模式允许可社会保有能 力消化对某一代人来说是灾难性的冲击，比如大萧条来袭时正处于收入高峰期的那 一代人，并通过好几代人来分散消化冲击所造成的影响$^{3}$。在固定收益计划中，雇主帮助在不同员工群体之间平滑风险。如今许多养老金计划中的不平等现象非常突出，


