  md: '# 5. 将税收作为一个价格因子


    税收显然会影响个人行为，但是否会对资产价格产生影响呢？关于这个问题，最初有两个思想流派。Miller和Scholes（1978）（是的，就是那个声称自己缺乏专业税务知识的诺贝尔奖得主Scholes）表示，虽然某一个人会受到税收的影响，但平均投资者不受其影响，税收并不是价格的影响因子之一。我们可以直观地将投资者分成两组：税率低的一组，倾向于持有税负高的资产，例如高股息股票；税率高的一组，倾向于持有税负低的资产，例如不派息股票$^{①}$。这样一来，税收应该与均衡定价无关。


    另一学派认为典型的投资者受到税收的影响，并且税负（反向）影响股价。增加的税负应该由更高的预期收益来补偿。Brennan（1970）提出了符合这一思路的第一个模型。实证数据明显更支持这一学派。税收的确是影响价格的因子之一。


    税收通常从两个方面影响定价$^{②}$。其中之一涉及股利分配中的税收惩罚观（dividend tax penalty），即高股息股票因为股息所适用的税率比资本利得税率高而处于劣势。另一方面，市场表现好的股票给股东带来累积的资本利得。为了避免支付资本利得税，持有太多已升值股票的投资者会比在正常情况下卖出更少的股票。税收在投资者购买股票时不会产生影响，因为这种行为不会产生资本利得。因此，对于累积了大量资本利得的股票来说，其价格必定更高，而预期收益率会降低，诱使重仓的投资人卖出更多的股票。这是符合税收资本化（tax
    capitalization）假说的一个例子，从长远来看可以导致价格发生逆转。


    Sialm（2009）指出税收效应同时存在于对股票收益的时间序列分析和横截面数据分析。Sialm计算了预期税负，即对股息、短期资本利得和长期资本利得所征收的税负总和。正如Constantinides（1983）提出的税收时机选择所预测的那样，资本利得的税负金额很小。Sialm指出，当税负高时，整体市场估值处于低位。这是体现在时间序列的效果。基于横截面数据分析，Sialm指出税负高的股票（高股息股票）有更高回报。这些回报超出了Fama-French规模、价值和动量因子模型的预测值。这种变量控制是非常重要的，因为高税负的股票很可能支付股息，并且这些股票更可能是价值股，我们已经知道价值股通常有高回报（参见第7章）。Sialm发现，在控制了Fama-French模


    > ① Miller and Modigliani（1961）也曾预测，税率高的投资者会青睐低股息的股票，反之亦然。这篇文章并不关注与税收之间的平衡；其主要结论是公司价值独立于公司的股利政策，这一结论在Modigliani和Miller分别于1985年和1990年获得诺贝尔奖时曾被援引。


