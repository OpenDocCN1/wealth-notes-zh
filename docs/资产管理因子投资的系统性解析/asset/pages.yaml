  md: '图4.9—D将“买入并持有”策略（公式（4.19））和再平衡策略（公式（4.20））的收益，表达为第2期末股票价值的函数。虚线表示“买入并持有”策略，即没有再平衡的策略。它的损益与股价呈线性相关。相比之下，再平衡策略的收益与股价呈凹函数（Concave）关系。如果股价在到期日回到1.0，那么再平衡策略让投资者获得更多财富（当$S_{ud}=S_{du}=1$时，再平衡策略为1.2136，“买入并持有”策略为1.0840）。不过当股价低（$S_{dd}=0.25$）或高（$S_{uu}=4$）时，再平衡策略的表现则不如“买入并持有”策略，抵消了之前的影响。


    再平衡策略的这种非线性收益可以等价地通过卖空期权头寸模拟产生。这种策略卖出价外（out-of-the-money）看涨或看跌期权，因此是卖空波动率。


    假设存在一个执行价为3.6760美元，到期日为第2期末的欧式看涨期权。该看涨期权在第2期末的收益情况如下：


    ```

    $\begin{gathered} C_{uu} = \max(4.0000 - 3.6760, 0) = 0.3240, \\ \text{或} \ C_{ud}
    = \max(1.0000 - 3.6760, 0) = 0 = C_{du}, \\ \text{或} \ C_{dd} = \max(0.2500 -
    3.6760, 0) = 0 \end{gathered}$    公式（4.21）

    ```


    在第0期，该看涨期权的价值是0.0428美元$^{①}$。


    同时还有一个行权价为0.4660美元，到期日为第2期末的欧式看跌期权。该看跌期权在第0期的价值为0.0643美元，它在第2期末的收益情况如下：


    ```

    $\begin{gathered} P_{uu} = \max(0.4660 - 4.0000, 0) = 0, \\ \text{或} \ P_{ud}
    = \max(0.4660 - 4.0000, 0) = 0 = P_{du}, \\ \text{或} \ P_{dd} = \max(0.4660 -
    0.2500, 0) = 0.2160. \end{gathered}$    公式（4.22）

    ```


    现在对比以下策略：


    表4.1


    | 策略 | 第0期 | 第2期 | 第2期 | 第2期 |

    | :--- | :--- | :--- | :--- | :--- |

    | | | $S_{uu} = 4$ | $S_{ud} = S_{du} = 1$ | $S_{dd} = 0.5$ |

    | 卖出看跌期权 | +0.0643 | 0 | 0 | -0.2160 |

    | 卖出看涨期权 | +0.0428 | -0.3240 | 0 | 0 |

    | 买入债券 | -0.1071 | 0.1296 | 0.1296 | 0.1296 |

    | 买入并持有策略 | 1.0000 | 2.8840 | 1.0840 | 0.6340 |

    | 卖空波动率 + 债券 + 买入并持有 | 1.0000 | 2.6896 | 1.2136 | 0.5476 |

    | 再平衡策略 | 1.0000 | 2.6896 | 1.2136 | 0.5476 |


    ① 这可以用风险中性定价方法估值。看涨期权的价值在第0期的时候为$\frac{q^{2} \times 0.324}{(1.1)^{2}} = 0.0428$，其中q为风险中性概率，由$q
    = \frac{1.1 - 0.5}{2 - 0.5} = 0.4$得出。为了解风险中性期权定价，请参见Bodie, Kane and Marcus（2011）。式（4.22）中看跌期权的价格在第0期是$\frac{(1-q)^{2}
    \times 0.216}{(1.1)^{2}} = 0.0643$。'
