  md: '信托的一个缺点是难以被取消（许多信托是不可撤销的）。当然，不能随意动用信托资金是一个优势，但同时也构成某种形式的流动性约束。无论是标准Merton模型，还是Huang基于标准Merton模型所做的税收调整后的模型扩展，并未考虑非流动性风险或约束。我们将在第13章介绍考虑了这些非流动性风险或约束的资产配置模型。


    # 4.5 税收、消费、投资及其他决策


    投资者在把握消费和投资决策时机方面也会利用税收为自己谋利。有些做法可以看成是纯粹的税收套利。典型例子是Black（1980）及Tepper（1981）提到的养老基金税收套利。文中指出，养老基金为公司进行某种形式的税收套利提供机会，具体做法是公司（养老基金发起人）可以通过从外部融资，将融资本息抵税，并将融到的资金投入到养老基金。养老基金本身是免税的，于是很自然地成为购买高税率资产的客户，比如公司债券和美国国债。企业通过其对养老基金的出资获得了税收减免，养老基金则得以通过一个节税效率高的工具来安置高税率资产。而且，因为公司的实质是股票，Black-Tepper税收套利实际上是允许公司通过投资债券来赚取股权风险溢价。


    Frank（2002）提供了关于公司运用Black-Tepper税收套利策略的实证。文章指出，公司养老金计划中持有债券的金额与税收优惠之间存在正相关关系。不过Black-Tepper策略远远没有得到有效运用。至少仅从税收角度来看，公司养老金计划似乎持有了太多股权。当然也许出于其他理由这反而是最理想的情况，正如第1章所提到的那样。


    公司的养老金支出可以在税前进行抵扣。当适用税率高的时候，公司会战略性地调整养老金缴款时点。这种做法现在已经受到限制，因为依据1987年发布的税收法案（the
    1987 Tax Act），当养老基金已经过度筹资超过150%时，公司新的缴款不能在税前扣除。针对公司从资金过剩的养老基金转出资产的做法，1990年发布的税收法案（the
    1990 Tax Act）将适用的消费税率上调至50%。同样的道理也适用于个人，当适用高税率时，向慈善机构及养老基金等出资所带来的税前抵扣会更有价值。


    最后值得注意的是，终极的经济决策是对死亡时间的选择，从而减少、甚至在某些情况下完全避免缴纳所得税，这听上去让人有点毛骨悚然。美国在2010年时还没有征收遗产税。坊间证据显示，人们试图将死亡日期推迟到2010年，这样一来他们的继'
