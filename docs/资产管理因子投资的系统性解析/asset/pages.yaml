  md: '则选用倍数为衡量指标。基金也可以选择它们所希望的基准——即使是在收益已经产生的情况下。据Harris、Jenkinson和Kaplan（2012）报道的相关轶事指出，VE是一个比较容易被打败的基准，所以大多数GP选择使用该基准。甚至初始投资年份都是可以被操纵的。初始投资年份到底是指基金开始募资的年份，募资结束的年份，还是第一笔交易完成的年份？


    关于排名在第一象限的管理人有超额表现的这一发现也是事后分析的结果，也就是说，我们在检测所有数据之后才知道哪些是表现一直优异的基金。现实是，我们很难用手头信息去挑选基金。假设基金ABC
    IV于2010年募集的。当2013年募集基金ABC V时，我们最多有关于基金ABC IV 3年的数据：在基金ABC IV清算之前（即2020年左右甚至之后），我们无法知道该基金是否确实位居第一象限。因此，在2013年我们手中仅有一点关于基金ABC
    IV的实时信息，并只能以此为基础来决定是否投资基金ABC V。利用仅在基金募资时点可获取的信息来做决定，会大幅削弱持续性预测的准确度$^{\text{1}}$。


    而且，仅掌握关于公司ABC的信息还远远不够。关系和管理人员能力在PE投资中有着举足轻重的作用。很多排名在第一象限的基金根本不对普通大众开放；而对普通大众开放的基金通常都远落后于第一象限。另外，并不是公司本身有多重要——重要的是组建该公司的合伙人$^{\text{2}}$。


    最后，PE行业与其他资产管理行业一样，也呈现出规模收益递减的特征。Kaplan和Sichlar（2005）以及其他研究显示，规模与PE业绩表现之间呈强负相关性。也就是说，PE规模越大，其业绩表现越差。


    # 3.6 学术与业界的对比


    尽管学术界对PE投资的态度不够乐观甚至十分负面，但业界从业人员却对PE投资大肆赞扬。例如，根据一个PE基金的行业组织—私募股权成长资本委员会（Private
    Equity Growth Capital Council）公布的数据，截至2011年底PE业绩表现与标普500指数相比，其一年、五年和十年期的超额收益（扣除费用后的净收益）分别为7.1%、5.7%和7.6%$^{\text{3}}$。


    为什么数据之间会如此矛盾呢？


