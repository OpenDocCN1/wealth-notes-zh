  md: '其中，$r_s$是CalPERS的回报率，$r_m$是标普500股票指数回报率，$r_b$是债券组合回报率——这里我们采用Ibbotson Associates长期公司债总回报指数。为了获得一个基准组合，我们加入限制条件：


