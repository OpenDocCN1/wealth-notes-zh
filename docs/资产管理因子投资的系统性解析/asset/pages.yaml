  md: 'Sharpe Ratio = \frac{E(r) - r_f}{\sigma} 公式（2.8）


    在图2.9中，美国股票的夏普比率为0.53，该值使用样本区间内平均股票回报率和1%的无风险利率\( \widehat{ \widehat{ \widehat{
    } } } \) 计算得出。夏普比率实际上是一种零成本交易策略：在图2.9的情形下，该策略买入股票并卖空国债，再除以股票的风险。这就是每位风险（标准差）的收益（平均超额收益）。我也会使用原始夏普比率（Raw
    Sharpe Ratio），有时也被称为收益风险比，即：


    Raw Sharpe Ratio = \frac{E(r)}{\sigma} 公式（2.9）


    该比例并未减去无风险利率。在图2.9中，股票的原始夏普比率为0.58。


    涉及一种风险资产和一种无风险资产的最优资产配置问题，可通过找出CAL与最高的无差异曲线的切点来求解。图2.9显示了风险厌恶水平 \( \gamma = 7
    \)（图A）和 \( \gamma = 2 \)（图B）的两个切点。在 \( \gamma = 7 \) 时，投资者持有40%的股票和60%的美国短期国债。CAL上的切点位于正方形符号标出的股票仓位的左侧。在
    \( \gamma = 2 \) 时，资产所有者持有杠杆的资产组合。这位风险承受能力更强的投资者持有的股票仓位要激进得多。她通过做空无风险资产进行融资，最终持有的头寸为\(-39%\)的无风险资产和\(139%\)的股票。无差异曲线的切点位于正方形符号标出的股票仓位的右侧。


    在仅有一种风险资产和一种无风险资产的简单情形下，风险性资产最优权重w*的解析解为：


    w* = \frac{1}{\gamma} \frac{E(r) - r_f}{\sigma^2} 公式（2.10）


