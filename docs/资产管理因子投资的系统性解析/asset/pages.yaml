    $。抵押贷款是一种负债，其金额并不会因为他们的退休账户中持有的是股票还是债券而改变。然而如果他们在401(k)计划中持有更多股票的话，在公共养老金计划中通过精算估计与他们相关的养老金负债竟神奇般地变小了。当然从经济学角度来看，这纯属捏造，因为这对夫妻在401(k)计划的投资回报不会影响到他们的抵押贷款负债。


