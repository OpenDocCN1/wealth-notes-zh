  md: '风险溢价是基于投资者偏好而言的（ \( \bar{\gamma} \) 是所有投资者的平均风险厌恶程度，该平均值是采用单个投资者的风险厌恶程度并按其财富占比加权而来）。


    根据公式（6.1）的CAPM模型，随着市场波动率上升，其他条件不变，市场的预期收益将有所提高，与此同时股票价格相应下降。2008和2009年间，我们就已经历了波动率陡升和股票价格暴跌。这段时期股票的预期收益很高（2009和2010年的已实现收益确实很高）。公式（6.1）中市场风险溢价与市场方差成比例是较为直观的，因为在CAPM模型下，投资者具有均值一方差偏好：投资者不喜欢方差，而喜欢预期收益。市场组合是所有组合中与市场均值相同、但波动率最低的组合，或者说市场组合具有最高的风险报酬比率（或夏普比率）。市场消除了所有非系统性风险，剩下的风险则需要获得补偿，公式（6.1）给出了市场风险溢价的精确公式。随着平均投资者对方差的风险厌恶程度变高（即
    \( \bar{\gamma} \) 值变大），那么市场的风险溢价也相应提高。


    # 3.5 CAPM结论5：风险源于因子敞口


    单个资产的风险是根据该资产的因子敞口来衡量的。如果某因子具有正的风险溢价，那么因子敞口越高，该资产的预期收益也相应越高。


    CAPM模型的第二种定价方式是传统的贝塔定价方式，也被更正式地称为证券市场线（SML）。如下面公式所示，股票i的收益为 \( r_{i} \)，无风险收益为
    \( r_{f} \)，SML指出任一股


    ```

    E( r_{i} ) - r_{f} = \frac{\mathrm{cov}\left(r_{i}, r_{m}\right)}{\mathrm{var}\left(r_{m}\right)}(E(
    r_{m} ) - r_{f})


    = \beta_{i}(E( r_{m} ) - r_{f})


    公式（6.2）

    ```


    个的风险溢价即 \( E\left(r_{i}\right) - r_{f} \)，是与该股票贝塔 \( \beta_{i} = \mathrm{cov}\left(\left(r_{i},
    r_{m}\right) / \mathrm{var}\left(r_{m}\right) \right) \) 相关的函数。贝塔是用于衡量个股如何与市场组合联动的指标，如果联动影响越大（
    \( \mathrm{cov}\left(r_{i}, r_{m}\right) \) 越高），那么资产的贝塔相


    越高，那么资产的贝塔相应越高。


    本书不对公式（6.2）进行正式推导$^{\oplus}$，但公式本身已给出较好的直观逻辑：即均值一方差投资主要在于多元分散化投资能够带来好处。贝塔——CAPM模型中用于衡量风险的指标——可作为衡量分散化程度不足与否的指标。贝塔可用
    \( \beta_{i} = \rho_{i, m} \sigma_{i} / \sigma_{m} \) 来表示，其中 \( \rho_{i, m} \)
    是资产i的收益与市场收益的相关性， \( \sigma_{i} \) 是资产i收益的波动率， \( \sigma_{m} \) 是市场因子的波动率。第3章强调了某资产与组合的相关性越低，则组合的多元分散化效果


    > $^{\oplus}$ Bodie、Kane and Marcus（2011）在MBA教材中论述了相关推导．Cvitanic and Zapatero（2004）对此进行了更严格的推导。'
