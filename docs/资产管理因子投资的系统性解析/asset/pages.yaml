  md: '中到那些报酬较好的任务上。当代理人被要求执行多项任务时，或者任务不容易被衡量时，最优的激励契约接近于不含任何激励契约的固定工资模式。Holmstorm和Milgrom认为，这正是为什么在许多情况下我们并未看到激励薪酬或只看到很少的激励薪酬。对于个人投资者，财务顾问提供的是难以衡量的多维度服务，所以财务顾问的薪酬刚好符合Holmstorm和Milgrom所说的类型。财务顾问的薪酬中只有很小一部分应该基于激励机制。


    与此同时，基于AUM的费用或是按净资产和收入一定比例收取的费用都有许多缺点。对于小的散户投资者，我的建议是找到一个收取固定费用或小时费用的财务顾问（这种财务顾问的数量正在不断上升）。确保你支付足够多的报酬，以使最好的财务顾问来为你工作。对那些固定费用并不覆盖的服务，再支付额外费用。


    然而，基准仍然非常重要。基准使得投资者能看到财务顾问增加了哪些价值，即使顾问所收到的相对于基准的激励报酬很少。使用的基准应该是投资者自己也能在没有顾问的情况下以低成本进行投资的标的，例如：指数基金的简单组合、一个“标准”目标日期基金（“default”
    target-date fund）（尽管这有许多缺点；参见第5章），或者对更成熟的投资者来说，一个简单的因子组合（参见第14章）。其实，大部分财务建议都导致客户的业绩落后于简单基准：在对俄勒冈大学系统（Oregon
    University System）的研究中，Chalmers和Reuter（2012b）发现，使用经纪人的投资者其业绩落后于没有使用经纪人的投资者1.5%以上$^{\text{①}}$。客户支付的经纪人费用占了0.9%，剩余部分则是由于经纪人推荐了风险更高的组合，那些组合中塞满了费用昂贵、表现还不如简单基准的产品。当顾问给出好的建议时，你应该支付较好的薪酬，但想要识别出好的建议，你需要一个透明且较难战胜的基准。


    # 3.6 小结


    在资产管理中，代理关系往往有多样性。例如，咨询顾问的角色经常会导致另一系列的代理问题，而不是解决资产所有者与基金管理人之间现有的问题。解决一个代理关系可能会加重另一个代理关系的问题。


    我提供几条建议：


    +   ① 采用传统的静态（类似于标普500）基准的线性契约本身用处不大，而且在最糟糕的情况下会导致管理人破坏组合价值。（这是无关性结果。）


    $^{\text{①}}$ Karabulut（2010）以及Mullainathan, Noah and Schoar（2012）也发现平均水平的财务顾问并没有增加多少价值。与Chalmers
    and Reuter（2012b）一样，他们也证明了财务建议与更低的风险调整后收益相关联。'
