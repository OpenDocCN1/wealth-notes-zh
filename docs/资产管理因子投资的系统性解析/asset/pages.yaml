    # 5. 特殊的均值—方差组合


    在本小节中，我对多个组合策略进行了“赛马”比较，其中每一个策略都是均值—方差策略的特例。分散化是所有这些策略的共同点，但它们构建分散化组合的方式不同，因此业绩表现也非常不同。


    # 5.1 赛马


    我选用四种资产类别——美国政府债券（巴克莱美国国债指数，Barcap U.S. Treasury）、美国公司债券（巴克莱美国信用债指数，Barcap U.S.
    Credit）、美国股票（标普500指数，S&P 500）与国际股票（明晟欧澳远东指数，MSCI EAFE），并跟踪不同组合从1978年1月至2011年12月期间的表现，数据按月取样。在t时点构建的策略是根据前五年（t-60至t）的数据估计得来。我采用1973年1月至1978年1月的数据，在1978年1月底构建了各策略的第一个组合。每个组合的持有期为一个月，然后在月末根据更新的历史数据构建新的组合。我使用1个月期限的美国短期国债作为无风险利率。在构建组合的过程中，我将每种资产类别的卖空比例限制在-100%之内。


    采用短期滚动样本进行估计，会使我受到前一节所述的质疑。我故意这样做是因为它能够凸显出无约束的均值—方差方法的一些缺陷，从而帮助我们理解为什么有些均值—方差的特例表现得好，而另一些却表现不佳。


    我在以下几种策略之间进行比较：


    +   均值—方差权重（Mean-Variance Weights）策略：该策略中的资产权重可以实现夏普比率最大化。


    +   市值权重（Market Weights）策略：该策略中的资产权重由每种指数的市值决定。


    +   多样化权重（Diversity Weights）策略：该策略中的资产权重由Fernholz、Gary和Hannon（1998）所推荐的市值权重（幂次）变换得到。


    +   等权重（Equal Weights）策略：或称1/N法则，该策略对每种资产类别的持有比例均为1/4。Duchin和Levy（2009）将该策略称为“塔木德法则”（Talmudic
    Rule），因为巴比伦塔木德在大约1500年前推荐过这种策略：“一个人总是应该将财富的三分'
  merge: -1
  img_proc: true
- pgno: 120
  md: '之一用于土地，三分之一用于经商，三分之一留在手边。”


    风险均配（Risk Parity）策略：这类策略比较流行，资产权重与各自身差的倒数成比例（风险均配（方差）），或者与各自动力率的倒数成比例（风险均配（波动率））。“风险均配”这一术语最早由Edward
    Qian于2005年提出$^{①}$。由于桥水基金（Bridgewater Associates）的巨大成功，该策略在业界人士中名声大噪。桥水基金是一家大型的对冲基金，其企业文化被外界推崇至极$^{②}$。该基金于1996年发行了首支基于风险均配理念的投资产品——全天候基金（All
    Weather fund）。2011年桥水基金的创始人Ray Dalio赚取了39亿美元$^{③}$。桥水基金的成功激励了许多效仿者。风险均配最初使用方差加权，但也有人喜欢用波动率加权$^{④}$。


    最小方差（Minimum Variance）策略：该策略构建的组合即我们之前提到过的均值—方差前沿最左端的组合。


    等风险贡献（Equal Risk Contributions）策略：该策略的资产权重使得每类资产对总组合的方差贡献相等$^{⑤}$。


    Kelly（1956）法则（Kelly Rule）策略：该策略可以最大化预期对数收益。长期来看，它将使财富最大化。（我会在第4章中做具体解释。）


    与夏普比率成比例（Proportional to Sharpe Ratio）策略：该策略对过去五年中实现夏普比率最高的资产持有更大的仓位。


    在上述样本中，100%持有美国股票的投资组合的夏普比率为0.35。除了最不受约束的均值—方差组合之外，它被所有的分散化投资组合打败。这与第2节提到的例子所给出的建议一致，即人们不应该持有100%美国股票的组合；分散化能够带来收益更高、风险更低的更优组合。


