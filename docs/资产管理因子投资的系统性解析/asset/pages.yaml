  md: '模型，然后根据标准传递函数假设，运用公式（13.2）过滤出真实收益率，该收益率是由当期和历史滞后的观测收益率所组成的复合函数①。要正确的完成这些工作，需要优秀的统计技能、还要求掌握非流动性市场结构背后的经济学知识，从而能解释什么是合理的滞后结构并判断需要多大程度的去平滑化。


    # （4）非平滑的房地产收益率


    为了说明去平滑化的影响，图13.2展示了源于美国房地产投资信托委员会（National Council of Real Estate Investment
