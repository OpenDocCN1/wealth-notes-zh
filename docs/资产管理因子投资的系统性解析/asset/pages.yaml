- pgno: 344
  md: '# 检验不可交易的非线性属性


    通过在因子回归公式的右边加入非线性项，我们可以比较容易地检验出基金回报率是否呈非线性属性。常用的包括平方项，例如 $r_t^2$，或者类期权项，例如 $\max(r_t,0)^{①}$。该方法的不足之处在于，加入这些项以后，阿尔法就不存在了——我们总是需要在公式右边有可交易的因子才能计算阿尔法。


    我们必须找到一种比阿尔法更合适的衡量指标，在存在动态操纵的情况下，仍能有效地衡量管理人的能力，并对他们的业绩进行排名。目前最好的一种衡量指标是Goetzmann等（2007）引入的$^{②}$。在有足够长时间样本的情况下，该指标的衡量效果无法被扭曲，因为卖出现权不会产生错误的业绩衡量结果。


    Goetzmann et al.使用的衡量指标是：


    $$\frac{1}{1-\gamma} \ln \left( \frac{1}{T} \sum_{t=1}^{T} (1 + r_t - r_{rf})^{1-\gamma}
    \right) \tag{公式（10.16）}$$


    其中 $\gamma$ 被设定为3。各家基金可以根据该指标的数值高低进行排序，数值最高的基金即是最好的。公式（10.16）让我们想起第2章关于效用函数的介绍，它确实是一种CRRA或者幂效效用函数（更准确地说，它是CRRA效用函数的确定性形式）。Goetzmann等人的研究中提到，晨星公司（Morningstar）使用的是该指标的一种变型形式：


    $$\left( \frac{1}{T} \sum_{t=1}^{T} \frac{1}{(1 + r_t - r_{rf})^{\frac{1}{2}}}
    \right)^{-\frac{1}{2}} - 1$$


    这也是一种CRRA效用函数，其中风险厌恶系数 $\gamma=2$。


    # 3.5 阿尔法是否真的存在？


    由于阿尔法是基于一个基准而言的，阿尔法的估计对该基准的设定非常敏感，那么，到底是否存在真正的阿尔法呢？也许获得阿尔法仅仅是因为基准设定有误。学术文献将此称为联合假设问题（joint
    hypothesis problem），寻找阿尔法其实等同于检验市场有效性$^{③}$。该领域的一个主要贡献是Hansenand和Jagannathan（1997）的研究，其


    > ① 分别参见Tremay and Mazuy（1966）和Henriksson and Merton（1981）。

    ② 如要了解其他一些著名的“免于操纵的”业绩衡量方法，参见Glosten and Jagannathan（1994）和Wang and Zhang（2011）。

    ③ 如要了解这类文献的综述，参见Ang, Goetzmann and Schaefer（2011）。'
