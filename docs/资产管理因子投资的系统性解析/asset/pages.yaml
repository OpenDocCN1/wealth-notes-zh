  md: '文章指出，我们总可以在事后找到一个基准组合，使得基金无法获得阿尔法。该结论在事前意义不大，但它至少表明，我们总能构建一个基准组合使得阿尔法法在事后并不存在。自Grossman和Stiglitz（1980）的研究以来，业界认识到完全有效的市场并不存在（参见第6章）——所以应该存在阿尔法法——但是正如本节分析所示，即使对于像Buffett那样的著名投资大师，也很难获得在统计上显著的阿尔法法。


    该联合假设问题——即阿尔法法和基准是同时被决定的——对于资产所有者而言非常关键。例如，如果一个资产所有者自身无法获得规模、价值一成长以及动量因子的敞口，那么我们就不能武断地判断富达没有获取相对这些因子的阿尔法法。对于该资产所有者，富达可能提供了阿尔法法。而对于另外一个资产所有者，由于他自己就能够获取合适的因子敞口（并实施相应的复制因子基准组合），那么富达提供的阿尔法法可能是负值。


    正确地选择一系列因子，对于资产所有者而言是最相关的问题，我将在第14章中再次对此进行分析。阿尔法法主要是关于因子基准（或者缺乏因子基准）的一种表述。现在我们对风险调整有充分的认识以识别不同的阿尔法法机会，接下来我们将分析近期引发了许多讨论的一种阿尔法法来源。


    # 4. 低风险异象


    低风险异象是以下三种效应的结合，其中第三种效应是前两种的结果\textsuperscript{\textcircled{1}}：


    +   ① 波动率与未来收益呈负相关；


    ② 已实现贝塔值与未来收益呈负相关；


    ③ 最小方差组合会比市场表现更出色。


    风险异象是指，以市场贝塔值或波动率来衡量的风险，与回报率呈负相关。哈佛商学院教授以及Martingale资产管理公司顾问Robin Greenwood在2010年曾说：“我们一直在反复检验数据，试图寻找除了规模、价值或者动量之外的异象。但事实上，所有非有效性的根源就在我们眼前——即风险异象。”


    \textsuperscript{\textcircled{1}} 如需了解第三种效应，参见Haugen and Baker（1991）、Jagannathan
    and Ma（2003）以及Clarke、de Silva and Thorley（2006）。'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 4.1 历史


    风险（至少是以市场贝塔值或波动率来衡量）与收益之间的负相关性由来已久。关于这种负相关性的研究始于20世纪60年代末期和20世纪70年代早期 $ ^{①} $
    。Friend和Blume（1970）检验了从1960～1968年间，股票组合收益与CAPM贝塔值和波动率的关系。结论如下：


    检验结果引人注目。在所有情境中，风险调整后的业绩均取决于风险。两者的关系是反向相关并在统计上非常显著。


    Haugen和Heins（1975）采用自1926～1971年的数据，对贝塔值和波动率与回报率的关系进行了检验。结论如下：


    我们的实证研究结果并不支持人们传统观念中的假设，即风险——系统性的或非系统性的——会产生特殊的回报。我们的研究结果表明，月度回报率的方差较小（即风险较低）的股票组合，长期来看获得了更高的平均回报率。


    人们可能已经忘记上述大部分结论了，但最近这些结论又大量出现。


    # 4.2 波动率异象


    2006年，我有幸与哥伦比亚大学商学院的同事Robert Hodrick教授以及两名学生Yuhang Xing和Xiaoyan Zhang合著过一篇文章，开启了对“风险异象”的新一轮研究。这两名学生现在分别已经成为莱斯大学（Rice
    University）和普度大学（Purdue University）的教授。我们发现，高波动股票的回报率“异常低”。它们的平均回报率几乎为零。该文章是我所有文章中每年被引用最多的，引发了很多后续文献对文中的结果进行重测、解释或者反驳
    $ ^{②} $ 。


    首先，波动率与回报率究竟是否相关？CAPM模型和许多扩展的多因子模型（参见第7章）的重要观点是认为股票收益的波动率自身并不重要。根据这些模型，预期收益是由资产如何与风险因子的协同变动所决定。在CAPM理论下，非系统性的波动率，或者跟踪误差（参见公式（10.3）），应该与预期收益完全无关。但是在那些由于顾客效应而被分割的市场中——其中一些市场参与者无法进行分散化投资，或者一'
  merge: -1
  img_proc: true
- pgno: 347
  md: '些市场参与者由于外部原因而更加偏好某类资产——非系统性的波动率应该与回报率呈正相关。直观地讲，市场参与者需要为承担非系统性风险而获得补偿，这使得非系统性风险与波动率在均衡状态下应当呈正相关。后来发展的模型中引入了“噪声交易者”，这些人的交易有随机性、与基本面估值无关，这使得高波动率通常伴随有高风险溢价①。


    Ang等人（2006）得出的结论则正好与此相反。


    尤其值得注意的是，非系统性波动率和总波动率与回报率之间具有稳健的负相关性。我们对规模、价值、杠杆、流动性风险、交易量、换手率、买卖价差、协偏度风险（co-skewness
    risk）、分析师预测的分散度以及动量等变量进行了控制。我们也没有发现总波动率风险能够解释我们的结果，尽管波动率是一个普遍存在的风险因子（参见第7章）。在Ang等人（2009）的后续研究中，我们发现，波动率效应在每个G7国家以及所有发达国家的股票市场中都存在。我们还对私有信息、交易成本、分析师覆盖度、机构投资者持有量、延迟指标（指股价对信息做出反应的速度）等变量进行了控制。偏度不能解释这种异象。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_347_0.png)


    # 滞后期波动率与未来回报率


    为了分析波动率异象，我采用自1963年9月至2011年12月的美国股票数据，构建了5个等分组合（每季度进行组合再平衡），并计算每个组合的月度回报率。我使用


    ① 如需了解顾客效应模型和噪声交易者模型，分别参见Merton（1987）和DeLong et al.（1990）。'
