    # 4. 实际债券


    实际债券是一种本金或票息与通货膨胀率挂钩的债券。这样，由于债券付息随通货膨胀率上升而增加，投资者可以在通货膨胀时获得保护。因此，债券的实际偿付金额在通胀调整后保持恒定。实际债券也被称作通胀挂钩债（Linkers）。


    美国的通胀挂钩债被称为“财政部通货膨胀保护型债券”（Treasury Inflation-Protected Securities, TIPS），于1997年开始发行。截至2011年12月31日，美国财政部共发行7390亿美元TIPS，占市场上所有可交易的国债余额的7.5%①。这类债券现在被官方称为“财政部通货膨胀指数型债券”（Treasury
    Inflation Indexed Securities, TIIS），但是除了官方政府文件外，市场参与者和所有文献中，仍然使用TIPS的名字。


