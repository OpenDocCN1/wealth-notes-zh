  md: '虽然共同基金在注册投资公司中持有的资产最多，但其市场占比在缓慢下降。在2000年，共同基金占所有注册投资公司资产的 96%，但2011年年末这个比例下降到了90%。


    与共同基金相反的是，封闭式基金（Close-End Funds）的股份不能赎回且数量固定（在基金成立之后可能会有二次发行，基金可能也会回购股份，但这些情况一般较少发生）。在首次公开发行之后，这些股份在二级市场上交易。相对于共同基金（须每日提供流动性），封闭式基金可投资于流动性较差的证券。


    共同基金和封闭式基金均由独立于基金的注册投资顾问管理。投资顾问的收入来自基金投资者支付的费用。通常，注册投资顾问受雇于基金发起人。基金的发起人通常是类似于
    Janus，创建和推广多个注册投资公司的资产管理公司。拥有相同品牌或基金经理的基金通常被称为共同基金家族（或综合体）。Janus基金家族包括所有用 Janus名称做推广的基金，例如Janus
    20基金，但 Janus也是例如INTECH基金等其他基金家族的发起人。


    基金发起人有时候可以将基金的管理外包给第三方（转包投资顾问）。这些外部管理的基金通常在一个基金家族的框架下进行推广。American Skandia保险公司就曾使用Janus作为转包投资顾问来管理自己的基金。在Janus由于科技泡沫破灭出现灾难性损失之后，American
    Skandia于2002年终止了与Janus的合作关系①。共同基金公司采用转包给无关联的投资顾问的形式获得专业化的管理服务，而这些转包投资顾问也获得相应的分销渠道②。Chen，Hong和Kubik（2010）的研究显示，外部管理的基金跑输了共同基金家族内部管理的基金。


    单位投资信托（UTIs）是共同基金和封闭式基金的混合体。与封闭式基金相似，单位投资信托发行固定数量的股份（单位）。与共同基金的股份相似，这些单位可赎回，但单位投资信托的发起人维持一个二级市场让股份可在投资者之间进行买卖。单位投资信托购买和持有一系列资产直到预设的终止日期，此时单位投资信托被解散，投资款项退还给股东。单位信托一旦成立之后，一般
    情况下其所持有的资产不再交易。不同于共同基金和封闭式基金，单位投资信托如此简单，他们并不需要董事会或投资顾问；但单位投资信托仅仅是投资公司中的极少一部分（参见图16.2），因此在本章中不单独讨论它。但是，单位投资信托种类最近有所增长，这是因为某些交易所交易基金在技术上被归类为单位投资信托。


