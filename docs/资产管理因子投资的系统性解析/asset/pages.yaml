  md: '经习惯的生活方式而感到非常痛苦。例如，国家和大学发现很难将支出削减到某个水平之下，并且这些水平（或者习惯）会随着时间不断上升。在生命周期模型中使用习惯形成效用函数会在生命后期产生非常平滑的消费路径①。这样的投资者需要在工作时储蓄很多来为退休后的生活提供资金，并在退休后继续储蓄（需要在生命周期的所有年龄段积累大量财富）。


    # 棘轮消费（Ratchet Consumption）


    Dybvig（1995，1999）提出了棘轮支出（ratcheting spending）模型，这对希望维持支出水平的投资者应该具有吸引力；该模型在投资升值足够大时甚至允许支出增加②。为了维持支出模式，投资者需要在资产组合中配置一部分无风险资产。这部分无风险资产可以被认为是确保未来最低支出的保险，被称为负债对冲组合（liability-hedging
    portfolio）。资产组合中余下的部分投资于（加了杠杆的）股票组合。当风险资产升值足够多时，投资者增加支出，并可将部分升值资金转移到无风险资产以保证支出水平的提高。


    虽然Dybvig的研究框架对那些不希望生活水准下降的捐赠基金、个人甚至国家来说是理想的，但在目前情形下遵循棘轮支出法则有两个挑战。首先，现在的利率非常低（撰写本书时，实际利率为负，参见第11章），根据Dybvig模型得出的必要最低支出率非常非常低。其次，负债对冲组合中很大一部分是债券——目前债券的期望收益很低，甚至潜在为负。遗憾的是，天下没有免费的午餐。


    通过以退休问题为起点开始往前推算，生命周期模型说明了对退休者而言真正的无风险资产不是美国政府短期债券。无风险资产是能锁定实际退休支出增加的证券③。能做到这点的唯一方法是持有一个可完全满足退休者退休后现金流需求的实际债券组合（TIPS，参见第11章）。但是，实际债券的价格波动很大，由于实际利率会随着时间变化，通过实际债券为退休后生活提供资金会让投资者面临很大的投资风险。目前的负实际收益率意味着投资者不能指望靠债券收益来达到储蓄目标，而是不得不留出更多资金以应对退休需求。


    +   ① Fuhrer（2000）和Michaelides（2002）最早将习惯形成效用函数引入生命周期模型。参见Polkovnichenko（2007）。

    ② Dybvig（1995，1999）的棘轮消费模型是固定比例资产组合保险的一种动态一般化（dynamic generalization）。该模型是由加州伯克利大学的金融系教授Hayne
    Leland和Mark Rubinstein提出，并通过自己的公司LOR（Leland-O''Brien-Rubinstein）进行推销。该模型被认为是导致1987年股市灾难的重要原因。参见Bernstein（1992）对这段历史的描述。Riedel（2009）拓展了Dybvig的原始建模，允许跳跃和厚尾过程。

    ③ 参见Bodie（1990b）和Campbell and Viceira（2001）。'
