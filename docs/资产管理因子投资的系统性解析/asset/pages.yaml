    所以，即使是伯克希尔·哈撒韦，也不得不对规模报酬递减的规律。


    # 市值规模和价值—成长基准


    Eugene Fama和Kenneth French，两位在金融领域最具影响力的学者，在1993年引


    ① 来自伯克希尔·哈撒韦2010年致股东信。'
