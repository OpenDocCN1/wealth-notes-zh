  md: '图8.3-A显示，股票与通货膨胀的短期相关性较低，低于10%。往右看四至五年期，相关性最高达到30%左右，然后在十年期逐渐降为20%左右。然而，美国短期国债却是很好的通货膨胀对冲工具。在短期、当小于一年时，美国短期国债与通货膨胀的相关性在20%以上，然后逐渐稳步增加到十年期的60%左右。由于股票收益本身不能很好地对冲通货膨胀风险，美国短期国债能够很好地对冲通货膨胀风险，而股票超额收益是从股票收益中减去美国短期国债收益，因此股票超额收益与通货膨胀的相关性要低于股票本身与通货膨胀的相关性。前者在一年期内为零左右，在三至四年期达到最大值10%左右，然后在七年期变为负数。显然，从股票收益与通货膨胀联动的情况来看，股票是一种较差的通货膨胀对冲工具，尽管股票有较高的平均收益$^{①}$。


    真实的情况甚至比图8.3-A更糟糕。图8.3-A采用的是皮尔逊（或称为经典的）相关性分析，这是大部分研究文献和业界所主要采用的。图8.3-B则画出了斯皮尔曼（或称为稳健的）等级相关系数。斯皮尔曼相关性分析对异常值也是稳健有效的，异常值会极大地影响简单相关性的计算。结合B图可看出，A图中的有些相关性是由异常值造成的，具有欺骗性；B图中的稳健相关性比A图中的简单相关性衡量结果要低。尤其是与股票超额收益的相关性现在在所有期限都为负，一年以上是在$-20%
    \sim -10%$。


    股票收益与通货膨胀的相关性随着时间也会变化，正如图8.4所示。图8.4画出了股票超额收益与通货膨胀之间的十年滚动经典相关性和稳健相关性。在20世纪40年代和20世纪50年代中有些年份的相关性为正，但从20世纪50年代以后都为负。近期，在2000年之后，相关性很少为正（即使是正数，也低于10%），至少用简单相关性来衡量是这样，而考虑了异常值之后的稳健相关性则一直为负。尽管正负符号时有变化，但股票超额收益与通货膨胀的相关性从未超过20%，事实上还曾低于-40%。


    美国短期国债则是一种很好的通货膨胀对冲工具，其与通货膨胀的三至五年期相关性接近0.5，因为短期利率直接反映了预期通货膨胀率。这可通过费雪假设和货币政策行为来解释，我将在第9章讲到这点。然而，一个好的通货膨胀对冲工具并不意味着具有高名义或实际收益；一个好的通货膨胀对冲工具只是一种倾向于与通货膨胀发生联动的资产。就收益而言，美国短期国债仅仅好战胜通货膨胀而已。样本中美国短期国债的平均收益为3.5%，而长期平均通货膨胀率为2.9%。相比之下，股票的长期平均收益为9.3%，轻易地战胜通货膨胀。股票表现不错——股票溢价较高（参见第2和第3节），但股票并不与通货膨胀联动，这让股票成为较差的通货膨胀对冲工具。'
