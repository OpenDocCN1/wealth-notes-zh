  md: 'Duncan在与他的财务顾问兼会计师讨论后，仍旧感到困惑。他的事业蒸蒸日上，不断产生盈利，但这样的成功带来一系列新的问题：比如各项税收，当然 Duncan承认这是他需要面对的一个很好的问题。


    Duncan认真考虑了财务顾问提供的投资清单，内容如表 12.1 所示：


    | 私募基金会 | 10.00% |

    | --- | --- |

    | 战术型对冲基金 | 12.00% |

    | 公司债券 | 7.00% |

    | 市政债券 | 5.00% |


    他的会计师强调，其实上述信息并不是 Duncan 所应该关注的数据（这不仅仅是因为这些数据并没有考虑潜在的因子风险，参见第7章）。他告诉 Duncan： “这个行业流传着这么一句话：重要的不是你究竟挣了多少钱，而是你账户最终留下多少钱。”
    2013 年，Duncan 所适用的联邦所得税税率为 39.6%。他为收到的长期资本利得上缴 23.8% 的税金（20% 的资本利得税税率加上 3.8% 的医疗保险附加费）。因此，这些投资的净回报预测如下¹：


    | 私募基金会 | 长期资本利得税税率 23.8% | 7.62% |

    | --- | --- | --- |

    | 战术型对冲基金 | 短期资本利得税税率 39.6% | 7.25% |

    | 公司债券 | 所得税税率 39.6% | 4.23% |

    | 市政债券 | 免税 0% | 5.00% |


    ¹ 这个例子忽略了州所得税。我住在纽约市，需要缴纳纽约州州税和纽约市城市税。这两个行政区域城将长期资本利得视为经常性收入征税。不过 Duncan 可以居住在德克萨斯州，这样就不必担心需要缴纳州所得税。'
