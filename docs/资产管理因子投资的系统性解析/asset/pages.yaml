  md: '发行的债券。市政债券的市场很大：截至2011年底的可流通债券余额约为3.7万亿美元，大约是美国国债市场规模的1/3。联邦政府对普通市政债券的票面利息及发行折扣（Original
    Issue Discount）免征所得税。此外，对于本州免税机构发行的债券票面利息及发行折扣，个人投资者免缴州所得税。不过还有一些市政债券，涉及缴纳联邦所得税和替代性最低税（alternative
    minimum tax），所以投资人要小心甄别$^{①}$。


    免税的市政债券市场是美国所独有的。在其他国家，投资者持有市政债券的利息收入需要缴纳国家所得税。而在美国，市政债券的利息收入免征联邦所得税，这是由于宪法规定联邦政府与州政府彼此分离（即联邦制）。在1895年波拉克诉农民贷款和信托公司案（*Pollack
    v. Farmers’ Loan and Trust*）中，最高法院关于宪法的相 关解释是不允许联邦政府向各州征税。简单地说，一个政府不可以向另一个政府征税。但在1988年，最高法院在南卡罗来纳州诉贝克案（*South
    Carolina v. Baker*）中推翻了免税的宪法基础，因此市政债券的免税规定目前属于国会的职权范围。现在时不时有呼吁要求取消免税规定，不过恐怕只有一个无所畏惧的国会才会这样做$^{②}$。


    债券发行时，票面利息与发行折扣是等同的。发行人可以在支付更高的利息与给予更优惠的发行折扣之间取舍。因此，如果利息是免税的，那么发行折扣也必须免税。发行人充分地利用了这一点：市政债券市场中仅10%的债券是平价债券（par
    bonds）；而绝大多数公司债券都是按面值发行$^{③}$。


    个人是市政债券的主要持有者。图12.1揭示了1952～2012年市政债券持有者的分布情况。家庭持有既包括直接持有，也包括通过共同基金、交易所交易基金（ETFs）以及封闭式基金间接持有（参见第16章）。自20世纪90年代初起，家庭持有近80%的市政债券。其中，50%是直接持有，剩下的30%是间接持有。在20世纪70年代，商业银行持有的市政债券比例高达50%，但由于后来商业银行持有市政债券所享受的大多数减税优惠被取消，其持有市政债券的比例降至不足10%$^{④}$。


    个人持有市政债券的好处在于联邦政府对发行折扣和债券利息免征所得税。因


    ① 市面上述流通有应税市政债券、比较出名的包括建设美国债券（Build America Bonds）；参见Ang，Bhansali and Xing (2010a)。


    ② 取消市政债券免税待遇的呼吁不是近期才出现的：Ott and Meltzer (1963) 曾指出从1920年至1943年一共有114项议案要求废除关于市政债券的免税规定


    ③ 参见Ang，Bhansali and Xing (2010b，Table 1)。


    ④ 目前市面上还有一些市政债券，商业银行在持有时可以享受税收优惠，但这些债券的规模都限制在1000万美元以下。商业银行可以在税前扣除这些市政债券账面成本的80%。美国2009年通过的复苏法案暂时允许银行扣除债券账面成本的80%，最高不超过商业银行总资产的2%（即所谓的2%最低条款），所适用的债券类型更为广泛，并且将1000万美元的发行规模调高至3000万美元。'
