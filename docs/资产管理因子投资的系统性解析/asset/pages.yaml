  md: '列。Alpha是基金随后一年在风险基准之上的超额收益。图16.4显示alpha的均值，相对于资本资产定价模型和多因子基准均为负数，这意味着一般共同基金跑输了基准。资本资产定价模型的alpha呈现有趣的持续性，但它是不对称的。过去一年业绩最差的基金持续表现较差，相对市场基准的超额收益为-5.4%，而过去一年业绩最好的基金持续表现较好，产生的alpha为2.4%。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_544_0.png)


    图16.4 共同基金Alpha


    如果使用复杂的因子基准，业绩的可持续性就消失了。在多因子基准模型中各组基金在随后一年的alpha均为负数。注意最差的基金持续表现最差，最差10%的基金随后一年产生的alpha为-4.8%，显著低于最好10%的基金随后一年产生的-1.4%的alpha。在多因子基准中我们控制了动量因子，这是导致业绩持续不再存在的主要原因$^{(1)}$。很多业绩出众的基金持有动量型股票，即历史收益较高且持续表现较好的股票。在调整了动量因子带来的高收益之后，业绩出众的基金不再获得超额收益。


    # 有些基金可以带来超额收益


    的确有共同基金能够跑赢市场，但我们很难发现能持续表现优秀的基金。即使是宣称有可能发现表现优良的共同基金的教授们也“承认他们的策略对机构投资者比对个人投资者可能更加适用，因为这需要对基金收益的大数据库进行复杂的统计运算。”$^{(2)}$


