  md: '图13.1-A展示了初始价格为1美元的某资产价格变化。图中曲线上各小圆圈代表着每个季度末的观测值。在绘制图13.1时，我采取了模拟法并特意选取一个样本路径，即价格先涨后跌来反映21世纪初
    “失去的十年” 期间的股票情况。图13.1-B的价格看起来没有显得过于波动；采用A图价格计算出的季度收益的标准差为0.23。


    图13.1-B则描绘了每日收益真实数值的变化，这些数据和A图相比显得更为波动。B图的日样本价格变动区间为向下低于0.7、向上则超出3.0，而A图的季度数据则仅在1.0和2.5之间变动。基于B图日度数据计算出来的季度收益波动率为0.28，比A图季度样本计算出来的季度收益波动率0.23要高。


    为了进行全面比较，图13.1-C描绘出季度样本收益和日度样本收益，即将A图和B图叠加在一张图上显示。低频样本数据导致采用季度样本收益数据所计算的波动率估计值太小。贝塔值和相关性估计值存在同样的影响——低频样本导致风险估计值有向下的偏差①。


    # 3.3 收益率去平滑化


    为了解释低频交易产生的偏差，我们需要从图13.1涉及季度样本的A图转向涉及每日样本的B图来说明。也就是说，季度观测到的收益过于平滑，我们需要通过某些工具来提炼出真实的、夹杂着更多噪音的收益数据。这一过程被称为去平滑化（unsmoothing或de-smoothing），最初算法是由麻省理工大学著名的房地产领域教授David
    Geltner（1991）、以及Stephen Ross和Randall Zisler（1991）创建的。Ross教授同时也是多因子模型的构建者（参见第6章），Zisler这位房地产专家则是以学者身份开始其职业生涯。Ross和Zisler的文章最初源于20世纪80年代末为高盛写的一系列报告。该方法论得到进一步扩展并成为现在被广泛引用的文献。


    去平滑化是一个过滤问题。过滤算法通常用于将信号从噪声中分离出来。当我们在高速公路上驾驶并用手机通话时，我们的手机会遇到干扰——来自高速立交桥和高大建筑物——或当我们经过的那片地区没有足够的手机塔而导致信号不佳。电信工程师运用聪明的算法来增强信号，即传导我们的声音来屏蔽静电干扰。完整的传输包含信号和噪音，所以真实的信号要比完整传输更加稳定。因此标准的过滤问题旨在消除噪音。其与去平滑化的重要差异在于去平滑化是将
    “噪音” 加回到公布的收益率，以反映真实的收益率。


    ① 参见Geltner（1993）和Griff和Young（1996）关于低频观察数据偏差分别对贝塔值和相關性的影响。Geltner估计房地产收益的贝塔值就低估了0.5个因子。这不是个
    “小样本” 问题，即样本足够大时间问题不再存在 这是一个 “种群” 问题，会在下节解释。'
