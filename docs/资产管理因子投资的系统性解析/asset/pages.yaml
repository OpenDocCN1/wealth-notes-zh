  md: '对手还可能临阵逃脱$^{①}$。在金融危机时期没什么交易，很多流动性资产也经历了流动性冻结——因为找不到买家，所以不论什么价格都没有交易。


    # 5.2 考虑低频交易后的资产配置


    我在Ang，Papanikolaou和Westerfield（2013）中设计了一个资产配置模型，模型中投资者只有在发生随机流动性事件时才能交易非流动性资产。这种非流动性概念是指通常情况下非流动性资产缺乏流动并且不能用于交易。但是当流动性事件发生时，投资者可以交易。


    我采用带有参数$\lambda$的泊松分布过程来模拟流动性事件的发生率，流动性事件的区间是$1 / \lambda$。就房地产或者私募股权投资而言，交易区间为大概每10年左右发生一次，所以$\lambda
    = 1 / 10$。随着$\lambda$增至无穷大，再平衡的机会就会越来越频繁，而在该值有限的情况下标准的Merton（1981）模型认为交易会持续发生。因此，$\lambda$代表了一系列非流动性结果。


    泊松分布事件自Perter（1982）以来就被用于模拟有搜索摩擦的情况，Perter于2010年获得诺贝尔奖·之后的一年，他被提名在美国联邦储备委员会（Federal
    Reserve Board of Governors）任职，但他的提名因遭到共和党反对而被否决。


    非流动性风险使得投资者对流动性和非流动性资产都表现得更加规避风险。非流动性风险导致随时间变化的内生性风险规避。哈佛捐赠基金在2008年发现尽管其资金充裕，但还是无法“吃掉”非流动性资产。非流动性财富与流动性财富是不同的；代理人只能消费流动性财富。因此，非流动性财富对流动性财富的偿付比率会影响投资者的组合决策和支出规则——它会成为驱动投资者有效规避风险的一个状态变量。


    从Ang、Papanikolaou和Westerfield（2013）的模型，我们可得出以下重要结论。


    +   - 非流动性显著减少了风险资产的最优持有比例


