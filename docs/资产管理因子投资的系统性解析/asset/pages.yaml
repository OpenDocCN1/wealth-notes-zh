  md: '即被投资公司的估计价值。上述三种衡量指标都不是收益率，而且可能会对业绩衡量产生极大的误差ⁿ。更糟糕的是，这三类指标还经常被人操纵。


    # ### 3.1 IRRs


    牛津大学专门从事PE研究的教授Ludovic Phalippou（2011）曾直言不讳地指出：

    “最常用的业绩衡量指标IRR并不能提供有用的信息，而且可能会对业绩衡量产生较大误导；该指标通常会夸大基金的真实表现。”


    IRR可以通过下述公式中投资的现值 ($PV$) 等于零来（隐性）界定：


    ```

    $PV = \sum \frac{Dist(t) - Call(t)}{(1 + IRR)^{t}} = 0 \quad \text{公式 (18.1)}$

    ```


    其中$Dist(t)$是基金支付的分红，$Call(t)$是基金召集的资金。


    在图18.2中，我画出了由Harris, Jenkinson和Kaplan（2012）计算出的IRR。图18.2显示了初始投资年份从1984年至2008年间基金的内部收益率。Harris,
    Jenkinson和Kaplan的研究列出了关于IRR、倍数以及可获取PME的最长时间序列，所有计算都采用相同的数据集从而可以相互比较。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_609_0.png)


    从图18.2可以看出，并购投资基金和风险投资基金在整个样本期间的平均内部收益率分别为15%和19%。但这些平均值掩盖了随着时间推移而发生的很多变化：并购


