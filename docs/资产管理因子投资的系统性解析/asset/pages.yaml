  md: '资者。对于效用函数较平坦的资产所有者而言，在他们已经拥有很多财富时，并不太在乎财富的增长。不景气时期是指边际效用高的时期，即效用曲线非常陡的时候：在这些点上，资产所有者非常非常想多要1美元（“兄弟你能送我个硬币吗？”）因为额外的每1美元都有很大作用。景气时期则是指边际效用低的时期，在图2.3即是指资产所有者的财富水平较高，且拥有平坦的效用函数。他们已经很满意了（“前景一片大好”），因此并不看重额外的1美元。


    投资者的风险厌恶程度（Degree of Risk Aversion）决定了他们在不景气时期的痛苦程度。从技术上讲，风险厌恶程度决定了效用函数在财富接近于零时斜率增加的速度，以及财富趋近正无穷时，效用函数变平坦的速度。风险厌恶控制了资产所有者效用函数的凹度。


    正如“二鸟在林不如一鸟在手”，每个人都想要手中有鸟。风险厌恶的另一种解读是，它衡量投资者对确定性事件的偏好度。考虑图2.4的效用函数，有两种结果：X（低）和Y（高）。假设它们出现的概率相同。由X和Y引出的两条垂线分别对应着资产所有者在财富水平低和高时的效用U(X)和U(Y)。考虑这两个财富结果的中点\(\frac{1}{2}X
    + \frac{1}{2}Y\)，如果财富确定地等于\(\frac{1}{2}X + \frac{1}{2}Y\)，那么资产所有者的效用则是该点引出的垂线与效用曲线的交点\(U(\frac{1}{2}X
    + \frac{1}{2}Y)\)给出，该交点用星号标记。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_63_0.png)


    现在考虑连接\(U(X)\)和\(U(Y)\)的直线。如果未来财富为X或Y的概率均为\(\frac{1}{2}\)，则'
