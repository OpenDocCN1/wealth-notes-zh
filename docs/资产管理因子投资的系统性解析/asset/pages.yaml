- pgno: 274
  md: '高，正如在大萧条时期、20世纪50年代早期、20世纪70年代末至20世纪80年代初以及2001年一样。2008年当股票在金融危机期间下跌时，股息率处于非常低的水平。但在这期间，盈利收益率则开始反向变动，因为金融危机导致盈利减少了很多，而股息支付不易变化。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_274_0.png)


    “什么驱动着股息率的变动？”其实与“什么可以预测收益？”是一样的问题。假设现金流是不可预测的，或者是独立同分布的（i.i.d.），那么在公式（8.4）中，预期收益可以用股息率来预测：当股息率高或价格低的时候，未来的预期收益就高。公式（8.5）表明，股息率的所有变动都是由贴现率变动所驱动。现在假设所有股息都来自现金流且贴现率为固定值，公式（8.4）表明，如果我们能预测公司的未来现金流，那么预期收益会随时间而变化，公式（8.5）则表明股息率的所有变化都来自于变化的现金流。


    股息率的变动究竟是由于贴现率变动，还是现金流变动还是两者都有呢？学术观点上对此仍有分歧。John Cochrane于2011年在美国金融协会（American
    Finance Association）作主席演讲时给出了一方观点，他指出，股息率的所有变动都来自预期收益，而不是现金流。由于Campbell（1991）和Cochrane（1992）的研究，这一观点曾在金融界较为盛行，尽管同时期持异议者认为收益是不可预测的（例如，1993年的Goetzmann和Jorion）。Campbell–Cochrane的观点是，股息是独立同分布的，股息率预测预期收益，而不是预测未来现金流。然而，在Bansal和Yaron（2004）解释股票溢价的研究框架中，则是完全相反的情况。根据Bansal和Yaron的理论，几乎所有股息率变动都来自于现金流，实质上并没有贴现率作用$^{1}$。根据公式（8.4），风险溢价仍然是


    +   ① 在Bansal和Yaron的研究中是有贴现率作用，因为存在随机波动率，且无风险利率是随时间变化的。但这些部分的变化很小。'
