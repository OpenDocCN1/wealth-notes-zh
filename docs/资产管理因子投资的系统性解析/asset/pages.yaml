  md: '和17.1%。与在NBER所定义的经济衰退期和经济扩张期的表现相一致，政府债在低增长时期表现相对较好：在GDP低增长时期平均回报率为10.0%，而在GDP高增长时期回报率仅为3.9%。


    所有资产的收益在经济衰退期或低增长时期都有更强的波动性。例如，大盘股的波动率在经济衰退期为23.7%，而在经济扩张期仅为14.0%；政府债在经济衰退期虽然具有更高的收益，但波动率也相应更高为15.5%；而其经济扩张期的波动率仅为9.3%。将整个样本期间的资产波动率与经济衰退期和经济扩张期的波动率相比很有意思。我们会发现：资产的波动率在不景气时期通常会更高。


    # ### 2.2 通货膨胀


    如表7.1所示，高通货膨胀对股票和债券都不利。高通货膨胀期间，所有资产表现都欠佳\(\)\(^{①}\)。大盘股在低通货膨胀期间的平均回报率是14.7%，而在高通货膨胀期间仅为8.0%。政府债、投资级公司债和高收益债在低通货膨胀期间的回报率分别是8.6%、8.8%和9.2%，而在高通货膨胀期间则分别为5.4%、5.3%和6.0%。高通货膨胀会影响债券价值，这不足为奇：由于债券通常有固定的现金给付，高通货膨胀会减少债券的真实价值。令人惊讶的是股票——其代表对真实、有生产力的企业的所有权——在高通货膨胀下表现更差。我们将在第8章对股票的抗通胀特性做进一步分析，但目前我们可以说高通货膨胀对股票和债券均有不利影响。股票和债券的部分长期风险溢价意味着对高通货膨胀时期其表现欠佳的补偿（我们将在第11章进一步探讨不同资产类别的抗通胀特性）。


    # ### 2.3 波动率


    波动率是一个非常重要的风险因子。我在此采用代表股票市场波动率的VIX指数来衡量波动率风险\(\)\(^{②}\)。表7.2基于1986年3月至2011年12月的月度数据，给出了股票和债券收益与VIX变动的相关性测算：


    > ① 尽管这里未做具体验证，但通货紧缩也是资产投资收益率低的不景气时期。


    > ② VIX指数是由芝加哥期权交易所构建的衡量标准500期权波动率的指标。VIX指数能捕捉与其上升变动相关的一系列风险，包括波动率本身以及跳跃风险和偏度风险。但VIX指数所捕捉的主要成分还是波动率和波动率风险溢价。'
