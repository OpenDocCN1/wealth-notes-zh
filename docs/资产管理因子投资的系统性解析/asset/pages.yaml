- pgno: 242
  md: '说，高贝塔股票往往在市场大跌时随之下跌。但长期来看，CAPM模型表明高贝塔股票能获取比市场组合更高的平均收益，以补偿投资者在不景气时期（CAPM理论所界定的市场回报较低时）所承受的损失。


    Robert Merton（1973），Stephen Ross（1976）及其他研究人员于20世纪70年代发展了多因子模型的理论框架，但直到二十年后才有大量实证研究表明，除市场以外的其他因子也很重要，比如Fama-French模型中的规模效应和价值效应。Fama和French并没有发现这些效应，他们只是提供了一种简洁模型来捕捉上述效应。对于这些因子的原创作者来说有些遗憾，因为关于这些风险因子的大部分荣誉都被授予了Fama和French。


    公式（7.2）中，Fama-French模型中除市场因子以外的第一个因子是SMB，代表小股票收益率减去大股票收益率的差值（所以用SMB表示），这里的小和就是指股票的市值大小。（Fama和French显然不是好的营销人员，所以给因子取了如此无趣的名字。）SMB因子旨在捕捉小公司相对于大公司的超额收益。


    Fama-French模型中的另一个因子是HML因子，代表高账面市值比股票组合收益率减去低账面市值比股票组合收益率的差值，账面市值比（book-to-market
    ratio）是账面价值与市值之比，或者说是将股票价值按账面价值标准化后的倒数。实质上，价值投资策略就是买入价格偏低的股票（可采用账面价值、销售收入、盈利或股利等对价格做标准化处理）并卖出价格偏高股票（也做合适的标准化处理）。学术界通常采用账面价值来标准化。因此，价值股是指相对账面价值而言价格较低的股票，成长股则是指相对账面价值而言价格较高的股票。价值效应是指平均来看价值股表现优于成长股的这一现象。当然投资者也可采用账面价值以外的其他指标来对价格进行标准化——业界人士在构建其专有的价值因子时会这么做。


    Fama-French模型中的SMB和HML因子是采用因子模拟组合来构建，分别用于捕捉规模和价值溢价，并采用了（CAPM和多因子模型中的）多元分散化概念来确保通过对大量股票进行投资来获取规模和价值因子效应。这些因子是偏离市场组合的多空组合（long-short
    portfolio）①。然而，由于不可能所有股票都是小盘股或都是大盘股，“平均股票”仅具有市场因子敞口。我们将对此进行更深入的探讨，因为这与CAPM模型关于平均投资者持有市场组合这一深刻观点是紧密相关的。


    假设Huffet是一只价值股，该公司的管理者喜欢以低于基本面价值（比如用账面价值来衡量）的价格买入其他公司的股票。在公式（7.2）的Fama-French模型中，


    > ① SMB和HML因子有时也被视为另类（或聪明）贝塔的例子。我偏好采用动态因子这一术语，是因为贝塔严格来说是用于衡量因子敞口的指标，而不是因子本身。投资者投资于因子组合，而非贝塔。'
