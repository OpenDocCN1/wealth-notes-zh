  md: '但是，无论$t + 3$的结果如何，我们已经解出最后一期的问题并求得了$t + 4$期的最优组合权重，$x^*_{t+4}$。因此，我们可以将最后一期之前两期的问题表示为从$t
    + 3$期到$t + 4$期的问题以及已经解出的从$t + 4$期到$t + 5$期的问题：


    ```

    $\begin{align} \max_{(x^*_{t+3}, x^*_{t+4})} & E\left[U(1 + r_{p,t+4}(x^*_{t+3}))
    U(1 + r_{p,t+5}(x^*_{t+4}))\right] \\ &= \max_{x^*_{t+3}} E\left[U(1 + r_{p,t+4}(x^*_{t+3}))
    U(1 + r_{p,t+5}(x^*_{t+4}))\right] \quad \text{公式 (4.11)} \\ &= \max_{x^*_{t+3}}
    E\left[U(1 + r_{p,t+4}(x^*_{t+3})) V_{t+4}\right] \end{align}$

    ```


    公式（4.11）中的第一个等式将最后一期的解替换为$t + 3$期的问题。于是现在只剩下$t + 3$期的组合权重$x_{t+3}$待解。第二个等式说明，这个问题是标准的单一投资期问题，只是它包含了间接效用函数$V_{t+4}$，但我们已经通过求解最后一期的问题充分了解了这个间接效用函数以及$t
    + 4$期的最优策略（公式（4.9））。我们可以按单一投资期问题对公式（4.11）求解，我们将$t + 3$期的最优权重记为$x^*_{t+3}$。它与公式（4.5）中的单一投资期解相同，除了我们将公式（4.5）调整为用间接效用函数$V_{t+4}$表达的$t
    + 4$期最优策略。图4.2-B用图形展示了这个过程。给定$t + 4$期已知的解，我们用$t + 4$期的最优组合权重解出$t + 3$期的最优组合权重。公式（4.11）同时也展示了“间接效用函数”的来源，因为前一个问题中$t
    + 4$期的间接效用函数被代入了当前$t + 3$期问题的直接效用函数中。


    通过解决最后一期之前两期的问题，我们可以得到$t + 3$期的最优权重，$x^*_{t+3}$。我们计算$t + 3$期的最大化效用，即$t + 3$期的间接效用函数：


    ```

    $$ V_{t+3} = E\left[U(1 + r^*_{p,t+4}(x^*_{t+3})) V_{t+4}\right] \quad \text{公式
    (4.12)} $$

    ```


    图4.2-C描述了给定$t + 3$和$t + 4$期的最优解后，如何递归推导出$t + 2$期的最优解。同样，$t + 2$期的最优化问题仍然是单一投资期的问题。在解出$t
    + 2$期的最优解后，我们继续推导出$t + 1$期的最优解，最后到初始期第$t$期。动态规划将长期问题分解为一系列的单一投资期问题（根据公式（4.11））。动态规划是一种极其有用的方法，Samuelson正是因为把该方法运用到诸多经济学领域而在1970年获得了诺贝尔奖。货币政策（参见第9章）、公司资本投资、税收和财政政策以及期权估值都是经济学中关于最优控制问题的例子，都可以运用动态规划求解。在连续时期内，价值函数是由Hamilton-Jacobi-Bellman偏微分方程的解给出。更为通用的形式被称为Feynman-Kac理论，在热力学中被广泛应用。这些都是再航天测控制飞机和弹道导弹方面发挥重要作用的物理和数学概念。所以组合选择确实是尖端科学。'
