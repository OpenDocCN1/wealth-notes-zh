  md: '为什么美债收益率会下降？如果美国的风险增加（根据标准普尔公司的说法），那么投资者应该要求更高的风险溢价水平来补偿更高的违约风险。国债收益率应该上升才对。如果信用风险不能解释这次降级导致的美债收益率下降，那应该怎样解释呢？


    在本章中，我们将探讨固定收益产品风险与回报率之间的相互关系。我们首先假设美国国债是无风险的，并讨论哪些因子改变无风险债券的回报率。接下来我们将考虑公司债，公司债是在无风险回报率的基础上，增加了信用风险和其他类型的风险。


    # 2. 货币政策和水平因子


    要想理解影响债券的众多因素，就需要理解债券市场中最重要的参与者——被称作美国联邦储备系统的美国中央银行，简称美联储。


    # 2.1 美国联邦储备系统（美联储）


    货币政策是决定利率的基本因素之一，因为货币政策可以影响各种宏观因子。美国货币政策由美国联邦公开市场委员会（Federal Open Market Committee,
    FOMC）制定。该委员会由包括美联储主席在内的7名联邦储备委员会委员、12名地方联储主席中的5名组成（其中纽约联储主席在FOMC中占有永久席位）^{①}。Janet
    Yellen于2014年2月1日被任命为现任美联储主席。她的前任包括Ben Bernanke，任期为2006年2月1日至2014年1月31日，以及Bernanke之前的Alan
    Greenspan，任期为1987年8月11日至2006年1月31日。


    美联储通常通过干预联邦基金市场来施行货币政策。银行（储蓄机构）在该市场'
