  md: '于将他们的财富进行有意义的、符合社会道德观的投资¹。挪威实践了社会责任投资（Socially Responsible Investing, SRI）。2005年，政府通过法规正式明确要求挪威基金进行社会责任投资。该法规表述如下²：


    > 金融财富必须以获取长期稳健的收益为目标进行管理，这依赖于经济、环境及社会方面的可持续发展。


    > 若投资构成了可能助长不道德行为或疏忽（例如违背人权、恶劣腐败或者严重环境破坏）这种不可接受的风险，那么挪威基金不能进行这类投资。


