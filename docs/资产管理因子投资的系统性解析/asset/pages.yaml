    # 3.5 Berk和Green (2004) 模型


    斯坦福大学的金融学教授Jonthan Berk和卡耐基梅隆大学金融学教授Richard Green于2004年写了一篇研究报告，拟合了共同基金业绩主要的典型事实：①基金管理人在费前能产生超额收益，但费后超额收益一般为负；②投资者追逐收益；③投资者投向历史收益高的基金，最终收益不佳。在委托资产管理领域，这是过去30年中最重要的研究报告。


    Berk和Green（2004）显示这些事实来源于一个理性平衡：基金管理人平均来看具有投资能力，但有些投资者具有投资能力，有些不具有投资能力（能否产生超额收


