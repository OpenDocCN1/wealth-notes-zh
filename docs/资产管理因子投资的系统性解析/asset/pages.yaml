  md: '图3.2中，连接美国股票和日本股票的曲线就是均值－方差前沿（ Mean–Variance Frontier ）。与学术文献中一样，我会交替使用“均值－方差前沿”和“均值－标准差前沿”这两个术语，二者可以简单地通过对x轴平方或开方得到，这取决于选择波动率还是方差作为单位。美国股票和日本股票的均值－方差前沿所代表的是美国股票和日本股票的所有组合。显然，代表美国股票的方形是一个100%美国股票的投资组合，代表日本股票的圆形是一个100%日本股票的投资组合。均值－方差前沿的其他位置代表的是包含不同比例美国股票和日本股票的投资组合。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_95_0.png)


    均值－方差前沿是一个抛物线（ Parabola ）。其上半部分被称为是有效的（ Efficient ）：即给定一个以波动率度量的风险水平，投资者无法获得更高的回报或者期望收益。投资者会选择上半部分的投资组合，即边界的有效部分。美国股票位于抛物线的下半部分。你可以通过移动到边界的上半部分，就能在相同波动率下获得更高的期望收益。美国股票是一个无效的（
    Inefficient ）投资组合。任何人不应该持有一个100%美国股票的投资组合。


    # 2.2 分散化


    在《威尼斯商人》中，莎士比亚告诉了我们为什么应该分散化：


    > ……感谢我的命运，'
