  md: '在图11.9–C中，我展示了从1980年6月至2011年12月间，一个共同房地产因子与通货膨胀率的相关系数。我在Ang、Nabar和Wald（2013）中通过提取REITs回报率和NCREIF数据库内其他两个直接房地产投资指数（一个基于估值的指数，一个基于现实交易的指数）回报率中共同变动的部分，构建了该共同因子。所有指数都经过调整，以使它们有相同的板块构成和杠杆率。该共同因子既能在房地产整体周期中捕捉这些投资的整体联合变动，同时又能允许某些特定房地产板块相对于房地产整体周期的偏离。因此C图中房地产因子与通货膨胀的相关系数居于A图和B图所画的相关系数之间。斯皮尔曼相关系数在短期内接近于0，三年后升至0.3，而五年后回落至0.2。


    # **7. 回顾：房地产对冲通货膨胀的效果如何？**


    我已经说明，房地产能够部分对冲通货膨胀，但远远算不上完美。


    Carole在写报告时，除了考虑直接房地产投资对冲通货膨胀的能力之外，还有一些其他考虑，尤其是：


    （1）非系统性风险较大


    由于直接房地产投资回报率并不是一种可通过现实投资获得的回报率，因此很难给单一的房地产投资或者一个房地产投资组合适定合适的投资基准。Carole所在基金的房地产投资组合的回报率可能与基准存在较大差异，因为无论是该组合还是基准，都不能反映真实的回报率。


    （2）不同房地产项目之间的不匀勾性


    Carole的基金只能投资少量的房地产项目，甚至可能只投资一个项目。此前我们都是在指数层面讨论房地产，但是房地产各个板块之间，甚至于同一板块的不同项目之间，都存在较大的差异。不同房地产板块对冲通货膨胀的能力是不同的。Huang和Hudson–Wilson（2007）发现，在房地产各板块中，办公地产的对冲效果最好，零售地产的对冲效果最差。


    （3）投资工具通常含有高杠杆


    房地产投资并不仅仅涉及房地产项目本身。大部分房地产投资工具中也含有固定收'
