  md: '高盛巨额损失之后的又一起事件，利比亚曾交给高盛管理的13亿美元资产在九笔股票交易和一笔外汇交易中损失了98%①。发生在瑙鲁的是另一个让人伤感的故事②。这个小岛国家在20世纪60年代建立了信托基金，用于积累磷矿开采所带来的财富。严重管理不善及过度消费让基金规模从1991年大约10亿美元的峰值在十年后萎缩到不足1/10。瑙鲁现在勉强维持国家运转；该国已经资不抵债，国内生产总值的3/4来自外部援助。


    维持主权财富基金的合法地位要求维持其管理的专业性。正如东帝汶主管自然资源的国务大臣Alfredo Pires所说，“一切取决于民众和领导力。”③或许安哥拉应该关注到关于青睞家族成员管理导致业绩表现欠佳的经验证据，该国在2012年创立了一家主权财富基金，规模为50亿美元。该基金由José
    Filomeno de Sousa dos Santos负责运营，他的父亲是安哥拉总统，自1979年起开始统治安哥拉。唯一的基金经理是瑞士的一家仅有十多位客户的资产管理公司，名为量子全球（Quantum
    Global）。该公司的创始人是dos Santos在一家安哥拉银行的合伙人④。


    在最糟糕的情形下，主权财富基金的巨额资金可能引来贪污渎职，基金管理任人唯亲、水平低下。最理想的情况是，通过对主权财富基金的妥善管理，可以保护一个国家不会出现往往与自然资源暴利伴生的社会扭曲和腐败，并在国家的经济发展过程中扮演重要角色。运气好的话，这样的情况将在东帝汶发生。


