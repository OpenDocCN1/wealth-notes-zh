  md: '期限结构模型可以推导出在某一时刻不同期限债券的相互关系，即某一时刻的利率期限结构，并描述利率期限结构是怎样随时间变化而变化的。根据公式（9.2）和公式（9.3），期限结构模型描述了风险溢价怎样随着期限的变化而变化。在期限结构模型中，十年期风险溢价和收益率是一系列潜在因子的函数，它们发生变化时必须确保不能与九年期风险溢价和收益率偏离“太多”（根据无套利原理）。同理，九年期收益率也不能与八年期收益率偏离太多，依此类推。这样，期限结构模型很自然地表明，收益率之间存在明显的系统性依赖——某一期限的收益率与其他期限的收益率紧密相联。仿射期限结构模型通过将收益率看作诸多风险因子的仿射（恒定且线性）函数，比较简洁地描述了上述现象。这使得该模型可以直接被应用到资产配置和衍生品定价等领域。这些模型中的风险溢价随时间变化而变化，所以在经济萧条或繁荣时，在波动率高或低时，收益率曲线的形状会发生变化。


    第一代的期限结构模型只包含潜在变量。这些模型只能将不可观测的宏观因子作为变量来描述收益率曲线，这些本身并不包含在债券收益率中。这类模型确实可以解释这些潜在因子在收益率曲线上所代表的特性：水平因子、斜率因子和曲率因子，其中最重要的是水平因子（参见图9.2和图9.3）¹。部分受到Ang和Piazzesi（2003）的启发，当前大量的宏观金融文献采用包括经济增长和通货膨胀等宏观因子来对收益率和风险溢价的变动进行特征描述。


    1998年，当Monika Piazzesi和我在斯坦福大学读博士时，我们一起撰写了这篇文章的初稿。当时我们还无法预料到这篇文章此后的被引用量会那么高（我们挺幸运的）。我们将泰勒法则和宏观模型中广泛使用的通货膨胀和产出等因子，与可以跟踪债券价格的随时间而变化的风险溢价模型结合起来。该模型的优点之一是，它可以准确描述收益率曲线是如何反映货币政策风险的。此后，我们与学生、合作者共同研究了很多其他的宏观金融期限结构模型。


    # 3.3 长期债券中的宏观风险溢价


    宏观金融文献显示，宏观因子在决定收益率曲线和债券超额回报方面起着重要作用。Ang和Piazzesi发现，收益率曲线上各个期限的债券收益率的变化，可以归因到表9.3中的产出、通货膨胀率以及其他因子（包括货币政策）：


