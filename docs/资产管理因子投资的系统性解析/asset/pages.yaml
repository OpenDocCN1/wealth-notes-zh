  md: '论（MPT）和Sharpe（1964）资本资产定价模型（CAPM）之后的又一次重要变革。当译者于2015年年初有幸读到Andrew Ang（洪崇理）的这本新书时如获至宝，爱不释手。作者在书中系统全面地探讨了如何通过因子投资进行更有效的资产管理，如何透过资产类别标签进行因子投资，以及如何看待“实际”资产、对冲基金、私募股权等目前国际投资界讨论热烈的前沿话题。作者以开放的心态，将目前投资界的最新研究与他的资产管理理念及方法结合在一起，形成了这本极具可读性和权威性的书。作者慷慨地将自己在多年教学研究和业界实践中获得的宝贵经验与读者分享，填补了国内外金融投资教材中关于因子投资系统性分析的空白。本书内容涉及范围广，立足全球视野，为读者系统全面地解读了因子投资的各个方面。相信作者严谨治学的态度和生动有趣的投资案例会感染到每位读者，让大家对资产管理、组合选择、资产类别、因子投资等的认识有一个质的飞跃。尽管书中也运用了很多金融课程所涵盖的概念，但本书更重在强调直观逻辑和实践。相信无论是严谨的专业投资者还是对投资感兴趣的普通读者，都能从书中找到共鸣之处，因为本书的内容与个人投资者和机构投资者都紧密相关。


    作者从投资者偏好出发，探讨了不同投资者往往有不同的风险容忍度、现金流（负债）压力、投资期、收益目标等。业界通常用市场组合（Beta）来代表平均投资者水平。如果投资者希望通过因子投资来获取风险溢价，其在不同因子之间选择时，需要厘清的是：我与平均投资者（市场组合）相比有何不同、我的优势和劣势体现在哪些方面、我对不同种类风险的感知和承受能力如何，从而选取适合自身定位的因子来投资，并相应界定其不景气时期。因子投资并不能承诺会一直超越市场，但理论和实践证明有些因子长期能带来具有统计显著性的风险溢价，如价值（value）、动量（momentum）、波动率（volatility）等。具体应该选择哪些因子以及配置多大比例等问题都具有挑战性，需要投资者根据自身情况找准定位，并确保有良好的公司治理结构来推动和监督。投资者只有选取适合自身定位的因子，才能确保在市场下行时所承担的风险能在长期投资过程中得到较高的补偿（溢价）。作者尤其指出，资产管理和投资并非投资于资产类别，而应该是投资于因子。就像人们在进餐时，所获取的营养并非简单地来源于每道菜品（不同资产类别），而是来源于菜品所含的营养成分（因子）和营养构成。对冲基金、私募股权等并不是单独的资产类别，而是股票因子、非流动性等因子的组合。这是目前国际投资界讨论热烈且仍有争议的前沿话题，业界不少知名国际投资机构已经或准备采用这种方式来指导未来的投资实践活动。本书的视角主要是针对资产所有者，并从以下三个部分展开阐述：第一部分，资产所有者必须认识到什么是他们的不景气时期；第二部分，因子存在溢价以补偿不景气时期所造成'
  merge: -1
  img_proc: true
