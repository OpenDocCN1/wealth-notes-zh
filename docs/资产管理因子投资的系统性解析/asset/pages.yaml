  md: '争力的工资并吸引住更多有能力的雇员，有更大的自由，还有能理解管理人并给管理人提供资源从事PE投资的董事会。养老金计划则比捐赠基金有更为严格的投资管理结构。在养老金计划中，雇员的工资和等级常常取决于他们负责管理多少资金，而不是取决于他们创造了多少收益（参见第1章）。有些养老金计划的管理者倾心于PE并在实质上被外部管理人所“俘获”——正如Loftis所惊叹的，晚餐时有性感模特陪坐于身旁以及新潮的夜总会氛围环绕，这些情境如何有助于评估一个PE基金？有些养老金管理者辞掉原有职务转而为PE公司工作，例如Borden。资产所有者的投资目标有时并不是在既定的风险水平下实现收益最大化。例如，很多公共养老金计划和主权财富基金，其投资使命会限制他们超配“当地”投资，从而导致亏损$^{1}$。


    银行可以承受得住仅从PE赚取的较低收益，因为它们从PE公司赚取了大量的其他费用。银行内部投资PE的部门与之建立起关系，然后促成银行其他部门与PE的业务。所以即使银行可能从PE投资中没赚到钱，它们仍然可以从股票发行、债务承销、企业重组、收购与兼并、提供咨询业务等方面赚钱$^{2}$。


    # 4.5 为什么投资者会被欺骗


    Swensen的建议是$^{3}$：


    在缺乏真正高超的基金选择技能（或不可思议的幸运）的情况下，投资者们应该离私募股权投资越远越好。


    显然、Swensen的真知灼见没有被听取，而且普通投资者在PE投资中仍表现不佳。那么，为什么投资者们会被误导？


    # （1）希望和梦想


    或许如果我们能压中那个幸运的投资——下一个微软、苹果或谷歌——我们就能解决当下的资金难题。特别是风险投资，有一种在改变世界的同时还能赚钱的诱惑：被投资公司的收益确实是高度偏斜的，一两个优胜者资助十来个亏损者。但那些少数成功者的高额回报并不能抵消平均投资者的组合的总体损失。Thaler和Sunstein（2009）认为“如果消费者并非完全理性，公司就有足够的动机去迎合而不是去消除


    $^{\text{①}}$ Hochberg and Rauh（2013）发现公共养老金基金在境内的投资相对对海外的投资或海外投资者对其境内的投资回报要低2～4个百分点。Bernstein，Lerner，and
    Schoar（2013）显示国家主权财富基金也是一样。它们在对境内的私募投资回报率也低于国际私募投资。对这两类组织来说，当涉及更多政治影响时这种效果更加明显。


    $^{\text{②}}$ 参见Fang，Irshina and Lerner（2013）


    $^{\text{③}}$ 参见经济学家（2012年1月28日）“Bain or Blessing”'
