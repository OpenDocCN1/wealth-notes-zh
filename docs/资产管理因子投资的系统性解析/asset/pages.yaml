  md: '者在每个季度赎回25%的投资，因此全额赎回需一年时间¹（在2013年11月，SAC承认从事证券及电信诈骗罪，支付了18亿美元的罚款、并停止管理外部投资²）。


    另外，对冲基金还可以运用投资者门槛（gate）限制投资者赎回，甚至有时可以完全暂停赎回。


    锁定期使对冲基金可以推行一些由于投资者在错误时点赎回而难以坚持的投资策略。换句话说，出售波动性可取得长期风险溢价，但要求投资者在波动性到达顶峰，而且资产价格暴跌时能坚持投资。锁定期可允许对冲基金持有更多流动性较差的资产，赚取流动性风险溢价（参见第13章）。Aragon（2007）显示有锁定期限制的对冲基金收益比没有锁定期限制的对冲基金的收益高4%至7%。


    赎回门槛和暂停赎回让对冲基金如同Eagles乐队在加州旅馆（Hotel California）中唱的一样。投资者可以要求赎回（“你什么时候都可以退房”），但对冲基金不会把钱还你（“但你永远不能离开”）。在金融危机期间，很多投资者想要赎回表现很差的对冲基金，但未能如愿。这不仅是2008年至2009年间才有的问题，对冲基金在任何时候都可能遇到麻烦并使用赎回门槛。在2012年10月，由北卡罗来纳大学教堂山分校（Chapel
    Hill）捐赠基金前负责人Mark Yusko管理的资产规模数十亿的对冲基金捐赠基金（the Endowment Fund），在过去两年糟糕的表现之后使用了赎回门槛³。


    缺乏流动性对于投资者来说成本很高。在Ang和Bollen（2010a、2010b）中，我运用了实物期权的方法计算锁定期和赎回限制的成本⁴。投资者放弃在想要赎回时就能退出投资的选择权，而一般投资者在基金管理人破坏价值时会最希望行使该选择权。这也正是对冲基金不想让投资者退出投资的时期。我们估算三至六个月的锁定期成本为2%，两年锁定期的成本为4%。如果对冲基金在糟糕的情况下暂停所有赎回，在投资者最希望退出时废除流动性选择权的情况下，缺乏流动性的成本增加到15%。


    # 4.4  未来


    对冲基金不会消失，其中一些产生了可观的回报。但大多数对冲基金只是诸多风险因子在不透明、缺乏流动性、昂贵包装下的通道。很多这些风险因子，例如波动率、信用、小盘——大盘（规模）、价值——成长和动量，对于长期投资者来说特别有吸


