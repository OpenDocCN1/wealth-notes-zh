  md: '在1990年代末到2000年代初那段TIPS市场最初建立的时期里，市场流动性很差（如下文所述）。表11.1的下半图选取了从2007年7月至2011年12月这段TIPS市场更加成熟的时期。在这段样本区间中，上述结论同样成立：TIPS的平均回报率比国债更高（分别为8.4%和7.2%），TIPS和国债的相关系数为45%，TIPS与通货膨胀率的相关系数仅为16%，仍说明对冲通货膨胀效果很差。TIPS尽管与通货膨胀率挂钩，但是与通货膨胀率的相关系数如此之低，要理解其中原因，我们需要研究实际债券回报率的几个驱动因素。


    # 4.3 实际收益率


    实际收益率的波动率大得令人吃惊。我用“令人吃惊”这个词是因为，‘在通胀挂钩债发行前，许多经济学家都认为市场交易决定的实际收益率应该与课本上的实际利率理论相差不多。在简单的经济模型中，实际利率应该反映人口趋势、经济产出的增加、储蓄者的时间偏好和风险态度以及企业投入实际生产的机会成本$^1$。所有这些指标都应该随时间平滑地发生变化。因此，在推出通胀挂钩债之前，多数经济学家们认为这种债券将是市场上最“无趣”的品种。现代实证资产定价之父Eugene
    Fama在1975年时认为，实际利率是恒定的。那时通胀挂钩债还没有发行，现在来看他的观点明显是错误的。表11.1显示，实际利率是波动的，并且在现实中与名义利率的波动相差不多。


    图11.4-A展示了2003年1月至2011年12月间，圣路易斯联储公布的美国五年期和十年期TIPS的收益率。平均来看，TIPS的利率期限结构是向上倾斜的，但是十年期和五年期TIPS的期限利差在2006~2008年间几乎为零，而在2008年转为负值。图中也可以看到五年期TIPS收益率在2008年初几乎为零，而在年内金融危机最严重的几个月升到了4%。


    图11.4-B~D分别描绘了五年、十年、二十年期名义国债收益率和TIPS收益率。TIPS收益率在金融危机期间飙升，国债收益率却在2008年底开始下降。那时许多投资者都转向国债这类安全资产，而抛售包括TIPS在内的其他风险资产。TIPS和国债都拥有美国政府100%信用支持，因此两者的违约风险都几乎为零。为什么TIPS会被抛售呢？国债是一种传统的可靠资产，它可以被用作抵押品、满足保证金要求，最重要的是可以保证流动性，而TIPS几乎不具备这些特性。下文中我将说明，流动性风险是TIPS的一个重要因子。


    $^1$ Ramsey（1928）首先将实际利率视作消费者偏好和产出增长的函数。另一篇早期贡献较大的文章是Fisher（1930），他推导出实际利率应当反映企业实际投资的边际效益。'
