  md: '引力。是否有更好的方式来取得这些风险溢价呢？


    很多因子投资策略的准入门槛较低。现在有共同基金投资于类似对冲基金的策略。一些这样的基金除了名称以外，其实就是对冲基金，但拥有40法案赋予投资者的保护。一些这样的共同基金甚至是对冲基金公司建立的，以寻求普通零售投资者的参与（这些投资通常比机构化的对冲基金投资者更加稳定）。一些新的交易所交易基金专门投资于某些此类风险因子溢价。对冲基金提供的很多风险敞口可以通过比2/20更廉价的费率获得，因此很多此类策略也吸引了更多收费更低的仿制品¹。因为更多的投资者追逐着同样的策略，大量资金的涌入也带来了风险。这可能导致更多类似2007年8月量化危机的事件发生。正如Andrew
    Lo所说：“整个对冲基金行业就是一系列拥挤的交易。”²


    我们还有很多创新的空间。在2013年撰写这本书时，市场上还没有大型现成的波动率、流动性和动量因子资产组合可提供给一般投资者。这些组合投资于全球性的、分散化的资产类别，有着低周转率的设计以降低费率（20～30个基点）。标普500指数、Russell
    2000指数和类似的指数基金收取平均投资者5到10个基点的费用，而对于机构投资者，由于出借股票（stock lending）带来的收益则几乎是免费的。但因为需要动态交易，因子资产组合的收费会相对高一些。一些资产规模大的投资者（拥有数十亿美元）组建了他们自己的因子资产组合，但资产规模小的投资者则不能这么做。令人鼓舞的是，一些资产管理公司，包括一些对冲基金公司已经开始向这个方向努力。一些对冲基金也成立了因子基金，但收费比20至30个基点要高很多（但是，这些费率一般比标准的2/20要低得多）。如果因子能够被商品化，这些对冲基金就被锁定在了一个费率下降的下行螺旋之中，这对于投资者来说这是个好消息。


    但这需要时间。为何我们现在还未看到很廉价的因子基金？


    # 早期的因子基金


    我们现在认为低成本的股票型指数基金的存在是理所当然的，但它们在20世纪70年代开始发展的时候能否成功却并不显而易见³。传统的积极型基金，特别是共同基金家族，因为恐惧费率更高的积极型基金被蚕食，特别在积极型基金跑输市场的情况下（参见第16章），从而不想发展指数型基金。提供指数基金一定感觉像认输一样，


    +   (1) 这包括“对冲基金复制”策略（参见Kat and Plato，2005），但也包括第14章中描述的纯因子组合。(2) 案例请参见，Sstrasburg，J.and
    S.Puliam，“Peak Mentality Grips Hedge Funds”，华尔街日报。2011年1月14日(3) 指数基金的历史在Bernstein（1992）和MacKenzie（2006）中有概述。'
