    and Takehara（1998），Storesletiethen、Telmer and Yaron（2007）以及Eiling（2013）的研究。


    ② 这些效应也有两种形式。第一，与单个股票高阶矩相关的风险溢价。这是单个股票的特性，可参见 Mittion and Vorkink（2007）、Boyer、Milton
    and Vorkink（2010），以及Amaya et al.（2012）关于这种形式的偏度风险溢价。第二，来源于股票收益如何与总体市场高阶矩共同变动的风险溢价：Harvey
    and Sidhique（2000）、Dittmar（2002），以及Chang、Christoffersen and Jacobos（2013）研究表明存在共偏态和共峰态风险溢价，这些风险溢价来源于股票收益与市场组合偏度和峰度高阶矩的共同变动。'
