  md: '基金的杠杆率往往较高。


    夹层（Mezzanine funds）基金持有私营企业的贷款组合。这些基金所持有的债务往往很少；“夹层”一词意味着它的排名低于高级债务。有些夹层基金与并购基金或房地产基金携手合作。这种基金可包含一些由私营公司发行的公司债券。


    基础设施（Infrastructure funds）基金集中投资于基础设施领域，包括机场、铁路、高速公路和公用事业。通常基础设施基金会采用一些杠杆。


    困境型（Distress fund）基金一般集中在有问题、已经或濒临破产的公司。这些基金的GPs专长于重建管理，试图将有问题的公司转变为运营健康的公司。


    基金的基金（Funds-of-funds）就像对冲基金领域的同行：它们持有不同私募股权基金的投资份额。有些基金的基金已经上市$^{①}$。


    私募股权二级基金（PE secondary funds）是指从有限合伙人处获取已投的私募股权基金份额。他们给予当前有限合伙人退出的机会。（我在第13章探讨了二级PE市场。）金融危机期间二级私募股权基金突然崛起，因为一些精明的投资者从那些处于困境的有限合伙人手中购得基金份额并从中获利。


    有限合伙人经常采用共投的方式，与私募股权基金一起对单个公司进行直接投资。


    # 2.4 私募股权的承诺投资具有顺周期性


    机构投资者在投资PE时具有顺周期倾向，往往在估值最高的时候对PE基金注资$^{②}$。（这些机构与投资共同基金的个人投资者有着相同的顺周期倾向；参见第16章）。当前估值很高意味着有大量资金挤入而且历史分红丰厚，但未来的预期收益较低。两位专门从事私募股权研究的知名教授Paul
    Comper和Joshua Lerner（2000），称这是“资金追逐交易”：资产所有者倾向于在估值最高时将资金投入PE。


    图18.1展示了由PE数据库Pitchbook所编制的自2000年以来十年里PE资金的募集情况。A图显示募集资金在2007年和2008年达到峰值约每年3200亿美元，这正是处在金融危机和随后的经济衰退之前。然后在2009年和2010年，正当价格低且预期收益高的时候，私募股权募资出现了悬崖式下跌。B图则给出了关于已关闭基金数量的类似图形（A图和B图中数字的相关性约为90%）。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_607_0.png)


    +   1. 上市和未上市的私募投资工具的组织形式是不一样的。上市的私募基金通常具有无限期的存活期以及较严格的报告披露要求。Jensen（2007）指出未上市的私募基金因为考虑到名声会激励它更好地去表现，因此这类基金应该会比上市的基金有更好的回报。

    2. 关于风险投资参见 Gompers and Lerner（2000）和 Kaplan and Lerner（2010）；关于并购参见Kaplan and
    Stromberg（2009）和Axelson et al.（2012）。'
