  md: '我认为在积极管理中SRI仍有一些机会。公司自身的一些特征是可以预测其收益率的。其中一些特征效果如此明显以至于被提炼成为因子，我将在第7章中对此进行讨论。在SRI标准下排名较高的许多公司很可能透明度更高、治理规范、高级管理人员不太可能不正当获利、库存管理有效、不用会计花招、对股东建议有很好的回应。这些都是与公司表现相关的特征。举一个简单的例子：限制管理层的额外开销，可以使股东获得更多利润。Gompers、Ishii和Metrick（2003）设计了一个公司治理指数，将公司从“独裁制”（dictatorships）到“共和制”（republics）进行排序。例如，那些采用保护管理层条款、反收购条款、限制代理投票等行为的公司会被定义为独裁。他们发现“共和制”公司——在SRI标准下也很可能排名较高——比“独裁制”公司收益率更高①。


    如果你能够根据与SRI相关的某些特定属性和特征来挑选公司，那么就有可能获得更好的收益。这种SRI方法并不盲目剔除公司，而是依据SRI的标准积极地选择公司，不会通过剔除公司来限制投资经理的投资机会②。与所有积极策略一样，该方法也很难战胜基于因子的策略（参见第14章）。


    在反映资产所有者的偏好方面，SRI也扮演着重要角色。以挪威基金为例，实施SRI策略赋予了该主权财富基金在其所有者（即挪威人民）眼中的合法性③。SRI是资产所有者的选择，但是施加SRI的限制或者其他任何限制所产生的代价必须相对于整个投资集合来衡量：你为“从善”放弃了多少投资收益？


    均值—方差投资的主要理念是持有一个分散化的组合，挪威基金做到了这一点。根据均值—方差投资理论，分散化优势是免费的午餐。通过剔除部分公司来实现SRI是有代价的，因为这样做减少了分散化优势。但是从一个足够分散化的组合（一些表现最好的分散化组合是那些最简单的组合，例如等权重组合和市值权重组合）中剔除几只股票对分散化优势的影响十分微小。挪威基金践行SRI的代价可以忽略不计。


    在我2013年撰写本书时，沃尔玛公司仍然被列为挪威基金的剔除名单之中。


    ① 在最初Gompers、Ishii和Metrick（2003）提出该观点后，便有关于这种效应是否持续以及这种效应是否由风险或者错误定价所造成的（参见第7章）等问题的讨论。Cremers和Ferrell（2012）发现，股东权较弱的公司的股票在1978～2007年期间超额收益为负。而Bebebchuk、Cohen
    and Wang（2013）指出，当初Gompers、Ishii和Metrick提出的结果在2000年以米就消失了。


    ② 一种更激进的做法是股东积极主义（shareholder activism）。对冲基金实践的股东积极主义显著增加了价值（参见Brav et al.（2008）），但是关于共同基金和养老基金通过实践股东积极主义为股东增加价值的证据却完全没有定论（参见Gilliam
    and Starks（2007））。Dimson，Karakas and Li（2012）发现，积极主义者对企业社会责任的鼓励会产生超额收益。


    ③ 参见Ang（2012a）。'
