  md: '由于美联储对于债券价格的影响力如此之大，泰勒法则又在很大程度上可以预测美联储将怎样做，投资者应着重关注泰勒法则，因为它能帮助理解通胀和经济增长风险的影响。美联储有时出于宏观因素考虑，将短期利率设定在高于或低于泰勒法则预测值的水平，这就是货币政策风险。货币政策风险对债券价格影响显著，根据Ang、Dong和Piazzesi（2007）估算，货币政策风险可以解释25%~35%的收益率水平变动。


    # 2.4 美联储政策立场发生改变


    泰勒法则分析框架的基本假设是，美联储的反应函数（Reaction Function）是不变的——即美联储在面对特定的产出或通货膨胀冲击时，无论冲击规模大小，其应对方式不随时间变化而变化。但是，如果美联储应对产出或通货膨胀风险的立场发生改变了呢？在公式（9.1）中可以看到，增长和通货膨胀率的系数随时间发生了变化，而并非如泰勒（1993）模型中一直恒定在0.5和1.5，这表明系数的变化可以捕捉到美联储的立场变化。此外，由于其应对宏观风险的立场可能发生变化，那么在美联储的双重任务——实现充分就业和物价稳定中，美联储更看重哪一个呢？


    这些都是Ang等人（2011）研究的问题。他们发现，美联储的政策立场——泰勒法则中产出和通货膨胀率的系数——随时间已经发生了明显的变化，并且通货膨胀率系数比产出系数的变化更多。这些不断变化的政策立场也可以在很大程度上影响长期债券的价格。


    在图9.5中可以看到，根据Ang等人（2011）的估算，产出的系数基本在0.4左右波动，而通货膨胀率系数的变化较大，在2003年时接近于零，而在1983年时曾达到约2.4。图9.5显示在20世纪六七十年代，通货膨胀率的系数小于1。根据泰勒原理，通货膨胀率的系数应当大于1，否则将发生多重均衡（Multiple
    Equilibria）。经济学家们认为这种情形只会发生在波动率很大、宏观负面事件很多的时期，例如20世纪70年代高通胀、低增长共存的时期（滞胀，Stagflation）①。20世纪80年代时，Volcker带领的美联储采用了非常激进的手段来抗击通货膨胀，并成功控制住了高通胀。在2000年代前期，通货膨胀率的系数再次处于低位，直到2005年后才开始快速反弹。


    > ① Taylor（1999）以及Clarida、Gali and Gertler（2000）表明了该观点。如想了解产生多重均衡现象的原因及问题，参见Benhabib、Schmitt-Gröhe
    and Uribe（2001）。'
