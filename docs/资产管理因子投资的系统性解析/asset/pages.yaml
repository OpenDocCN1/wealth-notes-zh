- pgno: 278
  md: '表8.2说明要预测收益非常困难。我在表8.2中加粗标出了所有在95%的置信水平上显著的相关系数，也就是说，它们的p值小于0.05（或者等同于它们的t统计量绝对值大于1.96）。只有两个变量在95%的置信水平有统计上显著的相关性：Shiller（2000）周期性调整后的十年盈利收益率，以及与Lettau和Ludvigson（2001a）所构建的长期消费—财富比率趋势（被称为“cay”）的偏离度。后者有先窥偏差（它是利用投资者当时还无法获取的信息来构建的），所以对它的理解要谨慎，因为它不能用于可投资的策略^(1)。股息率在五年期时有临界的可预测能力，其t统计量为1.95。因此，正如Ross和Zhou指出的那样，预测收益很难。


    表8.2中表现突出的Shiller市盈率倒数和五年期的临界股息率都与公式（8.4）中Gordon模型的直觉逻辑相一致。高收益率意味着低价格。低价格是由于未来现金流被较高的预期收益率贴现而来。因此，现在的低价格预示着未来收益会较高。值得注意的是，表8.2中唯一显著的变量就是这些估值比率。有一篇内容丰富的研究文献记载了其他的预测变量跨不同的时期和样本的情况^(2)。总的来说，很难预测收益。


    # 警惕长期限R^2


    很多评论者声称数据中有大量证据证明了长期限可预测性，而表8.2并未证明这点。长期限可预测性确实存在，但再次强调的是，它很难被发现。你不能采用标准R^2测量值来进行长期限的统计推断。公式（8.7）中的重叠观测值导致长期限R^2被极大地夸大了；简单的R^2看上去能体现很强的可预测性，但实际上并非如此。比如，以股息率与未来五年期超额收益的相关性为49%为例，这意味着R^2
    = (0.49)^2 = 24%。这个数看上去很大，尤其是在金融理论预测认为回归R^2应该接近于零的情况下。


    投资者不能太过相信长期限R^2值，因为它们具有欺骗性。也就是说，虽然真实的可预测性很低（我们称为总体的可预测性小），但小样本的回归R^2会大得多。这里所说的小样本可以是几百或几千年。这种欺骗性效果的直觉逻辑即，公式（8.7）中观测到的重叠值人为地引入了依赖性——从t到t
    + 3时点的三期长期限收益与从t + 1到t + 4时点的三期长期限收益之间有两个时段重叠——而这个问题会随着时间期限的拉长而变得更为严重^(3)。包括Vallkanov（2003）及Boudoukh、Richardson和Whitewlaw（2008）在内的一些研究推导出了正确的小样本R^2分布，并指出它们有很大的向上偏差；采用


    +   (1) 参见Breman and Xia（2005）。


    +   (2) 参见Racaph and Zhou（2011）的总结性文章，他们指出多个变量相结合比单个变量能更好地预测股票收益。


    +   (3) 关于伪回归的研究将此称为部分加总变量（partially aggregated variables）。'
