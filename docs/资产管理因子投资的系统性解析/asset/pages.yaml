    \ “买入股票和卖出债券” 头寸来复制。它在股价上升时买入股票，在股价下降的时候卖出股票。做空看涨期权与此相反：它意味着在股价上升时买入，股价下降时卖出。同样地，卖空看跌期权可以动态地由\
