  md: '代表着85%的顾问公司收入<sup>①</sup>。基于AUM的费用模式在机构投资者中占大多数。按资产的一定比例来确定费用的问题在于，如果市场表现好，即使代理人毫无作为，AUM也会增长。那么资产所有者为什么要为顾问或基金管理人并未付出的时间和努力而支付费用呢？


    基于AUM的费用模式的历史由来比较有趣。第一位独立投资顾问Arthur Clifford于1915年在加利福利亚州帕萨迪纳市开始经营，他对其服务收取固定费用<sup>②</sup>。这与基于佣金的费用模式形成对比，后者会带来较大利益冲突。在美国另一端的波士顿，Theodore
    Scudder于1919年创立了Scudder, Stevens & Clark公司为客户提供独立的投资建议。该公司收取所有交易额的1%作为费用——这是一种基于佣金的机制。Scudder发现这样并不能产生足够的收入，而且这会鼓励过度交易从而与公司的投资理念相悖。所以他转换至一种利润高得多的模式——按比例收取在管资产的1%作为费用。上述两个例子中，Clifford和Scudder都是革新者，因为其他人都是收取基于佣金的费用。在很长一段时间，免佣金的顾问仅限于给富有的客户提供投资建议。遗憾的是，Scudder的比例费用而非Clifford的固定费用最后成为行业的惯用模式。


    机构投资者大部分都基于（主要是经纪业务）佣金来支付费用的现象一直持续到20世纪60年代。那时，有几家机构确实是按1%收费，但会用经纪佣金来抵扣这些费用<sup>③</sup>。摩根银行（Morgan
    Bank）在20世纪60年代末率先按在管资产的0.25%来收费，当时人们预测摩根银行会损失一些业务，但事实上仅有一个账户离开，而摩根银行成为整个行业的领头羊。慢慢地，比例费用开始逐渐升高（而不像预计的那样因为竞争而下降）至现在的水平。


    如今，基于AUM的费率对个人投资者高达1%，对机构投资者略低于50个基点。正如Charles Ellis（2012）所说，“投资者本来就拥有这些资产，因此投资管理费用实际上应该是基于投资者所获取的管理人其创造的收益。”在代理理论的框架下，Ellis其实是说，吸引代理人参与的固定费用实在是有些过分的高了，而能反映代理人所真正增加的价值的激励费用又太低了。投资者支付较高的费用也可以，如果这些费用能够促使业绩上升从而增加AUM而不是立刻减少AUM的话。尤其对于机构投资者来说，这就意味着更多的费用应该基于激励机制，而基于AUM的费用应该少得多。个人投资者也应该不再采用基于AUM的费用模式，但我也推荐激励费用的比例太大，我


    ① FA Insight of Tacoma2010年的调查：报道于“How to Pay Your Financial Adviser”，华尔街日报，2011年12月12日；


    ② 摘自Charles Schwab2007年出版的书The Age of Independent Advice: A Remarkable History。


    ③ 参见Ellis（2012）。'
