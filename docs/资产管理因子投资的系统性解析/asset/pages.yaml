  md: '后，也成立了更多的合伙制公司以维持免受监管的地位。规模经济是基金管理业务的一个优点：维持十支基金的固定开销与维持一支基金的几乎相同。因此对冲基金管理人的收入随着资产管理规模的增加呈爆炸式增长（但如下即将阐释的，资产规模增大伴随着对投资者提供的附加值减少）。


    现代对冲基金具有所有这些特质或者其中一部分。值得注意的是一种最初为个人投资者创造的投资工具现在受到了机构的青睐（下一章将讨论的私募基金也是同样情况）。


    对冲基金能产生巨额收益。George Soros由于提前预料到发生于1992年9月16日英国被迫贬值货币并退出欧洲汇率机制的事件，而被称为“使英格兰银行破产的人”。他的量子基金于事前一周在做空英镑、做多德国马克上建立了100亿美元的敞口，为他赚取了18亿美元。在2007年，John
    Paulson做空了房地产抵押贷款，被Zuckerman（2009）称为“最伟大的交易”。他的对冲基金在房地产抵押债券的下跌中赚取了150亿美元，其中Paulson私人获利37亿美元。


    对冲基金也可能出现大额亏损。在1998年8月，俄国债务违约之后，由诺贝尔奖得主Robert Merton和Myron Scholes创立的对冲基金长期资本管理公司（Long
    Term Capitial Management，LTCM）崩溃 ${ ^{①}}$ 。LTCM在当年年初管理50亿美元的资本，并借了1250亿美元（25:1的杠杆率，接近一般投资银行水平）。到1998年9月21日，基金资产降低到不足10亿美元，杠杆率则升至100:1。两天后，16家投资银行在纽约联邦储备银行的协调下出资36亿美元援救了LTCM。至今为止，Amaranth
    Advisors于2006年9月出现的损失是对冲基金出现的最大损失。由于大规模地使用杠杆和在天然气期货上的判断错误，Amaranth共损失了60亿美元，约65%
    ${ ^{②}}$ 。在该基金于2006年9月29日一篇通讯中公布了该亏损后，投资者纷纷要求撤资，但令他们吃惊的是，该基金使用了门槛因此无人能够赎回。


    # 2.2 什么是对冲基金


    对冲基金具有如下一些特征：


    数量有限的（富有）投资者


    对冲基金必须符合40法案中3(c)(1)和3(c)(7)条例要求，以免除受到法案其他


    ① 案例请参见Perold，A.，1999年，长期资本管理公司(C)、哈佛商学院案例9-200-009。


    ② 案例请参见Mufson，S.，“Amaranth’s Losses Top 6 Billions”，华盛顿邮报。2006年9月22日。'
