    联邦基金利率与整条收益率曲线走势的高度相关性可以由水平因子（Level Factor）来解释。水平因子简单地描述了所有债券收益率共同上行或下行的特征，这与联邦基金利率一致。水平因子可以解释整条收益率曲线（或利率期限结构，Term
    Structure of Interest Rate）90%的变动情况$ ^{①} $。我们通过久期（Duration）来测度水平因子的敞口，它的概念类似于我们用贝塔值（Beta）来测度股票市场中的市场因子敞口（参见第6章）。久期就是债券的贝塔值，表示利率平行移动对债券的影响。其他影响债券回报率的因素包括斜率或期限利差（Slope
    or the Term Spread），它描述收益率曲线长端相对于短端的变动程度，以及曲率（Curvature），它描述曲线中端相对于水平因子和斜率因子的独立变动。在这些因子中，水平因子最为重要。


    因子分析对于固定收益市场非常重要，在这方面它与股票市场形成鲜明对比。在股票市场中，非系统性风险很大，通常可以造成80% ~ 90%的回报率方差，而系统性风险只占10%
