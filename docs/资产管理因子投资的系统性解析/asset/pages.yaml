  md: '# ### 3.4 价值溢价的理性解释


    在对价值因子的理性解释中，当我们控制了市场敞口后，某价值股与其他价值股的变动是趋同的（而与成长股则呈反向变动）。因此，所有价值股通常会一起表现良好或者一起表现不佳。要找到一只不与其他价值股同向变动的价值股，有如在重金属音乐会上找到不随音乐舞动的人。正如欢快感过后，有些歌迷会在第二天经历神经性头痛一样，价值股也并不总是能带来高收益。价值因子是有风险的，其风险性由所有价值股票来或多或少地共同承担。有些价值风险可通过构建多元化股票组合来分散掉，但很多价值变动并不能通过多元分散化而消除（实际上，Fama和French通过构建$HML$因子来利用这种常见共变性（common
    covariation））。在APT理论框架下，由于不是所有风险都能被多元分散化掉，剩余风险将在均衡状态被定价，从而带来价值溢价。


    Fama-French模型本身并没有对为什么价值因子存在溢价作出解释。相反，CAPM模型解释了市场因子是如何被定价的，甚至确定了市场的风险溢价（参见公式（7.1）和第7章）。为了更进一步，我们需要深入探究关于价值溢价为何存在的经济原因。


    在定价核公式中，任何风险溢价的存在都是因为要补偿投资者在不景气时期所遭受的损失。重点在于要界定这些不景气时期是什么。再回到图7.5，可以看到价值股的不景气时期并不总是与经济不景气同步。诚然，价值股在20世纪70年代末和80年代初表现不佳，当时经济也不时地处于衰退期。20世纪90年代早期经济出现衰退，价值股也表现不佳，2008年金融危机毫无疑问属于不景气时期，当时价值股也遭遇损失。但20世纪90年代末的牛市时期呢？当时经济持续繁荣、而价值股却遭遇毁灭性重创。价值因子的理性解释需要我们对价值股表现不佳的不景气时期做出相应的明确界定，使得价值股平均而言可获取风险溢价。


    解释价值溢价的其他因素还包含投资增长、劳动收入风险、非耐用品或“奢侈品”消费以及住房风险。一种特殊的“长期”消费风险也能一定程度地解释价值溢价。在这些因素所界定的一些不景气时期，价值股的贝塔值上升。这使得价值型公司的风险尤为明显。


    > ① 关于劳动收入风险的解释，可参见Santos and Veronesi（2006）， Parker and Julliard（2005）和Lusting
    and van Nieuwerburgh（2005）则分别考虑了奢侈品消费和住房风险。关于“长期”消费风险，可参见 Bansal, Dittmar and
    Lundblad（2005）。


    > ② 关于价值股随时间变化的贝塔，可参见Lettiau and Ludvigson（2001h）、 Petkova and Zhang（2005）， Lewellen
    and Nagel（2006）， Ang and Chen（2007）和Ang and Kristensen（2012）等研究。'
