- pgno: 59
  md: '越时间段，比如，为了未来的退休生活，当前需要储蓄多少？每个资产所有者都有其特有的偏好，而伦理道德（有时是缺乏伦理道德）可能是产生偏好的重要因素。每个资产所有者都有不同的目标、规划和生活方式。心理状态、家庭环境或机构运作机制都会影响资产所有者最终的选择，除此以外，同行的决策和其他社会因素也会起到一定作用。


    我们用效用（Utility）代表偏好，这是一个描述偏好的量化指标，通过对效用排序或最大化效用做出的决定，与资产所有者的潜在偏好完全一致（经济学家将效用值称为“Utils”）。效用与选择有关，我们构建效用函数来衡量参与者在不同选择下的满意程度。


    最优资产管理框架下所做的好的选择通常始于一句古希腊格言“认识你自己”（know thyself）。具体来说，我们给出的投资建议是要考虑你在不景气时期的感受。为了定量地描述这个概念，我们界定了资产所有者在面对风险时是如何认知与反应的。


    # # 2.1 风险


    Peter Bernstein（1998）在《与上帝对抗：风险的非凡故事》（Against the Gods: The Remarkable Story of
    Risk）一书中，描述了从阿拉伯数字的发明到今天的（云）电脑，我们通过发展统计学和概率学，在测量风险上取得了惊人进步①。我们根据这些统计方法对所有风险和回报建立模型。我们今天对风险的定义非常广泛——不仅仅是回报的可能性集合。我们现在根据包含许多不同类型事件（甚至是平行的宇宙，如果你是一位理论物理学家）的概率函数来考虑风险②。我们甚至认为风险是概率集合随时间变化的概率，我将在下面具体解释。


    金融经济学中的风险本质上是一个主观概念。我们在金融中没有可控制的实验室条件，且必须估计资产回报的分布。估计概率的流程及估计概率所使用的模型都具有主观性。尽管如此，我们仍将根据回报数据的直接估计称为现实世界测度（Real
    World Measures）或客观测度（Objective Measures）。与此相对，主观测度（Subjective Measures）是资产所有者所相信的、不同于现实世界概率的概率。例如掷硬币，正面落地的客观概率就是50%，但投资者可能会觉得硬币是不均匀的，于是就给正面落地一个60%的主观概率。回报的概率比掷硬币的概率更难估计，因为有无穷多的结果，从亏损所有的资金（回报率为-100%），到成为超级富翁（回报接近无穷大），以及这两者'
  merge: -1
