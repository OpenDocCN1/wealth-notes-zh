    # 图2.8


    这被称为均值—方差前沿（Mean–Variance Frontier）（下一章将深入探究多个资产的均值—方差前沿）。在这个例子中，均值—方差前沿代表了我们在未使用杠杆的情形下持有股票—债券仓位可获得的所有风险—收益的组合$^{①}$。


    债券位于均值—方差前沿的无效（Inefficient）部分。通过将股票引入组合中，我们将沿顺时针方向移动，并能在降低组合波动率的同时增加预期收益率。因此，我们


    > ① 对于持有两种资产的情况，均值—方差前沿是通过两种资产$A$和$B$的所有组合形成的。定义资产$A$的均值和波动率分别为$E(r_{A})$和$\sigma_{A}$，资产$B$的均值和波动率分别为$E(r_{B})$和$\sigma_{B}$，资产$A$和资产$B$的回报率的相关系数为$\rho$。这两种资产的均值—方差前沿上的组合均值和波动率由以下公式给出：


    $\begin{align*}& E(r_{p})=w E(r_{A})+(1-w) E(r_{B}) \\ & \sigma_{p}=\sqrt{w^{2}
    \sigma_{A}^{2}+(1-w)^{2} \sigma_{B}^{2}+2 w(1-w) \rho \sigma_{A} \sigma_{B}}\end{align*}$


    我们可以改变资产$A$在组合中的权重$w$。图2.8将$w$限制在0和1之间。'
