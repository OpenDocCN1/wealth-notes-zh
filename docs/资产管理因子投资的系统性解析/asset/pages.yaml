  md: '益率一直上行，之后开始下行，因此债券在20世纪80年代早期以前都表现不佳，而之后则一直表现出色。表9.2列出了从1952年1月至2011年12月间，不同期限债券相对于美国短期国债的超额回报的均值、波动率以及夏普比率。由于在1951年以前，美联储人为地将债券收益率维持在低位，直到1951年美国财政部与美联储达成“国债协议”才解除了人为钉住债券收益率，因此与其他研究者一样，我也使用了1951年后的数据作为样本。人为钉住债券收益率是二战的“产物”，当时政府要求美联储将收益率维持在低位，这样可以降低政府的借款成本。“国债协议”不再强迫美联储为钉住收益率而不断购买财政部发行的国债，这标志着美联储真正地获得了独立性¹。我将样区以1982年末为界做了划分，这是因为美联储在1979年10月6日至1982年10月9日间²，短暂地使用了目标货币储备作为其新的货币政策目标。


    在表9.2中可以看到，从1952~1982年间，五至十年期债券的平均超额回报几乎为零，而十年期以上债券的超额回报为-0.62%。在1983年以后，债券的表现明显好转。从1983~2011年间，五至十年期债券的超额回报为3.96%，十年期以上债券的超额回报为5.66%。在整体样本区间中，上述两个期限债券的超额回报分别为1.91%和2.97%，这主要得益于20世纪80年代后收益率的全面下行。整体来看，债券的超额回报随着期限的延长而升高，一年期债券的超额回报为0.59%，十年期以上债券的超额回报升至2.97%。表9.2中还单独列出了2000~2011年这段时间，它对于股票而言被称为“失去的十年”（在表9.2的最后一列可以看到股票的超额回报）。在2000年后，债券回报率明显优于股票，十年期以上债券的超额回报为7.18%，而美国股票的超额回报仅为-0.39%。


    表9.2中列出的夏普比率基本上是随着期限延长而降低，一年期债券的夏普比率在0.7以上，而长期债券的夏普比率约为0.3。由于平均超额回报随着期限的延长而升高，那么夏普比率与期限的负向关系主要是由于超额回报的波动率随着期限的延长而大幅上升所致，即长期债券的波动率大幅高于短期债券。这个结论有些出人意料，十年期债券应该反映十年内的宏观和金融环境，假定利率有均值回归的特性以及经济冲击在较长时间内应该缓和，那么长期债券的波动率应该远低于短期债券。但事实并非如此，长期债券的波动率仅仅小幅低于短期债券。按照只考虑短期利率均值回归特性的简单经济模型算出的预测值，长期债券的实际波动率明显偏高。这种现象被称作债券过度波动之谜（Bond
