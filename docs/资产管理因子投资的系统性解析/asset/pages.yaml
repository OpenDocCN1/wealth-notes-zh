  md: '长的一系列广义变量中的一个。在基于消费的资产定价模型中，所有风险都可以用消费来概括——当整个社会或者说经济体中的所有参与者都减少消费时，就会出现经济不景气。我们假设用一个代表性参与者（representative
    agent）来代表社会中所有参与者，该代表性参与者可以被看作是平均水平的人或投资者。为了补偿其持有股票的风险，该平均投资者会获得股票风险溢价。在最基本的消费模型中，仅有一个决定因子，即人均实际消费增长，而其他因子都只是通过影响消费来起作用。这点是合理的，因为最终我们在乎的是经济体中所有参与者的最终消费量。


    股票溢价之谜在于，如果将消费作为一个风险因子，股票溢价应该很低。有多低呢？1985年Rajnish Mehra和Edward Prescott所撰写的一篇研究论文对业界提出了挑战。他们指出，在合理的风险厌恶水平下，即大部分人所具有的1到10的风险厌恶水平（参见第2章）下，股票相对于无风险资产的溢价应该远低于1%。而相反，历史上股票溢价却一直很高。图8.2中Dimson，Marsh和Staunton（2011）的研究数据显示，在1900～2010年期间，美国股票的平均收益比美国债券高6.2%、比美国短期国债高7.4%；全球股票的溢价比全球债券高5.0%、比全球短期国债高6.0%。因此，历史上股票的实际收益要远高于简单经济模型所预测的收益。


    Mehra和Prescott将其论文命名为《股票溢价：难解之谜》（The Equity Premium: A Puzzle），该论文很快引发出一批新的研究文献$
    ^{\text{(1)}} $。他们的模型基于Lucas（1978）的研究，后者是金融经济学领域最具影响力的论文之一，也是Robert Lucas获得1995年诺贝尔奖的一个原因。Prescott随后也因在宏观经济建模领域的贡献获得了2004年诺贝尔奖。


    Lucas证明了资产价格是如何对经济体中的变量做出反应以及这些价格是由经济参与者的最优消费水平和市场供求平衡所决定。Mehra和Prescott在Lucas的研究基础上做出改进，将变量设为消费，并假定有一个具有常数相对风险厌恶效用（constant
    relative risk aversion，简称CRRA）的代表性参与者（参见第2章）$^{\text{(2)}}$。如同资本资产定价模型通过市场因子敞口来对所有资产进行定价一样，基于消费的资产定价模型是通过消费因子敞口来解释所有资产的收益。不过，消费因子与其如何产生各资产风险溢价之间的关系，是一种取决于代表性参与者风险厌恶程度的转换关系。


