  md: "资产所有者通过最大化预期效用做出选择。该问题的规范表述为：\n\n$\\max_{\\theta} E [U(W)]$ \n公式 (2.3)\n\n\
    其中 $\\theta$ 是选择（或控制）变量。这些选择变量可以包括资产配置决策（组合权重）、支出与储蓄计划以及公司生产计划等。公式 (2.3) 中的最大化问题通常是根据约束条件来求解。对于资产所有者而言，这些约束条件通常包括对投资范围的限制以及头寸限制，比如杠杆限制、禁止做空限制或者不能持有特定板块或资产类别，而且，当资产配置决策是跨时期的时候，投资者以往的资产头寸也可能成为当前资产配置决策的约束条件（如换手率限制）。\n\
    \n预期效用框架中非常特殊的一类便是理性预期效用模型。传统意义上，我们推导出这类模型是为了满足某些特定公理（例如独立公理，其大致的意思是如果比起 $y$ 我更喜欢\
    \ $x$，那么当把 $x$ 和 $y$ 在同一彩票中混合起来时，相比获得 $y$ 的可能性，我更倾向于获得 $x$ 的可能性；违背该准则会导致损失厌恶效用（Loss\
    \ Aversion Utility），我将在本章第4节阐述）。毫不奇怪，生活中不少人会做出与公理相悖的选择$^{①}$。但理性预期效用模型只是受到约束的一个子集，我们不能据此就认为预期效用的全部类别都不能作为决策工具。预期效用仍然是指导资产所有者决策的有力工具——即使这些投资者有行为偏好，正如现实世界中大多数投资者一样。事实上，更加广义的预期效用嵌入了行为模型，我将在下面具体说明。\n\
    \n# 2.5 选择理论与什么无关\n\n市场参与者如何做出决策，以及如何建议他们做出正确的决策，与以下因素无关。\n\n（1）财富\n\n更多的财富给资产所有者更多的选择。但是财富本身并不是目标。图2.1表明，我们得到既定水平财富的方式——是通过缓慢稳定的增长而来还是通过极端的上下起伏而来——与我们最终的净财富水平同等重要。效用函数的核心理念是，投资者并不是将每一美元都看作是完全等值的。\n\
    \n（2）幸福\n\n幸福是一种重要的情感，将幸福感最大化可以作为决策时的一项标准。实证研\n\n> ① Kahneman（2011）的书《思考快与慢》（*Thinking\
    \ Fast and Slow*）提出了对投资者行为倾向的深刻理解。"
