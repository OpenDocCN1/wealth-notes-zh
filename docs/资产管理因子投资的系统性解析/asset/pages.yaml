    = $99。杠杆交易所交易基金的回报率为（1-0.3）×130 = $91。在两天之后，指数收益为99/100 -1 = -1%。相对而言，三倍杠杆基金的收益率为91/100
    - 1 = -9%。这与两天之中指数收益率-1%的三倍相去甚远，与一般投资者根据基金名称所预期的收益也很不一样。在多日重复这个过程之后，实际收益与预期收益可能出现巨大的偏差$^①$。


