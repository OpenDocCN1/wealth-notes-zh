  md: '从 21 世纪初以来，大宗商品在机构投资者中大受欢迎。Erh 和 Harvey（2006）以及 Gorden 和 Rounenhorst（2006）的研究表明，大宗商品的回报率很有吸引力，它与股票、债券和其他传统资产类别的相关度都较低，很多机构投资者被大宗商品这些属性所吸引。这些作者们认为大宗商品对冲通货膨胀的效果很好
    ${ }^{\circled{1}}$ 。但是，如下文所见，只有那些与能源相关的大宗商品与通货膨胀率呈现正相关度，但也远远达不到完全相关。


    # 5.1 大宗商品期货


    尽管普遍观点认为大宗商品对冲通胀的效果较好，但是根据经济学的基准情景，在没有提炼成本的完美市场中，例如黄金和石油这类可耗尽（Exhaustible）的大宗商品，它们的价格应该与通货膨胀率不相关
    ${ }^{\circled{2}}$ 。这些可耗尽的大宗商品的价格应该服从随机游走，其远期价格应该按照无风险利率上升。在完美世界中，生产者 在面对需求冲击时可以无成本地调整产量，所有的需求冲击—永久性的或暂时性的—对这些大宗商品的剩余供给会产生永久性的影响。对于非可耗尽（Nonexhaustible）的大宗商品，新的供给总会不断出现，所以供需机制可以一直正常运作，该机制也许不会影响价格总水平。大宗商品一定会自动与通货膨胀挂钩的说法并没有经济学基础。也许不难发现，大部分的大宗商品与通货膨胀率没有什么关系。


    在现实世界中，黄金和石油价格当然不是服从随机游走的。但完美世界的假设依然有用，因为它让我们看到生产摩擦的效果以及投资者和生产者的行为怎样导致大宗商品价格发生符合预期的改变。当今的经济模型显示，大宗商品价格反映了生产成本。这些会随时间变化，当你一旦开始生产，你就不能再把钱拿回来（被称作不可逆投资，Irreversible
    Investments），当前存在不确定性时，这种不可逆的属性给延迟生产赋予了 一个期权价值。大宗商品价格也会受到当前和未来替代品的供给冲击、科技进步的影响—例如，清洁能源技术的突破使石油被淘汰—以及随时间而变化的存储成本
    ${ }^{\circled{3}}$ 。一些研究论文强调了投机者和其他类型投资者的角色 ${ }^{\circled{4}}$ 。例如，投机者可


    +   1. 2000 年通过的商品期货现代化法案（Commodity Futures Modernization Act） 使得机构投资者更容易建立大宗商品仓位。


    Hottelling（1931）首先提出该观点：Weinstein and Zechhauser（1975）和Pindyck（1980）认为该观点存在不确定性。


    Carlson, Khokher and Tisman（2007）指出，这些效应都导致了随机波动性，并决定了远期曲线的形状。


    Keynes（1923）和Hicks（1939）首次提出并发展了这类模型。另一篇影响深远的文章是 Deaton and Laroque（1992）。'
