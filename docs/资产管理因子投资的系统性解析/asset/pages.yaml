  md: '席位授予给受利益集团。因此我不再支持该法案¹。


    一个被特殊利益集团主导的养老金董事会，尤其是在大部分代表者缺乏专业知识的情况下，可能会酿成灾难。假设我们选择董事会模式作为最优治理结构，那么NYSCR应该如何选择董事会呢？


    # 4.1 董事会成员


    公司财务理论和实证数据表明，独立的董事会能增加最大的价值²。我将在NYSCR可以效仿的两种模式进行讨论：加拿大养老金计划投资委员会（Canada Pension
    Plan Investment Board，简称CPPIB）和新西兰养老基金（New Zealand Superannuation Fund，简称NZSF），后者是新西兰的主权财富基金³。两者都有独立于政府的董事会。


    CPPIB是专门负责对加拿大养老金计划的资产进行投资的基金管理人，其目标是“在不承担过度损失风险的前提下最大化投资收益”。它“独立于政府”而设立。根据1997年加拿大养老金计划投资委员会法案（1997
    Canada Pension Plan Investment Board Act）的条款，CPPIB由十二人组成的董事会进行管理。他们由联邦财政部长经过与各省（除了不参与的魁北克以外）磋商之后，在提名委员会的协助下进行任命，任期为三年。他们的任期是交错的，以使任意一年中都不会有过半数的董事任期期满。董事有资格再次当选，最长服务期为三届。董事必须具备投资特长，“拥有可信的金融领域的能力或相关工作经验，以使董事会能有效地达到其目标。”此外，董事必须是“加拿大各不同地区的代表”。董事会里没有政府官员。CPPIB不用向政府提交投资策略或商业计划来获得批准；也不需要政府批准其薪酬政策或薪资水平。若要改变CPPIB的治理结构及其使命，需要联邦政府和代表2/3人口的2/3省份的批准。高级副总裁和首席投资策略师Donald
    Raymond评论说，这“比改变加拿大宪法还要难”。


    NZSF在许多方面都与CPPIB类似⁴。NZSF负责将政府对新西兰养老金（New Zealand Superannuation）的注资进行投资。新西兰政府将于2029年开始从NZSF中撤资


