    ② 参见Cherkes（2012）一篇封闭式基金的总结文章。一些投资公司从经济角度与封闭式基金类似，因为它们已上市且股份的数量是固定的。Berkshire
    Hathaway就是个有名的例子。这些作为公司不受40法案制约。'
