  md: '东帝汶正式独立。


    如今的东帝汶仍很贫穷，人均GDP不足900美元，40%的人口生活在贫困中、成年人中有一半不识字。农村人口失业率高达20%，城镇青壮年失业率也在40%左右。除首都帝力之外，全国其他地区很少有铺平的道路，而且很多道路在雨季无法通行。东帝汶没有国家电网，甚至在首都帝力，电力供应也不均衡且没有保障。大多数人事温饱型农业；刀耕火种的耕作方法造成土壤侵蚀和森林砍伐。这个国家没有自己的银行体系和货币，使用的是美元。


    同时，东帝汶也很富有。2004年，康菲石油公司（ConocoPhillips）开始从该围位于帝汶海的储备中开采石油和天然气。2005年，东帝汶政府设立了石油基金。截至2012年底，该基金的资产规模达到118亿美元。


    为什么东帝汶政府选择设立石油基金，而不是将依赖油气资源获取的意外之财马上投入医疗、教育、住房、道路、公用事业及其他基础领域呢？


    我们会在后面的篇章中回答这一问题。就目前而言，重要的是明确东帝汶石油基金是一家主权财富基金，这意味着东帝汶作为国家是资产的所有者。本章会介绍不同资产所有者（从国家至个人）的主要特征。考虑的对象包括主权财富基金、养老金、捐赠基金、基金会以及个人和家族。这里我并没有涵盖银行、保险公司、资产管理公司或类似的金融机构，而是将它们视为服务于资产所有者的中介（本书第三部分将介绍委托组合管理）。不过，资产所有者及其中介之间的界限是模糊的；主权财富基金和养老金最终服务于包括个人在内的基金所有者，但基金本身是作为单独的实体来进行管理。


    # ## 2. 主权财富基金


    主权财富基金可以被比作大猩猩，这是因为大型主权财富基金通常有着庞大的在管资产池，同时还因为其代表了广大底层资产所有者，即国家的公民^(1)^。


