  md: '承担的是无限责任。Commenda将威尼斯从一个毫不起眼的沼泽地转换成了繁华的La Serenissima（水都）①。


    如今的私募股权投资是投资者之间通过直接交易对私营公司进行投资，而无需通过有组织的交易所②。常见的做法是通过作为私募股权基金的有限合伙人进行投资。资产所有者例如养老基金或捐赠基金，对私募基金进行投资并成为有限合伙人（limited
    partners，LPs）。基金则由像KKR或Kleiner, Perkins这样的私募股权公司来管理，即普通合伙人（general partners，GP）。这些基金通常会投资流动性较差的企业（被称为投资组合公司）。


    私募股权公司从有限合伙人处募集承诺投资资金，而有限合伙人必须按要求在基金初始投资年份到某个预先规定的日期内或是到基金关闭时将承诺资金注入基金。有限合伙人有最大承诺额（即承诺资金）。例如，资产所有者可能承诺在私募股权基金的存续期间提供1亿美元的基金。第一年，普通合伙人召集了2000万美元，剩余的8000万美元可在未来几年内陆续召集。一旦承诺投资，投资者预期不会在基金的存续期内退出——有限合伙人承诺投资的二级市场流动性差，而且交易折让很大。


    # 2.2 私募股权和公开市场股票的对比


    表18.1总结了私募股权和公开市场股票之间的差异。第一个明显差异是公开市场股票在集中市场进行交易且易于交易（即它们是流动性资产），而私募股权是在场外进行交易且难以交易（使得它们缺乏流动性）。场外交易市场存在搜寻摩擦，包括找到交易对手并克服投资者在评估投资组合公司的潜在价值时可能遇到的信息劣势。甚至发起设立一个PE基金也存在搜寻摩擦，因为资产所有者和潜在的GPs必须找到彼此并加以评估。PE在二级市场中
    的交易成本极高：例如哈佛大学的金融危机时期试图退出私募股权基金时曾面临50%的折价（参见第11章）③。


    表18.1


    | | 公开市场股票（标普500） | 私募股权 |

    | :--- | :--- | :--- |

    | 市场 | 集中化且流动性高 | 场外交易且流动性低 |

