  md: '# 资 产 管 理


    # 因子投资的表现性解析


    # 第10章


    # 阿尔法（及低风险异象）


    # 本章概要


    阿尔法（Alpha）——超过基准组合收益率的平均回报率——不仅体现了超越基准组合收益的投资技巧，更传递了构建该基准的各种因子的信息。阿尔法在某一组因子下为正值，但在另一组因子下可能变成负值。不论采用什么基准，在统计上都很难判定阿尔法的存在，尤其是当风险调整随时间变化而变化时。风险异象（Risk
    Anomaly）——即低贝塔和低波动率股票具有高回报率——是相对于标准的市值加权基准以及价值—成长、动量和其他动态因子而获得阿尔法的重要来源。'
