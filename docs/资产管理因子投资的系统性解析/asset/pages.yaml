  md: '④人们已有一些年金产品。大部分美国人都有资格获得社会保障金——这是一种与通货膨胀挂钩的年金。通货膨胀保护对投资者而言非常有价值，但对政府来说成本很高。根据MetLife的估算，为一对66岁夫妇支付最大社会保障福利的年金要花费近120万美元$^{①}$。


    社会保障可能已经满足了大部分美国人的年金需求。然而Yogo（2011）等研究者认为对于平均消费者而言，在社会保障基础上购买额外的年金仍是最有利的。我也相信本书平均读者的理想退休生活无法仅由社会保障来维持。


    社会保障本身就存在资金不足的问题；社会保障管理总署（Social Security Administration）估计其资金池将于2033年枯竭。支付所有已在计划中的社会保障福利所需的额外资金量相当于美国国债未偿总量的80%$^{②}$。所以并不是仅私营公司提供的年金才有信用风险问题。


    ⑤遗产。也许过世的人确实有效用函数。非常富有的人采用信托来确保他们的后代在遵守特定条约的前提下可以继承遗产，大学或基金会的捐赠者也会制定资金的限制使用条款（参见第1章）。许多人都想给自己的后代留下一些遗产。Inkmann，Lopes和Michaelides（2011）证明，留下遗产的意愿是不购买年金的一个强有力的原因；许多人宁愿自己管理资金并承担长寿风险，这样他们就有一些能传承给子女的东西$^{③}$。


    ⑥鼓励年金需求。尽管很少有人购买年金，但有证据表明年金的参与率会随 着财富、受教育程度和预期寿命的增加而增加——这也是决定投资者首先是否愿意持有 股票的因素（参见第2章）$^{④}$。这些人能理解年金带来的好处，所以更好的金融教育可以扩大年金市场。改变看待年金的思维框架当然也会起作用。同样，如果监管者允许人们退休时从养老金固定收益计划中部分年金化（即允许退休者能以年金和一次性付款相结合的方式获取资金），这也会推动年金需求增长$^{⑤}$。


    部分养老金固定收益计划的出资方积极鼓励退休者采用年金。United Technologies 会自动将受益人加入“安全收入基金”（secure income
    fund），这样当股票和债券表


    > ①参见“Falling Short”，经济学人，2011年4月9日。

    ②数字来自联邦老年人和幸存者保险与联邦残疾人保险信托基金金理事会2012年年度报告（The 2012 Annual Report of the Board
    of Trustees of the Federal Old-Age and Survivors Insurance and Federal Disability
    Insurance Trust Funds）。社会保障体系的负债并不具有美国政府的“充分信誉”（full faith and credit）支持，并且没有被计入政府负债。弗利美和房地美负债也不具有明确的政府担保，但现在联邦政府是这两家公司的唯一所有者。Hamilton（2013）估计联邦政府的所有者表外担保加在一起有70亿美元，是公司的表内负债的6倍。

    ③参见De Nardi，French and Jones（2010）以及Yogo（2011）。相反地，Hurd（1989）估计遗产接近于0。

    ④参见Brown（2009），Inkmann，Lopes and Michaelides（2010），以及Besharars et al.（2012）。

    ⑤参见www.treasury.gov/press-center/press-releases/Documents/020212%20Retirement%20Security%20
    Factsheet.pdf.'
