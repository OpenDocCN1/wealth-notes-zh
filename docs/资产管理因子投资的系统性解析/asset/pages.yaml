- pgno: 343
  md: '涉及动态期权的策略，可以仿造出阿尔法¹。举一个极端（且算得上典型）的例子，参见图10.7。我按照Black–Scholes（1973）的定价方式，采用小样本构建了“卖出挂钩于市场组合的看涨期权”的投资策略。这些看涨期权的回报率在图中用×表示。然后，我对这些模拟出来的回报率进行了CAPM模型回归分析。“阿尔法”看起来是正值，但是我们其实知道在Black–Scholes的框架里，看跌期权或看涨期权并不会创造额外价值。这种阿尔法完全是虚假的。产生该问题并不是由于样本小（尽管样本小会加重该问题），而是由于线性分析框架无法充分捕捉到非线性策略的特性²。这在现实中是一个较为严重的问题，因为诸多常用的对冲基金策略，例如并购套利、配对交易、可转债套利，它们的回报都类似于非线性的期权波动率策略³。


    为什么无法准确衡量动态的非线性策略的阿尔法呢？因为买卖期权——或其他任何动态策略——会改变回报率的分布⁴。静态的衡量指标，例如阿尔法、信息比率、夏普比率，都只能捕捉到回报率整体分布的某些特定部分。通常来说，做空波动率策略可以使得阿尔法和信息比率虚高，因为这些策略会增加分布的负偏度（negative
    skewness）。即这些策略会扩大分布左尾的损失并使分布中段“变宽”，如果用线性业绩指标来衡量就会显得更有吸引力。阿尔法和信息比率并不考虑偏度以及更高阶矩的情况。


    我们可以用两种方法来分析非线性回报。


    # 引入可交易的非线性因子


    如第7章至第9章所讨论的，市场总波动率风险是一个重要的因子。如果要获得做空波动率策略的效应，一个简单的方式就是引入波动率风险因子。我们也可将其他的非线性因子纳入因子基准中。这样一来，资产所有者就是假设她自己能够交易这些非线性因子。但是，有时只能通过某些特定的基金管理人才能获得这些因子的敞口。在第17章中，我将阐述控制非线性因子会如何关键性地改变对冲基金的阿尔法。Fung和Hsieh（2001）以及其他研究者指出，对冲基金回报率通常十分倚重于期权策略。


    ① Dybvig and Ingersoll（1982）首次提出了此问题。从技术层面讲，这是因为任何因子模型（Dybvig和Ingersoll使用了CAPM模型）隐含地允许定价核为负，并允许出现套利（参见第6章）。线性定价核可以准确地对所有基准资产（股票）进行定价，但是无法准确地对衍生品那样的非线性回报进行定价。


    ② 如需了解更为规范的分析，参见Lakonishok（2000），Lo（2001），以及Gnasoni，Huberman and Wang（2011）。你总是可以通过卖出波动率的方法来打败市场组合的夏普比率（或信息比率）。


    ③ 分别参见Mitchell and Pulvino（2001），Gatev，Goetzmann and Rouwenhorst（2006），以及Agarwal
    et al.（2011）。


    ④ 即使是简单的再平衡，也会存在该问题；参见第4章。'
