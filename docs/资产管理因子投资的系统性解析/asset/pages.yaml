  md: '有趣的是，在投资年限延长至20年甚至30年时，不可扣除的个人退休账户及股票类基金二者的表现互换次序。从短期来看，股票类基金表现突出。例如，以10年为限，股票类基金累积到2399美元，超过不可扣除的个人退休账户所累积的2272美元。所以如果投资期限很短，那么不用考虑罗斯个人退休账户（Roth
    IRA），可将资金直接投入共同基金。但如果投资期较长，不可扣除的个人退休账户则脱颖而出。以30年为限，不可扣除的个人退休账户将累积到18492美元，完胜股票类基金的13804美元（如果你年满二十五岁并且正在阅读本书，建议你每年按出资上限将资金投入到不可扣除的个人退休账户）。直观的解释是，不可扣除的个人退休账户收益按12%的税前收益率实现复利增长（参见公式（12.2）），而共同基金则按9.1%的税后收益率实现复利增长（参见公式（12.3））。这种优势在短期内被适用税率的不同所抵消，不可扣除的个人退休账户适用较高的所得税税率，共同基金适用较低的资本利得税税率。但随着时间的推移，“利滚利”对不可扣除的个人退休账户的贡献显现出来。这就是复利的妙处所在。


    很显然，税收十分重要。这个简单的例子说明以下几点：

    ①以避税方式进行储蓄最为重要。其他一切都是次要的。

    ②按照出资上限向免税账户缴款后，最优配置决策可变得十分复杂，这可以取决于时间期限和税率。不同的投资工具会有不同的税收影响。税收待遇与资产收益相互作用，使得同时优化资产配置和定位的决策复杂化。

    ③个人需要关注的是税后回报，而不是税前回报。遗憾的是，金融行业大多数只报告税前回报。


    上述第一点至关重要。你可以通过税收递延退休金账户进行储蓄，或者你找到可以支付免税收益的资产。市政债券就是这样一类非常重要的资产，可在应税账户中实现财富的免税累积。


    # 3. 市政债券


    # 3.1 市政债券市场的特点


    市政债券是指由州、县市、501(c)(3)非营利组织（即以《美国联邦税法典》（Internal Revenue Code）给予免税待遇的相关条款来命名的组织）及其他免税机构'
