    # ### 5.4 黄金


    黄金对冲通货膨胀的效果并不好。在投资者的分散化投资组合中，对黄金的配置具有一定的意义，但如果把它看成一种实际资产，它的配置效果并不好。


    人们对黄金通常有两个误解：第一，黄金因其与通货膨胀率的相关性，而成为较好的通胀对冲工具；第二，黄金的长期回报率明显高于通货膨胀率。让我们来检验这两点。我使用了全球金融数据库中的数据，在图11.7-A画出了从1875年9月至2011年'
