    \quad\left(1+r_{t+1}\right)$$ $$(1+r_{t+2}) \cdots \neq 1+r_{t}+r_{t+1}+r_{t+2}+\cdots$$。随时间推移，这些乘数的复合计算产生了很多非线性项，即被称为Jensen项（Jensen’s
    terms），而这些非线性项的效应随着时间而增加。全部的再平衡溢价都来自于Jensen项 $^{\text{①}}$，事实上，关于分散化收益和凯里法则的学术研究整体上可以看成是向Jensen不等式（Jensen''s
    Inequality）致敬。


    Jensen项的出现，是因为几何（Geometric）收益率和算数（Arithmetic）收益率的差别，几何收益率考虑了长期的复合计算，而算数收益率则没有
    $^{\text{②}}$。在单一投资期的设定中，几何收益率和算数收益率在经济学意义上是等同的；它们仅仅是描述财富增加或减少的不同方式。因此，对于短期投资者而言，并没有再平衡溢价。但在跨越多个投资期时，几何收益率与算数收益率就有所不同，差别是关于资产波动率的函数，具体来说，近似于
    $\frac{1}{2} \sigma^{2}$，其中 $\sigma$ 是算数收益率的波动率。波动率越大，再平衡溢价越大。由于这种效果会随着时间而变得明显，只有长期投资者可以获得再平衡溢价。


    对于美国股票而言，长期投资者可以获得的再平衡溢价大概为 $\frac{1}{2}(0.2)^{2} \approx 1\%$。Erh和Harvey（2006）估计商品交易中的再平衡溢价约为
    $3.5\%$。这对于简单的、自动的再平衡来说是显著的溢价。耶鲁大学捐赠基金的超级明星基金经理David Swensen，在他2009年出版的书①中强调了再平衡在其投资管理实践中所扮演的重要角色，特别是耶鲁大学捐赠基金的流动性组合的日常再平衡。他提到了由于保持恒定的风险特征（Risk
    Profile）所获得的“再平衡奖励”（Rebalancing Bonus）。


    那么，再平衡是最优策略是否不仅是因为其降低了风险，还因为其以再平衡溢价的形式提供了“免费的午餐”呢？并不尽然。第3节中，我们通过将再平衡解读为一种期权策略，发现再平衡策略并没有市场价值。再平衡溢价似乎好得令人难以置信——事实上的确如此。再平衡策略是卖空波动率策略，当资产价格永久性持续增长到更高水平或永久性地滑落到零直至消失时，它的表现比“买入并持有”策略要差。再平衡策略是对市场机制改变的卖空。再平衡溢价背后的关键假设是，再平衡操作所包含的资产将一直存在。如果资产经历了不可逆的资本毁灭，那么再平衡策略


