  md: '流动性给投资者。不同于封闭式基金的是，交易所交易基金的股份份额不是固定的，基金的发起人可买卖股份以保证交易所交易基金的报价贴近基金资产的净值。交易所交易基金大部分被归类为共同基金或单位投资信托。交易所交易基金的市场成长迅速，其市场占比从2000年不到1%增长到2011年超过8%，如今交易所交易基金持有超过一万亿美元的资产。


    # 2.2 减少利益冲突


    在40法案之前，投资者相对于基金管理人处于巨大的劣势地位。简单地说，基金管理人经常明目张胆地从投资者处盗取资产①。40法案阻止了这种现象，而且进一步“最小化了利益冲突”。它创造了一大类的保护—一般投资者利益的投资工具，并且在这个方面做得很出色。


    40法案通过如下方式缓解代理问题。


    # 强制性透明度


    注册投资公司必须提供招股说明书，披露基金的投资目标、策略、风险、费用和股份交易的说明。40法案要求定期向美国证券交易委员会提供招股说明书和其他报告并将这些提供给公众。财务报表必须通过审计，基金的持仓情况必须报告（共同基金每季度报告，交易所交易基金每天报告），且基金必须公布它们在代理投票中怎样投的票。所有这些信息在很大程度上都是标准化的，因此个人投资者可以在基金之间作比较，一些投资咨询公司（例如晨星，Morningstar），将这些信息加以对照和传播，并基于数据提供选择基金的建议。


    重要的是，40法案保证了投资者能通过净资产价值（NAV）知道基金投资的市场价值。共同基金投资者可放心的基于基金持仓的价值减去任何适用的费用进行交易。


    # 强制监督


    共同基金拥有董事会。至少40%的董事必须是基金管理公司之外的独立董事（虽然他们是否真的独立行事是另外一回事）。从2003年开始，美国证券交易委员会要求每个基金和基金管理人必须聘请首席合规官。由美国证券交易委员会监控基金的


    > ① 根据Farina、Freeman and Webster（1969），一份1940年美国证券交易委员会的报告计算1920年至1930年之间投资公司不当行为给投资者带来了超过10亿美元的损失。该报告突出了发现的多种投资管理人窃取投资者钱财的方式。多种渎职行为使得报告读起来很有意思。'
