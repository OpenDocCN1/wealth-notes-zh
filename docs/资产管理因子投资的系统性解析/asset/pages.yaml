  md: '# 译者序


    译者最初结缘Andrew Ang（洪崇理），是源于Ang, Goetzmann和Schaefer（2009）对挪威主权财富基金的研究报告。其研究表明，对于在管资产规模现已近万亿美元的NBIM（Norges
    Bank Investment Management，挪威央行投资管理公司）这种业界超大型机构投资者而言，其总组合收益的方差有99.1%来源于被动指数，仅0.9%来源于积极管理人的超额收益，而且积极管理人的超额收益主要来源于规模（size）、价值（value）等系统性因子带来的溢价。该研究发布后如一石激起千层浪，引起学术界和业界的广泛关注，也推动了近几年对于因子投资、聪明贝塔/智能贝塔（Smart
    Beta）、新型指数等热点话题的探讨。


    目前市场上传统的资产配置是基于资产类别进行的，资产类别可以大致划分为股票、债券、大宗商品等，业界也常将对冲基金、私募股权视为单独的资产类别纳入资产配置。大量投资理论和实践证明，对于投资者的总组合而言，有80%～90%的投资回报来源于资产配置决策，仅10%～20%来源于证券选择或者择时判断，这凸显了资产配置在投资中的重要性。Andrew
    Ang（洪崇理）的新书《资产管理：因子投资的系统性解析》正是从资产管理和资产配置的角度展开的。但他认为，只专注于资产类别的狭义方法（通常采用均值—方差优化模型）显得过于粗糙，投资者应该更专注于因子风险。因为资产是由一系列因子组成的，每个因子都界定了对平均投资者而言的不景气时期（bad
    times）。不同的投资者应该根据他们各自在不景气时期能多大程度地承受损失，来对因子风险进行最优化配置。正如健康的饮食需要我们透过食品标签看其背后的营养成分构成，因子投资也需要我们透过资产类别的标签去了解资产背后的因子风险。


    业界很多人认为因子投资会对投资界带来继Markowitz（1952）现代投资组合理'
