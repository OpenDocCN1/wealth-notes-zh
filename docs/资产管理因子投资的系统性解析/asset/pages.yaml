  md: '分析的一大区别在于SMB系数，BAB因子的该系数为正值，而VOL因子为负值。这表明，贝塔值异象更多地出现在小股票上，而波动率异象则在大股票上更为常见，因为这些大股票的流动性更好，通常更容易进行交易。


    所以，你是应该选择低波动率策略，还是低贝塔值策略？这不是一个“二选一”的问题，而是两者你都应该选择。


    # 4.5 解释


    我们仍在寻找关于风险异象的一个更全面的解释。我认为，真正的解释应当综合考虑以下所有原因，以及还有待发现的其他潜在原因。


    # 数据挖掘（Data Mining）


    一些文献正确地指出，Ang等（2006）研究的原始结果可能存在数据挖掘的问题。该研究结果对于不同的组合权重设定方法以及非流动性效应有一定的敏感性$^{①}$。但大体来说，低风险异象确实是普遍存在的。近期Chen等（2012）的调研文章认为，“非系统性波动率是股票的常见现象”，并不是由于微观结构或流动性偏差导致。


    驳斥数据挖掘的最佳论据是，低风险效应存在于许多不同的情境中。Ang等（2006）研究显示，无论是在经济衰退还是扩张时，在稳定时期还是波动时期，都存在低风险效应。Ang等（2009）研究显示，该效应在国际股票市场上出现过。Frazzini和Pederson（2011）研究显示，“低贝塔值组合具有高夏普比率”这一现象出现在美国股票、国际股票、美国国债、不同期限和评级的公司债券、信用衍生品市场、大宗商品以及外汇市场中。Cao和Han（2013）以及Blitz和de
    Groot（2013）的研究分别显示，低风险效应甚至出现在期权和大宗商品市场中。低风险效应真是无处不在。


    # 杠杆限制（Leverage Constraints）


    许多投资者都会受到杠杆限制——他们希望承担更多风险，但却无法在组合中使用更多杠杆$^{②}$。由于他们不能借钱，他们选择了次优的方法——买入“内嵌”杠杆的股票，例如高贝塔值股票。他们的不断买入推升了高贝塔值股票的价格，直到股价出现高估，回报率开始下降。在CAPM分析框架下，杠杆受限的投资者们对高贝塔值'
  merge: -1
  img_proc: true
- pgno: 355
  md: '股票的大量需求使得证券市场线变得平缓（参见第6章）。但是，杠杆受限之说只能解释高贝塔值股票的价格高估，并不能解释低贝塔值股票的价格低估。因此，它不能解释为何低贝塔值或低波动率资产有比市场组合更高的回报率，只是可以解释为何一些低贝塔股票能够获得正阿尔法。该解释还预测杠杆受限的投资者会热衷于高风险股票；但在现实中，机构投资者通常低配高风险股票；非系统性波动率较高的股票主要被个人投资者持有或交易¹。


    # 代理问题（Agency Problems）


    许多机构投资者无法也不会主动通过风险变异来赚钱。尤其是，他们使用的市值加权基准本身就可能会导致低波动率异象²。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_355_0.png)


    图10.14画出了贝塔值与预期回报率在理论上的相互关系，即向上倾斜的虚线“CAPM”（证券市场线）。实际数据的回报率与贝塔值的关系则用水平虚线“Data”表示。我们来考虑两只股票A和，A相对于CAPM的阿尔法为正值，B的阿尔法为负值。对于那些没有投资限制的投资者而言，他们会买入A（能带来比CAPM更高的回报），卖出B（相对于CAPM其回报过低）。在一个完美的世界中，这些不受限制的投资者会推升A的价格，直至A的超额收益消失。同样他们会压低B的价格，直至B的回报率回升到相对于CAPM预测的公允水平。在这一完美世界，风险异象就不存在了。


    ① 学术上的研究参见Han and Kumar（2011）。通过罗素1000指数成分公司截至2012年6月30日的13-F报告，Maringale计算出机构持有46.5%的低风险股票和33.5%的高风险股票，而不是对这两类股票各持有均等的50%。


    ② 参见Greenwood et al.（2010）以及Baker, Bradley and Wurgler（2011）。'
