  md: '与20世纪20年代市政债券在纽约证券交易所交易活跃时期相比，明显高出了一倍。考虑到技术的巨大进步，还会有其他证券如今的交易成本比100年前的更高吗？


    图12.2揭示了市政债券市场流动性缺乏的现状。我们根据每年交易数量把所有市政债券分为十组，剔除从未交易过的债券，并且只考虑债券发行90天后发生的交易，排在前10%的流动性最差的债券，每五到六年交易一次。典型的市政债券每年交易一至两次。即使是流动性最强的市政债券也是平均每两天才交易一次。由此可见，市政债券极其缺乏流动性。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_407_0.png)


    令人痛心的是，这些以吸引个人投资者为主的债券，交易效率极其低下，操作极其繁琐。市政债券市场的改革将会给普通民众带来极大的好处，同时也会通过降低发行成本为纳税人节省数十亿美元。但改革举步维艰：美国证券交易委员会（以下简称SEC）不负责监管市政债券市场，无法效仿对普通证券所采取的措施，包括强制要求信息披露或最低会计标准。事实上，美国资本市场监管的主要框架（即1933年证券法和1934年证券交易法）明确了市政债券所享受的豁免权，除反欺诈法规之外可以不必遵守其他联邦监管规定。SEC尽其所能，但深受掣肘$^{①}$。按SEC委员Elisse
    Walter的说法，市政债券的投资者常常被视为“二等公民”$^{②}$。市政债券市场信息不透明且流动性差，部分是因为该市场处于按州分割的状态。国会不能简单地号令各州加强信息披露、设立一个市场监管机构，或是规范债券发行类型，因为这些都属于州政府管辖的'
