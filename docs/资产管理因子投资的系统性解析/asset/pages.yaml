  md: '油基金称得上是规模巨大，因为挪威主权财富基金规模仅相当于挪威一年的国内生产总值，而东帝汶石油基金规模相当于该国全年产出的十倍）。我自2005年起担任挪威主权财富基金的顾问，针对战略资产配置给予咨询建议，这对我的研究和教学工作产生了深远影响。在此，由由衷感谢挪威主权财富基金对我的启迪，特别是在因子投资领域的研究工作，已形成了本书的一些观点。通过挪威，我有幸结识了来自欧洲、中东、亚洲、澳大利亚、新西兰以及美国的代表政府和大型基金管理公司的人士。


    # **2.1    主权财富的增长**


    主权财富基金是国家主权储备的一部分，后者包括中央银行储备、大宗商品储备或稳定基金、国家养老金储备、政府控股管理及国有企业。主权财富基金被定义为由一国政府控制的，至少部分投资于境外资产的投资基金$^{①}$。本质上来讲，主权财富基金是将一个国家的储蓄从现在转移到未来。许多不同类型的政府——从民主的到专制的——纷纷创建了主权财富基金，对基金的管理模式也多样化，既有成立独立的国有公司进行管理，也有由中央银行直接管理。


    美国目前有不少家主权财富基金，均由州政府创建$^{②}$。其中，规模最大、历史最悠久的是阿拉斯加永久基金（Alaska Permanent Fund），它于1976年根据州宪法设立，资金来源于矿产租赁的租金收入。截至2012年8月31日，该基金规模已增至420亿美元。每年阿拉斯加的所有居民都会从该基金收到一笔分红，2012年的金额为878美元。美国最近设立的主权财富基金是成立于2011年的北达科他州遗产基金（North
    Dakota Legacy Fund），北达科他州30%的石油及天然气税收收入流入该基金，预计该基金将随着页岩油的热潮迅速增长。此外，还有新墨西哥州开采税永久基金（New
    Mexico Severance Tax Permanent Fund，成立于1973年）、怀俄明州永久矿产信托基金（Wyoming Permanent Mineral
    Trust Fund，成立于1974年）和阿拉巴马州信托基金（Alabama Trust Fund，成立于1985年）。


    尽管主权财富基金包含不同类型的投资者，但它们都有一个显著的特点即属于国家政府所有，这使得其管理模式有别于私营金融机构。大型主权财富基金规模庞大。挪威主权财富基金拥有超过5000亿美元的资产。中国的中国投资有限责任公司（China
    Investment Corporation，简称CIC）和国家外汇管理局（State Administration of Foreign Exchange，简称SAFE），与沙特阿拉伯货币局（Saudi
    Arabian Monetary Authority，简


