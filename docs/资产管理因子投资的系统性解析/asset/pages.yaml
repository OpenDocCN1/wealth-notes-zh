    # 3.2 宏观因子期限结构模型


    我们通过传统的货币政策来影响收益率曲线的短端时，曲线的长端同时也会受到影响。但是，位于曲线长端的长期债券的价格在很大程度上却是由市场决定的（由于量化宽松政策的原因，目前并不完全由市场决定），因此，美联储对于长期债券价格的控制力远远弱于对于联邦基金利率的控制力。在图9.2中可以看到，三个月短期国债收益率几乎与联邦基金利率是同步运动的。同样的宏观因子，或者水平因子，将通过无套利原理（no
    arbitrage）影响整条收益率曲线。


    > ① 早期的经济模型假设风险溢价是恒定的，因此它们无法解释长期债券的过度波动现象，也无法解释收益率曲线在通常情况下向上倾斜的现象（参见Bakus，Gregory和Zin（1989），以及de
    Haan（1995））。


    > ② 参见Gurkaynak，Sack和Swanson（2005）。'
