- pgno: 61
  md: '估计的波动率策略概率密度函数相比于正态分布来说，有一个更瘦的主体和更长的尾部。我们用希腊语“尖峰”（leptokurtic）描述这种分布，因为它们比正态分布在中央有更瘦长的分布。当分布有更瘦长的主体时，它也就有比正态分布更长的尾部。作为比较，在图2.2-B中，我们对标普500指数进行了同样的分析。这段时间的股票收益率也有尖峰，但程度比波动率策略少得多。尽管股票的收益率分布也有一个显著的左侧尾部，但与正态分布比较近似（尽管对股票而言其回报更接近正态分布，但是有很多文献正式否定了股票回报呈正态分布）。


    我们用矩（Moments）来概括概率密度函数。矩测量了概率密度函数的形状，例如中心的位置（均值Mean）、收益率的分散程度（方差Variance或标准差Standard
    Deviation）、左尾和右尾的延伸度（偏度Skewness）以及尾巴的厚度（峰态Kurtosis）。波动率策略和标普500的收益率的前四阶矩分别是：


    | 表2.1 |  |  |  |

    | --- | --- | --- | --- |

    |  | 波动率策略 | 股票 |  |

    | 均值 | 9.9% | 9.7% |  |

    | 标准差 | 15.2% | 15.1% |  |

    | 偏度 | -8.3 | -0.6 |  |

    | 峰态 | 104.4 | 4.0 |  |


    波动率策略和股票具有大致相同的均值，在10%左右。我们在图2.1中可以看到，图2.1两种策略产生的累计财富有大致相同的终值^(1)。尽管做空波动率策略和标普500指数的标准差（或波动率——我会交替使用这两个术语）也很相似，为15%，波动率策略的长左尾导致了较大的负偏度（-8.3）和巨大的峰态（104）。标普500则有相对较小的偏度与峰态，分别为-0.6与4.0。作为对比，正态分布有0偏度和3.0的峰态。因此我们可在图2.2-B中看到，正态分布与股票收益的分布相当接近。


    # 2.2  风险厌恶


    虽然财富的概率分布向我们展示了收益率的可取值区间及其发生的频率，但是投资者并不直接根据收益率进行决策。相反，收益率被看作效用函数（Utility Function）中的输入值，效用函数定义了投资者对好的或者坏的收益率的感觉。简单地说，效用传达了“你感受如何”的概念。效用函数为投资者界定了那些不景气时期的情景。


    ^(1)  波动率策略收益率与股票收益率的相关系数为0.51；本章只考虑了单一风险资产和无风险资产之间的资产组合选择，第3章将考虑包含多个风险资产的资产组合。'
