  md: '的水槽” 。LP的资本注入和分红在流动性好时都有周期性。当市场估值高时，PE基金在市场繁荣时提供流动性，但市场估值较低时却提供了任何流动性。这在2007
    ~ 2008年金融危机期间显得格明显：PE承诺投资成为许多投资者的沉重负担，在他们最需要保留现金时却被迫筹资以满足资本召集的要求。(1)


    杠杆会增加对系统性因子风险的敞口。杠杆能解释私募基金的绝大部分收益，如果不考虑杠杆的话，资产所有者会高估私募股权的收益率。Acharya等（2013）估计杠杆对私募基金收益率的贡献超过50%。


    # ### 3.5 持续性


    尽管一般的基金管理人表现平庸，但还是有些管理人能为投资者带来超额收益。PE基金收益率通过横向比较存在很大差异。那些能创造价值增值的基金管理人通常也能够持续有不俗表现。因此，PE投资应关注横向比较差异而不是平均水平。


    自Kaplan和Schoar（2005）以来，学术文献陆续论证了PE收益具有显著的持续性。PE基金的募集具有一定连贯性。如果在2005年募集的基金ABCII表现较好，那么在2007年募集的基金ABC
    III也会表现良好。测算显示，某基金收益率提高1%，会与下一支基金收益率提高0.5%相关联(3)。并且，由于这种持续性非常强，即便两支基金的发行期不相邻，二者之间仍具有显著的的可预测性。也就是说，在2005年募集的基金ABCII能预测2010年募集的基金ABCIV也会表现优异。


    Kaplan和Schoar（2005）发现，业绩排名在“第一象限（也称第一四分位）”的基金通常有超额表现。如果业绩表现具有持续性，那么这似乎是明智的LPs挑选管理人的一种方法，因为胜出的管理人会持续获胜。Kaplan和Schoar的研究使得所有PE管理人都希望挤进第一象限。


    遗憾的是，在PE世界里有“乌必岗湖效应”，每个PE基金管理人都认为自己排在第一象限(5)。根据咨询公司PERACS的研究，77%的公司都声称自己的排名位于第一象限(6)。它们是如何做到的呢？由于PE行业中没有一致的基准，所以管理人会挑选对他们有利的标准。有些基金以内部回报率为衡量指标来声称其位于第一象限，另一些


    +   (1) 哈佛大学和CalPERS正是这样的投资者。参见哥伦比亚大学案例，ID100312 “Liquidating Harvard” 和 #120303
    “California Dreaming: The Moss at CalPERS”。


    +   (2) 参见 Kaplan and Schoar（2005）、Philippson and Gottschalg（2009），以及Hochberg，Ljungqvist和Viscioussen（2010）的研究。


    +   (3) 该章节的学术版本参见Harris、Jenkinson and Stucke（2012）。


    +   (4) 参见Philippson（2011）。'
