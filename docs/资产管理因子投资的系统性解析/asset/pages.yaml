- pgno: 30
  md: '市场必须通过自身储蓄来渡过难关。而这些国家也正如他所建议的，纷纷在21世纪初加大了主权储蓄。


    套用经济学家的术语，主权财富储蓄是出于预防性需要，是自我保险的一种形式 1 。然而主权财富基金管理的资产规模或许有些过大；Lee（2004）指出新兴市场国家的储备平均占到国内生产总值的17%。正如查尔斯·狄更斯（Charles
    Dickens）的小说《圣诞颂歌》（A Christmas Carol）中所描写的守财奴Ebenezer Scrooge最初错过了庆祝圣诞节的欢乐、过度储蓄的国家必然减少消费。事实上，一个国家本可以将资金更有效地运用于国民经济的其他领域，比如提供更好的社会保险、医疗或教育计划（让Scrooge的可怜雇员Bob
    Cratchit及他的残疾儿子Tiny Tim生活得更加幸福）。主权储蓄的最优规模是在消费和投资的机会成本与自我保险的价值之间寻求的一个平衡点。


    # 2.3 "荷兰病"


    东帝汶创建主权财富基金的初衷并不是为了预防性储蓄，而是为了避免患上“荷兰病”。


    “荷兰病”（或“资源诅咒”）一词首次出现在1977年的《经济学者》（Economist），是用于描述荷兰在上个十年发现天然气后制造业萎缩的情况。20世纪70年代的英国也发生了类似情形，当时英国在北海发现了石油。一旦一个国家发现某种自然资源，制造业和其他贸易部门就会有所下滑，同时本币升值导致该国贸易部门的竞争力有所削弱。资源的盛宴同时也滋生了更多腐败和政府支出的浪费
    2 。


    尼日利亚可能是罹患荷兰病最严重的例子 3 。油价从20世纪60年代戏剧性地上涨到21世纪初，然而尼日利亚却一直位列全世界20个最贫穷的国家之一。1970~2000年期间，每天生活标准不足1美元的人口比例从25%上升到70%，而巨额的石油收入则被军事独裁统治者们所鲸吞。'
