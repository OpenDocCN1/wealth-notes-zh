- pgno: 13
  md: '在本书的第二部分，我主要阐述了资产所有者可以通过因子风险敞口来获取相应的风险溢价。经济增长放缓、通货膨胀过高或加速以及波动率飙升等时期对大多数人来说是不景气时期。还有些因子属于可交易的投资风格，如价值—成长投资、动量投资、超配非流动性资产等。资产是由一系列因子组成的，每个因子都界定了对于平均投资者而言的不景气时期。长期来看，具备因子敞口的投资者能获取更高投资收益，但也面临风险。因为因子在不景气时期可能表现不佳——有时显著落后，但平均来看，因子能带来超额收益。此外，不因投资者套利而消除的行为偏差也会导致因子风险溢价。


    将单个投资者的不景气时期集与平均投资者相对比，有助于该投资者更好地评估其是否能承担相应风险从而在长期获取因子溢价。如果该投资者能比平均投资者更好地经受住不景气时期，那么他能承担大部分投资者所不愿承担的风险。这些因子在不景气时期会亏损，但在其他时期能带来颇具吸引力的回报以补偿损失。因子投资是将某个投资者在其不景气时期的感受和行动与平均投资者进行对比。不同的投资者应该根据他们在不景气时期能好好地承受损失来对因子风险进行最优化配置。正如健康的饮食需要我们透过食品标签查看其背后的营养成分构成，因子投资也需要我们透过资产类别的标签去了解资产背后的因子风险。


    在本书的第三部分，我探讨了资产所有者如何在委托他人管理其组合时尽可能少地增加其面临的不景气时期。资产所有者与委托管理人之间最糟糕的关系会导致资产所有者经历更多的不景气；对于基金管理人而言最好的事情，通常并非对资产所有者有利。合适的治理结构和契约有子小化由于代理冲突所造成的不景气时期。本书结合最常见的投资工具——共同基金、对冲基金、私募股权——论证了基金管理人虽然有才能但平均来看却几乎没有增加资产所有者的财富，该结论与金融理论是一致的。对冲基金和私募股权并非资产类别，它们不过是将众所周知的因子风险包装在嗨诹含糊的合同中而已。对冲基金尤其具有波动率风险敞口，私募股权则在很大程度上不过是加入了杠杆的公开市场股票。


    因此，本书的三个主要议题分别是：


    +   第一部分：资产所有者必须认知到他们的不景气时期；


    +   第二部分：因子存在溢价以补偿不景气时期所造成的损失。重要的是因子，而不是资产类别标签；


    +   第三部分：监督好委托管理人，以确保委托管理人不会给投资者带来更多不景气时期。


    资产管理实际上是关于界定什么是投资者的不景气时期，当投资因子表现不佳时'
