    # 3.2 不使用无风险资产


    基准组合不是必须要包含无风险资产。


    # CalPERS


    CalPERS是美国最大的公共养老金，截至2011年6月30日旗下共管理2460亿美元的资产①。该养老金的基准可能是一个由一系列股票指数基金和债券指数基金所组成的被动组合——这也是加拿大养老金计划（Canada
    Pension Plan）通过其参考组合（Reference Portfolio）所使用的基准。股票—债券基准能以接近于零的极低费用获得，它是衡量积极管理能否增加价值的可靠标尺。


    我们按照上述基准对CalPERS的回报率作回归分析：


    ```

    r<sub>u</sub> / $1 = α + (β<sub>s</sub> * r<sub>s</sub> + β<sub>h</sub> * r<sub>h</sub>)
    / $1 + ε<sub>u</sub>    公式 ( 10.12 )

    ```


    ① 本节的数据和其他相关信息来自“California Dreaming: The Mess at CalPERS”，哥伦比亚大学案例#120306和“Factor
    Investing: The Reference Portfolio and Canada Pension Plan Investment Board”，哥伦比亚大学案例#120302。'
