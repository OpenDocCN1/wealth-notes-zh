- pgno: 633
  md: '# 1.2 算术收益率


    我们可以将总收益率表达成算术收益率（arithmetic return），在全书中我用小写的 $r$ 来表示算术收益率：


    算术收益率 $r_{t+1} = R_{t+1} - 1$ 公式（附2）


    这是最常见的表达收益率的方式。算术收益率也被称作“简单收益率”（simple returns）或“净收益率”（net returns）。通常我们会省略修饰词，而只称其为“收益率”（我在本书中就一直是这样做的）。


    算术收益率在时间上不具备可加性。假设某资产的单期总收益率 $R_{t+1} = 1.10$，那么它每期的算术收益率为 $r_{t+1} = (1.10) -
    1 = 10\%$。如果连续三期获得该算术收益率，在第三期末我们可获得：


    ```

    $\begin{aligned} W_{t+3} &= (1+r_{t+1})(1+r_{t+2})(1+r_{t+3}) \\ &= 1.10 \times
    1.10 \times 1.10 = 1.3310 \\ \neq 1 + r_{t+1} + r_{t+2} + r_{t+3} \end{aligned}$

    ```


    由于财富的复利效应，我们不能将算术收益率简单加总，也就是说 $1.3310 \neq 1 + 3 \times 0.10$。尽管算术收益率不具备可加性，为了简便起见，我在本书的一些图表中还是忽略了复利效应，仅简单累加了算术收益率。


    但是，不同资产的算术收益率却具备可加性。假设资产 A 的收益率为 $10\%$，资产 B 的收益率为 $5\%$，即 $r_{t+1}^{A} = 0.10$，$r_{t+1}^{B}
    = 0.05$。如果我们的投资组合中持有 $50\%$ 的资产 A 和 $50\%$ 的资产 B，组合的算术收益率即为：


    ```

    $r_{t+1}^{P} = 0.5r_{t+1}^{A} + 0.5r_{t+1}^{B} = 0.5 \times 0.10 + 0.5 \times
    0.05 = 7.5\%$

    ```


    所以我们可以方便地加总计算投资组合的算术收益率。


    # 1.3 对数收益率


    对数收益率（Log returns）又称连续复利收益率（continuously compounded returns），我们将其定义为总收益率的自然对数形式，我用
    $r$ 加上划线的方式来表示：


    ```

    对数收益率 $\overline{r}_{t+1} = \ln(R_{t+1}) = \ln(1+r_{t+1})$ 公式（附3）

    ```


    同样，我们也可等效地用对数收益率来表示总收益率：


    ```

    $R_{t+1} = \exp(\overline{r}_{t+1}) = 1 + r_{t+1}$

    ```'
