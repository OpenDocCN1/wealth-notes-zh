  md: '高收入的对冲基金管理人赚的钱来自于高额的管理费和业绩费。业绩费是一个期权——基金管理人收取2%费用，并在业绩达到标准之后，在2%的基础上收取20%的业绩费。这种收费方式有较高的凸性——事实上是呈现出凸性的很多对冲基金策略收益的镜像。也就是说，对冲基金的收费合同在做多看涨期权和做多波动性，但对冲基金采用的策略通常在做空看跌期权和做空波动率。


    业绩费，同一系列的看涨期权一样，激励着对冲基金管理人承担风险$^{1}$。如果能取得回报，他们就能上榜，与Dalio和Simons排在一起。如果赌注失败，基金管理人也不失去什么，并仍能收取2%的管理费。当然，受到损失的是投资者。在最坏的情况下，基金公司表现太差而必须关门。在基金管理人失败后，可以开一家新的对冲基金（这个重新开始的选择权，也是隐含的一种契约，参见第15章）。倒闭的长期资本管理公司（LTCM）的合伙人正是这样做的。在1998年它倒闭后的一年，Myron
    Scholes成立了白金树林资产管理公司（Platinum Grove Asset Management），该基金同很多其他对冲基金一样在2008年遭受了大额损失，并使用了门槛限制投资者赎回$^{2}$。Scholes于2011年从白金树林退休$^{3}$。长期资本管理公司的另一名合伙人John
    Meriwether与长期资本管理公司的一些其他前同事一起成立了JWM合伙企业（JWM Partners）。该公司在金融危机期间出现大幅损失，于2009年关闭$^{4}$。如同凤凰涅槃一样，在高盛量化基金因量化危机和金融危机关闭后，新基金也孕育而生。高盛全球Alpha基金的联席主管Mark
    Carhart成立了Kepos资本，而另一名联席基金经理Raymond Iwanowski则设立了Secor资产管理公司。


    Goetzmann，Ingersoll和Ross（2003）首次发现，期权结构的业绩费用的价值约为3%至4%。我前学生Sergiy Gorovyy（2012）的博士论文估算了在不同业绩费结构的条件下使管理人取得相同总收益的固定管理费用的水平。他发现2/20的收费结构等同于6.4%的固定管理费用。提高水位线之后，该费率降低至5.8%。在水位线和4%的业绩门槛费基础上收取2/20的费率结构等同于5.3%的管理费。积极管理型共同基金的平均费率低于1%。对冲基金费率相对很高。


    ① 参见Goetzmann、Ingersoll and Ross（2003），Hodder and Jackwerth（2007），Lau，Wang and
    Yang（2012），Panagyas and West-rfield（2003）认为如果对冲基金有无限的时间，但基金每个时期都有可能因为外部原因被终结，减少了这些承担风险的动力。


