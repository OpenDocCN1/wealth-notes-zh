    # 过度交易


    虽然管理交易所交易基金的利润率很低，资产管理公司仍有另一种途径从交易所交易基金上获利²。Vanguard的创始人John Bogle说道：“交易所交易基金的诀窍是管理成本基本上被扔给了市场，人们通过经纪佣金或类似性质的形式进行支付。”


    一些资产管理公司可以通过交易成本带来的收益补贴交易所交易基金的收入，特别在它们拥有自己的交易平台或是与经纪公司有合作关系的情况下。例如2013年3月起，Fidelity
    Investments开始对那些通过其交易平台，在较短期限内卖出“免佣金”交易所交易基金的投资者征收高额费用³。但是，很多交易所交易基金的发起者并不直接从交易成本中受益。交易所交易基金的平均买卖价差为0.9%，而固定收益和股票型基金的买卖价差在0.25%以下⁴。但是，最大的那些交易所交易基金通常仅需很低的交易成本，最大的十支交易所交易基金2007~2012年的平均价差为0.04%⁵。但是，即使对于最大的交易所交易基金，如果你经常买卖，费用也会迅速累计，可能比传统的（买入但不经常交易）积极型共同基金的成本高很多倍。相对而言，共同基金的买卖价差为零⁶。


