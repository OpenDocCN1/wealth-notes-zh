    # 本章摘要


    无论是超大型的主权财富基金还是最普通的个人投资者，任何资产所有者在投资方面都面临着相同的问题：如何满足债务偿付要求，如何决定投资方向和所要承担的风险水平，以及如何对管理其投资组合的中介进行监督。'
