  md: '![](img/e2a8f768e844f37dcab93b54b9e826d9_151_0.png)


    图4.8


    挪威主权财富基金在2008～2009年间遵循了固定的再平衡规则，在价格低、预期收益率高时买入了股票。如果该基金采用了长期机会型策略，那么它应该会在当时买入更多股票。因此，再平衡规则其实相当于“低买高卖”的一个保守下限。我建议
    在专注于机会型策略之前，先专注于再平衡。简单的再平衡本身是逆周期的；Stambaugh模型中的长期机会型投资，则是更加激进的逆周期操作。如果连再平衡策略（已涉及买入相对于其他资产而言价格正在下跌的资产）都无法实施，那么更
    无法实施机会型的长期投资。当收益率服从Stambaugh模型时，相比于简单的再平衡策略，机会型的长期投资将买入更多价格下跌的资产。同时，我还建议机会型组合
    应该是审慎的：考虑到估计误差以及总体上数据的可预测性较弱（参见第8章），在实际应用中，图4.8中的两条曲线（分别为随时间变化的短期权重和机会型权重对于预期收益率的函数）都将显著变得更平缓。


    # 3. 再平衡相当于做空波动率


    再平衡是一个期权策略，更准确地说，是一个做空波动率策略（short volatility strategy）。(期权交易员们将再平衡称为负伽马（negative
    gamma）策略。）此说法 并不为人所熟知，但对于熟悉金融理论的读者来说并不陌生，因为第2节中求解长期组合选择问题（即动态规划）的方法也被运用于期权估值（被称为递推法（backward
    induction））。通过展示再平衡如何在机制上等同于一种做空波动率策略，可以让我们更深入地理解长期投资者使用再平衡策略的得失。毕竟天下没有免费的午餐，至


    > Perold and Sharpe（1988），以及Cochrane（2007）论述了怎样把再平衡策略阐释为期权策略，'
