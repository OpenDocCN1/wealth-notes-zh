  md: '![](img/e2a8f768e844f37dcab93b54b9e826d9_5_0.png)


    作者曾任哥伦比亚大学商学院金融和经济系主任，商学院讲座教授，于2015年加入全球最大的资产管理公司BlackRock*出任董事总经理，主管因子投资策略团队。


    本书英文版于2014年8月由牛津大学出版社出版。


    作为金融经济学家，作者致力于探究资产价格中所包含的风险和收益的本质，其研究领域涵盖债券、股票、资产管理和组合配置、另类投资等。本科毕业于澳大利亚麦考瑞大学，获得一等荣誉学士学位（经济学专业），随后获得美国斯坦福大学的统计学硕士和金融学博士学位。


    作者曾在若干领先的国际性学术期刊担任编辑，不仅有深厚的学术造诣，而且擅于将金融理论与实践紧密联系，曾受邀参与过包括加拿大退休基金、欧洲央行、美联储纽约分行、国际货币基金组织、摩根斯坦利、挪威财政部、挪威央行、世界银行等多项政府、组织和企业的咨询研究项目。


    * 截至2017年3季度末，BlackRock的资产管理规模约为5.97万亿美元，数据来源：http://ir.blackrock.com/。'
