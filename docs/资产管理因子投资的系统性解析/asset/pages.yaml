    # 2.2 动态规划


    动态组合选择问题是一个最优控制（Optimal Control）问题。该问题可以通过动态规划（Dynamic Programming）求解——这与控制核能发电站、送火箭上月球、对复杂的衍生产品进行估值所采用的方法相同（我承认，与前面两个相比，最后一个例子不那么让人印象深刻）。组合选择其实也属于尖端科学——确实是实的。对于如何将长期投资问题以数学形式表达为一-系列短期投资问题不感兴趣的读者，可以直接跳到第2.3节。


    根据公式（4.1），长期财富是单一投资期财富的乘积：


    $$W_{t+5} = W_{t}(1 + r_{p,t+1})(1 + r_{p,t+2}) \dots (1 + r_{p,t+5}) \quad \text{公式}(4.6)$$


    我们可以将CRRA效用函数（公式4.3）应用于每个单一-投资期财富。将CRRA期望效用运用到长期财富中，我们会得到一系列单一-投资期CRRA效用语问题：


    $$E \left[ U(W_{t+5}) \right] = U(W_{t}) E \left[ U(1 + r_{p,t+1}) U(1 + r_{p,t+2})
    \dots U(1 + r_{p,t+5}) \right] \quad \text{公式}(4.7)$$


    由于在公式（4.7）中，U（ $W_{t}$）在期望函数之外，因此我们从1美元或100万美元开始都一样——组合的权重并不依赖于初始财富的大小，这是财富的同质性（Wealth
    Homogeneity）（参见第2章）。我们将$W_{t}$标准化为1，这样就无需担心这个问题。正如公式（4.1）所强调的，公式（4.6）和（4.7）中的组合收益，$r_{p,t+1}$，依赖于期初所选择的组合权重，$x_{t}$。因此，我们可以将公式（4.7）写成：


    $$\begin{aligned} E \left[ U\left(W_{t+5}\right) \right] & = U\left(W_{t}\right)
    E \left[ U\left(1 + r_{p,t+1}\left(x_{t}\right)\right) U\left(1 + r_{p,t+2}\left(x_{t+1}\right)\right)
    \dots U\left(1 + r_{p,t+5}\left(x_{t+4}\right)\right) \right] \ & = E \left[ U\left(1
    + r_{p,t+1}\left(x_{t}\right)\right) U\left(1 + r_{p,t+2}\left(x_{t+1}\right)\right)
    \dots U\left(1 + r_{p,t+4}\left(x_{t+4}\right)\right) \right] \quad \text{公式}(4.8)
    \end{aligned}$$


    图4.2展示了一个动态规划求解的步骤。我们首先从期末开始，在 $t + 4$ 到 $t + 5$ 的时候，投资者选择组合权重，以最大化投资期末 $T = t
    + 5$ 时的预期效用，正如图4.2-A所示。这是一个静态的单一-投资期问题，使用的是无约束条件的CRRA效用函数，这与我们在第3章中提到的单一-投资期均值方差问题相同。公式（4.5）给出了一个期望收益率为
    $\mu$、波动率为 $\sigma$ 的风险资产在无风险收益率为 $r_{f}$ 的情况下所对应的解，我们用 $x_{t+4}^{*}$ 来表示该权重，其中上标的星号表示组合权重是最优的。投资者持有
    $x_{t+4}^{*}$ 的股票和（$1 - x_{t+4}^{*}$）的无风险债券。原则上，这个组合权重依赖于 $t + 4$ 期的期望收益率和波'
