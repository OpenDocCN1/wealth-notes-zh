  md: '# 3. 因子基准


    现在来看关于资产（或者策略、基金）i的CAPM模型：


    $E(r_i) - r_f = \beta_i [E(r_m) - r_f]$


    公式（10.6）


    其中，$E(r_i)$是资产i的预期收益率，$r_f$是无风险利率（美国短期国债），$\beta_i$是资产i的贝塔值，$E(r_m)$是市场组合的预期收益率。假设贝塔值是1.3，即$\beta_i
    = 1.3$，那么我们可以将公式（10.6）写成


    $E(r_i) = r_f + 1.3E(r_m) - 1.3r_f$


    调整后我们得到，


    $E(r_i) = -0.3r_f + 1.3E(r_m)$

    $\underbrace{\quad}_{\$1}\underbrace{\quad}_{\$1}$


    公式（10.7）


    上面的式子表明，持有$1的资产i获得的回报率等于持有$-0.30美国短期国债空头以及加杠杆后的$1.30市场组合多头的回报率。注意在公式（10.7）的左右两边，我们都是考虑$1的资产。这样，CAPM模型推出了一个可以复制资产i预期回报率的模拟组合（replicating
    portfolio）：即无风险资产和市场资产的一种组合。因此，该资产的贝塔值实际上是在模拟组合中市场资产所占的权重（mimicking portfolio
    weight）①。


    因子基准是公式右边一系列投资组合或者因子的组合，它们能够获得与公式左边的资产相同的回报率。因子基准描述了资产i的回报率中的系统性成分。


    资产i的阿尔法是指超过“$0.3美国短期国债空头加上$1.30市场组合多头”的那部分预期回报率：


    $E(r_i) = \alpha_i + [-0.3r_f + 1.3E(r_m)]$

    $\underbrace{\quad}_{E(r^{bmk})}$


    公式（10.8）


    其中，基准包括风险调整后的股票头寸以及无风险利率头寸，$r^{bmk} = -0.3r_f + 1.3E(r_m)$。由于该基准来自于CAPM模型，因此阿尔法是指高于CAPM预测回报率的那部分平均回报率。'
