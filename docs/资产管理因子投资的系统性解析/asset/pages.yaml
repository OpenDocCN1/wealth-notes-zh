- pgno: 496
  md: '在我撰写本书时，财政部还没有就动态因子决策应该由资产所有者（议会）还是由基金管理人（NBIM）负责给出最后建议（这个问题在财政部提交给议会的2013年报告中有所讨论）。然而，NBIM已开始将因子引入其内部基准。2012年，NBIM为股票投资引入了运营基准，该基准显性地考虑了系统性风险因子。目前NBIM还只引入了两种因子：价值一成长因子和规模因子（注意，我认为规模因子本身已不能带来超出市场敞口的风险溢价）。我预期将会有关于系统性风险因子敞口的报道，从而使得基金的最终所有人即挪威人民能更好地了解NBIM所承担的因子风险，并避免2008
    ~ 2009年的争议再次出现。至少，公众能更好地了解类似金融危机时期的相关风险。


    资产管理公司Robeco的 David Blitz以及业界其他人士已经将这种被动获取动态因子的方式称为“挪威模式”①。在对“教授的报告”做公开演讲时，我说过因子投资是“被动但动态的”、是“指数化但积极的”。因子投资是激进地采用了被动投资方式。因子投资是基于有力的历史数据和学术研究之上，运用低成本获取收益的一种方法，同时也具有规模性，可以通过简单方式获取，并能避开非流动性资产市场的代理问题和信息问题。这允许投资者仅对通过被动投资无法获取的真正积极管理投资收益进行付费。许多投资者可能会考虑跟随挪威模式，采取低成本、被动方式来激进地获取动态因子风险溢价。


    ① Blitz, D., “Strategic Allocations to Factor Premiums: The Next Big Thing?” Robeco
    Insight, October 7, 2012。也可参见 Chambers, Dimson and Linneman (2011)。'
