    仅有少数时候，偏差很大，有持续性，并且维持时间超过几分钟。


    在2010年5月6日下午2点40分开始的20分钟里，主要期货和股票市场暴跌了超过5%，随后突然反弹。下跌开始于股票期货市场，导火索可能来自位于堪萨斯的投资管理公司Waddell
    & Reed。来自高频交易算法的压力覆没了既有的流动性，导致激增的错误定价蔓延到股票市场①。这就是闪电崩盘的现象。超过300支证券的成交价格与闪电崩盘前的价格差距超过60%以上。拥有数十亿美元市值的公司Accenture股票以1美分的价格成交。原来价格在34美元左右的Sotheby''s跳升到99999.99美元。这也导致Sotheby''s的市值短暂地超过了整个美国经济总量。


    交易所交易基金在交易被取消的326支证券中占70%。Malhavan (2012) 研究显示，交易所交易基金在闪电崩盘时期出现了比其他证券明显更大的跌幅，相对于其他证券8%的平均跌幅，交易所交易基金的平均跌幅为24%。交易所交易基金在传到市场冲击中起到了特殊的作用。Ben-David,
    Franzoni和Moussawi (2011) 认为，交易所交易基金在从期货市场向股票市场传导冲击的过程中起到了管道的作用。一些监管者及其他人士认为，交易所交易基金对整个金融系统构成了系统风险，这种想法不足为奇②。


    +   1. 投资者可以从闪电崩盘中获得如下经验：

    ① 交易所交易基金在流动性较好的市场中才可获得合理的定价；

    ② 交易所交易基金能够放大流动性冲击；

    ③ 交易所交易基金的无套利关系很容易破裂，该关系在市场崩盘时非常脆弱。


    # 5.3 代理问题


    交易所交易基金行业


    相对于传统的共同基金，交易所交易基金的利润低很多。共同基金的平均费用'
