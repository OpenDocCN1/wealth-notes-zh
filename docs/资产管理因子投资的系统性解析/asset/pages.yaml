  md: '# 4.2 我们的储蓄够吗?


    Skinner（2007）运用生命周期模型估算了为获得舒服的退休生活需要储蓄多少。所需储蓄水平之高令人惊讶。考虑一个40岁的人计划在65岁退休，假如他活到95岁，储蓄了7.5%的税前收入，并希望退休后收入可达到退休前收入的30%。在40岁时，此人所需的财富收入比（wealth-to-income
    ratio）约为2，在50岁时上升为3，到退休时达到峰值5。这里所说的财富不包括住房，因此对于没有房子的人来说，在40岁、50岁和60岁时所需财富收入比要更高，分别达到4、5和8。


    大多数人都远没有达到这样的储蓄水平。


    大多数家庭都没有储蓄到生命周期模型所要求的储蓄水平，以保证舒适的退休生活。Lusardi和Mitchell（2006）的报告称，婴儿潮早期出生的个人财富收入比的中位数只有2，远低于Skinner（2007）计算的理想储蓄数字。Poterba,
    Venti和Wise（2011a）报告称，年龄在65～69岁的家庭中约一半在2008年的总净资产少于52000美元，且其中有约43%的家庭甚至无法凑齐25000美元——这通常是年金投资的最低标准（参见下文）。根据雇员福利研究所（Employee
    Benefit Research Institute）2013年的报告，57%的美国雇员除房子之外的总储蓄小于25000美元，而28%的人——头脑清醒的少数人——并不太确信有足够的钱可以舒适地退休$^{\text{1}}$。令人惊讶的是，有34%的人称他们没有为退休做任何储蓄。


    首要问题是要让人们储蓄。今天消费总是比为明天储蓄更有吸引力。经济学家用双曲贴现模型（hyperbolic discounting function）描述这种行为特征，即St.
    Augustine版本的效用函数（“上帝让我变得纯洁，但尚未如此”）$^{\text{2}}$。幸运的是，有些经济学家也发现了可以诱导人们储蓄的一些行为偏好。


    Thaler和Benartzi（2004）创建了“未来储蓄更多”（Save More Tomorrow）项目，在Thaler和Sunstein（2009）的畅销书《推力》（Nudge）里有描述。Thaler和Benartzi利用人类天性让人们承诺将未来工资的增加部分储蓄起来。人们不愿意将今天的钱储蓄起来，但他们愿意将还没收到的未来的钱储蓄起来。当真的收到这笔钱后，他们又懒得改变之前的计划，从而不经意地进行了储蓄。因此，惰性而非节俭被充分利用了，今天的消费并没有受到影响。Thaler和Benartzi发现当雇员承诺加入“未来储蓄更多”项目后，其储蓄率由3%上升到超过13%。


    ① The 2013 Retirement Confidence Survey: Perceived Saving Needs Outpace Reality
    for Many, Employee Benefit Research Institute, Issue Brief, 2013年3月，384期。


    ② 参见Laibson（1997）。'
