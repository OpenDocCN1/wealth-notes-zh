  md: '有本公司股票 $ ^{\mathrm{1}} $。


    当你所在的公司破产时，你会痛苦而清晰地意识到不分散化的代价；而均值—方差投资揭示了即使你的雇主没有破产，不分散化也会带来损失。个人可以通过投资于一个分散化的组合来获得更高的风险收益比。Potelba（2003）计算出了与简单投资于分散化的标普500组合相比，退休账户不分散化投资所付出的代价。假设个人的一半资产投资于公司股票，那么这种高度集中头寸的确定性等价成本（参见第3章）大约是投资于分散化的标普500组合价值的80%。这大幅降低了投资者的效用。个人投资者应该定期将公司股票兑现，尤其是当股票价格比组合中其他资产上涨得更快时。随着本公司股票相对其他资产上涨，这对投资者来说意味着更大的集中性风险
    $ ^{2} $ （此外，你的人力资本本身也集中于该雇主，参见第5章）。


    有钱人常常没有做到足够的分散化。摩根大通在2004年出版的白皮书《战胜挑战：提高保持富有的15%低概率》（ *Beating the Odds: Improving
    the 15% Probability of Staying Wealthy* ）中将过度集中化认定为使有钱人失去财富的首要原因。研究报告标题中提及的15%这一概率来源于如下事实：在首份美国最富有400人福布斯榜单中，仅有不足15%的人在一代之后仍位于榜单上。尽管福布斯400榜单记录的只是超级富翁，那些财富水平在他们之下的富人同样也有可能失去财富。Kennicell（2011）研究指出，2007年全美前1%最富裕的家庭中，大约有1/3在两年后跌出这前1%的行列。


    企业家以及那些通过单一业务获得财富的人经常认为分散化是违背直觉的 $ ^{3} $ 。毕竟，最初不就是靠集中的头寸创造出这些财富的吗？这是他们最了解的业务，并且他们在业务上的大规模投资可能流动性不佳且不易被分散化。但是，分散化可以消除管理层无法掌控的公司特有风险。随着时间的推移，曾经鼎盛的房地产业失去了它的辉煌，曾经伟大的公司因其产品过时而倒闭了。一些公司因为监管风险、宏观风险、技术变革以及政治风险而跌跌撞撞，而另一些公司则因此受益。分散化降低了这些可避免的非系统性（Idiosyncratic）风险。摩根大通报告称，1990年标普500指数所包含的五百家公司中，只有一半2000年仍然存在于指数之中。最初构成1896年道琼斯工业指数的三十家行业巨头中，只有一家仍在其中：通用电气。这证明，要想长久地保持财富，就必须分散化、分散化、再分散化。


    ① 参见Van Derhei，J.，S. Holden and L.Alonso（2010），401 (k) Plan Asset Allocation.
    Account Balances and Loan Activity in 2009. Employee Benefit Research Institute
    Issue Brief No.350.


    ② 遗憾的是，个体投资者倾向于做恰恰相反的事情——他们大量持有在过去十年中收益表现最好的雇主股票，正如Benanzzi（2001）所指出的。


    ③ 参见“Stay the Course? Portfolio Advice in the Face of Large Losses”，哥伦比亚大学案例，ID#110309。'
