    # 图11.4


    实际利率为负的情况倒是并不罕见。在Ang、Bekaert和Wei（2008）中，我估算了自1952年以来的实际利率。尽管美国在1997年以前没有通胀挂钩债的市场，但我可以通过利率结构期限模型（参见第9章）来估算实际利率，即基于对随时间而变化的风险溢价的假设，并根据实际利率与通货膨胀率和名义利率高度相关的关系推出实际利率的期限结构。在20世纪50年代末出现了短期实际利率显著为负的时期，第二个负实际利率时期是在20世纪70年代末到80年代初。这两段时期都与通货膨胀率加速上升'
