  md: '一些选择共同基金的最佳方法、除了考察历史的收益情况之外、还会研究基金经理人和基金的持仓情况。Chevalier和Ellison（1999a）发现，毕业于入学SAT成绩更高的大学的基金经理，通常其投资业绩较好。Cohen,
    Frazzini和Malloy（2008）显示、基金经理认识的人对共同基金的业绩有影响。人际关系网络更广泛的基金经理，常常重仓于拥有校友作为董事的公司。基金经理在这类有人际联系的公司上取得的收益显著超越没有联系的公司。


    基金的持仓情况能用于预测业绩。我们应该将积极管理的费用支付给那些真正进行积极管理的管理人。为什么要支付高额费用给仅仅跟踪标准500指数的管理人呢？Cremers和Petajisto（2009）的“积极仓位”用来衡量基金持仓与指数持仓的偏离程度。积极仓位反映了基金的选股到底有多积极¹。Cremers和Petajisto研究发现拥有较多积极仓位的基金产生了较好的收益。有趣的是，跟踪误差（tracking
    error）——基金收益和基准收益之差的标准差，并不能预测收益，这表明你需要深入考察基金的持仓情况，来衡量基金经理持有多少积极仓位。按照这种方法，专注于某个领域、持有集中度较高的投资组合的管理人往往有更好的表现。


    即使是拥有所有这些方法，要发现跑赢市场的共同基金管理人仍然不容易。


    # ## 3.4 资金流向


    用Frazzini和Lamont（2008）的话来说，共同基金投资者是“蠢钱”（dumb money）。资金大量流入历史业绩很好的共同基金，但往往流入的是错误的基金。这些基金随后的业绩往往不佳。Friesen和Sapp（2007）估计，投资者向拥有良好历史业绩但未来业绩不佳的基金投资的“蠢钱”资金流每年花费掉投资者1.5%。共同基金公司在广告中大肆宣传历史业绩良好的基金。当然，这是有选择性的，因为只有近期有良好表现的基金得到大量的资金流入。在资金流入后，基金的未来收益往往令人失望²。


    共同基金的投资具有黏性。资金流入业绩好的基金，但同时资金不倾向于


    ① Kaepertzyk, Sialm and Zheng (2008) 开发了一个相关的量度来衡量基金的收益和基于基金之前公布的组合持仓推算的收益之间的差距。这个收益差距预测基金收益。Anhudd
    and Goyenko (2013) 的量度方式在精神上近似——基金距离它们的基准越远，或者说更加主动，产生较高的收益。参见Kaepertzyk, Sialm
    and Zheng (2005) 查阅行业集中度的结果。


    ② 参见Jain and Wu (2000) 的关于共同基金广告的学术研究。Gruber (1996) 和Zheng (1999) 研究显示共同基金的资金流向能预测基金收益率，至少在短期成立。这与Berk
    and Green (2004) 的结论（如下）吻合，投资者能发现有能力的管理人。但随着基金规模增长，基金的长期表现受到负面影响。Lou (2012) 研究显示共同基金资金流向可预测股票收益。'
