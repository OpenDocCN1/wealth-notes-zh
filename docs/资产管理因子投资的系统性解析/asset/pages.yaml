  md: '溢价均大幅跌至 0.5% 以下。这两项数值在金融危机期间升至 2.5% 以上，在 2009 年以后又回落到 0.5% 以下。


    流动性风险溢价使得 TIPS 收益率比流动性较好的国债更高。即，经流动性调整后的实际收益率应该更低，因此在 2011 年 12 月，该值比我们在 TIPS
    市场看到的要负得更多。经流动性调整后的通货膨胀补偿率应该比原始补偿率更高。如果负实际利率反映了投资者对于糟糕未来的预期，那么考虑了流动性风险后的未来将会更糟糕。


    # 4.6 TIPS与税收


    TIPS 的付息与传统国债的付息一样，都要缴纳联邦所得税。任何由于通胀调整产生的本金增加部分也要计税。实际收入和名义收入的计税方法相同，因此投资者的税后回报仍会面临通货膨胀风险。在高通货膨胀时期，通胀调整使得本金增加，对这部分增量的征税使得购买力下降，投资者在税后是有损失的。但是在通货紧缩时期，TIPS
    本金缩水（至少直到接近原始面值为止）。这一缩水部分可以抵税，是对 TIPS 付息减少的一种抵消。这样，通货紧缩时会产生税后收益，在通货膨胀时则产生税后损失。由于通货膨胀时期往往多于通货紧缩时期，因此税收的净效果通常是负的。


    因此，我们最好通过税收递延账户（Tax-deferred accounts）来持有 TIPS（在第 12 章会讨论税收）。对于个人投资者而言，与 TIPS
    相对应的债券品种是 I Savings Bond（简称 I-Bond）。I-Bonds 是一种零息通胀挂钩债，对付息和本金的通胀调整都在债券到期时或者投资者要求赎回时一并支付。I-Bonds
    的付息要缴纳联邦所得税，该税只在赎回时缴纳$^{(1)}$。付息会被加回到债券价值中，所以投资者能获得税收递延收益。通胀调整的本金并不缴税。因此，从税后收益角度出发，个人投资者应该持有
    I-Bonds，而不是 TIPS。但是，个人投资者每年只能购买 1 万美元的 I-Bonds。而且 I-Bonds 不可在二级市场上进行买卖——如果你想兑现，必须赎回这些债券。


    # 4.7 小结


    （1）TIPS 这一资产类别对冲通货膨胀的效果较差


    TIPS 回报率与通货膨胀率的相关系数几乎为零。“实际”债券并不那么实际的原'
