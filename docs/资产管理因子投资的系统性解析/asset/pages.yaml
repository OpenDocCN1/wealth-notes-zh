  md: '本保护或增值上限（或两者都有）的年金（annuities with floors or caps（or both）），收益在 不同的高水位线定期上调的年金（benefits
    that increase periodically at various high-water marks），滑准退保（sliding surrender
    scales），或有保护（contingent protection），捆绑式人寿保险（bundled life insurance），不同程度的通货膨胀保护（various
    degree of inflation protection），有/无（或有）提款惩罚的年金（annuities with and without（contingent）withdraw
    penalties）等^{①}。年金真的非常复杂。


    “几乎没有投资者有能力对此做出一个信息足够充分的决策”，美国消费者联合会（Consumer Federation of America）的董事说^{②}。出售年金的人声誉很差，有些人也确实很糟糕。“如果你想以消费者最大利益为出发点，那你根本卖不掉这破玩意。”一位SEC前雇员说。


    最接近生命周期学术模型里的年金的是“一次性缴费期末付年金”（single premium immediate annuities），即投资者可用他们的退休储蓄在某个单一时点购买^{③}。投资者在此后的生命存续期间都能获得年金支付。


    # （3）糟糕的交易


    这些复杂的产品不仅与生命周期学术模型中简单干净的产品相距甚远，而且它们的定价还远高于精算上的公允价值。Milevsky和Posner（2011）对年金中的保险担保（insurance
    guarantees）进行估值，发现其价值大约在0.01%~0.10%，但保险行业却收取1.15%^{④}。Mitchell等（1999）对寿险公司提供的年金进行估值，发现每1美元只值80到90美分。但是，Mitchell等研究指出，公允价值与购买价格之间的差距随时间发展已有所缩小。


    即使年金对于平均投保人而言是合理定价的，其对于特定人群仍然可能定价过高。Brown、Mitchell和Poterba（2001）报告指出，一个在65岁购买年金的男性可以得到他所投资每1美元的91美分，而普通大众只能得到其投资的81%。这是因为出售年金的保险公司面临以下问题。


    +   ① 逆向选择（Adverse Selection）。早在Jane Austen的《理智与情感》中，Dashwood夫人就说服丈夫不要帮助女主角一家（Elinor、Marianne和Margaret），她


    ① 如Carlisle and Manso（2011）研究中正式指出的，年金的复杂性是符合资产管理行业利益的。


    ② 引自Olen（2012），他严厉地批评了该行业。


    ③ 关于年金的新一代文献探讨了递延年金和指数化年金，例如Milevsky（2005），Gong and Webb（2010）和Mauryer et al.（2013）。


    ④ 基本的收益是至少死亡时初始投资会返还。这是一个看跌期权，行权价格等于年金的购买价格。还有很多其他的变体，参见“年金产品很复杂”一节。'
