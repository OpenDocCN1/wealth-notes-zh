  md: '$\frac{\max E\left[U\left(W_T\right)\right]}{\{x_t\}}$ 公式 (4.2)


    约束条件包括投资者可能不能卖空（这是正值约束（ *Positivity Constraint* ），所以 $x_{i} \geqslant 0$ ），或者不能进行杠杆投资（所以组合的权重是被限制的，
    $0 \leqslant x_{i} \leqslant 1$ ），或者投资者只能在每期卖出组合的一部分（即换手率约束（ *Turnover Constraint*
    ））。虽然组合权重 $x_{i, t}$ 显然只能在 $t+t$ 期实现，但是从 $t$ 期到 $T-1$ 期的权重的全集 $\{x_{i}\}$ 是在问题最开始（
    $t$ 期）就选择确定的。最优权重的集合可能会相当复杂：这组权重可能不仅随着投资期限的临近而变化，也可能随着状态的改变而变化。比如， $x_{i}$ 在 $t$
    期可以取两个值：经济衰退时持有 $50\%$ 的股票，而若处在牛市则持有 $70\%$ 的股票。跨越不同时期与不同状态下的所有组合策略在期初就已被确定。因此，最优动态交易策略虽然会随时间的变化而变化，但它在一开始便已完全确定：随着资产收益率的改变，或随着效用函数和负债状况的改变，策略也相应地做出最优调整。


    在本章剩余部分的讨论中，我们以常数相对风险规避（CRRA）效用函数（参见第2章）为基础：


    $E\left[U(W)\right]=E\left[\frac{W^{1-\gamma}}{1-\gamma}\right]$ 公式 (4.3)


    其中 $W$ 是投资者在期末的财富值， $\gamma$ 是投资者的风险规避系数。接下来，我将省略公式 (4.3) 中的分母 $1-\gamma$ ，因为最大化
    $E\left[W^{1-\gamma}\right. / (1-\gamma)\left.\right]$ [即]是最大化 $E\left[W^{1-\gamma}\right]$
    。CRRA 是一个局部均值方差优化问题，所以风险规避系数 $\gamma$ 与在均值方差效用函数 $U^{MV}$ 中该系数的含义是相同的（参见第3章）：


    $U^{M V}=E\left(r_{p}\right)-\frac{\gamma}{2} \operatorname{var}\left(r_{p}\right)$
    公式 (4.4)


    其中 $r_{p}$ 是组合的收益率。当仅有一种风险资产且无风险资产收益率为 $r_{f}$ 时，CRRA效用函数和均值方差效用函数问题的无约束条件的解均为
    $^{\odot}$ ：


    $x^{*}=\frac{1}{\gamma} \frac{\mu-r_{f}}{\sigma^{2}}$ 公式 (4.5)


    其中资产的期望收益率为 $\mu$ ，波动率为 $\sigma$ 。投资者持有风险资产的比例为 $x^{*}$ ，持有无风险资产的比例为 $\left(1-x^{*}\right)$
    。我们在第2章和第3章中详细介绍了求解的方法。从这个意义来说，CRRA和均值方差效用函数是等价的。


    单一投资期最优资产权重是如公式 (4.5) 所示的均值方差解，很多流行的策略都可以作为它的特例，比如在第3章中提到的等权重、风险均配、市场权重和等风险敞


    ① 严格来说，CRRA权重适用于连续时间或者时间间隔非常小的情形。参见Merton（1971）。'
