  md: '# ## 6.2 给捐赠基金的投资建议


    华盛顿大学的Thomas Gilbert和Christopher也许是世界上仅有的捐赠基金管理理论学家。在2012年的一篇文章里，他们积极地论证了成功大学的最优配置政策是持有大量固定收益，而不是风险资产，当然也不建议扩展至非流动性风险资产。


    Gilbert和Christopher将大学模拟为“社会红利”的创造者，即研究与教育并重。大学可以开展针对科研项目的内部投资，或者通过学校捐赠基金进行外部投资。如果学校捐赠基金承担了外部风险——比如，通过股票投资——这意味着大学没有足够好的、能产生社会红利的内部风险项目。如果捐赠基金通过债券投资于安全资产，那么大学则通过内部科研项目来承担风险。Gilbert和Hrdlička认为，如果一个大学捐赠基金投资大量的风险资产，就意味着该大学没有足够优质的科研项目。


    哈佛大学捐赠基金大量投资于非流动性风险资产，可能会与Gilbert和Hrdlička持不同观点。高校捐赠基金使得大学变得更加独立，而不是完全依赖于政府拨款或者私人基金会。如Dershowitz所认为的，学校捐赠基金应该是一个避险机制，可以在像2008年金融危机那样的情况下发挥作用。哈佛捐赠基金在历史上曾可以明确预测用于运营支出的现金流，但2008年金融危机使得这种可预测性不复存在。哈佛大学声称其捐赠基金能让后代分享哈佛捐赠基金的财富，并指出“尽管捐赠基金的具体用途不同，但有一个共同目的：即为各项事务提供永久支持，而非一年或仅仅一代人”。①然而，教育的实际价格在不断上升（参见第11章），如果未来的教育成本比现在更高，那么现在对研究和教育的投资吝啬则毫无意义，因为这是用未来成本更昂贵的好处来替代现在成本相对低廉的好处②。


    耶鲁大学法学院教授Henry Hansmann将大型私立大学描述为“运营众多投资资产的机构……他们顺带运营教育机构，可通过扩张和减少规模来充当投资池的缓冲”③。他争辩说，大学喜欢大型捐赠基金的主要原因是因为声望，各大学将声望视为其自身追逐的目标。记者Kevín
    Carey以另一种方式指出这点，他模仿《公祈书》（Book of Common Prayer）的口吻，指出大型捐赠基金本身是“无极限的愿望，无止境的积累”。④'
