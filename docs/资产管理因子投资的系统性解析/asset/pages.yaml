  md: '关1。代理人的效用和最终房地产的价值是由房地产能提供的各项设施条件所决定的，包括与消费者和供给者的邻近程度、人力资本的溢出效应、内在的地理优势（包括优美的视野和宜人的气候）。房地产的价值也受到劳动者收入、居住成本和交通成本的影响。


    Alonso（1964）、Mills（1967）和Muth（1969）的模型按照在某一城市内房地产与城市生产中心的距离，来解释它们的价格变化：随着交通成本上升，房地产价格将下降。Rosen（1979）和Roback（1982）的重要模型则解释了在不同城市和都市区域之间，由于收入、设施、生产力水平的差异房地产价格出现了怎样的差异。更高的土地价格反映了进入都市圈生活的门槛，因为这些区域有生产效率更高的企业和更好的设施（包括更丰富的文化活动、更低的犯罪率、更好的学校、更宜人的气候）。


    房产中介的口头禅“位置，位置，位置”其实只说对了一半。位置在Alonso-Mills-Muth的模型中确实是驱动房地产价格的基本因子之一，但是它的影响来自交通成本。Rosen-Roback模型强调的则是，不是位置本身，而是位置所带来的各种优势（例如贸易和生产机会）与企业和劳动者的生产力、其他宏观因子之间的相互作用。


    房地产投资者们应该将城市经济学作为投资的基础。城市经济学让我们可以：


    # （1）理解宏观因子


    经济模型可以很好地解释内生变量（例如房地产价格、人们在哪里居住、买多少房产）怎样被外生变量（例如地理、缓慢变化的生产力水平）所决定。经济模型可以让人看到价格背后的基本面，包括总需求因子和总供给限制等。强调宏观因子尤其重要，因为持有房地产是一种长期投资，机构持有单个房地产投资的期限中位值大约是十年以上2。


    # （2）在大环境中理解房地产


    就像其他所有的价格一样，房地产价格由均衡水平所决定。我住在纽约，那里的房地产价格高，平均工资高，生活成本也高。从劳动者的角度来看，高工资是好的。从雇主的角度来看，高工资是不好的。企业为什么不将生产从纽约转移出去，从而降低工资支出呢？在均衡状态下，只有这个城市使得所有劳动者和企业的生产效率更高，房地产价格才会更高，工资才会更高。是什么创造了生产力？是什么保持了生产


    > ① 参见Glaeser (2008)。


    > ② Fisher和Young（2000）报告指出，NCREIF（National Council of Real Estate Investment Fiduciaries）数据库中房地产销售期的中位值是十一年。'
