  md: '令人意外的是，挪威人并没有因为整个基金遭受了巨大损失而感到不安。挪威基金的资产配置变化历经了较长时间，从基金最初成立时配置100%债券到1998年配置40%股票、60%债券，再到2007~2009年期间的60%股票、40%债券（从2011年起，该基金从债券配置中拿出不超过5%的额度用于房地产投资）。公众很好地了解这些风险，做出投资决策的政府议员也理解持有大量股票会带来较大的下行风险。但长期来看，股票能带来比债券更高的收益$^{①}$。毕竟，金融市场通常在下跌后总是会反弹。


    真正令挪威人愤怒的是积极管理（active management）所创造的负超额收益。挪威基金的管理人即挪威央行投资管理公司（Norges Bank Investment
    Management，NBIM），理应创造高于财政部指定基准的收益。积极收益就是基金收益减去基准收益。如图14.1所示，2007年之后，金融危机最坏时期该基金的累计积极收益为$-5\%$。许多公众原本预期积极管理会稳定地为基金增值——难道这不正是NBIM组合经理的薪酬远高于一般官员的原因吗？也许付给NBIM用于积极管理的额外费用确实是浪费资金，挪威基金应该采用低成本指数基金方式来被动管理。


    挪威基金总是受到公众关注，而且财政部和NBIM相关负责官员的言行举止都被媒体紧密跟踪。公众对积极管理所带来的损失表示强烈抗议，部分原因是由于这些损失刚好伴随着经济增长放缓以及其他一些金融过度现象被揭露——尽管挪威拥有良好的声誉，但仍未躲过金融危机的影响。另外，挪威政府议员在财政方面很老练，他们因为最终需要对国家的养老金负责而必须如此。（如果询问一般议员积极管理和被动管理的区别是什么，他会以为你指的是不同的运动程序。）


    财政部明智地并未因为公众强烈抗议而立即改变NBIM积极管理的使命，而是委任了一项对该基金长达四个月的深入研究。William Goetzmann（耶鲁大学），Stephen
    Scaefer（伦敦商学院）和我共同受邀对NBIM的历史业绩进行选择评价，评估其积极管理的战略计划和风险预算流程，并对具备大型、长期、透明投资者相对优势的挪威基金投资策略进行描述和评估。该报告于2009年底发表并于2010年1月在一次由挪威国王召开的公众会议上进行了汇报，报告很快被称为“教授的报告”，或者按惯例被称为Ang,
    Goetzmann和Scaefer（2009）。


