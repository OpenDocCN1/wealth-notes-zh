  md: '略。当一项并购交易宣布后，被收购公司的股票价格跳升，但通常不立刻升高至收购价。股价在交易公布后跳升，随后持续升高，直到在并购交易完成时达到收购价。


    Mitchell和Pulino（2001）显示，并购交易等于一个裸空的看跌期权。在大多数情况下，被收购方的股票价格按照预期升高至收购价，因此并购套利是盈利的。价格不是在并购交易宣布之后就立刻跳升至收购价，其原因是有时候会出现并购失败的情况。例如，司法部门出于反垄断的考虑终止该并购计划，尽职调查在被收购方发现了意想不到的信息，或者对于谁掌管新公司存在争论等使得交易在最后一分钟失败。当并购失败时，股票价格下跌。因此，并购套利多数时间仅赚取小额利润，但正如我们在图17.6中看到的收益情况，它也存在较小的出现重大损失的可能性。Mitchell和Pulino的研究也展示了并购失败带来的不常见的大幅损失与市场具有相关性（因此并购套利具有系统性风险），在整个市场崩盘后、许多并购交易失败，并购活动也趋于停滞。


    # 相对价值策略


    Duarte，Longstaff和Yu（2005）对固定收益相对价值策略进行了全面研究。他们检测了好几种“套利策略”，包括掉期利差套利、利率曲线套利、按揭贷款套利、波动性套利（在不同证券市场间对风险定价差异）和资本结构套利（对相同企业的不同证券进行投资交易）。所有这些策略在绝大多数时间产生了高收益但偶尔也有大幅损失。可转债套利也归于相对价值的类别，寻求在可转债和股票两个不同的证券市场对风险的定价差异中取得收益。该策略也容易受到极端市场事件的影响1。


    因为固定收益对冲基金一般使用很高的杠杆率，相对价值策略的损失可能非常高。有时候对冲基金对出现大幅损失的可能性是盲目的，例如LTCM对1998年俄罗斯违约之后信用利差扩大的情况是盲目的一样。多数时间房价价格相当平稳，并随时间上升。但有时候不然，例如2007年，美国按揭贷款相对国债的利差大幅扩大，给按揭贷款套利策略带来大幅损失。


    Fung和Hsieh（2002）使用截至2001年的数据对固定收益对冲基金的收益情况进行的研究具有很好的预见性。他们对类似大萧条的市场冲击下信用利差和预测出的潜在大幅损失作了回溯测试，总结道：“大多数固定收益套利基金中存在周期性风险敞口，可能被这些基金短暂的存续时间所掩盖。”或者说，历史上显著的正Alpha的出现原因是低概率事件并未出现。在2000年代末期低概率事件出现后，他们显得如此正


    > 参见Choi，Getmansky and Tookes（2009），以及Agarwal et al.（2011）。'
