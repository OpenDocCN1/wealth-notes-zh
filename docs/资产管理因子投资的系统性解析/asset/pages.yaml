  md: '溢价较高的原因之一（参见第8章）。


    普及了风险平配理论（均值方差投资的一种特殊形式；参见第3章）的对冲基金领域的超级明星Ray Dalio认为，黄金是一种“被低配了”的资产，如果投资者将组合中黄金持仓比例提高到与全球黄金市值权重（全球黄金市值占全球总财富的比例）相同的水平，那么黄金价格将会上升①。这个结论乍一看太过于不合实际。世界上所有的黄金——无论是地面下的、金库里的，还是海底沉船里的——都已经是有所属的了。Dalio的理论只有在如下情况才成立：市场参与者愿意通过购买来增持黄金，使持仓比例达到黄金的市值权重，并且对所需支付的价格完全不敏感。即，一些投资者的需求曲线是完全无弹性的（Perfectly
    Inelastic）。可能有些机构投资者是这样的，例如中央银行、新兴市场中不断增加的富裕阶层和中产阶层，或许还有一些误认为黄金是完美对冲通货膨胀工具的养老金。Erh和Harvey（2012）估计，黄金占总财富的比例在2%～10%之间，具体比例取决于你是只计算投资者持有的黄金，还是所有的黄金供给，这些供给包括未被开采的黄金以及央行持有的黄金。


