    长期债券风险溢价逆周期的特性意味着我们可以通过它来预测经济衰退。当债券风险溢价达到最高时，经济衰退是最严重的时候，并伴随着向上倾斜的收益率曲线。相对地，当风险溢价最小时，这是经济扩张的顶峰，并伴随着向下倾斜的收益率曲线。因此，期限利差是未来经济活动的反向指标，当利差偏低，甚至为负值时，意味着经济即将减速
    ^①^ 。图9.8展示了十年期美国国债与三个月短期国债的利差，阴影部分是国家经济研究局（National Bureau of Economic Research，NBER）确定的经济衰退时期。自1960年代以来，每当经济衰退之前，期限利差都是负值
    ^②^ 。


