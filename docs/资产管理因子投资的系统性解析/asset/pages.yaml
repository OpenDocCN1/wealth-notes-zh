  md: '这个建议听起来与我在第4章提出的再平衡主张相互矛盾。再平衡意味着购买表现差的资产，把握税收时机则要求出售表现差的资产。这二者如何统一呢？Constantinides的税收时机选择有别于资产配置决策。假设投资者通过AA指数基金将40%的资金配置到股票。在纳税年度结束时，假定发生了损失。再平衡会要求买入更多的股票。根据税收时机选择则应卖出AA指数基金。投资者选择出售AA指数基金，实现的亏损在税前抵扣，然后按同等或更多的金额购买BB交易所交易基金。从经济学角度考虑，AA指数基金等同于BB交易所交易基金。从税务角度考虑，二者则不同。如此一来，投资者既能实现再平衡，同时也从亏损抵税中获得好处。


    # 4.2 税收有效的资产配置


    资产配置和资产定位这两个问题因为潜在的相互作用及动态税收策略可能会变得相当复杂。我们有两种常见的解决方法：


    +   ①明确将资产配置问题和资产定位问题结合起来，同时解决。例如Damon、Spatt和Zhang（2004）。


    +   ②忽略这两方面问题的关联并制定特殊的规则。通常情况下，先解决资产配置问题，然后基于该资产配置决策，再来解决资产定位问题。


    第二种方法目前在金融行业比较流行。例如，Vanguard曾建议①：


    > 将节税效率最高的投资（例如税收管理基金、指数基金和免税基金）注入应税账户中，同时通过税收优惠账户，例如个人退休账户或雇主养老金计划，持有节税效率不佳的投资。


    事实证明，业界流行第二种方法有一定道理。最优定位问题可以与资产配置问题分开考虑，资产配置问题可以只考虑应税账户，而不是同时考虑应税账户和税收递延账户这样一个复杂得多的问题。Jennifer
    Huang在其博士论文Huang（2008）中首次提出这一观点。


