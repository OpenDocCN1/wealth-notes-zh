    # ## 2. 因子理论


    因子之于资产就如同营养成分之于食品。表6.2摘自美国国家医学院的食品营养委员会（Food and Nutrition Board），其列出了普通人体（男性、女性及儿童）所需的五大营养成分——水、碳水化合物、蛋白质、纤维及脂肪的建议摄入量。碳水化合物通常可以从谷类食品中获取，蛋白质可以从肉类和乳制品中获取，纤维大量存在于小麦和稻米，脂肪则可以从动物以及某些植物如花生来获取。每种食品都由一系列营养成分构成，许多食品都包含一种以上的大类营养成分，比如稻米包含碳水化合物和纤维。不管健康与否，不管性别或年龄差异，不同个体都有不同的营养成分需求。我们进食是为了获取食品中所包含的营养成分，正是这些营养成分滋养着我们。


    ### 表6.2 食品和营养成分


    |  | 男性 | 女性 | 儿童 | 食品举例 |

    | --- | --- | --- | --- | --- |

    | 水 | 3.7升/天 | 2.7升/天 | 1.7升/天 |  |

    | 碳水化合物 | 130克/天 | 130克/天 | 130克/天 | 面包、豆类、土豆、稻米 |

    | 蛋白质 | 56克/天 | 46克/天 | 19克/天 | 奶酪、牛奶、鱼、大豆 |

    | 纤维 | 38克/天 | 25克/天 | 25克/天 | 豌豆、小麦、稻米 |

    | 脂肪 | 20%~35%卡路里 | 25%~35%卡路里 | 多脂鱼、花生、动物脂肪 |


    资料来源：食品营养委员会，美国国家医学院，2004。


    因子风险是资产风险溢价背后的主要驱动力。因子风险的重要理论之一是CAPM理论，我们将在下节展开探讨。CAPM模型指出，所有资产回报的唯一驱动因子是超出短期国债收益的市场回报因子。所有资产都对市场因子有着不同敞口，且敞口越大'
  merge: -1
  img_proc: true
- pgno: 211
  md: '其风险溢价就越高。市场因子是一种可交易、可投资的因子。其他可交易的因子包括利率因子、价值一成长因子、低波动率因子和动量因子。因子也可以是基本面宏观因子，比如通货膨胀和经济增长。资产在高通货膨胀或低通货膨胀时期、经济扩张或经济衰退时期会有不同的收益。我们将在下一章对不同类型的因子进行全面剖析，本章则重点阐述因子风险背后的理论。


    食品和资产之间有三大相似之处。


    # （1）重要的是因子，而非资产


    如果一个人能服用实验室所制作的单调乏味的营养元素，他很能轻松满足其营养需求并拥有健康人生（但她将无法享受到美食所带来的乐趣）。重要的是资产背后的因子，而非资产本身。正确的投资需要我们透过资产类别标签去理解其背后的因子构成，这与正确的饮食需要我们透过食品标签去了解其营养成分构成是同一个道理。


    # （2）资产是由一系列因子组成


    食品是由不同的营养成分构成。有些食品本身就是营养成分——比如水——或者几乎只含有单一营养成分，比如稻米中主要是碳水化合物。但大多数食品通常包含多种营养成分。相似的，有些资产类别本身即可视为因子——比如股票和政府债——而其他资产类别则包含多个不同因子。公司债、对冲基金、私募股权包含不同程度的股票风险、波动率风险、利率风险和违约风险。因子理论表明这些资产的风险溢价反映了其隐含的因子风险。


    # （3）不同投资者需要不同的风险因子


    正如不同的人有不同的营养需求，不同投资者对不同的风险因子集也有不同的最优敞口。


    如我们所了解的，波动率是一个重要因子。如2007~2008年金融危机期间，我们观察到许多资产和策略在高波动率时期是亏损的。大多数投资者不喜欢高波动率时期，并希望其投资在波动率大幅上升时能受到保护。少数勇敢的投资者则可以持有相反头寸，这些投资者能在不景气时期承受损失，从而在正常时期获取波动率溢价。他们所获取的风险溢价是对其在高波动率时期承受损失的补偿——有时损失惨重，比如2008~2009年期间。


    另一个例子是投资者对经济增长有不同的期望敞口。某个投资者可能不喜欢GDP增长萎缩时期，因为在这种环境下他更容易失业；而另一个投资者能够容忍较低的'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'GDP增长，因为其劳动收入在经济衰退期反而有所增加，比如处理破产业务的律师。重点在于，对各个不同来源的因子风险，每个投资者有不同偏好或者说存在不同的风险厌恶系数。


    然而，因子和营养成分之间也存在一大差异，即营养成分本质上是好的，而风险因子是不好的。投资者能获取风险溢价的原因是由于他们经受住了不景气时期的风险。不同因子对不景气时期集有不同的定义，可以是经济不景气时期，如高通货膨胀和低经济增长时期；也可以是投资不景气时期，如市场总体表现不佳或某些投资策略业绩不佳的时期。投资者在不景气时期所遭受的损失会在景气时期获取相应风险溢价作为补偿。因子投资理论具体说明了不同类型的隐含因子风险，其中每个不同的因子代表着一组不同的不景气时期或经历。我们对因子风险理论的阐述先从最基础的因子风险溢价理论——即资本资产定价模型（CAPM）开始，CAPM模型只具体阐明了单一风险因子，即市场组合。


    # 3. 资本资产定价模型（CAPM）


    CAPM模型具有革命性，因为它认识到一种资产的风险并非取决于该资产自身的表现，而是取决于该资产与其他资产及市场整体的联动，它是最早令人信服的理论。CAPM模型出现以前，人们通常将资产自身的波动率视为风险。CAPM模型则认为这不恰当，合适的风险衡量方法应该是看该资产如何随市场组合变动而相应变动——即该资产的贝塔。正如我们将在第7章看到，资产自身的波动率确实重要，但为了更好地阐述CAPM模型及其重要的应用价值，我们可以暂时忽略波动率。


    CAPM模型是由Jack Treynor（1961），William Sharpe（1964），John Lintner（1965）以及Jan Mossin（1966）于20世纪60年代创立的，该模型基于Harry
    Markowitz于1952年提出的多元分散化投资和均值一方差效用原理。由于他们在CAPM模型和组合选择方面的杰出贡献，Sharpe和Markowitz获得了1990年诺贝尔经济学奖（Merton
    Miller因公司金融方面的杰出贡献，也于同年获得诺贝尔经济学奖）。遗憾的是，那时Lintner和Mossin均已过世，而Treynor的原稿从未得以发表，因此没能得到应有的认可。


    我在前面已经指出CAPM模型具有众所周知的明显不足。该理论表明，资产的风险溢价仅取决于该资产的贝塔，而且只有市场组合这一个因子是重要的。上述论断已'
  merge: -1
  img_proc: true
- pgno: 213
  md: '经被大量实证研究所推翻。但CAPM模型的不足也有非凡成效，为那些追求风险溢价和管理风险的资产所有者开辟了新的研究领域。


    CAPM模型给出的基本直观逻辑仍然适用：资产的风险溢价是由资产所隐含的因子决定的，用于补偿投资者在不景气时期所承受的损失。风险并不是就某类资产单独而言，而是指资产之间如何联动的一种属性。尽管有数据明确否定了CAPM模型，但它仍是金融学的通用模型：75%的金融学教授提倡采用该模型，75%的首席财务官在实际资本预算决策过程中运用该模型，尽管该模型有时立不住脚^{1}。CAPM模型大体上是可用的，在大多数应用中表现尚好，但在某些情形下却可能产生严重错误（下一章将详细阐述）。CAPM模型能够持续，部分源于该模型给出了风险补偿的直观解释。


    CAPM模型的正确性体现在哪些方面？


    # 3.1 CAPM结论1：别持有单个资产，而应持有因子


    CAPM模型指出只有单一因子存在，即市场组合，市场组合是指各股票按市值比例构建的组合。这与市场指数基金是一致的^{2}。通过持有多个股票可以最优地构建市场组合因子，从而多元化分散掉非因子或非系统性风险。资产所有者最好持有因子——市场组合，而非单个股票。单个股票具有带风险溢价（即食品中的营养成分）属性的市场因子敞口，同时也具有非系统性风险（idiosyncratic
    risk），即无法获取风险溢价补偿的风险（食品中没有营养价值的部分）。投资者可以通过持有市场因子组合而非其他个股组合来分散非系统性风险并提高收益。市场组合代表系统性风险（systematic
    risk），系统性风险具有普遍性：所有风险资产都具有仅由其对市场组合的敞口所决定的风险溢价。市场风险通常会影响所有投资者，那些因极度厌恶风险而仅持有无风险资产的投资者除外。


    因此，重点在于多元分散化投资。CAPM模型基于投资者具有均值—方差效用，如第3章所述，均值—方差投资中最重要的概念即多元分散化投资，多元分散化投资能确保在不存在完全相关性的情况下，当某种表现不佳时，其他资产表现良好，因而获得的盈利可抵消部分损失。投资者并不希望单独持有各项资产，他们通过多元分散化投资和组合中持有多种资产来改善组合的风险收益特征。这种在不完全相关的多种资产之间的平衡可以提高夏普比率。投资者将不断进行多元分散化投资，直到持有最多元分散化的组合——市场组合。市场因子是投资者在CAPM模型下能持有的


    > ① 分别参见Welsch（2008）和Graham and Harvey（2001）。


    > ② 第17章总结了指数基金的历史。'
