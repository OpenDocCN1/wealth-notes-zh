  md: '长期均值是很难估计的。按周或者按日取样并不能使均值估计更精确，只有扩展样本才能提高精度¹。对于标普500指数这类资产，估计长期收益率的唯一方法就是，观察样本起点和终点的指数水平并除以时间。指数是如何到达终点水平的路径并不重要，关键在于终点处的数值。因此，只有拉长时间范围，才可能对收益均值有更大把握。这就使得预测收益非常困难²。最小方差组合表现好于均值一方差组合，是因为它剔除了所有与均值估计有关的误差。


    相比于均值，波动率更容易预测。高频率取样虽然无法改善均值估计，但是它 可以更精确地估计方差。更高频率的数据还可以得到更好的相关系数估计。但是相 关系数可能变换正负符号，而方差只可能为正数。因此，方差比相关系数更容易估计。
    相关系数的不良估计也会对最优均值一方差组合产生严重影响；相关系数的微小改变 会导致组合权重的振荡³。风险均衡策略消除了与相关系数估计相关的噪声（更 高级版本的风险均衡策略的确包含了一些相关系数估计）。经过比较，风险均衡组
    合（基于方差和波动率的夏普比率分别为0.59和0.65）比最小方差组合（夏普比率 为0.52）的夏普比率更高。


