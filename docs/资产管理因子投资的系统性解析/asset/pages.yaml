    # 长期投资


    # 本章概要


    长期投资的基础是要定期将组合中的资产比例再平衡至固定权重，该权重由单一投资组合选择问题（其中的资产权重反映了投资者对待风险的态度）所决定。再平衡是一种低买高卖的逆周期策略。该策略即使在**20世纪30**年代的大萧条时期和**21世纪初
    “失落的十年”**仍然有良好的表现。再平衡策略与投资者的行为本能相违背，同时也是一种做空波动率的策略。'
