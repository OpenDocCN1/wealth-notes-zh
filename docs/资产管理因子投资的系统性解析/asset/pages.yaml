  md: '# 1. GM资产管理公司和Martingale公司


    Jim Scott和Brian Hascovici是通用汽车（GM）资产管理公司的负责人，该公司负责管理通用汽车养老基金。他们对于Martingale资产管理公司的首席投资官Bill
    Jacques提出的低波动率策略很感兴趣$ ^ { \textcircled{1} $} $。


    这种低波动率策略看起来实在是好得让人难以置信。


    Jacques声称，如果用历史波动率或历史贝塔值来衡量风险，低风险股票可以获得比高风险股票更高的回报率。这个结论与传统的金融理论是相悖的：例如，资本资产定价模型（CAPM）认为风险与收益之间应该存在正相关关系。而Martingale构建的低波动率投资策略正是利用了这一风险异象。图10.1画出了从1979年1月至2012年4月间，Martingale低波动率大盘股投资策略（Martingale''s
    Low Volatility LargeCap + Strategy）和罗素1000指数的累计回报率。截至2007年12月之前的回报率数据是Martingale分析师通过回测模拟得出，2008年1月以后的回报率是实际观测值（如图10.1的垂直线所示）。


    在整体样本期内，Martingale低波动率策略的收益率比罗素1000指数高1.5%。自2008年该策略实际实施以来，其表现更为出色，收益率比罗素1000指数平均高出1.83%。如果采用一个月的美国短期国债收益率作为无风险收益率基准，低波动率策略的平均超额收益为8.59%，标准差为12.22%，全样本期的夏普比率（Sharpe
    Ratio）高达$8.95/12.22 = 0.70$。相比之下，同期罗素1000指数的夏普比率仅为0.45。调整市场风险后的Martingale低波动率策略的表现更加优异；如果用CAPM进行回归分析，将罗素1000指数作为市场组合，那么该策略的阿尔法为3.44%，对应的贝塔值为0.73。


    > ① 这是来自案例“GM Asset Management and Martingale''s Low Volatility Strategy”，2012、哥伦比亚大学案例，ID
    #110315。我已认识Scott和Jacques一段时间。我曾和Scott一起教授一门量化投资课程，内容涵盖量化对冲基金的投资工作。2009年，在我和William
    Goetzmann、Stephen Schaefer合写了关于挪威主权财富基金的报告后，Jacques与我取得联系。在报告中，我引用了哈佛商学院的Luis
    Vicira（Martingale的一位顾问）写的关于Martingale的一篇案例。Jacques某日早晨致电我，之后来我办公室造访，随后立即邀请我成为Martingale学术顾问委员会的成员。'
