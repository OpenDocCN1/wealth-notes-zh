  md: '的头寸从48%变为约5%、法国股票的头寸从23%减少至-5%。这些都是美国股票收益均值的微小变化所带来的巨大改变。难怪Michaud（1989）将均值—方差组合称为“误差最大化组合”。


    # 4.2  如何应对？


    # 改变效用


    我的第一个建议是不要使用均值—方差效用。投资者还会担心其他风险，他们关心相对表现，比如向邻居看齐或习惯效用，而且他们对损失的畏惧远多于获益的喜悦（关于更广泛的效用函数，参见第2章）。遗憾的是，我们缺少那种可以针对更加现实的效用函数输出最优组合的商业化优化器（至少撰写本书时我还没有发现），但已经有许多很不错的均值—方差优化器。如果你坚持（或被迫）使用一均值—方差效用，那么请做到以下几点。


    # 使用约束条件


    Jagannathan和Ma（2003）指出，加上约束条件会大有帮助。实际上，无约束条件的原始均值—方差权重很不稳定，以至于实践中使用均值—方差优化时总要加上约束条件。约束条件会有用是因为它们将无约束的组合权重拉回到经济意义上合理的水平。因此，它们可以被解释为一种将无约束的权重降低至合理数值的稳健估计量（robust
    estimator）。我们可以通过以下方法更普遍地做到这一点。


    # 使用稳健统计量


    投资者可以通过使用稳健的统计学估计量来显著改善对输入变量的估计。有一类估计量便是采用贝叶斯收缩（Bayesian shrinkage）方法^{①}。这些估计量可处理对传统经典估计量造成严重破坏的异常值和极端数据。它们将估计收缩至一个基于直觉或经济学理论的先验估计或模型。例如，我们不会使用样本估计得到的原始均值，但是我们将原始均值调整为CAPM（参见第6章）或多因子模型所隐含的均值，或是通过基本面分析所得到的数值。协方差也可以被收缩至一个先验估计，例如该估计中假定一个行业的每只股票都具有相同的波动率和协方差——如果我们认为某一给定行业中的'
