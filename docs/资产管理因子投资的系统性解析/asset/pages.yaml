  md: '$E(FX_{i})=\beta_{i,FX}E(HML_{FX})$ 公式（7.3）


    其中$FX_{i}$是国家i的外汇套息收益，$\beta_{i,FX}$是货币i在套息因子$HML_{FX}$上的敞口，套息因子是通过做多高利率货币、做空低利率货币来构建的。公式（7.3）中的外汇价值策略和公式（7.2）中的股票价值策略在概念上并无差别，都将低价格等同地视为高收益率。


    如Koijen等（2012）和Asness, Moskowitz和Pedersen（2013）研究指出，价值策略在不同资产类别之间往往有共通的部分。无论从理性学派还是从行为学派看，股票、债券和外汇市场中的价值策略都有令人信服的解释，但鲜有理论将不同市场间价值策略的风险溢价联系起来$^{1}$。不管怎样，价值因子普遍存在，而且理论上能被大型投资者以低成本、大规模的方式实施。对小型投资者来说，在股票、债券和外汇市场也都有价值策略的低成本指数产品。不同资产类别中普遍存在的价值效应意味着资产所有者应该进一步开发和利用因子投资，我们将在第14章对此继续探讨。


    # 3.7 动量


    另一个标准的可投资因子是动量因子。自Jegadeesh和Titman（1993）于Fama和French捕捉规模和价值因子的同年提出动量因子后，学术界涌现出了大量相关研究$^{2}$。业界专业人士如共同基金明星经理Richard
    Driehaus，已在过去几十年实践中运用动量策略$^{3}$。Jegadeesh和Titman（1993）指出，金融数据提供商Value Line自20世纪80年代就一直在其出版物中提供价格动量信号。


    # 动量投资


    动量策略是做多过去六个月（左右）收益上升的股票（优胜者）、做空同期收益最差的股票（失败者）。动量效应是指这样一种现象、即表现优异的股票将继续胜出，而表现不佳的股票将持续跑输。我们用$WML$来表示动量因子，即历史表现优异的股票减去历史表现不佳的股票（也可用$UMD$表示动量因子，代表收益上升的股票减去收益下降的股票）。与规模、价值策略一样，动量策略也是一种横截面策略，意味着


