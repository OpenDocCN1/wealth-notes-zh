  md: '理着这些基金的公司。董事会的存在赋予了基金一层独立性。但基金经理真正忠诚于管理基金的公司，而不是拥有基金的投资者。这种关系是天生扭曲的，输的始终是投资者。共同基金的很多董事，特别是董事会主席，也是投资管理公司的内部人士。基金董事一般不会，而且在很多情况下也不能独立地验证基金管理公司提供的信息。将基金的治理从基金发起人处分离并不足以保护投资者。


    最高法院支持基金和基金管理公司在法律层面上的分离，虽然在实际操作层面，共同基金仍然由共同基金公司进行管理。2003年Janus市场择时的丑闻导致了Janus资本集团对第一衍生品交易员公司（First
    Derivative Traders）的法律案件$^①$。在2011年6月，最高法院判决Janus基金，而不是Janus基金管理公司，应当对招股说明书中造成对某些投资者不利的市场择时行为的误导性语言负责。在法律上，所有过失都由Janus基金承担。Janus基金管理公司得到了一个免费通行证，虽然它发起、营销并管理着这些基金$^②$。


    # 2.4 总结


    作为注册投资公司的好处是其能向公众募集资金。为了保护一般投资者，40法案对注册投资公司进行了一些限制。该法案规定信息披露，最低限度的监督，以及基金管理人收费的限制。这些监管条例降低了委托代理的问题，但并不能消除该问题。


    40法案并不完美，但没有它会更差，正如我们将在接下去的第17章和第18章中分别讲到对冲基金和私募股权时会看到的一样。


    交易所交易票据（Exchange Traded Notes, ETNs）是在交易所交易的跟踪指数的基金，看起来很像交易所交易基金。但它们并不是40法案基金，而是被当作固定收益证券来监管，在技术上是给银行的贷款。它们的成本很高，税务复杂，价格可能显著不同于其持有资产的市场价值。不同于必须清楚披露收费情况的40法案基金，交易所交易票据的优势在于费用不透明。财经专栏作家Jason
    Zweig基于一些厚重的招股说明书计算了基金的总费用$^③$。Et racs Daily S hort标普500 VIX Futures ETN收取1.35%“追踪费用”（“tracking
    fee”）和每周0.77%的固定风险对冲费用，等于每年5.35%。复制


