  md: '资产要低。当非流动性资产不能交易时，投资者不能抵消非流动性资产价值下降的风险。这是一种无法对冲的风险，投资者只能通过减少支出来部分抵消风险。


    # 不存在非流动性套利


    在均值一方差模型中，具有不同夏普比率且完全相关的两种资产会导致正负无穷大的头寸。这是均值一方差模型一个众所周知的弊病，业界专业人士采取了很多临时调整和主观约束来防止这种情况的发生。当其中一种资产是非流动性资产时这种情况便不会发生，因为不存在套利。投资者不会增加持有非流动性资产，因为这些资产具有非流动性风险而且无法被持续交易来产生
    “套利”。


    # 投资者应要求更高的非流动性门槛收益率


    投资者需要多少溢价作为非流动性的补偿呢？在表13.2的B中，我计算了投资者因承担非流动性风险所要求的非流动性溢价。我们将非流动性溢价或门槛收益率，界定为确定性等值（参见第2章）。假定某投资者持有两种流动性资产，并将其中一种资产替换为除了流动性差以外其他都相同的资产。非流动性资产预期收益的增加即非流动性溢价，因此投资者具有与其持有流动性资产时一样的效用。


    当流动性事件平均每六个月发生一次时，投资者应要求额外70个基点的溢价。（有些对冲基金会在这个投资期附近设有锁定期。）如果非流动性资产平均每年交易一次时，非流动性溢价约为
    $ 1\% $ 。如果投资者平均需要等上10年才能退出某项投资，投资者应要求约6%的非流动性溢价。也就是说，投资者应该坚信私募股权基金能产生比公开市场投资高出6%的收益来补偿非流动性。正如我们在第三节讨论的那样，大多数非流动性资产并不能创造高于上述门槛收益率的超额收益（也可参见第11章）。


    Ang，Papanikolaou和Westerfield（2013）的模型是高度程式化的。考虑到该模型没有涵盖的其他因素，比如代理利益冲突（参见第15章）、涉及资本募集和分配的现金流管理、资产负债错配等情形，真实的非流动性门槛回报率应比表13.6公布的更高。


    # 5.3 小结


    包含非流动性资产的组合选择模型建议仅持有适量的非流动性资产。投资者应该要求更高的非流动性风险溢价作为补偿。'
