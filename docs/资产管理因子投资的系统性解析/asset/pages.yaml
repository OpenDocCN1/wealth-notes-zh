- pgno: 326
  md: '基本法则最初只是作为一种构建资产组合的工具，但挪威主权财富基金NBlM的创始首席执行官 Knut Kjaer将基本法则的理念提练成了一种管理模式。由于创造阿尔法的关键是找到尽可能多的独立预测，Kjaer的投资哲学即是资金尽可能广泛地委托给不同的专业化管理人。他尽力确保这些管理人的决策是独立进行的。他解释道①：


    > 在积极投资中为了实现尽可能高的决策独立性，必须将投资委托给尽可能多的团队和个人。这种委托一定要充分地放权，上层的干预要尽可能少，只需要保证每个管理人都遵守既定的框架和风险限制。增强管理人的主人翁意识，以及减少上层干预，这两点是激励管理人发挥专业能力的关键。


    基本法则有两个非常重要的缺陷。首先，它假设在不同的广度下，信息系数是相同的。而实际情况是你找到的第一个管理人可能确实有很高的信息系数，但是你不能保证100个管理人都有很高的信息系数。随着资产管理规模的增加，实现高信息系数的能力在下降。实际上，如我在本书的第三部分提到的，关于积极管理的实证研究表明存在规模报酬递减规律（decreasing
    returns to scale）：随着资产规模增加，业绩会越来越差。这种规律在共同基金、对冲基金以及私募基金中都能观察到②。所以，信息系数通常会随着资产管理规模的上升而下降。


    其次，在广度中获得真正独立的预测也较困难。管理人的各个投资决策通常是相关的，而各个决策间的相关性通常会降低广度。例如，一个股票管理人高配1000只价值型股票，同时低配1000只成长型股票，此时他并不是作了1000个不同的决策，而实质上只作了1个决策，即高配价值因子。类似的，雇佣一百个固定收益管理人，大家都是通过购买流动性较差的债券来“获取高收益率”（reaching
    for yield），那么你其实并没有作出一百个不同的决策，而是仅仅作了一个高配非流动性因子的决策。如果大部分因子决策是相关联的，那么这些决策在整体组合层面就会起主导作用——这就解释了为什么自上而下的因子投资策略很重要（参见第14章）。


    尽管在业界很有影响，但是Grinold的基本法则却很少出现在学术文献中。因为Grinold的分析框架是一个缺乏经济学内涵的统计模型。它并没有指出在何处可以获得风险调整后收益为正的投资机会；它只提供了一个对这些机会进行系统性评估的方法。我将在第4节讨论一个很有希望获取阿尔法的领域。


    ① NBIM年报，2007，“NBIM的10年”。

    ② 分别参见Chen et al.（2004），Fung et al.（2008）以及Kaplan and Schoar（2005）。'
