- pgno: 375
  md: '如果风险溢价是稳定的，那么盈亏平衡通胀率的变化与预期通货膨胀率几乎完全同步。但是因为风险溢价随时间发生变化，不能直接用盈亏平衡通胀率来直接衡量预期通货膨胀率。当风险溢价的变化很小时，盈亏平衡通胀率的变化基本上就表达了市场对于未来通货膨胀率变化的期望<sup>1</sup>。但是，风险溢价是会发生变化的。Ang、Bekaert和Wei（2008）中显示，在20世纪六七十年代的大通胀时期、80年代末经济爆发式增长时期以及90年代中期，风险溢价尤其巨大（第9章也有提及）。


    通过公式（11.2）对盈亏平衡通胀率的分解，我们可以区分出，金融危机期间的负盈亏平衡通胀率是由于预期通货膨胀率为负，或风险溢价为负，还是两者均为负。我们能否判断是哪种情况呢？


    通货膨胀率问卷调查被视作是预测通货膨胀率的最好方法之一，Ang、Bekaert和Wei（2007）认为这种方法好于很多经济和利率期限模型。在图11.4中除了金融危机时期以外，在其余样本期间内，通货膨胀率预期都较为稳定。2008年12月，专业预测者调查（Survey
    of Professional Forecaster s）预测的中位数显示，该季度的广义CPI为-2.6%，该数字在2009年回升到2.0%。因此2008年和2009年期间当市场参与者担心再现日本式的通货紧缩情景时，盈亏平衡通胀率持续为负。同时，由于避险资金流入国债，推高国债价格，压低名义收益率，国债出现了负风险溢价。投资者希望得到宁愿为持有国债而额外付钱（负风险溢价），而不是持有并要求额外回报（正常情况下风险溢价为正）。所以通货紧缩情景和负风险溢价都很重要。


    # 4.5  流动性匮乏


    TIPS市场的一个重要因子是流动性风险。在TIPS刚发行后的几年里，TIPS市场一直缺乏流动性，直到2000年代中期才有所缓解，但时至今日其流动性仍明显低于国债市场<sup>2</sup>。由于偏好TIPS的投资者是养老金和个人投资者，Sack和Elasser（2004）预测TIPS市场的流动性将仍然明显弱于国债市场，因为国债市场集中了大量的积极型基金管理人。


    研究者们估算，直至2003年和2004年，五年期TIPS的流动性风险溢价约为1.0%，十年期的风险溢价在0.5%～1.0%之间。在2004年，五年期和十年期TIPS的流动性风险


    ① Fleckenstein、Longstaff和Lustig（2010）认为，TIPS与国债的相对定价出现了偏差，TIPS被低估了，国债被高估了。他们认为这是“金融经济学有史以来最大的套利机会”。


    ② 参见D’Amico、Kim and Wei（2009），Gurkaynak、Sack and Wright（2010）以及Flueger and Vice（2011）。'
