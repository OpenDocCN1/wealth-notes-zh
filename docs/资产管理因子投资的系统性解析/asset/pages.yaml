- pgno: 279
  md: '简单的$R^2$总会（而且是极大地）夸大长期限可预测性。稳健的$t$统计量校正可以得出正确的计算，而$R^2$不能。上述分析的主旨便是，数据中并没有太多的可预测性——正如同理论上应该是的那样——而且可预测性在长期很难被发现。


    # 可预测性时来时去


    最后还有一点让投资者更难在实践中预测收益：预测系数本身（公式（8.7）中的参数 $b$）会随时间变化。有些统计模型能适应这种参数不稳定性（parameter
    instability），它们允许预测系数经历结构性突变或者随时间缓慢变化$^{①}$。Henkel，Martin和Nardari（2011）捕捉到取决于经济状况的可预测性。他们发现，可预测性在经济周期扩张时较弱，而在经济衰退时很强。因此，可预测性是逆周期的并且在经济放缓的情况下最常被观测到$^{②}$。


    # 对投资者的启示


    随时间变化的风险溢价是存在的，但很难去预估。如果你试图利用它们获利，请遵照以下几点：


    +   （1）使用好的统计方法


    比如，当你执行投资策略时，如果采用错误的$t$统计量而高估了统计显著性并因此让可预测性看上去“非常好”，这会对你不利。拟合样本中$R^2$虚高的一种表现是，样本外的业绩会显著变差。与虚高的$R^2$相一致的是，Welch和Goyal（2008）研究发现，股票超额收益历史平均值的预测能力几乎优于其他所有预测变量。投资者应该采用综合了大量信息的有效计量经济学方法，但要小心数据挖掘问题，并要考虑经济状况发生变化的可能性$^{③}$。


    +   （2）使用经济学模型


    我们注意到表8.2中最佳的预测指标是估值比率。对股票风险溢价的预测与对经济价值的预测是一样的。你如果能在分析中加入经济学框架，就这样做。包括Campbell和Thompson（2008）在内的一些研究发现，加入经济学的直观逻辑以及经济学模型中'
