  md: '个“坏”的概率分布。中间情形还可以有各种可能的概率分布。单一概率分布——即传统的衡量风险的方法——与一系列可能的概率分布之间有显著区别。我们将后者称为“奈特不确定性”（Knightian
    Uncertainty），该术语由Gilloa和Schmeidler（1989）提出，是为了纪念Frank Knight（1921）。


    在不确定性厌恶下，投资者的效用取决于风险和不确定性。关于可能的概率分布集合所得到的信息越确切，投资者的效用越高。正如投资者有风险厌恶参数一样，他们也有不确定性厌恶参数。不确定性厌恶也被称为模糊厌恶（Ambiguity
    Aversion），因为多个概率分布的存在即是模糊。研究学者还会谈到与之密切相关的稳健效用（Robust Utility），它也涉及多个概率分布1。在稳健效用下，投资者表现出对于不同概率分布情况下他们决策的稳健程度的一种偏好（“关注”）。（我的MBA学生也许会将这称为美化版本的敏感性分析）。它也被称为最大最小效用（Maxmin
    Utility），因为不确定性厌恶投资者选择了可能发生的最糟糕的风险概率分布（最小），然后最大化其效用（最大）。


    Guidolin和Rinaldi（2010）对不确定性厌恶和资产组合选择做了一个综合回顾。我的简要评论如下：


    +   ①比起之前仅使用“普通的”风险厌恶效用，不确定性厌恶使投资者有效地以“更厌恶风险的”模式来行动。当你有不确定性厌恶时，你持有的股票权重要会少得多。事实上，如果你足够讨厌不确定性，你不会持有任何股票2。


    +   ②预期效用中的许多工具可被使用——而且，更重要的是，本章的直观逻辑在很多其他情况下也适用。不确定性厌恶甚至与均值一方差效用也有明确的联系3（显然，在最简单的情况下，预期效用就是只有一种概率分布的不确定性厌恶）。


    +   ③有数据显示投资者脑中对概率分布有不同的看法——可通过调查问卷获得。学术界近期的一些论文巧妙地利用这些调查问卷来展示这些不同的看法如何随时间发生变化以及如何使用它们来推测未来的资产价格4。


    +   ④并非每个人都是模糊厌恶的：Dimmock等（2013）指出超过1/3的美国家庭是寻求模糊偏好，但更厌恶风险的人往往更厌恶不确定性。


    > ① 关于稳健性的参考著作参见Hansen和Sargent（2007）。


    > ② 这是由Dow and Werlang（1992）首先提出的。另参见Garlappi、Uppal and Wang（2007），Bossaers et
    al.（2010），及其他更多文献。


    > ③ Maenhout（2004）将经典的CRRA风险厌恶系数重新解释为CRRA风险厌恶系数与不确定风险厌恶系数之积。另参见Trojan and Vannini（2004）。


    > ④ 参见Ulrich（2011）'
