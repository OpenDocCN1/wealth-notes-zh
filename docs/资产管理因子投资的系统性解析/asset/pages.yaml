  md: '以使大宗商品价格暂时性地偏离基本面。许多此类因子与通货膨胀并不直接相关。


    许多因子都能影响大宗商品价格，这意味着对大宗商品投资的积极管理有较大的发挥空间。大宗商品市场也像股票和债券一样呈现出了类似的价值效应和动量效应以及其他的横截面可预测性现象${
    }^{①}$。大宗商品交易顾问（Commodity Trading Advisors，CTAs），常常成为动量投资的代名词。这些价值效应和动量效应是标准投资因子的一种显现（参见第7章）。此外，如经济模型所预测的那样，大宗商品价格会对对冲压力、相对稀缺性、供需失衡等作出反应${
    }^{②}$。未仓合约以及其他资产的价格，包括汇率，也可以预测大宗商品价格${ }^{③}$。


    # 5.2 大宗商品因子


    由于存储成本的原因，投资者通常并不以实体形式持有大宗商品，而是通过期货市场来获得大宗商品的敞口。一个例外是少部分投资者直接持有贵金属敞口，但即使是在贵金属的例子中，大部分投资者仍然（直接地或通过中介机构间接地）通过期货来获得贵金属敞口。对于生产者而言，一些大宗商品（例如电力）的存储成本接近无限大。


    表11.2列出了高盛大宗商品指数（GSCI）中的多种大宗商品期货投资的表现以及它们与股票、债券及其他宏观因子的相关系数。广义GSCI指数是一个多种商品加权的指数。该指数有大约80%的敞口是不同种类的石油和燃气，因此该指数在能源上的权重很高。


