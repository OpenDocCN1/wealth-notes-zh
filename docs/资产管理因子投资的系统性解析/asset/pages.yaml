- pgno: 11
  md: '我除了向Andrew祝贺他在全球最大的资产管理公司BlackRock履职、成功以外，也向他询问了本书中的一些观点。他谦虚地笑着说：“都是抛砖引玉。”他在本书的前言中也是如此说的。的确，在山头林立的资产管理界，似乎没有绝对的真理，绝对准确的数据，绝对正确的算法。《资产管理：因子投资的系统性解析》一书也不例外。


    但是，瑕不掩瑜。


    Andrew Ang的新作是我在80年代末期出任道富银行研究部主任以来所见到的覆盖面最广、材料最翔实、论证最逻辑、表达最风趣的资产管理方面的教科书。其中文版的问世，一定会促进中国资产管理现代化的进程。对此，我深信不疑。


