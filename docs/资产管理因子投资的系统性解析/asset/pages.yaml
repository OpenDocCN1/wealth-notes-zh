  md: '在能取得超额收益的情况下，投资者不应该介意支付高额费用。令人遗憾的是，目前对冲基金的合同并非如此。Lan，Wang和Yang（2012）建立了一个关于对冲基金杠杆和估值的模型。他们研究发现对于标准的2/20的合同，对冲基金需要取得高达20%的回报才能使得收费有所值。Lan，Wang和Yang的研究也发现业绩费只构成对冲基金收入的一小部分，仅为四分之一。即使加上例如管理权、新资金流动和重新开始的选择权等其他因素的影响，这个结果也不发生改变。相对于业绩费，对冲基金管理费占据显著的主导地位。


    对冲基金合同不受40法案的限制，这为寻求最优的费率结构提供了较大空间。我更希望看到管理费占对冲基金收入的小部分，例如1%至2%。也就是说，更好的合同可能是0.25%的管理费和50%或以上的业绩费。投资者也可以考虑支付固定金额的费用，而不是一定比例的费用，用于支付人工和其他费用。任何固定比例的费用都应该是最低的，即反映投资者选择低成本指数组合的机会成本。Renaissance大奖章基金在收取高额业绩费方面是正确的，我认为其业绩费该比现在的水平更高，但管理费应该低一个数量级。业绩基准也应该改变。最为适当的基准是一个因子基准，特别要将波动率风险纳入考虑，因为对冲基金在很大程度上是投资于波动率和其他一些动态因子（参见如下内容和第7章）。


    # 4.3 缺乏流动性的成本


    对冲基金采用多种方式限制流动性。它们有锁定期（lockups），在此期间投资者不能赎回。典型的锁定期约为三至六个月，但可能长达两年及以上。长期资本管理公司（LTSM）最初采用了三年的锁定期，这也解释了基金名称包含了“长期”的字眼$^{(1)}$。Edward（Eddie）Lampert经营的ELS投资公司（ELS
    Investments）有五年的锁定期。于2012年从摩根斯坦利分拆出来的由Péter Mueller主管的PDT Partner采用了七年的锁定期。业界甚至有锁定期为十年的基金。很多基金也提供流动性和费用之间的权衡选择，给予接受较长锁定期的投资者较低的费率，反之则反。


    如果对冲基金有赎回通知期（notice period），那么要求赎回的投资者须在一定日期前通知基金（例如某个季度初），然后等到通知期末（例如某个季度末）收到赎回资金。一些对冲基金将赎回通知期延长到几个季度。SAC资本顾问公司过去允许投资


    > 关于锁定期数字背后的引用来源，请参见哈佛商学院案例“长期资本管理公司”（Long-Term Capital Management，L.P.），1999；Andre
    Perold著；经济学家，“All Locked-Up”，2007年8月2日；FINalternatives，Morgan Stanley Hedge Fund
    Spin-Off Wins $500M From Blackstone”，2012年10月10日'
