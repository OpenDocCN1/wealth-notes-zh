  md: '业界通常会采用单一投资类投资决策模型，该模型一般是在特定的Markowitz（1952）均值方差模型加上一些特设调整（是的，目前业界大多仍采用20世纪50年代以来的模型；参见第3章）——该模型对于非流动性资产投资并不适用。投资者现在不能交易非流动性资产，而在未来会交易的事实，使得非流动性资产投资成为一个动态的、较长投资期的问题。非流动性所涉及的两个重要方面——大额交易成本和交易间隔时间很长——均被涵益在非流动性资产的组合选择模型中$^1$。


    # ## 5.1 考虑交易成本后的资产配置


    George Constantinides（1986）首次构建了一个考虑到投资者必须支付交易成本的资产配置模型。例如，卖出价值100美元的股票最后得到90美元是因为有10%的交易成本。毫无意外地，投资者通过减少交易频率来减少交易成本。Constantinides证明了最优策略是在风险资产头寸触到上下边界时进行交易。上下边界间的无交易区间就是从假设投资者能持续、无摩擦交易的模型中得出的最优资产配置（Merton
    的1971年模型；参见第4章）$^2$。


    这个无交易区间是关于交易成本规模和风险资产波动率的函数。Constantinides估计如果交易成本是10%，那么对于波动率为35%且最优持有比例为25%的某风险资产而言，无交易区间将大于25%（我敢说哈佛在2008年试图出售其私募股权投资时希望只需折让10%）。也就是说，资产所有者在0%～50%之间无须交易——确实，非流动性资产头寸有很大波动。非流动资产
    的投资者应预期不会频繁地进行再平衡。


    Constantinides的模型能用来计算非流动性风险溢价，按照定义即某种非流动性资产在无摩擦状态下为了给投资者带来同样效用所需要的预期收益。这是投资者在承担交易成本时所要求的风险溢价，而且这是一个确定的等值计算（参见第2章）。如果交易成本为15%或更高，则所需的风险溢价将大于5%。可以将该值与非流动性资产类别数据中平均为（接近于）零的超额收益进行比较。


    交易成本模型的一个主要缺点是假定支付了交易成本后就可以交易。但事实上私募股权、房地产、林业或基础设施投资并非如此。有时短期内可能没有机会找到一个买家。即使可以找到交易对手，你还需要等待尽职调查和法律谈判的完成，并且交易'
