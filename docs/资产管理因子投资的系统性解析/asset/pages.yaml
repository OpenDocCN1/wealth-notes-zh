  md: "股票和债券更大。即使正常情况下的高流动性市场也会时常出现流动性不足。大多数投资者的财富与非流动性资产紧密相连。因此，资产所有者在构建他们的资产组合时必须考虑非流动性风险。这需要他们仔细评估非流动性资产所带来的风险收益是否可以补偿其非流动性风险，但衡量非流动性资产的收益并非易事。\n\
    \n# 3. 公布的非流动性资产收益率并非真实收益率\n\n正如Faust和Forsi在哈佛各院系理事会的通知中所提到的，非流动性资产的真实损失要比公布的数据更大，我们从中可得出一个重要推论：非流动性资产公布的收益率并非真实收益率。下述三个重要偏差会导致人们夸大期望收益并低估非流动性资产的风险：\n\
    \n+       生存者偏差\n    低抽样率\n    选择偏差\n\n在非流动性资产的市场中，投资者必须对公布的收益率数据持高度怀疑的态度。\n\n\
    # 3.1 生存者偏差\n\n导致生存者偏差的原因是由于业绩不佳的基金会倾向于停止公布其收益情况。这类基金大多最终以倒闭告终，但业界却很少把他们的失败计算在内。这使得非流动性资产的真实收益率比公布的数据更糟。\n\
    \n打个比方：如果我们想要检验吸烟是否对身体有害这一假说，我们打算只考虑那些已吸烟至少二三十年但至今身体仍健康的烟民作为样本进行测试。你看，结果我们发现选择的这个样本组的烟民死亡率比一般人群略低。这是个有效的结论吗？当然不是！因为我们抽取的是那些到目前为止还未受到烟草有害影响、仍然长寿的有偏差的吸烟者样本。如果你今天开始抽烟，你二十年后和这个样本里的人一样身体不会受到烟草影响的概率有多大？或者你能否确定自己在二十年后重复实验前没有因为肺气肿（或心脏病、肺癌等）而过世？\n\
    \n在非流动性资产管理中尚存的基金就好比那些幸运长寿的吸烟者。我们可以精确地观察到那些幸存基金的收益率，这是因为基金一直存在而且通常高于平均水平。所"
