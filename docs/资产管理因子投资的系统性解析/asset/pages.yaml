    # 图7.2 VIX和一年移动平均的股票收益


    波动率上升时，股票并非唯一表现不佳的资产。波动率与许多资产和投资策略的收益均为负相关。高波动率期间，货币投资策略表现尤其糟糕。我们在随后章节会了解到，许多资产或投资策略都隐含了较大的波动率风险敞口。尤其是对冲基金，总体来看是卖出波动率（参见第17章）。


    不喜欢波动率风险的投资者可以购买波动率保护（比如购买看跌期权）。然而，有些投资者能承担波动率风险，并卖出波动率保护（比如卖出看跌期权）。波动率保护的买卖均可以在期权市场完成，交易员也可以采用其他衍生品合约如波动率互换合约来完成。平均而言，投资者对波动率都有较大顾虑，所以他们愿意支付一定成本来避免波动率风险，而不是收取相应费用来承担波动率风险。高波动率时期往往伴随着资产收益的大幅下跌（如图7.2所示），因此高波动率期间收益较好的资产，比如价外看跌期权（out-of-money
    put）、能够提供对波动率风险的对冲。


