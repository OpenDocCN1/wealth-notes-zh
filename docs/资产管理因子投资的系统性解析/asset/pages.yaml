    在第4章我曾指出，再平衡作为一种组合策略实际上是一种做空波动率的策略。因此，简单执行再平衡操作能获取长期的波动率风险溢价，而不做再平衡的投资者——比如100%持有市场组合的平均投资者——则是做多波动率风险而失去长期的波动率风险溢价
    $ ^{①} $ 。执行再平衡操作的长期投资者可能会面临图7.3所示的左侧肥尾风险。然而，再平衡与波动率交易之间存在两大差异。其一，在不同资产（或如第14章所列出的策略或因子）之间进行再平衡并不直接交易波动率风险。比如在不同股票间做再平衡时涉及交易的是实际股票，而图7.3涉及及交易的是风险中性或期权波动率。在衍生品市场进行波动率交易，能带来再平衡所无法带来的额外波动率风险溢价。因此，在衍生品市场进行波动率交易所产生的损失很可能也远高于简单再平衡策略。其二，投资者可在衍生品市场通过中性套期保值（delta-hedging）进行纯粹的波动率交易，无需对预期收益进行判断。而投资者在基础资产或策略间进行再平衡操作，是为了获取隐含的因子风险溢价。尽管收益的可预测性很有限，但执行再平衡操作的投资者可以通过均值回归来进一步增强收益，因为他以价格购买了高预期收益的资产。第4章和第14章对此进行了更详尽的分析。


