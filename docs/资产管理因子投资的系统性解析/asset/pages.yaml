    Dalio，获得39亿美元。Dalio也在2010年收入最高的对冲基金管理人名单上，当年获得31亿美元。Bridgewater也为名单上并列第七的Greg
    Jensen和Robert Prince带来了巨额财富。在2011年名列第三的管理人James Simons当年赚取了21亿美元。Simons也于2010年和2009年出现在该名单上，两年都赚取了25亿美元。


