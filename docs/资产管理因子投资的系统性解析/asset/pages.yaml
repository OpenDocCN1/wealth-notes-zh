- pgno: 352
  md: '型预测的情形。实线“Long”与虚线“Data”的交点表示做多低贝塔值组合的敞口，我们将其加杠杆后，其在图中的实际位置被沿着实线“Long”提高到线上黑色方块处。实线“Short”与虚线“Data”的交点表示做空高贝塔值组合的敞口，通过加入一部分无风险资产，其在图中的实际位置被沿着实线“Short”降低到线上黑色方块处。经这样处理后，我们使得做多组合和做空组合的贝塔值相匹配。实际上，这两个组合相当于分别持有低贝塔值和高贝塔值组合的单位化贝塔敞口（unit
    beta position）。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_352_0.png)


    # 图10.12 *B*4*B*因子构建示意图


    Frazzini和Pederson在构建*B*4*B*因子时，仅使用了两个贝塔值组合。他们别无选择。在图10.10中，第一个贝塔值组合的事前贝塔值接近于零。如果对该组合加杠杆的话，组合敞口将会趋于无限大。因此，构建*B*4*B*因子时可供他们选择的贝塔值组合数量非常有限——最多二至三个。这里可以看到波动率组合的一个优势，即它们可以直接被交易而无需引入无风险资产，因为各波动率组合的波动率、预期回报率都有比较明显的差异。


    # 波动率因子


    类似于Frazzini和Pederson的*B*4*B*因子，我构建了一个波动率因子（*VOL*）：


    ```

    *VOL*_L+1 = *σ*_*target* × ( *r*_L,L+1 - *r*_f)/ *σ*_L,L - (*r*_H,L+1 - *r*_f)/
    *σ*_H,L


    \[10.18\]

    ```


    其中*σ*_*L*和*σ*_*H*分别代表低波动率组合和高波动率组合的事前波动率。与对*B*4*B*因子进行单位化贝塔值调整一样，我将这两个组合按比例调整至目标波动率下
    的情形。*r*_*L*和*r*_*H*分别代表第一个和第五个波动率组合的回报率。我将目标波动率*σ*_*target*设为15%。


