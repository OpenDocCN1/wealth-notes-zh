- pgno: 12
  md: '# 前 言


    投资中最重要的词便是不景气时期（bad times）。


    上述概念——即不景气时期至关重要——是本书的指导原则，也是基于半个多世纪的金融理论支持而来。本书提供了一种“以系统性方法来解析如何打理好你的资产”这一老生常谈的问题。作为金融学教授和主权财富基金、资产管理公司及其他金融企业的咨询顾问，以往的经验让我认识到，仅专注于资产类别的狭义方法（通常采用均值-方差优化器）显得过于粗糙，忽视了资产为何能带来收益的经济学逻辑，而且最终对于充分满足投资者需求而言成本也太高。与之不同的是，我专注于“因子风险”（即跨越各类别的一
    系列不景气时期集），如果想战胜市场动荡并获得相应的补偿，那么因子风险就应该是我们关注的重中之重。


    根本问题在于，资产所有者——从中等家庭到受托掌管国家储蓄的主权财富基金——通常感受到不景气时期带来的痛苦程度远高于景气时期所带来的喜悦程度。不同的投资者根据其债务水平、收入流、约束条件、投资理念以及他们对不同种类风险的感知和承受能力，对不景气时期有着不同的定义。不景气时期并不仅仅局限于财富遭受损失时：如果你的消费水平下降至习惯性消费水平之下，或者如果你的竞争对手创造了比你的投资组合更好的收益，那么即使你仍然富有，也会面临不景气时期。随着投资者经历其生命周期的不同阶段以及在长投资期动态地进行投资，投资者所面临的不景气时期集也可能有所改变。最优组合配置需要考虑投资者的不景气时期，并接受这些不景气时期带来的风险，以获取不承担风险就无法获得的因子溢价作为补偿。持有多元分散化投资组合有助于减少不景气时期的影响，因为有些资产可能在不景气时期反而有更高的收益。这概括了本书第一部分的内容。'
