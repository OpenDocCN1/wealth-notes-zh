    然而，Scott和Hercovici并没有立即被这些数字和Jacques热情洋溢的陈述所打动。这种低波动率投资策略是否适合GM？GM资产管理公司通常严格紧密地监控各投资策略的跟踪误差，而Martingale低波动率策略相对于罗素1000指数的历史跟踪误差为6.16%，相对较高。GM资产管理公司采用的其他美国股票策略的跟踪误差通常低于6%。GM资产管理公司全球公开市场业务的董事总经理Scott，坚持认为股票部门需要对冲如此高的跟踪误差所带来的风险，或者要说服投资委员会更改投资基准。然而，对于GM而言最为重要的是匹配养老金的负债。作为GM全球股票策略的组合经理，Hercovici认为“低波动率策略在两方面与GM试图降低养老金盈余波动率的投资方向是吻合的：一是低风险，二是与养老金负债的相关性较高”。


