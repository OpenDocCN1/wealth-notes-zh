  md: '机构投资者同样也未能充分地分散化。Jarrell和Dorkey（1993）详细叙述了罗切斯特大学捐赠基金资产下滑的情况。1971年，罗切斯特捐赠基金的规模为5.8亿美元，位列全美第四大私立大学捐赠基金。到了1992年，它在私立大学捐赠基金中排名第二十位。这期间发生了什么呢？从1970～1992年，该基金的年回报率只有7%，而一个经典的60%/40%股票—债券组合的年回报率约为11%。如果罗切斯特大学简单地投资于这种基金组合，该捐赠基金1992年时就能在私立大学捐赠基金中排名第十位。截至2011年，罗切斯特大学已经滑落至第三十名的位置¹。罗切斯特大学表现不佳的一大原因就在于对本地公司（尤其是2012年申请破产的柯达公司）过度集中的投资。


    波士顿大学（Bostan University）是另一个失败案例。在20世纪八九十年代期间，波士顿大学大规模投资于本地一家私有的生物科技——Seragen
    Inc。据Lerner、Schoar和Wang（2008）研究称，波士顿大学在1987至1997年期间向Seragen提供了至少1.07亿美元资金——考虑到1987年该校的捐赠基金只有1.42亿美元，这属于一笔巨款。尽管Seragen后来成功上市，但屡遇挫折。1997年，学校所持的股份仅价值四百万美元。Seragen最终被Ligand
    Pharmaceuticals公司于1998年以3000万美元收购。


    相反，挪威主权财富基金正是从分散化中获利而成立。通过其主权财富基金，挪威将一项高度集中化的资产——石油——转变为分散化的金融投资组合，从而提高了风险收益比。


    # 2.6 本土偏好


    均值—方差投资建议投资者永远不要持有一个100%美国股票的组合。许多投资者不会利用国际分散化的优势，而是只持有本国资产。这就是本土偏好（home bias）之谜²。


    本土偏好的一个衡量标准是看本国投资者的股票仓位构成与全球股票市场组合有多大差异。全球市场是一个分散化的组合，根据CAPM模型（它将均衡条件加入到均值投资理论框架中（参见第6章）），这是投资者应该持有的最优组合（在之后的第5节我会论证，相比其他的均值—方差分散化组合，市场组合表现优秀）。Ahearne、Grieber和Warnock（2004）做了如下对比：美国投资者的组合中仅有12%的非美资产，而全球市场组合中非美资产的比例约为50%。本土偏好不是美国特有的现象。Fidora、Fratzscher和Thimann（2007）报告称：英国投资者的组合中外国资产的比例为


    ① 只统计私立大学捐赠基金。采用的是NACUBO在2011财政年末的数据。


    ② 关于文献综述，参见Karolyi and Stulz（2003）以及Lewis（2011）。'
