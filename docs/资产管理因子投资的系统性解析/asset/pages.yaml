  md: '子择时上输得精光¹。先锋集团（Vanguard）的前首席投资官George “Gus” Sauter指出，“我们有数据表明，对于界定范围较窄的投资，投资者不是在市场上行时投资，他们往往是在最高点集中涌入然后跟随市场一起下行。”仅对因子策略做初始配置是不够的，投资者还应该坚持做再平衡。


    # CAPM


    CAPM模型能较好地说明这一过程如何实现²。根据CAPM模型，投资者应该持有市场组合和无风险短期国债，如图14.6所示。将短期国债和市场组合的不同组合方式画出来就可以得到资本配置线（CAL），短期国债头寸可由y轴的截距表示，市场组合则由图中的圆点所示。投资者持有资本配置线上的组合。有一个特别的投资者会持有100%的市场组合（即市场先生）。如果投资者比市场的风险厌恶程度更高，那么投资者会持有低于100%的市场组合，即持有CAL线上位于市场组合左侧的组合。如果投资者比市场的风险厌恶程度更低，那么投资者会对市场组合加杠杆，并做空短期国债。这种情况下，投资者组合将位于CAL线上市场组合的右侧。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_477_0.png)


    风险厌恶程度高于市场先生的投资者，将获取比市场更低的平均收益。上述投资者能接受这点是因为他们的风险厌恶程度更高，所以他们愿意牺牲更高收益而追求低


    ① 2012年全球投资峰会上与Sauter的私人谈话。引用来源于Clark，K.，“Listen up，Bond Investors：Vanguard Investment
    Chief Gus Sauter Sees Low Returns Ahead for Some of His Most Popular Products”
    ，CNNmoney.com，2012年12月。


