  md: 'Huffet的HML贝塔值（βL HML）为正。平均而言，价值股表现优于成长股。相对于CAPM模型，Huffet的预期收益上调了βL HML × E（HML）。由于HML
    被构建为具有正的风险溢价（该因子做多高账面市值比股票，即高收益的价值股，并做空低账面市值比的股票，即低收益的成长股），Fama-French模型将Huffet的风险溢价略微上调，以体现其“价值性”。


    现在再来看一家成长型公司Inron，该公司通过一系列并购而快速成长。Inron的HML贝塔值为负。由于βL HML × E（HML）现在为负值，所以Inron的预期收益相对于CAPM模型有所下调；因为Inron是成长股，而非价值股，所以其收益相应较低。


    Fama-French模型中，SML和HML的贝塔值基本在零附近。市场实际上是规模中性和价值中性的。正如平均投资者持有市场，平均股票也并无规模或价值倾斜，而仅有市场敞口。此外，CAPM模型中股票的平均贝塔值为1，这也是市场的贝塔值。市场本身可能会受到宏观因子的影响，如GDP增长、通货膨胀以及前面章节所讨论的其他因子。Fama-French模型（公式7.2）对价值股如Huffet和对成长股如Inron的定价都是相对于市场而言。


    CAPM模型和Fama-French模型的一个重要假设即贝塔是不变的。实证研究表明，有些资产的系统性因子敞口会随时间而变化，尤其是在不景气时期会有所上升¹。贝塔自身的变动也可以是一种风险来源。与假设贝塔不变的情形相比，不景气时期贝塔上升的情形毫无疑问会导致金融危机时期风险资产的负收益更大。


    # 3.2 规模因子


    规模效应是由Banz（1981）发现的，与Reinganum（1981）的研究有相似结论，即在调整相应的贝塔值后，小盘股的表现通常优于大盘股。但这可能已经是过去式了，因为从20世纪80年代中期以后规模效应便不再显著。


    图7.5展示了在消除市场效应后，将初始1美元投资于SMB策略的收益情况（从1965年1月开始至2011年12月），如图中实线所示²。SMB策略的累计收益在20世纪80年代早期达到最高——正好在Banz和Reinganum的早期研究发表之后；而20世纪80年代中期开始，调整市场敞口后的小盘股溢价就不再明显。20世纪80年代中期之后，国际上的相关验证结果也不显著。Dimson,
