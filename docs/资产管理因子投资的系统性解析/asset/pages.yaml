  md: '则不会因为因子本身业绩不佳所造成的损失而惩罚管理人。


    如果资产所有者选择对其部分组合设定因子敞口，那么他们也会受益于显性的因子基准。丹麦最大的养老基金ATP集团，负责为大部分工作的丹麦人提供养老金。ATP将其金融资产划分为对冲组合和投资组合，对冲组合被用来匹配该基金的负债，而投资组合的目标是“创造能充分保持养老金长期购买力的绝对收益”$^{①}$。投资组合又被划分为不同的风险类别：利率、信用、股票、通胀挂钩资产以及大宗商品。ATP对上述因子进行再平衡以维持大致的风险配置（ATP实践采用了一种风险平配的形式，参见第3章）。ATP也进行因子择时操作。因子基准使得ATP能够进行逆周期投资，所以当一种因子策略变得有吸引力时其因子敞口会相应上升。


