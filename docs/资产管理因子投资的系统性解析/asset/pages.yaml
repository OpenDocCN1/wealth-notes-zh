  md: '48%。由于劳动收入在一定条件下类似股票，所以年轻人最好持有较低比例的股票资产。


    # 3.6 其他考虑因素


    如果劳动收入类似股票风险较大，生命周期模型就会得出令人惊讶的结论：随着年龄的增加，应该持有更多股票（我重申一下：这与金融规划师的标准建议相反）。然而，其他一些情况可能支持投资者在接近退休时应该减少持有股票。或许最重要的是以下几点。


    健康风险（Health-Care Risk）


    健康风险冲击可以令人非常虚弱。医疗服务昂贵，而且此项支出主要集中在老年。Marshall, McGarry和Skinner（2010）研究报道称，美国人生命最后一年的医疗支出中位数超过了5000美元，并且前5%超过了50000美元。医疗费用的均值和方差都会随着年龄增长而增加，特别是在老年人群中。健康风险冲击不是意味着仅一次性的医疗费用增加。一个严重的疾病往往紧跟着更多疾病。De
    Nardi, French和Jones（2010）将医疗支出分解为持续性部分和暂时性部分，并证明持续性部分每年的自相关性超过90%。


    健康风险不仅仅关乎能否支付医疗账单。严重的疾病意味着一个工作家庭失去现在的收入和未来的收入。不好的健康风险冲击之后会伴随财富和未来劳动收入的大幅减少$^{\text{①}}$。疾病通常会成一个恶性循环：疾病会影响收入，更低的收入又会导致更差的健康状况。


    有些医疗支出可以由保险支付或者部分由政府支付（Medicare和Medicaid）。但在美国，很多医疗费用都是由个人支付。Munnell等（2008）估计从65岁起的个人自付医疗支出的现值（不包括长期的护理费用）高达人均100000美元。Webb和Zhivan（2010）估计的数字更高，一对年龄65岁的典型夫妻的医疗支出是260000美元。而该支出的分布非常不对称，有5%的可能性这对夫妻会花费超570000美元。在美国许多个人都没有保险——根据统计
    bureau数据，年收入在25000美元至49000美元之间的美国人有21%没有健康保险。在25~35岁之间的美国人有近20%没有健康保险$^{\text{②}}$。


    个人可以通过持有安全资产来应对这种需要个人自付的健康风险冲击，并预防糟


    +   ① Poterba, Venti and Wise（2011）对相关的大量文献做了综述。


    +   ② 参见Rampini and Viswanathan（2013）。'
