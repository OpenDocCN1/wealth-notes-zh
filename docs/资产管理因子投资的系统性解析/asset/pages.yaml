  md: '虑个人财富中最大、流动性最差的部分，即人力资本（参见第5章）。对于有钱的投资者来说，非流动性资产同样占据其投资组合的很大一部分。美国的高净值人士将投资组合中的10%配置于“珍宝”资产，例如具备收藏价值的艺术品和珠宝。这类资产在其他国家的高净值人士投资组合中占比上升至20%<sup>①</sup>。


    在过去的20年里，非流动性资产在机构投资者的组合中占比显著增加。根据全美高校经营管理者协会（National Association of College
    and University Business Officers, NACUBO）的报告，2011年大学捐赠基金平均持有另类资产的比重超过25%，而20世纪90年代初大约只有5%。养老基金也有类似的趋势。1995年，流动性差的另类资产在养老基金投资组合中占比不足5%，然而现在这个数据已接近20%<sup>②</sup>。


    # 流动性枯竭


    许多正常情况下流动性充足的资产市场不时会出现流动性不足的问题。在2008～2009年金融危机期间，通常具有充裕流动性的商业票据（或货币市场）也会因为投资者不愿以任何价格进行交易而遭遇“买家罢工”。这不是货币市场第一次经历冻结：1970年宾夕法尼亚州中央铁路公司破产时商业票据也停止了交易。在这两种情况下，都需要由美联储出面重建流动性，恢复货币市场。


    金融危机期间，债券回购市场（允许投资者卖空债券）、住宅及商业地产抵押贷款支持证券、结构化信用产品以及拍卖利率证券市场（浮动利率市政债市场；参见第11章）也出现了流动性枯竭。最后一个例子是2008年金融危机时期出现流动性匮乏的首批市场之一，直到我撰写本书时的2013年，该市场仍处于冻结状态。以现有形式存在的该市场已经失效。


    流动性危机时常发生，这是因为资产流动性在严重的市场困境中趋于枯竭。20世纪80年代的拉美债务危机，90年代的亚洲新兴市场危机，1998 年的俄罗斯违约危机以及2008～2009
    年的金融危机都有一个共同的特征，就是流动性急速下降，甚至在某些市场中流动性有时完全消失。大型的流动性危机至少每10年会发生一次，且往往伴随着资产市场的大幅下滑。


    # 2.3 小结


    非流动性资产类别作为一个整体，其市场规模要比传统的流动性充足的公开市场


    ① 参见 “Profit or Pleasure? Exploring the Motivations Behind Treasure Trends”，Wealth
    Insights, Barclays Wealth and Investment，2012。


    ② 参见Towers Watson（2011）所著全球养老金资产研究（Global Pension Asset Study）。'
