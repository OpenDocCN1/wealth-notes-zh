    # ## 4.6 投资者是否做到高效节税呢？\n\n答案是：没有。\n\n节税配置意味着，我们应该会发现投资者在税收递延账户中持有高税率资产（比如企业债和国债），在应税账户中持有低税率资产（比如股票）。但是投资者一般不这么做。Poterba和Samwick（2002）、Bergstresser和Poterba（2004），和其他研究发现，投资者在应税账户和税收递延账户的资产配置结果非常类似。超过1/3的美国投资者可以通过将高税率资产转移到税收递延账户来减少税负，反之亦然。数据显示，更富裕的家庭（通常税负更重）节税效率更高，但并没有达到他们应有的节税水平。\n\
    \nConstantinides的税收时机选择意味着投资者应该准备好实现损失和递延收益。投资者往往反其道而行之。Barber和Oleean（2003）发现，投资者实现的收益远远超过他们实现的损失，他们还在应税账户中投资大量债券。Barber和Oleean也指出投资者远远没有做到充分节税。\n\
    \n对于很多个人投资者来说，一个十分重要的问题是，他们是应该将储蓄用于提前还清抵押贷款，还是应该存入税收递延账户中？两种方式都能享受一定的税收优惠：支付的按揭利息可在税前抵扣，而养老金储蓄享受免税待遇。那么对于家庭而言应该在哪里投入那额外的1美元：是还清贷款还是投入养老基金？Amromin,\
    \ Huang和Siam（2007）给出的答案是，如果你有一个比较低的（理想情况下已经完成再融资的）抵押贷款利率，你不应该提早还清贷款；相反地，应该将钱存入养老基金。这样的话，你享受了抵押贷款利息税前扣除的好处，同时还通过养老基金赚取消税回报（参见公式（12.6））。不过现实生活中大多数家庭反其道而行之，这可能是因为他们不愿意成为金融市场中的贷款人或借款人；莎士比亚的格言“别借钱，莫放债”（neither\
    \ a borrower nor a lender be）让他们付出了金钱代价。\n\n但愿你在阅读完本章后，你的投资组合会更加节税。\n\n> ① 参见Saunders,\
