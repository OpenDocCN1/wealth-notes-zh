- pgno: 298
  md: 'Term Securities Lending Facility），定期拍卖工具（TAF，Term Auction Facility）。美联储从未使用过MMIFF。奇怪的是，美联储并没有将住房抵押债券购买计划用某些首字母缩写字来命名。此外，美联储也会向一级交易商的附属机构和银行贷出资金，包括摩根大通、花旗银行以及美国银行。


    自从金融危机以来，美联储非常激进地扩大了其资产负债表的规模，买入了大量的风险资产。图9.7可以看到美联储资产负债表在2008年9月后呈爆发式增长，在2012年4月时规模达到约3万亿美元。传统的普通国债规模下降，而住房抵押债券规模达到了约1万亿美元。


    我们将非常规政策定义为购买除国债外的风险资产，对于这些非常规政策而言，若想在美联储停止购买后仍能对市场产生长期的效果，需要满足以下条件之一：一是可以改变投资者的预期或投资者所要求的风险溢价，二是诸多市场必须是分割的，即当美联储改变一个市场的价格或收益率曲线时，其他市场不会随之发生变化。市场分割理论的雏形是Culbertson（1957）中的“优先置产理论”（Preferred
    Habitat Theory），以及Modigliani和Sutch（1966a，1996b）中的“客户模型”（Clientele Model）。该理论的最新成果是Vayanos和Vila（2009）。


    在Vayanos和Vila的模型中，构建了市场上的两类投资主体。一是优先偏好投资者，他们对于某些期限的债券有特定的偏好。例如，养老金偏好长期国债，因为他们必须对冲其长期债务。二是套利者，例如对冲基金和（现已被削弱）投资银行的自营交易团队，他们可以对于整条收益率曲线的任一部分建立投机性仓位。美联储购买长期债券的行为会对长期债券产生冲击，套利者可以通过调整曲线上不同债券的组合缓和这种冲击，但是对于只持有长期债券的优先偏好投资者而言，美联储的购买行为会对他们产生永久性的冲击，因为这种行为改变了这些长期债券的供给。因此，资产管理者在进行固定收益投资时可能需要考虑到相对供给发生变化的影响。


