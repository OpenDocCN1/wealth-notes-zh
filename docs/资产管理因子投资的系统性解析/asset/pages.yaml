    ```

    r_{t+1}^{ex} = r_{t+1} - [\beta_{SPY, j} SPY_{t+1} + \beta_{SPYV, j} SPYV_{t+1}
    + \beta_{SPYG, j} SPYG_{t+1}] / r_{t+1}^{bench}

