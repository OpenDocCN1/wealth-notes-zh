  md: '会买入更多的终将消失且毫无价值的资产——这是财富毁灭，而不是财富创造。只有针对长期存在的资产实施再平衡时才能获得再平衡溢价，所以我们要针对非常广泛的资产类别和策略进行再平衡：包括全球股票、全球主权债、全球公司债、房地产、大宗商品等，而不是针对个别股票或是个别国家。


    # 5.2 非常长期（The Very Long Run）


    在非常长的期限中，能够最大化财富的是一个实施再平衡的组合，该组合持有能够最大化再平衡溢价的恒定资产权重。这个最大化长期增长的策略被称作凯里法则，可以通过找到最大化单一投资期对数收益率的组合来获得。因该组合使得（非常）长期财富最大化，它也被称为最优增长组合（Optimal
    Growth Portfolio）。


    在充分长的时间跨度下，凯里最优增长组合优于其他所有组合$^{①}$。那么对于非常长期的投资者而言，如果最优增长组合能最大化非常长期的财富，我们是否应该持有该组合呢？答案是否定的。Samuelson在20世纪70年代解决了这个问题，但它还是时不时被对此并不信服的人提出来$^{②}$。1979年，Samuelson写过一篇俏皮的文章来回答这个问题，文章完全使用单音节词汇，题为《为什么尽管我们有足够长的年限进行操作，仍然不应让财富的对数平均值过大》（Why
    We Should Not Make Mean Log of Wealth Big though Years to Act Are Long）（并不令人意外的是，由于采用的是单音节词汇，文章读起来颇为费劲）。


    在单一投资期模型中，你可以通过持有最大化预期对数收益率的组合来使得组合的增长率最大化。但是你是否拥有对数效用函数呢？或许没有。与拥有对数效用的投资者相比，你对风险与收益的权衡取舍并不相同，因此持有针对你自身风险厌恶程度和效用函数的最优组合会让你获益更多。长期来看，通过遵循凯里法则，你的表现会更好。但是，这样做存在风险，而你也许不能承受这种风险。而且凯里法则所指的长期可能是非常非常长。正如Keynes的名言，“长期来看，我们都终将死去。”


    综上，请采纳Merton–Samuelson的建议，而不是凯里法则。在广泛的资产类别和策略中，找到对于你自身最优的单一投资期组合持仓，并坚持再平衡至固定权重。这在收益率服从独立同分布的假设下是最优的，并且它将为你带来再平衡溢价。如果你能够很好地预测收益率，你还可以持有一个长期机会型组合。


    +   ① 正式的数学表达是，存在一个基于目前财富W的数值M（W），使得对于所有$T\succ M（W）$，使用了凯里法则的P$_{T}$（W$_{T}$）一定严格小于未使用凯里法则的P$_{T}$（W$_{T}$≤W）。因此当$T\to\infty$时，凯里法则优于其他任何法则。


    +   ② 参见Samuelson（1971）、以及Merton and Samuelson（1974）。'
