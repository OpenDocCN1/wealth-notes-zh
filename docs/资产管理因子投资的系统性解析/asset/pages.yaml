- pgno: 356
  md: '现在我们来考虑那些受到跟踪误差限制的只能做多的投资者，即限制了他们可偏离基准进行投资的程度（参见公式（10.3））。这类投资者不能做空。这样，他们不会投资股票A，因为尽管A相对于CAPM有更高的回报率，甚至A的表现与市场组合相当，但是投资A可能会承担很大的跟踪误差。


    那么他们会投资股票B吗？股票B的阿尔法为负值，要想盈利，他们需要做空股票B，但是他们不能进行做空操作。这样，他们能做的最多就是在自己的组合中低配（相对于市场组合）股票B，跟踪误差会限制他们低配股票B的程度。如果“Data”线不是完全水平的，而哪怕只是略微向上倾斜，那么这类投资者都会有动力去买人股票B，因为股票B的表现会比市场表现好。


    因此，跟踪误差的使用使得低波动率或低贝塔值异象很难被消除。跟踪误差对于包括GM资产管理公司在内的绝大部分机构投资者来说，都是一个硬性限制条件。一个显而易见的解决方法就是改变基准，有很多其他更合适的因子基准可供选择（参见本章第3节和第14章）。但改变GM的投资基准是一个非常耗时的内部流程，需要投资委员会的批准。正如Scott解释的，这引出了一个更宽泛的问题，即“所有投资基准是如何取决于基金的资金提拨状况（funded
    status）和母公司的财务健康程度。”


    Frazzini、Kabiller和Pederson（2012）甚至认为，低风险因子在一定程度上解释了伯克希尔·哈撒韦取得出色业绩的原因——这是一家以能做到因不从众投资和规避常见代理问题而闻名的公司。他们发现，采用我们本章介绍过的“Fama-French加动量因子”模型作为基准，如果加入BAB因子之后，那么伯克希尔·哈撒韦在1976年至2011年的阿尔法从12.5%降至11.1%。如果他們再加入另一个衡量公司基本面质量的因子，那么Buffett的阿尔法将降至7.0%。因此，Buffett的一部分投资业绩是源于挑选低风险的股票，但其投资业绩的最主要来源是找出高质量的公司——这是一项与仅持有低波动率股票无关的真正技能。


    # 偏好


    如果资产所有者仅仅是偏好高波动率和高贝塔值的股票，那么他们会推高这些股票的价格直到其回报率变低。相反地，这类投资者会规避安全的股票——那些低波动率和低贝塔值的股票——导致这些股票的价格较低，推高其回报率。因此，如果用高波动率和高贝塔值的股票来代表“希望和梦想”，那么这种对“希望和梦想”的偏好可以用来解释该风险异象
    ${ \textcircled { 1 } }$ 。


    ① 参见Boyer，Mitton and Yorkink（2010），Bali，Cakici and Whltelaw（2011），以及Ilmanen（2012）。'
