  md: '所以，劳动收入类似股票的个体，比如股票经纪人，应该做的是与“100减去年龄法则”正好相反的投资。这本书的普通读者可能在资产管理公司工作，劳动收入与股票市场高度相关，传统金融规划师的建议似乎对他们来说并不合适。


    你可能会提出反对，因为你认识一个60岁的股票经纪人在2008年经济衰退中丢掉


    了工作，且他的财富都是以股票形式持有。他遵循了生命周期理论的投资建议（可能是无意之举），但还是一下子丢掉了工作和所有财富。生命周期理论阐述的是随着时间变化应如何相应调整资产配置：劳动收入类似股票的个人，应随着年龄变老而增加对股票的配置，以维持稳定的总风险敞口——但该理论并没有说年老后他就应该大量配置股票。如第2节所示，如果一个人的劳动收入与股票高度相关，在给定其他条件不变时，他应该偏好持有更多债券。因此，根据生命周期理论，股票经纪人最好是大部分都持有债券，但他持有股票的比例（希望是小部分）可随着他接近退休而逐步增加。


    上述例子都表明了生命周期过程中关于劳动收入的一个主要直观逻辑——人力资本是种资产，我们持有金融资产时应加以调整以平衡类似债券或类似股票的人力资本。但经济学家在实际使用生命周期模型时会增加一些特征以更接近现实。我们这里抽象掉了杠杆约束、个体如何消费以及变动的负债。现在许多学生毕业时都有很高的负债——所以他们最初的净资产为负。然而，上述模型最欠缺的是，我们将年轻人的问题独立于老年人的问题进考虑。在真实的生命周期模型中，年轻人会有预见性地将其年老时劳动收入减少纳人考虑。下个例子纠正了这点，但同样的直观逻辑仍然成立。


    # 主权财富基金的例子


    主权财富基金（SWFs）相当于是—个国家的退休金计划。任何一个为了获得比大宗商品财富要多元化（且更持久）的财富而成立的主权财富基金都很像一个养老基金。正如人力资本回报与资产回报之间的相关性会驱动投资者生命周期的资产配置，大宗商品回报与资产回报之间的相关性也相应决定了SWF的资产配置。


    下面考虑一个关于SWF的简单模型¹。该模型有两期：第一期是有丰富的石油财富，第二期是资源几乎被开采殆尽。为了简化，我们将抽象掉支出法则（消费）而仅最大化最终财富的期望效用（回顾一下，这与最大化资金量不一样，因为效用函数涉及风险和收益之间权衡取舍，参见第2章）。模型中有两种金融资产：无风险债券（假定利率为0）和股票。SWF具有CRRA效用函数（即均值方差效用的学术版本，参见第2章和第4章），要决定每期资产组合中股票的持有量，分别记为α₁和α₂:'
