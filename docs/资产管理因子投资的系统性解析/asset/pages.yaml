- pgno: 350
  md: '贝塔值异象是指，高贝塔股票的风险调整后回报率会偏低。图10.10-A显示，这些组合的平均回报率基本相同，前四个组合约为15%，组合5略低，约为12.7%。贝塔值异象并不是指高贝塔股票的回报率低——高贝塔股票的回报率并不低。高贝塔股票的波动率高，这会使得它们的夏普比率低于低贝塔股票。从图10.10-A右轴可以看到，夏普比率从低贝塔等分组合的0.9下降到高贝塔组合的0.4。


    在图10.10-B中，我画出了这些组合的事前贝塔值和事后贝塔值。事前贝塔值是指在组合构建前三个月期间的贝塔值，我使用该值对个股进行排序并构建组合。事后贝塔值是指在组合建立之后三个月内已实现的贝塔值。图10.10-B将每个组合的平均事前贝塔值和平均事后贝塔值画在一起。由于事前估计贝塔值存在大量噪音，所以各组合事后贝塔值的连线比各组合事前贝塔值的连线更平缓。贝塔值是有噪音的！然而，组合事后贝塔值的最大值与最小值之差仍然大于1。


    # 同期的贝塔值与回报率


    CAPM模型并没有预测滞后的高贝塔值会带来高回报率。CAPM模型实际是说，贝塔值与预期回报率之间应该具有同期相关性。即在相同的测量时期内，高贝塔值的股票会有高回报率（参见第7章的因子理论）。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_350_0.png)


    图10.11通过给出的在每个时期（三个月）结束时构建的五个组合的平均已实现回报率和平均已实现贝塔值，用以检验贝塔值和平均回报率之间的同期相关性。有些出乎意料的是，可以看出同期的贝塔值和回报率具有正相关性①。这正是CAPM模型所预测的！


    ① 参见Ang, Chen and Xing (2006)：与早期Black, Jensen and Scholes (1972) 的研究相一致，图10.11也显示，估计的证券市场线（SML）“过于平缓”，尤其是在贝塔值较小时。'
  merge: -1
  img_proc: true
- pgno: 351
  md: '我们该如何解释，历史贝塔值与未来回报率呈负相关，而同期的贝塔值却与回报率呈正相关呢？如果我们可以在未来的贝塔值，那么未来的贝塔值应当与未来的回报率有相同走势（按照CAPM模型所预测的那样）。但是，从图10.10-B可以看到，我们很难预测未来的贝塔值。用过去的贝塔值来预测未来的贝塔值效果很差。贝塔值会有较大变动，预测时也存在较大的样本误差①。


    试图通过其他信息来估计贝塔值的相关研究发现贝塔值与回报率之间可能有正相关性。Buss和Vilkov（2012）通过期权来估计贝塔值，并发现与通过历史回报率估计的贝塔值相比，这种贝塔值对未来贝塔值的预测效果更好。这种从期权隐含信息中估计得出的贝塔值呈现出正的风险收益相关性。Cosermans等（2012）通过会计报表中的估值信息以及历史回报率来估计贝塔值，这种贝塔值与回报率也呈正相关。因此，低贝塔值异象的真正谜团并不在于贝塔值与回报率的关系，而是在于我们很难准确地预测未来贝塔值，尤其是通过历史贝塔值来预测。


    # 4.4 风险异象因子


    根据前述分析结果，很自然地，我们应该尝试在基准组合中引入反映风险异象的因子。


    反向贝塔因子（Betting Againt Beta）


    Frazzini和Pederson（2010）构建了一个“与贝塔反向”的因子（B*AB*），即做多低贝塔值的股票并做空高贝塔值的股票。构建*AB*因子时，不能简单地将两个组合的回报率相减，因为根据图10.10，各贝塔值组合的平均回报率相差很小——而各贝塔值组合的夏普比率则相差很大。Frazzini和Pederson按照如下方式构建了*AB*因子，即用低贝塔值和高贝塔值组合的超额收益除以各自的贝塔值：


    公式 (10.17)


    其中，$r_{L, t+1}$是低贝塔值组合的回报率，$r_{H, t+1}$是高贝塔值组合的回报率。$\beta_{L,t}$和$\beta_{H,t}$分别代表这两个组合在
    $t$ 时期期初的贝塔值（即事前贝塔值）。


    从图10.12中可以看到，水平的虚线“Data”表示实证中不同的滞后贝塔值组合的平均回报率基本上是相同的，向上倾斜的虚线“Standard CAPM”表示的是CAPM模


    ① Blume（1975）是最早记录了这些现象的研究之一。如需了解关于随时间而变化的超额回报、贝塔值以及它们的标准误差的路径计算的正式统计数据，参见Ang和Kristensen（2012）。'
