  md: '的损失，重要的是因子，而不是资产类别标签；第三部分，监督好委托管理人，以确保委托管理人不会给投资者带来更多不景气时期。


    本书已作为哥伦比亚大学商学院MBA课程以及资产管理高级课程的教材，作者在授课时还加上了补充材料（量化模型和数据分析）、问题讨论、案例分析等。案例分析是商学院教学的重要组成部分，因此书中每章都以知名投资机构的生动案例开篇，让人耳目一新又印象深刻。本书已被海外很多知名教授列入教材列表，他们表示该书将成为顶尖研究院校关于资产管理的标准教材，也是金融投资从业人员的必读书目。随着中国企业的国际化步伐不断加速，海外投资规模不断扩大。在中国企业“引进来”和“走出去”的大潮中，特别是在习近平总书记大力推进“一带一路”的战略背景下，“互学互鉴”，推出本书的中文版，相信不仅能帮助国内投资者构建全面的海外投资知识体系，了解国际投资动态和前沿，还有助于国内投资者更理性和深刻地看待资产管理和组合配置，并根据本书的理论框架更有效地做出投资决策。


    译者由衷地希望能与更多中国读者分享国际投资界的前沿话题，所以力荐并牵头组织翻译了本书。在此，要特别感谢中国投资有限责任公司的领导和同事们，没有他们的支持和鼓励，译书难以成形。感谢翻译团队成员在繁忙的工作之余承担了相应章节的翻译和审阅工作，他们都是奋战在海外投资第一线的专业人士。本书由肖莅翻译第1章和第12章，文潇翻译第2章、第3章和第4章，文雪婷翻译第5章和第10章（前两节），隆娟洁翻译前言、第6章、第7章、第14章和作者简介及附录等，秦小深翻译第8章和第15章，谭晓翻译第9章、第10章（后三节）和第11章，王焱翻译第13章和第18章，廖晗翻译第16章、第17章和后记。非常感谢我的老同事谭晓（现任南方基金海外固定收益投资经理）和秦小深，他们在繁重的工作之余还承担了相关章节的复审工作。非常感谢校稿老师对本书的审校工作。最后当然要感谢中国发展出版社的领导和编辑，感谢他们的热忱和大力支持！


    虽然我们竭尽全力并在翻译过程中做了大量的校对，但由于时间和水平有限，译稿难免存在不足和遗憾之处，恳请广大读者和同行批评指正，并对我们的不足提出宝贵意见和建议，以便我们进一步完善。


    隆娟洁


