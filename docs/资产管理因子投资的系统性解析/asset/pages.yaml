- pgno: 240
  md: '以及货币政策。第8章和第9章分别涵盖了股票和固定收益，我们将进一步阐述这些风险是如何被定价的$^{1)}$。


    # ## （ 2 ）人口结构风险


    对于长期投资者来说，另一个重要的风险是人口结构风险。这可以理解为对劳动力产出的冲击，就像生产率冲击是对企业生产的冲击。人口结构是经济学代际交叠（overlapping
    generations，OLG）模型中一个缓慢变化的变量。如我们在第5章所讨论的那样，个体会遵循生命周期模型。我们会逐步经历青年、中年、退休阶段的个体为例。劳动收入的赚取和储蓄仅发生在青年和中年阶段，而退休后储蓄会逐步消耗。随着任一年龄群组逐步经历上述三个阶段，他们会与前面世代出生的其他两个年龄群组的人共同生活。因此，在任何时期都有几个世代的人相互交叠。人口结构冲击是指由于某些事件的出现，导致某年龄群组的人口较之于其他年龄群组发生了结构变化，比如战争（第一次和第二次世界大战），婴儿潮（“二战”后二十年出生的大量婴儿）或者传染性疾病（1918年西班牙流感）。


    有些OLG模型预测指出人口结构会影响资产的预期收益，理论表明这主要有两大途径。一是，OLG框架下的生命周期平滑效果要求当青年和中年人人口占比偏低时，占比相对较高的退休人群会对消费有超额需求。退休人士通常不愿意持有金融资产：实际上他们往往通过卖出金融资产来获取资金用于消费。对于卖出金融资产较多的市场，资产价格必然回落$^{2}$。Abel（2001）运用这一直观判断预测，随着婴儿潮一代人的老龄化，股票价格将有所下降。然而，该预测仍有争议：例如Brooks（2002）的研究则认为婴儿潮对资产价格的影响很小。二是，由于不同年龄群组的人具有不同的风险特征，人口构成能预测股票收益的机制在于：资产价格会随着经济体的总风险特征改变而变化。Bakshi和Chen（1994）通过其有影响力的研究表明，随着人们年龄增长，其风险厌恶程度上升，因此总人口的平均年龄上升时，股票的风险溢价应该增加。


    在检验人口结构风险与资产收益关系的研究中，采用国际数据开展研究非常重要；仅采用单个国家的人口统计数据很容易令人质疑，因为人口结构的变化非常缓慢。运用跨国数据分析的研究包括Erh，Harvey和Viskanta（1997），Ang和Maddaloni（2005），Arnott和Chaves（2011）。已有令人信服的国际实证研究表明，人口结构会影响资产的风险溢价。


    1) 尽管大多数DSGE模型不研究这些风险如何影响资产价格，但最新模型如Rudebusch and Swanson (2012) 对此进行了研究。


    2) 这是如Genakoplos，Magill and Quinzi (2004) 研究中的主要经济机制。'
