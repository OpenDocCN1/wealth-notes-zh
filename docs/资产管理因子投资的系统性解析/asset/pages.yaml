  md: '基金公司（Alaska Permanent Fund Corporation），其资金来源于矿物租赁收入和矿区使用费。⁽¹⁾根据对不同宏观因子风险的反应，阿拉斯加基金将资产类别划分为不同组。公司敞口类包括股票，股票通常“会受益经济增长和繁荣时期”。公司债也属于公司敞口类——而不在单独的固定收益配置中。第9章指出，很多影响股票的因素也会影响公司债——如果一家公司表现不佳，其债权人和股权人都会受到影响。相应减去美国短期国债收益后的公司债收益和股票收益的相关性很高：股票与投资级公司债的相关性为48%，与高收益债的相关性为65%。阿拉斯加基金不将公司债和股票视为单独的资产类别，因为它们对宏观风险的反应一样。


    阿拉斯加基金有意思的另一原因，是其遵循本书第4章提到的Merton（1971）模型对长期投资的论述。阿拉斯加基金有一个投资类别叫特殊机会，其目标配置是18%。长期投资者会持有对短期投资者而言最优的组合，这被称为短视组合（myopic
    portfolio）；也会持有机型组合（Merton称其为长期对冲需求组合），即长期投资者会充分利用随时间变化的预期收益。当有困境资产特殊投资项目时，或者有好的非流动性投资机会时，阿拉斯加基金能利用这些机会因为其投资期较长，这些投资归于其特殊机会资产配置。如果市场上没有此类有吸引力的投资机会，那么尚未投出的配置就会归于公司敞口资产类别中。


