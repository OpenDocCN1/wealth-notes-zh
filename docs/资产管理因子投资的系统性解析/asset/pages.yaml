- pgno: 74
  md: '差异曲线与y轴的交点代表了正收益和零波动率，即无风险资产。因此，我们可以通过追踪无差异曲线从风险性资产头寸到与y轴相交的截点来寻找确定性等价。


    图2.7画出了波动率策略的均值和标准差，用正方形符号表示，并画出了 $\gamma=3$ 的波动率策略投资者的无差异曲线。波动率策略的确定性等价是6.45%。这意味着，如果投资者放弃投资1美元在波动率策略，他需要为那1美元得到6.45美分的补偿，波动率策略就相当于6.45%的无风险回报率。确定性等价也被称为支付意愿（Willingness
    to Pay）。资产所有者愿意为每1美元的财富（无风险）支付6.45美分，以获得与投资于波动率策略（有风险）相同的效用。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_74_0.png)


    均值一方差效用在计算确定性等价时忽略了波动率策略负偏度较大的特征。波动率策略的均值和标准差与股市几乎相同，所以标普500指数的确定性等价也与其相似。


    当我们用均值一方差效用计算确定性等价时，我们利用了公式（2.4）中均值一方差效用函数所蕴含的经济学意义。在公式（2.4）中，效用水平本身便是确定性等价的值。也就是说，均值一方差效用表示的是基数值（Cardinality），不同于第2节中预期效用函数表示的只是序数值。


    确定性等价的值在投资组合的选择中非常有用。例如，可以用于衡量非分散化投资的成本（参见第3章），计算非流动性资产的持仓成本和利用确定性等价来估计非流动性溢价（参见第13章），以及估算投资者在锁定期内放弃从对冲基金撤回资本的权利所要求的补偿（参见第17章）。'
