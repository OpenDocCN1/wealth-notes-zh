  md: '# 1. 激进被动投资的挪威基金


    2008～2009年金融危机期间，挪威主权财富基金的业绩表现令人震惊。官方名称为挪威政府全球养老基金（Norwegian Government Pension
    Fund - Global），这家基金成立于1990年，旨在对从北海的油气储备获得的国家收入进行投资。2012年底，挪威基金的规模高达6500亿美元，或按挪威人口估算人均逾130000美元。该基金的规模比挪威的年度经济产出还要大。


    挪威基金的收益在2007年初时还保持着较好的势头。图14.1展示了2007年1月至2009年9月该基金的累计收益，包含了金融市场崩塌的最坏时期。随着次级抵押贷款价格的下跌，市场自2007年夏天开始出现一些波动和负收益
    $ ^{①} $ ，并于2008年开始崩塌式下跌。图14.1显示，雷曼兄弟破产一个月以后，该基金从2007年初到2008年10月的累计收益为-17%。得益于华盛顿面大力救助银行体系和其他主要机构，挪威基金在2008年12月终于获得正收益。由于政府救助手段不够充分，2009年一季度市场再次急速下跌，政策制定者采取了进一步方案来稳定金融体系。2009年2月是累计收益的最低点，图14.1显示为-22%。此后，基金收益逐渐回升。


