    共同基金的业绩费必须对称地围绕着某个选定的基准，这个基准被称作费率支点 （fulcrum fee），必须充分披露²。在实践上，业绩费用也设有上限和下限。法律上排
    除了不对称合同，例如权奖奖金或类似期权的费用。第15章内容显示使用这些费率形


