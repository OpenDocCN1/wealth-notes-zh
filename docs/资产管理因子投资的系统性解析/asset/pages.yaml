  md: '我在此仅补充几点对此书部分章节的观察及看法。


    Andrew Ang对组合再平衡的论述无疑是当代大型投资基金最重要的组合配置与组合管理手段。在选股策略和择时策略（含因子轮替）这两种获取超额收益方式的效果均不彰显（西方各主要市场数十年的数据观察结论一致）的情况下，组合再平衡成为机构投资者最为可靠的、低成本的超额收益来源，这在市场急剧动荡时期尤为如此。值得注意的是，再平衡所依据的是流动性高、透明度高且长期存在的资产，如标普股指及美国国债。若使用流动性差、交易成本高或者与股指无负相关性的其他资产，其结果可能与现代组合管理理念的组合再平衡是南辕北辙的。


    Andrew Ang先生也在“对冲基金”一章中解释了他为何认为对冲基金不应该被看作是一个单独的资产类别。因为对冲基金大多都与各类风险资产存在有高度且不确定的正相关性，其内含因子时常难以量化及控制，且与机构投资者组合中的因子重叠或冲突，再加上其长期收益差，所以是否应包含在机构组合之中应该慎重考虑。值得注意的是，就在本书抒样的2014年，作者在书中严厉批评的加州公务员退休基金（CalPERS）决定全面撤出所有对冲基金及其他杠杆化操作的基金如风险均衡策略，这是一个明智的决定。


    Andrew Ang对实际资产如房地产等在投资组合中的地位的论述也耐人寻味。作者和一些中介机构一样，认为实际资产的风险和收益特征可以用同类上市公司的股票或债券的市场表现进行解释甚至复制。另一流派则认为，对于实际资产而言，一般流动性股票的因子并不能涵盖实际资产的主要风险特性，如利率及杠杆率的变化、非流动性溢价、信息不对称性、地方特质（location）判断、现金流质量等价值驱动元素。如此说来，房地产与房地产公司股票、REITs都不属于同一资产类别，甚至有人认为集中持有的、贝塔值接近1的可口可乐股票与标普股指也不是同一资产类别。这一流派的代表包括沃伦·巴菲特（Warren
    Buffett）和他的老师本杰明·格雷厄姆（Benjamin Graham）。在20世纪50年代初，马科维茨创立现代组合理论时，巴菲特正在和格雷厄姆研习对价值分析的方法，而中国则刚刚关闭了上海股票交易所。


    我上次见到Andrew Ang是在2015年，那时我即将从中投公司任上退休，而Andrew则刚刚转入业界，和诸多经济学家、金融学者一样，加入了资产管理的行列，其中包括诺贝尔经济学奖获得者索洛（Robert
    Solow）、默顿（Robert Merton）、斯科尔斯（Myron Scholes）、布莱克（Fischer Black）等，当然也包括曾创立一家对冲基金的马科维茨本人，还有我30年前刚刚从业时的朋友如拉康尼克肖（Josef
    Lakonishok）、波迪（Zvi Bodie）等人。正是这些学者把资产管理这个行业，尤其是各种量化组合不断推向新的高峰，而美国的在管资产规模早已超过20万亿美元大关。'
