  md: '定惰性，以至于他们并未完全修正其组合由于被动地“买入并持有”所带来的变动。相比之下，Brunnermeier和Nagel（2008）研究表明，对于美国家庭来说，决定他们资产配置方式的最主要因素是惰性，而非再平衡。（或许平均而言，瑞典居民比美国居民更明智。）家庭投资从固定的资产配置比例开始，资产权重会随着各项资产实现的收益和损失而发生变化。再平衡会发生，但存在时滞问题。


    机构投资者常常无法成功进行再平衡操作。在2008～2009年期间，很多养老基金和基金会放弃了再平衡策略并进行恐慌性抛售，其中CalPERS尤其引人注目。CalPERS的股票头寸从2007年的超过1000亿美元，缩水到2009年的380亿美元①。CalPERS非但没有进行逆周期的再平衡，反而是进行顺周期操作，恰好在股价达到最低点——即预期收益率最高时卖出股票。CalPERS未能实施再平衡的部分原因在于不够充分的风险管理，特别是针对流动性风险的管理。另外，由于董事会成员和委托基金管理人之间的结构错配，CalPERS也没有在股价较低时买入股票。这属于代理问题（Agency
    Problems），我将在第15章中讨论。CalPERS的确有一份投资政策声明，即个人投资者IPS的“机构投资版”，但它并没有帮助CalPERS在金融危机期间进行再平衡。CalPERS要么是不相信IPS，要么是没有最优地使用它。


    与CalPERS相反，挪威主权财富基金在2008～2009年期间进行了再平衡操作。它在股价较低时从其他投资者手中（例如在错误时间进行抛售的CalPERS）买入股票。挪威基金采用符合自身特点的尤利斯契契约：即财政部和国会决定再平衡规则，而不是由委员会来决定。该策略由基金管理者（即挪威央行投资管理公司，NBIM）自动执行，以保证决策权不会落到那些被恐惧、害怕或自大所动摇的委员会成员手中。


    # 再平衡区间


    在实施再平衡策略时，我们需进行一些技术层面的考量。理论上讲，再平衡应该在有规律的时间区间内进行：在图4.5和图4.6中，再平衡是每季度实施一次②。但是在实际操作中，如果股票组合权重在季度末是61%，考虑到交易成本，投资者是否应该把这很小的1%调整回60%的目标呢？


    最先进的再平衡策略是择机而定的，而不是死守日历进行操作。最优的再平衡策略应当在偏离最优权重的效用损失和再平衡的交易成本之间权衡取舍。如果再平衡的收益超过成本，那么这是再平衡的最优时点，再平衡成为一个择机而定的事件。


    再平衡区间也常被使用，这个区间设置在最优目标附近。比如，最优的再平衡目


    +   ① 参见哥伦比亚大学案例 “California Dreamin'': The Mess at CalPERS”，ID #120306。

    ② Merton（1969，1971）最初的理论是以连续时间呈现的，所以再平衡每时每刻都在发生。'
