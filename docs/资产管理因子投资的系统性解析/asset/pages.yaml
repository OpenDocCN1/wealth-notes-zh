    # ## 3.3 业绩表现


    对冲基金随着时间流逝业绩有所下降


    很多研究都曾关注过对冲基金风险调整后是否存在超额收益②。两种情况的结论都存在，但我相信对冲基金可能在20世纪八九十年代，甚至可能在2000年代早期产生了超额收益。但如今在风险调整之后，平均来看对冲基金不太可能产生超额收益。


    在图17.3中，我使用了HFR对冲基金数据库的指数。A图绘制的是1995年1月至2012年12月，通过将滚动5年的对冲基金指数月度收益与标普500指数月度收益做回归分析得到的超额收益（参见第10章关于超额收益的具体内容）。在90年代中期，对冲基金风险调整后的超额收益超过10%。在1998年俄罗斯违约和长期资本管理公司（Long
    Term Capital Management）失败的时期，该数值降低到5%。在2000~2004年期间，对冲基金的超额收益重新增长回到10%的水平。此后，对冲基金的超额收益就一直在下降的轨道上。在2008年后的样本中，在调整市场风险后，超额收益仅为1%至2%。在过去两年（2011年和2012年）的样本中，超额收益为负数。


    图17.3-B显示对冲基金的超额收益在逐渐降低，对冲基金收益与标普500指数收益的相关性在逐渐升高。在20世纪90年代后期，这个相关性仅为50%，也就是说对冲基金能为投资组合带来较大的分散风险的效用（参见第3章）。从那之后，相关性逐渐上升，在2012年至2013年已达85%以上。对冲基金相对于标普500指数有着如此高的相关性，同时产生的超额收益为负，那么它自然不是一种独立的资产类别，如今在风险调整之后，对冲基金可能拉低投资者的价值。


    > ① 案例请参见Chung, J., 报告， “A Volatile Investor Buys Into a Softer Approach” ，华尔街日报，2013年3月20日。


