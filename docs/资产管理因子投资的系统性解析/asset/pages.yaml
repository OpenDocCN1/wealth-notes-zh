  md: '# ### 3.3 典型养老基金的风险厌恶


    一家典型的养老基金持有40%的固定收益资产和60%的风险资产，风险资产包括股票、房地产以及诸如对冲基金和私募股权等另类资产。这个资产组合代表了怎样的风险厌恶水平呢？


    图2.8–A给出了通过持有股票和债券可能实现的所有风险（标准差）和回报的组合。我从数据提供商Ibbotson处取得自1926年1月至2011年12月间的美国数据，用于模拟固定收益和风险资产。方形和圆形符号分别对应股票和债券的波动率和均值。连接二者的曲线代表了持有比例0%和100%之间的所有股票—债券投资组合的头寸。


    ![](img/e2a8f768e844f37dcab93b54b9e826d9_75_0.png)


