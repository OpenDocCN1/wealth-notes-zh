    好生调谢长老，不要怠慢、不要怠慢，我去也。”】当时，“水陆大会”上观音菩萨点化唐王时，曾说小乘佛法超不得亡人、渡不得魂，唯有大乘佛法才能做到超度渡，因而才有唐王取大乘真经之说。如果唐僧不是大乘佛教的信徒，刘伯钦父亲的鬼魂怎么能够超脱沉沦？其实，并非唐僧不会讲大乘佛法，而是取经本事根本就没有任何意义。唐僧取回的也不是什么大乘真经，而是《法》、《论》、《经》三藏真经中的部分经典。如来也没说这三藏真经是大乘经典，只是观音菩萨在安排取经事宜的时候谎称这个大乘经典。如来传经的时候很随便，让阿惟伽叶随手拿了一些经卷给唐僧，凑够了一藏之数就结束了，这多少有点出入意料。由于悟空和唐僧在佛法理论上存在不可逾越的鸿沟，因此在修行实践过程中必然会产生各种各样的摩擦和矛盾。最后，唐僧对取经路上的困难认识不足，这是唐僧和悟空矛盾爆发的思想基础。应该说唐僧对西天取经的困难认识不足既有主观判断失误，同时也有一定的现实基础。唐僧离开洪福寺时对徒弟说：【“徒弟们，我去之后，或二三年、或五七年，但看那山门里松树花向东，我即回来；不然，断不回复。”】唐僧根本不可能估计到取经要耗费十几年的光阴。就是观音菩萨自己的估计也只是二三年间。白骨岭遇到白骨精的时候，已经是贞观十六年秋了，离唐僧取经出发已经过去整整三年了，唐僧以为西天将近了。这是唐僧的判断失误，取经的路才刚刚开始，他以为快要结束了。另外，三来年唐僧的取经路还算走得安稳，收了三个徒弟，才遇见了两个妖精，一个熊罴怪、一个黄风怪。另外就是菩萨的考验，不算是危险。五庄观的事情唐僧把账都记在了悟空头上。因而，唐僧觉得只需八六沙静行，就算没有悟空这个西天取经路照样可以走得安稳稳妥。甚至觉得没有悟空这个阻碍，取经路可以更加顺畅。五庄观的事不就是一个证明吗？取经队伍中的人都是取经局外人，他们完全估计不到前面的困难和危险。谁也没有意识到这是一场充满艰辛的政治谈判。


    “三打白骨精”的具体过程其实并不复杂。白骨精的手段也很有限，不过只有变化之术而已，武艺法宝俱无。无论从哪个角度来考量，取经路上的妖精之中白骨精算是一个比较低层次的，基本上不入流。取经路上要吃唐僧肉的妖精不少，但是连唐僧僧都没摸到的妖怪也就只有白骨精了。话虽如此，这过程中中两个问题值得思考。


    第一个问题，这吃唐僧肉可以长生不老的讯息到底是真是假？白骨精是取经路上第一个要吃唐僧肉获得长生的妖精。在此之前妖怪跟菩萨听说过唐僧肉有长生不老之功。就算黄风大王要吃唐僧肉，那也是把他当作一般的肉拿来下饭而已，并非专门要吃唐僧肉以求长生不老。白骨精是从哪里得知这个消息的呢？她是听别人讲的。到底是听什么人讲的呢？书中没有交代。不免白骨精是听别人讲的，要取经路上要吃唐僧肉的妖精都是听别人讲的，而且谁也说不出一个确切的消息来源。【他（白骨精）在云洞里，踏着阴风，看见长老坐在地下，就不胜欢喜道：“造化！造化！几年家人都讲东土的唐和尚取大乘，他本是金蝉子化身，十世修行的原身。有人吃他一块肉，长寿长生。真个今日到了。”】从这妖精的口中，至少可以知道的是这个消息传来也就是这几年的事情。第三十二回《平顶山功曹传信
    莲花洞木母逢灾》【金角道：“你不晓得。我当年出天界，尝闻得人言：唐僧乃金蝉长老临凡，十世修行的好人，一点元阳未泄，有人吃他肉，延寿长生哩。”】金角大王所说的见到消息的时间也是十几年之前，不光是白骨精和金角大王，其实所有知道这个消息的妖精得出的消息时间都在十几年相近的，也就是在几年前。从金角大王的话里面还可以推测，这个消息的源头很可能是天庭。


    几年之前到底发生了什么事呢？唐王遭遇前宝几妖经，这个消息流传和取经大业几乎是同步的。第三十五回《外道施威欺正性 心猿调伏罢邪疑》中【老君道：“干休于我，不可错怪了人。此乃海上菩萨向我借了三次，送他在此化妖魔鬼，看你师徒可有真心往去也。”】这是老君解释的金童银童下界的原由，不管事情是否是由此。菩萨向他借人以试探取经人，可


