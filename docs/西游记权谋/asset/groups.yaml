    # ## 第二十八回 鸟国悟空双中计


    鸟国这一节，看起来平平无奇。不管是救人，还是降妖，难度都很是一般，完全没有到 让裙字到处撒救兵的地步。但是，这一节却在全书中占据了四个章回之多，是少有的浓墨重彩
    之笔。就篇幅而言，此节已经列了跟平顶山之役、狮驼岭之战相提并论的地步了。那么这一节 之中是否隐含着什么玄机呢？特别是四回之中的前三回，似乎毫无痛痒的废话太多，整个情节
    不免有拖沓之嫌，甚至让人有摸不着头脑的感觉。


    第三十六回《心猿正处诸缘伏 劈破机关见月明》整篇讲述的是两件事：一、师徒借宿宝林 寺；二、中秋赏月悟道。这一回对于取经来说似乎是多余的废话，可以直接跳过去看。其实，
    这一回的内容对于解开本节之谜至关重要。这一回含之中并没有什么“旁门”，也没有什么“月'
