    ## 第十一回 经动天下——唐太宗的取经梦


    前文已在提到未来的“东扩计划”。而取经就是为了这个“东扩计划”而展开的。取经的真正动因是如来要抢夺市场份额，扩张势力范围，争取信众，获取最大香火供奉（要知道神仙都是不事生产的，生活来源仅限于凡间百姓的供奉）。取经是表象，传经才是实质。


    但是话分两头说，不是你想传经就可以传的。老百姓到底信不信你？是个关系到生死存亡的根本性问题。也就是说你的真经到底有没有市场？还得接受市场的检验。另外，跟大领导玉帝抢饭碗，他能那么轻易的你胡为吗？


    因此创造需求，引导消费者才是目前的头等大事。你不信真经？没关系。你去地狱吧。只要我们能够创造出一种消费文化，一种生活方式，让大家都有一种这种感觉：真经=天堂，不信真经=地狱。人人都要去天堂，不打算去地狱，天堂的消费需求极高，因此真经的需求也节节攀升。这叫什么？捆绑销售。林志玲那么性感，不是因为用了你们家的丰乳肥臀膏。但是把她的美和你们家的丰乳肥臀膏捆绑在一起，卖给他了。结果，丰乳肥臀膏他有了，美没了。这就叫捆绑销售。


    怎么做才能达成这种捆绑销售呢？广告。怎么做才能更好更快的达成这种捆绑销售呢？名人广告。不错！观音同志是个极有能力的市场开拓者，她做大乘真经国际集团股份有限公司（简称：大乘国际，股票代码：9981）南瞻部洲总裁，真是实至名归啊！（如果就是知人善任。）作为新兴市场开拓者、取经业务总负责人、大乘国际南瞻部洲总裁兼大乘国际副总裁兼常务执行董事长兼首席业务执行官的观音菩萨是怎么来做这个广告的呢？


    - 签约名人：大唐太宗文皇帝李世民（级别）

    - 广告设计师：水陆大会（创意）

    - 参演人数：成千上万（排场）

    - 广告受众：不计其数（效应）


    皇上他老人家都会口袋大乘真经了，谁还敢还会开口说出个不字来啊。


    当然咯，水陆大会上李世民让唐僧去西天取经，不仅仅是个广告。准确来说，是一个极具广告效应的签约仪式。签什么约呢？就是，太宗文皇帝要取经敕状呢，唐僧领命愿往西天拜佛求经。书上说的明白，《唐书》当时在寺中问曰：“谁肯领朕旨意，上西天拜佛求经？”“拜了，旁边闪过法师，帝前施礼道：‘贫僧不才，愿效犬马之劳，与陛下求取真经，保我下江山永固。’”看呢没？为什么要取经？谁要取经？是唐太宗李世民要取经。唐僧不过是取经项目负责人罢了。不是唐僧要取，这一点一定要搞清楚。


    话说太宗皇帝怎么就心血来潮、突发奇想要取大乘真经了呢？这一切还要从第九回《袁守诚妙算无私曲 老龙王拙计犯天条》说起。第九回一开篇就开了一个天大玩笑，碰上了“贞观十三年”这么一个重大历史难题。这个问题暂且放一放，到唐僧西出长安时再讲。


    泾河龙王因为和袁守诚赌博，干扣了落雨点数，犯下天条，看人曹官魏征处斩。之前袁守诚曾指点龙王向唐王求情，唐王也答应相救。但是，魏征梦斩泾河龙王，唐王实在是无奈。因此，龙王灵魂到了地府向阎王状告李世民言而无信，于是地府拘传唐王魂魄到地府三曹对案。


    乘此机会，让唐王过阴府。而正是这次阴游地府，让唐王作出了开水陆法会“救亡脱苦”的决定。在水陆法会上，观音菩萨提出小乘佛法不能“救亡脱苦”，必须大乘佛法“能超苦升天，能度难关脱苦，能修无量寿身，能作无来无去”。并且留下了几句颂子：“礼上大唐君，西方有妙法。程途十万八千里，大乘应殷勒。此经回上国，能超鬼出群。若曾有去者，求正果全身。”于是，唐王要求取大乘真经。


    ## 第十二回 袁守诚设局斩龙王


    自从观音菩萨和弟子惠岸行者来到长安寻找取经人之后的，长安城就接连发生了几件怪事。


    首先，就是长安城里来了个称神算子的是袁守诚。此人是谁？书上交代“原来是前朝钦天监台正先生袁天罡的叔父，袁守诚是也。”不仅如此，此人还“相貌稀奇，仪容秀丽；名扬大国，术冠长安。”这个袁守诚还真是奇锛啊，袁天罡（中央党校校长）的叔父，而且也算得上是个奇能异士（名扬大国、术冠长安），竟然还在大街上卖卦！老爷子倒是满有兴致的。但是，前文张楷和李定在吹牛的时候，张楷透露说“这长安城里，西门街上，有一个卖卦的先生。”


    这说明知道袁守诚在此卖卦的人还不多，否则为什么不直接说袁守诚，而说是“卖卦的先生”。当泾河龙王知道长安城有这么一个人，于是变作一白衣浮士前来试探的，其实，当时就被这个袁守诚看穿了。但是，龙王一点也不知道。“礼拜，请龙王上坐，童子献茶。”如果不是不看完了，怎么会给上坐献茶呢？来问卦的都有上坐献茶吗？龙王专尊处习惯了，觉得一切都是理所当然的，一点也没觉察。后文，直接就点明了这一点：“别人好瞒，只是难瞒我也。我认得你，你不是秀士，乃是泾河龙王。”只不过已经晚了，龙王已经犯下了天条。


    这个时候，龙王吓坏了，赶忙跪地求饶。这时候，袁守诚说：“我救你不得，只指条生路与你这个使便。”这个生路是什么呢？去求唐王。这个袁守诚还真是滑得很啊！龙王犯的是天条，他不让龙王去求玉帝而是着他去求唐王。这是什么原因呢？把唐王拖下水呗。这对唐王来说，真是飞来横祸啊。而且，从结果来看，虽然唐王答应相救，但是实际上唐王根本搞不清到底是怎么回事，无从救起啊。实际情况是，唐王也没有这个能力去救龙王。这一点，龙王不知道，唐王不知道，难道你袁守诚还不知道？摆明了在下套啊。


    龙王觉得纳闷，怎么答应救我的，到后来还是把我斩了？于是又魂魄去纠缠唐王。这里而龙王的逻辑很混乱。抓你的是天兵神将，杀你的是魏征，骗你的是袁守诚，事实上只有唐王是真心要救你的。但是，这些人你都不去找，偏偏跑来纠缠唐王。什么原因导致他这种行为偏执呢？在这里不得不知怀是有人在暗中指使。


    唐王正在为难的时候，观音菩萨突然出现了。更加深了之前的怀疑。“正在那难分难解之时，只见正南上香云缭绕，彩雾飘飘，有一个女真人上前，将杨柳枝用手一摆，那没头的龙，悲悲啼啼，径往西北而去。”菩萨出现的很突然，解了围就走了。这是菩萨到长安以来，第一次显露真身。菩萨真的是来搭救唐王的吗？当然不是，要不然到后来唐王天天被鬼缠的时候，她怎么连一次问都不问了？菩萨是来让龙王去地府告状的。为什么不让龙王直接就去地府告状呢？因为，龙王到底有没有去地府告状还是个问题呢。因为至此之后，泾河龙王就再也没有出现过丁。这里只不过是给唐王一个顺理成章的错觉。


    为什么？很简单。因为就算是龙王真的死了，他也不会到地府去。第一回《灵根育孕流出 性心修持大诞生》中说的明白。“只闻那部居中，忽跳出一个通背猿猴，厉声高叫道：‘大王若是这般凝迟，真所谓道心开发也！如今五虫之内，惟有三等名色，不伏阎王老子所管。’猴王道：‘你知那三等？’猿猴道：‘乃是佛与仙与神圣三者，躲过轮回，不生不灭，与天地山川齐寿。’”龙族虽然在仙族中的排位较低，但是，他级别再低也仍旧属仙。仙族是不经地府轮回的。


    果然，唐王被这一吓，吓出病来了。紧接着，观音菩萨乘胜追击，把徒弟的那帮鬼兵都发动起来，“入夜就把砖弄瓦，鬼魅呼号，着然难处。白日犹可，昏夜难堪。”后来秦叔宝和尉迟敬德两位将军在宫门镇鬼，才得片刻宁静。稍有懈怠，“又听得后宅门，乒乓乒乓，砖瓦乱响”。这里不得不怀疑，这些小鬼是有人指使的。观音菩萨在后面撺掇：不要怕！上！要不然，哪来这么强的执行力？要是野鬼呢，一早就跑了，还回来干嘛？真是不屈不挠啊。


    最后，唐王死于神经衰落，理所当然的到地府去“三曹对案”。


    ## 第十三回 三曹对案，原告失踪


    唐王终于挂了。观音姐姐首战告捷。


    我们先来看看太宗临死之时的情形吧。魏征在皇帝面前说，与阴司崔判相厚，只需一封书函即可“管教魂魄还阳世，定取龙颜转尔时。”既然如此，直接写信给他不就完了吗？干嘛非得让太宗到地府去走一趟啊。实际上，这一切都是安排好的。你以为魏征的面子真的那么大啊？不管怎么样，太宗一定要去地府走一遭。而且，还必须活着回来，要不然就白走了。


    好吧。让我们先来看看太宗皇帝的“地府一日游”的具体路线图。首先来了一张荒郊野外的崔判亲自迎接唐王大图。并且很装的寒暄了一把。关键是在进地府之前，先明确了一点，“微臣管送陛下还阳，重登玉阙。”事先说好了，这次是来旅游的，结束之后是要回去的。当然咯，公款旅游也不是那么容易的，还得有个名头。什么呢？三曹对案嘛。明明就是因公出差嘛！暂且不提“地府一日游”的具体路线图，但说这个三曹对案究竟如何？


    太宗进了阴罗殿，十二【控背躬身，迎迓太宗。太宗谦下，不敢前行。十二道：“陛下是阳间大王，我等是阴间鬼王，分所当然，何须过让？”太宗道：“朕得罪麾下，岂敢论阴间人鬼之道？”】十二的话倒是在理，但是太宗的话就有点令人摸不着头脑了。【朕得罪麾下。】这话从何说起啊？如果一定要说是得罪了谁的话，无非是泾河龙王罢了。泾河龙王怎么成了阎王的麾下丁？看来，太宗还不是很糊涂啊。他一定已经觉察到什么了。


    一阵寒暄过话之后，【分宾主坐定。约有片时，秦广王拱手而语言曰：“泾河龙鬼告陛下许救而反杀之，何也？”】看来问题还有点棘手啊！十二不知道谁来启动访问。【约有片时，】说明阎王们实在琢磨了一会儿，最后还是秦广王打破沉默，直奔主题了。太宗皇帝回答的倒是逻辑清晰，句句在理。这个泾河龙王被斩与秦广龙王无关。


    十二闻言，伏礼道：“自那龙未生之前，南斗星死簿上已注定该遭杀于太曹之手，我等早知之。但只他在此折辨，定要陛下下来此，三曹对案，是我等他送入轮藏，转生去了。今又有劳陛下降临，望乞恕我侏儒之罪。”


    这段话要好好分析一下。前文说过龙王之死不限阴司管辖，这里果然得到了证实：【南斗星死簿上已注定该遭杀于人曹之手。】神仙的死与人的死其实是不一样的。人之所以追求成仙了道，主要的原因就是追求长生，脱离轮回之苦。但本质上，都是一样的，皆为一灵真性。如果，我们把历史看成线性单向度的，神仙就是直线前进，人就是螺旋式上升。从侧面来看，人就是一个个圆圈连环而成的。每个圆圈就是一人的一生。但是这种模式并没有排除神仙螺旋式前进的可能性，只要神仙愿意，他仍然可以继续螺旋式上升。神仙的选择空间变大了，这是能力增强的体现。但是，神仙要是死了，那就意味着，这一个灵真性消失了。而人的死，并不以为着真性的消失，除非非性被人灭了。因此它可以概括为，人死神气散，人死换新袋。


    接着前面的说，这泾河龙王之死，论理跟地府应该扯不上关系。这一点，阎王们也是知道的。但是，为什么龙王又跑到地府去闹呢？很显然，这是阎王们在说谎。前文已经讲过，龙王并没有来地府折辩。不然，为什么太宗来了，龙王反而不见了？不是说要三曹点案吗？这入曹、阴曹都来了，怎么这本案的苦主水曹却不见了。去哪来了呢？【是我等将他送入轮藏，转生去了。】这简直就是一派胡言。既然已经把他苦主送走了，那叫太宗来干嘛？这这些个终审大法官们前后的做法很滑稽啊。一方面要尽心机把被告抓过来；一方面说服原告撒讼，或者干脆把原告打发回家了。这个官司还怎么打？只要有想从中牟利的贪官在，这个官司就有打的，而且还打的有声有色。这是官司场上的惯用手法：恐吓原告（当然这里用不着恐吓了，早就统一阵营了），勒索被告。这一点，难道太宗皇帝看不出来吗？无非想在太宗皇上索点东西。


    什么东西呢？我们接着往下香。阎王说完上面的话，迫不及待的就拿出了生死簿出来，要看法宗皇帝阳寿几何。这点也是奇怪，皇帝并没有乱打扰啊，阎王们怎么把看家的本领拿出来了？而且，十王并崔判在内无人知晓太宗的寿数。崔判还趁机改了两笔。崔判擅改生死簿，是自作主张吗？当然不是。他哪有那么大的胆子？这一切都是计划好的，一定要让太宗还魂，否则一切都白费了。阎王告诉太宗老死有20阳年寿，然后立即安排陛下还魂。【此一来已是对宋明白，请速还阳。】这就叫对宋明白吗？真是太荒唐了。然后，太宗【又起手问十王道：“朕言中老少安咨询何？”十王道：“俱安，但恐御帐，寿似不永。”】皇帝是随便问了一句，这时候，十王却众口一词。皇帝寿数不清提，皇帝妹妹的寿数却是众口一词【寿似不永】。这不奇怪吗，不要小看这个碗破，这是十王故意留下的一个印证，将来太宗还阳之后，还要靠他这【“寿似不永”】来“提醒”太宗呢。


    那么十王到底向太宗索要何物呢，太宗又再拜启谢：“朕回阳世，无物可酬谢，惟香瓜果而已。”十王喜曰：“我处颇有东瓜、西瓜，只少南瓜。”太宗说道：“朕回去即便送来，即送来。”】原来就是要个南瓜啊！这么简单？不错就是南瓜。很多人都在问为什么是南瓜？（是啊，为什么呢？）这一点我也敲破了脑袋，为此我天天吃南瓜粥。皇天不负有心人！终于有一天我手持宝塔，神光湛明，参破天机，顿时脱胎换骨，似有不肾为之真，定要成仙之意！南瓜，又面名孤，取“南面称孤”之意。太宗奉上南瓜实际就是请阎王称孤，表明愿意投诚。所以，太宗走时才知道：“【朕回去即送来，即送来。”】真是一点也不敢耽搁啊！


    那么究竟是什么导致太宗皇帝如此之快的向地府投降的呢？这还要看看他的“地府一日游”的具体路线图。


    ## 第十四回 “惊心动魄的“地府一日游”


    话说太宗皇帝的“地府一日游”，才来到地府门口，一抬头，就是一个问题。


    【忽然一座城，城门上挂着一面大牌，上写着“幽冥地府鬼门关”七个大金字。】而在第三回《四海千山皆拱伏 九幽十类尽除名》中记载：【猴王渐觉酒醒，忽抬头观看，那城上有一铁牌，牌上有三个大字，乃“幽冥界”。】怎么一段时问没来，地府的招牌都换掉了？究竟这两块牌牌有什么区别呢？从后面太宗的“地府一日游”的路线图来看，这【幽冥地府鬼门关】乃是佛家的地盘。而之前孙悟空去的【幽冥界】乃是道教的势力范围。光从名字上也能看出点端倪来，道家虽然承认鬼的存在，但是基本是不讲鬼的，更不讲轮回之说。道家只讲今世修行，得道成仙，不修来世。所以这【幽冥地府鬼门关】不会是道家的地盘。那么，这【幽冥地府鬼门关】和【幽冥界】究竟是不是一个地方呢？是的。鉴于目前佛道争形的形势，地府基本上采取了一个折衰态度：一班人马，两块牌子。实际上，这次地府之行太宗还是没有见到地府一把手，地藏王菩萨。地藏要是出来，问题就明朗化，当然这一切的幕后操作就有全面暴露的可能。所以，太宗是见不到地藏王菩萨的。


    【那青衣将幢幡摇动，引太宗径入城中，顺街而走。】看清了，这是有导游的哦。不过导游是怎么带路的确？【只见那街旁边有先主李诵，先兄建成，故弟元吉，上前道：“世民来了！世民来了！”那建成、元吉就来揪打索命。太宗躲闪不及，被他扯住。】刚一进城门就碰见冤家对头。建成和元吉，都死了十几年了？怎么还在这里混呢？按照崔判的说法，就算是枉死的，不能进“六道轮回”，那也该在“枉死城”呆着呀。怎么跑到这里来了？【幸有崔判官唤一声童牙鬼使，喝退了建成、元吉，太宗方得脱身而去。】这个崔判也太能装了。


    接着太宗就进了阎罗殿，对案三曹之后，崔判又领着太宗去地府闲逛了。先是到了“幽冥背阴山”。太宗不肯去的，要原路返回。崔判说，【阴司里是这般，有去路，无来路。】意思是，景区游览，禁止倒游！转过背阴山，来到“十八层地狱”，导游的解说，令太宗【心中惊惨。】然后，到了“奈何桥”，接着看到了“枉死城”。在“枉死城”太宗被敲诈了一库金银，作买路钱。可怜太宗身上还没带钱，少了字据向阳间阴间借了一库金银。贷款业务都做到地府来了，不知崔判从中抽了几层润点。最后到了“六道轮回门”之外，太宗从“超生贵道门”送出去了。这【“六道轮回”：行善的，升化仙道；尽忠的，超生贵道；行孝的，再生福道；公平的，还生人道；积德的，转生富道；恶者，沉沦鬼道。】注意，超生贵道门，是尽忠的人专用的通道。这太宗皇帝谁尽忠啊？不错，刚才是挨诚了吗？当然是地府了呗。


    “地府一日游”结束的时候，临走之际，崔判关照了一句话，要太宗谨记。【判官道：“陛下到阳间，千万做个‘水陆大会’，超度那无主的冤魂，切勿忘了。若是阴司里无报怨者，主张阴间，方可享太平之庆。凡百不善之处，俱可一一改过。譬命恕人为善，管教你后代繁昌，江山永固。”】这里实质是指一件事：水陆大会。为什么要做水陆大会？


    - 可以超度冤魂。这样才能保障阴太平。

    - 可以改过自新。你杀了那么多人（枉死城里面的，还有建成和元吉），不是不给机会的吗。否则，“一十八层地狱”的刑罚都在那摆着呢！


    这么一个“地府一日游”下来，太宗能不乖乖的做水陆大会吗？能立即劝投吗（如果刚进城的时候是表面敷衍的快，这下可是要实际行动的快了）？整个就是威逼利诱，软硬兼施啊！


    ## 第十五回 酆都鬼死而复生，唐王受敕修

    '
  merge: 1
- raw:
  - '[PAGE 43]


    太宗皇帝回到朝廷，先对群臣讲述一遍地府的来龙去脉（注意这里太宗绝口未提进贡瓜果的意思。）紧接着，做了两件事：1、【出诏赍捞，招人进瓜果到阴司里去；】2、【将宝藏库金银一库，差鄂国公胡敬德上河南开封府，访相似还债。】这两件事都是押回阴司的名。太宗回到阳世立即着手落实，可谓不不上心。


    首先我们先来看看这个揭皇榜的人刘全。刘全什么人？【本是均州人。姓刘名全，家有万贯之资。】说起来，他和他的妻子李翠莲都是想法很古怪的人。【只因妻李翠莲在门首拔金钗斋僧，刘全骂了他几句，说他不遵妇道，擅出闺门。李氏忍气不过，自缢而死。】既然刘家有万贯家私，怎么斋僧的时候，还要“拔金钗”？不能付银子吗？这知道的是斋僧，不知道的一定会以为她和尚指定要她头上的金钗的。有时候，和尚的行为是狂放的，但是要记住狂这些才是所谓的“高僧”。【这个高僧是谁呢？会是观音吗？不好说。】所以，刘全骂她两句也是正常的。没想呀，李氏自尽了。到底是因为什么原因自尽的，恐怕只有李氏自己知道。这刘全为什么要揭皇榜呢？（李氏死后）【撇下一双儿女年幼，昼夜悲啼。刘全又不忍见，无奈，遂舍了性命，弃了家缘，撇了几女，情愿以死进果，将皇榜揭了，来见唐王。】这刘全是因为不忍心看到一双儿女昼夜悲啼而舍去性命的。且不，将这一个有悖常理的逻辑不是全得怪阴府。【我们可以确认的就是，刘全不是因为想念妻子而自弃的，也不是因为后悔当初骂妻而导致妻子自尽而轻生的。】


    再接着看，这刘全是怎么进地府的。【耶刘全见皇榜到府里——一点魂灵，顶看瓜果，早到鬼门关。把门的鬼使喝道：“你是甚人，敢来此处？”刘全：“我奉大唐太宗皇帝钦差，进瓜果与十代阎王受用的。”那鬼使欣然接引。】这真是应了那句古话了：阎王不请自己去。前面两次，不论孙悟空还是太宗皇帝，都是被地府的人拘走的或者是请去的。这个刘全自己就去了，而且就直接到了地域城门口。乖乖，这个刘全还真是聪明啊，他认识路的呀。鬼使的话更是问得奇怪：【“你是甚人，敢来此处？”】说得人家刘全好像不懂事，非要来地域的是，人死了不来这里去哪里啊？敢情这地府也打击游客客源啊。


    当阎王问及对刘全情况时，【刘全道：“小人是均州民居籍。姓刘名全，因妻李氏缢死，撇下儿女，无人看管，小人情愿舍家弃子，捐躯报国，特与我王进贡瓜果，谢大王大厚恩。”】大家都来看，这话还讲不讲理了？儿女无人看管，就要命家弃子了？如果真是一家人活不下去了，他带孩子一起去寻死还是说得过去的。可是，自己明明知道儿女无人看管，却还要去寻死路，还偏偏去揭什么皇榜，他可真有心思啊。这个刘全的想法，着实让人无法理解。


    问题究竟出在哪里呢？


    第一，这里皇榜肯定是有问题的。我们再来看细看这张招贤皇榜出台的前前后后。原文是这么说的：【一壁厢又出诏赍捞，招人进瓜果到阴司里去；一壁厢将宝藏库金银一库，差鄂国公胡敬德上河南开封府，访相似还债。】仔细看看，这个皇榜有什么问题？什么？看不出来？好吧，我换个提问的方式。让你【进瓜果到阴司里去】，你去吗？废话？当然不太了。去地府送东西，还能活着回来吗？再说，作为一个皇榜，他漏掉了一个最至关重要的东西没讲，奖金！不错，有报酬，赏赍之下，必有反方！不给钱，就想让自家自送一条命。天底下，哪有这好事啊？那么这张皇榜抬出去，有什么用呢？当然是石沉大海啦！按张数日，上上贴命送进贡的贤者，本是均州人。】数日，是什么概念？大概一个星期吧，就是没没人来揭榜，按照这个皇榜，如果不是冒出个高僧来教我儿，这事就是等到如来佛祖圆满也办不成啊！他吃饱了，撑得！死了还给你李世民往地府去办事。从后文来看，太宗的确也没打算给这个刘全什么奖赏。当然刘全也不是冲着这个奖赏来的。不过，给与不给，和受与不受是两回事。没有奖金，其实摆明了就是观音要自己选人，因为谁也不会来揭榜，除了自己故意安排的人。'
  - '[PAGE 44]


    的时候，也曾遇到过一张皇榜，那榜才是真正意义上的皇榜：【那榜上却云：“朕西牛贺洲朱紫国王，自立业以来，四方平服，百姓清安。近因国事不祥，河沟伏怪，淹延日久难痊。本国太医院，屡选良方，未能调治。今出此榜文，普招天下贤士。不拘南北东，在外华闻，若若有精医药者，请登宝殿，疗理朕躬。稍得病愈，愿将社稷平分，决不虚示。为此出给张挂，须至榜者。’”]两相比就知道唐王的这个皇榜有多假了。


    第二，前文分析过，这个进瓜果是何等重要的大事啊！能随便招个人来代办吗？当然不能啦。这私通他国的僧侣能随随便便找人带送吗？要是传出去，不但是让太宗颜面扫地，更重要的是会坏了佛朝廷大事。所以，这个事情只能暗中找可依靠的同志去执行。所以，这个对外只能是【进瓜果到阴司里去】，而不是直接说送西瓜到阴司里去。小心驶得万年船啊！


    而且，凭这太宗的能力，他是想不出这个活人自尽顶献瓜果进地府的献瓜方式的。一般以为，拿南瓜在阎君像前祭拜即可。但是皇帝祭拜这种事情，可大可小。而且，皇帝拿南瓜向阎君祭拜，十分扎眼而且也起不到保密效果（万一道路神仙看见了怎么办？）。因此，这整件事情肯定有人在进行策划。这献瓜方式、招募方式以及人员选拔都是有入在暗中操作的。


    为什么会选中刘全呢？当然，可以不一定是对全。也许之前这个“高僧”也曾经过试验其他几个人家的眷属，被人家痛骂了一番。结果就是那些人都错过了这个千载难逢的机会。就像如来佛祖让文殊菩萨去点化善信（乌鸡国王），结果文殊菩萨上去就是一顿狂数落，人家受不了了，把他捆起来扔到河里。结果，自然是乌鸡国王错过机缘，还惹大麻烦。刘全选中了，所以的事情也就传出来了。这个“高僧”选定了刘全之后，必然跟他说了如何如何，这般这般。于是，刘全夫妻依计而行。


    刘全介绍完了事情来龙去脉，得大选相会了。【那阎王却检生死簿子说着，见他夫妻都而登仙之寿，急差鬼使送回】。这个说得简直就是话该。若是登仙之寿，李翠崖怎么就死了。而且，已经死了三个月之久了。阎王都没发现的吗？不是按照生死簿来勾人魂魄的吗？既然生死簿上面写的是登仙之寿，谁去勾魂来的？根本就说错了，登仙之寿的人根本就不会记载在生死簿上面。阎王拿本不相干的生死簿，还在那里念念有词，说什么登仙之寿，故态玄虚。


    阎王即令鬼差将刘全夫妇送回阳间。鬼差是怎么送他们回去的呢？【那鬼使领命，即将刘全夫妻二人还魂。带定了两个阴司，即阴风怪路，径行了长大阳间。将刘全的魂魄，推入金亭馆里】。这里可和太宗还魂做个比较。刘全还魂要比大宗轻松的多，根本就没有崔判说的那些弯弯绕绕。再次说明了崔判那样做是有所用意的。【将刘全的魂魄，推入金亭馆里。】这才是真正意义上的还魂，死而复生。太宗是经过“六道轮回”出阴司的，根本就是没什么还魂，而是投胎重生（谁说投胎就一定转世在新婴儿身上？）。真正意义上的太宗已经死了，过六道轮回出来确实是新生，只不过崔判开路的时候，故意绕过了奈何桥，太宗没有失忆。就跟铁路局长送客上火车，根本不需要买火车票通过是一个道理。可想而知，崔判拿出来那个生死簿根本就是个假账本，本是道具，跟真生死簿相比就是一个粗制滥造而粗糙的虚假。


    而李翠崖的还魂暴露出地府这个地方不仅行事诡秘，而且还心狠手辣。【将翠崖的灵魂，带进皇宫阴司】，只见那五百狱宫主，正在花阴月下，徐步琼香而行，被鬼使扑个满怀，推倒在池，活捉了他说：却将翠崖的魂灵，推入玉男门外】。这就就是章宫主命唆！前面说计，这个御妹李玉英之死是阎王故意留下的一个楔子。一来是证明唐王此次魂游地府并非梦境，而是真有此事（用事实来印证地府之事）；二来是用来提醒唐王必须要信守承诺。（地府决不虚言，阎王要你三更死，你敢留人到来五更？？


    当驾官报与太宗皇帝：刘全还魂了，就在朝门外候旨。刘全还魂，为什么要进宫呢？是来复旨的吗？告诉皇帝我完成任务了。执行这个任务，皇帝还指望他来复旨吗？当然不可能。难'
  - '[PAGE 45]


    道什人都能死而复生的吗？要是那样的话，还赔什么招贤府啊？直接派一名亲信去地府走一遭，不就完了吗？地府也不能追究我乱杀无辜的罪名了，因为会回来嘛。太宗回来之后，倒是循规蹈矩起来了，毕竟头上有文件了，虽然头上也不是什么好东西，但是太宗并不知道底细。


    既然皇帝没过说要刘全来复旨，地府也没交他来宫中报信，那么刘全为何进宫来呢？因为此时的刘全已经不是均州城里的土财主了，而是掌握了重要机密的特务人员。他来必有如图。太宗原来以为这个任务是先灭口，再执行的。根本就是万无一失的。所以太宗一听到刘全还魂，而且就在朝门外候旨，反应剧烈。【唐王大惊，急传旨，将刘全召进，俯伏丹墀。】


    紧接着，太宗一连问了三个问题：1、进贡瓜某之事如何？2、你在阴司见些甚来？3、那阎王可曾说你妻甚么？这三个问题，刘全回答的很聪明。除了进贡瓜某之事，一概不知。第一个问题，显然是太宗最为关心的：千万不要把差事办砸了。刘全的回答，太宗是满意的。紧接着的第二个问题，是太宗最担心的：刘全在地府到底见到了什么？有没有见到建成和元吉？他们会跟他说些什么呢？“玄武门之变”太宗登基，真的就如大唐教科书上所讲的一样吗？太宗显然担心会节外生枝。细看刘全对这个的回答。前半小时讲的是让太宗宽心的话，我什么也没看到；这后半句就有龙骨头了。什么？阎王说他为刘全敞宫登仙临圣寿。这个确实在是个大实话，但是大实话在这里却有着非常大的作用。这些都是大秘密宫里圣的全部勇气之所。难道他跑回来就不怕太宗灭口吗？不过，有了阎王的免死金牌在手还怕什么呢？


    第三个问题，是太宗眼下碰到的一的寻问。这个问回，刘全是在装疯卖傻。【臣不知“御面妹”是甚地方，家居何处，我还未未曾去寻问哩。】就这就想全蒙混过关了？其实，在明白人面前说糊涂话，是一种投石问路的技巧。刘全回来的目的就是要点好处，封口费。但是，他到底知道什么？不清楚，也许什么也不知道，凭着一一点点感觉，就是来作李世民民的。前面刘全对阎王说道【“小人是均州城居民。姓刘名全。因妻李世民氏，撇下儿女，无人看管，小人情愿舍家弃子，捐躯报国，特与我王进贡瓜果，谢众大王厚恩。”】这进贡二字说明刘全对太宗和地府的关系已经有所察觉。果然，太宗心里有鬼。不管刘全是否知道献瓜的来龙去脉，是太宗决定还是要好好封住他。


    太宗是怎么封赏的呢？【好一个有道的君王：即将御妹的妆奁、衣物、首饰，尽赏赐了刘全，就如陪嫁一般。又赐与他永免死除的御旨，着带你那御妹回去。】乍一看，没什么嘛，不是一些旧衣服首饰之类的，还有就是一张免死御旨，并没有什么样的封赏啊？再仔细看看！这个御妹的妆奁、衣物、首饰，是有钱就能随便用的吗？不错，表面上就是些不值钱的东西。实际上，就是赐婚，就是这些【陪嫁一般】的东西，封了刘全一个驸马的身份。而且，在唐朝娶了公主就可免除孺缓，这是一项制度。这里说的不光是金银财宝，更重要的是一个尊贵的身份。在等级森严的封建王朝中，这才是最重要的。


    # 第十六回 大相国寺--一笔唐王还不了的债


    前文说到，太宗复生之后急办了两件事，俱是在地府许下的诺言。1、进贡瓜果。2、还相良一堆金银。下面我们来看看太宗是怎么来还这笔债的。


    【将宝藏库金银一库，差鄂国公敬德径到河南开封府，访相良还债。】按照地府崔判的指示，太宗差郭国公胡敬德前先去办案。胡敬德听说到这两个相良，【原来卖水为活，同卖炙东在门前管卖乌盆瓦器营生，但赚得些钱儿，只以盘缠为足，其多少斋僧布施，买金银纸锭，记库焚烧，故有此善果殊身。】地府要点化的人是这个【斋僧布施】的相良，这个充分说明了地府已经和天庭'
  - '[PAGE 46]


    貌合神离了，转而成为了佛派的战斗堡垒。因此，换牌其实只是一个开始。


    胡敬德对相良说了太宗地府借债一事的来龙去脉，并说此次前来就是代太宗皇帝还债于他。这个相良夫妇两个听说此话，吓得魂飞魄散，【只是磕头礼拜】，不敢收受分毫。这个相良不管胡敬德怎么劝说，就是不肯收下这一库金银。鄂国公没有办法，启奏皇帝，太宗皇帝也没有办法，只好【传旨教胡敬德将金银与他修理寺院，起盖生祠，请僧作善，就当还他一般】。


    这里一个小小的问题，既然相良不肯收下太宗皇帝的一库金银，那么太宗皇帝为什么要拿这笔钱去修建一座寺庙及生祠呢？其实，不管相良是否收下这笔钱，这个债都是没有办法还的。为什么呢？我们回忆一下太宗借债的情景：【遂于其文书与判官，借他金银一库，看太尉尽行给散】。看见了吗？当时是立了借据的。可是，即使是长良收下这一库金银，太宗皇帝又到哪儿去寻这张借据回来呢？这张借据是太宗皇帝魂有地府的一个明证，更是能印证出太宗皇帝投诚的一个物证（而且人参刘仝也是登仙之寿哦）。这张有太宗亲笔签名的文书，谁判定可能轻易的交还给太宗皇帝呢？光是靠威逼利诱不足以成大事，必须能够拿到痛痛无感的证据在手，才能够让对方乖乖就范，稳操胜券。现在地府是人证物证俱在，不怕你太宗皇帝反水。吃定你李世民了。


    太宗皇帝没有办法，只能盖一座寺院，并且在寺内立起相良夫妇的生祠。这样，至少证明我已经还了相良的一库金银，只是他不肯收下这金银，才盖了这寺院及生祠。这个寺院及生祠就是我还债的物证。【尉迟公监造】标明了还债的人证就是尉敬德。同时，取名【大唐相国】也传达出一个重要的信息，我李世民已经开始信奉佛教了，并把这个皇家寺院放到了“相国”的高度，我是不会反水的，请佛祖放心吧。


    # 第十七回 取经人的冠冕仪式


    兑现了之前在地府许下的两个诺言，太宗皇帝紧接着就是筹备最为重要的一件大事，“水陆大会”。【榜行天下，着各处官员推选有道的高僧，长安做会。那消个期之月，天下多僧僧到大。】眼看着事情进展最顺利的，不料半路杀出个佛奕【上疏言荐僧，这个佛奕白做了这么多小领导，完全不会领会太老板的意图。太宗皇帝让他【选举高僧】修建佛寺，这不是无上光荣的美差啊！领导对你多信任啊！可是这个佛奕一点也不知趣，立即上疏说世上根本就没有佛。真是让太宗大跌眼镜啊！没办法，领导总不能跟你一般见识起来吧。像个泼妇似的在朝堂跟你在朝堂比试口水这种活儿，还得交给相关人等。于是，太宗把这个奏折拿出来，让大家一起商议。于是，宰相萧瑀出班解围，给了佛奕一个当头棒喝。结果，两个人就在朝堂上辩论起来，完佛奕还占了上风。萧瑀同志虽然讲得领导心意，奈何水平不够啊。太宗皇帝又张道源和张士远来咨询了。在唇战败的情况得，这个意图就很难见了嘛！于是，二人说了一段废话，言及【三教至尊而可敬，不可废】。也就是打了个马虎眼，请皇帝圣裁。于是，太宗皇帝就顺这个台阶上高楼了，乾纲独断，一锤定音，决定三教并立。虽然这只是一件，但是佛教终于争得了一席之位，也算是进入主流意识形态了。这是大大的利好消息啊！并且，【自此时出了法律：但有毁毁谤佛者，断其臂】。佛教还获得了法律界的朋友们的支持。西天路上的经历告诉们这一点点是多么的重要！因此，这场辩论的目的不是不要弘扬佛教的问题，而是要做此计划做相关宣传。另外，从取经路上的经历来看，当政者的支持对于教派的发展起着至关重要的作用。再一次证明了，佛派取走上层路线的基本方针的高效性。如来英明无比。


    自此，观音传经计划获得了阶段性的胜利。佛教获得了国家法律的明文支持，僧佛的地位'
  - '[PAGE 47]


    都大大提高。借助政府的信誉，这弘扬佛法、争取善信的业务就好做多了。


    名正言顺之后，太宗立即着手“水陆大会”的具体事宜。首先命魏征与蒋琬、张道源三位【邀请诸佛，选举一名有大德行者为庄主，设建道场】。这三个人领了圣旨，立即成了一套班子，建了一套房子，买了一辆车子，前前后后着实忙活了一阵子。最后，【内中选得一名有德行的高僧】，这个人是陈义奖。


    当选理由：【查得他根源又好，德行又高；千经万典，无所不通；佛号仙音，无般不会】。这恐怕也是魏征从中操纵的结果。陈光彦父子的命运与这个魏丞相亲密相连。如果说唐僧的根源好，这是事实。父亲是状元，外公是宰相，可算是官宦人家，背景显赫了。但是，这【德行又高】，就不知道是从何说起了。没有看到过任何这方面的报道。从组织上来看，核心决定提拔周围，从来也不需要什么理由的。


    唐僧到底是怎么选出来的？总结一下，有如下几点：1、根源好；2、德行高；3、理论强。还有一个重要的原因，就是魏征的技术操作。取经这件事，从筹划到实现，一直都有他的参与。如果说他是局外人，对此毫不知情，根本就不现实。他早就是佛祖的内应人了。


    其实，选唐僧三藏作为取经人的真正原因是一个：草根是【皇族后裔】。就是这个原因，菩萨选择了金蝉子转世投胎。然后，其他的原因都是因为他金蝉子转世而设的。真正的选择在唐僧出世时做出的。现在只不过，找个理由把这个人名幕推台后推到台阶上。所谓德行好，理论强都是胡说八道。从后面的取经经历来看，唐僧德行一般，没什么光辉之处。佛学问题上是一般，经常被悟空教训，这一点也是他们师徒关系紧张的一个重要原因。


    “水陆大会”正在筹备阶段，菩萨突然现身，送九环锡杖和锦镧袈裟来了。这里的问题是，为什么要“在水陆大会”之前把袈裟和锡杖送出，为什么不在取经人选出来再送袈裟和锡杖？这样不是更好更合适吗？因为，到现在为止，除了内部人之外，谁也不知道还有取经这回事儿。目前为止，连唐玄奘是作为“水陆大会”主持人的，不是选取为取经人的。而佛祖说得明白，这两件宝物是给取经人的。因此，可以断定菩萨早就选好唐僧了（取经结束时，为功德佛门们记录81难目录，更是说明了这一点）。所以要在取经人选未定之前把宝物送出来，就是唐僧在关键的时刻能挺身而出，勇挑重担。果然，当菩萨请王点出只有取经大佛经才可以渡念超脱的时候，唐王才知道要双方取经这两回事儿。唐王刚开口及准人带领选向西行，唐僧即出班领旨谢恩。唐僧能不出来吗？东西收了，也风光过了，你不出谁来推？唐僧真是吃人家的嘴软，拿人家的手短，早知道领这两件玩意儿要付出那么大的代价，打死他也不能领受啊。唐僧的命运是被菩萨一步一步算计好了的。他这一生根本就没有选择的机会。谁让他是金蝉子转世呢？


    临走的时候，唐王宝座上又送出一件宝紫紫金钵盂给唐僧。唐僧领受了文牒及宝物，由唐王送至关外，即时离去。这一章正是大唐贞观十三年九月初三。前文说过，这里有个“贞观十三年”的重大历史问题。究竟是怎么回事呢？附录里面说过，唐僧的父亲陈光彦中状元成亲是在贞观十三年，唐僧出生也就是在贞观十三年。可是这里说取经也是在贞观十三年开始的，这不是很奇怪吗？唐僧一出山就去取经，这还不错。这里是作者写错了贞观十三年，没有照顾到后文的时间安排吗？不像。附录第一段和第九回第一段，有两句是一模一样的，【三座化佛，水发经城竭】。这个并不是千古名句，为什么在这里重复出现了呢？紧接着这两句，两个时间都出现了，作者不可能注意不到，为什么偏偏说理道不通呢？其实，还有一个时间也是在贞观十三年，那就是菩萨来到长安城选取取经人也是在贞观十三年。这里的重复出现在说明一个问题，贞观十三年发生的怪事都与菩萨有关，都是菩萨在暗中操纵的。比如名不经传的妙算袁守


