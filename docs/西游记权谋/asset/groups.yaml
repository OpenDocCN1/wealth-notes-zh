  - '[PAGE 73]


    样的画来？因此，金角大王在此说的是谎话。再说，革命道路千万条，跟着党走幸福长。放着太上老君这样的三界巨头不抱，偏偏要下界去吃什么唐僧肉以求长生不老，这不是舍近求远吗？


    【诗词：可恨猿乖马劣顽，灵胎转降托尘凡。只因错念离天阙，致使忘形落此山。鸿雁失群情切切，妖兵绝族泪潺潺。何时攀得开窠锁，还本还原上御关？】从这里来看，金角大王和银角大王始终是要回天庭的。之所以现在还不能回天庭，是因为壁罩未满，锁链未开。所以，金角大王和银角大王下界是有人安排的是不争的事实。这一点太上老君自己也是承认的。但关键是谁才是真切的幕后主使。是观音菩萨吗？还是太上老君自己？或者还有其他可能，是玉皇大帝吗？老君把责任都推给观音了，但事实却并非如此。


    既然最后连太上太上老君都承认金银双童下界是有人安排的，那么为什么双童自己却一直不敢说真话呢？金角为什么非要强调是自己私自下界的不可呢？因为，老君没有说真话。观音的确向老君借过东西，但绝对不是金银双童。金银双童下界是肩负秘密使命的，就是要刁难取经队伍。所以，金银双童不敢在群妖面前说出真话，只能说是自己下界界事。


    那么，观音菩萨向太上老君借过什么东西呢？紫金红葫芦。当年在流沙河三藏败沙僧的时候，取经队伍最后是谁来过失沙河的？观音菩萨带着弟弟子惠岸行者拿了一个红葫芦配合沙僧顶上擦着九个取经人的骷髅头制成了一只法器。依靠这只法器，唐僧才得以渡过流沙河。这只红葫芦并非观音所有。佛家修行者自来没有个带葫芦之说。而且，法器的制造方法中九颗骷髅头是依循九宫排列的，这分明是道家的工艺。当年，观音菩萨勘察取经路线的时候，”见到流沙河就犯眼了。【菩萨道：‘徒啊，此处却是难行。取经人沿苦风浪，如何得渡？’】因此，唐僧如何渡流沙河观音菩萨心里根本没成。后来，收了沙僧偶然得知他项上的九颗取经人的骷髅头能漂浮于流沙河的弱水之上。菩萨因此而留心。再后来，观音通过各种途径了解到太上老君的紫金红葫芦可以助唐僧渡过流沙河。于是，菩萨亲自去借，老君不是吃素的，菩萨一连借了三次才得手。而且，还搭上自己的杨柳枝做抵押才借的此红葫芦。所以，在五庄观甘露洒宝树的时候，观音菩萨对悟空又撇了谎。当年杨柳枝枯死并非是因为她与老君赌斗，被老君放在八卦炉里烤焦的，是因为杨柳枝离开净瓶甘露太久而自行枯萎的。太上老君哪有那么多无聊，烤杨柳枝玩？


    其实，悟空是认识这只葫芦的。他第一眼看到这只葫芦的时候就识认出来了，原本他是要抢这只葫芦的。但是，悟空心里面对观音菩萨多少是有点畏惧的。对于，平顶山下的妖怪到底是哪背景悟空并不清楚。因为当初这只葫芦是在惠岸行者手上的，悟空担心这平顶山的妖怪与观音菩萨有关联，所以悟空没敢过分造次。但是，悟空贼心不死，想出了换葫芦之说，还提出了立字据为证。就算将来菩萨追讨起来，悟空也可讨说法。悟空自取经路上打死了多少调情的水妖怪，本节中的巴山虎、倚海龙也没能幸免。但是，他却放过了伶俐虫和精细鬼，就是为了留下活口人证。当然，后来情况峰回路转，这两个小妖与菩萨没有关系。但是，但是悟空是不知道的。


    而且，从观音菩萨的行事风格来看，她借葫芦碰壁之后，一定是向玉帝求援了。她比较喜欢直接找大领导。在玉帝出面之下，老君才答应将葫芦借给观音，但提出了以杨柳枝作为抵押品。这个时候，突然明白了玉帝为什么要把唐僧大将发配到流沙河算了，因为，流沙河是取经人的必经之路，而且没有沙僧项上的取经人的骷髅头，唐僧是渡不过流沙河的。而且，那九颗取经人的骷髅头之说到底是真是假的两说呢。反正最后那九颗骷髅头化作一阵阴风不见了，没了凭证。


    金银双童下界为妖，玉帝是知道的。要不然，他不会罚奎木狼去给老君看护火。所以，这件事情就算不是玉帝主使的，也是玉帝默许的。因此，金银双童下界就是冲这取经队伍来的。


