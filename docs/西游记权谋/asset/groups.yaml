    大鹏就非常知趣的逃离了？因为，他的任务已经完成了。他的出现就是为了要迷惑如来。如来的狠话其实并不高明，升堂断案的惯用语罢了，并没有拿出什么确凿的证据出来。但是，大鹏还是顺着台阶下了。因为，真的较量还没开始呢！


    由大鹏和沙僧的合作关系可以看出来，他们后面有人。这个人是谁呢？不用着急。要向玉帝好好学习，戒骄戒躁。不管是谁，西天路上紧要处终究是要露面的。


    # 第三十四回 牛魔王--三调芭蕉扇的矛头所向


    悟空一提借芭蕉扇过火焰山之事，牛魔王就愈发冲冠，举棍便打。悟空持棒随手相迎。战经百十合，胜负未分。当此时，山峰之上忽有妖呼请牛魔王早赴华筵。牛魔王当即罢战，回摩云洞卸甲更衣，跨“辟水金睛兽”奔西北而去。悟空化影随行，至乱石山碧波洞万圣龙王处，见有众精在座，攻无胜算，等亦心烦，思谋定为上。于是盗走“辟水金睛兽”，假冒牛魔王径往摩云山水寇洞骗骑而来。


    悟空费尽心思终于巧取芭蕉扇，欢喜无任，一路怡颜悦色而行。及至散会，牛魔王不见了“辟水金睛兽”，料必为悟空所盗，于是只身回翠云山芭蕉洞追悟悟空。回归洞府，闻知悟空辱骂骗骑，闲谈得逞，正夸天意地而形，遂目不能不化追悟空夺宝扇而来。牛魔王忌芭蕉扇之威烈，化八模样，趁悟空得意忘形之际，趁自骑得宝扇。


    骄兵必败。悟空果然中计，恨苦暴跳如雷，即与老牛开战。正相斗难解难分之际，八戒在火焰山土地的引领之下，前来助战。悟空与八戒力战牛魔王，以二敌一，愈战愈勇。牛魔王神威如岳，料难取胜，正欲退去，却又见火焰山土地帅阴兵截断退路。老牛叫苦不迭，只得转头再斗八戒。悟空亦举棒相迎。牛魔王作困兽斗，十分骁勇，且战且退。前面就到积雷山摩云洞口，不觉天已放光，原来激战一夜，胜负未明。老牛孤狸闻报牛魔王正在洞前奋战，立即点兵聚将前来助战。牛魔王见援兵已至，越发奋勇，绝地利反，得胜归洞。


    牛魔王如此勇武过人，八戒思谋连夜转山继续西行。取经队伍有危难之意，火焰山土地当即劝解，晓以利害。悟空发狠，定要斩掉魔王，前痛大道。八戒亦生怒痴。他见第三人不劝撤神，率领土地及阴兵来至摩云洞口，直捣洞口，前来挑战。牛牛心中怒火焰冲，亦不顾疲惫，整装束甲前来应战。三人相见，分外眼红。舍生忘死，又斗经百十回合，牛魔王力有未逮，渐难招架，正欲收洞中，却又遇土地阴兵截断归路，遂施展变化神通。悟空识其神通，一面以变化之法相难，一面使八戒与如火焰山土地帅阴兵捣毁摩云洞老巢。牛魔王见变化之法难以取胜，便显出本相大白牛，神勇无敌。悟空也使出天上家地之本领，却也难耐他力。正当时，双方悉斗，惊动了过往神祇及揭谛、丁甲和护教伽蓝。一切众神纷纷参战，与悟空助战，牛魔王一见此情景，知大势不妙，滚身复本，回芭蕉洞。这一场，从摩云洞一直打到芭蕉洞，战场绵延三千余里，斗争激烈。


    牛魔王闭门不出，众神将翠云山围困，水泄不通。八戒与土地洞摩云洞之后，与悟空及一概众神合兵一处，力攻芭蕉洞。八戒钉耙打上门来，刹那又有社助退兵之心，奈何牛魔王愤怒难平，绝不妥协。重新披挂，又选两口宝剑来战八戒。悟空及一概神祇立即参战，四面围困牛魔王，一座翠云山杀个鸡鸭。老牛苦战五十合，抵挡不住，败北而走。忽见前四大金刚四面环绕，颅佛前来生擒牛魔王。四面堵截，下有追兵，老牛心惊胆战，悔之晚矣。正欲驾云上逃走，却又遇托塔李天王并哪吒太子，领本部人马前来擒拿助威。老牛六谷碰壁，四面楚歌，还复了白牛原身来攻李天王，妄图突围。哪吒变出三头六臂，使斩妖剑连老牛十数头，又使


