- raw:
  - '[PAGE 19]


    所有的人都把目光集中在他身上呢！就等着盼着他出错呢！一点风吹草动，就立即演变成狂风暴雨。这一群人中，有被利用的，有主动出击的，有被吹捧的，也有确实想打击悟空信息的。王帝即派人间去查探，探子【回答道：“搅乱天宫者，乃齐天大圣也。”】不管孙悟空是否真正犯下了上述各项罪过，反正搅乱天宫这一条是躲不掉的。“蟠桃大会”因此而取消了。


    【玉帝大怒。即差四大天王，协同李天王并哪咤太子，点二十八宿、九曜星官、十二元辰、五方揭谛、四值功曹、东西星斗、南北二神、五斗、四煞、普天星相，共十万天兵，布一十八架天罗地网下界，去花果山围困，定获妖邪那人。]


    此时，彼一时。朝中局势瞬息万变，又到了主战派得势的时候了。玉帝此番是不是有点小题大做？点了这么多的天神天将不算，还派出了十万天兵，布下一十八架天罗地网。暂且考虑是不是小题大做。我们来看战况如何。


    首先出来挑战的是九曜星官。悟空是个实在的人，知道自己理亏在先。因此，九曜刚来到前骂战的时候，悟空是避而不战的。但是，九曜星官打上门来了，悟空就是想忍气吞声，也没有后路可退了。【这九曜星一齐踊跃。那美猴王不惧分毫，轮起金箍棒，左遮右挡，把那九曜星打得筋疲力软，一个个倒拖器械，败阵而走。】悟空只是【左遮右挡】就战胜了九曜，得了胜仗。九曜星官难道都是饭桶？于是，【李天王即调四大天王与二十八星，一路出师来斗。】这场厮杀，可以说是自圈剿花果山以来场面最大的一次战斗了。这场战斗的果果如何呢？【那独角鬼王与七十二洞妖怪，尽被众天降神捉去，止走了四健将与那半截观音，战死的水洞精灵。】可以说，是取得了有史以来的空前大胜利。但是，这样的结果又不太令人满意。战斗结果的太突然了，本应该趁此机会，一鼓作气，拿下花果山，但是却草草收兵了。表面上看是悟空的一把毛毛结束了战斗，实则不然。【那四大天王上收兵罢战，众各报功：有拿住虎豹的，有拿住狮象的，有拿住狼虫狐骆的，更不曾捉着一个狠精。】如此的混战之中，能确保抓不住一个狠精，这需要有多么大的战场控制能力呀！因此，李天王从一开始就牢牢的驾驭着这圈剿花果山的战局。正所谓，进退有度，胜败得当。真正的胜利，不一定要在战场上取得。真正的强者，也并非取过于攻城略地，进退输赢，而是取决于是否能够控制整个战局的发展。军事的成败的延续。能够控制战争形势，使战局朝向对自己有利的方向发展的人，才是真正的胜者，真正的赢家。有时候军事上的失利，可以换来更大更多的经济和政治利益。毫无疑问，李天王就是这样一个富有谋略和远见的政治家、谋略家、军事家。齐天大圣坏的仙室向朝廷打小报告，既应该是他局中安排的。


    凡事都有意外。李天王没有想到的是，观音菩萨的到来，让整个战局都发生了化。变化的重点，就集中在李天王几乎丧失了对整个战争的主导权。这充分说明了“攘外必先安内”的重要性。朝中局势一旦起了变化，对外的军事策略也必须变相应变化。观音菩萨来进“蟠桃大会”，才发现大会不在。领众仙来到灵霄宝殿，见到了玉帝，才知前了前因后果。观音菩萨是何等精明的！她是怎么两三个人到话就可以轻易打发的吗？于是，立即派还惠岸行者去前线探虚实。惠岸行者的到来，大出李天王的意料之外。惠岸道明了来意，李天王立即安排他与悟空在花果山前后一战。惠岸不是悟空的对手，败阵而回。李天王立即上书求助，契机把本来应该是打死死死蛇的一场围剿战，再次一步演化为降龙伏虎的花果山立山大合战。当玉帝接到要求调天军总动员的时候，观音菩萨冷静的分析了当前的局势，提出调二朗显圣真君前来助战。观音菩萨是旁支近侍，她撇开了错综复杂、晦暗不明的朝廷局势，调地方实力派二郎神前来助战的确是上上之策。


    这—招直可谓是拔云见日。战场面貌焕然一新。二郎神奉旨前来，第一件事就是和李天王约定：请李天王不要再插手剿匪事宜。（免得的时候功劳分不清。）至此，李天王彻底丧失了对整个战场的控制权。'
  - '[PAGE 20]


    场最高军事指挥权，不再负责围剿战事，只不过给二郎神打个下手而已。二郎神与悟空战经三百回合，不分胜负。又经变化赌斗，亦不分胜负。不过，战局朝着对悟空不利的方向发展了。二郎神及梅山六兄弟已经将悟空围住，只是一时还未能成擒。可以说悟空败局已定。


    这个时候，观音菩萨打算出手了。太上老君作壁上观这么久，也坐不住了，拿出了《西游记》中有出现过的宝物中最厉害的宝物“金刚琢”。同时，还说了一番颇具深意的话，“这件兵器，乃锟钢炼的，被我将还丹点成，养就一身灵气，善能变化，水火不侵，又能套诸物：一名‘金刚琢’，又名‘金刚套’。当年过函关，化胡为佛，甚是亏他，早晚最可防身。等我去丢下打他一下。”【
    这段至少告诉了我们三点信息：1、“金刚琢”的来历简介；2、化胡为佛的历史；3、早晚携带此物防身。


    +   1、 “金刚琢”的来历简介。大概天宫的诸神都没有见识过这个“金刚琢”，要不不然为什么后来悟空请天宫诸神来降伏妖大王的时候，没人认识得此物。诸仙对于这个【
    善能变化，水火不侵，又能套诸物】的功能还缺乏真具体特的了解。


    +   2、化胡为佛的历史。老君当着观音菩萨的面，说到当年自己西出函谷关“化胡为佛”的历史，究竟是什么意思呢？难倒就不怕观音菩萨的脸吗？这其实，是老君在观音菩萨不要对天庭的事太过热衷。你们佛家的源头还不是我老君开创的呢！你一个小小的观音不要忘记身份，肆意胡来。观音听了这个话，不管是不是真的服气，但是的确没有说什么，安静下来了。


    +   3、早晚携带此物防身。老君最后说到此物是早晚就携带在身的。这说明，老君是一个非常谨慎的人。谨慎不会大意造次。此处更是说明了后面界大王通过盗取“金刚琢”而下界为妖，其实是不可能的。


    老君说出了“金刚琢”【 善能变化，水火不侵，又能套诸物】的诸般功能。可是，他是怎么来使用这个威力无穷的至宝之王的呢？【 话毕，自天门上往下捩，滚滚流流，径落花果山营盘里，可可的着猴王头上一下。】原来只不过是拿起来砸了悟空头一下。为什么不使用这宝物的本身灵性，套取悟空的金箍棒呢？其实，这不但经是一西很是重要的，老君既显示了宝物，同时又隐藏了宝物。根本没人能见识到此宝物到底是什么东西，只是知道这个东西很玄。到底，此宝玄妙到什么程度，只有老君自己知道。这个时候，老君不仅要收伏悟空，还要镇压诸仙，更要镇压这个观音菩萨。由于来天王的中味来毒，故易有养折，一个猴子打两天宫，已经常给诸仙诸位提着看话了。如果这个玩笑一味口下去，不仅有损朝廷颜面，同时有可能会招致诸仙对朝廷的怀疑，特别是观音菩萨对天庭的怀疑。“蟠桃大会”如此重要的一个嘉年华，竟然能让一个来历不明的猴子破坏掉。这样一个“事实”暗地里到底有几个神仙相信？很难说。太上老君肯定是不相信的。然而，之宝宝确实是按照这样一个逻辑，板一眼的想法，是必须要为这个闹剧做一个迅速的了结。这个时候，太上老君必须和王帝和天庭的利益统一阵线，这个时候再想想玉帝调如此大军不是没有原因的，而是向众仙表态，“蟠桃大会”确实是这款场搞砸的。老君不是不想套取悟空的金箍棒，而是在诸仙面前暴露实力。老君借二郎神的手，暗中击败孙悟空，目的不是说明孙悟空一定需要他太上老君来收伏，而是要通过这一举动作震慑诸仙。否则，达到这一目的就会是观音菩萨。相信满天神佛，包括玉帝、老君及观音菩萨在内，都有一个共同的疑惑，那就是孙悟空到底是什么东西。


    悟空因为受到老君的偷袭，又被啸天犬咬伤，最终为梅山七圣所捕。天庭的第二次围剿花果山的战役终于获得了最后的胜利。在二郎神及梅山七王得胜班师回朝的时候，二郎真君对梅山兄弟说到，“贤弟，汝等未受天箓，不得面见玉帝。教天数三军回来，我同天王上界回旨。你们帅众在此搜山，搜净之后，仍回灌口。待我请了赏，讨了功，再来同乐。”】这里的问题是，二郎神为什么要派他的兄弟在花果山搜山。二郎真君是派来助剿孙悟空的。现在悟空


    更多资源，关注公众号【懒人找资源】'
  - '[PAGE 21]


    被捉，任务已然完成，为什么要搜山呢？回想起二郎真君接受任务时大喜的心情，不由得感叹地，实力劣真君与土匪无异。他大喜无非是因为要发战争横财了。所谓的搜山，无非就是烧杀抢掠，也就是我们所说的屠城。两军交战，国宝掠财是不可避免免的。历史上也从来没有真正的避免过。


    悟空被捉，天庭是怎么处置的呢？【玉帝传奇，即命五大鬼王与天丁万岁，押至斩妖台，将这颗碎刹其尸。】玉帝处理的很干脆，勉强算是给了众仙一个交代。但是，没想到是新鲜天台悟空一点办法都没有。记得当年悟空学艺之时，师傅曾经说过他有三次之难。这第一难即为天雷。可是新鲜天台【刀砍斧斫，雷打火烧，一概不能伤损】悟空。这到底是因为什么哪？悟空到底有没有这护身的本领呢？天底下，不存在毫无来的伤害，悟空根本没有学过这护身法，必然不会这护身的手段。所谓的变化之法是集三火之法，全是胡说八道的。悟空此时琵琶骨被穿根本变化不了。之所以会出现这样的效果，完全是因为一样东西在护住他。什么？金箍棒内的如意珠。


    天庭如何来处置悟空呢？是个难题。这时候，太上老君就出面做了一个解释。【那猴吃了蟠桃，饮了御酒，又盗了仙丹，—我那五云丹，有老有须，被他都吃在肚里，运用三昧火，煅成一块，所以消做金银之躯，急不能伤。不及有说道头，放在八卦炉中，以文武火炼。炼出我的丹来，他身自为灰烬矣。】可这个解释站不站得住脚？不知道。从后面的结果来看，这个只是老君一厢情愿的猜想。这个真真这个办法，老君是急于解困。不能把天后的众仙都混在这里吧！更不能把玉帝王母也混在这里吧！方法是巧妙但，但是事情必须先提下来。其实，老君对于悟空的来历也很怀疑，很好奇。不过此处老君练悟空可不是因为好奇，而是另有安排，暂且不提。


    悟空在八卦炉里面练了七七四十九天，究竟是否如太上老君所愿化为灰烬呢？不但没有化为灰烬，还炼就了一双“火眼金睛”。这是怎么回事呢？八卦炉中悟空为猴天火站在袋位上，【把一双眼糊红了，弄做个老害病眼，故唤作“火眼金睛”。】且，后来取经路上的实践证明，这“火眼金睛”可不是什么都眼啊，而是具有一定识妖辟邪的特殊技能。为什么会出现这样的状况呢？还是那颗如意珠发挥了作用。在文武火的锻炼下，如意珠必然会被煎出金箍棒，放出璀璨光芒。在文武火的锻炼下，如意珠被煎炼，悟空就将它藏在了双眼之中。能够安然从老君的八卦炉中走出来，说明悟空是不怕热火的。这个过程，老君，对双股对八戒说道：【“你这呆子，全不知事！那时节用心防备，故此不伤；今日只为撇星火光，不曾捻避火诀，又未使护身法，所以把两脸毛烧焦了。”】悟空所说的【那时节】应该就是在八卦炉的时候吧！因此，悟空在八卦炉中之所以能够逃过文武火的伤害，是因为避火诀和护身法。当然，避火诀避不了烟，他的眼睛也确是被烟熏了。这个弱头被孩孩儿钻了空子，差点让悟空命丧黄泉。


