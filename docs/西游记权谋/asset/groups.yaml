    来熟的都是猴王吃了。】一定要看清楚这里说的是熟的大株蟠桃是让悟空吃了。那么，没熟的⼤株蟠桃去哪了呢？一千二百株⼤株蟠桃树的蟠桃都被悟空吃完了？这怎么可能呢？从取经路上的表现来看，悟空的⾷量并不⼤，⼀次也吃不了多少。⽽且，悟空也没有拿蟠桃当饭吃，只是三⽇⼀天去偷食⼀次。按照悟空的这个偷吃效率，要把这⼀千⼆百株桃树上的桃子都消耗掉，那得等到猴年马⽉呀！再说，悟空在七⾐仙女巡园之前还吃了⼏个桃子，难道是偏巧你⼀进来我刚刚吃完了这满园的大株蟠桃呢？所以说树上⼀个⼤桃没有是太夸张了，但是，确实也没剩⼏个了。桃⼦去哪了呢？


    悟空被七⾐仙女撩撩惊醒的时候，第⼀反应就是⼤吼了⼀句【“你是那⽅怪物，敢⼤胆偷摘我桃！”】这不奇怪吗？被⼈惊醒的第⼀反应为什么是这⼀句话呢？难⾔睡梦中已经发现小位姐姐在偷桃了？所以，第⼀反应就是要问为什么偷桃。


    中国古代刑侦史上有⼀个案例，⼀时之间找不到出逃，也不能断定其真假，但是影响不⼩。不过即使案情是假的，道理却是硬邦邦的。案情梗概简述如下：张三和李四是好朋友。⼀天他俩⼀起喝酒，李四说道明天将要出门做生意。于是第⼆天李四携带银⽀出门进货。没想到半夜死在离家门不远的⼭场⾥。天明之后，官府勘验之后认为是遭⼭贼抢劫⽽亡，随⾝携带的银两下落不明。县令在对⼭场李四⾏⾛作案情咨询的时候，发现李四兽对张三说⾃⼰将出门做生意。因此，张三成了怀疑对象。但是，此推测遭到了李四妻子的否认。为什么？李嫂说，事发当晚张三曾经来找李四喝酒。如果是他的话，怎么会跑来找李四喝酒呢？县令听李嫂陈述当时来找李四喝酒的情景。李嫂说，当时她已经睡下，只听到张三在门外⼤喊：“李嫂，李四兄弟在家吗？”后来知道李四傍晚出门，张三就回去了。但是，县令以此推断张三就是杀⼈凶⼿。最后张三伏法。这是为什么呢？因为，他来李家叫李四出去喝酒应该⾸先叫李四⼉⼦⽽不叫李嫂。他之所以叫李嫂，是因为他此时已经知道李四不在家，⽽且已经死了。他的⽬的就是为了制造不在场证据，以及对李四出门不知情的假象。张三的这⼀招本是很妙的，但是⾔⾔始終是骗不了⾃⼰，这在⼼理学上称为⾃我暗示。


    其实，悟空⼀开⼝就问是否偷桃，说明在悟空的⼼里有强烈的关于桃⼦被偷的⾃我暗示。所以，悟空早就已经发现这里的桃⼦被盜了。只是，悟空⼀直抓不到偷桃的⼈。因此，睡在桃树上，⼀半是潜忧，⼀半是困惑。没想到，婷婷园⾥却传出了“蟠桃⼤会”的事情。这个时候，悟空猛然⼤悟，⼤势不妙了。所以，“蟠桃⼤会”势必将发现蟠桃丢失之实。瞒不⼤了，告罪⼩，悟空可不是胆小怕担责任的人，关键是
    否起那⼈呀！


    其实，按照理最开始发蟠桃丢失的应该是桃园⼠才对。为什么不是整天候蟠桃⼠的，最清楚⼀线的情况了。要是蟠桃真的被悟空吃了⼏个精光，不报告给朝廷才怪呢？ 等这他们这么⼩孩们⼉来说是非？当时的情况⼀定是这样的：桃园⼠⼗将⼤批量蟠桃丢失的情况报告给悟空。悟空赶了个官⼠处⼩时毫，瞬股，打算⾃⼰某时来处这件事。这可就是悟空狗私舞弊，完全⼤脑袋逞能，不知深浅。所以，七⾐仙女来摘桃，下层的第⼀反应就是⽴即四处寻找大圣，他来处这件事。但是，⼀直找不到⼤圣，又不能进了蹊⽛，只好放进桃园。


    悟空找个借⼝打探去了，临走还⽤定⾹法定住了七⾐仙女。为什么呢？因为，直到此时他仍然要⽤到这个消息。在去瑶池的路上，悟空就发现了赴会来的赤脚⼤仙，证实了七⾐仙女的说法。于是，他⽤计哄骗⼤仙，⾃⼰化⼤仙⾃前去赴瑶池打探。他是怎么打探的呢？打探个屁。到了瑶池，喝⼏⾷仙酒，吃了⼏味⽅精⼦，就踏了。为什么呢？因为，他看到“蟠桃⼤会”已成事实，⾃⼰混不下去了，只好吃啥喝啥，准备趁坐。


    其次，我们还需搞清楚⾄底是谁偷了⼤把⼤株蟠桃。这个暂时还不知道。但是可以肯定的是不是悟空偷的。悟空免不了是吃了他⼏⾷蟠桃，但要把账全部赖在他身上，就未免有点不厚'
  - '[PAGE 18]


    道了。悟空回花果山的时候，对手下的小猴们说道：“ 一向这番玉帝相爱，果封做 ‘齐天大圣’，起一座齐天府，又设安静、守神二司，司设仙吏特旦。向后见我无事，着我代管蟠桃园。近因王母娘娘设
    ‘蟠桃大会’，未曾请我，是我不得他请、先赴瑶池，把他那仙品、仙酒，都是我偷吃了。走出瑶池，踉踉跄跄误入老君宫阙，又把他五个葫芦金丹也偷吃了。但恐玉帝见罪，方才走出天门来也。”
    悟空根本没提偷懒的事。这是对自家人讲的话，没必要说谎。再说其他的他都认了（虽然有点冤枉了），没理从桃树不认呀。这说明，偷吃了几个桃子根本就不算是什么大不了的事情，可说可不说。这也说明了悟空根本就没有把性子往绝里跑。要不然，还不拿出来炫耀炫耀？


    紧接着，悟空就荒唐了。他一路小跑就来到了兜率宫太上老君家里了，一看老君不在，就大把大把吃人家的仙丹。按照悟空原来的设想是要回齐天大圣府睡睡觉的，打算不要面子了，大不了让玉帝治一个失职之罪。但是，问题没有这么简单。这个时候，燃灯古佛来了。他来做什么？说是来和老君讲道的。这当然是个幌子。此行最明显的目的就是来参加
    “蟠桃大会”。观音都收了请帖，他老人家会收不到吗？但是，为什么他没去瑶池，却来兜率天宫和老君讲什么道？莫非是同志相见分外投缘？当然不是。原来那老君与燃灯古佛在三层高阁买凤登台上讲道，谈仙董、仙药、仙官、仙吏，都待立式左右听讲。倾囊而动感，乃再挨缘也别了这公台上呀！于是，很多人怀疑是燃灯古佛调开太上老君，好让悟空行窃。但是，这于理不通。哪有上门做客的，把人家的下餐仆人都叫走不干活吃的？对人家的大夫人那么关心悟空干嘛？情由于理，能够一个不剩的离开所有下人的，唯老君一人而已。再说，前面分析过，悟空醉酒的原因及目的只有如来一人知晓。燃灯老同志仍然是个局外人，他不可能这么高瞻远瞩、审时度势的帮悟空偷丹。多半是老君在瑶池碰见了燃灯，就邀他进府一叙。老同志嘛，上了年纪就这样，念旧、再讲了，老同志在一起话题也多了，一是，燃灯欣然前往。但是，老君就真的这么大意吗？把金丹就扔在炼丹房灶台边上也不收起来？当然不是。这是老君计划好了的。不管你悟空来不来偷丹，今天的金丹是丢定了。这大炼丹至丹房里面，亏却不过，但见丹灶之旁，炉中有火。炉左右安放着五个葫芦，葫芦里都是炼就的金丹。五个葫芦里面到底有没有仙丹，有多少仙丹，这恐怕只有老君自己知道。老君的葫芦，就算是再多的金丹，一个也就装完了。何须五个葫芦这么多？虚张声势，就担心老君不来了。孙悟空，一个醉汉能有多大数据了？就把这千千万的金丹吃完了？真相同只是心弦无了金丹，他舍不得拿出，就污蔑为仙佛玉偷仙了。当然，这是悟空自己不检点，是吃了人家几粒丹，就是不知道是不是仙丹。本来，老君打算报个遗失，先成与无头公案的，将来找个机会编锅给悟空这个闯祸的先锋。没办法多少年才出这么一个有裂缝的极品烂鸡蛋，还不趁机狠狠搞一搞，怪，然后把责任全部推在他身上。看见了吧，就算你是个烂鸡蛋，天庭的神仙们也要把他利用到极致，一点也不浪费。完美的天宫终于有了裂缝！偏巧你悟空不走运，跑到
    “案发现场”，撞到底口子了。老君守着八卦炉这个极品国有资产，却糊弄弊端、监守自盗，是真正意义上的国有资产流失者！把宝钏集团当成自家的作坊干呀！


    悟空吃完了仙丹，酒也醒了，意识到问题的严重性，干脆回花果山为王。可是，祸已经闯了。天庭的职能机构开始动起来了。先是玉帝一去告状了，接着造酒设宴的御监仙官也来报告了，老君也来招呼了。但是，这时候才听说五王派一注向孙悟室。这个时刻就是有了两个重要的人证，齐天大圣府仙吏和赤脚大仙。齐天府的仙吏报告悟空夜不归宿，赤脚大仙怒言空啸嚷。赤脚大仙真是知后知觉，在府门外站了一天一，也不找天打问一下。不说知道他笑好呀，还是说他别有阴差谋。齐天府的仙吏是有一点问题的。之前说过，天官是每三日点一次卯，做一休二的工作制，就算大圣一夜未归，也没什么大不了的。他们怎么就未未报告玉帝了呢？而且还是一竿子到底，直接就报到最高层那里来了，没有任何缓冲余地。早就说了，悟空是天庭的裂缝。


