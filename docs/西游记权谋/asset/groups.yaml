    玉帝不对取经队伍有所要求，那就意味着全盘接受如来的要求。反过来，也是一样。如来对取经队伍也是有要求的。这就是谈判之所以艰难的原因之所在，双方的要求不一致。等谈到一致的时候，谈判也就结束了，成功了。


    另外，奎木狼在执行任务的过程中，发生了一件意外。由于奎木狼自认为自己的任务失败了，所以在玉帝面前他没有敢提出来。奎木狼丢失了自家的法宝舍利子玲珑内丹。这个内丹为悟空所得，在之后的降妖过程中也发挥了重要的作用。


    本节之中，根据奎木狼的表现，可以说他的任务既失败了又成功了。在他自己来说，是失败了，没有能完成为难孙悟空的任务。对于玉帝来说，是成功的。玉帝并不是真的想毁掉取经大业，只是想提升自己的要求罢了。这样的结局，是玉帝老早就知道的，也是玉帝想要的。


    另外，玉帝对于奎木狼的惩罚其实是别有用意的。【玉帝闻言，收了金牌，贬他去免率宫与太上老君烧火，带俸差操，有功复职，无功重加其罪。】第一，为什么要让奎木狼去给老君的炉子烧火呢？看了一下回，就会明白老君是因为金奎银狼被派下去执行任务去了。第二，【有功复职，无功重加其罪。】这句话是什么意思呢？其实这是玉帝的个一箭双雕之计，表面上既是惩罚了奎木狼，同时也解决了老君的人手问题。更深一层的是，派奎木狼去监视老君的一举一动。否则，与老君烧火能立什么功呢？后来在第六十五回《妖邪假设小雷音
    四众皆遭大为难》中，五方揭谛去奏请如来降妖的时候，【玉帝】即传旨：“差二十八宿星辰，快去降伏妖怪。”】这里为什么要选二十八宿？奎木狼就在其中。这其实是在告诉我们的奎木狼已经立功而且官复原职了。至中他立了什么功？以及如何立功？暂且不提。


    有功就官复原职，没功就重加其罪，看来玉帝的命令很坚决啊。官场之中，送美女，送仆人，都是尔虞我诈之计，千万不可照单全收，而又高枕无忧啊。奎木狼的交出台牌既是一个任务的结束，又是另一个任务的开始。


    其实，回顾一下本节的内容，还发现本节之中，还照应了一个前文情节。表面上看，百花羞公主的命运与唐僧的母母殷温娇有相似。都是被虏抢身为妾的人，而且，悟空也试探出百花羞公主与唐僧的母母一样，也是一个知书识礼之人。身份、地位、经历等两者相似之处何其多。为什么百花羞公主可以活下来，而殷温娇却要赴死呢？至少，这说明了殷温娇之死与名节无关。


    # 第二十七回 平顶山大捷


    金角大王和银角大王为什么会出现在西天取经路上？


    【老君道：“不干我事，不可错怪了人。此乃海上菩萨问我借了三次，送他在此托化妖魔，看你师徒可有真心往西去也。”】从太上老君的话中看来，似乎是观音菩萨安排的一切，但是，当事人金角大王和银角大王的说法与老君的说法又不太一致。【那老魔闻得此言，唬得魂飞魄散，骨软筋麻，扑的跌倒在地，放声大哭道：“贤弟呀！我和你私离上界，转托尘凡，指望同享荣华，永为山洞之主。怎知为这和尚伤了你弟命，断吾手足之替！”】金角大王和银角大王承认自己是私自由界为妖的。而且，下界的目的也是占山为主，据洞为主，享受荣华富贵。但是，如果金角大王说的是真话，既然是为了享受荣华富贵那又为什么带着唐僧师徒的画像呢？【金角道：“……我记得他的模样，曾替师父记唐僧画了一个影，两个一个形，你可拿去。但遇着和尚，以此照验临验。”】金角大王并没有见过唐僧的模样，他如何记得他们的模样？而且，这幅画中有师徒四人，因此成画时间应在唐僧师徒全部到齐、队伍成形之后。金角大王已经在平顶山为妖多年了，而且还和当地的地头蛇九尾狐妖精结了幼妹之情、叙了母子之爱，他如何能够做出这'
