    # 第一章 大闹天宫


    神仙和妖怪有什么区别呢？


    一个代表正又善良，一个代表邪恶残忍？胡扯。神仙里面也有混蛋和流氓，要不然天条是干什么用的？令人憤慨的是，神仙里面更出道貌庄严的伪君子，经常让你防不胜防。当然，妖怪也不见得都是祸害。有些妖怪觉悟还是蛮高的，并且是一心向善，要求正果的。比如，白素贞就昰一例。就《西游记》中而言，一些山精树怪、巡山小妖之类的并无歹毒之心，甚至有些妖精还十分的单纯可爱。


    一个是法力无边，一个是势孤力弱？胡扯。荒唐。牛魔王的法力，轧死一群神仙饭桶。诚所谓“道高尺，魔高一丈。”道行压人呀！同一个等量级的神仙和妖怪，法力没有高下之分，也就是个一物降一物罢了。


    一个是道骨仙风、宝相庄严，一个是披牙咧嘴、神情猥琐？胡扯。荒唐。肤浅。不能因为人家不注重仪表就是说人家是妖怪吧？以貌取人可是可耻的。更何况，大千世界的审美标准到今天还没完全统一呢！


    那么，区别究竟在哪里呢？是什么造就了这个不可逾越的鸿沟呢？


    有人列出了神仙鬼怪妖魔的简单定义，判断时可以对号入座。具体粘貼如下：


    +   - 神，是指人死后灵魂升天者则为神；（此处区别于上古大神。）

    - 仙，是指活着的人（肉体）经过修行或奇遇而直接升天者则称之为仙；

    - 鬼，是指人死后灵魂不能升天者则为鬼，鬼入地下、地宫或地狱，也有游戏孤鬼；

    - 怪，是指没有生命的物体，例如木、石、物品、器具等，发生各种不正常的变异，称之为怪；

    - 妖，是指禽兽一类的动物、某些花卉，经过修行等能幻化成人形为祟为祸者，称之为妖；

    - 魔，是指人、神、鬼、妖等迷迷本性或未本面目，发生变性或变态，亦称“入魔”。例如，人心魔、魔障、“走火入魔”等等，人有神魔，鬼有魔鬼，妖有妖魔……所以魔不是独立的实体，而是一种状态。


    那么，我们是不是就以以此来判别神仙妖怪吗？当然不是。这样是不是就成了十足的独立论者了吗？有道是“英雄孰问出身”嘛！二十八星宿，都是动物，可是他们明明是位列仙班，不是所谓的妖魔。因此，完全照着重面的标准来划分神仙妖怪，过于机械了，没有抓住事物的本质区别。


    神仙和妖怪作为划分干部和群众阵营的两大身份标志，一定要把握住它的体制含义。根据目前国际国内形式，就像网友们提到的那样，他们的唯一区别就是：是否有正式编制。有正式编制的就是神仙，一切待遇从优；没编制的，或者是暂时没编制的，对不起，任你法力广大、道行高深，只有歧视，没有待遇。或者者，待遇霄壤之别。


    那么神仙竟竟有什么待遇呢？引无数英雄竞折腰。人鬼动物，花草树木，都想修炼成神仙，占个编制。简而言之，神仙有两大待遇：1、长生不老；2、终身制。


    1. 长生不老。长生不老并不是神仙的属性，而是神仙的待遇。这与我们通常的理解不一样。也就是说，如果待遇没有了，神仙也是会死的。第四十三回《黑河妖孽擒僧去 西洋龙子捉回》中有这样一段，（西湖）龙王见了，魂飞魄散，慌忙跪下，叩头道：“大圣恕罪！那厮昰舍妹第'
  - '[PAGE 3]


    九个地方。因妹夫错行了风雨，刻减了雨数，被天曹降罪，着人曹官魏征丞相，梦里斩了。舍妹无处安身，是小龙带他到此，恩养成人。前年不幸，含恨病故，惟他无方居住，我看着在黑水河养性修真。不期他作此恶事，小龙即差人去擒他来也。”


    “西海龙王的妹妹，是龙族，而且，还是八河督总管、司雨大龙神泾河龙王的妻子，当为神仙无疑。想必是因为，这泾河龙王犯下了天条，夫人也受牵连，没了待遇。因此才会病故。那么，这个长生不老的待遇究竟是什么呢？是蟠桃。蟠桃是神仙用以续命的仙果，长生不老之方。这是玉皇大帝节制诸神的法宝，也是他统领列仙真正的王牌。这个蟠桃，是由王母亲自裁种的，非同小可。在天庭这个不事生产的乐园里，唯有王母的蟠桃园是唯一的一块农业耕地。诸仙都不事生产，为何王母主如此辛苦？这个可是双仙的无上大法坐啊！列为神仙，种什么的都有，奇花瑶草，珊瑚修笙，就是不种地。因为他们知道，自己种了也没用。一日三餐都靠仙凤供奉，仙宫府第都是玉帝敕造。每天就到单位去打个考勤，基本上天庭是做一二二的工作制，神仙就是混日子的。当然这只是表面上的，后面我们会发现，就在如此优越的条件下，神仙还是勾心斗角，物欲膨胀。


    神仙的死，一般为劫数所致。就算拿了编制，受了待遇，吃了蟠桃，神仙照样要经历灾劫。打个比方，神仙吃了蟠桃可以长生不老了，但是如果他真一直长生，仍然会饿死。蟠桃只是给你长生不老的的可能性，而不是必然性。如来在须弥孙悟空之前曾对他说：你须即乃是个猴子成精，焉敢欺心，要夺玉皇上帝龙位？他自动修持，苦历过一千七百五十劫。每劫该十二万九千六百年。你算，他该多少年数，方能享此无极大道？看着，就连玉帝也要吃厉1750劫。不同等级的神仙每劫之间的间隔也不一样，高等级的间隔长，低等级的间隔短。吃了蟠桃之后，虽然照样要经历灾劫，但基本上应该没有什么风浪了，除非有意外发生。那就是在劫逃了。


    2.终身制。一旦占了神仙的编制，就是终身制。当然，终身制并不意味着永远也不会被踢出这个神奇的队伍。天蓬元帅、卷帘大将不是被踢出来了吗？不管是什么原因出来的，但至少证明了天庭有这么一个能进、能进能出的机制。泾河龙王更惨，直接就挂了。美国现在的公务员制度似乎模仿这个而来的。


    由于以上两大待遇的存在，使得原本看似简单的神仙界变得复杂起来。


    首先，就是神仙等级晋升的问题。这个难度太大了。人人都占着位子，个个还长生不老，偏偏又是终身制。因此，整个体制内部缺乏正常有效的新陈代谢机制（非正常的机制倒是有的）。因此，表面上是祥光普照，实际上是死气沉沉；表面上是风平浪静，实际上是暗流湍湍；表面上是团结友爱，实际上是猫脚小鞋；表面上是大公无私，实际上是物欲膨胀；表面上是毕恭毕敬、满面生辉，实际上是阴谋诡计、暗地摸索。


    另外，从体制外来看，想拿个编制实在是太难了。里面的一个都不动，外面的怎么进得去？大批技术过硬的修行应屆生被拦在编制外面，怎么办？像孙悟空这样的就违反了。但是，沉默的大多数，都借过鵪的技术自暴自弃进山训做散方，去为栖一方了。这样还得了，神仙们也不是白拿纳税人的供奉的。还得为民办实事不是？隔三差五，还得派几个城管下来巡查巡查。打个死老差，捉几个病苍蝇，不说话。每隔一段时间，还要办几件大案要案铁案，对上对下算是有个交代。当然，也不能做的太绝了，玉宇澄清，妖怪都无影无踪了，根源都会成问题。这叫以战养成。再说了，真是那样，也太打击修行者了。本来就是修编制不易，才来做妖怪的。这么搞下来，还赶来修行，成确了道？你讲的那一套谁还信？意识形态都成问题了。


    神仙和妖怪的本质区别搞清楚了。现在，我们再来看看这帮神仙和妖怪，一个是白编制的，一个是没编制的，究竟有什么能耐？


    在我们这些没骨凡胎的眼里，这帮鸟人，都是无所不能的家伙。其实，这都是由于我们缺'
  - '[PAGE 4]


    乏见识而造成的对他们的误解。


    不管有编没编，这部鸟人的能耐一般分为三类：1、法宝；2、法力；3、武艺。


    1、法宝。一般来说，凡是随身的法宝，法力必在其主人之上（或者特别用途）。否则，费神吃力修炼这个法宝，天天佩戴在身上干嘛？一方面，法宝是自己修炼出来的，其属性是可以挑选的，好的才费力去修炼，垃圾属性的早就扔掉了，还练个屁呀！另一方面，神仙也好，妖怪也好，对于自身的属性都面临一样的状况。谁也不能选择或者修改自己的属性。否则，大家都去修改自身属性了，还练什么法宝啊？法宝必定有其特殊之处，或补己之短，或展己之长。《西游记》里面有名的法宝不少，比如太上老君的金刚琢，观音菩萨的杨枝净水瓶，铁扇公主的芭蕉扇等等。


    2、法力。这个大致的跟三个因素有关：1）资质；2）师傅；3）时间。


    1）资质。这是修炼的前提。骨骼奇特资质好的，法力增长快，道行成就高；天性愚钝资质差的，就只能排在人家后面了。建议资质差的根本就不要去修炼了，浪费时间。当然，对于那些非要在这个世界上多挨几天不可的，也是没办法的事情。


    2）师傅。领路人很重要。拜错师傅，或者根本没有师傅，在修行过程中是要大走弯路的。搞不好，就死在小路上了。不光是师傅的学识极为重要，其他诸多因素也很重要。跟个邪魔外道的师傅，虽然不一定修不得大法力，但是一开始就在政治上处于被动地位，即便能抵挡所谓正教的断杀，将来拿编制也不方便。


    3）时间。时间的投入是修炼的基础。没有时间的投入，不会有根基深厚的道行。对于资质稍差的，勤勉补拙。


    3、武艺。这个是最次的能利用了。没有法力法宝，光有武艺就是凡人一个，是天生神力也没用，遇到神仙和妖怪照样被打得满地找牙。不过，这是神仙妖怪都会的技能。应该算是基本技能了。


    上述三种力量，法宝和武艺没什么可以讲的。一个特殊性太强，一个是普遍性太高。唯独每个神仙的法力很是令人琢磨不透。


    首先，《西游记》里面很多神仙似乎都能掐会算，万事皆知前后，万物通晓其理。这是一门什么技能？占卜。真的能够预测未来之既定公平吗？扯淡。神仙要是都能掐会算，来来回回搞个屁啊。那是神仙们拿来唬人的伎俩，神仙之间从来没平手。都是自己人，就不太用了。第八回《同我佛造经传极乐
    观音奉旨上长安》，观音菩萨领了如来旨意同木叉往东土上寻找取经人，遇到玉真观金顶大仙。（金顶）大仙道： “取经人几时方到？”菩萨道： “未定，约摸二三年间，或可至此。”看看，这个时候菩萨怎么不算了？大仙为什么也不算？什么二三年？胡说八道，唐僧取经前后用了十四年。差得也远远了。什么都算得死死的，哪里还有那么多的是非黑白？早就玉宇澄清了。最能裁的就是观音菩萨了，这个老夫人总是在孙悟空面前掐指计算，裁神弄鬼，喊的孙悟空不行。后来孙悟空不怎么能搭理她了。那个如来，也是夸张，手都不用伸，就我已知之。他妈的拽的不得了。恨不能冲上他的莲花宝座，将他的鹅梁贵顶的发型打个稀烂。其实，凡是能让他算出来的，不是事前安排好的，就是因为信息不对称而蒙骗的。孙悟空在乌鸡国算是过了神机妙算的瘾了。一般来说，领导掌握的信息比我们这些喽啰要全面，因此领导要在不同的下属面前装神弄鬼并不是难事。悟空这颗棋子去问大领导如来、观音，不要你才怪。可怜我们这些芸芸众生，被骗的城惶诚恐。


    其次，就是变化功能。看来去消除了法力随行的高深与浅薄的差异之外，法力上面的差异就只在这里了。无非是多一般变化，少一般变化的差异。虽说变化之术的本质是长生不老的必要条件，但同时变化之术也是一门辅助类型的法术技能。虽然变化之术没有直接的杀伤力，但'
  - '[PAGE 5]


    是却给我们的对战斗争增加了无穷的干扰。这门技能的普及使得敌我斗争异常复杂化。由于它的存在，所有人的身份都不再真实。间谍特务随处可见，栽赃嫁祸易如反掌。想要辨明是非真假，不中计，不上当，我们必须发扬提神疑经的可贵精神。记住这一点，对于识别西路上的邪魔坐仙的阴谋诡计尤为重要。


    同时，我们还要注意区别一种情况，那就是变化而来的人身和修炼而来的人身是不一样的。唐僧师徒路过通天河的时候，驮他们师徒几个过河的那个老鼋就曾拜托唐僧请示得人身的机会。这说明妖精修炼务必要达到一定的火候才能得到人身。而且，这修炼来的人身与变化而来的人身存在着本质上的区别。只要修炼出了人身，那么妖精已经得到的人身就是固定不变的了。与此同时，妖精也就算是脱去本壳了。不过，一般来说，妖精脱去本壳似乎总是脱不干净，总还是留有一些特殊的痕迹。通过这些根基层，我们不难辨认出他的本身。而变化之术不一样，它会依据施术之人的道行千变万化，随心所欲。更重要的是，修炼到的人身不能增加妖精的命数。所以，不少被悟空打死的妖精虽然也是人身，但也显出了原形，魂消魄散。这些妖精的人身就是通过修炼得到的，没有增加命数。比如，黑风山的白花蛇精，黄风岭的黄虎，以及黄花观的“白瞳”等等。


    另外，很多人人都想知道，《西游记》里面谁最厉害。如来佛？玉皇大帝？还是，太上老君？如来佛几次出手，法力无边，是可见的法力最高强的巨无霸。太上老君拥有全书中所提及的所有的宝贝中最厉害的宝贝金刚琢。玉皇大帝，从未出手，深不可测。都想知道，要是他们几个动起手来，谁会占上风。但是，《西游记》不是武林大会实况转播。真正的高手是运筹帷幄的智者。求的是不战而屈人之兵。兵法有云：“故上兵伐谋，其次伐交，其次伐兵，其下攻城。”《西游记》注定是一次“伐谋”、“伐交”的盛会。那种神魂比力道的活儿，是天桥底下练艺卖大力丸的人干的。领导是不会做这个掉身价的事的。


    总体上来说，每位神仙的能耐都是有限的，而且路数极窄，并非无所不能。道行固然有高低，但这跟武艺较量是一回事。能一级高下的就是法宝，但共特殊性较强，没有多大的可比性。此是一物。


    另外，我们还发现，天庭这块土地上只有皇宫府第，没有市井繁华。也就是说，神仙界里没有市场经营。因为不事生产，所以就没有生产资料如何分配（特别是土地分配）的问题；天庭内部也没有商品贸易，自然也没有货币流通了；另外，产品按等级超需求（马克思也是按需求分配）分配。天庭俨然是一个等级森严的超共产主义社会了。当然这个超共产主义社会是封闭的，对外仍然存在这市场交流。要不然，神仙拿俸禄干嘛啊？这也充分说明了，经济基础没有了，社会政治依然存在。政治是一个永恒的话题。


    下面，我们再说说神仙和妖怪生活上的一点区别。


    我们按照原来的说法周天子之内有五仙五虫，共计十类。五仙分别是天、地、人、日、鬼。天仙神仙的生活区域是在天上，入仙地仙生活在凡间，鬼仙在幽冥界。生活在天上的按日计，生活在凡间及幽冥的是以年月日计时。因此，天庭是不计年月的，另外佛祖也曾言他那里也不计年月。所以，书中所提到年月皆是指凡间的年月概念。具体换算公式是，天上一日=地上一百年。因此，天上的神仙说一年其实是说凡间的一年，就是指天上的一日。想来，玉帝无始无终无来无去，是万世之主宰，天庭是注定一成不变的，因此根本没有纪年的需要。再说历法年月以天上星象轮转为依据，星象轮转一周天就是人间一年，天庭就是纪年也没有依据参照了。


