    圆”呀？这不是明白着叫娇娇搞掉儿子吗？按照这话明面上的意思，父子团圆还说的过去。（人家父子本来就可以团圆的，是菩萨偏偏来搅和的。）


    接着梦醒了，娇娇被这连菩菩吓带暗示的话给吓坏了。这时候，也发生了一件奇怪的事。刘洪回来什么没干，就要杀掉这个孩子。还是“谋杀”，刘洪是水贼做出职业海啦？杀人也要用水。为什么我说这里奇怪呢？抛开前面的话不用说。看看刘洪这两天的反应，就很奇怪。这一天，本来是“刘洪公布远出”，后本生下孩子，“忽然刘洪回来”，接着“幸喜及早叫刘洪有紧急公事远出”。大家有没有感觉到这对刘洪的行踪有点疑惑。


    下面我们就来分析一下这个对阀。前面说过，这个刘洪在整个事情中只是个不起眼的角色。其实，错了！这个刘洪绝非等闲。在取经结束之后，观音派出的保护唐僧的护取眼神在向观音菩萨缴旨时提到了唐僧经历的九九八十一难：【“蒙差诸调皈依旨，谨记唐僧难数清：金鞭遭贬第一难，出脑凡杀第二难，满月抛江第三难，寻亲报冤第四难，……路经十万八千里，圣僧历难簿分明。”】这说明四值功曹、五方揭谛他们早就开始注意唐僧的一举一动了，也早就开始记录唐僧的受劫了。不光如此，他们还是唐僧受劫的暗中操作者。这个四值功曹，不知道大家熟不熟悉，他们是天庭的值班神仙。这四位神仙分别是：值年神时罗刹，值月神景薰乙，值日神周急，值时神刘洪。
    今天说，一直在李世民边相住的就是这位值日神刘洪。如果没有他，李彪如何能在“玄武门之变”中虎口脱险？如果没有他，李彪如何能结识宰相名媛？如果没有他，娇娇怎么会一一弃即中除光蕊？如果没有他，李彪如何能逃出京城？如果没有他，江州怎么会十八年红颜不倒！


    那么，刘洪为什么要这么做？这是一个早就精心布置的局。直接目的就是寻找一个皇室后人作为取经人。金蝉子的身分缺陷是其需要转世成佛的原因之一。寻找一个愿意出家取经的天潢贵胃非常之困难。从后文来看，朝廷之上有人直接攻击佛法又目无君父之耶名，说明佛教在大唐的地位堪忧。因此，“玄武门之变”恰洽为佛教创造了机会。暂且不提。刘洪直接从皇族里面挑出一个皇子李彪来，可惜晚了一步，不是金蝉子转世。因此，只能从下一代身上着手。为了能够让唐僧早离开是非圈，所以一出生就设计迪士尼娇娇让她抛弃孩子。南极星君的梦中之言，说什么【刘贼若回，必害此子，】其实是恐吓娇娇的。而且，刘洪莫名其妙非常及时的抽身回来印证这个梦，娇娇被吓坏了。为鸟国的经历证明，梦是需要经过验证的。否则，谁会信？她真正的把孩子扔到江里去的。她去江的时候，什么器具也没带，就是那块救了唐僧命的板还是神仙安排好从江上游飘过来的。刘洪在江州十八年，其实就是为了暗中保护出家人唐僧。唐僧虽然多难，但在这十八年中却是异常安全。寻亲报仇是唐僧灾难新的开始。这里采取搭接的顺序是先出走，再报仇。因为，先出走就保证了取经人进入无君父之耶名显赫必须要报仇。如果不使他声名显赫，唐僧取经即便成功也没有任何意义。因此，娇娇让唐僧报信复仇其实是对故事的。娇娇根本就没有什么仇可报，最多就是对不起除光蕊罢了。这些都是刘洪安排的。自从南极星君来过之后，娇娇杀儿子就被刘洪动持了。


