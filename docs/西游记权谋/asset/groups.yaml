    # 有玄机。


    但是，之前悟空已经进去勘察过了，是黑风洞中并无异常。其实，这黑风洞中的破绽就在那点破悟空身份的小妖身上。【正】查处，只见有一个巡山的小妖，来报道：“大王！祸事了！下请书的小校，被行者打死在大路旁边，他缔着袈裟儿，变化做金池长老，来骗佛衣也！”【悟】悟空打死小妖并趁机变化金池长老前来骗取佛衣这件事，这个小妖是如何得知？难道他看见悟空行凶了？理论上有可能。但是，这个小妖报名时，金池长老就在面前，他为什么不直接指出这个金池长老是假的，而是面对大王说出这一番极为精简而又到位话呢？【被】行者打死在大路旁边】中的这个称呼【孙行者】，而没有直指眼前的孙悟空，这说明小妖根本没有注意到面前的这个假金池长老修行。否则，他应该直指修行者说出这番话。从小妖说话的语气上看，他只知道悟空变化了金池长老来骗袈裟了，但是并不知道眼前的这个金池长老是真是假。事情必然是这样的：这个小妖前来报告是受人指使的，他跑来没头没脸的说出的这番话是别人教的。小妖只是在背书，既紧张又害怕，所以话语情境才不对。这番话虽然简单，但是这件事的前因后果全部说的清清楚楚，没有一点疑问，可谓精当！稍加留意就不难看出这话是事前准备好的。那么究竟是谁在暗中操纵这一切呢？正是因为这些人存在，黑熊精才几次三番的罢场回洞来请示下一步的动作。其实，并不是黑熊精想要来来回回的变悟空，而是因为悟空的每一处出现都有点令黑熊精措手不及。所以，仓促上阵的黑熊精还没明白下一步的指示就与悟空交手了。所以，黑熊精不得不找出来主持利弊的。


    想要拨开云雾青天找出这事主使之人，就必须排除干扰找出这件事的最终受益者。黑风山一劫，真正的最终受益者只有一个人，那就是观音菩萨。因此，这个躲在黑熊精背后的人就是观音菩萨。观音菩萨欺骗唐僧，借他之手给悟空带上了紧箍儿。难道这件事就这么了？观音菩萨就用甩手手摔灰安心回落海落伽山了？不能。观音菩萨一定会关注悟空的反应。【菩萨道：“这猴子说话，这等无状！既是熊精偷了你的袈裟，你怎来问我取讨？都是你这个孽獭大胆，将宝贝卖弄，拿与人观看，你却不知，唤风发火，烧了我的留云下院，反来我处说刁！”】前面说过，从来不相信谁有什么知识文未来之事的能量了。就是关于菩萨一直在关注悟空的明证。果不其然，悟空借机烧毁了观音禅院。观音也趁此机会，教训一下悟空，力图真正当心志上收服孙悟空。于是，她瞒黑熊精前借袈裟的真实原因让黑熊精转趁盗取锦镧袈裟。但是，她又担心唐僧和悟空师徒不在这个新的圈袈裟。如果师傅让两个原地转几圈，我不就放弃，那么观音菩萨不是搬起石头砸自己的脚？所以，他就让黑熊精去请金池长老过来请赞佛衣。但是，事情出了意外，金池长老真的来了，黑熊精倒是真真的有点不知道该怎么办了。小妖点破了悟空的身份之后，黑熊更是不知该如何收场了。没关系，先不管方丈回去再说。


