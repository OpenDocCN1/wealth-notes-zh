    那么，这个怎么来解释呢？


    首先，满堂娇做了未婚妈妈这事，老二一开始肯定是不知情的。等到后来发现的时候，已经晚了。当然要追问女儿是谁的。满堂娇哪里敢说啊？来个"绝不是开口，神仙难下手"的一味的抹固体。这里注意，满堂娇之所以不交代，肯定是有原因的，绝不是因为害怕父母责罚。因为，如果不是特殊原因，满堂娇说出父母时难于颜面也不得不答应这婚事。总比，抛绣球卜婿常讲啊。连这个办法都用了，还有什么人不能接受的？丞相府开山是什么？开国元勋，一代武圣啊。能把丞相府修到紫禁城边上的有人。何等身份？何等荣耀？何等荣耀？哪里受得起这么个窝囊气？一问三不知，肯定要与女儿翻脸了。虽然，最后勉强答应了抛绣球卜婿的办法，但目是最终还是与女儿决裂了。因此，大婚之时，高堂在上，仍然不受一笑。


