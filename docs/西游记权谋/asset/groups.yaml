  - '[PAGE 61]


    的。当然，也就不可能答应。那么有没有调整的余地呢？没有。观世音菩萨设的这个局，本来就是死局。唐僧娶了三个女儿中的任何一个，师徒之间都会乱了辈份。只有一个办法，就是三个女儿都嫁给唐僧，但是八戒第一个不答应。而且，菩萨们也不会提出这个方案。所以，唐僧只能是装聋作哑，沉默不言。不是不答应，是不满意。


    由于八戒不住气，轻浮冒进，使得唐僧不得不正面表态。唐僧表态之后，言辞上得罪了莫家太太。莫家太太提出：既然唐僧不愿意留下，可以着一个徒弟留下入赘。唐僧没想到莫家太太的立场是如此的不动摇。他只说了句场面上的客气话，莫家太太就当真了，立即放低要求往回撤了。于是唐僧提出让悟空留下。悟空不答应，推给八戒。八戒作难，说要从长计较。唐，又推给了沙僧。没想到沙僧蹦出了菩萨来，正式宣告了这件事情从理论上破产。真是哪壶不提开哪壶啊！唐僧一定很郁闷！


    一件在理论上已经宣告破产的事情，八戒还是贼心不死。他借口放马，到后院与莫家太太商议妥当，私定了终身大事。不想计划泄露，被悟空识破。悟空将事情的原委一五一十都告诉了唐僧及沙僧。当莫家太太再度出现的时候，师徒合力推荐八戒留下入赘。此事唐僧没有参与，不赞成也没有反对。八戒跟着莫家太太到了里屋，被菩萨们以擅天婚的名义折腾了一番。最后，又使八戒穿上了动了手脚的珍珠缎褂衬衫儿，把八戒吊在树上一夜，以示惩罚。第二天拂晓时分，唐僧才省悟来发现莫家庄园消失，悟空这才道破天机。此时，唐僧的反应是【合掌顶礼】，唐僧的心里会怎么想？庆幸，幸亏没答应，要不然吊在那里的就不是八戒一个人了；怨恨，原来悟空早知道是菩萨前来考验了，竟然不事前通知一下，害得师傅差点出丑；同情和感慨，其实自己和八戒想的是一样的，好在八戒冲在了前面，挡住了子弹。有了这一次教训以后要当心些；漂亮的女人都要仔细提防，因为有可能是菩萨变的。唐僧活得真累啊！


    那么这一次四位菩萨劳师动众的跑来取经路上设计庄严，变化美色，就是为了考验唐僧师徒是否合色的吗？当然不是。你以为菩萨们都得闲慌了？再说了考验也应该放在选取取经人的时候，而不是现在已经上路取经了再来考验。观音菩萨将取经什么样的人呢？她会做这个没有把握的事吗？既然选取了取经人，就不会错。就是错，也能采取到直接，有句话怎么说来看的：“说你行，你就行，不行也行；说你不行，你就不行，行也不行。”有紧箍咒这样的法宝在手，我管你是不是真心取经来的。那么，这一次四圣来此设下这个死局目的目的是什么呢？就是召开取经誓师特别大会。这件事是紧接在沙僧受戒之后，此时取经队伍人马刚刚聚齐，正是召开取经誓师大会的时候。这次大会有以下几个议程：


    +   1. 敲响警钟。取经队伍不要三心二意。否则，八戒就是下场。

    2. 整合队伍。临时组建的队伍需要召集人做一次集中训示，否则队伍涣散，影响效率。通过考验，表扬了先进，鞭笞了后进。团队建设上了一个层次，精神风貌焕然一新。

    3. 工作验收。取经队伍成员是否都已经到岗了？目前的状态如何？文殊普贤作为如来的侍从前来视察并验收观音的前期工作成果：取经队伍。


    文殊普贤作为如来的侍从前来视察并验收观音的前期工作成果：取经队伍。


    家山母作为第三方也全程陪同视察，见证并监督了验收工作。最后，验收工作小组给出了验收报告：【圣僧有德无尤俗，八戒无禅更有凡。从此静心须改过，若生怠慢路途难！】看来八戒给领导丢脸了。


    这一次观能够顺利通过验收，不是依靠师傅们的坚定信念，而是因为观音菩萨的巧妙设计。如果不能观察菩萨事前巧妙设下这个死局，恐怕唐僧师徒难过这一关。如果唐僧师徒过不了这一关，则前期工作不到位，观音菩萨要对此负主要责任。这充分说明了是否能够顺利通过主管部门的检查和验收，关键还是依靠领导。'
