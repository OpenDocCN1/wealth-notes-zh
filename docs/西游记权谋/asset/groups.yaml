    # 第二十二回 黄风岭上的 “ 左” 倾机会主义分子


    黄风岭之难可算是西天路上取经队伍遇到的真正的第一难。黄风大王的虎先锋寻山，捉凡人与大王做个案酒，恰巧与取经队伍在坡坡上撞个正着。一番较量之后，虎先锋用了金蝉脱壳之计，使狂风搅走了三藏。


    黄风怪见虎先锋捉来了三藏，弄清了指由之后，第一反应是【且莫吃他着。】为什么不等着吃呢？虎先锋也觉得奇怪。理由有三条： 1、唐僧的徒弟特别是孙悟空不好对付，担心吃了唐僧之后，悟空前来报复；
    2、将唐僧馋条儿几刀，身子清翠，口味好； 3、等上三日三宿若不损闹之后，可以细想享用唐僧。这就是三条经典理由。取经路上要吃唐僧肉的五妖怪抓住唐僧之后，不吃唐僧的理由，大致不出这三条。在这一点上，黄风怪可算是开了先河了。后面出场的无数妖怪在战略上无非都是在模仿黄风怪，复制黄风怪，不过战术上稍有不同罢了。这三条经典理由，真可谓是妖怪们出来打江山的
    “ 三大注意（八项纪律）” 啊！这 “ 三大注意 ” 构成了取经路上所有妖怪和悟空斗智斗勇的战略理论基础，是妖怪们 “ 抓、等、斗三走 ” 经典战斗模式的理论渊源之所在。


    我们说如来是推动整个谈判向前推进的主要力量，是谈判的幕后策划者。当然，玉帝是另外一个谈判幕后策划者。因为他也需要彻底解决势力范围的问题，至少是达成一个目前来说双方都能接受的妥协。但是，为什么三教队伍一上路，第一个跳出来找茬儿的就是如来的门下呢？如来不想谈判继续下去了吗？当然不是。


    到目前为止，我们只是分析了天庭的政治局势，对于灵山大雷音寺的政局尚未剖析。按照我们一般的惯有的思路， “ 名门正派” 都是表面上团结互助、友爱尊重，其实背地里尔虞我诈、勾心斗角，结党营私、一盘散沙。
    雷音寺上的政治局势就是这副调控。 而作为反派面皮出现的 “ 邪门歪道 ” 却都是义薄云天、肝胆相照、万众一心、表里如一。那么，在这如来领导下的佛派作为一支不择手段的扩张欲极强的反叛势力，是否真的是铁板一块、毫无破绽呢？答案是'
  - '[PAGE 58]


    否定的。我们切忌将人与事的理解脸谱化、标签化。其实，佛派人部也是风云迭起、险象环生、暗流涌动、波涛汹涌。这个黄风怪的出现，其实暴露了佛派人各支势力表面上齐心合力、同气连枝，但实际上内部也是千戈绞绕、纷争不息。如来决意问鼎天下，玉帝坚持改革开放。两位帝尊，一位是一心要实现宏图霸业，另一位是要稳固基业永续。因此，他们既要外争国权，同时更要内求稳定，确保政权不易于。"攘外必先安内"，对内对外的政策一定要互相衔接，互相配合。因此，如何处理好内因与外因的矛盾，是一个摆在领导人面前的巨大难题。这不仅需要超凡人圣的领导艺术，更需要雄视三界
    的宏 大目光、君临天下的王者气魄以及起苍龙振 的 军政能量。这就是两位领导人决意通过谈判来解决问题的国内外政治气候。从两位老人家的能量及智谋来看，可以说整体上没有问题，但是在局部地区还存在很大的变数，没有完全做到尽在掌控之中。


    为什么说黄风怪暴露了佛派势力的内部裂痕呢？我们先来看看，灵吉菩萨是怎么来介绍黄风怪来历的。（灵吉菩萨）对行者道："他本是灵山脚下的得道老鼠，因为偷了琉璃盏内的清油，灯火昏暗，恐怕金刚拿他，故此走了，却在此处成精作怪。如来照见了他，该死罪名，故着我看辖，但他伤生造善，拿上灵山；今只冲撞大圣，陷害唐僧，我拿他去见如来，明正其罪，才消这场纠缠哩。"【这个黄风怪是一只得道的大鼠。"得道"二字在佛教之中是什么概念呢？根据大乘佛教的果位排名，"得道"二字意味黄风怪者至高可以是一尊佛，至少也是一个罗汉。也就是说，黄风怪的果位处于罗汉与佛陀之间，有可能是罗汉，菩萨或者佛陀。这样一个地位的得道者，会去偷如来的灯油吗？当然不会。因此，这是罪名是莫须有的。悟空刚到小须弥山道明来意的时候，灵吉菩萨对悟空解释到：【我受了如来法令，在此镇压黄风怪。如来赐了我一柬"定风丹"，一柄"飞龙宝杖"。当时被我拿住，饶了他的性命，放他去隐性归山，不许伤生造孽，不知他今日欲害师。有违教令，我之罪也。】从灵吉菩萨的入口里可以大致知道黄风怪为什么会在黄风岭作怪。黄风怪偷了灯油之后，逃到黄风岭黄风洞避难。结果被如来发现，如来派灵吉菩萨前来镇压。灵吉菩萨按黄风怪之后，就地释放，让他隐性归山（羁押
    黄风怪），没想到黄风怪在黄风岭依然成精作怪、伤生造孽，并且无意中冲撞了唐僧师徒。那么，灵吉菩萨受如来法旨羁押黄风怪，为什么羁押地点不选在小须弥山而是选在离小须弥山
    两 千里之远的黄风岭呢？ 我们再来看看这个佛先锋。虎先锋初遇唐僧师徒，一番交手，竟然虎口拔牙，从悟空八戒手里盗摄了唐僧。这说明这个虎先锋并不是等闲之辈。一观《西游记》里面的山大王，能有如此法力和智谋的妖精做先锋的，唯此一黄风大王耳。这里面有什么讲究吗？


