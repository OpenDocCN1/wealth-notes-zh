- raw:
  - '[PAGE 97]


    案情简单，却只是原告被告难以区分。


    虽然，书中的区分真假悟空是从沙僧和悟空回到花果山遇到另一个悟空开始的，但是，我们区分真假悟空要提前一个环节。我们首先要搞清楚，水帘洞口的悟空和潮音洞中的悟空哪个才是真的悟空。不要忘了，自从悟空离唐僧而去之后，真假悟空就开始混淆了。辨别要从源头开始，从最能肯定的地方开始。否则，要是起步就错了，结果就没谱了。花果山的悟空是假的。何以见得？假沙僧被真沙僧打死后，水帘洞口的悟空是怎么处理的？他把那只死猴子吃掉了。真悟空会吃掉自己的子孙吗？不会。因此，花果山的悟空是假的。这一点对后文很重要。因为，菩萨并未辨别过来到自己跟前的这个悟空，要是这个悟空是假的，对于后文的推测影响较大。两个悟空一经交手之后，真假难分了。自此，“真假美猴王”的官司算是彻底打响了。两个猴头开始四处告状了。


    首先，他们来到了南海观音菩萨处，请菩萨证明正身。菩萨领众人先是看看多时，不能分出真假。于是想出了紧箍咒之法，但是没用奏效。这里的问题是，为什么紧箍咒没有奏效？前面已经说过，紧箍咒的机密已经泄露了。而且，悟空头上的紧箍咒也没有了。这里需要仔细分析一下这个问题。这与揭开六耳猕猴的真实身份有直接关系。


    根据前文的推断，紧箍咒的机密是在乌鸡国被捣的，紧箍儿是在车迟国被卸掉的。因此，紧箍咒判别法在此失效的原因必然与此二节内容有关。从乌鸡国那一节的结局来看，盗走紧箍咒机密的是文殊菩萨的座骑青毛狮子。但是，很有可能这个青狮是假的。为什么这么说？


    > 首先，我们来看看这个文殊菩萨是怎么收伏这个青毛狮子：**【那菩萨中取出照妖镜，照住了那怪的原身。】**这个文殊菩萨很奇怪啊！收伏自己的坐骑怎么还要依靠照妖镜？在狮驼岭那一节结束的时候，文殊菩萨也来收伏自己的青毛狮子，怎么不用照妖镜了？因此，此处使用照妖镜的目的实际就是向悟空透漏这个青毛狮子不是其他妖怪变化而来的。


    既然这么说，问题又来了。第一，悟空的火眼金睛不能识别此怪物吗？第二，三界的人都知道照妖镜是托塔李天王的宝物。这个李天王看宝贝怎么到了你文殊菩萨手上了？第一个问题，悟空的火眼金睛是不能识别此怪物的。这个的解答需要和照妖镜的功能联系在一起。暂且不提。至于第二个问题，其实这个照妖镜到底是真是假根本无从认定。但是，由于悟空也不能识别这个妖怪，所以不论这个功能是真是假，对于达到欺骗悟空的目的没有丝毫影响。


    下面我们就结合照妖镜的功能来仔细分析一下，达到火眼金睛的功能，也解释一下悟空为什么不能识别这个假狮子。悟空的火眼金睛在一路上的功能似乎不太稳定，令人看了颇有几分恍惚之感。这一点，我们先放一放，但看这个照妖镜的功能。


    照妖镜在全书总共出现过四次。第一次出现在花果山，用来照定妖怪孙悟培，在李天王手上；第二次出现在乌鸡国，用来收伏青毛狮子，在文殊菩萨手上；第三次出现在本节，用来辨别真假悟空，在李天王手上；第四次出现在火焰山，用来收伏牛魔王，在李天王手上。其中第一次和第二次，功能是一致的，为镜子外面现本相；第二次和第三次、四次功能是一致的，为镜子里面现本相。


    先来分析镜子外现本相的情况。第六十一回【猪八戒助力败魔王 孙行者三调芭蕉扇】中，**【才要变化脱身，又或被托塔天王将照妖镜现住本象，猪都不能动，无法逃生，只得“莫伤我命！情愿归顺佛家也！”】**可见，照妖镜照住本相之后，妖精就无法挪腾了，只能乖乖受缚。注意，是本相之相后方才收此功能。照妖镜四次出现，完全可以证明照妖镜能够使妖精自身现出本相。否则，对付牛魔王李天王直接上照妖镜就可以了，根本不需要哪吒出手了。但是，这一点却和二调花果山时的情形是矛盾的。怎么说？当初二郎神让李天王用照妖镜照住悟空，但是悟空还是千变万化，上窜下跳，甚至都跑到灌江口去了。这是怎么回事呢？联系当时的情况，李'
  - '[PAGE 98]


    天王在放水。他根本没没用照妖镜照住悟空的本相。否则，悟空任何一般变化都使不出来。


    再来分析镜子里面相本相的情况。不管文殊菩萨手上的照妖镜是真是假，应该说这两次都是失败的。要弄清楚这一点，我们必须结合妖精和神仙的本质区别来分析。前往说说，妖精和神仙的本质区别就在于是否占有编制，是否享有国民待遇。为了确保神仙的编制和待遇不出错，所以神仙必须买仙录。何谓仙录？神仙的凭证，身份证也是。因此，所有的神仙都是登记在册的。而那些不在册的神仙，就是所谓的妖精了。于是，神仙系统是有数据库的。这个数据库的数据是自动及时更新的。其道理和地府的生死簿是一样的。因此，照妖镜实质上就是具有数据检索功能的身份（本相）识别仪。它的数据和天庭的仙录数据库是同步更新的。当一个未知身份者出现在照妖镜面前的时候，照妖镜根据其本相就会自动搜索数据并将结果显示出来：没有数据的就系统报错，有数据的就显示本相。因此，对于不在神仙系统注册中的妖精，照妖镜只能是系统报错，跟普通的镜子没什么区别了。由于悟空和六耳猕猴均不在系统中，所以这个照妖镜对他们来说就是一面真通道的镜子。就算乌鸡国的青毛狮子是真的，在真的照妖镜中也不会现出本相，顶多就是一副道士相。因为，青狮不在“蟠桃大会”邀请之列，换句话说它不在神仙系统中。因此，乌国国女方菩萨手上拿的照妖镜是假的，青毛狮子也是假的。


    因此，照妖镜的功能有两方面：1、镜子外面可以照住妖精本相，使其不能动弹；2、镜子里面可以识别身份，照出神仙本相。


    明白了照妖镜的实质，关于火眼金睛的解释就简单多了。其实，火眼金睛的功能和照妖镜里面的功能是一样的。至于为什么悟空的如意炼妖镜的火眼金睛有如此之功呢？只能是作者的/system
    settings了，不可解释。所以，西天路上悟空的火眼金睛的功能才那么不稳定。神仙变化的妖精能识别，但是不一定都识别。比如奎木狼，600年前见过面，时间太长了，没什么印象了。奎木狼倒是认识他的，但才形象模糊了。再比如青牛精，悟空一眼就看出来了。但是，野妖精悟空就看出来了。很多情况下，悟空是靠看杀气，看凶气，看黑气，以及靠常识推断，连猜带蒙的。比如白骨精之类的。再比如观音菩萨，没了仙籍之后，悟空也是认不出来的。悟空是祥云才端出来推断的。


    接着前面的思路继续分析，既然这个青毛狮子是假的，他知道紧箍咒的秘密，那么毫无疑问这个青毛狮子和六耳猕猴必然有联系。而且，可以断定这个青毛狮子和六耳猕猴是一类人。为什么这么说？因为想要紧箍咒彻底失效，除了要知道紧箍咒的秘密之外，还必须具备能够听到念咒人的所念咒语的本能。否则，不但有可能错过吉祥的时机，还极有可能被假咒试探出其身份伪装。万一观音菩萨念的是假咒语，六耳猕猴却在一边诵不欢喜，岂不是露馅了？因此，这个假狮子就是六耳猕猴。但这么做则糊了，“真假美猴王”案和假青毛狮子的身份识别问题可以并案处理了。只要能够揭穿假青毛狮子的真实身份，这个问题就迎刃而解了。这个问题权且放过，继续关注此事态的进一步发展。


    既然照妖镜不能识别真假悟空，那么玉帝为什么又让齐天天王拿出这个东西来照验呢？因为对于六耳猕猴的出现，玉帝也是不知情的，他必须要判断出这个妖精是否与天庭有关系。这个名为照妖镜的宝贝其实是照仙镜。玉帝一看到照妖镜不能分辨真假，断定此事与天庭无关，于是立即把他俩送出凌霄殿外，把问题抛给如来。如来一定比玉帝着急解决此事。就这样这个问题转了九十六个弯之后，最终又与天庭扯上关系了（肯定不会是直接关系），玉帝也可以一推二五六。这句“事不关己，高高挂起”啊！此处印证了前文的一个推断：乌国国界龙王门里的【奉太敕旨】的【上】并非指玉帝。否则，这件事就派玉帝扯上关系了，玉帝也就不需要明知故问用照妖镜照验什么真假了。


    天庭不能判其真假，于是真假悟空又到唐僧处折辩。唐僧念紧箍咒亦不能分真假。


    # 更多资源，关注公众号【懒人找资源】'
  - '[PAGE 99]


    二者又嚷至幽冥地府处折唇。地府拿出生死簿，奈何查无可查，依然不能区别真假。地藏王菩萨也跑出来凑热闹。之前已经分析过，此地藏王菩萨是假的，谛听也不能区别真假情事。虽然如此，谛听还是指明了出路：如来佛祖。一见如来佛祖金面，这个问题就“水落石出”了。因此，我们要抢在如来前面揭穿这个假悟空的真实身份。否则，我们就会掉进如来的陷阱。因为如来说的这个假悟空的本源是六耳猕猴的说法是胡扯的！



    前面提到，只要揭穿假青毛狮子的身份，假悟空的真实身份就揭开了。在分析鸟鸡国的时候，曾经得出结论这个假青毛狮子和八戒是金翅大鹏的羽翼。其实，这个假狮子就是金翅大鹏，也就是说这个假悟空才是金翅大鹏。如敬站在如来面前要花钱的妖精，根术数就大出来，也只要有这个金翅大鹏才有如此之能量了。若看来敬仗大前时刻的情景，就知道金翅大鹏是多么嚣张了。可问题是六耳猕猴不是在如来面前现出了本相并且被悟空打死了吗？再看看当时六耳猕猴是如何被伏的吧！



    如来为了给诸佛一个合理的说法，编出了一大通理论。其精华就是有关于四猴的理论：【如来道：“第一是灵明石猴，通变化，识天时，知地利，移星换斗。第二是赤尻马猴，晓阴阳，会人事，善出入，避死延生。第三是通臂猿猴，拿日月，缩千山，辨休骸，乾坤摩拏。第四是六耳猕猴，善聆音，能察理，知前后，万物皆明。此四猴者，不在三教之内，不达两间之名。我观假悟空乃六耳猕猴也。此猴若立一处，能知千里外之事，凡人说话，亦能知之，故此善聆音，能察理，知前后，万物皆明。与灵明石猴搅音者，六耳猕猴也。”】这段话，前面已经仔细分析过了，我们再来分析一下。灵明石猴不用说，就是悟空。这个悟空的来历，诸佛还真是搞不清楚，也只能听如来讲了。通臂猿猴，花果山有通臂猿猴，二者应该是~回事。而这个赤尻马猴在花果山也出现过。但是，如来对这两类在出现过的猴子的解释却是错误的。如来说赤尻马猴【晓阴阳，会人事，善出入，避死延生。】但是，当年引导悟空四方参禅悟道，以求超脱轮回的却是通臂猿猴。因此，晓阴阳的并不是赤尻马猴。如来又说通臂猿猴【拿日月，缩千山，辨休骸，乾坤摩拏。】但是，悟空不在花果山的日子里，群猴被他，却毫无还手余地。因此，这话也不真实。关于这个六耳猕猴，如来的解释是【善聆音，能察理，知前后，万物皆明。】但是，这一点只是解释了紧箍咒判别法为什么会失效。这个假悟空可不止这么一点能耐。首先，悟空至少在悟空之下，悟空打不赢他。其次，这个假悟空至少有变形功能。这不是说他和悟空同音同像，而是指在如来收他时，其可是变成了一个紧箍咒。【与灵明石搅音，六耳猕猴也。】如来的意思是说，假悟空和真悟空是真的长得一模一样。这一点是用来解释照妖镜之所以失效的原因的。但是，如来的话是有问题的。他做的解释，都是别人发现了问题的现象，别人看不到问题的他就干脆不提了。所以，他的话虽然不能说得都是假的，但是隐瞒的迹象很重。赤尻马猴和通臂猿猴的解释，就是胡说的。六耳猕猴的说法勉强哄住了大众，但是，妖精一转眼就变成了一只蜜蜂，给了他一口响亮的耳光。如果之前妖精与悟空搏斗变化过，他肯定又要编出一套变化理论来。【此猴若立一处，能知千里外之事，凡人说话，亦能知之。】如果是真的，如来的惊天阴谋岂不是早就完全曝光了？破解紧箍咒的秘密，也不用八戒那么费心劳神了。千里眼和顺风耳还要互相合作呢！人都不知道在哪？你怎么听？你听谁？向哪个方位听？



    那么如来是如何识别真假悟空的呢？又为什么不当面道破呢？



    其实，至少有三条途径可以识别真假悟空。第一，悟空头上的三根救命毫毛是观音菩萨给的，别人根本就不知道这事。而且这是观音的东西，她必然识得真假。第二，悟空的金箍棒是老君亲造的大禹神兵，老君必然识得真假。另外，这个金箍棒是经如来加工过的，他比悟空了解这个金箍棒，也必然认得真假。第三，悟空的一身戎装是四海龙王给的。四海龙王也必'
  - '[PAGE 100]


    该识得真假。另外，悟空头上的紧箍儿是如来的宝贝，也可以用来辨别真伪。不过，此法已经失败了。因为大家头上带的是假的紧箍儿。但是，悟空身上有真的紧箍儿，在不得已可以一试真假。在这里会有人认为，这些紧箍儿都可以通过变化之法来伪造，完全可以做到真假难辨。其实不然，在豹头山悟空三兄弟计划夺回自家兵器时，八戒曾言：【“哥哥，我未曾看见那钉钴古怪，怎生变得他模样？”】可见，欲变之，必知之。这个与我们通常理解的拷贝复制不是一回事。把一个思路往前推一步，想要和原物极一样，就必须对原物有十足的了解。举个例子来说，如果钉钴古怪的脚底有颗黑痣，八戒却不知底这事，那么变化伪装就不可能到位。因此，变化之法并非十全十美，是经不起时间琢磨的。


