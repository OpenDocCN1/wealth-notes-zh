    一 只具有法力和智谋的虎头怪为 帮 手，在此看守并照顾黄风大王。这个黄风大王绝 对 不是什么妖怪。从他和悟空交手的情况来看，能够不 借助任何法宝主张口就能吹出"三昧神风"，其果位绝对
