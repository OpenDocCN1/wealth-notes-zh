    ## 二十六、解析“三打白骨精”中的深层矛盾


    好生调谢长老，不要怠慢、不要怠慢，我去也。”】当时，“水陆大会”上观音菩萨点化唐王时，曾说小乘佛法超不得亡人、渡不得魂，唯有大乘佛法才能做到超度渡，因而才有唐王取大乘真经之说。如果唐僧不是大乘佛教的信徒，刘伯钦父亲的鬼魂怎么能够超脱沉沦？其实，并非唐僧不会讲大乘佛法，而是取经本事根本就没有任何意义。唐僧取回的也不是什么大乘真经，而是《法》、《论》、《经》三藏真经中的部分经典。如来也没说这三藏真经是大乘经典，只是观音菩萨在安排取经事宜的时候谎称这个大乘经典。如来传经的时候很随便，让阿难（原文误作“阿惟伽叶”）随手拿了一些经卷给唐僧，凑够了一藏之数就结束了，这多少有点出人意料。由于悟空和唐僧在佛法理论上存在不可逾越的鸿沟，因此在修行实践过程中必然会产生各种各样的摩擦和矛盾。最后，唐僧对取经路上的困难认识不足，这是唐僧和悟空矛盾爆发的思想基础。应该说唐僧对西天取经的困难认识不足既有主观判断失误，同时也有一定的现实基础。唐僧离开洪福寺时对徒弟说：【“徒弟们，我去之后，或二三年、或五七年，但看那山门里松树花向东，我即回来；不然，断不回复。”】唐僧根本不可能估计到取经要耗费十几年的光阴。就是观音菩萨自己的估计也只是二三年间。白骨岭遇到白骨精的时候，已经是贞观十六年秋了，离唐僧取经出发已经过去整整三年了，唐僧以为西天将近了。这是唐僧的判断失误，取经的路才刚刚开始，他以为快要结束了。另外，这几年来唐僧的取经路还算走得安稳，收了三个徒弟，才遇见了两个妖精，一个熊罴怪、一个黄风怪。另外就是菩萨的考验，不算是危险。五庄观的事情唐僧把账都记在了悟空头上。因而，唐僧觉得只需八六沙静行（原文误作“八六沙静行”，结合语境应为“八戒、沙僧随行”或类似含义，此处保留原文错误并稍作修正为通顺逻辑：唐僧觉得即使没有悟空这个阻碍，取经路照样可以走得安稳稳妥），就算没有悟空这个西天取经路照样可以走得安稳稳妥。甚至觉得没有悟空这个阻碍，取经路可以更加顺畅。五庄观的事不就是一个证明吗？取经队伍中的人都是取经局外人，他们完全估计不到前面的困难和危险。谁也没有意识到这是一场充满艰辛的政治谈判。


    “三打白骨精”的具体过程其实并不复杂。白骨精的手段也很有限，不过只有变化之术而已，武艺法宝俱无。无论从哪个角度来考量，取经路上的妖精之中白骨精算是一个比较低层次的，基本上不入流。取经路上要吃唐僧肉的妖精不少，但是连唐僧都没摸到的妖怪也就只有白骨精了。话虽如此，这过程中两个问题值得思考。


    第一个问题，这吃唐僧肉可以长生不老的讯息到底是真是假？白骨精是取经路上第一个要吃唐僧肉获得长生的妖精。在此之前妖怪跟菩萨听说过唐僧肉有长生不老之功。就算黄风大王要吃唐僧肉，那也是把他当作一般的肉拿来下饭而已，并非专门要吃唐僧肉以求长生不老。白骨精是从哪里得知这个消息的呢？她是听别人讲的。到底是听什么人讲的呢？书中没有交代。其实，不仅白骨精是听别人讲的，取经路上要吃唐僧肉的妖精都是听别人讲的，而且谁也说不出一个确切的消息来源。【他（白骨精）在云洞里，踏着阴风，看见长老坐在地下，就不胜欢喜道：“造化！造化！几年家人都讲东土的唐和尚取大乘，他本是金蝉子化身，十世修行的原身。有人吃他一块肉，长寿长生。真个今日到了。”】从这妖精的口中，至少可以知道的是这个消息传来也就是这几年的事情。第三十二回《平顶山功曹传信
    莲花洞木母逢灾》【金角道：“你不晓得。我当年出天界，尝闻得人言：唐僧乃金蝉长老临凡，十世修行的好人，一点元阳未泄，有人吃他肉，延寿长生哩。”】金角大王所说的见到消息的时间也是十几年之前，不光是白骨精和金角大王，其实所有知道这个消息的妖精得出的消息时间都在十几年相近的，也就是在几年前。从金角大王的话里面还可以推测，这个消息的源头很可能是天庭。


    几年之前到底发生了什么事呢？唐王遭遇前宝几妖经（原文误作“前宝几妖经”，结合语境应为“唐僧取经消息”），这个消息流传和取经大业几乎是同步的。第三十五回《外道施威欺正性
    心猿调伏罢邪疑》中【老君道：“不干我事，不可错怪了人。此乃海上菩萨向我借了三次，送他在此化妖魔鬼，看你师徒可有真心往去也。”】这是老君解释的金童银童下界的原由，不管事情是否由此，菩萨向他借人以试探取经人，可以肯定这个下界最早是在菩萨知道取经这件事之后。因为观音菩萨知道并开始筹备取经之事是在贞观十三年，取经之事也是发生在贞观十三年当年，所以这个消息当在贞观十三年之后开始流传的，综合妖精们几年之前听到这个消息的事实，可以断定这个消息开始流传始于西天取经上路之时。


    那么问题出现了。


    首先，如果吃唐僧肉真的可以长生不老，为什么这么多年过去了没人提起这个话茬儿，偏偏取经队伍一上路消息就传开了呢？应该说吃唐僧肉真的可以长生不老这个消息是真的。能够引得这么多妖精以命相搏的消息不可能是谣言。况且，很多妖精并非泛泛之辈，特别是金翅大鹏雕这样的三界枭雄，谁能让他兴师动众、千方百计提拿唐僧吗？不太可能。妖精也是修炼出来的，只是没有神仙的待遇，并不表明妖精没有神仙智慧。他们对于长生不老也是有所了解，有所顿悟的，不是说骗就能骗得到的。但是，这个消息从天庭流传出来应该是个阴谋。很多年过去了，没有人提起唐僧肉这笔钱（原文误作“这笔钱”，语境应为“这件事”），偏偏取经队伍一上路，消息就疯也似的流传开来。很多妖精几乎同时收到消息，难道不可疑吗？到底是谁放出这个消息的呢？暂时还不清楚。


    其次，妖精们听说的消息有一个特点：就是这个消息并不直接告诉大家说唐僧肉是一个长生不老之法，而是重在说明有一个专人吃过唐僧肉，并且因此而长生不老的某事。当然，这消息里说的被吃的肉肯定不是唐僧肉，因为唐僧还好好的活着呢。那么到底是谁的肉呢？金蝉子的肉。这个消息的如此特点到底说明了什么呢？确实有人吃过金蝉子的肉，并因此长生不老了。金蝉长老转世，十世修行的好人，一点元阳未漏（原文误作“未漏”，应为“未泄”），这是唐僧肉可以长生不老的原因。金蝉子到底转世几次，是一次，还是十次？从文字上似乎很难判断。不过，我们可以倒着推出答案来。假设前九世转生与金蝉子无关，唯唐僧这一世是金蝉子转生，那么第九世的修行者与第十世的唐僧就没有任何关联。因而，十世修行的好人的说法就不能成立。由此类推，假设前八世转生与金蝉子无关，唯第九世、第十世是金蝉子转生，那么第八世修行者与第九世、第十世修行者就没有关联。因而，十世修行的说法仍然不能成立。按此推理下去，要想十世修行的好人的说法能够成立，必须是只可能有一个真灵经过十次转生。而转世唐僧的真灵是金蝉子，这个真灵有且只有一个，就是金蝉子。用数字表达式可以简化表达：假设十世修行表示为：①＝②＝③＝④＝⑤＝⑥＝⑦＝⑧＝⑨＝⑩，其中⑩＝金蝉子真灵，那么①＝②＝③＝④＝⑤＝⑥＝⑦＝⑧＝⑨＝⑩＝金蝉子真灵。销言寺（原文误作“销言寺”，应为“西游记”或特定版本名称，此处暂保留并修正为通顺：书中提到过）他是在五百年前的“盖孟盆会”（原文误作“盖孟盆会”，应为“盂兰盆会”）上认识金蝉子的，那就是说五百年前金蝉子尚在人世，并未开始转生。那么在不足五百年之中，金蝉子为什么要转生十次呢？平均每一世还不到五十岁，这个寿数对于一个修行者来说实在是太短暂了。有人认为是金蝉子五百年间转世十次，而从让教众分吃⑩，就是为了能够帮助佛渡越因被“蟠桃大会”（原文误作“蟠桃大会”，此处语境略疑，保留原意）抛弃而产生的生死大劫而做出的自我牺牲。这个说法是有道理的。由于每位教众的命数真劫寿起时间存有差异，佛祖用了五百年的时间来统筹解决这一命数问题。到唐僧这一世，此一次生死大劫教众基本得以安然渡过。金蝉子的使命完成，转世降再次取经路（原文误作“转世降再次”，应为“转世再次”）回到灵山。同时，取经大业的完成又为佛祖立下了一个汗马功劳。金蝉子转世渡劫的使命，应该还有个秘密：佛教众虽然吃了金蝉子的肉，但他们不一定知道这一事实，更不一定知道金蝉子的肉有长生不老之功效。第一百回《径回东土五圣成官》中说道：“圣僧，汝前世原是我之二徒，名唤金蝉子。因为汝不听说法，轻慢我之大教，故贬汝之真灵，转生东土……”如来话里的意思是金蝉子只投过一次胎。这是他当着众位教众的面故意撒谎，包括敖筋（原文误作“敖筋”，应为“敖闰”或相关龙族，此处保留原误但修正通顺为“包括龙族”）的原因是撒谎，目的就是掩扬（原文误作“掩扬”，应为“掩盖”）金蝉子转世十世的秘密。不过，由于天庭从中作梗，虽然事情没有完全暴露，但是金蝉子转世的唐僧肉能长生不老之业已经成为三界的公开秘密了。既然如此，如果在这里以领袖的身份代表官方好像像样的辟谣（原文误作“好像像样的”，应为“像模像样的”），给金蝉子转世一事做一个盖棺定论，对于澄清事实、稳定人心、团结同志还是十分有必要的。


    金蝉长老转世，十世修行的好人，一点元阳未泄，这三点是唐僧肉可以长生不老的原因。其实，我们再仔细一点就可以发现，这里面有两点原因是重复的。金蝉长老转世，十世修行的好人，这两点之中只需要有一点再配合元阳未泄，就可以确保唐僧肉有长生不老之功效了。第四十二回《大圣殷勤听麻海（原文误作“听麻海”，应为“听南海”或类似，结合《西游记》原著应为“大圣殷勤听南海
    观音慈善缚红孩”） 观音慈善缚红孩》中，【妖王躬身道：“孩儿不才，昨日获得一人，乃东土大唐和国。常听得人讲，他是一个十世修行之人，有人吃他一块肉，寿征万岁千祀。”愚男不敢自食，特请父王同享唐僧之肉，寿征千祀。”】


    第四十三回《黑河妖孽捞僧去 西洋龙子捉鼋回》中，【又听得那怪物寻在上面道：“一向辛苦，今日方能得物。这等和尚，是一个十世修行之人，但得吃他一块肉，便做长生不老人。我与他也等够多时，今朝却不负我志。”】


    第七十三回《情困囚恨生灾祸（原文误作“情困囚恨”，应为“情困牛魔生灾祸”） 心主遭魔幸破难》中，【女子道：“我常听人说，唐僧乃十世修行的真体，有人吃他一块肉，延寿长生，故世拿了他。”……】


    第七十四回《长庚传报魔头狠 行者施为变化能》中，【小钻风道：“……不知那一年打听东土唐朝差一个僧人去西天取经，说那唐僧乃十世修行的好人，有人吃他一块肉，就延寿长生不老，”……】


    以上这几处提到唐僧肉时，都没有提到金蝉子转世这一说，只是强调了十世修行这一要素。


    第七十八回《比丘宁宁迎旧神（原文误作“比丘宁宁”，应为“比丘国方丈托禅 小毛怪施威弄法”或类似，结合原著应为《比丘国》相关章节，此处保留原误但修正通顺为“比丘国”）
    金陵爽爽谈道德》中，【国丈才说：“那东土差去取经的和尚，我观他器官清静，容额齐整，定是个十世修行的真体。自幼为僧，元阳未泄，比那小儿更须强（原文误作“更须强”，应为“更强”），若得他的心肝煎汤，服我的仙药，是保万年之寿。”】这里的白鹿圈主（原文误作“白鹿圈主”，应为“白鹿精”或“国丈”）提到唐僧肉可以长生不老的依据与一般妖精不一样。他不是听人说的，而是自己看出来的。他也不说吃唐僧肉可以长生不老，只说取唐僧心肝煎汤服他的仙药可以长生不老。这与一般妖精听说的也不一样。这里，国丈虽然另有隐蔽用心，但是也不像是胡话的。就算事情是胡话的，但修道之理不可能胡话。否则，十世修行这一要素与妖精们听到的不一样，难道是全巧（原文误作“全巧”，应为“巧合”）？真相只可能是，十世修行的真体真的有长生不老的的功效。这一点是所有修道的人（包括神仙妖怪）都相信的。只不过神仙们不以此修炼罢了，一旦以此修炼就堕入魔道了，没档次。没档次的事情，神仙们是不会干的。正是因为这一点，天庭放出了这个消息的时候，担心妖精们不惜重金猎子的肉身（原文误作“猎子的肉身”，应为“猎取唐僧肉身”）可以长寿长生，于是一多透露了十世修行之法—-长消息（原文误作“一多透露...长消息”，应为“特意透露了十世修行这一说法”）。因为金蝉子的肉可以长生不老的秘密，并没有多少人知道，对于这一点，天庭也是没有把握的。所以，天庭多透露了十世修行的消息。由于金蝉子多次转世之事是一个秘密，因此天庭也不能尽知究竟，所以推荐方（原文误作“推荐方”，应为“推崇”或“宣传”）十世修行的真体之说也只是用来骗人的。金蝉子到底转世几次？答案只有如来自己知道。其实，对金蝉子转世一事产生怀疑的不仅有天庭，佛派内部也有个怀疑。更何况，如来
    百密一疏（原文误作“百密一疏”，应为“百密一疏”是成语误用，此处意为“再周密也有疏漏”），佛派之中另有人察觉到这个秘密。


    第二个问题，本节中八戒为什么一再吱使（原文误作“吱使”，应为“支使”或“唆使”）唐僧念《紧箍儿咒》呢？而沙僧为什么又一直不发（原文误作“不发”，应为“不发一言”）呢？他们是真想毁掉取经大业吗？非也。联系白虎岭之前和之后发生的事情，以及相应的八戒的行为举止，我们大致可以推断出八戒使用唐僧念《紧箍儿咒》的三个原因。


    原因一，为报莫家庄破戒之仇。莫家庄试杀诸禅心之时，悟空明知道是菩萨设局却没有说破，并且还要一再使坏促使八戒上当，致使八戒被吊在树上过了一夜。这个八戒会当然要记在悟空头上。不仅八戒记了这个仇，唐僧心里也记了这个根，是一点唐僧自己就栽进去了。因此，在这点上八戒和唐僧心里是有默契的。自悟一（原文误作“自悟一”，应为“自悟空”）被打死（语境应为“自悟空第一次打白骨精”），八戒就开始冷言冷语、说风凉话。本节中八戒共两次唆使唐僧念《紧箍儿咒》，分别在悟空第一次和第三次打死白骨精之时。而且两次指控悟空的罪名是一样的，说悟空使障眼法欺骗师父。悟空要是会骗人那就好了。


    唐僧也用不着天天跟他板气（原文误作“板气”，应为“怄气”）了。悟空是什么人？难道唐僧还不知道吗？就是因为悟空说话太实在，不留情面，才经常得罪师父的。因此，在这里与其说是八戒给悟空冠罪名（原文误作“冠罪名”，应为“扣罪名”），毋宁说是唐僧在给悟空找罪名。八戒的这个话是说到领导心里去了。


    原因二，为了验证《紧箍儿咒》之事是否属实。八戒是在五庄观第一次听说《紧箍儿咒》这事。本来唐僧在五庄观是要念的，但是经海上三星（原文误作“海上三星”，应为“太上老君”或“五庄观相关人物”，结合原著应为“镇元子”或“老君”，此处保留原误但修正通顺）的劝说才没念。当时八戒第一唐僧
    说要素《紧箍儿咒》（原文误作“第一唐僧 说要素”，应为“第一次听唐僧说要用《紧箍儿咒》”）的时候，他的反映又是愁又笑。愁的是自己被贼逃脱不得（原文误作“被贼”，应为“被念咒”），笑的是唐僧曾念的什么“旧话术经”（原文误作“旧话术经”，应为“紧箍咒”或类似名称）从未听说过。悟空大致的给他解释了一下。八戒听说了这么个稀奇事，当然要找个机会验证一下。更何况，八戒的身份并不单纯。沙僧也有一种心态，他也想看看稀奇。于是，打死白骨精一事刚刚好多验了他们的难题（原文误作“难题”，应为“好奇”）。既替八戒报了仇又验证了稀奇。八戒两次唆使唐僧的时候，目的都很明确，就是直指《紧箍儿咒》的。第一次目的是验证《紧箍儿咒》，验证成功后，第二次不仅再次加强了个验证（原文误作“加强了个验证”，应为“验证了效果”），更是以此来整悟空了。谁也不会想到，唐僧真的会把悟空赶走。所以，最后悟空走的时候，八戒也没言语了。


    原因三，为了能够在取经队伍中出头。第二十九回《脱蓬江流见国主（原文误作“脱蓬江流”，应为“脱难江流”） 承恩八戒转山林》中，【国王定性多时（原文误作“定性”，应为“待性”或“问性”），便问：“猪长老长沙长老（原文误作“长沙”，应为“沙僧”），是哪一位于圣落好（原文误作“落好”，应为“功劳好”或“功劳大”）？”那呆子不知好歹，答道：“老猪会降。”国王道：“怎么家降（原文误作“家降”，应为“降”）？”八戒道：“我乃是天蓬元帅，只因罪犯天条，堕落下世，幸今皈正为僧。自从东土来此，第一会降妖的是我。”】这说明八戒早有出头的心愿，但是一直苦无机会。悟空一走，他的机会就来了。悟空倒说了阻碍他八戒扬名立外的绊脚石了（原文误作“倒说了...”，应为“悟空成了...”）。再看
    八戒在五庄观中的表现吧！当悟空还在外四处寻找救活人参果树的良方的时候，八戒在五庄观跟着海上三星（原文误作“海上三星”，应为“镇元子”或相关人物）是没念没了（原文误作“没念没了”，应为“没完没了”）的逗乐子。八戒这一连串的举止实在是让人看不懂，他为什么要那样做
    呢？表面上看原因只有一个，他闲得以至于（原文误作“以至于”，应为“以至于”）无聊了。所以，有悟空在，八戒是没有机会表现的，更别谈什么扬名立万了。当八戒意识到师父可能真的要赶走悟空的时候，八戒的内心肯定是因过一丝灵光（原文误作“因过”，应为“闪过”）。同时，他的内心也是矛盾的，原来他没有赶走悟空的打算，现在突然间就有了可以好好表现的机会。他既紧张兴奋，同时也有些失落窝（原文误作“失落窝”，应为“失落落寞”）。师父就这样把大师兄赶走了？此时的八戒说不出话来，他不知道要说什什（原文误作“什什”，应为“什么”），他很乱。


    那么本集中沙僧为什么一直不开口呢？除了刚才说到的他也想看稀奇的原因之外，另一个更加重要的原因是他看透了唐僧的心思。他是第一个意识到唐僧可能会真的赶走悟空的人。
    如此，他知道说什么也没有用了。回天乏术，徒增师父厌恶而已。《那大圣》对唐僧道：“···· 我曾穿石洞，入深林，擒魔捉怪，收八戒，得沙僧，吃尽千辛万苦。今日味得慢慢怪糊涂（原文误作“味得慢慢”，应为“昧得昧昧”或“装作糊涂”），只教我回去，这本是鸟尽弓藏，兔死狗烹！”·····”悟空到最后才意识到唐僧是抓着明白装糊涂（原文误作“抓着明白”，应为“装傻充愣”或“明知故问”），之前他还一直心存侥幸的认为《虎毒不伤子》（原文误作引用，应为“人心”），真是大错特错了。其实，沙僧在取经队伍中是心态最特殊的一个，他根本没把取经当成什么事，所以看事情比较超脱、比较透彻，他早就看出了其中的奥秘。最后，悟空【却又吩咐沙僧道：“贤弟，你是一个好（原文误作“是一个好”，应为“是个好人”），却只感觉留心劝着八戒讲话说话（原文误作“讲话说话”，应为“好言相劝”），途中更要仔细。”·····】悟空最后说沙僧是一个好人，不光是因为他也感留心（原文误作“感留心”，应为“敢留心”或“留心”）没有跟八戒和唐僧一起揣着明白装糊涂，更是因为他理解了为什么沙僧一直没有开口的原因。是啊！
    好人不易懂。既不得罪师父，又不能抛弃师兄，只能闭嘴。这一回中，唐“借题发挥”赶走悟空，使的是“借刀杀人”之计。


    ## 二十六、奎木狼——玉帝密使


    黄袍者，星袍也。奎木狼思凡下界，其实质是钦差奉旨行事。此推断有金牌为证：【那怪腰间取出金牌，在殿下叩头纳罪。……玉帝闻言，收了金牌，贬他去兜率宫与太上老君烧火，带罪差操，有功复职，无功难加其罪。】黄袍怪回天庭面见玉帝时，什么都没说，第一步要紧是交出金牌。这分明是说他已完成任务，向玉帝先行报销。天庭诸仙与否（原文误作“与否”，应为“是否”）都执金牌上闯（原文误作“上闯”，应为“上任”）呢？好像书中并没有交待。不过，《西游记》出现的金牌一般都是作为执行特殊任务时的皇室印信。比如，附录《陈光蕊赴任逢灾
    江流僧复报世亲》中，【（殷丞相）星夜令金牌二丁（原文误作“二丁”，应为“二人”）唤到江州同知、州判二人，丞相对他说如此事，叫他提兵相助，一同过江而去。】又比如，第二十九回《脱难江流来国土（原文误作“脱难江流”，应为“脱难江流”）
    承恩八戒转山林》中，【（宝象）国王道：“你既这等说了一遍，寡人怕他怎的？宜进来。”即夸着金牌至馆驿相请（原文误作“即夸着”，应为“即拿着”）。】再比如，第六十二回《涔垢谯心惟宝塔（原文误作“涔垢谯心”，应为“宝象国进奎邦”或相关回目标题）
    缚魔归正乃修身》中，【三藏道：“现被小徒锁在金光寺里。”那国王急降金牌：“着锦衣卫快去到金光寺取妖贼来，寡人亲审。”】另外，悟空也曾在天庭为齐天大圣，也不见有什么上岗证金牌。因此，奎木狼此时上缴的金牌并非是上岗证，而是执行特殊任务的印信。


    至于奎木狼下界的原因，其实是经不起推敲的。对此，玉帝却并没有深究。【奎宿叩头奏道：“万岁，赦臣死罪。那宝象国玉公主，非凡人也。他本是披香殿侍香的玉女，因欲与臣私通，臣恐他污了天宫胜境，他思凡先下界去，托生于皇宫内院，是臣负在前（原文误作“负在前”，应为“负在前缘”），变作妖精，占了名山，摄他到洞府，与他配了一十三载夫妻。一饮一啄，莫非前定，今便不敢到此成婚。”】


    这是奎木狼给出的关于他为什么会私自下界的解释。不过这个解释是站不住脚的。如果真是披香殿侍香的玉女与奎木狼私通，并且不想玷污天宫胜境，就应当双飞双下，找一个无人知晓的世外桃源去逍遥快活。为什么玉女要下凡投胎转世呢？这个流程如此之漫长：百花羞公主成年，就让双方苦等了至少十五六年。同时，投胎转世这还是比较入耳（原文误作“入耳”，应为“好听”）的说法，其实说得好听就是自己找死。放着天庭的玉女不做，要自寻短见去转世托生。玉女是不是疯了？就算奎木狼不变心，真的找她继续前缘，双宿双飞，那么即使是无边风流浪与快活（原文误作“风浪”，应为“风光”）也与太守待香玉女（原文误作“太守待香”，应为“侍香”）无关了。因为，侍香玉女已经不存在了，活着的是百花羞公主。侍香玉女这一场当真是为他人做嫁衣裳了。因而，奎木狼在说谎。但是，玉帝没有抓住不放，而是让他蒙混过关了。其实，要揭穿他也很容易，就是去披香殿核实一下，是否有侍香玉女下凡？这本来应该是断电（原文误作“断电”，应为“定罪”或“断案”）的一个必经步骤，但是主审人玉帝老爷此时并没有展开。这说明其中是有猫腻的。


    【他原来是孙大圣大闹天宫时打怕了的神将，闪在那山洞里落荒，被水气隐住妖云，所以不曾看见。】这句话读着有点别扭。这里干嘛非要提到大闹天宫的茬儿？很容易给公众，以为奎木狼在悟空大闹天宫之后躲在山洞之中了。这里只不过是在强调奎木狼是认识孙悟空的。如果不认识孙悟空，他怎么会因为被孙悟空打怕而躲在山洞之中？难道是因为怕的时候久了，连怕得是什么（原文误作“怕得是什么”，应为“怕的是谁”）都忘记了？但是，这个奎木狼却装作不认识孙悟空。不认识孙悟空的模样还情有可原，毕竟五六百年没见了。其实，悟空是认识他的。此事后文再提。在孙悟空自报家门之后，奎木狼一点反映（原文误作“反映”，应为“反应”）都没有，好像脑子里完全没有这个人了，这就奇怪了。其实，奎木狼是真的不认识悟空的模样了。在悟空没有自报家门之前，他说了一句不杀的话，漏出了破绽：【那怪忽然省悟道：“我家有些认得你哩。”行者道：“我不打你，你再认认看。”】悟空自报家门之后，奎木狼立刻醒悟，就装作不认识孙悟空了。因为，他怕露出这一机（原文误作“这一机”，应为“这一层心事”）。因为奎木狼下界的时候比较早，在取经之前，所以他认为荒野之地（原文误作“他认为荒野之地”，语境略断，保留原意），并不知道取经这二一事（原文误作“这二一事”，应为“这一事情”）。当时，玉帝也不可能对奎木狼讲取经的具体情况，玉帝本人对于取经的具体情况也并不是很了解。所以，玉帝派奎木狼下界时的目的就是盯住孙悟空，为难孙悟空，进而给整个取经队伍出难题。如果，玉帝不对取经队伍有所要求，那就意味着全盘接受如来的要求。反过来，也是一样。如来对取经队伍也是有要求的。这就是谈判之所以艰难的原因之所在，双方的要求不一致。等谈到一致的时候，谈判也就结束了，成功了。


    另外，奎木狼在执行任务的过程中，发生了一件意外。由于奎木狼自认为自己的任务失败了，所以在玉帝面前他没有敢提出来。奎木狼丢失了自家的法宝舍利子玲珑内丹。这个内丹为悟空所得，在之后的降妖过程中也发挥了重要的作用。


    本节之中，根据奎木狼的表现，可以说他的任务既失败了又成功了。在他自己来说，是失败了，没有能完成为难孙悟空的任务。对于玉帝来说，是成功的。玉帝并不是真的想毁掉取经大业，只是想提升自己的要求罢了。这样的结局，是玉帝老早就知道的，也是玉帝想要的。


    另外，玉帝对于奎木狼的惩罚其实是别有用意的。【玉帝闻言，收了金牌，贬他去免率宫（原文误作“免率宫”，应为“兜率宫”）与太上老君烧火，带俸差操（原文误作“带俸”，应为“带罪”），有功复职，无功重加其罪。】第一，为什么要让奎木狼去给老君的炉子烧火呢？看了一下回（原文误作“看了一下回”，应为“结合后文来看”），就会明白老君是因为金奎银狼（原文误作“金奎银狼”，应为“金角银角”）被派下去执行任务去了。第二，【有功复职，无功重加其罪。】这句话是什么意思呢？其实这是玉帝的个一箭双雕之计，表面上既是惩罚了奎木狼，同时也解决了老君的人手问题。更深一层的是，派奎木狼去监视老君的一举一动。否则，与老君烧火能立什么功呢？后来在第六十五回《妖邪假设小雷音
    四众皆遭大为难》中，五方揭谛去奏请如来降妖的时候，【玉帝】即传旨：“差二十八宿星辰，快去降伏妖怪。”】这里为什么要选二十八宿？奎木狼就在其中。这其实是在告诉我们的奎木狼已经立功而且官复原职了。至中（原文误作“至中”，应为“至于”）他立了什么功？以及如何立功？暂且不提。


    有功就官复原职，没功就重加其罪，看来玉帝的命令很坚决啊。官场之中，送美女，送仆人，都是尔虞我诈之计，千万不可照单全收，而又高枕无忧啊。奎木狼的交出台牌（原文误作“交出台牌”，应为“交出金牌”）既是一个任务的结束，又是另一个任务的开始。


    其实，回顾一下本节的内容，还发现本节之中，还照应了一个前文情节。表面上看，百花羞公主的命运与唐僧的母母（原文误作“母母”，应为“母亲”）殷温娇有相似。都是被虏抢（原文误作“虏抢”，应为“掳掠”）身为妾的人，而且，悟空也试探出百花羞公主与唐僧的母母（原文误作“母母”）一样，也是一个知书识礼之人。身份、地位、经历等两者相似之处何其多。为什么百花羞公主可以活下来，而殷温娇却要赴死呢？至少，这说明了殷温娇之死与名节无关。


    ## 二十七、平顶山大捷


    金角大王和银角大王为什么会出现在西天取经路上？


    【老君道：“不干我事，不可错怪了人。此乃海上（原文误作“海上”，应为“南海”或“观音”）菩萨问我借了三次，送他在此托化妖魔，看你师徒可有真心往西去也。”】从太上老君的话中看来，似乎是观音菩萨安排的一切，但是，当事人金角大王和银角大王的说法与老君的说法又不太一致。【那老魔闻得此言，唬得魂飞魄散，骨软筋麻，扑的跌倒在地，放声大哭道：“贤弟呀！我和你私离上界，转托尘凡，指望同享荣华，永为山洞之主。怎知为这和尚伤了你弟命（原文误作“你弟命”，应为“手足之替”或类似，结合原著为伤及亲人），断吾手足之替！”】金角大王和银角大王承认自己是私自由界（原文误作“私自由界”，应为“私自出界”）为妖的。而且，下界的目的也是占山为主（原文误作“为主”，应为“为王”），据洞为主（原文误作“为主”，应为“为王”），享受荣华富贵。但是，如果金角大王说的是真话，既然是为了享受荣华富贵那又为什么带着唐僧师徒的画像呢？【金角道：“……我记得他的模样，曾替师父记唐僧画了一个影，两个一个形（原文误作“两个一个形”，应为“一人一形”或类似），你可拿去。但遇着和尚，以此照验临验（原文误作“照验临验”，应为“照验”)。”】金角大王并没有见过唐僧的模样，他如何记得他们的模样？而且，这幅画中有师徒四人，因此成画时间应在唐僧师徒全部到齐、队伍成形之后。金角大王已经在平顶山为妖多年了，而且还和当地的地头蛇九尾狐妖精结了幼妹之情（原文误作“幼妹”，应为“舅父”或类似亲属关系）、叙了母子之爱，他如何能够做出这

    '
