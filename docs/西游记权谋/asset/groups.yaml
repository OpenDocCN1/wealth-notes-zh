- raw:
  - '[PAGE 91]


    用而已。不过，这也是他的侥幸之处，否则，他会死得很难看。因为老鼋不具备使用“借刀杀人之计”的基本条件。这一点，此处不展开详述。


    金鱼精在灵感大王庙受挫，老鼋就趁机对鳜鱼精面授机宜，让她为金鱼精献计，果然，金鱼精中计了。但是，面对千里冰封的通天河，唐僧师徒的表现让老鼋彻底寒心了。他们根本就没打算要对付金鱼精，而是准备跑路了，这让老鼋颇为无奈。虽然事态的发展并不如意，不过老鼋心里明白：他们是走不掉的。唐僧被拒之后，金鱼精和悟空三兄弟起了冲突，如果悟空将金鱼精打死，那么对老鼋来说是再好不过了。可是，万一要是悟空被金鱼精打死了呢？自己恐怕想不绝望都不行了。所以，有了鳜鱼精的二次献计。鳜鱼精的第二条计谋就是高挂免战牌坚壁不出，此计表面上看是为了保护金鱼精，实际上真正要保护的对象是孙悟空。不过，悟空来说这条坚壁政策确实厉害，因为敌暗我明，悟空无法与敌人展开决战。一旦拼起消耗，悟空是消耗不起时间的，因为时间上越久拖，唐僧的生计就越渺茫。但是悟空实在无从下手啊！知己知彼，方能百战不殆！悟空对这个金鱼精可谓一无所知啊！这个时候，按常理应该是老鼋出现的最佳时机了。不过，这个老鼋还是没有出现，他的耐性极佳！也正是因为这一点，才留下了他的一条老命！悟空举步维艰，没奈何直奔南海普陀山来求救于观音菩萨。直到此时，可以说老鼋的计划成功大半了。观音菩萨没来办法给悟空讲一个说法，而悟空对付妖怪也不手软。


    就在老鼋以为大功告成的时候，观音菩萨大闹杀成了。这是老鼋所能预料的。老鼋不敢出来见菩萨，是担心给菩萨留下不好的印象：毕竟她老人家的金鱼是因为我的府弟而栽跟头的。老鼋的这个想法是因为自己暗地里做了点手脚，多少有点“心虚”。观音菩萨出面可不是为了处理这个侵占私宅的问题的。不过，没想到观音菩萨的铁血手腕，非常人所能想象。观音菩萨杀了“水藻之国”的所有水族，老鼋是不知道的。幸亏，他非常“识趣”地躲在某个角落里才得以逃生。菩萨离开之后，老鼋非常高兴地回到了宅，想着自己即将回归与亲人团聚又享天人之乐，于是积极表示要送唐僧师徒过通天河以示报恩。老鼋兴致勃勃，刚刚夺回府第就闹起了成仙之道的终极大问题了。他央求唐僧师傅如来自己合适可得个个人身，真是高兴过头了。人啊人！就是这样，没钱想有钱，有钱想永生，永生又想长生！回到本身，不知道老鼋将作何感想！


    唐僧师徒被渡过河了。老鼋没有死，这件事终于还是让菩萨知道了。菩萨没想到自己如此杀伐，竟然还是留下了活口。正是因为这活口的存在，才将金鱼精的扫清公布于众了。【菩萨：“他本是我莲花池养大的金鱼，每日洒头听经，修成手段。那一柄九瓣铜锤，乃是一枝未开的菡萏，被他运炼成兵。不知是那一日，海潮泛涨，走到此间。我今早教看花木，却不见这厮出拜。指捐巡纹，算着他在此成精，害你师友，故此未及拯救。运神功，织个竹篮儿擒他。”】菩萨以为当时悟空三兄弟的那三言两语基本把事情摸透过去了。因此，自己很有可能就比给改政摸住把柄。在此，老鼋不必怨恨菩萨！一切都只为造化弄人！


    老鼋是怎么死死的？


    在唐僧师徒取回大乘真经的时候，菩萨还真翻开出五方揭谛登记造册的取经历练难。【菩萨将难簿过目了一遍，急传声道：“佛门中九九八十一难，圣僧受过八十难，还少一难，不得完成此数。”即将揭谛，赴上金阙，还生一难者。”】关于难数的可谓，如来都没说少一难，观音为什么那么大反应？而且还自作主张，另生一难？因为，菩萨就此找到了杀老鼋的借口。否则，为什么八大金刚依着菩萨的指示将唐僧师徒扔到了通天河呢？和上次驮唐僧过通天河不同，老鼋的这次出现其实是来临的。因为，他家破人亡了。难道不该有此人负死责吗？观音虽然可恨，可是唐僧师徒也难逃干系！况且，老鼋岂敢找观音报仇？所以，唐僧师徒暂作一回替罪羊吧。不过此时的老鼋就不够理智了，因为唐僧师徒此时出现在这里分明就有蹊跷。其目的就是为了引诱


    更多资源，关注公众号【懒人找资源】'
  - '[PAGE 92]


    老鼋现身，此为“引蛇出洞”之计。老鼋此时已然看不到这些了。人们常说，仇恨可以蒙蔽人的双眼。


    老鼋借口唐僧有负所托，将他师徒四人连马五口一起抛入水中。关于唐僧有负所托这一点，原著中是有矛盾的。因为之前老鼋托付唐僧借问来的问题是：何时可得一个人身？而回来之后，问题就變成了：寿县几何？这一前一后的差别，难道还不能引起我们的警觉吗？唐僧师徒落水之后，千年蟾头老鼋的孤独之路也就走到了尽头。这么多年来，老鼋在通天河东歇西歇，最后也难免一死了之。可悲！可叹！【师徒方登岸整理，忽又一阵狂风，天色昏暗，雪烟俱作，走石飞沙。但见那：......那风搅得个通天河波浪翻腾，那雷搞得个通天河鱼龙丧胆，那烟熏得个通天河彻底光明，那雾盖得个通天河岸崖皆暗。好风！颓山烈石松篁倒。好雷！惊骇凡人喊势豪。好烟！流天照野金蛇走。好雾！混混漫罩欲九霄。唬得那三藏按住了经包，沙僧压住了经担，八戒牵住了白马，行者却双手抡起铁棒，左右护持。原来那风、雾、雷、烟乃是些阴魔作号，欲夺所取之经，劳摆了一夜，直到天明，却才止息。】显然这里的【风、雾、雷、烟】并非什么【阴魔作号】，而是菩萨向老鼋下手了。全书中最莫名其妙的一难就在这里了，表面看来简直就是毫无来由。什么是阴魔？阴者，女也！这个“女魔头”舍观音菩萨其谁？！


    # 第三十二回 如来留下买路财


    有了前面的铺垫，从这一节开始，《西游记》全书进入了高潮阶段。全书的高潮阶段始于第五十回【情乱性从因爱欲 神昏心动遇魔头】，终于第七十七回【群魔束手 一体拜真如】。这其间的情节发展真可谓是风起云涌，变幻莫测。作者写得是大气磅礴、波谲云诡，读者看得是酣畅淋漓，拍案叫绝。那么，究竟是如何如何？且细细道来。


    《西游记》全书中，最爱丢东西的就是太上老君。丢仙丹，丢宝贝，丢坐骑，凡是能丢的都丢了一趟。干脆连老婆孩子也顺便一起丢了。这一次，又丢东西了。还连丢了三样，七返火丹、青牛和至宝金刚琢。自己就算了，还带动自己家的老老小小一起去，真是不像话。不是吗？本刚一开，唐僧就师徒就被拎着青牛兜大玉丢了三件织绵背心。真是“物像主人形”啊！什么样的主任就培养出什么样的科员。


    这里见大王抓唐僧就抓唐僧！还抓到什么花肠子啊？非要拿唐僧作定理？其实，老君虽然丢了很多次东西，但是都没有直接说道出是怎么丢的。好了！这下领教了，他们家就一直这样丢东西的。这次丢东西正是印证出了当年悟空为什么能在他们家偷盗仙丹的：一切都是计划好的。


    这一节，最后通过如来暗示主人公，悟空才知道去找太上老君的。其实，狗屁不通！悟空第一眼就看出来了。请看第五十回【情乱性从因爱欲 神昏心动遇魔头】中，悟空和兜大王交手时的情形：【那魔王见孙大圣根法齐整，一往一米，全无些破绽，喜得他连声喝采道：“好猴儿！好猴儿！真是个那阐天宫的本事！”】这大圣也爱他枪法不乱，右边左拦，甚有解数，也叫道：“好妖精！好妖精！果然是个偷丹的魔头？”】其实，他俩都互知底细。原来当年老君丢失的仙丹是这头老牛偷走了。那么悟空是怎么知道的呢？首先，悟空可以肯定自己没有偷老君的仙丹，至少没有偷走五葫芦仙丹那么夸张。其实，老君家里当时的确切人，所有人都去听燃灯古佛讲道了。所以，虽然当时悟空把罪名扛下来了，但是实际上悟空私下里还是琢磨过这件事的。所以，他看青牛是偷丹的魔头，实际上是猜的。但是，悟空根本没真正认识这个道骨仙风的太上老君的真面目，完全没想到这是原本就是个大阴谋。


    那么，既然悟空知道这个兜大王的背景，为什么不直接去找太上老君来收伏呢？此时的悟空已然渐渐成熟了。一路走来，很多有背景的妖怪虽然被降伏了，但实际是都被救了。之前'
  - '[PAGE 93]


    的灵感大王，吃了那么多童男童女，最后观音过来直接就带走了。  并没有惩罚那条金鱼精，而且观音还大开杀戒，把“水脏之第”的水族杀了个精光。这对悟空来说，不可谓不是一个教训。所以，想要真的降伏制裁这个妖精，还得找玉皇大帝。玉帝明面上毕竟还说得去。当年的那个“黄袍怪”还是被玉帝“制裁”了的。所以，悟空没找老君，就直接往上捅了。更何况，这个妖精还把悟空的金箍棒收走了。悟空能轻饶了他吗？悟空另有一个小算盘，就是玉帝牵挂这个家伙说不定会审出当年偷丹的实情，可以为自己翻案了。悟空自己说的那个去天宫查手的理由反而站不住脚。就是因为妖精说了句“莫个闹天宫之类”的话，就可以断定他是天上来的吗？西天路上听说过阎王宫的妖怪很多，再提醒悟空一筹，说出这样的话来并不稀奇。


    悟空到了天庭，见过玉帝，玉帝却吩咐司勘官吏入查问。这一次，悟空对玉帝算是低头了，因为金箍棒不见了。但是，玉帝查岗只不过是个马虎眼。何以见得？就在那本中，悟空去乌浩查找水德星君时，【水德星君闻言，即将查点四海五湖、八河四渎、三江九派并各处龙王俱遣退，整冠束带，接出宫门，迎进内道：“昨日可韩司查勘小宫，恐有本部之冲，思凡作怪，正在此点查江海河渎之患，尚未完也，”】这说明，此时查岗工作尚未完工。但是，玉帝的查岗报告早是在悟空上天庭求助之时就已呈出来了。而且，此时火部众神仙已报悟空下界施展，并遭了败绩。可见，玉帝的那个报告书分出多大了。在这里，玉帝为什么拿假报告欺骗悟空呢？因为，玉帝跟悟空一样对这个所谓的晃大王的底细一清二楚。不要忘了，当初玉帝把水猿猴罚到老君家烧火到底是为了什么的。600年前，悟空大闹天宫的时候，老君拿出的那个“金刚琢”令众仙惊心。所有现场观众，包括玉帝本人，都能知道这件宝物到然是会飞上去的。牵牛一直没有机会。这一次不是天赐良机了吗？于是，玉帝就打了个马虎眼，并不失时机的做了一回好人。让悟空挑选天将下界降妖，其实是想一探老君的底牌。悟空一看到玉帝的查岗报告，就知道玉帝是不最佳了。老天师许雍阳自以为真是把悟空的心思看透了。说了句，【“此时，彼一时，大不同也。常言道一物降一物哩，你好选了旨意；凭君高见，选用天将，勿得迟疑误事。”】他觉得悟空之所以对玉帝的提议犹豫是因为悟空怀疑天庭试探的功力。这样的考虑是玉帝想到的一个方面，但更重要的是悟空对玉帝说了实话，他还是，就算抓住了又能怎么样？但是，这个心思又不能表现出来。因此，悟空不得不硬着头皮答应下来。【行者道：“既然如此，深谢上恩。果有不好选择。一则老孙又不可空走这洞，烦烦回转奏玉帝，只教托塔天王与哪吒太子，他还有几件降妖兵器，且及那兵将里一仗，以看如何。果若能够擒得，是老孙之幸；若不能，那时再作区处。”】悟空是不抱什么希望的。


    悟空为什么选择了李天王父子呢？因为，天庭诸仙的实力悟空都有具体见识过，只有这个李天王的几件宝贝是亮过相的。加上之前，悟空请观音救伏红孩儿时观音曾告诉过悟空有二十六天罡力，使悟空开了眼界。虽然直到现在悟空还不能完全理解菩萨当时的用意，但是这件事至少让悟空知道玉帝还是藏着有两把刷子的。更重要的是，在天庭要找出一个地位、能力、权势能跟老君抗衡的天将来是在太难了。看来去啊，只有这个李天王还勉强当得这堵挡火的墙。死马且活马医吧！


    李天王父子一出战，果然不出所料，大败而归啊！李天王这个时候就不失时机的提议用水火来对付这个“金刚琢”。为什么呢？因为老君当初吹嘘这个“金钢琢”的时候，说过这物【“……乃能钢烁炼的，被我得将丹点成，养成一身灵气，善能变化，水火不侵，又能套诸物；……”】到目前为止，这个【善能变化】的属性，在点化仙庄欺骗唐僧的时候已经证实过了；这个【能套诸物】的功能，刚刚已经教顿了；唯有这【水火不侵】的说法还没经验证。李天王这样做的目的就是奉玉帝旨意来探底的，当然他自己也想探底。【天王道：“套不去者，惟水最利。常言道，水无火无情。”】不知道这个立论的依据在哪里。有谁说这个圈子只能套取有特


