    # 第十一回 经动天下--唐太宗的取经梦


    前文已在提到未来的“东扩计划”。而取经就是为了这个“东扩计划”而展开的。取经的真正动因是如来要抢夺市场份额，扩张势力范围，争取信众，获取最大香火供奉（要知道神仙都是不事生产的，生活来源仅限于凡间百姓的供奉）。取经是表象，传经才是实质。


    但是话分两头说，不是你想传经就可以传的。老百姓到底信不信你？是个关系到生死存亡的根本性问题。也就是说你的真经到底有没有市场？还得接受市场的检验。另外，跟大领导玉帝抢饭碗，他能那么轻易的你胡为吗？


    因此创造需求，引导消费者才是目前的头等大事。你不信真经？没关系。你去地狱吧。只要我们能够创造出一种消费文化，一种生活方式，让大家都这样一种感觉：真经=天堂，不信真经=地狱。人人都要去天堂，不打算去地狱，天堂的消费需求极高，因此真经的需求也节节攀升。这叫什么？捆绑销售。林志玲那么性感，不是因为用了你们家的丰乳肥臀膏。但是把她的美和你们家的丰乳肥臀膏捆绑在一起，卖给他了。结果，丰乳肥臀膏他有了，美没了。这就叫捆绑销售


