    “文殊般若自在，普贤三昧自在。”看来这个黄风大王并不是孤军奋战，而是有硬邦邦的后台的。普贤菩萨就是他的主管领导，此事情他逃干系。从西天路上后面发生的事情来看，文殊菩萨和普贤菩萨实际上是一条绳上的两个蚂蚱。这是如来弃文殊普贤而重用观音的原因之一。当然，如来重用观音菩萨还有更为重要的原因。暂且不提。


    虎先锋不明就里，将唐僧提来下饭。但是，黄风大王对取经队伍也一无所知吗？虽然是幽禁在此，但是理论研究还是不能放下的，毕竟思想改造也是幽禁目的之一嘛！《大日如来报》、《般若》、《普贤行》、《佛说》等大型教会期刊报纸对于取经一事肯定有铺天盖地的正面报道和积极宣传。可是，黄风大王还是要从中搞点小破坏。【“我这里除了大小头目，还有五百七百名小校，凭你选择，领多去。只要拿住那行者，我们才自自在的吃那一向和一块肉，情愿与你拜为兄弟；但恐拿他不得，反伤了你，那时休得埋怨我也。”】这是唤使虎先锋前去捉孙悟空和猪八戒时做的一个约定。表面上，他指责虎先锋捅了马蜂窝，表示不赞成为难取经队伍。但实际上，他又拿出干把子的诱惑给虎先锋。他指责虎先锋，是因为他知道虎先锋心里到底是怎么想的，先试探一下他。虎先锋果然想得简单，于是黄风大王就顺势拐，利用牛下来虎先锋。就算是将上面查起来，有这么个约定在，虎先锋也不会说是黄风大王在后面指使的。这里的【休得埋怨】不是指心里面怨恨，而是指虎先锋不会去领导那里推卸责任到黄风大王头上找。结果虎先锋战败，黄风大王【低头不语，默思计议】。紧接着，虎先锋被打死，黄风大王算是找到一个冠冕堂皇的理由出战了。结果，黄风大王出师大捷。他打败了孙悟空。但是，黄风大王还是没有乘胜追击，而是返回黄风洞了。因为，他的幽禁尚未解除，他可不敢擅自离职。灵吉菩萨到来之后，有克敌制胜的法宝在身，将黄风大王手到擒来。【行者赶上，举棒就打，被普贤拦住道：“大圣，莫伤他命。我还要带他去见如来。”】对于这个屡教不改的机会主义分子，为什么不让你悟空一棒打死了呢？前面的说法，这个被幽禁的政治犯，要是这样不明不白的死在软禁之地，难免会引起教内外的无端猜测。教内派系丛生，一个不留神让敌对抓住把柄，如来一个以贪污腐败之名清洗教内反对派的罪名。那可就出师有名了，教内还不四分五裂啊！而且，搞不好如来丢车保帅，拉灵吉菩萨做替罪羊，让他背一个羁绊不利的黑锅。灵吉菩萨落得个一死以谢天下结局。因此，灵吉菩萨一定要带他回灵山【明正其罪】。反正破坏取经大业这么大一个罪名，你黄风大王就算不死也别想出来混了。


    纵观黄风岭之难的前前后后，虽然最后由灵吉菩萨收场。但是，其实这场争斗中天庭势力起到了关键的作用。首先，虎先锋是被八成的，直接搅取黄风大王的如意算盘。当然，这可能只是个巧合。其次，李长庚的出现，可以说扭转了整个战局。最后，李长庚的到来是不让提醒悟空去问讯的。一般来说，八戒都是后知后觉的。但凡，有神仙下界为什么都是悟空最先发现，其他人都是蒙在鼓里。这次都不一样，虽然八戒没有直接发现老翁就是李长庚，但是却无意中点明了出路。再看看第二十回的篇名《黄风岭唐僧有难
    半山中八戒争先》，八戒在这一回中表现非常。其实，这一回暗示出玉帝也非常想促成这一谈契。《西游记》中争势，表面上看是佛道双方，其实不正。佛道双方各自也分为两大派系，因此，至少有两方主要的力量参与了角逐。取经一路上就出来这么个黄风大王，实际就是为了暴露佛派内部的纷争。这一点对于我们理解取经路上的磨难是有帮助的。此外，再加上取经路上的各支中恶势力，各大派系内部的公私矛盾、个人恩怨等等，这一切使得整个朝局盘根错节、错综复杂。天际风云暗，神仙方术如琢如磨。


    # 第二十三回 莫家庄耆师大全


    唐僧到底有没有色心？这个问题一直困扰着所有关心取经大业的人们。同样，一路走来这个问题也一直困扰着他的三个徒弟。八戒色欲心重，以己推人，他是不会相信师傅真的是清心寡欲的。悟空一路上对唐僧的清心寡欲是十分怀疑的。并多次对唐僧可能的不贞做了相应的安排：如果失了元阳，大家散伙；如果坚忍不泄，继续西行。比如，第五十五回《色邪淫魔唐三藏
    性正修持不坏身》中，【行者道：“你且立住。只怕这怪物夜里伤了师父，先等我去打打听听。倘若被他呸了，丧了元阳，真个亏了老孙，却就大家散伙；若不乱性情，神心未动，却好努力耕持，打死精怪，救师父去。”】沙僧表面上是相信唐僧的，可是沙僧是个受了唐僧的人，对一切身外事物已经看淡了。对于感情这回事，他是宁愿相信师傅的清心寡欲，而不愿意对师傅有过多的负面想法。他对于师傅的坚守，与其说是充满信心，不如说是充满祈望。


    为了能够一探唐僧师徒的虚实，四位菩萨化身美色，亲临现场实施考验。唐僧师徒初到莫家庄，女主人即开门见山提出要“坐山招夫”，给自己及三个女儿招赘。唐僧听说这话，当时的反应是【推拳妆哑，眼目宁心，寂然不答】。接着女主人接着往下说，唐僧的反应是【如痴如蠢，默默无言】。等女主人将具体情况都介绍完了，唐僧的反应是【好似雷惊的孩子，雨淋的虾蟆；只是呆呆挣持，翻白眼几打仰】。唐僧这一系列的反应说明了上面呢？惊讶。除此之外，有一点可以肯定，就是唐僧不开口。为什么他不开口呢？八戒也很奇怪，更着急。于是是【走上前，扯了师父一把道：“师父！这娘儿子告诉话，怎么个详子不睬？好道做个理会些！】那师父猛抬头，嗤的一声，喝退了八戒道：“你这个孽畜！我们是个出家人，岂以富贵动心，美色留意，成得个甚道理哩？”】其实八戒什么都没说过，只是提醒一下师傅做个理会。当然，他心里怎么想的，大家都知道。结果八戒的举动被唐僧训斥了一番。唐僧训斥得有根有据，在情在理。其实，我们通观唐僧在西路上的表现，就会发现唐僧对于美色的一贯态度就是不开口。不开口就是不说破，不说破就是有玄机。


    那么玄机在哪呢？莫家庄女主人提出“坐山招夫”时说道：【适承长老下降，想是师徒四众。小妇女四个人，意欲坐山招夫，四位恰好。不知尊意肯否如何。】这里提出的配婚原则是嫁女四个配师徒四个。具体化之后，自然就是三个女儿与三个徒弟配婚，娘亲与唐僧配婚。这么一个分配方案，换作我，我也不会同意啊！为什么？唐僧师徒四众之中，唯唐僧的条件最好。偏偏让这个条件最好的唐僧娶老年色衰的寡妇，而把三个黄花大闺女嫁给三个相貌丑陋的妖猴徒弟，这不是埋汰人吗？为什么说唐僧条件最好？相面血迹，唐僧是南赡部洲大唐皇姓；论身世，唐僧的父亲是大学士陈光蕊，外公是开国元相
    program；论背景，唐僧与大唐太宗皇帝是兄弟；论职务，唐僧是左僧纲、右僧纲、天下大阐都僧纲；论长相，三个徒弟根本不能与唐僧相提并论。那三个徒弟具体又是什么情况呢？大徒弟孙悟空，来历不明，在五行山坐了六百余年的大牢，刚刚刑满释放。要不是唐僧经过相救，恐怕今要把牢底坐穿。二徒弟猪悟能，是个吃懒做的，个调戏嫦娥的臭流氓，关键还是个有妇之夫。三徒弟沙悟净，神形木讷，是被天庭判了流放罪的囚犯，而且还被玉帝毁了容貌。所以，菩萨们一开口就错了，唐僧对这样的安排绝对是不满意'
