    唐僧报仇之后，一家团聚，就是滴酱轿到“毕竟从命无了”。请堂娇怎么能不死呢？十八年来滴酱娇就一直生活在矛盾之中。她对刘洪始终是不琢磨不透，刘洪对她也是不咸不淡。她生命中的至关重要的两个男人：李彪，最爱的人，为亲子所杀，而且自己也脱不了干系；除光


