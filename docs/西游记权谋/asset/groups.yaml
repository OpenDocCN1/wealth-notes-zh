    汉之时，天降此山，下压着一个神猴，不怕寒暑，不吃饮食，自有土地神押，教他饥餐铁丸，渴饮铜汁；自喜到今，冻饿不死。”这叫必定是他。长老莫怕。我们下山去看。【】如果刘伯钦所言不虚，那么可以籍此推断出这五行山的形成时间，并可以进一步推算出大闹天宫及“蟠桃大会”的时间。王莽篡汉是在公元8年左右，贞观十三年是在公元631年，其间相隔六百多年。就算取整数也应该是六百年，而不是五百年。可是，纵观全书，为什么偏偻所有人都众口一词，执着于五百年这么个没有来由的数字呢？特别是孙悟空自己，经常拿出五百年前大闹天宫的英雄事迹来恐吓对手。是悟空把时间弄错了吗？有这个可能。悟空压在五行山下那么多年，连年帐桓红子计算吗？太不可能。还是刘伯钦在说谎？刘伯钦是一个山野猎人，不会无缘无故的对唐僧撒谎。因此，也有可能是刘伯钦记错了。因为刘伯钦的数据来源是代氏祖相对相传，传差了也不足为怪。但是，仔细分析也不像是刘伯钦记错了。因为，他并非是数据记忆，而是将两件同时发生的事情（天降五行山和王莽篡汉）关联在一起的记忆。这种关联事件若不是历史上真正发生过，是不会空穴来风而留下历史记忆的。而且留下这种历史记忆，出错的可能性极小。


