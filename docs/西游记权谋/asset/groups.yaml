    观音菩萨来到通天河边，将事先编织好的鱼篮抛入水中，接着念了几句咒语，金鱼精就被收进鱼篮且原形毕露了。菩萨提起鱼篮看着这条小金鱼，这个时候显出原形的金鱼精做了一个所有金鱼精都不会做的动作：【斩眼动鳞。】为什么说这么？我们忽略了一个常识，那就是金鱼是不会眨眼睛的，所以这个金鱼精是有问题的。原文中的这个错误到底是什么意思呢？它似乎在提醒我们金鱼精下界的目的并非我们想象的中吃唐僧肉而已。这个金鱼精对观音菩萨“抛眼圈送秋波”似有所表，只是其中奥秘一时尚不能参透。


    【八戒与沙僧，分开水通，各往那水通去找寻师父。原来那里水怪鱼虾，尽皆死绝。】看来菩萨下手很重，这个鱼篮的作用不仅是收付这个金鱼精这么简单，同时还具有屠城的杀伤力。难怪她非要带上这个鱼篮才与悟空前来救我！前文说过，神佛做事是不顾狠绝的。过平顶山的时候，压龙山大摆龙洞的金银双盏的那些妖怪前文们不都被灭口了吗？这里也是一样。“水鼋之第”的水怪鱼精一样要被灭口。要注意的是观音菩萨在人们心目中可是大慈悲啊！她可不能与大屠杀挂上钩。何况，她还时时教导悟空要积德行善。上次在黑风山上，她还在悟空打下了老鼋怪凌虚子而把悟空责罚了一顿呢！于是，这个鱼篮就显得特别重要了，因为它在不知不觉中就把事情给办了。所有的人都还不知道是怎么回事呢，观音菩萨已经事后回普陀山了。八戒和沙僧下河去救师父的时候，才发现“水鼋之第”的水妖已被老的个不剩了。


    但是，“智者千虑，必有一失”，凡是菩萨绝错罚过人，不过老虎也有打盹的时候，这次出其不意的大屠杀竟然还有漏网之鱼。这个漏网之鱼就是“水鼋之第”的老主人千年癞头老鼋。九年之前，这个癞头老鼋与金鱼精结盟。金鱼精帮了他的几处，夺了他的眷属，占了他的帝所，以致老鼋有家长不能回，有亲人不能聚，终日里苦上帮提，四处流浪。取经队伍路过通天河，金鱼精抓走唐僧，并因此与孙悟空结下梁子。照理来说，这个老鼋应该第一时间跳出来帮助悟空对付金鱼精，以便“狐假虎威”早日夺回自己的帝所，报仇雪恨。衡阳峪黑水河神不就是走的这个路子吗？这是个值得效仿的成功典型！但是，这个老鼋看起来点不认识此时河神：他不是没在第一时间跳出来，而且还是本节中出场最晚的一个大活。连陈家庄的村民都赶来朝拜观音了，这个老鼋还缩在那里睡觉呢！难道是老鼋自知报仇雪冤无望而自甘堕落？他真的成了那个一滩烂泥的“苏乞儿”事情不是这样的！


    让我们再回过头去，看看当初那个小小的鳜鱼精为什么能够献上“千里冰封万里雪飘”之锦囊妙计给金鱼精的。鳜鱼精与唐僧素来谋面，不可能对唐僧的心思了如指掌。因此，这个计策不可能是她想出来的。真正想出这个计谋的就是鳜鱼精的老丈人，这个千年老鼋。其实，取经团队刚到通天河边的时候，他就已经知道了。只是他一直在暗中观察唐僧师徒，并积极思考如何能够借刀杀人，借悟空之手除掉这个金鱼精。所以老鳜鱼对唐僧的心态是有把稳的。他一直没有现身与真正原因，就是他知道这个金鱼精的来历。因此，悟空能除掉所有这个金鱼精。他没有信心。因为，这个金鱼精后台很不一般，是悟空的顶头上司。因此，虽然他的主观愿望很强烈，但是他的这个“借刀杀人”的计谋却使得很消极。只不过起到了“煽风点火”的作'
  md: '

    父要穷历异苦，不能教脱苦海，所以寸步难行也。我和你只做得个拥护，保得他身在命在，替不得这等苦恼，也取不得经来，就是有能先去见了佛，那佛也不肯把经寄与你我。正叫做苦将容易得，便作等闲看。”那呆子闻言，嘻嘻听罢。”


    这场关于云托唐僧的争论有三点意思：

    1. 唐僧是浊骨凡胎，云托不起来；

    2. 可以通过其他地方将唐僧送往灵山，唐僧可以不必步行去灵山；

    3. 如果唐僧不是步行去灵山，则取不得真经。

    这个三个说法，悟空不知道是从哪里得知的，但八戒是认可的。就在前一场黑水河戏说中，我们通过八戒的口述重温了这个说法。【三藏道：“你三个计较，着那个驮我过去罢。”行者道：“八戒成得。”八戒道：“不好驮。若是狄君腾云，三足也不能离地，常言道，背凡人重若丘山。若是驮着负水，转连我坠下水去了。”】


    关于第一点，可以说是最关键的。到底能不能云托凡体呢？这里给出了肯定的答案。唐僧不是给悟空坠上高空了吗？


    关于第二点，妖怪们已经通过无数次的实践证明了这个方法的可行性。


    前面两点都已证明了唐僧不必徒步前往灵山的可能性是真实存在的，至少在操作流程上是可行的。但是为什么偏偏就是无法变为现实呢？这个答案就与这里的第三要素相关联了。唐僧取经的任务本质就是为了谈利，如果观音投放机巧计使取经团队绝路穷道前进，那么取经就没有任何意义了。菩萨安排了39位护法轮流当值监督唐僧，监督取经团队，特别是金头揭谛昼夜不离唐僧左右。不仅如此，如来还亲自做了系统设置，确保取经团队在操作流程上没有投机取巧的可能性。暂且不提。


    看来天哮也很想弄清楚这里到底有什么玄机？因为，八戒和悟空所说的理由很显然都是错的。但是，这个问题终究还是没有搞清楚。当唐僧被悟空驾云驮上高台的时候，这个比试实际已经结束了。为了能够真正的控制这个斗法大会，三位国师必须一败再败下来。这样比试的内容和流程就全部控制在自己手上了。一再说过，好男儿狠不是真正的高手，真正的高手是能够控制局势，让局势按照自己的意愿发展的。深层次上讲，所有的斗法虽然悟空都赢了，但是什么作用都得到。悟空一直极力三位国师弄落云上。三位国师才是真正掌握斗法大会的实际话语权的人。虽然还没有完全弄清楚为什么唐僧不能乘云的原因，但至少在这里可以肯定的是这与唐僧替身大仙无关。


    第一层次斗法的第三环节是隔板挤校。这个隔板挤校又分为三个小环节。这三个小环节是悟空和三位大仙的一次交流。其实，悟空是认识这三位的。暂且不提。


    第一个小环节是猜衣服。这个红漆柜子里面明明明是【山河社稷祃，乾坤地理】，但是悟空却偏偏把它变成了【一件破烂流丢一口钟】。这个名称必须政治寓意明显，分明是内有乾坤。但是，悟空却把他变作【一件破烂流丢一口钟】。口口破钟是什么意思呢？似有“黄钟毁弃，瓦釜雷鸣”之意。暗示天庭不用贤，国已不得志。


    第二小环节是猜仙桃。车迟国哪有什心仙桃？说这个是仙桃只是为了印证天宫的蟠桃。这一小环节的过程可以分为皇帝（玉帝）藏桃和悟空（偷）吃桃两件事。最后打开柜子发现桃子没了。其实，这正是说明了天宫蟠桃是怎么消失的（藏的藏了，吃的吃了）。


    第三个小环节是猜道童。这个小环节是虎力大仙设计的。他将道童藏在柜子里，结果出来的却是一个小和尚，一个不会念经的小和尚。其实，这也正是说明了悟空本人弃道从僧的选择及经历。看来悟空是死心塌地跟着佛祖走了。观音菩萨法力那么强大，自己又带着紧箍咒，不死心塌地怎么能成行呢？


    这一环节其实是暗喻了悟空从积极入道到坠入圈套，最终又弃道从僧的人生经历。悟空把小道士变成了小和尚，这说明最后还是坚定了从僧的信念。这算是悟空在这一回合与虎力大仙的交谈中给出的最后答案。


    第二层次的斗法，也有三个环节，分别是砍头重生、剖腹挖肠和油锅洗澡。实际上这三个环节是三味导师的谢幕表演。他们要以这三个环节为遮掩回去了，因为他们的任务已经完成了。就在这谢幕的过程中，虎力大仙还完成了一件大事。


    先来看第一环节砍头重生。这一回悟空登场。悟空的头被砍了下来，还别到手一脚踢出三四十步远。虎力大仙又急动咒语教土地接住大圣的头，至令大圣原头不能回身。最后，悟空施法术重新又长了一个新头。当然了这个也说不太是什么法术，沙僧说得对【“他有七十二般变化，就有七十二个头哩。”】对于这件事，在场的每一位观众都很惊讶，我也非常之惊讶。我惊讶的不是悟空头被砍下来的怪异场面，而是悟空的头为什么会被砍下。当年在天庭，雷打火烧、刀砍斧新都未能伤悟空分毫，现如今怎么人间一把凡铁砍头刀就把悟空的头剁下来了哪？悟空在五行为不喝钢汁铁丸的奶？按道理来讲，悟空应该是铜头铁臂才对啊。其实，悟空根本不可能足铜头铁臂，世上哪有这样的品种啊？到底算是妖精，还是算作神仙啊？反正肯定不是人。前面讲过，当初天庭的武器伤了悟空是因为如意珠的法力。后来如意珠破裂，法力不再如初。八戒在介绍他的“上盗金耙”时说道：【何怕他铜头铁脑一身钢，钯到魂消神气飘！】可见八戒的耙是不怕钢铁的。可是八戒的“上盗金耙”已然没有毁碎如意珠的这种说明八戒当时没有筑倒悟空，不是因为悟空是铜头铁臂，而是因为他的头上有金箍。关于金箍的作用，我们一直以为是依咒语搞怕悟空的。实际上，金箍如果不错去，悟空还不动打任何人的。悟空确实是拿金箍棒揭掉过路上的这个金箍，但是毫无作用。结果悟空的金箍棒没办法撬开的金箍，八戒的金箍也只能一边呆着了。所以这个金箍还有一个作用就是护头。这是大圣自己说的。第七十五回《心猿钻透阴阳窍
    魔王还归大道真》中，【大圣笑道：“……唐僧惩恶不坚固，预先又上紧金箍。”】


    悟空不是铜头铁臂，因此照着脖颈这一刀下去，悟空的头就没了。但是他有七十二个头，没有一个头也不会致命。问题是砍下来的那个头去了哪里了呢？没有交待，只说是虎力大仙教土地按往在地，暂且不提。悟空没下来啊，有头去无杀吗？不错！实际上场面时斗真正致死的不是悟空的头，而是头上的紧箍儿。因此虎力大仙在这里真正要做的就是把悟空卸了这根箍儿。悟空不是就是因为“紧箍儿咒”的副作用才死心塌地的在取经路上——这条通往黑头的吗？好！让你唐僧你清楚掉这个障碍。从这里我们才可以看出，道法的高下固然与修炼的功夫有关，但更重要的是心窍要通明。时刻要运到如何化解对方的招式，这除了博闻广识、灵台清明之外，还要经久沙场、经验丰富。原始天尊就是运行高啊！金箍打不碎，他悟空怎么就想到原来是头可以连带都一起搞掉？参考杀死这一天大玄去，不是一般人能轻易做到的。这三天天点杀了悟空。悟空参不破解是因为骨子理舍不得这个头。没想到“舍得舍得，有舍才有得”，凡事“置诸死地而后生”。“倒洗澡水连澡盆里的孩子也一起倒掉”的说法在这里发挥了创造性的作用。悟空开始没有反映到来。拼命要去回那个头。但是一通挣扎之后，终于领悟了。这件事够取经队伍里面的所有人看过。八戒的反映是冷笑。沙僧的反映书上没有直接讲，但是他说明了七十二颗头的间题，说明他也看明白目。这一点是非常重要的，说明了悟空的头被砍下来不是自身法所致。因为，分身法也可致敏人体器官的分落及组合。后面会碰到这样的情况。至于唐僧，一时尚未反映过来。


    第三环节剖腹挖肠和第三节悟空洗澡，就两个环节处理不好同样也是玩命的买笑，但是悟空最终还是正过来了。为什么悟空死坏不坏啊？还记得在降伏黄袍怪的时候，悟空得了一样宝哟？不错！正是一颗舍利子玲珑内丹。何以见得是这颗内丹在起作用呢？当时皇恺怪拿内丹就是给悟空疗伤治病的。因此，此丹有此功效。再说，剖腹挖肠并没有致命的危险，有这颗内丹在可保无虞。至于悟空能在油锅洗澡，仍然还是这颗内丹的作用。还记得在玉贞观的时候，镇元大仙架起铁锅烧油欲炼悟空。当时，悟空用法术把锅砸个洞，就跑了！当时为什么不敢下手？镇元子也是用的凡铁凡火凡油啊！从五观到这里一路上，并没见悟空学得到什么新本领啊！只是多了这颗玲珑内丹。


    悟空在铜锅里装死，想要试探一下下各位的反映。八戒知道悟空是装死的，所以大骂孙悟圣，逼他显身。要知道八戒在这里是不能出手的，因为这里有高人在场，很容暴露身份。悟空要是不出来，自己就要下油锅了。但是，真正把悟空逼出来的不是八戒而是唐僧。因为这个时候，唐僧开始意识到悟空捣掇紫金箍这个问题了。不是因为唐僧的道行高，而是因为他能那么一个手段可以控制孙悟空，这是他人唯一的法宝。现在悟空突然间就不见了，唐僧能不着急吗？当然他还是掩饰了一番，不仅少有的表现出了视死如归的勇气，而且要去祭拜悟空以表师徒之情。这一点可以说是一反常态，平时要是悟空常带一点他，唐僧是要骂人的！而且，这里唐僧居然还不怕死。他到悟空面前说了一段，就被八戒打断了。八戒为什么在这个时候打断唐僧呢？因为，如果八戒此时要是不打断唐僧，不提醒悟空，唐僧就要念《紧箍儿咒》来试探悟空了。要是试探出悟空的确耐卧于紫金箍，师徒还不翻脸？到时候，悟空回花果山，唐僧怎么办？八戒、沙僧怎么办？八戒却趴在盆里，不是打算让取经失败，而是首先弄清是取经到底是怎么回事。然后，打探佛界的情报。只要身份不暴露，就一直打探下去，打入灵山内部。这是八戒的真正使命。因此，这时八戒不能让师徒在这个时候起冲突。如果师徒起了内讧，在场的所以有问题都有可能暴露，包括这三位国师的身份证。不但取经计划可能失败，而且极有可能使得灵山和天庭的争斗白日化。


    最后，三位国师都挂了，明了本相：一个变成了黄毛鼠，一个变成了白毛兔，一个变成了羚羊。但是，这个障眼法是白骨精会使的伎俩。也就骗骗车迟国皇帝老少些吧。根据本节中虎力大仙的表现，他的道行极商应该或是元始天尊。而另外两位就是灵宝道君和太上老君。根据后面的情节老君其间应该离开过，没有一个弟子在飞仙隐区。其实，这二十年来元始天尊就销声匿迹了，一直在车迟国闭关。正所謂「小隐于野，中隐于市，大隐于朝」啊！所以，当年在五庄观镇元子说去上清天听讲“混元道果”是撒谎。当时，其实当时也留下了破绽：根本没有什么上清天。就算是有清境也是灵宝道君的别院区。元始天尊隐居玉清峰紫福天。


    至于唐僧后来有没有试过默念《紧箍儿咒》？没有。唐僧就是默念《紧箍儿咒》，悟空一旦没有反映，机关就被拆穿了。从后面发生的事情来看，唐僧念《紧箍儿咒》的时候，悟空的反映是正常的，这是为什么呢？暂且不提。


    那么悟空为什么要继续装下去呢？没有了紧箍儿的挟制，他为什么不离开呢？一方面，悟空现在已经是骑虎难下了，三界都知道这个取经大事，现在己经进行到了一半了，不是说走就说得掉的。再来，玉帝、菩萨会这么容忍起他吗？第五十七回《真行者落釜山书告
    假猴王水帘洞神文》中【却说孙大圣恼恼闷闷，趁在空中，欲待回花果山水帘洞，忽本小妖见莫，笑我出乎反尔乎，不是个大丈夫之器：欲时要投奔天宫，又恐天宫内不容住；欲时要投海岛，却又无是三岛诸仙；欲时要弃身空，又不快气求吾长生。真是个是无依无倚，苦甘自付量道：“罢！罢！罢！我还去见我师傅，还是正果。”】这就是悟空的现实处境，要么两天取经正果，要么就是“天地不容”。另一方面，骨子里悟空一直想弄清自己真实的身份。他的身份跟取经的实质有着千万公里的联系，要想弄清自己的身份，就得搞清楚取经到底是怎么回事？而要揭开取经的秘密，就必须要关注和想办法借自己一遭。


    本节之中，唐僧的护法诸神煞费苦心的安排了这么一个弘扬佛法的计谋，到头来还是“螳螂捕蝉、黄雀在后”。老谋深算的三清天尊，还是道高一尺，原来早就在这里布局撒网了。


    惜了这些个护法小神在这里跳梁献丑，自以为得计。三清在这里卸掉悟空头上的金箍，旨在制造混乱，以便“浑水摸鱼”。如此，三清虽然此番阴谋得逞，但还是有失察之处。试想，如果三清一开始就知道悟空早就发现了他们的真实身份，他们还舍得用这种和取经队伍打太极的方式解决问题吗？不会。那也太伤自尊了；自己演得那么投入，原来别人早就知道了！因此，三清在这里之所以会这么兜兜转转，完全是因为他们对孙悟空的火眼金睛缺乏了解。其实，不光是三清，包括如来及悟空自己在内的所有卡，谁也不了解火眼金睛的真实功能。因为，火眼金睛是一个意外，而意外是不可言说也不可解释的！


    ## 第三十一回 通天河灭门惨案


    通天河灵感大王的来历虽然与其他众多妖精一样，都是从三界高层领导家里跑出来的，但是他下界为妖的目在取经路上却是独一无二的，与唐僧师徒遇到的其他所有妖精都不同。暂且不提。


    唐僧师徒离开了车迟国都城，一路西奔，在悟空的强硬态度下（没了紧箍咒就是不一样）只到通天河边才住脚。因一时无法过河，故而寻到车迟国会元县陈家庄陈家变化去借宿。并由此得知了通天河灵感大王保镖童男童女之事。由于感观陈家老娘娘的盛意款待，悟空决定和八戒冒名顶替陈家子女陈关保和陈一童一作被陈家大享用作童男童女。


    这当中有一个小问题，就是陈家庄之所以要祭赛灵感大王，就是为了陈家庄能够风调雨顺、五谷丰登。前面在车迟国的时候说到，车迟国的风雨不是有三位国师来保佑的吗？这辆陈家仍是车迟国的领地，怎么皇帝不管这一方子民了？这说明，皇帝宠信国师不是因为风调雨顺，而是因为三位国师答应帮他祈求长生不老。这三位国师很是特别，一般道士寻求长生不老都是寄希望于于炼丹的。比如后面的比丘国的国师。但是这三位国师搞什么向三清祈求祷告之类的，真是会为自己打广告啊！三清是领导做惯了，就知道开刀！


    灵感大王在祭赛大会上碰了钉子，闷头闲坐不语。有鲤鱼献计冻结河流以诱捕唐僧。灵感大王闻此大会，言事成则与鲤鱼拜兄妹。果然，唐僧不听众人劝阻要踏冰西行，结果着了妖精的道。这里也有一点问题。


    首先，鲤鱼献计时原文中是这样描述的：【“……大王稳坐河心，待他脚踩响处，进裂寒冰，连他那徒弟们一齐坠落水内，一鼓可得也！”】可见鲤鱼的意思是把唐僧师徒一网打尽了。但是在实际的操作过程中，灵感大王只是抓了唐僧，而没有抓八戒和沙僧。这是为什么呢？因为灵感大王的目标只是锁定在了唐僧本人。他为什么抓唐僧？【那怪（灵感大王）道：“……一向闻得人参唐，唐三藏乃十世修行好人，但得吃他一块肉延寿长生。不期他手下有这般徒弟，我被他坏了名声，坏了香火，有心要捉唐僧，只怕不得能彀。”】从这里来看，似乎是为了吃唐僧肉而来的。但是此说不妥。


    在观音收伏灵感大王之后，【老耆道：“大圣，你不知这底下水龛之第，乃是我的住宅，……那妖怪却乃九年前啸海波澜，他起潮来，未于此处，使道凶烦，与我争斗，被他伤了我许多儿女，夺了我许多喽兵。我斗他不过，将巢穴白白的被他占了。……”】由此可见，金鱼精来通天河是在九年前，而此时是贞观二十六年，取经上路是七八年辰光。依照之前的推论，九年之前取经之事还无从说起，唐僧肉之说还没有形成。那么九年之前金鱼精到通天河来是做什么的呢？其实，金鱼精偷下界是有特殊原因的，但是来通天河却是意外。当时金鱼精乘海水涨潮游出莲花池，出海周游为了找一个人。但是他一直没有找到要找的人，因此流落在通天河，强占了通天河的“水鼋之第”。他并没有打算久居此地，“水鼋之第”的名称并没有改掉，这说明金鱼精最终的打算是会离开这里的。


    他要找的人是谁呢？金蝉子。但是他当时并不知道金蝉子在哪里。只到唐僧肉之说开始流 传，金鱼精才知道原来金蝉子转世为唐三藏了。由于妖精的地盘观念极重，金鱼精的生活又离
    不开水域，他不能在西天路上主动出击，只能在通天河这个西行必经之路上等候唐僧的到来。 至于金鱼精为什么要找金蝉子？暂且不提。


    另外，唐僧师徒确实是打算以踏水西行的方式渡过通天河的。而且，在通天河上行走的十 分仓促，可以说是昼夜不停。并没有打算一定要提住金鱼精。这一事实反映出取经队伍
    的成熟，特别是孙悟空的成熟，不再惹事生非了。只不过后来，金鱼精出手了，悟空没有办法，只能应 战。


    八戒和沙僧来到水下，在与灵感大王交手之前，有一段对话令人生疑。 【妖邪道：“你原来是半路上的和尚。”八戒道：“我的儿，你真有些灵感，怎么就晓得我是半路出家
    的？”……那个妖邪那里肯肯，举钢锤劈头就打，八戒使钉耙架住道：“你这泼物，原来也是半路上成精的邪魔！”那怪道：“你怎么认得我么是半路上成精的？”。】 这段对话是双方瞎扯的吗？不是。瞎扯也不至于推到这
    个上面来啦！而且，扯得还挺多准。


    其实，他们两个是互相知道对方身 份的。八戒在福陵山云栈洞半路出家，观音和木叉是知道的。


    因此八戒熟知这件事并不奇怪。金鱼精下界在通天河为妖，八戒是当初知道他是半路成精的呢？其实八戒在黑水河的时候就已经知道。事情还 得从乌鸡国讲起。当初说到是乌鸡国的那个井龙王的来历有问题，但是一直也没有揭
    示他的真实面貌。他真正的身份其实就是黑水河的小鼋龙。


    当时井龙王让八戒把尸体拖走时，八戒伸手 要钱，但是井龙王说没钱。那时井龙王 同时还说了一段醉意很浓的话。【龙王道：“可伶，我这里怎么得个宝贝？比不得那江河
    淮济的龙王，飞腾变化，便有宝贝。我久困于此，日月且不能长见，宝贝果何自来也？”】这里井龙王为什 么提到江河淮济的龙王？为什么不提四海龙王？要说宝贝当然是四海龙王家里多了呀！在黑水
    河这一节，【行者道：“你令妹共有四个贾陪？都在那里作怪？”龙王道：“舍妹有九个 儿。那八个都是好的。第一个小黄龙，见居浑渎；第二个小鼋龙，见住济渎；第三个青背龙，占了江
    渎；第四个赤鬃龙，锁守济渎；第五个潜龙，与佛祖同伴，第六个鲍方神，与神 签销骨；第七个敬仲龙，与玉帝 镇守华表；第八个鼋龙，在大父 兄处砥砺太岳，此乃第九龙女，因年幼无甚抵事，自旧年才着他居黑水
    河养性，待成名， 别迁调用，谁知他不遵旨意，冲撞大圣也。”】 看到没？江河淮济的龙王职位都让小鼋龙的四 个哥哥给了。小鼋龙对于男女之情的安排十分 的不满，所以在黑水河龙王是安分守齐。金龙小
    鼋龙把唐僧这件事情不单领。暂且不提。龙王 所说的【我久困于此，日月且不能长见】，其实是 指被困在黑水河，日月不能常见， 而不是指在井里面。由于八戒在乌鸡国跟他接过一次龙
    之 所以知道这事，又被小鼋龙抓住，这 区间小鼋龙 一定告诉了八戒关于通天河的事。 小鼋龙之所知 道这事，是因为金鱼精和小鼋龙是隔 壁邻居，双 方的势力范围是划定接壤的。当然西
    天路上多出一个妖怪，任何关心取经的人都会去 调查，这其中 自然也包括八戒背后的黑手。当八戒在灵 感大王庙击中金鱼精拿起那片鱼鳞的时 候，八戒就已经知道他是谁了。那
    妖怪掳了八戒的底之后，又揭了沙僧的底。但是沙僧什 么也没说，他并不知道那么多。所以八戒提 供悟空的情，沙僧 以为师父走了就不能继续下水了，而八戒却跟 继续前进。因为八戒知道这个妖怪的底
    细。否则，依八戒的道行他会那么 冒尖吗？


    由于金鱼精高挂免战牌，而且把 这个门也堵死了，悟空没有办法只 得前往普陀山求观菩萨 帮忙。 对于悟空的这一次求 救，观音的表现超出了所有人的意 料。悟空到了南海，诸神把他拦
    在潮音洞外，说是菩萨让他在外面等 候。悟空为救师父，十分心焦，就闯了进去。 看见菩萨在编制竹器，悟空想对菩萨道明十万火急之来意。但是菩萨一再让他在外等候。看来菩萨的心情不好。悟空不敢争执，只好在洞外等候。等到菩萨背出来的时候，没想到菩萨的心情比悟空还要急切。菩萨连外衣也没得及穿就要出门了。这把悟空吓坏了，以为刚才乱嚷嚷把菩萨激怒了。跟之前一次悟空来南海求救相比，这一次观音菩萨的反应完全不一样。这是为什么呢？很多人以为，观音这是急着来救他的宠物小金鱼来了。其实不是。如果悟空能够奈何得了金鱼精，悟空还会来这边求菩萨吗？观音这次出来的目地是真正的救唐僧。而不像其他的大领元帅实际都是冲着猪猴来的。因为观音担心金鱼精一时冲动铸成大错。金鱼精抓唐僧是要杀唐僧，而不是要吃什么唐僧肉。


    观音菩萨来到通天河边，将事先编织好的鱼篮抛入水中，接着念了几句咒语，金鱼精就被收进鱼篮且原形毕露了。菩萨提起鱼篮看着这条小金鱼，这个时候显出原形的金鱼精做了一个所有金鱼精都不会做的动作：【斩眼动鳞。】为什么说这么？我们忽略了一个常识，那就是金鱼是不会眨眼睛的，所以这个金鱼精是有问题的。原文中的这个错误到底是什么意思呢？它似乎在提醒我们金鱼精下界的目的并非我们想象的中吃唐僧肉而已。这个金鱼精对观音菩萨“抛眼圈送秋波”似有所表，只是其中奥秘一时尚不能参透。


    【八戒与沙僧，分开水通，各往那水通去找寻师父。原来那里水怪鱼虾，尽皆死绝。】看来菩萨下手很重，这个鱼篮的作用不仅是收付这个金鱼精这么简单，同时还具有屠城的杀伤力。难怪她非要带上这个鱼篮才与悟空前来救我！前文说过，神佛做事是不顾狠绝的。过平顶山的时候，压龙山大摆龙洞的金银双盏的那些妖怪前文们不都被灭口了吗？这里也是一样。“水鼋之第”的水怪鱼精一样要被灭口。要注意的是观音菩萨在人们心目中可是大慈悲啊！她可不能与大屠杀挂上钩。何况，她还时时教导悟空要积德行善。上次在黑风山上，她还在悟空打下了老鼋怪凌虚子而把悟空责罚了一顿呢！于是，这个鱼篮就显得特别重要了，因为它在不知不觉中就把事情给办了。所有的人都还不知道是怎么回事呢，观音菩萨已经事后回普陀山了。八戒和沙僧下河去救师父的时候，才发现“水鼋之第”的水妖已被老的个不剩了。


    但是，“智者千虑，必有一失”，凡是菩萨绝错罚过人，不过老虎也有打盹的时候，这次出其不意的大屠杀竟然还有漏网之鱼。这个漏网之鱼就是“水鼋之第”的老主人千年癞头老鼋。九年之前，这个癞头老鼋与金鱼精结盟。金鱼精帮了他的几处，夺了他的眷属，占了他的帝所，以致老鼋有家长不能回，有亲人不能聚，终日里苦上帮提，四处流浪。取经队伍路过通天河，金鱼精抓走唐僧，并因此与孙悟空结下梁子。照理来说，这个老鼋应该第一时间跳出来帮助悟空对付金鱼精，以便“狐假虎威”早日夺回自己的帝所，报仇雪恨。衡阳峪黑水河神不就是走的这个路子吗？这是个值得效仿的成功典型！但是，这个老鼋看起来点不认识此时河神：他不是没在第一时间跳出来，而且还是本节中出场最晚的一个大活。连陈家庄的村民都赶来朝拜观音了，这个老鼋还缩在那里睡觉呢！难道是老鼋自知报仇雪冤无望而自甘堕落？他真的成了那个一滩烂泥的“苏乞儿”事情不是这样的！


    让我们再回过头去，看看当初那个小小的鳜鱼精为什么能够献上“千里冰封万里雪飘”之锦囊妙计给金鱼精的。鳜鱼精与唐僧素来谋面，不可能对唐僧的心思了如指掌。因此，这个计策不可能是她想出来的。真正想出这个计谋的就是鳜鱼精的老丈人，这个千年老鼋。其实，取经团队刚到通天河边的时候，他就已经知道了。只是他一直在暗中观察唐僧师徒，并积极思考如何能够借刀杀人，借悟空之手除掉这个金鱼精。所以老鳜鱼对唐僧的心态是有把稳的。他一直没有现身与真正原因，就是他知道这个金鱼精的来历。因此，悟空能除掉所有这个金鱼精。他没有信心。因为，这个金鱼精后台很不一般，是悟空的顶头上司。因此，虽然他的主观愿望很强烈，但是他的这个“借刀杀人”的计谋却使得很消极。只不过起到了“煽风点火”的作

