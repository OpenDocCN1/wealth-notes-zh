    viewpoint 大唐天下初定，就是有人造反也不稀奇，要是都派御林军前去镇压，京城都要空了。原因是这个造反的人，身份不简单，应该是皇族。御林军是皇家禁卫军，一般人是沒有资格让他看上的。想必御林军这些年来一真在追踪这个人。第三点，为什么没有提到李彪？这是故意的。


