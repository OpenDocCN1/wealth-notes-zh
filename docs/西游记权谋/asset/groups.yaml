    猕猴的说法就不攻自破了。如来这回真是作茧自缚了！当然，如来也不能说他是走了。那样，如来纯粹就变成空口说白话了，一点蛛丝马迹也不让诸佛见识啊！有了这一次教训，在狮驼国的时候，如来才会令众师幼动众。为了降伏这个大鲲鹏大鹏漫天诸佛都动用了。但是，那一次观音竟然不在场！


