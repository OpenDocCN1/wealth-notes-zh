  - '[PAGE 70]


    唐僧也用不着天天跟他板气了。悟空是什么人？难道唐僧还不知道吗？就是因为悟空说话太实在，不留情面，才经常得罪师父的。因此，在这里与其说是八戒给悟空冠罪名，毋宁说是唐僧在给悟空找罪名。八戒的这个话是说到领导心里去了。


    原因二，为了验证《紧箍儿咒》之事是否属实。八戒是在五庄观第一次听说《紧箍儿咒》这事。本来唐僧在五庄观是要念的，但是经海上三星的劝说才没念。当时八戒第一唐僧
    说要素《紧箍儿咒》的时候，他的反映又是愁又笑。愁的是自己被贼逃脱不得，笑的是唐僧曾念的什么“旧话术经”从未听说过。悟空大致的给他解释了一下。八戒听说了这么个稀奇事，当然要找个机会验证一下。更何况，八戒的身份并不单纯。沙僧也有一种心态，他也想看看稀奇。于是，打死白骨精一事刚刚好多验了他们的难题。既替八戒报了仇又验证了稀奇。八戒两次唆使唐僧的时候，目的都很明确，就是直指《紧箍儿咒》的。第一次目的是验证《紧箍儿咒》，验证成功后，第二次不仅再次加强了个验证，更是以此来整悟空了。谁也不会想到，唐僧真的会把悟空赶走。所以，最后悟空走的时候，八戒也没言语了。


    原因三，为了能够在取经队伍中出头。第二十九回《脱蓬江流见国主 承恩八戒转山林》中，【国王定性多时，便问：“猪长老长沙长老，是哪一位于圣落好？”那呆子不知好歹，答道：“老猪会降。”国王道：“怎么家降？”八戒道：“我乃是天蓬元帅，只因罪犯天条，堕落下世，幸今皈正为僧。自从东土来此，第一会降妖的是我。”】这说明八戒早有出头的心愿，但是一直苦无机会。悟空一走，他的机会就来了。悟空倒说了阻碍他八戒扬名立外的绊脚石了。再看
    八戒在五庄观中的表现吧！当悟空还在外四处寻找救活人参果树的良方的时候，八戒在五庄观跟着海上三星是没念没了的逗乐子。八戒这一连串的举止实在是让人看不懂，他为什么要那样做
    呢？表面上看原因只有一个，他闲得以至于无聊了。所以，有悟空在，八戒是没有机会表现的，更别谈什么扬名立万了。当八戒意识到师父可能真的要赶走悟空的时候，八戒的内心肯定是因过一丝灵光。同时，他的内心也是矛盾的，原来他没有赶走悟空的打算，现在突然间就有了可以好好表现的机会。他既紧张兴奋，同时也有些失落窝。师父就这样把大师兄赶走了？此时的八戒说不出话来，他不知道要说什什，他很乱。


    那么本集中沙僧为什么一直不开口呢？除了刚才说到的他也想看稀奇的原因之外，另一个更加重要的原因是他看透了唐僧的心思。他是第一个意识到唐僧可能会真的赶走悟空的人。
    如此，他知道说什么也没有用了。回天乏术，徒增师父厌恶而已。《那大圣》对唐僧道：“···· 我曾穿石洞，入深林，擒魔捉怪，收八戒，得沙僧，吃尽千辛万苦。今日味得慢慢怪糊涂，只教我回去，这本是鸟尽弓藏，兔死狗烹！”·····”悟空到最后才意识到唐僧是抓着明白装糊涂，之前他还一直心存侥幸的认为《虎毒不伤子》，真是大错特错了。其实，沙僧在取经队伍中是心态最特殊的一个，他根本没把取经当成什么事，所以看事情比较超脱、比较透彻，他早就看出了其中的奥秘。最后，悟空【却又吩咐沙僧道：“贤弟，你是一个好，却只感觉留心劝着八戒讲话说话，途中更要仔细。”·····】悟空最后说沙僧是一个好人，不光是因为他也感留心没有跟八戒和唐僧一起揣着明白装糊涂，更是因为他理解了为什么沙僧一直没有开口的原因。是啊！
    好人不易懂。既不得罪师父，又不能抛弃师兄，只能闭嘴。这一回中，唐“借题发挥”赶走悟空，使的是“借刀杀人”之计。'
