    先从陈光蕊的大婚说起。陈光蕊金榜题名之后，【跨马游街三日】，恰巧殷丞相府抛绣球卜婿。殷温娇小姐，又名满堂娇，一眼看中式郎元，"心内十分欢喜"，遂将绣球卜中光蕊。且不说殷小姐开门虎女，这百花高中的百步穿杨之技令人叹服，下面的事情越来越神奇。抛中光蕊之后，不问缘由，就直接拉进府去拜堂了。就算是抛绣球卜婿，也不用这么着急吧？父母之命，媒妁之言还要不要？这堂堂的宰相府还有没有礼数了？这是嫁女儿还是拉郎配啊？光蕊同志，既鲤鱼跃入龙门，身份不同了嘛。不再是那海州的寒酸的书生。而且，光蕊还有高堂老母在家守候，婚姻大事岂能不经得她老人家的允许？就算是抛绣球卜婿，成亲也还要择个良辰吉日吧？这个也不讲究了？那丞相和夫人，即时出宴，唤宾人赞礼，将小姐配与光蕊，事同孝，客人事前准备好了，看来今晚一定要把这一个女儿嫁掉了。（其实，《西游记》中很多事情都是发生过两次的，一次是虚写、简写，一次是实写、细写。这抛绣球卜婿应该是个什么样的流程？唐僧也曾经历过。两厢对比，即可看出真正的抛绣球卜婿的应有流程。这次纯粹是造假。）


    这是为什么呢？显然，此时的满堂娇已经有孕在身了，急于成亲来文过饰非。这个急不光是时间上的急（肚子就要显出来了），更重要的是事情一定要办得利索紧凑。不然，男方一旦发觉其中有事，愿意进门就顶绿帽子啊？


