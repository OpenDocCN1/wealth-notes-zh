    謙和是成功的法寶，是勝利的訣竅。不論你從事何種職業，擔任什麼職務，都只有謙虛謹慎，才能保持不斷進取的精神，才能增長更多的知識和才幹。謙虛謹慎的品格能夠幫助你看到自己的差距，永不自滿、不斷前進，可以使人冷靜地傾聽他人的意見和批評，謹慎從事。否則，驕傲自大、滿足現狀、停步不前、主觀武斷，輕者使工作受到損失，重者會使事業半途而廢。


    一天，居里夫人的一名朋友到她家裡做客，朋友的孩子無意間看到擺在櫃子上面的一枚金獎章，產生了好奇，想要拿下來玩。


    這可不是一枚普通的獎章，而是英國皇家學會頒給居里夫人的。能夠得到皇家學會的認可，那是至高無上的榮譽。但是孩子哪裡懂得這些，一味要玩。朋友當即斥責孩子。


    這時，居里夫人阻止了她的朋友，拿下了那枚獎章，放到孩子的手裡。同時告訴朋友，獎章只能代表過去的成績，而我們絕不能永遠守著過去，否則就將一事無成。


    居里夫人始終保持一種對事業的謙和態度，她並不因為取得了巨大的榮譽就高高在上，而是勝不驕、敗不餒面對所有一切。也正是在這種謙和的品格影響下，後來她的女兒和女婿也踏上了科學研究之路，並再次獲得了諾貝爾獎。


    可見，謙和能使一個人面對成功、榮譽時不驕傲，相反把它視為一種激勵自己繼續前進的力量，而不會陷在榮譽和成功的喜'
