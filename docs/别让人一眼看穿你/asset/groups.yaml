    ## 別讓人一眼看穿你

    聽心與藏心的攻防智慧


    奉承來向你接近，向你要求，甚至向你進行軟性的勒索。


    再如，一聽到某類言語、或碰到某種類型的人就發怒的人，有心者便會故意製造這樣的言語、指使這種類型的人來激怒他，讓他在盛怒之下喪失理性，迷亂心智，失去風度。


    一聽到某類悲慘的事或自己遭到什麼委屈，就滿臉哀傷，甚至傷心落淚的人，有心者瞭解他內心的脆弱面，便會以種種手段來博取他的同情心，或是故意打擊他情感的脆弱處，以達到目的。


    FBI 探員在辦案時，就經常利用對方的心理弱點。


    某次他們在審問一個嫌犯時遇到了困難，這個罪犯非常頑固，不肯說出與他合謀犯罪者的姓名。探員絞盡腦汁也始終無法「擰開」他的嘴。


    之後的審問中，探員突然注意到一個非常小的細節，在提到嫌犯母親的時候，頑固的嫌犯臉上突然閃現出了一絲痛苦之情。FBI 探員心裡明白，這可能是他最大的弱點。


    於是，探員專程去拜訪了嫌犯的母親，並且請其錄製了一段規勸嫌犯表白的影片，然後播給嫌犯看。


    果然，嫌犯的心理防線開始瓦解，供出了合謀者的姓名。


    如果連喜怒哀樂都不能隨心表達，這種人生也太過於小心翼翼了；不過，若因喜怒哀樂表達失當而給自己招致禍端，這樣的人生也是極度失敗的，也可以說是人生的悲哀。因此，人有必要做一個喜怒哀樂見不著痕跡的人，這樣做是有好處的！


    首先，把喜怒哀樂從情緒中抽離，便能夠用冷靜客觀的心態去面對自己所遇到的事情，思考它給你帶來的積極意義，並進而


    ## Step 5 矜持 不顯露，把喜怒哀樂放進口袋吧！


    訓練自己對喜怒哀樂的控制。


    其次，把喜怒哀樂放在口袋裡就是不隨便表現這些情緒，這樣不容易被人看穿自己的弱點，能更好地保護自己。


    不能把喜怒哀樂放在口袋裡的人，則無法適應這個社會，這有兩方面的原因：


    第一，不能適當控制自己情緒表達的人，給人第一印象就是不成熟，還沒長大。


    只有小孩子才會說哭就哭，說笑就笑，說生氣就生氣。小孩子隨意表達的情緒，會被大人說是天真爛漫，但是如果這種事情發生在一個成年人身上，人們就不免對這個人的人格發展感到懷疑了，就算不當你是精神病，起碼也會認為你不夠成熟。


    如果你還覺得自己年輕，率性一點也許無關緊要；但是如果你已經工作多年，或是已經過了三十歲，那麼別人就會對你失去耐心。因為別人除了認為你還沒長大之外，也會認為你沒有控制情緒的能力。這樣的人，一遇不順就哭，一不高興就生氣，是無法成就大事的。


    第二，不能把喜怒哀樂隱藏好的人，會被人輕視，被認為你是一個脆弱而敏感的人。


    哭也許是一種緩解壓力的好方法，但是在眾人面前號啕大哭，確實是一種軟弱的表現。絕大部分的人都能忍住不哭，或回家再哭，但卻不能忍住不生氣。


    生氣有很多負面作用，首先是會在不經意間傷害無辜的人，有誰願意無緣無故挨你的罵呢？而被罵的人有時是會反抗的。


    其次，人們經常見到一個人生氣，就難以和這個人保持親近，所以經常生氣的人與別人的關係在無形中就拉遠了。


    另外，偶爾生一下氣，別人會怕你，如果常常生氣，久而久之別人就不會在乎了，反而會抱著看猴戲的心理，這對你的形象也是不利的。


    最後，生氣對身體不好，不過別人對這一點是不在乎的，但是對於你個人而言，這是最為直接的壞處。


    所以，在藏心中，把喜怒哀樂放在口袋裡是很重要的一件事，雖然有時候過度的不形於色會給人陰沉的感覺，但情緒的表現絕不可過度，尤其是哭和生氣。


    如果你不善於克服自己的這兩種情緒，那麼你還不如在這兩種情緒即將發生的時候，趕緊逃離，等到情緒平復了之後再回來。


    如果沒有地方可暫時躲避，那就深呼吸，不要說話，這一招對克制生氣特別有效！


