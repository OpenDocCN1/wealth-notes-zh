    # STEP 8


    # 理解


    不害怕，消除心中的恐懼


    恐懼的危害已經影響到了人的正常社交活動。隨著人們生活、工作的壓力越來越大，患恐懼症的人也越來越多。對於恐懼症，我們一定要有足夠的重視，即便恐懼還沒有發展到病態的地步，它也會給我們造成負面的影響。所以，我們有必要藏住自己內心的恐懼。


    在本章，我們將向大家具體講一講人的驚恐反應，以及驚恐反應的隱藏和控制。


    ![](img/65c5e2383679681693f7479829cb5f93_201_0.png)


    ![](img/65c5e2383679681693f7479829cb5f93_201_1.png)'
  - '[PAGE 202]


    # 驚恐的危害


    本篇我們將具體講述人的驚恐反應，以及驚恐反應的隱藏和控制。


    恐懼是一種人類的心理活動狀態，是因為周圍有不可預料、不可確定的因素而導致的無所適從的心理或生理的一種強烈反應，是只有人與生物才有一種特有現象。人類的大多數恐懼情緒是後天獲得的。恐懼反應的特點，是對發生的威脅表現出高度的警覺。


    就恐懼而言，人和動物的最大區別是：動物只會對它們感受到的事物而恐懼，而人則會對不存在的東西產生恐懼。這就意味著，我們的恐懼在有時候是毫無必要的，這也是我們克制和隱藏自己恐懼的主要原因。


    其實，人很奇怪：為什麼人會因為不存在的事物而感到恐懼。這到底是為什麼呢？


    照英國神學家詹姆士·里德（James Reid）的說法：「多少恐懼都是因為我們對世界的不理解和這個世界對我們的控制。」因為我們心中有未知的东西，所以會感到恐懼。可是你有沒有想過，既然是未知的東西，又有什麼好害怕的？我們又有什麼必要讓這些看不到的東西搞得我們心神不寧、亂了方寸？


    心理學專家們曾經做過這樣一個實驗：他們找到一個死囚，告訴他：「我們現在有一種無痛的死亡方式，這種方式我們之前沒有採用過，還處在實驗階段。你如果同意配合我們做這個實驗，那我們將會給你的家人一大筆補償。」'
  - '[PAGE 203]


    死囚心想左右是一死，不如臨死前給家人做點貢獻，於是便答應了專家的要求。


    在行刑的那天，專家告訴死囚說：「我們將割破你的動脈，讓你的血一點點地流乾，最終死亡。但是請你放心，你不會感到一點疼痛。」


    然後，專家讓人矇住了死囚的眼睛，然後給他的手部做了局部麻醉。


    在那之後，死囚聽到滴滴答答的聲音。死囚意識到：這是自己的血在不斷地往下流。幾分鐘之後，死囚便喪失了生命。


    事實上，專家並沒有給死囚放血。他只是在死囚旁邊放了一個水桶，然後讓水不斷地滴到水桶裡。死囚完全是被自己的恐懼心理嚇死的。


    這個案例說明了一個問題：恐懼會對人的心理和生理造成致命的傷害。那麼，恐懼對人體有哪些具體的危害呢？


    當一個人感到威脅的時候，恐懼就產生了，這時候個體的活動會減少，一個人的目光會凝視危險的事物。如果危險還在不斷升級，就可能發展為難以控制的驚慌狀態。此時，會導致人產生激動不安、或哭或笑、思維和行為失去控制，甚至休克。


    恐懼還會帶來一系列的生理反應，包括心跳猛烈、口渴、出汗和神經質發抖等，在恐懼反應中，肌張力、皮膚導電性和呼吸速度的增加主要與腎上腺素的功能相聯繫。


    如果一個人長期生活在恐懼中，則會導致他患上「恐懼症」。


    恐懼症是一種比較常見的心理疾病，主要表現在對某些事物過分的恐懼和焦慮上，不同的類型發病的原因和具體表現出的症狀差別很大。社交恐懼這類患者其恐懼對象主要為社交場合、'
  - '[PAGE 204]


    # 別讓人一眼看穿你

    謀心與藏心的攻防智黙


    人際接觸等，如：害怕見人時臉紅（紅臉恐懼症）、怕與人對視（對人恐懼症）。這種恐懼症的患者具體表現如下：


    +   ①對某些特定的事物或處境有不可抑制的恐懼，這種恐懼和特定事物所造成的危害是不相稱的。


    +   ②在恐懼症發作時，會伴有頭暈、昏倒、心慌、顫抖、出汗等生理反應。這是比較明顯的恐懼症對人體的危害。


    +   ③恐懼症患者會迴避讓他們感到恐懼的特定事物。


    +   ④恐懼症患者本人也知道這種恐懼的過分、不合理、不必要，但是不能自制。


    以上介紹的就是恐懼症對人體的危害。恐懼症的發生原因，一般是由於某種令人感到恐怖的刺激情境的強烈刺激或長期作用造成的。除了客觀因素之外，個人的認知水準和個體的神經系統的強弱，個人的生活經驗、意志力方面的偏差和缺陷也是造成恐懼症的原因。


    恐懼的危害已經影響到了人的正常社交活動。隨著人們生活、工作的壓力越來越大，患恐懼症的人也越來越多，對於恐懼症我們一定要有足夠的重視。即便是我們的恐懼還沒有發展到病態的地步，它也會對我們造成負面的影響，所以，我們有必要藏住自己內心的恐懼。'
  - '[PAGE 205]


    # 理解，降低恐懼的程度


    在現代社會，恐懼越來越有力地折磨著我們，到了每一個人都無法規避的地步。面對無常的世事，人是非常脆弱的。苦難、精神創傷，在我們的生活uos幾乎不可避免，我們會因此而感到恐懼也是無可厚非的。但是如果我們的恐懼超出了理性，那我們就需要反省自己了。


    FBI 著名探員吉姆在談到恐懼時曾經說過：


    1986 年，<|message|>克蘭的車諾比核電廠發生核能外洩事故，這是有史以來最為嚴重的核災。


    在事故發生之後，許多附近的居民都生活在極度的恐懼中，因為根據最初的估計，將會有幾萬人因這場事故而死亡。核能外洩事故帶來最為恐怖的破壞不是來自於核反應爐本身，而是來自於人類的意識。在事故發生之後，那些驚慌失措的商人都立即離開了這個區域，使得該地區的失業率不斷上升，貧困也迅速蔓延。那些無法離開的當地居民焦躁不安、心理壓抑並開始酗酒和自殺。


    因為害怕自己尚未出生的胎兒受到核輻射的污染，有將近超過十萬名的準媽媽選擇了不必要的墮胎。想像中的恐怖景象帶來大範圍的悲劇，在對核輻射的恐懼所造成的傷害面前，核輻射本身帶來的傷害要小得多。


    根據多年後的調查來看，因核輻射而死亡的人數不足一百人。與此同時，美國每年有八千人因為曝曬於太陽光之下而患上皮膚癌。這就是說，陽光對人類造成的具體危害要比核災更為嚴'
  - '[PAGE 206]


    重，但是所有人都會因核災而感到恐懼卻沒有人會害怕陽光。由此可見，我們的恐懼在大多數時候是盲目的。


    吉姆的這番話對我們啟發頗深，在大多數時候，我們的恐懼都是沒有必要的。如果不能控制這些沒有必要的恐懼，將會給我們的生活造成不利的影響。


    舉個很簡單的例子，2011 年日本核電廠事故發生之後，許多人害怕食鹽安全受到影響，所以開始大量購買食鹽，對生活造成了極大的不便。這種恐懼，其實就是毫無必要。所以，我們應該學會用理智克制自己的恐懼。


    心理學家丹尼爾·康納曼（Daniel Kahneman, 1934.3.5 -）說：「我們傾向於根據大腦中容易想起來的事件來判斷某個事件發生的機率。」事件發生的時間越近，或是你對時間的記憶越清晰，就越容易勾起你對同類事件的恐懼。所以，你的恐懼往往是經儗性的：你被一隻狗咬過，那麼在近期內如果你再看見狗，即使是一隻無害的寵物犬，你也會感到恐懼。


    在生活中，大多數人在看到蛇或蜘蛛、老鼠之類的動物時都會害怕。有研究表明，人類的這種恐懼心理是在進化過程中形成的，這種現象可以追溯到非常遙遠的遠古時代。那時的地球還是各種爬行動物的天下，而早期的哺乳動物為了生存和繁衍，不得不小心防範。在那些看上去很嚇人的爬行動物中，有不少確實是對人類有致命危險的。在處處危機重重、步步險象環生的環境裡，人類祖先在看到這些爬行動物時，大腦必然要保持高度的警惕，心情也一定是非常緊張的，可能這就是恐懼心理的由來。


    瑞典的科學家參與了人類為何害怕蛇和蜘蛛的研究。有趣的是，這位科學家說自己小時候也曾經非常害怕蜘蛛，但是當他對'
  - '[PAGE 207]


    蜘蛛有了深入的研究之後，那種恐懼之心便不復存在了。


    而對於現代人來講，蜘蛛明顯已經對我們不構成威脅了。所以我們對於蜘蛛的恐懼是盲目而不理智的，事實上，我們大多數的恐懼都是如此。一個人若想控制這種不理智的恐懼，就必須先學會用邏輯分析問題。


    現在你在心中默念：飛機墜毀。這時，你的大腦中可能會產生這樣一幅景象：機艙冒著滾滾濃煙，夾雜著乘客的尖叫聲，破碎的機身嘎吱亂響，整架飛機猶如一個巨大的火球在翻滾。這種場景可能會引起你的恐懼感，雖然它並沒有發生。


    但是如果告訴你，飛機墜毀的機率大約是百萬分之一，你的恐懼感是不是會有所減輕？這就是理性的力量，它讓你擺脫主觀的想像，回到現實的邏輯思維中。


    那些形象和容易被記起的風險，會給人更大的恐懼，但人們似乎沒有將危險和機率放到一起去想一想。如果一件事非常危險，但是它發生的機率幾乎為零，我們又有什麼理由為此而感到恐懼呢？


    對於普通人來講，大腦的條件反射系統所產生的情感能夠將大腦的分析能力擠到一邊，也就是說我們的理性會被我們的感性所擊敗，因而產生毫無意義、完全主觀的恐懼心。因此，若想藏心，我們就必須讓理性重新占領思想的高處，用邏輯思維去衡量眼前的威脅。'
  - '[PAGE 208]


    # 自我安慰，平復內心的波動


    雖然我們講了許多恐懼心理的缺點和應對辦法，但是我們也不能否認，這個世界上確實有許多值得恐懼的東西。在這些東西面前，我們無法克制自己的恐懼，唯一能做的，就是學會自我安慰。下面，我們就講一講幾個自我安慰的方法。


    # 1. 最重要的是今天的心


    何必為曾經的悔恨而影響到今天的好心情？何必為未來的不可預知而擔心恐懼？過去的一切都已經過去，未來則是可望而不可及，只有今天才是最真實的。


    經常為 FBI 提供心理研究的專家曾經做過一個實驗：


    讓志願者們做一件事：週日的晚上，把自己對未來一週的憂慮與煩惱寫在一張紙上，簽上自己的大名之後，將紙條投入到一個箱子裡面。


    一個禮拜之後，心理學家打開了這個箱子，將所有的「煩惱」還給其所屬的主人，並讓志願者們逐一核對自己的煩惱是否真的發生了。


    結果 90% 的人所擔心的那些可能會讓自己煩惱的事都沒發生。事情雖然沒有發生，但是他們在過去的一個禮拜時間裡卻「實實在在」地煩惱了七天。


    這個實驗結束之後，心理學家又讓志願者把過去一週真正發生過的煩惱記錄下來，又投入到那個箱子裡。


    同樣在一週後，心理學家再次把箱子打開，讓志願者重新核對自己寫下的煩惱。志願者在看了自己一週之前的那些煩惱後，'
  - '[PAGE 209]


    都後悔地說：當初那些事情其實現根本就不值得我們去煩惱。


    也就是說，他們當初為了不值得煩惱的事情而煩惱了那麼長時間。


    最後，心理學家總結說：「透過這個實驗，我都不敢確定這個世界是否真的有事情值得我們去煩惱。可是，我們卻永遠也放不下煩惱。從這一點上來說，人確實是種愚蠢的動物。」


    # 2. 所有的心痛都不屬於現在


    何必為痛苦的悔恨而失去現在的心情。其實，我們之所以不幸福，都是因為放不下過去，看不破未來。


    十七世紀法國科學家兼思想家巴斯噶（Blaise Pascal, 1623.6.19 - 1662.8.19），在他的《冥想錄》（Pensées）一文中有一段話：「我們向來不曾把握現在；不是沉溺於過去，就是殷盼著未來；不是拚命設法抓住已經如風的往事，就是覺得時光的腳步太慢，拚命使未來早點來臨。我們實在太傻，竟然流連於並不屬於我們的時光，而忽視唯一真正屬於我們的此刻。」


    # 3. 好心境是自己創造的


    古詩有云「芭蕉葉上無愁雨，只是聽時人斷腸」。雨本沒有感情，如何變成了愁雨？只因聽雨的人心中有愁苦。同樣的雨，如果給心情愉快的人聽，恐怕又是另一番光景了。


    有時候，我們的心境決定了我們眼中的世界。本來是陽光明媚的世界，只因我們心情不好，也會變得暗淡無光。因為心情的變幻，我們錯過了多少良辰美景？所以，若想讓世界變得更美麗，就不能常常執著於某種念頭，那樣會讓我們忽視人生道路上的種種美麗，適當的轉彎也許能夠帶來更加美麗的風景。'
  - '[PAGE 210]


    # 4. 用心做自己的事


    人生是如此的短暫，哪有心思去浪費呢？哲人曾經說過：大街上有人罵我，我是連頭也不回的，根本不想認識這個無聊之人！我們既不要去傷害人家，也不要被別人的批評左右，還是按照自己的願望，先踏踏實實學好本領再說。特別是在年輕時要全力以赴學本領，不要分心。


    《冰山在融化》( Our Iceberg Is Melting, John Kotter, Holger Rathgeber, 2006.09 ) 講述了一個關於危機的故事。


    在南極洲的一個企鵝王國，企鵝們世代生活在一座冰山上。一天，有一隻善於觀察的企鵝——弗雷德發現冰山正在逐漸融化，牠們的生存環境正面臨著可怕的危機。牠把這個消息告訴了自己的同類。其他企鵝一聽自己住的冰山要完了，馬上變得惶恐不安起來。牠們整天都在沮喪地說：「我們就要完了，我們還這麼年輕，冰山融化了，我們誰都活不了。」整個企鵝島因為一個壞消息而變得亂糟糟。只有弗雷德的心態還比較好，牠對自己說：「冰山融化雖然可怕，但是這世界上有很多冰山，我們總能找到一處新的地方可以安家。於是，在別人惶恐哭泣之時，弗雷德忙著尋找一個新的安家之所。不久之後，牠果然發現了一座新冰山。在牠的帶領下，所有的企鵝都因此重獲新生。


    這個故事就是說，在事情面前，恐懼不能解決問題，只有用心做事才是王道！


    # 5. 別總是跟自己過不去


    人生在世難免受到各種慾望的糾纏：生欲、死欲、食欲、睡'
  - '[PAGE 211]


    欲、情欲、權欲、金錢欲、出名欲、求知欲、事業欲、健康欲、運動欲、旅遊欲、出國欲、自我表現欲，還有很多慾望甚至難以用某一個具體的詞彙去概括。人活在如此紛繁的慾望中，如果不能克制自己，將會是多大的災難！而我們追尋過多的慾望，實際上就是在和自己過不去。


    # 6. 不要追逐世俗的榮譽


    終生尋找所謂別人認可的東西，會永遠痛失自己的快樂和幸福。庸俗的評論會消滅自己的個性，世俗的指點會讓自己不知所措。為錢而錢會使自己六親不認，為權而權會使自己膽大妄為，為名而名會使自己巧取強奪，真實的我們在刻意的追逐之中，會變成一張張碎片隨風飄揚，世俗的我們會變得面目可憎。得到了媚俗，失去了真實，所以我們要堅定信心，擁有自我。


    # 7. 極端不可取


    有些人常常因為憂慮過度，而導致自己精神失常；有些人卻因為麻木不仁，造成自己對任何事情都無動於衷——前者常為尋找理性而痛苦，因聰明過頭而失敗，愚蠢的根源在於對什麼都懊悔；後者不知悔恨為何物，整天糊塗地生活，活著與死去沒有什麼區別。走極端總是慘遭失敗，我們需要尋找人生的智慧。


    # 8. 注意不要活得太累


    常有人感嘆，活得真累。累，是精神上的壓力大；累，是心理上的負重。累與不累總是相對的，要想不累，就要學會放鬆，生活貴在有張有弛。心累，使人長期陷於不健康狀態；心累，會使自己精神不振。心別太累，要學會解脫自己。'
