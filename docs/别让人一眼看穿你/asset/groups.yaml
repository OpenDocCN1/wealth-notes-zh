    ## 關於矜持


    這一節，我們或許可以定義為「女子藏心術」。因為我們所講的內容是關於矜持的，而矜持則大多是用來形容女性的。


    《第二性》(Le Deuxième Sexe, Simone Lucie Ernestine Marie Bertrand de Beauvoir, 1949)
    提出了一句膾炙人口且富有哲理的名言：「女子不是天生的，而是生成的。」一個女人在成長的過程中，漸漸變得矜持而理性，因此更富魅力。如果從藏心術的角度去考究矜持的話，你會發現，矜持其實是一種內斂、包藏的美德，也是藏心術的要旨所在。


    在分析矜持之前，我們有必要先瞭解一下矜持的含義。按照漢語詞典的解釋，矜持的解釋主要有兩個。


    第一個解釋是倔促、拘束的意思。


    如：「這位小姐在眾人面前有點矜持。」但是實際上，對於女性來說，矜持往往還指女性因為自己的性別特徵而在異性面前表現的倔促、拘束的心態和行為。


    第二個解釋是自鳴得意、自負的意思。


    如：「家世殷厚，雅自矜持」。顯然，這其中有孤芳自賞的意味在裡面。女性，尤其是文化修養比較高的女性，我們說她們矜持的時候，往往指的是她們對自己優良特質有信心的一種傲氣。


    矜持其實放到愛情心理的領域更為合適。因為在愛情心理領域，由於女性天生的被動性和含蓄特點，所以她們往往表現得更加矜持一點。


    但是，隨著社會的發展，我們發現，許多女性似乎忘了矜持的美德，她們更奔放、更男性化，並且成為了一種趨勢。這種趨勢，對於女性而言其實並不見得是好事，因為放棄矜持，就等於放開了自己的心理防線，會受到控制和支配。所以，女性朋友還是要學著矜持一點，藏住自己的喜愛之情。


    2006年10月6日，俄羅斯總統普丁在克里姆林宮向各界優秀人士頒發國家獎章。原本這只是一場普通的頒獎儀式，然而就在普丁給女演員尼娜·尼古拉耶芙娜·烏爾甘特頒發祖國貢獻三等獎章時，意外發生了！當時，普丁面帶微笑，為尼娜戴上了榮譽勳章。這位女演員表現得興奮異常，突然摟住了絲毫沒有防備的總統。她雙手緊緊抱住普丁的腰，情不自禁地依偎在總統胸前。


    頓時，全場一片驚訝。甚至就連一貫冷峻的普丁總統，這一瞬間也出現了一點點慌亂和羞澀，顯得非常驚訝、手忙腳亂、尷尬萬分。


    由於女演員的不矜持，讓總統都尷尬萬分。由此可見，不矜持有時會給別人帶來一定的困擾。當然，我們這個故事中的主人公是異國人士，出於風俗文化的考慮，人家的這種行動也似乎無可厚非。但是就事論事，作為東方人，我們還是顯得矜持一點更好。


    人類行為學專家說：女性的矜持可以透過動作表現出來。「疊腳」的標準姿勢（指一條腿搭在另一條腿上，一般情況下是左腿搭到右腿上）就是矜持感的表現。


    不過這種動作也可能是因為長期的端坐感到不適之後的表現，所包含的意義還得看別的動作和手勢。比如，人們經常是在聽課或長時間坐不舒服的椅子時也採用這個姿勢；另外一個人如果覺得冷，也會本能地採用這個姿勢。


    如果一個人踱腳又雙臂交叉抱胸，說明這個人是在明顯避開談話。一個銷售業務如果執意向一個踱腳又雙臂抱胸的顧客兜售自己的產品，那可是最愚蠢不過的了，倒不妨問問對方，為什麼會採取這種不合作的態度。


