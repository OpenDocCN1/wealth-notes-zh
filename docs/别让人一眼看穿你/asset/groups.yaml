    ## 控制慾暴露心中的不安


    與占有慾一樣，控制慾也是人的本能，從心理上講：人之所以會產生控制慾，是因為內心的恐懼。


    人在本質上是孤獨的。因為孤獨，所以我們害怕失去那些陪伴自己的東西，因而產生了控制慾。妻子希望能夠控制丈夫的動向，母親則習慣於控制孩子的行為，上司更是渴望洞悉員工的心思，這些都是控制慾的表現。


    所有控制慾的起因都是一樣的，但是控制的方法卻呈多種狀態：威脅、誘惑和獎勵。


    在生活中，經常看到一個人揪住對方曾經犯過的錯，用來威脅對方，為的就是造成對方的罪惡感和恐懼感。還有人千方百計的對一個人好，一旦發現對方做了對不起自己的事，就會說：「我對你那麼好，你怎麼那樣沒有良心……」這兩種做法的根源其實都是控制慾，都是想控制對方。


    「洛克殺妻案」就是控制慾太強導致的惡果。


    1993 年，美國警方為了破獲一起殺人案，不得不求助於聯邦調查局。FBI 在接手案件後，馬上就搞清楚了這起殺人案件的始末：


    某一天，一個叫洛克的男人來警局報案，說自己的妻子在家中被殺。警方經過一番調查，始終沒能找到殺害洛克妻子的真正兇手。


    當時 FBI 探員問警長：「會不會兇手就是洛克本人？」


    警長回答：「我們一開始也有這樣的懷疑，但是經過調查發現，洛克和妻子的感情非常好。我們也請測謊專家審訊過洛克，測謊專家認為，洛克在審訊的過程中始終顯現出極度悲傷的情緒，他根本沒有殺害妻子的理由，所以我們便將他排除在外。」


    聽到警長的這番話之後，FBI探員也開始相信：洛克是無辜的，殺害洛克妻子的另有其人。


    為了搞清楚洛克妻子生前有什麼仇人，FBI到電信部門找洛克妻子生前的一些電話錄音。其中，洛克打給妻子的一个電話讓FBI探員對洛克再次產生了懷疑。


    洛克妻子：「親愛的，我今天晚點回去。」


    洛克：「你要去哪兒？」


    洛克妻子：「我們公司今天有晚宴，所有人都必須參加。」


    洛克：「那好吧，晚宴結束之後我開車去接你。」


    洛克妻子：「不用了，我自己回去就可以了。」


    洛克：「不，我必須去接你。」


    洛克妻子：「好吧。」


    從這段電話錄音中，探員判斷：洛克是個控制慾非常強的人，所以他完全可能因為妻子在某些地方超出了他的控制，一怒之下殺死妻子。所以探員開始從這個方面著手調查。


    真相在幾天之後終於浮出了水面，洛克正是殺害妻子的真正兇手……


    以上的案例正是控制慾產生禍害的最好證明。一旦誰成了一個控制者，他就會越來越脆弱，越來越緊張、恐懼和絕望。在這種負面情緒的影響下，人很容易做出一些不理性的事情。


    人可以有期待，但是不能處處想著去控制別人，我們要克制自己的控制慾。因為有控制慾的人，永遠處在不安全之中。若想讓自己的心變得安全，我們需要坦然接受事實，努力控制自己的情緒，接納所有的問題。


    人除了對至親有控制慾外，也會對其他人產生控制慾。人人都想成為主管，都想管別人，這也是控制慾的體現。


    美國著名談判專家羅傑·道森（Roger Dawson, 1940. 3. 19）曾經遇到過這樣一件事情：


    一次，他去參加一家公司的商務宴會。當時他和這家公司的總經理坐在一起，高高興興地聊天。


    突然，一個地區經理怒氣衝衝地走過來對總經理說：「我不知道公司是怎麼想的，我們部門最優秀的一個提案居然沒能獲獎。我手下的夥伴們為了這個提案付出了所有心血，我以後還怎麼激勵他們？」


    總經理見對方如此無禮，立馬就針鋒相對地回應道：「那是因為你們的報告晚了整整七天，你明白嗎？」於是兩人吵了起來。


    兩個人針對一個簡單的問題居然一吵就是二十多分鐘，到最後兩個人已經完全失去了理智，爭論的焦點也早已偏離了問題本身。


    這時候道森看不下去了，他站起來對那個總經理說：「區域經理是想獲得一份獎勵，你能給他嗎？」


    總經理正在氣頭上，說：「絕無可能。」


    道森聳了聳肩，對區域經理說：「既然獎勵已經拿不到了，如果總經理能親自慰問一下你的員工，可以嗎？」


    區域經理說：「如果不能得獎的話，這樣倒是可以。」


    道森對總經理說：「區域經理已經做出了妥協，你是不是也能夠讓一步，滿足這個要求呢？」


    總經理當即表示同意，一場無意義的爭吵就在彼此的妥協中結束了。


    事後，道森說：「在你真正決定和對方爭吵之前，不妨先做出妥協，相信許多不必要的麻煩就會因此消失。」


    這個故事中的兩位公司主管就是控制慾的受害者，因為控制慾的影響，他們失去了最簡單的理性判斷力，所以才會影響到公司內部的團結。其實，拋開控制慾來思考問題，你往往會發現：事情原本很簡單。


    從心理學的角度來看，控制慾是弱者的心理，是一種示弱的表現。控制慾常常會破壞自己和他人關係，形成負面效應。所以，一個善於藏心的人，應該學會控制自己的控制慾。


    事實上，所謂「絕對控制」，是不會實現的。因為沒有一個人會被另一個人真正地控制住。那些看起來被「控制」的人，其實也是被控制者為了某種需求的妥協。


    比如「妻管嚴」，看起來是被妻子控制了，但事實上他不過是想維護自己的家庭。如果有一天他不想想要自己現在的家庭了，那他一定會擺脫控制。


    對於有控制慾的人來講，控制慾帶給他們的也大多是痛苦和焦灼。比如戀愛中的兩個人，擁有控制慾的一方會因為另一方的一舉一動而感到焦慮，這對於個人、對於愛情，都沒有什麼好處。


    所以，你如果是一個有控制慾的人，一定要學會藏心，克制自己的控制慾，至少也要將控制慾隱藏在心裡別表達出來，否則將帶給自己和對方無盡的苦惱。


    ## 別讓人一眼看穿你

    藏心與藏心的攻防智慧


    ## 調整心態，建立安全感


    我們不止一次提到，人之所以會有領域感、控制慾和占有慾等負面心態，就是因為心中缺乏安全感。所以，我們若想藏住自己心中的這些負面情緒，就要學會重新調整自己的心態，讓自己更富安全感。


    詹姆斯和霍華德都是 FBI 的精英探員，他們都有可能在不久之後獲得晉升，成為 FBI 地區負責人。由於地區負責人的職位只有一個，而現在卻有兩個候選人，所以，FBI
    總部必須在這兩個人中間做出取捨。


    不久之後，這兩個人就接到了總部派給他們的新任務。此次任務十分艱鉅，詹姆斯和霍華德心裡也清楚，這可能是上司給他們的一次考驗。誰如果能夠順利完成任務，誰就可能獲得晉升的機會。


    詹姆斯在接到這個艱鉅的任務之後，覺得自己似乎並沒有能力做得比霍華德好多少，心裡難免有些惴惴不安。但是為了讓上司和下屬覺得自己完全能勝任眼前的作，他開始表現得像一個新加冕的國王，用一意孤行甚至言過其實的行為，來隱藏自己的不安全感和自我懷疑。


    由於詹姆斯以前習慣於孤軍奮戰，沒有管理一個團隊的經驗，所以雖然他表現得很強勢，依然不能很好地將任務進行下去，遭遇了許多挫折。從此，他的不安全感變成了對失敗的恐懼，他的沮喪變成了好鬥和攻擊。


    與詹姆斯相反，霍華德則採取了一種截然不同的方式。對他來說，獲得上司的賞識不過是自己人生路上的又一次前進。他馬上調整了心態，將精力集中於全新的目標上。他開始著手組建屬於自己的團隊，想方設法提高團隊的士氣，開發團隊中尚未展示出的才華。不久之後，他便順利地完成了任務。


    最終，霍華德獲得了晉升。


    這個案例中的兩位 FBI 探員，之所以有不同的表現，其實還是要歸結為心理控制的作用。每個人都是目標導向，所以當一個人朝著目標專注前行時，內心才會真正強大。這就和我們騎自行車一樣，只有在前進時才能保持平衡、鎮定和安全感。如果止步不前，就會因失去平衡而摔倒。


    領域感其實就是一種止步不前的表現。當一個人將所有的注意力都放在自己已經獲得的領域上時，他就失去了開拓新領域的動力。因此，他才會對現有的這塊領域如此在意，這是因為他沒有進一步追逐的勇氣，更害怕失去自己所得到的一切。歸根究底，這些人的內心其實是充滿懦弱和恐懼的。


    在現實中，那些有安全感的主管，總想將那些比自己更聰明、更能幹，往往也更老到、經驗更豐富的人招至麾下。但是那些沒有安全感的人，總是不喜歡用能力比自己強的下屬。


    為什麼呢？因為有安全感的領導人無時不在發憤圖強，關心做哪些該做的事，勝過關心其他一切事情；而沒有安全感的領導人則更關心表面現象，而且害怕顯露任何脆弱或無能的跡象。


    由此，我們也可以得出一個結論：藏心術的關鍵，在於強大自己的內心，豐富自己的手段。


    言歸正傳，讓我們把話題再次轉移到「安全感」上。從心理上講，如果不再高高在上，而是放下架子，你就會覺得更安全，也能更好的隱藏自己的內心。因此，你要屏棄超出理智範圍的領域感。


    領域感意味著故步自封，意味著止步不前，更意味著深藏內心的恐懼。我們之所以要屏棄領域感，不僅僅是因為領域感所導致的占有慾和控制慾會直接暴露我們的內心，更是因為領域感讓我們的心靈更虛弱，讓我們沒有安全感，這對藏心是大大不利的。


    ## Step 6 捨得 / 不迷失，建立安全感、克制占有慾


    ## STEP 7


    ## 應變


    不驚訝，融化凍結反應


    凍結反應（Freeze Response）是一種人類本能的條件反射，在我們遇到危險或是面臨困境時，就會產生凍結反應。我們也應該意識到，凍結反應經常暴露我們的內心。所以，我們應該最大限度地控制自己的凍結反應。


    在本章中，我們將從凍結反應是什麼說起，然後一步步教會大家從各方面來克制自己的凍結反應。透過本章的敘述，相信大家一定會對凍結反應有深刻的認識。


    ![](img/65c5e2383679681693f7479829cb5f93_175_0.png)


    ![](img/65c5e2383679681693f7479829cb5f93_175_1.png)


    ## 什麼是凍結反應？


    FBI 探員在追捕一名嫌犯，據可靠情報，這名嫌犯就潛藏在他母親的家中。由於嫌犯的母親年事已高，所以大張旗鼓的對其居所進行搜查似乎並不合情理。如果搜查到嫌犯，一切還好說；但是如果情報有誤，那麼一切都不好解釋了，還可能對老人造成負面影響。這時候，FBI
    探員決定先對老人進行詢問。


    當探員問道：「妳兒子在家嗎？」他注意到她把手放到額頭上，說：「沒有，他不在。」


    幾分鐘後，探員再次問道：「妳兒子會不會趁妳外出時偷偷潛入妳的房子？」她又一次將手放到額頭上，然後說：「不，應該不會。」


    最後一個問題：「那麼，我要做紀錄了，妳兒子確實不在這間屋子裡是嗎？」這一次，她仍然想把手放在那個位置上。


    由此，探員肯定這個老人是在說謊，於是他申請了搜查令，結果她兒子就藏在一個密室裡。


    這是 FBI 偵查工作中的一件往事。探員根據什麼判斷這位老人說謊呢？就是那隻放在額頭的手，她之所以把手放在那裡，就是因為凍結反應造成的。


    在 FBI 探員追查案件時，經常會根據人的凍結反應來判斷一個人的精神狀態和他內心的波動。而在現實生活中，我們自身的凍結反應也常常暴露出我們的緊張、恐懼和不安，讓明眼人一眼看穿我們的內心。那麼，本章將告訴大家，如何控制我們的凍結反應，進而影響我們的恐懼和不安……若想做到這一切，首先讓我們從什麼是凍結反應說起。


    在科學上，對凍結反應的解釋是：邊緣系統（Limbic System）使用的第一種防禦戰略就是凍結反應。移動會引起注意，一旦感到威脅時立刻保持靜止狀態，這是邊緣系統為人類提供的最有效的救命方法。


    這個解釋太過學術化，深奧難懂，其實我們舉個簡單的例子，就能搞清楚凍結反應是什麼。你們一家人吃飯的時候，突然聽到門外傳來非常巨大的敲門聲，這時候你們一家人會是什麼反應？是不是所有人都停下吃飯，看著門口，沒人發出聲響，在數秒之後才有所反應？在那一刻，時間和空間似乎像是被凍結了一般。這就是我們的凍結反應。


    凍結反應有時會對人造成不利的影響，像是一個人在過馬路的時候，突然有一輛失控的卡車從意外的地方衝了出來，這時候最好的選擇就是趕緊逃走，但事實上，很多人這時候會被凍結反應所控制，呆住了！從而失去了最好的逃生機會，釀成慘劇。這就是凍結反應的負面效應。


    有人會說，凍結反應讓人變得遲鈍，而且會暴露我們的內心，對人而言大大有害！毫無疑問，這個說法是完全錯誤的，我們任何一種下意識的行為，都是自然選擇的結果！


    大約一百万年前，原始人類在極度危險的環境中求生存。那時，許多大型獵食動物都可能對人類造成致命威脅。然而，他們最終生存了下來，很大程度上是因為他們所擁有的凍結反應。


    很多動物——尤其是大多數肉食性動物，對移動非常敏感。例如我們看到了一隻狗，如果你下意識的逃跑，這隻狗很可能兇猛地撲向你；但是你若是靜止不動，這隻狗很可能不敢輕舉妄動。而我們的祖先，面對的是更加兇殘的動物，若是看見獵食者就跑，很可能招致追殺，還不如先靜止一下，然後再想辦法，所以他們更需要凍結反應來保全自己的性命。


    這就是凍結反應，以及凍結反應的由來。


    ## 別讓人一眼看穿你

    敲心與藏心的攻防智慧


    ## 凍結反應的具體表現


    凍結反應的有幾種表現，如靜止不動，或因為約束而重複做同一個動作等等……但是這並不是凍結反應表現的全部。本篇，我們將有系統地介紹凍結反應的表現。


    凍結反應的第一個表現，是呼吸！俗話說的「大氣都不敢喘」，這是經典的凍結反應之一。


    在受到驚嚇時，人的本能反應是快速吸一口氣，留著備用。但感受到恐懼的時候，尤其是迫於客觀條件不能逃跑、不能反抗的時候（比如現代社會的規則、禮儀等），則會出現屏住呼吸或減弱呼吸的凍結反應。


    當然，呼吸的凍結反應比較難以觀察，因為沒有誰能一眼看出其他人是在呼吸還是在憋氣。其實，除了呼吸之外，凍結反應還體現在許多肢體動作上。


    凍結反應體現在肢體語言上，首先發生作用的就是手的約束。


    不知大家有沒有這樣的感覺，當第一次站上一個大舞臺上，面對著臺下數百觀眾的注視，一定會覺得渾身不自在。這時候，連自己的手都不知道應該如何擺放了。


    還有，有些女士常常習慣將自己的雙手拉住放於身前，這個動作也總是被人看作是可愛的表現。但事實上，這是她們緊張情緒的一種暗號，如果她們的手不這樣相互約束的話，她們簡直不知道把它們放到哪裡才好。


    男士常見的動作則是將雙手拉住背在身後，這經常被人認為是沉穩大方的表現，但其實也是出於緊張。

