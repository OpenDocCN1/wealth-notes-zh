    # 當一名理性的忍者


    柏拉圖說：「稍忍須臾是壓制憎怨的最好辦法。」一個能屈能伸的人，不會因為一時的激憤而忘記了忍耐，那樣只會讓自己更加被動。


    實際上，所謂忍讓，就是讓時間、讓事實來證明自己的一種方法。歸根究底，看起來是退步的忍讓是一種變相的爭取，因為只有這樣才能夠擺脫相互之間沒有原則的糾纏和沒有必要的爭吵。


    在非洲的戈壁沙漠裡，有種花叫做「依米」。這種花需要忍耐六年的漫長歲月才能開一次花，而花期卻只有兩天。兩天過後，這種花便迅速枯萎了。


    由於氣候乾旱，土地貧瘠，更何況這種花只有一條根吸收水分。在六年時間裡，炎炎烈日燒灼它，漫天風沙肆虐它，然而依米花毫不氣餒，在默默等待，默默生長。它知道，總有一天，根鬚深入到一定程度自己就會綻放絢麗的花朵。


    依米花用生命的軌跡向我們昭示，只有忍耐，才能美麗；只有忍耐才終有成就。


    忍讓並不意味著懦弱可欺，相反，有忍讓之心的人往往更具備自信和堅韌的品格。古人所說的「忍」字，至少包括了兩個方面的德行：其一是堅韌、頑強。晉朝朱同說：「兩敵相對，唯當忍之；彼不能忍，我能忍，是以勝耳。」這裡的忍，也就是頑強精神的一種體現。'
