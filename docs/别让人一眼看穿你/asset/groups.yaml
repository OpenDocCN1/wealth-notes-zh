    關於低頭聳肩的自我保護意味，你可以想想這樣的情形。比如，在你居住的社區裡一群孩子在踢球，當你走過他們的時候，突然聽到有人喊：「當心，看球。」即便你並沒有看到足球朝你飛過來，也會下意識地把頭低下，縮在兩肩之間。因為你希望用這樣的姿勢保護自己的頭部，以及柔弱的脖子和喉嚨，避免受到撞擊。


