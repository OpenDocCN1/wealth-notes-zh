    # 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    一下，這個探員確實不是一般人。在大賓謹說已經識破他真面目的時候，相信這個探員也非常緊張。一般人在這種情況下，肯定會產生極度的恐懼，在恐懼的驅使下，不是奪路而逃就是「揭竿而起」。但是這位探員卻克制住了自己的凍結反應和戰鬥反應，成功地化解了一次考驗。由此可見，若想成就大事，就必須要學會克制自己不理性的衝動，更不能隨便表現出自己的戰鬥反應。


    你或許會說：「我就善於克制自己的戰鬥反應，我從來都沒有過和別人動手的念頭。」如果你僅僅把與人動手當作是戰鬥反應的唯一特點，那就錯了！戰鬥反應包括了人類的一切攻擊行為。在現代社會中，最為頻繁的攻擊行為就是爭論。所以爭論也是戰鬥反應的一種表現。


    爭論可以是辯論或討論，但是，對於很多人來講，爭論則成為了一種過分激烈的討論。本質上來說，過激的討論就是一場沒有身體接觸的戰鬥。在爭論中，侮辱、人身攻擊、反駁、誹謗、激將都是我們用來攻擊對方的一種方式。


    我們要藏心，要克制自己的戰鬥反應，首先就應該克制自己想與別人爭論的念頭。或許因為某件事，你特別想和對方爭出個是非因果。但是你有無發現，大部分爭論到最後都會成為無止盡的各自堅持。


    對於爭論雙方，想要搞清楚誰對誰錯非常困難，即便你有再多的論據論點，也無法真正說服對方。爭來爭去，除了得到一肚子氣之外，還在各執一詞的喋喋不休中暴露了自己內心的想法和弱點，讓別人有機可乘。


    所以，我們應該盡量避免戰鬥反應下的爭論。因為任何進攻性的戰略都可能導致情緒混亂，精力不集中，如果這樣的話，你就不能對眼前的危險有正確的認識。'
