    # 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    在生活中，每個人都可能遇到這樣的人—— 他們所說的話，不論對不對，常常無端引起別人的反感。這些人就是因為不善於掌握自己言語中的深層含義，所以才會讓人討厭。由此可見，同樣意思，用不同的話語表達，就會表現出不同的情感意味，人們往往能從你的話語中看到你內心的情緒。


    所以，要想藏心，我們也該學會藏住自己話中那些不必要的深層含義。


    1995 年，洛杉磯郊外發生了一起殺人案。由於久久找不到真凶，所以警方將破案工作交給了 FBI。


    FBI 在接手案件後，先是查明清楚被害人的基本資料。死者為年輕女性，名叫珍妮，已婚，丈夫叫做詹寧斯。死者父母雙亡，有一個妹妹和一個哥哥。死者的哥哥住在休士頓，與妹妹關係惡劣，不經常來往。死者的妹妹住在紐約。


    由於死者的社會關係非常單純，所以 FBI 決定從她的家人查起。


    他們找到了死者的哥哥。由於這個男人和死者並不住在同個城市，所以 FBI 首先向這個男人傳達了他妹妹的死訊。FBI 探員對他說：「我們從紐約來，你的妹妹被殺害了……」


    聽到自己的妹妹死於非命的消息之後，男人顯得非常激動，哭著說：「天啊，我都不敢相信，珍妮才二十九歲啊，是誰這麼狠心！」


    在聽到男人的這句話之後，FBI 探員馬上意識到：這個人和他妹妹的死一定有關係！因為自己還沒有具體說出是他的哪個妹妹死了，他就知道是珍妮。


    之後，FBI 開始把破案的重點放到了這個男人身上，不久，就找到他殺害自己妹妹的證據。


    以上的故事中，兇手一句不經意的話便暴露了自己的內心。由此可見，無論是語言的邏輯還是情感，都可能透漏出一些你不想透露的東西。所以，我們想修煉藏心，也要修煉好自己的語言。


    當商鞅來到秦國的時候，秦孝公雄心勃勃地正想富強自己的國家，重塑祖先當年的輝煌。商鞅透過當時秦孝公的寵臣景監的介紹，拜見了秦孝公。


    初次見面，商鞅就大談蒭、舜、禹、湯，說古時先帝之德，說君王就要與民共苦、與民同樂，這樣才能用自己的實際行動感動臣民，才能讓自己的統治更加長久。秦孝公聽了一會兒就昏昏欲睡。這種紙上談兵的做法，讓秦孝公非常不滿意。


    過了幾天，商鞅又來拜見秦孝公。這一次，商鞅把自己以前的想法全都進行了修正。不料又失敗了，秦孝公還是不滿意。這時，秦孝公就找來了景監：「你找來的這個商鞅，一而再再而三地求見，讓寡人很不滿意。如果再這樣下去，你就讓他從哪兒來回哪兒去吧！」


    幾天後，商鞅又來拜見秦孝公。有了前兩次的交談，商鞅漸漸揣摩到秦孝公的心思，抓住了關鍵性的問題。這一次，商鞅和秦孝公談了春秋五霸用武力來強化國力的過程，並在談話過程中，時刻仔細觀察秦孝公的表情變化，從而確認秦孝公已經有採納他建議的意思了。即使是這樣，秦孝公還是因為前兩次的印象而表示不想重用他，只是對景監淡淡地說：「你這個客人不错，我能和他談得來。」商鞅認為，如果他能再見一次秦孝公，就一定能說服他，讓他採納自己的建議。


    就這樣，商鞅再次拜見了秦孝公。這次的交談讓秦孝公聽得入迷，忍不住要把座位向前移動。而且一談就是幾天，秦孝公還覺得聽不夠。這讓景監非常奇怪，怎麼才過了幾天，秦孝公對商鞅的態度就有了這麼大的改變？景監耐不住好奇，就去問了商鞅。


    商鞅說：「我向大王講述雍舜禹湯的為帝之道，秦王說這些太久遠了，他等不及了。於是，我就向國君講富國強兵之道，我觀察到秦王的言行舉止開始發生了變化。直到最後聽完非常高興，我的建議就被他採納了。」


    後來，商鞅開始輔佐秦孝公實施變法，最後取得了成功。秦國從那以後開始強大，最終吞併了天下。


    故事中的秦孝公，顯然不是藏心的高手，他的一舉一動，都暴露了他內心所想。因此，商鞅才能抓住他的弱點和破綻，「有的放矢」。當然，他被商鞅「針對」而重用了商鞅，對他自己來說是一件好事情。但是在現實生活中，被針對肯定會給你帶來一定的害處。所以，我們絕不能因為自己語言上的破綻而影響到自己藏心。


    我們如果想要讓自己的言語沒有破綻，光在語言上下工夫還是不夠的，還需要注意自己說話的場合。比如，祝你「年年有今日，歲歲有今朝」，這本身是一句好話，但是如果你在對方倒楣的時候說出來，恐怕話裡的意思就完全變了。


    除了環境之外，我們還要注意自己說話的地點。例如，你手下的員工做錯了事，你批評他可能有兩種完全不同的方式：一是把他叫到自己辦公室，語氣嚴厲地批評一頓，然後再鼓勵幾句；


    二是在公司大會上或當著其他員工面前，表面語言溫和，其實暗含批評。這兩種話雖然表達的意思完全一樣，但是卻暴露了你心中的某些想法。所以，說話注意語境是藏心的必備法門。


    總而言之，我們要想藏心，就需要注意自己的說話方式。這一點，需要我們在生活中慢慢體會。


    ## 情緒洩露的祕密


    關於藏心的要點和難點，恐怕就是如何隱藏自己的情緒了。如果我們不想讓自己的某個想法被別人知道，那很簡單，我們忍住不說就行了。但是，如果我們想掩飾自己的情緒呢？事情恐怕就沒那麼簡單了。因為情緒有幾個特點：


    ### 1. 自發性


    情緒像是一種衝動，不經過思考，瞬間發生。就好像我們身體裡已經準備好了各式各樣的情緒，在受到外界刺激的時候，相應的情緒就從我們體內釋放出來。


    ### 2. 不可控制性


    對於大部分人來講，有時候情緒是不被理智所控制的。比如，在極度悲傷時，你雖然極力克制自己的眼淚，但是淚水卻可能「不爭氣」地奪眶而出。


    在這一點上，人和人之間有極大的差別，有些人能夠在非常激動的時候也保持冷靜的外表，有些人則把情緒全部放到了臉上。雖然他們的內心活動同樣激烈，但明顯是第一種人更善於隱藏自己，本書就是想教會大家如何成為第一種人。


    ### 3. 無意識性


    所謂無意識性，是說有些情緒不受意志的支配。比如，在某個很嚴肅的場合，你突然想到了一個非常好笑的笑話，這時你的喜悅之情會油然而生。雖然你意識到這個場合不適合放聲大笑，但是你最多也只能忍住笑聲，卻沒有辦法讓自己的情緒在瞬間歸於平淡。


    ## Step 1 抓漏 / 想藏心，先找出破綻


    由於情緒有以上三個特點，所以在通常情況下，情緒是很難被隱藏的。


    情緒之所以難以克制，是因為它是人類在數億年的進化中，產生的一種「本能」。每一種情緒，都是人類追求生存空間時的一種「武器」。例如說：


    - ①感動是對那些可能使自己更為強壯的力量 的強化。

    - ②悲傷是想喚起他人的憐憫與同情，從而獲得安慰與幫助。

    - ③痛苦是為了警告你去剔除那些不利於自己的因素，從而達到強化自己的目的。

    - ④憤怒是對憤怒的對象發動攻擊並保護自己利益的前兆。

    - ⑤恐懼則代表自衛,自我保護。

    - ⑥厭惡代表拒絕，避開那些不利自己的因素。

    - ⑦驚訝是透過靜止來減少被傷害的可能。

    - ⑧愉悅是接納那些令自我感到快樂的因素。


    這些情緒代表著人不同的狀態。在人類最初的階段，一切行為幾乎都要受到情緒的影響。但是隨著人類文明的不斷推進，人的社會性越來越突出，這時，我們就不能再像原始人一樣，一切行為都被情緒所支配了。比如，有些時候，我們要學會克制自己的憤怒；而在某些場合，即便我們有厭惡心理，也不能輕易表達出來等等。


    在現代社會中，那些被情緒左右行為的人，會被人們看作是「情緒化」的人，會被視作是不成熟，或是心理有問題。但是話又說回來，即便我們能不被情緒左右我們的行為，可是卻無法完全消除它帶給我們的一些影響，比如細微的肢體語言和臉部表情。這些「小動作」就是所謂的情緒表達，是人類在進化中所遺留下的一些固有的反應，很難澈底被掩飾。


    但這並不意味著我們就完全無法克制自己情緒的表達。透過對現實生活的觀察，我們就可以發現，有很多人似乎完全擺脫了情緒的定律，能夠很好地隱藏自己的情緒。


    六十六歲的美國男子威廉．希萊爾，因為被控詐欺罪處以監禁。


    一個人因詐欺罪被捕，本來是常見的新聞，不足為奇。但是由於這個人詐騙的對象太過不同尋常——他騙的是 FBI，所以這個新聞引起了軒然大波。


    希萊爾先是精心編造了一個曲折的故事：多年前，他的女兒在泰國曼谷旅遊時，被黑道集團綁架，從此淪為性奴。作為特種部隊的精英隊員，希萊爾知道女兒被劫持的消息後，立刻前去營救，但是最終失敗。希萊爾還加碼說：我的遭遇後來被拍成電影《即刻救援》(
    Taken, 2008 )，而我正是這部電影主人公的原型。


    這樣一個英雄人物，自然受到了各方的追捧，很多機構都請他去作報告。這些機構中，就包括聯邦調查局。


    FBI 探員一輩子都在與謊言打交道，但是這一次，他們卻沒有識破希萊爾的假話。在希萊爾講到女兒被恐怖分子虐待細節的時候，表現得非常悲痛，雖然這種悲痛是偽裝的，他的一切情緒都是偽裝的，但是
    FBI 卻未能識破。


    事實上，希萊爾並不是什麼特種士兵，他只是一個普通人。而 FBI，就被這樣一個善於偽裝情緒的人，給騙得團團轉。


    希萊爾騙過 FBI 的這個案例，證明了一件事情——人的情緒雖然很難被控制，但是有些人，或是透過某些方法，確實可以隱藏自己的真實情感。


    那些隱藏情緒的高手，他們並不是沒有情緒，而是不會讓自己的情緒輕易地表現出來。這些人如果能夠把自己的這種能力運用到正確的事情上面，往往會取得很好的效果。


    例如，在公車上，一個人踩了你的腳，卻好像沒事一樣。這種事情不管誰發生，肯定都會產生不滿的情緒。但是具體表現出來，卻不一樣——有些人是直接表達自己的不滿，大聲的叫嚷，斥責對方；而有些人則顯得和氣得多，暗示對方：你應該向我道歉。


    從情緒的表達上來講，第一種人的表現，是情緒的「正常表達」——在產生不滿情緒之後發怒；而第二種人則將自己的不滿情緒「隱藏」了起來，這種人就屬於那種藏心的高手。我們可以想像，這類人在生活中也更加討人喜歡。


    本篇所有的內容，都只是想告訴大家關於情緒的一些基本原理。情緒是我們藏心的難點，也是重點，所以我們很有必要明白這一點。


    ## 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    ## 自我克制，控制自己的慾望


    藏心的關鍵就在於更高竿地掩飾自己的本能和情緒。或許，我們這樣的表述會讓大家認為：藏心的本質就是「實弄玄虛」、「深藏不露」，事實上，我們所說的藏心，還包括另一個重要面——自我克制，即克制自己多餘的慾望，這是一種道德層面的提升。


    我們在介紹到人的某些反應時，經常提到：這是一種本能的反應。似乎是說：這些反應是不可控制的。對於這個問題，我們常用「很難控制」這個詞，也就是說，人類的基本反應，是可以控制的，但不是每一個人都能好好控制。


    那些善於自我控制的人，也更善於藏心。而那些不善於控制自己本能的人，則會更多地表現出非理性的一面，他們更容易被各種誘惑所牽引，做出一些超出常理的事情。


    1982 年 8 月的一天，FBI 接手了一件殺人案。在這個案件中，一個號稱「綠河殺人魔」的罪犯，連續殺害了多名女性。


    隨著調查的深入，FBI 逐漸掌握了兇手的一些情況。原來，這個人曾經被女性傷害過，當時他一怒之下，便殺死了那個傷害他的女人。但他還是無法控制自己的憤怒，所以他將自己的怒氣發洩到別的女人身上，接連殺害了多名女性。


    就是因為不能控制自己，所以釀成了一樁樁悲劇。由此可見，作為一個人，必須要懂得自我控制，不能讓自己的負面情緒如雜草般滋長。


    人都有慾望，可是人能夠控制自己的慾望，這是人與動物最大的區別。正因為我們有道德觀，所以我們才知道自我控制。《禮記》記載：有一個人非常饑餓，但是當人不客氣的咎喝他吃東西的時候，他卻拒絕了。這就是所謂的「廉者不受嗟來之食」。事實上，饑餓中的人，對食物有天生的渴望。但是故事中的這個人卻能夠控制住自己的本能慾望，正是由於他具有出於道德觀的自控能力。


    控制自己的慾望，是藏心的重要一課。在生活中，當一個人看到萬貫財富、珍饈美食、絕世美女時，都會立刻產生占有慾。但是作為一個文明人，我們必須用理性控制自己，不讓自己的占有慾表現出來，更不能讓占有慾主使我們做出一些非理性的事情，因為那樣只會引火焚身。


    我們之所以要控制自己的慾望，藏住自己的欲求，還有一個更重要的原因，那就是，慾望往往就是一個人最大的缺點，如果不懂克制慾望，經常會被敵人所利用。


    據說，東南亞的當地土著，有一個捕捉猴子的方法十分有趣。他們將一些美味的水果放在箱子裡面，然後在箱子上面挖一個小洞，大小正好能夠讓猴子空手伸進去。


    那些猴子通常經不住箱子中水果的誘惑，牠們很想抓住裡面的水果；可是手一旦抓住了水果就再也無法把手抽出來，唯一的辦法是把手裡的水果放下。但是，絕大多數的猴子寧願被捉，也不願意放下那些看似唾手可得的水果，所以當獵人來的時候，根本就不需要花費什麼力氣，就可以輕易地將牠們捉住。


    猴子不懂克制慾望，所以會陷入別人的陷阱。而我們人，雖然聰明、理智，但是我們的慾望也常常會被人利用，因而遭到別人的算計。


    2001 年 2 月 21 日，美國聯邦調查局前局長路易士·弗利 ( Louis Freeh, 1950.1.6 - ) 召開了緊急記者發布會，透露了 FBI
    高級探員漢森 ( Robert Hanssen, 1944.4.18 - ) 十五年來充當某敵國間諜的驚人內幕。


    這個漢森本是 FBI 探員，但是他卻被金錢所誘惑，為敵國服務。由於這個人是個反間諜專家，所以 FBI 久久沒能找到他為敵國服務的證據。


    為了能「引蛇出洞」，FBI 決定利用漢森貪財的這個特點，給他設下個「套」。首先，他們指派一名 FBI 探員冒充敵國間諜，告訴漢森說：「我們需要一個重要的情報，如果你能得到這個情報，我們將給你五百萬美元的報酬。」


    作為一個資深的探員，漢森意識到：這可能是個陷阱。但是在五百萬美元的誘惑下，他還是沒能控制住自己的慾望，所以鋌而走險。結果，正好落入了 FBI 的圈套，現出原形。


    在這個案例中，漢森就是因為沒能克制住自己的慾望，走上了邪路，最終又因慾望而被「打回原形」。由此可見，慾望確實是讓一個人暴露自己本性的重要因素。


    我們若想成為一個藏心的高手，首先就要學會控制自己的慾望。這不是說人不能有慾望，而是說要學會隱藏自己的欲求、克制自己的「危險」慾念。我們不能把自己的慾望表現出來，更不能被慾望所牽引，這是一個藏心的祕訣。一個人只有懂得克制自己之後，才能做到真正的深不可測，變成一個沒有缺點的人。


    ## STEP 2

    ## 釋放

    不生氣，拋開憤怒情緒


    哲學家說：生氣就是用別人的錯誤懲罰自己。


    仔細想想，這句話確實是真理！我們之所以會生氣，大部分是因為別人犯的錯誤影響了我們。


    而生氣除了讓自己不愉快，又能改變什麼呢？這難道不是用別人的錯誤懲罰自己嗎？我們與其為別人的錯誤而生氣，還不如自己努力給自己爭口氣來得實在！


    ![](img/65c5e2383679681693f7479829cb5f93_31_0.png)


    ![](img/65c5e2383679681693f7479829cb5f93_31_1.png)


    ## 理解憤怒，找尋合適的發洩管道


    好鬥不見得完全是一件壞事。一個好鬥的人，證明他心中有對成功的渴望，這是值得肯定的。所以，我們也不必為自己的好鬥而感到煩惱。只要你能理解鬥爭心理，為它提供恰當、合適的宣洩管道，就可以「藏住」自己的憤怒情緒。


    在 FBI 的黑名單裡，綽號「I-5 高速公路殺手」的蘭迪·沃德菲爾德（Randall Woodfield, 1950.12.26 - ）名列前茅。他被控犯有四項謀殺罪，FBI
    相信，受害者至少有四十四人。


    嫌犯落網之後，著名的 FBI 女幹員、談判專家柯比（Pat Kirby）被派去審問這個窮凶極惡的人。雙方面對面地坐在桌子兩邊，中間沒有任何阻擋。


    當柯比毫無阻隔地與惡名昭彰的連環殺手面對面時，心中泛起一股難以言說的憤怒情緒。或許是因為沃德菲爾德見與自己交談的是名女警官，故意要嚇一嚇她，便將眼睛瞪得圓圓的。作為一個被人尊重的談判專家，柯比從來沒有被人如此的恐嚇過，那一刻，她的心中充滿了對眼前這個人憤恨。但是她馬上就變得冷靜下來，因為這對於案情的進展沒有一點好處。


    柯比心想：「我之所以會憤怒，是因為眼前這個人對我的挑釁，而他的挑釁也不過是最後的掙扎而已。從根本上來講，他其實是個可憐人，雖然罪不可赦，但是他也是命運的受害者。」


    想到這裡，柯比的眼中流露出平靜的同情。她開始與嫌犯心平氣和地交談起來。果然，殺人如麻的嫌犯開始變得收斂。經過幾天的審訊，他終於交代了自己所有的罪行。


    ## Step 2 釋放 / 不生氣，拋開憤怒情緒


    這個案例解釋了一個道理：「你不能透過創造新問題來解決舊問題。」有時候，你如果不會隱藏自己的憤怒情緒，就可能給自己製造新的麻煩。假如故事中的柯比沒有控制好自己的憤怒情緒，對嫌犯表現出自己的侵略性，就不會如此順利的完成任務。


    所以，當你感到自己的憤怒已經無法控制的時候，不妨停下來捫心自問：「暴力或是刻薄的言語，對眼前的事 情有幫助嗎？」此時，你就會發現自己的憤怒情緒其實毫無用處，這意味你已經向控制這種反應邁出了一大步。


    客運上，懷特不慎踩了葛林的腳。這本是一樁無關緊要的小事情，但是葛林卻非常生氣，對懷特說：「你是沒長眼睛嗎？」


    懷特這時如果能讓一步，事情也許就結束了，但是他當時也動氣了，就針鋒相對地說：「有，但沒看見。」


    當時坐在葛林一旁的是她的妹妹潔西卡，見懷特沒有道歉的意思，便罵了懷特一句：「你眼睛瞎了嗎？」懷特見她罵自己，大動肝火，上去打了潔西卡一拳。於是雙方就扭打在了一起。


    在爭鬥中，葛林吃了虧，因為「咽不下這口氣」，所以就打電話叫弟弟阿詹過來幫忙。懷特見對方來了幫手，怕吃虧，就躲到一家髮廊內。一群人等追到髮廊內與懷特發生了鬥毆。


    在鬥毆的過程中，失去理智的懷特掏出隨身攜帶的蝴蝶刀亂捅一番，將阿詹、潔西卡捅傷。阿詹因為傷及胸部、腹部，倒地昏迷。葛林見發生了兇殺案，立即撥打119求救，把傷者急速送往醫院救治。經搶救，阿詹脫離了生命危險，潔西卡則為輕傷。


    怒火會給人帶來如此大的危害，所以，你應該學會消解自己的怒火。當你有了憤怒之後，你需要一個安全閥排出多餘的情緒「蒸汽」。


    各種身體鍛煉方式都有益於慢慢排掉好鬥的「蒸汽」。輕快地長跑、打籃球、踢足球，這些運動都可以讓你獲得釋放。尤其值得提倡的是那些能讓你擊打或猛撞的運動——高爾夫、網球、保齡球、打沙包等等。


    還有一種辦法就是將怒火發洩到紙上。如果有人讓你灰心喪氣或是惹惱了你，不妨給對方寫封信，把心中的怒火全部寫出來，不給想像力留半點空間，然後把寫好的信付之一炬。


    排遣怒火的最佳管道是把它全部用完——即朝某個目標而奮鬥。工作始終是一種最好的治療方法，也是撫慰煩躁心靈的最佳鎮靜劑。


    在理解了憤怒之後，我們也更能原諒別人對我們的不禮貌行為。如果有人對你粗魯無禮，在認識到對方的反應也許並非出於惡意而是某種下意識行為時，那麼你的苦惱也就消除了大半。別人或許也不過是在宣洩無法用於實現目標的情緒「蒸汽」罷了。


    當你明白了這個道理後，就不會因為別人的憤怒情緒而勾起你報復性的憤怒回應了。這時，你才算真正成為了一個藏心的高手！


