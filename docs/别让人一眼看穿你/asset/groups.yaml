    才安心睡著了。第二天清晨，女孩家的小狗被吊到了天花板上，但昨晚小狗不是一直在舔她的手嗎？


    這是 FBI 的真實案例。


    實情是沒有任何外來者的侵入，其實女孩是患有解離性多重人格分裂症。


