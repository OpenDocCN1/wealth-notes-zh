    毒梟的「下屬」，探員只得從命。這位探員在進入辦公室之後，立刻感覺氣氛有點不對。在辦公室裡還坐著幾個兇神惡煞的人，他知道這些人都是黑幫裡的打手，他們在這裡，肯定沒有什麼好事情。


    果然，還沒等他開口，大毒梟就掏出一把手槍，指著他說：「別以為我不知道，你是警方派來的臥底！我今天就殺了你。」


    事後，探員回憶起當年的場景時，依舊心有餘悸：「當聽到對方的那句話時，我的第一反應是：事情暴露了，我必須殺出去。但是這個想法僅僅在我腦子裡停留了零點幾秒，因為我知道，即便是動手，也不見得就能跑掉。更何況，如果這僅僅是對方的一個考驗，那麼我一旦動手，就真的暴露了，不僅小命難保，我們的所有計畫都會泡湯。」


    正因為有了這番考慮，所以探員克制住了自己的恐懼以及戰鬥反應，從容地說：「您開什麼玩笑，我怎麼會是條子？」


    那個大毒梟依舊不饒人地說：「我都已經調查清楚了，你不要抵賴了，今天你死定了。」


    探員依舊從容，說道：「如果您真的調查了我的背景，那麼您只會更信任我，因為我過去十幾年中都在監獄和逃亡的路上，我恨不得把那些追捕我的條子都殺光。」


    見探員沒有露出破綻，大毒梟立刻換了一張臉，笑道：「哈哈，哥兒們，我只是開個玩笑。我一直都很信任你，現在，我有一件非常重要的事情要交給你辦……」


    這個探員一步步取得了大毒梟的信任，最終幫助 FBI 剿滅了這幫毒販。


    我們不得不被案例中這位探員的機智所折服。我們仔細分析'
