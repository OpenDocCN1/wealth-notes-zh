    ## 掩飾得失心


    現代人多多少少會有一些浮躁，急於成功，在成功之後就會顯得飄飄然；但是如果沒有成功，則一蹶不振。


    一個人若是在成功之後表現得太過驕傲、自大，會引起別人的不滿和怨恨。同樣，如果人在失敗之後表現出過多的失落和悲傷，會讓別人認為太脆弱，不能成就大事。所以，一個人如何面對成功失敗，會不會克制自己的得失心，是非常重要的。而且，這方面的能力也是藏心術的重要組成部分。


    FBI 探員里維斯是潛伏在黑社會組織內部多年的一名臥底。當初，總部給他的任務是：盡可能地在這個組織中獲得更大的權力，然後再想辦法瓦解他們。


    某一天，里維斯得知這個組織內的三號人物要到洛杉磯和另一個正在被通緝的黑社會成員祕密接頭。他知道，這是逮捕「三號」的最好時機。於是，他將這一消息通報給了總部。


    第二天，里維斯被犯罪組織叫去參加一個聚會。正在聚會時，幫派中的一個小弟急匆匆地跑了進來，對「大哥」悄悄說了幾句話。


    「大哥」聽完之後，皺起了眉頭。里維斯知道：自己的同事很可能已經將「三號」逮捕了，這個小弟可能是來報信的。能夠協助自己的同事逮捕一個重要人物，里維斯的心中當然充滿了成就感，可是他卻不能表現出任何「勝利者的姿態」。


    果然，隔了一會兒，「大哥」惡狠狠地說：「老三被捕了，是 FBI 那幫人幹的。」

