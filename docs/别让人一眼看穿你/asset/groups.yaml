    在這個案例中，我們提到一個可以安定情緒的小動作——按摩自己的頸部。這個動作其實在生活中非常常見，很多人 在感到緊張或是煩躁的時候，都有這樣的習慣。


    相對而言，男人在做這個動作時幅度更大一些，喜歡抓住或者搓住下巴以下的頸前部，刺激迷走神經和頸動脈竇，從而降低心率和鎮靜情緒。


