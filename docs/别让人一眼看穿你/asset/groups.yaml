    本是爭的情形，由於謙和禮讓的出現而使矛盾化解，免去不必要的爭鬥，甚至使對手變手足、仇人變兄弟。相反，得理不讓人，使對方走投無路，有可能激起對方「求生」的意志，甚至可能是「不擇手段」，對自己造成傷害。


    對方「無理」，自知理虧，你在「理」字已明之下，反退一步，一般人多少都會心存感激。就算不如此，也不會再有無理的行為。這就是人性。得理讓人，不僅是一種積蓄，更是一種財富。


