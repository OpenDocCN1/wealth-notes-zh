    # 別讓人一眼看穿你

    觀心與藏心的攻防智慧


    之前沒有見過蘇軾，雖然見到蘇軾表現得比較冷淡才是應有的狀態；可是他卻因為別人都尊重蘇軾，自己便也對蘇軾尊重有加，這不是一件壞事，但確實是從眾反應的表現。


    同時，我們還需要注意一個細節，那就是老道在知道蘇軾的真實身分之後，做了一個動作——「打躬作揖」。在心理學上，這個動作意味著示弱和服從。低頭聳肩，這樣的動作在古裝劇中我們經常會看到，臣子面見皇上時經常低著頭、哈著腰。而今在職場，下屬靠近自己的上司時，往往也會採取這種姿勢，這雖不如古裝戲那麼明顯，但仔細觀察還是能看得到。不難判斷，在這種情況下，做出這種動作是因為身分、地位與權力不如對方。


    如果是身分、地位差不多時，做出這種動作，則意味著此人內心缺乏自信，並且不想引人注意。比如，當看到一群不太熟悉的同事在一邊談話，從他們旁邊經過的時候，我們都會怎樣做呢？


    自信且愛表現的人會昂首挺胸地走過去，希望對方注意到他。如果對方沒有留意到，他也會主動打招呼；而不太自信的人則會不自主地縮緊脖子，努力讓自己顯得更弱小和不太引人注意，期望對方不要注意到他。


    凱特有個十七歲的兒子名叫詹姆斯，是一個高中二年級的學生。詹姆斯身高一百七十八公分，身材魁梧強壯，外人都覺得他是個帥氣十足的男子漢。但凱特在跟詹姆斯的老師談話時卻說，兒子外表看上去高大威猛，但實際上是個羞澀的孩子，希望老師能配合自己幫助兒子樹立信心。


    「嘎，您為什麼這麼說呢？詹姆斯看起來很不錯啊。」老師一'
  - '[PAGE 125]


    臉驚訝地望著凱特。


    「不是這樣的，這都是假象。住我們隔壁的鄰居是個心理學博士，好幾次我跟鄰居聊天，詹姆斯從旁邊經過都低著頭、聳著肩，不說一句話。鄰居問我詹姆斯是不是缺少自信，剛開始我還不以為意，後來慢慢觀察，我覺得鄰居說得沒錯。他外表很強壯，內心卻很自卑，希望老師能幫我讓孩子樹立自信心。」凱特語重心長地告訴老師。


    案例中的這個男孩，就是因為他沒有自信的一個動作，讓心理學專家看出了他的內心。事實上，低頭聳肩這個動作，非常容易暴露一個人的內心。


