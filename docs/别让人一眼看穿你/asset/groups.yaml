    # STEP 1


    # 抓漏


    想藏心，先找出破綻


    藏心術的關鍵，就在於隱藏那些暴露我們情緒和內心的種種破綻。所以，若想「藏心」，我們就需要找到自己的破綻，然後想辦法將這些破綻都隱藏起來。


    生活中的各個動作、表情、言語，都可能充滿破綻，本章中，我們要將這些破綻一一找出來，然後再教大家一些掩飾的方法。


