    # 隱藏你的戰鬥反應


    當一個人遇到危險，會自然而然的產生凍結反應。如果事件進一步惡化時，凍結反應會轉化為戰鬥反應。也就是，當你意識到危險已經無法逃避，你的潛意識會激發你的戰鬥意志，讓你充滿攻擊性。


    有時候，我們的恐懼會轉化為憤怒。像是，人走夜路的時候，突然有一個黑影竄了出來，這個人肯定會被嚇一跳。緊接著，他會感到非常憤怒，這時他會充滿攻擊性。


    我們仔細想想：這個黑影，其實沒有給他造成任何實質性的傷害，而他憤怒的原因，僅僅是因為這個影子讓他感到恐懼。所以說，恐懼所導致的憤怒，大多是不理性的。大多數憤怒都會給我們的生活帶來麻煩，而不理性的憤怒更是如此。


    憤怒之所以可怕，是因為憤怒經常會讓人產生戰鬥反應，讓我們只想著用暴力手段解決問題。在現代社會中，暴力手段應該得到最大程度的克制，因為沒有一個國家的法律和道德，容許一個人肆無忌憚的採取暴力解決問題。所以，我們要藏心，就必須學會克制自己的戰鬥反應。


    1992年，一名 FBI 探員奉命進入墨西哥黑幫組織臥底。這個黑幫組織的老大是墨西哥著名的大毒梟，FBI 此次行動的目的，就是調查清楚這個大毒梟是透過什麼管道將毒品販賣到美國本土的。


    這名 FBI 探員在進入這個黑幫組織之後，開始了祕密調查。突然有一天，大毒梟要探員到自己的辦公室一趟。作為大


    ![](img/65c5e2383679681693f7479829cb5f93_196_0.png)'
