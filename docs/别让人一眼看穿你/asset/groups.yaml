    弗里茲·克萊斯勒回答：「這一切都是練習的結果。如果我一個月沒有練習，觀眾可以聽出差別；如果我一週沒有練習，我的妻子可以聽出差別；如果我一天沒有練習，我自己能夠聽出差別。」


