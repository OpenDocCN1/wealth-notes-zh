    鐵龍也恰好開了進來，駕駛像以往那樣把車緊緊停靠在 A 先生的車旁。A 先生一見，火氣就來了，加上他正患著感冒，頭痛得厲害，下班前又被上司批評了一頓，一肚子氣正沒地方發洩。


