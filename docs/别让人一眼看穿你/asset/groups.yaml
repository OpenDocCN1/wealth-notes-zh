    # 機闌算盡最容易被看穿


    在這個現實的社會，有些人為了種種原因，參與進那種你爭我奪的大染缸中，認為只有不斷地去爭才能獲得生存的空間。

    其實，從根源上講，爭奪生存空間的鬥爭就是圍繞著領域展開的爭奪。


    追逐生存的空間是沒有錯的，如果天天緊繃神經，只想著為蠅頭小利爭鬥，不但辛苦，而且得不償失；更有甚者，為了自己的利益想著用詭計陷害更多的人，樹立更多的敵人，這就是占有慾發展到最後的負面體現了。


    這世上誰也不比誰傻，所以一個人若是機闌算盡，就算偽裝得再好，也遲早要被別人看穿。因此，在占有慾中，我們應該處於「防守」的地方。


    何謂防守型的占有？如果我們用陰謀詭計整人是進攻的話，那麼保護自己、更好的生存就是防守。一個人如果只重視與人鬥爭，老是想著去進攻的話，那麼他的生存環境必然很糟糕，他身邊到處都是敵人，而他在鬥爭的過程裡，一定都是破綻。


    不可否認，有時候為了生存，不得不去爭鬥，但是如果換種方式能獲取更大的發展空間，又何必把時間和精力浪費在無謂的爭鬥上？人的第一要素永遠都是生存，但靠要詭計去生存確實極具風險，甚至得不償失。


