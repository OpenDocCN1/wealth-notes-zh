    # 無謂之爭要不得


    占有並沒有錯，每個人生活在這個世界中都要去占有一些東西。但是不加控制的占有慾，卻將我們帶入了另一個險境——費盡心機去占有那些可有可無的東西。


    事實上，在生活中，我們有時候都是在做無謂的爭鬥。爭贏了，得不到任何好處，反而得罪人，暴露了自己的貪婪；爭輸了，悶悶不樂半天，更鬱悶的是發現把重要的事情也耽誤了。


    有時候，說起來都好笑，爭不是為了利益，也不是為了面子，純粹就是為了爭，就是為了贏過別人，除了享受一下「勝利」的小喜悅，其他什麼好處也撈不著。


    有的人就喜歡和別人作對，大概成了習慣吧，無論別人說什麼，他總要照例反駁。他自己本無成見，不過在你說「是」時，他一定要說「否」，到你說「否」時，他又說「是」。現實中，有這種習慣的人很多，而且每每不自知——而這種心理，就是占有慾在作祟。


    為什麼人會出現盲目的占有慾？總結來說有以下幾個原因：


    # 1. 喜歡以自我為中心


    生活中，很多人喜歡以自我為中心，所以能夠得到的東西，他們都想去占有。這其實也是領域感的一種表現。


    # 2. 過於熱心


    有些人的占有慾不僅表現在對物質的占有，而且還體現在對真理的「占有」。還有一些人之所以要爭，其實並沒有太多心思，只是因為本身過於熱心，想提出更高超的見解，以為這樣可'
  - '[PAGE 161]


    # Step 6 捨得 / 不迷失，建立安全感、克制占有慾


    以讓人另眼相看。實際上這種自作聰明的心態完全錯了。


    唐代有一位豐干禪師，在天台山國清寺清修。一天，豐干禪師在松林漫步，突然聽見遠遠的有小孩的嗨哭聲。豐干禪師走過去問：「你是誰家的孩子？」


    小孩哭哭啼啼地說：「我找不到父母了，我也不知道他們在哪兒。」於是，豐干禪師便把這男孩帶回國清寺，等待他的家人來認領。


    小孩的父母一直沒有出現，所以他一直住在寺院裡。因為他是豐干禪師撿回來的，所以大家都叫他「拾得」。拾得長大以後，寺廟裡安排他到廚房打雜。


    拾得有個名叫寒山的朋友，家裡很窮。因為寒山常常缺衣少食，拾得就將齋堂裡吃剩的飯用一個竹筒裝起來，給寒山背回去。


    有一天，寒山問拾得：「如果世間有人無端地誹謗我、欺負我、侮辱我、恥笑我、輕視我、鄙賤我、厭惡我、欺騙我，我要怎麼做才好呢？」


    拾得回答道：「你不妨忍著他、謙讓他、任由他、避開他、耐煩他、尊敬他、不要理會他。再過幾年，你且看他。」


    寒山聽後說：「我們這些人無權無勢，也只能如此了。」


    拾得卻搖搖頭說：「彌勒菩薩雖然法力無邊，但是他也說：老拙穿破襖，淡飯腹中飽；補破好遮寒，萬事隨緣了；有人罵老拙，老拙只說好；有人打老拙，老拙自睡倒。由此可見，忍讓和無求並不是懦弱，而是因為看破。」


    這個佛家故事，其實講的就是「不爭」的道理。只有看破了'
