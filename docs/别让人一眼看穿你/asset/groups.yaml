    # 別讓人一眼看穿你

    飒心與藏心的攻防智慧


    # 母是被半夜潛入的外來賊匪殺死的……


    這個案例中的女孩，因為繼父長期的折磨和灌輸錯誤的自我認識，所以導致精神分裂。由於女孩還小，所以不能有正確的自我認識，這也是沒有辦法的事情。但是作為一個成年人，我們必須要學會獨立培養自我認識。只有知道自己是個什麼樣的人，有什麼樣的特長和缺點，人在做事情的時候才會顯得更專注——包括藏心。


    古希臘帕那索斯山的阿波羅神廟有一塊石碑，刻著這樣一句箴言：「認識你自己。」盧柽稱這一碑銘：「比倫理學家們的一切館著都更為重要、更為深奧。」


    正確認識自己，對於個人的成長進步和工作生活具有重要的作用和意義。正確認識自己是改造自己的前提，看到自己的不足，才能增強自我改造的自覺性和緊迫感，產生自我改造的內在動力。太多人希望自己總能夠解決所有問題，總能充當「贏家」的角色，但是卻沒有想過：自己有沒有贏的實力？


    所以說，要想贏，先別去想輸贏勝負，而是先考慮一下自己到底有哪些贏的資本，或是想一想自己要贏在什麼地方。這就是我們所說的認識自己。


    只有正確地認識了自己，才能熟稔於長短，長而發揚、短而收斂，做到不卑不亢，自信而不失容納之懷。


    事實上任何人都非完美，每一個人的性格中都有各式各樣的缺陷，但是這並不妨礙你走向成功。最重要的是，必須能夠認識自己的缺點，然後加以改正，走向相對完美的決心。認識自己在有時候其實就是自己和自己較勁的過程。人往往都自視甚高，在認識自己的過程中，會不斷打破原來主觀化、理想化的自我認'
