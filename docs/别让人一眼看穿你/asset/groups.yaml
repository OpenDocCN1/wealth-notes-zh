    ## 肢體的逃離


    本篇，我們將從肢體語言的角度探討如何克服自己的逃離反應。


    首先，我們來介紹一下逃離反應在肢體動作中的幾種體現。


    ### 第一個，最明顯的逃離反應，就是「軀幹的轉動」。


    這種逃離反應比較容易出現在多人對話的場景，和在比較開放的空間環境中對話。當不喜歡眼下正在說話的這個人時，很多人都會將身體轉向另外一個人，儘管臉上可能沒有表現出厭惡之情，但是這種肢體語言已經將此人的內心暴露了。


    FBI 曾派遣探員 M 潛伏到某犯罪組織，試圖瓦解這個犯罪組織。探員 M 發現，這個犯罪組織結構嚴密，犯罪行為隱蔽，要想一舉破壞對方，只有從內部下手。但是，他缺少這樣一個契機。


    某一天，這個犯罪組織辦了場聚會，許多角頭都來參加。在聚會中，M 敏銳地察覺到，在他們老大講話的時候，組織中的副手雖然滿臉笑容，但是身體卻轉向了別處。M 意識到，副手對老大有所不滿，這也許是從內部瓦解對方的一個好方法。所以自那以後，他開始刻意挑撥二人的關係。


    果然，沒過多久，這個犯罪組織就開始了內訌。內訌大大削弱了這個組織的實力，很快他們就鳥獸散了。一個讓警方頭疼很久的組織，就這樣瓦解了。


    案例中的探員 M，就是敏銳觀察到副手一個小小的肢體動作，從而洞悉了對方的內心想法。在現實生活中，我們的肢體語言也同樣會被有心人所觀察到，我們的內心所想也可能會因此而暴露。所以，在面對一個人的時候，無論你內心是如何想的，在還沒必要攤牌之前，請用一顆平常心去對待他。而你首先要做的就是——不要轉開身體。


    ### 第二個，肢體上的逃離反應就是「腳」。


    從科學角度來看，想要控制自己的腳要比控制身體其他部分更難。因為腳是離中樞神經系統最遠的一個器官，所以最難控制。美國有位前 FBI 探員就曾經在書中總結過：「從頭到腳，可信度逐漸增強。」


    如果兩個人是站著說話的，無論身體其他部分是如何的狀態，雙腳腳尖一定指向對方。如果是坐著說話，雙腿延伸線形成的扇形區域，會把對方涵蓋在中間。


    但是當一個人產生逃離反應之後，腳會立刻改變方向。這是典型「準備逃走」的表現，也是逃離反應最直接的體現。


    發生在腳上的逃離反應，雖然很難被人觀察到，但是一旦被人發現，那麼對方就可以確定你此時的心裡狀態了。所以，如果你想藏心，就要控制住自己的腳。


    ### 第三個，逃離反應的肢體表現就是「手」。


    我們之所以把手上的逃離反應放到最後一位，是因為手的反應是最不直接的。因為手部的逃離不是透過動作體現出來的。


    在我們有了逃離反應的時候，其實我們的神經系統已經開始為逃跑做準備了。這時候，身體裡的血液會向腿部集中，而手部則供血不足，所以會冒冷汗，手上發冷。之所以說手部的逃離反應不太明顯，就是因為這些特徵是觀察不到的。但是在某些特定場合，比如正式場合需要握手，這個特徵就會變得十分明顯。


    由於手部的逃離反應完全是生理上的反應，不能用理智加以有效克制，所以，若是你感到自己手心冰涼、冒冷汗的時候，就要避免和他人握手。


    這裡介紹幾個禮貌拒絕握手的小竅門：在需要握手時，你可以先把手伸出來，掌心向上，做出「請」的動作，並說：「有失遠迎，這邊請。」或是在握手之前，假意打噴嚏，用手捂一下自己的嘴。這樣的話，你不和對方握手，反倒顯得你彬彬有禮。


    總而言之，逃離反應在肢體上有多種表現方式，但是你可以透過一些小方法一一化解，以達到藏心的目的。


    ## Step 9 鎮定 / 不慌張，穩住逃離反應


    ## Ⅰ 人際關係的距離感


    逃離反應在生活中多有體現，下面則敘述逃離反應的另一種表現——人際關係的距離感。


    人際交往中，心理上的距離會依據現實距離上的遠近體現出來。這種意識其實和動物的領域意識非常相像，也是逃離反應的一種。比如，你和一個陌生人，理論上應該保持 3
    公尺以上的距離（在公車上等場合除外）。如果這個人過分的接近你，你就會感受到威脅，產生逃離反應。對方若是你最為親密的人，則不會產生這種反應。


    美國人類學家霍爾博士（Edward Twitchell Hall Jr., 1914.5.16 - 2009.7.20）將這種距離關係分為四層：


    ### 公眾距離


    應該保持在 3.6 ~ 7.5 公尺。也就是說，如果一個陌生人試圖靠近到離你 3 公尺左右的距離，就會引起你的警覺，從而產生逃離反應。


    ### 社交距離


    一般性社會活動時所保持的距離，如辦公、開會等，這時候人們應該保持在 1.2 ~ 3 公尺之間。


    ### 私人距離


    朋友、熟人或親戚之間往來時常見的距離，這個距離應該保持在 0.45 ~ 1.2 公尺之間。


    ### 親密接觸


    這個已經沒有距離了，在至親之間會得以體現。


    不要小看人際關係中的這種距離感，事實上，它可以透露出許多東西。


    FBI探員在追查一起間諜案。他們接到一份情報指稱間諜會在下午五點左右，出現在一家咖啡廳裡。


    得到這個情報之後，FBI探員馬上意識到：這是個老手。對於新手而言，他們會盡量選擇在人少的時候接頭，以為這樣不易被人發現。但是真正的老手，卻會選擇在人多的地方接頭，因為那裡更容易隱蔽和躲藏。


    為了找到這個間諜，探員決定在咖啡館布下天羅地網。


    下午五點時，咖啡館裡已經是人聲鼎沸。在這樣的環境中，想找出可疑分子更是難上加難。


    但是很快，探員就把目光對準了一對夫婦。這對夫婦在進門的時候手牽著手，顯得非常親密，在就座後，他們面對面的坐著，偶爾耳語幾句，但是在說完話之後，卻都是靠靠著沙發的靠背，這是明顯的距離感。FBI探員馬上判斷出：這是一對假夫妻。對他們便留意起來。


    果不其然，不久後，探員便找到了他們接頭的證據，將二人拘捕了。


    從以上案例我們可以得知，大部分時候，人和人之間的距離感是一種心理上的默契，很難長時間假裝。這種人際關係交往的距離，很可能將我們的內心暴露出去。因此，我們需要注意「保持距離」。


    我們舉一個簡單的例子來說明。在一次同學聚會中，你的所有同學都在場，其中肯定有和你關係特別親密的，也有關係比較一般的。這時候，如果你不注意對社交距離的控制，和那些關係好的表現得特別親密，和其他人則顯得有些疏遠，肯定會給人厚此薄彼的感覺，引起不滿。


    所以，我們要藏心，有時候先要藏住我們和別人之間的距離。否則，很可能會引起一些不必要的麻煩。


    當然，我們也可以透過距離的控制，來表達自己的一些情感。比如你與情人吵架了，僅僅是普通的吵架，並沒有傷害到彼此的感情。但是你想刻意表現你很生氣，以便讓對方明白你的立場是非常堅定的。當然，這個生氣是假的，你心裡其實早就歸於平靜了，那麼該如何才能掩飾自己的平靜心情、假裝很生氣呢？


    最好的方法就是刻意的保持距離。像是在吃飯的時候，你坐得離對方遠一點，並且不容許對方的餐具和你的餐具有觸碰，那麼就肯定能騙過對方，讓對方以為你還在生氣。


    也許大家讀到這裡會有所啟發：原來那些最能暴露我們內心的種種線索，同樣也是我們藏心的好方法！如果大家都能夠領悟這一層，那麼也算是對「藏心術」有所體悟了。


    事實上，這世界上不存在任何絕對性的東西，藏心也是如此。有時候，「暴露」和「隱藏」是相對的，你完全可以透過給對方一些虛假的資訊來更好地隱藏自己的真實想法。


    ## 你是否為逃避型人格？


    現代心理學將習慣性逃避的人群，歸結為逃避型人格。

    在古代，那些不食人間煙火的隱居者，就可能是屬於此類人格。對於現代人而言，想做一個隱居者恐怕非常困難，因為我們必須面對紅塵俗世的紛紛擾擾，即便你不想，但是你別無選擇。所以，逃避型人格在現代社會中，顯得與世情格格不入。因此，即便你對生活有再多不滿，對現實有再多無奈，依然要藏住自己的逃避心理，積極地面對眼前的社會。


    但是在現實中，對於許多逃避型人格的人而言，他們雖然不能選擇隱居，可是往往關閉自己的心靈，不與他人親密的接觸，唯求自安。曾經發生過這樣的事情：有一位父親，將自己的兩個孩子「囚禁」在自己的家中，不讓孩子和外面的世界有任何接觸。父親這樣做的目的，是怕孩子被外界的壞東西所影響。可是他這種古怪的想法斷送了孩子的童年與青春，是一種犯罪行為。


    逃避型的人，不敢面對外界社會，也同樣不敢面對自己的心靈。所以，這種逃避帶有強迫性、盲目性和非理智性等特點。因此，逃避型人格如果發展到最後，對於人是有害無益的。只有克制和隱藏自己的逃避心理，才能更好地融入到社會中，取得一定的成就。


    心理學專家霍妮（Karen Horney, 1885.9.16 - 1952.12.4）認為逃避型人格有以下特點：


    - ① 因為別人的批評和反對意見而深受傷害。

    - ② 除了自己的親人之外，沒有或很少有交往密切的朋友。

    - ③ 除非他們確定自己受到別人的歡迎，否則不願意介入到別人的事情中。

    - ④ 對正常的人際交往和社交活動盡可能的逃避。

    - ⑤ 在社交場合顯得沉默寡言，尤其害怕別人的評價。

    - ⑥ 在做那些普通，但不在自己常規之中的事時，總是誇大潛在的困難、危險或可能的冒險。


    霍妮認為，只要滿足以上特徵中的四項，那麼就可以斷定一個人屬於逃避型人格。


    逃避型人格最大的特點是普遍地疏遠他人，甚至有對自我的疏遠，他們對自己都持旁觀態度，這與他們的生活態度是一致的。他們的內心還有一種「關鍵」的需求 —— 「在自己和他人之間保持感情的距離」。更精確地說，他們有意識和無意識地作出決定，不以任何方式在感情上與他人發生關聯，無論是愛情、爭鬥、合作、還是競爭。


    當然，逃避型人格也並非沒有好處，擁有逃避型人格的人，往往是細膩的內心觀察者，顯得獨立而有主見。但是，在當今社會，如果一個人不願意與別人共同合作，那麼會遇到很大的困難。而且，從藏心術的角度來講，逃避型人格的人往往不能克制自己對於集體和他人的恐懼，所以容易被他人看穿，對藏心是極為不利的。


    拿破崙出生在一個沒落貴族的家庭。當時，他的家族已經窮苦不堪，但是他的父親還是將拿破崙送進了一所貴族學校。拿破崙的同學都是一些富貴子弟，他們經常誇耀自己家庭的富有，嘲笑拿破崙家庭的貧窮。拿破崙的自尊心被深深地刺傷了。


    終於，拿破崙實在忍不住了，逃離這裡。他給父親寫了一封信，信上說：「我始終忍受著別人的嘲笑，他們無時無刻不在向我炫耀他們的金錢，譏諷我的貧困。父親，難道我在這些富有而高傲的人面前永遠只能謙卑地活下去嗎？」


    拿破崙的父親回信寫道：「誠然，我們很貧窮，但是你必須在那裡把書念完。」


    無奈之下，拿破崙在那所學校堅持了五年，經歷了長期的折磨。但是那裡的每一次嘲弄、每一次欺侮、每一次輕視的態度，都使他堅定了改變命運的決心。既然無法離開這裡，那麼只有試著改變現狀，他要讓那些嘲笑自己貧窮的人看看，他確實比他們優秀許多。拿破崙沒有任何的空口自誇，只是在心裡暗暗地計劃著，決定把這些沒有頭腦而又傲慢的人作為通往權力、財富和名譽巔峰的橋樑。


    到了十六歲，拿破崙成為法軍的一名上尉。也就是這一年，他的父親去世了。拿破崙不得不從他微薄的薪水中抽出一部分來供養他的母親。在軍隊裡，拿破崙發現很多人把空餘的時間都用在追求女人和賭博等事情上。拿破崙身材矮小，不討女人喜歡；經濟拮据；也沒有錢拿來賭博，所以拿破崙顯得很不合群。形單影隻的拿破崙選擇到圖書館打發時間，這使他獲益匪淺。


    拿破崙漫無目的地讀一些雜亂無章的書，並不是以讀書作為消遣的方式，而是把讀書作為實現自己理想的途徑。他決心將自己的才幹與能力展現給世人，並把它當作自己選擇圖書類別的指引。


    在圖書館的時光裡，他把自己想像成一個總司令，描繪出了科西嘉島的地圖，並在地圖上標明應當布置防範的地方。他用數學方法對所有的一切進行了精確的計算，他的數學才能也由此而得到了發展。


    拿破崙的努力使他的能力有了大幅度的提昇，他的長官發現拿破崙與眾不同，決定把操場上一些極複雜的計算工作派給他做。他漂亮地完成了這些工作，於是又獲得了別的機會。


    就這樣，一切情形都因此而改變了。從前嘲笑過他的人，現在都簇擁到他周圍，想從他的獎金中分得一點；從前輕視他的人，現在也都希望與他成為朋友；以前鄙視他矮小、無能、死讀書的人，現在都對他表示尊重。他們都變成了他忠心的擁戴者。


    後來，拿破崙回憶這種轉變時，感嘆說：「我經歷了很多困難，但是我沒有逃避。我絕不會失敗，除非我確信自己已經不敢去面對了。」


    如果想控制自己的逃避心理，就需要從自身出發，做出努力。由於具有逃避型人格的人大多伴隨著認知扭曲現象，所以，想要改善自己的逃避型人格，就必須扭轉自己的認知扭曲。


    對於逃避型人格的人而言，他們的認知扭曲經常表現在以下幾個方面：


    - ①經常會認為自己必須出類拔萃。

    - ②認為無論做任何都必須謹慎小心。

    - ③認為這世界上沒有誰值得相信，所以認為朋友可有可無。

    - ④盡量少介入他人事務，以免麻煩。

    - ⑤要求自己必須高效率，對於金錢的利用尤其是如此。


    從心理學的角度來看，扭轉認知扭曲最好的辦法就是「反向觀念法」，即指與自己原有的不良自我觀念唱反調。


    比如，對於大部分逃避型人格的人來講，他們多是以自我為中心，所以應該逐漸放棄自己的這種心態，學習設身處地為他人著想。原來愛走極端，現在則學習從多方位考察問題。原來喜歡嚴守規則，現在則應偶爾放鬆一下，學習無規則地自由行事。


    透過反向觀念法，我們應把這些扭曲的認識改變為：


    - ① 我希望出類拔萃，但是我也不能排斥眼前的平庸。

    - ② 我必須做事謹慎，但是也不能完全提心吊膽。

    - ③ 雖然獲得知音的可能性比較小，但是我不能拒絕交各種各樣的朋友。

    - ④ 不管他人閒事，但他人有難，我應當盡力相助。

    - ⑤ 我希望自己辦事高效率，即使效率不高，做總比不做好。


    採用反向觀念法克服缺點，就需要透過自我認識的方法來執行。先按照上面的方法找出自己的錯誤，然後再提出相反的改正意見，也就是更新自己的觀念。


    在生活中，我們需要照著自己的新觀念去指導自己的言行。這種自我分析我們要有計畫、有步驟的進行，三天一次或一星期一次，也可以在心情不好或屢遭挫折之時進行。認識上的錯誤往往是無意識的，根據上述自我分析，就可把無意識的東西上升到有意識的自覺層次上，這有助於改進不良心理狀態。


    但是，想要矯正逃避型人格並不是一件非常容易的事，需要你做出持之以恆的努力。你可以給自己安排一個具體的矯正計畫。


    例如，如果你不善交朋友，就必須給自己制定一個交朋友的計畫。起始的級別比較低，任務比較簡單，以後逐步加深難度。你先從和熟悉的人聊天開始，然後逐漸學會和陌生人正常交往，最後找到屬於自己的朋友。


    這看起來非常容易，但認真做起來並不是一件輕鬆的事。你最好找一個監督員，讓他來評定你的執行情況，並監督你堅持下去。最終，你會扭轉自己的逃避型人格，做到更好的藏心。


    ## 熟悉，讓你更從容


    歌手在自己熟悉的舞臺上，往往表現出無比自信的氣質；企業老總在自己的公司中，往往體現超出一般的王者氣息。就算是一個普通人，在自己家裡，也肯定是從容不迫……


    相反，一個貧困潦倒的人進入到富麗堂皇的酒店中，會顯得手足無措。而員工在強勢老闆的辦公室，也會顯得有點不自在……


    為什麼我們在有些時候、有些地點，總能保持鎮定，而在某些時候，卻又顯現出難以抑制的窘迫呢？


    其實，這都是逃離反應在作祟。


    在你熟悉或是你能掌握的地方，你感受不到威脅，所以不會產生任何逃離反應，你顯得鎮定從容、落落大方。但是在有些地方，你會感到自己的弱勢。而這時，由於逃離反應的產生，你會顯得綁手綁腳，沒自信。


    很顯然，我們都想成為一個無論在什麼地方都表現得落落大方的人。不管在什麼時候，我們也都希望能夠藏住自己心裡的不安和侷促。若想真正做到這一點，我們就要培養自己的「熟悉」。


    每一個資深的 FBI 探員，在被派到一個陌生的地方執行任務時，都會讓自己先熟悉這裡的地形。他們會到附近的街道隨意地逛一圈，在逛街的同時，他們還會特別留意這裡的一些具體情況：比如人群的密集程度、當地的地形等等。


    FBI 探員斯威夫特說：「其實，我們所做的這些觀察，不僅僅是為了更好地瞭解自己所處的環境，更是為了能夠對這個地方」

