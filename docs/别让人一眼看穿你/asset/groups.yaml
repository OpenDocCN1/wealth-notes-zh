    # 別讓人一眼看穿你


    觀心與藏心的攻防智慧


    ![](img/65c5e2383679681693f7479829cb5f93_148_0.png)


    其實，米開朗基羅剛才只是偷偷抓了一小塊大理石和一把石粉，到上面做個樣子罷了，雕像還是原來的雕像，一點都沒有改變。


    故事中這個官員的無理要求，其實就是領域感在作祟。他認為在自己的領域上，別人應該無條件地服從自己，而米開朗基羅則看穿了他的這種心態，捉弄他一番。


    由此可見，一個人的領域感，確實會被別人所利用、所愚弄。所以，我們想要藏心，就要學會控制自己的領域感，不能讓領域感氾濫成明顯的占有慾，那樣只會讓我們的負面心理滋生和暴露。


    領域感其實是一種與生俱來的心理。我們經常可以看到一些小孩，雖然心智還不是很成熟，但是誰要想從他家裡拿走一點東西，都會表現出不滿，這就是領域感的一種體現。作為一個成年人，我們當然不能像孩子那樣隨性地表露自己的情緒。所以，應該學會隱藏和克制自己的占有慾。


    # 領域的表達


    在本篇，我們將要談一談領域感的表達方式。


    對於不同的人來講，領域感的表達方式也是不同的。從性別上來講，女性比男性更能容忍比較親密的距離，男性對別人接近自己領域的忍受性要比女性更低。而且，男性在遭遇別人入侵領域的時候，更容易產生恐懼，這恐怕是一般人所不知道的。


    除了性別因素之外，領域感也受到人格因素的影響。一個人的人格特徵決定了他的世界觀，人格特徵也反映在空間行為上。對於那些性格內向的人來講，他們所需的個人空間要比外向的人更大。


    正因為領域感的表達方式體現在個人身上有很多的不同，所以領域感表現得很明顯的人，就更容易暴露自己的內心。


    FBI 正在試圖瓦解一個邪惡犯罪組織。這個犯罪組織的老大非常狡猾，他有很多藏身之地，關於他犯罪的具體證據 —— 組織的名單，肯定是藏在他最放心的一個地方。


    FBI 不能貿然出動人馬去搜查他現在所居住的地方，因為一旦沒能發現證據，那麼就會打草驚蛇，以後想要找到那個名單就更難了。


    可是，他到底將這個關鍵性的東西藏到哪兒呢？誰也不知道，FBI 的調查一時陷入了僵局。


    這時，一個剛剛被 FBI 徵召的年輕探員主動要求：由他去調查名單的真正位置。


    當時許多老探員都不相信，這個初出茅廬的年輕人能完成這一任務。但是他們也沒有什麼好辦法，只好把這個重任交給了他，就當是死馬當作活馬醫。


    這個年輕人信心滿滿的接受了任務，著手調查去了。


    三個月後，年輕探員向指揮部報告說：「我已經查清了名單所在地。」隨後，大批 FBI 探員出動，在年輕探員的指引下搜查了老大的一處居所。在那裡，他們果然發現了犯罪組織的名單。


    事後，許多 FBI 的前輩問這個年輕探員：「你是如何發現名單真正的藏身地？」他說：「我花三個月跟蹤他，發現他雖然有很多藏身之地，可是只有在回到我們最後搜查的那個家中時，才完全體現出他的領域感。當時我化裝成一個快遞員，突然進入他家裡時，他所顯示的狀態不是唯恐，而是表現出極強的敵意，那是屬於一種捍衛自己領域的狀態。我由此判斷出，這裡才是他真正的家，也是名單真正的藏身之所。」


    在這個案例中，年輕的 FBI 探員正是利用了犯罪組織老大的領域感，從而判斷出他真正的家。由此可見，領域感和占有慾的過度表達，會暴露一個人的內心。


    其實，在生活中，每個人的領域感都會透過種種方式表達出來。領域感可分為三種形式：獨處、親密、匿名，它們分別會在不同時間、不同情境出現。而且這三種領域感形式過度表達的話，會暴露人的不同心態。


    # 1. 獨處


    就是一個人在自己的領域內，希望把自己與其他人分隔開，或者避免被他人觀察到的狀態。這種狀態如果過度表達的話，就反映了此人內心的不安全感，也證明他有一定的社交恐懼。


    # 2. 親密


    比如他在和親人、朋友、配偶相處時，不願受到外界干擾。這其實是一種占有慾的典型表現。


    # 3. 匿名


    這種表達方式很特殊。在生活中，有些人喜歡隱姓埋名或喬裝打扮，即使在公眾場合仍然不被別人認出的狀態，這表現出一個人內心的不安全感。


    如果一個人在自己的領域中，比如一個老闆在自己的公司裡，他的一舉一動似乎都和平時不一樣，這些動作其實暴露了他的某些心理。現在我們試舉幾例：


    + ① 老闆在說話的時候根本不看對方，目光渙散或是瞧著別的地方。這是一種比較壞的徵兆，意味著老闆對對方的能力很輕視，或是並不看重這個人。

    ② 在自己領域內，支配欲比較強的老闆喜歡從頭看到腳，由上至下地看人。這種人為人也很自負，他的權威不容侵犯。

    ③ 他的眼睛一直盯著對方，這意味著他對對方還不夠瞭解，或是對對方剛才說的話並沒有完全理解。

    ④ 他目光尖銳，臉部表情變化無常。這是在暗示對方：「你小子要對我說實話，你的謊言我很容易就戳穿了！」

    ⑤ 他雙掌合十，從上往下壓，身體發揮平衡作用，這證明他情緒比較平靜。

    ⑥ 他雙手叉腰，肘部向外撐，這表明他要做決定了，而且是不容置疑的決定。一般來講，他們在遇到具體的權益問題時，才會不自覺地做出這樣的姿勢。


    # 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    ⑦ 他坐在椅子上，將身體往後靠，雙手放到腦後，雙肘向外撐開，這固然說明他此時很輕鬆，但可能也是自負的意思。


    ⑧ 在談話中他用食指指指點點。這是個極端不好的信號，這意味著他有極強的好勝心和鬥爭慾望。


    ⑨ 雙手放在身後互握，也是一種優越感的表現。


    ⑩ 他拍拍下屬的肩膀，這意味對下屬的承認和賞識，但只有從側面拍才表示真正承認和賞識。如果從正面或上面拍，則表示小看下屬或顯示權力。


    ⑪ 他們手指併攏，雙手構成金字塔形狀，指尖對著前方，則表示他不同意。


    ⑫ 當他把手握成拳頭的時候，遠不僅僅是代表他要保持自己的強勢，也表示要維護自己的觀點。如果用拳頭敲桌子，則意味著已經聽不進任何意見了。


    這些都是一個人在自己領域內經常會出現的一些小破綻。正因為領域感能夠表現出一個人的許多心理狀態，所以我們若想藏心，就必須要學會克制自己的領域感，以避免被人看透自己。


    以上，我們用兩篇的篇幅，為大家解釋了關於領域感的一些知識。接下來，我們會全面闡述領域感所導致的兩種負面心態——占有慾和控制慾。


    # 克制占有欲


    極強的領域感，最終會轉變為強烈的占有欲。占有欲是一種普遍的心態，我們不能說占有欲一定是貶義的，但可以確定的事，當一個人的占有欲變得盲目的時候，就會超出理智的範圍，成為一種有害的心理。而由領域感所導致的占有欲，則更容易轉變成這種負面心態。


    在生活中，我們經常可以看到，那些占有欲強的人，因為自己不擇手段的占有，導致自己陷入困境甚至身敗名裂。


    2001 年，FBI 決心將一個為害多年的黑社會組織剿滅。經過一番調查之後，FBI 發現這個黑道老大非常狡猾。他投資房地產、旅遊業，從表面上看，他所做的一切，都披著合法的外衣。FBI
    雖然明知道他在祕密從事犯罪行為，但是苦於沒有證據，無法對他下手。為了引蛇出洞，FBI 決定給他設下一個圈套。


    當時，在這個黑社會組織的控制範圍內有一家新建成的大飯店。這家飯店極為豪華，而且位於黃金地段，前景可觀。FBI 知道，這位黑道老大不允許自己的勢力範圍內有強力的競爭對手，他一定會想辦法得到這家飯店。所以
    FBI 故意派出自己人去和這個老大競爭這家飯店的所有權。


    黑道老大很快就知道，有人想和他搶購這家飯店。臥榻之側豈容他人鼾睡？


    黑道老大決心出更高的價格買下這家飯店。但是他發現，無論自己出多高的價格，對方總是要比自己略高一籌。黑道老大意識到，「對方」財大氣粗，而且勢在必得。如果按照一般情況來講，他完全可以放棄和對方的競爭，但是一想到自己的勢力範圍內有別人要和自己搶風頭，他就有抑制不住的衝動。所以他決心採取非常手段來獲得這家飯店。


    當 FBI 將這名黑道老大派出的殺手逮捕，並且順藤摸瓜找到他的時候，黑道老大才知道自己上當了，只得伏法。


    在這個案例中，黑道老大之所以露出馬腳，就是因為他對自己「領域」內的事物表現出了過強的占有慾。


    引用這個案例，只是想說明，占有慾會出賣一個人的內心，甚至會釀人偏離自己的人生觀和道德觀。


    事實上，占有慾過強，不僅容易讓人迷失自己，而且還會被人拿來利用，反而讓人失去更多。


    1985 年 9 月，賈伯斯離開蘋果公司。他用變賣蘋果股票的錢重新開了一家公司，叫 NeXT。很明顯，賈伯斯希望新公司能延續自己「贏」的哲學。


    在 NeXT，賈伯斯變本加厲的奉行自己在蘋果的那一套：贏、贏、贏，什麼都要贏！


    在「NeXT Computer」( NeXT 推出的第一個產品 ) 上，賈伯斯要求用最好的原料、最高規格的配置、最好的工藝，生產最好的產品、賣最高的價錢、占領最大的市場。最誇張、甚至荒唐的是，賈伯斯在電腦電路板設計上，居然要求布局要有藝術感——他要在各方面都打敗當時
    PC 市場的老大和被他搞得半死不活的老東家蘋果。


    結果，占有慾過強反而成為賈伯斯前進路上的一个重大障礙。他想讓自己的產品占盡先機，占盡一切有利條件，儘管他也成功找到幾個窮大頭成為自己的客戶，可是在近十年的時間裡，NeXT
    產品的總銷量不超過五萬台。


    太尷尬了！有夠丟人！如果說當年的蘋果是賈伯斯創造的 IT 界神話，那麼 NeXT 就是賈伯斯製造的 IT 界笑話。


    賈伯斯開始反思，到底是哪兒錯了。最後，賈伯斯想通了，癥結就出在了「占有慾」上面：自己什麼都想要，反倒成了徹頭徹尾的輸家。


    賈伯斯從執迷於「贏」的哲學到頓悟，這個過程花了多長時間？十年！這時的賈伯斯已經不是當年那個帥小子，而是臉上爬出皺紋的小老頭了。


    1997 年 7 月，賈伯斯重回已經是滿目瘡痍的蘋果。當時賈伯斯做了一件大事，就是和微軟的比爾·蓋茲和解。


    當初，比爾·蓋茲的微軟只不過是抱蘋果大腿的一個小弟。但是，蘋果的盛氣凌人把微軟一步步地推向了自己的競爭對手 IBM 那裡，並和 IBM 共同狙擊蘋果，從此蘋果一蹶不振。可以說，微軟算得上是蘋果的老窩家。而且在賈伯斯的眼裡，比爾·蓋茲就是一個賊，因為微軟賴以起家的視窗系統實際上是抄襲蘋果的麥金塔圖形介面。


    但是，賈伯斯和比爾·蓋茲握手、言和了。這標誌著賈伯斯「贏」的哲學澈底被遺棄了。


    現在，賈伯斯的蘋果是什麼？是大家有錢一起賺。這就是個人根除占有慾的好處。


    當然，我們之所以在這樣一本介紹「藏心術」的書中，提及有關占有慾的問題，除了因為占有慾往往讓我們走向失敗，更重要的是，在人際交往中，占有慾也會時常表現出來：有些人經常想將另一些人「占為已有」。


    這類人對人的占有慾，聽起來似乎不可思議，但是在現實生活中，我們經常可以看到由占有慾產生出企圖控制和占有對方的行為，這在愛情、親情中最為常見。而人和人之間的占有慾，往往是導致感情分裂的重要原因。


    在人際交往時，人需要克制自己不理智的占有慾。否則，你的自私和強勢將被別人看在眼裡、記在心裡，成為別人防備你的理由。


    關於占有慾，我們只能說：人不能完全沒有絲毫占有慾，但是也不能讓不理智的占有慾占据我們的內心。


    最後要說的是，藏心的關鍵，有時候不僅僅是隱藏，更重要的是克制。我們的負面情緒和負面特質，都需要我們去克制。這才是藏心術的全部。


