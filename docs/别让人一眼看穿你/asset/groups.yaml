    # STEP 4


    # 自主


    不盲目，養成獨立思考的習慣


    我們都曾有當英雄的夢想，但是，命運讓我們做了一個平凡人。因此，我們漸漸學會了服從。而現在，我們將告訴大家一個真理 —— 你有權利做出自己的選擇。


    因為我們太過服從，所以別人能輕易瞭解我們下一步要做什麼；因為我們太過服從，所以我們暴露了自己的內心。我們將在接下來的文章裡告訴大家，如何做一個自主、自立、自動的人。


