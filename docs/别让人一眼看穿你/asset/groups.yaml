    在歷史的長河中，用畢生精力挖一口深井的人屢見不鮮：曹雪芹傾注畢生心血，終留傳世之作《紅樓夢》；魯迅先生棄醫從文，一生以文字作為和敵人對抗的匕首，針鋒相對；錢鐘書一生治學，終成當代華人少有的學貫中西的大家。


    凡是有所作為的人，往往都是全神貫注、傾盡身心去追求既定的理想。淺嘗輒止，是挖不成一口深井的。這些道理誰都明白，更重要的只有少數人很快拿出了行動。所以，就從今天開始吧，拿出必要的行動，哪怕只是一小步。


    其實，要想成功，就必須要專注而不放棄。很多人非常聰明，但是沒有耐性，也難以成功。可是有一些看起來不太聰明的，卻因為能夠堅持，最後獲得了成功。


    生活中有許多看起來匆匆忙忙，一日不得閒的大忙人，他們整天沒有休息一刻，但卻總也見不到任何顯著的成效。歸根究底，就是因為他們太容易放棄自己的底線和原則，做事都是淺嘗輒止，剛剛上手去做這件事，不久就被另外一件事吸引了注意力。到頭來只能像抓蝴蝶的小貓，仍然兩手空空。


    淺嘗輒止的人可能一輩子都活在庸庸碌碌的繁忙中，這是因為他們沒有堅持、沒有耐性，這無疑是在「戲弄」自己的生命。人生極其短暫，我們每個人的精力與時間都是很有限的。我們應該緊緊把握住自己獨有的優勢和志在必得的方向，憑藉永不放棄的努力，執著而專注地做下去，這樣才能有所作為。


    ## Step 4 自主 / 不盲目，養成獨立思考的習慣


    美國有一位貧困潦倒的年輕人，他窮得連一件比較好的衣服都買不起，然而在他心中，始終有著一個堅定的夢想：做演員、拍電影、當明星。


    當時的好萊塢有五百多家電影公司，他根據自己計劃好的路線與排列好的名單順序，帶著自己寫的劇本，到這些公司去拜訪他們。但第一輪拜訪，五百家電影公司居然沒有一家願意聘用他。


    百分之百的拒絕率，並沒有讓這位年輕人灰心。從最後一家拒絕他的電影公司出來以後，他重新回頭從第一家開始，繼續他第二輪的拜訪與自我推薦。


    但不幸的是，在第二輪拜訪中，年輕人仍然遭遇了五百次拒絕。


    接下來，年輕人又孜孜不倦地開始了第三輪的拜訪，結果仍與第二輪相同。


    這位年輕人咬牙開始他的第四輪行動。這回終於收到了肯定的效果，當年輕人拜訪完第三百四十九家後，第三百五十家電影公司決定先把他的劇本拿來看一下。


    就在那一刻，年輕人的命運開始改變了。幾天後，他獲得通知，電影公司請他前去詳細商談。就在這次談話結束之後，這家公司終於決定投資開拍這部電影，並請這位年輕人擔任男主角。


    年輕人寫的這部電影名叫《洛基》(Rocky, 1976)，而他就是席維斯·史特龍。現在所有人都知道《洛基》這部電影是好萊塢歷史上最優秀的電影之一，而史特龍則是整個好萊塢最知名的巨星之一。


    那些出類拔萃的人，無論身處何種境地都不會輕言放棄，不會向旁人的非議或是命運的坎坷低頭；或者忍受不幸，或者戰勝它，每個人的體內都蘊藏著驚人的韌性，只要把它挖掘並充分發揮出來，那麼，在前進的道路上就沒有克服不了的障礙和度不過去的難關。


    ## 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    ## Ⅰ 自卑心的起因


    有一句真理：人應該杜絕盲目的從眾反應，應該有自己的主見。為了能夠讓大家徹底克服服從心理，我們現在要敘述一下從眾反應最根本的一個心理因素 —— 自卑。


    我們為了什麼懷疑自己而服從大多數人？我們為什麼在權威面前失去了主見？其實都是因為我們有自卑心理。


    所謂自卑心理，一般是由於一個人存在生理缺陷或某些心理缺陷而產生的輕視自己的心理，認為自己不如別人。正因如此，人才會盲目服從別人。


    多年前，FBI 曾經接手過一起殺人案。死者的名字叫做霍夫曼（Hofman），二十四歲，大學生。他在自己寢室裡中毒而死。當時，FBI 的首要任務就是要查明霍夫曼到底是自殺還是他殺。


    那些認識霍夫曼的人說：他很有人緣，也沒有什麼仇敵。想不到有誰會對這樣一個人下毒手。


    FBI 探員在調查線索時，找到了霍夫曼的一個日記本，上面寫道：儘管我的名字中只有一個「F」，但是老師卻總是把它拼成兩個「F」，我沒有辦法鼓起勇氣去糾正他，只能讓他在我上學期間一直把它拼成兩個「F」。


    經過一番調查，FBI 探員進一步發現，霍夫曼是個敏感而害羞的男孩，因為長得醜、鼻子長，經常遭到嘲笑。


    由此，FBI 探員得出了 一個結論：霍夫曼是一個嚴重自卑的人，所以他表現出如此盲目的服從心態（任由老師叫錯名字）。


    對於這樣的人來講，自殺的可能性要大一些。


    接下來，FBI 探員就從自殺的角度去追查霍夫曼的死因。不久後，FBI 終於證實：霍夫曼確實是自殺身亡的。


    從這個案例可以看出，自卑對一個人有非常大的負面影響。如果我們在做某事時，因為各方面的原因沒能取得成功，內心就會變得低落傷感。如果失敗的次數多了，就非常可能產生自卑。


    自卑會導致孤立、離群、喪失自信心、缺乏榮譽感等。一個有自卑感的人，通常會顯得憂鬱、悲觀、孤僻。當自卑到了非常嚴重的地步時，人又會變得易怒、自欺欺人、敵視別人。但不管自卑是以哪種方式表達，都是很容易被他人所觀察到的。所以，自卑的人是很難藏心的。


    如果想要克服自卑，就首先要搞清楚自卑的起因。通常情況下，人的自卑是由以下幾種情形造成的：


    ### 1. 首先是自我認識不足


    有些人容易過分低估自己。這是因為，人們總是根據他人對自己的評價，或是自己與別人的對比來認識自己。生活中有很多人，總是習慣於拿自己的短處去和別人的長處相比較，越比越覺得自己不如別人，日積月累，自卑就產生了。


    ### 2. 其次是因為消極的自我暗示


    我們在生活中會遇到各種問題，有些人在遇到問題之後，會想：「我一定有辦法搞定。」而有些人則不這樣想，他們會覺得自己沒有能力處理眼前的難題。這樣消極的自我暗示，會降低一個人的自信心，加重人的心理負擔。由於心理負擔大，所以他們在處理問題的時候更是難以發揮出自己的能力，所以經常會失敗。由此，在這些人身上會產生這樣一個現象：越是怕失敗，越容易失敗；越是失敗，心裡越沒底，越害怕。久而久之，他們的自卑感就產生了。


    ### 3. 再次，有些人會因為遭受挫折而產生自卑


    在現實生活中，有些人是越挫越勇，但是有些人則會因為暫時的失敗而一蹶不振。第二種人經常會因為失敗而產生自卑


    ### 4. 最後一種造成自卑的因素就是生理方面的不足。


    如身材矮小、相貌不理想，都會讓有些人感到自卑。


    以上是自卑心理的四種起源。據研究自卑心理，我們發現一個人在有了自卑心理之後，他心中的懦弱、恐懼等負面心態會被無限放大。這些心態都是導致一個人無法「藏心」的重要因素。因此，一個自卑感嚴重的人，肯定不善於藏心。


    ## 澈底消除自卑感


    心中有自卑，人就不能做真正的自己，會跟隨別人的意願行動，而且內心始終充滿痛苦和消極。


    本篇中，談到自卑的時候，我們不能再想著「掩飾」了，因為自卑感與領域感、恐懼感等負面心態不同，這是一種對於我們沒有任何好處的心態。而且，光靠掩飾，是藏不住自卑感的。更多時候，一個人越是想掩飾自卑，越是容易暴露自己的內心。有句話說：「看一個人自卑什麼，就看他掩飾什麼。」這句話就說出了自卑的本質。


    FBI 第一任局長胡佛，是個非常有爭議的人物。


    1955 年 9 月，《花花公子》雜誌上刊登了一篇探員上太空偵察的科幻故事，裡面將 FBI 局長描繪成一個半男半女的人物。胡佛在看到這個故事之後，勃然大怒：「這是對我們的污蔑，他們就是想抹黑我們
    FBI 的形象。我一定要給他好看！」


    胡佛叫來祕密員警部隊的探員對他們說：「你們要對《花花公子》進行仔細審讀，每期都不能放過。如果發現雜誌內容有侮辱、嘲弄 FBI 以及我本人的地方，你們一定要及時向我彙報。」


    祕密員警一下子成了《花花公子》的忠實讀者，他們每一期都看。皇天不負有心人，終於在 1963 年 2 月，發現了雜誌主編海夫納寫的一篇批評胡佛反情色的文章。祕密員警立刻把這個消息轉達到了胡佛那裡。


    胡佛聽了這個消息，十分氣憤，他是一個從不容許別人得罪的人，於是他立刻下令探員去調查海夫納的背景。


    許多人不理解，就因為一篇小小的文章，胡佛就對一個雜誌這麼不滿，似乎是完全沒有理由的。直到胡佛死後，他是一位同性戀者的祕密才開始公諸於世。這時，人們才知道，胡佛當年之所以對一個雜誌大動干戈，就是因為他內心因自己的性取向而感到自卑，而且又怕人識破這一切，所以才會那樣暴怒。


    這個故事說明了一個真理，自卑不是你身居高位或是刻意隱瞞就藏得住的。所以，「藏心術」並不是教會大家如何藏住自己的自卑心理。關於自卑，我們只能控制和改正。若想趕走自己的自卑心態，我們要做到以下幾點：


    ### 1. 首先要客觀地認識自己，提高自我評價


    人要善於挖掘自己的優點和長處，要學會肯定自己的成果。客觀地評價自己，其實和客觀地評價別人一樣重要。


    我們不能否認自己的缺點和不足，但是更不能無視自己的優點和長處。你如果用善於發現的眼睛去看自己，你就會發現，其實你的身上有很多過人之處，完全沒有必要感到自卑。話說回來，即便你有這樣或那樣的缺點，但是人無完人，誰又能完美無缺呢？所以，你依舊沒有自卑的理由。


    ### 2. 人應該進行積極的自我暗示，自我鼓勵


    無論在任何時候，你都該告訴自己：「我可以，我行！」而不是一碰到一點問題就馬上逃避、退步。只有這樣，你才能走出自卑心理的惡性循環。


    ### 3. 擺脫自卑心理，就應該學會積極地與他人交往


    透過積極地與他人交往，就會感受他人的喜怒哀樂，心胸也會變得開闊。可以向他人傾吐心聲，並瞭解他人的長短處，在比較中正確認識自己。尤其是積極地加強和性格開朗、樂觀、豁達、尊重人、關心人的人交往，對於克服社交自卑感更為有益處。


    你有過成功的過去，這足以證明你的能力不比別人差。只要你正確地認識自己，坦誠地與老師和同學們交朋友，你一定能趕走自己的自卑。


    ## 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    ## Ⅰ 自信要不卑不亢


    「上交不諂，下交不瀆」，是孔子提出的一個重要的待人處世原則，意思是說，與高於自己的人交往，不要低聲下氣；與低於自己的人交往，不要高傲怠慢。


    在孔子這條準則中，「上交不諂」其實說的就是克制人的服從行為。但是，這條準則雖然看起來容易做到，實際上卻不是那麼簡單的事情。


    一次，蘇軾到莫干山遊玩，看到山上有一間廟宇，他想進去歇一會兒。


    老道當時看蘇軾穿的衣服很樸實，看起來也沒有什麼過人之處，就非常輕慢地指了指椅子說：「坐。」然後吩咐道童：「茶。」


    等到兩個人交談了一番之後，老道發現蘇軾談吐不凡，恐怕不是一般人，就把他引至大殿，有點客氣地說：「請坐。」同時向道童說：「敬茶。」


    到最後，他終於發現眼前的這個人就是大文豪蘇軾，竟慌忙打躬作揖，把他讓進客廳，口中連連道：「請上坐。」然後吩咐道童說：「敬香茶。」


    臨別時，老道請蘇軾題字留念，蘇軾便開了個小玩笑，寫下「坐，請坐，請上坐。茶，敬茶，敬香茶」的對聯以為諷刺，弄得這位老道很不好意思。


    故事中的這個老道，其實就是典型的從眾反應受害者。他之前沒有見過蘇軾，雖然見到蘇軾表現得比較冷淡才是應有的狀態；可是他卻因為別人都尊重蘇軾，自己便也對蘇軾尊重有加，這不是一件壞事，但確實是從眾反應的表現。


    同時，我們還需要注意一個細節，那就是老道在知道蘇軾的真實身分之後，做了一個動作——「打躬作揖」。在心理學上，這個動作意味著示弱和服從。低頭聳肩，這樣的動作在古裝劇中我們經常會看到，臣子面見皇上時經常低著頭、哈著腰。而今在職場，下屬靠近自己的上司時，往往也會採取這種姿勢，這雖不如古裝戲那麼明顯，但仔細觀察還是能看得到。不難判斷，在這種情況下，做出這種動作是因為身分、地位與權力不如對方。


    如果是身分、地位差不多時，做出這種動作，則意味著此人內心缺乏自信，並且不想引人注意。比如，當看到一群不太熟悉的同事在一邊談話，從他們旁邊經過的時候，我們都會怎樣做呢？


    自信且愛表現的人會昂首挺胸地走過去，希望對方注意到他。如果對方沒有留意到，他也會主動打招呼；而不太自信的人則會不自主地縮緊脖子，努力讓自己顯得更弱小和不太引人注意，期望對方不要注意到他。


    凱特有個十七歲的兒子名叫詹姆斯，是一個高中二年級的學生。詹姆斯身高一百七十八公分，身材魁梧強壯，外人都覺得他是個帥氣十足的男子漢。但凱特在跟詹姆斯的老師談話時卻說，兒子外表看上去高大威猛，但實際上是個羞澀的孩子，希望老師能配合自己幫助兒子樹立信心。


    「嘎，您為什麼這麼說呢？詹姆斯看起來很不錯啊。」老師一臉驚訝地望著凱特。


    「不是這樣的，這都是假象。住我們隔壁的鄰居是個心理學博士，好幾次我跟鄰居聊天，詹姆斯從旁邊經過都低著頭、聳著肩，不說一句話。鄰居問我詹姆斯是不是缺少自信，剛開始我還不以為意，後來慢慢觀察，我覺得鄰居說得沒錯。他外表很強壯，內心卻很自卑，希望老師能幫我讓孩子樹立自信心。」凱特語重心長地告訴老師。


    案例中的這個男孩，就是因為他沒有自信的一個動作，讓心理學專家看出了他的內心。事實上，低頭聳肩這個動作，非常容易暴露一個人的內心。


    在會議上，不想發言的人會在老闆用視線巡查時低下頭，為的是避免和他視線相交而引起他的注意；在生活中，相信我們大部分人都不願意在別人面前表現得弱勢——那麼，你千萬要注意自己的這個動作，否則，很容易讓人看穿你心中的沒有自信。


    此外，低頭聳肩這一行為，也有示弱、潛意識中乞求憐憫、尋求自我保護的意思。


    某公司老闆指著報表上的一個數字問會計：「妳覺得這個月的支出對嗎？」會計看了看，發現自己犯了一個根本的計算錯誤。老闆威嚴的神情讓她不由得聳起了雙肩，把頭深埋下去。她的這副姿勢讓老闆心軟了，於是說：「下次注意。」


