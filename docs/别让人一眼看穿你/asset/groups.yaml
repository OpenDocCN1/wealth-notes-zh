    # 認識「領域」


    首先，我們來談一談什麼是「領域」。

    所謂領域，其實是一個界限，在這個界限中，人擁有絕對的主動權，比如「家」。每個人在自己家裡都能「為所欲為」，這是因為，「家」就是每個人所擁有的「領域」。

    社會心理學家阿特曼（Irwin Altman, 1930.7.16）認為，領域是彼此排他的、獨占的使用區域。這也就是說，一個人對自己的領域有天生的控制慾和占有慾，不願輕易與他人共用。在有人未經同意就闖入到我們家裡的時候，我們會產生敵意，就證明了這一點。

    領域有三個層次：主要領域、次級領域和公共領域。


    主要領域

    被個人或是集體長期占有的一个區域，而且被所有人共同確認，這個領域是使用者生活的中心，比如我們的家、老闆的私人辦公室


    次級領域

    不被人長期占有的地方，比如酒吧，教室裡的座位等。


    公共領域

    指一切公共場所，如電話亭、公車。


    領域感最終會上升為心理問題，一個人如果能夠擁有一個可以調節私密性和自由控制的地方，那麼對身體健康是非常有好處的；如果一個人發現自己沒有能力維護自己的領域時，將會產生'
  - '[PAGE 147]


    非常嚴重的心理問題。


    像學者所說，那些領域感強的人，對於別人入侵自己的領域是非常敏感的。在生活中，某些人可能會對門鈴聲非常敏感，這就是領域感的一種展現。


    人人都有領域感，但是如果領域感過於強烈，那麼就會使人的占有慾變得非常強，這就是我們所說的占有慾。


    一個領域感非常強的人，發現自己的個人空間不能滿足自己的需求時，他的占有慾會被激起，這時人會變得貪婪、不知滿足。這無疑會成為一個人心理上的弱點，非常容易被他人看穿。


    義大利藝術家米開朗基羅的雕刻作品「大衛像」是他最為成功的作品之一。當大衛像剛雕刻好的時候，一個負責審查藝術作品的官員表示對這座雕像很不滿意。


    米開朗基羅問這個官員：「您看我的雕像有什麼地方不合適嗎？」


    「嗯，依我看啊，這個雕像，從整體上看，就是鼻子不好。」這個官員明顯不懂雕塑，但為了維護自己的「官威」，還是無中生有的找麻煩。


    米開朗基羅明知道官員的所謂「修改意見」是不可行的，但還是一本正經地說：「是嗎？」然後還站在雕像前看了一下，大叫一聲：「可不是嗎？鼻子是大了一些，我馬上改。」說著就拿起工具爬上架子，叮叮噹噹地開始修改。


    隨著米開朗基羅的鑿刀，掉了許多大理石粉，那官員只得躲開。過了一會兒，米開朗基羅「修」好了，他爬下架子，請那位官員再去驗收：「您看這回怎麼樣？」官員看了一下，非常高興地說：「這樣就好多了嘛！」'
