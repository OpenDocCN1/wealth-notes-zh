    # 別讓人一眼看穿你

    讀心與藏心的攻防情報


    第二種就是懂得克制自己。《荀子．儒效》：「志忍私，然後能公；行忍情性，然後能修。」


    「小不忍則亂大謀」，這句話沒錯。「負荊請罪」的故事被傳為千古美談：藺相如身為上卿，位高權重，卻不與廉頗計較，處處禮讓，何以如此？為國家社稷也。將相和，則全國團結；國無嫌隙，則敵必不敢乘。藺相如的忍讓，正是為了國家安定之「大謀」。忍讓是一種眼光和度量，可以克己忍讓的人，是雄才大略的表現。


    古人曾云：「忍為眾妙之門」。事實上，對於人生中的許多不幸和災難而言，忍是唯一的辦法。「唯有埋頭，乃能出頭。」人生就好像一粒種子，你要它長大，就必須忍受在黑暗泥土中掙扎的這個過程。不肯忍受埋藏的苦悶而暴露在空氣中，短時間之後，就永遠失去了孕育新生的機會。


    一個人想要有忍耐力，就要清楚地知道自己到底想要什麼，到底渴望什麼。這是開發忍耐力最重要的鑰匙。沒有明確的目標就像大海裡的一片樹葉，隨波逐流，永遠也達不到彼岸。


    那些成功的人之所以能成功，並不是他們有與生俱來的天分，而是因為他們有志氣，更重要的是能夠調整自己的心態，在沉穩中磨練身心。無論何時，遇到怎樣的困難，成功者都能為了實現某種目標而採取「磨」的手段，他們具備超凡的忍耐力，總能坦然面對生活中的各種磨難，最終走出困境。


    歌德有天到公園裡散步，迎面走來了一個評論家。這個評論家對歌德的作品很不以為然，今天在公園偶然相遇，他很想給歌德一個下馬威。


    當時，這個評論家站在歌德面前，高聲說：「我從來不給優'
