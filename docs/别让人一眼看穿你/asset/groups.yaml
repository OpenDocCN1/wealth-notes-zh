    在這個案例中，年輕的 FBI 探員正是利用了犯罪組織老大的領域感，從而判斷出他真正的家。由此可見，領域感和占有慾的過度表達，會暴露一個人的內心。


    其實，在生活中，每個人的領域感都會透過種種方式表達出來。領域感可分為三種形式：獨處、親密、匿名，它們分別會在不同時間、不同情境出現。而且這三種領域感形式過度表達的話，會暴露人的不同心態。


    # 1. 獨處


    就是一個人在自己的領域內，希望把自己與其他人分隔開，或者避免被他人觀察到的狀態。這種狀態如果過度表達的話，就反映了此人內心的不安全感，也證明他有一定的社交恐懼。'
