    ## Step 3 放下 / 不煩躁，克制得失心


    人首先應該給自己一個定位，自己到這個世界上來究竟是幹什麼的，必須有個十分清晰的理解。離開了這個理解，人就會迷茫，就會失去前進的方向，就會在一個個十字路口徘徊，這樣的人生是沒有意義的。只有當你對自己有足夠的瞭解、知道了自己的長處與短處的時候，你才會懂得揚長避短，就不會用自己的短處去和人家的長處相撞擊，也不會為本來就不可能成功的事情發愁、怨恨自己，而這一切的修煉都離不開淡定的處事原則。


    有自我定位的人，是最難能可貴的。人需要有自知之明，自知而自立。人人都希望進步，成就一番事業。沒有自我定位，就難於明是非、辯立場、分得失，就會身在錯中不知錯，身在弱中不知弱，就會安於現狀、庸庸碌碌、渾渾噩噩而不思進取、遊戲人生。反之，一旦認識了自己，有了準確的定位，便能瞄準自身的薄弱環節，奮發改進，有所作為。


    自我認識還有一個好處，就是能夠幫助自己設身處地地為別 人著想。因為我們有足夠的自我認識，所以能這樣思考：如果我是他，在他的處境中會有什麼表現，以此來檢查自己的感情和行為，琢磨自己應該如何表現。


    我們假定自己站在旁觀者的角度來看待自己的行為，並且盡力想像這種行為會對我們產生什麼影響。某種程度上這是我們能用別人的眼光來檢查自己的行為是否合適的唯一途徑。如果這種觀察讓我們感到高興，我們可以毫不在乎別人的讚揚，不把世人的指責放在眼裡；無論受到怎樣的誤解或扭曲，我們都自信理應得到別人的稱讚。


    ## 怨恨是心靈毒藥


    在遭到失敗之後，我們會本能的給自己找一些「藉口」，拿社會、制度、生活、機會、運氣、老闆、配偶當作出氣筒。


    如果一個人被這種心態所控制，就會對別人的成功和幸福心存反感，而認為生活和命運總是對自己不公。這樣的人，特別容易生活在怨恨和自暴自棄中。


    怨恨是人的一種心理嘗試，是個人企圖把自己的失敗解釋成不公正待遇，從而讓自己心安理得。如果想要用怨恨去「治療」失敗後的低落心情，就像是給一個受了輕傷的人注射毒品，雖然能暫時消解疼痛，但是帶來的副作用要比眼前的病情更嚴重。


    怨恨是一種對心靈的致命性「毒藥」，它斷絕了你獲得快樂的機會。而且，怨恨本身需要消耗龐大的精神。失敗之後，與其花費精力去怨恨，還不如把那些精力用在東山再起上，說不定你就能夠獲得成功。


    由於有前科者再犯率越來越高，所以美國政府委派 FBI 相關專家去探求其中的原因。


    經過一番調查，專家發現，那些再犯人，心中往往充滿怨恨。當一個人被關進監獄之後，如果他的怨恨情緒沒有一點點改變，那麼這個人再犯罪的機率就非常高，他們通常都會再次把自己送進監獄；而那些能夠自我反省、沒有怨恨情緒的人，在出獄後反倒更有自制力，更能在事業上有所成就。


    最後，專家在提交的報告上寫了這樣一段話：「任何允許怨恨情緒控制自己思想的人，都會將自己的潛力鎖在一個自己製造的監獄裡。判處絞刑的是他自己，擔任毫無同情心的陪審員是他自己，擔當監獄獄卒的還是他自己。所以，消除罪犯的怨恨，是杜絕再次犯罪的最好方法。


    怨恨是一條通往失敗的道路，許多人因為怨恨，所以永遠認識不到自己所犯的錯誤。而習慣性怨恨，特別容易導致自憐。自憐更是一種心靈上的毒藥。當一個人的怨恨根深蒂固的時候，就再也離不開它了。所以我們才把怨恨比作是「毒品」。有人說，有怨恨之心的人，只有在自己處於悲慘境地時才會感覺良好。


    怨恨和自憐的情緒還會帶來一種認為自己無能、卑微的自我意象。有了它，你會把自己描繪成一個可憐蟲、一個犧牲品，而這種人註定不會幸福。


    怨恨真正的罪魁禍首，不是別的人、別的事或別的環境，而是你自己。如果堅信怨恨和自憐不是通往幸福和成功的大道，而是通往失敗和不幸的道路，你就能控制它。


    泰國有個企業家把所有的積蓄和銀行貸款全部投資在曼谷郊外一個擁有高爾夫球場的十五幢別墅裡。這本來是一筆好買賣，如果一切順利的話，這位企業家可能成為全泰國最有錢的富豪之一。然而世事無常，工程才剛完工，就遇上亞洲金融風暴，那些別墅一間都賣不出去。企業家一夜之間由極盛走向了極衰。


    企業家的情緒從此低落。他時常會想起曾經的光輝歲月，也常感嘆：「如果不是天災人禍，現在也許是全泰國最有錢的人！」他喪失了鬥志，走向了沉淪。日子在壓抑和絕望中一天天度過。


    ## 別讓人一眼看穿你

    觀心與藏心的攻防智慧


    有一天，他的妻子給他做好三明治，叫他來吃早餐。這位企業家從前錦衣玉食，小小的三明治自然是不放在眼裡。


    他很隨意地拿起一塊三明治，放到嘴裡。突然，他覺得妻子做三明治的手藝著實了得，非常好吃。這位企業家感到非常高興，就對坐在一旁的妻子說：「親愛的，我從來沒想到，妳的廚藝這麼好，能娶到妳這麼一個妻子，也算我不枉此生了。」


    企業家沒想到，妻子聽完這話突然間淚流滿面，哽咽著說：「從前你總是忙來忙去，很少在家裡吃飯。即使在家，也是傭人下廚。現在我能親手給你做三明治，你還這麼喜歡，真好！」


    妻子的話就像扔在企業家心湖裡的一塊巨石，激起了層層波動，他突然間醒悟：「我為什麼天天如此消沉？就算我失去了財富和地位，失去了成為泰國首富的機會，我還有這麼好的妻子，還能吃到如此美味的三明治，我有什麼理由不幸福？」


    看著旁邊因為自己一句誇獎便無比幸福的妻子，這個企業家突然感覺到，原來幸福如此簡單，它不在未來，也不在過去，就在眼前這點滴流逝的時光裡。


    一瞬間，企業家釋然了，他覺得自己沉迷於追憶過去和憧憬未來是一件非常愚蠢的事情。現在的自己，所擁有的東西遠遠要比曾經失去的多，自己依然是幸福的。


    人要是能把心結解開，就沒有什麼能夠阻擋他前進的腳步了。這個企業家向妻子提議：我們就開一家賣三明治的小店，從頭開始。


    他的妻子非常支持企業家的想法，還建議丈夫要親自到街上叫賣。這個當初一呼百應的企業家非常快樂地答應這份「差事」。

    在開了自己的三明治小店之後，企業家賺到了不少錢。雖然和從前比的話，這些錢不算什麼，但是他依舊每天快樂的和妻子一起經營著自己的事業。


    人必須要克制自己的怨恨之心，否則就不可能成為一個自力更生、獨立性強、能夠自我決定的人。


    一個成功的人，他有主動追求的願望，他明白，這世界上沒人欠自己什麼；但是怨恨之心卻讓人覺得這世界對自己不公平，他們有各種理由說明這世界的不公平。


    也許這些人說的也有些道理，但是要知道：世上沒有絕對的公平，人只有透過自身的努力去獲得公平。從出生時起，有些人就在充滿貧困的地方不公平地開始了艱難的生活，而另一些人則生活在繁華的都市；有些人會到某所年久失修的學校上學，而另一些人則到擁有各種現代化設施的學校就讀。這都是事實，不容改變。


    所以，人必須需要接納自己，自強不息，而不是把怨恨寫在臉上，永遠做一個失敗者。


    ## 煩惱是自縛手腳


    人的本性是天真自然，隨心所欲。但是，在現實生活中，我們卻常常把自己束縛在各種框架之中，金錢、地位、名譽……都可能將我們束縛。我們常常「人在江湖，身不由己」，因而產生了無端的煩惱。


    人生最為寶貴的東西就是自由，但是如果成敗之心太強，就會將自己放置到一個「囚籠」裡。


    FBI 探員凱特年輕又有才能，1994 年，他被派往阿富汗執行任務。臨行前，他的上級暗示他：如果他在未來幾年裡表現優異的話，會給他一個很好的職位。


    為了能夠獲得晉升，凱特開始兢兢業業的工作，將自己的一切精力都用在了工作上面。但是，他發現，由於天天想著晉升，他開始變得躁動不安。這種心理非但讓他難以安寧，更讓他的工作效率變得十分低下。


    過了一段時間，凱特發現自己已經沒有辦法用正常的心態面對自己的工作和生活了。


    這時候，妻子對凱特說：「人生的第一目的並非獲得多麼驕人的成就，而是能夠自在的生活。你現在一心想著晉升，落入到如此的苦惱之中，即便獲得了晉升又有什麼意義呢？」


    凱特聽後恍然大悟，他開始放下成敗之心，以平常心去面對自己的工作。果然，很快他就走出了心理的泥沼，重新做回了自己。


    ## Step 3 放下 / 不煩躁，克制得失心


    如果執著於身外之物的話，我們會將自己牢牢的束縛起來。一個被束縛著的人，根本沒有秘密可言，別人能夠輕易看穿他們的內心。一個善於藏心的人，首先應該是一個「自在」的人，只有當心靈無所束縛的時候，人才能隨心所欲地控制自己的情緒和感情。


    我們必須想辦法從束縛中解脫。所謂「解鈴還需繫鈴人」，我們要想擺脫心靈上的束縛，還是需要自己的努力——將自己囚禁於籠中的是自己，能讓你破籠而出的也是自己。


    佛教中把束縛人的種種私慾看作是魔鬼，其中既包括內在的心魔，有貪愛、嫉妒、怨恨、妄想、煩惱、邪念等；也包括外在的外魔：金錢、愛情、權位、安逸等，甚至阻礙我們行善的親情也屬於外魔。這些心裡的魔鬼會在你不經意間控制你的言行，破壞你的良知，將你的良心束縛起來。這些「魔」不一定是醜陋的，他們可能「千嬌百媚」，引誘我們一步步走向陷阱，將我們牢牢地控制住。


    人世間存在著積極向上的一面，也有見不得光的醜惡。我們藏心，就是要將我們心中負面的、甚至說是醜惡的東西壓制住。只有這樣，我們才能自由自在、不煩躁的生活。


    一個人的奮鬥歷程，與其說是為了理想而努力，還不如說是為了擺脫某種束縛而努力。


    假如我們出生在貧苦家庭，可能我們所有的努力只有一個目的，那就是擺脫貧困。因為貧困給我們帶來了太多的束縛，在貧困中生命得不到滿足，也得不到尊重；如果出生在安逸的家庭，人又要極力掙脫安逸的享受和不知進取的心靈，因為富有會束縛人的進取心。


    生命的束縛和掙脫束縛的努力，使我們的生命變得厚重而美麗。但是歸根究底，我們每個人都還是在為脫離心中的束縛而努力著。這是使我們不煩躁的最好辦法，也是我們「藏心」的根本。


    ## 別讓人一眼看穿你

    觀心與藏心的攻防智慧


    ![](img/65c5e2383679681693f7479829cb5f93_94_0.png)


    ## 快樂的能力


    現實生活中，有一種這樣的成功者——他們得到了自己所想要的一切，卻從來沒有因此快樂過，他們總是在追求，卻找不到讓自己幸福的理由。長此以往，這些人便喪失了快樂的能力——而一旦你失去了快樂的能力，財富或其他東西再多，也無法為你帶來成功或幸福——這些人贏得了成功的「殼」，但攜開之後，裡面卻什麼也沒有。


    我們不能做這樣的人，所以，我們需要藏住我們的「空虛之心」。


    空虛其實是一種徵兆，意味著你的生活缺少一些創造性。你空虛的原因可能是因為沒有對你足夠重要的目標，也可能是因為你在努力追求某個重要目標時沒有使用自己的才華、沒有竭盡全力。


    有些人沒有志向，於是他們會說：「人生沒有目標。」


    而另一些人沒有值得追求的目標，於是總說：「人生不值得去奮鬥。」


    一個失去了目標和生活樂趣的人，往往陷入到無盡的煩躁之中。而逃離這種煩躁，需要我們敢於去發現生活中的美好事物。


    一位 FBI 行政人員被派到某個沙漠國家駐紮，他的妻子賽爾瑪和他一起前往。


    沙漠中乾燥高熱，讓賽爾瑪感到非常難過。由於身邊沒有任何朋友，賽爾瑪感覺自己完全不能適應這裡的生活。她向自己的丈夫傾訴苦衷，丈夫只跟她說了一句話：「兩個人從牢中的鐵窗望出去，一個看到泥土，一個卻看到了星星。」她聽到這番話後心頭一顫，決定要在沙漠中尋找星星。


    從那以後，賽爾瑪的生活開始了改變。她和當地人積極的接觸，抽出時間來觀賞別有風味的沙漠風光。逐漸，她開始迷上了這裡，後來還嘗試寫作，出版了一本書籍。原本悲觀的她看到的只是泥土，當心態發生轉變後，樂觀積極的她重新找回了熱情，看到的就是星星。


    故事中的賽爾瑪，面對同樣的生活，卻有著截然不同的心態。其原因，就是她克制了自己的煩躁情緒，所以才有精力在生活中尋找快樂。如果一個人的心被煩躁所控制，那麼他看到的一切都將失去色彩。


    人和人之間的差異其實很小，成敗的關鍵在於是否擁有熱情積極的心態。兩個人，一個整天煩躁不已，另一個卻積極樂觀，那麼後者的人生一定會更順利。


    成功人士的第一個標誌，就是他們具有熱情積極的心態，樂觀地面對人生，樂觀地接受挑戰；如果能夠做到這一點，那他就已經成功了一半。很多人 在功成名就之前，也只是芸芸眾生中的一個。他們
    正是以熱情的心態全身心地投入工作，這才邂逅了幸運之神，登上事業的巔峰。


    美國標準石油公司裡有一個非常普通的職員，叫做阿基勃特。這個人業績平平，在一般人眼裡，他沒有絲毫的過人之處。


    但是，阿基勃特卻始終保持著一個習慣：每次出差住旅館時，都要在自己簽名的下方寫下「每桶四美元的標準石油」這幾個字，所以他被人稱作「四美元先生」。

