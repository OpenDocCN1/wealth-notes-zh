    研究員亦表示最有趣的發現是：如果妳給易衝動的人展示自控能力的機會，他們會變得不那麼具有攻擊性。易衝動的人並非不顧意自我控制，而是 不善於自我控制。掃描和監測易衝動人士大腦的結果顯示，受到侮辱時，他們大腦中與攻擊性有關的區域比不易衝動的人更為活躍。


