    # Step 4 自主 / 不盲目，養成獨立思考的習慣


    不要抱怨成功太艱難，路途太坎坷，你需要是增強你的意志力，還有你的恆心。堅持不懈意味著有決心，當我們感到精力竭的時候，放棄和服從是最簡單的，也是看起來最好的選擇——然而成功者在此時卻必須忍住。他們的意志力是普通人難以想像的，甚至為了成功，他們可以選擇「一生只做一件事」。因為他們專注，所以沒有人能輕易打到他們，更不會有人能夠窺透他們內心的強大力量。


    杜雷德是一名 FBI 探員，和他一起進入 FBI 的「戰友」。在他這個年紀都已經獲得了巨大的成就，但是杜雷德卻一直沒有得到提升。原來，他把自己所有的精力都放在了一個曠日費時的重大案件上。這個案件不知道什麼時候才能結束。這就意味著，杜雷德不知道要什麼時候才有「出頭之日」。

    朋友都對杜雷德說：「你應該換一個任務，這個任務做下去，恐怕你一輩子也只是個小小的探員了。」

    就連杜雷德的敵人也發郵件給他，上面寫道：「你已經黏了我們十三年了，我佩服你的勇氣。可是，如果你再這樣無止盡的和我們糾纏下去，你將失去你最寶貴的一切。」

    無論是朋友的好意規勸還是敵人的恐嚇威逼，都沒有讓杜雷德屈從。他依舊堅持著自己的任務。終於，又過了五年，杜雷德完成了那個幾乎不可能完成的任務。


    每一種成功的背後，都有不為人知的心酸，但每一種成功也都有個共同的祕訣，那就是堅持。


    有人曾經問過小提琴大師弗里茲·克萊斯勒（Fritz Kreisler, 1875.2.2 - 1962.1.29），為何他能演奏得這麼好，是不是運氣好？'
