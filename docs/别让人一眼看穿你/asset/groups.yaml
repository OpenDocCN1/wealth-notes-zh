    # 沉默的力量


    人一生氣，總是顯得非常激動，用最高的嗓門說話，恨不得全世界都聽到自己的聲音。對於一個真正的藏心高手而言，言多必失是他們遵循的首要法則。他們即便是在生氣的時候，也懂得用沉默的力量來幫助自己藏心。


    沉默是一種無形的力量，它不是一味地不說話，而是一種胸有成竹、沉著冷靜的特質，它能夠在神態和氣勢上壓倒對方。恰當地運用沉默，往往令對方招架不住，自亂陣腳，從而露出廬山真面目。「厚黑學」主張，上帝給了我們一張嘴、兩個耳朵，目的就是讓我們明白耳朵的作用比嘴巴大，聽比說更為重要。在特定的場合中，少說乃至不說、保持沉默，常常比喋喋不休地理論更有說服力。


    沉默是一種無聲的語言，有一句古話叫做：「於無聲處聽驚雷」。有時候，沉默可以變得很犀利。我們大都會經歷這樣的場景：你在和別人討論、爭執，當別人感到乏味時，會不理會你的言語，拿起桌上的報紙或其他什麼，隨便翻閱起來，以此作為回應。但恰恰是這種沉默式的回擊，往往會讓你感到十分難受。


    這就是沉默的「犀利」之處。不要試圖借助言語驅使他人做你希望的事，他們只會因為你的激動而反對你，毀滅你的願望。在人生絕大部分的領域內，你說得越少，就越顯得神祕。當你學會閉上嘴巴的時候，實際上更有機會擁有權力。


    沉默為什麼會有如此大的威力？因為一旦一個人保持沉默，就等於隱藏了自己的真實意圖，讓別人更難以琢磨，更恐懼。


    沉默會給人造成很大的心理壓力，人生性都是排斥沉默的，'
  - '[PAGE 59]


    它會讓人感到沒有依靠，因而沉不住氣。另外，沉默還可以引起對方的注意，使對方產生迫切想瞭解你的念頭，因為沉默有種「神秘」的意味。


    「話多不如話少，話少不如話好」。多言的人往往是浮躁的，因為口頭上慷慨的人行動總是吝嗇的。在適當的時候，保持沉默，你的力量大過於千軍萬馬。正如英國十九世紀政治家查士德·斐爾爵士教導他的兒子：「要比別人聰明，但不要告訴人家你比他更聰明。」


    事實上，單單是沉默並不能讓自己變得強大。更重要的是，一個人要在懂得不動嘴的時候悄悄地「動手」。


    行動是一個敢於改變自我、拯救自我的標誌，是一個個人能力有多大的證明。所有的空想，所有的宣言，如果沒有行動作為延續，就都是虛無飄緻，因為沒有任何實際的東西。美國著名成功學大師說：「一次行動足以顯示一個人的弱點和優點是什麼，能夠及時提醒此人找到人生的出口。」毫無疑問，那些成大事者都是勤於行動和巧妙行動的大師，他們都是用行動來證明自己的價值。


    FBI 探員有一個做事的法則——少說多做。確實，對於整天生活在危險中的他們而言，這是一個生存下去的法則。


    FBI 資深探員說：「行動的最好方法，就是要馬上去做、立刻去做；不論從哪個角度看，這都是一句真理。也許你早已經為自己的未來描繪了一個美好的藍圖，但是它同時也給你帶來煩惱，你感到自己遲遲不能將計畫付諸實施，你總是在尋找更好的機會，或者常常對自己說：留著明天再做；這些做法將極大地影響你的做事效率。要獲得成功，必須立刻開始行動。任何一個偉大'
  - '[PAGE 60]


    的計畫，如果不去行動，就像只有設計藍圖而沒有蓋起來的房子一樣，只能是一個空中樓閣。」


    看看那些成功的人，他們往往都是實踐家。有了想法，就馬上制定行動的計畫，然後開始實踐。他們從來都不是終日幻想著會有什麼樣的結果，也從不擔心失敗了會如何，更不會向外人宣揚自己即將開展一個偉大的計畫。


    他們知道，任何東西都無法替代腳踏實地的行動。有了積極的行動，自然會有好的結果；有了積極的行動，就能夠克服萬難直至成功；有了積極的行動，任何人都會看得到自己的努力和付出，自然會產生信服感。行動，就是最好的證明。


    據說，在美國一個小城的廣場上，樹立了一個老人的銅像。他既不是什麼名人，也沒有任何輝煌的業績和驚人的舉動，只是該城一個餐廳端菜送水的普通服務生。但他對客人無微不至的服務，令人們永生難忘。他是一個聾啞人，他一生從沒有說過一句話，也沒有聽過一句讚美之辭，他只能憑「行動」二字，使平凡的人生永垂不朽！這就是沉默和行動相結合的巨大威力。


    正如哲學家泰奧弗拉斯托斯（Theophrastus, c. 371 - c. 287 BC）所說：一個人在交際場合中一言不發，那麼這個人不是傻瓜便是強者。傻瓜是因為不會說話而沉默，強者則是因為不會犯言多必失的錯誤所以沉默。'
  - '[PAGE 61]


    # 練習以第三人的角度審視自己


    我們之所以會因為失敗、挫折而生氣，會因為別人對我們的評價而惱火，其實很大程度上是因為我們沒有認真的反思過自己。一個人若是不懂反思自己，就難以對自己做出客觀的評價，因而會被外界影響而表現出相當敏感的心態。這顯然不得藏心的要旨。


    反思自己的過程可能會非常艱苦，但是如果你能夠透過自我認識而提升自己，就會離成功越來越近。


    有一個人，二十三歲的時候被人陷害，鍛鐺入獄，在監獄裡整整被關了九年。後來冤案告破，他重新獲得了自由。


    雖然過去的苦痛經歷結束了，自由重新降臨到他的生活中，但是他的陰霾生活顯然還沒有結束。他開始了無休止的抱怨和控訴：「我真不幸，在最年輕有為的時候遭受冤屈，在監獄裡度過本應最美好的時光。如果沒有人陷害我，我怎麼會是今天這副樣子？我一定有更好的生活，一定有了自己的家庭，可是現在，我什麼都沒有！這該死的世界，為什麼要這樣對我！」


    抱怨像一條毒蛇，將他的一生用陰冷冰涼的軀體纏繞。


    七十三歲那年，在貧困交加中，他終於臥床不起。彌留之際，牧師來到他的床邊：「可憐的孩子，去天堂之前，懺悔你在人世間的一切罪惡吧！」


    到了這個時候，病床上的他依然對往事耿耿於懷：「我沒有什麼需要懺悔，我需要的是詛咒，詛咒那些施於我不幸命運的人。」'
  - '[PAGE 62]


    # 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    牧師問：「你被陷害之後在牢房裡待了幾年？」

    「九年啊，九年！我的大好時光就這麼白白浪費在牢籠裡了！」這人呼喊著。


    牧師嘆了一口气，說：「別人把你關了九年，可是你卻把自己關了四十年啊！」


    這個人因為暫時的挫折，陷入對生活無休止的怨恨中，最終釀成了悲劇。


    在漫長的人生歷程中，必須要正確地認識自己。把自己高估，會脫離現實，守著幻想度日，怨天尤人、懷才不遇，結果是小事不願做，大事做不來，終究一事無成；把自己看得過低，會產生強烈的自卑感，導致自暴自棄，明明能幹得好的事，也怯於嘗試，結果錯過很多機會，落得抱怨終生的後果。


    FBI 探員吉姆在奧克拉荷馬一所監獄發表完演講之後，說過這樣的話：


    「我離開時認識到：在這裡，我與搶劫犯、殺人犯、犯下可怕錯誤（有些犯人甚至反復犯同樣的大錯）的人為伍。然而，他們當中多數人卻不像外界的人那樣經常責備或懲罰自己，更不用說大部分的人一生中的嚴重失足有
    99％都是由誠實、道德的行為組成。入獄的犯人找律師爭取自己在獄中的權利，這都常見。而許多優秀公民卻僅僅因為過度的自我批評和自我懲罰，剝奪自己不可讓渡的、追求幸福的基本權利。


    當我們駕車駛過監獄巨大的混凝土高牆、一層層帶刺鐵絲網以及塔樓裡荷槍實彈的警衛人員時，我不禁想：許多人建造了比這些更加森嚴可怕的心靈監獄，然後將自己鎖入其中，而這一切'
  - '[PAGE 63]


    都是因為過去的『罪孽』。我對罪孽一說不是特別相信，但是，如果真有罪孽，那是指人們在用自己寶貴的光陰，為過去犯下的錯誤而懲處自己，也只有人才會犯下這樣的錯。」


    罪犯是最為可悲的人，因為他們不懂得反思自己；但把自己關在心靈囚籠中也是種可悲。只有能正確認識自己的人，面對成功不得意忘形，遇到挫折不灰心喪氣，這樣才能在人生奮進的道路中，不自誇，不沉浮，以一顆飽滿的心去迎接更大的挑戰。


    認識自我並非是一件容易的事，人往往會陷入自我迷失之中。我們經常會受到他人的影響和暗示，把他人的言行作為自己行動的參照，從而迷失了自己。另外，大多數人很少能夠主動審視自己、很少反省自己，更不會把自己放在局外人的地位來觀察自己。


    正因為如此，我們很容易就弄不清楚自己究竟是誰；關鍵早已明確，只是我們自己尚不自知。


    跳出自我迷失最好的辦法就是定期用冷眼旁觀的態度審視自己。古詩言：「不識廬山真面目，只緣身在此山中」，認識自己首先要跳出「廬山」，以旁觀者的眼光分析、審視自己。功過是非，不誇大，不縮小，避免主觀、片面，實事求是地看待自己。這樣才能克服不足、推動進步，以期不斷成熟、不断更新。


    認識自己當然不是我們最終的目的，它只是通向成功的一個環節。我們認識自己之後，最重要的就是給自己一個定位，把自己放在合適的位置，這樣才能達到目的，進而取得人生的成功。'
  - '[PAGE 64]


