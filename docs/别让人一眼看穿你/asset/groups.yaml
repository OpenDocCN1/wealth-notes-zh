    ## 懂人，從自我認同開始


    不管是占有慾，還是控制慾，其實思想根源就 在於人的內心缺乏自信，缺乏安全感，自我認同不夠。


    一個人如果有足夠的自信，有自我認同感的話，就不會刻意的追求領域感和對其他人的控制，因為他們相信自己本身就能夠應對眼前的事物。


    其實，自我認同和認同別人所秉持的標準是一致的。我們在認識別人的時候，貴在能設身處地地為別人著想；同樣，當我們自我認識的時候，最難得的就是站在別人的角度，以客觀而非主觀的心態看待自己。


    假如有這樣一個人，他在與世隔絕的環境下長大成人，從來沒有與其他人接觸過，那麼他就不可能以客觀的角度去自我觀察，也不可能對自己的特質、情感和行為有客觀的認識。


    那麽，自我認同和藏心術有什麼關係呢？我們所強調的「藏心」，不僅僅是外在的掩飾，更是一種心理上的自我控制和自我修正，而自我認識，正是自我控制和自我修正的最大前提。如果一個人連自己所作所為的對錯是非都搞不清楚，那麼又何談自我認識和自我修正？所以，我們才刻意強調自我認同的作用。


    一個人如果沒有自我認同，最直接的後果，就是迷失自己，因此可能導致的最嚴重的結果就是患上精神分裂症。


