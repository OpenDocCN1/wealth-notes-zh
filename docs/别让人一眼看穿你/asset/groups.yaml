    # 社會新聞常見的「由愛生恨」


    本篇，我們講的是自戀和愛恨表達的內容。讓我們先從一個真實案例說起。本案僅僅是一個很簡單的暴力殺人案，但因為涉及敏感話題——大學暴力，所以引起 FBI 犯罪學家的關注。


    中午時分的密西根大學，一位女生和同學從餐廳二樓吃完飯下樓。樓下衝上來一個男生，手裡拿著一把刀，高喊著：「妳為什麼要騙我？」然後就在她的脖子上劃了一刀，接著往胸口上捅了進去，女生從樓梯上滾了下來。


    現場的人都驚呆了，同伴喊救命，隨後現場一片混亂，餐廳裡的人都出來了。那個男生手裡拿著那把血淋淋的刀，呆呆地站在那裡，等員警來帶走他！


    那個男生在遺書中這樣寫道：「我受夠了，我真的受夠了。三年時間，每天幫你裝水、買飯、占座位。我家家境本來就很困難，每逢情人節和生日，我都要給妳買很貴重的禮物。只要能看到妳的笑容，我比什麼都開心。


    我還記得那一個冬天的晚上，我在十二號樓下拿著一個月的餐費買來的玫瑰花等了妳整整四個小時。在我看到妳的那一刻，一直煎熬著我的緊張、焦慮、擔心和失落全都消失得無影無蹤。以後每每聽說妳和別的男生去跳舞、唱歌，只要想起那天晚上妳在我臉頰上的吻，我就可以什麼都不在乎。畢竟，我現在沒有能力給妳那些，因此沒有資格去享受。


    我原以為只要我努力對妳好，總有一天妳會懂我的心。可'
