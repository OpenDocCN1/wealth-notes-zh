    ## 生氣不如爭氣


    人總是太容易生氣，遇到不如意的人、事，任由心中生出怨恨、氣惱。因為氣惱，所以我們的人生變得怨氣沖天，毫無樂趣。更為關鍵的是，一個動不動就生氣的人，他的情緒將永遠暴露在別人的面前。他以為自己一生氣別人就怕了他，實際上，別人會抓住你的這個缺點，洞悉你的內心。


    哲學家說：「生氣就是用別人的錯誤懲罰自己。」仔細想想，這句話真是真理！我們之所以會生氣，大部分是因為別人犯的錯誤影響了我們。而生氣除了讓自己不愉快，又能改變什麼呢？這難道不是用別人的錯誤懲罰自己嗎？我們與其為別人的錯誤而生氣，真不如自己努努力，給自己爭口氣來得實在！


    道理很明白，但是太多人卻做不到。在遇到問題的時候，我們總是喜歡從別人身上找原因，為別人而生氣，卻很少將問題歸結於自己的不足，督促自己進步，獲得解決問題的能力。


    FBI 探員詹寧斯原來是個火爆浪子，他動不動就會大發雷霆，讓人敬而遠之。因為這個毛病，雖然他非常有能力，卻總是得不到晉升。為此，他非常苦惱。有一此在執行任務中，無恥的匪徒在落網之後還不斷用不堪的言語刺激詹寧斯。詹寧斯在暴怒之下，對那個人大打出手。這種行為違背了
    FBI 法則，所以詹寧斯受到嚴肅處罰。


    在那以後，詹寧斯痛定思痛，決心改變自己的壞脾氣。在那之後，他終於改變了自己愛發脾氣的壞毛病，也很快得到了上司的賞識，獲得了晉升。


    ## 別讓人一眼看穿你

    讚心與藏心的攻防藝術


    那些不能控制自己脾氣的人，應該覺醒了，有和別人生氣的時間，不如自己給自己爭口氣！


    作家被邀請到一所大學做演講比賽的評審。參賽選手經過抽籤確定了演講的順序和主題後，第一位選手表情很不滿地走上臺去。「同學們，尊敬的評審員們，這是一場不公平的比賽！我領到這張紙以後，只有幾分鐘時間準備，在我之後的人有更充裕的時間準備，這是不公平的！」


    在眾人驚訝的表情下，他走下講臺，衝出了大廳。


    這個選手的離開並沒有給比賽造成任何影響，比賽順利進行。有人自比賽中獲得了榮譽，有人則鍛煉了自己。


    過了幾天之後，這位作家偶然遇到了那個生氣離開的選手，就對他說：「你因為不公平而生氣、而離開，可是你有沒有想過，只要自己爭氣，那麼即便是不公平，你也能獲得成功？」選手聽了作家的話非常慚愧，他也從中領悟到了做人的道理。


    這個故事中的選手太不會藏心了，雖然他的不滿是有原因的，但是在那種場合大發脾氣，證明了他的不成熟。因此，我們需要藏心，需要隱藏自己的怒火。


    生活中，我們總是會遇到一些比較困難或者自己不願意做的事。當這些事情無可避免發生在自己身上的時候，生氣又有什麽用呢？只有自己爭氣，才能擺脫困境，走向輝煌。


    所謂爭氣，就是不因一時的失敗而喪氣，要能力圖上進；不因一時的挫折而喪氣，要能奮發圖強；不因一時的貧苦而壯士氣短，應該要鼓舞精神，要更加爭氣。當一個人受到挫折委屈時，只有自己努力「爭氣」，以願心為動能，化悲憤為力量，才有前途未來。


    有一個年輕人，經常因得不到上司的賞識而生氣抱怨。一天，他去拜訪恩師，並向其道出了自己的煩惱。


    恩師聽後，就帶著這個年輕人到了海邊，他彎腰揀起一塊鵝卵石，拋了出去，扔到了一堆鵝卵石裡，並問道：「你能把我剛才扔出去的鵝卵石撿回來嗎？」


    「我不能。」年輕人回答。


    「那如果我扔下一粒珍珠呢？」恩師再問，並別有深意地望著年輕人。


    年輕人頓時恍然大悟：一味地生氣抱怨只是徒勞，唯有爭氣，憑藉實力迅速脫穎而出，才是明智的做法。


    如果你只是一塊平常無奇的鵝卵石，就沒有生氣抱怨的權利，因為自身還沒有被注意的亮點。此時，就需要爭氣，不斷提升自身的實力，最終成為一粒耀眼的珍珠。那時的你，說話才能理直氣壯、鏗鏘有聲，最終得到別人的認可與尊重。


    要爭氣，就得先要有志氣！立志向上，立志做人，立志爭氣，立志就是爭氣的原動力。我們如果要不生氣，就必須要爭氣；我們要想爭氣，就必得先要立志。人有志氣，又何患無成呢？


    ## 原諒要有手術刀的效果


    有時候，我們之所以生氣，是因為我們總是對別人的錯誤耿耿於懷，我們因為別人的錯誤而生氣。


    當然，有時候我們也許會裝出大方的樣子，說：「我能原諒你，但我卻無法忘掉。」但事實上，這句話只不過暴露了內心的不原諒，你心中的計較依舊會折磨你的心。你如果不去原諒，就永遠藏不住你的內心，更藏不住你的怒火。


    真正的、誠懇的、徹底的原諒，是醫治一切內心不快的良藥。而那些虛假的原諒，則像是一個在給自己做整容手術，雖然戴上了一張「假面」，但是心中的憤怒卻始終暴露在人們面前。


    關於原諒，我們存在許多誤解，而原諒的治療價值之所以沒有得到眾人的公認，原因之一就是很少有人嘗試真正的原諒。


    許多人說，我原諒了別人給我的不公平待遇；但事實上，當這些人還想著「不公平」的時候，他就沒有做到真正的原諒。


    更多人則把原諒當作是一種體現自己寬容的手段，或者作為一種戰勝對手的方法。這種思想在許多油腔滑調的俏皮話中表現出來，例如，有些人喜歡說：「好吧，我原諒你的無知。」你覺得這是真正的原諒嗎？顯然不是，因為話中還有明顯的憤怒，只不過是夾雜了一些調侃但具有殺傷力的話罷了。


    具有真正療效的原諒會將對方的「劣跡」切除、根除或剔除，就像它從來沒有發生一樣。只有這種原諒，才有手術刀的效果。


    FBI 探員傑森在十年前追捕一個逃犯時，被窮凶極惡的逃犯打瞎了一隻眼睛。而那個逃犯，最終也被他擒獲。


    十年之後，傑森再次遇到了當初的那個逃犯。逃犯也認出了眼前的這個人，就是當年將自己逮捕歸案的人。


    逃犯雖然對傑森充滿了怨恨，但是一想到當年自己曾經打瞎了他的眼睛，心理反而有些「安慰」，心想：「我雖然被關了整整十年，但是他也瞎了一隻眼睛，恐怕這十年的日子也不好過。」


    可是令逃犯感到「憤怒」的是，傑森的狀態居然很好，他依舊快樂地生活著。


    敵人的快樂就是自己的痛苦，逃犯心裡有些不舒服了。他惡狠狠地問傑森：「你知道，你讓我蹲了十年大牢，十年裡，我都生活在憤怒之中！而你這個可惡的瞎子，居然還笑得出來。你忘了你的眼睛是我打瞎的嗎？現在我就在你面前，你應該感到憤怒才對。」


    傑森笑了一下說：「我快樂，是因為我早原諒了你。而你生活在憤怒中，就是因為你不懂得原諒，只會怨恨。」


    這個故事告訴我們，如果一個人不懂得原諒，那麼他的生活就是可悲的。只有學會原諒的人，才能克制自己的憤怒。


    其實，想讓原諒來拯救你的心並不難。唯一困難的就是你一定要毫無保留的放棄或解除譴責感。


    我們發現原諒難的原因只有一個，就是我們太過於喜歡譴責別人的感覺。我們從自己的傷口中，會得到一種反常、病態的快樂。只要有機會譴責別人，我們就會覺得自己比被譴責的對象要強一些。誰都必須承認，這是一種病態的滿足感。


    在發自內心的原諒中，我們將別人所「欠」的債一筆勾銷，


    ## 別讓人一眼看穿你

    觀心與藏心的攻防智慧


    ![](img/65c5e2383679681693f7479829cb5f93_40_0.png)


    這並不是因為我們忽然變得「大方」起來，因為施人以恩惠或者從道德上來講是個超人。


    我們之所以決定取消「債務」、給它貼上「無效」的標籤，也不是因為別人已經還清了欠我們的一切；而是由於我們開始認識到這筆債本身就不合法——只有當我們能夠發現（並從情感上接受）自己現在和過去都沒有什麼可以原諒的時候，這種諒解才有治療效果。這就是原諒別人的妙處。


    事實上，我們不僅要原諒別人，也要原諒自己。給我們帶來創傷的不僅僅只有別人，也包括我們自己。


    當我們用自責、懊悔、遺憾來折磨自己時，當我們用自我懷疑來壓制自己的內心時，當我們用過分的愧疚讓自己懊惱不已時，我們其實都沒有原諒自己。


    從情緒上講，懊悔和遺憾是指回到過去的生活當中。


    過分愧疚是指我們希望把過去做錯或自認為做錯的事再做正確。


    當情緒幫助我們對眼前的現實環境作出正確回應或反應時，我們才算正確而恰當地運用了愧疚感。但是，如果愧疚之情到了一種失去控制的地步，其實也會對我們造成傷害。


    我們活在當下，卻總是被過往糾纏。從前所做的錯事、壞事，我們為之悔恨。從前的成功、榮譽，我們念念不忘。沉淪在往事裡，就容易對當下的處境產生不滿。所以，我們過得並不快樂。


    過去並非沒有意義，它讓我們擁有更多的生命體驗和生活經驗。我們可以回首往事，從中吸取經驗教訓，用以指導自己當下的生活。但是，絕不能被往昔的種種情緒所困擾、糾纏。因為在當下，還有很美好的生活等著我們去感受、創造。


    凱斯西儲大學曾對「愧疚」這個問題進行過研究，研究報告發表在《讀者文摘》上。研究發現，普通人每天要花兩個小時用於愧疚！對於這些人而言，「昨天」就像是一個籠子，它禁錮了人們對於當下生活的渴望和體驗。總是沉迷於昨天，就永遠不會有現在。


    人生不可逆轉，過一天就會少一天。我們追求的是幸福和快樂，背負著過去的痛苦走完一生真的不值得。事情是過去的事情，痛苦是過去的痛苦，一切後悔和嘆息都無濟於事，拿過去的痛苦來折磨自己是悲哀的，也是沒有意義的。


    如果你不能用寬容和豁達的眼光，來看待自己的人生，就無法用樂觀的眼光看待未來。


    ## 別讓人一眼看穿你

    藏心與藏心的攻防智謀


    ## 克制沮喪產生的爭鬥心


    人在遭遇挫折後，難免會產生沮喪。但如果不隱藏和克制自己的沮喪，便很可能導致錯誤的鬥爭心。


    劉是一名 FBI 探員，曾經為 FBI 立下赫赫功勳。由於在某次任務中險些被敵人殺害，而且那次任務也宣告失敗，所以他開始變得沮喪。他總是說：「我每天是把腦袋別在褲腰帶上的，但是政府卻從來不拿我們的生命當一回事。」


    從那以後，劉變得暴躁易怒，經常和上司發生衝突。


    1990 年，劉跑到上司的辦公室，對上司說：「你必須讓我脫離目前這個職位，我已經受夠了這份工作，也受夠了你們。」由於劉當時在任務中有不可替代的作用，所以上司駁回了他的請求。


    在申請被拒絕之後，劉的暴躁變本加厲。某次，他在超市中購物，和超市的收銀員發生了一點衝突。這時身為 FBI 探員的他，竟然不顧 FBI 的嚴令，拔出自己的手槍對準了一個無辜的人。


    當然，劉被 FBI 給予嚴懲。辦公室主任大怒之下改派他一份羞辱的工作——讓他替辦公室的同事們複印文件。


    1993 年 10 月 12 日，FBI 行政管理處處長史蒂文在一封寫給劉的信中說：「你違反了規定，所以除了將你開除外別無選擇。」


    就這樣，一個有前途的探員失去了自己的工作。


    在這個故事中，劉作為一名 FBI 探員，非但沒有很好克制自己的負面情緒，反而任由自己的憤怒蔓延，最後釀成了大禍。


    這個反例告誡我們：作為一個善於藏心的人，一定不要盲目「開炮」。


    事實上，在我們生氣的時候，身體有一些負面的反應，比如高血壓、憂愁、酗酒，而且會滋生我們易怒、粗魯、非議、嚼叨、挑剔等情緒。由此可見，生氣對於一個人的負面作用是非常大的，所以我們非常有必要克制住自己的怒火。


    我們要想不生氣，需要先藏住自己心中的沮喪之情。


    事實上，每一種情緒都應該有一個釋放的通道。這就像是鍋爐裡的蒸汽，必需有一個出口，才能保證蒸汽所產生的壓力不會大到讓鍋爐爆炸。但是有些人不會給自己的情緒找一個合適的通道，他們會將心中的壓抑變成沮喪和憤怒，然後爆炸性的釋放出去，給自己和別人造成傷害。


    這是典型的因沮喪而憤怒的案例。


    一名成功的女性，嫁給了一個比她年齡小一點的男子。這位女性在事業上要比丈夫更成功，所以她一直是家裡的經濟支柱，她自己也對這種狀態很滿意。


    而她的丈夫呢？長期生活在妻子的陰影下，受盡別人的嘲笑和非議，這讓他倍感沮喪。


    丈夫為了擺脫對妻子的經濟依賴，也曾經三番五次的想要創業，但是均以失敗告終，結果只是為他帶來更大的挫敗。他開始變得暴躁不安，經常和妻子吵架甚至大打出手，結果婚姻破裂。


    ## 別讓人一眼看穿你

    識心與藏心的攻防智慧


    ![](img/65c5e2383679681693f7479829cb5f93_44_0.png)


    人之所以會沮喪，是因為覺得自己的能力不足以應對眼前的局面。所以，我們應該對症下藥，讓自己走出眼前的困境，積極地生活。


    誠然，生活中許多苦難是無法克服的，但是，我們完全不必因此而自哀。因為你只要有一顆積極的心，即便是不能解決問題，也不至於被問題所擊倒。


    所以，積極地生活，就是你克制沮喪的最好辦法，也是藏住自己憤怒的途徑。


    ## 淡定才是藏心根本


    淡定，是一種思想境界，是一種心態，是生活的一種狀態，是「藏心術」修煉到一定程度所呈現出來的那種從容、優雅的感覺。只要擁有這種心態，我們在生活中無論遇到什麼情況都會處之泰然，寵辱不驚，不會太過興奮而得意忘形，也不會太過悲傷而痛不欲生，更不會因眼前的不快而大發雷霆。因此，淡定是藏心的一個好管道。


    古人講：「不以物喜不以己悲」，其實就是一種淡定的態度。每個人的生命存在方式都是不同的，你只能以自己的方式為人，以自己的方式處世。


    在這個世界中，我們會遇到許多不如己所願的事情，最好的應對就是淡定。記住：淡定是一個人的美德，淡定的胸懷能包容一切。在生活中多幾分淡定，便會多幾分泰然。


    比如，在擁擠的公車上，有人踩了你一腳，這時你的反應是什麼呢？是淡然地說一句「沒關係」？還是火冒三丈，把對方大大臭罵一頓？


    此時你的處境我們可以理解，車擠、開得慢，對於著急上班的人來說本來就有說不出的怒，再加上腳上火辣辣的疼，能不火大嗎？可是爭吵又有什麼用？它只能把你的煩躁發洩傳染給別人，別人也會變得更加煩躁，結果兩人大打出手，惡語傷人。本來一件小事，造成嚴重的後果；即使你能在與別人的口角中占到便宜，你還是輸了風度。相反，假如此時你擁有淡定的情緒，你就能夠為彼此著想，化干戈為玉帛。


    當然，淡定並不是說要讓一個人「全無感情」，無喜無悲那


    ## 別讓人一眼看穿你

    體心與藏心的攻防智慧


    是有道高僧所追求的境界。對於我們來講，淡定就是要讓自己在面對事情的時候能夠冷靜地去權衡利害關係，而不是被自己的負面情緒完全主宰了自己的行為。


    如果你能多淡定些，肯定就會少做許多讓你後悔的事情，那麼你從苦惱中解脫出來的時間就能減少一些，受的傷害就會少一些。有句名言：「看得開一點，傷就少一點。」這裡的「看得開」，指的就是淡定啊！


    有一位 FBI 探員因得罪上司而被調到離家較遠的郊區工作。此時他已年過半百，每天還得騎兩小時自行車才能到單位，身體非常吃不消。


    開始時，他對上司的這一決定超不滿，負面心理極重，總是去總部要求換個離家近點的單位。此時他感覺這個世界太不公平了，沒有地方可以讓他說理去；可是得罪了上司，他調回總部的想法只能是泡影。


    怎麼辦呢？難道就一直這樣負面下去嗎？他問自己該怎麼辦，擺在他面前的只有兩條路——要麼辭職，要麼適應。但是他的家庭情況並不樂觀，老伴的身體越來越不好，家裡需要錢，怎麼辦？最後，他選擇了主動接受，他對自己說，既然選擇不了，那就受好了，他看開了。


    之後，他每天都帶著愉快的心情早起上班，路上他盡情地呼吸著清新空氣，欣賞著田園風光，聆聽著鳥兒的鳴叫。這樣，他腳下的這段路程便顯得不再那麼漫長了，他的心情也不那麼糟糕了，反而感到十分愉快，到單位後精神抖擻地投入到工作之中。一年後，由於他的表現出色，被提前調回總部，而且升官加薪。此事讓他深有體會，感慨萬千。讓他最深有體會的就是凡事都要看開，這裡的看開指的就是「淡定」二字。


    從此，他經常告訴他的下屬，無論何時都要保持淡定，只有淡定才能讓自己平靜，也只有靜下來才有思考的空間，才能正視現實，並從中發現事情有利的一面，才能成功地走出消極的惡性情緒旋渦，找到快樂的一面。


    但是，我們一定要搞清楚一個事情，淡定並不是讓你消極被動，而是讓我們對待困難與逆境時保持一顆冷靜樂觀的心。


    對於生活中的一些事，我們是不能不認真對待，據理力爭的；對生活中的某些人，我們也不能不聞不問，任其肆無忌憚。那不叫淡定，那叫冷血無情。假如我們在面對種種不幸時，能夠從容地一笑置之，這樣你才做到了淡定。


    這並不是叫我們去學會自欺欺人，而是自我調整和對環境的主動適應。你要相信，生活中所發生的 一切都是生活的一部分。是你的就是你的，失去了還會再來；本屬於你的東西，決不會與你交臂而過；不是你的，早晚會失去，再挽留也無濟於事。


    有了這種泰然自若的心態，學會說「看開」，你就會覺得生活中增加的不是苦惱，而是歡樂，這時的你才真的懂得了淡定的意義。


    ## Step 2 釋放 / 不生氣・拋開憤怒情緒


    ## 保持一顆平和的心


    生活中，難免會遇到對自己不利的流言，這些中傷和誹謗很容易讓人失去理智，讓人迷失心性，而做出一些過當的事情。這時候，一個人的缺點就完全暴露在別人面前。這對藏心是非常不利的。


    如何讓自己不為流言所動，保持良好的心態？我們需要有一顆平和的心，少生氣，少發牢騷。


    喜歡發牢騷的人心態往往難以平和，因為他們總是對自己周遭的人或物存在不滿，整天活在憤懣中。


    情緒是可以被感染的，一個整天憤懣的人，別人在他身邊也會感覺壓抑和不快，所以人們一般都對這樣的人敬而遠之，他們又怎麼能有好人緣和好機會呢？


    警員接手了一個奇怪的案子。某大學的教授集體出遊，但是在出遊的過程中，一個名叫里維斯的教授卻離奇跌下懸崖身亡。大學方面聲稱，里維斯是自己不慎跌落懸崖的。但是里維斯的家人卻堅稱，里維斯是被人推下去的。


    這是個非常簡單的案子，所以警員很快就查清了真相。原來，他們在一個風景區照相，為了拍攝眼前的美景，另一名教授與妻子早上五點就到風景區三號觀景臺占位子。不久，里維斯也看中了三號觀景臺這個位子，遂將相機三腳架放在人家占好的位子前面，兩人發生爭吵。隨後，里維斯在拉扯中不幸墜崖身亡。由於這件事情對學校的聲譽不利，所以學校才堅稱里維斯是自己不慎跌落山崖的。


    在這個故事中，之所以會因為一件小事就發生悲劇，就是因為他們都太容易生氣了。一個人一旦生氣，衝動就會打敗理智，藏心就成為了一句空話。


    人總會遇到所謂的「不平」，有時候你覺得自己沒有錯，感覺很委屈，因而內心無法平靜，處處與人爭辯，想「討個道理」。一個滿腹牢騷、喋喋不休的你，非常容易成為別人眼中的「病毒帶原者」，對你敬而遠之。


    其實，與其怨天怨地、心懷不平，不如沉下心來，思考一下具體的處理方法。只有這樣，才是理智有效的應對之方。


    FBI 探員的工作是以嚴謹和認真著稱的，但是偶爾也會鬧出一些笑話。


    有一次，探員在喬裝打扮後把兩個大盜騙到了他們的住所裡。這兩名大盜準備把偷來的一百萬美元政府債券賣掉，但是要求對方必須先拿七萬五千美元作為第一批款項。於是喬裝的
    FBI 探員請這兩名大盜到他們所居住的旅館，其實在這之前，他們就在旅館的房間裡預先埋伏了四個探員，準備當場逮捕大盜。


    這四個探員都躲在旅館房間的衣櫃裡。這些衣櫃都是用木頭做的，做工相當考究，而且關得又牢又密，裡面幾乎是密不透風。


    當這兩名大盜進入旅館的房間之後，他們用了很長的時間來觀察兩個 FBI 探員裝扮成的買家是否可疑，而且要先看到現款，他們才會把自己偷來的政府債券拿出來。


    於是大盜們和探員扮成的買家一邊吃東西，一邊談判，這個討價還價的過程幾乎持續了四個小時。這對於躲在衣櫃裡的四個探員實在是一種苦刑，因為衣櫃裡太熱了。

    '
