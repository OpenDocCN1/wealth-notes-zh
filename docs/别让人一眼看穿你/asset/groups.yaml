    # 別讓人一眼看穿你

    讀心與藏心的攻防智囊


    爭鬥的負面作用，才能更好地藏住自己的好鬥情緒，進而更好的藏心。


    生活中的一些平凡事情，是不必斤斤計較的。朋友、同事們日常聊天時，有哪幾件事是必須要爭一個是非對錯的？


    人總是有著各種不同的性格和待人處事的方式，即便有觀點、觀念上的不同，說說笑笑之間也就罷了。但就有人不能容忍遺些細小差異，忍不住與之辯論以分伯仲，遇到隨和的人也os了；如遇到同樣不饒人的人就難免將辯論發展為爭論，甚至矛盾、衝突。


    就算 是朋友、就算極有道理的話，也應注意措辭語氣；要指出別人的不對，可以私下再說，尤其在公共場合更應該為對方留一點餘地。若僅僅自認自己的觀點更高明，總是急不可耐地拿出「更高超」的見解，實在是喜逞口舌之快的小肚雞腸之人。


    這樣的待人接物方式，很容易使自己與朋友、同事疏遠：關鍵時刻沒人肯為你說一句話，朋友也不敢向你進一點忠告。所謂「人至察則無徒」，我們待人應輕輕鬆鬆，如非必要，不要過於認真。少苛求、多寬容，這才是正確的待人方法。'
