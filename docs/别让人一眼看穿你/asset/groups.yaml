    # 別讓人一眼看穿你


    # 讀心與藏心的攻防智慧


    ![](img/65c5e2383679681693f7479829cb5f93_0_0.png)


    察言觀色基本功，更要熟悉藏心術？


    解讀別人的心就像一面鏡子，當你窺視時，別人也在看你。


    別忘了你沒設防的心，正一點一滴地出賣你！


    Fletcher Boo


    ![](img/65c5e2383679681693f7479829cb5f93_1_0.png)


    # 前 言


    # 做個有「城府」的人


    本書是一本教人「藏心」的教科書，旨在教會大家如何隱藏自己的思維、情緒、弱點……。


    我們之所以要「藏心」，不是因為我們不夠坦蕩，而是因為這世界有時候需要我們「隱匿」起來，伺機而動。你若想成就大事，就必須先學會藏心，就像《三國演義》裡的劉備一樣「喜怒不形於色」。


    可是，在現實生活中，有太多人並不能很好的「隱藏」自己，他們的心思會被他人輕易看穿，意圖有時也經常被人識破。這些不會「藏心」的人，總是太容易把自己暴露在別人的眼裡，造成敵暗我明的形勢，因而更容易被別人牽著鼻子走，將自己陷於不利的境地。


    而另外一些人，則善於察言觀色，經常能根據別人的一個小動作就洞悉他人的內心。這些人總是對他人的內心世界瞭若指掌，因而能夠處處占盡先機。


    其實，能夠看穿你的內心，並不是他們最可怕的地方，更恐怖的是，因為他們知道一個人的心機是如何被看穿的，所以他們更懂得隱藏自己的內心。如此一來，別人在他們面前便沒有祕密，也永遠無法知道他們接下來會有怎樣的反應。和這樣的人為敵，便如同自己赤裸裸地站在毫無掩護的荒原中，而你的對手則潛藏在無邊的黑暗裡，你還想有勝算？


    # 別讓人一眼看穿你


    讀心與藏心的攻防智慧


    ![](img/65c5e2383679681693f7479829cb5f93_4_0.png)


    毫無疑問，FBI 的探員們，就屬於能夠看穿別人內心的可怕角色。對於 FBI 探員來講，讀心就是他們的職業，而他們最可怕的地方在於藏心。他們打入敵人內部進行間諜工作的時候，他們面對試探和盤問的時候，藏心就成了他們能否完成任務的關鍵因素。


    在大多數時候，我們需要像 FBI 探員一樣，隱藏自己的真實想法，讓自己成為一個有「城府」的人。若你也有類似的願望，那麼恭喜你，本書就是一本以 FBI 真實案例為藍本、對「藏心術」展開深入探討的「秘笈」。當你開始閱讀本書時，就已經踏上了「藏心」之路。


    # 目 錄


    # STEP 1


