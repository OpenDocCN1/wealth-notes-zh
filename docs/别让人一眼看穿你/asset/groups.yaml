    # 怨恨是心靈毒藥


    在遭到失敗之後，我們會本能的給自己找一些「藉口」，拿社會、制度、生活、機會、運氣、老闆、配偶當作出氣筒。


    如果一個人被這種心態所控制，就會對別人的成功和幸福心存反感，而認為生活和命運總是對自己不公。這樣的人，特別容易生活在怨恨和自暴自棄中。


    怨恨是人的一種心理嘗試，是個人企圖把自己的失敗解釋成不公正待遇，從而讓自己心安理得。如果想要用怨恨去「治療」失敗後的低落心情，就像是給一個受了輕傷的人注射毒品，雖然能暫時消解疼痛，但是帶來的副作用要比眼前的病情更嚴重。


    怨恨是一種對心靈的致命性「毒藥」，它斷絕了你獲得快樂的機會。而且，怨恨本身需要消耗龐大的精神。失敗之後，與其花費精力去怨恨，還不如把那些精力用在東山再起上，說不定你就能夠獲得成功。


    由於有前科者再犯率越來越高，所以美國政府委派 FBI 相關專家去探求其中的原因。


