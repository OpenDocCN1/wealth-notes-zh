  - '[PAGE 243]


    形成一種熟悉的感覺。『熟悉』有時候等同於安全。有了這種感覺，我們會顯得更加從容鎮定，就不容易暴露自己。


    根據案例我們可以知道，熟悉這種感覺來自於我們心中的防範或是進攻意識，在熟悉之後，人就相對更有安全感。


    在自身絕對熟悉的一個範圍內，人會展現出極度的自信和鬆弛（當然，也可能表現出如炫耀、驕傲等特點，這是熟悉的負面效應，對藏心不利）。在這種情況下，因為我們更加鎮定，所以能夠更好地藏心。


    所謂藏心，其實關鍵在於人對自己情緒或是狀態的熟悉。


    如果一個人對一切已經熟悉，那麼他就先具有了「掌控一切」的意志和心理基礎。而擁有掌控心態的人，對於任何突發事件都會呈現出比較平淡的反應。這是因為他們心中自認為有控制一切的能力，所以在「大事」面前，他們顯得比較淡定從容。


    因此，對一切熟悉的人往往表現出另一種見慣了大場面的自信，在任何時候，他們都保持著鬆弛的狀態，這種鬆弛的狀態其實是我們內心的一層保護膜。因為你鬆弛，所以你沒有破綻和漏洞，別人也就更難以看穿你的內心，這就類似電影中高手們所說的「無招勝有招」吧！'
  - '[PAGE 244]


    # Ⅰ 鎮定，處事更有條理


    生活中，我們常常被一些「無所謂」的事情搞得非常「不淡定」，慌了手腳。比如，公司明天要開一個重要的會議，公司的高層們全都會出席，而你的部門要你屆時當著所有人的面發言。


    想到要在那麼多人面前發言，也許你感到有些恐懼，並引起你的逃離反應，整整一天，都顯得非常焦躁。對你而言，你想獲得發言的機會，因為這對你的晉升非常有利。但是你卻產生了本不應該有的恐懼心理，陷入到苦惱之中。恐懼心理可能會讓你在明天的會議中顯得不夠自信，甚至可能因此影響你的發揮。


    其實，我們的緊張和焦慮情緒，往往是由於我們在精神上總想逃離或逃避某件已經決定要做的事而產生的。事實上，因此而產生的逃離反應，完全可以根據自己的內心力量來糾正。


    1987 年，四名 FBI 探員在追捕一名逃犯時，被狡猾的逃犯引入到危險的南美叢林裡。在那裡，他們迷失了方向。


    在原始叢林中迷失方向是一件非常可怕的事情，因為那裡潛藏著無數的危險和殺機，稍有不慎，就會喪命。


    即便是在這樣艱難的條件下，探員沒有忘記自己的使命。經過一番尋覓，他們終於抓到了那名逃犯。


    被逮捕之後，那名窮凶極惡的逃犯依然不知悔改，他狂笑著對四名探員說：「你們費盡心思抓我，現在終於如願以償了。但又有什麼意義呢？這裡是原始叢林的最深處，你們不可能活著出去，而我根本就沒打算活著。」


    面對逃犯的這番話，一個探員回答說：「因為你的內心已經'
  - '[PAGE 245]


    對自己絕望了，你對生活充滿畏懼，所以你才會走上邪路，才會把自己引向死亡之地。而內心真正強大的人，則永遠不會放棄活下去的希望。


    在之後的一個星期中，四名探員帶著這名逃犯跌涉在原始叢林中。經過千辛萬苦，他們終於走出了茫茫叢林，重獲新生。


    事後，死裡逃生的探員們在接受採訪時，說了這樣一句話：「內心是一種力量，心中有光明則無所畏懼，而心中黑暗，則將自己引入死地。」


    作為一名探員，經常會遇到些危險的事情。但是他們的內心似乎具有強大的能量，他們不會因為危險而驚慌失措。在外人看來，這不是一般人所能達到的境界。


    正如 FBI 探員所說，我們能達到怎樣的高度，完全取決於我們內心的力量。如果你決定要將一件事進行到底，又何必在精神上老是希望躲開或者逃避呢？


    只有內心力量真正強大的人，才能做到不為外界的因素所干擾，做到「泰山崩於前而不變色」。也只有這樣的人，才能杜絕一切恐懼，永遠保持鎮定，不會被人輕易看穿。


    美國聯邦調查局第一任局長胡佛曾經說過：「如果一個探員敢於出沒最危險的地方，那麼他犯再大的錯誤也錯不到哪兒去。」也就是說，遇到問題越是想逃避，那麼犯錯的機率就越大；如果你能勇敢地面對，即使犯錯，也是能夠挽回的。


    這個規律在我們的「藏心術」中依然適用，有時候，我們越是害怕自己「暴露」，越是容易被人看穿。因為你的恐懼會出賣你。而那些真正能夠藏心的人，都是「勇者」，因為他們不會畏懼，所以才能揮灑自如。'
  - '[PAGE 246]


    # 別讓人一眼看穿你

    觀心與藏心的攻防智慧


    一個人如何才能在人生中更加勇敢無畏？關於這個問題，我們可以用心理控制相關的知識去回答。


    當一個人自信不夠、內心又不強大時，他對外界的反應會顯得非常激烈。比如，一個人個子很矮，小時候經常被人嘲笑。長大後，如果他還因此極度自卑的話，那麼就會非常在意別人對他身高的評價。如果有人在身高上和他開玩笑，他的反應一定會非常激烈，因為他無法掩飾自己內心的憤怒情緒。


    但是對於那些內心強大的人來講，就不容易情緒失控，即便是有人惡意嘲笑他們，他們也能從容應對。這是因為他們有足夠的自信，他們是生活的勇者。


    那麼，我們現在要討論的一個問題是：為什麼人的內心會有強大、弱小之別？


    透過日常觀察我們會發現，有些人能力很強，但是有時候常常因為心靈意志薄弱而壞了事；有些人能力雖然一般，但是關鍵時刻卻能穩住自己，藏住內心的負面情緒，反倒是無往不利。


    由此可見，在這個世界上，客觀的因素固然重要，但是主觀的能動性也不容忽視。對每個人而言，其實大家在能力上都差不了多少。所以，成功者和失敗者最主要的區別就在於他們的內心：成功者的內心更強大，而失敗者則往往難以掩飾自己心中負面的東西。


    成功者不是沒有恐懼之心，但是他們能夠很好地隱藏自己的恐懼，讓理智占領思想的高處。對於那些善於藏心的成功者而言，在遇到重大的事情時，他們不會馬上表現出惶恐、不知所措的情緒，而是顯得更為清醒，所以他們能透澈地分析形勢，在腦中形成應對的方法。


    如果我們將自己的生命用在恐懼、猶豫、左右不定上，那麽'
  - '[PAGE 247]


    最終會一事無成。在任何時候、採取任何行動，我們都有可能犯錯。但我們千萬不能因為害怕出錯，就止步不前。


    從「藏心術」的角度而言，一個人在猶豫不決的時候，最容易暴露自己。相反，不管任何時候，如果你能保持鎮定，那麼你就能更好地隱藏自己的內心。我們可以想一想，在生活中，那些被人稱作是「有城府」的人，是不是都顯得比別人要鎮定許多？


    李·艾科卡（Lee Iacocca, 1924.10.15 - ，美籍企業家，先後任福特汽車公司和克萊斯勒汽車公司總裁）曾說，鎮定是他在成功者身上找到的首要素質。正是因為處事冷靜，這些人才一呼百應，不負眾望。


    事實上，我們所說的「藏心術」，並不是單純掩飾自己內心的一種法門，更是一種讓自己內心力量逐漸強大起來的訓練方法。


    藏心的關鍵，不在於外在的方法，而在於如何讓自己的內心變得更強大。因為只有一顆足夠強大的心，才能讓你在任何時候都保持鎮定，在此基礎上，所有的方法、理論才能運用自如。'
  - '[PAGE 248]


    # 積極面對，逃避只讓事情越來越糟！


    藏心的主旨在於隱藏自己的真實想法，或許很多人會因此認為：藏心是一種消極的、被動的心理狀態。我們可以很明確地告诉大家，這種認識是錯誤的，恰恰相反，若想更好的藏心，其實需要你積極主動地去面對生活中的事物。


    對於普通人而言，碰到一些緊急事件時，他的第一反應就是逃避，這是一種消極的心態。因為有了逃避之心，所以我們會變得驚慌失措，顯得不鎮定，從而更容易暴露自己的內心想法。所以，要想藏心，我們還是要積極面對，不能讓自己的逃避心理輕易占據我們的思維。


    也許我們都有過這樣的體驗，對於即將發生的那些「壞事」，自己心裡常常惴惴不安，但是當這件事情已經擺在眼前，我們已經無路可退的時候，整個人反倒顯得鎮定從容得多。這就是面對的力量。當你下定決心去面對的時候，就意味著你已經接受了一切後果，你不會再逃避，所以你會更強大。


    或許，我們只是在情勢的逼迫之下，才不得不去面對生活中的一些突發事件。而「藏心術」，則要教會你用積極主動的心態去迎接生活中的一切艱難時刻。


    為什麼我們在預想未來時，總是覺得前路坎坷？為什麼我們對未知事物總是充滿恐懼？其實歸根究底，就是因為還未做好積極面對的準備。


    當學會積極面對的時候，你會發現，你擁有鎮定從容的心態。在這種心態的驅使下，將不會因為一些突發事件而顯得驚慌，無論外界有什麼樣的變化，你都不會過早暴露自己內心的負面情緒。'
  - '[PAGE 249]


    「可以確定的是，每一位探員，都是生活的勇者。」這是 FBI 首任局長胡佛說過的一句話。


    在胡佛十一歲的時候，小胡佛做了一件出人意料的事情。一家人吃過晚飯後，小胡佛跑到自己的房間，拿出一張自製的報紙，發給全家人。


    這張自製報紙的內容是小胡佛自己收集的他認為重要的新聞情報，當時他向家裡人宣布：「我的每份報紙收取一美分的報酬，你們都要訂閱。」對於孩子的這個舉動，胡佛的家人都十分支持，他的媽媽說：「好的，我喜歡我們的小情報員收集的這些情報。」


    小胡佛之所以這麼做，是因為他喜歡收集情報。雖然當時的他可能還不知道自己將成為世界上最大情報組織的掌門人，但是他依舊積極主動的為自己爭取每一次「收集情報」的機會。


    胡佛掌管 FBI 之後，這個「過分積極」的局長成了所有 FBI 探員的噩夢。他規定探員必須實行「強制性自願加班」政策。


    在胡佛的手下，探員被迫早晨七點就要上班，比一般的工作時間提前了兩小時。這是一個常態化的規定，更是雷打不動的規矩。如果遇上工作需要，甚至要在凌晨二點的時候從溫暖的被窩裡鑽出來去逮人，或者加班到清晨。


    當時有些探員為了消磨時間，就到附近的咖啡廳。那段時間，挨著 FBI 辦公地點的咖啡館生意出奇的好。


    胡佛知道情況之後，十分生氣。星期五這天，胡佛叫來自已手下的一個探員，對他說：「今天你到咖啡廳去，只做一件事情，就是把在那裡喝咖啡的探員的名字給我記下來。」


    這個探員就照胡佛說的去辦了。當他把這份名單交給胡佛的時候，胡佛心滿意足地笑了。然後，這些人相繼被各種各樣的藉'
  - '[PAGE 250]


    # 別讓人一眼看穿你

    贈心與藏心的攻防智慧


    口踢出門外。胡佛常說：「我對那些無所事事的人非常不理解，因為我總覺得我們每個人都有做不完的事情。」


    正因胡佛的積極主動，FBI 逐漸成為世界上最有效率的情報部門之一。


    胡佛的故事告訴我們一個道理，只有積極主動，才能將事情做得更好。這個道理，在藏心術中同樣適用。


    在你需要隱藏自己的內心時，積極與消極是成敗與否的關鍵。你有沒有信心去戰勝自己內心的負面情緒，是你能否藏心的關鍵。


    當你的上司不相信你的能力，你應該積極的證明自己，而不是整日愁眉緊鎖，讓人一眼就看穿你心中的不滿和壓抑；你和你的同事相處得不好，你應該積極地去嘗試與他溝通，而不是避得遠遠的，讓人家明顯感覺你心中的疏遠……


    退讓只能暫時逃避問題，並不能從根本上解決問題，出了這個圈子有可能會遇上更麻煩的問題。要想讓自己變得更強大、更鎮定，請學會積極面對。'
  - '[PAGE 251]


