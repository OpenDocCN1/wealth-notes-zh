    所以，在實踐活動中，如果你經常對某種事物產生恐懼，就更應該主動、積極地去接觸它，從而消除恐懼。例如社交恐懼，在有陌生人的場合中，如果倘促不安，處處謹小慎微，臉紅心跳，語無倫次，那你就要經常參加聯誼活動，逼迫自己與陌生'
