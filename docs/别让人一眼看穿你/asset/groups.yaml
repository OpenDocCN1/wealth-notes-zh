    # 別讓人一眼看穿你


    讀心與藏心的攻防智慧


    還有幾種比較難以發現的動作，看起來很酷，但其實也屬於手部的約束性動作，比如將雙手插入口袋。還有新手主持人用一隻手拿住麥克風，另外一隻手插入口袋。


    當然，不瀟灑的手部約束也有，比如用袖子將手攏起來。這個動作看起來是因為冷，但也可能是由於緊張而導致的手部約束。


    其實，這些姿勢的出發點是一致的——透過外力來約束手部。這些手的反應在具體的情境中，都是在不知所措的情況下所產生的凍結反應，映射了內心的緊張和焦慮。


    肢體語言所反映的凍結反應還體現在腳上。


    腳上的凍結反應主要體現在，當人感到恐懼時，立刻會把腳擺到即將要逃跑的狀態中。此時，人的腿部為了準備逃跑而會大量充血，身體其他部分則供血不足，會產生手心發涼的後果。


    某所學校發生了一起女教師被謀殺的案件，FBI探員迅速趕往學校，對學校中的可疑分子進行排查。


    但是經過一番調查，探員發現，學校沒有一個人和這位教師有過衝突，根本就沒有人有理由殺害這位教師。


    無奈之外，探員只好和校長握手告別，另謀線索。


    但是在和校長握手的時候，探員發現這位校長手掌冰涼。FBI探員認定，這位校長是在內心極度恐懼的前提下才產生了這樣的「凍結反應」。


    他為什麼會感到恐懼？是不是和案件有關？抱著這樣的疑問，FBI探員把偵察對象放到了校長身上。


    根據調查，終於真相大白。原來，這位校長和女教師有私情，而女教師則以此威脅校長，校長無奈之下，終於痛下殺手。


    一起殺人案件，就在一次不經意的握手中，找到了真相！


    除了呼吸和手腳的反應之外，凍結反應還有一個體現，那就是表情。


    一般情況下，在凍結反應中，人的臉部表情會瞬間僵化。如果負面刺激壓力過大，凍結反應也會呈現在臉上，讓人失去禮儀和修養的矜持，表現為臉部肌肉僵化，表情僵硬。在這個過程中，即使是最靈活的眼睛也會表現得滯澀，雖然因為需要繼續觀察，還會輕微的運動，但總體上是會盯著負面刺激源頭，以便尋找後續的解決方案。


    所以，如果你發現一個人表情僵硬、眼神呆滯，總是盯著一個地方，那麼他很可能是產生了凍結反應。而他所盯著的地方，就是讓他感到恐怖之所在。


    以上種種表現，都是凍結反應的結果。而接下來，我們將教大家如何避免這些凍結反應，藏住自己內心的恐懼！


    ## 凍結反應的減敏法則


    要想真正抑制自己的凍結反應，或者說讓自己的凍結反應表現得不那麼明顯，我們還需要從消除凍結反應的根源做起。


    我們知道，凍結反應的根源就是我們心中的恐懼和不安。所以要想消除我們的凍結反應，第一步就是抑制內心的恐懼。


    在生活中，能給我們帶來恐懼的事情太多了。寂靜中的一聲驚雷、黑暗中一閃而過的身影，甚至是在社交時遇到一個陌生人（即所謂的社交恐懼症），都能引起我們的凍結反應。


    而事實上，在大部分時候，我們的恐懼其實是毫無必要的，那些讓我們感到恐懼的東西並不能帶給我們任何實質性的傷害。所以，我們的恐懼僅僅是一種心理作用。所謂心病還需心藥醫，若想消除恐懼，我們需要想辦法讓自己的心理變得更強大一點。


    在 FBI 的訓練科目中，有一項叫做「深入敵後」。在這個訓練中，FBI 探員會被派遣到一個完全陌生的地方，獨立完成一項任務。


    一個人到一個陌生的地方，而且是去執行危險的任務，甚至連一個能夠在一起說說話的人也沒有。此時，探員所要面對的不僅僅是對敵人致命威脅的恐懼，還要承受對孤獨的恐懼、對陌生環境的恐懼……


    FBI 之所以這麼做，就是因為他們知道：若想沒有恐懼，就必須先讓自己習慣於恐懼。所以，他們才會把自己的下屬放置於孤立無援之中。


    事實證明，FBI 的這種訓練方式是非常有效的。很多承受得住考驗的探員，在任務結束之後，都大有長進。他們變得更沉穩幹練，更善於隱藏自己。這些能力，都是他們在極度危險的條件下，在高強度的恐懼中練就而成的。從此以後，無論將他們派到任何危險的地方，他們都會從容不迫。因為他們的心，已經在磨練中漸漸強大起來！


    FBI 這種置之死地而後生的訓練方式，或許可以給我們一些啟發。在我們感到恐懼，因為恐懼而暴露自己內心的時候，我們更應該去主動接近那些讓我們感到恐懼的東西，你會發現，自己的恐懼會逐漸消失。在心理學上，人們將這種鍛煉方法叫做「循序減敏法」（Systematic
    Desensitization）。


    所謂「循序減敏法」，就是讓人反覆接受恐懼刺激物的刺激，使其逐漸適應這種刺激物，逐步消除自己的恐懼。比如，有些人非常害怕打針，但是如果他患了一場大病，每天都需要打針，過幾個月你就會發現，這個人對打針的恐懼已經完全消失，因為他習慣了。


    如果我們想要更好的藏心，不妨採用循序減敏法來提高自己的藏心能力！假如一個談判新手需要和一個重要客戶談判，肯定會感到緊張。在談判現場，他很可能因為恐懼而產生凍結反應，被對方看出他的底限。但是如果這個人經歷過許多類似的談判，那麼他一定會從容得多，心機也藏得更深，就能更好地勝任自己的工作。


    所以，在實踐活動中，如果你經常對某種事物產生恐懼，就更應該主動、積極地去接觸它，從而消除恐懼。例如社交恐懼，在有陌生人的場合中，如果忐忑不安，處處謹小慎微，臉紅心跳，語無倫次，那你就要經常參加聯誼活動，逼迫自己與陌生人打交道。那樣，你就會在交往中得心應手，落落大方，瀟灑自如，社交恐懼也就消除了。


    我們曾反覆強調，生活當中大部分產生凍結反應的恐懼，都是一種心理作用，你沒必要因此而畏縮不前。你不能因為這一次你沒有處理好一件事──被看穿、被識破，最終功敗垂成──就覺得：我永遠也做不好，我無法克制自己的恐懼，我不能從容自如，我不能隱藏自己。事實上，只要你多去經歷，多去感受，終有一天你能夠做好的。


    ## 轉移內心的恐懼


    現實生活中，減敏法是非常有效的，但是這個方法有一個缺點，那就是需要有計畫的、長時間的練習和堅持。假如我們遇到了什麼突發事件，減敏法就沒有什麼作用了。而在我們的生活
    中，突發事件不在少數，有時候我們更需要在突發事件中隱藏自己的真實想法。所以，我們還需要另一種方法來對抗恐懼，以達到在危急關頭藏心的目的 —— 「轉移刺激法」。


    所謂「轉移刺激法」，就是把自己的注意力從引起恐懼的刺激物上暫時移開，這樣雖然並不能消除對某種事物的恐懼，但是卻能暫時消除懼怕心理，以達到在面對突發事件時藏心的目的。


    FBI 探員傑森曾經遭遇過一次生與死的考驗。在某次執行任務的過程中，他被窮凶惡極的歹徒抓住了。由於他曾經多次破壞歹徒的犯罪行為，所以歹徒對他恨之入骨，不願意馬上打死傑森，認為那樣算是便宜了他。


    歹徒將傑森帶到一個密室中，綁住他的手腳，然後狂笑著對傑森說：「你將在這裡度過你的餘生。我們很仁慈，不會輕易殺人。哈哈哈！」說完歹徒就轉身離開，在臨出門的時候，歹徒又回過頭對傑森說：「忘了告訴你一件事情，這裡有一顆定時炸彈，將在兩天後，也就是四十八個小時之後爆炸，你好好享受你的生命吧。」說罷便將沉重的大門關上了。


    在一聲悶響之後，一切都歸於平靜，緊接著，密室裡的燈光也滅了。在黑暗的密室中，空氣似乎都凝結了。


    在那一剎那，傑森陷入短暫的恐懼中。的確，在無邊的黑暗和寂靜中等待死亡，確實是一件讓人崩潰的事情。傑森知道，現在唯一的生路，就是等待自己的隊友來解救自己。而這唯一的生還希望，其實也非常渺茫，因為隊友不見得能找到這裡，更不見得能在炸彈爆炸之前找到這裡！想到這裡，傑森的心沉了下去。但是他馬上意識到，如果任由自己的恐懼心理蔓延下去的話，自己的精神恐怕很快就崩潰了，自己說不定會在爆炸之前就已經被嚇死了！


    想到這一點，傑森就打起了精神，試圖忘掉自己當前的慘境。但是瀕臨死亡的恐懼是無法克制的，百般無奈之下，傑森絕望地唱起了歌。作為一個搖滾歌曲愛好者，傑森開始想像，自己站在舞臺上為數萬人歌唱。逐漸地，他在歌聲中忘記了自己的處境。


    就這樣，傑森開始無休止的歌唱。他不知道時間，不知道疲倦，完全進入了另一個世界。終於，他的歌聲被打斷了，因為有人把門打開了，是他的隊友！


    當其他 FBI 探員看到傑森的時候，他們完全不能想像，這個聲嘶力竭唱著歌的人已經在死寂的黑暗中待上整整三十個小時！更可怕的是，他隨時面臨著死亡的威脅！而現在，他的表情卻像是一個超級巨星在舞臺上表演。


    事後，傑森的故事成了 FBI 的奇蹟。許多任職於 FBI 的心理學專家都說：這本身就超乎想像，因為一個人在絕對的黑暗和寂靜中待上十二個小時，就將面臨心理崩潰；如果這樣的環境中還有一顆隨時會爆炸的炸彈，我想普通人連五個小時也堅持不了；但是這個人卻在裡面「饒有興致」地待了整整三十個小時，絕非常人能夠做到。


    我們回過頭想想，傑森之所以能戰勝恐懼，是因為他成功地轉移了對恐懼的注意力，這是對我們最大的啟發。


    如果我們想要藏心，不想被人看穿自己的內心，透過轉移注意力的辦法，不去關注那些讓自己恐懼的事情，恐怕是個非常好的方法。


    有一個自卑感很強的男士，經過長期的摸索，發現轉移注意力可以有效地轉移自己對自身缺點的注意。當他轉移了注意力，腦子裡就不再有自卑感和因為害怕出醜而產生的恐懼。這樣一來，他的行為舉止就自然回歸了本性。在別人眼裡，他成為自信從容的人。而他身上即便有缺點，也就不容易被別人輕易發現了。


    其實，這位男士就是採用了轉移法來藏心。


    恐懼就是這樣一種東西，你越是想越是害怕。索性什麼都不想了，你就會發現，那些讓你感到恐懼的事情，其實也沒什麼。所以，我們在恐懼面前應該學會「轉移」，這樣就不會暴露自己的內心了。


    ## 心靈之窗的出賣


    如何避免凍結反應來隱藏我們的內心？首先你要「管住」你的眼睛。


    人們說眼睛是心靈之窗，確實我們很多情緒都是透過眼睛透露出去的。由於人們在談話的時候，第一個觀察到的地方就是對方的眼睛，所以管住自己的眼睛往往就等於隱藏了自己的內心。許多人就是由於沒有管住眼睛而被人看穿的。


    FBI 知道對於狡猾的人來說，他的眼神要比語言可信得多。桌子對面的男人小心謹慎地回答 FBI 探員提出的問題。他既不是謀殺案的主要嫌疑人，也有充分的證據證明自己案發當時不在現場，但探員依然不停地追問：


    - 「假如你參與這宗案件，你會使用槍嗎？」

    - 「假如你參與這宗案件，你會使用錘子嗎？」

    - 「假如你參與這宗案件，你會使用冰鏟嗎？」


    其實，冰鏟正是作案的工具，所以探員想看看嫌疑人聽到兇器名稱時，會作出何種反應。


    果然，那男人一聽到「冰鏟」這兩個字時，眼皮垂了下來。根據這一點，他被作為第一嫌疑人調查，隨後的事實證明他沒被冤枉。


    上面是 FBI 探員喬·納瓦羅敘述的一件事情，證明了臉上最為誠實的部位，就是眼睛。那麼，如何管住自己的眼睛，避免暴露心中的想法，防止凍結反應？


    如果你感覺心中有壓力，就盡量將視線轉移到美好的事物上去，讓自己的心境好起來，以此來掩飾心中的負面情緒。也就是說，你不要總把目光放到那個讓你感到恐懼的地方，那樣會暴露你的內心。


    當然，你的眼神也不能過於游移，因為凍結反應還有一個表現，那就是眼珠亂轉，這也是內心恐懼之後的一種表現。所以在危險時刻，你一定要把眼神放在一個能讓你感到愉悅的地方。當你的眼中盡是歡欣之情的時候，誰也不能發現你的恐懼。


    管住了眼睛之後，你還要管住自己的手。很多人在「心裡有鬼」之後，會顯得手足無措，或是下意識的做出反應，這會極大地暴露自己的內心想法。相反，如果能夠控制自己的手，就會藏住自己的心。


    在這裡，我們用一個耳熟能詳的例子來說明，克制自己手部凍結反應來避免暴露內心想法的技巧。


    東漢末年，曹操持短劍去刺殺董卓。當時董卓背對曹操，曹操乘機拿出短劍，準備下手。而此時，董卓卻突然轉過身來。這時曹操肯定是非常驚懼的，如果他產生了凍結反應，要麼是僵住不動，要麼是下意識的逃跑，那麼他的小命就難保了。但是曹操卻沒有被凍結反應所控制，而是順勢說：「我要把寶劍贈與你。」從而避免了殺身之禍。


    曹操的這個案例，就說明了避免凍結反應的好處。但是我們如何才能修煉得和梟雄曹操一樣厲害呢？


    首先，你要鍛煉自己對情境的掌控感。比如，一檔很受歡迎的電視節目主持人在自己的攝影棚，即使人再多，場面再大，也不會感到恐懼。為什麼呢？因為他能掌握這個情境。


    FBI為了鍛煉對情境的掌控感，常常會進行一些「非人」的訓練。為鍛煉特戰隊員的心理強度，會把他綁在即將駛來的火車鐵軌上；在實彈射擊中間，假人旁邊就站著你的隊友。總而言之，他們要的，是在任何危險情況下都能保持冷靜的人。


    一些退役 FBI 探員說：「我們並不需要那些在酒吧鬥毆中的打架能手，我們真正需要的是這樣的人：他能夠走進一個酒吧，立刻意識到這不是個好地方然後馬上離開。」


    在緊張局勢下執行任務時，能否冷靜觀察可能意味著是消除危機還是引發危機。


    1996 年 4 月，一支 FBI 探員隊降落在賴比瑞亞的蒙羅維亞，以幫助那裡的美國人和其他國家的人擺脫內戰威脅。此時情況已經很複雜，恐怖分子在使館附近擒劫，站崗的探員遭到槍擊。狙擊手朝使館裡開槍，直升機飛行員偶爾看到流彈從擋風玻璃前掠過。


    但是，在將近兩週時間裡，這支探員隊未發一槍，撤退了二千一百二十六人，最大限度減少了在使館周圍交火的可能性。


    FBI 之所以能在任何時候都保持冷靜，是因為他們在訓練中已經模擬了任何危險的場景。如此在鐵軌上面對火車，或對著離隊友很近的假人開槍。他們適應了這樣的場景，所以能在這般的場合中保持冷靜。


    我們不會經歷那樣的危險時刻，所以不用將自己放到火車鐵軌上，但是我們可以模擬一下可能會感到緊張的場合。


    比如，你去面試之前，如果害怕緊張，可以找個人扮演面試官，來提問一些面試中可能會問到的問題，然後你做回答。


    你在女孩面前總顯得不知所措，可以多嘗試著和一些女孩約會，時間久了，你適應了那個場景，就不會再感到緊張，更不會產生凍結反應了。


    總而言之，情景再現，是避免凍結反應的一種好辦法。


    除了情景再現之外，還有很多辦法可以避免凍結反應，下面我們將再進一步講述。


    ## 視線露了餡


    什麼能引起我們對恐懼的反應？是聽到的聲音？是觸摸的感覺？還是親眼目睹的恐怖事物？相信對於大部分人來講，更傾向於第三者。


    所謂耳聽為虛、眼見為實，那些被我們直接看到的事情，更能帶動我們的情緒。比如，如果有一個人在給你講一個恐怖故事，即使他講得再好，你也可能僅僅是稍有恐懼。但是，如果故事中的那些場景，是你親眼看到的呢？那時你的恐懼感，肯定要比僅僅是「聽說」大得多。


    眼睛除了能夠帶給我們最為直接的感受之外，它本身也會對外界產生直接的反應。瞳孔實驗就生動地證明了這一點：人們在看到喜歡的事物時，瞳孔會放大；在看到不喜歡的東西時，瞳孔則會縮小。


    之所以會產生這樣的反應，其實還是源於人的天性。在瞳孔放大的時候，人能夠盡可能地去觀察自己喜歡的事物；而瞳孔縮小，則意味著人對眼前的事物有逃避心理，以避免受到負面刺激。當然，瞳孔的變化是非常隱密的，一般人是難以察覺的。


    所以，一個人在遇到事情時，如果只有瞳孔發生變化，那他肯定是藏心的高手。他們即使內心波瀾壯闊，外表也不動聲色。但是對於絕大多數人來講，他們在受到視覺的刺激之後，不僅瞳孔會發生反應，還會產生如視覺轉移、眼神飄忽不定等狀況。這樣的人，就更容易被人識破，屬於不善於藏心的那類人。


    FBI 曾經專門研究過人在各種狀態下，眼睛所產生的變化。他們發現，當一個人遇到刺激而產生負面情緒的時候，例如愧疾、心虛、尷尬或者恐懼時，往往會產生視覺逃避。也就是說，他們不會一直盯著那個對他們產生刺激的事物看。這時候，他們的目光會盡量轉向那些讓他們感到愉悅的事物上，這樣他們的負面情緒就會快速衰減。


    但是問題來了，在對方還沒有發現你情緒異常的時候，你轉移視線確實有調整情緒的功效；假如對方已經對你的情緒異常有所察覺，這時候你如果還想用轉移視線的方式來調整自己的情緒，恐怕為時已晚，而且對方很可能會因此確認——這個人一定是在掩飾什麼！那麼，你想要藏心就難上加難了。


    所以，在你已經露出馬腳的時候，不妨鎮定一些，不要讓自己的眼神顯得太過飄忽，這樣才能真正藏心。


    從這裡我們也可以看出，藏心確實需要隨機應變，這世上沒有哪一種方法能讓你永遠不被別人看穿。只有在最合適的場合，選擇最合適的方式，才能做到真正的藏心。在這方面，發生在
    FBI 探員身上的一个經典案例，或許能給我們啟示。


    1987 年，FBI 截獲了一份重要情報：美國政府內部有某敵國的一個間諜。當時 FBI 並沒有在第一時間逮捕這個間諜，他們想利用他，向敵國傳達一個錯誤的情報，上演一齣「反間計」。


    FBI 獲悉，這個間諜下一步的任務是盜取一份機密文件。所以他們造了一份假檔案，就等著間諜「自投羅網」。與此同時，FBI 還安插一個探員進入到政府部門，專門負責保管檔案。探員的任務，就是「指引」間諜盜取假檔案。


    探員在進入政府部門之後，很快就和周圍的同事建立了良好的關係，當然，也包括那個間諜。作為一個「新人」，和老員工搞好關係是件很正常的事情，所以探員的這一舉動並未引起那個間諜的懷疑。


    某一天，那個間諜主動邀請探員到自己家共進晚餐。探員知道，間諜一定是想從自己口中套話。雖然自己的任務就是告訴對方「假檔案」的具體位置，但是如果太過刻意的話，肯定會讓對方懷疑。而且，作為專門保管檔案的負責人，那樣也顯得太沒有專業素養了。對方怎麼能相信呢？探員決定要一些小花招。


    席間，間諜和探員邊喝酒邊聊天，聊的都是些家常話。探員知道，真正的考驗還沒有開始，好戲還在後頭。


    果然，飯過五味、酒過三巡之後，那個間諜嘆口氣，說：「我真羨慕你們這些搞後勤工作的，天天在辦公室閒坐。哪像我們，每天要面對那麼多事情，整天提心吊膽的應付上司。」


    探員連忙道：「別這麼說，我們這活也不見得好到哪裡去。最近幾天，第三檔案室……」說到這裡，探員趕忙停下了話，還裝作非常緊張的樣子，眼神飄忽不定。


    間諜見狀也沒多問，岔開了話題。探員心中暗想：「果然上鉤了。」


    幾天後，藏在第三檔案室的那份假檔案果然有被人動過的痕跡……


    這個案例中的 FBI 探員，為了讓對方相信自己說的話，故意表現出一種試圖掩飾自己內心的狀態，這屬於反其道而行之的藏心術。更為關鍵的是，在這個過程中，他眼神發揮很大的作用，這讓對方堅信：這個人所說的一定是真的，因為他想掩飾自己！而探員則透過這種方式，將真相隱藏起來。這可以算作是藏心的另一層境界了。


    其實，我們如果想要掩飾自己的真實內心，不妨透過對視線的控制，先讓對方相信「假像」。這種方式，我們在生活中其實經常可以看到。


    比如，你買一件衣服，這件衣服老闆開價二千，而事實上，這件衣服賣到一千二老闆還有得賺。但是當你砍價砍到一千六的時候，老闆便做出一副痛心疾首的樣子，眼中充滿了不可能、絕對不賣的神情，並且對你說：「我這進價就一千六，你再多給點。」這種情況，其實老闆就是想將你引到一個假象中，以隱藏自己心中真實的價格定位。


    藏心是一門特別高深的學問，這裡沒有什麼固定的路數可言，只有活學活用，才能做到最好。而本篇，就是想讓大家知道，對於自己視線的小小控制，就能在不同的場合中發揮意想不到的藏心作用！藏心術的「博大精深」可見一斑，我們將在之後的篇幅中繼續介紹。


