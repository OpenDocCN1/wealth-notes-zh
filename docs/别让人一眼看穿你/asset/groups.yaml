    # 理解憤怒，找尋合適的發洩管道


    好鬥不見得完全是一件壞事。一個好鬥的人，證明他心中有對成功的渴望，這是值得肯定的。所以，我們也不必為自己的好鬥而感到煩惱。只要你能理解鬥爭心理，為它提供恰當、合適的宣洩管道，就可以「藏住」自己的憤怒情緒。


