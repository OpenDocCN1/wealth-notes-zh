    # 羨慕→嫉妒→恨，循序漸進的不健康心態


    「羨慕、嫉妒、恨」明顯是一種不健康的心態，作為一個藏心高手，一定要學會隱藏和克制自己的這種心態。


    所謂羨慕，就是當看到別人比自己強的時候，把別人看得比自己高。所謂人往高處走，當看到別人比自己強的時候，就會產生向對方「靠攏」的心態。如果自己與別人差距太大，沒有什麼可比性，也就是心理學上說的「自我邊界感明顯」；此時，人不會因為羨慕而產生嫉妒。


    比如，我們羨慕愛因斯坦的高智商，羨慕比爾·蓋茲的財富，但是我們不會嫉妒他們，因為人家智商高、有錢，跟我們沒有直接競爭關係、利害關係。而且我們也不太可能成為他們那樣的人，所以他們強大是他們的，與我們的強大或是弱小不相干，所以我們也不會去憎恨他們——對於自己認同的對象，愛得多，恨得少，就叫「羨慕」。


    假如我們發現自己身邊的某個同事或同學比我們強，我們對他們也會產生認同感，想讓自己成為他們那樣的人。可是，因為我們有機會和他們近距離接觸，這時候，我們可能會認為「他的長相比我更漂亮」、「他的智慧比我更出色」、「他的身體更有力或更有曲線」。這時他們的優秀就會顯得自己更平庸。在和這些人相處時，我們會感到壓力，會覺得自己不如別人，會氣惱他們為什麼總是比我們強！從而使我們的內心產生低自信、低自尊。


    所以，在嫉妒的時候，其對象與自己往往是平等地位的人，條件本來是差不多的人，如同學、同事、兄弟姐妹等。'
