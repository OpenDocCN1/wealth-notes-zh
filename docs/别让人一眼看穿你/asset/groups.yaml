    ## 一 從眾反應


    一般情況下，個人的行為通常有隨波逐流的趨向。這是因為一個人如果發現自己的言行和別人不一致，或與群體中大多數人有分歧時，就會自然而然產生心理上的壓力，只有服從「大多數」的時候，這種壓力才會消失，這就是我們所說的從眾反應。


    從眾反應在現實生活中很容易被觀察到。比如，大街上有兩個人在吵架，本來是一件小事，但是卻吸引了一大堆人圍觀，結果被吸引來的人越來越多，最後連交通也被堵塞了。


    美國社會心理學家曾經用這樣的一段文字來形容從眾反應：


    人潮湧動的大街上，突然有一個人開始奔跑。也許是他突然想起不久後要和情人約會，便急不可待的想要跑到約會的場所。總之，他在大街上跑了起來，向東跑去。


    在這個人開始奔跑之後，另一個人也開始奔跑，他是一個興趣勃勃的報童；然後，一個身材微胖的紳士因為有急事，也開始向東奔跑。


    在接下來的十分鐘之內，你會發現，大街上所有的人都開始奔跑。他們不知道自己因為什麼奔跑，只是看到別人都在跑，所以他確信：一定是有什麼值得逃跑的理由。


    以上這個案例，雖然看起來有些誇張，但是在從眾心理的驅使下，這種場景是很可能發生的。從眾心理對人的影響是如此之大，大得超出你的想像。


    由於從眾反應是一種比較普遍的社會心理和行為現象，我們


    ## Step 4 自主 / 不盲目，養成獨立思考的習慣


    也不能完全否認從眾反應。在一定程度上，從眾反應有助於學習他人的智慧經驗，擴大視野，克服固執己見、盲目自信，修正自己的思維方式、減少不必要的煩惱如誤會等。


    但是，一個人如果陷入盲目的從眾反應中，這時從眾反應的負面特點就會顯現出來：抑制個性發展，束縛思維，扼殺創造力，使人變得無主見和墨守成規。


    1947 年 7 月 4 日，美國羅斯威爾發生了一些不平凡的事情。當時，一個不明飛行物從天而降，美國政府隨後命令 FBI 封鎖了現場。


    在那之後，關於「羅斯威爾發現飛碟」的消息就傳了出去。 FBI 根據調查發現，在當地至少有幾千人信誓旦旦地說：「我見過那架飛碟。」而事實上，這根本是不可能的，當時正是晚上，而且發生的地點是在荒郊野外，根本不可能有那麼多的目擊者。


    FBI 專家分析說：「之所以有那麼多的人聲稱自己見過飛碟，一方面是有一些人在胡亂編造事實，另一方面則是從眾反應在搗鬼。」專家最後無奈地說：「因為從眾反應，許多人成為了謊言的傳播者。」


    正是因為從眾反應的不斷擴大，讓羅斯威爾神秘事件變得更加撲朔迷離。


    近些年，經常會有這樣的情況發生：在眾目睽睽之下發生的意外災難，周圍的人都在充當觀眾，沒有一個人願意伸出援手。其實從心理學角度來講，這也是一種從眾反應。這種從眾反應讓社會職責分散化，由於第一個看到的人不願意伸出援手，所以越來越多的圍觀者都加入到了觀眾的行列中。


    ## 別讓人一眼看穿你

    藏心與藏心的攻防智慧


    這就是從眾反應的負面性。作為一個有良知的人，我們一定要克制自己「從惡」的從眾反應。我們一定要知道：每個人都是與眾不同的，盲目的從眾將會讓自己失去特有的魅力。保持獨立的思想，融入大眾的群體，才是可取的人生態度。


    正因為人的內心潛藏著從眾反應，所以有時候我們都會感覺「人在江湖，身不由己」。當你希望掩飾或是抑制自己心中的各種想法時，從眾反應就可能從中作梗，從而暴露你的內心想法。


    要想克制自己心中的從眾反應，我們就要先搞清楚從眾反應產生的根源。


    首先，在群體中，個體如果過於標新立異，往往會遭到群體內其他人的孤立。對於普通人來講，他會覺得：我的意見如果和大部分的人一致，就永遠不會犯錯。


    其次，從眾反應還源於群體對個體所產生的無形壓力。一些個體雖然知道大多數的人是錯誤的，但是迫於這種壓力，他們還是會違心地選擇服從多數。


    雖然每個人都有從眾反應，但是每個人從眾程度都不同。一般來說，女性更容易受到從眾反應的控制；另外性格內向、自卑感較深、教育程度低、社會閱歷淺的人，更容易受到從眾反應的影響。


    而從眾反應的表现方式也很多，工作中、生活中、學習中，我們都可以看到從眾反應對人的影響。我們瞭解人的從眾反應，並且在現實生活中避免自己陷入到盲目的從眾反應中是非常重要的。


    ## 獨立思考，不被別人牽著鼻子走


    在現實生活中，有一些精明的商家，深諳從眾行為的門道，他們會利用消費者的從眾心理達到宣傳產品、獲取商業利潤的目的。他們透過廣告宣傳、公關活動、媒體報導等手段，在社會中引起轟動效應，激起群眾爭相傳播、議論、參與，從而將自己的商品炒熱，達到盈利的目的。


    許多人會利用人的從眾心理給你設下圈套。你只有保持清醒的自我認識，才能避免上當，更好的「藏心」。


    1983年，FBI探員路易斯奉命進入黑手黨內部臥底。


    由於黑手黨規定只有西西里人才能在幫會中擔任重要職務，所以路易斯對外聲稱自己來自西西里。


    為了當好一個西西里人，路易斯在這之前做足了功課，所以他的一舉一動都完全像是一個土生土長的西西里人。但是路易斯知道，對方對自己還是不夠信任，一定會想方設法試探自己。


    在一次黑手黨的內部聚會上，當地的一名交際名媛出現在現場。當時許多人都驚歎於這位美女的美貌，紛紛豎起了大拇指。但是路易斯卻依稀記得：西西里人在誇讚別人美麗的時候，習慣性的動作應該是用食指在腮幫上轉兩下。而眼前的這些黑手黨人，他們毫無疑問都是西西里人，為什麼他們沒有做出這樣的動作？難道自己記錯了？當時路易斯的腦子在飛快地轉動：「是跟他們做同樣的動作，還是堅持按照自己所做的準備去做？」


    在短暫的思考之後，路易斯最終克服了自己的從眾心理，做了一個標準的西西里人的手勢。


    ## 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    在做完這個手勢之後，路易斯看到在場的一位黑手黨教父朝他走來，伸出手對他說：「正式歡迎你，我的西西里朋友。」


    從那以後，路易斯才真正打進了敵人內部。


    在上面的這個案例中，FBI 探員路易斯克服了自己的從眾反應，所以才沒有落入敵人設下的圈套。這個故事告訴我們：有時候，你要堅持自己心中的正確想法，才能避免落入從眾心理的陷阱。只有這樣，你才能保持正確，讓自己變得「深藏不露」。


    某位教授曾經做過這樣一個實驗，他對自己的學生說：「我請一位德國化學家展示他最近發明的某種揮發性液體，他將在明天的課堂上向大家展示。」


    第二天，一個滿臉大鬍子的「德國化學家」來到了課堂上。這個「化學家」用沙啞的嗓音對學生們說：「我最近研究出了一種強烈揮發性液體，現在我要進行實驗，看要 opacity
    用多長時間能從講臺揮發到全教室。凡聞到一點味道的，馬上舉手，我要計算時間。」說著，他打開了瓶蓋……


    過了沒有多久，前排的同學就舉起了手，然後後排的同學也紛紛舉手。不到兩分鐘，所有人都認為自己聞到了化學液體發出的特殊氣味。


    就在此時，那個「化學家」拿掉了墨鏡，撥掉了自己的鬍子，原來他是本校的德語老師。他笑著說：「我這裡裝的是蒸餾水！」


    其實，作為一個正常人，都生活在群體當中，那麼，周圍人們的意見對於自己不可能不產生影響。而且，有時候服從大多數


    人的意志也確實有好處。但是，你也要清醒的認識到，從客觀上講，這個世界畢竟是「庸人」居多。所以你要想有所超越，一味的跟著別人的步伐前進，是不會成功的。周圍人的意見和想法，有時會動搖自己的抱負、意志和決心。


    做人要有主見，要能夠理智支配自己的行為，不要讓別人牽著你的鼻子走。一個人如果失去了主見，那麼別人想要看穿你的內心就會變得很容 易，再要想藏心就難上加難了。


    一個人如果處處處於被動，就很容易被別人預測到你下一步要做什麼、心裡在想什麼。因為對方知道：你只會跟著大多數人的腳步前進，只要明白大多數人是怎麼想的，也就等於讀懂了你的內心。所以，我們想要藏心，就必須要有主見，而且要敢於說出自己的意見。


    在生活中，我們往往失去了說話的勇氣。這樣一來，就會逐漸變成一個庸俗的人。別人能輕易看穿我們心中的「服從行為」，用各種手段控制我們、影響我們。如果一個人到了這步田地，還談何「城府」、談何「藏心」？


    在 FBI 的新人培訓中，有一個重要的科目：「案例分析」。


    FBI 的教官們會給新人提出一個案例，然後向他們詢問解決的辦法。FBI 教官發現，許多人會給出一個相同的解決方案。在這個時候，有些持不同意見的人，會逐漸變得動搖，開始否認自己的方案，而另一些人則會堅持自己的想法。


    其中有個叫傑維斯的小夥子，他的方案雖然和其他同學的大不相同，但是他依舊堅持認為：自己的方案也許最能解決問題。


    教官找到傑維斯，問他：「你為什麼會提出這樣一個與眾不同的方案？」


    ## 別讓人一眼看穿你

    觀心與藏心的攻防藝術


    傑維斯回答說：「我想，雖然這只是一場實驗，但是我們還是應該把我們的對手想像成我們的敵人。對於我們而言，一個誰都可以想到的方案，敵人同樣也想得到，他們肯定會有針對我們的辦法。所以，我們這個工作需要我們和別人一樣，需要我們有自己的主見。不能被人看穿我們在想什麼，不能被人牽著鼻子走。」


    聽了傑維斯的這番話，教官知道，眼前的這個人並非嗤眾取寵之徒，他是一個真正有能力的人。


    果然，在加入 FBI 之後短短數年，傑維斯就成為了一個「關鍵人物」，創造出許多驚人的佳績。


    這個故事中，傑維斯的那番話對我們的「藏心」而言有很大的啟發意義。試想一下，你如果只會隨波逐流，只會按照一般的思維去解決問題，那麼你的對手，也肯定會想到你會那麼做，那你還有什麼秘密可言？從一開始，你就陷入了被動，想藏心那是不可能的。拿破崙曾經說過一句話：「不要做敵人想讓你做的事
    情，理由很簡單——因為是敵人想讓你那麼做。」


    當我們缺乏主見的時候，內心的聲音就會微弱，失去說話權，不能很好地表達自己。對於有些人而言，其實他們心中不是沒有想法，而是沒有勇氣表達自己的想法。其實，對於自己有異議的觀點，你應該去提出有建設性、表示反對的意見，在尊重他人的前提下挑戰他們的意見，從而表達你的看法。


    當然，在表達反對意見時我們也要注意方法。比如，你在對一個人提出反對意見的時候，應該多接觸對方的目光，這會讓你充滿勇氣，在別人眼裡你會顯得更加自信。


    比如，在課堂上，那些用目光和老師交流的學生，即使他們


    經常提出疑問，老師也非常喜歡他們，因為老師知道這樣的學生才是自信、勇於思考的可造之才。在說話的時候，要盡量避免使用也許、可能、會不會、如果、聽說等詞彙，多用我建議、我認為、我希望等乾淨俐落的詞語。這樣會讓你的話更有力量，而不顯得拖泥帶水。


    總之，我們有必要透過一些手段來表達自己的主見，不能總是像綿羊一樣表示順從。只有勇於表達的人，敢於提出不同意見的人，才不會被別人一眼看穿，才是真正的藏心高手。


    ## 堅持自己，不屈於別人


    在上世紀的印度，人們尊崇一位精神導師，他向人們提供精神的力量和東方的智慧，他用生命換來了別人的生存，這個人就是甘地。


    甘地生前曾經進行過無數次的絕食抗爭，他的非暴力哲學讓英國人感到羞愧萬分，最終不得不離開印度。因為道義在壓迫者心中萌發了，逼得他們必須撤離。


    為了達到和平抗爭的目的，甘地決心過苦行僧般的生活，他用絕食的方式來制止暴亂和殺戮，他支持工人罷工，反對一切苛刻的僱傭條件。甘地從不畏懼英國人，但他卻畏懼黑暗，他睡覺的床邊總是燈光長明，他對印度人民的聯合與統一充滿了信心和熱情。


    甘地擔負起了把獨立的要求轉變成全國性群眾運動的職責，動員所有人與帝國主義展開鬥爭。甘地一生始終堅信一點：被動反抗和非暴力之路，在任何時候、任何情況下都是有效的。他的精神是充滿智慧的，是堅忍不拔的，是充滿同情心和活力的，他的智慧就是印度人民最強大的精神武器。


    在多數人看來，一個人是否有力量，全在於他的性格和手段。那些性格溫和而從不採用暴力的人，有時會被人視為懦夫。然而，甘地卻改變了人們對力量的看法，他以溫和和非暴力著稱，始終堅持自己的信念，這種強大的意志力萌發出的氣場，讓他成了印度最有影響力的領袖。


    這就是不屈服的力量！


    ## Step 4 自主 / 不盲目，養成獨立思考的習慣


    不要抱怨成功太艱難，路途太坎坷，你需要是增強你的意志力，還有你的恆心。堅持不懈意味著有決心，當我們感到精力竭的時候，放棄和服從是最簡單的，也是看起來最好的選擇——然而成功者在此時卻必須忍住。他們的意志力是普通人難以想像的，甚至為了成功，他們可以選擇「一生只做一件事」。因為他們專注，所以沒有人能輕易打到他們，更不會有人能夠窺透他們內心的強大力量。


    杜雷德是一名 FBI 探員，和他一起進入 FBI 的「戰友」。在他這個年紀都已經獲得了巨大的成就，但是杜雷德卻一直沒有得到提升。原來，他把自己所有的精力都放在了一個曠日費時的重大案件上。這個案件不知道什麼時候才能結束。這就意味著，杜雷德不知道要什麼時候才有「出頭之日」。


    朋友都對杜雷德說：「你應該換一個任務，這個任務做下去，恐怕你一輩子也只是個小小的探員了。」


    就連杜雷德的敵人也發郵件給他，上面寫道：「你已經黏了我們十三年了，我佩服你的勇氣。可是，如果你再這樣無止盡的和我們糾纏下去，你將失去你最寶貴的一切。」


    無論是朋友的好意規勸還是敵人的恐嚇威逼，都沒有讓杜雷德屈從。他依舊堅持著自己的任務。終於，又過了五年，杜雷德完成了那個幾乎不可能完成的任務。


    每一種成功的背後，都有不為人知的心酸，但每一種成功也都有個共同的祕訣，那就是堅持。


    有人曾經問過小提琴大師弗里茲·克萊斯勒（Fritz Kreisler, 1875.2.2 - 1962.1.29），為何他能演奏得這麼好，是不是運氣好？

    '
  mdcn: '

    這件事被洛克菲勒（John Davison Rockefeller, 1839.7.8 - 1937.5.23）知道了，他為阿基勃特的執著和敬業所感動，於是邀請阿基勃特共進晚餐。


    從那以後，阿基勃特開始平步青雲，很快就成為公司的重要人物。洛克菲勒卸任後，將董事長的位置傳給了阿基勃特。


    阿基勃特之所以成功，就是因為他有積極的態度。試想一下，如果阿基勃特對於自己枯燥的生活感到煩躁的話，他絕對不會有這樣的熱情，也絕對不會有以後的成就。


    熱情，不是一種盲目的樂觀，而是一種生活的態度。


    當一個人的心底充滿熱情之後，他的一切負面情緒都會得到抑制和消解。由此可見，充滿熱情地生活，是藏心術的一個訣竅。


    我們每個人都會遇到磨難，關鍵在於你用怎樣的態度去面對。要麼你去控制自己的生命，要麼就是讓生命控制你。所以，你的心態往往決定著你的命運。


    當我們在生活中不順心的時候，可以嘗試著改變思維方式，保持良好平和的心態。這種樂觀的心態會轉化成積極、自信的力量，幫助我們在枯燥、單調的工作中找到樂趣，生活自然會發生改觀。


    ## 豁達是一帖醫治得失心的良藥


    成敗之心最直接的後果，就是讓我們患得患失，也就是人們所說的不夠豁達。


    豁達是一種處世的境界，是一種智者的心態。豁達是一種寬容，恢宏大度，海納百川。豁達是一種博大的胸懷，是超然灑脫的態度。豁達之心，是醫治得失心的最佳良藥。


    對於豁達的人而言，成敗得失都不足以影響一個人的心境。因此，他們淡定從容，也更善於藏心。


    豁達的生活態度在古代被視為一種超脫的人生態度，備受推崇。但是在今天講究「叢林法則、弱肉強食」的世界裡，越來越多的人不再贊同這種生活態度，認為「不計較得失、不在乎輸贏」的豁達態度不是當今社會的生存之道。


    這些人說的有些道理，的確，在當今社會上「競爭」是主旋律，人們都渴望成功，渴望贏得勝利。但是，豁達的心境難道在當今社會中真的沒有市場了嗎？不盡然！一個人如果有了豁達之心，別人便不能輕易看穿他的內心，更不會淪為別人手裡的棋子。這樣的人，遲早會取得成功。


    20 世紀 50 年代，FBI 曾在某城市挖了一條祕密通道，為的就是竊聽某敵國的電話情報。為此，他們還把自己的線路接到了敵國的電話線上。


    但是，讓 FBI 始料未及的是，一名間諜出賣了 FBI，並且把這件事全告訴了敵國。敵國非常聰明，他們不去揭穿美國的陰謀，而是讓美國繼續竊聽。其實，這些情報都是假的，都是敵國


    魚目混珠的情報，根本沒有價值。等到美國人自以為竊取到了不可勝計的情報之後，敵國才毀壞了美國的地道，並且獲取了美國先進的間諜偵察系統。


    這對 FBI 而言是個重大打擊。一時間，FBI 內許多探員的心理遭受到重大的打擊，他們害怕因自己辦事不力受到處分。更重要的是，當他們看到自己苦心經營的設備落入敵手時，感到非常傷心。很多人因此一蹶不振。


    時任 FBI 局長的胡佛 ( John Edgar Hoover, 1895.1.1 - 1972.5.2 )，意識到如果讓這種煩躁情緒蔓延下去的話，會大大地影響探員的辦事效率。於是，他對相關人員說：「失敗是暫時，我們不必掛懷，接下來還有很多工作等著我們。我要你們忘記以前的失敗，振作起來。而且我保證，沒有人會因此事受到處分。」


    從那以後，FBI 探員總算是再次打起了精神。


    故事中的胡佛，就是一個豁達的人，所以他才能帶領自己的團隊走出挫折；而那些不豁達的人，則會被成敗反應徹底擊倒。不夠豁達，讓人在輸輸贏贏的名利舞臺中迷失了自己，最終徹底失敗。豁達一點，就能夠勇敢地面對輸贏，能夠有捲土重來的勇氣，最後未嘗不會再獲成功。這樣看來，豁達之人到底還是贏家。


    北宋文壇盟主蘇軾的一生就是「豁達」二字的真實寫照。


    蘇軾一生多次被貶謫，可謂是處處不得志。就像蘇軾自己在《自題金山畫像》中說的那樣：「問汝平生功業，黃州惠州儋州。」但是在面對生活中的逆境時，蘇軾並沒有消極墮落，相


    反，他以一種豁達超然的態度面對種種不幸。


    ## 別讓人一眼看穿你

    豁心與藏心的攻防智慧


    被貶黃州期間，他「歸去，也無風雨也無晴」；被貶海南島期間，他「日啖荔枝三百顆，不辭長作嶺南人」；被貶密州期間，他「會挽雕弓如滿月，西北望，射天狼」。他的貶謫生活其實異常艱苦，即使是這樣，蘇軾仍然懂得以豁然的心態面對這一切。他發明美食，創作音樂，鑽研佛法，把酒填詞。蘇軾一生之中最好的文章大多是在這一段時間寫成的。


    在面對困境時，蘇軾等豁達的人都有一個共同的思維特色，那就是：超然物外，趨利避害，保持情緒與心境的明亮與穩定。因為豁達的心境，蘇軾在重重艱險之中收穫了樂觀的人生，更收穫了文學上的成就。豁達就是這樣一種東西，它不會幫助你贏得某方面的成功，但是卻能在你失敗的時候給你打開另一扇通往成功的大門。


    這也恰似哲人所言：「所謂幸福的人，是只記得自己一生中滿足之處的人；而所謂不幸的人，是只記得與此相反內容的人。」每個人定義的滿足與不滿足，並沒有太多的差異；幸福與不幸福相差的程度，卻會相當大。


    豁達意味著風度、胸懷、氣質，意味著親和力、感召力和凝聚力。這些都是一個成功資本，而這些能力也能讓一個人最大限度地「藏心」。更為重要的是，豁達的心胸會讓你在「輸」的現實中看到「贏」的另一面。


    我們的一生中需要為創造幸福快樂的生活而奔忙勞碌，這就不可避免地會遇到各種各樣不順心的事情。當別人在輕鬆中享受著豐厚的待遇，而你做著緊張忙碌的工作且待遇遠不如別人時，你要想到你在工作中鍛煉了才幹，在實踐中增長了智慧。真本領


    ## Step 3 放下 / 不煩躁，克制得失心


    是磨練出來的，真本領才是獲得幸福快樂生活最牢固的基石。


    當生活中遭遇種種不幸時，你要豁達，調整自己的心態。要想到在生活冷淡的同時，也會饋贈給你輕鬆和自由，要利用這份輕鬆和自由，清理一下自己心靈的原野，把因忙碌而荒蕪的土地開墾出來。


    在現實生活中，因遭遇不際而另闢蹊徑，終成大器的不在少數。這就是充分發揮豁達心態的作用，把逆境變成生活的動力，幸福快樂就永遠屬於自己。


    當生活賜予你幸福，當然就擁有了幸福，但是請記住——生活給你苦難時，一定要豁達面對，不要讓暫時的苦難成為你前進的阻礙。


