    除了按摩頸部之外，還有一些動作能夠緩解緊張的情緒。比如，平時用非慣用手做攪拌咖啡、使用滑鼠或開門等小動作，也許可助你控制情緒，練習兩週就能見效。所謂的使用非慣用手，就是「左撇子」用右手做事，「右撇子」用左手做事。


    關於這個緩解情緒的小動作，是澳大利亞新南威爾斯大學心理學家在研究如何自我控制時的一個新發現。實驗表明，使用滑鼠、攪拌咖啡、開門……這些動作人們通常用右手去做，而用左手去做這些事情可以很好地控制自己的情緒。其實人的意識中存在著本能般的「戰鬥或逃跑反應」(Fight-or-flight
    response)。這是人類在遭遇緊張壓力時，交感神經的興奮反應。「戰鬥或逃跑反應」會造成一系列生理和心理變化，例如心率加快、攻擊性增強。


