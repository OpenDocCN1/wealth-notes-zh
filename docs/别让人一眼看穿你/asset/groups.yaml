    FBI 的形象。我一定要給他好看！」


    胡佛叫來祕密員警部隊的探員對他們說：「你們要對《花花公子》進行仔細審讀，每期都不能放過。如果發現雜誌內容有侮辱、嘲弄 FBI 以及我本人的地方，你們一定要及時向我彙報。」


    祕密員警一下子成了《花花公子》的忠實讀者，他們每一期都看。皇天不負有心人，終於在 1963 年 2 月，發現了雜誌主編海夫納寫的一篇批評胡佛反情色的文章。祕密員警立刻把這個消息轉達到了胡佛那裡。


    胡佛聽了這個消息，十分氣憤，他是一個從不容許別人得罪的人，於是他立刻下令探員去調查海夫納的背景。


    許多人不理解，就因為一篇小小的文章，胡佛就對一個雜誌這麼不滿，似乎是完全沒有理由的。直到胡佛死後，他是一位同性戀者的祕密才開始公諸於世。這時，人們才知道，胡佛當年之所以對一個雜誌大動干戈，就是因為他內心因自己的性取向而感到自卑，而且又怕人識破這一切，所以才會那樣暴怒。


