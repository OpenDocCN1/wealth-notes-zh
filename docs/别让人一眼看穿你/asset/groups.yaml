    # 人體指揮中心 —— 大腦


    首先，讓我們開始關於藏心的第一個話題：你的破綻在哪兒？


    雖也無法直接地看到我們的內心，但是，我們的肢體語言、臉部表情等等因素，卻經常會出賣自己。


    1999 年 12 月，FBI 截獲了一名被稱作「千年轟炸者」的恐怖分子。


    事實上，FBI 事前並沒有獲得關於這名恐怖分子來到美國的任何消息。在入境例行檢查時，FBI 情報人員發現一位叫阿默德的人神色緊張且汗流不止。多年辨案經驗告訴他：這個人內心充滿了恐懼，他一定有不可告人的秘密。所以探員勒令他下車接受進一步詢問。那一刻，阿默德下意識做出了逃跑的姿勢，但是很快被制伏。


    後來，探員在他的車子裡搜出了爆炸品和定時裝置。在鐵一般的證據面前，阿默德承認了自己的犯罪行為。


    流汗及緊張的神色，是身體在面對外界壓力時產生的條件反射。由於這種邊緣反應是最為真實的，所以探員才敢毫無顧慮地逮捕阿默德。這件事說明，一個人的心理狀態會反映在身體語言上。而無論是肢體語言還是臉部表情，都是由大腦控制的。所以，我們有必要先從「大腦的功能」這個角度去探討一下「如何藏心」這個話題。


    在一般人眼中，大腦是一個整體。但事實上，我們的大腦


    由三個不同的區域組合而成。1952 年，一個名叫保羅·麥克林（Paul D. MacLean, 1913.5.1 - 2007.12.26）的科學先驅提出「三重腦理論」（Triune
    brain），人類大腦是由「爬蟲類腦」（腦幹）、「哺乳動物類腦」（邊緣系統）和「人類大腦」（新皮質）組成的三位一體。這三個不同的大腦區域各有著不同的職責，它們合起來就形成了「命令加控制中樞」，後者駕馭著我們身體的一切。


    其中，「哺乳動物類腦」，也就是我們所說的邊緣系統，是人的「情感中心」，還控制著我們的行為動作（不包括語言）。更重要的是，「哺乳動物類腦」對我們周圍世界的反應是條件式、不加考慮的。它對來自環境中的資訊所作出的反應也是最直接、最真實的。也就是說，那些在我們不經意的條件下，所做出的肢體和臉部表情，主要由這個邊緣系統控制。在前面案例中，恐怖分子出現的流汗、下意識的逃跑等生理反應，就是由這個邊緣系統所操控。因此可以這麼說，「哺乳動物類腦」是一個「誠實」的大腦。


    「哺乳動物類腦」不僅「誠實」，更是一個標準的「工作狂」。它從不休息，只要人還活著，它就一直處於「開機」狀態。


    與誠實的「哺乳動物類腦」相比，大腦的第三部分「人類大腦」，也就是新皮質，則顯得狡詐多了。這個大腦負責高等認知和記憶，具有思考的能力。許多科學家也說：這個人類大腦也是最善於說謊和欺騙的。總之，人類文明的一切，都是由這個大腦所創造，當然，也包括謊言和欺騙。


