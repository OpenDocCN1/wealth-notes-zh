    ## 羨慕→嫉妒→恨，循序漸進的不健康心態


    「羨慕、嫉妒、恨」明顯是一種不健康的心態，作為一個藏心高手，一定要學會隱藏和克制自己的這種心態。


    所謂羨慕，就是當看到別人比自己強的時候，把別人看得比自己高。所謂人往高處走，當看到別人比自己強的時候，就會產生向對方「靠攏」的心態。如果自己與別人差距太大，沒有什麼可比性，也就是心理學上說的「自我邊界感明顯」；此時，人不會因為羨慕而產生嫉妒。


    比如，我們羨慕愛因斯坦的高智商，羨慕比爾·蓋茲的財富，但是我們不會嫉妒他們，因為人家智商高、有錢，跟我們沒有直接競爭關係、利害關係。而且我們也不太可能成為他們那樣的人，所以他們強大是他們的，與我們的強大或是弱小不相干，所以我們也不會去憎恨他們——對於自己認同的對象，愛得多，恨得少，就叫「羨慕」。


    假如我們發現自己身邊的某個同事或同學比我們強，我們對他們也會產生認同感，想讓自己成為他們那樣的人。可是，因為我們有機會和他們近距離接觸，這時候，我們可能會認為「他的長相比我更漂亮」、「他的智慧比我更出色」、「他的身體更有力或更有曲線」。這時他們的優秀就會顯得自己更平庸。在和這些人相處時，我們會感到壓力，會覺得自己不如別人，會氣惱他們為什麼總是比我們強！從而使我們的內心產生低自信、低自尊。


    所以，在嫉妒的時候，其對象與自己往往是平等地位的人，條件本來是差不多的人，如同學、同事、兄弟姐妹等。


    ## Step 5 矜持 不顯露・把喜怒哀樂放進口袋吧！


    為什麼會恨呢？因為他們的強大和優秀，映照出了我們的劣勢與弱小。他們搶走了我們的利益，像搶走了我們的表揚、尊重、職位、升學機會、晉升機會等，其中包含了認同與競爭這兩個成分。精神分析中經常提的一個名詞叫做「向競爭者認同」，大慨說的就是這個意思。


    FBI曾經偵破過一起由於羨慕而產生恨意，最終釀成悲劇的案件。


    2010 年 6 月，一名美國女子被控縱死前男友，並殃及鄰居一家導致三人死亡。


    案發時，這名殺人嫌犯自己也被火焰吞噬，她帶著熊熊燃燒的烈焰奔出公寓求救的可怕景象恰巧被樓外的監控錄影機拍攝下來。最終，這名女子獲救，脫離了生命危險，但是她三十二歲的前男友卻因全身大面積燒傷死在醫院。


    大火殃及住在樓上的鄰居一家人，鄰居太太曾爬出窗外求救，卻在救援人員趕到前因力竭從樓上墜下身亡，她的丈夫和二十歲的兒子被燒死在家中。


    事後，經過 FBI 一番調查才得知悲劇發生的原因：原來，這個女子在和前男友分手之後，生活陷入了困頓之中。但是她的前男友卻重新組建了一個幸福的家庭，她因羨慕而產生了恨意，所以才做出如此不理智的事情。


    嫉妒和恨讓人失去了理智，所以我們必須克制和隱藏自己因羨慕而產生的嫉妒和恨意。


    如果在競爭中被自己所羨慕的人打敗，首先就會產生憤怒。憤怒其實不可怕，因為憤怒比較容易發洩出去，比如在下一次競


    爭中戰勝對手，憤怒就可以發洩出去。


    但是如果沒有有效的戰勝對手的手段或是其他的發洩憤怒的途徑，憤怒壓抑在內心深處，就會變得更加憎恨，這時就叫做「嫉妒」。嫉妒往往意味著競爭失敗時的深層壓抑，而壓抑之後，會以更加隱蔽的手段與對手競爭，這更像是武俠故事中正面進攻打不過對手的時候，就使用暗器。所以，嫉妒很可能會讓人迷失自我，將自己陰險狡詐的一面暴露出來。


    懷有嫉妒心的人，經常會想：「我們都是一樣的人，為什麼你就比我強？為什麼你比我得到更多？」他們往往認為這個世界不公平。


    有嫉妒心的人，往往很在乎當前的勝敗得失。他們會這樣認為：「這一次失敗後，即使以後再怎麼努力，也無法挽回這次的失敗。」


    如果一個人在這次失敗後，他心裡想著「君子報仇，十年不晚」的話，那麼他就會將自己的精力用在提升自我能力上，而少有閒心去嫉妒別人了。


    ## 別讓人一眼看穿你

    驕心與藏心的攻防智慧


    ## 社會新聞常見的「由愛生恨」


    本篇，我們講的是自戀和愛恨表達的內容。讓我們先從一個真實案例說起。本案僅僅是一個很簡單的暴力殺人案，但因為涉及敏感話題——大學暴力，所以引起 FBI 犯罪學家的關注。


    中午時分的密西根大學，一位女生和同學從餐廳二樓吃完飯下樓。樓下衝上來一個男生，手裡拿著一把刀，高喊著：「妳為什麼要騙我？」然後就在她的脖子上劃了一刀，接著往胸口上捅了進去，女生從樓梯上滾了下來。


    現場的人都驚呆了，同伴喊救命，隨後現場一片混亂，餐廳裡的人都出來了。那個男生手裡拿著那把血淋淋的刀，呆呆地站在那裡，等員警來帶走他！


    那個男生在遺書中這樣寫道：「我受夠了，我真的受夠了。三年時間，每天幫你裝水、買飯、占座位。我家家境本來就很困難，每逢情人節和生日，我都要給妳買很貴重的禮物。只要能看到妳的笑容，我比什麼都開心。


    我還記得那一個冬天的晚上，我在十二號樓下拿著一個月的餐費買來的玫瑰花等了妳整整四個小時。在我看到妳的那一刻，一直煎熬著我的緊張、焦慮、擔心和失落全都消失得無影無蹤。以後每每聽說妳和別的男生去跳舞、唱歌，只要想起那天晚上妳在我臉頰上的吻，我就可以什麼都不在乎。畢竟，我現在沒有能力給妳那些，因此沒有資格去享受。


    我原以為只要我努力對妳好，總有一天妳會懂我的心。可


    了妳上那個男人車的時候，那種曖昧的眼光。一開始當周圍的人告訴我，妳和他發生關係的時候我都當耳邊風，畢竟妳認識他才三天。可是那天看到妳在車上看著他的眼神……我一切都明白了。


    不錯，他確實優秀。可是妳難道看不出他有一顆魔鬼的心，他只是為了征服在征服，只是在踐踏妳所有追求者的自尊！


    我承認我是個弱者，我不能對那個男人怎麼樣，因為我知道我在接近他之前一定會被粉碎掉的。所以我遷怒於妳，別人不知道我為妳付出了多少，難道妳不知道？妳怎麼能把我的心像煙蒂一樣踩在腳底下碾碎，然後踢進下水道？


    我恨妳，恨妳，恨妳，恨妳！我要報復，雖然我不能拿回我的愛情，但是我要拿回我的自尊！」


    愛的結果卻造就了悲劇的發生，人們不禁會問，為什麼對一個人的愛會變成將其殺死的恨？人們常說：「愛極生恨」！難道愛到極致時均要以恨來表達嗎？它們之間的關係是既孿生又相剋的嗎？


    如果這也算愛的話，那只能算作是一種畸形而不健康的愛，它的目的旨在為極端自戀的「我」服務，而非總是希望對方幸福。在很多情況下，愛的對象只是一面鏡子、一種襯托，一個能映照、折射自己華麗的媒介。對此，心理學專門有一個名詞來形容——自戀。


    心理學將人類在不能獨立的一歲以內稱為自戀階段，此時的嬰兒經常感到饑餓、孤獨、無助的恐懼，為了壯自己的膽、安慰自己，於是便開始吸吮自己的手足或者沉浸在幻想之中。如果不將注意力轉向外界（開始是爸爸、媽媽及親人，以後則為社會性的人際關係），很容易形成自閉，兒童孤獨症或其他心理障礙在此時就埋下了種子。


    當然，並非所有自戀都是病態的，在生活中我們常可見到有類似自戀人格特徵的人。在自戀階段，有些習慣可持續到成年，很難改掉。在一些特定的情況下，它甚至可以發出耀眼的光芒。


    在二戰期間，邱吉爾手作「V」狀，口叼雪茄，給人一付永不落敗的感覺。


    在邱吉爾的童年，他就經常幻想自己不會死去，這種嬰兒式的想像加上口叼雪茄的形象對當時盟軍的士氣起了極大的鼓舞作用。人們相信，跟這樣一個不死的人是會勝利的！


    而在心理學家看來，邱吉爾無疑有自戀的問題。


    在衡量自戀時，人們往往與利他主義對照來談。正常情況下，每個人或多或少都有自戀，其程度為俗語中所講的「利己不損人」。


    但是，大多數情況下，自戀者絲毫不會考慮他人的想法，而將自己的意願以「一廂情願」的方式折射到他人身上。由於相信自己才是唯一的，因而自己的願望也是應該馬上完全加以滿足。當現實中出現與自己想法存在著差距的情況時，病理性自戀者往往會做出脫軌的行為。當然，他本人會認為這是理所當然的。


    自戀有時讓人沉醉，但一定要對自己說：我是一個自戀者，但這又何妨！但是，做出損人甚至扼殺生命的事情，那就是病態的自戀了。所以，我們要克制自己的自戀。


    ## Step 5 矜持 不顯露，把喜怒哀樂放進口袋吧！


    ## STEP 6


    捨得


    不迷失，建立安全感、克制占有慾


    我們都有占有慾，我們都想占有更多的資源。

    但是，過度的占有，卻往往讓人亂了方寸，丟掉了平靜，也更容易暴露自己的負面情緒。因此，我們若要藏心，就需要克制自己的占有慾。


    在本章，我們將引入一個新的詞語「領域感」。

    所謂領域感，就是一種占有慾的表達方式。透過對領域感的敘述，我們將對自己的一系列行為有更深的理解，也能從根本上瞭解自己，更善於藏心。


    ![](img/65c5e2383679681693f7479829cb5f93_145_0.png)


    ![](img/65c5e2383679681693f7479829cb5f93_145_1.png)


    ## 認識「領域」


    首先，我們來談一談什麼是「領域」。

    所謂領域，其實是一個界限，在這個界限中，人擁有絕對的主動權，比如「家」。每個人在自己家裡都能「為所欲為」，這是因為，「家」就是每個人所擁有的「領域」。

    社會心理學家阿特曼（Irwin Altman, 1930.7.16）認為，領域是彼此排他的、獨占的使用區域。這也就是說，一個人對自己的領域有天生的控制慾和占有慾，不願輕易與他人共用。在有人未經同意就闖入到我們家裡的時候，我們會產生敵意，就證明了這一點。

    領域有三個層次：主要領域、次級領域和公共領域。


    主要領域

    被個人或是集體長期占有的一个區域，而且被所有人共同確認，這個領域是使用者生活的中心，比如我們的家、老闆的私人辦公室


    次級領域

    不被人長期占有的地方，比如酒吧，教室裡的座位等。


    公共領域

    指一切公共場所，如電話亭、公車。


    領域感最終會上升為心理問題，一個人如果能夠擁有一個可以調節私密性和自由控制的地方，那麼對身體健康是非常有好處的；如果一個人發現自己沒有能力維護自己的領域時，將會產生


    非常嚴重的心理問題。


    像學者所說，那些領域感強的人，對於別人入侵自己的領域是非常敏感的。在生活中，某些人可能會對門鈴聲非常敏感，這就是領域感的一種展現。


    人人都有領域感，但是如果領域感過於強烈，那麼就會使人的占有慾變得非常強，這就是我們所說的占有慾。


    一個領域感非常強的人，發現自己的個人空間不能滿足自己的需求時，他的占有慾會被激起，這時人會變得貪婪、不知滿足。這無疑會成為一個人心理上的弱點，非常容易被他人看穿。


    義大利藝術家米開朗基羅的雕刻作品「大衛像」是他最為成功的作品之一。當大衛像剛雕刻好的時候，一個負責審查藝術作品的官員表示對這座雕像很不滿意。


    米開朗基羅問這個官員：「您看我的雕像有什麼地方不合適嗎？」


    「嗯，依我看啊，這個雕像，從整體上看，就是鼻子不好。」這個官員明顯不懂雕塑，但為了維護自己的「官威」，還是無中生有的找麻煩。


    米開朗基羅明知道官員的所謂「修改意見」是不可行的，但還是一本正經地說：「是嗎？」然後還站在雕像前看了一下，大叫一聲：「可不是嗎？鼻子是大了一些，我馬上改。」說著就拿起工具爬上架子，叮叮噹噹地開始修改。


    隨著米開朗基羅的鑿刀，掉了許多大理石粉，那官員只得躲開。過了一會兒，米開朗基羅「修」好了，他爬下架子，請那位官員再去驗收：「您看這回怎麼樣？」官員看了一下，非常高興地說：「這樣就好多了嘛！」

