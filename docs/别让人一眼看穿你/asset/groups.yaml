    ### 1. 首先要客觀地認識自己，提高自我評價


    人要善於挖掘自己的優點和長處，要學會肯定自己的成果。客觀地評價自己，其實和客觀地評價別人一樣重要。


    我們不能否認自己的缺點和不足，但是更不能無視自己的優點和長處。你如果用善於發現的眼睛去看自己，你就會發現，其實你的身上有很多過人之處，完全沒有必要感到自卑。話說回來，即便你有這樣或那樣的缺點，但是人無完人，誰又能完美無缺呢？所以，你依舊沒有自卑的理由。


    ### 2. 人應該進行積極的自我暗示，自我鼓勵


    無論在任何時候，你都該告訴自己：「我可以，我行！」而不是一碰到一點問題就馬上逃避、退步。只有這樣，你才能走出自卑心理的惡性循環。


    ### 3. 擺脫自卑心理，就應該學會積極地與他人交往


    透過積極地與他人交往，就會感受他人的喜怒哀樂，心胸也會變得開闊。可以向他人傾吐心聲，並瞭解他人的長短處，在比較中正確認識自己。尤其是積極地加強和性格開朗、樂觀、豁達、尊重人、關心人的人交往，對於克服社交自卑感更為有益處。


    你有過成功的過去，這足以證明你的能力不比別人差。只要你正確地認識自己，坦誠地與老師和同學們交朋友，你一定能趕走自己的自卑。


