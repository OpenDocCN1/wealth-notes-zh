    越是危险的时候，我们越要藏心。当我们的情绪上 them 时，我们的判断能力便会受到影响，只会让自己暴露的更多，藏心就更加无从谈起了。这是因為，此时此刻，我们的认知能力已经被劫持了，「劫匪」就是我们大脑的戰鬥反應。它已經占據了思想的制高點，會調動一切資源為「戰鬥」服務。這時，我們很難保持理性。所以，想藏心，就要先藏住自己的戰鬥反應！'
