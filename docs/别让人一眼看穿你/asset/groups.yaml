    # 找尋能安定情緒的小動作


    你是否在遇到有人插隊或是遭同事算計時會暴跳如雷、情緒失控？這些情況會讓你在別人面前暴露自己的情緒，所以，人有必要克制自己因為某些突發事件而導致的情緒失控。這也是藏心術的主旨所在。


    本篇，我們將介紹一下用某些特定的小動作去控制自己的情緒。或許你會認為，在情緒激動的時候，是非常難控制的，要想透過某些小動作去控制更是不能的。那麼，先讓我們用一個故事來證明：小動作確實可以控制情緒。


    在納瓦羅小時候，他的祖母險些被一輛車撞上。在那個瞬間，他的祖母用手捏住了自己的脖子。一次，祖母在給家人講述事件經過的時候，又一次做出了同樣的動作。這個小動作引起了納瓦羅的注意，在之後的觀察中，他發現許多人在情緒激動的時候都會做出相同的動作，似乎那樣就可以緩解自己的激動情緒。


    之後，他才從自己的老師那裡得知，用手指揉擦頸背部，或者捏起下巴以下、喉結以上的皮肉——這個部位含有豐富的神經末梢，按摩之後能夠舒緩血壓、降低心率，發揮鎮靜的作用。


    進入 FBI 當探員以後，納瓦羅發現了這些行為的應用價值。


    1996 年，納瓦羅第一次被 FBI 總部派到一個劫持犯罪的現場，去執行狙擊任務。這是一個非常危險的工作，一個失誤就會造成不可挽回的損失。


    而首次執行這樣的任務讓納瓦羅感到非常緊張。這時他想起了祖母曾經做的那個動作，於是便開始按摩自己的頸部。過了一'
  md: '

    這番話證實了里維斯的猜想，但是他卻沒有表現出絲毫成功的喜悅。相反，他倒是和那些犯罪分子一起大罵「該死的傢伙」。最後，誰也沒有懷疑正是里維斯一手促成了「三號」的被捕。


    這種故事經常發生在 FBI 探員身上，他們在進入敵人內部之後，就要掩飾每一次成功的高興之情。如果稍有不慎，就會暴露自己。他們確實是藏心的高手。


    其實，在生活中，我們也需要藏住自己的得失心，否則會被別人認為你是一個患得患失的人。在成敗面前，多一份淡定從容，才能體現出做人的風範。古人說：勝不驕敗不餒，就很好地說明了這個道理。


    對於我們的「藏心術」來講，如何面對成敗，在成敗面前該做怎樣的反應，也是我們的重要課題之一。接下來，我們將做出進一步的闡釋。


    ## 勝利者該有的心態


    雖然我們無數次見證了以弱勝強、以小博大的故事，卻不能讓人們脫離對勝利的膜拜和追求。渴望勝利，希望自己成為勝利者，是每個人都有一種心理。但是，並不是每個人都懂得如何面對勝利，在勝利之後該如何自處。現在，我們就說一說「什麼才是勝利者該有的姿態」。


    我們經常說一個成語——「得意忘形」，這個成語放到藏心術上，我們可以這樣理解：那些獲得暫時勝利的人，最容易暴露自己負面的人性。因而，學會如何在勝利之後藏心，是非常有必要的。


    在 FBI 探員面前的是一个無恥的恐怖分子。探員知道，此人在市中心某處安置了一枚放射性炸彈。如果不能在一個小時之內從恐怖分子口中追查到炸彈的具體位置，這個城市可能會遭遇建市以來最大的災難。


    「如果你現在說出炸彈的位置，你還有重新做人的機會。」探員對罪犯說。


    恐怖分子笑了笑：「我的夢想就快實現了，我等這一刻已經很久了，你想我會輕易放棄嘛？」


    探員接著說：「我知道炸彈就在市中心。我們將會對市中心所有的高樓大廈展開地毯式的搜尋。我想，一個小時的時間足夠了。」


    說完這句話之後，探員敏銳地發現，恐怖分子眼中流露出 一絲得意。這個表情雖然很短暫，但還是被探員捕捉到了。探員因


    此推斷出：「炸彈並沒有放到那些高樓大廈中。」


    但是探員裝作一無所知，繼續說：「我想，你可能不會把炸彈放到高樓大廈裡，那樣做雖然效果不錯，但是也太容易被搜查到了；我想，你也不可能把炸彈放到電話亭，因為那裡人太多，你顯然沒有任何機會。」


    說完這句話之後，探員發現，恐怖分子的眼中又有一絲得意閃過。探員心中震了一下，然後衝出去訊問室對同事說：「趕緊去盤查市中心的每一個電話亭，別問我為什麼，快！」


    半小時後，拆彈專家在某個電話亭解除炸彈，城市安全了。


    故事中的探員之所以能夠準確判斷出炸彈的位置，其實靠的就是從恐怖分子的「成功反應」中查找破綻。


    當探員說要搜查高層建築時，恐怖分子眼中的得意告訴他：這個人認為警方不可能在那裡找到炸彈，所以才顯得如此得意；當探員說電話亭不可能藏有炸彈時，恐怖分子的得意就恰恰是告訴他：炸彈就在電話亭。


    你看，一個人對於成功的得意之情，往往是難以克制的。所以，成功後的表現，最容易暴露內心。


    除了得意之外，成功還容易表現出其他心理狀態。一般來講，成功者最常見的心理狀態是自我滿足，俗稱驕傲。人的驕傲來自對自己的滿意認知，即便是自己的團隊共同做出了傲人的業績，人也常常會因此而感到自我驕傲——我是這個優秀團隊的一員！


    所有人都有自己的一個心理評價，而且對於大多數人來講，這個評價都是正面多於負面，就算是 一個一無是處的人，也會找到一些讓自己驕傲的理由。但是，我們也不能說驕傲絕對是一件


    壞事。如果一個人真的從內心中否定了自己，那麼他的情緒只有一個——絕望——後面會發生很可怕的事情。


    但是如果一個人過度自傲，那麼他一旦有了一點點成功，就會沾沾自喜，目空一切。此時，驕傲就成為一個人的負面品格。驕傲的人不會藏心，他們會盡量讓自己看起來更高大一些，例如抬頭、挺胸和眉毛上揚等動作，都是驕傲的直接體現。


    成功者還容易陷入於炫耀之中。喜歡炫耀自己的人可能會獲得一些成功，但這並不能掩蓋他們膚淺的本質。這些人恨不得讓所有人都認識自己，生怕別人不知道自己的本事。


    炫耀經常體現在肢體語言上，比如走路時晃動身體，就是典型的炫耀反應。這一點幾乎在一切人身上都能得到驗證，比如街頭混混喜歡大搖大擺，這就是炫耀。


    炫耀是一種能夠讓人輕易識破的狀態（事實上，炫耀就是為了讓人明白自己的狀態），對於大部分的人來講，很難做到炫耀卻不被人討厭。所以，我們需要克制自己的炫耀，藏住自己的得意之情。


    餐桌上，一位父親和朋友們談興正濃。父親突然自豪地對眾人說：「我只有一個女兒，但我的女兒可了不起了！」說罷，轉頭又對自己的女兒說：「去把妳的證書拿來，給叔叔們看看。」


    小女孩三步並兩步跑回書房，拿起那一疊「整裝待命」的證書，拿出去交給自己的父親。父親接過證書之後，一一打開並對眾人解說：這個是模範生的獎狀，這個是珠心算一級的證書，這個是……


    介紹完之後，小女孩就像明星般被隆重推出，聽眾們都嘖嘖稱讚，有的對小女孩報以讚賞的笑容，有的豎起大拇指說：「真


    行！這孩子真不錯！」「比我們家那孩子強多了！」「這孩子這麼聰明，肯定像她父親。」溢美之詞讓小女孩有些害羞，但更多的是驕傲。


    但是當證書傳到一個客人的手裡時，這個人並沒有像其他人一樣開口讚揚，而是若有所思地說：「這是妳以前得的吧？」聲音很平靜。


    「是的。」小女孩回答。


    「那現在的呢？」此人語調仍很平靜。


    「現在的？」小女孩一愣，想了想說：「沒有。」


    「小朋友，過去的都已經過去了，一定要把握現在呀！」這人感慨地說。


    小女孩和他父親聽了這一番話，覺得非常慚愧。


    這就是驕傲和炫耀的負面作用，「小時了了，大未必佳」的故事在生活中每天都發生著；人們往往落入這種負面的心態。所以，我們需要藏心，我們需要藏住自己的成敗反應。


    成功者的另一個常見心理狀態是傲慢。傲慢的心理根源是「自認為自己比對方好（強壯、富有、高貴……）」，這是一種極度的優越感，認為對方和自己完全沒有可比性，進而產生對對方的不屑。


    當然，傲慢也會表現在肢體語言上，頭向後仰，下巴抬高。因為下巴抬高了，再睜大眼睛看對方會比較吃力，所以常常是上眼瞼順其自然地遮住一半眼球，擺出居高臨下的姿態（暗示著：「我不稀罕花力氣好好看你」）。傲慢的人，他的下巴抬起所指向的方向，往往就是他蔑視的對象。當然，還有更過分的，有可能會再配合一些搖頭晃腦或者半露犬齒的輕蔑表情。


    ## 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    1993 年，FBI 開始介入進一起黑社會之間的火拼當中。

    當時，紐約最大的兩個黑社會組織開始了長時間的火拼。許多黑社會成員因此喪命，對社會治安造成了嚴重的破壞。為了平息這場鬥爭，FBI 決定「出面」解決。


    若想平息爭鬥，就必須先搞清楚他們的爭鬥緣何而起。

    很快，FBI 就在一張照片中找到了答案。照片中，兩個黑社會老大共處一室，但是其中一個的下巴明顯指向另一個。FBI 由此推斷，這場火拼很可能是因為其中一個黑社會老大對另一人的傲慢和不屑而產生的。


    找到問題的根源之後，FBI 開始「指示」另一個已經被自己控制的黑社會老大出面調停這場爭鬥。果然，經過調停，兩方停止了鬥爭。

    而在數年之後，FBI 又利用當年的這種做慢，將兩個社會組織分別剿滅。


    那些傲慢動作，往往會引起人們的反感，因此，我們在生活中應該盡量避免做出這樣的動作。一旦讓別人觀察到你有這樣的反應，即便你是無心的，也很容易被別人理解為傲慢和不屑。如果是對著上級、長輩或者其他應該尊重的人，出現傲慢反應，恐怕最終受損的那個人就是自己。


    ## 成功要低調慶賀？！


    有時候，一個人之所以生氣，是因為他心虛。比如，一個虛偽的人，在別人識破他的虛偽之後，會勃然大怒：「我從來沒有做過那樣的事情，你們不要污蔑好人。」他似乎不明白，生氣並不能成為一個人掩飾自己心虛的辦法。一個人想要真正的藏心，還是應該虛心而不是心虛。


    關於虛心與心虛，成功學大師卡內基（Dale Carnegie, 1888. 11.24 - 1955.11.1）曾經做過很好的詮釋，他說：「成功的人往往都很低調，因為他們自信，所以選擇虛心；只有失敗的人才去張揚，因為心虛，所以需要靠搞掉對方來掩飾。」


    這句話揭示了一個道理：越是外表看起來張牙舞爪的人，他們的內在其實越不足。而那些看起來「與世無爭」的虛心者才是真正強大的成功者。


    虛心的人自信自己的所作所為，所以往往都很低調，而心虛的人往往內心有鬼，所以總是靠張揚來掩飾內心的慌張，結果往往適得其反，更加顯示了他的不安。


    名震世界的諜探基德，在完成了一項重大任務後(CLASSIFIED) 棠譽歸來，警局所有人都為他大為讚頌。此時，如果他想要借此來炫耀自己的自傲的話，實在是一個好機會！而且沒人敢對此指手畫腳。因為經過一番艱苦的努力之後，他將敵方的情報系統幾乎全部毀掉，勝利屬於他。


    回國之後，審問敵方最高長官的任務還是交給了基德做。


    在審問中，敵方的那位長官衣冠楚楚，但是基德穿的卻是滿


    身污漬的旅行服。由於他來得匆忙，沒有穿制服，所以只好和一個下屬借了一身制服。


    從外表上來看，失敗者似乎更加「理直氣壯」，而作為成功者的基德卻更顯得低調。但是他能夠在面對失敗的對方首領時，不去驕傲地炫耀自己，而是謙虛地接受對方的投降，甚至用欣賞的眼光發掘對方的優點，這正是他為人的成功所在。


    可以說，古今中外的成功人士都有一個顯著的共通性——那就是懂得虛心，他們一般都很謙恭。其實他們有資本去驕傲，因為他們的成就自然會替他們宣揚。但是，他們都是選擇虛心走自己的路，謙卑而柔韌的實現自己的理想。


    因為他們都懂得，如果你對自己能否取得成就，或者能取得多大的成就還有所懷疑，也還不知能否得到他人稱讚的時候就開始自吹自擂，那其實就是在吹牛；如果一個人真正值得大家去稱讚，那就不根本沒有必要去自大，否則就是淺薄了。而一個淺薄的人是根本不可能取得成功的，也是根本不值得受人尊敬的。


    美國上議院議員迪普，為人謙虛正直，面對升職仍能保持清醒的頭腦，而不驕傲自滿。


    下議院的一個老僕人曾經這樣對別人說起迪普，他說他在下議院裡幹了三十多年，見過形形色色的人，但是還沒見過像迪普這樣，即使從一個議員一下子當了部長，也絲毫沒有改變自己說話的態度和語氣，他從來沒有見過。


    事實上迪普本人也極其反感他人的誇大讚揚。當他讓出議長之職以擁護林肯政府時，一般人看來，他應該受到何等熱烈的歡呼和稱讚，而他卻低調的否認一切，而且善意地批評了別人對他


    的誇大讚揚。那時雖然迪普還很年輕，頭腦卻很清醒，他懂得謙虛的道理，所以並不因為別人對他誇張的稱讚而自高自大。


    迪普不僅僅是一個虛心的人，甚至會對別人的誇獎「避之不及」，這既是一種境界，也是一種生活的智慧。虛心的人在眾人面前似乎總是不如心虛的人那樣盛氣凌人，但是他們贏得的卻是更多人的尊敬和最終的成功。孰輕孰重，相信所有人都一目了然。


    做人不是演電影，不是為了贏得滿堂喝彩的表演，而是時時刻刻分析情況，在每一回合上不求多得分，只求不失分，如此下去，則必定獲勝。因此，當你的羽翼尚未豐滿或是沒有必勝把握之時，不妨先隱藏一下自己的實力。


    提及機械錶，瑞士錶是全球最為頂級的。瑞士錶之所以代表著極品，是因為鐘錶調輮師的技術高超。調輮師諳熟機械錶的性能，對調整機械錶的溫度差、姿勢差等整合，有著世界最高的技術水準。


    鐘錶行業是全球含金量最高的行業之一，日本也企圖分一杯羹。然而，日本人深知自己的技術絕對達不到瑞士錶水準。不過，精明的日本人並沒有放棄，而是選擇了避其鋒芒。這其中，一家名為精工（
    SEIKO Watch Corporation ）的鐘錶公司開始將目標轉向石英錶以期突破。


    石英錶的運行機理是在石英上通入電流，使其發生伸縮性規律振動，然後將此振動以電氣的方法連接馬達來劃出時間。從振動的精確性而言，機械錶根本無法與石英錶相比。只要擁有耐震的能力，石英錶計時不受溫度等變化的影響，能達到非常精確的


    程度。


    但是日本人並沒有馬上就宣布自己在手錶上有 關於 重大的突破，他們在等待一個機會。在這個機會來臨之前，瑞士錶依然佔據著主流。


    機會很快來了。在瑞士，有一項納沙泰爾（Neuchâtel）天文臺鐘錶比賽，實際上，雖然這是專門為弘揚瑞士錶的威名而設置的，但也是一場世界鐘錶行業的擂臺賽。當日本人把他們的精工錶拿來比賽時，十五塊石英錶通通都排到了瑞士錶的前面，這樣的比賽結果對瑞士人來說就好似當頭挨了一悶棍，久久無法回過神來。


    瑞士廠商在沉重的打擊下憂心忡忡，坐立不安，直到第二年才把得分表寄往日本，同時不公開名次，並宣布從此停辦納沙泰爾天文臺的鐘錶競賽。


    就這樣，風靡了數百年的瑞士錶，在石英錶領域栽了大跟斗。從那以後，日本精工鐘錶公司又開發出了「大眾化、小型化」的石英錶，使其為多數人所接受，在市場上站穩了腳步。如今，「精工」已成為享譽世界的著名商標，是全球聞名的大鐘錶生產公司。


    對於強者，我們都有這樣一種感覺——他們在未發跡之前都顯得非常平常，他們都是善於沉默的，但是一旦發跡，就勢不可擋。這正是因為他們善於隱藏自己的實力，把自己的鋒芒隱藏起來，掌握一種外圓內方、綿裡藏針的處事技巧，這反而會讓人更加無法攻擊。別人的攻擊因為沒有著力點而不能發揮作用，反之自己只需輕輕一擊，就可以令競爭對手受到重創。


    退一步講，即使不是那些成功人士，絕大多數的領導階層也


    都懂得這個道理。因為在如今的社會中，幾乎一切都講究合作，尤其是企業和團隊組織裡面，很多事情都需要不同專長的人員一起合作才能達成目標。


    換句話說，鋒芒過露，這絕不是一個成熟商界人士應有的行為。這麼做，不但會損害別人的自尊，還可能會破壞自己已經有的優勢。因為鋒芒畢露時間長了，自然就會引起一些人的嫉妒，會給你增加一些障礙。


    深藏不露是智謀，過分的張揚自己，就會歷經更多的風吹雨打，暴露在外的屋椽自然會先腐爛。一個人在社會上如果不合時宜地過分張揚、賣弄，那麼不管多麼優秀，都難免會遭到明槍暗箭的打擊。時常有人稍有名氣就到處洋洋得意地自誇，喜歡被別人奉承，這些人遲早會吃虧的。所以在處於被動境地時一定要學會藏鋒斂跡、裝憨賣乖，千萬不要把自己變成對方射擊的靶子。


    盛名之下，其實難負。在積極求取巔峰期的時候，不妨思及顏之推的人生態度：明曉知足常樂的情趣，捕捉中庸之道的精義，稍稍使生活步調快慢均衡，才不易陷入過度偏激的生活陷阱之中。


    縱使你才華橫溢，也要一步步向上攀。如果你顯露張狂的鋒芒，企圖一步登天，那麼，你將摔得更加慘重。強者懂得如何把握自己，懂得不斷修整自己的做人處事技巧；所以，凡事不要那麼鋒芒畢露、咄咄逼人，真正的強者不需要別人的
    gaze。


    ## 別怕犯錯


    凱文·科斯納是美國著名影星，但是沒有幾個人記得他還出演過電影《水世界》(Waterworld, 1995)；湯姆·漢克斯是奧斯卡影帝，但是也沒有多少人知道他還是《跳火山的人》(Joe
    Versus The Volcano, 1990)的主角。


    那些電影之所以被人忘記，是因為它們都是「失敗」的作品。但是電影中的兩位演員，卻沒有因為暫時的失敗而沉淪下去，最終他們成為了偉大的演員之一。


    事實上，在所有的行業中，就算是那些最成功的人，其「錯誤」的時侯也要比「正確」的時侯更多。


    只有平庸的人才從不犯錯，因為他們不敢選擇，不去行動，自然沒有犯錯的機會。更為關鍵的是，平庸之人會因為一次失敗而頽瞠不已，所以他們不敢面對挫折，更不會承認錯誤；他們認為這樣就可以藏住自己那顆脆弱的心，殊不知，如此行事只會讓他們的懦弱和無能暴露在每一個人面前。


    對於真正的成功者而言，承認自己的錯誤是他們走向輝煌的開端，他們不會刻意隱藏自己的錯誤。正因如此，他們在失敗之後才顯得鎮定從容，別人休想從他們身上看到一點受挫之後的低落。這才是真正的藏心高手！


    1988 年，FBI 資深探員魏特曼 ( Robert “Bob” Wittman, 1959.2.3 - ) 開始從事藝術品偵探工作。就在同年，費城賓州大學博物館的「鎮館之寶」——
    一個非常巨大的水晶球被盜走。這個水晶球是當年慈禧太后所珍愛的寶物，歷經三十年水磨而成，比足球略大、籃球略小，二十公斤重，是世界第二大水


    晶球。


    竊案發生後，FBI將偵破工作交給了魏特曼。魏特曼在接手了這個任務之後，開始了長時間的調查。


    但是，搜尋水晶球的工作進展得非常不順利。魏特曼曾經幾度認為自己離真相已經越來越近了，但是最後才發現，自己所有的推斷都是錯誤的，只好從頭再來。直到水晶球被偷三年後的1991年，魏特曼才找到那個水晶球。


    雖然魏特曼經歷了多次失敗，但是他依舊充滿了激情。他的這種特質被FBI高層看在眼裡記在心裡，最後，FBI還出資讓他參加與藝術品相關的培訓。


    案例中的魏特曼耗時三年，歷盡失敗，才最終獲得了成功。我們可以想像，在這三年中他曾經犯過多少錯誤，走過多少彎路，但是他始終沒有氣餒或是變得煩躁不安，所以才能受到重用。


    柯南·道爾筆下的著名偵探福爾摩斯就是一個樂於出錯的人。當事實證明他的嘗試和推斷結果與事實相去甚遠時，他從不覺得窘迫和難堪，更不會由於灰心喪氣而心煩意亂。他總是對自己的錯誤一笑置之，然後很快集中精神，向真相邁進。


    愛迪生的妻子也曾經說過：「愛迪生總喜歡用排除法去實驗，為了一個燈泡，他實驗了三年之久，都失敗了。但是他總是自言自語地說：『不，我不會洩氣，因為每抛棄一種錯誤的嘗試，就讓我又向前邁了一步。』」


    你看，凡是能成大事的人，都有不懼失敗的精神。那你為什麼就不能在失敗面前表現得淡定一些呢？你在心中告訴自己，過失錯不在你，這樣一來，你就能坦率地承認它們，利用從中能找到


    一切可用的回饋資訊，調整前進路線，持續向前。


    當然，我們不能否認，當一個人竭盡全力去做一件事，最後卻沒能得到應有的回報時，心中自然會有些許的失落和惋惜。但是，你完全沒有必要將自己的這種情緒表達出來。因為所有的情緒都有這樣一個特點——「你越是表達，那麼情緒將越激烈」。所以，即便是在失敗面前有所不甘，你也要學著去藏住自己的成敗反應，這是藏心的重要內容。


    ## Step 3 放下 / 不煩躁，克制得失心


    你是否在遇到有人插隊或是遭同事算計時會暴跳如雷、情緒失控？這些情況會讓你在別人面前暴露自己的情緒，所以，人有必要克制自己因為某些突發事件而導致的情緒失控。這也是藏心術的主旨所在。


    本篇，我們將介紹一下用某些特定的小動作去控制自己的情緒。或許你會認為，在情緒激動的時候，是非常難控制的，要想透過某些小動作去控制更是不能的。那麼，先讓我們用一個故事來證明：小動作確實可以控制情緒。


    在納瓦羅小時候，他的祖母險些被一輛車撞上。在那個瞬間，他的祖母用手捏住了自己的脖子。一次，祖母在給家人講述事件經過的時候，又一次做出了同樣的動作。這個小動作引起了納瓦羅的注意，在之後的觀察中，他發現許多人在情緒激動的時候都會做出相同的動作，似乎那樣就可以緩解自己的激動情緒。


    之後，他才從自己的老師那裡得知，用手指揉擦頸背部，或者捏起下巴以下、喉結以上的皮肉——這個部位含有豐富的神經末梢，按摩之後能夠舒緩血壓、降低心率，發揮鎮靜的作用。


    進入 FBI 當探員以後，納瓦羅發現了這些行為的應用價值。


    1996 年，納瓦羅第一次被 FBI 總部派到一個劫持犯罪的現場，去執行狙擊任務。這是一個非常危險的工作，一個失誤就會造成不可挽回的損失。


    而首次執行這樣的任務讓納瓦羅感到非常緊張。這時他想起了祖母曾經做的那個動作，於是便開始按摩自己的頸部。過了一

    '
  mdcn: '

    這番話證實了里維斯的猜想，但是他卻沒有表現出絲毫成功的喜悅。相反，他倒是和那些犯罪分子一起大罵「該死的傢伙」。最後，誰也沒有懷疑正是里維斯一手促成了「三號」的被捕。


    這種故事經常發生在 FBI 探員身上，他們在進入敵人內部之後，就要掩飾每一次成功的高興之情。如果稍有不慎，就會暴露自己。他們確實是藏心的高手。


    其實，在生活中，我們也需要藏住自己的得失心，否則會被別人認為你是一個患得患失的人。在成敗面前，多一份淡定從容，才能體現出做人的風範。古人說：勝不驕敗不餒，就很好地說明了這個道理。


    對於我們的「藏心術」來講，如何面對成敗，在成敗面前該做怎樣的反應，也是我們的重要課題之一。接下來，我們將做出進一步的闡釋。


    ## 勝利者該有的心態


    雖然我們無數次見證了以弱勝強、以小博大的故事，卻不能讓人們脫離對勝利的膜拜和追求。渴望勝利，希望自己成為勝利者，是每個人都有一種心理。但是，並不是每個人都懂得如何面對勝利，在勝利之後該如何自處。現在，我們就說一說「什麼才是勝利者該有的姿態」。


    我們經常說一個成語——「得意忘形」，這個成語放到藏心術上，我們可以這樣理解：那些獲得暫時勝利的人，最容易暴露自己負面的人性。因而，學會如何在勝利之後藏心，是非常有必要的。


    在 FBI 探員面前的是一个無恥的恐怖分子。探員知道，此人在市中心某處安置了一枚放射性炸彈。如果不能在一個小時之內從恐怖分子口中追查到炸彈的具體位置，這個城市可能會遭遇建市以來最大的災難。


    「如果你現在說出炸彈的位置，你還有重新做人的機會。」探員對罪犯說。


    恐怖分子笑了笑：「我的夢想就快實現了，我等這一刻已經很久了，你想我會輕易放棄嘛？」


    探員接著說：「我知道炸彈就在市中心。我們將會對市中心所有的高樓大廈展開地毯式的搜尋。我想，一個小時的時間足夠了。」


    說完這句話之後，探員敏銳地發現，恐怖分子眼中流露出 一絲得意。這個表情雖然很短暫，但還是被探員捕捉到了。探員因


    此推斷出：「炸彈並沒有放到那些高樓大廈中。」


    但是探員裝作一無所知，繼續說：「我想，你可能不會把炸彈放到高樓大廈裡，那樣做雖然效果不錯，但是也太容易被搜查到了；我想，你也不可能把炸彈放到電話亭，因為那裡人太多，你顯然沒有任何機會。」


    說完這句話之後，探員發現，恐怖分子的眼中又有一絲得意閃過。探員心中震了一下，然後衝出去訊問室對同事說：「趕緊去盤查市中心的每一個電話亭，別問我為什麼，快！」


    半小時後，拆彈專家在某個電話亭解除炸彈，城市安全了。


    故事中的探員之所以能夠準確判斷出炸彈的位置，其實靠的就是從恐怖分子的「成功反應」中查找破綻。


    當探員說要搜查高層建築時，恐怖分子眼中的得意告訴他：這個人認為警方不可能在那裡找到炸彈，所以才顯得如此得意；當探員說電話亭不可能藏有炸彈時，恐怖分子的得意就恰恰是告訴他：炸彈就在電話亭。


    你看，一個人對於成功的得意之情，往往是難以克制的。所以，成功後的表現，最容易暴露內心。


    除了得意之外，成功還容易表現出其他心理狀態。一般來講，成功者最常見的心理狀態是自我滿足，俗稱驕傲。人的驕傲來自對自己的滿意認知，即便是自己的團隊共同做出了傲人的業績，人也常常會因此而感到自我驕傲——我是這個優秀團隊的一員！


    所有人都有自己的一個心理評價，而且對於大多數人來講，這個評價都是正面多於負面，就算是 一個一無是處的人，也會找到一些讓自己驕傲的理由。但是，我們也不能說驕傲絕對是一件


    壞事。如果一個人真的從內心中否定了自己，那麼他的情緒只有一個——絕望——後面會發生很可怕的事情。


    但是如果一個人過度自傲，那麼他一旦有了一點點成功，就會沾沾自喜，目空一切。此時，驕傲就成為一個人的負面品格。驕傲的人不會藏心，他們會盡量讓自己看起來更高大一些，例如抬頭、挺胸和眉毛上揚等動作，都是驕傲的直接體現。


    成功者還容易陷入於炫耀之中。喜歡炫耀自己的人可能會獲得一些成功，但這並不能掩蓋他們膚淺的本質。這些人恨不得讓所有人都認識自己，生怕別人不知道自己的本事。


    炫耀經常體現在肢體語言上，比如走路時晃動身體，就是典型的炫耀反應。這一點幾乎在一切人身上都能得到驗證，比如街頭混混喜歡大搖大擺，這就是炫耀。


    炫耀是一種能夠讓人輕易識破的狀態（事實上，炫耀就是為了讓人明白自己的狀態），對於大部分的人來講，很難做到炫耀卻不被人討厭。所以，我們需要克制自己的炫耀，藏住自己的得意之情。


    餐桌上，一位父親和朋友們談興正濃。父親突然自豪地對眾人說：「我只有一個女兒，但我的女兒可了不起了！」說罷，轉頭又對自己的女兒說：「去把妳的證書拿來，給叔叔們看看。」


    小女孩三步並兩步跑回書房，拿起那一疊「整裝待命」的證書，拿出去交給自己的父親。父親接過證書之後，一一打開並對眾人解說：這個是模範生的獎狀，這個是珠心算一級的證書，這個是……


    介紹完之後，小女孩就像明星般被隆重推出，聽眾們都嘖嘖稱讚，有的對小女孩報以讚賞的笑容，有的豎起大拇指說：「真


    行！這孩子真不錯！」「比我們家那孩子強多了！」「這孩子這麼聰明，肯定像她父親。」溢美之詞讓小女孩有些害羞，但更多的是驕傲。


    但是當證書傳到一個客人的手裡時，這個人並沒有像其他人一樣開口讚揚，而是若有所思地說：「這是妳以前得的吧？」聲音很平靜。


    「是的。」小女孩回答。


    「那現在的呢？」此人語調仍很平靜。


    「現在的？」小女孩一愣，想了想說：「沒有。」


    「小朋友，過去的都已經過去了，一定要把握現在呀！」這人感慨地說。


    小女孩和他父親聽了這一番話，覺得非常慚愧。


    這就是驕傲和炫耀的負面作用，「小時了了，大未必佳」的故事在生活中每天都發生著；人們往往落入這種負面的心態。所以，我們需要藏心，我們需要藏住自己的成敗反應。


    成功者的另一個常見心理狀態是傲慢。傲慢的心理根源是「自認為自己比對方好（強壯、富有、高貴……）」，這是一種極度的優越感，認為對方和自己完全沒有可比性，進而產生對對方的不屑。


    當然，傲慢也會表現在肢體語言上，頭向後仰，下巴抬高。因為下巴抬高了，再睜大眼睛看對方會比較吃力，所以常常是上眼瞼順其自然地遮住一半眼球，擺出居高臨下的姿態（暗示著：「我不稀罕花力氣好好看你」）。傲慢的人，他的下巴抬起所指向的方向，往往就是他蔑視的對象。當然，還有更過分的，有可能會再配合一些搖頭晃腦或者半露犬齒的輕蔑表情。


    ## 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    1993 年，FBI 開始介入進一起黑社會之間的火拼當中。

    當時，紐約最大的兩個黑社會組織開始了長時間的火拼。許多黑社會成員因此喪命，對社會治安造成了嚴重的破壞。為了平息這場鬥爭，FBI 決定「出面」解決。


    若想平息爭鬥，就必須先搞清楚他們的爭鬥緣何而起。

    很快，FBI 就在一張照片中找到了答案。照片中，兩個黑社會老大共處一室，但是其中一個的下巴明顯指向另一個。FBI 由此推斷，這場火拼很可能是因為其中一個黑社會老大對另一人的傲慢和不屑而產生的。


    找到問題的根源之後，FBI 開始「指示」另一個已經被自己控制的黑社會老大出面調停這場爭鬥。果然，經過調停，兩方停止了鬥爭。

    而在數年之後，FBI 又利用當年的這種做慢，將兩個社會組織分別剿滅。


    那些傲慢動作，往往會引起人們的反感，因此，我們在生活中應該盡量避免做出這樣的動作。一旦讓別人觀察到你有這樣的反應，即便你是無心的，也很容易被別人理解為傲慢和不屑。如果是對著上級、長輩或者其他應該尊重的人，出現傲慢反應，恐怕最終受損的那個人就是自己。


    ## 成功要低調慶賀？！


    有時候，一個人之所以生氣，是因為他心虛。比如，一個虛偽的人，在別人識破他的虛偽之後，會勃然大怒：「我從來沒有做過那樣的事情，你們不要污蔑好人。」他似乎不明白，生氣並不能成為一個人掩飾自己心虛的辦法。一個人想要真正的藏心，還是應該虛心而不是心虛。


    關於虛心與心虛，成功學大師卡內基（Dale Carnegie, 1888. 11.24 - 1955.11.1）曾經做過很好的詮釋，他說：「成功的人往往都很低調，因為他們自信，所以選擇虛心；只有失敗的人才去張揚，因為心虛，所以需要靠搞掉對方來掩飾。」


    這句話揭示了一個道理：越是外表看起來張牙舞爪的人，他們的內在其實越不足。而那些看起來「與世無爭」的虛心者才是真正強大的成功者。


    虛心的人自信自己的所作所為，所以往往都很低調，而心虛的人往往內心有鬼，所以總是靠張揚來掩飾內心的慌張，結果往往適得其反，更加顯示了他的不安。


    名震世界的諜探基德，在完成了一項重大任務後(CLASSIFIED) 棠譽歸來，警局所有人都為他大為讚頌。此時，如果他想要借此來炫耀自己的自傲的話，實在是一個好機會！而且沒人敢對此指手畫腳。因為經過一番艱苦的努力之後，他將敵方的情報系統幾乎全部毀掉，勝利屬於他。


    回國之後，審問敵方最高長官的任務還是交給了基德做。


    在審問中，敵方的那位長官衣冠楚楚，但是基德穿的卻是滿


    身污漬的旅行服。由於他來得匆忙，沒有穿制服，所以只好和一個下屬借了一身制服。


    從外表上來看，失敗者似乎更加「理直氣壯」，而作為成功者的基德卻更顯得低調。但是他能夠在面對失敗的對方首領時，不去驕傲地炫耀自己，而是謙虛地接受對方的投降，甚至用欣賞的眼光發掘對方的優點，這正是他為人的成功所在。


    可以說，古今中外的成功人士都有一個顯著的共通性——那就是懂得虛心，他們一般都很謙恭。其實他們有資本去驕傲，因為他們的成就自然會替他們宣揚。但是，他們都是選擇虛心走自己的路，謙卑而柔韌的實現自己的理想。


    因為他們都懂得，如果你對自己能否取得成就，或者能取得多大的成就還有所懷疑，也還不知能否得到他人稱讚的時候就開始自吹自擂，那其實就是在吹牛；如果一個人真正值得大家去稱讚，那就不根本沒有必要去自大，否則就是淺薄了。而一個淺薄的人是根本不可能取得成功的，也是根本不值得受人尊敬的。


    美國上議院議員迪普，為人謙虛正直，面對升職仍能保持清醒的頭腦，而不驕傲自滿。


    下議院的一個老僕人曾經這樣對別人說起迪普，他說他在下議院裡幹了三十多年，見過形形色色的人，但是還沒見過像迪普這樣，即使從一個議員一下子當了部長，也絲毫沒有改變自己說話的態度和語氣，他從來沒有見過。


    事實上迪普本人也極其反感他人的誇大讚揚。當他讓出議長之職以擁護林肯政府時，一般人看來，他應該受到何等熱烈的歡呼和稱讚，而他卻低調的否認一切，而且善意地批評了別人對他


    的誇大讚揚。那時雖然迪普還很年輕，頭腦卻很清醒，他懂得謙虛的道理，所以並不因為別人對他誇張的稱讚而自高自大。


    迪普不僅僅是一個虛心的人，甚至會對別人的誇獎「避之不及」，這既是一種境界，也是一種生活的智慧。虛心的人在眾人面前似乎總是不如心虛的人那樣盛氣凌人，但是他們贏得的卻是更多人的尊敬和最終的成功。孰輕孰重，相信所有人都一目了然。


    做人不是演電影，不是為了贏得滿堂喝彩的表演，而是時時刻刻分析情況，在每一回合上不求多得分，只求不失分，如此下去，則必定獲勝。因此，當你的羽翼尚未豐滿或是沒有必勝把握之時，不妨先隱藏一下自己的實力。


    提及機械錶，瑞士錶是全球最為頂級的。瑞士錶之所以代表著極品，是因為鐘錶調輮師的技術高超。調輮師諳熟機械錶的性能，對調整機械錶的溫度差、姿勢差等整合，有著世界最高的技術水準。


    鐘錶行業是全球含金量最高的行業之一，日本也企圖分一杯羹。然而，日本人深知自己的技術絕對達不到瑞士錶水準。不過，精明的日本人並沒有放棄，而是選擇了避其鋒芒。這其中，一家名為精工（
    SEIKO Watch Corporation ）的鐘錶公司開始將目標轉向石英錶以期突破。


    石英錶的運行機理是在石英上通入電流，使其發生伸縮性規律振動，然後將此振動以電氣的方法連接馬達來劃出時間。從振動的精確性而言，機械錶根本無法與石英錶相比。只要擁有耐震的能力，石英錶計時不受溫度等變化的影響，能達到非常精確的


    程度。


    但是日本人並沒有馬上就宣布自己在手錶上有 關於 重大的突破，他們在等待一個機會。在這個機會來臨之前，瑞士錶依然佔據著主流。


    機會很快來了。在瑞士，有一項納沙泰爾（Neuchâtel）天文臺鐘錶比賽，實際上，雖然這是專門為弘揚瑞士錶的威名而設置的，但也是一場世界鐘錶行業的擂臺賽。當日本人把他們的精工錶拿來比賽時，十五塊石英錶通通都排到了瑞士錶的前面，這樣的比賽結果對瑞士人來說就好似當頭挨了一悶棍，久久無法回過神來。


    瑞士廠商在沉重的打擊下憂心忡忡，坐立不安，直到第二年才把得分表寄往日本，同時不公開名次，並宣布從此停辦納沙泰爾天文臺的鐘錶競賽。


    就這樣，風靡了數百年的瑞士錶，在石英錶領域栽了大跟斗。從那以後，日本精工鐘錶公司又開發出了「大眾化、小型化」的石英錶，使其為多數人所接受，在市場上站穩了腳步。如今，「精工」已成為享譽世界的著名商標，是全球聞名的大鐘錶生產公司。


    對於強者，我們都有這樣一種感覺——他們在未發跡之前都顯得非常平常，他們都是善於沉默的，但是一旦發跡，就勢不可擋。這正是因為他們善於隱藏自己的實力，把自己的鋒芒隱藏起來，掌握一種外圓內方、綿裡藏針的處事技巧，這反而會讓人更加無法攻擊。別人的攻擊因為沒有著力點而不能發揮作用，反之自己只需輕輕一擊，就可以令競爭對手受到重創。


    退一步講，即使不是那些成功人士，絕大多數的領導階層也


    都懂得這個道理。因為在如今的社會中，幾乎一切都講究合作，尤其是企業和團隊組織裡面，很多事情都需要不同專長的人員一起合作才能達成目標。


    換句話說，鋒芒過露，這絕不是一個成熟商界人士應有的行為。這麼做，不但會損害別人的自尊，還可能會破壞自己已經有的優勢。因為鋒芒畢露時間長了，自然就會引起一些人的嫉妒，會給你增加一些障礙。


    深藏不露是智謀，過分的張揚自己，就會歷經更多的風吹雨打，暴露在外的屋椽自然會先腐爛。一個人在社會上如果不合時宜地過分張揚、賣弄，那麼不管多麼優秀，都難免會遭到明槍暗箭的打擊。時常有人稍有名氣就到處洋洋得意地自誇，喜歡被別人奉承，這些人遲早會吃虧的。所以在處於被動境地時一定要學會藏鋒斂跡、裝憨賣乖，千萬不要把自己變成對方射擊的靶子。


    盛名之下，其實難負。在積極求取巔峰期的時候，不妨思及顏之推的人生態度：明曉知足常樂的情趣，捕捉中庸之道的精義，稍稍使生活步調快慢均衡，才不易陷入過度偏激的生活陷阱之中。


    縱使你才華橫溢，也要一步步向上攀。如果你顯露張狂的鋒芒，企圖一步登天，那麼，你將摔得更加慘重。強者懂得如何把握自己，懂得不斷修整自己的做人處事技巧；所以，凡事不要那麼鋒芒畢露、咄咄逼人，真正的強者不需要別人的
    gaze。


    ## 別怕犯錯


    凱文·科斯納是美國著名影星，但是沒有幾個人記得他還出演過電影《水世界》(Waterworld, 1995)；湯姆·漢克斯是奧斯卡影帝，但是也沒有多少人知道他還是《跳火山的人》(Joe
    Versus The Volcano, 1990)的主角。


    那些電影之所以被人忘記，是因為它們都是「失敗」的作品。但是電影中的兩位演員，卻沒有因為暫時的失敗而沉淪下去，最終他們成為了偉大的演員之一。


    事實上，在所有的行業中，就算是那些最成功的人，其「錯誤」的時侯也要比「正確」的時侯更多。


    只有平庸的人才從不犯錯，因為他們不敢選擇，不去行動，自然沒有犯錯的機會。更為關鍵的是，平庸之人會因為一次失敗而頽瞠不已，所以他們不敢面對挫折，更不會承認錯誤；他們認為這樣就可以藏住自己那顆脆弱的心，殊不知，如此行事只會讓他們的懦弱和無能暴露在每一個人面前。


    對於真正的成功者而言，承認自己的錯誤是他們走向輝煌的開端，他們不會刻意隱藏自己的錯誤。正因如此，他們在失敗之後才顯得鎮定從容，別人休想從他們身上看到一點受挫之後的低落。這才是真正的藏心高手！


    1988 年，FBI 資深探員魏特曼 ( Robert “Bob” Wittman, 1959.2.3 - ) 開始從事藝術品偵探工作。就在同年，費城賓州大學博物館的「鎮館之寶」——
