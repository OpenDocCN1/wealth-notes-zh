    Desensitization）。


    所謂「循序減敏法」，就是讓人反覆接受恐懼刺激物的刺激，使其逐漸適應這種刺激物，逐步消除自己的恐懼。比如，有些人非常害怕打針，但是如果他患了一場大病，每天都需要打針，過幾個月你就會發現，這個人對打針的恐懼已經完全消失，因為他習慣了。


