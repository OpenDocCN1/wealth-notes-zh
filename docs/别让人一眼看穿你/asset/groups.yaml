    # 話語中的破綻


    FBI 探員在審問的時候，會用一個小小的伎倆：他們先問一個個人問題，然後等他們回答。然後問第二次，這時那個要掩飾自己的人，肯定還牢牢記得自己當初所說的虛假答案。當第二次問話之後，他們不會在短時間內再次詢問相同的問題。在這期間，嫌疑人的身體會平靜下來，他們會想：「我已經蒙混過關了。」


    由於人在掩飾自己的時候，所說的話並沒有多少事實基礎，所以在放鬆下來之後，很快就會忘記。因此第三次提問時，嫌疑人往往會驚慌失措，不能將之前編造的那個謊言再原原本本地複述。


    雖然絕大部分人都不會被審問，但是在生活中，我們似乎都遇到過這樣的事：當初為了掩飾自己而說出的某些話，隔幾天之後，當人們再細問起來，自己第二次的回答卻和之前的話相差甚遠。這就會讓人懷疑你的人格，即使當初你說謊的目的是善意的。所以，我們若想藏心，第一件事情就是盡量不要忘記自己說過的每一句話。


