    ## Ⅰ 自信要不卑不亢


    「上交不諂，下交不瀆」，是孔子提出的一個重要的待人處世原則，意思是說，與高於自己的人交往，不要低聲下氣；與低於自己的人交往，不要高傲怠慢。


    在孔子這條準則中，「上交不諂」其實說的就是克制人的服從行為。但是，這條準則雖然看起來容易做到，實際上卻不是那麼簡單的事情。


    一次，蘇軾到莫干山遊玩，看到山上有一間廟宇，他想進去歇一會兒。


    老道當時看蘇軾穿的衣服很樸實，看起來也沒有什麼過人之處，就非常輕慢地指了指椅子說：「坐。」然後吩咐道童：「茶。」


    等到兩個人交談了一番之後，老道發現蘇軾談吐不凡，恐怕不是一般人，就把他引至大殿，有點客氣地說：「請坐。」同時向道童說：「敬茶。」


    到最後，他終於發現眼前的這個人就是大文豪蘇軾，竟慌忙打躬作揖，把他讓進客廳，口中連連道：「請上坐。」然後吩咐道童說：「敬香茶。」


    臨別時，老道請蘇軾題字留念，蘇軾便開了個小玩笑，寫下「坐，請坐，請上坐。茶，敬茶，敬香茶」的對聯以為諷刺，弄得這位老道很不好意思。


    故事中的這個老道，其實就是典型的從眾反應受害者。他之前沒有見過蘇軾，雖然見到蘇軾表現得比較冷淡才是應有的狀態；可是他卻因為別人都尊重蘇軾，自己便也對蘇軾尊重有加，這不是一件壞事，但確實是從眾反應的表現。


    同時，我們還需要注意一個細節，那就是老道在知道蘇軾的真實身分之後，做了一個動作——「打躬作揖」。在心理學上，這個動作意味著示弱和服從。低頭聳肩，這樣的動作在古裝劇中我們經常會看到，臣子面見皇上時經常低著頭、哈著腰。而今在職場，下屬靠近自己的上司時，往往也會採取這種姿勢，這雖不如古裝戲那麼明顯，但仔細觀察還是能看得到。不難判斷，在這種情況下，做出這種動作是因為身分、地位與權力不如對方。


    如果是身分、地位差不多時，做出這種動作，則意味著此人內心缺乏自信，並且不想引人注意。比如，當看到一群不太熟悉的同事在一邊談話，從他們旁邊經過的時候，我們都會怎樣做呢？


    自信且愛表現的人會昂首挺胸地走過去，希望對方注意到他。如果對方沒有留意到，他也會主動打招呼；而不太自信的人則會不自主地縮緊脖子，努力讓自己顯得更弱小和不太引人注意，期望對方不要注意到他。


    凱特有個十七歲的兒子名叫詹姆斯，是一個高中二年級的學生。詹姆斯身高一百七十八公分，身材魁梧強壯，外人都覺得他是個帥氣十足的男子漢。但凱特在跟詹姆斯的老師談話時卻說，兒子外表看上去高大威猛，但實際上是個羞澀的孩子，希望老師能配合自己幫助兒子樹立信心。


    「嘎，您為什麼這麼說呢？詹姆斯看起來很不錯啊。」老師一臉驚訝地望著凱特。


    「不是這樣的，這都是假象。住我們隔壁的鄰居是個心理學博士，好幾次我跟鄰居聊天，詹姆斯從旁邊經過都低著頭、聳著肩，不說一句話。鄰居問我詹姆斯是不是缺少自信，剛開始我還不以為意，後來慢慢觀察，我覺得鄰居說得沒錯。他外表很強壯，內心卻很自卑，希望老師能幫我讓孩子樹立自信心。」凱特語重心長地告訴老師。


    案例中的這個男孩，就是因為他沒有自信的一個動作，讓心理學專家看出了他的內心。事實上，低頭聳肩這個動作，非常容易暴露一個人的內心。


    在會議上，不想發言的人會在老闆用視線巡查時低下頭，為的是避免和他視線相交而引起他的注意；在生活中，相信我們大部分人都不願意在別人面前表現得弱勢——那麼，你千萬要注意自己的這個動作，否則，很容易讓人看穿你心中的沒有自信。


    此外，低頭聳肩這一行為，也有示弱、潛意識中乞求憐憫、尋求自我保護的意思。


    某公司老闆指著報表上的一個數字問會計：「妳覺得這個月的支出對嗎？」會計看了看，發現自己犯了一個根本的計算錯誤。老闆威嚴的神情讓她不由得聳起了雙肩，把頭深埋下去。她的這副姿勢讓老闆心軟了，於是說：「下次注意。」


    女性大多性格溫柔而恭順，在遇到障礙、挫折，或者在尷尬的狀況下時就會做出低頭聳肩的姿勢，而且這樣的動作會使其顯得嬌弱，讓人不由得心生憐惜。


    ## 別讓人一眼看穿你

