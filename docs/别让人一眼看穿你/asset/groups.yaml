    這個案例解釋了一個道理：「你不能透過創造新問題來解決舊問題。」有時候，你如果不會隱藏自己的憤怒情緒，就可能給自己製造新的麻煩。假如故事中的柯比沒有控制好自己的憤怒情緒，對嫌犯表現出自己的侵略性，就不會如此順利的完成任務。


    所以，當你感到自己的憤怒已經無法控制的時候，不妨停下來捫心自問：「暴力或是刻薄的言語，對眼前的事 情有幫助嗎？」此時，你就會發現自己的憤怒情緒其實毫無用處，這意味你已經向控制這種反應邁出了一大步。


