    # 自信，讓人無所畏懼


    擁有自信的人，不管出現什麼情況，都能夠排除一切萬難，他們的氣場告訴周圍的人：「沒有什麼不可能的事」。一個自信的人，是永遠不會感到害怕的！


    恐懼是一種膽小怕事的心態，它就像個左右人心智的魔鬼，讓人做事畏首畏尾，在人前顯示出一副無能的樣子。這種人沒有自信，他們的情緒常常是消極的，就算有機會擺在面前，也會拱手讓人。這可能是因為他們過去遭受過失意和打擊，對自己和前途缺乏自信，不敢為自己的未來付出行動，總是在考慮行動的結果，消極地面對眼前的事實，終日處在憂慮之中。


    FBI 探員卡恩曾經當過一次「心理治療師」。當時一位很有名氣的跳高選手，在獲得一系列的成績後，開始陷入了低潮。他只要一接觸跳杆就會喪失自信，開始認為自己不行，失敗的念頭立即湧上心頭，使他沒有勇氣去跳。


    當時他的教練認為：這一定是競爭對手在暗地裡搞鬼，所以找來了朋友——FBI 探員卡恩，想讓卡恩查清楚這到底是怎麼回事。


    透過幾次觀察，卡恩很快發現了問題的癥結所在：這個跳高選手一路走來都是順順利利的，沒有經歷過挫折，所以沒有足夠的抗壓能力，就像溫室的花朵一樣，沒經歷過風雨，所以一點的風吹雨打就會枯萎凋謝。


    針對這種情況，卡恩對他的教練說：「你的隊員發揮不好，完全是自己的原因。不過，我可以用訓練探員的方式，來幫助他'
  - '[PAGE 216]


    # 別讓人一眼看穿你

    讀心與藏心的攻防智謀


    走出低潮。」教練答應了卡恩的要求。


    從那以後，卡恩開始對症下藥，鍛煉他的抗壓能力。他告訴那個跳高選手；下一次去跳高的時候一定要面帶微笑，要自信，要藐視欄杆，當它是遊戲，跳不過就重新再來。


    那位選手狠狠地點了點頭，他照著卡恩教他的方法，帶著自信的微笑助跑，起跳，縱身一躍，他成功了，他跳出了心理的障礙！此後幾年，他不僅重新站上了領獎臺，而且超越了過去兩年的最佳紀錄。他的體壇之路越走越成功。


    在一次採訪中，他還提到過這件事。他對記者說，他之所以有今天的成就，有一個人功不可沒，那就是他的卡恩「老師」。是卡恩教會了他面對挫折要微笑，要樂觀，要對自己說我可以。


    事實上，這個世界上並沒有那麼多值得擔憂的事情。就算你對一件事情產生了憂慮時，你也不該總是去想最壞的結果，因為憂慮的事情可能會出現，也可能不會出現，只有這兩種可能。當它發生了，那
    investment 積極地解決，想得再多也無濟於事；想太多反倒是給自己上了枷鎖，久而久之，就會影響你的心態，讓你對一切事物都憂心忡忡。若是真的養成了這樣的習慣，你就只能白白地消耗時間和精力，整個人也會沉浸在一片憂鬱之中。


    恐懼多數情況下都是心理作用。不過，它會抹殺你的潛能，削弱你的自信。相信在你感到恐懼，並將這種恐懼的感受告訴他人的時候，你的親人朋友一定會對你說：「哦，不要怕，那都是你的幻想，沒有什麼可怕的！」這種安慰可能會暫時消除你的恐懼，但它卻沒有持久的「藥效」，因為你的心態沒有轉變，你沒有建立信心消除恐懼。


    自信的心態是看不見的法寶，能夠發出驚人的力量，讓你克'
  - '[PAGE 217]


    服恐懼，排除萬難。如果你用積極的心態發揮自己的思想，並相信成功是你的權力，你的信心就會使你成就你所制定的目標。如果你因為恐懼而消極了，滿腦子都是恐懼和失敗，那麼你的結果也就是這些了。


    所以，你不要再擔憂害怕了，給自己一點信心和鼓勵，打敗你內心的那個魔鬼。告訴自己：「我是幸運的，我是順利的，我註定是不平庸的，沒有什麼可以擊倒我。」


    當一個人的心態積極，是充滿自信的，他就萌生了巨大的勇氣，會用積極的行為去改變自己的處境。


    生活中難免會遇到有挑戰性的事物，或是一些棘手的問題。如果我們被嚇倒了，在氣勢上短了一截，認定了自己挨不過，那hu就只有「認命」的分了。一個人若是消極處世，氣勢就會慢慢消失，最終淪為一個不起眼的平庸之輩，過著淡然無味的生活。


    事實上，很多看似強大的、不可戰勝的東西，並不如我們想得那麼可怕，如果因此而消極，就會失去許多成功的機會。有時候，它們的強大只是源於我們內心的弱小。


    電影《哈佛的天空》( Homeless to Harvard: The Liz Murray Story, 2003 ) 講述了一個令人發奮的故事：


    生長在紐約的女孩莉姿，沒有良好的家庭環境，父母吸毒，周圍的人也都是得過且過，彷彿環境註定了他們未來的人生路。她小小年紀經歷了人生的艱辛和辛酸，但卻沒有絲毫抱怨，也沒有就此沉淪。她始終相信，憑藉自己的信念和努力可以改變現在的一切。


    最終，這個貧苦的女孩用樂觀的心態和頑強的毅力改寫了自己的人生，夢寐以求的哈佛大學向她敞開了雙臂。她用自己親身'
  - '[PAGE 218]


    # 別讓人一眼看穿你

    讀心與藏心的攻防智纐


    的經歷告訴世人：人生其實可以改變。


    我們從來不會被生活打敗，我們只會被自己打敗，敗在自己的心態上。有些事情，我們只有努力去嘗試，努力去做，才有可能變為現實。如果連試一下的勇氣都沒有，始終抱著「我不行」的態度，那又談什麼成功呢？'
  - '[PAGE 219]


    # 認識自己，接受自己


    每個人都是獨立的，一個人接納另一個人很難，但一個人接納自己更難。


    我們時常對自己不滿，為自己的缺點懊惱與煩悶，千方百計想掩飾。自己面對自己時，我們常常會陷入懼怕與悔恨中不能自拔。


    太多人之所以會對生活有那麼多的不滿，其實不是外界影響，而是因為對自己的境遇有太多的不滿。這種想法大部分人都有，但是從實踐的角度來講，對自己不滿又有什麼用呢？自己又不是別的物品，不喜歡了就可以隨時扔掉；也不和別人一樣，合得來便相處，合不來便分手，用不著去委曲求全。我們自己不可能把自己扔掉，也不可能自己與自己「絕交」。


    自我是一個不可能逃避的話題，無論你情願也好，不情願也罷，滿意時，它和你在一起。不滿意時它同樣不會離開你。生命的無奈也在於此。


    有的人很早就接受了自己，有的人至死都無法接受自己。


    儘管我們知道，相貌、性格和生命一樣，都是我們所不能自由選擇的，然而，對於自己的不滿意，卻時刻折磨著我們。


    醜陋使我們不敢大聲講話，不敢仰起頭走路，不敢面對他人的注視，在美麗的人面前，我們更本能地感到自卑。總希望有一天，魔鏡會突然出現，告訴你是天下第一美人。


    性情也是我們在不知不覺中形成的。雖然我們並不對自己的容貌與性情負完全的責任，但我們卻不得不每日面對它。蘇格拉底能夠認識自己，接受自己，才宣稱自己「自知無知」。我們雖'
  - '[PAGE 220]


    # 別讓人一眼看穿你

    讀心與藏心的攻防智纂


    不能像蘇格拉底那樣，自知自己無知，但接受自己是無知的，卻是可以做到。


    接受自己有多種方式，因為世界上有照臉的鏡子，但沒有照心的鏡子，也因為這都是自己的私事，別人可干涉不上。


    對自己的優點，我們自己不去挑明，而千方百計誘導別人說出，這其中的奧妙值得品味。自己說的，那叫自我吹噓，叫退能；別人說的，是「客觀」，是「實事求是」。聰明的人最善用這一招，還會讓對方說一句：「你真謙虛」。


    FBI 探員梵甘迪，年輕時由於其貌不揚，往往被別人輕視，他為此非常苦惱。


    等到梵甘迪參加 FBI 探員的選拔時，他心裡其實也很不安。雖然他自信能力出眾，但是ULD一想到自己的相貌可能會讓自己扣分，他就非常害怕。


    幾個月後，選拔結果出來了。梵甘迪如願以償，成為了一名探員。在他上班的第一天，他的教官告訴他：你之所以能夠擊敗眾多有實力的競爭者，就是因為你的相貌。


    對於自己的缺點，我們難以接受，更不願意被別人指出，尤其是當眾指出。上司每次作完報告都要說「歡迎批評指正」之類的話，可千萬不要當真！這意見不能「指」，更不能「正」，只能當作沒有，最好本來就沒有。不然，你肯定會免費獲得許多「指教」。


    比較聰明的一種是：人貴有自知之明。只有自己知道了，自己察覺出問題，神不知鬼不覺地改掉，這才是上上之策。


    接納自己需要勇氣，也需要毅力。接納自己，是一個漫長而'
  - '[PAGE 221]


    艱苦的過程，也是一個人長大、成熟的過程。這當然是一個痛苦的經歷，因為我們會逐漸發現，自己不是那樣完美，也不可能變成理想的自己。接納自己的優點也接納自己的缺點，面對自己的優點需要勇氣，面對自己的缺點更需要坦誠，需要包容。


    只有當我們能夠容忍自己不足的時候，才能以正確的價值觀面對整個世界。在生活中，我們總會聽到很多感嘆命運不公的聲音。但事實上，生命中最大的不公平就是連自己也無法容忍自己。你想一想，一個人連自己都不能容忍，他還能再容忍什麼？因為不能容忍，所以生命就有了不公。


    正如貝多芬說的那樣，他要扼住命運的喉嚨。在我們看來，他之所以扼住了命運的喉嚨，首先就是因為他認同了自己的不足。古往今來，人類從茹毛飲血的遠古走到科技發達的今天，靠的就是主宰命運的雙手：靠這雙手打造工具，開始創造輝煌文明的未來；靠這雙手築屋修路，營造安穩和平的生存環境；靠這雙手，創造整個人類的璀璨文明！而對於我們自己，我們每一個人也能靠這雙手規劃生命的軌跡，成就未來的輝煌，主宰自己的命運。'
  - '[PAGE 222]


    # 鍛煉意志，凡事將不足為懼


    我們為什麼會感到恐懼？有時候，之所以沒有信心與眼前的困難作鬥爭，是因為我們的意志力不夠頑強。


    每個人在前進的道路上，肯定都會遇到這樣或那樣的困難。有些人在挫折中不斷的錘煉著自己，愈挫愈勇；有些人則被眼前的困難搞得焦頭爛額、喪失鬥志，最終一事無成。作為一個藏心高手，首先必須是一個意志力頑強的人，因為只有這樣的人，才能做到藏心。


    「時間順流而下，生活逆水行舟。」在人的一生中，困難將始終與你相伴，無論多幸運的人都是如此。既然困難不可避免，那我們就該勇敢面對，敢於對命運說：「讓暴風雨來得更猛烈些吧！」


    生活中，每一個人會面臨壓力，沒有人可以倖免。不管我們是否願意，壓力都會每天陪伴著我們。如果想在這個充滿競爭的社會上獲得更高的成就，學會化壓力為動力就是一種必備的生存之道。


    只有善於化解壓力的人，才能向別人更好地展示自己的樂觀、不屈不撓的精神，以及面對問題時積極思考的頭腦。只有這樣的人，才會得到別人的重視和尊敬。


    這世界上能能力的人很多，但是最後能獲得成功的卻有限，這是因為，成功不僅僅需要能力，更需要意志。而成功路上的各種風雨坎坷，到最後都是對意志的考驗。誰的意志頑強，就能衝出風雨見彩虹；誰意志薄弱，就將倒在成功的最後一道大門之前。'
  - '[PAGE 223]


    成功學大師卡內基認為，在世界上，沒有別的東西可以替代堅忍的意志：教育不能替代、父輩的遺產也不能替代、而命運更不能替代。秉性堅韌，是成大事、立大業者者的特徵。由此可見，「如何面對困難」，是成功者和失敗者之間的一道分水嶺。成功者能夠)邁過困難的阻擋，而失敗者卻總是在困難面前止步不前，最終一生流於平凡。


    在 FBI 的歷史上，有許多次重大任務的成敗就在一線之間。每當探員 B 遇到困難，情緒低落的時候，都會聽到這麼一句話：「堅持最後五分鐘。法國拿破崙那句名言『最後五分鐘』，我們千萬不能忘記。最後五分鐘是決定勝負的關鍵。」結果，探員們總能在最關鍵的時刻壓倒困難，壓倒自己心中的恐懼心，贏得勝利。


    高手對決的戰場，「最後五分鐘」是決定勝敗的關鍵；但就是這「最後五分鐘」，往往最難堅持。有這樣一句金言：「當你最嚴峻困難的時候，也是敵人最嚴峻困難的時候；常常是當你因困難而決心動搖的時候，也正是敵人對勝利已感到絕望的時候。這種時機是最緊要的關頭，這種時機決定於何方能堅持；何方能熬過這最後的五分鐘，何方就能取得勝利，因此我們要堅持最後五分鐘。」


    其實，做人和執行任務一樣，「千錘敲鑼，一錘定音」。在追求夢想的路上，也許你已經經歷過太多的苦難和不幸，但是你記著，千萬不要喪失動力，更不要感到恐懼，只要堅持到日出雲開，成功就是你的。


    那些能突破一次次困難，到達理想境地的人，最終都能獲'
  - '[PAGE 224]


    # 別讓人一眼看穿你

    讀心與藏心的攻防智慧


    得成功。但是要做到這一點談何容易！有人遇到了一次失敗，便把它朽作是「滑鐵盧」，從此便失去了勇氣，一蹶不振。可是在剛強堅毅者的眼裡，永遠沒有所謂的滑鐵盧。他們即使暫時陷入低谷，也不以一時失敗為最後的結局，他們還會投入下一場戰鬥中。所以他們能在每次失敗後馬上再重新站起，而且比以前更有決心、更有毅力的向前邁進，不達目的絕不甘休。


    一個人想擁有面對困難時百折不撓的精神，沒有一顆堅忍的心是萬萬不可能的。但凡有所成就的人，做每件事都會堅忍不抜，全力以赴。不管成功的機率多大，哪怕只有百分之一的把握，他們也會百分之百地努力。


    一個有著堅強意志力的人，便有創造的力量。不論做什麼事都要有堅強的意志，任何事情只有付出極大的努力才能獲得成功。擁有頑強意志力的人，在面對困難或突發事件時常表現得鎮定自若、異常冷靜，這樣才能發揮內在的潛能，找到解決問題的辦法。


    至於如何增強意志？只有在一次次經歷中培養和磨練。


    單純的口號，不僅不能體現出霸氣，反而會讓你如紙老虎一般，一碰就破。


    意志力的強大力量是難以想像的，它能克服一切困難，不論所經歷的時間有多長，付出的代價有多大，無堅不摧的意志力終能帶領人到達成功的目的。


    > 愛默生說過：「偉大高貴的人物最明顯的標誌，就是他堅定的意志，不管環境變化到何種地步，他的初衷與希望，仍然不會有絲毫的改變，而終至克服障礙，以達到所企望的目的。」


    意志力強的人，心中充滿了無限的可能性，他相信一切都是足以超越的——只要你認為「能」，就一定「能」！'
  - '[PAGE 225]


    # STEP 9


    # 鎮定


    不慌張，穩住逃離反應


    太多時候，我們總顯得不太鎮定。慌亂無措的行為，想要逃離危險的心態，均是暴露我們內心的罪魁禍首。想要藏心，就必須讓自己變得鎮定一些。


    想要讓自己變得鎮定，變得更有城府，是一件不容易的事情，這需要耗費我們太多的精力，所以，我們需要有步驟、有計畫地改變自己。本章會給大家指出一條明路，讓大家知道：「我可以透過這樣的辦法，來讓自己變得更鎮靜。」


    ![](img/65c5e2383679681693f7479829cb5f93_225_0.png)


    ![](img/65c5e2383679681693f7479829cb5f93_225_1.png)'
  - '[PAGE 226]


    # 逃跑—剉那


    本章中，我們要講一種和凍結反應一樣，擁有「悠久歷史」的人類本能 —— 逃離反應。


    所謂逃離反應，就是人在感受到厭惡或恐懼的時候，所產生的一種反應。造成這種反應的源頭是，那些對人構成威脅的刺激源足夠強大，人沒有改變局面的信心，所以會造成人的逃避心理。遠古時代，逃離就是簡單的跑，但是在現代社會中，逃離則多數比較隱晦。


    如果你出現了逃離反應，那麼別人就可以判斷出，你對眼前的東西產生了厭惡或是恐懼。和凍結反應一樣，這也是人與生俱來的一種自我保護措施。但是在現代社會中，值得人真正逃跑的事情越來越少了。可是我們的逃離反應依然發生著作用，更可怕的是，它隨時都有可能暴露我們的內心。


    某次，FBI 探員在機場巡查，他們的目標是找出一個潛逃中的連環殺手。FBI 探員知道，這個人很可能已經易容變裝，想要抓到他可不是那麼容易。所以他們擦亮了眼睛，四處尋找。


    可是找了將近半個小時之後，探員依舊一無所獲。


    這時候，從機場外面進來一個人，看起來和其他人並無區別，向著登機口走去。此時，一位機場保安人員從他身邊經過時，不小心撞了他一下。那個保安人員立刻向他道歉，他僅僅是點點頭，並未說話。


    這一切都被探員看在眼裡，他們注意到，在保安人員和他身體接觸那一剎那，他的腳立刻擺出了一前一後的姿勢，類似運動'
  - '[PAGE 227]


    # Step 9 鎮定 / 不慌張，穩住逃離反應


    員在起跑線上所採用的起跑動作，這是最典型的逃離反應。探員立刻上前「請」他談一談，果不其然，此人正是 FBI 要找的那個連環殺手。


    探員之所以判斷那個人有問題，是因為對於一般人而言，機場保安並不能對他們形成威脅，所以不會因為保安人員碰他一下就產生逃離反應。而這個人卻表現出了明顯的逃離反應，只能證明他心裡有鬼！


    採用這個案例只想說明一個問題，那就是逃離反應確實會暴露我們的內心。


    大家不要以為只有「心裡有鬼」，才可能產生逃離反應。事實上，對於我們每個人而言，即便我們的內心坦蕩，但是在受到某些刺激的時候，還是會產生逃離，進而暴露我們當時的心理狀態。


    在金庸小說《笑傲江湖》中，有這樣一個場景：令狐沖在知道師傅岳不羣是個偽君子之後，對他產生了極度的厭惡感。所以當岳不羣過來想拍一下令狐沖的肩膀時，令狐沖自然而然地閃避了一下。而岳不羣則哼了一聲，走開了。這就是典型的逃離反應出賣一個人真實想法的案例。


    在現實生活中也是這樣，當我們內心對一個人非常厭惡或是害怕的時候，這個人若是試圖接近自己，我們也可能會產生逃離反應。由於逃離反應很容易被人看穿，進而讓人意識到：這人是討厭（害怕）我，所以逃離反應經常會暴露我們的內心想法。所以，要藏心，必先控制自己的逃離反應。


    事實上，我們的父母很早就在幫助我們克服自己的逃離反應。由於每個人天生對陌生人都有 Anton 的恐懼感，所以小時候，'
  md: '

    別讓人一眼看穿你

    讀心與藏心的攻防智慧


    一次做好一件事，消除對壓力的恐懼


    當我們無法好好地應付眼前的大量工作時，內心就會產生恐懼。這種恐懼會讓我們不安、擔心或焦慮。這就是壓力產生的原因。


    毫不客氣地說，在大多數時候，壓力是我們自找的。我們總是在想「我也許一次便能做完這些事」，而這個想法便是產生壓力的根源。我們總想嘗試著去做自己能力範圍之外的的事情，並且因此做了許多「徒勞無功的事」，結果讓人垂頭喪氣。


    若想隱藏我們對壓力的恐懼之心，其實也非常簡單，那就是「一次做好一件事」。如果我們遵循這個道理，將所有精力都集中於正在做的這一件事情上，就會發現，所有的壓力都不見了，自然也不會對壓力產生恐懼。


    如今，有些人奉行「多工」工作法。對大多數人而言，這種工作法其實是毫無意義的騙局。無論在哪個領域，頂尖高手都是集中精力「各個擊破」，而不是同時完成多項任務。


    在生活中，我們經常可以看到一些業務員在穿越馬路時還在給客戶打電話，事實上，這些辛勤的業務員通常都是比較平凡的人。頂尖銷售人士永遠不會那樣做，因為當他們想打這樣的電話時，會找一個能夠集中注意力的時間和環境。


    在 FBI 任職多年的心理醫師曾經發表過一篇論文，此文曾幾乎在一夜之間成為緩解壓力和恐懼的經典。精神崩潰、憂慮以及所有其他個人問題，都是因為這些患者想同時完成更多的事
    情。而那些壓力大、經常感到恐懼的探員，都是在同時執行多項任務，而且他們總是喜歡將多項任務同時進行。


    有一次，在看到一個沙漏之後，醫師受到了啟發。他突然想到：就像一次只能有一粒沙子通過沙漏一樣，我們也只能每次完成一件事情。使我們陷入困境的不是工作本身，而是我們對工作的固執看法。


    「多數人之所以感覺匆匆忙忙、筋疲力盡，是因為對自身義務、責任和職責的錯誤認識。在某個特定時刻，似乎有十幾件不同的事同時壓在我們身上，有十幾件不同的事要做，有十幾個不同的問題要解決，有十幾種不同的壓力要承受。」醫師如是說。


    為了控制自己對於壓力的恐懼，我們不妨買個沙漏，放在一個顯眼的地方，在它上面或旁邊貼一個小告示，上面寫著「一次一粒沙」。讓它提醒你每次只能做好一件事情，久而久之，你對於壓力的恐懼心將會大大減少。


    當然，我們也應該意識到，即便是每次只做一件事情，如果這件事情的困難度夠高的話，還是會對我們形成壓力，進而讓我們產生恐懼。這時候，我們需要引入另一種減輕壓力的辦法，那就是把很難處理的事情放到明天。


    如果你整天被一個棘手的問題所困擾，不能有所進展，不妨把它從大腦中剔除，推遲做決定的時間。請記住：只有在你的意識不存在過多干擾時，工作效率才會最高。


    愛迪生的夫人說，每天晚上，愛迪生都會把第二天要做的事情先在腦子裡想一遍。更重要的是，愛迪生習慣於在遇到難題時「打盹」。他打盹不只是為了休息一下，而是一種暫時的「放下」。


    由此可見，我們在面對壓力時，確實需要採取一些迂迴策略，不能總是和壓力「鑽牛角尖」，那樣只會助長壓力的氣焰。


    別讓人一眼看穿你

    讀心與藏心的攻防智慧


    當你克服了自己的壓力之後，就會發現自己的恐懼也會相應的消失。而此時，你在工作中的焦躁和不安也會被藏起來，這就是藏心術的妙處。


    自信，讓人無所畏懼


    擁有自信的人，不管出現什麼情況，都能夠排除一切萬難，他們的氣場告訴周圍的人：「沒有什麼不可能的事」。一個自信的人，是永遠不會感到害怕的！


    恐懼是一種膽小怕事的心態，它就像個左右人心智的魔鬼，讓人做事畏首畏尾，在人前顯示出一副無能的樣子。這種人沒有自信，他們的情緒常常是消極的，就算有機會擺在面前，也會拱手讓人。這可能是因為他們過去遭受過失意和打擊，對自己和前途缺乏自信，不敢為自己的未來付出行動，總是在考慮行動的結果，消極地面對眼前的事實，終日處在憂慮之中。


    FBI 探員卡恩曾經當過一次「心理治療師」。當時一位很有名氣的跳高選手，在獲得一系列的成績後，開始陷入了低潮。他只要一接觸跳杆就會喪失自信，開始認為自己不行，失敗的念頭立即湧上心頭，使他沒有勇氣去跳。


    當時他的教練認為：這一定是競爭對手在暗地裡搞鬼，所以找來了朋友——FBI 探員卡恩，想讓卡恩查清楚這到底是怎麼回事。


    透過幾次觀察，卡恩很快發現了問題的癥結所在：這個跳高選手一路走來都是順順利利的，沒有經歷過挫折，所以沒有足夠的抗壓能力，就像溫室的花朵一樣，沒經歷過風雨，所以一點的風吹雨打就會枯萎凋謝。


    針對這種情況，卡恩對他的教練說：「你的隊員發揮不好，完全是自己的原因。不過，我可以用訓練探員的方式，來幫助他走出低潮。」教練答應了卡恩的要求。


    從那以後，卡恩開始對症下藥，鍛煉他的抗壓能力。他告訴那個跳高選手；下一次去跳高的時候一定要面帶微笑，要自信，要藐視欄杆，當它是遊戲，跳不過就重新再來。


    那位選手狠狠地點了點頭，他照著卡恩教他的方法，帶著自信的微笑助跑，起跳，縱身一躍，他成功了，他跳出了心理的障礙！此後幾年，他不僅重新站上了領獎臺，而且超越了過去兩年的最佳紀錄。他的體壇之路越走越成功。


    在一次採訪中，他還提到過這件事。他對記者說，他之所以有今天的成就，有一個人功不可沒，那就是他的卡恩「老師」。是卡恩教會了他面對挫折要微笑，要樂觀，要對自己說我可以。


    事實上，這個世界上並沒有那麼多值得擔憂的事情。就算你對一件事情產生了憂慮時，你也不該總是去想最壞的結果，因為憂慮的事情可能會出現，也可能不會出現，只有這兩種可能。當它發生了，那
    investment 積極地解決，想得再多也無濟於事；想太多反倒是給自己上了枷鎖，久而久之，就會影響你的心態，讓你對一切事物都憂心忡忡。若是真的養成了這樣的習慣，你就只能白白地消耗時間和精力，整個人也會沉浸在一片憂鬱之中。


    恐懼多數情況下都是心理作用。不過，它會抹殺你的潛能，削弱你的自信。相信在你感到恐懼，並將這種恐懼的感受告訴他人的時候，你的親人朋友一定會對你說：「哦，不要怕，那都是你的幻想，沒有什麼可怕的！」這種安慰可能會暫時消除你的恐懼，但它卻沒有持久的「藥效」，因為你的心態沒有轉變，你沒有建立信心消除恐懼。


    自信的心態是看不見的法寶，能夠發出驚人的力量，讓你克服恐懼，排除萬難。如果你用積極的心態發揮自己的思想，並相信成功是你的權力，你的信心就會使你成就你所制定的目標。如果你因為恐懼而消極了，滿腦子都是恐懼和失敗，那麼你的結果也就是這些了。


    所以，你不要再擔憂害怕了，給自己一點信心和鼓勵，打敗你內心的那個魔鬼。告訴自己：「我是幸運的，我是順利的，我註定是不平庸的，沒有什麼可以擊倒我。」


    當一個人的心態積極，是充滿自信的，他就萌生了巨大的勇氣，會用積極的行為去改變自己的處境。


    生活中難免會遇到有挑戰性的事物，或是一些棘手的問題。如果我們被嚇倒了，在氣勢上短了一截，認定了自己挨不過，那 hu 就只有「認命」的分了。一個人若是消極處世，氣勢就會慢慢消失，最終淪為一個不起眼的平庸之輩，過著淡然無味的生活。


    事實上，很多看似強大的、不可戰勝的東西，並不如我們想得那麼可怕，如果因此而消極，就會失去許多成功的機會。有時候，它們的強大只是源於我們內心的弱小。


    電影《哈佛的天空》( Homeless to Harvard: The Liz Murray Story, 2003 ) 講述了一個令人發奮的故事：


    生長在紐約的女孩莉姿，沒有良好的家庭環境，父母吸毒，周圍的人也都是得過且過，彷彿環境註定了他們未來的人生路。她小小年紀經歷了人生的艱辛和辛酸，但卻沒有絲毫抱怨，也沒有就此沉淪。她始終相信，憑藉自己的信念和努力可以改變現在的一切。


    最終，這個貧苦的女孩用樂觀的心態和頑強的毅力改寫了自己的人生，夢寐以求的哈佛大學向她敞開了雙臂。她用自己親身的經歷告訴世人：人生其實可以改變。


    我們從來不會被生活打敗，我們只會被自己打敗，敗在自己的心態上。有些事情，我們只有努力去嘗試，努力去做，才有可能變為現實。如果連試一下的勇氣都沒有，始終抱著「我不行」的態度，那又談什麼成功呢？


    別讓人一眼看穿你

    讀心與藏心的攻防智慧


    認識自己，接受自己


    每個人都是獨立的，一個人接納另一個人很難，但一個人接納自己更難。


    我們時常對自己不滿，為自己的缺點懊惱與煩悶，千方百計想掩飾。自己面對自己時，我們常常會陷入懼怕與悔恨中不能自拔。


    太多人之所以會對生活有那麼多的不滿，其實不是外界影響，而是因為對自己的境遇有太多的不滿。這種想法大部分人都有，但是從實踐的角度來講，對自己不滿又有什麼用呢？自己又不是別的物品，不喜歡了就可以隨時扔掉；也不和別人一樣，合得來便相處，合不來便分手，用不著去委曲求全。我們自己不可能把自己扔掉，也不可能自己與自己「絕交」。


    自我是一個不可能逃避的話題，無論你情願也好，不情願也罷，滿意時，它和你在一起。不滿意時它同樣不會離開你。生命的無奈也在於此。


    有的人很早就接受了自己，有的人至死都無法接受自己。


    儘管我們知道，相貌、性格和生命一樣，都是我們所不能自由選擇的，然而，對於自己的不滿意，卻時刻折磨著我們。


    醜陋使我們不敢大聲講話，不敢仰起頭走路，不敢面對他人的注視，在美麗的人面前，我們更本能地感到自卑。總希望有一天，魔鏡會突然出現，告訴你是天下第一美人。


    性情也是我們在不知不覺中形成的。雖然我們並不對自己的容貌與性情負完全的責任，但我們卻不得不每日面對它。蘇格拉底能夠認識自己，接受自己，才宣稱自己「自知無知」。我們雖不能像蘇格拉底那樣，自知自己無知，但接受自己是無知的，卻是可以做到。


    接受自己有多種方式，因為世界上有照臉的鏡子，但沒有照心的鏡子，也因為這都是自己的私事，別人可干涉不上。


    對自己的優點，我們自己不去挑明，而千方百計誘導別人說出，這其中的奧妙值得品味。自己說的，那叫自我吹噓，叫退能；別人說的，是「客觀」，是「實事求是」。聰明的人最善用這一招，還會讓對方說一句：「你真謙虛」。


    FBI 探員梵甘迪，年輕時由於其貌不揚，往往被別人輕視，他為此非常苦惱。


    等到梵甘迪參加 FBI 探員的選拔時，他心裡其實也很不安。雖然他自信能力出眾，但是 ULD 一想到自己的相貌可能會讓自己扣分，他就非常害怕。


    幾個月後，選拔結果出來了。梵甘迪如願以償，成為了一名探員。在他上班的第一天，他的教官告訴他：你之所以能夠擊敗眾多有實力的競爭者，就是因為你的相貌。


    對於自己的缺點，我們難以接受，更不願意被別人指出，尤其是當眾指出。上司每次作完報告都要說「歡迎批評指正」之類的話，可千萬不要當真！這意見不能「指」，更不能「正」，只能當作沒有，最好本來就沒有。不然，你肯定會免費獲得許多「指教」。


    比較聰明的一種是：人貴有自知之明。只有自己知道了，自己察覺出問題，神不知鬼不覺地改掉，這才是上上之策。


    接納自己需要勇氣，也需要毅力。接納自己，是一個漫長而艱苦的過程，也是一個人長大、成熟的過程。這當然是一個痛苦的經歷，因為我們會逐漸發現，自己不是那樣完美，也不可能變成理想的自己。接納自己的優點也接納自己的缺點，面對自己的優點需要勇氣，面對自己的缺點更需要坦誠，需要包容。


    只有當我們能夠容忍自己不足的時候，才能以正確的價值觀面對整個世界。在生活中，我們總會聽到很多感嘆命運不公的聲音。但事實上，生命中最大的不公平就是連自己也無法容忍自己。你想一想，一個人連自己都不能容忍，他還能再容忍什麼？因為不能容忍，所以生命就有了不公。


    正如貝多芬說的那樣，他要扼住命運的喉嚨。在我們看來，他之所以扼住了命運的喉嚨，首先就是因為他認同了自己的不足。古往今來，人類從茹毛飲血的遠古走到科技發達的今天，靠的就是主宰命運的雙手：靠這雙手打造工具，開始創造輝煌文明的未來；靠這雙手築屋修路，營造安穩和平的生存環境；靠這雙手，創造整個人類的璀璨文明！而對於我們自己，我們每一個人也能靠這雙手規劃生命的軌跡，成就未來的輝煌，主宰自己的命運。


    鍛煉意志，凡事將不足為懼


    我們為什麼會感到恐懼？有時候，之所以沒有信心與眼前的困難作鬥爭，是因為我們的意志力不夠頑強。


    每個人在前進的道路上，肯定都會遇到這樣或那樣的困難。有些人在挫折中不斷的錘煉著自己，愈挫愈勇；有些人則被眼前的困難搞得焦頭爛額、喪失鬥志，最終一事無成。作為一個藏心高手，首先必須是一個意志力頑強的人，因為只有這樣的人，才能做到藏心。


    「時間順流而下，生活逆水行舟。」在人的一生中，困難將始終與你相伴，無論多幸運的人都是如此。既然困難不可避免，那我們就該勇敢面對，敢於對命運說：「讓暴風雨來得更猛烈些吧！」


    生活中，每一個人會面臨壓力，沒有人可以倖免。不管我們是否願意，壓力都會每天陪伴著我們。如果想在這個充滿競爭的社會上獲得更高的成就，學會化壓力為動力就是一種必備的生存之道。


    只有善於化解壓力的人，才能向別人更好地展示自己的樂觀、不屈不撓的精神，以及面對問題時積極思考的頭腦。只有這樣的人，才會得到別人的重視和尊敬。


    這世界上能能力的人很多，但是最後能獲得成功的卻有限，這是因為，成功不僅僅需要能力，更需要意志。而成功路上的各種風雨坎坷，到最後都是對意志的考驗。誰的意志頑強，就能衝出風雨見彩虹；誰意志薄弱，就將倒在成功的最後一道大門之前。


    成功學大師卡內基認為，在世界上，沒有別的東西可以替代堅忍的意志：教育不能替代、父輩的遺產也不能替代、而命運更不能替代。秉性堅韌，是成大事、立大業者者的特徵。由此可見，「如何面對困難」，是成功者和失敗者之間的一道分水嶺。成功者能夠)邁過困難的阻擋，而失敗者卻總是在困難面前止步不前，最終一生流於平凡。


    在 FBI 的歷史上，有許多次重大任務的成敗就在一線之間。每當探員 B 遇到困難，情緒低落的時候，都會聽到這麼一句話：「堅持最後五分鐘。法國拿破崙那句名言『最後五分鐘』，我們千萬不能忘記。最後五分鐘是決定勝負的關鍵。」結果，探員們總能在最關鍵的時刻壓倒困難，壓倒自己心中的恐懼心，贏得勝利。


    高手對決的戰場，「最後五分鐘」是決定勝敗的關鍵；但就是這「最後五分鐘」，往往最難堅持。有這樣一句金言：「當你最嚴峻困難的時候，也是敵人最嚴峻困難的時候；常常是當你因困難而決心動搖的時候，也正是敵人對勝利已感到絕望的時候。這種時機是最緊要的關頭，這種時機決定於何方能堅持；何方能熬過這最後的五分鐘，何方就能取得勝利，因此我們要堅持最後五分鐘。」


    其實，做人和執行任務一樣，「千錘敲鑼，一錘定音」。在追求夢想的路上，也許你已經經歷過太多的苦難和不幸，但是你記著，千萬不要喪失動力，更不要感到恐懼，只要堅持到日出雲開，成功就是你的。


    那些能突破一次次困難，到達理想境地的人，最終都能獲得成功。但是要做到這一點談何容易！有人遇到了一次失敗，便把它朽作是「滑鐵盧」，從此便失去了勇氣，一蹶不振。可是在剛強堅毅者的眼裡，永遠沒有所謂的滑鐵盧。他們即使暫時陷入低谷，也不以一時失敗為最後的結局，他們還會投入下一場戰鬥中。所以他們能在每次失敗後馬上再重新站起，而且比以前更有決心、更有毅力的向前邁進，不達目的絕不甘休。


    一個人想擁有面對困難時百折不撓的精神，沒有一顆堅忍的心是萬萬不可能的。但凡有所成就的人，做每件事都會堅忍不抜，全力以赴。不管成功的機率多大，哪怕只有百分之一的把握，他們也會百分之百地努力。


    一個有著堅強意志力的人，便有創造的力量。不論做什麼事都要有堅強的意志，任何事情只有付出極大的努力才能獲得成功。擁有頑強意志力的人，在面對困難或突發事件時常表現得鎮定自若、異常冷靜，這樣才能發揮內在的潛能，找到解決問題的辦法。


    至於如何增強意志？只有在一次次經歷中培養和磨練。


    單純的口號，不僅不能體現出霸氣，反而會讓你如紙老虎一般，一碰就破。


    意志力的強大力量是難以想像的，它能克服一切困難，不論所經歷的時間有多長，付出的代價有多大，無堅不摧的意志力終能帶領人到達成功的目的。


    愛默生說過：「偉大高貴的人物最明顯的標誌，就是他堅定的意志，不管環境變化到何種地步，他的初衷與希望，仍然不會有絲毫的改變，而終至克服障礙，以達到所企望的目的。」


    意志力強的人，心中充滿了無限的可能性，他相信一切都是足以超越的——只要你認為「能」，就一定「能」！


    別讓人一眼看穿你

    讀心與藏心的攻防智慧


    STEP 9

    鎮定

    不慌張，穩住逃離反應


    太多時候，我們總顯得不太鎮定。慌亂無措的行為，想要逃離危險的心態，均是暴露我們內心的罪魁禍首。想要藏心，就必須讓自己變得鎮定一些。


    想要讓自己變得鎮定，變得更有城府，是一件不容易的事情，這需要耗費我們太多的精力，所以，我們需要有步驟、有計畫地改變自己。本章會給大家指出一條明路，讓大家知道：「我可以透過這樣的辦法，來讓自己變得更鎮靜。」


    ![](img/65c5e2383679681693f7479829cb5f93_225_0.png)


    ![](img/65c5e2383679681693f7479829cb5f93_225_1.png)


    逃跑—剉那


    本章中，我們要講一種和凍結反應一樣，擁有「悠久歷史」的人類本能 —— 逃離反應。


    所謂逃離反應，就是人在感受到厭惡或恐懼的時候，所產生的一種反應。造成這種反應的源頭是，那些對人構成威脅的刺激源足夠強大，人沒有改變局面的信心，所以會造成人的逃避心理。遠古時代，逃離就是簡單的跑，但是在現代社會中，逃離則多數比較隱晦。


    如果你出現了逃離反應，那麼別人就可以判斷出，你對眼前的東西產生了厭惡或是恐懼。和凍結反應一樣，這也是人與生俱來的一種自我保護措施。但是在現代社會中，值得人真正逃跑的事情越來越少了。可是我們的逃離反應依然發生著作用，更可怕的是，它隨時都有可能暴露我們的內心。


    某次，FBI 探員在機場巡查，他們的目標是找出一個潛逃中的連環殺手。FBI 探員知道，這個人很可能已經易容變裝，想要抓到他可不是那麼容易。所以他們擦亮了眼睛，四處尋找。


    可是找了將近半個小時之後，探員依舊一無所獲。


    這時候，從機場外面進來一個人，看起來和其他人並無區別，向著登機口走去。此時，一位機場保安人員從他身邊經過時，不小心撞了他一下。那個保安人員立刻向他道歉，他僅僅是點點頭，並未說話。


    這一切都被探員看在眼裡，他們注意到，在保安人員和他身體接觸那一剎那，他的腳立刻擺出了一前一後的姿勢，類似運動員在起跑線上所採用的起跑動作，這是最典型的逃離反應。探員立刻上前「請」他談一談，果不其然，此人正是
    FBI 要找的那個連環殺手。


    探員之所以判斷那個人有問題，是因為對於一般人而言，機場保安並不能對他們形成威脅，所以不會因為保安人員碰他一下就產生逃離反應。而這個人卻表現出了明顯的逃離反應，只能證明他心裡有鬼！


    採用這個案例只想說明一個問題，那就是逃離反應確實會暴露我們的內心。


    大家不要以為只有「心裡有鬼」，才可能產生逃離反應。事實上，對於我們每個人而言，即便我們的內心坦蕩，但是在受到某些刺激的時候，還是會產生逃離，進而暴露我們當時的心理狀態。


    在金庸小說《笑傲江湖》中，有這樣一個場景：令狐沖在知道師傅岳不羣是個偽君子之後，對他產生了極度的厭惡感。所以當岳不羣過來想拍一下令狐沖的肩膀時，令狐沖自然而然地閃避了一下。而岳不羣則哼了一聲，走開了。這就是典型的逃離反應出賣一個人真實想法的案例。


    在現實生活中也是這樣，當我們內心對一個人非常厭惡或是害怕的時候，這個人若是試圖接近自己，我們也可能會產生逃離反應。由於逃離反應很容易被人看穿，進而讓人意識到：這人是討厭（害怕）我，所以逃離反應經常會暴露我們的內心想法。所以，要藏心，必先控制自己的逃離反應。


    事實上，我們的父母很早就在幫助我們克服自己的逃離反應。由於每個人天生對陌生人都有 Anton 的恐懼感，所以小時候，

