    ![](img/65c5e2383679681693f7479829cb5f93_10_0.png)


    諜本身其實就是隱藏自己內心的手段之一，雖然我們並不準備將這種手段歸納到這本書中，但是我們要知道一件事：所謂藏心，就是盡量拋棄自己條件反射式的「動物性」，轉而去開發人的智慧思維。


    也許有人會說，既然人的行為是由大腦控制的，而大腦結構又是天生的，所以我天生就心直口快，永遠別想學會隱藏自己的內心了。這種說法是錯誤的！科學家發現，那些善於隱藏自己的人，大腦前額皮層擁有更豐富的白質。白質是一種白色的神經組織，當一個人在運用理智隱藏自己內心想法的時候，這些組織非常活躍。


    美國心理學家說：「那些善於隱藏自己的人，由於經常進行推敲和算計，所以他們的大腦結構發生了變化，與常人不同。」由此可見，我們確實可以透過訓練來加強自己的「藏心」能力。


    # 刺激下的身體反應


    不管怎麼說，大腦的反應都不會被其他人看見，真正出賣我們的是在大腦刺激下的身體反應。所以本篇我們將著重談談在我們想掩飾自己內心的時候，身體會有什麼具體的反應。


    當我們產生掩飾心理時，我們的表情會在身體的刺激之下，發生一系列的變化。比如：臉紅，或是臉色蒼白慘澹，這都是不善掩飾的人在試圖騙過別人時所產生的生理反應。


    一個人若是處在試圖掩飾自己真實感情的狀態中，那麼他所表現出來的情感必然是虛假的。有很多人能將這種虛假的情感表現得惟妙惟肖，可是對於大部分人來講，無法將虛假的感情表現得更真實一些。這是因為，他們往往過於注重肢體語言的「表演」，忽視了臉部表情的「刻畫」。


    FBI 審訊室裡帶進來三個嫌犯。


    三個人都顯得非常不安，這時，FBI 探員嚴肅地說：「害怕了嗎？看著我。」


    三個人都抬起了頭。


    「你們三人中，只有一箇是真正的罪犯。現在，我們已經掌握了足夠的證據來找出這個人，因為犯罪現場留下了犯人的血液。根據血液分析，我們得知犯人患有嚴重的傳染病。如果不想耽誤自己的病情，請自己馬上站出來。」


    其實，這三人並非都是嫌犯，坐在中間的那個是 FBI 的臥底。臥底的手上還故意留了一些血跡，當他的同事說完那番話之後，他故意讓其他兩人看見了自己手上的血跡。


    果然，在看到這些血跡之後，其他兩名嫌犯都做出了躲避的動作。有一個人眼中流露出了恐懼的神色。另外一人雖然同樣在躲閃，但是第一時間的臉部表情卻顯得鎮靜得多，隨後，他才極力裝出害怕的樣子，且吃驚的表情在他的臉上停留了很長時間。


    結果，FBI 將第二名嫌犯帶走單獨審問。果不其然，他就是犯人。


    FBI 之所以能夠確定第二名嫌犯是真正的兇手，就是因為他的表情出賣了他。如果他不是真凶，那麼當得知自己身邊坐的是個傳染病患時，一定會感到驚恐。可是真正的兇手卻不會感到恐懼，因為他知道——那個有傳染病的人正是自己。


    當他意識到這是一個圈套，又極力想要表現出恐懼的樣子時，他這樣做簡直是弄巧成拙，因為真正吃驚的表情是轉瞬即逝的，任何超過一秒鐘的驚訝表情，都可以被視作是偽裝！所以，FBI
    探員可以確定他心裡有鬼！


    這個案例告訴我們一件事情，那些想要掩飾自己的人，往往不能在第一時間做出「正確」的表情。而那些真正的偽裝高手，則往往能夠做到隨心所欲地控制自己的臉部表情。至於他們為什麼會有這種能力，我們將在以後的篇章中詳細說明，並且教會大家如何成為一個生活中的「影帝」。


    再者，讓我們回想一下自己是不是會有些習慣性的動作？比如抖腳、摸鼻子等等。如果你認為還僅僅是習慣性的動作，那就大錯特錯。因為這種看似漫不經心的小動作，也是大腦刺激的結果，即在刺激下的第二種身體反應——肢體動作。


    那麼，在希望掩飾自己的時候，大腦會給身體什麼刺激呢？美國芝加哥嗅覺與味覺治療暨研究基金會的科學家發現，當一個


    人想掩飾自己的情緒或是某種真相的時候，一種名為兒茶酚胺的化學物質就會被釋放出來，引起鼻腔內部的細胞腫脹，同時，血壓會上升。血壓增強導致鼻子膨脹，從而引發鼻腔的神經末梢傳送出刺癢的感覺，於是人們就會頻繁地用手摩擦鼻子以舒緩發癢的症狀。


    美國總統比爾．柯林頓曾陷入了「陸文斯基性醜聞事件」。當向陪審團陳述證詞時，參與調查的 FBI 探員就發現，柯林頓觸摸鼻子的總數達到二十六次之多，而這正是說謊的表現。結果證明，柯林頓確實說謊了。


    這就是說，你的每一個小動作，其實都不是「空穴來風」。在通常情況下，大腦不會指揮你的身體做一些無意義的事情。在你試圖掩飾自己的時候，大腦同樣刺激你的身體，讓你做出一些小動作。所以，你若想真正掩飾自己，就必須學會克制自己某些下意識的動作。


    一般情況下，人們想掩飾自己的時候，還有以下幾種情況：


    # 1. 假笑


    人在掩飾自己的時候，往往會假笑。在金庸小說《鹿鼎記》中，主人公韋小寶就深諳此道。在遇到危險不知如何應對時，往往會先哈哈大笑一番，讓人搞不清楚他為何發笑，從而被他唬弄過去。若碰到一個真正行家，恐怕韋小寶這一招就靠不住了。


    事實上，大部分人在掩飾自己的時候，都會像韋小寶一樣，有假笑的傾向，雖然並不像韋小寶那麼誇張，但即便是一閃而過的一個假笑，也會成為破綻。


    # 2. 語言異常


    由於擔心自己的掩飾心理被人看穿，所以大部分想要掩飾自己的人，常常會轉移話題。有的人還會突然提高音調，或加快說話速度。


    # 3. 口乾


    想要掩飾自己的人，常常會不停吞口水及舔嘴唇。


    這三種反應，都是大腦刺激身體的結果。在本篇，我們講述想掩飾自己情緒時，大腦刺激身體所做出的反應，目的就是想讓大家明白，你如果想真正藏心，僅僅靠邏輯嚴密、合情合理的話語，是遠遠不夠的，你還需要注意自己的表情和動作。只有這樣，才能算是真正的藏心高手。至於在具體實踐中如何做到這一點，希望大家能耐心地讀下去，我們會告訴你最後的解答。


    # 常見的肢體破綻


    擔任美國 FBI 探員長達三十年的喬·納瓦羅（Joe Navarro, 1953 -）在 2006 年出版了一本暢銷書《FBI 教你牌桌讀心術：從行為細節看穿對手的真假虛實》（Phil
    Hellmuth Presents Read ''em And Reap: A Career FBI Agent''s Guide to Decoding
    Poker Tells, 2006）。這本書可不僅僅是一本「賭博指南」，更是一本「識人」的寶典。這本書介紹了許多人在掩飾自己時產生的破綻，受到了讀者的追捧。正因為有人在試圖學習「閱人術」，而希望掩飾自己的我們，才有必要學習「藏心」。


    喬·納瓦羅在書中提到：當人在緊張或是有壓力時，會有一些情不自禁的小動作；還有，深呼吸或是話突然變多，或是把手放在大腿上往返摩擦，都是因為感到緊張，所以才會透過這些動作試圖平緩自己的情感。


    喬·納瓦羅認為，FBI 探員大都是從肢體語言上看出對方個性，這也是他們的一種祕密武器。


    由此可見，普通人在掩飾自己的時候，往往會出現破綻。這其實是個很有意思的話題，我們如果深入探討，會獲得許多原來沒有注意過的「小知識」。現在，我們有系統地介紹一些常見的肢體破綻：


    # 1. 真正吃驚的表情只會在臉上停留不到一秒鐘


    如果一個人顯得格外吃驚，表現在臉上定格超過一秒鐘，那麼就可以斷定這個人是假裝的。反過來，我們從藏心的角度去看的話，就可以得出這樣的結論：如果企圖用一種情緒去掩飾另一個情緒，那麼你切忌，不要把你虛假的情緒保持得太久，那樣


    反而會讓人識破你的內心。


    # 2. 手放在眉骨附近，意味著此人內心非常羞愧


    所以，當我們因某事心生愧意，但是又不想被別人發覺時，請克制住自己伸向眉骨的手。


    # 3. 談話時眼球向左下方看去，是大腦正在回憶的表現


    如果想要讓自己的敘述顯得真實，不妨做出這個動作。


    # 4. 明知故問時，眉毛會微微上揚


    我們用一個虛擬的場景來闡述如何掩飾這種破綻：你的朋友新買了一個昂貴的戒指，你也許知道這個戒指的價格，但是為了配合朋友希望炫耀的心情，你還是會明知故問：「這個戒指看起來真不錯，多少錢？」在這個時候，你千萬要控制住你的眉毛，否則朋友會識破你的明知故問。


    我們講的這個例子也許是生活中的一件小事情，即使被識破了也無關緊要。但是在 FBI 辦案的過程中，確實存在沒控制住眉毛而釀成大禍的案例。


    1996 年，FBI 探員詹姆斯奉命去調查一件爆炸案。當時他前往犯罪嫌疑人的住處，試圖搞清楚他的家人是否知情爆炸案的內幕。


    當他敲開門，向犯罪嫌疑人的家屬出示證件之後，家屬問道：「FBI 探員來找我們幹嘛？我們可都是合法公民。」


    詹姆斯發現，家屬在說這番話的時候，眉毛微微上揚了一下。他立刻判斷出：這家人知道我的來意，所以他們也一定知道自己的兒子到底幹了什麼。


    因此，他決定以家屬為突破點，向他們詢問犯罪嫌疑人的下落。果然，在探員的百般說服下，家屬最終供出了犯罪嫌疑人的藏身之地。


    在這個案例中，FBI探員根據對方的眉毛找到了事情的真相，當然值得慶賀。但是對於我們想要隱藏自己，並不是因為有什麼不可告人的勾當，有時候只不過是人際交往中一種善意的掩飾，所以我們還是應該學會控制自己的表情。


    # 5. 習慣性動作中的破綻


    當你與朋友一起談天說地的時候，你也許會做出一些習慣性的小動作。現在告訴你，這些習慣性的小動作已暴露了你心中的情緒。


    首先，有人可能喜歡手搭著嘴巴或是鼻子，這表明你是一個很有主見的人。在說話時，你手搭著嘴，暗示你對對方的說法不是很認可，但是又不好意思表達出來。所以，在和別人說話的時候，你最好不要把手放到嘴上，那樣很可能讓對方看出：這個人心中存在著相反的意見。


    有些人在人際交往中喜歡不停地撫摸下巴或托著下巴，這表明他是一個很喜歡思考的人。這種人還有另外一個特點：喜歡計算別人，經常鑽牛角尖。所以，這個動作同樣會暴露一些對你不利的東西，應該加以克制。


    還有一種人喜歡在跟人說話的時候玩弄頭髮。這種人顯得比較溫和，一副柔弱的模樣，但其實他的內心深處剛強，有自己不易動搖的原則。所以你如果不想讓別人看穿你的原則，就不要輕易撫摸自己的頭髮。


    那些與他人說話喜歡東張西望的人，則是明顯的不耐煩表

    現。而且，這也說明你是一個比較懶散的人，做什麼事都提不起來。因此，在面試的時候，不管什麼原因，你千萬不能表現出這種狀態，畢竟沒有一個公司喜歡懶散的人。


    # 6. 總在你不注意時偷看你一眼


    有些人喜歡在別人注意的時候偷偷看人家一眼，這是性慾過剩的表現。


    以上，都是人際交往時經常會出現的一些肢體破綻。善於藏心的你，一定要注意不能讓自己的破綻被他人識破！


    # 話語中的破綻


    FBI 探員在審問的時候，會用一個小小的伎倆：他們先問一個個人問題，然後等他們回答。然後問第二次，這時那個要掩飾自己的人，肯定還牢牢記得自己當初所說的虛假答案。當第二次問話之後，他們不會在短時間內再次詢問相同的問題。在這期間，嫌疑人的身體會平靜下來，他們會想：「我已經蒙混過關了。」


    由於人在掩飾自己的時候，所說的話並沒有多少事實基礎，所以在放鬆下來之後，很快就會忘記。因此第三次提問時，嫌疑人往往會驚慌失措，不能將之前編造的那個謊言再原原本本地複述。


    雖然絕大部分人都不會被審問，但是在生活中，我們似乎都遇到過這樣的事：當初為了掩飾自己而說出的某些話，隔幾天之後，當人們再細問起來，自己第二次的回答卻和之前的話相差甚遠。這就會讓人懷疑你的人格，即使當初你說謊的目的是善意的。所以，我們若想藏心，第一件事情就是盡量不要忘記自己說過的每一句話。


    有些話，除了字面意思之外，還有另一層深層的含義。話語的字面意思是我們所能控制的，而深層的含義，則要受到語氣、說話方式的影響，所以有時候會暴露出不同於我們所想表達的含義。


    比如，我們也許經常說一句話：「讓我想一想。」在朋友請求我們幫忙的時候，也許僅僅是因為我們沒有絕對的把握，所以說「讓我想一想」。但是你是否知道，你的朋友會因為這句話認為你是在拒絕他。

