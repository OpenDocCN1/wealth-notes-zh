    \n你会发现，很多成功人士很早就使用复盘记忆的方法，比如说亿万富翁杰瑞米·霍夫曼每天在睡觉前，都会对这一天进行盘点，让自己从中吸收经验和教训。\n\n视觉化预演也能起到同样的作用。视觉化预演就是指，自己对未来要做的事情在脑海里进行视觉化想象，越细致越好，既要想象自己完美实现目标的样子，也要想象会遇到哪些问题、该如何解决。\n\
    \n霍诺德在准备最有挑战的路线时，会事先预演每一个动作，想象自己完美地执行这些动作的样子。当然他也会想象失误的可能性、再对此构思出最佳的应对办法。\n\n\
    孟菲尔对此分析说，你看霍诺德，他一个动作接一个动作地分解，不断强化自己的运动记忆，这增加了他对自己能力的信心，而这种信心又能减少焦虑。\n\n综合这两种方法，复盘记忆和视觉化预演，可以帮助我们克服生活中各方面的恐惧。比如说，很多人害怕公开演讲，每一次演讲开始之前，都进行视觉化预演，在大脑中想象自己侃侃而谈的样子，这样不仅能大幅降低我们的焦虑，还能提高我们的表现。而在每一次演讲结束之后，再对自己的表现进行复盘，拎出其中的经验和教训，作为下一次演讲的准备。\n\
    \n这个方法，也被杰里米·唐诺文多次提到，唐诺文举办三层TED演讲者大会，畅销书《TED演讲的秘密》就是他写的。他在这本书中，讲到如何克服焦虑和恐惧的部分，使用的就是这个方法。\n\
    \n# **总结**\n\n总结一下今天的内容，高刺激追求者，他们的大脑确实和我们有不同，他们控制恐惧的杏仁核，和产生愉悦多巴胺的伏隔核，相关阈值都会更高。但我们仍然能从这些艺高人胆大的高手身上，学到他们克服恐惧的方法。比如说通过霍诺德的复盘记忆和视觉化预演两套心法，将每一次令我们震撼的恐惧体验，都变成一次增长经验的机会，打造出来你自己的精神盔甲。\n\
    \n其实，经历的越多，能让你恐惧的事儿就越少，你就越能处变不惊。正如金句所说：“你可能不是一个高刺激追求者，也不能控制自己的杏仁核，但一次又一次地直面恐惧，我们每个人都能激发出那些潜藏的勇气。”\n\
    \n好，今天留给思考的问题是，你有没有通过复盘记忆、或者视觉化预演的方法克服恐惧的经历？如果有的话，欢迎你留言与我分享，也欢迎你按今天的内容转发到朋友圈。\n\
    \n# **划重点**\n\n+   **今日得到：**\n1. 极限运动爱好者都是一些“高刺激追求者”，事实上，他们确实比一般人天生意大，同时他们的兴奋点也比常人更高，普通的刺激，根本激不起他们的兴趣。\n\
    2. 再大胆的人，也有害怕的时候。只不过，他们更善于把恐惧的记忆，转化为有用的经验与教训。\n3. 通过细节充分的“视觉化预演”，能让你消除紧张，拿出更好的表现；而事后的“记忆复盘”，能让自己掌控感越来越强，你也会越来越勇敢。\n\
