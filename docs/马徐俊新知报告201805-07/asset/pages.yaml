    # 今日报告：百思买如何成功阻击亚马逊?


    传统零售想要和亚马逊竞争，就得做亚马逊做不到的事。


    ——百思买CEO休伯特·乔利


    新CEO休伯特·乔利上任后，百思买对亚马逊开展反绝杀反击，实现了传统零售业的逆袭。乔利究竟是怎么做到的？


    今天的长文分为两个部分：


    百思买如何正面迎战亚马逊？


    百思买如何把握消费者的心理和时间？


    我们都知道，传统零售业在电商的猛烈冲击下，倒闭的倒闭，转行的转行，很有少有出路，这是全球的大趋势。就在最近，全球最大的玩具零售商 toys ''r'' us
    也宣布破产了。但今天，要为大家讲一个“逆袭”的特例，那就是美国传统零售商百思买。它不但顶住了亚马逊的冲击，销售额和股价连续六个季度保持上升，还打出了自己的差异化战略护城河。最新一期《彭博商业周刊》发表了长文，标题就叫《百思买的逆袭》（Best
    Buy Is Back），文章把百思买的业绩逆转，都归功于它的新掌门人休伯特·乔利（Hubert Joly）推出的三大策略。


    休伯特·乔利认为，传统零售要想和亚马逊竞争，就得做亚马逊做不到的事，这句话也堪称今天的金句。


    > If traditional retailers want to compete with Amazon, they must do things which
    Amazon can''t do.


    # 百思买如何正面迎战亚马逊?


    其实百思买能够成功阻击亚马逊说，首先是因为它现任掌门人乔利做了两件事：第一，解决了亚马逊的展示厅效应；第二，对实体店进行电商化运营。


    咱们中国人对百思买不太熟悉，它曾是 全球最大的消费电子和家电产品的零售商服务公司，早年用电信数码五环皇冠圈住 了中国，后来还在上海的家汇开办了第一家实体店，原来成都也有实体店一家百思买，但它在中国的整体发展不长，跟不上中国零售发展的速度，几年前就退出了中国了。


    不仅如此，它在美国本土发展也不好，一直濒临倒闭。它的衰落，有很重要的一个转折点，就是 2010 年亚马逊宣布了对格蓝宝应用，这件事，对消费者来说是很福音，对百思买来说却是灾难的开始。同样的产品，亚马逊上不仅更便宜，送货速度更快，消费者还有什么理由再去百思买呢？


    亚马逊给百思买带来的，是致命的冲击。2012 年，濒临百思买的市值，一个季度就损失了 7.72 亿美元，它的多项上亿美元级别的收购，都以惨败告终结束。当时的
    CEO 布丽基·邓恩（Brian Dunleavy）不仅管理混乱，和公开交易关系破裂得不清不楚。已经没有人记得，1995 年亚马逊刚创立的时候，百思买就已经是
    10 亿美元级的巨头了，真是长江后浪，推前浪。彭博商业周刊，2012 年就写一篇文章叫《百思买之战》，副标题就是《这个创始人（都管不了它），基本上，当时所有人都认为百思买定完了。


    在生死攸关的时刻，百思买却做了一个好选择，救了自己。他们自己换了一个新 CEO——休伯特·乔利（Hubert Joly）。休伯特·乔利是在百思买成立 52
    年后，首台来自美国以外的 CEO，他法国长大，在麦肯锡接受过培训，还曾任职于法国的 E 型 赌 牌 集 团 唯 胜 迪 娃（Vivendi SA），风 景
    美 求 的 世 界（World of Warcraft）就这么个集团开发的，根据《商业内幕》（Business Insider）的，把这个游戏推广出去的人，就是乔利。


    乔利执掌百思买后，就做了咱们在开头说的那两件事，为伐狼狗，成功地从亚马逊手里抢回了消费者。


    第一件事儿是解决了百思买的展厅困境。所谓的展厅困境，说白了就是光看不要。顾客在他的实体店里面体验商品，然面再去亚马逊上下单，这真是好理解，如果东西都是一样的价格，他线上肯定价格差太多，顾客肯定是哪儿便宜去那买。乔利在头六个月后，就禁止百思买的销售和价格一律与亚马逊和其它多家电商平台保持，你一分钱也不多给，我一分钱也不多给。这个决定当然以牺牲百思买的利润为代价，但也就大抵挽回了电商的价格优势，亚马逊也丢掉了顾客。


    第二件事是对百思买的实体店进行电商化运营。乔利的宗旨是——亚马逊有的，百思买都有，亚马逊没的，百思买也要有，摆明了要对亚马逊开进攻模式。'
