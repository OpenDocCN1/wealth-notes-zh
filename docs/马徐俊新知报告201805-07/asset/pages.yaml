    # 总结


    总结一下今天的内容，从西方媒体的视角来看，中国互联网巨头的影响力，已经不再限于国内，开始向全球迅速蔓延。阿里和腾讯已经远远走在了前头，如果西方欧美再不迎头赶上，真的是要落伍了。


    拉辛斯基说，在2000年左右，科技观察者是以谷歌的业务，来分析科技发展趋趋势的；2010年之后，他们看趋势的依据是苹果公司；而今天，正如金句所说，腾讯和阿里商业路径、投资方向和影响力已经是世界级的了，理解这一点，对于理解全球商业的未来发展至关重要。


    好，今天留给你思考的问题是，你认为，腾讯和阿里会引领西方的商业模式么？欢迎你留下自己的答案和我交流，也欢迎你你今天的内容转发给自己的朋友们。


    # 划重点


    +   今日得到：

    1. 西方民众包括企业高管，对于中国互联网巨头的迅速发展知之甚少，在《财官》等西方主流媒体看来，这是一个危险的信号。

    2. 微信的“红包”功能，被西方媒体视作具有本土科技创新意义的划时代产物。

    3. 拉辛斯基认为，腾讯和阿里就是当初的硅谷，它们是未来全球商业发展的关键。

    4. 以阿里为代表的“新零售”是西方媒体关注的重点，它反映了中国互联网巨头大规模跨部门协作、重构传统行业各个环节的能力。


