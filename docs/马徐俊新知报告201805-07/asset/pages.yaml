    \n# 如何通过突破极限来改善现实生活？\n\n以上实验和结论都证明，人体极限没有一个固定的界限，而且它是可以被大脑控制的。那么在现实中，我们可以怎样利用大脑和精神因素，来更好地利用人体极限改善我们的工作和生活呢？\n\
    \n研究显示，对个人的投入程度保持不可动摇的自信，人能有效地帮助运动员完成比赛。而这种自信除了来源于自身的信念外，还可以来源于外部的评价和鼓励。\n\n也就是说，如果从外部得到很多激励的话，一个人的耐力会得到提升。比如说，你告诉跑步的人，他们看上去跑得很轻松，就可以让跑者在保持同样步伐的情况下，消耗更少的体能。\n\
