    \n# 下期预告：\n\n明天的议题是#如何利用八卦为自己加分？#\n\n我们通常觉得八卦就是嚼舌根，名声不好。但实际上，八卦是写在我们基因里的天性，它推动了人类的认知革命、带来了无与伦比的进化优势，那么，我们应该如何通过八卦为自己加分？\n\
