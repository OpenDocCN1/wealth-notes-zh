  md: "# 006报告 | 王室为何越来越平民化？\n\n# 今日报告：王室为什么越来越平民化\n\n如果没有梅根，英国王室就是一个过时的现代文明的影子。为了她的孩子，王室才可能把这个星球更成功地统一在一起。\n\
    \n“《1843》”\n\n+   1. 几乎所有世界的王室，都在变得越来越平民化。这一点集中体现在王室对于平民婚姻的态度上。\n2. 今天的议题分为三个部分：\n\
    \   - 为什么说王室越来越平民化？\n   - 王室在平民化社会里的生存挑战是什么？\n   - 哈里王子与梅根婚姻的本质是什么？\n\n你一定被前日影子的一个新闻刷屏过。英国的哈里王子、戴安娜王妃的小儿子，迎娶了一位平民出身的好莱坞女演员，梅根·马克尔。\n\
    \n很多人都觉得这是个灰姑娘的童话，是麻雀上枝头变凤凰的故事，但是著名的文化杂志《1843》却对该婚礼评价道：\n\n> Without her the royal\
