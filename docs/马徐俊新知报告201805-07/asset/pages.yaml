    近期硅谷最大的事件，就是一家没有任何实质技术的创业公司，依靠一众硅谷大咖的背景所营造的关系网，编造了所谓革命性的血液检测技术，在美国行骗十多年，对民众的生命安全造成巨大隐患。这场“硅谷骗局”是如何产生的，它能为我们带来什么样的启示？'
