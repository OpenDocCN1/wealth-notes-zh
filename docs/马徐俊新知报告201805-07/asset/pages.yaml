    # 今日报告：经济学家需要更有情味吗？


    我喜欢经济、金融和跟钱有关的话，因为它们不怕伤。


    > ——《纽约客》


    +   - 马鲁说


    试图用数字解释一切的思维方式，令经济学家饱受批评。但对他而言，保持“冷酷无情”可能是一件很重要的事。


    今天的议题分为两个部分：


    +   - 为什么说经济学家显得不近人情？

    - “冷血”对经济学家意味着什么？


    经济学家常被人为的一面，就是术语太密、不好说话，什么量化宽松、市盈率。就算普通人听来晕头转向。还有，相对于鲜活的生命，他们似乎更关心数字和模型，所以也常被人们扣上“冷血”的帽子。


    那么，经济学家到底需不需要更有情味呢？最近《纽约客》杂志刊登了一篇文章，《经济学家 和人文主义者能做好朋友吗？》（Can Economists and Humanists
    Ever Be Friends?）就探讨了这个问题。作者也是约翰·兰卡斯特的他，既是一位经济人，也是《伦敦书评》的编辑，从1995年开始给《纽约客》杂志撰稿，同时，兰卡斯特的非一般经济学研究者，所以对数字和文字都不是很精通，也形成了自己独特的视角和观点。


    兰卡斯特的这篇文章其实是一篇书评，在穿插讲解了好几点经济学知识之后，兰克斯特给出了的观点——尽管被数字打交道的人，既会因有人情味，但你们这么做，是有点原因的，也是有伤处的。这句原文是，one
    of the things I liked about economics, finances, and the language of money was
    their lack of hypocrisy.（我喜欢的关于经济、金融及金钱语言的一点，是它们不容假。这翻译过来就是：“我喜欢经济、金融以及跟钱有关的话，因为它们不怕伤。”今天的这篇文章大家，也被pqlq网站推荐了，兰卡斯特就看看，兰卡斯特为什么会这么说。


    # I 为什么说经济学家不近人情？


    古希腊有一则寓言，“狐狸多机巧，刺猬一招”，意即狐狸知道很多事，但是刺猬知道最重要的事：狐狸代表着思得多、分散的人，而刺猬代表着思得多、聚焦的人。这个词被经济引到的很多学者都听过，兰卡斯特经常给读者也引多知道一件大事的刺猬，而把人文学者，比如小说家、社会学家，比作知道很多事的狐狸。


    经济学家常被批评的一大原因，就是他们喜欢数字说话，试图用模型解释一切，但是他们的研究往脱离现实，所以他们经常被研究往脱离现实的段子很多，兰卡斯特的文章里就说了这么一件事：


    盘尾丝虫病是一种寄生虫病，通过水源感染、导致疾病人失生。非洲撒哈拉沙漠地区，有数百几万这样的受病者。1974年，七个捐助国建立联手行动，在世界卫生组织的框架下建立起一个“盘尾丝虫病控制计划”的项目，这个项目极其成功，帮助大批穷人避免了失明的危险。'
