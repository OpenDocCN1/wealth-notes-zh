  md: '美国政党化政治最明显的两个后果，一个体现在国家层面上，另一个体现在社会风气上。


    美国建国之初，国父们认为，政治派别上的分歧越大，国家就越容易走向衰落。他们参考的对象，是历史上的经典案例、比如雅典、罗马帝国、佛罗伦萨等等，它们的衰落，都是因为内部不同派别之间严重的政治分歧。所以美国国父们认为，要想尽一切办法解决好派别分歧。


    比如美国的第四任总统，詹姆斯·麦迪逊就认为，既然分歧无法避免、派别注定产生，那么弱化派别争端的最好办法，就是创造尽量多的派别，让谁都无法做大，他的原话是：“the
    more factions there are, the less likely that any one of them can attain dominance”。


    这条原则一直执行得很好，它的表现形式其实咱们也不陌生，比如美国有大量的宗教信仰分歧、种族问题、性别冲突、阶级矛盾，看着很乱，但其实这恰恰为美国保持了某种政治上的均衡，确保没有特别尖锐的矛盾产生。这种平衡，直到20世纪后期，才被打破。


    被打破的后果就是，如今所有小派别的分歧，都合流为两种巨大的身份冲突：民主党共和党。两者的矛盾越来越深化，从国家层面上来说，这可能会导致美国步罗马帝国的后尘。


    而从社会风气上来说，政治两极化，意味着简单化和愚民政治，比如善恶、对错、好人坏人，这样简单粗暴的标签化的处理。


    政治的参与者更多地变成了表演者，大家只在意表达，不考虑后果，这让复杂的真实问题，变成了简单的站队问题，既无法达成两党之间的相互理解，也不能把政务向前推进。


    就像咱们今天的金句里说的，如今的美国人，正在把自己变成国家政治舞台上的演员，陶醉在自己脑海中臆想出来的正邪之争里，这可能导致整个国家分裂成两个彼此敌对的阵营。


    # 总结


    今天的报告中，我们通过《纽约客》的一篇分析文章，知道了如今美国政党两极分化的局面由来，其实本来就是为了解决民众参政热情不高的老问题，而演化出来的新问题，但带来的结果却是，美国渐渐走上了国父们建国时担忧过的政治道路。


    那怎么能解决这个问题，作者没说，也不是我们今天要讨论的重点。通过今天的内容，我们得到的启发是，这种因为试图解决一个问题，而带来一连串新问题的情况，其实并不罕见。作为普通，我们不解决什么国家大事，只是透过今天的内容，让我们了解美国政治生态的演化过程，了解了为什么美国政治现在变得这么两极化。


    听完今天的内容，想请你留言谈谈，你是否认同霍普金斯的观点呢？欢迎在留言里谈谈你的看法。


    推荐阅读：001报告丨美国总统的位子出了什么问题？


    # 划重点


    +   今日得到：

    1.  美国的政治实权曾经掌握在各个州手中，联邦政府一弱很紧张，民主党和共和党也一团和气。

    2.  为了解决美国选民参政热情不高的问题，美国政治科学协会提出的解决方案是：联邦要强大，两党要有区别。这个提议导致了后来的政党两极化。

    3.  普通民众对担任地方公职失去了兴趣，以及媒体的激烈竞争，推动了政党两极化的趋势。

    4.  政党两极化使美国社会风气变成了简单粗暴的站队，美国有步古罗马帝国后尘的危险。


