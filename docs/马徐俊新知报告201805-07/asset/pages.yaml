    \n# | 总结\n\n总结一下今天的内容，Model 3 的生产，是特斯拉和马斯克的第三次 all-in 时刻。设计和生产的周期太短，要求却极高，这是特斯拉经历“产能地狱”的根本原因，就像今天的金句说的，生产一款大众消费领域的电动车，某种程度上比造火箭难得多。但马斯克和特斯拉总算是挺过来了。\n\
