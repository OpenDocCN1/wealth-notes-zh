    # 今日报告：精子捐献的情感挑战


    我希望人们能够了解到，精子捐献并不仅仅是一次交易。

    ——一个家庭治疗师


    徐敏霞

    精子捐献技术帮助很多家庭实现了生儿育女的梦想，同时也带来了新的心理问题和 社会问题，给很多家庭带来情感困惑。

    今天的议题分为三个部分：


    +   * 精子捐献产生了怎样的情感问题？

    * 这些情感问题的成因是什么？

    * 如何解决精子捐献带来的情感问题？


    科技的进步，给人类社会带来的，不只是更好的，便捷的话活，还解决了许多难题，甚至无解的问题，比如辅助生殖技术帮助很多家庭解决了孩子的问题，让他们享受到 了天伦之乐，精子捐献的技术和市场，越来越成熟。我们之前专栏也说过，精子
    都可以网购了。

    但任何一项技术，在解决问题的同时，也会带来新的、无法预料的问题，最近一期《大西洋月刊》杂志的封面故事，讲的是精子捐献背后常被忽视的情感。辅助生殖技术作为一个相对新兴行业，并且正在快速发展的领域，在解决生育问题的同时，也产生了很多心理层面的问题，带来的社会和情感困扰，对于许多人来说都是没有预料的，这一点，估计谁都没想到。


    # I 精子捐献产生了怎样的情感问题？


    你可能会有好奇，有那么多人需要辅助生育技术吗？你还别说，有这个需求的人可能比你想象的多。

    随着社会压力的增加，环境污染的加剧，还有不良生活习性的蔓延，在发达国家，不孕不育率高达 15% - 20%。中国好一些，这个比率在 12.5% - 15%
    ，但相比20年前，还是增长了不少。如今平均约8对的孕前夫妇中，就有1对面临生育方面的困扰。除了不孕不育的家庭外，还有一些同处家庭单身母亲，也存在着无法生育但又希望拥有孩子的问题。因此，精子捐献，成为了解决这个问题的最快办法。


    目前，精子捐献有 两种实现方式：一是使用来自朋友、熟人或亲戚的精 子；二是来自精子库或生育诊所的 优质精子。经过半个世纪的积累，精子捐献已经成为最初的一个小众家庭，变成了成千上万家庭的选择，这种科技发展帮助很多
    无法生育家庭的家庭、当年出生的400万婴儿中，有约6万婴儿是借助精子捐献来到这个 世界的。

    但这技术也产生了 很多意想不到的问题，比如情感。我先给你讲一个真实的故事。


    有一对美国兄弟，弟弟发现自己无法生育，就请求哥哥捐精种子，起初哥哥一直 帮答应，但求来了很多年前，哥哥和嫂子觉得，他们应该鼓励弟弟组建一个更亲密和完整的家庭，所以决定捐精种子。通这种方式，弟弟成功地生下了一个女孩。

    可是，让哥哥难受的是，当他 和妻子去看望这个侄女的时候， 他 发现弟弟并不希望他们去看望侄儿，甚至惹怒他。 后来夫妻二人能像正常人那样生出的哥哥对 的夫妇，最后还拌（
    ）而出。从此两家 人的关系变得疏远起来。


    是什么会让这样的矛盾产生呢？专家的解释是：哥哥的拜访让弟弟感受到了威胁。在弟弟看来，哥哥就是来自自己的孩子的， 其实这个现象并不少见，在精子捐献案例中，这种心理现象比比皆是，在男性身上尤其常见。


    本来是成 人之美 的好事，怎么 反而带来了隔阂 和情感呢？


    # II 这些情感问题的成因是什么？


    精子捐献本来就是 助 人 的好事，可 行 生 出了 情感问题。这次人类 性 不可分 的 情 感 精 子 捐 献 这 件 事 缺 乏 社 会 关 注 有关，为什
    么这么说不 呢？


    洛杉矶的婚 姻 家庭治疗师厄内斯特 贝克特花了15年的 时间，专 门 研究 生育 挑战， 以及所谓的 异性伴侣。


    在他提供咨询服务的异性伴侣中，他发现男方尤其关注子女的“所有权”， 以及子女 与本人 有 血 缘 的 关 系 是 因 的 问 题 。他们 经 常纠结 于 与
    比 这 更 关 系 的 亲 子 还 是 自 己 的？这 种 心 理 的 争 斗 ， 对 他 们 来 说 是 一 场 艰难的 心 理 交 往。

    贝克特分析，出 现这 种 情况 的 原 因，可 能 受 异 性 伴 侣 在 怀 孕 期 ， 与 胎 儿 有 生 物 学 的 联 系 ， 而 男 方 没 有
    ， 所 以 当 怀 孕 受 孕 时，就 会 产 生 对 另 一 个 男 人 让 自 己 妻子怀孕 的 妒 忌 心 ，这 是 类 似 于 对 成 熟 的 原始
    性 反 应， 贝克特将 之 称 为 “原 始 的 妒 忌”。

    男性 在 精 子 捐 献 这 件 事 中 产 生 的 焦 虑，往 往 于 女 方 有 些 当 事 彼 时 后 都 自 我 承 认 自 己 存 在 这 样 的
    心 理 问 题。 正 因 为 这 样，在接 受 捐 献 的 过 程 中 ， 男 性 往 往 会 把 注 意 力 放 于 失 败 中 一 定 要 成 功 不
    上 孩 子” 的 结 果 上， 而 忽 视 记 了 这 件 事 的 情 感 牵 系 ， 那 就 建 立 一 个 更 加 健 全、 更 加 密 亲 的 家 庭，
    这 往 往 事 事 破 坏 他 们 与 妻 子、孩子 关 系 的 主 要 原 因。


    除了 原 始 的 妒 忌 之 外 ， 由 于 精 子 捐 献 技 术太 新 了 ， 对 于 精 子 捐 献 心 理 发 展 的 情 感 影 响 缺 乏 公
    开 讨 论 ， 一 直 未 受 关 注 。 近 年 来 比 如 名 人 的 公 共 作 品 ， 只 有 2010 年 由 Lisa Cholden 导 演
    的 电 影 《 孩 子 们 很 好》( The Kids Are All Right)， 以及 心理 师 Kimery Kluger 编 于 2012 年
    出 版 的 儿 童 读 物 《 那 个 豌 豆 被 一 粒 豌 豆 经 过 精 子 的 故 事》( The Pea That Was Me: A Sperm
    Donation Story ) .


    除了缺 少 社 会 必 要 的 关 注 ， 相 关 法 律 条 款 的 更 新 滞 后 ， 也 没 有 跟 上 精 子 捐 献 的 实 际 发 展 进 程
    。 根 据 治 国 大 学 法 学 院 助 教 Susan Crockin 的 统 计， 全 美 大 部 分 州 基 本 参 考 2000 年 颁 行 的
    《 统 一 亲 子 法》( Uniform Parentage Act)， 规 定 向 已婚 夫 妇 精 子 的 捐 献 方， 不 被 视 为 婴 儿 的
    父 亲 。 法 考 育 归 属 子 不 接 受 精 液 的 女 性 的 男 方。 2017 年 ， 同 性 婚 姻 在 美 国 全 法 化 后 ，法 案 取
    代 的 婚 姻 定 义， 规 定 无 论 何 男 ， 接受 捐 献 的 自 给 情 况， 婴 儿 的 合 法 父 母 。

    另 外， 目 前 美 国 也 没 有 主 组 织 机 关 担 证 子 捐 献 的 相 关 实 务 。 最 接 近 担 证 监 管 机 构 角 色 的， 是
    美 国 生 殖 医 学 会 ( American Society for Reproductive Medicine， 简 称 ASRM )。 ASRM 已
    经 推 行 了 一 系 列 针 对 医 师、生 物 专家 精 子 的 行 为 规 范， 并 对 一些问题 提 出 了 指 导 意 见， 如： 是 否 应 该
    接受 解 决 家 庭 的 子 是 否 允 许 如 何 证 实 的 为 于 这个 目的 ， ASRM 建 议 受 议 父 母 的 女 女 真 实 的 情 况；
    比 如 ： 需 要 让 子 女 了解 多 关 于 精 子 研 究 者 的 信 息， 对 于 年 轻 成 多 的 认 为， 如 果 子 女 要 求， 可 以
    提 供 不 具 名的 信 息。


    ASRM 同 时 建 议， 医 师 应 该 在 捐 献 前， 向 捐赠 方 与 接 受 方 进 行 心 理 咨 询 。 另 外， ASRM 还 建 议， 在
    80 万 人 中， 捐 献 者 的 入 均 限 制 成 功 数 量， 应 控 制 在 25 个 以 内， 以 免 出 现 乱 伦 的 风 险 ， 但 这 些
    全 都 是， 都 还 是 在 指 导 意 见 的 层 面 上， 并 没 有 形 成 配 套 的 法 律。


    当 然 ， 并 不 是 所 有 家 庭 都 需 要 事 前 干 预 ， 才 能 够 顺 利 地 处 理 精 子 捐 献 带 来 的 影 响 ， 但 更 加
