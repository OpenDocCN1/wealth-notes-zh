  md: '# 005报告 | 用神经科学重新认识情绪


    今日报告：用神经科学重新认识情绪


    当你充分地了解和自己的情绪，你便可以更好地改造自己的行为和塑造自己未来的样子。


    ——《GOC 杂志》


    **马德斐**

    通过神经科学，我们可以解析一种叫“情绪指纹”理论。那么情绪的本质是什么？我们又该如何管理自己的情绪？

    今天的议题我分三个部分向你讲述：


    +   1.  为什么不能通过表微符号判断一个人的情绪

    2.  情绪的本质是什么？

    3.  如何管明大脑与情绪，塑造自己的行为？


    2018年BBC 聚焦了情绪，教你如何充分了解自己的情绪，你就可以知道如何改造自己的行为和塑造自己未来的样子。


    ```

    You can take steps now to influence your future emotional experiences, to sculpt
    how you will be tomorrow.

    ```


    听起来是不是很棒？我们接下来看看这是如何做到的。


    # 情绪指纹并不靠谱


    我想问你一个问题，不知道你有没有看过一部美剧，叫做《别对我撒谎》，剧中的主人公可以通过一个人的微表情来判断 TA 是否在撒谎。


    那么问题来了，你真的相信微表情能够判断一个人的情绪么？我相信很多人都会说是的。


    因为从柏拉图到亚里士多德，从弗洛伊德到巴特曼，他们都认为，每一种情绪都有它专属的配套设施，包括面部表情、身体动作、心率，出汗等等。尤其是巴特尔的《人类和动物情感的表现》中，这个观点早已被人认同了。


    但今天这篇文章要告诉你，他们说的是错的。给出这个判断的人叫丽莎·巴雷特（Lisa Feldman Barrett），她是一位心理学家，她将近30年的职业生涯，都用来研究情绪的形成机制。


    她在今年出版的3月份刚出版了一本《情绪是如何产生的》，How emotions are made，凝聚了她一生的研究成果。我们今天的内容就是这本书的精华摘要。


    《华尔街日报》对巴雷特在情绪上的研究评价非常高，她说的发现引人深思。


    科学大刊《科学美国人》称赞巴雷特的发现是：“想法独到、大胆，但却有理有据。”


    畅销书《爱》的作者安吉拉·达克沃斯（Angela Duckworth）读了巴雷特的文章，也称赞说：“巴雷特这位世界性的心理学家，用神经科学让人们对于情绪有了全新的认知。”


    巴雷特到底颠覆了谁的观点？她认为我们之所以这么多传统论，在她的启发下，我们应当如何更好地管理情绪？


    # I 为什么表情不靠谱


    以前我们都认为表情可以判断情绪，那是因为以达尔文为代表的这些大师都是这么说的。他们认为，每一种情绪对应一种标准动作，这是对情绪解释的一种经典模式，叫做“情绪指纹”，emotion
    fingerprint。这种经典模式已经流传了几个世纪。


    但是为什么巴雷特会说这个假设不靠谱呢？这是因为即使这些大神，他们对情绪的猜想，也只能通过猜测，再结合自己的理解来解释。是很主观的。


    但科技发展到今天，脑扫描成像技术迅速发展，研究者可以用这个技术精确观察到人类大脑神经的运作，任何假设都可以通过科学来验证。'
