  md: '下面，我就给你提供三个实用的方法。


    第一，照顾好你的身体，就是稳定情绪的有效办法，给身体充电，让身体有足够的能量，你的大脑在分配能量的时候，因为能量不足而产生负面感受的几率就会更低。


    要知道饥饿、疲劳或者生病，它们产生的情绪信号，和生气、愤怒、焦虑、悲伤，是一样的，身体好，情绪会更好，这句话是有道理的。


    作者还强调，那些能够让你感到舒适放松的活动也很好，比如按摩，它产生的身体愉悦，不仅对精神有好处，还可以减少身体的炎症。


    第二个，通过改变环境来调整情绪，比如说出门散个步，不能出门的话，转移自己的注意力也会有效果。


    那最后一种方法，就是改变构建情绪的第三种原料，过往的经验。这也是最难改变的，因为人们不可能改变过去，但是换个角度来想，每一个现在，都是过去的未来时态。


    你可能有过这种体验，莫名其妙的疲惫，想法消极，觉得自己很差，大家都讨厌自己。但实际上并没有什么不好的事情发生，这种状态被巴蕾特称为是情绪流感，emotion
    flu.


    还记得咱们刚才讲的情绪是什么吗？情绪就是大脑赋予你身体当下感受的解释。把这种没来由的消极感受，单纯地看做是一种生理上的问题去处理，能够更快速、有效地消解负面情绪。


    把情绪流感当成真的感冒来看待，睡一会儿，散个步，做一些锻炼，做任何会让你感受变好的事儿，减轻这些症状。


    通过这样的方式，你就改变了大脑处理这种状况的经验，以前是很难地承受，现在是可以积极地处理、消解。


    今天的内容就讲到这里了。我想起了咱们在第一季《世界名刊速递》中讲过《鹦鹉螺》的一篇文章，也是咱们今天的作者巴蕾特写的。在那篇文章中她提到了一个概念——情绪粒度。


    简单来说，情绪粒度指的就是我们在不同的情况下，区分并且识别出自己感受的能力，能明确自己的感受，就能针对自己的情况作出相应的解决办法。


    那么怎么能提高情绪粒度呢？一个好的方法就是学习与情绪概念相关的词汇，增加自己对情绪的感知层次，也可以通过读书、看电影，包括在得到听我们的专栏。这些都是新的体验，把你自己从舒适区中推出来，接受新的事事物，体验新的感受，产生新的视角。


    红酒对于品酒师来说，有很多层次和细节，颜色对于画家来说也有千万变化，我们也可以打磨这样的技术一样来练习掌控自己的情绪。


    # 总结


    情绪就是大脑对于身体当下的反应，做出的解释、赋予的意义。我们的身体能量，过往的经验和我们自身对情绪的感知，都会影响我们未来的情绪体验。


    这并不容易，我们不可能像换衣服一样，轻而易举地改变自己的情绪体验，但就像咱们今天的金句说的那样，当你充分了解自己的情绪，你就知道如何去改造自己的行为，塑造自己未来的样子。


    You can take steps now to influence your future emotional experiences, to sculpt
    who you will be tomorrow.


    提问：我们今天讲了四种管理情绪的办法：提高身体能量、改变当下环境、构建新的处理消极情绪的经验，以及提高情绪粒度。你会从哪一种方法入手？为什么？欢迎留言谈谈你的看法。


    # 划重点


    +   今日得到：

    1. “表情指纹”不靠谱，我们无法用表情符号的“套路”判断一个人的情绪。

    2. 情绪是大脑对我们的身体反应做出的解释、赋予的意义。

    3. 照顾好你的身体就是稳定情绪的有效办法，给身体充电，让身体有足够的能量。

    4. 通过改变环境可以调整情绪，比如说出门散个步。

    5. 把没来由的“情绪流感”，当成真的感冒来看待，睡个觉，做做锻炼，能够消解负面情绪。

    6. 学习与情绪有关的词汇，增加情绪感知力。


