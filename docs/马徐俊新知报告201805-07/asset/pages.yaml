  md: '# 002报告丨从总统职位看领导力信条




    # 今日话题：从总统职位看领导力信条


    我认为，领导力，是定标、是调整、是定位，是 磨合，是认知的过程，是认识自己、认识团队、 认识环境的动态发展过程。


    这是我对领导力的一点认识。 但更深刻的是， 领导者是一个“人”，是一个“普通人”， 是一个有缺陷、有弱点、有优点的人。


    ——**艾森豪威尔**


    **马修斯**


    这是一份对美国总统这个位置的诊断报 告，里面的领导力法则也可以供你参考。 本期内容分为三个部分：


    +   * 承受压力是领导者的常态

    * 关注长期是领导者的责任

    * 学会管理是领导者的必修课


    # | 领导力是个苦差事


    昨天我们说了，不是美国总统，而是总统 这个职位体现了问题。今天的内容，我 想借着如何体现总统职位这个问题，再往 下一层，说点更有意思的东西——领导力。


    艾森豪威尔曾经这么说过：


    > “领导不是带来惊喜，是带来惊喜的 过程。领导不是改变，是改变的过程，是 磨合，是调整，是定位。是认识自己，认识 团队，认识环境的动态发展过程。领导力 是一个苦差事，是长期、是困难，是不可避
    免的，是痛苦的，是孤独的，也是危险的。”


    ```

    ```text

    You do not lead by hitting people over

    the head. By damn fool can do that,

    but it is usually called “assault”,

    not “leadership”. I’ll tell you what

    leadership is. It is persuasion, and

