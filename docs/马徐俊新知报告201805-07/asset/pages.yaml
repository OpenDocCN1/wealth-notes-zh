  md: '其次是政府的支持，让中国科技公司更有底气走出去。


    最后，BAT 普遍采用投资但不接管的方式，让其他国家的创业公司能保持自己的独立性，所以亚洲创业公司更喜欢拿中国公司的钱。


    但问题在于，这样的模式容易产生自我竞争。这个也好理解—一国内从网约车平台大战到共享单车行业的厮杀，我们见得太多了。而中国科技企业投资了众多的海外公司，彼此之间也会产生竞争，这也是一种对资源的消耗。


    美国公司的优势在于历史成缜和先发优势，毕竟硅谷的名声在外，它们的国际化也开始得很早，比如亚马逊在英国和德国的分公司，都已经有 20 年的历史了。美国公司在语言上的优势也非常明显，英语毕竟是全球使用上最流行的语言，
    所以看谷歌和 Facebook 的收入，有一半来自于海外市场，而阿里在海外市场的收益还不到 10%。


    但美国公司的问题在于，它们的本土化普遍比较差，融入当地的程度不如中国企业投资的公司。而前面也说了，美国巨头的市场红利，主要来自于 PC 时代，而大部分亚洲国家都像中国一样，
    对手机的使用依赖更大。


    所以《经济学人》说，换一个角度看，两国科技企业这场较量，其实也像 是移动互联网和传统互联网的战争。


    《经济学人》这篇文章最后还给了个类比式的总结，我觉得非常妙—一“中美科技公司的海外战争，很像这一届世界杯。传统强队和新兴势力，在本土以外的俄罗斯激烈交锋，而原来的强队和明星球员，在新崛起的国家和新一代的明星球员面前，未必能讨到便宜。”这个比喻还真挺形象的。


    # | 总结


    总结一下今天的内容，中美两国的科技巨头，已经在本土之外的海外市场上展开了较量，美国企头高举高打的策略，和中国企业“润物无声”的打法，是由各自的商业模式决定的。但正如今天的名句所言，为了赢得剩下的几十亿互联网新用户，
    中美的科技巨头，都会不计成本的投入。


