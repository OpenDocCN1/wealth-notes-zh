  md: '“机”，就算我们要费尽心思活过了百岁，恐怕也无法摆脱疾病的困扰。自然的寿终正寝，只是可遇而不可求的美好梦想。


    对于一项石破天惊的新发现，出现这样的争议很正常。但不管怎样，作为普通人的我们，还是很愿意看到这样的研究。毕竟人类的平均寿命正在不断延长，任何关于生命终点的研究，都变得愈发有价值。如果真的在经历百百年岁月的洗礼之后，连死神都能对你网开一面，那绝对是一份来自生命的厚礼。不过，想要收到这份厚礼，我们得要先努力活到105岁才行了！


    # | 总结


    总结一下今天的内容。长久以来，人们一直以为年纪越大，死亡率越高，关于死亡率研究的权威结论“贡培兹定律”也印证了这一点。可是，科学家们通过分析3836名意大利超高龄老人的死亡率样本，发现人类死亡率似乎存在一个“平台期”，过了105岁，死亡率将达到60%，此后就不再增长。


    这个发现，极大地动摇了当前学界对人类寿命极限的看法，从理论上说，它似乎打破了人类寿命的“天花板”。不过，也有人指出这项研究自身的局限性，并且认为死亡这件事涉及的变量太多，不管是曲线还是横线，都无法完全揭示它的奥秘。


    好，今天留给你的问题是，抛开那些不可控因素，你认为用什么样的办法，可以增加长寿几率，让自己尽可能活到105岁？欢迎在留言里告诉我，也欢迎你把今天的内容转发给自己的朋友。


    ![](img/e9eede6a8281901cce3c73b05fce3d96_94_0.png)


    ![](img/e9eede6a8281901cce3c73b05fce3d96_94_1.png)


    +   **今日得到：**

    1. “贡培兹定律”认为，人在成年后每8到10年，死亡率就要翻一番，呈现一条指数级上升的曲线，年纪越大，死亡率越高，这是常识。

    2. “死亡率平台期”的研究发现，人只要活过105岁，死亡率的增长速度就会放缓，稳定在60%，这意味着人类的寿命可能没有极限。

    3. 也有科学家指出，用超高龄老人的死亡率来推断普通人的寿命极限，缺乏普遍性的指导意义，况且死亡率涉及的变量太多，一条曲线并不能说明问题。


