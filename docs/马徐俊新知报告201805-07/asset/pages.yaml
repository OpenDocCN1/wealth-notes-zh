    # ## 总结


    总结一下今天的内容。奈公司用短短十余年的时间一飞冲天，靠的是在内容上一掷千金、为用户定制了好的精准定位，加上没有广告的模式，造就了独一无二的“奈飞经济学”，《经济学人》用这个概念，帮我们准确地定义了奈公司的核心优势。


    今天这篇文章，让我想起了罗振宇老师在跨年演讲中提到的“时间战场”概念——时间会成为商业的终极战场。这一点，在电影、电视和流媒体的行业竞争上，充分地体现了出来。


