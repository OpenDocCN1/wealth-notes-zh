    \n# 为什么说王室越来越平民化？\n\n说到王室，你会想到什么？纯正的血统、城堡、公主王子、高贵神秘的生活？其实，现在世界上，保留着王室的国家已经非常少了，而且王室的生活也跟过去完全不同于。越来越开放的媒体曝光，有越来越成为门槛化的制度，让我们发现，王室是越来越平民化了。\n\
    \n你会发现，在荷兰，女王会骑自行车上街购物，国王会在民航公司担任飞行员，一旦就是20年。瑞典王室的王宫和私人花园，是开放给平民参观的，王室会安排自己的孩子们怎么走地铁。前段时间咱们中国有个综艺节目，一群明星去欧洲旅游，在童话之国丹麦的公园里碰到丹麦王子，将他俩合个影，就够导游一样了，大家都怎么正确的生存。而一场接一场平民的婚姻，可能是王室平民化最直接的证明。\n\
    \n过去，为了保持血统的纯正，王室是很少跟平民结婚的。比如日本皇室，号称万世一系，所有的婚姻，基本在几个贵族家族，就是贵族之间进行。英国王室继承法规定，对于王室的嫁娶有严格限制，比如，现在英国王室的妹妹，王妃特雷比，王妃，年轻时爱上了王室的侍卫，小日子一开始，因为曾是平民，还被逐，结果导致她被宫政得特别特，侍卫自杀，造成了终生的痛苦。\n\
    \n但是现在的同况已经完全不同于了。比如去年日本的真子公主，就嫁给了自己的大学同学，是个平民；荷兰的现任王后亚历山大约，还是在王室的时候娶了平民姑娘；瑞典的前任王储维多利亚公主，嫁给了自己的健身教练。英国的两位王子，威廉和哈里都娶了平民阶层的妻子，威廉王子的夫人卡特来自中产家庭，父亲是位商人，母亲曾是空姐。哈里王子最近被刷屏的新婚妻子梅根，身世也更具复杂，黑白混血，混过好莱坞，打过小工，拍过广告，读过MBA，靠着自己白手起家，现已经累积了5000万美金的财富，还是位博客作家，据说文笔很不错。说了这么多，你可能会好奇，是什么原因导致几乎所有世界的王室，都在努力让自己平民化呢？\n\
    \n# 王室在平民化社会里的生存挑战\n\n王室平民化现象众所，在于王室这个阶层的势力为家发生了变化。在两次世界大战之前，王室的权力来源于贵族社会权力，但是贵族社会粉碎了贵族统治社会，全世界进入了平民社会，虽然王室的地位和形式被保留了下来，但是为曾经的权力来源，就是贵族已经消失了，所以，如今任何王室的存续，依然是都要民众的认可，不管是美国、日本，还是荷兰。因为英国是王室的典型代表，我在接下来的内容中不以它为样本，看看王室发生的变化与今天面临的危机。\n\
    \n英国王室是世界上现存历史极其次久远的贵族，到现在差不多1200年了。从前的英国，在光荣革命以后就确立了不参与国政，只作为国家象征的传统，所以一直很低调。国王或者女王，如果没有出格，是不会大众主动接触的，保持着神秘高耸的作风。但是平民化社会的潮水不断涌来，让王室承受着巨大的冲击，最终，戴安娜王妃的车祸事件，让这股浪潮达到了顶点。\n\
    \n因为戴安娜在英国民众中都叫戴妃，被称为“人民的王妃”，大家都为她戴妃之死，为的是查尔斯的冷心和王室的爱泼。这是自女王继位以来，英国王室最大的一次舆论危机，跑去白金汉门口歇访的伦敦市民，抬起了警察长长的队伍，最后戴妃女王出来发表安抚民意，这也是她在位历史上的一道一。这次事件，让女王真正意识到了平民社会的力量，女王意识到什么在此后，她开始去看，女王频繁曝光平民的原因，她不但出席奥运会，还参加了今年的伦敦时装周。王室的婚姻标准也是一阵阵前，原来不接受平民、离婚、异族血统，现在统统都可以，明显有跟着老百姓靠近平的感觉。\n\
    \n而这次哈里和梅根婚姻，按照《纽约杂志》的观点，也是一众对下台阶的延续危机。因为梅根是再有力，留驻她的时间也差不多了，她已经在这63年的，再维持，可总是委屈的，而王室的下一继承人，查尔斯王子，是个从王室民众都不喜欢的一位人选。\n\
