  md: "# 038报告｜如何正确地给别人“贴标签”？\n\n\n\n# 今日报告：如何正确地给别人“贴标签”？\n\n> “因为被贴上了这个标签，所以他们很可能会努力做到标签上的样子。”——《刺猬蝶》\n\
    \n马徐盈\n\n想让一个习惯说谎的人变得诚实起来，给他们贴上“真诚”的标签，神奇的事情会发生吗？通过《刺猬蝶》杂志的这篇报道，你会看懂“贴标签”的作用和问题。\n\
    \n+   - 今天的议题分为三个部分：\n  - 贴标签到底有没有用？\n  - 如何正确地给别人贴标签？\n  - 贴标签可能带来的负面影响。\n\n\
    最近《刺猬蝶》杂志刊登了一篇名为《学会正确“贴标签”》的文章，或许是对“我们该不该给别人贴标签”这个问题，文章提到了Christine B. Miller，她是美国南伊利诺伊大学“南哈林”分校的查尔斯·米勒教授，米勒在自己的新书《品格鸿沟》（The\
    \ Character Gap）中提出了一个很有趣的理论。\n\n这个理论说，如果你想让一个习惯说谎的人变得诚实起来，或者让一个胆小的人变得勇敢起来，一个简单的做法就是，给他们贴上“真诚”或“勇敢”的标签。假以时日，神奇的事情就会发生，他们很有可能努力把自己活成标签上的那个样子。\n\
    \n《刺猬蝶》是这么说的：“因为被贴上了这个标签，所以他们很可能会努力做到标签上的样子。”\n\n```\nFor with that label attached\
    \ to them, there is a good chance that they will try to live up to it.\n```\n\n\
    那么，给人贴标签真的有那么大的作用吗？\n\n# 贴标签到底有没有用？\n\n关于“贴标签”到底有没有用这个问题，《刺猬蝶》这篇文章很直接地告诉我们：当然有用！\n\
    \n有几个著名的实验可以证明这个结论。\n\n第一个是“整洁”实验：1975年，内布拉斯加大学的心理学家戴维迪·米歇尔给五年级的学生做了一系列实验，他给第一组的学生贴上了“整洁”的标签，第二组学生用口头的方式，要求他们保持整洁，还给第三组学生作为参照组，没有贴标签也没有第三组。结果，被钉上“整洁”标签的学生，表现得最为整洁。\n\
    \n第二个是“合作”实验：20世纪70年代得克萨斯大学的罗杰·普鲁和雪莉·摩尔做一个实验，给一组孩子贴上“合作”的标签，而另一组孩子贴上“竞争”的标签。结果发现，孩子玩搭积木游戏的时候，虽然很多孩子已经忘记了他们的标签，但是“合作”组的孩子搭起来的积木个数，是“竞争”组孩子的两倍。\n\
    \n第三个是“环保”实验：2007年，意大利学者Gert Connieslee做了一个实验，给其中一些顾客贴上“非常关注环境和生态”的标签，给他们去购买电器。结果发现，这些被贴上标签的顾客，在购买时更环保、更关注环保的电器。甚至最后给消费者时更关注环保的顾客，也有环保表现。\n\
    \n第四个是“慈善”实验：1973年心理学家吉特林，做了一个实验，他要求人们为慈善事业做出捐赠，有些人捐，有些人捐的很少。如果给他们的标签是“慈善家”或者“吝啬鬼”的话，被贴上“慈善家”标签的人比没有标签的人多捐了钱。而被贴上“吝啬鬼”的人，比那些第一次捐过、但第二次没有贴标签的人捐得更少。\n\
    \n# 如何正确地给别人“贴标签”？\n\n既然有那么多实验证明，贴上好的标签，可以产生巨大的激励作用，那我们具体要怎么使用它呢？\n\n利用贴标签，可以对别人施加影响，操作其实很简单——如果你想让某人变成希望的样子，就多给他贴这种“正向标签”，也是要多夸他们，这样就能从他们身上，激发出你想要的特质。\n\
    \n比如，你可以称赞你的伴侣或孩子富有同情心，即使他并没有那么富有“同情心”；再比如，如果你对某个同事，你不想单独说一声谢谢，但同时又觉得他太普通了，可以夸他“很有爱心”或者类似的说法。\n\
    \n为了帮助你更好地使用“标签”，我再接着一个更具体的例子：假设你是一名中学教师，你怀疑你的学生做家庭作业时有抄袭行为。现在，你正在准备一场重要的考试，教室里满了学生，你担心他们会偷懒，但如果你告诉他们“抄袭”是犯法的行为，这可能会适得其反。但是，如果你告诉他们“我们班是一个诚信的班级，我们每个人都很有诚信”，那么结果可能会令你惊喜。\n\
    \n# 贴标签可能带来的负面影响\n\n尽管“贴标签”在一定程度上起到正向的作用，《刺猬蝶》这篇文章的作者，还是对贴标签这件事持谨慎和怀疑的态度。"
