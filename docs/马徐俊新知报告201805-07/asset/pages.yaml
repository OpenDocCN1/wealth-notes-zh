    “新知”从哪里来？


    从全世界的80多家顶级刊物、专业机构研究报告中来。


    它们聚集起了全世界的聪明人为我们服务，是真正的奢侈品。


    如果你想深入了解商业、科技、科学、文化、政治、管理、医学等各个领域的新知，那就听听诺贝尔奖获得者、大学教授、商界人士、各个行业的顶尖高手怎么说。


    我如何为你报告？


    我提供的服务，就是做你的“新知汇报人”。


    首先，我要为你把关，判断这个世界上每天发生的焦点议题中，哪些真正值得你关注；


    然后，我要从这些议题中，找到有逻辑、有认知价值的逻辑和洞察；


    最后，再把它总结一下当日的“新知报告”，交付给你。


