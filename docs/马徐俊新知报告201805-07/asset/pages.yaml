  md: "播到全网，所以任何参与者在这个网络中的权力和义务，都和其他的节点没有区别，对信息的所有权是没有独占性的。\n\n其次是，大家为什么要参与呢？简单来说，是因为区块链技术可以帮我们，拿回属于自己的身份数据，并决定它的使用方式，并且不再被别人操控和利用。\n\
    \n这个事儿本身就很有吸引力，而且现在全球都处在一个阶级对立、社会分化的格局中，想要打破垄断和阶级固化的思潮，已经十分汹涌，区块链的逻辑，恰恰迎合了大众的内心需求。\n\
    \n最后，为什么一个不依靠股东投资、不依靠领导者的东西可以被建构起来呢？因为，第一，区块链本身已经设计好了固定的算法规则，规则的执行则由程序控制。\n\n\
    第二，虚拟货币解决了激励机制的问题。\n\n第三，“人人参与”解决了存储空间和计算能力的问题。\n\n当然，说了这么多好处，但要让区块链技术真正造福每个人，还得让大家对它有更多的了解，同时也要推出容易让大众接受的好产品和事件，这都需要时间和积累。\n\
    \n# | 总结\n\n区块链技术把集中式数据库变成了分布式数据库，不仅去除了中间商、简化了信用征信的流程，而且还把信息的所有权交还给了个人。区块链技术的架构和逻辑，可以从根本上，解决目前互联网存在的垄断和信任问题，而且目前它也已经在金融服务、寻找亲人、公益捐助等信息透明度要求很高的领域里进行了应用。\n\
