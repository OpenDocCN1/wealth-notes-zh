    在我的印象里，找到、培养一个爱好，在不断练习中完善一个目标的过程、以及达到（或超过）目标的瞬间，都会让我感受到特别强烈的快乐。\n我接受过系统的声乐训练，普通的歌曲对我来说没什么难度，日常的技巧训练也觉得有些枯燥。但当我找到一首自己喜欢的、同时又有一定难度的歌，自己会自发地产生想要练习、唱好的冲动。在一次又一次重复的练习，不断纠正每一句的音准、节奏、气息、控制的过程中，以及录音时最终找到接近（或超越）原唱的水准的那一刻，都会让我感到发自内心的愉悦。\n\
    \n成洁gett\n控制体重。\n少吃肉，多吃菜。\n去食堂的时候，一食堂就去排清真C窗口，吃鱼肉、鸡肉啊~来替代红肉；二食堂就先点盛饭区，然后再去盛鱼和主食，甜点心区就略过~因为盘子没空间了\n\
    \n头发木错的遗憾\n我发现我陪动物和小孩在一起时会更快乐。马路上，看到小娃娃晶晶亮亮的眼睛，稚嫩的脸庞，就不由自主感受到心境很放松，嘴角不自觉绽开笑意。而照料小动物就是一件快乐的事情。办公室养的一缸鱼，家里养的乌龟和狗狗，看到它们活泼可爱的样子，感到一天的疲惫和不愉快都暂时消失了，帮助照料它们，换水和散步都是极其愉快的事情。\n\
    另外，老师今天提到：“对于快乐的事，如果能解读过多，反而会降低幸福感。”“我以前隐约这么认为，看样子还真不是这样。应该跟古人说的‘独乐乐不如众乐乐’，并不相冲。\n\
    \n刘溜溜\n\"心理免疫系统\"非常像上周隔壁方维韩老师说的我们“回归平均”这个概念。无论快乐还是伤心，终究要回归平均的，所以不要为一时的难过而消极焦虑，即便是抱着“船到桥头自然直”的心态也会有所帮助。\n\
    我们也可以运用一些“游戏化的思维”让我们快乐，比如设定里程碑，每个小阶段完成后给自己小小奖励；完成重要阶段时给自己大大奖励；用可视化方式将即的改变和进步显示出来等方法。我想即便在自己思考这个机制的过程中我们也能享受到快乐。"
