    \n《大西洋月刊》这样总结以上现象：做一件好事，或者仅仅是想象自己做了件好事，都可以通过提升主体意识，达到增强耐力的效果。\n\n马拉松运动从形式上就包含着很多外部激励的因素，比如上万人同时开跑的场景，很容易让人产生惺惺相惜的情感，并且达到互相激励的效果。再比如，在奔跑的过程中，有沿途支持的人群和陪跑的队伍，以及现场播放的鼓舞人心的音乐，都能起到外部激励作用，增强参赛者的耐力。\n\
