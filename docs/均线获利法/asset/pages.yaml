  md: "關係不會改變，只是兩條線有時會接近有時會分開，因此買進信號③的例子表示漲勢一度疲軟的行情再次開始上漲，可說是買進的機會（圖表2-7）。\n\n# 關於買進信號④\n\
    \n有人將這個信號視為另外一種技術指標，名為「移動平均乖離率」。 \n\n移動平均乖離率是一種技術指標，以數值（%）表示價位線和移動平均線距離多遠，做為買賣時的參考。移動平均如其字面的意思，是一種「平均値」，所以價格背離平均値後，也會有朝移動平均線靠近（回歸平均）的特性。這個指標便是利用這種特性，當成是買賣的信號。\n\
    \n如果價位線以一定的角度下降，移動平均線也和價位線以相同的角度平行下降，表示價位線和移動平均線正維持一定的乖離程度。\n\n如果下降中的價位線價格突然急跌，價位線就會遠離移動平均線，但這種狀態一般不會持續太久。急跌總有一天會反彈，因此價位線又會朝移動平均線接近（圖表2-8）。\n\
    \n話雖如此，移動平均乖離率並不是一種容易運用的指標，因為沒人知道「離多遠後才會開始接近」。一般用來當成買賣信號時，多以10 %以上作為參考。也就是說當價位線在移動平均線下方，且偏離10\
    \ %以上時，就表示被超賣"
