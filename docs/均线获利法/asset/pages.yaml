    # SECTION 3-2


    # 如何看出市場或個股的趨勢正在上漲、下跌還是盤整？


    三條移動平均線的排列方式只有六種，三條線（短期均線、中期均線、長期均線）的排序，有下列這些排列組合。


    +   - 第一階段：短期均線、中期均線、長期均線。\n- 第二階段：中期均線、短期均線、長期均線。\n- 第三階段：中期均線、長期均線、短期均線。\n-
    第四階段：長期均線、中期均線、短期均線。\n- 第五階段：長期均線、短期均線、中期均線。\n- 第六階段：短期均線、長期均線、中期均線。


    市場行情會由第一階段依序發展到第六階段，這也是移動平均線大循環分析的基本概念（圖表3-2）。此六階段都隱藏著代表行情現狀的訊息，訊息如下。


    +   - 第一階段：穩定上漲。\n- 第二階段：牛市終結。\n- 第三階段：熊市入口。'
  merge: -1
  img_proc: true
- pgno: 75
  md: "第四階段：穩定下跌。\n\n第五階段：熊市終結。\n\n第六階段：牛市入口。\n\n依時間順序來看，一般的移動順序是由第一階段開始，最後進入第六階段，稱為「順向」。\
    \ \n\n既然是「一般來說」，就表示有例外。例如，有時會從第一階段朝第六階段移動，稱為「逆向」。 \n\n不過逆向並不是常見現象。大致上來說，整體行情的發展有七成是順向，只有三成是逆向（圖表3-3）。\
    \ \n\n階段逆向表示大盤進入反轉點、反彈點或盤整局面，而且逆向不會持續太久。通常移動一到兩個階段後，就會再回到順向，例如：由第六階段進入第五階段、第四階段。因此進入逆向時，要想著「總有一天會回到順向」，並好好布局。\n\
    \n第二個重點是，不管是順向還是逆向，階段不會跳著來，一定是一個接著一個。以順向的狀況為例，第一階段後會是第二階段，逆向時第六階段後則是第五階段。從移動平均線的過程來看，線圖不會跳空移動，所以階段也不會突然亂序。\n\
    \n這也表示，只要知道現在處於哪個階段、是順向或是逆向，就能明確地看出下一個階段。\n\n此外，各個階段還有以下特徵。"
