  md: '卻急著做出獲利了結的決定，即使碰上千載難逢的大行情，卻在起漲沒多久時就獲利了結出場。


    這種操作方式不僅越虧越多，而且獲利極有限，整體來看幾乎沒有獲利。然而，在移動平均線大循環分析中，只要價格持續上漲，就不會出現出場的信號，因此可在上漲局面中一直抱著部位。


    相對地，缺點是當盤整局面持續時，很難有增加獲利的機會。就算出現可獲利的走勢，如果僅是小行情，一出手布局可能走勢就變了，不僅難以獲利，甚至可能必須停損出


