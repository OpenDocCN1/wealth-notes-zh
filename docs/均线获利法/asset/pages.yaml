- pgno: 31
  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_31_0.png)


    # SECTION 2-1


    # 上百種技術指標中，

    為何移動平均線最重要？


    「技術線圖分析始於移動平均線，終於移動平均線」、

    「掌握移動平均線，便能掌握技術線圖分析」，移動平均線可說是技術分析的最基本要素。


    美國人在1920年左右開發出這項技術指標，不過據說同時期日本也有名為「絡足（Karamiashi）」的移動平均線，有些人認為開發時期相同，也有些人認為是由美國傳來的。


    移動平均線開始廣為人知，始於1960年美國分析師約瑟夫·E·葛蘭碧（Joseph E. Granville）的著作《每日股票市場獲最大利益之戰略》（A Strategy
    of Daily Stock Market Timing for Maximum Profit），因此投資買賣業界使用移動平均線指標，已有50年以上的歷史。


    技術分析除了移動平均線外，還有各式各樣的分析指標，例如：MACD、RSI、包寧傑帶狀操作法、一目均衡表、隨機震盪指標等，從投資人一定聽過，到連聽都沒聽過的指標，至少超過一百種。每種都有人用得得心應手，主張自己用的指標是最好的。


    資訊當然越多越好，可是有人說「MACD這裡好」，又'
