  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_44_0.png)


    # SECTION 2-6


    # 什麼是「葛蘭碧法則」？


    雖然前面很簡單地寫：「黃金交叉就是買進信號，死亡交叉就是賣出信號」，但事實上，在市場中事情沒有這麼簡單。


    市場上常見所謂的「假信號（騙線）」：看到出現買進信號就出手買進，結果卻反轉直下；或者是看到賣出信號就果決出清，結果卻反彈上漲。因此用移動平均線判斷買賣時間點時，必須更仔細地掌握移動平均線和實際價格之間的關係。


    「葛蘭碧法則」就是一個極為簡單明瞭的方法。這是活用移動平均線的創始人葛蘭碧，在他的著作中制定的原則：看移動平均線和股價偏離的方式和方向，以判斷股價未來的走勢。順帶一提，葛蘭碧是華爾街赫頓市場資訊日報社（Hutton
    Daily Market Wire）的紅牌記者。


    葛蘭碧法則歸納出八種買賣的信號，其中買進和賣出信號各四種，如圖表2-4所示。'
