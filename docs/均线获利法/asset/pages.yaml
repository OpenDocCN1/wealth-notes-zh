- pgno: 19
  md: '重整旗鼓的時機，原本是勢均力敵的兩隊，有時候某一隊會獲勝，有時會輸；有時會連贏，有時也會連敗，或是很快又恢復勢均力敵的狀態。這就是市場中的價格變動。


    買方有優勢，指的就是行情處於對買方有利的狀態，而賣方有優勢，指的就是行情處於對賣方有利的狀態，也可說是「略微失去平衡的狀態」。


    不過請讀者注意，本書所謂的買方有利狀態或賣方有利狀態，不過是代表獲勝機率較高的狀態。就算是買方有優勢，


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_19_0.png)


    插圖©高木一夫'
