  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_206_0.png)


    # 重點整理


    +   1. 練習投資時，可使用過去的線圖練習。

    2. 想成為勝利組投資人，應該反覆進行學習、練習、實踐、驗證、反省的循環過程。

    3. 練習時，要回溯自己不知道的過去線圖，並且只從線圖最右側判斷。

    4. 練習時最重要的，是看出盤整行情和真正的大行情，並找出行情開始與行情結束的標記。'
