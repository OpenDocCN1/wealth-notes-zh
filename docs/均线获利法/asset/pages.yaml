    # 關於賣出信號①


    這個狀況與上一節買進信號①相反，是最典型的死亡交叉。移動平均線先呈上升趨勢，然後出現漲勢不再的跡象，在這兩大前提同時成立的情況下，位於移動平均線上方的價位線穿破移動平均線下跌時，就是賣出的最佳時機（圖表
    2-9）。


    葛蘭碧法則中，最重要的是上一節買進信號①的黃金交叉和這裡的死亡交叉，所以請務必牢記這兩點。


    # 關於賣出信號②


