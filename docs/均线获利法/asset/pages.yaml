  md: '# SECTION 3-1


    # 如何使用移動平均線大循環分析，抓到買賣點？


    第一章曾經提到，投資買賣要獲勝，最重要的不是預測未來，而是掌握現在的行情狀況，再朝有優勢的方向布局。


    可判斷優勢的局面有很多，我最注重的是移動平均線大循環分析，利用三條移動平均線，明確定義出市場局面，分析漲跌強弱關係。


    順帶一提，這種利用三條移動平均線分析市場行情的方法，過去就已經有許多人研究，並不是我的原創。我只是把這個方法整理成多數投資人容易理解的內容。


    移動平均線大循環分析的優點，在於可以清晰看出優勢所在，而且找出優勢的方法也很簡單。此外，這種方法既可以套用在觀察日線、週線的長期投資，也可以運用在使⽤分時走勢圖的短線投資上。


    有買方優勢的位置，是移動平均線的排列順序，由上而下依序為短期均線、中期均線、長期均線，且三條都呈左下右上的走勢。相反地，有賣方優勢的位置，則是移動平均線的排列順序，由下而上依序為短期均線、中期均線、長期均線，且三條都呈左上右下的走勢。當然，出現買方優勢時就


