    不過這和買進信號②說明的狀況一樣，在這種例子中，常常看到移動平均線和價位線交叉好幾次，最後趨於強勢，價格反彈向上。究竟是反彈賣出的時機，還是走勢轉握點，其實不過毫釐之差，並不算是值得強勢出擊的局面。


