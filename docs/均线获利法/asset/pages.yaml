  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_121_0.png)


    # SECTION 4-1


    # 實際練習觀察線圖，正確理解現狀才是關鍵


    第三章已經說明移動平均線大循環分析的特徵、概念、使用方法和優缺點。第四章則要 mazl實際的線圖，來練習理解大盤。


    請觀察例題1到例題6的線圖，試著自行思考目前的行情狀況。


    往後翻頁就有答案，除了附上線圖的後續發展外，也會說明應該如何因應這種局面。


    最重要的是，不要猜測未來。第一章提過，技術分析的真諦不在於預測，而是正確理解現狀。根據大數法則，只要根據正確的理解，反覆採取合理的因應舉動，便能在投資買賣中獲勝。


    因此在本章練習時，不要去猜測隨後的行情變化，請專注練習如何正確理解現狀。'
