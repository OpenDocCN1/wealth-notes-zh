- pgno: 201
  md: '# 圖表7-2是2010年3月到10月為止的日線圖。


    為了便於說明，所以一次看得到這個例子整段期間的線圖。大家在實際練習時，請讓最右側停留在2010年3月（本例開始）的時間點，先不要讓自己看到線圖後面的發展。


    幾乎所有投資人每天都在徬徨、煩惱著「明天是不是會開始飆漲？」「明天會不會暴跌？」，而在極度不安時，會憑感覺做出「在這附近收手吧」的投資判斷。然而這樣的投資方法不會有好的結果，重點是要看線圖中的記號來判斷。


    只要能徹底落實前述原則，這半年內（圖表7-2）的關鍵點，也就是需要猶豫的局面其實真的不多。以下說明這幾


    # 圖表7-2 積水住宅日線圖（2010年2～10月）


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_201_0.png)'
  merge: -1
  img_proc: true
- pgno: 202
  md: '個關鍵點。


    第一個關鍵點，是由上漲行情要切換成下跌行情時的局面（圖表7-3）。


    一開始位於第一階段，在②進入第二階段，到了③又進入第三階段，是預估開始進入下跌行情的準備階段。


    其後，中期移動平均線和長期移動平均線扭轉，在④進入第四階段，正是狹長帶的顏色改變的時間點。由上而下依序為長期均線、中期均線、短期均線，三條線都呈左上右下走勢，因此這裡是基本的進場時機，也是賣出的記號。


    在這裡進場後，只要第四階段仍持續，就不需要煩惱。


    # 圖表7-3 由上漲行情切換成下跌行情時的局面


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_202_0.png)'
  merge: -1
  img_proc: true
- pgno: 203
  md: '即使期間偶有小幅反彈，只要續抱即可。


    圖表7-4是第二個關鍵點。進場建立賣出部位後，價格順利持續下跌如④。在某個時間點，價格開始上漲進入狹長帶，從進場到這個時間點，才是第一個需要猶豫的情況。


    在下跌帶持續當中，價格線進入狹長帶，就開始要注意了。持續一段時間後，短期移動平均線也進入狹長帶中，在⑤進入第五階段。雖然這樣的走勢令人猶豫，但整體還算是能繼續按兵不動的局面。持續這樣的狀況，短期移動平均線又向下穿過狹長帶，在④''回到第四階段，持續下跌行情。這是在第四～五階段間反彈賣壓的典型線型，也就是「階段


    # 圖表7-4 下跌行情是否生變？①


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_203_0.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '4→5→4的反彈賣壓」模式。


    行情回到第四階段後，只要第四階段還持續，就不需要彷徨。與其說「不需要」，不如說在第一和第四階段這樣走勢穩定的時期「不可以」彷徨。


    下一個會令人感到彷徨的局面，是圖表7-5的局面，這也是圖表7-2的線圖中第三個關鍵點。


    目前為止都是像④一樣維持持續下跌的第四階段，但價格越來越接近狹長帶。在接近狹長帶的過程中，投資人要按兵不動，直到短期移動平均線進入狹長帶中，在⑤進入第五階段。此時和第二個關鍵點一樣要先觀望，接下來在④''回


    # 圖表7-5 下跌行情是否生變？②


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_204_0.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: '到第四階段，也屬於「階段4→5→4的反彈賣壓」模式。由於期待會再次下跌，所以暫且繼續忍耐，但在⑤''又再次進入第五階段，就再也不是應該忍耐的局面，必須進行結算交割。請在確認進入第五階段後結算交割。


    之後大盤在⑥進入第六階段，從這裡開始應該會進一步上漲，等中期均線向上穿過長期均線，進入第一階段，即宣告上漲行情啟動。但實際上，大盤又從這裡開始反轉向下。


    從結論來說，這個時間點並未啟動上漲行情，不過這都是事後諸葛。因此，當行情變化走勢為④⑤④''⑤''時，原則上就是結算交割的標記。


    總而言之，重點是在有行情時根據基本原則買賣，讀者無須想得太複雜。當然，不論再怎麼熟悉這種操作手法，也可能碰上行情轉瞬即逝、無法獲利的時候。但只要耐心等待，一定會出現大行情，像是第一階段漲個不停，第四階段跌入深淵的局面。只要掌握大行情，整體來說一定能獲利。


    在前述的例子中，我使用移動平均線大循環分析來說明，如果搭配本書中說明的大循環MACD使用，還能運用更高段的買賣技巧提早布局。


    請把本書放在手邊參考，厲行練習1000擊吧。只要練習1000次，你一定也能成為勝利組投資人的一員！'
