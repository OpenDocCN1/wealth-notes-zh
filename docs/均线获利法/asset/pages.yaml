- pgno: 25
  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_25_0.png)


    # SECTION 1-3


    # 聰明使用3條移動平均線，就能確實掌握趨勢大行情！


    如同前言所述，本書要介紹的是簡單明瞭，且大多數人都容易上手的「移動平均線大循環分析」，以尋找買賣時的優勢。這也是我多年來研究與實踐的手法，可說是大多數技術指標的基礎「移動平均線」的終極運用分析手法。


    如同前文所說明，移動平均線有各種活用方法。兩條移動平均線形成的黃金交叉、死亡交叉也是其中一種，然而缺點是一旦大盤進入盤整，容易發生誤判。移動平均線大循環分析則使用三條移動平均線，減少誤入陷阱的可能。


    移動平均線大循環分析的最大優點，是可以確實掌握住大行情（大走勢）。


    另一個優點則是它極為簡單，任何人都可以輕鬆上手。例如，用移動平均線大循環分析判斷買賣哪一方有優勢時，也很簡單明瞭，如下所示。


    # 優勢在買方的狀態


