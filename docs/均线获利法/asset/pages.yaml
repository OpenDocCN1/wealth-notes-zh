  md: "![](img/c2a1852eac9e3a4fa58101e0eaa30197_116_0.png)\n\n# 重點整理\n\n+   1. 移動平均線大循環分析的優點，在於可清晰看出優勢所在。這種方法既可套用在觀察日線、週線的長期投資，也可運用在使用分時走勢圖的短線投資上。\
    \ \n2. 買方優勢的位置，是移動平均線的排列順序，由上而下依序為短期均線、中期均線、長期均線，且三條都呈左下右上的走勢。 \n3. 賣方優勢的位置，是移動平均線的排列順序，由上而下依序為長期均線、中期均線、短期均線，且三條都呈左上右下的走勢。\
    \ \n4. 移動平均線大循環分析的基本概念：市場行情一般由第一階段依序發展到第六階段，但有時也會反向發展，稱為「逆向」。 \n5. 階段逆向是大盤進入反轉點、反彈點或盤整局面，且不會持續太久。因此進入逆向時，要及早為回到順向時好好布局。\
    \ \n6. 六個階段的循環，由三個黃金交叉和三個死亡交叉形"
  merge: -1
  img_proc: true
- pgno: 117
  md: '成，重要的是市場人士的獲利變化。


    7. 移動平均線大循環分析將價格變動分成穩定上漲期、穩定下跌期與其他（過渡期）。原則上，投資人只需在穩定上漲期和穩定下跌期出手布局即可。


    8. 提早布局指的是：在建立部位的第一階段或第四階段，於較早的時間點建立相同數量的部位。


    9. 試水溫指的是：投入預定交易量三分之一到五分之一左右的小量布局。


    10. 突破盤整期的動向經常是後續趨勢的起點，對投資人來說是大好的機會。


    11. 判斷走勢持續與否時，移動平均線的間隔是重要的判斷基準。


    12. 中期均線和長期均線的間隔稱為「狄長帶」，分成上漲局面的「上漲帶」與下跌局面的「下跌帶」。'
