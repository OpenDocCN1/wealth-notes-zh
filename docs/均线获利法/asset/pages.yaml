- pgno: 144
  md: '# 第5日：1200日圓


    最新的5日移動平均為1120日圓。


    也就是說，計算SMA時，最新的移動平均值會增加還是減少，並不是看最新價格高於或低於移動平均，而是看被去除的價格和最新價格孰高孰低來決定。


    這和市場上投資人的感覺不太一樣。一般來說，最近的行情走勢應該比幾天前的價格更為重要。這種計算上的缺點，也可想成是移動平均線出現騙線的原因之一。


    舉例來說，買進信號的黃金交叉出現時，當然可能是因為最新價格很高，導致移動平均線向上發展，形成黃金交叉；也有可能最新價格低，但被排除的價格比最新價格更低，所以移動平均線才向上，出現黃金交叉。而且，被排除的價格越低，向上的力道就越強烈。如果看到這樣的走勢就判斷行情強勁，怎麼看都不合理。


    SMA還有其它的問題。假設要比較100日SMA和最新價格，以市場來說，昨天的價格波動對最新價格的影響力最強，而100日以前的價格和昨天價格相比，對最新價格的影響力應該是微乎其微。


    話雖如此，但SMA只是單純算出100日的平均價格，所以100日前的價格和昨天的價格，都以相同的權重影響最新價格。為了解決SMA先天不良的問題，才有了EMA問世。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_145_0.png)


    # SECTION 5-4


    # EMA 與 SMA 大比拚


    # （三）


    比較一下5日EMA和5日SMA的計算公式，我想更能了解EMA和SMA的差異。


    5日SMA =（到昨日為止的4日平均×4＋今日價格） ÷ 5


    5日EMA =（昨日的EMA×（5−1）＋今日價格×2） ÷（5＋1）


    SMA是簡單算術平均，是將包含今日價格在內的5日價格合計，然後除以5日。


    EMA則是把今日價格乘以2，加重今日價格的比例（圖表5-3），除以「5+1」是因為今日價格變成2倍。此外，首日的計算和SMA相同，第2日起就使用以上公式。


    如此一來，價格占移動平均值的比重即如圖表5-4所示，越近的價格占比越高。因此EMA和SMA相比，前者對於價格波動的追隨性更佳，除了觸頂、打底的信號更早出現外，同時線條也更為平滑。'
  merge: -1
  img_proc: true
