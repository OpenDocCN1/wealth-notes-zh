  md: '# 趨勢預測—哥教你均線獲利法


    1萬貨幣×0.9=9000日圓


    根據上述結果，求出「一次交易可將損失控制在10萬日圓以內的部位」。結果如下：


    1頭寸單位=10萬日圓÷9000日圓=11.11……


    表示一次交易的部位（=1頭寸單位）最多可以達11萬貨幣單位。在美元兌日圓交易的情況下，等於1頭寸單位為11萬美元。


    如果是其他貨幣組合，如歐元兌日圓、英鎊兌日圓等，因為每種貨幣的ATR不同，所以1頭寸單位的部位也不一樣。


    運用這個方法，就能在價格波動不過度異常的情況下，將一次交易承受的風險，控制在過去一個月的平均值之內。'
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_180_0.png)


    # SECTION 6-3


    # 如何分散風險？相關度高的標的，不可一次買太多！


    事實上，儘管海龜根據前述的頭寸單位計算方式進場買賣，但最後承擔的風險有時也可能高達 10 個頭寸單位。假設 1 個頭寸單位的最高風險為 1 %，10 個頭寸單位表示承擔
    10 % 的風險。


    有人覺得這樣的風險太高，也可能有人覺得這種程度的風險沒什麼大不了，感受因人而異。但重要的是，就資金管理的角度來看，決定一次買賣的合宜交易量，導入頭寸單位概念的同時，也必須考慮「合宜的合計交易量」。


    有些人買賣 1 個頭寸單位後，就什麼也不做，不過一般來說，建立部位後，如果發現新機會，應該都會想要增加部位。


    前述以頭寸單位概念管理資金的做法，並不是要禁止投資人投入更多頭寸單位。重要的是明確地表示，並確實掌握最佳交易量。


    具體來說，分散投資標的時，合宜的最大交易量如下：


    +   ① 同一標的最多 4 個頭寸單位。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '② 高度相關的標的，最多 6 個頭寸單位。


    ③ 相關程度低的標的，最多 10 個頭寸單位。


    ④ 買進部位和賣出部位，合計最多 12 個頭寸單位。


    以下依序說明。


    # ① 同一標的最多 4 個頭寸單位


    假設已經建立美元兌日圓的 1 個多頭頭寸單位。如果在那之後又有機會，大家應該都會想增加部位。海龜要增加部位時，將上限制定為：同一標的最多持有 4 個頭寸單位。


    不管投資人多麼有把握，市場行情還是有可能反其道而行。正因為有這種不確定性，所以持有同一標的部位時，必須遵守原則：持有量不能超過一定的數量。


    # ② 高度相關的標的，最多 6 個頭寸單位


    高度相關表示複數的不同標的，有幾乎相同的價格波動方向。換句話說，如果所持標的彼此高度相關，就算同時持有好幾個，也不具有分散效果（也就是抑制整體風險的效果）。因此，像澳幣兌日圓與紐幣兌日圓等高度相關的標的，如果已經持有
    4 個頭寸單位的澳幣兌日圓，那麼紐幣兌日圓最多只能持有 2 個頭寸單位。'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# ③ 相關程度低的標的，最多10個頭寸單位


    相關關係低，表示複數的不同標的具有分散的價格波動。例如A上漲，B則可能會下跌，所以增加相關程度低的持有標的數量，可以期待達到分散效果。在這種情況下，就算增加頭寸單位，仍可以抑制整體的風險。


    # ④ 買進部位和賣出部位合計最多12個頭寸單位


    舉例來說，股票投資即使標的不同，買進部位和賣出部位多少都存在著避險關係。因此，即使增加頭寸單位，應該也可以抑制整體風險。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_183_0.png)


    # SECTION 6-4


    # 正確的停損線，應該設在足以判斷未來走勢是否會持續的位置上


    風險管理的重點在於停損。所謂停損，是當行情走勢和自己的預測相反時，到了一定程度就出場，以避免損失金額超出事先決定的最大損失金額。


    為什麼必須設停損線？這是為了補強面臨虧損時的人類心理弱點。


    有經驗的投資人或多或少都有這種經驗。當出現未實現損失時，人們常常會抱持一種毫無根據的期待：「繼續持有並等下去，總有一天會回本。」明明沒有任何根據，但就是不想虧損，所以擅自認定「總有一天會回本」。


    可是大部份的情形下，這樣做不但不能回本，甚至還每況愈下，越虧越多。


    總而言之，人很難靠自己的意志力執行停損，所以必須事先決定好「到何種程度時就要停損」，一旦到了自己設定的條件時，就執行機械性停損。因此，從風險管理的角度來說，設定停損線極為重要。


    具體來說，停損線該如何設定呢？最大的問題在於「要在哪個水準停損」。'
  merge: -1
  img_proc: true
- pgno: 184
  md: '設定停損線時有兩個原則：


    原則一：如果只是暫時下跌，原預測走勢仍持續時，就要忍耐，不要停損。


    原則二：如果原預測走勢已結束，就要立刻出場。


    說起來簡單，但上述兩個原則其實大相逕庭，這也是困難所在。


    若從原則一的角度來看，必須把停損價差盡量設高一點，但從原則二的角度來說，為了避免累積的未實現獲利減


    # 圖表6-2 如果走勢轉換，盡早停損就是鐵則


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_184_0.png)'
  merge: -1
  img_proc: true
- pgno: 185
  md: '少，並及早實現獲利，則必須把停損價差盡量設低一點。

    總之，正確的停損線應該設在「足以判斷未來走勢會持續，或是會轉換的位置」上（圖表6-2）。'
