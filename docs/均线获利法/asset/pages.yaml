  md: "![](img/c2a1852eac9e3a4fa58101e0eaa30197_108_0.png)\n\n# SECTION 3-15\n\n#\
    \ 別再賺5%就出場，讓我教你大行情怎麼看？\n\n上一節提到：判斷走勢持續與否時，移動平均線的間隔是重要的判斷基準。\n\n為了掌握大行情的走勢發展，更要重視中期均線和長期均線的間隔。我們將這塊間隔區域著色後，稱為「狹長帶」。左下右上的上漲局面中形成的狹長帶，稱為「上漲帶」，而左上右下的下跌局面中形成的狹長帶，則稱為「下跌帶」（圖表3-21）。\n\
    \n由上漲帶切換至下跌帶時稱為「陰轉」，由下跌帶切換至上漲帶時則稱為「陽轉」。這兩種移動平均線切換的局面就稱為「狹長帶扭轉」。 \n\n狹長帶可以告訴我們大盤行情走勢。陽轉表示大盤行情切換成上漲走勢，陰轉則是切換至下跌走勢。\n\
    \n狹長帶可以告訴我們什麼資訊呢？我歸納為以下六項。\n\n# ①了解大盤的行情\n\n價位線沿著狹長帶移動時，表示市場和行情走勢一致，"
