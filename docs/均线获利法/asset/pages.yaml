- pgno: 189
  md: '![](img/c2a1852eac9e3a4fa58101e0eaa30197_189_0.png)


    # 重點整理


    +   1. 投資買賣時最重要的是，並非如何巧妙地掌握買賣時間點，而是不要破產。若想避免投資導致破產，首要之務是確實落實資金管理。\n2. 資金管理的要訣在於掌握承擔風險的幅度，避免破產，並在此範圍內追求最大獲利。\n3.
    在海龜投資法則中，某標的一次的合宜交易量，稱為「頭寸單位」(Unit)。\n4. 真實波動幅度均值（ATR）是把幾日的數值平均後，算出的一日最大價格波動，運用ATR可計算出一次買賣時適當的頭寸單位金額。\n5.
    人難以靠自己的意志力執行停損，所以必須事先決定好「到何種程度時要停損」，一旦到了設定的條件，就執行機械性停損。\n6. 正確的停損線，應該設在足以判斷未來走勢持續或轉換的位置上。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '7. 市場價格會因投資人的盤算不同，導致寫下行情的過程中出現價格偏離，稱為「雜訊」。如果是在行情持續中的雜訊，價格波動不會超出一定幅度。


    8. 當價格朝反方向波動，且波動幅度超過雜訊的範圍時，行情就可能轉換。因此投資人可透過觀察價格波動是否超過雜訊範圍，決定是否停損。


    9. 停損時要以哪種方法為優先，應該整體考量標的本身的價格波動習慣，以及操作方式的期間長短。'
