  md: '獲利。然而應用篇的技巧難度較高，不是那麼容易做得到。既然如此，我認為也不需要在這些時期勉強買賣。


    或許有人會認為一年只有幾次機會，就不需要全年盯著線圖看，但其實並非如此。不持續追蹤線圖，當時機來臨時便無法即時掌握，所以應該經常核對線圖。不過完全不買賣，只是盯著線圖，老實說也很難用心去看。


    因此我建議：即使在其他時期，也要練習買賣。因為是練習，只要不賺不賠就好，等到大獲利的機會來臨，再確實讓利益落袋為安即可。這種張弛有度的操作，可說是晉身勝利組投資人的秘訣。'
