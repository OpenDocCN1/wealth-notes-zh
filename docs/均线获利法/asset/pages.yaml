  md: '而出現突破狹長帶的波動時，則表示行情走勢即將轉換。


    # ②了解行情走勢方向與力道強弱


    狹長帶持平或沒有間隔時，就表示沒有行情。如果狹長帶越來越寬，而且有一定的傾斜時，傾斜方向便是行情走勢


    # 圖表3-21 只要觀察「狹長帶」即可了解大盤行情走勢


    原油兌美元（日線）


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '的方向。


    # ③了解行情穩定性


    寬帶表示將持續目前的行情，而狹長帶變窄時，則可判斷行情走勢趨弱，目前行情即將告終。


    # ④壓力帶、支撐帶的功能


    狹長帶夠寬時，可發揮壓力帶或支撐帶的功能。相反地，狹窄的狹長帶既無法成為壓力帶，也無法成為支撐帶。此時價位線和短期均線容易來回穿越狹長帶，表示大盤陷入盤整。


    整體長期來看，只有兩成的狹長帶會是明顯寬帶，其餘八成都 assignment 狹窄的狹長帶。因此，寬帶局面極其可貴。最重要的是抱著「該賺的時候就不要客氣」的態度，在有行情的局面和難以判斷的局面，張弛有度地買賣。


    # ⑤狹長帶有陽轉和陰轉


    如前所述，狹長帶會扭轉。當狹長帶扭轉時，就是大盤行情走勢轉換的信號。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# ⑥狹長帶可分出四個局面，各有買賣戰略


    狹長帶可分出「買進時期」、「賣出時期」、「盤整期」、「大轉換」四個局面。


    首先上漲帶是買進時期。出現明顯的上漲帶時，就算價格略有回檔，也是逢低買進的絕佳時間點。


    相反地，下跌帶則是賣出時期。出現明顯的下跌帶時，價格暫時反彈就適合趁機脫手。


    盤整期是狹長帶變窄的時候。這種局面容易被騙，所以最好不要出手買賣（但應該留意突破盤整的時間點）。


    至於大轉換則是上漲帶和下跌帶切換的時間點，此時重要的是整理自己的心情。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# SECTION 3-16


    # 沒有完美的線圖操作，因此你得……


    ![](img/c2a1852eac9e3a4fa58101e0eaa30197_112_0.png)


    看到這裡，我想讀者應該已經了解，用移動平均線大循環分析做為技術指標，不但容易理解，也方便做出明確的判斷。


    不過天底下沒有盡善盡美的事，移動平均線大循環分析也有缺點。


    第一個缺點是不適用於價格波動小的投資標的。移動平均線大循環分析的好處，在於出現一定程度的大漲或大跌行情時，投資人幾乎可以完整掌握。相反地，當價格幾乎不波動時，則沒有甜頭可嘗。


    因此使用移動平均線大循環分析時，要盡可能選擇波動明顯、容易出現大行情的標的，這一點很重要。以股票來說，成長中公司的股票就優於大型的國際藍籌股；以外匯來說，比起美元兌日圓的匯率，更適合用在英鎊兌日圓的匯率操作上。


    既然移動平均線大循環分析有上述特徵，使用時應該注意以下幾點。


    我將階段變化與容易獲利的時期，整理成圖表3-22，讀'
