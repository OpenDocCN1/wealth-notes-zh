    # SECTION 5-2


    # EMA 與 SMA 大比拚

    (一)


    接著要說明上一節提到的 EMA。


    第一章曾提及日本常用的移動平均線是 SMA，例如：


    5 日均線指的是算出 5 日的價格平均值，隔天則是減掉第 1 日的價格，再加上第 6 日的價格後，重新計算出 5 日的價格平均值。每日皆以此方法算出最近 5
    日的平均值，並把數值用線連起來，形成一條移動平均線。這是最簡單的移動平均線畫法。


    然而，只有日本如此頻繁地使用 SMA，海外大多使用 EMA。


    EMA 和 SMA 的差別在哪裡呢？實際用線圖比較即可了解（圖表5-2），例如：比較相同天數的 SMA 和 EMA，會發現 EMA 的頂部和底部信號，出現得比
    SMA 早，而且線條波動比 SMA 平緩，是 EMA 的重要關鍵。


    首先，線條波動平緩的特徴間接表示騙線較少。再加上信號出現的時間點早，確保獲利的機會也相對增加，這一點也可從線圖了解。與 EMA 相比，SMA 的頂部、底部信號出現得較晚，因此想要掌握在頂部附近的賣出時間點，或是在'
  merge: -1
