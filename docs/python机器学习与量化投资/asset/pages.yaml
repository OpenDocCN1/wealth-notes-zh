  md: '# Python 机器学习与量化投资


    本论题，目前也是深度学习、神经网络方法而沿此关注的领域之一


    TensorFlow 的出现，让使用神经网络模型的门槛越来越低。对于该方面来说，大家采用著名介绍的架构模式，只需要使用 TensorFlow 模块库以及各
    种 TensorFlow 第三方软件定制中已经收录的算法模型即可。


    目前人工智能大热，各类算法模型层出不穷，即使是谷歌公司也无法 在 TensorFlow 中收录所有的算法模型。不过，常用的、经典的算法模型 都会收录在 TensorFlow
    中。


    对于初学者而言，sklearn 当中的经典机器学习算法模型是非常基础 的，也是一些常用的、较为经典的算法模型。


    目前常用的机器学习算法模型如下。


    +   - PP（卡方检验）

    - RA（回归算法）

    - IA（支持算法）

    - RA（正则化算法）

    - DT（决策树）

    - NB（贝叶斯算法）

    - CA（聚类分析）

    - DRA（降维算法）

    - ARLA（关联算法）

    - SVM（支持向量机）

    - EA（集成算法）

    - ANN（神经网络算法）

    - DP（深度学习）


    而我们已经学习了最简单的线性回归算法、逻辑回归算法，以及完 整的决策树算法。'
