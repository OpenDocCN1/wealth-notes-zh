  md: 'Reducing and Clustering Using Hierarchies, 简称 BIRCH 方法, 如图 12.2 所示。


    ![](img/93734a9b810ff3e8778504a648b013dc_224_0.png)


    图12.2 BIRCH 方法


    BIRCH 方法运行速度很快，只需要单次扫描数据就能进行聚类分析，适合于数据量大、类别数也比较多的情况。


    BIRCH 方法通过聚类特征树（Clustering Feature Tree, 简称 CF 树）来快速进行聚类分析。CF 树结构类似于平衡 B+ 树，每个节点由若干个聚类特征（Clustering
    Feature, 简称 CF）组成。


    BIRCH 方法把所有的数据建成 CF 树，对应的结果就是若干个 CF 节点，每个节点里的样本点就是一个聚类的簇。BIRCH 方法的主要过程就是建立 CF
    树的过程。


