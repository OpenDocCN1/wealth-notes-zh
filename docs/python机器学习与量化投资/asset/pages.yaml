    # 2.6 线性回归算法


    有了合适的训练数据和测试数据，人工智能变得很简单，只需要两个函数，就可完成相关的程序。


    线性回归算法是最简单的机器学习算法之一，如图 2.2 所示。


    百度百科对应的“线性回归算法”词条是：


    线性回归是利用数理统计中的回归分析，来确定两种或两种以上变量间互相依赖的定量关系的--种统计分析方法，应用十分广泛，其表达形式为 y = w x + e，e
    为误差，以从均值为 0 的正态分布。


    线性回归算法是 freezing 简、很经典、很古老的人工智能算法，其背后的理论非常复杂，在此，我们采用前面所说的宾馆模式，不予深入讨论，有兴趣的读者请自行参阅相关资料。


