  md: '# 第 5 章


    # 模型验证优化


    通常关于模型验证优化的内容都放在较后的章节来讲，但经验主义，对于初学者而言，模型的估计（比如谷歌 TensorFlow 深度学习平台中的可视化分析模块 TensorBoard）越早学习，效果越好


    在 sklearn 块件当中，内含了多项模型验证优化（Optimizers Model Validation）函数，常用的有如下几种。


    +   - cross_val_score: 交叉验证评估划分。

    - cross_val_predict: 对每一个输入数据点生成交叉验证评估器。

    - permutation_test_score: 评估针对交叉验证测试划分的置换。

    - learning_curve: 学习曲线。

    - validation_curve: 验证曲线


    # 5.1 交叉验证评估器


    交叉验证评估器，函数名称是 cross_val_predict，可以对每一组输入数据点生成交叉验证评估器。


    对于机器学习而言，通常需要 train_data（训练数据）和 test_data（测'
  merge: -1
  img_proc: true
- pgno: 110
  md: '试验集）为两个部分。


    测试数据（test_data）的验证结果叫做伪误验证值（validation_error）。


    对于任何一种算法或名模型，若只用一次或少数几次的数据进行训练、测试，作为评估算法、模型好坏的标准，那么这件的结果存在很大的偶然性。


    在实验当中，必须多次、随机划分训练数据和测试数据，分别计了多次的伪误验证值。这样，根据多次的伪误验证值才可以较为客观地评估算法、模型的好坏。


    交叉验证是在数据量有限的情况下，采用的一种稳健评估手段，它可以自动、随机地按不同比例对数据进行划分、测试。


    sklearn 中的交叉验证模块主要的功能是：


    ```

    model_selection.cross_val_predict

    ```


    函数调用接口如下：


    ```

    cross_val_predict(estimator, X, y=None, groups=None, cv=None, n_jobs=1, verbose=0,
    fit_params=None, pre_dispatch=''2*n_jobs'', method=''predict'')

    ```


    调用的参数如下


    +   - estimator：表示不同模型的变量。

    - X：训练数据集中。

    - y：训练数据集所对应的正确结果数据

    - cv：代表的是不同的交叉验证方法。


    需要注意的是参数cv比较复杂，既可以是用户定义的验证函数名称，也可以是int类型数值。


    当cv是int数值时，默认使用验证函数StratifiedKFold，或者KFold交叉验证函数，如果指定了类别标签，则使用的交叉验证函数是StratifiedKFold。'
  merge: -1
  img_proc: true
