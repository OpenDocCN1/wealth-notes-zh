  md: '# 第 6 章


    # 决策树


    在通常情况下，决策树在介绍完机器学习的各种模型后进行讲解。


    本书把决策树放在前面讲解，是因为目前机器学习、神经网络平台已经非常成熟，各种经典的 AI 统计模型都有专门的函数。对于顺序而言，采用决策树模型比起简单的线性模型，只是顺序名称和调用参数的不同。


    此外，决策树的模型已经涉及深度学习、神经网络，尽早接触决策树对于日后学习神经网络也有所帮助。决策树的模型也是少数可以可视化分析机器学习的模型，易于初学者理解。


    为了结合量化交易的实际情况，本书内容的设计做了以下优化。


