    # 图 16.2 多层感知器


    若每个神经元的激活函数都是线性函数，那么，任意层数的 MLP 都可被简化成一个等价的单层感知器。


    事实上，MLP 模型不仅可以使用任何形式的激活函数，比如阶梯函数或逻辑S形函数（Logistic Sigmoid Function），但为了使反向传播算法进行有效学习，激活函数必须限制为可微函数。由于具有良好的可微性，很多S形函数，尤其是双曲正切函数（Hyperbolic
    Tangent）及逻辑S形函数常被用作激活函数。


    常被 MLP 模型用来学习的反向传播算法，在模式识别的实践中深受关注并在计算神经学及并行分布式处理领域中，持续成为该研究的热点。多层感知器已被证明是一中通用的函数近似方法，可以被用于拟合贝尔的函数或早决策分类问题。


