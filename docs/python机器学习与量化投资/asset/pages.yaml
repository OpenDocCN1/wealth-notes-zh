    # 1. 分类


    分类是指识别某个对象属于哪个类别，属于监督学习的功能，以常见的应用场景包括以及邮件检测和图像识别等。


    目前 scikit-learn 已经实现的分类算法包括: SVM(支持向量机)、Nearest Neighbors（最近邻）、逻辑回归、Random Forest（随机森林）、决策树，以及多层感知器、MLP
    神经网络等


    # 2. 回归


    回归是指预测与对象相关的连续值响应。以常见的应用场景包括股票的反应和房地产价格等。


    目前 scikit-learn 已经实现的回归算法包括: SVR(支持向量回归)、Ridge Regression（岭回归）、Lasso 回归、Elastic
    Net（弹性网络）、LARS（最小角'
