  md: '朵（Iris flower data set）或是鸢尾花卉数据集（Fisher''s Iris data set），是一类多重变量分析的数据集 它最初来源于加·安德森从加拿大加的纳半岛上的鸢尾花朵中捉取的地界分类数据，后由罗纳德·费舍尔作为判别分析的一个例子，并运用于统计学中
    该数据集包含了 50 个样本，归属于鸢尾花下的三个亚种，分别是山鸢尾、变色鸢尾和杂吉尼三鸢尾 共 4 个特征用于样本的变量分析，即花萼和花瓣的长度和宽度 基于这
    4 个特征的集合，我们发展了线性判别分析以确定其分类


    我们的目的还是通过案例，对这 3 种不同种类的鸢尾植物的数据，采用专业的 数据分析手段和人工智 能方法，让同学们学会分类植物的种类


    由于 scikit-learn 出现很早，当时还没有 pandas 等下一代数据分析软件，所以 sklearn 为了保证运行速度，还这使用 NumPy 模块的
    ndarray 多维数组作为数据源和内部的数据格式


    近几年出现的 TensorFlow、MXNet 等神经网络、深度学习平台，为了提高效率，在数据接口部分也广泛使用 NumPy 模块的 ndarray 多维数组格式


    不过 NumPy 模块的 ndarray 多维数组是面向性能的数据格式，在应用方面不常规易用


    目前，随着 pandas 等新一代数据分析软件的普及和推广，以及一级开发人员对效率的考量，越来越多的项目开始使用 pandas 的 DataFrame 数据框架作为数据保存格式，从而方便调试代码，交换数据


    本节的各个案例都基于 pandas 优先的模式，所以广泛使用 DataFrame 数据框架作为程序中间数据，只要在必须使用 NumPy 模块的 ndarray
    多维数组格式时，才转换为对应的格式


    有关数据转换的细节，我们会在实例当中具体说明。本程采用 pandas 对比 sklearn 人工智能，以便初学者把握数据内部的结构和细节


    传统的 sklearn 人工智能文档，大部分还这采用 NumPy 数组格式，而 NumPy 是为了追求极限性能设计的模块库， 很多方法函数非常复杂，不宜'
