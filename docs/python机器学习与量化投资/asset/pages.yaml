  md: '# 第 7 章


    # 随机森林算法和极端随机树算法


    决策树算法还有许多衍生版本，常见的有 GBDT 算法、RF 算法等。


    在 sklearn 比特中的 Ensemble（集成）算法的子模块当中，收录了以下几种决策树衍生算法的应用函数。


    +   - GradientBoostingRegressor: GBDT 回归算法。

    - GradientBoostingClassifier: GBDT 分类算法。

    - RandomForestRegressor: 随机森林回归算法。

    - RandomForestClassifier: 随机森林分类算法。

    - ExtraTreesRegressor: 极端随机树回归算法。

    - ExtraTreesClassifier: 极端随机树分类算法。


    本章介绍的随机森林算法、极端随机树算法，也是决策树算法的一种衍生版本。


    随机森林（Random Forest）算法，简称 RF 算法，是比较流行、规模大的机器学习算法之一，也是一种机器学习集成算法。该算法的核心思路是利用多棵树对样本进行训练并预测，RF
    算法提 RAC 了决策树的偏差性，如'
  merge: -1
  img_proc: true
- pgno: 147
  md: '图 7.1 所示：


    ![](img/93734a9b810ff3e8778504a648b013dc_147_0.png)


    # 图7.1 RF随机森林算法


    随机森林这个术语是 1995 年由贝尔实验室的 Tin Kam Ho 所提出的随机决策森林（Random Decision Forests）理论发展而来的。后来，Leo
    Breiman 和 Adele Cutler 推出随机森林的算法，并注册了 Random Forests 商标。


    随机森林算法是一个包含多个决策树的算法，并且其输出的分类是由个别树的输出分类的众数而定的，这个算法结合了 Leo Breimans 的 “Bootstrap
    Aggregating” 思想和 Tin Kam Ho 的 “Random Subspace Method” 来建造决策树的集合


    随机森林算法是 DT（决策树）算法的一种衍生算法，遵循了 Bagging 算法的原则，引入随机性来得到次优分割点，而并不是选择最佳分割点来创造决策树。


    它针对每个被估计树所创造的树与其它类型有所不同，仍能够以其独立的方式推广预测，并且可以更好地估计潜在的真实输出。


    如图 7.2 所示，是一个随机森林算法实例，在基因达尔文，在考关了大多数乳腺癌与父相关的基因后，通过随机森林算法计算出发病风险。


    在许多领域，随机森林算法都是很好的工程决策方案，不过的是，随机森林算法背后的理论至今仍然是一个谜，目前依然没有系统、科学的'
