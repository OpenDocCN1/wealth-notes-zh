  md: '# 第 8 章


    # 机器学习算法模式


    由图 8.1 可以看出机器学习的三大要素：数据、算法模型、计算


    +   • 数据：在大数据时代，各行各业基本上都充斥数据，缺乏的只是从数据中提取出有价值的参改。


    +   • 计算：在前都有同样的模式，学习训练期间采用 fit 训练模式，实凡采用 predict 预测函数，只是不同模型的 API 接口有所之别。


    +   • 算法模型：这个通常经验和数据调试，根据不同的项目挑选不同的模型


    ![](img/93734a9b810ff3e8778504a648b013dc_172_0.png)


    图 8.1 机器学习三大要素


    另外据统计，目前常用的机器学习算法模型约有 30 多种，加上衍生分支，大约有 300 多种（这么多深度学习算法模型，每个模型背后都涉及大量的、众多的理论知识，比如数学、统计、物理，这两个学科）。'
