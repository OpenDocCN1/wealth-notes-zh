    # 5.2 交叉验证评分


    在前面的案例当中，我们使用的是我们定义的函数来对模型进行准确度评分，这是因为使用自定义评估函数更加灵活。


    其实在 sklearn 模块当中，也有关于交叉验证的评估函数，函数名依次：


    ```

    cross_validation.cross_val_score

    ```


    函数调用接口如下：


