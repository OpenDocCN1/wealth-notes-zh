    - LinearSVC，线性支持分类算法。

    - LinearSVR，线性支持回归算法。

    - NuSVC，Nu 支持向量算法。

    - SVR，SVR（TEpsilon）支持向量算法。

    - NuSVR，Nu 支持 SVR 向量算法。

    - OneClassSVM，无监督异常点检测算法。

    - ll_min_c，辅助函数，返回边界系数。


    其中与本个案例相关的两个函数如下。


    +   - LinearSVR，线性向量回归算法。

    - LinearSVC，线性向量分类算法。


