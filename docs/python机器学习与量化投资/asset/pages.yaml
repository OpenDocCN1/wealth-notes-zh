    随机森林回归方法 RandomForestRegressor 的接口定义如下：


    ```

    RandomForestRegressor(n_estimators=10, criterion=''mae'', max_depth=None, min_samples_split=2,
    min_samples_leaf=1, min_weight_fraction_leaf=0.0, max_features=''auto'', max_leaf_nodes=None,
    min_impurity_decrease=0.0, min_impurity_split=None, bootstrap=True, oob_score=False,
    n_jobs=1, random_state=None, verbose=0, warm_start=False)

    ```


    随机森林分类方法 RandomForestClassifier 的接口定义如下：


    ```

    RandomForestClassifier(n_estimators=10, criterion=''gini'', max_depth=None, min_samples_split=2,
    min_samples_leaf=1, min_weight_fraction_leaf=0.0, max_features=''auto'', max_leaf_nodes=None,
    min_impurity_decrease=0.0, min_impurity_split=None, bootstrap=True, oob_score=False,
    n_jobs=1, random_state=None, verbose=0, warm_start=False, class_weight=None)

    ```


    以上两个的接口，多定义<|start|>不多，常用的参数如下


    +   - n_estimators: 树扩展的迭代次数，也是弱分类器的个数，默认为 100


    +   - max_depth: 决策树的最大深度，默认值是 3。


    +   - max_features: 每个决策树使用的最大特征数。


    在以上参数中，max_features 有多个选项。


    +   - Auto/None: 简单地选取所有特征，每棵树都可以利用。在这种情况下。'
