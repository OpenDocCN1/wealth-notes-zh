    # 6.4 GBDT算法


    GBDT 算法英文全称是 Gradient Boosting Decision Tree，简称 GBDT 算法。


    GBDT 算法是一个集成模型，也是一个集成学习算法。简单来说，GBDT 算法是指用许多贪义决策树算法组成了一个更强大的学习算法。


    GBDT 算法由多棵决策树组成，将所有树的结论累加起来作为最终结果 它在提出之初和 SVM 一起被认为泛化能力较强的算法 近几年更因为被用于搜索排序的机器学习模型而引起大家关注，如图
    6.10 所示。


    GBDT 算法是一个应用很广泛的算法，可以用来做分类和回归，在很多的数据上都有不错的效果。GBDT 这个算法还有一些其他的名子，比如 MART（Multiple
    Additive Regression Tree）、GBRT（Gradient Boosting Regression Tree）、Tree Net 等。'
