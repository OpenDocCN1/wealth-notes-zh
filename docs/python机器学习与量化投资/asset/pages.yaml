    pandas_datareader 模块在作为独立模块以前，是 pandas 系统中子模块 io 的组成部分，原来的导入代码如下：


    ```

    import pandas.io.data as web

    ```


    同样，为了兼容和延续习惯，我们在这里还是用 web 作为模块的缩写，也有很多使用 pdr 作为 pandas_datareader 模块的缩写，这也是将 pandas、data、reader
    三个单词首字母的缩式，也是一种常用的缩写习惯。


