  md: "of Deduction)，而用归纳决策树。\n\n+   - Bayesians（贝叶斯学派）：注重统计学和概率推理，获取发生的可能性\n  来进行统计推理，常用方法为朴素贝叶斯或马尔可夫。\n\
    - Connectionists（联结学派）：使用概率回归加权神经元来动态地识别和归类模式，关注物理学和神经科学，基于研习大脑的逆向工程，常用方法为人工神经网络。\n\
    - Evolutionary（进化学派）：在进化学和进化生物学的基地上，设计算法模式，计分并分析其中的最优解，常用方法是进化算法。\n- Analogizer（类推学派）：根据约束条件来优化函数，关注心理学和数学优化，以此来推断结果，常用方法为SVM（支持向量机）。\n\
    \n# 8.3 经典机器学习算法\n\n经典机器学习算法不是通过对算法模型的内在逻辑和归纳关系，而是从机器学习算法模型在学术工程领域的应用角度，或许知名度来对算法模型进行命名\n\
