  md: '# 第10章


    # 实例算法


    实例算法，英文全称是：Instance-based Algorithms，简称 IA.


    实例算法只需要先选取一批样本数据，然后根据某些相似性，把新数据与样本数据进行比较，以找出相似的匹配。


    实例算法是极简单的机器学习算法之一，它不像其他算法，需要在样本空间建立一般性的模式公式，而是它通过输入的数据进行分类或回归学习，并从失败最终结果


    因此，实例算法也被称为“靠家通过吃的学习”或“基于记忆的学习”。如图10.1所示。


    ![](img/93734a9b810ff3e8778504a648b013dc_198_0.png)'
  merge: -1
  img_proc: true
- pgno: 199
  md: '实例方法处理成的模型对原始数据样本实例有很强的依赖性。实例方法在做预测决策时，一般是在某个范围内给出相应的预测结果。


    实例方法的缺点是处理成本需求较高。无论从 CPU 运行速度，还是算法存储软件需求都很高，方法占用的空间和运行的速度几乎取决于实例样本的人数。


    常见的实例方法如下，


    +   - KNN：K近邻方法，英文全称是 k-Nearest Neighbor。

    - LVQ：矢量学习方法，英文全称是 Learning Vector Quantization

    - SOM：自组织映射方法，英文全称是 Self-Organizing Map

    - LWL：局部加权学习方法，英文全称是 Locally Weighted Learning。


    # K最近邻算法


    K最近邻算法如图 10.2 所示。


    ![](img/93734a9b810ff3e8778504a648b013dc_199_0.png)


    所谓 K 最近邻，就是 k 个最近的邻居的思想，说的是任何样本都可以用它最近的 k 个邻居来代表。


    KNN 算法可用于分类问题和回归问题，该方法更常用于分类问题相对于回归问题。KNN 方法分出的一类是多数平均值；对于分类问题，'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'KNN 方法的由来及分类(?)：


    KNN 方法通过周围 k 个案例中的大多数情况划分新的案例。根据一个距离函数，新案例会被分配到它的 k 个近邻中较为接近的类别中。


    KNN 方法是一个相对比较简单的机器学习算法，在理论上也比较成熟。KNN 方法的核心思路是：如果一个样本在特征空间中的 k 个最相似（即特征空间中最邻近）的样本中的大多数属于某一个类别，则该样本也属于这个类别。


    KNN 方法的分类是根据一个距离函数进行判别的。这些距离函数可以是欧式距离、曼哈顿距离、闵式距离或齐次汉明距离。前三个距离函数用于连续变量，第四个函数（汉明函数）则被用于分类变量。


    需要注意的是，距离或紧密度的概念在高维度（或者大量的输入变量）中可能会失效，因为输入变量的数量对于算法性能有着很大的负面影响，这就是所谓的维度灾难。


    KNN 方法的缺点是需要大量的距离计算，计算成本很高。数据要进行预处理，对异常数据要去除和清洗，此外还要对数据进行标准化处理。


    在 sklearn 模块库当中，K 最近邻算法相关的机器学习算法函数位于 neighbors 模块库，主要如下。


    +   - KNeighborsClassifier，K 最近邻算法。\n- NearestNeighbors，最近邻算法。\n- KNeighborsRegressor，K
    最近邻回归算法。\n- NearestCentroid，最近质心算法。\n- Locality Sensitive Hashing Forest，局部敏感哈希森林算法。


    # 案例 10-1：第一次惊喜——KNN 算法


    前面我们说过，机器学习常见的算法模型大部分都是分类算法，幸这'
