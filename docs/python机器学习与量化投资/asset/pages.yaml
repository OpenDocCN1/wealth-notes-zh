- pgno: 243
  md: '# 第 14 章


    # 集成算法


    集成算法，也称为集成些合算法，英文全称是 Ensemble Algorithms，简称 EA 算法。


    EA 算法功能非常强大，也非常流行，是当前机器学习四大主流思路之一，也是行业的研发热点。


    EA 算法通过使用 些相对较弱的学习模型，彼此独立地对同样的样本进行训练，然后把结果整合起来进行整体预测，以提高系统的最终效果。EA 算法由于采用了投票平均的方法组合多个分类器，可以减少单个分类器的误差，从而提高算法整体的准确度。


    EA 算法消除了个别的偏差，减少了预测的方差：多个模型集成后的预测结果比单一模型的预测结果更稳定。


    在另外，这被称为多样化：多个模型的组合波动总是远小于单个模型的波动。


    EA 算法不容易产生过拟合：如果单个模型会产生过拟合，那么将每个模型的预测结果分别地组合（取均值、加权平均、逻辑回归），就可以轻易解决过拟合问题。


    EA 算法通常分为两大类型：'
  merge: -1
  img_proc: true
