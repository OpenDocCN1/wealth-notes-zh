- pgno: 298
  md: '# 附录 B


    # 量化分析常用指标


    量化交易属于新兴产业，TA-Lib 企业软件包收录的商数虽然多，但大部分是传统技术指标，对于量化交易、量化分析领域有很多人缺乏 本书上要介绍量化领域新出现的一些技术指标。


    量化分析本质上是一种风险和收益的综合平衡分析，其经、三大指标是夏普比率、詹森指数和特雷诺指数。


    +   - 夏普比率（Sharpe Ratio），也称夏普指数，缩写为 SR 简介地识，它指的是收益率与风险的比例。夏普比率代表投资者每多承担一分风险，可以多得到几分收益。若为正值，代表企业报酬率的高过波动风险；若为负值，代表企业报酬率大过风险...
    通常，这个比例越高，投资组合越佳。


    +   - 詹森指数（Jensen），又称为阿尔法值，是衡量基金 manager 收益大小的一个指标 这个指标综合考虑了基金收益与风险因素，比单纯的考虑基金收益大小更科学。


    +   - 特雷诺指数（Treynor Ratio），缩写是 TR，是每单位风险承担的风险溢价。特雷诺指数越大，单位风险溢价越高，绩效越好；相反，特雷诺指数越小，单位风险溢价越低，绩效越差'
  merge: -1
  img_proc: true
- pgno: 299
  md: '在量化分析，其他常用的指标如下


    +   - 总名收益（Total Returns），能够反映收益情况

    - 基准收益（Benchmark Returns），用于比较收益情况

    - 基准收益率（Benchmark Yield），也是贴现折现率，投资项目最低标准

    的收益水平，即选择指定的投资机会或投资方案必须达到的期望收益

    率。

    - 阿尔法（Alpha），是指超越预期收益的超额收益率。阿尔法来源于

    CAPM 模型。传统阿尔法常是指在基金经理处理了 β 部位的头寸后，

    通过衍生品冲销 β 部位的风险，从而获得真正的阿尔法收益。

    - 按照 CAPM 模型的设定，β 系数是用来反映一项资产系统风险的指标，

    用来衡量一种证券或一个投资组合相对总体市场的波动性（Volatility）的 一种风险评估工具。

    - 索提诺比率（Sortino Ratio），缩写为 SR，与夏普比率类似，所不同的是它只分了波动的好坏，以此在计算波动率时它所采用的不是标准差，而是下行标准差。这其中的隐含条件是投资组合的上升（正回报率）符合投资人的需求，不应计入风险因素。和夏普比率类似，这个比率越高，说明基金在相同单位下行风险能够获得更合适的超额回报率。索提诺比率可以作为夏普比率在衍生品冲销组合风险性基金时的一种修正方式。

    - 信息比率（Information Ratio），也称为领估值比率（Appraisal Ratio），缩写为 IR。信息比率是从主动管理的角度描述风险调整后的收益，它不同于夏普比率从绝对收益和总风险角度来描述。信息比率越大，说明所获得的超额收益越大，相对收益相对优于大盘的程度越高。计算公式为：将基金收益率减去同类基金或大盘收益率（即下的位为超额回报率），再除以该超额回报率的标准差。

    - 算法波动率（Algorithm Volatility），是指算法在实际执行期间内所表现出的波动率。'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Python 机器学习与量化投资


    +   - 基准波动率（Benchmark Volatility），基准指数的波动范围，用来反映基准的风险性，波动越大代表基准风险越高。

    - 下行风险（Downside Risk），是指由于市场环境变化，未来价格走势可能低于分析师或投资者所预期的目标价位。下行风险是投资者可能出现的最坏的情况，也是投资者可能遭受实际的损失。

    - 最大回撤率（Drawdown），是指该基金/产品历史上一段时间的最大跌幅。最大回撤率用来描述买入产品后可能出现的最大亏损的情况。最大回撤是一个更直观的风险指标，对于对冲基金和量化策略交易来说，该指标比波动率更重要。'
  merge: -1
  img_proc: true
