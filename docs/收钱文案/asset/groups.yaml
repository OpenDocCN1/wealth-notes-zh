    当然，在我的粉丝数据库里，还有很多人想参加“神笔文案”课程，但是他们的经济实力不允许，怎么办？


    经过深思熟虑，我在神笔文案课程的基础上，专门设计了这本“傻瓜式的”《收钱文案》小书。（对，就是你手上拿的这本！）


    在《收钱文案》这本神奇的小书中，我揭露了如何在数分钟内，就能写出一条收钱短文案的秘密！


    它不像有的书，你随便翻阅一下，就束之高阁。


    它是一本你需要经常反复使用的工具书！


