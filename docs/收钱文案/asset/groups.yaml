    不知道我们给你寄的资料，是否解答了你的所有疑问？需要我提供更多的帮助吗？


    顾客咨询对我们来说很重要，因为这往往是我们与新顾客的第一次接触。这就是为什么我们要提出上述问题。


    回答这些问题只需要一两分钟，但是它们对我们来说很重要，可以帮助我们更好地为前来咨询的潜在客户服务——包括你。


    请你现在填写好问卷，把它回寄给我们，可以吗？非常感谢！


    真诚的，

    XXX 营销经理


    P.S. 我们非常乐意给你提供更多的信息。你只要把你咨询的问题写在回复卡上，我们会立刻为你做出解答。


