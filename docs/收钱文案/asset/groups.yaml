    # 我是如何学会撰写销售文案的？


    在我刚开始写作的时候，很痛苦，不知道如何下笔。我需要帮助，我需要借助某些东西，这样才不至于让我感觉面对的是一张白纸。


    因此，我从书里，课程中，其它文案中，看各种各样的要点、步骤，来提高自己。先后向世界50多位顶级的大师学习直接营销与文案写作之道。


    ![](img/efc1ed52ddcf7f171d2c1d771c1ae460_11_0.png)


    我一遍又一遍地读伟大的克劳德•霍普金斯的著作。研究罗伯特•科利尔、约翰•卡尔普斯、大卫•奥格威、尤金•斯瓦茨、维克多•斯瓦布、盖瑞•亥尔波特、鲍勃•斯通、泰


