    下面是来自 IBM 公司的一封跟进信。在一封信中，你可以把第一句话当做标题，用在信的顶部，就像这封信一样。


    这封跟进信非常友好。措辞的选择（如，“你可以帮我们一个忙，回答问卷中的几个问题吗？”“不知道我们给你寄的资料，是否解答了你的所有疑问？需要我提供更多的帮助吗。”），让这封信看起来是
    IBM 公司在试图帮助读者，而不是要读者给自己做什么事。


