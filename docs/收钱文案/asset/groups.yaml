    ## 收钱文案


    这里使用的销售诉求是独特和奉承。让读者感觉自己与众不同——我们谁不想被认为是“独一无二”的呢？


    短段落和短句子让这封信可读性更强。


    注意，这封销售信是在销售提议——试驾玛莎拉蒂，并免费得到一瓶香槟的机会——而不是汽车本身。


    亲爱的 XXX：


    非你莫属。这句话有点老套？我曾经也这么认为，直到我试图找到你。


    现在，我知道“非你莫属”的真正含义了。


    寻找你的名字和地址的过程，就像淘金一样。


    问题在于什么？在于，我怎么才能找到那些愿意试驾（在他们自己的家里）新“玛莎拉蒂总裁”豪车的人呢？


    我怎么找到那些具有独特的鉴赏力的人，对我们提供的免费法国香槟，以及对独一无二的豪车，无与伦比的试驾体验说“是”的人呢？


    解决方案？好吧，我希望我要找的那个人就是你。


    你是那种会买玛莎拉蒂的人吗？


    那些选择玛莎拉蒂豪华轿车的人，并不是非得买最贵车的人。因为玛莎拉蒂不是最贵的车。比如，它只有劳斯莱斯价格的大约一半。


    那些会选择玛莎拉蒂豪华轿车的人，也不是那种寻找身份地位象征的人。


    为什么要花高昂的费用去买大街上你开车过去，1000个人中只有一个人认识的车，去彰显你的身份呢？


    不是这样的。玛莎拉蒂的车主，是那些不会只考虑金钱，地位，甚至外观的人，他们是真正欣赏好车的人。他们是真正懂得好车品质的人。


    就像鉴赏家品尝到的上等香槟酒一样，玛莎拉蒂提供的乐趣，老实说，是大多数人都无法享受得到的。


    我需要再说具体点吗？


    从你踏进总裁豪车那一刻，你就能感受到纯手工制作的真皮座椅，和石南之根镶板的味道，你知道你之前开过的车和它相比，简直是天壤之别。


    当你看到引擎盖下面时，你就知道它是拥有 50 多年的赛车经验，才能制作出来的东西。


    但是，当你试驾总裁豪车时……啊，这时你才明白拥有一辆玛莎拉蒂的感觉。


    感觉它发动时的沉稳。上路后，更能完美诠释优雅，奢华，运动激情，带你体验无与伦比的驾乘感受（和你之前驾驶过的其它豪车完全不同）。


    如果不是这么宽敞的内部空间，你会感觉恍如在驾驶一辆跑车。


    但我无法靠语言解释清楚玛莎拉蒂的好，就像我无法解释清楚龙虾美味或做爱的乐趣一样。


    你必须亲自体验。


    这就是为什么我写信邀请你，我相信之前肯定没有一个汽车公司这么做过。


    如果你不能来找玛莎拉蒂，玛莎拉蒂去找你。


    你只要拨打（010）XXX-XXXX，或填写附件中的卡片，我们约一个方便的时间。


    到时候，我们的代表就会开着一辆全新的总裁豪华轿车到你家门口。他将递给你一瓶上好的法国香槟，对你的试驾表示感谢。


    然后，他会坐在乘客座椅上，邀请你去试驾。


    这个过程不会有强行推销。这辆车要么靠自己把它卖出去，要么就不卖。


    但是，我们的代表不仅能回答你可能存在的任何问题，他还会和你一起分享你的快乐。因为他“懂”你的感受。


    你想试驾多久就试驾多久。当然，你没有任何购买义务。


    至少在一段时间内，你就能感受到玛莎拉蒂的迷人之处。


    所以，你只要在卡片上写上你的电话号码，我们会在近期联系你，约一个特别合适的时间——周末或晚上都可以。


    或者，如果你喜欢，可以拨打（010）XXX-XX 进行预约。


    顺便说一下，这瓶法国香槟特别棒，即使你不喜欢车，你也值得一品。


    但是，我知道你会很喜欢这辆车。


    如果你喜欢汽车，你就一定会喜欢玛莎拉蒂。它和你一样，是独一无二的。


    真诚的，

    XXX, XXX 总裁


    P.S. 你已经有一辆豪华轿车了？不要让它成为阻止你接受我们提议的障碍。即使你现在还不想再买另一辆车，也可以联系我们，试驾玛莎拉蒂总裁豪车。


