    \n# 44、如何做+不正确+正确方法+呼吁行动\n\n如何做好某件事？大多数人所做的并不正确，现在告诉你正确的方法。\n\n- ① 如何制定营销计划\n\
    \  如何制定营销计划，销售你的服务……不用花光你所有的钱。大多数销售服务的人都是“即兴发挥”，结果可想而知——他们的营销断断续续……效果也不好。\n\n\
    \  李炳池将告诉你如何制定一个营销计划，以尽可能低的成本带来最大的效果。微信回复 666，告诉你。\n\n- ② 制作“如何类”产品\n  如何制作“如何类”产品（电子书或报告）？大多数如何类产品都令人沮丧，因为它们没有为读者提供真正有帮助的东西。\n\
    \n  别让这种事发生在你身上。学习如何创建一个真正有用的如何类产品吧。\n\n  在这里，李炳池老师会告诉你如何制作电子书或报告，让读者从你的报告或书中，学到真正有用的东西。详情加李炳池老师微信\
    \ 531111743，或扫描下面二维码。\n\n- ③ 销售信\n  如何撰写你的销售信，让人们买你的产品？如果你的销售信不能立即吸引顾客，你的交易就会失败。\n\
    \n  李炳池老师会告诉你如何写一封吸引人的销售信，让你的顾客迫不及待的想要买你的产品。详情加李炳池老师微信 531111743，或扫描下面二维码。\n\n\
    - ④ 微信销售\n  如何通过微信提高你的工作效率，让每一个顾客都觉得你是在为他着想。人们有微信，但没有有效地使用它们。\n\n  现在学习把微信变成你最好的营销工具。你会在这里读到一些你从未见过的东西，并惊人地提高你的营销效率。微信回复\
    \ 666，告诉你。\n\n- ⑤ 两性课程\n  如何说才能让男人愿意听？女人经常说，和男人谈话就像对着一堵墙说话。\n\n  现在两性关系专家 XXX，像往常一样，就女性应该如何表达自己的观点，以及男性应该如何听取女性的意见，提供了详细的建议。\n\
    \n  对于那些想要更有效地与男人沟通的女人，以及那些真正关心女人的男人来说，这是一堂完美的课。详情扫码学习！\n"
  mdcn: "\n# 31、新产品+数量限制+呼吁行动+后果\n\n这个公式很简单，通常使用在现场广告牌上，或者搭配图片使用。新产品主要指人们耳熟能详的产品，不需要过多的塑造价值，只是告诉顾客，错过这个时间，就很难再买到，制造紧迫性，促使购买。\n\
    \n- ① 鳃鱼\n  > “本店新进鳃鱼，数量不多，欲购从速，晚了买不到！”\n\n- ② 车厘子\n  本店新进 10 箱好吃美国车厘子，数量不多了，赶快下手，晚了买不到！\n\
    \n- ③ 鳄鱼皮鞋\n  本店新到 5 双鳄鱼肚皮皮鞋，柔软耐穿，档次高，可惜只有 41、42 码，数量不多，赶快下手，晚了买不到！\n\n### 请列出关键词或句式\n\
    \n# 32、好产品+客户案例+提问+呼吁行动\n\n首先提出产品或项目，但不告诉读者到底是什么，引起他们的好奇。\n\n然后插入客户案例，证明此产品或项目的真实性，从而刺激读者的欲望，读者内心就想了解到底是什么。\n\
    \n紧接着，你提出他想要知道产品或项目的肯定问句（让他自己回答“是的，我想知道”），并要求他咨询你，获得结果。\n\n- ① 创业机会\n  这是 2020\
    \ 年难得的投资小，回报高，年赚百万的在家创业好项目。有人在 3 个月赚了一百多万！你想知道他是如何做到的吗？想复制他的模式请回复 888，我邀你进群揭秘！\n\
    \n- ② 单反相机\n  这是录制抖音视频质感非常高的相机设备。北京的 XX 用了说，他一个人就可以轻松录制，效果跟专业摄影几乎一样。你想了解这是什么牌子的最新设备吗？请微信回复\
    \ 666，马上告诉你！\n\n- ③ 神笔文案课\n  还没有见过这么落地的文案培训课。广州的张总参加后，使用其中的方法撰写的销售文案，一周就卖掉了 1000\
    \ 多件货。你想知道这是什么样的文案培训课吗？请回复 888，马上告诉你！\n\n### 请列出关键词或句式\n\n# 33、提问+个人案例+呼吁行动\n\n\
    用“你是否想知道”引起注意，然后用一句话提出你所做到的成就，并提示读者，想了解原因或方法，只有咨询你。\n\n- ① 文案课\n  你是否想知道，我是如何通过一篇销售信赚到\
    \ 20 万的？想学习方法，回复 666，免费告诉你！\n\n- ② XX 项目\n  你是否想知道，我是如何每天只工作 4 小时，而赚的钱却比过去每天工作\
    \ 12 小时赚的还多？想知道原因，请回复 666，马上告诉你！\n\n- ③ 投资理财\n  你是否想知道，我是如何将 200 万的房子置换成 600 万的？想学习方法，请私信我，马上告诉你！\n\
    \n# 34、坏结果+原因+解决方案+呼吁行动\n\n指出大部分产品或项目存在的缺陷，并告诉读者是什么原因导致这种问题产生的。然后你提出解决方案，并要求顾客采取你想要的回应。\n\
    \n- ① 神笔文案课\n  大部分人发出的文案效果并不好，原因很简单：你说你的产品好，你提供礼物，免费样品，送赚钱机会……但是作为一个不了解你的人，他们会相信你吗？\n\
    \n  其实，你换种思路来说，效果就会大大不一样。你从客户的欲望出发，描述你的产品或项目能带给他想要的美好结果，但是你不告诉他具体是什么产品或项目。\n\n\
    \  这样就能吊起顾客的胃口，越得不到的东西越想得到，他就想知道到底是什么！他想知道答案只有联系你。\n\n  你明白了吗？想知道如何才能写出这种让人欲罢不能的文案吗？微信\
    \ XXX，回复 666，告诉你。\n\n- ② 染发剂\n  大部分的染发剂都有化学不良成份，原因很简单：因为想要快速上色，就必须产生化学反应，长期使用这种产品确实会给身体带来损害。\n\
    \n  其实，市面上没有 100% 不含化学成分的染发剂，即使商家说纯植物，那也要经过化学变化。所以，为了尽量让头发伤害降到最低，你要懂得如何辨别哪种染发品是最好的。\n\
    \n  想知道如何选择和辨别好坏染发剂吗？请私信我（XXXX），告诉你。\n\n- ③ 痘痘肌\n  大部分祛痘产品都含有激素成分，原因很简单：因为很多痘痘肌患者在选择祛痘产品的时候，盲目的选用了立竿见影的速效产品。\n\
    \n  这些产品祛痘效果神速，短期内能够将痘痘一扫而光。\n\n  可是最后却发现：痘痘不但没有消掉，反而还越来越严重，最终导致了激素依赖性皮炎！\n\n\
    \  其实，痘痘肌不可怕，只要了解自己的皮肤性质，找到正确的方法，就能恢复健康！\n\n  如何知道自己的皮肤性质，去哪找到正确的方法呢？添加张加佳老师微信：77257126，她会告诉你。\n\
    \n  PS. 张加佳老师已经帮助 1093 位痘痘肌的人恢复了健康，让他们的皮肤已经变得水嫩、紧致、透亮！\n\n### 请列出关键词或句式\n\n# 35、客户案例+产品推荐+呼吁行动\n\
    \n通过客户使用产品获得的效果，做见证分享，证明产品的可靠性，让顾客相信你的产品的品质，引导顾客咨询或做出购买决定。\n\n- ① XX 净水机\n  >\
    \ “15 年来，我家换过不下 7 个牌子的净水器。唯一这款 XX 净水器功能强大，过滤干净，水烧开后不会有任何水垢，滤芯半年一换，现在使用 3 年了依旧过滤干净。”\n\
    \n  XX 净水机，让全家都能喝上健康的饮用水！咨询电话：XXXXXX，网店：XXXXXX\n\n- ② 菲洛芝减脂方案\n  我叫刘安，今年 49 岁，152\
    \ 斤，高血压、高血糖，吃了一年降压药、半年降血糖药。\n\n  每天早上起床头晕沉沉的，中午必睡午觉，否则全身无力、头痛。\n\n  有一天，遇到之前很胖（160\
    \ 斤）的一个朋友，我惊奇地发现他身材怎么这么好了！\n\n  他告诉我他减肥了，减掉了 30 斤。这个体重维持一年也没反弹。同时他 20 年的糖尿病和高血压全都好了，现在再也不用吃降压药和降糖药。\n\
    \n  看到那么神奇的效果，我立即向他请教方法。\n\n  经过两个月的努力，我减了 15 斤，就再也没有吃降压药了。而且每天很精神，再也不觉得头晕，头痛了。\n\
    \n  如果有类似的朋友，想用最科学和健康的方式，改善你的肥胖、高血压、高血糖。可以加老师的微信（m572669614），一定会给你一个神奇的效果。\n\n\
    \  注：该减脂方案已获得国家专利，并由中国平安保险公司 500 万承保产品质量责任险。\n\n- ③ 神笔文案课\n  > “国内搞赚钱文案培训的老师，不下百位。但真正让零基础的小白也能写出赚钱文案的老师，只有李炳池老师！\n\
    \n  李老师的神笔文案课程，让三里人家和劲家庄的广告文案成交率直线上升了 3 倍之多！想靠文案赚钱，找李炳池老师就够了。”——心然 （三里人家、劲家庄幕后操盘手）\n\
    \n  《神笔文案》密训课，只招收 19 名学员，详情加微信 zixun8 咨询。\n\n# 36、经过验证+好处+呼吁行动\n\n用已经证实过的产品，让顾客放心，然后描述这款产品能给顾客的好处，最后呼吁顾客免费或低价体验试用。\n\
    \n- ① 关注公号阅读销售信\n  一家护肤品公司，为了推出一款经上百客户提前验证过的新产品，专门聘请我给她们写了一封销售信。\n\n  你可以从中学到很多杀手级文案撰写方法！今天晚上\
    \ 8 点，我会把这封信发布在李炳池公号：LBC333，你可以学习使用。\n\n  PS. 此信随时可能会删除，请及时阅读。\n\n- ② XX 台蘑酱\n\
    \  你看到的 XX 台蘑酱，是五台山仅有的特色产品，在五台山几乎每个家庭都有吃。它由野生蘑菇珍稀食材制作而成，吃过的人都说好吃！\n\n  它能健脾开胃，提高免疫力，营养价值极高。无论你吃面条、馒头，还是米饭，都可以作为你方便食用的美味小菜。\n\
    \n  你可以自用，也可作为礼物送朋友。每罐 13 元，一提 9 罐（整提买包邮）！如果你还没吃过，建议你一定要买一罐尝尝！\n\n  PS. 不好吃退你钱！\n\
    \n- ③ XX 膏药\n  你看到的 XX 膏药，已经上市 3 年了，经过 5000 多个客户使用反馈，有的关节炎消失了，有的不再胀痛，有的颈肩痛没在复发……\n\
    \n  如果你有颈肩、腰腿痛的症状，建议你试试 XX 膏药，每盒 XX 元。如果你不放心，可以微信 XXX，免费领取两贴（运费自付），效果会说话。\n\n\
    # 37、回馈+福利/特惠+呼吁行动\n\n针对老客户或代理商回馈，提供优惠政策或奖励，限制在一定时间内索取。\n\n- ① 回馈老客户\n  回馈老客户！7\
    \ 月 1 日买 XX，7 折优惠，仅限当日！申请购买赶快微信我。\n\n- ② 销售课程\n  老客户转介绍模式！让老客户额外增加收入的秘密方法，有的人\
    \ 3 个月就额外进账 30 万。今晚 8 点开讲，进群听课回复 8。\n\n- ③ 回馈代理商\n  代理商领福利！业绩达到 10 万的代理商，请微信 XX\
    \ 领取 LV 手包一个。申请日期：7 月 1-3 日，过期作废。\n\n# 38、好处标题+计划投资+暂停行为+解决方案+老师介绍+呼吁行动\n\n用标题吸引注意，然后指出人们正准备投资的行为，需要立即停止，引起读者的兴趣。紧接着，提出解决方案，刺激顾客的欲望，最后给出证明，并呼吁行动。\n\
    \n- ① 微课设计\n  微课成功设计的 6 个步骤。如果你在制作免费或付费微课上投入了资金……或者想要投入一些资金……请停下来！\n\n  直到你得到李炳池的课程设计步骤，以便设计出吸引人的、有价值的微课。\n\
    \n  李炳池老师是课程设计实战家，他知道怎样更好地设计微课，才能让人们注意到你的微课，并主动推荐给其他人。\n\n  今晚 8:00，他会在微信群与你分享这个重要信息。加微信\
    \ XXX，红包 1 元，邀请你入群学习。\n\n- ② 项目投资\n  选项目的 6 个建议。不管你是免费加盟，还是付费加盟某项目，准备投入资金购买产品或者服务……请停下来！\n\
    \n  直到你得到 XXX 的建议，以找到适合你的项目。\n\n  XXX 是多个项目操盘手，他知道选择什么样的项目才有发展潜力，并能赚到大钱。\n\n \
    \ 今晚 8:00，他会在微信群与你分享这个重要信息。加微信 XXX，邀请你入群学习。\n\n- ③ 短视频营销\n  短视频营销的 6 个步骤。如果你在制作视频和营销上投入了资金……或者想要投入一些资金……请停下来！\n\
    \n  直到你得到 XXX 的短视频营销指导，以便让你的视频更火爆。\n\n  XXX 是短视频营销专家，他知道怎样设计和制作短视频，并能让顾客主动观看和传播。\n\
    \n  今晚 8:00，他会在微信群与你分享这个重要信息。加微信 XXX，红包 9 元，邀你入群学习。\n\n### 请列出关键词或句式\n\n# 39、提问+采访+坏结果+好结果+呼吁行动\n\
    \n提出顾客想要解决的问题，通过人物专访去寻找答案，并用坏结果和好结果的对比，加强顾客对好处的期待，最终给出顾客解决方案。\n\n- ① 演讲报告\n  哪些演讲内容，才能吸引你的受众目不转睛？李炳池采访了演说家\
    \ XXX，关于如何找到适合每个受众的“关注点”。\n\n  而太多的演讲者试图把他们所知道的一切，都塞进他们的演讲中……最终疏远了他们的受众。\n\n \
    \ 你不会这样。在这份报告里，你可以确切地了解到，你需要做些什么，才能吸引到你的受众，并成功的举办演讲。详情点击链接查看，或者加微信 XXX。\n\n- ②\
    \ 家庭轻医美课\n  哪些护肤品，才能让皮肤变得越来越好？张加佳采访了国内外 30 多位医美专家，关于如何选择护肤品，如何让皮肤更健康。\n\n  而太多的护肤品商家试图把一款产品卖给所有人……最终让很多人的皮肤越来越差。\n\
    \n  你不会这样。在这里，你可以确切地了解到，怎样看成分表，如何选择适合自己皮肤的护肤品，让自己的皮肤像婴儿肌一样。关注张加佳微信：77257126，她会教给你！\n\
    \n- ③ 创业项目\n  哪些项目，才是你值得投资的好项目？XXX 采访了 20 位投资专家，关于如何选择有发展潜力的好项目，他们都给出了中肯的建议。\n\
    \n  而太多的创业者经不住诱惑，看到高回报，投资小就去做……最终以失败收场。\n\n  你不应该再这样。在这里，你可以确切地了解到，如何选择适合自己的项目，并且能够稳步向前发展，越做越强大。\n\
    \n  关注 XXX 微信：xxxxxx，让他告诉你！\n\n### 请列出关键词或句式\n\n# 40、阻碍+解决方案+问题+呼吁行动\n\n阻止人们实现自己目标的原因，然后给出解决方案，再次加强问题的严重性，最后呼吁行动。\n\
