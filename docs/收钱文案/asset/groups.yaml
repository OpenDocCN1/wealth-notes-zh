    ## 96、坏信息+好消息+零风险保证+呼吁行动


    长时间不跟你互动的人，他很难成为你的客户。所以，定期给你的微信好友发送信息，问他们是否愿意接收你写的文章，某些技巧内容，或其它信息。那些没有回应你的人，你就可以删除他们了。


    这封信实现了两个目的：（a）更新微信好友，（b）同时要求客户购买。这是简单有效的直邮案例。


    请注意个人化的使用：“亲爱的XXX（人名）”称呼。


    亲爱的 XXX：


