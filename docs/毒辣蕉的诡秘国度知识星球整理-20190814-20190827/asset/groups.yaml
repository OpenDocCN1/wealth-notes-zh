    **蕉爺**：好，我理解你的意思了，或者先来举一个有目共睹的例子吧，20年前港商回大陆，你只能看到他们的鼻尖，因为这些人自大到没谁天，10年前同样是这批人回来，虽然他们还是有点优越感，但起码你已经能看清楚他的全脸了，而且他们私底下也会开始聊：别看大陆过去这样子，他们现在甚至比我们过得都还要好！
    为什么我要举这样一个例子呢？其实就是“三十年河东，三十年河西”的道理，例子中举到的港商不正就是如今的一线城市吗？你说你是来自一个“四线城市”，这不正正就是你如今的体验吗？我没有想鸡汤你的意思，因为在互联网发展的今天，其实很多领域早已经全国一盘棋，无城市之分了（当然教育，医疗等重点民生的还是以城市的三六九等分）！
    中国的一线城市几乎都已经走到集体患病的状态了，一方面城市容量无法再大批量的吸人，另外能留在这里的人又进入了“消费降级”的状态，很多需求都已经不再那么的旺盛了，这个很好理解，过去有几年我很多朋友都是一年换一台手机的，特别是新款推出以后甚至一年换两台，但如今呢？一台手机能用个两到三年是个基本共识，用旧款也没啥的，这就是个最典型的“消费降级”，但三四线城市却不一样，他们还处于旺盛的“消费升级”之下，什么改善型，二胎等旺盛的需求一抓一大把，连巨头型的互联网公司都在遇到瓶颈时讲究“用户下沉”，说白了就是要紧紧抓住那帮三四线的小镇青年！

