    再说，分析一个行业或者生意究竟是否有大发展，要处于它处于的行业阶段来判断！ 一般一个行业或者生意无非就四个阶段：萌芽期，发展期，成熟期，衰退期。 假如你所在的行业是“萌芽期”的，就是出现了很多创意，但还不知道怎么使用与驾驭，缺少一个稳定的需求，比如VR这个东西萌芽了好多年了，每年都说我是“VR元年”，但都没元起起来，像这种阶段的行业如果你过多的去谈职...


