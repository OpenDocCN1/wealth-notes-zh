    GeboX.xx：我，十八岁的愿望是进入电视媒介行业，如愿。二十岁时希望能有朝一日做制片人，二十四岁那年成为某市级电视台某栏目的执行制片人，然，满足。感觉一路走来顺风顺水的光辉时刻还没爽多久，二十四岁那年下半年给了我一个生离死别的戏码，至亲突然离世，家庭瞬间乱套，股份被做手脚，转行，被踩被害等一样不落，没有最惨只有更惨...谈恋爱前一脚踩上性无能后一脚踩上同性恋，闪婚闪离后还狗血谈了一个同姓名还有相同胎记的没下文恋情...命运突然对我开启了玄学的大门...到了现在我在没修行没吃素没系统学习过什么什么宗教的情况下，突然看得见灵？魂？看得见人头上的黑气紫气粉红？气。梦里提前三个月预知了身边两个人的S期。看得见结界墙...总之，世界真奇妙，我想写故事。


