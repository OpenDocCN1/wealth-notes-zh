    我上一讲介绍过，179 本网站上的 AA 级和 A 级分级读物，加上 92 本培生的分级读物一共是 271 本，再加上绘本，一共也没有多少钱。但是你如果能用好这几百本书，真的能在几年的时间里面，帮助孩子实现一个非常好的英语启蒙。


    这四五百本书，足够用了。假设每本书里平均有 30 个单词，那么一共的输入总量是多少？从来没有重复过的词汇，总有超过 1000 个。所以，在英语启蒙的过程中，积累
    1000 个以上的听力词汇，完全没有问题。


    # 本讲小结


    在如何利用英语读物帮孩子启蒙这件事上，上一讲我先介绍了一本书如何按照四个步骤去读。这一讲，又跟你讲了，在每周、每月和每年对这些英语读物怎么进行安排，书单上的书可以怎么组合，就能够把
    5 本读出 10 本的效果。


    第一，每周两次坚持读。


