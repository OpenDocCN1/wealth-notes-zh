    那么，如何能够把在线学习的效果最大化呢？


    首先要能把在线上课养成习惯。对于孩子的学习问题，始终要有规划。


    让孩子一周上 2-3 次外教课，不能放任自流，认为什么时候有时间再上。有多少人都是抱着这种心态报了健身房，但是报完之后就没有然后了，只有那些每周固定时间去的人坚持下来了。为什么？因为习惯的养成需要大脑和肌肉产生记忆，产生自动化，才能习惯成自然。


    孩子四五岁开始接触外教课，不仅仅是要学习英语，也在同时进行幼小衔接。每周固定时间进行学习，一定比三天打鱼两天晒网来得效果好。


