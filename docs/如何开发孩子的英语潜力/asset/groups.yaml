    进行一段时间之后，可以把问题都问出来，让孩子一起回答。在孩子五六岁的时候，在给孩子讲一个故事，尤其是讲过几次的故事之后，可以鼓励孩子给爷爷奶奶或者姥姥姥爷讲讲那个故事，提供机会让孩子进行输出和展示。


