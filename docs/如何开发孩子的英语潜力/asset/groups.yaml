    # ## 5. 怎么组合使用分级书单


    你好，我是 Wendy，欢迎来到我的得到精品课《如何开发孩子的英语潜力》。


    上一讲的四步法，说的是一本书应该怎么读。这一讲，我来说说，这 450 本分级阅读和英文绘本，应该如何进行安排，能达到最好的效果。


    阅读这件事，单拼数量不是最重要的，反复读、组合读才更有效。


    我们要达到两个目的，一个就是帮孩子扩充听力词汇，另外也是提供机会让孩子进行英语表达。


    给孩子做英文启蒙，真的不需要重金购置海量原版绘本，3 年一共 450 本分级阅读加英文原版绘本就非常棒啦。


    下面就给你介绍一下我总结的三个定律，用来给孩子进行英文阅读启蒙，教你用五本书读出十本书的价值来。


    # ### 1. 每周两次坚持读


    孩子上小学前，中文英文都需要大量输入，得全盘考虑。中文书每个礼拜要读至少三次，那英文的书两次就可以了。想要持之以恒，你的工作量已经挺大了，一周 7 天 5
    天亲子阅读——坚持几年也不容易。


    中英文阅读，我建议是 3:2 的一个比例。换句话说，你不要给自己施加太大的压力，养孩子是持久战，不能先把自己的能量耗光了。


    那么基于这样一个比例，每周 2 次英文朗读怎么进行？'
  - '[PAGE 42]


    首先就是怎么挑选书的问题。我给它起了名，叫选择率——就是给孩子选书，尤其是还不能自主阅读的阶段，要贵精不贵多。一年能够把 100 本分级读物或者英文绘本真的读透，要囫吞枣地读
    300 本来得好。


    早期阅读要注重质量——我说的质量不仅仅是书的质量，还有你阅读的质量，为什么呢？


    因为对于中国的孩子来说，给孩子进行中文阅读和英文阅读，目的并不一样。给孩子读英文书，无论是分级阅读还是绘本，都有学习英语的这样一个诉求或者叫目的。孩子刚刚开始接触英文读物
    的时候，头一两个月肯定会有一些排斥，一定要记得我在前面讲过的四轮法慢慢来，即使孩子讲中文也要用英文回应。每周有 2 次朗读，一次 1 本。


    # ## 2. 好书不怕重复读


    知道了每周最低的阅读数量，然后每次读一本就算了吗？不是的，你还得让书不断复现。


    这个怎么读的定律叫做复现律，能够帮你读好每一本书，让每一本书对孩子的英语学习发挥最大的作用。


    复现，顾名思义就是读英文读物，不要怕重复。孩子接触的是另一种语言，为了能让孩子在英文环境中真的理解每本书的意思，就势必要重复出现——每本分级读物按照四轮法读完了，还可以再读几遍。'
