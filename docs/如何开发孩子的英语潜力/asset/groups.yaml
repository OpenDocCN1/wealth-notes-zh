    《麦克米伦儿童词典》Macmillan First Dictionary'
  - '[PAGE 28]


    这几本字典，你千万不要只当成字典来用，遇到不会的词才去查一查。其实它们的内容非常丰富，跟孩子一起翻着玩儿，就能创造出英语学习环境来。比如跟孩子一起用十分钟，发现三个有意思的词，彼此分享等等。借助这几本字典，孩子积累起
    3500 个阅读词汇并不困难。有了这个底子，未来再选择词典、使用词典，都很容易。请你记得，即使到了小学高年级和初中，选择带有一定趣味性、包含大量图片、解释和例句比较贴近孩子的字典，依然很重要。那种密密麻麻都是字没有图的字典，等到孩子上了大学，再用不迟。


    # **3. 分级阅读要先行**


    说完了通过图文字典学单词，我们还要通过阅读学句子。现在，很多父母都对英文绘本有一定的认识，但我要告诉你，对于英文读物，在第一年给孩子读的时候，也就是大概 4
    岁之前这个阶段，要先选择读分级阅读，不要去读英文版绘本。为什么？


    很多父母可能不知道，绘本跟分级阅读不是一种东西，作用大不同。绘本呢，叫做 Picture book，它的使用场景是妈妈给孩子讲故事，所以绘本使用的语言没有限定得很严格。换句话说，如果有孩子没听懂，妈妈可以解释，而且是用母语解释，对吗？所以绘本中会出现不少低频词汇，对于母语是英语的孩子没问题。但你的孩子，是一个外语学习者，低频词汇过多，反而是个干扰。所以我会建议孩子刚刚起步的时候，一定要选择分级阅读。'
  - '[PAGE 29]


    那分级阅读到底有什么神奇之处呢？简单地说，分级阅读是国外的专家们为培养孩子的阅读理解能力，在考虑孩子们的认知发展水平的基础上，专门编写的。为了能够从易到难让孩子逐渐提升阅读理解力，分级阅读的篇幅长短、内容难度、词汇难度和句子结构的复杂都是严格限定的。


    比如词汇，初始级别的分级阅读里出现的都是高频词，而且复现率很高。比如说我随便举个例子，你如果拿一本初始级别的分级阅读，一本薄薄的小书里面，只有不到 20 个词，第一句话写的是
    I can run，第二句话写的是 I can read，第三句话是 I can jump。这一本书里的 6 句话都是同一个句子结构，每句替换了一个单词。对于孩子来说，理解起来容易，也就很容易产生学习的成就感。


    英语读物的分级阅读起步很早，做得很细，可以给我们提供很多方便。按照年龄，我建议做以下区分：我说的年龄，是个理想的起步年龄，如果你的孩子不是从 3 岁左右开始起步，也没关系，只要按照顺序，根据你家的节奏来调整就是了。大一点的孩子，每个阶段的时间可以适当缩短。


    4 岁之前，全部使用分级阅读，阅读量大约 150 本。分级阅读读个一年左右，就可以调整一下比例了，按照大约绘本和分级阅读一半一半的比例给孩子进行英文阅读。为什么呢？因为经过一年的启蒙，通过
    150 本左右的分级读物，小朋友已经接触 2000 以上总听力词汇量了，虽然包含重复的词汇，但是孩子的初期积累已经在了。如果你给他读英文绘本，孩子能够根据图片开始猜你讲的这个意思，而不是像一开始的时候直接接触绘本，包含很多低频词汇，猜都无从猜起。'
  - '[PAGE 30]


    可能会担心，那一开始读分级阅读的时候，孩子英文不太行怎么办？但是就像我说的，分级阅读的高频词和常见词多，比如说上面写的是 I can run，你只要比划一下就可以了，对吗？孩子很容易理解。切记，不要中英文混在一起，纯英文环境最重要。


    经过一年的分级读物积累之后，第二年可以是分级读物和绘本 1 比 1，然后再过一年你就更可以给孩子读更多的英文绘本了，可以把这个比例调成分级阅读 1、英文绘本
    2 的比例了。


    分级读物上哪找呢？


    特别简单，给你两个推荐，第一个推荐，就是有一个非常著名的网站叫 Reading A to Z。


    网址：https://www.readinga-z.com


    这个网站一年的年费也很便宜，可能就三十几美金。我特地给你查了，它的 AA 和 A 级别是非常适合学龄前儿童的。这两个级别，AA 是一共有 90 本书、A 级别拥有
    89 本书，那仅仅这个网站适合 3-6 岁英语启蒙的分级阅读读本就已经出来将近 180 本了，对吧？


    另一个推荐是《培生幼儿启蒙英语：level A+level B》，里面有 92 册分级读物，还有 6 张 CD，方便你自己给孩子读之前先做个预习。这一套书是培生和长江少年儿童出版社合作的，物美价廉，一整套也就人民币
    200 块左右。'
  - '[PAGE 31]


    ![](img/edbb2d08e6e54db006a55411589f51d1_31_0.png)


    《培生幼儿启蒙英语:level A+level B》


    这 92 本再加上前面那 179 本，是 271 本分级读物，给孩子英语启蒙足够了。我特别希望你不要觉得学英语是件很奢侈的事情，其实它并不需要花那么多钱。'
  - '[PAGE 32]


    # 4. 英文绘本选经典


    刚才说的是分级读物，现在咱们说英文绘本怎么挑。很简单，越耳熟能详的经典读物越好。比如：


    +   - How Much I Love You


    +   - I Am a Bunny


    +   - Brown Bear Brown Bear What Do You See


    +   - My Dad


    +   - My Mum


    为什么要读经典绘本呢？因为这些都是在经过时间验证的，全世界的小朋友都在读，趣味性、科学性、益智性更有保障。而且，既然全世界小朋友都读，未来有机会交流的时候，你的孩子也容易跟别人有共同语言。


    所以你看，如果每年给孩子读 150 本左右的分级阅读和英文绘本，三年就有 450 本的积累。那么怎么分配呢？不管从几岁起步，三年时间，大概是 270 本分级阅读加上
    180 本的英文原版绘本。


    +   - 第一年，150 本左右的分级阅读；


    +   - 第二年，读 70 本分级阅读加 80 本英文绘本；


    +   - 第三年，读 50 本分级阅读加 100 本英文绘本。


    当然了，输入永远不嫌多，在这个基础上有精力给孩子读更多，那很好；


    如果就这 450 本，也非常不错。'
