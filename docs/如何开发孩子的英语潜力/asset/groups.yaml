    ## 发刊词 | 英语启蒙不是抢跑


    你好，我是范蕙萍，欢迎来到我的得到课程《如何开发孩子的英语潜力》。


    我在儿童英语培训行业做了将近 10 年。这些年来，我接触过成千上万的家长，其实每一年，我都会被问到各种重复度很高的问题，比如：


    - 孩子几岁开始学英语最好？

    - 我自己英语不好，能教孩子吗？

    - 一定要给孩子报英语培训班吗？

    - 什么绘本对孩子的英语学习最有用？

    - 要不要请外教？

    - 要不要上在线一对一的外教课？


    在回答这些问题之前，我先做个自我介绍。


    我叫范蕙萍，但在英语培训圈里，所有人都叫我 Wendy 老师。我在英国杜伦大学读的教育学博士，回国以后，曾经在三家业内著名英语教育机构工作。这三家公司都已经赴美上市了，可见这个市场有多大。


    这些年我一直做儿童英语教育的研究，在不同的公司，担任过课程与教学研究部总监、学术总监等等。我教孩子，也培训教孩子英语的老师。过去 2 年多的时间，我还在闲暇之余开了一个微信公众号，叫做“Wendy
    博士终身学习”，为家长朋友、老师还有行业里的小伙伴答疑解惑。


    这门课程，我想一次性把开头那些家长普遍的问题回答清楚，而且还会帮你规划一个适合中国家庭状况的儿童英语启蒙方案。只要你家里有个 12 岁以下的孩子，这门课都会对你有帮助。


    首先，我从家长特别爱问的一个问题说起，孩子学英语是越小越好吗？


    各路专家对这个问题的见解各不相同。但是，基于对认知神经科学和发展心理学的研究，心理学家已经证实，在人类发展的特定阶段，语言发展存在着敏感期，也就是发展机遇期。在敏感期内，大脑的语言功能回路，最容易发生经验依赖性的变化，产生语言能力内化，实现随时随地精确调用。


    > “总的来说，语言学习的许多方面都存在效率和年龄相反的关系——一般而言，越早接触语言，就越能学得更好。”


    关于这方面的研究，有两本重要的书，一本是《理解脑——新的学习科学的诞生》，另一本是《孩子的世界》，有空的时候爸爸妈妈可以读一读。


    ![](img/edbb2d08e6e54db006a55411589f51d1_4_0.png)


    《理解脑——新的学习科学的诞生》


    ![](img/edbb2d08e6e54db006a55411589f51d1_5_0.png)


    孩子的世界：从婴儿期到青春期（第 11 版）


    对于大部分的爸爸妈妈来说，无论你有没有让孩子在 3 岁以前接触英语，你在家都有一个重要任务，就是要帮助孩子把母语的听说做好，要不断跟孩子讲话，用描述性的语言、解释性的语言，让孩子沉浸在丰富的语言环境中，训练听力理解力和语言表达能力。


    父母说得越多，孩子的母语输入也就越多，积累的母语听力词汇越多，听力理解能力就会越好。


    另外，0-3 岁这个时期，对孩子安全感形成、生活习惯养成、规则意识建立，非常重要。所以，孩子需要爸爸妈妈大量的有效陪伴，不仅仅是和孩子进行语言上的交流和互动，还需要在家、在户外有大量的肢体活动和玩耍。对于新手父母来说，功课真不少，但你不要焦虑，完全可以根据自己的情况来实施教育。


    虽然语言发展存在着敏感期，但语言本身具有复杂性，再加上在中国这个大环境下学习外语，我综合自己多年观察，给你一个孩子英语启蒙的参考年龄：接触英语可以尽早，最好是在孩子
    6 岁之前。


    对于孩子的英语启蒙，你要记住下面四个基本认知：


    ### 1. 语言学习要先听说、后读写


    文字和语言是不同的东西，在一个语言环境里，只要不聋不哑不傻，人人都能学会语言。但是，文字对应的是读写技能，需要专门的学习才能获得，不上学，不专门教，很难掌握。孩子学外语，要听说会了再学读写。无论是两三岁开始启蒙，还是四五岁起步，哪怕孩子六七岁才开始学英语，也要遵循同样的规律和路径。


    ### 2. 语言学习要浸入式，不要翻译


    什么意思呢？就是要用英语学英语，而不是用汉语学英语。


    很多家长眼中的英语启蒙就是“苹果苹果是 apple”，这种方式其实会给孩子人为增加母语的干扰。翻译的过程，会增加大脑负荷，明明听到 apple 就能够在大脑中反馈出苹果的图像，但这么学就先反应出来了汉语的“苹果”这个词，然后第二步才反应出苹果的图像。如果每个词都是这种反应速度，孩子将来就难实现英文听说。


    正确的方式应该是浸入式的，就是用英语学习英语。直接拿着苹果或者苹果的图片，跟孩子用纯英文进行交流，你可以说 **Apple, this is an apple.**


    ### 3. 学语言要短时、高频


    教孩子学英语，不需要精心安排大块时间，而是每天用 **10** 到 **15** 分钟的空闲时间，设计一个小游戏，和孩子一起进行英文对话。这种碎片化的时间利用方式，反倒是语言学习最好的途径。怎么利用碎片时间，我的课会详细介绍。


    ### 4. 词汇积累比口音重要


    最后一点，让孩子说一口好听纯正的英文，自然是每个爸爸妈妈希望的，其实呢，口音没那么重要。不用我讲大道理，单告诉你一个事实，你就能理解了。印度人的口音，在我们英语老师看来，实在不敢恭维，但这完全不妨碍他们在硅谷风起云涌（注：原文为“风水起”，根据语境及常见搭配推断为“风起云涌”或“如鱼得水”，此处保留原意并修正明显错别字为“风起云涌”或保持原样？根据“硅谷”语境，通常指事业发展好。原文“风水起”极可能是“风起云涌”或“呼风唤雨”的误识，或者是“如日中天”。考虑到OCR可能将“如鱼得水”误识，或者“呼风唤雨”。但最接近“风水起”且符合硅谷语境的可能是“如鱼得水”的语音误转？不，更可能是“风起云涌”。或者仅仅是“事业如日中天”。鉴于要求纠正明显OCR错误，“风水起”大概率是“风起云涌”或“如鱼得水”的误识。但为了保守起见，结合“不妨碍他们...”的结构，可能是“在硅谷**立足**”？不，字数不对。让我们看拼音：feng
    shui qi。可能是“风起”？

    *修正策略*：OCR常将“如鱼得水”识错，或者“大展宏图”。这里“风水起”非常具体。如果是“风起云涌”，字形不像。如果是“呼风唤雨”，字形不像。

    让我们重新审视：“在硅谷**呼风唤雨**”？

    或者原文是“在硅谷**风生水起**”！对，“风生水起”（feng sheng shui qi）与“风水起”（feng shui qi）非常接近，且“风生水起”常用于形容事业兴旺。

    *结论*：将“风水起”修正为“风生水起”。）


    相反，无论是学语言还是文字，词汇积累都是重中之重，只是方法并不是咱们熟悉的那种“背单词”。孩子的词汇量怎么扩充，具体方法我也会在课程第二讲详细介绍。


    说了这么多，给孩子英语启蒙，到底应该怎么合理地分配时间和精力呢？


    我给你总结了一个“五三二原则”。上小学之前，你给孩子花费的英语学习时间和精力，**50%要**在听说上，**30%放在**从听读到阅读上，**20%打下**写的基础。


    之所以要花**时间**做早期英语启蒙，无非是抓住孩子学习语言的敏感期窗口，但是目的到底是什么？是把 6 岁以后学的东西拿到 6 岁以前来学吗？不是的，我不是教你抢跑——不科学的抢跑，只会造成对孩子智力的过度开发。我的目的是帮孩子把时间精力腾出来。


    6 岁之前用科学的方式、遵循正确的路径进行启蒙，完全有可能帮助孩子在**10-12 岁**，也就是小学高年级左右，达到至少中国高考的英语水平，之后只需要通过不间断地听和阅读进行保温就可以了。这样，初中之后，孩子就可以把主要的时间和精力腾出来，转移到其他学科的学习上了。


    为了帮你实现这个目的，我把这门精品课分为以下 7 讲。


    第一讲，帮你拆解早期儿童英语启蒙的目标。就是搞清需要积累多少词汇，孩子的听说技能能够覆盖哪些方面的内容，日常沟通应该达到什么水平。


    有了这个目标，从第二讲开始，我带你了解实现目标的手段。首先是如何通过家庭游戏、使用必要的工具，在家创造英语学习环境和氛围，以寓教于乐的方式让孩子把学了的英语用起来。


    接下来三讲，我会教你在中国的环境下，怎么用好英文读物。首先是英语读物怎么挑，其次是**如何**安排阅读进度，最后是怎么亲子共读效果好。


    第六讲，教你充分利用互联网、用好外教，让孩子跟真正的母语使用者多接触。第七讲，我会跟你说说做好了前面的工作，英文书写怎么开始。


    当然了，你可能会说，我的孩子已经五六岁或者七八岁了，该怎么办？方法也很简单，就是不要改变先听说、后读写的顺序，但是在过程中可以缩短时间。


    如果你还对自己当年背单词学英语有痛苦的记忆，如果你想让你的孩子不再重复你的痛苦，欢迎加入我的课程。


    ## 1. 儿童英语启蒙的目标


    你好，我是 Wendy，欢迎来我的得到精品课《如何开发孩子的英语潜力》。


    课程第一讲，我要先来说说，为了能够帮助孩子在 10-12 岁达到高考英语水平，在孩子上学之前，用正确的方法启蒙，应该达到的目标是什么。


    我先简单介绍一下，咱们国家的高考英语水平要求掌握 3500 个单词。其实对于英语学习来说，这是一个不那么高的标准。在小学阶段达成，也并不难。在上学前应该达成什么样的目标，最终实现这个大目标呢？


    我把孩子学龄前英语启蒙的目标，总结成了下面四条，有了这个标准，你也可以对照自家孩子的能力和进度：


    - 1. 听力方面，有 1000 个听力词汇的积累，能够听得懂，可以执行指令、回答题等；

    - 2. 口语方面，能就九大主题进行沟通和表达。至于是哪九大主题，我待会儿会仔细给你讲解。而且，见到外教或者外国人，主动表达、主动沟通意愿强烈；

    - 3. 阅读方面，上学前能够积累约 450 本分级阅读和英文绘本的听读量，积累大约 300 个阅读词汇，也就是看见了能认识、知道什么意思；

    - 4. 写的方面，能用大概 150 个左右的单词，进行简单写作。这个目标算可选项。


    这一讲，我就来给你把这四大目标一一做个解释。孩子从大概 3 岁开始学英语，到六七岁上学，在听说方面到底可以达到一个什么水平呢？


    ### 1. 词汇量：学龄前 1000 个听力词汇的积累


    孩子上小学前，在听力上，完全可以达到 1000 个听力词汇的积累，这是未来英语学习最为必要，但是很多爸爸妈妈没有重视起来的基本功。


    注意，我说的是听力词汇，什么意思呢？就是孩子听到了知道是什么意思，无论是以单词的形式出现，还是在简单的句子里，都能听懂。但并不需要孩子马上能够认识、能够拼写。


    为什么孩子要积累这么多的听力词汇？


    首先，听得不仅是能说的前提，也是发音标准的前提。只有掌握足够的听力词汇，知道这些词的意思，才能在合适的场景下正确使用，从而解决了先听说的问题。大量、反复通过听积累起听力词汇，尤其是听到不同的人对于这个单词的发音，无论是外教、以光盘或者
    APP 为载体的听力资源，还有你平时跟孩子一起做的游戏，都会很大程度上帮助孩子发音标准。


    你可能听说过“自然拼读”，甚至还听说，英美国家的孩子，刚上小学，通过自然拼读，就能大量阅读。但我要告诉你，之所以人家能做到，是因为他们大量的听力词汇。所谓自然拼读，本质上是把看到的单词转化成听力词汇。所以，自然拼读上接听力、下启阅读，有了听力词汇的积累，自然拼读才能学以致用，最终把听力词汇迅速转化成阅读词汇。


    进入小学之后，英语学习占据了先机，10-12 岁的时候能够达到阅读词汇 3500 个，听力词汇甚至高于这个数字，就是高考水平的要求了。重要的是，


    进入小学高年级尤其是初中之后，孩子需要大量的时间应对数理化，语文的压力也不小。对于英语的规划，早开始、早达成，才能腾出时间学别的功课。


    **1000** 个词汇，听上去量不小，你马上想起自己以前背单词了？打住！不是那么学的。别把你小时候背单词的痛苦再施加在孩子头上，这门课，我会教给你怎么在日常生活中帮孩子轻松掌握这些词汇。


    ### 2. 内容层：能够表达和沟通九大主题


    说完了这 **1000** 个听力词汇的单词量，你一定会问我，能听懂这么多单词，那孩子口语又能到什么水平啊？


    首先，能听懂不见得能够表达。我说过，听力词汇量往往大于口语词汇量。这个从咱们的母语学习中，你就已经有感受了。所以能听懂 **1000** 个词汇的话，一般能说出来
    **600** 个就很不错了。


    第二，那孩子能说出来一些什么呢？关于这个问题，我们要有个基本认知，孩子在这个年龄段，由于认知发展的限制，包括母语在内，都还不能表达深刻广博的思想、使用复杂精准的词汇，对于外语更是这样。但我总结的
    **9** 大主题的内容，都符合这个阶段孩子的心智，而且日常生活中常常能用到。


    哪九类呢？食物和基本需求，喜好和意愿，数字和物品，地点和工作，动物和它的习性，日常用语和指令，服装，玩具和周边环境，生活事件（比如做了什么、去了哪里）。我来给你一一解读一下。


    - 1. 食物和基本需求：就是能够表达包括蔬菜、水果、肉类、日常三餐中可能吃到的主食等食品的名称，并且能够跟自己的基本需求一起表达，渴了、饿了，想要吃什么喝什么。基本需求还包括去洗手间，表达冷热、增减衣服等等。

    - 2. 喜好和意愿：就是表达自己对于食物、颜色、衣物等等，喜欢还是不喜欢。意愿就是想不想做、想不想去、想不想吃等等。

    - 3. 数字和物品：数字不用多说，物品指的是除了食物和服装之外的，家具的名称、房间等等这些在家中比较常用的词汇和语句，同时包括一些简单的介词，孩子能够听懂和说出什么东西在桌上、在房间里、在床下之类的。

    - 4. 地点和工作：这个很容易理解，就是医院、公园、动物园等等这些地方的说法，还有一些简单的国家名称，一些词汇比较简单的职业。尤其是家人的职业和自己经常接触到的职业，医生、护士、老师、警察、司机等等，对于孩子而言不仅仅是词汇和语句，也是对社会
    的理解。

    - 5. 动物及其习性：这是一个你要注意的主题，因为孩子对于这个主题非常敏感，无论多么不常见的动物名称，他们记忆起来都很迅速，很有可能让你也很惊讶呢！至于习性，必然是比较简单的住在哪里，哪个国家有之类的。

    - 6. 服装：衣服和生活息息相关，不仅仅是衣服的名称，还要表达穿上、脱下，以及不同颜色和大小等等。

    - 7. 玩具和周边环境：这也是孩子们经常会用到的词汇范围，和孩子一起探索各种玩具的英语表达，是不是一件很酷的事情呢？

    - 8. 生活事件：就是做了什么、去了哪里，这个主题会比较宽泛。这里不要求复杂的时态，能够用一般现在时态和一般进行时已经很不容易了。建议不要在英语启蒙阶段去刻意教孩子语法，甚至于在小学中低年级都不要这样做。让孩子多多接触和体会大量的听力以及阅读材料是好方法。

    - 9. 日常用语和指令：这一部分主要是祈使句，关门开门、帮忙拿东西、打开书等等。


    以上 9 个主题，是一个精确的标准吗？并不是，但是它涵盖了学龄前孩子认知发展水平能够听懂和表达的一个范畴。但是，你可以使用这 9 个主题做很多事情。


    比如，给孩子报英语培训班，你就应该对照他们的教学内容，看看能不能尽量覆盖。再比如，你跟孩子做游戏，英语对话、积累听力词汇，这 9 个主题，就是孩子习得语言的知识地图。


    ### 3. 社交层：主动表达、主动沟通的意愿强烈


    前面说完了相对可以量化的标准以后，其实英语启蒙阶段还有非量化的标准，就是在社交层面的。


    孩子在见了外教或者外国人的时候，是否能够大大方方走上前去跟别人说话呢？无论这种说话是在出国的时候点菜或者买东西这样的需求；还是交际场合的一种主动沟通，比如坐在飞机上遇到外国人等这些情景，都是这样。


    ### 本讲小结


    学龄前孩子，正确的英语启蒙，可以把目标定成：


    第一，听力方面，要积累 1000 个听力词汇。


    第二，内容方面，要有包括食物和基本需求，喜好与意愿，数字和物品，地点和工作等九大主题，而且愿意跟外教、外国人沟通聊天。


    第三，阅读方面有 450 本左右分级读物和绘本的积累，以听绘本为主要方式，最终能够认得约 300 个简单常用词汇。


    ## 2. 如何用游戏创造英语环境


    你好, 我是 Wendy, 欢迎来到我的得到精品课《如何开发孩子的英语潜力》。


    上一讲, 我给你罗列了孩子早期英语启蒙, 在上学前就可能达到的目标。接下来的问题是, 怎么才能达成这个目标, 是赶紧给孩子报英语兴趣班吗?


    别急, 我不反对你把孩子送到英语培训机构进行系统的英语启蒙, 但是一些实用的小游戏操作起来简单方便, 不需要耗费大块时间, 完全可以让你在家里, 仗着自己那点英语的底子,
    帮助孩子进行英语的积累和提升。


    你可能又急了, 工作忙、家务也多, 我没那么多时间教孩子啊, 更何况, 大学英语四级过了好长时间了, 用得少, 忘得差不多了, 发音还不一定准, 能教孩子吗?
    甚至你可能会焦虑, 我的孩子都已经上小学了, 还来得及吗?


    先给你吃个定心丸, 你可以, 也来得及。


    讲方法之前, 我先给你简单讲讲原理。为什么游戏的方法, 比背单词、背句型更重要呢? 这里有一个学语言的重要原理: 分解动作要学, 更重要的是学组合拳。


    中国传统的英语教学和学习方式, 总是从单词、短语、句型这样学上去, 特别热衷于让学生做反复机械操练, 背单词、背对话。这都是分解动作, 把语言学死了。有些儿童英语培训机构,
    为了能够让父母很快看到学习效果, 会让孩子短时间之内操练很多分解动作, 孩子听到了某一句特定的话, 就回一句特定的话。

    '
