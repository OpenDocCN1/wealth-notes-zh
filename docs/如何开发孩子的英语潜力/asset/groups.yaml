    # 本讲小结


    第一， 选择线上还是线下，要对你家所处的城市，以及离培训班的远近，做个综合评估。但利用在线外教的方式，拉近孩子与母语使用者之间的距'
  md: '

    是当你停在某一页问孩子，这个页面上的人物是谁啊？他在干什么啊？他高兴吗？他为什么不高兴？孩子的回答可能会让你非常惊讶。不信你可以试试看。


    如果是英文绘本，即使孩子无法用英文来描述每个页面，他也已经能够捕捉到足够的信息。当你给他读的时候，他可以通过听，顺利对应词汇、语句与页面上的意思，产生理解，并且积累听力词汇。


    当然了，孩子在很多页面上看到一系列自己感兴趣的信息会很兴奋，会用中文说出来，比如，小一点的孩子可能会说“兔子，兔子在树下”，大一点的孩子甚至可能会使用描述性的语言说“熊妈妈不高兴啦”之类的。


    这个时候，一定用英语回应孩子，句子可以很简单，比如，“Yes, it is a rabbit." "The rabbit is under the tree."
    “It is a very big tree.”过程中可以用手指一指图片给孩子提示，但是不要用中文回应孩子。


    如果绘本阅读已经进行了一段时间，孩子逐渐开始熟悉了，你还可以在这一步加上一些跟孩子的互动：“Let''s have a look from the beginning
    to the end. What can you see?”


    ## 2. 第二步：你读他听 音意结合


    通过第一步的 Picture walk，孩子就已经理解了绘本的大意了，可能是部分的片段，也可能对整本书都有了解。但是这都没关系，孩子的学习不是线性的，而是螺旋式上升的，所以现在到了你读故事的时间啦！


    怎么读呢？很简单，语速一定要慢一点，不要出现连读，而是尽量把每个单词吐字清晰，便于让孩子理解。另外，每一页读完稍稍停顿一下，让孩子有一个反应的时间。就是让孩子把听到的信息，对应上图的意思，在大脑里建立初步的听力理解。


    在这里也提醒一下，你读要比音频更好呢。在这一步的时候，只需要给孩子念，让孩子去听，不需要再做其他动作进行干扰。


    ## 3. 第三步：指指点点 初步理解


    刚才说完第二步，到了第三步，就是再给孩子读一遍，一边读一边把你读的重要的信息在图片上指指点点，圈圈画画出来，让孩子进一步理解每个听到的单词是什么意思，整个句子在描述什么，然后整本书说的是一个什么故事。


    在这个步骤的时候，孩子对于英文读物的理解开始加深了，从第一遍看图猜出了部分的意思，到和语言发生匹配、能够有懵懵懂懂的理解，再到此时能够有对词汇、句子和全文的理解。


    前面提到过，孩子的学习过程不是线性的，而是螺旋式上升的，不像成人学习是直接从不知道到知道，而是通过多感官输入的方式渐进的。由于读物是英文的，孩子的理解过程会比母语慢一些，适当把步骤拆得比较细致，有助于降低孩子的认知负担和难度。


    在第二步和第三步的过程中，如果孩子一开始接触英文读物比较有困难，或者读的某个读物略微有点儿难，你可以把这两步进行重复，帮助孩子充分理解。


    在这前三个步骤中，我都没有刻意强调让孩子去认单词。原因很简单，英文亲子阅读的头一两年，一定是以听力输入和听力词汇积累为主要目标的。所以音和意的结合始终是重点，认单词是额外的任务。


    如果孩子的理解程度很高，你也可以在不给孩子增加太多认知负担的情况下，帮助孩子认识一些单词，尤其是常见词、高频词。如果孩子理解起来已经不容易了，那就不要认单词，先积累听力词汇。


    ## 4. 第四步：说一说 深度理解


    通过前面这三步，或者叫三轮，孩子对于英文绘本的理解就已经比较到位了，至少对输入信息比较熟悉了，那么为了达到更好的理解效果，就要把输入信息转成输出。换句话说就是让孩子说一说。


    显然，一上来就让孩子说是 不现实的，在孩子三四岁的时候，可以用问题进行引导，比如：


    - “What can you see in the book?”

    - “Do you like the rabbit in the story?”

    - “What happened in this story?”


    不要在意你问的问题是不是特别精妙，和孩子的互动是最重要的。问问题一方面是培养孩子对英文读物更深入的理解，也提供机会让他说一说英文，如此而已。


    但是妈妈不是老师，明确身份很重要——你并不是在教孩子英语，或者教孩子英文阅读，你是在做亲子阅读。这些小活动不是“考试”，答不出来就不行。这样对孩子而言就变成了任务而不是乐趣了。


    进行一段时间之后，可以把问题都问出来，让孩子一起回答。在孩子五六岁的时候，在给孩子讲一个故事，尤其是讲过几次的故事之后，可以鼓励孩子给爷爷奶奶或者姥姥姥爷讲讲那个故事，提供机会让孩子进行输出和展示。


    孩子上小学以后，随着阅读文本或者书籍越来越长，转述的难度会随之增高。而且孩子进入了自主阅读的时期，这本书你很有可能自己没看过，那就让孩子讲给你听吧！


    当然啦，如果你们分别去读，你了解书中的内容，让孩子输出时就可以更好地帮助孩子理解，在他有困难或者某个地方说得不太对的时候，进行提醒和帮助。


    # 本讲小结


    英文阅读和中文阅读的方法不太一样，英文阅读的四步法是：


    - 第一步：Picture walk，就是先看图不看字，过程中用全英文跟孩子沟通，这一步是为了通过图片理解意思。

    - 第二步：你读孩子听，读的时候，要比正常语速慢一点，这一步是为了让孩子把英文和具体意思对应上。

    - 第三步：指指点点，就是用手把重要的信息圈出来，这一步是为了帮助孩子进一步理解书里面的意思。

    - 第四步：说一说，就是引导孩子说一说这个故事，这一步是为了让孩子深入理解这个故事。


    # 5. 怎么组合使用分级书单


    你好，我是 Wendy，欢迎来到我的得到精品课《如何开发孩子的英语潜力》。


    上一讲的四步法，说的是一本书应该怎么读。这一讲，我来说说，这 450 本分级阅读和英文绘本，应该如何进行安排，能达到最好的效果。


    阅读这件事，单拼数量不是最重要的，反复读、组合读才更有效。


    我们要达到两个目的，一个就是帮孩子扩充听力词汇，另外也是提供机会让孩子进行英语表达。


    给孩子做英文启蒙，真的不需要重金购置海量原版绘本，3 年一共 450 本分级阅读加英文原版绘本就非常棒啦。


    下面就给你介绍一下我总结的三个定律，用来给孩子进行英文阅读启蒙，教你用五本书读出十本书的价值来。


    ## 1. 每周两次坚持读


    孩子上小学前，中文英文都需要大量输入，得全盘考虑。中文书每个礼拜要读至少三次，那英文的书两次就可以了。想要持之以恒，你的工作量已经挺大了，一周 7 天 5
    天亲子阅读——坚持几年也不容易。


    中英文阅读，我建议是 3:2 的一个比例。换句话说，你不要给自己施加太大的压力，养孩子是持久战，不能先把自己的能量耗光了。


    那么基于这样一个比例，每周 2 次英文朗读怎么进行？


    首先就是怎么挑选书的问题。我给它起了名，叫选择率——就是给孩子选书，尤其是还不能自主阅读的阶段，要贵精不贵多。一年能够把 100 本分级读物或者英文绘本真的读透，要囫囵吞枣地读
    300 本来得好。


    早期阅读要注重质量——我说的质量不仅仅是书的质量，还有你阅读的质量，为什么呢？


    因为对于中国的孩子来说，给孩子进行中文阅读和英文阅读，目的并不一样。给孩子读英文书，无论是分级阅读还是绘本，都有学习英语的这样一个诉求或者叫目的。孩子刚刚开始接触英文读物
    的时候，头一两个月肯定会有一些排斥，一定要记得我在前面讲过的四轮法慢慢来，即使孩子讲中文也要用英文回应。每周有 2 次朗读，一次 1 本。


    ## 2. 好书不怕重复读


    知道了每周最低的阅读数量，然后每次读一本就算了吗？不是的，你还得让书不断复现。


    这个怎么读的定律叫做复现律，能够帮你读好每一本书，让每一本书对孩子的英语学习发挥最大的作用。


    复现，顾名思义就是读英文读物，不要怕重复。孩子接触的是另一种语言，为了能让孩子在英文环境中真的理解每本书的意思，就势必要重复出现——每本分级读物按照四轮法读完了，还可以再读几遍。


    怎么复现呢？我刚才建议一周读两次英文读物，如果每周读两次、每次 1 本，一个月算 4 周，前 3 周就已经有 6 本分级读物了。所以这个月的第四周，就不要读新书啦。


    我们可以在第四周，让孩子从前三周的 6 本书中挑选自己最喜欢的 2 本来读。甚至于有些孩子可能会缠着你读某一本或者是两本，那你就给他读。


    如果本来这周应该是读新书了，你可以跟宝宝说，那我先给你读一本新的，但是你刚才说你还想听的，那个我再给你读一遍，都是可以的。小孩子的分级读物一般都很短，所以即便是读好几本也没有多长时间。


    那么每个月前 3 周读新书，第 4 周挑选读过的书，这样一直持续 5 个月，咱们按照这种方式就已经读了 30 本书啦！这个时候，第 6 个月完全不用引入新的书，每次都让孩子挑选已经读过的这
    30 本里面的就可以了。你再给他复现。孩子的学习过程一定是螺旋式上升的，就是一个不断滚动、不断复现的过程。


    很多家长以为孩子的记忆力很好，其实搞错了，孩子的记忆力其实是很差的。心理学的研究表明，人类最基本的记忆策略，实际上是要到七八岁的时候才开始逐渐形成的，学龄前的孩子，整体认知发展达不到。所以，这个阶段孩子学习，一定要强调复现。


    ## 3. 打好组合拳才更有威力


    给孩子读英文书，频率每周读两次，每次读一本，刨掉刚才说的重复阅读的书，前 5 个月下来都有 30 本书了。在第 6 个月，就要进行这 30 本的复现，那让孩子怎么个挑法？这个时候就需要你来分类组合一下了。换句话说，就是你把这
    30 本书按照主题来分分类。


    比如，有 10 本跟小动物有关的，你先给挑出来放在一起；然后又有 10 本可能是跟大自然相关的，你再给挑出来放在一起；比如还有 5 本涉及到了颜色，还可以继续分类。按照不同的主题，30
    本可以分出很多类别。


    你把这些书分分堆，复现的那一个月每次让孩子从不同的主题里挑，实际上你就用这种方式不停地再去巩固和循环某一个主题，或者是某一类概念的词汇。这样做，产生的不仅仅是一个随机的强化，而是帮助孩子更有效地去复现。


    在给孩子进行英文启蒙的时候，对于资源千万不要贪多。当然不是说资源多不好，而是当下这个时代，资源并不稀缺，但是孩子的差异是由你如何利用资源决定的。你的时间和金钱都是稀缺的，尤其是时间。


    所以，不用高度紧张，每周恨不得天天围着孩子转。5 次亲子阅读，3 次中文 2 次英文，能坚持下来就非常好。你也用不着花大笔钱买上千本英文原版绘本，最后可能只有一半真正翻过。如何用最优的资源，用最好的方式来给孩子进行英语启蒙，才是重点。


    我上一讲介绍过，179 本网站上的 AA 级和 A 级分级读物，加上 92 本培生的分级读物一共是 271 本，再加上绘本，一共也没有多少钱。但是你如果能用好这几百本书，真的能在几年的时间里面，帮助孩子实现一个非常好的英语启蒙。


    这四五百本书，足够用了。假设每本书里平均有 30 个单词，那么一共的输入总量是多少？从来没有重复过的词汇，总有超过 1000 个。所以，在英语启蒙的过程中，积累
    1000 个以上的听力词汇，完全没有问题。


    # 本讲小结


    在如何利用英语读物帮孩子启蒙这件事上，上一讲我先介绍了一本书如何按照四个步骤去读。这一讲，又跟你讲了，在每周、每月和每年对这些英语读物怎么进行安排，书单上的书可以怎么组合，就能够把
    5 本读出 10 本的效果。


    - 第一，每周两次坚持读。

    - 第二，每月前三周读新书，最后一周读已经读过的书。每半年的第六个月，就在前五个月读过的 30 本书里挑一些来读。

    - 第三，在第六个月，对前面读过的 30 本书按照主题来分类重读。


    # 6. 如何用好外教


    你好，我是 Wendy，欢迎来到我的得到精品课《如何开发孩子的英语潜力》。


    孩子早期的英语启蒙，家长的作用当然很重要，但是教的工作还需要老师来。


    很多爸爸妈妈都问过我，是报名线下机构比较好，还是在线直接跟外国老师学英语比较好？


    我的回答是，根据自身情况而定，同时要善于利用和享受互联网技术带来的红利，拉近孩子与母语使用者之间的距离。这既是给孩子建构良好语言环境的好方式，也是这一代孩子们身为互联网原住民得天独厚的优势。


    但是，在线跟外教学习，也是有窍门，有方法的。这一讲我就跟你仔细说说。


    ## 1. 线上线下怎么选？


    想要真正提升英语的综合运用能力，确实应该有一定量的时间，跟以英语为母语的人进行学习，尤其是在沟通和交流中学习。


    这就好比，如果一个美国人想要学中文，你认为他应该找一个会中文的美国人学，还是一个中国人来学呢？我问过很多人这个问题，大部分人的下意识反应都是，当然应该是中国人。那么中国人学英语的时候，也一样呀！


    在真实语言环境中跟真实的人，进行练习和交流并得到适当反馈，是非常必要的。


    外教的这种形式是好的，但是它并不是全部。在中国目前的英语学习中，为孩子构建英语环境，也不是有了外教就有了环境这么简单。


    你在家给孩子读英文绘本或者分级读物，设计小游戏跟孩子一起做各种练习，利用 APP 给孩子进行英语听说资源的补充，都是你给孩子构建的英语环境。而引入在线 1
    对 1 外教这种方式，是你给孩子构建的英语环境中的一个有效的部分，它为孩子带来了一个能够每周几次真实使用和练习英文的机会。


    那么，所谓系统进行英语启蒙，大部分家长还是要求助于英语学习机构的。那么线上和线下的英语学习到底如何选择呢？


    我的建议是，以两个关键点进行衡量，一个是金钱意义上的成本，另一个可能更重要就是时间的成本，两方面一同进行核算。就家庭教育而言，时间成本比金钱成本高很多，这是容易被人忽略的无形成本。


    如果你每周一次带孩子去线下培训机构上课，具体流程是这样的：上午 9:00 上 2 节 40 分钟或者 3 节 40 分钟的课，需要 7:00 叫孩子起床，经历艰难的叫起、刷牙洗脸、穿衣吃饭，好不容易把孩子带出了门。此时
    1 个多小时已经没有了。


    对于北上广深这样的一线城市而言，路上的交通成本是非常高昂的，这个成本不是车钱和油钱，而是一个只有 5-10 公里距离的地方可能需要超过 30 分钟的车程。于是，加上开车、找车位停好车，前后又有四五十分钟的时间没有了。


    即便如此，还有 2 个过程性成本没有计算。现在的线下培训机构主要分布在社区和大型购物中心。这意味着孩子提出要买东西的可能性大大提升，即使没有买东西也会涉及到在外面吃饭、停车等诸多成本。


    第二个过程性成本是你自己的时间成本，在孩子上课的这段时间，你在干什么呢？大多数情况这个时间就被浪费掉了，没有被复合利用。


    因此，我会建议，有两种情况的线下英语培训机构可以报。


    第一种情况就是，如果你住在一线和准一线城市，从家走路就能到达的学习机构，也就是 1.5 公里以内，步行 20 分钟以内可以到达的，可以报。第二种情况小城市，交通压力比较小，开车加停车
    20 分钟以内可以到达的，综合评估下来时间成本和过程性成本比较低，也可以报。


    如果超出了这个范围，至少以我的评估方式，会觉得得不偿失——很多东西用金钱都可以买，但是时间是金钱买不来的稀缺资源。


    用同样的时间和金钱，在家里学习，会有很多好处。不仅节省去准备的时间和交通的时间，在家的时候你自己的时间也比较容易进行复合利用，不管你看一看书、听一听得到的课、处理一些家务琐事，自己都能获得很大收获。


    榜样的力量是无穷的，能够把碎片时间充分利用起来，不仅能够给孩子树立榜样，还能够通过自我提升得到更好的个人发展，间接为孩子创造更好的成长环境和教育条件。


    还有就是金钱上的成本。如果你的经济条件允许，当然是线上线下相互补充最好。如果条件不允许就根据自己的情况选择一个，选择的方法刚才已经讲过了。


    ## 2. 美教和菲教怎么选？


    如果肯定了外教 1 对 1 这种形式对于听力和口语的作用，那么，美教和菲教怎么选？这是英语培训的行话，就是选菲律宾国籍的老师还是选纯美国籍、英国籍的老师？


    从语言学习的角度来说，当然是首选美教了。但是——


    这并不是一个概念问题，也不需要争论口音纯正与否，作为你，只需要考虑家中的经济条件，怎么能够支持孩子英语及其他方面的学习。


    英语这个东西，狂灌一两年后就扔了是没有意义的，在孩子 10 岁之前，都要不停地付出和积累，形成了习惯和方法之后，可以采取多听和多阅读的方式保温。


    孩子的教育是马拉松、是持久战，有什么条件打什么仗。装备精良飞机坦克也不见得能赢，小米加步枪过草地翻雪山也可以取得胜利。


    所以，如果你能够有足够的支出每年保持上美教，那就是好选择；如果你只有一定的预算，那上菲教，能够保证学习的总时长，那也是好选择。你要把孩子 10 岁之前这些年的时光，做好计划，才能胸有成竹地应对孩子的成长和发展。


    跟着菲律宾老师，也一样能把英语学好。这是为什么呢？


    首先还是要从目的入手考虑。跟外教老师学习，你期待的结果一定是比一般中教老师更好的语音语调、地道的英文表达、文化渗透和学习这三个方面。


    在不考虑经济压力的前提下，美国、英国这样的纯正母语使用者必然是首选，但是语言的习得和学得都是长久的积累过程，那么，如何能够在经济压力不那么大的情况下，依然让孩子的英语学习更长久地持续？显然，菲律宾老师是在这些条件考量之下的最佳选择。当然，选择语音语调较好的菲律宾老师，尽可能固定几个熟悉的老师，更能帮助孩子进行英语学习。


    ## 3. 上好外教课的秘诀


    虽然有了互联网技术，能够让孩子公司有接触外教的机会，但是一周两次到三次甚至更多次的外教课，并不能解决孩子的英语启蒙问题。为什么？


    因为即使我们选择到了和孩子最能配合得好的老师，无论是什么科目，学习的结果依然是“师傅领进门，修行在个人”。


    那么，如何能够把在线学习的效果最大化呢？


    首先要能把在线上课养成习惯。对于孩子的学习问题，始终要有规划。


    让孩子一周上 2-3 次外教课，不能放任自流，认为什么时候有时间再上。有多少人都是抱着这种心态报了健身房，但是报完之后就没有然后了，只有那些每周固定时间去的人坚持下来了。为什么？因为习惯的养成需要大脑和肌肉产生记忆，产生自动化，才能习惯成自然。


    孩子四五岁开始接触外教课，不仅仅是要学习英语，也在同时进行幼小衔接。每周固定时间进行学习，一定比三天打鱼两天晒网来得效果好。


    第二，做好预习和复习，总是学习的不二法门，我有一个极端的说法就是把一节课的时间乘以 3 才是把一节课上好的方式。


    具体的方式就是，课前用 15-20 分钟的时间预习，课后用更长一点的时间复习。这个预习，并不是让孩子把要学的内容先学一遍，对于年龄较小、好奇心强，但是也更容易厌倦的孩子而言，这样做只会让孩子上课的时候很快走神而已。好的英语课程的预习，是把单词障碍扫清就可以，不用放得太重。


    对于复习，我建议一下课就让孩子跟你聊一聊上课的内容，千万不要像上级要求下级汇报工作，而是要让孩子分享给你。这个时间不用很长。到了第二天，可以用 15-20
    分钟，巩固一下。


    怎么做呢？我们已经探讨过的那些练习小游戏，就是做这个用的了。利用这些小游游戏，不仅可以巩固所学内容，也是一个在给孩于积累语料的过程。


    学习结果好不好跟很多因素有关系，但是如何能够有效利用老师达成更好的学习结果也是学问。


    比如，有的时候老师让你做自我介绍很烦，但是自我介绍也可以做出很多种形式，今天说说自己的英文名字，下次说说自己的爸爸妈妈，再下一次说说自己生活的城市或者家乡，其实这些句子都没有很难，却能够提供给老师更多更有效的反馈机会。无论如何，帮助孩子达成最好的学习效果，永远都是我们最大的追求。


    这个时代是飞速发展和变化的，你要能够拥抱这些变化，才能影响孩于去迎接变化和挑战。利用互联网红利，为的是提升孩子的英语学习效率。


    当然，技术的飞速发展会不会几年内给我们带来 AI 老师、带来更科学的英语学习产品谱系，我们也拭目以待。


    # 本讲小结


    - 第一， 选择线上还是线下，要对你家所处的城市，以及离培训班的远近，做个综合评估。但利用在线外教的方式，拉近孩子与母语使用者之间的距离。

