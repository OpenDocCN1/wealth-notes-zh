- pgno: 145
  md: '# —02—


    # 如何引流推广


    # 1、基于原有客户定向推荐


    我们本来就是给小 B 商家提供营销活动制作的 saas 平台，已经有几万的注册客户，我们基于已有的客户群体筛查他们以往做过的活动，发现有一些是景区、博物馆的主办方做的活动，基于之前已有的合作前提，很顺利就联系到这些景区。


    回访下来还真有收获，虽然有的景区已经做了或暂时不需要，但有几个景区本来一直想做但一直没有执行，因为我们给的模式是免费的，对于景区来说没有成本，还能为景区额外创收，所以这部分景区很顺利就确定下来，签署了合同和景区授权书。


    拿到了每个景区的解说词后，开始在淘宝找真人配音主播，配音价格基本在 20 元/百字左右，最大可以谈下来 10 元/百字，这个价位的主播对于景区讲解来说够用了。但问题也有，就是这种价位的主播因为经验相对欠缺，经常读错一些字音，得来回多改几次。


    音频都录制好以后，将文字、图片、讲解音频内容填充到系统，发给景区测试没问题后，我们设计景区二维码展牌让景区自己印刷出来，将展牌投放到景区里各个比较显眼的位置。


    游客扫码进入导览，可以免费试听前面几个景点的讲解，如果需要听该景区所有景点的讲解，则需要支付 5～10 元钱。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '![](img/9a1e1046870132236b6927ae01b2ba90_146_0.png)


    # 2、招代理合作


    在前面回访的客户中，有的主办方并不是直接的景区方，只是景区之前委托他们做活动。他们手里也有一些景区的资源，这种情况就让他们代理我们系统。如果代理商去谈成合作的景区，我们会将收入让出一些比例给到代理商，只要景区有收入，代理商这个收入也是一直都有的。


    截止目前，我们有一半的景区合作都是代理商谈成的。


    # 3、知乎问答推广'
  merge: -1
  img_proc: true
- pgno: 147
  md: '除了前面对已有客户的回访，站外主要做的是百度知道和知乎问答推广。将关于景区导览的所有问题链接采集起来，编写好每个问题的回答文案，找人代回答，然后自己将回答排名做到前三。


    现在主动来咨询的都是通过知乎来的，目前总共收到 52 份留资的合作申请。


    # 4、百度 SEM 推广（暂未成交）


    我们在百度、360 都开了竞价账户，上线计划跑了大概一个月，基本没有转化，所以就下掉了。因为点进来的大都是 C 端游客需要找某某景区的导览，这种用户对于我们来说价值太低了。印象中景区管理方的用户通过
    SEM 来咨询的就 2 个，还没有成交。当然这也可能和我们自己不擅长 SEM 有关。


    # —03—


    # 如何实现


    # 1、游客付费听导览的收入


    直接合作的景区我们有 50% 的收入，代理商谈成合作的景区我们有 25% 的收入；因为景区分淡旺季，在节假日一天的流水能有几千，平时淡季每天几百块。这块的收入占了总收入的
    70% 左右。


    # 2、公众号变现'
  merge: -1
  img_proc: true
- pgno: 148
  md: '游客听导览是关注我们的公众号，粉丝沉淀到了我们这里，可以通过公众号卖出或者接广告变现。目前只有几万粉丝，还没有针对粉丝这块做变现。


    # 3、为景区定制开发


    有的景区想做导览，但不想让游客付费，所以给景区按年付费，根据景区景点数量，我们现有合作的价格在 5 千～2 万一年，这块收入占了总收入 30% 左右。


    # —04—

    总结


    这个项目的门槛很低，前期的成本包含制作音频、程序开发、服务器三个部分。只要有景区、博物馆、游乐园、展厅这方面的资源，把他们搞定，后面就是一笔稳定的固定收入。你合作的景区越来越多，这个固定收入也会水涨船高。


