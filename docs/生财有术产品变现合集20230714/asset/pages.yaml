  md: '首先为流量主新手圈友简单做个科普，老玩家请随意~


    # 一、微信广告「流量主」是什么？


    微信广告是微信指定的广告平台（官网 ad.weixin.qq.com），品牌方在「广告主」后台投放广告，流量主在微信公众平台后台「流量主」栏目可开通流量主和设置、查看报表收益。


    流量主可轻松实现流量变现，持续获取收入，依托于高价值的内容，实现品牌塑造和内容变现的双赢。


    微信系统会根据广告素材的定向和阅读文章或使用小程序/小游戏的用户画像，匹配当前状态下最适合展示给用户的广告，流量主无需额外操作。


    # 1、现状与趋势：流量主的前景如何？


    记得 @条形码 老哥在今年4月生财全网网友见面会的分享：选择一个赛道时，得了解下「大基本面」如何。这里我找了两方面数据：


    首先，根据 2020 年 9 月的微信广告流量主大会的报告显示，截至 2020 年上半年，月活跃流量主数量是 85 万+。2020 年 1 月-2020 年
    7 月，流量主累计分成 31 亿+，月入 10 万以上的流量主有 1000+；而小游戏更猛了，截至 2020 年 7 月，小游戏整体流量同比增长 80%，月广告分成超过百万的游戏达
    39 款。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '而根据腾讯 2020 年度财报，其中网络广告收入 822.7 亿元，同比增长 20%，占总收入的 17%。2020 年，每天有超过 1.2 亿用户在朋友圈发表内容，3.6
    亿用户阅读公众号文章，4 亿用户使用小程序。


    有这么多的活跃用户，微信负责招商，创业者负责做产品与内容吸纳流量，通过流量主变现，这路子行得通～但也要了解微信已上线 100万+ 小程序，说明机遇和挑战并存。


    ![](img/9a1e1046870132236b6927ae01b2ba90_225_0.png)


    # 2、如何开通小程序/公众号流量主？


    随着微信公众平台的发展，从早期内测期到现在，开通门槛逐渐降低。当前的要求是：微信小程序 1000 用户（访客），公众号 500 关注（粉丝），且无严重违规记录，即可开通流量主（微信公众号后台-流量主）。


    无论主体是个人，还是企业（包括个体工商户），均可以开通。区别是结算时，企业需要开具增值税专用发票给腾讯（注意是专票，需要纸质的发票邮寄）。个人是微信代扣税（增值税、附加税、个人所得税）。综合从费率上来说，企业主体的更好。


    业界也有代开通流量主的（就是刷量达到开通门槛），这个见仁见智，我个人不建议去代开。正如王兴说「做投资的前提是先有钱」，赚流量主钱的前提是先得搞流量。'
