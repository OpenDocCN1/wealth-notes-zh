    # —01—


    # 如何找到市场需求


    2019 年 12 月，去厦门鼓浪屿旅游的时候关注了鼓浪屿的官方公众号，看到公众号有做景区的语音导览。整个使用流程很不方便，每次听完一个景点后，需要退出来查询下一个景点的编码，然后再到公众号回复编码，再点击进入听下一个景点。这流程基本没有游客能耐心听完所有景点的讲解。'
