  md: '我发现大家基本都是工程师，爱搞钱的工程师，这就是工程师中的爱折腾 20% 了。这已经很


    经很不错了


    但看大家的打卡，普遍的关注点在技术实现，在说如何实现这个东西碰到具体的问题。


    而没有花很多时间研究这个东西，是不是用户想要的，是不是 GTM（Go To Market）


    的。


    同样，也没有花很多时间研究流量，包括冷启动方式、持续获取流量的方式、流量的竞争


    争度等等。


    比如假设你已经做出了这个东西，而且跟竞品差不多质量情况下，下一步怎么办？下一


    步如何获客 & 赚到第一块钱..


    所以建议小伙伴们，二八原则：


    +   1. 没开始做的小伙伴：80% 精力多多研究，要做的 IT 对应的是否 GTM 和 流量维度的竞争


    +   2. 正在做的小伙伴：20% 精力也多多研究如上所述


    ---- 小小分割线 ----


    误区四：自身的需求一定是好需求吗？不一定


    我的看法：'
