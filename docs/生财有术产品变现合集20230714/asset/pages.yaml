- pgno: 167
  md: '日期：2020-10-19


    #小众产品 #独立开发 #浏览器插件 #需求挖掘


    大家好，我是壹树，一个 人 在 海外 浏览器 插件 这个 不起眼 的 小众 市场 深耕 了将近 4 年，今年 5 月 决定 不再 上班 做 产品 汪，把 这个
    “小” 从 副业 变成了 主业，目前 专注 小众 领域的 软件 （插件） 产品 变现。


    长话短说，今天跟大家分享一套入门级别的需求挖掘方法：


    从大关键词中找大产品，将大产品中进行功能拆解，从功能中发现长尾关键字，通过长尾关键字数据反推小产品的可能性。


    这套方法用到了以下的浏览器插件工具（需梯子进行安装）


    Keywords Everywhere - Keyword Tool （付费的，充值 10$ 有 10000 点数，够用好久了）


    https://chrome.google.com/webstore/detail/keywords-everywhere-keywo/hbapdpeemojbophdfindmigdhppljmgp


    对于小众产品，工具类是一个基本面，之所以 “小”，是因为解决的是用户的一个 “点”，这个点就是产品的原点。当然我们不可能漫无目的地进行，可以选用比较常见的
    “视频”，“图片”，“社交”，“电商” 等的领域。


    下面会一步一步描述如何进行发掘的，我们选用 Facebook tools 这个大关键字开始。点击搜索后，插件直接在页面显示了很多的相关数据，例如：Volume**，CPC**，Competition**，Trend**，都是搜索的关键指标，这些指标仅提供了参考价值，因为如若切换到其他类似工具，数据会有差异，但也很好提供了价值。'
  merge: -1
  img_proc: true
- pgno: 168
  md: '简单解释一下这些关键指标:


    +   - **Volume:** 每月搜索量


    +   - **CPC:** 单次点击成本


    +   - **Competition:** 竞争难度，0 ~ 1 难度依次递增。


    +   - **Trend:** 趋势，搜索量的趋势


    通常是将前三个指标混合在一起对比的，这三者关系一定要保持敏感，不然会错过很多机会。


    +   1. 搜索量大，CPC 低，Comp 又低，那么就是一个好的关键词。

    2. 搜索量小，CPC 高，Comp 接近 1，那么就代表厮杀行遍野了。


    ![](img/9a1e1046870132236b6927ae01b2ba90_168_0.png)


    169/251'
  merge: -1
  img_proc: true
- pgno: 169
  md: '但对于小众产品来说，这个大关键词意义不大，虽然搜索量很大，如果现在去抢这个词，那么大概率就是炮灰，而且对于用户来说，这个词的需求不够直观，没法直达用户的“点”。


    这里你发现了一个广告，不要忽略这个广告，点进去。然后浏览此网站的功能介绍页面与价格页面，因为这个 2 个页面有我们需要的信息。


    # 功能介绍页：


    功能介绍页面包含了那些功能，为用户带来什么，可以大概了解工具的功能范围，一般用于评估技术实现难度。


    ![](img/9a1e1046870132236b6927ae01b2ba90_169_0.png)


    # 产品价格页：


    价格页面通常会详细地将功能点列出来，然后用户可以对比。如：Automated post scheduling（定时发帖），Key performace metrics（关键性能指标），Custom
    analytics（用户分析），Exportable reports（导出数据报告）。这些都是我们对工具的一些直观理解，也是相对直观告知用户的一个“点”。'
