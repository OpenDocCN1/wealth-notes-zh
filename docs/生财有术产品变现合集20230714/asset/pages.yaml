    当我不知道如何开始时候，就交给这个表去决定，遵循自己定规则。


    表单地址：


    https://docs.google.com/spreadsheets/d/1fw6106Zh4IH4duvrKoh0MWQXeElMDHa78RwFbmdSBy0/edit?usp=sharing


    需求方向：扩展程序需要解决用户什么问题。


    开发评分：开发越容易，评分越高。'
