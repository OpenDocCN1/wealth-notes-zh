  img_proc: true
- pgno: 215
  md: '而找老外做开发，你得1，2，3，4，5……把实现细节拆分才行。要不然，加上时差，还有技术框架不熟悉（我的那些编程语言、算法套路基本都交还给大学老师了），这一来一回，更是难上加难了。


    如果你要找老外做开发，一定得先列好细的需求，直接让他实现code就好了。要不然开发时间和进度会拖死你。最重要的是，多找几个来对比，多磨合几轮，才能找到合适合自己的。


    最后找了两个朋友（朋友L，一直有帮我处理程序上一些事，全能能力有，但需求时间来实现；朋友Y，是另外一个朋友介绍的，大公司的前端大牛）来做两个版本，同样的需求。为什么要这样做呢？因为我不只做这一个插件或小工具，后面还会有N多（如果你有程序员朋友想变现，也可以推荐给我），前面已经多次提到，开发时间对于小工具来说是个大坑，如果托得时间越久，那成本只增不减。也是相互一个磨合过程，开发这个活，还是技术优势来主导的，差一点，就真的需要时间去打磨，别无他法。


    # 3.2 业务流程坑


    做小众市场先行原则：找别人已经赚了钱的需求，再深挖（最直接的是找差评，看看能不能解决这些问题），你离变现不会太远。


    有句话叫，你想学会游泳，你至少得下一次水吧，要不然动作再漂亮也没有什么用。先行原则，前面已经提到过了，即pdf这个大工具，周边其实是有很多需求的，用户基数也足够大，先积累种子用户，能收到第1块的用户那更好。再去拓展其它需求，赚钱是迟早的事。先下水，那就直接先模仿，把核心需求实现，尤其是支付环节实现（chrome插件之前还有google
    pay的支付，现在没有官方支付支持了，但是能接第3方，这里支付坑再展开讲一下）。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '讲一下PDFXYZ这个小工具，核心需求，朋友L是用中间服务器来实现的，PDF文件基本无损来承载了（即文件清晰度，因为pdf文档，要么是文字，要么是图片，还有其它格式合成的），即能满足客户真实需求，但这里面还有服务器上传下载的问题，还有文件大小的门槛（文件大，下载时间就长）。文件大了，插件的体验就极差了，因为会卡在那里，半天动不了，只有限制其大小，设置为10M。


    朋友Y，是直接用的js api来实现，但是文件下载下来就模糊（客户的核心需求实现还差一些），另外同样的，也是文件上传下载的问题，这种文件大小限制就大一些，为30M。


    # ## 3.3 支付坑（大坑）


    国外的工具或一些需求，或产品，除了广告变现以外（Google Adsense）；常用的变现方式：捐赠（paypal）；还有通过分享产品等知识，用affiliate模式（分销赚佣金）来实现；那最直接的方式，就是直接收费。


    chrome插件大多数情况下，只能选择捐赠，或直接收费的方式。结果现在的Paypal账号是不支持国内账号的捐赠。


    直接收费方式，因为google pay官方支付停止，但接受第3方支付。你可能直觉是Paypal，但不好意思，虚拟产品，Paypal不支持（应该大型软件会有收款白名单）。还有其他选择：stripe等（但现在申请，又是门槛N高，申请下来，也会被封号的风险）。


    现在收款，是先试的是Sendowl（可以再转Paypal，现在测试的结果，几十美金，通过sendowl付款链接，Paypal是直接关系到帐的）（这个工具是壹树老板（插件大佬，公众号：树下随想）推荐，尤其是支付这个环节，帮了老忙了）。这里壹树老板也趟了无数的坑（如果你想问，请付费，真的绝对超值）。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '因为sendowl是web端网页支付，插件端要有个支付回传（webhooks），确认用户已经支付成功。熊（全栈大牛，大学同学，之前的公众号有介绍过）+壹树老板的综合建议：不做登录就可以整个本地的唯一标识Key，当用户付款了，就生成一个标识Key，保存到数据里（或者用用户本地电脑缓存）；另外最好手动或自动再发一下支付邮箱一封邮件，把其Key发给用户。如果用户卸载了，就可以用这个Key来识别。


    另外插件内是不支持回传确认的，如下图，即卡死在那里，因为没有回传确认是否支付成功。朋友Y是直接用的单独新开浏览器标签页，让付款用户直接通过sendowl网页链接付款。


