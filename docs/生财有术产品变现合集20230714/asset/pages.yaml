    # 三、我在这个项目中的几点思考


    以上就是这个视频转文字工具从需求-产品-流量再到变现的一个完整过程了。最后再说

    说，我在这个过程中的几点思考。


    第一个是做产品或者项目，如果从满足需求和解决问题出发来构建，做成的概率会更大

    一些的，并且验证需求最好是落实到数据上。


    第二个是做项目可以从细分需求切入，这样用户量可能少一些，但是竞争小运营推广更

    容易，可以等细分做起来之后，再回头覆盖大的需求也不迟。


    第三个是我感觉是微信seo见效很快，做项目的同学真的可以尝试一下。


    最后一个是关于编程和ai，编程和ai确实是很好的杠杆，它们能代替我们做一些重复繁琐

    的工作，提高效率的同时解放我们的双手。


    懂技术的同学可以很好的利用它们，解决问题，实现流程自动化，降低边际成本，打造

    被动收入。那不懂技术的同学呢?这不懂技术的同学嘛。'
