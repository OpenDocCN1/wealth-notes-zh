- pgno: 219
  md: '暂时算是盲测阶段，没有安装统计代码（因为插件不同于网页，具体可参考[https://developer.chrome.com/docs/extensions/mv2/tut_analytics/](https://developer.chrome.com/docs/extensions/mv2/tut_analytics/)），google
    ads也只是做了简单优化：需求地点（直接定位到城市）、设备（排除掉非电脑PC端）、keywords直接上精确匹配......


    简单优化的数据，表现最好的区域为新加坡，0.5-0.7美金一个安装，精细化优化，成本至少可以降一半以上。30%的卸载（数据量基数不大），另外同类产品功能差不多的情况下，是免费的，PDFXYZ这个小工具性能也要再优化。安装率45%，即差不多2个人看，有1个安装，即需求还是有的，流量也算精准。


    下面的20年国外的一份统计表，值得你在chrome插件，初始预算要花到多少钱。到了1000的用户数，你基本算是脱颖而出，当然，现在21年，用户基数的标准提高了。如果按照前面的简单优化的单个安装成本0.5-0.7美金，你推广试错成本至少得你准备500美金，是不是突然发现这个事可以干那么一下子了。


