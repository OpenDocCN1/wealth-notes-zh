    # ## 二、产品MVP应该是什么形态的？


    我的核心思路包括两点：


    +   1.永远从海外网站开始。

    2.想清楚需要验证的内容。


    先说第1点。为什么需要从海外网站开始呢？


    因为做海外网站，最快。比做其他形态的产品，要快出很多。'
  merge: -1
