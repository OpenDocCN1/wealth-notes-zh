- pgno: 211
  md: '# # (30赞)Chrome PDF 插件从0到1的试错经验与踩坑复盘


    作者： 颜过


    日期：2021-08-11


    Chrome插件从0到1的试错经验


    PS：之前这篇所有内容只在内部小圈子分享过，最近一次分享在帅张张哥的群里。之前了解我的财友，最大的标签是跨境电商，但今天不聊跨境，聊聊试错出海小工具。


    作为程序员的朋友，可能大家关注点基本都在技术精进上，其它可能很少关注，今天的分享内容主要是围绕着技术之外的一些东西分享，不足之处，后面应该还会有迭代的，到时候再跟大家来分享。


    # 一，选哪个主战场


    主战场，主要还是先从开发难度还有开发时间两个维度来说的。


    给个参考排序：电脑PC端>=手机端Apps>Web端SAAS或网站>插件（电商类Apps，例如Shopify Apps，Chrome 插件，wordpress+WooCommerce等周边插件<即wp+woo>）。


    因为过往的跨境电商经验，优选电商类小工具，那就是shopify apps或wp+woo，但前者上架其实难度大很多，后者相对成熟一些，需要也多，例如很多shopify
    apps的需求都可以直接搬运到wp+woo上来实现。但时间卡在那里，另外还有一个点，就是快速反馈原则，即快速从0到0.5的原则，最终锁定了chrome插件这个小赛道，基本只需要javascript+css一些前端知识+服务器的知识（其实真做起来，还是有很多盲区），就能做'
  merge: -1
  img_proc: true
- pgno: 212
  md: '出来一个产品。另外这种小产品，一般只专注解决一个小需求即可。同时审核也快（差不多12个小时才审核上线，之前看一些资料，审核很快的）。


    # 二，选细分市场或需求


    选哪个细分市场或需求，其实跟跨境选品一样，往往新人觉得是玄学，其实你真动手做了第1个小产品，然后慢慢就会有感觉，但是你整天想这想那，那大概率，就没有然后的然后了。


    其实这次小工具选品，也还是走了一些固有的思维的弯路，例如最早有两条大路，电商类小工具，或wp+woo小工具，但其实等于没有，因为没有办法立马就干，还有开发人员的选择（在这里浪费了很多时间……后面再讲）。最后，是一美国的做物流的朋友，她有个小需求，即pdf相关的需求，最后付费这里也是（半买半送，后面相关的pdf需求PDFXYZ（暂时隐去插件名字，后面有公开，因为上架有一段时间），都会免费送给她一整套小插件使用）。付了两笔49.99美金（钱不多，但至少有个正向反馈，这个最重要）。'
