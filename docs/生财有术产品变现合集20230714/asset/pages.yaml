- pgno: 202
  md: '![](img/9a1e1046870132236b6927ae01b2ba90_202_0.png)


    A-Z 这样走一遍，就能筛选出大多数平台的高流量搜索词。英文好的圈友，大概第一眼就能看得出搜索出来的下拉词是什么，英文不好的，可以点进去看看结果，评估一下内容和搜索量，就可以考虑进一步研究（深挖）啦。


    基本上就是按照选定的方向，例如 Facebook、Amazon、Gmail、Ebay 这些词去做 a-z 搜索。找的方向以后，就去引擎上找长尾词，看看当前的解决方案，例如：
    how to xxxx in xxxx。一般这种词最能显示需求量。'
