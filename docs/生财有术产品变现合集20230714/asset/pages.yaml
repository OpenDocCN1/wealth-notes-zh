  md: '# 3.4 图标图像坑


    这个坑，估计大多数独立开发者，只有真的有一款小工具跑出来后才会意识到，但往往这个时候，估计你的款都有可能被扣光，如果造成侵权的话。


    前文有提到是PDF的需求，图标，朋友Y就直接用了Adobe pdf的图标，虽然辨识度极度，但这个潜在的小隐患，可能让你全盘皆输。


    也许你没有碰到过，所以，看到这个坑，会不会有夸大的嫌疑。真没有，想起N年前，第1次私模，做硅胶材质的汉堡制作工具，因为一家加拿大公司把这个细分类的常用词都注册成商标了，导致当时在亚马逊仓库的货、在途的、工厂生产的，都得换包装（还是彩盒），产品上的LOGO产品词得去掉，这样一处理，小几十万没有了。。。。。。


