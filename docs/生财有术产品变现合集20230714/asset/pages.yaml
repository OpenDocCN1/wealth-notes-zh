    # # (精华帖)(110赞)程序员的视角看问题: 想把视频转成文字, 用代码来解决, 最终实现问题的解决 + 收益


    作者: 佳恺


    日期: 2022-10-24


    大家好, 我是佳恺, 微信昵称北极, 是一名爱折腾的野生成程序员。


    因为我平时会报一些网课, 在学习视频课程的过程中, 需要做笔记, 方便复习。但是边看视频边记笔记, 遇到讲的快的地方, 速度跟不上, 反复拉进度条回看, 很麻烦,
    效率也低, 我就会想有没有可以直接把视频转成文字的工具呢?


    今天跟大家分享我是如何通过制作一款小工具实现视频转文字自动化, 解决了自己的需求, 之后验证他人的需求存在, 完成推广变现的过程。'
  merge: -1
  img_proc: true
- pgno: 96
  md: '这个项目现在的情况是，小程序累计用户12w，日IP1.5k左右，2个公众号粉丝2.7w，微信好友2k。（数据截图我在文末附上）


    变现的话，确实比较少，1个月只有4-5k。不过这个项目算是完成了从需求-产品-流量再到变现的一个全过程，希望对新手同学有帮助。


    文章内容大概分为三个部分进行：


    第一个部分讲的是从我遇到的一个问题发现的小机会，这部分想说明我们可以多从平时所遇到的问题去发现机会挖掘需求，因为是自己亲身经历过的，更深刻，也能从用户角度去思考，做成的信心也越大。


    第二个部分分成4个小节，第1小节是需求调研，我在这部分介绍怎么通过百度指数，去验证别人是不是也有这个需求，只有验证需求后，我们才能判断这个需求有多大，竞争有多大，值不值得我们花时间和精力去做这个项目。


    第2小节，工具开发这部分没有讲技术、代码上的东西，主要是想说做项目最好是快速建立mvp，然后优化迭代，这样才能快速上线获得反馈。


    第3小节，运营推广这部分主要介绍我通过微信公众号seo获取流量的过程，我认为微信公众号seo截流是也一种快速获取稳定被动流量的方式，而且从我的推广过程来看，比百度seo要简单不少，重点就是取一个包含关键词的公众号名称。


    第4小节，迭代变现这部分介绍我根据用户反馈优化工具，从这些反馈中挖掘更深层次的需求来变现的过程，其实只要解决了用户的问题，变现只是顺带的事儿。'
  merge: -1
  img_proc: true
- pgno: 97
  md: '第三个部分，是我在这个项目中的几点思考分享。


    # 一、从自己遇到的问题发现需求


    可能生财有术的圈友对商业、产品、项目、副业都比较感兴趣，了解的需求挖掘方法都比较多，之前很多高手也分享过：


    https://shengcaiyoushu01.feishu.cn/docs/doccnBEA2JShVYfOzBuhiu6Rdxe#joU9zQ


    然后，我自己做过一些项目，也用过一些挖掘方法，但是大部分还是从自己遇到的问题或者感兴趣领域来挖掘需求。特别是自己遇到的问题，解决这个问题的方法、经验、产品，很可能也是别人遇到这问题所需要的。


    这个视频转文字工具的由来，是因为我平时会报一些网课，在学习视频课程的过程中，需要做笔记，方便复习。


    之前是边看视频边记笔记，遇到讲的快的地方，速度跟不上，就只有反复拉进度条回看，这种记笔记的方式效率很低。多两次后，就感觉太麻烦了，我就想，有没有可以直接把视频转成文字的工具呢。


    然后去百度搜索，发现百度首页除了广告好像还没有能直接转视频的工具，有的是介绍怎么用ffmpeg然后结合调用百度接口转换，另外是有开发者做的一款小程序，在知乎里推广。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '不过这两种，前者对于普通用户来说，命令行操作很麻烦，而且很多人看到电脑黑框就怕。小程序也不太适合转网课这种大文件做笔记。


    我隐隐感觉这是个**小机会**，可以做成**小工具**，既能解决自己的问题，说不定还能帮助到其他人，顺便卖出去赚点儿小钱。


    # ## 二、项目全过程


    # ### 1. 需求调研，通过百度指数，验证需求是否存在


    当然，如果只是解决自己的问题，直接干就是。因为我已经有了做工具的念头，所以还有一步是必要的，验证别人是不是也有这个需求。


    平时我验证需求主要还是查各大平台的指数，百度指数、微信指数，5118之类的。因为如果关键词有指数，说明极大概率别人也在搜索这个词。


    当时去百度指数查询了“**视频转文字**”这个关键词。写这个分享的时候我查了下，这个词显示未收录。不过当时这个词的指数在**200~300**这样，说明其他人对视频转文字也有需求，而且指数比较低，竞争肯定相对语音识别小很多，推广起来要容易些。


    关于指数的查看方法，先进入百度指数官网 index.baidu.com，在输入框里输入想要查询的关键词，点开始探索，我当时查的是“视频转文字”，现在没了，我们随便输入一个“小罐茶”，可以发现平均有**1000**的指数。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '但是我们怎么去判断这个词需求到底大不大呢，这时我们可以输入一个熟悉的一看用户就很多的词，比如“王者荣耀”，这个词指数是5w多，这样对比能大概看出自己关键词在什么量级上。


    ![](img/9a1e1046870132236b6927ae01b2ba90_99_0.png)


    其实除了用百度指数查，我更推荐5118这样的关键词分析工具，它的数据比较全面，使用方法类似，我用5118查出来的“视频转文字”的数据。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '![](img/9a1e1046870132236b6927ae01b2ba90_100_0.png)


    # 2. 工具开发，先完成，再优化


    确定好需求后就是工具的开发，然后我个人的理解是，作为个人或者小团队在最初开发产品的时候，最好是把精力集中在满足用户最核心需求上，先完成，跑通流程，再优化。


    就像这个视频转文字工具，虽然前后开发了三个版本：电脑版、小程序版、网页版，中间经历了很多次升级优化。


    但是最初，我只写了一个很粗糙的电脑版，推广出去，有了用户之后，再根据用户提出的问题和建议，优化迭代出小程序和网页版。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 3. 推广运营，我采用的被动获取流量的方式


    工具完成后，接下来就是怎么推广了，推广方式很多，我还是更喜欢seo。


    我理解的seo不只是百度或者google，只要是通过搜索引擎获取流量应该都算是seo，比如抖音、知乎、微信、b站都有搜索功能，有搜索的地方就可以seo，对吧。


    # ① 通过seo获取被动流量


    因为不太喜欢到处发广告，希望最好是用户有这个需求，然后通过搜索找过来这样，也不会打扰到不需要的人。所以选择了seo被动获取流量。


    我开始用wordress搭了个博客，设置好网站标题，写了几篇标题和内容包含“视频转文字”、“视频转文字工具”介绍软件和使用方法的文章。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '不过百度seo周期很长，一会儿也看不到效果，所以就在想有没有其他的推广方式。刚好 那段时在生财有术看到了公众号seo截流的文章，也是可以获取被动流量的，就按照文
    章里面的内容操作起来了。


    先在微信指数上面查看“视频转文字”的指数，发现没收录（现在有了）。但是，我想， 百度有人搜索，微信这么大的用户量，也一定有人搜（还好当时百度有百度指数），可
    能是没人提交，管他的，先试一试。


    我把公众号名称设置成“视频转文字工具”，然后把简介设置成视频转文字、视频转文字 软件之类的，菜单也设置成关键词，又写了几篇标题包含这些关键词的文章介绍工具使
    用方法。


    公众号seo起效果比百度快太多了，没过几天，就开始有关注了，刚开始每天只有几个， 然后涨到10来个。


    前面说到想卖给其他人赚点儿小钱，这时我在生财有术看到包括亦仁大大在内的好几个 大佬都提到利他、长期主义这两个词，深受启发。


    想到接口费用一年也用不到多少钱，决定干脆就直接免费，赚个人气，人气起来了，后 面应该有变现的机会，不着急。


    所以在简介和文章上都用上“免费”的字样。慢慢的公众号排到了首页，每天稳定有40、 50个关注。'
