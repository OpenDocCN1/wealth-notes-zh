    | 3 | 插屏广告 | 页面切换、按钮触发 | 不改变页面布局，插入方便 | 弹窗式干扰较强 | 30 | ★★★★ |

    | 4 | 激励视频广告 | 任务解锁、奖励型兑换 | 收益高，信息流广告，内容丰富表现力好 | 强制性看完，完整性不能保障 | 60 | ★★★★★ |

    | 5 | 视频广告 | 页面留出固定广告位 | 信息生动，信息流广告，受众可更下沉，很适合内容型小程序 | 自动播放，需要投入广告时间 | 20 | ★★★
    |

    | 6 | 视频贴片广告 | 需要视频内容播放器 | 植入自然，在视频播放前展示 | 默认有声播放，不可暂停 | 20 | ★★ |

    | 7 | 封面广告 | 启动小程序时展现 | 不区分用户，保底收入 | 打开小程序即可看到，播放5秒可跳过 | 40 | ★★★★ |

    | 8 | 格子广告 | 页面留出固定广告位 | 适合游戏集中式推荐，只服务小游戏 | 广告植入的融合 | 10 | ★★ |

    | 9 | 原生模板广告 | 页面留出固定广告位 | 可结合页面主内容进行融合设计 | 内容样式更和谐 | 20 | ★★★ |


    注：关于推荐指数的星级，没有不好的广告形态，只有不好的运用场景。这个星级是反映适用面和收益的综合考虑。


    # ## 四、小程序流量主广告优化策略


    接着我们聊聊，当你已经有一个线上稳定运行的小程序产品，并且也接入了流量主广告。那么如何提高广告收益呢？这也是本文的重点。'
