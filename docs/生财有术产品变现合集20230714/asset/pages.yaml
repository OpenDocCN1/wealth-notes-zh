  md: '最终手上沉淀下来3个开发者账号和1个备用账号，矩阵内同时在线的APP数量也超过了200个，每天纯自然流量下载5000+，累计下载量500万+，日活用户2万+，日启动次数20万+，这个数据超过了一些互联网公司的用户规模。


