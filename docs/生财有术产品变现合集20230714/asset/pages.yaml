  md: '插件功能很简单，就是获取速卖通的订单信息，生成一份可打印的发票文件（PDF）。功能实现起来不复杂，基础班的价格是 20 美金...目前插件已经很久没有有人在维护了，看了一下
    Rate 里的大部分竞品，评论也很多是 not working（说明有需求，但是没法解决，直接对标开发 1 比 1 复制，很容易推广的）。


    这个需求属于比较小众吧（问了一下做速卖通的朋友，说是没这个需求），所以这个方向，我没有深入下去调研，感觉这种就挺适合新入手开发插角的圈友练练手。


    # 关于免费插件如何盈利：


    在挖掘需求的时候，一定会注意到有很多插件是免费的。不用猜它们怎么盈利，这些插件大部分就是为爱发电的（作者的爱好、炫技或者是看不上这点微薄收入......这也是为什么商店里有很多不再维护的插件......）


    当然，也不是说免费插件就没法盈利，只是方式更复杂一些：


    +   1. 带流量给自己的网站，再通过其他产品转化（有一家开发商，专门开发免费的插件，导流给自己 的小游戏）。


    +   2. 引流售卖商品（Tabby Cat，一个宠物标签页，通过独立站售卖周边贴纸盈利）


    +   3. 增值服务（插件获取到的数据云同步功能）


    +   4. 通过联盟链接赚分佣（挖需求发现有一款免费插件，评论区都在说会自动打开天猫超市......作者大概是淘客吧）


    +   5. 引导点击广告（这种插件一般都会被骂..................）


    # 做好心理预期：


    刚开始做插件的圈友一定要做好心理准备，你的第一个插件可能会：因为各种奇怪的问题审核被拒、开发完发现版本不能上架（MV2 版本不能上架了）、遇到问题在网上搜索到了解决方案却没效果，上线了却没有用户等等。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '这也是为什么我建议先开发一个简单的免费插件，体验一遍完整的流程。不过遇到了也不要气馁，事后做好复盘，争取下一次更好，这种事情就像是亚马逊刷单被抓，Facebook
    广告账户被封一样……没有经历过也不算一个真正的插件掘金人吧～


    # 二、 摆脱技术依赖、 快速开发 MVP 产品


    开发插件，主要是为了帮用户解决问题，怎么解决不重要。在需求挖掘的时候，我习惯在确定一个需求可行的时候，先去简单研究一下实现。也就是看有没有可以直接拿来用的库，如果没有的话，评估一下自己去实现复不复杂。


    比如这个插件：


    ![](img/9a1e1046870132236b6927ae01b2ba90_206_0.png)


    看到这个插件的第一反应，就是可以用库（FFMPEG）实现一个一模一样，甚至更好的工具（比如我叫他 Media Converter，音频、视频、图片都能转…………甚至视频抽帧、图片转视频，都很简单），自己只要做一个界面，预置好转码的参数就可以直接上架了……'
  merge: -1
  img_proc: true
- pgno: 207
  md: '开发之前，建议整理一个 todo list，把需要开发的功能一项一项的列出来，然后一行一行的删除掉，只留下最核心的功能，先完成一个 mvp 版本，让自己有个东西去做推广，表现不错再做细致的补充。


    **补充一点：**不用太在意使用什么技术去做插件，插件是最简单的网页程序（HTML+JS+CSS）。会开发用自己熟悉的技术栈，不会开发可以和圈友一起合作生财。打算自己研究开发，简单学习一下前端三剑客就可以直接上手了。


    # ## 三、上线扩展


    开发完成，上线扩展第一个面临的问题就是开发者账户。


    直接注册账户，绑定信用卡，支付费用，你很大可能会遇到支付失败的问题。这个大概是 Google 内部的问题，在绑定支付卡以后，关闭并重新打开页面，这个问题就解决了（当时查了一下，没有查到任何说是银行拒绝了交易，大部分都是重进页面就能解决，我也是按照这个方式，绑好卡以后，关闭重开就能支付了）


    实在解决不了，可以在万能的某宝多花点钱解决～


    之后可能会遇到的第二个问题就是：**插件版本不对。**


    Google 扩展分为 v2 版本和 v3 版本，目前商店已经是不允许 v2 版本上线了，然后网上有很多教程都是 v2 版本……这次航海就有圈友踩到了这个小坑。


    ![](img/9a1e1046870132236b6927ae01b2ba90_207_0.png)


    因为版本问题被拒绝'
  merge: -1
  img_proc: true
- pgno: 208
  md: '遇到版本错误无法发布不用太紧张。升级版本并不复杂，只要没有使用到被取消的功能（引用外部JS），基本也没有多大的问题。


    上线扩展的最后一项就是审核，审核需要描述大致的程序功能（也就是前面提到的单一功能），为什么需要使用到某些权限（每一项权限都要做出单独地说明），如果需要收集用户数据，还需要提供隐私声明。申请了权限没有使用，需要但是没有提供某些内容，都是会被拒绝掉的。


