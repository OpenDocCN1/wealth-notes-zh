    # 三，想与做的各种坑


    # 3.1 招人坑


    这里浪费了好多时间，一是具体需求没有太多确定，就去招人，而且还是在国外平台上，一是fiverr，二是upwork等freelancer平台。


    有些事，只有你真正做过了，才知道这里的坑有多少。就像这个Chrome插件PDFXYZ，看似简单，里面还有几个难点需要一定经验，或者是主动解决问题能力的程序员才能搞定。'
