  md: '但他并不知道，所以需要做产品的人更深的挖掘一层，想到用户前面。


    类似的事情还有很多 ——


    明白，帮我抓下 XX。


    哦，你要做什么？


    我要用这个 XX，


    哦，这个不需要爬虫，你去做 XX。


    哇，太棒了。


    产品一定是给人用的，所以，我们需要了解用户的真实想法 ——


    +   - 用户想要什么功能？


    +   - 用来自什么事情？


    +   - 他们现在是解决这个问题的？


    +   - 他们是否愿意付费？（先收定金，完成 MVP）


    +   - 能不能作为种子用户，邀请来做内测？


    这些事情，我们都可以在市场分析阶段，在开发产品之前，全部搞清楚。


    （3）为产品营销推广做准备


    在知识星球，经常看到有人问，我做了个产品，该怎么推广？


    其实产品推广这个动作，可以在做产品之前规划好。


    你可能会疑惑，产品还没做，怎么就能想清楚如何推广？


    一句话：想不清楚如何推广的产品，没必要做。


    我们做一个产品，在市场分析阶段，不仅就要分析产品是否符合用户需求，还要想清楚，


    目标用户在哪里？


    我该如能触达他们？


    我用什么理由说服用户付费？


    这点和上面第 2 点类似，后面介绍如何做市场分析时，会具体介绍。


    # 3 如何做市场分析？'
