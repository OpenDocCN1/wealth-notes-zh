- pgno: 28
  md: '做iOS、Android的App很慢。首先，它们编码过程比做网页复杂，编码能力要求也更高；其次，上线还需要打包、提交审核，审核还可能不通过，时间成本很高。如果你做的是国内App，那就更慢了，你还需要花3个月的时间拿到软件著作权证书，才能够上架国内的应用商店。更讨厌的是，当你想修复小bug，你不得不重新发版，用户还得升级安装的App才能使用，这会严重拖累你发布bugfix的效率。


    做国内网站，也很慢，你需要域名备案。域名备案，周期大约是1~3周。如果你是在一些要求特别严格的城市比如北京，备案还经常被打回。


    做微信小程序，比上面两个略好，但也慢。它的问题是：微信小程序开源生态不够大，有很多轮子需要我们自己造，难以直接引入开源代码加速我们的编码过程。


    做海外网站是最快的。它不需要软件著作权证书、不需要域名备案、不需要应用商店审核、软件有更新的时候用户不需要重新下载App。代码放到Github仓库里，通过Github
    Action做CI/CD，实现一提交代码就立即自动上线的效果，开发体验倍爽。


    需要指出的是，“从网站开始”，不意味着你的产品永远都是一个网站。只不过MVP阶段是网站而已，当你接受到足够多的用户数据反馈之后，你再去为它做微信小程序、iOS
    App，永远都不迟。


    再说第2点。关于MVP功能的取舍。


    如何取舍呢？提前想好需要验证的内容是什么，然后，只围绕它来做开发。和它无关的，完全不做。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '如果你想验证“我发明的某个牛x功能，是否有人使用”，那你根本不需要做用户注册、用户登录、用户支付，只做那个功能就行了。然后你观察的核心数据应该是“回头客比例”，如果你流量占比中回头客比例不错，说明用户使用它，是因为你的产品真的有用、而不是随便看看。


    如果你想验证“我的某个产品，是否有人愿意购买”，那你连功能都不用做。把卖点列出来、放上付款链接（甚至只放一个收集邮箱的输入框也行），然后去买搜索关键词广告，测试付费转化率。对，你观察的核心数据是付费转化率，当付费转化率大于30%时，你再考虑把它从MVP变成真正的产品。


    注：搜索关键词广告，是最精准的广告，所以此处要求的付费转化率门槛特别高。如果流量来自其他渠道，可以放低要求，但也不建议低于5%。


    # 三、你有案例吗？


