- pgno: 236
  md: '# 1、流量主收入公式


    首先，我们来看流量主的收入公式：**单个广告位的收入=广告曝光量/1000 \* eCPM**


    +   - 曝光量 = 看到广告的人次 x 看到广告的次数。

    - eCPM = 广告千次曝光收益。


    简单来说，广告的曝光越多，收益就越高。而 eCPM 是动态变化的，跟当前的广告主出价（竞价投放或CPM投放的影响）、竞争激烈程度和用户的行为有关系（有效点击）。


    从广告的曝光量来说，两个指标：看到广告的人次和看到广告的次数。这么说，宏观层面，提升广告收益的**根本是提高日活、停留时长和留存**。微观层面，则必须修好内功。


    # 2、流量主产品内部优化策略


    根据上述的流量主收入公式，曝光量的提升，可以从曝光率和曝光次数来提升。也看如何提高 eCPM。以下分为七个方向，来针对性介绍，该如何修理内功：


    # 2.1 因地制宜：选择合适的广告位与控制


    看完《微信广告-流量主成长营》的系列课程，摘录了这个笔记：


    内容类型用用户流程拆解，注意对视频类型可接入视频广告和视频前贴广告，若有精品内容，可通过设置激励式广告代替付费购买，观看视频而解锁内容阅览权限。'
  merge: -1
  img_proc: true
