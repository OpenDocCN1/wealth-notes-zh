- pgno: 94
  md: '# **Q: 为啥不搞安卓，只做iOS？**


    **A: 我的精力实在有限只做了iOS，安卓用户体量更大，确实可能大有可为。**


    不过有几点要注意：安卓自然搜索下载的比例远低于iOS、安卓上架前需要注册申请软著权、需要自己搞定资金账户和开发内购功能、**admob**在国内安卓基本不可用需要有企业资质来对接广点通等广告平台。


    同样的，如果你能解决这些问题，这些都将成为你的竞争壁垒，安卓当然可以搞啦。


    # **Q: 为啥不搞小程序要搞APP？**


    **A: 站在公司角度我也常说，不要APP要搞小程序，因为私域运营已被验证有巨大价值。**


    但从个人副业来看，综合衡量运营能力、竞争烈度、审核推荐机制、商业变现的路径...小程序和APP各有所长，并非是同一个赛道。至少小程序总包大小不能超过20M就已经限制了很多奇思妙想，当然如果有成功案例也欢迎分享探讨
    😊


    以上，一点点过往的经验分享，希望大伙能有一丝丝启发 💡


    我是胡不归，身居苏州的一枚85后全职奶爸，欢迎各大佬来撩，~~以及推荐工作。~~


