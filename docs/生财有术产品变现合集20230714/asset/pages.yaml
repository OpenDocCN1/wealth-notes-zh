    # # (精华帖)(78赞)为景区搭建语音导览系统，实现被动月收入 2W+


    作者：雨辰


    日期：2022-01-25


    > 景区里不难发现有很多电子版的导览，扫码就可以听关于景点的介绍，非常方便。


    > 你是否有想过，关于景区导览，有你没想到的机会。


    生财有术的朋友们大家好，我是雨辰，90后创业者，主要做 H5 营销 SAAS 工具。2019的时候，我做了一个景区语音导览系统，实现了被动月收入 2W+。这个项目门槛较低，前期只需要制作音频、程序开发、服务器三个部分花费成本，后期可以源源不断地获得被动收入。今天，我想把自己做这个项目的经验分享出来，希望能给看到的你带来'
