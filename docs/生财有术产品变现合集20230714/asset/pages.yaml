- pgno: 165
  md: '我相信，对于任何产品，人人都能说出个所以然，人人都是产品经理已经说了那么多年，但不要激动，先克制，翻出最小可用产品（MVP）的设计理念进行思考。


    ![](img/9a1e1046870132236b6927ae01b2ba90_165_0.png)


    ![](img/9a1e1046870132236b6927ae01b2ba90_165_1.png)


    例如：


    +   1. 你要做一个自动化的工具，先不要考虑给用户各种设置，只需要给一个开始和结束按钮就够了。


    +   2. 你要做一个电商店铺分析工具，先不要给用户各种过滤条件，把店家最关注的数据先呈现出来就行了。


    减法，持续做减法，减到用户可以不用去思考如何使用你的产品！'
