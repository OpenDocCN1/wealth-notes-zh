- pgno: 152
  md: 'AirBnB，最初是创始人没钱交房租，开始做租床位的生意，提供租空气床垫（Air Bed）和早餐（Breakfast）的服务，这也是AirBnB名字的由来——
    Air Bed and Breakfast


    BuiltWith，对，就是最近挺火、全公司只有1个人、每年收入1400万美元那个产品。最初也是来自于创始人自己的需求。创始人经常看到别人的产品，想知道这个产品是用什么技术栈做出来的，然后就自己做了个产品来解决这个问题。


    说一个更近的。生财有术，最初是亦仁想找一个供创业者交流的社区，发现并不存在这样的社区，于是自己建了一个。


    再说什么一个接地气的，nomadlist.com ， Peter Levels自己是个数字游民，想知道全世界有哪些城市适合数字游民居住，所以自己做了一个Excel表格。Peter偶然发现，自己的表格被有很多人传阅，才决定把它产品化。
    后来，世界上出现了无数创业公司，拿着更多的钱、更多的资源、更多的人，想要山寨它，但都没有人能打败它。 因为 Peter 本人才是最懂数字游民需求的人，这个产品，解决的是他自己的需求。


    这套方法论为什么成功率高呢？因为它完全符合我们刚才说的三个条件


    +   1. 有真实需求存在。这个需求，它就是来自于你自己。


    +   2. 你是这个领域的专家。你自己有痛点，花了很多时间去研究，发现市面上其他方案都不能满足你，你最懂你需要什么。 如果有一天，别人觊觎你的成功，想要山寨你，你作为专家，你也并不怕。


    +   3. 你能坚持下去。 为什么能坚持？因为你自己就是它的用户，你自己由衷地希望把它变得更好。'
