- pgno: 238
  md: 'A: Banner 尺寸小巧精悍，视频广告占地面积大，Banner 的应用面更广。更关键的是：如果该页面用户的停留时间短，视频广告无法得到完播，eCPM
    也就不高。即用户停留时间短的页面不适合放视频广告。反而是 Banner 广告的收益更高。


    # Q: 选择「格子广告」如何，怎么用？


    A: 考虑你的用户受众了，「格子广告」只服务小游戏，点击跳转的均是小游戏。 如果你的用户与游戏人群画像不符，格子广告的点击率可想而知，点击少，eCPM 就偏少。收益不高。


    ![](img/9a1e1046870132236b6927ae01b2ba90_238_0.png)


    # Q: 插屏广告如何利用？


    A: 插屏广告适合在用户体验流程结束或切换时插入，减少对用户体验流程的打断。最直接的是进入「首页」就展现，这是曝光最大化。考虑到用户干扰，可以设定规则，比如时间控制（一个小时内首页只展现一次插屏），身份控制（VIP
    用户免广告），还有新老用户差异对待，新用户暂时免广告？若次日留存低于 10%，一次性用户居多 的话，那就还是想想提升留存吧。


    # Q: 激励视频怎么加？


    A: 激励视频可以通过解锁主流内容、让权益奖励加倍、设立用户分级激励体系等丰富激励场景，鼓励用户解锁这个奖励；无论是虚拟的会员奖励，还是实物电商，只要广告收益（eCPM
    60 左右）与投入的比较可控，这不失为一个促进用户活跃还能创造收益的好方法。'
  merge: -1
