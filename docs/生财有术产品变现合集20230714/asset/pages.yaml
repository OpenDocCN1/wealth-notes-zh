    # 鼓浪屿钢琴博物馆一期展馆


    ![](img/9a1e1046870132236b6927ae01b2ba90_143_1.png)


    鼓浪屿钢琴博物馆一期展馆  建于2000年7月8日


    游客到景区旅游肯定会有听讲解的需求，但找真人导游费用不低，电子导游是个不错的选择。


    电子讲解可以理解为和知识付费的音频课一样。这些讲解内容是现成的，把内容收集起来，做一个简单易懂的语音导览页面，游客是否愿意为之付费呢？


    旅游回来后，我就关注了上百个景区公众号，研究这块是不是已经有人在做 了。


    果然，这一块已经是很红的红海了，基本上稍微大一点的 4A、5A 景区都有自己的导览，一小部分是自 己开发的系统，但界面和可操作性还是差强人意；大部分用的第三方导览系统，有几个平台做得还是挺不错的，比如：携程、金牌讲解、三毛游、古猫等，功能都特别强大，而且付费购买的销量都还挺高，每个景区付费区间在
    5~20 元左右，可以大概估算出每个景区的收入情况，大一点的 平台合作的景区都是几百上千个，累计'
