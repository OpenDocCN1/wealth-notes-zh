  md: '# 2.2 提渗透率：提高广告被看到的次数


    提升广告在产品里的渗透率，就是加广告位：-) ，这个道理很浅显，但却有效。难点在于 平衡用户体验和商业价值。Banner和广告需考虑现有产品的设计空间，得留出广告位置；而插屏广告的弹窗接入灵活，但用户的注意力影响较高；激励视频，则往往入口比较深，需要按钮或场景触发。另外，平台做了限制，一种广告类型只能出现在一个页面。但可以多种广告类型的组合呈现。


    怎么加，方法不限如下：


    +   1.  开启「封面广告」：封面广告，是2020年12月上线的，在小程序后台-流量主 开起来试试？体验或效果不好，次日看到收益，一键可即时关闭，这个试错成本是极低的。


    +   2.  创造「激励视频」：激励视频广告的收益最高yyds，常规工具和内容型产品可接入任务系统，创造激励视频的场景来提高收益。


    +   3.  H5页面小程序化：如果你的小程序有内嵌H5的页面，此页面的访问量较高，则适合改成小程序原生页面，才可以有增加广告位的可能性~


    +   4.  完成页与弹窗优化：以工具型产品为例，一个任务的进程完成时，往往有一个完成页，该页面很适合植入广告。同理，「小游戏」游戏过关提示弹窗，作为一个停顿场景，弹窗的底部往往加入一个banner或格子广告位。据微信小游戏自称，大量游戏接入Banner组件后，利用率和收入有明显提升20%+。


