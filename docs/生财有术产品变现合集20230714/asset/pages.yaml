  img_proc: true
- pgno: 144
  md: '在一起对平台来说是一笔可观的收入。平台只需要前期投入音频的录制和系统搭建，上线后基本不用维护，是个一本万利躺赚的生意。


    既然鼓浪屿这种 5A 景区有这种简陋的导览，那么一些小景区可能连语音导览都还没有。当天我就在网上找了个类似业务逻辑的源码框架，用了大概一周时间开发出来一个
    MVP，核心功能就是：**付费听音频 + 分销赚佣金**。


    ![](img/9a1e1046870132236b6927ae01b2ba90_144_0.png)


    整个系统搭建好后，接下来开始搜集资料、制作宣传 PPT、注册公众号、买域名、搭建官网（就是个静态单页 + 表单收集意向客户）、注册商标，一切准备就绪，开始正式推广。


    前期我们合作的模式是：景区不用花一分钱，只需要提供讲解稿 + 景点图片给我们，我们负责录音 + 系统搭建 + 设计好展牌二维码，景区自己印刷出来投放景区，游客扫码付费听解说，所得收入五五分。'
  merge: -1
