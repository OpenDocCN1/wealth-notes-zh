- pgno: 240
  md: '广告拉取是指符合当前用户能够有资格拉取到广告，但因为广告位的限制，不一定有曝光。（比如一个页面加载完毕，虽然广告拉取了，但 banner广告在页面底部，用户没有滑到底部看，也就没有曝光）。


    把广告位置稍微前移，即可有效提升。能在第一屏，就不在第二屏，用户是懒的，未必能够滑到底部查看广告。——比如上述案例里，「糖豆视频」小程序在首屏就植入了一个广告。


    # 2.4 提点击率：激励广告前的文案提示


    这个微操细节，能够让转化更好。把这个单独拿出来讲，因为激励视频的奖励是需要完整看完视频才能发放，激励视频在 15s -60s 之间（后台可以选择两个时间段，15s
    - 30s 与 30s - 60s ），若用户未完整播放，那么曝光量也就下降来了。


    常规的是在 UI上增加 视频图标，让用户感知到这里是一个「视频内容」。可进一步让用户有耐心看完、提升完播率也即提升曝光量，增加弹窗文案提醒极有必要。'
