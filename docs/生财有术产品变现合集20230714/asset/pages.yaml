  md: '# 【需求挖掘】3篇


    # # (精华帖)(309赞)如何获得产品 idea


    作者： 刘小排


    日期： 2022-11-10


    大家好，我是刘小排，好久不见。


    我是一名机器人从业者，在一家头部的服务机器人创业公司担任产品总监。同时，周末的时候，我偶尔会手痒，会变身独立开发者，折腾一些小产品。


    这是一篇写给独立开发者、创业者的文章。


    在我看来，一个高成功率的产品idea，需要满足三个条件。


    +   1. 有真实需求存在


    +   2. 你是这个领域的专家，即便是直面竞争，你也能比对手做得好


    +   3. 你能坚持下去，尤其是早期缺乏正反馈的时候


    我们按照这三个条件，来构思寻找产品idea的方法。


    我一共总结了五种常见的方法，他们的成功概率递减。（我的个人观点）'
  merge: -1
  img_proc: true
- pgno: 150
  md: '它们分别是


    +   1. 原生idea ★★★★★

    2. 抄成功竞品，然后做出差异化的价值点 ★★★★★

    3. 分析搜索关键词，找到尚未被满足的需求 ★★★

    4. 有人愿意预付费找你定制某个需求，然后你将它产品化 ★★★

    5. 生造的idea ★


    展开讲讲。


    # 一、原生idea


    英文原名"organic idea"。这是硅谷创业界最推崇的方式，被众多科技界创投界大佬认可。


    "organic idea"的意思是—— 解决你自己遇到的问题，你自己就是它的用户，你会每天使用自己的产品。


    这个词似乎最早出现在硅谷创业教父Paul Graham的文章中。


    他说，


    构思产品idea的动词，应该是"注意到"，而不是"想到"。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '> The verb you want to be using with respect to startup ideas is not "think
    up" but "notice." At YC we call ideas that grow naturally out of the founders''
    own experiences "organic" startup ideas. The most successful startups almost all
    begin this way.


    “我注意到，有么一个问题，可以这么来解决” 而不是“我想到了一个创业idea”。


    原文链接 [http://paulgraham.com/startupid es.html](http://paulgraham.com/startupid
    es.html)


    其他版本的表述还包括——


    矽谷科技创业圈最著名 的话：**eat your own dog food**， 吃自己的狗粮。（意思是，你需要是你自己产品的用户）。这句话在过去50年的时间内，被无数公司无数大牛引用。


    世界最顶尖的独立开发者 **Peter Levels** 在自己的著作《**Make**》中说：**The most important thing is
    to find ideas from solving your own problems** .  在书中，他还建议大家每天记录3个自己遇到的问题，这样的话，一周以后，你就有21个产品idea了。


    世界上有很多创业成功的公司，是这套方法论的产物。


    苹果公司，起家于组装个人电脑，给谁用？给自己用。这是沃兹的个人爱好。


    Facebook，最初是小扎自己想用的一个小网站，给学校女生打分的用的，产品名叫"hot-or-not"'
