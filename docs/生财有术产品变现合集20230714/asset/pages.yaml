    # 六、我做了好几个产品，一直失败，怎么办？


    答案是：挺好的，你需要提高失败的速度，然后，继续尝试。


    我很喜欢玩德州扑克。


    最早的时候，我认为它是数学游戏，它的获胜诀窍是“计算概率，只在赔率合适的时候下重注”。'
