- pgno: 65
  md: '![](img/9a1e1046870132236b6927ae01b2ba90_65_0.png)


    几个月枯燥的重复，我手上有了十几个各种图集APP。每月睡后收入也来到了2000左右，刚好每日早餐和通勤费用。


    +   **期间遇到的问题：**


    1. 苹果审核不通过，应用过于简单或者判定抄袭

    2. 没有下载量，每天个位数下载甚至每周个位数

    3. 免费时有人下载，转付费后归零

