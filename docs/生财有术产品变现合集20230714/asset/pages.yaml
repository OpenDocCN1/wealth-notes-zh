  md: '+   1. **APP**可以 不依赖个人服务器，所有资源全部打包上传给苹果做下载分发，**免费**、稳定、**不限量**。


    # ### 3.从1到N的过程


    初尝甜头之后，开始每个周末都花半天时间去咖啡馆重复这套流程：


    +   1. **搜集图片资料**

    2. 把图片拖到**Xcode**里**生成APP**

    3. **制作APP**图标（比较简朴，有些甚至就是**XX图集**几个大字）

    4. 参照其它**APP**起名字和编写关键词

    5. **打包上传等待苹果审核**

    6. 把**免费下载**改为**付费下载**'
