  md: '# H5 【搜集资料制作APP】


    根据源码支持的文件类型，在百度（淘宝效率更高）上搜索“道藏 epub”、“道藏 pdf”、“道藏 txt”，下载对应格式的内容文件生成APP。


    epub源码参考： [https://github.com/FolioReader/FolioReaderKit](https://github.com/FolioReader/FolioReaderKit)


    pdf源码参考： [https://github.com/Alua-Kinzhabayeva/iOS-PDF-Reader](https://github.com/Alua-Kinzhabayeva/iOS-PDF-Reader)


    txt源码参考： [https://github.com/coyingcat/TxtReader](https://github.com/coyingcat/TxtReader)


    注：每吃透一套源码，就相当于多开辟了一条赛道。


    # H5 【APP发布上架】


    你需要准备APP的名称（建议23字以内）、副标题（建议15字以内）、APP搜索关键词（100个字），这三项是搜索自然流量的主要来源，可参考市场同类APP进行调整优化。


    此外需要准备APP的图标（可用图怪兽或者PS简单制作）、APP的展示视频或截图（Xcode开发工具自带模拟器，可直接录屏和截图）、APP的介绍描述，这三项决定用户在搜索之后，是否会下载你的APP。


    按流程提交上架审核后，新手往往会遇到一些问题，善用网络搜索，逐一解决击破即可。'
