  md: '![](img/9a1e1046870132236b6927ae01b2ba90_87_0.png)


    # Q：搞iOS APP必须是程序员么？


    A：否，我自己也不是程序员，但至少要完整的看一遍iOS开发教程，同时有快速学习和解决问题的能力。反而很多程序员并不适合做。


    我接触过不少程序员，太过专注于代码或者眼高手低，编程上的优势往往弥补不了在需求洞察和营销推广上的短板。当然你也可以找个程序员当技术合伙人，各取所长赚钱了一起分。


    # Q：电子书APP还能做么？


    A：目前依然有在做的。一部分是经典图书如世界名著系列，流量很稳不过竞争趋于饱和，做的话需要有差异化。另外也有愿意承担风险赚超额收益的，比如披着各种马甲的笔趣阁APP。


    # Q：哪些类目的APP可以搞？


    A：发挥你的想象，多用七麦网站（qimai.cn）看看市场情况。在各大平台火热的内容，问问自己在未来几年内是否会有用户持续搜索。'
