  md: '# 3、小游戏产品 举例：


    流量主的应用，往往小游戏比小程序做的好。同时，小游戏通过「广告主」买量异常凶猛的，小游戏的竞争激烈程度要远高于常规的小程序。访问不少公司研发了矩阵小游戏产品，通过流量主广告变现。


