  md: '码叔在生财有术做过分享，这正是他的方法。他从6月自学Google插件开发以来，半年时间已经变现了好几十万，他的方法可以复制。他总是从定制需求开始，从来不自己造一个idea。


    某人有个需求，知道码叔会编程，就付费让码叔定制开发。然后，码叔就想办法把它产品化，卖给更多的人。


    十年前，我在一家软件外包公司工作。这家公司主业是接欧美软件外包，但是高明的老板，从一开始就意识到了这套思路。既然有客户愿意花钱让我们做，那我们何不试试把它标准化，卖给其他客户呢？他们也时不时推出一些小型的SaaS产品，有些也取得了小成。


    （这家公司叫重庆诺怀软件科技有限公司，到今天也还在运转，我是它的一个小股东）


    国际上更著名的案例是Typeform和Basecamp，他们最初都是软件外包公司，然后从客户的需求中，找到了共性需求，再将之产品化。以下是创始人的原话。


    > **Typeform was born out of a client project (..) [that] required us to build
    a lead generation form that would sit inside an exhibition space for a toilet
    company (..) we had to create something more inspiring to collect data than just
