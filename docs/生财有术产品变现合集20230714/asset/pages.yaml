- pgno: 246
  md: 'A: 每次小程序审核，广告位均需要审核，并且广告位审核被拒的影响不小——如果小程序的广告位审核被拒绝，那么直到下一个版本的广告位审核通过之前，线上小程序将全部不展现广告。
    也就是说，万一审核拒绝了，当下广告位即看不到了，需要重新提审一次小程序，并等待广告位审核通过后才能继续正常展现广告。


    # Q: 常见的广告位驳回的原因有哪些?


    A: 接入广告位时，主流机型的适配是简单的，就是别要小聪明：通过文案引导或故意使得按钮遮挡广告位，使得用户点击或误触Banner广告。或者修改Banner组件的样式，来进行一些欺骗诱导点击。这是常见的广告位被驳回的场景。
    另外诱导升级VIP会员可以免广告，也是不允许的~


    # Q: 什么样的广告会出现在「我的小程序」?


    答：通过广告主端的创建广告 - 选择推广目标，我们可知目前微信广告提供 8 种推广目标，分别为：推 广 品 牌 活 动、推 广 我 的 门 店、推 广 我
    的 应 用、推 广 我 的 商 品、推 广 我 的公众号、派发优惠券、收集销售线索、推 广 我 的 小 游 戏。


    小程序里出现最多的广告类型是标黄底色的这几个：品牌活动、应用（尤其是安卓端）、商品、公众号、小游戏。


