- pgno: 160
  md: '# ## (精华帖)(95赞)小众产品的起点——需求挖掘（进阶篇）


    作者： 壹树


    日期：2022-06-17


    痛点、需求、问题、竞品、用户、数据、产品等名词一般都会在产品经理脑海中来回浮现，如何把这些东西串联起来，才是我们需求的最终答案，也就是可能在我们手中诞生的产品。


    每个人都有自己的问题解题思路，常言道：条条大路通罗马。选择一条自己熟悉的道路会让自己的工作事半功倍。


    道路千万条，套路第一条！下面尝试把我的套路走一遍，有可能对你们来说是弯路，但目前对我来说是最习惯的路子，因为思考方式已经养成了，会在好奇心的推动下不停地探索。


    # ### 套路逻辑顺序


    套路的逻辑顺序是这样的：平台 → 用户 → 问题 → 需求 → 竞品 → 数据 → 决策 → 产品。


    以上的顺序是本人做浏览器扩展程序小产品的套路，其他，如：IOS、安卓可以参考然后自我调整。


    # #### 1、平台


    很多时候，我们在互联网冲浪是漫无目的的，很容易迷失。我们需要把自己限定在某个区域，为我们最终的产品选择一个起点。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '首先选择一个平台，这个平台不是随便盲目去选择，我们应该是选择一个有足够多用户的平台，例如：选择全球排名 200 的网站，或者选择某个垂直领域排名前 10
    的网站。因为当平台有足够多的用户，即使我们只解决了当前平台的 1% 用户的某个问题，依然有足够多用户，而且我们在后期做投放推广的时候，也有一个固定用户群体标签。


    # 2、用户


    选择了平台后，我们去注册这个平台，然后以用户的身份进行体验，把明显的按钮都点击一轮，这样一轮下来，把常用的功能流程都体验几把，平台的基础功能应该得到了了解。在这体验过程，你有可能很幸运地发现一些问题。


    我们常说同理心是产品经理必须具备，但对于新的平台，是比较难产生共鸣的，更多的是体验产品流程，尽可能思考产品解决了那些核心问题。


    # 3、问题


    平台体验过后，不一定能找到使用上的问题，那么就尝试其他途径，如下：


    +   1. 带着半个问题去搜索

    2. 带着 26 个字母去搜索

    3. 带着好奇心与工具去产生问题


    在这个过程我们需要对问题进行记录，把一些感兴趣的问题与一些数据突出的问题记录下来。这个过程可能会感觉有点漫无目的，因为一般会从一个问题延伸至 4~5 个问题，浏览器开了无数个网页标签，但请记得，不要偏离我们的平台，就算真的发现其他平台的有趣问题，请先记录下来，不要跳出我们当初选定的平台。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 4、需求


    在寻找问题的过程中，肯定能发现一些用户已经给出可行的答案，这些答案大多数都是一些成型的产品（看人家如何推广的，软文总是要发一下的，引流不容易的），不要吝啬自己的点击，爽快进入产品官网，看看这些产品的资料介绍。


    +   1. 主要解决用户那些问题


    +   2. 主要功能模块，那些是收费的，那些是免费的


    +   3. 产品定价策略


    +   4. 官网的访问量（使用工具：SimilarWeb）


    # 5、竞品


    到这里基本上已经搜到不少的相关竞品资料了，有些功能强大，有些功能单一，各有各的核心价值。在竞品分析过程中，我一般归类为：通用免费功能与差异收费功能，为什么这样做？


    +   1. 通用免费功能，这部分若所有产品的功能重叠性大，一般是解决用户的不同不痒的问题，只作为引流或者象征性的作用。


    +   2. 差异收费功能，这部分会明显体现在价格上，价格落差作为产品价格的侧面参考，往往有可能


    我们只做一个差异化的功能来解决用户的某一个个点，就能形成一个小产品，并能在当前用户群体种分一杯羹。


    # 6、数据'
  merge: -1
  img_proc: true
- pgno: 163
  md: '在寻找答案的过程，除了工具数据记录下来外，还要记下一些容易被忽略的数据，如在 一些问答的网站或个人网站，Quora、Reddit、Youtube、Medium
    等，里面会有回复总数，点赞数，浏览量，用户评论数等等，这些数字都可能作为关键参考数据，因为能从侧面反映出用户群体是否足够大。


    对于在 Quora、Reddit、Medium 上的长回复，尽量细看，因为对于目前的竞品，有其他用户会提出意见（带着 Product Name + Review
    去找），这些意见有可能是我们将来改进的方向。对于一个产品，有用户反馈说明这个这个产品依然存在不足或者可以再上一层楼。


    # 7、决策


    通常会把 1 ~ 6 的步骤遍历过几遍，甚至十几遍，次数越多，需要决策的选项就越多，摆在自己面前的选项就会越多。


