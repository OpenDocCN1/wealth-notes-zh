    \n# 五、关于流量主变现其他需了解的\n\nQ：我有流量，可以不接流量主，而自己展示广告吗？\n\nA：可以的，虽然在微信里不能接入其他广告联盟。但可以接第三方广告，协商价格（按点击或授权收费，需单独拉报表），不用流量主，则要求第三方广告的收益更高对吧。这种合作往往建立在小程序受众相仿，流量更精准，想卖出更好的价格。可这种第三方广告得专有渠道，对接合作也需要人力投入。\
