  md: '用户在大众认知眼里，是这么一个地方：我生活、工作中遇到了问题，去知乎搜索一下，看看有没有解决方案。


    也就是说，用户是带着明确的想解决问题的意图上知乎的。


    这和我们刷朋友圈，看到好友说「我想做一个 XX，大家觉得怎么样」做出的回复，完全不一样。


