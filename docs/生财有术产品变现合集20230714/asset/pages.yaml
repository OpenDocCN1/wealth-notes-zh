    # ## 2.6 技术调优：预加载与定时自动刷新


    在技术上可让前端同学来操作这两点：


    +   * 广告预加载：省去创建广告标签时再次拉取广告的耗时，页面打开速度更快。


    在小程序环境下，支持通过调用 wx.preloadAd 接口，提前加载广告数据，再后续创建对应广告标签ad.ad-custrom 时，会自动使用预加载的广告数据，省去创建广告标签时再次拉取广告的耗时。


    +   * 广告定时刷新：多一次刷新，则多一次曝光。让用户看到不同的广告，这点很重要。


    开发者可以在创建广告位时传入 ad-intervals 参数实现广告的定时刷新，ad-intervals 参数为数字类型，单位为秒。注意：自动刷新的间隔不能低于30秒，因此
    ad-intervals 的参数值必须大于或等于30。


