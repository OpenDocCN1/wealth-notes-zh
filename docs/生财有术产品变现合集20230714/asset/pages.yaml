    # # 【插件开发】3篇


    # # #(45赞)Chrome 插件开发之旅：从 0-1 开发浏览器扩展


    作者： 阿帆


    日期： 2022-07-18


    大家好呀，我是帆，本职前端开发，也是本次 Google 插件大航海船员～


    大航海挺多优秀的圈友都上线插件了（我也上啦），在群里我比较活跃<(话痨)>一点，这次应阿蓝的邀请，整理分享一下自己在挖掘需求的过程和插件上线后的一些想法。'
  merge: -1
  img_proc: true
- pgno: 198
  md: '今天分享的内容，主要围绕在：方向选择和需求挖掘。另外附带一些开发上线的细节，以及插件上线后挖掘新需求的想法。全文大约 5000 字，阅读大约需要 10
    分钟。


    那这里就开始吧～


    # 一、 确定方向及需求挖掘


    这次航海，我学会的最大的一个认知就是：*想要做好一件事情，开发其实是最简单的一环。*


    决定是否能盈利、用户是否买账的核心，是功能是否满足了用户的需求，而不是你的代码写的有多好，功能有多少。在开始一个项目之前，我们最需要做的是反复确认一个需求是否可行。


    # 为什么用户愿意给一个简单的东西付费：


    Google 插件有一个要求，也就是：*插件应该是单一功能的（Single Purpose）* 简而言之就是：这个插件应该只为了做好一件事情，而且要易于理解，过于复杂的功能审核是不会给通过的。


    在这个前提下，你要制作的插件就应该是一个用于辅助用户的工具，例如我们挖掘需求会用到的 Keywords Everywhere、亚马逊卖家常用的 Keeba
    都是属于这种工具。


    工具帮用户节省了时间，用户就愿意支付这样的一笔费用。而且这类工具的用户，大多都是为了赚到更多的钱，那付费就更爽快。'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/9a1e1046870132236b6927ae01b2ba90_199_0.png)


    从零挖掘需求，建议从大平台的周边挖起：


    虽然是明确是要做一个辅助类的工具，但我还是不建议从这种工具类做起。我认为：自己的第一个插件应该要尽可能的简单，让自己能快速的了解开发流程，明确开发的大体内容（如何开发、如何上架、上架需要准备什么、流量怎么来）。


    所以我航海时的计划就是：做一个简单的免费插件，跑一遍这些流程，这样在开发付费插件的时候心里才有底，不至于抹黑乱跑。


    挖掘需求，建议充分阅读：航海实战 | Google | 付费插件 | 实战手册，航海手册里对于常用的方法及各方面的细节，都有非常详细的讲解，有不明确的地方，来回翻阅几遍加上实操基本就清晰了。


    一开始建议遵从手册上面的方向挖掘需求，也就是：Facebook、Instagram、Youtube 这些平台。因为这些平台的用户量巨大，再小的一个需求，哪怕能满足
    0.001% 的用户，也是最少五位数的体量，而且需求好调研（Google 搜索）、SEO 也方便。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '想挑战一下自己，第一个插件就开始盈利，建议从：Amazon、Ebay、Etsy、Shopify 这些电商平台开始。


    除了用来熟悉开发、熟悉流程的第一个插件，其他插件在开发之前最好是反复确认，做好调研。


    查树说过一句话：找到一个需求后，不要急着着手开发，一个礼拜后再回来看看，如果觉得这个需求还是不错，那就一个月后再来确定。这句话一定要牢记的，因为开发是需要时间投入的，最好在开始前反复确认，这个需求是一个有潜力的需求，不然时间成本太大了（开发的投入、审核上线的时间、Bug的修复和编辑的审核时间、SEO
    推广，以及开发完成后的倦怠期）


    使用工具挖掘需求的市场和竞争强度：


    在航海群里，问一个需求能不能做，最大的可能是收获到查树哥的一句：问搜索引擎，搜索引擎比我们靠谱多了。


    一个需求能不能做，答案全在搜索引擎的数据里，我们通过搜索+工具可以得到：


    +   关键词和相关词的月搜索量、广告费用

    2. 需求的竞争对手有多少

    3. 相关的长尾词都有哪些

    4. 每个月通过这个词进入目标网站的流量，以及网站的月总流量'
  merge: -1
  img_proc: true
- pgno: 201
  md: '流量（Traf/mo）是预估的。关键词搜索量、费用、竞争强度等数据，经过调研来源于 Google 关键词规划师（比较准）


    这里使用到了 Keywords Everywhere 这个扩展，使用到的功能是：搜索关键词，获取关键词以及相关词的搜索量、通过关键词进入网站的流量。主要用于分析需求量及竞争强度。


    # 使用工具挖掘需求：


    上面提到 Keywords Everywhere 这个工具，可以查询到关键词以及相关词的市场容量、竞争难度。那我们也可以倒推过来，使用它去做需求的挖掘。在航海手册里，有提到一个方法。使用关键词
    + a-Z 去检索需求：'
  merge: -1
