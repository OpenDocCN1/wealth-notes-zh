    第三种方法：现有产品和模式，区域位移，跨界（美国的模式，转移到中国，中国北京，上海，转移到二线郑州，合肥等。）


    比如：在上海做的不错的项目，我们能不能再北京也搞一个出来？


    比如：王婆大虾在商丘做的不错，能不能去小龙虾圣地无锡去试试，看看生意怎么样。


    其实很多模式，都是这样过来的。


    其实，大部分人手里都有金饭碗，却不知道怎么用，而是收藏在了柜子里，却找不到柜子的钥匙，其实赚钱，真没你们想的那么难。


    只是任何时候从来没有用心发现赚钱的商机。懂了就懂了....


    另外我强调一句话就是：如果我们做市场，是刚需的话，那么你就可以开直营店，到各个城市里面去开分店。


    当然如果我们想快速赚钱，我们就学会：卖发财机会才行。开分店需要大量资金和实力，但是卖发财机会，只需要我们当下有个非常好的样板店，招商就很容易了。


