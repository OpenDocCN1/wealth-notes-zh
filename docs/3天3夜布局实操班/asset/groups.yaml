    # 【卧龙营销内部资料】布局实操班


    那这时候最有生产力的事情就是迅速执行


    一旦再犹豫不决，每一秒都是在浪费生产力，浪费生命。


    优柔寡断就是这样产生的。


    因为你已经做足了准备，还犹豫个毛线了，半秒钟迟疑，都是优柔寡断。


    【布局小模板】是我们做战略工具的第一种用法。


    【卧龙布局预测小模板】谋定而后动，战略上抓住趋势，战术上果断执行，提前做预测，必将大有可为。


    核心一：见微知著，以小见大，知一二知全局。

    核心二：人心所向，顺应人心，人性自然就顺应了规律和趋势。


    （1）大量的市调，反复的市调（弥补信息量不足）


    + 如：1，从身边朋友入手做市调，咨询

    2，从陌生人做分析。

    3，市调报告，问卷调查

    4，从互联网大量市调，书籍上，以及其他所有能给我们一些细节信息的地方。

    5，做数据对比，做量化，做分析。


    （2）做样板抽样调查，推演，演绎，倒推反复推敲逻辑和事情的变化方向。


    简单讲：一个镇的现状，在一定程度上决定全国的现状，又在一定程度上影响世界的现状。


    （3）提升格局：站到世界角度的最高层，极点。根据过去曾经发生过的事情，做推算。


    记住：因为历史总会经典重复性的上演。


    提前做：投影，排练，倒推布局。【投影思维】；


    比如：合久必分，分久必合。就是我们古代人总结的历史经典。什么时候都是一样的。

    比如：大蒜的价格，几年廉价，几年又会涨价，都是有周期性。


    事物的发展状态总是随着时间的推移而不断变化的。在一般情况下，人们要了解事物未来


    的发展状态，不但要看到事物现在的状态，还要看到事物过去的状态。


    （4）加入牛逼的圈子：获取顶尖的信息，问不同的行业的高手，包括政府人员，给出大量的意见做参考。


    为啥：因为成功的人都是顺应了规律，一定都是能提前洞察人性和规律的哪些人。


    第二种做战略的工具就是：提前做预测，分析，推断，抓住势能。


    也就是我们的【预测小模板】


    目前而言，我个人认为，做任何生意有4个阶段：


    + 1，选择一个行业，个人起步，扎实深耕经验，行业人脉阶段。


    简单讲，我们刚开始是一个人干，可能是跟着别人干，也可能是自己干，对这个行业并不是很熟悉，有陌生——到初步认识——初步了解——慢慢摸索——逐步通透——创新升华自己的产品或模式。


    也就是完成从0-1的过程。


    第二阶段：与人合作，合伙创业，开个店，或者以个人经验，扩大生产，经营，销售，推广规模，进一步升级自己的生意模式。


    此阶段也可以称之为：小打小闹，从陌生到熟悉——真正自己玩的阶段。


    第三阶段：如果我们门店，小工作室，小公司做的不错，就可以考虑加盟，招商，做品牌区域销售，传授技术，或者卖授权，卖资格，卖赚钱机会，帮助有钱，没项目的人+帮助没钱，没项目，想发财的人+帮助有钱，有资源，但没项目的人……


    实现进一步连锁式，加盟方式，或以技术，品牌，方式的商业模式，快速扩张，赚取加盟费，以及店铺红利，或授权股份分红等。


    当然，要完成这一步定然也是有要求的。但是看我们每个人怎么去设计商业模式，怎么来运营这样的平台。


    这里为了更清晰给各位讲清楚，这里有必要去讲一个故事：


    + 1，小东是做牛肉汤的，偶然看到一个商机，就是种植花椒树，产花椒来赚钱。


    ![](img/b007b81b7b78642d97f2196ce4d77155_376_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_376_1.png)


    因为小东心里想：“花椒是我们厨房日常菜品必备的大料，每天都在用，现在市场价30-45元，他学过三大思维，就市调了往年花椒的批发，销售价格，发现都很稳定，从来没有过低，或过高的情况，觉得这个属于比较平稳的产品。”


    过市调，他觉得这件事情可以做。


    于是在家里承包了80亩地，种植花椒。


    2,终于到了收获花椒的季节了，小东悉心管理了3年的花椒树，终于产出产量丰厚的花椒籽，满是欣喜，这一下就让他赚了80万，然后他竟然用这个钱，分期买了一辆大奔，并在老家盖了一处大院，并到处找人宣传他这一下就赚了80万元，这几个步骤一出手，附近的村民听到风声，都来参观，膜拜，想要学习学习，怎么种植花椒。


    镇子里面的人都知道小东种植花椒买了大奔，盖了新房，大家无不羡慕至极。


    又听小东很有信心的讲，明年要再多种植100亩，听到这里，就有不少人也想一起跟小东种植花椒树。


    就这样，不少人买了小东的花椒苗，附近竟然一下多处了将近上千亩的花椒地。


    小东经过一算：花椒苗就赚了不下100万的收入。


    3, 3年过去了，小东这时候，已经不再自己种植花椒树了，而是专心培养花椒苗和跑花椒市场，自己又跟政府申请，成立了一个花椒合作社，并向银行贷款，以30元左右的市场价格，回收镇里村民采购的花椒。


    这个时候，小东意外的发现，卖苗子竟然比种植花椒赚钱。


    种植花椒，竟然没有搞花椒销售赚钱，花椒采购价30多元一斤，到市场一周转就是35-40元。


    通过种植花椒和销售，竟然很快赚到了千万元利润。


    4, 小东已经不满足于本镇市场了，于是又托政府和媒体，来做一个创业采访，讲一下他是如何通过种植花椒年赚千万的故事。


    ![](img/b007b81b7b78642d97f2196ce4d77155_377_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_378_0.png)


    送给政府：100万，媒体200万。


    他们都大肆宣传，小东如何如何成功，政府也给他颁发了创业明星，创业青年的称号。


    ![](img/b007b81b7b78642d97f2196ce4d77155_378_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_379_0.png)


    结果：是不少外地的人都听说了这个故事，纷纷也加入种植花椒种植的项目中去。


    这里只是故事的一部分，故事很长，后面的可能很多人还玩不了。我们暂时先说这个故事的4个小部分。


    简单讲：


    第一阶段：小东是属于自主创业种植花椒，他再怎么赚钱，都是赚的辛苦钱。很难发大财。


    第二阶段：小东开始卖发财机会，通过自我包装，自我炒作，推广，结果引来更多人加入种植花椒的阵营。（这个时候，紧跟他的人，其实也能赚不少钱）


    这个时候，他可以赚百万，发一些大财。


    第三阶段：小东整合上下产业链，进行资源整合，上面对接批发商，市场，下面对接种植户（面临销售难题/选择项目难题），帮助更多人发财的同时，整合100~1000个人，一起干这个事。


    此时战略已经转移至种植苗圃，周转销售。


    第四阶段：通过政府，媒体，的合作共赢，进一步获取公信力，媒体的公信力，进行再次自我炒作，获取更大，更广泛的合作。


    这个时候，就可以发一些大财了。


    第四阶段：我们完成第三阶段的初步阶段，我们可以考虑进入第四阶段，项目融资，获取风投，或者更大，更多资源的股东入驻，快速获取市场的占有量，垄断性，以便尽可能速度的跑马圈地，让竞争对手无法复制，赶超我们的速度。


    第五阶段：为了更好持续性让公司运转，就需要庞大的资金流做支撑，就需要考虑项目再次包装，做好上市准备，获取更大范围的资金，股东的入驻。


    基本上，我们无论做哪个行业，哪些项目，基本的框架，和未来的战略，都是这5个基本阶段。


    可能有人会问了，有没有捷径可走？


    当然是有的


    什么是捷径？


    举个例子：一个人年赚10万，他突然想年赚1000万。这就是捷径，很显然，不真实。


    因为一个人年赚10万就意味着他只有年赚10万的能力和责任。


    突然1年扩张到100倍，很显然需要满足几个必备条件。


    你过去1年赚10万，然而今年把目标定到：年赚1000万。


    那么必须具备什么条件？


    做一个假设：（1）既然薪资增加了100倍，那么你的工作能力能不能增加100倍，只有这样你才能达到这个目标。


    换句话讲：你努力工作，必须是去年的100倍。你过去每天工作10个小时，现在必须每天工作1000个小时。以同样的方式。如果假设成立。


    那么还有没有其他方法？


    + (2) 当然有：你的客户数量增量，是过去每天的100倍。


    + (3) 借别人的时间：你一天24小时。能不能招募100个员工过来。借用100个人的时间，同样可以达成，而你这10小时，则是用来管理，培训好这100个人。


    保持到你的轨道不偏移。


    + (4) 或者说，你必须开设100家分店才行。


    （5）或者你去管理好10个合伙人，去让他们裂变100甚至1000个合伙人。也可以轻松达成。


    记住一句话：任何时候，只要条件满足，结果一定呈现。


    如果我们没有达成自己想要的结果，一定是你的基本条件根本没有达成。


    要么就是：还是用过去的方法在做事情。


    因为：用过去的方法，条件，也同样只能得到过去的结果。


    好了，我们今天的分享先分享到这里。


    晚上继续分享。


    我们继续今天晚上的分享。


    # 【如何制定赚钱的轨道？】如何快速踏上赚钱的高速列车？


    记住：


    + 1, 卖产品的不如卖技术的


    ![](img/b007b81b7b78642d97f2196ce4d77155_382_0.png)


    1931 作品


    ![](img/b007b81b7b78642d97f2196ce4d77155_382_1.png)


    去年我认识这个的这个小老弟。


    他自己卖周黑鸭在青岛即墨一个大服装批发市场里面。虽然每天生意还不错。


    但是最多一天能赚1000元算不错了。


    而且他非常累。


    但是自从用快手拍段子，每天发布一些视频，不到1年，就积累了几万粉丝


    他就通过快手招募粉丝：一下就就招募了100多个学员。每个学员5000元，16年，他不到半年就赚了50多万。


    然而他卖周黑鸭1年才赚30万。


    招来的学员那，还给他免费干活。 又省了不少人工。


    看看：单纯从实体店卖+卖技术。这一下就多赚了那么多钱。


    所以：各位要不要这么做？


    记住一句话：如果你有一个赚钱的项目，能日赚1000元，千万别复制着藏着，你应该去把这个商机卖出去。


    有个小伙子啊，他自己做cpa，cps能赚1000多。


    他自己干，一个月累死了，苦逼就能赚3万元。


    而且这些项目有时效性。最多3个月可能就不赚钱了。


    那么我就给他一个建议：把这个技术卖出去。


    然后就投放了许多项目广告。让很多人现场或者直接当场直播到底怎么赚1000元的。


    让你现场看。现场检验。


    很多人一看，这个太给力了。学费才5000元，我这5天就赚回来了。


    结果这小子赚了多少钱？


    结果有69个人给他付了5000元的学费。 69X5000=34.5万。


    本来他自己辛辛苦苦最多干三个月，最多能赚多少钱？ 每个月3万X3个月=最多赚9万块钱。


    但是他卖了这个技术之后：他自己几天就赚了34.5万。


    然后这些买项目的人开心吗？


    当然开心，刚开始很开心，但是随着学员的增多，他们就发现这个项目没有那么好做了，结果从1000元到700元，到300元，慢慢就到几十了。


    但是：我们才不管他们最后怎么样，对不对。


    然后我们拿着这34万，是不是就可以干其他的事儿那。


    记住：任何项目都有一个周期性。


    雏形期——教育期——成长期——成熟期——衰退期——褪败期。


    没有任何生意，是永恒的。


    所以：在机会最好的时候，我们要把握好这个度，把机会卖出去，比单纯你苦逼做项目，要赚更多钱。


    # 2，卖技术的不如卖服务的


    这个什么意思？


    一个人做按摩的，他给很多普通的客户，1小时的单价，最多60-300元不等。


    如果他一天能工作6个小时的情况下，最多能赚1000多元。


    但是现在我们的玩法变了：我们只做高端客户，做功能性的按摩。一个客户收费20万-100万/年。


    比如：有很多有钱人，他们都有颈椎病，腰间盘突出等。


    我们就给他先免费体验，然后做一个客户教育，优化一下流程。


    只做高端客户。做服务。


    过去都是一天给很多人按摩。


    现在情况变了，一天就按摩2-3个，我们喝着茶就事儿给搞定了。


    同样还是按摩，但只是我们把它变成设计了一种高端客户服务，而不是单纯就是玩按摩。


    那么我们玩法变了，方式变了。收入并没有减少。


    但是我们做事儿，就非常轻松了。


    所以：很多人就是有一个误区，以为价格低，人多就赚钱。


    这是非常错误的想法。


    ![](img/b007b81b7b78642d97f2196ce4d77155_385_0.png)


    你说：是一天按摩30个客户周到，平均单价100元。 还是 一天只服务一个客户：赚3000元。轻松？


    所以说：有时候，真正做高端服务的都比走数量，卖技术的要赚钱。


    因为客单价高。往往都是高端客户。


    消费潜力非常大。


    3，卖服务的不如加盟，代理的。


    为什么这么说？


    在郑州有一个小伙子做的保健品公司。


    我就送他一句话：“战略上卖代理比你卖多少产品都赚钱”


    什么意思？


    因为我发现通过他们的話术，流量思路，普通人大概一个月还能够赚1万多块钱。


    我说：你这个东西既然可以复制。那么不如招募代理卖出去。


    但是：如果自己招募的员工，都卖保健品能赚几个钱。


    一个人帮你一个月赚1万多。除去各种开支，你净利润如果达到5000元／人的话。


    那么现在有20个员工，最多一个月能赚。 20*5000=10万。


    但是我们换一种玩法：我们让这20个员工，以招募代理为核心战略。


    就是我们所有的朋友圈，都是代理拿货，截图，反正导向就是以招募代理为导向。


    然后如果我们能招募200个代理，再通过200个直属代理继续扩大市场，招募更多代理。


    当然招募代理的时候，也可以兼营卖货。


    只不过我们的方向以招募代理为战略。


    那么这样你的裂变指数会更加大。 如果每个代理帮你创造2000元，那么每个员工招募10个代理，就是2万净利润，再加上代理后面还有代理。


    这样更容易覆盖全国市场。


    他后来就是把招代理为核心方向了。


    结果现在公司又扩大了5倍。


    但是：他如果还是按照之前的老路子，可能公司还是那么大。


    4，卖加盟代理不如卖区域，授权的。


    什么是区域？ 简单讲这块区域市场，只给加盟商负责，不能绕乱市场。就算这里面有代理，也要从区域这里拿货。


    这样每个区域我们就可以招募一个有实力的分公司。


    比如：一个代理拿货100万，你可以成为某区域代理。


    好了，剩下所有的代理都是从你这里拿货。


    那么这样就构建了一个完美的系统。


    具体开拓市场的任务，我们只需要交给区域代理，然后让他们培训市场就可以了。

    就不需要公司花费过多精力，去做这个培训工作。


    5，卖区域的不如卖概念的。


    ![](img/b007b81b7b78642d97f2196ce4d77155_387_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_388_0.png)


    今年过节不收礼，收礼只收脑白金。


    我要给老师送礼！


    ![](img/b007b81b7b78642d97f2196ce4d77155_388_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_389_0.png)


    卖概念主要以企业产品推广为主。


    通过做广告来辐射各个区域，在各个超市，卖场，然后做自己的产品。


    具体的概念玩法，我们第一天都已经分享了。


    这一块特指：用来把一块好产品，通过好的概念，去推广全中国，乃至全世界。


    ![](img/b007b81b7b78642d97f2196ce4d77155_390_0.png)


    # 【这个图：价值1亿美金的企业产品战略图】


    企业家赚钱：标准战略蓝图


    + 1, 找到一款产品（服务） 不完美，但是很畅销。


    + 2, 购买并详细研究它。


    + 3, 重组升级优化它。


    + 4, 制作一个雏形样品。


    + 5, 展示给100个人内测试用。


    + 6, 再次升级优化直到客户欲付费购买。


    + 7, 找位合伙人与你一起扩展研发。


    + 8, 分享合作者50%的股份。


    9，找位很有钱的的人作为投资人。


    10，给投资人10%的股份。


    11，量产投入生产产品/服务。


    12，销售你的产品服务给100万人。


    13，赚更多的钱。


    14，公司上市。


    15，你的合伙人投资人和你共同赚更多的钱。


    比如：有个朋友的鼻炎药特别有效，而且他们是祖传的。


    这个就属于绝对的好产品和服务。


    那么这就是宝贵的财富啊。


    所以：我们就找到他合作，然后投资他，给他入股。


    不到1年我们就开设了30多家分店。


    所以：其实身边有很多这样的产品和机会。


    就看我们的眼光和当下的实力了。


    6，卖概念的不如卖故事的。


    卖概念的行为更多在于企业。


    而卖故事覆盖面就相对比较广一些。


    （1）比如：陈安之——讲成功学。


    ![](img/b007b81b7b78642d97f2196ce4d77155_392_0.png)


    再创业之初，陈安之并没有成功。他靠着他老婆的资金，就举办了几次课堂，还租了一辆劳斯莱斯。


    在当时那：很多老板都买不起这车，看都不敢看。


    别人就以为陈已经非常成功了。


    所以：很多企业家和老板，真是那个羡慕啊。那里见过这真实，课程门口停了不少豪车。


    很多人就是听了这个陈安之，如何讲成功的故事。


    结果都报了陈的课程。


    结果陈就真的买了一辆劳斯莱斯。


    所以：讲成功故事很有意思。


    同样还有一个人：


    ![](img/b007b81b7b78642d97f2196ce4d77155_393_0.png)


    马云是不是中国创业鸡汤派的代表人物？


    除了马云，没有第二个人敢说第二。


    马云：在创业之初，就到处讲淘宝未来讲又多么成功，淘宝的愿景是什么，淘宝怎么，怎么

    做，未来将发生什么。


    总之：他一直再讲他的故事。


    其中30%讲愿景。


    40%讲中国的发展，和公司的未来前景。


    20%讲鸡汤。


    10%讲自己公司的故事，服务客户的故事。


    总之：到处在讲，有机会就讲，逢人就讲故事。


    所以：马云真是把卖故事讲到了极致。


    你看：刘强东，马化腾，他们都不会这招。


    同样还有一个故事：


    在新浪微博上面有一个叫：蒋晖的。做淘宝培训的。

