    # 【活动】联盟营销活动


    让一家幼儿园如何地堆式增长50%！我是如何让这个幼儿园报名期间成交近100万，一学制近1000万收入。


    当时情况是这样：在珠海有6家不同社区幼儿园，之前每个幼儿园都能招到近90名左右小孩，现在落到55名生左右，一般情况下收费标准大概在1380元左右/月，除了去请幼师、幼儿餐费、园长、维护费用、家长回馈、其他等费用一年6个幼儿园能赚300万左右。而现在情况是招生很难，原因是附近社区多一家幼儿园，规模差不多，只不过是竞争对手设施齐全、园房成新、娱乐多、园景景色也很不错吸引家长，就是因为这个优势占据了家长心智。


    当我接到这个问题在不改变园景情况下确实很辣手，后来经过市场分析与调查。


    黄老板还是有很多优势与很大的资源未被利用。


    1. 黄老板有3年幼儿教育历史，有一定市场占据口碑与附近社区悠久历史，还有大量过去幼儿生家长资源（这是未利用资源）。


    比如叫幼师全部去邀请过去的家长来参加“以孩子智慧成长快乐记忆”大聚会，再通过地面几轮造势推广，三年见证多少位家长，成长多少位宝贝，现在宝贝们是多么聪明、活泼伶俐、优秀（附上照片，最好找到现在班级当班长的宝贝做客户见证），某幼儿园覆盖该社区86%家庭宝贝。将在某日某社区广场三年家长见证“宝贝智慧成长快乐记忆”的大聚会约定隆重举行。


    同时还可一次规模抽奖活动，赠品有健身卡，美容卡，乐斗城门票，品牌冠名衣服，抽奖学习机，免费升学名额5张，1000元购物卡赠送机会


    这些赠品都是通过整合过来与附近商家冠名现场赞助。


    然后在现场活动推出家长动员营销，介绍一名幼生送1000元购物卡（前端让利，后端赚钱），其实也是现在海尔全员营销，支付宝全民营销时代，从而引动几百号家长动起来。


    通过这次活动后直接提升幼儿园影响力与口碑传播，还有几百号家长转介绍，所幼儿园同时不同社区广场操作就近千家长传播了。


    2. 黄老板幼儿园所都是几位年轻气质型舞蹈女幼师（这是未利用资源）。


    比如可以在社区广场教大妈跳各种舞蹈，教孩子们唱英文歌，跳幼儿舞，提供免费玩具，画画赛，智力游戏与开发。


    提高幼儿园的专业口碑与情感服务，在每个社区广场三天一次，6个幼儿园20多个幼师，一个月下来影响十多个广场大妈与幼儿，增强口碑传播与影响，还有建立情感、信任关系、还有孩子粘度。


    3. 联合附近社区商场超市发起公益活动，比如“赞助社区穷孩子”“社区老人慰问服务”等志愿活动，连续一个月时间，每年假期一次，提升两家公益品牌形象。


    同时也可以邀请超市购物抽奖活动，通过前期DM传单购物活动造势推广，打造“beiby 家长购物送智慧福利”概念，相约统一在指定某日购物满68元可以抽奖幼儿园免费名额，黄老板赞助2名


    黄老板活动当天在现场搭展示柜台塑造企业价值，同时推出预交100元，几十人一组抽一学期免费名额，没抽中的100元等500元报名费用。其他赠品由超市自负。


    4. 优秀孩子送教育。


    为了提升竞争力与差异化增值服务，天资聪明孩子送教育，比如画画、钢琴、小鼓、舞蹈、智力开发、武术。给幼儿园成绩优秀、聪明的学生（快毕业）送上孩子具有天份的兴趣与专长（舞蹈、提琴、音乐、画画、武术、英语）的专业培训


    你说家长会不会非常的感谢你，会不会到处传播你的品牌，因为你站在她的角度为她孩子着想，并且是完全完全免费的学习。当然不是每个小孩都送，具有某些天份性质或优秀成绩来判断。


    当然你可能说赠送得花多少钱啊？


    我跟你说这些培训名额是不花一分钱整合过来的，我仅仅教给黄老板资源整合操控思维，让这些（画画、钢琴、小鼓、舞蹈、智力开发、武术、提琴、音乐等）小孩培训机构每年自动赠送2个名额，10个机构就20个不同培训项目，赠送给聪明优秀的宝贝直接提升该机构品牌高端专业形象。


    通过以上策略，在9月16号后，黄老板告诉我。6个幼儿园共招了683个生，每生一月1380元，683x1380等于90万左右/月，一个学期也能收入1000万左右。


    转介绍的流量（口碑，利益..）


    客户除了购买产品，能快速帮你实现客户倍增的就是转介绍（一个客户帮你介绍3个，信任可以快速建立，并很容易形成你的客户。）


    案例：（传销+直销）就是把转介绍做到极致的核爆模式。建立利益链+辐射关系链（250人脉模式=一个人平均关系链接250个人：有效的信任嫁接和关系嫁接；）+成交为人人分销利益链（核爆）


    让客户给予口碑传播（转发朋友圈推荐），利益类型转介绍（送奖品.好评有礼（有条件），


    积分，会员折扣，现金券，赠品…），vip客户…。


    ![](img/b007b81b7b78642d97f2196ce4d77155_201_0.png)


    推荐25个入群，可以领取礼品XX。


    案例：推荐任用户，产品免费拿！


    案例：朋友一起进店，享受8.8折扣。用折扣利益。引爆转介绍。


    【转介绍策略】利益诱导——人性，都是趋利避害的，没有利益，凭借什么给你介绍。或者帮你转发到5个群，转发朋友圈，转发空间那。


    案例1: 推荐1个好友关注，就送5积分，10积分就能兑换1元现金


    在公众号，或者加微信的方式。推荐。


    这个方法那，直接增加了很多人推荐。


    案例2: 转发本条说说送价值10000元的《总裁思维培训》课程。


    转介绍策略：”完成推荐指标“后，退款。


    以“眼镜店“的操作进行举例:

    如果新客户在1年内推荐4位客户，就可获得100%的退款。


    有家眼镜行推出这个制度后，业务一飞冲天。


    他们给客户4张推荐卡，被推荐的顾客拿着推荐卡过来，可享受折扣。


    但是如果没有这个折扣卡的话，就是原价。


    你说：另外推荐的购买了，还有4分之一返利。你说他会不会疯狂给朋友介绍那。


    还比如做房产中介的，也同样可使用该策略。至于 Practice.


    转介绍策略：赠送免费服务


    赠送免费服务

    新老客户，均可免费修补。


    赠送干洗服务。    推荐一名客户，2人一起就可以免费干洗。


    ......


    转介绍策略：“俩人同行”双双返现，介绍返现（你介绍的客户，没消费一次，都给你部分提成。每月返现）。


    转介绍策略：点赞，转发，减少100元报名费。或者介绍一位一起报名，立减500 ............


    高效客户转介绍系统打造：转介绍系统可以比等等待客户推荐，提升5倍，10倍，20倍的客户数量倍增和利润倍增。


    思想：提供价值（情感：礼物+利益：超级大奖）——引导转介绍（鼓励他们去推荐，并教他们如何去推荐）——转介绍实施（非常方便，简洁，有效推荐方法，然后使得客户主动，积极，连续帮我们推荐新客户。）——组建一个俱乐部强化推荐系统；

    卡盟金碟0创业仇年风：

    返利客户怎么知道他有软件看到后台吗


    1, 可以利用小程序


    2, 可以利用微信背身。进行发消息通知。


    3, 门店会记录登记，推荐人。进行返利。


    如何设计核爆推荐系统：


    首先，设计一个浪漫，有趣，丰富多彩（简单，方便，有效）的推荐方式，并让老客户宣传。


    如：理发店：凡本公司会员推荐的客户可免费享受价值298元的形象塑造美发设计套餐。


    然后很多人就主动把这个消息给亲戚，朋友，来剪发，体验这样一种专业优质的服务。新客户体验之后，很多成为老客户。


    如果你在推荐的新客户，你懂得【教育客户】理解决剪发形体塑造，的重要性，并给出专业性形象服务管理，那么很多客户就会形成这样一个标准。


    如：一周2次理发！形象更加魅力。


    我们通过视频：教育客户，一周理发2次，才是真男人。或者魅力女神。


    或者书籍，微信文章等。


    然后我们为他管理形象，那么这个客户如果比较注意形象的话，就很容易成为老客户。


    同样如果你懂得的【风险保障消除机制】和【组合套餐设计】策略融入到新客户销售中，那么一定会更加意想不到效果。


    如：做完【教育客户】我们对新客户讲，你是我们老会员推荐的客户，我们给你准备了一份礼物：


    第一份珍贵礼物：《完美礼仪——专业形象塑造》，光盘一套，你可以更好的管理自己的发型和生活。


    里面植入了怎么使用发蜡，怎么保养，怎么搭配衣服等。


    然后有我们店的宣传视频和产品等。


    第二份珍贵礼物：车载CD狂峰-完美劲爆震撼音乐。每天让你精神倍增，斗志昂扬。


    在车载CD里面也有我们广告：记得经常到天朝理发店理发哦。


    第三份珍贵礼物：新一代男神洗面奶！！ 或者人参面膜。


    这个那，就是前端的一个赠品。后面引导继续购买我们的洗面奶和面膜。


    如果3个月内，你感觉不划算，对形象塑造没用，你可以免费保留礼品。并退还形象塑造费用。


    每周提供2次理发服务。


    经过这样设计，是不是就很好，很激动啊。


    经过【风险保障机制】导入+【组合套餐设计】是不是不一样，有购买冲动那。


    如何让推荐更有威力，更给力那？


    只需要：用情感和利益去感谢你的推荐客户。


    如：你是卖茶叶的，你可以赠送价值200多的上好茶叶给他。


    如：一家美容店，在店内弄了一张大大的海报宣传，是一套非常棒的化妆品，但不是用来卖的。也买不到。这个是专门赠送给帮助美容院推荐5位以上老客户的。


    如：汽车配件俱乐部设置超级大奖，奖励给推荐新会员最多的会员。同时，老会员推荐加入的会员可以获赠200元公司产品，而没有得到超级大奖的，只要推荐一个，就送代金券1张（价值150元-300元均可灵活调整！）


    于是奇迹发生了，很多人很卖力和说服推荐加入这个阵营。


    就想2015年底支付宝集福，设置超级大奖，拉人换福，一样。就是利用了转介绍系统。


    案例：有一家美容院，通过核爆推荐系统之后，客户数量和利润倍增，但是老总感觉赚钱很慢，于是又开了新店。


    但是，美容行业推荐效果，如果老师用这一招，很多客户都免疫了。


    慢慢就效果不理想了。


    于是我建议创建一个俱乐部的方式来快速增加数量和利润。


    美女老总行动力很强，马上就办了一个青春女人俱乐部。


    每周在美容院附近宾馆会议室开办一次护肤情感时尚专题沙龙，每次都会请来相关主题的专家，与大家座谈分享


    每次活动不但可以学到很多知识，还能认识很多朋友+很多体验装礼品赠送。


    老总给每个会员赠送了3张沙龙体验卷。


    允许他们带朋友3人过来或者1个人来三次。没体验卷则需要门票100。


    一个月下来则要4百多，费用感觉很高。


    但是成为美容院会员，则免费参加沙龙。


    一年可以节省4800元，成为美容院会员则不过5，6千。所以很多人会选择成为会员。


    就这样，俱乐部推荐率就上升，利用这个模式，实现了1年扩展7家直营店，利润提升10倍。


    > 【营销谍言：所有营销模式都是朝这个5大板块去走，我们要做的是去填充各种策略。流量就这样被核爆。】


    当你没有流量时候，觉得生意非常少的时候，老客户维护不住，新客户不进来。那么我们就从这2大方式：五大流量板块。寻找捷径。 这就是个系统。


    1, 通过什么方法增加过剩流量？

    2, 怎么让客户再次消费？

    3, 怎么增加主动宣传流量？

    4, …

    … 共计五大版块。


    就可以很快找出策略，引爆流量。


    有人说：老师，线上和线下不一样啊。


    其实：如果/µ你真的做营销时间长了，你会发现，其实线上线下的玩法本质上都是一样的。


    只不过需要我们转换思维，去玩而已。


    这点：一定要多学习我们【布局系统】思维。这里就是让你掌握本质，背后原理，和运营规律的思维。


    只要掌握了本质，掌握了规律，掌握了有效的思维，其实线上，线下都不难。


    最怕的是你不懂脑筋，更不去测试。


    而是每天都喜欢吃现成的。


    才是最可怕的。


    做生意，有没有捷径那：当然有。


    1, 抓住趋势  2, 顺应趋势  3, 找对人  4, 用对方发  5, 开花结果。

