    ## 【免费】


    思想：前后段布局，前端引流，后端成交。如：课程分为，初，中，高3类。买衣服用袜子为诱饵。


    思维：定位人群—分析用户群—设计诱饵，人性喜欢免费——推送诱饵（一系列工具）——收集流量（建立链接）。（贪小便宜，贪婪，喜欢免费…）——引导成交。


    人性通用三大心理：


    +   1. 好奇；（设置悬念=勾魂）

    2. 怀疑；

    3. 获取价值


    思路：


    定位人群：那些人需求最大？在哪里出现？（什么样圈子，什么样机构，QQ群，论坛，学校…）


    我们能不能用焦点思维写出来20个以上的方法？


    很显然，只要我们去认真做这件事，一定可以。


    最怕的是很多人，太TM懒了。


    分析用户群：这些人想迫切解决问題？最关注什么？所有吸引，从人性讲：利益(好处)，情感（喜欢什么）。


    具体怎么了解？


    第一种常用方法就是：市调。 市场调查，问询，询问客户等。


    第二种常用方法就是：我们自己体验一次客户，看看是什么感受，我们想要什么等。


    只有这样，我们知道对方想要什么，我们才能设计出我们想要的方案不是吗？


    就好比：我们去哪一块肉去钓兔子，肯定钓不到的。


    白费力气。


    设计诱饵：给予他们最想要的低成本小东西，看起来高价值的东西（塑造后的电子书，视频，行业报告…），或者免费服务？ 得到本东西，需要什么条件。


    比如：壹玖资本的免费沙龙。 课程上故意不给你说完整怎么玩。结果，你被诱惑的睡不着觉。


    想要这种效果也可以：赶紧报课。


    推送诱饵：派谁去把这些诱饵传递给我们想要的人？怎么传递？（微信，文章，优惠券…）


    收集流量：引导留下QQ，QQ群，微信，姓名，手机号，身份证，加入我们社群：线下活动，促销活动，QQ群，微信群…；并做一个普通的调查问卷，以便更好的跟进流量，帮助解决问题。


    案例1：视佳眼睛实体店案例


    ![](img/b007b81b7b78642d97f2196ce4d77155_190_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_190_1.png)


    案例2：之前有个皮具店学生，使用免费护理，清洗。让你的皮包每天都是新的。这个方式，每天都不断吸引客户不断进店。


    案例3：微信被动加粉1200人的方法


    一个活动的成功与否在于：人的参与感是否强烈，活动的互动性是否可以；


    所以，我在策划活动充分考虑了以上几点，策划出了如下的活动：《庆元旦，扫描微信，免费拿苹果》


    具体步骤如下：


    +   1. 我选取了学校元旦晚会人多的时候进行；因为人在群居的时候自己是不带思考的，只要有人参加，那么都会参加！如果大家木有元旦晚会这样的场所，可以考虑去大街上，商场人聚集的地方进行的。

    +   2. 我将微信设置成了任意人都可以添加，这样子方便大家添加，免得还要验证，忙不过来不说体验还好；

    +   3. 将自己的微信号的二维码导出来，放到了X展架上面；一定要放在偏上面的地方，方便扫描；而且要多点二维码！

    +   4. 我的主题就写成了：《庆元旦，苹果免费送》。当然，这是吸引人的，至于送就是有条件的：


    首先要用微信扫描展架上的二维码，然后添加好友后与我对玩游戏；


    什么游戏呢？


    充分发挥微信本身的功能呀！丢骰子，石头剪刀布！赢了的，就 thập拿走苹果了！


    ![](img/b007b81b7b78642d97f2196ce4d77155_191_0.png)


    所以，这个活动我充分的利用了人性的这几点。


    +   1. 苹果免费送--引起人的好奇与怀疑，同时利用苹果来吸引人，给予他们价值！

