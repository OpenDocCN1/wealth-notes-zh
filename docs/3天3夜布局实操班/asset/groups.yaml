    \n（所有的产品都是为用户提供价值：要么解决问题，要么实现梦想。）\n\n客户想要什么，我们所有的设计方案都是围绕这个点来设计。卖啥，根本不重要，重要的他确认（信任）你能否真正实现他的梦想。\n\
    \n（我们所有的产品都是聚焦在客户真正想要的结果上，而且要比竞争对手多那么一点点优势。=就是给用户提供更大价值）\n\n（0）客户内心最想要的结果（好处，利益），提前预置出来（呈现到消费者面前）\n\
    \n（1）一定要让结果分解，一步步来得到结果。找到他们的终极梦想。如：第一步，第二步……流程解析。\n\n（2）一定要找到他们最想要的好处。1-10个。\n\
    \n（3）提供完美的解决方案。客户买的不是产品，买的是解决方案。\n\n（4）场景化（找到他们想要的，梦想的场景）具象化，细节化，真实化的转化出来。\n\n\
    （5）追求快乐，逃离痛苦。人性喜欢美好，害怕痛苦。\n\n比如：1分钟引流10万人。（只要做微商的都想要）\n\n比如：做微商，3个月买宝马的宝妈成功励志故事（人性都喜欢听成功故事：这也是为何微商晒豪车能成功的基本原因）\n\
    \n比如：用免费模式，3天收款560万建材装修款，锁定142个精准客户，顶2年的业绩总和还要多。（人性都喜欢，轻松，简单，快速，的实现梦想。）\n\n比如：只要加盟我们店铺，从培训，选址，售后，店铺引爆，管理，后期所有事情，我们全权交给你，100%零风险，100%无担忧，让你轻松创业，快速实现创业梦。（全方位解决方案：人性最喜欢）\n\
    \n比如：你还在忍受痔疮的疼痛吗？你还在举目无措吗？你还在懈 homogen 等待吗？（痛苦=痛点），现在立刻免费试用：纯中药去痔疮膏，无副作用，不复发，赶紧领取（快乐）。\n\
    \n比如：毛泽东-“打土豪，分田地”（穷苦老百姓的梦想）\n佛祖——“普渡众生” 疾苦的人民追求的信仰。\n耶稣——“神爱世人” 神就是帮助我们的消除痛苦，找到快乐的。\n\
    \n……\n\n记住：用户对客户见证，成功故事，以及你是否专业，效果是否好，功能是否齐全，品质\n\n# 【卧龙营销内部资料】布局实操班\n\n是否完善，包装好，价格好，服务好…耐用度，持久度根本一点兴趣都没有。\n\
    \n具体落地步骤：\n\n1，直接把结果给他们。 如：“三棵树健康+ 8小时住新家” “三棵树马上住”，呈现到广告，门头，以及其他宣传册上面。\n\n2，讲明产品原理，细节，以及购买，服务，售后的详细流程，然后把结果一步步细分化。如：三棵树油漆采用360度无污染技术，达到可以喝的油漆。\n\
    \n3，写出一套完美解决方案。 如：“不打针，不吃药，按时疗养，即可完美治疗。如果无效，全额退款。”\n\n4，把客户心中最想要的梦想以及痛苦，通过大量客户见证，来举证你能实现他的梦想。因为大多数人已经成功了。（人性永远不相信别人没成功的事情）\n\
    \n宣传通道：朋友圈发布，传单，视频广告，小视频（快手，火山），微媒体，等。\n\n——wolong20184-286：24\n\n今天早上一点分享和感悟，希望对你有用。\n\
    \n比如：卖给客户的话，就是客户想要的梦想。\n\n如果卖给经销商，代理商，加盟商，就是卖给他们最想要的梦想。\n\n如果卖给合伙人，我们就卖给他们最想要的梦想。\n\
    \n如果卖给老婆，妻子，恋人，小三，女朋友，我们就是卖给他们未来美好的梦想。\n\n真正的高手都是随地随地在卖梦想。\n\n比如：马云在它的家里面开会，就说：雅虎的跌了，阿里巴巴的股票涨了。还给他们讲：“你们未来不只是这样一套房子，你们未来会有50,100套这样的房子……”\n\
    \n这是多少打工族，精英想要的梦想啊。\n\n当然还有我们伟大的党：“共产主义”人人平等，人人有饭吃，有肉吃，老婆共享。\n\n要什么有什么，都是共产主义。\n\
    \n10，卖梦想的不如玩资源整合的。\n\n# 【卧龙营销内部资料】布局实操班\n\n卖梦想固然好用。但是我认为还有一种玩法，更高超。\n\n就是资源整合。\n\
    \n这种，普通小白，顶级高手都可以玩。\n\n过去30岁之前，我喜欢自己打拼。但是现在年龄奔四了。          也力不从心了。\n\n现在我最喜欢的玩法还是：资源整合。\n\
    \n为了更好的让更多人落地：我们先说一个小白怎么玩？\n\n【学会了资源配置思维：】我们生活中，生命中，绝对随时随地出现商机和机会。\n\n对于资源配置：小白最多想到1-2条资源玩法，而布局人就会有无数中应变资源的方法。\n\
    \n思维局限人，不知道干啥，才会去打工。\n\n思维开阔的人，即便在打工，也能找到创业之道。\n\n讲一个故事：\n\n我去同学家玩，他的妈妈不知道做什么，一直就四处打听找个活干（思维局限），劝也劝不住，也不知道他从哪里接到了一个编摇篮的手工活，就是一个摇篮框架，然后把东西编起来，一个能挣50元。\n\
    \n# 【卧龙营销内部资料】布局实操班\n\n![](img/b007b81b7b78642d97f2196ce4d77155_412_0.png)\n\n\
    2天能做一个，工资是计件。做的多，赚的越多。\n\n刚开始就是这样。\n\n# 【卧龙营销内部资料】布局实操班\n\n![](img/b007b81b7b78642d97f2196ce4d77155_413_0.png)\n\
    \n没过多久，老太太心思就来了（思维开阔了）。\n\n她跟工厂谈好，承包这些手工活，然后把这些招呼村民，一起开工。\n\n然后他们几十个人，一起编，他那从中抽了20元，一天也能赚上百元了。\n\
    \n后来那，这个老太太，就把规模扩大了。\n\n然后一个月能有1万多元的收入那。\n\n结果引来了好多人羡慕。\n\n这个生意，就是上下游的关系，就像包工程，先想办法中标，再找下家。\n\
    \n一样道理，老太，谈好了上家。剩下的就是发挥农村剩余劳动力。\n\n# 【卧龙营销内部资料】布局实操班\n\n有些小白：就很羡慕老太。\n\n作为布局人：你就\
    \ 不应该做点什么？\n\n机会一直存在，好不好。\n\n看到这个除了羡慕就是羡慕，羡慕有个毛用啊。\n\n羡慕嫉妒恨，又有毛用了。\n\n我们应该善于分析这个实物背后的本质和逻辑。以及运营原理和思维。\n\
    \n其次，你应该多做这样几件资源配置的事：那么你发财就是迟早的事儿。\n\n我敢说你有了这样一个资源配置思维：你到任何地方，见到任何人都是财富。\n\n都是机会。\n\
    \n而且比普通人有更多机会。\n\n比如：你羡慕这个老太是吧。你有没有夸奖人家，赞美人家，拍人家马屁那。\n\n然后下一步就是：资源配置思维。\n\n+ \
    \  1， 你有没有问，这个老太，怎么和小工厂谈成合作的？\n（那么我们可不可以学一点谈合作的方法。然后自己在自己家搞一个？）\n或者复制到其他剩余劳动力的地方？\n\
    很显然，绝对可行。没毛病吧。各位。\n+   2， 你没有打听一下，像这种小工厂那儿还有多少家？\n那么这种吊篮的商业模式是啥，投资多少，赚钱吗？    \
    \  我们这有没有其他合作机会？\n+   3， 你有没有挖掘一下，通过老太关系，让那小工厂负责这件事的人帮你介绍其他小工厂？\n+   4， 你有没有打听一下，你们周遭，能用的劳动力有多少？\n\
    既然可以做吊篮，是不是还可以做灯的组装，做毽子，做羽毛球啥的……\n\n# 【卧龙营销内部资料】布局实操班\n\n5，你有没有打听一下，这个产品都是往哪里走的，哪里销量最好？\n\
    \n那么我们有没有可能做一个经销商，批发商。来空手套白狼那。\n\n先卖货，后赚钱。\n\n6，你有没有打听一下，这个东西，市场怎么样。\n\n我们能不能也开一个小工厂。或者搞零售那。\n\
    \n或者做厂家直营那。\n\n7，我们看这些小工厂，的原料都是从哪里进的，我们有没有这样的渠道，可以提供更便宜的原料？\n\n也可以打造一个赚钱机器啊。\n\
    \n....\n\n而你做这些事儿需要多少成本那？\n\n你告诉我费你多少成本？\n\n我最喜欢的就是这招。我看到牛逼的人，我总喜欢跟他们聊天，沟通，然后挖掘背后的延伸价值链。\n\
    \n就是这招，我到任何地方，见到任何人，总能找到很多商机，和有意思的思维和想法。\n\n如果哪天正好需要这样的资源，我直接把双方的资源一对接，直接从中间赚差价。\n\
    \n根本不需要做什么事儿。\n卡盟金融0创业仇年风\n牛逼的人不理我怎么办\n\n这个老太是牛人吗？\n\n容易接触吗？\n卡盟金融0创业仇年凤：\n\n\
    生活中这样的普通的人，还是很多的。\n\n# 【卧龙营销内部资料】布局实操班\n\n不能接触大牛，接触小牛，牛人我指的不是：看不见，摸不着的。\n\n是比你强的人，在我眼中都是牛人。\n\
    卡盟金融0创业仇年凤：\n学习了\n\n我就应该跟他学习，看看能否挖掘链接的渠道。\n\n傻逼都是不理不睬。高手就是一切为我所用。\n\n其实：越牛逼的人，反而越容易接触。\n\
    \n只不过很多时候，我们过多给自己设置门槛和限制了。\n\n当然：我们接触任何人，不要抱着占人家多少便宜。\n\n而是要本着：为对方着想的模式，和思维。 为对方服务，那么这样就会比较容易接触一些。不要一接触就求人家，让人家帮你。\n\
    \n你不如：先发一个红包给人家。 就是没事，发个红包。\n\n这样人家知道你不是那种上来就求回报的人。\n\n往往就容易接触了。\n\n我们做资源配置思维的思考，做不成怎么办？\n\
    \n做不成拉倒，你也不损失啥，对不对。\n\n万一你做成？\n\n你可以想一下，谈好一家工厂就能赚1万，还不需要亲自赶货，找几个亲戚去管理就行了。\n\n\
    你就自动打造了一个赚钱的系统\n\n你该做什么还是做什么，偶尔视察一下罢了。\n\n这就是资源配置思维的利用法。\n\n其实你身边一些稍微比你厉害的人，都有很多资源，等待我们去配置，发挥更大价值\n\
    \n比如：我们街上有一个人对治疗小儿咳嗽这种病，治疗效果特别好。\n"
