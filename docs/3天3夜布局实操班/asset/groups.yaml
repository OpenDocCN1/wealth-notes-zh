    ## 【万能市调模型】


    对内市调：财务数据+员工反馈数据+自身观察留意数据+找托来体验反馈数据。


    攘外必先安内。 我们先看看公司业绩，账单，财务数据，看看分析一下是什么样的。


    然后我们根据财务来找出一些具体的问题，和原因。


    这点我想不需要我去唠嗡了。


    员工反馈数据：我们在开早会，晚会，或者月会，季度会，我们给员工一些自由发言的机会，让他们给公司提出建议，以及为什么会出现这样的问题等。


    这样的话，我们才能在一定程度上了解公司的问题。


    自身观察留意数据：要知道单纯凭借员工的一面之词，作为老板和企业家，一定会上当受骗。

