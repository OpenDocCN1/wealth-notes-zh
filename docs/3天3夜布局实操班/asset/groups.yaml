    73 作品


    ![](img/b007b81b7b78642d97f2196ce4d77155_238_0.png)


    我记得我们上次分享：还没有几个月，你看这个做贴膜培训的小美女，之前是几万粉丝，现在都已经涨了25.8w粉丝了。


    初步估计：初步估计一个学员收费3000净利润X1000=300万净利润。


    所以，各位选择倍增环境的时候，一定要选择线上为主，线下为辅的方式。


    因为线下你做什么都需要成本，坐公交，找兼职人员，开设场地，而且只能在本地城市，覆盖面有限，所以相对裂变速度会难一些。


    对于互联网环境裂变就不一样了，可以瞬间裂变到全国，而且低成本，覆盖面广，更重要的是可以零距离沟通，随时随地成交对接。


    记住：线上传播的速度是线下速度的100-1000倍以上。


    线上赚钱的速度也会是线下赚钱速度的30倍。


    就看我们怎么玩了。


    目前我们接触的企业中，现在很多都已经往互联网方向转移，只要做的，一般都有不小的收获。


    【倍增思维】选择环境之后。我们继续选择裂变几何倍数。


    ![](img/b007b81b7b78642d97f2196ce4d77155_239_0.png)


    这个叫做二二倍增。简单讲：每次以2的几何进行复制倍增。


    ![](img/b007b81b7b78642d97f2196ce4d77155_240_0.png)


    对于二二复制倍增，威力会小一些。


    常用的有：二二倍增，三三倍增，一十倍增。也有 一三简单倍增。


    ![](img/b007b81b7b78642d97f2196ce4d77155_240_1.png)


    在我们本地，我见过一个线下落地倍增的案例。


    印象很深刻：是苹果手机，以及其他型号的手机免费领取。前提只需要找到3个人也来免费领取手机即可。


    那么手机免费领，怎么赚钱？


    这个活动，做的很快。收到了很好的效果。


    你推荐3个人过来免费领取手机，你就可以拿走手机了。就那么简单，无需付款。当场拿走。


    善用倍增一定是有智慧的人，并且用起来很有意思，倍增起来更省力气，省心。


    只需要邀请3个人过来领取手机，可以当场零费用拿走手机。靠什么盈利？


    对于手机免费送？条件是：只要邀请3个人过来领取手机，即可免费领取手机。


    怎么赚钱？


    有些人说在手机里做手脚，有的人说软件上做隐性利润来源，还有的人说，赚电话看的钱。还有免费旅游的钱，免费旅游的反佣800--1000……


    当然了，这些可能会有。但也不一定非要有。


    首先，假设，1个人过来邀请3个朋友，然后他拿走了手机。然而这3个朋友也可以当场拿走手机，但是必须你在邀请3个人过来领取就好了，大不了原价购买。


    各位可以私下算一下，非常有意思，发现通过这样倍增，不但不赔钱，反而赚的几何倍增了。


    如果你不是很懂，也不是很了解，建议你拿出笔+纸张私下写写画画，自己结算一下。


    一般情况下，正常为了免费拿手机。都会邀到三个人，很多人喜欢碰运气，玩概率事件。


    首先对于领取手机的人，一般如果个人有点组织能力和领导力的，一般领取手机=免费领取了。很轻松，就能达到。


    而对于很多社交圈小的人，不爱沟通，为人处世能力差的人，会相对比较难，最后成为原价购买的人。


    当然了为了更好的手机成本回款，合同上会有一个15天至1个月的时间，从领取手机后开始计算。


    对于这一部分有领导力，善于玩圈子的人，简直就是赚大了。


    有合同，有身份验身，手印。可以随时起诉你。而且可以找到你的老家，警察会上门服务，


    催债人也会去你家。


    我们说第二个倍增营销案例：无限极：直销倍增模式系统。


    ![](img/b007b81b7b78642d97f2196ce4d77155_242_0.png)


    对于直销行业：隆力奇，安利，三生，天士力，罗麦，天狮，无限极等，还有很多。其实他们的设计玩法，完全是遵循市场倍增学原理。


    这个世界上最好的模式就是：传销模式=直销模式。


    无论是传播，裂变，病毒传播，以及其他快速发展的企业。 都可以利用直销模式来做生意。


    看上面这个图，我们就可以清晰的了解到。对于商店，没有分钱。用一辈子=钱都给别人了。


    然而，如果你认为我们比较好的产品，你介绍朋友过来，我们就有偿给你终身收入，还可以成为股东，还有免费培训，优惠经营权。


    - 1， 没有好处，只消费。

    - 2， 倍增：你介绍人过来，消费了，都有你的提成。自动赚钱。

