    ![](img/b007b81b7b78642d97f2196ce4d77155_75_1.png)


    比如：早餐还是粗粮好。

    我们很多人可能都受到过这样的教育。发现吃粗粮是最健康的。


    那么我们就给这家餐厅叫做：粗粮好。


    早上就卖粗粮早餐。


    同样：比如——钻石恒久远，一颗永流传。


    其实：他们的钻石应该叫恒久远。

    这样人人不自觉就记住这个品牌形象了。


    根本需要多大的努力和宣传，轻而易举的就节省了几十亿的广告费。


    ## 第三种方法：借力法


    ![](img/b007b81b7b78642d97f2196ce4d77155_76_0.png)


    金龙鱼是世界上几乎最贵的一种鱼类。


    ![](img/b007b81b7b78642d97f2196ce4d77155_77_0.png)


    金龙鱼就直接借力金龙鱼这种形象，然后植入到自己的食用调和油里面。


    给人感觉：金龙鱼油确实厉害，这是黄金比例。


    ## 产品介绍 / PRODUCT INTRUDUCTION


    ## 金龙鱼黄金比例™调和油

    1：1：1*有助于脂肪酸比例平衡


    主要原料：大豆油、菜籽油、葵花籽油、玉米油、花生油、稻米油、芝麻油、亚麻籽油


    适宜人群：全家老少皆宜


    产品优势：有助于膳食脂肪酸均衡


    食用方法及食用量：一日三餐按个人口味适量


    产品规格：1.8升


    保质期：18个月


    储存方法：贮存于阴凉及干燥处


    ![](img/b007b81b7b78642d97f2196ce4d77155_78_0.png)


    其实那：就是一个普通的调和油而已。


    哪有什么好炫耀的。


    但是借力这样一个金龙鱼的形象，立刻就不一样了。


    ![](img/b007b81b7b78642d97f2196ce4d77155_79_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_79_1.png)


    有一家企业：主要卖猪肉为主，就把店面，以及其他，都命名为高老庄猪肉。


    很容易我们就联想到猪八戒高老庄的故事和场景，这时候，我们看这个猪肉就跟其他的不一样了。


    而且那，这个名字我们一下就TM记住了。而且还有很好印象。


    同样：


    嗨游记（西游记）


    一家游乐园命名叫：嗨游记。


    卖水果的叫：（仁果演义）三国演义 ....


    ![](img/b007b81b7b78642d97f2196ce4d77155_80_0.png)


    一家餐厅叫：琅琊宴。


    还有一家餐厅叫：

    （宴遇）艳遇


    为什么有的叫琅琊宴？因为有一部《琅琊榜电视剧》在全国热播。基本上人人都知道琅琊这个词。


    ![](img/b007b81b7b78642d97f2196ce4d77155_82_0.png)


    还有琉璃榜五壮士的故事。


    也深入我们我们的内心。


    记忆深处。


    当然了，对于艳遇：人人都想要艳遇。


    哈哈，这个就更不用说了。秒记住了。


    这种方法怎么落地？


    + （1）我们可以找出很多已经熟悉的东西。

    （2）或者找到很多已经很火的东西，被广为知道的东西。


    然后列一个清单，看看那些词，或者那些电视剧，那些小说名字，以及其他能跟我们的主题相关。


    那么我们就可以直接借力过来用。


    第四种方法：生活口头禅

