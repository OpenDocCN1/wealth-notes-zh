    ## 第7种方法：小学课本法（初中，高中，大学。不过小学一般人人都上过，最熟悉不过）


    我们小学的印象应该是 最深刻的，而且各种故事，案例，典故，绝对可以植入到每个人的认知当中。


    就是讲：我们从小学课本上找一些我们经常看过的故事，案例，典故，来命名。


    比如：乘法口诀3X3饭店。


    以及我们对数字和我们经常见到的东西是非常敏感的。


    比如：李白酒。


    其实那，就是我们小学时候，谁没有背诵过：李白的诗？


    这时候，命名李白酒就很容易记忆。


    ## 第八种方法：围绕人性记忆规律进行命名。


    简单，容易，好记，朗朗上口，押韵等。


