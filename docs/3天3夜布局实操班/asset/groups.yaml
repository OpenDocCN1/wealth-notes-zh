    # 【卧龙营销内部资料】布局实操班


    同样：小儿葵花肺热消毒片。


    是不是把品类定位到：儿童医药市场了。


    直接跟大人的药给分开了。这时候，所有的父母，肯定都会买儿童药给自己家孩子对不对。


    具体为什么用葵花？ 我们先不讲。这里只谈定位。用葵花做设计，这是建立品牌印象的设计内容。


    # 产品分化策略


    化妆品的分化：


    论功能，有滋润的、美白的、祛斑的、防皱的、丰胸的

    论用途，有面霜、眼霜、手霜、足霜、腿霜、全身用的护肤霜

    论形态，又有精华液、乳液、膏体、还有膜的等等


