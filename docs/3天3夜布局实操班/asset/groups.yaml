    ## 【卧龙营销内部资料】布局实操班


    第三种方法：现有产品和模式，区域位移，跨界（美国的模式，转移到中国，中国北京，上海，转移到二线郑州，合肥等。）


    比如：在上海做的不错的项目，我们能不能再北京也搞一个出来？


    比如：王婆大虾在商丘做的不错，能不能去小龙虾圣地无锡去试试，看看生意怎么样。


    其实很多模式，都是这样过来的。


    其实，大部分人手里都有金饭碗，却不知道怎么用，而是收藏在了柜子里，却找不到柜子的钥匙，其实赚钱，真没你们想的那么难。


    只是任何时候从来没有用心发现赚钱的商机。懂了就懂了....


    另外我强调一句话就是：如果我们做市场，是刚需的话，那么你就可以开直营店，到各个城市里面去开分店。


    当然如果我们想快速赚钱，我们就学会：卖发财机会才行。开分店需要大量资金和实力，但是卖发财机会，只需要我们当下有个非常好的样板店，招商就很容易了。


    ![](img/b007b81b7b78642d97f2196ce4d77155_277_0.png)


    上海聚玩网络这家公司：找我们投资的时候。


    我就去考察了，然后看上海本地市场做的还 Fett，可以，每台机器的投放量一个月有1万多元的收入那。


    当时，我本以为这个项目可以投放。


    ## 【卧龙营销内部资料】布局实操班


    后来那，我就很聪明，贿赂了他们的员工：让他们的员工给我看他们的赚钱后台。


    结果我就发现了问题：虽然他们通过这样一招招募了很多市级，省级，以及区域级别的代理，大大小小有上千家商户。


    基本上覆盖了全国的市场。


    但是我仔细一看后台：除了上海这几台机器数据很厉害，很完美，还有一个合肥的公司做的也不错，每台机器能达到2万多收入。


    每月。


    但是我发现几乎90%的商户，几乎都在苟延残喘。     都是几千，几百元的收入。


    幸亏我没有投资，结果去年我就听那个我贿赂的小伙子给我讲，公司倒闭了。


    现在连工资都发不出来。    连续欠工资欠了快半年了。


    我那，就思考一个问题：为什么他们还能招募那么多代理？


    很简单，他们有样板市场：具体里面有没有猫腻暂时我不清楚。


    凡是从招商网，百度竞价来的客户，他们会一一招待，然后开一个会议，讲述公司的发展前途，以及广告机的收入。一台广告机2600元，然后按照上海的华丽数据，一台机器就可以赚1万元每个月。     那么每个月净赚了5000元还多。


