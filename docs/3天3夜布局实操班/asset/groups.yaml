  - '[PAGE 103]


    # 【卧龙营销内部资料】布局实操班


    最起初，最传统，最有效的方法是：模仿，改造，优化，先写出几百个广告语出来。


    比如：邓小平——“先富带后富，让一部分先富起来。”而后史玉柱的脑白金就模仿写了一个“脑黄金，让一亿人先聪明起来”。


    真正的策划就是这样做的，都是看迎合趋势，先模仿，再改造，优化的过程。


    具体广告语落地步骤：


    （1）让团队的所有文案人员，策划人员，营销人员，全部加入进来，探讨如何写一个牛逼的广告语。每个人必须写出20条以上，然后大家一起汇总。


    （2）最后大家写出了几百条，甚至几千条，然后由策划经理和大家一起，层层筛选，从几百，几千个广告语中，找出10条最能引发共鸣（需要大量市调消费的核心需求），容易记忆，感觉很好的广告语。


    如果这10条，有些我们感觉不顺，就去修改，优化，然后直到满意为止。


    （3）最后从这10条，精挑细选的广告语中，最后一次筛选，结合国家，企业，门店，或者小摊小贩的实际情况，选出最优秀，最精的3条，备用。'
