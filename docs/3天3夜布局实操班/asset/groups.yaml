    # 产品分化策略


    化妆品的分化：


    论功能，有滋润的、美白的、祛斑的、防皱的、丰胸的

    论用途，有面霜、眼霜、手霜、足霜、腿霜、全身用的护肤霜

    论形态，又有精华液、乳液、膏体、还有膜的等等


    广告行业的分化：电视广告、网络广告、报纸广告、杂志广告、户外广告、广播广告；户外广告又可以继续分化：地铁广告、街道广告、零销点广告、交通广告、大看板广告、电梯广告、计程车广告、厕所广告。


    鸡蛋的分化：普通的鸡蛋，高价鸡蛋，胡萝卜素鸡蛋，婴儿的鸡蛋，高营养鸡蛋，低胆固醇鸡蛋、孕妇鸡蛋、高钙鸡蛋、非饲料鸡蛋等等。


    鞋子的分化：男鞋、女鞋、童鞋、凉鞋、拖鞋、运动鞋、足球鞋、篮球鞋、呼吸篮球鞋、休闲鞋、网球鞋、滑雪板鞋、自行车鞋等等。


    以后还会有专用的：跑步鞋，瑜伽鞋，减肥鞋....


    培训行业的分化：模式，系统，智慧，机制，模型，模板，理论，心法，原则，秘密，内参，秘密，工具，策略，方法，原理，领袖，布局....


    开创蓝海成功的唯一途径：先纵向定位，后横向分化细分定位。


    20年来我发现：所有做起来的牛逼小公司都是从样板细分市场切入进去的。


    因为同质化眼中，市场竞争大，那么经过细分，就开创一个新市场，新的定位和差异化。


    这点我们每个人都可以采用。


    适合于所有能创品牌的行业寻找所在行业及细分市场空白，通过穷尽分析和专业分析，找

    到统一行业内尚未被开发的其他有效细分市场空白点，并有机会构建先发竞争优势。


