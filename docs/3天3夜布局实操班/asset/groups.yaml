    360-五大安全第一


    ![](img/b007b81b7b78642d97f2196ce4d77155_6_0.png)


    可能我们看了有点乱。


    用通俗话讲：很简单。


    +   1, 设计一个logo    商标    2, 做好品牌印象


    +   3, 拍几个创意的广告


    +   4, 定品类


    +   5, 定品牌颜色


    +   6, 规划品牌战略


    +   7, 包装产品    高逼格。


    ....


    好了，简单明了，我们扯了那么多。


    我们现在直接进入我们【产品策划系统】的内容。


    首先我们做任何项目或产品。


    我们首先做的是：1，选什么产品。 这个东西，到底是不是趋势。


    无非：卖产品（实体产品+虚拟商品），卖服务。


    如果说：这个产品没有消费趋势，或者没有重复消费的话，我们就不要去选。


    我认为一个好产品必须具备这样几点：


    1，可以重复消费。


    简单讲，你卖火箭，卖大炮，或者卖高尔夫球，汽车，这类短期不能重复消费的商品。


    我认为：你做任何项目都会很累。


    因为没有沉淀。 老客户最多消费一次。不可能说，二次，三次，1年换一次车吧。


    2，轻资产


    如果一个人，养猪，他养一辈子，哪怕再赚钱，他都不可能成为河南首富，最多成为养猪大户。


    为什么？ 1，养猪属于重资产 2，养猪不确定性很高 3，养猪场不容易复制。


    做什么可以成为首富？ 卖养猪饲料的人绝对可以成为首富，但是养猪的人最多成为养猪大户。


    3，容易复制


    讲一个故事：李斌和王阳两个人毕业后，李斌有一个梦想，就是将来要开一个饭店，于是李斌就去学了厨师，然后进入一家饭店打工2年后创业自己开了一家店，自从开了店，因为手艺很好，结果生意好的不得了。


    但是那，他每天都再忙，真的忙不过来。


    当然：李斌也非常高兴，自己的生意非常红火。


    而另外一个王阳做了什么？


    他那，去开了一家烧饼店，然后生意还行，就招募了很多徒弟，合伙开烧饼店。


    一年之内就开了40多家店。


    表面上看：李斌一年是赚了很多钱，但是王阳，因为项目可复制性很强，结果1年赚的钱比李斌还要更多。


    # 4，市场容量大


    大众，中低端的东西来销售，消费群体越大，对销售能力和体系要求越低，就越容易取胜，以量取胜。


    只有量大，可重复消费才是真正的赚钱之道。


    实体产品：糕点，家具，家电，办公用品，水果，蔬菜，图书，化妆品，建材，医药，日化，保健，看得见摸得着都是…。


    虚拟产品：


    +   0. 各种网络账号，各种VIP账号，爱奇艺会员

    1. 网络游戏点卡、网游装备、QQ号码、Q币等；

    2. 移动/联通/小灵通充值卡；

    3. IP卡/网络电话/软件序列号；

    4. 网店装修/图片储存空间等。

    5. 电子书，网络软件

    6. 辅助论坛功能商品等

    外挂，游戏币，电子书，，约炮秘诀，电影，各种大师视频，内部资料，手机号，YY账号，营销软件，企业管理软件，网站，p2p，光碟，CD，定制软件，百度竞价，网盟，网页制作…。


    服务类产品：


    金融类：网赚项目，各种项目或创意，各种招商项目，天使投资，私募，理财（现货，基金，股票，期货，银行，p2p，保险…），代理记账，注册，贷款


    教育类：vip圈子，小吃技术传授，总裁培训班，学校，政府，律师，策划，咨询


    个性技能类：私人定制（形象设计，家居生活设计，店面设计…），经纪人（明星，舞团，各种节目，展览…），维护，服务器管理，IT（软件开发，员工外包..），展销会…


    普通类：色情，瑜伽，舞蹈，音乐，健身，桑拿按摩，ktv，理疗，私人医生（厨师，理发师，美容师，减肥师，美甲，保姆，录像…）跑腿，外送（宅急送..），代要账，保镖，物流，旅游，劳务中介，打工者，雇佣兵，私人侦探，打假人士，家政，婚介，技术培训（舞蹈，音乐，美术..）


    # 【选择产品的核心：】


    +   1, 是否最大面积解决人类的问题

    2, 产品是否可重复消费，像毒瘾一样，上瘾。


    盈利的重点在于开发客户终身价值，开发一次，消费一生。

    3，产品是否可大批量复制

    4，产品能否轻资产化。


    量大是所有成功致富的关键。（洗头：去屑海飞丝；洗衣：碧浪洗衣液；喝茶：怕上火，喝王老吉；欧莱雅：让你更美丽！）


    6大吸金项目方向：1，男人好色2，女人爱美      3，小孩爱聪明     4，老年人爱健康     5，人人想赚钱6，人人要智慧…


    ![](img/b007b81b7b78642d97f2196ce4d77155_9_0.png)


    假设我们把项目：选在了做自己的酒。


    比如：卧龙“智慧酒”，“诸葛酒”….做酒水这个行业。


    1，量大     2，可重复消费      3，能轻资产（可以外包出去：把很多不必要的动作） 4，能轻松复制


    ![](img/b007b81b7b78642d97f2196ce4d77155_9_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_10_0.png)


    那么我们第二步就是：【产品策划系统】中的产品定位。定品类。


    我们必须通过大量的市场调查，寻找空白与差异化的市场定位。


    不能与大家都一样。要不然我们就没有卖点了。


    所有产品都有自己的定位，不可能任何人都成为我们客户。


    茅台——定位高端。


    五粮液——定位中高端。


    衡水老白干，定位——低端。


    纵向定位：低端——中端——高端。 或者低中端——中高端等。


    我们第一步就是：先纵向定位。


    第二步就是：我们要横向分化，进行定位。


    很多人说产品竞争力大，那么我们如何重新定位产品架构，挖掘市场空白点，打造一个新的蓝海市场那？


    很简单，就是在大概念中找细分领域，这就是空白点。 就是我们的横向定位。


    布局，是卧龙的定位。


    智慧，是刘一秒的定位。


    成功学，是陈安之的定位。


    潜能开发，是安东尼罗宾的定位。


    免费模式，是壹玖资本的定位。


    没有一个好的定位和概念，再好的产品和服务都不好卖。


    反过来呢，给普通的产品一个好的定位和概念，也许突然就火了。


    以水为例：空白细分领域不断分化。——开创蓝海的唯一途径；


    +   娃哈哈是第一种矿泉水

    乐百氏是第一种纯净水

    农夫山泉是第一种天然水

    可口可乐是第一种碳酸饮料

    鲜澄多是第一种果汁饮料

