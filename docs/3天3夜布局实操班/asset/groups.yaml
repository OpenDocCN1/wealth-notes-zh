    ## 【裂变分销系统】


    为何偷菜，停车位，植物大战僵尸能火起来，支付宝集福，瞬间火爆中国？？？


    很多人一辈子都不能知道，了解的秘密！


    引发流行：让你的名字或者产品迅速风靡全球的方法。


    不需要你去研究什么传播理论，扯淡，学习现成的经验才是硬道理。


    市面上所有的流行法则：有三点核心本质。


    （1）非常好的内容，或者产品真的很好。     可以形成自动自发的转介绍。


    （2）影响力（明星，媒体）做背书，做宣传。 比如：《舌尖上的中国》但凡被舌尖上中国评选的小商家，自身都得到了很快的发展。


    （3）官方认证：企业资格认证，专家认可…


    比如：一个新产品。怎么快速流行起来那。


    最快的方法就是让意见领袖，明星，或者知名度比较高的人，让他们一起来做这件事。


    比如：冰桶冷冻人。


    比如：钻石——都是先让英国女皇，以及明星免费穿戴，然后他们就很容易形成潮流。


    就是说：我们很多东西，都是跟着有权威，有影响力的人进行学习，模仿的。


    而官方是一个信任认证标签，使得产品或者东西更加确定的一个概念。


    比如：如何裂变分销一本畅销书？


    - 1, 先小范围测试。出售一部分。

    - 2, 很多人看到书的内容，就会慕名而来。

    - 3, 在国内举行巡回演讲。


    如果有某网络电视或者官方电视节目亮相，一定会成为名人。


    - 4, 并每一次演讲组建“读书小分会”。


    形成星星之火可以燎原之势。不停在宗教小组之间，每个小组都能接受到他的信息并得以强化。


    从一个读书小组到另一个读书小组，从一个组织到另一个组织，从一个朗诵会到另一个朗诵会，一年时间啥都不做，就在全国各地做此类活动。就这样引发了流行潮流。


    老毛的共产党“星星之火，可以燎原”“就是这么来的。懂了不……


    做生意做分销裂变也是如此。


    ![](img/b007b81b7b78642d97f2196ce4d77155_233_0.png)


    简单讲：我们的产品和服务。先影响另外3个人，然后由3个人，去影响9个人。


    然后用9个人去影响27个人。


    27个人去影响更多。逐步指数级放大。


    到一定程度：我们就可以形成一个传播或者裂变分销机制。


    （1）产品和服务客户体验者，就是我们最精准的招商加盟客户。


    （2）让一些稍微有实力的人，在他的范围内，或者让他的影响力，去辐射更广的人。


    其中要点就是：1，东西和服务足够好（内容好） 2，有意见领袖帮你做裂变


    假设你有一款产品很好。但是你在努力，也传播有限，但是找几个意见领袖：1，明星 2，有粉丝基数的网红 或者其他人。


    让他们帮你做一个推荐。


    那么，这一下就很容易辐射更快。


    直接缩短了成功的时间。


    这就是裂变的一种指数级玩法。


    但是往往：现实生活中很少有人有这种驱动明星的能力。


    那么只能使用我们另一招了。


    只能靠数量突破。


    讲一个故事：


    有这么一天，老板要求小明在两个小时内电话通知全国各地780个代理商向公司总部汇报营销情况。


    如何做？


    按每个电话3分钟计算，要用39小时，这怎么能在2小时内完成老板的任务呢？


    ## 【这里面就要用到几何倍增学】


    过去没有微信，只能打电话通知。


    于是他就把几何裂变分销倍增学用在了这次电话通知780名代理商工作中，结果只用1小时就圆满完成老板的任务。


    第一步：给其中1号到5号共5位代理商分别打电话，讲清楚本次电话的主要任务后，再请他们每人帮小明打电话通知5人，每人用时间3分钟共用去15分钟时间。


    第二步：由1号到5号每人再分别给5人打电话，内容和小明的一样，时间也是每名要用3分钟，5人同时进行下来又用15分钟时间，这第二步下来就将6号到30号电话通知完了。前两步共用去时间30分钟，共电话通知了30人。


    第三步：又由6号到30号共25个人每人各打电话通知5人，每个的内容、时间和前面一样，结果通知了31号到155号共125人，又用时间15分钟。前三步下来，共用去时间45分钟，共通知了155人。还余下625人没有通知。


    第四步：又由31号到155号共125个人，每个按前面的时间、内容、方法各电话通知5人，奇迹出现了，这15分钟下来，这125人共通知了625人。这四步的结果，小明共用时间4个15分钟即1个小时就完成了780人的电话通知，提前一个小时完成了老板的任务，他最后得到老板的嘉奖和重用。


    这个世界上最好的裂变，就是几何裂变分销。


    怎么说？


    - （1）让每一个客户成为我们的分销商。

    - （2）让每一个客户带来的客户，继续成为分销商。


    其中：这点我们必须跟直销模式，传销模式学习。


    通过这个故事，可以看出有几个好处？


    - 1、节省时间。


    为什么说节省时间呢？小明本该用39小时来完成的事情，他只用了1小时就完成了，所以说他节省了时间；


    在我们生活中，对于赚钱这个事情，也完全可以节省自己时间，让自己赚更多钱。首先你必须先学会劳心，而不是老力。没事多看书，少吵架，少动嘴皮子。


    往往很忙的人都是穷人。


    - 2、倍增利润。


    为什么说他倍增利润？


    小明用剩下来的38小时，他又可以做更多的事，推销更多的产品，所以他倍增了利润；


    诸葛亮最大的失败莫过于，什么事情亲力亲为，从来不会倍增自己的时间，培养一批才干，让他们去犯点错，进而成长，以后可以充当一线，二线指挥。


    然后自己喝茶，指点江山，就能耗死司马懿。成为最后的胜利者。


    - 3、倍增生命。


    为hour大家容易理解，我们把单位扩大一下，把“小时”改为“年”，小明要用39年来完成的事情，他只用了1年就完成了，所以他大大浓缩了奋斗旅程。


    ![](img/b007b81b7b78642d97f2196ce4d77155_236_0.png)


    我们看几何倍增分销模式多么厉害


    同样是突破1000亿元的成交额。阿里巴巴用了10年，京东用了6年，而拼多多竟然只用了3年。


    他们有一个模式是什么：


    是不是砍价。


    他们利用微信端的流量：利用砍价。 或获得一个指数级的裂变。


    假设：一个人砍价，发给10个朋友，或者群里。


    那么可能有10个人看到了，这10个人再去砍价。那么就会形成一个10X10=100个。


    100个有效人数，那么每个人再传播10个有效人数：就是1000个有效人数。


    每一次都是呈现指数级的倍增。


    所以拼多多为啥能在1年内实现几千万，几个亿的用户量的本质原因。


    对于倍增：传统倍增分销一定没有线上倍增容易。


    为什么线下倍增比线上难？


    线下倍增环境：距离远，速度慢，成本高，受限多，市场窄，朋友少，组织难，一定会存在这些弊端。


    假设你开了一家店：生意很好，最多传播到10公里，20公里以内的区域。


    所以：即便有一些人想跟你学习，也是有限的，每个月最多几十个而已。罢了。


    线上互联网倍增环境：零距离，光速度，成本低，无限制，全球化，网民多，实时裂变。


    但是线上就不同了：


