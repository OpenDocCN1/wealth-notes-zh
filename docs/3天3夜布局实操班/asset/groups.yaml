    【做营销，最重要的基本功就是：大量去一线市场市调，体验，对比，发现我们现在与别人的差距，然后复制亮点，优化，为我所用！！！】


    单纯的思考，解决问题，以及问任何人很显然都是多余的，只有获取一线市场最本质的信息，才是实操落地的基礎。懂了就懂了....


    昨天一个做办公家具的老板问我： “我这个几千平方家具店的营销方案怎么做？ ”


    我问： “你能抽出几天时间，陪我逛逛吗？ ”


    然后我们就去体验了，去市调，本地，所有的家庭家具，以及办公家具，然后问，有没有发现你们的问题？ 他默不作声，想听我的建议。


    1，同样两家店，我们去其中一家专业国际品牌店面和普通店面，给我们感觉是不是不一样？


    在营销中，我们叫场景化，就是如果是卖家庭家具，就要营造家庭的氛围，如果要做企业，就要营造企业的氛围。


    什么意思？ 你看同样的陈列家具，我放上茶具，花朵，顶灯箱，书柜，甚至书柜里面都有书，花花草草都有。是不是很有范，很想要那。


    但是如果不懂的场景化搭配一个完美场景，是不是就非常普通，付款了，就显不出来家具的好了。看似消费者买的是家具，其实是买的一个他心里面的场景化梦想，有家庭梦想，办公梦想，简单讲：他就是想要这种家庭的效果，办公的效果，然而我们才不管他把家具拉回家，什么效果，我们只要打造他现在想要买的效果，懂了吗？....——他连连称道，是类，老孔。我咋没想到那。


    2，同样普通商家和专业商家，专业的是不是显得更加舒服，以及周到。


    你看他们的售货员，我们一见面，普通商家穿的衣服，都是：休闲版，日常服饰，甚至连睡衣都上场了。然而我们到品牌家具店：那叫一个专业，见面就问：“你好，你需要什么样的家具？”，然后又是倒水，又是倒茶的，还让我们着急。先了解我们的想法，意图，然后推荐我们合适的家具，一看我就知道，专业的都是受过礼仪和专业导购话术培训的。


    如果你上去买，会买哪一家？ 他：“肯定买专业的。能帮我完美解决问题，服务还好…”


    那么你们的店是不是要改进？1，员工必须穿工作装（没有，赶紧定制几款上档次的符合你们品牌工作装）2，员工必须定期做话术培训，引导。 3，店面门口要改成更专业的。


    3，同样商家，普通玩法直接让消费者走了，而专业让消费者无法拒绝的促销方案，充值方案，锁定方案，很愿意进入我们数据库的方案。


    你看普通商家，客人来了，有很多没看中的，然后就走了。而专业品牌会根据消费者的意图，导向，比如：如果他分析出这个客人是想低价，买实惠的。


    他就会讲：“我们现在厂家有几款办公家具，再做活动，一般家具都是卖2000-2800元，他说这个不赚钱，就是厂家为了推广他们家具，做的活动，一共24套，现在还剩5套了，价格非常实惠：1600元，卖完就没了。”


    同样有些聪明商家还会这样做：“附近很多品牌商家，我们都认识，你可以加我微信，如果你看中那家的商品了，你可以先发给我，我帮你砍价，或有没有同款价格更优惠的。另外再送你500元家具抵现金券，如果你有朋友或你想买，可以再我这里用”一般都不会拒绝，能省钱，还能帮我解决问题。


    这样一个动作，无形之中就积累了数据库，就成了朋友，哪天需要家具肯定会找我们。可以做：朋友圈营销，以及做促销活动，直接在微信做活动。细分客户做活动。


    什么意思？ 就是只对这一个客户做的活动，是发给他微信本人的。其他人也不知道。但是客户就很有意思关注，可能直接在我们这里买。


    他：“这招绝了，老孔，还可以这样玩啊. . .”


    我：“招数太多了，数据库还有更多有意思玩法，这只是冰山一角，哎，这有啥。”


    还有太多玩法，免费模式，联盟模式，资本模式，其他等各种模式，都可以用。我们先分析市场，一点点来。


    记住：做营销，最基本工作就是市调，市调，市调，市调，与其窝在家里，办公室发愁，不如去市场走一走，看看，对比一下，一切豁然开朗。


    昨天去家具市场市调的一点感悟，希望对你有用。——wolong


    什么叫：“见识多，学问广？”


    见识多：就是陌生拜访，市调的多，看见的多。


    没吃过猪肉，也见过猪跑吧。


    营销水平本身就是不平衡的：就是大城市的营销水平比小城市二三线营销更高，更值得学习。


    为什么？ 因为人越多，竞争越多，他们已经上升到了更高层面的竞争。


    而小城市的竞争还局限于：价格战。


    当然了：国外的营销水平，可能比国内的还要更高一些，因为他们经济发展的迅速，有我们更多可以借鉴的经验和玩法。


    那么我们把国外的一套，灵活的在用到大城市中，同样可能也可以具备竞争力。


    但是你如果不大量市调，拜访，体验的话=井底之蛙。 自以为是。


    就是：你看到的玩法，只是当下你遇到的，你根本想不到，其实世界上还有100-1000，甚至10000种更好的商业模式，商业玩法。


    谁先获得最先进的信息，最本质的信息，谁就能领先一路


    很多人做不好生意，并不是不擅长做生意，而是屁见微知著，从细小的事情，看出背后的运作变化，和本质规律，从商业信息差中嗅出商机和机会。


    这是大部分人最缺的东西。


    比如：在区块链刚火的时候。


    我就通过大量的市调，分析发现，区块链这个东西，不能去触碰。如果去玩。


    1. 你可以搞区块链培训。来顺应这个趋势。

    2. 你可以搞一个虚拟币，来让一大批人来投资，炒作起来。圈一笔钱。

    3. 或者你成为某个公司的联合创始人，认购一些虚拟币0.0001元，然后顺应市场趋势，把价格拉高，拉升，后割肉走人。


    你做这个方向，绝对是稳赚不赔的买卖。然而一些傻逼却去自己去玩。


    为什么不能玩？ 这里不多讲。


    什么叫信息差，见识广？


    我继续讲一个真实的故事：


    我们镇上有一个人，他在80几年-9几年，去北京打工，那个时候，他有幸遇到一个机会。


    什么机会？


    当时，我们国内对古董，古代的老物件，是没有人珍惜的，基本上就是在家里里面一放，就不管不问了。那时候古董也不值钱。


    老家里那时候普遍是这样。 有时候，甚至国宝都当破铜烂铁给卖了。


    当时：他从北京文物以及古玩城，了解到这样一个信息，就是古玩未来一定会涨价，而且这老东西会越来越值钱。


    但是当时只有在北京有一部分人做这件事。就是专门去收破烂的地方，收老物件，还有去街道里面，转悠，收老物件。


    他那，打工不干了，直接回家，攒了一些钱，借了不少钱，然后专收各种老物件。


    在我们这边于是那：还真收了不少。


    新中国成立后：国家就出台保护古董，回收各种古董的政策。


    这个政策出来后，古董一下就成抢手货了。价格一下翻了几十倍。


    这小子，一下就身价成土豪了。


    我们一定要注意到一个问题：如果这个人不去北京。他这辈子都不可能知道老物件可能会值钱。


    所以：这就是见识多的，获得了市场信息。


    信息差决定财富差，一点也不足为怪。


    同行业交流互动：如果你要做什么项目，我们不如找一些行业内的人，去问问情况，做一个参考意见。


    这样的话，我们失败的概率是不是就大大降低了。


    首先：我们明白为什么失败，为什么这项目不行，为什么不好做。 。。。


    弊端，劣势在哪里，我们能不能改进，或者升级模式。来换一种思路来玩，可能就成功了。


    但是如果：我们不去这样做。单纯自己瞎猜，没有用。


    几乎项目失败了80%。


    但是如果我们市调足够清晰，明确：我们就知道会遇到什么问题，怎么解决，至少有一个大概的准备和预防。


    是不是。


    很多傻逼，就是看到一个项目，单纯凭借招商的人，一面之词和自己的直觉，冲动就干了。


    还说什么：“光膀子，不怕穿鞋的”


    最后成功了那：他说你阻挡他成功了。


    失败了那：他说都是你诅咒的。


    …


    李素荣（石家庄同城商圈）：

    大部分人的真实写照


    这是很多年轻人犯错的错。要么就是布局段位太低了。需要修炼才行。


    要么不吃几次亏，改不了这个习惯。


    为什么很多人，牛人：大起大落那。


    就是因为他们不懂这个道理。


    我那，喜欢稳，不求快，你看我做的任何决定，基本上有60%的把握。


    就是因为我掌握了这些方法。


    我们举一个例子：大量市调能花费你多少时间和精力？


    可能一周，1个月，甚至2个月。


    但是如果你盲目去搞，成功了：还好。你说我的决定真对。


    但是一旦你失败了：你到底是割肉放弃那，还是继续经营？


    四个字：宁缺毋滥。 宁愿2-3年市调，也不做盲目的选择。——卧龙


    很多人一般现状是什么情况？


    （1）随便搞一个生意，然后，如果生意好，会一直经营下去。


    这一类是比较好的。


    （2）盲目搞一个生意之后，发现有收入，但是不多，属于不痛不痒的状态。


    比如：开一个饭店，每天有200-500的收入。但是又不敢放弃。也想生意好。


    反正就这样不痛不痒，耗着呗。


    中国很多商家都是如此。


    结果耗着耗着，青春没了，根本没有机会去找其他机会。


    大多数人是这样。


    （3）盲目开店之后，刚开始不赚钱，投入了几十万，甚至几百万，刚开始亏钱，以为这是正常现象，可能熟着，熟着就赚钱了，结果又跟朋友借钱，非要搏一搏，再去搞一搞。


    然而发现，借来的钱，也是杯水车薪，1年以后，2年以后，生意还是亏钱。


    刚开始赔一点还能接受，但是长期下来，实在就熬不住了。最后还是关了把。


    无奈，没有心力再去搏一搏了。


    最后痛下狠手割肉了。


    赔了一屁股债。


    有时候：一定要学会壮士断腕。 敢于割肉。有句话叫做：“两权相害取其轻，两权相利取其利”。 有时候早一点放弃，可能赔的更少。


    但是有一个最大的误区就是人性：没有任何人愿意割肉。


    当然：我也犯过这个错。 总想着生意能好起来，结果反而更加一派涂地。


    为了避免我们：痛苦的割肉，不舍的割肉。 我认为：各位在做项目，一定要组好情报信息系统。


    提前花费多少时间市调都不为过。


    千万别没了onder清楚：上来就干。 有人说：老大，我怕错过了机会。


    我给你讲：“机会无时不刻都在，如果你只贪图一时的机会，去冲动，最后遇到的一定是魔鬼而不是佛祖”


    投机的机会，我认为不可取。


    当然了：可能很多人跟我的风格不一样。比较喜欢投机。


    那我也没有办法了。毕竟你是你，我还是我。


    懂了就懂了....


    想成为行业第一：必须长掌握行业第一手情报，成立一个信息部，每月提供一次行业前三名的所有资料。


    那如何获得情报？


    1、对手的网络渠道，线下渠道，参加广交会

    2、亲自上门做顾客去体验，体验出对方的服务、价值、感受

    3、大量找同行优秀高管

    4、整合几个同行的优秀高管来公司工作

    5、大量拜访对手的顾客，了解对手顾客对对手的评价与信息。


    ....


    向班级里面学习最好的学习，是不是我们就会事半功倍！


    立刻升级战术模式。就那么简单！


    如果你的布局段位更高一些话。


    你不只是单纯获得同行业的玩法了。


    你还可以：直接与各个行业的高手学习，直接参透他们的运营逻辑和本质规律，然后为我所用。


    但是那：我们在落地的时候，就发现一个问题。


    什么问题？


    很多人：太TM懒了。


    根本静不下心来取跟同行业学习，去跟一些优秀的顶尖高手学习。


    对于这类“恨铁不成钢的人”我还真没有办法。也是很蛋疼。


    有人说：老师不懂。


    不懂可以问啊，不会学习啊。


    对不对。 就怕一个人固执在自己的思维限制里面，还有一种恶习，改变不了，才是最可怕的。


    这点，我不想说太多。


    对于找到了一些同行：对于小白，我建议不适合搞原创，搞创新。


    最简单的动作，就是复制。


    具体指全方位，立体式的复制第一名。（我常说：我们只跟顶级高手学习！找到行业第一名-解读模式-研究模式-分化模式-复制模式-微创新模式。）


    如：ZARA，七年做800亿，香港单店年营业额超过2亿，一个服装企业，没有工厂，没有设计师，到底是什么？


    ![](img/b007b81b7b78642d97f2196ce4d77155_327_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_328_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_328_1.png)


    ZARA服装，靠复制，成为了世界第一名。


    这点是不是非常值得我们学习？


    其核心秘密是：复制模式


    A：复制LV旗舰店大小，都是2000平


    B：复制地理位置，永远在LV对面开店。


    C：复制LV的设计


    D：复制一线品牌的布料


    料子，款式一样。省了大量设计，打版费用。价格更低。


    E：复制一线品牌的营销策略


    如：制造短缺，新产品只有5件，卖完错过一辈子。


    唯一的差别就是：LV是手工制造，而ZARA工业流程化制造，而价格只是LV的十分之一。


    复制行业第一名，在另一个定位成为行业第一名。


    运用此方法：如何运用到企业中那？


    A：复制行业第一名的分配政策；

    B：复制行业第一名的营销策略，产品政策，定价；

    C：复制行业第一名的包装，设计。如：产品包装，网站包装，宣传册等；


    ……


    当下师为无上师，当下法为无上法。敬畏第一，才能成为第一。懂了就懂了……


    有的人一辈子都不明白此道理。


    当然了，我们复制了对方，一定要比对方要有差异化和不同的优秀卖点才行。


    要不然就是傻逼复制了。就好比：小时候魏永奇抄我的卷子，连名字也一起抄了。


    比如：ZARA模仿国际一线品牌的服装和包包。 布料和材质都是一样的。


    设计也一样。


    但是就是：一个手工制作，一个工业流水线。


    但是价格却模了十分之一。

