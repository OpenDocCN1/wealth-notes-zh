    # 策略之一：【软文推广】


    获得高精准流量模式: 定位用户群（什么类型用户，用户在哪里出没。）-分析用户（需求，痛点，习惯，阅读方式…）-发现鱼塘（论坛，社群）-软文撰写（复制，杂交…）——释放诱饵（软文释放价值）——引导加入我们鱼塘（公众号，微信号，QQ群，QQ号…）—


    一鱼塘持续成交；


    案例：如何一篇文章获得几百个高精准客户？


    定位用户群：化妆品---女性(爱美的女性)山茶油--宝妈(孕妇)……例子……


    根据我们所定位的人群，我们可以选择一个流量高的论坛【鱼塘】。


    例如我是做山茶油，我定位于宝妈。根据山茶油的功效，我们可以在这个论坛中找到一个相对应的圈子。


    这个圈子里的宝妈需求是什么？我们必须了解，他们喜欢什么样的阅读风格？【分析用户习惯，需求】可以看看哪些流量高的帖子。


    好，根据我了解到，这些宝妈的奶水不足，想要追奶。【用户痛点】


    我们就可以去网上收集关于追奶的资料。(一定要精，而且是宝妈们最需要的。)整理成一份文档【诱饵】。这样就可以去论坛发帖。


    怎么发才能让宝妈迫不及待的想要这份资料呢？


    当时我们软文是这么发的：


    生下宝宝的17天，我就发现我的母乳完全不够宝宝喝，对于一直希望母乳喂养的我来说，如同晴天霹雳一样。一时不知道该怎么办。我就直接去了医院，医院给我拿了一些追奶的东西。吃了第一天，可是一点效果都没有。我又赶紧跑去了一个老中医那里，让我喝点中药，慢慢调养，注意心情的调节，不要太过急躁，睡眠时间一定要充足，饮食方面也要注意。


    拿着中药我就回了家，平复了心情，每顿都少不了一碗鸡汤或者猪脚汤。大概过了三天，胀奶的感觉始终没有出现。眼看一罐奶粉就要喝完。我又开始慌了。突然想到我一个同学也是刚生下宝宝。怀着试一试的态度给她打去了电话。


    同学接到我的电话很兴奋，互相了解了对方的情况。同学告诉我，你怎么不早点告诉我，我在6天的时候就出现这种情况了，我婆婆给我开了一个方子。很有效，两天奶水就开始上涨。


    接着我和他在QQ上聊了一会，把那个方子告诉了我，下午他老公还给我带了两瓶油。让我做菜熬汤都用它。


    果然，第二天的时候奶水开始上涨，到了第三天，宝宝已经喝不完，只好晚上挤掉。我相信很多宝妈都会遇到这种情况，如果你也想要这个方子，私聊我，把你们的QQ留下，我发给你。


    ![](img/b007b81b7b78642d97f2196ce4d77155_182_0.png)


    就这样，持续了两天的顶贴，我收获了100多个QQ，不要问这QQ有什么用。


    这些是高精准用户，没有一个是微商。当他们看了我整理的资料后，会发现茶油真是個神奇的东西，并且会有部分人会向我询问这个东西。经过第一次的信任，转化几率是否会大大提高呢？


    可能你觉得这个是线上的软文：怎么做线下的？


    有一个经典案例：


    ![](img/b007b81b7b78642d97f2196ce4d77155_183_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_184_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_184_1.png)


    痛点，习惯，阅读方式…）—发现鱼塘（经常出没在哪里）—软文撰写（复制，杂交…）—释放诱饵（软文释放价值）——引导进入我们鱼塘（微信，手机号，上门…）——鱼塘持续成交；


    也遵循我们这个小流程。其实都是通用的。


    重金悬赏：1，定位男性 尤其是贪财好色的男性。


    这些人：1，是不是想要空手套白狼 2，他们是不是想好事 3，他们一般都在哪里出没。


    这些人是不是经常在：酒吧，KTV，红灯区，以及赌场，网吧等。经常出现？


    那么好了，我们就在这附近地上，或者这附近的柱子上，贴上小广告。


    ![](img/b007b81b7b78642d97f2196ce4d77155_185_0.png)


    软文怎么写：不懂的复制，杂交，模仿。


    释放诱饵（软文释放价值）：重金悬赏，先给定金，还有100万可以拿。


    然后坐等人联系，加我们微信，或者直接拨打手机号。


    到底怎么成交？


    （1）客户加我们微信，先让他给我们交1000元定金。


    然后我们在朋友圈散布，很多客户见证。


    以及生活照，吃饭照片，各种照片。真实存在的一个人。老公怎么out的。都有。


    （2）如果客户不交定金，你也可以来现场。 我们给你签订合同。


    好了，你来现场了，当场几个年轻小伙子，接着你，索要钱财。


    偷鸡不成蚀把米。


    ### 策略2：【释放价值引流】


    设计诱饵（推广文案+工具注意：线下可以用宣传页，席位票…）——定位（鱼塘：QQ群，社区，高端小区…）投放诱饵（引流到自己的鱼塘：QQ群，微信群，公众号，会议营销现场…）——设计一套成交模式（互动价值-信任-成交）。


    推广文案如下：


    超震撼，神奇《全自动营销系统》将在免费在群XXXXX首次分享！


    免费分享：


    +   1、100%企业都能直接模仿的赚钱系统；

    2、实操案例：保健品公司使用该系统，从亏损到开4家分公司；

    3、实操案例：美容院15天火爆销量；

    4、·······


    然后就有很多感兴趣，那么我们就设计一套互动成交方案。


    ## 【时事事件营销流量】


    是企业通过策划，组织和利用具有名人效应，新闻价值以及社会影响的人物或事件，引起媒体，社会团体和消费者的关注与兴趣，


    以求提高企业或产品的知名度，美誉度，树立良好品牌形象，并最终促成产品或服务的销售目的手段。


    简单讲，就是通过把握新闻规律，制造具有新闻价值的事件，通过具体的操作，让这个新闻事件得以传播，从而达到广告的效果。


    借助当下最热事件，嫁接自身产品属性。弄一些创意，让消费者自己病毒传播。


