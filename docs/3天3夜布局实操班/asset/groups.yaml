    # 【卧龙营销内部资料】布局实操班


    假设：我们设计了2款白酒的包装。第一款，我相信现在很多年轻人肯定都以为是地摊货。


    也看不上，就怕价格再便宜也卖不出去。


    但是第二款，就怕价格高一点，很多年轻人觉得送礼有面子，自然会选择第二个。


    所以：我们在酒的包装上面，花费多少时间都不为过。


    # 2, 刺激客户需求


    细化产品功能或者将不同功能组合以激发客户的潜在需要。


