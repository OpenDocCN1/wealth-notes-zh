    # 【卧龙营销内部资料】布局实操班


    而且还有返利，优惠，还可以成为股东，还有免费培训，旅游。你选哪个？


    直销行业运营成本高一些，如果我们可以想出一个方法，跟市场一样的价格，我们通过倍增学设计，玩转一个超市。


    如何？


    比如：你在我们超市充值2000元


