    同样一个道理：如果 Express 一个美女或者帅哥，花费了2-3年，用了很多心思，花了好多钱。付出了很多精力和时间。


    但是你又发现一个不错的姑娘。 这时候你会怎么办？


    是继续追之前的，还是追现在？


    如果说，换一个美女，那又要重头开始。因为成本太大了。


    所以：很多人可能还会选择之前的那位姑娘。


    同样我们经常用一招：怎么用？


    就是说一个普通客户，在我们美容院消费1000元，我们就送他一个铁牌会员卡。


    但是：如果消费满1万，我们就送他一个银牌会员卡。


    如果消费了10万，我们就送他金牌会员卡。可以享受8折优惠。


    如果有活动，还能打折上折。


    因为他在我们这里已经消费了那么多。如果他去其他店，就绝对没有这个优惠价格了。


    要么只是单纯的一个活动。


    而我们这里不单单他可以打折，还有积分，还有各种相应的会员权限。


    比如：如果你是银牌的会员，你就可以免费每月享受1次价值XX元护理。


    所以：客户一旦转换，如果1年以后不在此消费的话，那么会员再1-2年还会重新归零。


    所以：这个转换成本相对就高了很多。


