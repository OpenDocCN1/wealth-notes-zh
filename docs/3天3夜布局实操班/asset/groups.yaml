    ## 【市场情报系统】


    如何做项目100%成功那。


    这就需要我们超级厉害的，市场情报系统。


    +   （1）花费多少时间市场调研都不为过。

    +   （2）花费多少时间，市调研消费者都不为过。

    +   （3）花费多少时间，研究竞争对手都不为过。

    +   （4）花费多少时间，研究自己都不为过。

    +   （5）花费多少时间，用大数据来做战略规划都不为过。


    我们只要把这5点情报工作给做好了，几乎做任何一个项目都可以成功。


    第一：高手级市调     没有数量级市调=项目失败；


    凭借直觉做事的都是傻逼。就算我做咨询工作那么多年了，我也不敢凭借过去的经验来做事。


    所以：如果你要问我怎么做市场，我认为你第一个要做的不问我，而是做情报系统中的市调。


    你问我：我肯定要花费一些时间去现场，去很多地方获取一些信息。


    然后在根据市场的情况，现状，做出针对于性的方案。


    毕竟：每个区域，环境，条件，资源，都不一样。对不对。


    @天津市大厨小灶创始人陈军安


    所有营销方案制定和落地，都一定需要高手级市调（市场调研），不了解情况，就制定方案的营销人都是扯犊子。


    可能说：我经验丰富，但是如果我按照大城市的思路，给你小城市做方案，你觉得能成功吗？


    成功的概率会大吗？


    可能有效，也可能没有效果。


    但我不喜欢凭借直觉来做事。


    所以：如果你没有经过大量市调，或者研究分析消费者，以及自己的资源的情况下，我建议，最好不要问我问题。


    很多人，我认为就是太懒了。


    很多非常非常普通的事儿，随便找市调一下就解决了，非要咨询某某大师，你觉得有这个必要吗？


    一句话：做任何事儿，如果不知道怎么做。 市调，市调，市调………


    先自己解决问题，自己解决不了的，再让我给你出建议。


    这样这些知识和经验，才能真正转化到你的身上。


    不然下一次TM遇到问题，你还问我。


    老孔不可能一生一世陪伴你。


