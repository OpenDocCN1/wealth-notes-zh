    # 【卧龙营销内部资料】布局实操班


    ![](img/b007b81b7b78642d97f2196ce4d77155_195_0.png)


    他们这种：在前几年效果很好。好像现在这招也很好用。


    原价3988元的一个锅。现在只要1988元。而且再送微波炉一个价值3800元，再送2500元某品牌高端净水机一台。 这些还不够，再送你厨房四件套。


    http://www.happigo.com/tv5/快乐购电视购物。


    各位有时间，可以好好学习人家的电视购物。非常值得学习。


    很多其他老师：什么赠品营销，促销。其实很多策略都是从电视购物这些点学习来的。


    我们看：这家英语培训机构刚开始有什么错？


    亲自带领员工出去发传单宣传自己的学校，然后，他就坐在前台，等待家长领着孩子来报名。每当有家长咨询，他就会详细的、耐心的跟家长展示和介绍自己学校的方方面面……


    是不是传统营销都是这么玩。


    各位。


    这样做，每个客户都介绍半个小时，不但口干舌燥，一天下 来早已疲惫不堪了。


    如果我们没有足够的诱惑力，我们就不要去强奸客户，当客户来了，我们不要急于让客户下决定成交。


    那么我们就应该设计一种模式：改变销售流程。


    重新设计后的销售流程是这样的：


    第一步：依然在自己的学校前台做接待咨询工作，但是从以前大半个小时的讲解缩短到了


    简单的几分钟。


    主要任务不是成交，也不是介绍学校的各种情况，更不需要回答家长的各类问题。


    只需要送给校家长两份“礼物”（设计诱饵）。


    礼物包括两个方面：


    第1份礼物，价值68元的儿童英语学习指导光盘一张，光盘里详细介绍了一些可以让孩子学好英语的方法，以及介绍了这家英语机构的独特教学理念。（只要登记一下联系方式，就可以免费领取。收集数据库，便于跟踪。）


    如果光盘不方便，那么我们就送他一个在线视频vip学习会员卡。


    让他们在家就能在线学习英语。


    第2份礼物，送一堂价值180元的英语公开课，家长可以带着孩子，在本周六的下午2:00——4:00来免费学习，亲身体验一下，学校的师资水平，和教学方法，以及让孩子感受一下是不是喜欢这里的教学环境。


    第二步：在每周五，通知所有的家长，确认明天的课程人数，并告诉家长，只要明天到场，还有礼品赠送。


    第三步：公开课找出学校最优秀的老师，来展示学校的师资力量。在课程最后，报出参加培训的价格。


    结果非常轻松的很多家长就给孩子报名了，简直不可思议。


    我们现在一起来回顾一下，整件事情。为什么同样的学校，同样的老师，同样的产品，同样的顾客，只是换了一种方式来介绍，成家率就会提升差不多3倍呢？


    下面我们解析一下人性：


    现在假如你是一个家长，当你去一个培训机构，哪怕是再好的培训机构，你会不会因为别人跟你介绍的很好，就立刻报名呢？


    很显然，绝对不会。


    现在奸商，被骗的经历那么多，人都有很多抵触心理。（人性对任何东西都会质疑，顾虑....）


    我敢说你不会这么冲动的，你一定希望多了解一些，再做决定。


    但是一旦离开这个学校，你会立刻活到你的生活中照顾老人、应酬工作、打理家务……


    你可能很快就忘记了那些介绍的说辞，直到你下次再经过这家学校，或者，很久你也想不起来了。（人性习惯接触广告太多，只关心自己的事情。）


    但是，我用了另外一种方法对待你，因为你来的时候，对我还不了解，所以我不向你销售任何产品，而是向你送一份礼物，你会不会感谢我呢？


    （人性喜欢收礼）白给的都喜欢要。


    重点是这个碟片会告诉你，如何很好地教你小孩轻松学好英语，所以回到家你要看一下，当你看完了你知道是什么结果吗？


    结果就是，你虽然还没有送孩子来报名，但是你已经接受了我的教育，你已经感受到了我们学校的专业水准，你对学校的信任，开始慢慢积累。


    然后我还请你领着孩子来我们学校，由我们最棒的老师给你们讲课。


    不管你报不报名，你都可以让孩子学到东西。而且为了防止你忘记周六的公开课，我们还会在星期五提醒你一下，为了防止你懒惰不想来，我再用一个赠品刺激你一下。


    （人性喜欢意外惊喜！）


    当你经过了这几个环节，你对学校已经从陌生变得熟悉，从熟悉变的信任。所以成交变得顺理成章，自然到没有销售的痕迹。这就是成交流程优化的结果。


    【营销导读：“知道一了解一熟悉一信任一成交”的这一个过程就是销售流程。而99%的生意人都忽略了中间的三个环节，直接就来进行成交。】


    优化之后，成交率直接上升3倍。


    这里我给各位提一个好的学习营销的方法：如果想上来就成交掉客户，没事，可以多看看电视购物。


    我发现，但凡只要看，就有想要买的冲动。


    里面的话术，价值塑造，包装，赠品营销，折扣，优惠，以及稀缺，紧迫性，从众效应。


    都用上了。


    而且场景营销，细节营销，情感营销等。


    都包含了。 说起营销，电视购物才真正是营销的鼻祖。


    除了电视购物宣传片。


    有一档节目是做：各种商机，项目资讯的。


    我这边没有找到。


    如果我们公司想要做好招商：我们就可以多看招商项目的广告和他们做的宣传视频。也非常有意思。


    http://www.iqiyi.com/w_19rv3t4czh.html


    不是。具体可以私下去找。或者直接去招商网去学习。


    看那些点能打动我们。


