    个性技能类：私人定制（形象设计，家居生活设计，店面设计…），经纪人（明星，舞团，各种节目，展览…），维护，服务器管理，IT（软件开发，员工外包..），展销会…


    普通类：色情，瑜伽，舞蹈，音乐，健身，桑拿按摩，ktv，理疗，私人医生（厨师，理发师，美容师，减肥师，美甲，保姆，录像…）跑腿，外送（宅急送..），代要账，保镖，物流，旅游，劳务中介，打工者，雇佣兵，私人侦探，打假人士，家政，婚介，技术培训（舞蹈，音乐，美术..）


    # 【选择产品的核心：】


    +   1, 是否最大面积解决人类的问题

    2, 产品是否可重复消费，像毒瘾一样，上瘾。


    盈利的重点在于开发客户终身价值，开发一次，消费一生。

    3，产品是否可大批量复制

    4，产品能否轻资产化。


    量大是所有成功致富的关键。（洗头：去屑海飞丝；洗衣：碧浪洗衣液；喝茶：怕上火，喝王老吉；欧莱雅：让你更美丽！）


    6大吸金项目方向：1，男人好色2，女人爱美      3，小孩爱聪明     4，老年人爱健康     5，人人想赚钱6，人人要智慧…


    ![](img/b007b81b7b78642d97f2196ce4d77155_9_0.png)


    假设我们把项目：选在了做自己的酒。


    比如：卧龙“智慧酒”，“诸葛酒”….做酒水这个行业。


    1，量大     2，可重复消费      3，能轻资产（可以外包出去：把很多不必要的动作） 4，能轻松复制


    ![](img/b007b81b7b78642d97f2196ce4d77155_9_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_10_0.png)


    那么我们第二步就是：【产品策划系统】中的产品定位。定品类。


    我们必须通过大量的市场调查，寻找空白与差异化的市场定位。


    不能与大家都一样。要不然我们就没有卖点了。


    所有产品都有自己的定位，不可能任何人都成为我们客户。


    茅台——定位高端。


    五粮液——定位中高端。


    衡水老白干，定位——低端。


    纵向定位：低端——中端——高端。 或者低中端——中高端等。


    我们第一步就是：先纵向定位。


    第二步就是：我们要横向分化，进行定位。


    很多人说产品竞争力大，那么我们如何重新定位产品架构，挖掘市场空白点，打造一个新的蓝海市场那？


    很简单，就是在大概念中找细分领域，这就是空白点。 就是我们的横向定位。


    布局，是卧龙的定位。


    智慧，是刘一秒的定位。


    成功学，是陈安之的定位。


    潜能开发，是安东尼罗宾的定位。


    免费模式，是壹玖资本的定位。


    没有一个好的定位和概念，再好的产品和服务都不好卖。


    反过来呢，给普通的产品一个好的定位和概念，也许突然就火了。


    以水为例：空白细分领域不断分化。——开创蓝海的唯一途径；


    +   娃哈哈是第一种矿泉水

    乐百氏是第一种纯净水

    农夫山泉是第一种天然水

    可口可乐是第一种碳酸饮料

    鲜澄多是第一种果汁饮料

    乌龙茶是第一种茶饮料

    星巴克是第一大的咖啡饮料

    蒙牛现在是第一大的乳制品饮料

    红牛是第一大的功能型饮料

    ......


    如果我们也要打造一个新的空白领域。我们也可以叫做小分子水，纳米水，煮白开水....


    ![](img/b007b81b7b78642d97f2196ce4d77155_13_0.png)


    我们知道之前：很多有很多水。


    但是凉白开就利用一个概念：喝熟水。 ——凉白开是第一种熟水。


    结果现在在全国也很畅销。


    尽管有那么多，他们也做到了脱颖而出。


    就是利用了我们这个定位绝招。


    ![](img/b007b81b7b78642d97f2196ce4d77155_14_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_14_1.png)


    维生素的分化：孩子的、老人的、婴儿的、男人的、女人的、怀孕的女人、更年期的女人、节食的女士、健美的女士、感冒的人、吸烟者等等。


    牙膏的分化：美白的、坚固牙齿防蛀牙的、防过敏的、预防上火的、清新口气的，甚至还有竹盐咸口味的，营养牙膏（雕牌）、儿童牙膏。


    （外资）高露洁，佳洁士，中华，黑人；


    （民族）两面针，田七，黑妹，冷酸灵，蓝天；


    （新兴力量）LG竹盐，纳爱斯，永南


    牛奶的分化：有原味的、各种果味的、含果粒的，伴果酱的、低糖的、无糖的、低脂的、脱脂的、高铁高钙的、添加各种微量元素的等等


    现在是不是又出现了很多品类。 低胆固醇的。


    ![](img/b007b81b7b78642d97f2196ce4d77155_15_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_15_1.png)


    中老年舒化牛奶。


    还有0-3岁小孩喝的24小时，纯鲜奶。


    比如：很多人喝牛奶想补钙，那么一定会选择高铁高钙的这种概念的产品。有人，因为糖尿病，所以不能吃糖，就选无糖的。


    还有一些人，喝牛奶，不想发胖，还想美容。那么就会选择低脂的。——这就是细分领域创造佼佼者。


    所以：我们定位一定要有自己的精准定位。


    ![](img/b007b81b7b78642d97f2196ce4d77155_16_0.png)


    其实：杀毒软件也可以进行分化。


    比如：360 搞一个安全第一。


    我们如果做毒霸，做其他杀毒软件我们就可以叫什么：金山毒霸 中国杀毒第一。


    ![](img/b007b81b7b78642d97f2196ce4d77155_16_1.png)


    同样：小儿葵花肺热消毒片。


    是不是把品类定位到：儿童医药市场了。


    直接跟大人的药给分开了。这时候，所有的父母，肯定都会买儿童药给自己家孩子对不对。


    具体为什么用葵花？ 我们先不讲。这里只谈定位。用葵花做设计，这是建立品牌印象的设计内容。


    # 产品分化策略


    化妆品的分化：


    论功能，有滋润的、美白的、祛斑的、防皱的、丰胸的

    论用途，有面霜、眼霜、手霜、足霜、腿霜、全身用的护肤霜

    论形态，又有精华液、乳液、膏体、还有膜的等等


    广告行业的分化：电视广告、网络广告、报纸广告、杂志广告、户外广告、广播广告；户外广告又可以继续分化：地铁广告、街道广告、零销点广告、交通广告、大看板广告、电梯广告、计程车广告、厕所广告。


    鸡蛋的分化：普通的鸡蛋，高价鸡蛋，胡萝卜素鸡蛋，婴儿的鸡蛋，高营养鸡蛋，低胆固醇鸡蛋、孕妇鸡蛋、高钙鸡蛋、非饲料鸡蛋等等。


    鞋子的分化：男鞋、女鞋、童鞋、凉鞋、拖鞋、运动鞋、足球鞋、篮球鞋、呼吸篮球鞋、休闲鞋、网球鞋、滑雪板鞋、自行车鞋等等。


    以后还会有专用的：跑步鞋，瑜伽鞋，减肥鞋....


    培训行业的分化：模式，系统，智慧，机制，模型，模板，理论，心法，原则，秘密，内参，秘密，工具，策略，方法，原理，领袖，布局....


    开创蓝海成功的唯一途径：先纵向定位，后横向分化细分定位。


    20年来我发现：所有做起来的牛逼小公司都是从样板细分市场切入进去的。


    因为同质化眼中，市场竞争大，那么经过细分，就开创一个新市场，新的定位和差异化。


    这点我们每个人都可以采用。


    适合于所有能创品牌的行业寻找所在行业及细分市场空白，通过穷尽分析和专业分析，找

    到统一行业内尚未被开发的其他有效细分市场空白点，并有机会构建先发竞争优势。


    比如说：马应龙痔疮膏。而我们可以开发这样3个产品oppo专治内痔痔疮膏。vivo专治外痔痔疮膏。offo专治混合痔痔疮膏。


    ![](img/b007b81b7b78642d97f2196ce4d77155_18_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_18_1.png)


    并适用所有行业，一个行业外企业，想快速进入新行业，可以采用这种方法，顺利进入。


    如：汇源开发了高浓度果汁，统一延伸开发低浓度果汁，农夫山泉则根据品牌高端定位开发了高端果汁，而康师傅则专注与低价全系列低浓度果汁。


    如：康师傅开发了牛肉面，统一开发了老坛酸菜面，而今麦郎开发了弹面。


    ![](img/b007b81b7b78642d97f2196ce4d77155_19_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_19_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_19_2.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_20_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_20_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_20_2.png)


    使得日益趋同饮料，或方便面市场，发现，创造了细分蓝海市场，且这些延伸思路都取得较好效果。


    可能有人就给我讲了：老师你说的都是大企业在用。


    我们没有那么大品牌和实力，怎么做？


