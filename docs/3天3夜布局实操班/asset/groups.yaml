    # 策略之一：【软文推广】


    获得高精准流量模式: 定位用户群（什么类型用户，用户在哪里出没。）-分析用户（需求，痛点，习惯，阅读方式…）-发现鱼塘（论坛，社群）-软文撰写（复制，杂交…）——释放诱饵（软文释放价值）——引导加入我们鱼塘（公众号，微信号，QQ群，QQ号…）—


    一鱼塘持续成交；


    案例：如何一篇文章获得几百个高精准客户？


    定位用户群：化妆品---女性(爱美的女性)山茶油--宝妈(孕妇)……例子……


