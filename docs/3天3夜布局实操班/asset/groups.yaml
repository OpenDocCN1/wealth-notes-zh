    企业的愿景：        企业的使命：        企业的纪律：好比老毛的三大纪律，8大注意一个道理。    企业文化：    原则.....


    ## 四拜文化：


    ## 拜客户


    客户是天，是客户让我们的价值得以体现；客户是衣食父母，是客户让我们的生命得以延续；以客户为尚，用爱做服务


