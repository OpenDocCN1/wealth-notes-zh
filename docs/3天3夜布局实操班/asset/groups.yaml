    绑定刚需自己成为赠品


    第三种方法：时间（习惯）：让对方形成习惯。


    比如：第一次去吃板面吃着不赖，这时候这是新客户，我们在给他2张~4张，半价卷，客户第二次，第三次，一定会先考虑我们。


    当他形成习惯，就不自觉来到我们店消费了。就算旁边新开了一家牛肉汤店，他也不愿意去尝试。因为替换有点高，万一不好吃咋办。更重要的是他已经形成习惯了。


    第四种方法：替换，转换成本高——绑定住对方通过一些方法


    归属感（氛围）：就好比你微信现在有几百人，甚至几千人，做什么事情都是在这上面沟通，每天几乎每个15分钟我们都会看一次微信。


    这就是有微信就有归属感，感觉自己还活着。


    但是如果突然出来一个新的版本比如：网易，或者淘宝推出一个微信，转换成本就太高了。


    因为你要重新添加那么多好友，而且很多人好友也都不玩这个，况且现在微信本来就很好用。  所以替换成本太高了。


    就好比我们跟供应商，原本是在一起合作，一直合作的很好。因为对方质量还算不错。


    但是这个供货商就给我连续涨了好几次价格。


    我去问：其他竞品，的时候，我看他们的报价也很高。我又怕他们质量不怎么样。


    因为一旦跟第一个供货商合作比较长，我们就难以再转换了，因为万一换了供应商，产品质量不行，都是麻烦。


    所以虽然价格高了一点，我还是会坚持选之前的供货商。


    # 【卧龙营销内部资料】布局实操班


    为什么？


    因为转换成本太高了。万一遇到假货，得不偿失了。


    同样一个道理：如果 Express 一个美女或者帅哥，花费了2-3年，用了很多心思，花了好多钱。付出了很多精力和时间。


    但是你又发现一个不错的姑娘。 这时候你会怎么办？


    是继续追之前的，还是追现在？


    如果说，换一个美女，那又要重头开始。因为成本太大了。


    所以：很多人可能还会选择之前的那位姑娘。


    同样我们经常用一招：怎么用？


    就是说一个普通客户，在我们美容院消费1000元，我们就送他一个铁牌会员卡。


    但是：如果消费满1万，我们就送他一个银牌会员卡。


    如果消费了10万，我们就送他金牌会员卡。可以享受8折优惠。


    如果有活动，还能打折上折。


    因为他在我们这里已经消费了那么多。如果他去其他店，就绝对没有这个优惠价格了。


    要么只是单纯的一个活动。


    而我们这里不单单他可以打折，还有积分，还有各种相应的会员权限。


    比如：如果你是银牌的会员，你就可以免费每月享受1次价值XX元护理。


    所以：客户一旦转换，如果1年以后不在此消费的话，那么会员再1-2年还会重新归零。


    所以：这个转换成本相对就高了很多。


    第五种方法：金钱投注：比如吃饭啤酒半价会员。99元全年卡。 或者199元全年打8-9折，会员卡。


