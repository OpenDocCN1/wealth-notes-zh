    我们提前进入今天的分享课程。


    首先，我刚刚想到一个非常重要的点，也是很多人做项目最大的误区。


    什么误区？


    送你一句话


    所有的成功人和大企业：都是从一个点切入最后取得巨大成功的。


    你能把这句话搞明白了，你早就成功了


    学会放弃


    学会舍


    嗯，是的！我这几年跌到人生的最低谷了。


    一句话能帮你节省10年的话：“这个世界上所有有巨大成功的人和企业，都是从一个点切入，最后获得了巨大的成就。”


    ——wo long


    懂了就懂了……


    讲一个故事：以前我做事情，也是什么都想做好，最后发现这个想做，另外一个也想做，最后2件事情什么也做不好。


    其实在我们创业，找项目过程中，以及选择职业，或者学习的过程。


    我希望各位一定要记住这句话：这句话悟透了，搞懂了，真正体会到了，你会发现真的能帮你节省十年的时间。


    什么意思？


    成功一定有一定的共性：都是从一个点切入进去的。


    史玉柱也好，马云，孙正义，王健林，以及马化腾等。


    每个人的成功，其实都是从一个点做好，切入到更大市场的。


    记住：所有创业，千万要专业，不高盲目搞多元化，拉长战线。


    所有的成功企业和成功的人都是从一个点进行切入，最后取得巨大成功的。——wo long


    这个世界上有一个最大的僭遢思维就是：


    +   1, 不要把鸡蛋放到一个篮子里

    +   2, 木桶理论

    +   3, 要多元化，不能太单一，要丰富产品线，这样才能东方不亮，西方亮。加强抗风险能力。


    我认为：这点并不适合大多数盲目想要成功的人。


    那么到底要不要多元化？


    有些企业多元化成功了，有些过度单一死了。


    谁对谁错那


    很简单：就是该单一的时候，就单一，该多元化的时候就多元化。


    > ——你可能说了：老孔你不是说废话吗？


    其实在我们做生意和做项目，还是引流过程中，我们要遵循这样一个原则：


    先多元化——单一聚焦。


    比如：我们做了10个产品，我发现8个不赚钱，那么我们直接砍掉所有的项目，只搞这2个，做到极致。


    多元化——单一项目的专业。


    比如：在2001年，那时候，我跟我哥去卖全场9.9元的商品。


    其中哪，有各种小家电，小家具，雨伞，弹弓，锅碗瓢盆……


    各种用品。


    那时候我就发现有一个东西卖的最好：什么东西？


    就是弹弓。


    后来我就找一个朋友：什么也不卖了，只卖弹弓。结果真如我说的那样。


    生意真好。


    ![](img/b007b81b7b78642d97f2196ce4d77155_309_0.png)


    关键那时候：咱也不懂营销。也不懂招商加盟这个套路。


    只是频繁换地方，赚个临时钱。


    所以说：我们不是不允许搞多元化。


    如果你要搞，可以：但是你必须大量统计数据，并发现一些机会，然后把最好的那一块发挥到极致。


    一定要专业，专业，专业，专业....


    但是那：如果我们从一开始可能选择不对，但是后面改进，升级了玩法，在业内有优势，凸显了。


    但是有一个问题：


    刚开始我们没钱，怎么做？


    肯定要更加专业了。


    因为你没资源，没时间，没这个，没那个，搞多元化，什么都搞不成。


    就这样。 规律使然也。


    万变不离其宗，再大的规律和本质，永远都不会变。


    当然了：如果你的企业某一个细分领域做到了第一名，或者前三名，你可以搞多元化。


    但是你什么都没有的情况下，或者资金，资源，精力和时间都不太足的情况下，怎么搞？唯一成功的通道就是：专业。


    千万别信什么木桶理论，不要把鸡蛋放到一个篮子里。


    包括学习也是：很多人碎片化学习。


    导致什么事儿也学不好。表面上看很多东西都懂。但是 tekan 一用，你就蒙圈了。


    还是那句话：一句能帮你节省10年的话：“这个世界上所有有巨大成功的人和企业，都是从一个点切入，最后获得了巨大的成就。”


    ——wo long


    ![](img/b007b81b7b78642d97f2196ce4d77155_311_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_311_1.png)


    对于昨天的【培训系统】一个是针对员工进行培训。


    另外还有更重要的一项就是：我们针对终端门店，经销商，批发商，代理商，等。都要给他们希望，让他们天天看到成功案例出来。


    以及我们要对下面进行检查，监督，并且：我们培训给他们可以复制的一套话术模板，陈列模板，签单技巧，市场开拓客户的培训等。


    过去使用报纸宣传，以及企业公报进行宣传，现在就方便很多了，一个朋友圈，一个微信群。


    是最佳的宣传，培训技巧的方式之一了。


    所以：我们一定要做好市场扶持培训这项工作。


    ## 【市场情报系统】


    如何做项目100%成功那。


    这就需要我们超级厉害的，市场情报系统。


    +   （1）花费多少时间市场调研都不为过。

    +   （2）花费多少时间，市调研消费者都不为过。

    +   （3）花费多少时间，研究竞争对手都不为过。

    +   （4）花费多少时间，研究自己都不为过。

    +   （5）花费多少时间，用大数据来做战略规划都不为过。


    我们只要把这5点情报工作给做好了，几乎做任何一个项目都可以成功。


    第一：高手级市调     没有数量级市调=项目失败；


    凭借直觉做事的都是傻逼。就算我做咨询工作那么多年了，我也不敢凭借过去的经验来做事。


    所以：如果你要问我怎么做市场，我认为你第一个要做的不问我，而是做情报系统中的市调。


    你问我：我肯定要花费一些时间去现场，去很多地方获取一些信息。


    然后在根据市场的情况，现状，做出针对于性的方案。


    毕竟：每个区域，环境，条件，资源，都不一样。对不对。


    @天津市大厨小灶创始人陈军安


    所有营销方案制定和落地，都一定需要高手级市调（市场调研），不了解情况，就制定方案的营销人都是扯犊子。


    可能说：我经验丰富，但是如果我按照大城市的思路，给你小城市做方案，你觉得能成功吗？


    成功的概率会大吗？


    可能有效，也可能没有效果。


    但我不喜欢凭借直觉来做事。


    所以：如果你没有经过大量市调，或者研究分析消费者，以及自己的资源的情况下，我建议，最好不要问我问题。


    很多人，我认为就是太懒了。


    很多非常非常普通的事儿，随便找市调一下就解决了，非要咨询某某大师，你觉得有这个必要吗？


    一句话：做任何事儿，如果不知道怎么做。 市调，市调，市调………


    先自己解决问题，自己解决不了的，再让我给你出建议。


    这样这些知识和经验，才能真正转化到你的身上。


    不然下一次TM遇到问题，你还问我。


    老孔不可能一生一世陪伴你。


    继续正题。


    ## 【万能市调模型】


    对内市调：财务数据+员工反馈数据+自身观察留意数据+找托来体验反馈数据。


    攘外必先安内。 我们先看看公司业绩，账单，财务数据，看看分析一下是什么样的。


    然后我们根据财务来找出一些具体的问题，和原因。


    这点我想不需要我去唠嗡了。


    员工反馈数据：我们在开早会，晚会，或者月会，季度会，我们给员工一些自由发言的机会，让他们给公司提出建议，以及为什么会出现这样的问题等。


    这样的话，我们才能在一定程度上了解公司的问题。


    自身观察留意数据：要知道单纯凭借员工的一面之词，作为老板和企业家，一定会上当受骗。

