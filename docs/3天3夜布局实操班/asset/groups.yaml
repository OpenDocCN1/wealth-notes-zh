    间放在更有用的地方。


    下班后的4小时，你要怎么过？


    以上就是富人与穷人截然不同的240分钟，和穷人相比，他们的240

    分钟：


    60分钟制定计划，或者想办法把计划落地；

    60分钟学习，包括看书、看报表、学习课程、看英语节目；

    30分钟锻炼身体；

    30分钟维持人脉；

    60分钟娱乐，放松自己。


    240分钟，也就是4个小时，大概就是我们下班回家后到睡觉的这一段时间。


    在这一段宝贵的时间里，有多少人是玩手机、玩游戏、刷视频度过的？


    你利用时间的方式，决定你人生的高度，富人们通过高效地方式利用时间，经过多年的持之以恒，终于实现了财富的积累。


    成功并非易事，根据科里的统计，白手起家的富人们平均要用12年才能积累起自己的财富。


    但正如科里所言：


    > “如果你养成了他们拥有的那些日常习惯，就等于在沿着他们的足迹前进，而且那条路只会通往一个地方——充满机遇、成就、财富、健康和幸福的人生。”


    ## 附：美国富人的13个生活习惯


    01


    ## 喜欢阅读


    88%的富人每天会至少阅读30分钟，内容以自学和自我提升类阅读为主。


    大多数人都不 converg 为了娱乐去读书，富人阅读是为了获取知识。


    他们倾向于阅读三类书：成功人士自传、个人修养或发展类书籍、历史类书籍。

    我从书中所学到的，比从正规教育所学的要多得多。书不仅开拓我们的视野，还帮助我们做切合实际的选择，知识激励我们前行。


    > ——罗伊·纽伯格（94岁还在交易、68年从无亏损的“世纪炒股赢家”）


    02


    ## 坚持锻炼


    76%的富人坚持每天有氧运动30分钟以上。


    有氧运动包括跑步、短跑、快走、骑自行车等。


    有氧运动不仅对身体好，对大脑也有很大帮助。


    有氧运动可以增加神经元(脑细胞)，体育锻炼还可以增加体内葡萄糖含量，葡萄糖就是大脑的燃料。


    大脑获得的养料越多，发展就会越好，你也会变得更聪明。


    健身是每时每刻的事，它是吃进去的每种食物，是充足的睡眠，是压力管理。


    > ——斯科特·迈纳德（债券投资大师）


    03


    ## 结识成功人士


    你会和你常常来往的人一样成功。


    富人总是在寻找目标明确、乐观热情、心态积极的人做朋友。


    另外也要避免与负能量的人或影响接触，负面的、消极的批评会让你离成功的道路越来越远。


    格雷厄姆的学生们是一个好的圈子。沃伦·巴菲特人非常不错，他每隔两年邀请我们，我们会去某个地方聚聚。


    > ——沃尔特·施洛斯(48年赚1240倍、价值投资大师)


    04


    ## 追求梦想


    追求自己的梦想和目标，可以让你产生长期的幸福感，最终转化为大量的财富。


    有太多人犯了追逐别人(比如他们父母)的梦想的错误，富人则不断完善自己的目标，坚韧且激情满满地追求它们。


    激情让工作更有趣，激情给你提供克服失败、错误、拒绝的能力、坚持和重心。我生来一贫如洗，但决不能死时仍旧贫困潦倒。


    > ——乔治·索罗斯（金融大鳄）


    05


    ## 坚持早起


    一半以上自力更生成为百万富翁的人士，至少在工作时间前三个小时起床。


    这是对付日常工作突发情况的一种解决策略，比如开会时间太长、路况太堵、要去学校接生病的孩子等等。


    这些突发情况会对我们产生心理影响，改变我们的潜意识，最终会让我们觉得生活已经失控。早晨五点起床，完成你今天工作中最重要的三件事，这会让你重新掌控你的生活，给你一种主导自己生活的自信感。


    早起，努力工作，找到油井，你就会飞黄腾达。


    > ——保罗·格蒂（石油大亨）


    06


    ## 广开财源


    白手起家的百万富翁不会依赖单一的收入来源，他们有多重收入方式。


    在我的研究中，65%的富人在他们赚得第一笔百万美元之前，已经有至少三种收入来源了。额外的收入包括房地产租赁、股市投资、副业的部分所有权等。


    不要将你的鸡蛋全都放在一只篮子里。


    > ——詹姆斯·托宾（诺贝尔经济学奖得主、资产组合选择理论创始人）


    07


    ## 拥有导师


    找到自己的导师可以让你更快积聚财富。


    成功的导师不仅仅是会对你的生活产生积极的影响。通过指导你什么该做、什么不该做，他们可以定期地活跃在你的成功道路上。


    他们与你分享有价值的成功经验，这些经验要么来自于他们的导师，或是来自于曾经失败的打击。


    我为格雷厄姆工作学到了很多，每天在他身边就能学到很多。我们后来成了朋友，我们的友谊一直持续到25年后他去世。


    ——沃伦·巴菲特（股神）


    08


    ## 积极向上


    只有当你有积极的精神态度时，你才能获得长期的成功。


    在我的研究中，积极向上是所有自力更生百万富翁的标志。


    问题在于，大部分人无法确定他们的想法到底是积极的还是消极的。


    如果你停下来听听自己的思想，感受它们的存在，你会发现绝大多数想法都是消极的。


    但只有当你强迫自己去看清内心时，你才会意识到这些消极思想的存在。


    意识到它们的存在是最关键的。


    每天早晨，我总是对自己说，我会拥有美好的一天。即使这一天并不如意，但我总是看到事情积极的一面。


    ——布鲁斯·约翰逊（期货大师）


    09


    ## 拒绝从众


    我们总是希望融入到社会中，适应这个社会，并成为其中一部分，因此我们总会尽力不让自己过于突出。


    但是，无法让自己与他人区分出来，所以大多数人无法获得成功。


    成功人士创造自己的圈子，并把他人拉进来，你需要让自己突出，然后创造你自己的圈子，让别人来加入你。


    不要随群众起舞。


    > ——菲利普·费雪（现代投资理论的开路先锋）


    ## 举止礼貌


    自力更生的百万富翁掌握了社会礼仪的重要原则，如果你想获得成功，你也需要掌握同样的原则。


    这些礼仪包括寄送感谢信、记得重要的日期(如结婚纪念日、生日)、掌握餐桌礼仪以及在不同的场合正确着装。


    与人有约，一定要早到。你这样做，不但能让自己保持高效，还能给人以好印象，因为大多数人都迟到，还有人每次都迟到。


    > ——吉姆·罗杰斯（量子基金联合创始人）


    ## 乐于助人


    帮助其他人追逐目标和梦想并获得成功，这也可以让你从中受益。


    如果没有其他成功人士，那么成功也是很难定义的。


    如果想要成功，最好的方式是首先帮助他人。


    但是，你不应该给所有人都提供帮助，你只应该帮助那些乐观的、有明确目标的、积极的、追逐梦想的人。


    快乐并非来自自我放纵，而是因为有机会帮助他人。


    > ——约翰·邓普顿（全球投资之父）


    ## 勤于思考


    思考是他们成功的关键。


    富人倾向于在早晨独立思考至少15分钟。他们每天早头脑中思考很多事情。话题既包括事业和财务，也包括健康和慈善。


    他们经常会问自己这样的问题：我怎么做才能赚更多钱？我的工作让我开心吗？我锻炼时间足够吗？我还可以参与哪些慈善活动？


    巴菲特和我都做了这件事，我们花大量的时间思考。我的日程安排并不满，我们坐下来不停地思考。某种程度上，我们看上去更像学者而不是商人。


    > ——查理·芒格（巴菲特“黄金搭档”）


    ## 寻求反馈


    因为害怕批评，所以我们很少向他人寻求反馈。但是，反馈是了解做事正确与否的关键。


    反馈帮助你了解自己是否仍在正确的道路上。


    如果反馈是批评，无论是好还是坏，都是学习和成长的重要元素。


    此外，反馈可以让你改变重心，体验新的事业或道路。反馈中提供给你的信息，让你可以在任意企业中获得成功。


    自己总有出错的时候。努力去了解他人的想法——不仅仅是结论，更是背后的原因——对于确保自己不会犯错是有价值的。


    > ——雷·达里奥（对冲基金教父、桥水基金创始人）


    现在知道自己为什么穷了？

    答案就是每天下班后的240分钟！

    哎！

    书到用时方恨少！

    只恨自己懂的少！


    看到这个分享，我就想起了我大学看了1000本市场营销方面的书籍。


    另外我给自己一直在做规划梦想和目标。


    后来我从这1000本书，给自己定位一个位置：营销。


    为什么？


    因为我发现天下所有的牛人，再厉害的老板和企业家，都多少在用营销。即便他不知道怎么用。


    所以：我当时就给自己一个想法。       此生一直从事营销行业。


    十年磨一剑。


    现在磨了二十年的剑，但是因为兴趣，因为痴迷，目前仍然乐此不疲。


    每天仍然会坚持看1-2个小时的营销书籍。


    每天也会健身1个小时。


    怎么规划目标和梦想？       然后怎么做战略那？


    很简单，就是我们的布局小模板。


    ## 【2018年布局小模板：永远以结果导向。】


    +   1, 明确目标（结果导向）

    人生就两件事，一件事与结果无关，一件事是与结果有关，多数人没有结果，根源在于把焦点放错了地方。

    2, 必须具备的资源（列出必备的几个条件）

    3, 分析现有资源（有多少差距）

    4, 还缺少那些资源？（缺少的条件）


    记住：永远都不要等到条件具备才开始，因为那一天永远不会到来。


    +   5, 缺少的资源在谁手里？（所缺的，都放在那里）

    6, 如何将缺少的资源整合回来，如何整合关键的人，事，物体（给他最想要的）

    7, 精确，实际，实时动态的准确情报信息（知己知彼知他方能百战百胜）。


    +   8, 逆势行动，结果导向，立即践行。（超强的执行力，自制力，一日不可间断也）


    +   9. 反省，优化，生发，升华。标准化，自动化，流程化。


    +   10. 务必有时间限制，期限，务必有短期，中期，长期计划。


    明确自己想要的结果（目标），无论面对什么事，都先问自己：我做的这事与我目标有关吗？如果有关立即行动，如果无关立即屏蔽，一个人能成事就是绝对聚焦，一个人平庸普通就是因为，他将有限的精力分散到了各种与结果无关的事。


    还有就是结果，很多人会说没有功劳也有苦劳。我从来都不认同这句话，没有结果的努力

