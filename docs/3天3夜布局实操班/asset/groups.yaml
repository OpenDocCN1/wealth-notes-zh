    三棵树卖的是油漆：我们知道，过去很多报道和新闻，报道过甲醛中毒，超标的事件。


    现在很多人内心里面非常害怕，恐惧，担心甲醛这个东西，对人身体有害，有毒。


    因为过去我们装修的房子，很多都含有甲醛，尤其是油漆里面含的量更多，然而很多人装修房子，要等2个月，甚至3个月才能居住。


    这就是我们大众的痛点。——这个就是就是消费者最关心的痛点。


    所以，三棵树这家公司，从几百个广告语和文案中，最后筛选了一条最有冲击力：大众想要的一句话就是：“三棵树，马上住！！”。


