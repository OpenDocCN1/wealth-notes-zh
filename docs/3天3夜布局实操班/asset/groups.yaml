    我们目前采用的卖点主要有33类。


    这是一个通用的模板。基本上我们产品策划系统，分享完毕。下午我们继续分享。


    老师，您说一个产品本身有很多的卖点，我们要打一个卖点，还是1到3个卖点？


    + (1) 我们通过大量的市调，研究，分析消费者，最关心的一项是哪个。


    + (2) 通过大量数据分析，我们就可以得到一个最好的卖点。每个行业不一样。


    我们就把需求度最高的那個，打出来。


    ![](img/b007b81b7b78642d97f2196ce4d77155_70_0.png)


    比如：我们买肉，可能关心，要瘦的，要价格，要质量，要其他。如果我们究其根源，我们发现，我们最关心的是：是否新鲜。


    所以打出：“不卖隔夜肉”就是最大的需求卖点了。


    比如：你吃一个壮阳保健，人性最想要的需求肯定是：“吃了一粒，马上就能干2小时。”


    这是人性第一需要的，其次，才关心是不是不复发，无毒副作用，或者其他价格，等。


    当然了，这个最大需求也是在变化的。并不是不变的。


    比如：过去我们头屑多，我们需求最大的就是：去屑。


    所以海飞丝一直打一个卖点：去屑海飞丝。


    现在那，一般普通的洗发水，都能去屑。 所以就需要更新卖点：去屑润发不油腻。


    那么这个时候，这样的多重卖点，可能更具有卖点。


    我们继续接着上午的分享。


    ## （6）品牌名字


    第一种方法就是：卖点提炼法。


    ![](img/b007b81b7b78642d97f2196ce4d77155_71_0.png)


    污渍洗衣粉。立白洗衣液。


    ![](img/b007b81b7b78642d97f2196ce4d77155_72_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_72_1.png)


    比如：有些染头发的一下就把头发给染黑了就起名：一洗黑。


    ![](img/b007b81b7b78642d97f2196ce4d77155_73_0.png)


    ROSIDN

    润丝丹®

    洗出黑发

    健康遮白

    一洗黑洗发露400ml

    植物提取不伤发


    ![](img/b007b81b7b78642d97f2196ce4d77155_73_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_74_0.png)


    我们这个卖点提炼法，直接就是我们的最佳卖点，把他给当做名字了。效果很好，而且很容易记忆。


