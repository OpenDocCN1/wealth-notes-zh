    # 【卧龙营销内部资料】布局实操班


    各位一定要使用这8个框架进行命名。这样会获得很好的记忆效果和传播效果。


    而不是：随自己的个性和心意去叫一个什么名字。甚至有些就叫媳妇的名字，或者儿子的名字的组合，或者自己的名字。


    其实我认为，如果你要形成一个独特标志和想把生意做大，命名，是最基础，最基础的一个动作和有必要的环节。


    ## (7) 广告语的设计。


    牛逼广告语示范：


    “今年过节不收礼，收礼还收脑白金”——脑白金广告语。


    “农夫山泉有点甜”——农夫山泉早期广告语；


    “不是所有牛奶都叫特仑苏”——特仑苏广告语；


    “怕上火，喝王老吉！！！”——王老吉；


    “红牛，激发正能量”——红牛能量饮料；


    “布局，让你不一样！”——卧龙布局广告语；


    “雪碧，透心凉！！！”——雪碧广告语。

    “老梁家馒头，更用心！！”——老梁馒头。

    “王府家擀面皮，30年老店，传统工艺，更好吃”—王府擀面皮。

    “曹老头，29年来只为做好一碗烩面....”—曹老头烩面。


    不管是门店，企业，还是国家都需要一个牛逼的广告语来迎合当下的需求和消费方式。


    比如：“大众创新，万众创业”简单明了，说明国家对创新，创业的扶持和鼓励。


    ![](img/b007b81b7b78642d97f2196ce4d77155_102_0.png)


    那么这些广告语到底怎么写出来的那？


    最起初，最传统，最有效的方法是：模仿，改造，优化，先写出几百个广告语出来。


    比如：邓小平——“先富带后富，让一部分先富起来。”而后史玉柱的脑白金就模仿写了一个“脑黄金，让一亿人先聪明起来”。


    真正的策划就是这样做的，都是看迎合趋势，先模仿，再改造，优化的过程。


    具体广告语落地步骤：


    （1）让团队的所有文案人员，策划人员，营销人员，全部加入进来，探讨如何写一个牛逼的广告语。每个人必须写出20条以上，然后大家一起汇总。


    （2）最后大家写出了几百条，甚至几千条，然后由策划经理和大家一起，层层筛选，从几百，几千个广告语中，找出10条最能引发共鸣（需要大量市调消费的核心需求），容易记忆，感觉很好的广告语。


    如果这10条，有些我们感觉不顺，就去修改，优化，然后直到满意为止。


    （3）最后从这10条，精挑细选的广告语中，最后一次筛选，结合国家，企业，门店，或者小摊小贩的实际情况，选出最优秀，最精的3条，备用。


    （4）最后，我们从这3条备用中，拿出最最让我们有感觉，一眼就能记住，的广告语，然后通过VI门店设计，场景设计，以及广告语标识，产品，或视频等尝试加进去，经过这样反反复复，可能至少要一周，半个月的时间测试，反复打磨，最后才会把广告语呈现到消费者面前。


    所有牛逼的广告语都是这么来的。


    因为我们没有一个系统，也没有什么可以借鉴，只能依靠一些创意去设计广告语。


    但是就目前而言，我们就有了可以复制的系统。和模板。


    就可以按照模板和逻辑来设计，就会更符合。但是不要受到框架的局限。


    一定要敢于大胆设计。


    比如：


