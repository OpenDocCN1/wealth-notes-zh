  md: '

    ## 【卧龙营销内部资料】布局实操班


    这会给当时用户有概念体验和印象留存是不是特别惊喜那。


    运维策略：用户代言人。


    客户每次住过的酒店，或者吃过的饭，然后让他们做一个评价和服务，或者写上自己的一句名言或者对某某人的祝福。


    然后我们就贴在墙上，这样做的目的：1，给其他客户一种共鸣  2，如果客户是单身还可以留他的微信，让别人来加他。  3，客户在这上面找到了自己的价值。


    虽然只是一个很小很小的互动。


    比如：很多奶茶店，或者果蔬，美甲店，等。  都会写一些爱慕的话，或者对自己的评价，以及店铺的评价等。


    其实给人一种感觉，也是一种触动。


    至少心灵上会有不少感觉。


    我们也可以让客户：写下自己的梦想。


    他们的目标。或者今天的心情。


    或者一些格言等。都可以。


    表面上看：是一个很小的互动。  但是粘性真的还是不错的。


    为什么？


    1，如果你写了之后，那么你再体验产品的过程中，感觉会与其他不一样。


    就有感情的因素在里面。


    2，对于用户写过的东西，他可能会有一个回忆，看着自己曾经在这里做过什么，这都是慢慢的记忆啊。


    有一家店我也找不到照片了。


    他们怎么做的那？


    ![](img/b007b81b7b78642d97f2196ce4d77155_226_0.png)


    他们那，就是一间餐厅。


    然后做的什么动作那。


    每一个来就餐的人，都有机会写一个梦想竹简。


    这个竹简：那，就是你可以随便写。 写心里话，写感悟，写梦想，写爱人的情话，反正什么都可以写。


    然后写完了，店员进行当面用封条封上。然后拿到橱窗（专门放这些梦想竹简的）


    我就觉得这个东西真好。


    （1）有回忆 有故事。 有沉淀。 与客户互动，激发感性，还能让客户主动回流过来拆开看看看自己曾经的许下的梦想。


    有人就说了：这个只有餐厅可以用吗？


    事实不是这样的。


    服装店也可以用啊。


    减肥店也可以用。


    健身会所也可以用。


    以及其他店，我认为都可以灵活的去玩。


    这个东西就很有意思。


    但是记住一点：当下用的人不多。 可能会非常有效果。但是一旦如果大家都用了这招。


    基本上=失效了。


    因为当大家看到这种已经成为共识：就毫无意义了。 因为东西多了，没人珍惜。


    那时候，我们要换玩法。升级玩法才行。


    卖点交互（折扣抽奖，让客户参与评选，投票）


    ![](img/b007b81b7b78642d97f2196ce4d77155_227_0.png)


    简单讲：我们用一个折扣抽奖与客户互动。


    比如：有1折，二折，三折。 以及原价购买。


    我们把原价购买的概率设置为：50%。


    其他的折扣为1折，二折，或者7折。


    然后很多人，就可能就很喜欢这个互动。


    可能会买很多东西。


    然后再去抽这个奖品。 因为不管他怎么抽奖，全价购买的概率为50%。


    而1折，二折，三折的概率也占50%。


    如果是你，你会不会愿意尝试拼一把？


    其实：通过我们平均计算，最后打折在6-7折之间。


    表面上看，可能很多人觉得，哎呦。要是都是抽奖1折，你不赔钱了。


    但是事实计算：其实并不赔钱。反而销量直接大增。


    这就是与客户互动，玩心跳，玩赌博的玩法。


    不管怎么心跳，最后我们都是赢家。


    迭代交互(用户参与产品（经理）设计，售后，疑问. .)


    很多傻逼老板那，客户买了之后：基本上再也不会跟踪了。


    怕事儿。


    但是如果我们给一家做家电的企业就提供了一个建议：就是客户买了家电，空调，或者其他家电。


    我们就会在半个月或者一周内给他做一个回访电话：问客户用的怎么样啊。


    有没有出现什么质量问题。


    如果有质量问题我们给你解决，并且提醒他我们可能还会给你回访。


    那么客户那，就感觉这个商家很用心。售后服务做的真好。


    一般很多做生意的都是卖完都不理人家了。


    人家有二次需求，甚至三次需求，找你的概率会大吗？


    很显然，没有我们售后做的好 的话。买的概率更大。


    日化生意的商家一招黏住流量引爆生意


    大家想知道怎么做到的吗？


