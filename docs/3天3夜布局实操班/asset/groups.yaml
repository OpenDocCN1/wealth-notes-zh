    # 【卧龙营销内部资料】布局实操班


    说一下公司的问题，客户的问题等。


    7. 解决信息的“肠梗阻”现象： 将晨会作为信息交流的平台，及时传达公司的指示和精神，以及重大信息的反馈；


    8. 建立主管的权威： 通过员工整齐的队列，正确的站姿要求，以及队伍前主管的“位置”和训话来强化在员工心目中的“地位”，天天点评他，在员工的潜意识里就形成了你的“管理地位”。


    因此，开好晨会，可以有效提升一个团队的凝聚力、执行力和战斗力，为迅速实现组织的愿景奠定坚实的基础。


    ## 为什么开不好晨会？


    目前，只有不到50%的企业保持召开晨会的习惯，而这些企业的晨会，大多也只停留在一种单向的沟通，或者只是简单安排一下工作，有些形式非常随意，有的直接演变成了点名会。这些晨会流于形式的主要原因可以概括为以下几个方面：


    比如：很多理发店，就是早上简单开一个晨会。


    其实那是错误的模仿。


    还有宜家家居开的晨会，也是简单的安排一下今天的销售任务，以及鼓励一下大家的激情。然后点个名就走了。


    这种其实都不是晨会的初衷。


    +   1. 公司决策层对晨会没有提到战略的高度，既没有晨会管理制度，也没有对晨会形式、内容等做统一的要求，更没有衡量晨会质量的标准，因此出现了各自跟着感觉走的局面；

    +   2. 组织者认为晨会无所谓，没有意识到晨会的作用和对自己管理的重要性，只是在例行敷衍；

    +   3. 有些企业虽然数年来一直在召开，但从不对晨会进行检查、监控和总结，更没有配套的奖惩措施，久之便流于形式；


    所以很多晨会开的效果也不怎样。


    +   4. 有些主管尽管已经意识到了晨会的必要性，但又苦于没有一套切实可行的方法，只能随波逐流；

    +   5. 有些晨会只是一种单向会，主管一言堂，久之员工也就失去了兴趣；

    +   6. 有些企业虽然对晨会也做了要求，但核心却有没有抓住，譬如，连优劣点评都没有，点评意味着逼迫主管事先了解各部属的业绩情况等，否则无从评起；有些则成了扯皮会，主管冲冠一怒，晨会取消。


    ## 开好晨会的窍门


    +   1. 晨会的时间：可以安排在班前召开，一般掌握在30—50分钟为宜（与人数多少有关，如果10人以上，可以考虑分组召开）；

    +   2. 晨会的地点：一般选择在就近的工作场所或办公区域，但是要确保开会时周围环境不影响晨会的效果；


    https://v.youku.com/v_show/id_XMzQyMTMxNTcy.html?debug=flv


    这个是汇聚集团：2012早起的晨会系统落地的一点内容。


    具体可以去借鉴。


    +   3. 先整队，后晨会：所有员工必须按统一要求，做到站姿标准，着装统一，整齐划一，主持人在队列前方进行讲评；

    +   4. 主持人的选定：开始阶段，最好以主管本人为重，之后根据部门形势的管控情况，决定是否调整或轮流主持；

    +   5. 主持人站立位置：主管要在队列前方的位置，最好能随着不同的汇报对象，位置也随之变化，但是始终站在汇报者的正前方，两眼目视对方，无论点评还是在听取其汇报；

    +   6. 为了节省时间，防止扯皮和跑题，晨会还要遵循（最好使用统一的晨会表单）：正常内容不汇报，只谈结果，简明扼要，原因不解释、困难不解释；对成员之间可以自行协调解决的，不得提报晨会；晨会非讨论会议，不能反复纠结于某事，凡只牵扯别人、耗时较长的，一律会后解决等等。


    我给你们讲：千万别以为这是传销。


    对于我们管理人，打造销售团队，我们就应该这样做。


    ## 有效晨会的模式


    高效的晨会，需要目的明确、条理清晰、节奏紧凑、速战速决。具体可以考虑如下顺序：


    +   1. 首先个人汇报：各成员逐一汇报昨天重点工作完成情况（只说结果，一件事一句话概括，对没完成的当众承诺二次完成时间），当日重点工作内容（可以考虑控制在3件事以内）；

    +   2. 其次主管点评：个人汇报完后，主管要对其工作情况进行点评，同时落实之前安排给他

    的工作进度；


    我们只有搞疯了多少人，我们才能真正引爆多少人。


    只有这样，才是我们销售部要做的工作。


    +   3. 再次案例分享：内容可以是经验或教练的总结，也可以是学习心得（要保证团队每天有成员进行分享，可事先公布分享值日表）；

    +   4. 然后是主管对前一天工作的整体总结：简要总结昨天的 工作情况，并通报最优和最差员工，同时结合身边的具体实例宣导企业的价值观；

    +   5. 之后部署任务及提振信心：通报本部门当日或某阶段的重点工作及注意事项等，在表扬肯定的同时，鼓舞员工干劲；

    +   6. 最后是公司政令的宣导：包括重大信息的通报及制度概要的介绍或学习。


    这是我们培训系统中的——晨会系统；

    ——企业文化。的打造。


    然后我们要做的是：继续培训员工的综合能力，素质。


    比如：学习市场话术。


    学习市场开拓技巧。


    学习订单成交系统。


    签单培训。


    以及背诵产品价值塑造，公司价值塑造，必须了解我们产品的优势，卖点，好处等。


    只有这样我们给客户介绍的时候，我们才有筹码。


    在我们公司：我们除了有一个固定的话术模板，市场开发模板，以及签单等模板之外。


    那么还需要什么？


    就是让公司前三名，轮流给新员工做实战培训，也可以理解为师傅带徒弟的过程。凡是前三名带出来的优秀徒弟，师傅也有奖励。


    有些人前三名，不愿意带小弟小妹玩。只能通过给他一部分奖励，让他们形成利益共同


    体来实现。


    这样他们也会认真培训下一批小弟。实现利润的倍增。


    +   （1）有了企业文化和信心    （2）有了培训技巧

    （3）每天晚上会开一个总结会，以及每周有周总结大会，每月有月会，每个季度，有季度总结大会。


    让员工们，定目标，当众公众承诺，以及PK等。


    其中还有最重要的一项就是：（4）每当有老客户签单或者新客户签订订单，一定要及时通报，在公司里面分享出来自己出单的过程。


    这样的做法是什么？


    ## 【玩跳一跳游戏有感！】


    我不相信自己能日入过10万，当我身边有一个人日入10万，我了解到他是怎么做的之后，不久，我竟然也达到了日赚5万，真的是那么神奇。


    人从不相信自己没见到过，没发生过的东西，然而真正有这样的人存在了，你也觉得不是什么难题。


    所以找榜样，了解他的模板，思路是多么重要。


    人性从来不相信自己幻想的，永远只相信已经存在的（身边人，熟人），所以：多找一些比你牛逼很多的人，看他们都在干啥，是如何做的，亲自沟通，学习，体验，比读多少书都更加重要。


    这1就是读书不如阅人无数增长见识，自信最大，最有效的方式之一了。


    任何时候保持高度好奇心很重要。


    假设：一个乞丐收入一天才30元，然而有一天去上海他遇到一个乞丐竟然日赚2000元，他就很好奇，怎么做的，于是偷偷摸摸跟着他，发现很多秘密，然后他回家，把这些方式方法用到本地，竟然也日赚500了，同行是最好的老师，在不经意之间竟然翻翻了利润，然而在过去本地乞丐最高收入不过日赚300元，从来不相信什么日赚500，1000的段子。所以5年了，还是这么微薄的利润，然而意外就在看到上海乞丐后，为何突然1个月内，收入瞬间倍增那。


    人性从不相信身边人没有人做到的事情（当然：身边人做到了，他也一定相信，他也可以）


    什么叫坐井观天，这就是了。


    所以一定要无时不刻要升级自己的认知框架，获取更多顶尖的信息，永远不要安逸现在，对自己说不可能，不如先找一些更牛逼的人学习，贴身请教，看他怎么做，绝对让你少走不少弯路，实现捷径式发展。


    一句话：人性永远从不相信身边人没有人做到的事情（当然：身边人做到了，他也一定相信，他也可以）


    一有人出单，立刻鼓励，奖励，全体都起立，奖励他。


    然后再让这个销售，把成功故事讲一下。


    这样很多没有出单的员工，新员工，会比较有信心，感觉出单距离自己并不远。


    对于老员工那，咳呛，他一看，新手都出单了，他会怎样。


    会不会着急？ 怕新员工赶上自己了。


    同样：如果我们在线上的话。


    我们就在微信群里面做一个：收款截图+恭喜某某出单，又赚1500大洋


    这样一直都保持出单，是不是很多人的希望。


    好了，对我们就是要打造这样一个能量场。


    但是如果：你不及时保单，会有什么感觉？ 可能坐一会就没有激情和动力了。


    3天不出单，又TM阳痿了。


    但是我们保持每天都有单子报的话，很多人就有希望，也压力，也会从对方的分享中，总结一些自己的经验。


    我们培训系统。大概的框架基本如此。


    一定要记住一句话：


    我们做老板的人，一定要随时随地给员工希望。


    简单讲，就是看到身边的人一个一个都成功了。他也会相信自己也一定会成功。


    即便没有成功案例。


    我们也要包装出来，给员工希望和信心。


    比如：完美直销怎么做起来的？


    ![](img/b007b81b7b78642d97f2196ce4d77155_303_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_303_1.png)


    刚开始他们的团队，几乎面临崩溃，没有信心做市场了。因为做市场太难了。


    但是他们就请了一个策划人。给他设计了一招。


    简单讲，他们就包装，打造，故意推出一个又丑又黑，说话还不行的老太，然后让他达成自己的百万梦想。


    然后那，就让他在会场上分享自己成功的经验。


    结果10个人听了10个人都觉得，这老太说话都说不好，都能做成功市场，我们TM的也


    能。


    直接激发了市场的信心和希望。


    当然了，老太的人物就是到处去讲：自己怎么怎么通过完美走向成功的故事。


    只要是人，听了就很触动，感觉都能成功。


    就在这一年。他们的开发客户的数量翻了100倍。市场一下就做起来了。


    还是那句话：人性从不相信身边人没有人做到的事情（当然：身边人做到了，他也一定相信，他也可以）


    在这里面我讲一个故事：以前那，世界杯跑步最多100m冲刺最快的只有15.5s。


    很多人都觉得超越不了这个时间了。


    然而后来就有一个人，直接100m冲刺达到了12.3s。


    结果之前那些以为再也突破不了的人，竟然很快也TM超越了15.5s。


    达到13s。14s。


    所以：这就是人性使然。


    同样我再讲一个故事：假设我们去一个地方看演出活动。 正好他们旁边有一个拿微信就能抽奖品的活动。


    或者在超市购物满99元，就可以抽奖。


    然后那，你发现就有个广播在叫喊：恭喜，某某中了一台价值3980元的液晶电视。


    而且还重复了好几遍。


    那么你什么感觉？


    是不是觉得还真有这么好的事儿，然后可能就有一种冲动，就是自己也买99元的，去抽个奖，看能不能中大奖。


    还是那句话：人性从不相信身边人没有人做到的事情（当然：身边人做到了，他也一定相信，他也可以）


    即便是假的，对方脑袋里认知就是真实的。


    即便你放的那个消息是个套，就是一个虚假的奖品信息，我们肯定也会认为这好事儿，还真可能砸到我们头上。


    然后我们就会愿意去尝试一下。


    配碰运气呗。反正又没啥损失。


    我想说的是：其实这些故事。    跟我们教育培训员工，都是一个道理。


    我们一定要随时随地给员工希望。随时随地给客户希望。


    让他们看到别人已经成功的希望。


    只有这样，他们才有干劲，才会卯足了劲头去按照我们想要的方向去走。


    懂了就懂了……


    今天我们的【培训系统】基本分享完毕。


    明天我们继续分享。今天的内容先到这里。


