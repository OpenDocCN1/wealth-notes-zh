    ## 【战略有多重要？】


    为什么很多人，同样的劳动不同的报酬？


    往往事情的结果就是由最开始的选择决定的。


    同样2个朋友： 都是做眼镜批发的。


    ![](img/b007b81b7b78642d97f2196ce4d77155_368_0.png)


    我郑州的这个朋友，他开的眼镜批发：在郑州眼镜批发城里面租了一个摊位。


    现在几年过去了，他买了2套房子。


    可能很多人感觉还不错。


    眼镜还真是算暴利了。


    但是我另外一个朋友，他也做批发眼镜，他没有在郑州搞。


    去哪里？


    去了义乌小商品城。


    结果他就把眼镜业务卖到了全中国，比郑州的朋友做的更好。


    为什么？


    因为在义乌意味着可以接触到全国的客户，乃至国内外的客户都有。


    但是他在郑州的话，除非郑州周边的批发商更多一些。


    很明显，两者之间的城市势能，商圈势能就不一样。


    去义乌的朋友：他在义乌也是混了那么多年，他却又几千万的身价。


    2者，同样arod？同样 的 labor，不同的结果。


    这就是战略势能，城市本身所拥有的势能不一样。


    换句话讲：我公司开在郑州，那么最多算河南牛逼策划公司。


    但是如果我要成为国家级，世界级牛逼策划公司，那么我们就必须把公司搬到上海，北京，深圳这样的一线城市才行。


    只有这样，我们才能覆盖全国的市场。


    但是那：如果我的策划公司开在商丘，即便我再厉害，别人也会认为，你不是全国性的公司。


    所以：就没有人愿意给你策划单子。


    在做战略的时候：我认为我们一定要有一个战略价值投资路线。


    什么意思？


    ## 【每1-2年必须升级一次自己，一定要选有稳定增长的价值投资项目】和职业才行。


    - (1) 自己一定要稳定增长

    - (2) 行业项目一定要有稳定增长。

    - (3) 利润率一定要持续成长才行。


    如果一个人选择的行业不好，如果自身能力也不能提高，这就是瞎混，也就是吃饱了撑的=死撑。


    业务难开发，不一定是好生意，买卖成交容易，不一定是好项目；


    关键一切就在于有没有一个稳定增长的机会和可能。


    就好比：我老家街道上一个小卖部，1年赚5万元，想突破是难上加难，哪怕日子过得在轻松，满酒，我觉得都是傻逼行为，都是死撑罢了。


    而有的人开发一个单子，要挤破脑袋，用尽一切心思，但是那，这个客户可以长期带来利


    润，也不流失。


    这样一个项目就是有增长的项目

    那么就可以持续撑下去。


    如果说1-2年，你自己不能进步，升职，或者能力增加的职业，或者一个行业前景再稳定的项目，如果不能持续稳定增长，我们就不要考虑去做。


    当然了，有些人觉得稳定也挺好的，那我也没办法。

    道不同，不相为谋。


    要想获得巨大的成功，一定要学会做有价值投资的事儿。


    1年之内都要自我革命，革新，增长一次，或者一个季度，一个月，一周，甚至每天，每分每秒，我们都在进步。这才是永恒的法宝。


    我在一个阶段，绝不会什么都不变，这样事儿我宁愿不做。

    死了都要做有进步的事儿。


    比如：我开工作室那会，我就说下一年一定要注册公司，然后第二年我又逼自己必须要成立分公司，第三年我就要逼自己，继续扩大规模。


    只要不死，就能完成的事儿。一直在升级。


    这里面野心和信念很重要。


    一定要学会驾驭自己的野心。


    很多人为啥做不成？


    要么安于现状了，没劲头了，没野心了，要么刚开始有劲头，结果信念被现实抹杀了，一蹶不振，最后放弃了信念。


    终归还是无法完成自我升级。


    说起这个：我想起一家花店。


    ![](img/b007b81b7b78642d97f2196ce4d77155_371_0.png)


    普通的花店是不是：都是蹲守在店里面？坐等客户上门对不对？


    但是我去一家花店，其中这家店也不怎么起眼。


    但是人家却告诉我：他们有淘宝店，有网站，还有小程序，还把业务做到了国外那。


    我靠，你能相信吗？


    真是不敢相信，那么一个普通的花店，竟然做的那么好。


    我敢说，他肯定也是一点点升级过来的，也不是说一下次就搞了那么多。


    这就是一个升级，沉淀的过程。


    然而当下很多花店那，都是闭门造车。 还是满足于传统生意的玩法。


    认真想一下真是可悲。


    可怜之人必有可恨之处。


    一味问自己能做什么，叫固步自封。


    一味问自己想做什么，叫好高骛远。


    我们要先问自己想做什么，然后看能做什么，然后再让自己做些事以至于未来有一天做到什么。


    就是假设我们要减肥20斤。


    我们现在有多少斤，距离目标减肥从170降低到150斤。


    好了，那么我们减肥20斤，需要做什么？


    然后列出我们几十个必备的条件：


    少吃肉才行，多锻炼才行，经常消耗卡路里才行…


    具备这些，那么我们现在已经有了那些，还差那些条件


    然后拼命满足这些条件，直到减肥9斤，然后8斤，一步步，总有一天，我们就能达到自己的目标。


    这就是站在未来看现在，你就能清楚的知道现在该干啥，怎么做。


    这都是我们用【布局小模板】做的战略规划。


    而且只要按照我们的步骤达成条件，基本上结果都会呈现。


    如果你没有完成目标，那肯定条件都没达成。那也怨不得别人是不是。


    ## 【战略规划了，到底应该怎么执行？执行力到底多重要？】


    怎么执行？


    ## 【人生最大成本：莫过于犯错误的成本。】


    世界上效率最低的事情有两件：


    - 1. 用最高效率去做一件根本没有必要做的事。


    方向不对，努力白费，用80%的时 间做顶层设计，战略布局非常重 要。


    2、用最大的精力去做自己根本不擅长的事。


    没有金刚钻，非要烂这瓷器活，结果不单单事儿没做成，还浪费了大量的时间和精力，得不偿失。


    所以提高效率，避免犯错就有了相应的两点：


    一、用最高效率找对方向，然后做最重要，最核心的事。


    其中做战略，提前布局，这件事，花费多少时间都不为过。


    二、专业的事找专业的人来做。


    一件事能否成功，重在效率，效率的“率”是有用功占比，这点异常重要，值得深思。


    不要瞎忙活，结果还吃了钉子……懂了就懂了……


    一句话：


    一定要记住：就是在每时每刻都要做最有生产力的事情。


    有人就说：“老孔你说的这是鸡汤吧？”


    谁不想做最有生产力的事儿那。


    如果一个项目和目标，你感觉能力不足，准不够充分或者考虑还不够周全的时候


    最有生产力的事情就是继续准备，继续考虑。


    简单讲：就是继续做战略规划。


    而不是头脑简单，向前冲，执行起来。


    因为：战略做不对，努力可能大多都是浪费，白费功夫和精力。


    就好比：没有军师的谋略，大将军拼光了兄弟们的命，也不见得一定能赢的战争。


    但是如果你能力圈内，考虑已经充分了，准备做足了


    （不管最终证明是不是准备充足或考虑充分）。

