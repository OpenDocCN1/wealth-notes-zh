    预测分析顾客需求动向和偏好变化，及时调整产品结构和服务内容。如：随着现代化生活节奏和便捷化。许多生活用品采用一次性设计和单件包装。


    如：2016年雾霾加重，我们可不可以产品上设计扫二维码送防雾霾口罩？


    如：现在扫一扫很火，我们可不可以扫一扫送红包。


    ![](img/b007b81b7b78642d97f2196ce4d77155_43_0.png)


    这一点，红牛就做的好。


    ![](img/b007b81b7b78642d97f2196ce4d77155_43_1.png)


    # 4，抓住市场细分空隙


    不论产品价值大小，只要市场有一定价值，企业有相应能力，都可以考虑开发设计新产品包装，并传递一种独特细分价值。这是一种非常可行，有效的包装开发思路。


    ![](img/b007b81b7b78642d97f2196ce4d77155_44_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_44_1.png)


    比如：蒙牛开发了特仑苏，最近2年又新开发了。新养道这个子品牌。


    目的就是占领：零乳糖 低脂型牛奶市场份额。


    ![](img/b007b81b7b78642d97f2196ce4d77155_45_0.png)


    而：特仑苏这个子品牌。


    ![](img/b007b81b7b78642d97f2196ce4d77155_45_1.png)


    则走的是中高端牛奶市场。


    目的是占领中高端牛奶的消费市场。


    ![](img/b007b81b7b78642d97f2196ce4d77155_46_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_47_0.png)


    通过产品包装定位进行细分，反馈给用户，进而避免激烈竞争打造畅销，并获得市场认可和支持。


    # 5，给客户交代清楚


    完善产品包装，标志和说明，让消费者买的放心，用的明白。面对太多同质化产品，客户挑选过程，更加注重产品包装和标志说明开始了解产品。


    很多客户那，有时候，就有了一些专业知识，就会看说明，看功能和功效。


    所以：有时候我们这点也需要做好。


    特别关系到自身身体健康与食品安全，更是要设计识别和阅读方面的使用说明。


    ![](img/b007b81b7b78642d97f2196ce4d77155_48_0.png)


    # 预防癌症


    大蒜中的硫磺化合物是消除人体内亚硝酸盐和阻断内源性亚硝酸胺的有效成分，可抑制胃癌源亚硝酸盐还质菌合成亚硝酸胺，从而降低癌症的发生率。大蒜经成熟发酵后，其所含的大蒜素生成蒜酶被释放出来，发挥其抗癌的作用。


    # 减肥瘦身调理便秘


    黑蒜有助于调理肠胃，促进肠胃蠕动，润肠通便，从而起到改善便秘，抑制肥胖的功效。


    # 调节血糖提高免疫力


    黑蒜通过进入人体血液循环改善胰腺功能，活化胰岛细胞，促进B细胞分泌胰岛素，从而增强人体糖的代谢，改善血糖能量，调节人体血糖平衡。并通过参与微循环改善人体免疫力。


    # 降血脂改善动脉硬化


    蒜素可减少并排出积存在血管中的脂肪，有明显的降脂作用。同时黑蒜中含有的二烯丙基二硫化物和含氨基酸可以增强纤维白溶解的活性从而起到降血脂，抗动脉硬化的作用。


    # 调节睡眠缓解疲劳


    黑蒜有助于促进大脑神经细胞分泌褪黑激素的物质—五羟色胺，从而起到镇定安神、促进睡眠的作用。黑蒜对血液循环的促进，对减轻肌肉酸痛和僵硬，缓解人体疲劳有一定的功效。


    # 养颜美容抗衰老


    氧化是衰老的最大威胁，补充抗氧化物有助于自由基的活动。黑蒜中的抗氧化物质，能够增强营养系统，保护细胞免受自由基侵害，促进新陈代谢，延缓肌肤衰老，使肌肤时刻保持青春光采。


    6，如果有情感需求的共鸣，就更好了。


    案例：


    ![](img/b007b81b7b78642d97f2196ce4d77155_51_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_51_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_52_0.png)


    异常强调【产品包装的重要性】——因为：包装设计至少占到产品价值的60%以上。


    不管是什么产品，只要产品卖不出去，核心是产品不够美。


    客户去买东西有预期心理价格，抓住这个价格把包装做到最美，即有最大的销量。


    一个完整的产品至少有3个层面：


    +   (1) 底层基础：取材，原物，做工，工艺，技术，科技等。


    +   (2) 中层层面：功能，效果，概念，卖点，需求，娱乐等。


    +   (3) 高层需求：情怀，浪漫，品味，精神，文化，感知价值，惊喜，故事，意义感，里程碑等。


    底层是基础：就好比一瓶水，如果你定价很高，诉求功能，都很好。但是你口感不好喝。


    即便再浪漫，再有故事。可能最后都难以有大的销量。


    所以：我认为我们的基础工作一定要做好。


    好比：LV能卖高价。 最基本的是质量绝对过关，极致。 其次才是功能和品牌故事。


    所以人家可以一直卖，持续卖。  但是如果你讲故事再好，如果底层的无法做好，最后都会坍塌。


    就好比：我们盖房子，没有打好地基一个道理。高层万丈，但是地基没有做好，最后还是一个倒。


    # （3）定品牌颜色


