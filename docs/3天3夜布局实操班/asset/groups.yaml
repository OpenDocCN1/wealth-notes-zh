    # 【卧龙营销内部资料】布局实操班


    然而我就注意到一个小伙子：自己做了一个焊板，然后自己用这个，多加了这么一个铁板按压步骤。


    然后他，就成了：铁板烤鸭。


    结果人家就是铁板烤鸭第一人，一年收徒弟教授学徒，赚了几百万。


    同样还有一个人：他怎么把烤鸭分化的那。


    ![](img/b007b81b7b78642d97f2196ce4d77155_24_0.png)


    他们就通过改良，把鸭子给提前用刀子弄一些穿动，然后烤了之后，就特别有嚼劲。


    那么就形成了一个：琵琶鸭。


    第一人。


    结果也是招了很多人过来学习。


    同样：鸡蛋灌饼的分化。


    ![](img/b007b81b7b78642d97f2196ce4d77155_25_0.png)


    国内大多数鸡蛋灌饼都是这样的。


    但是一个小伙子就很聪明，直接分化成了：缸炉鸡蛋灌饼。


    结果也有不少人去跟他学习这个缸炉鸡蛋灌饼。


    因为你在其他地方学不到。


    所以他们这个分化算是小卖家中的一种玩法。


    如果我要分化，我还能分化很多：方正夹肉灌饼，烘烤鸡蛋灌饼。


    如何规避大竞争对手，让刚起步的你也能快速成为行业佼佼者？


    通过我们这20多年来的总结和实操，我们发现只有这样一招，是最好的方法。


    继续我们的原题：


    ![](img/b007b81b7b78642d97f2196ce4d77155_29_0.png)


    如果我们要开发一款【卧龙——智慧酒】第一个定位。


    我们就会分析国内所有的酒类。先从纵向进行细分：低——中——高端。


    那么既然是【智慧酒】肯定不能定低了，那么至少要走的路线，就是【中高端】市场。


    那么我们横向进行细分：


    ![](img/b007b81b7b78642d97f2196ce4d77155_30_0.png)


    水井坊——中国白酒第一坊。


    五粮液——中国最高档白酒之一。


    泸州老窖——浓香鼻祖开创者。


    汾酒——中国第一历史文化名酒。


    ![](img/b007b81b7b78642d97f2196ce4d77155_31_0.png)


    古井贡酒——年份原浆。


    ![](img/b007b81b7b78642d97f2196ce4d77155_32_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_32_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_33_0.png)


    五粮醇——淡雅清香酒。


    ![](img/b007b81b7b78642d97f2196ce4d77155_34_0.png)


    金六福——绵柔类型开创者。


    如果是我们定位就可以：智慧酒——智慧酒开创者。


    定位解决了下一步怎么搞？


    定品牌颜色，品牌印象，品牌故事，品牌logo，品牌名字，定卖点——设计包装，先做几个样品出来看看效果。


    ![](img/b007b81b7b78642d97f2196ce4d77155_35_0.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_35_1.png)


    ![](img/b007b81b7b78642d97f2196ce4d77155_36_0.png)


    （2）定品牌颜色。


    【产品包装色彩认知】色彩所代表形象在某种事物扎根我们内心。


    绿色：代表和平，稳定，和谐，健康等想象。


    如：绿色食品通常绿色


    结婚红色，葬礼一定是白色+黑色....


    每一种色彩都有固定的形象在大脑里面。不会轻易改变。他成了我们所有认知的基礎。


    所以，在包装广告，我们至少要选择互相协调的配色。不是为了限制，而是为了达到最低限度达到的目标。


    从这个角度选择合适的颜色。


    颜色对人的影响：


    +   红色：让人积极向上；促进肾上腺素分泌；感觉温暖；增进食欲；让人感觉时间过的很快

    桔色：增进食欲；使人充满活力；给人一种温柔和放松的感觉；

    黄色：让人精力集中；提高记忆力；心情变的愉快；

    绿色：消除疲劳；让人镇静，缓和紧张情绪；让人心情平静；

    蓝色：提高专注力；降血压；促使食欲减退。


    紫色：促进睡眠；提高想象力；

    粉色：让人变得温柔；消除紧张感；让人看起来年轻；

    白色：让人清晰的印象；让人感觉比实际重量轻；

    黑色：让人感觉压抑；让人心情沉重；让人感觉比实际重量重；

    灰色：有品位，让人心安；平凡严谨的印象；


    举个例子，有个快餐厅，开始时候，是红色装修，结果很多人吃完，还不走。导致换台率低，而赔钱。


    于是我建议，装修为白色，很快就得到改善，都是吃了就走，没有停留。


    红色让人不自觉攀谈起来，而白色，则更清晰还有事情要做。


    对于产品包装的要点：


    +   1, 投其所好


    根据目标客户群体的喜好筛选适合的产品构思和设计点子，无需兼顾所有用户。


    例如：年轻人喜欢新奇，抽象，多功能笔，只需要设计各种鲜艳颜色，造型独特，携带方便的笔，而无需过多考虑笔本身的耐用性。


