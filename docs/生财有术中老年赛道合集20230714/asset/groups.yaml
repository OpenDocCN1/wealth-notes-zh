    > 多次违规导致信用分降低会升级帐号处罚，如禁言等，你可以在【创作者中心】-【违规查询】中查看学分及违规记录。请轻触本通知查看视频号运营规范。


    ## 四、个人心得


    ### （1）降低预期


    人心很浮躁，赚钱这件事，从最开始就降低自己立马能赚到钱的预期，不要妄想着出道即巅峰，任何一个行业里的成功者，都是经过专业积累沉淀的。


    看到别人赚钱着急嘛？着急就对了，别光心理着急，行动起来，否则会越想越焦虑。


    ### （2）执行力拉满


    这点很重要！精华帖看的再多，那也是别人的，“先干了再说”，干完之后根据结果去做反馈，然后再去做修改。因为只有参与其中才能有更多的心得收获。


    ### （3）敢于露面直播


    我之前面对镜头就会非常不自在，为了承接爆款视频带来的流量，匆匆开了直播，在直播间用户进来很快就流失掉了，评论互动也很少人回复，慢慢的紧张的情绪也就稳定下来了。


    这也是我第一次突破自己，尝试出镜，做自己之前一直不敢做的事情，真的很爽！


