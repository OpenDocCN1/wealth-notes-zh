    \n## 6、未来老年人群的机会\n\n老年人，相对于年轻人，经历过了多半生，相对于底层的生理需求，更多的在意的是安全需求层面的东西，即使生理需求安全需求交织在一起，也要向安全需求方向去做，因为相对于生理需求，安全需求层面可以做的事情更多，也更有价值。\n\
    \n从另一个角度，选品还是要蓝海思维的，简单的复制衣食住行这些底层需求虽然简单，但是很多人都会想到，用不了几天，就是红海一片。\n\n### 5个需求层次\n\
