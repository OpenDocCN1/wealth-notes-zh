    \n## (精华帖)(31赞)分享思路:大妈效应\n\n作者: A小A\n日期: 2017-03-24\n\n分享一个思路:\n\n1. 不知道大家在城市里有没有这个印象,一大群老头老太太坐着免费的公交车,跨过整个城市,就是为了便宜买一个吃的,一件穿的。\n\
    2. 超市里面的部分促销东西不仅比网上的便宜,还比进价还便宜(被商场强行打折),相当于亏本卖\n\n现在每天晚上的广场舞把大妈有效得聚合在一起,而大妈对生活用品类的价格是很敏感的,传播率也很高,随着智能手机的普及,可以给大妈安装一个App。告诉大妈附近范围内打折的东西,大妈们就会蜂拥而至。\n\
