    \ 杨杨唱谱【直播号】 | 12.3万 | 店铺账号 | 关注 |\n\n清一色的唱谱号\n\n这些都是简谱教学的对标账号，接下来一个个点进主页看看，看下他们发哪些视频，视频的点赞同量如何，评论区中有哪些需求，在直播的进直播间看看，观察整个行业的基本情况。\n\
    \n第二步是通过蝉妈妈等第三方平台去分析同行的各项数据。\n\n蝉妈妈官网： https://www.chanmama.com/\n\n![](img/9291edba57e97d5c0b2faf030456313c_266_0.png)\n\
    \n注册登录后选择左上角的【抖音分析平台】\n\n![](img/9291edba57e97d5c0b2faf030456313c_266_1.png)\n\
    \n选择【我达人】\n\n![](img/9291edba57e97d5c0b2faf030456313c_267_0.png)\n\n在上方搜索框输入关键词【唱谱】，再点击右下方的场均销售额（详细数据需开通会员），可以看到唱谱赛道中，头部的变现成绩，选择其中一个账号作为对标账号，进行像素级的模仿，先抄后起。\n\
    \n## 三、项目实操\n\n### （1）确定直播形式\n\n通过对账号，确定了不需要真人出镜，只用简谱软件+PPT的直播形式，基本上—台电脑就可以完成，不需要很复杂的设备，如下图：\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_268_0.png)\n\n### （2）准备直播工具\n\n- 电脑一台\n\
    - 麦克风、耳机（耳机用来监听乐曲的声音）\n- obs软件(直播软件，官网地址：http://www.obsproject.com.cn/)\n- 教学PPT（讲解基础知识用）\n\
    - 简谱软件\n\n如何找到对标账号一样的软件？最快的方式是以学员的身份直接在直播间询问主播，有些主播会告诉你软件的名字。\n\n利用好各种搜索引擎。如果问了多个主播都没有回复，可以试试在百度、淘宝、微信、知乎等平台进行搜索，并进行逐一对比。\n\
    \n通过大量的搜索及对比，终于找到了这个软件：JP-WORD（官网地址：http://www.happyeo.com/）\n\n这是一款专业的简谱打谱软件，可以实现播放乐谱，同时还有唱谱时对应进度条，完整的功能需要购买，价格如下图。\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_269_0.png)\n\n（如果有购买的 needed，建议选择498的加密狗版，可以在多台电脑上用）\n\
    \n### （3）确定直播流程\n\n直播流程确定为：自我介绍 + 基础知识讲解 + 节奏型讲解 + 节奏型练习 + 卖课，如下图：\n\n![](img/9291edba57e97d5c0b2faf030456313c_270_0.png)\n\
    \n【基础知识讲解】需制作 PPT。\n\n![](img/9291edba57e97d5c0b2faf030456313c_270_1.png)\n\n\
    【节奏型练习曲】可以找市面上各种视唱练耳书的谱例，也可以自己创作，将谱例输入到 JP-WORD 中，直播时随时调用。\n\n- 四分音符2\n- 二分音符2\n\
    - 八分音符2\n- 四十六2\n- 八十六十六八2\n- 大附点2\n- 小附点2\n- 大切分2\n- 小切分2\n- 三连音\n\n直播流程主要是从零基础的角度出发，一步一步讲解简谱中的基本知识，加上大量的唱谱练习，直播模式基本上以带唱为主，就像运动博主带操一样，需要自己亲自做示范，目的就是让用户真正听懂并掌握相关知识。\n\
    \n### （4）开播引流\n\n所有工作准备好之后，就开始直播啦，下方为详细步骤。\n\n第一步：下载安装 OBS 软件，点击右下角【设置】，选择【视频】，设置【分辨率】，竖版设置【1080*1920】，横版设置【1920*1080】\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_272_0.png)\n\n![](img/9291edba57e97d5c0b2faf030456313c_273_0.png)\n\
    \n第二步：在【来源】中增加各种窗口，方便直播时随时切换\n\n![](img/9291edba57e97d5c0b2faf030456313c_274_0.png)\n\
    \n第三步：点击【启动虚拟摄像机】\n\n![](img/9291edba57e97d5c0b2faf030456313c_275_0.png)\n\n![](img/9291edba57e97d5c0b2faf030456313c_275_1.png)\n\
    \n第四步：电脑登录微信，点击左下角的三条杠，点击【视频号直播工具】\n\n![](img/9291edba57e97d5c0b2faf030456313c_277_0.png)\n\
    \n第五步：点击【添加画面源】，然后点击【摄像头】，选择【obsVitual Camera】。这时，obs 上的图像就以虚拟摄像头的方式呈现在视频号直播工具上了，\n\
    \n接下来，就可以开始直播了，直播过程中，只需要在 obs 上操作即可，注意视频号直播工具上的麦克风要打开，不然没有声音。\n\n![](img/9291edba57e97d5c0b2faf030456313c_278_0.png)\n\
    \n- 摄像头 - ezSoft iVCam\n- 分离 - ezSoft iVCam\n- 画面切换 - OBS Virtual Camera\n- Webcast\
    \ iDo Virtual\n- Webcast iDo Virtual\n- X直接修改摄像机\n- 取消 - 恢复\n\n![](img/9291edba57e97d5c0b2faf030456313c_279_0.png)\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_279_1.png)\n\n![](img/9291edba57e97d5c0b2faf030456313c_279_2.png)\n\
    \n直播开始后，我将原来注册的企业微信绑定在视频号上，直播过程中还增加了引导加企业微信的环节，为将来在私域上变现做准备。\n\n### （5）同步开发课程\n\
    \n接着马上就着手开发课程，课程也是通过 OBS 来录制，再上传到【小鹅通】，用户买了课程后，直接通过邀请码发给用户。\n\n课程的主要内容是录制好的简谱唱谱的视频，因为如果要真正掌握唱谱这个技能，是需要大量的练习，所谓熟能生巧，\n\
    \n初学者即使在直播间学会了如何看简谱，但是没有进行大量练习，依然掌握不了唱谱技能，这也是这个赛道的特点，也是在直播间里敢完全教课程里面内容的原因。\n\n\
    ## 四、做音乐技能直播的几个阶段\n\n### 第一阶段：左手直播右手产品，持续复盘提升数据\n\n#### （1）左手直播：执行力拉满，复盘优化\n\n\
