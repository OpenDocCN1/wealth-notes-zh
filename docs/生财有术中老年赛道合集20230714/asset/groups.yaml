    ## -03-


    ## 老年内容现状


    以上内容我写这么多，这些细，就是为了扭转大家心目中老年人的印象，互联网在变，老年人也在变，在这一切变化中，以往的不可能，就变成了可能，以往啃不到的骨头，今天就突然变的肥美多肉。回到开篇我留下的几个问题，为什么老年人群体完美的满足上面3个条件？


    ### 1、高流量


    抖音从业者，基本都是90前后的人员，输出的内容，关注的点，大部分都集中在自己同龄人身上，所以同龄人的内容，基本都是红海一片，要想在里面杀出来，难上加难，也许有人也尝试过老年人的内容，但很多时候，也只是表面了解了一下，完后觉得老年人应该喜欢这些，就像你妈妈觉得你应该穿秋裤，虽然本意是好的，但是你心里很抗拒，做内容也一样，很多时候，你觉的老年人应该看这些，但是他们并不领情。


    这就造成了一个问题，抖音上几亿老年人真正喜欢的内容，是稀奇的，只要你做出真正的好内容，流量是相当的大，而且这样的内容，还是精准吸引老年人，年轻人都不喜欢，从内容开始直接就做了筛选，为后期的转化提供了帮助。


    ### 2、高客单&高利润


    高客单和高利润，除了前面分析老年人消费习惯的时候，提到的几个点，还有一个很重要的点，那就是要抓住老年人的痛点，怕死，你卖的产品，只要是和健康沾边的，不管是什么东西，他们都愿意付费，你线上加了10倍8倍，你感觉已经加价挺狠了，但是你和线下的比，还是差的很远，我听说线下一个杯子，成本50，能卖到5000，虽然听着有点过份，但这就是抓住痛点，产生的结果。


    ## -04-


    ## 老年市场的未来


    经过这半年多抖音老年市场的摸索，我感觉老年市场的潜力太大了，大家也常听到“银发经济”这个概念，但是里面都是一些很大的概念，养老，医疗，大健康等等，和我们普通人的关系不是很大，但是老年人网购，老年人内容这些方向，我们普通人可以快速切入老年人的日常生活消费，可以挖掘出来很多新的需求。


    这些老年人的需求，可以尝试从以下几个渠道挖掘：


    ### 1、传统电商渠道


    首先可以去传统电商渠道找一些老年人的品类，但是因为传统电商和短视频电商的人群，消费场景等都不同，所以不能直接照搬，要分析原来产品，按不同分类来选择：


    - 原来电商渠道购买人群非老年人，比如一些老年人产品，是儿女去帮他们买，但是这些品不一定是老年人真正需要的，而是儿女认为他们的父母需要，如果真正的老年人群看到，反而不一定会去买，这个可以通过产品的介绍页面，评论区等等进行一个侧面的了解，还可以在抖音小批量去测品，确定最终合适的产品。


    - 一些图文电商不能很好展示的品类，或者功能型产品，别人都不知道你的作用，自然也没法去搜索，没法产生销售，但是短视频直接就是来展示产品，功能介绍前置，这就给这类被埋没的“好物”有个自然爆发的空间。


    比如下面这款床边扶手，就是很好的例子，如果让人去直接搜索，可能都不知道怎么搜索，但是抖音视频展示这个产品，看到的有需求的，就直接购买了。这类型的产品，挖一下，还是有很多很多多的，在绝对刚需面前，价格根本不是问题，卖300、卖500，照样有人买。


