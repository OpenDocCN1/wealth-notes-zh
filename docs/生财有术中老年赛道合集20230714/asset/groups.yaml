    \n38/497\n\n![](img/9291edba57e97d5c0b2faf030456313c_38_0.png)\n\n# 1、老年电商市场现状\n\
    \n我开始做老年人市场，也是无奈之举，19年的的时候就尝试过抖音，虽然有播放量，但是变现途径完全没有，也尝试过带货，最惨的时候，40w播放出一单19元的品，后面从心里就抵触抖音，不想做抖音了。\n\
    \n21年上半年8个月，不同平台，尝试了很多不同的方向，一事无成，最后实在没有能去做的事情了，只剩下做抖音了，就硬着头皮再来做抖音，死马当活马医，不成也不损失什么。\n\
    \n既然要做，就要做分析，要捡软柿子捏，硬碰硬不是我擅长的，31-40人群，盯得人太多了，我只能研究头尾，儿童或者老年人人群，先着手的做儿童类内容，但是数据很一般，后来一想，儿童类的内容，受众也是他的父母，人群还是31-40重合，还是红海，那就只有做老年人了。\n\
