    # ## （1）结合自身优势


    首先还是要结合自己的优势，自己拥有什么样的音乐技能，或者自己对哪些技能感兴趣，也可以现学现卖。


    由于自己本身是音乐学院毕业，也有一线教学的经验，对于音乐基础理论课，如乐理、视唱练耳，基本上能信手拈来，只需将线下教学的模式搬到直播上就可了。'
