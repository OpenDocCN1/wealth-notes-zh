    \ |\n| 9 | 新闻民生 | 有用、有共鸣 | 涨知识需求 |\n| 10 | 动画 | 有趣 | 娱乐需求 |\n\n## （2）找对标视频\n\n\
    ### ① 抖音直接搜索关键词\n\n抖音搜索故事、故事会、民间、情感、正能量、家庭情感故事等关键词，筛选条件：最多点赞——一周内，搜索靠前的视频其点赞、评论、转发数据都不错，点击头像进入账号主页，观察几个要素\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_182_0.png)\n\n1. 账号主页各视频的点赞数据\n2. 找到点赞量高且近\
