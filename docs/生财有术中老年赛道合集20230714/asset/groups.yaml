    \n2023年3月1日 星期三\n\n国内要闻 8\n\n# 我国取得疫情防控重大决定性胜利\n\n### ——贯彻落实中共中央政治局常委会会议精神\n\n\
    **解读**\n\n3月1日上午，中共中央政治局常委会会议分析了当前经济形势，强调要更好统筹疫情防控和经济社会发展，因时因势优化疫情防控措施，进一步做好医疗资源储备、医疗保障等，确保平稳转段、平稳过渡，最大限度保护人民生命安全和身体健康，促进经济平稳健康运行。\n\
    \n- **解读要点：**\n\n  - 我国取得疫情防控重大决定性胜利\n  - 坚持中西医结合、中西药并用\n  - 坚持“乙类乙管”的防控措施\n \
    \ - 对新冠病毒感染实施“乙类乙管”\n\n- **主要任务**\n\n  - 实施“乙类乙管”的防控措施\n  - 保持新冠病毒定期检测\n  - 加强重点场所和重点人群检测\n\
    \  - 做好重点人群健康防护\n  - 强化医疗资源储备\n  - 加强药品、抗原试剂供应\n  - 强化医疗救治\n  - 加强重点机构管理\n\n-\
    \ **工作要点**\n\n  - 平稳转段\n  - 医疗资源储备\n  - 医疗救治\n  - 药品供应\n  - 核酸检测\n  - 疫苗接种\n \
    \ - 基层防控\n  - 应急处置\n\n# “更幸福的日子还在后面哟！”\n\n### ——两会上“温暖记忆”\n\n![](img/9291edba57e97d5c0b2faf030456313c_336_1.png)\n\
    \n“更幸福的日子还在后面哟！”这是全国人大代表、青海省海东市互助土族自治县东和乡东和村党支部书记、村委会主任李延春在谈及家乡变化时，对乡亲们说的话。\n\n\
    今年全国两会上，来自各地的代表委员们带着群众的期盼，带来了“春天的故事”。\n\n“更幸福的日子还在后面哟！”李延春代表说。\n\n# 国办印发《中医药振兴发展重大工程实施方案》\n\
    \n新华社北京3月1日电（记者 彭韵瑶）为深入贯彻党中央、国务院关于促进中医药继承创新的决策部署，促进中医药传承创新发展，国办近日印发《中医药振兴发展重大工程实施方案》（以下简称《实施方案》），部署开展中医药服务、中医药健康促进、中医药人才培养、中医药科研创新、中医药文化发展等5个工程。\n\
    \n# 中共中央政治局召开民主生活会\n\n**解读**\n\n2月24日下午，中共中央政治局召开会议，决定2023年3月召开中共二十大届中央委员会二次全体会议。\n\
    \n- **主要任务**\n\n  - 建设国家临床医学研究中心\n  - 建设国家医学中心\n  - 建设国家中医临床研究基地\n  - 建设国家中医医学中心\n\
    \n- **工作目标**\n\n  - 2025年建成30家中医临床服务能力显著提升的中医特色优势明显的国家中医医学中心\n  - 2025年建成30家国家中医临床研究基地\n\
    \  - 2030年建成国家中医药服务能力和水平显著提升的现代化中医药服务体系\n\n# 国内要闻\n\n声明：以上内容除注明来源稿件外，均为\n\n# 国办印发《中医药振兴发展重大工程实施方案》\n\
    \n青海日报\n2023-03-01 04:58 | 青海日报官方帐号\n\n新华社北京2月28日电 国务院办公厅日前印发《中医药振兴发展重大工程实施方案》（以下简称《方案》），进一步加大“十四五”期间对中医药发展的支持力度，着力推动中医药振兴发展。\n\
    \n《方案》指出，要以习近平新时代中国特色社会主义思想为指导，深入贯彻党的二十大精神，统筹推进“五位一体”总体布局，协调推进“四个全面”战略布局，认真落实党中央、国务院决策部署，坚持稳中求进工作总基调，立足新发展阶段，完整、准确、全面贯彻新发展理念，构建新发展格局，坚持以人民健康为中心，加大投入与体制机制创新并举，统筹力量集中解决重点领域、重要环节的突出问题，破除制约高质量发展的体制机制障碍，着力改善中医药发展条件，发挥中医药特色优势，提升中医药防病治病能力与科研水平，推进中医药振兴发展。\n\
    \n《方案》明确推进中医药振兴发展的基本原则，即增强能力，服务群众；遵循规律，发挥优势；提高质量，均衡发展；创新机制，激发活力。《方案》统筹部署了8项重点工程，包括中医药健康服务高质量发展工程、中西医协同推进工程、中医药传承创新和现代化工程、中医药特色人才培养工程（岐黄工程）、中药质量提升及产业促进工程、中医药文化弘扬工程、中医药开放发展工程、国家中医药综合改革试点工程，安排了26个建设项目。\n\
    \n通过《方案》实施，到2025年，优质高效中医药服务体系加快建设，中医药防病治病水平明显提升，中西医结合服务能力显著增强，中医药科技创新能力显著提高，高素质中医药人才队伍逐步壮大，中药质量不断提升，中医药文化大力弘扬，中医药国际影响力进一步提升，符合中医药特点的体制机制和政策体系不断完善，中医药振兴发展取得明显进展，中医药成为全面推进健康中国建设的重要支撑。\n\
    \n《方案》指出，要强化项目实施。国务院中医药工作部际联席会议有关成员单位要将重大工程实施纳入本单位重点工作；做好资金保障，建立持续稳定的中医药发展多元投入机制；加强监测评估，开展重大工程实施动态监测、中期评估和总结评估；注重宣传解读，营造全社会关心和支持中医药发展的良好氛围。\n\
