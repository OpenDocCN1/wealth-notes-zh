    ## 【中老年知识付费】7篇\n\n### (精华帖)(185赞)高利润的中老年知识付费赛道，普通人入局都能做什么？\n\n作者：渔火\n\n日期：2023-04-17\n\
    \n近两年，中老年市场垂直方向的知识付费迎来了很大机会。\n\n比如之前圈友分享过的中老年唱谱课，通过在直播间用带唱简谱的方式完成变现，如果你不会音乐专业技能也没关系，还可以做其他类目比如书法、国画等。\n\
    \n我自 2019 年开始，基本上都是针对中老年做知识付费的项目，两年期间在不花费很大的精力下，数据和营收都增长了很多，还拓展了不少中老年类目的知识付费和电商，也因此对中老年知识付费赛道有不少的感悟。\n\
    \n接下来我按这四个板块和大家聊一聊，普通人做银发赛道的高客单知识付费，有哪些新的流量渠道和发展机会。\n\n- 一、为什么做中老年赛道？\n- 二、中老年人群的消费习惯？\n\
    - 三、中老年市场近两年的变化？\n- 四、2023，中老年赛道对于普通人的机会有多大？\n\n大家好，我是渔火，一名在路上的创业者。\n\n很久没分享了，先说下近况，2021年我作为联合创始人的项目，获得了真格基金领投的千万投资，自己作为创始人的中老年项目是2019年开始做的。\n\
    \n最近有很多生财的铁子问我关于中老年赛道的问题，由于我和这帮银发大爷大娘的爱恨情仇羁绊了四五年，曾让83岁老大爷为我付费，还算有些心得，而且也真的觉得这是一群很可爱的人，用心提供价值和服务就会有回报的一群人！\n\
    \n老师、学友们好！这是我们阳了之后，后期咳咳孩子们给买的药。还加了说明，希望对大家有帮助。\n\n我个人感觉还是吃点中药更好，固本培元。中药就治本，西药是治标。仅个人观点，不喜勿喷。\n\
    \n### 中药有什么推荐\n\n分享我个人的经历：身边好多七八十岁，八九十岁的老人都因为新冠而走了，还有能够住进医院的，现在还在ICU里没恢复，还有肺炎血块，走了，吃的中药好了，前后只花了一三百块钱，只有她一个人好了。\n\
    \n我们用的是京都念慈庵川贝枇杷膏，二陈丸，加上自己炖的冰糖雪梨。\n\n今天我想望了一位朋友，也是面瘫，是新冠引发的，已经六十岁了。我原以为年龄大了容易触发这毛病，没想到年轻也犯这病。“新冠”真是面善心恶！看似轻症，实则害人不浅，甚至夺人性命！重视！保重！\n\
    \n### 就是新冠后，抵抗力会低一段时间\n\n大家都注意尽量不要劳累，有时间就多休息，彻底把身体巩固好。\n\n我78了，没打疫苗，独居在家，今天在村卫生所打了六天针就基本好了，每次五十元。我想表达的是没有基础病的中老年人，乡村医生的办法可以试试。我周围好几个邻居都是到小诊所吊水治好\n\
    \n> （口罩期间班级群里相互关心）\n\n所以我今天主要分享的是 2023年中老年赛道的一些机会，以及简述一下我见到的这两年中老年赛道的发展和变化（今天主要聊银发赛道的知识付费，其他类目改天分享）\n\
    \n### Part01\n\n先说一下 2019 年我为什么搞银发赛道，当时找细分赛道的时候，先聊我当时的底层逻辑吧，我觉得这是搞钱最关键的，拿知识付费来说，我当时先粗略的看了下整体的发展路径。\n\
    \n成人领域从早期的知乎时代-逻辑思维付费会员-樊登听书-付费问答-订阅课程-各种课堂专区分区圈子等，在对应到同期教培行业的发展，线下、线上课、一对一、大班课、小班课、社群、AI课、训练营、行动营等等\n\
    \n大概率感受到整个行业的发展路径是随着用户习惯和认识逐渐觉醒来发展的，对吧。\n\n当时 K12 大厂打架有多狠大家都知道，我一个普通人，得选个好做的赛道啊，对标了下银发赛道，你就知道银发赛道的知识付费有多初级了，这不就是原始阶段嘛。\n\
    \n能预判的是，随着时间的发展，形态和内容肯定会越发的丰富，妥妥的机会呀，毕竟人年龄大了后更有钱和时间来为自己的兴趣买单！\n\n光是兴趣生活类，琴棋书画、诗词歌赋、针灸养生、摄影朗诵、茶文化、手机技巧、花艺园艺等等调研下来发现都有一些小团队在闷声赚大钱，然后果断开始入局的，一直到现在。\n\
    \n对了，再分享个数据，国家统计局公布 2022 年末 60 岁及以上人口接近 3 亿人，占全国人口的 19.8%，那么如果是 45 岁以上的人群有多少，可想而知！\n\
    \n### Part02\n\n今年，我能明显感觉到，大家对于银发赛道的关注度和进场的人数明显多了很多，发现很多铁子确实不太了解这波人，所以我先来和大家聊聊，这个人群的行为习惯。\n\
    \n我这几个曾蹲了下各平台银发赛道评论区的热词，我发现经常会出现的，“老年人没有网购习惯”“银发人群手机都玩不明白”“我开过养老院赔了”等等，看完我深度意识到很多人是完全不理解这波人群的行为和消费习惯。\n\
    \n按理说都市银发是抖音八大人群之一，我之前以为很多人会很了解，小镇银发确实不好做，但是都市银发可是妥妥的有钱有闲的人呀。\n\n我自己的项目，我对有效用户的定义是一二三线城市的40-75岁人群，都是我的获客范围之内，而且效果也确实不错。\n\
    \n觉得中老年的人玩不明白手机？移动互联网都发展多少年了，我们山沟沟现在都有wifi了，我给你们看看我的母亲，1968年生人，我帮她做了个视频号，一个月都已经一万六的粉丝了。\n\
    \n3月29日 17:20\n\n今天多发几个，拍视频\n\n嗯\n\n一会给你发\n\n赶趟，先直播会\n\n3月29日 19:40\n\n咋还不发呢，好拍啊\n\
    \n（我妈每天催我给地脚本）\n\n（我妈做了一个月的视频号）\n\n每天直播加橱窗能卖个八百一千的货，我妈用的手机是红米手机，现在也是红米，前两年手机都玩不溜的人，大家不要小看中老年的学习能力，换句话说，不要小瞧五环外人群\n\
    \n你以为中老年买东西都买便宜的？我给大家分享个我的数据，我的客单价是一门课 500-2000 不等，我的用户平均复购 3 门课以上，这是课程类的，随之的消耗品，书画类用户，每年要消费\
    \ 2000 左右在笔墨纸砚和印章上。\n\n如果是艾灸方向涉及健康的，客单价更高，很多中老年退休后，有的跟着孩子在国外生活，有的在大城市照顾孙子，有的回到了老家，但是这并不妨碍他们追求自己的兴趣和生活\n\
    \n好的，我算一下\n\n小楷笔3套，118*3=354\n有友6支，38*6=228\n铁线篆2套，68*2=136\n仿古宣纸半生熟1刀，168\n四次对开练习纸，生，熟和半生熟\n\
    各2刀，38*6=228\n\n6个章总价，399x5+199，减去\n199定金，是1995，有个姓名章是\n399的，因为那个不大，给您按\n199走的\n\
