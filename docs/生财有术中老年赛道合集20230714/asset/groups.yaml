    \n## 我为什么要选择“中老年书单号”这个项目？\n\n22年的10月份，我刷到了一场抖音直播，大概内容是：“四个舌头，然后产品是养生茶”，这个直播间一个小时，商品随便出了几千单，评论区清一色的询问主播，迫不及待想买商品的评论，这一下勾起了我的兴趣，我大概思考了一下，养生茶这种品类（单价并不低，最便宜的茶包也是售价58.8元），但是利用了人们害怕得病的一个心理，牢牢的勾住了用户的痛点，所以当时就萌生了想做茶包类的想法，但是自己对于带货完全一窍不通，于是我在知乎开始搜索，在我看来中老年人对于互联网的需求和认知其实并不清晰，只要我们的内容能够让他们认可，他们其实是很愿意付费的，而且中老年人大多都有退休金，在付费这块其实并不比年轻人差，于是我开始了我的中老年书单号项目。\n\
