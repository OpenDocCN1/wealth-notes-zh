    3. 收费点是对促销价格门店进行收费，因为大妈们肯定不会只买促销品，会带走其他商品。收费比例和价格可以参考云蚂蚁\n\n评论区：\n\n- 西风客：美团抄你咋办？\n\
    - A小A：云蚂蚁不知道是否是了解呢？一开始云蚂蚁的方式我不认同，因为这不是跟美团，饿了么一样吗？后来发现云蚂蚁这种，他是一个一个数量级公里数只允许开一家；面对的对象不同，这里是针对大妈，简单粗暴，美团等大妈们可不一定会用啊\n\
    - 七对：流量的利用效率会很低，推一个撞机会很累，而实际平台购买的品类又很少.....\n- A小A：朝阳群众和大妈群体的流量不低，城市的价格购买力也惊人。看看每年的年货会...至于购买品类，请发挥自己的想象空间。都是为了几毛钱，都爱囤货，而且传播率高的一个群体。\n\
