    # ## c. 带货


    等你千粉开通橱窗后，面临的第一件事就是带什么货，什么货品好卖呢？我最早卖的书，书的优点前面也提过了，这里就不多说了，那么什么样的内容才是好的带货内容呢？


    比如以【土方单】这本书举例，这本书里面收录了民间的很多土方子，大部分是治一些小毛病的，比如咳嗽、牙疼，皮肤小问题等等，这些小毛病很多时候去大医院不值得，或者去了也不见效，这时候大家就寄希望于这些民间的土方方上面。


    这种情况下，就可以用一些提到土方子治病的故事、传说等等的片段，来强化民间土方可以治病，简单还办事这样的一个氛围，在这种氛围下，你视频中不去强调买书，他也会直接下单了，毕竟随便去去医院都不是100块钱能搞定的事情，买本几百个方子的书才几十元，还是很划算的。'
