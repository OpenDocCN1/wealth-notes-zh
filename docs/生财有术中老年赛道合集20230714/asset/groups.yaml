    ### 2. 账号运营


    账号注册完，摆在眼前的第一件事，就是做内容。要做好内容，要注意下面几点：


    #### a. 丢掉错误方法


    市面上流传着很多让人哭笑不得的玄学说法，做抖音前，一定要把这些东西从你脑子里请出去，比如下面几点，流传盛广，毒害最深。


    - 1）抖音没有养号一说。内容创造者和抖音用户，是一个账号上面的两个角色。拿用户角色去刷抖音，去给内容作者角色养号，逻辑都不通。就好比一个人在家里担当两个角色，既是儿子也是父亲，他爹贫血，他买了药给儿子补血，这不扯么？


    - 2）要想带货，想要1000粉，只能好好去做内容，一点点吸引垂直粉丝来。别想着我买1000粉，开了橱窗立马带货，让1000人关注你你都做不到，你怎么就有自信让人在你橱窗下单呢？做内容，吸1000粉，是你熟悉这群用户，打磨内容必须要经历的过程。


    - 3）一机一号，流量起号，这也是无稽之谈。一提到做多号，就想到号群，就想打一些不太正规，平台不喜欢的操作。这些人在平台眼里，是要斩草除根的，所以会封他设备，封他IP，所以才有一机一号，用流量的传说。


    但是，你现在是在带货，抖音是抽10%个点技术服务费的，说白了，你和抖音是合作关系，你做号越多，抖音赚的越多，他没事限制你干嘛。如果他不让你做多号，为啥还加一个多账号切换？吃饱了撑的没事干么？我们线下几十台手机上百个号都用同一wifi，也没见出问什么问题。


    #### b. 内容


    你开始做一个新的类目，最好的开始的方法就是模仿，账号细节模仿，内容完全也可以去模仿，不要一上来，就要创新，就用你的固有思维认为别人的内容不好，来推翻重构。


    比如下面的视频，都是几十万赞，看着平无奇，那这类内容好在哪里呢？


    - 1）核心是内容。这位赵霖教授军人出身，说话掷地有声，说的也都是关系普通人的日常生活的内容，尤其是老年人。这样的内容，如果从年轻人的角度来看，自己一点都不喜欢，完全没有意义。你去找你喜欢的内容给老年人看，那么老年人会喜欢么？


    - 2）画面观感问题。如果从视频美观的角度来看，这些画面没一个合格的，字体排版粗糙，文字杂乱无章，颜色对比冲击，完全没有美感。那为什么这样粗糙的东西不会影响播放量，反而会起到帮助的作用呢？


    标题的作用，就是在画面出现的几秒内，抓住用户。文字包含的信息是远超视频的，视频可能十几秒才把一件事情说完，但是十几个文字就能提炼出来核心，用一秒抓住用户。


    既然标题是要起到抓住用户眼球的作用，那文字就需要抢眼，就要大，颜色要亮，要醒目，要突兀，才能达到他的目的，这时候，几乎不需要考虑美观的问题。


