    设有生活起居、文化娱乐、康复训练、医疗保健等多项服务设施。主要面对的的需要护理照护的，缺乏自理能力的长者，为他们提供居住、医疗、保健、康复和护理的配套服务；主要类型有养老院（民政牌照，养护为主），护理院（医疗机构，医疗护理为主），养老院（自理、介助、介护长者都有）等。


    # 3）CCRC（可持续照顾型社区）：


    是一种复合式的老年社区，通过为老年人提供自理、介护、介助一体化的居住设施和服务，使老年人在健康状况和自理能力变化时，依然可以在熟悉的环境中继续居住，并获得与身体状况相对应的照料服务。


    CCRC 选址通常在郊区，离城市较远，由于社区规模较大，在选址上关注生态环境和自然气候，大量运用园林景观和水系营造出人与自然和谐的居住环境，使老人在城市中享受到田园生活，达到怡情养性、延年益寿的目的，十分适合老年人居住和生活。


    随着观念的改变，现在送长辈去养老院已经不是子女不孝的代表了，有些高级养老院的入住反而成了一种儿女成功的身份象征。家里没人照料，保姆照护不专业，老人独自在家太寂寞，都是越来越多人选择去养老院的原因。


    随着年龄的增长，老人对物质的追求逐渐降低，更加注重内心渴望，但居家养老，老人在家里时儿女上班，孙子孙女上学，大多数时间老人都是孤单一人。'
  - '[PAGE 133]


    孤独比每天吸一包烟对身体的损伤都要大，对于老人来说，精神孤寂是影响健康的首要原因。


    如果在养老院，就会找到一群和自己年龄相仿、阅历相差无几，也不会有代沟的朋友。那些共同经历的年代记忆能让老人找到归属感，不再孤单，吐露心声，成为知心朋友。


    现在的养老院为入住老人提供丰富的业余选择，做到天天有活动，月月有安排，使老人乐在其中，认识更多同龄的朋友，实现自身价值，丰富业余生活，让老人在精神上得到极大的满足。


    传统观念中，养老院仅为老人提供住宿和饮食，经过这些年的发展，我国养老院尤其是民营养老机构不断建设与之完善。居住房间均配有电视、冰箱、空调等生活设施，公共活动中心有阅览室、棋牌室、理发室、健身房、康复室......


    一般的养老院都具备完善的组织架构和服务体系，从悉心照护到精神关怀再到一体化医疗，专业化的服务让入住中心的老人安心，让家属放心。


    大部分养老院都会有自己的时间表，老人除了自由活动外，一般都会安排集体活动时间。和老伙伴们一起运动娱乐玩耍，这样会让老人的生活更加健康和快乐，也可以让老人的一天过得非常充实。规律的一日三餐，营养均衡；规律的生活有利于老人的身心健康。养老院把合理丰富的活动和充足的休息时间相结合，老人每天都能精神振奋。


    最后必须总结一下：


    养老院虽然前景广阔，但却不是一个适合普通人入局的项目。


    原因：投资大，回报周期长'
  - '[PAGE 134]


    因为整体老龄化趋势，诞生了很多门槛不高适合普通人入局的新兴职业：


    # 1) 老年人能力评估师


    **2020 年 7 月**，人社部联合国家市场监管总局、国家统计局发布 **9** 个新职业，包括老年人能力评估师。


    截至 **2020 年 11 月**初，全国各地的老年人能力评估师大致分为专职和兼职两种，专职指第三方老年人评估机构，兼职则指由养老机构从业人员担任评估师，两种类型的评估从业者人数在
    **10 万人**以上。常见的评估方式分为三类：第三方评估、养老机构评估后再由相关部门抽查或普查、养老机构独立评估。


    工作任务包括：


    +   - 采集、记录老年人的基本信息和健康状况；

    - 评估老年人日常生活活动能力；

    - 测量与评估老年人认知能力、精神状态、感知觉与沟通能力、社会参与能力；

    - 依据测量与评估结果，确定老年人能力等级；

    - 出具老年人能力综合评估报告；

    - 为老年人能力恢复提出建议。


    目前，我国享受高龄津贴的老年人达 **2680 万人**，享受护理补贴的老年人达 **61 万人**，享受养老服务补贴的老年人达 **354 万人**，共有超过
    **3000 万人**需要通过老年人能力评估确定领取补贴资格。


    从筛查到护理补贴发放的过程都需要进行评估，需求量很大。而且现在全国有超过 **200 万人**住在养老机构里，从进入养老机构开始就需要初始评估，签订入住契约、合同，通过评估结果实施不同等级的服务。所以，这个岗位无论是从宏观体系、干预人才体系的建设还是微观的服务提供上，都是一个非常有必要的新岗位。'
  - '[PAGE 135]


    统计数据显示，老年人能力评估师人才需求为 150 万，但当前的从业人员尚不足 10 万，有巨大的人才缺口。这跟老年人能力评估师是 2020 年人社部等发布的“新职业”，很多人还不了解或者是没接触过有一定的关系。一个新的风口，就看能不能把握住了。


    现在一线城市中的老年人能力评估师月薪将近万元，二三线城市月薪也高达五六千元。


    随着养老机构、评估机构等需要老年人能力评估师的机构越来越多，而人才缺口还高达百万，相信老年人能力评估师的待遇还会有所提高！


    # 2）适老体验师


    一个为老年人“造梦”的新职业经由央视新闻推广。


    在 2020 年底，工信部开展互联网应用适老化改造专项行动，为了让老年人在信息化发展中获得更多幸福感，适老体验师应运而生。


    为解决界面复杂看不懂，想看视频不会搜索，字太小看不清……这些问题，适老体验师推出了听音识图、无障碍剧场等功能。为了摸清老年人的使用习惯，适老体验师还会蒙上眼睛，模拟老年人真实使用场景，或去社区收集老年人的使用建议，为老年人带来更多的文化娱乐新体验。


    帮老年人追赶智能时代。'
  - '[PAGE 136]


    目前，各大互联网公司应工信部要求，都有适老化改造需求。截止至 **12月**，工业和信息化部发布《关于电信服务质量的通告（2021年第4号）》。通告指出，第三季度互联网应用适老化及无障碍改造专项行动取得阶段性成效。目前，已有
    **158** 家网站和APP初步完成改造。改造后，老年人浏览新闻更轻松，线上购物更简单，购票打车更省心。


    （工信部）


    “阿里 **40** 万元年薪聘“老年产品体验师”、“还记得年薪 **40** 万的中老年淘宝体验师吗？”消息层出不穷。


    这个职业不仅仅年轻人可以参与到软件的适老化改造，老年人也有机会被聘请为体验师。随着老年群体的网购需求，网络娱乐需求的快速增长，适老体验师需求和市场也在逐步扩大。


    适老化改造推行一年，成果显著，更有不少网站和APP不止于字体放大、界面简化等初级改造，而是为老人配备专属客服，更加彻底地解决老人面临的数字困境。伴随老人使用互联网的障碍进一步消除，未来更深层次的适老化将展开拉锯战，各大平台需要更加深入地研究老人的需求和喜好，为他们提供适合他们的内容、产品和服务，这是留存老年用户的关键。


    再例如健康管理师和公共营养师等新职业也因为老龄化趋势而变的紧俏。平均 **2** 个月就可以自学到证书，考完后还可以领导国家下发的证书并申请补贴。就业市场也是十分的广泛。


