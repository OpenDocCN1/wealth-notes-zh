  md: '

    根据 1.2 中的找对标账号方法，汇总账号库，从账号列表里找低粉爆款，最好是近 1~3 个月快速涨粉的账号，再筛选最近发布（7 天内）视频中点赞、转发、评论高的数据视频：


    ![](img/9291edba57e97d5c0b2faf030456313c_203_0.png)


    ### ② 抖音关键词搜索找爆款视频


    抖音直接搜索你想做的内容的关键词，筛选——点赞最高——1 天内，看视频排名，筛选 IP 类账号博主，下载源视频，根据上述提到的方式二改视频。


    ### ③ 改造爆款视频


    #### 方式 1: 原视频二改


    **步骤 1:** 使用圈友分享的去水印视频工具，复制单个/多个视频链接，去水印保存到本地。


    ![](img/9291edba57e97d5c0b2faf030456313c_204_0.png)


    **步骤 2:** 打开剪映，导入视频源。


    **步骤 3:** 导入自拍视频，分离音视频，删除音频。


    **步骤 4:** 添加背景图、滤镜特效，音频调低音量和形式模板。


    形式模板：源视频+自拍音频+背景图+滤镜特效+音频调低音量和，后续直接替换源视频即可。如果出现低播放（未过重），说明找到视频源被多次使用，需要再深层次多个视频混剪。


    **步骤 5:** PC 端打开微信视频号后台，拖入视频，复制下载视频标题，发布即可。


    一般遵循早晨 6~7 点，12~13 点，下午 6 点之后的时间点发布。


    ![](img/9291edba57e97d5c0b2faf030456313c_205_0.png)


    #### 方式 2: 保留音频，替换视频画面


    **步骤 1:** 同上先下载视频。


    **步骤 2:** 将视频导入剪映中，音视频分离。


    **步骤 3:** 删除视频画面。


    **步骤 4:** 添加自拍视频，作为画中画素材，分离音视频，并删除音频。


    ![](img/9291edba57e97d5c0b2faf030456313c_206_0.png)


    **步骤 5:** 根据源视频大纲内容，选择合适的人物图片，导入剪映操作区选中对应的图片，右上角动画——向左/向右滑动——设置动画时长：3.5s 左右即可。


    **步骤 6:** 拉长图片长度，保持与音频同时段结束，如果源视频中有关于抖音字眼及点击右侧+引导关注的字眼，记得选中视频删除。


    ![](img/9291edba57e97d5c0b2faf030456313c_207_0.png)


    ### （2）做爆款选题


    做情感故事，核心是围绕着人性讲故事，老年人对什么感兴趣就按照这个选题方向批量复制。


    另外一个特点是中老年用户对于视频画面像素要求普遍不高，在咱们看来粗制滥造的视频，在老年圈广受喜爱积极传播。


    所以我们不用在视频上大费功夫找高清好看视频（带货类除外，带货类还是要讲究视频高清流畅，视频画面优秀会影响转化率），非带货类视频重点是选题。


    **步骤 1：拆解爆款视频，思维导图梳理常见爆款视频的情感故事人物关系**


    ![](img/9291edba57e97d5c0b2faf030456313c_208_0.png)


    **方式 2：素材库整理爆款选题库，交叉生成新的视频选题**


    | 开头钩子 | 主人公 | 故事主干 | 结尾 | 结尾引导互动 |

    | :--- | :--- | :--- | :--- | :--- |

    | | | 梦想或目标 | 挫折、困难意外 | | |

    | 大姑来我家带了一箱礼物，我让她先坐没让出了位去，这是怎么回事呢？ | 我、大姑、妈妈 | 我妈大姑家小侄提了 100 万红包，我是大姑后代。 | 大姑在我家也待了一段，回家还没说感谢我照顾的话
    | 我说对不起，特大姑全家打工过去 | 全家支持我做法，认可家人这个善心，纷纷表达同意的看法 |

    | 78 岁老母亲转送得了 10 万，结果全部捐了，一分没给儿子用，这到底是怎么回事呢？ | 78 岁老母亲是母亲的儿子 | 转送得了 100 万 | 儿子从未赡养老人，因征她全部捐给医院当中基础
    | 老人认为儿子不赡养老人，不想便宜同胞家 | 全家认同老人的做法，认可家人这个善心，纷纷表达同意的看法 |


    视频故事选题需要包括：


    - 有情绪、有信息增量、性、金钱、暴力等至少 2~3 个元素，另外尽量写老年人的家长里短故事，不要写出轨等非主流社会宣传的选题故事。

    - 视频开头：总结故事主干，用一句有悬念的话留住用户的注意力。

    - 视频中间：解开故事开头的谜底，叙述故事发生过程。

    - 视频结尾：结尾主要是引导点赞分享，通过大家认可/支持 xx 的做法嘛，来调动用户情绪，引发共鸣，顺势点一波赞，评论留言互动，提升视频播放数据，实现破圈传播。


    ### （3）视频爆款要素


    ① 爆款选题：

    - 1. 讲故事—人的本性都是爱听故事的

    - 2. 谈情怀—触动用户内心深处的情感共鸣


    ② 提升用户点赞方法：

    - 1. 引发共鸣—解决用户痛点或调动情绪价值，引导点赞


    举例：大家认同xx的做法嘛/大家觉得xx这样做对嘛，认可的家人点个赞，评论区留下你的说法吧


    ③ 提升用户分享方法：

    - 1. 调动情绪—触及用户内心深处，感同身受

    - 2. 代入感—自我代入感让用户身临其境

    - 3. 共情效应—向往美好，支持正向能量传递


    ④ 制造悬念：

    - 开头黄金三秒，话说一半，吊人胃口。


    比如：农村一位老人拆迁房子得了100万拆迁款，结果一分没留给儿女，这到底是怎么回事呢，大家接着往下看。


    ## 三、5 个避坑分享


    ### （1）准备好再开始


    不存在彻底准备好的时候，一直纠结一直准备只会让你在岸上早死，大概率拖延着到最后不了了之。


    所以别犹豫，现在立马就去做，在做的过程中迭代就行，也不用纠结设备好不好，账号头像昵称简介是不是要精心打磨，都不需要！


    0 粉爆款主要靠视频公域推荐，账号搜索流量很小，不用纠结。


    我第一次搞视频号的时候，各种调研其他账号信息如何包装，用表格记录、分析，断断续续花了一个星期才搞完账号，事实证明这些并没有让我的流量出现爆发式增长；


    第二次开新号的时候定下来就立即开号，头像、昵称和简介花 10 分钟搞定，直接就开始发视频，流量也没受到影响。


    如果你现在看到这里并打算开始运营视频号，别犹豫，现在立马拿起手机，打开微信，创建一个视频号，头像可以改，昵称一年 5 次可以改，简介也能改，不要总想着一次做的很完美，先做再改。


    ### （2）陷入流量数据自嗨


    对个人来说，流量一定是为变现去服务，所以当出现非带货类爆款视频后，赶快想带货类视频，测试选品，有部分用户会通过爆款视频进入账号主页看到其他视频，有利于带货视频曝光。


    以终为始想最终的变现方式，到底是什么，在执行的过程要关注自己有没有偏离核心目的，如果明确就是带货变现，那就把更多的精力投入到选品中，数据爆了就开始播，想办法用各种可以提升转化的方式去测试，去提升带货佣金。


    不要沉浸在爆款视频！点赞、评论、关注这些都是昙花一现的虚假繁荣，账号违规了视频分分钟零播。


    ### （3）遇爆款没开播


    出现爆款视频，不要拖，抓紧直播，有选品就直接直播带货，没选品先把用户引流到私域（微信号最佳、小程序和公众号触达效果弱），仅停留在视频号上的粉丝很难再触达到。


    （因为大部分的视频流量还是来源于公域推荐，即使有几十万粉丝，用户依然没有形成从关注列表中只看你的视频的习惯，基本上是随便刷，刷到你的视频感觉不错再进行后续的动作）


    所以抓住机会要么转化，要么留存在可多次触达的私域场景。


    下方图片是当时爆款视频的相关数据，不到半小时就能涨几千粉，涨粉速度非常快，但是当时犹豫没有选品，直接开直播不知道讲什么，加上对直播比较畏怯，就一直让这种非常爆的状态持续
    3-4 天白白流失掉了。


    如果在这种涨粉速度下开直播，通过短视频引流到直播间的用户，也能轻松让自己进入到现场几千人的直播广场中。


    所以当视频号出现爆款播放，不管爆的是带货类还是非带货类，先预约直播，下班就开播介绍产品，中途用户互动引导点赞打赏，可以提升直播间互动数据，把自己直播间推到更大的流量池中。


    在直播的场景下转化链路更短，互动及及时性也强，相较短视频的转化方式，转化效率更高。


