    # ② 中老年睡眠


    前段看数据的时候，从国民睡眠健康白皮书我看到 40 岁以上的人群睡眠问题已经很


    然后我了解了下数字睡眠这个市场，已经有很多公司在做了，比如好睡眠、享睡等


    各种各样的 APP，还有一些和音乐助眠结合的白噪音产品等等。


    总之睡眠问题是复杂问题，原因很多元


    # 不同年龄：年轻人熬夜多，老年人睡不着


    ![](img/9291edba57e97d5c0b2faf030456313c_367_0.png)


    作为普通人，我想切入的可能有三个方向，一个是偏教程类，超低价的课程来教大家


    怎么使用市面上各种各样的助眠产品。


    第二个可能是从心理、情绪方向疏导的课程。'
