    # **6. 天猫医药健康联合薇娅直播间，发起“银发经济公益活动”**


    近日，为协助关怀困境老年人群体，在国家卫生健康委人口家庭司的指导下，天猫医药健康联合薇娅直播间发起“银发经济公益活动”，举行关怀困境老人义卖直播，聚焦关注60岁以上，身体和心理需要照顾的老年人，公益收入将全部捐赠给中国人口福利基金会，用于困难老人等特殊老年群体健康和扶助关怀。（中国家庭报）


    从字节跳动发起助老公益项目“银杏家园”，到天猫如今发起的银发经济公益活动，巨头围绕银发人群展开的动作不仅仅是适老化改造，也在纷纷以公益形式助推他们的生活变得更加美好。这也诠释了银发经济的核心不是“经济”，而是“银发”，只有本着为银发人群提供更高品质更加美好生活的心态，才能做好银发人群的生意。


    # **7. 中国老年人体育协会广场舞专项委员会成立**


    近日，中国老年人体育协会广场舞专项委员会成立大会在国家体育总局老干局活动中心举行，中国老年人体育协会副主席温文当选广场舞专委会主任。专委会由中国老年人体的协、各省老年人体的协、华奥星空科技发展有限公司及合作企业代表组成，办公机构设立在华奥星空。会上，湖北、山东和河南的老年人体的协代表以网络连线的方式进行经验分享，介绍了省内开展广场舞运动进行的有益尝试和成熟做法。（中国体育报）


    广场舞，一直以来被视为中老年女性的专属标签，也被不少企业视为打入中老年市场的重要渠道。如今，中国老年人体育协会广场舞专项委员会成立，意味着广场舞在老年人运动、文娱、社交等领域的价值正在被国家重视，正式成为老年人体育运动中的一种。可以预见，未来，广场舞仍然会有更多发展形态，围绕广场舞所建立的老年线下运动、健身空间也有机会。


    # **8. 韩国将开发VR老年驾驶培训课程，计划于2025年开始使用**'
  - '[PAGE 146]


    为了控制老年司机的事故率，近日，韩国警方正在开发一个定制驾驶员培训项目，该项目计划使用VR技术评估65岁及以上驾驶员的驾驶、认知和记忆能力，以判断他们是否继续持有驾驶证，项目为期三年。该项目源于韩国日益加深的人口老龄化问题，据悉，在韩国，约有40%的士司机年龄超过65岁，同时，去年由老年人驾驶员造成的道路交通事故，超过31000起。（外媒）


    VR在老年人中的应用场景越来越多，此前，曾有公司探索将VR与旅游结合在一起，为老人提供虚拟世界旅行；也有公司将VR与游戏结合，应用于认知症的治疗等等。如今，VR又被应用于老年驾驶培训，这意味着，VR技术在老年人群中的商业空间在不断拓宽，未来仍有许多值得探索的方向。


    # 9. 伊利欣活签约70后刘国梁为品牌推荐官


    近日，伊利旗下中老年奶粉品牌欣活宣布签约70后知名乒乓球运动员、教练员刘国梁为品牌推荐官。刘国梁有着近40年乒乓球职业生涯，现任国际乒乓球联合会执行副主席、中国乒乓球协会主席、世界乒乓球职业大联盟理事会主席。关于此次签约，伊利欣活表示，希望和刘国梁一起用专业配方守护中老年人健康。（伊利欣活公众号）


    婴幼儿奶粉市场增速正在放缓，由增量市场变成存量市场。与此同时，伴随老龄化趋势加深，中老年奶粉正逐渐成为乳业的主要竞争方向。近两年来，包括伊利欣活、蒙牛悠瑞、雀巢怡养等在内的中老年奶粉品牌不断加码中老年高端市场，除了密集发布新品，营销玩法也越来越多样，推动中老年奶粉市场竞争加速升级。


    # 10. 美国老年人社交学习平台GetSetUp获得1000万美元战略投资


    近日，AgeClub获悉，美国一家老年人社交学习平台GetSetUp获得1000万美元战略投资，投资方为LightShedVentures和CowboyVentures。'
  - '[PAGE 147]


    一年前，该公司曾获得 1000 万美元天使轮融资。GetSetUp 创立于 2019 年，采用实时互动的同辈教学模式，主要为老年人提供课程学习和社会服务，通过视频向老年用户讲解如何使用不同类型的软件，以及一些医疗、金融产品和服务的相关内容。（鲸准）


    老龄化带来的市场潜力和机遇不仅仅发生在国内，也发生在许多国家。同时，老年人生活、工作、贡献社会的时间也整体呈现出延长的趋势，这催生了不同国家老人对文娱社交和学习的共通需求。


    而 GetSetUp 采用同辈教学的模式，既能够帮助老人化解孤独，提升个人认知和社会参与感，也能为不少老人带来“赚钱”的新方式，从另一个维度解决了老人的价值感和收入问题。对于国内企业来说，这不失为一种值得借鉴的模式。


    # 11. 智能助听器公司智听科技获数千万元 Pre-A 轮投资


    近日，智能助听器公司智听科技（全名为：深圳市智听科技有限公司）获得数千万元 Pre-A 投资，投资方包括青松基金、小米战投、顺为资本，华芯资本、至澄资本担任融资顾问。此前，智听科技曾获力合创投天使轮投资。据悉，智听科技成立于
    2017 年，是一家致力于听力检测与助听系统智能化开发的医疗器械公司。（界面）


    世界卫生组织曾发布统计数据显示，65 岁以上老人中约有三分之一患有残疾性听力损失。与此同时，国内助听器市场的覆盖率不到 5%，这其中，传统助听器普遍万元以上的售价和不佳的体验是阻碍老人购买助听器的主要痛点。


    针对传统助听器市场的痛点和巨大空白，近两年出现了不少新兴智能助听器企业，也带动资本的关注和布局。未来，立足研发，探索更适合老人的产品形态和验配模式，将成为助听器市场变革的关键。'
  - '[PAGE 148]


    # 12. 美国数字化老年健身平台Vivo完成100万美元种子轮融资


    近日，AgeClub 获悉，美国数字化老年健身平台 Vivo 完成 100 万美元种子轮融资，本轮融资包括著名的医疗保健和长寿行业领导人及风险资本家参与。Vivo
    是一家在线训练健身服务提供商，专门为 55 岁及以上成年人设计训练健身计划。该计划以远程方式提供，用户通过该平台可在家中锻炼。（鲸准）


    关于中老年运动健身，国内外已经出现不少相关项目，不乏成功者。而从最近的趋势来看，区别于过去以健身房为主要承载空间的商业模式，瞄准中老年人居家运动锻炼需求的项目也开始出现。除了美国这家数字化老年健身平台
    Vivo ，在国内，以乐刻为代表的头部健身公司也在通过家庭场景切入中老年人群。这意味着，中老年人将成为整个健身市场的重要增量已经成为共识，而聚焦他们在不同场景下的运动锻炼需求，也将产生多元的创新创业空间。


