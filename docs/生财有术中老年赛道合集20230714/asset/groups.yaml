  md: "\n视频小号：还有个方法就是另外开通一个视频小号，将小号设置成私密账号，把课程上传到小号了，引导客户关注视频小号，后台通过关注申请就可以了。\n\n\
    避坑：刚开始的时候，为了节省成本，选择了用免费的【荔枝微课】平台，结果导致了非常多的售后问题。\n\n荔枝微课里的广告非常多，每天都有大量的客户来问怎么找课程，为什么课程看不到等诸多问题。\n\
    \n后来实在忍受不了这无休无止的售后问题，花钱没了小鹅通平台，从此以后，用户基本上没有了操作方面的问题了。\n\n所以，课程的平台选择还是很重要的，毕竟客群不是会玩手机的年轻人。\n\
    \n## 第二阶段：根据市场反馈持续优化产品\n\n刚开始的时候，为了做到【轻交付】，采取的是虚拟课程，但是中老年人群有个特点，就是眼睛不太好，眼睛长时间盯着屏幕看，字体小，在直播过程中不断有用户提出能不能出书，这就是在做的时候市场给到我的反馈。\n\
    \n所以后期采取了简谱书+二维码的形式，每首乐曲上方都有一个二维码，用手机扫码后就有相对应的练习视频，用户可以一边看着书一边练习，这样产品非常受中老年人的喜欢。\n\
    \n# 我们的田野\n\n常 作词\n张文科 曲\n\n1=F 2/4\n中速 宽广、优美\n\n![](img/9291edba57e97d5c0b2faf030456313c_286_0.png)\n\
    \n- 1. 我们的田野，美丽得田野，绿绿的\n- 2. 平静的湖中，开得荷花，金色的\n- 3. 风吹着森林，雷雨一样轰响，伐木的\n- 4. 森林的背后，有浅蓝色的山，在那些\n\
    - 5. 高高的天空，雄鹰在飞翔，好像在\n\n![](img/9291edba57e97d5c0b2faf030456313c_286_1.png)\n\n\
    - 河 水 流 过 无 边 的 稻 田， 无\n- 鲤 鱼， 长 得 那 么 肥 大， 湖\n- 工 人， 请 出 一 颗 颗 大 树， 去\n- 山 里，\
    \ 有 一 野 鹿 和 山 羊， 人\n- 守 卫， 辽 阔 美 丽 的 土 地， 一\n\n![](img/9291edba57e97d5c0b2faf030456313c_286_2.png)\n\
    \n- 边 的 稻 田 中， 好像 起 伏 的 海\n- 边 的 芦 苇 中， 藏 着 成 群 的 野\n- 这 些 楼 房 去 建 造 者\n- 他们 勤\
