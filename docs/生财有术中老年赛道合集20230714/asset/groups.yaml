    随着计划生育时期出生的独生子女逐步成为社会的中坚力量，家庭养老的负担也日益加重，加强社区养老和机构养老可以帮助缓解一些对家庭的压力。


    对于社区养老，可以完善社区居民养老服务网络，推进公共设施适老化改造；对于机构养老，可以加大对养老产业的支持力度，多措并举扩大养老机构床位供给，提升养老机构的专业服务能力。


    加大二三支柱养老金的推进力度：我国三大支柱的养老金体系发展很不平衡，呈现“头重脚轻”的现象，以企业年金和职业年金为主的第二支柱参保覆盖面仍然较窄，只能满足小部分群体的养老需求；由个人储蓄型养老保险和商业养老保险构成的第三支柱参保人数几乎可以忽略不计。


    根据 2019 年数据，我国养老金第一支柱占比逾七成；第二支柱占比不足 3 成；第三支柱占比几乎可以忽略不计。相比之下，美国等发达国家养老金体系已经走向以二三支柱为主导的商业模式。未来我国亟需加大对二三支柱养老金的推进力度，促进养老金体系更均衡、更可持续的发展。


