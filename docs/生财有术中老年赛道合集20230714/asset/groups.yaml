    \ 28%。每天有近七成银发观众收看过电视节目，人均收视时长达 215 分钟，收视率达 14.9%；从节目类型来看，电视剧、新闻/时事、综艺是银发 e 族收看的最主要节目类型。另外，相比所有观众，银发\
    \ e 族在财经、法制、新闻/时事、体育和戏剧类型的节目资源使用效率更高。（CSM）\n\n银发网民数量已经高达 2.8 亿，但相比银发电视观众仍然少了 7500\
    \ 万人，时至今日，电视仍然是触达银发人群最主要的媒介渠道。\n\n而从银发人群对媒介的偏好和使用习惯来看，他们也依然是电视的重度用户。这一方面为传统电视台转型指出了方向：即针对老年人的需求和喜好设计创新节目，增强粘性。另一方面也为老年行业企业提供了新的获客思路。\n\
    \n## 5. 中老化妆教程网站\n\n日本资生堂推广 50+ 女性个护产品线，上线中老化妆教程网站。\n\n![](img/9291edba57e97d5c0b2faf030456313c_144_0.png)\n\
    \n近日，日本资生堂面向 50 岁以上女性的个人护理系列“PRIOR”启动新项目“熟龄魅力”（意译）。资生堂将为此开设专门的网站，传播中老年化妆教程，目标是在三年内将“PRIOR”打造为熟龄一代的首选品牌。\n\
    \n发布会上，76 岁的宫本信子、67 岁的黑泽和子、69 岁的大岛美雪等演艺名人作为代言人亮相。据了解，日本永旺、亚瑟士健步鞋、连锁药店 WELCIA 等日本企业也将参与此项目。（外媒）\n\
    \n于 2015 年推出的资生堂“PRIOR”主打美容护理产品，以护肤、底妆、护发等系列为主，售价约在 200-600 元人民币之间。\n\n在产品线成熟后，资生堂将重点放在了市场教育及渗透上，通过化妆教学视频打开市场。在国内市场，通过化妆教学视频引流，也已经成为中老年赛道的流量密码。在线下渠道方面，资生堂选择和日本永旺、连锁药店合作，为国内老年化妆品品牌提供了新的思路。\n\
    \n## 6. 天猫医药健康联合薇娅直播间，发起“银发经济公益活动”\n\n近日，为协助关怀困境老年人群体，在国家卫生健康委人口家庭司的指导下，天猫医药健康联合薇娅直播间发起“银发经济公益活动”，举行关怀困境老人义卖直播，聚焦关注\
    \ 60 岁以上，身体和心理需要照顾的老年人，公益收入将全部捐赠给中国人口福利基金会，用于困难老人等特殊老年群体健康和扶助关怀。（中国家庭报）\n\n从字节跳动发起助老公益项目“银杏家园”，到天猫如今发起的银发经济公益活动，巨头围绕银发人群展开的动作不仅仅是适老化改造，也在纷纷以公益形式助推他们的生活变得更加美好。这也诠释了银发经济的核心不是“经济”，而是“银发”，只有本着为银发人群提供更高品质更加美好生活的心态，才能做好银发人群的生意。\n\
    \n## 7. 中国老年人体育协会广场舞专项委员会成立\n\n近日，中国老年人体育协会广场舞专项委员会成立大会在国家体育总局老干局活动中心举行，中国老年人体育协会副主席温文当选广场舞专委会主任。专委会由中国老年人体育协会、各省老年人体育协会、华奥星空科技发展有限公司及合作企业代表组成，办公机构设立在华奥星空。会上，湖北、山东和河南的老年人体育协会代表以网络连线的方式进行经验分享，介绍了省内开展广场舞运动进行的有益尝试和成熟做法。（中国体育报）\n\
    \n广场舞，一直以来被视为中老年女性的专属标签，也被不少企业视为打入中老年市场的重要渠道。如今，中国老年人体育协会广场舞专项委员会成立，意味着广场舞在老年人运动、文娱、社交等领域的价值正在被国家重视，正式成为老年人体育运动中的一种。可以预见，未来，广场舞仍然会有更多发展形态，围绕广场舞所建立的老年线下运动、健身空间也有机会。\n\
    \n## 8. 韩国将开发 VR 老年驾驶培训课程，计划于 2025 年开始使用\n\n为了控制老年司机的事故率，近日，韩国警方正在开发一个定制驾驶员培训项目，该项目计划使用\
    \ VR 技术评估 65 岁及以上驾驶员的驾驶、认知和记忆能力，以判断他们是否继续持有驾驶证，项目为期三年。该项目源于韩国日益加深的人口老龄化问题，据悉，在韩国，约有\
    \ 40% 的出租车司机年龄超过 65 岁，同时，去年由老年人驾驶员造成的道路交通事故，超过 31000 起。（外媒）\n\nVR 在老年人中的应用场景越来越多，此前，曾有公司探索将\
    \ VR 与旅游结合在一起，为老人提供虚拟世界旅行；也有公司将 VR 与游戏结合，应用于认知症的治疗等等。如今，VR 又被应用于老年驾驶培训，这意味着，VR\
    \ 技术在老年人群中的商业空间在不断拓宽，未来仍有许多值得探索的方向。\n\n## 9. 伊利欣活签约 70 后刘国梁为品牌推荐官\n\n近日，伊利旗下中老年奶粉品牌欣活宣布签约\
    \ 70 后知名乒乓球运动员、教练员刘国梁为品牌推荐官。刘国梁有着近 40 年乒乓球职业生涯，现任国际乒乓球联合会执行副主席、中国乒乓球协会主席、世界乒乓球职业大联盟理事会主席。关于此次签约，伊利欣活表示，希望和刘国梁一起用专业配方守护中老年人健康。（伊利欣活公众号）\n\
    \n婴幼儿奶粉市场增速正在放缓，由增量市场变成存量市场。与此同时，伴随老龄化趋势加深，中老年奶粉正逐渐成为乳业的主要竞争方向。近两年来，包括伊利欣活、蒙牛悠瑞、雀巢怡养等在内的中老年奶粉品牌不断加码中老年高端市场，除了密集发布新品，营销玩法也越来越多样，推动中老年奶粉市场竞争加速升级。\n\
    \n## 10. 美国老年人社交学习平台 GetSetUp 获得 1000 万美元战略投资\n\n近日，AgeClub 获悉，美国一家老年人社交学习平台 GetSetUp\
    \ 获得 1000 万美元战略投资，投资方为 LightShed Ventures 和 Cowboy Ventures。\n\n一年前，该公司曾获得 1000\
    \ 万美元天使轮融资。GetSetUp 创立于 2019 年，采用实时互动的同辈教学模式，主要为老年人提供课程学习和社会服务，通过视频向老年用户讲解如何使用不同类型的软件，以及一些医疗、金融产品和服务的相关内容。（鲸准）\n\
    \n老龄化带来的市场潜力和机遇不仅仅发生在国内，也发生在许多国家。同时，老年人生活、工作、贡献社会的时间也整体呈现出延长的趋势，这催生了不同国家老人对文娱社交和学习的共通需求。\n\
    \n而 GetSetUp 采用同辈教学的模式，既能够帮助老人化解孤独，提升个人认知和社会参与感，也能为不少老人带来“赚钱”的新方式，从另一个维度解决了老人的价值感和收入问题。对于国内企业来说，这不失为一种值得借鉴的模式。\n\
    \n## 11. 智能助听器公司智听科技获数千万元 Pre-A 轮投资\n\n近日，智能助听器公司智听科技（全名为：深圳市智听科技有限公司）获得数千万元 Pre-A\
    \ 轮投资，投资方包括青松基金、小米战投、顺为资本，华芯资本、至澄资本担任融资顾问。此前，智听科技曾获力合创投天使轮投资。据悉，智听科技成立于 2017 年，是一家致力于听力检测与助听系统智能化开发的医疗器械公司。（界面）\n\
    \n世界卫生组织曾发布统计数据显示，65 岁以上老人中约有三分之一患有残疾性听力损失。与此同时，国内助听器市场的覆盖率不到 5%，这其中，传统助听器普遍万元以上的售价和不佳的体验是阻碍老人购买助听器的主要痛点。\n\
    \n针对传统助听器市场的痛点和巨大空白，近两年出现了不少新兴智能助听器企业，也带动资本的关注和布局。未来，立足研发，探索更适合老人的产品形态和验配模式，将成为助听器市场变革的关键。\n\
    \n## 12. 美国数字化老年健身平台 Vivo 完成 100 万美元种子轮融资\n\n近日，AgeClub 获悉，美国数字化老年健身平台 Vivo 完成\
    \ 100 万美元种子轮融资，本轮融资包括著名的医疗保健和长寿行业领导人及风险资本家参与。Vivo 是一家在线训练健身服务提供商，专门为 55 岁及以上成年人设计训练健身计划。该计划以远程方式提供，用户通过该平台可在家中锻炼。（鲸准）\n\
    \n关于中老年运动健身，国内外已经出现不少相关项目，不乏成功者。而从最近的趋势来看，区别于过去以健身房为主要承载空间的商业模式，瞄准中老年人居家运动锻炼需求的项目也开始出现。除了美国这家数字化老年健身平台\
    \ Vivo，在国内，以乐刻为代表的头部健身公司也在通过家庭场景切入中老年人群。这意味着，中老年人将成为整个健身市场的重要增量已经成为共识，而聚焦他们在不同场景下的运动锻炼需求，也将产生多元的创新创业空间。\n\
    \n## 13. 发展智慧旅游提高适老化\n\n### 首批发展智慧旅游提高适老化程度示范案例名单\n\n- 1. 杭州适老服务弥“鸿沟” 便民惠民提效能\n\
    - 2. “游云南”App 长辈模式保障老年人无忧出行\n- 3. 江苏省徐州市泉山区适老化智慧旅游导览系统\n- 4. “浙里好玩”发展智慧旅游提高适老化程度\n\
    - 5. 美团线下门票预订关怀版助推天津景区提升适老化水平\n- 6. 颐和园服务零距离 智享园林夕阳红\n- 7. 北京智慧旅游地图 助力老年人畅游无忧\n\
    - 8. 黄山旅游官方平台探索提升老年人游玩体验新范式\n- 9. 河北线上线下齐发力 智慧赋能“银发族”\n- 10. 新疆那拉提景区助力老年人跨越“数字鸿沟”\n\
    - 11. 宁夏旅游一卡通增强老年人获得感和幸福感\n- 12. 内蒙古土默特右旗瞄准智慧适老 便捷老年人出行\n- 13. 携程发展智慧旅游提高适老化程度实践\n\
    - 14. 甘肃景区（场馆）分时预约系统提升适老化功能\n\n近日，文化和旅游部资源开发司发布通知，公布首批发展智慧旅游提高适老化程度示范案例名单，“杭州适老服务弥‘鸿沟’便民惠民提效能”等全国范围内\
    \ 14 个案例入选。案例评选旨在推动发展智慧旅游提高适老化程度，解决老年人“数字鸿沟”问题。\n\n种种现象和数据表明，老年人正在成为推动旅游市场复苏的重要推动力量。相比年轻人，他们有钱有闲，对旅游的喜好和需求更加旺盛。而伴随旅游适老化的逐步推进，意味着他们在出行时面临的第一层壁垒被消除，出游的热情也会进一步激发。未来，围绕老人的旅游需求和痛点进行深层次的改造，打造高品质的场景、内容和服务，将成为推动旅游市场升级的新动能。\n\
    \n关于人口老龄化的思路绝不仅限如此，我只是做了一个大致市场趋势的描述来供大家参考，对中老年人赛道有兴趣的朋友欢迎在评论区跟我交流呀~\n\n## 评论区：\n\
