    【所在城市】：伦敦\n【个人介绍】：喜欢书法和国画等\n传统文化，希望在老师带领下和书\n友们一起共同进步！\n\n其实前些年很方便的，疫情3年搞\n乱了，没办法，以后有机会再来，\n\
    我们在洛杉矶，欢迎老师来玩\n啊\n\n嗯嗯，年轻人还好在外面，年龄越大越\n喜欢回老家\n\n（给大家截几个私域的用户）\n\n一句话总结就是，现在的都市银发，手机可以玩得溜，有钱，有时间、爱分享，对服务更关注、对线上付费逐渐适应并习惯\n\
    \n### Part03\n\n拿我自己的赛道和我自己的经历，我把这几年大概分为三个阶段（知识付费为主的赛道，篇幅问题，今天不谈硬件、APP、电商等类目）\n\
    \n2008-2015 混萌芽期，这个阶段很多人都不知道怎么做银发赛道，这几年大部分的是做流量的平台，后期表现也表现不好，糖豆广场舞等垂直 APP 在那几年获取了大量的流量。\n\
    \n2015-2019 野蛮生长期，这个阶段，出现了一些垂直的平台，比如美篇等社交平台、墨客、墨池、快乐 50 等垂直领域的机构、养老家政、健康睡眠等项目兴起、线下的老年大学（报名名额抢都抢不到）、音乐相册、天气软件等工具类产品，得到了快速的发展，吃到了一波红利。\n\
    \n2020-2023 飞速增长期，这个阶段，大厂开始入场，先是红松短期内拿到了两笔由蓝驰、经纬等机构数千万美元的投资，知乎合伙人出来做的老年项目、尚德教育、大鹏教育（如今倒闭了，嗷吁噻）、高途等等都开始做银发赛道的知识付费我自己深有体会，中老年知识付费，2015\
    \ 年到 2018 年，绝对是野蛮生长的几年。\n\n分享个数据，这几年最开始走最简单的公众号投放，完全不需要任何投放技巧和文章的转化技巧，书法课、国画课的\
    \ ROI 可以做到 20，而且复购率超高，什么概念，一个月投放花 5 万，能卖 100 万，而且客单价可以轻松拉到 2000。\n\n主要是用户巨便宜，当时我平均一个进群用户的成本在\
    \ 5 元左右，注意，是垂直的兴趣粉，不是泛流量。\n\n而同期，是幼儿教育赛道和 K12 神仙打架的几年，当时优质的母婴流量从几十一个快速攀升到一两百我当时这个项目整个的启动资金，仅仅是小鹅通的平台费\
    \ + 找老师录制的体验课费用（最开始卖期货，有体验课和长期课大纲就开始卖）+ 第一个月的投放费用，整体成本不超过 5 万，就滚到了第一年营收两百多万。\n\
    \n我总结这一切得益于我前面几年做幼儿赛道的经验，可以说如果做过 K12 或者幼儿教育，进到老年赛道，那些做课方法、服务方式和营销手段简直是降维打击。\n\n\
    最近两年，随着大厂进场来普及用户认知，更多的垂直方向的知识付费都迎来了更大的机会。\n\n![](img/9291edba57e97d5c0b2faf030456313c_361_0.png)\n\
    \n咱们不能说一提到银发赛道，能做的项 目就都是开个养老院、弄点高毛利的保健品、 走步送鸡蛋、针灸广场舞等。\n\n现在的银发族可不像前几年了，移动互联 网都发展多少年了，现在大部分赛道都可以银\
    \ 发人群重做一遍的，银发族的社交、健康、衣 食住行、兴趣爱好、线上工具等，很多维 度都蕴含着很大的机会。\n\n随便举几个最近比较火的例子：老年 Keep、老红书、老年家政、老年睡眠、老年文娱、营业健康管理，正确带孙子的课程等等等等，太多了，说不完！\n\
    \n从我的角度，个人觉有几点原因\n\n- 流量侧：更多元的触达用户的形式，视频号等中老年居多的短视频平台，还有类似美篇这种垂直平台的兴起，带来了更多的机会\n\
    - 用户侧：大公司进场，用户认知和习惯逐渐培养起来，还有就是中老年对于服务的感知和认可，超过品牌加持。\n\n哪怕是大公司的课程，我服务做的好，我课程更贴近用户需求，一样可以卖的很好，在中老年眼里，这些大公司和你没区别，并且现在的都市银发，已经能很熟练的下载\
    \ APP、转发评论、小程序打开、各种支付玩的很溜。\n\n- 产品侧：现在中老年赛道的产品很匮乏，你在其他赛道做到 120 分才有机会，可能在这个赛道做到\
    \ 60 分就有点机会了，毕竟见过曾经的音乐相册软件和天气软件几个月可以获取几百万的流量。\n\n不过需要注意的是，流量获取阵地和产品形态要选好，说句实话，我测过很多主流渠道，有用户之后，测试过很多种形态的打法。\n\
    \n测试下来，基本上微信体系内和视频号是路径最顺的抖音和线下也还可以（这里不包含银发电商玩法）\n\n![](img/9291edba57e97d5c0b2faf030456313c_363_0.png)\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_363_1.png)\n\n![](img/9291edba57e97d5c0b2faf030456313c_363_2.png)\n\
    \n（某班级群作业圈，虽然是大字手机，但是也超爱分享）\n\n对于我们普通人，个体来说，无论是搞流量还是做课程，都是机会超级大，如果你没有产品技术能力的话，我更推荐个体去做课，是真的香。\n\
    \n我现在已经在从生活和兴趣的两个大维度上，大范围的做轻课去测试了，可能有的铁子会觉得这需要一些专业技能。\n\n其实说实话，我最开始是完全不懂书法国画的人，我仅仅是懂用户和流量，课程我找对应专业的人录制，老师出完大纲，我结合用户需求修改审核，甚至很多方向，你找个大学生，极低的成本就能给你出来很多专业的课程\n\
    \n今天拿我最近做的一款电子琴课程来举个例子吧。\n\n之前有铁子和我 说, 一听 电子琴, 还是 老年人学电子琴觉得 好小众啊, 能有人买单吗?\n\n\
    我来告诉你, 音乐方向的课在银发知识付费里的是一个不小的市场, 目前已经有很多规模不小的公司在做了, 比如快乐 50, 红松学堂等, 而且客单很高。\n\n\
    首先挖掘细 分需求这个 这里不做过多赘述, 可以 看我之前在生财分享的一篇文章,\n\nhttps://articles.zsxq.com/id_pt1urnv5g4ah.html\n\
    \n挖掘好需求 之后, 我需要快速做 mvp 验证, 这里我要解决的是流量和产品的问题, 因为变现就是靠售卖课程对吧, 那么我开始思考流量。\n\n于是我用视频号测了下,\
    \ 老年人 音乐的几个方向, 比如老歌混剪、乐谱、唱谱、乐器等, 测了一圈, 发现 引流效果还不错, 流量的问题前期基本上可以按这个跑了。\n\n产品这里是我\
    \ 要重点 说的, 做银发 赛道的知识 付费, 最重要的是 了解用户, 不同的 课程大纲, 售卖结果可能天壤之别。\n\n我累计和不少于几千名用户深度沟通过,\
    \ 比如最开始我追求详情页设计优美、小鹅通装修美观、海报精致等, 后来发现这帮人根本不在乎这个。\n\n他们报名课程最看重的是体验课的内容、老师的水平是否让他们认可、服务是否让他们满意,\
    \ 以及未来长期课是否能下载、永久回看等。\n\n甚至有几次我做AB测试，一个淘宝找人花了1000设计的详情页，居然没打过我用懒设计10分钟搞的一个绿背景，一堆大字堆叠的长图。\n\
    \n(相对品牌,很多用户更在乎能下载和时效)\n\n你好书友\n\n您是想延长点有效时间吗\n\n![](img/9291edba57e97d5c0b2faf030456313c_365_0.png)\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_365_1.png)\n\n六十多岁的人,看内容很多,因其它啥事耽误一段时间也有可能,没跟上听直播,看录屏也行,总想多听听老师声音,放宽年限不行吗？\n\
    \n可以的,给您多安排几年的时间\n\n有特殊情况的话\n\n理解的\n\n所以，切记不需要产品多么华丽，你只要多和你的用户沟通，了解需求，定好课程形式，是需要录播\
    \ + 直播，还是全直播、全录播，然后定价，售卖，就完事了\n\n大体的思路没问题，剩下的就是执行过程中不断优化和调整了\n\n除了常规的知识付费类目外，在举几个我最近见到的一些团队在做的例子;也是我最近深度调研的方向\n\
    \n- 老年家政\n\n大家都知道家政市场很大，这几年发展也很好，咱们的圈友也有做的很优秀的，目前由于老年家政主要是子女给父母下单的，服务内容比如：打扫卫生、做营养餐、测血糖、擦湿疹药膏、陪同散步聊天、陪同看病煎药等\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_366_0.png)\n\n打法等同云家政的模式，只不过获客模式和方向上有所差别，大家可以看看天鹅到家上关于老人的服务已经订单量很多了，只不过服务项还有些单一\n"
