    近几年，网上崛起了一大批网红中老年银发 IP，最广为人知的就是时尚奶奶团，目前全网粉丝已超过 1500 万；全国有超过 200 万人住在养老机构里，从进入养老机构开始就需要初阶评估，签订入住契约、合同，通过评估结果实施不同等级的服务，这里面存在着很多新兴的机会……中老年是个非常大的市场，所有行业都会因为中老年人再做一个细分。


    接着，介绍一下我自己，我留美七年，今年初刚刚回国在做养老院的产品策划。我本科是 UC Davis 景观建筑专业，研究生在 USC 南加大念了老龄服务管理专业。


    本篇内容，我想给大家分享的更多是一个大趋势关于老龄化的现象以及伴随着现象带来的新机遇的话题，也希望有更多有爱的人加入到中老年行业里，在创造商业价值的同时，给世上千千万万的老年人，传递一种中老年人美好的生活方式的可能性。


    --- 正文 ---


    很多人问过我一个 90 后的小姑娘，怎么会想着去做养老？


    其实纯属偶然一个机会，我暑假回国陪朋友一起去帮她给她爷爷考察养老院，那个环境我到现在都印象深刻。所有的画面都变成了几个印象：昏暗，悲伤，一个大写的不开 心。在里面的爷爷奶奶不开心，工作人员不开心，进去参观的人也不开心甚至有写压抑和难过。


    我一看就下定决心一定要做出一些改变，这不是我所期望的老年人的生活，我也不希望任何人是在这种氛围中度过自己的晚年。于是就选了这个老龄服务管理专业就读。


    文章分为三个板块:


    - 一、老龄化趋势

    - 二、人口老龄化带来的新机会

    - 三、银发经济


    ## -01-


    ## 老龄化趋势


    - 老龄化成为全球国家面临的重要民生问题之一，继欧洲和北美洲后，东亚的较高老龄化速度将助推其成为下一个“重老龄化”地区。


    继欧洲和北美后，东亚是全球老龄化最快的地区之一，人口预测显示，到 2030 年左右，东亚 65 岁年龄以上的人口将超过 10-25 岁的人口群，中国将在 2030-2035
    年间实现老龄人口大于新生一代人口。


    而我国人口老龄化态势严峻，面临着更为复杂的问题:


    - 老年人口绝对规模大，发展速度快，中国是在崛起过程中是除日本外的老龄化速度最快的世界人口大国，应对人口老化的时间安排要求更为紧迫。

    - 存在“长寿不健康”现象，我国老年人 平均健康余寿比发达国家低 10 岁左右；同时， 实际退休年龄只有 53.3 岁，加之“未富先老”，这使得我国在同等老龄化水平下，
    面临着比发达国家更沉重的养老、医疗和照护服务压力。

    - 高龄、独居空巢、失能半失能等弱势老年人快速增加，养老照料供求缺口巨大。

    - 发展不均衡。人口老龄化水平城乡倒置，农村人口老龄化程度始终高于城镇。区域常住人口老龄化呈现出东部放缓、中西部不断加快的态势，随着中西部青壮年人口向东部流动，这种态势还将进一步加剧。


    ![](img/9291edba57e97d5c0b2faf030456313c_116_0.png)


    - 中国七普人口数据分析（老龄化趋势）


    2021 年 5 月 11 日，国家统计局发布第七次全国人口普查公报（以下简称七普）。此次人口普查的调查研究对人口和人口结构对经济发展具有重要的意义。


    此次人口普查的调查时间为 2020 年 11 月 1 日至 12 月 10 日，以 2020 年 11 月 1 日零时为标准时点，对我国境内的自然人以及在境外但未定居的中国公民，逐户逐人进行了普查登记。


    人口普查是全面查清国家人口数量、结构、分布的重要途径，中国目前为止进行了七次人口普查，分别于 1953、1964、1982、1990、2000、2010、2020
    年进行。在现行统计制度下，人口普查每 10 年开展一次，尾数为"0"的年份为普查年度，其余年份进行人口抽样调查，其中尾数为"5"的年份进行规模较大的 1%
    人口抽样调查，也称为"小普查"。


    需要注意的是，人口普查与抽样调查的统计方法不同。人口普查以全体目标人群为调查对象，而人口抽样调查的数据利用抽样比推算获得。相比之下，人口普查不存在抽样误差，漏登率更低，数据更为准确。因此，根据普查结果修正中间年份的历史数据亦是人口普查的重要意义之一。


    我这次会从人口规模、年龄结构、城乡结构、区域结构和人口素质等方面对七普数据进行研究，分析中国人口变化的五个趋势，以及由此带来的对经济的影响和市场机遇。


    首先有个事实：


    人口老龄化是今后较长一段时期我国的基本国情，这既是挑战也存在机遇。


    中国人口变化趋势可以用"一慢四快"概况。


    - 人口增速放慢


    ## 图 1 中国历次人口普查总人口及人口年均增速


    ![](img/9291edba57e97d5c0b2faf030456313c_118_0.png)


    数据来源：国家统计局，Wind，毕马威分析


    而**生育率较低**是人口增长放慢的主要原因。


    历史上，中国**三次婴儿潮**分别在**建国初期、1962-1973 年左右、1986-1990 年**左右出现，出生人数的波动存在明显的周期性，但由于**实施计划生育政策**，第四次婴儿潮并未在
    2010 年左右出现，且 15-49 岁育龄妇女人数在 2011 年达到约 3.8 亿的顶峰后持续减少，使 **2010 年后**出生人口直接进入下行区间。


    生育政策逐渐放宽使出生人口短期上升，继“**双独二孩**”、“**单独二孩**”于 2011 年、2013 年相继放开后，2016 年中国放开“全面二孩”，在
    2016 年、2017 年出生人口大幅增长至 1,883 万和 1,765 万人，二孩占比由 2013 年的 30% 左右升至 2017 年的 50% 左右。


    随着**此前积累的存量释放**，2018 年以来出生人口回落，但出生人口中的二孩及以上孩次占比在 2019 年仍高达 59.5%，“**二孩效应**“放缓但仍在延续，使得
    2020 年 0-14 岁少儿人口占比较 2010 年回升 1.4 个百分点。


    ## 图2 出生人口数量，百万人


    ![](img/9291edba57e97d5c0b2faf030456313c_119_0.png)


    - 老龄化加快


    根据七普数据，我国劳动年龄人口的比例和绝对量都出现下降。


    ## 图3 历次人口普查中各年龄段人口数量占比，%


    ![](img/9291edba57e97d5c0b2faf030456313c_119_1.png)


    数据来源：国家统计局，Wind，毕马威分析


    我国老龄化现象加重，并呈现出三大特点：


    ### 1）人口老龄化加深且规模庞大：


    “七普”数据显示，我国 60 岁及以上人口有 2.6 亿人，比重达到 18.70% ，其中 65 岁及以上人口 1.9 亿人，比重达到 13.50% 。


    按照国际通行划分标准，当一个国家或地区 65 岁及以上人口占比超过 7% 时，意味着进入老龄化；达到 14% ，为深度老龄化；超过 20% ，则进入超老龄化社会。我国正处于属于轻度老龄化阶段。


    ### 2）从国际比较来看，中国老龄人口规模也非常庞大：


    65 岁及以上人口数量大于美日德法英韩 6 个主要经济体之和。


    ![](img/9291edba57e97d5c0b2faf030456313c_120_0.png)


    ### 3）未富先老：


    从经济发展水平来看，2020 年我国**人均 GDP 为 10,504 美元**，而日韩达到相似老龄化比例（65 岁及以上占比 13.5%）的时间分别为 1993
    年、2016 年，当时其人均 GDP 分别为 35,766 美元、29,289 美元，远高于我国目前水平，中国正面临未富先老的现象。


    而老龄化进程也是明显加快：2010 至 2020 年间，我国老龄化进程明显加快，与六普相比，60 岁及以上和 65 岁及以上人口占比上升速度分别加快了 2.5
    和 2.7 个百分点。


    相比之下，六普相对于五普，65 岁及以上人口占比幅度仅提升 0.5 个百分点。据世界银行数据，2008 年后我国老龄化速度明显加快，2017 年增速超过日本，目前在主要经济体中增速仅低于韩国。


    ## **图 6 主要经济体65岁及以上人口占比增长百分点**


