    # 2、从沉淀端来讲,中老年群体的线上用户特征'
  - '[PAGE 154]


    流量端大概的成本有个数之后，沉淀端也就是用户池以及活跃用户有什么特征


    中老年用户是极其没有被互联网满足的一波人，目前大部分适老化产品只是一些功能和使

    用上的提升，从深层次的用户需求来讲，可能并不多


    这里分享一个我之前针对普通用户(未付费)和付费用户(购买过教育产品)的调研总结


    +   1、大部分中老年用户（60%及以上）是和子女或更多成员一起生活，也就是说，遇到不会使用的电子

    产品问题，可以依靠其他成员解决；


    +   2、运动、读书、烹饪、唱歌、摄影是中老年人最喜欢的5大兴趣；


    +   3、大部分用户（70%及以上）每天会花至少1小时在自己的兴趣爱好上；


    +   4、使用网络搜索兴趣爱好已经成为习惯，并且会关注兴趣爱好达人；


    +   5、大部分用户（80%及以上）每天会花至少30分钟在网上浏览兴趣爱好；


    +   6、一半的用户比较有意愿秀自己；


    +   7、大部分用户（70%及以上）喜欢在网上社交认识朋友，基本没有用于陌生人社交的APP；


    +   8、一半用户在网上学习过，觉得比较靠谱，但是愿意付费的仅占25%；


    +   9、普遍接受300元以下的课程付费；


    +   10、喜欢玩游戏，70%的用户都玩过休闲类小游戏；


    +   11、对大品牌忠诚度不高，更相信自己的体验、感受、服务质量；


    这里有一点，中老年爱分享，大家可能了解美篇，美篇开始也是满足了用户爱分享和自我表达

    的需求，就好比大多数父母喜欢给子女转发文章是一样的，她们是很需要自我表达以及社

    交满足 的需求的'
