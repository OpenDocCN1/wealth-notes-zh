    这是我今年4月份体验过的一个训练营模式,之所以这么久还记得,这里不得不重点说一下他们的模式,他们是免费体验营(社群),转化的是温元艾的工具包(12根温元艾),赠送实战班课程,客单价498元这个还是挺有意思的,梳理下流程是这样的


    社群体验课(开营是直播课,平时的课有录播有直播)-体验过程中会让购买价值58元的艾灸包(信任第一次,付出沉默成本)-继续上课打卡(强化体验)-最后推付费的时候,宣布2998的温元通脉灸实战班免费学,并开放拼团购工具包,工具包会送实战班免费学名额,价格498-568元这样,然后包含使用的温元艾等等,还会有一些超级赠品促进转化,比如讲义、艾灸架等等


    我之所以印象很深,一是他们的模式,二是整个过程运营很温和,最多就是群内植入了一些水军,但是不会私信很强烈的卖,私信的内容还是用户价值为主,提醒课程回看,发每天的秘方,最后会才会发活动的拼团等,三是我4月加的他们工作人员,到现在还会每周至少两次私信我,通知不同的公益课程和活动


    值得借鉴的点:在用户不理解或者没有对知识付费习惯的时候,知识免费,卖过程中**用到的工具**,那么换到其他用户对知识付费没概念的领域,有没有可能知识免费、**服务收费**(点评、监督、行动等),工具收费等,值得思考.'
