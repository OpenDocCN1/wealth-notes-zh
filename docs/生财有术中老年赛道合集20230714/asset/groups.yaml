    \n![](img/9291edba57e97d5c0b2faf030456313c_176_2.png)\n\n![](img/9291edba57e97d5c0b2faf030456313c_176_3.png)\n\
    \n作为生财里的小透明，分享我自己的一点运营心得，希望给同样还在纠结要不要下海的你一点帮助。\n\n# 一、视频号起号步骤\n\n## （1）了解视频号平台属性\n\
    \n想要在任何⼀个平台拿到成绩，熟悉平台规则是第⼀步。\n\n视频号是⼀个“场”，在视频号活跃的用户是“⼈”，选择在视频号买卖交易的商品是“货”，满⾜基本的人货场，接下来我们要了解活跃在视频号这个场中的主要⼈群是什么。\n\
    \n### ① 视频号用户属性\n\n视频号的用户属性根据视频的传播方式，将其分为 2 类：\n\n1. 当视频主要传播形态是通过转发朋友圈、微信群、公众号、朋友点赞等好友关系裂变形式传播的时候，视频号的用户人群就等于微信的人群。\n\
    2. 当视频主要传播形态就是在视频号体系内的【推荐】专栏的时候，视频号的主要人群就成了三四线的老年为主，一二线老年为辅，然后才是中年人、年轻人...\n\n\
    明确视频号的真正活跃人群为——三四线中年年用户群体，他们是视频号内容消费的主要活跃者，通过视频号【推荐】专栏获取公域流量推荐，0粉也可以出现爆款视频。\n\n\
    # 当你65岁的时候，\n你30岁的领导在开会\n\n![](img/9291edba57e97d5c0b2faf030456313c_179_0.png)\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_180_0.png)\n\n### ② 视频号内容属性\n\n视频号平台内容类型的喜好度，主要还是偏泛娱乐为主，符合中老年用户群体的情感视频，对画质要求普遍不高，制作难度也比较低\n\
