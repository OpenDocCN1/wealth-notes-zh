    # 1、从流量端来讲，中老年市场的大概现状？


    我的思路是，做一门生意，如果不提前算好流量的获取成本、难易程度，那么后面会很痛苦的，所以先看下这个领域的流量端情况


    银发经济这个词，可能大家经常能听到，我先来分享一些最近看到的数据，大家感受下中老年群体的整个市场情况'
  - '[PAGE 152]


    近年来我国老年人口的数量和比例上升幅度是大幅度的上升。截止2019年末，全国60周岁及以上老年人口数量达到25388万人，相比2018年增加439万人，占人口的18.1%，其中65岁及以上老年人口数量为17603万人，相比2018年增加945万人，占总人口的12.6%。根据2020年10月的数据更新最新情况。


    ![](img/9291edba57e97d5c0b2faf030456313c_152_0.png)


    这些数据都是2013年起，每年中国60+老人增加800万-1000万。另外，2022年起，我们逐渐的从1962-1973年出生的14年的婴儿潮（出生人口>2000万）人年龄入60岁，因此会更多。根据数据预测，80后一代的这20年将会迎来最严重的老龄


    也就是说，目前每年大概1000万左右的增速,2022年起增速会更快,而这里的数据是60岁+人群,那么如果年龄放宽到50岁+或者55岁+,可能数据起码翻倍吧


    +   1. 腾讯曾在2015年的业绩报告里提到：截止2015年第一季度，微信每月活跃用户达5.49亿，其中50岁以上的用户占比约为2.3%，也即1263万中老年用户。


    +   1. 然而，到了2018年，微信中老年用户数量陡增。微信数据显示，截至2018年9月，微信55岁至70岁用户达到6100万。三年增长了接近4倍。


    +   1. 如今，尽管微信并没有公布老年用户数量，但其在国内月活已经超过11亿，是公认拥有最多中老年用户的平台。


    这里这个数据,可能更能直观的看到微信体系内的用户体量,以及增速


    这里可以看到,微信体系内,2015-2018年,55岁-70岁用户量为6100万,三年增速是4倍,那么我们 现在在2021,我不知道有没有最新数据,大家感兴趣的可以自行查找,按照整体的预估,1.2-1.5亿用户量是有的,这个数据大家可能没什么感觉,这样,我给大家对比一下儿童领域可能大家就更清楚了'
