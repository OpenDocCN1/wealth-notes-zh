    \n## 【招徕定价】\n\n招徕定价顾名思义，用低价来吸引顾客到店消费；低价只是一个手段，而到店是一个目的，最终带来其他商品的销售是最终目的；\n\n在我的身边就经常发生这样的事情：今天老妈看到一家超市面包有活动，“买二多一”，然后老妈就叫着这园里的张姨和李婶一起结伴而行，后来的时候，你会发现他们的购物车里是满满当当的，而不只是买了价格便宜的面包；\n\
    \n在打开他们的购物车，你会发现里面有很多不是很便宜的商品，所以可以看出来，大妈们不是单单喜欢低价，而是在乎的是一种心理平衡，在买面包的事情上自己是沾便宜的，那么在买猪肉的时候，就不在乎多个块八角了，毕竟还有心理定价的个性化不同；\n\
    \n从商家的角度来看，需要思考的是如何选择招徕品，可以让大妈们情不自禁的吆喝身边的好友一同到店，就算只是买面包，至少会起到聚集人气的效果，从众心理就会发挥作用了。\n\
    \n我是加入生财第172天的麒麟，有幸一路前行\n\n木头也温柔：这个思路的出发点是从小城市包围大城市么？个人对大妈的了解是，小城市的大妈可以起到从众效应，大城市我就不了解了。个人认为大城市的大妈从众效应，从相亲这个点出发会更好。仅为个人拙见。\n\
