    按我国的城镇率,当时2017年,城市内0-6岁的儿童家庭大概4000万,自从2016年二胎政策放开之后,整个儿童教育市场有多火热可能大家都知道,就不过多阐述了,举个例子当时我们做幼儿英语启蒙,光英语这个品类,能查到的竞品公司大概有300多家.


    而现在中中老年线上教育、知识付费、或者平台型的公司,大家能数上来的可能也就快乐50、美好盛年、乐活课堂、银铃书院、退休俱乐部、网上老年大学、乐唱族、红松学堂、家游学院、樊登年轮学堂、墨池、快乐老人大学、糖豆、美篇、桃有木等等几十家


