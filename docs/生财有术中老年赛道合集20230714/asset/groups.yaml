    如同老年人日间照料设施，辐射范围为全社区的长者，可提供日间照料，居家上门，康复治疗，文化娱乐等服务，也有一些社区型机构会设置少量床位（几十床），为长者提供长托、短托和临托服务，床位设立是创收的基础，而入住率对机构来说是营收的最关键指标。


