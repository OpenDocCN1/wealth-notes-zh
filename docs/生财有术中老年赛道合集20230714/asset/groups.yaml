    下面的数据是最近一个月抖音直播带货排行榜前十五里面几个具有代表性的账号的粉丝数据，比如知名的小杨哥，东方甄造之类的，核心购买力人群都集中在31-40这个年龄段，唯一特殊的就是新疆和田玉老郑的账号，排名第三，一个月销售额1亿左右，50+以上的粉丝，占比近一半。


    一边是一些头部大号涉及老年人消费很少，一边是个别账号，老年人消费数据客单价，利润都很不错，造成这两个极端的原因在哪里呢？


