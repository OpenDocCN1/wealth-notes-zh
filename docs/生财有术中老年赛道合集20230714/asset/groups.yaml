    \n## (52 赞) 分享两个中老年市场对于我们个人(小团队)的机会\n\n作者：渔火\n\n日期：2021-11-10\n\n大家好，我是渔火，一名在路上的创业者！\n\
    \n最近很多朋友找我了解中老年的市场，以及讨论一些看法，我是 **2017** 年大学毕业，投身到幼儿在线教育，后在 **2020** 年副业做的中老年市场，本着和这两波比较有特点的用户打了不少交道以及做过很多次调研，给大家分享一下我的看法以及我个人觉得的一些机会，希望对圈友们有所启发！\n\
    \n先总结一下，按照挑选一个项目最基础的三个模型入手，我将按以下几块内容给大家简单介绍一下\n\n- 从流量端来讲，中老年市场的大概现状\n- 从沉淀和变现端来讲，中老年群体的线上用户特征\n\
    - 中老年市场对于我们个人{小团队}的两个机会方向\n\n### 1、从流量端来讲，中老年市场的大概现状？\n\n我的思路是，做一门生意，如果不提前算好流量的获取成本、难易程度，那么后面会很痛苦的，所以先看下这个领域的流量端情况\n\
    \n银发经济这个词，可能大家经常能听到，我先来分享一些最近看到的数据，大家感受下中老年群体的整个市场情况\n\n近年来我国老年人口的数量和比例上升幅度是大幅度的上升。截止\
    \ 2019 年末，全国 60 周岁及以上老年人口数量达到 25388 万人，相比 2018 年增加 439 万人，占人口的 18.1%，其中 65 岁及以上老年人口数量为\
    \ 17603 万人，相比 2018 年增加 945 万人，占总人口的 12.6%。根据 2020 年 10 月的数据更新最新情况。\n\n![](img/9291edba57e97d5c0b2faf030456313c_152_0.png)\n\
    \n这些数据都是 2013 年起，每年中国 60+ 老人增加 800 万-1000 万。另外，2022 年起，我们逐渐的从 1962-1973 年出生的 14\
    \ 年的婴儿潮（出生人口>2000 万）人年龄入 60 岁，因此会更多。根据数据预测，80 后一代的这 20 年将会迎来最严重的老龄化\n\n也就是说，目前每年大概\
    \ 1000 万左右的增速，2022 年起增速会更快，而这里的数据是 60 岁+人群，那么如果年龄放宽到 50 岁+或者 55 岁+，可能数据起码翻倍吧\n\
    \n- 1. 腾讯曾在 2015 年的业绩报告里提到：截止 2015 年第一季度，微信每月活跃用户达 5.49 亿，其中 50 岁以上的用户占比约为 2.3%，也即\
    \ 1263 万中老年用户。\n- 2. 然而，到了 2018 年，微信中老年用户数量陡增。微信数据显示，截至 2018 年 9 月，微信 55 岁至 70\
    \ 岁用户达到 6100 万。三年增长了接近 4 倍。\n- 3. 如今，尽管微信并没有公布老年用户数量，但其在国内月活已经超过 11 亿，是公认拥有最多中老年用户的平台。\n\
    \n这里这个数据，可能更能直观的看到微信体系内的用户体量，以及增速\n\n这里可以看到，微信体系内，2015-2018 年，55 岁-70 岁用户量为 6100\
    \ 万，三年增速是 4 倍，那么我们 现在在 2021，我不知道有没有最新数据，大家感兴趣的可以自行查找，按照整体的预估，1.2-1.5 亿用户量是有的，这个数据大家可能没什么感觉，这样，我给大家对比一下儿童领域可能大家就更清楚了\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_153_0.png)\n\n按我国的城镇率，当时 2017 年，城市内\
    \ 0-6 岁的儿童家庭大概 4000 万，自从 2016 年二胎政策放开之后，整个儿童教育市场有多火热可能大家都知道，就不过多阐述了，举个例子当时我们做幼儿英语启蒙，光英语这个品类，能查到的竞品公司大概有\
    \ 300 多家.\n\n而现在中中老年线上教育、知识付费、或者平台型的公司，大家能数上来的可能也就快乐 50、美好盛年、乐活课堂、银铃书院、退休俱乐部、网上老年大学、乐唱族、红松学堂、家游学院、樊登年轮学堂、墨池、快乐老人大学、糖豆、美篇、桃有木等等几十家\n\
    \n那么这么来看，无论是什么业务形态，是工具形、流量型、轻课、重服务、TO C、TO B 可能都是有很多机会的。\n\n至少在行业初期，流量是便宜的，我之前测试过的公众号投放，最便宜的时候书法垂直类的进群（测试下来，这波用户先进群后加好友比先加好友更便宜）是十几块，那么非垂类的老年市场可能会更低，抖音、快手应该同样的道理，相比母婴单个用户三四五百，这个流量成本很低\n\
    \n### 2、从沉淀端来讲，中老年群体的线上用户特征\n\n流量端大概的成本有个数之后，沉淀端也就是用户池以及活跃用户有什么特征\n\n中老年用户是极其没有被互联网满足的一波人，目前大部分适老化产品只是一些功能和使\n\
    \n用上的提升，从深层次的用户需求来讲，可能并不多\n\n这里分享一个我之前针对普通用户（未付费）和付费用户（购买过教育产品）的调研总结\n\n- 1、大部分中老年用户（60%及以上）是和子女或更多成员一起生活，也就是说，遇到不会使用的电子产品问题，可以依靠其他成员解决；\n\
    - 2、运动、读书、烹饪、唱歌、摄影是中老年人最喜欢的 5 大兴趣；\n- 3、大部分用户（70%及以上）每天会花至少 1 小时在自己的兴趣爱好上；\n-\
    \ 4、使用网络搜索兴趣爱好已经成为习惯，并且会关注兴趣爱好达人；\n- 5、大部分用户（80%及以上）每天会花至少 30 分钟在网上浏览兴趣爱好；\n-\
    \ 6、一半的用户比较有意愿秀自己；\n- 7、大部分用户（70%及以上）喜欢在网上社交认识朋友，基本没有用于陌生人社交的 APP；\n- 8、一半用户在网上学习过，觉得比较靠谱，但是愿意付费的仅占\
    \ 25%；\n- 9、普遍接受 300 元以下的课程付费；\n- 10、喜欢玩游戏，70% 的用户都玩过休闲类小游戏；\n- 11、对大品牌忠诚度不高，更相信自己的体验、感受、服务质量；\n\
    \n这里有一点，中老年爱分享，大家可能了解美篇，美篇开始也是满足了用户爱分享和自我表达的需求，就好比大多数父母喜欢给子女转发文章是一样的，她们是很需要自我表达以及社交满足的需求的\n\
    \n美篇目前的数据，累计注册用户 2 亿，累计创作用户 4000 万，累计作品数 3 亿，累计上传图片 60 亿张，APP 月活跃用户 1200 万，日访客数\
    \ 2000 万。这里已经成为很多中老年项目创业者获取流量的阵地了\n\n### 3、中老年市场对于我们个人(小团队)的两个机会方向\n\n抛开大资本入场的打法，这里我说是个人（小团队、无大资本）的机会，也就是搞钱的方向\n\
    \n#### a、做工具型产品，搞流量，后面赚流量的钱\n\n这里给大家举几个我体验的例子，\n\n公众号-加画框；小程序-加画框，通过为书法、国画、油画、摄影等图像作品加框增色的工具\n\
    \n![](img/9291edba57e97d5c0b2faf030456313c_155_0.png)\n\n【笔笔意趣】\n1、中路，心静事，自叹 光，悟道\n\
    南山空洞，白石空忙，易得物换愁 光处。愁急处，因世故，几番南钱\n北征时，苦事求还远又难。向，一\n梦残。干，两般愁。\n2、观月/眉，主楼\n秋劲霜寒处，苍龙潜龙处。\n\
    草花飞尽时，曾是马归路。\n总以静为事，岂为细而容。\n园树对残光，半生归云中。\n3、七绝·立冬感思\n雨送寒（且凉）\n寒风吹断相思路，转眼人生又一 游。\n\
    雨鼓南飞刚对影，今年更比去年 多。\n4、大风歌搅句/刘邦\n大风起兮云飞扬，威加海外兮归故\n乡。\n\n156/497\n"
