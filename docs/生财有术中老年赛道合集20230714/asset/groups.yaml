    - 人口流动加快


    2020 年我国共有流动人口 3.76 亿人，**较 2010 年六普增加 69.7%**，意味着我国约每四人中便有一人为流动人口。其中，2.5 亿人为**从乡村到城镇**的流动，较
    2010 年增长 1.1 亿人，**在总流动人口中占比达 66.2%。** 反映了我国城镇经济活力正在不断提升，人才资源配置水平提高，城镇吸纳人口迁入包容度加大。


