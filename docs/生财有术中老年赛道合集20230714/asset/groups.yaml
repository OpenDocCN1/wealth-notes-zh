    ## 2、老年人市场分析


    在大家的印象里，老年人怎么可能网购呢，网购是年轻人的代名词，老年人怎么可能玩得转这些时髦的玩意。从淘宝上线到现在，差不多20年了，网购已经深入人心，感染着身边的每一个人，老年人怎么可能不动？他们的购买力没有释放出来，是有几个原因的：


    ### 1. 硬件条件制约


    最早的网购人群，大部分是上班的白领，日常使用电脑，随时随地“摸鱼”逛淘宝、网购剁手，已经是上班生活中的一部分。等智能机到了年轻人手里的时候，移动端网购那就更方便了。


    但是看看老年人这边，大部分都退休在家，家里有电脑而且会用电脑的人，凤毛麟角。当年轻人的iPhone手机一遍遍刷着物流信息的时候，老年人的手机还只能接打电话，硬件条件的制约，就限制了他们网购的第一步。


    而这几年，随着智能机、千元机的普及，老年人终于甩掉了按键手机，也步入了智能化。随着智能机进一步普及，网购在老年人中的渗透率还将增加。


    ### 2. 支付渠道下沉


    得益于支付宝、微信各种拉新、刺激消费的活动普及，才让老年人愿意接受线上支付，打通了支付渠道这个关键步骤。如果不是做这些下沉的工作，以老年人的习惯，你让他扫个码就把钱付出去，输几个数字钱就到别人手里，那是万万不允许的。


    日常买个菜，交个费啥的，他们习惯了支付，就会觉得支付也没那么可怕，不会有太大的风险，这样真正到了电商购物，线上产品还没拿到就付款，他们才会接受。


    ### 3. 购物渠道体验不同


    淘宝、京东系的图文电商购物，作为年轻人，多少年来已经习惯了。但其实和视频带货比较，差距很明显。一款产品在视频里面呈现出来的效果要更好，尤其老年人，一上来有了智能手机，就接触的是抖音、快手、视频号，哪经得住这全方位的轰炸，马上就是买买买。


    ## 3、老年消费习惯分析


    一提到老年人，是不是都有一个固有的印象：老年人舍不得花钱，特别在意价格，斤斤计较，买东西特别谨慎？


    真实的老年消费者，有以下几个特点：


    ### 1. 注重健康


    小孩怕笨，女人怕丑，男人怕不行，老人怕死。这不是营销界的至理名言，话糙理不糙。健康是老年人最大的痛点，从健康这个切入点来入手，很多东西都会容易很多。中医相关的知识，几乎任何老年人都绕不过去。一边是几千年文化的传承，一边是老年人多年实际经历的过程中感受过中医的作用，对中医内容天然就接受，天然就有好感。


    所以有这个前提，就可以卖一些中医相关的书籍，无论是经典的中医典籍，还是与日常常见病调理保健，或者是食疗养生健康类目的书籍，都可以作为销售的品类。


    ### 2. 强购买力


    老年人里面的部分人群的购买力，是远大于年轻人的，最主要的是可支配收入多。相对于中年人，房贷车贷占据大头，日常消费的金额不足，这一点从各种政策拉动内需其实都可以看出来，真正的购买力是不足的。


    反观老年人，几乎没有大额的消费，日常生活的花销占比也不算太多，这时候撬动购买力，是有真金白银可以支持到的。


    ### 3. 价格不敏感


    在淘宝、京东之类平台，消费者已经习惯了比价，这些规则已经烂熟于心，哪怕便宜5毛钱，也会开心很久，这个比价的习惯也是多年慢慢培养出来的。


    老年人接触电商，完全还是新人状态，新鲜还来不及，遇到自己喜欢的产品，还处在能购买成功就很开心的状态。搞价？比价？什么鬼？而且，很多产品，心理价格不明确。比如书籍，日常在书店买，就是标价卖，殊不知，成本就是一折左右。


    一本书该值10块还是80块，这个其实没有一个心理价格，只要觉得有用、喜欢，80也会买。他不像是卖土豆、卖鸡蛋，价格烂熟于心，应该是4块钱，你今天涨5毛钱，他立马就觉得自己贵了。


    ### 4. 错误的老年数据


    早期的老年人市场，很多类目其实是一个伪老年人市场，因为真正的用户不是老年人，而是为了老年人产品买单的年轻人，他们是老年人的子女一辈。他们的消费习惯、对产品的选择，是年轻人的需求，是他们认为老年人的需求。所以这个需求数据、消费数据，面对真正的老年人用户的时候，很大程度上是会失效的，因为他们是完全错位的。


    ## 4、老年产品如何做


    前面内容铺垫那么多，其实都是为了理清老年人这个市场怎样，老年人习惯怎么样，喜欢消费什么样的品，这是一套粗糙的方法论。


    现在的老年人市场，刚刚开始，还在萌芽阶段，是真正的一群全新的增量用户来消费，他们和以往的用户有很大的不同，他们直接跨过图文电商时代，直接进入了视频电商时代。


    针对这种情况，要有不一样的策略。如果按对年轻人的策略来思考问题，把对年轻人的一些方法拿来用，基本没什么效果，就像你做过淘宝电商，来做抖音电商，会水土不服一样。


    ### 1. 内容为导向


    老年人电商这块，因为没有前辈的数据可以参考，现在进来的很多都是在拓荒。那为了更高效率的测出好卖的品，肯定不能以产品为导向。如果先选品，再去做内容，整个过程都是猜：猜用户可能喜欢这个产品，猜这个内容用户可能喜欢，这样失败的几率极大，毕竟，大多数人都不了解老年人。


    如果从内容角度出发，效率就要高很多，因为内容是直接触达用户的，点赞、评论等等数据直接反映出用户的喜好。


    从内容中去挖需求，垂直的老年人的内容很少，因为前面提到的原因，大家都不知道怎么去做老年人变现。没法变现，纯粹的用爱发电来做内容就很现实，所以老年人内容是极度稀缺的。缺内容，那你就去填补内容，有流量一切都都好办了。


    我当时做老年人内容，第一个思路去验证就成功了。不是我运气好，是这类内容太缺了，痛点也太多了。


    **健康----中医----中医相关产品**


    比如刚才说到的中医切入点，为什么我选这个点，不选其他呢？做垂直内容，吸引精准粉丝，那你的内容就要有排他性：某个人群特别喜欢，别的人群很少关注，这样的内容才是好内容。


    你吸引来精准粉的同时，过滤掉了无用粉丝，粉丝越精准，后续的变现越好做。


    内容部分，一般是分两部分。一类是流量内容，有噱头，有话题性，同时也能引起争议的，这样的内容，停留数据会很不错，点赞、评论、转发等数据也会明显优于其他内容，尤其中老年人，遇到喜欢的内容，点击转发的热情度比年轻人大的多。


    另一类就是带货内容了，带货内容更多的是要强调出产品，内容能短就不要长，言简意赅，直击痛点即可。


    流量内容和带货内容就像线下商店的引流款商品和利润款商品一样，靠流量视频把目标用户拉过来，完后带货视频做成交。两者相辅相成，缺一不可。


    ### 2. 产品选择


    因为是内容为导向的，所以产品选择上其实是有一些局限性的，要跟着内容来，所以产品选择有一些特殊性。


    #### 1) 高客单


    一定要做高客单，不要迷信那些所谓的低价的品好卖。你卖低价品，吸引来的也是图便宜的人群，平台给你推的人群也是消费能力差的人群。


    比如中医相关的书籍，大家心理会存在一个担心：价格便宜会不会质量不好，会不会有错误？这时候，几十元的差异，在最终的消费决策中，并不会有太大的影响。


    下图是今年我的抖店一个卖的不错的单品的数据，明显可以看到，多个SKU，买3本146套餐的，占比57%，买单本59元套餐的，加起来占比42%。


    老年人有个理念：他认为值的东西，要买就买好点，要买就买全套。


