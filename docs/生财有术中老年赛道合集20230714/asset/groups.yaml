  md: "\n## ② 中老年睡眠\n\n前段看数据的时候，从国民睡眠健康白皮书我看到 40 岁以上的人群睡眠问题已经很严重了。\n\n然后我了解了下数字睡眠这个市场，已经有很多公司在做了，比如好睡眠、享睡等各种各样的\
    \ APP，还有一些和音乐助眠结合的白噪音产品等等。\n\n总之睡眠问题是复杂问题，原因很多元。\n\n### 不同年龄：年轻人熬夜多，老年人睡不着\n\n\
    ![](img/9291edba57e97d5c0b2faf030456313c_367_0.png)\n\n作为普通人，我想切入的可能有三个方向，一个是偏教程类，超低价的课程来教大家怎么使用市面上各种各样的助眠产品。\n\
    \n第二个可能是从心理、情绪方向疏导的课程。\n\n第三个可能是身体健康管理方向的课程，比如请专业的营养师规划一些晚餐或者晚上该怎么做运动改善睡眠的课程等等。\n\
    \n## ③ 中老年旅游\n\n这个通过数据的时候看到的，中老年旅游市场增速也很猛烈。\n\n那么年轻人经常会做旅游攻略，而中老年经常怕被骗，我妈就是一提旅游就怕被宰。\n\
    \n那么作为普通人，是否可以通过做中老年各种各样的定制的旅行攻略，来收取一点点服务费呢？\n\n同时给靠谱的旅行社引流是否可以赚到佣金呢？而流量端，视频号里旅游类和风景类的视频有多火，相信你去看看就知道了。\n\
    \n## ④ 中老年电商\n\n中老年电商这块相信不用说大家也知道，咱们星球不少书友都做的很好，还有卖图书的书单号等等。\n\n和几个在做的团队聊过，目前他们卖的最好的是女装和鞋，尤其是鞋，利润率很高，这块就不做过多分享了，有相关资源的朋友可以考虑。\n\
    \n## ⑤ 中老年宠物\n\n宠物赛道这两年发展很快，我觉得幼儿赛道一般有的，都可以在宠物赛道做一遍，之前看的报告，全中国每年新生儿 1000 万左右，宠物猫五千万，宠物狗也三千万左右了。\n\
    \n我调研下来，养狗人平均年龄基本上比养猫人的平均年龄大 10 岁，养狗人的平均年龄在 37 岁左右，发现了么，是不是平均年龄已经靠近中老年了，那么可想而知，中老年养宠物的人应该很多，其中我觉得应该养狗的更多。\n\
    \n那么是不是宠物赛道的打法可以试试了，我给我妈做的就是宠物账号，毕竟我妈是 1968 年生人，她自己出来讲，公信力更强，目前做了一个月是一万七的粉丝。\n\
    \n（上面是一万六，这里是一万七，因为本文写作期间，涨了 1000 粉）\n\n商品橱窗加上直播（我妈直播纯聊天，没有任何技巧，我妈在老家）每天能卖 800-1000\
    \ 宠物用品，佣金是 30% 左右，每天私信的人很多，几乎都是问各种各样养宠问题的，其实你百度就有，不过他们不会，也没这个习惯。\n\n这里面我觉得需求和想象空间很大，下一步我的策略可能不会让妈妈直播卖货了。\n\
    \n毕竟直播需要直播能力，我妈学起来困难，可能走直播引流，到私域后售卖产品再扩展一下，如果你接入 AI 是否能实现个性化的问答，“中老年的私人宠物医生”，是否能出针对中老年关于养宠经验的课程等等，篇幅问题这里也不展开了。\n\
    \n今天分享的均是我站在我的角度的思考，可能有的对有的不对，希望能对你有启发。\n\n2023 年普通人在中老年赛道的机会就分享到这里啦～有问题评论区留言互动～\n\
    \n**评论区：**\n\n- Ray \U0001F340 ☀️：我女朋友学音乐的，想教他做个人IP \U0001F929\n- 渔火：有个人技能做中老年赛道更容易\n\
    - 控心：是不是要有个人技能才好做\n- 渔火：不用吧，懂用户就行，我没啥技能\n- 阿顾：干货满满 受教了 感谢大佬分享\n- Jia：干货很多，学习了\n\
    - Jia：主要你也有输出产品的资源\n- 渔火：你没仔细看应该，比如最近电子琴和宠物方向的课是我找对应专业的大学生录的\n\n---\n\n## # (67赞)\
