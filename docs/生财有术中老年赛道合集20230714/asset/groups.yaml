    # ## 二、人口老龄化带来的新机会


    # ### 1. 养老院


    很多对养老感兴趣，准备进入这一行的人，经常会问一个问题：那就是养老院的名字各不相同，有的叫养老院，有的叫养护院，还有的叫护理院，这些到底有何区别？


    虽然市面上能见到养老院、养护院、老年公寓等种类繁多的称谓，其实在国家标准规范上，有一个统一的名称——老年人照料设施。


    根据 2018 年 10 月 1 日正式实施的《老年人照料设施建筑设计标准》（[JGJ450-2018】，老年人照料设施（care facilities for
    the aged）是指为老年人提供集中照料服务的设施，是老年人全日制照料设施和老年人日间照料设施的统称，属于公共建筑。


    老年人全日制照料设施（24-hour care facilities for the aged）是指为老年人提供住宿、生活照料服务及其他服务项目的设施，是养老院、老人院、福利院、敬老院、老年养护院等的统称。


    老年人日间照料设施（day care facilities for the aged）是指为老年人提供日间休息、生活照料服务及其他服务项目的设施，是托老所、日托站、老年人日间照料室、老年人日间照料中心等。


    当然每个人分类方式不同，从养老院产品策划角度来说，我一般喜欢按照辐射范围分为以下几类：


    **1）社区居家型：**'
