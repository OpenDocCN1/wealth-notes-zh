  md: '赚钱。您必须把您的所有精力，都投入到流量+变现图片+合作服务+合作产品上面。理解不了这个，就别出来混了。


    # 16、创业一开始，组建什么团队，

    都是虚的，不产生效益


    学员：


    公司要我在大学建立了团队。是有一个大五的师兄带我，师兄是公司股东之一，负责文案部门的。目前我们申请成立了一个社团，大学** 创业学社。我是社长。


    陈昌文：


    您先关注流量从哪里来？变现文案是怎么写的？钱是怎么进来的？ 先解决这个问题。然后保证产品质量、服务质量到位。只要您们精力不 是集中在流量+变现图片，文案+合作产品+合作服务上，您们就是在


    耍流氓。


    创业一开始，组建什么团队，都是虚的，不产生效益的。眼睛盯着 产生效益的地方，才能做大。盯着建设团队，只能亏损。


    # 17、这些人不具备创业基因，

    这公司只能散伙、倒闭


    学员：'
  merge: -1
