    人的成功跟方法、经验、帅从、指导，都没关系，跟学历也没什么关系，甚至跟智慧都无关。


    人成功的唯一法门，就是努力到无能为力，精诚至，金石为开。 一些人之所以不成功，只是心不诚而已，这是无上妙法，不过没缘分 的人听不懂。那么我们就讲方法。


