    不想再这么混着了，再混下去我就变成他们了。可是现在我很迷茫 不知道该怎么去做，没有理想没有希望，跟行尸走肉一般。希望能在这里 有些收获！


    陈昌文：


    您多听课课程，多跟赚钱的人学学。这才是您要做的。其实我这里 有很多东西，您可以学习，但是您都不去听课，也不做笔记，只会嚷嚷 迷茫，这将让您更惨。


