  md: '那么我喜欢创业吗？我喜欢做业务吗？我有特长吗？没有，我就会《魔兽世界》用盗贼偷袭，我还不敢刚正面。我智力平平，我玩了多年《魔兽世界》，依然是个弱智。


    我根本就不会跑业务，后来我去跑业务了。我不做领导了，提着一个 15 块钱的华硕电脑包，奔波在上海各大工地。我就是狗不理人。狗不理包子，人人喜欢。我这个狗不理人，人人讨厌。我又开始装孙子了。日
    日 去 工 地，与材料员、各种人套近乎，我连一包利群烟都买不起，别 说 什 么 红塔山、中华，人家看我就 不 顺眼。


    我又没有跑过业务。但是我比较奇葩，每天早上 5 点多，就去坐公 交车、走路、去工地跑业务。幸运女神眷顾我，我在第 17 天 的时候，签 订了一个 500 万的单子，后来持续签单，签了非常多的单子。


