    我认为，任何一件事，只要您真正认真，您就能做好。您踏踏实实 在天涯、微博、书籍上找牛 B 的文字，然后照着读就行了。您也可以改 编一下，也可以找同行。您找到几百个同行，不断地找优秀的文章，把
    这些文章变成自己的，然后朗读出去就行了。


    同理，您上传的平台，在百度里都能搜提到。收集到了过后呢，您 就开始去上传。每天就是这件事：找文章、录制、上传。简介里写上自 己的微信，然后有一张图片，介绍加入社群的真实好处，一个价格。就
    这样，日复一日地干，一个月内就开始赚钱，走上正轨了。


    但是，有几个人认认真真做这件事呢？


