    老师，我刚进群没几天，现在的录音，听得有点没有头绪，以前的录音还有吗？


    陈昌文：


    面对网络营销，您不可能一下子搞搞懂的。您必须三番五次地听，而且听到新的概念，不懂的，您还要在百度上搜索一下。然后，您还要有执行力、实践的能力。也就是，您必须去动手摸，动手干。


    人的成长是痛苦的、是慢的，但您必须跟着我这样去成长，我也是这样成长起来的，我也痛苦。'
