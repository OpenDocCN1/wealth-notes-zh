  md: '陈昌文方法1000问：师生问答集 1


    # 陈昌文：


    人的内功是慢慢修炼的，组织是慢慢建立起来的。


    春生夏长，秋收冬藏，鱼在这里，慢慢养，养大了，就有鱼吃。我们呢，也不是想收割粉丝，我们其实是在牧民，高手哪里是想收割粉丝，几千块算什么！


    时间长了，这些人都是我们的朋友，都是我们的师长。真正的牛人，是把粉丝养育成师长，其次是养育成朋友，再次是养成奴隶，再次是吃一口就走。


    一个粉丝的力量，就可以改变您的命运，就可以让您的阶层突变，慢慢牧。牧多了，牧久了，有了感情了，这些人的力量是无敌的存在。


    你要的是忠实的信徒，哪里是几个学员，哪里是几个学费。深入挖掘，交朋友，粉丝就是军队，就是部队，就是精英特种部队。


    我们整个社群、整个粉丝圈子，都会变得无比强大。钱要多少有多少，该您的，一分都不会少。不该您的，一分都不会多。心的境界有多高，您的舞蹈就有多美，您的世界就有多壮丽，您的收入自然水涨船高。


    您释放的温暖，阳光够多，您的粉丝自然茁壮成长。把这些粉丝圈到您的IP里、您的朋友圈，这些人又不会走。忽然之间，瓜熟蒂落，自然成单。急啥？钱多了，也没什么用，够一口吃的就行了。


