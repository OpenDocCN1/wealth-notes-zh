- pgno: 47
  md: '当老板，自己必须是推广高手，您自己必须深入学习，企图让推广高手给您推广，基本不可能，除非是合作关系，拿出大比例金钱给他。我现在采取的，都是合作模式。我不发工资，全部跟我合作，有本事自己赚钱；没本事，您走，别耽误我的时间。我就这样玩的。


    # 27、网络生意靠写文章，或者发视频，或者发语音+图片


    学员：


    员工也就三、四十个，只能是自己人。客户成交过程比较慢，一个月到一、二年成交的都有。还有很多人不接受这个行业。现在就是想如何通过网络开发些新渠道？


    陈昌文：


    所以我们的成交方法是，让客户都加我们的微信，微信号是自己在管理、更新。有 10 个微信号了，就请一个信得过的助理，跟着更新。手机、身份证，都是自己家里的人。这样，我们的客户不会丢失，员工离职也没问题。拒绝让工加客户微信，都是老板自己的微信。成交慢，也无所谓
    0 反正，总是会成交。


    网络渠道，建议您写微博，天天写，学习 seo。通过网站+微博文章，这样去霸屏百度、360 关键词，这样来的都是精准流量。对于没有耐心的人，不建议研究竞价，除非您的这个行业利润非常高，那么，我们就
    可以烧竞价。我一般建议您先仔细学习 seo,然后建立微博，通过微博去吸引流量。


    不过这些生意，都是要时间沉淀的。网络生意靠写文章，或者发视频，或者发语音+图片。每天几篇文章，几年不断，生意自然来。'
