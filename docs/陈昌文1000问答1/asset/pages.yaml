    创业者与打工者是两个物种，打工的人很难尽心尽力，出工不出力 很正常。一般，一个老板要具备 3 天之内开除不合格的人的水平。这个 招聘系统是非常浪费精力与时间的。刚开始搞互联网创业，建议您轻装
    上阵。


