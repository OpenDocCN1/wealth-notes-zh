- pgno: 109
  md: '# **陈昌文**


    1、人不需要特长，只需要干。36 循环系统，执行起来。


    2、 人本质的，也是没有爱好的。物以类聚，人以群分。您玩久一个东西，沉迷了，您就以为您爱上她了。有人爱游戏，有人爱旅游，有人爱电视剧，有人爱工作。真的有人爱工作吗？对，有，只要您天天给自己洗脑，您就会爱上工作。


    当然，我小时候，我们那里有个农民，很穷，大家说，出去打工能赚钱，他出去了。打工的时候，被老板骂了。他非常生气，就不打工了，工资也没要，胆小，走路回来的，走了几天几夜。


    后来，别人说，出去打工吧，家里种田赚不了钱，连老婆也娶不到。他后来娶了一个傻子老婆，生娃娃的时候，没保住娃娃，保住傻子了。现在老了，傻子不知道还有没有跟他，他自己是孤苦伶仃，被福利救济着。


    人家问他，为什么不去打工？他说，他喜欢种田，打死，也不想出去打工了。这其实也是一种洗脑。


    我喜欢打工吗？我不喜欢。老板、领导骂过我吗？何止骂过，简直侮辱过我，把我当畜生看，我辞工了吗？没有。我如同一条夹尾巴狗一样，继续给那个骄横跋扈的领导提鞋子、倒马桶、当狗。他自己坐车回公司，让我坐4个小时车回去，先坐公交车，后坐地铁，再转公交车。我回去了，一句怨言也没有，另外，车费不报销。


    熬了一年多。这个领导跟公司总 boss 发生了冲突，被开除了。我就翻身农奴把歌唱，老子是领导了。老子有手下啦，我也可以骄横跋扈了。小人得志，敢叫长江水倒流……从此横刀立马，唯我陈大将军。《魔兽世界》挣起来，日日游戏，夜夜笙歌，好不快活。'
