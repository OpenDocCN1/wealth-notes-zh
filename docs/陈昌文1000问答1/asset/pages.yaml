    # 123、如何自身建设和处理人际关系


    学员：


    如何自身建设和处理人际关系？


    陈昌文：


    为了慎重回答您这个问题。我思考了很久，并结合我自己的经历，给您讲一讲，我力求给您最真实的答案，希望能帮助您。


    一、我家庭出身不好，没什么钱。我唯一的厉害之处，就是小时候读书很厉害。我也什么都不懂，后来我去了一个公司打工，看了一本 书《论语》，是南怀瑾先生写的，我越看越觉得牛
    B。后来，就把《南 怀瑾选集》的所有书籍反复看了至少 3 遍。特别是《论语别裁》，我看了至少 13 遍。这改变了我对社会、世界、人性的认知。


    那几年虽然很穷，但我觉得，自己跟普通人不一样。


    其实我读初中的时候，就觉得自己跟普通人不不一样。我跟我同学 一 起讲理想，我说我的理想是世界三巨头，丘吉尔、斯大林、罗斯福。


    这里，我总结出来，自身建设的第一点，就是理想远大。您可以去 看一些名人的言行、事迹，这样，您就会树立远大的目标。


    第二点、就是一定要多读书。


    读书一开始，并不能改变什么，但是您有了知识。有了知识，就有了力量，知识就是力量，这种力量是隐形的，虽然看不出来，但很有效果。


    有了知识，您就有了机会，或者说机会多了起来。


    但其实，您做好了远大目标+多读书，您依然可能非常贫穷，赚不 到钱。那么真正有用的是什么呢？


    就是一门专门用来赚钱的技能或者绝活，甚至口才，写文章也行。 总之，您'
