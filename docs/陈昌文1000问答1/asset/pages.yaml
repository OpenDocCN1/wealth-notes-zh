  md: '断地学习、研究先进的发制、做流量的方法。这些方法每天只能研究 20 分钟，研究时间长了，您就不干活了，就变成白痴了。


    每天不研究，您也很难进步。我们孙总是天天都研究、天天都实践的，只有这样，才有流量。


    您想要赚钱，您必须认真、认真、再认真，我说的东西，您即便是不懂，也要去探索。您可以在某宝上买到教程，我私下里也会教您们一些招式。我希望能你们认认真真对待社群营销。


    对了，您们都去找个律师，咨询律师，避免被人诬陷。我们社群里的每个人，都必须有律师保驾护航，这是做网络生意必须要做的工作。


    # 5、人的成长是痛苦的，是慢的


