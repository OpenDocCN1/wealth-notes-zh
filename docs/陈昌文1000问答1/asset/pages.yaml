    陈昌文：


    最犀利的，就是找个项目直接干起来。


    吸粉丝，然后用图片做变现。只有不断地搞营销、赚钱，才能让您 蜕变。只有有耐心，不怕辛苦，认认真真干活，踏踏实实做事；须有每天收集几十个同行，不断地复制别人的朋友圈，杂交别人的朋友圈；只有认认真真地模仿高手，去行动、赚钱，并且与高手分工合作，让高手帮您搞定售后，您只管做流量、收钱。这个模式玩起来过后，您也就迅速赚钱了。


    记住，行动才是一切，不行动，都是意淫。


