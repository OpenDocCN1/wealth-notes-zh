    # 35、为什么公司要有一个微信号、QQ号


    学员（内部讲师）：


    对很多传统企业来说，很多流量都是被浪费掉的。微电商时代，把流量导入到个人微信，通过高质量朋友圈持续影响，把丢失的流量捡回来，并使之成交。


    陈昌文：


    为什么要玩微信？ QQ?也就是这些工具可以持续营销，持续更新照片。公司要有一个微信号、QQ号，所有的流量都导入到这个微信号、QQ号。然后，有一个专业的写手，如此，您才可能持续出单。


    # 36、创业最怕贪大


    学员（内部讲师）：


    目前国内小微企业的平均寿命是 3 年，创业的路本来就不好走，再加上首次创业缺乏经验，所以失败率应该在 95%以上。


    陈昌文：


    创业最怕贪大，不计成本地扩大规模，是很多人失败的根木。不过，通过微 商模式，不出钱，只找合作者、创业者，这种模式，失败的几率小。因为基本只 有进账，没有什么亏损。'
  merge: -1
  img_proc: true
