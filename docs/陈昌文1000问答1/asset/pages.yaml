    \n 您们请的那种人来发帖，只是混日子而已，离赚钱这条道还远着。 建议您们这种传统企业家就是做个网站，天天写文章，然后研究 seo.搞 搞微博，搞搞自己的私人微信号，这是您们最好的出路。\n\
