- pgno: 49
  md: '想要卖东西，首先卖自己。只发产品图片、收款图、效果图，是愚蠢的，您必须有知识、有文化、有 IP。您必须是一个活生生的人。您必须是有思想的，能理解什么是文化，能带领别人获得精神上升华的人，才能卖好产品或者服务。


    推广？抖音就行了，或者语音平台就行了。有了流量，啥都能卖出去，贴吧也行啊。不知道您的智力是不是能理解我在说啥。有些人，一辈子只适合干苦力，这些人，我们都是采取放弃的态度，不敢教育。您多说几句话，他们就会去告您。有些人有慧根，他们知道我们待他们好。


    总之，孩子，找律师咨询您的业务模式，不要违法犯罪。然后，多理解理解什么是 IP 营销吧。


    # 30、没有具体的方法论+具体的行动，您就去打工吧


    学员:


    > 陈·老大，中午好，我是你的铁杆粉丝，我想请教个问题，我刚接触贴吧，我想直接抄袭 xx 的帖子去发，会不会有事啊，不懂法律这块，您有时间的话，还请帮忙解惑，谢谢!


    陈昌文:


    > 要有改编的能力，不能直接抄袭，要有付费学习贴吧技术的思想。反正，不管您到哪里去搞流量，都必须要有学习思维。只要您有学习思维，您愿意学习如何做流量、愿意执行，然后天天聚焦在一件事上，我相信您能做起来。


    > 您必须相信具体的方法论，并且执行具体的方法论。没有具体的方法论+具体的行动，您就去打工吧。有具体行动+具体方法论的人，做微商课程推广，只要一个月，就开始赚钱。


    > 无具体行动+具体方法论的人，去打工。'
