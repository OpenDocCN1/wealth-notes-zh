  md: '了，终身受益；不学，也无所谓，这都是您自己的事情。您过得好不好、收入高低，也跟我无关。我写点文章，搞点课程，我的收入就更高了。没错，我懒得拒绝您、说服您，因为那会浪费我的时间。我就真对您的问题，写篇文章，那会给我带来更高的收益。所以，我对您爱理不理，压根忽视您的存在。因为，您的穷富跟我真的无关，您自己判断即可。


