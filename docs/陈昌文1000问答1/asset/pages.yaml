  md: '# 11、这个世界上，没人是自由的


    学员:


    我们村里有个前首富，富了 40 几年，每天都是下苦功夫做事，资产 也有几个亿，以前别人打牌或不认真工作，他都会骂。后面年纪大了， 一个人教他做投资、玩股票，刚开始赚了一点钱，后面他就把主业荒废了，
    全身心玩投资，2年时间，把整个资产全部败光。


    一个人要坚持做一辈子真的好难，曾国藩、稻盛和大夫这些人是得道 之人吧。


    陈昌文:


    有些人下苦功夫赚到了钱。然后碰见江湖大师，讲不用下苦功夫就 能赚钱，还能打造管道、财富自由，他们就开始做黄粱梦了，就去当绿 油油的韭菜了。


    这个世界上，很多年轻人说他财富自由了，这都是装的。抖音上宣 传财富自由的，大多数都是装的。任何人，都不会自由。这个世界上， 没人是自由的。到了不同平台、不同阶段，身价不一样，玩法不一样，
    消耗不一样。


    国王都不会财富自由，国王破产的多着呢，何况一个商人！人有七 情六欲，这是个婆婆世界，就是来受苦的，搞什么财富自由？可以不做了？ 要唱永恒之心啦？都是些庸人。人在任何时候都会面对无常之苦。世界
    是无常的，连这个都理解不了。只有线性思维的人，才以为自己自由了， 搞笑呢！黑天鹅随时准备起飞， 这不，这次就来了一只黑天鹅，有些财 富自由的人遭了吧？


