  md: '# 陈昌文：


    任何人都喜欢这种生活，任何人。


    我告诉您吧，北上广深一栋豪宅，5000 万到一个亿，上下两层，或者 3 层，一辆豪车，算 800 万吧。一个司机、一个保姆，闲来读书、喝茶、看报、晒太阳、游泳、健身，无丝竹之乱耳，无案牍之劳形。谈笑有鸿儒，往来无白丁，有红酒添香，有美人醉舞，晚上睡觉，有美娇娘入怀。早上起床，有闲妻穿衣、穿鞋子。去厨房吃饭，大小点心都让你满意。下午还有个按摩的小姑娘给你按摩。闲来无事，高尔夫、酒庄走一走。看日落西山，听琴一曲……


    嗯，您不缺钱，就去吧，就这样活着。任何人，都希望这样过。只是，您配吗？这是神仙般的日子，大富大贵还无事可做。精神上与身体上的 极度愉悦，这是天人境界。有这等生活，给个皇帝都不换。


    此等境界，只是那些有才华的古人的乌托邦，向往而已，从古至今，做到这样的人，极少，甚至可以说无。


    庄子倒是达到了意境的新境界，只是去找了监河侯借粮。好日子，谁不向往？我觉得，您处在社会最底层的思维逻辑里。孩子，人间一阴一阳，想过好，就得付出。我们最多能打造半边天，这半边天，就是闹里取钱，静处安身。这天，还有白天与黑夜呢。您信口雌黄，就想过这等神仙日子？您配吗？


    如果有钱？您能守得住财富？开国际玩笑。


    创业难，守业更难，听说过？能守住财富的，才是大神。也就是说，要过上这等诗情画意生活的人，都是超级智慧之人。而智慧的形成是因为 为坎坷。'
