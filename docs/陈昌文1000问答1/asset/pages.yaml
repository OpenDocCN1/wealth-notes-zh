  md: '陈昌文方法i。。。问：


    我们团队目前有 3-8 个人，因为我目前需要学习管理能力，所以有 些人不是很听话，然后安排的事情也不能够很好的做好。我也不能够帮 助到他们。我问他们有什么
    问题，他们也不说。怎么解决呢？老师。


    陈昌文：


    解决不了。这是一个创业陷阱。


    很多创业者，开始没经验，以为人多好，成天去管理这些人，研究 这些人。然后烧钱、烧时间，最后倒闭，这是最愚蠢的行为。


    开始的时候，您只能管理您自己，您自己能见到利润，然后慢慢再 搭建听话的人的团队。一开始乱拉人，拉进来一些根本不具备拼命工作、 竭尽全力死磕的人来创业，就是死路一条。也就是，您拉的这些人，就
    是普通打工仔。这些人不具备创业基因，这公司只能散伙、倒闭。


    龙生龙，凤生凤，老鼠生的儿子会打洞。这开始的创业团队里的人， 基因不对，结果就不对。创业人与打工仔完全是两种人格、性格、态度， 不可调和，如肉食动物与草食动物一样。


