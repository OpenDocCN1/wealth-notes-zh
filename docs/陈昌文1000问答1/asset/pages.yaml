  md: '思就是穷人多得狠！我这些年吃的最大的亏就是总是以自己的眼光去看 待这个世界，而从不深究世界到底需要什么。所以，往事无可追，该 有的经历，没有人可以逃得了，我依然会觉得很幸运，会在这个时侯接
    触老师们，不迟不晚，当过学霸也好，当过兼职达人也是，从此刻开始， 接受先进的文化和理念，努力去做事，是每个人都必须要面对的。


    不追究，不抱怨，低头做事，努力赚钱，我要把这句话印在脑海， 抛弃以往混乱的思维，重新植入好的思想，每一天爱上自己的工作。这不是鸡汤，这是一种思维的变革，也是必经之路。


    最后的最后，我人微言轻，但是，赞同和相信老师的梦想。我会跟 着老师努力的学下去，修炼本心，坚持初衷，做大做强。


