  md: '大家好，我是佩佩，最近有不少学员来咨询关于视频号带货的事，所以专门写一篇视频号带货指南给大家，解决最核心的几个问题。


    首先说一下，视频号带货现在没那么成熟，选品平台、标签流量什么的都不够精准，但也是因为平台不成熟，潜藏的机会也更多，大家可以各显神通，尽管去尝试。


    大家都知道，我跟着找哥做自媒体四年了，之前通过在抖音做好物分享项目，制作过近千万播放，销售额近100万的带货短视频。


    从0-1孵化过数十个带货矩阵账号，我们也代运营过500万粉丝的好物推荐账号，单个账号变现超百万。


    好物分享项目，说白了其实就是根据用户需求，筛选爆款好物，通过图文或视频种草的形式，吸引用户掏钱下单。


    最后在不需自己发货囤货的前提下，赚到钱。


    直播的时候我也讲过，2022 年，好物分享账号依然是普通人最好上手的赛道之一，不仅不晚，还正合适。


    首先是门槛低，做好物分享不需要你有什么专业知识，你们对另一个全新的行业的了解可能要重新学习很多，是真的要从0到1去学习入门。


    但好物分享这个项目，本身就是离你很近的，买东西谁没买过？你没有给亲戚朋友推荐过好东西吗？你要卖的东西可能就是你每天都在用的东西，或者你本身就想买的东西，你是熟悉的，不是那么陌生的。


    也不用你花大量时间和精力，这并不像做ip的，你要在内容上花费很多时间去研究和打磨，要输出各种干货，分享心得体会，还要同步去研究学习很多东西，去输入输出，但好物分享相对来说就简单很多，就是东西多好用，'
