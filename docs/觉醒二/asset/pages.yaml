  md: '# 三、广告主互选下单技巧


    # 1、选题很重要：


    问题关注数和阅读数要是够大，至少选择>1000以上关注的问题，用工具（如+后台）可以按照问题关注或点赞、收藏排序，快速查计量大的问题。


    ![](img/82d104e254c31d9db1db192a6a1e7b62_210_0.png)


