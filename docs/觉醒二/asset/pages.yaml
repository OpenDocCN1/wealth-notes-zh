  md: '# 第四章：捞金实操


    推能力，最重要的美团的精细化管理能力，在这个需要打几年的战场。美团这一特点具有巨大的优势；


    目前这三家最为激进，阿里的同城零售也开始进行布局，我最近也跟了几个团长，还有一个美团团长在地区排名第二，后面团长社群逐步开始发满满的，多多买菜的，用户也会根据价格与生鲜质量的好坏，选择对应的平台，因此社区团购最终应该是比拼的是供应链，需要进行供应链效率的革命，第二点是拼的中心化入口的流量能力，给团长流量，帮帮团长赚较多，团长跟着哪个平台走。通过这两个点，预测一下，最后杀出来了应该是拼多多，就是苦了那些生鲜小商贩。


    # 四、普通人入局社区团购比较好的机会是哪些？


    巨头的摩擦的缝隙，给普通人带来了很多机会，普通人入局社区团购的机会又这几个，我这里泛指普通人：


    当团长：当团长目前来说是参与社区团购最简单的方式，团长就是成为某平台的代收点，如果附近的人有在平台购买订单，邮到团长那里，团长可以获得佣金；如果自己建群发单，群成员购买，团长也可以获得佣金；


    做团长的话抓住这部分红利，要同时成为这几个社区团购平台的团长，这样几个平台的流量都会导向你，可以获得最大部分收益，在这特意讲一点，平台是允许一人多平台的，在另外一端多拉附近的人，进群即可，对于远超市小摊的低客单价水果蔬菜，发到群里转化率及其高的；


    我这边跟踪了一个数据，一个乡镇上的快递驿站，一天能卖 2000-3000 块钱，正常一天能赚 300-500 元，对于很多普通人来说，这是很好的生意。


    拓展团长：现在拼多多，美团，满额满万见证，招募大量的地推团队，去拓展商家，开城做单，目前拼多多，美团拓展一个团长的价格是 130 元，满得拓展一个商家的价格是
    160 元；这一个业务是可以规模化运作的，只要有一个强有力的地推团队，可以跟着这几个平台，跨城做地推，正常情况下一个人推 10-30 单一推不难，我这边也参与过多多买菜，西安，重庆，济南的推广，整个收益还是很客观的，如果你想参与我可以给你做对接；'
