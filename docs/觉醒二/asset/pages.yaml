  md: '# ### 起底巨头混战的社区团购——孙策


    最近，社区团购正在混战，滴滴，美团，阿里，拼多多正在开启未来三年的大决战，今天我以四个维度来讲述，巨头正在火拼的社区团购是怎么回事？以及我们如何通过社区团购赚钱。


    +   1.  社区团购是什么？团购集采+到店自提怎么对线下生鲜小贩整个链条的进行打击？


    +   2.  兴盛=社区团购，兴盛模式为什么跑出来，优于前置仓，正在被各大巨头抄袭？


    +   3.  巨头战，滴滴、美团、拼多多、阿里，各自的逻辑是什么？为什么不能输？


    +   4.  普通人入局社区团购比较好的机会是哪些？


    # #### 一、社区团购是什么？


    团购集采+到店自提怎么对线下生鲜小贩整个链条的进行打击？


    # ##### 1、团购的逻辑


    团购，电商领域的超级黑天鹅，团购这个领域长出了美团，长出了拼多多，长出了聚划算，长出了直播电商，甚至把双十一变的热度不在，稀松平常，让整个阿里在近几年绝对焦虑；


    我们就以黄峥的思考来讲述，传统电商其实就是把义务小商品搬到网上，流通侧信息高度透明化，线上商贩卖竞争越来越激烈，线下生产的计划脱节和对比就越厉害，其实对线下传统制造业改变并不多；


    那解决方式就是黄峥用倒立的资本主义来解决，富人有资金抗风险能力强，穷人愿意向富人买保险，换过来如果穷人愿意把自己购买的意愿卖给富人，也就是说先把自己的需求提出来，把一批人共同的需求做一个归集，再提交给生'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 觉醒二


    厂商，这样后端生产商就是可以实现需求和资源的有效配置；


    团购就是把一些需求滞后一些，这样后端可以根据一部分确定化的需求，来调整实现最高效率运转，高于传统货架电商。


    2、团购集采+到店自提，对线下生鲜小贩整个链接进行打击


    5-7年前，我们完全喜欢在线上购买衣服，完成巨大的变革，长出了阿里，线下衣服门店一片哀嚎，线上订购生鲜这一块由疫情催生，以后人们也会完全习惯线上购买生鲜食品，那么预测一下，未来的线下的蔬菜水果小贩及蔬菜生鲜门店；


    我们梳理一下线下蔬菜水果小贩的整个流程，这里只是梳理最简单的流程，一个农户a种出西红柿，当天采摘后小贩b来收，小贩b卖给批发市场c，小贩d来批发市场采购之后，去摆摊售卖或者是自己的店铺售卖（店铺一般都是对应的小贩直接配送，在这里咱们简述最简单的流程）；


    这里小贩b，批发市场c，小贩d，对于这个西红柿都是x因素，纵然可以根据之前的经验确定采购多少，销售多少，但终究不是确定的因素，不确定就无法实现资源的最高效利用，不确定就意味的无法在供给侧进行改革；


    首先团购集采+到店自提带来了


    +   1）带来了确定性需求，也就是苹果要了多少斤，在这个确定性需求下，整个链条下，更可以进行资源的最高效利用；


    +   2）缩短了整个环节，产地一供货商一仓库一社区门店，通过环节的缩短，降低了运费，降低采购成本，降低了客单价，当客单价可以消灭本地小贩时，新一轮的变革要来了。


    # 二、兴盛=社区团购


    兴盛模式为什么跑出来，优于前置仓，正在被各大巨头抄袭？


    社区团购两大核心方式是前置仓与团购集采+到店自提模式，团购集采到店自提比较代表性企业是兴盛优选，前置仓代表性是每日优鲜，叮咚买菜，盒马生鲜；前置仓就是城市中心仓+社区门店分仓，社区门店成了小型的仓库，附近消费者下单，由最近的门店进行配送。'
  merge: -1
  img_proc: true
- pgno: 204
  md: '每日优鲜相当于传统的电商，兴盛优选就相当于拼多多新型的新晋电商，兴盛优选的优势在于


    +   1、最大的优势在于确定性的需求，可以更政整个供应链，发起供应链革命；


    +   2、客单价低


    +   1）通过接单预售，出单量比较集中，可以进行规模化采购，可以最大限度地降低成本，为消费者提供更高性价比的产品；


    +   2）通过确定化的采购需求，完全可以实现零库存管理，整个库存管理的高效，可以带来更低的客单价；


    +   3）在兴盛模式中，3~4 元的客单价是可以实现，每日优鲜则需要几十块钱的客单价，3~4 块的客单价，对线下生鲜超市与小摊有明显的价格优势，3~4元的客单价比几十块的客单价提升了
    n 倍的交易空间，是覆盖了 80% 的国人的需求，完全可以实现全民线上生鲜进餐桌，几十块钱的客单价则不可以。


    +   3、物流成本低


    围绕着 一个社区进行集中采购与集中配送，单个产品的配送成本会大大降低，体验会更好，稳定性也比较强；


    用户自提与团长送货上门，比送货上门成本大大降低；


    在疫情催生的线上买生鲜这个需求，实现了订单密度的大大加大，区域订单密度加大，物流成本无限降低，在兴盛模式中，物流成本甚至可以降低到 1 块钱以下，对于动辄
    10 几块钱的每日优鲜模式，有超大的显著优势。


    综上，当兴盛模式跑出来之后，滴滴，美团，拼多多是抄袭的兴盛模式，就更加论证了兴盛的正确性。


    # 三、巨头战


    滴滴，美团，拼多多，阿里，各自的逻辑是什么？为什么不能输？


    做正确的事情极其重要，巨头看待事情的认知肯定高于 99% 的公司，当一个赛道有巨大想象空间，拉动自己的增长，并且为自己的用户创造更高的价值，那么巨头会不遗余力的抢占它，多个巨头抢占的时候，更加验证了这个赛道具有巨大的可能性。滴滴，美团，拼多多多个超级巨头都在抢占，这是有史'
  merge: -1
