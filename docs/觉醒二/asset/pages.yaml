  md: '或者多好吃，或者多好玩拍出来，不用你拍很长的短视频，不用花过多的精力。


    还有，不需要拍的多好，多会剪辑，甚至不露脸不讲话都可以做好物分享。


    那第二个优势是离钱近，好物分享就是离钱最近的赛道，拿短视频带货举例，这行的特点之一就是流量直接为我们的内容买单，简单粗暴。


    也就是哪怕点赞少，只要内容好，也能起高转化，因为好物分享这个赛道不会单纯去看点赞量，而是重点看转化率，我们做一个内容，能让用户立马有下单的冲动，就够了。


    这就是为什么说好物分享赚钱的模式是流量直接为内容买单。


    其次是人群广，需要买东西的人永远不缺，不要怕没有市场没人想购物。


    第四是不用你囤货，你就是带货达人，帮商家把东西卖出去然后赚佣金就行了，甚至都不需要你发货。


    关于好物分享项目，我目前也在录制一门课，到时候也会免费同步给咱们IP课学员，今天就先不说太多了。


    今天我们主要来讲讲目前尚存红利的视频号带货。


    我们目前其实也正在测试视频号项目，做了快两个星期，发现确实是存在机会的。


    我们团队搞了十个号，目前最高的一个号几天时间就涨粉涨到了一万粉丝，其余是要么几百粉丝，要么一两千粉丝。


    带货数据目前还不错，主要爆的一个品是之前找公众号卖过的一个产品，老粉估计知道是啥。


    主要是产品拥有货源，所以一个客单价百元的产品，我们的利润可以拿到一半。


    其余的号目前都是在选品中心自选了一些品，有低佣金的，也有一些高佣金的，视频号选品中心的品目前来看到如不像我们自有的产品，但只要做到批量化，大量惹视频，其余的交给时间就是了。


