    +   7、挑选有前景和未来的项目。比如做短视频带货项目，完全可以当成一个入门自媒体的开始，只要掌握关键技能，未来转型做个人IP也是非常赚钱的。大部分具有时代红利的行业或者项目啊，往往第一批受益者一定是在类似行业做了很久的人。


    因为你只有在这个行业的周边领域积累了一定的认知、能力、经验和资源。


    你才能迅速的感受到这个行业的红利，并以最快的速度迁移过去，从而成为行业第一波红利的享用者。


    所以，任何项目想赚钱，没有学习和积累是不可能的。


    # 九、做副业，别幻想一夜暴富


    我的短视频带货课程目前才开了两个月，就已经有很多学员赚到了钱，最高的一個昨天就在抖音上做出：单耳破十万的成绩。


    然后这位学员来感谢我，给我发了999元大红包，我没收到，因为我知道人家赚得到钱，和我有关系，但是关系不是特别的。


    他之所以能赚得到钱，是因为时代占主要的原因，其二是因为他的执行力，其三才是我带他入门，我的短视频带货课程，只是起到了锦上添花的作用罢了。


    赚钱这个能力是复杂的，需要一个积累的过程，一个人从只知道在职场打工，每月拿个几千块工资，到找到一个适合自己的好项目，是需要一定时间的。


    这个过程中需要投入大量的时间和精力，需要有心，不断试错和复盘总结。


    对于我们的学员来说，我们并不能保证你能赚到多少钱，我们售卖的是自己的经验，至于能做出什么结果，全赖个人执行力和对行业的认知能力。


    每个人的商业认知是不一样的，水平也参差不齐，帮一个有基础的人收入'
