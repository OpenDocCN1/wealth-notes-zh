    # 六、为什么我一定要建议你做小红书？


    1.一定不要做浪费时间，没有积累的副业


    现在经济形式不好，很多人都想要做副业来补贴收入。但是副业也是有好坏的。


    一个坏的副业，不仅浪费你的时间不说，甚至还可能浪费你的金钱。最后钱没赚到反而损失了时间和精力。


    有些副业，虽说可以赚钱，比如下班时回去发传单，跑滴滴，送外卖。但这种靠出卖时间来换取金钱的副业，是没有前景的。


    因为没办法扩大啊。


    一个人的时间就24小时，天天不吃不喝也顶天也就赚个几百几千。俗话说，8小时内某生存，8小时外求发展。


    我们做副业，就是为了让我们生存的基础上，多一个发展的可能性。一个好的副业，能够让你不仅有金钱上的积累，还能让你的人生有另外的可能性。


    拿我一个学员来举例。


    她之前是宝妈，后来怀了2胎之后，就顾不上家庭和工作。她因为孩子的事情老是需要请假，公司里的领导也把她逐渐边缘化，奖金和绩效也一再降低。


    这时候她开始尝试利用业余时间做小红书，通过自己的努力涨到了两千多粉丝，但是变现一直不是很好。


    后来遇到我之后，我帮她重新规划了一下定位，设计好了她的变现模式，现在她出了好几条爆款，每个月的收入早就是工作的两倍多。


    上个月还跟我说辞职了，在家专心带娃，给两个宝宝一个美好的童年，兼'
