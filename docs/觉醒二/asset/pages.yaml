  md: '# 再次迷茫


    这一年年底，我彻底迷茫了，我不知道以后的路该怎么走了，闲的无事时，我在想我十年的技术，到现在还剩几何？


    2017 年裸辞时，想着跨行业赚点钱，继续我的软件生涯，经过两次探索发现失败的非常彻底，才有点明白，没有任何一个行业，是简简单单就能把钱挣了的。


    都是需要付出大量的时间、坚持行业的低谷才能挣到自己该挣的钱。那么我能不能一个人继续我的软件生涯呢？


    有一天，已经快过年了，想如何将继续我的软件事业，在网络上看 dubbo 对比 springcloud，dubbo 在那个时还没有重新开始维护。


    让我心 有 于悸，而 springcloud，spring 嘛，大家都懂的，好多人都说微服务好难，我不相信，决定全力一博 springcloud。


    我资料的过程中找到微笑哥的博苦，根据微笑哥的 springcloud 教程，在过年前后我边学边录制了一个初级的 springcloud 的 git 开源项目，在视频的最后我预告了要出一个
    spring-cloud 脚手架项目。


    # 研发 sea 微服务平台


    2019 年 6 月一个偶然的情况下，我联系了我之前的带的徒弟。


    我接触到了一个游戏支付项目，但是这两年国家对在线支付管制造来造严，导致我接到这个项目时已经是无法继续了。


    因为第三方支付的 H5 通道 不开 了，而且能带游戏公司避税的业务这些第三方支付公司也不做了。


    当然即使做了，也不见得能落什么好。


    于是我就开始着手研发 springcloud 的手脚手架项目，花了三个月的时间，把我想到的基础功能做出来了。


    当时我是想开源来着，做了几个月之后，我发现一个真正的开源项目并不是你的项目一开始就做的有多好，而是你能一直去迭代升级、维护社区，并积'
