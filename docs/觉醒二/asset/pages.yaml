- pgno: 211
  md: '3、互动下单技巧：

    任务标题：最好涵盖作者名称。

    合作时：默认30天，最360天。

    合作出价：最低为参考价的50%，作者接单率30%，出价500以上，作者比较愿意接单，如果作者单天价格较低，建议30天500元，如果作者单天价格低，建议90天500元左右，关键是最终价格，作者不太关注合作周期。

    出价：通过作者级别、职业、粉丝；看内容互动；内容创建时间；当前答案的每日曝光量，来评估；


    # 四、创作者的接单流程


    +   1、内容修改：

    客户下单扣款

    作者接单留下联系方式

    客户线下沟通修改内容，给作者提供内容和插件链接

    作者植入内容和链接卡片，作者申请验收

    客户创建知 + 订单，上传内容截图 + 互动下载截供审核

    审核通知 + 投放，客户验收内容通过合作中状态

    知乎将合作款付给用户。


