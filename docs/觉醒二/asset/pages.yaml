    4. 商家店铺账户实际控制人的其他小店账户，未被小店处以特定严重违规行为的处罚，未发生过严重危及交易安全的情形；\n5. 商家店铺需要根据不同店铺类型上传品牌资质，并保障品牌资质真实性、合规性，链路完整性，参考《店铺类型及命名规则》\n\
