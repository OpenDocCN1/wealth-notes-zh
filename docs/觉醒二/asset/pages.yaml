    我其实还挺幸运的，正好赶上了头条青云计划的红利期，也因为青云计划这个项目让我知道，我是喜欢写这种深度文的，它对我的个人成长帮助很大。


    现在写作对我来说就是边写边读边疗愈，我可能无法做到像别人那样一年光写就写出个几十万，但，我有表达欲，写作能激发我的思考，让我能跟自己对话。所以，这项工作，我是准备投入以年为单位的
    TIME 和精力的，写到退休也是可以的，这其实跟做心理医生一样越老越吃香。


