    所以用上个这个场景，大家看了有需求上的共鸣，是不是我内容被他们认可的可能性就会更大了？也就达到了你这条视频的价值最大化。其他的就交给时间即可。


    # 七、抓住人性的弱点：懒


    帮用户节省时间和行动成本。比如叫载人减肥，教人做饭，教人挑选东西，'
