    个客户需求，客户好评，于是获得季度优秀个人，同时加薪 20%，半年后完成

    优秀团队荣誉，加薪 30%，这个成绩看起来还是不错的。


    在这里分享一个关键点，一定不要在职场让自己孤立。具体而言就是，

    不要让自己锋芒毕露，一定要学会不抢功，示弱，以及帮助其他人成长。'
