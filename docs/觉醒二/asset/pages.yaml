  md: "化，其实这种就是不愿意吃学习的苦，却不得 不 吃生活的苦。\n\n 很多人往往只关注当下，都在追求低级欲望，比如整天花大量的时候看短 视频、玩游戏、围观娱乐八卦等等，这些低级的欲望很容易就能及时满足自\
    \ 己，很容易就能让自己爽，时间一久，很多人就会养成一个不愿意付出，年纪轻轻 就把自己毁掉的人。\n\n 而只有那些愿意相信长期努力，才有可能获得超额回报的人，他们才有可能甩掉大部分的同龄人。\n\
    \n 一个人能不能赚到钱和什么有关系，很多人会说和努 力、机会、能力有关系。都没错，但是根本原因上来说，一个人能不能赚到钱，能否在同龄人中脱颖而 出，和一个人的思维方式，一个人的认知程度有非常大的关系。所以说，\
    \ 认知水平低，是一个人的致命短板，也是一个人赚不到钱的根本原因。\n\n 这个社会是分层级的，一群人碾压另一群人，一群人收割另一群人，高认 知的人一直都是处于社会的顶端。\n\
    \n 想要实现阶层跃升，我认为最重要的是要先打破自己大脑中那些固有的认 知和思维。你只有把自己大脑当中那些老旧的、劣质 的思维去掉，种植上优秀 阶级的人的思维，我们才有可能拥有和普通人不\
    \ 一样的未来。\n\n# ## 普通人赚不到钱，是因为“资源诅咒”\n\n 之前我看过一篇研究不同国家富裕原因的文章，里面得出的一个结论是： 地理位置对一个国家来说非常的重要。假如一个国家地处平原，那么这个国家\
    \ 的交通就会很便利，带来的自然就是贸易会更方便；相反，有些国家假如属于 地势高低起伏，崎岖不平的内陆环境，那么这些国家对外沟通的渠道就显得特 别的有限，便会造成较高的物流成本，从而阻碍经济的发展。\n\
    \n 由此我想到一句我们常听到的话，“想致富，先修路”，这句话说得是挺 对的。\n\n 高中的时候我们都学过地理，都知道非洲大部分地区都比较贫穷，为什么？\
    \ 因为非洲地处热带地区，雨水匮乏、常年土地干旱、水资源欠缺、病虫害严重。 这就导致当地的农业生产效率是低下的。"
