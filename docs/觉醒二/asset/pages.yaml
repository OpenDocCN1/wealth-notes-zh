  md: '# 你不知道的赚钱真相


    我大学毕业之前，去深圳找了一份月薪六千，敲代码的工作。


    当时心里就想着，要是我毕业之后能拿到八千一个月就挺爽的，职场上再努力，每年涨薪两三千，25 岁左右收入怎么也能上万了。


    事实上我在毕业之后的两年里，工作状态都还挺不错，第一年月薪六千，由于工作出了些成绩，第二年直接就涨到了月薪一万五。这个薪资涨幅我相信大部分人是做不到的。


    但是在这个过程中我慢慢意识到，即使我每个月能稳定收入两万块，并且还是税前，一年不吃不喝全部存下来也才二十万出头。可实际情况是，还得除去各种花销，所以根本存不下什么钱。


    直到我开始在自己的自媒体业务上发力，我才意识到，打工只是让自己进行能力和资源的积累，是一种短暂的过渡，只有自己创业才有可能实现财务自由。


    一般情况下，大学毕业两三年内，基本上看不出每个人的差距有多大，这时候的同学彼此都还会经常联系，顶多是谁升职加薪，谁马上研究生毕业，又或者谁出国留学。大家的经济收入不会有特别大的差距。


    但是一旦毕业超过 5 年，当年同一批或跑线毕业的同学，大家的差距就会越来越大。从我的观察来看，我身边经常接触的一些朋友大致分为三类：


    第一类是一毕业就回老家小城市的人，他们一般要么待在体制内，要么就随便找一个销售或者做点小生意。每个月赚得比较固定，也都陆续开始结婚生子，家里支持一点首付，自己的小家庭过得也还算温馨。不过大部分人这种生活过久了也觉得没什么意思，都不想安于现状，可顾虑太多，又没有勇气走出去。


    第二类是漂泊在大城市很普通的职场打工人，有做设计的、做产品的、做'
  merge: -1
  img_proc: true
- pgno: 21
  md: '程序员的等等。毕业 5 年之后他们的状态相比刚毕业，有些人混得很差，一直做着自己不喜欢又不是很擅长的工作，一年能换四五次工作，根本没有核心竞争力，算是职场最底层的员工。


    稍微好一点的顶多是薪资翻了两三倍，好一点的能月入两三万。他们是大城市的空巢青年，表面上看还算是体面，但是除去每个月的房租和生活开销，其实也存不了什么钱，更别谈在大城市买房了，这一批人中的大部分更像是城市的螺丝钉，为城市奉献完青春，有一天也不得不选择离开。


    第三类是正在创业或者已经实现了财务自由的。这类人往往是选择了一个有时代红利的好赛道，加上自己的努力，实现了从农村到大城市的迁移，过上了相对中产的生活，他们因为经济实力雄厚，是有抗风险的能力的。反而是前两类人，不出问题还好，一旦出现裁员或者重大意外，他们根本没有能力为自己救命。


    前两类人，他们的思维认知里的赚钱公式，是找一份工作上领够工资，然后等着每年涨那么几百一千块。本质上来说，这其实就是在一个错误的方向上努力。


    我们从小接受的教育是什么，是稳定，是好读书将来找一份好工作，这没问题。但是一旦这种思维模式在一个人脑子里根深蒂固，那他就一辈子都不可能赚到什么大钱，更别说财务自由了。


    之前看过一本叫做《穷爸爸富爸爸》的书，里面有一句话是这么说的：“学校体系实际上是在教导人们做个穷人，学校永远不会教会你关于钱的问题，学校是教你如何做一个打工的人，或者是医生、律师、专家，但是从来不谈钱。”


    当然我觉得这句话并不是说在否定学校的教育，而是说明了一个事实，学校里的教学内容，并不是为了教你如何成为一个会赚钱的人，所有关于赚钱的事情，你都只能毕业之后自己去思考和探索，所以导致很多人即便是读了十几年的书，也依然对赚钱毫无概念。


    当然我知道有些人可能会说，人活一辈子开心最重要，并不是以赚钱为目的的，这话没错，赚钱并不是人生奋斗的目的，但是在这个弱肉强食的社会，赚钱这件事，确实是一个人必须具备的能力，所以你必须懂，必须知道赚钱的'
