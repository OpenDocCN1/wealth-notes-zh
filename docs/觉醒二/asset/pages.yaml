- pgno: 144
  md: '# 第三章：捞金思维


    ![](img/82d104e254c31d9db1db192a6a1e7b62_144_0.png)


    但这里面也存在一个问题，抖客们和小红书直播间合作，从整场直播的成交率和转化率来看，很难将现有的流量出现收益最大化。


    而大品牌、大主播的直播间远没有那些小商家的直播间更需要流量。一般体量的抖音很难取得大直播间的合作。


    就算你不挣这部分推广费，直接赚佣金，还要考虑到“流量重叠”和“流量消耗”的问题。


    抖客这个项目最让人难受的地方，就是它的“老粉佣金缩水”机制。如果成交的用户是所推广直播间里的老粉丝，佣金直接缩减到1%。


    > 例如抖客，指针对有自己商品或自运营渠道的电商或品牌的小淘客用户。抖客是第三方为商家提供推广的，是小淘上的推广方，是服务商，小淘就是小淘客。抖客是商家或品牌方的服务商，负责管理商家直播间的用户，在引流客广直播间之前有一定的推广方式，包括一定的形式及方式。例如抖客可以引导用户到直播间。举例如，小李是文生了一个抖音账号及小红书账号（30万粉丝）。在一次平台内容推广计划中，通过小红书的账号，引导小红书粉丝来到小李的直播间购买小李的商品，同时，小李通过直播间里的推广位，引导粉丝去他的抖音账号下单购买商品，同时，小李也在小红书直播的同时引导粉丝来到抖音直播间购买商品。这些粉丝属于“老粉丝”，佣金缩减到1%。


    几千几百万粉丝的大主播，有可能你的粉丝就包含了你的用户。大家都主'
