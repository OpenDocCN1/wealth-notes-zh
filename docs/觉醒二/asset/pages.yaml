    商家体验分小于3.5分或者触犯精选联盟平台管理规则（具体规则请参考《精选联盟平台管理规则》第四章），达到清退标准或终止合作的，将关闭精选联盟使用权限。被关闭权限的商家，已经短视频或者直播推广的商品会被解绑。


    特别注意：每个商家有且仅有3次开通精选联盟机会，如果被系统关闭了3次，该商家将永久不可开通精选联盟。


