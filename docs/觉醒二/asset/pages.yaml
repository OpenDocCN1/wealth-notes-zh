  md: '发布商品。每个类目对于保证金的要求不一样，这个可以根据官方要求缴纳就是了，保证金在你关闭店铺时是可以退还的，具体保证金缴纳要求可以参考网址：https://school.jinritemai.com/doudian/web/article/101816


