  md: '# 淘客们是怎么获取流量的？——弥策


    因为微信个人号承载力无法承载太多的泛粉，团队运营力的消耗还有最终的转化力问题，淘客最需要的就是精准的电商流量，淘宝站内用户是淘客的一大批流量来源。


    # 评价粉：基于淘宝评论区流量，评价粉曾火遍一时


    ![](img/82d104e254c31d9db1db192a6a1e7b62_159_0.png)


    评价粉就是买一个商品，在评论区写评论，做个图，然后告诉用户加哪个微信或者是关注哪个公众号，可以比正常买便宜，


    对于评价粉来坑优势是：


    +   1. 流量大，当某个淘系商家烧钱做推广的话，你所留的钩子（加微信、加公众号）会不断有曝光，换种说法商家的一部分广告费是为你做的，也算是截流的一种；


    +   2. 有针对性，你需要美妆粉你可以去美妆商家下面做评价，你需要零食粉，你可以去零食商家下面去做评价，所有可以根据自己需求，找到对应的粉丝。'
  merge: -1
  img_proc: true
- pgno: 160
  md: '3. 批量化：对于评价粉而言，只需要购买商品之后，评价上后拒收就可以了，也不用花钱，所以说这个核心在于如何铺上海量的评价，如果找到足够多淘宝店就可以完成这个事情，怎么找？


    其实我认识批量化 的项目，对于大学校园是最适合不过的，我们完成可以在学校孵化基地搞个办公室，而且孵化基地第一年免租金，以招兼职的形式不断来新的学生，这个是我们自己验证过的。


    评价粉售卖价格在 3-8 元左右，就是对方提供微信，加上对方的微信，即可算一个合格粉丝。


    ![](img/82d104e254c31d9db1db192a6a1e7b62_160_0.png)


    # 店铺粉：对海量的免费搜索流量进行截流


    店铺粉通过多店铺上传多产品，借助淘宝的自然流量，进行吸纳精准粉丝，就是你针对某一个标题上产品，产品的价格 0.01 元，详情图是一个优惠券，然后购买后或者是私信，旺旺会给你发一个微信，添加这个微信享受什么样的价格，对于店铺粉来讲就是有一个问题，如果优惠券过期的话，用户加上微信一下就删除了。


    做店铺粉的最核心的是如何找到多个店铺，有些人是用转租店铺的形式，我还是建议做评价的粉的方式，在学校那个孵化基地。


    # 快递粉：基于精准地区的电商流量，到目前还可以做


    快递粉分包裹粉与快递粉，区别就是一个在快递里面，一个在外面，在快递里面放一个好评返现卡或者是现金红包的卡，属于包裹粉，在快递外面贴一个加微信领红包贴纸，属于快递粉；


    快递粉的优势：线下一个好处是不受平台规则变化，算好 roi，可以规模化'
  merge: -1
  img_proc: true
- pgno: 161
  md: '上量；也有区域优势，你可以把你的粉丝框在某个特定的位置，针对地区精细化运营自己的粉丝；包裹粉也可以通过投放包裹卡片，匹配到自己想要的粉丝。


    快递粉（贴在外面）就是你可以谈一个县里的分拣中心，租金多少，派一到两个人去贴，持续的贴去贴，包裹粉（在包裹里面放卡片）就是你可以针对性的谈商家，付费给商家多少钱，然后放多少张卡片。


    快递粉我一个很好的朋友做了一段时间，最早贴 20 多个加一个微信，到中期的 40 多个加一个微信，到最后 200 个一个微信，对于做本地流量，也是一个很不错方式，快递粉与包裹粉到目前为止讲还有很多人去做。


    # 短信粉：可以定位买家的电商流量


    短信粉就是拿到一些大的淘宝商家的客户手机号，进行针对性的发短信，可以发你在哪个商家购买的什么商品，你加某个微信可以领红包或者是免单。


    这个方式算是很古老的方式，需要海量精准的手机号，可能是百万级，千万级，在 17—18 年是很不错的引流的方式，但是目前现在为止也有一批人坚持在用这个方式做流量。


    先小批量测试，例如一万条，测试一下多少人加好友，然后单个粉丝日产多少钱，大致多少钱回本，之后再上到 100 万条，1000 万条。


    关于短信粉有一个特殊的玩法，就是每逢 6.18，双 11 都有大促，都有超级红包的玩法，有一些大佬发各种文案，通过精细化运营，算好 roi，通过领超级红包获得锁佣，一天可能佣金过百万，但是封号的也比比皆是。


    # 口令粉：基于白名单比较有门槛的增粉方式


    口令粉：口令粉就是你在打开发个网页，他嵌入了一个代码，用户打开网页，打开淘宝就自动弹出加微信的界面。


    这个方式可以找到中小型网站，进行投放，这个目前做的比较少


    # 截流粉：用种种方式把同行的流量偷过来


    淘客的截流粉，就是锁定一个同行，然后利用一些关键词，刷排名，把同'
