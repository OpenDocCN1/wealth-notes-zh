  md: '看同类型文章，知乎和公众号同名《盗坤》。


    # 选品技巧：红海中的蓝海价格区


    大家好，我是盗坤，93 年的电商从业者，目前团队有 24 人，运营了 20 多个


    店，今年的净利润是 220 多万，大家对淘宝赚贼感兴趣的可以关注我公众号或者知乎号《盗坤》。


    上一次给大家分享了一个人做淘宝的技巧。这次我将继续给大家分享一个选品技巧，因为选品是做淘宝最重要最关键的一步，也是第一步。


    之前我在公众号分享过一篇文章，是关于选品误区：蓝海中的红海区。今天就给大家来聊一聊，红海中的蓝海价格区。


    海参保这个产品，日搜人气 14690 但是在线商品数又 5 万多，商城点击占比更是高达 73.82%. 毫毫无疑问，妥妥地红海战场，大家就不要轻易上场了。


    但是，如果你非要做的，我也建议你选择红海中的蓝海区间。


    红海中的蓝海区间，整体看来，有两大原则。


    第一：必须是非标品。比如刚才的海参，因为是非标品，所以他的价值不好界定，因此价格也会不一样。但是如果都是小米电视，一样的尺寸，一样的配置，他的价格太透明了。


    第二：价格区间跨度大，价格区间跨度越大，越容易区分人群。


    100 块的东西和 120 块的东西，人们对于这个价格差距敏感度不大，但是如果是 100 块和 300 块的东西，人群标签的差别就很大了。就好比买鞋，长得一模一样的鞋，买
    500 块以上鞋的人，是绝对不会考虑 100 块的鞋的，他会天然认为 100 块的鞋质量不好。他只会结论是该买 480 的鞋还是 520 的鞋。那么我们可以看见，海参保是满足以上两点条件的。


    接下来，我将和大家来具体分析一下，如何挑选红海中的蓝海我们可以通过把海参保的价格划分区间，来划分产品，划分人群。


    我粗略地把海参保的价格区间划分为 500 元以下，500-1000 元，1000-1500 元，1500 元以上四个区间。


