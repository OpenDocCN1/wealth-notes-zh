  md: '又误打误撞进入抖音拍视频。因为无意间拍的一条关于英文工作的短视频，她得到了巨大的流量反馈，从此定下了她做英语博主的基调。


    此后她开始专心做内容，积累了几百万的粉丝之后，逐渐开始直播带货，做广告，还卖自己的英语课。


    2022 年又看到他转战视频号，在视频号上开始卖自己的新媒体 IP 课程，我偶尔会看看她的直播，基本上每次直播的场观都会在 3 万左右，一场直播下来能做到
    5–8 万的收入。


    她是我看到的一个极其努力的个人成长博主，一个人，通过在自媒体平台输出有价值的内容，把自己的时间卖多次，真的非常励志，对那些有写作能力，有镜头表达能力的年轻人有极强的借鉴意义。


    还比如我一个同行朋友溯左野，同样做到把一份时间买很多次，他写出的 一门课，录成音频卖一次，做成训练营再卖一次，还可以出版成书再卖一次。 这个过程中还不仅仅是单份时间卖多次，还有影响力的不断扩大，这种赚钱方
    式，简直就是在滚雪球。


    因为我主业是做完媒体的，所以平时会看各种类型的账号，认识的各种自 媒体大 V、小 V 都很多。我发觉做自媒体，打造自己的个人品牌真的是一件 赚钱效率极高的事情。


    个人品牌相较于职场打工工人，简直就是在读赚钱，但是这个快钱人家赚得 理所应当，为啥？因为但凡是个个人 IP 的人，他们影响的人足够多，自己的 价值能无限放大被别人看到。


    一个人能影响的人越多，那就有机会把自己的时间贩卖多次，那么它赚 到的钱就越多。


    你以为只有做个人 IP 才能把一份时间卖多次吗？不是的，我认识很多人， 他们不打造自己的个人 IP，而是通过某个项目的方式赚到钱。


    比如他制作出一门网课，自己不去写文章拍视频吸引流量，而是通过投广 告的形式，去别人的流量池里购买流量，这样一来他购买到的用户都是相对精 准的，后续的成交转换率特别的高。


    这种模式很多人在做，批量做课，批量投放，同样是花一份时间写出的课'
  merge: -1
