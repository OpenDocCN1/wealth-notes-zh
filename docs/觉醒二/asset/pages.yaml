- pgno: 205
  md: '以来不会合并的一次大战，我们就梳理一下各自的逻辑。


    首先讲一下最意外的滴滴，滴滴是三家巨头最先开始做社区团购业务的公司，滴滴的垂直打法纵向打法，大出帝国，占领全球打车市场走的并不顺畅，而美团，字节的无边界扩张走的跌跌撞上。


    滴滴也开始无边界了，毕竟 uber 的外卖业务已经超过主营的网约业务，滴滴的用户人群主要是城市人群，尽管推出了花小猪，但是还是无法做到服务县镇人群，这就是最大的天花板，滴滴稳心优选的出现在滴滴用户人群上进行了扩张，而且生鲜的高频让用户记住滴滴这个品牌，巨大的市场可以提升滴滴的长期价值（估值）；


    +   *   滴滴做这个有优势也有劣势，滴滴的优势在于对于生鲜的配送上还是四轮车货车为主，滴滴积累的车辆的调配能力，是优于其他两家的，第二点滴滴的区域化作战力比较强，因为滴滴每进入一个市场，是面临各个不同城市不同机制，滴滴依靠不同的方式进入不同市场。


    再讲一下多多买多多，拼多多在财报上，讲到自己不是做社区团购的，拼多多解决的是生鲜从农村到饭桌畅通无阻，在拼多多的多多买菜的高频率，高留存，能够站领用户心智，这个优势可以实现对于主平台的反哺，电商平台的第一阶段是抓
    man 增长，第二阶段是 gmv，第三阶段是调整 sku，寻求最高 teke，rate，拼多多现在应该是迈入二三阶段，买菜是够高频，购的多一些，gmv 就高了；


    +   *   拼多多面临的问题就是需要提高 gmv 与寻求 take 值，然后农产品这一块占到拼多多的 13%，自己手里的肥肉，让别人瓜分，是拼多多所不能忍的，第一个点是战略进攻，第二点是战略防御，买菜业务，拼多多一定要做；

    *   拼多多的优势很明显，对团购字节级别的解析能力，用户三四线乡镇的覆盖率最多，而且拼多多前身就是拼好货，具有供应链优势。


    最后讲一下美团这一块，美团的无边界，在“food + platform”的战略聚焦下，20000 亿的美团需要新的业务增长点，同滴滴一样，美团没有成为国民
    app，在城市以下用户就很少用美团；


    美团的优势也很明显，以吃为主的超级 app，中心化流量巨大，强大的地'
