  md: '# 抖音小店，小白都能捡钱的机会——盗坤


    这不是广告，也不是我要做抖音小店的培训，是真的觉得这是一个红利机会。我将免费把我的一些经验奉献给大家。不会推荐课程，不会推荐软件，没有任何的，大家敞开心扉，放开胆子，勇敢地往下看，哈哈哈。


    几年前的淘宝店铺就是红利时代，买个软件，大批量采集同行宝贝就是了，简单粗暴，无脑上架，没有任何的技术成分。一批嗅觉灵敏的电商卖家抓住这个机会，快速复制，大量开店，造就了一大批依靠店铺暴富的人。


    可惜好景不长，后来店铺受到平台打压，传统的玩法玩不动了。虽然现在的店铺依然有他存活的机会，不过现在的店铺也在向传统电商的运营方向靠拢，选蓝海词，精细化运营。也就是说，相比较几年前的光景，那时候的店铺就是捡钱，没啥门槛，成功率很高，但是现在的店铺运营也是有一定的技术和资金门槛的。


    所以啊，对于还处于从0到1阶段的创业者，不用考虑什么长期性，碰见这样的红利风口，你需要做的就是迅速切入，allin进去，最大化地享受红利。


    那么今天我将给你们介绍另外一大风口，抖音小店。


    抖音小店，简称抖店，是字节跳动自己开发的电商平台。传言字节跳动目前正在开发自己的独立电商APP了。开通抖音小店以后，你可以依托于字节跳动旗下的今日头条、抖音、火山小视频、西瓜视频等平台实现产品的销售。你可以直播、发文、视频广告、微头条、短视频带货等多种模式销售产品。


    也就是说，抖音小店，虽然前缀是抖音，但是他不仅仅可以依托于抖音APP销售你的产品，而是可以将抖音小店和你的字节全系列账号绑定，通过图文、视频、问答、直播等多种形式嵌入你的产品销售。当然，有的人可能会说自己不会写文章、不会拍视频、不会直播，没关系，不用着急，我后面会慢慢'
  merge: -1
