    如果你想给自己的企业设计一个最新的、最赚钱的、别人看不懂的商业模式，请关注我的节目《商业模式·顶层设计》。


    好了，就要和大家说再见了，喜欢我的节目请【关注订阅】。


    感谢各位的聆听，我是一诺老师，我爱你们！下期再见！'
