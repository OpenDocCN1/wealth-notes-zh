  md: '# 第 30 课：增加 50 倍利润实操版【死驴模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    张三，经营一家贸易公司，由于恶性竞争，生意越来越难做，在采用了死驴模式之后，创造蓝海渠道。


    把企业利润增加了 50 倍。他是如何做到的呢？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_284_0.png)


    先给大家讲个故事：


    一头活驴可以卖 1000 元，一头死驴能够卖多少钱呢？


    100 块钱。


    是的，犹太人把这头驴，用 100 元的价格买走了。


    然而，这件事情并没有结束，故事才刚刚开始……'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 改变世界商学院 世界企业家的摇篮 《全球最牛日的收钱剧本》一诺老师专用


    犹太人居然把死驴卖到2000元，因此犹太人赚了1888元。


    什么？一头活驴才1000元，一头死驴居然赚了1888元？


    是的，这就是犹太人的聪明之处，那他是怎么做到的呢？


    各位，没有不可能，只有想不到！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_285_0.png)


    犹太人印了1000张，每张面额2元的彩票，供人抽奖。


    他说：2元面额的彩票中奖了就可以得到一头驴。


    由于2元钱不多大家都想碰碰运气，心想万一中奖了呢？


    所以，1000张彩票很快销售一空，获得2000元。


    但是，中奖者发现驴是死的，所以不要死驴，


    于是，犹太人就按照中奖者购买彩票的本金，退还了2元。


    再减去购买死驴的本金100元，彩票纸张10元，一共成本112元。


    那么2000元减去112元，就等于剩下1888元。


    这样犹太人净赚1888元。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '这就是今天我们要讲的第一个商业模式——【死驴模式】。


    张三学完商业模式之后，从几百种商业模式当中选了一个适合自己的商业模式，就是【死驴模式】，并且把【死驴模式】用得淋漓尽致，


    张三公司的员工知道老板学完商业模式回来，非常期待。

    期待老板能够带来拯救企业于水火，力挽狂澜的商业模式。


    张三激情澎湃地演讲自己的商业计划书，然后，说到下一步战略的时候，张三大声宣布：“我们要颠覆传统购物方式。”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_286_0.png)


    员工看到老板这么有信心，也热烈鼓掌！


    有人问老板：“接下来您打算怎么颠覆？”


    张三立刻宣布：


    +   之前，卖 1000 块的音响，现在卖 1 块钱！

    之前，卖 6000 块的手机，现在卖 1 块钱！

    之前，卖 8000 块的电脑，现在卖 1 块钱！'
  merge: -1
  img_proc: true
- pgno: 287
  md: '张三说得非常兴奋，而员工一听吓一跳，觉得老板疯了。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_287_0.png)


    各位，商业模式就是方向灯往左打，车往右边开！就是让同行看不懂！


    张三看到，大家被他吓得脸色苍白，就哈哈大笑。


    张三说，一诺老师告诉我们，商业模式就是这样，开左边的转向灯，方向盘往右打，就是让别人看不懂。


    张三立刻组织人员，做起了一个购物网站叫：一元夺宝。


    例如：一部 5000 块钱的手机，每个人 1 块钱，一共卖出去 10000 份。


    重点来了，因为中奖率万分之一，收 10000 万块，开支不到 5000 块。


    本来卖 5000 块钱就可以有钱赚了，现在卖到 1 万块。


    利润可想而知。


    结果，很多人觉得才一块钱，试试看。'
