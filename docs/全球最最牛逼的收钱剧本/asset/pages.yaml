  md: "# 第40课：汤妈妈50岁1.7元创业4百家分店3万员\n工纳税2亿【毛家饭店模式】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。\
    \ \n\n汤妈妈在50岁的时候，买了1块钱的绿豆，7毛钱的白糖就在毛爷爷故居门前不远处的池塘边摆起了地摊，现在拥有全国四百多家分店，创造3万多个就业岗位，每年纳税两三亿。\n\
    \n她，是如何做到的呢？\n\n![](img/ff9006615a5a1a6bfb1f601f8b3f246b_368_0.png)\n\n2017年的5月23日下午，改变世界商学院的《毛泽东思想商战研修班》再一次来到毛爷爷的家乡——韶山！"
