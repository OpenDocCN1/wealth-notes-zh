- pgno: 262
  md: '由于李丐腾准备够充分，生意也越来越红火。到 1998 年底，

    李丐腾已经赚了十多万，他的事业从此开始……


    你说，这十多万的积累足够李丐腾回到大山建起两层高楼娶妻生子了。


    但李丐腾又不安分了，他不甘心一直只做小生意。

    他不害怕失败，最坏也不过是回到原点再过苦日子，他决定赌一把！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_262_0.png)


    于是，李丐腾又积累了一年，于 1999 年创立飞科电器。


    此时剃须刀市场分为两大派：


    +   第一个：飞利浦等外资大牌为首的高端市场，特点是太贵；

    第二个：被国产“拔毛机”占领的低端市场，特点是太疼。


    李丐腾琢磨，怎么就不能取中间值呢。将高端产品普及化。

    在一诺老师课程中都有教大家如何进行产品定位。'
