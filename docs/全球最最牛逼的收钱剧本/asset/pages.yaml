- pgno: 319
  md: '《啸啸叫》打造一支啸啸叫的销售铁军


    《改变命运》魔术般的改变你的人生


    《改变世界》活着就是为了改变命运


    # 第四：品牌关键词反复用


    品牌关键词如何深入人心，只有一个办法，就是让他尽可能的出现在用户的所有世界里，用户能听到的：广播、音乐、口碑等；


    用户能看到的：各类屏幕、户外、有质媒介等；


    用户能感受到的：试用、体验活动、消费过程、各类社会活动等。


    # 第五：优化关键词


    品牌关键词必须是大众熟知的，不会感到陌生的，一定不能是企业自创的，这会加大用户的认知成本，同时也加大了品牌失败的概率。


    品牌关键词最好是代表产品功能的。


    例如：宝马等于驾驶，海飞丝等于去屑，猪买单等于免费；


    或者代表用户的某种情感的。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '例如：沃尔沃等于安全，一诺老师等于实战。


    # 第六：要么第一，要么唯一


    “第一”是时间熬出来的，而“唯一”则可以通过智慧，在短时间内创造出来。


    唯一就是第一，因为没有对手！


    而第一不能代表唯一，因为可能有很多对手！


    就像一诺老师通过知识产权保护，注册“猪买单、全球疯狂吸金、全球疯狂变现等”，这样就受到中国工商总局的商标专用权保护，就连“全球疯狂”一诺老师也注册了商标，未来不管你全球疯狂什么，都不行！这就是唯一识别！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_320_0.png)


    因为“全球疯狂”注册了，将来就可以叫“全球疯狂演讲、全球疯狂营销、全球疯狂免费”这都是可以的，商标保护有个特点，就是相似度 50% 的都是侵权！'
  merge: -1
  img_proc: true
- pgno: 321
  md: '例如别人叫“全球疯狂演说家”7个字对吧，有4个字相似，超过了50%的相似度，这就叫做侵权！


    很多讲师跟风，别人讲成功他也讲成功，别人讲营销他也讲营销，别人讲演讲他也讲演讲，这是非常愚蠢的！


    # 第七：品牌命名至关重要


    品牌命名直接影响到品牌传播，品牌名称的意义在于降低品牌的成本——被发现的成本和被记住的成本。


    如何命名，应把握以下三点：


    第一，名称一听一看就知道是干什么的，例如：同仁堂、云南白药、吉普（Jeep）、全球疯狂吸金、全球疯狂变现、全球疯狂融资、全球疯狂演讲（只需要在全球疯狂后面加上干什么就可以了，因为一诺老师的全球疯狂申请商标保护了）；


    第二，好记，听一次看一次就能记得住的最好，例如：猪八戒、阿里巴巴、苹果、联想、赶集网、猪买单…；


    第三，让人感觉是好产品而且高大上，例如：改变世界商学院、改变世界 APP……阎王贡。


    # 第八：一个产品一个品牌'
  merge: -1
  img_proc: true
- pgno: 322
  md: '# 改变世界商学院·世界企业家的摇篮 《全球晏牛日的收钱剧本》一诺老师专用


    全球品牌管理做得做好的是宝洁，宝洁为全球企业树立了一个多元品牌管理的典范。很多企业家纠结，究竟是统一使用一个品牌好，还是每一款产品推出一个品牌好，这两种品牌策略各有利弊。


    统一品牌的优势在于整体划一的形象突出，企业所有资源较为集中的做一个形象的建立，品牌成功率高，


    > 记住的话记下来


    集中所有优势兵力，打造一个优势品牌！

    —诺老师


    就像“全球疯狂”定位教育领域，无论是“全球疯狂吸金、全球疯狂变现、全球疯狂融资、全球疯狂销售、全球疯狂演讲、全球疯狂营销”这都是有品牌表示叫做：全球疯狂！


    人们一看到哦，这是“全球疯狂”是一诺老师的爆款产品，因为一诺老师的“全球疯狂”系列定位的是几百块的中低端市场，而且秉承三个原则：简单、粗暴、有效！


    那么别人一看到“全球疯狂”的书籍或课程，想都不要想，直接购买，因为这是一种信仰！'
  merge: -1
  img_proc: true
- pgno: 323
  md: '弊端有二：


    弊端一：是品牌针对目标群体模糊、不精准，从而造成品牌传播价值的损耗；


    弊端二：是企业某一板块出现问题，容易波及整体形象。


    多元品牌的好处显而易见，精准传播与渗透，用户认知度更清晰，从而品牌传播成本低。


    所以，“全球疯狂”字眼，只能是一诺老师亲自撰写，哪怕一年只出一款产品，这就是爆款！绝对不能随便的让某些二把刀或其他刚入行的人胡说八道乱写一通，砸了招牌！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_323_0.png)


    # 第九：品牌不可能针对所有人


    这一条很好的对应了第七条，统一品牌的建立就是试图满足或者更多的涵盖用户群体，而多元品牌则清晰的区分目标客户。成功品牌应当清醒的认识到品牌价值的边界。'
  merge: -1
  img_proc: true
- pgno: 324
  md: '就像改变世界商学院，使命是：帮助更多人实现梦想！是哪些人呢？有梦想的人！一个没有梦想的人，如何帮助他呢？


    答案是：无能为力！即使你要拉他一把，他也要伸出手来对吧？因此品牌要有的放矢，要精准的定位人群。


    # 第十：消费者愿意为品牌故事买单


    恒源祥、脑白金式的广告，简单粗暴，虽起到了很好的品牌传播效应，但对企业形象或者产品形象的树立恰恰起到了反作用。更好的效果，应该是为品牌塑造一个经久传颂的好故事。


    在如今品牌泛滥的商业世界，消费者更容易为好故事买单，例如：钻石恒久远一颗永流传；泰坦尼克号沉船中打捞上来的路易威登皮箱。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_324_0.png)


    就像一诺老师的课程案例，都是来自于弟子或顾问案例中的精品，活灵活现的画面，生动的表现形式，让每一位听众都能清晰铭记故事中的情节！'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 第十一：不做广告，做口碑


    广告是自己说自己好，时下用户仅凭一个广告就买单的时代已经一去不复返，消费者更愿意相信自己认可群体的口碑。


    就像一诺老师一样，所有的教学都来自于实战案例，所有的书籍、课程都来自于 100% 的实战案例，所以企业家听着很有感觉，就一传十十传百，一诺老师从来不做广告，而是秉承一诺出品必属精品的鉴定信念。坚持打造最实战的商业案例！最落地的实操经验！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_325_0.png)


    未来，口碑是品牌传播的最有效途径，如何打造口碑，必须把握好以下三点：


    +   1. 引导口碑，即，你希望你的品牌传播什么样的口碑，你就引导产生如此的口碑。


    +   2. 宣传口碑的平台和群体很关键，每个人都毫无防备的愿意相信权威、专家、著名商家、成功人士等。'
  merge: -1
  img_proc: true
