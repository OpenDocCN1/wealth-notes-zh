  md: '# 改变世界商学院 世界企业家的摇篮《全球赚牛日的收钱剧本》一诺老师专用


    韶山红色管理学院、党性教育基地，刘院长亲自迎接，并在韶山国宾馆正门口打出标语：


    热烈欢迎改变世界商学院院长们莅临韶山。


    第二天一早，改变世界全体院长及学员们列队前往毛爷爷铜像广场，由武警托住花篮带头，我们紧跟其后，整齐地、怀着无比庄严和崇敬的心情向毛爷爷敬献花篮！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_369_0.png)


    研修期间，学员们通过学习《毛泽东思想商战》，进一步研究华为集团、万科集团、立白集团、万和集团、温氏集团等多家上市集团公司的创业史及商战策略。


    学习期间，我们瞻仰了毛家祠堂、毛爷爷纪念馆、毛爷爷易物馆、毛爷爷故居、滴水洞、虎歇坪等，并祭拜了毛爷爷的祖父！


    在学习期间，我们特意安排了去毛家饭店总部，并荣幸邀请了毛家饭店创始人汤妈妈。'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# 改变世界商学院·世界企业家的摇篮《全球贿牛日的收钱剧本》一诺老师专用


    88岁的汤妈妈听说我们要来毛家饭店总部,早就准备好了,为我们准备了贵宾厅。


    当我们正在品尝毛爷爷最爱吃的红烧肉和韶山特色菜,开席没多久汤妈妈就进来迎接远方的客人,给现场的每位同学和校长们都送了一枚毛爷爷像章。


    她在改变世界商学院的邀请下,讲述了她的创业史。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_370_0.png)


    1946年,汤瑞仁嫁到韶山冲毛凯清家。


    她的家在谢家屋场,就是现在的毛爷爷故居武警警卫班所在地,离故居相隔一个池塘的距离。


    毛凯清祖上与毛爷爷家是邻居,关系挺好,毛爷爷离开韶山前,还为他们家送过米、砍过柴。毛爷爷是一个念亲情的人,在汤瑞仁生活困难之际,主席还自掏腰包,给她寄来了8丈呎呎布,让她给家里人做衣服。'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 改变世界商学院 世界企业家的摇篮 《全球暖牛日的收钱剧本》一诺老师专用


    成长在改革开放的春风中，汤妈妈 50 岁那年，看到很多人都来瞻仰毛爷爷故居，汤妈妈想做点好事，就把家里的绿豆粥拿出来给来往的客人吃，当时汤妈妈纯粹的是做好事，就是让外地游客感受韶山热情。


    当时，很多客人吃了粥之后，就非常感激，虽然汤妈妈不要钱，但还是很多人给汤妈妈钱。


    汤妈妈 1 块钱的绿豆，7 毛钱的白糖就靠摆地摊起家了。

    有一次客人喝了绿豆稀饭，喝完之后感慨：这绿豆粥是热的，感受到了韶山人民的热情，可是这稀饭也吃不饱肚子呀，如果哪里有地道的韶山菜，那该有多好？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_371_0.png)


    # 客户最大的需求，就是最大的卖点！


    这说者无意，听着有心。汤妈妈就在自己家里做饭，然后招呼客人去家里吃，而且从创立到今天，客人的红烧肉吃完了，可以加肉，加肉不加钱！'
  merge: -1
  img_proc: true
- pgno: 372
  md: '各位，这叫做：爆款营销。


    用一款产品引爆市场！红烧肉作为营销亮点！


    现在外面很多人教爆款营销，其实 30 年前毛家饭店创始人汤妈妈就在用，这个营销方式，在 15 年前我就在课堂上讲过无数次，在我的相关书籍都有讲述。


    各位，你可不要小看这个动作，三个方面都很敏感：


    第一，虽然改革开放了，但是许多人还是在观望，不敢做，他们都怕。怕什么？枪打出头鸟呗，所以你看看我，我看看你，都不敢干，而汤妈妈可谓是女中豪杰，带头做！


    这叫相信，相信国家的改革开放是真的！四个字：简单相信！用汤妈妈的话来说：风风火火上九州，该出手时就出手！


    第二，地点在哪里呢？就在毛爷爷故居家门口池塘边的树荫下。这可是老大胆了，你认为呢？


    第三，居然叫“毛家饭店”！


    各位，这是典型的傍大款模式，而且占尽了天时、地利、人和。


    天时：改革开放；'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# 改变世界商学院 世界企业家的摇篮 《全球赚牛日的收钱剧本》一塔老师专用


    地理：韶山人，而且是毛爷爷对面邻居；


    人和：丈夫也姓毛！所以叫毛家饭店，有毛爷爷最爱吃的韶山菜和红烧肉！


    另外你可能会问，汤妈妈叫汤妈妈吗？当然不是，汤妈妈一生豪爽乐善好施，她老人家做过的公益事业不计其数，例如：


    汶川地震，汤妈妈把家里所有的现金全部捐出去，镇里面捐款，邀请她捐款！县里面邀请她捐款！市里面邀请她捐款！到了省里面，她就把全部的钱一分不剩的捐完了。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_373_0.png)


    当时她还是觉得自己奉献的太少了，她冲舞台拿起麦克风，说了一句话，震撼了所有在场的人，这句话让她在三个月多开了几十家分店。


    微信搜索公众号“改变世界商学院”输入“毛家饭店模式”就可以得到这一课的亮点和商业模式图解。


    募捐现场，汤妈妈感动了现场所有人。'
  merge: -1
  img_proc: true
- pgno: 374
  md: '汤妈妈提出一个大胆的建议，当场谁愿意借钱给汤妈妈，


    借多少她就捐多少！


    最后，当场某银行为汤妈妈贷款捐款！


    各位，你知道什么叫境界了吧？当时古今中外都没有这样的人，而且是一位老人家，而且是女人！


    汤妈妈为什么叫汤妈妈？因为她养了两千多个小孩，供他们读书生活，有很多都当老国家干部、领导，也有大企业家。


    所以，熟悉她的人都称她为汤妈妈！


    汤妈妈还建立了：残疾基金、教育基金、老年基金！


    汤妈妈说：“人民币不是我的，是人民的！所以，钱不能装在我的口袋，要取之于民用之于民！钱用完了是钱，用不完的是纸，要把钱用来做好事！她说不要给自己孩子留钱，要留下精神财富！”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_374_0.png)


    子若强于我何须我留钱，子若不如我留钱又何用！'
  merge: -1
  img_proc: true
- pgno: 375
  md: '这就是境界，难怪 88 岁还能如此激情。


    所以，你知道为什么这么多的人加盟汤妈妈的毛家饭店了


    吧？都是因为汤妈妈不是为了自己，是为了别人！


    汤妈妈 88 岁高龄还能在 2017 年的 30 周年大会给几千人开


    会。是什么让她激情澎湃魅力四射？是责任！


    汤妈妈积德行善，我本次希望将她的精神传播给更多有使命感的企业家！


    如果今天你在听《商业模式·顶层设计》请你仔细的听，慢慢的回味，多听几遍，当你听了一百遍以上，奇迹将会在你身上出现。


