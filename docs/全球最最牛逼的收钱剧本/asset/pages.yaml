  img_proc: true
- pgno: 282
  md: '甚至，有些医生居然把依云水矿泉水列入了药方，遇到一些疾病，直接药方就是喝多少天的依云水矿泉水。


    你是不是觉得不可思议？


    就连拿破仑三世和他的皇后也对依云水矿泉水情有独钟。


    1864 年，拿破仑三世正式给小镇赐名为，依云镇。


    1878 年，依云水矿泉水，凭借卓越的理疗功效获得了法国药学院的认可。


