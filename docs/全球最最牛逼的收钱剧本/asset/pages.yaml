- pgno: 79
  md: '如果你听到这里，以为春天就是摆地摊的，太小看他了。


    里面有商业模式。


    每当学生走完的时候，学校门口摆摊的小商贩，就开互相打听：你今天赚了多少钱？


    当别人走到春天这里的时候，春天刚好在那里数钱，春天拿出五百多在那里数。


    各位，一块两块的四五百，也很恐怖哦，别人看春天数钱，那个眼睛都发绿光！


    就问春天，卖了多少钱？


    春天一听，不慌不忙的，很遗憾的摇摇头说，“唉，才卖了五百多！”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_79_0.png)


    他们很惊讶的说：我半个月也卖不了你这么多呀，春天说：“唉，这算啥，前天在另外一个学校门口卖了 800 多，今天生意不行，唉……”'
