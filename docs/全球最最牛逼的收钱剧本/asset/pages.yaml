  md: "# 第 48 课：从年亏损 300 万到狂赚 800 万【关键按钮】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式•顶层设计》。\
    \ \n\n春天承包了 15 个电影院，做卖水的生意。你说这夏天喝水的人多，可是冬天喝水的越来越少，一年有 5 个月在亏损，每个月要亏损人工和租金，一个冬季要亏损\
