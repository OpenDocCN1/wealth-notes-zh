    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_113_0.png)


    再给大家讲个案例：


    桂林阳朔本地美食最出名的一道菜，就是啤酒鱼，由于卖的人太多了，价格竞争也激烈，从一百多一条鱼，最后竞争到 38 元一条鱼。


    正当大家火拼的时候，有一个叫二姐的比较聪明。


    她也运用了【傍大款模式】第二招：傍名人


