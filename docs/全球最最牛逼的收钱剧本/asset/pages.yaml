- pgno: 196
  md: '滴滴打车预见了网约车是一种趋势！


    摩拜单车先行一步，预见了未来，看到了人类对环保的渴望，对健康的渴望！


    2017 年摩拜单车完成了 E 轮融资 6 亿美元。所以，大钱都是追着趋势走的！大钱不是看你眼前赚不赚钱，凡是你能看到的利润都是小钱，真正的大钱是资本的趋势！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_196_0.png)


    其实摩拜单车属于第一种分享模式。


    摩拜的核心创新是：他们自己制造自行车，有一个实实在在的制造业工厂。制造自行车后，摩拜并不直接卖自行车，而是卖自行车的服务。国际上对此有个专用名词，叫“产品服务系统”（PSS），或者叫做服务性制造业。


    这是分享经济的第一种，充分利用资源，做分时段租赁。


    比如一辆自行车，卖给一个人，他不会 24 小时都使用，但是现在分时段租出去，可以让更多人受益。'
