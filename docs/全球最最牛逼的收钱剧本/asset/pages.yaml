- pgno: 317
  md: '比如说，当你遇到打雷，就想起来要下雨！


    当你饿了就想要吃饭！


    当你一个人单身久了就想要找另一半。


    当你困了累了想起来什么？红牛！


    不是每一种花都能代表爱情，玫瑰做到了！


    不是每一条河都能代表母亲，黄河做到了！


    不是每一个老师都能代表实战，二诺老师做到了！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_317_0.png)


    # 第二：品牌关键词


    你的品牌等于什么？


    宝马等于驾驶；沃尔沃等于安全；佳洁士等于防蛀；海飞丝等于去屑。


    重点来啦，你的品牌等于什么？


    品牌成功与否，关键的一点是你是否能为你的品牌找到一个关键词，使你的品牌名称能够与这个关键词划等号。'
  merge: -1
  img_proc: true
- pgno: 318
  md: '一看见你的品牌、一听见你的品牌就会马上联想到这个关键词，最终将你的品牌与这个关键词符号化。


    # 第三：品牌宣传语


    简洁、朗朗上口、能够调动用户的情感联想


    +   - 王老吉：怕上火就喝王老吉

    - 红牛：你的能量超乎你的想象

    - 人头马：人头马一开，好事自然来

    - 农夫山泉：有点甜

    - 京东：无假货

    - 格力：掌握核心科技


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_318_0.png)


    一诺老师：全世界最伟大的梦想导师


    +   - 《猪买单》：让世界免费

    - 《全球疯狂吸金》赚钱变的像呼吸一样简单

    - 《全球疯狂变现》金钱如潮水般向你涌来'
