- pgno: 78
  md: '因为贫穷，春天在很小的时候，寒暑假就开始做童工。因为有在食品厂做过的经验，春天就自己做了一个小食品，像葡萄一样，晶莹透明，春天就给给它起了一个名字叫：“海葡萄”，于是，春天就拿到学校门口去卖。


    那时候，电视上有个广告语叫：喝了娃哈哈，吃钣就是香。


    于是乎，春天也给自己的产品，起了一个广告语：


    不到长城非好汉，不吃海葡萄真遗憾。


    春天明白，做市场要标新立异，要有特色。


    春天等学生放学的时候，开始叫卖：“不到长城，非好汉啊！不吃，吃，吃，吃，海，葡萄，真，真，真，遗憾。”


    很多学生听到后，都哈哈哈大笑。


    都开始模仿春天结巴，不不吃葡萄真真真遗憾那。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_78_0.png)


    你以为春天真结巴吗？


    春天的这种做法叫做：花样销售。'
