  md: '# 改变世界商学院 世界企业家的摇篮 《全球赚牛B的收钱剧本》一诺老师专用


    玛咪姐把实惠带给了20多家公司，同时20多家公司也成就了玛咪姐。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_179_0.png)


    玛咪姐之前面临倒闭、被债主催债，员工工资发不出，后来因为学了商业模式·顶层设计的课程，用了课程里其中一个商业模式，就使自己的企业起死回生，而且，当月实现赢利！


