  md: '到了 21 岁考上大学，却没有钱交学费，他头也不回地带着撇下的 41 元去温州自谋生路。起初，李 evaluation  不想干了，为什么呢？因为李
    evaluation 之后，李 evaluation 卖过太阳镜，还在一家剃须刀厂做过焊接工。


    有一天，李 evaluation 他开始跟老师傅学修车，很快成了一把好手。但他看见师傅们一辈子都在这儿修车，根本没啥出息，急着想找一个有出息的行业。


    你看看，这李 evaluation


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_260_0.png)


    # 不安分是老板的基因之一！


    这时一家小剃须刀厂招他去做焊电路板。为了多赚钱，他每天只睡三四个小时，累了，就在地上搭个木板睡一会。一个

    月下来，能赚 1000 多块，工资比前年翻了三番，因此他格外地珍惜。'
