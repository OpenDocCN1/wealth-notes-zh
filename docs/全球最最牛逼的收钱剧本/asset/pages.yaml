  md: '# 第21课：打劫中国乳业巨头利廖的上瘾模式


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    翻开字典，上瘾被定义为，用于描述精神强迫或过度的心理依赖。例如：酒、烟、游戏、网络、赌博、手机等……


    这一类东西都很容易让人上瘾，人们一旦沾染，就很容易习惯，通俗点解释就是——上瘾，让人习惯的沉迷其中，难以自拔，最终上瘾！


    上瘾的力量如此可怕，能不能创造一种让顾客对企业产品、或者服务呈现出欲罢不能、持久忠诚的商业模式呢？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_199_0.png)


    如果企业的商业模式能够具备成瘾性，让顾客对你的产品'
  merge: -1
  img_proc: true
- pgno: 200
  md: '产生依赖，肯定会引发惊人的、甚至疯狂的消费浪潮，那个时候，消费者的钱包就是你的！


    一诺老师通过对众多企业的研究发现，这种模式不仅存在，而且许多企业用上瘾模式创造了巨大的商业价值！


    假如有一天，突然没有了汽车、没有了电梯、没有了电视、电脑、没有了手机、没有了游戏、甚至没有了互联网，那样的日子你能想象吗？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_200_0.png)


    你可能会不适应。为什么？因为你已经上瘾了！


    这就是我今天要讲的：上瘾模式！


    大家都听过，伊利和蒙牛吧。实际上，真正赚钱的公司，


    在伊利和蒙牛的背后，这个公司的名称叫做——利乐公司！


    我们只知道蒙牛和伊利赚钱，其实我们不知道在蒙牛和伊利的背后，有一家更赚钱的公司。因为，伊利和蒙牛这些乳液巨头，1/4 的钱都利乐公司拿走了！'
  merge: -1
  img_proc: true
- pgno: 201
  md: '1997 年之前，伊利只是一家小型乳品厂，主要服务于呼和浩特周边地区。伊利公司有个愿望，就是渴望有一天能够将质优价廉的本地乳品送往全国，特别是乳品发展迅速的华南地区！


    但是，由于技术的限制，加上包装设备跟不上，不能长时间保存，所以，生产出来的产品保质期太短，容易变质。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_201_0.png)


    伊利，当时还只是一家小工厂，所以在选购产品设备的时候，会综合考虑到性价比，选来选去都找不到一家合适的包装设备厂家。


    正当伊利公司，一直希望将质优价廉的本地乳品，送往全国之时，利乐公司出现了。


    成立于 1951 年的瑞典利乐公司，1972 年就进入中国市场，是最先为液态奶提供包装的公司之一。


    两家公司一拍即合，立刻展开了合作。


    有人问，伊利当时是个小厂，资金实力不是很雄厚，购买'
