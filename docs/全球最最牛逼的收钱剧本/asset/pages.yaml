  md: '# 改变世界商学院 世界企业家的摇篮 《全球晾牛日的收钱剧本》一诺老师专用


    政府办事往往效率低、成本高。而摩拜单车抓到了市场真正的痛点：随停随取。政府只要允许白线停车就行。人们到地铁最后一公里的老老大难问题就有可能迎刃而解。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_193_0.png)


    摩拜单车利用手机 APP 进行手机绑定和实名制注册，新用户缴纳 299 元作为押金。完成注册之后，打开 APP 就可以寻找附近的单车，扫码进行租借。使用完毕后将摩拜单车还至任意马路边、政府规定的停车区域，锁上车锁即可完成还车，并自动计费。摩拜单车目前租借费用为
    1 元/半小时，可通过微信或支付宝支付。一切自动化！


