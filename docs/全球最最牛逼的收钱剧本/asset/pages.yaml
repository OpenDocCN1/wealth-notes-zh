  img_proc: true
- pgno: 356
  md: '将七八岁的孩子集合，让他们亲自肢解敌人，挖出他们的心脏，培养嗜血的狼性；对内亲手杀害自己的亲人泯灭天生的人性，更惊悚地是向孩子的太阳穴注射可卡因等毒品进行精神控制。


    娃娃军中甚至有女童白天持刀杀人，晚上沦为性奴。


    十三岁的塞拉利昂少年比亚不幸加入娃娃军，沦为杀人机器，后来被解救后提笔写下了《长路漫漫》一书，记下了这一人类历史上惨绝人寰的战争。


    塞拉利昂的内战从 1991 年开始，持续了整整十一年，造成了 5 万人死亡全国三分之一的人口流离失所。


    其出产的钻石成为了无数恩爱的情侣手指的订婚信物，却也沾满了非洲人民的鲜血。


