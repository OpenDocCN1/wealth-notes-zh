  md: '各位，把这句话记下来：所有的问题都是能力不够！


    后来参加了一诺老师线下课程，由于一诺老师的课程都是现场商业模式落地，所以莫总在三天三夜的系统学习中重新改良了商业模式，每天晚上跟小组同学进行商业模式头脑风暴，因为每天晚上我都会跟我的顾问辅导团队在现场辅导学生落地。


