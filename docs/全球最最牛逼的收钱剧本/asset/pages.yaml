- pgno: 353
  md: '钻石的珍贵不是看大小，而是看做工和切面。于是又炮制了大量行业的标准，如今你去柜台上听服务员向你拧出什么净度 4C 等专业术语，跟睁眼说瞎话的售楼小姐没什么两样。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_353_0.png)


    你以为营销到这个高度就可以了吧？远！没！有！

    戴比尔斯已经把女人的心理研究到登峰造极的地步。

    比如他们研究显示，对于钻石这种奢侈的商品女人的心理是矛盾的。


    一方面，她们对首饰有着天然的占有欲，一方面又认为主动索取会带来良心的负罪感。


    所以戴比尔斯的营销策略，在八十年代又开始强调钻戒应该跟惊喜结合：一个男人默默买了钻戒，在一个精心安排的场合突然送出，这才能最大程度上化解女性的矛盾心理。


    一方面她们拥有钻戒带来的极度喜悦，一方面又保持了女人的纯真。'
  merge: -1
