  md: '![](img/ff9006615a5a1a6bfb1f601f8b3f246b_276_0.png)


    这张照片被他拍到了，他赶紧飞回东京，经过一番秘密的准备，一个月以后，克林顿夫妇访问日本，两口子访问日本的当天，一下飞机，当天日本的所有的报纸上头版广告就是这张照片，并且上面写了一句话：“告诉日本男人一个秘密，希拉里穿的是山树内裤。”


