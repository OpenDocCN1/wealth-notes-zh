  md: '# 第 47 课：把公司做小,把市场做大【行业模型】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    莫总曾经是亿万富翁，做房地产三级市场，也就是房地产中介，由于竞争压力大，公司不得不面临倒闭危机。正当对整个行业绝望的时候，莫总上了商业模式顶层设计课程，从此公司起死回生。他是如何做到的呢？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_439_0.png)


    先给大家普及一下房地产市场的概念，房地产市场分为三个级别：


    房地产一级市场又称土地一级市场，是土地使用权出让的市场，是国家通过其指定的政府部门，将城镇国有土地或将农'
  merge: -1
  img_proc: true
- pgno: 440
  md: '村集体土地征用为国有土地后，出让给使用者的市场。房地产一级市场是由国家垄断的市场。


    二级市场，是土地使用者经过开发建设，将新建成的房地产进行出售和出租的市场。


    三级市场，是购买房地产的单位和个人，再次将房地产转让或租赁的市场。也就是房地产再次进入流通领域进行交易而形成的市场，也包括房屋的交换。房屋中介指的就是这个市场的从业人员。


    莫总刚好是房地产三级市场，也就是房地产中介，20年前刚刚工作的时候，虽然莫总是一名研究生，可是却不够养家糊口，更别说实现人生的梦想和抱负了。后来就到处学习，希望改变命运！因为莫总深深地知道，只有脑袋富有口袋才能鼓起来！


