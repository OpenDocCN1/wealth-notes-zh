- pgno: 80
  md: '他们一边炉总一边问春天：“你小小年纪怎么不读书？”


    春天说：“读啥书，每个月赚这么多钱，大学出来，也不一定赚这么多钱，对吧！”


    他们一听：“噢，有道理，小小年纪，这么厉害。”


    他们又问：“你这个产品哪里弄得？”


    春天回答：“嘿，我自己发明的。”


    他们说道：“你的技术教给我吧。”


    春天说：“那怎么行，教会你就抢我生意了，我这个技术，每个月赚两三万呢。抽支烟还是可以的，学技术就免了吧。”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_80_0.png)


    于是，春天拿出几十块钱一包的香烟给他们抽。


    在那个年代，90年代，几十块钱，什么概念！


    我估计，他们从来不舍得买这么好的烟，他们的烟都是几块钱一包的。


    他们心里会这样想：“舍得抽这么贵的烟，一定是赚到钱了。”'
