  md: '# 第29课：一瓶水几百块畅销140个国家【板蓝根模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    【依云水】你喝的不是水而是神奇的故事


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_279_0.png)


    一瓶水的价格，是多少钱呢？大多数人的印象也只不过是1元或者2元而已。


    瓶装水竞争越来越激烈，瓶装水的价格也进入了微利时代。


    可是，就有人就把水卖到了几十元，甚至是上百元一瓶，而且畅销世界140多个国家，他，是怎么做到的呢？


    先给大家猜个谜语：有一种东西，味道有点苦，可以治疗感冒，可以清热解毒，咽喉不好可以用它，头痛可以用它，腮'
  merge: -1
  img_proc: true
- pgno: 280
  md: '腺炎可以用它，斑疹可以用它，身上起疮可以用它，它还具有广谱抗菌作用（包括：痢疾细菌、沙门氏细菌、溶血性链形菌），是抗菌消炎、止痛、退热的传统中草药）。


    这个是什么呢？这就是 430 年前李时珍的重大发现。


    这个发现就是——板蓝根！


    各位，有时候你有没有在想，这也太不可思议了，板蓝根好像啥病都可以治，感冒、上火、发烧、预防乙肝、甚至可以预防非典。


    有一天，我饿了，因为低血糖，有点晕，我就喝了一包板蓝根，十分钟后症状缓解了，我举杯感叹，这板蓝根实在是太牛了！


    对的，这就是我们今年要讲的商业模式——板蓝根模式。


    板蓝根模式的公式，我之前在公众号里面有讲过。


    微信搜索公众号 “改变世界商学院” 输入 “板蓝根模式” 就可以得到这个模式的更多案例。


