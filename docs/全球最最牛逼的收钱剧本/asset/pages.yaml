    我们来分析一下，他得到哪些好处：


    第一，碧海云天瞬间抢购一空。这比明星剪彩带来的价值多了去了。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '第二，利用这个机会结识了社会各界名流。因为总统来了，你不要来看看看？平时请都请不到的社会名流，那天都齐聚一堂。而陈董是东道主，当然结交人脉就非常容易了。


