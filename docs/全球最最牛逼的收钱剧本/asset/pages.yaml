  md: '# 第19课：可口可乐畅销全球的【秘密模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    在欧洲流传着这样一个故事：世界上最不为人知道的三个秘密，分别是：英国女王的财富；球星罗纳尔多的体重和可口可乐的配方。


    可口可乐的配方是可口可乐公司最大的秘密，世界上只有两个人知道可口可乐的配方，而根据公司规定，这两个人不允许同时乘坐同一架飞机，以防飞机失事。


    可口可乐的配方是怎么来的呢？故事发生在美国南北战争时期，有一名受伤的军人叫约翰，因为在手术中使用大量的吗啡。约翰的伤痊愈后，却发现自己染上了毒瘾。为了戒掉毒瘾，约翰开始学习药剂配方，研究古柯的成分。古柯叶（可卡因的制作原料），古柯的叶子，可以入药，有提神醒脑、补肾壮阳和'
  merge: -1
  img_proc: true
- pgno: 183
  md: '镇痛的药效。


    约翰通过研究调制出了一杯黑黑的神奇药水，这就是世界上第一杯可口可乐的原型。


    所以，可口可乐公司是美国唯一一家可以进口古柯叶的公司。在美国药监局（DEA）全程严格监控下，叶子中的可卡因被提取出来用作医药用途，其他剩余物质再返还给可口可乐公司用于制作可乐的添加剂。


    > 记住这句话记下来


