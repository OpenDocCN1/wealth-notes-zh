  md: '# 第15课：零投入1天销售额3亿【模式组合】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    袁总是当地养鸡大户，因为竞争激烈，生意难做，成本增加，利润微薄，找不到出路，看不到希望，偶然机会学习了《商业模式·顶层设计》，袁总不花一分钱，整合了全市的养鸡场，不仅不花一分钱，被整合的养鸡场，还入股了袁总的公司。最后，创造了一个奇迹：一天销售1千万只鸡，销售额达3个亿。


    他，是如何做到的呢？


