  md: "# 第34课: 世界500强打造品牌11个规律【品牌艺术】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式•顶层设计》。\
    \ \n\n老和尚问徒弟们：\"如果你去山上砍树，正好面前有两棵树，一棵粗，另一棵细，你会砍哪一棵？\n\n问题一出，大家都说：\"当然砍那棵粗的了。\"\n\
    \n老和尚一笑，说：\"那棵粗的不过是一棵普通的杨树，而那棵细的却是红松，现在你们会砍哪一棵？\"\n\n大家一想，说：\"当然砍红松了，杨树又不值钱！\"\
    \n\n老和尚又问：\"那如果杨树是笔直的，而红松却七歪八扭，你们会砍哪一棵？\"\n\n大家想了想说：\"如果这样的话，砍杨树。\"\n\n老和尚目光闪烁着，他说：\"\
    杨树虽然笔直，可由于年头太久，中间大多空了，这时，你们会砍哪一棵？\""
  merge: -1
  img_proc: true
- pgno: 316
  md: '大家赶紧说：“那还是砍红松。”


    就像砍树的故事，要是从一开始就知道这两棵树的特征，


    可能就不需要这么反复无常地改变决定到底砍哪一树。


    许多企业家一辈子都不知道如何打造品牌，所以打造品牌


    有一个规律，早一点了解，早一点明确方向。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_316_0.png)


    关于如何打造品牌？


    在营销中，你必须了解以下 11 个关键：


    # 第一：品牌定位


    你是誰，你为誰服务，必须搞明白


    商业不是产品之战，而是顾客心智之战。


    顾客心智中不存在企业，只有品牌。


    做品牌就是細分客户的行为，这个过程最重要的是定位。


    所谓定位，就是让品牌在用户的心中占据最有利位置，使


    品牌成为某个类别或用户某一需求的首要识别。'
