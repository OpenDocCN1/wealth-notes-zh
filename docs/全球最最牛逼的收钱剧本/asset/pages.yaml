  md: '# 第24课：一诺千金成霸业,言而无信丢江山【诚信】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    今天给大家分享世界排名 15 位并垄断欧洲海运贸易商业秘密。


    2300 多年前，也就是春秋战国时期，秦国的商鞅在秦孝公的支持下主持变法。


    当时正处于战争频繁、人心惶惶之际，为了树立威信，秦国进行改革，也就是我们熟悉的“商鞅变法”，


    有一天，商鞅下令在都城南门外，立一根三丈长的木头，并当众许下诺言：谁能把这根木头搬到北门，赏金十两。


    围观的人，根本不相信，如此轻而易举就能得到这么高的赏赐，结果围观的人很多，你看看我我看看你，就是没有一个人愿意试一下。'
