  img_proc: true
- pgno: 336
  md: '有一个记者曾经采访美国船王，问他：“请问我们想创业没有钱怎么办？”


    美国船王告诉记者：“那就去借呀！”


    记者问：“如果，还不起怎么办？”


    美国船王说：“你先向银行借几十万出来用用！”


    记者问：“如果还不起怎么办？”


    美国船王说：“那就再跟银行借几百万？”


    记者很惊讶：“啊？那，那如果还不起怎么办？”


    美国船王说：“那就再去借几千万！”


    记者很惊讶：“那如果还是还不起怎么办？”


    美国船王非常生气，说：“我告诉你一个全世界富人都知道的秘密，这个秘密叫做【有钱人的钱都是借来的！】”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_336_0.png)


    请为你：银行的钱是自己的吗？不是的，是储户的钱！


    请问你：上市公司 的钱是自己的吗？'
  merge: -1
  img_proc: true
- pgno: 337
  md: '当然不是，是股民的钱！

    请问你：房地产开发商的钱是自己的吗？

    当然不是，是银行和股民的钱！

    富人总是明白一个道理：借鸡下蛋！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_337_0.png)


    最后，美国船王给记者说了三句话，这三句话帮助了全世界无数创业者白手起家，想知道这三句话是什么？


    微信搜索公众号“改变世界商学院”输入“借鸡下蛋模式”就可以得到这一课的商业模式图解。


    下面一诺老师带你去扒一扒王嘉廉的成功之路吧。


    王嘉廉 8 岁就随父母从台湾移民美国，与来自麻省、斯坦福的硅谷明星有一个显著的不同，他毕业于一所普通大学：纽约皇后学院，而且不是成绩好的学生。'
  merge: -1
  img_proc: true
- pgno: 338
  md: '王嘉廉成绩不好的第一个原因是，上学的同时还要做邮递员、餐馆侍应生、货车装卸工、收银员，并在杂货铺工作过，往往连 32 美分一顿的午饭都吃不上。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_338_0.png)


    另一个原因是，他讨厌传统教育，尤其是强制灌输的教育方法。他说：“背诵答案并不重要，重要的是如何得到那个答案。也就是过程比结果更重要。”


    因此，相比读书，王嘉廉花更多心思到那些兼职工作上，并且开始研究商业背后的成败逻辑，想从中找到一些商业模式。在告别皇后学院时，王嘉廉看到《纽约时报》整整两页半都在招聘电脑程序员，认定这个行业将来大有前途。他想办法进入哥伦比亚大学电子研究实验室，边工作边学程序开发。


    再之后，他进入到一家电脑公司工作，并在不久后，他终于等到了一个创业机会。'
  merge: -1
  img_proc: true
- pgno: 339
  md: '瑞士 CA 软件公司正在美国寻找销售代理，他认为这是一个创新的好机会，并且相信自己有能力做好这个事情。


    但是没有钱怎么办呢？


    王嘉廉靠透支信用卡借钱，他一个人的信用钱太少，就找到小伙伴一起办信用卡！最后借到 400 美元，王嘉廉和几个伙伴费尽九牛二虎之力，得到这门生意。


    王嘉廉曾经接受记者采访时这样说："我们用这个月的收入，去还上个月的信用卡，然后再透支。好长一段时间，我们都靠这笔信用卡透支周转。"


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_339_0.png)


    因为有这段经历，后来有人问王嘉廉，你和比尔·盖茨的区别是什么？他说："比尔不知道饥饿的滋味。"


