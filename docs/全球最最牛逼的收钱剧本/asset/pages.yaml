- pgno: 62
  md: '# 第07课：让最冷门的生意立刻火爆起来【倒贴模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。

    先给大家讲个故事：老王赶了20头猪，去集市上卖猪。走到半路天黑了，又刚好下起了小雨，附近只有一户人家，他就上前敲门，开门的是一少妇。


    少妇说：家里只一人，实在是不方便。


    老王说：求你了大妹子，你看着下雨了，而且前不着村后不着店，干脆我给你一头猪。


    少妇想：看在一头猪的份上，就让他进来吧。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_62_0.png)


    老王把猪赶进院子……


    少妇对老王说：我们家只有一床，你就睡地上吧。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '老王心想睡在地上凉冰冰的，生病了不划算，就对少妇说：


    我也到床上睡，再给你一头猪。


    少妇想了一下，看在猪的面子上，那好吧，就同意了。


    这孤男寡女的，睡在一个床上，老王心里就直打鼓，睡到半夜老王精虫上脑、饥渴难耐，就悄悄地对少妇说：“美女，我到你上面睡好不好？”


    少妇非常生气地说：“不可以，我警告你！不要胡思乱想，好好睡觉！”


    老王心想：世界上没有无缘无故的爱，平白无故的人家肯定说不可以。于是乎，老王对少妇说：“我给两头猪怎么样？”


    少妇一听，心想你怎么不早说，于是对老王说：“你在我上面睡可以，但是不能乱动哟。”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_63_0.png)


    老王答应了，过了一会，老王忍不住了，对少妇说：“我动一下，可不可以？”'
  merge: -1
  img_proc: true
- pgno: 64
  md: '少妇很生气的说：“不可以”


    老王心想：不是鱼儿不吃钩，只是鱼饵不够香！


    于是乎，老王轻声地说：动一下给一头猪。


    少妇听了，心想：你怎么不早说，于是乎，又同意了。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_64_0.png)


    老王上去叭叭叭了一会停了下来，少妇问道：“你为何不动了？”老王说：“说猪没了。”


    这时候，少妇小声说：要不，我给你猪……


    不可思议……天亮后，老王吹着口哨赶 30 头猪，其中自己的 20 头，少妇家的 10 头猪赶集去了……


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_64_1.png)


    通过老王卖猪的故事，我们学到什么？'
  merge: -1
  img_proc: true
- pgno: 65
  md: '第一：要发现用户潜在需求。


    第二：前期必须进行引导和培养用户的需求，因此产生的投入是正常的。


    故事折射出来就是【倒贴模式】


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_65_0.png)


    我再给大家说一说，现实生活中的哪些商家是这个故事的缩影。


    有一种香港的旅行团，就是免费旅游，不但免费旅游，而且倒贴来回火车票、汽车票、机票、四星级酒店住宿、景点门票，而且吃饭也免费的！所以，很多人参加旅行团。


    举例香港免费旅游：


    香港这个地方，难道带你去看海吗？


    或者带你去逛公园吗？你肯定不愿意，香港是购物的天堂。


    所以大家好不容易才去一次香港，特别是内地的人到了香港，


    肯定是三个字：“买！买！买！”'
  merge: -1
  img_proc: true
- pgno: 66
  md: '所以，导游就带你到处去买东西：买完珠宝买玉器，买完玉器买金器，买完金器买衣服，买完衣服买包包，买完包包买手表。有的人买一块手表就几十万。


    各位，我们算一个账：假设一个团 40 人，即使 10 个人就是不买一件东西，那至少剩下的 30 人是一定会多多少少买一些，人均消费 2 万块，一个旅行团下来，就可以赚到
    10 万至 50 万。


    > 记住这句话下来

    先免费，后收费，免费就是为了更好的收费！

    — 诺老师


    紧接着，导游又带大家去澳门好好放松放松。


    澳门赌场典型的就是【倒贴模式】。


    带过来的客人免费吃、免费住、免费喝红酒。最后倒贴：


    人人送 1000 元筹码。免费！免费！倒贴！倒贴！


    而且，澳门赌场细节做得非常到位，你来这里的时候，人家已经把你的情况摸清楚了，你有多少家底，带了多少钱都一清二楚，甚至现场的空调温度和灯光都是特殊安排的，那个温度是经过计算的，刚好刺激你的头脑，让你头脑发热！'
  merge: -1
  img_proc: true
- pgno: 67
  md: '今天不说更多细节，回到【倒贴模式】上来。


    澳门赌场让你免费吃喝玩乐，让你心情好！让你开心！


    然后送给你筹码，不光是送给你筹码，而且还让你赢钱，


    你用送的 1000 钱，赢了一万多。哇塞，顿时；心情怎么样？兴奋吧？感觉自己的手气真好！运气也好！


    却不知道，那就是对你进行【倒贴模式】。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_67_0.png)


    人家就是自信，敢把钱暂时放你那里。


    结果呢？可想而知，每个人内心都住着一个“贪得无厌”的魔鬼。最后不仅把赢的钱输了，还把带来的钱输得一干二净。


    甚至有人还欠下了高利贷！


    生活中【倒贴模式】的案例太多了。


    比如说举一个小例子：“某些长途汽车，会连续开四五个小时，中途不让你上洗手间，然后把你带到一个地方，你上一次洗手间 2 元，然后吃一个方便面 15 元，吃一个快餐
    30 元。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '好吃不好吃，也得吃，你想去别的地方，不行！


    你不下车，也不行！强行下车休息吃饭。


    而司机过来呢，免费地好吃好喝招待着，吃饱喝足，还倒贴：按人头每带来一个人给司机 5 块钱一个人。一辆车饭店倒贴给司机 200 元以上。


    你想呀，这司机好吃好喝，吃饱喝足，走的时候打着饱嗝，抽着烟，拿着饮料，而且还有 200 块钱，白吃白喝，白拿！肯定积极配合，对不对？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_68_0.png)


    当你知道嘛，每辆车给饭店带来了一两千的营业额。


    其实，这是十几年前就被全国各地广泛应用的【倒贴模式】，倒贴给谁？司机！这就叫做“羊毛出在狗身上，猪买单！”


    如果你看过一本书叫《全球疯狂吸金》你就知道，要贴给鱼塘主！因为他决定要不要你捞鱼！


    生活中，像这种【倒贴模式】的案例，我可以说出 100 多'
