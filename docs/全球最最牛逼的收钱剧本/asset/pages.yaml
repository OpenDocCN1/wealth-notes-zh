- pgno: 263
  md: '企业想要做大就要突破重围，用好材料、生产出好产品，


    才能卖高价。他上来就对标飞利浦双头剃须刀，在人人都做单头剃须刀的年代，双头一出肯定能引爆市场。


    他把自己和团队关在实验室，潜心研究了四五个月的时间，开发出了 9 套关键生产模具，随后生产出了国内第一只双头剃须刀。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_263_0.png)


    接下来，一起见证李马腾用 5 招商业模式把资产打造成了 220 亿的奇迹。


    第一招：饥饿策略。


    第一批产品出厂后，李马腾信心满满地拿去义乌市场推销，每支定价 37 元，价格只有飞利浦同类产品的四分之一。


