- pgno: 21
  md: '因为人家根本不靠这个赚钱。


    你觉得人家疯了！


    结果到最后，却不知道自己是怎么死的。


    什么叫做跨界打劫？


    360 杀毒软件，打劫了整个杀毒行业的饭碗，因为 360 不靠卖软件赚钱，靠广告赚钱，360 披着杀毒软件公司的外衣，赚着广告市场的钱，及大数据和资本运作的钱。


    微信现在 10 亿用户，直接打劫了中国移动、电信和联通的饭碗！微信靠跨界赚钱！通过导入游戏、团购、充值、大众点评、京东、58、滴滴打车、酒店、火车票、汽车票，最重要的是赚资本市场的钱。


