  md: '# 第45课：忽悠170个国家,骗几百亿美金【解密MMM】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式。顶层设计》。


    他没花1分钱就骗走了数百亿美元，骗完这国骗那国，前后骗了20多年，甚至还骗到了中国，没准你的亲朋好友，就曾经上过他的当！而他，只不过是一个普通的程序员，但是却骗过1000万人，收入近百亿美元，他就是马夫罗季。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_419_0.png)


    1955年，马夫罗季出生于莫斯科的一个中产家庭，父亲是一个经济学家，母亲是一个普通工人。受父亲的影响，马夫罗季从小数理化成绩就很好，特别擅长数学和物理，不仅经常在学校举办的数学比赛中获奖，甚至还能替老师讲课。'
  merge: -1
  img_proc: true
- pgno: 420
  md: '高中毕业后，他进入莫斯科理工学院的电子工程专业学习，毕业后，他做过程序员，也做过音频和视频的录像业务，但一直没啥出息，默默无闻。可能马夫罗季也觉得，自己这辈子就这样了。


    直到 1994 年，他遇到了一个翻身的好机会。


    当时，前苏联刚刚解体，在俄罗斯无论官方还是民间，都希望经济快点好起来。看到大家对赚钱如此渴望，马夫罗季想出了一个好主意。


    1994 年 2 月，马夫罗季和两个兄弟，以家族姓氏的第一个字母取名，创办了 MMM 股份公司，注册资金仅为 10 万卢布（当时约合 1000 美元）。


    这个公司，打着投资石油的名义，用“金字塔”式的投资模式，声称要建立金额最大的投资基金，名字叫做马夫罗季全球储蓄罐（Mavrodi Mondial Moneybox），简称
    MMM。


    马夫罗季利用当时民众对俄罗斯金融体系的不满，开始疯狂神化这一产品。


    如何神话呢？'
  merge: -1
  img_proc: true
- pgno: 421
  md: '这是一个“普通人互相帮助的互助基金”，就像一个普通人的社区，互相之间无私的帮助，是一种全球性互助基金。设立的目的不是为了赚钱，而是为了摧毁世界不公正的金融体系！


    当时的俄罗斯，通货膨胀十分严重，老百姓辛辛苦苦赚来的钱，没多久就会缩水，因此，老百姓早已心生不满。而且，马夫罗季还在全国，几乎所有知名媒体投放广告：“只要你向MMM公司投资100美元，半年就可以收到500%的回报。”


    还有，“只要你在公司的平台购买虚拟股票，一个月时间就能获得两倍收益。”


    然而，吃瓜群众还是半信半疑。


    马夫罗季只能加大火力继续忽悠，他说：我是一个数学天才，通过一种“完美的数学模型设计出一套金融复利系统”，“我一根手指头也不会碰这些钱，我只是为投资者们指一条生财之道。”


    而第一批吃螃蟹的人，一个月后果然拿到了两倍收益，他们激动地到处宣传，发财啦！发财啦！买这个MMM公司的产品，真的能赚大钱！就这样，一传十，十传百，赚大钱的机会谁愿'
  merge: -1
  img_proc: true
- pgno: 422
  md: '意错过啊！从刚开始只有几十个人买，半年后居然有 500 万人加入了这个阵营。


    在俄罗斯的 60 多个城市，都有 MMM 公司的办理处，半年就入账了 15 亿美金。


    那这个骗局是怎么被识破的？


    随着 MMM 涉及的人越来越多，俄罗斯政府也终于站了出来，刚开始他们也没把 MMM 放在眼里，没想到最后那么多人中招。


    他们发表声明，开始质疑 MMM 400%的回报率，并且宣布不保证投资这家公司的安全性。


    这下子，大家才如梦初醒，赶紧跑去 MMM 去追回自己的钱，结果一分钱没拿回来。


    这就是庞氏骗局，也就是俗称的“空手套白狼”、“拆东墙补西墙”。


    最常见的套路就是——以高利息忽悠投资者进场，然后用新投资者的钱，去偿还旧投资者的利息，不断吸引新人入场，雪球越滚越大。


    一诺老师总结了一下，一共有几个特点：'
  merge: -1
  img_proc: true
- pgno: 423
  md: '一、承诺高额的回报，高到根本不可能，就像 MMM 宣称的 400%的回报率。


    二、计划本身没有获得利润的能力，或者支撑不起那么高的利润。


    三、靠不断推荐好友、发展下线来赚钱。


    这个套路的关键在于，要有新投资者不断的进场，要是找不到人接盘，或者后续投入的资金，不够偿还利息，游戏就玩不下去了。


    1997 年，MMM 破产之后，马夫罗季也涉嫌偷税漏税被俄罗斯通缉，他一直东躲西藏，直到 2003 年才被捕，因诈骗和偷税漏税被判了 4 年。


    我就纳闷了，骗了几十亿，才判四年，也太轻了吧……


    马夫罗季出狱之后，重操旧业。他跑到印度一看，四个字：


    人傻钱多！


    后来骗完印度骗中国，骗完中国骗南非，全球行骗，一共卷走上百亿美金！


    好了，我们看看他是怎么行骗的！'
  merge: -1
  img_proc: true
- pgno: 424
  md: '2007 年，马夫罗季出狱，你以为他从此洗心革面了吗？并没有。一出狱，他就开始重操旧业。


    在俄罗斯他是骗不下去了，他感觉到骗子太多，傻子明显不够用！马夫罗季选择了外出“闹荫”，跑到了印度一看，我滴个妈妈咪呀，这里真是人傻钱多！一个字：干！


    后来，在印度玩不下去了。


    真是傻瓜遍地走，不止印度有…2015 年 5 月，MMM 平台来到中国，自称金融互助平台，不收钱还绝对合法，一个月能赚到 30% 的利息。


    这次，马夫罗季玩了个新花样，搞了个名为“马夫罗”的虚拟产品，用户必须先以“提供帮助者”的身份购买“马夫罗”。


    本金从 60 元到 6 万元不等。购买了“马夫罗”之后，你的账户会有 15 天冻结期，不能取消订单，否则账户会被冻结，但在 Iris 15 天里，你每天有
    1% 的利息。


    15 天后，系统就会为你匹配其他“提供帮助者”，有人买了你的“马夫罗”，你的钱就能套现了。'
