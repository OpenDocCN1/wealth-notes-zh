  md: '可是，褚时健没有这样想，后来有人问他，你为什么没有被困难打倒，褚时健眼神坚定的说：因为我是褚时健！


    各位，当你面对困境时，请告诉自己一句话。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_406_0.png)


    三年后，褚时健因为严重的糖尿病，在狱中几次晕倒，后来被保外就医。


    经过几个月的调理后，褚时健上山种田，他承包了 2400 亩的荒地，种橙子。那年他 74 岁。


    王石感慨道：我得知他保外就医后，就专程到云南山区探访他。他居然承包了 2400 亩山地种橙子，橙子挂果要 6 年，他那时已经是 75 岁的老人了，你想像一下，一个
    75 岁的老人，戴着一副大墨镜，穿着破旧的圆领衫，兴致勃勃地跟我谈论橙子 6 年后挂果是什么情景。


    所以王石说：我这一生最大的震憾，就是在哀劳山上，是穿着破圆领衫，是戴着大墨镜，是戴着草帽，是兴致勃勃谈论'
