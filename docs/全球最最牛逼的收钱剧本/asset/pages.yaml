  md: '# 改变世界商学院 世界企业家的摇篮 《全球最牛日的收钱剧本》一诺老师专用


    尽管面临重重的压力，优步的方便快捷和颠覆的商业模式，还是彻底征服了世界各地的人们。


    支持者们越来越多，到最后，连政府也都只能对优步默认许。


    投资者们也都青睐这家公司，经过多轮融资后，优步估值一路飙升，这家麻烦不断的公司成功入驻全球 300 多个城市。


    2014 年，优步一轮融资估值达到 350 亿-400 亿美元。


    这个倒霉蛋，打拼这么多年后，终于一跃为了亿万富翁。


    微信搜索公众号 “改变世界商学院” 输入 “优步模式” 就可以得到这一课的商业模式图解。


    但是，2017 年 6 月 21 日，卡兰尼克辞去优步的 CEO 职务。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_417_0.png)


    想成为冠军，就要懂得面对逆境。


    把一切置之度外，无论如何都要取胜。


    这意味着，既然上场，无论发生什么，都要始终对你做的事 情无比热爱。'
