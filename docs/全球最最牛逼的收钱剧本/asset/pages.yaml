  md: '# 改变世界商学院·世界企业家的摇篮《全球聂牛日的收钱剧本》一诺老师专用


    这里做一个简单的盈利预测：摩拜单车的目标是四年免维修，即折旧时间是四年。


    假设一辆车一天之中有效使用时间为 3 小时，一年有效使用天数为 300 天，一辆单车一年收入 900 元，四年就是 3600 元。


    如果一辆车的固定投放成本在 2400 元以下，不考虑其他支出的前提下，盈利是显而易见的。


    此外，未来随着车的数量越来越多，边际成本递减，有效使用时间还有望提高，盈利还会增加。


    摩拜单车要求每名用户交纳 299 元押金，大多正常使用摩拜单车服务的用户是不会把押金取出的，1 万部单车就可以沉淀上亿资金。这会给摩拜单车带来极好的现金流和资本沉淀。


    未来，摩拜单车还可通过广告合作或其他形式的盈利。


    现在你就可以骑着摩拜单车穿梭于校园、城市街道，不仅是方便，更是“酷”和“潮”的时髦劲儿。


    因此摩拜的设计非常迎合年轻人的口味，与高校合作，拉动了时尚的潮流，然后才是水到渠成地实现了绿色出行、环保的社会意义。'
