  md: '# 第33课: 一穷二白三句话成为集团核心【杰克模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    有一个叫徽哥，他没有背景、没有人脉、没有资源、没有学历、更没有创业资金，而仅仅有的就是两个字：梦想！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_303_0.png)


    # 周星驰说，没有梦想跟咸鱼有什么区别！


    徽哥的梦想是拥有高尔夫球场，而且想要很多家！


    各位，没有不可能，只有想不到！


    最后，徽哥做到了，他，是如何做到的呢？


    先给大家讲个故事：一位优秀的商人杰克，有一天告诉他的儿子。'
  merge: -1
  img_proc: true
- pgno: 304
  md: '杰克：“我已经决定好了一个女孩子，我要你娶她。”


    儿子：“我自己要娶的新娘，我自己会决定。”


    杰克：“但我说的这女孩，可是比尔盖茨的女儿哟！”


    儿子：“哇！那这样的话．．．”


    说服的最高境界就是一步一步引导别人说 YES！

    —踏老师


    在一个聚会中，杰克走向比尔盖茨．．


    杰克：“我来帮你女儿介绍个好丈夫。”


    比尔：“我女儿还没想嫁人呢！”


    杰克：“但我说的这年轻人，可是世界银行的副总裁哟！”


    比尔：“哇！那这样的话．．．”


    说服的最高境界就是一步一步引导别人说 YES！

    —踏老师


    接着，杰克去见世界银行的总裁。'
