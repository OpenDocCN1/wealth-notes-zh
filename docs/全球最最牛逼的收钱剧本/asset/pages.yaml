  md: '我还告诉你，当时的山树只剩下最后的三千万日元了，三千万在东京这种世界一级的市场打广告，泡都不会冒一下，况且仓库还要花钱，员工还要工资，这些问题都是要解决的，这些钱是远远不够的！


