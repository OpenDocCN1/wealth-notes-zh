  md: "# 第38课：征服全世界的男男女女【钻石模式】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。\
    \ \n\n如果我告诉你全世界的钻石全部开采出来，每人 10 个手指头，每个手指头带 5 个，10 个脚指头每个脚指头带 5 个，如果是这样，你还会觉得钻石珍贵吗？不会！\n\
    \n你还会购买吗？不会！\n\n为什么？因为物以稀为贵！\n\n![](img/ff9006615a5a1a6bfb1f601f8b3f246b_348_0.png)\n\
    \n那为什么卖那么贵？为什么还有那么多人买？\n\n我们一起来拆解钻石的商业模式！"
  merge: -1
  img_proc: true
- pgno: 349
  md: '钻石在被发现以后很长一段时间，都是皇家和贵族炫耀财富的饰品，产地固定而且产量稀缺。十九世纪后期发生改变，因为南非居然神奇地发现了一座钻石矿，产量有几千万克拉。


    这一下不得了，那些投资钻石的商人彻底傻眼了。如果这些钻石进入市场，钻石的价值将大打折扣。于是，一个叫罗兹的英国商人在 1988 年创建了大名鼎鼎的戴比尔斯公司，从此钻石营销拉开了它的世纪大幕。


    戴比尔斯一咬牙买下了整个钻石矿，之后小心翼翼地控制钻石出量，垄断了整个钻石的供货市场。最高时候戴比尔斯掌握着市场上 90% 的交易量。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_349_0.png)


    问题来了，如果买了钻石的人要出售掉，钻石的价格体系也会崩溃，所以要想稳定价格除了让别人买，还得不让他卖钻石。


    这怎么可能呢？'
  merge: -1
  img_proc: true
- pgno: 350
  md: '可是神通广大的戴比尔斯就是做到了，这个超级难题的解决方案催生了这个世界最牛的“精神寄托模式”，那就是把爱情同钻石紧紧结合在一起。


    因为钻石=美好+永恒，而爱情=美好+永恒，


    所以，钻石=爱情。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_350_0.png)


    # 当你的产品到了绑架客户情感的境界，你就是全球畅销品！


    1938 年以后，戴比尔斯的实际控制者，奥本海默家族花费了巨额的广告费用，开始打造所谓的钻石文化。


    宣称坚硬的钻石象征的正是忠贞不渝的爱情，而只有钻石才是各地都接受的订婚礼物。


    通过各种手段铺天盖地的广告强化钻石和美好爱情的联系。


    婚纱照上新娘身着美丽的婚纱，一脸幸福的微笑，手上的钻戒闪瞎大家的眼睛。'
  merge: -1
  img_proc: true
- pgno: 351
  md: '1950 年戴比尔斯提出了一个用了半个多世纪的广告语:“钻石恒久远，一颗永流传”。通过这个营销，戴比尔斯一石三鸟。


    +   1. 男人都认为只有更大更美的钻石，才能表达最强烈的爱意，恋爱中的男人为了女人什么事都做的出来，买钻石比送命门槛低得多！

    2. 女人都认为钻石是求爱的必需，你连钻石都不舍得买，你还好意思说你爱我？什么？你以为我看中的是钻石，我看的是你舍不舍得！

    3. 钻石都代表着永恒的爱情，拿来出售简直是对神圣爱情的最大                                                                       裹渎。除非你跟前夫不共戴天，否则很少会卖掉他给你的钻戒，而且就算卖，也不会有人接手，因为那是你的爱情，那不是我的。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_351_0.png)


    凡是量贩生产的产品，全部都是走平民路线，但凡私人订制、全球限量等稀缺性产品都是高价值产品。'
