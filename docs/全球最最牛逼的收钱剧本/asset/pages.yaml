  md: '# 第28课·产品挤压如山—超出3天清空【对标模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    【希拉里】春光外泄一瞬间山树内衣三天卖空！


    日本有家企业叫山树内衣，虽然品质很好，但是同质化严重，同行竞争压力大，产品滞销，已经到达了濒临倒闭的边缘。


    运用了对标模式后，仅用三天时间所有积压产品销售一空，从此企业起死回生，成为行业龙头企业，他，是怎么做到的呢？


    先给大家讲个故事……


    有一天布什说：“我们准备干掉4000万伊拉克人和一个修单车的”。记者不解问道：“一个修单车的？为什么要干掉一个修单车的呢？”


    布什没有回答，只是转身拍拍鲍威尔的肩膀说：“你看吧，这下相信我了吧，没有人会关注那4000万伊拉克人。”'
  merge: -1
  img_proc: true
- pgno: 273
  md: '![](img/ff9006615a5a1a6bfb1f601f8b3f246b_273_0.png)


    各位，我们来思考一下，修单车的之所以引起人们的关注，


    那是因为“对标”的是：4000 万伊拉克人！


    因此，我们产品没有名气，公司没有名气，就找一个“对标”。这就是今天要讲的商业模式“对标模式”。


    也许你还是听不懂，没关系，大家都知道一诺老师的课程都是采用100%的实战案例教学，那么就让我用一个“实战案例”把“对标模式”教会大家。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_273_1.png)


    在日本，有一个制造内衣内裤的工厂，名字叫“山树内衣”，企业马上要倒闭了，产品一条也卖不出去，所有的产品大量的挤压在仓库里面，根本卖不动，你有没有什么办法？'
