    他年迈的父亲为了他卖了自己珍藏多年的好车，还把养老金全部给他，才帮他还清了债务。


    各位，还记得这句话吗？


    天将降大任于斯人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_414_0.png)


