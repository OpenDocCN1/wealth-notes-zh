  img_proc: true
- pgno: 425
  md: '# 改变世界商学院 世界企业家的摇篮 《全球最牛B的收钱剧本》一诺老师专用


    举个例子，比如你投资 6 万，一天的利息是 600，一个月 30 天能赚 1.8 万元，这么爽的赚钱方式，谁不动心啊！


    除了每日 1% 的收益，马夫罗季还弄出了个奖励，只要推荐别人来玩，就能拿奖金！


    你发展了下线，你能拿 10%，下线发展了下线，下线的下线发展了下线，即第二代和第三代下线，你能拿到 3% 和 1% 的奖励。


    话说，这不就是传销吗？


    一来，没有销售实物，却有利可图；二来，以发展下线为主要模式。MMM 公司的员工忽悠水平也是一流，还做出了一张奥巴马推荐 MMM 的照片，真的毫无 PS 痕迹。


    而且还做了不少宣传片，一再宣称“我们的目标不是为了钱，而是为了摧毁世界不公正的金融体系”。


    拜托，上次你们在俄罗斯就是用这样的台词忽悠的，能不能换一换对白？


    唉，骗了几十年，对白都不换一下，还出书吹嘘自己的互助平台多么多么牛逼。'
  merge: -1
  img_proc: true
- pgno: 426
  md: '但即便是这样幼稚的骗术，还是不少人前赴后继地冲进火堆里，朋友带朋友，亲戚带亲戚，一起卷进了这场骗局里。没过多久，中国银监会、工信部、人民银行、工商总局四个部门认定
    MMM 为“非法机构，具有非法集资、非法传销特征”，并提醒投资者高度警惕，警方也对 MMM 平台进行了调查、打击。


    根据 MMM 互助金融社区，一些网站的资料显示，目前 MMM 在 107 个国家，共有 1.38 亿的全球会员！


    但即便如此，不少人依然执迷不悟，直到投资者发现平台的资金无法正常匹配，有人才意识到上当受骗，甚至呼吁受害者联合起来去报警。


    拿广州举例，报警的就有 40 多人，他们投资的资金没有任何提示就被平台冻结，冻结总金额超过 1000 万，其中最惨的那一个，一个人就被冻结了 200 多万。


    但钱没了就是没了，后悔也没有用了。据测算，MMM 从中国“掠夺”的财富可能会高达百亿美元。


    那些上当的人，很可能知道自己正在参与一个骗局，只是坚信自己不是最后一个投资者。他们的信仰是：在这个世界上，'
  merge: -1
  img_proc: true
- pgno: 427
  md: '傻不可怕，可怕的是做最后一个傻子。


    讲到这里，可能有人会问了，一诺老师，您有没有被骗？


    是的，曾经有一个叫如花的找过我，跟我说这个他们所谓的发财机会，我给他们讲了一个故事：


    从前有一只小鸡，听到走路的声音，他非常害怕地躲了起来，当脚步声走远了，他出来一看，有自己喜欢吃的小米。第二天，又听到了脚步声，他很害怕，又躲了起来，后来脚步声走远了，他出来一看，有自己喜欢吃的小米。


    各位，这件事情重复 1000 次，后来小鸡长大了，长成大公鸡了，他很感激每次给他送米的那个人，他决定不再躲起来，决定当面感谢一下那个人。


    当听到那个人脚步声，大公鸡开心的走到那个人面前，温馨的画面出现了，那个人上去抱住大公鸡，大公鸡幸福的闭上眼睛……


    你以为这样就结束了嗎？


    那个人把大公鸡绑了起来，最后，最后就被宰掉了……


    如果你没有听懂，我给你解释一下：'
  merge: -1
  img_proc: true
- pgno: 428
  md: '第一：每天的小米叫投资；

    第二：公鸡叫做回报；

    第三：1000 次安全的，第 1001 次小鸡被宰，那个人收回了所有的投资。

    如花听到后，说：一诺老师，我们没有这么傻，我们见好就收，我们不会这么惨的……

    可惜，现实不是你说了算，谁知道平台什么时候倒闭？

    没准明天就倒闭了！

    越贪婪，越容易失去理智，一不小心就成为最后的傻子。

    后来很多人都来找我，说给我这个所谓的发财的机会！

