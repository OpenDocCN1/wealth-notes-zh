  md: "# 第48课: 王石最尊敬的人,74岁在坠牢,84岁是亿万富翁【褚子模式】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式。顶层设计》。\
    \ \n\n曾经，有人问万科集团董事长王石：您最尊敬的企业家是谁？王石沉思了一下，说出了一个人的名字。\n\n但这个人，并不是股神巴菲特、也不是世界首富比尔盖茨、也不是华人首富李嘉诚，也不是房地产界的某位成功人士，而是一位老人，一位跌倒过，并且摔得很惨的老人。\n\
    \n他的名字叫：褚时健。\n\n褚时健，1928年出生在一个农民的家庭。1955年27岁的褚时健担任了云南玉溪地区行署人事科科长。31岁时被打成右派，带着妻子和唯一的女儿下农场参加劳动改造。\n\
    \n文革结束后，1979年褚时健接手玉溪卷烟厂，出任厂长。"
