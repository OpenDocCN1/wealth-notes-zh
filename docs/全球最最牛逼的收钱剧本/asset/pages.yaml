- pgno: 360
  md: '# 第38课：收钱收到手软的美人计【舆论模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    清代道光年间，江苏丹徒有个尼姑庵，一不种地，二不经商，过來施舍的施主又少。


    这尼姑庵里的尼姑生活就成了问题，怎么办呢？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_360_0.png)


    尼姑运用了商业模式之后，原本门庭冷落的尼姑庵一改旧观，香火袅袅，布施多多，施主川流不息。这一切，是如何做到的呢？我们一起来拆解商业模式。


    丹徒一带经常举办庙会。'
  merge: -1
  img_proc: true
- pgno: 361
  md: '# 改变世界商学院 世界企业家的摇篮 《全球赚牛日的收钱剧本》一诺老师专用


    每逢庙会，赶会者前呼后拥，络绎不绝，河面上的行船也增加了不少。


    一天，一位美若天仙的美少女，坐船来赶庙会。船靠岸后，美艳不可方物的她，自然吸引了无数人的目光。


    这位美妇面带羞涩，付了船资后，就急匆匆举步登岸。


    一不小心，一只脚踏入淤泥之中。


    美少女顿时很尴尬，一脸的羞涩。


    抬头一看，发现附近有一座尼姑庵，于是众目睽睽下往尼姑庵走去，消失于人们的视线之外。


    众人还在盯着尼姑庵的方向余味无穷，似乎对女子还没看够。这时船老大高声叫喊起来：“糟了，这妇人所给船钱竟然是阴间所用的冥币！”


    众人一看，果然如此，一个个大惊失色，于是，急忙随着船老大往尼姑庵找美少女理论。看热闹的、打抱不平的，一大群人跟着过来。


    谁知，在尼姑庵里，寻遍了所有的地方，却怎么也找不到刚才的那位妇人。'
  merge: -1
  img_proc: true
- pgno: 362
  md: '众人都觉得很蹊跷，正要问庙中的尼姑，船老大忽然看见庙中观音像的一只脚染满淤泥，众人大惊失色：“难怪美少女找不到了！”


    “坐船的美少女，一定是观音显灵！”


    船老大惊诧之余伏地叩首，将美少女所付的冥币焚于炉中。其他人无不合声诵佛，祈求观音菩萨保佑。


    此事不胫而走，一传十，十传百。


    于是，原本门庭冷落的尼姑庙一改旧观，香火裊裊，布施多多，施主川流不息。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_362_0.png)


    十几年之后，这个故事的隐情外泄：原来当年的船老大和那位美貌妇人，都是尼姑庙请来的营销人员。


    美妇进入尼姑庙后，立即将脚上淤泥，涂在观音足下，自己则卸装改容，躲藏起来了。'
  merge: -1
  img_proc: true
- pgno: 363
  md: '听到这里，你是不是觉得这就是一盘局，而且还是一个非常巧妙的局？


    或者说，这活生生是一个完美的商业模式。


    真正牛逼的商业模式，就是通过大众的传播来完成。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_363_0.png)


    因为这个效果“快、狠、准”。


    回到这个尼姑庵的故事，给我们哪些启发？


    第一，如何做到“三人成虎”？


    故事中，尼姑庵的传播需求很明确，就是让受众知道并信任尼姑庵，就像企业提升产品知名度以及美誉度。


    如果按常规模式出牌，可能大家会制造一个个“成功案例”


    传播尼姑庵的菩萨治好了谁的病，为谁还了愿。


    有没有用呢？有用，但这只能针对一小部分人产生作用，


    且还会引起一些人的怀疑。


    并不是最好的解决方案。'
  merge: -1
  img_proc: true
- pgno: 364
  md: '然而，故事中的做法却不一样，它采用引导、诱入的方法，

    让受众参与到传播中，这样，“眼见为实”使得受众相信，并甘愿去传播，“三人成虎”也就自然而然了。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_364_0.png)


    # 第二、如何把握“天时地利人和”？


    很显然，故事中的尼姑庙非常精准地把握了天时、地利、人和。


    首先，他把这场“戏”安排在庙会举办时，这时是人最多，更容易相信“菩萨显灵”。


    其次，“主角”采用美少女和船老大，美少女能吸引更多的目光，并能让人记忆深刻。


    自古英雄难过美人关，更何况凡人乎？


    而船老大交际广、人缘多，信服度更大。


    所以，当美少女一上船便吸引了无数人的目光，当船老大去“责问”少妇的时候，众人便一哄而上。'
  merge: -1
  img_proc: true
- pgno: 365
  md: '其中细节必然值得我们学习。


    # 第三、如何从舆论角度嫁接传播诉求？


    其实，很多时候，舆论怎样并不是很重要，重要的是你是否能从受众的舆论中表达出品牌的诉求。


    故事中，“观音显灵”并不能满足大部分人的诉求，但还是传播开了。


    为什么？因为想传播产品，首先要让受众知道你的产品，所以你的产品需要形成舆论。


    所以你会明白，为什么电商每年都要打价格战，甚至不惜互相曝一些负面，因为有声音总比没声音好。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_365_0.png)


    所以，当你看到王老吉跟加多宝打架，其实就是制造舆论，结果加多宝和王老吉双双销量大增，而和其正看不懂，大家想想看，如果和其正也揍和进来，一起打个群架，或者帮忙劝架，我想和其正今天可能就不是今天这个销量了。'
  merge: -1
  img_proc: true
- pgno: 366
  md: '当然，在你构造的舆论中，你一定要引导受众了解你的核心竞争力。比如，故事中“观音显灵”就是核心竞争力，而其他的尼姑庙和寺庙没有这个竞争力，就像京东的核心竞争力是“正品”一样。


    第四，如何层层推进，构建传播闭环？


    这个公关案例的经典之处在于，这是一个层层推进的闭环结构。我们把这个故事拆解之后是这样的过程：逛庙会—美妇上船—美妇付船资—美妇掷骰—船老大发现冥币—美妇入庙会—船老大讨公道—美妇将淤泥涂于观音脚下换装躲开—船老大发现“观音显灵”。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_366_0.png)


    各位，这个案例之所以能够一举成功，其实就是策划的好！


