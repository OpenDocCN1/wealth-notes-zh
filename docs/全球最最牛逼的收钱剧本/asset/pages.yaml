  md: '# 第87课：创造10000亿市场的模式【酸奶模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    一瓶小小的酸奶，从开始只是一个概念，一个想法，一篇文章，到目前每年全球数万亿的市场规模，是如何做到的呢？


    我们一起拆解背后的商业模式！


    俄国生物学家梅契尼科夫，在1908年获得了诺贝尔医学和生理学奖，被尊称为“人类免疫学之父”。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_341_0.png)


    1899年9月，梅契尼科夫在法国的报纸上声称，保加利亚人是全世界最长寿的民族，在该国的一个原始村落里他发现了'
  merge: -1
  img_proc: true
- pgno: 342
  md: '一种叫做“酸奶”的神秘饮料。他说这个村落里每 20 个人当中就有两位百岁老人，长寿率大大高于其他地区。


    最后，他表示保加利亚人之所以长寿，极有可能是因为他们爱喝“酸奶”。


    这篇文章勾起了法国民众的好奇心，民众开始向报社寄信询问怎么制作酸奶，在哪里可以买到酸奶。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_342_0.png)


    两个月之后，梅契尼科夫发表了一篇论文，声称在保加利亚人爱喝的酸奶中发现了一种非常神奇的物质（被他称作“保加利亚乳酸菌”），只要每天食用这种“乳酸菌”人人都能活到
    150 岁。


    面对这位权威大科学家的言论，法国民众再次沸腾了，询问“乳酸菌”的信件塞满了报社的信箱。


    许多上了年纪的老年人登门造访，全都推心置腹地说“我不想死”，甚至在他面前下跪，祈求他给一点乳酸菌。'
  merge: -1
  img_proc: true
- pgno: 343
  md: '![](img/ff9006615a5a1a6bfb1f601f8b3f246b_343_0.png)


    有机会参加我的线下课，会讲到“消费心理学”。


    梅契尼科夫自导自演的酸奶模式收效甚好，他非常满意，


    整个计划还剩下最后一步，就是——盈利。


    在此之前，他就已经跟几位食品厂商，在巴黎开设了 4 家


    “乳酸菌工厂”，通过他的指导生产固体状乳酸菌药片。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_343_1.png)


    在法国民众的强烈期待下，乳酸菌药片一经上市立刻遭到


    哄抢，供不应求。梅契尼科夫从中抽成，赚得盆满钵满。


    微信搜索公众号“改变世界商学院”输入“酸奶模式”就


    可以得到这一课的商业模式图解。'
  merge: -1
  img_proc: true
- pgno: 344
  md: '可是，他丝毫没有见好就收的意思，反而发起了更大一轮的赚钱计划——他开始到欧洲各地做巡回演讲，讲座场场轰动，向他索要乳酸菌的声音在会场内此起彼伏。


    1904 年 6 月 8 日，在法国巴黎农业学会的报告厅里，梅契尼科夫发表了演讲。在这场演讲中他声称酸奶比乳酸菌片的长寿效力更大，喝酸奶可以让人活到 200
    岁，头发永远不会变白。在演讲的最后，他故意公布了酸奶的制作方法，以此吸引投资。


    这场演讲结束的一个月后，法国境内涌现了数十家，专门生产酸奶的工厂，世界酸奶产业诞生了。


    # 三流的企业跟随一个行业，二流的企业引领一个行业！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_344_0.png)


    在法国，无论是哪个年龄段的人，都开始为了长寿而喝大量的酸奶。“喝了就能长寿”这个卖点实在太吸引人心，短短五年时间，世界酸奶的产量从零跃升至年产几千万瓶。'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 改变世界商学院 世界企业家的摇篮 《全球景牛日的收钱剧本》一诺老师专用


    1908 年，正值酸奶和乳酸菌的市场最高峰，而在那一年诺贝尔奖项竟然把诺贝尔生理学和医学奖颁给了梅契尼科夫。


    手捧诺贝尔奖的他，在世界范围内变得更具权威。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_345_0.png)


    而为了提高酸奶的销量，他把酸奶的功效描述得更为离谱。


    他告诉法国记者：我这里的最新研究显示，喝酸奶可以让人轻松活到 2000 岁，甚至可以长生不老。此语一出，立刻在欧洲引发了一波，全民渴求长生不老的酸奶销售狂潮。


    酸奶狂潮席卷欧洲整整 8 年之后，最讽刺的事情发生了。


    1916 年，梅契尼科夫死了，他只活了 71 岁。这和他描述的 150 岁、200 岁，甚至 2000 岁简直是天壤之别。很多人开始怀疑他言论的真实性。1917
    年，科学家重新做了调查，发现保加利亚人根本不长寿，保加利亚也没有长寿村。


    中国也有长寿村好像，但是我严重相信中国的这个长寿村是真的！你们相信吗？啊哈，自己脑补去吧……'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 改变世界商学院·世界企业家的摇篮《全球轰牛日的收钱剧本》一诺老师专用


    然而历史总是在不断的重演，1942 年美国出现了第一家酸奶厂。1942-1960 年期间，美国酸奶企业采取了与欧洲不同的销售策略，酸奶具有减肥、美白的保健品，在美国大行其道。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_346_0.png)


    1960 年，FDA 对酸奶做了严格的科学分析，最后发现酸奶和乳酸菌并不具有减肥、美白、增强免疫力、抗衰老等效果，营养价值也有限，高脂酸奶中所含的脂肪和糖不仅不能减肥，反而会增肥。因此
    FDA 下令规定从 1962 年开始，美国境内不允许出现任何宣传酸奶具有健康功效的广告。


    再后来，食品厂商开始向酸奶中添加一种叫做“益生菌”的微生物。“益生菌”，据说可以增进肠道健康和增加免疫力，很多厂商又开始炒作概念。


    2009 年欧洲食品安全局断定，市面上数百种所谓“益生菌”没有一种能够增进肠道健康或免疫力，马上下令欧洲所有乳业公司停止宣称其具有这一功效。'
  merge: -1
  img_proc: true
- pgno: 347
  md: '同年，某公司旗下的酸奶，对于益生菌的效果欺骗了消费者被判赔偿 3500 万美元并修改了宣传语。


    历史再一次重演，后来这个公司把酸奶带到了全世界。“长寿”、“瘦身减肥”、“美容养颜”、“增强免疫力”为卖点的酸奶，开始大行其道。


    相同的产品，法国厂家赋予长寿功能！


    美国人赋予减肥、美白抗衰老功能！


    其实，我想说，我对中国的酸奶还是很放心的！


