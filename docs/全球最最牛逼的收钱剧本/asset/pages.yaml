  img_proc: true
- pgno: 229
  md: '于是，商鞅将赏金提高到 50 金。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_229_0.png)


    在重金之下，终于有人站了出来。他决定试一试，于是他将木头扛到了北门。商鞅立即赏了他五十金。商鞅这一举动，在百姓心中树立起了威信，而商鞅接下来的变法就很快在秦国推广开了。


    新法使秦国渐渐强盛，最终统一了中国。


