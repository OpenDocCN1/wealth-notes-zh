- pgno: 247
  md: '# 第26课：从修理工到世界船王【爬山虎模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    # 【借船出海】造船出海，不如借船出海


    洛维格起初是一个码头修理工，可以说除了梦想什么都没有，但他却用了爬山虎模式，成为了世界船王！他是怎么做到的呢？


    没有钱也能做生意，而且还能把生意做大。美国船王洛维格就是这样一个人。


    丹尼尔·洛维格，1897年生于美国，他的父亲是个房地产中间人。


    在洛维格10岁那年，父亲和母亲离了婚，洛维格跟随父亲离开家乡，来到得克萨斯州的，一个以航运业为主的小城——阿瑟港。'
  merge: -1
  img_proc: true
- pgno: 248
  md: '他高中没念完就去码头打工，干过轮船修理工，也开过修理行，但是洛维格不满足于这些靠手工活挣来的辛苦钱。


    20 世纪初，西方工业经济迅速发展，社会贫富差距也越拉越大。出现了很多一夜暴富的富翁，他们坐着高级轿车，住着花园别墅，过着极度奢华的生活。


    而大多数底层民众的生活，却越来越贫困。


    洛维格看到这一切，暗下决心，要通过自己的努力，改变自己的人生。他不甘心过穷苦的生活，他要赚钱，要体验那种成功的感觉。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_248_0.png)


    可是怎样才能快速致富呢？


    那时，洛维格只有微不足道的一点积蓄，根本不够做生意的资本。再加上他年轻，毫无经验，因此在生意场上磕来碰去，总是不得要领，甚至多次面临破产的危机。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '有一次，洛维格带着沮丧失落的心情回到家，看着院子里满墙的爬山虎，脑海中突然产生了一个灵感——爬墙虎之所以能爬那么高，还不是因为借助高墙嘛！由此，他想到了借助别人的力量实现自己的梦想。


    怎么做呢？——去借钱。


    跟谁借呢？想来想去，银行的钱最多！


    对，想办法找银行贷款买船，然后再把船出租赚钱。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_249_0.png)


    # 一定要学会借别人的钱去帮自己赚钱！


    实际上，9 岁那年他就干过一件令人称奇的买卖。当时，他偶然听说邻居有一艘柴油机帆船沉在水底打算遗弃。


    于是，洛维格发现了商机，回家向父亲借了 50 美元，用其中一部分雇人把船打捞上来，又用一部分从船主人手里买下它，然后用剩下的钱雇了几个帮手，花了整整 4 个月时间把那艘几乎报废的帆船修理好。'
  merge: -1
  img_proc: true
- pgno: 250
  md: '然后，他转手将这条船卖了出去。


    经过洛维格这么一折腾，洛维格居然从中赚了 50 美元！


    各位，我们想一下，如果没有父亲借给他的 50 美元，他不可能做成这笔交易。


    要想无中生有地拥有大量的资本，就得靠借，就得学会用别人的钱干自己的事，为自己赚更多的钱。


    这就是洛维格的发现。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_250_0.png)


    借贷—向银行申请个人贷款，是洛维格当时唯一的选择。


    于是，在相当长一段时间里，纽约的各家银行里都能见到他忙碌的身影。他努力说服银行家们把钱借给他，并且，还要使他们相信，他有能力偿还贷款本金及利息。


    可是他的请求——遭到了拒绝。


    理由很简单，他几乎一无所有，没有人敢冒险把钱借给他。


    希望一个个燃起，又一个个的破灭。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '就在山穷水尽之时，洛维格突然想出了一个主意。


    他想办法借到一艘勉强能够航行的老油轮，洛维格把这艘油轮重新修理改装并精心“打扮”一番，以低廉的价格包租给一家大石油公司。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_251_0.png)


    然后，他带着租约合同，去找纽约大通银行的经理，说他有一艘被大石油公司包租的油轮，每月可收到固定的租金。


    如果银行肯贷款给他，他可以让石油公司把每月的租金直接转给银行，来分期抵付银行贷款的本金和利息。


    大通银行的经理们开会研究了很久，终于答应了洛维格的要求。当时，大多数银行家都认为此举简直是发疯，把钱贷给洛维格这样一个两手空空的人，简直是太不可思议了。


    但大通银行的经理们自有他们的道理：尽管洛维格本身没有资产信用，但是那家石油公司却有足够的信誉和良好的经济效益。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '除非发生天灾人祸等不可抗拒因素，只要那条油轮还能行驶，只要那家石油公司不破产倒闭，这笔租金肯定会一分不差地入账的。


    洛维格的巧妙之处，在于他利用石油公司的信誉，为自己的贷款提供了担保。


    他计划得很周到，与石油公司商定的租金总额刚好可以支付他每月贷款的利息。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_252_0.png)


    他拿到大通银行的贷款，便立即买下了一艘货轮，然后动手加以改装，使之成为一条装载量较大的油轮。


    他采取同样的方式，把油轮租给石油公司获取租金，然后又以租金为抵押，重新向银行贷款，然后又去买船……


    如此一来，像滚雪球似的，一艘又一艘油轮被他买下，然后租出去。等到贷款一旦还清，整艘油轮就属于他了。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '随着一笔笔贷款逐渐还清，油轮的租金不再用来抵付给银行，开始进了他自己的账户。


    后来，洛维格的船只越来越多，租金也滚滚而来。洛维格就这样不断积聚着资本，生意越做越大。不仅是大通银行，许多别的银行也开始支持他，不断地给他贷款。


    后来，他有了自己的造船公司。


    他开始有针对性地设计一些油轮和货船，然后拿着设计好的图纸去找客户。


    一旦客户满意，立即签订协议，约定这艘船造好后就由这位客户进行承租。然后，洛维格拿着这些租船协议，再去向银行申请高额贷款。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_253_0.png)


    随着洛维格生意的不断发展壮大，洛维格在银行的信用也大大增加，从银行贷款变得更加容易了。然而，洛维格并不满足，他趁机向银行讨要很少人才能享受到的“延期偿还贷款”'
  merge: -1
  img_proc: true
- pgno: 254
  md: '待遇。


    什么意思呢？


    就是在船造好之前，银行暂时不要收取本金和利息，等船下水开始营运时，再归还银行贷款。


    这样一来，洛维格就可以先用银行的贷款垫资造船，然后出租，只要承租商还清了银行的贷款本息，洛维格就可以如愿以偿地收回船只的所有权，成为船只名副其实的主人，坐收源源不断的租金。整个过程他不用投资一分钱，他就这样利用银行贷款赚取利润，爬上事业巅峰。


    他有一本自传，叫《触摸蓝天的爬山虎》，书中这样写道：


    > “如果做不成大树，那就做一株爬山虎，借助大树和悬崖的力量，你同样可以触摸蓝天！”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_254_0.png)


    我们观察一下，古今中外生意场上的奇才证明，一个人如果想要在生意场上有大的出息，不能只靠起早贪黑地拼命，更'
  merge: -1
  img_proc: true
- pgno: 255
  md: '重要的是你要明白生意上的真谛：


    凭借力气赚来的钱，永远是小钱，而靠智慧赚来的钱才是财富。


    哈佛大学一位经济学家这样说道：“如果你想要成为一个比别人更有钱的人，那么并不是管好你的资产，而是尽可能的做大你的负债。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_255_0.png)


    各位，你知道富人的财富都是哪里来的吗？


    常常听到说做生意没有本钱，其实逻辑是这样的：穷人把钱存到银行，而银行把钱借给富人，于是富人又拿着钱去请更多的穷人为他工作，于是富人越来越富，穷人越来越穷。


    富人总是愿意跟银行借更多的钱，付更多的利息，而且他们不怕付利息，因为他们赚的钱远远大过利息钱！


    那为什么银行总是愿意借钱给富人？


    因为富人是让钱生钱！'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/ff9006615a5a1a6bfb1f601f8b3f246b_256_0.png)


    各位，历史总是不断地重演，在香港也有人采用同样的模式，谁呢？


    香港船王——包玉刚

    包玉刚是 20 世纪香港最成功的企业家之一。

    他的创业也是从借开始的。

    他先是向朋友借钱买了一艘破船。他把这艘船包装了一下，然后，他又用这艘船去银行抵押贷款。用贷款再去买第 2 艘船。

    依此类推，就用这种模式快速地壮大自己的生意。最经典的是，有一次，他竟然不用抵押就贷款买到一条新船。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_256_1.png)


    怎么办到呢？他用了三个步骤：'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 改变世界商学院 世界企业家的摇篮 《全球最牛日的收钱剧本》一诺老师专用


    第一：他先和日本船厂，签订了造船的合同。


    第二：他拿着造船合同加上自己的信用，和一家日本货运公司签订了把这艘船租给对方的出租协议。


    第三：他把这两个事情同时告诉银行。


    他说“我 ​​在日本订购了一艘新船，价格是 100 万。同时，我也和日本的一家货运公司签订了一份租船协议，船造好之后，他们租下这艘船，每年租金是 75 万。而且，他们可以为此担保，只要船出来，租金不会有问题。因此，我想请贵行支持，给我贷款
    100 万，让我造好这艘船？”


    银行一听 100 万造船，每年有 75 万的租金，不用 2 年就可以还清所有贷款。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_257_0.png)


    而且啊，还有人担保这 75 万租金，这么优质的贷款标的，当然可以放款给他。


    于是，包玉刚这个美梦就成真了。'
