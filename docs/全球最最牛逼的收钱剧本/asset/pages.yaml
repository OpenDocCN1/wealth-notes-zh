  md: "# 第38课：创业奇才400元白手起家干出让比尔盖茨仰望的成绩【借鸡下蛋模式】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。\
    \ \n\n王嘉廉是全球第一个把软件公司做到10亿美金营收规模的人，也被称为是华人软件产业中唯一能和比尔·盖茨并肩挑战的人。\n\n曾经有人问王嘉廉，你与比尔·盖茨有什么不同？他说：我知道什么是饥饿的滋味，而比尔没有。\n\
    \n![](img/ff9006615a5a1a6bfb1f601f8b3f246b_335_0.png)\n\n先给大家讲个故事："
