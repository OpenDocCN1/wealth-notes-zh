    那天莫总整夜失眠，一整夜都用一诺老师教他的商业模式，改进自己企业的模式。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_442_0.png)


    莫总回去之后，用了五个商业模式组合。


    第一：零距离模式


    之前房地产惯用的手法都是在小区住在门口开店，这样是精确定位本来就对这个小区有兴趣的客户进行针对性的营销。'
