  md: '# 第22课：孙二娘坟山开坟门客栈年赚百万【傍租先模式】【傍文化模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    浙江龙门镇有座坟山，在本地农民的眼中是一个阴森恐怖的地方，是龙门镇专门用来埋葬死人的地方。山上密密麻麻地布满了 400 多个坟头。除了清明节去上坟以外就没人再上去了。


    镇上的人，突然发现，这座坟山上经常出现一个女人的身影。人们不但白天能看到她，晚上还看到她一个人上山，这个人的出现，让镇上的人们，在茶余饭后，有了谈论的焦点。


    这个经常出没在坟山的女人，叫孙法娣。这孙法娣为什么要住进这座坟山呢？正是因为她发现这座荒山里有一个可以开发的商业模式，为了这个可以创造财富的商业模式，她与
    400 多座坟墓为伴，坚守 6 年。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '当她每年从这里获得两三百万元的利润时，镇里的人们才恍然大悟。


    在这座荒凉恐怖的坟山上，究竟隐藏着什么财富秘密呢？


    究竟用了什么商业模式，可以每年赚两三百万呢？


    孙法娣本来也是龙门镇的人，年轻的时候就嫁进了城里，还在城里找了工作。


    50 岁的孙法娣退休了，退休之后，就承包了镇里的这座叫鸡昂头的坟山。


    镇里人都在议论了，这城里好好的，干嘛回来呢？这一回来，还住进了坟山上。


    村里人百思不得其解，各种猜测议论，甚至有人觉得她是不是脑子有病！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_208_0.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: '满山都是坟头，你说说这孙法娣想干嘛？想发财？也不像呀，大树早就被砍完了，剩下的都是一些枇杷树和一些不值钱的荒草。


    于是，人们想“一定是她在山上发现了什么宝物”。其实，当时就连她的丈夫也是这么想的。


    重点来了……


    龙门镇是一座有着 1000 多年历史的古镇，镇里的徽派建筑老房子随处可见，紧接着，国家旅游局认定龙门镇为孙权故里。富阳市旅游局决定开发龙门镇作为景区，划分的景点就包括孙法娣所承包的荒山，而这一切都是那么的刚刚好。


    有人问，怎么会这么巧合呢？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_209_0.png)


    各位，我们想想看，孙法娣承包的是坟山。


    所以，价格比较低！'
  merge: -1
  img_proc: true
- pgno: 210
  md: '如果是旅游规划结果出来了再承包，那么便宜的价格肯定租不到，这里面的玄机你只能自己去领悟了！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_210_0.png)


    由于龙门镇被评为孙权故里，受到了国家的重视，这座山的坟墓开始被迁移。


    于是政府的配合和百姓的支持下，坟头逐渐被移走了，而这座曾经的坟山也显现出自己的价值。


    其实，这一切都是孙法娣的意料之中。


    紧接着孙法娣在山上种起了果树，山上开始有了生机，加上人们回归自然的心情。孙法娣在山上做起了农家乐！


    她这个农家乐，可不比普通的农家乐，为什么呢？


    先给大家讲个阿凡提的故事，阿凡提据说人际关系非常好。为什么人际关系那么好呢？原来，阿凡提有个习惯，只要是姓阿的结婚，阿凡提就上前祝福：“美丽的新娘，祝福你！英俊的新郎，祝福你！”我们都是姓阿，都是一个祖先。'
  merge: -1
  img_proc: true
- pgno: 211
  md: '于是，主人很好客，既然都是一家人，那么就一起坐下来吃饭。酒席上，阿凡提举杯跟大家一起喝，酒过三巡，一桌十多个人都认识了。


    于是，换一桌，又酒过三巡，又认识十几个人。就这样，如法炮制，阿凡提一次酒席换个十桌八桌，结果比一般人，认识的人多十倍。


    # 喝酒不是目的，通过酒席联络和加深感情才是重点！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_211_0.png)


    阿凡提不光是喜事上前搭讪，丧事也是上前搭讪。看到别人办丧事，他就上前打听，驾鹤西去之人是谁？寿终岁数，男性女性，生前做什么的？为什么才去世？


    当打听清楚了，也姓阿，阿凡提就上前鞠躬，甚至下跪磕头，一边磕头一边烧纸，嘴里还念念有词：“某某某啊，不该英年早逝，真是国家的一大损失！”'
  merge: -1
  img_proc: true
- pgno: 212
  md: '办丧事的人家很感动，他们想这个人怎么没有见过，不过看他哭得那么伤心，肯定与逝者关系非同一般。


    于是就上前搀扶。一问，原来都是姓阿的，一家人。


    来来来，留下来帮忙，帮忙什么？比如说帮忙哭啊……


    这到了中午呀，很自然的，阿凡提又被留住吃午饭，一边喝酒，一边哭，哭什么呀？当然是逝者英年早逝。


    酒过三巡，又换一桌。就这样，阿凡提认识的人越来越多。


    后来，阿凡提的徒弟问阿凡提，咱们不认识他们，上去拜，这样不好吧？阿凡提就是阿凡提，阿凡提说：“放心吧，一方面，大家都姓阿，500年前都是一家人；另一方面，反正死者不会站起来说，嗯，不认识不要乱拜！”


    徒弟一听，若有所思地点点头，说：“有道理！”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_212_0.png)


    我们又回到现代。


    各位，孙法娣的山在哪里？'
