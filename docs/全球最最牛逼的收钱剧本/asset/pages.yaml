    在酒精的麻醉下，加上现场的灯光、音乐、跳舞女郎，更重要的是他们本身就有需求，而且今天有这么多的优惠，今后的一年里，就可以在这个酒吧消费 3 万块，而且还可以领走
    2 万块的红酒，并且还有股份，还可以自由退股，退股没有任何损失。


    成为股东后再来这家酒吧喝酒就有面子了，就   可以拍拍胸口说：“我，是这家酒吧的股东。”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_57_0.png)


    因此，大家争先恐后的签约缴费，有的自己交钱一起来的不交钱还被骂了：“怎么了，你这是几个意思呀，难道今后你打算跟我白吃白喝，你也得买，一起买。”


    你想呀，这江湖上的人都讲义气，买！买！买！


    有的人本来就很多应酬，觉得一份不够，就买两份，三份，还有的买了多份，股份自己留着，红酒送人，消费券用来招待客户。将   来股份还可以退回来，自己白白捡了一个大大的便宜。'
