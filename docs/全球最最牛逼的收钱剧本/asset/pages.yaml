- pgno: 431
  md: '# 改变世界商学院 世界企业家的摇篮 《全球最牛日的收钱剧本》一诺老师专用


    阿猫心理想，阿狗一定知道什么秘诀，不行，我要想办法学到他的秘诀。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_431_0.png)


    于是阿猫买了好酒好菜上前请教。


    酒过三巡之后，阿猫问阿狗，为什么你家的猪这么乖，吃了睡睡了长！请阿狗哥教我。


    阿狗看到阿猫这么谦虚，就透露了其中的秘密：因为养的是特色家猪，为了打开知名度，阿狗从来不用使用添加剂，可是这阿狗家的猪为什么长得这么快？


    原来呀，这其中是有不为人知的秘密。


    阿狗发现了一个秘密：要想让猪长肉，要做到三多两少。


    哪三多呢？多吃饲料、多喝水，多睡觉！


    哪两少呢？少运动，少生病。


    大多数养殖户，为了让猪喝水，干脆在饲料里拼命地加水，养殖户是一厢情愿了，可是这个猪不开心了，阿狗研究过猪的'
