  md: '了，利乐在包装上打了识别码，生产线只认利乐自己的包装。


    如果更换设备，问题将会更严重，那些几亿一条的生产线设备会让乳业巨头立刻亏损。


    于是，乳业巨头们打消了更换包装材料的念头，选择继续和利乐公司合作，利乐公司也因此分享了中国乳业市场中巨大的利润。


