  md: '有没有错？没错，可是缺点有三。


    +   1. 房租太高：要知道现在大多数企业为房租打工。


    +   2. 不够亲切：还是感觉商业化太浓，这么贵的租金，你要赚我多少钱呀。


    +   3. 距离太远：无论你是否开在小区门口，但是不够近。


    那么莫总怎么做呢？


    莫总把中介直接开在小区出入的大堂、岗亭旁边，这样做优点有三：


    +   1. 节省租金：每年节省租金一个点就几十万，企业家都懂开源节流的道理。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_443_0.png)


    +   2. 足够亲切：业主以为物业管理处做的，所以足够亲切。


    +   3. 零距离：每天出入小区，都可以接触到，而且每栋楼的电梯里，出入口都是他的广告。


