- pgno: 111
  md: '# 第12课：从20元到身价百亿【傍名人模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    今天给大家带来的是【傍大款模式】。


    【傍大款模式】一共有九招。


    现在再给大家讲【傍大款模式】第二招：傍名人


    有个案例非常经典，有个叫春哥的，在很多年前，运用了【傍大款模式】。


    有一天，他在商会得知，马云要参加植树节，于是他特别地打听马云去哪里植树。他就特地早早的在那里等。


    过程就不多说了，春哥最后跟马云合了一张影。


    后来，春哥把这个照片放大，挂在自己办公室一张，公司前台一张！


    有一次，一个韩国客商过来谈合作。一进门惊呼“马云？”'
  merge: -1
  img_proc: true
- pgno: 112
  md: '春哥的助理说：“是的，马云！”


    韩国人，很崇拜马云。


    那个韩国人问：你们老板跟马云是什么关系？


    春哥的助理微笑的说：你觉得呢？


    那个韩国人说：难道？


    最后的结果是，生意谈成了。


    后来，一幅跟马云的合影让这个小小的企业，从几个人的小公司，发展成为年营业额上亿的大公司。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_112_0.png)


    你不要小看名人的力量！


    有没有见过一些企业家办公室挂着跟某位明星、体育冠军、社会名流、还有领导合影？


    这就是名人效应，就是【傍大款模式】第二招：傍名人。


    庆丰包子大家听过没有？


    习主席刚上任不久，一次去“庆丰包子铺”吃午餐，给了'
