  md: '# 第 01 课：商业模式就是企业的剧本


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    一诺老师说过：一个企业要做强做大，一定要有一个能够做大做强的模式。很多企业做到了一定阶段就做不大了，为什么？因为一开始就错了，一开始的模式就注定做不大。


    所以企业需要做《商业模式·顶层设计》。


    最典型的商业模式案例就是：卡巴斯基收费、瑞星杀毒收费、所有软件都是收费的，360 杀毒进来全部免费，彻底颠覆了杀毒市场，几乎所有的杀毒软件公司，破产的破产！倒闭的倒闭！改行的改行！


    什么叫做免费模式：


    最彻底的免费就是：完全免费！


    不是降价促销，不是试用！而是完全免费！'
