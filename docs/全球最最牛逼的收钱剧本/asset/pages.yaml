- pgno: 305
  md: '杰克：“我想介绍一位年轻人来当贵行的副总裁。”


    总裁：“我们已经有很多位副总裁，够多了！”


    杰克：“但我说的这年轻人，可是比尔盖茨的女婿喔！”


    总裁：“哇！那这样的话…”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_305_0.png)


    最后，杰克的儿子娶了比尔盖茨的女儿，又当上世界银行的副总裁…


    知道吗，生意通常都是这样谈成的。


