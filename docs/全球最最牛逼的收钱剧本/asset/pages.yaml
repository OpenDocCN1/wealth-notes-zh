  md: '哪里，可口可乐的工厂就在哪里，一共卖了 100 亿瓶可口可乐。


    除了南北极以外，可口可乐在二战时建立了 64 家工厂。为了方便，美国军方授予这些代表人员“技术观察员”的军职。把可口可乐工厂的工人与修理飞机坦克的军人相提并论，这的却是太不可思议了。


    但士兵以及军官们却都对这些“技术观察员”感激有加，因为正是这些人，在残酷的战争中，给他们送来了难忘的家乡味道。


    在二战期间，可口可乐还与不少名人结缘。五星上将巴顿将军把可口可乐当作必需品，无论他转战何处，都要技术观察员跟着搬迁可口可乐工厂。巴顿将军有次半开玩笑地说：“我们应当把可口可乐送上前线，这样就不必用枪炮去打那些混蛋了。”


    1945 年 6 月 19 日，艾森豪威尔将军从战场凯旋归来，美国人为他们的英雄举行了一次丰盛的午宴。在午宴之后，有人问艾森豪威尔将军是否要来点什么。


    艾森豪威尔将军说：“给我来杯可口可乐！”


    一饮而尽后，艾森豪威尔严肃地说：“我还有一个要求。”'
