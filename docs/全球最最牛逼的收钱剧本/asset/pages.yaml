- pgno: 327
  md: '# 第35课：揭秘！这个模式搞定几亿人【狼舔血模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    先给大家讲个故事：


    在北极，爱斯基摩人有一种奇特的“捕狼术”，这是一种祖辈流传的土办法，可以说是屡试不爽，百发百中。


    在锋利刀刃上，涂抹动物的鲜血，很快冻成了冰，接着再涂一层，再等冻成了冰，再来一次……反反复复多少次，锋利的钢刀变成了殷红的“血坨子”。嗅觉灵敏的狼能在很远闻到血腥的气息，而且，一阵风似地赶来进食。


    “血坨子”冻的非常硬，只能一小口一口儿地舔。


    越舔，血腥味儿越浓重，越是血腥，狼就越兽性大发，坠入“忘我”之境。


    饿狼越舔越快，越舔越带劲儿，刀锋露出来了都没有察觉，'
  merge: -1
  img_proc: true
- pgno: 328
  md: '它依然用冰凉的舌头狠狠地舔食刀锋。


