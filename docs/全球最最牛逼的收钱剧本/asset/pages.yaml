    广西桂林市旅发委发布的最新统计显示，仅仅 2016 年的 1 — 6 月，桂林全市共接待游客 2445.66 万人次；旅游总收入 271.41 亿元！


    还有某岛国，在中国大肆投放电视，进行文化侵略，一个个单纯善良的中国同胞，被一个个“整容的欧巴”和“阿朵 K”洗脑，盲目崇拜，结果，买他们的化妆品、包包、衣服。


