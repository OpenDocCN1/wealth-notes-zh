- pgno: 70
  md: '# 第08课：傻子太多聪明人明显不够用【石头模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    在很久很久以前，有一个叫【吃瓜村】。


    吃瓜村附近山上都是奇形怪状的石头，吃瓜村民们每天都在辛勤劳动着。突然有一天，e来了位商人，问吃瓜村民说：你们山上的石头卖不卖？


    商人说：石头会给人带来好运，时来运转。


    商人说：只要吃瓜村民把长得像猫呀，狗呀，龙呀的，像动物的石头弄来，每一个给100块钱。


    吃瓜村民不知是真是假，试着搬了1块石头，商人果然给了100元。于是全村的人都去找石头，因为吃瓜村民认为，这比种地简单多了。


    所以，商人为了交易方便，还专门开了一个交易市场。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '很快，山上的石头，越来越少了。


    在交易所里，商人不断的抬高价格，从之前的几百块，涨价到几千元、几万元、甚至一块石头涨到几十万，上百万。


    吃瓜村民们在交易所看着别人发财，一块石头卖几十万，自己却没有石头可以卖，看在眼里，嫉妒在心里。


    正当这个时候，商人派人回到村子卖石头，一个石头从从几千块，卖到一万块不等。


    吃瓜村民们久旱逢甘霖，心里想：只要买下来，转手就赚钱。于是乎，吃瓜村民疯了一般，几乎拿出所有积蓄，有的四处借钱、甚至砸锅卖铁，最后凑钱，把所有石头全都买了回去。


    很傻很天真的吃瓜村民们，等啊，等啊，等了很久很久。


    结果商人再也没有回来……


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_71_0.png)


    这就是『石头模式』，模式的显著特点是：


    第一步垄断：先使用大规模的资金，去垄断资源；'
  merge: -1
  img_proc: true
- pgno: 72
  md: '当资源完全垄断，第二步定价：就放出信号，天价回购；


    第三步套现：低于市场价格，快速变现；


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_72_0.png)


    曾经的普洱茶就是这么玩的，一些幕后的操盘手，就套用了【石头模式】


    第一步垄断：大量的收购普洱茶。


    第二步定价：当市场普洱茶寥寥无几时，放出信号，天价收购。


    第三步套现：低于市场价，抛售货物，快速套现。


    曾经的：玉石玛瑙翡翠也是这么玩的，套用的就是【石头模式】


    回忆一下：某高端白酒也是套用的【石头模式】


    现在流行的资金盘也是这么玩的，套用的就是【石头模式】


    那些个网络上的虚拟货币，套用的【石头模式】


    传说中有人这样玩的股市！'
  merge: -1
  img_proc: true
- pgno: 73
  md: '传说中有这样玩的信托！

    传说中有这样玩的黄金市场！

    传说中有这样玩的房市！

    那么，为什么有人相信呢？

    因为每个人内心都住着一个“贪得无厌”魔鬼，

    为什么他们屡屡得手呢？

