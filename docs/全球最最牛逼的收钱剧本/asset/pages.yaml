    第二次世界大战给人类带来了巨大灾难，却成就了可口可乐的全球声誉。可口可乐公司通过二战获得了飞速的发展，虽然是商业行为，却被誉为爱国行为，广受赞誉，堪称商业模式的经典案例。


    可口可乐公司，仿照美军使用脱水食物的方式，把可乐浓缩液装瓶输出，并设法在驻区设立工厂。可口可乐公司一共派遣了 248 人随军到国外。然后，这批人随军辗转，军队打仗到'
