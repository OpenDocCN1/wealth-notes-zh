  md: "# 第10课：从负债千万到10万家分店【瓜分世界模式】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式。顶层设计》。\
