- pgno: 204
  md: '员工2万多名。


    当市场格局稳定后，乳业巨头们发现，利润在不断地摊薄。


    这时候，通过成本结构的核算，才发现，利乐公司的包装材料占了很大的比例，同样的包装纸，利乐公司的要比竞争对手贵很多。


    原来，利乐公司在伴随着中国的乳业巨头们发展壮大的同时，不断的升级产品。从当初很不起眼一个小盒子，在不知不觉中，居然占据了液态生产成本的 1/4，伊利和蒙牛乳业每年的营业额超过
    500 亿元，不算其他乳业公司的营业额，仅此两家已经突破千亿市场。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_204_0.png)


    然而，我们很多人却不知道，这当中还隐藏着高昂的包装成本。25%的成本都不得不花费在包装盒上面！


    也就是交给了利乐公司！


    听到这里，有人会说：那就换包装呗！对不起，还就换不'
