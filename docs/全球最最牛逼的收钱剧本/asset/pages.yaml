  md: '# 第42课：从卖血求生到身价780亿【红牛案例】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式•顶层设计》。


    一诺老师最近在研究一个隐形富豪，这个人在2006年的全球最具影响力杰出华商排行榜上，他紧跟榜首李嘉诚，位居第二。2016年的胡润百富榜上，他以780亿的身家保持住了前十的位置。


    然而，相比与李嘉诚、王健林等同队列的富豪的知名度，他低调得像个隐形人。


    直到现在，他的名字也不在大众的认知范围。


    但他，却是商界名副其实的一个传奇。说传奇是因为他曾穷困潦倒，甚至一度落魄到在异国他乡靠卖血求生！


    当年的笑话，如今已是富甲一方的华商，游走于中泰高层的巨富。'
