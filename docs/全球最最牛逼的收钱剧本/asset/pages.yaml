- pgno: 404
  md: '当时的玉溪卷烟厂，是一家濒临倒闭的破烂小厂，那年他 51 岁。


    有人笑他傻，很多人等着看他的笑话，工厂都瘫痪成那个样子了，你小子能行吗？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_404_0.png)


    各位，企业家，想想看，现在有很多二三十岁的人已经不想工作，害怕压力、害怕承担、怕苦、怕累。有了功劳都是自己的，遇到困难只知道指责别人！还没到 40 岁，就已经觉得这一生的奋斗该结束了。可是，褚时健的奋斗故事，51
    岁时才刚刚开始。当你觉得你做某些事情有点晚的时候：


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_404_1.png)


    褚时健力挽狂澜，经过 18 年的努力，把当年濒临倒闭的玉溪卷烟厂，打造成亚洲最大的卷烟厂，打造成中国的名牌企业：'
