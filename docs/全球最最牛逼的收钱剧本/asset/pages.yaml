- pgno: 418
  md: '即使输了，也要敢于面对！输不起，就不要开始！既然开始了，就不要抱怨，更不要怨天尤人地把责任推卸给别人！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_418_0.png)


    如果今天你在听《商业模式·顶层设计》请你仔细的听，慢慢的回味，多听几遍，当你听了一百遍以上，奇迹将会在你身上出现。


