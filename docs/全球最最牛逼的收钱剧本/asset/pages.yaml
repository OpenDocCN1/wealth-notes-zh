- pgno: 299
  md: '# 改变世界商学院 世界企业家的摇篮 《全球裸牛日的收钱剧本》一诺老师专用


    各位，当你认为这是一个故事，一次偶然，那你就大错特错了，这就是模式，是有规律可循的，可以复制的商业模式！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_299_0.png)


    一诺老师为你解开谜团，一诺老师帮你拆解这个商业模式，请你仔细地听！


    麦克唐纳也就这样出名了，麦克唐纳被各家新闻媒体追踪报道，他的成功秘密被电视台曝光！


    接下来，很多看人到这条新闻基本上都要问这三个问题：


    +   第一，这个是真的吗？

    第二，有没有具体如何做？

    第三，麦克唐纳在什么网站进行的交换？


    我们来回答这些问题：


    第一，这是真的吗？


    好吧，如果麦克唐纳自己说的，你也许以为是假的，但是媒体和电视台的信用背书，让人们不得不相信，这就是真的！'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# 企业家要进行媒体公关！


    第二，有没有具体的如何做？


    这个担心是多余的，在报纸、网络、电视台等各大媒体渠道的呼声中，麦克唐纳不得不将自己的致富秘诀公布于众。于是乎，麦克唐纳出版了一本书，专门用来传授经验。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_300_0.png)


    各位，这本书一出版就被抢购一空，多个地方出现排队抢购的画面。好吧，这里就不解释了，学过商业模式的人都懂的。


    第三，在什么网站可以交换呢？


    麦克唐纳的书里面，会详细地告诉你具体网站名称、网址！


    这个“别针换别墅”的传奇，给了无数的“换客”以信心。


    仅仅一年的时间，这个易物网的物品达十来万件，注册几百万注册用户。


    大家有没有感觉到，麦克唐纳的成功多么的传奇？


    错，这不是传奇！也并不是偶然！'
  merge: -1
  img_proc: true
- pgno: 301
  md: '这一切都是精心导演的一部精彩的剧本！


