  md: '如果这个企业家纯粹是为了钱，我是绝对不会跟这样的人合作！


    因为追求利润的企业，当没有利润了就会动其他主意，比如我们面临的食品安全危机！


    酒楼、饭店炒菜用地沟油；肉贩子往吃的猪肉里面打水；


    吃海苔吃出塑料袋；吃大米吃出机油、石蜡；吃火锅吃出福尔马林(泡尸体的保鲜剂)；吃蜜饯吃出硫磺；吃火腿吃出敌敌畏；


    吃方便面吃出防腐剂（致癌的）；喝牛奶喝出三聚氰胺。


    欧洲人喝牛奶结实，中国人喝牛奶结石。


