- pgno: 215
  md: '孙法娣看在都是孙权的后人的面子上，没有跟他们继续竞争，决定另辟蹊径，换一种商业模式。


    什么商业模式呢？【傍文化模式】


    什么意思？各位，还记得有一篇文章说：桂林的山真清呀，桂林的水真静呀，有没有听过？你有没有听过一首歌叫做《我想去桂林》


    “我想去桂林呀，我想去桂林！”


