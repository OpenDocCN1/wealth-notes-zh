  md: '# 第18课：玛咖酒濒临破产到月入百万【盒子模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    玛咖姐，开了一个玛咖酒厂，因竞争激烈，加上经营不善，业绩不佳，到了濒临倒闭边缘。有一天参加了商业模式顶层设计的课程，学完课程之后，恍然大悟。于是给自己的玛咖酒设计了一个商业模式，本来频临倒闭的玛咖酒厂起死回生，当月实现百万收入，玛咖姐是怎么做到的呢？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_172_0.png)


    先给大家讲个故事。


    有一个卖珍珠的楚国人，为了让自己的珍珠更加好卖，这个楚国人找来名贵的木材，为珍珠做了一个盒子，用上等香料'
