- pgno: 58
  md: '当天就销售 200 份，每份 2 万块。


    各位，一共多少钱？400 万！


    原来的酒吧老板傻眼了，还可以这样的呀，没有见过呀！


    今天开眼了！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_58_0.png)


    当天，刘总给了原酒吧老板 200 万转让费，拍拍原来酒吧老板的肩膀说：“兄弟，这里面还有你 20%的股份呢，放心吧，跟着我干，今后吃香的喝辣的！”


    各位，这个案例讲到这里，我想问一下：刘总之前有没有先给钱给原来的酒吧老板？


    没有！


    刘总用了一套“空手道”轻松整合了酒吧老板，先去收客户的钱，收到钱再给酒吧老板。


    这才是真正的：“羊毛出在猪身上，熊更单！”


    这句话不管是你原来听过多少个版本的；今天你所听到的'
