- pgno: 28
  md: '啪小姐的，只是将来在一个合适的时间，用一种合情合理的方式拿回来而已！


    如果 20 个啪啪啪过的男人，每个人出了 250 元凑够了 5000 元，给啪啪啪小姐去打胎，这叫做【众筹】。


    众筹就是大家一起出钱，办一件事情。


    如果 20 个男人每人出了 250 元，凑够了 5000 元买营养品，生下的孩子卖了 10 万元，获得 19 倍的收益，这叫做【创投】。


