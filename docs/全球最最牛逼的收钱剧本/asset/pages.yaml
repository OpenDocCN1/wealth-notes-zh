- pgno: 203
  md: '# 改变世界商学院 世界企业家的摇篮 《全球贩牛日的收钱剧本》一诺老师专用


    一伊利！


    各位，小舍小得，大舍大得！吃亏就是占便宜！


    听到这里，有的人会问，这利乐公司葫芦里面卖的是什么药？这么好心倒贴钱的买卖，外国人也没有这么傻吧？


    好，我们一起看看利乐公司的市场红利！


    利乐公司的设备是亏钱的，但是，靠后期的包装材料赚钱！


    你想呀，设备是一次购买长期使用，设备的钱赚的是一次性的钱！


    而包装材料，每一盒牛奶都赚钱！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_203_0.png)


    利乐如法炮制，通过这种模式快速地完成了在中国布局：


    建立起遍布全国各地的分销网络，在中国的总部也正式由香港迁至上海。


    利乐公司产品行销170多个国家和地区在全球共有41家销售公司，43家包装材料生产基地，10家包装系统组装厂，拥有'
