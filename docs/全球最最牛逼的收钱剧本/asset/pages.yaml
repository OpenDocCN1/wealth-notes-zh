- pgno: 376
  md: '# 第41课：实体零售嚎户遍野！【让模式绝望的模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    从现在开始，三件事情千万不要做！


    +   - 第一：千万不要开零售实体店！

    - 第二：千万不要开零售实体店！

    - 第三：千万不要开零售实体店！


    实体零售业的终结时代已经来临，是的！你没有听错！


    实体零售业的终结时代已经来临！谁是终结者？


    零售业，又将何去何从呢？


    我来问大家三个问题：


    第一，有没有感觉到，现在的竞争对手比以前多了很多？


    第二，现在的房租，有没有比之前高出很多？


    重要的是第三条'
  merge: -1
  img_proc: true
- pgno: 377
  md: '第三，有没有感觉到现在的利润比之前少了很多？


    解放后，零售行业一共经历了五个时代：


    第一个时代：卖家时代


    那个时候，我们看到别人买一样东西，如果你很喜欢，就


    会问，在哪里买的呀？


    那时候，我们看到别人穿的衣服好看，会问，在哪里买的？


    那时候的人，也不会讲价，只要找到地方，问多少钱，然


    后买了就走！


    不是有钱任性！是卖东西的任性。


    那时候如果卖东西的不开心，还会说一句：买不买呀？不


    买不要看！


    第二个时代：买家时代


    随着国营企业的改制，下岗潮的到来，很多人开始下海经


    商，这下不得了，做生意的多 了，这客户就有挑选的余地了，


    可以说是挑花了眼。


    同样一件商品，哪里都有卖，消费者就开始比较起来了，


    比价格、比服务、比质量！'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# 第三个时代：品牌时代


    随着市面上同类产品越来越多，一些厂家为了从同类产品中脱颖而出，开启了品牌时代！


    随着生活水平的提高，消费者也开始有了品牌意识！


    因此，人们看重品牌的原因：有的看重质量保障！


    有的看重性价比！


    有的看重服务！


    有的看重品牌彰显的身份！


    因此，最先抓住品牌机遇的厂商和最先代理品牌的经销商获得了丰厚的回报！


    # 第四个时代：电商时代


    所谓贸易，就是赚信息的差价，就是知道的赚不知道的钱！


    这个时候，阿里巴巴出现了，让中国的厂家信息透明化，一下子几乎将所有行业的利润暴漏在阳光下。


    因此，颠覆了很多传统的批发渠道！


    阿里巴巴左手整合了厂家，右手整合了经销商！


    其实，传统零售业的噩梦才刚刚开始！'
  merge: -1
  img_proc: true
- pgno: 379
  md: '马校长创建了淘宝！如果你在逛街，看到一款产品，你会到淘宝上搜，这网上的价格比实体店便宜。


    你心想，还是上网去买吧！


    网上服务态度好！


    又便宜，款式又多！


    人们开始陶醉于网络购物！


    即使你是开实体店的，即使你知道互联网对实体店的冲击是很大的！


    可是即使你是实体店店主，你一边会骂马校长颠覆实体店的生意，一边继续在淘宝上购物！


    就像温水里的青蛙，你已经上瘾了，已经离不开了……


    微信搜索公众号 “改变世界商学院” 输入 “让模式绝望的模式” 就可以得到这一课的商业模式图解。


    # 第五个时代：终结时代


    大家听过我第十课牛哥的创业故事你就会知道，牛哥没有做过便利店，凭借商业模式 3 年的时间开了 10 万家实体店，一分钱没有花，而且开店的还要给牛哥加盟费！'
  merge: -1
  img_proc: true
- pgno: 380
  md: '别说你不相信，如果不是亲眼看到，我也不相信！


    10 万家店就是不加上选址、装修、铺货、招聘员工，每天


    要开业 925 家分店，每个小时开业 38 家，如果你喜欢剪彩，剪


    彩都剪到你手抽筋！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_380_0.png)


    这就是商业模式的魅力！


    听过我的课程，都会系统学习这个商业模式！


    有很多学员都去参观过这家企业，太强大了！


    好了，回到这个主题。


    # 第五个时代：终结时代


    即使是互联网颠覆了传统零售业，电商大佬们对结果还是


    不满意！


    你想呀，这年轻人是网购的主流，还有一群人，就是喜欢


    线下消费；应该说，中国目前 80%还是线下购物。


    也就是说，现在线上只占领了 20%的零售市场！'
  merge: -1
  img_proc: true
- pgno: 381
  md: '如果再过30年,这个现象也许会降低,再过30年可能80%, 甚至 90%, 都是线上消费！


    可是，这群财大气粗的电商，是等不了了。


    我分析了一下，可能会从三个方面拿下线下市场，尽快终结实体零售市场！大家有没有注意到，马校长开始布局农村淘宝，要做到每个村都有店！


    这是一件非常恐怖的事情：农村包围城市！


    你以为，就农村吗？城市怎么办呢？


    根据城市的特殊情况，之所以实体店不赚钱，主要是以下四个原因


    +   - 第一：房租贵！

    - 第二：人工贵！

    - 第三：利润低！

    - 第四：竞争大！


    我来给大家分析一下，马校长如何克服这四个困难：


    第一：房租贵！ 马校长的实力，你不用担心房租，资本市场的钱，亏得起！'
  merge: -1
  img_proc: true
- pgno: 382
  md: '而且，短期的亏损叫做：战略型亏损！


    第二：人工贵！很多老板都感慨，为员工打工！


    这个不用怕，马校长采用了无人超市！


    第三：利润低！马校长多年的耕耘，阿里和淘宝的卖家这么多！别说批量采购能够价格低了，大把的愿意不赚钱卖产品的厂家！有的是！


    第四：竞争大！无人超市本身就是一种新鲜事物，人都是有好奇心的，肯定回去看看！人气就起来了！


    接下来，降低了人工！又批量采购，成本降低！因此，肯定很多人都爱去！除了大型超市跟马校长拼一拼价格，那些小商家可能连一个月都熬不住！因为，小商家的家底子薄！


    所以即使几个月不赚钱，小商家做不到，而马校长有的是资本在支撑！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_382_0.png)


    不是吗？你去看看，京东不赚钱都可以熬好几年，滴滴连'
  merge: -1
  img_proc: true
- pgno: 383
  md: '续亏几年，为啥还能，呼风唤雨？


    因为是背后的资本！


    所以，等到其他店铺关门的关门，改行的改行，就只剩下马校长的店铺了，你觉得价格如果慢慢的，在你不知不觉中长一点点，你还会不会买呢？？？


    你以为，你还有的选择吗？


    竞争对手都死光了，你只能乖乖就范！


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_383_0.png)


    说到这里，你也许感到一个天大的危机即将来临！


    我试想一个画面，如果你是开超市的，刚好淘宝无人超市，就开在你家旁边，你什么感觉？什么心情？


    你每天晚上睡不着，第二天希望生意会回转，


    可是，回不来啦！回不来啦！


    各位，转让都没人接手！'
  merge: -1
  img_proc: true
- pgno: 384
  md: '正当你绝望、无助、后悔、懊恼、准备关门大吉之际，你的救星出现了……


    谁呢？京东的刘强东！


    如果刘强东对你说：“兄弟，不要怕，我来给你撑腰！我们京东一贯跟厂家打交道，我们成本价给你，甚至贴钱！我不赚钱没关系，让你赚钱！”


    你会不会欣然答应呢？会的！会的！肯定会的！


    可是，即使你卖的再便宜没人信任你呀；因为你没有品牌！


    重点来了，加盟京东，把你的招牌换成京东的品牌就有人相信了！


