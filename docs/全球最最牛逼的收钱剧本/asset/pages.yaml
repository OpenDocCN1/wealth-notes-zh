- pgno: 355
  md: '# 消费潜是教养出来的！

    —踏总编


    当把一种商品提升到文化乃至习俗的高度，你拥有的就是


    宗教般狂热和虔诚的信徒。


    然而我们不知道的是，钻石除了表面的光鲜美忠贞不渝，


    还有阴暗血腥的另一面。


    钻石给戴比尔斯带来了无尽的利益，却也给广袤的非洲大地带来了深重的苦难。


    这倒并非戴比尔斯公司的错，而是军阀因为争夺钻石的开采和控制权开启了惨绝人寰的内战。


    2005 年的电影《血钻》就处于这样的背景下。


    塞拉利昂盛产钻石，因为钻石背后的暴利，叛军首领桑科联合利比里亚军事强人泰勒建立革命联合阵线。


    桑科利用军队压迫人民抢夺钻石，又靠出售钻石获得的资金购买军火供养军队。


    为了打赢惨烈的内战，桑科组建了骇人听闻的娃娃军。'
