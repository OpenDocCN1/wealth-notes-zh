  md: "# 第13课：免费公厕年赚2亿欧元【免费模式】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。\
    \ \n\n在德国，有一家公司免费提供公厕，一年轻松赚取2亿欧元，今天把这个模式系统地分析一下。\n\n在德国，公厕作为政府的公共配套设施，本身都是由政府来投资建设和管理的。\n\
    \n德国政府为了有效弥补政府的资金不足，于是决定将公厕的经营权进行拍卖。\n\n但是，由于政府对公厕要求比较高，所以需要高昂的建设费用及维护成本，而使用者支付的费用又相对低廉，上一次厕所0.5欧元。\n\
    \n所以竞拍者精打细算之后，因为赚得太少，就跟政府压价。\n\n在这个时候，有一个叫瓦尔的人，他站了出来，跟政府说："
  merge: -1
  img_proc: true
- pgno: 122
  md: '“把这个厕所包给我，我敢接。而且承诺，完全免费提供给德国所有人使用。”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_122_0.png)


    当时，他们的竞争对手，都认为瓦尔疯了！


    他们算了一笔账：即使按照每人每次收费 0.5 欧元的高价计算，光一年柏林一个城市就得赔 100 万欧元以上。


    一个个的搞不懂瓦尔葫芦里究竟卖的是什么药。后来，原来的德国几十家做这个生意的人，一看着瓦特这个搅局的捣蛋鬼的加入，今后肯定这个行业没有什么意思了，于是纷纷改行做别的了，从此之后，再也没有人跟瓦尔竞争。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_122_1.png)


    利润来自于垄断，如何垄断？就是要消灭对手！如何消灭'
  merge: -1
  img_proc: true
- pgno: 123
  md: '对手？消灭对手最好的办法，就是让对手转行！


    于是，承诺免费建设，又免费提供给市民使用，对手全部被消灭。在缺少竞争对手的情况下，瓦尔拿下全柏林的公厕经营权。


    当然作为一个商人，肯定是赚钱为第一目标的。瓦尔的盈利点显然不会是在厕所门口 0.5 欧元的投币口上。


    瓦尔公司，不仅向政府免费提供公厕设施，而且还倒贴每个月的设施的维护、维修保养费，水费、电费、清洁工人工费。总之，一切后续的费用倒贴。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_123_0.png)


    这个时候，同行都笑了，觉得瓦特一定是疯了，他们一边背后骂瓦尔神经病，一边又看不懂瓦尔究竟葫芦里面卖的什么药。


    各位，同行看不懂就对了！当你的模式同行一眼就看懂，你就没机会了！'
  merge: -1
  img_proc: true
- pgno: 124
  md: '机会，就是给最早看懂的那个人！


    各位，当你设计商业模式的时候，就像开车的时候，明明你要往右转弯，但是你的转向灯往左打，什么意思呢？


    当同行看到你往左打转向灯，都以为你要往左转弯，其实，你是往右转弯，因为左边是悬崖，别 人谁都不敢跟着你，跟着你玩，只有死路一条。


    > 把这句话记下来


    别人看不懂的模式，才是真正的舒服模式！

    —诺老师


    瓦尔公司，因为免费，而且倒贴，所以怎么盈利呢？


    第一，他把厕所外墙变成了广告墙，加之瓦尔公司的墙体费用比一般广告公司低得多，什么香奈儿，苹果，LV 等这些高大上的公司都在这儿做过广告，整体风格还非常漂亮。


    第二，他们不单在厕所外墙作广告，还将内部的摆设和墙体也作为广告载体。


    第三，他们甚至把文学作品和广告印在了手低上，因为在德国，大部分人上厕所时，都有阅读的习惯。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '在柏林、法兰克福等 5 个城市，瓦尔公司就获得超过几千万欧元的广告收入。


    他们就靠着这种广告收入为主的商业模式一年就能盈利几千万。


    里面是免费的厕所，外面是赚钱的广告。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_125_0.png)


    瓦尔的公厕，里面印刷了很多优惠券，例如，购买奔驰轿车，代金券 1000 元。


    后来，有的人不相信，过去奔驰店买车的时候，把车价杀到最低，奔驰店的经理说，抱歉，目前是最低价了，少一分都不卖了。


    当客户出示瓦尔的优惠券时，经理说：“哦，这个还可以优惠 1000 元。”其实，奔驰店给瓦尔返利 1500 元，瓦尔把奔驰店给的 1500 元再让利 1000
    元给顾客。所以，很多人都习惯在瓦尔的公厕里拿优惠券。'
  merge: -1
  img_proc: true
- pgno: 126
  md: "每年，因销售各种品牌的汽车，每部车获得返利 100—500 元，年收入就上千万年欧元。\n\n瓦尔公司可谓把厕所这点事儿研究得炉火纯青。他把公厕里面做了房产的生意。谁的物业要出租出售。都到里面登记，。\
    \ \n\n后来别人一想起来租房子，就去上厕所，有人想要买房子的也去上厕所。瓦尔收取一定的中介费用，由于瓦尔收取的中介费用比较低，房产中介费用随便一年赚上千万。\n\
    \n![](img/ff9006615a5a1a6bfb1f601f8b3f246b_126_0.png)\n\n再后来，由于瓦尔为大家提供免费的公厕，越来越多的人感恩瓦尔。因此也就更加信任瓦尔，瓦尔因为赚到了钱，就心怀感恩，不停地付出和贡献。\n\
    \n例如：瓦尔免费进行失物招领、寻人启事、慈善捐款等等公益的贡献。得到了更多人的信赖。\n\n# 奇迹会在感恩的人身上重复出现！\n\n越来越多的德国人，都称瓦尔为厕所大王。因为信赖瓦尔，"
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 改变世界商学院 世界企业家的摇篮 《全球晨牛日的收钱剧本》一诺老师专用


    也愿意让瓦尔赚钱，有什么需求，租房、买房、买车、买家具、买办公用品，都喜欢在瓦尔的厕所里面找。


    到后来，世界各地慕名而来的人很多


    五年前，有一个叫黄总的，为了学习人家的模式，专门从中国买一张机票，去到德国，每天早上起来就去研究瓦尔的厕所，晚上回酒店休息，写感悟！第二天，又去厕所，晚上回酒店，写感悟！第三天，还是去瓦尔的厕所，晚上回酒店写感悟。写感悟写了
    10 万字。


    回国后，黄总一头雾水，看不懂，偶然的机会，参加了《商业模式顶层设计》课程学习。因为黄总是做钢琴生意的，学完之后改进了自己的商业模式：免费送钢琴给每个大学、中学、小学。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_127_0.png)


    一共免费借钢琴给 100 多个学校。即使每台 1 万块，也才投资 100 万，并且一台钢琴用几年不会坏。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 改变世界商学院·世界企业家的摇篮《全球孵牛日的收钱剧本》一塔老师专用


    各位，喝牛奶一定要自己养牛吗？


    黄总是这样跟厂家商量的：“这是样品，我也是没有收到钱，钢琴都摆在学校里面，学校开具收条，借用的凭证，凭证厂家保管。”其实，黄总自己也没有出钱。


