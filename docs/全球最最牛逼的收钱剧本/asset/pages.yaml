  md: "# 第23课：起心动念利他一切方法自来【利他】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。\
    \ \n\n先给大家讲个故事：\n\n有一个人，他想知道天堂和地狱究竟有什么区别。于是他找到了上帝，请求上帝带自己去看看，上帝欣然答应了。\n\n他们首先来到了地狱，看到的是这样一副场景：一群饥饿不堪的人们正拿着一根长勺拼命往自己嘴巴里送东西，但是那根长勺实在太长了，比他们自己的手臂还要长，所以他们无法弯曲手臂，因此，都无法把食物送进自己的嘴里，有的人的手臂甚至弯曲地变形了，但是还是没有吃到任何食物。\n\
    \n所以每个人都被饿的骨瘦如柴、奄奄一息，地狱果然是一副活生生的惨象。\n\n接着，他们又来到了天堂，那个人被自己眼前所看到的惊"
  merge: -1
