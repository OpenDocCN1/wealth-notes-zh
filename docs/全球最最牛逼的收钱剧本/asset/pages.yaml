- pgno: 354
  md: '把女人研究成这样，实在是不服不行。


    连拥有戴比尔斯百分之四十股权的奥本海默家族都不禁感叹：“感谢上帝创造了钻石同时也创造了女人。”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_354_0.png)


    多少年来，钻石已经逐渐绑架了消费它的人们。


    你以为女人看重的仅仅是钻石本身吗？


    错了，她们更看重的是你宁愿花掉三个月的工资差点年纪轻轻就过劳死而为她换来的一件爱情的象征。


    如果你把一诺老师这个音频推送给你未婚的女友义正言辞地指出买钻戒是一件傻A的事情，那么这种行为才是真的傻A。


    因为你的女友只需要看着你的眼睛，说一句话就让你哑口无言：“是的，这很傻，可是你就不能为我傻一次吗？”


    当你把所有营销学的书籍看完，都不如多听几遍这个音频的案例带来的收获大。


    消费者是培养出来的吗，显然不是！'
