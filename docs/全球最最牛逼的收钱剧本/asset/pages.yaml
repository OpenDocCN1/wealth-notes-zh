- pgno: 352
  md: '正是因此如此, 尽管钻石不断开采至今, 已经有五亿克拉,


    但在整体上还是供不应求，价格扶摇直上，因为只有戴比尔斯才可以卖钻石。


    你以为戴比尔斯的营销到这就算完成了吗？


    那这未免太小看他了。


    紧接着，戴比尔斯根据市场形势改变营销，再通过营销反控市场。


    上世纪八十年代，前苏联发现一座更大的钻石矿，大量碎钻供应于世面。戴比尔斯吓得尿了裤子，马上同苏联订立价格同盟。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_352_0.png)


    另一方面，为了不让钻石掉身价，营销广告顺势转向，强调碎钻一样高贵，钻石虽小依然代表高贵的爱情。


    钻石也彻底征服了底层阶级，大的好的卖给富人，碎的小的卖给穷人。'
