  md: '# 第四课：从负债到700家分店【勾引模式】


    大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。


    黄先生负债百万，在学了一诺老师课程后，设计了一个连锁店的加盟品牌，目前全国超过几百家加盟分店。


    当年仅加盟费一项，就超过2000万，加上卖给加盟店的设备和做奶茶的原材料，综合营业额达超过1个亿，最近又拿到了几千万的风险投资。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_75_0.png)


    他是如何做到的呢？我们一起来分析黄总的奶茶案例！


    黄总早年在大陆做工厂赚了一些钱，后来生意不景气，亏得一塌糊涂，实在没有办法了，靠跟别人打工，一年赚了20万，准'
