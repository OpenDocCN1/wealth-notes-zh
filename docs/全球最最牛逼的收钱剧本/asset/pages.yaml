- pgno: 297
  md: '2005 年 7 月，麦克唐纳从祖母的杂货堆里，捡到了一枚“红色别针”，这个别针是祖母当年花了一分钱买的！


    麦克唐纳非常喜欢，就带回了纽约。


    回来到纽约之后，麦克唐纳在网上发布交换广告。


    哥伦比亚的一对姐妹很喜欢，就用“鱼型钢笔”进行交换！


    用这只“鱼型钢笔”换了一只可爱的“陶瓷门把手”。


    后来，在美国西雅图又用“陶瓷门把手”换了一台“烤炉”。


    经过几轮的交换，麦克唐纳认识到：每次交换都使得自己的物品不断升值。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_297_0.png)


    换来的物品越来越值钱，从此一发不可收拾！


    接着，用“烤炉”换来了一个，“大啤酒桶”。


    紧接着，啤酒爱好者用一辆“雪地摩托车”换他的“大啤酒桶”。


    # 要学会通过一次又一次的运作，让自己的资产增值！'
