- pgno: 259
  md: "# 第27课：从41元到220亿【飞科模式】\n\n大家好！我是一诺老师。当今企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争！一诺老师教您《商业模式·顶层设计》。\
    \ \n\n![](img/ff9006615a5a1a6bfb1f601f8b3f246b_259_0.png)\n\n如果你手里只有 41 元，你能够干嘛？\n\
    \n吃顿饭？买包烟？还是打一场游戏？或者是看一场电影？\n\n很多人没有把钱花在刀刃上，于是一生碌碌无为，可是就有人用这 41 元钱创造了 220 亿的财富神话。\n\
    \n他是谁呢？\n\n他就是飞科创始人，李丐腾。\n\n李丐腾出生在温州永嘉一个叫李大屋的山村，他从小就害怕自己一辈子困在这个山沟沟里。"
