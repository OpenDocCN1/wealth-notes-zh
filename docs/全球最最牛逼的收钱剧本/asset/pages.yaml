  img_proc: true
- pgno: 76
  md: '备开一家奶茶店。可是，好的位置转让费都二三十万，手里的钱根本不够。


    各位，我想问你： “喝牛奶，一定自己养牛吗？”


    所以接下来他是这样做的：


    首先，他把公司注册到香港或者澳门，这叫：外来的和尚好念经！


    第二，他给公司起个好听的名字。各位，为了保护他的商业机密，我们这里就不能说出他的公司和品牌了。


    然后借鸡下蛋：找一家奶茶店，告诉他：“我们是一家国际著名奶茶品牌，我们准备在中国开设 3000 家连锁店，现在为了打造样板店。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_76_0.png)


    只要你免费加盟我们，就可以看到五大好处：


    第一：免收 10 万元的加盟费；


    第二：从澳门和香港总部派，专业大师傅，教会你们的师'
  merge: -1
  img_proc: true
- pgno: 77
  md: '父，免费的；


    第三：再派一名店长和 7 名店员，辅助店里搞促销，工资总部来发；


    第四：签订协议，如果你的营业额没有增加 20%以上，公司补贴 10 万块；


    第五：现在签约，还送给你价值 10 万的，门店招牌和专业设备；


    各位，如果是有人给你开出这五大好处，我想你也是经不起这个诱惑的；


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_77_0.png)


    讲到这里，我要插播一个春天的故事。在春天小时候，家里很穷很穷，穷到家里都没有老鼠和蟑螂，春天穿着打补丁的衣服读书，被同学看不起，那个时候，春天认为贫穷是莫大的耻辱！


    都说穷人的孩子早当家，春天满脑子只有一个想法：赚钱！'
