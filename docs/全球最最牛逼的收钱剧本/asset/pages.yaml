  md: '# 改变世界商学院 世界企业家的摇篮 《全球赚牛日的收钱剧本》一诺老师专用


    他就是严彬，也许你可能不知道严彬是谁，但你一定知道他公司旗下的一款产品，“困了累了喝红牛！”。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_391_0.png)


    今天，一诺老师带你一起学习的，就是他的艰苦奋斗史和传奇的创业历程。


    1954 年，严彬出生于山东一个贫穷的家庭，16 岁初中毕业，作为那个年代必须上山下乡的知识青年，严彬来到河南省插队。


    在那个与山西交界的极贫困地区，他干了整整一年，却只得了 92 元钱。他每天的口粮只有红薯，几乎连白面都没有见过。


    因为穷怕了，于是严彬选择了去泰国寻找新的生路。


    刚到泰国，人生地不熟，语言又不通，严彬就在曼谷的街头流浪，一个星期就把从家里带的干粮吃没了。


    第八天，他饿迷糊了，恍惚中被人拉到一个隐秘的诊所去卖血。报酬是 100 泰铢，外加一盘炒猪肝。


    正是靠着卖血的那 100 泰铢，严彬在曼谷安顿了下来。'
  merge: -1
  img_proc: true
- pgno: 392
  md: '他在码头找到一份卸货的苦力活。那时候的码头，白天都是当地人的天下，严彬只有晚上干活。由于语言不通，经常一到发工资的日子，他就被老板以各种理由辞退，“一个月白干”。


    实在青黄不接的时候，严彬只好再去卖血。免费赠送的炒猪肝，是他最奢侈的午餐。到了 1972 年初，由于长期营养不良，血液质量不达标，严彬连卖血的路，都走不下去了。


    > 此段句需记下来

    自古英雄多磨难，从来锦绣少娇男！

    —诺老师


    好在天无绝人之路。严彬终于在唐人街找到一家招工的饭店，“面试”时，他甚至不要求老板给工钱，对于薪酬的期望，他只有四个字——“管饭就行”。


    由于严彬饭量大，吃得多，老板娘很不高兴，说：“北方佬吃得真多！”为保住工作，他只好每顿只吃一碗饭，然后自己拿工资去买米，煮熟后用酱油拌着吃。


    那时候，对严彬来说，最奢侈的就是：能有口饱饭吃！


    打工期间，严彬勤奋善学。'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# 改变世界商学院 世界企业家的摇篮 《全球搅牛日的收钱剧本》一诺老师专用


    别的学徒睡到8点钟才起床，他5点钟就起来到院子里打扫卫生，做好工前的准备工作。自古天道酬勤，皇天不负有心人，不到两个月被老板任命为经理。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_393_0.png)


    自1974年始之后的10年间，他先后在房地产、贸易、旅游等公司干过，初步掌握了各行业的业务运作。这些经历都成为成就他后来创业辉煌的基石。


    30岁那年，严彬攒到了人生的第一个20万，他在曼谷买了第一套公寓。半年后，公寓价格就翻了30%。


    就在房价飙升期，他做出了一个大胆的举动：他把曼谷的房子卖了，成立了华彬集团，“进军房地产领域”。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_393_1.png)'
  merge: -1
  img_proc: true
- pgno: 394
  md: '当时，刚好赶上泰国房地产行业的黄金十年，“只要盖好房子，销售一点也不用愁”。遇到实在卖不出去的尾房，严彬就“自己拿着”，顺便扩展副业。


    当时严彬自己还在做旅游，接待大陆的游客。因为报价最低，游客不少，闲置的空房恰好可以提供给游客居住。


    在短短 5 年时间里，华彬集团从房地产业扩展到旅游、国际贸易，并逐渐成为曼谷华人圈中小有名气的企业，甚至进入泰国高层的视野。


    到了 1989 年，严彬偶遇十五年前唐人街的华人老板，当时的他准备回大陆养老。临别之时，他把自己位于曼谷市中心的一块地转让给了严彬。地理位置非常好，相当于北京的西单。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_394_0.png)


    严彬用了一年时间，盖了两栋“华彬大厦”。此后 2 年，索菲特酒店、王朝酒店、奥米尼大厦、城堡式私家花园别墅相继拔地而起，成了名副其实的富人区。'
  merge: -1
  img_proc: true
- pgno: 395
  md: '就这样，严彬赚得了真正意义上的人生第一桶金。


    # 是的，你需要获取人生的第一桶金，如何获得了？


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_395_0.png)


    现在这个大楼还在曼谷的市中心；严彬自己谈起此处房地产也颇为感慨，“虽然装修老一点，但，却是历史的见证”。


    1990 年，严彬在北京设立了华彬办事处，着手把泰国的业务向北京迁移。


    1995 年，他在北京长安街买下来了一个烂尾 12 年的楼盘。

    那是一个没人敢接的烫手山芋。


    严彬找一位商业银行行长贷款，这位行长很惊讶地说：“这楼在长安街旁立了 12 年了，谁要是还能把它建起来，我就从楼上跳下去。”


    那时候中国还未实行房改，房地产市场还无从说市场化、商品化，其运作复杂程度可想而知，但严彬依然坚信自己的选择是对的！'
  merge: -1
  img_proc: true
- pgno: 396
  md: '为了建好这个楼，他不眠不休地待在工地上，20 多层的楼每天上下几十次。


    功夫不负有心人，这栋楼最终顺利剪彩，这就是华彬大厦。


    直到今天，华彬大厦依然是长安街上一道风景，总建筑规模 5 万多平方米，云集了众多知名的企业，泰国大使馆也入驻其中，每天都有数不清的名人出入。


    这是严彬在国内打响的第一枪。接下来，他来了一次资产大挪移，不想这事却成为商界的一个传奇。


    这事发生在 1997 年，华彬大厦建成后，严彬陆续把在泰国的资产变成现金转到北京。1997 年 7 月 2 日，亚洲金融风暴席卷泰国，泰币贬值。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_396_0.png)


    这场风暴横扫了马来西亚、新加坡、日本和韩国等地，打破了亚洲经济急速发展的景象。泰国企业死伤大片，唯独严彬毫发未损。'
  merge: -1
  img_proc: true
- pgno: 397
  md: '乃至于当大多数企业于经济萧条的大环境中艰苦度日之时，


    严彬的企业还保持着资金的增长。


    有人说这出自严彬对市场天生的敏感。


    严彬也曾谈起自己对“市场敏感”的理解。


    他说：“所有的市场管理的书里是没有的，关键是，你是不是注意这个东西，是不是很冷静地去看待市场。企业到了一定程度，市场是第一位的，你不会做市场，不会看到你自己的消费人群，不会找出自己的市场空间，什么都是假的。”


    严彬这份悟性也不是白来的，他“每天只睡5个小时，中英文的报纸一天要看二十份。”


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_397_0.png)


    除此之外，一诺老师还总结了五点严彬成功的关键要素；


    微信搜索，公众号“改变世界商学院”输入“红牛模式”就可以得到这一课的商业模式图解


    真正让严彬财富暴增的是他把“红牛”带入了中国市场。'
  merge: -1
  img_proc: true
- pgno: 398
  md: '由于是把红牛引入中国的第一人，他也因此被称为“牵牛人”。


    1995 年 3 月，严彬从北京飞回曼谷，一下飞机就赶往公司开会。助理递上一瓶金罐饮料，喝了几口后，严彬当真一个下午都精神抖擞。


    后来他得知这是出自华裔商人许书标的“红牛”，号称运动功能饮料，有提神醒脑、补充体力之功效。


    严彬马上了解了一下情况。


    原来早在 1982 年，奥地利第一富翁迪特里希去曼谷时就发现了红牛，震惊于红牛的威力，随后跟许书标签订了战略协议，“创建奥地利红牛”。


    > 把这句话记下来

    世界不缺少商机，只缺少发现商机的眼睛！

    —塔老师


    此后 15 年，红牛在欧洲卖得非常火。


    “既然红牛在东南亚、欧洲和澳洲那么火，为什么不进入中国市场呢？”严彬当即决定吃下这块大肥肉。'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# 改变世界商学院 世界企业家的摇篮 《全球最牛B的收钱剧本》一诺老师专用


    要说这是严彬结缘红牛纯属偶然，其实一诺老师认为，这都是必然，这是长期摸爬滚打在商业锻炼出来的一种对市场敏锐的嗅觉。


    各位，重点来了，你有没有发现国内很多一流企业都是复制国外的成功模式！


    腾讯复制MSN，淘宝复制亚马逊，滴滴复制优步。


    企业家出国不单纯是游山玩水的，是开阔眼界的同时找到最新的市场商机。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_399_0.png)


    一切都是刚刚好，许书标正计划进军大陆市场。


    两个相差30多岁的人一见如故，当即达成了合作共识。


    1995年夏天，严彬拿到了红牛的配方和商标使用权，并在深圳特区成立了“红牛维他命饮料有限公司”。


    在1995年的中国饮料市场上，相比其他碳酸类、果汁类饮料，红牛是个十足的另类。怎么办呢？'
  merge: -1
  img_proc: true
- pgno: 400
  md: '严彬用了五套营销方案


    # 第一：品牌定位


    首先 “让品牌落地”。


    严彬率先确定了 “红牛=能量” 这一独特的品牌价值。


    随后的一系列营销策略，都围绕着 “能量” 展开。


    # 第二：进行娱乐赞助


    在 1995 年的春节联欢晚会上，主持人一句“红牛来到中国”


    拉开了国内功能饮料的序幕。


    一夜之间，全国人民都知道了 “红牛” 的存在。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_400_0.png)


    # 第三：广告宣传


    严彬的策略就是携资金优势，高举高打。


    俗话说：兵贵神速！


    “必须让亿万大众尽快知道红牛”，央视成为严彬的首选。'
  merge: -1
  img_proc: true
- pgno: 401
  md: '1995 年全年，严彬一口气投入 2 个亿的人民币，在各大卫视轮播轰炸，“累了、困了、喝红牛”，这句广告词家喻户晓，让红牛火了十几年。


    # 第四：高频率捆绑营销


    他还将红牛与加油这个动作做了捆绑，叫“高频率捆绑营销”！在全国近 10 万个加油站中，随处可见“汽车要加油，我要喝红牛”的广告语，上百万高端商业人士成了红牛的活广告。


    ![](img/ff9006615a5a1a6bfb1f601f8b3f246b_401_0.png)


    # 第五：赞助体育赛事


    严彬把红牛与体育赛事划等号，“你的能量，超乎你的想象”。

    1995 年开始畅销，并成为运动员的标配，从 2000 年开始，严彬开始赞助中国青少年三人篮球赛，“在校园里培养一批红牛的忠实拥护者”。'
