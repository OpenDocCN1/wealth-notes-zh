    # 1.指读会影响孩子的阅读速度吗？


    指读的习惯一旦养成后，会不会影响孩子以后速读或默读的速度？


    Dr. 魏


    上个星期我们学习了《宝宝识字能力提升攻略》，其中有一个提高孩子识字的小技巧——指读，也就是指着书逐字逐句地读。孩子就会意识到：原来这个符号是这么念的，是这个意思。


    当孩子刚学习骑单车时，先是三轮车，然后是加了辅轮的双轮车，最后等他骑车技能提升到一定高度，就 repel 可以骑普通 的双轮车了。指读就是那多出来的轮子，在孩子识字和阅读能力还比较弱的时候，帮他们一把。如果你不担心孩子会依赖多出来的轮子，也不用担心指读，孩子能力到了，就会减少使用的。


    现在有一些流行的快速阅读的方法，提倡默读，也就是在阅读时，心里不要发出声音来。我自己是做不到的。而且，脑科学研究表明，阅读时内心有声音是正常的，用专门的仪器可以检测到大脑中处理声音的皮层和激活动更高。目前也没有研究支持默读能够提高阅读速度。


    另外，光有速度也不够，走马观花翻完一本书，理解和记住的东西不多，这也不是你想要的。阅读效果更重要。多读书，加强知识积累，听起来不酷，但这才是行之有效的方法。比如我熟悉脑科学的背景知识，当我看到前额叶、杏仁核、边缘系统等专业术语就秒懂，读起来肯定比门外汉快；如果是我不熟悉的领域，我也需要放慢速度，来消化陌生的知识。


    建议你复习以下两个攻略，你会对宝宝的识字和阅读，有更多的认识。


    专题 | 宝宝识字能力提升攻略

    专题 | 培养阅读小达人

