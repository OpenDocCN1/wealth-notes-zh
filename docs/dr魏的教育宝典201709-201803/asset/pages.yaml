    谢谢你的关注，欢迎经常来提问！

    对于这个问题，其实每个孩子的个性不同，有的强硬些，有的温和些，面对冲突时，反应不同也是正常的。

    美国有一位非常受人尊敬的心理学家叫吉诺特，他说：孩子的欢笑和泪水同等重要，情绪使人的品格高尚，人类之所以是'
