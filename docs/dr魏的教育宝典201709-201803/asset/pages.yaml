  md: '# 155 | 如何参与和引导儿童游戏？


    Dr. 魏

    下面哪些情况你觉得不需要大人参与到游戏中？


    小孩子都爱玩游戏，如果说大人是在工作中学习、成长的，那孩子是在游戏中学习、成长的。游戏会影响早期儿童大脑神经回路的连接，为孩子未来的兴趣和能力打好基础。比如玩积木、唱童谣或者是玩躲猫猫游戏，这些看起来简单的游戏就像课堂一样，可以提供孩子学习语言、艺术、智力等各能力的场景。


    不过，关于儿童游戏，你要做的不只是提供环境和玩具这么简单，家长正确的参与和引导也很重要。在孩子不同的游戏阶段，有相对应的需要注意的干预技巧。一方面，研究发现，父母的参与可以增进宝宝玩游戏的专注力，并且提高游戏行为的层次。另外一方面，如果过多或者不当的介入到儿童游戏中，可能会让孩子产生过度依赖，无法独立玩游戏。


    怎样参与到儿童游戏中才适合？正式讨论这个问题前，我先考考你，请你凭第一印象做一道题，看看下面哪些游戏情况你觉得不需要过多地干涉孩子：


    +   A. 4岁的孩子，喜欢进行简单而重复性强的游戏，比如心不在焉地翻书，反复地玩手。\nB. 1岁的孩子，喜欢进行简单而重复性强的游戏，比如反复推倒积木，往地上扔物体。\nC.
    4岁的孩子，经常独自游荡、无所事事，最多只是冷眼旁观别的小朋友玩玩具，不跟他们互动。\nD. 1岁的孩子，不喜欢跟别的小朋友玩游戏，只喜欢自己玩自己的。


    好，答案是B和D。对于一两岁的宝宝，如果他们喜欢一些简单而重复性强的游戏，或者喜欢单独玩游戏，这是他们处在正常游戏发展阶段的行为，这时候不需要大人特别介入到游戏中。


