  md: '他也能理解吃蔬菜能让自己更健康，比如我小女儿知道，多喝牛奶能让她长高。


    可是，传统的育儿方法是將孩子和大人对立起来，认为孩子是没有思维、没有能力，需要在各方面被大人控制保护。很多育儿方法会教你如何管教、操纵自己的孩子，但是很少有育儿方法会像科学研究一样告诉你，孩子是怎么想的，他已经具备了哪些能力，尚不具备哪些能力。而只有知道这些，你才能做到真正理解孩子、尊重孩子，以孩子的视角跟他们去对话，你才能得到他的认同，才能够改变他的思维，最后改变他的行为。


