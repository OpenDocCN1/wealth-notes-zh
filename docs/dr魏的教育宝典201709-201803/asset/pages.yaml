    134 | 读者问答：孩子总爱...


    Dr.魏


    下周我将与你一起讨论两个话题，一个是乐观，另一个是弗林效应。


    面对同样的事情，乐观的孩子和悲观的孩子会有不同的表现。怎样培养孩子乐观的态度，不怕失败，往积极、正向的方向看待事情？下周告诉你。


    另一个话题是弗林效应。有人问我，有必要科学育儿吗？我们的祖辈什么育儿知识也没接受过，也照样活得很好呀。研究表明，人类的智力在过去的100年里有了很大的提高，如果你跟你的曾祖父一起去测试智商，很可能你的分数会更高，这就是所谓的弗林效应。教育对智力有促进作用，下周我来谈谈智力和弗林效应。


    # —— 本周问答时间 ——


    +   1. 孩子总爱说不，怎么办？

    2. 孩子为什么老问“你爱我吗”？

    3. 父母可以在孩子面前表现出适度的亲密吗？

    4. 孩子适合看什么样的动画片？

    5. 用卡片还是用实物教孩子学词汇？


    # 1. 孩子总爱说不，怎么办？


    小孙子1岁6个月了，近段时间总爱说“不”，出去玩该回家的时候，他拧着头说“不回家”；洗过澡不愿穿衣服，躲着你说“不穿、不穿”；该睡觉的时候也不愿睡觉，说“不睡觉觉”；你跟他说宝宝要听话要乖乖，他就说“不听话，不乖乖”。


    跟他讲道理，他好像也听不懂，总跟你说“不”，有时候感觉他专门跟大人扛着来，而且他还笑，感觉很好玩的样子。这个时期的孩子该如何引导呢？有哪些科学教育妙招呢？


    Dr.魏


    这个年龄段的孩子爱说“不”，主要是因为自我意识萌芽了，孩子有了自己的想法，他想自己做决定。虽然孩子不像以前那么好带了，但这其实是他长大的表现，培养孩子的独立品格、责任心，可以抓住这个机会。


    孩子出去玩不想回家，直接跟他说该回家了，他会说不。这时候，你不妨给他两个选择：你想要再荡五次荡椅，还是荡十下秋千？这样既满足他还想玩的兴致，又必须在你能够接受的时间范围内离开。而且，他能够做决定，满足了自主感，会更愿意配合一些。


    同样，在穿衣服的时候，你可以给他选择，是先穿衣服还是先穿裤子？要先穿左手还是右手？他做得好的时候，及时给他肯定，满足他的成就感。


    当然，这个阶段的孩子容易发脾气，也是他表达自己想法的表现，是正常的。如果搞定发脾气的孩子，你可以复加以下列文章。


    # 2. 孩子为什么老问“你爱我吗”？


    女儿老是问：“你爱我吗？”得到肯定回答后又问：“那批评我的时候呢？”我说：“就算批评你的时候，我也是爱着你的。”她不再说话，就只是把头埋进我的怀里。


    按理说，平时我们之间经常说“我好爱你呀”这种话啊，为什么还要问呢？是因为我最近对她的批评多了，还是就是为了好玩？


    Dr.魏


    孩子很聪明，她想探测你对她的爱是有条件的，还是无条件的。


    我们知道，给本界里有一个著名的“熊孩子”叫大卫。大卫是一个总把家里搞得一团糟的小男孩，在墙壁上乱写乱画、把浴室变成一个沼泽地、头戴铁锅敲得咔当乱响……大卫妈不得不身心俱疲地说：“大卫，不可以！”


    小孩子调皮捣蛋，往往是因为抑制不住冲动、好奇，情绪脑打败理性脑，事后被大人批评的时候，他们也会担心，爸爸妈妈是否不喜欢自己了。


    大卫妈和你做得一样好。在鸡飞狗跳后，她总会给大卫一个温暖的拥抱，说：“大卫乖，我爱你。”看完N本《大卫，不可以！》之后，你就会明白，大卫妈对大卫的爱是无条件的，但对他的行为是有条件的。


    孩子在和你发生矛盾后，她想知道：妈妈会不会因为我不乖、不听话，就不爱我了？孩子敢于问你，其实正是说明你们的关系好啊！


    跟无条件的爱相反的是，有条件的爱。比如有些父母或老一辈会吓唬孩子，你再不听话，我就不要你了；你再不好好写作业，不要叫我妈！这种话破坏安全感，千万别说。


    # 3. 父母可以在孩子面前表现出适度亲密吗？


    我和爱人在女儿面前会有抱抱之类的动作，女儿看见了就会过来抱在我们一起。我的问题是：夫妻表现出适度的亲密，对孩子的安全感培养，是利还是弊？


    另外，我们家是四口之家，孩子、爸爸、妈妈，还有孩子姨姥长期一起住，关系很融洽。女儿表现出来的安全依恋关系是分到我们三个人身上的，这样好不好？还是需要集中呢？


    最后，有一次姨姥肠梗阻，在医院，女儿哭得可心疼了，我做了情绪安抚，解释说姨姥没事了，回到家里再让女儿跟姨姥一起睡。请问孩子的反应是否是缺乞安全感，我的处理对吗？


    Dr.魏


    夫妻之间表现出适度的亲密，比如亲脸、拥抱，对孩子是有好处的。父母是孩子的第一任老师，她在你们这里学习如何与爱的人相处。未来她谈恋爱了，在跟彼此表达爱意的时候，就不会感到别扭。


    第二个问题，孩子依恋的对象有爸妈和姨姥三个人，这是好事。我们总说爸妈和孩子的关系很重要，这是因为你们是孩子的主要养育者。如果其他家人也经常照顾孩子，和孩子建立依恋关系，这是正常的。在心理学上有一个专有名词来描述叫做多重依恋。孩子多一个人来爱，偷着乐吧！而且，这样能减少麻烦，比如爸爸妈妈突然有事要出差一段时间，家里有和孩子关系好的姨姥来照顾，孩子会适应得快一些。


    最后一个问题，孩子看到姨姥生病很伤心，这不是缺乏安全感，而是有关心理的表现。你安抚她的情绪，没毛病！


    # 4. 孩子适合看什么样的动画片？


    儿子在看动画片《熊出没》后说：“熊大熊二是坏蛋，它俩不让光头强砍树，如果光头强不砍树，李老板就不会给发工资了。”面对这个问题，我该怎么解释，还是选择回避呢？


    Dr.魏


    我不推荐孩子看《熊出没》《喜羊羊与灰太狼》这种类型的动画片。


    你看啊，《熊出没》每一集的套路基本上都是，光头强想要砍树，熊大熊二阻止光头强，不让他砍树，光头强骂它们臭狗熊。《喜羊羊与灰太狼》则是灰太狼想吃羊，喜羊羊带领小伙伴打败灰太狼。两者都常常有暴力情节。


    在这个过程中，孩子学到的是去排挤别人、使用暴力对待别人，对他们的心理成长长害。


    建议你给孩子选择更有营养的动画片。比如《爱探险的朵拉》，学习朵拉爱探索、爱解决问题精神；比如《小猪佩奇》，你可以从猪爸爸猪妈妈身上得到积极教养的启发，孩子可以从小猪佩奇'
