    # 1. 女儿有嫉妒心正常吗？


    女儿才两岁10个月，就已经产生嫉妒心了。之前我穿漂亮衣服，女儿就不高兴地说：“妈妈我想想要这个衣服，我怎么没有？”“妈妈你别穿这么漂亮出门，我才要穿漂亮！”我对她说：“这样不对哦！咱们都要漂亮。妈妈要是不逛逛逛逛地出门，上班的地方会不要妈妈了哦！别人也会说，你的妈妈粉五呢！”但我认为我的沟通方式不是很好，请问该怎么沟通呢？她这样的心理正常吗？


    Dr. 魏 你耐心地跟女儿解释，告诉她这样穿出去会有什么后果，并且反思自己的沟通方式是否够好。我给你打70分！


    # 2. 宝宝喜欢撕书怎么办？


    我家宝宝一岁，我想和他一起亲子阅读，但是每次刚开始要读，宝宝就会自己把书拿过去，然后胡乱地翻起来，还会撕书，而且好像也不太感兴趣，这种情况该怎么办呢？


    # 3. 如何做好time out（平静中断法）？


    女儿两岁，曾经因为调皮处罚过她，带她到家里的小房间开灯坐地上。有一次晚上，她又不肯好好睡觉，所以最后也带她到小房间去。可是她进了小房间后异常冷静，自己坐在地上。当妈妈说：“你准备好睡觉了吗？现在是睡觉时间，没有的话，你自己坐在这里。”她回答说：“No.”然后妈妈说：“那我要关门走了。”她就站起来自己把门关了起来，也不哭闹。过了十秒钟她说：“妈妈，好了。”然后自己开了门。妈妈说：“那可以回床上睡觉了吗？”她点点头。


    # 4. 给宝宝做情绪引导没有效果怎么办？


