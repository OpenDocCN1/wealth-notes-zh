  md: '# 121 | 一个效果惊人的数字游戏


    Dr. 魏


    上周，我讲了数学推理能力的重要性，其中金牌家长@冯英 告诉她是用扔骰子下棋的方法，教会孩子数学等式。比如何扔骰子，骰子是3，表示棋盘上从0出发走3步，并且写出0+3=3加法的等式。骰子上还有负数，扔到负数就后退，写出减法的等式。


    无独有偶，科学家发现，这种棋盘游戏确实可以促进孩子数学能力，超级简单，只要用对方法，效果惊人。


    # 1. 西格勒教授的实验


    卡耐基梅隆大学的心理学教授西格勒（Robert Siegler）和小伙伴们做过一个实验，看看棋盘游戏能不能提升孩子对于数量大小的感觉能力。一共有58个4岁左右的孩子参加这个实验，他们被分成了两组，玩两种不同的棋盘游戏。一组孩子玩数字游戏，另一组孩子玩颜色游戏，都是在两周之内，一共玩四次，每次玩15分钟。


    怎么玩数字游戏呢？道具是一块长纸板、一个骰子和两个带动物图案的圆纸片。纸板上从左到右画10个方格，每个方格里写着一个数字，从1到10。在1的左边，是“开始”的位置。骰子的三个面上是1，另外三个面上是2。


    游戏开始的时候，孩子可以挑一个他喜欢的动物图案圆纸片，放在“开始”的地方，然后跟大人轮流扔骰子，扔到几，就往前走几步，同时大声念出方格里的数字。比如说，如果孩子原来在7，又扔到2，那么他要从7往下接着数两个数“8、9”。谁先走到10，谁就赢了。颜色游戏跟数字游戏规则一样，只是把数字都换成颜色。


    结果，这四次游戏，加起来才一个小时，就产生了明显的效果，玩数字游戏的孩子们，在数轴估计、数数、数字识别、数量对比四个方面的能力都有提升，这种提升甚至在两个月之后还能测得到。玩颜色游戏的孩子则没什么变化。


    后来，西格勒教授团队还做了进一步的实验，他们看看，不用长条形纸板，而改用圆形纸板，对孩子的数学能力提升有没有影响，所以把数字游戏中 纸板设置为圆形，其它的还是和以前一样。另外，他们还加入常见的幼儿数学活动进行比较。


    因此，他们把一组4岁到5岁的孩子，分成了三组：


    +   - 第一组还是玩长条形纸板做的数字游戏；

    - 第二组的游戏规则跟第一组一样，只不过是板子的形状变成了圆形，把一个圆形平均分成12个格子，顶上两个格子里是“开始”和“结束”，然后顺时针或者逆时针在格子里标注从1到10的数字；

    - 第三组孩子做常规的数学活动，比如常见的数一串数字、点数物品，还有认数字。


    实验活动一共持续三个星期，孩子们玩5次游戏，每次15~20分钟。


    你猜结果怎么样？对，玩长条板数字游戏的孩子收获最大，在数轴估计、数数、数量对比和计算四个方面都有特别明显的提升，比玩圆形板数字游戏和常规活动的孩子进步都大。


    # 2. 长条板数字游戏的奥秘


    是不是很神奇呢？我们来仔细看看这个长条板数字游戏的奥妙所在。


    首先，你可能注意到了，把游戏板换成圆形，效果就不好了，这是为什么呢？你看，长条形的游戏板，是不是像一个数轴？孩子在玩游戏的时候，一步一步向右走，数字也越来越大，这跟数字在数轴上的关系是一致的。有证据表明，成人和大一些的孩子常常在脑海里类似数轴的形式来代表数值。所以，用长条形这样的线性游戏材料，刚好跟这种数值的表征方式相符合。在这里，科学家提出的是一个认知取向的理论框架，用于考虑怎样利用物理材料最有可能产生有效的学习。西格勒教授还发现，如果孩子小时候对数值和数轴的数学直觉好，那么他上小学和中学的数学表现也更好。


    其次，你发现孩子玩游戏的时候，是怎么数数的？纸片在方格上移动的时候，孩子 的纸片在哪个格子，就念哪个格子里的数字，然后接着原来的格子数字再往下数。一般咱 们玩这种游戏的时候，如果扔骰子时扔到“2”，就从当前的一格往前跳，数“1、2”。但如果这样的话，只能练习数“1、2”这两个数字串。而在实验中，游戏要求孩子接着往下数格子里的数字，这样，孩子一方面需要把格子上写的数字符号与自己念的数字发音对应起来，从而认识数字；另一方面，孩子还不知不觉中做了加法计算。比如从5开始，移动2格，孩子读的是“5、6、7”，5+2=7。同时，这种玩法非常直观地展示了数量之间的比较：移动得越多，就越往右走，而且数字变得越来越大。研究发现，如果在玩游戏的过程中，孩子对数字与数值的大小之间的关系进行编码，那么在后来的测试中，大脑就可以更容易提取这些编码，更好地完成计算任务。


    还有非常重要的一点，在游戏的过程中，孩子自己数数，自己动手移动纸片，他的视觉、听觉、动觉和时空线索都与数值大小产生关系，形成一个综合的线性结构。方格里的数字越大，孩子移动纸片的次数越多，听到的、说出的数字越多；移动纸片的距离越大，玩游戏花费的时间越长。比如，孩子要把纸片移到2，他要用手移动两步，空间距离大概是两个方格；如果把卡片移到4，他的动作和所用的时间是移动到2的两倍，总共移动的距离也是2的两倍。在一定程度上，孩子自己的动作知觉线索会影响到这样的数学学习。所以，要让孩子自己动手移动纸片，只看着别人移动就没有那么多的线索了，效果也没那么好。


    # 3. 玩游戏的小提示


    听到这里，你是不是早就想跟孩子玩一玩试试看呢？玩吧，很简单的。


    你可以参照科学家们的方法，用家里的废纸板自制游戏道具，注意格子大小一定要画得一致。或者买现成的蛇形棋也行，买的时候注意游戏板，最好是一行有十个格，从1到10，再从11到20这样的。因为我们现在数字常用十进制，逢十进位，这样的数字呈现方式更有利于孩子理解；有些蛇形棋可能是8绕8的格子，到9的时候就换一行，用来学习数学的时候效果就没那么好。


    在跟孩子玩的过程中，参考科学家们使用的实验方法，注意下面这几点。


    +   - 第一，鼓励孩子自己大声数出来。孩子一边移动纸片一边数，就会更加注意到这些数字之间的顺序关系，这有利于孩子发展数字直觉。如果孩子数错了，也不用刻意去说他错了；你自己指着数格子上的数字，重新数一遍正确的就行。

    - 第二，要从当前位置继续数，不要只数骰子上的数字。前面我们说过，在这个过程中，孩子会特别注意到格子里的数字符号，可以对数字符号、数字读音、数值以及数值之间的关系进行编码，这样学习效果好。

    - 第三，可以有意引导孩子注意到他的纸片与你的纸片之间的位置关系，引导孩子注意到他的纸片离起点或终点有多远，这样能帮助孩子在脑海中形成用线表示数值的概念，帮助他们学习数字之间的关系。例如，你可以告诉孩子：“纸片离终点越近，方格里的数字越大。”“我的纸片跟你的纸片之间的小格子越多，我们俩现在的数字差距越大。”


    你可能会好奇，这么一个数字棋盘游戏，为什么是有效的？


    我以前提过，大脑进行数学运算的脑区和视觉空间认知 的脑区是有很大的重叠的。因此，在孩子早期数学教育中，有意识地把数学和空间信息结合，是利用了大脑运作的特点。而且，跟孩子玩数字棋盘游戏，好处远远不止于数学方面。


    前不久，普渡大学的年轻学者发现，在家经常玩数学的孩子，词汇量也更大，可能是因为爸爸妈妈跟孩子做数学活动的过程 中，会用到更丰富的词语。玩棋盘游戏的其他好处，估计我不说你都知道，比如，通过玩游戏，孩子学会理解和遵守规则，学会轮流和耐心等待，学习总结经验、调整策略，学习正确地面对输赢等。


    好了，还等什么呢？今天就玩玩数字棋盘游戏吧！


    —— 第52期思考题 ——


    Dr. 魏


