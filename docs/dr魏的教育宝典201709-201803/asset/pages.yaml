  md: '# 150 | 给孩子高质量的有效陪伴


    Dr. 谢


    怎么陪孩子玩才是高质量的陪伴？


    春节放假，我们陪孩子的时间变多了，不过我发现很多人对如何陪玩不够重视，或者说不知道怎么陪玩。我看到过一家三口都低头族，相顾无言，大人玩手机，忙着回复年信打游戏，孩子玩平板电脑，头都不抬；也听说一些家庭平时不陪孩子，一到假日就把孩子往各大儿童娱乐场所送。


    他们看上去好像也获得了实打实、整块的玩乐时间，当然，大人也乐得轻松一下。但是，这些不一定是高质量的陪伴。有很多家长问我，到底该怎么陪孩子玩才合适？今天应要求，讲讲如何高质量地陪孩子玩。


    # 1. 不是陪孩子的时间越多，就一定越好


    有的人认为，我能24小时跟孩子泡在一起，这就够了。其实，不是陪孩子的时间越多，就一定越好。美国的研究发现，从30年前开始，父母每周陪伴孩子的时间，是一直在增加的。比如，1985年，妈妈平均每周陪孩子的时间是8.5小时，爸爸是3小时。而到了2010年，妈妈陪的时间提高到了13.7小时，是原来的1.6倍；爸爸则是7.2小时，是原来的2.4倍。


    虽然这是美国的数据，但是对我们也有借鉴作用。其中有一点很重要，这说明陪孩子的时间增多，不代表对孩子的未来就越好。整个社会陪孩子的时间都大幅增加了，但是结果并不像很多人想的那样，陪伴时间越多越好。


    # 2. 不是让孩子专注玩游戏就够了


    春节时你可能注意到了：平时我们不让孩子多玩多矶的手机、平板电脑、电视，好像孩子能随手玩上了。


    亲人团聚，家里人多，每个人的智能手机都能玩游戏，平板电脑也无处不在，电视也总是开着，孩子总能看入迷。大人忙着拜年、发微信、打电话，也懒得管孩子的细节，结果他们就拿着手机平板玩个不停。


    # 3. 高质量陪伴是什么？


    说到这里，我给你解释一下，什么是高质量的陪伴？高质量的陪伴就是，保证有一段陪孩子的特殊时间，这段时间是你跟孩子一对一相处的时光。这时候你不要太有目的性地想要教育、训练孩子，而是给孩子有温度的爱，敏感地关注他的需求，表达对他的积极想法和感受。


    # 4. 过年亲子小游戏


    我给你推荐了几个适合的小游戏，让你在春节期间陪孩子有点素材。当然，这些游戏不一定适合所有年龄的孩子，还需要你举一反三。


    +   （1）读绘本唱童谣


    > 《小孩子小你别碳》

    小小小孩你别倦，过了腊八就是年。

    腊八粥喝几顿，� Academy 啦 啦 二十三。

    二十三糖瓜粘，二十四扫房子，

    二十五做豆腐，二十六割猪肉，

    二十七杀年鸡，二十八把面发，

    二十九蒸馒头，三十晚上熬一宿，除夕的孩子年年有。'
