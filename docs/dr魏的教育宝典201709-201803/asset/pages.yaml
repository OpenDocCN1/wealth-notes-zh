    现在学生的课业压力重，除了学习，休息时间也给了电子产品。打打球、跑跑步、捉迷藏这样的放松方式，感觉在我们小时候那年用得比较多，孩子出去玩的少了，宅在家里面多了，这就造成了一个严重又普遍的问题：近视。


    前阵子，我在专栏里收到一个妈妈的提问，她说：“我就是高度近视，一摘眼镜什么都看不见，生活非常不方便。所以，我特别重视保护孩子的视力，尽量不让他玩iPad游戏，看动画片每天只看一集。可我发现小区里有几个小学生都戴上了眼镜，是不是上学之后功课多，一定会影响孩子的视力？我该怎么办？”


    这位妈妈的担心你是不是也同样有呢？中国的近视率高得惊人，而且呈爆炸趋势。60多年前，中国的近视率还是百分之十几，而如今青少年的近视率已经突破90%。


    实际上，整个东亚地区的近视率都在飙升，比如新加坡，日本，韩国，当然还有中国，这些国家的孩子学习任务重，人们普遍认为近视率的增长与学习时间长有关。


    但是，影响孩子是否近视的关键因素其实是户外活动时间。


    # 户外活动时间，为什么会影响孩子的视力？


    我跟你分享一个有趣的研究：悉尼大学的凯瑟琳罗斯博士带领团队做了一项有意思的调查，他比较两组孩子的近视率。这两组孩子六七岁左右，都是有中国血统的孩子，不同的是，一组生活在悉尼，另一组生活在新加坡。


    他们发现，生活在悉尼的孩子花在课桌前的时间更多，比如读书、学习，但奇怪的是他们的近视率只有3%；而生活在新加坡的这群孩子近视率却有29%。


    他们生活的主要区别在哪里呢？重要就是在户外活动时间上。悉尼学生每周户外活动13小时以上，而在新加坡只有3小时。


    # 家门口就能玩的亲子户外活动


    孩子的眼睛格外需要保护，他们的视力在快速发育，眼球生长变化快。刚出生几周的孩子，能看到的距离非常近，也就是20至40厘米，等于是妈妈给他喂奶时，两个人眼睛之间的距离。到了三四岁，孩子正常的视力就跟大人一样了。


    +   1. 球类运动


    在我们家，球是‘使用率’最高的玩具。我记得大女儿小时候有一颗粉色的软球，大概比喝水的杯子大一点点。她刚会走路的时候，我们出门玩就带上这只球。


    最简单的游戏就是我把球扔远，她摇摇晃晃地走过去捡，捡回来给我，让我再扔，这样都能玩好长时间。大一些的孩子，你可以跟他互相抛球，你扔他接，他扔你接。接下来还可以拍球、运球，这些都能锻炼宝宝的身体协调性。如果有足够大的空间，踢球也不错。


    +   2. 老鹰捉小鸡


    我和女儿两个人玩的时候，常常简化成‘你追我跑’，比如女儿先跑，我去追，抓住之后换过来，改成我跑她追。这个游戏对空间要求不高，你跑的时候可以控制速度和方向，也锻炼孩子的灵活应变能力。有时候玩着玩着，又有几个孩子加入，我们就变成‘正版’老鹰抓小鸡的游戏了。


    +   3. 捡树叶或捡果实


    现在树叶已经开始变黄，很快要大批落下来了，有些果实也会掉在地上。我带女儿在学校里闲逛，看到自己喜欢的叶子和果实就捡起来，还有小树枝也捡起来。


    我们比赛，夸奖自己的‘成果’，想想捡回去可以做什么。比如我说，‘这片树叶火红火红的，是心形的，像樱桃一样。’她可能说，‘我捡了一个小树枝，拿回家，给小熊当拐杖’，随间玩也可以锻炼孩子的语言能力和想象力。'
