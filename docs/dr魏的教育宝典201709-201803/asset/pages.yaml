  md: '# 138 | 报兴趣班的正确姿势


    Dr. 魏


    该不该让孩子上兴趣班？


    每个到孩子放假的这段时间，家家间我最多的话题就是“兴趣班”。前段时间，有朋友跟我讲了一个段子，说兴趣班就是一个悲伤的故事，因为孩子对兴趣班，根本提不起任何兴趣。


    玩笑归玩笑，到底该不该给孩子报兴趣班？孩子报了兴趣班，却提不起兴致，该怎么办？你肯定有过类似的困惑，今天我就重说清楚“兴趣班”这件事。


    # 1. 该不该给孩子报兴趣班？


    该不该给孩子报兴趣班？兴趣班只是辅助学习的工具，也就是说，重点不是工具，而是使用工具的人。


    如果你有足够时间，知道怎么陪孩子玩，那么你就是最好的兴趣班。


    如果时间少，平时和孩子玩法不多，你可以选择兴趣班。不过要注意，六岁以下选择兴趣班要以激发兴趣为主题，而不是那种强化训练班。


