    # | 金牌家长-快乐小球球


    分享话题：如何奖惩更有效？


    本周Dr.魏谈到体罚，明确了体罚是没有好处的，从另一个角度说，之所以用到体罚，应该奖惩措施没有完善，奖惩的核心离不开规则和制度。


    我家孩子2岁半了，已经进入秩序敏感期阶段。我也在着重培养他的规则意识。什么该做，什么不该做，接下来我详细分享下。


    （1）奖惩要跟着约定的规则来进行


    不要打孩子，或者第一次犯错就惩罚，惩罚要建立在规则的基础上，比如把行为的对错明确化。这种规则犹如法律、法规一般要提前说清楚，以免在执行中，孩子根本不知道错在哪，或者为什么得到奖励。


    （2）奖惩制度要明确化


    我家使用了《家庭奖励表》，可以根锵事项贴星星，网上很容易买到。孩子做的好，就需要奖励他，并反复重申规则。比如，孩子打人等“暴走”行为都是他自己情绪脑发作时的行为，要告诉孩子，如果他能把愤怒说出来，就可以奖励一颗星星，得到5颗星星可以交换一个愿望，并让他把愿望写在愿望清单里，贴在《家庭奖励表》中。


    （3）规则跟孩子一起制定，一起遵守


    制定规则时，需要孩子一起参与，效果会最好，当然，在约束上，最好是全家一起执行，比如，爸爸不在陪孩子时看手机，也能作为一条规则纳入其中，让孩子做监管员，他们会非常好的执行并理解这条规则，而不会觉得自己是被管理方。一旦孩子愿意遵守一起制定的规则，操作起来就会容易很多。


    （4）执行是关键


    关于奖励，使用积分制，积分兑换奖品。这种游戏环节操作起来并不麻烦，一张《家庭奖励表》就可以兑现。


    而惩罚，往往会相对枯燥，可能想不出如何惩罚更好，让被惩罚者自己说出惩罚的项目，执行起来会相对容易。


    我家在指定规则的时候，我问过孩子“下次你再乱扔玩具，你来 Constitutional，爸爸怎么惩罚你”，孩子说“不给看动画片”。我觉得这样来约定就很不错。我们家每天只有15分钟的动画片时间，孩子愿意主动放弃。在后来的执行过程中，我骂过他两次，孩子都很有配合的交了“罚单”。


    以上是我把“体罚”引申为“如何奖罚”的看法，望探讨。


