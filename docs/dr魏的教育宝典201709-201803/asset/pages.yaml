    # | 金牌家长-珍珠妈妈


    分享主题：如何让孩子爱上运动


    我家珍珠向来以活泼好动闻名四野。在她一两岁的时候，特别喜欢肢体运动，只要带到户外，我们基本就只有跟在后面追的狼狈状态。


    回到家，就爬高爬低一刻不Flush，家里的窗台、柜子、桌子、椅子都是她的道具（提醒家长：注意看护，安全第一）。现在她三岁四个月，大动作少了不少，开始对精细的手工活动感兴趣了。


    最近喜爱的是剪纸，经常沿<|start|>廊剪下画册上的图案，再贴上一块透明胶，粘到她的专属“背景墙”上。


    对于珍珠的运动能力，幼儿园的老师很认可，说她无论大动作和精细动作，发育的都很不错。


    叨叨魏在之前的文章中有说到：发展和神经科学证表明，当孩子运动能力发展的时候，负责认知、负责协调多种信息、决策和时间预判的脑区（包括小脑和基底核区域）也会一起发展，这两种能力在婴幼儿大脑发育早期同时发展，并紧密相关。


    培养孩子的运动能力，很大程度上就是在培养孩子聪明的大脑。孩子的动作可分为粗大动作、精细动作两种。对这两种运动的培养，最好同步进行。下面推荐几个培养孩子运动能力的方法，家长们可以和孩子一起操练起来哈。


    # （1）制定任务——在游戏中提升运动技能


    单纯的制定任务，比如要求孩子完成几次往返跑、做多少组跳跃，或者模仿小兔子跳跃，完成仰卧起坐等。这样定量训练的好处，就是直接运动到四肢，锻炼效果明显。


    但缺点是有时孩子不愿意配合，如果强制要求完成，孩子会有被控制的感觉，不利于良好亲子关系建立。


    这时，我们可以借助游戏，来达到训练目标。


    # （2）正确引导——帮助孩子跳出“舒适区”


    无论粗大动作还是精细动作的发育，都离不开家长的引导，当然，孩子自己摸索也是可行的，但容易让孩子长时间停留在“舒适区”，缺少向上蹦一蹦，触摸“挑战区”的推力。


    # （3）利用道具——让运动能力加速提升


    育儿可以是很省钱的，尤其在运动能力培养方面。


