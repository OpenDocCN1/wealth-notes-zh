  md: '# 097 | 手势的妙用


    Dr. 郗


    做手势，会分散注意力吗？


    一些幼儿老师，上课的时候，为了让孩子保持专注，要求孩子坐得笔直，全程把手背在后面。


    我觉得这其实挺可惜的，因为恰好相反，巧用双手，不管是对大人还是孩子，都对提高注意力有帮助。释放孩子双手，能提高他们的语言能力、记忆力和数学能力。


    # 手势源自基因，有助于大脑发展


    你可能会觉得，手势就是我们说话的时候，下意识做的小动作。实际上，爱打手势来自我们的基因遗传，就像人类天生喜欢音乐或跳舞一样自然。


    我用一个小故事，帮你理解手势的起源。


    假设在20万年前的某一天，那天在非洲大草原上的一个人类祖先看到了一只羚羊，他想告诉小伙伴这个喜讯，可是他不会语言，怎么沟通？于是他灵机一动，立刻用“手势”比划出一对羊角：“这里有羚羊！”再勾勾手：“快来啊！”对面的小伙伴秒懂了，沟通原来如此简单，利用手势也能进行。


    从此以后，老祖先频繁地用手势通风报信，沟通的需求多了，手势不够用了，口头语言慢慢发展出来。这目前是语言起源的一个重要假说理论。而且，你至今还能在一些原始部落里看到用手势交流的人。


    实际上，手势还跟大脑发展有关。手势越多越复杂，人脑的工作也越来越忙碌。你想，自从学会“羚羊”这个手势，不需要看到真的羚羊，老祖先一看到这个手势，立马就能联想
    Cilican “羚羊”。羚羊在草原上飞奔的姿态、捕猎羚羊时候的紧张刺激、羚羊那肥美的味道，这一信息，就涌入了他的大脑。


    交流多了，联想得更多了，大脑的脑细胞开始增加，细胞之间的联系也越来越密切，最终人脑的容量变大，大脑皮层也更发达。所以说，当我们学会打手势，我们也就开始从抽象符号中联想出相关信息，人类思维的一次跃迁就开始了。


    那么，如何让孩子利用手势沟通呢？


    # 1. 鼓励宝宝“用手说话”


    不要以为孩子还小，什么都不懂，一岁以下的娃，已经跟我们的祖先一样，有很多自己的想法了，只可惜说话不利于索，想法无法准确表达出来。比如，宝宝突然大哭，爸爸以为他饿了，赶紧急给他喂奶，其实他是想拉粑粑了。


    在这段有苦难言的懵懂时光里，宝宝怎样才能顺利跟大人沟通呢？答案是“用手说话”。我女儿半岁的时候，我教给了她一些简单手势，比如吃、喝、要什么不要什么。怎么教呢？就是大人做动作，让宝宝模仿。


    比如我教女儿“吃饭”的手语，就是将手指放在一起，好像抓住一口饭，然后把饭送到嘴边，边做边说：“吃……饭……”到了八九个月，女儿有什么基本需求，都可以用手势表达出来了。而且她的语言能力也发展得比较快。


    # 2. 手势可以成为“沟通好助手”


    手势不仅能帮小宝宝学语言，还能做大孩子，或大人说话时的好助手。


    # 3. 手势能辅助我们回忆信息


    手势不仅能辅助语言，还能辅助我们回忆信息。人的认知资源是有限的，主要是受到工作记忆的限制。工作记忆有点像电脑里的RAM内存，虽然能帮我们短时间内保存信息，但它是有限的。如果我们同时要处理多个任务，大脑内存不够了，大脑运行就会变卡。相反，大脑内存越大，性能越强。


    # 4. 手势能帮助孩子学习数学概念


    除了能帮助语言、记忆，手势还能帮助孩子学习数学概念。跟纯听数学课比起来，手势的一个特点是能“化静为动”。大脑会优先处理动态的信息，孩子对形象记忆得更牢。'
