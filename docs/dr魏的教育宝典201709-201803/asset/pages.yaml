  md: '等孩子再长大一些，有了一定的数学基础之后，就可以帮他慢慢脱离实物，用抽象概念代表数字了。比如，利用数轴。在数轴上画一条线段，画到10格，代表小红的铅笔；再画一条线段，画到3格，代表小明的铅笔，这样，小红比小明多几根铅笔，也比较清晰。就算孩子不会加减法，在数轴上数数，也可以得出答案。


    14.最后我要强调一下，数学启蒙做与不做，做得好与不好，效果差别很大。请你从现在开始，给孩子一个有数学意识的环境吧，在日常生活中潜移默化，用游戏和对话的方式让孩子熟悉数字，开始他的数学启蒙。


    # 数学小游戏


    +   1.唱数游戏


    唱数就是口头数数，它可以考察孩子对口语数字的敏感度。你还可以请孩子来判断别人数得对不对，比如跟孩子玩这样的游戏，你假装是学生，孩子是幼儿园老师。你对孩子说："老师，我数数给你听，你看我数得对不对？"然后你正确地数、故意漏数、弄错顺序，看看孩子能不能发现。


    当孩子顺数和识别其他人的数数都熟练之后，你可以引入更多的"高阶数数游戏"。比如，倒着数，这也很考验孩子的抑制控制能力（控制思维和冲动，以抵制诱惑、习惯和分心）；跳着数，还可以玩"找邻居"游戏，问问孩子，3的邻居是谁？谁住在它前边，谁住在它后边？


    +   2.点数游戏


    我和女儿比较喜欢的点数游戏是走楼梯和踩砖块，告诉孩子"数到几就是几"，再加上身体的动能可以帮助孩子直接感知数量的变化。以跳砖块比赛为例，我和女儿站在起点，看谁先跳过20块砖。每跳一次就说出自己一共跳了多少块砖，如果踩着线就退回去一块。比如孩子第一次跳3块，说3块；然后又跳到2块，就说5块。这个过程已经包含了加法的运算，只是孩子还不知道这叫加法。


    +   3.长条板数字游戏


    准备一块长纸板、一个骰子和两个带动物图案的圆纸片。纸板上从左到右画10个方格，每个方格里写着一个数字，从1到10。在1的左边，是"开始"的位置。骰子的三个面上是1，另外三个面上是2。


    孩子把圆纸片放在"开始"的地方，然后跟大人轮流扔骰子，扔到几就往前走几步，同时大声念出方格里的数字。比如说，如果孩子原来在7，又扔到2，那么他要从7往下接着数两个数"8、9"。谁先走到10，谁就赢了。


    实验表明，两周内玩4次，每次15分钟，加起来才一个小时，就产生了明显的效果，孩子们在数轴估测、数数、数字识别、数量对比四个方面的能力都有提升，这种提升甚至在两个月之后还能得到。


    奥秘在于，长条形这样的线性游戏材料，刚好跟这种数值的表征方式相符合。其次，在游戏的过程中，孩子自己数数、移动纸片，他的视觉、听觉、动觉和时空线索都与数值大小产生关系，形成一个综合的线性结构。


    # 家长智囊团献策


    Dr.魏


    关于数学启蒙，不少聪爸妈分享了自己的妙招，可谓是咱们的家长智囊团！


    我挑选了其中的优劣方法，分享给大家。


    在实际生活中教孩子合理使用金钱


    > @郑志荣：万事万物都能加入数的学习。有一个小发现，大多数孩子天生对金钱敏感，以前都是在家里模拟超市购物，后来就实celle演了，4岁以后我们一同出行的支付权力就交给她了。给予孩子足够的信任，他自己意识到信任越大、责任越大，给100元也不会乱消费，只买自己承诺需要的物品，如实交还找零。所以不要怕孩子接触金钱，要教会他在实际生活中如何合理地使用金钱。


    关于睡前数学问题，除了可以玩手指谐数数，还可以教青蛙，一只青蛙一张嘴，两只眼睛四条腿，两只青蛙……多少条腿？三岁的孩子居然一口气数到了4只，并且全部答对。他只是通过空间想象，对着空气数出来的，却不知不觉运用到了乘法。


    用实物培养对概率的感性认识


    > @麻麻爸爸：有两个学习概率的小游戏。我拿起一把围棋，让孩子也抓起一把围棋，让他感受，每次抓起白子黑子的数量都是不一样的。又拿来十枚硬币，他跟我各扔10次，测算一下每一面出现的次数，结果趋同！经过这两个游戏，6岁的孩子对概率这个词从原本一无所知，到有了一个感性的了解。昨天带他出门之前，他说，爸爸，今天下雨的概率有70%，我们还是带把伞吧。数学离不开生活，数学即是生活。


