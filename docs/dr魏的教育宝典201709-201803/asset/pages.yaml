  md: '# 111 | 把绘本阅读当舞台剧，爱“演”你就赢了


    Dr. 魏


    怎么给孩子读绘本？


    最近听说一位读者说，有一种绘本阅读机器人，只要把绘本举到它面前，它就能把绘本读给你听。确实，大家家里应该都买了不少绘本，可怎么读，却成了一个大问题。有时候孩子拿一本书看一眼就要换，有时候一遍又一遍地要求你重复读，如果有机器人来帮忙，自然是极好的。


    不过，我是不太愿意把读绘本的任务交给机器人，除了考虑到读书是跟女儿保持亲密互动的好时机，而且机器人肯定读得不如我好。关于怎么跟孩子一起读绘本，我还是很有心得的。


    绘本阅读的好处多多，从语言到情绪，从科学到艺术，从社交能力到逻辑思维，泡在绘本里长大的孩子收获肯定不小。今天，我主要跟你聊聊，怎样通过阅读绘本，帮助孩子学习口头语言。


    # 孩子的语言发展跟语言输入有关系，既拼数量，更拼质量


    虽然孩子刚出生的时候，都不会说话，但到了上学时，孩子与孩子之间的语言的差异就已经很大了，他们的词汇量大小不同，句子结构、语言逻辑，都千差万别。


    科学家发现，孩子入学时的词汇量，能在一定程度上预测将来的学业成绩。那么，是什么让孩子的语言发展差异这么大？其实，这跟孩子小时候得到的语言输入有关。


    美国研究者记录了42个家庭中，孩子7个月到3岁期间的口语词汇。等到他们9岁时，再测试他们的阅读和其他学习能力。研究者发现，有些妈妈爱跟孩子说话，每天能说三万个词，这些孩子长大后阅读能力比较高，还有些妈妈跟孩子说话不多，每天差不多说七八千个词，这些孩子上小学后阅读能力稍差一些。


    不过，语言输入，可不是仅仅要拼数量。要是你每天跟孩子说一万遍“走开，一边玩去”，也不会对孩子的语言发展有什么积极作用。


    不能只拼语言数量，还要注意给孩子输入语言的质量。语言质量可以从很多方面考虑，比如词汇的多样性，句子结构的复杂性，语言包含的情绪等等。


    有一个实验特别有意思，研究者分析了爸爸妈妈跟孩子说话时的“参考透明度”(referential transparency)，发现爸爸妈妈的单词参考透明度越高，孩子3年以后的词汇量更有可能越大。参考透明度是什么？主要是指遇到新词时，能迅速获得与词义相关的可靠信息。


    举个例子，如果你当着孩子的面夸一个个人说他有很多知识，你发现自己孩子茫然地看着，不明白知识是什么意思。这时候，你进一步地解释：“知识啊，就是对很多东西的认识，比如，你今天去动物园了，知道了熊猫不是猫，其实是熊，这是知识。昨天我教你要每年有365天，每4年有一年是366天。这个也是知识。”这时候，孩子就对知识这个稍微抽象的词有了理解。


    # 1. 你是演员，孩子当导演


    首先，通过绘本，我们可以帮助孩子多练习识别语音，比如区分音节、听出来押韵的词。所以我会给孩子读一些有节奏感、有韵律的书，比如童谣。


    # 2. 把话筒交给孩子


    把话筒交给孩子，就是鼓励孩子多说。亲子阅读应该是一个互动过程，不能一直你念、孩子听。互动阅读能让孩子更多地练习语言，而且孩子可以根据他的兴趣和能力来决定读哪儿、怎么读，这样能更快地促进孩子的语言能力发展。'
