    #  | 金牌家长-大米的陪练


    # 分享话题：如何帮小宝宝培养阅读能力？


    我家宝宝一岁八个月，目前认识一百多个字，会背十几首唐诗的每句最后三个或五个字。会唱几首儿歌。


    # （1）家里的环境安排要适宜阅读


    首先，宝宝在家，我们从来没有打开过电视，其次，我会在客厅摆放一个大书柜，最下边两层放宝宝的书籍，方便他自取。一层放宝宝喜欢看的绘本，一层放过期的杂志，专门让宝宝抠和撕。


    # （2）对玩具的掌控感


    我家是男宝，玩具有球类、积木、公仔、绘本，飞机和汽车等等。宝宝会自己选择玩什么玩具，每个玩具都有爸爸陪他玩，教他玩。每个积木都配有一个汉字和一幅画，宝宝拿一个，爷爷就教一个。绘本也是宝宝拿出来哪个，爷爷就给他读哪个。


    # （3）宝宝边玩边学


    我会和宝宝边玩边学，比如积木上是“医”字，旁边还画了一个穿白大褂的医生，我就给宝宝讲一个他身边的故事，如“我们前几天去医院的时候，就是医生阿姨给大米打针的”，同时还会用手指假装针头，给大米演示打针。


    如果他不想玩积木，就不要强求。陪他玩他想玩的玩具。唐诗也是这样，每首唐诗都是一张卡片，爸爸妈妈晚上会给大米读唐诗，每首诗旁都有画，宝宝拿起哪首，爸爸妈妈就给他读那首，晚上睡觉前我还会背唐诗或者唱歌来哄睡。


    有时我会把每句诗的最后一个字留给大米背，他能背后三个字。


    # （4）有人陪伴和教育


    “陪伴”这一项任务，白天是由爷爷奶奶负责，爷爷每天和宝宝一起玩，奶奶负责后勤保障。晚上又多了爸爸妈妈的陪伴。


    我有个问题请教魏老师：宝宝一个人的独处时间较少，会不会有什么问题？目前看起来宝宝比较胆小，谨慎。


    ![](img/bce617503caab4aa8727e0f05b5e6106_25_2.png)


    Dr. 魏


    给用心陪伴的家长点赞，特别是爷爷奶奶。


    宝宝玩的过程中，自由探索也很重要。要是爷爷在宝宝玩时，先观察一下，鼓励宝宝自己探索，就更好了。一岁多的宝宝重点是培养阅读兴趣，故事更重要，识字等能力可以在宝宝大些再强调。建议增加多一些好绘本，阅读过程中多对话。


