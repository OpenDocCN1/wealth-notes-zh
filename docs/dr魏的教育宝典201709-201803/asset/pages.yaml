  md: '# 098 | 读者问答：活用类比法，打消孩子的固执情绪


    下周，我帮你解决两个问题：改掉孩子的“拖延症”、远离谎言


    很多家长遇到了孩子吃饭刷牙磨蹭嘀咕的问题，其实不是他们故意“拖延”，而是他们的发展特点决定的。下周我来帮你分析磨蹭背后的原因，给你应对这个难题的实用方法。


    除此之外，孩子撒谎也是普遍存在的问题。但是，撒谎这件事还真不能随invent上升到道德高度，孩子会撒谎，也可以说是他们认知能力的一个表现。不同阶段的孩子，应对他们撒谎的方式也有不同，孩子为什么会撒谎，以及具体应对方法是什么？请下周准时到专栏学习。


    # ——► 本周问答时间 ◄——


    +   1. 孩子在幼儿园只和闺蜜玩，怎么办？

    2. 看到别人不舒服，不会关心，是没有同理心吗？

    3. 为了让别人开心，而放弃自己的想法，会发展出迎合型人格？

    4. 孩子执着于全勤小印章，不愿请假参加亲人婚礼怎么办？

    5. 女儿总被夸漂亮，是好是坏？


    # 1.孩子在幼儿园只和闺蜜玩，怎么办？


    我家女儿三岁半了，一岁多的时候认识了一个小女儿，特别喜欢和她玩儿，在幼儿园也总和她坐在一起，室外活动也在一起，而且还不让别的小朋友和这个女生玩儿，说这是她的朋友。


    更麻烦的是，她刚是插班生，上幼儿园一个半月了，还是不能融入集体，每次活动都会站到队伍最后，或跑到一边。这个问题的根源出在哪儿了呢？


    Dr. 鱼


    我来同理一下孩子的处境，你就不难理解这两个小闺蜜的行为。你想，如果你准备上大学，要去一个离家很远的陌生城市，是不是对校园生活充满了惶惑和担忧？


    担忧的是，独自背井离乡，发生意外怎么办？这时候，你发现，你的闺蜜也要去这个大学，两人结伴同行，是不是就安心很多了呢？一起吃饭、逛图书馆、分享校园生活中的喜怒哀乐，如果你比较慢热，闺蜜的陪伴更能给你带来安全感，适应新生活。


    等你们各自熟悉了陌生的校园、老师和同学，就会自动发展出自己的圈子。虽然你还是约见面，但也许会没有以前那么频繁。


    这样一想，你女儿刚上幼儿园，不也是类似的情形嘛，时间会解决这个问题的。


    # 2.看到别人不舒服，不会关心，是没有同理心吗？


    我家女儿四岁了，家里只要有人说自己不舒服，比如说肚子痛、头晕、咳嗽等等，她就会哭闹着说自己也有这个毛病，一会儿又说没有，我都不知该如何回答她，这是不是代表没有同理心？


    Dr. 鱼


    这可能是孩子情绪调节能力还有待发展的表现。你家女儿能够觉察到别人的情绪，但是无法很好地处理这些情绪，这让她感到难受。


    举个例子，乘坐飞机时，空乘告诉我们最重要的安全法则是，一旦发生意外，给别人戴口罩前，先确保自己戴好口罩。


    想让女儿的同理心转换为关心，你需要帮助她提高情绪力。当女儿哭闹时，你不必太担心，冷静地抱抱她，安抚她，比如你可以说：你看到爷爷肚子痛，你也难受，是不是？


    然后静静地陪着她，她会平复下来。千万不要执着于问孩子，“肚子究竟痛还是不痛”，这个问题会让她更加焦虑。


    另外，我之前跟你分享过当孩子间情绪时，记得使用情绪三步走：描述情绪、思考情绪、反思情绪，如果你感兴趣的话，可以在本期文章末尾，点击推荐阅读，再次回顾，查漏补缺。


    # 3.为了让别人开心，放弃自己的想法，会发展出迎合型人格？


    今天一早，我家孩子拿着一根珠子跳绳，想给他的好朋友M看。孩子告诉M，珠子跳绳最好跳了。M争论说弹力跳绳更好。争执后，M就生气了。孩子告诉她，“M总是说说说着就生气”。还说，“我知道怎么说他就会开心了，我一告诉他弹力跳绳好跳，他就会和我合好”。


    我很迷茫，不知道这是不是同理心的表现，担心孩子发展出迎合型人格，该如何正确引导呢？


    Dr. 鱼


    这当然是有同理心的表现！你看，孩子能够准确地识别小伙伴生气了，还知道怎么说会让他变得开心的办法，认识情绪、表达情绪、缓解冲突，干得漂亮！


    你担心孩子这样做会变得只会迎合别人，不敢坚持己见。这就像是看到孩子摔跤一次，就担心他以后走不好路一样，考虑一回就紧张他以后学业糟糕，这有些杞人忧天了。


    孩子是在不断磨合中学习社交技能的，你看，他这次让小朋友了，那么小朋友可能会在其他事情上让他；或者，他们发现，珠子跳绳和弹力跳绳各有优势；再或者，小朋友冷静下来后，试了珠子跳绳，发现它真的更好跳，嘴上虽然说弹力跳绳好，一回家就让妈妈给他也买一条珠子跳绳。


    如果孩子发现每次都得迁就对方才行，那么他会想办法来让自己的感受舒服。如果做不到，你再提供建议也不迟。


    # 4.孩子执着于全勤小印章，不愿请假参加亲人婚礼怎么办？


    说到同理心，最近我正好遇到一个难题。孩子目前正在上学前期，处于习惯养成期，学校有激励制度，不请假，不迟到可以获得一枚全勤小印章，孩子非常重视。


    下个月孩子的姑姑结婚，想让小朋友给她帮忙，这样的話，孩子当天必须请假，但孩子不愿意。


    我只能给孩子做工作，就去一下下，然后马上回去上课。另外还告诉她，家人朋友间要互相帮助。但，孩子还是不同意，甚至哭起来，就是不去。


    我很疑惑，这是不是说明孩子的同理心比较弱？我应该如何通过这件事教育她？可反过来一想，我们大人在这件事上就有同理心吗？不也是想让孩子牺牲自己成全他人？真的是好矛盾。


    Dr. 鱼


    这真是一个难题。对我们大人来说，那只是一个小印章，可对孩子来讲，那可能是一个“奥斯卡金牌”。同样，对他来说，去姑姑婚礼帮忙，也许只是去满足一个习俗，但这对你和家人来说，是家的人生大事。怎么让孩子明白你们的考虑呢？


    你不如试试“类比”这个工具。比如，你告诉孩子，你上班，也想天天不迟到，不请假。但是如果这时候有更加重要的事情要做，比如孩子生病了要去医院，或者幼儿园有重大的汇演需要参与，那么你会选择请假，送孩子去医院，去参加孩子的文艺汇演。


    虽然你失去了一枚全勤的印章，但是你得到了一枚孩子的健康印章，一枚和孩子美好回忆的印章。而且，学校的小印章以后还可以通过努力再获得，但是健康和汇演印章，就很难以得到。


    姑姑的结婚印章一辈子可能就这一转，那么，咱 所以不是要去帮帮她呢？你还可以让姑姑给她DIY一个个性化的印章，这样孩子会更容易接受些。


    我们说同理心是将心比心，不仅仅是从孩子的角度看待问题，还需要使用他们能够理解的语言，帮助他们认识问题。像我刚才提到的，你可以举一个类似的例子，分析利弊，这比抽象地要说“互相帮助，理解他人”，更能说服孩子。


