    # 《为什么学生不喜欢上学》


    ![](img/bce617503caab4aa8727e0f05b5e6106_193_0.png)


    《为什么学生不喜欢上学》是美国弗吉尼亚大学心理学教授，丹尼尔·威斯顿姆的教育心理学著作。他长期研究学习时的大脑活动，并且开设专栏，把认知科学的研究成果介绍给中小学老师，给老师一些教学建议。后来，他以这些专栏文章为基础出版了一本书，就是《为什么学生不喜欢上学》。

    书里介绍了9个认知科学原理，和相对应的教育孩子学习.Bundle。

    这本书从大脑底层的认知规律出发来理解孩子，告诉你孩子不喜欢上学是正常的，但是同时也给出了让孩子喜欢学习的方法，比如要尽早丰富孩子的事实性知识，在不同时间里重复练习基本技能等等。如果你听完咱们专栏，开始对脑认知心理学、儿童教育感兴趣，建议你将这本书纳入到你的入门装备中来。


    # 《宝宝也是哲学家》


    ![](img/bce617503caab4aa8727e0f05b5e6106_193_1.png)


    《宝宝也是哲学家》是美国伯克利大学研究儿童认知和人工智能的心理学教授，艾莉森·高普尼克的著作。她也是一位推崇要站在儿童的角度来理解孩子的科学家。

    她在这本书里指出，童年是人生非常重要的一个阶段，但我们常常忽略童年的重要性。如果你愿意蹲下来理解孩子，你会发现他们的学习能力、思考能力比你想象的强得多。

