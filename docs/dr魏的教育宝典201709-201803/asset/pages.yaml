  md: '# 131 | 读者问答：孩子做作业效率低怎么办？


    Dr. 魏


    下周我将与你一起讨论两个话题，一个是安全感，另一个是集体运动。


    你肯定知道，孩子的安全感很重要。但现                                                                                                                                                                                                                                                      在流传的一些关于安全感的说法，容易误导人。下周我就本清源，讲讲对于孩子的安全感，你可能有哪些误会；再聊聊你可以做些什么，带给孩子真正的安全感。


    另一个话题是集体运动：小朋友们在一起参加集体运动，是培养他们社交能力和情绪能力的最好场合。你可以做些什么，来帮孩子在运动中提高社交能力？下周告诉你。


    # —— 本周问答时间 ——


    +   1. 孩子想买玩具，用转移注意力这招好吗？

    2. 孩子对玩具5分钟热度，正常吗？

    3. 孩子特别抵触肢体接触怎么破？

    4. 孩子做作业效率低怎么办？

    5. 如何区分孩子是认知灵活性不够，还是在建立秩序感？


    # 1. 孩子想买玩具，用转移注意力这招好吗？


    随着孩子慢慢长大，面对新鲜好奇的东西，“想要”的心态越来越重，相信很多家长都深有同感。去逛商场的时候，两岁的女儿看见可爱的布娃娃，就爱不释手，想要带回家。


    因为家里已经有太多布娃娃，我们不想再买，为避免她哭闹，通常先让她在商场抱着玩一段时间，然后趁她不注意，偷偷放回去。请问这样做好吗？


    Dr. 魏


    两岁前的孩子，注意力比较短，转移注意力是个不错的方法。而且让她在商场抱着玩一会儿，满足她的好奇心，这种做法值得称赞。


    两岁后，孩子的注意力越来越好，想转移会越来越难。如果这个方法不再起效，那么就需要其他法子了。比如出门前和孩子做购物清单，清楚去商场买什么；如果可以给孩子买，那么约定好买的件数，以及价格，答应了才可以带她去。这样做也可以培养孩子的契约精神。


    # 2. 孩子对玩具5分钟热度，正常吗？


    家里的游戏房摆着一些玩具和绘本，还有一面涂鸦墙。孩子在里面玩了一会儿积木，就说要玩轨道车，玩轨道车五六分钟又要玩积木，过一会儿又改玩滑梯，没过几分钟又说要画画。这样情况正常吗？是不是因为我们在房间里准备的玩具太多了呢？怎样培养她的专注力呢？


    Dr. 魏


    这种情况是正常的。心理学家高普尼克做了一个比喻：大人的注意力就像聚光灯，而孩子的注意力则像灯笼。所以大人能比较 好地把注意力专注在一点上，而孩子的注意力则比较分散，看绘本会关注小细节，走路会被花花草草吸引住。


    如果你参加过早教课，就会发现，虽然一节课是45分钟，但其中包含了七八个小活动，平均下来，一个活动也就5分钟左右。


    如果你想让孩子在一个游戏上玩得久一些，不妨这么做：


    +   1. 每次只给1~2个玩具，减少干扰。如果孩子玩完某个玩具，就先收起来。

    2. 增加游戏难度。如果每次的玩法都差不多，那么孩子很快会感到无聊。如果你帮她想一些新玩法，那么她会玩得更久些。比如给轨道车设置不同关卡，到了这个点要加油，到了那个点要收过路费，还可以融入假装游戏的元素。以
    后孩子的思路会越来越广，一个玩具能想出更多玩法。


    # 3. 孩子特别抵触肢体接触怎么破？


    儿子3岁了，从小性格内向、过分谨 kny，不喜欢社交，更愿意一个人玩。1岁多的时候，儿子总让我给他画手拉手的图，如果绘本里有人手拉手，他会一直问他们干嘛呢，然后总翻到那页看。从那时开始，我就发现他特别抵触肢体接触，特别是手，只允许爸爸妈妈牵手，这种情况一直持续到现在。


    通过不断讲故事引导，再加上半强迫，现在他可以和熟悉的成年 人拉手甚至拥抱，但坚决不靠近小朋友，坐近一点都不行，一起做游戏时生怕别人碰到他。


    Dr. 魏


    从你的描述来看，孩子的表现倾向于是先天的特质。美国心理学家杰罗姆·卡根（Jerome Kagan）发现孩子有高反应型和低反应型。


    高反应型的孩子容易对陌生的人和事物谨慎、害怕、回避、焦虑，低反应型孩子则相反。这些特质在他几个月大的时候就表现出来了。到他成 年时，这些孩子仍然会有这些倾向，但是大部分孩子不会走极端，也就是说，高反应型的孩子能够学会更好地调节自己的情绪，更愿意接纳人和新事物；而低反应型的孩子则会学会更谨慎一些。他们都会受到后天环境的影响，从而提高适应性。


    你的儿子可能也属于高反应型的孩子。相对于低反应型的孩子，他可能会更易害羞、谨 kny，但是你的耐心引导，会帮助他学会更好地调节自己的情绪，提高社交技能。


    # 4. 孩子做作业效率低怎么办？


    女儿每天都要花很多时间在写作业上，叫她写作业，她会写，但经常不能按时完成。 看她学得辛苦，效率却非常低，我该怎么帮助她呢？


    Dr. 魏


    你和女儿的沟通是比较顺畅的，你让女儿做作业，她都会响应，并且去做。这种 表现其实已经值得肯定了。我们自然都期望孩子能够把学习当成自己的事情，自发自觉，无需催促。但现状是，很多孩子一时半会是做不到的。学习是“反人性”的，要学习就得跳出舒适区，就得沉得下心。很多大人学习，不也是直叫苦累？


    但学习也有乐趣，比如解出了一道难题，完成了一个课题，甚至学以致用，解决了实际问题。简而言之，学习是痛苦并快乐着。


    回到你的烦恼上。你目前头疼的是女儿的学习效率。你像是一个项目经理，敦促着女儿的作业进程。


    其实，你还可以了解得更多一些，比如她慢是慢在那里？怎样改进更好？是学习环境中有干扰因素影响了效率，还是没有学懂课堂上的知识从而导致做作业慢呢？


    你教给她某一个知识点，她没有太懂，是你讲的方式太抽象了吗？有没有更好的讲解方式呢？不仅要关注结果，而且要回溯过程，多次复盘，这样是不是更有效率？


    # 5. 如何区分孩子是认知灵活性不够，还是在建立秩序感？'
