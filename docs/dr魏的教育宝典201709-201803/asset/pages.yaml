  md: '# 135 | 如何培养乐观的孩子？


    Dr. 魏


    元旦过去，很快将迎来春节，空气中充满欢乐的味道。幼儿园里也有期中联欢，老师带着孩子们编排节目，准备在联欢会上　一展身手。


    但并不是每一个孩子都愿意表演节目。

    比如何收到这样一个问题：

    我女儿三岁，今年刚上幼儿园。她比较内向、谨 慎、胆小……老师说她在幼儿园里不够自信，不愿意展现自己，期中汇报演也不肯上台，但她还是比较聪明的孩子。请问，父母应该怎么培养她自信、乐观的性格呢？


    # 乐观与悲观


    我先通过一个故事，来讲解乐观和悲观的孩子，分别有什么样的表现。


    # 1.帮孩子形成掌控感


    我问问你，如果你做一件事情成功了，再做一件事情还成功，第三件事情又成功，你是不是有一种天下任我行的掌控感，会不会更加乐观？但是，如果你做了一件事情，不成功，关键还不知道问题在哪里，会不会感觉完全无助，悲从中来？孩子也一样。一个孩子常能掌控自己的行为，获得成功，他会更乐观、主动；一个孩子常处于无助的状态，他更可能悲观和被动。


    # 2.准确积极地评价孩子


    孩子从你那里得到的反馈，会影响他看事情的角度。'
