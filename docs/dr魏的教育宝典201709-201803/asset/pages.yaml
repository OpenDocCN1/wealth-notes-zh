  md: '# 078｜如何保护孩子强大的学习能力？


    078｜如何保护孩子强大的学. ↓


    Dr. 穆

    机器人、大人、小孩，谁的推理更强？


    人工智能话题现在非常火爆，似乎AI正在掌管我们生活中的方方面面。开始今天的话题之前，我想请你幻想一个场景，有三个人都想当侦探，一个机器人、一个大人和一个3岁小孩。


    他们打算从三个嫌疑犯中找出谁是偷画的江洋大盗，嫌疑犯分别是：惧犯、混混和管理员。案发现场还发现了江洋大盗俩掉的一只手套。你觉得谁会找到真凶，成为下一个福尔摩斯？


    答案可能让你吃惊，3岁的孩子可能赢。


    # ｜成人的主观估算，经常存在误差


    当侦探做推理的时候，他首先要对嫌疑人偷画的可能性进行一个判断，也叫预估事情的先验概率，比如估计出惧犯有80%的几率偷画、混混有50%的几率偷画、管理员有10%的几率偷画。


    发现手套后，他们要估计嫌疑人犯案漏掉手套的可能性，这叫事情的条件概率，比如估计出作案的时候，惧犯漏掉手套的概率是10%、混混是40%、管理员是60%。


    这个问题听着之下考验的是推理能力，背后隐藏的却是概率问题。


    实际上，这道题确实要用到数学概率公式，侦探需要算出来，在这三个嫌疑人中，已知每个人偷画的先验概率，然后根据“在现场发现手套”这个条件，调整我们的先验概率，算出三个嫌疑犯最终可能犯案的概率，也叫后验概率。后验概率等于先验概率乘以调整因子，这个公式就是概率论中经典的贝叶斯定理。


    当然，我们大部分人不会像数学家一样套用公式算贝叶斯概率，但当我们做直觉推理的时候，我们在快速地对事情作出主观的贝叶斯概率估计。


    可惜，成人的主观估算经常有误差。比如很多人会被事情的先验概率所迷惑，他们根据自己的经验认定惧犯最可能偷盗，也就无法灵活地根据新证据调整自己的假设。其实就算惧犯最可能犯案（80%），也不太可能会犯遗漏手套这种低级错误（10%）。


    还有的人非常重视后验概率，他们发现只有管理员最可能漏掉手套（60%），便认定管理员是盗贼，但是他们忘记了管理员有很低的先验概率去做盗贼（10%）。听起来会不会觉得这些大人挺笨？其实我们在生活中，无时不刻存在着这种偏见、歧视。


    你想想你有没有看到女司机就觉得她是马路杀手呢？


    # ｜机器人无法对新处境进行判断


    你可能觉得，那还是机器人有优势，它可以最准确地算出概率来。


    我们都知道计算机有巨大的数据搜集能力，现在很火的人工智能深度学习，就是用计算机模拟人工的神经元网络，给计算机灌输海量数据，让它们通过数据学习，训练出识别能力，比如机器识图、下棋等。


    假设机器人的数据库里储存了全世界所有偷名画的罪犯的资料，它就可能从过去的事件中归纳导出最有可能犯罪的嫌疑人。


    但是，机器人很难结合不同的信息来源，对它们从未经历过的、未来的事情作预测。


    除了机器人，很多生物也能够做到根据事情在过去发生的频率，预测未来。但对新处境作出一次性判断只有人类能够做到。人们可以从一个例子中成功地概括出新概念，机器学习算法通常需要数十或数百个例子才能执行出类似的准确性。


    在机器人的数据库里，偷名画并且还留下一只手套的犯罪者的样本太少了，它无法从稀释成这样的数据库中学习。


    # ｜宝宝是天生的学习机器


    那3岁的孩子呢？


    你可能不会相信，但越来越多的研究表明，孩子非常擅长在抽象概念的引导下，用创造性的方式做判断。也就是，孩子可以摆脱机器人的限制，对事情做出假设。


    为什么会这样呢？这种能力可能是天生的。宝宝一出生就需要积极地探索周围的世界，并结合不同来源的信息来学习。同时，他会产生大量随机假设，来应对更加复杂的世界，如果预测失败，他还会像科学家一样测试、调整自己的假设，再次做出更合理的预测。这种运算量之大，远远超出了我们所知道的任何机器的容量。


    你可能会觉得，就算赢了机器人，孩子也赢不了成人。你可能觉得，成人的贝叶斯概率估算常出问题，更何况是思维不理性的孩子呢？


    确实，在过去，甚至连著名的儿童心理学家皮亚杰都认为，小孩子的思维是非理性的、不合逻辑的。可是，过去十年的理论和实证研究已经显示，孩子的学习和思维方式跟科学的学习和思维方式非常相似，他们也会用到科学的基本归纳；他们也会用到概率模型和贝叶斯推理的学习方法。


    我们提过一个研究儿童认知和人工智能的心理学家——高普尼克教授。她发现，孩子可以对抽象的因果关系做出惊人的准确推断，他们对新鲜事物的接受和学习能力甚至比成年人类还要高。


    成年人很容易因为旧的经验，对事情产生偏见，孩子却能很快接受新观点，把它们整合到原有的概念中去。我们暂时还不知道这些机制是怎么安装到孩子的小脑袋里的，高普尼克教授都说，孩子是“理性和非理性、系统和随机的结合体”。


    看起来，在这场推理大赛中，孩子最终会以惊人的预测能力和准确的判断力，战胜大tikTok和机器人。当然，这场比赛是编的，实际上可能并不可行。不过，孩子的这种惊人的学习能力是确实存在的。科学家已经开始从孩子的学习机制里面得到启发，设计出能使用小样本推理的人工智能，让机器可以像婴儿学习一样，从比较小的样本量中也能概括出新概念。


    人工智能与时俱进，它们是越来越强大了。孩子早期的经验是非常重要的，我们本来应该保护这些天生的学习者，但是一些结构化、系统化的教育方法，却可能误导了孩子。


    如何保护孩子强大的学习能力？我给你三条建议。


    +   1.保持开放，少给结构性建议


    什么叫做结构性建议？比如，拿到一个火车模型，直接告诉孩子该怎么玩，却不给孩子拆开火车、看看到里面零件的机会。又比如，让孩子做数学题的时候，直接要求孩子套用公式，用最快的速度算出答案，却不让孩子花时间，想想另外一种解题思路。


    再比如，给孩子读绘本的时候，过早地对给本里面的人物和事情下论断，比如亚婆就是“坏人”，白雪公主就是“好人”。这些结构性建议就等于过度强化了先验概念，完全不给其他的假设一点空间。


    如果你想要孩子变成更强的学习机器，首先要注意保持开放性。把玩具给他们的时候，就鼓励他们多去探索、创造出不同的可能；让孩子解题的时候，多问他们“你还有没有更好的方法？”跟他们讨论一件事情的时候，不要把话说死，给各种假设都留一些空间。


    +   2.多带孩子接触不同类型的信息


    孩子能够解决贝叶斯推理问题，因为他们的推理依赖于从周围获得大量新证据。孩子从观察中学习，他们大量地地、听别人信息，如果可以给孩子提供多样的观点、不同的信息，他们样本库的概率分布就越合理。


    所以，随着孩子生活经验越来越丰富，你要多带孩子接触不同类型的信息。比如给他提供开放性更强的玩具，比如积木、画笔；带他多出去看看，让他理解世界上存在着不同的人和不同的文化；给孩子读百科全书等科学书籍。


    这样做一是为了激发孩子的探索欲望，二是帮助孩子把更多可能性纳入到他们的知识库中，他们对世界的判断会更准确，解决问题的能力也更强。'
