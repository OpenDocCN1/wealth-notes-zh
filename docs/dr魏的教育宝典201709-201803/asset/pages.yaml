    有的家长虽然花大量时间陪在孩子身边，却不懂得给孩子的成长以反馈，或者只给负面反馈，或者是简单的表扬，这都是不够的。


    # 5. 让孩子养成好的生活习惯


    从养育孩子来说，最重要的是不是教孩子学会某个技能，而是让他养成好的大脑节律和生活习惯。


    人的身体要适应昼夜节律，大脑也需要适应节律。大脑的节律性与大脑的运行效率密切相关，深远地影响着大脑功能。好的生活习惯能保证大脑节律的稳定，帮助我们在工作、学习、休息这些不同大脑活动模式之间高效切换。比如，睡眠的节律性对大脑的正常工作很重要。如果睡眠习惯不好，或者睡眠被剥夺，记忆的巩固和信息关联的能力被大大削弱，学习力自然会下降。


    养成并且保持习惯的秘诀是，在心理上，增加孩子行为的自主感、归属感和胜任感，将行为转化为内在动力。在执行上，建立“如果-那么”的连接，比如“如果吃完晚饭，那么我们就去刷牙”，在具体情况和行动之间建立牢固的联系，一旦这种联系变成机械性的，习惯就自动化了。


    最后我回顾一下这两期课的共同原则，不论你看到多少理论方法，最重要的是把这些方法融会贯通到你自己的孩子身上。我用自己孩子的例子结尾：


    +   1. 我最近在对付萱萱的英语学习，为了让她提升，我用了读、说、文字同时发展的系统的英语教材，我也要求她读说一体，这就是多通道刺激的方法。\n2. 然后我遵循记忆系统的技巧，要求她每天学习一点，每天都要抽查她，这就是提取练习效应。\n3.
    孩子每天需要去复习，这就是刻意练习。\n4. 当然，孩子的努力跟她的奖励挂钩，给孩子提供动机。例如完成得好的话，就可以在iPad上玩一会儿游戏。\n5. 最后，我给她校正一下心态，这是为了能力的提升，不是为了玩游戏。因为这个学期后，她会在英语上真正获取能力，就像她在数学上的能力一样，这是在给孩子灌输成长型心智。


