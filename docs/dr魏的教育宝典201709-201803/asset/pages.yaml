  md: '这个故事可不是瞎编的，科学家真的拿这个故事去问了一百多个五岁到七岁的孩子。他们在纸上画出了3个小房子和1个大房子，然后再给孩子一些圆纸片当盘子，让孩子动手，摆到房间里看看。结果发现，就算是这些小孩连加减法都不会，更别说乘法了，单靠推理和数盘子的个数，超过六成的五岁小孩能做对这道题，所有6~7岁的孩子都做对了这道题。


    把乘法题用简单的故事来包装了一下，竟然能帮助5岁的孩子，理解他本来要到7岁才能学会的数学概念。而且，孩子在这样的题目中学会了推理、解决问题和动手能力，这比单纯让孩子背“三四十二”这样的乘法口诀，要有意义得多。


    # 3.户外活动提供多样刺激


    户外其实有不少类型，有大自然型的海边、爬山、草原，也有室内的博物馆、水族馆等等。孩子课本上看的、抽象的东西可以和实物对应了，也是激发他们好奇心的好时候。


    # 注意：


    不需要追求非常新奇非常高端，不是一定要出国，一定要求名胜才行。对孩子来说，能有户外活动，能有你的陪伴就好。


    你的陪伴最好是有准备的、高质量的陪伴。准备好应对孩子的问题，如果孩子没有问题，你要引导他去问问题，多讲解。例如，博物馆里可能动手的東西，能看见的神奇的小实验，就非常吸引孩子。


    对年龄小的孩子，每次户外活动都是神奇的经历，都有新发现。对于大的孩子，抽象知识和具象东西要开始相互验证了。对我来说，激发好奇心，学习事物之间新的联系就是最大的收获。大人的话语应该是：永远鼓励思考，鼓励探索。当时看不懂的，大人也不知道回答的，回家查资料。孩子喜欢这种“学习研究”的实践。


    # 年度智力宝宝


    乐乐开心妈 （智商贴）这一年大宝在数学方面进步很大。在Dr.魏的启发下，我们通过数轴游戏提高数感、睡皇后桌游练习运算、超市购物实际应用一一三步走，提高大宝的数学能力。
    首先，提高数感。学外语要注重数感，但不知道数学也要注重数感。大宝能说会道，就是数学不开窍。我用纸板制作了一个数轴游戏棋盘，把数字按大小顺序装进直线排列的一个个“小车箱”（要不是Dr.魏的叮叮，我会以趣味、美观为由，把它画成螺旋or蛇形），以红红的Start开始，以大大的五角星结束，再从姥姥处麻将里挑出散子和角块黑亮的做棋子。完全，开始游戏。为了增加游戏趣味性，轮到我掷骰子时，我都故意把骰子掷在手心，一边摇一边说：“要一个大点的数啊，让我超过乐乐！”几次如愿后，大宝就开始问：“妈妈你发现了吗？为什么我说要大点的数骰子就经常会是大的数呢？”（哎，概率一一这成了我们十万个为什么中的一个。）
