  md: '# 081 | 如何远离体罚？


    Dr. 穎


    该不该体罚孩子？


    上次我在专栏里回复一位妈妈的问题，提到不要体罚孩子，之后收到许多家长的留言。有人同样认为，不应该用暴力的方式惩罚孩子；也有人表示，孩子不听道理必须打，否则不知好歹；还有人说，打屁股不太好，所以就打手心。我想，关于打孩子这事，有必要专门说说。


    首先要声明，我从没打过孩子，因为我知道：打孩子只有坏处，没有好处。


    # | 脑科学角度看，体罚影响大脑


    打孩子的坏处，除了当时可能就出现的身体伤害之外，还有可能影响孩子大脑发育，成年后更有可能出现情绪障碍，孩子也可能会用暴力的方式去处理问题。


    有一项研究显示，让孩子接受严厉的体罚，可能会对孩子大脑的发展产生明显的影响。这里严厉的体罚是说，孩子在三年以上的时间中，每个月至少被揍一次。


    研究者发现，那些经常被揍的孩子，大脑前额皮质的某些区域中灰质明显少。意味着孩子将来更有可能患上抑郁等精神障碍，更有可能酗酒，智商测试成绩可能更差。


    此外，科学家们发现，如果孩子长期处在忽视、虐待或暴力环境下，会感受到有害压力，大脑结构会发生破坏性变化。


    美国儿科协会也认为，体罚效力有限，并具有潜在的有害副作用。实际上，打孩子打得越多，大人越愤怒，就越有可能再打孩子，并且家庭内部冲突也更多。


    经常挨打的孩子更容易用暴力的方式处理问题，这就不用多解释了。因为孩子天生会模仿，当他发现，可以用暴力来处理问题，自然会采用同样的方式对待兄弟姐妹和其他人。


    我說打孩子沒有好处，会有人不相信。他们说，我家这孩子打了才管用，不打他就是不听话。这种情况，我想提醒的是，孩子暂时“听话” 是身体被伤害时的恐惧，但并不一定能理解为什么被打，也不知道究竟应该怎样做才对。


    在生活中经常出现这种情况：你揍孩子一顿，问：“知道错了吗？” 孩子说：“知道了。”“下次还犯吗？”“不犯了”，可下次他还会出现同样的行为。你能指望在恐惧之下，一个人能深刻反省自己，然后真诚地吸取教训，最后确保下次不再犯同样的错误？门都没有。我们成人做不到，小孩子也做不到。


    # | 为什么会用“打”的方式解决问题


    有人可能认为，大人得在孩子面前树立权威，让他知道家里谁说了算。还有人可能觉得，自己小时候就是被打大的，长大也挺好的。更多的情形是，感觉没其他办法了，所有招数都试过，不灵，只能打。


    首先我不同意家长要树立权威这个观点，我认为大人与孩子在人格上是平等的，我会尊重我的孩子，听孩子的观点。在孩子还不会说话的时候，也观察她的动作，理解她的想法。我小时候也挨过打，挨打的滋味并不好受。如果有更文明的解决问题办法，为什么还要用暴力呢？


    如果你觉得其他方法都不好用，只能打，那么我们可以回到问题的原点：你一般在哪些情况下会打孩子？当时发生了什么事？你遇到了什么困难？


    我相信每个体罚过孩子的家长都有自己不得不体罚孩子的理由，也肯定觉得一句“不要体罚孩子”不能根本地解决问题。我从咱们留言区搜集了大量问题，今天，我就从我总结出来的体罚孩子的典型场景来聊一聊，并且分享一些我自己处理这些困难时的方法，供你参考。


    # 场景一：不体罚无法让孩子远离危险


    大家通常对于安全问题最关注，比如，有个妈妈教5个月大的宝宝不能碰电源插座。她把宝宝抱到插座前说，这个不能碰，手指插进去会痛。刚开始宝宝不明白，常常伸出手，这时妈妈就不重不轻地打他手，然后问他，痛吗？一直抱着宝宝教了好几个月。


    还有一个妈妈因为孩子不顾安全攀爬书柜，所以专买门的尺子打孩子。


    涉及安全的事非常重要，我特别能理解，当孩子做危险的事，大人有多么担心和着急。对于这类问题，孩子在不同年龄，遇到的事情不同，我用的方法也不一样。


    在宝宝2岁以内，我在家里尽量给她布置安全的环境，比如上面妈妈提到的插座问题，我当时是换了插座，换成带防触电盖板的安全插座。墙上的插座也可以换上一些儿童安全配件，确保孩子的安全。在她的房间里，她就可以自由探索了。


    如果是一 些不会危及生命的事，我更愿意给孩子试错的机会，让她自己尝尝后果。我女儿一岁多的时候，伸手去够刚端上桌的菜汤，特别烫。我没有阻拦，在旁边看着。她手摸着汤盆，哇地就哭了。这时候我去抱着她，说，“宝宝，冒着气的菜汤非常烫，你被烫伤了，来爸爸给你吹吹手。”她自己以后就再也不乱碰桌上的东西了。


    我怕孩子不知道门缝夹手的危险，在孩子刚学会自己进出门的时候，就领着她来门口，演示给她如果被夹住有多疼：我把她的小手放在门缝上，轻轻地、慢慢地挤压了一次，她立刻就明白了这个吃人手指的门缝的危险，下次自然就小心了。


    对于可能危及生命，不能让孩子真的去尝试的事，比如在马路上乱跑、爬书柜、衣柜，在孩子小的时候我们大人要时刻注意看好孩子，过马路抱着，出门至少一直拉着孩子的手。


    孩子长大点懂了，我就给她看交通事故的图片和视频，当然会挑不那么血腥的，告诉她在马路上乱跑可能出现的后果。孩子爬书柜，我想，也许可以用类似的方法。


    总之，让孩子了解危险行为所带来的后果，而不是简单地把孩子把危险行为与挨打联系起来。


    # 场景二：不体罚孩子无法满足我的期待


    还有一种情况，是大人的需求与孩子发生冲突。比如有位家长说：


    今天中午让我女儿联系拉丁舞，我无论怎么说，她就是杵在那里不说话也不动。我说：“要不你教我怎么跳吧，手怎么放，脚怎么放？我也想学学”，可是她还是杵在那里，像个木头人。


    又催了她几下还是那样，顿时我火冒三丈，问她跳不跳？为什么不跳？可她还是杵在那里，我就拿起小棍子打她，还问她，为什么不跳？为什么不说话？刚开始打的时候还是不说理由，后来才小声说“不会跳”。我接着说：“你要倒是开始就说不会跳，我也不会打你啊？我打你是因为你对我的态度，为什么不回答大人的问话？”


    这位妈妈给孩子提出一个要求，孩子却没有任何反应，妈妈因为孩子的“态度”，而打了她一顿。


    面对这种情况，我们从孩子的角度和妈妈的角度分开来看。


    首先，孩子遇到了困难。


    孩子的畏难情绪很普遍，我女儿练琴，也有“弹不下去”的情况，到了该练琴的时候，她呆呆地坐在琴凳上。这时候，我一般会问她：“孩子，怎么了？遇到什么困难了吗？”她可能说，这一首不知道怎么弹。


    我帮她拆解任务：“没关系，咱们先分左右手，一句一句地弹，看看是哪个地方太难了。”这样，帮助孩子把一个她无法解决的大困难，拆分成更小的步骤，找到症结所在，再有针对性地练习。


    这位女儿不肯跟妈妈对话，原因可能有多种，比如害怕妈妈发火，或者找不到准确的词 Manning 自己的状态。我们需要看到孩子行为背后的原因，再去给孩子提供相应的支持。


    在上面家长留言的故事里，孩子和妈妈“对抗”，妈妈的指令没有得到回应，非常愤怒。认识我的人都知道，我是个急脾气，也容易愤怒。不过，我一般能在“爆发”之前意识到自己的情绪，并告诉对方。


    比如，我可能会对孩子说：“你这样不说...”'
