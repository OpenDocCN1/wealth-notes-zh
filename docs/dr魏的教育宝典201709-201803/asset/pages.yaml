  md: '# 083 | 打败学习中的拦路虎——阅读障碍


    Dr. 魏


    孩子不爱读书学习，是偷懒葛的祸？


    今天我跟你聊聊阅读障碍，什么是阅读障碍？我举个身边的例子和你分享。


    我朋友跟我抱怨他家孩子的学习问题，他说：“孩子上小学一年级，期末成绩不太好，我知道他很聪明，就没在意。可暑假陪孩子读书写作时发现，孩子读课文特别磨蹭，经常看漏字。做数学题也是，审题都要很长时间。我估计他考试不...不会，是根本做不完，有什么办法改善吗？”


    孩子出现这种情况，有很多原因，你可能会认为他“不爱看书”“学习不专心”“故意偷懒”...但很可能你冤枉孩子了，读书慢，不是因为故意磨蹭、拖延，可能是他有阅读障碍，他的大脑在受苦。


    # 阅读障碍——一种常见的学习困难现象


    有些人觉得，阅读障碍是一种稀有、智力上的疾病。其实，阅读障碍的程度有的比较严重、有的比较轻微。在全世界范围内有5%~17.5%的发生率，五个孩子中有一个孩子，就可能患有不同程度的阅读障碍，是最常见的一种学习困难的现象。具体有哪些表现呢？你可以对照看一下：


    +   孩子读书、写字速度慢吗？

    他常常写错汉字吗？

    他的英文拼写怎么样？

    他能听懂你说的话，但看书里写的就很难理解？

    他的计划和组织的能力差吗？


    如果他每条都中了，你可能需要注意了。


    有阅读障碍的孩子，智力上跟普通孩子一样好，也一样愿意学习，偏偏就是没有办法读书和写字，如果不注意帮助他们的话，可能会变成别人眼中的“差生”了。


    1980年以前，我们国内学术界普遍认为，中国阅读障碍的发生率应该会远低于英语世界，因为中文跟英文体系不一样。实际上，近十年的研究发现，不管你是中国人还是美国人，只要一些脑区发生异常，都可能表现为阅读障碍。香港大学萧慧娟博士的研究发现，有7%~9%的中国儿童正在受到阅读障碍的影响。


    7%~9%是什么概念呢？我跟一位小学老师聊过，四十人的班级，基本上每个班有三四个孩子有阅读障碍。但是，愿意提供医院证明，跟学校说明情况的家长只有一两个。有的家长不了解阅读障碍，以为孩子就是学习不好；有的家长隐瞒情况，怕孩子以此为理由不努力读书；有的家长不愿意承认孩子有问题，也不想孩子被干扰。


    其实，压抑或逃避都不是最佳办法，就像色盲无法解码颜色一样，阅读障碍的孩子只是对文字的解码力比较弱。只有在了解读写障碍，并接纳它前提下，才能对症下药。


    阅读障碍到底是怎么来的呢？如何挑选适合的机构帮助孩子改善？


    # 中西方不一样，选机构一定要慎重


    首先，我来说说阅读障碍的历史，这要溯源到一百多年以前。


    1887年，有一个叫伯西的男孩被正式诊断为阅读障碍（Dyslexia）。医生发现他在阅读和书写方面，有严重的困难，但其他能力都很正常。


    像伯西这样阅读有困难的孩子，大脑里发生了什么？脑成像研究发现，他们的左脑后部，接近听觉皮层的地...大脑灰质体积比正常人小，大脑灰质越少认知水平越低。


    他们读书的时候，左脑后部的活动也比正常人弱，这个脑区跟字母和声音的转换有关。就是说这些孩子听到的可能是“good”，不知道怎么，写出来就变成了“book”。


    如果伯西生活在2015年的英国，他的学习可能就不会受到特别大的影响。因为西方国家对读写障碍研究得比较全面，已经有相对成熟的诊疗方法，在父母、老师提供的辅助下，只要帮助伯西顺利地理解意义，他就可以跟普通孩子一样，取得好成绩。达芬奇、爱因斯坦和丘吉尔都有阅读困难，但这不妨碍他们有成就。


    我们回到国内，如果珀西是一个中国孩子，会怎么样？萧慧娟博士对一群北京的、有汉语阅读障碍的小学生的脑成像研究发现，这些孩子跟英文阅读障碍的孩子不一样，他们是左前脑区（前部的左侧额下回）的灰质体积比正常孩子小，这个脑区域跟孩子读写和写作密切相关。


    # 阅读障碍也分英文和中文吗？


    英文语境下，一般看见字母就能跟读音对应上，比如看到“pen”，你就知道要念“pen”。但汉字的模塑撇捺跟声音没有任何直接联系，一撇一捺念人“ren”，捺稍...高点儿又念入“ru”了，孩子得硬记住什么字形，配什么读音。


    很多汉语阅读障碍的孩子，看到了字，但不能顺利地把字读出来，也不能理解这个字的意思。


    这就证明，中西方的阅读障碍是有差异的。


    比较遗憾的是，国内对汉语阅读障碍系统的研究比较晚，不管是阅读障碍的筛选、评估，还是干预手段都没有一致的标准。另外，相关市场也比较混乱，如果你觉得孩子可能有阅读障碍，我建议你一定要慎重选择机构。


    我在这里给你提个醒：如果有机构宣称用一些药物或医学手段可以改善读写障碍，你一定要长个心眼。


    研究发现，目前没有出现任何有效的药物或医学手段可以改善阅读障碍，被科学证明、能有效帮助读写障碍儿童的方法只有一个——教育。你可以在家庭或学校中，对这些孩子实施一些针对性的辅助教育，搭建孩子和文字之间的桥梁。


    具体有哪些针对性的辅助，我没有办法一一告诉你，一些特殊的干预方法你需要咨询专业机构。不过，我整合了几个要点，适用于所有多少遇到阅读困难的孩子们。


    # 1.鼓励阅读，每天陪孩子一起读书


    孩子有阅读障碍是多方面原因导致的，可能是天生遗传，也可能是后天环境的影响，一个很重要的后天影响就是：你有没有鼓励孩子阅读。我建议你每天都花些时间，跟孩子一起读书，培养成孩子阅读的习惯，能给孩子的阅读能力带来很大帮助。


    要求孩子读书之前，给他一点时间“热身”，让他自己翻翻书、看看插图。读完书之后，让孩子谈一谈他的理解和感受。


    在读书的时候，记得跟孩子一起大声朗读，鼓励孩子读出声；已经对识字感兴趣的孩子，可以教他们一些认识汉字的技巧，比如汉字里有许多形声字，形旁表示意思，声旁表示声音。


    孩子认识一个“大”字，那么看着“达”跟它有什么关系？汉字有些偏旁部首也表示意思，比如跟孩子一起找“虫”字旁的字，找有“贝”的字，看看有什么规律？


    注意，你给孩子读的书，要符合他的水平，书里有太多生僻字或太简单都不好。读书的同时，有意识地鼓励他们认字、写字。


    # 2.多感官阅读


    还有一个英语和汉语都适用的方法，叫多感官阅读，可以当成游戏跟孩子玩。我们人有多种感官通道，除了语言常用的视觉、听觉，还有触觉、嗅觉、运动觉等等，这些通道都可以用于理解和记忆文字。


    比如，把触觉与视觉、听觉结合起来，在小桌上铺一层沙子，让孩子用手指在上面写字，一边写，一边读。也可以用砂纸做出字的形状，孩子用手指沿着笔画移动，感受字形的同时大声读，这样，孩子能在字形和声音基础上增加一种触觉记忆。


    我给你分享一个小时候老师教我的方法，你今天回家，就可以跟孩子试着用起来。


    让孩子用一个手指在空气中写字，一边写一边读出来。这样用手比划在空气中书写，通过增加肌肉记忆，也可以强化每个字的字形与读音的联系。反正，读书不只是念和看，通过把视觉、听觉与更多感官结合起来，会对孩子学习汉字有更大帮助。'
