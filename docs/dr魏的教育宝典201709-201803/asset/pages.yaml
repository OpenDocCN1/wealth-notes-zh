  md: '# 115 | 怎样奖励孩子最有效？


    Dr. 魏


    经过我好多期的叮咛，你可能已经知道，不要惩罚、打击孩子。


    你可能想问，该不该奖励孩子呢？美国有一种观点，早就宣扬要用奖励代替惩罚了，他们说：“如果我们能更好地用胡萝卜教孩子，为什么还要用大棒呢？”很多人开始模仿，用糖果、巧克力等等物质奖励孩子。


    可是你发现问题了，孩子开始经常跟你讲条件：“你不给我糖吃我就不会弹琴了！”你开始担心，孩子会不会变得爱讨价还价，甚至要挟大人？


    # 奖励有用没用，不能一概而论


    艾尔菲·科恩跟你一样，他在《奖励的恶果》这本书里说，那些老是用奖励来鼓励孩子的人，没有想到外在奖励是在给孩子吃“有毒的胡萝卜”。一旦孩子开始依赖奖励，他们对事情内在的兴趣被消磨了，需要奖励才会继续做事，而不是做真正感兴趣的事。


    果不其然，他的观点得到很多人的认同。有的妈妈说，要立刻将家里的奖励表格扔进垃圾桶。从今以后不给孩子任何奖励，要让孩子寻找自己的内在兴趣。


    但是，你又发现问题了。遇到孩子不喜欢做的事情，比如想让他定期整理玩具、不害怕吃药打针，不给奖励好像根本行不通。


    # 1.当孩子喜欢、主动做某件事的时候：


    如果孩子喜欢做的事情，比如孩子本身喜欢画画，他对画画的内在兴趣已经很大了。这时候给他外部的奖励，比如物质或者金钱奖励，反而会削弱他对画画本身的兴趣。另外，如果孩子做了什么良好的行为，比如主动扶老奶奶过马路、分享玩具给别人，这时候给他们物质奖励，也会降低他们下次做好事的几率。


