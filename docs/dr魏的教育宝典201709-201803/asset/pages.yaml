    # 如何让孩子主动吃蔬菜、水果呢？


    孩子们缺乏良好的生活习惯，不仅仅仅是家长头疼的问题（我在留言里看到很多），而且也会影响到孩子的各项发育发展。咱们这个课程的一大特色是用靠谱的科学研究解决你关心的育儿问题，我今天最后，就回答一下这个非常接地气的育儿问题，孩子不吃蔬菜水果怎么办？


    你可能听说过一些方法，比如将青菜混到肉丸子里，将水果榨成汁，让孩子不知不觉吃到蔬菜水果。但是，今天我想跟你讲讲科学家们是怎么克服这个难题的。


    斯坦福大学的一群科学家找到了解决孩子不吃蔬菜问题的得好方法，他们发现给孩子介绍有关营养学的一些新知识，会让孩子吃更多的蔬菜。


    科学家让一群老师给4到5岁的孩子读了几个星期的故事书，这些故事是精心编排过的，里面会用孩子能理解的语言解释营养学知识。比如「食物是由很多不同，看不见的营养素组成的；当我们吃东西时，身体会将食物分解成营养素；我们的身体需要不同的营养素来做不同的事情。所以为了身体运作良好，我们需要摄取大量不同的营养素。」结果发现，听过这种营养学故事的孩子会更好地理解营养概念，他们也更有可能主动吃蔬菜。


    这个研究除了可以解决孩子吃蔬菜的问题，其实还揭示了一个长以来，我们养孩子的时候容易忽视的一个问题，那就是孩子比我们想象的要聪明很多。


    我前面说到了，小宝宝也有思维。跟大人一样，孩子也会建立自己的一个比较基础的，关于周围世界的理论。通过这些理论，他会理解周围的人、事、物是如何工作的。比如，他能理解吃东西里面有细菌，细菌虽然看不见，但是会让你得病；他也能理解吃蔬菜能让自己更健康，比如'
