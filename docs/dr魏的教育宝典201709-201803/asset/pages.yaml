    # | 金牌家长-珍珠妈妈


    ![](img/bce617503caab4aa8727e0f05b5e6106_55_0.png)


    # 分享主题：孩子爱说谎怎么办？


    一天早上，我到房间叫女儿起床，几经折腾，她终于睁开眼睛，我一边嘱咐她穿衣服，一边去客厅收拾背包。这时，我听见她在房间喊：“爸爸，我可不可以再睡觉？”宝爸没回答，可女儿却接着喊：“哦，你说可以，太好了。”


    等我手忙脚乱收好东西跑进房间时，看到她又回到被窝，呼呼大睡。我问她为什么又躺下了，她一脸真真的回答我：“是爸爸同意我再睡会儿的。”我和宝爸哭笑不得，孩子分明在说谎，而且就在几分钟前，还制造了一个不太高明的“案发现场”。


    这个情况，可能也在你家宝宝身上发生过，而且孩子越大，情况越复杂，程度可能越严重。那么，我们家长究竟要如何看待孩子说谎这个问题呢？


    首先，心理学表示，人类先天就具有欺骗和说谎的能力，哪怕是不 gigantic 婴儿，也会用表情或哭声来进行小小的“欺骗”。而年幼的孩子说谎往往是无意的，因为幼儿不能像成人一样分清真实发生和内心想象之间的差别，会有出现记忆失真或想象错位的情况。


    这种时候，家长不用担心，孩子说谎只是成长过程中的一个阶段，况且，对于孩子而言，这不是在说谎，只是把想象当作事实表述出来罢了。


    当然，随着时间的推移，孩子会逐渐开始有意识地说谎，就像我女儿那样。这个时候很多家长可能开始着急，觉得自己的孩子怎么开始“变坏”了。


    其实，这样的担心大可不必，因为孩子说谎是个普遍现象，绝大多数是没有恶意的，并不牵涉孩子品性，相反，很多时候，家长的反应才是孩子说谎的最大诱因。


    +   (1) 找原因

    孩子说谎的原因有很多，家长千万不要一概而论。

    (2) 求关注

    如果父母平时工作较忙，只在孩子生病时才会“特别关照”，那么孩子就很可能通过谎称自己不舒服来求得家长的关注。

    (3) 模仿

    生活中，父母在与人交往时说了谎话，孩子听到后就如法炮制。

    (4) 吹牛

    为了获得小朋友的认同，或因愿望没达成，导致孩子编造或掩盖事实来挽回面子。

    (5) 逃避责罚

    这恐怕是很多孩子说谎的最普遍原因。因为父母的要求严格，孩子犯错时会受到责骂甚至体罚，为了不受皮肉之苦，孩子不得不选择说谎。而当孩子说谎成功逃避责罚之后，这种行为会得到强化，孩子会更加认可这种方式。


    +   (6) 找错误

    我们不难发现，孩子说谎很大程度与我们大人有关，而在处理孩子说谎问题的过程中，家长不当的言行可能会加重孩子心理负担，形成恶性循环。

    (7) 贴标签

    有些家长教育方式比较严厉，可能会在有意无意中给孩子贴上“撒谎精”、“坏孩子”等标签，这可以理解为父母恨铁不成钢的表现，但这些标签会影响孩子对自己进行正确的评价，甚至会导致孩子逐渐认同父母的观点，以为自己真的是个坏孩子。


    +   (8) 体罚

    有的父母发现孩子说谎，会感到如临大敌，认为这是非常严重、恶劣的行为，从而对孩子施加“语言暴力”，甚至“大打出手”。这样的行为不会减少孩子说谎的次数，反而变本加厉。谎言一旦开始，就要不停编造新的谎言才不被揭穿。


    +   (9) 把自己置身事外

    经常能听到有些家长对孩子说“我在外面累死累活，挣钱供你吃、供你穿，你却不学好，你对得起我吗？”、“我们一家都老实本分，怎么会养出你这样会撒谎的孩子！”这种一遇到问题，就把责任一股脑推给孩子的行为，千万要不得。

    孩子是父母真实的写照，如果孩子真的有问题，一定要是先从自己身上找原因，不可置身事外。


    +   (10) 找对策

    建立平等关系。思考一下，为什么我们在与领导、同事相处时，态度或语言都会比较谨慎，而批评起孩子来，却经常口无遮拦？很显然，因为你平视甚至仰视领导和同事，而对孩子则更多是俯视。

    有些父母并没有把孩子看作独立的个体，在生活和交流中缺少应有的理解和尊重，片面强调孩子无条件从众。这就导致在遇到问题时，孩子首先想到的不是求助于父母，而是如何向父母隐瞒。

    要想减少孩子说谎的次数，首先要建立一个平等安全的家庭关系，只有父母做做到善于倾听、乐于帮助，孩子才会认为“我是可以无条件接纳的，没必要说谎。”


    +   (11) 注意以身作则

    父母平时尽量不要当着孩子的面说谎，虽然成年人说谎多数不是恶意的，但孩子并不能完全分清，所以家长要谨慎处理自己的言行。

    另外，在家里，父母可以主动说一说在单位发生的事，比如今天犯了什么样的소错，闹了什么样的乌龙，以后打算怎样改正，或者某位同事工作业绩突出，明天要向他好好请教等。

    让孩子认识到，无论生活、学习还是工作，都可以是很坎坷的，不需要刻意隐瞒或编造什么。只要家长做好了表率，孩子不会偏离轨道太远。

    多提醒一句，对孩子的承诺，一定要素力兑现，否则孩子也会认为父母在说谎，留下不好的印象。


    +   (12) 使用正面强化

    如果一个孩子，在学校犯了错误，回家后主动向父母说明情况，父母不应揪着错误不放，一股脑批评孩子。而应告诉孩子“错诡人人都会犯，但是你没有逃避而是勇敢面对，我们为你感到骄傲。”孩子因为说了实话而得到表扬，今后再次遇到类似情况时，会更倾向于说出实情，而不是谎言。

    孩子说谎不是什么天大的事，关键看父母如何正确引导


    最后，用蔡台接利的观点来总结一下：对于儿童说谎的行为，如果家长给予各种形式的强制干预，反而会造成孩子内心的焦虑与恐慌，不利于孩子心理的健康发展。父母应该懂得，有的时候适当当地忽视，反而能使孩子的说谎行为自然消退。


    Dr. 魏

    珍珠妈妈真细心，确实，四五岁之前的孩子还无法分清“想象”和“现实”，需要到五岁后，才可以慢慢区分出来。这个阶段前的孩子说谎，不算是严格意义上的“谎言”，他们往往认为自己讲的是真话，即使这真话掺了“假”。

    所以，孩子撒谎不能随便就上升到道德品性的高度，像@珍珠妈妈说的，真不必过于担心，关键看家长如何引导。

