  md: '# 家庭知识库 | 育儿词典（ 三 ）


    Dr.魏


    养育路上，你是否经常遇到很多陌生、但又内涵“神奇”的词汇？想让孩子赢在起跑线，又怕方法不科学？接下来，我帮你具体分析情商、语言混淆、蒙眼识字、多元智能，该如何对待。


    # 【 情商 】


    +   ★ 提示："情商"这个概念非常混乱复杂，经常被误用。


    +   ★ 评价：最开始正式提出"情商"理论的人，是美国心理学家萨洛维和梅耶，他提出"emotional intelligence"这个概念，中文叫"情绪智力"。大概是为了跟"智商"相对应，传到中国就被误译为"情商"了。


    萨洛维和梅耶认为情绪智力是检察自己和他人的感受和情绪的能力，区分情绪之间差别的的能力，以及运用这种信息，指导自己的思维和行动的能力。


    五年之后，科普作家戈尔曼把这些艰深的学术词汇翻译成人口语，"情绪智力"这个词才真正地流传开来。情绪智力不是认知能力，而且比其他认知能力更重要，这其实是戈尔曼对于情绪智力的误读。


    其实情商和智商没有什么可对比的，因为它们根本不是对立的概念。网上有一句很火——"成功80%来自情商，20%来自智商"，认为情商比智商更重要，这个说法就来自戈尔曼的主观认定，没有靠谱的数据及研究来支撑。实际上，科学实验证明，情商跟智商密不可分，智商高的人，情商也高。


    而且，学术界对于"情绪智力"这个概念尚存争议。其实，你关心的情商，是希望孩子有一些人际交往相关的技能，可以统称为社会情绪技能，比如识别情绪、表达情绪、调整情绪、合作能力、毅力等。这些社会情绪技能综合在一起，就变成你口中的"情商"了。想要提升"情商"，首要先想清楚，你具体是想提高孩子的哪些社会情绪能力，这样才能对症下药。


    +   ★ 延伸：对症下药，提高孩子的社会情绪能力。


    +   1. 如果你希望孩子学会赞美，那么教他用积极的眼光看待人和事，鼓励孩子敢于表达，培养孩子的语言能力。 2. 如果你希望孩子学会安慰，那么用假装游戏等方式培养他的同理心。
    3. 如果你希望孩子输得起、性格温和，那么教他识别情绪，用恰当的方式表达和调节情绪，正确看待挫折，锻炼韧性。


    推荐阅读：

    086 | 怎样科学培养孩子的"情商"？

    家长分享 | 情商培养篇


    # 【 语言混淆 】


    +   ★ 提示：学习外语要趁早，不必担心语言混淆。


    +   ★ 评价：很多家长担心，孩子太早学外语，会打乱中文的学习。


    其实你大可不必担心，外语可以早学习，不存在不同语言之间相互干扰的问题。因为宝宝学的不仅仅是语言，而是包括语言在内的一整套与环境互动的方式。换句话说，他很自然地就能明白，该在什么样的情境下使用什么语言。


    这在脑科学上也有证据，如果孩子从小同时学习双语，两种语言在他大脑里的表征区是网状交叉在一起的，像玉米黄一样。但假如像我一样，成年后才学习第二外语的，中文和外语的表征区就是分开的，有着清晰的边界。比如，我如果离开美国久了，经常不用英文，中文表征区就会侵蚀英语表征区，外在表现也就是我的英语能力退化了。


    可如果是一个从小学英语的双语宝宝，在大脑层面上，他的英语表征区恰恰跟中文是混在一起的，两种语言可以在区域中间来回自如地跳转，互不干扰。


    因此，学习语言要趁早：越早学不同语言越不容易相互干扰，语言的神经可塑性也越强。


    +   ★ 延伸：如何让孩子学好外语？


    +   1. 利用浸入式学习法：越早让孩子暴露在双语环境里越好，像学母语一样自然而然地吸收外语。 2. "玩"着学外语，互动很重要：互动游戏符合孩子的大脑生长规律，传递的信息量最大。
    3. "玩"着学外语，切记要过"玩"过学：在日常活动中印荫外语是我最推荐的方式，因为最容易掌握的语言就是日常生活中大量重复的语言。


    推荐阅读：

    010 | 孩子学外语，多大最合适？

    011 | 教你三招亲子游戏，玩着学外语


    # 【 蒙眼识字 】


    +   ★ 提示：纯属骗局。


    +   ★ 评价：所谓"蒙眼识字"，是指在蒙住眼睛的情况下，仍然可以念出眼前的文字、扑克牌或图片，据说有的孩子甚至可以骑单车。


    那些提供蒙眼识字训练的机构宣称，这样做能够把连接左右脑的间脑（midbrain）激活，孩子就可以发出脑波，不用通过眼睛，蒙眼就可以看见物体。把间脑激活后，能够开发孩子的潜能，大大提高记忆力、专注力和想象力。


    听起来令人心动，但其实根本站不住脚。首先，连接左右脑的根本不是间脑，而是胼胝体，它的主要功能是传递两个大脑半球之间的信息。间脑主要分为丘脑和下丘脑，它跟自主神经系统调节与内脏活动有关，没有什么蒙眼识字的特殊功能。


    而脑波是我们大脑里的神经细胞活动时产生的电器性摆动。显示在科学仪器上，像波浪一样，所以叫脑波。脑波就像呼吸一样，在我们生活的每一秒，即使是睡觉，都是存在的，不需要激活。目前也没有科学证据显示脑波可以透视。


    你可能还会问，那些机构培训的孩子确实能够蒙眼识字，又该怎么解释呢？其实是天真的孩子被培训机构的大人引导出来的骗局罢了。


    +   ★ 延伸：预防近视的秘诀——户外运动


    +   1. 球类运动； 2. 老鹰捉小鸡； 3. 捡树叶或捡果实。


    推荐阅读：

    093 | 预防近视的秘诀：户外运动

    109 | 培养理性宝宝，从家长做起


    # 【 多元智能 】


    +   ★ 提示：只是一个"被广泛接受"的个人观点。


    +   ★ 评价：你可能听到过，很多教育机构信奉的多元智能理念。


    这要回到1983年，那时候认知神经科学刚刚诞生，一般的"IQ智商"测试只测试一些抽象思维的能力。这时候，哈佛大学的心理学家霍华德·加德纳（Howard Gardner）跳出来说，不能单凭智商测试来判断一个人所有的智力，人有八大智能，多元智能（Multiple
    Intelligences）理论就这样诞生了。他认为智商测试只能衡量一部分学校需要的智能，比如数学、逻辑等，但不能测量你在其他领域的智能，比如音乐和运动智能。


    而且，这八种智能是独立存在的，如果你一种领域表现在差，没关系，用其他领域补足就好了。这种说法当时就引起了轰动，人们一听，原来任何人都能成为某个领域的聃明人，那就算我智商测试比你低也沒有关系，我们还是可以达到某种意义上的平等，这就产生了很大的社会影响力。一些受到多元智能理论影响的课堂，首先会测试孩子是哪种智力类型，然后根据他们"特别的思考过程"定制不同的教学方案。


    可惜，多元智能理论虽然听上去十分激动人心，但它只是一个被"广泛接受"的个人观点，并没有得到主流科学界、心理测量界的实证支持。对于认知科学和脑科学来说，智力实际上不能这么分，多元智能的'
