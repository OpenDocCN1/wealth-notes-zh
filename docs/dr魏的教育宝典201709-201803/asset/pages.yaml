    # 金牌家长-llyi


    # 分享话题：孩子有没有必要上早教机构


    我家的小朋友两岁前表现出的性格特征是：内敛，与世无争，与其他同龄孩子在一起时毫无“战斗力”，院里的奶奶总是笑称：“全楼最绅士的就属你们家果果了”。


    但我并没有过度担心孩子吃亏被欺负的问题，而是再考虑如何可以让小朋友的内心更强大，一颗强大的心可以免于受挫，即使真的受挫也能有勇气去面对。


    早教是不是应该能够帮助孩子提高对事物的认知能力、运动的协调能力、动手能力、社交能力以及具备一定的规则意识？基于对孩子性格的考虑，抱着半信半疑的态度，我把他送进了一家早教机构。


    其实我更看重的是早教机构可以给未入幼儿园的小朋友，提前提供一个小小的社交环境，这点是我最需要，并且自身提供不了的。至于选哪家机构，要考虑的因素很多。师资、教学水平、环境、距离、费用等这就全看家长的判断力了。


    我家宝宝的早教机构“心路历程”


    孩子二岁时，我是陪同孩子一起上课的，在他三岁时开始独立上课，为上幼儿园做准备。在课上，我看到很多家长特别愿意用自己的意志左右孩子。选颜色时，家长说：“要红色吧”。画画时，家长说：“这样画，别往那涂，不对”等，各种类代劳。


    如果孩子都对，像成人一样清楚明白，还上什么早教班。我们怎么就不能给孩子提供一个“胡来”的创造空间，释放他们与生俱来的潜能？知识可以学，智慧学不来，只能靠体验、积累。早教机构的确提供给小朋友更多的体验。


    但再好的早教机构，作为父母也不能把“宝”押在它身上。因为早教机构替代不了你对孩子的培养和教育，你给予他的爱抚，和他一起游戏，陪他一起读书、全家一起旅行，这些都是早教。


    说了这么多，早教到底有没有必要上？从我家宝宝上过之后看，还是有必要的。


    我家小朋友明显区别于其他同龄孩子的表现有：


    +   (1) 规则意识较强


    这一点对于三岁左右的孩子而言其实比较困难。比如，孩子学英文，课上要求举手回答问题，很多小朋友都积极举起了手。老师还没有来得及叫谁，这群孩子就扑了上去抢着参与，只有我家的留在原地等待被叫，而且这种现象屡屡发生。


    再有，平时跟小朋友在一起时,即便生气也不会出现暴力行为，人多时懂得排队，不会因为不买玩具而哭闹，在公众场合他总是能很好的管理和控制自己的情绪，


    +   (2) 适应能力较强


    孩子在未入园前去过一个为期半个月的英文夏令营，全程独立上课，每天四个小时。不但不会找妈妈，还特别喜欢学习，那时只有三岁。


    新入幼儿园的第一天就和家人分离一整天，并没有所谓的过渡期。情绪不稳定是有的，但不会在园门口和撕扯、大哭的现象。我想是因为他心里清楚这是他必须做的事情，所以他能很快的主动调整，而不是只哭不去面对。


    下面，从我的角度，回答几个我在留言区看到的家长关心的问题：


    +   (1) 早教内容我在家就可以教，何必要去外面学？


    答：我也是全职妈妈，时间和精力都有，但我仍旧选择把孩子送出去上早教。因为你除了需要用心且耐心的教，还要忍得了孩子手脸头身、桌上、地上“一团糟”，以及收拾游戏过后的一片狼藉。即便这些你都做得到，你能给他创造出一个社会化的环境吗？


    +   (2) 在早教机构能学到真正的技能吗？


    答：不能。那里不是专业的绘画班、表演班、音乐班，不要指望6个月~3岁的孩子能从这里学会什么真正的技能。早教主要负责引导、开发、释放潜能。


    +   (3) 早教对孩子而言真正的作用？


    答：简单说就是，1岁内，对宝宝进行循序渐进的感官引导及启蒙；1-2岁，培养幼儿的大运动、精细动作、体能等；2-3岁，培养孩子的独立能力、动手能力、规则意识，释放其潜能的同时，家长也许还能发现孩子的兴趣所在。而以上这些都是通过早教机构设计的创新性课程来实现和完成的。


    +   (4) 上过早教和没上过早教的孩子有区别吗？


    答：我不敢说一定有。但我发现一个有趣的现象，今年我在给小朋友报公立幼儿园，填申请表时，表格中有一项“是否参加过早教班”，不知道作为家长的你，是否能理解幼儿园的用意。确实有幼儿园老师说过，在班中观察小朋友半个小时，大概就能知道哪些孩子上过早教，哪些没上过。


    Dr. 魏


    谢谢果果妈的分享。上早教不是必选项，每位妈妈可以根据自家情况来选择。


    如果平日不知道怎么跟孩子玩，上早教，跟老师学一学，不失为打开思路的途径；如果孩子周围小朋友少，去早教，多接触小伙伴，可以丰富社交圈子；如果担心孩子未上来幼儿园不适应，陪孩子上亲子课，多了一个缓冲期。


