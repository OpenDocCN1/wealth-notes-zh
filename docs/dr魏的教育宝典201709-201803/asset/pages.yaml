    # | 金牌家长-珍珠妈妈


    分享主题: 爸爸是育儿路上的好帮手


    一个周末，我们照例带珍珠爬山。下山时，偶遇一个5岁男孩，他要与珍珠结伴，珠爸本能地紧蹲左右，大概是怕男孩鲁莽伤到女儿，他们三人一路追追赶赶，我和男孩妈妈便自然落在后面。'
