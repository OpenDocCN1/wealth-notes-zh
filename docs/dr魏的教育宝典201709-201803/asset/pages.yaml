  md: '# 100 | 撒谎也是技术活？


    Dr. 魏

    孩子撒谎，家长该如何应对？


    很多人家长跟我讨论过孩子撒谎的问题，面对孩子撒谎，一些家长容易过度反应，更有些家长会把撒谎跟道德联系起来，为孩子的人性、品质担忧。

    其实，作为一名科研工作者，我从没有对孩子的撒谎问题担心过，当然，这倒不是因为我家娃不撒谎，而是我把孩子的每次撒谎，都当作对她认知能力的一次标记来看待。本期，我就跟你分享下：孩子撒谎了，大人应该怎么做。


    # 撒谎是门技术活


    虽然我们普遍认为撒谎是不好的行为，但从认知发展的研究来看，撒谎一手好谎，是社会认知力（俗称情商）发展的表现。如果你是一位爸爸，你可能跟我有一样的经历，比如妻子问：“我的新衣服好看吗？”虽然我看不出新衣服跟其它衣服有什么不同，但是还是要尝着法的赞美。


    你看，成人的世界需要“谎言”，我们需要考虑别人的感受，说些“谎话”<|start|>维，我们需要为了规避一些不必要的麻烦，说些“谎话”当借口。当然，这些“谎言”都是要打双引号的，它跟道德无关，反而是维系、缓和人际关系的一项重要技能。


    # 3岁以下的低龄宝宝，根本不会撒谎


    很多3岁以下的小宝宝，根本不会撒谎。这个阶段的宝宝，大多无法区分“想象”和“现实”的区别，说起话来常常天马行空，把“想象”和“现实”混在一起。有一次，我朋友的孩子信誓旦旦地跟我说：“我爸爸去过火星！”，其实是他爸爸带他看过火星的纪录片，孩子记混了，无意识地撒了谎。


    # 4岁以上的孩子，开始具备推测他人想法的能力


    # 1.低龄宝宝的无意识撒谎


    # 2.大孩子的有意识撒谎'
