    就不愿意了: “为什么说妹妹乖? 爸爸太偏心了”, 她嘟嘴着, 特别委屈。我一下子意识到自己的错误, 赶紧给她道歉说: “对不起, 爸爸不能这样比较, 爸爸非常爱你。你看爸爸给妹妹喂奶是5分钟,
    但是陪你玩一下子就是20分钟”。


    从医院接小女儿回家的时候, 我还给大女儿准备了一个礼物, 说是小宝宝送给她的。随后会给大女儿预留“专属时间”, 偶尔爸爸妈妈只带她一个人出去玩。


