  md: '# 153 | 多动症孩子更需要多动


    153 | 多动症孩子更需要多动


    Dr.魏


    如何帮助多动症的孩子？


    最近，咱们读者中，有一位小学老师问我，如何教育多动症的孩子。孩子已经去医院接受治疗，但在学校里，作为班主任，她应该如何帮助这个孩子？


    相信“多动症”这个词，你也听说过。我去超市买东西，看到了一个奶奶带着一个三四岁的孩子。小孩子东摸摸西摸摸，跑来跑去，一刻也不停。旁边的太奶看着孩子奶奶，同情地说：你这孩子真不好带啊，跟多动症似的。孩子奶奶应和：幼儿园老师也说，他一点儿都坐不住，安静不下来，建议我们去检查，看是不是多动症。


    孩子总爱动来动去，就是多动症吗？并不是。对于真正患有多动症的孩子，就要尽量训练他们“静”下来吗？也不。是。今天咱们来好好说说多动症这件事。


    # 1. “多动”不是多动症


    人们俗称的“多动症”，学名是“注意力缺陷多动障碍”（Attention Deficit Hyperactivity Disorder），缩写成ADHD。


    ADHD有三种类型：


    +   以多动为主型，主要表现就是人们常说的“坐不住”停不下，小动作不断；

    以注意力缺陷为主型，主要表现是注意力不集中，容易走神；

    混合型，两种表现都有。


    在临床上，男孩被诊断为ADHD的比例，比女孩高三倍，而且在世界各国都是如此。但在科学家的统计结果中，男孩女孩注意力出问题比率是一样的。


    这是为什么呢？很简单，因为注意力有问题的男孩，更多是小动作不断，更容易被发现，自然也就更容易被送去诊断和治疗；而注意力不集中的女孩，很可能是在走神、做白日梦，只是不会被发现。


    对于多动症的诊断，主要依靠观察孩子的行为。小孩子好奇心强，天生爱探索，表现出来是在“多动”。有些幼儿园，不了解孩子的发育特点，要求三四岁的孩子坐在小板凳上“听讲”，敲小黑板讲1+1=2，念a、o、e，孩子不感兴趣，不肯乖乖坐着，就会他怀疑是“多动症”。有些孩子只是调皮好动，就被贴上“多动症”的贴签，太冤枉了。有学者指出，多动症有被过度诊断的趋势，不是孩子有问题，而是大人和社会对孩子的期望过高。


    如果老师或是家长觉得孩子有“多动”的倾向，影响到他的学习和生活，比如相对于同龄人来说，孩子注意时间短、注意力容易分散、容易冲动失控、坐立不安，要带孩子去正规的医院寻求专业诊断，不要自己下结论。


    # 2. 多动症孩子的大脑


    真正患有ADHD的孩子，不是故意跟父母和老师对着干，不是听话，是他们的大脑功能有点障碍。


    研究者发现，患有ADHD的孩子大脑，流向额叶和前额叶区域的血液明显减少，做行为控制任务时，大脑的前额叶和纹状体的激活不足。这些脑区与注意、工作记忆、反应抑制和规划相关，而这些功能是与儿童ADHD相关的核心认知缺陷。


    你看，虽然孩子的外在表现可能是“过于活跃”，但他们大脑里的问題是该活跃的区域“不够活跃”，自我调节能力和反应抑制能力不足。美国研究ADHD的著名科学家巴克利有一个非常形象的比喻，他说，如果不能有效地抑制自己的行为反应，大脑就像发了疯的钢琴师，胡乱演奏。


    你想象一下，人脑在同一时刻会收到大量的信息刺激，对哪个刺激做出反应，对哪个刺激不做出反应，大脑应该做出判断、计划并执行。比如孩子正在听老师讲故事，这时窗外飞来一只小鸟，如果自控力好，孩子会看一下小鸟，继续听老师讲故事；如果自控力不好，孩子会立刻跑去抓小鸟，不管什么故事了，要是抓小鸟的路上听到馋馋叫，他可能又去找馋馋在呢，只对新鲜刺激做出反应，注意不持久。


    脑源性神经营养因子（BDNF）也被确定是ADHD病因中的潜在因素，它与多巴胺能神经元的分化与存活有关，而多巴胺神经元与冲动调控有关。这意味着，脑源性神经营养因子可能影响着与ADHD有关的的多数巴胺系统功能障碍。


    ADHD发生率比较高，在中国的数据是5%左右，每20个人里有一个。它对孩子的影响确实比较大，注意力不集中和好动，对学习的影响不言而喻；冲动失控，也影响孩子的社会交往。


    好消息是，多动症的孩子，通过治疗调整，症状可以改善，长大同样会有优异表现。在北京奥运会上一口气拿8块金牌的美国游泳名将菲尔普斯，小时候就被确诊过是ADHD。


    对于ADHD，现在的常见治疗手段有行为矫正、药物治疗、心理治疗。我今天想特别告诉你的一种有效的方法，无论在学校还是在家都可以尝试，完全免费，那就是运动。


    # 3. 运动改善多动症症状


    你可能有疑问，本来孩子就好动，你还让他多运动？你没听错，这是真的。


    美国有一组研究者，邀请21个确诊有ADHD的孩子做了一个实验，这些孩子年龄从7岁到12岁不等，其中10个孩子参加体育锻炼项目，另外11个孩子不参加。体育锻炼项目怎么进行呢？连续做10个星期，每星期3天，在中午进行45分钟的锻炼，有专业人员带孩子们做准备、踢球、做操等等，达到中高等级运动强度。结果发现，锻炼组的孩子处理视觉和听觉信息的水平都更强，注意力不容易分散，持续时间长。而且，父母报告显示，锻炼组的孩子在行为表现上也有好转。


    另一组研究者邀请参与实验的孩子年龄小一些，从4岁到9岁。这些孩子里有普通小孩，也有ADHD高风险的小孩。在12个星期里，孩子们每天上学的时候，都参加一节特殊课堂，时间是半小时。但他们的特殊课堂内容不一样，有两种。一种是偏安静的艺术活动，比如剪纸、绘画；另一种是偏活跃的体育活动，比如如鹰抓小鸡、丢沙包。结果，研究者发现，体育活动能减少孩子们的问题行为，对于ADHD倾向的孩子效果更明显。


    为什么运动可以改善ADHD症状，具体的机制还有待研究。科学家猜测，可能因为运动可以增加大脑中的血流量，促进大脑毛细血管生长，提高多巴胺等神经递质的水平，产生脑源性神经营养因子。


    大脑里的这些变化让负责反应抑制的区域活跃起来，增强孩子的自控能力，减少容易走神、冲动、多动的表现。不管怎么说，许多科学家认为，体育运动能促进大脑健康，对有ADHD的孩子有很大帮助——当然，对普通孩子也是好处多多。


    # 4. 冬季室内运动游戏


    你可能想说，现在是大冬天，外面下雪，太冷了，怎么运动？在室内也可以运动。稍微大一点的孩子可以跳绳、拍球。小一点的孩子你想办法设计一点好玩的活动。


    比如“推小车”：孩子趴在地上，双手撑地；你抓着孩子的腿，让他用双手“走路”，假装你在推车；想增加趣味的话，还可以在孩子的背上放玩具、放好吃的，运到他想去的地方。


    再比如在家跳跳舞或者健美操，我家是玩互动游戏，只要能让孩子运动，咱们的办法肯定不过困难，是吧？


    最后，我要感谢这位提出问题的老师，您是一位真心愿意帮助学生的好老师。教育特殊孩子需要有更多耐心，了解更多知识，付出更多努力，谢谢您！


    今天你得到的是，多动症是和大脑有关的疾病，发病率大约5%。我们不能轻易地认为好动、注意力不集中的孩子就是多动症，这需要专业医生的判断。缓解多动症症状的好方法是体育锻炼。


