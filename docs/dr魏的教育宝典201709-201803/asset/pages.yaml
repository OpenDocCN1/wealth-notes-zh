    # 宝妈@自由鱼vikies的分享：数飞行棋看视频，既培养数感，又锻炼自控力


    数学启蒙是我最需要的知识养分。我家大女儿今年已是高一的学生了，到现在为止数学仍然是她感到最痛苦的学科。我家二宝两岁5个月了。因为大女儿学数学的痛苦，所以二宝的数字启蒙就成为了我们的头等大事。


