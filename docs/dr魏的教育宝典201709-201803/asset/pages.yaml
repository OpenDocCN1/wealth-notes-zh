    孩子早期的经验非常重要，家长本来应该保护这些天生的学习者，但一些结构化、系统化的教育方法，却可能误导孩子。如何保护孩子强大的学习能力？家长要正确引导。


    特效药：

    1.保持开放，少给结构性建议

    2.多带孩子接触不同类型的信息

    3.鼓励孩子跳出限制，找到人生导师


