    Dr. 魏


    宝宝什么时候说第一句话？


    宝宝学说话、开口早是很多爸爸妈妈关心的话题。我有一个朋友之前跟我抱怨，说：“我家儿子一岁半了，只会说简单的两个字，比如，抱抱、不要、走吧、晚安。”我说：“挺好的，没看出问题啊。”她话锋一转，说：“可是我嫂子她女儿一岁半就会背‘白日依山尽’了，他们之间的差距怎么这么大？”


    实际上，大家会焦虑，是因为不同宝宝语言学习初期的表现，确实有很大差异。


    你肯定也听过很多语言天赋好的宝宝的故事，可能你家宝宝就是。不过，宝宝也可能只是简单说几个单词，甚至一句话都不讲，更多时候是用手给你指，给你比划。


    # 事实一.会叫mama不代表懂意思


    有个朋友问我：“我宝宝5个月就会叫妈妈了，怎么叫了大半年，到了1岁，还是只会叫妈妈。”我说：“你回忆一下，刚开始的时候他是不是看到谁都妈妈、妈妈地叫？”她说：“是啊。”


    # 事实二.能理解语言不代表能使用语言


    宝宝对语言的理解力，在他半岁的时候就开始发展了，而且他学习和理解新词 Pict、语法．的速度是很高的。但是，宝宝初学说话的能力，发展速度比较慢。


    # 事实三.宝宝语不宜一直说


    低估宝宝语言理解力的另外一个影响是，一直给宝宝讲一些语法简单、口语化过重的“宝宝语”。比如，宝宝手被烫到了，就说：“宝宝疼疼，妈妈吹吹。”其实，如果你家宝宝已经可以听懂很多语言了，正确的做法是，试试宝宝可不可以理解更复杂的句子，你可以这么说：“宝宝，你的手是不是被烫到了呢？妈妈来给你吹一吹？”


    说完这么多语言发展的误区，接下来我给你说三条促进宝宝语言发育的建议：


    # 1.抓住宝宝的注意力


    虽然我们要多跟宝宝交流，但这不意味着要像唐僧念经一样在宝宝旁边碎碎念，而是要抓住时机，在宝宝注意力集中的时候教他说话，效果最好。


    # 2.结合图像教说话


    你可以回忆一下，你想让宝宝开口说话的时候，是不是就是对着宝宝，一遍一遍让他重复你说的话？'
