    # 三、安全依恋清单


    心理学家沃特斯（Waters）和迪因（Deane）设计了一套卡片，通过观察孩子平时的行为，测量孩子的依恋类别。整套卡片的使用需要经过培训。下面摘出几条典型的安全型孩子的行为，如果你的孩子有下面这些表现，恭喜你，孩子在很大概率上对你是安全型依恋。


    +   1. 孩子玩的时候，一直注意你在哪里，时不时喊你一声。\n2. 孩子明显表现出把你当安全基地的行为模式，出去玩一下又回来，再出去玩一阵又回来。\n3.
    如果孩子被吓到，或者他伤心的时候，只要被你抱在怀里，很快就不哭了，恢复了正常。\n4. 孩子愿意听你的话。\n5. 你把孩子抱起来的时候，孩子用胳膊挎着你，或者把手搭在你肩上。\n6.
