  md: '# 141 | 自闭症并不遥远


    141 | 自闭症并不遥远


    Dr. 魏

    面对自闭症孩子，我们可以做些什么？


    听到“自闭症”这三个字的时候，你脑海里的第一印象是什么？有人说，是像电影《雨人》的主角，记忆力超强，数字天才；有人说，特别会画画，是艺术天才，腾讯公益不是做过活动嘛，展示的自闭症孩子的画都很好。


    其实，这是一个很大的误会。在自闭症患者中，大概四分之三的孩子同时伴有智力障碍，剩下的才是智力处于平均或平均以上水平的孩子，天才，更是极少数。把自闭症跟天才等同在一起，可能只是人们的一种美好的愿望，但是，这种误解可能会给自闭症家庭带来额外的压力。


    上周，我收到一个读者的[_]问题：“我的孩子是一名自闭症儿童，给他的父母带来巨大的精神压力，我也心痛，但无能为力。对此我们的社会关注太少；可是在中国这是个不小的群体，很多家庭都深陷其中。如果您对自闭症有研究，能否讲解一下，我想这也能帮助很多家庭。”


    我一直非常关注自闭症儿童，我的实验室最近几年都在进行自闭症的相关研究。今天我带你走进自闭症儿童的世界，不但可以破除你对自闭症的迷思，帮助你鉴别、判断自己孩子的行为问题，而且你的举动也许还能给自闭症家庭带来莫大的支持。


    # 1.患自闭症的孩子，到底是哪里出了问题？


    自闭症是什么呢？它不是一种单一的“病”，学界用的术语是“自闭症谱系障碍”，是一组神经发育性障碍，有不同的亚型，行为表现各有不同，主要特征是社交往来能力_ENDPOINT和语言沟通能力低下，有重复刻板的行为、兴趣和活动模式，其核心的障碍就是社交障碍。因为没办法与人正常交流，好像活在自己的世界里，所以称“自闭症”或者“孤独症”。


    # 2.自闭症并不遥远，如何判断孩子有没有？


    很多人说，自闭症儿童是来自星星的孩子，你不理解他们，觉得他们跟你不在一个世界生活。其实，没那么遥远，他们就在你的身边。


    +   1. 不看或少看，是说目光接触异常。对人，特别是对人的眼睛注视较少。脑部扫描也发现，和普通孩子相比，自闭症孩子看到玩具图片时，大脑更活跃，看到人脸图片，甚至是妈妈的脸，都不怎么活跃。\n2.
    不应或少应，包括两项，一个是你叫宝宝的名字，他没有反应；就是所说的没有呼名反应。还有一个是，宝宝不能跟别人产生共同注意 (joint attention)，也就是说，不能和其他人关注同一物体或事件。比如，你指着洋娃娃说：“宝宝，看，娃娃。”如果宝宝顺着你的手指，跟你同时看向洋娃娃，这就叫共同注意，共同注意在语言和社交技能的发展上非常重要。\n3.
    不指或少指，是说缺乏恰当的肢体动作，不会对方感兴趣的东西提出请求。不会摇头表示不要，不会有目的地用手指。\n4. 不语或少语，这是特指语言发展方面的延迟。\n5.
    不当，这是指使用物品异常，相关的感知觉异常，语言发展倒退。比如有刻板的重复动作，比如只玩某一个玩具，玩很长时间，玩的时候不理人，而且兴趣狭窄。


    # 3.不要相信偏方，选择适当的干预


    # 4.宽容理解自闭症儿童'
