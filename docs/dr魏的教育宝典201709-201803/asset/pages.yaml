  md: '比如，我可能会对孩子说：“你这样不说话，我捏着急的，我想知道你的想法，请你说说吧。”我表达自己的感受，并且明确告诉孩子，我希望她做什么。


    我特别想告诉各位爸爸妈妈，你应该把自己的感受说出来。用语言表达情绪，让自己的情绪有一个出口，孩子也会学到识别别人的情绪，学会一种与情绪相处的方法。


    当然，也有些时候我觉得自己气得快要爆炸了，那么，我就离开那个地方，让自己有冷静的空间。同样，我会直接跟孩子说，爸爸现在太生气了，需要冷静一下。我们是孩子的榜样，如果我们想教孩子用合适的方式调节情绪，我们自己是最好的“教具”。


    当然，建立亲密的亲子关系不是一天两天的事。只要我们愿意倾听孩子，用尊重的态度与孩子沟通，相信我们与孩子的关系会更好。


    # 场景三：不体罚无法改正孩子行为习惯


    还有些妈妈提到小宝宝的“问题行为”，比如一岁多的宝宝吃饭时抠勺子、抠饭，两岁多的宝宝捡地上的东西吃，这是建立规则的事。


    给小宝宝建立规则，首先规则要一致，比如地上捡的东西不能吃，那就一定执行，如果糖果掉在地上，你觉得抠了可惜，捡起来冲冲吃掉，那么孩子就会感觉混乱。


    另外，建立规则时，你不必用攻击性的方式去“宣告权威”，但态度要坚定果断。当宝宝吃饭时抠勺子，你可以抓住他的手，看着他的眼睛，严肃地告诉他，不能抠。


    发现宝宝好的行为时，着重表扬，在宝宝好好吃饭的时候，夸夸他“你拿勺子拿得真稳！”积极强化正面的行为，比惩罚更有效。体罚不是确立好的行为习惯的终极选择，宁愿慢一点，耐心一点，反复训练孩子的习惯。


    总的来说，我不赞成带着生气的情绪，以“给你点颜色看看”为目的，用暴力惩罚孩子。孩子是个完整的人，我尊重孩子，愿意去了解他。


    在他小时候，以观察为主，了解他的需求，尽可能给他自由探索的空间，也树立必要的界限。长大后，我跟他聊天比较多，听他说自己的烦恼和开心。我也跟孩子聊自己的事，就像朋友一样。


    我们之间有冲突的时候，我没有想过要摆出高高在上的强权姿态压制她，而是想办法跟他一起找到“双赢”的方式。


    现在，在我们沟通的过程中，孩子的语言表达能力得到锻炼，甚至谈判能力也大大增强。和他人交流时，他总是试图用证据和事实来说服别人。如果孩子发现父母能够倾听，总是讲道理，他也会向你学习这一点。


    ｜今日得到


    体罚对孩子有害，从脑科学家的角度，体罚影响孩子认知，从父母的角度，我认为父母与孩子的人格是平等的，一定有更加聪明的解决方法。我给了你三个常见的父母体罚孩子的场景，并告诉你我是怎么避免体罚，来解决问题。


    今天我跟你聊的“体罚问题”，听起来可能是挺鸡汤的说法，但的确是认知科学的普遍发现：暴力绝对不是解决问题的终极方法，爱才是。


