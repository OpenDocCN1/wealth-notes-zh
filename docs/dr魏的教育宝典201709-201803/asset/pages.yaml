    # 1. “佛系宝宝”不爱社交怎么办？


    宝宝一岁半了，感情丰富并且极其敏感，让我担心的是，她和小朋友聚会的时候，其他孩子都很好奇地四处转转，或是跟着音乐一起跳舞摇摆，近距离地相互接触、玩耍。而宝宝只是远远地观察别人，一直依赖在妈妈身旁。


    我们经常开玩笑说宝宝不像小孩儿，身体里住着一个老灵魂。我担心，这样的聚会会加深她“被孤立”的社交习惯，但也不想勉强她去社交，我该怎么做呢？


    Dr. 魏


    你的观察很细腻，每个孩子对情绪、新环境、陌生人的反应是不一样的。宝宝对情绪比较敏感，所以和同龄人一起玩，也会偏向于回避，这是正常的反应。陌生带来不确定性，孩子感觉不安全。多给她些时间去观察和熟悉，她会循序渐进地适应的。而且，对于一岁半的宝宝来说，和同龄人社交还早着呢。她不是“佛系宝宝”，不是看破红尘，而是涉世未深。


    建议你复习以下两篇文章：

    008 | 宝宝怎么社交？家长来引路

    050 | 假装游牧，玩出社交小达人


    # 2. 父母离婚了，如何帮助孩子度过迷茫期？


    我的家庭刚刚经历巨变，我与老公离异，自己一个人带孩子。四岁的儿子，对于父母分开的事情还不是很了解，经常问我问起爸爸，想和爸爸妈妈一起玩，和爸爸妈妈一起去旅行等等。


    每次提问都让我心如刀绞，一方面觉得对不起儿子，让他不能像以前一样享受三口之家的快乐；另一方面又不愿意想起以前的事情。请问，如何帮助孩子安稳度过这一段迷茫的时期？


    Dr. 魏


    听到这个消息很遗憾。离婚不仅对孩子有影响，对你也是。这是一个复杂的问题，不是三言两语能解决的。


    推荐你看这本书《单亲家庭的正面管教》，是正面管教创始人简·尼尔森（Jane Nelsen）的作品。这本书的核心理念是，单亲家庭不是“破碎的家庭”，单亲家庭的孩子也不是注定会失败和令人失望的。有了努力、爱和正面管教养育技能，单亲父母们就能够把自己的孩子培养成有能力的、满足的、成功的人，让单亲家庭成为平静、安全、充满爱的家，而单亲父母自己也会成为一位更健康、平静的父母以及一个更快乐的人。


    祝你和孩子的生活早日回归正轨。


    # 3. 怎么帮助孩子认识时钟？


    怎样有趣地教五岁的宝宝，认识时钟呢？我自己试过教他，但是宝宝听不懂。


    Dr. 魏


    认识时钟的根本目的是为了认识时间，但时间看不见摸不着，怎么办？没错，我们可以借助更加具体、熟悉的东西。回顾过去、立足当下、展望未来——你看，我们是用空间来理解时间的。“回顾”“立足”“展望”，这些词不就表明我们是站在历史长河的岸边，回顾看到的是过去，向前看的是未来吗？我们也会用具体的事情来指代时间，比如武侠小说里就有“一壶茶的工夫”一顿饭的工夫”或者“一炷香的工夫”。


