    # —— 语言脑 ——


    # 知识点：敏感期


    江湖传言2~3岁是学习口语的关键期，4~5岁是学习书面语言的关键期，甚至还有吃饭关键期、画画关键期，如果错过关键期，做父母的就要抱憾终生，因为这意味着错过了孩子发展的机会，输在了起跑线上。


    事实上，科学家不说“关键期”，而是用“敏感期”这个概念来描述孩子最有利的发展期。并且，敏感期的时间跨度也比较长，拿口语来说，并不是某些机构鼓吹的2~3岁，而是可以到7岁。小孩子学母语，他不需要背单词，背范文，自然而然就会学会了，这是语言的习得（acquisition）。而学一门外语，是语言的学习（learning），是费力低效的，要背单词、语法。这是因为，随着孩子的长大，过了语言发展的敏感期，孩子学习模仿语言的能力减弱了。所以，孩子学语言，晚一点不如早一点。


    不过，这不代表7岁后学外语就抱憾终生，只是学起来费力些。好消息是，神经可塑性恰恰告诉我们，可以通过后天训练提升能力。研究表明，玩乐器可以延长语言敏感期。一项跟踪研究发现，让孩子学了3年的吉他或长号之后，他们阅读的词汇量上升了。


    # 应该怎么做？


    +   1. 绘本指读


