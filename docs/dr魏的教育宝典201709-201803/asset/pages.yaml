  md: '# 家长分享｜提升自控力的

    小窍门


    Dr.魏


    本周我系统介绍了提升孩子自控力的方法，明确了自控力是可以培养的，家长要承担起孩子“理智脑”的部分功能，降低诱发条件、建立日常生活规律并做到及时提醒，必要时可以运用适当策略，比如蝴蝶效应、画大饼策略以及冷聚焦策略。


    接下来，我邀请到两位专栏的金牌家长@Liu 和 @龙龙，看看他们有哪些提升自控力的小窍门。最近，在学习小组发现一篇关于宝宝说话问题的家长分享，作者是一位名叫
    @可爱的Q 的孩子爷爷，他把自己教宝宝说话的方法分享出来，给这位金牌爷爷点赞。


    ![](img/bce617503caab4aa8727e0f05b5e6106_0_0.png)


    # | 第006期金牌家长-Liu


    我感到很荣幸能够在Dr.魏的专栏跟大家分享我的育儿经验。


    我对本周主题“自控力”深有感触，尤其是在女儿被超市、玩具店琳琅满目的物品吸引的时候。


    每个年龄段的孩子有不同的认知，具体问题具体分析，要想办法“对症下药”。


    有宝宝前，我在超市偶尔会看到因想要买某件东西，而大喊大闹的小朋友，有的甚至躺在地上打滚，来获取自己想要的东西。当时我一口气心想：还好我现在没有孩子。


    女儿两岁前在超市或玩具店不会索要任何东西，即使喜欢，也就是摸摸，然后离开。为此我特别高兴，觉得女儿从小就懂事。


    # (1) 一次只能拿一个


    时间告诉我，我是错的。随着年龄的增长，她渐渐地被这些货架上的物品吸引，进而她开始学着要东西，买这个、买那个，每次要还不止一个，至少得两种以上，为此我头疼了好久。


    最后，我翻出以前讲过的故事《小熊宝宝》系列里的“一次只能拿一个”，我把这个故事反复讲，反复举例，终于奏效了，她在超市或玩具店“只要一个”，而且爸爸妈妈选择什么，她也会欣然接受。


    # (2) 约定


    在“一次只能拿一个”产生误解的情况下，我想到和孩子去目的地之前，先做好“约定”，比如买什么、不买什么。


    # (3) 互换


    第二种方法也有失效的时候，在这种情况 下，我会采用互换的方法。


    # (4) 积攒印章


    除了第三种方法，我又想了一个办法是“积攒印章”，这个方法我是跟幼儿园老师学的，她们为了鼓励小朋友脱尿片，自己上厕所，就发明了积攒印章的方法。做得好的小朋友可以在自己的卡片上印一个动物或植物印章。


    ![](img/bce617503caab4aa8727e0f05b5e6106_0_1.png)


    # | 第010期金牌家长-龙龙


    很高兴能跟宝爸宝妈们分享一些实践经验，不能说做得很 好，但是对于自控力养成，我确实有一些想分享的心得，希望对大家有帮助。


    叨叨魏说过养孩子中的度的把握，值得我们父母终身学习。对这点我深有体会，以前，我一直跟娃爹开玩笑，我们家这个小妞是管得严了不开心，管得松了能上天。娃听了这话还会问，我又没有翅膀，怎么上天啊（翻白眼表情）。'
