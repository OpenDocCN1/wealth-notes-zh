  md: '你看，我会跟孩子讲清楚我的担心，鼓励她思考，一起来想解决方案。


    再有，运动能力是我特别想强调的一个方面。我发现，有些父母会因为担心而限制孩子的活动。比如不许孩子爬树，不许孩子爬梯子，不许孩子追逐打闹。实际上孩子需要这类身体活动，练习自己对身体的控制能力，扩展身体运动的边界。


    虽然运动时，可能會有磕磕碰碰的問題，但如果因此而限制孩子的活動，造成長期後果會更糟糕。我們需要在保護和支持之間找一個平衡。


    在孩子小時候，你需要關愛他們、保護他們，幫助孩子建立安全感，讓他們知道，不管怎樣出去探險，總有你這個安全港灣會保護他們。但另一方面，你也要鼓勵他們獨自探索世界，有時超出一点安全边界也没事，反而能让他们在真实世界里检验自己的能力，学会应对危险，发展独立性。


    你能给孩子的最好的礼物，是让他有能力自在、自主地生活。


    最后，我想叮叮一下，之前我跟一位家长聊天，她非常羡慕国外的孩子独立性好，说国外的孩子可以独立在社区里卖报纸，也打算让自己的孩子去试试。


    我想说的是，培养孩子的独立性，并不是“让孩子独立卖报纸”那么简单。那些孩子卖报之前，会跟父母一起商定计划，比如路线怎么走，在哪些区域活动比较安全，怎样定价最合适等等。行动的时候，父母也会有保护行动。


    总之，培养孩子独立性不是一次两次活动能完成的事，你要在孩子现有的能力水平基础上，帮他继续扩展，一步一步发展独立思考和独立行动的能力。不忽视，也不激进。


    总结一下，今天我跟你分享了如何培养孩子的独立性，让他拥有独立思考、独立行动的能力。首先你要避免踏入两个育儿“大坑”：第一，父母的手伸得太长、干涉过多；第二，把孩子强推出去，不提供丝毫帮助。


    其次，你需要在保护和支持之间找到平衡，根据孩子发展的不同阶段，解决每个阶段的主要冲突，尤其要注意在孩子3岁~6岁的独立性培养关键期，多给他选择权，允许他表达喜好、自己做决定。


