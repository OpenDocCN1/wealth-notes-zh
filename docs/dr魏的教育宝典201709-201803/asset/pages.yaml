  md: '# 084 | 聪明的标签不重要，多元思维更重要


    084 | 聪明的标签不重要，多..


    Dr.魏


    用指纹测智商，靠谱吗？


    我们在专栏里面以来，你会不会觉得我变成打假专业户了？时不时有家长问我，这个靠谱吗？那个科学吗？特别让我有感受的是，家长越着急，越有可能被这类谣言蒙蔽双眼。最后，轻则损失钱财，重则影响孩子的健康发育。


    粗略算一下我们一起破除的伪科学有左右脑、记忆术、杜曼闪卡、蒙眼识字等等。


    上周又有家长问我，皮纹检测能不能测出孩子的多元智能？所谓皮纹检测，就是宣称测测孩子的手纹，就能了解他的八种不同的智能，比如语言智能、音乐智能、运动智能等等。


    我看到这个问题，心情变得很复杂。不是因为问题太难，而是因为这个问题的本质是在问：能不能用一个伪科学概念，来检测一个得不到实证科学支持的概念，是否正确，这当然不靠谱。


    皮纹测试不靠谱，指数和细胞没有因果关系


    首先，皮纹测试是伪科学。据说让孩子按按手印、脚印，然后靠一些所谓高级的仪器分析手脚的纹理，就可预测孩子先天智能和后天优势。


    你有没有感觉到，这简直是高大上版的看手相算命？这些机构还宣称，根据人十个手指上那些凸起的像指纹一样的纹路，也叫做脊纹数，它们的总数乘以一亿，就代表这个人细胞细胞的总量。


    听起来是蛮神奇的，可是并没有科学研究证据支持这个说法。指纹和细胞不存在因果关系。美国国家科学院早在十几年前就已经质疑过皮纹测试的科学性了，我们无法用皮纹预测智力，更别说潜力了。


    多元智能只是被广泛接受的个人观点


    说完了皮纹测试不靠谱，那“多元智能”又是咋回事呢？


    多元智能由哈佛大学的心理学家常华德·加德纳（Howard Gardner）提出，英文是 Multiple Intelligences，英文直译是“多元智力”，不过国内普遍叫多元智能，为了防止混淆，我这里也统称为智能。


    加德纳认为人有八大智能，后来又建议再加两个智能，我就不一一列举了。多元智能在教育界有很大的影响力，但是我要强调一点，它只是一个被“广泛接受”的个人观点，并没有得到主流科学界、心理测量界的实证支持。


    所以你看，怎么能用一个皮纹测试这个伪科学概念，来测量一个得不到测量界支持的概念呢？下次看到这种宣传“指纹能测多元智能”的机构，你还是赶快远离吧，肯定不靠谱。


    多元智能理论缺乏认知神经科学的实证支持


    虽然指纹测多元智能不靠谱，但你可能听到过，很多机构信奉多元智能理论，单看这个理论，又如何呢？首先我们要回到1983年，那时候认知神经科学刚刚诞生，一般的“IQ智商”测试只测试一些抽象思维的能力。


    这时候，加德纳跳出来说，不能单纯智商测试来判断一个人所有的智力，人有八大智能，多元智能理论就这样诞生了。他认为智商测试只能衡量一部分数学校需要的智能，比如数学、逻辑等，但不能测量你在其他领域的智能，比如音乐和运动智能。


    而且，这八种智能是独立存在的，如果你一种领域表现差，没关系，用其他领域补足就好了。


    这种说法当时就引起了轰动，人们一听，原来任何人都能成为某个领域的聪明人，那就算是我智商测验比你低也没有关系，我们还是可以达到某种意义上的平等，这就产生了很大的社会影响力。可惜，多元智能理论虽然听上去十分激动人心，但它还是缺乏认知神经科学的实证支持。


    接下来我会一一破除你对多元智能的误解，并且，给你真正符合认知科学的几条“聪明”建议：


    # 1.智力分八种？不靠谱


    我给你的第一条建议：如果打算给孩子做多元智能测试，测测他的八种智力，那就不要浪费钱了。如果已经做了测试，那么测试报告的结果看看就好，不要过于相信。


    加德纳把智力分成八种，但他不是通过研究的行為来确定的，而是他自己的价值判断“我认为应该有八种智能”。比如，实际上没有音乐智能这种智力，这只是加德纳主观认定的。在以数据分析为基础的科学界，加德纳的理论就特别不受待见。


    这个理论等了23年，到2006年才等到第一篇科学研究来检验它的正确性，结果还是不支持。


    虽然，多元智能理论不被主流学术界支持，但在教育界，多元智能理论却傍身做了主人。这个理论引进了30多年后，我们仍然能在全世界范围内看到他的影响力。


    以往的学校只重视语言和数理逻辑的培养，忽视了运动、音乐、社交力的培养。但加德纳认为多元智能可能比传统的“学术”智能对孩子的成功更重要，这让学校教育也开始重视这些能力的培养，开始认为“学校应该传授八种智能”。


    而且，有些学校开始实行个性化教育，用不同的教学方法教不同的孩子，从这点上看多元智能对教育是有实践意义的。


    把智力分成八种是教育上有效的分类方法，在短时间内可能利于一些教学实践。但是，对于认知科学和脑科学来说，智力实际上不能这么分，多元智能的测量恰恰不能预测孩子的学业表现。长期来看，错误的理论反而会误导教育者。


    # 2.没有多元智力，但有多元的思维方法


    第二点，没有多元智力，但是有多元的思维方法。加德纳认为智能和智能之间相互独立，每个孩子有不同的智力风格，比如音乐型聪明的孩子、运动型聪明的孩子。


    一些受到多元智能理论影响的课堂，首先会测试孩子是那种智力类型，然后根据他们“特别的思考过程”定制不同的教学方案。比如，对于音乐型聪明的孩子，老师就给他们用音乐的形式来讲数学课。这听起来很个性化，但其实是靠不住的。


    神经科学的研究显示，八大智能是相互联系的。比如，一个人的语言智能比较高，他的音乐智能也会比较高。认知神经科学家研究了多元智能中提到的音乐智能、运动智能和情绪智能等在大脑中的处理途径，发现不同智力之间的神经通道有很大的相关性，它们在神经基础上有很多的重叠，甚至有类似的神经运作机制。


    所以，我们不能因为孩子在某一个维度上的能力比较出众，就只利用那个维度学习。与其花大功夫为他定制一种学习风格，不如让他学习多元的思维过程，这样才能从整体上强健孩子的大脑。


    我来具体解释一下什么是多元的思维模式：


    比如，你想教会孩子“美国”的概念，可以用多元的方法来教，给孩子看美国地图，听美国的乡村音乐，吃美式的汉堡，玩一玩美式橄榄球。每一个不同角度的学习，都可以帮助孩子做一次思维的转换，还有助于他们再次集中注意力。


    如果你发现孩子这次的作业是做数学题，要用到大量的逻辑、推理等比较严谨的思维模式，你可以给他换换脑子，加一些画画的任务进去，帮他用创新的联想性思维游戏平衡一下。


    再比如，如果你发现孩子要参加问答竞赛，这是需要快速应答能力的，也不要只给他训练答题速度，帮孩子跳出时间限制的框框，也让他做一些有时间深度思考的训练，跟他一起思考每个答案后面的意义是什么。


    # 3.聪明的标签，没那么重要


    最后一点，也是我今天最想强调的一点：我们不应该对“智力”“聪明”这类词语过于强调。'
