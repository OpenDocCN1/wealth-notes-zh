    # ——► 第45期思考题 ◄——


    Dr. 魏


    今天的思考题是：你在给孩子读绘本的时候，用过哪些小妙招帮助他提升语言能力，欢迎分享！


    第44期金牌家长：蚊蚊


    上期的思考题是：谈谈你被什么不理性的育儿思维影响过，44期金牌家长我颁给@蚊蚊。


