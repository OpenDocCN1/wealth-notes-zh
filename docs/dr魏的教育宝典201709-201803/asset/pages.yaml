  md: '# 125 | 读者问答：父母育儿观念不一致怎么办？


    Dr. 魏


    下周我将带你重新认识“考试”，以及帮你解决一个问题：如何提升孩子的认知灵活性？


    首先，会跟你一起探讨对“考试”的看法：别再 monuments 考试了，它是孩子学习的好工具！你觉得怎样学习，效率比较高？是多学几遍，还是多考试几次？研究发现，对于同等时间的重复学习而言，进行提取练习的考试学习，可以让学生的表现更好。在日常养育的时候，怎么给他适当的“考试”，帮助他学习呢？


    其次，如何提升孩子的认知灵活性呢？如果你家宝宝容易受挫，玩游戏稍微难一点就放弃；如果你家宝宝作业经常完不成不了，觉得答得不够好就脏就不写……这些问题，可能是宝宝的认知灵活性不足导致的。如何提高宝宝的认知灵活性，让他能够解决生活中的新问题？下周告诉你。


