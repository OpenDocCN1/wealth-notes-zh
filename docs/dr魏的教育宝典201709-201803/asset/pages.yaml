    # ——► 本周问答时间 ◄——


    魏蜀吴明爸妈一起解决5个问题


    +   1. 为什么说右脑开发是伪科学？

    2. 如何引导孩子不打人？

    3. 家长情绪失控怎么办？

    4. 有没有让孩子安静写作业的好方法？

    5. 孩子出现打人等暴力行为怎么办？


    # 1. 为什么说右脑开发是伪科学？


    《未来简史》作者赫拉利认为人类大脑分左右脑，并且分别负责身体的不同部位，而他批判右脑开发是伪科学，让我有点困惑，希望叨叨魏能解答一下。


    Dr.魏

    我在专栏里一直强调右脑开发是伪科学，这和人类大脑分左右脑是不矛盾的。

    虽然左右脑在某些功能上各有专长，这个叫大脑的侧化，英文叫lateralization，可是左右脑的功能都是彼此前后连贯、运作顺畅、互相依赖的，左右半脑的差异很小，在某些功能的专业分化上，不是绝对的。

    实际上，一半脑几乎可以操作另一半脑大部分的工作，比如，右脑可以做一些语言处理工作，也可以理解语意。

    而且，人脑有可塑性和惊人的修复能力，如果某个半脑受到损伤，另一半脑可以立刻接棒去做该半脑无法完成的任务。

    举了例子，研究表示，当孩子的语言脑区损伤，其他脑区会立刻加入工作，对受伤的半脑进行补偿，也就是我反复说的，大脑的可塑性。

    右脑开发者们声称“95% 以上的人，仅仅仅使用了左脑”，这句话并无科学依据。大脑是“用电大户”，它的重量尽管只占我们身体的2%，却要消耗高达20%的身体能量。

    也就是说，养着一半大脑不用，是没有进化优势，要被淘汰的。

    科学家们用大脑成像技术，比如正电子发射断层扫描（PET）和功能性磁共振成像（fMRI），来监测大脑的活动。结果显示，就算是xia在睡觉时，或什么事都不想、不做，大脑也有
    activated 的活动。

    所以说，右脑开发是伪科学，但和大脑分为左右脑是不冲突的。


    # 2. 如何引导孩子不打人？


    看到这篇文章的时候，我已经困惑很久——如何正确引导孩子不打人。

    孩子今年上中班，在小班的时候经常被同学欺负，从还手被我们批评和每次习惯性的道歉，到不动手瞪眼睛大声吓退对方，再后来他养成了只要有人碰到他，就立刻告诉老师，结果就是小朋友们都不爱和他玩。

    我很认真地和他一起分析了他的问题，开始这几天他回来ḥ：”妈妈，我改了缺点，他们怎么还不和我玩？“很着急。我一直想不通是不是在教育孩子上，哪个环节出了问题？


    Dr.魏

    首先，你说孩子“上小班的时候常被同学欺负”，其实在幼儿园，这种情况是非常少见的。很可能是在孩子对“欺负”的认识有偏差，以为别的小朋友不小心碰到他了就是欺负人，排队不小心推了他也是欺负人。

    你可以问问他：”宝贝，什么叫做欺负人？“然后再帮助他定义什么是“欺负”，告诉他一般小朋友都不会故意“欺负”别人呢，大家都想开开心心的玩耍。

    你可以跟他模拟几个场景，你当不小心碰到的小朋友，然后你告诉他在这种场景下，孩子应该怎么反应，才可以让大家都开心。

    学习和同伴相处是一个长期的过程，宝妈不要着急，给孩子时间试错，总会找到合适的方法。


    # 3. 家长情绪失控怎么办？


    我最苦恼的不是孩子的问题，而是自己的情绪把控不好。如果自己能在平和心态下处理孩子的问题也会处理得相对很好，自己平时也很注重对育儿方面的学习。

    但自己情绪不好时，处理方法就简单粗暴。大儿子现在两岁，二宝刚满月，我每天都会吼大宝，还会因为他个别行为而恼火失控，明知道自己这样是非常糟糕的，会带给孩子的不好影响，可是越想控制，越焦躁。

    我该怎么办呢？


    Dr.魏

    我在专栏发表过，养孩子是一件超级复杂的事情，对家长是极大的考验。没有对孩子发过脾气的家长，恐怕还找不到。关于控这情绪这个话题，我会单独用一期的时间跟你聊一聊。今天和你简单分享一些方法，救"近火”。

    先来分享第一个方法：写情绪日记

    每天花十分钟时间，记录自己发脾气的情况，看到底哪些事情把你引爆了？赶时间？孩子却拖拖拉拉，迟迟不睡觉？还是你在照顾二宝，大宝在旁边磨蹭？再比如身体不舒服、睡眠不足等，都容易让你失控。记录下这些事件，下次要失控时会有所准备，及时提醒自己。

    第二个方法：暂停3分钟

    当你要失控时，你就像是一台进入自动模式的机器，情绪脑占据主导地位。这时候记得要抽身出来，及时告诉孩子：”我现在很生气，我要去冷静一下。”

    打断这种情绪脑主导的自动模式，你可以去洗手间，洗把脸，深呼吸几次，等情绪脑冷静，理智脑恢复，再跟孩子沟通。

    影响你情绪的往往不是事件本身，而是我们的解读。换个角度看待孩子的行为，可能就会发现他不是故意跟你作对，而是另有原因。

    第三个方法：及时修复关系

    拿我自己举个例子：有时我会对女儿发脾气，事后会告诉她，我发脾气当时的感受，我是怎么想的，以及事后的感受。

    很多时候，我们生气的背后是对孩子的担心、失望。重新表达你的关心，不要指责。就是我们通常说的亡羊补牢，未为晚也。用这样的方式教育孩子，他可能会和你一起发散思维，想出一些避免日后产生冲突和后悔的好办法。


    # 4. 有没有让孩子安静写作业的好方法？


    我家宝宝4岁上中班，回家写作业，总是东看一下西看一下，小屁屁这里扭，那里扭，嘴里不停地发出声音，没有一次是安安静静把作业写完的。这该怎么办？


    Dr.魏

    孩子好动一些是正常的，安静写作业是一个需要学习的过程，不要着急。

    第一，减少周围环境的干扰。关掉电视、收起玩具，大人切记在孩子旁边聊天、刷手机。你可以在他旁边看书，需要时给他帮助。

    第二，借助计时工具提醒。孩子没有时间概念，安静写作业他也会觉得时间很漫长，坐不住。不如把时间分块，每次写10-15分钟，专心写。借助闹钟或沙漏来提醒，休息几分钟，然后再写。相对一口气写半个小时，分开做孩子更容易做到。

    第三，当孩子有所进步时，切记及时给予他肯定。


