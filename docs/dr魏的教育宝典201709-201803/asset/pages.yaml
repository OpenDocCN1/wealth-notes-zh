    # 2.孩子的瞬间记忆力不足怎么办？


    小朋友在幼儿园中班期末测评的瞬间记忆题目中全部失分了。我分析是因为孩子一直纠结在第一个指令上，没能继续听第二个。一个长句子，小朋友只能记住前半段，听不进后半段。请问怎么提高孩子的瞬间记忆能力呢？


    Dr. 魏


    有两个可能的原因供你参考。第一个原因是孩子对听的内容加工比较慢，听了上半句，就没有精力去想下半句。大人也可能会遇到这种状况。比如我们做英语听力题时，内容太多，一下子记不住，只能快速做笔记，写一些关键词。


    但让中班的小朋友做笔记不现实，你不如平时和她做一些练习。比如把老师的题目拿过来，你念一遍，看她能记住多少。根据她的能力调节难度，先从短一些的句子开始，然后再记长一些的。


    之前讲解记时，我提到一个小技巧，可以对信息进行拆分。比如把11位的电话号码拆成4-4-3，就变成3块了，会更好记一些。句子也一样，比如拆成主谓宾结构，一个词组一个词组地记，而不是一个字一个字地记。


    第二个原因是孩子的注意切换能力可能还需提高。比如我们听课的时候，一边听老师讲，一边看课本，注意力就在它之间切换。


    要锻炼这种能力，平时你可以试试跟孩子玩找茬游戏，常见的是在两张类似的图片中找不同。你也可以给她念句子，同时念两句，第二句是在第一句上做一些小小的改动，让孩子找出这两句话的差别在那里。一开始是短句，然后逐渐变长，给孩子增加难度。


