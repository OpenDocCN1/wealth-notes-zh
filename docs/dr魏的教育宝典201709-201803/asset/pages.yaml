    怎样跟孩子聊情绪？


    第一，孩子有情绪的时候，你可以有意地教孩子说相应的词汇：“很生气，很开心”。孩子会知道，原来这些不同的感受都是有名字的。等孩子再大一点，鼓励孩子自己表达出情绪，这比只是安慰孩子更有利于培养他的同理心。


