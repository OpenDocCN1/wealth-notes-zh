  md: '# 088 | 读者问答：父母与孩子长期分离，怎么办？


    088 | 读者问答：父母与孩子..


    # Dr.魏


    彩蛋预告


    10月1日（周日），记得准时来专栏，我为你准备了一份亲子出行攻略，假期出游，是提升孩子情绪自控、空间认知等能力的/selection, 具体怎么做, 欢迎10月1日咱专栏里找答案，收藏一份亲子出行备忘录。


    十一期间，我会继续跟你分享健康饮食、预防近视等话题，不要错过。


    # ——► 本周问答时间 ◄——


    +   1. 不打骂不惩罚，能培养出优秀的孩子吗？

    2. 父母长期不在家怎么办？

    3. 孩子说狠话，是不是有暴力倾向？

    4. 如何向孩子解答童话故事的真实性？


    # 1. 不打骂不惩罚，能培养出优秀的孩子吗？


    Dr.魏，一直阅读您的专栏，也很赞同您的育儿理念。今天偶然看到一篇文章《复旦教授钱文忠：不打不骂不罚是培养不出优秀孩子的》，其中提到了英国、新加坡一些关于体罚的例子，与您一直提倡的理念有些不一样。还希望魏教授能帮忙解惑。


    # Dr.魏


    在育儿路上，一千个家长有一千种见解。但为什么我极力给大家推崇科学的育儿理念和方法呢？因为它是经过严格验证、不断更新迭代的。


    通过科学，你可以认识到孩子容易发脾气是因为理智随发育缓慢，你可以认识到识字不会破坏想象力、你也可以认识到阅读障碍给孩子的学习带来挑战。这是科学家的群体智慧，不是个人所能发现的。


    看到你的提问后，我去查阅了这篇文章，钱文忠教授在文中提到“教育绝不仅只是快乐的，学习绝不只是快乐的！”这点我同意，但科学是 我判断的唯一标准。


    众多科学证据已经表明，打、骂、罚不是教育孩子的好方式。发脾气怎么办？有情绪结如何处理？如何提高专注力？这可不是打一顿、骂一通、罚抄几百遍“我错了”就能解决的。


    在手里拿着铁锤的人看来，世界就像一颗钉子。我希望你的育儿工具箱里，不止有打、骂、罚，还有更多科学的育儿知识。


    社会本身是残酷的、危险、攻击、中伤往往来自不可预测的外部环境。孩子慢慢成人，开始接受残酷世界的洗礼，最终能支持他从受创中恢复，鼓励他在残酷现实中拼搏下来的，恰好是无条件爱他、接纳他的人，是最安全、最柔软的地方。我想说：但愿那个人是你、那个地方叫家。


    # 2. 父母长期不在家怎么办？


    叮咚魏，您好，我一个关于小孩子思想观念教育的问題想请教您。现在有不少家长是在外工作，没有和小孩在一起的。小孩长大了，就会问爸爸妈妈去哪了，家里长辈习惯性回答爸爸妈妈出去工作了，去赚钱了，类似的话。我有个朋友就很反驳这样说，认为会让小孩觉得工作，赚钱比他更重要，从而影响未来他对工作、赚钱的观念。虽然自己也觉得观点有点偏激，但也觉得不无道理，想请魏老师帮忙解惑一下。


    # Dr.魏


    早起开门七件事，柴米油盐酱醋茶。你看，每天的开销都离不开钱。出去赚钱，最终的目的 是为了养家，养娃。但在孩子眼中，他看到的是爸爸妈妈不在身边，而不是爸爸妈妈在外的辛苦打拼。他不是感恩，而是埋怨。所以，如果孩子问，爸爸妈妈去哪儿了。你除了告诉他，他们去赚钱了，也记得跟他解释，他们是在为这个家赚钱。你吃的那饭、水果，手里的玩具，身上的衣服，都是用爸爸妈妈赚的钱买的。但比说什么时候更重要：做什么。对于长期不在家的父母，我给你两点建议：


    第一，陪伴质量比时间更加重要。在跟孩子见面的时间里，不要因为觉得陪孩子少对不起他就给他太多的物质补偿，让亲情变味。多和孩子玩，比如给他读绘本讲故事、玩玩具、聊天，在轻松愉快地互动中拉近彼此之间的距离。


    第二，出门在外尽量可能跟孩子电话、视频沟通。由于你在外对孩子情况了解少，常常无话可说。这时候你可以事先跟另一半了解孩子的近况，比如孩子喜欢什么故事，什么儿歌，最近发生什么趣事，那么沟通的时候就比较顺了。


    # 3. 孩子说狠话，是不是有暴力倾向？


    我家大宝3岁了，有时候玩具被小宝拿走了，会冷不丁地说，“我要杀了他！”，他是不是有暴力倾向哟？


    # Dr.魏


    孩子说“狠话”，千万不要觉得这就是有暴力倾向，给他贴上一个“凶狠”的标签。你注意观察就能发现，其实孩子大多数时间是喜欢兄弟姐妹的。


    说狠话，甚至真正使用暴力，是因为孩子不知道怎么解决問題，不知道怎么处理情绪。归根结底，你要帮助孩子正确表达自己的情绪，学会处理与他人的关系，学会解决人际冲突问题。家是有爱的地方，也是最适合孩子学习这些技能的地方。


    另外，如果孩子常看有暴力成分的动画片，也容易说“狠话”。需要注意帮孩子挑选合适的视频内容。


    # 4. 如何向孩子解答童话故事的真实性？


    Dr.魏，孩子在读完童话故事，比如阿里巴巴和四十大盗，就常问我这是不是真实的？还有一些迪士尼动画里 的故事，他也经常这样问我，我该怎么回答？


    # Dr.魏


    你家孩子对童话故事的真实性问题，恭喜你，他的认知能力又上了一个台阶。


    小说《魔戒》中有一句名的话，我跟你分享下：历史变成传说，传说变成神话。这个呢，就是说明故事是真实和虚构的结合体。至于哪些是真，哪些是假，恐怕难以说清楚。


    你不如坦诚地告诉孩子，我也不知道哪些是真的，哪些是假的。要不，我们来玩个游戏，从故事里选一个点，判断它是真还是假，然后说说理由吧。只要言之成理就就行，这是引导孩子思考、发现的好机会，不要错过啊。


    # ——► 本周家长分享 ◄——


    # Dr.魏


    这周一，我分享了怎么科学培养孩子的“情商”。情商最重要的一方面是同理心，也就是换位思考、感同身受的能力。宝妈@刘永志分享了她家孩子如何使用同理心，化解了爸爸一个玩笑带来的尴尬。而孩子的同理心，离不开爸妈日常生活里的引导。看看她是怎么做的吧。


    # 家长@刘永志的完整分享


    我分享一个我家孩子同理心的小例子，我家孩子三岁，有一天我们外出经过冰激凌店，孩子爸一时兴起说：把你妈妈卖了，换三个冰激凌吧。我儿说好啊！妈妈你快去买，听到前半句，我心都凉了，可听到后半句，我才知道，他没理解爸爸的意思。


    我就跟孩子解释，“爸爸说把妈妈卖了不是让妈妈去买，是说把妈妈卖给别人，换一个冰激凌，妈妈被卖了之后，你就不能和妈妈在一起了。”小朋友眼睛一亮说：“哦，爸爸不要吃冰激凌了，冰激凌是垃圾食品，吃多了不好...”。


    孩子这样说，让我和孩子爸爸很吃惊，没想到他小小年纪可以把这件事情这样处理，既解决了妈妈不要被卖掉，又打消了爸爸吃冰激凌的念头。


    在孩子情商培养这方面，我认为同理心这点很重要，明确自己的需求、体会别人的感受，才能做出既保护自己需求，又不伤害他人的行为。'
