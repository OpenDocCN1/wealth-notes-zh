  md: '# 096 | 如何培养孩子的同理心，让他更善交际？


    Dr.魏


    你会跟孩子聊自己的情绪吗？

    我上个月出差，坐高铁。在我旁边，有个不到一岁的小宝宝。刚开始他玩一会儿、睡一会儿，挺好的。可是，一两个小时后，不知道为什么，他开始放声大哭。

    这时，过道那边有一个三四岁的小姑娘跑过来，我以为小姑娘是嫌小宝宝吵。没想到她奶声奶气地对小宝宝的妈妈说：“他哭得很伤心。他饿了，你给他喂奶吧。”这句话把旁边的ш全都逗笑了。车厢里的人夸小姑娘懂事，是个“暖宝宝”。我对小姑娘的家人说，你家孩子同理心真强。


    有同理心的孩子能感知、理解别人的情绪，做出恰当的反应。你看，这个小姑娘首先能感受到小宝宝的情绪，认识到这是伤心；然后，试图理解这种情绪的来源，是因为饿了；最后，她提出相应的解决方案，给宝宝喂奶。所以我夸她同理心强。


    心理学家认为，同理心是社会交往的基础，也是道德感的源头，调节人际关系、协同合作都少不了它。我们不是经常说要培养孩子的情商吗？虽然我不大喜欢情商这个说法，但是同理心是人的重要的情绪能力，它是孩子好性格，甚至孩子将来人生幸福的重要推动力。你想不想要一个“暖宝宝”？一起来学习，培养孩子的同理心吧。


    # 同理心与人类社会的社会性相关，对人际交往有帮助


    我们人类天生有社会性，会与其他人打交道。同理心是深埋在我们本性中的能力，是人与人的情绪连接。同理心意味着你看到别人当时的情绪和处境，就经历跟他相同的感受，而且，你能意识到自己的这种情绪是源于那个人的情绪状态。


    这话听起来可能有点绕，我举个例子你就明白了。你走在路上，看到一个人骑车摔倒了，你可能会感觉到愤怒和疼痛——“哎呦痛死了，真倒霉！”还有些惊张、着急——“好夫人啊。”这是你在经历跟他相同的感受。


    你有这些感觉是因为他摔到了，他在那种情境下很可能有这些感觉。接下来，你有一种想要去扶他起来的冲动，你想解决这个问题，消除这些负面感受的来源。


    大脑成像结果发现，人类产生同理心时，激活了不止一种大脑网络，包括与情绪相关的脑区、与社会认知相关的脑区、与注意相关的脑区等。


    一方面你的杏仁核在活动，有可能感受到愤怒悲伤等情绪；另一方面你的前额叶也在活动，你会分析在这情况下会发生什么事，思考可以怎样应对当前的情况。所以，同理心并不是一种孤立的能力，而是与感觉、注意、执行等能力相关连。


    # 多大的孩子开始有同理心


    有一组科学家做了两个实验，一个是给一批8个月到16个月大的孩子播放别的孩子哭的录像，看看他们有没有表现出同样悲伤的反应；另一个是去这些孩子家里，让妈妈假装腿被碰到或手指被砸到，看看孩子有没有情绪反应，会不会去帮助妈妈。


    他们发现，8个月大的孩子就能感受到别人的情绪，16个月大的孩子更有可能去帮助妈妈。


    有科学家认为，孩子1岁到3岁之间，同理心有一个迅速发展的过程。在这个阶段，孩子主要的社会交往对象是照顾他的人，妈妈、爸爸，或者是爷爷、奶奶等。所以，早期亲子互动模式，在孩子的同理心发展过程中起到了关键作用。


    说了这么多，我们当爸爸妈妈的，可以怎样培养孩子的同理心呢？科学界普遍相信，模仿是孩子学习情感反应模式的重要途径。在孩子小时候，父母就应该积极敏感地回应孩子，鼓励孩子体验他人的情感、站在他人的角度思考问题、鼓励孩子有善意的行為。下面，我来告诉你具体的做法。


    前面我说过，有同理心的孩子会感知别人的情绪，理解别人的情绪，并对这种情绪做出恰当反应。虽然小宝宝就已经能感受到别人的情绪，看到别人哭他也想哭，看到别人笑他也乐，不过要能理解和分析情绪发生的场景，要做出恰当反应，还是需要更多的经验和学习。


    +   1. 家长给孩子做示范


    首先，身为家长，你自己要有同理心。你跟孩子相处的时候，理解和尊重孩子的感受和情绪，站在孩子的角度思考问题。


    比如说，孩子想吃糖，你不肯给，孩子哭闹。一种方式是跟孩子说：“有什么好哭的，不就是一颗糖吗？你哭也没用，别以为你哭我就能答应你。”

    还有一种方式，是跟孩子说：“你现在很伤心，因为你想吃糖果，我不给你，对吗？我现在不在给你吃糖，是因为你今天已经吃够两颗了。你可以明天再吃糖果。现在，先吃一个香蕉怎么样？”第二种方式，孩子更能接受一些，因为你理解他的感受，而且提供了替代方案。


    爸爸妈妈跟孩子沟通的时候，要注意避免两个常见的问题：第一，不要去推测孩子的动机，比如说，“你以为你哭我就答应你？”而是真正理解孩子情绪的表达，会说：“因为我不给你想要的东西，所以你伤心。”


    如果你不知道原因，就问问孩子：“为什么这么伤心呢？”如果孩子不说，那你只描述和接受孩子当时的情绪，也可以，“你哭了，很伤心啊。来，我抱抱你。”


    还有一个，不要否认或故意忽视孩子的情绪。比如说，你下班回家，看到孩子在地板上坐着流眼泪，有两种处理方式，一种是问孩子：“你怎么了？不开心吗？发生什么事？”另一种是跟孩子说：“哎呀，哭什么呢，别伤心了，看我给你买了新玩具！”你从孩子的角度想想，哪种回应更合适？


    你是孩子的模仿对象。孩子能模仿你的表情，你说的话，你的动作，你的情绪，以及你对情绪的反应，这些都是同理心的基石。


    +   2. 多跟孩子聊情事


    正常人天生都会有情绪，但要识别和用语言命名情绪不是一件容易的事，识别别人的情绪更难，需要解读非语言的符号，比如表情、动作之类。经常跟孩子聊一聊，能帮助孩子解读情绪。


    有一组科学家发现，宝宝在两岁左右，在日常生活对话中，会大量使用一些描述感受和情绪状态的词，比如：“痛”“妈妈生气了”“怕怕”等。28个月的宝宝，已经可以部分分析情绪的因果关系，比如“
    我抱着爸爸，爸爸高兴。”


