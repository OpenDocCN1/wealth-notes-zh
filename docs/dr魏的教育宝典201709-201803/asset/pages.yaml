    Dr.魏


    下周我集中帮你解决两个问题：批判性思维培养，以及父母如何理性育儿


    下周一我会谈谈如何在亲子阅读，以及日常生活和玩耍时，鼓励孩子批判性思考问题，引导他们用实验方法去验证推理。


    本周我分享了STEM教育，提到STEM教育的核心，是培养孩子科学的思维方式和学习方法；讲到“元学科”的概念，就是侧重于培养孩子对学习本身、对思考本身进行思考。


    下周三我将继续深化STEM教育，从育儿育己的角度谈谈，如何做理性的父母，提高理性促进剂，降低理性抑制剂，避免育儿路上形成色色的“坑”。


    # —— ◈ 本周问答时间 ◈ ——


    +   1. 遇到恶劣的老师，孩子如何保护自己？

    2. 二宝争抢玩具，如何处理？

    3. 怎样给孩子挑选玩具？

    4. 孩子爱用好人、坏人来评价爸妈？

    5. 健脑游戏适合孩子玩吗？

    6. 老人纵容孩子抢玩具怎么办？


    # 1.遇到恶劣的老师，孩子如何保护自己？


    相信最近一定有一段视频在你的朋友圈刷屏——揪亲子园老师虐童。如果不幸，自家孩子遇到视频里那样的老师，该怎么办？如何教孩子保护自己？


    Dr.魏


    我的朋友圈最近也被虐童事件刷屏了。幼儿园打骂孩子，给孩子喂安眠药、吃夸末的行为，着实令人气愤。理智想想，我们可以怎样最大限度地降低孩子遇到这种伤害的风险呢？


    +   1. 给孩子挑选合适的幼儿园，从源头上规避风险。

    第一步是查看办学资质，是否合格。老师是否有资格证。一个老师带多少孩子，决定老师花多少精力在孩子身上。教育部要求师生比是1:5到1:7，而这次出问题的亲子园是4个老师管100个孩子。

    第二步看口碑，像我们吃点外卖要看点评，选幼儿园可以问问周围已经上幼儿园的孩子家长，作为参考。

    第三步是亲自到幼儿园看看环境，老师和孩子的互动情况尤为重要，相信你细心观察，园区的优劣自会下判断的。还有一点是看有没有监控设备，如果是可以看在监控的幼儿园，更好。城市里犯罪率日益下降、司机不敢胡乱开车，布满各个角落的摄像头功不可没。心有畏惧，才不敢肆意妄为。

    2. 每天了解孩子的情况。多跟孩子交流，既关心他在幼儿园的开心事，也留意他的负面情绪。是不是每次提到要去幼儿园，就特别lt拒，是不是害怕某个老师。偶尔不想去，或者一两次对某个老师有情绪，问题不大；但是如果是经常性的，那就是警惕了。

    3. 如果不幸，孩子遭遇老师的虐待，应该怎么办呢？如果情况轻，大人的关爱、支持可以让他比较快地恢复过来，你可以看看咱们在第87期讲过的韧性这个概念，指的是抗压比较强。

    这种能力帮助孩子去除消极的经历。如果情况严重，孩子持续情绪不稳定、行为絮乱的反应，要及时咨询心理咨询师，寻求专业的指导。家长做到情绪稳定也很重要，避免给孩子带来二次伤害。


    # 2.二宝争抢玩具，如何处理？


    我家宝宝，一个5岁一个2岁，每天因为抢东西吵闹。大x抢小的，小x的无力反抗只能哭，所以我们经常批评大宝，维护小宝。如果要保护大宝的所有权意识，就是先占先得，那家里玩具大部分的玩具都会变成大宝的，即便是给小宝买的，大宝也会要抢走。

    那么对小宝来说是否不公平？小宝长期忍受缺失有利于成长吗？是否会养成懦弱的性格？


    Dr.魏


    家有二宝，争吵吵闹难以避免的，我们能做的是尽量帮忙减少他们之间的矛盾。有两个孩子是有优势的，因为他们有很多冲突的时候，你的教养方法可以快速地测试，得到反馈。因为抢东西吵闹也一样。

    要保护孩子的所有权意识，其实是有前提的。比如说这个玩具确实是大宝的，他才有所有权。先占先得适用于所有权不明确的情况下，比如幼儿园里的玩具。所以，如果玩具是小宝的，那么大宝先抢到，是侵犯了小宝的所有权，对小宝来说是不公平的，这一点咱们家长自己要界定清楚。

    你不妨这样做：开个家庭小会议，理清所有权。哪些玩具是大宝的，哪些是小宝的，一家人们达成共识。一旦发生纠纷，有理可依。这是大宝的，小宝你想玩，得经过哥哥同意。大宝呐，你也一样，想玩弟弟的玩具，得先问他。这才是保护所有权。

    对于二宝都非常喜欢，给谁都会闹的，不妨再买一个，花些钱消除潜在冲突，值。


    # 3.怎样给孩子挑选玩具？


    女儿11月底满25个月。现在能自主玩角色游戏，如扮演医生角色。能对一些生活物件简单想象，如把妈妈的发卡戴在脖子上当做听诊器。

    一次，妈妈随手抓来毛线和哨叭玩具上的吹嘴，简单组装成听诊器，孩子玩得不亦乐乎。从孩子年龄上说，进行角色游戏是最好的社会情绪体验，要极力配合孩子，提供一些游戏道具，另一方面，借物件产生想象，是极珍贵的能力和习惯。

    我有个疑问，到底是买现成的玩具好，还是鼓励孩子借已有材料想象好？


    Dr.魏


    选玩具没有绝对，但正如你所发现的，玩具和孩子的语言、想象力发展大有关系。有研究发现，孩子玩声光电玩具时，注意力会被玩具强烈的刺激所吸引，和大人的交流，以及创新的玩法比较少。建议这类玩具少买一些。

    1岁半到6岁的孩子，最喜欢的游戏是假装游戏。把发卡戴在脖子上当做听诊器，就是假装游戏的表现。假装游戏对孩子的语言、想象力大有好处。

    对于2-3岁的稍小宝宝，可以多用仿真玩具，比如娃娃、扮家家酒的厨房玩具。但也不要过于精细，比如娃娃的角色、表情都十分明显，孩子就没有发挥的余地了。这就像是中国古代的山水画，要适当留白，才有想象的空间。

    对于4岁宝宝，既有仿真玩具又有非仿真玩具比较好。

    对于5-6岁宝宝，只放非仿真玩具能让宝宝开展更多语言游戏和假装游戏。非仿真材料比如一些盒子、纸板、积木和橡皮泥。


    # 4.孩子爱用好人、坏人来评价爸妈？


    我家小朋友三岁了，近期很爱用好人、坏人来评论爸妈，耐心沟通也没什么进展。不给他买玩具就是坏人，不给他看动画片就是坏人，很头疼，我该怎么办？


    Dr.魏


    我倒觉得这是孩子懂得知识迁移的表现，值得肯定！他可能是在看动画片或者看绘本时学习了好人、坏人的概念，比如猎人救了小红帽，是好人；光头强想砍树破坏森林，是坏人。然后迁移到了对你们的评价上。

    非黑即白是三岁左右孩子认知水平的体现。每个人都是从这个阶段过来的，阅历增多才知道没有永远的好人、坏人，好人可能做坏事，坏人可能做好事。孩子评价标准很简单，你做了我认为好的事情，就是好人；不好的事情，就是坏人。对朋友的定义也是简单粗暴，相处得好，你是我最好的朋友；下一秒吵架了，你不是我的朋友。

    所以，当孩子说“不给买玩具就是坏人”“陪玩游戏就是好人”时，你要抓本质，在脑子里装个儿童翻译软件：妈妈没给你买玩具，你心里难受；爸爸陪你玩游戏。'
