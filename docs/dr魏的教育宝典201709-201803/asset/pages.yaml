    # 直播回顾


    —— ♦ 智力脑 ♦ ——


    # 知识点：大脑的可塑性


    大脑神经元的连接，叫做“神经元突触”。人类的大脑共有860亿个神经元和约1000万亿个突触。在人生命的第一年，在新鲜刺激的作用下，神经元以每秒700～1000个的惊人速度建立着新连接。3岁时，连接的数目达到峰值，甚至超过了成年人。在这之后，很少被刺激到的突触会削弱甚至被裁剪掉，就是突触削减(synaptic
    pruning)。


    一旦某个突触成功参与某个大脑功能的运作，它就会受到强化；相反的，没有用到的突触就会衰弱，最终被剪裁掉。这就如同森林中的小路，如果没人走，时间长了就荒废了。这就是神经可塑性的最基本表现。


    这也能很好地解释，为什么很多脑科学家认为人类智力的差异，所谓的“笨孩子”和聪明孩子的差异，其实是神经网络的效率的差异。脑网络回路的发达程度，信息传递的速度，决定了一些重要的智力差异。


    尤其是在生命的前几年，孩子大脑的很多区域还没有形成特异化的功能，相应的皮层具有较强的学习能力。这就意味着如果你对大脑进行相关训练的话，孩子的大脑达成很好的学习效果会更加容易一些。


    # 应该怎么做？


    给孩子提供丰富的环境刺激，以及具体行为的刺激，尽可能帮他建立有用的神经元连接，最好是形成强大的神经网络，这样孩子的大脑会更高效。


    +   1. 利用空间类游戏刺激大脑


    空间智力是对孩子很重要的认知能力，它是数理能力的重要基础，也是STEM教育的核心之一。虽然空间智力会受遗传影响，但是脑科学告诉我们，空间智力的可塑性很强，可以靠后天练习来提升。


    让孩子多玩建构类玩具（construction toys），能够有效培养孩子的精细动作、发散性思维、语言能力和空间认知能力。建构类玩具是孩子可以利用这些玩具搭建各种各样的形状的玩具，比如积木类的乐高，拼接类的磁力片，棋类，甚至是有关于空间折叠和变换的电子游戏。只要可以让孩子自由组合出各种形状，都可以达到玩建构玩具的目的。如果你要给孩子买玩具，建构类玩具是一个明智的投资。


    另外，无论孩子玩哪种玩具，你都可以加上空间词汇和孩子聊天，“你把这块积木倒转过来试试看？”运用空间词汇多沟通，帮助孩子空间认知升级。


    +   2. 用推理技巧教孩子乘除法


    数学开始的学习必须是具象的，让孩子在具体情境中解决具体的问题。一般6岁以下的孩子，是不会算乘法题的，你问他三乘四等于多少，他可能回答不了。但是，如果你告诉他这个故事：兔子村有3个兔子窝，每个兔子窝可以住4只小兔子。圣诞节的晚上，所有的***小兔子要去一个大房子里庆祝，你一共要在大房子里准备多少盘子呢？注意，每个小兔子手里要有一个盘子。'
