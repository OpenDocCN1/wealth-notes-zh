  md: '# 154 | 读者问答：童年经历不决定你的养育方式


    154 | 读者问答：童年经历…


    Dr. 魏

    下周我将与你一起谈一谈游戏，研究发现，父母的参与可以增进宝宝游戏时的专注力，并且提高游戏行为的层次。

    之后，我们将进入复盘期，为你梳理全年内容，工作日不间断更新，欢迎收听！


    # —— 本周问答时间 ——


    +   1. 把性格缺陷归因于童年不幸，有何弊端？

    2. 孩子发脾气哭闹，怎么劝都没有用，怎么办？

    3. 黑白卡能够刺激大脑发育吗？

    4. 除了运动外，还有哪些针对多动症的训练方法？

    5. 孩子同时学习拼音和英文字母，会混淆吗？


    # 1. 把性格缺陷归因于童年不幸，有何弊端？


    一些心理咨询、心理分析的案例，总爱把一个人的性格缺陷归因于童年的不幸。好像不管你现在哪里不对，归根到底都是当年你妈妈的不对？这种研究对吗？我感觉“妈妈”拯救桩的，作为成年人需要为自己负责，而不是把多年前的童年记忆翻出来。


    Dr. 魏

    这种做法最早可以追溯到奥地利心理学家弗洛伊德。100多年过去了，很多心理学家已经在摒弃这种做法。

    比如我们前面谈到安全感。有人说现在的子亲关系处理有困难，都怪小时候妈妈对自己太残忍。而西方心理学家发现，小时候的经历，不一定决定你现在的养育方式，关键是你怎么解读。

