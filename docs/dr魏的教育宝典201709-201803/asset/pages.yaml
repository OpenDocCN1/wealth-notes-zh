    首先感谢Dr.魏一年的陪伴，在这一年时间里，我从一个对孩子没有耐心，动不动就发火的育儿新手变成了一个有耐心、懂育儿的理性爸爸，孩子也得到了更好的关爱和成长。在专栏学习中，每天晚上无论多晚都要坚持学习并留言，我收获了许多育儿知识外，还收获了很多脑科学有关知识，甚至我认为我的收获比孩子都要大。学到了很多东西很多很多，比如慢慢理解了孩子很多行为都是正常的，我学会耐心、宽容、反fri、鼓励。知道了该如何培养乐观的态度，要鼓励孩子要大胆地表达出自己的情绪，比如恐惧、害怕。还有男宝女生一样聪明，有些发育男女会互有强弱和先后。要主动为太太分担带孩子的压力，学会高质量的陪伴等等太多太多有用的知识。课程还有很多金句：接受那些不可改变的，改变那些可以改变的。暴力不是解决问题的办法，爱才是。实在是非常受益。


