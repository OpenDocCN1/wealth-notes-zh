  md: '# 095 | 读者问答：孩子不爱吃果蔬怎么办？


    Dr. 魏

    下周我将集中帮你解决两个问题：同理心和手势语言


    心理学 家认为，同理心是社会交往的基础，也是道德感的源头，调节人际关系、协调合作都少不了它。有同理心的孩子能感知、理解别人的情绪，并做出恰当的回应。天气转凉了，一起来学习，培养出一个暖心宝宝吧。


    除 了同理心，我们都知道，语言很重要，其实，手势也是一种语言。释放孩子的双手，能提高他们的语言能力、记忆力和数学能力。下周，我教你如何鼓励孩子用手“说话”、用手“思考”、用手“学习”。


    # ——► 本周问答时间 ◄——


    Dr.魏 与 躁妈 一起解决 5 个问题


    +   1. 孩子吃手指需要纠正吗？

    2. 如何跟孩子探讨生与死的问题？

    3. 敏感型的孩子如何引导？

    4. 孩子总是要陪玩怎么办？

    5. 孩子不爱吃蔬菜、水果怎么办？


    # 1.孩子吃手指需要纠正吗？


    您好，我是一位宝爸，听了您的专栏受益良多。最近有个问题一直困扰着我们夫妻，孩子一岁， 吃手指越来越严重。

    我在网上看到很多观点，有说要及时改掉，有说长大自然会好的。我现在很 Widget， 这种行为到底要不要纠正？您有好的方法或建议吗？


    Dr. 魏


    最近不少家长留言询问“孩子吃手指”的问题。你先别着急，吃手指其实是很正常的行为，有的小孩子早在妈妈肚子里的时候，就已经初步掌握了这项技能。对于小宝宝，吧唧吧唧吃手指就像是吃安抚奶嘴，能够调节情绪。


    等孩子大一些，他们可能也会因为累了、吵到了、无聊了、肚子饿了、压力大了吃手指。可能是最近不少孩子陆续走进了幼儿园，在适应过程中有压力，难怪咱留言区这个问题
    的家长多了起来了。


    你可能会担心孩子吃手指，影响牙齿的整齐美。美国牙科学会的研究表明，大部分孩子吃手指的行为都是安全的，通常孩子只是把手指放在嘴巴里，并不用力。


    而且，在孩子的恒牙长出来之前一通常是5、6岁以后，吃手指对牙齿的影响才会明显。如果 你发现孩子牙齿发生明显变化，那么最好咨询牙科医生。一方面是请医生评估，另一方面，医生的
    话，孩子可能更愿意听。


    再告诉你一个好消息，大部分孩子在2-4岁会停止吃手指。这是因 为，孩子 的行动能力、语言能力和认知能力提高了，他们有更多的替代方法来解决问题。


    比如无聊了，自己找玩具；肚子饿了，跟你要吃 的；被吓到了，会跟你说，求抱抱、求安慰。如果孩子吃手指情况比较频繁，你需要留意，这是在什么情况下出现的。孩子可能自己找不到替代方法，需要你的帮忙。


    有些家长遇到这种情况很紧张，大声斥责、打手，甚至威胁用牙签扎嘴巴，这是错误 的，孩子压力会更大，适得其反。其实，你只要平心气和地跟孩子解释，并且帮他找到替代方法，问题
    也就不会 攻自破了。


    # 2.如何跟孩子探讨生与死的问题？


    最近上小学一年级的女儿经常和我探讨人的出生、死亡和家人的问题，她急切地想要知道人到底 是怎么来的，死了以后，还能不能和自己所爱的家人在一起。


    一遍又一遍地探讨，而且越来越深入，我感觉简单的回答根本满足不了她。在这个问题上 该做在怎么回答她、引导她？


    Dr. 魏


