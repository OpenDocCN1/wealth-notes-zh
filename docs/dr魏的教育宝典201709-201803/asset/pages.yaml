    # 知识点：大脑默认模式神经网络


    当你发呆、出神的时候，大脑仍有脑区在忙碌，这就是大脑默认模式神经网络。大脑默认模式网络就像电脑的后台，当你的注意系统放松的时候，它还在运作，把你过去积累的知识库重新组合成有新意的信息，让你收获灵感一现。默认模式网络告诉我们大一点的创新，需要放松的大脑，充足的知识储备，对当前问题的牵挂，还有一定的随机性。


