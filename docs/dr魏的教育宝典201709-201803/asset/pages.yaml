    # 1.大男子主义爸爸的育儿三观颠覆史


    海军中尉

    为父亲母。为孩子成长，深知带娃不易。总想让自己成为一个榜样，知道的多一点，对孩子帮助大一点的好爸爸。可现代资讯，让我认识水平，分分钟产生怀疑。育娃方面有时候真的不知道该听什么？有经验的老人的，还是听身边已有为人父母的同事的；还是听一些专家的；只知道要借信科学，可是当科学来了，西方是异常的候说不一样，如此小孩子降温，中医要坐月子，西医要吹冷，老要要搭，朋友说散开要物保温；真是不知道该听的，可说我孩子温度在升高的，最后还是避免不了跟随孩子伤在药。所以，听到一个熟语，有研究水平，有育儿经验的专家的意见，我就切墨求鱼。正是好，最强大脑的Dr.魏在我这里打开了一个权，收获大龄和疑虑的同时，更是获得一个宝地可以倾诉育儿的焦虑与疑虑，与有相同问题的人我交流谈话，这是一个科学的态度。感谢Dr.魏。给予我们与孩子的共同成长，也获得与几万上进的父母们共育儿经验，之前让我这个有点大男子主义的爸爸，深感惭愧，今后的育儿是力所能及的说明，今我的孩子三观形成是这个平台正经过来。要说收获，我觉得端正自己的态度与家庭责任，认真学习育儿知识，就像今天的课程一样，过程中心产生的学习动力，才是我最大的收获。


