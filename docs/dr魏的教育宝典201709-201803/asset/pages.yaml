    # | 金牌家长-快乐小球球


    分享话题: 关于早教机构, 我的育儿心得


    不少人谈起早教，会认为它是锻炼孩子大动作开发的、是培养家长育儿理念的，然而这些机构只是早教机构里的一种——美式早教。


    早教市场并非只有这一种早教机构存在。美式占很大市场份额，导致大家普遍认为早教就等于美式早教。我这篇分享想要告诉你的是除了美式早教以外，市面上还有两种早教机构也很普遍：蒙氏早教和日式早教。


    接下来我来说说每种早教机构的特点以及优劣


    # （1）美式早教


    关键词：大动作，艺术启蒙，玩耍中学习，秩序感建立，自由散漫


    理念诞生在上世纪50年代前后的婴儿潮。普遍美国家庭没有空间给孩子玩耍，所以把孩子送到一个固定的早教场所进行娱乐玩耍，由老师带做游戏。最后，这套理念相对成熟后，演变成了三大主要课程，即：体育课，音乐课，美术课。


    美式早教机构适合0-6岁的孩子，尤其适合0-3岁，美式早教的活动器材对孩子的大动作发育特别好，但每家机构的器材其实是不同的，所以家长在选择美式早教机构时，一定要对该机构的器材有所了解。


    音乐和艺术启蒙也是美式早教的特点之一，在美式早教中，老师会针对孩子早期的乐感和自由玩耍型艺术创作，培养孩子的兴趣，并对家长进行指导。


    当然，除了核心三大领域体育、音乐、艺术以外，有些机构还会开设旅游、烹饪、球类、体操以及学前适应等科目给大年龄段（3-6岁）的孩子玩耍，以养他对社会秩序的理解，以及时对接学校生活。


    但美式教育也有劣势，美式教育中对孩子独立个性的尊重非常强，以至于在美式教育早期老师更鼓励“放飞自我”形态。如果孩子上课不严格遵守老师的指令，而去玩其他玩具，老师一般不会管，如果家长要干涉，老师会劝家长不要管，让孩子自己去玩想玩的东西。


    但大年龄段孩子的课程会对命令和秩序有要求，3岁以后会增加独立课。


    # （2）蒙氏早教


    关键词：自己玩耍，蒙氏教具，观察者，舒适区，慢


    一提到蒙氏，不少妈妈要兴奋了。因为蒙台梭利理论美好程度让不少妈妈为之动容。蒙氏教具的独特性也让不少家庭常常“剩手”。蒙氏鼓励孩子有自我学习的能力，不需要大人指导。所以，Dr.魏也提到过蒙氏的不足，比如，容易让孩子停留在舒适区，没法做到“跳一跳就够到”的成长。


    蒙氏教学的“放羊”形态会让不知所以的家长觉得是老师在偷懒。比如老师会在开头给孩子布置完工作后，就坐在一旁扮演所谓的“观察者”角色。然而，根据蒙氏教学标 准培训出来的老师来看，其实是非常严
    格的。


    我曾今看过《蒙氏老师的指导手册》，光观察指导部分就很厚一叠，但对于外行人、不理解其中奥义的家长而言，会觉得孩子自己在家玩也可以，何必浪费这个钱，觉得老师不起到作用。


    但是不得不说，蒙氏机构在3岁以后的蒙氏数学课程里，对孩子数学启蒙——加减法、进位退位 的指导很有用，不少家长都说孩子学了之后，在小学阶段的数学计算中更轻松了。


    蒙氏的劣势就一个字：慢。因为蒙台梭利的理论核心导致了舒适区学习法，在没有指引的过程中，懒散一定会贯穿蒙氏教学的始终。


    # （3）日式早教


    关键词：全脑开发（语数外全面发展），专注力，刷题，鸡血


    据我了解，某田真的理论饱受争议。但以这套理论为基础的早教机构，在市场上的火爆程度却一直不减。甚至有不少影视圈明星还把自己孩子送去上早教。不得不说日式早教其实还是有自己的特点的。


    不少家庭在学龄前都会给孩子买过大大小小的数学启蒙习题册，比如著名的公文系列，多湖辉系列都是来自日式数学启蒙的教案。


    大量刷题和秩序渐进是日式早教的特点。日式早教想要秉持的就是“全脑开发”这个特点，虽然Dr.魏曾批判过这个概念，但是也只有日式早教在0-3岁有这样的语数外学科科目内容，不少国内的鸡血家长喜欢日式就是这个道理——可以学科抢跑。


    日式早教不像美式早教、蒙氏早教那样过度尊重孩子的独立人格，提倡尊重家长和老师。回答问题追求正确答案，而不是尊重孩子兴趣的培养。所以“鸡血型”家长认为这种方式对之后对接学校课程有利。


    闪卡的训练目的是为了增强孩子的专注力。频繁刷过的闪卡图形，本质上并不要求记忆，而是不断训练拉长孩子的专注力，培养的是孩子的非兴趣化专注，美式以及其他理论强调的是兴趣引起专注，日式则反着来。


    最后，我是如何造选早教机构的？


    我会根据不同年龄选择合适的机构，美式早教在0-3岁使用，重在培养大动作发育和早期艺术音乐启蒙。蒙氏的数学教育在3岁半左右使用，帮助孩子顺利学习逻辑数学等科目。至于日式我穿插在2岁到4岁的区间使用。因为我家在3岁开始进入语数外学科科目的学习，以适应小学阶段民办择校的冲刺。


    以上就是我对早教机构如何选的看法，分享给大家，仅供参考，欢迎一起讨论。


    Dr.魏


    对于早教，我的看法是，千万不要把“宝”押在别人身上。早教班再好，也替代不了你给孩子的培养和影响。你和孩子的言语交流，你小时候给他爱抚，你和他一起做的游戏，你和他一起读的小人书、一起堆的沙子、一起跑过的林荫路，这些都是他最重要的早教。


    当然了，好的早教班，确实能够一部分在时间上和培养方式上帮助一些新手父母，同时，也能够给孩子提供一个小小的社交环境，对孩子的能力提升也有一定帮助。


    在专栏里，我们学习了提高孩子在智力、情绪社交、语言、运动和创意的科学方法，这些方法可以作为你选择早教班的参考。


    @快乐小球球 分享了自己对目前早教机构的优劣分析，有一定的参考价值。同时，美式、蒙氏和日式早教都是大的理念，在实际决策中，你还得考虑很多因素，比如老师的经验，安全、环境是否有保障，理念是否落实到位，孩子是否感兴趣等等，这些都需要做家长的你亲自研究、考察。


