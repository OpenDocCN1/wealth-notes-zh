  md: '如果孩子还没有零花钱，也可以讨论：你想买小汽车，我们也得买面包当明天的早餐，但是我们的钱不够两样都买，怎么办？让孩子自己来选择与判断，将来他可能更有经济头脑，还能锻炼他的思维能力呢。


    # 如果孩子纯粹爱攀比怎么办？


    如果孩子纯粹是被别人的物品吸引，可以跟孩子一起上前面说的三堂课。还有一种情况，夹杂着攀比因素，比如这位妈妈的问题，她说：


    > “有一次我路过小区幼儿园，听见一个小朋友对另一个小朋友说：看，我妈给我买的杯子，是名牌噢！好几百块呢。而另一个也不示弱地说：我妈准备给我买iphone7！……我惊讶这么小的孩子竟然有这么强烈的攀比和虚荣心。关于孩子的虚荣心问题，您是怎么看待的呢？”


    这件事，与孩子的自我意识和自我评价相关，也与孩子的社会能力发展相关。孩子三四岁的时候，通常非常自信，觉得自己哪哪都厉害，自己的东西啥啥都好。到了六七岁，他开始关注到外界对自己的评价，渴望得到他人的肯定。


    但孩子的分析与判断能力还比较弱，在很大程度上受到周围环境的影响。如果在他的生长环境中，流行的价值观是“拥有昂贵的东西就是赢家”名牌才算高级”之类，他可能也用这种标准来衡量自己。再长大一些，孩子要融入同龄人的圈子，“用iPhone的人”穷耐克的人”，都有可能成为一种社会身份的标识；如果要追求这种物质上的身份标识，自然会出现攀比现象。


    要是有父母认为“应该买！别人家孩子有的，我家也得有，又不是买不起”，那我也不好提什么建议，这是他们的价值观。


    如果你希望孩子能更正确地评价自己，可以从两方面来引导他：


    一方面，如果他觉得对方的东西好，完全可以大方表达，真诚地说出自己的喜欢与欣赏：“哇，这个杯子好漂亮，上面有小猪佩奇，我也喜欢小猪佩奇！”


    另一方面，你可以多从品格、能力、兴趣等角度评价和描述孩子和其他小朋友，比如：“贝贝今天帮助妈妈摘菜，替妈妈节约了不少时间，她妈妈特别高兴。”“冬冬讲故事讲得可真精彩，你也喜欢讲故事，是不是？”给孩子多个评价自己的角度，帮助他找到模仿的榜样，进而找到真正的自信来源。


    世界上有很多东西让人喜欢和充满向往，生活因此而更加让人期待。但是，正如钻石并非恒久远一样，遥控汽车也不是聪明宝宝必备。


    当孩子哭闹着要买东西的时候，问问孩子：它对你有什么作用？如果买了的话，你会怎么玩？如果想要买，怎么获得足够的钱？这三个问题都想明白了，再买也不迟。


    表面上看来，给不给孩子买他想要的玩具，是一个小小的问题。但是，这其中教会他的思考，比如想象力和对自己内心需求的评估，以及传递给他的价值观，会对孩子的理性思维培养和人生观的确立有着不可忽视的影响。


