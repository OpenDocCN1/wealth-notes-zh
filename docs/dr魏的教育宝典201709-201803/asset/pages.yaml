  md: '# 117 | 数学不只计算，推理更重要


    Dr. 魏


    下面两道给儿童的数学题目，你觉得哪道更难一些？一道是10减3等于多少？另一道是这么问的：小红有10根铅笔，小明有3根铅笔，那么小红比小明多几根铅笔？


    我们大人肯定觉得从难易程度上，或者是解题速度上来说，肯定是第一道题容易一些。不就是10减3么，答案就是7，完全不需要过脑子。但是如果问小红比小明多几根铅笔，那么光靠记住的10减3的记忆就不够了。


    很多家长有误解，教孩子做算术，就是要学会背下常见的数字运算，包括乘法口诀表。实际上，要理解数学题，除了计算能力，还需要理解题意的能力。上面那个小红和小明的故事情节，需要从中抽象出数字概念来，明白里面涉及到数字10和3，再进行运算。这里，要用到数学推理能力。


    今年八月，研究儿童数学能力的大牛——英国牛津大学的两位教授努斯（Terezinha Nunes）和布赖恩特（Peter Bryant），来北大做了一系列讲座，讲座重点是对儿童的数学培养来说，数学推理能力是最重要的。今天，我结合讲座的内容，来详细告诉你，什么是孩子的数学推理能力，它对孩子有多重要。听完你就明白这个问题的原因，并且明白该如何轻松地在生活中教孩子数学。


    # 数学不只是计算


    努斯教授说，孩子学数学，需要有两种能力。一irmek是基于记忆的计算能力，比如加减法，1+1=2；乘除法，三三得九四十四，只要会背公式，就能计算正确。另一种能力是基于逻辑的推理能力，比如你知道a比b高，b比c高，你能不能推测出a比c高？这种能力不需要背公式，只要正确理解题意就能做出来。


