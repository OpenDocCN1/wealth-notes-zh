  md: '# 146 | 读者问答： “可怕的两岁”，孩子的第一个叛逆期


    146 | 读者问答： “可怕的两…


    Dr. 魏


    下周即将进入春节啦，你家打算怎么过春节呢？


    如果iesa走家串门，大人们聚会，小孩子们怎么在一起玩得开心呢？我将从同伴关系、社交礼仪的角度给出建议。


