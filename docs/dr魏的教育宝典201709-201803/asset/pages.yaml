  md: '# 145 | 怎样战胜“女孩没有男孩聪明”的偏见？


    Dr. 糖


    上一期谈了一个敏感的话题，就是男孩和女孩的智力差异。这里还要强调一点，性别差异对智力虽然有一些先天影响，但是后天因素对智力的影响也很重要。我们反复说过神经可塑性原理，由于大脑强大的可塑性，对于绝大多数智力处于正常区间内的孩子来说，后天环境的塑造，比如不同的经验和教育对孩子智力的影响更大。


    这种男女的社会偏见不是一时半会就能改变的，那么我们做父母的，怎样才能够保护自己的孩子，让他们更健康地成长呢？


    今天就来介绍一下我的做法，主要有3点：第一，用言语消除孩子关于刻板印象的偏见和疑虑；第二，给孩子创造一个包容的环境；第三，多让孩子参加男孩和女孩一起玩的活动。


    # 1.用言语消除孩子的偏见和疑虑


    这一点很简单，就是你不能够像我在上一期里提到的那个爸爸一样，竟然当着女儿的面就说她不聪明，说她不行。你要先在心里去掉这种刻板印象，正确地理解男女差异。


    这中间的原理，我在上一期说过，这里再强调一下：第一，男女之间的智力差异非常复杂，绝对不能用一句简单的“女孩智力平均比男孩差”概括，他们其实是各有优劣。第二，也是最重要的，智力不仅仅仅受先天影响，后天因素也非常重要。


    你怎样养育你的女儿，你的言语给她什么样的暗示，你培养她什么方向的能力，这些都会极大地影响她的智力。就算你有时看到男女孩子在表现上的差异，这也可能不是她们天生的因素引起的，而是人们把她们区别对待所引起的。


    家长可以做什么呢？除了你自己不要暗示女孩没有男孩聪明之外，如果孩子听到其他人说一些对女性有偏见的话，你要奋起反击，帮助孩子解除疑虑，把可能的刻板印象给消除掉。


    比如，有一次我带女儿去一个科学实验兴趣班试听。结果发现，那天来了10个孩子，有9个是男孩。我就问主办老师：“你们平时也是这样吗，女生这么少？”那个老师说：“平时一个女生也没有！科学，就适合男孩孩子学！女孩孩子嘛，学学跳舞、钢琴就行了。”


    你看，他虽然没有明说女孩没有男孩聪明，但其实言下之意就是，科学是一件很困难的事情，只有男孩能学，女孩学不了。女孩只能做做像跳舞、钢琴这种似乎没有智力含量的事情。


    而且他是当着我女儿的面说的，我女儿明显感到困惑了，皱갹了眼睛。于是我立刻毫不客气地跟那个人说：“你可就错了，我是研究脑科学的，女孩和男孩在这方面没有什么差异，女孩也能学好科学。”


    因为孩子会从社会各方接受很多混合的信息，家长要时刻记得坚定自己的立场，帮助孩子建立正确的价值观。所以，你心里需要够着这根弦，如果别人仅仅根据你孩子的性别，就对孩子做这样那样的判断，一定要坚决反驳。


    哪怕别人是称赞你女儿聪明，但是他说：“哎呀，你女儿这么聪明，在女孩子里真算是难得了！”你也得反驳说：“跟男孩女孩没关系，女孩子男孩子都一样聪明，关键是她对这个感兴趣，喜欢去学。”


    # 2.给孩子创造多样又包容的环境


    当然，光说是不够的，更重要的是行动，这就是我要说的第二点，怎么样给孩子创造一个多样性的包容环境。比如我会带女儿去上科学实验课；买玩具时有洋娃娃也有机械工具包；讲名人故事的时候，举男性科学家的例子，也树立女性科学家的形象。注意平衡选择，不贴性别标签。


    不光是在家里给孩子多样的环境，出去玩也不要因为性别而束缚住孩子。我每次带女儿到小区的游乐场去玩，总是会发现在一群奔跑的孩子当中，有一两个小女孩有点不知所措。因为她们稍微跑一跑，滑一下滑梯，家长就担心地说：“哎呀！宝宝当心，别把衣服弄脏了！别跟那个臭小子似的到处乱跑。”


    在这些家长眼里，女孩子就应该文静一些，这就是一种刻板印象。其实，运动不仅仅只是发展运动能力，孩子在滑梯上滑上滑下，在迷宫里转来转去，其实也是在发展他们的空间能力。


    还有，我经常发现父母对男孩、女孩的引导不一样。比如同样是逛公园，妈妈很可能对儿子说的是：“哎，宝宝，快来数数这里有几朵花！”对女儿说的就更多的是：“哎，宝宝，快来看这花多美啊！”对男孩更多地引导数学、科学知识学习，对女孩更多地引导她的感受、语言表达。


    可是，如果父母总忽视对女孩数学能力的培养，可能浪费她们在数学方面的潜能。反过来，如果一个男孩，总是被父母引导着注意数学、科学，好像引导他注意花有多美就会让他变得娘娘腔似的，这也是对男孩智力潜力的一种浪费，浪费了他本来可能可以培养出来的感受和言语能力。


    顺便说一下，我还常听到父母对男孩说：“男子汉要勇敢，不许哭。”这也是一种性别的刻板印象，对孩子的社会情绪能力发展不利。


    我今天想强调的是，无论男孩还是女孩，你要让孩子尽量多接受不同种类的刺激，这样才能发展出最全面的智力。


    # 3.男孩女孩一起玩


    所以会有第三点，就是我会注意让女儿的玩伴里面既有男孩子也有女孩子，而不是只和女孩子玩。无论是爬山、下棋，还在操场上疯跑，都是男孩女孩一起玩，这样能帮助孩子避免受到刻板印象的影响，更全面地发展。


    说到这里，我有一个绝招。你想想，你女儿最容易找到的、能跟她一起玩的男孩是谁？就是爸爸呀！所以我一直提倡爸爸多带孩子，这无论对男孩还是女孩都有好处。因为一般来说，爸爸更喜欢身体运动，也更倾向于数理逻辑思维。所以他们带孩子的时候，会鼓励孩子更多运动，更多探索，比如说一起打球，玩过山车，去森林里野营等等。这些活动，不光增强了孩子的体魄，而且也增加了他们的见识，锻炼了他们各种各样的能力，刺激他们的大脑全面发展。


    这就是我给你的建议，我希望你能得到的是，怎么让女儿免遭“女孩没有男孩聪明”这种谬论的毒害？我给你3点建议：


    +   1. 一定要注意不要给孩子这样的刻板印象的暗示，而且，当别人试图用这样的刻板印象来影响你女儿的时候，你要奋起反击，给孩子树立正确的价值观。


    +   2. 给孩子创造多样的、包容的环境。一个全面发展的环境，能给孩子带来充足的刺激。


    +   3. 让你女儿跟几个男孩玩，也跟女孩玩，尤其是跟孩子她爹要多玩！


    最后我想跟妈妈们叮咛一下。我一直主张，育儿育己。要保护女儿，你首先要破除自己心里的刻板印象。你是不是也认为，女孩子不如男孩子聪明，或者女孩子不像男孩子那样适合做科学、技术、发明这些需要“很聪明很聪明的头脑”才能做的事情？而且你好像在身边看到了很多证据？甚至你觉得自己就是一个证据？


    那我要告诉你，这种所谓的证据，往往更多地是被后天的引导、社会的刻板印象所造成的，而不是真的反映了男女之间的智力差异。抛掉刻板印象吧，相信你自己，相信你的孩子，只要努力，必有成就。


