  md: '# 142 | 搞懂睡眠模式，让宝宝睡得好


    Dr.魏


    为什么宝宝总是睡不好？


    睡眠问题是每个父母育儿的升级打怪之路上必经的一道坎，这个坎，并不好过。


    每一个睡眠慵松的父母身后都有一个“睡渣宝宝”。他能在午夜梦回的时候大哭把你惊醒，也能在光天化日之下呼呼大睡，上床前好像要折腾一个世纪才睡着，然后一有风吹草动又醒了，他的睡眠世界里充满了不可预测性。


    其实，宝宝跟大人的睡眠模式不一样，了解其中的差异，有助于解开宝宝觉觉的未解之谜。


    # 宝宝睡眠大不同


    成年人的睡眠模式受昼夜节律的影响，也就是以24小时为一个周期。白天阳光照射会刺激人体内皮质醇的分泌，它是一种能让你保持警觉的激素。随着黑夜降临，皮质醇分泌开始下降，体内开始产生更多的褪黑激素，它是一种嗜睡激素。所以你能在白天保持清醒，也能在夜间呼呼大睡。


    刚出生的宝宝区分不了夜间和白天，他们的睡眠模式不受昼夜节律调节，而是由他的胃容量决定的。所以宝宝晚上每隔三四个小时就被饿醒一次，这可能<|message|>


    好在，随着胃容量的增大和对环境的适应，到大概半岁的时候，宝宝终于能睡整觉了。有 的宝宝好不容易能睡整觉了，过了 一段时间又一夜回到解放前。你也不用过度担心，给宝宝耐心，要完全达到大人的睡眠水平，还需要到五六岁，也就是学龄儿童的阶段才行。


    成年人的睡眠周期可以简单地划分一下。一般是从“非快速眼动睡眠期”（NREM）开始，类似大家说的“深度睡眠期”，这个时期你会睡得越来越沉，直到身体完全静止。然后到了“快速眼动睡眠期”（REM），“快速眼动睡眠”以睡觉时眼睛在眼皮底下快速转动得名。这时期你会睡得比较浅，往往会做比较清晰的梦，所以也叫做“做梦期”。一个完整的睡眠周期大概持续90~100分钟，你每晚大概会连续睡3~5个睡眠周期，越到后面，深度睡眠的时间越来越少，浅睡眠越来越多，你也就越来越容易醒来。


    小宝宝的睡眠周期跟成年人不太一样，首先宝宝的睡眠周期比较短，半岁的时候才到大人睡眠周期的 一半。而且，我们成年人睡一个周期结束后，会连着睡下一个周期，就算醒来也能很容易重新入睡，但是小宝宝做不到。这就是为什么你常常觉得宝宝才刚睡着半小时，怎么这么快又醒了。


    # 如何保证宝宝的睡眠质量？


    了解完宝宝的睡眠模式之后，你应该知道，宝宝的睡眠周期本来就比较短，而且更容易醒来，这就造成了他们可能自带睡渣体质。


    问题一：孩子需要睡多久？


    +   - 不该因时感到困，比如早上刚起床；

    - 不该清醒时兴奋，比如晚上睡觉前；

    - 白天难以集中注意力；

    - 只要有机会，几分钟内就睡着；

    - 容易感到沮丧、愤怒；

    - 难以控制冲动。


    +   - 刚出生的婴儿每天大概要睡16小时，一次睡3~4小时；

    - 8个月的孩子每晚睡10~12个小时，白天要小睡两个三次；

    - 2岁孩子，每晚睡9~13个小时，白天小睡一次，一次2小时；

    - 3岁孩子每晚睡10~12个小时，白天小睡1~2小时；

    - 3~4岁孩子小睡不普遍了，小睡时间会更短，晚上的睡眠时间增加了，一般是9-13小时。


    问题二：午睡有必要吗？


    问题三：孩子入睡困难怎么办？'
