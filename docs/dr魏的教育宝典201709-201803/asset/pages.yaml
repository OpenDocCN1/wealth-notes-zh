    # 《超越智商：为什么聪明人也会做蠢事》


    ![](img/bce617503caab4aa8727e0f05b5e6106_193_2.png)


    《超越智商：为什么聪明人也会做蠢事》是加拿大多伦多大学人类发展与应用心理学教授基思·斯坦诺维奇的理性三部曲中的一本。斯坦诺维奇认为，善于思考的人，光有智力还不够，还得理性。

