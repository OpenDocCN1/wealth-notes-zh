    079 | 读者问答：杜曼闪卡靠谱吗？ ↓


    Dr.魏

    下周我帮你解决的问题，可以概括为一个字“打”

    比如，孩子打人这事，很多爸妈都头疼，如果是自己的孩子挨打，会纠结“要不要教他打回去”？其实，现实没有标准答案，但是，了解孩子的成长规律，家长能在日常生活中打好“预防针”。

    第二个“打”，指的是家长打孩子，除了打孩子，有没有更好的管教方法呢？你一定知道体罚对孩子有害，但可能还是忍不住动手。下周，我带你回到问题的原点，给你几个父母最可能体罚孩子的场景，并告诉你在这样的情况下，如何避免体罚。


