    # 1. 孩子玩游戏太在乎胜负怎么办？


    我最近跟孩子一起玩我教的数字游戏，并且且拿小车当棋子，引起他的兴趣。一开始，孩子很喜欢，因为他很喜欢小车。可是，在玩的过程中，他只要一输或者落后，就会生气，说，“我不玩啦。”我跟他讲道理，他就把耳朵堵上，还说：“我就不好好玩，我就乱走！”于是我故意沉住气让他，可是偶尔超过他一个格子，他就又不玩啦！我真的不知道该怎么办？


    Dr. 魏


    上周我在《一个效果惊人的数字游戏》中，推荐了一个可以促进孩子数学能力的棋盘游戏，你和孩子玩了这个游戏，首先给你们的行动力点赞！


    三四岁的小朋友，大多很看重胜负，这很正常。在给他讲道理时，请记得我一直强调的原则：先处理情绪问题，再处理行为问题。孩子生气，你也生气，只会更加刺激他的情绪险。
    你不妨试着描述他的感受：你输了比赛，很生气，如果妈妈输了，心里也会难受的。然后让他先休息一下，冷静下来，再跟他解释，这回输了，下回或许就赢了。

    如果他还是对输赢很在意，那么不妨修改一下游戏规则，把你们的竞争关系变成合作关系——要两个人都要达到终点才算赢，先到达终点的选手要帮助后到达的。

    如果你们想给孩子购买桌<|message|> 游戏，建议优先选择合作类的。比如有一款桌...


    # 2. 孩子为什么抗拒上幼儿园？


    宝宝上幼儿园中班，最近经常闹着不想上学，说因为学校里没有妈妈。我对他说：“妈妈白天上班，没办法陪你，你一个人在家多无聊，在幼儿园可以跟小朋友玩，还可以学习新知识，放学后妈妈也下班了，就可以陪你玩了。”但他还是很抗拒上学，老师布置的作业也不做。我不敢逼他太紧，担心以后厌学。


    Dr. 魏


    从你的描述看，孩子说是因為学校里没有妈妈，所以不愿意去。我建议你先别着急给他解决方案，应该继续和孩子沟通，挖掘深层原因。他说学校里没有妈妈，是因为在那里遇到不开心的事情吗？比如和小朋友闹矛盾了？或者被老师批评了？

    对症下药，才能治本。


    # 3. 宝宝为什么分不清“你”与“我”的概念？


    宝宝28个月，现在说话总会犯错，比如说需要别人帮助，他会说“帮你”；还比如递东西给别人，会说“给我”。他是不是分不清“我”和“你”的概念？也不清楚为什么会出现这个问题，尝试纠正了好几次，都没有效果，想问问题是怎么回事？


    Dr. 魏


    这涉及到人称代词的复杂度。“我”是第一人称代词，“你”是第二人称代词，它们可以被任何人使用，没有特指性。也就是说，当你说话时，“我”代表的是你自己，“你”代表的是宝宝；当宝宝说话时，就反过来了。当爸爸说话时，这两个人称可能换了人。你看，是不是很容易混淆？宝宝是需要时间来学习区分的。

    所以，在宝宝更小的时候，往往都是直接用“宝宝”或者小名来指代自己，而不是“我”；用“妈妈”“爸爸”来指代你们，而不是“你”，这样宝宝就不会混淆了。

    下次，宝宝还错误地使用人称代词的话，你不用刻意纠正，他会慢慢分清的。


    # 4. 孩子爱咬手指甲，如何纠正？


    儿子6岁了，一直有咬手指甲的习惯，怎么改掉这个毛病？在幼儿园里或是睡觉时，都在咬手指甲，甚至咬到出血的程度。问他为什么咬？他说他忍不住。给他讲过很多道理，还用奖励的方法，如果指甲长长了，他就可以挑一个玩具，但都...


    Dr. 魏


    这和咬手指的原理是相通的。如果奖励、讲道理都没有用，那么建议再观察，孩子是否在幼儿园或家里有焦虑的事情，没有得到及时的排解；平时是否陪孩子少，孩子想通过咬手指引起家人的关注？

    另外，孩子也可能是形成了无意识的习惯，手一闲下来就会不自觉地咬嘴里咬。建议咨询儿科医生，看是否可以用有苦味的药水涂在手指甲上，或者用手套、创可贴等道具来提醒，帮助孩子打破坏习惯。


    # 5. 父母育儿观念不一致怎么办？


    从您专栏的第一篇开始学习，直到今天，一篇都没有落下过，我学会了怎么处理孩子发脾气、怎么跟孩子互动读绘本、怎么在生活中教孩子练习数学思维等等。但有一个问题一直不能解决，就是我听了您的专栏，而孩子他爸没听。有时候，我实在是不认同孩子他爸的教育方式，但又说服不了他，他是个比较固执的人，让他来学习育儿知识，他又不肯学。


    孩子跟我的关系非常好，但就是不太喜欢他爸。我也经常引导孩子，说：“爸爸虽然有时候会凶你、骂你，但也经常接你放学、带你去游乐场、给你读绘本，他还是非常爱你的，所以你也要爱爸爸哦。”但是不管我怎么引导，他还是不喜欢爸爸，这该怎么办呢？


    Dr. 魏'
