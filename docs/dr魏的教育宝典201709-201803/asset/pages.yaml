    Dr. 魏


    编程是一项非常重要的能力。在儿童阶段，它可以是一种很好玩的创作游戏，也可以锻炼孩子解决问题的能力。


    现在有很多适合儿童的图形化编程游戏，小到制作一张贺卡，大到开发一个游戏，可以让孩子们获得玩游戏的乐趣，同时也获得编程训练。


