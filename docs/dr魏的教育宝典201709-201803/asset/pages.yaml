  md: '# 《创造力：心流与创新心理学》


    《创造力：心流与创新心理学》是“心流之父”、积极心理学大师米哈里·希斯费特米哈伊用30年潜心研究的经典之作。心流是一种让人能够全神贯注在当前任务的状态，是专注力的最高境界。在非常专注的心流状态下，创造力能够得到提升。


    我之前讲专注力的时候，拿孩子玩游戏和心流做类比。从游戏的设置中可以找到达成心流的三大步骤：


    +   1. 游戏都有明确的目标，像愤怒的小鸟，就是要使用尽可能少的小鸟，打到尽可能多的猪；

    2. 很多游戏是闯关制的，游戏难度和孩子的玩游戏的能力相匹配；

    3. 游戏都有及时和全面的反馈。


    通过类比，想要孩子专注，也要借鉴“心流”理论，首先设立明确的目标，第二匹配难度，第三你要及时给孩子反馈。


