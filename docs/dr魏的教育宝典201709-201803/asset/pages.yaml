    每天我们在去学校的铁路路上，每人轮流说出二、三个词，然后把这几个词作为故事元素编成一个小故事。比如：箱子、海边、孤猴、钱。我一般是让女儿先说，然后让她听我的的，对比看看会有什么区别。刚刚开始，她就简单地把这些元素串成一句话，“一只孤猴在海边捡到个装满钱的箱子。”几次对比不同之后，女儿向我求教如何才能像我一样把故事说好。我就把我玩这个游戏的套路告诉女儿：1.定位角色：选择主角和反面人物等，主角可以是箱子也可以是孤猴（不必要限定，激发孩子的想象力），一般女儿选择过的主题我就不会重复选择。2.构想故事情节：可以自己创作，也可以是古今中外的故事作为蓝本（比如成语故事、童话故事等），结合穿越到故事中。3.设置矛盾冲突，这个对女儿比较难，需要一定的阅读积累。4.到了后期，我们进行了创新，会给故事的单个物品赋予特殊功能（就像哆啦A梦的神奇口袋里的工具一样），能激发孩子的强大人设能力，开启他们大胆设想，天马行空的编故事之旅。5.总结反思：利用Dr.魏说的发散性思维、联想性思维、反事实想象思维，帮助孩子在想象中学会解决现实问题。比如：让她分析每个人物有什么优点和缺点，有些错误行为要怎么改正的，如果你是一个角色会怎么样，根据故事培养孩子的同理心等等。


    女儿从讲一个简短的故事到渐渐地会把她看过的故事书中人物替换成今天所说的故事的人物里。故事时间也讲得越来越久，现在已经轮不到我讲故事，路上二十分钟孩子有时已经不够讲完了。有一次她不小心说错端说到了原人物，我就会心一笑但不去打断她鼓励她继续讲下去。随着时间的推移，现在故事元素词组可以发展达到最多十六个，她也可以很巧妙的把这些词安排穿插到故事中。她能把她平时看的多个故事甚至是动画片故事结合在一起，情节也不只是铺直叙叙了，加上各种开脑洞的创新想法常常会让我们笑得前仰后仰。


    总结，通过这个天天坚持的创意故事游戏，孩子既锻炼了语言表达和逻辑思维能力，最重要的是激发了孩子的创造能力，保持对这个世界的好奇心。孩子现在很喜欢阅读，妈妈也给女儿买了许多故事书，阅读量也与日俱增，前不久在一个故事比赛里得到了不错的名次。


