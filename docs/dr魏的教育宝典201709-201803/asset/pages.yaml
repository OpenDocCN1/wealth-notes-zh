  md: '# 106 | STEM教育的黄金学习法则


    Dr. 魏


    STEM教育是什么？


    上周我在专栏里预告，提到了“STEM教育”这个词，引起了一些家长的留言提问，最近我身祢也有几个朋友跑来问我这个问题，谈到什么适合未来的教育，其中就有人说起了STEM教育。


    STEM教育的概念越来越流行了，它到底是什么？


    STEM 是 科学（Science）、技术（Technology）、工程（Engineering）和数学（Mathematics）的英文书写。在美国，科学、技术、工程和数学是提高国家科技发展的重要竞争力，学习STEM领域的相关知识，既能培养出对国家未来有用的人才，也是经济发展的关键。


    看到这里，你可能想说，原来STEM教育不是什么新鲜事儿，俗话说“学好数理化，走遍天下都不怕”，这种观点在国内都流行几十年了。况且，理科教育，美国哪能跟我们比呢？很多中国父母老早就给孩子报数学班编程班了。


    回答这个问题之前，我想先请你想象一个场景，如果有一天你家娃问你：月亮为什么有时候像眉毛，有时候像饼干，你会怎么回答？你会说不知道，还是告诉孩子，月亮的阴晴圆缺是由地球的阴影造成的？或者你也不确定，找到一本相关的绘本，给孩子读一读？


    其实，这是个常见的科学错误。实际上，月亮的形状是由地球和月亮的相对位置决定的。只有月食的时候，月亮的阴影才是由地球造成的。omn不光是你，很多绘本，包括得了凯迪克大奖的作品，也常常会犯这类科学错误。凯迪克奖可看作是绘本界的诺贝尔奖啊。


    我们每天都能看到月相，也就是月亮形状的变化，我们也会从绘本等媒体中习得一些观点，可是，我们没有细心观察过这个世界，并且搜集数据资料去检验自己的旧观点。


    ![](img/bce617503caab4aa8727e0f05b5e6106_75_0.png)


    STEM教育的核心理是思维能力和学习方法


    再给你举一个例子，关于STEM教育这个词，其实有上十种变式，有人说要加入艺术（Arts）的书写变成“STEAM”，后来又有说要加入机器人（Robotics）的缩写“R”变成“STREAM”。你有没有发现这个单词越写越长了？之前也有家长留言说：“Dr.
    魏，这个词你写错了，你少写了几个字母”。


    其实，STEM教育的重点不在于多加了几个字母，它重视的不是学科，也不是你学到什么具体知识，而是思维能力和学习方法。


    STEM教育的目的创造一种跨越所有学科之上的“元学科”，通过它来教你如何运用知识探索这个世界运行的规律。研究发现，如果在STEM项目中，学生学会逻辑推理、假设验证等方法，那么他们会深入探索学科知识，成为更好的问题解决者。他们更懂创新，智商也会提高。


    # 什么是21世纪元学科理论


    我的好朋友阳志平老师提出过21世纪的元学科理论，他认为思维教育由两个黄金三角形构成，第一个黄金三角形是古典教育：它着重培养以古典哲学为基础的理性思维、数学思维和以文学诗歌艺术为代表的美学思维。


    我在专栏之前的文章里讲过的因果关系的推论、数学的三大概念、音乐启蒙等问题，这些话题就是侧重古典思维教育。然而，只有古典教育，孩子还适应不了未来科技的发展趋势。


    第二个黄金三角形，是面向未来的教育，其中包括以现代认知科学为代表的理性思维、以计算机科学为代表的计算思维、以网络科学为代表的复杂思维。


    这部分可以对应我之前讲过的大脑神经的可塑性和贝叶斯定理，它们侧重就是未来教育。这些思维教育比给孩子灌输多少知识，带他们听多少讲座，给他们买多少科学玩具更重要。


    其实，我和阳志平老师创办的爱贝睿学堂，就是希望在儿童教育阶段，给每个孩子的家庭树立更科学的教育体系，以脑认知科学为衔接，将古典教育与未来教育结合，大幅提高孩子的思维能力。


    # 抓住STEM教育的黄金时期


    回到STEM教育，你会不会觉得孩子还太小，这是他们上学之后才需要考虑的事情？其实，STEM教育包括上至博士后，下至幼儿园，一切课上或课下的学习活动。


    美国的研究发现，如果人们在孩子上幼儿园的时候，就开始培养他们对自然科学与社会科学的兴趣，那么孩子上小学后，他们在STEM领域的成绩会大大提高。一个受过STEM教育的孩子，他应该是在一个科学友好的环境中长大，比如父母和老师鼓励他提出问题、他会批判性地思考问题、会用实验等方法去验证他的推理。


    女孩会不会天生学不好科学？或者你家是男孩，男孩会不会天生学不好写作？研究发现，男孩女孩在脑科学层面上差异非常小，所以你千万不要被一些男女偏见所误导，影响孩子的发展。另外，空间认知和写作等技能都是可以通过练习改善的。


    学习的根本机制是大脑神经可塑性，也就是在学习的过程中，大脑的能力会扩大。学龄前儿童神经可塑性最好，他们的学习力也最强。所以，越早学越能消除能力上的性别差异。


    虽然宝宝的学习能力好，但这并不代表你要像老师一样，给他们上课、刷题。孩子静坐的能力很差，注意力也不容易集中，像上课一样给他们解释科学概念，孩子一般不爱听。2011年的一项研究表示，如果在给孩子玩玩具之前，指导他们说“我给你解释一下这个怎么玩”，这通常都会降低孩子的好奇心和学习的自主性。


    那么，STEM教育到底应该怎么教？


    # 1. 从孩子的角度出发，像孩子一样教孩子


    我给你的第一个建议是，从孩子的角度出发，像孩子一样教孩子，鼓励他们自己去实践，找解决问题的方法。


    美国有一档儿童教育节目叫芝麻街，他们也想给孩子STEM教育。不过，他们不是找了一位全能全知的老师形象来教，而是找了一位十分特殊的角色。


    他们从15个不同的角色中，选择了看上去最懵的一个角色，这个角色做事情昌冒失的，对STEM一窍不通，而且总是失败。但是，他对任何事情都保持好奇，而且他从来不害怕犯错。你有没有发现，这个角色很像你家的好奇宝宝？


    这个角色确实也成为了最适合教孩子学习的科学老师，一方面孩子从自身上看到了自己的影子，对它更有兴趣。而它呢，刚好教会了孩子一个基本的学习方式，就是对世界保持好奇，并且在不断试错中学学习。


    如果你想教孩子STEM，那么首先要放开爱说教的大人架子，允许孩子犯错，也允许你自己犯错，让孩子知道学习的过程是不断试错的过程。然后，多找些强调实践、贴近生活的科学活动，鼓励孩子去探索问题的解决方案。


    # 2. 沿着学习路径教孩子


    有哪些贴近生活的科学活动呢？认知心理学家罗歇尔·格尔曼（Rochel Gelman）认为，想学习完全陌生的概念比较困难，学习你已经熟悉的概念则要容易得多。因为这些旧概念就像已经开辟的小路一样，从这些“学习路径”出发，能带我们走得更深。


    对于孩子来说，有哪些适合他们的“学习路径”呢？格尔曼认为可以有下面几种：


    +   - 生物的生长和周期变化（比如带孩子养蚕，观察蚕的生长发育）


    +   - 生物如何移动（比如比较人是如何直立行走，而乌龟是怎么爬行的）


    +   - 生物和非生物内部构造的不同（比如比较玩具机器人和人体构造的不同）'
