    # | 金牌家长-可爱的Q


    分享主题：多人口家庭，如何帮孩子控制情绪？


    Dr.魏在专栏分享过孩子的情绪问题，为家长做出了科学的解释，传授了一些控制情绪、培养情绪控制能力的方法。我看了（包括）姑几遍，我想给Dr.魏做个补充。


    根据我个人的经验，谈谈我的看法。


    家庭成员越多，孩子的情绪越难控制，这里也存在隔代教育问题。我了解到现在有些年轻父母，因为祖辈带孩子容易溺爱，造成孩子长大后非常任性，动不动就哭闹，有些孩子变得很不讲理。


    所以，两代人产生了矛盾，甚至有的妈妈全职在家带孩子，剥夺了祖辈对孙子辈的管教。在这里，我不评价对错，其实我家里也是这样的。我分享的是个故事，你可以借鉴。


    （1）家人要统一意见，不要让孩子的认知出现分歧


    因为家里人多，意见很难统一，认知也难以统一，行动上更难统一


    孩子一岁多点的时候，因为会爬、会扶着东西走，存在的不安全因素更多了。带孩子的人为了让孩子安稳的坐着，自己好去做点事情，于是就打开了电视机，让孩子看。


    另一个家人看到，认为这种做法不对，会伤害孩子的视觉神经。于是就产生了分歧。先放下大人的矛盾，别看孩子才一岁多，它是有自己一时的，后来她要看电视，就会去找那个允许她看的家人。


    还有一点，孩子要看电视时，除了找那个让她看的家人，让她看电视的人如果不同意，她也只是对着这个人吵闹。平时就反对比她看电视的人，她不会去找，她似乎知道找了也没有用。'
