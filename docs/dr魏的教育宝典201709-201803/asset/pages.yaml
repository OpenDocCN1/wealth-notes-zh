  md: '# 099 | 宽容孩子的“磨蹭”


    Dr. 豫


    孩子做事磨蹭，长大会有拖延症吗？


    很多家长都曾为孩子做事“磨蹭”头痛。前几天，我朋友上班时间有精打采，问了情况才知道，是因为孩子拖拉，起床、刷牙、洗脸磨 mengh 呢的，喊他也不听，常常坐着发呆。


    本来早上只有半小时的出门准备时间，接着要开车送他去学校，孩子一拖拉起来，动不动四五十分钟就过去了，每天起得早，我们大人睡眠不足，小孩被批评，心情也不好。


    不知道你有没有类似的烦恼？其实，孩子“磨蹭”并不总是故意在拖延，而是他们的发展特点决定的。今天我来告诉你孩子磨蹭背后的原因，再给你分享一些方法，解决这个难题。


    身为成年人，你觉得怎样做事才算不磨蹭？一般来说，你可能希望孩子一鼓作气，做完一件事，中间不停止，比如洗脸就洗脸，别打开水龙头开始玩水。或者你希望孩子做事情速度快，比如3分钟洗完脸。再有，事情要做对、做好，洗完脸之后脸上还有饭粒，这也是不合格的。


    # 1.孩子好奇心强，注意力容易被分散


    对于孩子来说，要想做到以上这些事情，真的不容易。首先，孩子好奇心强，注意力容易被分散。


    其实这正有助于孩子的发展，他们对很多事情都好奇，会注意到大人觉察不到的有趣事物，因此，这些事情反而是他们学习的过程，比如打开水龙头，他发现里面有水流出来，可能会想“这水从哪里来呀？为什么水有时候凉、有时候热呀？”这段时问，在你看来就是发呆、磨蹭。


    注意力容易分散这个发展特点决定：小孩子在完成比较复杂的任务时，需要你的提醒和帮助才能把注意力集中到需要做的事情上。


    # 2.孩子的计划、执行能力比较差


    孩子的计划、执行能力还比较差，有些在看起来很简单的事，孩子做起来的确很难。


    还用洗脸来举例，你觉得洗脸就是两分钟的事，对不对？实际上孩子需要拧开水龙头，弄湿毛巾，关上水龙头，用毛巾擦洗自己的脸，注意脖子和耳后……这里的任何一个步骤出差错，都会影响洗脸“效率”。


    再有，比如穿衣服时，系鞋带、扣扣子都需要掌握熟练的精细动作技能，孩子需要花时间练习。所以，我想提醒你，不要按照自己的标准来要求孩子。


    # 3.小孩子很难预期未来


    小孩子通常很难预期未来。我们在养孩子过程中，经常出现我那位朋友说的“大人着急，小孩子不急”的情况。这是因为大人能够预见到事情对未来的影响。比如孩子没吃完饭，爸爸会想象，出门晚了，路上可能堵车，所以上班迟到，会被扣钱，还可能挨批评……而孩子呢，他是真正的“活在当下”，不会想后果。


    # 4.孩子不能很好地理解时间的抽象概念


    小孩子还没有搞清对时间的抽象概念，他既不明白“马上”有多快，也理解“25分钟”或者“7点45之前”是什么意思。所以，你只告诉孩子“10分钟内必须吃完饭”，他可能也没办法接收到你传递的信息。


    帮孩子一起解决让他拖延的具体问题


    拆解任务，用最小的控制单位


    列计计划清单


