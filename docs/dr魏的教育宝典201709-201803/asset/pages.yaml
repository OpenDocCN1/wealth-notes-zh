    # 十万家长见证的一个奇迹


    专栏刚上线时，我非常担心。一者担心中国有那么多家长会感兴趣学习儿童脑科学吗？毕竟，儿童脑科学对于多数家长来说，是一个新鲜事物。送孩子玩具，孩子能立即玩起来；听专栏，更多是通过改善爸妈的观念再来间接影响孩子。


    另一个担心则是如何平衡专业严谨与科学传播？脑科学研究边界明显，比如，流传很广的右脑开发来自裂脑人研究，并不适用于正常儿童。同时，儿童教育与脑科学的结合，即使在专业领域，也是个前沿话题。但作为科学传播，又要求通俗易懂、有趣有效。


    这是一个不小的难题。因此，在一年前刚启动专栏时，我给自己立下了三个约定。它必须通俗易懂，工作再忙，你也愿相见。它必须实用，能够实实在在帮上各位爸爸妈妈。最重要的，它必须科学靠谱，明辨真伪，减少你的纠结。


