    《第五个》是五个受伤的玩具，排排坐，怀着恐惧的心情等待去另外一边的房间。其实，房间的另外一头是可以修好玩具的医生。两本绘本可以锻炼孩子克服未知的期待和恐惧。其中，《第五个》曾获得博洛尼亚国际儿童书展绘本大奖。


    给家长的课后读物：《好绘本如何好》


    作者郝广才，得到专栏《郝广才·今天》主理人


