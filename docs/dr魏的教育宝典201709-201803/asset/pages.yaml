  md: '# 086 | 怎样科学培养孩子的“情商”？


    Dr. 糖


    怎样科学培养孩子的“情商”？


    这里的“情商”是加引号的，其实是培养孩子的社会情绪能力。


    为什么“情商”要加引号呢？你有没有这样的感觉，上学的时候，经常会听到周围的人说：“这个孩子考试成绩真好，真聪明，智商高”，等你踏入社会，又会听到周围的人说：“这个人会说话、办事妥帖，情商真高”。


    于是，很多家长开始注重从小培养孩子的“情商”。可是，如果你问我，“怎么培养孩子的情商呢？”说实话，这个问题我一下子很难回答，那么我先来提个问题：你觉得什么是情商？接下来，我带你认识三个孩子，你帮忙看看，他们情商怎么样？


    第一个孩子是贝贝，5岁了，他跟着妈妈去朋友家做客，吃饺子的时候睁着大眼睛看着妈妈的朋友，说：“阿姨你做的菜真香！我特别爱吃！”


    # 情商的源头：情绪智力


    最开始正式提出“情商”理论的人，是美国心理学家萨洛维和梅耶。1990年，他们发表了一篇论文，提出“emotional intelligence”这个概念，中译叫“情绪智力”。传到国内，大概是为了跟“智商”相对应，就被翻译成“情商”了。


    # 情商智力跟认知能力相关


    情商智力不是认知能力，而且比其他认知能力更重要，这其实是戈尔曼对于情绪智力的误读，情绪智力也跟认知能力相关，并不是毫无关系。


    # “情商比智商更重要”这句话，不靠谱


    其实情商和智商没什么可对比的，因为它们根本不是对立的概念。网上有一句话很火——“成功80%来自情商，20%来自智商”，这个说法就来自戈尔曼。


    # 如何培养孩子的社会情绪技能


    其实，你关心的情商，是希望孩子有一些人际交往相关的技能。这些能力可以统称为社会情绪技能，比如识别情绪，表达情绪，调整情绪，合作能力，毅力等。这些社会情绪技能综合在一起，就变成你口中的“情商”了。


    +   (1) 如果你希望孩子像贝贝一样，会恰当地赞美别人，那么你需要注意：教孩子用积极的眼光看待人和事，鼓励孩子敢于表达，培养孩子的语言能力，培养孩子的同理心，也就是设身处地地理解别人的感受。


    +   (2) 如果你希望孩子不要像子子一样，妈妈被砸痛他还笑，还只顾自己的感受，不会安慰人，那么你需要注意：培养孩子的同理心，通过表情、声音、肢体语言等信号判断别人的感受。比如妈妈皱眉、大叫“哎呦”，都是表示不舒服，明白情绪会变化，用恰当的方式帮助别人走出坏情绪。


    +   (3) 如果你希望孩子不要像乐乐一样，输不起，还发脾气，那么你需要注意：教他识别情绪，弄清楚目前的情绪是什么'
