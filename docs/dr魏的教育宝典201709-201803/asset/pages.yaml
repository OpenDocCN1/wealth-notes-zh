    5.白噪音可以改善睡眠质量吗？


    # 1.什么是科学的睡眠训练方法？


    之前一直是把女儿哄睡着了再放到床上,最近按照一本育儿书的说法,开始训练21个月的女儿独立入睡。晚上一点左右把有睡意的孩子放进小床,她就开始挣扎站起来和哭求拥抱,我们不断地把她平躺放下,守在旁边,偶尔说几句“爸爸妈妈在旁边陪你”。


    一个晚上回来放下20多次,孩子哭了近半小时,才慢慢自己入睡。如此训练孩子入睡,看着哭得超伤心的女儿,家人心里很 是煎熬。请问这种方法科学吗？


    Dr.魏


    每位父母都听不得孩子哭泣,我理解你的感受。首先,孩子哭这个问题,要分不同的发展阶段来看。我的好朋友、爱贝睿家长教练陈亦老师对婴儿哭声有深入的研究。她说,0~3个月是宝宝跟世界建立信任的关键期,这时候小宝宝哭,反映了他真实的生理需要,他可能是饿了、哪里痛了、要拉臭臭了,其实,6个月前的宝宝都要尽量多安抚、多满足。


    如果过早地忽视宝宝的需求,不去安抚宝宝,美其名曰培养独立精神,其实是摧苗助长的行为。


    当然,这并不是说宝宝一哭,你就得像飞人博尔特一样飞奔过去抱他。你可以先观察一下,有的宝宝面对焦虑和紧张会哭,有的宝宝睡觉之前会哼唧几声,过一会儿自己就睡了,
    这都是自然的反应,你不需要每次都“抱”他。你可以检查一下宝宝遇到了什么问题,告诉他“我们在这里”,给他一些安抚物,抚摸他的背让他不要紧张。总之,要回应宝宝的需求,
    但是回应方法可以灵活。


    你家娃21个月大,假设已经跟爸爸妈妈形成了安全的依赖关系,如果她过度依赖哄睡,导致睡眠质量很差,甚至影响家人的正常睡眠,那可以试一些靠谱的睡眠训练方法。


    如果孩子持续性地大哭,你可以停一会儿再进入房间照料,逐渐拉长进房间的时间,比如隔三分种、五分钟、十分钟再去回应孩子,不一定要抱,回应的方法要灵活。


    最后,记住温柔而坚定的原则,不要时而态度强硬,时而心软,这只会伤害你跟孩子之间的信任关系。所以,你们全家人首先要统一目标,不要产生分歧。如果家人一致同意进行睡眠训练,白天的时候,要给孩子高质量的陪伴,让孩子有安全感。


    # 2.孩子与父母该不该分房睡？


    看过一些信息,说孩子要尽早地与家长分床分房睡,这样对孩子的成长更有利,也对夫妻关系更有利。这是正确的 吗?几岁开始分房睡比较好呢?


    Dr.魏


    美国儿科学会建议,为了安全起见,在理想的情况下,婴儿一岁前应该在父母的卧室睡,至少,头六个月要在父母的卧室睡。所以尽早分房睡的说法肯定是不对的。那之后呢?


    我还听过一种说法“在孩子进入三岁前,必须把他们从父母的床上赶走”,这种说法的依据是弗洛伊德的俄狄浦斯情结假说,也有家长问过我不分房睡会不会导致孩子性早熟?


    在这里,我统一回答,这些都是没有科学依据的。由于基因和环境的不同,每个孩子的睡眠模式都不同,有的孩子比较敏感,更需要家长的陪伴;有的受家庭环境限制,没有办法实现分房,这都是正常的,你可以根据自家的具体情况来决定要不要分房。


    由于历史原因,跟宝宝分房睡在美国的中产阶级里流行开了。睡眠专家查德·法伯(Richard Ferber)在1985出版的书中建议,家长不要跟孩子一起睡。不过,越来越多的研究发现,到6岁仍然和父母一起睡的孩子,和老早就单独睡的孩子相比,在社交、情绪等方面并没有显著区别。


    还有研究发现,跟爸妈一起睡的孩子,其实现在更独立、更外向、更自信。仔细想想也合理,如果逼迫孩子分房睡,让他天天带着焦虑睡觉,只会带来反效果。


    如果你把眼光放到全球范围,会发现和孩子一起睡其实是接近90%的人的做法。即使是在推崇单独睡的西方,在过去二十多年里,也有越来越多家庭选择跟孩子一起睡了。


    查德·法伯在2006年修正了他的说法,他写道:“儿童不会因为远离父母,一个人睡或与其他兄弟姐妹一起睡而成长为缺乏安全感的孩子。同时也不会因为跟父母一起睡而学不会独立。无论分不分房睡,只要是你觉得舒服、正确,就可以。”


    可惜,国内的育儿理念总是要晚几十年,至今仍然有很多国内“专家”宣称一定要越早分房睡,到底怎么辨别信息的真假?教你一招,其实每位家长心里都清楚,育儿问题上只要不涉及安全等原则问题,都没有“绝对”一定”或“必须”要去遵循的方针,因为每个孩子都是不同的,都要具体问题具体分析。


    # 3.父母和孩子的作息时间表不一致怎么办？


    爸爸妈妈白天上班,晚上基本八点多才到家,就想早一点睡觉休息了。但是宝宝总想着很多跟爸爸妈妈玩,所以熬到晚上10点,甚至凌晨一点,也K肯睡觉。这样宝宝睡得晚,大人也得不到休息,小问题产生大苦恼!


    Dr.魏


    现代人下班时间比较晚,跟孩子相处的时间少了,很多孩子都会这样,不愿睡觉硬撑着,想跟爸妈多玩会儿。


    既然你无法决定自己下班的时间。那么建议你回去后陪孩子玩一会儿,但还是让孩子有合理的作息时间,该睡觉就睡觉。孩子有时候不愿意睡,是因为觉得跟你玩得不够,你可以提前跟他商量好,早上起早一点再一起玩,要是睡晚早上就玩不了了。


    不是让孩子配合你的时间,而是你尽量配合孩子的作息时间来,早起一些,陪他玩儿。毕竟调整你的作息时间,要比孩子容易得多。


    也有一些孩子的情况是反着的,有的家长为了多陪孩子,晚上刻意让孩子晚睡些。


    首先,如果宝宝的精神状态良好,所谓的晚睡一点,只要符合他的生物钟,就没有关系。但是如果宝宝已经昏欲睡,脾气不佳,却仍然让他保持清醒,这会打破宝宝正在发育的睡眠模式,可谓是捡了芝麻丢了西瓜。


    而且,如果宝宝已经累了,硬拉着不让他睡,即使和爸爸妈妈玩,也玩得不开心,你们也不开心。不如尊重他的睡眠模式,晚上少玩一会儿,到点就睡觉;那么在早上和周末,你们会收获一个生机勃勃、心情愉快的宝宝!


