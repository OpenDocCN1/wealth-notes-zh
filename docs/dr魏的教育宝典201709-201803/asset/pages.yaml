  md: '# 127 | 宝宝脾气倔：认知灵活性不够


    Dr. 魏


    孩子很倔强怎么办？

    不知道你家孩子会不会这样：


    玩游戏只玩老三样，遇到稍微难一点的新游戏就放弃，也找不到人帮忙，就躲在那边发脾气。


    写作业，一感觉有地方没写好，不能拿满分，干脆全都不写了，作业常常完成不了。


    在日常生活中，很多事情一定要按照他的习惯来，比如喜欢的衣服就连续穿好几天，坚决不换新衣服新裤子。


    你可能想说，我家娃就是顽固、倔脾气。其实，当需要从一个活动切换到另一个活动时，很多孩子容易 drugie，这是因为他们的认知灵活性还不够。


    # 认知灵活性帮助孩子适应变化


    认知灵活性是非常关键的认知能力，关系到孩子能不能根据不断变化的需求，“放弃”旧的做法方式，用新的方式思考、看待事物。


    比如，一个能设身处地替他人着想的人，他要从思考自己的角度，转换到思考他人的角度。一个能看到事情的两面性的人，他能从只看事情好的一面，转换成看到事情坏的一面。


    灵活的思维在各类学习中也起着关键作用。思维灵活的孩子，能更好地适应新变化和新信息，八面玲珑地解决问题，就算是失败也能不断提出新方法。


    相反，认知不灵活的孩子，习惯用具体、僵化的方式思考问题。他们很难从旧思想中“换挡”，比如坚持用“狗刨式游泳”，认为自己学不会其他泳姿；就算不懂做数学题，也不知道该向家人、同学或者老师求助，只能跟自己着急。


    思维僵化还有另外一个弊端，就是除了一些基本的做法方式，难以创新或超越常规。如果不懂得帮孩子提高认知灵活性，随着年龄的增长，孩子会越来越难以承担新工作，甚至无法很好地适应未来世界。


    不过，你不用过度担心，随着孩子大脑的不断发展，认知不灵活的症状可能会减轻。而且，就像我们可以去健身房运动，锻炼我们身体的灵活性一样，我们也可以锻炼大脑的认知灵活性，更好地解决生活中的新问题。


    那么，具体可以怎么做呢？


    # 1. 教给孩子自我说话的技巧


    思维固化的孩子，有一个共同的特点是对问题的反馈不足。看到问题之后，他们会直套答案，而不会进一步思考。


    想要提升孩子对问题的反馈能力，一个有用的技巧是教会孩子自我说话的技巧，把思维步骤说出来。


    # 2. 教孩子用不同的方法做同一件事情


    一些思维比较顽固的孩子，他们很难理解，你可以用不同的方法来处理同一件事情这个道理。怎么让他们理解呢？


    # 3. 鼓励孩子尝试各种新事物


    除了改变旧规则，你也可以适当给孩子引入一些新事物。'
