    \n对左右大脑的粗暴划分，包括像右脑开发这样的概念的流行，有两个原因：第一是对左右脑的划分，看似满足了我们对大脑这样复杂器官的理解的需求；第二，它可能为商家提供了一个全新的卖点。因为这样，所以才流行起来。\n\
    \n★ 延伸：如何帮助孩子锻炼大脑？\n\n+   1. 多玩发散性思维游戏，包括找一找日常事物的奇怪用途、完成一项任务的不同方法等；\n2. 用发散性思维游戏的思路，结合家里常见\
    \ 的物品和玩具，根据生活场景，创造自己 的游戏。\n\n推荐阅读\n《001 | 大脑“暗能量”，打开创造力》\n\n# [蒙氏教育]\n\n★ 提示：蒙氏教育有效果，但不要神化。蒙氏教具可以买，但不必过于迷信。\n\
    \n★ 评价：蒙氏教育，是指蒙台梭利教育，它是由意大利教育学家蒙台梭利女士，在上个世纪初提出来的一套，教育实践方法。\n\n蒙台梭利和合作者们发展了很多教具，用来培养孩子各方面的能力，比如说，专注能力、动手能力、归类能力等等。目前很多基于蒙氏理念的教育机构会用到这些教具。\n\
    \n当代有位儿童心理学家Lillard教授写了一本书，叫Montessori: The Science Behind the Genius，中يفة翻译过来是《蒙台梭利：天才背后的科学》。2006年，她对蒙氏教育的研究，发表在国际顶级学术期刊《科学》上。她表示，蒙氏教育，得到了当代心理学家研究的支持。\n\
    \n蒙氏教育也存在一些不足。\n\n比如在蒙氏教学中，孩子使用教具不叫玩，而叫工作，它不主张孩子玩假装游戏，认为那是在浪费时间。但其实，假装游戏对孩子成长非常重要，能够提高孩子的社交能力、想象力、规则意识等。\n\
    \n另外，蒙氏教育强调让孩子自发探索，忽视老师和家长对孩子“跳一跳，够得着”的帮助。这样一来，孩子往往只是在舒适区里学习，很难进入学习区。\n\n最后，还需要提醒一点的是，虽然Lillard教授的书，名字叫《天才背后的科学》，但这不代表蒙氏教育能够培养出天才来。目前科学界的共识是，没有证据表明，蒙氏教育比其他教学方法更加优秀。\n\
    \n★ 延伸：怎么培养孩子的心理理论能力？\n\n+   1. 从语言开始；\n2. 跟孩子一起玩假装游戏；\n3. 让孩子玩角色扮演游戏。\n\n推荐阅读\n\
    《050 | 假装游戏，玩出社交小达人》\n\n# [闪卡]\n\n★ 提示：远离快速记忆，给孩子成长的时间。\n\n★ 评价：什么是闪卡？它其实就是一种纸做\
    \ 的卡片，用来教文字、数字等。以教文字为例，卡片正面是图像，比如一个苹果；背面是苹果这个汉字。家长拿着一沓卡片，让宝宝看苹果图像，同时给他念苹果，每次显现时间在一秒以内，速度很快，所以叫闪卡。\n\
    \n杜曼闪卡是闪卡中的一种，它是美国人格连·杜曼在上个世纪50年代提出来的，主要用于治疗脑损伤儿童。但是杜曼的理论在诞生没多久，就受到主流学术界的否定。美国儿科学会分别在1968年和2010年批判了杜曼的理论。\n\
    \n闪卡本身是有一定的科学依据的，但杜曼闪卡就是伪科学了，因为，它只是让孩子被动暴露在大量快速切换的信息下。\n\n孩子是用多感官认识和理解这个世界的，越小的孩子更是如此。只让孩子被动地、快速地看闪卡，他可能因为机械记忆能力强，能够一时记住某个汉字、某个数字，但无法理解这些符号的具体意义。\n\
    \n如果你不相信快速减肥、快速致富，那么，也请你远离所谓的快速记忆，给孩子足够的时间成长。\n\n★ 延伸：如何提升孩子的记忆力？\n\n+   1. 重复越多，记得越牢；\n\
    2. 联结越多，记得越牢；\n3. 越会分块，记得越牢。\n\n推荐阅读\n《072 | 活用三个方法，提高孩子记忆力》\n\n# [早教机构]\n\n★\
    \ 提示：早教班并不是非上不可。\n\n★ 评价：早教问题不能一概而论，要考虑的因素很多，比如，早教班的老师是否 有经验、有水平？根据孩子年龄来看，师资是否恰当？环境是否有保障？对于小宝宝来说，还要考虑距离。\n\
    \n最后，也肯定要考虑到费用、性价比，毕竟现在的早教班动不动就几万元，平均一节课下来，怎么也得200元左右。\n\n当然了，好的早教班，确实能在一部分时间和培养方式上帮助新手父母，同时，也能给孩子提供一个小小的社交环境，对孩子的能力提升也有一定帮助。\n\
    \n作为父母，你千万不要把“宝”押在别人身上。早教班再好，也替代不了你给孩子的培养和影响。你和孩子的语言交流，你小时候给他受托，你和他一起做游戏，一起读小人书、一起堆沙子、一起跑过林荫路，这些都是他最重要的早教。\n\
    \n如果你能多知道一点靠谱的、科学的育儿知识，并在陪伴他的时候应用上，那就更完美了。\n\n★ 延伸：如何发展孩子的兴趣爱好？\n\n+   1. 早教机构分类多，根据不同年龄选择合适机构，比如美式早教、蒙氏早教、日式早教等；\n\
    2. 大脑偏爱节奏，你可以教孩子用节奏玩音乐、用节奏玩音乐。\n\n推荐阅读\n\n+   1. 《056 | 孩子学音乐有什么用？》\n2. 《057 |\
    \ 听莫扎特音乐的孩子更聪明？》\n3. 《家长分享 | 早教篇》\n\n——◆ 有奖征集·一起见证 ◆——\n\nDr. 魏\n\n这是家庭教育宝典陪伴你的第274天，专栏的订阅人数也即将超过8万，感谢数万家长的支持鼓励与积极分享。这十个月的时间，你最大的收获是什么呢？有什么被颠覆的过往认知吗？宝宝最令你欣喜的一个变化是什么？\n\
    \n希望你把这些珍贵的学习收获，记录下来写成留言，让我与万千家庭一起见证"
