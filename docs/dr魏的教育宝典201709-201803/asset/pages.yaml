  md: '起初我俩只是打个招呼，各走各的，快到山脚时，她突然对我说“你们家爸爸对孩子真好，愿意抱着她，我们家爸爸，从孩子出生到现在，抱他的次数一只手就能数过来”。我这时才注意到，远远的，女儿坐在珠爸肩膀上，而那个男孩则跟在后面，仰着头看着女儿。我一边对男孩和他的母亲感到惭愧，一边也庆幸我女儿有个称职的父亲。


    回想养育女儿的三年，真的很幸运，因为我始终都不是一个人在养娃，除了家中老人的全力帮助，珠爸的爱心投入更是让育儿这件事原本复杂的事情，变得更加简单、高效。


    # （1）粗放的养育方式与妈妈形成互补


    我是个女汉子，但很多时候，当孩子想要尝试新颖的、有一定危险性运动时，我还是会本能的反对。每到此时，珠爸都会挺身而出，一副超人的模样，站在女儿身旁，大声说“去玩！我和你一起！”然后两个人就默契的玩开了。


    女儿挑战高难度动作时，珠爸会从旁给出一些实质性指导，如让女儿往右移动一点，或是换个脚试试、先向后再向前、手先抓住脚紧跟其后等，这些具体的操作方法远比单纯的贴身保护来得实在。


    女儿生来肢体灵活，有了珠爸的指导简直如虎添翼，经常能独立完成很多小学生才能完成的运动，比如攀岩、高空走道等。而因为珠爸的全程保护，我通常也很放心，随他俩玩耍，对周围偶尔的质疑视而不见。


    现在，珍珠勇敢的很，不仅各项运动难不倒她，学习和生活中也勇往直前，像当众表演节目、与初次见面的外国人聊天、向陌生人问路、拒绝别人插队等事也不在话下，即便一开始感到害怕，在珠爸的“怂恿”下也都能顺利完成。而且，由于珠爸在女儿运动中一直给予技术上的指导，让她很习惯在遇到困难时想办法、动脑筋，有时不用我们出主意，自己也会调节节奏或借助外力，俨然一副独立自主的强大模样。


    # （2）细腻的情感体与女儿高度融合


    在女儿成长道路上，有一段时间她对珠爸比较抗拒，常对他发脾气。她心情不好的时候，珠爸如果碰到她，她就会默默用手把被珠爸碰过的地方“ Vinci ”，然后用力“扔掉”。睡觉醒来，如果看到的不是我，而是珠爸，就会用脚把珠爸踢开。


    如果不得已珠爸哄她睡觉，她就会赌气一个人睡一头，不给珠爸靠近。犯了错误，珠爸批评她，她会大喊“你干什么啊！”然后独自落泪。


    我不明白珍珠为什么要这样，她和我在一起时非常乖巧可人。好在珠爸真的很少为此生气，他这样解释女儿的行为，“每个人都有负面情绪，珍珠是把我当宣泄对象，朝我发泄负能量，就说明我对她来说是有用的。”我真心佩服珠爸精巧绝伦的“换位思考”。


    现在，父女两感情好了很多，但偶尔也有小插曲。前些天，珠爸给珍珠买了支点读笔，可以点读配套的英文书。女儿迫不及待拿来用，在听了一大串英文单词后，生气地用力 ссы点读笔，珠爸打趣，捏捏她的脸，结果又被用力地“
    Vinci ”“扔掉”了。珠爸没说话只是在一旁陪着她，等她自己平静。


    事后，珠爸和我说，“珍珠一定是听这么多生词，发现一下学不会，才生气的，她不是生我的气，她在生她自己的气，真是要强的孩子啊。”以我对女儿的了解，他的看法我是赞同的，但也不经感叹珠爸的细心。一个大老爷们，对孩子的心思体会这么透彻，还能在事情发生时做出合适的处理（静静的陪伴），实属不易。


    # （3）多样的教学方式与科学育儿相符


    珠爸其实挺喜欢新鲜事物的，对最新的育儿理论也很感兴趣，常会发些靠谱的文章或视频给我。《Dr.魏的家庭育儿宝典》就是他推荐我订阅的，还嘱咐我看到好文章一定要转发给他。我会记录孩子的成长，他有时也帮忙定主题、提意见，是个不折不扣的super
    papa。


    在女儿学英语这件事上，珠爸应该算挺下功夫了。我们家的情况是，我的英语水平低，但发音相对准确，珠爸英文水平高一些，但口音很重。所以我们在给珍珠读绘本时，一般珠爸会先做好翻译，再从理论上纠正我的发音，然后再由我给珍珠听。


    珠爸可能觉得这不是长久之计，就下载了英文口语练习软件，没事会抱着手机练发音。另外，还给车子增加了蓝牙接收功能，接送珍珠的途中会播放英文儿歌，带着女儿一起唱。


    回家也会一起看英文版的动画片，有时是《海底小纵队》，有时是《爱探险的朵拉》，一边看，一边进行简单的单词教学。最近还精心挑选了附带启蒙英语教程的点读笔，辅导女儿自学英文。


    现在，女儿时不时能冒出简单的英语短句。例如我们在聊海底小纵队的成员时，她会说“Penguin is a doctor（企鹅是个医生） Beer is a captain（熊是船长）”，在说家里有哪些玩具时，会说“I
    have a green sheep（我有一只绿色的羊）”。虽然只是很简单的短句，但我们仍然非常喜欢。


    前段时间，网上流传“爸爸是育儿路上最大的绊脚石”，说的是很多父亲不懂怎么带孩子，只会一味的宠爱或放任自流，对比一下我家的爸爸，真的要好太多，值得专门写一篇，以fmt鼓劢。


    最后，育儿是一件“喜忧交加”的事，孩子的每一点进步当然让我们喜悦，但过程中的困惑与担忧也常常让我们劳神，好在我不是一个人在战斗，还有珠爸这个“好帮手”。


    育儿也是一个“教学相长”的事，我们在和孩子一同成长，这个过程不仅孩子会有阵痛，我们也会有，好在我不是一个人在面对，还有珠爸这个“共同体”。


    谢谢一路上有你相伴，因为你的努力，我的育儿道路走的不算曲折，因为你的努力，女儿享受了更加完整的呵护，感谢有你。


    Dr.魏


    珠爸就是传说中“别人家的爸爸”啊！文可教女儿英语，武能带女儿运动，心思细腻，好学上进。咱俩留言区恐怕要被美美口水淹没了。


    不过，与其羡慕别人家的爸爸，不如自家爸爸是猪队友，不如想想办法，怎么把他训练成好帮手。之前咱们在《好爸爸使用手册》中学习了三个原则：1、尊重爸爸带孩子的方式；2、给爸爸成长的时间，多肯定，少批评；3、给爸爸清晰、具体的指令。


    持之以恒，相信你家爸爸也会越来约会带娃。如果错过了或者想复习这篇文字，可以点击下面的推荐阅读，赶快学习起来吧。


    本期推荐阅读：《好爸爸使用手册》


