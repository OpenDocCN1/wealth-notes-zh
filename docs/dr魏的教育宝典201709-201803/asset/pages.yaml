  md: '# 133 | 团体运动的注意清单


    133 | 团体运动的注意清单


    Dr. 魏


    该不该送孩子去运动兴趣班？


    大家可能都知道，我是研究人脑是怎么控制运动的，自己当然也是非常喜欢运动。前段时间有朋友问我："我儿子快四岁了，该不该给他报个足球班？一来可以加强运动量，二来锻炼孩子的竞争意识。"


    现在有很多运动兴趣班，像是足球班、舞蹈班、游泳班。有 SAM 的运动班挺好的，给孩子接触各类运动和融入团体的机会，不过，给孩子报班之前，有几点我要提醒你。


    # 1. 三岁以下不适合团体运动


    对于大部分三岁孩子来说，他们的身体还太年轻，不适合参加团体运动。团体运动是指一些规则简单、多人一起的运动游戏，比如踢足球、打篮球等。


    一般来说，要等到三四岁以上，再参加团体运动比较合适。因为这个时候孩子的运动系统才有很大的发展，不仅仅是肌肉骨骼更好，而且身体的协调能力和平衡能力更好，他们能更好地控制自己的身体了。


    # 2. 不要带着"赢"的目的去进球


    如果孩子身体运动控制达标了，那么我们就可以让孩子在团体运动中锻炼他的心智能力了。因为，真正地享受团体运动，其实需要孩子的心智能力达到一定的标准。


    # 3. 分年龄、分能力来对待竞争活动


    不过，对那些低龄的、心智还不成熟的孩子而言，他无法站在别人的角度看问题，对待输赢往往会有偏差。一些研究指出，让心智不成熟的孩子之间产生竞争性比较，对孩子有害无益。不仪伤害自尊，而且还降低了他们的认知能力和创造性。


    # 4. 卸下功利心


    孩子的心态要纠正，你的心态也很重要。给孩子报运动班的另外一个前提是，他不是被强迫才报班的，他自己要喜欢运动。我反复叮嘱过了，六岁以下以兴趣学习为主。


    # 5. 运动种类要均衡


    对低龄的孩子，我希望你挑选的运动种类可以多一些，保证种类均衡。比如有耐力类的像跑步、骑车等，也有力量型的比如短跑、跳绳等，也有技巧性的比如拍球、跳舞等。因为这个时候大脑控制运动的各个方面都比较差，需要全面的锻炼。


    # 6. 同步运动的启示：团体运动促进合作和分享


    很多团体运动都会让孩子之间进行直接的竞争，那为什么说团体运动可以促进合作和分享呢？这个原因除了队友之间有合作和分享之外，还有其他的原因，其中之一就是所谓的同步运动。


    今天通过要不要给孩子报运动兴趣班这个问题，我给你列举了一系列团体运动的注意清单，再来总结复习一下：'
