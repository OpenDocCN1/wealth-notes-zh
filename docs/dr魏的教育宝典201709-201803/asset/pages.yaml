    # —— 本周问答时间 ——


    +   1. 如何帮孩子和自闭症儿童友好相处？

    2. 孩子晚上常常做不开心的梦怎么办？

    3. 妈妈决定了孩子的智商吗？

    4. ABA（应用行为分析法）会让自闭症儿童变得机械化吗？

    5. 要给孩子“你很聪明”的暗示，但不能夸孩子聪明，怎么办？


    # 1. 如何帮孩子和自闭症儿童友好相处？


    女儿在幼儿园有一个小伙伴，好像就是自闭症儿童。他有Dr.魏在《自闭症并不遥远》这篇文章里说到的几个特点，关键是他喜欢打人，在一起玩的时候经常无缘无故地动手打我女儿。


    于是我就尽量不让他们在一起玩，可女儿把他当成好朋友，还想和他一起玩。我不知道怎么和女儿解释，说了她也不知道她能不能理解。我很同情那个孩子，同时也不想女儿失去她的友情，但我也想保护我的女儿，怎么处理这种情况呢？


    Dr. 魏


    首先建议你跟幼儿园老师了解一下这个孩子的情况，以及你家女儿和他在幼儿园的相处细节。如果女儿的小伙伴真的是自闭症，你不妨用女儿能够接受的方式来和她聊自闭症，了解自闭症患儿行为背后的原因。比如他打人可能不是故意的，而是不知道用怎样的社交方式合适。


    另外，绘本是一个很好的方式。我给你推荐几本：


    +   《不可思议的朋友》（日本绘本作家田岛征彦著）

    《不一样也没关系：孤独症儿童眼中的NT朋友》（美国绘本作家克柔·莫顿等著）

    《我的孤独症朋友》（美国绘本作家贝弗莉·毕晓普等著）


    最后，我再推荐你一部台湾地区出品的公益纪录片，叫《遥远星球的孩子》。影片深入走进自闭症者生活中的点滴细节，从医学、家庭、生活、梦想等多种角度出发，探索自闭症患者独特的灵魂宇宙。


    # 2. 孩子晚上常常做不开心的梦怎么办？


    女儿2岁3个月，她晚上睡觉常常做不开心的梦，在睡梦中突然说no、no、no，并摇摆双手。白天我们作为家长会对她不合理的需求加以制止，或者督促她做该做的事情。我也根据您的指导，对孩子强烈的情绪表达给予理解，但是她晚上睡觉常常出现这样的情况让我很担忧。


    请问是不是我们白天的陪伴有问题？这样会不会影响她的睡眠质量？随着年龄增长是否会改善呢？


    Dr. 魏


    很多家长喜欢用terrible 2（可怕的两岁）来形容孩子的第一个叛逆期。其实孩子的叛逆来源于成长的烦恼，成长让孩子的认知、行动和社交都发生了变化，这给她带来了全新的挑战。


    孩子能够触及的圈子越大，她犯错的次数也就越多。与此同时，孩子越来越有自己的想法，和你发生冲突的次数越来越多了。这就像是我们刚上学、刚工作的时候，需要去适应新的规则、新的人际关系一样，需要磨合。


    日有所思，夜有所梦。你家女儿晚上做不开心的梦，很可能就是受到白天经历的影响。她说no、no、no，摇摆双手，不一定是害怕，也可能是在表达自己的想法。这是很正常的，不一定是陪伴的问题。


    如果她说完no，摆完手，并且全程没醒，很快平静下来，那么不用理；如果她醒了，并且哭闹，你可以安抚她，如果她愿意的话，可以鼓励她把梦境说出来。叙述本身就具有“治愈”效果。如果她不愿意，也没关系。你的耐心陪伴会让她重新冷静下来。


    # 3. 妈妈决定了孩子的智商吗？


    现在网上流传一种说法，孩子的智商主要遗传于妈妈。这有科学依据吗？


    Dr. 魏


    这种说法是站不住脚的。美国明尼苏达大学的科学家研究了美国两千多个家庭的父母和孩子智商之间的关系，结果发现，母亲和孩子之间的智商相关性，与父亲和孩子之间的智商相关性没有显著性差异。也就是说，爸爸妈妈和孩子的智商都有关系，但谁也不起决定性作用。


    # 4. ABA（应用行为分析法）会让自闭症儿童变得机械化吗？


    我是一位轻度自闭症儿童的家长，孩子是在去年11月份被中山三院的邹小兵教授诊断为轻度自闭症的，现在3岁半了。我对治疗自闭症儿童的ABA应用行为分析法有所怀疑，总感觉这个方法教出的孩子太机械。我们现在让孩子半天上幼儿园，半天干预，每天都会听到孩子说，不去幼儿园，不去训练。孩子很不配合，看着孩子这样，我们也很痛苦，想让孩子开开心心的，但又不能两全其美。


    当我们在痛苦纠结的时候，接触到一种理念，是通过让孩子在开心地玩儿的过程中，慢慢建立一些规则，慢慢让孩子对人感兴趣，把他拉回到人群中。不知这样对不对？我们不敢轻易尝试，怕耽误了孩子。


    Dr. 魏


    你好，邹小兵教授是国内治疗自闭症的权威专家，建议听他的。正如我在文中所说，目前ABA是最有科学研究支持的疗法，希望你更加深入、全面地了解。ABA有一系列的技术和原则来帮助自闭症患者学习有意义的行为，减少自伤、攻击等不良行为。


    举个例子，一般孩子能够容易学会的事儿，有自闭症的孩子可能需要反复学习二十三次才能掌握。ABA会帮助孩子把各种概念或技巧拆解得更细，帮助孩子去练习。如果孩子抗拒，会换一种方式教他，而不是把孩子当成机器人，不顾他的感受，强迫他做。


    研究表明，接受长期高频的ABA训练后，自闭症儿童各方面的能力都会有显著提升，基本技能，比如看、听和模仿，复杂技能，比如阅读、对话和理解他人的想法，都能得到明显提升。


    目前国内的自闭症康复训练机构刚刚发展不久，良莠不齐，需要你深入了解，留心甄别。'
