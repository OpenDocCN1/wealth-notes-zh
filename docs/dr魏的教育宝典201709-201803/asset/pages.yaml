    Dr. 鹅


    你上一次冲孩子发火，是因为什么事？

    前几天看到一位妈妈的留言，说她冲孩子发火了。她说：


    我一夜没睡好，因为接孩子了。他晚上十点多钟还一直睡不踏实，在床上跳来跳去，稍微好讲个故事就睡觉，听完只要赖，要再讲一个。我说不行，他居然打掉了我的眼镜。呃他睡着之后，我还要洗衣服、收拾屋子，所以心急火燎的，一下子火气就上来了，凶了他一顿，还嚎里啕啦打了几下他的屁股。后来他做梦的时候，还抽泣了几声。我非常自责，想起自己小时候挨打的事，我变成了一个自己讨厌的那种人。这会不会给孩子留下什么阴影呢？


    不知道你有没有相似的烦恼？今天我专门来说说这件事，帮助你解开这个心结。


    # 1.正常人都会发火


    首先我想告诉你的是，发火这件事不是什么不能谅解的错误。正常的人类都有情绪：有正面的、积极的情绪，比如快乐；也有负面的、消极的情绪，比如愤怒。


    实际上，每一种情绪对于人的生存和发展都是有用的。就拿愤怒来说，愤怒让我们能调动资源、对付威胁。你想象一下，如果你在菜地里种了一些西红柿，好不容易等到成熟的时候，有人偷偷摸摸到你的家里来摘西红柿，你会不会生气？你很愤怒，喊邻居，拿棍子，把那个小偷赶走，捍卫自己应得的利益。


    # 2.发火之后正确处理，不会破坏亲子关系


    现在你知道了，人的基本情绪是生来就有的。我们大脑中有专门的情绪中枢来处理情绪的学习、编码和触发。而情绪的触发非常自动化，就像反射一样，它是由皮层下结构来主导的。这就是为什么情绪触发是前面说的I型信息处理，因为它快且不假思索，和人的膝跳反射一样。


    # 3.如何做到不乱发火？


    上面说的是发火之后怎么处理，但经常发火不仅对孩子有负面影响，对自己、对家庭关系也有损害。你一定希望少发火吧？这就要聊到“情绪调节”这个话题了。'
