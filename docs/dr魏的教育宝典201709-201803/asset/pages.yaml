    # —— 本周问答时间 ——


    二：魏与暖照妈妈一起解决5个问题


    +   1. 孩子一发脾气就扔东西、打滚，怎么办？

    2. 如何科学地对孩子进行性教育？

    3. 如何引导孩子正确表达情绪？

    4. 孩子出门总要大人抱，家长该如何回应？

    5. 如何培养孩子拾金不昧的品质？


    # 1.孩子一发脾气就扔东西、打滚，怎么办？


    Dr. 魏，我儿子一岁五个月，最近特别爱发脾气，一不顺心就扔东西、打滚，每次他发脾气的时候，我都等他情绪平稳后再和他分析发脾气的原因，描述他的情绪，告诉他这种表达方式不对。可是下次他生气了，还是一样。

    请问要怎样解决处理这类问题更妥当？还有一个问题，我儿子到现在只会说几个简单的词，但是他却理解我们说的话，请问正常吗？


    Dr. 魏


    1岁半到2岁，是宝宝发脾气的高发期，这是正常的。除了告诉他扔东西、打滚不对，你还可以告诉他什么方式是合适的，比如求助大人，向爸爸妈妈主动询问该怎么办。


    宝宝爱发脾气也跟他口头语言表达有限有关，说不出来，当然就只能“做”出来。试着教他一些简单的词，或者动作来表达自己的情绪。


    孩子能够理解别人的话，在2岁半之前是正常的，多讲绘本，多帮他描述周围的事物，丰富语言输入。如果两岁半后，仍然说不出，建议去正规医院检查，排除语言发育迟缓的可能。


    # 2.如何科学地对孩子进行性教育？


    我家是女孩，已经上幼儿园了，我给她读过有关性教育的绘本，但是孩子不怎么喜欢，说书上的人都光着屁股。有时候孩子会说在学校看到男生有些部位和自己不一样，甚至有的男生在教室把裤子脱光被她看见了。

    这个问题困扰我很久了，孩子不喜欢性教育绘本，我们家长该如何科学地对孩子进行性教育？


    Dr. 魏


    你给孩子做性教育的意识，给你点赞！

    网上时不时有新闻报道性侵儿童的事件，给孩子做性教育很有必要，但很多大人却忽视了这一点，认为孩子长大了自然就懂了，这是错误的观念。


    家长要明确让孩子明白身体哪些部位是隐私的，别 人不能随便碰；当别人想侵犯自己时，要懂得辨识并拒绝；如果不幸遭受侵犯，不要因为恐惧、羞耻而不说。


    现在我们很多父母都知道要给孩子讲性知识，但是还是难免会感到尴尬。感到尴尬是正常的，你可以先练习如何讲，等淡定后再跟孩子分享，这样气氛会更好些。


    给本只是分享的一种载体，如果你家孩子暂时对这个方式不感冒，那么多借助日常生活中的机会。比如给孩子洗澡时，告诉她是因为要洗澡，所以脱衣服，平常没洗澡，不能脱。告诉孩子私密部位的名字，那里不能给别人看到和摸到。大人要做好示范，换衣服要到房间里，上洗手间要关门。


    家长是孩子的镜子，想让孩子学会什么，首先自己要注意起来。


    # 3.如何引导孩子正确表达情绪？


    我家是个男孩，18个月，经常会无意间伤到妈妈或者陪玩的人，比如玩的时候挥舞手碰疼别人，或者高兴的时候打人几下。但是他从来不会在生气的时候打人，因此我也知道他不是想打人，就是玩开心了，想表达情绪。

    每次被打到，我都会假装哭，让他给我搓揉吹吹，现在孩子也学会假装哭了，虽然挺可爱的，可孩子爸爸觉得这样会让孩子形成习惯，疼了、受伤了或者如果将来被小朋友打了，就只能用哭来解决，所以请你帮我出个主意，这样
    的事到底应该怎么处理？


    Dr. 魏


    从你的描述看，孩子打人不是出于伤害目的，而是无小心碰到，或者表达高兴的情绪。你假装哭，其实强化了他的行为：‘原来我一打妈妈她就会哭，真好玩，我再打一下。’他把这种行为当成了玩。


    而你担心假哭会误导孩子，让他以后被打出用哭来解决，这是有可能的。建议你引导孩子用正确的方式，来表达情绪。我给你出个主意，比如你可以跟孩子说：‘宝宝，你很开心呀，来，跟妈妈击个掌！’用其他合理行为来表达情绪，让他形成表达的好习惯。


    # 4.孩子出门总要大人抱，是依赖心重？


    孩子很喜欢找大人抱，不愿意自己走路。我家儿子1岁9个月了，不愿意呆在家，老是喜欢到公园玩，但出来玩，又不下地走，总是让大人抱着，不抱就生气哭闹，这个问题该怎么处理呢？


    Dr. 魏


    我理解你的想法，你担心孩子太过依赖大人，想让他更加独立些。但是，育儿问题往往不是非黑即白的。我无法简单地告诉你，你得抱孩子，或者你得让他自己走。育儿和其他领域一样，存在大量灰色地带，得灰色处理。抱或者不抱，得分情况。我和你一起分析分析这些情况。


    首先，看能力。孩子1岁9个月，他学会走路多久了呢？如果是刚学会走路不久，自己走是不是容易累？特别是有些孩子头大身短，腿部力量还有待发展，更容易疲劳。


    你可能说，不对，孩子在家里走得挺好的，能力不是问题。那么我们分析孩子的走路意愿，也就是他想不想。孩子不想走路有哪些原因？你下意识会想到其中的哪些？


    我认为原因主要有两个：一个是习惯，一个是安全感。


    我们先说第一个原因—习惯，如果孩子之前出门都是别人抱，那么一下子让他切换到自己走的模式，很可能不习惯。抱着舒服、视野又好，为什么要自己走？


    第二个原因安全感。孩子对外面的世界既好奇，又谨惧。对于慢热的孩子，更是如此。你是他勇气的来源。他不是不能走，而是因为你是他的铠甲，所以他希望你能贴近他。


    所以你看，你想他独立，但这不可说像鹰妈妈把鹰宝宝推下悬崖学飞那么简单粗暴。从抱到自己走，循序渐进更好。


    比如，你可以跟孩子说，一直抱很累，妈妈抱到那棵树，你就自己下来走一走；你可以找一个人比较少的场地，跟孩子玩游戏，让他来抓你。在相对安全的地方，通过游戏的方式，来冲淡他对外面世界的焦虑。


    最后，我想告诉你：给孩子充分的适时时间，他会越来越独立的。


