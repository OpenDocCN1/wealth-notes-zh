    105 | 孩子争抢玩具，不要...


    Dr. 魏


    你家娃跟别的小朋友抢玩具，你一般怎么做？


    前阵子我看到一个新闻，说是两个孩子在游乐场抢玩具，结果两个家庭的大人打出手，甚至有人因此而受伤，这太让人震惊了。我们为人父母的都知道，孩子之间发生矛盾，很多都源自争抢物品。


    在公共场合，陌生小朋友之间抢，在幼儿园同学之间抢，就算是家里，兄弟姐妹之间也一样抢。要想妥善地处理孩子争抢物品的问题，你可能先要了解孩子是怎样想的，他觉得这东西归谁，该给谁玩。因为，在这方面，孩子跟大人的想法，差别还是挺大的。


    这东西归谁？孩子跟你的看法不完全一样


    首先我们聊聊孩子对物品所有权的理解，比如他 कैसे知道哪些东西属于别人，哪些东西属于自己。


    # （1）通过劳动线索判断


    你可能见过这样的情景：两个大约三岁的孩子在沙坑里玩，其中一个小孩用沙子做了一个城堡，特别得意。他要回家了，另一个孩子掏了城堡上的沙子继续做自己的大山，他立刻反对：“这是我的！”这个时候，大人一般会想：“这孩子真不讲道理，这是公共沙坑。”对不对？实际上，孩子会根据“劳动线索”来判断物品的所有权。他知道这沙子是大家的，可城堡是他做的，那就是他的了。


    # （2）明白先到先得


    孩子判断物品所有权，除了“劳动线索”，还会会用“先占线索”，也就是说他们明白“先到先得”。研究人员做过这样的实验，给孩子看两个 人先后玩一个玩具，第一个人玩的时间短，第二个人玩的时间长，然后问孩子，这玩具是谁的？孩子们倾向于认为玩具属于第一个人，就算是两岁的孩子也不例外。


    # （3）是谁的东西谁说了算


    有一件非常有趣的事情是，即使在4岁之前，小孩一旦明确谁是物品的主人，就会捍卫主人使用权和分配权。


    # 避免孩子争抢，提前做功课


    了解孩子对所有权和使用权的看法之后，我们再来谈谈怎样避免孩子争抢物品。我认为最重要三点是，第一，尊重和培养孩子的所有权意识；第二，教孩子理解他人感受；第三，教孩子提出自己的需求。


