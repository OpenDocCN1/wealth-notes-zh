  md: '# 077 | 给孩子7个爱学习的动力


    Dr. 魏


    077 | 给孩子7个爱学习的动力…


    Dr. 魏


    你赞成孩子多做题吗？


    这个星期是开学季，我早晨上班路过一所小学，发现门口很热闹。有的小孩子紧地拉着妈妈的手，可能是刚从幼儿园小朋友升级为小学生，不适应。有的孩子笑着大喊同学的名字，追赶着走进校门，心情还不错。


    孩子进学校了，爸爸妈妈们在外面闲聊，我听到一个高年级学生家长说：这刚开学就说不喜欢上学，一写作业就嚷嚷着累，一背课文就想上厕所，可怎么办？


    每位爸爸妈妈都想知道,怎样才能让孩子喜欢上学,那你首先得知道孩子为什么不喜欢上学。这原因有许多方面,比如小一些的孩子不想离开妈妈,比如学校的一些教学材料和环境设计不适合孩子发展,比如大的教育体制也有些局限等等。


    其实还有一个非常重要的原因是，认知科学家发现，学习本身就是困难的事，孩子天生不喜欢上学。如果能用好认知科学原理,我们可以让孩子的学习更高效,让孩子更有成就感,喜欢上学习。


    美国弗吉尼亚洲大学有一位心理学教授，叫丹尼尔·威林厄姆，他长期研究大脑在学习时的活动。威林厄姆在一个教育杂志开专栏，把认知科学的研究成果介绍给中小学校老师,并给老师们一些教学建议。


    后来, 他以这些专栏文章为基础出版了一本书, 叫《为什么学生不喜欢上学》, 书里介绍了9个认知科学原理, 提出相对应的教育孩子学习的原则。我这里, 先来讲讲7个重点的原理,
    我先简单解释一下每个原理, 再给出具体建议。今天关于学习的话题, 对你教孩子, 或者自己学习, 都有用。


    # 1.人类天生好奇，但并不是天生擅长思考


    学习需要思考,但人类行动更多地依靠记忆。比如说,你在做一件事情的时候,常常沿用与上次做这件事情的相同方式。你饭点菜的时候,想不好要吃什么,就点原来吃过的那些,这样最节省认知资源,或者俗话说的,最省脑子。


    那么我们为什么有时候愿意思考呢?在思考和解决问题过程中,大脑会产生多巴胺,让人有快乐的感觉。但问题太难或太容易都不行。难度太低,无聊;难度太高,挫折;难度适中刚刚好。


    所以, 让孩子喜欢上学, 第一个建议是, 给孩子的的问题要难度适中。我之前提到的“脚手架”的方式,就能有效帮助孩子,所谓“脚手架”,就是给孩子定一些跳一跳、够得着的小目标,让孩子觉得学习有些挑战,但努力之后,又可以克服的事情,说的也是这个道理。。


    # 2.事实性知识比技能优先


    现在很多人批判死记硬背,提倡教孩子批判性思维。但是,推理、判断、问题解决等批判性思考过程,需要调用基本背景知识。我给你出道题:


    请判断下面这些小虫子中,谁不是昆虫?蜜蜂、蚂蚁、蝎螈、蜘蛛。


    要想做这个判断,你得知道昆虫的定义,知道蜜蜂、蚂蚁、蝎螈、蜘蛛的身体构成一一这些都是事实性知识。


    因此,第二个建议是,尽早丰富孩子事实性知识。阅读很有效,还有参观博物馆、旅游、各种课外活动,都很好。


    # 3.记忆是思考的灰烬


    # 4.我们通过已有知识理解新知识，大脑倾向于选择具体的知识


