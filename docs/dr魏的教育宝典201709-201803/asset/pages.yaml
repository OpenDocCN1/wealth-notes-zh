  md: '# 158 | 年度复盘：即学即用的科学养育工具包


    158 | 年度复盘：即学即用...


    Dr. 魏


    你好，我们的专栏即将结束了，订阅用户也超过了9万人，感谢你的支持，我也希望看到你的收获，还有宝宝的变化。这一年，你的宝宝在哪方面改变最大？

    欢迎你留言告诉我，我将对应五脑体系综合考察，从中选出聪明宝宝、语言宝宝、情商宝宝、运动宝宝和创意宝宝。活动内容以及奖品，我放在了文章末尾，点击即可查看。


    我们进入复盘期，工作日不间断更新，帮助你梳理全年课程。上期我带你梳理了5脑体系的5大底层逻辑，提升你的科学育儿指数。今天咱们从理论回归实战方法，我从155篇专栏文章中提炼出10个更具策略性的养育清单。这是一个即学即用的养育工具包，掌握了这些原则，养孩子的时候你就能以不变应万变。你也可以对照清单，看看自己有哪些做得好或者不够好的地方。


    # 1.育儿育己


    你可能已经猜到，“育儿育己”是我在专栏中提到最多的一個育儿原則。


    父母是孩子的榜样，这句略带鸡汤的话里藏着班杜拉（Albert Bandura，著名心理学家）的社会学习论。儿童主要的学习形式是观察学习和模仿学习。班杜拉认为孩子是通过观察他们生活中重要人物的行为而习得社会行为的。这些观察又以心理表征或其他符号表征的形式储存在大脑中，来帮助孩子模仿行为。简单来说，孩子通过观察、模仿父母的行为来学习这个社会。


    比如，孩子跟电子产品交互的方式跟父母无意识的示范有很大关系。如果大人整天抱着手机打游戏，孩子也会受影响跟着玩手机。如果你能以身作则，吃饭时不用手机，睡觉前不看手机，那你要孩子远离电子设备，也就轻松得很。总之，陪伴孩子成长的过程，也是你自我提升的过程。


    # 2.从“木匠”到“园丁”


    科学家将过去的育儿理论，总结为“木匠”理论。什么是木匠理论呢？“正确的”养育技术 (parenting techniques) 或专长 (expertise)
    会把孩子“雕刻”成一个成功的成年人，也就是认为父母的某些行为能够深刻影响和预测孩子的未来。


    然而，面向未来的、新的育儿理论认为，父母的角色应该从“木匠”转变为“园丁”。养育是帮助孩子找到他自己的成长道路，就算这条路不是你希望他走的路。养育如耕地，需要一遍又一遍的深耕细作，父母能做的是给孩子创造一个安全、肥沃的空间。


    # 3.不做百分百父母


    很多家长对育儿有很重的焦虑，一个原因是没有对自己设定合理的期望。其实，我们做不了百分百完美的家长。我也做不了百分百，我给自己的期望是70分。


    一旦你把对自己的要求降到一个合理的区间内，只要你按照科学的养育原则，把育儿时间花得更有效、更高效些。你会发现自己不再焦虑，不再过度养育，孩子反而更加独立自主。你退了一步，孩子却进了一步。


    # 4.成长型心智，重视努力和过程


    为什么同样是遇到挫折，有些孩子能够屡败屡战、不断努力去克服困难，而有些孩子却会轻易放弃，甚至不敢去迎接挑战？斯坦福大学卡罗尔·德韦克教授发现，一个思维观念的不同起重要作用，这就是成长型心智模式和固定型心智模式。成长型心智模式认为一个人的智力、能力、品质可以通过后天努力改变，所以成长型心智的孩子乐于迎接挑战、遇到困难也不放弃。固定型心智模式则认为人的智力、能力、品质是由先天决定的，后天改变的余地不大，持固定型心智的孩子倾向于躲避挑战，轻言放弃。


    想要帮助孩子形成成长型心智模式，你应该表扬孩子的努力，而不是能力；重视孩子努力的过程和他得到的成长，而不是结果和表现。帮孩子建立起从错误中学习和进步的习惯，那才是真正关到他一生成长的关键。


    # 5.非暴力沟通，非暴力养育


    非暴力原则，你可能不敢相信，暴力是很多父母踩过的坑。


    非暴力沟通，指的是不带情绪性指责、不批评地跟孩子立规则、讲道理。要想孩子学会非暴力沟通，首先你要控制好自己，平 时多给孩子正面反馈，批评孩子的时候要就事论事，不贴标签，并且告诉孩子改正的方法，帮孩子把抽象的教条转化为具体的行动。孩子对于规则的认知有个过程。认识规则后，他们需要使用规则、反复练习，最终内化规则，形成规则意识，这是一个漫长的过程。这些生活中的行为规则需要在几年内不断地重复并提醒孩子，你要给孩子耐心。


    非暴力养育就是我一再强调的不要体罚孩子。如果孩子做错了事情你就打他，那么你教会他的是用暴力的方式解决问题。指责或者打骂孩子，并不能帮助孩子认识到规则的意义，我要再叮咛一句：暴力绝
    对不是解决问题的终极方法，爱才是。


    # —— 提高学习力五原则 ——


    学习力是我们专栏的重中之重，我讲了很多提高孩子学习力的方法，梳理了五个基本的学习原则，供你取用：


    # 1.跳一跳，够得着：在最近发展区学习


    心理学家维果斯基认为，家长应当充当孩子的教练。教练要懂得依 据队员的具体情况来安排有针对性的训练。做父母的也需要根据孩子的学习状态，帮助他调整难度。如果你发现任务太轻松，则需要微微调高难度。


    # 2.刻意练习：小批量的持续练习


    除了给孩子制定合适的学习任务，还有一点要注意，那就是要鼓励孩子多练习。脑科学研究发现，没有充分的练习，一个人不可能精通任何脑力活。人的认知是有限的，练习可以把低层次的思考过程自动化，这样能给更高层次的思考留出足够的空间。所以，有目标、有方法地在最近发展区进行刻意练习，才会进步和成长。


    # 3.提取练习效应：重视输出


    研究发现，回忆，也就是从记忆中提取信息，会让脑部与记忆巩固相关的区域活动水平更高，能促进深度学习。你每次从记忆中检索一个知识，它在你脑子里的信号就更强、更稳定，因为大脑判定这个知识点将来更有可能被你用到，这就是提取练习效应(retrieval
    practice effect)。


    # 4.给孩子及时、具体的反馈


    对待孩子的学习进程，还要提供反馈。反馈就是看看孩子努力产生的结果是不是符合预期。如果不符合预期，就去修正策略。给孩子的反馈有三个要点，一个是要及时，二是要全面，三是要具体。发现哪里不足、哪里优秀，要及时给孩子反馈，鼓励他洞察自己的状态。同时，反馈要具体，指导孩子具体行为，让他知道自己具体哪一点做得好，哪一点做得不够好，怎么做更好，以便他调整策略。'
