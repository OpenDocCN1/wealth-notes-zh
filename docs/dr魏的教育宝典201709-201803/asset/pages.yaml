  md: '# 129 | 新年礼物爱攀比，正是教育好时机


    129 | 新年礼物爱攀比，正...


    Dr. tiny


    孩子特别羡慕别人的东西，你要不要买？


    圣诞、元旦、春节，这段时间节日应接不暇，孩子们会收到各种各样的礼物。


    不过，当孩子们拿着新礼物在一起玩的时候，总会出现这样的isz小插曲。小明看到贝贝手里会发出声音的遥控汽车，特别羡慕，跑去跟妈妈说：“我也要遥控汽车！”妈妈说：“不行，不是刚给你买了飞机吗？家里还有那么多小汽车呢。”小明一听，立刻坐在地上哇哇大哭。


    如果你遇到类似的情况，应该怎么办？是不是感到很为难，直接拒绝孩子，少不了一阵哭闹；不拒绝吧，又怕让孩子养成见什么都想要、爱攀比的坏习惯。


    我告诉你，其实这就是特别好的教育机会，刚好可以给宝宝上三堂重要课。什么课呢？接下来我们一个一个地讲。


    # 第一课·放飞想象力


    孩子大哭大闹特别想要一样东西的时候，大脑被情绪牢牢控制，没办法理性思考。你呢，得先帮他把理性调动出来，让他平静下来，然后才能把事情讲清楚。怎么调动孩子的理性？爱贝睿家长教练赵越老师有一个妙招：激发孩子的想象力。


    # 第二课·区分“需要”与“想要”


    面对小汽车的诱惑时，孩子眼里只有当前这辆车，脑海里根本没有“放弃”这个选项。但你知道的，不可能所有的东西都买，孩子总得学会取舍。这种练习呢，得在平时提前做。


    # 第三课·培养理财观念


    宝宝小的时候，哭闹基本上都在表达“需要”，饿了、想睡了、不舒服、想要抱抱（是的，别忘了宝宝也有情感需要）。长大之后，孩子有了自己的思想，“想要”的越来越多。'
