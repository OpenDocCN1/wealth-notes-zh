  md: '# 136 | 数学启蒙第一步：培养“数感”


    Dr. 黎


    怎么加强孩子的“数感”？


    我以前讲过一些孩子学数学的方法，有些妈妈说有启发，也有妈妈来吐槽。她说：“黎老师，你的方法好是好，但搁我家不管用。我按照你说的，借助实物让孩子理解数量的概念，装一盘橘子问他有几个，他明明点着数到5，最后却说有3个！这么笨的孩子怎么教？”


    我觉得这位妈妈冤枉孩子了，孩子不笨，这样的表现再正常不过了。我反思了一下，要怪我讲“数”没讲清楚。我还没有详细讲过数学启蒙的最初级的部分，就是理解数字的概念，以及最简单的数据数字的数感。今天我就细细地撕一撕孩子学习“数数”的过程，告诉你可以怎样在日常生活中加强孩子的数感。


    # 三种不同的“数”


    你可能不知道，当我们看到“5”这一阿拉伯数字时，大脑中会同时处理三个信息，一个是它的读音“wu”；一个是视觉符号5，像一个弯弯的钩；还有一个是比较抽象的数量概念。


    +   1. 请听题，5+4=?

    2. 请听题，five plus four equals to ?

    3. 请看题面，IV+V=?


    # 1. “唱数”


    # 2. 点数游戏


    # 3. 搭建书面符号与数量的关系'
