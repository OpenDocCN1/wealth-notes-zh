    总结一下，我今天分享了妙用手势的4个方法，鼓励孩子多做手势，好处多多。手势能改善沟通，能释放记忆空间，还能辅助孩子学习数学。反之，抑制孩子自然的手势表达，可能会影响孩子的表现。


    你需要记住一点，在和孩子交往的过程中，无论是教他牙牙学语，还是教他数学和讲故事，多用手势来表达，并且鼓励他用手势来表达，这对各种大脑能力的发展都有帮助。


