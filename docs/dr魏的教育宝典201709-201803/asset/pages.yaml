    # | 金牌家长-珍珠妈妈蔡小妮


    分享话题：培养孩子爱阅读


    很多人做不到“说走就走”，因此，阅读就变成开阔视野最经济有效的途径。在对女儿的诸多期许中，“热爱阅读”是我对她最大的期望。


    目前女儿三岁，拥有超过300本书籍，其中精读的有100本左右，熟读的大约150本，剩下的大多只读过一两 twice，是她不太愿意重复阅读的书籍。


    阅读和所有的习惯一样，是需要培养的，我整理了两年以来，在孩子阅读的几个关键时期，我采用的一些引导和应对方法，另外附上女儿各阶段爱看的书籍，供大家参考。


    # （1）阅读初期：关键词启蒙、识图


    女儿6个月会坐时，我们就开始有意识的进行阅读培养了。挑选书籍，不会特别注意文字部分，而是挑选画面内容丰富，色彩鲜明，形象生动的儿童读物。带孩子阅读时，尤其在初期，建议多讲述图画上的内容，以识图为主，到后期再加入文字讲述。


    可选择类似书籍：《懂事的小松鼠》《趣味故事》


    # （2）阅读兴趣期：关键词朗读、文字


    大约在女儿一周半左右，进入了疯狂阅读时期，每天阅读时间在4~5个小时。


    # （3）阅读懈怠期：关键词兴趣


    # （4）阅读稳定期：关键词自主性、审美


    Dr.魏


    珍珠妈妈的分享很有启发性，阅读兴趣的培养，得按照孩子的认知发展特点来进行：先易后难、先具体后抽象。她注意到了孩子阅读懈怠期，接下来孩子短暂的消极状态。孩子的成长不是线性的，而是螺旋式上升，有时候进两步退一步。


