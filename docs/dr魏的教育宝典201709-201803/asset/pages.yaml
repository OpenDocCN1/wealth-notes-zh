  md: '# 专题 | 数学启蒙攻略


    Dr.魏


    有不少人害怕数学，觉得数学太难，怎么学也学不好，甚至毕业多年后仍數数学考试的噩梦。可是你知道吗，父母对数学的情绪会传染给孩子，影响数学成绩。


    那么，如何帮助宝宝喜欢数学，而不是害怕呢？怎么进行数学启蒙才是科学的呢？


    我总结了这一份数学启蒙攻略，希望可以帮助宝宝探索数学的世界。


    # 宝宝数学启蒙攻略


    +   1.孩子天生有数感，应尽早开始数学启蒙。


    数感，即对数量有粗略估计的能力，这种模糊计算能力是后来发展精确计算能力的基础。神经科学研究发现，人类婴儿出生时，就有专门与数字数量相关的大脑结构，独立于支持语言处理的大脑结构，也就是说，人类天生有数感，不依赖于语言或者教育。你想象一下，森林里的一群原始人类去找食物，他们环顾四周，要估计判断哪棵树上的果子多，才有可能吃得更饱，这是一种先天的能力。


    先天的支持数字能力的神经认知系统就像一个骨架，提供基本结构；后天的各种数字游戏和活动，加上语言符号和数字符号这两种武器，则是在骨架的基础上提供血肉，加在一起就形成了有生命力的数字能力。学数学不需要区分年龄，跟学习第二语言一样，根据孩子感兴趣的程度和已掌握的技能来尽早启蒙。


    +   2.最重要的数学启蒙，是让孩子了解到数学在生活中的重要性。


    比起让孩子背公式，生活中总有机会让孩子发挥数学才能，比如电话号码、今天的日期、爸爸的车牌号等等，把抽象的数字跟生活情景联系在一起，孩子觉得算术对他的生活是有用的，那么对算术的兴趣就会变大，心里也会越来越有“数”。


    +   3.鼓励孩子用数学解决实际问题。


    不断地给孩子抛出问题，刺激孩子思考，让他们用各种方式，比如实证、猜测、找别人讨论等方法去验证自己的答案。比如盛饭的时候，我会叫女儿帮我拿筷子，问她：“家里4口人，该拿几根筷子？”她发现，如果一双一双地加，是8根筷子，但用刚学的乘法来算，是4对乘以2，也是8根筷子。这种加法和乘法的共通性就顺理成章地让她验证了一次。解开试卷上的数学题，与解决生活中的实际问题，其实用的是同一解决问题的思维能力。


    +   4.重视早期数学能力：数算思维、几何思维和测量思维。


    研究表明，孩子早期的数学能力越好，不仅之后数学能力更好，甚至识字能力也会更好。美国的很多幼儿园意识到数学的重要性，就开始推行针对幼儿的STEM（科学、技术、工程和数学）教育了，其中的M就代表数学。培养孩子的数学能力，其实就是给他们三个思维套餐：数字思维、几何思维和测量思维。


    +   5.多用描述形状特征的词语，培养几何思维。


    “水立方是正方形的，鸟巢是椭圆形的，冰淇淋是什么形状加上什么形状？”研究表明，孩子一般在2岁6个月时，已经能够准确地描述物体的形状名称了，他们能够理解规范或不规范的几何形状，甚至还发展出“比如像三角形”这种抽象的图形理解能力了。


    +   6.对比和测量思维


    对于比较小的宝宝，重在提高宝宝的比较思维。平时多问问他“这个比那个多吗？”“那个比这个少吗？”或者“这个和那个一样多吗？”这类的问题，孩子小的时候就可以用上了。


    +   7.引导孩子多用语言，描述头脑里的思维活动。


    +   8.多用数学语言跟孩子交流。


    +   9.父母对数学的情绪会传染给孩子。


    +   10.数学不只是计算，推理更重要。


    +   11.用推理技巧教孩子加减乘除以及分数和比例的概念。


    +   12.建构数量与符号之间的关系。


    +   13.借助实物来掌握抽象的数学概念。'
