  md: '# 118 | 怎么做好家庭性教育？


    Dr. 魏


    性教育这个主题，不是我的擅长的领域，但我理解你的焦虑。儿童性侵害事件中，性教育的缺失是十分关键的原因。


    很多人对性教育避而不谈，遮掩掩饰，或者不尊重孩子的隐私，把性骚扰等行为看作小事。有一种观点认为孩子小，一些创伤最多对他造成心理阴影。随着孩子成长，他会淡忘这些不愉快的记忆。殊不知，精神和躯是不可分的。一些精神创伤就像钉进大脑的铁钉，就算这段记忆消失，钉子拔去了，也会在孩子的大脑回路里留下深刻的伤痕。


    越来越多的研究证实，童年的痛苦回忆，孩子长期遭受的虐待可能产生毒性压力。这种毒性压力可能会导致大脑中枢神经系统损伤，表现的症状可能包括脑电波活动不正常，大脑皮层区域和胼胝体体积减小。胼胝体就是直接连接大脑左右两个半球的神经纤维。而且，越早发生虐待，对孩子的影响越严重。如果不重视这些负面经历，会导致孩子发生认知、情感和行为问题。


    # 怎么阻止这类事件发生？


    当然，虐童事件说白了是大人造成的，给孩子再多性教育也只是预防，最主要靠完善的立法、加强政策保护。但是父母的参与，积极的教养方式，在预防虐童行为、恢复创伤上也有显著帮助。


    # 1.孩子出现自我刺激、自我抚慰的行为


    一岁半前的宝宝，很喜欢用触觉探索外界，也很喜欢跟别人的身体接触，他们是通过触摸和感受别人的抚摸来体会什么是爱和被爱的。这个阶段的宝宝，他们在探索自己身体的过程中，可能做出类似自我刺激的行为。更大些三四岁的孩子，他们对性别问题更加好奇了，更可能会玩弄自己的隐私部位。


    # 2.教孩子对不想要的身体接触说“不”


    建立隐私观念，还有一个重点是告诉孩子隐私部位是什么，让他知道哪些部位是不可让别人看、让别人摸的。'
