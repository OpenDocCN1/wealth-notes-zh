    # 5.孩子期待早教班，但进了教室却想逃跑？


    女儿每次上早教音乐课之前都挺期待的，但是进了教室就拼命想逃避，好不容易哄她上课了，她就比较进入状态。不过，有个环节是大家一起跳舞，当别的孩子和家长都在跳舞唱歌，她却总是坐在那里，不肯加入。如果我离她远一点她就要哭了！


    但是回到家里她又是很喜欢很期待的样子，表演各种上课的动作！她平常在家里面非活泼，在外边却不爱说话，不愿意正视别人，这算不算缺乏安全感呢？


    Dr. 魏


    这跟气质（temperament）的关系更大一些。这里的气质不是咱们平时说的跟形象有关的气质，而是指孩子先天表现出来的情绪和行为倾向。


    心理学家从趋避性、适应性、反应阈限等角度来分析孩子的气质。趋避性指孩子对一种新物品、食物或陌生人，是趋近还是回避；适应性指孩子根据环境变化调整自己的难易程度，如在一个陌生地方睡觉或吃东西；反应阈限是指引起孩子一种反应的刺激强度是高还是低，阈限也就是临界点的意思。


    如果你到孩子多的地方，观察一下，就​会发现，每个孩子的表现都有所不同。


    我们回到你女儿身上。她进了教室就想逃避，可能是换了新老师、新家长和新的小朋友，需要时间适应；也可能是因为你女儿比较敏感，看到教室里那么多人，灯光变化，声音嘈杂，她的反应阈限比较低，会觉得刺激过于强烈，想逃离。


    而另外一些小朋友阈限比较高，不觉得人多、吵，能适应。而家里面是一个熟悉、相当安静的地方，她已经适应，环境的刺激也没有超过她的临界点，所以她表现得很自在。


    你不妨选择人少一些或者安静一些的课程，适应孩子的气质特点。或者给她更多的时间，去适应现有的环境，别催促，多些耐心。


    最后给大​家留一个问题，你家孩子通常到陌生环境是回避还是趋近？如果是回避、慢热，你是如何引导他的？欢迎分享出来，让本期的专栏成为慢热孩子更好适应新环境的方法库！


