    # 培养孩子的批判性思维？


    1个观点：批判性思维不仅仅是严格科学的概念，它是一系列认知能力的集合，比如推理、判断与决策、问题解决这三类思维过程。在更细地说，包括预测、逻辑推断、验证假设、形成观点、反思等诸多技能。


