    # 3.定制孩子的问题，专项解决


    不同文化的孩子，阅读障碍的脑区不同。其实，不同孩子的阅读障碍表现都可能不同，这需要你根据孩子的个人情况，定制不同的方案。


    比如有阅读障碍的伯西，如果他是在文字处理方面有困难，那你可以帮伯西利用书面文字以外的媒介学习，比如一篇课文，内容跟其他同学一样，不过是用音频或视频的形式，给珀西专项辅导。


    另外一点，有阅读障碍的孩子，他们需要更多时间来处理信息，咱们应该理解他们的需求。西方国家在考试的时候，会给有阅读障碍的孩子更长的考试时间，让他们有充分的时间答题。老师也会给阅读障碍的孩子安排一些特别的辅助计划。


    国内虽然暂时做不到这点，但我强烈建议孩子被诊断为阅读障碍的家长，不要隐瞒实情，只有跟老师好好沟通，才能让他们在平常教学时，对你的孩子做一些更有针对性的帮助。


    最后，我要叮咛一下，阅读障碍有严格的诊断标准，不要随便给孩子乱贴标签。一般来说，对7岁前孩子表现出来的“疑似阅读困难”，我们要重视，但不用焦虑。比如写镜像字，就是把字写反了，把“p”写成“q”，这种情况对7岁以前的孩子很常见，一般到8岁以后就好了。


