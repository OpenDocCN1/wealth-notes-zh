  md: '# 157 | 年度复盘：五脑体系核心原则


    Dr. 魏


    你好，我们的专栏即将结束了，订阅用户也超过了9万人，感谢你的支持，我也希望看到你的收获，还有宝宝的变化。这一年，你的宝宝在哪方面改变最大？欢迎你留言告诉我，我将对应五脑体系综合考量，从中选出聪明宝宝、语言宝宝、情商宝宝、运动宝宝和创意宝宝。活动内容以及奖品，我放在了文章末尾，点击即可查看。


    《 Dr. 魏的家庭教育宝典》终于进入复盘期了，感谢这一年来跟随课程的你。基于大脑的发育特点和规律，这一年我找出了你最关心、以及我认为对于孩子的未来至关重要的能力，概括为五部分：智力脑、情绪脑、运动脑、语言脑和创意脑。


    这是我和一批科学家朋友构建的新型儿童教育体系，它基于认知科学，而非伪科学和迷信；以验证为导向，而非经验主义导向；以家庭为单位，而非单纯教育孩子；侧重培养孩子的底层核心能力，而非传统的学科能力。


    今天，我将带领你回顾五脑体系，每个脑一个底层逻辑，掌握这五大核心逻辑，相信在教育孩子的路上你能从容跨步，稳健前行。


    # 1.【智力脑】：大脑有可塑性，给孩子提供适宜的“刺激”


    有效提升孩子智力的最基本方法，是你给孩子塑造的微环境。你有没有给孩子充分的学习和经历，让他的大脑得到适宜的刺激。刺激，是增强大脑的驱动力。比如陪孩子看绘本，是视觉系统的刺激；带孩子听音乐，是听觉系统的刺激；跟孩子做运动，是对运动系统的刺激。


    经常被刺激的脑网络的突触会被加强，这就是大脑的“神经可塑性”，神经可塑的过程就是提供刺激、培养孩子大脑的过程。这可以说是育儿最重要的科学原理之一，它不仅会决定孩子的智力，也会决定孩子在情绪、运动等各方面的发展。


    我在课程中例举了各种用正确的刺激来帮助孩子的大脑发育的方法。比如，户外的新鲜刺激更容易激发孩子的好奇心。好奇心本质上是整合新信息的能力，是进化安排好的学习机制。又比如，给宝宝读故事、读故事、演故事，利用不同形式的刺激，让宝宝大脑里对故事的记忆更稳固。


    # 2.【情绪脑】：整合理智脑和情绪脑，站在孩子的角度想问题


    孩子闹情绪，是很多家长最大的烦恼。其实，孩子的大脑发育不均衡，情绪脑比理智脑发育得快一些。当你理解儿童大脑的发育特点，站在孩子的角度想问题，你离情绪管理大师又近了一步。


    经过一年的学习，你已经知道，当孩子控制不住脾气，哭闹打人，是因为他们的情绪脑比理智脑发育得快，理智管不住情绪。当孩子发脾气时，你可以充当孩子的“理性前额叶”，用“情绪三步走”来引导孩子“描述情绪”、“思考情绪”、“反思情绪”。语言是思考的外衣，教孩子多用语言描述情绪，用语言带动理智脑的发展。
    然而呢，帮助孩子理解自己的情绪，分析情绪发生的源头，并且学会反思自己，同理他人的感受。


    你也应该知道，当孩子无法抑制冲动，自控力不足，是因为成年人和孩子在处理自控上运用了不同的脑区，孩子要发展出成年人的自控力需要时间。想让2岁的宝宝控制冲动，不去碰吸引他的玩具，这是不切实际的。作为孩子的理智脑，你要考虑到孩子的发展水平，在外部环境上要帮助孩子降低冲动的诱发条件，通过替代方案，帮助孩子转移冲动。并且，建立规律的日常生活习惯，不要怕叮叮，反复去提醒他。


    # 3.【语言脑】：浸入式学习，晚一点不如早一点


    不论是对识字或是外语学习，我给你的一个建议都是：趁早。语言的习得是被环境塑造的，如果环境每天给你大量语言类刺激，你大脑的语言中枢就会被这些刺激所塑造。


    不需要等孩子掌握了母语之后才开始学外语，而是越早让孩子暴露在双语环境里越好，这也叫“浸入式学习”，就是让孩子浸泡在外语环境里，像学母语一样自然而然地吸收外语。这比长大以后再用背单词、记语法的方法学习外语有效得多。


    识字也一样，关键不是你孩子几岁开始识字，而是他学会识字的方式是自然的，还是机械的。孩子的大脑不擅长抽象学习，如果用填鸭式或者背诵式来学习语言，硬逼着让孩子死记硬背单词，是不会有好的效果的。“浸入式学习”的一大特点是，家长和孩子之间有丰富的互动，这种“玩中学”的学习方式，是具体式的学习，符合孩子大脑的生长规律。就算面对大量信息，孩子一样能吸收得更快，记得更牢。如果为孩子创建了一个丰富的文字环境，让他经常自然地接触到文字，在一个好玩、互动的过程中，主动地学会了文字。那你孩子以后就会越读越爱读，越读越会读，他的阅读能力和认知能力就会相互促进，一起飞速增长。


    # 4.【运动脑】：四肢发达，头脑不简单


    四肢发达，头脑可不简单。孩子运动脑的发展，对智力、情绪、语言、创意都有影响，注意咯，这里“运动”，不单指在运动场那类型狭义运动，而是泛指人身所有部位的任何动作。运动技能跟社交能力，认知和语言是同步发展的，彼此之间相互支持。如果你帮助孩子发展运动能力，他不仅只是会变得更强壮，而且也会变得更聪明，更善于跟其他小朋友交道。


    在运动脑模块，你已经知道精细动作、粗大动作、有氧运动、团体运动对孩子的重要性。精细动作和粗大动作能提升孩子的认知和创造力。有氧运动能增加大脑肥料，脑源性神经营养因子浓度的升高，让大脑更聪明、更粗壮。团体运动可以培养孩子的合作和分享的能力。我介绍了不少好玩的小游戏，培养运动脑没有捷径，赶快动起来吧！


    关于运动脑，我还希望你记住这些隐藏知识：

    轻轻摇晃宝宝（注意动作一定要轻柔！）

    能适当刺激孩子的前庭系统，锻炼平衡感。

    鼓励孩子做手势能促进孩子记忆力等认知能力的发育。

    充足的户外运动能降低孩子得近视的发生几率。

    多运动甚至能改善孩子的多动症倾向，减少孩子的问题行为。


    # 5.【创意脑】：创意可以刻意锻炼，激发大脑默认模式网络


    一些人认为创造力不需要教，只需要保护。在创意脑板块，你知道真正的创造力也需要被引导、被锻炼。当你发呆、出神的时候，大脑仍有脑区在忙碌，这就是大脑默认模式神经网络。大脑默认模式网络就像电脑的后台，当你的注意系统放松的时候，它还在运作，把你过去积累的知识库重新组合成有新意的信息，让你收获灵感一现。


    所以，创意可以锻炼，你需要积累一定的知识基础，也需要刻意激活想象力。我给你介绍了很多锻炼创意脑的小游戏，比如发散性思维游戏、联想性思维游戏、反事实想象思维游戏，帮助孩子在想象中学会解决现实问题。'
