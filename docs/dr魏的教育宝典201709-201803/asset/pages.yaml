    # 我想要发展孩子的运动能力，有没有挖掘孩子运动潜能的好方法？


    借着这个问题，我就再强调一下运动的重要性，如果你已经学完了这个课程，应该还记得，我说过很多次运动的重要性，因为运动不光能强身健体，还能促进宝宝大脑的发展，提升他们的认知水平。


    你可能知道，我的工作是研究运动控制，我自己也很喜欢运动健身。我发现，孩子是天生的运动健将。我大女儿虽然没有特意去健身房锻炼，但是她可以像优秀的耐力运动员一样，一整天跑来跑去，不知道累，特别是带她去游乐园玩儿的时候。


    # 那怎么才能挖掘孩子的运动潜能呢？


    前几天我看到一个研究，刚好能回答这个问题。今年四月份的一项研究，比较了小孩、普通成年人和专业运动员的能量输出和运动后恢复速率的不同。研究结果很有趣，发现孩子的肌肉不但跟专业运动员一样，能够抵抗疲劳。而且孩子在高强度运动中恢复得非常快，甚至比专业运动员还快。


    研究发现，大人的运动过程大多是无氧运动，会容易导致肌肉疲劳。孩子则更多地使用有氧代谢，因此在高强度身体活动的时候，他们不会感到疲惫。这就是为什么很多时候我们大人已经很累了，孩子还是可以玩个不停。


    虽然这个研究是针对8-12岁的小孩，但会让我们了解到，虽然孩子肌肉不像大人那么强壮，但是他们的肌肉耐力非常好。所以如果你想培养孩子的运动潜能，你可以将重点放在他们薄弱的地方，有意识的锻炼他们的肌肉强度，让他进行一些力量训练。比如，跑步的时候，让孩子做一些冲刺训练，买几个小哑铃，和孩子一起比赛举重，下楼梯和孩子一起比赛跳绳。


    这个课程里跟运动有关的文章链接，我也放在下面了，你可以结合着看看。


