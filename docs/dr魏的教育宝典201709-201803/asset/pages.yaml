  md: '# 132 | 关于安全感，你或许有这些误会


    132 | 关于安全感，你或许...


    Dr.魏


    孩子黏人，是不是没有安全感？

    前几天，有位妈妈问我：“孩子三岁多了，还老是黏着我，是不是安全感不足？”

    我说：“你具体说说，孩子是怎么黏你的？”


    她想了想，说了几件事：

    只要她回到家，孩子就老爱挤在她身边，总想爬到她身上；

    她和孩子一起在家，她在写文章，孩子玩小汽车，她起身去倒个水，孩子就赶紧跑到她身边，抱住她的腿；

    周末她带孩子去游乐场玩，孩子玩一会儿游乐设施，就跑回来找她腻歪一会儿，再去玩一会儿又跑回来找她，就是不能自己独立地好好玩。


    我一听，乐坏了。孩子有这些行为，就是安全感十足的表现，简直像教科书一样标准。这位妈妈完全误会“安全感”了。


    你肯定知道，孩子的安全感很重要。但现在流传的一些关于安全感的说法，容易误导人。今天我来正本清源，讲讲可能有哪些误会；再聊聊你可以做些什么，给孩子真正的安全感。


    # 一、关于安全感的四个误会


    心理学家人把依恋关系分为安全依恋和不安全依恋，如果是母子间建立了安全依恋关系，可以认为孩子是有安全感的。科学研究发现，安全感不仅影响孩子的社会情绪发展，还会影响孩子的认知发展。如果你很重视孩子的安全感，我能理解，也非常支持。目前网络上关于安全感的说法中，下面这四个都是误会。


    # 误会1：孩子黏妈妈，就是没有安全感


    第一个误会，就像那位提问的妈妈一样，以为孩子黏妈妈就是没有安全感。可恰恰是孩子建立了安全依恋的表现。


    你可以想象一下，宝宝像是一艘轮船，终将有一天会远航。一方面，他想离开基地，探索新奇的世界；另一方面，他需要一个停靠的港湾，累了回来加油，受伤了回来修复。


    你呢，在宝宝成长过程中，就要承担起这两个角色，一个是当宝宝的安全基地，坚定安稳，不管他走多远，都知道你永远支持他；另一个是当宝宝的安全港湾，如果他累了、怕了或伤了，随时可以回来找到你的安慰。


    这下你知道，孩子过一会儿就回来找妈妈，喜欢抱着妈妈、挨着妈妈，是把妈妈当做最信任最可以依赖的人。他知道，妈妈爱他、支持他。当然，随着宝宝慢慢长大，独立探索的时间会越来越多，找妈妈的频次会渐渐减少。


    # 误会2：孩子安全感不好，全怪妈妈


    我发现一个怪现象，只要孩子有安全感不好的迹象，别人都会怪妈妈养得不好。我得说，这锅不能都让妈妈背。


    当然了，妈妈的养育质量越高，孩子越容易形成安全型依恋，这一点是有研究证实的。一个有安全感的孩子，他的妈妈通常对孩子的需求敏感，而且反应迅速、一致又恰当，与孩子的情绪步调一致协调。


    但是，母婴依恋的双方是妈妈和孩子，孩子的特征也会影响依恋关系。举个最简单的例子，如果一个孩子性情是容易哭闹发脾气的那种，那妈妈有时候生气不理他也是可以想象的，这样自然对依恋的安全性有负面影响。


    再说，孩子生活在一个社会系统里，家庭环境、社会环境，都影响着孩子与妈妈的关系。你可以想象，如果在家庭里，爸爸和妈妈整天生气吵架，对母婴关系有什么影响；如果两个家庭内部环境差不多，一个可以请靠谱的托
    ontwerp 机构帮助照顾孩子，另一个没有外部力量的支持，对母婴关系有什么影响？


    # 误会3：妈妈小时候依恋关系不好，养孩子一定有问题


    我听说有人控诉自己的妈妈，说现在的亲子关系处理有困难，都怪小时候妈妈对自己太残忍。这个锅，不能扣在老人身上。


    依恋关系的确有代际传递性，国内曾有学者做过研究，发现妈妈与宝宝的依恋类型之间的对应率在60%以上。但正如你看到的，并非完全对应。西方心理学家发现，如果一个妈妈不管自己小时候的经历怎么样，都能客观冷静地讨论童年，那么她的孩子一般会形成安全型依恋。如果一个妈妈一回忆童年经历就恨，那么她的孩子常形成不安全型依恋。


    现在你知道了，小时候的经验，并不能决定你的养育方式，关键是怎样看待当时的经历。


    # 误会4：幼儿时期缺乏安全感，一辈子都会这样


    网上有人说，依恋关系的关键期是宝宝出生前两年，如果两岁前宝宝没有建立安全的依恋关系，就是给他人生打上了狰狞的底色，永远擦不掉。这个说法太夸张了。


    宝宝的依恋关系类型，在一定程度上是比较稳定的。国内学者跟踪研究100多个孩子，发现他们1岁多时的依恋关系类型与3岁时的依恋关系类型大多数一致。不过，你需要考虑养育行为的持续性、环境因素的稳定性。


    你肯定能想到，如果一个孩子2岁前得到疼爱的照顾，2岁以后家中发生变故，父母离异或者发生意外事故等，母子依恋关系很有可能会出现变化。


    如果一个孩子2岁前缺乏亲密关系，但后来妈妈的养育行为有所改善，或者家庭之外的有其他情感支持，孩子完全可能重新拥有安全的依恋关系。


    # 二、给孩子安全感，你可以这样做


    刚才说了这么多，你想不想知道，自己的孩子安全感够不够？首先你要知道，大多数孩子都有安全感。无论是东方还是西方，大部分文化中孩子的安全型依恋都占主导地位，在60%以上。


    不过有一件有趣的事，我想跟你分享。你可能知道，不安全型的依恋，又可以分成三类，一种是回避型，这类孩子跟妈妈关系平淡，离开妈妈时不哭，妈妈回来也不理；一种是反抗型，离开妈妈时反抗得特别厉害、哭闹哭，等再见到妈妈时又生气又想求安慰；还有一种是混乱型，有时候冷漠，有时候又激烈，比较矛盾。


    在西方文化里，回避型不安全依恋比较多，大约有20%的孩子属于这种。在中国和日本，反抗型不安全依恋比较多，在20%以上。混乱型比较少。可以说，在不同文化中，安全是一样的安全，不安全有不一样的表现。


    为什么会有这样的差异呢？


    学者们猜测，西方文化中，在宝宝很小的时候，妈妈就强调独立，鼓励他们自主探索、表达自己，所以回避型宝宝多；东方文化中，妈妈希望跟孩子关系密切，不希望孩子离开自己，又不鼓励孩子表达情感，对孩子发出的信号不敏感，所以孩子对妈妈有依赖，却又因为发出的情感信号得不到回应而生气，有矛盾心理，所以反抗型孩子多。


    那么，你可以给孩子更多安全感吗？当然可以了，记住一句口诀就行：敏锐地感知宝宝发出的需求信号，及时恰当地响应宝宝的需求。我举几个例子。


    安静——妈妈坐在沙发上，孩子在妈妈脚边的地板上，看着她，看看玩具箱，没说话。遇到这种情形，有的妈妈说，孩子安静地待着，挺好啊。但你知道，孩子这时其实是想探索那个陌生的玩具箱，但勇气又不足。他需要你的鼓励和支持。这时候你可以先开口问：“宝宝，你想玩什么呀？去拿呗。”


    哭闹——孩子跟另一个小朋友抢玩具，没抢赢，大哭大闹。有的妈妈在这个时候会拿另一个玩具去哄孩子：“给，玩这个吧，这个一样好玩的，看，还闪光呢。”可孩子还是哭个不停。你知道，孩子此时只想表达愤怒和伤心的情绪，他最需要的理解和安慰。所以你可以抱着宝宝说：“你很想玩那个玩具，又不能玩，所以很伤心，对不对？妈妈知道。”


    游戏——妈妈下班，好不容易陪孩子玩一会儿。孩子在搭积木，搭了两层的小房'
