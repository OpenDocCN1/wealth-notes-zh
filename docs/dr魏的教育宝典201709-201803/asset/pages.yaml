  md: '# 5.孩子没有礼貌且难以温和沟通怎么办？


    三岁半的男宝最近表现得非常没有礼貌，而且难以温和沟通。比如小一些的时候还懂得做一些简单的事情，可是现在让他去拿个杯子都会拒绝，用很不礼貌的语气说“你叫我干什么呀”。再比如，教他认字，之前学得很好，可是最近就非常不耐烦，并且讲很多条件还是不配合，非得逼我训他一顿。


    虽然我知道要注意沟通方法，但是现在沟通明显比以前艰难多了。这种情况怎么办？一方面，我担心惯坏孩子；另一方面又怕要求太严格，对他也不好。


    Dr. 魏


    你可能知道terrible 2（可怕的两岁），其实还有horrible 3（恐怖的3岁）以及unbearable 4（不可忍的4岁）。孩子的成长是螺旋式上升的，在不稳定与稳定的状态中交替，就像是小说一样，出现冲突，剧情跌宕起伏；解决冲突，剧情平缓。


    打破稳定状态的一个重要因素是孩子长大了，他的认知层次更丰富了。你以前让他帮忙做一些事，他不多想，爽快答应；现在则可能有“小算盘”：我想偷懒，如果我拒绝妈妈会有什么反应；妈妈很重视我的识字能力，我说不写她就很着急，嘻，我可以捞点好处……


    另一个重要因素是跟孩子的情感连接不够。恢复稳定状态的第一个方法是和孩子重新建立情感连接。是否最近陪孩子玩得少了，一起傻笑傻乐的时间比例下降？表扬孩子的次数变少？


    第二个方法是，遇到冲突时，把它当成帮助孩子成长的机会。孩子拒绝帮你拿杯子，先简单解释为什么需要他帮忙；如果当下不是特别着急做其他事情，可以再深入沟通。比如让孩子换位思考：你之前需要帮忙的时候，妈妈是不是帮你了？如果妈妈不帮你的话，你觉得怎么样？你可以选择不帮妈妈，那下次你需要帮忙，妈妈也不帮你。孩子的小算盘会重新算一遍：还是相互帮忙更好。之前你告诉孩子要相互帮忙，现在他自己经过思考，会更加认同这种人际关系。如果当下你有急事，那么可以事后再沟通。


    孩子的成长就像一部小说，出现冲突，解决冲突。祝你和孩子一起书写一部精彩的小说。


