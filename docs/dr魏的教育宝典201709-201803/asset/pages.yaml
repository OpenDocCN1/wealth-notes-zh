  md: '# 091 | 家庭聚会聊什么？


    Dr.魏


    家庭聚会聊什么？


    今天是中秋节，很开心在这个特殊的节日，依约能和你见面，首先祝你中秋节快乐！咱专刊叫“家庭教育宝典”，既然跟家庭相关，那么在这个团圆的节日，我就跟你分享下：家庭聚会应该聊什么？


    今天晚上带着孩子，跟爷爷奶奶、外公外婆，吃饭、聊天的时候，我替你多准备了20个跟“家族故事”相关的小问题，建议你啊，测测孩子对这些问题的了解程度。我列的这些问题不是随便写的，是基于心理科学的研究，有利于培养孩子的自我认知和归属感，有哪些问题呢？


    你知道你名字的来源吗？


    你知道你的爸爸、妈妈是怎么认识的吗？


    你知道你的祖辈（爷爷奶奶 / 外公外婆）成长的地方吗？


    你知道你爸爸、妈妈从得意（或失意）中得到过什么经验或教训吗？


    你知道你家族的国家背景吗？（例如中国、英国、美国）


    # 给孩子归属感


    这20个问题，是美国艾默里大学的心理学教授Duke制定的一份叫做“You Know”（Do You Know）的调查问卷。Duke教授的跟踪研究发现啊，这份问卷回答得好的孩子，他们的韧性也更强，面对9·11恐怖袭击事件留下的心理创伤，他们恢复得更好。


    我上周讲韧性的時候提过，韧性强、抗压力好的孩子有四个共同的特点：至少有一个稳定的支持者、对生活有掌控感、有自律和执行能力，有信仰和文化传统的支持。


    不过呢，我上周详细讲了韧性的前三个特点，特意留下最后一点，“有信仰和文化传统支持的孩子，韧性更好”，有家长留言说，不是很了解这条的意思，我来给你详细解释一下。


    想要有坚韧的内核，需要你的内心稳定并且充满希望，这点单靠个人是很难做到的。但如果你是从属于某种信念或某种文化团体，可以是团体、也可以是民族、国家。这些集体的力量可以带给你稳定、积极的体验。


    比如对我来说，万事皆有规律是我的信念，科学和思考是找寻规律的途径。所以，我处理复杂的事物的时候，或者碰到困难的时候，不会慌乱，也不会被神秘主义或者迷信所欺骗，我会耐心的寻找事情的答案。而我认识的知识分子团体或者科学家团体，都是这样的、或者类似的人。


    当然，对于孩子来说，没必要让他参加什么团体，你只要带孩子参加一些家庭活动，比如聚餐、亲戚朋友串门儿，让孩子觉得自己是集体中的一员，他就会更有归属感。


    # 孩子对家族历史越了解，越能够更好地应对挑战


    当然，也不是光带孩子去聚会，串门儿就可以了，重点是在聚会上，给孩子介绍介绍亲人，讲讲家族人经历过的人生故事。


    宝宝到两岁的时候，开始在大脑中形成一些概念了。你还会常会发现，他喜欢盯着看你在做什么事情，并且，很快就能记住事情的顺序。


    我用脑科学来解释一下，对事件的记忆，细节很容易被遗忘，比如具体用哪些纸张或者书籍来学习会被遗忘，但跟时间相关的记忆，比如学习的几个步骤和它们的先后顺序，这些会记得更好。用大白话讲就是：有套路就记得牢。


    宝宝心中有了时序概念之后，他开始想要维护内心世界的秩序，如果外面的世界跟内心世界不符，他就会焦虑。


    很多孩子做事情有一套自己的仪式，比如早上一定要先穿袜子、再裤子、最后穿鞋。我看到一个家长留言，说孩子习惯了睡前读故事，有几次晚上明明已经很累了，还非要读绘本，看着孩子抱着书，边读边点头打瞌睡，家长又是好气又好笑。


    为什么会这样呢？我们的大脑随时随地在对自己做的事情做预测，我们也会随时随地地把这个预判和事实进行反馈对比，这叫神经系统的预测性编码（predictive coding）。


    当宝宝遇到的事实，跟他大脑的预判不能匹配的时候，他还不能很好的处理这种反馈，在他看来，就是他内心世界的秩序被打乱了，他会非常焦虑。


    对于我们大人来说，我们很难理解孩子，可能还会觉得这孩子怎么这么古怪、死板。成人可以灵活解决各种灰色地带的事情，可是对于孩子，他还没有积累够经验，就好像一个厨房新手，面对“盐也许”这种概念常常不知所措，孩子是很难去想象这个世界有多复杂的。


    接下来，我会详细教你，怎么消除孩子对不确定世界的焦虑感，并且提升孩子对生活的掌控感？保证你的这个中秋节过得更加有意义。


    # 1.带孩子参加家庭聚会，多讲讲家族故事


    第一点就是带孩子参加家庭聚会，多讲讲家族故事。Duke教授和同事分析了问卷结果，发现家族故事问卷回答得越好的孩子，他们对生活有更加强烈的掌控感；自尊程度更高；对家庭生活更有信心；焦虑水平更低；行为问题也更少。


    讲什么呢？你可以讲讲我们国家的故事，比如联系国庆节，讲讲国家的发展历史。你还可以讲讲祖辈们的故事，他们是怎么一步步建立这个家族的。或者，讲讲爸妈成长的故事，他们两个人结婚的过程等等。


    你也可以询问孩子他的日常生活是怎样的，他早上、中午、晚上做了些什么。如果让孩子了解他家族的故事，他父母的人生轨迹，甚至是他自己每天的生活，都会给他一种掌控感，他对自己的人生会有更多自信。最适合分享这些故事的时间，可以是家庭聚餐、开车出行、节假日、生日聚会等。你看，中秋节，一家人对着明月吃月饼，聊聊家族过去的故事，本身就是仪式感十足。


    听到这里，你是不是跃跃欲试，想赶紧给孩子讲家族故事了？先别着急，讲什么很重要，怎么讲更重要。


    # 2.用有起有落的风格讲故事


    讲故事的方式，很有讲究。前面说到的Duke教授发现，每个家庭都有他们讲故事的方式，一般有下面三种：


    +   （1）只提当年勇型


    第一种，只提当年勇，光给孩子讲家族里经历过的比较好的经验，比如，“你爷爷以前当过村官，你爸我当年顺利考上大学，工作之后遇到你妈妈，很快就结婚，买了房子，有了你。”


    +   （2）自怨自艾型


    第二种，自怨自艾(yi)，只跟孩子抱怨家族里发生的不好的事情，比如电视剧《武林外传》里，老板娘总跟家人抱怨：“当初要没嫁给你哥，你哥就不会死，你哥不死，就不会落到这破地方。”


    +   （3）有起有落型


    最后一种，是最健康的讲述方式，不但跟孩子讲述家族里遇到的艰难困苦，也跟孩子讲家人们是怎么互相帮助、克服困难、最后获得成功的。


    比如告诉孩子：“我们这一家，经历过低谷也经历过繁荣。当年你爷爷做过村官，但是家里经济条件比较差，靠着亲戚们的资助，你爸我考上了大学。上大学之后，虽然艰苦，但是我努力学习，终于找到一份稳定的工作…”


    Duke教授发现，这种有起有落的讲故事的方式，会让孩子更有自信，孩子觉得困难并不可怕，因为他们不是一个人在“战斗”，他们背后有强大的家人支持，他们最终可以克服困难。


    这时候，孩子产生了一种“代际自我意识”（intergenerational self），代际就是几代人之间，比如父母和孩子，祖父母和孙儿女。代际自我就像自我意识，不过是几代人的自我意识放到一起，整个家族产生'
