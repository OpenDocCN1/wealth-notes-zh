  md: '排绪，汇报演出很累，只是觉得她情绪差，以为她在幼儿园遇到了不开心的事情。


    有次她生病了，第一次打吊瓶，孩子平时是能沟通的，但这次打完针突瞪脾气很暴躁，一直哭，找过几次护士，都检查说针没问题，大家以为她是生病闹情绪，只能安抚，过了一会，发现打针的手肿起来了。原来她不是闹脾气，是针没扎好，她很难受，又表达不出来，只能暴躁。


    我提到这两个例子，是因为经过这些事情，我收获很大，第一，孩子早睡很重要，要养成9点睡觉，7点起床的规律生活；第二，孩子身体是不是有问题不是那么容易看出来的，有时候只能用心去感觉孩子情绪里的异常。


    接下来，分享两方面自控力养成：


    # （1）对冲动的引导


    先说说对冲动的引导吧，孩子想吃好吃的、想玩好玩的，要赖脾气怎么办？


    我家是这么办的，先来个例子，暑假的时候带小麦出去玩，她在酒店商场看到一套玩具，被吸引住了，完全挪不动步，我一看价格也是怂了（真不是我抠门，很完整的一套森林家族），然后我就开始说服小麦，“这个玩具真是太好玩了，妈妈在淘宝上给你搜更多、更好玩、更便宜的，选好了再买好不好”，我的劝说有效果了。


    我非常赞同孩子冲动不能压抑的道理，准确来说不能全部压抑，家长应该引导孩子处理冲动，自己选择会更好，孩子很满足，也总会有期待。吃零食也是同样的，添加剂少的、安全的可以吃些，添加剂多的、不安全的就不吃，跟孩子说清楚利弊后，引导孩子自己选。


    # （2）对情绪的处理


    再说说情绪处理，对于情绪处理，家长和孩子都可以学学共情，叨叨魏提到过。这招真心好用，孩子情绪差的时候先表示出理解，就能很快找出情绪差的原因和解决办法，或者有时候甚至不用想解决办法，孩子就又开心了。


    自控力源于爱，如果我们不是真的很爱孩子，就不会付出这么多去发现，去理解，去尊重孩子，并且努力让自己变得更好。管教孩子的时候，如果孩子感受到的是爱，获得的是自控力，如果孩子感受到的是愤怒，获得就可想而知了。


    | 金牌家长-可爱的Q


    首先我要告诉大家的是我是个爷爷，照理应该谈谈隔代教育。但我特别想分享的是如何教宝宝说话，这个问题有不少人关心。我就想把我是如何教宝宝说话的经验拿出来，与大家分享。


    # （1）说话的目的是更好的与人交流


    交流在先，然后再发展了语言。所以，一定要跟孩子多交流，多互动。


    在宝宝一个多月时，我就会用大人的口气跟宝宝说话了。不少人笑话我太过于着急，孩子这么小，能听懂什么？而我不这么认为。我的目的是在对话过程中跟宝宝互动，虽然她的确不会说，但她会跟你“啊、哦”回应着，高兴起来还会笑，这个互动过程不就是她与我的交流吗？为什么不能看做这就是在说话呢？


    # （2）如何让孩子学会说话，并正确表达意思


    让孩子看着妈妈叫“妈妈”，看着爸爸叫“爸爸”，叫的多了就学会爸爸妈妈这两个词了。而叫“爷爷奶奶、哥哥姐姐”等等，因为有好几个人，孩子会判断、理解和接受的过程。所以相对慢一些。这些带有称呼的词都好教，说的多了就慢慢明白了，所以学说话要从常用语言开始。


    当她学着发出声音时，家长要表现出高兴的样子，鼓励孩子继续说，同时小声的纠正孩子的发音。切记要“小声提示、大声表扬”。从单音节到双音节，我家宝宝不到2岁就能说出很多话了。


    但是，正如叨叨魏提到过的，每个孩子具体情况不同，对于说话这件事，家长要有耐心，不要太较真。


    ![](img/bce617503caab4aa8727e0f05b5e6106_1_0.png)


    以上就是哄专栏从昭明家长们的分享，关于育儿，每个家庭都有一套独特的心法，希望你也能够不再潜水，积极冒泡，参与其中。


    【活动】你的育儿经验可以收录进专栏文章'
