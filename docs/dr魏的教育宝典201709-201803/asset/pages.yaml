    156 | 培养外语小达人攻略


    ![](img/bce617503caab4aa8727e0f05b5e6106_186_1.png)


    Dr.魏


    你好，我们的专栏即将结束了，订阅用户超过了9万人，感谢你的支持，我也希望看到你的收获，还有宝宝的变化。这一年，你的宝宝在哪方面改变最大？欢迎你留言告诉我，我将对应五脑体系综合考量，从中选出聪明宝宝、语言宝宝、情商宝宝、运动宝宝和创意宝宝。活动内容以及奖品，我放在了文章末尾，点击即可查看。从今天开始到3月13日，我们进入复盘期，工作日不间断更新，帮你梳理全年课程。这一期的主题是外语启蒙，外语的重要性不言而喻，掌握一门外语就是打开一个新世界，下面我总结了一份培养外语小达人攻略，希望可以帮助你家宝宝打开外语世界的一扇窗。


    # 培养外语小达人攻略


    +   1. “晚”一点不如“早”一点


    语言的习得，是从生活中自然地学语言。孩子在小时候学习语言的能力最强，能够习得的语言，可不只有母语，而是能够同时学会两种甚至更多的语言。一些家长也担心孩子错过了语言学习的敏感期怎么办？确实跟成年人相比，孩子早期的认知系统比较适合学习多语言，但不是说孩子过了敏感期就学不好外语了。不管孩子多大，现在开始学外语就合适。很多精通多国语言的人，他们也并不是从小就浸泡在多语言环境中的。当然我们鼓励早学语言，早学外语，因为在儿童期的语言学习敏感期可以被利用，学习时更不费力。


    +   2. 多种语言的大脑表征区交织成网状：早学外语，不同语言之间不会相互干扰


    学习语言，学的是包括语言在内的一整套与环境互动的方式。换句话说，孩子很自然地就能明白，该在什么样的情境下使用什么语言，在母语和外语之间切换非常快，并不会混淆。脑科学表明，如果小孩子从小同时学习双语的话，两种语言在他大脑里的表征区是网状交织在一起的，使用多种语言时在各自区域之间来回自如地跳转，互相不会干扰。但如果成年后才学习外语，母语和外语的表征区有点涣分明显，长久不使用外语，母语表征区就会逐渐侵蚀外语表征区，表现在外也就是外语能力退化。所以宝宝可以尽早学习外语，不存在不同语言之间相互干扰的问题。


    +   3. 神经可塑性：越早说外语，外语越地道


    越早学习外语，小孩的外语越地道，口音也会更加标准。大脑极具可塑性，宝宝语言的习得是被环境所塑造的，大脑的语言中枢每天被环境中大量语言类刺激所塑造。宝宝可以分辨出各种口音的细微差别，但是如果只接受单一的语言刺激，比如只有中文的话，长大后可能辨别外语发音中一些细微的差别比较困难，或者是发音上不是非常地道。很多研究表明，两岁之后的小孩会慢慢丧失辨别母语里没有的音的能力。


    +   4. 浸入式学习法：“背”出来不如“玩”出来


    你不需要等孩子掌握了母语后才开始学外语，而是越早让孩子暴露在双语环境中越好，这叫浸入式学习，让孩子泡到外语环境的坛子里，像学母语一样自然而然地吸收外语。这就比起长大以后再用背单词、记语法的方法有效得多。研究发现，婴儿学习语言最有效的方式是真人面对面地交流。用视频放出同样的语句，婴儿学起来的效果就没有那么好。因此，外语学习“背”出来不如“玩”出来。这里的“玩”指的是家长和宝宝之间丰富的互动，玩出来的外语能力就是在生活中来学外语，在面对面的交流中，孩子不仅仅是记住一个单词，而且能自然地掌握大量其他的信息，更容易理解语言所指代的意义，也就更容易习得语言。


    +   5. “玩”着学外语，互动很重要


    那你该怎么跟孩子“玩”着学外语呢？这个“玩”的关键，其实就是你跟他的互动。来看我是怎么教女儿学会草莓“strawberry”这个词的：拿草莓给她吃的时候，指着草莓对她说：“eat
    a strawberry.”看似简单的场景，却包含了非常丰富的信息量。我指着草莓，她的注意力就被手指引导过来了，开始集中精神观察眼前的物体；用手指着草莓，孩子就明白“strawberry”指的是什么；我一边说一边做出咬一口的动作，所以不仅知道这是可以吃的，还复习了“eat”这个动词；我还笑眯眯地看着她，这是一个表示鼓励的表情。为什么这一系列互动对语言学习这么重要呢？因为人和人面对面交流的时候，信息的传递量最大。孩子不但学到一个词表层的意义，还能领会到更深层的意义。除了语言，孩子还能学到草莓的质地、色泽、香味，以及名词strawberry和动词eat之间的区别，甚至还学会察言观色，读懂别人表情和表情下面隐藏的信息。小孩的大脑不擅长抽象学习，所以硬逼他从字面上记记忆，去背单词，是没有必要的。但是通过和孩子互动的这种“玩”的方式，就是具体的学习，这是符合孩子大脑生长规律的。那就算面对大量信息，孩子一样能吸收得更快一点，记得更牢一点。


    +   6. 日常活动中“玩”外语的方法


    利用那些反复出现的日常活动，如吃饭、上厕所、睡觉、起床，来跟宝宝说英语。孩子需要在大量重复的场景中习得语言规律，把相同的意思换不同的描述和语法反复说。这些活动本身就是孩子熟悉的，又是反复出现的，所以他很容易理解，也很容易就记住了。例如吃东西，除了“Let’s
    go eat!”、“eat a strawberry”之外，还有“Do you want to eat?”（你要吃吗？）、“It’s time to eat.”（到吃饭的时候了）、“Don’t
    eat this!”（不要吃这个！）。围绕“eat”，使用祈使句、描述句、疑问句、否定句，孩子不仅会记住这个词，而且能明白这个词的相关场景，这才是真正地习得一门语言。日常生活中能找到大量重复的单词，比如天气、数字、孩子经常玩的游戏、喜欢的动物、卡通形象，用这些跟孩子接触最多的、最感兴趣的日常词汇，变着花样教给孩子。


    +   7. 最重要的原则：以激发孩子学习兴趣为出发点


    语言的习得，得靠潜移默化，要润物细无声地学，发展孩子对外语的爱好和信心。这里要求家长多花精力陪孩子，注意在生活中多跟孩子用英语互动，而不是把孩子扔到培训班，或者放到英语学习机面前就行了。


    +   8. 做孩子的朋友：一起看动画、读故事


    对于外语基础一般的家长，可以利用儿童英语学习类的资源，想要在家创造一个英语的微环境，可以通过跟孩子一起听英语歌谣、看英文原版动画片、读英文故事来实现。精选这些资源是一门学问，一是要从孩子熟悉的生活场景出发，比如《小猪佩奇》(Peppa
    Pig)，这部动画片讲的是能够引起孩子共鸣的日常生活故事，孩子才会感兴趣；二是选择经典的内容，口碑、获奖与否等都是参考因素，比如 BBC 或者 Nick JR
    出品的一些儿童节目，内涵丰富，发音也标准。


    +   9. 做孩子的老师：带孩子玩节奏感游戏


    研究表明，宝宝天生喜欢节奏感，跟着音调拍节拍，能够提高宝宝语言、记忆能力。比如拍手拆单词游戏，把长单词拆成音节，同时有节奏地跟孩子拍手，让他感受单词的音节。例如butterfly（蝴蝶）可拆分成为[bu-tter-fly]，你就可以跟他一边拍手一边念。你可不要低估了孩子的记忆力，孩子的发音甚至比你更准，这个词就潜移默化地进入他的大脑了。还可以把单词升级为句子，比如儿歌：“Five
    little monkeys jumping on the bed. One fell off and bumped his head. Mama”'
