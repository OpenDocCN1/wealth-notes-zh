    065 | 摆脱畏难情绪的秘诀：跳一跳，够得着


    # —— 本周家长分享 ——


    Dr. 魏


    本周三，你学习了工作记忆。工作记忆就是大脑里暂时存放信息的记忆缓存库，里面贴着记录你现在要处理的暂时信息的“便条贴”。


    IT行业出身的宝爸@Nick 注意到电脑和人脑工作原理的相似之处，从电脑的角度分享了他对工作记忆的理解，非常有意思。


    大脑其实是个黑箱子，脑科学家想尽各种办法来探索它。用电脑的工作原理来认识大脑，也是很重要的一个方式。


    宝爸@Nick的分享：从电脑的工作原理来认识大脑


    通过Dr.魏的这篇文章《工作记忆，头脑里的“便条贴”》，我们了解到工作记忆的基本概念及它对孩子和成年人的影响。我也谈谈对此的理解吧，本人是学习计算机的IT男，计算机中有内存、CPU中央处理器、多进程、多线程等概念。其实，这都是模拟我们人类大脑的工作原理。


    老师提到的工作记忆，以我的理解就类似于计算机中的内存。电脑有4G、8G等不同规格的内存配置，其越大说明性能越好，“工作记忆”也应该是如此，都是越大越好，但也都有上限。


    我的“工作记忆”不太好，所以经常忘事，也有轻微的阅读障碍，但是，我也可以通过不断的努力，将工作记忆的内容转换为“永久记忆”的内容，就如同把内存缓存数据处理进硬盘或数据库中。这个过程是反人性的，非常辛苦，所以，无法做到什么事都往永久记忆中塞。


    好在，电脑中还有一个叫做“索引”的东西，它可以加快搜索速度。当我们无法想起某件事情的时候，只要提及某一线索就可以回忆起来，我想这个线索就如同计算机中的索引。因此，我觉得多给孩子建立“索引”，是一个提升“工作记忆”的好办法。


    在和孩子一起阅读、玩游戏或者旅游时，我们可以建立一些“索引”，时常和孩子一起回顾，不断调用，我想孩子的“工作记忆”会逐步提升的吧。


