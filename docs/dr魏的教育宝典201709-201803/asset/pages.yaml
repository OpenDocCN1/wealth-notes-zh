    # 1. 如何应对教学风格严厉的学习班？


    我家儿子五岁了，近期发现他有点轻度焦虑。引爆点是我给孩子报了当地比较有名气的拼音班，这个机构的特点是极其严格却也着实有效。


    孩子第一次去试听，刚开始上课就跑出教室再也没去过，2小时我苦劝无果，始终没进去。可能是因为第一、孩子没经历过40人的大班；二、主讲老师带的扩音器，音量很大，他胆怯助手求助一旁的助教老师说想妈妈了，但助教不理睬他。


    一周后正式的第一节课，我勉强将他推入教室，遂即离开教室，我听到孩子一直在哭，之后老师说“你哭什么，又没人骂你....。两小时的课时，老师不停呵斥班里的孩子。


    课程每次都有课前测试，课后过关测试，过关的孩子按时放学，不达标的留下直至学会才放学。第一次课除了学过拼音的孩子按时放学，其余的都留下了，当天退班的有10多名学生，我们也在其中。


    我很犹豫不知道这么做对孩子好亦是坏。事后，孩子上机器他最爱的编程课，都不进班了，非要我陪着一起。我发现孩子不是厌学，他紧张发汗说自己坚持不了40分钟。


    我正面引导，在允许的情况下陪同会儿，逐渐离开，情况渐有好转。现在，我想向魏老师求助：如何让孩子不那么脆弱，适应能力更坚强？孩子很敏感，但他小时候，我总拉着他的手指户外门牌、标识的字给他念，很小就可以自己阅读2小时，现在可以看连环画版的《水浒传》，计算能力也很强。可我还是担心，要怎么做才能帮助孩子健康成长？


    Dr. 魏


    你的做法已经是很好的答案。当你发现孩子进的拼音班是专制型的教学风格后，及时帮他退班。当孩子的恐惧延auf到原本喜欢的课程后，你给予他支持，等他适应后逐步退出。


    专制教学，其实已经把那部分不适应的入筛选掉了，所以看起来效果好。更重要的是，学习是一场马拉松，而不是短跑。靠外力强迫只能出短期效果，孩子往往是怕而学，不是爱而学，恐怕后劲不足啊。


    # 2. 孩子遇到陌生人就闭上眼睛，怎么办？


    我女儿刚满两岁，近来发现她喜欢通过闭上眼睛来表达不喜欢、抗拒、紧张和害怕等情绪，比如不想吃饭，就闭上眼睛扭转头。最近，孩子遇到陌生人也会闭上眼睛，这该怎么办？


    Dr. 魏


    眼睛是心灵之窗。这闭上眼睛啊，就像是拉上窗帘一样，把不想看到的东西遮挡在外面。啊，电视里有儿童不宜的镜头，赶紧用手遮住孩子的眼睛。看，我们用手给孩子当窗帘。所以，你女儿闭上眼睛，其实也是用来调节情绪的。


    我之前跟你分享过：情绪调节的三个步骤，第一步是帮助孩子描述情绪，这是很好的帮助孩子平复心情的方法。


    # 3. 孩子无理取闹怎么办？


    我家的宝宝马上就要三周岁了、很懂事，但是，最近遇到一个问题：孩子经常无理取闹。比如，大人把芹菜煮好了，再煮的话就不能吃了，但宝宝非说芹菜没煮熟，要重新再煮。解释半天没用，一直坚持，一直哭闹。实在没办法，只能由他哭，没有理他。


