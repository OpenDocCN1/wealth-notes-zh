    # 1. 左撇子需要纠正吗？


    听魏老师的课让我受益匪浅，有个问题想请教您，关于左撇子您有什么看法？我家女儿现在两岁，从抓东西开始就用左手，现在画画、吃饭、翻书，都是用左手，我担心她大一些写字改怎么办，要不要纠正？


    Dr.魏

    左撇子是正常的，大概10个人里面有1个。

    一般在2-3岁可以确认。大一些学写字，一开始可能会慢些，容易写反，手也容易抹黑，但现在有很多教左撇子写字的方法，经过练习，孩子也是能写好字的。

    可以在孩子接受的情况下，引导她用右手做一些事情，但不要强迫，不然会给孩子造成很大心理压力，效果也不好。从长期来看，孩子仍然更爱用左手。

    左撇子在创造力方面有一定的优势，在像乒乓球、羽毛球等一对一的体育赛事里，因为遇到右撇子多，容易熟悉他们的套路，在这方面有优势。


    # 2. 投影仪对孩子眼睛好不好？


    宝宝快两岁了，打算适当给她看些动画片，但是电视伤眼睛，用投影仪看，会好点吗？网上一些说法是投影仪不会伤眼睛，我本来就是高度近视，宝宝眼睛底子是不是就天生比较弱？因为在网上看到高度近视要遗传的，期待您的回答。


    Dr.魏

    现在很多商家宣传投影仪不伤眼睛，其实都是噱头。

    投影画面亮度低，画面清晰度也比较差，看起来反而更费劲，对孩子的眼睛不好。

    真正保护眼睛的关键是用眼习惯，比如控制观看时间、定时休息、姿势良好、保证户外活动等。

    美国儿科学会最新建议，小于18个月的孩子，除视频聊天下外，避免接触电子屏幕；

    而18-24个月的孩子，如果家长想要引入电子产品，可以选择高质量节目，并和孩子一起看；

    2-5岁，每天观看高质量屏幕节目不超过1小时，家长要帮助孩子理解节目内容。避免快节奏、内容分散、含有暴力成分的节目。

    我推荐了咱专栏的两期文章《电子设备，是洪水猛兽还是育儿助手？》以及《家长如何帮孩子挑选电子产品？》，感兴趣的朋友可以在看完今天的文章后，点击文末尾的推荐阅读，复习查看。


    # 3. 杜曼闪卡记忆靠谱吗？


    现在非常流行的闪卡记忆靠谱吗？像七田真早教，就以闪卡为主，每节课能闪300张卡片，据说用一秒以内一张非常快的速度可以打开孩子右脑，形成图像记忆，可大人看了都反应不过来，真的可以给孩子看吗？


    Dr.魏

    七田真的学说，在脑科学还不怎么起步的时候就提出来了，它的理论根基就是错的，而“右脑开发”我也驳斥了很多次。

    什么是闪卡呢？它其实就是一种纸做的卡片，用来教文字、数字等。以教文字为例，卡片正面是图像，比如一个苹果；背面是苹果这个汉字。

    家长拿着一摞卡片，让宝宝看苹果图像，同时给他念苹果，每次呈现时间在一秒以内，速度很快，所以叫闪卡。

    你说的闪卡应该是杜曼闪卡，它是美国人格伦·杜曼在上个世纪50年代提出来的，主要用于治疗脑损伤儿童。但是杜曼的理论在诞生没多久，就受到主流学术界的否定。美国儿学会会分别在1968年和2010年批判了杜曼的理论。

    其实，闪卡本身是有一定科学依据的，但是，杜曼闪卡就是伪科学了，因为，它只是让孩子被动暴露在大量快速切换的信息下。

    我之前说过，孩子是用多感官认识和理解这个世界的，越小的孩子更是如此。只让孩子被动地、快速地看闪卡，他可能因为机械记忆能力强，能够一时记住某个汉字、某个数字，但是他真的理解这些符号的意义吗？而且，在快速被闪的过程中，几个月大的孩子，会不会养成不耐烦、注意力短的坏习惯呢？

    如果你不相信快速减肥、快速致富，那么，也请你远离所谓快速记忆，给孩子足够的时间成长。


    # 4. 家有二宝，如何和谐相处？


    我家大宝今年9岁了，男孩。在没有生妹妹之前是自己在自己房间睡，偶尔会和我睡。但是自从生了妹妹，暑假都是和我睡，快开学了怕妹妹影响他休息，可是他自己睡经常半夜跑来跟我们床上就睡了。

    我是让他回去睡，还是让他继续睡呢？他爸爸有时会把他赶走，让他自己去睡，但孩子有时好久都睡不着（我偷偷看的）。

    我应该怎么办呢？


    Dr.魏

    大宝可能是因为妹妹的到来，意识到大人对他的关注减少了，跟妹妹会有竞争感。建议和大宝沟通，给他多一些一对一陪伴时间，让大宝帮助照顾妹妹，比如拿尿布、唱童谣等他所能及的事情，培养大宝对妹妹的感情。

    我有两个女儿，一个六岁多，一个快一岁了，在日常生活中，我和家人会特别创造机会，让姐姐参与到妹妹的生活轨迹中。现在，姐姐渐渐发现了小baby的可爱，慢慢培养起对妹妹发自内心的爱。

    兄弟姐妹其实是另一种形式的好朋友，一种有血缘关系的好朋友。有时候我们有太多依赖血缘了，以为有血缘关系，孩子就应该无条件接受对方，应该相互礼让。

    但是，对于幼儿来说，道德和血缘他们一点概念都没有，这种说教孩子也理解不了。能让他们自发善待彼此的办法，我觉得就是“日久生情”。


    # 5. 宝宝胆小怎么办？


    Dr.魏的专栏期期都听，但这是第一次留言。请问下，我家宝宝一岁5个月，性格比较温和，遇到霸道的宝宝被打了怎么办？

    再看到那个小孩子我就怕，我感到很羞愧，为什么这么胆小呢，该怎么培养他的胆量和竞争性呢？


