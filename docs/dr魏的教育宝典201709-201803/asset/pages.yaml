    第一，让孩子拥有至少与一个亲近的人，比如与家人朋友的牢固的支持关系。这个支持关系对孩子的恢复极其重要。如果这个人是你，你要对孩子表达你的支持和爱。


    这里的支持是指，让孩子知道他现在是安全的，他不会再随时受到伤害。而且，言出必行、保持一致性。也就是说如果你跟孩子许下承诺，你说你会听他讲话，孩子说话你就静下心，你说你周末会带他去玩，就要执行。这样才能重新建立起孩子对人的信任感。


    这里的爱是指，多跟孩子沟通，教会孩子描述他的情绪，比如鼓励孩子把恐伤、恐惧的情绪用语言、文字、绘画或假装游戏描述出来。孩子遇到创伤，自尊心会受到伤害，你可以多表达你的爱和鼓励，让孩子重新相信自己的能力。并且，对孩子保持耐心，孩子对创伤的反应可能不同，可能是反抗可能是逃避，他们愈合的表现也不会是直线上升的，会有反复的可能，给他们多一点耐心陪在他们身边。


    第二，孩子在家的时候，尽量保证家庭环境比较和谐、有规律。孩子对自己的生活有掌控感，他们更会有安全感。比如建立清晰稳定的家庭时间表，每天几点起床、几点吃饭、每晚几点一起读书，孩子知道到了什么时间会发生什么事，这种规律的作息习惯首先会让他感到安心。更具体的内容参考《087｜韧性，给孩子的未来买一份抗压险》《082｜读者问答：给家长的情绪自控法》，你可以在文末的推荐阅读中找到。


    # ——► 本周家长分享 ◄——


    Dr. 魏


    留言区有很多爸爸妈妈希望我推荐给本，宝妈大头详细介绍了她家宝宝两岁以前读过的绘本，以及她给宝宝选绘本的小诀窍。值得参考！


    家长“大头”分享给宝宝读绘本的小诀窍


    首先，针对小宝宝，为促进语言能力发展，家长学会买书和坚持亲子阅读很重要。


    我家从宝宝6个月开始亲子阅读，一开始买的触摸书、翻翻书、洞洞书和发声书，在孩子触觉发育敏感期，让孩子好奇地感受光滑、柔软、粗糙等不同触感的材质；在手部敏感期，让孩子玩洞洞书、翻翻书和发声书等趣味书，既满足孩子喜欢抠一抠、摸一摸的手部动作，又可以通过翻书来锻炼精细动作。小宝宝有趣味性的纸板书籍，能启发孩子玩书兴趣，宝宝在玩的过程中，家长可以润物细无声地引导孩子认知、学习语言。


    对于一岁以内的孩子，我认为在亲子阅读中重复词语，以及用熟悉的词语进行交流互动，可以吸引孩子注意力，保持孩子阅读兴趣，提高语言发展。


    我推荐的书籍有，《亮丽精美触摸书》系列、《宝宝的第一本躲猫猫游戏书》、《小玻翻翻书》，以及《拍拍小兔子》绘本。


    首先推荐的是《亮丽精美触摸书》系列，一共4本。比如其中的《小熊波比》是中英文双语的，书里有各种各样的 小动物和植物，它们身体的部分器官是用实物模拟做出来的，例如真实的花瓣、企鹅的身体、小狗的舌头和毛草草的狐狸，给孩子粗糙、柔软、坚硬、光滑等多种触摸体验和极佳的精美图画的视觉刺激。小宝宝可以学习认知动物和植物，书中也设计了一些益智游戏，促进孩子形象思维和好奇心的发展。


    另一本是《宝宝的第一本躲猫猫游戏书》，这是一本洞洞书，趣味性强，帮助孩子发展认知力；句式简单押韵，便于理解；图片色彩明亮，使注意力更集中。


    还有一本是《小玻翻翻书》，这是世界上第一套儿童翻翻图画书，经典的儿童翻翻书鼻祖，孩子都喜欢。这一系列书以其简明亮丽的图画、动手扒翻的设计，可以进行探索、猜测、触摸等运用心、眼、手的动作。


    最后推荐《拍拍小兔子》这类绘本，它可以充分调动孩子们的视觉、触觉，激发了孩子们的兴趣，给孩子带来乐趣，寓教于乐，在快乐中学习语言。


    另一方面，当小宝宝有玩书习惯后，家长除了提供给孩子必备的认知之外，还需要引入一些与孩子生活相关的有教育意义的婴儿图画书。如《幼幼成长图画书》系列，我女儿特别喜欢看，在两岁前几乎把这个系列的书都看完了，每次喝完汤，都要去看《喝汤咯，擦一擦》，帮助书中的撒汤的动物去擦一擦，学会模仿和玩起假装游戏。


    在13个月时，女儿开始读《东方宝宝》期刊，文字和画面都很简单纯粹，主题是所有孩子都喜欢的母爱、游戏、大自然。第一次订阅期刊，就激发了女儿第一次说出一句清晰的话。我读：“小鸡说，爸爸，我觉得你特别棒。”女儿答：“我也有爸爸！我也有妈妈！”


    针对会交流互动的孩子，为了提高孩子的阅读技巧和语言能力，家长可以尽量采用对话式阅读的方式，并对孩子回答互动进行鼓励。对于孩子不是很感兴趣的图书，家长可以将书中角色名字换成孩子熟悉的伙伴的名字，吸引孩子阅读注意力。家长还可以从图画书中，延伸出来子游戏，将图画书的内容与生活场景相结合进行描述，便于孩子语言理解和加深记忆。


    以《好饿的小蛇》为例，小蛇张开嘴“啊呜”“咔嚓”吃东西，我都会把嘴张大做出要吞的样子说“啊呜”，然后再做出吞咽的动作说“咔嚓”，孩子很快就会模仿了。当遇到她不好好吃饭时，我还引入绘本情节，发出“啊呜啊”，还能让孩子吃饭。虽然女儿才一岁多，但是她早已理解《好饿的小蛇》的故事，还能灵活地把词汇在生活中运用起来。


    23个月时，女儿在画几条弯弯曲曲的简笔线，我问她画的是什么？女儿说：画一条大蛇，看到一个香蕉，啊呜，咔嚓，吃了。又看到一个苹果，啊呜，咔嚓，吃了。


    刚好翻出孩子的成长记录，借此机会跟大家分享：


    +   9个月时，开始安静地听完一本书。

    10个月时，开始发音两三个字。

    11个月时，开始开口用两字回答问题。

    12个月时，很会交流互动。

    13个月时，第一次说清晰的句子。

    23个月时，能够日常对话。


    我问：脚可以用来干嘛？


    女儿说：可以走路；可以蹦蹦跳跳；可以踩在椅子上取洗手；可以踢球；可以踩开垃圾桶；还可以给秤秤闻闻臭。


    现在女儿刚满两周岁，已养成良好的阅读习惯，语言表达都挺好，能听懂日常英语交流。孩子的成长，都源于她自己对童书的喜爱，以及我们家长对亲子阅读的坚持。


