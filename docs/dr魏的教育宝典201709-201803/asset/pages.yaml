  md: '有很多，但只有在孩子愿意玩的前提下，它们才能起作用。强迫孩子练习肯定没效果。还有，你需要给孩子搭脚手架，在孩子当前能力基础上，给他提高一点点难度，让他踮踮脚尖能够着。只有不断地增加挑战，游戏才有效。


