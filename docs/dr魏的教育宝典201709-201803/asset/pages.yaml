    # 给孩子的六一礼物


    专栏的老朋友一定对“吃汉字的小刺猬”不陌生，这是我和爱贝睿科学团队的用心之作。作为识字启蒙教具，它贴合儿童语言发展的脑科学原理，让孩子在边玩边学中认识500个常用的字词；更重要的是，他操作简单、玩法多样。小刺猬是我女儿最喜欢的游戏玩伴，去年上线之后，更是成为了更大平台的畅销品，获得了数万小朋友和家长的青睐。


