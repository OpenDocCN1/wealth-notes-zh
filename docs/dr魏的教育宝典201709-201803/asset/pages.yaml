    # 小宝宝总跟大人唱反调？


    急救包


    1个观点：

    孩子“叛逆”，主要受自身个性与环境教养两个因素影响。具体到每一次叛逆，还得具体问题具体分析。比如孩子拒绝洗手，你要注意是不是发生了不开心的事，将情绪发泄在洗手上。事后跟孩子回顾，了解他当下的想法，非常重要。


    +   特效药：

    1. 执行规则上，要温柔而坚定

    2. 提出要求时与其用命令式，不如用关心式

    3. 开家庭会议定规则，统一标准对待孩子


