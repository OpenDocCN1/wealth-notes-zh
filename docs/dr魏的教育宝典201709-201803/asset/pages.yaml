    “幼小衔接”的林妈妈更关心的识字和独立阅读的问题。你从“为什么要认字/阅读”、“我们读什么”、“我们怎么读”的角度来帮助女儿，很全面。


    其实在孩子大概2、3岁的时候，就可以时不时指读，让孩子意识到绘本上的文字了。他们也不会不知觉地识字。有的家长担心识字会破坏孩子想象力，但你想啊，文字其实是一种符号思维的体现，和假装游戏本质是一样的。


    孩子把香蕉放在耳边当电话打，不会破坏想象力；同样，孩子把香蕉这个词语当成食物香蕉，想象力也是存在的。


