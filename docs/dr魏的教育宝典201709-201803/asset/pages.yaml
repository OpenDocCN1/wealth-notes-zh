    076 | 读者问答：孩子上幼儿园..


    Dr. 魏


    下周预告：让孩子爱上学习、人工智能


    每位爸爸妈妈都想知道，怎样才能够让孩子喜欢上学，那你首先得知道孩子为什么不喜欢上学？原因有很多方面。但是，认知科学告诉你，我们可以让孩子的学习更高效，让孩子更有成就感，真正爱上学习。


    第二个问题是人工智能，这个话题现在非常火爆，假如你正在参加推理大赛，有机器人、大人和小孩，你觉得谁会胜出？谁更有可能是下一个福尔摩斯？下周告诉你。


    # —— 本周问答时间 ——


    +   1. 蒙眼识字有科学依据吗？

    2. 大人不让开冰箱，会破坏宝宝的好奇心吗？

    3. 学英语主要靠左脑、学中文主要靠右脑？

    4. 不限制孩子吃零食，才能培养自控力？

    5. 孩子上幼儿园磨蹭怎么办？


    # 1. 蒙眼识字有科学依据吗？


    蒙眼识字有科学依据吗？孩子有必要学吗？对学习能力的帮助有实际意义吗？


    Dr. 魏


    留言区经常有家长会问到这个问题，我在这里我先说一结论：这是伪科学，千万别信。科学是我们评价的唯一标准。


    # 2. 大人不让开冰箱，会破坏宝宝的好奇心吗？


    宝宝最近很爱开冰箱，然后把冰箱里的东西拿出来扔在地上，或者拿走水果自己吃起来，奶奶在家带孩子就不愿意孩子开冰箱甚至用透明胶封起来，孩子试过几次也主动把透明胶撕掉，后来奶奶就贴在底部，孩子看不到的地方。


    Dr. 魏


    # 3. 学英语主要靠左脑、学中文主要靠右脑？


    在网上看到这样一段话：香港大学脑神经专业曾经有一个研究，这项研究是汉语学习和英语学习的脑神经对比，历时多年，结论是：学英语主要用左脑（逻辑），学中文主要用右脑（形象），非逻辑，所以要尊重儿童的本质，西方儿童应在六岁后识字，而中国儿童应在六岁前完成识字。


    Dr. 魏


    # 4. 不限制孩子吃零食，才能培养自控力？


    为了尽量减少孩子吃零食，我们家都是尽量少放零食或者把零食藏起来。但有妈妈说这样不利于发展孩子的自控力。她的做法是不限制她吃零食，吃完就多刷牙，避免蛀牙。'
