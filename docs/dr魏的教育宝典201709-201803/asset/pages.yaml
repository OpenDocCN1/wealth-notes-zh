    # 3.孩子突然变得黏人怎么办？


    儿子1岁8个月，一直是我一个人带。半个月前，给他爷爷带了两天，不仅晚上哭着找妈妈，而且之后回到家像是变了一个人，特别黏我，一转眼没看到就哭着找妈妈。怎么办呢？


    Dr. 魏


    孩子和你建立了明确的依恋关系。和你分离时，会出现明显的分离焦虑。离开你和爷爷待了两天，之后就特别黏着你，这也是焦虑的表现。


    这种情况是暂时的，如果你耐心地陪伴、及时回应孩子的需要，过一段时间，他会恢复过来的，不用担心。


