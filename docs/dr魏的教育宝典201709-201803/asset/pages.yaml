  md: '# 113 | 读者问答：孩子遭遇创伤如何修复？


    Dr. 魏


    下周我将集中帮你解决两个问题：怎样让孩子当演员，通过戏剧游戏培养孩子的创造力？以及，该不该奖励孩子？


    本周谈到可以把读绘本当舞台剧，用演的方式帮助孩子学习语言。可能你已经发现了，在“演”的过程中，如果邀请孩子一起参与，他会更加感兴趣。实际上，孩子自己天生就会演。下周就主要跟你聊聊，怎样让孩子当演员，通过戏剧游戏培养孩子的创造力。在这个过程中，你可以是什么角色，具体可以怎么做好？


    另一个问题是，该不该奖励孩子？这一直是比较有争议的话题。一些人说应该用奖励强化孩子的行为，另外一些人说“胡萝卜和大棒都不对”不该奖励孩子，奖励相当于是在给孩子吃“有毒的胡萝卜”，会让孩子对奖励产生依赖，失去他们的内在动机。对于奖励这个问题，我是怎么看的？下周告诉你。


    # —— 本周问答时间 ——


    +   1. 孩子不愿意给爸爸妈妈念绘本怎么办？

    2. 小龄宝宝哭，抱还是不抱？

    3. 孩子喜欢重复看某一本绘本怎么办？

    4. 如何让孩子好好吃药？

    5. 孩子遭遇创伤如何修复？


    # 1. 孩子不愿意给爸爸妈妈念绘本怎么办？


    宝宝4岁了，已经读过很多遍绘本了，基本上都能背下来，但只愿意听，不愿意讲给爸爸妈妈，也 облег然角色扮演，问原因是因為怕读不好。我们发现他有点完美主义，如果一件事情没有百分百的把握，就完全不愿意尝试。我和宝宝经常跟他说，做对与做错不重要,重要的是尝试去做，可是他依然不愿意做，我们该怎么办？


    Dr. 魏


    你们已经做得很好了，鼓励孩子，重视过程而非结果，鼓励他尝试。孩子4岁了，自尊心越来越强，对别人的评价会越来越在乎。这很正常。虽然他能够把绘本背下来，但是让他讲给你听，对他来说挑战比较大。


    建议你们循序渐进，鼓励他开口。大人念的时候，要故意留一些空，让孩子来补全。比如读《鼠小弟玩跷跷板》，你可以问孩子，鼠小弟跟什么动物玩跷跷板？哪些动物过来帮忙了？接着做个思想实验：如果爸爸像大象哥哥那样坐在跷跷板上，你坐在跷跷板另一边，它会动吗？妈妈来帮你，跷跷板会动吗？就这样用上角色扮演了。


    等孩子打开话匣子，建立起自信，你再鼓励他多讲些，也不迟。


    # 2. 小龄宝宝哭，抱还是不抱？


    《改变心理学》这本书里提到，宝宝夜里睡觉时间哭闹，如果家长不理会，宝宝就会明白夜里哭是不会有人理他的，这样夜里自然而然就不会哭闹了。这意味着宝宝如果饿了，或者是有生理需求，或者生病了，我们夜里都不要理会吗？请问对于培养孩子行为习惯，这个方法是否可行？


    Dr. 魏


    如果我是宝宝，我会觉得好凄凉，我不会说话，只能用哭来告诉爸爸妈妈，我病了，我饿了，我不舒服，我想你，可是爸爸妈妈却不理我。我不哭，不是我懂事，而是我觉得没人会理我。


    我的好朋友、爱贝睿家长教练陈杏老师对婴儿哭声有深入的研究。她说，0~6个月是宝宝跟世界建立信任的关键期，小婴儿哭的时候，尽量多抱和多安抚。想让孩子自己哭够够，坚决不去抱，培养其独立精神，是揠苗助长的做法。被宠的宝宝未来会拥有更好的人际关系。


    # 3. 孩子喜欢重复看某一本绘本怎么办？


    我女儿特别喜欢读小库的一本书叫《爸爸，然后呢？》，我给她买了很多绘本，但她独爱这本。在我给她讲解的时候，她还要主动要求重复里面的话语，现在她都能边看边说了。为什么孩子会对不同的绘本有不同的态度呢？这又代表了什么呢？


    Dr. 魏


    孩子对某些绘本情有独钟，很正常。就连大人，也会偏爱某些人、某些食物、某个节目，因为这些能够给我们带来诸如快乐等积极情绪。你不妨观察女儿听这本绘本的状态，是不是很专注投入、积极情绪很多呢？


    你可能担心女儿重复看某些绘本，限制了阅读面。其实，重复是学习之母，对年龄小的孩子来说，学习需要重复的次数更多。每次重复，他们都在把故事中的素材内化，变成自己的知识。英国的一项研究表明，多次阅读同一本绘本故事的孩子，能够更好地学习新词汇的意义。


    如果你念烦了，不妨学习家长“鱼”的方法，她会故意把字读错。比如在读《不莱梅的音乐家》时，原文是“里面住着一伙强盗”，她会故意读成“里面住着一个强盗”，结果孩子会说：“不对，不对，是一伙强盗。”你也可以偷偷“篡改”《爸爸，然后呢？》的情节，比如“替北极熊赶走鼹梦”，改成“替北极熊赶走鼹子”。孩子发现后，说不定会哈哈大笑。而且，这也是提高孩子创造力的方法：原来，故事还可以这么玩！


    # 4. 如何让孩子好好吃药？


    Dr. 魏


    让孩子吃药确实是一件斗智斗勇的事儿。


    首先，你需要和孩子清楚吃药的目的，是因为他生病了，需要吃药，身体好了才能和小朋友玩。你可以把细菌、病毒、药物都拟人化，给他讲一个关于药物警察大战细菌或病毒怪兽的故事，让他意识到吃药的重要性。


    其次，孩子抗拒吃药，往往是因为药苦。国内著名的医学科普网站丁香医生建议，首选给孩子选择有果味的药品，口感好，孩子容易接受。如果不得不用“重口味”的药，千万不要挤鼻子，容易呛到；不要配上果汁、牛奶或藏在其他食物里，会影响药效，除非医生同意；可以加一点葡  萄糖水，改善一些药的口感。吃药前和吃药后都喝一些，但要记得漱口，避免蛀牙。


    喂药时，如果孩子拒绝用勺子，可以用专门的喂药器或注射器，换种有趣的方式，孩子可能更愿意接受。利用假装游戏，你还可以告诉孩子，这是药物警察的神奇警车。他也可以自己推药水，更好把握。


    如果孩子特别抗拒，可以用大拇指和食指按住孩子两侧颊上腭关节处，使上下颌分开。当然，这是最后的选择。


    尽量少用玩具来贿赂他。如果要用，建议给巧克力或糖，让他马上可以吃，盖住药的味道。如果非要用玩具，而每次都买一个玩具不现实，那么不如打白条。比如喝一次得到一张贴纸，集满五张就可以得到玩具。这里请注意，大人一定要说到做到。


    祝孩子身体健康！


