    # | 金牌家长·liyi


    选英语启蒙绘本时，如何避免被名家堆砌的书单砸晕？


    在现在的社会，会讲英文如果还算是一项技能的话，那么未来，你的孩子会讲英文，也许已经不算是一技之长了，会变成必备技能。也正如此，家长们开始了对英文启蒙教育的重视。


    英文启蒙，不是把孩子甩给英语机构，家长才是孩子启蒙环境的创造者、资源的提供者，而这些并不需要家长有多高的英语水平，只要具备科学的方法。


    我用这几年来自己给孩子选择英文绘本过程中积累的经验，跟大家分享一下，作为家长借助最多的启蒙道具——英文绘本，该如何选择、如何有效利用。


    # （1）亲子共读是操作前提


    绘本针对的主要是进入独立阅读阶段前的孩子，如果没有家长的陪伴，孩子只翻不读，只看不学，对语言和思维发展，绘本其实起不到什么效用。


    所以亲子共读是英文绘本阅读的操作前提，要知道与孩子共读不仅可以增进亲子感情，提升孩子的学习兴趣，同时还可以更新你的认知，这可是性价比极高的投资。


