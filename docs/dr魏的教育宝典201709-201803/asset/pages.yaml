    Dr. 魏


    小胖子的大烦恼，家长如何来帮忙？


    现在网络上流行各种各样的瘦身方法，基本上会涉及这两方面：运动和饮食。不瞒你说，我自己也很爱健身，经常到健身房打卡。适量的运动，确实对身体的各项机能有好处。


    除了运动外，饮食健康其实不仅仅对大人瘦身有帮助，对孩子更重要。我有次送女儿上学，在路上看到一个小孩，大概一米三四的个头，胳膊肉乎乎的，像小婴儿一样有“藕节”，就是像藕蘸一样，一节一节的。这个孩子胖，由于体重的关系，走路都有点吃力，摇摇晃晃的。妈妈在前面走，他在后面气喘吁吁地跟着。


    如果你注意观察，你会发现现在身边的小胖子越来越多。研究数据也支持这一。美国的新闻发言人说，从2002年到2015年，短短的13年时间，小胖子的数量翻一番都不止。现在的孩子，6个里边就有1个体重超标。


    想不想知道你们家是不是偏胖了？我给你超重儿童判定数据，你可以对照下（文章末尾附详细超重判定月龄表），根据2013年国家卫生行业标准，超过以下重量的孩子，需要注意了：


    +   1岁男孩超过12公斤、女孩超过11.5公斤；

    2岁男孩超过15.3公斤、女孩超过14.8公斤；

    3岁男孩超过18.3公斤、女孩超过18.1公斤；

    4岁男孩超过21.2公斤、女孩超过21.5公斤；

    5岁男孩超过24.2公斤、女孩超过24.9公斤。


    饮食不均、运动量不够，都有可能导致肥胖


    以前老一辈人总喜欢“胖乎乎”的孩子，加上现代人饮食不均，运动量不够，这对小胖子的增长也有一定的推动作用。


    可是，千万别再以胖为美了，体重超标会影响孩子的身体健康。比如像我见到的小孩，他走路稍微快一点儿就会呼吸困难。还有，胖孩子的骨折风险也高，甚至有心血管疾病的早期征兆。更可怕的是，小时候胖的孩子，长大后也胖的概率更大。如果孩子在小学胖，有50%的可能性在长大之后还是个胖子。


