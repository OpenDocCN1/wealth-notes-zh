    研究人员苏珊·库克和她的同事做了一个实验，教几组孩子学代数，第一组孩子只用语言学，把老师说的解题思路重复一遍。第二组孩子只用手势学，把解体思路用手指出来，比如做方程的时候，在数与数之间比划一下。第三组孩子既用语言学也用手势学。


