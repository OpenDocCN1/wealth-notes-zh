  md: '# 148 | 让宝宝受益终身的能力：执行功能


    Dr. 魏


    在童话里，小王子说过：“使沙漠如此美丽的，是它在某处藏着一眼睛水。”


    而我特别想跟你说的一句话是：“使孩子reiten美丽的，不是现在的世界看重的能力，而是未来的世界看重的能力。”


    你可能想问了，什么是未来世界看重的能力？在之前我已经讲过很多了，比如好奇心、同理心、韧性。今天，我再讲一个特别重要能力——执行功能。


    为什么有的孩子长大后意志坚定，有的孩子却容易分心，容易被诱惑呢？脑科学家认为这些能力是跟“执行功能”相关的。执行功能这个词听起来有点儿抽象，是吧？请你来跟着我做一个小游戏，你就明白了。


    # 1.执行功能是什么？


    游戏的规则是这样的。当我说“老师说，要做什么”的时候，你要做出这个动作，如果我前面没有说“老师说”，那你就不要做这个动作。现在咱们来试一下：


    +   “老师说，摸摸你的鼻子”

    “老师说，摸摸你的耳朵”

    “老师说，双手交叉放在胸前”

    “把双手放下来”


    你最后把手放下来了吗？我说是“双手放下来”，前面可没有加“老师说”，那你就不能做这个动作。


    这个游戏很简单，但在完成这个游戏的过程中，你要集中精力听清楚我的指令，还要快速判断这个信息对应的动作是什么，并正确、快速地做出来。在听到“把双手放下来”的时候，你要抑制自己不要放。在这个过程中，你就用到了“执行功能”。


    “执行功能”是当前认知神经科学研究的前沿问题之一，它是个体对自己的思想和行动进行有意识控制的心理过程。就好像大脑里有个指挥官，我们计划、组织信息、做出判断、解决问题都要受到这个指挥官的控制。说到这里，你大概明白执行功能的重要性了。执行功能的核心能力有三种，咱们之前都讲过，它们分别
    finales：


    工作记忆，能在短时间内掌握和操纵信息的能力。


    抑制控制，抵制冲动的能力，也就是我们常说的自控力、自律。


    思维灵活性，能够根据不断变化的需求调整计划，做出符合新情境的要求。


    # 2.孩子日常生活与执行功能息息相关


    你想想，从前面讲了这么多执行功能是什么，你可能想问，执行功能跟孩子的日常生活有什么关系？不管是学习新知识，还是解决有挑战性的问题，日常生活中的方方面面都需要执行功能。我举个例子，你就明白了。


    冬冬是我朋友家的孩子，一个上幼儿园大班的小女孩。朋友前几天看到我，就跟我吐槽：“哎呀，孩子都长这么大了，晚上睡觉还费劲。放学回家写5行拼音要花一个小时。到了睡觉的时候还没玩好，不愿意睡。从开始刷牙到躺到床上又得半小时，我提醒她，她还嫌我烦，气死我了。”


    从执行功能的角度来看，冬冬的问题出在哪呢？她没办法灵活地根据外部条件切换任务，到了睡觉的时间也不睡；也没办法很好地控制自己的冲动，就是想玩。孩子写作业和洗漱准备花费时间长，可能是分心、没能记住当前任务、没有按照既定目标行动，同样也跟执行功能有关。


    大脑的执行功能，有点儿像交通系统的指挥中心。如果信息处理出现冲突和障碍，路上就可能堵车——孩子表现出各种各样的问题。当孩子遇到类似困难的时候，你可以帮助他。比如我给朋友这样支招：


    孩子缺乏制定和执行计划的能力。你可以跟他一起列计划，写清楚做事情的时间和步骤。我跟大女儿一起制订过一张作息时间表，把睡觉前要做的事列出来，贴在她卧室的墙上。接下每做好一件事情，孩子打一个勾，勾到睡觉的时候，孩子就知道，接下来该睡觉了。


    孩子写作业花费时间多，你要帮助他判断是哪里出了问题。如果是作业太难，可以讲一讲，帮助降低难度。如果是孩子走神、抑制控制能力弱，不能专注于一个目标，你可以教他把做的事情说出来，比如写拼音的时候写一个念一个，这样更易集中注意力。


    另外要保持孩子的桌面干净，写作业时除了书、本和笔，桌上什么都不放，这样减少外界刺激物，可以降低分心的概率。


    总的来说，思路是降低难度，明确目标，教孩子利用语言当思维记忆工具，多给孩子具体的提示，减少有可能让他分心的刺激来源。


    # 3.运动游戏提升执行功能


    有研究表明，执行功能在人类出生后不久便开始发展，3-5岁是这组技能急剧增长的一个重要关口，大脑从7岁之后，呈平稳持续发展，至成年早期。


    ![](img/bce617503caab4aa8727e0f05b5e6106_168_0.png)


    执行功能与大脑前额叶紧密相关。前额叶和其他新皮层共同完成对信息的加工、整合及协调控制复杂的认知活动。但你知道的，人的大脑前额叶发育较晚，二十岁以后才发育成熟。你可能想问，那父母就只能等着吗？也不是。你平时也跟孩子玩一些能锻炼执行功能的游戏，帮助孩子适应未来。


    其实，你并不需要太多新奇的游戏，许多传统的游戏，都可以锻炼孩子的执行功能核心能力。比如讲故事、跳舞等等。作为体育大学的毕业生，我要为体育运动代言，我想介绍几种经典的运动类游戏给你。


    （1）躲猫猫


    躲猫猫是玩起来很方便的游戏，不太受时间和地点的限制。对于小宝宝，你可以藏好玩具，让宝宝去搜。等到宝宝会走路之后，你可以自己躲起来，让宝宝找。记得多换几个地方藏，在这个过程中，宝宝要学会记住之前的旧地址，追踪新的路径，他们的工作记忆在不知不觉中提高了。宝宝要理解游戏规则，等你藏好再开始找，对他的自我控制能力也是一种挑战。


    （2）踢足球


    高级体育活动，特别是需要协调的活动，比如足球，可以改善执行功能的所有方面。你想象一下，在踢球的过程中，你需要不断监测环境变化，并做出快速反应，对于选择性注意、观察、抑制控制、行动来说，都有不小的挑战。所以我非常鼓励孩子多进行体育运动。


    （3）红绿灯


    你演警察，孩子当行人。比较简单的玩法， przypad “木头人”差不了多，孩子随意做什么动作，只要你喊“红灯”，孩子就停下来，你说“绿灯”，孩子又可以动。


    要想增加难度，你可以加入红色卡片和绿色卡片，要求孩子根据你出示的颜色做反应，红色停，绿色行；但你同时给孩子干扰，用语言下指令说，“红灯”“绿灯”；你说的指令有可能跟卡片不一致，比如出绿色卡片说“红灯”，这时候就需要孩子控制住想停下的行为，继续行动。


    再来点儿难度变化，还可以假装你们在火星上，火星上的规则和地球相反，听到“红灯”开始活动；听到“绿灯”，保持静止。


    你看，孩子在这个游戏的高级版本中需要记住三条规则，这是锻炼他的工作记忆。他在游戏中还要根据指令控制自己的行为，判断是活动还是停止，这动用到抑制控制能力。


    最后要强调一下，能提升执行功能的游戏有很多，但只有在孩子愿意玩的前提下，'
