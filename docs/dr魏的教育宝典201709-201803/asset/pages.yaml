  md: "# 126 | 考试，学习的好工具\n\nDr. 魏\n\n考试有用吗？\n\n我们小时侯都试过重复学习的方法，比如重复阅读背诵课文。我们也常说：读书百遍，其义自见，也是强调重复学习的神奇之处。\n\
    \n其实，认知科学家早已发现了更好的学习方法，却没有传播开来，大家还在用原始低效的方式教孩子。今天我告诉你一个简单又有用的方法，希望你能够好好利用它，并告诉更多的人。\n\
    \n# 1.考试与学习单词\n\n首先，我问你一个问题，你觉得孩子怎样学习，效率比较高？多学习几遍，还是多考试几次？还是有更好的方法，比如思维导图？举一个简单的例子，学习英语单词，一组孩子学完之后接受考试，学两遍考两遍；另一组孩子学完之后再复习，学四遍，你觉得哪组孩子记得更牢？\n\
    \n我现在先不公布正确答案。你记住自己的答案，继续往下听。我来给你讲一个科学家的实验。\n\n2008年，普渡大学的研究者在《科学》杂志上发表了一篇文章。他们做了一个实验，教一群大学生学外语，就是让这些美国的学生学习Swahili语。\n\
    \n一开始大家都一样，一起学一遍。然后，有一组学生每隔一段时间把全部单词复习一遍，再把全部词都考一遍；第二组只复习前面考试没答对的词，不过考试还是全部词都考；第三组复习全部单词，但考试只考以前不会的；第四组，只要是已经答对过的词，就不再考也不复习。\n\
    \n在这个过程中，大家掌握单词的速度都差不多，没有明显区别。研究者们说，好 экономика 好 了，大家回去吧，过一个星期再来测试一次。在回去之前，他们问这群大学生，你估计你下周过来，还能记得多少词啊？大家都说，差不多吧，一半一<|message|>\n\
    \n![](img/bce617503caab4aa8727e0f05b5e6106_120_0.png)\n\n+   - ST组：每隔一段时间把全部单词复习一遍，再把全部词都考一遍；\n\
    - S_N T组：只复习前面考试没答对的词，不过考试还是全部词都考；\n- ST_N组：复习全部单词，但考试只考以前不会的；\n- S_N T_N组：只要是已经答对过的词，就不再考也不复习。\n\
    \n你看，最影响学习效果的因素不是复习的多少，而是考试的范围。是考试让学生们记忆更牢固，重复学习基本上没什么效果。\n\n你可能要说，这只是记单词，算不上真正意义上的学习。你说得非常对，学习远远不只记忆知识点这么简单，还要有对知识的深度理解、与已有知识的连接，以及融汇贯通的运用。\n\
    \n# 2.考试与学习科学文章\n\n2011年，上面那个实验的第一作者又做了一个实验，有80位大学生参加，他们分成4组，学习一篇科学文章。一开始都一样，学一遍。然后有一组就不再学了，他们只学那一次。还有一组重复学习，后来又学了四遍。\n\
    \n第三组用概念图的方法学习，他们一边读材料，一边画出学习材料里各个概念的关系图。说到这里，你可能知道，这就是“思维导图”的方式，用一个节点代表一个概念，用连线表示概念之间的关系，形成一张图表。学生们需要认真理解和分析所学材料，才能够用一个有意义的图形结构把其中的概念组织起来。\n\
    \n最后，还有一组学生怎么学呢？他们学完第一次之后，进行回忆练习，能回忆多少就回忆多少。回忆完之后，他们再学一次材料、继续回忆，总共花的时间，跟画概念图的学生一样。\n\
    \n好，都学完了，科学家们去问80位同学：你们觉得，过一个星期来考试，你们还能记得多少啊？\n\n大家可以看看图，红色表示只学一次组的预测，他们估计自己能记住70%左右；黄色是学了好几次的，他们有信心，觉得能记住80%左右；蓝色是画概念图的同学，他们对自己的预测跟学一次的同学差不多；绿色是回忆练习的同学，他们认为自己也就只能记住60%吧。\n\
    \n![](img/bce617503caab4aa8727e0f05b5e6106_120_1.png)\n\n+   Study（学习组）：只学一遍科学文章；\n\
    Repeated Study（重复学习组）：先学一遍，后来又学了四遍；\nConcept Mapping（思维导图组）：用概念图的方法学习，一边读材料，一边画出学习材料里各个概念的关系图；\n\
    Retrieval Practice（回忆练习组）：学完第一次之后，进行回忆练习，能回忆多少就回忆多少；回忆完之后，再学一次材料，继续回忆。\n\n过了一个星期，这群同学回来考试了。这次考试有文字题，考同学们对那篇科学文章里单个概念的掌握程度，还有引申题，需要把不同的概念联系起来回答。\n\
    \n![](img/bce617503caab4aa8727e0f05b5e6106_120_2.png)\n\n# 3.提取练习效应\n\n所以你看，回忆练习在这里就是给自己的小测验，它倒逼着大脑去提取自己刚学习好的知识。这种小测验不仅能促进学习单个概念的记忆，还能促进深度学习。\n\
    \n听到这里，对于一开始我给你出的那道题，你可能已经知道答案了吧？\n\n相同情况下，考试比复习的学习效果更好。这个现象，在科学界已经被大量实验证实，被称为“提取练习效应”。由于提取练习效应的研究常常常用小测验作为提取的方法，所以有人直接叫它“考试效应”。\n\
    \n为什么会有这种考试效应呢？科学家们猜测，因为人类不可能记住接收到的所有信息，我们需要有选择地记忆。那么多信息，记住哪个呢？那些动不动就需要唤醒一次的信息应该是要有的，就记它吧。\n\
    \n也就是说，大脑判断一个知识点将来是否\r\n有用的标准之一，就在于它是否被检索过。你每次从记忆中唤醒一个知识，它就在你脑子里信号更强、更稳定。"
