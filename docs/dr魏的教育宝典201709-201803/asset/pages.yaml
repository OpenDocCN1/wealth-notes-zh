    Dr. 鹅


    家有二宝, 你可以做到公平相待吗？


    现在有两个宝宝的家庭越来越多, 我发现有不少问题, 是关于怎样处理两个孩子之间关系的。


    比如我看到一位家长留言, 她说她家大宝三岁, 二宝三个月。平时家人也没少教育大宝爱护妹妹, 可大宝还是一次次试图欺负二宝, 有时候大人装作没看见, 只要二宝没哭,
    基本上不会说她。


    但有一次, 大宝确实把二宝咬疼了, 孩子哭得特别惨, 事后, 只要大宝靠近, 二宝就开始哭, 大概是咬怕了。这两个孩子都是她自己带, 没办法把孩子彻底隔离。


    如果你家有两个孩子, 或者打算生二胎, 孩子争宠的问题, 需要格外留心了, 怎样才能让大宝学会爱护小宝呢？


    # 子女间出现抢夺式竞争, 是正常的


    这里我想说几点, 小孩之间有竞争是天生的, 让他们学会互相关爱反而是很困难的事。很多人以为家庭是和谐的港湾, 进化心理学却认为, 在我们哺乳动物中间, 同胞间的竞争是常有的,
    比如抢奶吃、抢爸妈的关注, 孩子们下意识地会想竞争更多父母的资源, 这种竞争又叫“抢夺式竞争”。


    其实在我家也一样。小女儿刚出生的时候, 只要我一抱她, 大女儿就跑过来黏着我。根源在于, 每个孩子的内心都深深渴望得到父母独一无二的爱。这种特殊感让孩子觉得有安全感。


    # 1. 用模因培养爱, 学会讲故事


    虽然说子女们天生会争宠、有冲突, 也不能破罐破摔; 孩子不哭就不管, 等到冲突大了再去处理。


    除了基因会影响人脑的决策和表现之外, 模因, 也会影响, 这里的模因是模仿的模, 基因的因。模因就是文化基因, 你可以把它理解为, 故事。从故事下手, 在日常生活中,
    用故事的形式把观念传递给孩子, 也可以改变孩子大脑的决策和行为。


    具体怎么做呢? 想让大宝爱护二宝, 首先得让大宝自己感受到充分的、独特的爱。你可以给孩子, 特别是大宝, 讲一些宏大或微小的故事。目的是用故事来帮助他理解“姐妹或弟弟”这种生物的存在意义,
    以及他自己的意义。


    比如, 在小女儿出生前, 我们已经做了一些准备工作。我会提前告诉大女儿, 有一个更小的宝宝要出生了, 她会爱哭, 也不 Wij会说话, 需要我们一起陪她长大。


    给小女儿换尿布、喂奶的时候, 我也会让大女儿在旁边看着, 跟她说: “妹妹其实就是小时候的你哦!” “你看我现在给妹妹喂奶, 以前也给你喂过奶哦!” “妹妹是向你学习的,
    你弹琴就能触及她的心灵, 你看她在旁边手舞足蹈了吧!”


    还有一点很重要, 每个孩子都是独特的个体, 有自己的个性, 不要在两个孩子之间做比较。


