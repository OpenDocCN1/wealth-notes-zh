    # 10. 做孩子的学生：让孩子带你玩外语


    学习语言，除了大量接受各种视听刺激之外，最重要的还是孩子自己要学会输出。当孩子的英语能力提高到一定程度后，你就可以鼓励他多唱英文童谣、讲英文小故事，或者跟爸妈妈一起表演小短剧。


    还可以请教宝宝："你看这个词我这么念对不对？"或者"你带我念念这一篇课文吧！"这样让孩子的学习更有成就感，更有效率。


