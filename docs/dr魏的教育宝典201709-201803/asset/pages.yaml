    你跟孩子玩过哪些打闹游戏？


    在非洲大草原上，两只小狮子在打架。小点儿的那只狮子先把爪子伸出去，拍在大个子狮子的背上；大个子狮子立刻转过身，对小个子狮子咧着牙；小个子狮子撒腿就跑，大个子狮子追了几步又停下来，躺下晒太阳。


    听到这里，你会不会以为走错场地，跑到《动物世界》栏目组去了？没有，今天的家庭教育宝典，聊的就是，小动物和小孩都存在的一种行为现象，叫打闹游戏（rough and
    tumble play）。不信你再看看下面这个情形，是不是很熟悉？


    在幼儿园的操场上，一群小朋友在疯跑。有 一个穿橙衣服的小男孩抓住前面穿蓝衣服小朋友的衣领，前面小朋友也回头抓住他的衣领，两个人一起摔在了地上，哈哈大笑。


    # 1. 打打闹闹有什么用？


    有科学家研究了打闹游戏对小白鼠大脑的影响，他们让一组幼鼠尽情打闹玩耍，30分钟后，解剖幼鼠的大脑，发现幼鼠杏仁核和背外侧额叶的脑源性神经营养因子表达显著升高。你可能还记得脑源性神经营养因子，我说过，它是神经元生长与存活所必需的一种蛋白质，可以帮助神经元形成新的连接，修复坏的脑细胞，保护健康的脑细胞，又叫做“大脑肥料”。这个实验的结果显示，游戏可能有利于与社会情绪有关的脑区的发展。


    # 2. 跟孩子“打”起来吧


    听到这里，你可能想问，爸爸妈妈在孩子的打闹游戏过程中有什么作用？爸爸妈妈的作用并不是监督者和评判者，总说“别闹了别闹了”。第一步，你自己要跟孩子“打”起来。


    # 3. 打闹游戏的小贴士


    打打闹闹没有定式，只要你和孩子玩得开心就好，所以我不介绍什么方法了。但是有几个地方需要提醒你一下。


    首先，注意安全。一个是物理上的环境安全，这个我不用多说。另一个是孩子心理上的安全感。当父母和孩子之间建立 \

    亲密关系之后，打闹游戏更能发挥积极作用。


