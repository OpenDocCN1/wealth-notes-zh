    加餐 | 三个科学育儿新发现


    # Dr. 魏


    亲爱的宝爸宝妈，我是魏坤琳。自从《Dr. 魏的家庭教育宝典》这个课程打造完成后。每周都有几千名父母加入进来，我每天都能看到很多新老用户在留言区分享自己的育儿心得和育儿困惑。所以，为了感谢你们，我今天挑出大家间比较集中的三个问题，统一做个解答，也顺便给你们分享几个我觉得很有意思的新研究。


    # 0-3岁需要不需要培育大脑智力？那么小的宝宝能有思维吗？


    小宝宝有思维吗？如果你细观察宝宝，你会发现当然有。我小女儿一岁多，她经常花很长的时间玩玩具。我有的候会看着她花十分钟探索新玩具，虽然她说话还不漂亮，我似乎能听见她边玩边在想：


    +   * 这是一个玩具车，这个小车会动吗？我来试试呗。

    * 这里有一个按钮，按这个按钮，车子能动吗？

    * 如果按下按钮，小车毫无反应，她甚至会表现出非常讶异的样子，会更起劲儿地玩玩具。


    在我眼里，我家一岁多的宝宝跟我实验室里的学生没两样，她正在用科学家的眼光来认识世界，首先观察，然后做出合理的推理假设，甚至做实验验证假设。如果假设不符合预期，她还会很惊讶。15年著名的美国《科学》杂志的研究发现，一岁宝宝会盯着那些让他有惊喜的、意想不到的事情更长的时间，他们甚至会主动尝试、反复试探，来找出事情的原因，所以说，宝宝天生就是小小的科学家。


    再挑战下你的认知，那更小的宝宝呢？他们有思维能力吗？今年年初的新研究发现，3个月大的宝宝已经有了学习抽象关系的能力——对，在他们完全不会说话时候，他们已经可以理解事物之间的关系，甚至是抽象事物之间的关系了。


    实验中，科学家向小宝宝展示玩具，这些玩具是以两个为一对的形式出现的。这其中有一半的宝宝看到相同的两个玩具，比如两个相同的布娃娃，这是相同配对组；另一半宝宝看到不同的玩具，比如一个粉红色方块和一个布娃娃，这是不同配对组。等宝宝熟悉了他们组的玩具，科学家会给宝宝看他们之前没见过的配对方法，比如给相同配对组的孩子看不同配对的玩具。最后，科学家会测量这些宝宝盯着玩具看的时间。结果表明，对于那些他们没有看过的新的配对关系，宝宝会盯着看更长的时间。


    这个实验首次发现，3个月大的婴儿已经具有学习相同和不同的关系的能力了，宝宝能学习他所看到的关系，也能对他从未见过的关系有反应。


    以前，很多家长可能以为孩子还小，逻辑推理、抽象思维能力要到孩子大了之后才去重视。但其实，你可以从小就开始培养宝宝的思维能力了，对，即使是在他还不会说话的时候。


    平时在家，除了带宝宝认识具体的物体，比如指着水果跟宝宝说：这是苹果，这是西瓜，这是香蕉。你还可以锻炼孩子的抽象思维能力。对于小宝宝，你可以带他玩一些简单的匹配游戏，比如把苹果和苹果匹配到一起，跟香蕉分开。对于大一些的宝宝，你可以引导他根据不同的特征，给自己的玩具、物品进行归类。比如引导孩子把相同颜色的玩具匹配到一起，或者相同形状的玩具匹配到一起等等。这其实都是在让孩子学会从普遍事物中抓取共性，提升抽象思维能力。孩子四五岁之后，你还可以带着他做探索性科学实验，让孩子实际体会会搜集证据，提出假设，验证假设的科学思维过程。


