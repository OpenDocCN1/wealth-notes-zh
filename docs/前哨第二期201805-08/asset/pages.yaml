    # 划重点


    +   1. 将外骨骼机器人与劳动密集型行业的实际需求相结合，开发能迅速规模化生产的产品，是未来的新机会。

    2. 在很多领域，机器人是无法完全取代人类的，未来的趋势，是人与机器紧密协作，优势互补。


