  md: '# 216 | 美国投资考察：理性决策的重要性


    216 | 美国投资考察：理性性。. ↓


    # ——内容看点——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 理性决策在产业布局中为什么非常重要？

    2. 积木式创新的洞察是如何得出的？

    3. 如何才能对技术趋势作更准确的判断？


    我们一直强调系统性、规律性，强调理性的决策，其实西方理性决策的一个表现，就是有大量的分析，包括定性和定量的。


    # 一、理性决策的重要性


    一个在产业投资领域里面最成功的代表，就是我们常提到的孙正义。


    孙正义进入各个产业领域的时候，都是基于大量的分析之后再作的决策，有时候一个分析甚至能够出几千页纸的报告。


    那么我们今天也看到他在各个产业领域里面布局的前瞻性，比如我们看到像人工智能、机器人，孙正义的布局又领先了。


    所以我们说，理性的决策在整个产业布局当中是非常重要的，对企业也必不可少。


    理性决策不一定能保证你做的业务会成功，但是这不是不作理性决策的理由。虽然理性决策仍然不能杜绝风险，但是如果违背理性决策都不做，那你的经营的风险实在是太大了。


    # 二、美国创新的格局


    其实我们在游学当中一直希望我们的所有的团员都能学会基于数据的理性分析。


    # 三、掌握新的规律


    我在美国投资就发现，有大批这样的公司，N多年没有收入，因为他们就是做科技转化的，产品出来之前每年都是只有投入，没有收入，而这样的公司一般规模较小，不到100人。'
