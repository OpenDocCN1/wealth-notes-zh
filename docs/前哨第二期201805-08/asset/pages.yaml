  md: '后当你的手触摸到 iPhone 表面的时候，iPhone 能够通过震动马达的精微的调整使你能够触摸到表面的凸起和凹陷。


    其实这个凸起凹陷是不存在的，是通过震动马达调节使你的手指感知到的，也就是说，你即使通过触摸也能感到你的屏幕是立体的，而不是一个光滑的平面，那真的是又是一个进步，尤其是对盲人来说可能意义非常巨大。


    当然，对我们普通人，当你没有办法用眼睛去屏幕的时候，也是非常有价值的。


    所以，苹果公司一向善于判断未来发展趋势，然后是先把科技预埋进去，所以它才能够持续的是科技发展的风向标。


    # 启示4: 硬件依然很关键


    虽然说苹果公司站到了无线互联网的风口之上，但是它能取得今天这么高的收入和利润也是和他做硬件相关。


    因为一般来说，硬件更容易实现高收入和高利润。


    设想一下，苹果如果不做硬件只提供软件，比如只提供 iOS。那么很有可能它在软件上都不能收费，只能免费提供，它只能靠广告模式来收钱。就相当于说谷歌做了安卓，就是安卓系统，但是谷歌并不能靠安卓来收钱，而是要靠里面的软件和其他的服务来收钱，那相对的，收入和利润就会小很多。


    那么正巧现在全球的科技创新也进入了硬科技时代，我们回顾一下：


    +   从一开始的 PC 创新，其实是硬和软都有；

    但是很多小的创业公司还是聚集在软件上，所以后来形成了软件创业的时代；

    然后是互联网的时代，这些都是软的东西。


    但是现在进入到硬科技时代，IT 也是需要硬的，像手机，包括现在人工智能需要智能音箱，包括自动驾驶需要汽车，大量的硬科技从各个领域涌现出来，更不要说像新材料、新能源，其实大量的都是硬科技。


    # 启示5: 在风口上利用自己的优势


    所以我们说，第5个启示，就是中国要学习苹果的话，要学会利用自己的优势，尤其是我们一直强调中国具有硬件制造的优势，尤其是大规模的复杂产品的开放制造优势。


    我们还需要加强我们的市场洞察，这个其实也是苹果做的很棒的地方，也就是说，它总能找到用户的需求，然后用先进科技去满足他们。


    另外一个，就是学会在风口上发力，因为我们都知道，风口意味着一个崭新的巨大的市场，那这种市场往往会使得风口上面的领导性的企业获得最大的回报，苹果就是很明确的例子。


    # 启示6: 把握未来的风口


    最后我们就说未来的风口到底是什么？


    一定要注重把任何的风口都和自己的优势相结合。


    比如说我们讲人工智能是一个风口，那么这个风口和我们的硬件优势结合，你就会发现说机器人可能是我们一个重要的突破。


    那另外像自动驾驶，因为人工智能要和车结合就会出现自动驾驶的这样一个风口，这是中国容易有机会去抢占风口的地方，因为我们有硬件的优势。


    另外一个像 5G 到来以后，会有 AR 增强现实，MR 混合现实和 VR 虚拟现实这些市场都会陆续地成熟，也会爆发出巨大的潜力。


    苹果突破万亿市值，我们更多的是要分析它背后的规律，而不是要把所有的功劳都归结到某一个人上面，同样的我们自己学会了这个规律，要积极运用，而不是只记得仰慕别人。


    因为，如果我们掌握了这个规律，我们能够驾驭风口，再加上利用好自己的优势，我们一样可以非常成功。我认为在未来的 20 年里，中国会诞生一大批跨国企业。


    以上就是我的总结。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵。'
