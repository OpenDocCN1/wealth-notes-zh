  md: '# 232 | 可再生能源：中国新能源产业迎来关键节点


    232 | 可再生能源：中国新能源。


    # ——◆ 前哨基金 ◆——


    在这一次讲的问答环节之前，先给大家报告一个好消息：


    我们从去年底开始筹备的一支由和我们紧密合作的科技企业家和投资人参投的“前哨基金”已经完成备案，可以开始投资了。这支基金主要用于投资国外先进科技企业在中国的中落地和中国的先进科技企业，投资的项目会优先从科技特训营同学的项目中进行选择。


    欢迎大家关注我的“全球风口”微信公众号，了解更多和“前哨基金”有关的事情，也欢迎你带着你的项目来7月的“科技特训营”为我们进行展示。


    不过，一定要有足够的科技含量，而且不能是替代进口，必须全球领先。还必须要有清晰的知识产保护。


    再强调一遍，我们不投纯的模式创新。其实现中国这些年科技产业进步很快，我们前面两年的科技特训营就看到了不少这样的科技领先的项目。而且作为科技前哨，我们也会持续为先进科技企业站台，不光为国际企业站台，我们更愿意为中国科技企业站台，只要你足够优秀。


    # ——◆ 模块总结 ◆——


    我们这个模块的主题是可再生能源，我们介绍了三个重点：


    第一，可再生能源的份额正在不断上升，其背后是源于成本的下降。目前已经进入大规模应用阶段了。为了实现提升效率，降低成本的目标，对可再生能源的生产、消纳环节，都需要采用精细化和智能化的管理，而技术进步则是最大的推动力。例如，人工智能、大数据和信息技术已经大规模应用到这些环节中了。


    第二，从产业生态的角度，可再生能源进步很快，目前以风能和光伏太阳能为主流。但目前储能技术相对落后，是这个产业发展的痛点之一。除了发展配套的储能技术之外，太阳能光热技术和电制氢储能技术的商业化规模虽然相对落后，但它们都具有能量徂存的优势。随着整个可再生能源行业的迅猛发展，消纳问题日益突出，这两项技术可能会迎来快速发展的机会。


    第三，从市场竞争的角度，代表未来方向的新技术不必然战胜老技术。得益于可再生能源的精细化和智能化管理，可再生能源的成本将会不断下降。但传统化石能源的结构也在不断优化中，价格也有一定的下降空间。因此，很难说哪一个的发展具有压倒性的优势，至少在近期，两者可以互为补充，各自发挥自己的优势。


    # ——◆ 用户问答 ◆——


    2018年5月国家出台的两个政策，一个是风电行业的，国家将推行竞争方式配置风电项目。另一个是关于光伏行业的“531新政”，将大幅缩减开发指标和降低标杆电价。他们的問題是，这是政府不支持新能源了吗？对新能源产业有什么影响呢？


    # 我多介绍两句：


    这两个政策指的是：


    2018年5月24日，国家能源局网站公布的《国家能源局关于2018年度风电建设管理有关要求的通知》，明确提出，新增核准的集中式海上风电和海上风电将全部推行竞争性电价配置项目资源。


    “531”新政，是指2018年5月31日，国家发改委、财政部、国家能源局联合发布的《关于2018年光伏发电有关事项的通知》。


    其实这两个政策都说明新能源产业到了关键节点了，以前新能源是新生事物，需要政府的补贴和优惠政策帮助发展，因为没有政府的政策倾斜，相当于让刚出生的孩子和成年人来比赛，当然很难成功了。


    其实美国这些年新能源发展碰到了瓶颈，主要原因就是政府的支持政策和补贴不足。


    中国的新能源蓬勃发展，也是有赖于政府的强力扶植。但是这些年中国的新能源产业迅猛发展，如果不调整补贴，就会造成新能源产业的利润主要来自于政府的这种局面。


    截至2017年底，中国累计可再生能源发电补贴的缺口达到1127亿元，其中光伏补贴缺口是455亿元，占比约40%。


    所以，在这个产业逐步成熟的时候，必须要逐步取消补贴，这是非常适时的调整。因为新能源最终要在价格上能和传统能源竞争，这个产业才算真正成熟，才算站住脚。而之前的补贴只是为了扩大产业规模，为产业取得规模优势，最终落实到价格优势上，起支持作用。产业不能靠政府的补贴来长期发展。


    有两位用户提出了，关于风力发电机对环境影响的问题。


    据说风力发电机会对当地的环境产生影响，是真的吗？如果有的话，是哪些影响？


    目前，风力发电机会导致鸟类死亡，我有一个想法，不知到王老师怎么看？能不能用播放驱鸟噪音，或者发光凝胶和闪光技术来驱赶鸟类？


    # 我的回答是：


    对新能源的问题确实需要有客观的评价，风电也是，比如噪音、电磁干扰，但如果风电远离人群，这些问题就不大。


    当然还有就是对环境的影响，这其中最大的就是对鸟类的影。


    据统计：


    北美风力发电造成每年20万到30万只的鸟类死亡，我们当然要辩证地看这个数字，美国的家猫每年就会杀死上10亿只以上的鸟类，不过那些都是小型鸟类。而风机杀死的很多是大型鸟类，而且很多是珍稀鸟类。


    解决办法：


    首先是立法，美国出台了《迁徙鸟类条约》Migratory Bird Treaty Act和《白头鹰、金雕保护法案》Bald and Golden Eagle
    Protection Act，规定对这些动物，即便是无心的伤害，也是要承担法律责任的。


    其次，就是从技术上去解决：


    +   一是选址，不要选候鸟的迁徙路线，不要选鸟类容易聚集的湿地；

    二是现有风机的改造，比如给风扇加装雷达，遇到鸟类飞来叶片就减速；还有把叶片喷漆成紫色，因为白色容易<|start|>虫子，虫子会招来鸟类；

    三是设计新型的风机，比如用一系列水平旋转的小扇叶代替一个巨大的垂直旋转的大扇叶，而整个风机的外观就像一棵大树一样，容纳很多的小扇叶；

    四就是对鸟类的驱赶，比如用噪音，或者用其它的闪光技术。


    不过，现在看这个问题还没完全解决，但是只要我们足够重视，就一定可以解决。


    我们中国上科技项目的时候容易强调它的正面作用，而忽视它的负面作用，所以我们更要加强对国外相关问题和解决方案的跟踪研究，不要像空气污染一样，国外摔过的跟头我们都要再摔一遍。


