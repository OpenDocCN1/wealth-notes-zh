    # ——» 前瞻·科技特训营 ◀——


    还有大约一周的时间，我的线下课程“前瞻·科技特训营”即将 sig  我连…


    我认为，科技正在改变每一个产业，作为一个合格的企业家，每年参加一次对全球科技前沿趋势的扫描是必不可少的。尤其是在中美经济冲突的大背景下，更凸显了中国各产业科技实力仍然不足的问题，解决这个问题答案，就在我们科技特训营的培训中。


    因为我们不光扫描科技产业前沿的成果，而且深入剖析全球科技产业的特征，以及中国企业如何对接全球科技创新、传统产业如何用好科技的方法。


    我们同时为你和其他企业家提供能力展示和资源对接的平台，还有我们前瞻基金会投资学员中的优秀科技企业。


    每年拿出一周的时间，也许你就会找到成为未来成功企业家的机会。还没有报名的同学要赶快去报名啦，请大家关注我的微信公众号“全球风口”，点击“科技营”报名。


    # ——» 模块总结 ◀——


    我们这个模块的主题是新能源汽车，我们介绍了三个重点：


    第一，美国和德国一般政府不干预市场运行，企业经营以市场需求为导向，但会出现创新企业被既得利益者压制的局面。传统燃油车企的市场主导地位依然稳固，充电相关设备建设进程缓慢。


    而中国，出于环保压力和对创新的支持，由政府牵头，强力主导推进电动汽车产业的发展，无论在优惠政策、技术和相关配套设备建设上，都走在了世界前列。这也是国外车企与中国车企合作，造车新势力与传统车企合作的重要出发点，这种模式符合我们所说的“积木式创新”的原理。


    如何更好地扶植新兴产业，产业、市场、资本、政府各自该如何定位，值得我们在全球的角度不断总结。


    第二，新能源汽车未来的产业格局，有可能是总体设计者+集成制造商的模式，因为汽车产业链变得越来越复杂了，需要更专业的分工，专业的集成制造商就有可能出现。现在的一级供应商或者传统车企，如果能抓住机会，及时转型，说不定会成为汽车产业中的造车富士康。


    第三，未来的竞争和创业机会将集中在构建充满想象力，设计感的人车交互上。科技创业公司可以专注在垂直细分领域里找切入的机会，持续强化长板，更容易成功。而整车制造企业需要巨额资金、强大的资源整合和供应链管理能力，其中任何一个环节出问题，都会造成失败。所以整车制造的玩家依然是大公司为主。


    # ——» 用户问答 ◀——


    有好几位用户都对电动汽车的安全性提出了担忧。


    前阵子广东省降雨量� україн 部分马路与街道被水淹了，还出现了公共设施漏电，电倒路人甚至致死的新…像在南方城市遇到这些恶劣天气，电动汽车以及配套的设施，如充电桩，会不会有漏电的风险呢？


    我的回答是：


    首先说具体问题，充电桩是有国家标准的，国家标准对充电桩的防水、防漏电性要求都非常严格，除非是不符合国标的粗制滥造，不然下雨，甚至地面有较浅的积水都不会造成充电桩漏电，而且如果发生漏电，充电桩应该有保护功能，不能启动给电动汽车充电。


    当然，小心起见，如果积水非常深，把充电桩几乎淹没了，那你不要靠近就是了。


    当然，充电桩也有技术进步，比如我们投资的 WiTricity，他们用磁共振技术做…


    2018年5月底，宝马公司推出的宝马5系混合动力车就配备了 WiTricity 提供的无线充电功能，今后越来越多的车都会带有无线充电功能，不光更便捷，而且更安全。


    再说点儿感慨，这两天看了部纪录片，介绍的是100多年前汽车产业刚刚兴起的情况，当时其实汽车非常不被看好。


    +   第一是速度慢，当时有个人想从纽约驾车横跨美国大陆，另一个人骑自行车晚出发10天，结果没过多少天就超过这辆汽车了，因为汽车实在太慢；

    第二是故障多，当时的舆论说开车不光要有钱买车，还有要有钱赔人家，因为刹车坏了，停车时会撞坏邻居的篱笆，在路上会撞坏别人的马车，这些都是常有的事情；

    第三是条件不支持，因为美国大部分的路都是只适合骑马和马车的颠簸的土路，从纽约到旧金山横跨美国的企图失败后，有人试图反过来，从旧金山开车到纽约，结果只开出去500多英里就陷在沙漠里出不来了，更别说当时还没有交通标志，因为骑马都是在附近活动，不需要交通标志，当时也没有加油站这些基础设施。


    到了1900年，美国一共有8000辆汽车，但是当时有1800万匹马，信息传递都靠驿站，当时驿站的邮递员比全国的医生都多，所以没有人会相信这么大、这么完美的产业链会被新兴的麻烦不断的机械怪物所击倒。


    当然，结果今天我们都知道了。


    所以，其实我们要警惕自己心理上的一个陷阱，就是已知结果的时候，我们总以为我们知道原因。


    我原来介绍过一本书，叫《Everything Is Obvious, Once You Know The Answer》，它的中文名字叫“一旦知道结果，一切显而易见”。不过这本书的中文译本只翻译了半句话，它的书名叫《一切显而易见》，建议你找来好好读一读。


    所以，对未来的趋势的预测，你要小心，既不要以为一切都是显而易见的，也不要以为趋势还没有来。


    随着科技的发展，现有的三元锂电池和磷酸铁锂电池技术可能会有新的突破，但换个角度思考，氢燃料电池就不会在发展中解决我说得那几个问题而成为新能源汽车的主流吗？一直以来对现阶段的纯电动车解决方案都持怀疑态度，请王老师解惑。


    我的回答是：其实，技术对产业趋势确实有很大的塑造作用，但不是绝对的，当一个技术对产业推动到一定程度，产业参与者基本都采用这个技术，而不是它的竞争性技术的时候，它的竞争性技术再好，成为趋势的机会也会微乎其微。


    当初汽车产业发展初期，汽油机并不是唯一的技术，当时更被看好的是蒸汽机，因为火车就是用的蒸汽机，把它小型化就是汽车了嘛，而且驿站到处都是，蒸汽机需要加水，在驿站里加就是了，很方便。


    另外，当时也有人想搞电动车，电动机机理简单，当时各大城市都在布设电网，有电的地方就用电动车就好了。其实一直到二三十年前，中国很多城市都还有拖着两条梭子的电动车。当然今天还有，但估计那都变成旅游景点了。


