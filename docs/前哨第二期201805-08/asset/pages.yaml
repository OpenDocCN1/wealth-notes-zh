    中国的制造业要抓住窗口时间，迅速提升每个环节的信息化、智能化、自动化的水平，为迎接未来在创意和制造层面上更激烈 的竞争做好准备，以支撑全球科技创新生 态发展的目标，中国制造依然任重道远。


