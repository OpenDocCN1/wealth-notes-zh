  md: '# 223 | 智慧农业：人类食品安全唯一的選擇


    223 | 智慧农业：人类食品安全安。 ↓


    # —— ◇ 内容看点 ◇ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 美国农业发达的根源是什么？

    2. 智慧农业未来的发展方向是怎样的？

    3. 农业数据能带来哪些商业价值？


    这个模块我们要讲的是智慧农业。


    在我们2018年5月结束的美国东南部创新投资考察活动中，我们有幸访问了杜克大学的终身讲席教授、美国国家科学院院士董欣年女士。


    董教授说：


    > 有农业的发展，才有人类社会的发展。

    现在世界上已经有75亿人口了，而中国就有13.8亿，未来35年内，世界上还 Scientifically会增加23亿人，但是另一方面，世界范围内，可耕种的土地面积却在逐年下降。


    可以说，要养活近百亿的人口，还要兼顾食品安全等问题，压力是巨大的，所以，通过科技手段发展环境友好的农业新技术是唯一选择。


    # 一、科技是农业发展的关键


    董教授还为我们介绍了一项成果，就是成功为水稻安上一种“免疫系统开关”。


    那么这个“开关”到底是什么呢？


    其实，利用基因技术来提高水稻的抵抗力很早就出现了，但是，现有的两种做法都不理想：


    一种方法是一次引进一个专一的抗病基因，但是获得的抗性专一，也就是只能针对一种疾病。


    另一种，是引进广谱抗病基因，也就是能抵抗多种病，但在没有病害的时候，产量会很低，你可以这么理解，在没有敌人的时候，大部分人都拿着枪去巡逻，就就没有人搞生产了。


    而董教授团队的成果，就是让水稻拥有一个“免疫系统开关”，当有病原体入侵的时候，免疫功能才启动。这样就相当于没战事的时候士兵们专心生产，但来了敌人马上就能战斗。


    这让我想起了老歌《南泥湾》，“又战斗来又生产，三五九旅是模范”。


    这样既增强了水稻同时对抗多种病原体的能力，也不影响作物的产量，减少农药的使用量，而且，这个技术还有望被应用到其它作物中。


    董教授是植物防御机制研究领域的大牛，2017年5月，她的团队在《自然》杂志上连续发表了关于这一成果的两篇论文。


    我们很期待，希望能够尽快看到他们的研究成果在实际应用中的效果。


    # 二、农业的巨大影响


    其实从董欣年教授的研究中，我们就可以看出，如今农业发展的关键推动力就是科技，而且除了基因技术外，大数据、人工智能这些前沿科技，都在发挥巨大的作用。


    比如在如今的中美贸易摩擦中，美国就试图遏制中国高科技企业的发展，而作为反击手段，中国要对美国进口的大豆、玉米和牛肉这些农畜产品征收高额的惩罚性关税，于是，农畜产品就成为了贸易战的重要一部分。


    那么中国为什么选择农畜产品下手呢？是大多数人认为的，美国的农业州有很多选民，中国要打击川普的票仓吗？


    其实不光如此，我们来看一下数据：


    美国是全球最大的农产品出口国，但中国只占美国农产品在全球出口份额中的两成，也只是它的第二大海外市场。加拿大才是美国农产品的第一大进口国，每年都要从美国进口大量的各种蔬菜水果。而排名第三的是墨西哥，每年从美国进口大量的大豆、猪肉和乳制品。


    可是，美国每年生产出来的大豆，有超过6成会卖到中国，这个数量就很大了。中国提高大豆进口门槛，美国一时间还真找不到替代的市场。


    显然，美国当然希望排第二的中国能进口更多的农产品，而中国对美国农业下手，增加美国农产品出口到中国的成本。大目标还是对美国的经济造成实质的威胁，影响川普的票仓只是副产品。


    # 三、美国农业发达的根源


    那么美国为什么能成为全球最大的农产品出口国呢？


    这就引出了我们这个模块要讲的“智慧农业”这个主题了，因为美国农业的领先，就在于此。而且未来农业的发展方向，就是是传统农业生产“智慧”。


    而所谓“智慧农业”，就是把人工智能、物联网、现代生物技术和种质技术等等在农业的各个环节综合应用，最终实现农业生产的数据化和智能化，提高产能和效率。


    # 1. 美国农业发展现状


    目前，美国加州是农业产出价值最高地区，那儿生产了全美超过9成的蔬菜、水果和坚果。


    可是要知道，就在1870年之前，加州还是一个充满了沼泽地，无法大面积耕种的地方。当时，美国有30%的人口从事农业生产，而今全美农业人口只占人口的不到2%。但美国农业不但很好地支撑起了自己3亿多人的市场，而且满足了众多国家的农产品需求，每年农产品出口总量，已经占到了美国农业总产值的20%。


    那究竟是什么因素推动了美国农业的高效发展呢？


    我把原因归结于两次主要的科技变革：


    # 第一次技术变革，是机械化的大规模发展。


    1926年，一个美国农民的劳动可以养活10个人。当时现代拖拉机正在逐渐大规模普及。在30多年后，也就是在1959年，美国96%的棉花已经可以做到由机械完成收割了。那时候一个农民就已经可以养活76个人了，效率提高了7倍多。


    # 第二次技术变革，是农业生物技术的应用。


    1994年，美国首先推出能够抵抗害虫侵袭的转基因棉花，这让杀虫剂的使用量减少了95%。后来随着转基因技术的发展，美国的玉米大豆产达到前所未有的高度，与引转基因技术以前相比，美国玉米的产量增加了37%，大豆增产超过20%。就以2017年为例，全球大约35%的大豆产自美国。


    # 2. 关于转基因技术


    提到转基因技术，我在这儿必须要说明一下：


    尽管转基因作物引起了很多社会争议，但是直到目前为止，都没有公开发表的权威学术论文能证明，食用转基因食物会对人体健康产生有害影响。


    如果用主流科学界的严谨表达就是，被批准上市的转基因食品不比传统食品更不安 全，说白了就是，转基因食品的安全性，与传统食品是没有区别的。


    现在，美国超过90%的玉米都是采用转基因技术的。而且早在1995年，美国的转基因玉米和大豆就获得了FDA的认证，1996年获得美国农业部批准。


    正是经历了这两次科技革命以后，现在的一个美国农民，已经有能力养活165个人了，这个数字大概是中国10几倍。


    从这点你就能知道，美国从农业大国到经济科技强国的转型过程中，农业不但没有退出国家发展的舞台，反而是紧跟着技术变革的步伐，不断寻找优化升级的可能性，让美国的农业如此发达。


    这也是我们讲的没有传统产业、只有传统企业的证据。中国的农业科技同样大有可为。'
