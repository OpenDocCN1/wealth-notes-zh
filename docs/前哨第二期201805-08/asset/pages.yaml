    我看到的调查报告显示，在德国，一辆特斯拉 Model S 电动汽车在使用过程中，制造的二氧化碳，比一辆宝马3系柴油汽车少不了多少。新加坡曾经发生过一起电动车不环保而被罚款的事情。电动车电消耗标准按每瓦时0.5克二氧化碳计算。虽然电动车二氧化碳排放为零，但按特斯拉Model
    S的耗电量计算，它的二氧化碳排放量合每公里222克，属于严重超标。电动汽车在行驶过程中二氧化碳排放为零，有害物质排放也是零，但它会造成间接排放，比如在制造过程和消耗电力时都会产生二氧化碳。如果这样的话，以煤炭为来源的电能，其碳排放量超过汽油，这样不是南辕北辙了吗？王老师怎么看这个间接排放的问题。


    我的回答是：


    # 什么是间接排放呢？


    其实指的是主要是用电，而电的生产很多时候产生了碳排放，主要指的是火电，德国的调查是基于德国现有的能源结构，也就是现有的德国的电力，1度电里有百分之多少是火电产生的，也就是有排放的那部分，再乘以电动汽车的能耗，就变成了电动车的排放。


    但问题是：


    +   第一，如果我是用自家的太阳能板给自己家的电动车供电，理论上就仍然是零排放了；


    +   第二，所谓间接排放的核心是你本国的能源结构。新加坡现有的能源结构整体不够环保，所以就有限制使用电动车，按这个逻辑，其实更应该限制使用一切耗电量大的设施，尤其是数据中心耗电量最大，那你也别搞了，大家都不用电，环保固然环保，社会就别进步了，这种为了所谓环保而限制用电的政策无疑是倒行逆施；


    +   第三，电动车未来的效率也会越来越高，但按所谓的排放水平要求今天的电动车的耗电水平，无疑是要求一个孩子一生下来就能和成人比赛。


    我们老讲要认清趋势，要帮助未来趋势中的技术成长，但现实中倒行逆施的例子还真是不少。


