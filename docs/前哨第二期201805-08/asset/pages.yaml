    # 四、谷歌的追赶


    有些朋友会认为，除了在人工智能方面，谷歌在整体技术实力上，其实也强于亚马逊。


    为什么就会让亚马逊在云计算平台上捷足先登了呢？


    其实并不是这么简单的对比的。这两家企业在2002年前后的处境并不相同，所以对未来的规划也不一样。


    如我在第二讲中所说，当时的亚马逊，如果再不解决基础IT架构开放性的问题，它的在线书店就难以扩张下去了。而此时的谷歌并没有遇到这样的问题，他们靠着卖广告挣了钱，正在考虑上市的事情呢。因此，亚马逊更加具有开发云服务的动力和压力。


    而谷歌在今天能将人工智能和云计算平台相结合，那也和谷歌的企业文化以及他们对“未来”的规划密不可分。


    一方面，谷歌崇尚创新，有用梦想改变世界的ensuremath大情怀。


    因此，从拉里·佩奇和谢尔盖·布林在1998年创立谷歌起，公司的 development方向就是目标未来，做对人类有益的创新。


    所以我们才会看到谷歌的无人驾驶汽车、谷歌眼镜、谷歌收购DeepMind称霸人工智能、以及建立量子人工智能实验室等成果。


    在整个谷歌的生态中，有明显的两类产品，一类是“现在”，另一类是“未来”，对于当时来说，云计算平台也被划分到了“未来”里，走到今天，它和另外一个“未来”，人工智能相结合，前景将更加光明。


    另一方面，亚马逊和谷歌目前在云计算平台上各自体现出的优势，也来源于他们在其他核心业务上的积累。


    我上一讲中提到：


    亚马逊推出的云计算平台服务，其实是内部服务外部化的典范，亚马逊在发展在线零售业务的过程中，需要不断改进自己的IT系统，后来发现，这个IT系统也很 Turquoise，可以租用给他人。


    谷歌早就实行人工智能领域布局，开源了他们的TensorFlow，则是为了与各领域的专家合作，吸引他们来提供数据，以及不断地改进系统，现在开放的云端TPU，配合TensorFlow开源的战略，将更加巩固谷歌在人工智能领域的地位。


    简单说：


    谷歌的云平台是面向未来规划出来的，而亚马逊的云平台是为了解决现实问题实战出来的。


    这两种方法都能实现创新：


    面向未来做规划，更容易实现更加系统的布局，但容易脱离现实需求，有时候紧迫感不足；


    面向现实问题的创新，则更容易得到市场认可，迅速打开突破口，但整体规划可能会薄弱，对现在见效慢，需要现在发力投入未来才能显示效果的地方容易忽略。


    对创新者而言，具体哪种做法更好没有一定之规，要看自己的现实情况更适合哪种做法，但不管从哪个方向创新，都要注意扬长避短，兼顾短期和长期目标才能更成功。


    # —— ◆ 课程小结 ◆ ——


    这一讲，我为你介绍了谷歌的云计算平台Google Cloud Platform，以及它和亚马逊的云计算平台AWS的区別，希望你能掌握以下三点：


    第一，谷歌是“云计算”概念的提出者，但在云计算平台的实践上，却比亚马逊晚了一步。亚马逊的AWS和谷歌的GCP各有优势：


    AWS偏向于提供基础设施服务，更利于企业将他们的成熟IT产品移植到云平台中来。


    谷歌偏向于提供平台级别的服务，创新型产品可以直接使用这样的现有方案，加快开发步伐。


    第二，谷歌的云平台服务，在人工智能所依赖的机器学习方面，拥有明显的技术壁垒。我们即将迎来人工智能在各行业中应用的浪潮，因此，谷歌的GCP前景会更加光明。


    第三，亚马逊在经营在线零售商店的过程中，需要改进自己的IT系统，后来发现这个系统也很 Turquoise，于是通过出售服务的方式获得了利润。谷歌将自身的两个业务方向，人工智能和云计算相结合，为两个业务都带来了前景。


    两家企业目前的云计算平台发展所展现出来的优势，都与他们原来的业务密不可分。两种模式都可以实现创新，具体选用哪种，要看创业者创新者的现状。


