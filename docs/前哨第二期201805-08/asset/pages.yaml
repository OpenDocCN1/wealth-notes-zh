  md: '# 233 | 新能源汽车：为什么纯电动才是未来？


    233 | 新能源汽车：为什么纯.


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 为什么美国和德国对新能源汽车热情不高？

    2. 中国电动汽车产业的发展趋势是什么？

    3. 氢燃料电池汽车为什么现阶段不是趋势？


    我们这一个模块要讲的是新能源汽车。


    # 一、中国在全球市场的重要性


    对于新能源汽车，相信你也已经很熟悉了，毕竟咱們中国政府对新能源汽车产业的扶植力度在全球来说是最强的，也因此诞生了一大批新造车团队，比如蔚来、小鹏、威马等等，而且连老外也来中国创业了，那就是拜腾，他们不仅在中国拿到了融资，还得到了南京市政府的支持。另外一方面，2018年6月6号，特斯拉也正式宣布要在上海建立第一个海外工厂，传统的几个德国和日本车企也纷纷选择和中国车企合作。


    现在不少人还在讨论车企“骗补”的问题，这其实是把目光都聚焦在“车”上面了，要知道，一辆车的背后，是庞大的产业链，比如宁德时代在2017年全球动力电池的销量排名第一，已经是动力电池领域的“独角兽”企业。实际上，中国的电动汽车，无论在政策、市场，还是在技术上，都走在了世界前列。


    根据国际能源署 IEA 的数据显示，2017年全球道路上的电动汽车数量达到了创纪录的310万辆，相比2016年增长了54%。其中中国市场占据了全球40%的份额。从这个数据你就可以看到中国在全球电动汽车市场的重要性。


    # 二、纯电动主导新能源汽车


    这里我得多说一句：


    其实从全球的角度讲，电动车只是新能源汽车的一部分，新能源汽车还包括氢燃料汽车，因为氢气燃烧生成水；还有生物燃料汽车，就是用海藻等微生物生产出可以替代汽油的燃料，其优势是可再生，而且不用修改现有的汽车结构。


    不过，从过去这些年的发展结果看，电动车已经成了新能源汽车的主导，其它的新能源汽车形式很难得到普遍应用了。


    另外，我们常见的电动车，实际上包括纯电动汽车和混合动力汽车，所谓混合动力，就是传统内燃机和电机两套动力系统协同工作，而且混合动力还可以分为 Hybrid 和
    Plug in Hybrid，Hybrid 就是靠刹车给电池充电，电池的目的是提升燃油效率；而 Plug in Hybrid 则是可以靠外表电源给电池充电，电池能源成为燃油能源的补充，Plug
    in 是插头的意思。


    因为有两套系统，所以混合动力汽车的动力结构就比较复杂，而且成本也比较高，但因为可以继续使用传统燃油汽车的加油站等系统，所以各大车厂一开始普遍上的都是混合动力汽车。但现在纯电动汽车的技术越来越成熟，传统汽车巨头也已经重点布局纯电动汽车了。


    目前来看，新能源车的发展路线已经清晰化了，电动车就是未来的主导，其它能源形式不再是趋势，混合动力只是过渡阶段，纯电动才是未来。'
