    # 划重点


    1."创新上行"模式：当产生小创意以后，充分利用各种众筹和孵化平台，在创业的每个阶段，都找到需要的长板进行对接，从而最终实现产品研发和商业化。2."最小可用品"原则：先放抗能满足最基本功能的产品，不断接受用户反馈，快速迭代，直到做出真正符合需求的好产品为止。3.计算能力、追踪技术、数据传输速度是影响
    AR 眼镜应用的主要因素，但在5G时代，技术问题将得到解决，AR 技术将最早实现商业化落地。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，我们下一讲见。


