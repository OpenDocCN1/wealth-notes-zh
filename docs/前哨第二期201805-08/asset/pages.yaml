  md: '# 230 | 可再生能源：全球最大风机制造商-丹麦 Vestas


    230 | 可再生能源：全球最大。


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. Vestas 是如何成为全球最大风机制造商的？

    2. 为什么说重大危机背后，都蕴藏着大机会？

    3. 风能发电面临哪些挑战，如何应对？


    在上一讲，我们介绍了能大幅提高太阳能发电效率的以色列公司 SolarEdge。


    这一讲，我们要分析的，是当今全球最大的风力发电设备制造商和服务商，丹麦的 Vestas Wind System 公司，简称 Vestas。


    这家公司历史悠久，从1898年建立到2018年，正好是第120个年头。最早其实只是一个小小的铁匠铺，100多年的时间里起起伏伏，经历了多次危机和转型，最终才专注到风力发电设备领域，通过持续的科技创新，才有了今天的行业地位。


    那么，Vestas 是怎么一步步发展到今天这个样子的呢？百年间的危机与转型，又是如何处理的呢？通过这一讲的分析，你不仅能对风力发电设备有深度的了解，也能获得关于创新理念的再次认识。


    # 一、危机中的机会


    在1898年，Vestas 的创始人 Hand Smith Hansen 在丹麦的一个海滨小镇上开了一家铁匠铺，在之后五十年里，一直就是做简单的铁匠日用品和门框生意。


    但是，第二次世界大战爆发后，丹麦的钢铁产能开始主要用于战争，国内供应量开始大幅减少，Vestas 的生意遇到了巨大的打击。在战争结束后，Vestas 转型生产家用电器和农用机具。


    到了上世纪70年代，全球对于卡车的液压起重机需求旺盛，Vestas 决定在这个领域投入研发，他们聘请了一个工程师，叫 Birger Madsen，专门研发和改进液压起重机。这位工程师比较喜欢尝试新事物，所以顺便还研究了风力发电技术。


    但是没想到的是，1970年代石油危机爆发，运输行业遭受重挫，卡车销量大幅下降，连带着液压起重机的业务也大幅萎缩。


    Vestas 的经营又陷入困境，我们都知道这个道理，就是危机当中往往也蕴藏着大机会。


    当时，公司执掌人是 Peder Hansen，也就是创始人 Hand Smith 的儿子，从石油危机的困境里，他就看到了传统能源的不可再生的特性，所以就意识到可再生能源未来的巨大前黄。再加上
    Birger Madsen 以前的研究成果，所以 Peder 决定尝试涉足风力发电行业。


    # 二、进入风力发电产业


    尽管 Peder 找到了新的方向，但落到实际操作上，业务开展开就不是一帆顺了。


    他们遇到的第一个技术难关就是先确定风机的形状。一开始，Birger Madsen 设计的是名叫 Darrieus 的涡轮模型，它长得有点儿像打鸡蛋，用来收集风能。


    但是在经历了18个月的试验之后，他们发现这种结构的稳定性和经济性都不太理想，无法稳定输出理想的风能。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_75_0.png)


    正好在那段时间，有一对丹麦夫妇，Karl Erik Jørgensen（丹麦语）和 Henrik Stiesdal，他们也在研究风力发电机，他们用的是三扇叶的模型，也就是我们今天经常看到的风力发电机的样子。他们没有资金进行生产，所以就找到
    Vestas 合作。


    Vestas 在测试了他们的三扇叶发电机以后，觉得效果很不错，于是双方开始正式合作。


    这里多说一句：在综合考虑风能捕获量、风能转化率、风机承受能力以及成本后，三扇叶结构是综合性能最好的，所以现在我们看到的风力发电机多数都是这种结构。


    在1979年，Vestas 在丹麦安装了第一台商用风力发电机。但在当时，他们自己还不具备完整的制造能力，比如，使用风机叶片，还是委托其他供应商生产的。


    在1980年，他们已经开始陆续出售一些风力发电机了，新业务开始有起色。没想到的是，当年秋天的一场风暴袭击了丹麦，有一台风机的叶片被大风吹断了，他们为此赔了一大笔钱。经过一年多的调查，他们发现原来是叶片的质量出了问题。所以
    Peder 大胆决定，开始自己生产和优化叶片设计。


    就是这个决定，让 Vestas 在设计叶片领域积累了丰富的经验，也为后续 Vestas 的行业地位奠定了基础，后面在分析技术优势的时候，我会详细解释。


    在1985年，Vestas 当时有一家美国客户叫 Zond，他们一口气订购了1200台风机，这在当时可是一笔大订单。那个时候，美国为风能行业提供了税费优惠政策，吸引了不少投资者拓展风能业务，其中就包括
    Zond。但万万没想到的是，这笔大订单居然差点让 Vestas 破产。


    这是怎么回事儿呢？


    原来是 Vestas 在完成了订单以后，委托船运公司将风机送到美国，但风机还在海上的时候，这家船运公司居然破产了。结果等到了码头之后，这批风机被扣押了很长一段时间，才被允许提货。


    Zond 就认为，虽然不是你 Vestas 的原因，但你确实违背了合同，错过了最后交货期，所以就拒绝收货。要知道，Vestas 为生产这批风机，已经花了大笔资金，现在合同款项收不回来，直接就到了破产的边缘。


    为了生存，Peder 决定出售其他资产，削减其它业务，然后把所有注意都集中到风能产业。而 Peder 之所以还是选择风能这个领域，实际上跟丹麦本土的国情是分不开的。


    我们刚才说了，在上世纪70年代的时候，出现了石油危机，在那之前，丹麦90%以上的能源都是依赖进口石油。


    为了避免这种危机的再次发生，丹麦政府除了开发自己的化石能源以外，也开始发展其他能源，只不过他们一开始选的是核能，而不是风能。但发展核能却遭到了国民的反对，因为谁也不愿意把核电站建在自己家的附近，结果就是10多年都没什么进展。


    那没有办法，所以丹麦政府在1985年，决定停止发展核能，转为支持风能的发展，而且设立了目标，要在接下来的5年里完成10万千瓦的总装机容量。


    这对于 Vestas 来说，可是一个重大利好。


    所以，在综合分析了公司产品、国家政策、全球市场需求，以及可再生能源的前景以后，Vestas 明确了业务方向。在1986年之后的几十年里，不断积累技术优势，发展成为了全球风电行业的巨头。


    # 三、持续创新积累技术优势


    下面，我们来详细看下，他们是如何从各方面入手，利用技术来提高风能发电效率的。


    作为风能设备制造领域的行业老大，可以说，Vestas 除了有超强的制造能力，关键还是在于，持续的技术创新打造的坚硬壁垒。


    # 第一个，对于风力发电设备来说，Vestas'
  merge: -1
  img_proc: true
- pgno: 76
  md: '第一个，对于风力发电设备来说，Vestas 在叶片优化设计上的功力极深，所以它的风能捕获量和风能转换率都很 高，结果就是发电效率超出行业内的其它竞争对手。


    Vestas 对风机的叶片一直在持续优化，他们主要从两个方面入手：


    +   一是风机叶片与风之间的角度，因为这个角度决定了风机的最大功率；

    二是叶片的长度，因为长度决定了风机能利用风能的最低范围。


    为了精确控制叶片转动，Vestas 采用了名为 OptiTip 的技术，就是在风机的每一个叶片上面都安装了液压角度控制器。利用这些控制器，随着风速、风向的不断变化，风机自身就能主动连续调节叶片与风的角度，最大化地利用风能，产生稳定的转动力，提升系统的整体发电效率。


    当时的风力发电还有一个问题，就是风太小的时候，就没电可发了，大概就是3级风以下。为了克服这个缺陷，Vestas 延长了风机叶片的长度，这样就能更大范围地捕获风能。但是，延长叶片以后，就带来了增加重量的问题，所以
    Vestas 从20世纪80年代，就率先采用了玻璃纤维材料制作风机的组件，它的比强度是钢的2-3倍。


    所谓比强度，就是强度和重量之比，那就意味着，玻璃纤维不但强度高，而且重量更轻。


    就这样，Vestas 就通过增加叶片长度，并利用玻璃纤维这种当时的新材料，以及对每一个叶片的精准控制，让风机不在低风速下也可以运行，还能最大化利用风能。


    # 第二个，是 Vestas 一直在控制成本方面，走在行业的前面，这让他们的产品也更加有竞争力。


    比如在2017年，Vestas 就采用 3D 打印技术，制作出了风机避雷系统中安装在叶片叶尖的接闪器。


    所谓接闪器，就是专门用来接收直接雷击的金属物体，简单地说，就是主动引雷到自己这里来，并通过导线将电流引入大地，达到保护其它部件的目的，跟平时我们屋顶避雷针的原理是一样的。


    那为什么要用 3D 打印呢？


    其实 3D 打印的好处，就是能降低小批量、复杂元器件的制造成本，如果用传统工艺，复杂元器件的模具开发就是一笔不小的费用，如果只是小批量制造会很浪费。


    但需要说明的是，Vestas 的 3D 打印还在实验阶段，到2018年6月还没有投入使用。


    主要原因是：


    +   首先，3D 打印技术所需的金属基复合材料的价格，最近几年才降到可接受的范围，以前主要在航空航天领域使用；

    其次，这项技术本身在风力发电行业的应 用也才开始，其生产出的产品的性能、价格、适用性等，都需要时间进行实践验证。


    虽然还没批量使用，但是我们能感受到，Vestas 真是在每一个小细节上都在节 约成本，这种节约不是偷工减料，而是在不降低性能的前提下利用新的科技手段达成更高的效率。


    # 第三个，是 Vestas 对大数据利用也很充分。


    对于风力发电行业而言，风机的安装选址和配置，是个重大的挑战。位置没选好，发电量少不说，还会带来设备的维护难、机器寿命短等一系列问题。可以说，风机位置的选取直接关系着客户的投资回报率和企业营收。


    早在2011年，Vestas 就和 IBM 一起联合开发了应用于风电开发的大数据解决方案。那时候，Vestas 的4万多台风机每天都在记录信息，再加上全球3万多个气象站的记录，Vestas
    的风能数据库里面，已经储存了从地面到90米空中的，包括气温、气压、湿度、降水、风向和风速在内的100多种信息。


    他们还进一步结合气象报告、潮汐相位、地理空间与传感器数据、卫星图像、森林砍伐地图，通过建立模型，为客户快速地找出安装风机和整个风电厂最佳的地点。


    另外，风机通常都要服役数十年，因此客户要求在安装之前了解项目的投资回报率。


    通过上面所说的数据和模型，Vestas 可以迅速应对复杂的商业投资进行确定性分析，而对于已经在运行的风机，还能分析各个叶片对气候变化的反应，为客户建议最佳的维护时间。


    正是由于对大数据的合理使用，让 Vestas 已经不仅仅是一个风能设备制造商，而是一个为客户提供了一整套服务标准的服务商。


    # 四、Vestas 面临的挑战和应对措施


    但是，Vestas 只专注于风能业务发展的思路，也慢慢显示出了弊端。


    为什么这么说呢？


    # 一方面，还是我们说过的电力消纳问题。


    所谓消纳，就是发出来的电接入电网，输送出去并使用。


    风电的特点，是需要借助规模效应，才能体现出经济优势，所以，目前大部分的风电集中在大型的风电厂，那么问题就来了，要把发出的电，顺利输送给其它地区的用户，就..


    # 另一方面，太阳能的崛起正在蚕食风电的市场。


    近年来，太阳能的成本持续降低，而且用户对太阳能的兴趣也与日俱增。因为它受环境的影响小，风能发电至少得有不错的风量吧，而阳光可是哪都有的。而且太阳能安装也更灵活，家庭还可以安装小型太阳能设备。


    面对这些挑战，Vestas 一方面继续提升发电效率，降低发电成本；另一方面，他们也在寻求多能互补和更好的储能方案。


    在2017年10月，Vestas 宣布与澳大利亚风能建设和管理公司 Windlab 合作，建设了公用事业级风光储综合利用并网项目。简单地说，它包括了风力发电机组、太阳能发电机组和储能设备。这个项目预计在2018年底建成投产，到时候产生的电量，将能满足相当于3万多户家庭的用电需求。


