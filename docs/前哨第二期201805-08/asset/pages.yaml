  md: '# 复习手册 | 高科技与社会


    王煜全


    这是我们最后的“年度知识回顾”，帮你复习和梳理全年的关键知识点。


    > ——► 高科技与社会 ◄——


    第三个大模块的主题是“高科技与社会”，我们分别讲解了11个值得你关注的热门领域。


    我们专门来探讨科技对社会带来的转变，全面扫描科技在社会演变中所发挥的积极作用。希望每个人都能找到属于自己的机会。


    # 1) 社群经济


    1.社群经济的崛起，既是因为互联网2.0带来了大规模互动的能力，也是因为我们人性当中相互联系的需要，而社群经济的商业价值则是现在我们处于一个过剩的时代，快速准确地发现我们喜爱的产品和内容，对每个人来说都很重要。而社群是一个天然的过滤器，人以群分，朋友转发的東西自然更容易贴近你的需求。


    我在2005年的時候就和中国移动一起研究过这个现象，我们当时称它为“好友过滤”。现在有大量的大中小型的社群，既可以是相对去中心的，格调一致的组织的组织，即好友过滤。也可以是有中心的粉丝社群，即网红过滤，自然会受到大家的喜爱。未来人间互动的爱好属性将大大超越地属性，因此社群将具有越来越的重要性。


    2.互联网时代，社交网络和社交媒体大量兴起，而且不断有新的平台或者形式出现。任何营销以及社群的维护与推广都不可忽视社交媒体的力量。与此同时，也要保持敏锐的科技感知力，勇于尝试新兴社交媒体平台或者工具。因此，社群运营者要迅速掌握市场上新兴的社交平台和社群形式，在自我迭代中不断成长。


    3.要想玩转社群经济，两手都要硬，既要能懂人性，迎合和引导粉丝的归属、交友、跟随等需求；又要能持续提供好的内容，以提供充分的粘性。好的策略应该是 一套组合拳：通过内容吸引消费者，通过运营留住消费者，通过营销满足消费者，真正做到所谓的只有你懂我。这两条看起来容易，做起来却很难，因此往往只有最专业的社群运营者才能成功。


    # 索引和关键概念词典：


    +   137： “新一代消费入口”

    138： “打造个人品牌”

    139： “社群运营的两种模式”

    140： “社群成功的秘诀”

    141： “社群经济的3个重点”


    # 2) 共享经济


    1.共享经济目前不论从技术层面还是从宏观环境的层面来看，都具备了爆发的可能。未来，人们会越来越习惯于拥有一项物品的使用权，而不是拥有一个物品。而共享经济得以实施离不开三大条件：产能过剩、共享平台、人人参与。


    2.共享经济得以实现，离不开技术的支持。就像Uber和滴滴出行成功的背后是手机地图与移动支付的普及，在未来，共享经济企业依然离不开技术的支持，甚至随着细分市场的出现，技术的门槛会越来越高。


    3.创业者要杀入共享经济，一定要建立自己的壁垒。要么建立足够高的技术壁垒，要么充分借助于资本的力量迅速积累用户形成规模优势。


    # 索引和关键概念词典：


    +   148： “共享经济的底层逻辑”

    149： “共享经济的3种组织形式”

    150： “自由软件”

    151： “共享经济将带来的3种社会变革”

    152： “模式创新的特点”


    # 3) 创意经济


    1.在创意经济发展中，科技扮演着重要的推动作用，甚至可以说，创意产业的大爆发就是在技术推动下实现的。然而，在创意井喷式爆发的时候，真正优质的内容也是凤毛麟角，只有把技术和优质的内容相结合，才有机会获得巨大的商业利益。


    2.产生一个好的创意并不难，难的是从形成创意到实际推出产品这段路，需要具备一个完整的创意生态链来支撑，所以光有创意远远不够，还要找到能够把创意实现的技术、平台和资源，才拥有落地的可能。当下的创意产业已经和各行各业进行了深度结合，进发出了巨大的潜力。


    3.在这个时代，技术降低了兑现创意价值的门槛，每个人都利用各种科技工具和现有的平台抓住社会发展的大趋势，无限放大自己的 人生价值。互联网的出现使得JK罗琳这样的一个平凡的单亲妈妈火遍大江南北，随着技术的进步，会有更多的JK罗琳借助技术的力量获得成功。


    # 索引和关键概念词典：


    +   153： “创意为王的时代”

    154： “兑现创意价值的门槛”

    155： “创意孵化器”

    156： “创意产业创业的3个教训”

