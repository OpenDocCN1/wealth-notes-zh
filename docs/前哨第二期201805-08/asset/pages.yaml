  md: '提高物件强度。


    Production System 则是实现高分辨率金属零部件批量生产的 3D 打印系统，可以大规模生产金属 3D 打印的零部件。它的打印速度比基于激光的金属
    3D 打印系统快100倍，你知道，打印速度慢，效率低是影响 3D 打印推广的重要因素。


    可见，这两个系统的结合将有能力改变未来整个工业设计流程。当工程师完成产品设计后，可以直接利用 Studio System 迅速打印出产品原型，并进行样件测试。在经过调整达到预期性能后，后面就可以使用
    Production System 进行大批量生产。


    这套系统最重要的意义是，把创意和制造集成在一起，创意落地和转化周期大大缩短。尤其是对于创业公司来说，让整个过程不再受制造环节的限制，这样创意的价值能够更加凸显出来。


    正因为工业中大量应用的器件都是由金属构成的，而通过金属 3D 打印将节省巨大的余料浪费，也为复杂零件的设计提供了更大的灵活性。


    目前，金属 3D 打印正在被逐渐应用于工业制造领域当中。其中最值得关注的两个领域分别是：航空领域以及汽车领域。


    比如，空客 A380 客机上，就装载着瑞士利勃海尔航空 3D 打印的一个阀体，成功实现试飞，这是首个 3D 打印的飞行元件。而对于汽车行业来说，金属 3D
    打印对传统汽车制造流程也带来巨大冲击。过去传统的汽车制造，都是使用大量标准化零部件装配而成。而金属 3D 打印技术能快速优化汽车内部结构。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_126_0.png)


    这款车是法国汽车制造商标致雪铁龙公司与 3D 打印技术供应商 Divergent 3D 合作制造的超跑。这部跑车的百公里加速为 2.5秒。车身是由铝合金、钛合金
    3D 打印制造而成，重量仅相当于普通成年人的体重的4倍。


    # 三、巨大的影响


    需要说明的是，并不是说整个车辆都是用 3D 打印的，而是采用 3D 打印制造铝合金的“节点”结构，然后把碳纤维、钛合金材料的组件连接起来。


    未来，金属 3D 打印将在工业研发和制造环节中发挥越来越重要的作用，尤其是制造。


    我们这个模块的第一讲就说过，现在制造业的关键是对创新产品的支持，而 3D 打印能够极大地降低制造的难度，尤其是如果大量零部件都采用 3D 打印的话，对中国这样的产业集群的依赖将大大降低。


    我们都知道，惠普公司诞生于车库，是在车库里生产测试仪器仪表起家的，所以车库成了创业的代名词，不过后来的车库创业都是软件和互联网了，现在有了金属 3D 打印，有了智能的工业机器人，这一拨硬科技创业的浪潮，很有可能又会回到车库。


    这对中国的制造能力将是一个挑战。


    所以我们一直讲，中国制造虽然领先，但是一个窗口机会，未来的先进制造技术一旦能够充分支持创新的小企业，中国的制造能力将有被替代的危险。所以中国制造从现在就要和全球的创新作深度结合，而且要不断跟踪世界先进制造的趋势，提升自己服务全球创新的能力。


    # —— 课程小结 ——


    这一讲我跟你讲了金属 3D 打印 Desktop Metal 的团队，产品以及金属 3D 打印在工业领域的应用，希望你能掌握以下三点：


    第一，3D 打印的原理就是增材制造，这个概念和技术并不新鲜。这个技术优势在于能快速实现复杂性小规模样品的研发，但是受制于打印时间长，原材料种类少的限制，影响了大规模的推广应用。当能使用
    3D 打印直接制造金属元件后，会革命性地改变整个工业设计和制造流程。


    第二，Desktop Metal 的创业团队由成功的连续创业者和 MIT 教授组成，很好地验证了我强调过的“积木式创新”理论。这个团队开发了适合样件研发的
    Studio System，以及用于大规模生产的 Produccion System 桌面金属 3D 打印产品。它的意义在于，让创意落地和转化的周期大大缩短，让创意的价值更加重要。


    第三，金属 3D 打印目前主要应用在汽车和航空领域，设计制造某些零部件。随着打印技术的发展，价格逐渐降低，打印速度加快，可以预见的是，金属 3D 打印在工业领域应用范围会越来越广。


    另一方面，也需要意识到，3D 打印降低了制造门槛，当它普及后，就更没有必要只单方面强调制造能力的重要地位了。所以中国必须了解全球先进制造的科技发展，并积极行动起来，提升自己的科技水平，提升自己服务全球科技创新企业的能力。


    # —— 课后思考题 ——


    你对我提出的中国制造业的窗口机会是否认同？你认为中国制造业未来还会面临哪些挑战？


    欢迎在留言区分享你的观点。


    # 划重点


    +   1. 3D 打印的优势，在于能快速实现复杂性小规模样品的研发，而金属 3D 打印技术一旦普及，将彻底改变制造业。\n2. 现代制造业的关键是对创新产品的支持，而金属
    3D 打印会降低制造业门槛，当大量创新产品的部件可以用 3D 打印制造时，中国这样的产业集群的竞争力就会大幅下降。


