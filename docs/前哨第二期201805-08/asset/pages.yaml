    过去和电脑屏幕上的内容互动还需要通过键盘或者鼠标，但是尼葛洛庞蒂说，我们都有两只手，而且随时知道自己的手在哪里，用手而不是用键盘互动才是最方便的。后来有了触摸屏，尼葛洛庞蒂在30年之前的预言就成了现实。


    过去我们也只能用键盘输入，所以还要学输入法。那未来，语言输入，甚至眼球追踪输入，都会慢慢成熟起来。现在已经在逐步开始使用之中了。


