  md: '# 231 | 可再生能源：能否替代传统化石能源？


    231 | 可再生能源：能否替代...


    # ——内容看点——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 可再生能源能完全替代传统化石能源吗？

    2. 除了太阳能、风能，还有哪些新的机会呢？


    近些年来，可以说整个可再生能源产业都在迅猛发展。尤其是得益于传感器、大数据这些技术的成熟，让可再生能源的精细化管理在持续进步，能量密度低、能源分散、转化率低等缺陷正在被全面克服。


    不仅能源转化率越来越高，成本也在大幅下降，可以预见的未来，可再生能源占总发电量的比例还会继续提高。


    那么，在可再生能源领域的发电、消纳和能源应用方面，除了主流的太阳能、风能以外，还会有哪些新的机会呢？你是否认为，可再生能源在不久的将来，会完全替代传统化石能源呢？

    下面我们来详细分析。


    # 一、太阳能光热技术


    我们先来了解一下太阳能发电技术方面的一个机会。


    现在一提太阳能发电，大家的第一反应就是太阳能电池板，是直接把太阳能转化为电能，但实际上，太阳能发电还有另一种形式，叫光热发电，也就是先把太阳能转化为热能，然后再把热能转化为电能。


    这种技术其实也有很广的发展空间，因为它天然就有能“储能”的条件，也就是把太阳能转化为热能后，可以缓慢地释放。


    实际上你可能不知道，现在的拉斯维加斯居民，在晚上用的就有光热太阳能提供的电力。在2015年的时候，内华达州落成了太阳能光热项目，叫 Crescent Dunes
    Solar Energy Project，它的储能能力，能满足当地10小时的用电需求，而且除了拉斯维加斯，这个项目还在为内华达州其它地区供电。


    那你肯定很想知道，光热发电到底是怎么回事儿呢？


    其实它的原理并不难，说白了，就是通过大面积的反光镜，把阳光聚焦在一个中心位置上，而这个位置的材料就会被加热到几百度的高温，然后跟火力发电很像，就是用高温烧水，水蒸汽带动涡轮转动，然后就发电了。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_78_0.png)


    根据国际可再生能源机构 The International Renewable Energy Agency，2018年1月公布的数据，光热发电在过去的7年里，装机容量增长超过200%，成本也已经下降超过30%，随着装机容量上升，规模经济会得到体现，经验也会得到积累，并且会促进更多的研发成果产生，它的价格将会进一步下降，在接下来的5到6年中，成本有望再下降60%以上。


    但是不得不说，就掌握的数据来看，直到2017年，全球的光热发电量占全部太阳能发电量的比例，还不到2%，它的商业化程度远远落后于光伏发电。


    # 二、电制氢储能技术


    经过前面几讲的学习，你应该也发现了，可再生能源里面，目前发展得比较快的是风能和太阳能，但这两种发电方式其实都受到自然环境的巨大影响，最规律的，是伴随着季节的发电量变化，如果想保持全年平稳地发电，就需要以几个月为尺度的大规模储能设备。


    你肯定还记得，我在第一讲开头分享的案例：

    2018年4月，美国加州的太阳能和风力发电厂被迫削减发电量，这个发电量，足以为空3000万家庭供电1小时。


    这就是典型的季节性问题，而且根据加州政府的计划，未来几年内，还会建设额外的太阳能发电设备，那到时候，这个问题还会越来越突出，大量的投入没有被真正利用起来。


    那有没有好的储能方式呢？


    答案是，有，而且可以实现大规模且长期的储能。


    这种方式，就是把额外发出的电，用来制造氢气，然后储存起来，也就是“电制氢储能”。而所谓电制氢，其实就是电解水，产生氢气和氧气，而氢气本身就是一种清洁燃料，它燃烧后只产生水，并且它的运输、储存可以部分利用现有的天然气设备。


    比如在德国北部，那里有很多的风力发电厂，也遇到了季节性问题，预计到2030年，位于德国最北部的石荷州，有望可以提供相当当地需求3倍的风电能源。这些多出来的能源，就需要输送出去，或者储存起来。


    德国可再生能源公司 GP Joule 就打算在石荷州建5套电制氢设备，他们计划将生产出来的氢供给当地的公共巴士，或者将氢并入到现有的天然气网络中，输送到其他地区。2017年7月，他们的第一台设备已经试运行成功。


    目前在德国，电制氢项目已经在蓬勃发展了，主要是将电网无法消纳的部分可再生能源，转换 Arrangement  ...


    # 三、信息技术的新商业模式


    介绍完可再生能源的发电和消纳领域的机会，我们来看下能源使用方面的机遇。


    随着可再生能源的发展，生产和储能单元的数量会不断增加，比如说屋顶光伏，电动汽车，还有特斯拉的能源墙 Powerwall 等，有时候，如果家里发的电用不完，就
    可以储存起来，或者卖给其他人。这使得我们个人不仅是单纯的能源使用者，也是能源生产者，电网的交易也会由单向变为双向。这非常像现在的互联网，将大众从单一的信息接收者，变为同时也是信息的发起者。


    另一方面，电网需要在每一时刻维持一个动态平衡，同一度电，或者同一容量的储能服务，在不同的时间和地点，它的价值都是不一样的。而个人交易主体的规模小而且分散，这就需要使用信息技术手段，来维持这个动态平衡。


    比如说区块链技术，作为一个去中心化的交易手段，将很有希望为未来能源互联网提供基础交易服务。


    在这个方向上，美国初创公司 TransActive Grid，在2016年推出了基于区块链技术的个人电力交易平台，用户可以非常方便地将多余的屋顶光伏电力，卖给周边的邻居使用，而不需要通过大型电力公司来完成交易，也无需跟每个用户签订繁琐的合同。


    目前，TransActive Grid 正在小范围内测试他们的产品，如果后续推广成功，居民之间的电力交易将更加灵活。


    # 四、可再生能源的局限


    上面我们讲了可再生能源在生产、消纳和应用这三个方面的机会。


    听了这几讲的可再生能源，你是否认为可再生能源未来会全面替代传统化石能源呢？


    其实，远远没有这么简单。


    一方面，前几讲我们讲过的，可再生能源的消纳环节是限制应用的重要因素，因此对于电网的匹配程度要求很高。如果电网配套不完善，就让项目匆匆上马，风险会非常大。


    在中国 的西北部地区，目前仍然有大量的风电和太阳能发电厂，由于遇到电网消纳的瓶颈，不得不降低现有 的发电量，这种现象，就是通常所说的“弃风”和“弃光”现象。'
