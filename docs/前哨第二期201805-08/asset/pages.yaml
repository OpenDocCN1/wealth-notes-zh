  md: '# 201 | 前哨大会复盘：积木式创新与世界公民


    201 | 前哨大会复盘：积木...


    # ——◈ 今日内容看点 ◈——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 为什么我们要实现范式转移？

