  md: '# 236 | 新能源汽车：产业格局与三大机会


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 新能源汽车产业中都有哪些新机会？

    2. 科技创业公司该如何把握机会？

    3. 石墨烯电池距离我们还有多远？


    这一讲，我们来分析一下新能源汽车的未来产业格局和新机会。


    先跟你分享一个跟电动汽车有关的专利技术：


    这是我们在2018年5月，去美国东南部进行创新投资考察活动的时候，考察的一个项目，叫做“新型电动汽车车载集成充电系统”，这是由马里兰大学电力电子实验室主任
    Alireza Khaligh 的团队研发的。


    这项专利技术，是通过优化组合现有的充电系统，将它们的重量降低了50%以上，体积减少了近40%，效率却高出了8%，可以说，如果这项技术未来能够实现产业化，肯定能对电动汽车产业的发展起到很好的推动作用。


    目前从全球来看，随着电动汽车的发展，除了新兴的初创公司以外，传统车企已经在有条不紊地展开布局，而各大科研机构也都想抓住这个发展机遇，寻求以创新科技的角度切入这个市场。


    那么下面，我就给你分析一下新能源汽车产业中都有哪些新机会。


    # 一、未来行业格局：总体设计者+集成制造商


    第一个新机会，我把它叫做汽车领域的“富士康”，也就是未来中国的电动汽车领域，很可能会出现专业的集成制造商。


    上一讲，我们分析比亚迪模式的时候，提到未来电动汽车的产业链会越来越像手机，也就是说，未来的电动汽车产业格局，会是总体设计者+集成制造商的模式，而中国很可能会出现电动汽车产业中的富士康。


    手机产业为何会出现手机公司+制造商的模式？


    其实，就是因为手机功能变复杂了，用户需求和技术支持变成了两个层次上的问题，因此在底层技术支持上选择专业化代工是效率最高、总体成本最低的选择。


    # 二、打造更加安全、更富乐趣的人车交互空间


    那么，第二个新机会，是回到车辆本身，也就是新能源汽车可以在人车交互场景中发挥应用，让出行更加安全，更有乐趣。


    # 三、新型电池技术：石墨烯电池


    这一讲要说的第三个机会，是新能源汽车最核心的电池技术。


    目前，市场上主流的锂电池，主要是传统钴酸锂电池，就算是特斯拉用的三元锂电池，其实也是含钴的。但你可能不知道，钴这个元素全球已探明的钴矿储量仅为700多万吨，而刚果(金)、澳大利亚和古巴'
