    246： “纳米技术革命”

    247： “企业上市的普遍规律”


    # 9) 智能制造


    1.中国制造加上大规模、复杂产品、开放性这三个定语，是世界第一而且是独一无二的。但没有必要在全球总是过于强调 “中国制造” 的能力，这样的做法，只会在全球树敌，对于优化自身产业布局也没有实质意义。中国制造业应该韬光养晦。

    且目前的关键问题不在于制造能力，而在于制造什么。制造只是产业链的一个环节，是用来支撑创新和产品落地的。只有用自己的制造优势去争取和更多的科技产品合作，这样才能进一步提升自己的科技含
    量。'
