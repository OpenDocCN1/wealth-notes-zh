  md: '# 复习手册｜高科技与生活


    王煜全


    这是我们最后的“年度知识回顾”，帮你复盘和梳理全年的关键知识点。


    # ——► 高科技与生活 ◄——


    第二个大模块的主题是“高科技与生活”，我们分别讲解了12个值得你关注的热门领域。


    从衣、食、住、行、教育、旅游、文化娱乐等产业带你体会科技带给生活的深刻变革。


    这个模块，我们专门讨论传统产业里的科技运用问题，是因为很多人说：

    我就是传统产业的，用不上科技。


    所以，我们用了一个模块的内容，告诉大家：

    没有传统产业，只有传统的企业，每个产业都被科技深刻影响着。


    科技是社会发展的重要推动力，而社会的演变反过来也影响着科技的发展和应用，两者相互促进又相互制约。


    # 1）衣（服装产业）


    +   1. 服装行业其实从來就是高科技产业，华达呢塑造了Burberry，尼龙纤维带动了丝袜狂潮，莱卡、涤纶等等材料的发明，也成就了一批服装的品牌。今天科技更是成了很好的时尚流行元素，所以服装行业的从业者必须了解新科技，对新科技保持敏感。


    +   2. 服装业的科技创新应该是全方位的：戈尔公司做的Gore-Tex面料、日本的Spiber和德国的AMSilk做的合成蜘蛛丝、Modern Meadow公司做的人造真皮；Zara公司和Adidas公司对供应链管理的提升、Stitch
    Fix公司的个性化私人定制；李维斯和谷歌合作把智能可穿戴放到牛仔服里；安德玛公司更是利用智能可穿戴搭建了用户健身社区等等。


    +   3. 优秀的服装企业既要善于运用科技，又要始终把用户感知和体验放在第一位，切忌为科技而科技。关键是要让科技为产品服务、为品牌服务、为更好的用户关系服务、也为企业的理念服务。


    # 索引和关键概念词典：


    +   066： “技术引发服装革命性潮流”

    067： “把理性数据转换成感性的用户感知”

    068： “关注其他领域中正在遇到的问题”

    069： “个性化、差异化需求与批量生产的矛盾”

    070： “服装业的全方位创新”


    # 2）食（食品、餐饮产业）


    +   1. 食品行业虽然经常被视为传统产业，但其实一直都是科技拉动的，未来食品产业的发展，也只能靠科技手段解决。21世纪，随着生活的改善，消费者越来越看重健康食品的理念，科技的重心正在从解决粮食短缺问题，扩大到解决我们如何吃得更好的问题。


    +   2. 食品行业正在经历一场由消费升级带来的大变革，这种转变背后的驱动不是传统的食品巨头企业的工业制造或者广告营销，而是基于科技，这恰恰是我们所说的由科技突破引起的不连续性，这是创业者进入的最好时机。


    +   3. 创业者一定要以市场需求为导向。消费者不懂技术，他们需要的是符合自己需求的，可以感知 的产品。创业者不能只想着要用技术去打动用户，而要更多考虑美味的口感、低廉的价格、健康的理念等等消费者更能接受的观念。科技企业的发展就像顺水行舟，大方向要正确，但细节上要不断调整以适应市场。


    +   4. 科技是创新企业建立竞争壁垒的基础。科技刚刚进入应用领域的时候往往是不完备的，科技企业要做的是，找到一个尚不完善的科技突破，从各个方面提升效率、降低成本，使得这项科技的功效被十倍百倍地发挥出来。


    # 索引和关键概念词典：


    +   071： “解决食品问题的3个途径和2个层面”

    072： “城市立体农场”

    073： “人造肉”

    074： “科技突破引起的不连续性”

    075： “食品产业的变革动力”

    创新地图： “食物的有效利用率”


    # 3）住（房地产）


    +   1. 建筑相关的科学其实也一直在进步，比如BIM、比如说无人机遥感等等，但是总体来说，现代建筑科学的水平，已经使得需要什么样的建筑都可以实现，都可以搭建出来，而且可以让你放心地居住。所以住的问题不再是提升科技本身的问题，而是利用建筑和其他一系列的科技，使得我们的居住更加舒适的问题。


    +   2. 住这一方面的问题最大，相应的机会也最多，尤其是我们觉得最痛点的地方可能才蕴含着真正巨大的商机，比如说都市出行很麻烦，搭车、停车各种问题，所以才会有Uber、滴滴等等这样新的业务模式出现，而且这些新的业务模式才
    会得到这么迅猛的发展，才做得到那么大。


    +   3. 超级城市化一定是趋势，因为它会造成人类智力的高度密集，会诞生大量的新创意、新思想，也会孕育大批的新公司、新的文化艺术品类。当然也会带来全新的问题，不过这些问题解决了以后，又催生了新的创意、新的机会。


    # 索引和关键概念词典：


    +   076： “超级城市”

    077： “联合办公”

    078： “提高空间利用效率”

    079： “超级城市的联结性”

    080： “认清趋势和认同趋势”

    创新地图： “智慧城市”


    # 4）行（交通产业）


    +   1. 技术不光是直接变成产品推动社会进步，同时它还会改变人们的观念，形成社会观念的进步，从而造成新的创业机会。随着电动车、自动驾驶等等技术的进步，和人们对共享出行、出行服务解决方案等等观念的接受，交通出行领域正在迎来一场前所未有的变革。


    +   2. 企业对社会进步有非常重大的推动作用。在交通出行领域，我们本周列举了特斯拉和Uber，其实后面还有滴滴，还有共享单车等等。它们是市场里的鲶鱼，正在改变整个产业的重心，使得这个产业从制造、销售汽车，转型到了强调服务、强调使用，从而也改变了社会的认知。


    +   3. 未来对交通出行影响最大的因素是自动驾驶，它将会带来整个出行领域的范式转移，所以未来的成功者将是那些勇敢适应新范式的人，他们必须要抛弃掉传统很多东西，勇敢地尝试新的业务模式。


    # 索引和关键概念词典：


    +   081： “围绕个人出行的新型生态系统”

    082： “特斯拉开源电动车技术的本质”

    083： “出行服务提供商”

    084： “直接与间接革命”

    085： “从制造业转型为服务业”


    # 5）未来教育


    +   1. 传统的应试教育已经无法满足现代社会快速发展对人才的需求了。我们需要培养面向未来的高素质人才，这就需要我们必须转变对教育的看法，教育绝不是批量化生产
    的“机器”，而是培养具有完整人格个体的“生态系统”。


    +   2. 面向未来的教育有四个目标：

    领导力（Leadership）；

    创新力（Innovation）；

    开阔的思想（Broad Thinking）；

    世界公民（Global Citizen）。


