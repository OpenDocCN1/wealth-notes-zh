  md: '# 205 | 下一代计算：量子计算的商业化


    205 | 下一代计算：量子计算. ↓


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. D-Wave 的商业模式是什么？

    2. 量子计算机的玩家有哪些？

    3. 为何量子计算领域更多被 IT 巨头主导？


    “量子计算”这个词是在近几年才火起来的，但是第一讲我说过，其实它的概念在30多年前რად 1981年，就被美国 Argonne 国家实验室的物理学家 Paul
    Benioff 提出来了，不过在后来的20几年里，这个概念还停留在物理学家的理论研究范畴。


    直到大约10年前，在学术界还在研究基本物理量子比特特性的时候，2007年一家名不见经传的加拿大公司突发发布了一台16个量子比特的量子计算机原型机，名为 Orion。


    这个突如其来的消息，立刻聚焦了人们对量子计算机的浓厚兴趣，并引发了各大公司争夺“量子霸权”的技术大较进，这家公司叫做 D-Wave Systems。


    这一讲，我就来给你谈谈这个公司和量子计算的商业化。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_14_0.png)


    # 一、D-Wave Systems 公司


    D-Wave 系统公司的几位创始人都来自加拿大的英属哥伦比亚大学 UBC (University of British Columbia)。


    +   公司前主席 Haig Farris 在大学里教授商学课程；

    现在的首席技术官 Geordie Rose，是在 UBC 获得的物理博士学位；

    首席科学家 Alex Zagoskin 是 UBC 的一个博士后。


    回到 D-Wave 公司，D-Wave 在设计上有些什么特点呢？


    量子计算机设计的一大困难，就是在操纵量子比特的时候，必须使用量子纠缠，而在这个过程中，不能受到任何外界因素的一点点干扰。


    因此，在设计的时候，都需要使用庞大复杂的机器用以隔绝外部环境，而且量子计算需要在原子级别进行操作，导致能够存在的量子比特有限。


    为了解决量子状态不稳定的问题，Rose 博士提出了针对量子退火算法的计算模型，称为“绝热量子计算”。


    先解释一下量子退火算法：


    > “退火”是金属加工过程的一个工艺，指的是把金属加热到一定温度，然后让其冷却，释放内部残余应力而让状态稳定。

    量子退火算法类似，就是把量子设置好初始位置和状态，这就相当于对量子编程。它们从初始位置和状态，转变成为稳定状态，这个过程就相当于退火过程，也就是计算的过程。


    因此 D-Wave 的系统也被称为“量子退火机 Quantum Annealer”，区别于通用型的量子计算机。关于通用和非通用问题，我会在下文为你解释。


    D-Wave 于2011年推出了128比特的 D-Wave One 系统，这是世界上第一个商品化的量子计算机，售价1000万美元，美国的军火巨头，造出了 F22
    的洛克希德·马丁率先采购了一台；


    2013年又推出了号称512量子比特的 D-Wave Two 系统，结果谷歌联合 NASA 和 USRA 建立了量子计算实验室，联合购买了它；


    2015年和2017年，D-Wave 相继推出了1000量子比特和2048个量子比特的 D-Wave 2X 和 D-Wave 2000Q，全都成功卖出。


    # 二、D-Wave 的商业秘诀


    你可能已经注意到了，D-Wave 既没有 IBM、谷歌那样雄厚的资本和团队，研发的量子计算机也远没有实用化，并且一直受到质疑。


    那么，D-Wave 是怎么靠着商业化赚钱的？并且客户都还是巨头呢？


    D-Wave 到目前也还是一家只有160多人的创业公司，它不像资金雄厚的大公司，它的策略就是，在成熟的量子计算机开发出来前，把当年的原型机出售，以获得资金进行进一步研发。


    # 三、通用还是非通用


    尽管 D-Wave 的量子计算机造成了轰动的影响，但从最开始，学术界就一直对 D-Wave 的量子计算机充满质疑，包括 John Martinis 在内的几位量子计算领域最知名的科学家，在2013年《科学》杂志发表的文章，认为
    D-Wave 尽管有部分量子计算的特征，但这部分特征并没有发现证据证明，能显著地提升运算速度。甚至还有人质疑 D-Wave 造的不是量子计算机。


    量子计算机的发展途径主要有两条：


    +   第一条途径是对应数字电路，目标设计基于逻辑量子比特，用于通用的量子计算机系统，这条系统在数学上可以被严格证明。然而，对应的通用量子计算机就必须能够纠错、容错，这也是困难所在，我在第一讲中说过。

    第二条途径类似模拟电路，它的信息表示本身就是连续而非离散的，允许有误差的，比如 D-Wave 模拟退火的量子计算，通过自然演化，而非精确控制进行计算。这个思路，它的设计本质上是非通用型的量子计算机。相比通用型，非通用的方案更有可能突破，实现商业化。'
