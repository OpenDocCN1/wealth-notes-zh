  md: '# 复习手册 | 高科技与风口


    王煜全


    这是我们最后的“年度知识回顾”，帮你复习和梳理全年的关键知识点。


    # —— 高科技与风口 ——


    我们第一个大模块的主题是“高科技与风口”，我们分别讲解了12个值得你关注的热门领域。


    # 1) 混合现实


    1.增强现实是把虚拟的东西放进现实环境里，混合现实是把现实的东西虚拟化，这样可以放进虚拟环境，也可以进行远程的虚拟处理，这两者的区别大家要花点时间去体会，没有搞清楚，就不容易理解为什么混合现实是一个会改变社会的巨大机会。


    2.虚拟现实和增强现实最大的市场机会是游戏，因而需要很高的硬件配置和带宽，现在都还不完全具备，因此离市场爆发还有一段距离；而混合现实最大的市场是toB，也就是行业应用市场，比如培训、远程指导、远程协同，因此不需要这么高的硬件条件，但关键是具有具体应用的支持。


    3.混合现实市场现在还没有爆发，因此市场上还没有这类应用，但爆发速度会超过虚拟现实和增强现实，因为：一是产业链基本完备，就像我们在之前的节目里介绍的，混合现实和虚拟现实、增强现实产业链的复合程度很高，不需要单独的产业链；二是混合现实的需求有强大的市场基础，人类进化的历程就是协作加深的过程，混合现实将会极大地加强人类的协作深度。


    4.我们前瞻不是事后的新闻报道，等到潮流来了再来和你，而 Nicholson不从.按照市场的本质特征和趋势来事先判断什么是下一个潮流，这样你才能真正把握住机会。因为任何被炒得沸沸扬扬的所谓机会，对普通人来说都不再是机会了。只有先人一步，普通人才能真正把握住机会。至于如何把握，我们会在全年的内容里反复探讨。


    # 索引和关键概念词典：


    +   001： “复杂协同能力”

    002： “产业研发和产业化”

    003： “产业链机会”

    004： “混合现实的3个应用”

    005： “技术研发期”


    # 2) 人工智能


    1.当人人都在讨论一个所谓的创业机会的时候，这个机会基本已经过去了，人工智能就是这样一个机会。人工智能之所以热，是因为这个技术已经成熟了，正在被运用到越来越多的领域。但就像我们一直强调的，从研发到产品推出有一段时间，其实现当你看到大量应用的时候，说明很多把握住了机会的公司已经提前做了布局，研发的产品已经成功上市了。当然，你这时候才跳进去创业，自然已经晚了。反之，我们介绍的混合现实，很多朋友问，你说是机会，怎么没看到市面上有产品啊，当然了，技术已经成熟、产品还没出来，这才是创业最好的时机嘛。


    2.科技革命对一个产业形成影响的规律是，先有一个革命，但革命刚出现的时候不成熟，需要不断地打磨，才会把革命的优势淋漓尽致地发挥出来。这一轮人工智能的革命来自Geoffrey
    Hinton，而大名鼎鼎的DeepMind，其实只不过是通过优化把人工智能的优势淋漓尽致地发挥出来的那个公司。而DeepMind战胜了李世石，说明革命的优势已经发挥出来了，剩下的就是如何尽快运用到各个行业中去了。


    3.我们本周介绍了一个理念，来自于一本书《IT不再重要》。今天的社会，有价值的先进科技都会被迅速普及，这时候运用了这些先进科技未必有优势，不用这些先进科技一定有劣势，所以，不要说人工智能创业机会错过了就置之不理，赶紧使用才是正道。


    # 索引和关键概念词典：


    +   006： “范式革命和范式转移”

    007： “深度学习算法”

