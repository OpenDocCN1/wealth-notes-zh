  md: '品研发。


    终于，几年以后，Julien 成功研发了被称为为 E5 的生物废料发电机组，Julien 还在 2015 年汉诺威工业年展上展示了这款产品。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_106_0.png)


    那么，这台机器是如何工作的呢？


    它的主要原理，是通过燃烧生物燃料来进行发电。


    首先，生物垃圾会被放到一个反应炉中，通过 1200 摄氏度的高温，这些废料和木头碎屑会产生热化学反应，几分钟之内，就能生成干净的天然气，燃烧天然气并带动引擎进行发电。


    整套系统的能量效率超过 80%，在这里需要解释一下，这个能量效率是电能和热能的综合，在 80% 中，电能又占了其中的 25%，剩下的是热能。


    不过，能量转化率高只是 E5 的其中一个优点，它另外一个重要的功能，是做到了可移动性和模块化，所谓可移动性，就是机器体积不大，运输很方便。而模块化，就是不需要费很大力气，就可以把几台
    E5 联合起来，形成一个“局域电力能源系统”，整套系统在几周之内即可建造完成。


    说到这儿，你可能已经明白了，这项技术最大的特点是能低成本地提供电力。只要有简单的生物废料，例如虾壳、竹子、叶子等等，就可以就地取材用来发电，也不需投入巨资，建立大型发电厂，或者搭建远距离输电网络，更重要的是，还可以根据产能需求，将一定数量的
    E5 发电机组成一个个“单元”，在基础设施比较落后的地区，这种灵活的组装选择非常实用。


    你要知道，非洲很多地区的电力系统不发达，有超过 70% 的人没有电可以用。2016 年，Arensis 在乌干达的农村，建立了 100 个微型发站点，使用当地的农业废料来发电。由于生物燃料可以做到全天供给，所以，这是一种比太阳能或者风能更加稳定的能源供应。这些微型发站点，可以全天候持续地给当地的
    3 万人提供电力。


    而且，Arensis 不仅在开展非洲的业务，目前它还是英国最大的生物发电设备提供商之一，他们发的电，既可以并入已有电网，也可以直接拿来使用。


    但是，目前限制 Arensis 应用的一个主要问题就是，发电原料的来源不够广泛。也就是说，能转化成生物燃料，用于发电的只有农业废料。因此，尽可能地扩大可用原料的种类，以及降低固定设备的投资成本，这两项是决定这项技术能否大规模、低成本地持续应用的重要因素。


    总之，目前在大气污染治理，水污染，固废处理等领域，环保科技已经相对完备，主要在减量化、重新利用和寻找可替代材料这几个方向展开。


    尽管技术发展阶段不尽相同，有的已经成熟，有的还没实现商业化，但是你要相信，从技术层面上一 Sank 有能力解决这些难题，关键是要找准突破口，而且投入足够的时间和资金，并且懂得运用前沿科技。


    # ——◆ 课程小结 ◆——


    这一讲，我跟你介绍了利用纳米高分子纤维过滤膜研发的雾霾防护产品，以及利用生物废料发电的德国创业公司 Arensis，希望你能掌握以下四点：


    第一，当下，在政府高度重视环境和生态保护的背景下，中国会成为各类环保科技大有作为的新市场。


    第二，环保产业的发展主要依靠环保科技的发展，企业是核心。尽管发展阶段有差异，但是是一定有能力解决问题。另外，在技术推行和实施过程中，一个良好的激励机制和逐渐完善的市场也是重要保障。


    第三，从利用先进科技创业的角度，4C Air 这家公司的创立，完全符合我们说过的美国专利科技转移流程，一项技术在实验室获得突破，教授成功申请专利授权后，然后找到合适的合伙人，成立公司，进一步开发产品，实现商业转化。


    第四，从寻找科技解决现实需求的角度，Arensis 公司创始人发现非洲当地需求后，结合自身知识，再去寻找相关技术成功研发产品。这种创新模式就是周其仁老师讲的“创新上下行”中的上行，从需求向上去找能满足需求的技术。这种方式的好处是目标性强，匹配度高。


    # ——◆ 课后思考题 ◆——


    你有了解过还有哪些应用便捷，成本低，容易推广的环保技术吗？


    欢迎跟我分享。


