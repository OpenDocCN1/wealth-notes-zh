    # 四、智慧农业的发展方向


    我们都知道，中国已经拥有全世界最好的水稻和小麦育种体系了，也能够直接利用最新的基因编辑技术优化农作物品种。


    但是，我给你分享几个数据：


    到2017年，中国农业机械数量只有美国的1/5，而农业人口比例却有17.5%，大约是美国的10倍。


    那么，我们该如何提高生产效率呢？


    我认为最好的途径，就是打造不依赖于人力、高度自动化的智慧农业。


    那么，具体有哪些做法，可以帮助我们实现这个目标呢？


    # 第一个，就是充分利用人工智能。


    比如利用无人驾驶的机器在田间耕种、施肥、收获，利用无人机喷洒农药等等。从世界范围来看，数据正深刻影响农业生产过程，并且已经开始重新定义农业活动。


    就以美国农业机械公司蓝河科技，Blue River Technology 的做法来说，我们都知道，农田里常常会有杂草影响农作物的生长。目前的主要解决手段，就是种植可以抵抗除草剂的转基因作物，然后大面积喷洒除草剂除去杂草，而有些情况，还要靠人工去除草。


    很显然，这两个办法都不理想，前者成本高，还有农药残留问题，而后者效率太低。


    蓝河科技就探索出了新的方法，他们在打药的喷洒设备上安装了摄像头发，这样，在打药的过程中，就可以获取实时的画面，经过机器的人工智能深度学习，就能分辨出是农作物还是杂草了。只有在识别的结果是杂草时，才定点小范围地喷洒除草剂，单这一一个手段就让除草剂的使用量减少了90%。


    此外，他们的设备还能够识别农作物生长的速度，给那些生长缓慢的补充化肥。


    顺便说一下：


    这里所使用的深度学习，其实和我们熟知的“人脸识别”是一个道理。


    人脸识别是用很多人像照片，来训练计算机，让计算机通过五官的相对位置，来区分不同的人。而这个例子，是要教会计算机去判断，前面是一株棉花，还是 SHIFT


    所以，这个过程，就需要大量的图像数据进行支撑，比如，那些常见种类的田间杂草，在不同环境下，在各个生长时期是什么样子的。


    在2017年9月，蓝河科技被美国大型农业机械制造商 John Deere 公司以3.05亿美 元收购了。据 John Deere 的高级副总裁 John Stone
    说，他们看中的，是蓝河科技的机械设备，不仅可以监测和分析农田的情况，还可以就地作出决策解决问题。


    # 第二个，是充分利用数据的力量。


    对于农业生产者来说，他们现在创造的不 仅是农产品本身，同时也包括了宝贵的农业数据。


    在美国的堪萨斯州，农业数据公司 Farmobile 就推出了一款名为被动链接器的 设备，英文叫 Passive Uplink Connection，简称 PUC，这又是个新名词，不过理解起来很简单。


    就是这个设备可以装在绝大多数的农业机器设备上，然后记录这些设备的运行情况。这就相当于给每一台农机设备戴上了“运动手环”。当然，在美国，这款设备是收费的，农民每年需要支付1250美元的使用费。


    你肯定想知道，就这么个类似“手环”的东西，怎么这么贵？


    我们一定要了解的是，贵的可不是“手环”，而是基于数据提供的服务，这才是关键。


    Farmobile 的被动链接器能把整个农场 中，所有设备产生的数据进行汇总和分析，还原出整年的农业活动细节，比如说种植时间、日常管理维护手段、个别区域的差异、收获时间和产量等等信息，这些数据会被传至云端储存。


    这样，农户可以使用数据来优化自己的生产，而肥料公司、农业机械厂家等，则可以通过平台购买农户分析数据，来调整自己的产品。


    正是因为看到数据在未来智能农业中的潜在价值，这家公司还以每年每英亩2美元的价格，向使用了 PUC 设备的农户购买这些数据，为了吸引农户使用，Farmobile
    还决定在未来由数据驱动带来的所有收益都会和农户对半分。有些农户，通过卖数据获得的收入，还超过了设备的使用费。


    可以预期，今后农业技术公司的竞争都将围绕数据展开。未来农民不但可以卖产品，也可以出售数据，而且数据本身也会像农产品一样，结合大数据分析和人工智能，产生巨大商业价值，推动智慧农业的发展。


    # ——▶ 课程小结 ◀——


    在这一讲中，我们分析了美国农业高度发展的 原因，也了解了中国农业发展现状和差距，以及未来智慧农业的发展方向，希望你能掌握以下三点：


    第一，美国的农业经历了机械化和生物技术 的两次技术变革，成为了全球最大的农产品出口国，还大幅减少了农民数量。 根源就在于，美国一直紧跟著每一次技术变革 的趋势，积极把最新技术应用到农业生产中，在现在的人工智能和大数据应用方面，美国农业依然领先。


    第二，到2017年，中国农业机械数量只有美国的1/5，而农业人口却是美国的10倍。而解决之道，就是要向美国学习，积极引进最先进的科技，比如现阶段，就并不是简单地增加农业机器的数量，而是要打造不依赖于人的、高度自动智能化的智慧农业。


    第三，未来实现智慧农业的首要任务就是采集和分析海量真实的农业数据。从世界范围来看，数据正深刻影响农业生产过程，而且未来农业技术公司的竞争都将围绕数据展开。对于农民来说，不仅仅可以出售农产品，更重要的是，农业数据本身也能产生巨大商业价值。


    # ——▶ 课后思考题 ◀——


    中国也是个农业大国，能否说一说你所了解的和体会到的技术推动中国农业发展的具体案例呢？


    # ■ 划重点


    +   1.智慧农业，是把人工智能、物联网、现代生物技术和种植技术等在农业生产的各个环节综合应用，提高产能和效率。

    2.美国从农业大国到经济科技强国的转型过程中，农业不但没有退出国家发展的舞台，反而是紧跟著技术变革的步伐，不断寻找优化升级的可能性，让美国的农业如此发达。

    3.未来农业技术公司的竞争都将围绕数据展开，对于农民来说，不仅仅可以出售农产品，农业数据本身也能产生巨大商业价值。


    王煜全

