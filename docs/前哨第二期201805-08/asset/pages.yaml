  md: '你知道，医疗器械领域由于涉及生命健康安全，行业需要一些严格的医疗认证，比如美国的FDA，也就是美国食品和药物管理局，他们的审批就异常严格，一个认证通常就需要3到7年的时间才能批下来。可以说，拿到了FDA认证，在医疗器械领域就是个非常硬的壁垒。


    我以前介绍过一家医疗器械公司 Intuitive Surgical，他们研制的“达芬奇”手术系统，是通过控制操作台的机械臂来完成精密的手术操作，能让外科医生最小化侵入人体进行手术。这家公司的竞争优势，除了它进入市场早，更重要的是它在8年前就拿到了FDA认证，成为了全球第一个机器人腹腔镜手术系统。


    最后，我还是要跟你强调，从长远来看，为了让企业具备竞争优势，在科技创新中，无论是在规模还是技术上，都需要构建起更高的壁垒，当然，这两者也是相互促进的。


    # 四、积木式创新


    在这个时代，无论一个人的能力多么强，无论构建的壁垒多么高，你都需要与别人协作，开创更大的事业。这就需要积木式创新，就是跟外部构建创新生态。


    目前在全球市场上，大规模生产制造能力是中国最占优势的。在互联网时代，如果没有中国制造，不管这家企业的技术多么创新，如果不能落地，再好的创意和技术也只是概念。所以我一直强调的是构建“全球协作的积木式创新体系”。


    中国具有“开放的制造能力”，这意味着中国不仅能够提供能生产产品的人，还能够提供一大堆对接生产端和设计端的人、一整套开放的体系。


    中国制造业有它独特的优势：大规模、复杂产品的开放制造体系以及产业集群。


    一名苹果前高管说，整条制造业供应链如今都在中国，你需要1000个橡胶垫圈？隔壁工厂就有。你需要100万个螺丝钉？隔街的工厂就有。你需要对螺丝钉作一点小小的改动？3个小时就行了。


    当然，制造能力固然重要，但是比起制造能力来说，制造什么更加重要。


    中国目前遇到的关键问题不在于制造能力，而在于造什么上。因为制造只是产业链中支撑创新和产品落地的一个环节。


    所以，只有与全球先进科技进行对接，助力他们的高端科技产品实现量产，这样中国的整体产业价值才能达到最大化。同时通过制造世界先进的科技产品，制造能力也能同步提高，从过去的“作坊式”生产向“智能化制造”进行转变。


    所以，目前全球科技产业已经进入积木式创新阶段，从资本到资源，创新企业需要更长期、更全面的支持。企业可以专注做自己的长板和研发核心技术，把长板尽可能做长，只要将人力、行政、服务等其他功能委托给其他企业就行，不需要自己投入过多资源。这样集各方力量，能够将企业的优势最大化，进而快速壮大。


    # —— 课程小结 ——


    最后总结一下，我们自己就正在做积木式创新的践行者，积木式创新到底能不能成功，不是要看多少人接受这个理念，而是要看多少企业深信这个理念，去实践然后成功发展壮大。


    因为我们最后的目标，是要推动科技改变每个产业，让所有人都能够利用科技创造更加美好的明天。


    这一讲，我希望你能掌握以下三点：


    第一，企业对新科技敏感，主动掌握科技动态，行动力尤为关键。我一直强调要提前布局前沿科技，当其他人都不还关注，不看好的情况下，你基于自己的判断，思考和实践去预判趋势，提前几年跟踪突破性的技术或者专利的进展，通过联合开发或者专利转让，及早建立合作机会。


    第二，构建壁垒，主要有两种，一种是你比别人早，形成规模壁垒；另一种是你比别人强，形成技术壁垒，这是保持长期竞争力的重要的因素之一。尤其是构建技术壁垒，对于当下中国的发展现状，意义深远。


    第三，一个创业企业只要有一个长板，只需要像搭积木一样，与其他公司的长板整合协作，使整个创新生态的效率最大化。对于中国企业家来讲，更要开拓视野，在全球范围寻找可以对接的长板，我们愿意全力支持和帮助你，构建“全球协作的积木式创新体系”，共同开创更宏伟的事业和更美好的明天。


