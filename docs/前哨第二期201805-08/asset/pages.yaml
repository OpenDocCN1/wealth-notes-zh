  md: '# 253 | 5G通讯技术: 万物互联时代已经来临


    253 | 5G通讯技术: 万物互联。


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 为什么说我们已经进入 5G 时代？

    2. 5G 时代会带来哪些新的机会？

    3. 为什么说 5G 芯片研发很艰？


    这个模块我们要讲的主题是 5G 通讯技术。


    相信你对 5G 这个词儿已经很熟悉了。就在2018年6月，国际移动通信标准化组织已经批准了第5代移动通信技术，这意味着，5G 已经完成了第一阶段全功能的标准化工作。


    但是，这可不代表 5G 能马上全面铺设，还需要一个完善的过程。预计到2019年年底，会完成满足国际电信联盟要求的完整 5G 标准。到2020年，5G 会实现全面商用。


    但是我们说，在 5G 通讯技术被批准的那一刻开始，我们就已经算是进入 5G 时代了。


    而且实际上，5G 通讯技术确实已经在被应用了。


    就在2018年2月，第52届美国职业橄榄球大联盟“超级碗”比赛，爱立信和美国电信业巨头 Verizon 就为运动员们打造了一款特殊的橄榄球头盔，在上面安装了摄像头和一部VR摄像头像。


    也就是，运动员在场内训练，他的第一视角就会被整地拍摄下来，然后所有图像数据都实时上传。你肯定也知道，橄榄球运动的传球、跑动、进攻防守可是相当激烈的，要看得清楚，就必须保证实时画面足够清晰，这就会产生巨量的数据，只有
    5G 网络的高速率、低延迟能满足需求。


    此外，在2018年2月，韩国的平昌冬奥会，就利用英特尔的 5G 技术，提供了大规模 5G 通讯网络。


    从国内三大运营商来看：中国移动2018年就会在4到5个城市开展外场试验，2020年会实现规模商用。


    这一讲，我给你介绍 5G 的概念，发展阶段，关键技术，以及与 AR、VR 和人工智能结合之后，迸发出的巨大机遇。


    # 一、5G 通讯网络的重要性


    那么 5G 到底是什么呢？


    5G，就是第五代移动通信系统，英文叫 5th Generation Mobile Networks，从名字上听，似乎是 4G 系统的延伸。但其实，在性能指标和功能模块上，5G
    平台都具有 3G、4G 无可比拟的优势。


    +   1G 是实现了基本的移动通话；

    2G 是实现了收发短信、语音通话和手机上网；

    3G 则是拓展到了基于图片的移动互联网网络，让大家收发图片，彩信成为可能；

    我们现在用的 4G，标志就是更大的带宽和更快的网速，能在移动网络里看视频、看直播、视频聊天等等。


    而 5G 最大的区别，就是它不再局限于移动互联网，而是还能支持物联网，AR、VR、自动驾驶、人工智能等海量的应用，让我们真的进入到万物互联的时代。


    所以 5G 最关键的指标之一是高传输速率。


    目前，最快的 4G 网络传输是每秒150兆比特 (Mb/s)。按预期，5G会比4G快10倍左右，也就是说，保守估计至少能达到每秒1000兆比特 (Gb/s)
    的速率。传输一部1GB大小的视频，只需要10秒。


    另外，5G通讯技术还拥有低延迟的突出特点。延迟是指当数据量过大，受到网络流量限制，就导致数据传输缓慢，也就是平时所说的卡顿现象。比如在 4G 网络下，自动驾驶的数据传输就无法做到实时，这是在驾驶状态下无法接受的。


    也是基于这个特点，可以说 5G 就是下一代互联网，智慧城市、物联网、车联网、远程医疗等应用都会随着 5G 时代而到来，它会渗透到各行各业，加速经济社会的数字化转型，构建万物互联的世界。


    # 二、关键的 5G 芯片


    在 5G 方面，咱们中国非常积极。


    2013年，就由工信部、发改委和科技部联合成立了“IMT-2020推进组”，目标就是持续快速推进国内 5G 通讯技术的发展，到 2018年，已经在怀柔建成了全球最大的
    5G 试验网络，除了国内以华为为首的通信企业参与之外，英特尔这样的芯片巨头也参与到了其中。


    因为谈到 5G，就一定不能讲芯片，因为它是 5G 通讯技术最关键的部分。


    就在2018年2月25日，在西班牙巴塞罗那举行的 MWC 展会上，华为正式发布了旗下首款 5G 商用芯片，Balong 5G01 和 5G 商用终端，华为
    5G CPE，这标志了国内芯片设计有了比较大的进步。


    对于 5G 芯片来说，研发难度比 4G 芯片大得多，因为它既要支持6千兆赫兹 (GHz) 以下的低频段通讯，还要支持24千兆赫兹以上的高频毫米波。


    所谓毫米波，是指波长在1到10毫米之间的电磁波，频率大约是在30到300千兆赫兹之间。


    你不用太在意这些数字，只需要知道，就是因为这样的通讯频率要求，极大地增加了芯片的研发难度。


    参与 5G 芯片研发的，基本就是高通、英特尔、三星、华为这几家超大型科技企业，因为其他企业很难同时既拥有研发能力，又有足够的资本，同时还要有足够庞大的通信领域合作链条，再强的芯片造出来，如果没有配套的各类技术和产品，也是没用的。


    总体来说，对于需要长期积累的芯片产业来说，还是国外的大公司占据着优势。


    # 三、创意产业的新机会


    那么这是不是意味着 5G 时代只是大公司的舞台呢？


    套用哲学家维特根斯坦的话来说：


    > 想象一种语言就是想象一种生活。


    我们可以这么来说：


    > 想象一种科技就是想象一种生活。


    我认为，5G 时代来临，虽然在基础设施领域，中小企业很难找到机会，但创意产业在科技手段加持后，一定会迎来大爆发，也就是说，中小公司和创业者们可以充分利用巨头们打造的
    5G 网络，发展自己的业务，就像现在的互联网巨头们一样，依靠自己的创意成长为新的国际化的大公司。


    就拿我一直讲的，相比虚拟现实 VR 更容易落地的增强现实 AR 技术来说。


    5年前，一位名叫 Nickolay Lamm 的艺术家和8位无线工程师一起，描绘了一幅利用肉眼，可以直接看无无线手机信号时的世界。信号越强，颜色看上去越偏红色。数年之后，一款可实时实现无线信号可视化的神器终于横空出世。


    2018年5月，日本通讯运营商 NTT DoCoMo 宣布开发出了“5G 实时可视化无线信号工具”，他们通过 AR 技术实现了无线信号的可视化，让人用肉眼就能直接看到五彩斑斓的互联网世界。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_132_0.png)


    可以说，我们正处于一个数字虚拟世界和物理世界交融的时代，5G+VR/AR 就能释放出人类运用数据能力的无限创意和想象力，尤其在网游世界，5G 的低延迟特性会带来全新的游戏体验。


    你还记得以前我们讲过的风靡全球的找小精灵的 Pokémon Go 游戏吗？'
