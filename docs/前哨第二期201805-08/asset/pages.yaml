  md: '# 260 | 物联网：芯片巨头间的“并购大战”


    260 | 物联网：芯片巨头间的。


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 高通为何要并购恩智浦？

    2. 芯片产业近年大并购案背后的原因是什么？

    3. 为什么说物联网是得芯片者得天下？


    第一讲我说道，芯片是物联网的“大脑”，低功耗、高可靠性的半导体芯片，是物联网几乎所有环节都必不可少的关键部件之一。


    这一讲，我要给你讲解的这家公司，就是之前我们提到过的，位于并购大战风口浪尖的的，高通公司的并购目标，全球前十大半导体公司之一的——荷兰恩智浦半导体公司。


    关于并购的原因，在5G通讯技术模块我们就说过，就是因为恩智浦在汽车电子领域、汽车雷达解决方案、自动驾驶计算平台等方面，都有相当多的技术和专利积累，而高通希望在5G和物联网时代，打开自己在汽车领域的业务，形成更多元化的产业布局。


    # 一、从部门到公司的转变


    恩智浦半导体公司的前身，其实是荷兰飞利浦公司的半导体部门。


    2006年，飞利浦与美国私募投资资料尔伯格·克拉维斯、美国风投机构银湖集团，以及美国私募机构 Alpinvest Partners 签署了协议，将原来的半导体部门从集团公司剥离。并注资成立新公司，起名叫恩智浦半导体公司。其中飞利浦占19.9%的股份，而其他3家合计占80.1%。


    之所以要拆分，主要原因就是当年半导体行业的业绩下滑。


    其实在2000年，飞利浦的半导体部门的业务增速还高达50%以上。他们研发的车载娱乐信息系统以及车内通信等电子系统都攀升到行业第一，成为这些领域的首席供应商。


    但是，2001年互联网泡沫的破灭，一下就让飞利浦的半导体业务的业绩一落千丈，反之，飞利浦的医疗健康部门的发展却越来越好。


    于是是在2004年，飞利浦公司在面对半导体部门多年亏损之后，调整了业务战略，把重点转向医疗保健市场。


    # 二、收购飞思卡尔


    尽管恩智浦是2006年新成立的公司，但其实，在恩智浦还是飞利浦半导体部门时，他们在汽车电子业务上的表现就已经很突出了。


    1991年，飞利浦半导体的产品就通过了福特公司的TQE标准，英文叫Total Quality Excellence。这个标准的严格程度在当时是超过ISO-9001标准的。


    1997年，飞利浦半导体公司的产品又顺利通过了QS-9000标准。QS是Quality System的简写，这个标准比福特原来的TQE标准还要高一些。


    当时他们的主要客户，就有著名的一级供应商博世公司。


    根据Strategy Analytics的分析，2009年汽车电子市场的总市值大约为170亿美元，当时在所有供应商中，恩智浦按市值只能排名第5。2015年收购了飞思卡尔后，一下跃居汽车电子首位供应商的地
    位。


    飞思卡尔的业务，主要面向汽车、网络和消费电子市场，包括提供微处理器、微控制器、传感器、模拟集成电路和连接的技术。而恩智浦在通用微控制器上的市场份额仅为飞思卡尔的1/5。合并以后的新公司，在通用微控制器市场成为排名第二的大厂商。


    要知道，微控制器市场是一个高度分散且竞争激烈的领域，几乎所有的厂商都采用ARM公司的芯片。而软银又收购了ARM，这个我们后面会讲到。


    尤其在汽车领域，恩智浦一直专注于汽车互联上的应用，包括：汽车娱乐、车联网、安全汽车接入、安全通信、雷达等。简单地说，提供汽车各个部件都可以用得上的模拟器件。而飞思卡尔的优势在于汽车控制和信息处理。


    这次并购，把恩智浦的硬件与飞思卡尔的软件进行整合，形成软硬件完整的生态系统。可见，两者的业务互补性很强，能够为车联网提供包括安全性、微控制器、软件、连接等整体解决方案。


    当然，不仅仅是业务并购，汽车电子市场的持续增长也是重要推手，这主要由以下三点原因：


    +   第一，汽车当中的电子化程度越来越高。你知道，目前汽车中控台几乎都设计成类似Pad的显示屏，越高端 的车，显示屏就越大。

    第二，政府推动的安全相关法规会对汽车电子产业有促进作用。例如美国的胎压监测法规的颁布，就增加了气压传感器的销量。可见，如果没有电子系统，汽车都无法满足政府的监督要求。

    第三，各大汽车厂商将会把汽车电子设备作为产品差异化竞争的重点。随着5G以及自动驾驶技术的普及，每辆车上将会需要更多的传感器、照相机以及电子系统，因此将会极大地推动汽车电子市场发展。


    可见，恩智浦的发展历史与并购重组和行业发展是分不开的，通过并购重组，快速增加企业竞争力是行业的惯用策略。


    除了上一个模块我跟你说过的最终没能成功的博通收购高通的案例之外，很多其他大公司也是采用这种策略，根据市场和趋势变化，整合资源，扩大业务版图。


    # 三、大公司的卡位战


    2015年和2016年是半导体行业并购的“大年”。各大科技公司为了在物联网时代提前布局，通过并购，不断强化优势，卡位关键环节。


    2015年5月28日，安华高科技公司以370亿美金收购博通。这是全球芯片业历史上最大规模的一桩并购案。合并后的公司，当时成为美国第三大半导体制造商，仅次于Intel和高通。


    安华高科技的主要产品是无线以及光学应用领域的模拟电子器件，而博通的专长则在于数字以太网、电缆以及无线连接领域，因此两者的产品并没有许多重叠部分。


    因此，合并后的新博通拥有了更加广泛的产品线。此后，新博通又打起了高通的主意，但由于美国政府的介入，最终以失败告终。


    在安华高科技收购博通案后，Intel感受到了竞争对手带来的压力。而Intel采取的策略就是买买买，从2015年开始就买了Altera，除此之外，还买了很多器件公司，比如Movidius。


    为什么要买Altera呢？


    要知道，物联网对于计算能力的要求是 很高的。这家公司本身是可编程逻辑器件公司，每年有20亿美金销售额，占领了超过30%的市场，产品主要面向数据中心和物联网市场，既可以用在数据中心的加速上，也可以用在物联网技术的边缘计算上。


    边缘计算，就是采用网络、计算、存储、应用核心能力为一体的开放平台，就近提供最近端服务，其中思科公司提出的“雾计算”就属于其中的一种。


    基于对可编程逻辑器件市场的预期，Intel就买了这个公司。


    而且带来了一个有趣的事情，Altera被Intel买下之前，刚好谈下了跟微软数据中心的合作，就是把可编程逻辑器件用到数据中心提高计算速度，最开始是智能网卡，后来变成了云服务。


    这件事情，使得Intel很自然地进入了微软数据中心的业务。


    最后要说的，就是我经常提到的产业布局前瞻者孙正义。可以说，软银集团是物联网的“产业整合者”。


    2016年7月，日本软银集团宣布以320亿美金收购英国芯片设计公司ARM。'
