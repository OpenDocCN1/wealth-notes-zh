  md: '# 251 | 智能制造：迎接更激烈的科技军备竞赛


    251 | 智能制造：迎接更激烈。


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 如何利用先进技术帮助传统产业提高效率？

    2. 什么是柔性制造？

    3. 美国回流制造业对中国有哪些影响？


    这一讲，我们来讲解智能制造带来的新机会。


    中国制造30多年的发展，的确取得了极大的进步，Made in China 的商品卖得全世界都是。2018年4月前哨大会我们选在了深圳举办，是因为这个城市已经成为全球电子产业的制造业高地。


    不过，就像中国经济发展的很不平衡一样，中国制造业的区域发展也很不平衡。中国经济的发展有非常强的地域色彩。


    比如浙江省的柳市就是低压电器的聚集地，福建晋江是运动服装的大本营。


    这种产业集群在很大程度上实现了规模经济效应，可以有效地降低成本，让当地农民也能快速进入到大规模的全球产业链的分工中来。但是，时至今日，这样的产业发展模式也在面临转变。


    咱们这一讲，就先看一个非常传统的地方毯生产企业借助人工智能和机器人技术提升制造业水平的案例。


    # 一、AI+工业机器人的大规模应用


    我在工业机器人模块说过，未来各类型机器人会越来越多了。但是，你一定以为，工业机器人目前主要应用在自动化水平比较高的汽车、航空航天等领域，其实，在传统行业，机器人的应用范围越来越广，发挥的作用也越来越大。


    山东滨州阳信的地毯企业比较密集，前不久还有消息说这里被山东省定位成地毯特色小镇。以往这个产业属于劳动密集型，大部分工序都完全靠手工操作，劳动强度高，工作效率低。


    为了提高工作效率、地毯的品质以及实现色纱用量精确控制，越来越多的企业开始应用一种叫做“枪刺植绒机器人”来代替手工作业。


