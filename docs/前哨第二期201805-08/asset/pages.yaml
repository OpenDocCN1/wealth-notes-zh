  md: '# 218 | 工业机器人：人机协同工作的大时代


    218 | 工业机器人：人机协同。 ↓


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 工业机器人主要分为哪几类，各有什么特点？

    2. 工业机器人的优点和缺点分别是什么？

    3. 工业机器人的发展趋势是什么？


    说起机器人，你一定不会陌生，无论是我投资的 Hanson Robotics 的大明星 Sophia，还是2018年年初的美国 CES 展上我介绍过的，在酒店见到的会调侃卖酒的机器人。各种各样的机器人其实已经进入到各个行业，为我们提供了很多服务。


    肯定的说，未来机器人的数量会越来越多，与人类的协作范围也会越来越广，成本也会越来越低。总体来说，机器人产业未来发展潜力巨大，同时，也在潜移默化地影响其他产业格局。


    # 一、工业机器人


    # 二、特殊机器人


    # 三、仿生机器人


    ![](img/ec68de57cecf4aa37e2670e9d4879832_49_0.png)'
