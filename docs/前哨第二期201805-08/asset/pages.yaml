    全球科技发展日新月异，而且多个趋势齐头并进，如何提前布局，如何找准赛道，如何找到志同道合的同行者，这些都是你将面临的挑战。


    # ——◆ 创新地图大会 ◆——


    所以，继2018年4月22日第二届前哨大会之后，我们又将在8月11日，在深圳举办第一届创新地图大会。


    前哨大会着重介绍全球的创新趋势，而创新地图大会则希望实实在在地促成科技和产业的深度对接。


    # ——◆ 模块总结 ◆——


    我们这个模块的主题是物联网，介绍了以下三个重点：


    第一，物联网是一项复杂的综合技术和系统工程，融合了物理载体、芯片、传感器、通信技术和云计算等多项技术。芯片是物联网的“大脑”，低功耗、高可靠性的半导体芯片是关键部件之一。物联网技术主要围绕着“数据采集”和“分析决策”两大核心不断演进，最终的目标是实现系统运行的自动化和智能化，无需人为干预。


    第二，尽管说物联网中“得芯片者得天下”，大公司也早在几年以前就针对计算能力、应用领域、芯片设计等重要环节展开了卡位战，他们已经搭建了物联网的通用平台，降低了应用开发的准入门槛。但全球电子产业是一个整体的生态系统，仅仅通过控制某个关键环节，企业来控制整个生态，是不现实的。所以说，既要从整体生态布局的角度去思考物联网，又要深入行业本身据据需求。


    第三，连接创造价值。无论你处在科技行业，还是传统行业，都可以尝试用这个系统解决行业痛点，提高效率。实践中不仅要考虑实现“连接”的成本，更重要的是判断“连接”的意义。需要你深入思考，拿出清晰的发展思路，以及切实解决方案。未来的世界，将由数据驱动，人与人、物与物、人与物之间的联系，将越来越紧密，它们在创造更大价值的同时，也为我们构建了更美好的明天。


    # ——◆ 用户问答 ◆——


    # “马克劳”问：


    7月15日，国家药品监督管理局发布了关于长春长生生物科技有限公司违法、违规生产冻干人用狂犬病疫苗的通告，发现企业生产存在记录造假等严重违法行为，不仅仅在狂犬病疫苗，还涉及到其他多款疫苗。想请王老师评议下这起重大事件，该采取什么样的监控体系，或者什么样的技术方法来避免此类事件的发生呢？


    # 我的回答是：


    其实这次的问题，还是国家药品监督管理局主动监察的时候发现的，不过，因为现有的监督手段是靠人的，所以难以做到及时发现问题，发现的时候，这家企业造假已经有很长时间了，造成了非常恶劣的社会影响。


    # “宋晨豪”问：


    芯片发展需要投入大量的时间和资本，按照目前发展的进度，等我们做到10几纳米，别 人已经做到小于5纳米了。而当我们采用新型半导体材料时，别人已经使用量子或光子计算机了。请教王老师，在基础研究领域，有没有弯道超车的的机会？


    # 我的回答是：


    当然存在弯道超车的机会了，就是我们介绍的要提前分析有哪些技术突破，要提前参与这些技术突破的商用化。


    # “李坚”问：


    在物联网时代，面临的网络安全问题是不是将更加严峻和复杂，需要如何应对呢？


    # 我的回答是：


    这是个好问题，其实现在物联网的安全问题已经出现了，核心原因就是物联网设备的计算能力往往不如手机和电脑这样的互联网络设备，保密性和安全性本来就 葭好，而且软件也不统一，造成软件更新很困难，一旦出了安全问题难以迅速用软件升级来弥补。


    # “luciole”问：


    目前的专业是法语翻译，学习了许多年了。但是现在看到机器翻译进步的速度那么快，实在很担忧自己的技能是否会马上被机器替代呢？是不是应该考虑更换专业呢？


    # 我的回答是：


    这就是我们一直强调的思考问题的角度问题了。'
