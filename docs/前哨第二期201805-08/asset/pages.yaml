- pgno: 40
  md: '所以，其实至少有上万家小企业是专门做产业研发的，这些企业往往从高校里拿到了先进科技，它的目标就是把这个科技迅速地产品化做上市。而一旦产品上市，携带着先进科技之力，往往能够获得巨大的市场。


    而且这些企业因为都是拿的风险投资人的钱，每年要花掉几百万，所以如果它的技术不过硬，早就会被淘汰掉了，可以说这上万家企业都是非常有实力的。


    这种科技推动市场的力量非常强大，机制一旦形成，就能够持续地为市场注入活力，这就是虽然欧洲市场疲软，但是美国市场持续向好的原因。


    # 四、新的机会永远更大


    另外，还有一组数据，就是除了财富500强，还有财富1000强数据。


    1973年到1983年这10年里，美国的财富1000强企业换了350家，就是有1/3因为不够大而下去了。新的350家，长得足够大，进入了榜单里面。


    但是2003年到2013年，这10年里，有712家都换掉了，也就是说现在大企业被换掉的几率大大增加了，不一定是因为自己破产或者经营不善，更多的可能性是过去很多小企业现在迅速地成长起来，超过以前大企业的规模，取得了新的领先优势。


    所以，我们现在讲，企业不要担心没有机会，新的企业从规模上，从体量上，从发展速度上都会扼杀老企业，新的机会永远是更大的。


    那么所以我们说，其实我们对未来发展趋势的判断也是基于量化数据的，我们之所以带中国的企业去和美国的科技企业对接，就是因为看到了这个趋势。


    # 五、硅谷不再是创新中心


    当然，还有很多其他的例子，比如我们原来也介绍过，我们在作人工智能未来发展趋势分析的时候，就用到了美国人工智能研究专家的分布数量图。


    因为我们发现，先进的科技企业的科技的来源都是高校，也就是意味着说，今天高校里教授的科研成果，明天会转化成企业的产品，那么这种转化周期一般都要5到8年。


    也就是说，今天教授的实力在5年之后会转化成市场实力。


    那么当然了，今天教授的分布情况就意味着5年之后产业的迁移情况。


    我们发现，今天美国的人工智能专家的数量从分布上来说，东岸已经大大高于西岸，也就是说未来东岸的人工智能公司，不论从数量还是从质量上讲，都有可能大大超过西岸，这也进一步证明了我们的“硅谷不再是创新中心”的预测。


    # 六、宏观趋势与微观趋势


    那同样的，我们还有一个观点认为，其实宏观趋势应该是微观的汇总，也就是说我们对微观趋势的判断，汇总起来就能够较为宏观产生了解。


    为什么要对技术的宏观趋势作判断呢？


    因为技术的进步往往呈现一定的周期性，投资技术高速发展期的企业更容易成功，所以投资也会呈现周期性。


    投资者都不愿意错过潮流，所以潮流上的企业拿到投资的机会会大大增加。一个优秀的投资人不光要会看企业，也要会看趋势，因为如果投对了趋势，不光能提高投资的成功率，从产业的角度也更容易帮助企业建立产业优势。


    +   作为投资者来讲，意味着现在投资于细胞治疗，收获可能不远了；

    对于创业者而言，意味着如果你还没有进入这个领域，可能已经来不及了；

    而已经进入这个领域的企业，可能要开花结果了。


