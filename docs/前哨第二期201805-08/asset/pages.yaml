    009： “人工智能的3个要素和4个层次”

    010： “技术门槛降低”


    # 3) 航天产业


    1.大航天时代正在到来，其对人类的重要性程度可以媲美开创了人类文明新纪元的大航海时代。虽然大航天时代的市场还没有完全展开，可能还需10-15年的时间，但是产业的布局一定要提前，如果要做好研发甚至需要5-8年，所以，我们认为现在已经到了大航天时代布局的关键时刻。


    2.大航天时代的主角是私人航天企业，我们给大家介绍了私人航天的历史其实也很悠久，而且私人航天的大量经验都是非常宝贵的传承并且都被继承下来用于今天的航天实践。另外，就是在大航天时代到来的时候，我们必须掌握如何把传统的这个国家主导的航天产业的优势转化为私人航天优势的这样的能力。


    3.大航天时代的序幕是运载能力的解决。但是，大航天时代，构建了一个复杂的生态系统，其各个组成部分都将会同步展开，并不是一个纵向的问题解决以后再解决下一个问题的产业布局，而是横向地同时把各个问题一起来解决。因此，中国尤其要抓住机会，必须要迎头赶上。中国的航天事业经过几代航天人的努力，我们的国家航天实力已经居于世界最前列，但是，不要在大航天时代来临的时候，反倒产生退步。


    # 索引和关键概念词典：


    +   011： “私人航天产业”

    012： “梦想和商业激励”

    013： “私人航天产业现状”

    014： “私人航天的8个应用机会”

    015： “平行产业模式”


    # 4) ICO与企业投资


    1.ICO是最风险投资项目，被动投资者不宜介入。因为被动投资的人是想在不理解的情况下之下随便投一下就算了，这种时候很容易投出偏差。包括有很多 人问我的问题是，到哪里去买ICO项目，这是一个典型的被动投资者的
    问题。我的回答是，既然您都不愿意花时间搞清楚ICO是什么，搞清楚到哪里去买，那您就最好别买了，因为风险实在太大。


    2.投资的心态要好，越多做研究越了解投资的风险，同时越不怕损失，越不介意回报，投资收益反倒就越好。比特币我原来是建议投资的，是可以投，而且建议投了就不要管。但是
    ICO可不行，ICO的风险要比比特币高很多很多。因为如果你投了就不管的话，过两天这个货币可能都没有了，就血本无归了。


    所以我建议：ICO 大家轻易不要碰，尤其是非专业投资人、被动投资人、散户不要碰。如果 你已经投了，建议你取得预期回报之后迅速退出，这是我们一个基本原则，我们确实一直讲投资要敢冒风险，但是不要冒不值得的风险。


    3.ICO投资说是投虚拟货币，但其实投的是发行虚拟货币企业的信用，投的是项目团队的能力。如果你没有看团队的能力，如果你没有投资团队的经验，这个ICO领域慎入。


