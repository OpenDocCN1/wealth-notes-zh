    如果不用服务器端软件，如何给用户提供服务呢？


    Serverless 是一种更加“碎片化”的软件提供的思路，就是把业务实现的能力分解成了一个个的功能函数，我们称之为“函数即服务”，Function as
    a Services，简称为 FaaS。


    实际上，Serverless 架构就是用轻量级的微服务 Micro-service 架构来代替服务器。


    也就是说，这种服务所需要的资源，相对于目前的基础架构服务和平台服务这样的重量级服务来说，要少得多，所以轻量级。而所谓的“函数”Function 提供的是相对微服务更加细小的程序单元，供开发者直接调用。


    比如你开了一家创业公司，计划把所有的应用程序都部署在云平台提供的网络服务器上。但是刚开始用户访问量不是很多，如果365天24小时地在云端运行应用程序就会很浪费，实际上也没有必要无间断地运行这个服务。


    你可以把代码存储在云端，只有当用户访问时，才调入相应的计算机资源执行代码，运行完之后，就不再占用计算机资源，这个就是 FaaS。


    它最显著的好处是，降低基础设施的成本，以及运营、开发人员。


    # 四、5G 高速网络的到来


    云计算的逻辑，就是把企业的服务器都放在云端，那么当主要服务都集中到几大云服务商的数据中心，无论是计算，还是数据，都从本地移到了云端，那么网络就成为限制的最大瓶颈。


    这个大家都有体会，无论是在线看超高清视频时的卡顿，还是双11购物节几亿人网购时的网络压力。可以说，云计算未来最主要的挑战就是网络速度。而以 5G 为代表的高速网络对未来云服务是重大利好。


    下面来看看高速网络的发展现状，按照网络的使用目的，主要分两类：


    第一类，数据中心内部的高速通信网络。


    当前的数据中心还主要以 1G 到 10G 带宽网络为主，正在向 40G 到 100G 的网络前进，而最先进的网络设备制造商已实现 200G 到 400G 的超高速网络。


    比如，以色列 Mellanox 网络公司，能做到 400G 网速，这是目前的最高速度。


    这是什么概念呢？


    网速每秒钟 400Gbits，相当于 50Gbytes，就是说，拷够50个高清影片只需要1秒的时间。


    目前世界上最快的500台超级计算机中，接近40%的系统都使用了这家公司的高速 Infiniband 网络和高速以太网技术。


    近年来随着云计算的迅猛发展，不远的未来，上百 G 高速网络将成为常态。


    另一个做低延迟网络起家的美国网络公司 Arista，提供高可用，指南络设备失效效率低；低延迟，指网络设备反应速度极快；自修复，指网络和设备能够自己检测问题，并能自动采取修复措施的智能网络设备。


    毕竟在云计算时代，数据中心有庞大的网络连接，一个网络设备失效可能会影响上千台服务器。所以，智能化、自动化的网络管理，系统自动检测和修复功能就显得非常重要，这也是未来云计算平台数据中心的发展方向。


    第二类，是用户终端，就是指用户连接云端的速度。


    其中最引入关注的是 5G 通信技术的发展。5G 就是第五代移动通信网络，是在目前 4G 成熟的基础上，下 Physics...


    # —— ◆ 课程小结 ◆ ——


    这一讲，我介绍了云计算的三个主要问题，以及对应的发展趋势和机会，希望你掌握以下三点：


    第一，云计算的发展的初衷与方向就是提供像水、电、煤气一样，随时可用的基础服务。而硬件计算资源融合和“软件定义基础架构”是实现的可行途径，能真正把人从巨量的运维工作中解脱出来。大量计算、存储和网络工程师可以多投入其他更具创造力的应用开发中。


    第二，Serverless 架构是用轻量级的微服务替代服务器，用细小的程序单元供开发者调用，不仅能把云平台的计算资源利用效率从目前的5%到15%提高到80%以上。从用户角度看，还能大幅度节省成本，这有助于初创企业降低
    IT 基础设施投入和计算机人力成本。但会增加企业对平台的依赖程度，未来平台有可能会出现赢家通吃的局面。


    第三，云计算发展的瓶颈在于网络速度，而高速智能化的网络正是未来趋势。无论是云端的上百 G 高速智能网络，还是 5G 引领的用户端与云端的高连通。它们会创造出很多使用云服务的新方式，比如
    VR/AR 应用的大爆发，专注 VR/AR 应用开发领域的公司，将迎来一个发展的黄金时机。


