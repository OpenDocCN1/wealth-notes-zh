    在欧洲海上风电发展的早期，也出现过由于海底电缆铺设延期，而导致海上风电厂无法输出电力的尴尬。


    此外，可再生能源的整体成本中，还需要考虑电网的消纳成本，而不仅仅是生产成本。尽管现在太阳能风能发电的整体成本呈下降趋势，但是政府补贴也会逐渐减少或者取消，所以进一步降低成本的挑战也不小。目前，可再生能源的发展已经进入精细化和智能化的阶段，必须积极利用人工智能、大数据等技术，来提高效率和降低成本。


    # 另一方面，传统化石能源的价格也有一定的下降空间，结构也在不断优化中。


    有些用户可能会了解，目前，在煤的产地，比如说山西，建了一些坑口电站，也就是建设大型电站，就地发电，输出电力。它的好处是，可以节省煤炭运输的成本，降低传统火电价格，比如山西是每度电3毛3分钱。


    然而，它的缺陷也很明显，就是会加重当地的环境污染，而且由于产煤区往往不是电力的核心消费区，如果要把电缆送到核心消费区，要建立以产煤地为中心的电网传输系统，需要巨大的成本投入，那也是不现实的。所以，坑口电站目前只适用于局部地区，用来降低局部电价。


    此外，传统化石能源的结构主要是煤炭、石油和天然气。中国当前利用天然气的比例，还远远低于美国，还有很大的优化空间，另外，美国的页岩气技术能够提供大量廉价的天然气，这是传统化石能源的一次大突破。


    可以说，如果中国也能开采页岩气，那么中国的能源结构也会得到优化，在这个模块的加餐当中，我们前哨的专家会为你详细解读页岩气发展的现状和机遇，敬请期待。


    所以，总体来说，可再生能源和传统化石能源，很难说哪一个的发展具有压倒性的优势，两者可以互为补充，各自发挥自己的优势，为我们提供更清洁，更廉价，环境更友好的能源。


    # ——▶ 课程小结 ◀——


    在这 一讲中，我为你分析了可再生能源领域的机会，以及它与传统化石能源的关系，希望你能掌握以下三点：


    # 第一，要在可再生能源领域布局，必须要对技术前沿有充分了解。这个领域除了主流的太阳能、风能技术以外，其它相关的技术也值得关注：


    +   太阳能光热技术，具有可储能、可调峰的功能，随着价格下降，它将有机发挥巨大作用；

    电制氢储能技术可以满足大规模长期的储能要求，将电网无法消纳的部分可再生能源，用于储存和调峰，或者运送到其他地区使用；

    区块链有望为我们提供一个灵活的、去中心化的基础交易服务，将分散的电能生产和储存单元有效管理起来，维护电网的动态平衡。


    # 第二，从产业生态的角度，可再生能源进步很快，但目前储能技术相对落后，是这个产业发展的痛点之一。除了发展配套的储能技术之外，太阳能光热技术、电制氢储能技术的商业化规模虽然相对落后，但它们都具有能量储存的优势，随着整个可再生能源行业的迅猛发展，消纳问题日益突出，这些技术将会迎来快速发展的机会。


    # 第三，从市场竞争的角度，代表未来方向的新技术不必然战胜老技术。得益于可再生能源的精细化和智能化管理，可再生能源的成本将会不断下降。但传统化石能源的结构也在不断优化中，价格也有一定下降空间。因此，很难说哪一个的发展具有压倒性的优势，至少在近期，两者可以互为补充，各自发挥自己的优势。


    # —— 课后思考题 ——


