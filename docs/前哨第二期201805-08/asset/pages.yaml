    创新地图： “页岩气革命”


    # 6) 新能源汽车


    1.美国和德国一般政府不干预市场运行，企业经营以市场需求为导向，但会出现创新企业被既得利益者压制的局面。传统燃油车企的市场主导地位依然稳固，充电相关设备建设进度缓慢。


    而中国，出于环保压力和对创新的支持，由政府牵头，强力主导推进电动车产业的发展，无论在优惠政策、技术和相关配套设备建设上，都走在了世界前列。这也是国外车企与中国车企合作，造车新势力与传统车企合作的重要出发点，这种模式符合我们所说的
    “积木式创新” 的原理。


    # 索引和关键概念词典：


    +   233： “中国电动汽车的3大发展趋势”

    234： “新造车势力”

    235： “造车领域的富士康”

    236： “新能源汽车产业3大机会”

    237： “量产赌博与科技胜出”


    # 7) 环保科技


    1.环保问题是世界范围的议题，环保要做好，必须要把环保市场培育起来。这个过程中，需要三个方面的努力：

    一是政府立法和监督，体现对环保事业的导向性作用，政府决策和重要政治人物的支持或反对都会起到关键作用。

    二是全社会都要求共同遵守达成的规则，普通大众也要积极参与到环保事业中，让不环保的产品付出额外经济成本，而环保的产品更受欢迎，甚至享受销售溢价。

    三是要有环保企业针对目前的重点问题，积极利用先进科技形成切实有效的解决方案。


    # 索引和关键概念词典：


