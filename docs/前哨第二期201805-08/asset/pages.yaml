  md: '# 创新地图大会｜创新土壤：美国创新区


    这一讲，我带你了解美国的创新区和创新机制，我会以波士顿为主要例子为你详细分析，希望你也能参与到构建科技创新的生态中。


    # 一、创新区的概念


    首先给你解释下什么叫创新区？


    创新区，英文是 Innovation District，简单说就是一种实现产业集群的城市规划手段。


    在创新区里，研发机构、创业企业、孵化器及金融辅助机构等高度聚集，这里具备更完善的公共服务，所以企业创新也更活跃，人才聚集，拥有了更高的科技创新密度，更容易实现密切的知识共享和技术合作，是一种支持创新的综合模式。


    创新区目前在美国非常普遍，而且这种形态正在成为全球创新的主流模式。


    美国著名的智库布鲁金斯学会，在2014年和2017年出版了两份报告，对创新区作了详细的分析。他们认为创新区主要有三部份资产：


    第一是，物理资产，包括在步行范围内交通通达的社区、社交便利的公共空间、全网覆盖的商店等各周边环境；


    第二是，经济资产，包括高校、研究院、大企业和创业公司的高密度聚集，最好还有帮助科技实现商业化的技术转移办公室等等；


    第三是，社交资产，包括当地的孵化器和加速器，以及帮助创业者、企业家和投资人交流的各种商业活动。


    说到创新区，很多人就是跟我谈“硅谷”，但硅谷只是美国创新的代表之一。在这次创新地图大会上，我介绍了20个美国创新区，它们构成了美国科技创新的土壤。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_195_0.png)


    在20大创新区中，我们在2017年组织中国企业家参访过旧金山、圣何塞、波士顿和匹兹堡，2018年5月组织的美国科技投资考察活动中，已经过去亚特兰大、北卡研究三角区和华盛顿。


    2018年10月，我们将组织一次美国西南地区的投资考察，将覆盖休斯顿、奥斯汀、凤凰城、丹佛四个创新区，这样，到今年底，20大创新区我们就参访了超过一半了，明年我们还会访问更多，争取尽快覆盖所有20大甚至更多创新区。


    通过了解美国创新中心，我的目标是帮你建立全球视野，抢先了解科技创新都是在哪里发生的，提前找到真正先进的科技，然后基于产业判断和预测，把先进科技转化成产品落地。


    我们正在策划前哨第三季的内容，会系统介绍美国20大创新区和一批著名的研究型高校，让你找到美国创新的源头和高地，敬请期待。


    # 二、波士顿创新区


    这里我先给你讲讲其中一个创新区，就是波士顿。


    波士顿集中了创新区的各种创新要素，包括：高校、大公司、创新机构、产业环境。你可以通过它，全方位了解美国的创新生态。


    我总结为四点：


    # 第一点，创业环境需要高校提供核心科技创新。


    你可能对波士顿不太熟悉，但是你一定知道哈佛大学和 MIT。


    而实际上，波士顿地区有超过100所大学，而且这些大学还不是一般的大学，全美高校排名前50的就有7所，比如塔夫茨大学、波士顿学院、波士顿大学等等，这里是名副其实的美国高等教育的核心区。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_195_1.png)


    波士顿拥有全球最顶尖的实验室，比如 MIT 的计算机科学与人工智能实验室（CSAIL）、MIT 媒体实验室等等。


    在美国，没有高校的支持，就没有核心科技，科技创新企业就很难成长起来，因此可以说高校的存在，是一个地区产业有效发展的内在动力。


    # 第二点，优秀大公司往往是创业者的黄埔军校。


    一个创新区，除了高校培养人才和取得科研成果之外，还有一个重要的要素，那就是优秀的大公司。我的看法是，优秀的大公司往往是创业者的黄埔军校，前辈成功的故事，往往是后辈的榜样。


    去过波士顿的人应该知道波士顿有一个地标建筑：健赞公园。


    健赞是波士顿最早一批的生物制药公司，公司的科研实力雄厚，所以迅速发展壮大，成为了跨国企业，现在波士顿地区有1000多家生物科技企业，其中很多企业家曾经是健赞的员工，可以说健赞为波士顿的创新企业培养了很多企业家。就像从硅谷最早的仙童公司辞职出来创业的8位企业家，奠定了硅谷发展的基石一样。


    # 第三点，创新机构提供全方位的创业支持。


    对于一家科技创新的小公司来说，离不开创新区里支持创新的相关机构，比如创业加速器和孵化器，波士顿有大量的这种资源，其中有名气的有：充满竞争的 MassChallenge、支持硬件创新的
    Bolt 等等。


    MassChallenge，翻译过来叫麻省挑战赛，目前是全球最大的创业加速器，很多流行的加速器模式就是他们创造的。


    他们为你服务4个月，给你免费提供办公环境，帮你对接各种资源。4个月结束，组织大型路演，请各路投资人来看项目，帮助创业公司早日拿到下一轮融资。10年时间他们一共加速了来自81个国家的1500个创业公司，在这里加速的创业公司一共融到30亿美金的资金，创造了8万个就业岗位。


    和 MassChallenge 不一样，波士顿成立的硬件加速器 Bolt，它的核心在于提供硬件研发设施的支持，它有一整套硬件原型开发的设备，比如 3D 打印、3D
    扫描、激光切割器，而且会提供全职工程师来帮助驻扎的创业公司运用这些设备，缩短企业开发原型的周期。


    # 第四点，创新需要科技集群和产业环境。


    科技集群，指的是在一个地区，一旦聚集了一批优秀的人，就会很快吸引到更多优秀的人，逐渐地就会有企业、人才、创意、技术这些资源不断聚集，积累到一定程度之后，就形成了创新的产业环境。


    提到波士顿，就不得不提128公路，它是知名的科技集群社区，全长90公里，环绕波士顿呈半圆形，这条公路上聚集着上千家研究机构和科技企业，其中有70%的公司都是
    MIT 毕业生创办的。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_195_2.png)


    1948年，美国一家房地产公司 Cabot & Forbes，大量买地建设产业园区，然后出租给企业，还提供企业信贷支持，很快吸引来大公司，包括相机巨头宝丽来、晶体管巨头
    Clevite、喜万年国际照明集团等等。很快，这个园区都是大而全的公司，小公司、创业企业在这里没有生存机会，时间一长整个环境就逐渐变得封闭，变得不利于创新。


    所以，128公路在上世纪80年代逐渐衰落了。但是之后，随着大公司的解体，很多员工不得不出来创业，反而给128公路带来了新生机，正好《硅谷法案》横空出世，天时地利人和的条件都齐了。整个地区之后重新恢复了活力，而且很快就形成'
