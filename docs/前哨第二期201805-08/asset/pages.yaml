    # 8）人工智能入口


    1.今天的风口都是之前长期科技研究积累的结果，软硬件能力都具备了，所以美国现在人工智能入口的潮流已经从智能家居开始兴起了。但是，这一轮中国的跟随未必奏效。


    2.整个人工智能入口的潮流需要一个完整生态的支持，美国软硬件支持都比较充分，而且有大公司做人工智能平台，也有丰富的版权内容提供，所以现在形成了一个格局，就是大公司来争夺人工智能语音的入口，同时开放功能平台，小公司可以在上面做各种垂直应用。但是，很有可能会，小公司做成巨无霸的机会就比较小了，未来人工智能的入口还是在这几个大公司之间激烈地争夺。


    3.我们介绍了T型战略，想要抢到风口，必须要找准应用。尤其是中国生态相对不够健全，反倒造成大公司也不一定能够抢到这个风口。反之，小公司如果找准了足够有未来空间的机会，很有可能反超，利用人工智能入口的这轮新的风口，成为下一个BAT。


    # 索引和关键词概念词典：


    +   036： “技术回归人性”

    037： “小公司退化”

    038： “单品竞争和生态布局”

    039： “人工智能入口的3大机会”

    040： “T型战略”


    # 9）基因编辑


    1.从上世纪80年代初的个人电脑兴起，人类就进入了IT时代，现在随着基因编辑的兴起，可以说人类正式进入了BT时代，会有大量的小公司创业。


    根据我的个人经验，一个行业里面从业人员的薪水和这个行业里的创业机会会正比。以前虽然我们一直说未来是生物科学的时代，但是从事生物科学的人因为只有研究一条路，在企业当中没有太多的发展，所以薪水也不高。那现在，随着大量的BT创业公司崛起，我相信生物医药这方面的人才的薪水会有极大的改善。


    2.生物技术公司会改变传统的医药公司，尤其是传统的化学制药公司的格局。


    我在10多年以前访问过 BIO，叫Biotechnology Industry Organization，是美国最大的生物制药的协会组织。他们当时有600家会员，说除了
    一家有自己上市的新药以外，其它都是准备把自己的公司直接卖给大公司了事的。


    所以，我当时拜访他们，是想看他们对中国有没有兴趣。


    他们说，完全没有兴趣：


    因为如果他们的目的是把自己整个公司卖给大公司的话，这之前如果拆出来和中国合作了，反倒不利于他们卖给大公司。


    所以，我顺便提醒大家一声：


    现在中国有很多的企业到海外去并购外国的医药公司，当然有很多企业，说跟国外的医药公司谈了很好的合作，把某个医药的中国的专利独家授予了这个中国公司。


    其实说实话，如果一个制药公司把中国的权利单独授予给另一家公司的话，也就说明他们手里的药一定不是一流的药，因为一流的药还是想卖给大公司的，不会单独授权给中国，不会把全世界的市场拆散了，因为拆散以后，大公司就不会买了。所以这也是判断国外医药好不好一个重要的指标。


    但是，现在生物技术公司就不是卖不卖给大公司的问题了，是很有可能他们自己推产品会自己上市。


    3.生物医药公司现在有很多都会早早地上市，我们说这些公司往往有很强的技术优势。但是别忘了，虽然它们来的机会巨大，但是其实它们的风险也巨大。所以不能只从上市来判断，包括只从科技潜力来判断是不是适合投资这样的公司。


    因为人体是个复杂系统，虽然这些生物医药公司能上市，肯定是有很好的理论来支持，甚至说在实验室阶段也得到了验证。但是，人体太复杂了，再好的理论往往也只有做了临床才知道结果。尤其是有很多时候可能这个理论是起作用的，但是可能是被人体里面的另一个机理所抑制，或者中和，所以它最后的疗效未必好。


    所以，疗效好坏只有看临床。


    这样的话也就意味着，生物制药公司只要还没有出临床结果，没有被FDA报批，也都还是有巨大的风险的，所以投资的时候不要着急。


