  md: '# 三、Kiva System 的原理


    为了更深入理解 Kiva System 的交互运行方式，我找到了一篇由三位创始人合写的论文，名字是“Coordinating Hundreds of Cooperative,
    Autonomous Vehicles in Warehouses”，翻译过来是“无人仓内数百个机器人的协作”。如果你感兴趣，也可以去找来看看。


    下面我跟你分析一下它的运行原理。


    要想让整个 Kiva System 顺利运行，必须解决以下3个问题：


    +   1. 怎么让货架移动？

    2. 分拣员的位置如何确定？

    3. 机器人之间如何沟通？


    Kiva 系统采用机器人来移动货架，这种机器人其实和现在常见的扫地机器人很类似。它是一个很矮的，可以钻到货架底下，然后把货架举起来运送。这就解决了第一个问题。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_54_0.png)


    既然货架可以自由移动了，那分拣员就可以待在一个固定的地方，等待接收货物了。所以下一步，Kiva 系统做出了一个最优化的仓库结构，让分拣员的效率达到了最高，这样第二个问题也解决了。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_54_1.png)


    为了系统的顺利运转，也必须依靠对所有机器人的统一协调。


    在 Kiva 系统中，每个机器人都是独立的，但同时，这些机器人又根据订单进行统一协调，这主要就是用人工智能算法来对每一个机器人进行管理。


    在整个仓库的地面上，其实布满了许多正方形的格子，这些格子是干什么用的呢？


    它的作用是帮助机器人进行路径规划。而路径规划所使用的算法在计算机中被称为 A* 算法，英文叫 A-Star，这是一种包含自主选择的路径搜索算法。对于路径规划
    A 星算法感兴趣的朋友，可以深入了解下，我在文稿里附上了链接。


    运用这个算法，机器人就可以决定先去哪个分拣站，从而让移动路线的用时最少，最高效地把货物所在的货架从仓库搬运到人工处理区。


    有了物流机器人、新 的仓库设计以及人工智能的调度系统，Kiva 使效率提高到人工的3倍，准确率达到了99.99%。


