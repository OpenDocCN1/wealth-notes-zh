  md: '理性路径的，美国人也不都是走信仰路径的，只能说他们各自的主流是这样。即便在美国，看看它的东海岸、西海岸的那些大城市，越来越向欧洲的那种路径靠拢，就是他们也越来越有那种基于理性的观念了。


    就比如像 LGBT 这些性少数群体可以被宽容等等，这些在东海岸、西海岸的大城市都已经被认为政治正确了。但是在美国所受定的传统的南部地区比如德克萨斯等等地方，这事就是没法讨论也不容讨论的。从某种程度上说，美国南部更能代表美国的清教街传统。


    仅仅这么说一下美国和欧洲在权利来源的理解上的区别，可能你还是不知道这有啥意义，我举个例子你就清楚了。


    2015年夏天，美国最高法院作出一个判决，让同性恋婚姻在全国合法化。LGBT人士肯定欢呼雀跃，说终于美国这个堡垒被攻克了，婚姻是 LGBT 这些性少数群体本来就应该拥有的权利，终于他们也拥有了！


    值得注意的是，美国最高法院是九个大法官，他们对于所审理的案件要投票，少数服从多数，同性恋婚姻这个案例上的投票结果是四比五，有四张反对票。


    投反对票的四个大法官里面，其中有一位写的反对意见，大致的意思是这样的：


    圣经里面说了，婚姻应该是两个异性之间的结合，同性之间是不能结合的，否则就像邪恶的索多玛城一样会被毁灭。


    那么既然现在你们要用理性的反思把圣经里面那种不容讨论的东西给打掉，认为我们应该依照理性的原则把婚姻权利赋予所有人，性少数群体也不例外，所以不是非得两个异性才能结婚，同性之间也可以结婚。


    既然要以理性反思来突破信仰的禁忌，那么我接下来问你：


    为啥婚姻一定得是两个人呢？

    为啥婚姻一定得是人跟人呢？


    你用理性反思突破禁忌，往前走的边界在哪呢？


    还早你都会走到让自己感觉难以接受的地方，碰到你的禁忌，凭什么到时候就不让别的人来用理性反思突破你的禁忌呢？


    实际上到最后你会发现，要坚持逻辑一贯性的话，理性反思走到后来几乎守不住任何边界。


    反过来这也意味着，当你面对信念上的敌人时，你是沒有办法强硬起来的。因为你的敌人会用你的东西来打击你。他们会说，你不是讲理性反思讲究容吗？我跟你信念不一致你也必须得宽容我。


    基于理性反思的这种权利观，它在绝对意义上是沒有办法驳斥敌人的这样一种质疑的。而基于信仰的这种权利观，跟敌人之间就没这个讨论的空间了。什么宽容？没这事，我再宽容也宽容不到你身上，说不行就是不行。


    这么解释一下，你可能就知道美国和欧洲这两种权利观的区别了。那么这和美国的强社会有什么关联呢？关联关系非常复杂，我在这里只能从简单的一个角来解释一下。


    如果你认为你的个人权利是基于理性反思和理性推动的，那就有一个前提，理性能推导出来的东西，理性也能把它给否定掉，最终要想让这种权利稳定下来，就不得不由政府来规定个人权利的边界，社会对政府就会有比较强的依赖性。


    法国在这方面非常典型，托克维尔在《旧制度与大革命》当中的分析，往深了说都有这个意思。


    而依照美国的路数，基于上帝所赐予的个人权利，不仅轮不到政府来规定，反而政府还有可能构成对个人权利的威胁，所以社会就得想办法自我组织起来约束政府，于就是有了强社会对于政府的反制能力。


    美国与欧洲在权利念上的区别，在它们今天在国际政治上的一系列表现当中也能够看到。


    当然，要再强调一遍，我这里所说的是今天的美国和欧洲，此前的历史上并不是这样子，并且美国和欧洲内部也都有反例，我说的只不过是主流，并不排斥反例。


    # 美国清教传统的强悍精神


    再说回到两个地方在国际政治上的区别。


    国际政治学界有一句话叫做，如果你手里拿的是锤子，你看什么都像钉子，但是如果你手里拿的不是锤子，你希望啥都不是钉子。


    今天的欧洲就是这样，它手里没锤子，不仅仅是说它沒有军事力量，它各种意义上的锤子都不行了。也就是說精神上它已经把自己的锤子给卸掉了，它就希望啥都不是钉子。


    而美国正好相反过来，手里拿的是锤子，它看啥都像钉子。


    这会有什么效应呢？


    就是你会感觉美国的行事极为霸道，它经常跟你讲理。


    但从另一个角度来说，这很重要。如果世界上全都是欧洲那样的谦谦君子，碰到别的不讲理的，欧洲所许可的那套秩序不就泡汤了吗？


    在这种情况下，欧洲的身后也得站一个不讲理的，它跟欧洲有差不多的价值观，但是不允许讨价还价，谁想在这上讨价还价，它直接跟你正面硬刚，欧洲想讲的那种理，才有得可讲。


    也就是说，讲理的前提得是有人能主持这个理，而主持这个理的人，就必须有执行力，要有执行力，还真就得霸道一点，否则执行力就很差。


    美国就是提供这个执行力，而它能这么做，它最底层主题精神结构来自于什么呢？


    就是刚才我所说的，来自于美国深刻的清教精神。


    虽然美国的东、西海岸的大城市，已经越发的欧洲化了，前面的说美国最高法院支持同性恋婚姻，那么些赞成票的大法官，主要支持者就是来自这些地方。但是在美国南方的很多地方，仍然保持着一种很保守的状态。


    但恰恰是这种保守，才是美国真正的力量所在。


    美国的力量不在于去简单地弘扬什么价值，单论弘扬价值，欧洲人比美国做的漂亮得多，美国的力量在于，最终如何落实你所推崇的这个价值，这是需要美国出头的。


    奥巴马的支持者主要来自美国的东、西海岸大城市，这些地方高度国际化，越是国际化，与世界交往越多的地方，就越欧洲化，我所谓欧洲化就是指，它已经开始对人的权利进行各种理性反思，但是这种地方就不太容易保持那种非常强悍的东西。奥巴马看上去很政治正确，但这种政治正确却有可能使得他缺少某种执行力。


    而川普的支持者群体，主要就在美国非常保守的那些地方，这反而成为美国的今天的超强行动力的根基所在。这些保守的地方保持着那种强悍的东西。


    强悍跟野蛮不是一回事。野蛮是什么意思？完全隐私也不讲。强悍是指，我跟你说清楚，道儿我给你画出来了，你别踩线，咱俩啥都好说，敢踩线我就弄死你，这是强悍。


    美国的清教传统里面有着一种非常强悍的精神。


    这种精神结构里包含着一些完全不容谈判，不容挑衅的东西，你不许碰一下，碰我就弄死你。这种精神结构是中国人极为陌生的东西，但这却是我们理解美国非常必要的的一个东西，否则我们并不知道该如何恰当地与美国人打交道。


