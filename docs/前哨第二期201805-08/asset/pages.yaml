  md: '# 224 | 智慧农业：美国大豆产业背后的巨人-哈里·斯泰


    224 | 智慧农业：美国大豆产...


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 农民哈里·斯泰是如何成为美国种子大王的？

    2. 美国大豆产业为何能成为世界第一？


    在上一讲当中，我们知道了美国农业的发展是得益于两次科技革命，分别是现代机械化和生物技术的应用。


    如果我们能回到那个时候，就一定能发现，当时有不少人都看到了新趋势。但是，看到趋势是一回事，能不能抓住机会来做出一番事业，那就是另外一回事了。


    # 一、美国农民哈里·斯泰的创业故事


    这一讲，我们要介绍的就是一位有点传奇色彩的人物，美国农民哈里·斯泰（Harry Stine），不过他还有一个身份，美国斯泰种子公司，英文名叫 Stine Seed
    的老板。这家公司是美国第一家拥有大豆专利的私人公司，但它的前身，其实就是哈里·斯泰家里的小作坊。


    也因为这个，哈里·斯泰从2015年起，连续3年被《福布斯》杂志评选为爱荷华州的首富。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_62_0.png)


    顺便说下：


    爱荷华州位于美国中部，是全美的农业大州。


    回顾哈里·斯泰的创业历程，那真真正正上是白手起家。他的爷爷早年从东海岸来到爱荷华州当农民，到了20世纪50年代，他父亲创立了一家种子公司，其实也就是个家庭小作坊，主要的业务并不是经营种子，而是提供种子清理服务。


    简单地说，就是燕麦和大豆这些谷物的种子在收获以后，需要把混在其中的杂质，或者残破种子给去掉除掉。他父亲就带着自己的设备，为临近的农民清理种子。


    到了1964年，23岁的斯泰开始接手父亲的工作，他一边种地，一边四处为人清理种子。如果按照传统的轨迹，他很可能和普通美国农民一样，专心种地，再把小小的家族生意传承下去。


    但是斯泰是一个善于思考的人，他在田里经常会发现一些外形奇怪的大豆，他就在想，为什么不能把那些数量多、长得又大又饱满的大豆挑选出来，然后拿它们的种子去卖呢。


    现在看来，你可能觉得这没有什么稀奇的，这不就是最原始的育种吗？


    但是在斯泰所处的那个年代，只有在大学和政府农业部门里，才有专业的人从事农作物、果树和蔬菜的品种培育工作。在很长一段时间里，所有农民都是使用所谓的“公共种子”。也就是说，你打算种什么，就直接向大学或者农业部门要种子。当时的种子公司，也只是对这些公共种子进行简单的复制和繁殖而已，并不会像今天这样对品种进行优化改良。


    用斯泰的话来说：


    > 选种子就像选美，就是把最好的基因找出来。


    但当时基因的双螺旋结构发现也才没几年，除了有一些科学家在研究，种子公司肯定是没有怎么用心的。


    # 二、与孟山都合作转基因大豆'
