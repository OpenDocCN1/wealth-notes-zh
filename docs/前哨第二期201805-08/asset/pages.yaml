    今天是前哨大会内容复盘的第四讲，在这一讲中，我想帮助你实现两个范式转移，一个是有关于科技创新的，一个是有关于世界观的。


    完成这两个范式转移，你就会更加明白，我在上一讲中与你解读的，关于中、美、香港地区的新定位背后的逻辑，以及更好地理解下一讲的内容。


    # 一、为什么要范式转移？


    那么什么是范式转移？为什么要实现范式转移呢？


    我先给你讲个故事：


    刚刚过世的著名天体物理学家斯蒂芬·霍金的著作《时间简史》是这样开头的：一信仰名的科学家，据说是伯特兰·罗素，曾经做过一次天文学讲座。他描述了地球是怎么围着太阳转的，太阳又是这么围着我们称之为星系的巨大恒星群的中心转的。


    演讲结束的时候，坐在后排的一位小个子老太太站起来说：


    > 你这都是胡扯，世界是趴在大乌龟背上的一块平板。


    这位科学家很有教养地笑着问老太太：


    > 那这只乌龟是站在什么上面呢？


    “你很聪明，年轻人”，老太太说：


    > 不过，很显然，这是一只趴着一只，一直趴下去的乌龟塔啊！


    # 二、科技创新的新格局


    第一个要实现的范式转移，就是科技创新的新格局：


    我们前哨有句话：

    一切不谈产业化时点的黑科技都是要流氓。'
