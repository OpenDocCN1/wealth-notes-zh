  md: '# 250 | 智能制造：革命性技术 “金属3D打印”


    250 | 智能制造：金属 3D 打印。 ↓


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 金属 3D 打印是如何实现的？

    2. 金属 3D 打印能用在哪些领域？

    3. 金属 3D 打印将带来哪些影响？


    先说个老新闻，在2018年2月21日，《麻省理工科技评论》发布了2018年“全球十大突破性技术”，其中就有“金属 3D 打印”。


    为什么金属 3D 打印如此重要呢？


    因为工业中大量应用的器件都是由金属构成的，而目前的 3D 打印主要使用塑料，PLA 和 ABS，这两种材料都是热塑性塑料，也就是说加热会变软，冷却后会快速变硬。


    目前大家倾向于用 PLA，它是一种新型环保的塑料，环境压力小，打印时没有 ABS 那样刺鼻的气味，本身也是透明的，能加入各种颜色。但因都是塑料，材料的强度很难满足工业需求。如果能直接使用
    3D 打印技术制造金属元件，这将会革命性地改变整个工业设计和制造流程。


    3D 打印相信你已经很熟悉了，就是指直接打印三维物体的技术。它也有一个别名叫“增材制造”，原理就是，设计 3D 物件图纹，通过 3D 打印机，以层为单位，逐层把原材料按照事先设计的形状叠加粘接的过程。


    它的优势在于，可以实现复杂几何形状的小规模物件的制造。而传统采用的是“模具式”制造，但是当制造复杂物件时，模具设计成本很高，如果制造规模不够大的话，单件的生产成本也会很高。


    而金属 3D 打印，就是以金属粉末为原材料进行的 3D 打印，把创造和制造两个重要环节高效结合起来。


    # 一、独角兽 Desktop Metal


    这一讲，我要跟你介绍的就是，桌面金属 3D 打印领域的创业公司 Desktop Metal，所谓“桌面打印”，很容易理解，就是价格更亲民，使用更便利。


    这家公司成立于2015年，在短短的3年之内，就成为了金属 3D 打印领域的独角兽，估值超过10亿美金。它的融资之路可以说是平青青云，一帆风顺。自2015年
    A 轮融资以来，这家公司已经融到了2.77亿美金，其中的投资者有亚马 iVenture、Google、通用电气以及福特公司等。当然，宝马、Google 也是他们的客户。


    为什么这家公司会受到资本的关注呢？


    这就要从它的创始人团队说起了。可以说，Desktop Metal 的初始创业团队又验证了我强调的“积木式创新”。


    首先是一个明星级的 CEO，叫 Ric Fulop，他2008年曾获得 MIT 技术评论“35 under 35”的奖项，这个奖每年颁布一次，主要奖励35年年齡在35岁以下的创业精英。


    其次，Desktop Metal 的初始创业团队还有4个 MIT 的教授，分别是 Ely Sachs、Chris Schuh、蒋业明与 John Hart。


    其中的 Ely Sachs 教授正是 3D 打印概念的最早提出者。其实早在上世纪90年代初，MIT 的教授和学生们就已经开始尝试使用各种方法去打印复杂结构了。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_125_0.png)


    你可能觉得现在 3D 打印个东西已经不算难了，但我告诉你，人家是在1995年到1996年间做到的，而中国国内直到几年前，3D 打印的概念才算火起来。


    Ely Sachs 教授可以说是 3D 打印领域的奠基者。他率先提出了“按层打印”的理念，这在现在已经成为了 3D 打印的基本原理。并且，他还提出了最早的
    3D 打印技术粘接剂，喷射印刷（Binder Jetting Printing）。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_125_1.png)


    首先，3D打印机的喷头会向工作平台上喷洒粉末形成一个薄层。然后，一个类似喷墨打印机喷嘴的装置会按照事先设定的 3D 模型，在规定的区域喷洒液态的粘接剂，可以帮助将粉末凝聚在一起，涂完一层之后，喷头会再次向平台喷洒一层粉末。


    这样利用“逐层叠加”，就可以制作出各种复杂形状的 3D 物件了。


    目前，Ely Sachs 教授在 3D 打印领域已经拥有超过40个专利，由于对3D打印技术的卓越贡献，2016年他还成为了美国工程院院士。


    说完科学家我们说企业家，Desktop Metal 的 CEO Ric Fulop，他是一位连续创业者，在16岁就创办了自己的第一家企业。而他创办的最成功的一家企业，是2001年与
    MIT 教授蒋业明合作的 A123。这是一家锂离子电池领域的新兴企业。


    2001年 Ric 看到了电池及其在未来清洁能源领域的巨大应用前景，他花费了几个月时间翻阅学术期刊、参加会议，还不断地去大学技术转移中心去询问电池领域的新进展。


    在查阅资料的过程中，他发现在 MIT 有一位教授名叫蒋业明，他研发出了一种基于纳米技术的锂离子电池。Ric 认为这项技术如果得以产品化，将创造巨大的价值。因此他找到蒋业明，在首次见面时，Ric
    就成功说服蒋业明和他一起创办一家新公司，名为 A123。2012年，A123 被孚美集团收购了。


    2010年，Ric 离开了 A123，转而加入北桥资本（North Bridge Capital），把自己的身份从创业者转变为投资人。在建立 Desktop
    Metal 之前，Ric 是北桥资本的合伙人。其实，在北桥的5年当中，Ric 也参与了许多有关 3D 打印的投资项目，例如 3D 打印机制造商 Onshape
    和 MarkForged 的 A 轮融资，以及 3D 建模软件建造商 Solidworks、ProtoLabs 等的 A 轮融资。


    之所以选择 3D 打印，特别是金属 3D 打印这个领域，是因为 Ric 发现当时金属 3D 打印机器的造价十分昂贵，一台要将近100万美金。而如果研发桌面用的金属
    3D 打印机，会具有十分诱人的市场前景，Desktop Metal 公司近期推出的 Studio 打印机，售价不到5万美元。


    # 二、金属 3D 打印技术


    说完创始人团队，我们来了解下 Desktop Metal 的主要产品和特点。


    其实他们的产品主要就是两类：


    +   一类是用于工程师原型研发与小规模制造的金属 3D 打印机 Studio System；

    另一类是用于大规模制造的金属 3D 打印的 Production Sytem。


    Studio System 是第一款适用于办公环境快速成型应用的桌面型金属 3D 打印系统，包括打印机、脱模机和烧结炉，可在办公环境或工厂车间，生产复杂且高品质的金属
    3D 打印部件，用于打印的金属种类多达200多种合金。


    整个打印过程分为四个阶段：


    +   第一阶段，是将物件的 3D 数字模型上传到网络上，这个平台会自动添加底座以及生成相关工艺控制参数；

    第二阶段，就是通过金属粉末以及高分子材料对物件进行逐层打印；

    第三阶段，是将初步打印好的物件浸泡到一个自主研发的“特殊液体”当中，这个液体/val 等。'
