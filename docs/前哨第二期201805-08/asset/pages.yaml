    相信不少同学都体验过 Amazon Prime 的服务，这是一个类似与“会员式”的服务。亚马逊每年向用户收取79美元以后，承诺所有商品下单后两天之内送货上门。


    为了履行这个承诺，亚马逊就必须提高从仓储到物流配送整个环节的效率。


    讲个小故事：


    2017年11月初我们组织投资考察团去美国的时候，有个团员，到美国后给女儿在戴森官网买了个吹风机，又在亚马逊上下单买了爱因斯坦小机器人。结果2天后，在入住的酒店前台，他顺利拿到了爱因斯坦小机器人。但是在戴森官网买的吹风机，一直農到离开美国，回中国后都还没送到。几次电话询问，得到的回复是周末大家都休息，想想国内电商的配送速度，这样的答复真是让人有些无话。


    同样是在美国，各个企业的劳工政策应该都差不多，那为什么亚马逊物流能做到这么高效呢？


    原因其实很简单，因为亚马逊用机器人进行了仓库管理和物流运输。


    为了达到这个目标，亚马逊早在2012年就花费7.75亿美元收购了 Kiva System 公司，并改名为 Amazon Robotics。


    # 一、亚马逊收购 Kiva System


    首先我们要讲的是，为什么亚马逊要收购 Kiva System 呢？


