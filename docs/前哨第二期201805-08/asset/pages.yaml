- pgno: 139
  md: '通讯技术将创造出无线想象空间。


    # 三、平台级的机会


    最后要说一下，在 5G 这个大潮流里，谁最有可能拥有平台级的机会？


    我们认为，应该不是硬件提供商、不是移动通讯运营商，虽然现在宣传 5G 的主要是他们。有可能是云平台提供者，有可能是某个体量很大的应用的提供者，但更可能为应用提供全面支持的服务商。


    国外苹果的机会依然很大，因为他们为应用开发提供了很好的环境。


    而在国内，我们最看好的是云测，目前它是国内最大的“移动应用云测试”服务平台，主要提供 App 测试、安全、效率管理、推广和用户分析等服务。


    简单说来，你在使用 App 的时候，都遇到过各种各样的问题：


    比如有些页面点击了却打不开，有些 App 到了特定页面就突然自己关了，这叫闪退了，出现这些现象时就表明这个 App 有问题。


    保证你能流畅地使用像微信、滴滴出行等这些日常见不开的手机 App，就需要挨个进行测试。


    这事情听起来挺简单的，但是要知道，手机 App 测试是要在市面上出现过的超过 4500种型号的每台手机上都进行测试。这就不是一件简单的事了。对于企业来说，如果要测试的话，需要买齐所有型号的手机，耗费大量人力、物力和财力。


    云测是如何做的呢？


    就是把所有型号的手机都买来，把它们部署在网上，你只需要把应用上传到平台上，选择需要测试的手机型号，可以是1款，也可以是1000款。选好后，平台通过人工智能的方式，自动测试完成。你到外面抽根烟或吃顿饭的工夫，就可以看到测试报告了。而且，还可以把一些测试任务放到网上，发动大众来给作测试，这种模式叫众测，也就是常说的共享经济。


    6年多来，在云测平台上测试的 App 有多少呢？


    按照中国目前250万个 App 计算，其中有 230万个是云测平台测试过。


    表面看起来，云测做的只是测试，其实它已经为移动应用开发提供了一整套完整的支持环境，从应用开发、功能接口调用、上线测试到数据监测和分析，能够帮助用户的 App
    做得更好、更快、更便宜，也形成了一个小生态，帮助移动应用需求方、开发者、测试者更加紧密地合作。


    所以，大家都想做平台，而云测却实实在在做到了，原因很简单，就在于他们从人人需要，但却都不想自己干的苦活累活，也就是应用测试做起，形成了规模效益。


    在 5G 推动下，应用会呈现指数级增长。我说过，5G 就像修了一条智能化的高速公路。没有车在上面跑，高速公路也终将荒芜，而车就是平台上的各种应用。云测正好是这样一个“5G
    应用全程服务平台”。


    此外，到时平台测试的效率也会随着 5G 通讯技术的发展而大幅度提升，更重要的是，平台将会积累海量的应用数据，利用人工智能优化应用设计，构建大数据生态。


    所以我认为，云测的未来会越来越好。


    周其仁老师提倡的创新上行下行中的创新下行，很符合当下的场景。


    现在 5G 通讯技术正在不断完善中，正是迅速寻找需求和提前布局的时候，建议各个从事传统行业的人，深入思考一下 5G 这个大机会能不能解决行业痛点，然后把它发掘出来，尝试提出创造性的解决方案。


    而从事创意产业的，现在就是考验你创造力的时候了，在 5G 时代下，智文娱将呈现更智能、更有趣、更丰富的全新面貌。


    # ——▶ 课程小结 ◀——


