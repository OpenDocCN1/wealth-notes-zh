    2.智能化是玩具未来发展的方向。让孩子提前接触编程的环境，尽早和智能玩具互动，既能保持孩子对未知世界的好奇心，又能提高人类的机器智商，增强在未来社会的竞争力。寓教于乐的智能玩具已经具备了多种功能，从智能探索、交流互动到教育学习，孩子可以在互动中全面训练智力、认知能力和社交能力。


    3.玩具市场的核心是设计和创新，这就涉及到利用现有的IP，像Sphero和迪斯尼合作推出BB-8，或者在设计上加强创新，像乐高和索尼，不过不要忘了玩具还需要物美价廉，这时候中国的玩具制造企业的优势正好和设计企业能够互补，所以优秀的玩具设计企业千万别忘了用好玩具制造这块中国的长板。


