  md: '# 2018（秋）苹果大会解读 | 小改善才有大突破


    2018（秋）苹果大会解读 | …


    2018年的苹果大会我今天全程看了直播，大会不到两小时就结束了，尽管推出了满足中国人需求的双卡双待手机，但是精彩程度远远没有去年激动人心。去年的发布会，Apple
    Watch 第一次发布了电话功能，Apple TV 有了 4K 版。


    最重要的是，原来乔布斯做发布会的时候的保留节目，就是把最重要的产品放到最后发布，事先先要先说一句 One More Thing，去年就是发布了 Tim Cook
    自称会重新定义未来十年手机发展方向的 iPhone X。


    去年虽然库克这么说，很多人还是不相信。但我是相信的，也公开说过 iPhone X 是革命，因为 iPhone X 有很多了不起的进步。


    今年库克在会上宣布了，iPhone X 是全球销量最好的智能手机，虽然苹果没有公布具体数字，但据专家估计销量超过6千万部，而且达到了98%的客户满意度，是手机行业的第一名。


    今年发布会主要推出了 Apple Watch 4，但没了 Apple TV，iPhone 也只是预期中的升级，推出了 iPhone X 的几个升级款：iPhone
    XR、iPhone XS 和 iPhone XS Max。


    # 2018苹果发布会有三大看点：


    第一，苹果在健康领域持续发力，已经有了大公司的模样。


    今年发布 Apple Watch 4 有了心电检测功能，而且通过了 FDA（美国药品管理局）认证。我认为 Apple Watch 很有可能会继 iPhone
    和 iPad 之后，成为苹果举足轻重的核心产品系列，而且未来苹果一定是健康管理领域举足轻大的大公司，甚至是垄断性的巨头。


    2018年4月22日前喀大会，我展示过一款可以检测心电图的 Apple Watch 表带，是一家叫 AliveCor 的公司生产的。现在 Apple Watch
    4 就自带这个功能了，抢了 AliveCor 的生意了。


    现在 FDA 也顺应形势，对可穿戴式设备的审查在放宽，使得更多可穿戴设备能够很方便地进行健康数据的收集、分析和服务提供。在这个大环境之下，苹果肯定是愿意自己做健康可穿戴设备，而不是选择把别人的产品集成到自己的产品里面去。所以，我觉得
    AliveCor 公司的未来很堪忧了。


    这是我们一直强调的，小公司不要在大公司的护城河边上创业，因为很容易被人替代。创业者要集中在更前沿的科技上，要有壁垒，在别人的护城河边上创业，是很危险的。


    现在看起来，苹果已经把健康当成自己的主业了，在健康上会持续发力。


    我认为，除了心电检测功能，未来会有更多健康医疗新功能在 Apple Watch 上出现。未来苹果手表的医疗健康性能会大大加强，尤其其穿戴数据结合人工智能的算法，未来大有可为，我认为这个机会是非常巨大的。


    所以，我认为苹果未来会成为健康领域的领军企业之一。Apple Watch 未来能够形成对用户进行健康的跟踪和分析。


    苹果自己也在发布会上说，以前的健康都只是对过去的情况做分析，未来苹果更强调的是预测，对健康提供预测性保护，成为人类健康的保护神。


    我觉得这是一个非常棒的理想，也是一个崭新的领域。所以现在看起来，苹果虽然已经到万亿美金市值了，但未来的发展依然还是很值得期待的。


    另外，从形式上，我认为苹果手表 Apple Watch 加上无线耳机 AirPods 的组合，非常亮眼。尤其是 Apple Watch 的计算能力上来了，再加上能够进行网络连接，可以借助云端的人工智能处理能力，具备了替代手机的可能性。而手表+无线耳机的组合在方便性上大大超过了手机。所以我认为手表与无线耳机的组合，可能会成为手机的终结者。


    也就是说，未来慢慢会越来越多的 人只戴智能手表，不用再带手机了。


    # 第二，苹果通过计算能力打造创新赋能平台。


    苹果正在慢慢变成一个为科技创新应用，甚至很多行业解决方案赋能的平台。


    现在各大 IT 公司，都希望打造自己的平台，为他人创新赋能。因为未来会诞生哪些创新，是很难事先预判的，帮助别人创新是一个很好的做法。


    人工智能加云计算很容易构建起一个平台，谷歌、Facebook、亚马逊，包括苹果都在这么做，那苹果的核心优势在哪呢？


    我认为，苹果的优势就在于它有本地的硬件支持，尤其是移动的硬件，因为里面布满了各种传感器。


    今年苹果大会最亮眼的一个展示，是 HomeCourt 公司利用苹果人工智能的计算能力和增强现实技术打造了一款同名的篮球 App，利用一个手机就能够帮助职业或业余球员进行篮球训练。


    +   这个应用场景体现了苹果手机两方面的能力：

    - 一方面当然是计算能力了；

    - 另一方面是苹果的增强现实技术能力。


    # 第三，“硬件即订阅”是服务的终极形态。


    今年的大会上，还有一个不算最新，但是对未来影响巨大、值得强烈关注的点。


    早在今年4月份地球日之前，苹果发布了一个项目，叫做 Apple GiveBack。这是一个带有环保性质的回收项目，你可以拒旧'
