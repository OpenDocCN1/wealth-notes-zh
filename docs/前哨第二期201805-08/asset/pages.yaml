    就是我投资的 WiTricity 公司，他们是做无线充电的。很多大车厂推出新车型，往往会提前3到5年作规划，这就给行业敏感者一个信号，一个车型就代表随后3到5年的汽车技术趋势。


    WiTricity 看到各大车厂开始推出电动车，就猜提到电动车发展的大趋势。你知道，对于电动车来说，电池和充电技术是最重要的两个因素。


    WiTricity 立马意识到这肯定会是无线充电的大市场。所以他们加紧推出了无线充电的方案：在停车地面上安装充电耿，并通过磁共振技术，把电力无线传输到停放在充电位置上的车辆。这套方案不仅充电效率高，而且能匹配多种车型。


    WiTricity 公司早在三四年前就和各大车厂达成了战略合作，比如宝马和保时捷，现在这些车就慢慢推向市场了，比如最近推出来的宝马5系的 530E 就带有无线充电，还有将在2019年底推出的保时捷的
    Mission E 电动车，也是有无线充电功能的。


    你可能会说，我就是一个普通人，太跟深的技术内容我看不懂，也没有大公司发展策略的内部消息，那我该怎么做呢？


    是不是只有专业人士才能捕捉到科技的提前量呢？


    当然不是。


    我每年1月都会组织大家去美国拉斯维加斯考察国际消费电子产品展，也就是 CES，那就是一个展示科技创新提前量的好地方，而且 CES 很务实，展示的科技产品，基本就预示了未来一两年，最多是三五年的市场趋势。


    这里强调一句：


    我们评价一个科技趋势好不好，都不应该只关注眼前的现状，而要着眼于未来3到5年发展的提前量。也就是说，要站对跑道，根据未来趋势来布局当下的业务。


    # 四、勇于尝试进入新领域


    那在捕捉到科技的提前量之后，就要看你的行动了。这个新科技可以是与你在的领域相关的，也可以是与你在的领域互补的，有机会就要多尝试，因为多一次尝试，就多一次技术储备，这就好比在土壤里多种了一些不同的种子，以后面对未知的
    confirmed 性，你的风险就能降低很多。


    在“智慧农业”模块，我们讲到了美国斯泰种业的创始人哈利·斯泰，他是转基因作物的最早尝试者，他研发的高产大豆占据全美90%的市场，每年通过授权专利就能获得大量收益。但他并不满足，在70岁的时候，还在尝试培育高密度生长的玉米品种，希望美国的玉米产量能够翻番。


    哈利·斯泰的每一次创新都是基于行业的深刻认识，并且保持开放心态，勇于尝试当时最新的技术，因为只有积极尝试，才有可能延续自己的竞争优势。


    这就是我们所提倡的，创新者要有套上“红舞鞋”一直不停跳舞的精神。


    无论你从事什么行业，你都需要从现在起，建立起预测趋势、提前布局的思维习惯。


    如果你处于传统行业，那你不仅要思考现有技术如何更好地解决行业痛点，还要密切跟踪未来3到5年的科技动态。如果你处于科技领域，更要紧盯科技前沿和基础研究的突破成果，这样才能够有弯道超车可能性。


    # —— 课程小结 ——


    最后我们总结一下，这一讲我为你分析了科技发展的规律，通过重视科技提前量和尝试新领域，在思维上为全球科技创新做好准备。希望你能掌握以下三点：


    第一，科技创新有自身逐渐成熟的过程，科技创新向来不会一帆风顺，科技最后能被社会接受，往往需要经历科技、产品、市场、社会扩散阶段。所以需要你持有包容、开放的心态去接受新技术。


    第二，要重视把握科技发展的提前量，别人今天的优势是5到8年前开始投入研发换来的，反之，看到别人今天的成果才想参与，早已错过机会。所以需要你保持对科技的敏感度，就能及时捕捉到最新信息，并通过它来预知新科技的大趋势，并且自己提前做好布局。


    第三，面对未来的科技竞争，需要你有全面布局的能力，甚至可以尝试进入新领域，这个新领域可以是与你本行业相关的，也可以是与你行业互补的，提前做好科技储备，因为最后的胜出者，往往是业内最懂得运用先进科技的企业。


