    1.旅游的需求是经济发展和社会进步决定的，但如何更好地满足需求则是科技决定的，旅游产业发展的每个阶段，当时的技术能力都提供了对产业的独持支持，从互联网时代的效率提升，到社交网络时代的品质提升，再到未来的以手机为核心的各种业务，支持更多虚实叠加的实时互动。


