    # 10）精准医疗


    1.就是2015年美国和中国相继启动了政府级别的精准医疗计划，这说明从全球的角度看，精准医疗的机会来了。


    2.精准医疗的基础，是对人类基因组的深入了解，在这个基础上，在基因层面上面我们就可以进一步理解致病的机理，就可能对因下药，做到同病异治，也就是相同病，表现型相同，但是基因型不同，因此要用不同的药物来治疗。或者异病同治，也就是说疾病在不同的病灶，不同的器官，但实际上是同一个基因的问题导致的，所以可以用同一个药，现在也有一些药品已经纷纷上市了。


    3.我们对基因组变异的致病机理的了解还很肤浅，离真正解决问题路还很长。因此，如果要创业的话，最好是要选择特定领域，建立强大的数据收集体系，辅以人工智能的分析，再提出针针对性的解决方案。但是，这个市场机会确实是非常大的。


    # 索引和关键词概念词典：


    +   046： “量身定制的个性化医疗”

    047： “迈向精准医疗的第一步”

    048： “药物市场化的长周期”

    049： “精准医疗的 ‘精准’ 问题”

