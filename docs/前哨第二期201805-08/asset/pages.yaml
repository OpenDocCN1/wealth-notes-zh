  md: '# 199 | 前哨大会复盘：如何识别伪趋势


    199 | 前哨大会复盘：如何...


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下2个重点：


    +   1. 当下科技发展中的四个伪趋势。

    2. 识别伪趋势的方法论。


    在上一讲中，我为你解读了十大科技趋势，这一讲，我继续为你解读那些不是趋势的趋势，也就是那些<|message|> 过分乐观的领域，以及未来可能的变化数，也就是那些也许会有意外惊喜的领域。


    # 伪趋势一：区块链


    现在区块链特别火，连大妈们都在谈了，但是我们还是坚持这个观点，火的东西未必是趋势。


    区块链技术被认为是继蒸汽机、电力、互联网之后的颠覆性创新，可是这个颠覆性的地位，并不是大妈们真正参数的，真正吸引大妈们的叫做ICO，俗称发币。


    # 伪趋势二：新零售


    我 avances 《全球创新260讲》里，用了一整周的时间，为你解读了新零售的发展趋势和机会，同时也强调了，所谓新零售的本质还是零售，要探索零售的发展趋势，关键是要探索未来人们的生活会出现什么场景。


    就是吴声老师说的那句话：场景得先想清楚。


    # 伪趋势三：人工智能创业


    我 在上一讲也为你分析过了，人工智能的一个趋势是大公司将继续在人工智能上布局，占据平台的优势。第二个趋势是，各个行业会利用人工智能来提升自己的能力，但是这种机会是属于行业的，如果你已经在行业里深耕很多年了，正好可以帮助人工智能做起来。


    # 伪趋势四：虚拟现实


    虚拟现实的机会还没有到来，还要再稍微等一等，而混合现实，反而会有市场。


    2018年3月底，刚刚全球上映就创造了票房记录的大片《头号玩家》，讲述了一个发生在未来的虚拟现实世界里的故事。电影场景很震撼，但是如果要实现电影中的场景，估计还要等至少10年8年。


    # 两个值得期待的突破


    听完我为你讲的四个伪趋势，不知道你有什么启发？有些时候，并不是看到热门的词汇，就要去追逐的。


    > 有些技术发展着发展着，就遇到瓶颈了，几十年都解决不了，而有些技术，原来并不起眼，但是有一夜之间就突破了，会对社会带来巨大影响，而我们也不知道这个突破在哪一天出现，但是我们有理由预期，科技将会给我们带来意外的惊喜。'
