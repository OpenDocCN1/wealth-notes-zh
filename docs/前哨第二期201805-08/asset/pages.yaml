    254 | 5G通讯技术: AR迎来...


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 为什么 Meta 的 AR 眼镜值得我们关注？

    2. AR 技术能为我们的生活、工作带来哪些改变？

    3. 现阶段 AR 技术面临哪些瓶颈？


    第一讲，我讲到当 5G 时代来临2678时，由于高带宽和低延迟的特性，增强现实和虚拟现实技术的应用将会有突破性的增长。


    这一讲，我跟你介绍的人物就是 AR 领域的先行者，美国增强现实科技公司 Meta 的 CEO，以色列人 Meron Gribetz。他在 2016 年获得了麻省理工科学院评论“35个35岁以下创新者”的头衔。


    说到 AR 眼镜，你会立即想到 Magic Leap 或者 HoloLens。


    你知道，Magic Leap 自成立 8 年以来，融资超过 20 亿美元，但是目前还没有商业化产品落地。7 月 12 日，它完成了 D 轮股权融资，还宣布
    Magic Leap One 的开发者版将ทย与近期面世，让我们拭目以待。


    而从产品角度来说，Meta 的第二代产品 Meta 2 的分辨率是 HoloLens 的 4 倍，也就是可以提供更精细的视觉体验。此外，Meta 2 的视角是
    90 度，HoloLens 的只有 30 度，而视角大小对虚拟场景的体验会产生直接影响。


    Meron 本人的创业经历，也是“创新上行”模式的实例，当产生小创意以后，充分利用各种众筹和孵化平台，在创业的每个阶段，都找到需要的长板进行对接，从而最终实现产品研发和商业化。


    下面我跟你聊下他的创业故事。


    # 一、AR领域的先行者-Meron Gribetz


    Meron 出生在以色列，曾服役于以色列国防军情报机构的技术部门。


    我在可再生能源模块中介绍太阳能光伏领570 Guy Sella 就时说过，只有以色列军队里最优秀的人，才会被选中进入技术部门。而从以色列国防军退役的军人，不少都成为科技领域成功的创业者，Meron
    也不例外。


    参加过我们组织的 2017 年 CES 展的朋友可能有印象，Meta 公司开发的 AR 眼镜在那次展上亮过相。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_134_0.png)


    那么，Meron 是如何产生这个创意的呢？


    这要从一次 TED 演讲说起。2009 年，Meron 进入哥伦比亚大学学习计算机科学和神经科学。在哥大求学时，Meron 偶然看到了 MIT 印度裔工程师
    Pranav Mistry 的 TED 演讲。


    在这个演讲中，Pranav 展示了一种手势操纵设备，可以运用双手对虚拟物体进行操纵，Pranav 演示了如何使用手势与外界进行交互。


    例如将双手在眼前握成一个长方形，就能将长方形内的景色拍下来。这项技术深深地震撼了 Meron。


    在一次采访中他说：


    > 这个演讲让我对于人机交互有了全新的理解。


    于是，他就开始思考如何开创一种全新的

    人机交互模式。


    如果你还记得的话，我们在 2017 年 8 月 1 日讲混合现实模块时，有一讲专门介绍了 Pranav Mistry 和他的发明，有兴趣的话可以去来复习一下。


    2011 年的一天晚上，Meron 和朋友在酒吧喝酒，正跟朋友讲述他对激光投影技术的理解，讨论这项技术将会如何取代目前的人机交互系统。


    Meron 正讲到兴头上时，朋友的手机突然亮了起来。和大多数人一样，他的朋友下意识地去看手机上的信息并开始回复。被忽略的 Meron 无奈环顾四周，看见酒吧里有一个人拿着手机正在向其他人展示
    Instagram 上的一些搞笑图片。


    这个情景让他意识到，物理屏幕的存在，分隔了虚拟与真实世界。


    受到演讲的启发，Meron 认为，真实与虚拟两个世界应该合二为一，技术应该用来拓展人类的感知维度，并且更容易地让两者连接在一起。因此，他决定动手创造一种更加自然的人机交互方式。


    很幸运的是，Meron 在哥伦比亚大学的指导老师是计算机系的教授 Steve Feiner。


    Feiner 教授是增强现实领域的先驱。在 1996 年，Feiner 教授的团队运用镜片以及 GPS 定位器开发设计了第一款户外 AR 设备，并率先将其运用到旅游、新闻、建筑等不同领域当中。他同时还是哥伦比亚大学计算机图形学与用户界面实验室的主任。


    在 Feiner 教授的引导下，Meron 进入了 AR 的技术世界。AR 的全称是 Augment Reality, 中文是增强现实，就是将虚拟世界的信息叠加到现实世界中的技术。


    在教授的指导下，他用 Epson 公司的 3D 眼镜，把 Intel 生产的一个用来追踪手势运动的照相机放到 3D 眼镜上，再安装上其他配件，开发了第一款
    AR 眼镜。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_134_1.png)


    用现在的眼光看起来，确实非常简陋，根本称不上是一款产品。


    但是，这个眼镜对于 Meron 的创业之路却非常 richieste，随后在 2012 年，他创立了 Meta，总部设在美国湾区的 Redwood City。


    # 二、众筹开启商业化之路


    在开发了第一款 AR 眼镜的样品之后，Meron 就面临如何实现商业化、缺乏启动资金等问题。


    2013 年的 5 月，他在 Kickstarter 上开始为开发 Meta 的第一代产品 Meta 1 发起众筹。当时他的想法是：


    > 如果这款产品能引起大家的关注，那么证明存在切切需求，说不定还能解决前期开发费用。通过众筹还能获得产品反馈与建议，这样可以帮我更好地进行产品改进。


    其实他的做法很符合“最小可用品”的原则，也就是说，先放出能满足最基本功能的产品，不断接受用户反馈，快速迭代，直到做出真正符合需求的好产品为止。


    发起众筹后，Meron 和他的同学就在宿舍内盯着电脑屏幕。很快第一笔订单出现了，购买者是伦敦的 ARUP 公司，这是一家跨国建筑设计公司。接着，第二笔订单显示在计算机屏幕上，居然是苹果公司联合创始人史蒂夫·沃兹尼亚克，他成为了
    Meta 1 的第二位用户。


    当众筹结束后，总共有超过 500 名资助者。他们最终获得了将近 20 万美元，金额是预期筹款的两倍。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_134_2.png)


    众筹大获成功后，2013 年 8 月，Meta 公司被美国孵化器 Y Combinator 加入到种子加速计划当中，并取得了 100 万美元的天使投资。利用这几次的融资，公司获得了产品研发和推广的资金。


    一年之后，在旧金山 TechCrunch Disrupt'
