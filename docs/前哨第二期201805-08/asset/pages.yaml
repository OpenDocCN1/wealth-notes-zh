  md: '混合动力确实是一个很好的过渡方案，但成熟技术掌握在国外巨头手中，自主研发成本高，而且中国的充电设施还在高速完善，一旦布局完整，混合动力的市场就很难再扩大了。


    # 第二个趋势，是电动汽车正在逐步适应市场需求，替代传统燃油汽车的电动车会从大城市和特定领域开始逐步推广。


    目前主要还是在一线城市普及，接下来会逐渐在二、三线城市形成市场。而有中国特色的低速电动车在城乡得到了广泛应用，但需要规范标准，加强安全保障等相关配套体系，同时低速电动车企业也要有更强的科技升级能力，和电动车的前沿科技接轨。


    另外值得注意的是，电动汽车在特定领域的应用其实更容易落地，比如比亚迪的纯电动巴士K9，在城市路况下，一次充电能够行驶250公里的路程，虽然它续航不算远，但公交车有固定的调度站，一条线路至少有10几辆车可以轮换充电，尤其是比亚迪自主研发的磷酸铁锂电池虽然在能量密度上不如三元锂电池，但在安全性、耐高温、电池寿命等方面都有一定优势，在城市公交以及各种市政车辆上有一定的市场。


    在2017年10月的时候，日本冲绳的 Ships Agency 公司就购买了10台比亚迪 K9，用来做往返游轮码头的摆渡车。不过从长期看，跟上电池技术的发展还是电动车企业的必然选择，前一阵盛传的被董明珠力挺的珠海银隆经营出现困境，和他们的电池续航里程短，但片面强调适合做公共汽车的特定用途是相关的。


    # 第三个趋势，是电动汽车在电池技术在可用度上已经不存在瓶颈，只需要在能量密度，续航能力上不断提高就好了。


    比如现在特斯拉的电池有100kwh，也就是100度电，一般正常使用续航能在500公里左右，这已经是主流家用轿车的水准，其它车企也会慢慢达到这个水平。


    所以目前各大电池公司，都在改进各种电池电极、电解液等技术，来达到既可以提高能量密度，也就是电池电力的储存能力，同时也能提高功率密度，也就是电池的快速充电和放电能力的目标。


    # 六、氢燃料电池技术


    在这一讲的最后，关于新能源汽车，还有一点必须讲的，就是氢燃料电池技术。


    刚才我明确说了，电动是方向，氢燃料电池等其它清洁能源技术恐怕难以普及，但是，你最好要知道原因，对氢燃料电池技术也有所了解。


    所谓氢燃料电池，你听，它有“电池”这两个字，所以它实际上是先用氢气发生化学反应发电，然后再用电驱动电机为汽车提供动力，这跟很多人想象中的燃烧氢气驱动汽车可很不一样。


    可以说，氢燃料汽车兼顾了燃油车和纯电动车的优势，因为给汽车充氢跟加油差不多，而驱动车辆前行的还是电。


    目前来讲，日本是全球燃料电池产业化最成熟的国家，比如丰田的氢燃料电池车 Mirai，只需3分钟，氢气就能充满两个储氢罐，续航在500公里以上。而目前纯电动汽车一般快充模式也要30-40分钟充到80%而已。


    在2018年6月的 CES 亚洲展上，现代汽车也展示了名叫 NEXO 的氢燃料无人驾驶车，充氢只需要5分钟，续航里程能达到800公里。


    但是，氢燃料电池大规模应用比纯电动汽车要难得多，电网本身就很完善，所以充电网络相对容易布置，而氢燃料电池要用到的氢气，从制氢、运输，到加氢站的基础建设都需要巨大的资本投入，氢燃料还存在安全可靠性的问题。


    另外，现阶段的氢燃料汽车的整体系统过于复杂，比如储氢罐的体积<|message|> 燃油车的油箱大2到3倍，燃料电池、储能电池、电机这些加在一起甚至比“燃油发动机+变速箱”那一套还要大一些，结果就造成燃料电池汽车的车内空间更小，在技术上还有待继续进步。


    # —— ◆ 课程小结 ◆ ——


    这一讲，我们通过对比美国、德国新能源车市场，重点分析了中国的新能源车市场和发展趋势，希望你掌握以下几点：


    第一，美国和德国一般政府不干预市场运行，企业经营以市场需求为导向，传统燃油车的市场主导地位依然稳固，充电相关设备建设进度缓慢。而中国，出于环保压力和对创新的支持，由政府牵头，强力主导推动电动车产业的发展，无论在优惠政策、技术，还是在相关配套设备建设上，都走在了世界前列。


    这也是国外车企与中国车企合作，造车新势力与传统车企合作的重要出发点，这种模式符合我们所说的“积木式创新”原理。如何更好地扶植新兴产业，产业、市  场、资本、政府各自该如何定位，值得我们在全球的角度不断地总结完善。


    第二，中国电动车产业在全面开花，替代传统燃油汽车的电动车主要集中在一线城市，后续会逐渐推广到二、三线城市，而有中国特色的低速电动车在城乡得到了广泛应用。同时，电动车+自动驾驶，也会创造很多新场景。不仅应用范围在扩大，电池技术在能量密度，续航能力上也在不断提高。


    创新不要自我设限，电动车的未来和今天的汽车从车的形态上、运营方式上、产业生态上到用户的使用方式上，都很可能不一样，需要今天的从业者积极探索。


    第三，新能源车的另外一种实现途径——氢燃料电池车，因为原料来源简单，充氢速度快，反应副产物还是纯净水，很受业界的关注。目前大规模推行的限制性环节在于制氢储氢、安全保障、充氢站建设等。所以，目前纯电动车是新能源车发展的明确方向。


    对创新者来说，要看到方向，也要了解不是方向的技术为什么不是方向。


    # —— ◆ 课后思考题 ◆ ——


    中国的新能源汽车市场很热，有很多的品牌，请你帮忙做个统计，共有多少个品牌呢？你体验过其中的哪几个呢？哪些品牌你觉得最有希望？


