    # 2) 云计算平台


    1.云计算平台将成为像水和电一样的基础服务，谁是这个基础服务的供应商，谁就在整个IT产业拥有了不可替代的地位。因此，国内外的IT巨头都要投入巨资来建设云计算平台。亚马逊的AWS目前是该领域的老大，它偏向于提供基础设施服务，更利于企业直接移植成熟的IT产品到平台上。而谷歌的GCP是近年来业务增长速度最快的云平台，它偏向于提供平台级别的服务，利于创新型产品直接使用现有方案，加快开发步伐。


    2.AWS是亚马逊为解决现实问题而实做出来的，它的服务更贴近企业目前的需求，能迅速得到市场的认可。而谷歌的GCP是面向未来规划出来的，容易实现更加系统的布局。


    例如，人工智能同样也是谷歌未来规划的一部分，将它与GCP相结合，不仅能推动人工智能在各行业中的应用的发展，也可能让人工智能的用户不再选择其他平台。对创新者而言，亚马逊和谷歌的这两种做法，具体哪种更好，没有一定之规。不管从哪个方向创新，都要注意扬长避短，兼顾短期和长期目标才能成功。


    3.云计算平台在发展过程中遇到了数据中心越来越庞大，利用率过低的问题，并受到了网络速度的限制。硬件计算资源融合和“软件定义基础架构”，能真正把人从艰巨的运维工作当中解放出来。Serverless
    无服务器架构用轻量级的微服务代替服务器，用微程序单元供开发者调用，能极大地提高云平台的资源利用率，并增加企业对平台的依赖程度。未来平台有可能会出现赢家通吃的局面，而云端的上百G高速智能网络，和5G引领的用户端与云端的高速连接，将带来更多云服务使用的新机会。


