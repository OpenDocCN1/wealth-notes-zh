  md: '2018年7月19日，谷歌作为云服务提供商，与Unity构建了游戏开发平台，开发实时多人游戏。


    Unity是目前全球领先的实时3D游戏和内容开发平台之一。在这个平台支持下，开发人员可以直接从Unity开发环境中利用谷歌云技术，大大降低了游戏开发的门槛。此外，谷歌还与Unity共同创建了一个开源程序，用于创建多人游戏的玩家社区，推动VR应用的开发。


    从用户角度来说，采用云端渲染提升沉浸式体验，同时也降低了设备购买的成本。


    在5G通讯技术下，游戏内容和游戏渲染都放到云端，用户端的交互信号上传云端，云端完成游戏的运算和画面渲染压缩，通过网络将视频音频传送给用户，VR终端进行显示。


    这省去了高性能主机，用户端可节省大部分开销，大大降低了用户体验VR游戏的门槛，也提升了游戏的流畅体验。到时游戏开发者可以充分利用VR游戏平台，开发各种复杂游戏，而不用担心硬件设备性能不足。


    # 3. VR 教育


    除了应用在娱乐产业，其实VR教育也是目前创新教育的方向。传统的教育，只是在课本和课堂内枯燥地学习。现在靠VR技术构建虚拟学习环境，你可以尝试体验虚拟实验室、宇宙中的天体运动、生物中的微观世界等，通过形象、生动、直观的形式来表现知识，让学生参与虚拟课堂的学习。


    谷歌推出了Expedition平台，这是专为教学使用构建的一个VR教育平台。


    学校可免费领取VR眼镜产品，通过“手机+VR”眼镜的方式，让学生体验虚拟的学习之旅。该平台目前已有超过100个教育内容。如今这个平台又加入了AR能力，简单用手机就可以获得超过100款不同的教材。


    谷歌强调的理念是：AR把抽象的概念具象化给学生学习。


    比如在桌面上，给学生演示一颗心脏的血液循环变化。在2018年5月，谷歌发布新的“Expetions应用”，向公众开放虚拟现实旅游教育，只需要一台VR眼镜或VR头显，以及一台Android手机就能体验。这个新的应用程序可以独立使用，让人们可以自行探索其中的600个神奇的旅游项目。


    VR教育现有终端较为成熟，已经达到早期体验的需求。但目前的问题，主要是VR教育内容零散，很少形成体系，同时面向消费者的教育类应用也远远不够。造成这种现状的原因是VR内容生态不完善，需要内容制作平台、终端公司、教育机构的共同努力。


    总结一下，5G时代的到来，将促使云计算与VR结合，极大改善VR的用户体验，减少了用户的的门槛，有利于VR的市场化。


    目前，智能文娱是5G时代的低垂果实，比较成熟的应用有：VR直播、VR游戏、VR教育。


    所以，你需要能看到VR技术普及带来的新机会，结合文娱教育行业的特点，寻找到一个解决实际问题的切入点，把它做深做透。


    # —— 课程小结 ——


    这一讲，我为你分析了高质量VR视频在VR生态中的重要性，同时基于5G通讯技术和云计算，分析了VR的应用前景，以及在直播、游戏、教育领域发挥VR的价值。


    希望你能掌握以下三点：


    第一，高质量的VR视频内容，是VR技术能普及的一个关键因素。其中VR电影就是一个典型的例子，它不像今天的电影，你将可以不被电影视角限制，任何角落你都可观看，一部VR电影具有巨大的信息量，你可以看好几遍，参与不同的互动，每一次看你都有新鲜感。


    第二，在云计算的支撑下，由于VR视频的内容渲染可以在云端实现，这有利于实现VR设备的轻便化和无线化，降低了用户的体验门槛，利于VR技术的普及。目前VR游戏内容最丰富，也是用户最愿意付费体验的应用场景，但硬件设备的价格还有待进一步降低。


    第三，智能文娱是人工智能时代的低垂果实。5G时代，除了内容制作、游戏和教育领域，VR技术的应用领域会大大拓展。关键是要结合行业的具体特点，寻找一个解决实际问题的切入点，把它做深做透。


    # —— 课后思考题 ——


    你玩过VR游戏吗？或者看过VR视频吗？聊聊你的体验，如果5G到来，你看好VR在哪个方面的应用呢？


    欢迎在留言区分享你的观点。


    # 划重点


    +   1. 基于5G分阶段部署，目前AR是应用领域中低垂的果实，而VR技术是未来的发展方向。\n2. 智能文娱是5G时代的低垂果实，比较成熟的应用有：VR直播、VR游戏、VR教育。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们下一讲见。'
