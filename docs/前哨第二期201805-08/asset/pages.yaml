    不过，要想创造美好的地球环境，最终还是要环保企业来牵头，要利用环保科技的落地来实实现这个目标。而环保是个偏应用的产业，关键是找到突破口，就是现在环保领域的痛点所在，然后组织研发，把前沿科技用到这些领域，争取实现技术上的突破。


    这也是我介绍的欧洲的苏伊士集团为什么在和政府的合作中总是能不断有研发突破。


    中国面临环保产业的大发展，突破口可一点儿都不缺。当然，企业经营不是纸上谈兵，发现了突破口，也需要几年的时间 and 大笔资金投入，才可能实现产业化，而且需要有掌握和运用前沿科技的能力，这就是我们说的“积木式创新”。


    这一讲我就用几个案例来和你分享环保领域的机会。


    # 一、个人和家庭防雾霾用品


    首先就要聊聊大家最关心的雾霾问题。


    我在这个模块的第一讲里面就说了，完善高效的环保市场，可以为产业提供保障，促进环保技术进步和使用，达到减排的目的。但是，目前国内的雾霾问题还是比较严重，在短期内，我们需要采取一些措施，来减少雾霾对自己身体造成的伤害。


    目前，市场上的个人防雾霾产品已经比较多了，不过，斯坦福大学的崔屹教授，觉得还是能有改进的空间。他读博士的时候，师从纳米领域的黄基人 Charles Lieber，又在博士后期到伯克利继续深造，是纳米材料领域的领军人物。


    除了拥有比较高的学术成就，崔屹教授还是锂电池技术创业公司安普瑞斯（Amprius），以及雾霾防护创业公司 4C Air 的创始合伙人。


    崔屹建立 4C Air 这家公司的决心，源于 2014年来中国的一次旅行，当时严重的雾霾引起了他的极大关注，他当即请人购买了当时市面上各种各样的PM2.5口罩，拿回斯坦福进行检测。


    结果发现，大多数口罩对过滤PM2.5并不管用，尽管有少数几款的过滤效率还不错，但都有一个共同的缺点：透气性不好，戴着很闷，而闷的原因，就是口罩的空气阻力太大。


    经过努力，崔屹发明了一种纳米高分子纤维过滤膜，这项技术已经获得了美国的专利许可。这种膜的空气阻力，仅为市面上口罩的1/3到1/2，同时 PM2.5 的过滤效率可以达到99%。


    为什么纳米高分子纤维能达到这样的效果呢？


    这要先从纳米材料讲起，我们的头发丝的直径大约是0.05毫米，而1纳米，就是将这根头发丝的横截面切成5万份，其中每一份的直径就是1纳米。


    在纳米尺度上，物体往往具有和以往不同的性质，比如黄金在正常情况下是金色，而纳米尺度下的金溶液会呈现出红色。而纳米高分子纤维，是带有静电的，而且电场强度很强，因此它可以“抓住”不带电的PM2.5粒子，起到过滤的作用。


    在申请专利以后，崔屹就和美国能源部前部长、1997年诺贝尔奖获得者朱棣文一起创立了 4C Air 公司，用来将实验室专利技术进行商业转化。并且，伯克利大学的杨培东教授与斯坦福大学的沈志勋教授作为顾问专家。


    这个模式，符合我们说过的专利技术转移流程，也就是说，教授成功申请一项专业后，然后找到合适的合伙人，成立公司，开发产品，进行商业转化实践。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_105_0.png)


    目前，他们正在开发两款产品：


    +   一款是4C Air Window Screen，你可以简单理解为一块能过滤PM2.5的纱窗，这样，在雾霾天就不必关窗了。


    +   第二款产品，就是大家常用的雾霾口罩。目前，他们已经在深圳成立了分公司，生产线也正在设计中，预计在2018年能有产品进入市场。


    中国目前解决 PM2.5 的任务仍然十分艰巨。


    其中一个最主要的原因是：尽管有环保法，各种监管法律，巡查组，但是总体上环保的违法成本还是太低。所以，政府在政策上，对于违反行还是要坚持高壓的态度。


    类似雾霾预防这样的大气治理环保技术其实还有很多，政府应该发布政策鼓励拥有这些技术的个人或团体积极推动技术市场化。并且适当当地给予资金或其他支持，让这些技术能顺利落地并发挥它们的作用。


    大气污染治理目前是中国环境的头号难题，所以，这个市场蕴藏着大机会，可以从排放物减量化、甚至零排放、废气分离处理、回收利用等角度出发，设计综合解决方案。


    # 二、固体废弃物处理


    讲完雾霾之后，我们来看看环保的另外一个主要问题，固体废弃物，也就是我们常说的垃圾。


    根据中国住建部的城市垃圾统计数据：


    +   每年，我国城市的垃圾生产量已经超过2亿吨，每年总垃圾生产量超过4亿吨。


    而中国普遍的垃圾处理方式是填埋或焚烧，这既不环保也没有做到“物尽其用”。


    不仅产生的垃圾量大，中国还是全世界最大的可回收垃圾进口国。这其中有超过2/3是电子垃圾，当人们利用电子垃圾获利以后，剩下的垃圾废弃物也是采取填埋的方式进行处理。这种方式极大危害着中国的土壤、地下水和河流。


    2017年7月份，中国宣布从2018年1月1日开始，停止进口外国塑料和混合纸质垃圾，只接受被其他材料污染少于5%的纸皮，并明确表示禁止24种固体垃圾的进口，以此来维护国家环境及民众健康。虽然来得晚了一些，但终于还是来了。


    相对于粗犷的掩埋和焚烧，德国的创业公司 Arensis 就显然高明太多了，他们成功地把生物垃圾转变成了能源。


    Arensis 是一家提供小型发电设备的供应商，而发电的原材料来源就是生物废料，这家公司的创始人叫 Julien Uhlig。


    他曾经是德国政府的一名公务员，负责能源方面的工作。2008年，Julien 被德国政府派往非洲，去暂管一个电网项目。


    到达那儿以后，他发现了一个严重的问题：


    当地的基础设施很差，因此德国工程师所设计的方案在当地无法展开。正在苦恼如何将项目进行下去的时候，一位当地的工程师拿着一段竹子对 Julien 说，如果我能将它变成电力，那这应该是一个很好的解决方案。


    这个说法让 Julien 灵光一闪：


    与其制造一个大型的电厂，发电并入电网，然后再输送出去使用，那为什么不能制造一个直接用当地生物废料产生电力的机器呢？


    有了这个想法之后, Julien 就开始进行产品研发。'
