  md: '# 235 | 新能源汽车：谁会成为造车领域的“富士康”？


    235 | 新能源汽车：谁会成为。


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 王传福是如何一步步打造出比亚迪的？

    2. 为什么资本市场不看好比亚迪的新能源汽车？

    3. 比亚迪面临哪些挑战？又有哪些机会？


    提到电动车你首先会想到什么？想必应该tra特斯拉，或者是贾跃亭的 FF91，又或者是我们上一讲提到的蔚来。


    为什么你没有马上想到比亚迪呢？提到比亚迪，你的第一印象又是什么？是电动车电池制造商，还是实用型的中国自主品牌车企呢？


    这确实是一个尴尬的现象，在电动车领域，比亚迪销量可算不低，但在大众心目中，品牌的档次却不高，其中很大一部分原因在于，比亚迪的企业定位过于强化新能源整体解决方案供应商的身份，而低估了数字经济时代出行体验的重要性。


    这两种思路有本质的区别，比亚迪在传统能源汽车领域，推出的车型确实性价比很高，但是显然对于“汽车”的理解过于局限在“车”的物理属性上，对于智能化、数字化的‘入车交互体验’的理解就显得不足。


    其实，这也是很多传统车企的特点，主要原因是跟创始人王传福所处的时代背景，以及他的创业经历是分不开的。


    下面我们详细讲讲。


    # 一、王传福与比亚迪


    用今天的话说，王传福的经历就是典型的成长励志故事，但在在个故事中，他成功的核心因素，不仅是遇到了中国快速发展的时代机遇，更多的是他充分把握了科技全球化的宝贵红利，他是用技术改变了自身命运和产业格局的人。


    王传福出身贫寒，成长道路充满艰辛。


    1966年，王传福出生在安徽一个普通农民家庭，他 dokonce 父亲是一名技艺出众的木匠。木匠是一个复杂的技工作种，王传福从小就看父亲做木工，将一块块粗木料画线、拉线、切割、加工、组合，这套流程和技艺王传福再熟悉不过。


    多年后，这种“任务分解”的思路同样出现在王传福创业历程中，面对技术壁垒，他像拆解家具一样，将目标任务一一分解，单一去击破，然后又重新组织创造。


    我原来就介绍过：


    今天被很多人吹上天的马斯克的第一性原理，从务实的角度说，其实就是这种任务分解的思路，在现实中这么做的企业家实际上还有很多。


    说到这儿，我们又会发现王传福和马斯克的另一个相似之处，他们都有很好的理工科背景。马斯克学的是物理，王传福学的是化学。


    1987年7月，王传福从中南工业大学冶金物理化学系毕业，考入北京有色金属研究总院攻读硕士。从那时起，他就把自己的全部精力都投入到了电池研究中。这其实为后来研发电动车电池，奠定了扎实的技术基础。


    毕业后，他顺利成章地留在了院里工作，凭借过硬的技术，王传福在体制内快速上升，1992年，26岁的王传福，被破格委以研究院副主任的重任。第二年，北京有色金属研究总院在深圳成立比格电池，他被顺利任命为公司总经理。


    在电池行业工作多年，王传福发现中国电池行业一方面技术落后，而另一方面市场机会又非常大。当时是日本电池一统天下，中国很多电池企业都是依靠进口，甚至回收日本电池的电芯进行二次加工，非常被动，市场空间有限还制约于人。


    于是，王传福决定辞职创业，希望能够改变中国电池产业的现状。


    接下来的故事，很多人都知道了，王传福向做房地产投资的表哥吕向阳借了250万元，注册成立了比亚迪科技有限公司。


    # 二、从手机电池到制造汽车


    当时，三洋是世界第一的镍氢电池制造企业，王传福希望将自己的技术本地化和产业化，来弥补国内电池产业空白，他的第一个目标，就是要与日本三洋竞争。


    对于这个在当时来看充满挑战性的任务，他是如何完成的呢？


    当时，日本的电池工业早已进入机械化流水线生产阶段，投入一条电池生产线需要几千万人民币，而且日本还严格禁止设备出口。在技术封锁和成本高昂的情况下，王传福选择了中国民营企业家的通常做法，那就是自己研发技术，然后自己组建生产线。


    为了降低成本，王传福通过拆解整个生产线流程，将机械化流程分解成一个个人工完成工序，所幸当时人力成本也不算高。最后大概花费了100多万元人民币，就建成了一条日产4000个电池的生产线。


    很多人会认为，比亚迪这是靠中国低廉的人工成本取胜，但是却忽略了它的技术优势。


    用了不到10年，比亚迪依靠过硬的电池技术和成本控制，成为当时占据市场主导地位的手机业务企业，比如为诺基亚，飞利浦，摩托罗拉提供电池。


    要成为这些公司的供应商可不是容易的事，必须经历对技术、研发、生产和物流等各个环节的极其严格的审核，有时候，要经过好几年的审核流程，才会赢得采购订单。当然他们也不会轻易更换供应商。


    当成为了手机电池的供应商后，比亚迪有了充足的现金，但也有了新的麻烦，电池行业的利润越来越低，而竞争却越来越大，需要开辟一个新的战场，王传福想到了汽车行业。当他准备收购濒临破产的陕西秦川汽车时，很多股东不同意这个决定，有闹情绪的，有要撤资的。但他还是坚持了自己的决定。


    今天来看，比亚迪进军传统汽车领域是下一盘大棋，一是积累造车经验，二是为了研发电动车筹集资金。他把自主研发电池的经验，也移植到了汽车行业。


    他小时候看父亲做木工活的经历告诉他，需要什么都可以自己造，而且自己生产幫高价买的更管用。


    于是他通过拆解目标任务，把汽车按照模块进行拆解，逐一研究，测试性能。然后进行产品制造，不涉及专利的直接仿制，如果涉及国外专利的部分，改变核心数据进行改造。但是造车的复杂程度，可不像是制造电池，2006年一款被命名为F3的比亚迪轿车终于下线。


    但F3一上市便引发了市场的争论，有人说山寨，因为它的外观与丰田花冠如出一辙，而且部分零部件甚至还能通用。有人却说是创新，大赞比亚迪将“山寨”演绎到了极致。所幸的是，F3成为中国当年最暢销的轿车之一。


    说到这，我们就需要重新思考山寨，当你还没掌握核心技术，你就要模仿，当模仿到一定程度后，就不甘于制造和人家一样的东西，这时创新就一定会发生。


    就像周其仁老师讲的，创新要有浓度、有密度。浓度密度都够了，大家的相互激励就会特别有效，创新的速度会大大提升，这就叫做群体加速的创新。


    当然，知识产权是需要尊重的，但不要被知识产权限制死，创新也可以用在绕开别人的知识产权和建立自己的知识产权上。


    # 三、比亚迪面临的挑战与机会


    说完了王传福的创业故事，我们再来看看今天比亚迪的现状。


    目前比亚迪在A股市值约为200亿美元出头，主营业务包含充电电池及光伏、手机零部件及组装、汽车及相关产品。而我们第二讲介绍的蔚来汽车，还没有实现量产，据说赴美上市的估值已超过300亿美元。这么一对比，不难看出，从资本市场的表现来说，大家并不看好比亚迪的新能源汽车。'
