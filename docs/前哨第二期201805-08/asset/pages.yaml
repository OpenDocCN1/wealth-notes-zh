  md: '# 207 | 下一代计算：成果商业化加速


    207 | 下一代计算：成果商业化.. ↓


    # ——模块总结——


    模块的话题是下一代计算机，我们介绍了三个重点：


    第一，传统经典计算机的发展是基于摩尔定律的，它面临着一个物理极限。于是，人们也在量子计算机、光子计算机和DNA计算机等几个方向上探索。


    下一代计算机将未来必会取代现有计算机系统，很有可能是两者同时共存，并且与云计算相结合，发挥各自的优势。


    不管你是不是IT从业者，它的发展都值得你关注。如果它的技术取得突破，会为IT产业以及IT技术在其它产业上的应用，带来很多意想不到的机会。


    第二，量子计算机是基础架构角度的创新，各大IT巨头都在争RNAs量量子霸权，希望使自己在产业竞争中优先占有有利地位。


    但在目前：


    +   量子计算机基本上不是样机就是测试芯片，它还有很长的路要走；

    光子计算机是对现有计算机的补充，相对于量子计算机来说，可能会更快实现实用化；

    DNA生物计算机也有望极大降低大规模运算的成本，特别是大规模储存的成本。


    第三，D-Wave 和 Optalysys 这两家公司，分别在量子计算机和光子计算机领域率先走上了商业化的道路。


    特别是 D-Wave，它在10多年前发布了第一台量子计算机原型机之后，引发了众多IT巨头开始尝试商业化的道路，未来从研发到商业化的成果转化周期会越来越短。


    # ——用户问答——


    王老师，量子计算机的发展是否会影响加密货币的发展？


    我的回答是：


    从原理上说<|message|> 会的，因为我们讲过，量子计算机的原理，决定了每增加一个量子比特，理论上的计算能力就会翻倍，而我们也听过那个故事，国际象棋棋盘上第一个格子放1粒米，第二个格子放2粒米，第三个格子放3粒米，第四个格子放8粒米，这样一直放下去，全世界的粮食都放不满64个格子。


    所以，未来量子计算机的量子比特数上去之后，对现有的数字加密算法能够实现破解，数字货币就不成立了。


    但是这一天还很远，因为要做到足够多的量子实现纠缠是很难的，一方面要制造出足够多的量子纠缠，另一方面还要维持足够长的时间。


    我们介绍了舒考夫定律，大约每3年时间，量子退相干的速度会被延迟10倍，可见量子计算的发展是要以年计的，短期难以有大突破，但只要有这种指数级的增长存在，未来就一定会很强大。


    当然，对数字货币而言，也许计算能力的强大会催生出新的加密算法，未来也许会有新的更高级别的数字货币诞生。'
