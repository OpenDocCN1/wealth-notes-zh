    # 4) 智慧农业


    1.美国是目前全球最大的农产品出口国，100多年来，他们的农民数量大幅度减少，产量却在不断提高。根源就在于，美国一直紧跟住每一次技术变革的趋势，积极把最新技术应用到农业生产中。


    2.智能农业的新机会在于做数据的采集者、管理和使用者。可以把原来简单出售信息采集设备的方式进行延伸，为用户提供更加全面的长期的农业数据管理和使用方案服务。


    对于农业生产者来说，将记录的生产数据用来优化决策，将会获得更大的收益。此外，新的物流供应链管理模式将会产生。


    比如区块链可用于提升农业交易的透明度和速度，采用立体种植的室内农业，使得蔬菜可以在大城市周周围种植，提高物流效率。同时，将最新的专利技术应用到传统农业生产的环节中，也是值得尝试的途径。


