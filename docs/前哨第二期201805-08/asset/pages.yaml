  md: '这听起来已经很前沿了，不过，BHB 可不仅仅是提供数据分析服务，他们还有一个核心线下工具，叫做“编辑”。


    也就是说，当你找到了想要的 DNA 以后，就可以利用他们的“编辑”工具，真正完成自己的基因编辑工作了，这个突破可不是一般的大。


    在2017年9月30日上线的课程“创新地图 | 基因编辑，创新点在何处？”里，前哨团成员丁一博士，为我们介绍过：


    基因编辑的过程需要三个功能模块来合作完成，它们是“定位器”、“剪刀”和“修补匠”，“定位器”负责识别那一小段DNA的位置，给“剪刀”带路，“剪刀”负责把特定的DNA双链结构一刀两断，最后再由“修补匠”来进行修复。


    现在有一种叫做“CRISPR-Cas9”的核酸酶，就是实现“剪刀”功能的。不过，目前因为围绕 Cas9 的专利纠纷并没有完全结束，其他公司用它进行商业转化的前景不太明朗。


    基于这个原因，2017年 BHB 使用另一种叫 Cpfl 的核酸酶，用于水稻的基因编辑，2018年2月又推出了一种以核酸酶 Cms1 为基础的3.0版本的编辑工具。


    Cpf1 和 Cms1 的专利权更加清晰，并且 BHB 已经拥有了 Cms1 的专利所有权，这意味着他们可以把这项技术商业化，由此生产的新农作物品种也可以顺利进入市场。


    # 那么，基因编辑技术安全吗？


    2018年4月，美国农业部已经宣布由 CRISPR 技术产生的农作物是安全的，将会和传统育种的农作物一样不再受到限制。这就意味着，基因编辑将会代替传统转基因技术，成为今后品种改良的主要手段。


    此外，BHB 公司认为，种子的品质特征远比产量重要。也就是说，它更希望客户通过生物云平台和基因编辑工具，来为食物创造出一些以前没有的新特性，而不是一味地追求数量的提高。


    # 举个例子：


    藜麦是一种非常健康的食物，它富含多种氨基酸，其他营养物质的含量也非常均衡。


    # ——▶ 课程小结 ◀——


    这一讲我们介绍了美国生物科技公司 Benson Hill Biosystems，希望你能掌握以下三点：


    +   第一，农业数据的数量和种类还很少，现有数据不够精细，或者不能反映真实情况，并且储放分散，限制了数据的进一步整合。所以，希望在农业领域创业的朋友，不仅要对行业有深刻认识，手头上还要具备充足的农业数据。这就是我们一直强调的，大数据也需要专家的解读。


    +   第二，美国农业创新公司 BHB 的核心业务包括：

    生物信息平台 Crop OS；

    与云服务配套的应用软件，用于“展示”和“选育”；

    以及把预测结果用于线下实践的基因组编辑工具。


    +   第三，我们很高兴能看到，随着大数据、云平台、基因编辑技术这些前沿科技的发展，吸引了行业专家和投资者，将这些技术应用到传统农业当中。


    # ——▶ 课后思考题 ◀——


    在农业领域，你还了解哪些公司正在利用数据优化农业生态链？它们的服务和业务模式是什么样的呢？


    # 划重点


    1.农业数据的搜集与应用存在的问题，一是监测手段有限，数据来源少；二是实验室数据难以反映真实情况，不够精细；三是数据分散，没有形成共享；四是掌握数据的农业公司与掌握技术的科技公司缺少结合。
    2.BHB 能够在激烈竞争中脱颖而出，在于它掌握了多种前沿技术，并将农业数据与之深度结合，为客户提供了好用的工具，提升了客户效率。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，我们下次见。'
