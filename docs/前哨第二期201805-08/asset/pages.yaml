  md: '# 200 | 前哨大会复盘：中国、美国、香港的新定位


    200 | 前哨大会复盘：中国...


    # ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 中国、美国、香港如何适应新的定位？

    2. 为什么说中国是最好的科技创新土壤？

    3. 中国企业该如何进行国际化？


    我在第一讲为你解读第十个趋势的时候，说到我们中国人的新国际化时代来临了，这个趋势是很可能会发生的，但要真正实现，需要我们的行动和实践。


    这一讲是第三讲，我将为你继续解读，中国、美国和香港如何适应新的定位？全球产业链将会有什么新的变化？而中国企业家应该如何主动地融入、加入全球化的布局？


    # 一、中国的创新土壤


    我先从一个特殊的公司，拜腾公司开始讲起。


    说它特殊，是因为这家公司是由两个德国人创立的，一个叫戴雷，一个叫毕福康。他们自称是跨国公司，因为他们在中国、德国都有办公室，在硅谷有研发中心，因而的国际化程度也确实很高。


    但是据我所知，他们的资金基本上是来自于中国的，他们的运营，尤其是生产厂也是设在中国。


    为什么这家公司有意思呢？


    因为这两个创始人，一个是宝马 i8 的设计师，是汽车的开发专家。另一个是宝马中国公司的副总裁，是个市场专家。


    这两个德国人要创业，不是跑到德国去要钱，不是跑到美国去要钱，而是在中国要钱。他们不远万里来到中国，为了中国的电动车事业来奉献自己的青春，这是精神？这肯定不是国际共产主义精神，而是因为有些机会，只有中国才能给他们。


    其实我们可以设想一下，如果你去德国或者美国跟人说要造车，那么他们有的是大车厂欢迎你去打工。但如果说要人给你投资办一个新车厂，那对不起，估计没有人会相信，你能在德国干掉奔驰，在美国干掉通用福特，风险太大了。


    而在中国，他们成功地完成了 A 轮和 B 轮融资，这其中，有南京市政府和一汽集团的投资。据说南京市政府还审批了很大的地方，让他们建立现代化的汽车制造厂，这家公司也信心满满，希望一年之内就发布出自己的量产车。


    走得这么顺风顺水，我认为有两点原因：


    +   第一，是中国对制造支持的能力更强大，一个小企业能从零开始建一个车厂，中国的投资者不会觉得是个问题，不管是第一代民营的车厂吉利、比亚迪，还是现在的造车新势力蔚来、小鹏、威马们，都是这么建立起来的，但在国外大家就不会相信。

    第二，是中国的科技支持的氛围会更好，尤其这两个德国人都足够专业，我们又能够对制造的能力进行评估，所以中国的投资人就敢于投钱，对科技愿意给出更高的估值。


    从这个例子中你可以看到：


    不管是从产业的生态链上，还是资金支持上，中国现在已经是支持科技创新最好的土壤了。这个土壤，不光能孕育中国企业在国际科技前沿新势力的崛起，也能吸引外国科技大牛到中国来创业，而不仅仅是以前的大公司到中国来开个分公司。


    我们在现场展示的我们投资的盲人眼镜公司 Wicab 在中国的落地，和中风急救设备公司 Cerevast 和中关村技术创新中心的签约，都是这个趋势的证明。


    在这种转变下，中国、美国和香港也应该适应新的定位，使得优势互补、经济合作更为顺畅。


    # 二、中国人的新国际化


    首先，我们看一下中国，我刚才说，我们很可能会迎来中国人的新国际化时代。


    那新国际化的行动的正确打开方式是什么呢？


    我认为，我们要先转变一个观念，中国人的新国际化，必须以长期和对方共同繁荣、共同获利的目的出发，要有服务对方的心态。而不是仅仅把对方当成你赚钱的机会，想赚了钱就走。


    这里面有很重要区别，国外的学者研究过了，西方的殖民地，早期被殖民的，经济都没有发展起来，但晚期才开始殖民的英国的殖民地后来却很繁荣。


    为什么有这样的变化呢？


    是因为早期的殖民者，先挑选了富庶的地方，他们的心态是抢了就走。最典型的就是西班牙人征服印加帝国的时候，直接把国王抓起来，要求用一屋子的金银财宝来赎，最后国王没能提供足够的财宝，他们就把国王残忍地杀害了。用这种掠夺掠夺的方式殖民，当地经济会被破坏，是发展不起来的。


    后来到了英国去做全球化的时候，好的殖民地已经被占完了，英国只能去澳大利亚、美国东海岸这种贫穷落后的地方。那就没有东西可抢了，所以只好先帮当地的殖民者慢慢去繁荣经济，然后争取收点税。


    所以我们发现：


    全世界任意地方的经济水平都不是自然资源决定的，而是制度决定的。只要坚持市场经济制度，同时对创新足够重视，连以色列那样的不毛之地，你只要把智力资源充分地发掘出来，它都可以繁荣。


    智力资源的核心是什么呢？


    是机制的建立，让它有实践的机会。


    所以我们的“一带一路”政策，就是要把商业做出去，不是去掠夺或者买资源，而是去帮它做起来生意来。


    实际上老外做生意已经做到我们家门口了，义乌常年有好几万外国人，广州有几十万非洲人，就是呆在那里做生意的。


    中国人现在全世界的名声已经很好了，中国人会赚钱全世界都有名。就像在上世纪六七十年代的时候，非洲人很觉得中国人是游击战专家，而现在，中国人再到非洲，说我是做生意的专家，整个非洲都会信。


    但是，我们还没有学会对外宣传自己的优势，也没有去教教会别人怎么赚钱。


    我们都知道中国在全世界办了很多孔子学院，但我认为中国人更应该去出去办管子学院，管子就是齐国的管仲，他搞活经济很有章法。我们要去国外教人做生意和赚钱，尤其教人怎么和中国做生意，怎么系统地跟中国一起赚钱，并且把中国的信用传输出去。


    # 三、树立良好形象


    这其中，可能你最关心的是，我们也去教美国人怎么赚钱吗？中国和美国要如何合作呢？


    其实，现在中美的经济分歧加大，恰恰说明两国的经济状况发生了重大的变化，到了大家都要作出调整的时候了。


    但是，磨合是需要时间的。


    要如何加快磨合？


    中国企业可以迈出自己的第一步，要了解中美经济分歧，首先要了解美国的想法。


    中国讲和谐社会，大家相互之间认同感比较高，但美国讲个人主义，往往是个人有个人的观点，各据有各派的代言人。所以，并不是所有的美国人都再抵制中国，尤其是美国的科技企业，并不觉得中国的崛起有什么不好。


    对中国有意见的，主要是美国的工薪阶层，尤其是美国的蓝领白人，尤其是中西部地区的蓝领白人。这些工薪阶层大都认为中国人抢了自己的工作，认为中国的出口，赚走了自己的钱。但实际上，在过去几十年的全球化进程中，西方发达国家的跨国企业才是最大的受益者，中国人实际赚的是辛苦钱。'
