  md: '# 241 | 环保科技：环保产业迎来黄金发展期


    241 | 环保科技; 环保产业迎...


    第一讲我说了，环保事业需要政府、企业、社会多方共同努力来推进。这几年，你也能感受到，因为雾霾问题，公众对环保的了解和支持都有了实质性的提高，而中国政府对于环境和生态治理的重视和力度，也达到了前所未有的高度。


