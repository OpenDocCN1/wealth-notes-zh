    261： “伪需求与真需求”

    262： “网络安全”


    # —— 年度复盘 ——


    1.无论你从事什么行业，你都需要从现在起，建立预测科技趋势、提前布局的思维习惯。如果你处于传统行业，不仅仅要思考现有技术如何更好地解决行业痛点，还要密切跟踪未来3到5年的科技动态。如果你处于科技领域，更要紧盯科技前沿和基础研究的突破和成果，这样才有可能弯道超车。这也正是我和我的团队一直以来专注的领域。


    2.科技创新有三个路径：专利转化、开源创新和应用创新。其实归纳起来，就是周其仁老师提出的“创新上下行”，也就是掌握技术以后，再去寻找商业化机会，或者开发和挖掘新的应用领域。我一直强调，光说科技本身没有用，关键是要充分利用，一定要科技能为你的工作和生活创造价值。


    3.目前全球科技生态已经进入积木式创新阶段，从资本到资源，企业需要更长期、更全面、更专业的支持。企业可以专注做自己的长板和研发核心技术，把长板尽可能做长，构建牢固的壁垒。只要将人力、行政和服务等其他功能与其他企业协作就可以了。这样，集各方力量，才能把企业的优势最大化，保证可持续的竞争.objective。


