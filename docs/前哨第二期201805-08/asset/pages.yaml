  md: '# 261 | 物联网：“伪需求”与“真需求”


    261 | 物联网：“伪需求”与。


    # ——内容看点——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 构建物联网的关键是什么？

    2. 物联网的发展趋势是怎样的？


    这一讲，我们来聊聊物联网领域的新机会。


    # 一、伪需求和真需求


    自从物联网的概念被提出之后，第一拨火起来的应用就是智能家居。很多人一说起来就很兴奋，冰箱要全智能、洗衣机要全智能、电饭煲都要全智能，甚至插线板也要是智能的。


    但是认真想一下，为什么要智能？


    几年前一家冰箱厂商的人给我讲过一个场景，他说：


    > 在我们设计的冰箱使用场景里，有智能图像识别模式，等人工智能技术技术成熟了，你装进去的肉、蛋、奶、蔬菜都能被识别出来。


    > 一旦快过期了就会主动提醒你赶紧吃掉，如果缺了你常吃的东西，还会自动帮你在电商下单购买。


    > 既避免了食品的浪费，也避免了你想吃的时候吃不到，还节省了你去选择和采购的时间。


    这听上去真的很棒，但你仔细琢磨一下，这真的是一个很强的需求吗？


    首先，这是一个很难实现的需求，技术难和成本高是一方面。还有智能冰箱要实现购买下单这些服务功能，这就不是造冰箱那么简单了，这还需要电商、物流等的配合，这是一个生态。


    更关键的是，对于中国家庭来说，一般家附近就有菜市场和超市，又有多少人需要冰箱去下单呢？


    更要命的是，让冰箱这么理性购物的是男性，而女性一般是冲动型购买，到商场看见什么就会控制不住冲动想购买，而一般家里负责买日常需要的食品的大多是女性，让她们把购物的乐趣交给冰箱，真的有点儿难。


    所以，智能家居的概念在市场上被追捧了几年后，那些为了智能而智能的产品又回归了自己的功能本质。


    到了2016年，市场热点发生了变化，智能音箱成了智能家居的控制中心，所有的 大公司都开发了自己的智能音箱，因为它被认为是未来家庭流量的主要入口。


    亚马逊推出了 Echo，Google 推出了 Home，微软有 Invoke，苹果也跟着出了 Home Pod，国内的阿里、百度、小米也都有自己的产品。可以说，目前语音交互已经是比较明确的大趋势了。


    第一讲我说过，按照物联网概念来严格定义的话，其实智能音箱也只是家庭这个单一使用场景的物理载体而已。根据目前物联网技术的发展趋势，应用主要还是集中在智能可穿戴、车联网、医疗、工业和畜牧等领域。


    下面，我就和你详细讲讲物联网在医疗行业和畜牧业中的应用。


    # 二、智慧医院


    Stanley HealthCare 是一家为医院提供智能化升级全套解决方案的美国公司。目前在全世界已经和5000多家医院建立了长期合作关系。


    在介绍他们如何利用物联网技术之前，先看看一家医院是如何进行日常运营的：


    +   首先，医院当中的每一台设备、医疗用品以及药品都需有严格的记录。对它们的使用以及库存记录是需要不断更新的。

    其次，医院中每个病人的每次检查都需要进行记录。

    再者，像急诊室这样需要快速反应的场所，医生和护士的传报，以及每个病人的身体状况都是需要实时更新的。

    最后，医院的环境监测，即温度、湿度、空气组成等参数都需进行监控，从而保证医院的正常运行。


    从库存、检查、急诊以及环境这四方面来看，将医院智能化升级后，将使其更高效地运作，从而可以治疗更多的人。


    当然，智能化可不是口头说的那么简单，它的背后蕴含了物联网中的所有环节：


    +   数据收集、通信传输、云端收集以及算法处理。


    Stanley Healthcare 主要打造了两个平台：


    +   第一款，是医患治疗记录平台；

    第二款，是对医院环境进行实时监测的物联网平台。


    医患治疗记录平台总共由五个部分组成，它们分别是：


    +   实时可视化界面、预装应用模块、数据分析模块、实时提醒系统以及设备集成系统。


    其中最重要的是数据分析模块，这个数据分析模块会收集有关病人、医生以及设备的所有相关信息，上传到平台，经过算法处理，并将它们处理成图片进行展示。用户通过这个系统，能实时监控存货、设备使用情况以及环境监测，然后作出适当指令反馈。


    医院由于病人聚集，因此空气中的病菌可能比外界高很多，因此控制医院内部空气质量与环境就显得十分重要。这同样是打造智慧医院必不可少的一环。


    Stanley Healthcare 的医院环境监测解决方案，包含智能传感器以及一个中心化的云端网络。而这个系统目前是医院环境监测的主流解决方案。平台通过一系列的温度、湿度以及压力传感器，将为用户提供实时、全面的环境监测数据，让用户实时监控医院环境。


    # 三、智慧畜牧


    说完技术密集型的医疗行业，下面我跟你说的是畜牧业，它看上去真的很传统，跟科技似乎接不上边。但越是在传统行业，就越需要科技改造，机会反而更大。


    来看看日本富士通的智能农场以及瑞典 Telia 公司的“互联养羊”计划，是如何利用物联网技术的吧。


    做法不复杂，在日本富士通的“智能农场”，通过给牛腿部挂上一个传感器来实时监测牛的运动。然后把监测数据上传到网上，通过一定时间段的数据跟踪和分析，来获得它们的运动量变化的规律。


    你一定好奇，为什么要监测牛的运动轨迹呢？


    原因在于，一头母牛每天的运动量与发情期有密切关系。因为只有准确地掌握母牛的发情期，才能增加受精的几率，从而维持畜牧场的可持续发展。


    研究人员的研究发现，当母牛每天的运动量陡然上升时，有95%的概率可以说明这时母牛开始进入发情期。而当发情期开始后的16个小时则最好时间段。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_149_0.png)


    除了发现人工授精的最佳时间段外，研究人员还发现了一个“性别窗口口”，也就是说，在最佳时间之前的一段时间进行受孕，则怀上母牛的概率更大。而在最佳时间之后一段时间进行受孕，则怀公牛的概率约为70%。因此可以通过人工授精的不同时间来控制牛群性别比例，优化种群。


    而且，运用这种日常运动程度的变化来判断动物是否进入发情期不光在奶牛身上适用，在马的身上也同样适用。


    可见，这些结论是基于物联网、大数据和人工智能综合应用后的结果。同样在挪威的农场当中，农夫发现带小羊去吃草的时候，每次都有大约10%的羊丢失或者遇到'
  merge: -1
  img_proc: true
- pgno: 150
  md: '候，每次都有大约10%的羊丢失或者跑到其他地方去了。


    你知道，挪威是一个很冷的地方，因此走丢的羊很有可能就在外面被冻死了，因此对于农夫来说，能掌握所有羊群的实时信息对他们来说非常重要，因为这样就可以保证将走失率降到最低。而为了满足这个需求，Telia
    挪威分公司与当地初创企业 Nortrace 为1000只小羊羔装上了窄频带传感器，这样就可以让农夫通过智能手机随时监测羊群的行动。


    窄频带传感器是一种新型通讯设备，它的成本相对低廉，并且在室内外有很好的信号覆盖能力。这样只要羊跑到农场以外去了，就能随时追踪，减少损失。


    当然，这类应用只是物联网世界的冰山一角，未来更多的可能性还需要继续探索。


    因为物联网概念一开始提出时，其核心要点就是“物与物直接连接，而不需要人进行干预”。因此如果要实现真正意义上的“智能家居”，应该让家中所有设备互相通信并进行协作。所以，整体上说，我认为，物联网行业的“杀手级”应用还没有找到，能不能实现的关键，在于挖掘真的需求，这个最重要。


    物联网这个大趋势大家都知道，人人都觉得前景很美好。但我认为，关键要分析你的行业优势在哪，哪些环节是真实的需求，能否做出足够深入的行业方案。尽量避免成为一个简单的设备集成商，而要成为解决方案的提供商，要跨越这个阶段有很长的路要走。另一方面来看，其中蕴藏的新机会也是无线的，因为你知道，连接创造价值。


    # —— 课程小结 ——


    这一讲，我为你分析讲述了物联网行业的新机遇。希望你能掌握以下三点：


    第一，从智能家居的虚火，到智能音箱成了控制中心，以及从当前各行业的应用现状来看，整体上说，我认为，物联网行业的“杀手级”应用还没有找到，能够实现的关键在于挖掘真正的需求。


    第二，构建物联网是一个系统工程，无论是科技行业，还是传统行业，都可以用这个系统解决行业痛点，提高效率。


    第三，未来世界将由数据驱动，人与人、物与物、人与物之间的联系将越来越紧密，创造更大价值的同时也构建更美好的生活。而你需要做的就是大胆发挥创造力，积极利用科技手段，让梦想成真。


    # —— 课后思考题 ——


    你还能想到哪些物联网应用的新机会呢？想象一下，未来万物互联的世界中，你的生活会是怎样的呢？


    欢迎在留言区分享你的观点。


    # 划重点


