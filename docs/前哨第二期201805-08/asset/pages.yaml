  md: '# 209 | 云计算平台：亚马逊云计算平台AWS


    209 | 云计算平台：亚马逊云...


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 亚马逊的 AWS 是什么？

    2. 谁在使用者 AWS 提供的服务？

    3. AWS 面临的挑战有哪些？


    2018年4月22日，《福布斯》富豪排行榜公布了最新的榜单，排名榜首的，是亚马逊的创始人、董事长 CEO 杰夫·贝索斯，他继3月份首次超越比尔·盖茨之后，蝉联世界首富。


    如果你认为贝索斯的巨额财富，主要靠的是亚马逊的电子零售商务，或者是靠卖智能音箱 Echo 什么的，那你可能就有点落伍了。


    目前亚马逊最赚钱的业务，其实是来自于一个叫做 “AWS（ Amazon Web Services）”的部门，中文名是亚马逊云服务平台，它是世界上最早的，也是最大的云计算平台。


    对云计算平台有一定了解的用户都知道，谈云计算就不能不谈亚马逊，不能不谈 AWS。


    其实，当初贝索斯自己也没有想到，这个部门能发展成为整个亚马逊集团最挣钱的部门，并一直保持着上升的走势。


    -science


    # 一、AWS 是什么？


    刚才说了，AWS 就是亚马逊云计算服务平台，2006年，AWS 开始向企业提供 IT 基础设施服务。有了这些服务，创业公司就变得非常幸运。


    为什么这么说呢？


    如果你的企业需要一批服务器用来搭建网站服务，传统做法是，你必须自己采购、运营和维护这些硬件，你可能需要提前几个星期甚至几个月来完成采购。


    而通过租用 AWS 的服务，几分钟就可以让成百上千的服务器为你完成海量计算。说得更直白一点，可以把它理解成一站式的计算资源服务，一站式服务在其他行业里都有，不过就是被
    IT 领域的专业人士包装了一下，很多一人一听就蒙了。


    说到这儿，大家一定会好奇，贝索斯是如何想要创立这项服务的呢？


    这一切的背后，都得益于贝索斯10年前的 一个决定，而且这个决定跟他的专业技术背景密不可分。


    贝索斯在创建亚马逊之前，就有在各顶级公司工作的经验，他曾经就职于科技巨头 Intel、著名的贝尔实验室、顶级咨询公司 安德森咨询，以及大型对冲基金德助手基金
    (D.E.Shaw)。


    1993年，贝索斯离职创立了在线书店亚马逊，他是抱着“技术可以改变世界”的信念来创业的，对技术细节有着完美的追求。


    亚马逊内部有人称他为“微管理经理人”，他把公司内每项产品，都像自己的孩子一样对待，尽管他雇用了很多全世界最名的技术专家，但他每次还是要过问其中的每个技术细节。


    回到16年前的2002年，亚马逊还只是一家在线图书销售商，贝索斯发现，现有的架构的开发基础环境很差，用来暂时代持一个网上书店是可以的，但如果之后想要做功能扩展、规模扩张和长期维护，基本上要一遍遍地不断重复搭建数据库、计算和存储的工作。


    因此，亚马逊需要一套可以共用的基础环境设施。


    想到这一点后，贝索斯马上开始行动，自亚马逊1995年在网上卖出第一本书之后，就开始不断建立自己的 IT 基础设施。


    2002年，远见卓识的贝索斯更是下了一个简单但影响深远的命令：


    +   第一，所有团队的程序模块都要以服务接口的方式将数据与功能开放出来；

    第二，所有的服务接口都必须设计成对外开放的；

    第三，团队间程序模块的通信都要通过这些接口。


    于是，在接下来的几年，这些服务逐渐发展成为贝索斯口中所说的：


    可以让任何组织、公司或是开发人员将他们的程序运行在我们的平台上。


    2006年亚马逊正式推出 EC2（Elastic Compute Cloud），中文是亚马逊弹性云。


    它是怎么样个弹性法呢？


    用户注册成功后，就开始租用一台虚拟计算计算机，这个计算机的计算容量是弹性的，用户可以根据自己的计算需求来调节容量的大小，调节一次只需要几分钟，EC2 会按照已使用的相应容量和时间收费。


    虽然市场上也有一些传统的托管服务，但要使用这些服务，通常需要提前计划好一个固定的时间和固定的容量，如果出现突发情况，用户就难以轻松地响应。


    而亚马逊 EC2 这样一个平台就灵活易用得多，因此，一推出就受到了不少个人和企业的欢迎，AWS 开始愈发流行。


    随着需求开始扩张，AWS 逐渐发展成为全球范围内最大的云计算服务平台，拥有数量最多的服务器中心，目前，亚马逊的市场占有率遥遥领先于其他竞争对手。


    # 二、AWS 的用户分布


    AWS 如此受欢迎，这些用户都是谁，使用 AWS 来干什么呢？


    根据亚马逊的统计，截至2015年，AWS 的活跃用户遍布190多个国家，总数超过了100万，其中企业级用户占了至少10%，也就是说超过10万家企业和机构在使用
    AWS 业务。


    这些企业分为三类：


    +   1. 创业公司

    2. 大型企业

    3. 大学、政府和非营利机构


    首先，创业公司是 AWS 最主要的客户群体，因为小公司难以负担自己的数据中心，物美价廉的 AWS 就成为了首选。


    同时，很多规模庞大的巨头也发现了 AWS 具有高效、灵活和高拓展的优势，开始逐步把他们的 IT 需求向 AWS 迁移。


    包括互联网影视巨头 Netflix，由于电视视视频制作对计算、存储和数据传输的要求很高，Netflix 抛弃了传统 IT 基础设施，采取了“All in”的全盘投入战略，把他们所有的数据和
    IT 运营都搬上了 AWS。


    其他大企业用户还包括通用电气、联合利华、宝马等。


    此外，很多大学、政府和非营利机构也在使用 AWS。


    例如，在气象预测领域，预测极端天气往往需要多得多的计算资源，英国的国家气象局（Met Office）就利用 AWS 的强大服务器资源，部署了一个叫做“天气云”的应用，专门应对突发的极端天气。


    还有一个例子，奥巴马在2012年总统竞选的时候，他的团队所设计的新闻系统“独角鲸计划”，很大程度上就是依靠亚马逊的 AWS，“独角鲸”是一套服务接口，所有竞选应用都通过它和唯一的数据库通讯，由于竞选是临时性的工作，越临近选举访问规模会明显扩大，相应的服务需要及时跟上，而
    AWS 出色完成了任务。


    而另外一边，对手罗姆尼的竞选团队，也为志愿者开发了一个移动应用叫 Orca，Orca 的后台使用的是单一的网络服务器和应用服务器，在并发用户数量多的时候导致了宕机。


    说到这儿，我想说两点：'
