  md: '# 246 | 新材料：纳米技术革命


    我们这一讲的主题是纳米材料。


    说到纳米材料，你可能会认为是某种特定的材料，其实，纳米是一个长度单位，1纳米相当于10的负9次方，也就是十亿分之一米。


    所谓纳米材料，就是利用各种物理或化学方法，把原子或分子直接排列到一起，把晶粒的直径控制到纳米级别。通常尺寸是在100纳米以内，我们就称之为“纳米材料”。


    目前，材料领域的纳米化是非常主流的趋势。而且，纳米技术也被称为下一场材料领域的革命。这讲我们就来讲讲它。


    # 一、纳米材料


    著名物理学家，1965年诺贝尔物理学奖得主费曼，在1959年会议上曾预言：


    > 在物理化学、材料、生物工程等领域，更小的尺度依然有极大发展空间，当人类对于材料和结构能够达到纳米级的控制，甚至对一个原子直接控制时，将为未来整个科学研究领域，开创出新的研究手段、课题、方向。


    尤其是与材料相关的领域，比如在物理化学、生物医学、电子信息、能源环境领域都将产生深远影响。


    前几讲我说道，不同的结构就能产生不同的性能。在更小尺度对材料进行设计和重组，能开发出全新的纳米材料和纳米结构，这就意味着，它们将拥有与我们在传统材料领域，完全不同的优异性能，并能开创出独特和广阔的应用。


    当材料进入纳米尺度时，主要具有体积效应、表面效应、量子尺寸、量子隧道和介电限域，5大效应。关于这5种效应的概念，这儿不详细展开了，如果你感兴趣，可以去深入了解下。


    这5大效应导致了纳米材料能呈现出许多区别于传统材料的独特物理、化学性质。主要表现在以下几个方面，比如熔点、相变温度、光学性质、化学反应性能、磁性、超导及塑性形变等。具体性能我会通过案例说明。


    其实，自然界也存在很多纳米结构。


    你一定见过水珠在荷叶表面滚动的情景。其实背后的关键原因在于，荷叶微米和纳米化结合的表面结构。


    你可能会说，“我摸过荷叶，那是因为荷叶表面有一层蜡，你知道当物体表面涂上蜡后，就不容易沾水，也就是不容易湿。”


    ![](img/ec68de57cecf4aa37e2670e9d4879832_116_0.png)


    这话是没错，荷叶表面是有蜡质层，但并不是我们想象的一层很光滑的蜡质。我们认真用手触摸荷叶表面也能感受到它的粗糙。


    在显微镜底下，更是会发现荷叶表面密布微米级的凸起，和更细的几百纳米级别的绒毛，这些纳米级别的绒毛的存在，使得荷叶表面有了一层纳米级的空气垫。


    这样，在表面张力的作用下，水珠就更容易保持球形，并很自由地在荷叶表面滚动。即使荷叶表面有了一些脏的东西，也会被滚动的水珠带走，这样荷叶表面就具有了“自清洁”的能力。


    # 二、纳米材料的前沿研究


    目前，纳米材料的前沿研究，主要集中在纳米电池、生物材料，以及纳米金属催化等领域，基本都还在实验室研发阶段。


    我们2018年5月组织的美国东南投资考察团，在马里兰大学的时候，就见到了 一种纳米材料，叫“超级木头”。之所以叫这个名字，是因为它的强度是合金材料，或者轻量化钢材强度的好几倍。


    简单说，通过纳米技术，实现木材致密化，使得内部结构和性能发生变化。未来可以突破木头材质的局限，应用在需要高强度和高韧性材料的场合中。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_116_1.png)


    这项成果是2018年2月，美国马里兰大学胡兵民和糜涛教授研究团队发表的研究成果。把原生木材通过一定方法处理后，成为一种具有超强超韧性的高性能结构材料。


    通过以下两步处理方式，就能有效地把原生木材的强度和韧性，同时提高超过10倍。


    +   第一步，去除原生木材中的部分木质素，解释下，木质素是存在于植物中的不定向形的高聚合物；

    第二步，进行高温热压过程，实现木材的完全致密化。


    经过这两处处理环节后，就能最大限度消除原生木材结构中存在的空隙和缺陷，同时，又因致密化处理，让木材中纳米纤维的排列更有次序，紧实度更高，从而极大程度地增加了纳米纤维分子之间的作用力。


    这样的结果是，当超级木头断裂过程中需要耗散大量的能量，也就是通俗所说的，实现了高韧性。


    通过这种工艺获得的超级木头，具有非常优异的机械性能，比如，在拉伸强度、韧性、刚度、硬度、抗冲击性能等，都超出原生木材10倍以上，拉伸强度可以和钢媲美。


    超级木头既有强度，又有韧性，很好解决了困扰工程材料领域的一个重大问题：就是对于某种材料，往往高强度和高韧性不可兼得。


    可以说，超级木头的潜在应用非常的广阔。


    目前，各类金属以及复合材料在各种结构中扮演主要作用，虽然这些材料的机械性能超过原生木头，但制造成本高，而且对环境产生负影响。超级木头有潜力在建筑、交通、航空航天领域里取代金属结构，成为未来节能环保型高性能的结构材料，再加上环境友好和可持续发展的特点，未来非常有发展前景。


    不光如此，这个研究团队还发明了一种具有高强度和高韧性的纤维素纳米纸。


    实验显示，这种纳米纸的强度达到了普通纸的40倍，而韧性也同时提高了130倍，具备良好的热稳定性。纳米纸提升了强度和韧性后，不仅可反复利用，实现绿色环保，更大的意义在于可降解。


    在前几个模块，我跟你讨论过环保主题，我说过，环保技术是解决环保问题的根本途径。所以，如果使用可降解的纳米纸来代替塑料，就有可能解决困扰我们的塑料难题，改善环境污染。


    # 三、纳米材料的发展趋势


    前面我说道，理论上讲，任何材料都能实现纳米化，而人类对于材料在纳米级别的控制也有很大的驱动力，原因在于纳米材料表现出来的特殊性能。


    所以，针对于纳米材料和结构的研究依然会长期持续，而且，会与其他多个学科交叉融合，比如，物理学、化学、生物学、电子学等，涌现出很多新的研究理论和方法。


    比如，材料表面的纳米化，也就是说，只有材料最外面的一层的晶粒直径是纳米级别的，而内部结构保持不变，经过这种处理的材料能广泛应用到环境、化工等领域。


    另外，像我们投资的WiTricity公司的首席科学家，MIT的物理教授Marin Soljacic，他在纳米光学方面的应用正在被用到计算领域，可见纳米技术应用的广泛性。


    未来纳米材料的发展会呈现多元化和普及化，也就是说：'
