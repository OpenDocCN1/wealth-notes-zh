    1. 全球气候变化的影响因素非常复杂，“全球变暖是人类活动造成的”在学界只能算是主流，还不能做到共识。那些制造污染的既得利益者也在推动反对环保立法，使得环保产业的推动步履艰难。

    2. 环境污染问题是不争的事实，如果任由环境恶化，将来有一天证明了全球变暖确实是人类活动的恶果，我们可能会付出更大的代价，所以看到问题就行动，而不是等一切都争论清楚再说，本来就应该是优秀的环保企业家的素质，也是全社会的责任。'
