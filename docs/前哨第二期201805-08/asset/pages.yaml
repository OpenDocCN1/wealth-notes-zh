  md: '# 256 | 5G通讯技术：把握“合适”的机会


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 创业者如何把握 5G 带来的机会？

    2. 传统产业中的有哪些新机会？

    3. 谁最有可能拥有平台级的机会？


    这一讲，我要跟你讲的是 5G 时代的新机会。


    我们一直强调，什么样的技术发展阶段，什么样的支撑平台，就会创造出相匹配的应用。


    我们前面讲，随着 5G 时代的来临，高带宽、低延迟的优势，自然会为创意产业创造一个全新的平台。


    # 一、游戏产业的机会


    首先我们讲游戏行业，可以说，这个行业会成为最先受益的行业之一，而且小公司也能有大机会。


    从游戏产业的发展来看，它与技术发展是密切相关的。比如说，诺基亚塞班时代的贪吃蛇游戏，苹果开启触控时代之后就有了愤怒的小鸟、水果忍者等等。这些游戏其实都不复杂，但是都是根据当时的硬件和算力，开发出来的创意产品。


    # 二、传统产业中的机会


    其实，不仅创意产业有大机会，5G 通讯技术在传统行业也能大展拳脚。


    5G 作为下一代互联网，最大限度地推动数字化社会的转型，这会最大程度地改造传统行业。所以，如果你处在传统行业的话，可以针对行业痛点，重构业务模式，提升效率。


    比如，5G 为远程医疗的实现提供了技术平台。'
