  md: '# 238 | 环保科技：政府、社会、公司三位一体


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 环保产业的形成条件是什么？

    2. 什么样的环保科技会取得成功？

    3. 为什么说环保机制非常重要？


    我们这一模块的主题是环保科技。


    在中国讨论环保这个话题非常必要，也很沉重。有人说，中国这30多年的发展，是以牺牲环境为代价的。空气中弥漫着雾霾，江河湖海很多都被污染，垃圾围城的现象也是经常出现在新闻里。


    经济要发展，环境也要保护，那这些问题要怎么解决呢？


    # 一、环境保护的普世价值


    我先跟你分享一条新闻，听起来让人很悲伤。


    2018年6月2日，一只巨头鲸幼崽在泰国南部海岸被人类发现，当时已经奄奄一息了，很快就死去了。当人们对它做尸检的时候，发现它胃里居然有80多个塑料袋，算上七八糟的东西加起来有8公斤重。这些东西让这头鲸根本没法吞下其他任何食物，非常的可怜。当地的海洋学家说，在泰国的海里，每年都有很多海洋生物因为吃了塑料袋而死亡。


    # 二、环保产业的形成条件


    那么，在环保这个问题上，它们都分别扮演了哪些角色，起到了哪些作用呢？


    从世界范围来说，各国国家政府不仅制定了本国的环保政策，还签署了多个世界性的协议。一个是《京都议定书》，一个是《巴黎协定》，关于这两个协议的具体内容，如果你感兴趣，可以搜索一下相关的信息，我就不展开说了。


    # 三、环保科技的竞争力


    不过，要强调的是，对于环保问题，我们要明确一点核心观点，那就是：


    +   为了环保而阻碍发展就成了因噎废食，人类发展中遇到的问题，最好的解决方案永远是更新的科技，所以环保问题最终还是要利用环保科技来解决问题。'
