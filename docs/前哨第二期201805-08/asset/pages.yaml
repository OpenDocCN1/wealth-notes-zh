  md: '因为人类社会一直是在突破能力束缚的过程中发展进步的，从农耕突破食物的约束，到马匹突破负重的约束，到铁器突破武器的约束，到机器突破个人生产能力的约束，等等等等。


    今天对社会制约最大的是能源和计算能力的约束，一旦突破了，整个社会都会实现飞跃，而很多我们现有的业务模式就都不再成立，很多新的机会之门将就此打开。


    先说计算能力，如果计算能力能突破瓶颈，人工智能以及其它计算的需求就不是问题了，最近，量子计算领域取得了一些成绩，虽然说飞入寻常百姓家还有点距离，但总算是有个盼头了。


    而在能源方面，值得我们期待的是以冷聚变技术 Cold Fusion 为代表的轻型核能，我一直在盯着它在国际上的进展，中国在这一方面的研究也不落后，因为如果轻型核能有了突破，能源在全球都不再是问题了。


    所以，我想告诉你的最后一点是，我们需要在现有的、最有可能的预期下经营，但是永远不要放弃最好的那个预期。


    什么意思呢？


    我的好朋友简江讲过一个笑话：


    我们都在旱季苦熬，熬太久就把自己变成了仙人掌，结果雨季来了，大水首先把仙人掌给泡烂了。


    所以，永远不要放弃最乐观的预期，因为有一天雨季将要到来。历史已经证明，科技会给我们带来比我们设想的更加美好的未来，准备好去迎接它吧。


    # —— 今日内容小结 ——


    我在这<|message|> 一讲里为你解读了四个科技发展中的伪趋势，以及两个值得我们期待的科技突破。希望你能掌握以下三点：


    第一，有些词汇很热门，但这项科技并没有形成趋势。有些科技是趋势，但是在某些方面的应用上是伪趋势。


    第二，这一讲总结的四个伪趋势是：


    +   1. 区块链的很多技术问题尚未解决，它的趋势还没有那么快到来，区块链在虚拟货币发行上的应用现在很火，但却是个伪趋势。


    +   2. 新零售目前处于摸索阶段，它背后的技术问题已经解决，但应用场景还不明确。


    +   3. 人工智能的创业非常危险，因为平台的机会是属于大企业的，而在行业中应用的机会，属于在该行业深耕了很多年的公司和专家。


    +   4. 虚拟现实还没有到来，因为现有的计算能力和带宽未能满足对精度的需求。相反，混合现实现在就有市场了，因为混合现实在解决现实中某个问题的时候，对精度的要求相对没有那么高。


    第三，科技发展还是存在变量的，计算能力和能源这两个技术的突破值得我们期待，因为它们将对社会带来巨大的影响。面对变量，我们千万不能预期过低。


    # 掌握背后的规律


    我也希望你掌握背后的规律，为什么很多人都认为是趋势的，反而不是趋势？


    第一，大多数人将愿景当成了现实。


    因为对于技术发展脉络和实际实现能力的不了解，往往将想象中的愿景当成了现实，人们对人工智能的恐惧，就是这样的原因。


    第二，某些趋势的发展路径严重偏离了技术发展的初衷。


    比如区块链技术上发展起来的 ICO，已经成了收割韭菜的游戏。这样的结果，很大程度上可能说明，最初的技术设计路线有缺陷，导致目前偏离轨道，也可能是干扰因素过强，比如大家都想借
    ICO 发财。


    第三，某些趋势看起来很明显，但是机会往往属于少数人和少数优势企业。


    比如人工智能，当然，另一方面，新技术又会带来新的、以前无法想象的机会。比如，人工智能给劳动密集产业带来的机会，因为人工智能需要的大数据集需要人工标注，而人工智能标注，是个劳动密集产业。


    第四，某些技术已经成熟，但是应用场景不明确。


    当年互联网高速发展的时候，搜索技术经历过几次的摸索，最终是谷歌从别人那里借来的关键词广告业务找到了合适的商业模式，有了明确的场景，成了绝对的巨头，新零售就是这样的。


    # —— 今日思考题 ——


    能否请你畅想一下，如果计算能力或能源方面的技术取得了突破，将会对你现在从事的领域带来什么样的可能的变化？


    划重点


    +   1. 有些技术发展着发展着，就遇到瓶颈了，几十年都解决不了，而有些技术，原本并不起眼，但是有一夜之间就突破了，会对社会带来巨大影响。


    +   2. 计算能力和能源这两个技术的突破值得我们期待，因为它们将对社会带来巨大的影响。


    +   3. 我们需要在现有的、最有可能的预期下经营，但是永远不要放弃最好的那个预期。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们下一讲再见。'
