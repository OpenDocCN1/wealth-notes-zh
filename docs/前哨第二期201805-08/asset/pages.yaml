  md: '# 215 | 美国投资考察：科技产业的投资方法论


    # ——内容看点——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 去美国投资考察的目的是什么？

    2. 如何看项目和投项目？


    # 一、美国考察的目的


    我们带大家来美国看项目的目的，不是兜售这些项目，而是希望大家掌握看项目的技巧。


    因为我们每个人的行业都不同，但是我们看的项目往往横跨多个行业，所以不可能做到每个项目都能看懂，但是我们依然可以通过看项目，对美国的整个创新生产更深入的了解。


    所以，我对我们的团员提3点要求：


    # 第一，通过看项目，学会分析企业。


    虽然各个行业的企业会有不同的地方，但是也有相似的地方，掌握这背后的规律，是更重要的。


    # 第二，要学会和企业洽谈投资和合作。


    我们不光是看项目，我们要实际的话，就必须要实际地去跟对方接触，真正达成合作，才是达到了最终的目的。


    # 第三，我们要学会融入对方的商业体系和商业群体。


    我们也一直强调，中国的经济体量已经成为世界第二大，但是我们和世界第一大的美国，在经济上仍然只是以贸易为主，缺乏更深入的商业合作。


    # 二、如何看项目？


    我们都知道，看项目会参加路演，其实路演的价值远没有传说中的那么大，所谓30秒钟电梯测试就决定一个项目要不要投，反正作为投资人来讲，我从来没有听了别人介绍30秒钟项目，就决定投还是不投，那也太不慎重了。


    所以我认为：


    路演最大的用处是先混个脸熟，和对方建立交流，聊聊天，拿一些基本项目资料，自己基于对对方的初步了解，进一步地深入挖掘作研究，这个基本功是非常重要的。


    自己研究什么呢？


    # 第一，是看技术。


    因为我们都知道，美国相对完善的商业程度比较高，包括双长期模式，从拜杜法案以来，已经执行了很长时间，美国有一大批成熟的，专门做技术转化的，懂科技的企业家。而且他们的信用相当好，所以在看项目的时候，和中国是反过来的：


    # 第二，也是要看人。


    在美国看人，我们说第一我们可以看看他们的董事会成员是谁，当然我们在美国看项目的时候，有时候项目介绍会主动地提，说我的天使投资人是谁，我的顾问是谁。


    # 三、如何深入了解项目？


    至于说前面和对方互动过了以后，再了解了充分的资料，但是并不代表你对这个公司就足够了解了，因为了解更多的东西，需要对方提供相对保密的信息给你，这时候就涉及到一个关键环节，就是要签保密协议。


    我们一般习惯，是来回交流一两轮以后就会主动提出我对你的公司有兴趣，希望跟你签保密协议，国外叫 NDA, Non-Disclosure Agreement。'
