  md: '# 219 | 工业机器人：现代机器人之父Rodney Brooks


    219 | 工业机器人：现代机器。. ↓


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 为什么 Rodney Brooks 被称为机器人教父？

    2. 工业机器人智能化的发展趋势是什么？


    不知你是否看过一部纪录片《Fast, Cheap, and Out of Control》，中文译名叫《快速、廉价和失控》，这部片子里讲述了4位不同领域从业者的故事。


    其中有一位机器人科学家，他说，未来的事物，都会拥有一个 Agent，也就是“媒介”。


    人们可以通过这个媒介，例如一扇门、淋浴喷头、电灯等等，跟它们语音互动。你想要关门，只需要和门说一声就可以，如果你想要关灯，也可以直接关灯。这种媒介还可以记住你和你的使用习惯。


    这位预言未来的科学家，就是有“工业机器人教父”之称的 Rodney Brooks，也就是 iRobot 和 Rethink Robotics 这两家机器人公司的创始人。而且，从1997年到2007年的10年间，他还是麻省理工学院计算科学与人工智能实验室，CSAIL
    的主任。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_51_0.png)


    Rodney Brooks 曾经在 TED 演讲“为什么我们需要依赖机器人”里提到一个故事，说的是他第一次到生产车间里和工人<|start|>交流的时候，其中问的一个问题是：


    > 你们想不想让你们的孩子在工厂里工作？


    结果所有工人都回答说：


    +   不想。


    因为他们想让自己的孩子有份比较好的工作。


    实际上，是没有人喜欢做重复的枯燥的工作的，所以在未来，那些可复制的，有清晰规则的工作，都会更多地使用工业机器人，而人就会被解放出来去做更有意义的事儿。


    # 一、MIT 计算科学与人工智能实验室


    言归正传，首先我们要说一下，现在大部分人一谈到麻省理工学院一些著名的实验室的时候，就会脱口而出 MIT 媒体实验室。确实，这家实验室很厉害。


    但是，其实比媒体实验室更出名的，就是我们刚才说的麻省理工计算机科学与人工智能实验室，英文简称 CSAIL。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_51_1.png)


    为什么这么说呢？


    一是这个实验室比媒体实验室诞生的更早，它在1963年就成立了，而 MIT 媒体实验室是在1980年才成立的。而且它也是全球最重要的 AI 和机器人技术研究中心之一，同时也是麻省理工最大的实验室。在机器人，计算机视觉，神经网络等方面都取得了瞩目的成就。


    比如，这个实验室研发了可吞服的微型折叠机器人：通过把这种机器人放进胶囊里，胶囊被吞服后，可以进入病人的胃里，然后机器人从胶囊里出来，进行胃部的伤口处理，或者把不小心误食的东西去除。


    这一讲我们要说到的 iRobot 机器人公司，就是从这个实验室里孵化出来的。


    # 二、机器人教父 Rodney Brooks


    下面，我们介绍一下 Rodney Brooks。


    他于1954年出生在澳大利亚，从小就是一副极客的形象，他总是有自己的想法，并且努力把想法变成现实。据说在他8岁的时候就会做一些电路实验，而他的妈妈担心他和普通孩子差异太明显，所以总劝他在吃饭前多看看小孩子看的电视节目，而不是去思考或者做一些奇怪的东西出来。


    后来他尝试自己做了一个“井字游戏棋” 的小游戏，通过编程让他的好朋友和计算机进行对战，据说他的好朋友们在他编写的程序面前都败下阵来，而那一年，他还不到13岁。


    Rodney 最早的机器人研究灵感，是来自大自然。他在观察蚂蚁群活动的时候发现，就算是6条腿的蚂蚁，爬行的时候偶尔也会摔倒，那为什么人们就一定要造出不会摔倒的机器人呢？


    于是，Rodney 就自己动手研发了一种“可以行走，也可能将会摔倒”的机器人，并给它取了一个霸气的名字——成吉思汗。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_51_2.png)


    这款机器人在现在看来，几乎没有任何智能可言，只是杠杆和齿轮的组合，而且只能完成走路这一个动作。但是 Rodney 完全不在意成吉思汗是否显得笨拙，因为对于他而言，机器和生物一样，需要一个演化的过程。


    我们现在来看，他后续的研究经历也验证了这句话。


    # 三、iRobot 机器人公司


    在1981年，Rodney 从斯坦福大学毕业，获得计算机科学专业的博士学位。


    那个时候，大多数机器人的应用都停留在科研、制造和军事领域，但他认为，任何领域都应该使用机器人才对，即便是 Царство百岁家百之里。他希望制造出“不一定要非常智能，但是一定能解决实际问题”的机器人。


    所以，在1990年，他创立了现在非常有名的 iRobot 公司，也许你对这家公司不熟，但是很多人熟悉的扫地机器人 Roomba 就是这家公司的产品，而且，这家公司还研发了各种军用、警用、和救援机器人。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_51_3.png)


    比如，在当年的美国9·11事件当晚，小规模的塌陷和爆炸还时有发生，消防人员是不敢贸然进入双子座的废墟的，当时他们就派了一款名叫 PackBot 的机器人深入地下，搜索生还者。而这个
    PackBot，就是 iRobot 公司研发的军用机器人之一。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_51_4.png)


    目前，全球有超过5000个 PackBot 用在了军事和国防领域，它已经成为美军最重要的军用机器人之一。


    # 四、Rethink Robotics 机器人公司


    顺便说一下，Rodney Brooks 曾经在他的个人博客里，这样描述人与机器的关系：


    > 我们和机器人就像是深海中的潜水员和一'
  merge: -1
  img_proc: true
- pgno: 52
  md: '我们和机器就像是深海中的潜水员和一只章鱼，潜水员和章鱼互相注视着对方，但是都会感觉到一丝不安全感，甚至恐惧感，所以没办法真正融入当下的场景。


    2007年末，在担任麻省理工 CSAIL 实验室主任10年后，Rodney 离开了 MIT。创办了 Rethink Robotics 机器人公司，因为他想转变传统机器人在人们心中的形象。后来，这家公司发布了两款机器人
    Baxter 和 Sawyer，可以说，就是这两个机器人开启了智能工业机器人的新时代。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_52_0.png)


    为什么这么说呢？下面我详细解释。


    就拿 Baxter 这个机器人来说，它一般主要用于完成生产线上料、机器操控、包装和材料处理这些小批量、多品种的生产任务，这么说可能你觉得跟传统的工业机器人也没什么区别。


    但是和传统的工业机器人不一样的是，Baxter 有一个非常有意思的功能，就是它可以通过显示屏呈现表情。


    +   - 如果工作一切顺利，它就会微笑；

    - 如果工作出错了，它会皱眉；

    - 如果它对你输入的指令产生疑感，它就会扬起眉毛；

    - 如果它想从你的手里接过一样东西，眼睛先会朝着你所在的方向看，然后才有“拿东西”这个动作。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_52_1.png)


    而且，Baxter 在设计中除了增加了人的情绪表情外，还配备了力量传感器，这让它能有效控制力量的输出和更好地完成位置的控制，它的移动更加温和，碰撞时可以在短时间内迅速减少冲击力，避免高速的动作对人造成伤害。


    这个跟我们平常在工厂里看见的那种看着非常笨重，但动作仿佛机械化的冷冰冰的机器臂就很不一样了。


    当然，Baxter 的局限性也是非常明显的。


    因为出于安全考虑，Baxter 的最后一节手臂采用了塑料材质，所以在精度、额定负载方面，都很难达到传统工业机器人的应用标准。


    为了弥补这个缺陷，Rethink Robotics 在 2015年初发布了第二款机器人 Sawyer，除了硬件升级以外，Sawyer 还具有了类似人类的自主学习能力。


    举例来说，你想让 Sawyer 完成从 A 到 B 的移动，并且抓起在 B 的一只水杯。


    第一次，你要做的就是手把手教它，用手来拖动机器人手臂从 A 点到 B 点，然后抬起机械组帮它把水杯抓起来，就像我们“手把手”教小孩走路一样。


    整个演示的路径，都会被机器人自动记录下来，然后通过路径规划，再持续修正，最终找到最优的路径。之后它就能按照这个路径，自己完成这个操作了。


    同时，利用自带的 Cognex 摄像头和机器学习算法，Sawyer 还可以轻松识别物体位置，以及环境的变化，这就让物件检测变得更加简单。


    比如在分拣工作中，想让机器人把散乱的物品装入一个容器里。对于传统工业机器人来说，虽然它们也能完成这个任务，但前提是纸箱的位置是不能改变的，一旦变动了，就要人来重新测量，然后输入到控制程序里。


    而对于 Sawyer 来说，即使容器的位置发生了改变，它也能自动获取相关信息，改变作业路径，减少错误率。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_52_2.png)


    值得一提的是，在工业4.0时代，面对“多订单，小批量”的柔性生产模式，对机器人编程和调试的更改频率一定会增加。而 Sawyer 配套了软件交互平台 Intera，在这个平台上，代码被内嵌到每一个图形模块中，设计人员只需用类似拼图的方式，就能完成创建新程序、修改调试，以及监控机器人的工作，可以说非常方便。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_52_3.png)


    可以说，Rodney 通过 Rethink Robotics 机器人公司，践行了他的“人与机器和谐共处”的理念，Baxter 和 Sawyer 这两款机器人，也为未来智能化、个性化的工业机器人指明了方向。


    顺便多说一句：


    我一直说，机器人不太可能全面取代人类，但是可以和人类一起紧密协作。如果在这个协作过程中，人与机器之间有良好互动体验的话，就能一改人们对于传统工业机器人的固有印象，不仅工作能更高效，而且也能更加愉快地实现协作。


    # ——► 课程小结 ◄——


    我们介绍了工业机器人教父 Rodney Brooks 和他的机器人理念，以及 iRobot 和 Rethink Robotics 研发的机器人。


    希望你掌握以下三点：


    +   第一，通过 Rodney 在走访美国工厂的经历可以看出，没有人会喜欢做重复枯燥的工作，工业机器人在未来必然会更多地取代人力，而人类会被解放出来去做更有意义的事儿。

    第二，从最初的成吉思汗机器人，然后到 iRobot 推出的各种产品，再到 Baxter 和 Sawyer，机器人的功能越来越多样，智能水平也越来越高，未来在各个行业，都会出现机器人的身影。

    第三，秉着“人与机器和谐共处”的理念，Rodney 不仅让 iRobot 扫地机器人走进普通家庭，而且开发了具有自主学习能力，有情绪表现的工业机器人，它们正在重构工业机器人的形象，而且还指明了机器人智能化，个性化的发展方向。


    # ——► 课后思考题 ◄——


    你体验过的互动界面最好的机器人是哪一个，说说你跟它的互动经历吧！或者你有参观过机器人流水线吗？

    分享一下你的感受。


    # 划重点


    > 机器人不太可能全面取代人类，但是可以和人类一起紧密协作。如果在这个协作过程中，人与机器之间有良好互动体验的话，就能一改人们对于传统工业机器人的固有印象，不仅工作能更高效，而且也能更加愉快地实现协作。


    王煜全

