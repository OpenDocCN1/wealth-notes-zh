  md: '# 复习手册 | 重大科技突破


    王煜全


    这是我们最后的“年度知识回顾”，帮你盘点和梳理全年的关键知识点。


    # ——► 重大科技突破 ◄——


    第四大模块的主题是“重大科技突破”，我们分别讲解了11个值得你关注的热门领域。


    我们讲的都是硬科技，为你介绍未来对世界发展产生深远影响，值得持续关注和探索的科技领域最新进展，以及属于你的机会。


    # 1) 下一代计算


    1.传统经典计算机的发展是基于摩尔定律的，它面临着一个物理极限。于是，人们也在量子计算机、光子计算机和DNA计算机等几个方向上探索。下一代计算机将来必会取代现有计算机系统，很有可能是两者同时共存，并且与云计算相结合，发挥各自的优势。


    不管你是不是IT从业者，它的发展都值得你关注。如果它的技术取得了突破，会为IT产业以及IT技术在其它产业上的应用，带来很多意想不到的机会。


    2.量子计算机是基础架构角度的创新，各大IT巨头都在争夺“量子霸权”，希望使自己在产业竞争中优先占据有利地位，但在目前，量子计算机基本上不是样机就是测试芯片，它还有很长的路要走。而光子计算机是对现有计算机的补充，相对于量子计算机来说，可能更快实现实用化。而DNA生物计算机也有望极大降低大规模运算的成本。特别是大规模储存的成本。


    3.D-Wave和Optalysys这两家公司，分别在量子计算机和光子计算机领域率先上了商业化的道路。特别是D-Wave，它在10多年前发布了第一台量子计算原型机之后，引发了众多IT巨头开始尝试商业化的道路，未来从研发到商业化的成果转周期会越来越短。


