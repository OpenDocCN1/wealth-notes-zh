  md: '地区之后重新恢复了活力，而且很快就形成了一个良好的创新生态。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_196_0.png)


    随着128公路的复兴，波士顿的肯德尔广场逐渐发展成为以生物技术为中心的创新社区。


    肯德尔广场，距离哈佛和MIT很近，同时大批的科技创业公司聚集在附近，而且广场提供了便利的基础设施，随便找把椅子就能干活，整个社区人们的交流很方便，吸引了更多不同的技术公司和科技企业家。


    比如，亚马逊就把整个移动开发团队搬了过来，谷歌在这里斥建了一整栋新的办公楼，还有很多医药企业也不断往里挤，加速了肯德尔广场成为创新中心。


    通过我总结的四点，你就能感受到：


    波士顿之所以能繁荣起来，主要就是因为它有知名的高校提供前沿科技，有知名的大公司培养企业人才，有创新机构孵化创新企业，最后形成一个科技集群的创新生态，吸引更多人才和资源，汇聚形成全球知名的创新沃士。


    # 三、创新区资本支持的演变


    我们刚才讲了创新区的四个要素，其实对于创新企业还有一个不可或缺的要素，就是资本支持。


    波士顿在這方面也毫不逊色，因为它原有的金融科技产业非常发达，其中有很多优秀的风险投资机构，比如昨天介绍的著名投资人 Carmichael 的老东家北桥基金（North
    Bridge）、Polaris、Vintage Point、Khosla ventures 等等。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_196_1.png)


    传统风险投资更擅长投“软”的行业，因为传统风险投资是伴随软件业和互联网业发展起来的，这些产业不需要以长期的科研和实验为基础，可以快速迭代，相对来说更容易评估风险。如果要投硬科技，传统风险投资就难以准确判断价值，于是也不敢轻易进场。


    但是随着全球的科技进入硬科技时代，我们正处于一个产业协作的生态，好的风险投资是真正愿意伴随企业一起成长。


    Carmichael 为了解决这个问题，在2017年成立了专门投资硬科技和实体产业的风险投资基金Material Impact。


    风险投资现在所扮演的角色更多的是“连接者”，帮助企业家和科学家建立联系，共同促成科研成果产品化。尽管投资周期长，但产品一旦成功上市，这个企业就极有可能实现指数级成长，迅速发展成大型跨国企业。


    # 四、产融资本新模式


    我们海银资本在探索资本配合科技创新产业的产融资本新模式上，应该说也处于世界前列，我们主要是针对新兴科技创新企业，为解决它们发展的瓶颈问题：


    +   一是帮助企业在研发完成后实现量产；

    二是帮助企业资本运作和上市。


    具体操作：


    首先是借助中国制造的优势和地方政府的支持，帮助全球创新企业在中国实现量产；

    其次是用有条件投资的方式，为企业的产品量产和市场推广提供充足的资金支持；

    最后，帮助这些企业在中国香港上市。利用中国香港作为国际金融中心，吸引更多美国科技创新企业在香港上市，同时也会促成中美科技产业的深度合作，最后还能为中国香港赢得巨大的发展机遇。


    所以，我们正在以我们投资的一批公司为样本，系统地实施我们的资本运作方案，在我们的大力推动下，中风急救公司Cerevast、无线充电公司 WiTricity
    等好几个公司的董事会都已经批准了在香港上市的方案，这些公司有望于3年内实现上市。


    # —— 课程小结 ——


    最后总结一下，这一讲我为你介绍了美国的创新区。


    希望你能够掌握以下三点：


    第一，创新区是一种支持创新的综合模式，往往聚集了研发机构、高校、创业企业、大企业、孵化器及金融辅助机构等，提供更加便利完善的公共服务，大大增加了科技创新密度，激发了创新区活跃的生命力，让它成为各种创新企业成长的沃土。


    第二，创新区能繁荣起来，是因为区域内的知名高校提供前沿科技，知名大公司培养职业人才，创新机构提供创业孵化服务，风险投资提供资本和人脉，这一全加在一起，形成一个科技集群的创新生态，吸引更多人才和资源聚集，帮助科技创新企业进一步发展。


    第三，全球科技进入硬科技创新时代，风险投资人更需要扮演“连接者”的角色，帮助企业家和科学家建立联系，共同促成科研成果产品化。目前我们探索的产融资本运作方案，就是帮助新兴科技企业尽快实现量产，并且在中国香港上市，充分发挥企业家，投资家和科学家在科技创新生态中的重要作用。


    # —— 课后思考题 ——


    那这一讲我给你留的思考题是：你去过哪些美国创新区呢？跟大家分享下体验。如果没有去过的话，你周围有哪些创新孵化区，或者加速器呢？你认为它们能为创新企业提供什么帮助呢？


    欢迎在留言区分享你的观点。


    # —— 重要信息 ——


    2018年10月，我们将再次启动前哨创新投资考察，深入美国西南四大创新中心——得克萨斯州的休斯顿和奥斯汀、科罗拉多州的丹佛、亚利桑那州的凤凰城，深度探测科技强国的创新密码，走访那里的顶尖高校、对话创新孵化器和科技创新前沿的企业、考察美国创新生态，构建中美合作桥梁。走得越深，我们就越能看到来自美国的创新原力，越能看到那些可以改变未来的创业项目，越能看到中国企业家在全球创新生态中的位置和发力点。


    如果你不错过这次深入了解美国创新区的机会，请关注我们的微信公众号“全球风口”，回复“游学”，获取活动的报名链接，与我们一起同行。2018年10月，期待在美国见到你。


    王煜全 我是王煜全，你的全球科技前哨侦察兵，咱们下一讲见。


