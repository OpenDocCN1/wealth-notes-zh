  md: '# 203 | 下一代计算：量子霸权争夺战


    # —— ◆ 通知 ◆ ——


    在这一讲的内容开始之前，先告诉你一个消息，之前我在前嗨大会和课程里都提到过的前嗨的科技特训营，2018年的报名已经开始了，5月10日之前报名的还可以享受早鸟价。


    这一次的科技特训营，除了我会和你面对面分析全球的科技创新生态以外，我还邀请了不同领域的大咖导师一起来解读，希望能够帮你抓住未来的科技红利，微信查询我的公众号【全球风口】，点击“科技营”就可以报名。


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下 3个问题的答案：


    +   1. 量子计算机是什么？

    2. 为何IT巨头纷纷争夺“量子霸权”？

    3. 传统计算机会被颠覆吗？


    从这一讲开始，我们就进入第四季度课程的讲解了，第四季度，我们要讲硬科技，讲未来几年里有可能产生重生大突破的科技领域，第一个话题是“下一代计算”。


    # 一、量子计算机


    相信你或多或少已经听说过“量子计算”这个名词了。


    2018年的1月，跟我一起逛 CES 展的朋友肯定都记得，Intel 发布了49个量子比特的测试芯片 Tangle Lake；

    3月，谷歌发布了72个量子比特的芯片 Bristlecone；

    2017年12月的时候，IBM 发布了50个量子比特的 IBM Q 系统；

    4月初，微软也曝光了自己的量子计算机研究进展。


    可以说，他们都在争夺“量子霸权”。


    所谓量子比特，英文叫 Qubit，它是量子信息的计算单位。我们都知道，传统的计算机都是使用二进制的，一个比特就是0或者1，而量子比特也是使用二进制，但它特别就特别在一个量子比特可以同时是0和1，这就叫量子叠加，英文是
    Superposition，所以两个量子比特，就可以同时表示00、01、10、11这四个值了。


    而所谓的“量子霸权”，英文叫 Quantum Supremacy，这是在2011年的时候，美国加州理工大学的理论物理学家 John Preskill 提出的。


    意思就是：


    > 当量子计算机在某些问题的计算速度上超越传统结构的最快超级计算机的时候，“量子霸权”的时代就到来了。


    那么，谁夺取了“量子霸权”，谁就掌握了技术制高点，从而就获得了量子计算机的标准制定权和舆论主导权，在产业竞争中就优先占据了有利的地位。


    这个产业地位到底有多重要呢？


    你想一想 Intel 在 PC 产业中的霸主地位，就知道这样的产业制高点有多么重要了，这也是 IT 巨头们争相研究并公布量子计算机进展的根本原因。


    相信你肯定也很好奇，量子比特听起来好像也没啥，还是二进制啊？但怎么就是技术制高点呢？它和咱们现在用的电脑有啥区别呢？还有新闻说它会很快颠覆传统计算机，这是真的吗？


    这里要强调一下，咱们一定要明确的是，传统计算机的架构还是会存在很长时间的。


    因为量子计算机只是下一代计算的研究方向之一，其他创新性的计算机也一直在探索中，其中比较受人瞩目的还包括了光子计算机、生物 DNA 计算机等等。这些内容我们放在第四讲里详细说。


    # 二、经典计算机的瓶颈


    我相信你心里肯定会问，我们现在的计算机遇到什么问题了呢？为啥这么多巨头要大力研发下一代计算呢？


    要说最根本的原因，其实就是，基于大规模集成电路的经典计算机芯片发展存在物理极限，计算速度的进步就会跟不上“摩尔定律”的要求了。


    我们都熟悉摩尔定律，它是1965年由 Intel 的创始人之一的戈登·摩尔观察并总结出来的，意思是说集成电路的晶体管密度每18个月就会翻一番，计算能力也会翻一番，这个规律曾经适用了几十年。


    但这种“堆积”晶体管的做法，终将面临一个无法跨越的物理极限，那就是再缩小也无法突破原子大小的尺度。


    而且实际上，人们也一直在尝试用各种方法提高计算速度和处理效率。除了增加晶体管密度以外，还有并行计算和异构计算这两种方法。


    +   1. 并行化计算


    首先是并行计算，它的核心就是“分而治之”的思想，利用多核处理器的架构，把复杂的计算任务分解到多个处理器或计算机上处理，增加效率。


    为了能够提高处理复杂问题的计算效率，比如核物理模拟、化学反应模拟、气候预测、基因工程这些难以做实验的难题，就出现了超级计算机，比如咱们国家的神威·太湖之光，就用了4万多块处理器，占地600多平方米。


    但是，并行计算的方法也有局限性，就是对于容易分解、有良好并行算法的问题很有优势，但对本身就难以分解的问题，即使是超级计算机也无能为力。


    就拿大数分解这个问题来说，这个问题就是无法用并行计算解决的。


    那么什么是大数分解呢？


    举个例子，比如15这个两位数，背过乘法口诀的我们就知道，1乘15、3乘5，结果都是15，1和15，3和5，就是15的分解因子。


    假如现在有一个200位的大数，而且不是素数，也就是分解因子不只是有1和本身，它的分解因子会有多少个呢？


    就是这个问题，假如使用穷举法，就是一个个去试，即使是神威·太湖之光，得到所有分解因子也要用超过1000年。


    经典计算机没有高效的算法解决大数分解问题，基于这个原理，1977年，Ron Rivest、Adi Shamirh 和 LenAdleman 三个人在 MIT
    开发出了著名的 RSA 加密算法，成了信息安全和密码学的基石。


    顺便说一句，也是包括比特币在内的电子货币的基础。


    +   2. 异构计算


    其次，就是异构计算了，其实它也是一种并行计算，我们都知道，计算都是在芯片的集成电路中完成的，但是因为芯片架构的不同，不同芯片处理不同计算的性能也不一样，比如
    CPU 要处理更多的任务，需要通用性，而 GPU 就是更多针对于图形处理，还有协处理器、DSP 等其他计算单元，把它们组合到一起，就叫“异构计算”。


    这样的好处就是，可以持续利用现有计算架构，只需要增加那些新的硬件，就能持续提高计算能力。


    举个例子：


    实际上人工智能芯片就属于异构计算的一种，比如咱们中国的寒武纪就是这个领域的高水平代表。


    你肯定知道华为的“人工智能芯片”麒麟970，其里面就集成了寒武纪的神经网络芯片“寒武纪1A”，就是它让麒麟970在拍照识别、音频解析等计算能力上比传统手机芯片性能提高了近百倍。


    2018年5月3号，寒武纪还发布了云端智能芯片 MLU100，宣布开始进军用于服务器上的高端芯片了。关于寒武纪的内容，我会在第二节里详细介绍。


    这里要多说一句，在人工智能芯片领域，'
