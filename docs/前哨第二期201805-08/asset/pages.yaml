  md: '# 彩蛋 | 机器人：有些工作终将被替代


    ——内容看点——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 哪些领域的工作正在被机器人替代？

    2. 哪些领域最适合做机器人创业？


    2018年7月，《纽约时报》有一篇文章评论，声称：


    > 中国肤浅地追求不成熟的高科技显得很不理智。


    那篇文章提到一款上菜机器人只能把菜送到桌前，再由人把菜端上桌子，文章作者认为这是中国人盲目追捧机器人的表现，只迷恋技术表面的炫酷，实际并没有发挥机器人的价值。


    对于这篇文章的观点，我并不完全认同。


    从我自己接触过的中国企业家来看，中国人比美国人更愿意尝试新技术，而且不只是在态度上积极拥抱新技术，他们还在不断尝试各种新技术的落地，可以说，是实实在在地推进了中国整体的技术进步。要知道，再新的技术，都要和场景结合，才能发挥作用。


    这一讲，我就跟你介绍利用服务机器人解决生活难题的实例，分别是我的好朋友李沐栎创立的药师机器人“小乔”和支涛创立的酒店服务机器人。


    目前，制造机器人并不困难，难的是发掘垂直领域的需求，让机器人切实解决行业痛点。此外，我还会为你介绍餐饮机器人，让你看到在全球范围内，机器人正在取代那些重复性的劳动，虽然有很多劳动看起来很复杂，所以，机器人的到来将会让我们的生活更加高效和便捷。


    # 一、酒店服务机器人


    既然我们讲服务机器人，那我们就先来讲讲对服务需求最多的一个领域，酒店服务业，感受一下这个行业是如何发挥机器人的价值的。


    我们要说的第一款机器人，是云迹科技公司开发的酒店服务机器人，下面你就能看到它的照片，这个机器人高1米左右，是个桶型的机器人，上面有液晶屏幕，下面有个发光的光圈，它走路时还不会停地说“我就是机器人服务员”，_attrs_给你一种萌萌的感觉。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_171_0.png)


    如果你入住酒店，凌晨1点口渴想喝饮料，但冰箱里已经没有了，这时候你即使拨打了客服电话，也要等很长时间服务员才能送上来，因为晚上大多数员工都去休息了。但这时候如果有服务机器人，你就不用等太久了。


    基于这种酒店服务的场景，云迹对酒店服务机器人的外观进行了设计。


    做成圆桶外观有它的道理，因为作为服务机器人，最关键的是移动准确、性能稳定、服务有保障。满足这三点，是不需要花里胡哨的外形。设计要服务于功能，不要为了设计而设计，关键是提升用户的体验。


    云迹科技公司目前是酒店服务行业领跑者，通过4年来的实践，积累了大量的酒店服务数据，同时在室内定位导航、机器人移动等技术上处于国内领先水平。


    尤其是在机器人移动能力上，云迹开发了机器人底盘，主要承载着机器人的定位、导航、避障、移动等基础功能，内部集成了多种传感器，然后通过程序实现融合控制。


    云迹的底盘能适用室内的多种地形，在不同材质的地板上通行无阻，同时也结合人工智能实现了底盘智能化，具备跨障和避障能力。目前云迹在底盘上已经申请了100余项专利，构成云迹的技术壁垒。


    在2016年1月，云迹的酒店机器人第一次正式“上岗”，它是目前国内唯一一款“可自主乘坐电梯的服务机器人”。短短1年，到2017年，它已经成为了酒店机器人应用领域的第—名。


    目前云迹酒店机器人在300多家酒店中担任服务工作，累计服务超过19万人次。如果你下次入住的是希尔顿、喜来登、威斯汀等知名酒店，说不定，給你提供毛毯或送饮料的，就是酒店服务机器人。


    # 二、药师机器人“小乔”


    说完酒店服务机器人，跟你介绍药店机器人。


    比如，你感觉身体不舒服，但是又懒得去医院，于是想在附近药店先买点药。但是问题是，你不确定该吃什么药，而且基层药店根本配备不了足够数量的职业药师。


    为了解决这一痛点，李沐栎的小乔机器人就开发了一款药师机器人，它的名称和公司名称一样，就叫“小乔”，这是中国医药领域第一款人工智能机器人。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_171_1.png)


    目前“小乔”可以支持患者咨询10多种常见病和多发病。它的能力，相当于一名拥有数十年工作经验的药师，你可以在它胸前的触控屏上操作，或直接询问它关于你的疾病的详情，它就能告诉你，目前你该用哪一种药，以及怎么服药。它还会详细询问你的症状、病史，然后根据病例库和药学知识库，为你分析病因，推荐给你一套安全合理的用药方案。'
