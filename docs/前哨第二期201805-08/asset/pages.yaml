  md: '# 202 | 前哨大会复盘：资本如何助推未来产业布局


    202 | 前哨大会复盘：资本...


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    +   1. 传统的资本形式是如何产生的？

    2. 面对积木式创新，资本该如何调整？


    我们知道，全球最大的投行基本上都是100多年前诞生的，像摩根士丹利、摩根大通等等。


    在投行之后，又迎来了风险投资的发展，那是什么原因呢？


    因为每个时代的资本形式都是为了能够支持当时的产业发展。


    而我在前几讲中给你分析过了，我今天迎来了积木式创新的崭新时代，这个时代又需要什么样的资本形式呢？


    我将在这一讲里为你解读。


    # 一、常见的资本形式


    在100多年前，科技创新都是一些伟大的突破，当时只要有足够的资本，来形成量产和高效复制的能力，就可以缔造一个大企业。


    像铺设铁路和海底光缆，开发石油或者制造汽车这类工程，都是需要巨大的资本投入，才能完成科技创新转化，并且降低成本，实现对市场的覆盖，从而满足社会的需求，并给投资者带来丰厚的回报。


    当时的投资银行，通过承销债券和为企业发行证券等方式，为大企业或者大型项目筹集了巨额资金，立下了汗马功劳。


    后来随着软件、IT、互联网的兴起，企业，特别是拥有高新技术的初创企业的经营特点发生了改变，一项技术要转化为实际产品，需要一定的研发和用户积累周期，而产品是否能转化成功、并为市场所接受，是不确定的。


    因此，投资风险比较高，投对了回报巨大，投错了血本无归。并且随着企业不断发展，它还需要持续的资金支持。


    这个时候，企业需要的不是一次性巨额资金，风险投资就应运而生了，风险投资是分阶段地持续投入，你完成一个阶段的指标了，我就给你一个阶段的投入。风险投资的这两个特点，即承担高风险和分阶段的投入，是和当时企业的需求相对应的。


    # 二、资本需求的转变


    但是现在市场又变了，需求也跟着发生了变化。


    我在上一讲的时候讲到：


    现在的高科技专利，基本上是在小公司手里了，小公司没有大公司那样完备的研发能力和足够的支撑能力，于是到外部寻找第三方来协作，从研发、生产到营销，每个小公司都专注自己擅长的业务，形成了我们一直强调的积木式创新，一种新的生态。


    但是，之前形成的资本形式，投行也好、风险投资也好，已经不足以支持这个新的生态了。


    为什么呢？


    我们现在处于的这个产业协作的生态，既要考虑多方协作，也要考虑协作者能够长期合作，保证协作者的利益能够长期共享。但是大型投行也好，风险投资也好，都不能解决产业协作问题。


    而且现在企业发展，各个阶段需要各个阶段的支持，现在的资本运作模式，天使投资、风险投资、PE 投资等，都只是关注企业成长周期中的一个阶段，各阶段之间是脱节的、利益是割裂的，各阶段的投资者都没有长期为企业提供资源支持的意愿。


    那传统的股票市场能满足要求吗？


    我认为也不能。


    为什么呢？


    因为对于投资人来说，投资都是希望获得回报的，他们真正关心的，是如何收回自己的投资并获得利润。所以股票市场会建立一整套的制度，来保障投资者的利益。


    这些制度的出发点是好的，但是现在在全球都是小公司来主导科技创新，而小公司要想在现有的股市制度下获得认可，往往需要很长的时间，不光要有科技，要产品成型，甚至要已经获得市场的认可，甚至要有足够的收入利润，才能上市，从而获得资金支持。


    这对小公司来说就是一个两难处境，本来我是需要资金来支持，才能尽快把科研转化成产品、更好地实现收入利润，现在你在又说我要有了收入利润才能上市融资，这就变成了一个悖论。


    反之，很多大公司本身已经没有先进科技了，但是因为有资本市场的支持，它可以不断地去并购那些拥有先进科技，但是眼当前暂时还没有做起来的小公司，用这些小公司的科技来充实自己的产品线，让自己能够活得更长一点。


    打个不太恰当的比喻：


    就相当于一个老年人不断地用年轻人的血液来延续自己的生命，我认为这和科技创新的方向是背道而驰的。一个真正好的资本市场应该是支持创新，站在年轻的创新企业一边上的。


    当然，这几年全球很多地方的股市也在不断地做调整。比如香港股市，已经可以让没有利润的企业上市了，这是可喜的进步。但他们对企业的市值还有比较高的要求，我们期待资本市场的更积极行动，进一步降低先进科技企业进入资本市场的门槛。


    # 三、崭新的投资模式


    除此之外，其实我认为还可以做得更好一点，我们需要这样一种资本形式，就是更加系统化地，从资本到资源，为创新企业提供更长期、更全面的支持。


    这其实也是我们的使命。


    那么，我们应该如何打造这样的崭新的投资模式，从而支持积木式创新这个新产业模式呢？我认为，主要有以下四个方面：


    第一，科技创新出现了井喷，意味着需要机构和大企业合作为天使投资的主体，对科技创新从产业的源头就开始提前布局。


    传统的投资模式里，因为回报周期太长、风险太高，天使投资基金基本上都是个人行为，基本没有机构在做。但其实很多小项目，到最后会被整合到大公司里面去。因此，有明确产业方向的大公司，是可以利用自己强大的整合创新能力，成为天使投资的战略盟友的。


    所以我认为，应该是以机构的方式，整合相关的大企业的产业资本，对未来的科技作为一个完整的布局，这个基金不是以利润为导向，而是以是否全面覆盖了科技前沿的要点为衡量标准。而它的出资人，应该是在产业前沿加强布局，希望能够不错过前沿科技，甚至将来有机会实现并购的大企业。


    第二，投资者应该成为企业合作的促成者，企业成长需要的外部资源的提供者和介绍者。


    吴晓波老师一直在提倡“产融资本”的概念，我们非常认同。


    在中国，成功的企业家往往有渴求与更多高科技企业合作，以及相关产业领域投资的双重需求。而以投资为纽带，也更容易帮助科技企业和制造企业建立信任、高效对接。


    我们也在我们的科技特训营的学员中，利用中国企业家的钱组建了一支新的投资基金，关键其实不是看中他们的钱，而是看重他们的产业链能力，我们未来更多地和国际科技企业的对接就会以他们为重点。


    第三，要帮助蓬勃发展的硬科技创新解决瓶颈问题。


    大多数硬科技企业不是死在产品研发的路上，而是死在研发完却不能量产的蘑菇之'
