    # 三、中国发展页岩气的必要性


    说完美国的情况，那对于中国来说，我们为什么也需要发展页岩气呢？


    这就不得不说说目前我们的能源结构的问题了。


    我们都知道，随着中国经济的不断发展，对能源的需求增速也非常猛。现在中国的总体碳排放量几乎是美国的两倍，经济蓬勃发展是一方面，但能源结构的不合理更是主要原因。'
