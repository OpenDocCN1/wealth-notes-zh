  md: '# 243 | 新材料：石墨烯


    我们这个模块的主题是新材料。


    材料行业，可以说是既历史悠久，又极富发展潜力的行业。


    为什么这么说呢？


    你一定听说过，考古学上划分人类发展史，都是按照当时人类使用的材料来命名的，比如，石器时代、青铜器时代、铁器时代、钢铁时代等。


    可以说，我们人类目前基本把元素周期表里能利用的元素都用到列。


    因为新材料的种类非常多，所以我把这个模块的结构做了一点调整。我们分4节课讲解4种热门的新材料，分别是石墨烯、柔性电子、碳纤维，还有纳米材料。


    尽管有些研发成果还处在实验室阶段，没有进入产业化应用。但我们说，当技术层面的难题解决了，按照“创新上下行”中的“创新下行”的规律，只需要找到合适的需求，或者找到合适的“长板”相互拼接，就能应应用和技术相互促进，推动产业化的新发展。


    这一讲，我们就先讲石墨烯材料，它是材料领域内最热门的研究方向之一。


    你一定在媒体报道里看到过很多关于石墨烯电池的新闻，宣称什么几秒内完成手机充电，几分钟完成电动车充电等等。你肯定也非常期待能尽快用上，但至今没看到应用。这也是这类新闻越来越失信于人的原因。


    咱么这门课的同学都知道，一项新的技术突破到应用落地，就是需要几年甚至十几年的时间，媒体只是为了抓眼球，而我们要看到趋势，寻找到里面的机会。实际上，就目前来看，石墨烯电池的产业化，至少5年内都不会容易实现。


    # 一、神奇的石墨烯材料


    从元素上说，石墨烯的组成就是普通的碳元素，跟石墨和钻石是一样的。区别就在于，它们原子的排列结构有所不同，比如，钻石里的每个碳原子都跟周围的4个碳原子连接在一起，是正四面体结构，所以它特别硬。而石墨，就像一层层覆盖在一起，每一层看起来就跟蜂窝一样，网眼是六边形的结构，所以它就比较软。


    而我们说的石墨烯，实际上就是特别特别薄的石墨，最薄的就是只有一层碳原子的网，所以它也叫做“二维结构”，如果从侧面看，厚度就是原子的直径。简单说1克的石墨烯材料，它的表面积就相当于半个足球场那么大。


    这种材料是目前已知的最薄、最轻，也是最强韧的，它能承受很大的重量，而且几乎完全透光、导电和导热性能都非常优异。


    所以，它的潜在应用场景非常非常多，比如用在复合材料领域，就能制造出特殊性能的塑料、涂料等等。就拿石墨烯涂料来说，它的特點就是无毒环保，能用在载药系统和生物成像诊断的系统里。在节能环保和电子方面，优异的导电和导热特性用途特别大，比如开发新的散热系统，柔性显示设备等等。


    但得到这么薄的结构，可不☁️是一件容易的事情。英国曼彻斯特大学的物理学家安德烈·盖姆教授，和他当时的博士后助手康斯坦丁·诺沃肖洛夫，就是因为发现了石墨烯材料，获得了2010年诺贝尔物理学奖。


    而实际上，石墨烯的发现纯属偶然，在2004年的时候，我们刚才提到的两位科学家，是用透明胶带把一块石墨片反复粘贴和撕开，最终形成了厚度只有0.335纳米的碳原子结构，也就是说，差不多只有一个原子的厚度。


    估计你在学生时代，也有这样的经历，比如在纸上写错字的时候，就会用透明胶带把错字粘掉。


    但谁也没有想到，就是这么一个简单的方法，发现了石墨烯。


    听到这儿，你也许能猜得出来，制造石墨烯的工艺，简单说，就是通过把石墨变薄，不能靠切，也不能靠磨，而要靠不断地粘，把它从石墨上一片一片撕下来，因为石墨结构是由很多层的碳原子网组成的。这个过程需要非常仔细和极度的耐心。因为一不小心，石墨烯“薄膜”就会破损，或者断裂。


    目前，这种方式主要是用来制造多层石墨烯。


    这里补充说几句，虽然我们刚才说石墨烯是一层碳原子网，但实际上，它根据层数的多少，分为单层的、双层的、少层的、多层的，越薄特性就越明显，用处也更大。


    现在，单层石墨烯已经是用小分子合成来制造了。比如利用甲烷，它的分子式是CH4，由1个碳和4个氢原子组成的，用镍或者铜金属作为催化剂，在1000摄氏度的高真空条件下，去掉4个氢原子之后，剩下的碳原子就像搭积木一样，一个一个拼装成了石墨烯的一层“碳膜”。


    但是，必须说明的是，对于单层石墨烯来说，当前还停留在实验室研发阶段，还没有大规模的商业应用案例，全世界范围内，石墨烯的制备与性能水平也差不少。


    而我在开头提到的石墨烯电池，其实用的多层石墨烯。它的制造成本相对单层石墨烯要便宜很多，主要就是用在复合材料和电池领域。


    # 二、石墨烯的商业应用与前沿动态


    现在的石墨烯材料，已经有了一些好的应用。


    比如在复合材料领域，经常打高尔夫的同学，可能听说过有家美国的高尔夫球公司叫 Callaway Golf Company。在2018年2月，他们推出了结合石墨烯复合材料球芯的高尔夫球。


    可能你不知道，高尔夫的球芯层数越多，控球感觉就会越好。简单来说，就是


    ![](img/ec68de57cecf4aa37e2670e9d4879832_110_0.png)


    能打更远的距离，同时又能更好地控制球的飞行路线，增加了球速和稳定性。


    而 Callaway 的石墨烯高尔夫球，通过又薄又很结实的石墨烯套层牢牢包裹在球芯外侧，增加了高尔夫球内部的能量压缩，减少球本身的旋转量。所以无论是用木杆、切杆，或者铁杆发球时，都比使用普通高尔夫球的性能好。


    在近几年，可以预见的石墨烯产业化应用，主要在电池和复合材料领域。但对于更远的未来，石墨烯因为具有极好的导电导热物理特性，一定会被用在半导体材料和电子超导体里。


    大家都熟悉的摩尔定律，就是集成电路芯片上所集成的晶体管的数量，每隔18个月就翻一倍。而这个规律基本上从1970年代到2010年代也一直得到验证。


    但目前商用芯片的晶体管的尺寸一般是17纳米左右，虽然我们用一些材料，比如用硅和锗材料，可以把晶体管做到8纳米左右，但这已经非常接近物理极限了。


    所以接下来如果需要提高晶体管的密度，就需要一种新的材料，让晶体管尺寸更小。


    具体做法也不复杂，就是在碳化硅表面刻出凹槽，并以此作为模板，把石墨烯材料放入到凹槽中，根据模板的尺寸，制成只有几纳米宽的石墨烯纳米带。然后，再把这个纳米带安装到晶体管中。这样可以作为新一代电子元件的基础性材料。


    而在电子超导体材料方面，2018年3月5日的《Nature》杂志上，麻省理工学院的22岁来自中科大少年班的博士生曹原跟他的导师，一起发表了关于石墨烯电子超导的前沿进展。


    里面介绍了石墨烯的超导性能，在室温下，只要通过控制石墨烯每一层之间转动的角度，就是所谓的“魔力角”，是个很微小的角度，大约1.1度。通过调整这个角度，就可以在“零阻力”下传导电子，从而表现出超导性。'
