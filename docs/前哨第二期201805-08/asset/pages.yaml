  md: '# 214 | 美国科技投资考察报告：科技创新的规律


    214 | 美国科技投资考察报告。


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 什么是 TPM 分析模型？

    2. 不同产业如何选择合适的创新模式？


    # 一、TPM 分析模型


    我们在上一讲介绍了北卡州立大学的创新生态，提到了他们会给创业者作培训，一个著名的培训项目就是 TEC 项目，Technology Entrepreneurship&Commercialization，技术创业与商业化，这个项目认为：


    科技转创<|message|>业的成功，是要充分理解科研和产业化，科研是由教授主导的，特点是数据驱动、用精确的语言描述、结果可重复。


    而产业化则是由工程师和 MBA，也就是指市场和企业经营专家合作完成的，工程师仍然强调数据驱动、用精确的语言描述，但还要强调产品的各种性能特征，而 MBA 则完全不同，要强调市场份额、收入利润、营销系统等等。


    太注重科研，不强调商业化，会陷入科技创新的死亡谷。


    为避免科技创新企业陷入死亡谷，他们发明了一系列的工具方法，并积极培训科技创业者使用。


    其中有一个叫做 TPM 的模型，T 是技术，P 是产品，M 是市场，这个模型的意味是：


    一个技术可以有多个产品，一个产品可以有多个市场，对于科技创新者，要系统地分析自己的科技可以做成哪几个产品的机会，尽量找到最合适的产品机会进行开发，对于确定了的产品，也要系统地分析可以针对哪几个市场做营销。


    # 二、不同维度看科技创新


    我们昨天给我们前户籍用户留了一个问题，创新的模式是都一样的呢，还是各有各的特色？


    其实这个问题展开来有三个维度：


    +   一是创新领先程度的维度；

    二是创新组织的维度；

    三是创新产品化市场化的维度。


    从创新领先程度的维度看，创新有很大的不同。


    # 三、创新上下行


    刚才谈到的这个案例，表面看起来是运用 TPM 分析模型的成功案例，其实是体现了新材料产业的典型特点。'
