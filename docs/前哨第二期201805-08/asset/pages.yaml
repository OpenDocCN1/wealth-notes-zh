    239： “环保主义者-戈尔”

    240： “特许经营模式”

    241： “创新上行-从需求找技术”

    242： “黄金发展期”


    # 8) 新材料


    1.对于石墨烯行业来说，单层石墨烯主要还停留在实验室研发阶段，目前媒体上报道的石墨烯电池，是指多层石墨烯，而单层石墨烯，根据积木式创新理论，距离实现产业化应用至少还有5年以上时间。多层石墨烯通常与其他材料复合应用后，能满足多样化，多功能的需求。尽管石墨烯行业处于产业初期，但依然需要密切跟踪它的研究成果，以及对于其他行业颠覆性的影响。


    # 索引和关键概念词典：


    +   243： “石墨烯”

