    1.虽然可再生能源发展很快，但目前因为储能技术相对落后，规模越大，消纳问题就会越发突出，这是产业痛点，也是机会。

    2.随着可再生能源产业中的精细化和智能化管理，可再生能源的成本将会不断下降，但传统化石能源的结构也在不断优化中，价格也有一定下降空间，目前来看，两者可以互为补充，各自发挥自己的优势。


