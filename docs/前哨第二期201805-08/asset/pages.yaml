  md: '# 234 | 新能源汽车：新出行方式的布局者-李斌


    234 | 新能源汽车：新出行方式。


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 蔚来汽车的商业模式是怎样的？

    2. 新造车势力相比较传统车企有哪些优势及劣势？


    # 一、新出行方式布局者-李斌


    这个模块，我们讲的是新能源汽车，说起出行行业最有影响力的人物，那就是 Elon Musk。而在中国，也有一位新出行方式的布局者，李斌。


    关注新能源汽车的朋友可能还记得，2016年10月，蔚来发布的第一辆电动超跑 EP9，在德国纽博格林北环赛道进行的测试中，创造了7分05秒的最快电动汽车圈速，比之前的纪录提升了近17秒。但那时距离蔚来创立，还只有不到两年的时间。


    纽博格林赛道，是目前全球少数拥有历史地位以及技术难度的经典赛车跑道，在汽车圈中的地位非常高，全世界的新车都想去那里刷存在感，所以这个成绩，的确可以说是彰显了技术实力。


    而蔚来汽车的创始人和董事长，就是李斌。除此之外，蔚来汽车还有一个豪华的股东阵容，包括腾讯 CEO 马化腾、京东 CEO 刘强东，还有小米的雷军等人。


    蔚来汽车目前有56个投资人，其中不乏红杉、TPG 这样的知名投资机构。截止到 2017年11月，蔚来汽车的总融资金额，已经达到了140多亿元。


    那么，拉了一些大佬和知名机构出资，迅速做了一个跑车，就能被称为新出行方式的布局者了吗？


    当然不是。


    其实李斌在过去的10几年里，一直在日常出行领域创业，在这个过程中，李斌也一直在对人们的出行方式进行思考和布局。


    也许你不知道，他曾经投资超过30家互联网汽车服务公司或产品，囊括了汽车媒体、汽车电商、整车制造、汽车维修、移动出行服务等业务。覆盖了从停车到用户看车、购车、用车、修车，甚至二手车整个车辆生命周期的。


    他不仅在汽车行业打通了供求双方的数据，降低了信息不对称。还在共享经济大潮来临后，积极投资了摩拜，以及共享打车软件。在电动汽车的发展趋势明确后，他很快就直接投身到了这次的新造车运动。


    虽然李斌的蔚上来就是造超跑，但实际上，蔚来汽车的主要客户，是需要进行日常出行的普通用户，所以他们主推的是 2017年发布的家庭用车 ES8，按李斌自己的说法，他们要造的，除了是新能源汽车，还是一辆给用户舒适出行体验的车。


    那么，李斌是怎么一步步走来的呢？造车毕竟和做互联网不一样，属于重资产行业，他是怎么整合资源往前走的呢？蔚来推出的家用车，到底提供了什么体验呢？

    下面我们就来仔细讲讲。


    # 二、李斌早期在出行行业的经历


    很多年前，李斌在北京大学学习社会学的时候，就对计算机产生了兴趣，并确定了自己的人生方向是创业。所以，他辅修了法律和计算机。后来，他就开始了互联网创业，先是在美国租几台服务器，然后帮国内用户注册域名、租空间。


    早在1997年，李斌就对美国的电子商务有所了解，例如微软旗下有一个汽车交易网站叫 Carpoint，用户在 Carpoint 上面可以看到各种新旧汽车，比较价格和性能，然后下单购买汽车。Carpoint
    则通过收取汽车经销商的会员费和广告费来赚钱。


    当时李斌就觉得，汽车在中国也一定会越来越普及，汽车网站会很有前景。到了 2000年，他决定要创办一个汽车网站，不久，他就拿到了1000万人民币的投资，投资方是一家国有汽车经销商。


    2000年6月，如今早已大名鼎鼎的汽车电子商务平台易车网成立了，全国各地的整车厂商、经销商、零配件厂商，都可以通过平台获取商机，提升竞争能力。而消费者可以通过平台查询详细的价格、性能等信息，为自己的用车、购车决策作参考。


    可是很快，全球互联网产业开始进入了“严冬”，美国股市的互联网概念，也就是 .com 的概念被炒作了几年以后，纳斯达克指数达到顶峰，然后开始持续下跌，随后，很多互联网企业开始倒闭，倒闭潮持续到2001年。


    在这种形势下，大股东不允许易车网开展任何业务。于是，在2001年年底最后一次董事会，李斌让股东把钱拿走，并承诺会慢慢归还亏掉的钱。这个时候的李斌，拥有了整个公司的股权，同时也是一分钱也没有了。


    为了挣钱，李斌陆续做了一些与汽车相关的其它业务，比如说帮汽车品牌建立网站。经过10多年发展，易车已经成为中国最大的汽车互联网企业之一。


    在这期间，李斌不断在出行领域布局。前面10几年，他主要是延续易车网的思路，在汽车产业的各个环节，打通供求双方的数据，降低信息不对称。他投资了不少互联网汽车服务公司或产品，囊括了汽车行业的各个领域。例如，汽车大師
    App，车主可以通过平台询问汽车使用和维修的问题，有需要的时候，还可以让4S店的技师上门维修。


    2014年前后，共享经济的大潮来临，李斌看到了城市新出行方案的市场机会，相继投资了摩拜单车和滴答拼车。摩拜单车你很熟悉了，它为人们从家到地铁口这一两公里的出行提供了方便。而拼车应用滴答拼车，则是一个在线打车和拼顺风车的平台，为拼车双方都带来了方便，以及节省了资源，它在近期业务增长比较迅速。


    # 三、蔚来的创立与商业模式


    也是在2014年前后，新能源汽车有了进一步的发展，国家对电动汽车的补贴政策进入推广应用阶段，推广和补贴力度都非常大，与此同时，电动汽车的发展趋势开始明确。李斌觉得，时机到了，他决定要造车。


    但是从头造一辆车的难度还是非常大的，根据李斌自己估计，至少需要200亿人民币，这是一个巨大的资金门槛。于是，李斌凭借自己积累的人脉，以及国内新能源汽车的大好形势，拉来了不少大佬和知名投资机构，汇集了不少资金。2014年11月，李斌正式创立蔚来。


    前期的资金问题是解决了，不过，大部分的大佬都是来自互联网行业，并不具有汽车产业的生产经验和能力，他们如果造车呢？他们为什么会认为自己可以和积累多年的传统车企去竞争呢？


    对于第一个问题，李斌的策略是：


    +   自己掌握软件开发、电动汽车的核心“三电”技术，以及软硬件整合。所谓“三电”，就是电池、电机和电控技术。而其它不涉及动力和软件系统的部分，全部交给供应商。


    比如，转动系统与宝马7系相同。传感器、自动驾驶算法等技术选择与不同的公司合作。整车制造则由江淮汽车代工。


    但将软件和车结合起来的控制单元，由蔚来自己研发，他们在全球会集了2500多位技术研发人才，很多都拥有宝马、特斯拉、福特等汽车集团的技术或管理背景，并在5个国家设有研发中心。


    而至于互联网企业造车的优势在哪里？


    我们首先要明白，所谓电动汽车，它可不仅仅是一辆带电池的车。新能源汽车的发展是由数字驱动的，注重人车交互体验。


    根据李斌的观察，无论是网约车，还是共享单车，甚至是智能电动汽车，它们提供的都是一种高效率的出行方式。也就是说，要更快地到达目的地。


    但是，能不能换一种思路，就是在汽车的拥有体验上进行变革呢？


    这个道理，就像马云说的那样：


    > 未来的制造业本质上是一个服务业，它'
