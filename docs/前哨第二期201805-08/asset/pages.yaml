  md: '# 213 | 美国科技投资考察报告：北卡州立大学


    213 | 美国科技投资考察报告. ↓


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 我们的美国科技创新投资考察团有何不同？

    2. 我们为什么要去北卡州立大学？

    3. 中国该如何打造自己的科技创新生态？


    我们前哨在5月12日到22日组织了美国科技创新投资考察团。


    我们这个团和国内绝大多数的美国企业考察团有3点不同：


    第一，是不看今天的成功企业，我们不是去谷歌、Facebook，而是去探寻明天有可能成功的企业，虽然很多企业，你可能今天都没听说过，但是它们实力雄厚，很有可能是下一个谷歌或
    Facebook；


    第二，是不光看企业，还看企业成长的完整生态。我们不光去拜访企业，我们还要去拜访高校，还要去拜访高校的技术转移办公室，以及高校周边使得企业能够成功的生态，像孵化器，像其它的支持机构；


    第三，是我们的行程特别满，而且没有任何娱乐购物的安排。而且我们这个团的线路也是精心安排的，没有去大家必去的硅谷、旧金山、波士顿这些大城市，而是去了很少中国团会参与的地点，比如这次我们就去的是亚特兰大、北卡罗来纳州的研究三角区和华盛顿特区以及周边地区。


    原因很简单，我们早就介绍过了：


    美国创新早已跨出了硅谷，而且这一轮以初木式创新为核心模块的创新潮流，是依靠高校做科研成果转化的硬科技创新，它发生在科研实力很强的高校周边，而且这些高校周边都建立了完善的创新生态支持体系。


    # 一、北卡州立大学


    今天第一天，那我以北卡罗来纳州的北卡州立大学和他们搭建的创新生态为例，来介绍一下美国的创新环境。


    美国有50个州，但说起北卡这个州，估计多数人都会觉得陌生，那要说起北卡州立大学，知道的人就更少了。但是据北卡州立大学的李百炼副校长介绍，北卡州立大学的研究经费支出在全美排行第8，而他们的工业界赞助的研究经费全美排名第3，而不含医药领域的专利授权收益费，在去年他们更是排名第1，今年排名第2了，也是仅次于斯坦福大学而已。


    # 二、北卡创新生态


    我认为，他们成功的关键就在于，为了完成赠地大学的使命，他们为科技创新的产业化搭建了一个高效的生态。


    首先，从科研上讲，他们就尽量结合社会需求，他们的农学、材料科学都很强，而且他们有可称得上全国最好的纺织学院，不光有制衣设计，而且投入大量精巧搞面料等等的科技创新开发；


    ![](img/ec68de57cecf4aa37e2670e9d4879832_32_0.png)'
  merge: -1
  img_proc: true
- pgno: 33
  md: '另一方面，这样的校友和项目的接触，也很容易使有经验的校友在看到机会的时候，能够跳进来加盟创业项目，甚至直接担任项目的 CEO，这样会大大提升项目的成功率。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_33_0.png)


    # 三、打造创新生态的方法


    我们都知道，要让科研成果转化成推动社会发展的产品，市场化运作的科技创新公司是不可或缺的环节。斯坦福这样的名校有很多创业企业和个人盯着，技术转让就相对容易，而像北卡州立大学这样的学校，没有完善的生态，就很难做到这么优秀。


    当然，北卡州立大学只是一个相对经典的案例，我们拜访过的每一所大学，几乎都在技术转让人办公室之外，在逐步建立新的企业孵化器、投资基金，创业者培训项目，和产业对接的项目等等这些能够使创业更加顺畅的创业生态。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_33_1.png)


    反观中国的高 校技术合作，虽然很多高校也建立了技术转让办公室，也请了国外的技术转让专家来培训，但是效果不够显著，原因不单单在技术转让环节，还有高校本身的科研的实用程度不够，缺乏和创业企业的对接。


    我们中国更多是鼓励教授离职创业，而国外认为人应该各司其职，人各有专长，专业的人做专业的事，所以应该由专业的做技术转化的企业家来创业，而不是教授来创业。


    那当然，国内还有比如对创业的实际支持不足，创业的资金支持不到位等等问题。


    所以我们认为：


    +   中国要建立完善的科技创业生态，自主创新应该是目标，而不是手段。

    我们应该通过搞懂人家的生态，再打造自己的明确长板，这样使自己能够嵌入对方的生态，能够学到人家生态的运行规律。

    最后，当各个长板我们都具备了的时候，我们再来打造自己的生态，最终才能达到自主创新的目的。


    就像我们一直强调的，没有传统产业，只有传统企业，中国每个产业的企业都需要科技化，同时，为了科技化的实现，我们必须走出去和国外的科技创新前沿对接，也就是国际化，没有国际化，科技化就不容易成功。


    # ——► 创新地图大会 ◄——


    我们在2018年8月会召开创新地图大会。


    我们希望以后每年4月的前哨大会，我们和全社会分享创新趋势和前沿，而在8月份的创新地图大会上，则和企业家一起探讨具体的实践。


    今年8月的第一届创新地图大会上，我们不光会推出前沿科技的数据库和前沿科技企业的数据库，还会推出完整的中国企业科技化和国际化的解决方案，敬请关注。


    也欢迎认同我们理念的企业家来赞助支持我们，一起办好这个大会，欢迎和我们联系。


    # ——► 课程小结 ◄——


    今天的内容就介绍到这儿，希望你记住以下三点：


    第一，美国的科技创新的源头是各地的高校，创新的范围早就不再局限于硅谷了。


    第二，美国的科技创新的形式，是以生态协作为特色的积木式创新，需要由市场化的小企业来完成产品转化的过程。


    第三，产品转化的成功，需要完整的产业生态配合，包括技术转让、创业支持、研发支持、资金支持、人才支持等等。中国要先搞懂人家的生态，再打造自己明确的长板，这样才能够嵌入这个生态，最后当各个长板都具备的时候，再来打造自己的创新生态。


    # ——► 课后思考题 ◄——


    科技创新需要完整的生态，那么不同产业的科技创新，在规律上是完全一致的呢，还是各有差异的呢？如果有差异，那么各个产业的创新到底有什么差异呢？


    欢迎你在留言区分享你的观点。


    # ■ 划重点


    1.美国科技创新的形式，是以生态协作为特色的积木式创新，要让科研成果转化成推动社会发展的产品，市场化运作的科技创新公司是不可或缺的环节。2.中国要建立完善的科技创业生态，自主创新应该是目标，而不是手段。中国要先搞懂美国的生态，再打造自己明确的长板，这样才能够嵌入这个生态，最后当各个长板都具备的时候，再来打造自己的创新生态。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，咱们下次再见。'
