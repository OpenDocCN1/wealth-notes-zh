  md: '上，而是死在研发完却不能量产的黎明之前。因为作研发，一个企业一年仅需要几百万美元投入，而解决量产问题，一个企业需要上亿美金的投入。


    这个比例严重不匹配，因此如何降低投入、使量产成为可能，帮助先进的科技企业度过它最后的生死关呢？


    中国如果能够以强大的制造能力使得量产更便利，再利用资本的手段，用“以租代售”的方式，使得量产成本更进一步地降低，那无疑能够帮助先进的科技企业度过它的量产前的生死关头。


    # 第四，要帮企业尽快上市，更好地利用资本市场实现快速发展。


    一方面，我们可以利用“制造就绪指数”对科技产品距离量产的时间作出评估；


    另一方面，中国有制造业的专家，可以帮助我们判断科技产品化的风险，同时，对科技企业的持续研发能力和市场需求我们也可以作出客观的评估，而对科技企业的市场能力，我们也可以通过他们和国内本领域的市场领导者的合作情况作出判断。


    总之，如果对一个科技企业的未来发展潜力更早地作出判断，甚至更早地安排好合适的合作，无疑就可以使这家企业更早上市，更早地利用资本市场的支持实现更长期的发展。


    # 四、新投资模式的成功案例


    我就是在不断摸索这条路，现在很荣幸地宣布，我们为全球的先进科技企业探索出的这个模式，至少在量产阶段已经成功地得到了验证。这个模式是可复制的，可输出到全世界的。


    你一定很感兴趣，现在我通过介绍我投资的两个项目来解释这个模式。


    一个项目是 Wicab 盲人眼镜，它能让盲人重见光明，它的意思非常重大。


    盲人的眼睛看不见，其实相当于摄像头坏了，但是盲人的大脑，相当于处理器，并没有坏，现在我们用一个人工的摄像头，把获取的信息通过舌头输入大脑，大脑就可以重新构建三维的外部世界，这样使盲人能够重见光明。


    另一个是 Cerevast，是以治疗急性脑中风为主的医疗技术公司。


    中国每年有250万的新增中风病例，脑中风的特点是发病快，死亡率很高。而 Cerevast 找到了一种更经济、更快速有效 的治疗方法，它的产品能通过超声波把堵塞的脑血管中的血块溶解掉。


    这两个非常棒的发明，在进入中国时，像其他国外的中小型高科技医疗机构一样，遇到三方面的问题：


    +   资金、市场准入和平台推广。


    于是，我们联系上了中关村医学工程转化中心，简称 MTP，通过深入的沟通和交流，MTP 建立了一支专业的团队，提供了一站式的解决方案。


    它的模式是这样的：


    +   高科技企业来到中国，你提需求，MTP 来建厂，建完厂以后再租给你，降低了你的成本。


    这样国外的先进科技企业就有机会在中国实现量产了。并且 MTP 还可以帮助科技企业协调政府的申报工作，对于不熟悉中国的国外科技企业来说，大大降低了它们落地中国的门槛。


    我们还成功地帮助 Wicab 中国融到了4000万人民币的投资，Wicab 的盲人眼镜有望在一年内在国内实现注册完成、量产和全面上市。


    # ——今日内容小结——


    我总结一下，这一讲我为你解读了，过去的资本结构，是如何支持当时的产业更好的发展的。


    而面对积木式创新的新产业结构，需要新的资本模式从四个方面进行支持。我很高兴，针对部分问题，我已经探索出解决之路，并将继续履行使命，积极推动整个崭新的资本模式的成熟。


    # ——今日思考题——


    你从事的是哪个行业？你的行业需要什么样的资本配合和资源配合呢？你又能提供哪些配合和其他企业共同发展，促进科技的繁荣呢？


    # 划重点


    1.每个时代的资本形式都是为了能支持当时的产业发展，在全球科技产业已经进入积木式创新的阶段，需要更加系统化地，从资本到资源，为创新企业提供更长期、更全面的支持。


    2.面对积木式创新的新产业结构，需要新的资本模式从四个方面进行支持，分别是：系统布局的天使投资、产融结合的风险投资、低成本的量产能力获取、在充分风险评估基础上的提前资本化。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，我们下讲再见。'
