  md: '# 彩蛋 | 柔性显示：一切真的显而易见吗？


    ——内容看点——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    柔性显示技术的发展路经是怎样的？


    中国在柔性显示领域发展如何？


    这是我们彩蛋的第一讲，之前我们在讲新材料模块的时候就讲过柔性电子，那么这一讲，我们来专门讲讲“柔性显示”。


    7月16日凌晨，俄罗斯世界杯决赛落下帷幕，今年世界杯你可能关注了冷门不断的赛事，但你可能忽略了观众席上也有了一些有趣的变化。有一些球迷的T恤和礼帽中，镶嵌了柔性OLED显示屏，屏上滚动播放着高清的球赛信息，这一度成为了观众的看球利器。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_167_0.png)


    这一讲，我就跟你聊聊柔性显示技术和行业前景，以及两家关键公司：柔宇科技和京东方，从它们的发展能看到，提前布局前沿技术和构建专利壁垒的重要性。


    # 一、柔性显示技术的发展


    1-2年前，我们的手机绝大部分使用的是LCD屏幕，而最近1年，你开始看到三星S9、iPhone X、小米8、华为Mate10 Pro等手机开始使用OLED屏幕。这虽然只是你生活中的小变化，但却反映了目前整个显示行业的技术发展。


    屏幕显示技术从最早期的液晶显示，英文缩写叫LCD，发展到柔性有机发光半导体材料OLED，甚至量子点显示技术QLED。


    你可能难以一下子分清LCD、QLED、OLED三者的区别，我下面一一为你解释：


    LCD是最早的技术，你平日使用的绝大多数手机、平板电脑、显示器都是使用的LCD屏幕。原理是，玻璃基板构成液晶的容器，在两层玻璃基板中间填充液晶材料，由于玻璃基板的存在，这种屏是不可以弯曲的，无法做成柔性屏。


    OLED是有机发光半导体，可以自发光，不需要背光光源，支持高对比度和更丰富的颜色，产生更逼真和更艳的图像。OLED可以做出超薄且柔性的屏幕，本身具有黑色背景不耗电的优势。缺点是OLED是有机物，容易被烧坏，使用寿命比QLED短。


    QLED是量子点显示技术，是通过对纳米级晶体施加电场、光场来发光。所以QLED需要一个背景光源让量子点发光。虽然QLED可以做得很薄，但QLED不太可能做出柔性效果，同时看屏幕的视角不够广，但它的优势在于寿命长，不易被烧坏，适合做大尺寸屏幕，而且色彩清晰度高，更加真实。


    目前，只有三星和TCL具有QLED技术专利。TCL早在5年前就布局量子点技术，提前把量子点引入电视领域，积累了巨大的科技优势，这也是近几年TCL迅速成为美国主流电视品牌的众多原因之一。


    除了电视显示器，刚才提到了很多热门款手机已经采用OLED屏幕。其实用到手机和用到电视上的屏幕略有不同，用到手机上的以“主动矩阵有机发光半导体”为主导，英文缩写叫AMOLED。


    AMOLED完全不需要背光源，所以更省电。在材料上，AMOLED又可分为硬屏和柔性屏，主要是取决于屏幕的上下基板的材质，比如柔性基板主要用聚亚酰胺作为衬底，或者采用多层膜处理。


    在AMOLED领域，随着三星、苹果、小米、华为等多款手机大规模使用AMOLED屏幕，它在手机领域的渗透率，有望在2020年增长近50%。预期到2025年，柔性AMOLED技术的市场需求是2018年的4倍，这个市场还是很大的。


    从全球范围看，目前只有少数企业能实现柔性AMOLED屏幕的量产。


    目前在中国AMOLED显示屏领域，有两家重要的企业，分别是受到媒体热捧的柔宇科技和具备国企背景的京东方。


    这两家企业，一家是科技初创企业，一家是老国企，它们的发展策略各有什么特点呢？


    # 二、柔宇科技


    柔宇科技创始人刘自鸿，毕业于美国斯坦福大学，也是知名柔性电子材料专家，美国工程院院士鲍哲南教授的学生。2012年刘自鸿在美国硅谷创立柔宇科技，先后获得国内外知名风险投资机构的6轮投资，共约10亿美元。


    在2014年，柔宇发布了全球第一块厚度仅0.01毫米的柔性显示屏，这是当时国际业界最薄的显示屏，成为了世界柔性显示的领跑者。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_167_1.png)


    柔宇重视自主研发生产线和设备，从柔性OLED的材料，到生产工艺、生产设备等方面，截至2018年6月，拥有了1800多项核心技术专利。柔宇在业界首次提出了“柔性+”理念，即柔性电子作为平台型技术，能广泛应用到各行各业。


    柔宇的柔性屏有一个有趣的尝试，在2016年的CES上展示了柔性电子弧形汽车中控台，他们创造出了一款全新的汽车中控，目前还是个概念产品。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_167_2.png)


    你会看到一块弯曲的弧形屏幕，上面没有任何物理按键，柔宇这次将传统汽车中控台的显示、按键等全部集于一体，整个设计显得更加具有柔软、时尚及科技感。


    柔宇科技在快速发展和融资的同时，也遭受外界的一些质疑。主要原因是，此前一直未能实现柔性屏的量产。2018年6月6日，柔宇科技在深圳首条柔性显示屏量产线成功投产，总投资约110亿元。一旦柔宇实现柔性屏的大规模量产，它
    dada imagination 空间也是不小的。


    据报道说，在此之前，由于柔宇的供应链改进跟不上新工艺的技术要求，所以一直到近期才实现量齐。


    可见，从技术成功研发到产品实现量产，这其中会面临极大的挑战，中间经历的环节非常复杂和漫长。


    总体上看，柔宇在技术和专利上为自己构建了壁垒，但这还不够，还是我强调的，需要采用“积木式创新”模式，让新技术与匹配的制造能力相结合，让产品迅速落地才是王道。


    熟悉我们的朋友都知道，我原来和寒武纪的陈氏兄弟打过赌，赌他们产的芯片能否3年内进入量产的电子产品里，后来我向他们公开承认输了，因为他们的产品进入了华为的Mate10手机，为华为的拍照和图片处理功能增色不少。当然，芯片是他们设计的，却是华为来生产的，可见初创企业要攻克量产难题是非常困难的。


    柔宇由博士主导创业的做法也会有缺乏产业经验的问题，所以我也在继续跟踪，希望柔宇尽快有量产产品批量面世，打消我的疑虑。


    # 三、京东方


    接下来给你聊聊，具有丰富产业经验的，另外一家有老牌国企背景的显示技术的公司，京东方。


    它在1998年开始投入OLED的研发，积累了6万多项的专利技术，最关键还是它稳扎稳打，采用了三星的成熟生产工艺，于2017年10月，在成都建立了第6代柔性AMOLED生产线，在今年7月，京东方的月产能达到4.5万块以上，AMOLED综合良率已超70%，主要是为华为、OPPO、vivo、小米、中兴等10多家客户提供AMOLED显示屏。


    另外值得一提的是，我在2018年美国拉斯维加斯的CES展上，试乘过腾势汽车，它的前排有一块1.2米长的曲面大屏，就是京东方生产的。'
