  md: '# 万亿市值苹果：给我们的6条启示


    我们今年在很多个场合都强调过，今年有一个很重要的看点，就是很有可能有公司会突破万亿美金市值。


    当然，其中最有希望的公司就是苹果，那现在看起来这件事情如果实现了，今天苹果的市值突破了万亿美金，它是人类历史上第一个突破了万亿美金市值的公司。


    那借着苹果突破万亿美金市值的机会，我给大家总结了6点启示：


    # 启示1：不要过分夸大乔布斯


    我认为不要过分夸大乔布斯，因为严格来说，其实乔布斯并不是一个特别好的企业家，这和大家的想法可能都相反。


    为什么呢？


    因为如果你去读乔布斯传，里面有一个篇幅就在讲他的叫做“现实扭曲立场”，也就是说，乔布斯会非常坚持自己认为是正确的东西，虽然在现实当中是错的，他依然不会改变自己，他也希望现实向他妥协。


    # 启示2：不要小看 Tim Cook


    因为在乔布斯的阴影之下，大家一般都会低估现在苹果公司的 CEO Tim Cook。


    其实苹果今天的成功，很大程度上要归功于 Tim Cook。2011年10月份乔布斯去世的时候，当时苹果的市值只有3000亿，现在到了1万亿，而且现在在苹果公司手里的现金就有差不多3000亿，这些成绩都是在乔布斯去世之后获得的。


    # 启示3：苹果仍然是风向标


    而 Tim Cook 在苹果的 iPhone X 里又集成了很多的新科技，甚至于造成我认为第三点很重要：苹果今天依然是市场发展趋势的风向标，也就是说，苹果不光是有创新，而且能够对未来的发展趋势有判断，而且能够推动科技趋势的实现。


    那最明显的例子，就是 iPhone X 里面推出来的这个基于激光点投影的面部识别，它的识别是3D的、是三维的，即使你拿一个照片想去欺骗它也是不可能的。'
