    # 7）未来游戏


    1.游戏是我们适应未来的工具，尤其是在科技汹涌而来，未来的变化越来越大的时候，更需要有更好的适应未来方法。所以游戏是其中一个必不可少的方法，甚至我们整个社会都要学习游戏里的智慧，叫做游戏化，使得我们在现实生活当中能够更从容地对应。


    2.游戏形式的发展和技术密不可分，不同的科技会酝酿出不同的游戏形式，但是没有人能够现实地预料到什么会流行，因此大公司只做好平台，使得这个科技上面任何的流行都在自己的平台上先流行，这使得游戏创业的机会会大了，因为你还可以借助大公司的支持，使得你自己的能力极极大地扩张、你的市场、你的创业发展机会被极大地扩展了。


    3.游戏内容背后是永恒的人性，好的游戏设计者是心理学家，是社会学家，更是哲学家。未来的游戏一定是更加关注和培养人性中善的一面的。未来的游戏不再是人们逃避现实的部分，游戏本身就会成为现实的一部分，而且会使我们的现实变得更美好。


