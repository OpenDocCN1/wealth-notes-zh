    # —— 用户问答 ——


    # “悠然”问：


    7月25日美国和欧洲达成贸易和解，欧盟与日本达成零关税协议，美国也打算在1个月内与日本达成双边自由贸易，很多unc预测这会形成美日欧主导的新国际贸易体系，这明显对中国很不利。请问王老师，应该如何解读这次政策？中国要如何面对这次挑战？


    # 我的回答是：


    这件事发生的原因其实是有两个：


    一个是其实跨国企业是全球化的受益者，但是老百姓不是，而且老百姓还是受害者，因此老百姓对全球化有意见，这个意见被转嫁到中国头上了。


    另一个是我之前说过的，中国是全球化的受益者，但是说的更清晰一点，是“你全球化我不全球化”的受益者，现在人家抓住了这一点，把矛头都对准中国了。


    这个问题表面上倒没有那么严重，因为美国、欧洲和日本也有不少贸易纠纷，欧洲内部也还有分歧，所以这个零关税协议未必那么好达成。但实际上这至少证明了中国在国际上有被孤立的倾向。


    如何应对，我认为短期当然要回应，不过不是以贸易战对贸易战，美囯对中国发起贸易战，当然是选对自己有利的领域里打击我们了，中国直接回应肯定是对咱们不利的。


    我的建议是，中国要利用这个机会修正自己做的事情，该遵守的 WTO 的承诺要遵守，同时进一步优化中国的投资环境，给国外企业更大的优惠，欢迎他们来中国建厂。


    其实美国贸易战的目的还是争取市场开放，别国家担心市场开放了本国产品受外国产品冲击，而中国市场上多数本国产品很有竞争力，外产品也已经是本地化生产为主了。所以逐步给予外资更大的股权，只要安排得当，并不会对中国经济造成太大的冲击，只会使美国在华有业务的企业能够重新帮中国说话。而且有跨国企业在中国继续经营，对中国的市场经济环境也是一种促进。


    长期的建议就复杂一点了，简单说：

    第一，是要对全球前沿科技作长期的布局，比如中国的芯片为什么搞不好，因为芯片产业从研发到量产，往往需要很长的时间，研发成功被广泛应用会形成产业链，链条很复杂，就难以替代了。中国的做法都是希望立竿见影的，不管是自己研发还是收购，都希望马上见效，这当然很难做到。但如果下决心用10年甚至20年的时间解决问题，就会有机会；

    第二，是加强我们的优势领域，也就是制造业和全球科技创新企业的合作。不光吸引先进科技企业来中国帮他们建厂，也积极走出去到海外建厂，当然顺便还能到海外建立一个研究院，利用好全球的智力资源，这就是我们强调的中国一定要出“跨一代”，跨国企业一定要出来。

    第三，是用好香港这个全球化的金融中心，鼓励全球科技企业到香港上市。


    总之，全球不光是经济一体化，科技创新的产业链化也是一体的，别人越要打价格战，要造成分隔，我们就越要加强全球合作。


    # “乎平”问：


    我是做传统产业的，除了参加每年的CES展以外，请问还有哪些途径可以了解最新科研成果？请王老师推荐一些科技网站或高校网站。


    # 我的回答是：


    你需要先明确目标，了解最新科技成果，你是用在自己的产业里，还是希望参与科研成果的研发，未来在技术上有优势？

    如果希望立刻用，就要了解哪些已经成熟的科技，这时候关键是看企业。参加CES展是个不错的选择。在本领域跟进技术企业的发展也是很必要的。

    要是想参与研发，以便将来取得技术领先优势，就要了解高校的科研成果，这时候可以看高校网站，也可以跟随相关学术突破的报道，用行业的角度去跟随是比较有效的。

    但是不管是哪个，都不是简单推荐科技网站或者高校网站能够解决的，我建议你可以看看我们新出的书，叫做《学会洞察行业》，自己先对自己的产业作个系统梳理，明确目标和需求，建立长期的信息收集和分析的方法，最重要的是建立在充分分析的基础上作决策的习惯。千万不要把经营问题过度简单化了。


    # “于金博”问：


    王老师您提到看公司不该看股价，而应该看市值，那判断市值的指标是什么？如何判断现有的估值是高估了还是低估了呢？


    # 我的回答是：


    判断市值的标准是现状和未来预期，现状很简单，就是收入利润。但是有没有未来的企业，差别就非常大了。未来预期主要看成长性，尤其是成长空间，也就是市场的潜力和成长速度，也就是业务的快速复制能力。


    还有一个是风险。

    风险包括经营风险，也就是这个业务多大程度上靠技术，这个经营风险就比较小，因为技术容易造成快速扩散。多大程度上靠人，这个经营风险就比较大，因为人越多，管理起来越难。还有竞争风险，就是技术有没有壁垒，品牌有没有优势等等。'
