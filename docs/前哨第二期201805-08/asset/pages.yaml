    # —— ◆ 科技特训营 ◆ ——


    从这周开始，我们科技特训营北京站的课程已经开始了。


    这个模块第三讲是关于柔性电子材料的，恰好我们在科技特训营的第一天，就邀请了美国亚利桑那州的姜汉卿教授，讲解柔性电子材料的最新应用，他把材料力学、可穿戴设备、柔性电子玩出了前所未有的新花样，让我们看到了未来可穿戴设备的趋势，不只环保可降解，甚至还能直接食用。


    因为科技产业的主要源头就在高校的科技研究，所以我也邀请了一批首次在国内公开演讲的世界一流院校的专家教授。当然，除了姜汉卿教授，还有中科大的翟昆教授，美国杜克大学陈怡然教授等人。


    除了科技方面，这次科技特训营还邀请了很多商业高手，跟你分享最深入、最有洞见的思考。像咱们得到用户熟悉的刘润老师、施展老师，还有北大的刘德寰老师等等，当然，还少不了产业专家，搜狗的CEO王小川，华为全球技术服务AI主任架构师廖显老师等等。


    因为，科技特训营的目的就是要把全球最前沿的科技，最有效的产业对接方法，最有竞争力的商业模式，直接展示在大家面前，让大家可以和最好的企业家、思想家、科学家面对面交流，更新自己的科技武器，提升思维和全球视野，实现自己的梦想和价值。


    错过科技特训营北京站的同学，还可以关注我的公众号“全球风口”，查看深圳站的课程信息。


    # —— ◆ 模块总结 ◆ ——


    我们这个模块的主题是新材料，介绍了以下四个重点：


    第一，对于石墨烯行业来说，单层石墨烯主要还停留在实验室研发阶段，目前媒体上报道的石墨烯电池，是指多层石墨烯，而单层石墨烯，根据坂木式创新理论，距离实现产业化应用至少还有5年以上时间。多层石墨烯通常与其他材料复合应用后，能满足多样化、多功能的需求。尽管石墨烯行业处于产业初期，但依然需要密切跟踪它的研究成果，以及对于其他行业的颠覆性的影响。


    第二，碳纤维因为高强度、质量轻的特性，非常适合用在建造大型建筑、航天航空器，电子产品以及高端汽车的车架上，来达到提高强度和减轻重量的目标。预计到2020年，汽车行业将成为碳纤维增长速度最快的市场，航空航天则会是市场规模最大的市场。目前影响应用的最重要限制性环节，是产量成本，以及碳纤维损环后维修和替换的成本。


    第三，柔性电子材料种类非常广泛，未来在信息、能源、医疗、国防等领域具有广泛应用前景。主要细分技术有柔性显示、柔性传感器、柔性电子织物、柔性电池、柔性线路板等等。其中，柔性显示和柔性传感器是两大重要研究领域。柔性领域中，不同技术的发展阶段是参差不齐的，不论你是创业者，还是投资人，都需要一套科学全面的量化技术分析工具，指导你作出正确的商业决策。


    第四，各种材料的纳米化是材料领域的大趋势，因为当材料晶粒达到纳米级别后，能呈现出比直径晶粒组成材料更优异的性能。从技术到产品落地的关键问题在于，生产过程精度要求高、量产难度大、成本高。企业家深刻了解产业痛点和应用，但是密切跟进前沿技术也是一件富有挑战的事，他们需要科学家。而科学家，或者是科技从业者，也需要企业家助力让技术找到用武之地，并实现大规模生产。所以说，未来企业家和科学家必须是两者结合，才能切实让世界越来越好。


