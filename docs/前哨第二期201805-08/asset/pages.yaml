    为了让经济条件有限的大学生用户也能有机会来到现场，我在这里给大家一个小福利，如果你是我的大学生用户，并且周六在深圳，你可以到我的【全球风口】公众号报名，我们会赠送20张公益门票，让你可以亲身参与到创新地图大会，参与到全球科技创新的实践中来。


