  md: '第一点，美国的总统竞选就是科技进步的展示平台。


    可能有不少朋友听过一个故事，前美国总统约翰逊，在刚成为一个议员的秘书的时候，通过一个晚上洗几次澡、一个早上刷几次牙，在短时间内结识了不少国会秘书，因为当时国会山附近有一家饭店住了不少议员，而这家饭店只有一个公共洗澡间，在那里洗澡刷牙，并跟人打招呼，就是最自然的搭讪方式了。


    这种一对一的交往技巧，后来成为了约翰逊政治生涯中的法宝，并帮助他爬上了总统的宝座，有人将其称之为“零售政治”。


    而罗斯福、肯尼迪和里根，则是利用广播和电视赢得大量民众的支持，这种手法被称为“批发政治”。


    到了奥巴马，则是运用了大数据，分析出要在哪里举行选举活动、如何打广告。最终，没有大财团背景的奥巴马，获得了更多普通民众的支持，大部分的选举经费是通过民众的小额捐款获得的，并在2008年选举期间，创下了竞选经费历史之最。


    另外，我在课程“市场营销”模块的时候也提到过，川普的团队也是运用了大数据分析，抓住了人性的弱点，对信息进行高度定制化和精准投放，最终帮助他战胜了不可能战胜的对手。


    是科技的进步，使得奥巴马和川普可以通过IT工具，既能像“批发政治”一样，以低成本获得广泛的传播范围，又能像“零售政治”一样，有针对性地跟选民进行沟通。


    奥巴马在2012年参加竞选时，他的竞选团队使用的IT基础设施，占用了亚马逊北弗吉尼亚数据中心相当大一部分的计算资源，这样的资源，恐怕只有极少数的IT巨头才可以提供。


    # 第二点, AWS 是内部服务外部化的典范。


    很多公司尤其是大公司，在其成长过程中，值钱的不仅仅是产品和服务，背后的支撑系统也很关键很值钱。


    为什么能够有这么好的产品和服务？怎么做出来的？别人可以借鉴甚至借用么？


    中国企业界流传着当年华为买IBM流程服务的故事，当时华为花巨资购买IBM的咨询服务，为的是在企业运营流程上能够获得跨国公司所具备的能力。


    当时在华为内部确实引起了很大的反弹，不过任正非坚持要这样做，甚至提出了“剐足适履”的说法，就是为了符合人家的流程规范，华为自身必须作出改变。


    当年IBM出售给华为的咨询服务，很大程度上是自身企业运营经验的总结，是内部流程的外部化。


    所以，我们可以看到，很多公司尤其是大公司，在其成长过程中，值钱的不仅仅是产品和服务，背后的支撑系统也很关键很值钱。因为大公司之所以能在竞争中胜出，并发展壮大，其背后的硬件设施或流程管理必定有其过人之处。


    # 三、AWS 面临的挑战


    首先，是竞争和成本。


    因为要争夺基础设施老大的地位，各大IT巨头都纷纷入场，加剧了云计算平台的竞争。


    竞争首先反映在价格战上，仅仅在2017年，主要的云服务提供商亚马逊、微软和谷歌都持续下调云服务的价格，计费周期也从过去的按下时时分钟计费，变成了按秒计算。


    而他们还要应对大规模数据中心维护和各种系统漏洞的问题。比如在今年1月份爆出的Intel CPU的安全漏洞问题，直接影响了包括AWS在内的所有云计算服务平台，为了修补这些漏洞，服务器不得不降速最多30%来运行，为了维持原来的计算能力，就必须添加更多的服务器，这就大大提高了成本。


    其次，是安全问题。


    云计算从诞生开始，就一直面临着安全性的质疑。毕竟把自己的数据存在别人的服务器上，总是不如存在自己的服务器上安全。一旦密码被盗，重要数据就将全部暴露。


    而另一方面，因为同一台服务器上可以运行10几台虚拟主机，这些虚拟主机可能属于不同用户，如果成功通过系统漏洞，穿透这些虚拟隔离层，就可以窃取多个用户的数据。


    所以，那些拥有核心交易数据的公司，包括华尔街、芝加哥等地主要的金融机构，目前大多仍然都 Bluetooth在观望。


    最后，挑战还来自于未来的不确定性。


    目前计算机体系结构发展迅速，各中新架构层出不穷，而云计算的数据中心，大多还属于建立在传统服务器上的软件管理。


    为了降低成本，提高效率，使运行维护更简便，一些更适用于云计算的服务器架构可能会应运而出，比如超融合架构（Hyper Converged Infrastructure）就是其中一种，我们会在第四讲中细说。


    最后说点我的个人经历：


    我很多年以前就在电信领域做咨询工作了，当时的设备提供商像思科公司就意识到了企业对网络带宽和运算能力的需求是有弹性的。


    比如企业的高成长，或者比如有些季节性的业务需求，都会带来带宽和运算能力需求的极大变化。所以，他们竭力向运营商推销他们帮运营商制定弹性的硬件租货方案。


    今天看起来，他们看到了问题，却找错了解决，因为他们是卖硬件设备的，所以提供的方案还是帮客户做硬件租赁，而不是摆脱硬件直接满足客户的需求。


    这也在提醒我们今天的企业经营者，千万不要因为自己手里有锤子就觉得客户的问题都是钉钉子。


    # —— 课程小结 ——


    这一讲中，我为你介绍了亚马逊的创始人贝索斯，以及亚马逊的云计算服务平台AWS。


    希望你能掌握以下三点：


    +   第一，技术出身的贝索斯，在经营网上书店的初期，就敏锐地意识到，他们需要一套可以共用的基础设施，就开始搭建这样一套云计算平台，并首先将该平台开放给外部用户，这项服务灵活易用，立即吸引了创业公司、大型企业、大学、政府和非营利机构这些客户。该云计算服务平台也成为了目前亚马逊公司最能盈利的部门。


    +   第二，AWS 虽然是目前云计算平台领域的老大，但也面临着不少挑战，包括来自于其他IT巨头竞争者的压力，用户对安全性的质疑，以及计算未来发展方向的不确定性。


    +   第三，有不少大公司，在其发展过程中，往往建立了强大的支持系统，这些系统有可能比它目前所销售的产品和服务更值钱。在适当的时候，将这些内部服务外部化，也不少为一个造福社会的举措，并能为自己带来财富。


    # —— 课后思考题 ——


    你还知道有哪些大公司，他们背后的支持系统也是很有价值的，他们是怎么做到的？而这些服务是否已经外部化了，能否请你分享一下？


    # 划重点


    1.大公司可能在竞争中胜出，并发展壮大，背后的硬件设施或流程管理必定有过人之处，在它的成长过程中，值钱的不仅仅是产品和服务，背后的支撑系统也是很关键很值钱。2.AWS
    虽然是云计算平台领域的老大，但除了面临竞争对手的挑战，还面临着安全性质疑，以及计算机未来发展方向的不确定性。


