    Void，从韩国的SM公司和ObEN的合作，都看到了这一点。

    智能文娱跨界创业创新恰逢其时，小科技公司有大机会。我们的前辈和咱们国内的科技产业一直交流都很好密切，我在考虑要不要组织一个科技精英和文娱大咖的跨界聚会，也许能够孵化出来下一代的智能文娱的领军企业呢。


