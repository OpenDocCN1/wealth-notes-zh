    我先解释一下“水平井”，你应该也知道，一般的钻井，都是垂直地面往下打，而所谓“水平井”，就是向水平方向，或者接近水平的方向钻井。


    有了这项技术，在垂直向下钻井到页岩气储层之后，就可以向水平方向钻探，这样就大大增加了与储层的接触面积，通常，已经可以水平钻探1英里甚至更一些。


    钻井完成后，通过高压把压裂液注入到地底深处的岩层，就approved可以打开细小的岩石裂缝，让页岩气储层连接起来，页岩气也就能沿着裂缝自由地流到钻井口。


    这里说的压裂液，其实主要成分是99%的水，剩下1%是一些化学物质，主要是为了增加水的黏度，降低流动阻力。


    这个技术说起来简单，但如果没有这个技术，页岩气开采的单井产量会降低90%以上，完全丧失经济开发价值。


    现在在美国，水平钻井和水力压裂方面的技术，已经比较成熟，而且在过去几年里，美国很多公司通过技术积累和创新，已经把页岩气开采的成本降低了50%以上。


    但是，新一轮的科技革命其实正在拉开序幕，而这次科技革命，主要是通过数据处理和预测分析来降低成本、提高效率和增加产量。


    在今后相当长的一段时间内，页岩气的开采，会有四个主要发展方向：


    # 第一个方向，是通过监测技术的革新，以经济的方法获得更可靠的地质信息。


    目前，怎样更好地根据地质条件，去规划和设计开采方案，仍然是个不小的挑战。

    虽说在天文领域，我们已经可以通过光谱分析，来精准推断几十光年外某颗行星的大气成分，但在页岩气开采的时候，却很难通过直接的方法，来精准测量出数千米以下的_attrs中，水力压裂形成的裂缝的大小和分布。所以，一些公司正在寻找解决方案。


    比如成立于2014年的美国公司 Fracture ID，他们在钻头后方安装了加速器，这个加速器的原理，和我们的智能手机里感应移动的传感器差不多，它在钻井过程中，可以感知各个方向的震动情况并记录，根据记录就可以反推出岩石的物理特性，用来优化钻井和水力压裂的设计，从而降低成本，提高产量。


    而另一家成立于2013年的美国公司 Biota Technology，则是对页岩、油和水中的微生物进行 DNA 测序，通过对比它们的相似或者差异之处，来确定油气在地下的运动情况，这样就可以告诉操作员，在哪里以及如何完成钻井和压裂作业，从而让水平井产量最大化，还能最大限度地减小对环境的影响。


    迄今为止，这家公司的技术，已经应用到了美国10家页岩气生产商的400口井上。


    # 第二个方向，是机械自动化和连接智能化。


    机械自动化，是通过施工和操作流程的自动化，去除重复的人工劳动，来提高效率和降低事故率。而连接智能化，是通过智能化的平台整合产业链，来降低信息的传递成本。


    在这一方面进行探索的代表公司是 RigUp，它成立于2014年，它为油气运营商，2万多家服务公司和承包商提供网上交易平台，并提供价格分析和资格认证服务，由此可以增加服务承包商20%的年收入，和节省运营商20%-50%的外包业务支出。


    目前 RigUp 已经获得包括 Paypal 创始人 Peter Thiel 领衔的 Founders Fund，和 GE Ventures 在内的8家机构的投资。


    # 第三个方向，是大数据和人工智能的应用。


    不少油气公司在勘探、开发、生产和运输的过程中，获得了大量有价值的数据，有的数据甚至持续搜集了几十年。但是，还很少有油气公司能将它们全面地利用起来，平均利用数据的能力仍落后于其他行业。


    之前，风险公司 GE Ventures 做过的一份研究评估指出，只有3%至5%的油气设备，可以实现数字化连接，并且在收集到的数据中，只有不足1%是用于决策制定的。


    而随着大数据和人工智能算法的成熟，越来越多的油气公司，意识到大数据可以在降低勘探成本、提供最优方案等方面发挥作用。


    举个例子，成立于2013年的美国公司 Tachys，是第一个兼用物理数据模型和机器学习来对油井进行模拟的大数据公司。

    他们利用传感器和无线网络对钻井、生产、维护等工程进行实时监控，并将采集回来的生产数据，通过物联网和跨平台进行整合分析，可以预测每口油井到底应该注多少水，注多深，从而为油田企业提供页岩压裂、注水、修复等作业的优化解决方案，提高产油效率。

    在美国，已经有1万多个油井在使用 Tachys 的服务。自成立以来，Tachys 已经获得包括 Founders Fund 在内多轮融资了。


    # 第四个方向，是降低页岩气开采对环境的影响。


    目前使用的水力压裂技术需要大量的水资源，而中国有大量的页岩气资源，却位于水资源比较少的地区。所以减少用水，甚至使用无水压裂技术，才能增加页岩气在这些地区被开采利用的可能性。

    比如，美国公司 Fasken Oil and Ranch，他们对压裂回收的废水进行处理，然后进行重复利用。一般情况下，水力压裂使用的水会有20%-30%返回地面，并会从底层携带一些化学液体、重金属和盐等物质，实际上，把它们进行一些处理后，就
    Grants repeat 再次配成压裂液。

    现在，美国压裂废水处理的市场规模已经超过了20亿美元，并且在2020年之前，还会以每年7%的速度增长。

    在加拿大的很多地方，也已经开始用液体，或“泡沫状”氮或二氧化碳补充或取代水，不过，这种方法的关键在于物流成本的控制，特别是离氮气或二氧化碳源比较远的地方。

    除了需要大量淡水作为压裂液以外，还有一个环保方面的担忧，是压裂液可能会对地表水造成污染。

    压裂液里需要加入一些增加黏度的植物胶，用来减少阻力和能杀菌的化学试剂，部分的化学成分是有毒的，如果在运输、处理或设计上存在疏忽或缺陷，就可能对地下和地表水形成潜在的污染。为此，美国一些服务公司也在推出新的压裂液体系，增加安全性。


    # 五、中国页岩气发展的机遇和挑战


    好了，了解了页岩气在能源结构中的重要作用，以及页岩气的发展现状和发展方向。最后，我来讲一下中国页岩气发展的机遇和挑战。

    到2018年，天然气在中国能源消费结构中的比例仅有6.4%，远低于世界平均24%的水平。即使如此，中国的常规天然气供给，仍然很难满足国内庞大的需求。

    你一定会好奇，既然中国页岩气储量世界第一，目前开采技术也比较成熟，那么能否也像美国一样，不仅满足国内对于天然气的r需求，而且实现出口呢？

    实际真操作起来，真的不简单，原因主要有以下几点：

    第一，中国页岩气的开采难度比美国更大。

    跟美国相比，中国的页岩气资源大部分分布在边远山区，页岩层离地表比较深，地质结构也比美国复杂得多，这就造成开采的技术难度更大，钻探成本更高。

    第二，中国还没有形成页岩气开采的核心技术体系，产业链不完整。'
