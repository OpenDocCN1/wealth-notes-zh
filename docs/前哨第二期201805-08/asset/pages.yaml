  md: '# 创新地图大会 | 中国在全球科技创新中的重要作用


    创新地图大会 | 中国在全球...


    这一讲，我带你从全球的角度，看看中国有哪些长板能参与到这一轮全球创新的潮流中呢？中国在全球科技创新中面对怎样的挑战，以及有哪些应对的方法？


    # 一、中国的三块长板优势


    第一讲我说过积木式创新，既然要与全球合作，最重要的是用自己的长板去拼接别人的长板。我们需要了解中国的长板在úrate，才能在全球合作中发挥中国优势。


    第一块长板：创新产品的制造优势。


    我们之前反复讲过，中国的制造优势，不只是产业集群优势，而是创新产品的第三方制造优势，就是帮助创新科技企业实现量产的能力。


    我在2018年4月22日前嗨大会上说过，这个能力就是大规模、复杂产品的开放式制造能力，我们这个能力是全球唯一的。


    苹果手机在中国制造，原因就是中国为量产准备的大规模的完整制造生态链，如果还加上我们庞大的市场优势和资本优势，这对美国科技创新企业的吸引力是相当大的，这也是海外科技企业愿意接受我们投资的原因之一。


    第二块长板：群体加速的创新


    “群体加速的创新”这个词是 Chris Anderson 提出来的，他是著名的先进思想教育网站 TED 的负责人。


    这个词的意思是：


    +   当有大量创新者参与同一件事情的时候，每个都会在别人创新的基础上继续创新，很快就能把创新的水平提高到一个崭新的高度。


    我觉得深圳就是群体加速的创新典代表，比如早些年的深圳“山寨机”，虽是山寨，但并不是原封不动，而总是在原有基础上不断进行小创新的。


    第三块长板：中国更愿意接受新科技。


    中国对科技有更加坚定的信仰，对新事物更愿意尝试。


    北大新闻与传播学院副院长刘德寰教授，长期在中国做社会学调研，他说：


    +   中国现在是不分年龄、不分性别、不分职业，全面追赶时尚和潮流，而科技是其中一个重要潮流。


    这也解释了为什么现在中国到处是手机支付，吃{饭、坐车、买东西都可以...}


    # 二、长板优势带来的两个重大机会


    中国利用制造优势帮科技企业实现量产，在中国群体加速创新的环境下，加上中国人更愿意尝试新科技，这些长板为中国在全球科技创新中赢得了两个发展机会：


    第一个机会：为全世界的科技创新解决量产问题。


    台湾宏基创始人施振荣，提出一个“微笑曲线”理论，认为价值最厚区域集中在产业链两端，分别是研发和市场，而价值最低的在产业链的中间环节，就是代工和生产制造。这造成很多人误解制造是低端。


    而实际上，现在的各个产业都是生态化的，产业链中各环节的重要性，取决于各自为生态系统贡献的价值和自身的独特性。


    我一直强调：


    +   全球的经济越来越多地由科技创新所驱动，因为科技创新已经扩散到各个行业之中。


    +   而且现在科技创新更多是硬科技，跟实质产品相关，硬科技的实现需要有量产能力来支持。


    +   而目前这种量产能力，是科技创新生态中最有价值的部分。


    各个行业创新企业普遍面临的问题，是大量的创新企业不是死在研发过程中，而是死在研发之后不能实现量产前的黎明前的黑暗里。


    因为创新企业在研发期的投入只有几百万美金一年，而一旦需要建厂，投入则高达几亿美元。企业很难募集到足够的资金，同时建厂成本都是沉淀成本，由于缺乏对产业的了解，投资机构也往往不敢做量产方面的投资。


    相比国外的情況，中国建厂成本更低，拥有大量的制造业人才，中国的投资者更能作出合理评估，在充分论证的基础上，更敢于投入建设。同时中国市场对科技产品更加接受，为量产后的商用也提供了一个巨大的潜在市场。


    所以，一定不要受施振荣的“微笑曲线”影响，以为制造没价值。在硬科技创新的时代，科技制造价值巨大。


    第二個机会：利用科技解决巨大的潜在市场需求。


    著名经济学周其仁老师提出过“创新上下行”的概念：


    +   从技术出发找到应用机会是下行；

    从市场需求出发找到合适的科技去满足需求是上行。


    # 三、中国在全球创新中面临的三个挑战


    当然，在中国参与的这一轮的全球创新中，既有机遇，也有挑战，我帮你分析可能存在的三个挑战：


    第一个挑战，是中国的商业实践和全球的商业规则不接轨，容易造成别人误解。


    中国企业要走出去，实现国际化，最好遵守国际的商业规则。'
