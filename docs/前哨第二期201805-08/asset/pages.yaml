  md: '# 年度复盘 | 视野：全球科技创新的路径


    这一讲，我会给你深入剖析科技创新的三个有效路径，它们分别是专利转化、开源创新、应用创新。


    希望你在寻找科技创新机会时，能高效地找到有效突破点，并快速制定实施计划。


    我一直强调：有难度的创新才有机会，因为竞争者少。而如果一个创新没有难度，门槛低的结果就是竞争反而更加激烈，你成功的机会就更渺茫。


    就像以色列的创新文化里说的，面对两件事，一件容易，一件困难，你就要选择困难的那件去做。


    那么，面对有难度的创新，该如何入手呢？


    下面我就给你讲解科技创新的三种路径：


    # 一、专利转化


    科技创新最难的，在于原始创新和科研成果转化这两个环节。


    而全球科技创新的源头在高校，那你就有第一个寻找科技的路径，就是去高校寻找创新科技的专利，并加速成果的转化。


    专利转化，有两个步骤，先获取专利，再进行转化。


    获取专利，又包含两种：


    +   - 一种是将专利当作一种商品，通过专利交易，转让方获得报酬，而买入方获得核心技术；

    - 另一种是专利许可，就是使用方向专利所有人买使用权的授权。


    进行专利转化，是在获得专利技术之后，实现产业化，简单讲就是技术落地。


    作为科技创新的源头，高校通常积累了大量的科研成果，但往往产业化效率太低。


    于是是在1980年，美国推出了《拜杜法案》，后来被纳入美国专利法，标题为“联邦资助完成发明的专利权”，明确规定了高校的科研成果归高校，高校自己有权利处理专利，同时高校在做科技转让的时候，是可以不转让专利，而是转让“独家商业权益”的。


    也就是说，专利继续归高校所有，教授还可以在此基础上继续做研究，但是所有的相关商业部分转让出去，使得企业可以基于专利技术去开发产品，而且获益。


    原来只有大公司才能花大价钱购买高校的先进科技，很多时候不光要买专利，还要把相关科学家和他的实验室一起买走，因为要不然你把专利买走了，科学家还在高校，他就搞不相关
    rasio 科研了。


    《拜杜法案》使得高校大量的知识产权可以被转让，而且只转让独家商业权益，不涉及专利，科学家可以继续做研究，所以专利转让费用大大降低了。


    现在转让费用降低以后，不光大公司买得起，小公司也买得起。于是也给了小公司进行技术商业化提供了一条可行的路径，专利转化的速度大大加快了。


    《拜杜法案》之后，小企业更容易拿到高校的先进科技，可以提前做突破性创新。因为小企业做微创新，壁垒不足，没有竞争优势，会被大企业挤压，所以小企业更愿意尝试突破性创新。做突破性创新具有不确定性，大企业无法确保内部利益一致，做起来阻力很大，反倒是微创新，成绩有目共睹，是大企业更加喜欢的。


    所以，小企业更适合做突破性创新，大企业更适合做微创新。


    《拜杜法案》实施以来，创新企业在美国相对完善的商业制度上，建立并执行双长制的模式，就是一个好的创业公司，必须有熟悉市场运作、业界经验丰富的企业家，同时也需要有一位专注技术的科学家。而在“双长制”的设计中，企业家发挥的作用非常关键，因为需要主导推进技术落地和商业化进程。


    我特别看重专利转化，通过专利技术来建立技术壁垒，可以显著增加企业的竞争力。


    此外，专利转化是一项非常复杂的专业性工作，不只需要持续的关注和投入，及时跟进全球著名高校科研的研究进展、专利、成果等尽早构建竞争壁垒，还需要有专家指导。而这，也正是我的团队正在做的事情。


    # 二、开源创新


    前面我跟你讲了专利转化，专利属于某个组织，或某个人，谁得到了专利技术，谁就能拥有技术壁垒。但除此之外，寻找科技创新还有第二条路径，就是使用开源技术。


    开源就是所有资源由大家共享，并且大家免费使用。由于有了群众的智慧，加上开源社区的交流，就很容易形成思想的汇聚，在开源的基础上创造新价值。


    目前你熟悉的开源技术，肯定有电脑操作系统 Linux、手机操作系统安卓，还有特斯拉开源了电动车技术等等。这些开源技术的提供，降低技术的准入门槛，让市场上更多有能力的人积极参与到新技术的应用开发中，促进对应领域技术在具体行业的落地。


    你也可以看到，开源最大的问题就是壁垒不足，如果某个科技趋势一热，就很容易吸引牛人进入。如果你领域不热门，你千万不要自以为自己很牛，只能说你这个领域很小众，等做大了同样会面临剧烈竞争。


    目前大公司的人工智能的通用算法是开源的，比如谷歌的 Tensor Flow，可以让更多的人参与应用开发，反过来加速整个行业的发展。


    我希望你注意的是，人工智能已经渗透各个行业，你的行业没有用到人工智能，千万不要高兴太早，不是你的行业用不了，更可能只是暂时还没有人用而已。


    我给你举一个人工智能应用例子，就是 Ostagram 的网站。这个网站的功能，就是帮你把一张自己的照片，转化为一张具有名家画作风格的照片，你不是艺术家，也可以像艺术家一样，将众多的图片素材经过后期加工，融合形成一个全新的艺术图片。


    Ostagram 网站，其实是一个不出名的俄罗斯程序员基于谷歌 DeepDream 算法而开发出来的应用。


    谷歌 DeepDream 算法是 Google 在 2015 年开源了分类和整理图像的人工智能程序。这个不出名的程序员，要实现 Ostagram 的功能并不简单，它需要有抽取画作风格的
    DeepDream 算法支持，并且还需要强大的算力。但他实现这一切，全靠开源的技术，算法是谷歌的，算力是租用云服务器的。


    本来，我们一直觉得艺术创作领域，人工智能不会太早介入。但是 Ostagram 的应用，让我们看到开源创新的优势，任何人只要有能力 and 想法，都可以参与到科技创新当中来。开源降低了技术的准入门槛，容易产生新的创新，但由于壁垒不足，同时也面临更大的竞争压力。


    # 三、应用创新


    前面介绍了专利转化和开源创新，这都属于技术方面的创新。其实还有第三种创新路径，就是从需求出发，找到合适的科技以开发出满足需求的应用，或者为科技寻找另一种应用场景，把一些已经相对成熟的技术，从一个应用领域，移植到另外一个不太相关的领域，我把这种方法称为应用创新。


    比如说安全气囊，你都很熟悉了，所有的车辆上都会配备，这项技术大约有 70 年的历史。既然安全气囊可以防止人撞到车，那如果转过来想，能不能把安全气囊装在人身上，防止人跌倒时直接撞到地面，避免人的受<|start|>
    伤呢？


    这就是我们以前讲过的医疗可穿戴公司 Active Protective 做的事儿。


    我们都知道老人摔倒是個致命问题，随着逐渐进入老龄化社会，这个问题变得越发严重，大家也都知道这可能会是一个很大的潜在市场。但 Active Protective
    就真的研发出了一款“老人防跌倒腰带”，解决了老人跌倒骨折的问题。他们还结合人工智能改善产品使用体验，扎扎实实从老人的真实需求出发，应用科技的力量，找到解决方案。'
