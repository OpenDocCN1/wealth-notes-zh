  md: '# 221 | 工业机器人：人机紧密协作下的新机遇


    221 | 工业机器人：人机紧密协...


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 人与机器人协作带来了那些新机遇？

    2. 外骨骼机器人更适合应用在哪些领域？


    在第一讲中我们说过，目前距离通用智能和通用行动能力的机器人的大规模应用，还为时尚早。现在，主要还是以人与机器紧密协作，优势互补，来完成任务。


    这一讲，我们就分别聊下在物流、救援和巡检行业中，人机紧密协作下的新机遇。


    # 一、外骨骼机器人提高工作效率


    第一个要讲的新机遇，是让我们觉得很科幻的外骨骼机器人，这是针对具体行业 的，主要目的是提高人的工作效率。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_55_0.png)


    # 二、用于救援领域的机器人 EMILY'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/ec68de57cecf4aa37e2670e9d4879832_56_0.png)


    这个水上救援机器人名叫 EMILY，它由美国 Hydronalix 公司研发。


    从外观上看，这款机器人长约1.2米，重约11千克，看起来像一个裹着红色救生衣的圆筒。虽然体积不大，但它的浮力一次可以救援5人以上。而且它使用的是航空级复合材料，可以直接从直升机上或者桥梁上抛到水上使用。


    # 为什么要用航空级复合材料呢？


    这是为了减轻重量，保障足够的强度，以及耐海水的腐蚀。


    EMILY 由电机驱动航行，有防水的麦克风和无线电通信设备，可以实现远程救生员和落水者的语音通话，同时，它还安装了具有夜视能力的防水相机，可以通过智能手机远程观察现场，即使在晚上也能工作。


    # 那么，它是如何工作的呢？


    比如人类救生员通过望远镜或肉眼观察水面，当发现有人落水，就能远程用 EMILY 快速赶往落水地点，它的速度可以达到每小时35公里。在到达落水者身边后，落水者可以抓住机器人或者救援绳，然后被快速带到岸边，或者
    dependencies 近船只配合救援。而且，EMILY 的抗浪浪能力非常强，可以在人类救生员难以到达的危险水域实施救援。


    # 三、用于高压线巡检的无人机


    听到这儿，估计你可能想到了这跟遥控无人机执行任务是一个道理。确实，无人机不仅在物流行业，还能在巡检、测绘、侦察领域协助人类。


    就以高压线巡检来说，我们知道，高压线本身架设得非常高，所以人工巡检就必须爬到很高的位置进行检查，而且高压输电线路有不少架设在深山老林里，这给巡检工作带来了很大的障碍。人工巡检既危险，效率又低。


    而采用无人机巡检就能够轻松解决问题，一边遥控，一边可以在地面接收设备上实时看到高压线路的情况，而且还可以360度无死角地观察。这比人工巡检效率高多了，而且解决了以前人工巡检的盲区问题。


    目前国内大多使用大疆无人机进行电力巡检，一次18分钟的飞行就可以巡检5公里的范围，工作效率是原来人工巡检的8-10倍。


    此外，还有一个有意思的现象，以前年轻人不愿意做高压线路巡检这种苦活累活，甚至有些地方高薪都招不到人，自从有了无人机巡检后，这个工作突然变得时髦起来，很多年轻人都加入了巡检的岗位。当然了，除了电力巡检，无人机也已经广泛用于边境、山火多发区域、危险区域执行巡检任务。


    # ——▶︎ 课程小结 ◀︎——


    这一讲，我们主要介绍了应用在工业领域的外骨骼机器人，以及救援、巡检领域的机器人。希望你掌握以下三点：


    第一，目前，国内外工业领域用外骨骼机器人的主要用途，还是帮助人类减轻负担、提升效率。未来，可以持续关注医疗外骨骼机器人的研究成果，思考如何与劳动密集型行业的实际需求结合，开发能迅速规模化生产的产品。


    第二，尽管在传统工业领域，已经有类似日本 FANUC、KUKA、ABB、安川电机等企业占据绝对市场份额，但是在救援、巡检、测绘、侦察等特殊领域，各类机器人正在发挥越来越大的作用，可以考虑下利用机器人来解决这类行业的困难问题。


    第三，总体来看，各类机器人之间的相互协作，不同功能机器人的优化组合，机器与人类的完美配合一定是发展方向。所以，无论从心态，还是行动上都要提前准备好迎接这个大趋势。


    # ——▶︎ 课后思考题 ◀︎——


    你所从事的行业存在哪些问题呢？有哪些环节可以通过机器来进行协助呢？


