    # ——◆ 课程小结 ◆——


    这一讲，我给你介绍了云测公司从应用测试平台开始，扎扎实实优化 App 的测试服务，提前布局 5G 和全球化战略，逐渐成长为“5G 应用服务平台”，未来随着
    5G 发展，云测会越来越好。


