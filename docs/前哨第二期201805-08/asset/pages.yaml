- pgno: 37
  md: '你的制约性的表示，签了以后就可以拿到更多的资料，尤其是技术的进展资料。


    因为我们说投企业，企业的发展是一个动态过程，所以投企业并不是简单地看企业的现状，而是看企业的过去历史和发展情况，从而对未来作出判断，所以必须要有个动态的了解。


    另外就可以和 CEO 建立更深入的互动。一般情况之下，我们签了 NDA 之后，都会主动地飞到对方的城市去和对方作更深入的交流。


    同时需要的话，也可以让他们介绍他们的其他股东和投资人给我们，我们去见个面，或者我们至少开个电话会议，请对方从他们的角度，帮助我们分析他们投资这个项目的原由在哪里，聊聊他们认为这个项目的好处在哪里，需要补充什么资源。


    一般来说，国外的专业的投资人也好，企业家也好，都会比较客观，虽然是已经成了对方的股东和投资人，但是往往在交流的时候，依然会把对方的不足坦诚地告诉给你，这样对于了解这个项目，会是一个特别好的补充。


    # 四、如何投项目？


    前面我们介绍了如何去了解项目，当你决定以后，项目确实好的时候，就要学会如何投得进去。


    我们一直强调，投资是双向的，我们中国很多人，往往会觉得人家的项目好，就各种表示，我能帮你做中国市场，而且我特别有钱等等，希望能够投进去，但是反馈都不够好。


    其实原因很简单，就是对方要先对你建立信任，而且信任需要的是你提供自己的信用。Credit 这个词在美国实在太重要了，而证明你自己信用的，就是你的既往历史，国外叫做
    Track Record，你做过什么事情，这是特别重要的。


    所以，如果要取得对方的信任，最好先告诉对方，我投过什么公司，如果没投过，我有过哪些合作，尤其是和国外企业的合作，都会变成你的信用的背书。


    # 五、作为投资人的基本功


    下面我还想说一说投资人的问题。


    我们都知道，在很多人的心目中，认为投资这个事情很好做，你拿着钱，到处去大把地撒钱，人人都欢迎你。


    但是，其实投资人最应该保持谦虚，创业者为了你的投资，你说话他不太会反对，其实我们一定要心里知道，在他的专业领域，创业者一定比我们投资人懂得多、懂得深。所以投资人切忌骄傲，也切忌出主意。


    # 六、钱以外的能力和资源


    # 第一，我们希望是产业合作。


    # 第二，是我们不太接受小额的投资。


    # 第三，我们希望资金能力不足的朋友，不要想在资本上和我们合作


