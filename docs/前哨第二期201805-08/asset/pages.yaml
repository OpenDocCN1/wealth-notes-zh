  md: '# 210 | 云计算平台：谷歌云平台GCP


    210 | 云计算平台：谷歌云平台。


    # —— • 内容看点 • ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. 谷歌的云平台 GCP 与亚马逊 AWS 有何不同？

    2. 不同企业如何选择合适的云计算平台？


    在上一讲中，我为你介绍了亚马逊创始人、董事长兼 CEO 杰夫·贝索斯的故事，以及亚马逊的云计算服务平台 AWS，目前，AWS 的市场占有率遥遥领先于其他竞争对手。


    但你可能不知道的是，其实“云计算”的概念是谷歌提出来的，有意思的是，谷歌推出云计算服务平台却比亚马逊要晚。你肯定很好奇，谷歌这是起来了大早赶了晚集啊，这到底是怎么回事儿呢？


    它后来推出的云计算服务平台和亚马逊有什么不一样呢？它们各自的发展前景又如何呢？

    在这一讲里，我会详细给你解答。


    # 一、谷歌云计算平台 GCP


    12年前的2006年8月9号，谷歌的 CEO，Eric Schmidt 在硅谷的搜索引擎大会上，首次提出了 Cloud Computing，也就是云计算这个概念。


    尽管这个概念后来被广为传播，成了技术名词，可当时谷歌的云计算平台还在理论研究的阶段，但仅仅只是10天之后，亚马逊的云服务 EC2 就向公众开放了，谷歌在实践上被落下了。


    随后经过一年多的准备，谷歌在2008年4月发布了著名的谷歌程序引擎 Google App Engine，简称 GAE。


    它是一个面向企业和开发者的一高度集成的计算平台，简而言之，就是用户可以在谷歌提供的运行环境中开发和执行程序，而不需要关心底层硬件和操作系统等细节。这个立意是非常好的，它对于中小型创业公司有很大的吸引力。


    可是谷歌当时并没有把重心放在云计算上，很长一段时间没有更新相关的产品，在之后一段时间里，谷歌连一个值得拿出来炫耀的大客户都没有。等几年之后回过头来一看，已经被亚马逊的
    AWS 甩在了后面。


    2011年10月，谷歌又推出了升级后的云计算平台，英文是 Google Cloud Platform，简称 GCP。


    这一次，谷歌上心了很多，先后又推出了好几个相关产品，将新功能补充到了平台上。到了2018年的现在，谷歌已经是仅次于亚马逊和微软的云计算服务提供商了，GCP
    也是近年来越来越快的云平台，在迅猛追赶亚马逊 AWS。


    而且也已经有不少大客户了，包括阅后即焚的 Snapchat，Snapchat 我们介绍过，它在短短几年内吸引了不少00后，每天都有上亿的活跃用户，和超过800万的视频量，Snapchat
    就是使用了 GCP 的基础设施服务，来支撑自己网站的运营。


    # 二、GCP 和 AWS 的对比


    那么，谷歌的 GCP 对比亚马逊的 AWS，除了推出时间更晚一点，业务量要少，各自拽了一些大小客户以外，到底还有什么不同呢？


    下面，我就给你仔细分析一下。


    首先，谷歌的云计算平台，从最早第一次推出服务的时候，就没有走亚马逊提供虚拟硬件平台的路线。


    在第一讲中我介绍过，目前的云计算平台，能提供基础设施、平台和软件这三层级的服务。


    亚马逊的模式更偏向基础设施方面，它提供的是虚拟化的机器系统，用户需要在这个系统上搭建自己的编程环境。


    谷歌的模式偏向平台层面，它提供的是可以直接开发应用的程序接口和环境。


    怎么理解呢？


    我们就用做蛋糕来对比：


    亚马逊的 AWS 提供的是烤箱，你需要自己配置蛋糕胚，从揉面到烤制的全部过程都自己动手。


    谷歌提供了蛋糕胚和整套烤制服务，用户只需要集中精力做好调料配比，看什么口味比较合适即可。


    那么，哪一种方式更好呢？


    其实这两种服务各有优劣。


    比起基础设施服务，直接使用平台服务的花费会更低，开发周期更短。正像上面的例子，比起从头到尾自己做蛋糕，用已经做好的蛋糕胚，会更加省时省力，省去了一些没必要的投资。


    不过，这种服务的灵活度就比不上基础设施服务了，因为烤箱其实还可以烤披萨或者烤饼干，而提供好的蛋糕胚却只能用来做蛋糕。这样，应用场景就受到了限制。


    因此，相应的，这两种服务也会适合于不同的用户。


    # 三、谷歌云平台的新动向


    针对人工智能，谷歌最近还推出了一条新钩，它就是云端 TPU 与 TensorFlow 的结合。


    TensorFlow 是谷歌研发的人工智能学习系统，可以被用于语音识别或图像识别等诸多机器学习和深度学习领域。'
