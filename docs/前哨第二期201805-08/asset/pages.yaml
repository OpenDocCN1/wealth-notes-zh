  md: '# 255 | 5G通讯技术：芯片巨头-高通


    255 | 5G通讯技术：芯片巨头。


    # —— 内容看点 ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 高通为何能成为手机芯片领域的霸主？

    2. 我们能从高通的商业模式中学到什么？

    3. 5G 时代的高通面عد哪些挑战？


    第一讲，我说过 5G 通讯技术最关键的就是芯片。这一讲，我们就讲解全球手机芯片领域的巨头，高通公司。


    它为小米、vivo、OPPO，甚至苹果等各大手机厂商供应通信技术解决方案和移动手机基带芯片。


    如果你关注科技领域的大事儿，应该还记得在2016年10月，高通希望用470亿美元并购全球最大的汽车芯片制造商，荷兰的恩智浦公司。但直到2018年的今天，这起并购案或多或少因为中兴的芯片事件，一直没能获得中国的审批，一拖再拖。


    这次并购是否能成功，咱咱们暂时不展开讨论，我们关注的是，高通这次收购的目的，就是想进入汽车芯片市场。


    这背后的逻辑，就是在 5G 时代，无人驾驶汽车会是一个异常庞大的市场，不仅仅是传统汽车的供应商和车企必争，几乎所有相关领域的企业都想坐上牌桌分一杯羹。而恩智浦，它不仅在汽车电子领域，还在汽车雷达解决方案、自动驾驶计算平台等方â—面，都有相当多的技术积累。


    高通想并购的另一个条件，就是这两家公司交叉业务少，能够最大程度实现优势上的互补。如果能成功的话，高通的业务就能实现多元化，而不单单是只局限在移动通讯市场。


    其实不只是高通要收购恩智浦，其他半导体公司也对高通虎视眈眈。


    这个新闻你可能也记得，2017年11月6日，全球最大的半导体制造商之一的博通，对高通提出了1300亿美元的主动收购要约。如果博通和高通合并，就会成为全世界第三大半导体公司，仅次于英特尔和三星。当时最终，这起收购在高通全体董事反对，美国政府出面干预后，没有成功。


    产业巨头之间的并购，光听听1000多亿美元的额度就让人觉得有些吃惊了。高通要买别人，别 人又要买高通，这个有点螳螂捕蝉黄雀在后的意思。


    最主要根由在那里呢？


    这就是这一模块我们在说的 5G。


    高通要买恩智浦，是要为未来的 5G 时代作准备，博通要买高通，主要原因就是最近这些年高通的业绩并不那么令人满意，给了资本玩家下手的机会，一旦得手，肯定也是要下注未来的
    5G 市场。


    在 5G 时代，高通为啥这么重要呢？


    那么咱们就说说这家公司。


    # 一、半导体巨头——高通


    高通在半导体行业，属于所谓的 Fabless 模式，就是高通只设计芯片，但制造是交给台积电或三星等代工去生产。


    高通最初创立时，并非是一家芯片公司，而是一家通信解决方案的公司，它的商业模式主要得益于收取专利授权费用，可以说，专利就是竞争 力，这句话形容高通的“发家史”特别合适。


    在1985年，Irwin Jacobs、Andrew Viterbi 等人组建了高通，也就是“高质量通讯”的意思。


    第一个产品，是用于卡车卫星定位的系统 Omni TRACS。而这套系统就是基于 CDMA 技术，当时，CDMA 的前景尚有不少争议，一些学者甚至怀疑 CDMA
    能否实用化，更不用说商用化了。


    为了证明 CDMA 有用、好用，高通花了数年时间进行实地实验、驱动测试以及行业演示。事实证明，CDMA 技术确实能够提供更好的声音质量，运营成本也更为低廉。此后，CDMA
    逐渐进入了发展的快车道。


    1990年，高通开始将 CDMA 技术用于手机，并在1992年开始了芯片业务，而且申请了专利。


    实际上，CDMA 技术的出现，改变了全球无线移动通信的局面，从那时至今的 3G、4G 乃至更新的尚处于试验之中的 5G 技术，基础原理都来自于 CDMA 技术。之后，高通的
    CDMA 技术得到了许多新型电信运营商的认可，特别是在率先大发展 CDMA 技术的韩国等国家，纷纷投资 CDMA 市场。


    由此，CDMA 技术及相关专利几乎成为了所有通信技术标准的基础。而高通在 CDMA 技术上拥有包括600多项核心专利，垄断了全球90%以上的 CDMA 市场。在中国，这一比例几乎达到了100%。这让高通单单从专利授权费中就获得了巨大的经济收益。


    目前，全球几乎所有人使用的手机里，都有高通的专利。而且高通深知芯片占有率的重要性，它知道手机厂商一旦习惯了自己的芯片解决方案，再去换其他家的就会导致很高的迁移成本，所以对那些使用高通芯片的手机厂商，在专利授权费方面会有一定折扣，但具体的专利授权费是多少却是保密的，也就是说，基本就是高通说了算。


    需要说明的是，高通收取的专利费，并不是基于提供的芯片的价格，而是基于整机价格，也就是手机售价贵，那它收的专利费就多，概括一下，就是“按照整机价格收取专利费”的模式。


    正是因为高通“霸道”的做法，所以它才一直被指有垄断的问题，它“不合理”的专利收取标准，甚至引起了各国政府的不满，频繁发起对高通的反垄断调查。有人戏称，高通公司是世界上唯一一家律师比工程师多的科技公司。


    可见，专利对于公司发展的重要性不言而喻，如果不了解行业内专利的话，时刻就会有侵犯他人专利，被起诉的风险。更重要的是，如果根本不了解行业内科技前沿的动态，将错过提前进行产业布局的好机会，无法构建立技术门槛，从而丧失未来的竞争力。


    当然，高通的商业模式除了收取利润丰厚的专利授权费以外，还在于“轻资产”的运营模式。


    它把手机部分卖给了日本京瓷公司，基站部则卖给了瑞典爱立信公司。它的芯片主要业务是设计手机基带芯片，市场份额占据全球市场的一半以上。


    然而，即使是最核心的芯片技术，高通公司也是只研发不生产，也就是我刚才说到的 Fabless 模式，而是把主要精力放在知识产权、技术标准等方面。


    # 二、5G时代的高通


    那么在人工智能和 5G 时代，高通在延续自己的优势以外，会面临什么样的挑战呢？其他科技大公司又会如何应对呢？


    在 5G 时代，高通在中国拥有了一个强劲的对手，那就是华为。


    然而，在2018年5月关于 5G 编码的投票事件中，华为的 Polar 码以一票之差输给高通的 LDPC 码，这两种码是 5G 的数据和控制编码，Polar
    码的特点是效率高，而 LDPC 的特点是稳定性能高。


    这意味着，高通在 5G 时代可以继续向广大手机厂商收取专利费了。按照高通的标准，如果国内的手机厂商每卖出一台4000元的手机，并且全部使用了高通 5G 技术标准。那么就需要向高通交130元专利费。


    目前，OPPO、vivo、小米等手机厂商，已经经与高通签订采购协议，未来它们还要继续支付专利授权费。而华为是和中国联通签署了 5G 战略合作。


    此外，2016年10月高通宣布推出支持 5G 的基带芯片——骁龙 X50 基带芯片。2017年，就宣布芯片组在 28GHz 毫米波频段上实现了数据连接，预计在2018年实现商用。除了研发芯片，在模拟前端，如天线、放大器与滤波器等方案上，高通也有比较完整的布局。


    总的来说，高通在10几年前就启动了 5G'
