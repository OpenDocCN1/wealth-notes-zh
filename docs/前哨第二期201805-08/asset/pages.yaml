  md: '# 212 | 云计算平台：数据的安全性如何保障？


    212 | 云计算平台：数据的...


    # —— ◆ 模块总结 ◆ ——


    本模块的话题是云计算平台，我们介绍了三个重点：


    第一，云计算平台将成为像水和电一样的基...因此，国内外 IT 巨头都要投入巨资建设云计算平台。


    亚马逊的 AWS 目前是该领域的老大，它偏向于提供基础设施服务，更利于企业直接移植成熟的 IT 产品到平台上；


    谷歌的 GCP 是近年来自业务增长速度最快的云平台，它偏向于提供平台级别的服务，利于创新型产品直接使用现有方案，加快开发步伐。


    第二，AWS 是亚马逊为解决现实问题而实战出来的，它的服务更贴近企业目前的需求，能迅速得到市场的认可。而谷歌的 GCP 是面向未来规划出来的，容易实现更加系统的布局。例如，人工智能同样也是谷歌未来规划的一部分，将它与
    GCP 相结合，不仅能推动人工智能在各行业中的应用，也可能让人工智能的用户不再选择其他平台。


    对创新者而言，亚马逊和谷歌的这两种做法，具体哪种更好，没有一定之规。不管从哪个方向创新，都要注意扬长避短，兼顾短期和长期目标才能成功。


    第三，云计算平台在发展过程中遇到了数据中心越来越庞大，利用率过低的问题，并受到了网络速度的限制。硬件计算资源融合和“软件定义基础设施”，能真正把人从繁巨的运维工作中解放出来。


    Serverless 无服务器架构用轻量级的微服务代替服务器，用微程序单元供开发者调用，能极大地提高云平台的资源利用率，并增加企业对平台的依赖程度。


    未来平台会出现寡头垄断的局面，而云端的上百 G 高速智能网络，和 5G 引领的用户端与云端的高速度连接，将带来更多云服务使用的新机会。


    # —— ◆ 用户问答 ◆ ——


    想问一下王老师，云计算和区块链未来会如何结合？


    还有好多位用户也提到了相似的问题，就是云计算和区块链的关系。


    我的回答是：


    其实这个问题相对简单，区块链最大的问题之一，就是当使用者增加的时候，每次交易就要写入更多的账簿，所以计算量大大增加了，交易的时间也大大延长了。


    而云计算的发展，包括 5G，肯定会缩短运算所需要的时间。

    但因为现在在区块链的计算其实就已经在云端了，所以区块链只会享受整个云计算加速带来的好处，没有别的特殊的其他好处了。


    在中国的一些和政府数据相关的业务，都不希望把自己的数据交给云平台。希望王老师讲一下。


    我的回答是：


    大数据分为公共数据和私有数据，加强公共数据的利用，对整个社会的发展都是很有价值的。


    但因为是公共数据，那只能由政府来管理，在每个政府部门里，数据都是自己能用就行了，确实没有和别人分享的动力，所以这事需要更高级别的政府来出面协调。


    比如在美国，奥巴马政府意识到建立数据社会的重要性，所以于2009年就任命了国家的首席信息官 CIO，负责整合美国各个政府部门的数据，使得它们可以被汇总，从而增加利用效率。2015年，奥巴马政府又任命了白宫首席信息科学家，从技术的角度帮助首席信息官完成不同部门数据的整合。


    这方面值得中国政府借鉴。


    # ■ 划重点


    +   1. 云计算与 5G 的发展，区块链会享受到运算时间缩短的好处。\n2. 更不希望把数据拿出来共享的是企业，因为数据就是竞争力，所以政府一方面要推动自己的公共数据的共享，另一方面也要积极立法，推动互联网巨头把数据拿出来共享。\n3.
    阿里更像是亚马逊 AWS 和谷歌'
