    # ■ 划重点


    1.5G 网络最大的突破，就是它不再局限于移动互联网，而是能支持 AR、VR、自动驾驶、人工智能等海量的应用，让我们真的进入到万物互联的时代。

    2.5G 芯片的研发，基本只有超大型科技企业参与，其他企业很难既拥有研发能力，又有足够的资本，同时还要有足够庞大的通信领域合作链条。

    3.5G 时代，在基础设施领域，中小企业很难找到机会，但创意产业在科技手段加持后，一定会迎来大爆发。


