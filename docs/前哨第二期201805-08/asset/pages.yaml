  md: '# 204 | 下一代计算：人工智能芯片竞赛


    # —— ◆ 内容看点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 为什么要研发人工智能芯片？

    2. 寒武纪为何能成为独角兽企业？

    3. 人工智能芯片竞争的核心是什么？


    这一讲我们要介绍的人物，是寒武纪的陈氏兄弟，陈云霁和陈天石。


    相信你应该听说过华为的 Mate 10 手机，这款手机在2017年10月发布的时候引起了很大的关注，有不少的技术亮点。


    比如其中的一个技术亮点就是智能拍摄，也就是当你把摄像镜头对准你想拍摄的景色或者物体的時候，手机就知道自己将要拍摄的是夜景、是花朵还是蓝天，而且它能快速地自动调节到最优化的拍摄方案，而不再需要手动去切换“人物”或“风景”这些模式。


    除此之外，还推出了拍照翻译功能，也就是说你对着菜单拍一张照片，对应的翻译就在屏幕中显示出来了。


    让这些功能得以实现的就是上一讲我们提到的麒麟970处理器芯片，而它里面集成了寒武纪1A神经网络处理器。


    神经网络处理器，简称叫 NPU，它就像我们熟悉的中央处理器 CPU，专用图形处理器 GPU 一样，NPU 是专门负责神经网络的专用处理器。


    神经网络是模仿大脑中神经元连接的计算结构模型，是人工智能最重要的方法和基础，它在处理图片和音频上，比传统处理器能够提升近百倍。


    在这项科技的背后，是中科院计算所的创业公司，也是备受投资追捧的人工智能芯片“独角兽”企业——寒武纪。


    讲到寒武纪，必然会谈到中科大少年班的兄弟俩，哥哥陈云霁和弟弟陈天石。


    很多人好奇，这对来自江西的兄弟，是怎样在“芯片”行业做出国际知名的“独角兽”的？


    这一讲，我们就来讲讲他们的故事。


    # 一、陈云霁和陈天石兄弟


    陈氏兄弟出生在江西南昌的一个普通家庭，他们的爸爸是电力工程师，妈妈是历史老师，家里两个孩子，哥哥陈云霁，弟弟陈天石。


    两个天才少年一路开挂，哥哥陈云霁9岁就上了中学，14岁考入中科大少年班，19岁步入中科院计算所硕博连读，24岁就拿到了计算机博士学位，25岁就成为了八核“龙芯3号”的主架构师，29岁晋升为研究员，33岁荣获中国青年科技奖。


    比哥哥小两岁的陈天石也是一路沿着哥哥的脚步，从中科大少年班一路追到了中科院计算所。


    陈云霁是“工程强人”，到中科院计算所后师从“龙芯之父”胡伟武研究员，成为了当时龙芯研发团队中最年轻的成员，而且他在龙芯处理器的设计方向卓有成就。


    与哥哥不一样，陈天石则是“理论牛人”，他在中科大少年班拿到了数学学士学位，攻读博士时师从国内并行计算的元老陈国良院士和姚新教授，这让他积累了很深的算法与理论功底。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_12_0.png)


    说到这儿，我简单介绍下中科院计算所，它是华罗庚主持筹建的中国最早的计算机研究所，也是名副其实的计算机体系结构研究的国家队。


    从两弹一星到曙光系列超级计算机和龙芯处理器，一直走在中国的最前沿。而且在科技转化上孵化了曙光、曙光、龙芯等一系列知名的企业，而寒武纪正是最新的代表企业。


    # 二、人工智能芯片


    在读博士期间，陈云霁的研究方向是芯片，陈天石是研究人工智能，兄弟俩能够出勤又珠联璧合，于是顺理成章就开始研究人工智能芯片了。


    最早的人工智能芯片的概念，是法国国家信息与自动化研究所 INRIA 的 Olivier Temam 教授提出的，恰好他和中科院计算所有多年合作。


    所以陈氏兄弟和 Temam 教授共同开展了一系列的开拓性的学术工作，他们的成果成了世界范围内智能芯片研发的必读文献。后来 Temam 教授加入了 Google，而且他也把这些思想融入到了
    Google TPU 的设计中。


    咱们《全球创新260讲》的同学肯定都知道，这一轮的人工智能大发展，是得益于深度神经网络，也就是 Deep Neural Networks，简称 DNN 的突破。而现在的人工智能芯片，主要指的就是神经网络芯片，也就是用神经网络的理论来设计专用芯片。


    陈云霁曾经说到：


    > 人的大脑是已知最智能的物体。如果能把大脑中神经元和突触数字化抽象出来，这样的数字化网络某种程度上可能就继承了人脑对信息处理能力。


    > 一方面，深度神经网络的算法和应用越来越强大，而大规模神经网络和海量数据对计算机的算力要求越来越高；

    另一方面，传统的通用 CPU 核心数量有限，面对庞大的神经网络模型和海量数据，计算速率不高。而寒武纪就是希望通过设计新的专用的神经网络芯片来解决这个问题。


    从2014年到2016年，兄弟俩合作在学术圈引发了一波“DianNao（电脑）”风暴，连续在顶级学术会议上发表了一系列名称颇有个性的文章。


    > 比如他们在2014年的時候，在国际顶级计算机会议 ASPLOS 上发表名为“DianNao（电脑）：一种小尺度的高吞吐率机器学习加速器”的文章，并斩获最佳论文奖。


    > 同年又以“DaDianNao（大电脑，性能增强的第二代）”收获了 MICRO’14 最佳论文，MICRO 是国际微体系结构会议，这也是首次来自美国以外的作者获得此奖。


    2015年，兄弟俩又接连在国际顶级会议 ASPLOS 和国际体系结构大会 ISCA 上发表了“PuDianNao”（普电脑，通用型机器学习芯片）、“ShiDianNao”（视电脑，图像识别处理芯片）等文章。


    据说，因为他们知道老外读“DianNao”这2个拼音很拗口，于是特意起了这个名字。


    但这些极富中国特色的名字宣示着，中国在人工智能芯片研究领域走到了全球引领者的位置。


    # 三、人工智能芯片的价值


    那么，为什么要研发人工智能芯片呢？它有什么优势呢？


    计算机技术的发展一直伴随着通用性和专用性的矛盾，一般来说越通用的设计，普适性越强，但对某一类应用就会性能有限；而专用的设计性能最好，但又不够灵活。


    打个比方，通用的设计就好像是瑞士军刀，功能很多，能应对很多场景，但如果用来切菜，肯定不如菜刀好用。


    芯片领域也是一样的道理，CPU 就是最通用的设计，但用来处理深度专项任务效率太低。


    比如，NVIDIA 公司自从2006年以来，就把处理图形、游戏的 GPU，做成了可以科学计算的通用计算图形处理器 GPGPU（General Purpose
    GPU）。然而，尽管这些做图形的处理器已经比 CPU 加速很多，但仍然只是在原有的体系架构里提高速度而已。


    在这个背景下，人们就开始研发专用化的神经网络处理器了。人工智能芯片从研发到设计，都是基于神经网络算法和机器学习的，所以在专项的计算能力上，性能近'
  merge: -1
  img_proc: true
- pgno: 13
  md: '习的，所以在专项的计算能力上，性能近百倍于那些传统的芯片。


    而人工智能芯片的主要优势有以下三点：


    +   1. 专门设计的芯片架构和存储结构，大大缓解了大数据对存储的压力；

    2. 面向机器学习专用的指令集，大大简化了指令的复杂度，一条指令可以完成CPU上成百上千条指令才能完成的操作；

    3. 超低的功耗，相比耗电的GPU，专用芯片能耗不到其1/10。


    # 四、寒武纪诞生


    在研究取得突破进展以后，2016年3月，陈氏兄弟俩在中科院计算所的支持下创立了寒武纪公司，取名借用地质学上“寒武纪”时代生命大爆发，意喻人工智能的大爆发时代。


    之后哥哥继续留在计算所，为芯片设计埋头写代码作研究，弟弟则出任 CEO 全身心投入公司运作。与国内其他创业公司不同，寒武纪是中科院计算所多年研发的结果。


    实际上，2000年前后，中科院计算所就开始了国产芯片设计研究之路。从2002年研发出的最早国产 CPU“龙芯一号”开始，龙芯系列处理器芯片就一直对标 Intel、AMD、IBM
    等国际顶级巨头，但经过若干年的发展，尽管在技术上取得了很大成功，但因为芯片只是计算机这个非常庞大的复杂系统的核心，没有周边配套设备的跟进，在商业化的道路上十分艰辛。


    其实现在2008年起，中科院计算所就开始了深度神经网络处理器的研制，又在芯片和超级计算机方面有深厚积累，可以说寒武纪具有得天独厚的优势。


    2017年8月，寒武纪完成了1亿美元的 A 轮融资，由国投创业、阿里巴巴创投、联想创投、国科投资等联合投资。


    目前，无论是寒武纪芯片，还是 Google 的 TPU，在无人机、自动驾驶汽车、摄像、人脸识别等领域都有非常广泛的应用。


    除了华为以外，我们相信寒武纪的商业化步伐会越来越快，我们也期待它的发展越来越好。


    我在两年以前，有一次参加央视的节目，遇到了陈云霁和陈天石兄弟，还当场和他们打赌，如果3年内他们的芯片能得到实际应用，我就向他们鞠躬认输，结果华为的 Mate
    10 手机用了他们的芯片，算算时间才两年多一点儿，所以在这里我要向两兄弟鞠躬认输，等到哪天见面了再当面鞠躬。


    我因为一直在全球范围看科技前沿的进展，真心地说：


    > 我们国家确实有些研究达到了世界前沿，但大多数领域的科技水平离世界前沿还有不小的差距，大家千万别看了微信朋友圈里的很多自我吹捧的文章就以为我们已经世界第一了。


    不过陈氏兄弟的研究确实是世界最领先的，再加上和产业实力雄厚的华为合作，真的称得上是强强联手。希望今后这种科技突破和强强联手一番合作能更多些。


    # 五、人工智能芯片的产业现状


    讲完兄弟俩的故事，我们介绍下目前人工智能芯片领域内的发展现状。


    国际方面，IT 巨头纷纷涉足人工智能芯片领域。


    NVIDIA 的通用图形处理器 GPGPU 成为人工智能研发的基石，在深度学习市场仍然独步天下，在3月27日的 GTC（GPU技术大会）大会上，NVIDIA
    教主黄仁勋带来的安装了16个 V100 GPU 和 300GB/s 高带宽 NVLink 的小型超算，其单服务器的性能超过了很多传统的超级计算机。


    而 Google 的 TPU 配合 Tensorflow 软件框架和 GCP 云平台，正在推动全栈式（Full stack）解决方案，这个我们会在下周的云计算平台展开来说。


    擅长软件的微软，也通过 Brainwave 的 FPGA 人工智能解决方案，进入了这个领域。


    Intel 通过收购 Nervana、Altera，也在大力推进机器学习专用芯片的研发。


    此外高通、IBM、Facebook 等科技巨头也都在积极布局人工智能芯片。


    据咨询公司 Tractica 的预测数据，到2025年前，深度学习芯片市场将以40%的年增长率快速成长。


    国内方面，人工智能芯片创新非常活跃，呈现百花齐放的格局，其中一些企业技术水平与国外同行相比不相上下。


    除了寒武纪外，也出现了像地平线机器人等知名初创公司，并获得资本青睐。由百度研究院前副院长、百度深度学习实验室前主任余凯创立的地平线机器人，在去年年底完成了近亿美元的
    A+ 轮融资，由 Intel 领投，嘉实投资联合投资。


    总体来说，无论是行业巨头还是创业公司，都在抢占人工智能芯片市场，竞争不仅仅在芯片本身的性能和功耗，更在于运行其上的软件和应用场景。某些特定领域的商业化应用已经有突破，但
    IT 巨头们争夺最激烈的，还是通用型的应用。


    # —— 课程小结 ——


    今天我们讲了陈云霁和陈天石兄弟和寒武纪，以及人工智能芯片的发展现状，希望你能够掌握以下三点：


    第一，人工智能芯片会像显卡一样，越来越多地出现在我们的日常生活中里。目前，芯片研发、软件和应用落地是关键，需要尽快找到垂直市场深耕，如智慧医疗、视觉芯片、自动驾驶等。


    第二，人工智能芯片从研发到设计，都是基于神经网络算法和机器学习。它的主要优势是：专门设计的芯片架构和存储结构，缓解大数据对存储的压力；面向机器学习专用的简化指令集，以及超低的功耗，相比耗电的
    GPU，专用芯片能耗不到其十分之一。


    第三，世界 IT 巨头纷纷涉足人工智能芯片领域，竞争不仅仅仅在芯片本身性能和功耗上展开，更在于运行其上的软件和应用场景上，尤其是争夺未来通用型的应用市场。国产自主智能芯片领域有寒武纪、地平线，与国外相比也相当有竞争力，期待它们发展得越来越好。


    # —— 课后思考题 ——


    你是否体验过华为的 Mate 系列手机的拍照功能呢？你还了解到哪些领域适合使用人工智能芯片呢？


    欢迎在留言区分享你的见解，我们一起来讨论。


    # 划重点


    +   1.芯片只是计算机这个非常庞大的复杂系统的核心，没有周边配套设备的跟进，在商业化的道路上十分艰辛。\n2.人工智能芯片市场，竞争不仅仅仅在芯片本身的性能和功耗，更在于运行其上的软件和应用场景，如智慧医疗、视觉芯片、自动驾驶等。


    王煜全

    我是王煜全，你的全球科技前沿侦察兵，我们下讲见。'
