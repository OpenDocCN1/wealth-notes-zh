  md: '就是我们讲的积木式创新，合作就像搭乐高积木，有共同的愿景和目标，把完成这个目标需要的能力无缝地对接起来。


    我们中国的企业，也要学会积木式的合作。


    +   第一，要有能力，就是你这块积木要有价值、有特色；

    第二，要能无缝对接，你要有信用，要能标准化地合作；

    第三，要有愿景，知道你的目标是什么，如何分解目标，以通过合作来实现；

    第四，要有视野，知道最好的合作者在那里，尤其是那些前沿的科技和科技公司；

    第五，要有系统思维，能从整体系统的角度搭建共赢的合作体系；

    最后，要有格局，要有推动生态系统构建的能力，有推动全球科技创新和经济发展 CNT 的雄心。


    # 三、做世界公民


    我们前哨的老朋友、企业家范卫平，我在前哨大会上也介绍了他的一个个人观点。


    他全世界到处去跑，发现一个规律：


    海外的唐人街一般比较脏乱差一点，但是里面的“唐人”，会把挣的钱汇回去，然后在本地重建非常干净漂亮的楼房，甚至还要引进了西方的设计，以至于有些地方的西洋楼都成了风景名胜了，叫做“番仔楼”。


    范卫平总结说：


    那是因为这些人没有把海外当成自己的家，唐人街就是他去打工赚钱的地方，脏一点乱一点无所谓。


    这就是我们要说的第二个要转变的范式，我们不仅仅仅要把中国当成自己的家，而要四海为家，要有全球化的胸怀和布局，要做世界公民。


    如果只把中国当成自己的家，你最多能够占到全球市场的20%。如果只和中国人合作，你最多能用到全球智力资源的20%。


    但是把世界当成自己的家，把全世界的人都当成合作者，你就有了100%的市场和100%的资源，你就可以做出超越BAT的企业，BAT在中国已经做得很大了，在中国本土你很难超越它们。但是以全球为舞台，超越它们
    caric 的可能性就大大增加了。


    顺便介绍两本书给大家：


    一本书是美国海洋历史学家林肯·佩恩写的《海洋与文明》，厚厚的一大本，从海洋文明的发展视角来回应大陆文明，是个很有意思的转换。因为绝大部分的历史叙事都是以大陆为中心的，海洋往往是充满未知和不确定的，是很少被描述的边界之外的事
    情。


    另一本书是英国历史学家彼得·弗兰科潘写的《丝绸之路：一个全新的世界史》，一位朋友在读过这本书之后，在朋友圈里发感慨说：“一直以为古代丝绸之路是中国人主导的，没想到在这位历史学家的描述中，古代丝绸之路跟中国的关系不大，彻底颠覆了他多年的历史认知。”


    这本书主要描述的是中亚以西的世界，确实跟古代中国关系不大，这就是其中的一个原因。


    更重要的是，如果我们换一个角度来重新思考中国的历史，将其作为世界的一部分，就会发现很多我们从小就习惯的观点其实需要重新思考。


    由此而来，我们今天就更要从世界的角度来思考中国和我们自身。有人曾经说过要从月亮上看地球，有人说要有上帝视角，这都可以看做是范式转移的一种表达。


    范式转移之后，你的世界就会发生一系列的调整和变化，原来曾经铁定的事情可能就模糊不清了，原来很重要的事情可能就不那么重要了。


    这也就是我一直说的积木式创新，其实就是范式转移的结果，我看到了一个全新的创新生态。也看到了中国的招商引资要转向招商引技，也看到了中国制造业为什么不仅不低端，而且还有很强的竞争力，当然，也看到了中国人在与全世界打交道的过程中存在着很多问题。


    # 四、明确自身的优势


    刚才说了，积木式创新有一个特点，就是要开展合作，一定是你有一项最强的，那中国什么最强呢？


    我们一直强调，就是中国的制造能力。


    有人也許不认同，因为有一派观点一直认为，中国的制造业是世界三流水平。我认为这要看从什么角度去看，如果说你从精密制造角度看，中国肯定是世界三流水平，因为我们实现精密制造的机器都是从国外进口的。


    但是如果从支持创新的角度上看，中国则是一流的，为什么呢？


    因为如果制造能力加上三个定语，中国制造不仅是世界第一，而且是世界唯一。这三个定语就是大规模的、复杂产品的、开放式的。


    知道这个太重要了，所以去年前哨大会我就讲过一次，今年还要讲。


    iPhone 就是在中国造的，为什么？


    因为如果在日本、在德国理论上讲也能达到这样的精度，但是很难达到这么大的规模，支持这么大的出货量。'
