    # 三、助力科技创新的发展


    给大家讲个新的案例吧，这个企业是我非常喜欢的，这家公司在2018年的2月份签署了破产协议。说起来，它的名气在创业圈子里非常大，这就是TechShop，全球知名的创业空间。


    这家公司于2006年创立，他们租用了巨大的空间，采购了工业级的设备，目的是服务那些想把产品从0到1做出来的创业者们。过去的10年里在全球有14家分店，为140多万人提供专业的设备和工具，每人每天仅需支付4美元的会员费，就可以使用所有的制造设备。中国现在有很多类似创业空间，Techshop可以算是创业空间创始人了。


