    # 美国的优势在于制度？


    谈到中美之间的差异，你可能会说，中美之间的差异主要是指制度上的差异。


    没错，中美之间的很多差异来自于制度上。但是，两国的差异并不仅仅存在于制度层面。


    我想，如果你和美国的政府或者社会组织打过交道，肯定会有一个感受，就是你按照中国的做法在美国制度框架下办事，总会遭遇各种不爽，对此你肯定触感颇深，那就是中国和美国的制度差异实在太大啦。


    说到美国的制度，有一个段子很能说明问题，我说给你听听：


    在二战结束后，德国人就跟美国人说，说你们美国真是幸运，你没有蹦出来一个希特勒。美国人却说，这算什么，如果希特勒放在美国的话，就就是一个好总统。


    当然咱也完全可以反过来想象一下，川普放到德国的话，可能又是一希特勒，这也是完全有可能的。


    那么问题来了：


    为什么美国可以说希特勒放在美国就又是 一个好总统呢？


    或者进一步追问，美国的制度是如何能约束有希特勒潜质的总统的呢？


    # 社会力量远大于政府力量的美国社会


