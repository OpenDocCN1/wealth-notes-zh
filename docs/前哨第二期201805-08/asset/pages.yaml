    2.文娱领域内容是核心，科技是强化内容影响力、传播力的重要手段。

    用户成洁提到，别人们批评《王者荣耀》没有文化创新精神，但他认为《王者荣耀》就是用历史名人降低低距离感，使用户能够快速上手。

    我认为他说的也对也不对，通用内容难以构建大IP，容易成为一时的成功，却无法成为永恒的经典。

    这让我想起一段往事：

    我原来在游戏圈里比较活跃的时候，那是10年以前的事了，曾经张罗了好几位游戏圈的大佬合作，想做一个专注前沿游戏内容的基金，我们的口号都想好了，叫做“寻找游戏界的斯皮尔伯格”。后来因为种种原因没有做成。

    我当时也一直觉得是个遗憾，因为中国的游戏界太需要斯皮尔伯格这样具备创新精神的内容制作者了。大家别天都是三国、水浒地做。希望我将来还有机会能够实现这个事。其实文娱就是在寻找创新和大众普遍接受之间，科技前沿和市场成熟之间一个平衡。中国太偏向大众接受和市场成熟，容易因为迎合市场而少了创新，希望科技创新能够带动文娱领域的整体创新精神的提升。


