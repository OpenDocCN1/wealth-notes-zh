    # 四、行业玩家


    那么，都是哪些人在做量子计算机呢？现在主要的量子计算的商业化参与者有以下几种：


    第一种，是有自己完整硬件实验实验室的新兴公司。


    比如 D-Wave，就是这一类当中比较成功的公司。


    另一个典型是位于加州伯克利的 Rigetti Computing 公司，它是由耶鲁毕业的 Chad Rigetti 于2013年创办的，有近百名员工。


    这些公司一般都有自己强大的实验团队，根据各自的思路研究量子计算，盈利目的性比较强，以大公司或者研究机构为直接或间接客户对象。商业模式包括之前提到的卖原型系统给同行，或者在某个关键组件或者技术上作出突破，然后与其他巨头合作等。


    第二种，是计算巨头们的量子实验室。


    最近的“量子霸权”之争的主角都是这些巨头。


    除了我们之前提到的谷歌以外，最典型的 是 IBM，这个巨头在量子计算领域布局10几年，IBM Watson 实验室是超导量子研究与商业化的先行者，以耶鲁量子计算实验室的毕业生和博士后为骨干，建立了颇具规模的量子理论与实验团队，他们的实验室过去一直以基础研究为主，直到近几年才开始逐渐开启商业化模式。


    其他的还有专注于“拓扑量子理论”的微软，积极发展超导量子芯片的 Intel，甚至还有通用、波音等传统制造业巨头。


    这些巨头往往能够进行长期持久的投入，更注重基础研究，也是目前行业前进的主要推手。他们通常关注某些特定领域的应用，比如谷歌的“量子人工智能实验室”，把优化算法同机器学习相结合，期望加速机器学习训练过程中某些步骤的优化。


    这些研究方向吸引了更多的投资者和公众的关注。


    第三种，是学术界的主要实验室的成果转化。


    这个类型的，基本上都是大学教授兼职创办的小公司，产品多来源于研究型大学的量子实验室，属于学术成果转化。


    典型的例子有耶鲁大学 Robert Schoelkopf 和 Michel Devoret 教授创办的 Quantum Circuits 公司，去年11月完成
    A 轮1800万美元融资。


    另一个例子是奥地利的 Alpine Quantum 公司，是奥地利 Innsbruck 大学的 Blatt、Monz 和 Zoller 教授在奥地利政府的支持下，于今年1月份创办的，也得到了1200万美元的投资。


    如果希望将最新的科研成果转入工程现实，他们就需要专业团队从加工、设备到控制流程的全方位支持。也就是我说的积木式创新，各个积木相互优化组合，优势互补，才会有成果。


    顺便说一句：


    耶鲁大学的 Robert Schoelkopf 提出了舒考核夫定律，被认为是量子计算领域的摩尔定律，它的内容是，大约每3年时间，量子退相干 Quantum
    Decoherence 的速度会被延迟10倍。


    我们说，量子计算靠的是量子纠缠，就是两个量子的相关性，但这种特性很不稳定，相干性消失就叫退相干。对量子计算来说，退相干的速度越慢，计算机就越稳定。我相信未来你会越来越多地听到舒考核夫定律。


    除了第一讲提到的大数分解问题以外，还有一个传统计算很难解决的就是路径规划问题，比如，一个快递一天要跑20个地方，怎么才能找到最优的路径？


    这些传统计算的难题往往就是量子计算大显身手的地方。


    2017年大众公司和 D-Wave 公司合作，借助量子计算处理了一万辆北京出租车的数据，优化了最佳路径，使这一万辆出租车运营里程明显减少，还对北京交通拥堵起到了缓解的作用。这个项目迈出了可喜的一步，也让人们对量子计算的未来充满了期待。


    他们的下一个项目，是在巴塞尔推出导航移动 App，利用量子技术和人工智能，来预测路况并且及时发送备用路径给用户，若该项目能顺利落地，至少6到8年不会再发生交通拥堵。这的确是量子技术落到应用场景中可喜的一步。


    # ——▸ 课程小结 ◂——


    在这一讲中，我为你介绍了量子计算机商业化的开创者 D-Wave 公司，以及参与量子计算机商业化的不同组织类型。希望你能够掌握以下三点：


    第一，量子力学的领域还都处于理论研究阶段。而且量子本身状态又不稳定，这给研究带来了极大挑战。为解决量子状态不稳定的问题，D-Wave 提出了针对量子退火算法的计算模型，因此这个系统也被称为量子退火机
    Quantum Annealer。


    第二，尽管 D-Wave 在技术上受到质疑，但是它开创了量子计算的商业化。后继各大 IT 巨头以及众多实验室，无论是从实际的量子计算，还是实验室的理论研究，都纷纷开始尝试商业化的道路。未来从研发到商业化的成果转化周期会越来越短。


    第三，量子计算机的研究需要巨额的软硬件技术投入，普通大学或研究所大多只能做理论研究。所以需要与 IBM、谷歌等大公司合作，而这些巨头们正逐渐主导整个量子计算科技的进程。


    # ——▸ 课后思考题 ◂——


    你对于量子计算机的商业化有什么高见？你觉得有哪些业务应用领域呢？


    欢迎在留言区分享你的见解，我们一起来讨论。


    # 划重点


    +   1.量子力学的领域还都处于理论研究阶段，量子本身状态又不稳定，这给量子计算机的研究带来了极大挑战。\n2.IT巨头是量子计算机商业化的主要推手，他们通常关注某些特定领域的应用。\n2.量子计算机的研究需要巨额的软硬件技术投入，普通大学或研究所大多只能做理论研究。


    王煜全


