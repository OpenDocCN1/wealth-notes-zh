  md: '# 239 | 环保科技：积极的环保主义者-戈尔


    # —— ◆ 内容着点 ◆ ——


    通过阅读这一讲的内容，你将会掌握以下3个问题的答案：


    +   1. 美國前副總統戈尔为何执著于环保？

    2. 戈尔为环保事业做出了哪些贡献？

    3. 戈尔和全球变暖论存在哪些争议？


    说到环保，我们最常听到的一個環境問題就是全球变暖，這已經是全球性的共識，不過，在“是不是人为活動造成的”這一點上，目前还存在一些争议，除了一些政治家和经济学家，也包括很少一部分科学家认为人类还不能左右地球的气候。


    但是我们要强调的是，絕大部分相关领域的科学家，也就是在主流科学界，共识是全球变暖是人类活动造成的。而且我们要注意的是，全球有没有变暖，不是南<|start|>突然下几次雪就能反驳的，个人的感官体验在科学问题上，永远都是不能得到值得参考的结论的。


    而为了应对全球变暖，低碳的生活方式还成了一种时尚。这个理念从无人知晓，到被大众普遍关注，我们不得不提一个人，他就是 Albert Gore，阿尔·戈尔。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_100_0.png)


    戈尔是一个政治家，也是积极的环保主义者。作为政治家，他被人熟知的身份，是在比尔·克林顿政时期担任美国副总统。作为环保主义者，他通过大量的演讲，出版环保书籍，以及拍摄环保题材纪录片，极大地推动了全球变暖理念在公众中的普及。


    也因为对改善气候变化问题作出的贡献，他在2007年被授予了诺贝尔和平奖。此外，他出版的《濒临失衡的地球》也问进了纽约时报畅销书排行榜，他2006年参与制作和出演的纪录片《难以忽视的真相》（An
    Inconvenient Truth），还获得了奥斯卡最佳纪录片奖，11年之后的2017年，他又制作了续集《难以忽视的结局》（An inconvenient
    Sequel）。


    # 一、戈尔的家庭和经历


    那么，戈尔为什么会на环保如此执著？他在推动环境保护上到底有多大的影响力呢？


    戈尔1948年出生于一个政治世家，他的爷爷在小时候先后由于疾病和事故导致双目失明，但依然坚持从政理想，最后当上了俄克拉何马州参议员。而他的父亲也曾当选为参议员。所以戈尔在很小的时候，就常被父亲带去参加参议院的听证会，从小对政治活动耳濡目染。


    如果说是家庭影响让戈尔走上了政治生涯，那戈尔与环保结缘与他的童年和求学经历关系极大。


    戈尔的童年很大一部分时间在位于田纳西州的家庭牧场度过。戈尔的父亲，老戈尔也对环境，尤其是对土壤方面非常关注。老戈尔在他的回忆录中对于过度放牧、过度开采曾提出了担忧。戈尔在自己的书中曾表示，他对于环保的热情，部分就来源于童年时期受父亲的影响。


    后来，戈尔读了雷切尔·卡森所著的《寂静的春天》，第一次对环境问题有了认识。这里顺便说一句，出版于1962年的《寂静的春天》，可以说是人类历史上第一次引发大众对环境广泛关注的一本著作，也推荐你去看看。


    在1965年，戈尔考入了哈佛大学。头两年他的成绩并不好，数学、科学等学科经常得 C 甚至是不及格。大三的时候，他选修了全球变暖理论家罗杰·雷维尔教授的环境学课。这是戈尔第一次接触有关全球变暖的理论，这也激发了他对于全球变暖及其他环境问题极大的兴趣，这门课，戈尔取得了
    A 的优异成绩。


    1976年，戈尔开始了自己的政治生涯，先后当选众议员、参议员，后来一直到美国的副总统。在任职期间，他一直作为坚定的环保主义者，积极推动了全国，以及全球性的环境保护运动和倡议。在卸任王官后，戈尔还活跃在环保事业中。


    # 二、戈尔的全球变暖理论体系


    对于全球变暖的理论，你可能已经很熟悉了。就是由于人类活动产生的二氧化碳排放，导致大气中二氧化碳这种温室气体的浓度增加，进而使全球平均气温升高。平均气温升高以后，就会导致一系列自然灾害的发生。


    首先，极端灾害天气会更频繁地发生，因为海洋会向天空蒸发更多水蒸气，所以会导致更多的暴雨及洪水事件。温度升高还会更快地蒸发土壤中的水分，导致更持久和更严重的干旱发生；


    其次，全球变暖会造成海平面上升，导致低海拔地区受淹没；


    此外，全球变暖还会导致传染病的增加、海洋生态变化、物种灭绝加剧、农业减产等环境和社会问题。


    那么面对这么严峻的挑战，戈尔倡导什么样的解决措施呢？


    首先，就是对碳排放征税，利用税收调节、经济手段激励的方式，推动更多可再生能源的使用。


    目前很多可再生能源技术已经日趋成熟，并且成本越来越低。我在前面可再生能源模块中详细介绍过。在一些发达国家，可再生能源占比已经不少了，比如在德国，2017年的可再生能源发电量，占德国总发电量超过30%。同时，很多第三世界国家，能源基础设施落后，甚至没有电网，他提倡这些国家可以发挥后发优势，直接跨越并普及新能源。


    其次，是提出每个人身体力行的的重要性，作为自己低碳的选择，比如选择公共交通出行、买混合动力车、在家使用太阳能装置等等，作出这些改变其实比想象的容易，并且能为个人带来经济效益。


    戈尔还强调，环保并不应该是某个政治党派的任务，或者被阴谋论所绑架，环保本身对于人类来说就是一个正确的选择，想要达到共同的目标需要不同党派共同努力。


    # 三、戈尔在环保事业的主要成就


    可以说，戈尔为环保事业作出了巨大的贡献。我们昨天讲到环保产业需要政府、公众和企业三方面的配合，戈尔也是从这三个角度入手去做的：


    第一项贡献，是他利用自己的政治影响力对环保事业进行了推动。


    1976年，28岁的戈尔加入美国众议院之后，就发起并主导了国会第一次有关毒物排放和全球变暖问题的听证会。此后，在戈尔任职美国副总统期间，就是他积极推动克林顿签署了著名的《京都议定书》。

    《京都议定书》是在《联合国气候变化框架公约》下，各参与国为“防止剧烈的气候改变对人类造成伤害，将温室气体排放稳定在一个适当的水皮而缔结的条约。主要是通过限制缔约国温室气体排放配额，对于温室气体排放多的国家，可以花钱向超额完成减排任务的国家买进配额。

    当时，美国是全球温室气体排放量最大的国家。这个议定书在草拟时，就在美国国内引起很大争议，反对者认为，履行《京都议定书》，有可能加大愠美国家经济发展增速的。《京都议定书》也遇到了议会的强烈反对。不过，在戈尔推动下，《京都议定书》最终还是在1998年上旬，由克林顿签字得到通过。


    但是在当时议会一致反对的情况下，签署更多是象征性的，并未彻底执行。在小布什上台后，随即在2001年就退出了《京都议定书》。


    虽说《京都议定书》最后在美国没有被彻底执行，但当时克林顿政府坚决签署议定书的态度，无疑促进了世界各国关注以及参与到气候问题的解决中来。


    第二，戈尔还不遗余力地通过对大众普及环保科学知识，唤醒了公众的环保意识。


    为了普及环保科学知识，戈尔每年要举行'
