  md: '这里要多说一句，在人工智能芯片领域，中国起步基本与国际水平同步，水平也很高，涌现出了寒武纪、地平线这样的科技公司，这都很值得我们期待。


    不过，异构计算还是并行计算的一种，所以并行计算解决不了的问题，异构计算也解决不了。


    # 三、量子计算是怎么出现的？


    除了持续优化现有的计算机架构以外，人们还从基础架构的角度，一直在探索其他类型的计算机，量子计算机就是其中之一。


    量子计算机这个概念，是1981年的时候，美国 Argonne 国家实验室的物理学家 Paul Benioff 提出来的，到了1994年，应用数学家彼得·舒尔提出了名叫
    Shor 的算法，这就是一种针对整数求解因子的量子算法，但直到2001年，IBM 和斯坦福大学才在一个7个量子比特的量子计算机上首次实现了 Shor 算法，成功地把15分解成了3和5，这就是刚才我们说大数分解的那个例子。


    就是这么一个看似不起眼的成果，对于量子计算机的发展却意义深远，为什么这么说呢？


    还是我们刚才讲到的 RSA 密码，它是现代密码学的基石，它就是基于大数分解的计算复杂度设计出来的，目的就是让计算机无法破解。


    但是当 Shor 算法在量子计算机上运行的时候，就会极大地简化这个问题，具体的细节，感兴趣的话你可以去搜搜看，总之，量子计算机可以缩短找到大数分解因子的时间，从而破解密码。


    因此，量子计算机的出现，会给整个信息安全领域带来巨大隐患。


    # 四、距离产品应用还有距离


    然而实际上，从产品上来说，量子计算机目前基本上不是样机就是测试芯片，要想真正实现还任重道远。


    总体来说，在量子计算领域，基础研究都是 IT 巨头们在主导，其中中国的进步很快，中科大等知名高校都出现了一批世界级的专业量子计算研究团队，百度和阿里巴巴也都建立了自己的量子计算实验室。


    从原理上说，其实量子计算机有个致命弱点，就是由于量子的叠加和纠缠状态，所以它是极其脆弱的。


    所谓量子纠缠，是一种量子力学现象，是粒子在由两个或两个以上粒子组成的系统中相互影响的现象，它的的状态是非常不稳定的。所以，量子计算机通常只能在接近绝对零度，也就是零下273摄氏度的状态下才能保证量子状态，正常运行。


    可以说，由于量子计算机的研究还面临着无法预估的困难，最终我们是否一定会得到一个通用而且可持续运行的量子计算机，目前还是个未知数。


    而且，我们还要注意到，下一代计算的光子计算机具有环境简单、不需散热、速度快等优势，可能更易发展。在第三讲中，我将为你介绍量子计算机商业化的开创者，D-Wave
    公司，以及，量子计算行业的商业化情况。


    # —— 内容小结 ——


    这一讲我们讲解了量子计算的概念，还介绍了两种提高传统计算机性能的方法。希望你能掌握以下三点：


    第一，基于摩尔定律的传统经典计算机发展面临物理极限。为了未来继续提高计算性能，除了增加晶体管密度以外，还有并行化计算和异构计算方法，以及量子、光子和 DNA
    计算方面的探索。


    第二，人工智能芯片属于一种异构计算，是目前各大公司关注和争夺的焦点。中国出现了像寒武纪这种类型的科技公司，不仅在手机拍照场景中得到了应用，而且也开始进军用于服务器上的高端芯片，这令人欣喜。


    第三，量子计算机还不够成熟，面临着很多不确定性，距离真正实用化的道路还很长。而 IT 巨头们纷纷参与，背后的驱动力是希望夺取“量子霸权”。此外，下一代计算中的其他方向也值得我们关注。


    # —— 思考题 ——


    在这一之前，你听说过量子计算机吗？或者其他下一代的计算机类型，你有所了解吗？你觉得哪个方向会更有未来呢，为什么？


    欢迎在留言区分享你的见解，我们一起来讨论。


    # 划重点


    1.大规模集成电路的发展存在物理极限，计算速度的进步终将跟不上“摩尔定律”的要求。 2.IT巨头争夺“量子霸权”，在于一旦掌握了技术制高点，就获得了量子计算机的标准制定权和舆论主导权，在产业竞争中优先占据了有利的地位。
    3.量子计算机是下一代计算的探索方向之一，但未来是否能够实现应用还是未知数，传统计算机的架构还会存在很长时间，同时，其他下一代计算也在积极探索中。


    王煜全

