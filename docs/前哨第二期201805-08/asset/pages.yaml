  md: '# 229 | 可再生能源：太阳能光伏领域牛人-Guy Sella


    229 | 可再生能源：太阳能光伏.. ↓


    # —— ◇ 内容看点 ◇ ——


    通过阅读这一讲的内容，你将会掌握以下2个问题的答案：


    +   1. Guy Sella 为何选择在太阳能发电领域创业？

    2. SolarEdge 是如何提高光伏板发电效率的？


    我们这一讲要讲的是在太阳能光伏领域的创业牛人，以色列的 Guy Sella。


    他曾在以色列国防军担任要职，在退役后创办了 SolarEdge 公司，这家公司通过技术创新，大幅提高了太阳能光伏板的发电效率。


    那他们是怎么提高光伏板发电效率的呢？以前的发电板为啥那么低？


    下面我们来详细讲一下。


    # 一、Guy Sella 的创业故事


    他是1965年在以色列出生的，毕业于以色列理工学院，这个学院所在的海法市，有“第二硅谷”之称。


    毕业之后，Guy 就加入了以色列国防军，开始了10几年的军旅生涯。在服役期间，Guy 曾经担任以色列国家安全委员会技术主任，国家网络安全保护委员会部长，以及电子技术研发部主任。


    更重要的是，他还在着名的 Unit 8200 工作过。


    这是个什么样的组织呢？为什么说有名呢？


    要解释这个组织，我们需要从以色列的国家背景说起。


    为了生存，以色列可谓是全民皆兵，国家财力很大程度上都用在资助军队上了。在以色列，军队里面最优秀的人，会被选出来进入军队科研系统。


    而 Unit 8200，是以色列国防军下属的重要情报部门，在最优秀的1%里面，继续选拔1%最顶尖的人才加入这个组织。不仅要考核数学、电脑、语言技巧等内容，还要学习能力强，能采用创新方法达成目标。所以，Unit
    8200 里面的 人，都是精英中的精英。


    所以现在，很多从 Unit 8200 退伍的军人，都在云计算、大数据、网络安全等前沿领域创业。


    据《福布斯》杂志统计，由前 Unit 8200 军人创立的公司超过1000家。其中就包括退伍军人 Gil Shwed 创立的网络安全公司 CheckPoint，他们在纳斯达克市值超过150亿美元，是世界上最大的专注网络安全
    的公司之一。


    还有云安全公司 Adallom，他们通过对异常行为的检测，来保障企业用户在使用软件级别的云平台服务时的安全，曾经与Salesforce、Office365
    等公司有过合作。在2015年，Adallom 被微软以3.2亿美元收购了，微软认为这家公司的技术能增强微软云服务的安全性能。


    所以说，如果你遇到项目创始人是来自以色列 Unit 8200 组织的时候，可以多关注一下。


    我们说回 Guy Sella，他确实称得上是精英中的精英，他在军事技术部门服役了10几年，退役之后开始创业。


    在2004年，他成为 STAR Ventures 的合伙人，而 STAR Ventures 是专门针对高科技企业进行风险投资的。


    两年后，也就是2006年，Guy Sella 和他的战友 Lior Handelsman 有了创业的想法。他们一起去硅谷拜访各类型投资者。他们一开始是想看看在图像处理、网络安全、国土安全或者电子技术方面的机会，哪知道投资人对他们的想法没有兴趣，而来自罗森投资公司
    Sevin Rosen Funds 的一个投资人给了他们建议，希望他们可以考虑太阳能产业，因为可再生能源是未来的发展方向。


    听完这位投资人的建议，Guy 和 Lior 做了市场调查和分析。他们发现，当时光伏发电并入电网系统的整体效率只有75%，如果他们能研发出一款产品，将效率提高，一定会有很大的市场。于是他们就决定去挑战这个难题。


    当时，摆在他们面前有两条路：


    +   第一条路容易一些，是做大企业的代工厂，做设备制造商，就是所謂的 OEM；

    第二条路则比较难，是建立自己的品牌，直接服务终端用户。


    最终，他们选择了比较难的第二条策略。


    我们以前提过，周其仁老师和我们分享的以色列精神就来自《塔木德》里的一句话，就是：


    天下难做的事容易做成。


    为什么呢？


    其实哲理很简单：


    难做的事情没别人做，容易的事情对手一定多，难做的事情对手少。


    而这个《塔木德》是犹太人从小到大，会反复读一辈子的书。


    # 二、聚焦核心部件


    确立了创业的方向之后，在2006年，Guy 就联合一批同事，建立了 SolarEdge 公司。主要业务方向，是提供太阳能光伏发电的优化器和逆变器的解决方案，通过创新性的设计，把光伏发电并入电网的整体效率从75%提高到95%以上。


    为什么他们决定专注于这个业务呢？


    那你得先了解一下优化器和逆变器是什么。


    我们在第一讲中讲过，太阳能光伏板的原理，是通过光电作用，将照射在光伏板上的太阳能转化为电能。要说明的是，输出的电能是直流电。但是生活中我们大部分的用电设备，是使用交流电的。所以，我们需要先把直流电转化为交流电，然后再并到电网里面。


    这个能量转换过程，就是优化器和逆变器实现的。


    +   第一步，是用优化器来最大化输出电压；

    第二步，使用逆变器，将直流电转化为与电网同步的交流电。


    其中逆变器是光伏系统的核心设备，因为它的效率直接关系到系统发电量。


    所以，他们将目光聚焦到了这两个部件上。


    讲到这儿，你一定会问，为什么之前整个行业的并网效率只有75%，背后有什么原因呢？


    从行业角度来说，SolarEdge 刚建立的那几年，是太阳能产业发展的初期阶段。各大厂商的目标，都是尽快占领市场，或者是想办法利用政府的补贴，提高市场占有率。


    此外，当时大量企业的资金和研发，都是主要集中在改进材料，提高光伏板自身效率的问题上。大多对能量转换的重视不够，他们都是将市场上通用的逆变器，简单地拿过来使用，并没有针对太阳能光伏板本身的特点，作特定的优化设计。


    总体来说，当时的太阳能光伏行业还处于比较粗放发展的阶段。


    从技术角度来看，在太阳能光伏行业早期，使用的大多数是串式逆变器，也就是把光伏板并联后，统一串联到一个盒子中，在这个盒子里面，把优化器和逆变器都安装在了一起。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_73_0.png)


    使用这种结构的好处是安装简单、成本低廉，但是，也存在影响效率的两个明显缺点：


    第一，这种简单的串联方式存在木桶效应'
  merge: -1
  img_proc: true
- pgno: 74
  md: '第一，这种简单的串联方式存在木桶效应，整体效率由效率最低的那一块光伏板决定。因此，在使用中，只要有其中一块光伏板被树荫，或者是别的物体遮挡，就会自动造成整体效率的大幅降低。


    第二，是维护成本高。因为是通过集中的一个逆变器和电网相连，如果有某一个光伏板出现问题，就需要把逆变器停掉，然后逐个进行排查。


    那么，SolarEdge 是怎么解决这个问题的呢？


    从宏观环境来说，当时太阳能光伏行业，其实已经开始从粗放型向精细化发展了。原因是，通过优化光伏板材料来提升效率的做法，已经进入到一个瓶颈期，所以，产业界都开始关注如何提升发电系统的整体效率。而逆变器在提升效率方面的作用越来越受到重视。


    其实之前，市场上也提出过一种微型逆变器的方案。这个方案就是在每一块光伏板上，都安装微型的优化器+逆变器。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_74_0.png)


    采用这个方案后，解决了串联的固有问题，将光伏发电并入电网的整体效率提高到95%左右。


    但是，这种方案的最大缺点，就是逆变器数量大幅增加，成本大幅提高：


    +   一是制造成本，根据估算，如果家用光伏系统使用这种微型逆变器+优化器，成本将提高两倍；

    二是维护成本，逆变器数量的增加，也会相应增加系统故障概率，造成后期维护成本的增加。


    所以这个方案，只适用于一些特殊场合，比如说那些经常会被树荫遮挡的地区。


    为了提高串式逆变器的效率，并降低成本，SolarEdge 公司提出，把优化器和逆变器分开设计和安装，也就是说，把优化器分别安装到每个光伏板上，形成并联，然后再连接到同一个逆变器上。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_74_1.png)


    那这个优化方案，有哪些优势呢？


    第一个优势，是光伏板采取并联结构后，整套太阳能设备的效率，就不再由效率最低的那一块光伏板决定了，因为有独立的优化器，就可以通过单独调节。


    这样的话，每块光伏板还能设计成不一样的形状规格，比如在屋顶铺设太阳能光伏板，就可以最大化利用屋顶面积。而且当某一块光伏板在使用的时候，被阴影挡住了，也不会影响整体效率。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_74_2.png)


    第二个优势，是有利于光伏板的状态监测和故障定位。


    因为每块板上都装有优化器，优化器又具有测量和监控的作用。系统会记录每个面板的数据，通过互联网传送到公司的服务器。这样，用户和公司，都可以通过计算机或手机，进行远程监视，快速识别并定位问题，提高维修的效率。


    第三个优势，是成本的降低。


    由于优化器成本比较低，而且维护简单，也不容易出现故障，SolarEdge 优化器的质保长达25年，基本上覆盖了整个光伏板的寿命周期。而对于价格相对高的逆变器，只使用一个就够了。2009年，SolarEdge
    的逆变器开始实现量产。


    从2006年创业开始，仅仅经过10多年的发展，SolarEdge 已经成为业内领先的企业之一。能看清趋势，并利用自己的技术优势来解决行业问题，这些都是 Guy
    Sella 成功的关键因素。


    近年来，SolarEdge 还在持续提升逆变器的性能，他们推出的一款名为 HD-Wave 的逆变器，优化了系统的电路结构，把逆变器中含铜的磁性组件，减少为原来的1/16，散热元件减少为原来的40%，逆变器的重量减少为原来的一半，而逆变器的效率却达到了99%。


    在2017年，加州能源委员会 California Energy Commission，将这个99%的效率，作为突破的记录保存了起来。


    # —— 课程小结 ——


    在这一讲中，我为你介绍了光伏太阳能领域的创业牛人 Guy Sella 的故事，和他创建的公司 SolarEdge，希望你能掌握以下三点：


    第一，Guy Sella 从以色列情报部门 Unite 8200 退役后，创办了提供智能优化器和逆变器解决方案的 SolarEdge，将光伏发电并入电网的整体效率，从75%提升到95%以上，这充分体现了以色列的创新精神，也就是，天下难做的事情容易做成，创业要做有难度的事情。


    第二，SolarEdge 创新性地提出了优化器加串式逆变器的解决方案，就是突破优化器和逆变器整合在一起的旧传统，将两者拆分开，分别安装，各自发挥自己的优势，在保证每一个光伏板能单独提高效率以外，又降低了维护和制造成本。SolarEdge
    的创新方法符合我们提出的任务分解的思维，先单点突破后，再进行系统整合。


    第三，SolarEdge 的成功与光伏行业从粗放型向精细化发展，以及技术的进步是分不开的。创业的时机选择很重要，新兴产业虽然前途光明，但往往有很多不完善之处，因此在一个产业新兴起的时候如果断加入，往往更容易创业成功，当然这取决对于对未来产业变化的洞察，面向未来机会创业的勇气，和掌握未来技术优势的能力。


    # —— 课后思考题 ——


    你对于这句话，“天下难做的事情容易做成”，是如何理解的呢？


    有没有经历跟我们分享下。


    # 划重点


    > 1.天下难做的事情容易做成，意思是难做的事情没别人蹭，对手就会少，而容易的事情，对手一定多。Guy Sella 的创业正是秉持这种创新精神。

    2.SolarEdge 的创新方法，符合我们提出的任务分解的思维，先在单点技术上突破，然后再进行系统整合。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_74_3.png)


    我是王煜全，你的全球科技前哨侦察兵，咱们下一讲见。'
