  md: '# 年度复盘｜行动：科技化与全球化新时代


    年度复盘｜行动：科技化与…


    复盘的最后一讲，我给你介绍如何将思维落实到行动上，通过积木式创新，构建自己的科技壁垒，开拓科技化与全球化的事业版图。


    # 一、科技创新强调实战


    不管我给你讲了多少领域的技术前沿，最重要的是，还是要你去实践，去运用。实践是检验真理的唯一标准，这句话说的很务实。


    所以，我不仅在得到《全球创新260讲》每天跟你分享10分钟的科技洞察，还每年组织很多次中国企业家和投资人去美国的投资考察，目的就是为了积累实践经验。


    每次去美国投资考察，我都要提前准备考察什么技术，有什么可以投资的项目，会亲自实地去把科技创新这件事情给大家准备起来。


    根据我的经验，真正能达成合作，一般不只是看项目，更看重企业的实践能力。也就是说，一家企业光懂得宣称还不够，还要学会掌握全球前沿科技，学会系统分析趋势，学会跟不同的企业实际合作的操作方法，更应懂得在实战中进行商业谈判，懂得把行业知识和前沿科技转化为生产力，创造商业价值，而这些都需要在实践中磨练。


    所以，只有既了解前沿技术，又拥有行动力的企业才会获得成功。


    你知道，我讲科技创新，并不是只是告诉你一个大趋势，还一直给你分析潜在的机会，就是为了让你在实践中有一份可靠的行动指南。


    我认为真正要做成事，下面三个因素是不可或缺的：


    +   第一，你要能高瞻远瞩，看到未来趋势。


    +   第二，要有洞察力，能看到趋势背后的规律。


    +   第三，还是我强调的，看见机会以后，你要行动，要亲自去尝试，才能抓住机会。


    概括起来说，既要有预判未来的眼光，又要有果断的行动力。


    孙正义是一个我佩服的企业家，1981年，孙正义创立软件银行集团，1996年在互联网刚起步时，他投资了只有5个人的雅虎，而在1999年中国电商刚萌芽的时候，他就投资了阿里巴巴。


    现在，孙正义根据日本进入老龄社会的趋势，已经把全部精力都放在机器人产业上。而2016年7月，孙正义还收购了芯片公司ARM，提前布局即将到来的物联网时代。


    你看到机会，别人也能看到，但最终有的人总能抓住机会，剩下的大多数人站 afaceri?

    你看到机会，别人也能看到，但最终有的人总能抓住机会，剩下的大多数人站在边上喊没有机会，结果机会真的来了，却也把握不住。所以，我认为这个世界不缺机会，缺的是发现机会的眼光和看到机会后去行动的决心。


    # 二、提前布局前沿科技


    我一直强调提前布局前沿科技的重要性。


    所谓提前布局，就是在一个前沿科技还没有发展起来的时候，就要关注科技的早期研发，跟随科技的研究进展。更关键是做到对一个时点的准确判断，就是判断什么时候可以提前进入。


    我们这门课程，经常谈到一个美国的“制造业就绪指数”。


    就绪，就意味着科技的性能稳定了，而且可以大规模量产，质量可以保障，可以大规模商用。


    这是美国军方用来评估先进科技成熟度的系统。这个指数等级从1到10。从实验室出来是1，慢慢发展成熟，最后实现大规模量产是10。如果等到第9级、第10级再参与，那当然就只能做低利润的代工的活了。


    而我说的提前布局，就是在科技从实验室已经出来了，开始进行产品化的时候，在达到第7级、第8级，甚至在第6级，我们就尽早参与共研发，这样才能实现研发和制造的紧密结合，抓住更早的发展机会。

    所以，我希望中国建立一套自己的科技就绪指数，帮助中国的企业提前布局。


    关于提前布局前沿科技，还需要思考另外两点：


    +   一是判断这个趋势是否到了尾声？


    +   二是就算<|message|>


    # 三、构建壁垒'
