  md: '# 彩蛋 | 5G能创造什么机会？


    彩蛋 | 5G能创造什么机会？


    前面几讲，我给你展现了未来世界的智能文娱，以及各种有意思的服务机器人，它们给你提供了生活便利的同时，也在颠覆行业发展结构。你也许会担心，但我还是强调，机器人是把人类从重复和低层次的工作中解放出来，让你拥有更多时间去完成创造性工作。


    尤其是面对即将来临的 5G 和物联网时代，会创造出越来越多的新机会，需要你充分发挥创意，抓住机会。


    我在 5G 模块说过，5G 是下一代互联网，代表着高带宽和低延迟，是支持物联网、AR、VR、自动驾驶、人工智能等应用的基础平台。5G 虽然今年很热闹，但 5G
    正式全面商用大概在2020年。目前，5G 通信技术和相关标准都在陆续发展和完善当中，现在正是迅速寻找需求和提前布局的好时机。


    # 一、云测公司


    我在年度复盘模块中，强调过提前进行产业布局的重要性，下面要跟你介绍的就是这方面的典型案例：云测公司。


    它主要提供 App 测试服务，目前已经成为国内最大的“移动应用云测试”服务平台。云测早在6年前就着手行业生态布局，为即将到来的 5G 和物联网的发展做好充分准备了。


    所以，虽然名字叫“云测”，听起来还是做测试，但实际上已升级为 5G 应用平台了。


    前面给你简单介绍了 5G 目前的进展，那 5G 能创造什么机会呢？


    打个比方说，5G 就好比是一条高速公路，如果进入 5G 时代，就意味着路修好了，之后就必定会有车在路上跑。


    那车是什么？


    就是为我们服务的各种应用，没有应用，我们就无法享受到 5G 的好处。


    进入 5G 时代，不 仅带宽会有大幅提升，响应速度也将极大加快。这意味着 5G 时代将会诞生全新的海量应用。


    # 二、关注全球创新动态


    我在分析苹果市值破万亿的启示中说过，要在风口上利用自己的优势，就是说学会在风口上发力，而风口意味着一个崭新的巨大的市场，那这种市场往往会使得风口上面的领先企业获得巨大的回报。


    当然，前提是在风口没有来之前就要先把自己的企业做到行业领先的地位，这就需要你有前瞻的眼光、对趋势清晰的把握，提前布局，最后大胆下注和行动。'
