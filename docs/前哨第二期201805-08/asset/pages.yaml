  md: '东方生产的。


    我们来看京东方，又是如何提前布局，才能创造今天的成就的呢？


    作为国内显示技术的先行者，京东方在成立之初，就不仅仅生产传统面板。在20年前，京东方就着手柔性 AMOLED 的研发，组建研发小组，8年前还成立了 AMOLED
    实验室。


    京东方每年仍投入大量经费来持续创新。2017年新增专利申请量接近8700件，其中发明专利超85%，截至2018年7月，累计可使用专利数量超过6万件，成为全球极具创新力的领先企业。这个数量是远远超过柔宇科技的。在2017年度美国专利授权量统计报告中，京东方全球排名由2016年的40位跃升至全球21位。


    目前京东方拥有多项突破性创新技术，比如：宽视角超硬屏技术、8K 显示屏分辨率、柔性 AMOLED 显示技术工艺等等。


    值得一提的是，除三星之外，京东方是唯一具有 LTPS 技术生产线的中国公司。


    LTPS，全称“低温多晶硅技术”，指采用镭射光来完成液晶封装，因为整个过程都是在600摄氏度以下完成，在生产工艺中处于低温，所以适合采用一般玻璃基板，能实现屏幕更薄更小，达到
    4K 分辨率。


    不同于柔宇科技，京东方采取成熟的 LTPS 生产技术实现了量产，确保了 OLED 显示屏的质量。


    除了成都生产线，目前在四川绵阳的第6代柔性 AMOLED 生产线正在建设中，预计2019年投产。此外，京东方还正在重庆建设第6代柔性 AMOLED 生产线，预计2020年投产。很快随着这三条
    AMOLED 生产线陆续投产，京东方未来的量产能力是值得期待的。


    # 四、一切真的显而易见吗？


    刚才跟你说完了这两家公司，很多人会拿柔宇科技与京东方对比，看看哪家企业更厉害。


    当产品没有量产前，大家都说柔宇科技技术领先，创始人技术背景也牛，受资本追捧热情高，就是科技创新企业厉害。


    然而，真实结果是，京东方赶在柔宇之前，实现了 AMOLED 柔性屏的量产，并且为华为、小米、OPPO、vivo 等国内10多家手机厂商供货。京东方今年5月电视机
    OLED 屏幕实现出货量第一。


    于是大家又会说，还是国企资金雄厚，技术能力强。


    我认为，这个比较的结果还不是最重要的是。我们要警惕自己认知上的一个陷阱，就是在已知结果的情况下，我们总以为知道原因。


    我在今年8月科技特训营上介绍过一本书，叫《Everything Is Obvious，Once You Konw The Answer》，中文名叫《一切显而易见》，这本书主要说，当你知道一个结果，你总觉得这件事情是对的，就会为这件事找一个确定的理由，因为没有理由你不踏实。


    但很多时候，你自以为成立的理由，往往事实未必如此，这是人性的一个特点。你可以找来好好读一读。


    # —— 课程小结 ——


    最后总结一下，这一讲我为你分析了显示技术的发展和应用市场，同时给你介绍了中国两家优秀的柔性屏企业：柔宇科技和京东方，希望你能掌握以下三点：


    第一，显示技术从最早期的 LCD，发展到今天的 OLED 和 QLED。其中 OLED 是有机发光半导体，目前应用最广的柔性屏材料，拥有高对比度的显示效果，关键是功耗低。目前广泛用于手机领域，其中
    AMOLED 屏幕受到各大手机厂商的追捧，在手机领域的渗透率预期在未来几年增长迅猛。


    第二，柔宇科技在全球首先提出“柔性”的概念，尽管柔宇科技量产延迟，但它重视自主研发，勇于尝试新技术和新工艺，这点是值得你借鉴的。而京东方作为老牌显示技术的公司，提前20年布局了柔性显示技术，专利数量超过6万件，除三星之外，京东方是唯一具有
    LTPS 技术生产线的中国公司。此外，他们采用成熟的生产工艺，目前已经投入成都生产线，电视显示屏出货量居全球第一。


    第三，我们容易在认知上陷入一个误区，那就是当你知道一个确定结果以后，就会为这事找一个确定的理由，因为没有理由你不踏实。其实，你自以为成立的理由，往往事实未必如此，做马后炮是人性的一个特点。所以建议你在预测、管理决策中要尝试避免这类思维习惯。


    # —— 课后思考题 ——


    你体验过 AMOLED 屏幕的手机或者电视吗？谈谈它跟其它产品的区别在哪？它的哪些特点让你印象深刻？


    欢迎在留言区分享你的观点。


    划重点


    +   1. 从技术成功研发到产品实现量产，这其中会面临极大的挑战，中间经历的环节往往非常复杂和漫长。采用“积木式创新”模式，让新技术与匹配的制造能力相结合，让产品迅速落地才是王道。\n2.
    我们要警惕自己认知上的一个陷阱，就是在已知结果的情况下，我们总以为知道原因。


    王煜全

