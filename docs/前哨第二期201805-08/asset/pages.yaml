    # —— 模块总结 ——


    这个模块的主题是工业机器人，我们介绍了三个重点：


    第一，未来机器人的数量会比人多，人与机器协作的场景也会越来越广，成本也会越来越低。总体来说，机器人产业未来发展潜力巨大，同时也对其他产业的格局，以及我们的生活和工作带来重大影响。


    第二，无论是传统工业用机器人，还是特定用途的机器人，都可以采用任务分解的思想，让每个机器人完成某个特定、精密和重复的任务，然后根据需求灵活组合。


    这样的好处是，能够大规模生产，有效降低制造成本，还始终以市场需求为导向。我们可以多探索人机协作的应用场景，开发出实用性强的机器人。


    例如：


    外骨骼机器人已经在军事、医疗和物流领域帮助人类减轻负重、提升效率了；


    其次，在救援、巡检、测绘、侦察等特殊领域，各类机器人正在发挥越来越大的作用。


    第三，聊怕是生产车间里的工人，也不喜欢做重复枯燥的工作，工业机器人在未来必然会更多地取代人力，而人类会被释放出来去做更有意义的事情。另外，在短期内，机器人想在通用智能上替代人类，也是不太现实的。


    总体来看，机器与人类的完美配合一定是发展方向。所以，无论从心态，还是行动上，都要提前准备好，迎接这个大趋势。


    # —— 用户问答 ——


    有两名用户都问到，说对于一些非标准产品的生产，会不会也可能很快用上机器人？


    我有一个客户是一家做锁具的企业，我去参观的时候，发现他们需要很多工人参与生产，我就问他们“为什么不上机器人呢？”他们的回答是“ 一，产品都是非标品，每生产一个零件都需要调试程序，太麻烦。二，单就一个锁体就有好多规格，没法统一。”我当时就纳闷，有没有可能为这种特定行业开发机器人呢？


    我们企业是做最基础的非标准产品机械加工，一直想找公司协助开发机器人，听老师介绍后，感觉我们还要等很久了。我们的产品有重复性，但不在一种设备上重复，每个产品的数量有多也有少。


    我的回答是：


    这要看灵活程度和背后是否有规律可循、是否可训练。


    我们介绍过人工智能和机器人的结合是个大机会，这方面现在研发的进展也非常的快。很多以前我们以为人才做得到的事情，现在有越来越多的机器人也可以做到了。而且随着人工智能的进展，我们的很多过分自大的错误认知，也会得到纠正。


    比如以前我们就觉得下围棋是人才做得到的事情，机器人无论怎么樣，人工智能无论如何都只能减少一部分的运算量，不能像人一样去体会围棋的外势，那些虚无缥缈的东西。但是现在看起来，那些虚无缥缈的东西恰恰是错的。


    所以我认为，现在应该建议做非标准产品的企业也要积极引入人工智能和机器人。


    我们说过，现在是科技军备竞赛时代，要么是你引先进科技，扩大自己的市场占有率。要么就是竞争对手引先进科技，蚕食掉你的市场。


    现在非标产品的量产尚有一定的门槛，现在进行研发正是时候。我认为，未来一段时间，这方面可能会有很大的突破，千万不要等到你的竞争对手突破了，你才发现这件事情没有我们想象的复杂。


    王老师，我有一个想法，不知道您怎么看，货物的大小、轻重，甚至易碎程度是不一样的，需要采用不同的方式和速度进行分拣，存在很多特殊情况，而采用图像识别的手段进行分拣，就需要对各种特殊情况进行单独优化，如果采用物联网的思维，仓储的箱子用廉价的
    RFID 进行标记，在分拣过程中根据 RFID 中标记的信息来进行的相应的操作，会不会更好？


    我的回答是：


    新的科技出来的时候，总是最贵的，而且是更不好使的。但是一定要认清趋势，切莫“倒行逆施”。


    我们都看到了，人工智能，尤其是在图像识别上，一定是趋势，而且现在已经煅发出强大的生命力。


    而 RFID 虽然廉价，但是你要先分门别类地贴上去才行。但一般来说是识别一个物体更难，如果识别以后，分拣就不难了。而用图像识别，识别和分拣都可以由机器来完成，但是用
    RFID 来做的话，其实识别还得交给人来做，分拣交给机器，那任务的难度是不能降低下来的。


    所以我们认为，用图像识别，识别和分拣都由机器来完成，一步到位，这才是未来。


    那我们投资的 Soft Robotics，虽然它其实完成的是分拣的工作，但现在也在大量地运用人工智能来完成识别，使得识别和分拣进一步到位了。


    人工智能的进化，目前虽然在人类的掌控范围内，但是未来呢？


    我的回答是：


    美国的前总统肯尼迪有一次在介绍美国为什么要搞登月计划的时候谈到过，未来的太空也可能是乐园，但也可能是战场。


    但美国人为什么要搞登月计划？


    就是为了要把这个决定权留在自己手里。


    其实人工智能也是一样的，总是会不断地进步，而且从理论上讲，虽然我们看不到，因为我们连人类智能的定义和边界都还没看清楚呢，所以我们说不出来哪一天人工智能会超越人类智能。但总是有可能有那一天，人工智能最终超越了人类智能。


    但是，如果你相信自己是善良的，那么你最好由你自己来开发人工智能，并且利用它来造福世界，也就是说我们应该把人工智能该怎么用的决定权留在自己手里。


    所以我们还是要积极地去开发人工智能。


    当然，其实未来也没有那么悲观，因为我们投资的 Hanson Robotics 的 CEO David Hanson，他也是一位著名的 人工智能和机器人专家，他就讲到过：


    人类进化到今天，我们看到，人类的善良面越来越占主导。那是因为人类有大量的协作，人类之间互相能够充分理解。而现在，人机的协作越来越发达，机 器和机器的协作也在发展起来。只要你相信机器和人能够有大量的协作，那么人的这种正面的东西就会影响机器，未来的机器就会像人一样善良。


    机器人有些时候会失控，比如突然邪恶一下，或者做些奇怪的事情，这种情况着实很可怕吧？记得亚马逊的智能音箱就出现过这种情况，那麽老师，您怎么看待这个问题呢？


    我的回答是：'
