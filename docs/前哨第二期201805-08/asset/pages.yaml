  md: '# 三、重要规律：前沿科技诞生在小公司


    随着我做海外科技投资，我逐渐认识到这是一个科技井喷的时代，大量的科技公司开始进入我的视野。


    比如制造后空翻机器人的 Boston Dynamics，全基因测序的领导企业 Illumina，人工智能硬件的领导企业 Nvidia 等等。


    我们自己也投资了一批这样的企业，比如：


    +   - 创造机器人索菲亚的 Hanson Robotics；

    - 制造万能柔性机器人手 的公司 Soft Robotics；

    - 记录人体生理指征的柔性电子公司 MC10；

    - 让下肢瘫痪病人恢复行走的外骨骼公司 Rex Bionics；

    - 让太阳能芯片制造成本大大降低的1366科技；

    - 开拓了磁共振无线充电技术的WiTricity；

    - 让盲人能够重新感知三维外部世界的 Wicab；

    - 开发出中风急救设备的 Cerevast。


    等等。


    这些公司，我在两季的课程里基本都讲过了，但不是咱们的同学，估计就很少有人能知道，但他们却在深刻地改变我们每个人的生活。再过10到20年，他们中很可能就会出现影响世界的下一代全球500强企业。


    # 四、如何抓住科技创新的机会？


    从我与沙利文合作，到做海外科技投资，从关注大公司引领的世界潮流，到参与到小公司主导的科技创新浪潮中，我深刻地意识到，这个时代正在进入全球科技军备竞赛时代。


    我经常讲到美国1980年推出的《拜杜法案》，因为就是它让高校大量的知识产权可以被转出去 out，而而且可以转转让独家商业权益，大大降低了专利转让费用，不光大公司能买得起，小公司也买得起，美国科技创新专利的转化速度就此大大加快了，于是我们逐渐迎来了一个小公司主导全球科技创新的时代。


    对于如何抓住科技创新的机会，我总结了三点经验：


    # 第一点，尊重国际的商业规则，重视诚信。


    很多国内的企业与国外合作，国外提出了试生产的需求，国内企业立马就答应下来，收取押金，但实际上很多国内企业在生产上并不能满足人家的需求，结果就是无法跟外国企业交差，最终导致合作失败。这不仅耽误了外国企业的量产时间，而且导致外国企业对中国失去信任。


    # 第二点，重视传统的实体产业。


    沙利文公司很少追逐热点的产业，他们更看重有扎实基础的实体产业。但是我要强调，关注前沿科技，可不等同于关注互联网和人工智能，真正的前沿科技是渗透在各行各业里的，我们正在进入硬科技时代，硬科技更加重视技术驱动，硬科技也更依赖于实体产业的量产能力。


    # 第三点，重视小公司的科技创新。


    布局科技创新产业，眼光要放长远，既要重视大公司的微创新，也别忽视小公司的突破性创新。全球正在进入小公司主导的前沿科技创新，我们不能只是看眼下的小公司能不能赚钱，更重要的是参与到他们的<|message|>
    中，让他们成为下一代的世界500强企业。


    # —— 课程小结 ——


    最后总结一下，这一讲我为你讲述了我走向全球科技创新之路的故事，而且通过和沙利文的合作，改变了对传统行业的看法，从而开始关注前沿科技。


    希望你能够掌握以下三点：


    +   第一，学习国外的商业规则，遵守诚信原则和跨文化交流的技巧，与外国企业家坦诚交流，是展示你诚意的有效方式，建立彼此的信任，才会有更多的合作机会。合作机会确实有运气成分，但更重要的是需要你自己去展示自信、争取主动。

    第二，科技创新出现并喷发式发展，小公司已经主导全球科技创新。你在布局全球科技创新时，需要眼光放长远，思考再过10-20年，这家小公司能否成长为下一代的世界500强。

    第三，从创新者个人的角度，你不需要拥有超能力，只要擅于运用科技，每个人都有机会成为这个时代的超级英雄。对有热情，有决心致力于投身科技产业的每个人，你要相信时代的机遇，掌握科技创新方法，成为改变世界的科技企业家。


    # —— 课后思考题 ——


    在你从事的行业中，你了解哪些小公司，它们有哪些科技创新产品，有机会利用科技创新的优势迅速做大，甚至成为未来的世界500强的，这中间有中国公司吗？


    欢迎在留言区向大家介绍，并分享你的观点。


    # —— 重要通知 ——


    根据我的观察，咱们中国很多企业家经常头干活，忙于公司日常事物，却很少挤出时间来抬头看路。 Supply 且总在做自己擅长的事情，比如，技术出身的企业家总强调研发，销售出身的企业家总强调市场。这些都没有错，而且不少企业现阶段也经营得不错。但是我认为，如果企业家能安排一段完整的时间，深入思考企业未来可能面临的挑战，梳理出相对系统的战略规划，对于企业长足发展可能更有意义。


    所以，为了帮助你在全球框架内，更全面地搭建企业全局发展规划，我要向你介绍沙利文公司的高端培训课程，由沙利文咨询公司全球总裁兼执行合伙人 Aroop Zutshi
    专门授课。顺便说下，Aroop就是我原来的老板。


    课程将采用国际流行的工作坊形式（Workshop），运用一套系统的战略分析工具，帮你从头梳理自己的企业战略。这个高端课程强调学员互动和问题导向的方式，密集展开讨论，并且需要当场进行实战演练，最高效地帮你掌握完整有效的战略管理方法。


    课程内容包括：达成组织使命愿景的共识、企业管理和战略实施、有效推进项目实现、科学评估组织绩效等等。


    让每位参与培训的企业家通过自己的系统思考，在培训结束的时候带着崭新的企业战略规划离开。并且应我们的要求，在后续一整年内，Aroop还会利用微信群等线上渠道，为学员提供一整年的个性化专家咨询，以及若干次的线上讲座，以保证你战略规划的顺利执行。


    今年10月份，Aroop将在北京、上海、深圳开展线下工作坊，为了保证培训高质量，目前每个城市的报名人数仅限前50名。如果你不想错过这样一次从全球视角提升企业战略管理机会，欢迎你关注微信公众号“全球风口”，回复“战略规划”，获取课程介绍和报名链接。希望通过这些课程能让你企业成为下一代科技创新的世界500强，让你成为中国的“跨一代”。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，咱们下一讲见。


