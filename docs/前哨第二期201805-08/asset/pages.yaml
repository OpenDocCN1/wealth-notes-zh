  md: '仿生机器人的概念，就是指模仿自然界动物的飞行、运动、感知等行为的机器人。


    从全球角度来说，德国工业自动化公司 Festo 在动物仿生机器人方面一直处于世界领先的地位。2018年初，他们刚刚发布了两款最新研发的仿生机器人：一款是模仿果蝠的飞狐机器人
    Flying fox，另一款是模仿撒哈拉沙漠中蜘蛛的蜘蛛机器人。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_50_0.png)


    Flying fox 的翅膀非常轻薄，但是抗压和灵活性极好。即使在飞行中翅膀受到轻微损伤依然能继续飞行。利用自身的电子设备，以及地面基站摄像头的定位，让这款飞狐机器人实现了半自主飞行。


    除了 Festo 以外，实际上大名鼎鼎的波士顿动力造的狗形和人形机器人也属于仿生机器人。5月份，波士顿刚公布了最新版的 Altas 机器人慢跑的镜头，还有很轻松的一个小跳，跨过了一段木头，如果你感兴趣，可以找来看看。


    # 四、工业机器人的发展趋势


    第一个趋势，是重复性、高精密性的工作会很快被机器人替代。


    第二个趋势，不仅在传统工业领域，特殊行业也会大量应用机器人或者机械臂，与人类优势互补，协作配合，要用开放心态积极应对。


    听到这儿，可能你也会想一个问题，就是机器人这么智能了，是不是有人就要失业了呢？


    我的观点是：


    千万不要像200年前的卢德分子一样，与主流趋势反向而行。


    这里插个题外话，解释一下什么是卢德分子：


    工业革命早期，英国的机器生产逐渐替代手工劳动，这让大批手工业者破产。当时第一个捣毁织袜机的是一个叫卢德的人，后来他和其他工人聚集起来发动暴动，抵制、捣毁、破坏机器，这部分人被称为卢德分子。


    机器的优势，在于完成精密重复的工作，通过任务分解的思想，把流程中某个细分功能用机器人替代，我们就能多从事创造性的工作。


    第三个趋势是，具有自主学习能力的机器人已经出现，而类似人脑，具备通用智能和通用行为的机器人还处于探索过程中。


    # ——◆ 课程小结 ◆——


    这一讲，我给你介绍了应用在传统工业制造、特殊业务领域的工业机器人和仿生机器人，并分享了未来的发展趋势，希望你能掌握以下三点：


    第一，未来机器人的数量会比人多，人与机器协作的场景也会越来越广，成本也会越来越低，总地说来，机器人产业未来发展潜力巨大，同时也对其他产业的格局，以及我们的生活和工作带来重大影响。


    第二，无论是传统工业用机器臂，还是特定用途的机器人，都可以采用任务分解的思想，让每个机器人完成某个特定、精密和重复的任务，然后根据需求灵活组合。这样好处是，能够大规模生产，有效降低制造成本，还始终以市场需求为导向。所以，可以多探索人机协作的应用场景，开发实用性强的机器人。


    第三，未来，工业机器人与人类优势互补，要用开放心态面对。尽管大多数低水平重复性工作会被机器替代，但是我认为，在短期内，机器人想在通用智能上替代人类，还是不太现实的。


    # ——◆ 课后思考题 ◆——


    除了上面介绍的这些，其实日常生活中有很多的机器人，年初我们组织的 CES 考察团里，还有朋友专门去展会上找可以炒菜的机器人，说说你见过的或者了解的机器人吧。


    # 划重点


    +   1. 工业机器人的价值，是相对人工有更高的生产效率，只需定期维护保养，而无需休息，还可以在恶劣环境下工作。

    2. 无论是传统工业用机器臂，还是特定用途的机器人，都可以采用任务分解的思想，让每个机器人完成某个特定、精密和重复的任务，然后根据需求灵活组合。


