    如果你想基于物联网做垂直领域的创新，那还是很有发展前景，你可以分析自己的行业，对行业的流程和环节进行优化，思考能否做出足够深入的行业解决方案，寻找一个杀手级的应用，让自己成为物联网解决方案的提供商。


    # 五、基因编辑


    近两年，CRISPR-Cas9 基因编辑技术大热，这个技术就像人工智能一样，是一种平台级的技术，后续的其他创新都可以建立在它的基础上。


    理论上，它可以借助我们实现任何想要的生物改造。它给基因编辑领域带来了翻天覆地的变化，它可能会让未来医学、农业、食品，甚至能源行业都发生根本性的改变。


    实际上，CRISPR-Cas9 是细菌体内对抗病毒的免疫系统，其中 CRISPR 蛋白主要负责识别和定位病毒 DNA，而 Cas 蛋白负责剪切病毒 DNA。Cas9
    是 Cas 的特殊成员，和其他 Cas 蛋白相比，Cas9 简单小巧，更易于人工合成。而 CRISPR-Cas9 编辑技术的突破性，在于它可以实现既简单又精确地编辑靶向位置的基因。


    例如美国 Temple 大学的 Kamel 教授，就是利用基因编辑先后从人类免疫细胞和活体小鼠身上切除了 HIV 病毒的 DNA 片段，使其无法感染细胞，这项研究可能成为治愈艾滋病的突破口。Kamel
    教授也因此创办了 Excision 公司，计划在2019年开展人体试验。


    但是，我们要注意的是，总体来说，CRISPR-Cas9 编辑技术目前比较成功的医学应用都是针对体外细胞或组织，直接用于人体治疗的时机还不够成熟。要发挥基因编辑的价值，还需要相关医疗技术的全面进步。


    基因编辑技术的机会，在医疗上主要是治疗具有明确致病基因的疾病，比如，单基因遗传病和病毒细菌感染。


    而在非医疗领域，应用机会反而更多，在农业上，培育转基因番茄；在能源化工上，培育转基因海藻，将二氧化碳转化为脂肪生物燃料；在物种控制上，让蚊虫无法携带某些病毒。


    当然，基因编辑技术本身需要一个发展的过程，最重要的是找到实际的应用领域。


    # ——课程小结——


    最后总结一下：科技领域范围广阔，我为你选择了5大领域的科技发展趋势，梳理每个科技的发展现状，剖析其中的机会，一些底层技术的布局机会基本上被大企业抢先占领了。


    但这不代表你就没有机会了，可以尝试结合行业经验，或者利用特定领域的数据，找到切入点，为科技创新找到应用落地的机会，把握科技创新的浪潮。或者预测下一拨的技术趋势，提前3到5年，甚至更早去行动。


    这一讲，我希望你能掌握以下三点：


    第一，有些科技仅仅抓住风口还不行，还要意识到它一旦成熟，会成为人人都可以获得的先进武器，比如人工智能、5G通讯技术、自动驾驶。你运用它不一定能成功，但不应用它的話，就会被淘汰。


    第二，有些科技成熟了，但一直没有找到杀手级的应用，你的机会就是结合自己的行业经验，为它找到合适的应用场景，比如物联网、5G时代下的AR和VR等。


    第三，有些科技原理可能很复杂，目前仍处在实验室阶段，但如果它们能取得突破，就会给你的生活和工作带来颠覆性的改变，所以你需要密切跟踪它们的动态。


    # ——课后思考题——


    除了我选择的5个领域，你认为还有哪些热门科技领域值得关注，为什么？它的应用情况是怎样的呢？


    欢迎在留言区分享你的观点。


