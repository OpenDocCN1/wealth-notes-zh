  md: '# 244 | 新材料：碳纤维


    这一讲，我们要讲的是和石墨烯的组成元素一样，都是碳原子，但在结构上不同的碳纤维材料。


    不知你是否去过，或者关注过，苹果的新总部 Apple Park，它在加州的库珀提诺市。在2011年的时候，乔布斯在库珀提诺市市政厅的会议上，发表了苹果建设新总部的设想。Apple
    Park 就是由乔布斯亲自参与设计和推进的。到2017年9月，苹果公布了乔布斯最后的“新产品”，还开始对公众开放。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_112_0.png)


    苹果的这个新总部大楼是一个环状的建筑，中间是一个大型的庭院，用乔布斯生前自己的话来形容，新大楼像“บินาง着陆的宇宙飞船”。而 Apple Park 用的巨大的穹顶，就全都是由碳纤维材料搭建而成的，它是目前全球最大的碳纤维穹顶。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_112_1.png)


    对于一个建筑的屋顶材料来说，最好就是强度又高、重量又轻、还要耐腐蚀寿命长，而这些正好都是碳纤维材料具备的特点。


    # 一、碳纤维材料


    我们现在都知道，石墨烯是一个碳原子厚度的薄片，由于厚度几乎可以忽略，所以叫二维结构。


    而碳纤维则是一种三维材料，它是通过把片状的石墨沿生长方向堆积起来，然后碳化处理后获得的。它的直径有好几微米，也就是几千纳米，是石墨烯厚度的几千倍。


    所以你可以想象，碳纤维的结构，就像类似石墨烯这样的一张“纸”，一层一层卷起来，卷了几千张，就形成了碳纤维这样一根“粗管”。


    这是咱们说的第一点：碳纤维的结构特性。


    当然，我说过，即使是相同的元素，不同的结构导致的材料性能也是截然不同的。与常见的金属相比，比如钢和铝等，碳纤维的强度更大、密度更低，意味着重量更轻，在温度和气压变化大的环境下，更不容易变形等特性。


    这些特性就决定了，碳纤维非常适合用在大型建筑、航天航空器，以及高端汽车的车架上，用来达到高强度和轻量化的目标。


    这是咱们说的第二点：碳纤维的性能，就是这种材料能用来做什么。


    总体来说，碳纤维的产业化应用比石墨烯要早得多。碳纤维材料的最初雏形可以追溯到1880年，当时爱迪生用棉、亚麻、竹等天然植物纤维，炭化得到碳纤维，用于筛选中空灯灯丝。但最初得到的碳纤维有很多气孔，特别脆而且容易老化，在很小的外力作用下就会发生断裂。


    20世纪60年代以后，英国和美国分别利用人造丝和化学物质聚丙烯腈为原料，研发出了在1000℃~3000℃高温下，边加热边拉伸的炭化技术，使聚丙烯腈碳纤维的性能有了突破性提高。


    目前，由日本人进藤昭男发明的聚丙烯腈基碳纤维，简称PAN碳纤维制备技术，已经成为行业最广泛的技术方法。目前，市场上90%以上的碳纤维都是通过这种技术生产的。


    这是咱们说的第三点：碳纤维的制成工艺。


    # 二、市场应用情况


    总的来说，现在的碳纤维技术已经相当成熟了，而当前和未来几年，碳纤维的应用主要是集中在航空航天和汽车行业。


    说到碳纤维产业，就不得不提到日本的东丽公司。这家公司1926年就成立了，在上世纪70年代初就看准了碳纤维产业的发展机会，然后率先进入并实现了碳纤维的工业化量产，在2016年的时候，他们已经能实现年产接近4万吨了，这占到当时全球市场份额的33%，是名副其实的世界第一的碳纤维生产商，而且不只是生产量足够大，更关键的在于在技术水上它也是全球领先的。


    如果你关注一些科技类的新闻，你肯定听说过什么产品用了T800或者T1000的碳纤维，实际上，这就是东丽的T系列产品，T表示的是拉伸强度，后面的数字越大，就代表碳纤维的拉伸强度越大，也意味着质量更好，等级更高。比如东丽的主力产品就是T300、T800、T1000。


    可能很多人不知道，如今的碳纤维巨头，最早实际上是做“碳纤维鱼竿”起步的。因为在碳纤维刚开始走向市场的时候，碳纤维作为一种新材料，还没有被市场大规模地接受，所以东丽选择把这种新材料用在了市场已经比较稳定的大众体育休闲市场。


    这也是我经常提醒大家的，一定要对高科技在现有行业的应用保持敏感，看它能否对你所在的产业起到推动作用，低垂的果实更容易把握。


    东丽公司的大发展，实际上跟1973年到1974年的国际原油价格急剧升高关系重大，当时因为油价高，所以波音和空客都在使用新材料，希望能把飞机造得既轻又结实，提高燃油的利用率，减少油耗。就在那几年，东丽的T300碳纤维体育用品在美国很畅销。后面你肯定也想到了，就在1975年，东丽的碳纤维就被用在了波音737的一些承力部件上。可以说，东丽公司的发展，很大程度上是获益于碳纤维在波音飞机上的大规模应用。


    这里我多说几句，制造飞机材料的首要前提是强度要高，但是飞机因为在天上飞，又不能太重，所以，飞机机身材料一般选择强度高，重量轻的材料。比如，首选一般是铝材，因为它重量轻，抗压性能好，但是缺点是对拉力比较敏感，也就是说承受拉力性能很一般。


    近年来，为了降低油耗保护环境，达到提高飞机燃油效率的目的，方法就是减轻飞机的机身重量，但是同时又不能牺牲强度。


    于是，人们经过研发发现，碳纤维不仅强度高，而且拉伸性也优秀。所以人们想到采用碳纤维增强材料。比如，在波音787的飞机上，使用复合材料的比例超过了50%，也就是碳纤维增强材料，主要目的就是增加关键部位的强度。


    波音787绝大部分的机身和机翼等都是采用增强材料，余下20%是铝材，15%的钛，10%的钢铁。这样的设计好处是，使得总体飞机重量大约比全部铝材的能减轻20%，强度上还有所提高。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_112_2.png)


    这儿提一句，在材料研发领域，当在某个特定定位，决定使用某种新材料的时候，往往需要针对它的具体应用环境，包括温度、气压、应力等，作出定量的分析，然后，全面评价待选材料的性能，综合评估后再确定设计方案。


    随着碳纤维在航空航天领域应用的普及化，因为性能优异，所以慢慢就扩展到了高端汽车领域。


    一开始，碳纤维主要应用于高档跑车的车架上，全世界第一款使用了碳纤维复合材料的汽车，就是奔驰的SLR McLaren跑车，在跑车最前端吸风区使用了碳纤维，这就是利用了这种材料质量轻，强度高的特性。


    不仅专业的跑车选择了碳纤维复合材料，还比如宝马在新能源电动汽车领域，也在积极尝试采用碳纤维复合材料。


    关注新能源汽车的，肯定知道宝马推出的纯电动汽车i3，它就采用了全碳纤维车架。要知道，车架结构和强度是影响车辆安全'
