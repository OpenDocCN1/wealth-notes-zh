  md: '# 245 | 新材料：柔性电子材料


    我们这一讲的内容，是柔性电子材料。


    相信你对三星的柔性 OLED 液晶屏一定有些了解，早在好几年前，三星就已经推出过弯曲面的手机了，那就是柔性电子材料的一种应用。其实不光三星，柔性屏幕已经离我们越来越近了，2018年1月我们在
    CES 展上试驾拜腾的轿车，他们就是用一个巨大的柔性屏覆盖了前仪_RULE的位置，是由京东方提供的。


    而所谓柔性电子材料，其实是一种统称，它...可以弯曲甚至折叠。


    比如有柔性显示器、柔性传感器、柔性电子织物、柔性电池、柔性线路板等等。而其中，柔性显示器和传感器是目前最重要的研究和应用领域。


    比如我投资的 MC10 公司，他们就是专门做柔性可穿戴产品的，MC10 的创始人是 John Rogers 教授，他是美国国家科学院院士，也是全球柔性电子领域最顶尖的专家之一。


    # 一、柔性传感器—电子皮肤


    这一讲我们主要是讲解柔性传感器，以及它在电子皮肤等方面的应用。


    说到柔性材料，就不得不说美国斯坦福大学的鲍哲南教授，她是杰出的美国华女科学家，曾被《自然》杂志在2015年评选为十大科技人物。她的研究领域很广，但在人造电子皮肤这个领域里，可以说是至关重要。


    皮肤对我们来说再熟悉不过，而电子皮肤简单来说，就是在功能上，不仅模拟真实皮肤的功能，可伸缩、可自我修复，更重要的是，电子皮肤还能模拟真正的触觉行为，可以把触觉的信号传输给大脑，而且大脑还可以做出本能的反馈，让肌肉做出合适的运动。


    第一，利用轻微的压力传感器产生触觉。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_114_0.png)


    这背后的原理是什么呢？


    第二，电子皮肤如何把触觉信号传送给大脑。


    ![](img/ec68de57cecf4aa37e2670e9d4879832_114_1.png)


    第三，电子皮肤如何把触觉传送给其他神经元。


    +   - 第一个，是可以察觉到极其微小力的触碰传感器；

