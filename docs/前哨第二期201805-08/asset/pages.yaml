  md: '# 创新地图 | “页岩气革命” 在中国能否成功？


    王瀚艺博士，前嗨团成员，他就读于德国萨斯大学奥斯汀分校石油工程和地质科学系，曾就职于全球最大的油田技术服务公司斯伦贝谢（Schlumberger）和石油咨询公司
    Michael J. Economides Consultants。他同时也是迈西石油科技，Farwest PetroTech Group 的联合创始人，专门为油气上游产业提供技术和方案咨询（HanYi@utexas.edu）。


    这个模块，王煜全老师讲的主题是可再生能源，在了解了太阳能发电、风能发电行业之后，我今天要讲的是目前在国际上备受关注的页岩气。


    实际上，它并不是可再生能源，而是一种“新”的化石能源，它叫页岩气，其实就是天然气，只是特别就特别在它是埋藏在页岩这种岩石层里，所以得了“页岩气”这么个名字。


    从长远来看，通过提高页岩气和可再生能源的使用比例，能很好地优化能源结构，在提供充足能源的同时降低污染，增强能源利用的环境友好度。


    # 一、页岩气的概念


    我们都知道，现在很多家庭都在使用天然气，但是也许你不知道，常规天然气通常是埋藏在砂岩和碳酸岩中的，这些岩石的特点是孔隙大，所以开采起来相对容易。但是，页岩的孔隙却极小，这就造成里面的天然气通常被固得
    moderation 所以


    不过，虽然开采难度大，但是美国还是在技术上取得了突破，这也是我们现在在媒体上见到“美国页岩气革命”这个标题的由来。


    可能跟你想象中不一样，美国的页岩气革命，可不是埃克森美孚、英国石油、壳牌、雪弗龙这样的大型跨国油气公司推动的，页岩气技术的突破，实际上是源自大批的美国中小型独立石油公司。


    # 二、美国页岩气的发展


    现阶段，美国是全世界唯一一个成熟商业化开采页岩气的国家。可以说，页岩气的开采全盘颠覆了美国的天然气市场结构。


    在2000年左右的时候，美国的天然气30%以上是依赖进口的，之后每年的进口比例都在增加，这种情况一直持续到2007年左右；


