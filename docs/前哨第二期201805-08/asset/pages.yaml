  md: '为了普及环境科学知识，戈尔每年要举行上百场环保演讲，好莱坞制片人 Laurie David 就是听了他的演讲，很受触动，所以决定邀请戈尔一起拍一部关于全球变暖的纪录片，这就是后来2006年上映的《难以忽视的真相》。这部影片在西方国家引起了广大的反响，它的投资只有100万美元，却在全球收获了近5000万美元票房，并一举获得奥斯卡最佳纪录片奖。


    这部电影的主要观点，是讲诉全球变暖是真实在发生的，而结果将会是灾难性的，并且是人为造成的。影片中，戈尔列举了大量的科学证据、照片等事实资料去佐证。


    此外，影片中几个镜头还令人格外印象深刻：


    +   - 海象、北极熊因为浮冰减少，丧失栖息地而死亡；

    - 全球各地出现越来越多的飓风、洪涝、干旱等极端灾害天气；

    - 以及用计算机模拟当全球升温、冰川融化导致海平面上升，世界各大城市被洪水淹没的震惊景象。


    这些触目惊心的镜头加上详尽的科学数据，让全球变暖问题变为大众焦点。2017年，《难以忽视的真相》还推出了续集，讲述了戈尔对于全球变暖问题的持续跟进。


    戈尔促进环境保护教育发展的举措还有很多。


    比如，他促进美国宇航局 NASA 研发制造了可以密切观测与监测地球的卫星，帮助人类从新的角度理解气候危机。在1994年的地球日上，他发起了 GLOBE 项目，通过与国际环保组织以及学者们合作，为全球中小小学提供环境科学的教育。


    第三，戈尔还积极推动环保企业的发展。


    在2001年卸任美国副总统以后，他在碳交易市场、太阳能发电、生物燃料、电动汽车等环保项目上做了大量的投资。


    尽管早期有些项目亏了不少钱，例如他投资的芝加哥气候交易平台，因为得不到政府的支持，在2010年就关闭了。还有 First Solar 公司，在1999年建立没多久，就受到了从中国进口的廉价光伏电池板的影响，一度经营困难，不过，随着美国以及世界各地太阳能的迅速发展，First
    Solar 成功参与了不少光伏太阳能发电项目，目前已经成为一个大型的太阳能产品制造商，也为戈尔带来了不少收入。


    在他的新纪录片《难以忽视的结局》中，戈尔还说到了一个他亲自推动环保的案例，在推动世界各国参与与环保相关的国际协定的时候，印度政府明确提出，我们是发展中国家，目前面临的最大任务是让人民吃饱饭，环保的问题要让位于经济发展。


    戈尔为了让印度的经济发展不受环保需要的巨额资金影响，亲自给特斯拉的 CEO Elon Musk 打电话，说服 Musk 把他的现在已经并入特斯拉的另一家太阳能公司
    Solar City 的专利免费向印度开放，这样一来印度通过发展环保产业不光不会赔钱，甚至还有机会利用先进科技赚钱了。


    虽然 Elon Musk 很快地答应了戈尔的要求，但 Solar City 甚至特斯拉目前都还没有进入印度，据 Elon Musk 说是政府法规上的挑战太大。不过印度对环保的兴趣确实发生了变化，2017年印度政府宣布，到2030年，新能源将占印度能源的40%，公交车将100%是新能源汽车，私人汽车里新能源车占比将达到40%。


    不过，2018年上半年在传统汽车厂商的压力下，印度政府又收回了对新能源汽车的规划。


    其实，全球都一样，环保往往会面临制造污染的既得利益者的强大抵抗，所以推动环保产业也易行难。


    从第一个纪录片的充满活力的刚刚卸任的总统，到第二个纪录片满头白发苍老得让人几乎认不出来的戈尔，真的能体会到推动环保的艰难。建议你找来戈尔的这两部纪录片《难以忽视的真相》和《难以忽视的结局》看看，我相信你会对环保产业的复杂性和戈尔推动环保的不易产生更加深刻的理解。


    # 四、戈尔和全球变暖理论存在的争议


    虽然戈尔在全球变暖问题上鞠躬尽瘁奋斗了终身，但是无论是全球变暖理论学说，还是他本人都存在不小的争议。


