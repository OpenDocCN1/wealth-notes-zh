    ## 遷怒到孩子身上


    問題父母的類型可說是五花八門，其中一類父母光有身本事，卻不能力用在自我成長，而把精力耗費在強迫孩子接受自己的價值觀。這種父母會因為孩子隨意的話語、無心的動作而遍體鱗傷，勃然大怒。佛洛伊德說過：「所謂人類的成長就是自我滿足，就是面對他人對待自己的態度時，是能否心平氣和。」「這不僅是人類的成長，還可說是自我的確立。當自我完整了，就不會因為他人的舉動，動搖不安。


    關於這點，馬斯洛也有過類似看法：當安全、歸屬、愛情、尊敬等渴求，只能從當事者以外的人身上獲得，那麼這個人就只能依賴旁人。例如，向人撒嬌的渴望就能歸於這部分吧。


    因為孩子的言語或動作感到受傷、生氣的父母，會要求孩子把他們的情緒當作孩子的責任，即為情感的責任轉嫁。舉例來說，我父親總是因為我擺放報紙的方式不對就開始生氣，責備著我：「都怪你報紙亂擺，害我覺得很焦躁。」


    只是擺個報紙這樣的小動作，我就必須表達出「我對爸爸所懷抱的尊敬如山高、如海深」，否則他便會相當不高興，向我發怒：「這什麼態度，真讓人討厭！」而且沒完沒了地責罵，接著深深嘆一口氣，拋下一句：「你什麼時候開始變得這麼差勁啊？」因此，我只能硬著頭皮，忍受父親誇大的失望。


    我父親之所以將失望表現得如此浮誇，就是為了加深我的罪惡感，讓我為自己錯誤的擺放方式感到後悔莫及、為自己的態度感到罪惡。這就是溝通分析學中所說的「把過錯都歸咎到對方身上」，而不斷遭到父母數落的孩子，會真的認為是自己的錯，是自己破壞了父母之間的感情。


    當一個人把他人的不愉快當作責任攤在自己身上，在待人接物上便會失去自信。


    溝通分析學裡，把這種慢性定型化的不快情緒稱為「扭曲（racket）」。這股不快的情緒會驅使人們改變他人。說得更深入一點，以「扭曲」來改變他人行為為目的之行為就稱為「強迫」。我在一個情緒不成熟的父親身邊長大，年輕時經常因為感受到內疚而全身發抖，做任何事情都缺乏自信。與人交流時，擔憂自己不知何時會打壞對方的心情，為此一直感到惶恐。在這種狀態下，我害怕到連自己的意見也不敢說出口，甚至無法說明白自身的事，無法問對方問題，就怕讓對方覺得不舒服。一個對自我存在抱持著罪惡感的人，也對人生懷著恐懼。這種事對於心理健康的人來說，大概難以想像其中心酸。因為，這類人做任何事都心有愧疚，把事情的惡果歸咎於自身。而明明沒做錯事，也仍內疚不已，陷入無止盡的煩惱漩渦中。為了逃避愧疚，於是忍不住找藉口；為了不被責難，就拚命解釋。如果不


