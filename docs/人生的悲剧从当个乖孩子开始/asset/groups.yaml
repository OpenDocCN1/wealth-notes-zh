    # 升遷憂鬱症、搬家憂鬱症的機制


    人類必須把自己當作依歸，才能夠真正相信自己，湧出活下去的自信。為

    了獲得活下去的自信，首先必須學會從心理上依靠自己。只要能夠相信自己，

    其他人也才能相信你。


    若能擁有自己的人生定位，心理上就能安定。這樣就能讓自己從延期償付

    （moratorium）²畢業吧！心境上也能量區分自己是自己、他人是他人。在

    心理學上，稱作「形塑自我境界」。


    舉例來說，搬家或升遷常是引發憂鬱症的契機，因此發病的就被稱為「升

    遷憂鬱」或「搬遷憂鬱」。那麼為什麼這些事情會導致發病呢？


    搬離長年住慣了的地方，或者離開已經駕輕就熟的工作型態，的確會喚起

    人們內心的不安，但光是這樣並不足以說明為何引發憂鬱症。'
  - '[PAGE 217]


    我個人認為，或許是因為環境的變化鬆動了這個人的內心機制。也就是說，無論長途旅行、換工作，都會把至今內心構築起來的防衛機制暴露於危險之中，所以才更為棘手。


    我們都會配合四季更迭換上當季衣服，冬天穿夏裝會凍僵，而穿禮服遙狗也顯得尷尬。那 些無法改變內心原有秩序者，就好像只擁有一套衣服，無法配合各種場合打扮出最適當的姿態現身。


    依靠特定一種心理防衛機制的人，其自我是不堪一擊的。相反地，倘若一個人的自我相當堅定，也就能相 信且依靠自己，等於擁有好幾套衣服可以因時制宜。而自 我很脆弱的人只擁有一套夏裝，碰上各式各樣的場合便不知如何應變、自處。


