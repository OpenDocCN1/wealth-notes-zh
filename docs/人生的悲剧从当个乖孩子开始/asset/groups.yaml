    教育家亞歷山大·尼爾（Alexander Sutherland Neill）曾說，最糟糕的父親總會要求孩子「感謝自己」，而最糟糕的母親總是問孩子：「你愛我嗎？」換句話說，這種就是對感情需求無度的父母，他們對愛飢渴，但這跟擔憂孩子、理解孩子卻不相同。然而，為小孩的事而感到煩惱的父母之中，的確有不少人是懷有強烈的愛情飢渴。說得深入一點，那些看似掛心在孩子身上、表面上深愛孩子的雙親，其實很有可能帶有極端的支配欲。他們在看似乎打從心底愛著孩子，不過愛情的真實面貌卻是源自於支配欲。企圖以「好父親」或「好母親」的刻板立場來支配小孩，透過這個過程來滿足本身對愛的飢渴。「真正的愛，會透過間接的方式表達。直接又過度的愛的表現，大多時候都是錯誤的愛。」這句話出自《讓人起疑的母愛》²
