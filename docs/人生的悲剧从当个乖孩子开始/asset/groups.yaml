    \ 們未曾意識過的。他們與親近的人相處時，緊張感就會舒緩，區隔意識與潛意識的障壁也變得脆弱。 \n與親近的人相處時，他們比較會受到潛意識的影響。而自我是由意識與潛"
  - '[PAGE 230]


    意識領域連結而成的，不管是哪個領域都影響不大。「自我」的功能就類似衣服，服，好比在隆冬時，只要穿上暖和的貼身衣物跟大衣就能在戶外行走。要是敢裸身走出門外，恐怕會感覺冒，而就算沒感冒，也會消耗體力，使人患病。在某種意義上，所謂的「自我」等於是「心靈的衣服」。足立博在〈躁鬱症的精神療法〉（《躁鬱症的精神病理》第三輯，弘文堂）這篇論文中，提到一則關於「沒有空氣的月亮」的故事—月球表面沒有空氣，白晝炙熱，夜晚則是酷寒地獄。問題不是出在炙熱或酷寒，而是因為缺乏大氣覆蓋。換句話說，躁鬱症的問題不在於這個
    !!}'
