    # 占有、支配才是愛？


    力。當父母內心的不安、對愛飢渴、無力感、社會自卑等情緒經過偽裝，戴上了名為「愛」的面具後，施壓在孩子身上，將社會形塑出所謂聽話的「乖孩子」。以「愛」的名義，行「精神殺人」之實，這種狀況恐怕相當氾濫。


    打從心底真心愛孩子的父母，即使孩子離開自己身邊闖天下去了，也不會覺得受到嚴重打擊。因為他們愛著孩子，即使無法「擁有」孩子，其心理狀態依舊安定。他們能夠為孩子的幸福感到開心，將孩子的幸福視為自己的幸福。然而，占有欲強烈的父母、支配欲旺盛的雙親以及自我陶醉型的爸媽，就非「擁有」孩子不可。一旦無法「支配」孩子，他們就會感到不幸，無法疼愛'
