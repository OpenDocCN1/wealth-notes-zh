  - '[PAGE 202]


    從今以後，他們所遇到的每個人都無法進入其內心世界裡。我們唯有扎根於這個世界，才能夠無須獨占某個人而仍擁有安全感。一旦父母心裡不夠安定，就會想要獨占小孩。在這種環境下長大的孩子，成人後就會想要獨占戀人，獨占交往對象的一切。不過，即使占有對方，並不表示內心就此得到安寧。孤獨與愛情的渴求只會越演越烈，使他們越陷越深。'
