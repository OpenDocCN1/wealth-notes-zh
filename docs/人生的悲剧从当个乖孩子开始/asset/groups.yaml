    # 酸葡萄與甜檸檬


    完全不觸碰悲傷、憤怒、懊悔、悲慘、懊恨等負面情緒，其實是一種防衛行為。會逃避的人，內心沒有強大到足以去品嚐這些滋味。由於無法忍受如


    此痛苦的情緒，人們只好選擇逃避或者合理化，甚至用別的東西來取代，加上解釋、自我说服。


    類似的例子就是「酸葡萄」跟「甜檸檬」。「酸葡萄」是取自《伊索寓言》（Aesop''s Fables）中的故事，狐狸想要摘取葡萄卻摘不到，就宣稱那串葡萄是酸的。而這裡所指的「酸葡萄」，則是即使吃起來是甜的，那個人依舊認'
  - '[PAGE 100]


    為是酸的。就等吃著甜食，也只感覺到酸味。現實生活中明明充滿愉悅開心的事物，不過這類人若缺乏依存的對象給他保證，就會以為生活並不快樂。而且，連感受快樂的情緒，都令他戰戰兢兢。相反的例子則是「甜檸檬」。口中吃著酸不溜丟的檸檬，本人卻認為是甜的。他們的現實生活充斥著辛酸與悲傷，但如果意識到這些情緒，就等於背叛了自己所依存的對象。所以，這些人明明內心懼怕又難過，卻要強顏歡笑、硬著頭皮說好開心。他們壓抑內心的酸楚，不斷對自己洗腦：這樣就是快樂，就是幸福。「甜檸檬」的故事出處不明，不過跟「酸葡萄」的寓言同樣屬於防衛心理。一日自我武裝起來，這類人天荒地老都無法與他人有心靈上的交流。'
