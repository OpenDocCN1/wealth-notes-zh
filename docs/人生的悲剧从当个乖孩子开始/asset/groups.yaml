    關於這點，馬斯洛也有過類似看法：當安全、歸屬、愛情、尊敬等渴求，只能從當事者以外的人身上獲得，那麼這個人就只能依賴旁人。例如，向人撒嬌的渴望就能歸於這部分吧。


    因為孩子的言語或動作感到受傷、生氣的父母，會要求孩子把他們的情緒當作孩子的責任，即為情感的責任轉嫁。舉例來說，我父親總是因為我擺放報紙的方式不對就開始生氣，責備著我：「都怪你報紙亂擺，害我覺得很焦躁。」


