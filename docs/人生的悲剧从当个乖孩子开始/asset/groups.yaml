    # 矛盾心態


    力考慮對方的感受。也就是說，他們故意無視對方的期待。以溝通方式來說，屬於所謂的「選擇性忽略」。他們存心忽略對方的期待，其實是因為，比起普通人，他們覺得對方的期待，意義是更加重大的。他們天真地以為，只要刻意忽略對方的期待，或許就能繼續維持住對方的好感。


    這種人的特徵是，完全以自我為中心來理解周遭事物，卻絲毫無法想像自己的言一行對方會如何解讀。他們只想急著告訴對方：「自己並沒有拒絕回應期待」，除此之外無法顧及其他事情。極端的自我中心，等於是「心中不存在他人」。如果他們有辦法回絕他人'
  - '[PAGE 197]


    期望，就不會刻意裝傻，或是面對對方顯而易見的意思時，轉頭逃避，甚至故意視若無睹。當他們無法回應對方期待，就會要些小手段保護自己。


    他們刻意忽視對方發火的原因，還義正嚴詞地反駁：「這有什麼好生氣的！」讓對方極度不悅。會說出這種話的人，僅想到要保護自己，天真無知只能要賴。甚至可以說，他們的內心冷漠，輕視了對方。明明如此看重對方的期待，卻擺出這樣的態度。然而，當他們自己受創時，那可是驚天動地的大事！


    可當對方受傷時，他們卻置身事外，淡漠得令人驚訝。


    於是，他們頻頻出現類似這樣的反駁：「這種小事有必要看得這麼重嗎？」或者「你有必要發這麼大的火嗎？」他們害怕自己的態度惹怒對方，但看到對方發怒時，卻又竊喜。這種人對周遭的人事物懷著「矛盾心態（ambivalence）」——雖然認為周遭的期待很重要，可是另一方面又對旁人懷有敵意。


    由於他們對周遭人們抱有敵意，一旦別人煩躁不安，他就覺得心情暢快，'
  - '[PAGE 198]


    這種快感彷彿自己對他們進行了報復。這種人企圖逃離對方，內心有著敵意，但同時卻也將對方的期待看得很重，於是就被自己的矛盾情緒弄得苦不堪言。 這類人自然會被討厭，沒有人喜歡跟這樣的人相處，因此他們總是孤身一人。在人際關係方面遇難題者，可反而省一下自己內心是否有這樣的「矛盾心態」。

    言行舉止無法坦率，內心某個角落就有矛盾心態在作祟。既然跟他人來往不開心，離開不得了？但他們卻無法脫離。也就是說，他們與他人「糾纏不清」。在旁人眼裡，既然已是牢騷滿腹，「離開」便是一條路。可以是，他本人卻怎麼也無法抽離。他們內心雖然對人懷有敵意，但少了對方的善意就活不下去，所以自相矛盾且難以自拔。歸根究柢，是因為其心理層面不夠成熟，所以無論他們如何想辦法親近對方，永遠都無法得到心理上的安定。'
  - '[PAGE 199]


