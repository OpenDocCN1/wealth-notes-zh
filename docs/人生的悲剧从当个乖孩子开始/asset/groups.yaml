    有精神官能症傾向的人，由於在愛情方面的渴求沒能獲得滿足，於是牢牢抓住既有的關係不放。這種人一旦有新的人際關係，就會巴著對方不放，投注大量的熱情來維持這段新關係。但他們其實對這段關係缺乏信心，而為了這段


