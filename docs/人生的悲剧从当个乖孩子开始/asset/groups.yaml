    # 某個「乖孩子」的悲劇


    紐約的精神分析醫師溫伯格（George Weinberg）「在其著作中，提到一位名叫伊蕾娜的女性的故事。伊蕾娜是家中的第一個孩子，尤其受到父親寵愛。在她五歲的那年，弟弟出生了。突然間，大家不再像以前那樣凡事以她為主，
    exch ... 年幼的伊蕾娜眼睜睜看著父母的關注全都轉移到弟弟身上，讓她驚愕不已。雖然伊蕾娜感覺很受傷，但仍百般嘗試，想要挽回父親的愛與注意。


    ① 美國知名心理學家。於心理學有重大貢獻，創立了「同性戀恐懼症」（homophobia）一詞。'
  - '[PAGE 20]


    首先，她用發脾氣來吸引注意力，但父親對伊蕾娜的無理取關，態度還是相當嚴厲。接下來，她擺出一副病懶懶、虛弱無力的嬌態，不過這一招也沒有奏效。於是，她改變作戰方針，化身為一個熱心幫忙的乖孩子。結果如何呢？這次父親終於對她展露出了微笑。

    這就是伊蕾娜開始扮演「乖孩子」的過程。每個人在成長過程中都會歷經各種嘗試，找出一套方法能讓自己得到想要的事務。人类行為的動機由兩個要素所構成：「目的」與「信念」。以伊蕾娜的狀況來說，她的目的生長「獲得父親的認同」，信念則是「自己能夠幫上忙」。

    一開始她用惡作劇來凸顯自己存在，或者大聲哭鬧、跟弟弟爭風吃醋。然後，而伊蕾娜採取的這些手段都以失敗告終。最後，她終於發現一條能夠接近父親'
  - '[PAGE 21]


    親的道路：變成一個對父親有幫助的「乖孩子」。對人類來說，從孩提時代養成的型態是很容 易維持下去的。由此，幼年時期一旦選定了某種行為模式，即使成人後也不會改變。以伊蕾娜的例子來看，她就成了一個替男性做牛做馬的女子。二十歲時，伊蕾娜與一名男性陷入愛河，但她卻滿懷恐懼，害怕失去男友。因為，她打從心底認為，自己是個毫無價值的人，所以絲毫不敢跟男友唱反調，也不敢有任何抱怨，甚至對男友要求什麼都做不到。但她每天晚上都勤奮地為深愛的男友洗手做羹湯，或者幫男友將稿子輸入電腦。她與男友的互動，套用了幼年時期自己跟父親的相處模式。伊蕾娜若不做些有益於戀人的事，便會覺得自己可能會被拋棄。於是，她便在自己身上添加了負擔。伊蕾娜對男友搗心搗肺、鞠躬盡瘁，但兩人不久後還是步上分手一途。在那之後過了幾年，某一天她夢見了前男友，她對著他大聲怒罵，還氣到轉醒。'
  - '[PAGE 22]


    她最震驚的發現是，原來過去她從不容許自己對前男友發火，即使那個人對待自己的態度很草率，她也不敢大發雷霆。後來，她有了新男友，而這次她發誓，一定要盡己所能地滿足男友需求。就這樣，伊蕾娜被男人輕視、淪為釣餌，當作妓上肉來消耗。這個案例出自溫伯格《如何改造自己》(Self
    Creation)，日文版為加藤諭三翻譯。


    # 「作好事、得褒獎」的陷阱


    請試著回想自己小時候，大家應該都有幫忙做家事，受到大人誇讚，或者幫忙父母照顧弟妹而得到稱許，以及打掃庭院獲得褒獎等經驗。滿足父母虛榮心時，也能得到父母的好臉色。同樣的道理，孩子只要學校'
  - '[PAGE 23]


    成續好，父母就會開心；在運動會上拿到冠軍，就能取悅父母。只要孩子能讓父母自傲，就會得到疼愛。


    不過，這種模式卻暗藏危機。由於孩子只有在幫忙父母時、滿足父母虛榮心時，才會得到讚美，孩子便會認為，要是自己不做這些，就會失去存在的意義。孩子們也會誤解成，如果自己一無是處、無法為父母帶來驕傲，就不會被父母所愛。因此，孩子會不斷努力使出取悅父母的花招，想獲取認同與疼愛。


    這種傾向會隨著孩子年齡增長越來越嚴重。為了得到他人的愛，這樣的人被迫去滿足對方的虛榮心，而且還先入為主地誤認自己必須有助於對方。他完全無法理解，其實只要彼此能夠在一起就是有意義的。他隨時都覺得內心無法平靜且滿懷歉意。這種人面臨的罩門就是：深信「只要」自己能夠建立事業，就可擴獲對方歡心。


    孩子若年紀尚小，問題還不大。麻煩的是，當他長大成人，周邊的人事環境都改變了之後，故步自封，以為要得到他人喜歡，只要自己幫上忙就萬無一'
  - '[PAGE 24]


    失，結果便一頭熱地為對方奉獻犧牲。

    然而，話說回來，對方可不一定都希望你為他做牛做馬。

    「我都做到這種地步了……」

    舉例來說，有些人因為小時候經常幫忙做家事而得到大人讚美。當他們有了家庭，仍然先入為主地認為：只要我把一切家事都料理好，就能夠使配偶感到喜悅。

    可是，現實卻有落差，配偶毫不重視這些。另一方是希望，夫妻倆能一起行遍天下，或者希望配偶擁有成熟的情緒、期待對方具備享樂的能力。像是夫妻一同出去聽聽音樂會、喝點小酒，享受人生樂趣。

    不過配偶的這些期望，對他而言卻是難以理解。因為，在他腦海裡早已有'
  - '[PAGE 25]


    了預設條件：「我「只要」做好家事就能取悅配偶。結果，配偶並未因此感到開心。如果能及時發覺事情不太對勁，那麽一切還有救。問題是，大多數人反而更加徒勞地努力，拚命展現自己的功勞來討對方喜歡。

    為得到對方喜愛而燃燒自己、照亮別人，當得到的效率並不如預期時，便會為此生氣：

    「老娘（老子）都這樣做牛做馬了，還想怎麽樣！」

    「我犧牲奉獻全是為了這個家，你卻絲毫不懂感謝！」

    到這種地步，這些人依舊無法理解，為什麽自己的努力換來一場空，想獲得心卻得不到稱讚。於是，他們開始感到不滿，對方抱有負面情感。

