    夾在「不准存在」與「給我死命工作」的兩難絕境 我曾於前文提到，有種人必須經常貢獻自己的力量，否則罪惡感就會上身。當他們發現自己不必有貢獻，對他人也有意義，會使他們驚訝莫名，並且存疑：「世上怎麼可能會這種好事？！」
