    # 服虞之人犯罪的緣由


    長期旅行、轉職、搬遷等，有可能動搖當前的內心機制，心情會覺得沉重。這樣的人即使是搬到環境更好的地方，仍提不起勁。因為，環境的變化有機會導致至今壓抑下來的感情悄悄地在心底蠢蠢欲動。內心若有壓抑，就很難跟他人達成「同一化」，也無法更換另一套衣服。所謂「自我同—化」是必須體驗各種感動，與值得尊敬的人相遇。擁有許多套衣服，就是體驗過各種「自我同一化」的體驗。和玩樂的夥伴同一化，就是跟玩伴一起玩要，度過快樂時光；或者與尊敬的人相遇，得到感動的體驗，從他們身上學習何謂人生。


