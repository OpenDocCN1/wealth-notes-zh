    遺父母棄之不顧的恐懼


    孩子心中懷著各種恐懼，其中一種就是害怕被父母遺棄。對孩子來說，這是相當不得了的。這樣的懼怕之心會使得孩子違背本性，更在往後的人生留下難以抹滅的後遺症，徹底支配著這個人。幼年時期曾經有過如此恐懼的孩子，即使長大成人也不容易擺脫陰影。舉例來說，這類人總是不斷猜測他人心思，想方設法讓對方把注意力停留在自己身上，或者總是替對方做牛做馬。這樣的人就算拚了老命，還是會陷入不安、憂煩無限的泥沼裡。到後來，他們時時刻刻都得繃緊神經，原本應該辦得到的事也變得無能為力，無法發揮出自己原有的能力。


    遭到遺棄是非常可怕的，所以他們老是緊張兮兮地怕被拋棄，這樣的情緒讓他們全身緊繃。當面對一個全新環境時，這類人不會嘗試發掘自己的可能性，反而對新環境充滿擔憂。


    重壓在心靈深處的恐懼在幼年時期相對嚴重，因為對孩子來說，是可能真的會遭到拋棄。無論事實上真的被拋棄與否，關鍵是孩子本身就是感受如此。


    父母可以辯稱自己抓狂的行為是一時情緒反應，不過孩子卻無法這樣理解。懷抱著「恐怕遭到遺棄」這種想法的孩子，心理隨時處在不安定狀態，總是跟有一日會被拋棄的不安感對戰。


    人的內心越是不安，越是牢牢抓住對方不放。越是這樣的人，對於對方的言行舉止就越敏感。對方單純的一句話或小動作，都會令他懷疑自己是否被討厭。不安與恐懼越是強烈，越容易把對方的言行認定是對自己不利的，並感到自卑。


    懷著自卑感的人，之所以會過度在意自己的弱點，不安的情緒是其根源。


    當內心背負著可能遭到拋棄的不安，對方的無心之言都會被他解釋成針對自己弱點的責難。一旦與對方發生些許摩擦，他會立刻與自己的缺點連結，害怕自己可能會被拋棄，內心倦促。相對地，成長過程中沒有遭遇到可能被拋棄、沒有這些不安的人則內心強大，什麼都不畏懼。


    我個人的筆記本裡，紀錄了一些關於孩子恐懼的文字紀錄，篇幅多達二百三十頁。可惜這些內容的出處都不太確定，因為這是為了加強印象所紀錄下來的，例如以下這段：


    「因此，能夠很幸運地生於一般的良善之家，在相愛的雙親身邊成長，這種人非常清楚誰是可以給予自己支持、安慰與保護的人，也知道在哪裡發現這樣的人。（中略）這樣的經驗讓他確信，當自己陷入困境時，無論何時何地都會有一雙值得信任的手援助自己，這種深信幾乎接近潛意識。」


    順帶一提，據說《聖經》裡最常出現的金句就是「不要恐懼」。


    無法信賴自己，並輕視自身的苦楚


    恐懼是一大心理課題，世上有些人夠解決這道難題，也有人終其一生仍無法擺脫。能夠無所畏懼地表現自己的人，便能體會到活著的快樂；與人面對面也敢呈現自己的人，心底會湧出一股強而有力的力量。

    相對地，一個害怕遭人拋棄者無法打從心底信賴自己，因此會不知覺地綁緊全身肌肉。

    我會在後面篇幅提到，父母流露出不悅的態度，對孩子來說就是一種「拒絕」訊號。我的父親老是板著臉，在我心中深深烙下恐懼，害怕隨時可能被拋棄。心懷畏怯，也等於無法信任對方。一個無法相信他人者，其實也無法信任自己。


    「信任自己」與「信任對方」是同時發生的。當一個人不相信對方的好意，就算是對方是信任自己的，但他心中仍時時擔憂對方會變心。無法信任對方，也表示內心充滿自卑，彷彿在對自己說：像我這樣的人根本不值得被信賴。然而，一個能信任自己的人，從內心就能感受到力量，也能自信地與他人互動，不會感到畏懼。在恐懼的籠罩下，人的心智會被削弱，遇到拒絕便會受傷，而為了逃避傷害，他的心靈採取被動的姿態。這樣的人同時也會喪失驅動對方的能力。其實，迎合、懷柔、阿諛諂媚等並不是驅動對方的行為，而是為了保護自己。

    這本書主要討論親子問題，同時希望透過此討論與大家一塊思考，如何實現自己的潛力。如果忽視自己幼年時期留下的心靈創傷，一定會覺得生命空虛且沒有意義、被自卑感糾纏不清，就因為心靈創傷會支配一輩子。我也曾為此憂煩不已。有些人小時候深信當個「乖孩子」是幸福的條件，所以不斷違背本性。為了這樣的人們，我將在本書跟大家一起思考——對人而言，什麼才是最好的生活方式。


    某個「乖孩子」的悲劇


    紐約的精神分析醫師溫伯格（George Weinberg）「在其著作中，提到一位名叫伊蕾娜的女性的故事。伊蕾娜是家中的第一個孩子，尤其受到父親寵愛。在她五歲的那年，弟弟出生了。突然間，大家不再像以前那樣凡事以她為主，年幼的伊蕾娜眼睜睜看著父母的關注全都轉移到弟弟身上，讓她驚愕不已。雖然伊蕾娜感覺很受傷，但仍百般嘗試，想要挽回父親的愛與注意。


    ① 美國知名心理學家。於心理學有重大貢獻，創立了「同性戀恐懼症」（homophobia）一詞。


    首先，她用發脾氣來吸引注意力，但父親對伊蕾娜的無理取鬧，態度還是相當嚴厲。接下來，她擺出一副病懶懶、虛弱無力的嬌態，不過這一招也沒有奏效。於是，她改變作戰方針，化身為一個熱心幫忙的乖孩子。結果如何呢？這次父親終於對她展露出了微笑。

    這就是伊蕾娜開始扮演「乖孩子」的過程。每個人在成長過程中都會歷經各種嘗試，找出一套方法能讓自己得到想要的東西。人類行為的動機由兩個要素所構成：「目的」與「信念」。以伊蕾娜的狀況來說，她的目的就是「獲得父親的認同」，信念則是「自己能夠幫上忙」。

    一開始她用惡作劇來凸顯自己存在，或者大聲哭鬧、跟弟弟爭風吃醋。然後，而伊蕾娜採取的這些手段都以失敗告終。最後，她終於發現一條能夠接近父親的道路：變成一個對父親有幫助的「乖孩子」。對人類來說，從孩提時代養成的型態是很容
    易維持下去的。由此，幼年時期一旦選定了某種行為模式，即使成人後也不會改變。以伊蕾娜的例子來看，她就成了一個替男性做牛做馬的女子。二十歲時，伊蕾娜與一名男性陷入愛河，但她卻滿懷恐懼，害怕失去男友。因為，她打從心底認為，自己是個毫無價值的人，所以絲毫不敢跟男友唱反調，也不敢有任何抱怨，甚至對男友要求什麼都做不到。但她每天晚上都勤奮地為深愛的男友洗手做羹湯，或者幫男友將稿子輸入電腦。她與男友的互動，套用了幼年時期自己跟父親的相處模式。伊蕾娜若不做些有益於戀人的事，便會覺得自己可能會被拋棄。於是，她便在自己身上添加了負擔。伊蕾娜對男友鞠躬盡瘁，但兩人不久後還是步上分手一途。在那之後過了幾年，某一天她夢見了前男友，她對著他大聲怒罵，還氣到轉醒。


    她最震驚的發現是，原來過去她從不容許自己對前男友發火，即使那個人對待自己的態度很草率，她也不敢大發雷霆。後來，她有了新男友，而這次她發誓，一定要盡己所能地滿足男友需求。就這樣，伊蕾娜被男人輕視、淪為釣餌，當作妓上肉來消耗。這個案例出自溫伯格《如何改造自己》(Self
    Creation)，日文版為加藤諭三翻譯。


    「作好事、得褒獎」的陷阱


    請試著回想自己小時候，大家應該都有幫忙做家事，受到大人誇讚，或者幫忙父母照顧弟妹而得到稱許，以及打掃庭院獲得褒獎等經驗。滿足父母虛榮心時，也能得到父母的好臉色。同樣的道理，孩子只要學校成續好，父母就會開心；在運動會上拿到冠軍，就能取悅父母。只要孩子能讓父母自傲，就會得到疼愛。


    不過，這種模式卻暗藏危機。由於孩子只有在幫忙父母時、滿足父母虛榮心時，才會得到讚美，孩子便會認為，要是自己不做這些，就會失去存在的意義。孩子們也會誤解成，如果自己一無是處、無法為父母帶來驕傲，就不會被父母所愛。因此，孩子會不斷努力使出取悅父母的花招，想獲取認同與疼愛。


    這種傾向會隨著孩子年齡增長越來越嚴重。為了得到他人的愛，這樣的人被迫去滿足對方的虛榮心，而且還先入為主地誤認自己必須有助於對方。他完全無法理解，其實只要彼此能夠在一起就是有意義的。他隨時都覺得內心無法平靜且滿懷歉意。這種人面臨的罩門就是：深信「只要」自己能夠建立事業，就可擴獲對方歡心。


    孩子若年紀尚小，問題還不大。麻煩的是，當他長大成人，周邊的人事環境都改變了之後，故步自封，以為要得到他人喜歡，只要自己幫上忙就萬無一失，結果便一頭熱地為對方奉獻犧牲。

    然而，話說回來，對方可不一定都希望你為他做牛做馬。

    「我都做到這種地步了……」

    舉例來說，有些人因為小時候經常幫忙做家事而得到大人讚美。當他們有了家庭，仍然先入為主地認為：只要我把一切家事都料理好，就能夠使配偶感到喜悅。

    可是，現實卻有落差，配偶毫不重視這些。另一方是希望，夫妻倆能一起行遍天下，或者希望配偶擁有成熟的情緒、期待對方具備享樂的能力。像是夫妻一同出去聽聽音樂會、喝點小酒，享受人生樂趣。

    不過配偶的這些期望，對他而言卻是難以理解。因為，在他腦海裡早已有預設條件：「我「只要」做好家事就能取悅配偶。結果，配偶並未因此感到開心。如果能及時發覺事情不太對勁，那麽一切還有救。問題是，大多數人反而更加徒勞地努力，拚命展現自己的功勞來討對方喜歡。

    為得到對方喜愛而燃燒自己、照亮別人，當得到的效率並不如預期時，便會為此生氣：

    「老娘（老子）都這樣做牛做馬了，還想怎麽樣！」

    「我犧牲奉獻全是為了這個家，你卻絲毫不懂感謝！」

    到這種地步，這些人依舊無法理解，為什麽自己的努力換來一場空，想獲得心卻得不到稱讚。於是，他們開始感到不滿，對方抱有負面情感。

    要建立順遂的人際關係，不光是給對方帶來好處就能通行無阻，還需要個人的心理成長。不要期待自己的貢獻能讓對方多看自己一眼，而必須單純地為自己的貢獻感到喜悅。這樣，不但對方對自己有好感，有時候還會得到感謝，人際關係自然而然也就順利無礙。


    不過，一個心理不成熟的人建功立業的動機卻不單純，他們的目的是要得到喜愛、好評。動不動就擺出一副自己是在施捨的模樣，只會惹得對方不快。問題就在，這個人凡事刻意彰顯自己的豐功偉業。


    隱藏的神經質愛情索求


    有種人會一頭熱地貢獻自己，他們認為這是讓對方喜歡的殺手鐧，相信自己的犧牲奉獻，是贏取對方稱許、擴獲好感的終極手段。對於在以自我為中心的父母身邊長大的人來說，的確是事實。因為凡事以自我為中心的父母，唯有當孩子對自己有益處，或是孩子的表現值得矜傲時，他們才會感到開心。這些孩子因此走火入魔，逼著自己必須做出某些貢獻，否則罪惡感就會湧上心頭。他們一旦沒辦法對他人有益，便會被罪惡感深深地折磨；與人相處時也絲毫無法放鬆。因為對他們來說，放鬆讓他們感到罪惡。不幸的是，當這些人做這些會讓自己有罪惡感的事時，人們反而對他們有好感。周遭的人也期望他們能夠做自己真正喜歡的事。

    如同我多次強調的，他們努力取悅他人就為了獲得對方喜歡，從這個層面來說，其實這只是表面的。隱藏在底層的，是有精神官能症傾向的愛情渴求。

    由於內心對愛的渴求，使得他們為了得到喜愛而拚命地建功立業。

    但付出努力不一定就會有回報時，這樣更把他們逼上絕路，人際關係也出現裂痕。


    開朗又溫順的乖孩子是精神上的自殺者


    對於人類的自我實現，美國心理學家馬斯洛（Abraham Harold Maslow）曾經有過深入研究，他在著作裡提到以下內容：

    「如果要小孩在『讓自己開心的經驗』以及『得到他人認可的經驗』中二擇一，通常小孩會選擇『得到他人認可』。所以，他們扼殺了自身的喜悅情感，或者移開視線，逃離這些情感。對於幼小的孩子而言，世上最可怕的，莫過於失去周遭人們的心。這些孩子在他Return人沒察覺之下，開始懷著精神性死亡，邁向人生道路。」

    換言之，所謂「開朗又溫順的乖孩子」，其實帶著精神性死亡展開了人生。無法信任自己內心的孩子，試圖透過取悅父母來獲得認同。他們學會一個道理：「只要能讓父母開心，就可以看到獲得讚賞」，而這樣的態度也一直延續到他們長大成人。取悅他人的確並非壞事，但如果動機是為了得到對方的認可、企圖得到讚美，問題就會浮現。套用馬斯洛的說法，即使起因為「成長動機」，取悅他人便是一件好事；而出發點若是「匱乏動機」就不太妙了。這裡提到的「成長動機」，是為了滿足基本欲求、實現自我的欲望而驅動。相反地，「匱乏動機」則是因為缺乏安全感、所屬或親密關係等基本欲求不足，為了填補不足而起的動機。按照這個說法，害怕失去人心而違背自身本性的行動，就是源於匱乏動機。馬斯洛也說，以這些孩子的狀況來看，「獲得他人讚美」跟「信任自己」


    德國心理學家卡倫·霍妮（Karen Horney）也說過同樣的意見：「迎合他人的結果，就會感覺無法倚賴自己。」

    美國心理學家羅洛·梅（Rollo May）也說了以下這段話：

    「當我們為了得到他人讚賞而採取行動，這時行動本身會讓人赤裸裸地回想起自己的懦弱，以及自己缺乏價值的不堪。」（小野泰博翻譯自《重整消失的自我》，誠信書房出版）

    羅洛·梅甚至毫不留情地批判，認為對人類來說，這種態度是最殘酷的屈辱，會導致一個人膽小怕事。

    然而，人們如果在情緒不成熟的父母身邊成長，便會誤信要得到他人喜愛方法，就是想盡辦法得到認可。這種人固執地認為，毫無偽飾、真實面貌的自己無法得到任何人喜愛，因此他們開始偽裝自己，最終完全忘記自己的真實模樣。


    心理療法中的一套技法認為，「Don''t be you」（不要做你自己）這句話是「父母摧毀孩子心靈的訊息」。「不要做你自己」是一句很驚人的話，轉過來思考，馬斯洛或許說的也是同一件事吧！


    孩子甚至會為了得到父母喜愛，而否定自己感到歡愉的體驗。他們嘴裡說出的每一句話都是父母愛聽的、舉止態度都是父母所中意的。因為，倘若他們不這樣做，父母就會面露不悅，這正是「不要做你自己」的訊息。當孩子開始放棄自己的感受方式、斷了自己心中的念頭，便會喪失自我。


    幼年時期我就曾經歷過這樣的過程。我總是採取父親喜歡的行動，而最


