    # 對自己灰心喪志者眼中的世界


    一個人想盡辦法要適應周遭環境，總是害怕著是否會對旁人帶來麻煩與否，當然會消耗許多少精力。他們對自己的存在充滿愧疚，或許打從一開始，就於無意識中覺得我最好要消失。憂鬱親和型人格的特徵是「無法向人借力」，更精確地來說，就是無法欠人情債。

    這很類似基督教中「原罪」的概念，從這個角度來解釋，就能更充分理解他們身上的諸多性格特徵，如：堅守仁義、無法放心接受他人善意、極度恐'
  - '[PAGE 171]


    惶人際關係中的愧疚感、以他者為中心等。 另外，還有一個說法是「自我缺陷」，這是更加嚴重的。所謂「缺陷」， 前提是有些零，然而他們起初就是負債狀態。憂鬱親和型人格的特徵有各種
    層面，第一個特徵就是「賤賣自己」；第二是「無法建構充滿個性的人際關 係」；第三則是「行事作風符合世俗卻相當弱勢，同時無法想像世上有其他類 型 的價值觀」，他們建立的人際關係總帶著「功能性」。第四個特徵是，「一
    旦不被認同，就瞬間跌入深谷、精神萎靡不振」。上述的特徵與「不准存在」 禁令可說是密不可分！ 他們一旦收了「不准存在」的禁令，腦子就會變得固執，認為自己如果
    沒有特殊貢獻，就無法受到他人喜愛。他們無法相信。毫無矯飾的自己就足以 得到喜愛，能夠被接納。 由於沒有自信，也為了讓對方接受自己，便先入為主地認定：「我非做些
    什麼不可」。事實上，就算是他們什麼也不做，還是有人會接納他們。但他們卻'
  - '[PAGE 172]


    早已經認定——如果我對對方沒有貢獻，將會令他大失所望。


    他們與人相處時，總是感到自卑。相處的當下或許愉快，可等到告別後，他們又會擅自解讀，認為對方跟自己相處時，一定覺得枯燥無聊。他們完全無法理解對方精神上的滿足，並且認定，唯有替對方帶來名聲、肉體上的滿足，對方才會滿意。


    這樣的無法理解自我存在的價值。正因為他們接觸了「不准存在」的禁令，在這種難堪的情況下，要求他們體會自我價值，或許相當困難。


    他們唯一能做的，是透過「不准存在」這個禁令來自我察覺「自己對自己失望」的事實。但他們失望的根源卻都是毫無根據、憑空捏造而來的。必須要理解這點，他們才能重新出發。


    與自信滿滿的人相比，這些對自己失望的人，眼中所映射出的世界，真是截然不同。對他們來說，世界充滿了威脅，要求他們放鬆緊繃的神經，只是白費工夫。只有自行孕育出自信，才能自然而然地放鬆下來。'
