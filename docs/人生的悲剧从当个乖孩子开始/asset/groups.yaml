    # 沒有確立自我，成了「表面高手」


    簡單用一句話說，就是沒有確立自我。所謂「自我」能夠掌控感情，連結


    ③ 美國心理學家，著出版著作《長不大的男人》（The Peter Pan Syndrome: Men Who Have Never Grown Up），選流出版。'
