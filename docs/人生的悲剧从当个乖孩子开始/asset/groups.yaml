    ## 孩子淪為父母精神糾葛的犧牲品


    人心中一旦有煩惱，就沒有餘力去管其他事，糾結的情緒已經占據了整個心靈。為人父母者若被自己內心的糾葛而分散了注意力，就無法顧及孩子的心緒，這種狀況可說是屢見不鮮。


    陷入憂煩的人沒閒工夫聽別人說話，或許耳朵有在聽，但注意力卻沒在那上頭。煩心的人經常陷入自己世界，縱使眼前有絕妙美景也視而不見；即使吃著山珍海味卻如同嚼蠟，老是掛意著別的事情。


    換句話說，煩惱的人無法關心外在世界，情緒總是高漲且緊繃，也無法與他人接觸交流，畢竟光是消化處理自己的事，就足以令他筋疲力竭了。


    跟這種滿是憂懼的人來往，即使是成人也會覺得相當費力。這樣想來，若孩子在苦於內心糾結的父母膝下長大，他們會有多麼為難，就不想像了吧？


    舉個例子，某個在社會上遭遇挫折的父母，由於無法接受自身的失敗，所以只好虛張聲勢地大放厥詞：「什麼成功名就、平步青雲，全都是屁！」這種日以繼夜跟自己內心的糾葛戰鬥的父母，對他們來說，最要緊的是處理解決自身的自卑感，而非孩子的情意。他們一點都不關心孩子目前有什麼訴求，滿腦子只有「我是很厲害的呢！我可是重要人物喔！」這種想法。一味盤算著要他人稱讚、表揚自己，而完全沒有心力去留意孩子的心思。光是處理解決自卑感就耗盡心神，哪有時間關切孩子是否感到悲傷。他們無法理解，為什麼孩子想要得到父母的注意。對這種父母來說，瞭解孩子的需求，遠遠都比不上「讓孩子尊重自己」重要。言歸正傳，我們再回來談談「心智不成熟的父母」以及順從的「乖孩子」。那些在社會上受到挫折的父母，在家庭中會要求另一半或孩子不斷讚美、


