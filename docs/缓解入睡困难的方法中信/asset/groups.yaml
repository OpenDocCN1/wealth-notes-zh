    \  - 因此，在睡觉前最好的方法就是尽可能地关闭所有光源，或者使用窗帘等遮光物将身体置于漆黑的环境中。\n\n- 选择合适的床品\n  - 研究表明，舒适的床垫和被褥对睡眠的深度和质量有显著的影响。中等硬度的床垫对睡眠质量有积极影响，可以防止睡眠障碍和肌肉不适。\n\
    \  - 枕头的质量也很重要。它会影响到你的颈部曲线、温度和舒适度。选择自己认为较舒适的乳胶枕、荞麦枕等都可以。\n  - 研究人员发现，毛毯的重量模仿了被拥抱和被抚摸的感觉，因此加重的毛毯可以帮助身体放松，从而获得更好的睡眠。重量大致在6-8kg。这个重量也是因人而异，大家可以自行决定。\n\
    \n- 使用舒缓的音乐助眠\n  - 摇篮曲不仅仅适合婴儿，对成年人也很重要。每天晚上睡觉前使用舒缓的音乐放松，可以有助于减少入睡时间和提高睡眠质量，也是心理学和医学临床上常用的一种治疗方法。\n\
    \  - 临床实践中，通常是2-30周以上的持续聆听会使整体睡眠状态有所改善。大多数研究者选取古典音乐用于治疗失眠，如勃拉姆斯的《摇篮曲》，海顿的《小夜曲》，《卡农》等。国内一些研究者也探索了古筝音乐改善失眠的效用，结果良好。\n\
    \n![](img/79b24bd82f8f06095d6257183599b89a_2_0.png)\n\n### 调整睡前习惯\n\n- 注意睡前饮食\n\
    \  - 睡前吃的东西会影响我们的睡眠。高碳水化合物的饮食可能不利于晚上的良好休息。\n  - 研究表明，即使高碳水化合物饮食可以让人更快入睡，但它不会是宁静的睡眠。相反，高脂肪的食物可以促进更深层和更宁静的睡眠，不过出于健康的考虑，也要注意高脂肪食物的摄入量，可以在晚餐适当增加果蔬、坚果、豆类的摄入量以及补充一些鱼类和瘦肉动物蛋白。\n\
    \  - 如果仍然想要吃一顿高碳水化合物的晚餐，那我们应该至少在睡前4小时吃，这样身体就有足够的时间来消化它。\n\n- 避免睡前剧烈运动\n  - 人们通常认为体育活动有益于健康的睡眠。的确锻炼可以增加大脑中血清素的产生，降低压力荷尔蒙皮质醇的水平，从而延长睡眠时间，提高睡眠质量。\n\
    \  - 但是需要注意的是我们要保持一个中等强度的日常锻炼，过度训练适得其反。\n  - 每天的训练时间也很重要，早上进行中等高强度的运动确实可以显著改善睡眠质量，但是睡前3-4个小时（如晚上7-8点钟）应及时结束锻炼，保证身体有时间安静下来，帮助我们入睡。\n\
    \n- 及时关闭电子设备\n  - 深夜使用电子设备严重影响睡眠。看电视、玩视频游戏、使用手机和社交网络会让我们更加难以入睡。\n  - 这主要是由于电子设备中发射出来的光特别是蓝光会严重影响身体分泌褪黑素，从而导致入睡困难。\n\
    \  - 此外，收到电子设备中的内容刺激，大脑也会长时间处于活跃状态而难以平静，同样会导致我们难以入睡。\n  - 因此睡前半小时，尽量避免使用电子设备，特别是深夜睡不着时，最好忍住拿起手机刷一下社交媒体/开一局游戏的冲动\
    \ : P\n\n- 睡前进行纸质阅读\n  - 阅读是一种很好的活动，可以帮助我们在睡前放松。\n  - 但是不建议大家使用Kindle等设备进行电子书阅读，虽然电子书在众多移动设备中已经算是对眼睛最友好的了，但是其发出的背光也会影响到身体中褪黑素的分泌，导致入睡困难，睡眠质量变差。\n\
    \  - 因此建议大家如果在睡前有阅读的习惯或者需求，尽量阅读纸质书。\n\n### 睡不着时的调节方法\n\n如果感觉自己睡不着：\n\n- 千万别看时间\n\
    \  - 如果在睡觉的时候感觉自己迟迟不能入睡，许多人会习惯性地看一眼时间。这样做很容易加剧我们的焦虑情绪，特别是明天早上有事情需要早起的时候。一再地关注时间，会导致越看越慌，越来越睡不着……\n\
    \  - 而且我们现在看时间多用的是手机等电子设备，突然的强光会导致大脑活跃度提升，使得入睡更加困难。\n  - 因此，在这里建议大家感觉自己迟迟睡不着的时候，一定不要去w看时间，可以主动采用下面介绍的方法，慢慢调节，放松精神状态。\n\
    \n- “4-7-8练习”呼吸法\n  - 英国《独立报》日前推荐了哈佛博士安德鲁·韦尔的一分钟“呼吸练习”，每天两次，每次60秒的练习，可以帮助人们减少紧张的情绪，还有助于睡眠。\n\
    \  - 首先，挺直背部坐好。\n  - 第一步，用嘴呼气，发出舒气的声音。\n  - 第二步，闭上嘴巴，用鼻子吸气，同时心里从“1”暗数到“4”。\n \
    \ - 第三步，屏住呼吸，默念至“7”。\n  - 第四步，用嘴呼气，默念至“8”。\n  - 第五步，重复上述步骤，再吸气，呼气……一共做4次。\n  -\
    \ 在做练习的时候，要保证吸气时完全通过鼻子，而呼气时则完全通过嘴，舌头应该一直保持在固定的位置。记住，呼气的时间要两倍于吸气的时间，每一个动作的长度并不固定，但是要记住时长的比例要保证在4-7-8。这套动作最重要的部分是呼气，一开始可能做不好，但是坚持6-8周后就能熟练掌握。\n\
    \  - 个人经验：大家不要特别纠结于数字，不必纠结于是数到7还是数到8，关键是要把注意力集中在自己的呼吸上，慢慢地放松身心，这样就可以更加快速的进入睡眠。\n\
    \n- 进行放松大脑的思考\n  - 睡不着的时候，我们可以尝试着主动引导大脑往舒适、放松的方向上思考：\n    1. 幻想这是一个温暖的春日，而且你正躺在一个非常宁静的湖上独木舟里。你正在仰望蓝天与云朵，浮动的云彩。不要有任何其他想法。只要专注于个画面十秒钟。\n\
    \    2. 想象你正躺在一个黑色天鹅绒大床上，而且房子的其他地方都是黑色的，专注这个画面十秒钟。\n    3. 在脑海中说“不要想、不要想、不要想……”，持续十秒钟，消除其他想法。\n\
    \n### 个人经验和小偏方\n\n- 佩戴耳塞、降噪耳机\n  - 耳塞的主要作用是隔绝周围环境中的嘈杂的声音。\n  - 同样，降噪耳机也会有着类似的作用，但与耳塞相比，降噪耳机还有着一个不可比拟的优势———在隔绝噪声的同时播放一些有助于睡眠的舒缓的音乐。\n\
    \  - 耳塞我比较常用的牌子是安耳悠，其他的牌子使用的效果差不多，大家选择自己喜欢的就好。\n  - 降噪耳机从舒适度和使用体验的角度会比较推荐大家使用真无线蓝牙耳机，如BOSE的降噪耳机和苹果的AirPods\
    \ Pro。大家在选用的时候最好考虑到侧睡时的舒适情况。如果习惯平躺着睡，BOSE的QC系列也是很好的选择，佩戴非常舒适。\n\n- 听新闻类、历史知识类节目入睡\n\
    \  - 这个方法是我自己的偏方，对我个人比较有用，但是弊端也非常的明显，建议大家谨慎使用。\n  - 先说弊端，聆听该类节目可能会占用部分大脑精力，如果注意力被内容吸引走，很容易加剧入睡困难。\n\
    \  - 再说优势，可以放松身心。一般来说听新闻类、历史知识类节目的主播或者主讲人，播报、演讲的情绪会比较平和，节奏较为事宜，声音比较利听。\n  - 在入睡困难的时候，大脑通常比较活跃，容易胡思乱想，东想想西，此时听一些舒缓的音频节目，可以适当约束一下思维，将注意力放在一些更加宏观、更加厚重的事物上，对睡眠有一定的帮助。这也是节目类型选择新闻类和历史知识类的原因。\n\
    \  - 这个方法可以和真无线降噪耳机结合起来，一边降噪，一边听节目。\n  - 听的节目最好是可以连续播放的，不然还需要重新拿起手机翻选节目，就适得其反了。\n\
    \  - 可以使用的APP有喜马拉雅、BILIBILI等音频、视频流播放软件。\n\n- 佩戴蒸汽眼罩\n  - 蒸汽眼罩一方面可以当眼罩来用，在亮光的环境里，首先保证眼睛不会受到光线的照射，改善睡眠环境。\n\
    \  - 另一方面，蒸汽眼罩在使用的时候会散发出微微的热量，有着很好的放松面部肌肉的作用，同时也可以帮助我们适当地放松精神状态。\n  - 蒸汽眼罩我只用过珍视明，效果不错，还含有微微的香薰，其他牌子应该效果相近，大家根据自己的喜好选择就好。\n\
    \n![](img/79b24bd82f8f06095d6257183599b89a_5_0.png)\n\n## 2. 褪黑素对比与选择\n\n### 褪黑素及相关产品\n\
    \n- 需要注意的是，滥用褪黑素对身体是有危害的，除非是十分必要的情况，否则不建议长期服用褪黑素来缓解入睡困难。\n- 褪黑素是一种诱导自然睡眠的体内激素，它通过调节人的自然睡眠而克服睡眠障碍，提高睡眠质量；也适合在进行了国际长途差旅后，用以调整时差。\n\
    - 因此，在入睡困难比较严重或是倒时差比较困难的时候，除了遵从医嘱选择适量服用安眠药以外，也会有人选择服用一些褪黑素，来帮助入睡；但是滥用褪黑素可能会加剧身体负担，影响激素分泌等。\n\
    \n### 汤臣倍健褪黑素片\n\n- 汤臣倍健褪黑素单片中褪黑素含量约为2 mg。\n- 对于初次尝试的人群来说，含量比较适宜；是京东上销量最大的褪黑素产品。\n\
    - 此外这个产品也有小瓶装、差旅装，对于初试者来说比较方便。\n- 自己的使用感受：助眠效果8分；使用的时候需要用水送服；小瓶装只有30片，在保质期内基本上可以用完，不会浪费。\n\
    \n![](img/79b24bd82f8f06095d6257183599b89a_6_0.png)\n\n### Schiff Melatonin\n\n\
    - 在美的朋友推荐的一款褪黑素，单片含量为3 mg。\n- 国内电商网站暂时无法购买到，需要使用美国代购。\n- 对于初试者来说，建议将一片掰开服用，即每次服用1.5\
    \ mg，药片为长条状，比较好掰。\n- 自己的使用感受：助眠效果9分；使用的时候需要用水送服；起效过程偏快；图2为我购买过的一款，单瓶容量很大，有365片，很难在保质期内服用完；该品牌下的普通装，单瓶50片，如果有购买的需求，建议购买普通装。\n\
    \n![](img/79b24bd82f8f06095d6257183599b89a_6_1.png)\n\n### Vitafusion褪黑素软糖\n\n\
    ![](img/79b24bd82f8f06095d6257183599b89a_7_0.png)\n\n- Vitafusion褪黑素软糖单粒中褪黑素含量约为2.5\
    \ mg（瓶身上标注每两粒 5 mg）。\n- 和其他的褪黑素产品不同，该款产品将药片做成了软糖，可以直接口嚼服用，味道甜甜的，口味上和普通软糖没有什么明显区别。\n\
    - 单粒褪黑素含量较高，不大建议轻度睡眠困难的人群选择这款。\n- 自己的使用感受：助眠效果9分；起效过程非常快；但是由于是软糖，吃完以后嘴里会甜甜的，有糖分残留，需要重新刷牙；图3为我最后购买过的一款，单瓶有90粒，目前还没有吃完；如果有购买需求，推荐购买同一品牌下单粒含量约为1.5\
    \ mg（瓶身上标注每两粒 3 mg）的那一款，单瓶仅有60粒，不容易造成浪费。\n\n### 写在褪黑素最后\n\n- 到目前为止，少量服用褪黑素的负面影响尚无论证，但是滥用褪黑素对于人体会造成伤害几乎已经成为了医学界的共识。\n\
    - 所以我更推荐大家将褪黑素看成是一种没有办法的办法。在迫不得已的情况下，为保证自己能及时入睡，保证第二天有精力开展工作，才选择去服用的东西。**切记不要长时间大量服用**。\n\
