    # 《模型思考者》12：路径依赖


    万维钢 · 精英日课³

    今天


    进入课程 ›


    《模型思考者》12：路径依赖

    12:07 11.1 MB


    【转载：侃沙】


    咱们继续讲《模型思考者》。这一讲我们用数学模型来描写一下什么叫“路径依赖”。


    你肯定经常听说“路径依赖”这个词。它的意思是说一件事所以是现在这个样子，很多情况下并不是因为它就*应该*是这样，不是它“注定”是这样，而是历史上的一些偶然的原因导致它是这样。路径依赖这个概念，能让你有一个更清晰的历史观，而且还可能提醒你在命运转折的关键时刻谨慎行事。


    世界上的很多事情是有道理而且有规律的。一个聪明学生发奋努力学习，就能取得好成绩；一个政府无节制地盘剥人民，人民就会不满；一个公司招揽到第一流的人才，就可能做出第一流的创新。我们在讲牛尔夫可夫模型的时候，也说过像宿命论一样的规律。


    而大多数事情则属于偶然和随意的选择，发生没发生都不重要。你今天穿什么颜色的衣服，上班路上遇到什么情况迟到了，包括小孩上学的学校好一点还是差一点，甚至包括买彩票中了百万大奖，可能你当时以为很重重要，其实没多大影响，都会归回均值。


    但是也有一些当时看起来很小的偶然事件，在历史上导致了重大差别。比如你二十年前在一个很随意的场合认识了一个叫马云的人，他邀请你加入一个叫做“阿里巴巴”的公司。你认为他说的不怎么靠谱，但是这位挺有意思，你一念之间，就答应了……就好像有些人考大学就差一分，此后的人生遭遇可能就很不一样。


    # 1.模型


    用数学语言来说，所谓路径依赖，就是过去发生的事件，会改变未来事件发生的概率。


    我们先说一种“良性”的偶然，也就是不会导致路径依赖的偶然性。我们设想有一个不透明的罐子，里面装了很少小球。每个球的大小和质地完全相同，只是颜色可以不同，有黑球和白球。我们设想的操作是你每次从罐子里摸出一个球，看看是什么颜色，做好记录，然后再把这个球扔回罐子里去——这个罐子，叫做“伯努利罐”，以概率论的祖师爷雅各布·伯努利的名字命名。


    # 2.应用


    提到路径依赖，人们最先想到一个例子就是现在都在用的QWERTY键盘。有个说法认为这种键盘的字母排列布局其实是不合理的，当初的人之所以把键盘设计成这个样子，是为了降低人们的打字速度，防止老式打字机的键盘撞在一起卡壳。


    # 3.路径很长


    就像键盘布局这种一旦定终生的路径依赖事件其实并不常见。我们考察波利亚罐这个模型，摸球可不是摸一次就定了——路径依赖通常还是需要若干个关键事件的共同作用才会形成。'
