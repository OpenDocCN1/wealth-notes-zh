    历史总是在重复，但是重复的程度应该是不同的吧，有时候重复的轻一些有时...这是是否一个无解的怪圈呢？


    万维钢

    曾经有很多多人试图找到历史治乱循环的规律。...人们基本拿他当“民间科学家”一样看待，一提他都是当反例。


    ......但这样的解释也是过于简单的。真实历史总是同时有很多因素在起作用...到底哪个过程占上风，是事先无法预测的。


    ## 来自日课：骄孔的阈值


    ### 读者 Wenting ⁺²：


    这种制造“人带人混乱”的“能力”，是否可以用来打着爆款产品......这种滚雪球效应会自动发生，让更多高阈值的人被最终吸引进来。


