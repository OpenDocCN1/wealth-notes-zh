    # 来自日课：深度对广度


    # 读者 康寒：


    这次课让我想起了《反脆弱》提到的领域依赖，即在某一领域体某一种观点，在其他领域却全然忽略了。专才与通才、 全才的区别之一会不会是专才陷入领域依赖，而通才全才跳出了呢？还是说我对领域依赖的理解是错的呢？


    你的理解完全正确。是的，通才的好处一个是匹配质量高，选择了自己喜欢的事情；另一个好处就是能把一个领域的方法用于另一个领域。而专才因为只知道自己的一个领域，就没有这个迁移知识的能力，陷入了塔勒布说的领域依赖（domain
    dependence）。塔勒布举过的一个例子就是他当年在沃顿学期权公式时候的那个教授，他只知道期权是个金融概念，而不知道期权的本质是什么。


    不过我们这里说的只是能力问题，塔勒布说的领域依赖有时侯还 hermore 带有品质方面的批评，形容一个人没有做到知行合一，有点虚伪而不自知。


    比如塔勒布有一次在迪拜某酒店看到一个人，是个像模像样的银行家，自己不拎行李让酒店服务员替他拿。后来塔勒布在酒店健身房又看到这个人，像模像样的正在举铁。


    这个人显然把锻炼当成了一个行为艺术，充满仪式感——如果你真的很锻炼，自己拎行李是个接地气的好习惯。


    # 来自日课：工匠和学者


    # 读者 晓添才：


    现在的医院好像全科医生的地位没有专科医生高，好像全科医生都是专科淘汰下来的，听了今天的内容，是不是全科医生应该让水平最高的人来做呢？那样反而可以提升医疗水平？


    万维钢


    不是的。全科医生并不是能治所有病的医生，我理解他们的作用是处理常见的小毛病，搞搞体检，给病人提出医疗方面的建议，然后遇到严重疾病指引病人去找专科医生。现代医学实在太专业了，高超的技艺需要多年的训练，我们不能把一个肿瘤医生的宝贵时间用在给人看感冒上。


    现在人们对医学过度专业化的担心，的确有头痛医头脚痛医脚的毛病。最好的办法是以患者为中心，成立一个专家小组，制定综合的治疗方案……但这并不是说应该由全科医生来做这件事，最好还是专科医生能够对临近的领域有所了解，能够有点全局思维。


