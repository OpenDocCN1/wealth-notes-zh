    ## 《模型思考者》8：骚乱的阈值


    万维钢 · 精英日课³ 今天 进入课程 >


    《模型思考者》：骚乱的阈值 11:46 8.08 MB | 纪录：疝沙 |


    我上初中的时候做过一件不寻常的事。下午上课容易犯困，有些同学就会在课堂上睡觉得了。有一天老师提出一个新规矩，说如果你困了，可以站起来听课。我觉得这个规矩很有意思。第二天中午吃饭的时候，我和几个同学说了一个大胆的想法。


    下午的课开始，班长喊了起立、敬礼，全班一起说了“老师好”之后，我和另一个男同学，就没有坐下。


    老师说你俩为什么不坐下，我们说怕犯困。老师说还有哪些同学怕犯困，也可以站起来。结果真的又有几个同学站了起来。老师可能也感到有点意外，说你们都出去听课吧。于是我们大概五六个人，都离开座位去了教室外面。


    老师可能没遇到过这样的情况有点措手不及，又补了一句，说还有谁困了，可以和他们一起出去！结果这句话说完，全班大部分男生都走出来了。


    老师一看这样也不行，就把我们都叫回教室里坐着听课。


    那时候的我非常不懂事。现在回想起来，我好像是领导了一起骚乱。


    今天咱们继续讲斯科特·佩奇的《模型思考者》这本书。这讲的主题是阈值模型。


    ### 1.骚乱的模型


    像街头骚乱、足球流氓闹事和示威游行这种事情，大部分参与者都有一种从众心理。有些人真是唯恐天下不乱。有些人可能有想法但是不敢干，得别人干了了他才会干。还有更多的人，是本来没想法，是看到很多人参与了，他跟风参与。


    据此，社会学家马克·格兰诺维特（Mark Granovetter）——就是以发明了“弱联系”这个概念而名的那个社会学家——提出了一个带阈值的骚乱模型。这个模型说每个人都有一个参与骚乱的阈值。比如我的阈值是100，那就就是说我当时仅当看到街上已经有至少100个人参与，我就参与。


    那么根据这个模型，我们设想有一千个人可能会参与骚乱，看看是什么样的情形。咱们考虑三种情况。


    第一种情况是每个人的阈值都是10，也就是每个人都需要等到街上已有至少10个人参加骚乱才参加——可因为每个人的阈值都是10，就没人带头，结果骚乱就不会发生。


    第二种情况，有5个人的阈值是0，有10个人的阈值是1，其余所有人的阈值都是20。开始就会有5个人站出来，另外10个人看到已经站出来的5个人，也会参与进来。可是这15个人之后，就没有第16个人加入了，因为剩下的所有人阈值都是20！骚乱也不会发生。


    第三种情况，这一千人的阈值分别是0、1、2、3……一直到999。那么第一个人会站出来，第二个人看到第一个人站出来，也会跟着站出来……以此类推，所有人都会参与到骚乱之中。


    这三种情况的推演，告诉我们几个道理。


    首先，骚乱是否发生，并不仅仅是由所有人的平均阈值决定的，而是由阈值的具体分布情况决定的。第一种情况每个人的阈值都是10，这个阈值很低，可以说大家都有相当强的骚乱意愿，但就因为缺少10个带头的人，骚乱就没有发生。而第三种情况绝大多数人的阈值都很高，可以说大部分人都是老实人，但恰恰因为其中有带头险、有早期就追随的，骚乱反而发生了。


    所以第二个道理就是你很难预测一场骚乱是否会发生。骚乱具有偶然性。


    而最关键的道理，当然是领头的人非常重要。你要想防止骚乱，最首先的就是要打击带头的，看谁想出头就赶紧把他摁住……


    这个原理很有普遍意义。比如我们听领导做个报告，其实讲得也不怎么样，为啥时不时总有热烈的掌声呢？关键得有人带头鼓掌。鼓掌是一个非常社会化、非常从众的活动，类似于骚乱。


    再比如去年在全球发生的MeToo运动。本来让一个女性站出来说自己被性骚扰，是非常困难的事情——但有些人率先站出来了，有些人跟进，它的就成了一场运动，进而成了一个时尚话题。再比如人们对同性婚姻的态度转变、流行时尚、比特币、金融泡沫，都都有这样的特点。


    阈值模型告诉我们骚乱具有不确定性和不可控性。有时候你不想要骚乱可是骚乱发生了，有时候你想要骚乱可是发生不了。


    ### 2.双骚乱模型


    比发起一场骚乱更难的，是发起两场骚乱。


    有个公司叫Airbnb，它的业务是共享住房。比如你在杭州有一套短期空闲的房子，你可以在Airbnb上发个广告，临时租给游客住几天。而这个业务能建立起来，非常困难。


    想让游客能想起来到你这个网站上查询有没有空房，首先你的网站上得有大量的租房信息才行……可是想让出房主愿意到网站上来发布出租信息，他们得首先看到网站上有大量的游客才行。那到底是先有游客，还是先有信息呢？


    我们专栏以前讲过尤德考斯基的《不充分均衡》这本书 [1]，其中有一个概念叫“两因素”均衡：必须同时满足两个因素，这个均衡市场才能建立起来。这样的均衡特别难建立，但是一旦建立起来也特别难以被撼动。


    Airbnb 曾经失败过两次。最后成功的办法是公司派人挨家挨户去找有空房的人，帮这些人制作租房信息。有了信息，还得再做广告，才能吸引到游客来看信息。你得做这么多前期的工作，业务才有可能开展起来——第一波参加骚乱的人，比第一桶米还难得唷。


    这就叫“双骚乱模型”。由此我就想，罗胖能够把知识服务这个行业做起来，也是一个奇迹。咱们就拿写专栏为例，要让读者愿意付费订阅一个专栏，专栏作家必须做出一个承诺，说我一年会更新多少篇文字。可是专栏作家要做这个承诺，首先得真有很多会订阅才行。如果只有两百个人订阅，你这一年的劳动就是不值得的。那到底是先有读者，还是先有作者呢？这就解释了为什么只有罗辑思维能把这件事做好：罗胖是已经有了一个知识社区，早已聚集了中国最愿意学习的读者。


    社会现象有时候是很神奇的。我们专栏的老朋友、博弈论专家托马斯·谢林，也贡献了两个有意思的阈值模型。


    ### 3.隔离模型


    观察现在的美国社会，一方面种族平等是绝对的政治正确，谁也不能敢歧视；可是另一方面，黑人和白人常常是居住在不同的社区，可以说有个事实上的种族隔离。托马斯·谢林用数学模型说明，哪怕人们本来没有种族隔离的意愿，哪怕人都是很包容的，一群人也会形成事实上的隔离。这是因为呢？


    咱们考虑这么一个局面。现在有两个紧挨着的房间，中间有一道门，一群人正在这两个房间里开party。我们假设这一群人是20个男性和20个女性。大家都是思想开放的人，没有什么性别隔离的意识，都既可以和同性也可以和异性在一起聊天。我们还设定，人们可以自由地在两个房间来回走动。


    开放是开放，我们假设人们还是有一定性别阈值。比如说我作为一个男性，本来是和男女都能聊，但是如果我发现这个房间里除了我之外都是女性，我就会觉得这样的局面有点怪，我就会想要跑到另外一个房间去——我不想成为绝对的少数派，这个要求不过分吧？


    开始两边的房间都是有男有女，人们在两个房间之间随机地走来走去。既然是随机的，只要经过足够长的时间，某个房间里的人数，就会出现一个临界状态。


    比如说，一个房间中现有14个男性和2个女性。我们可以想象，这时候如果其中一个女性离开房间，剩下的那个女性也会离开这个房间，使得房间里只剩下男性。然后另一个房间里的男性作为少数派也会很愿意过来。这就出现了事实上的性别隔离。


    这个故事听起来有点怪，但是生活中就真的有这样的事情，比如说职业选择。可能本来男性并不排斥去做一个护士或者幼儿园老师，但是当他发现从事这两个职业的绝对多数都是女性的时候，他大概也会选择别的职业。这里面没有任何性别歧视！只是一个阈值问题。


    谢林的另一个模型能解释为什么总是黑人同黑人一起住、白人同白人一起住。我们设想一开始大家都是混合居住的，并没有歧视偏见。


    但是种族毕竟是个客观存在的现象，人很难免会对自己同种族的人有一种亲近感。如果你是个白人，你可能不介意旁边有个邻居是黑人——但是你可能也不希望周围全是黑人。你会有阈值，希望自己家四周至少有一家或者两家是同种族的人，这个要求不过分吧？


    而计算机模拟表明，如果人们因为这么简单的原因而搬家，几轮之后，就会形成黑人和黑人一起住，白人和白人一起住的局面。


