    # 《历史的正确一侧》9：美左和美国


    万维钢·精英日课³

    今天

    进入课程 >


    《历史的正确一侧》9：美左。 12:08 11.11 MB


    今天我们把本·夏皮罗的《历史的正确一侧》这本书讲完，这一讲的主题是当今的美国。


    我们知道美国有民主党和共和党，两党的理念分别是自由主义和保守主义。自由主义者强调结果公平，讲关爱，呼吁更多的社会福利；保守主义者强调起点公平，讲奋斗，希望美国人保持自立自强的传统。这两种理念其实谈不上对错，如果大家的共同目标都是希望国家能更好，然后对客观事实有个基本判断，这个分歧无非就是视角和解决方法的差别——就如同教育孩子，父母二人的方法法定有差别，但是不会有本质矛盾，都是为了孩子好。


    而现在美国的情况并非如此。两党支持者严重分裂，社会分歧越来越大。在中国人聚焦会神搞经济建设的这个时刻，很多美国人追求的是别的。特别有一群极端的自由主义者，中国人称之为“白左”，他们的所作所为、言论和思想，好像有点不可理喻。


    当今美国社会的矛盾是什么？白左到底想要什么呢？


    # 1.左派的基因


    二战结束之后，欧洲人几乎于脆就放弃了宗教传统，而美国国内没有经历什么战乱，去教会的人仍然很多，传统价值观也保留下来了。


    传统观念并没有阻碍美国社会进步，而且可能还促进了进步。从1950到1960年代，美国的经济增长就不用说了，在社会方面，很多黑人进入了专业工作领域，成了律师和医生，美国有一个黑人的中产阶层。美国女性参加工作的比率提高了一倍，达到三分之一。美国人的文化生活也在进步，比如越来越多的能欣赏严肃音乐。


    但是美国左派，对这些成就非常不满意。


    到底怎么叫“左派”呢？不满意才是真左派。左派，必须得是“革命派”。这个世界上有压迫！人民在受苦！而我为了解救人民，就必须推翻这个人压迫人的制度——在美国左派看来，资本主义制度就是这个人压迫人的制度。


    过去的左派主张暴力革命，这条路现在看来是不行了。美国新左派起源于我们上一讲说的存在主义思潮，现在的斗争方法主要是要维护那些被压迫的人们的权益。这些被压迫的人包括黑人、女性，最近又加上了同性恋者和变性人等等。而这场斗争背后，还有一个更底层的逻辑。


    那就是“个人自豪感”。


    # 2.自尊、自豪和自恋


    我们通常把 “self-esteem” 这个词翻译成“自尊”，但我觉得它的意思更接近于“自豪”。自尊是最起码的尊严，自豪则是自己认为自己很厉害。


    美国六七十年代有一场自豪感运动。这个思想最早起源于马斯洛说的“自我实现”，但马斯洛本来意思是说你得通过奋斗，有所成就，才算自我实现——而自豪感运动认为人天生就应该为自己感到自豪。


    最早是一个教育学家的学说。他认为以往那种对孩子严格要求的做法是不对的，动不动就批评和惩罚，这都会给孩子带来不安感，让孩子焦虑，这不是扭曲人性吗？我们应该让孩子自由成长，让他们学会遵从自己的想法，想做什么就让他做什么。


    这个观点其实有道理。传统的压迫式教育确实有问题，每个人的确有自己的特长，应该自由发展。但美国这场自豪感运动则是把传统的那个对个人努力的要求也当成了压迫！社会欠每个人一个自尊！你不需要成为任何别人，你要做的就是你自己！


    这可不是咱们中国人爱说的“做更好的自己”，这是要做“自己”——你自己就是最好的！美国文化现在仍然在宣扬这个思想，动不动就是“每个人都是特殊的”、“爱自己”、比如《冰雪奇缘》的主題歌说要“没有对错/没有规则/我是自由的/Let
    it go…… ”


    按咱们中国人的常识判断，如果你像 Elsa 一样有超能力，你“做自己”是自豪感；可你要什么能力都没有，这不是自恋吗？事实上很多研究都证明这个“自豪感”教育并没有什么好效果，幻想出来的自豪不会带来真正的成就。


    我们现在听自豪感运动可能感觉很西方，但是“自豪感”跟西方传统价值观其实是不兼容的。上帝是让你做他想让你做的事，并不在乎你想干什么。雅典哲学家说要用理性完善自我，而理性是客观的，对就是对，错就是错。资本主义制度关心的是你能为别人做什么，而不是你*是*什么。


    那么在新左派看来，这些当然就是压迫。


    # 3.身份政治


    美国上世纪五六十年代发生的民权运动和女权运动是真正的进步运动。以前社会上对黑人和女性有体制化的歧视，比如有些地方不让黑人进入，有些工作不让女性参加，而这些歧视现在都已经没有了。


    但是新左派认为，去掉的只是有形的歧视，还有很多无形的歧视，仍然在压迫人民，不让人民做真正的自己，所以必须被打破。新左派，正在向社会传统习俗开战。


    比如我是一位女性。虽然生理上是女性，但是我很喜欢工程学，我想做个工程师。那你就去做呗？新女权主义者认为还不行。现在整个社会对女性的预期就是好好照顾家庭、生孩子带孩子，不要出去工作——在这样的社会里我能自由追求梦想吗？为了防止社会压迫女性，我们应该禁止女性在家带孩子！


    用中国话说这就是“矫枉必须过正”。再进一步，新左派认为让那些受迫害的群体跟特权群体公平竞争，本身就是不公平的。女性从小生活在“女生数学不如男生好”的文化环境中，你能让她长大以后跟男性公平竞争吗？黑人从小就生活在因歧视而导致的贫困的环境中，你能要求他有跟白人一样的成绩吗？


    这些想法不能说没有道理，但是新左派把这一套发展成了“身份政治”。你是什么身份，你身上有哪些标签，决定了你的受迫害程度。


    比如如果你是一名黑人女性，同时还是个同性恋者和穆斯林，那主流社会对你的压迫就太严重了，现在就应该重点照顾你，你说的话就特别有分量。反过来如果你是一个白人直男基督徒，那么我们就要让你认识到，你享有的特权太多了。


    身份政治实际上要求按照人的身份给予补偿——但是不能直接这么说，得说“多样性”。多样性是当今美国的政治正确。美国自然科学基金（NSF）发放研究经费并不只看科学家的能力如何，还要看他是哪个族裔的，黑人和女性科学家会优先得到经费。人们甚至要求各大学的物理系录取研究生不要再看GRE物理专项的考试成绩了，因为女生在这项考试上表现不佳。美国的医学院本来有个标准化的MCAT考试，现在为了照顾黑人也不作为严格录取标准了。


    而如果你说这不对，我们应该看能力不应该看身份，那么你就可能被当成种族歧视者，甚至说是纳粹。在当前的言论氛围之下，连科学都不好使了。比如下面这三件事是有科研证据的，但是你不能说出来——第一，单亲妈妈带的孩子，面临一个不利的成长环境。可能是因为缺少父爱，可能是因为妈妈一个人照顾不过来疏于管教，总之是因为单亲——而不是因为肤色，影响了孩子的成长。这个效应对所有种族都成立。那么黑人小孩之所以学习不好，可能有一部分原因是由于黑人男性对家庭不负责任，黑人单亲家庭特别多，而不完全是因为社会歧视黑人……


    第二，虽然智商不完全是遗传的，但是有一定的遗传因素，所以黑人整体的智商会略差一点……


    第三，男女的确存在生理差别，这就导致了有些工作的确比较适合男性，而这些工作给的工资也比较高……


    哪个教授敢强调这三件事，他就会被说成是种族主义者和性别歧视者。这是禁忌话题。'
