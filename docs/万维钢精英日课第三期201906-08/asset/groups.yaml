    ## 《生活黑客》2：高效能人士的一个习惯


    万维钢·精英日课³

    今天


    《生活黑客》2: 高效能人士。 11:54 8.17 MB


    哈们继续讲里吉尔的《生活黑客》这本书，这一讲的主题是时间管理。


    你想不想做个特别有效率的人？你不想完成更多的工作？你想不想每天比别人多出几个小时来？时间管理是生活黑客的热门领域。你想必已经听说过一些时间管理的方法，比如GTD、“高效能人士的七个习惯”、“每周工作4小时”之类，这一讲我们要对这些方法做一些评价。


    时间管理是个非常现代的概念。你想到要时间管理，你就是在自己管理自己——而以前的人大多都是“被管理”。自己管理自己是自由，但更是挑战：如果没人告诉你现在该干什么，你现在该干什么呢？


    这个问题解决方案，现在已经是一个巨大的产业。有书籍，有讲座，有培训班，有管理咨询师身教教练，有手机APP，人们发明了无数的方法和工具，帮你提升工作效率。早在好多年前，那时候智能手机还没有那么普及，我看看网上有什么合适的GTD工具，一下子就找到了超过100种！


    那么问题就来了，这些方法都有用吗？里吉尔不是一个“管理咨询大师”，而是一个学者。他做了一些中肯的调研，使得我们可以理清思路。


    这一讲我们要说三个时间管理方法：一个有效的方法，一个无效的方法，和一个真正有效的方法。


    ### 1.心止如水和要事优先


    如果我要做的就是这么多事，拥有的就是这么多时间，那我做就是了，为啥还需要什么“GTD”之类的工具去“管理”呢？


    时间管理最基本的理论基础，是一个叫做“蔡格尼克效应（Zeigarnik effect）”的心理学效应。这个效应是说，没有完成的任务，会给我们带来精神压力。比如你有一个今天一定要做完的作业，同时你还想看个其实不看也行的电影，那你就应该先把作业写完，再看电影。否则“作业还没有写完”这个想法就会一直困扰你，让你无法放松心情，看电影也看不痛快。而要你有一大堆尚未完成的任务，你就会心烦意乱三七落四。


    这就是戴维·艾伦（David Allen）发明的GTD —— Getting Things Done —— 系统的精髓：Done。把这个任务做完，done了，你就不用想它了。不用想是目的，done是手段。


    可是任务太多做不过来怎么办呢？GTD要求你用一个*外部系统*去记录在什么时候、什么场合要做什么事情，而不要用自己的脑子记。脑子是用来想事的，不是用来记事儿的。有了可靠的任务记录系统，你就可以在任何时候都不用担心自己还有哪些该做的事儿没有做，你就达到了心止如水的境界，你就可以好好享受工作本身，你的效率就会提高。


    ### 2.多相睡眠


    一般人每天睡8小时，就只能有16个小时的清醒时间。如果你希望多几个小时工作，唯一的办法就是少睡几个小时。费里斯在《每周工作4小时》这本书感叹，长颈鹿每天只睡1.9个小时，为啥人就非得睡8个小时呢？


    其实咱 Rubber Duck 想， 每天连续睡眠8小时，这也不一定就科学。人们千百年来都是晚上睡觉，那是因为晚上没有阳光。现在有了人工照明，我们完全可以“黑进”睡眠系统。


    ### 3.外包


    任务列表不能解决大问题，多阶段睡眠也省不了多少时间，所以这个事实是，你根本就不应该指望有什么“时间管理法”能让自己以一当十。


    要想真把效率提高十倍，你只有一个办法。那就是请别人帮你做事。


    我看这才是“高效能人士”的真正习惯。不过生活黑客是新时期的高效能人士，他们使用一些新概念来说这件事儿。蒂姆·费里斯在《每周工作4小时》这本书里用的词是“被动收入（passive
    income）”和“外包（outsource）”——你要把工作外包给别人去做，这样你就可以享受不用自己动手被动收入了。


    欢搜索哪些关键词，这些关键词可以带来很好的广告收益。但是其中有很多词，网上并没有很好的匹配内容。你可以做个网站，花钱请人专门为这些关键词去创作内容，你就会获得广告流量和被动收入。


    当然包括费里斯在内，谁做这个都不可能每周真的只工作4小时，你要做很多网站推广之类工作。但是被动收入的确是可以实现的，而且这个做法似乎比收房租还是高级一些。


    现在有些网站允许你把一部分个人生活琐事外包出去，像订机票、给信用卡公司打电话之类的事情，都可以在网上找个印度或者菲律宾的助手帮你做。上面说的那个做关键词网站的老兄，以每小时
    2 美元的工资雇了一个菲律宾人，工作内容是每天 10点准时打电话提醒他用牙线剔牙……有一次菲律宾发生飓风，网断了，那个人特意跑了 8 英里给他打电话。这人还用每小时
    8 美元雇了一个真实的女孩跟他一起工作，女孩可以做自己的事情，唯一的任务是看见他不做正事就提醒他，不听就打他一个耳光……


    所以说人，那是真的很有用。


    但是里吉尔说，这里里面似乎有个道德问题。你是高效能了，可是别人怎么算呢？历史上所有高效能人士的所谓高效能其实都是建立在别人的付出之上：包括时间管理的祖师爷本杰明·富兰克林，当初之所以那么高效，也是因为他的妻子和他的奴隶们在默默地帮他。


    这公平吗？你说做饭太浪费时间了，所以我都是叫外卖，你看我效率多高 —— 但你这其实有点作弊的嫌疑，你购买了外卖送餐员的时间！你有这个用钱换时间的选择，他可没有。那这又有什么了不起的呢？这哪里是黑客精神呢？


    所谓 GTD、所谓“高效能人士的七个习惯”，都有一个隐藏的假定，那就是你自己完全掌控自己的工作和生活 —— 你不但几乎不受别人指挥，而且可以指挥别人。


    君子生非异也，善假于物也 —— 所谓时间管理，或者是善于交给外部系统，或者是善于交给别人 —— 首先你得是“君子”才行……就连生活黑客也不能超越这个宿命。


    注释

    [1] 此人名叫 Maneesh Sethi，他的博客叫 Hack the System。


