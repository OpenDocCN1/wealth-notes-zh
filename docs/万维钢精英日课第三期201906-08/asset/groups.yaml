    # 《历史的正确一侧》3：雅典修炼系统


    万维钢·精英文课³

    今天


    《历史的正确一侧》3：雅典。

    12:29 8.58 MB


    今天我们继续讲本·夏皮罗的《历史的正确一侧》这本书。这一讲的主题是雅典的哲学家给西方文明带来的理性基因，以及它和基督教基因是怎么融合的。


    我希望你能从咱们这几讲的内容中体会一点“思想史”的趣味。


    老百姓所谓的读历史基本都是《三国演义》的水平，听个帝王将相才子佳人的故事。《史记》《资治通鉴》可以算是严肃史书，但主要还是讲人物讲故事，期待你能从中悟出个什么道理——悟不出来就当看个热闹。真正的学者读历史，得读经济史、政治史、科技史、战争史这些专业史学，有一个宏观和全面的视角。


    而以我之见，思想史，可以说是所有美感的史学。思想超越英雄和王朝。各路思想在千年的历史中交锋、融合和转变，就如同神力的修炼和过渡。有些人扮演思想的传承者，有些人扮演鼓吹者和维护者，有些人扮演创造者——而其余的人，哪怕势力再大，人数再多，也不过是一堆案例和数据。历史因为思想而改变。


    思想的进步速度，比科技慢多了。现代人可以在生活水平上嘲笑任何时代的古人，但是要论思想，我们在当初雅典那些哲学家面前，应该感到自惭形秽。


    # 1.目的论


    每一个给青年的书单都会把柏拉图的《理想国》列为必读书，但是我估计你不想生活在柏拉图那个国里。柏拉图的理想……太“贵”了。


    贫富差距大的社会能刺激人们想赚钱，地位差距大的社会能刺激人想修炼。如果你身处古希腊的雅典——地方不大但是社会上有国王，有贵族，有平民，有奴隶，比今天任何一个国家的阶级多样性都大——你有可能将会当一个哲学家。你会想，人生在世有这么多种不同的活法，有没有一个活法是最好的呢？我们到底应该追求什么呢？


    凡是达到一定层次的人，都会对“人生的目的”有所需求，认为活着肯定不只是为了吃饱穿暖传宗接代——那是为了什么呢？上一讲我们说了，一神论的犹太教提出人生的目的是完善自我亲近上帝。而古希腊是个多神论的系统，那些神自已的事儿处理不好，完全不值得人类中的智者崇拜。雅典的哲学家崇尚的东西，是“自然法则”。


    他们相信大自然是有规律的。而且他们中的很多人，相信这个规律就是数学。比如像发现了根号2是无理数和勾股定理的毕达哥拉斯学派，对数学就是绝对崇拜的态度，认为数学代表自然的和谐。以柏拉图、亚里士多德和斯多葛主义者为代表的雅典哲学家，认为人应该从自然法则中寻找人生的目的。那这个目的是什么呢？


    这个关键概念叫做“telos”。中文把telos翻译成“目的”，但它更准确的意思有点像是物体的本来宿命，或者说是设定的属性。比如说一个蜡烛，它被制造出来就是为了照亮用的，那么它的telos就是燃烧自己照亮别人。一匹马，我们给它的使命是拉车，那么拉车就是它的telos。高山上的石头如果不稳定，终究会掉下来，那么掉下来就是它的telos。


    # 2.内圣到外王


    柏拉图和亚里士多德大概是古希腊最重量级的两位哲学家，大约相当于中国的孔孟。不过我猜孔子大概会羡慕亚里士多德。孟子只能隔着时空学习孔子的思想，自己平生未能施展政治抱负——而亚里士多德是柏拉图正式的弟子，跟柏拉图相处了二十多年；而且亚里士多德还有一个帝王学生，也就是亚历山大大帝。


    # 3.两个支柱的矛盾


    # 第一，上帝关心人吗？


    犹太教由上帝给人提供人生的意义。你只要好好自我完善，亲近上帝，做事都符合上帝的要求，那么你对个人命运就不用太担心，归根结底上帝会照顾你的。


    雅典哲学没有一神论的概念。希腊神学是多神论，但是哲学家们对神不怎么感兴趣'
  - '[PAGE 31]


    多神论，但是哲学家们对神不怎么感兴趣，他们关心的是大自然。哲学家相信大自然有个统一的法则 —— 这一点跟一神论是一致的，但是哲学家心目中的法则，跟我们今天说的“物理定律”基本上是一个意思。人生的意义在于用理性发现这些法则，但法则本身并不提供人生的意义。法则更不会照顾你。那也就是说，你还是得面对命运的不确定性。


    # 第二，人可以完全用理性探索世界吗？


    上帝允许人探索他的世界，允许人问问题，人还可以质疑上帝做事符不符合规则……但是，上帝对规则有最终的解释权。今天上帝说个事儿，你琢磨了很久。你还没想明白背后的原理呢，上帝又说了一个事儿。上帝经常给人各种“启示”，向人直接描述世界的规则
    —— 而这些启示，都是人必须接受的。


    可是对雅典哲学家来说，既然我有理性这么强大的工具，我就可以自行推导万事万物的原因！我完全可以独立发现世界的规则，“启示”是多余的！再说万一启示有互相矛盾的地方，怎么办呢？


    # 第三，个人有自由吗？


    上帝总是给人选择的权利，犹太教认为人有自由意志 —— 别忘了，这可是一神论最进步的特点。


    但是如果一个人是充分理性的，他做什么事情就必然都有充分的理由，他就应该始终做该做的事情 —— 那他怎么会有还有自由呢？我们现代人有时候会说“自由来自自控”，我们的意思是说如果你在这些事儿上自控，你就能省下时间和金钱在别的事儿上自由
    —— 但是在柏拉图那里，自由 = 自控，你只有自控的自由！亚里士多德倒是更好说话一点，不过他说的自由也只是探索哲学的自由。那这还是自由吗？


    表现在跟集体的关系上，雅典哲学认为个人必须为城邦这个集体服务，个人没啥自由。而犹太教则都是让个人直接跟上帝对话，留下了个人主义的种子。


    你看这三个问题，是不是我们今天也在争论。你支持哪一方呢？如果让我只带着科学知识而不带历史知识穿越到两千年前，我大概会支持雅典这一派……


    但历史总是出人意料。


    注释

    [1] 精英日课第二季，目的论的幽灵。


