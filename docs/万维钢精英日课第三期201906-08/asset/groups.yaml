    # 来自日课: “市场定位”是道几何题


    读者 L.J:


    市场定位的属性维度，是无限的还是有限的？比如一些行业像空调、冰箱、洗衣机等领域价格战就比较火热，是不是说明在这个领域目前阶段属性维度已经遭遇瓶颈，只能靠科技创新推动创造更多属性维度从而使商家暂时摆脱价格战？


    万维钢


    如果创新已经到了穷途末路，价格战就是不得已、而又不得不发生的事情。对消费者来说这其实是个好事儿，说明市场是有效的，竞争是个好事儿！经济本来就应该如此运行：有多少昔日的奢侈品，现在都变成了日用品。


    可是变成日用品之后怎么办呢？


    这个根本问题是创新到底是有限的还是无限的。站在消费者的角度容易认为创新是有限的。几年前我拿到 iPhone 5 的时候，感觉一个手机能做的事情也就是如此了，没啥可改进的了
    —— 殊不知消费者的定位限制了我的想象力。做手机的公司会拼命研发一些你现在不知道你需要、但是你看到就需要的新属性。


    通过市场定位模型和索洛模型，现在我们清楚地看到，创新是生死攸关的事情。我们甚至可以说创新是自由市场存在的终极目的。如果哪天创新停止了，也许市场就没有必要继续存在，企业家的使命也就完成了，也许就应该由国家接管所有公司，按计划生产，给所有人提供同样的就业和福利。


    而现在有些人想重回计划经济，他们是不是已经想象不出还有什么新的创新是值得搞的了。


