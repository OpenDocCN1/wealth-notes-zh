    # 问答：“创新”和“熵”没有关系


    万维钢 · 精英日课³

    今天

    进入课程 >


    问答：“创新”和“熵”没有关系。

    11:48 8.11 MB


    | 注记：余沙 |


    # 来自日课：人为什么活着


    读者 蔡尼：


    我很好奇，“存在主义”认为“知识与科学都是主观的”，那它是如何看待数学的呢？


    万维钢


    我不知道真正的存在主义者如何看待数学，但是我可以在“科学知识是主观的”这个说法的前提下，谈谈怎么看数学。


    正如我们专栏一再强调的那样，数学是绝对的。如果你对 1 和 2 和加法的定义跟我一样，那么你就必须跟我一样承认 1+1=2。逻辑的对错是客观的，外星人来了也得认同。你可以推翻物理定律，但绝对不可能推翻数学定理。


    那既然数学是绝对的，为啥科学知识可以是主观的呢？因为科学谈论的是真实世界，而数学谈论的不是真实世界。


    数学，描述的是一个纯逻辑的、纯抽象的世界里的事情。真实世界里并没有“直线”、“点”、“数字1”、“圆周率”这些东西。是我们作为人，赋予真实世界里的东西抽象的意义。而这种赋予是主观的。


    我们用“平方反比”这个数学公式去描写引力，可是公式属于数学抽象世界，引力属于真实世界——它们两个之间没有必然的逻辑联系，是我们人类弄出了这个联系。我们无法阻止爱因斯坦出来，用另一个完全不同的公式，描写引力。


    我们认为真实世界符合数学，这件事目前为止的确是对的，所有实验观测都表明真实世界无比精确地符合我们找到的一些数学公式——但是请注意，“真实世界符合数学”仍然只是一个信念：真实世界没有义务符合数学。


    你仔细想想，这其实是一个非常令人感到惊奇的事情。为啥真实世界非得这么符合数学。


    读者 萧显展：


    请教一个长久以来的疑问：现在“熵增”这个概念已经被广泛运用在商业和管理领域了，而且效果看着似乎还不错，这个理论本身就很*美*。但是我有个疑问就是所谓的“混乱”和“无序”本身不是一个非常主观的判断吗？我们人类能够理解事物背后运行规律的时候，这些事物就显得*有序*，而不能理解的时候事物的状态就不就*显得*无序吗？


    万维钢


    “熵增”，包括“熵”这个概念本身，经常被人误解。我们在宏观上大约可以把“熵”理解成物质的无序程度，但是正如你所说，什么叫“无序”呢？难道有序无序不是主观判断吗？这里面其实有一个误读。


    熵的严格意思并不是无序程度，而是“有多少种排列方式”。


    举个例子。比如现在有个封闭的、尺寸是 10 米 × 10 米 × 10 米的房间，其中有 100 个气体分子。请问下面这两种情形，各自有多少种这些分子的排列方式——


    ![](img/b58c3137b911797b913643bab2c018ea_60_0.png)


    A. 这 100 个分子都蜷缩在房间中大小为 1 厘米的一角；

    B. 这 100 个分子可以在整个房间中自由运动。


    答案当然是 B 的排列方式比 A 要多得多。我们可以说对那些分子来说，B 比 A 更自由，B 里包含的可能性比 A 更多，从 B 中选择一个排列，要克服的不确定性，比
    A 要大——这就叫 B 的熵比 A 高。而从直观上来看，我们感觉 B 比 A 要混乱，要更无序一些。


    所以“无序”不是一个科学词汇，“有多少种排列方式”，才是科学概念。


    一杯冰块，给我们的感觉比一杯水更“无序”，但事实是冰融化成水之后水分子会更自由地运动，它们的排列方式会更多，所以水其实比冰块的熵更高。


    ![](img/b58c3137b911797b913643bab2c018ea_60_1.png)


    对熵的另一个常见误解是认为生命是一种“逆熵”现象，以为生命会减少熵，这完全错误。生命是一个“自组织”现象，生命的出现和存在只会进一步加剧熵增——这个问题我们在专栏第二季讲泰格马克的《生命3.0》这本书的时候专门讲过
    [1]。


    热力学第二定律并不禁止封闭系统里产生生命。我们完全可以把宇宙当成一个封闭系统——宇宙在膨胀不等于宇宙是开放的，而且就算从现在开始宇宙不再膨胀了，宇宙里也会产生生命。只要是足够复杂的地方，都有可能产生自组织现象，生命并不需要什么开放性。


    还有，把“创新”跟“熵”联系起来，再用熵增论证创新必须有开放性，既无必要，也不正确。事实上根据“基因漂变”这个概念，孤岛也会产生有特色的创新 [2]。创新跟熵根本就没啥关系。


    创新可能跟“自组织”更有关系。当我们赞美生命的时候，我们不是赞美它有多么“有序”——一对分子排成一条直线最有序，但是那不值得追求。我们想要的是它有高超的自组织。“有序”是一个含糊概念，不值得认真对待。


    当你认清了用“自组织”取代“有序”，你就会理解，熵增只是一个事实，都谈不上是悲剧。我们每天所作所为都在加剧熵增！要想用创新改善人类生活，你实际上是想进一步加剧熵增。


    # 来自日课：美左和美国


    读者 王秀梅：


    万老师，为什么美国的白左要通过帮助别人“解除压迫”来获得自豪感呢？是不是他们本身已经找不到生活的意义了？美国社会为什么会被这些白左的政治正确控制呢？


    万维钢


    因为白左代表了人类一个美好的情感。罗素说，“对爱情的渴望，对知识的追求，对人类苦难不可遏制的同情心，这三种纯洁但无比强烈的激情支配着我的一生。”这个对人类苦难不可遏制的同情心，就是白左的情感基础。


    孟子说恻隐之心人皆有之。严格地说，这个“同情心”应该是“共情作用（empathy）”。你看到别人受苦，就好像自己也在受苦一样难受。你看到有人在受苦，你就会本能地认为世界不应该是这样的，你就会想要做点什么去改变世界。


    两个外国难民，其中还有一个是孩子，为了偷渡美国而淹死了。从法律上来说，这真不是美国的错，是他们自己的祖国对不起他们。可是从感情上来说，这件事就发生在美国门口，难道你美国政府就一点责任都没有吗？别国政府腐败透顶咱们不管了，那咱们不能管美国政府？这个道理对不对不重要，重要的是这是一个强烈的心结。


    白左就是这种强烈情绪的产物。白左政客非常虚伪，他们有能力使用理性，可他们故意迎合百姓的感性。但是，白左的支持者，很多都是真诚的。其中有很多人，甚至认为，外国的那些苦难，本来就是西方殖民者造成的，他们认为自己有一种...'
  - '[PAGE 61]


    方殖民者给造成的，他们认为自己有一种原罪。


    这就不难理解为什么教育界、媒体界和好莱坞是白左最盛行的地方。如果你不必亲自参与苦难，置身事外，只是以旁观者的视角去看世界上的这些事儿，同情心肯定是你最强烈的情绪。老师给孩子们讲第三世界国家人们的苦难，他总不能说“这都是他们自找的，你们要是不好好学习就也会跟他们一样”——谁会那么残忍呢？老师肯定得说这些人本身都是好人，他们没有错，错的是那些压迫他们的人！我认为这个情绪是正常的也是纯洁的。


    白左的问题在于一旦进入操作层面，就说不通了。有同情心是一回事，花谁的钱是另一回事。大部分白左想的是花“国家的钱”——更准确地说SN花富人和大公司的钱——但是不打算花自己的钱。这个世界不对，那是别人犯的错，是富人和大公司多拿多占了，是他们在搞压迫。


    那如果对富人和大公司加以重税，国家经济会怎样，直接发福利这种扶贫方式到底好不好，那是白左不爱思考的问题。


    # 来自日课：如何理解西方


    读者 任文青：


    一个事实是，无论是经济还是科技，西方都走在了我们的前面。而随着中国经济的发展，也越来越呈现出个人主义的倾向，更多的年轻人追求个性解放、表达自我，整个社会个人权利的意识也越来越强。这是不是说明个人主义比集体主义更高级呢？


    万维钢


    我理解个人主义并不是写在遗传基因上的生理现象，它是一种文化模因，是一种观念的传承。正如我们在当今中国所看到的那样，经济条件好，人们就会倾向于个人主义。


    就比如说我们讲的那个那国旗做抹布的问题，乔纳森·海特和研究者曾经在拉美的几个保守国家和美国调查。他们发现，是，保守国家的人更容易认为那么做不对，美国人更认为那么做对；但是，阶层的认识也有差异。


    不管是哪个国家，凡是受过良好教育的上层社会的人，对这些问题的看法都是一致的：只要不伤害别人，就不算不道德。


    我觉得这个研究似乎暗示了，经济条件好会让人有更多的个人主义倾向。个人主义并不仅仅是宗教情怀。而这符合中国的现状。那么如此说来，个人主义可能会越来越流行，人们会要求维护个人权利。


    那是不是说中式思维就过时了呢？也不是。全局思维并不等于集体主义。全局思维是把事物放在社会关系中、放在环境中考虑，一个个人主义的社会，只要大家的联系比较密切，只要社会复杂程度比较高，它就需要全局思维。


    孔子并没有说“团结就是力量”——孔子说的是“君子和而不同”。一个“和”字，我看比只会说“努力！奋斗！”高级多了。


