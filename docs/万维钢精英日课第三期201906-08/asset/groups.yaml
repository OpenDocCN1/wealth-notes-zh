    # 问答：行有余力，则以行文


    万维钢 · 精英日课³

    今天


    进入详情 ›


    问答：行有余力，则以行文

    10:54 7.48 MB


    丨音频转文字：小沙丨


    # 来自日课：不真起跑线的人


    读者 乔伊酱、victor、敖散类：


    对比如《范畴》强调通才，和我们之前说的“达芬奇诅咒”强调要选择一个项目深入进去，这两个说法矛盾吗？


    万维钢


    首先我们必须承认这是一个专业化程度越来越强的世界。这就意味着如果一个人想出来工作，他就必须得参与社会分工，就必须至少在某一个领域达到高水平。这个逻辑没问题，这是大局观。我们看到，有很多人一辈子就专注于某一行手艺，日like过得也不错，甚至是很不错。反过来...
    那就是陷入了“达芬奇诅咒”。


    爱没斯坦的《范畴》这本书，则是在承认专业化世界的基础之上，给我们两个提... 人生应当有一个尝试期，先广泛尝试，看看自己喜欢什么再决定在哪个方向深入发展。而且人生很漫长，也许你发展了一段时间之后想要换个方向，甚至换好几次，这都是可以的。


    第二是如果你的工作涉及到复杂和棘手的问题，你就不能只专注于一项技能，你必须善于借鉴各个领域的思想。这一... 这就是为什么很多... 我们知道普通科研工作者并没有超过老百姓水平的业余爱好。但是如果你想要做出高水平，到了需要发挥创造力的地步，或者成为某个领域的领导者，那有一点通才的素质就非常必要了。


    简单地说，《达芬奇诅咒》，是提醒聪明人不要犯低级错误；《范畴》则是探讨聪明人怎么做才能锦上添花、把个人发挥最大化。


    读者 花开无烬：


    精英选手通常在“尝试期”广泛尝试各种爱好，等自己心智成熟了再选择一个爱好深入。这种“尝试期”是不是一定要在15岁前进行呢？还有，什么时候才知道自己“心智成熟”呢？


    读者 灯塔：


    高三或者大学做人生规划也未必正确吗？


    万维钢


    尝试和选择并没有一个明确的分界线，人始终都应该尝试新的东西，也始终都有重新选择的权利……只是你不能不选择、不深入。其实只要深入到一个领域中去，达到一个高水平，这时候再想换个领域是比较容易的。用学外语打比方，掌握一门外语之后，再学第二门外语可能只需要花一半的时间，再学第三门语言需要的时间就更少。所以不要担心深入。除非是体育比赛和音乐演奏这些需要从小练习、必须在年轻时候出成绩的项目，那种必须早点下决心。


    # 来自日课：学习的快功和慢功


    读者 Cage：


    我记得您之前的书《智识分子》里有介绍您当初学习英语的心得可能避免长期，要在短期内突破。我自己考试的经验也是差不多的时间考... 请问万老师这之间有什么区别或者不同之处吗？


    万维钢


    学英语是一种特殊的学习。一般的学科，尤其是数学，知识都是分层的，你必须把底层的... 扎实了，才能学好高层的... 这就是为什么美国空军学院那个研究中教真功夫的老师都教得慢。


    但英语没有那么多层。基本的语法中学就学完了，写作的技巧可以跟语文通用，真正需要专门训练突破的，是词汇量。学习词汇有一些窍门... 但是，词汇量本质上是个消耗时间的功夫。你大概需要认识几万个单词才能顺畅阅读英文书籍，那么如果每天学20个，难道要花上五年时间学英语吗？正确的办法是每天背比如说500个单词。'
