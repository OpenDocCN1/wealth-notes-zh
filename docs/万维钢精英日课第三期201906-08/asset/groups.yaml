    # 3.生活黑客种种


    现在生活黑客已经出现在各个领域，可以说有各种门派。时间管理派大约是其中最经典的一派。你可能学习过“高效能人士的七个习惯”、用过“GTD”、听说过什么“每周工作4小时”之类，这些都是生活黑客倡导的生活方式。


    “极简主义”也是一派。这一派的主张是把所有不是经常用的东西全部扔掉，可留可不留的东西全都不留，一切都要最简化，以期获得身心的健康。


    有一派叫“量化自我”，走哪都戴个智能手表或者电子手环，随时记录自己的一举一动。


    还有一种生活黑客要求自己家里所有的电器都上网，并且通过人工智能——至少也要通过语音助手——自动化控制。有人要求每天早上闹钟一响，家里的咖啡壶就开始自动煮好咖啡……如果市面上的智能咖啡壶不听苹果
    Siri 的指挥，他就宁可花十几个小时黑进咖啡壶的操作系统，自己实现这个功能。


    包括所谓“把妹达人”，也算是生活黑客的一门。这一门黑的是两性关系这个系统——他们像钻研电子游戏一样钻研女性的心理，琢磨怎么和女生搭讪，如何试探、取得反馈。他们使用数据分析的技术手段寻找下一个“女朋友”。


    总而言之，只要你发现了生活中的一个什么小窍门，以极客的精神钻研，特别是愿意把你钻研的成果跟人分享，你就是一个生活黑客。如果再进一步，你居然还总结出一套黑客的“道”，大张旗鼓地去宣扬和卖钱，你就是宗师级黑客。


    我们专栏以前讲过一本书叫《巨人的工具》，其作者蒂姆·费里斯（Tim Ferriss），就是一位宗师级的生活黑客。费里斯的成名作是一本叫做《每周工作4小时》的书，这本书说的是生活黑客的钻研成果——对此咱们下一讲再讨论——而且也是用生活黑客的手段写成的。比如作为一个第一次出书的作者，怎么推广自己的新书？费里斯使用了
    A/B 测试。


    他想了好几个书名，利用 Google 的 Adwords，只花了400美元就测试出哪个书名更容易吸引到来自搜索引擎的点击。什么样的封面能增加销量呢？费里斯做了几种设计，把书摆在公共书店里，他自己找个地方暗中观察，看看哪个封面更容易被读者拿起来。


    试问有多少作者下过这样的功夫？而黑客就得舍得下功夫。你可能听说过一位著名的未来学家，《奇点临近》那本书的作者，雷·库兹韦尔（Ray Kurzweil）——这位老兄是
    1948 年生人，为了活到 2050 年奇点到来的时刻，现在每天吃超过 100 粒（！）各种养生药 [2]——包括什么维生素、鱼油之类——而且据说这个吃法还是跟医生讨论过的。


    你越是考察那些成功人士，就越会感到在当今这个世界要想做出一点成绩来，不走极端似乎是不行的。那么随之而来的问题就是，这都值得吗？事实上，我们后面将会讲到，把生活像算法那样优化，你的视野会被大大地限制住。什么都看时间表，你还是自由独立的人吗？量化自我真的有用吗？自动煮咖啡有意义吗？


    你想要的到底是爱，还是依赖；你对别人到底是关爱，还是可怜；你处事的姿态是平静，还是冷漠？如果你身怀利器，你就需要知道，善恶只有一线之隔。


    注释

    [1] Whitson Gordon, How to Return Nearly Anything Without a Receipt, lifehacker.com,
    12/26/2015. Lifehacker 是个值得读的网站。

    [2] 你肯定想知道他吃的都是什么，参加 TRANSCEND Longevity: What Supplements does Ray Kurzweil take
    and why? https://transcend.me/blogs/supplementation/what-supplements-does-ray-kurzweil-take-and-why
