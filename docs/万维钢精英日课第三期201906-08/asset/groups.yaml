    ## 来自日课：马尔可夫宿命论


    ### 读者 居安思危、L.J：


    马尔可夫宿命论和大数定律有什么区别和共同性？


    ### 读者 Peter ZHAO、王晓影：


    马尔可夫过程和“回归均值”有什么关系和不同呢？


    ### 读者 Albert：


    纳什均衡和马尔可夫过程有什么相似和区别呢？


    万维钢

    大数定律、回归均值、纳什均衡和马尔可夫过程都有一定相似之处，我们来辨析一下这几个概念的区别和联系。


    “大数定律”，是说只要一件事情发生次数足够多，它出现某一结果的频率，就会等于概率。啥叫概率呢？概率是理论值。


    比如如果你有一个完美的硬币，你抛硬币得到正面朝上的概率，就是严格的 50%。可是...大数定律说那是因为你抛的次数不够多。如果...就会非常接近 50%。


    大数定律是统计学的基石。正因为有大数定律，我们才可以对事物发生的频率做出判断，我们才能通过频率去推测理论上的概率。如果没有大数定律，所有的随机实验、一切通过统计发现事物背后规律的努力，就都是没有意义的。


    马尔可夫模型最后理论计算的是概率，而要把这个概率落实到频率上，我们需要大数定律。但是大数定律不管你的理论概率是多少，所以马尔可夫模型是一个比大数定律更特殊的理论。


    “回归均值”，我们专栏以前专讲过 [1]，是说好运气通常不会连续发生。比...这个现象就是回归均值。


    马尔可夫过程也有某种“回归”的感觉，一个人经历了外部的扰动之后，又回归了常态——但这个回归，却是有因果关系的。...回归均值是假回归，马尔可夫过程是真回归。


    马尔可夫过程最终将回归到一个均衡态，而纳什均衡也是均衡，但这两个概念只具有形式上的相似，后后的原理完全不一样。...我就只能接受纳什均衡，因为我单方面做出改变只会让我局面更差。


    ### 读者 思考者、符号M7：


    中国历史曾经的治乱循环、封建王朝更替，是否是马尔可夫过程呢？


    ### 读者 晓游才：


    历史总是在重复，但是重复的程度应该是不同的吧，有时候重复的轻一些有时...这是是否一个无解的怪圈呢？


    万维钢

    曾经有很多多人试图找到历史治乱循环的规律。...人们基本拿他当“民间科学家”一样看待，一提他都是当反例。


    ......但这样的解释也是过于简单的。真实历史总是同时有很多因素在起作用...到底哪个过程占上风，是事先无法预测的。


    ## 来自日课：骄孔的阈值


    ### 读者 Wenting ⁺²：


    这种制造“人带人混乱”的“能力”，是否可以用来打着爆款产品......这种滚雪球效应会自动发生，让更多高阈值的人被最终吸引进来。


    万维钢

    是的。像现在有些新片上映之前会邀请一些文化名人弄个看片会，也是因为这些人是社交节点，推动力更大。


    以前希思兄弟有本叫《胜于胜》（Made to Stick），其中有个思想，叫“如果你在咨...特别高调的活儿。


    对发达国家来说这不是个事儿，但是对印度这种基础设施落后的国家来说，这就对物流提出了一个重大挑战。而那家快递公司，就把这件事儿给做成了。


    把这件事儿给做成了。媒体主动报道，读者高度关注，然后它就一举成名。


    由此可见一场骚乱能不能发生，也跟最初事情的大小有关，也跟当时在场人数的多少有关。事情大，人们的阈值就低，就愿意传播；而能看见的人数要是少，阈值就没有意义了。


    ## 来自日课: “市场定位”是道几何题


    读者 L.J:


    市场定位的属性维度，是无限的还是有限的？比如一些行业像空调、冰箱、洗衣机等领域价格战就比较火热，是不是说明在这个领域目前阶段属性维度已经遭遇瓶颈，只能靠科技创新推动创造更多属性维度从而使商家暂时摆脱价格战？


    万维钢


    如果创新已经到了穷途末路，价格战就是不得已、而又不得不发生的事情。对消费者来说这其实是个好事儿，说明市场是有效的，竞争是个好事儿！经济本来就应该如此运行：有多少昔日的奢侈品，现在都变成了日用品。


    可是变成日用品之后怎么办呢？


    这个根本问题是创新到底是有限的还是无限的。站在消费者的角度容易认为创新是有限的。几年前我拿到 iPhone 5 的时候，感觉一个手机能做的事情也就是如此了，没啥可改进的了
    —— 殊不知消费者的定位限制了我的想象力。做手机的公司会拼命研发一些你现在不知道你需要、但是你看到就需要的新属性。


    通过市场定位模型和索洛模型，现在我们清楚地看到，创新是生死攸关的事情。我们甚至可以说创新是自由市场存在的终极目的。如果哪天创新停止了，也许市场就没有必要继续存在，企业家的使命也就完成了，也许就应该由国家接管所有公司，按计划生产，给所有人提供同样的就业和福利。


    而现在有些人想重回计划经济，他们是不是已经想象不出还有什么新的创新是值得搞的了。


