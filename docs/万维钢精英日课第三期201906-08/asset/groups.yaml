    多变化。尽管如此，我们仍然要强调这个过程中有很大的运气因素，特别是决定性的几步往往是发生在早期。有个历史作家叫刘仲敬，现在整天鼓吹分裂中国已经走火入魔了，但是他以前写的一本书叫《经与史》，其中有一段话说的挺有意思
    ——


    > “世界的命运和人的命运虽然漫长，关键性的节点却寥寥无几。四分之三的人生剧本在三十岁以前就写定了，以后的内容根本不值一看。文明和邦国的兴废都有其不可逆的节点，拥有无限可能性的青春期总是非常短促。”


    他说的其实就是路径依赖。路径是偶然选择的产物，而早期的选择尤为重要，所以当你有路可选的时候才是人生最精彩的时候 —— 这就是为什么电视剧总是写年轻人的故事
    —— 别等到自己的路径已经锁死了再感慨人生。


    不过所幸的是路径通常不是一次就锁死的。波利亚罐越往后改变就越难，但并不是不允许你改变：微软公司今年已经四十五岁了，仍然在开创新路径，而今天微软的云计算业务很成功。


