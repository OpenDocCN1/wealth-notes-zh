    # 《模型思考者》11: “吃一堑长一智”的数学模型


    万维钢 · 精英日课³

    今天

    进入详情 >


    《模型思考者》11: 吃一堑长一...

    12:29 8.57 MB

    |转码: 佘沙|


    咱们继续说斯科特·佩奇的《模型思考者》。这一讲我们来研究一个有关学习的模型，说人应该如何从经验中学习，从而做出明智的选择。


    我们专栏以前讲计算机思维的时候引用过软件工程专家弗雷德里克·布鲁克斯 (Fred Brooks) 的一句话，“好的判断来自经验，而经验来自坏的判断。”用咱们中国人的说法，这其实就是“吃一堑长一智”。


    ## 1.自增强学习法


    有一个诡异的故事，也许你听说过。说从前有一位女孩，在参加亲人葬礼的时候，遇见了一个很英俊的男子。女孩很喜欢这个男子。过了一段时间之后，女孩就把自己的姐姐杀死了。请问这是为什么？


    ## 2.从别人的经验中学


    自增强学习法能让你用最快的速度从自己的经验中学习，但是更快的办法，则是从别人的经验中学习。


    ## 3.绝对进步和相对进步


    佩奇说了一个有意思的例子，叫做“慷慨/恶意 博弈（The Generous/Spiteful Game）”。


    也有伤害。那特朗普为啥非得打贸易战呢？


    美国政治学家肯尼思·沃尔兹（Kenneth Waltz）有句话说，“国家首先要考虑的不是怎么让自己的力量最大化，而是保证自己在系统中的位置。”也就是为了确保自己的优势地位，哪怕杀敌一千得自损八百，那也得干。


    当然肯定不是所有人都会这么干。在这个慷慨和恶意的博弈中，如果你选择慷慨，你的自身状态会越来越好；而如果你选择恶意，你相对于别人的地位会越来越高。而数学推演表明，如果你使用自增强学习法从自己的经验中学习，你会变得越来越慷慨；如果你采用第二个学习方法，向别人学习，你会变得越来越恶意。


    那到底应该看自己还是看别人呢？这是一个两难问题，答案也许取决于你的价值观，所幸的是生活中的局面并不都是这样的博弈。我只是想告诉你，有时候看自己和看别人是不一样的。


    简单的数学模型告诉我们，要想从经验中快速学习，你必须是一个敏感的人。


    第一，你必须对奖励非常敏感，才能迅速调整各个选项的权重，让自己学会多做好事，少做坏事。


    第二，你还需要随时调整自己的心理期望。对所有事情都敏感就等于对所有事情都不敏感。有一个比较高的期望阈值，一般的奖励不能让你兴奋，你才更愿意去追求奖励高的事情，你才能更快地找到最佳选项。期望值过低的人会习惯性地去做一些低回报的事情。


    第三，参考别人的经验能使你学得更快，不过你得注意自己到底想要什么，别人和自己毕竟是两回事——比如有的人只想比别人强，那种人未必真值得我们学习。


