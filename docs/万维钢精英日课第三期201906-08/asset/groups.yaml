    # 《范畴》4：专业化和流程化


    万维钢·精英日课³

    今天


    进入课程 >


    《范畴》4：专业化和流程化

    13:04 8.98 MB


    今天我们继续讲爱泼斯坦的《范畴》这本书。我非常佩服爱泼斯坦的调研水平，这本书汇聚了很多最新的研究结果。其实很多道理只要一说出来咱们都能认同，但是必须得有这种过硬的研究证据支持，我们才能确信它是正确的——否则的话，有时候相反的说法，你听听可能感觉也有道理。


    这一讲咱们把专业技能、刻意练习和“通才”的关系再说清楚一点。


    你肯定听说道很多关于天才孩童的故事。比如像《最强大脑》节目，里面有些选手展现的技能真是让人匪夷所思，不服不行。但是你注意到没有，这些所谓的 также 孩童，他们擅长的项目基本上都是一些*技术*层面的东西。


    最常见的是超强的计算能力，你给他一个多位数乘法，他几乎是看着题目就立即把答案报出来。有人拥有照相机一般的记忆力，一大堆东西他看一眼就能记住；还有人观察特别细致，能分辨极其细微的差异；还有的人特别擅长魔方，等等。对应到现实生活中，现在“神童”做的事情也跟这些表象差不多，比如年纪很小就成了国际象棋的冠军、学会好几国外语、钢琴比赛和高尔夫之类。他们这些技能的水平，我认为我再怎么努力也赶不上，如果有相关的工作机会，我希望让他们上。


    但是你见没见过*战略*水平过人而闻名的神童呢？比如一个十二岁的少年，把中美贸易战给你分析得头头是道，让你一听就想推荐让他去负责对美谈判？一个十三岁的电影导演，刚刚拍摄了一部投资几亿元的战争片？有没有一个十四岁的职业经理人，敢闯敢干，而且考虑问题比老领导还全面……这些我没见过。


    为啥神童都是专项人才呢？首先专项的确容易看出能力来，可测量可比较，谁行谁不行一是一二是二。我们这个时代非常乐于奖励专项人才。


    # 1.专业化的问题


    以前牛顿提出力学三大定律，他写的书并不叫《行星运动的力学原理》，而是叫《自然哲学的数学原理》。牛顿非常关心，如果万事万物按照物理定律运行，那么上帝该怎么算呢？不是说一切都是上帝安排的吗？牛顿并不仅仅想要一套能用数学描写的规律，他想要回答哲学问题。


    # 2.“友好的”学习环境


    流程化的东西应该怎么训练呢？“刻意练习”就是最适合的方法。你需要大量重复训练，你需要随时获得反馈，你需要一直知道什么是对什么是错，你需要掌握一大堆套路。你需要在经验中提高，而且你的确能够在经验中提高。'
  - '[PAGE 9]


    目多，还是棘手的项目多呢？爱泼斯坦的说法是棘手的项目多，但我感觉低端工作中是友好的项目多，高端工作中是棘手的项目多。


    棘手的项目不是练童子功就能征服的。可能你上山跟着名师苦练了十年童子功，赢了起跑线，各种套路了然于胸运用自如，然后下山一看……现在是 AI 的世界。


    # 3.AI不喜欢什么问题？


    人工智能很久以前就征服了国际象棋，现在又征服了围棋。但是在大约十几年前—— AI已经征服国际象棋之后，但是 AlphaGo 尚未出现之前的那个时期，人类棋手曾经对
    AI 有过一个评价。


    这个评价是 AI 或许善于战术计算，但并不善于战略眼光。这个证据表现如果让一个人类棋手和 AI 组队参加比赛，只要双方配合得好，他们往往能打败单纯的 AI
    对手。


    史上最伟大的人类棋手卡斯帕罗夫，曾经组织过这样的比赛。他对此发表过很多感慨，核心思想就是机器毕竟只是工具，人类还是保留了一点战略上的优势的。毕竟战术都是底层的，而战略分很多层，人类比较擅长高层次思维。如果让人负责战略眼光判断，有时候迸发一些奇思妙想，让
    AI 作为助手提供战术推演，这岂不是人机合一的好办法吗？


    卡斯帕罗夫组织的人机自由组队比赛也的确证明了这一点……直到 Alpha Zero 出现，AI 彻底征服国际象棋，现在可以说人类棋手的任何建议都是 AI 的累赘。


    但卡斯帕罗夫说的这个道理仍然成立！国际象棋的规则毕竟是简单的，变量毕竟是有限的。换个更复杂的局面，比如《星际争霸》电子游戏，Alpha Zero 并没有表现出完全高人好几等的水平……至少没有像在国际象棋上那么厉害。


    这给了我们一个提示，也是一个希望。也许将来人的真正优势就是那些不友好的学习环境。真实世界里的决策比《星际争霸》游戏还要复杂，也许你需要心理学、经济学、历史学之类的知识才能做好一个决策，而
    AI 距离理解那些东西还很远。


    咱们再想想泰格·伍兹。高尔夫打得是好，但是他似乎不太擅长自我管理，一度丑闻缠身，最近才东山再起，而且还在打高尔夫。对比之下，你再看姚明，以前是篮球球星，后来是姚老板，现在是中国篮协主席，搞改革搞得有声有色！


    我觉得 AI 能取代泰格·伍兹，但是不太容易取代姚明。


