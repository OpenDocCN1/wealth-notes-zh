    # 蝴蝶无效应，安全有小事


    万维钢 · 精英日课³

    今天


    进入课程 >


    蝴蝶无效应，安全有小事

    11:11 7.68 MB


    转载：沙沙


    “蝴蝶效应” 是人们经常谈论的一个科学典故，说一只蝴蝶震动翅膀，有可能在几周之后，在美国德克萨斯州，导致一场飓风。人们经常用蝴蝶效应形容小的事情可能带来很大的影响。


    而这一讲我想说的是，当人们谈论蝴蝶效应的时候，基本上都说错了。而这个认知错误更体现了一个重要的观念错误。


    咱们先说说“蝴蝶效应”是怎么来的。


    1961年，美国数学家爱德华·洛伦兹（Edward Lorenz）在用计算机模拟天气变化的时候，发现一个有意思的现象。我们知道计算机模拟都有输入的参数和输出的结果。本来有个输入参数的数值应该是0.506127，有一次模拟中洛伦兹为了省事，就把它给来了四个舍五入，用0.506代替。其实我们平时工作中经常这么干，误差不到万分之二，对吧？


    可是洛伦兹发现，计算机输出的结果，不


    ![](img/b58c3137b911797b913643bab2c018ea_34_0.png)


    从小到大的一堆多米诺骨牌排在一起，最大的 James... 最小的一块比指甲盖还小，只能用镊子拿。放倒最小的一块，骨牌就会连锁反应，最终把最大的一块也推倒。


    这不就是蝴蝶效应吗？这不就是小骨牌导致了大骨牌的倒下吗？


    不是。


    是这些骨牌的排列方式，导致了大骨牌的倒下。这是一个极其危险的系统。就算最小的骨牌不倒，中间任何一个骨牌倒下，都会导致后面所有的骨牌倒下。


    那么什么样的系统容易出危险呢？1979年，美国宾夕法尼亚州的三里岛核电站，发生了一次严重的反应堆融毁事故。事故没有造成直接或者间接的人员伤亡，但是光是清理费用就超过了10亿美元。当时美国政府请了一位叫查尔斯·佩罗（Charles
    Perrow）的社会学家帮忙分析事故原因。佩罗的研究，从此改变了人们对大事故的看法[1]。


    ## 第一个特征是“复杂”。中文的“复杂”对应到英文有两个词，一个是 complex，一个是 complicated。后者的意思差不多是“很麻烦、不容易理解”，而前者的意思是系统的各个部分互相关联，不是简单的连接。我们说的这个复杂是
    complex。


    ## 第二个特征是“紧致耦合（tight coupling）”。所谓紧致耦合，就是这个系统缺少缓冲地带[3]，错一点都不行，没有余地 [4]。


    余闲 [4]。


    出现这个情况往往是系统过于追求效率，搞得什么东西都一环套一环可忧可虑，结果错一步就导致后面全错。


    比如大桥就是一个不复杂、耦合也不紧的系统。哪个桥墩有问题，不至于马上波及别的桥墩，大桥对付着还能用上一段时间。道路交通也不复杂，但是耦合比较紧，一条路上任何一个地方出事故，整条路都得堵车。大学系统很复杂，但是耦合不紧，教授们就算搞搞政治斗争也翻不了天。可像是核电站和化工厂这种东西，如果又复杂耦合又紧，那就容易出大事故。


    当人们强调“安全”的时候，总爱说什么是要狠抓“安全意识”，什么“年年讲月月讲天天讲”，什么“警钟长鸣”。可是安全意识有用吗？


    安全意识关注的是蝴蝶。如果蝴蝶风真的是由蝴蝶引起的，那你就应该好好教育蝴蝶们，不要随便震动翅膀。如果事故真是因为工作人员疏忽，那你就应该给员工天天讲。


    其实“天天讲”是个不好的教育方法，重复的信息会被人脑自动忽略。如果一个烟雾报警器有事儿没事儿动不动就叫，你会直接关掉它了事。


    更重要的是，真正的大事故不是蝴蝶引起的。我们需要不是安全意识，而是安全系统。


    经常与蝴蝶效应共同出现的一句话是“XX无小事”，这也是一个错误的观念。无小事 = 无大事。


    如果一个领导只会笼统地说什么“这很复杂啊！这很重要啊！千里之堤毁于蚁穴啊！核电站无小事！”，我认为这领导啥也不懂。做事得善于分清轻重缓急。敢于忽略小事，你才能做好大事。


    把系统搞好了，有缓冲区有余闲有稳定回路，我们就可以有恃无恐。反过来说如果系统不行，人就算整天战战兢兢也难保不出事儿。


    ## 凡夫畏果，菩萨畏因，我们有现代化管理知识的人还要再加一句：佛畏系统。


    ## 注释


    [1] 此事详情见于 Meltdown: Why Our Systems Fail and What We Can Do About It, by Chris
    Clearfield and András Tilcsik, 2018.

    [2] 精英日课第二季，线性思维和系统思维。

    [3] 精英日课第三季，逻辑思维5. 灰度认知和黑白决策

    [4] 精英日课第三季，怎样不做“必须做的事儿”


