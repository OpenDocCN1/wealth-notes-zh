    ## 来自日课：马尔可夫宿命论


    ### 读者 居安思危、L.J：


    马尔可夫宿命论和大数定律有什么区别和共同性？


    ### 读者 Peter ZHAO、王晓影：


    马尔可夫过程和“回归均值”有什么关系和不同呢？


    ### 读者 Albert：


    纳什均衡和马尔可夫过程有什么相似和区别呢？


    万维钢

    大数定律、回归均值、纳什均衡和马尔可夫过程都有一定相似之处，我们来辨析一下这几个概念的区别和联系。


    “大数定律”，是说只要一件事情发生次数足够多，它出现某一结果的频率，就会等于概率。啥叫概率呢？概率是理论值。


    比如如果你有一个完美的硬币，你抛硬币得到正面朝上的概率，就是严格的 50%。可是...大数定律说那是因为你抛的次数不够多。如果...就会非常接近 50%。


    大数定律是统计学的基石。正因为有大数定律，我们才可以对事物发生的频率做出判断，我们才能通过频率去推测理论上的概率。如果没有大数定律，所有的随机实验、一切通过统计发现事物背后规律的努力，就都是没有意义的。


    马尔可夫模型最后理论计算的是概率，而要把这个概率落实到频率上，我们需要大数定律。但是大数定律不管你的理论概率是多少，所以马尔可夫模型是一个比大数定律更特殊的理论。


    “回归均值”，我们专栏以前专讲过 [1]，是说好运气通常不会连续发生。比...这个现象就是回归均值。


    马尔可夫过程也有某种“回归”的感觉，一个人经历了外部的扰动之后，又回归了常态——但这个回归，却是有因果关系的。...回归均值是假回归，马尔可夫过程是真回归。


    马尔可夫过程最终将回归到一个均衡态，而纳什均衡也是均衡，但这两个概念只具有形式上的相似，后后的原理完全不一样。...我就只能接受纳什均衡，因为我单方面做出改变只会让我局面更差。


    ### 读者 思考者、符号M7：


