    # 问答：“受过教育的猜测”


    万维钢 · 精英日课³

    今天

    进入课程 ›


    问答：“受过教育的猜测” 10:25 7.16 MB


    | 转录：亦汐 |


    # 来自日课：一边自我实现，一边自我发现


    # 读者 我的头像很*萌*：


    现实社会中，时间精力是有成本的，尝试多久，多深入才算“行”呢？


    # 读者 日积月累：


    关于*坚持与放弃*的分水线，记得万老师在给单身男女的结婚建议时，用到了37%的概念，请问这两者可以类比吗？


    万维钢


    是的，关于要学习什么技能，选择什么职业的尝试期，可以和我们以前说过的随机选择优化理论中那个著名的“37”[1]类似。不过这个类比不能机械地照搬。37%这个数字有很多前提假设，最适合像买房子和择偶这样的事情，这些假定包括——


    +   1. 在整个选择窗口期，你遇到合适对象的概率是不变的；

    2. 只要你选 ta，ta 就是你的；

    3. 一旦错过就不能回头；

    4. 选定了就不能改；

    5. 窗口期是有限的。


    这五个条件，对学习新技能和选择职业来说，都不适用。人一生中可以从事很多种工作，不喜欢就可以换，错过了还可以后悔，而且也不是你喜欢什么工作就可以做什么工作。那你说关于专才和通才的尝试期，有没有一个专门的算法呢？


    我不知道有没有，我认为可以有。但是我知道，就算有，对个人的用处也不大。事实上没有人照着37%这个指导线选择！没有人正好符合那五个条件。37%只是一个大概的说法，相当于成语故事。


    我们讲《范围》这本书的过程中，很多读者说能不能给我一个度数，到底把专业技能练到多少度的时候转型去做通才……没有统一的度数。凡是给度数的都不科学。我们以前讲过《平均的终结》，我们知道根本没有“平均人”，6岁上小学、18岁上大学、65岁退休，这些都不是科学计算的结果，而是简单粗暴的人为规定；性格测试法不能判断你的真实性格；BMI（身体质量指数）不能说明你是否过肥胖。


    现实是每个人的情况都不一样。多深叫深？深到什么程度应该追求广度？这跟具体的行业、个人的能力和喜好都有关系，还要考虑历史的行程。真实生活中太多不可随意忽略的因素，不能算法化。


    那既然学了这些知识还要面对不确定性，我们为啥还要学这些知识呢？英文中有个词叫“educated guess”，直译过来差不多是“受过教育的猜测”——你仍然是在猜测一个答案，但是你的猜测是建立在知识和经验的基础之上，所以更有可能正确。跟别人说你拿不准的判断的时候，先说一句“我有一个
    educated guess……”，格调马上就提高了。


    知识首先能让你知道都有哪些选项，以及各个选项都意味着什么。其次它能让你避免特别极端的选择。思而不学则极端。比如一个人原本打算一辈子就钻研一个技能，他了解了这些理论之后，就算不知道具体的度数是多少，也大概知道自己在走极端。


    更好的是，了解这些研究能让你对那个度数大概在哪里，有个微妙的感觉。如果一个人没听过我们讲的那些研究，就可能以为自己的孩子不赢起跑线就不行，而殊不知像费德勒那样不赢起跑线才是高手的典型做法。那你说到底哪个孩子的家长应该感到担心呢？当然这个感觉不是绝对的，但是能找到这个感觉，你的判断就会更准确一点。


    从盲目地走极端，到听风就是雨到处乱撞，到学会做 educated guess，这就是认知升级。


