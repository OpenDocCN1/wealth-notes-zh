    # 关于中国古代科技水平的非巨婴观点


    万维钢 · 精英日课³

    今天


    进入课程 ›


    关于中国古代科技水平的非...

    12:24 8.52 MB


    | 传递：长沙 |


    苏格拉底有句名言 “未经审视的人生不值得过”，那未经审视的观念，值不值得拥有呢？这一讲咱们说说怎样审视这么一个观念：中国古代科技，到底是什么水平。现在中国足球水平很差，我们照样爱国；而有人说中国古代科技水平不行，人们就不干了——你只要稍加审视，这其中的有些观念是荒唐的。我想借这个问题考察一般人的三个认知误区，并且介绍一个正确的思维方法。


    第一个误区是用现代的好坏标准去要求古人。


    “科学技术是第一生产力”，这是咱们现代人的观点，古人并没有这个想法——因为科学技术在古代并不是第一生产力。在古人眼中，只要国家政治安定没有战乱，气候风调雨顺，政府轻徭薄赋，经济自然就增长，老百姓过的就是好日子。古代科技进步十分缓慢，甚至于人们根本看不见它的好处，如果有的话肯定是锦上添花，但绝不是第一生产力。


    有统计表明过去几十年内，成年男子的体力——比如手的握力——都比上一辈的人显著下降了。但是我们不在乎，因为现代社会不是谁有劲谁最能干活儿。跟古人谈科技，就如同古人笑话我们手没劲儿一样，大家在意的不一样。其实足球对今天中国的意义，可能比科技对古代中国的作用大。足球当然是个特别吸引眼球的产业，就好像古代人重视诗歌一样。


    古人要看一个朝代好不好，都是看老百姓日子过得好不好，政治清明不清明，领土大不大，战争能不能打赢，以及人类文化是否昌盛——难道这些成就还不足以让我们爱中国吗？


    第二个认知误区，是只接受好听的结论。


    上世纪中叶，在中国百废待兴、急需民族自豪感的时刻，英国学者李约瑟，在他的中国妻子的影响下研究了中国古代科技史。李约瑟本是个生物化学家，他没有受过正规汉学训练也没有研究过世界科技史，但是他热爱中国。他就如同发现新大陆一样，写了一本马可波罗游记式的书，向西方世界介绍古代中国的科技成就，他高度赞美了中国的“四大发明”。


    第三个认知误区，就是非得把科技和爱国联系起来。


    写留言，与作者互动


    系起来。


    我们何必纠结于古代中国是不是科技强国呢？现实是我们近代落后那么多，就算能从古代找补回来一点优越感又有多大意义呢？而且现在我们正在赶上和超过西方，为什么不能自信一点呢？


    据说苏联的教科书，曾经把什么现代发明都说成是俄国人做出来的——咱中国的教科书真没到那一步。但是我们也有一些儿童思维。


    我看有人论证，说微积分这个思想其实是中国人发明的，因为《庄子》里就有“一尺之捶，日取其半，万世不竭”这个说法。可你不能把问题想明白了再说。庄子这段最多只能跟古希腊的“芝诺悖论”相提并论，而且完全没有表现人家那种思辨水平——这距离发明微积分还很遥远好吗？


    还有人说计算机思想也起源于中国，因为《易经》里的八卦就是个二进制系统！我看这个论证还不如说足球起源于中国——可是你那个蹴鞠跟现代足球有可比性吗？就算足球真是欧洲人从中国学去的，那能改变你中国足球不行的现状吗？


    以我之见，中国古代科技的真实水平，既不是一个神秘的学术之谜，也不应该对中小学保密。巨婴要求世界都围着自己转，势利小人才根据“厉害不厉害”决定爱不爱国，从祖先身上找自信是精神胜利法。子不嫌母丑，难道符合逻辑的爱国不应该是无条件的吗？


    我们不是科技最发达的古代文明。我们需要是古代科技最发达的文明。过去是不是不重要，只要现在把路走对了，人民头脑清楚思想自由，就算有人不爱国，我们将来也可以是科技最发达的文明。


