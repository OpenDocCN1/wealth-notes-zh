    ## 特别放送：失败的逻辑


    万维钢 · 精英日课³

    今天

    进入课程 ›


    特别放送：失败的逻辑

    00:32 500.95 KB

    |转链：档案|


    研究如何成功的内容你一定听得不少了，今天我们就来总结一下“失败”。什么导致了失败？怎么理解失败？失败和成功是什么关系？如何避免失败？失败之后最后该做的是什么？希望今天这些对“失败”的解读，对你有用。


    ## 1.失败是成功之母吗？


    过去的失败经历，对你未来的成功，一点帮助都没有。一个一直失败的人，将来最大的可能性也许是习惯性地再次失败，还不如新人。


    但是这个研究发现，过去的成功对你未来的成功很有帮助。如果你上次创业成功了，这一次成功的可能性增加50%。所以什么叫有用的经验？成功的经验才是有用的经验。


    一句话总结这个研究，失败不是成功之母，成功才是成功之母。


    所以想出来创业的人先别研究融资成功之后怎么办，应该先想想一旦失败你能不能承受。


    对社会来说，越是能容忍失败的环境越有利于创新。对个人来说，“如何失败”，是最值得研究和学习的策略。


    “从失败中吸取教训”，可没有那么容易。最好的失败是小失败或者别人的失败，失败的价值是给我们提供反馈，而反馈要想有效，必须对事不对人！


    截此复习：失败不是成功之母，成功是成功之母


    ## 2.为什么人不能从自己的失败中吸取教训？


    出了事儿都怪别人，这真曾是人之常情。心理学家对此有个专门的名字，叫“自利性偏差（self-serving bias）”。自利性偏差包括第一，如果我做这件事没做好，那肯定是因为不可控的、别人的、或者意外的缘故；第二，如果我做这件事成功了，那肯定是因为我水平高。


    这种态度会让你自我感觉良好，但是不可能让你提高决策水平。人是不会从自己的失败中吸取教训的，因为他总能找到理由把失败归于别人。


    当然别人的失败有可能是你的成功之母，因为观察别人的失败，从中总结一个教训，完全不会伤害自己的自尊。不过这个方法对自利性偏差严重的患者来说也不容易——自利性偏差还包括，认为别人的成功都是因为运气，别人的失败则都是因为他这个人的水平本来就不行。


    截此复习：真理追求者


    ## 3.那么什么样的失败才有用？


    一说起来人人都知道逆境可以让人学会新东西，什么“吃一堑长一智”、什么“不经历风雨怎么见彩虹”——可是要学习的时候，人们还是希望老师把什么东西都弄好，让你顺顺当当地考个好成绩。


    殊不知“吃一堑长一智”这句话用在战略上是不可行的。一般人通常不会从自己的失败中吸取教训，我们都喜欢把失败归于别人……其实这句话应该用在战术上。你需要的是小失败、小挫折、小错误，你需要练习中的困境，你需要“有利的困境”。


    - “好的失败”，应该满足三个条件：

    1. 及时。一旦不对马上就有人给你指出出来。

    2. 对事不对人。你错了，下次改正过来就是，没有必要上升到“你这个人行不行”的层面。

    3. 错误的代价很小。


    最好的失败，就是“在没有人看见的时候偷偷跌倒”。


    截此复习：学习的快功和慢功


    ## 4.一个系统是怎么失败的？


    一个公司本来运行良好，为什么慢慢就不行了呢？一个家庭，一开始夫妻感情特别亲密，时间长了怎么就感觉破裂了呢？一个人新年这天立志要健身，坚持了几个星期都好好的，毫无意识地就停止了，然后突然有一天发现，怎么我最近都不健身了？

    系统，是怎么衰败的呢？


    - 1. 平衡回路的作用是把当前系统的表现和系统的目标进行比较，一旦发现其中有差距就采取行动；

    2. 因为坏消息和好消息的不对称，各种意外会使得我们对系统的印象，比系统的真实情况更差；

    3. 更差的印象会降低我们心目中的系统目标，降低了的目标会让平衡回路的工作变得无效，结果就是恶性循环，系统逐渐走向衰败。


    截此复习：负反馈和正能量


    ## 5.失败有什么好处吗？


    失败能让团队建立归属感。建立团队归属感最重要的东西是“共同的回忆”，这些回忆来自五个方面——


    - 1. 成功。我们一起完成了一项了不起的事，每个人都作出了贡献，而且每个人都知道他的贡献对于我们集体能干成这件事非常重要。这样的回忆会给人很大的鼓舞。

    2. 失败。失败会让人成熟。一起经历过失败，谁也不推卸责任，大家都知道失败是什么样的，团队会变得成熟。

    3. 关心。通过一些事情让人们感受到集体很关心自己，这样就有了安全感。

    4. 正确的做法。当你作为领导面临一个艰难选择的时候，你要让你的团队看到，你是如何做出正确选择的一这样下次他们遇到类似情况，也知道应该怎么选。

    5. 错误的做法。当有人犯错的时候，团队一起来体验这个错误，下次就知道这么做不对。


    截此复习：大一统统一什么？


    ## 6.团队失败后怎么保持信心？


    有一招叫“就差一点点”。

    赌场不能一直靠让玩家赢钱来留住玩家。想要让玩家明明输了钱，但是还感觉自己马上就要赢了，这个方法就是让他“就差一点点赢”。

    比如说，老虎机，当结果是“777”的时候为大胜。如果你结果完全随机的，那你应该经常得到像“253”、“672”之类平淡的结果。这样很不好玩。

    我听说有些赌场专门聘请了数学家设计赌具算法。一个更“合理”的算法是，让你输的时候经常会得到“677”、“757”之类的结果。其实你还是输，但是你感觉上，是就差一点点！你会产生一种错觉，感觉自己正在进步。

    这不是有点像陪领导下棋。直接赢他不太好，输的太明显更不好，弄成势均力敌，最难，但效果最好。

    效法这个精神，如果你的团队失败了，你应该把失败解释成就差一点点胜利。你要在失败中拷据到自己一方的闪光点，把信心留住。


    截此复习：怎样妨鸠命运之神


    ## 7.该不该批评一个失败的人？


    批评只能让人标准化，不能突出特长。优异型人才不是从错误中提高的。白金汉和古道尔说，如果你专考察错误，你可能会认为领导人不能有太强的“自我”，因为那些最差的领导人常常都有很强的自我——可是殊不知，那些最好的领导人也都有很强的自我！如果你考察错误，你会认为销售人员不应该对订单感情用事，应该平常心——表现差的销售的确感情用事，可是殊不知，最好的那些销售也感情用事！

    我们专栏多次说过，成功的反义词不是失败，而是平庸。优异型人才和失败的人才有很多相似之处。


    截此复习：正确型人才和优异型人才


    ## 8.乐观者怎么面对失败？


    面对生活的打击，人会产生“三个 P”的情结：自责（personalization）、永久化（permanence）和普遍化（pervasiveness），认为自己就是不行，这个困难实在太大，根本过去不，这件事只能就此罢了。


    但是乐观的人可不是这样。不管遭受多大挫折，乐观的人总在告诉自己：

    1. 困难都是暂时的，只不过偶尔发生，没关系不影响大局；

    2. 这次的失败只不过是因为某个特殊的原因；

    3. 这不是我的错误——不是我不行，只不过今天我运气不好。


    写留言，与作者互动


    过今天我运气不好。


    正是这样的态度，才能让他们坚持下来。对卖保险来说，“乐观”这一素质就够了——什么外向、会说话这些都不重要。统计发现，能在乐观素质上排到前10%的人，总共卖出了88%的销售额。


    截此复习：坚持坚持再坚持


    ## 9.成功者怎么理解失败？


    达里奥系统出发点、所有道理中最大的道理，是“演化”。判断一个东西好不好，你就不能从绝对的意义上说它好不好，而必须看它在当前演化的格局之中是个什么位置。


    要顺应演化的规律，人要做的就是面对现实，积极探索。你会遭遇失败，但是你要从失败中学到东西，然后快速改进。作为“生命2.0”，人最大的优势是可以主动学习，能更快地适应新的环境。


    截此复习：大亨的大道理


    ## 10.创业者怎么对待失败？


    有人对个人创业的成功率做了一项研究。以前咱们专栏说过，“失败不是成功之母，成功才是成功之母”，这个研究证实了这一点——有过成功经验的创业者，他再创办一个新公司，再次成功的可能性是30%；而有过失败经验的人再次创业的成功可能性只有20%。如此说来，创业这件事的运气，也是跟着人的。如果你要搞风险投资，你应该尽量投给那些成功过的人。


    截此复习：正念运气观 企业家精神和包办婚姻


    ## 11.决策者怎么处理失败？


    谦卑。这是高人的专用词。它的意思是承认自己的认识和能力是有限的，承认自己会犯错误，所以保持开放的头脑，能听得进去别人的意见，能随时调整方向。


    截此复习：三种谦卑


    ## 12.失败和创新什么关系？


    《雨林：建设下一个硅谷的秘密》里总结了创新中心应该有的七个特点，值得你了解——


    - 第一，是打破规则、敢于梦想。这个地方得比较自由，能吸引不愿意墨守成规的人。

    第二，要开放，要互相取意见，要合作。

    第三，要有互信的精神。创新者得能信任别人同时还能被别人信任。在硅谷，如果一个人有损人利己的行为，不用法律惩罚，他在硅谷这个圈里就混不下去了。

    第四，要鼓励实验和迭代。创新过程就是突变和选择。

    第五，要公平。创新园区里的一个公司不应该寻求对其他公司什么压倒性的优势，得公平竞争。

    第六，允许犯错误，允许失败，还要有韧性，失败了还能再起来。对失败友好的地方，创办新公司才容易，创新才可能。

    第七，为了鼓励别人到你这里来冒险，你可以预先给他一笔投资，然后别太在意回报。


    截此复习：演化的教训


    ## 13.成功跟失败就不是反义词，而是同义词的关系：他们共同的反义词是什么都不做。


