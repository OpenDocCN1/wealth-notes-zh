    # 《范畴》3：学习的快功和慢功


    万维钢·精英文课³

    今天


    进入课程 ›


    《范畴》3：学习的快功和慢功 11:52 8.15 MB


    今天我们继续讲《范畴》这本书。咱们还是先来思考一个问题。


    从前有个年轻人名叫小张，一心想要成为武林高手，前往名门正宗——华山派——拜师学艺。华山派正在开展教学改革实验，对新收弟子搞了个随机分班，小张被分到了岳师父门下。小张学了一阵就感觉师父教得很慢。岳师父总爱讲一大堆理论，还爱东拉西扯，甚至聊什么“武侠文化”；课程的针对性也不足，明明上午讲的是一个招式，下午考试考的却是另一个招式。可是隔壁师叔带的那个班就进步良好，每次考试的成绩都比自己这组高。特别隔壁有个小师妹，据说还是岳师父的女儿，一招一式如行云流水般连贯，真是最亮。


    小张心怀怨恨，他认为岳师父不教真功夫。可是大师兄对他说，咱们这一组 slow 是慢功，隔壁是快功：快功进度快但是缺乏内涵，咱们慢功也许输了现在，可是一定能赢得未来。


    你觉得大师兄说的对吗？世界上真有这种输了现在赢得未来的功夫吗？


    这个故事当然是我编的，但是它有坚实的研究基础，代表一个普遍的学习规律。2017年，美国教育经济学家格雷格·邓肯（Greg Duncan）领导了一项大规模研究，专门提出了一个儿童早期教育的问题，叫“凋零效应（fadeout
    effect）”。


    这个规律是如果你快速给学生灌输一些知识，的确能让他们迅速获得一个成绩优势——但是，这个优势总是保持不了多久就凋零了。别人终归也会学到那些知识，而你这边后劲不足。其实这个凋零效应我们专栏前面讲过，而且它不仅限于早教，所有的教育都有这个效应。


    那这是为啥呢？研究者认为，这是因为能突击灌输的知识，都属于“封闭式”的技能——也就是说都是一些按照规定动作操作的过程。这种知识包教包会，但是缺乏累加作用，不能成为后面继续进步的基础。要想让人没那么容易赶上你，你需要掌握的是“开放式”的技能——这种技能能跟别的知识发生连接，有复制效应。


    但是开放式的技能学得慢。这一讲我们要说四种真正有效的学习方法，他们的共同特点就是慢。你会意识到，输了现在赢得未来的功夫，才是真功夫。


    ## 1.哪种老师好？


    美国空军学院是个很大的教学机构，每年培养很多学员，教学严格而且非常系统化。学员都是军人，但是要学非常正规的高等数学以及科学和工程各方面的课程。所有这些课程的基础是两个学期的微积分，一个叫“微积分Ⅰ”，一个叫“微积分Ⅱ”。有经济学家，专门对空军学院教微积分的方法做了一番研究。


    空军学院先把学员随机分成几个班，每个班讲课的教学不同，但是考试题目和评分标准是完全一样的。而且上完微积分Ⅰ之后还会再随机分一次班，再上微积分Ⅱ。这个制度特别容易看出来哪个老师教得好，哪个老师教得不好。


    这些老师可以分成两类。第一类老师特别善于让学生考出好成绩。他把课程讲得很顺，知识点有条有理，解题操作流程清晰。学生完全知道自己在课堂上得到了什么，练习非常有针对性，考试的时候也是充满信心。第一类老师教的，是快功。


    而第二类老师教的却是慢功。他经常给学生们讲一些规定内容以外的东西，比如把微积分思想和物理学的知识联系起来。他希望学生对微积分能有更深入的理解……而这些都不能直接用在考试上。学生听了课，回去做练习题，都得自己现场想办法解决，因为老师没有搞针对性的套路训练！可想而知，这些学生的考试成绩就不怎么好。


    学生们给第二类老师的评分也不高。也许学生想的是我们都是军人，又不是想当数学家，你为什么不能把课程讲得顺溜一点呢？学生们普遍更喜欢第一类老师。


    但是，经济学家用数据证明，喜欢给知识建立连接的第二类老师，教的才是真功夫。研究者关心的不是学生们在“微积分Ⅰ”中的考试成绩，而是他们是不是真的掌握了微积分——而这体现在学生们在后续课程，比如微积分Ⅱ、以及会用到微积分的科学和工程课程中的表现。结果非常明显，第一类老师教出来的学生在后续课程中遭遇了困难；而那些第二类老师教出来的学生，在后续课程中反而表现很好。


    这个现象并不仅仅发生在空军学院。意大利的一个大学也做过类似的研究，研究者观察了1200个大学生，发现那些被学生评价不好、没有让学生考高分的大一课程的老师，他们教出来的学生在后续的学习中反而表现更好。


    有的老师教应试技巧，有的老师教真功夫……连学生都喜欢第一类老师，他们是不是已经忘了，学习的目的不仅仅是为了考试。


    ## 2.直接练和交替练


    对有经验的老师来说，想要让学生学得又快又能在考试中取得好成绩，那是比较容易的。最好的办法就是直接练习：教一遍操作规则，然后马上用这个规则去练习。


    比如今天讲的是数学，那就分析一种题型，总结一个解题套路，讲完课马上让你做十道相同题型的练习题。你会做得非常得心应手，第二天马上测试这个题型你的成绩肯定好。


    可是我们想想，真实生活中的问题是这样的吗？比如你今天下午会在工作中遇到一个难题，你能先在上午学好这方面的套路吗？不可能。问题都是猝不及防的，有的是你从来没见过的新题型，你需要的不仅仅是如何操作哪一招，你先得能判断该用哪一招才行！


    正确的练习方法是混合练习。每次练习中都应该是混合的题型，每做一道题都得临时判断该用哪个套路，这才有点学以致用的意思。


    爱德斯坦举了个例子。比如你想学习欣赏著名画家的画作，你希望拥有看到一幅画就能判断它是哪个画家的作品这种能力。一个方法是依次数学习每个画家的作品，比如先连续看10幅毕加索，再看10幅梵高，再看10幅伦勃朗；另一个方法就是把这几个画家的画混在一起，一个一个分别判断。第二种方法会让你出错很多，但是它更能加深你对不同画家风格差异的认识。


    美国海军陆战队训练搞过一次研究。学员分成两组，第一组是直接分块练习，也就是先教一个套路，然后猛练这个套路。第二组是混合练习，每次练习都是混着练，今天教的套路和今天练的套路很可能不一样。


    在每天进行的测试中，我们可以想见，第一组的成绩总是比第二组好，因为他们所练即所学，所考即所练。但是在所有训练项目结束之后的期末大比武之中，因为问题都是新的，你必须自己决定用哪一招，第二组则是击溃了第一组。


    这个道理有点反直觉但是同时又符合直觉。把课程分成若干块，每次学什么就练什么，这难道不是最自然的学习方式吗？真不是。这是体制化。混合交替训练才是最自然的学习方式。


    甚至有研究发现，连续钢琴练习也应该使用混合方法。比如我们现在要学一个高级技巧：在0.2秒之内，用左手跨越15个琴键做一个动作。研究者规定每人可以回家练习190次。有些人回去把这190次就只练这个动作，而有些人则是交替练习了跨8个、12个、15个和22个琴键……测试结果发现，用混合练习的这组人的掌握程度明显更好。


    有句格言叫“手里拿着锤子的人看什么东西都是钉子”，其实说的是那些只会演练自己那几套路而不知道变通的人。混合练习，每一次都现场判断该用哪一招，能帮你克服这个弱点。


    建立连接和混合练习这两个方法都是教你如何活学活用，下面我们再说两个如何加深记忆力的方法。


    ## 3.测试和间隔


    心理学家有个说法叫“有利的困难（desirable difficulty）”，意思是说它看起来是个困难，但是你想要这个困难，因为它能让你深度学习。有困难，才是真学习。


    要加深对新知识的记忆，一个办法是先测验后学。这个知识点你还没学过，上来就测验肯定很容易答错，但是这就对了，犯错能让你的印象更深。特别是如果你的自信心特别强，你越是相信那个是对的，结果发现它不对的时候，你的印象就越深，你就越容易记住这个知识。


    另一个方法有意识地设置时间间隔。这个我们以前讲过，不要追求在几天之内突击学完一个课程。你是可以做到，但学完之后你的印象不深。最好的办法是同时学几门课，今天学完这个，故意放一两天不学它
    —— 可以称之为 “刻意不练习” —— 间隔一段时间之后再学。


    几天之后回来，当你提取这段记忆的时候，你会感到有点困难 —— 有困难就对了，这就是我们想要的那个 “有利的困难”。克服困难才能深度学习。


    学习，真是一个有意思的活动啊。一说起来人人都知道逆境可以让人学会新东西，什么 “吃一堑长一智”、什么 “不经历风雨怎么见彩虹” —— 可是真要学习的时候，人们还是希望老师把什么东西都弄好，让你顺顺当地考个好成绩。


    殊不知 “吃一堑长一智” 这句话用在战略上是不可行的。一般人通常不会从自己的失败中吸取教训，我们都喜欢把失败归咎于别人……其实这句话应该用在战术上。你需要的是小失败、小挫折、小错误，你需要练习中的困境，你需要
    “有利的困难”。


    2007年，美国教育部搞了一次大规模的研究，调研了很多老师和学生，想弄清楚到底什么学习方法是真正有效的。结果经得起科学验证的方法只有这么几个：间隔、测验、和建立连接。也就是我们今天讲的这些。


    也许后发才能先至，也许慢功夫才是真功夫。也许练别的也是为了练这个，也许不练习也是为了练习。也许犯过错误的人生才是真实的人生。


    你想想这个原理是不是特别有意思。遭遇困难才是真的学习，这大约也是学习的门槛。因为有这个门槛，才能把行的人和不行的人分开。如果你是行的人，你会很高兴门槛是这样的。


    注释

    [1] 精英日课第一季，《忘记是为了更好的记住》。


