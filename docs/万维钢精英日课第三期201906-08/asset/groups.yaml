    《模型思考者》5:传播公式。

    11:23 7.82 MB


    转载：沙沙


    我们继续讲斯科特·佩奇的《模型思考者》这本书。如果xyoux新x闻传播或者市场营销感兴趣，这一讲可能对你很有用。我们要讲几个信息传播的模型。


    而使用其中一个模型，我们可以根据咱们“得到”上的一个课程上新头两天的销售数据，判断它在整个活跃期的总销量。


    不管你感兴趣的是新闻传播、产品的销售过程还是一首歌曲是怎么流行的，在科学家眼中，这些事儿都可以和传染病的传播进行类比。传播学在一定程度上就是传染病学。咱们先借鉴几个传染病学的概念。


    第一个概念叫“相关人群”，代表所有可能会被感染这个病毒的人的总数。如果你要卖一本书，相关人群就是所有可能买你这本书的人。请注意我们说的是有意义的可能性，也就是说你真把这本书摆在他面前，他一定会买，你要解决的问题仅仅是如何让他知道这本书的存在。所以相关人群不等于全中国的人口，相关人群是你的市场上限。我们用字母
    N 代表相关人群的总数。


    第二个概念叫“已感染人群”，意思是在此时此刻，已经感染了病毒的人数，我们用 I t 表示，t 代表时间。


    第三个概念叫“未感染人群”，是此时此刻相关人群中剩下的、还没有被病毒感染的人群，用 S t 表示。


    现在你只要记住这三个概念就行，其中


    ```

    S_t = N - I_t

    ```


    信息的传播，基本上有两种方式。一种叫广播，一种叫扩散。下面咱们分别来看。


    ### 1.广播


    广播式传播，是我们都从公共渠道获得信息。它的特点是每天的感染概率是一样的。


    比如华为最近发布了“鸿蒙”操作系统，这件事是你从电视新闻或者网上看到的。我们假设你在发布当天有 30%的可能性被感染，也就是收到消息。那如果你第一天没看新闻，没关系，第二天媒体上仍然在报道和讨论，你还是有
    30%的可能性收到……然后第三天还可能收到……你在几天之内，终将收到消息。


    那你说为何每天的概率都一样呢？这当然是为了模型的简化。不过这已经是个很不错的近似。


    广播的传播公式是


    ```

    I_{t+1} = I_t + P_b · S_t

    ```


    其中这个 P b 就是感染概率。通过简单的数学计算，广播这种模式的传播曲线是下面这样的 ——


    ![](img/b58c3137b911797b913643bab2c018ea_100_0.png)


    其中横坐标是时间，纵坐标是被感染的总人数。


    新闻发布第一天收到消息的人数肯定是最多的，所以我们看到广播曲线初期的增长速度非常快，越来越慢，最后达到 N，也就是所有人人都被感染了。


    咱们得到的课程销售，很大程度上就是广播式的。新课程上线会有好几天饱和式的宣传，用户打开得到首页就能看到。课程销量也是第一天最高，此后逐渐递减。我们假设得到上新的一门课程，第一天购买总数是1万人，第二天又有
    8千人购买，总人数达到了18000人。那你能不能仅用这两天的数据，估算一下这个课程总共能卖出多少份呢？


    套用前面的公式，I1 = PbN = 1万，I2 = I1 + Pb (N - I1) = 1.8万，简单解方程就知道，N = 5万，Pb = 0.2，所以这个课会卖出
    5 万份。这个估计不可能是精确的，比如 Pb 会有波动变化，读者的口碑会有影响，但是它不会相差太远。两天的数据已经很能说明问题了。


    新闻的传播、知名品牌发布新产品之后的销售情况，基本都是广播式的。


    ### 2.扩散


    第二种传播方式叫“扩散”。扩散是人传人，就好像病毒一样，我们是被自己接触到的人给传染。扩散的特点是已经被感染的人越多，传染的速度就越快。


    我们假定人群是随机地混合在一起，那么扩散传播的公式是


    ```

    I_{t+1} = I_t + P_d · I_t / N · S_t

    ```


    其中的 P d 代表扩散传播的概率，也是一个常数，但是我们看到，这时候新被感染的人数跟已经被感染的人数在人群中所占的比例有关。扩散的传播曲线是我们常说的“S曲线”——


    ![](img/b58c3137b911797b913643bab2c018ea_100_1.png)


    上面这张图说的是 Google+ 这个服务推出之后，用户的增长情况。Google 公司并没有搞大张旗鼓的宣传，主要靠人传人。一开始好几天使用的人数都很少，所以传播速度也慢，然后终于在第五天迎来拐点。等到相关人群都用上了，扩散就算结束。整个过程是开始慢、中间快、后来又变慢。


    我们专栏在第二季的《复利的鸡汤和真实世界的增长》这篇文章中列举了艾滋病的传播和手机作为一个新技术被人们采纳的曲线，都满足S曲线。一开始人们并没有使用手机的习惯，新闻媒体的说服力并不大。但是等到你发现身边的人开始用手机之后，你才意识到手机的确有用，你才会去买手机。对改变生活习惯来说，你的朋友比媒体更有说服力。


    大部分传播都同时具有广播和扩散的性质，这两个模型能告诉我们一些道理。我们看到广播式传播和扩散式传播，都是由 P 值和 N 这两个参数所决定的。这里面有個有意思的性质——


    不管 P 值是多少，传播最终都会达到整个 N 值。


    这个性质对市场营销非常有启发。对产品来说，N 值主要由这个产品本身的质量和传播的最终范围决定：东西摆在一个人面前，他买还是不买。


    而在市场营销方面，对广播来说，P 值代表媒体播出的频率和强度，N 值取决于媒体的覆盖面积；对扩散来说，P 值代表人们是否愿意分享这个东西，以及人群之间的关系紧密程度，N
    值取决于社交网络中易感人群的总数。


    为了增加 P 值，你可能会花很多钱在媒体上播狂轰滥炸，你可能会给那些能带来新用户的人提供奖励……


    可是营销到底有多大用处呢？如果传播终将达到整个相关人群，早期强力营销的作用仅仅是把这个进程给加快而已！少花点钱做广告，你的产品终究也能卖那么多……


    吗？并不是。我们前面的分析少考虑了一个关键因素。


    ### 3.SIR模型


    这个关键因素是“恢复”。信息会被人忘记，传染病会痊愈，流行会退潮。如果你感染病毒一段时间之后痊愈了，你就不再是传染源了。


    考虑到这一点，我们引入一个新的概率，叫 Pr, 代表恢复率。这时候新的扩散公式变成


    变成


    ```

    $I_{t+1} = I_t + P_d \cdot \frac{I_t}{N} \cdot S_t - P_r I_t$

    ```


    这个公式叫SIR模型。因为恢复率的存在，有些信息就不会被传播到整个相关人群。


    比如一首歌刚出来的时候你觉得挺好听，就发个朋友圈分享给你的朋友。你的朋友们一听也觉得好听，就继续传播，这是一个扩散的模式……但你不会每天都为这首歌发朋友圈。可能几天之后你就把这首歌忘了，你不再是个分享者，你痊愈了。


    一首被人快速遗忘的歌曲，哪怕摆在你面前真的挺好听，也不会传播很远。那什么样的病毒能被传播开来呢？疾病防控中心的研究者关注一个参数，叫做 R0，称为“基础繁殖数（basic
    reproduction number）”，是扩散概率和恢复概率之间的比值：


    ```

    $R_0 = \frac{P_d}{P_r}$

    ```


    R0>1，这个东西就可以传播到整个相关人群，R0<1，它就不能发挥全部的潜能，传播上一段时间后就会自行消亡。


    R0，才是真正的引爆点。以前格拉德威尔在《引爆流行》这本书中把前面Google+的传播图形中的那个拐点称为引爆点，那是不对的。只要 R0 够高，拐点是必然的过程，根本没有悬念。


    R0，是营销真正的悬念。


    比如你在微博发了一个段子，希望能得到广泛传播。如果人们对这个段子的好感度稍微高那么一点，扩散概率就会高一点，也许正好超过遗忘概率，你的段子就真能到达整个微博中对它感兴趣的人。而如果你写得稍微差了那么一点，R0<1，它就只能小范围传播。


    如果是扩散再结合广播式的传播，这就要 求市场营销的力度稍微大一点，战胜人们的遗忘概率。


    有人计算，流行歌手贾斯汀·比伯的 R0 = 24，比麻疹病毒都厉害。


    总结来说，信息传播和市场营销的目标都是把信息传播到整个相关人群，并且希望相关人群越大越好。


    对成熟品牌发布的新产品和新闻广播这种短期的传播来说，因为相关人群就只有这么大，营销手段的主要作用是加速传播的进程。


    而对新兴的技术和病毒来说，因为主要依靠人传人，而且人还有遗忘的概率，营销能力就变得至关重要，决定了是否达到引爆点。


    而不论是哪一种情况，营销水平都跟产品本身非常有关系。只有产品足够好，人们的分享和感染概率才会大。


    那有些公司搞一些假数据，人为制造一个早期销量很高的样子，请问这种营销手段有用吗？从这些数学模型看来，我认为没用。成熟的用户不会看见数字高就真的以为这里人多、更不会就买——真正起作用的是隐藏在背后的
    N 值和 P 值，而假数据改变不了这两个数字。人为地把 I1 做大一点，那些虚假用户不会真的帮你扩散。


