    当前中国真正的垃圾问题是怎么更好地收集和控制垃圾，不要让人到处乱扔。而复杂的垃圾分类搞不好还会迫使人们乱扔垃圾。


    那你说像日本的垃圾分类不就做得很好吗？那可能不是经验，而是教训。日本人本来可以过更轻松的生活，是日本政府刷存在感，逼着老百姓搞垃圾分类的行为艺术。现在中国不收垃圾了，美国和德国的垃圾分类都已经难以为继，我们为啥不吸取教训呢？


    说到底，垃圾并不是什么无法直视的坏东西——垃圾也是原子组成的物质，就来自于我们的身边，只是角色变了。垃圾不是无情物，化作填埋……也能起到支撑地球表面的作用。


