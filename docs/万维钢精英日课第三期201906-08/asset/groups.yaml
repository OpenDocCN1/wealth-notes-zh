    # 学而不思则矛盾，思而不学则极端


    万维钢·精读日课³

    今天

    进入详情 >


    学而不思则矛盾，思而不学。 11:40  8.02 MB


    > [音乐推荐曲：沙沙]


    戴维·爱泼斯坦的《范园》这本书讲到类比思维的时候提到一项有意思的研究，我觉得值得咱们特别了解一下。


    2012年，悉尼大学的商业战略学教授丹·洛瓦罗（Dan Lovallo）组织了这么一个实验。研究者邀请了一些来自大投资公司的投资家，让他们评估一下各自自己手头正在做的项目。比如你投资了一个高科技创业公司，那么研究者希望你详细说一说，你认为这个公司将来会如何发展，一步一步都列好，特别是最后要估算一下，你这笔投资的回报率，将会有多少。


    投资者们也觉得这挺有意思，都很配合。然后研究者又给他们一个任务，说你看看现在有没有跟你这个项目类似概念的、但是是别人做的项目，然后评估一下那些项目的回报率大概能有多少。


    然后研究者把所有这些评估放在一起，做了一番比较。如果你经常听到上的课，你大概能猜得到比较的结果——


    结果是这些投资者对自己项目的预期回报率，比类似项目的预期回报率平均高了50%。


    显然投资者都是过度自信的。他们评估自己的投资项目就好像一般人评估自己开车的水准一样，都以为自己在平均水平之上。但洛瓦罗搞这个实验并不仅仅是为了证明“过度自信”。一般人高估自己的驾驶汽车的水准，那是有情可原，因为一般人并不会整天跟别人比驾驶技术，一般人不了解“一般人”的驾驶技术是什么水平。但是这是可是投资公司啊！这帮人整天干的事儿就是评估项目！你怎么可能连公平评估项目回报预期都做不到呢？


    研究人员把这个结果摆在那些参与实验的投资者面前，这些投资者也震惊了，而且越是资历的投资者越感到震惊。但是他们接受现实，立即修改了对自己项目的预期。


    *


    洛瓦罗想要通过这个实验验证的学说，叫做“外部视角（outside view）”。这是他和我们熟悉的《思考·快与慢》的作者丹尼尔·卡尼曼共同提出的一个概念。让卡尼曼获得灵感的当初他的一段个人经历，我们专栏讲决策科学的时候说过这个故事
    [1]。


    卡尼曼和几个人合作编写一本教材，他们原本预期大约用两年时间完成。但是卡尼曼听说，别人的组编写类似的教材，大多需要 7 到 10 年才能完成。他们这些人觉得这根本不可能，因为按照自己的进度完全可以很快完成……结果他们实际用了
    8 年才完成。


    这件事情的教训是如果你要预测自己干一件事情的结果如何，你应该参考那些跟你差不多的 人、做类似的事情的结果如何。我们当时讲过，别人做的平均水平，构成了一个“基础比率（base
    rate）”，这个基础比率就是你预测最好的参考标准。


    用今天说的概念来说，自己看自己，是“内部视角（inside view）”；用别人的结果判断，则是“外部视角”。那么为什么外部视角更好呢？


    卡尼曼说 [2]，这是因为你用内部视角考虑问题容易不周全。拿编写教材这件事情来说，用内部视角就是用自己在开头的工作进度去预测后面的工作进度。如果你计划总共写
    10 章，而你四个月就已经完成了前面两章，那你很自然地就会认为自己两个月就能写一章，就算是考虑到后面可能会遇到意外耽误时间，估计两年时间也够了。


    这个做法其实就是“外推”——而我们专栏前面刚刚讲过“外推谬误”。事情往往不是按照固定的速率直线发展的。可能前两章比较好写，可能我们开头最有干劲，更可能后面会遇到极其严重的困难。事实上卡尼曼的教材编写后来遇到了各种困难，有人离婚了，有人病了，各种管理问题，再想如同开始那样协调全组顺畅工作十分困难。


    而这些困难的特点是既是意料之外又是情理之中：你没做过你就想不到，而做过的人基本都遇到了。正因为这个特点，问自己会如何就不如问别人都是如何。外部视角能看到内部视角看不到的关键信息。


    但是这还不能完全解释为什么那些投资者不能公平判断自己的项目。要知道卡尼曼他们并不经常编写教材，对困难估计不足完全可以理解——可那些投资者可是经常要看项目的哩。


    这就引出了另一个效应。


    *


    洛瓦罗等人发现，那些投资者如果对自己投资的项目细节了解越深，他们自已估计的回报率就越高。也就是说，内部视角看到的信息越多，你的判断就会越极端。


    这才是我们这一讲要说 重点。我给你打个比方。比如你有个远房表弟，学习成绩不错，说要报考清华大学。你乍听之下觉得这不太靠谱，因为清华是中国录取分数线最高 的大学，你表弟平时的成绩虽然在自己学校排名不错，但是距离清华似乎还有一定的差距。


    然后你深入了解了一下表弟的情况。他从小就把上清华当作理想，还曾经专门去过清华，而且他已经想好了要报考哪个系。现在距离高考还有一年时间，表弟制定了详细的复习计划，每天都有任务、有监督、有总结。他把自己的强项和弱点都一一列举出来了，他完全知道在这一年里要怎么做，才能考上清华。


    那请问，你听了这些之后，是不是也会觉得表弟上清华这件事情从不靠谱变成有点靠谱了呢？然后你还专门观察了他几天，发现他的确严格执行了复习计划，可以说每天都在进步！这时候你是不是也相信他能考上
    了呢？


    这是人之常情。越了解就越相信，难道这有什么问题吗？


    # 问题就在于这只是内部视角。你表弟是很努力，但是思考清华的高中生有哪个是不努力的呢？难道别人就没有复习计划、别人就不是每天都在进步吗？现实是大家都在努力进步，清华每年还是只录取那么一  个人。努力和进步并不代表一定成功。


    想要知道你表弟行不行，你需要外部视角。你得知道那些跟他差不多水平、差不 多做法的 人，结果都是怎么样的。


    *


    这个道理是如果一个人不去收集一些客观信息，只根据自己这边的 信息坐在一旁空想，就容易越想越觉得要做的这件事情能做到。你会一厢情愿地脑补一些东西，你会不自觉地假设事情按照你想要的方向发展。你越想，你设想的那个画面就越鲜活。你越想，你对自己的信念就越深。你越想，你的判断就会越极端。


    以前有个 人说他有一些关于未来世界格局的想法，要写本书。我还在想他这本书值不值得出版，他就说这本书的目标是卖一百万册！我赶紧告诉他现在图书市场是什么行情：一般能卖一万册就已经算是不错的成绩，十万册就是绝对的畅销书，一百万册的根本就没几本！


    内部视角容易让人走极端。为啥孤独的人容易产生仇恨社会的极端思想呢？因为他头脑里只有一个声音 [3]。遇到一点挫折，没有人从另一个角度帮他分析，他会越想越觉得这个太严重了，他会钻进去出不来。


    这大约是一个普遍的认知规律。


    *


    如果一个人从来不读书，只知道一些道听途说的东西，他对世界上各种事物的看法将会是非 常极端的。他会给遥远的 事物都打上标签，他会有各种偏见。可能哪个韩国人做了对不起中国人的事情，他听说之后就很容易对整个韩国都充满敌意。


    为什么老一辈的人让我 们谦虚一点、对不 懂的事情少表态呢？因为你一表态就是极端的，而你自以为的故作谦虚，其实更接近真相……


    如果我们只用内部视角考虑自己已知的这些信息 的行为叫做“思”，把使用外部视角多了解一些外边 的事物和别人的看法这个行为叫做“学”，那么这个规律就是——“思而不学则极端”。


    反过来 说，只有外部视角也是不行的。如果一个人读书很多说些什么东西来都举头……'
