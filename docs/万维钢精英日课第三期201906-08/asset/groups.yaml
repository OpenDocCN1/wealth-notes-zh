    # 《历史的正确一侧》2：

    一神论高在哪里


    万维钢·精英日课³

    今天

    进入课程 ›


    《历史的正确一侧》2：一神论

    13:48  9.48 MB


    转载：寻梦


    今天我们继续讲本·亚里皮罗《历史的正确一侧》这本书。这本书说的是西方文明到底是因为什么强的，但我们知道，研究一个东西为什么强，你可能会面临“幸存者偏差”。一个成功人士做过很多事，你不能说他做的每件事都有利于成功。你不能因为西方取得了强盛地位，就说西方当初做的所有事情都是对的。


    但是历史没法做比较实验。我们没办法用科学方法判断西方到底是怎么强大的，我们只能使用一些“理论”分析。那怎么判断，西方文明中有那些文化基因导致了它的强盛呢？


    我觉得标准就是看着这个基因是否在历史上发挥过正面作用，以及它有没有现代意义。


    袁皮罗提出西方文明有两大支柱，一个是耶路撒冷，一个是雅典。今天这一讲说的是耶路撒冷。耶路撒冷的贡献是它给西方提供了“一神论”这个文化基因。我们知道原始宗教都是多神论，那一神论比多神论高级在哪里？


    ## 1.从多神论到一神论


    我对宗教没有多大兴趣，为了写这篇解读特地去读了一点《圣经》。我读了创世纪的部分……感觉怎么说呢，反正如果有人说《圣经》是有史以来最伟大的文字，我肯定是不能接受。


    但是你要知道，《圣经》是两千多年以前的产物，那时候的主流宗教是多神论。首先根本就没有无神论，所有人都迷信……而多神论，是最自然的信仰。


    打雷因为有雷神，下雨是因为有龙王，生不出孩子可以去拜一拜送子观音。中国沿海地区拜的妈祖，负责保护出海远航。我们看郭台铭要竞选台湾地区领导人，还得弄个妈祖来托他的故事。多神论的特点是每个神各管一摊事儿，有的管一个专职，有的管一个地区。像土地庙中的土地专管地方事物，就好像基层干部一样。


    多神论有它的好处。多神论系统可以随时添加新神。关羽生前是个英雄，死了我们可以给他封神。多神论还能体现世界的复杂性。赫拉利在《未来简史》中说[1]，在多神论中，神和神之间互相斗，所以每件事情的结果都不是注定的，这能够解释世界的确定性，这不更真实吗？


    但是袁皮罗提醒我们，多神论是一种落后的世界观。因为在多神论的世界里，你作为一个平民百姓，是非常被动的。


    大事儿都是神仙说了算。你想成什么事儿都得去求神保佑，要许愿，要拿贡品贿赂神。然后神的脾气还飘忽不定，这次高兴了就给你一个回报，可是下次你给的祭祀更丰盛，神却也没给！对此你无法质疑，也许神那两天脾气不好，也许这件事儿还有别的神在管，反正神不需要给你解释。


    在多神论的世界里，人就好像在海上漂泊的一块木头，对自身的命运没有任何控制感。


    突然有一天，犹太教创立了。先知告诉你四件事情，是犹太教和后来基督教一脉相传的信念——


    - 第一，只有一個上帝，这个世界有统一的规律。上帝有他的安排，世界并不是什么都不确定的一个混沌。

    - 第二，人要有行为规范，你要遵守道德准则。你这么做并不是因为对你有好处，而是因为那是你的义务。

    - 第三，历史要不断前进，人类最终要完成对全体的救赎。

    - 第四，每个人有自己的自由意志。你有选择的权利，并且要为自己选择的结果负责。你不是奴隶。


    我们想想，在那个多神论的世界里，你本来是漂泊的浮萍，听到这些是不是就好像在黑暗中看到了光明呢？


    咱们来分析一下这些理念的先进性。


    ## 2.世界有规律


    我们现代人从小学习科学知识，知道世界上万事万物都有规律，古人可没有这个概念。多神论时代的古人认为一件事情能不能发生得看神的意志，神想怎样就怎样。明明这人是个坏人，可是神喜欢他，他就能发财。我们只能求神，我们控制不了自身命运……事实上有时候连神自己都控制不了自己，比如希腊神话里那些神，一发怒就造成可怕的后果。


    但是—神论出现了，说世界是有规则的，而且上帝本人也得遵守那些规则。而且上帝允许你对他提出质疑，他有时候还跟你讨论！


    《圣经·创世纪》中有—段，记载了亚伯拉罕和上帝之间的对话。上帝说所多玛和蛾摩拉这两个城里的人都坏透了，是罪恶之城，他要毁灭这两个城。亚伯拉罕就说，这两个城里也有好人啊！把好人和坏人一起杀死，这不像是你的作风啊？如果城里有50个好人，你能不能豁免这两个城？


    上帝居然同意了。然后双方还讨价还价一番，最后达成的协议是，只要城中有10个好人，上帝就不毁灭这两座城……当然故事结局是两座城还是被毁灭了，可能城中的好人的确不到10个。不过上帝放免了亚伯拉罕的侄子一家四口。


    你看上帝并不是由着脾气办事的，他允许你跟他讲理，而且他自己也得遵守他设定的行为规范。


    当然，人仍然无法完全理解上帝，这表现在世界仍然有不确定性。某人明明是个好人，为啥死掉了呢？面对这样的事情，你可以有两种反应。


    一种是放弃理解。说世界上有些事就是我们凡人不能理解的，也可能神有别的安排，也可能神脾气不好，也可能神说了也不算，反正我们就别瞎操心了。


    另一种反应则是，虽然我现在无法理解，但是我相信它背后一定有道理。也许上帝有比人更高的善恶标准，也许他另有安排，只是这个道理我还不知道。我现在不理解不要紧，我积极探索，也许将来就能理解。


    那你比较一下，是不是后者更有可能带来科学。


    而且上帝并不要求人老老实实全盘接受他的做法，他希望你能去质疑、去追问他，希望你有内心的挣扎。那可是两千年前。一群对自然知之甚少的人在黑暗中摸索，他们居然就相信了世界是有规律的，以至于连神自己都得遵守规律。这个基因一旦种下，是不是蕴涵了强大的力量。


    ## 3.个人有自由


    袁皮罗认为，《圣经》中最重要的一句话就是“上帝照着自己的形象造人”。这句话厉害就厉害在，它告诉你，你是有价值的。


    原始宗教，像古埃及人，认为法老是神，普通人地位非常卑微，只能做神的奴仆。咱们中国的做法是皇帝是天子。现在《圣经》说每个人都是上帝用他自身的形象制造的，这不是一个巨大的进步？


    一神论对人提出的要求是既然你是上帝用自己的形象造出来的，你就有神性，你就应该完善自我，去模仿上帝。这就说明人不但有价值，而且还是自由的。这表现在你有自由意志，你有选择权。


    《圣经》故事的一个特点就是上帝经常试着让人选择，他不是说你别想了你就得这么做。


    亚当和夏娃在伊甸园中，上帝说这棵树上的果子你们千万不能吃。但这只是一个提醒！上帝并没有用魔法让他们看不见这棵树，也没说把树给锁起来——上帝告诉他们不要吃，但实际上吃与不吃都是自己的选择。当然，有选择权，就要为自己的选择负责；但是，你有选择权。


    上帝希望你选对的，但是允许你选错的。你看这个劲头是不是有点高级。因为人有自由意志，所以人既不是上帝的奴仆，也不是上帝的工具，人和上帝是合作关系。也正因为人有自由意志，是独立自主的行动者，人才可以去发现上帝更多的奥妙，去探索这个世界。


    那么既然是合作关系，我们合作要干啥呢？要推动历史进步。


    要推动历史进步。


    ## 4.历史有方向


    在世界其他文化看来，历史并不是在前进。有的像佛教，认为历史无始无终，永远都是一样的。有的像《三国演义》开头，说“话说天下大势，分久必合，合久必分”，认为历史是循环的。而儒家还总认为今不如古，动不动就要求回归上古的“三代之治”。


    在多神论的世界里，神并不关心人类历史怎么演变。神只关心自己这一摊子事管没管好，自己的福利够不够，对全局没什么要求。玉皇大帝的管理风格是日子平平安安就好，出事儿了他才管一管，他并不要求人类进步。


    但《圣经》可不是这样。《圣经》一上来就说时间有一个开始！上帝本人虽然生活在时间之外，但是他引爆了宇宙大爆炸——啊不是，是他用七天时间创造了天地万物。这就直接否定了历史不变论和循环论。


    然后上帝还经常亲自出来微调历史。比如知道大洪水要来了，上帝会亲自安排诺亚去建造一个方舟，把地球上的动植物采样保存。当然他的干预还是比较克制的，没有事事亲力亲为，给人留下自由选择的余地……但是你不能不说，上帝很在意人类社会的发展。


    而历史进步的方向则是让人完善自我，最终让所有人都能接近上帝。


    宗教能提供意义，而意义提供价值观和人生的目的。那听到这里你可能会说，可是上帝终究并不存在啊！


    我觉得这个道理是活得明白不见得就是最好的。有研究说平均而论，信教的人比不信教的人身体更健康。这就好比说有的人明白很多成功都是靠运气，有的人却相信自己的努力——后者可能纯属无知无畏，但是因为这样的人更愿意努力，最后成功的还真是他们。反过来说，对世界看得特别清楚的人，还容易抑郁。


    信仰是真实世界和个人行动之间的矛盾。不过我们这一讲不是探讨信仰，我们关心的是信仰对西方文明的影响。


    我们看看，一个人信了圣经说的这一套理念，认为世界有规律，自己努力就能掌控自己的命运，认为人生的使命是不断自我完善……这不就是一个现代励志青年的形象吗？


    《圣经》中的上帝是一个人格化的存在，他有时候爱絮絮叨叨地跟人说话。那如果我们把上帝人格化的部分都去掉，把《圣经》中的故事都看作是寓言，我们能不能说上帝就是物理定律加上一个人生意义呢？


    事实上，据我所知，像杰斐逊、富兰克林这些美国的国父们，他们经常言及上帝，但他们并不是相信《圣经》上说的每一句话。他们的信仰不是教徒意义上的信仰。有一种观点就认为很多西方先贤说上帝其实说的就是大自然。


    世界有规律，个人有自由，历史有方向，这就是耶路撒冷带给西方文明的进步基因。


    我最近听说，有些研究说，在教会统治的“黑暗的中世纪”，其实西方科技仍然在发展。我们专栏以前也讲过，教会并没有真正迫害科学家，科学研究的一个动力恰恰就是宗教情怀
    [3]。天主教会很大程度上推动了科技进步。有很多传教士到中国传教，不但传教义，也传科技。


    说到这里我就忍不住想，当一个西方传教士来到大清朝，当他看到中国老百姓所谓的信神，都是在贿赂神、是求神保佑，根本不在乎自己有没有自由的时候，他内心会不会稍微违反上帝的要求，产生一种优越感呢？


    注释

    [1] 精英日课第一季，未来简史解读 3 - 活在虚构之中。

    [2] 精英日课第一季，《成功与运气》解读3: 信命不认命。

    [3] 精英日课第一季，样板式的妥协。


