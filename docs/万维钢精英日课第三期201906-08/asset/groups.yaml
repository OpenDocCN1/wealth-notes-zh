    弱化刷分行为的另一方面是不要滥用考核指标。比如信用分数原本就是申请信用卡和贷款用的，人们如果不借钱这个分数就没啥用，也就不至于专门去刷分。可是后来连租房、买汽车保险都要看信用分数，信用分数越来越重要，人们就开始刷分了。


