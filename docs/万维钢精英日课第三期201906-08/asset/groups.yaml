    # 《范畴》1：不赢起跑线的人


    万维钢·精英日课³

    今天

    进入课程 ›


    《范畴》1：不赢起跑线的人

    12:36 8.66 MB


    今天开始我们来讲一本 5 月 28 日刚刚出版的新书，《范畴：为什么通才能在专业化的世界中取胜》（Range: Why Generalists Triumph
    in a Specialized World），作者是科学作家戴维·爱泼斯坦（David J. Epstein）。


    > "I loved RANGE." — Malcolm Gladwell


    ![](img/b58c3137b911797b913643bab2c018ea_2_0.png)


    书名中这个“范畴”的意思是认知的范围，也可以说是你思维的射程。这本书说的是“通才”和“专才”的关系。现代世界的分工越来越细，在几乎每一个领域，能直接受到奖励的，都是专才——你的射击范围有多广并不重要，重要的是你射得够不够准。这是一个要让人一眼就能看出你厉害，就得单点突破的时代。


    那在这个时代里，成为一个所谓的“通才”，还有啥意义呢？咱别急着做利弊分析，先说一点价值观。


    想象有 一天，你在中国著名的音乐殿堂——哈尔滨大剧院——观摩了一场最高水平的音乐比赛。参赛选手是中国最厉害的青少年演奏天才，他们的技法无比纯熟，一看就是多年苦练的结果。有些高度的演奏技巧，据说全世界会有的人都不多。最后赢得冠军的这位少年居然只有十五岁！他将代表中国参加伊丽莎白女王国际音乐竞赛，人说他的前途不可限量。比赛结束之后记者现场采访了冠军的父母，他们说这孩子从四岁开始每天就要至少练琴四个小时，他们为他的成就感到欣慰，并且期待他继续努力，将来成为郎朗那样举世闻名的钢琴家……


    请问，你羡慕这位冠军吗？你希望自己的孩子成为这样的人吗？


    我佩服他的努力。如果他真的能成为另一个郎朗，我会为中国又出了一位世界名人而感到很高兴。但是我并不羡慕他。我羡慕的是另一种人。


    ## 1.天才儿童和多面手


    2006年，体育界的两个传奇人物，泰格·伍兹和罗杰·费德勒见面了。一个是高尔夫球一个是网球，都是绝对高手。后来费德勒回忆起这次见面，说那是一个非常难得的经历，因为那是他第一次遇到一个和他一样对战无不胜这种感觉如此熟悉的人……但费德勒也注意到，两人的经历很不一样。


    ## 2.刻意练习应该从几岁开始？


    ![](img/b58c3137b911797b913643bab2c018ea_2_1.png)


    ## 2.你的尝试期


    感兴趣的项目，训练并不需要有多严肃，关键是好玩。


    对英国一个寄宿制音乐学校的研究表明，那些被判断为出类拔萃的学生，小时候一般会接触至少三种乐器，到后来才选定一种；而水平一般的学生，则是从小就选定了乐器。更有意思的是出类拔萃学生的平均家庭状况——以对音乐的投入程度而论——比一般水平的学生要*低*一些。


    换句话说，那些特别懂行、从小就帮孩子选定了前程的家长，培养出来的并不是出类拔萃的孩子。


    爱泼斯坦特意拿前几年轰动一时的《虎妈战歌》这本书做了反面教材。该书作者、耶鲁大学教授蔡美儿，给自己的两个女儿立下各种严格的规矩，其中一条就是除了钢琴和小提琴什么别的乐器都不许玩。两个女儿从小严格练琴确实练得不错，但是13岁这一年，二女儿Lulu终于抗争，再也不练了——因为小提琴是妈妈给她选的，不是她自己选的。


    你看这跟咱们专栏前面讲的《早教军备竞赛的科学结论》是不是正好对上了。强制性早教可能能赢起跑线，但是后劲不足。该玩的时候可以玩，一直做自己喜欢的事，长大才能突破。


    有些人不同意这个理论，说费德勒那是网球，有些项目就得从小猛练才行，比如足球，难道不是八、九岁就得练好基本功吗？但是爱泼斯坦引用针对2014年夺取世界杯的德国队的一项统计研究，说其中很多球员都不是从少年开始就猛练，他们在十几岁的时候，训练时间跟业余球员差不多，有的一直到20岁才开始发力成为精英。


    而且这个规律还不仅仅适用于体育和音乐。有很多职场上的成功人士，比如后来成了强力CEO的，往往是大器晚成，尝试过很多种工作。有的转业军人退伍以后才去念大学，跟着一群比自己年龄小、甚至可能小很多的人在一个课堂里学科知识，结果后来成了很厉害的科学家。


    美国还有个统计发现，那些增长最快的创业公司的创始人，他们在创业时候的平均年龄，是45岁。


    这些人没赢起跑线。而不赢起跑线给他们带来了至少两方面的优势。


    # 一个是尝试期。对大多数人来说，刻意练习是个一点都不好玩的事情。如果练习内容和练习方法都正确，那剩下的就是比谁能坚持下来——往往是只有真正热爱这个项目、靠内部驱动的人能坚持下来。有个尝试期，尽可能多尝试一些东西，等到自己心智成熟了再主动选择一个方向深入下去，这样的人才有内部驱动。


    我们想想，如果一个转业军人，放着立即就能挣钱的工作不干非得去学物理，他肯定不是为了找工作或者结婚才这样，他肯定非常喜欢物理学，遇到什么难题他一定不会轻易放弃。


    # 第二个优势则是认知上的。尝试过很多项目，做过很多领域的人，他的思维水平会不会比别人强呢？如果一个孩子为了能跟朋友们谈论电影而放弃在网球课上跳级，你难道不觉得这孩子有点思想吗？


    人都说人生是场长跑，我理解这句话的意思并不仅仅是说前面跑太快后面就没有劲儿了——而是后面你可能要换比赛项目，你要尝试各种不同的跑步方式，甚至改变你对“跑步”这件事的认识。


    咱们下一讲再说。


    ![](img/b58c3137b911797b913643bab2c018ea_3_0.png)


