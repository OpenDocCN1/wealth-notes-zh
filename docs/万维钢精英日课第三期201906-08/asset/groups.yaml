    # 《生活黑客》1：黑进生活系统


    万维钢·精英文课³

    今天


    进入课程 ›


    《生活黑客》1: 黑进生活系统

    12:16  8.43 MB


    今天开始我们来说一本2019年3月出版的新书，《生活黑客：系统化生存及其反对者》（Hacking Life: Systematized Living and
    Its Discontents），作者是美国东北大学传播系的助理教授约瑟夫·里吉尔（Joseph M. Reagle Jr.）。


    Joseph M. Reagle, Jr.


    # HACKING LIFE

    SYSTEMATIZED LIVING

    AND ITS DISCONTENTS


    ![](img/b58c3137b911797b913643bab2c018ea_63_0.png)


    生活黑客是一个新兴的社会文化现象，英文中已经有一个专门的名词，叫Lifehacker。你不一定听过这个词，但是你应该已经很熟悉这个现象，也许你自己就是一个生活黑客。


    比如说，如果你特别讲究做事的效率，使用过像GTD之类的时间管理工具，或者你健身的时候会戴个什么运动手环，随时记录自己走了多少步，你做的就是生活黑客们推崇的事情。而如果再进一步，你经常研读“励志与成功”类的学问，并且发明了一套自己的生活管理系统，那你就是一个生活黑客。


    不过里吉尔教授这本书可不是简单地讲“励志方法”。他仔细考察了生活黑客运动的历史，比较了各家的学说，从科学研究的角度评估了各种方法好不好使——特别是，里吉尔还列举了人们对生活黑客的批评，提供了一些反思。


    而我们想要重点从这本书里学习的，是“黑客思维”。我们专栏以前讲过系统思维，黑客思维是系统思维的升级：黑客破解系统。


    现在“励志与成功”这个领域的门派太多kommun了，而我希望这几讲能给你来个“一览众山小”——我们要说的，是高见点下的人生指南。


    # 1.创新阶层


    你注意到没有，几十年前，可没有这么多人钻研“励志与成功”，大家读书都是读什么《做慢与偏见》《红与黑》之类的文学名著。难道以前的人就不想成功吗？为啥今天的人都这么励志呢？


    这是因为现代社会出现了一个“创新阶层（creative class）”，他们的工作和生活方式跟以前的工人非常不一样。创新阶层的成员包括艺术家、工程师、设计师、教育工作者、演员、游戏娱乐业从业者等等。他们的人数在美国已经占到所有工人的30%，我相信在中国也有很高的比例。


    创新阶层既然从事的是创造性的工作，就必须有自己独立的思考和判断。他们不是事事都根据别人的指捻去做，很多情况下根本就没有人管束他们，一般都是自己对自己负责。他们的工时和工作内容都比较灵活，不太受朝九晚五的限制。创新阶层非常自信，他们无需为上班的衣着打扮担心，他们对行业的认同感超过对自己所在公司的认同感。


    创新阶层中的很多人就像是罗胖说的那种“U盘式生存”：自带信息、不装系统、随时插拔、自由协作。他的工作非常独立，而且非常主动。比如一个现代的作家，他就不仅仅要写书，他还得会给自己推广才行，他除了写书还要写公众号和微博……他们都有点创业者的特点。


    如果你多半的工作和省下的时间都是自己的，你会如何工作？创新阶层不抱怨工作多，只恨时间少。你会非常自律，你会想方设法提高工作效率，你甚至还会经常质疑自己现在做的事到底值不值得继续做下去。


    你会琢磨自我管理。


    这就是为什么现在那么流行成功学和励志书。以我之见，相对于以前的人谈论普希金，现在的人谈论查理·芒格，这是社会的进步。我们非常庆幸生活在这个创新阶层崛起的时代。


    而生活黑客，正是创新阶层中最有主意的一群人。


    # 2.黑客思维


    提到黑客你首先想到的肯定是计算机黑客。黑客是能用技术手段入侵计算机系统的人。不过“黑客”这个词其实并不是起源于计算机，最早说的是麻省理工学院一个火车技术爱好者俱乐部里的人。黑客，泛指那些善于折腾技术，能“黑进系统”的人。


    那何必非得是计算机系统呢？日常生活中的各种事物也都可以是系统，而系统，都有两套规则。


    一般人看到的是表面的规则。比如这有个应用程序，表面上的规则就是寻常的使用方法，这个按钮什么功能，那个文件怎么读取——而在黑客眼中，表面之下，这个程序实际上是怎么运行的，另有一套规则。这两套规则之间有个巨大的裂口，使得黑客可以做到普通人做不到、甚至根本就不知道能做的事情。


    举个例子。你在商店买个什么东西，如果用着感觉不喜欢，想退货，一般商店都会要求你出示收据，对吧？那如果你已经把收据丢了，还能退货吗？这好像是个生活琐事，跟黑客没什么关系——但是如果你把购物也看作是一个系统，你深刻理解商店的运作原理，你也许就能做些不一般的事情。


    比如有个生活黑客发现，圣诞节之后，美国各个商店都会有很长的退货队伍。这个时候商家为了节省时间，对退货的要求没那么严格，所以这就是一个好的退货时机。他实验成功了，而且还专门写了一篇文章
    [1] 分享经验——就好像程序员分享技术一样。


    里吉尔还举了一个非常著名的例子，我以前就听说过了。美国威讯通信（Verizon）公司的一个工程师，私自把自己的工作“外包”到了中国。他用自己工资的五分之一，请了一位同样水平中国工程师，远程做他的工作——然后他每天上班就是刷刷网站、看视频。在相当长的时间中都没有人发现……不过最后公司还是发现了，并且指控他把公司内部系统非法授权给外人。


    你看这些事儿本身不是什么了不起的事儿，而且还有道德问题，但是它们体现了黑客的精神。里吉尔说，黑客精神包括四点——


    +   第一，个人主义。我自己决定干什么和怎么干，而不是随大流。


    +   第二，理性。理解原理，崇拜技术，不急不躁不上情绪，想办法解决 问题。


    +   第三，实验。真正的黑客都爱折腾，他们不断刺激和试探系统的边界线，探索背后那套规则。


    +   第四，系统。黑客把一切事物、包括自己的身体，都看成系统。系统是模块化的，你可以把各个部分拆开再重组。系统是按照算法运行的，你可以理解这个算法。系统是可以优化的……而且是可以破解的。


    不过我读这本书的感觉是黑客最重要的精神是敢干。也许你能想到，但是你不一定做到。生活黑客敢于不按照标准操作，会做一些非常端的事情。当普通人穿着一丝不苟的服装，老老实实排队等着走流程的时候，生活黑客早已另辟蹊径。


    我们可以想见，黑客思维主要是“理工科思维”。有些心理学家认为人有两种认知风格，一种直觉式的，从局座考虑问题，掺杂感情因素。而黑客这种系统思维则是另一种风格，注重寻找事物的规律，喜欢探索规则……他们沉默冷静地在黑暗中探索，眼睛和屏幕一起闪闪发光。


    当然，黑客中有一些是坏人。知识就是力量，但知识也只是个力量，并不自带善恶性——拿这个力量去做什么事情，由你自己决定。'
  md: '

    择中的适应度吗？说白了还不是为了生存和发展，为了传宗接代吗？


    ## ★摆脱宗教束缚的同时，西方学者们设想了各种不同的意义


    美国建国和法国大革命之前的政治形态，是个人和国家基本上没关系。人们没有什么国家认同感，对宗教和自己的亲族更有认同感。


    美国宪法倾向于个人主义。个人有天赋人权，国家的作用只是保护个人权利。（★洛克）


    法国大革命开启了集体主义，它有三个派别。（☆伏尔泰、☆卢梭）


    - 1. 浪漫民族主义是个人要为国家服务，国家要对外竞争，要搞帝国主义。

    - 2. 集体财富再分配主义不在乎国与国的竞争，但是要求国家为个人服务，消除阶级差异和贫富差距。

    - 3. 科学进步主义则要求国家率领个人进步，并且为此可以直接干预经济和社会生活。


    ## ★战后继续较真：人为什么活着？


    上帝已死，雅典哲学家的 telos也被抛弃了，后世的人又想出了其他的意义，比如单纯就是为了生存，或者为了享乐，特别欧洲大陆曾经奉行集体主义。集体主义容易走极端，带来过巨大的灾难，所以集体主义在二战以后就基本上被西方抛弃了。


    科学能提供人生的意义吗？科学家的“新启蒙”运动想完全从科学出发，去推导一套人生意义。生物学家☆爱德华·威尔逊就是一位新启蒙主义者，他试图使用生物学知识推演个人和社会的行为规范。但是科学只能告诉你世界是什么样子，而没告诉你应该怎么办。新启蒙主义者的努力也许将是徒劳的。


    自然能提供人生的意义吗？另有一派思想家也讲科学，但是并不讲理性。他们认为科学其实告诉我们，人本来就是一种动物，受各种欲念支配……那我们为啥不回归自然，释放天性呢？真实的天性，就是我们应该追求的意义。追求天性这一派，最终走向了享乐主义。代表人物是☆弗洛伊德和☆金赛。


    自己的内心能提供人生的意义吗？存在主义最早可以追溯到丹麦哲学家☆索伦·克尔凯郭尔，代表人物有☆海德格尔和☆萨特。存在主义说的是，人的“本质”是次要的，人的“存在”，这个事实，才是关键。别的都不重要，都有可能是假的，唯一重要的，唯一绝对是真的的，是你存在。所以人应该向自己的内心寻求，问问自己想要什么。你自己，才是你人生意义的来源。存在主义认为所有的知识，都只不过是“解释”而已。这是“后现代”的典型思想。


    ## ★现在的美国，某些人的人生意义


    现在的美国，两党支持者严重分裂，社会分歧越来越大。特别有一群极端的自由主义者，中国人称之为“白左”，他们的所作所为、言论和思想，好像有点不可理喻。新左派运动的特点是三点


    - 1. 认为主观大于客观。客观对错不重要，重要的我要有自豪感；

    - 2. 不相信人能够掌控自己的命运，认为自己的不幸都是社会压迫，社会必须改变，才能改变自己；

    - 3. 把理性科学，也当做是专制压迫的手段。


    这是当前美国社会的重大矛盾。族群身份，已经成了某些人的人生意义。


    思想，超越英雄和王朝。各路思想在千年的历史中交锋、融合和转变，就如同神力的修练和过招。有些人扮演思想的传承者，有些人扮演鼓吹者和维护者，有些人扮演创造者一一而其余的人，无论权势再大，人数再多，也不过是一堆案例和数据。历史因为思想而改变。


