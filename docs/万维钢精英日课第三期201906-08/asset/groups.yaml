    # 读者樾琪投手：


    开红酒不一定要用开瓶器。打火机加热瓶口，软木塞自动喷出。使用筷子也能开瓶盖以及完成其他的许多事。既然用简单工具就能完成专业领域的事情，为什么还要用单一功能的工具呢？


    万维钢


    这个问题本质是如何理解黑客的“工具主义”。偶尔对付一下的确是可以的，俗话说武林高手“飞花摘叶皆可伤人，草木竹石均可为剑”……那么为什么大侠们还非得有一两件趁手的兵器呢？


    专业选手会对工具非常非常敏感。我听说乒乓球运动员都不用现成的球拍，都是买个板，然后自己配胶皮。我偶尔也打乒乓球，但是没体会到胶皮有那么大的不同，我感觉标准球拍就已经挺好，所以我就有点怀疑，胶皮是不是真的那么重要。


    我的一个朋友业余打乒乓球打了很多年，每周都训练，现在水平相当于一个十二岁的专业运动员。我就特意问他，你对胶皮是不是也那么敏感。他说的是。他不是专业的乒乓球运动员，但他也是自己选择胶皮粘球拍。胶皮的弹性稍微差一点点，他感觉就顺手。他说胶皮要是太不对，平均每周会白丢一到两分。


    乒乓球每局最多丢 11 分，一两分就是 10% 以上的差距。而用专门的开瓶器开红酒，比打火机加热法的效率提高了远不止 10% —— 也许是 600%。


    你对工作的敏感度，到了在乎 10% 的水平了吗？专业选手会非常在乎。如果有什么装备能让职业运动员的成绩提高哪怕 1%，他们一定愿意多花几倍的价钱得到。


    而这还不仅仅是竞争和效率的问题。对一项工作做到精熟的时候，你自然就会变得敏感。像我是个写作者，我对键盘比较敏感，换了好几个。我完全不能容忍用 Word 写作，我要清爽的界面和简洁实用的功能，我极其反感
    Word 那种分页、过多的按钮和自作聪明的语法检查之类的功能，我甚至看见别人用 Word 都难受。我对操作系统和浏览器之类也有强烈个人偏好……我旁观别人操作计算机经常会感到恼火。


    所以我们应该同情黑客对工具的偏好。敏感度提高是个好事儿，你的生活中多了一个值得追求、而且可以被满足的点，这不更丰富了吗？


