    垃圾问题的成人观点

    11:41  10.7 MB

    |  转述：莫沙 |


    这一讲我想以垃圾处理为例，说说应该怎样思考公共事务问题。垃圾这个事物的特点是它的一部分 —— 收集垃圾 —— 属于我们的日常生活，而另一部分 —— 处理垃圾
    —— 却距离我们很远。它既是一个真实在在的生活话题，又涉及到环保、地球、子孙后代这种宏大主题。这就使得每个人都可以从某一个角度发表看法，但是容易陷入思维的误区。我们的结论可能跟一般的说法不太一样。


    我敢打赌，现在在世界任何国家为垃圾处理问题拍板做决策的人，都不是垃圾处理专家。我显然不是专家。你不需要是专家也能把这个事想明白，前提是你得小心思维误区。


    面对一个公共事务，首先你得想清楚，你是要解决真问题，还是要表达自己对问题的关心。


    比如现在欧美有些环保人士说是为了减轻全球变暖，自己发誓过一种低碳排放的生活，能坐火车就不坐飞机，能骑自行车就不开汽车。我对他们这种行为表示钦佩，但是我认为其中的抒情意义大于实际意义。反过来说各国领导人都是乘坐专机飞来飞去，在空中阔开得特别足的豪华会议谈判，这个个人行为不环保，却有可能解决真问题。有些记者喜欢嘲讽领导人的专机赞美环保人士的自行车，那是头脑不够清楚。


    摆姿态是容易的，解决真问题是困难的。决策者做不得意事，你得权衡各方面的利弊，做各种不得已的取舍，不能被一种心情左右。你得从个人小日子的角色中抽离出来，换上更高的视角。


    具体到垃圾处理问题上来说，以我之见，普通人有三个思维误区。


    ### 第一个误区是认为地球上的东西用一点少一点，必须特别节约地使用。


    在个人的小日子之中资源的是非常有限的。如果我只有 300 元钱，今天花 200 明天再花 100，就就花光了。但是对地球这个大系统来说，你几乎不可能真正消灭掉任何东西。


    你喝一瓶水，这些水在你体内循环上一段时间之后，将会被排出体外，回归大自然。你这瓶水没喝、用來没水玩儿，水还是会回归大自然。你“浪费”掉的液体水会变成水蒸气，进而变成云，然后变成雨。只要不上核反应，你连一个原子都消灭不了。


    所以所谓浪费，其实都不是浪费了那个东西本身，而是那个东西存在的形态，或者说浪费的是别人再那个东西上花费的劳动。挺好的一瓶矿泉水，你白白倒掉了，你浪费的是矿泉水工厂的劳动。而水，一滴都不会少。


    这个认识非常关键，它能帮我们想清楚很多环保问题。比如很多人认为使用一次性筷子是不道德的，因为筷子是木头做的，木头来自于树，而树是一种环保的、珍贵的、美好的东西。


    事实是树是一种可再生的资源。只要管理得当，我们使用森林资源不用有负罪感。美国当前的森林覆盖率，只比几百年前建国那个时候低了 1%，中国过去二十年来森林覆盖率增长的速度几乎就如同经济增长的速度一样快
    —— 房子照常盖，家具照常打，地砖照常铺，树不但没少还多了。树是可以砍的，更何况一次性筷子用的都是最廉价的速生树木。


    而且木头的主要成分是碳 —— 跟全球变暖的罪魁祸首、“二氧化碳”一样的碳 —— 你用一些一次性筷子，用当作垃圾埋了，这是一个减少碳排放的好事儿。


    所以我们对地球上东西使用的正确态度不是“要少用”，而是要合理地取用。


    处理垃圾最高效的办法是填埋。


    注意“填埋”不是“倾倒”，不是说挖个大坑把垃圾往里面一倒就不管了。现代发达国家 —— 包括咱们中国在内 —— 对垃圾填埋有一套非常厉害的办法。填埋坑挖好之后会先弄个密封层，使得垃圾放进去不会泄露，不至于过了多少年之后有毒物质出来污染地下水源。垃圾在填埋之前会经过多重的压缩，缩小占用的体积。


    按一般标准，每一立方米的填埋空间，能装下大约一吨垃圾 [1]。中国一个大型城市，比如天津市，每天大约产生 5000 吨垃圾，那得挖多大坑才够呢？答案是用不了多大。一个长宽高都是
    一公里的坑，体积就是10^9 立方米，天津市可以用 500 年。当然真实的垃圾填埋坑不一定挖那么深，但是你体会一下这个数量级。


    那你可能会说，填埋坑是不可再生的啊，这样一直挖坑，不早晚到处都是垃圾坑了么？不会的。环保主义者爱说“只有一个地球”，但是你要知道我们有的是一个多么大的地球！对一座城市来说，在郊外找个方圆几公里的填埋场，是个很小的区域！而且填埋场满了之后会封顶，会重新覆盖上土壤，只要坑足够深、防泄漏措施足够好，建公园、商业区还是住宅区都没问题。


    地球很大，垃圾填埋并没有让地球上的物质减少一分一毫，只是把东西从各地方集中放到一个地方的地下而已。


    垃圾填埋这种处理方式的主要问题根本不是地方不够用，而是能不能管理好，真正做到不泄露。据我理解，目前技术是成熟可靠的 [2]。各国对垃圾填埋的标准设定越来越高，而即便是这样，填埋仍然很便宜！


    合理使用填埋的方法，地球根本就不会变成一个大垃圾场。


    ### 第二个思维误区是认为垃圾的最理想归宿是回收，最好能“变废为宝”。


    垃圾回收是有成本的。比如有个装食用油的塑料桶，你把它投入了回收垃圾箱。你满怀良好的祝愿，希望它能焕发第二春继续为人类造福，这样你就不是一个地球毁灭者，而是地球良性循环中的一员了。


    但是要想真正回收这个塑料桶，首先得有人做一些基本的塑料分类，得有人把桶盖儿拿掉，得有人清洗它，然后才能高温熔化，去做一个什么新的塑料用品。那是什么人在做这些事呢？以前是咱们中国人，美国大量的回收垃圾都“出口”到中国处理，而现在中国不收了，因为中国自己的垃圾都处理不过来。


    如果人力越来越宝贵，人工智能还没做到能智能处理垃圾，回收就是非常不可行的事情，而且回收也是有污染的，清洗你那个塑料桶难道不会产生污水吗？


    而对现代工业体系来说，制造一个全新的塑料桶，却是省时省力的事情！塑料来自石油，人类把大部分石油都当燃料烧掉了，只有 4% 到 8% 用于生产塑料 —— 塑料，很便宜。


    所以最好的办法是把你那个塑料桶直接填埋。就将将来石油用完了，我们还会发明新的材料，要知道反正地球上的物质总量永远都不会少。同样道理，因为玻璃是用最廉价的沙子制作的，玻璃瓶也应该直接填埋。金属的东西可能比较贵，也许有回收价值。


    从经济学来说，什么垃圾是“可回收”的，应该由垃圾回收人员决定。如果他们觉得回收有利可图，就说明这个东西的价值大于回收的成本，那就是值得的。如果扔在那里没人要，就就没有必要回收。


    考虑到清洗、燃烧的环节，回收并不环保。事实上焚烧垃圾非常不环保，会产生各种有害气体。用焚烧垃圾产生的热量发电是高成本的行为艺术，远远不如烧煤。


    再进一步，像饮料纸杯、快餐饭盒这种一次性物品，很可能比使用永久性的杯子和碗更环保。因为你不用洗碗，而洗碗会产生废水。使用一次性饭盒和一次性筷子，而不去浪费人力给你洗碗，我认为这是一种高尚的美德。


    那可能有些人会说物理学的“熵”怎么办？我们把东西白白扔掉而不重复利用，这是不是促进了宇宙中的熵增呢？首先你大大高估了人的能力。地球不是封闭系统，太阳每时每刻就往太空中白白照射的那些阳光才是真正的在浪费熵，我们地球人不管干什么都影响不了那个大局。而且如果你真懂物理学，回收垃圾和焚烧垃圾，其实会产生更多的熵。


    所以填埋是最好的办法。那为什么人们非得执着于回收呢？这就引出了第三个思维误区：我们总想拒绝“坏东西”的存在。


    有些明星说为什么自己不想生孩子呢？因为他觉得这个世界不够美好，人生太苦，他不忍心看到自己的孩子受苦。这样的 人必定是想要一个绝对完美的世界，但是绝对的完美是不存在的。


    我们以前讲过，对“疙瘩手”的问题，你根本就 不应该指望有个彻底的解决方案 [3]。你最多只能追求控制它。垃圾，是个不好的东西，但是我们真的的 不可能彻底消灭垃圾，这就好像你不可能完全消除犯罪、不能完全消除疾病一样。


    当前中国真正的垃圾问题是怎么更好地收...

    '
  mdcn: '

    黑人一起住，白人和白人一起住的局面。


    骚乱也好，隔离也好，它们有一个共同的特点：参与者很可能根本就没想要一个极端的局面，可是像骚乱和种族隔离这种极端局面居然就发生了。大多数人根本不爱出来凑热闹，却参加了一场骚乱；大多数人根本没有歧视思想，却参与了种族隔离。


    托马斯·谢林据此提出一个学说，说每个人作为个体的“微观意愿”，和人群的“宏观行动”，完全可以是非常不一样的 [2]。温良的意愿也许会带来糟糕的集体行动。


    再回到我在初中那件事，按今天的标准来说，这叫群体事件。我们老师是个宽容的人，没给任何处罚。可是如果当时老师脾气不好，要抓这件事的幕后黑手，那我就是那个黑手。


    可我原本只是想开个玩笑而已。我在中午吃饭的时候说了一个有意思的想法，没想到有三四个同学立即响应。我说到了就不得招到，另一个同学也当了真，我俩上课就没有坐下。而剩下的事情，为什么会变成一个那么极端的局面，是我、同学和老师都没有想到的。


