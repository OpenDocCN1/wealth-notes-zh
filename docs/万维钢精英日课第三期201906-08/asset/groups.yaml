    # 来自日课：不真起跑线的人


    读者 乔伊酱、victor、敖散类：


    对比如《范畴》强调通才，和我们之前说的“达芬奇诅咒”强调要选择一个项目深入进去，这两个说法矛盾吗？


    万维钢


    首先我们必须承认这是一个专业化程度越来越强的世界。这就意味着如果一个人想出来工作，他就必须得参与社会分工，就必须至少在某一个领域达到高水平。这个逻辑没问题，这是大局观。我们看到，有很多人一辈子就专注于某一行手艺，生活过得也不错，甚至是很不错。反过来...
    那就是陷入了“达芬奇诅咒”。


    爱泼斯坦的《范畴》这本书，则是在承认专业化世界的基础之上，给我们两个提示... 人生应当有一个尝试期，先广泛尝试，看看自己喜欢什么再决定在哪个方向深入发展。而且人生很漫长，也许你发展了一段时间之后想要换个方向，甚至换好几次，这都是可以的。


    第二是如果你的工作涉及到复杂和棘手的问题，你就不能只专注于一项技能，你必须善于借鉴各个领域的思想。这一... 这就是为什么很多... 我们知道普通科研工作者并没有超过老百姓水平的业余爱好。但是如果你想要做出高水平，到了需要发挥创造力的地步，或者成为某个领域的领导者，那有一点通才的素质就非常必要了。


    简单地说，《达芬奇诅咒》，是提醒聪明人不要犯低级错误；《范畴》则是探讨聪明人怎么做才能锦上添花、把个人发挥最大化。


    读者 花开无烬：


    精英选手通常在“尝试期”广泛尝试各种爱好，等自己心智成熟了再选择一个爱好深入。这种“尝试期”是不是一定要在15岁前进行呢？还有，什么时候才知道自己“心智成熟”呢？


    读者 灯塔：


    高三或者大学做人生规划也未必正确吗？


    万维钢


    尝试和选择并没有一个明确的分界线，人始终都应该尝试新的东西，也始终都有重新选择的权利……只是你不能不选择、不深入。其实只要深入到一个领域中去，达到一个高水平，这时候再想换个领域是比较容易的。用学外语打比方，掌握一门外语之后，再学第二门外语可能只需要花一半的时间，再学第三门语言需要的时间就更少。所以不要担心深入。除非是体育比赛和音乐演奏这些需要从小练习、必须在年轻时候出成绩的项目，那种必须早点下决心。


    # 来自日课：学习的快功和慢功


    读者 Cage：


    我记得您之前的书《智识分子》里有介绍您当初学习英语的心得可能避免长期，要在短期内突破。我自己考试的经验也是差不多的时间考... 请问万老师这之间有什么区别或者不同之处吗？


    万维钢


    学英语是一种特殊的学习。一般的学科，尤其是数学，知识都是分层的，你必须把底层的... 扎实了，才能学好高层的... 这就是为什么美国空军学院那个研究中教真功夫的老师都教得慢。


    但英语没有那么多层。基本的语法中学就学完了，写作的技巧可以跟语文通用，真正需要专门训练突破的，是词汇量。学习词汇有一些窍门... 但是，词汇量本质上是个消耗时间的功夫。你大概需要认识几万个单词才能顺畅阅读英文书籍，那么如果每天学20个，难道要花上五年时间学英语吗？正确的办法是每天背比如说500个单词。


    之类的东西，那能行吗？他真正需要的是找本真正的物理书推公式！


    一个没有艺术思维的人只要基本功过硬，也能成为一个合格的科学工作者，足以安身立命。“功夫在诗外”，那是锦上添花，想要做出创造性贡献才需要的东西。我们必须分清这个主次关系。


    孔子说：“弟子，入则孝，出则弟，谨而信，泛爱众而亲仁。行有余力，则以学文。”我认为这个策略就很好。有些事儿是你必须学的，那你就先学好那些；如果你学完了那些之后还有余力，那就再学点文艺，争取成为通才。这个世界并不需要所有人都是通才，但是它需要很多很多的专才。


    # 《范围》5：一边自我实现，一边自我发现


    万维钢 · 精英日课³

    今天

    进入评论 ›


    《范围》5: 一边自我实现，一边自我发现

    12:08 8.33 MB


    今天我们继续讲戴维·爱泼斯坦的《范围》这本书。咱们先思考一个问题。如果你申请去美国读大学和研究生，除了各种成绩要求之外，你还要写一份“个人陈述（Personal
    Statement）”，说说为什么想学这个专业，以前做过什么，对未来有什么打算。那你肯定能想到，这是一个用故事打动人的机会。


    经典的套路是从小时候开始讲，比如果说我八岁的时候听了爱因斯坦的事情深受感动，立志要成为一个科学家。我一直都对科学充满好奇，做出科学发现是我长期以来的梦想，我一定要实现这个梦想。


    ## 1.匹配质量


    我们知道英国其实是由四个地区组成的，包括英格兰、苏格兰、威尔士和北爱尔兰。各个地区大学录取方式具有一定的自主性。北爱尔兰的事儿爱泼斯坦这本书没提，在英格兰和威尔士，学生们在高中时代就要选定自己的专业，然后上大学只能上到那个专业；而苏格兰则正好相反，学生在大学的头两年都不需要选专业，先上两年基础课，大三再开始专业化学习。


    ## 2.黑马计划


    以前我们讲过的《平均的终结》这本书的作者、哈佛大学教育学家托德·罗斯（Todd Rose），跟人搞了个项目叫“黑马计划”[2]，专门研究那些比较成功、经历又比较曲折的人，看看他们有什么共同点。


    ## 3.我是谁


    心理学家丹·吉尔伯特（Dan Gilbert）提出一个概念叫“历史终结错觉（End-of-History Illusion）”。

    如果让你回顾在过去十年，你的各种喜好和生活追求有没有发生过什么变化，每个人都能说出一些来，说我已经不是十年前的那个我了，当年我喜欢的东西，现在我已经不那么喜欢了；现在我喜欢的很多东西是当年的我根本就不懂的。


    去做那件事情的时候，我发现它好像没有我 想的那麼有成就感。随着年龄的增长，我 见识了一些更有意思的事情，我看到一个 非常广阔的世界，我没想到原来世界上还 有这样的事物。我有过纠结，不知道该坚
    持过去的方向，还是去追逐远方的新梦 想。幸运的是我有勇气做出改变……我尝 试过很多事情，经历过很多失败，但是我 也战胜过很多挑战，每一次成败都让我学 到了新东西。现在我想继续新的挑战……
    年轻时的我，肯定想不到我现在会做这样 的事。


    你看这个故事是不是更好呢？


    说到这里你可能会问，人总不能一直见异 思迁，那到底什么时候应该坚持，什么时 候应该放弃呢？这是一个永恒的矛盾没有 固定算法，但是我最近有一点自己的感 悟。


    我和家人在一个地方游玩。那有个游乐设 施，在一个大约三米高的架子上搭了各种 形状的独木桥，有的是固定的有的晃晃悠 悠，你在空中沿着这些桥走。我在地面看 感觉这个项目非常简单，每个人身上都绑
    着绳索，各个桥上还都有把手，理论上没 有任何危险……有些人居然走那么慢，简 直是非理性的恐慌。


    可是等我上去刚走了几步，就感到很紧 张。理性告诉我这很安全，跟在地面走路 没啥区别，但是我的腿在发抖！我心想没 必要较这个劲，就开始往回走，想下去。


    就在这时候，一个工作人员对我喊 道：“你不能就这么下去！你至少应该走 一圈！”我说不用了我还是下去吧，但是 他坚持让我再试试。我就咬牙又走了两 段。结果走了两段之后我的感觉又变好
    了，好像确实不可怕，跟我在下面想的一 样。然后我走了很多圈，大概是那一拨人 里最后一个下去的。


    如果那个工作人员不鼓励我，我就错过了一 个有意思的活动，甚至可能从此认为自 己不适合这种活动……而不知道只要再坚 持五分钟就能迎来转机。


    如果你觉得这件事对你来说已经完全没有 挑战了，真的不适合你，而且有一个明显 更好的方向在召唤你，你也许应该放弃这 件事。


    但如果你是因为害怕了而想放弃，你就应 该再坚持一下。


