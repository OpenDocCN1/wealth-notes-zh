    如何理解西方？(上)

    11:54  8.17 MB


    最近有个有意思的事儿。中国有些中年男子，夏天感觉太热了，穿T恤衫穿背心喜欢把下半部分卷起来，露出肚子，外国人看到觉得很好玩，称之为“北京比基尼”。

    很多外国人被中国男人的自信所感染，纷纷效仿。


    这件小事能给我们提供一个思考。有些事儿我们习以为常，换个外部的视角，才能发现它的特别之处。而更重要的是，这个“特别”并不等于不好——当然，也不等于好。


    那我们看别人难道也不是这样吗？互相注意到对方的特别之处，进而能用对方的眼光重新观察自己，这样不但能加深互相理解，还能加深自我理解。你具有的一些特点，如果不和别人比较，你都不知道那是你的特点。你认为天经地义就应该这么办的事情，可能别人不是这么办的。中国古人讲要“以人为镜”，我看做到这个程度，才算是-ish上成熟。


    我想跟你探讨一下今天的中国人应该如何理解西方。现在中国跟西方的交流很多，一个受过教育的中国人对西方、特别是对美国的了解，远远超过一个典型的美国人对中国的了解。但是你能想到，双方仍然有很多误解。我想给你提供一个有意思的视角。


    # 1.个人主义


    西方人和咱们中国人最重要的差别，也许可以用一个叫做“框架线段任务”[1]的实验说明。下面图中的一个小正方形，里面有一个竖直的黑色线段。请看好——


    ![](img/b58c3137b911797b913643bab2c018ea_54_0.png)


    现在我们把这张图拿走，再给你两个跟刚才那个正方形大小不一样的两个正方形，请你完成下面两项任务。一个叫“相对任务”，就是在新正方形中也画一条线段，线段长度跟正方形的相对大小要跟前面那个图形一致；一个叫“绝对任务”，也就是说不管新正方形有多大，你都要画出跟原来那条线段一样长的一条线段。两个任务的正确答案如下图所示——


    ![](img/b58c3137b911797b913643bab2c018ea_54_1.png)


    研究表明，西方人、特别是美国人，完成绝对任务得分更高；而东亚人，更擅长做好相对任务。


    换句话说，西方人看什么东西，更关注这个东西*本身*，而咱们东方人更关注这个东西跟其他东西的*关系*。


    # 2.个人和群体


    美国社会心理学家齐纳森·海特在《正义之心》这本书里说了一个有意思的实验。说有这么一件事情——


    # 3.权利和分权


    说个人主义的人必定非常注重个人权利。所谓权利，说白了就是你拥有什么，你可以干什么。其实人人都有权利意识，我们从小就知道要分清楚哪个东西是我的、哪个是你的——但是美国人的权利意识更强一些。'
  - '[PAGE 55]


    是一项个人权利，就这么简单。


    利弊分析是次要的，权利才是首要的。持枪好不好，那是另一回事，关键是公民有权持枪。所以即便是民主党政府都没想过彻底禁枪，最多也就是想限制一下而已。


    权利意识强，人们就会主动尊重别人的权利，人们就会比较重承诺，就会比较讲规则。权利意识还保障了自由。如果别人有这个权利可以做这件事情，哪怕你不喜欢，你也得让人做这件事情。


    权利意识还包括承认特权。所谓特权，就不是每个人天生具有的权利，而是你因为能力出众争取到的、或者花钱买的、或者纯粹是因为家庭出身而拥有的权利。


    比如哈佛大学录取学生会对校友的子女有特殊照顾。那你说这不是任人唯亲吗？这不是腐败吗？很多美国人对此非常不满，也认为这么做不对，但是美国人认可哈佛这么做。本质上来说，哈佛大学是个私立大学，它有权录取任何人。


    对比之下，我感觉咱们中国人的权利意识并不是很强。比如说有人在高铁上占座，有人明明买的是普通的票，看商务座有空位就非得坐在商务座，这种事情在美国不太可能发生。当然你也可以说中国人更有平等意识，鄙视特权
    —— 而西方对阶层、甚至对贵族，都是认可的。


    权利意识容易帮助我们理解美国的政治系统。咱们中国人经常说要做“一个拳头的中国”，不要做“一盘散沙的中国”，而美国政治系统既不是一个拳头也不是一盘散沙，可以说是“
    一堆拳头 ”的国家。美国是个分权系统 —— 不仅仅是三权分立，可以说是多权分立。


    美国每一个州和每一个民间社会组织都有一定的独立性，拥有联邦政府不能干涉的权力。美国政治的本质不是全民大民主也不是两党轮流坐庄，而是利益集团博弈制。教师工会、步枪协会、不管是什么组织，只要你的人数足够多，影响力足够大，你就可以坐下来跟政府讨价还价，你就可以出面支持或者反对哪个政客，你就可以游说国会议员通过对你有利的立法。


    当然，这里面必定有效率不高的问题，也会有腐败问题。很多人认为美国这个利益集团博弈系统其实就是制度性的腐败，这是一个见仁见智的问题。但是，从个人主义到权利意识、到分权体制，这是最符合西方思想的政治状态。


    这跟咱们中国人习惯的大一统思维非常不同，所以我们有时候无法理解美国的一些做法。比如美国哪个电台的节目主持人发表了“辱华”言论，我们会很自然地想到美国政府为什么不管一管这个电视台呢？这不说明美国政府也想辱华吗？其实美国政府管不了电视台说什么
    —— 别忘了连特朗普都整天被“辱”！我们倾向于把一个国家看做一个个体，这对西方国家通常不适用。


    我们今天讲的都是西方*是什么样，而不是说这样好不好，更不是说中国*应该*是什么样 —— 其实现在有很多美国人羡慕咱们中国做事的风格……咱们明天再说。


    注释

    [1] 乔纳森·海特在《正义之心》这本书的第五章描写了这个实验和相关的研究。


