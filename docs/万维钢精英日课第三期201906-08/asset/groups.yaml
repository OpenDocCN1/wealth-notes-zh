    ### 来自日课：大国崛起靠什么


    #### 读者 倪元禾, long：


    这种在模型的公式是作者自己思考的结果，是作者觉得技术这个变量特别厉害，人为加的平方；还是大量数据画在图板上，近似得出这样的结果。得来的公式又是如何验证的？总不能和物理定律一样吧……多问一句，物理定律的公式也是这样推的吗？


    万维钢


    任何一个模型的形成，都包括假设、推演和验证这三个阶段。


    假设，是一个比较主观的行为，也可以说是一种艺术。什么因素重要什么因素不重要，保留什么放弃什么，这些选择，你有一定的自由度。但假设可不是绝对的自由，你的选择必须让他人信服才行。


    索洛模型的一个最基本假设和我们在前面说的那个柯布-道格拉斯模型一样，是“单纯的投资对产出是一个边际效应递减的过程”，并且借用了柯布-道格拉斯模型的公式 —


    O = 常数 · √L √K


    你可以找到无数个例子说有这么多真实情况都不符合这个公式！但是你并不能据此就否定这个公式。这是因为对社会科学来说，真实世界不是一个单纯的实验室，真实世界里同时发生了很多事情，有很多很多因素在共同左右经济的增长。作为一个模型，我们关心的是一种比较单纯的、理想化的增长。


    ### 来自日课：传播公式和“引爆点”


    #### 读者 严谊萌：


    微博上那些留言和点赞数的流量明星，算是有效营销吗？


    万维钢


    有个现在已经很有名的社会学家叫邓肯·瓦茨（Duncan J. Watts），做过一个影响很大的实验。在实验室环境中弄一些新歌，让受试者下载。实验发现，如果人为地把一些歌曲的“下载量”这个数字夸调大，受试者就会以为这些歌曲是因为好听才获得了那么多下载，于也是会去下载这些歌曲，结果就真的把这些“运气好”的歌曲送上了排行榜。这个实验说明前期数据造假是有用的。

