    万维钢


    今天我们来读《生活黑客》这本书，帮你做个总结，从理性、实验、系统到个人主义，黑客精神有哪些值得学习？从量化、简化、优化、到黑化，生活黑客的工具、技能和方法，有哪些值得思考？希望这篇总结，能帮你更好地理解这本书。


    Joseph M. Reagle, Jr.


    # HACKING LIFE

    SYSTEMATIZED LIVING AND ITS DISCONTENTS


    书名：《生活黑客：系统化生存及其反对者》（Hacking Life: Systematized Living and Its Discontents）


    作者：美国东北大学传播系的助理教授约瑟夫·里吉尔（Joseph M. Reagle Jr.）


    出版时间：2019年3月


    # 黑客概念


    【黑客思维】黑客思维是系统思维的升级：黑客破解系统。


    【创新阶层】（creative class）"，他们的工作和生活方式跟以前的工人非常不一样。创新阶层的成员包括艺术家、工程师、设计师、教育工作者、演员、游戏娱乐从业者等等。


    # 对待工作


    - 1. “多相睡眠”法 —— 把一天平均分成若干段，比如说分六段，每段四个小时之中，睡20或者30分钟。这样加起来，你每天只需要睡两到三个小时。

    - 2. “被动收入（passive income）”和“外包（outsource）”——你要把工作外包给别人去做，这样你就能够享受不用自己动手被动收入了。


    # 对待物质


    # 对待身体


    # 对待感情


    # 生活哲学


    # 黑客金句


    *你想要的到底是爱，还是依赖；你对别人到底是关爱，还是可怜；你处事的姿态是平静，还是冷漠？如果你身怀利器，你就需要知道，善恶只有一线之隔。


    *君子生非异也，善假于物也 — 所谓时间管理，或者是善于交给外部系统，或者是善于交给别人 — 首先你得是“君子”才行……


    *那些一天到晚励志，以为“磨刀不误砍柴工”的人，其实只会磨刀。


    *敢冒险，而且有想法，肯定是真精英。


    *并不是所有人都能用金钱购买时间。有些人需要用冗余的物品保卫自己的时间。


    *优化的一个代价，是可能会黑化。


    *所以到底应不应该学习这些方法？当然应该学习 — 但是你学归学，不一定真用。副作用也是知识，不用也是智慧。


    *冒险者和探索者总是值得尊重的。


    *你要优化，就可能会黑化。你量化这里，就会忽略也许更重要的那里。你破解系统，就会导致罪系统。你把什么东西当做工具，就得改造甚至简化那个东西。


