    我们继续讲里吉尔的《生活黑客》这本书。前面我们讲了生活黑客如何管理时间和管理自我，这一讲的主题是管理物品——说白了，就是什么东西值得拥有。


    咱们中国人过去以节俭为美德，用东西用便宜的，那种观念放到今天肯定是不适用了。反过来说什么是东西都要买贵的、高档的、名牌的，也是一种很土的作风。包括一般大众的物质选择，
    Mongolia  ...


    ## 1.黑客的好东西


    你注意到没有，人们现在买东西爱听“带货网红”的推荐。我最近听说一个卖口红的李佳琦，那真是厉害。生活黑客也推荐东西，不过不是靠李佳琦那种人格魅力。


    ## 2.极简主义


    再好的工具对女性也不会有太大吸引力，不过现在有一位女生生活黑客引领了一个时代潮流，这就是“极简主义”。


    ## 3.物质的矛盾


    美国人经常把“极简主义”和“禅宗”联系起来，这其中的逻辑差别差不多是这样——


    佛祖认为，极端的贫困和极端的奢侈是一回事，都是执着。


    精要主义的精要在于，你不应该接受生活的默认方式，你应该按照自己的设计去生活


    的默认方式，你应该按照自己的设计去生活。我不太确定这个思路是否符合佛学，但是精要主义代表更主动、更刻意、更有纪律、更系统化的生活方式。


    不被外物所控制，乃至于对生活有一种掌控感，这的确不错。工具也好，极简也好，精要也好，生活黑客的探索值得我们学习。


    说道这里，里吉尔忍不住再次提醒我们，所有这一切都要求一定的财富条件。


    难道那些保留了很多没用的物品、什么都舍不得扔的人都很傻吗？难道是他们缺少黑客精神吗？其实舍不得扔是一种风险管理。


    穷人的生活需要留备份。别人平时骑电动车上班，家里还有一辆破自行车舍不得扔，而你把所有的旧车都处理掉了，只有 a 一辆新汽车。你能说你这是极简，别 人是邋遢吗？你的车万一坏了你可以随时租一辆车，别人的电动车如果坏了，修理需要时间，他怎么去上班？


    并不是所有人都能用金钱购买时间。有的人需要用冗余的物品保卫自己的时间。


    其实生活黑客是一种比较富裕的生活方式。这个富裕不一定体现在东西和钱上，而是体现在你拥有的选项上。选项多，你才谈得上只保留最重要的东西。你可以住在游轮上，也可以住在房车里，你这么做体现了黑客风，前提是你也可以不这么做——别人可没有这个选择。美国有很多穷人没有自己的房子，只能住在房车里。


    而生活黑客们完全明白这一点。有个生活黑客以住在房车里为荣，四海为家，还靠房车主题结交了好多女朋友。他分享了一条经验是这样的：告诉新女友你住房车这件事情的时候，一定要给她讲个故事，让她明白这是你的主动选择，可不是因为没钱买房。


    回到开头买鞋的问题，如果好东西的性价比更高，为啥有些人不买好的呢？因为好的贵啊！


