    ## 问答：边沁会说可以，康德会说不行


    万维钢·精日日课³

    今天


    问答：边沁会说可以，康德会说不行

    10:33 7.25 MB


    ## 来自日课：凡人的觉醒


    ## 读者 张西总：


    从实质主义来讲，外国人搞科学，中国人搞技术也不挺好的吗？因为技术是有专利保护的，而科学成果是全人类共享的，管他谁研究出来，我们拿来用就行了，而且免费。这样说来，搞科研的国家是否吃亏了呢？


    万维钢


    科学研究的成果的确是全人类共享的，但是搞科研并不吃亏。首先要把科研成果实用化，你至少得知道有这个成果，还得能理解这个成果的价值在哪里——而且这就意味着，你已经在这个科学研究的圈子之内了。一群外行在远处隔着看是看不懂的。所以就算要把别人的科学发现拿过来用，自己也得有科学家才行。基础科学和应用科学并没有严格的分界线，要搞就得什么都搞。


    Copy to China 这个策略之所以在过去这几十年内这么好使，有两个重要原因。一个是中国有个巨大的市场，别人为了这个市场宁可转让一些技术。另一个，就是中国有自己的科研队伍，否则就算别人转让咱也接不住。事实上中国科研队伍的水平很高，不但能接住，而且能本地化，而且能改进，而且能超越。这支科研队伍需要高水平科学家带，很多人才就是用基础科学研究训练出来的。


    ## 来自日课：意义危机


    ## 读者 月影辰砂：


    国人更容易闯红灯，以前有人说过是因为国人不信上帝，也许是没有时刻监督自己或自己所向往的“异追求”，所以少了很多约束。对于这种现象的这种解释万老师有什么看法呢？


    ## 来自日课：公共意志的幽灵


    ## 读者 苏珊琳：


    万老师，为什么集体主义容易走极端，美国是科学进步主义的代表，却又说美国宪法代表的这一派是历史正确的侧，是不同时期的美国还是同一时期的美国有两个代表？


    那为什么说集体主义容易走极端呢？因为没有东西能限制“集体”。在个人主义的国家，因为老百姓的权利在法理上是天然的，老百姓有强烈的权利意识传统，那么政府就不能肆意侵犯个人权利，至少不能为所欲为。而在一个集体主义的国家，政府就有可能打着一切为了集体的旗号，去光明正大地做一些极端的事情。


    有时候人们会真诚地相信为了集体可以牺牲个人——甚至不是个人自我愿意牺牲，而是去牺牲“别人”。这是一个见仁见智的问题：边沁会说可以，康德会说不行。但是，不管这件事本身对不对，这是危险趋势的边缘。


    ## 《历史的正确一侧》8：人为什么活着？


    万维钢·精英日课³

    今天

    进入播单 >


    《历史的正确一侧》8: 人为.

    11:50 10.84 MB


    咱俩继续讲夏皮罗的《历史的正确一侧》。贯穿这本书的一个主题，是思想家要寻找人生的意义。说白了，就是人为什么活着。


    过去是耶路撒冷的上帝和雅典的目的论给人提供了意义。人活着就是要在道德上完善自己，去接近上帝；或者说从理性上修炼自己，完成你的telos。可是后来上帝已死，雅典哲学家的telos也被抛弃了，后世的人又想出了其他的意义，比如单纯就是为了生存，或者为了享乐，特别欧洲大陆曾率奉行集体主义。集体主义主张人活着是为了国家、为了集体。这个思想容易走极端，带来过巨大的灾难，所以集体主义在二战以后就基本上被西方抛弃了。


    这一讲我们要说的是西方在战后关于人生意义的思考。那你首先可能就会有一个问题，为什么西方如此关心人生的意义呢？你看咱们中国人对这个问题好像并不怎么在乎，谁也没整天追问我为什么活着。大家想的都是要活好，改善生活条件，照顾父母家人，做好自己的事情，承担自己的责任就行吧？


    我觉得这可能是因为西方有“较真”的传统，也许也是基督教和雅典的原因。人们真的是用思想指导行动。


    ### 1.科学与意义


    史蒂芬·平克是我们专栏非常熟悉的人物。我们讲过他2018年出的《启蒙此时》，这本书现在已经有了中文版，叫《当下的启蒙》。你知道我对平克评价不高，我总觉得他是一个只爱站队献礼的人，不是真诚的学者。


    ### 2.自然与意义


    另有一派思想家也讲科学，但是并不讲理性。他们认为科学其实告诉我们，人本来就是一种动物，受各种欲念支配……那我们为何不回归自然，释放天性呢？真实的天性，就是我们应该追求的意义。


    ### 3.存在与意义


    如果科学不能提供意义，意义应该从哪来呢？欧洲有一派新的哲学思想兴起，叫做“存在主义”。


    真理，也许将来会有更好的解释。


    如果连真理都是主观的，那善恶、道德当然也都是主观的。没有什么客观标准规定你应该做什么，你应该只问自己想做什么，对自己内心保持真诚……


    我们总结一下。讲科学和理性的新启蒙主义听起来比较合理，但是从哲学上有点解释不通。享乐主义和存在主义在逻辑上是成立的，但是好像有点脱离现实。那你可能会问，享乐主义和存在主义这两派思想为什么会有人大张旗鼓地追随呢？


    因为这两派思想具有革命的特点。它们强调的不是什么低端情趣，而是要打破传统的束缚，要让人获得解放！支持这两派思想的人把自己看做是英雄：不管你是政府也好、组织也好、教会也好、家长也好、社会习俗也好，你要限制我我就革命。这些思想也是当今美国“左派”的起源。


    那你更认同哪一派呢？我觉得大多数人的想法应该和和平克差不多，我们相信科学，同时也赞赏理性，希望改善物质生活条件，也愿意做个有道德的人。


    而我们这一讲说的是，这些想法是不能单纯从科学出发，完全用逻辑推导出来的。这些想法也不是凭空产生的。你为什么接受这些想法？因为这些观念早就已经潜移默化地进入了你的思想。这些观念是历史的产物。


    这个教训是我们不能脱离历史去谈论意义。我们专栏以前讲过一位神人——数学家和计算机科学家史蒂芬·沃尔夫勒姆——的世界观 [1]，我认为他说的比平克这帮人好多了。沃尔夫勒姆说随着科技进步，到了人几乎无所不能的未来，人类恰恰就只能从历史中寻找意义。


    我们为什么活着？因为我们要传承历史……否则整个人类的存在，都毫无意义。


    注释

    [1] 精英日课第一季，《一个神人的世界观》


