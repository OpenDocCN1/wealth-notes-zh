    去做那件事情的时候，我发现它好像没有我 想的那麼有成就感。随着年龄的增长，我 见识了一些更有意思的事情，我看到一个 非常广阔的世界，我没想到原来世界上还 有这样的事物。我有过纠结，不知道该坚
    持过去的方向，还是去追逐远方的新梦 想。幸运的是我有勇气做出改变……我尝 试过很多事情，经历过很多失败，但是我 也战胜过很多挑战，每一次成败都让我学 到了新东西。现在我想继续新的挑战……
    年轻时的我，肯定想不到我现在会做这样 的事。


    你看这个故事是不是更好呢？


    说到这里你可能会问，人总不能一直见异 思迁，那到底什么时候应该坚持，什么时 候应该放弃呢？这是一个永恒的矛盾没有 固定算法，但是我最近有一点自己的感 悟。


    我和家人在一个地方游玩。那有个游乐设 施，在一个大约三米高的架子上搭了各种 形状的独木桥，有的是固定的有的晃晃悠 悠，你在空中沿着这些桥走。我在地面看 感觉这个项目非常简单，每个人身上都绑
    着绳索，各个桥上还都有把手，理论上没 有任何危险……有些人居然走那么慢，简 直是非理性的恐慌。


    可是等我上去刚走了几步，就感到很紧 张。理性告诉我这很安全，跟在地面走路 没啥区别，但是我的腿在发抖！我心想没 必要较这个劲，就开始往回走，想下去。


    就在这时候，一个工作人员对我喊 道：“你不能就这么下去！你至少应该走 一圈！”我说不用了我还是下去吧，但是 他坚持让我再试试。我就咬牙又走了两 段。结果走了两段之后我的感觉又变好
    了，好像确实不可怕，跟我在下面想的一 样。然后我走了很多圈，大概是那一拨人 里最后一个下去的。


    如果那个工作人员不鼓励我，我就错过了一 个有意思的活动，甚至可能从此认为自 己不适合这种活动……而不知道只要再坚 持五分钟就能迎来转机。


    如果你觉得这件事对你来说已经完全没有 挑战了，真的不适合你，而且有一个明显 更好的方向在召唤你，你也许应该放弃这 件事。


    但如果你是因为害怕了而想放弃，你就应 该再坚持一下。


