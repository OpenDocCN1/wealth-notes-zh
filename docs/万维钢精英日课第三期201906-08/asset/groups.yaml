    # 来自日课：什么是“好”的复杂


    # 读者 hx111：


    为什么李雅普诺夫函数的定义要强调每次的变量都是一个固定值呢？


    万维钢

    这纯粹是一个技术上的要求。我们要求李雅普诺夫函数的每一步都比前一步至少要减少一个固定的数值，关键词是“至少”。这个要求是为了在数学上避免《庄子》里说的那个“一尺之捶，日取其半，万世不竭”那个情形。如果
    L 值今天减少 1，明天减少 0.1，后天减少 0.01，每次减少的幅度越来越小，那就可以一直这么减少下去，也就是意味着对应的那个系统永远都达不到均衡。


    现在我们规定它每次减少的数量不能小于一个固定值，那么不管那个固定值有多小，                  哪怕是 0.00001 也行，L 的减小幅度就不会是无限小，它就一定可以在有限步之内达到最小值
    —— 这也就是“不怕慢、就怕站” ——  那么系统终就有达到均衡之日。


    我们可能很想揍到《庄子》居然跟李雅普诺夫函数有关系……但这绝不能说明，中国人早在春秋时期就已经解决了复杂数学系统的均衡问题：）


    # 读者 金铁侠马：


    我觉得在真实世界中，均衡更像是一种暂时的状态，……你看到某个大商场里有很多的人，会换一个商场去逛，只要大多数人都是理性的，商场的人数就会达到一个均衡状态。但如果大商场突然宣布搞周年庆典，均衡就会在瞬间被打破，逛商场的人就会蜂拥而至，……我们是不是说，均衡状态形成要很长的时间，而打破均衡却会立刻发生呢？是不是真实世界只能是一个均衡和混乱兼而有之的情况呢？


    万维钢

    是的，真实社会系统是动态的均衡。这里的要点在于，我们证明了社会系统哪怕受到了干扰、或者发生了局部的 covid不均衡，它也是倾向于走向均衡，所以它就是良性的复杂：它趋向于稳定。


    这种“好的”复杂，就如同下面图中 1 和 2 这两个地方的小球 ——


    ![](img/b58c3137b911797b913643bab2c018ea_132_0.png)


    它们都处在谷底！就算你稍微扰动一下，让它们离开均衡点，它们也会在重力的作用下自动返回原处，并且在摩擦的作用下恢复静止。这样的系统是让人放心的。


    # 来自日课：“吃一垛长一智”的数学模型


    # 读者 王秀敏、张平、魏文浩：


    “如果你采用第二个学习方法，向别人学习，你会变得越来越恶意”。这句话不太理解。


    万维钢

    请注意我们说的是在这个“慷慨/恶意博弈”之中，如果你选择向别人学习，你会变得越来越恶意 —— 对别的博弈可不是这样！生活中绝大多数博弈不是这样的。


    # 读者 新颖：


    每个人都想保持自己的相对优势，所以不太愿意把自己的优势无私共享，但又都希望自己获取到别人的优势。在工作中就体现被学习者的防御，学习者的进攻，有什么破解之法吗？


    万维钢

    我们是否应该因为担心被同事学走了自己的优势技能，而采取防御的姿态呢？在过去可能是应该的，比如有些老师傅有自己的独门秘方，一旦泄露就会失去优势地位。但是在现代化的工作中，已经不是这样了。


    # 读者 林曦：


    是否会有一个类似于*敏感度消失*的情况？有什么方法可以尽快摆脱它的影响呢？


    # 读者 K-Loo：


    会不会有这样的情况，就是心理预期过高，所以什么事都不想干，也就是所谓的眼高手低？


    万维钢

    自增强学习法的心理预期，取决于此前体验到的奖励，一般设定为以前奖励的平均值。而敏感度，则是不能感受到那些奖励。一个眼高手低的人很可能就是对奖励的敏感度不够。'
  - '[PAGE 133]


    的人物，一般的项目，他根本看不上眼。这就是眼高手低。


    但他之所以这样，是因为他感受到的奖励都是别人的，他没有真正的奖励敏感度。等到他真的自己开公司，发现赚钱原来那么难，有一天终于收到第一笔收入的时候，他才会切身体会到什么叫“奖励”。


    于奋斗者来说，我看一般的规律是人心总不满足，永远想追逐更大的奖励。


    但也有一些人可能从小家庭很富裕对钱本来就不在乎，也可能是的确没有那么强的竞争意识，对一般的金钱之类的奖励失去敏感度了，我觉得这首先根本就不是个问题：难道生活幸福还是问题吗？


    那如果非得想要学点什么东西，那 ensayo得追逐一些不寻常的奖励，比如说可以钻研学问。而钻研学问，也得先能体会到学问给的真正的奖励才行。


    # 来自日课：路径依赖


    # 读者 李壮：


    我之前认为路径依赖只要是经过长期积累的事物，比如每天写一篇文章，每天发一份语音，而您强调了首次开始这件事情的偶然性，而之后发生的关键几步奠定了之后发生的事情的基础。路径依赖应该强调偶然性呢？还是应该说只要是长期积累的就具有路径依赖呢？


    万维钢


    我们必须把“路径依赖”和“沉没成本”区分开。两 人都在前期有投入，但是对沉没成本来说，前期的投入并不会对后期还这么做有什么好处，没有形成正反馈，我们只是在心理上觉得就那么浪费了可惜，理性的选择应该是放弃沉没成本。而路径依赖的特点，是个正反馈的过程，越往后越难以改变，越往后越适合继续做跟前面类似的事情。


    那为什么要强调偶然性呢？因为前面还没有形成依赖的时候，也是可以轻松选择的时候，也是可以轻松选错的时候，也是命运波动更大的时候。大学选专业很重要，下周一早上那节课上不上不重要。我们不要选专业非常草率，按时上课倒是挺积极。


