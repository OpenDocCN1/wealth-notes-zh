    # 《模型思考者》2：怎样研究“人”


    万维钢·精英日课³

    今天


    进入课程 ›


    《模型思考者》2: 怎样研究. 12:07 8.32 MB


    我们继续讲斯科特·佩奇的《模型思考者》这本书。在讲具体的模型之前，咱们先统一解决一个大问题，那就是如何对“人”进行建模：如何研究人。


    我们即将钻研的大多数模型中都会有人。不管你要观察社会也好，玩转世界也好，制定政策也好，都需要分析人、琢磨人。那人到底是什么样的呢？人们大约有两种态度。


    一种态度认为人是简单的。有些领导认为人就应该令行禁止如同 Robots，有些人认为人就是一群乌合之众……传统的经济学家有个“理性人”假设，也相当于是一种简化。而近年来，很多“行为经济学家”认为这是不对的，人没有那么理性，人有各种非理性的偏见。


    这就引出了第二种态度，认为人是非常复杂的。正所谓“人心难测”，一切描写人的模型都存在漏洞。但是我感觉这个态度其实是智识上的懒惰：你一句“人是复杂的”，别人说啥都不对，那你倒是说个对的啊？


    到底应该怎么研究人呢？我读佩奇这本书得到一个洞见。


    你不应该笼统地问“人是什么样”。你应该问的是在你研究的这个局面中，在这件具体的事情上，人是什么样的。人做某些事情的时候很聪明，做另一些事情则很不聪明——因为根本不需要聪明。


    是局面决定了人。抓住这一点，你就会对“人”有一个非常好的敏感度。


    # 1.人可以是什么


    要想研究人，你得有个上帝视角。你得有个足够大的心肚，敢从人群中跳出来，把“人”当做你的研究对象。不要被“人”所听倒！咱们先来探讨一下人这种东西的复杂度上限。


    首先人具有多样性，每个人都是不一样的，有自己的想法、判断和追求。这几乎对人的研究造成极大的困难，使得社会科学几乎不可能是一门精确的科学。有个著名的倘说，想一下如果每个电子都有自己的想法，可以不遵守物理定律，物理学将会是什么样的理论……


    不过别担心。你的确很难预测*一个人的*行为，但是你可以在大体上判断*一群人*的行为。


    这是为啥呢？因为个体的差异可以互相抵消。比如你开个餐馆，具体到一个特定的人今天来不来你这吃饭，你很难判断——但是你每天的顾客人数其实都差不多。有人本来想来因为临时有事来不了，有的人本来没想来因为路过看到就来到了，这种种的出入互相抵消了。


    再比如在投票选举中，有的人观点左得离谱，有的人观点右得离谱，但是因为互相抵消，最后这个人群整体的观点就还是比较靠谱的。当选者的政策不会太离谱。


    但互相抵消的前提是每个人都独立思考，犯错的方向向四面八方都有才行。而如果人和人之间有强烈的互相影响、互相模仿，那么整体就会表现出一个强烈的倾向性。比如一家银行，本来每天被取走的钱都差不多，有一天突然传来一个谣言说银行要破产了，人都来挤兑，那你就不能再使用平常的模型了。


    是各自独立还是互相模仿，这是我们研究人群的一个重要视角。


    另一个视角是，人们是在例行公事地按照习惯做事，还是正在根据当前局势的变化调整自己的行为模式。如果局面很稳定，其实大家都是按照习惯做事。只有在一些很特殊的情况下，人才会表现出一些不寻常的特点。


    所以针对不同的局面，你要选择不同的模型。


    # 2.三种关于人的模型


    大致来说，关于人的模型一共有三种。


    第一种是“理性人模型”。我们栏目多次说过，经济学和博弈论所说的理性，就是你明确知道自己想要什么，并且为之采取行动。请注意理性不等于自私。你说你不为名不为利就想为人民服务，那也行——只要你的所作所为能用你的这个目的解释就行。


    学者们假设，如果你是理性的，你就会想去优化某一个量。比如你想攒钱，你就会把自己的金钱收入最大化；你想助人为乐，你可能会让自己帮助的人数最大化。


    经济学一般把你想要优化的这个量叫做“效用函数（utility function）”，博弈论里叫“报酬（payoff）”。不管叫什么，有了这个函数，我们就容易对理性人建模了。


    比如咱们考虑这么一个有关收入支配的问题。一般人都会把一部分花费用于房子，比如还房贷或者交房租，一部分用于日常消费。那这两部分的比例是怎样的呢？


    有一个经济学习论做了这么一个假设，说人在决定花费的时候，会把下面这个效用函数


    ```

    U = C^(2/3) H^(1/3)

    ```


    给最大化，其中 C 表示日常花费，H 表示在房子上的花费。


    你可能会觉得这个假设非常不合理：生活中有谁是照着这个怪异的函数花钱的啊？没关系，这只是一个模型而已，经济学家眼中的理性人什么事都做得出。假设人们真的是冲着让这个函数最大化去花钱的，他会怎么花钱呢？


    答案是 H，也就是房子花费，应该占你全部收入的1/3，其他花费占2/3。而这和对真实人群的观测结果也差不多，所以这是一个很不错的模型。


    你看这就是模型的力量。有了理性人假设和效用函数，你就能从中推导出人的行为。


    而且你还可以推导出各种问题的答案。比如说如果房价下降，人们会不会用更多的钱去买别的东西呢？这个模型说不会的，因为人总是把1/3的钱花费在房子上——如果房价下降，人们会选择买更大的房子，而不是用于别的消费。


    这就是为什么经济学家那么喜欢理性人模型：一切都是可推导的！当然这样的假设是有危险的。有些学者说人是“非理性”的，有各种认知偏误。其实很多这样的指控，包括著名的丹·艾里斯里的《怪诞行为学》书里说的各种实验，都没有通过严格的重复验证。所谓非理性的偏误，对经济行为真正有影响的大概只有两个。一个是“损失厌恶”，也就是人对失去的厌恶超过对得到的喜悦。一个大约可以叫做“锚花糖谬误”，也就是人会过高地估价当前的价值，而不愿意等一段时间拿更低高的价值。


    事实是人在大多数情况下是非常理性的。你可能不会计算效用函数，但是你有各种生活经验、你可以向人学习，你的经济决策通常比较接近于最优决策。就算被骗一两次，你吃一堑长一智也不会被骗第三次。特别是买房这样的大事，你肯定会比三家，做非常精确的计算，总不至于糊里糊涂地多花30%的钱。


    所以理性人模型有众多的优点，还是很实用的。理性人模型决定了人在发挥智识上限的情况下会怎么做。


    第二种模型叫“固定规则模型”，代表了人的行为下限。它假设人没有那么多想法，只是根据习惯，按照一个固定的行为模式去行动。比如你的模型可以直接假设人会把三分之一的花费用于房子……其实在某些情况下，这跟理性人假设的推导是一样的。


    还有一种叫“适应性规则模型”。这种模型认为人会从几种行为模式中选择。具体怎么做，他可以跟别人学习，或者根据当前局面自己决定。


    那么什么问题应该用哪种模型呢？取决于在这个问题中人到底有多瞌明。


    # 3.局面决定人'
  md: '

