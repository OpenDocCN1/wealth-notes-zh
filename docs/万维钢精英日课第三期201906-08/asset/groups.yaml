    ☆亚里士多德：亲自观察大自然，写下覆盖所有学科的观察记录和论述。他把观察实验和理性思辨结合起来，可以说是科学研究方法的创始人。


    政治主张：既包括精英政治、又包括民主政治的制度，允许民众用民主去制衡精英的统治。这可以说是后世英美政治的雏形。


