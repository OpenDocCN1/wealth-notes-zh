    把 Hacker 这个词翻译成“黑客”很大程度上是一种音译，但“黑”这个字自带“神秘+ wst” 的色彩，确实也很切合黑客的特点。《生活黑客》的这一讲，我们对“黑”这个字发掘一个更极端的意思——


    # “黑化”的黑。


    “黑化”这个词可能起源于对网络小说的文学评论，我理解，意思是为了追逐什么东西而到了不顾一切的程度，把自己变成坏人。比如我有个朋友的上级领导，原本是个正常人，可是因为感受到了威胁，为了保住权力，做了很多极端的事情，就被人看做是黑化了。


    哪怕要做一个生活黑客，你也应该避免黑化。里吉尔有个贯穿全书的观念，说生活黑客有两种追求，我们需要区分明白。


    # 1.极客的短板


    很多生活黑客都是极客（geek），也就是痴迷于技术，但是缺乏社交能力的人。极客因为懂技术而自视甚高，同时又因为不善社交而对人际关系有一种不安全感。这两种感觉加起来，使得极客对男女感情问题比较焦虑。2017
    年中国有个“翟欣欣事件”，一个优秀程序员被她骗婚，然后居然自杀了。你要是觉得不可思议，那是你不理解极客的苦。


    # 2.“把妹达人”


    有一派生活黑客专门破解女性的被诱惑心理，琢磨怎么让女生瞬间喜欢上自己。他们自称“pick up artists”，搭讪艺术家，在中国也被称为“把妹达人”。他们总结了一套有步骤有流程有剧本的“算法”。


    # 3.夫妻的游戏


    用大数据相亲也好，用技术手段搭讪也好，生活黑客如果只追求“找到”和“捉到”异性，那还是不行 的。开始一段关系和维持一段关系是两码事，如果没有长久的浪漫关系，
    人生仍然是失败的。所以生活黑客对夫妻关系这个系统也要破解。'
  - '[PAGE 79]


    力工作、在“挣钱者”这个项目上拿到高分，他就可以偶尔出轨，在“丈夫”这个项目上拿低分了……蒂姆·费里斯对此深表赞赏。


    而这样的系统对妻子来说实在有点不公平。有一对生活黑客夫妻，一个是机器学习的工程师，一个是计算机游戏设计师，发明了一套夫妻间的游戏系统。现在不是流行把生活给“游戏化”吗？这套系统的思路就是如此，要把游戏设计的公平合理，让双方独立自主决定，同时必须确保男女平等。


    核心方法，是一个“竞拍”体制。比如现在有个倒垃圾的家务活，俩人其实谁都不想干，那谁干呢？竞拍。他们的竞拍非常先进，是我们专栏讲博弈论的时候说过的“次价格密封拍卖”法
    [2]。


    假设丈夫出价 2 美元，妻子出价 4 美元，那么妻子赢得竞拍。于是妻子要付给丈夫 2 美元，丈夫去倒垃圾。这个方法的好处是拍卖价格体现了双方做这件事的意愿强烈程度。妻子出价更高，说明妻子更不愿意去倒垃圾，那么让丈夫去做的确更合理。丈夫认为倒垃圾这件事值
    2 美元，他果然得到了 2 美元，非常满意。而妻子原本认为倒一次垃圾值 4 美元，现在只花了 2 美元，也很高兴。


    再比如说妻子要求丈夫陪看电视剧，而丈夫不想看，这也可以竞拍。丈夫愿意花 50 美元获得不看的权利，妻子愿意花 40 美元让他必须看，那么丈夫获胜，并且付给妻子
    40 美元，仍是皆大欢喜。


    这是资源的有效分配。我建议你以后要跟同事决定谁做什么事情，可以尝试使用这个方法。再也不用揣摩对方的真实意图了，直接拿钱说话多简单。谁都不必被迫、白做、自己不喜欢的事情，谁为谁做事都不用记账。


    可是夫妻间这么干合适吗？各自有自己的财务账号好吗？万一一方没收入，这还公平吗？但是这两位生活黑客长期使用这个方法，宣称只要是在卧室之外，什么事情都可以竞拍，并且认为效果良好。


    你能接受生活黑客们的这些做法吗？过分的优化可能会走向黑化。有些人喜欢吹嘘自己搭讪成功的次数，有些人对相亲上瘾，想要把所有合适的对象都见一遍，有些人认为只要满足了量化指标就可以为所欲为……


    对某一项指标的优化可能会蒙蔽你的双眼，让你看不到更重要的东西。


