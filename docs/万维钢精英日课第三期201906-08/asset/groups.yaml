    《模型思考者》10：什么是好…

    12:40 8.7 MB


    |转轮：怀沙|

    我们继续讲斯科特·佩奇的《模型思考者》。我们要讲一个特别重要也特别美好的数学概念，叫“李雅普诺夫函数 (Lyapunov function)”，它是以为俄罗斯数学家亚历山大·李雅普诺夫命名的。这个东西已经有超过一百年的历史，但是并没有在民间流行。


    理解了李雅普诺夫函数，你就能领略一点数学家的思维方式，看看数学家如何从一个问题中提炼出一个好思想，然后把它推广到其他问题中去。你还可以获得一个对世界的洞见，然后用这个洞见去处理一些真问题。


    ## 1.李雅普诺夫函数


    咱俩想象一个虚拟的场景。从今年开始，美国每个州都实行一项福利政策，给最无助的穷人发放补贴金。有的州给每人发1000美元，有的州发800美元。这是一个献爱心的事儿，各州都要表示一下，但是又都不想比别的州发得多，不然人群就都搬到你这个州来领补贴了。


    - 1. L 的取值，每一步都比前一步至少要减少一个固定的数额；

    2. L 存在一个最小值。


    ## 2.自组织


    社会活动为什么是一个均衡态呢？以前亚当·斯密提出“看不见的手”这个说法，司市场可以自动调节每个参与者的活动——更现代的学者把现象叫做“自组织”。可是到底为什么看不见的手这么有效，其实我们还需要一个数学证明。


    ## 3.自由贸易


    很多年以前我为了学英语，读过一本英文的《读者文摘》，其中有一篇文章的开头，让人过目不忘。那是一篇经济学家的文章，说为什么我们应该信借自由贸易呢？因为当商品发生交换的时候，买卖双方都会感到有利。


    易的理想状态。


    ## 4.应用


    李雅普诺夫函数这个思想很简单，所以也有用。


    佩奇有个学生，他上班的公司，有一次搬到了全新的办公室，老板突发奇想，说我们应该随机安排员工座位，然后允许任何两个员工互相调换座位。老板认为这个思路符合自由市场的原则，相信员工们会自组织，达到一个最优的平衡态。


    但是佩奇的学生学过模型思维，马上就指出这么做不对！学生说换座位是能让换座位的双方满意，可是它有一个负的外部性啊——他俩原来的邻座可能会不满意！邻座会想，你换座位是不是因为不喜欢我呢？而且你换这个人过来也没征求我的意见啊，我不喜欢他！所以换座幸福度不是李雅普诺夫函数。老板一听有道理，就打消了这个想法。


    后来老板又有一个新想法，他买了各种不同的款式的办公座椅，随机发给员工，然后让员工自由交换座椅。佩奇的学生一看这个是可行的，因为座椅只影响到交换的双方，第三方的人不在乎你坐什么样的椅子，其中没有负的外部性，所以幸福度是个李雅普诺夫函数……


    也许就算不知道李雅普诺夫函数，你也能找到其中的问题——但是有了李雅普诺夫函数这个概念，你从此就会对复杂系统的演化非常敏感。数学模型能让你的脑子里多一根弦。


    咱们好好体会一下这个思想的妙处。不管是多复杂的系统，数学家说只要你能抓住其中一个关键变量，你就能证明它会是均衡的。


    请注意这个道理反过来可不一定对：并不是所有均衡系统都有李雅普诺夫函数。就有一些系统，经验表明是均衡的，可是数学家就是没有找到它的李雅普诺夫函数，所以没办法证明它为什么一定会达到均衡……这在数学上是一类很有意思的问题。


    李雅普诺夫函数，是数学家的战略性武器。


