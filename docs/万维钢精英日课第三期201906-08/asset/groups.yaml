    # 信号与刷分


    万维钢 · 精英日课³

    今天

    进入课程 >


    信号与刷分

    11:29 7.89 MB


    咱们来思考一个问题。假设你是一所顶尖大学的校长，你打算明年在某省录取100个能力出众的好学生。你打算把他们培养成第一流的科学家、工程师和管理者。而与一般大学校长不同的是，你有一个特权。


    你有权给这一届学生来个突然袭击：不等到高三毕业参加高考，而让他们在刚刚上完高二的时候，就参加一次高考水平的考试。


    这是一次计划外的特别录取，不跟上一届学生抢录取名额，所以依然是公平竞争——只不过提前了。其实一般的高中这时候都已经把高中三年的知识都学得差不多了，高三一整年都在准备高考。而你这个突然袭击的作用，就是在全省考生都不经过专门的高考训练的情况下，让他们考试。


    那请问你会这么做吗？


    我们来想想这意味着什么。为此我们再思考一个问题。假设你是一家“不作恶”的网络搜索引擎公司的老板。你们公司希望通过给用户提供诚实服务赚钱，所以你要要求这个搜索引擎提供的网页排名，符合用户的实际需求。


    但是你知道，现在有一种叫做“搜索引擎优化”的技术。有很多网站会根据搜索引擎给网页排名的算法，主动改造自己的内容，比如加入一些热门的关键词。更有甚者，有的网站还专门买一些指向自己的外部链接，让搜索引擎以为自己是个热门网站。


    那请问，你会鼓励网站搞搜索引擎优化吗？


    当然不会。如果有网站付钱给你买广告关键词，那是另一回事，你会把广告单独列出来让用户知道。而除了广告之外，你跟用户对网页排序的要求是一致的。如果用户搜索“士耳其签证”，你希望把土耳其大使馆签证处——而不是某个诈骗网站放在第一位。


    你会非常反感搜索引擎优化。你希望把网页按照内容的真实质量排名。这就如同诚实的相亲一样，用户想看素颜照，而不是美颜照。


    而在某种程度上，学生用一年的时间刷题准备高考，就如同搞搜索引擎优化。


    在经济学家里，学生参加高考，是一个“发信号 (signaling)”行为。如果大学知道哪些学生是好学生，它直接录取就行，根本没有必要搞什么高考。高考是因为好学生没有别的办法让大学知道自己是好学生，所以必须发一个信号。


    如果信号系统好使，那就越是好学生，高考成绩就越高。但我们都知道真实情况是什么样的——高考成绩往往只体现了这个学生参加高考的水平，而不一定是日后实际工作、比如说搞科研的水平。所以高考是个不完美的信号系统。


    我看到最近芝加哥大学和哥伦比亚大学的两位经济学家，亚历克斯·弗兰克尔 (Alex Frankel) 和纳文·卡蒂克 (Navin Kartik)，发表了一篇论文
    [1]，专门研究这种不完美的信号系统。


    研究者把这种带有刷题或者搞搜索引擎优化成分的信号，称之为“混杂信息 (Muddled Information)”。


    然后他们把混杂信息分解成两个部分。一部分称为“自然行动 (natural action)”，代表自然能力；一部分则是“比赛能力 (gaming ability)”，代表刷分的水平。


    比如你想录取一些未来的物理学家，那你看中的肯定是学生的自然能力，包括研究能力、数学能力、抽象思维能力等等。自然能力强的学生不一定比赛能力也强，他们可能不喜欢刷题，不喜欢死记硬背的知识，可能偏科，甚至还可能一考试就紧张——而你根本不在乎那些。


    你想要的是自然能力，但你收到的信号是个混杂信息。


    再比如说，现代社会人们一般都有一个“信用分数”。银行会根据你的信用分数决定你能申请到多少贷款，以及你的信用卡的透支额度。理想情况下，信用分数应该反映一个人的自然能力，比如收入水平如何、以往的贷款是不是都能按时还清之类。可如果人们知道信用分数的计算方法，就有可能会使用一些办法去“刷”这个分数——比如故意借一些小钱然后马上还清。而作为银行，你不希望人们刷分。


    应该怎么理解刷分这种行为呢？


    弗兰克尔和卡蒂克这项研究使用纯数学理论分析的方法，推导了刷分行为的一些性质。这些性质都很直观，我们一想就明白。


    如果一个项目的竞争水平很低，人们表现出来的就是自然能力。比如让一个从未受过系统乐器训练的孩子弹琴，如果他一上手就弹得不错，你只能承认这是天赋。再比如几十年前刚刚恢复高考的时候，根本就没有什么“模拟真题”可以刷，考生就没经历过什么专门的考试训练，那么考出来的成绩就很接近自然能力。


    随着竞争越来越激烈，人们越来越意识到这个考核指标的重要性，就开始刷分了。这时候的信号就变成了混杂信息，而且其中刷分水平所占的比重越来越大。这就是现代社会几乎所有热门考核指标都面临的局面。


    如果所有人的刷分水平都一样，那无非就是个囚徒困境，现在大家都多费点劲，但是信号质量还是不一样的。这就如同在体育场看比赛，原本大家都坐着看得也很清楚，有的人非得站起来看，结果大家不得不住着，可是视野范围还是那么大。


    但问题就在于刷分常常是不公平的。有的人其实水平一般但是特别善于考试，有的人钱多可以请最好的老师专门帮他准备考试，有的人远地地区的孩子看不到那么多考试资料，有的人网站没钱搞搜索引擎优化。


    怎么对付刷分呢？


    对于比较成熟的考核，考核指标的设计者一般都知道刷分现象的存在，并且采取了一些措施。最直接的办法，就是对指标的算法保密。


    Google 的网页排名算法就是保密的，而且总在变动。搞搜索引擎优化的人只能猜测 Google 根据什么东西决定网页排名，而 Google 也知道他们的猜测，双方一直都在斗智斗勇。排名算法不是体育比赛的规则，而是高考的试题！


    类似地，我们知道《美国新闻与世界报道》杂志每年推出的全美大学排名，各个大学都非常重视，因为排名高低直接影响生源质量和收到的捐款。而且大学搞了有针对性的刷分——比如排名算法中有一项是录取率越低，排名分就越高，所以大学就会大肆鼓噪那些原本没希望被录取的学生也来申请，以此刷低自己的录取率。有感于此，《美国新闻与世界报道》杂志现在改成了每年先公布大学排名，再公布当年的排名算法。


    考试就更是如此。一直到上世纪八十年代末，“美国高考”—也就是SAT考试的历届考试“真题”都是保密的，让学生刷无可刷。后来实在保不住，SAT 又主动在网上放出一些免费的真题，以期帮助那些没钱买训练题的学生，让考试更公平。


    不过道高一尺，魔高一丈。GRE 考试的历届真题也都是保密的，但是我听说中国有些培训机构的老师会以考生的身份报名参加考试，目的就是为了拿到真题。


    GRE 有一项考英文词汇量，目的其实是通过词汇量判断考生平时的阅读水平——可是中国考生因为刷题，明明阅读量不行，反而都掌握了那些常考的偏僻词汇。这公平吗？这跟搜索引擎优化和拍照开美颜有区别吗？


    中国高考如果出一些不按套路出牌的新题型，师生们常常会抱怨——可是这就对了。新题型就是要让刷题无效。'
