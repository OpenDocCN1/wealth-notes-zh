    我们专栏第二季讲过佩奇的《多样性红利》。以我之见《模型思考者》是更重要的著作，我预期在未来几年之内，它会被很多好学者的书单列为必读书目。


    “模型”，你早就听说过了。查理·芒格特别爱说“思维模型”，曾经列举了几十个有用的模型。佩奇眼中的模型比芒格那一套要高级一些，这体现在佩奇敢用数学。佩奇这本书里也讲了二三十个模型，而且讲了怎么科学地使用模型思考。


