    # 特别放送：通才和专才


    万维钢 · 精英日课³

    今天


    进入课程 ›


    特别放送：通才和专才

    00:36 425.52 KB

    |纯连：宁夏|


    万维钢


    今天的主题是：通才和专才。结合咱俩讲完的这本书《范畴》，我们来把三季内容里，有关对通才和专才的最新研究和最新认知，帮你做个总结，希望能对你理解当前世界的技能格局、为自己选择精进目标，或者为下一代选择职业方向，有所帮助。


    ## 1.通才和专才，狐狸和刺猬


    这个著名的比喻出自哲学家以赛亚·柏林——叫“狐狸与刺猬”。专才就像刺猬，一门心思就只知道自己的一件大事，拿个锤子看什么都是钉子；通才就好像狐狸，对各种工具都很标准知道一点。


    ## 2.怎样成为一个专才


    成为专才的办法，是“刻意练习”。但刻意练习并非对所有情况适用：


    第一，有严格固定规则的领域，练习的作用最大；没有严格规则的领域，练习的作用非常有限。


    比如国际象棋就有非常严格的规则，在国际象棋的领域内，一个人的总练习时间能够解释他26%的表现。在音乐领域，练习时间长短能解释21%的表现；在体育中，练习时间能解释18%的表现。剩下的可能是天赋和临场发挥水平之类，也许还包含偶然因素。


    而教育、编程、航空飞行这些更常见的职业，往往不像体育比赛那样有什么固定规则，发挥更加复杂，一个人的练习时间，却居然只能解释不到10%的表现。


    第二，环境局面越是可控和可预测的，练习的作用越大；局面如果是复杂多变、不可预测的，练习的作用就很小。综合统计，在那些最可预测的环境里，练习能解释24%的表现。在最不可预测的环境中，练习能够解释的因素只有4%。


    练习其实就是练套路。真实世界里的工作套路并不固定，高水平工作要求你临场发挥，要求你借鉴不同领域的见识，那只靠年轻时候的刻意练习，当一个方面的专才就远远不够了。


    ## 3.通才和专才贡献度比较


    从二战结束开始的总体趋势是专才的重要性越来越强，世界的确是变得越来越专业化……但是专才的重要性在1985年就到达顶了，然后剧烈下跌。通才和全才越来越重要。


    此后专才的作用保持了一段平稳期，但是2007年之后，又开始下降。研究者分析这很可能是因为现在有了互联网，专业知识越来越容易被认得到，专才的稀缺性进一步下降了。


    所以现在这个世界恐怕是通才已经压过了专才。而专才更严重的问题在于他们擅长的领域都是比较狭窄的，这种方向的不确定性比较低。那么结果就是竞争很激烈，而且如果你取得突破，别人会马上学过去。


    ## 4.通才更值钱


    今天社会的分工越来越细，需要很多专才，教育系统培养的也是专才，可是真正值钱的却是通才。尤其是领导职位，比如一个公司的CEO，就应该在各个领域都有所涉猎才行。


    有人调查了4500名CEO的履历表，发现他们总共从事过超过三万五千个不同的职位。研究者就考察这些CEO之前从事过职业的多样化程度，来判断这个人是“专才”还是“通才”。结果是“通才”更受欢。


    “通才式CEO”的平均工资，比“专才式CEO”高出19% —— 相当于每年多100万美元。


    如果是特别复杂的业务，比如涉及到公司合并、收购之类的技能的话，通才的工资甚至比专才高出了44%。


    ## 5.怎样成为一个通才


    这是一个需要通才的时代。可以是“练习”容易刻意，但是成为通才，似乎很难刻意。你很难抱着实用的目的学习广泛的知识 —— 到底哪个知识有用，应该在各个领域投入多少时间最划算，这种优化问题根本无解。通才的目的本来就是为了对付复杂问题和不确定的局面。


    也许“什么什么知识到底有什么用”，这个问题就错了。如果哪个知识都可能有用，那你最应该关心的其实是你对什么感兴趣。真正的斜杠青年追求的不是简历上多个斜杠，而应该是培养广泛的兴趣，把知识本身当成回报。


    ## 6.成为通才的5个建议


    第一，别怕起步晚。什么“赢在起跑线”，以自己家孩子上幼儿园的时候会小学二年级数学为荣，那是愚昧无知。各人的起步速度不一样，长大以后比的才是算数。年轻时候是个宝贵的尝试期，别糟蹋了。


    第二，要追求一个“匹配质量”：随时想想你是谁，你做什么。但匹配终究是做出来的。


    “匹配质量（match quality）”是经济学家提出的的概念 —— 你是在“我是谁”和“我做什么”这两者之间进行匹配。英格兰和威尔士的学生宁可放弃那么多年学成的技能也要换个工作，说明匹配质量比早学一个技能更重要。而大学的作用不仅仅是传授技艺，更是多给了我们几年的尝试期，推迟专业分工。


    这些研究告诉我们，你的梦想来得越晚，它就越值得坚持；你的梦想来得越早，你就越应该考虑换个梦想。


    “我是谁”，不是什么你深夜入静时自问问出来的。你必须尝试各种各样的事情，才能*发现*你喜欢做什么，你想做什么，你能做什么，你是谁。而且答案可以随时改变。


    第三，不管你的主业是什么，都要给自己留一个“刻意业余”的时间段。


    所谓刻意的业余，就是专门安排一些时间去做一些自己专业以外的的事情。有研究说，一般科研工作者的业余爱好水平普遍与老百姓没什么区别。但是学术水平越高的科学家，就越有可能在学术工作之外发展个什么业余爱好
    —— 而诺贝尔奖主有诸如演员、舞蹈家或者魔术师之类业余爱好的可能性，比一般科研工作者要高……22倍。


    第四，要敢于跨界，大胆创新。在那些创造性强的领域，谁有多少年的工作经验根本不重要。


    一般人看东西是关注不同点，而高手则善于发现两个很不一样的事物之间的相同点。类比思维的规律是，你能想到的类比越多，你的判断就会越准确；你能想到的类比越遥远，你出的主张就会越有创造性。


    四种真正有效的学习方法——立连结、混合练习、先检测再学习、设置时间间隔，他们的共同特点就是慢。你意识到，输了现在赢得未来的功夫，才是真功夫。


    第五，学习的目标不是把自己变成工具，而是磨炼智识上的健全人格。


    古之学者为己，今之学者为人。知识分子不能把自己变成别人的工具，真正的学者得追求一个智识上的健全人格。杨振宁的父亲让他读《孟子》，那不是为了给科研做准备，什么“功夫在诗外”，而是为了培养健全人格。


    我认为这才是“通才”的本质。


    ## 7.不如成为一个全才


    全才的特点是，他有一个自己的核心领域，在这个领域中钻研比较深，比通才深但没有专才那么深。但是全才不仅仅专注于这一个领域，他能够把核心领域中的技能运用到邻近的领域中去。他通过这样的方式能不断学习新东西，以至于最后全才涉猎的广度甚至超过了通才。全才往往可以缔结几十个专利类型！全才的创造力是最强的。


    什么样的人最能创新？我们的结论是你钻研特别深也行，或者特别广也行，最好是既深又广……最怕的就是既做不到深，也做不到广。


    ## 8.这个世界需要通才，也需要专才


    “有些数学家是鸟，有些是青蛙。鸟飞得


    > “有些数学家是鸟，有些是青蛙。鸟飞得高，能看到很广阔的数学景色，他们喜欢统一的概念，能把数学上不同的领域连在一起。青蛙住在泥地里，只能看见自己周围的花草，他们钻研细节，每次只解决一个问题。我碰巧是一只青蛙，但我的很多朋友是鸟。我想说的是，数学既需要鸟，也需要青蛙。”——弗里曼·戴森


