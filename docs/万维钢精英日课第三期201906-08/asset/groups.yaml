    特别放送：极简西方思想史

    00:34 396.48 KB


    万维钢


    今天我们来把《历史的正确一侧》这本书，帮你做个总结讲座。西方文明是怎么强大起来的？西方的道统到底是什么？它的宗教基因、文化传承、价值观的主干和分支都是怎样的？希望今天的串讲能帮你梳理得更清晰，理解了这套体系，对于如何站在西方的角度理解西方，会更有启发。


    # ★整个西方文明的思想，是建立在两个支柱之上


    一个支柱来自耶路撒冷，也就是犹太教和基督教。


    > 《旧约》明确提出，“上帝照着自己的形象造人”。


    - 1. 人人平等。

    - 2. 活着的目的：人生就是要完善自我。


    # 提供意义：意义带来人生的目的。


    另一个支柱是雅典：古希腊的科学家和哲学先贤


    理性：人应该通过理性去探索、研究和改造这个世界。


    # 提供理性，理性带来达到人生目的的能力。


    # ★从这两个支柱出发，可以推导出几个推论


    第一，人生在世不不仅仅有物质的追求，还有道德义务。你要做个更好的人，你要有道德，本质上并不是因为这么做对你有什么好处，而是因为你有一个更高的目标，那就是接近上帝。


    第二，大家都是用上帝的形象造出来的，所以除了上帝之外，没有别的权威。每个人如何接近上帝，那是个人的事情，而不是君主的事情。


    第三，用科学理解世界，用技术改造世界，这些事儿你不但可以做，而且应该做。科技来自理性。


    # ★耶路撒冷的一种论给人类的认知升级


    世界有规律，个人有自由，历史有方向，这就是耶路撒冷带给西方文明的进步基因。


    世界有规律：世界是有规则的，而且上帝本人也得遵守那些规则。


    个人有自由：你有神性，你应该完善自我，去模仿上帝。这就说明人不但有价值，而且还是自由的。这表现在你有自由意志，你有选择权。


    历史有方向：历史前進的方向則是讓人完善自我，最终让所有人都能接近上帝。


    # ★雅典的修炼系统给人提供升级方法


    目的论：人应该从自然法则中寻找人生的目的，也就是 “telos”——也就是运用理性——运用理性去识别世间万事万物的 telos，去思考和判断——如果一个东西能很好地完成自己的
    telos，就认为它具有美德（virtue）。


    雅典哲学家因为有了目的论，就建立了一个修炼系统——无上限地完善自我。


    ☆柏拉图：世界有一套统一的理性系统，而这套系统完美地映射到了人的头脑之中。宇宙是数学的，而数学是人可以单凭逻辑推理就推导出来的东西。柏拉图的主要修炼方法是思辨。


    政治主张：“理想国”是个等级森严的系统。国家的权力应该是一个严格的自上而下的系统：按照理性修炼的等级，最上层是哲学家，中间是战士，底层是普通劳动者。


    > （后世哲学家卡尔·波普尔点评：“纯粹的集权，而且反人类。”）


    ☆亚里士多德：亲自观察大自然，写下覆盖所有学科的观察记录和论述。他把观察实验和理性思辨结合起来，可以说是科学研究方法的创始人。


    政治主张：既包括精英政治、又包括民主政治的制度，允许民众用民主去制衡精英的统治。这可以说是后世英美政治的雏形。


    # ★但是，这两大支柱有矛盾，见下表


    | 三个关键问题 | 耶路撒冷 | 雅典 |

    |---|---|---|

    | 上帝关心吗？ | 关心 | 不关心 |

    | 人可以完全用理性探索世界吗？ | 不完全能 | 能 |

    | 个人有自由吗？ | 有 | 几乎没有 |


    # ★后来，这两大支柱还是融合了


    融合的路徑如下：


    基督教第一次改革，淡化教义的犹太部分，推向所有人——吸纳底层，抛弃理性——对上层战役，以退为进——教会成为欧洲最重要的政治力量，集权统治——教育普及，希腊哲学回流——经院哲学运动，第二次改革——运用理性，融合理性——基督教开启了科学。一直到达尔文时代，所有重要科学家都信仰上帝。


    # ★融合之后出现了两大思潮


    学者们开始用理性思考世俗的问题：科学，自由和权利


    - 1. 科学：

    ☆培根：知识就是力量——研究科学就应该是为了改善人的生活。

    ☆笛卡尔：怀疑一切——拒绝接受直接灌输给他的知识，

    - 2. 自由和权利：

    ☆马基雅维利：《君主论》——人根本就不是由理性驱动的，而是由欲念（passion）所驱动的。人性本恶！权力运作本质上就是利用和操纵人的欲念。

    ☆马丁·路德：宗教改革——上帝面前人人平等

    ☆霍布斯：打开了“人权”的大门——人权是人的自保留，也即是生命权。权利意识。

    ☆约翰·洛克：人总共有三个自然权利——财产权、生命权和自由权。立法权和行政权两权分立的政治思想。

    ☆亚当·斯密：人的自由和财产权利——人有权自由交易。

    美国建立，是上述所有这些西方重要思想集大成的结果。


    # ★人类驱逐了上帝，自己做主。那人为何活着？


    请看大型神仙打架现场：

    ☆马基雅维利：人可以用理性去控制欲念。

    ☆霍布斯：人其实根本就是由欲念驱动的，人为了活着可以做任何事情。权力才是真的，活下去就是目的。“道德相对主义（moral relativism）”的祖师爷。

    ☆斯宾诺莎：自由论者，鄙视宗教。人生目的是获得快乐。最小化政府。理性就算有用也很有限。

    ☆休谟：人生其实没有意义——或者说至少没有客观的意义。人无法从对世界的观察中找到人生的目的。理性其实是欲念的奴隶。

    ☆伏尔泰：我们要做的就是不断改善物质生活条件。

    ☆康德：人自身就道德本能。人生的目的就在我们内心预装的那套道德系统里。这是一个“先验”系统，类似于数学公理不证自明。称之为“绝对听令”。

    ☆边沁：“功利主义（Utilitarianism）”，主张道德就是把全社会的总幸福给最大化。

    ☆卢梭：欲念也有好的。

    ……

    直到☆达尔文提出进化论，就完成了对上帝的最后—击。人們终于意识到，人其实也是动物。我们人类的所作所为看起来非常复杂，归根结底不还是为了提高自然选择中的适应度吗？说白了还不是为了生存

    '
  mdcn: '

    甚至有些女权主义者认为，连科学本身都有问题——所谓科学方法，其实都是男性发明的，是男权的工具！


    总而言之，新左派运动的特点是三点——


    - 1. 认为主观大于客观。客观对错不重要，重要的我要自豪感；

    - 2. 不相信人能够掌控自己的命运，认为自己的不幸都是社会压迫，社会必须改变，才能改变自己；

    - 3. 把理性和科学，也当做是专制压迫的手段。


    这是受害者心态。而实际上新左派的典型代表往往不是真正的受害者，他们恰恰是从优越家庭环境中长大的人，可能大部分都是白人，他们是想要*代表*受害者——所以才叫“白左”。而如果一个黑人说我不想要特殊的照顾，我认为看人应该只看能力，他反而会被白左们视为黑人的叛徒。


    那白左们这番努力给黑人带来什么真的好处了吗？恐怕没有。科学研究证明受害者心态只会把人变得脆弱和容易走极端。学校里那些整天认为自己受到歧视的学生成绩更差，学习动力更低，他们不愿意面对困难和接受挑战。有的人还可能走向犯罪，理直气壮地以受害者的姿态报复社会。


    这是当前美国社会的重大矛盾。族群身份，已经成了某些人的人生意义。


    夏皮罗感到痛心疾首，但是他并没有提出什么好的解决办法，也没有预测未来的思想趋势。夏皮罗呼吁美国回归耶路撒冷和雅典的传统，他把希望寄托在了下一代身上。他说他会教育自己的孩子下面这四件事情——


    第一，人生有目的。你现在不一定知道，但你要去发现自己活着的目的。


    第二，你有理性的能力。你要去发展自己的能力。


    第三，你身处的西方文明是独一无二的伟大文明，你享受历史上从未有过的自由。你应该珍惜和热爱这个文明，而不要整天想着去破坏它。


    第四，也别太极端，就算别人跟你想的不一样，大家也还是兄弟姐妹。


    当然作为中国读者，我们不一定赞同夏皮罗这些看法。我认为这本书给我们最大的收获是了解西方人都在想什么，各种思潮是怎么来的。这本书咱们就算说完了。明天我想探讨一下应该如何站在西方的这些观念上理解西方。


