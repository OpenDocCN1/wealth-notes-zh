    # 《历史的正确一侧》7：公共意志的幽灵


    万维钢 · 精英日课³ 今天 进入评论 >


    《历史的正确一侧》7：公共。 12:01 8.25 MB | 转载：亦汐 |


    我们继续讲夏皮罗的《历史的正确一侧》。当我们谈论“西方”政治的时候，一般的印象大约就是现代化的民主国家、权力制衡、自由媒体、宗教信仰自由等等。但如果你真正站在西方的观念上去考虑西方政治，你就会发现这些都是表面现象。


    俄罗斯和土耳其都有选举，但它们跟我们说的西方好像不太一样。再细分分析，法国和美国非常不一样，甚至英国和美国也有不同的地方。而且西方各国在历史上的状态和现在也不一样。那要是在西方的观念上理解西方，到底应该怎么看呢？


    这一讲我给你提供一条主线。抓住这条主线，使用这个视角，局面就非常清楚。


    这条主线就是，个人和国家之间，应该是怎样的关系。


    # 法国大革命的遗产


    在摆脱宗教束缚的同时，西方学者们想设了各种不同的意义。美国建国坚持了洛克的天赋人权思想；而不久之后发生的法国大革命，则彻底抛弃了传统的意义观。


    法国大革命有三个理论依据。一个是伏尔泰对宗教传统价值的嘲讽，一个是知识分子对人类理性的乐观看法，而最重要Velocity 的一个，就是卢梭的“公共意志（general
    will）”思想。上<|message|>


    # 浪漫民族主义


    法国大革命最重要的一一个结果，就是把公民和国家之间的层级——什么贵族、领主、教会——全都抹掉了。以前的欧洲人只知道有领主不知道有国家——所谓“领主的领主，不是我的领主”——而现在是个个人直接和国家发生关系，你是国家的成员。这个观念，就导致了军队组织方式的变化。


    # 集体财富再分配主义


    另有一些哲学家，则把法国大革命看成是一个让人与人更加平等、乃至于消除阶级差异的革命。这一派最早的代表人物是美国人托马斯·潘恩（Thomas Paine, 1737-1809）。我们把他们称为“集体财富再分配主义者”。


    # 科学进步主义


    所谓科学进步主义，换个说法就是官僚主义。我们假设，现在没有贵族也没有教会了，“公共意志”怎么样才能管理国家呢？国家的实际管理者，其实是官僚集团——也叫“公仆”。'
  - '[PAGE 43]


    集团不打算让老百姓自己过自己的日子。

    他们一定要对社会进行自上而下的干预。


    总而言之，卢梭的“公共意志”演化出三大主义，本质上都是集体主义。它们的共同点是人是集体的一部分，个人意志要服从于集体。它们的分歧也很明显。


    很多人认为思想都是人对环境的反应，思想不重要，其实不是这样。当然环境对思想有作用，不然法国为啥跟美国不一样——但是我们考察历史，总是少数人先有一个思想，很多人接受了这个思想，再因为这个思想而改变世界。


    没有前面说的这些思想，就不会有后面发生的这些事情——


    浪漫民族主义发展到极致，代表国家就是纳粹德国。集体财富再分配主义的代表国家是苏联。这些咱不必细说，咱们说说科学进步主义的代表国家。你可以从几个经济发展好的亚洲国家身上看到科学进步主义的影子，但你可能想不到，科学进步主义的一个代表国家就是美国。


    从罗斯福新政开始，美国政府大肆扩充官僚集团，可以直接干预经济。当然这是一个见仁见智的事儿，很多人认为罗斯福是最伟大的美国总统，但是也有一些经济学家认为罗斯福新政*延长了*经济大萧条。


    政府应不应该干预经济不是我们这一讲的主题，但美国政府曾经打着科学的旗号搞优生学研究，打压少数族裔，甚至逼着所谓智商低下的人进行药物绝育，这在今天看来是绝对的坏事。


    我想用最简单语言给你总结一下这几个主义所代表的个人和国家的关系——


    美国建国和法国大革命之前的政治形态，是个人和国家基本上没关系。人们没有什么国家认同感，对宗教和自己的亲族更有认同感。


    美国宪法倾向于个人主义。个人有天赋人权，国家的作用只是保护个人权利。


    法国大革命开启了集体主义，它有三个派别。


    浪漫民族主义是个人要为国家服务，国家要对外竞争，要搞帝国主义。


    集体财富再分配主义不在乎国与国的竞争，但是要求国家为个人服务，消除阶级差异和贫富差距。


    科学进步主义则要求国家率领个人进步，并且为此可以直接干预经济和社会生活。


    我们看看现代世界每一个国家，是不是都是上面某些主义的某种混合呢？夏皮罗认为美国宪法代表的这一派才是历史的正确一侧，因为历史证明集体主义的三大派别都会走向极端，而直接的结果就是两次世界大战和冷战。


    这些战争结束之后，人们意识到集体主义真是不行。西方再次陷入意义危机。


