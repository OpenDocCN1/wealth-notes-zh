    ## 《历史的正确一侧》6：意义危机


    万维钢·精英日课³

    今天

    进入订阅 ›


    《历史的正确一侧》6：意义

    12:16  8.43 MB


    我们继续讲夏皮罗的《历史的正确一侧》这本书。


    鲁迅有个小说叫《伤逝》。说有一对进步青年男女，男的叫涓生，女的叫子君。两人冲破了封建包办婚姻的牢笼，自由恋爱，离家出走，生活在了一起。自由是自由了，枷锁是没有了，可是两人的经济来源也没有了。这日子怎么过呢？两人始终没有解决这个问题，只好分开了。子君在悲愤中去世，而涓生居然还埋怨子君没有生存能力！


    我听说有些研究认为 [1]，包办婚姻的幸福度比自由恋爱婚姻高。不过鲁迅说的看似是个爱情故事，其实是个革命寓言。诚如此恨人人有。你认为别人强给你的东西不好，是压迫，那你自己能找到更好的吗？通常的情况是，你不能。


    上一讲我们说到，即路撒冷提供意义和雅典提供的理性，通过几代思想家，到美国建国，达到一个巅峰。但是思想不会停止演化，世俗化的趋势一旦开启，就必须要发展到驱逐上帝，让人类自己做主。


    但是这时候人们就面临一个难题。即路撒冷和雅典给我们提供了人生的意义和目的。基督教说你要亲近上帝，哲学家说你要完成自己的 telos —— 而聪明的我们，知道这两个说法都不科学，是包办婚姻。可是如果你不信这两个说法，你人生的意义是什么呢？


    我们接下来要讲的故事比小说还精彩。它是真实的，而且主人公都是思想家，而且主人公的态度都比涓生积极多了。


    ### 1.去上帝化


    马基雅维利打破了对教会的第二枪。我有时感觉咱们中国的李宗吾就是小号的马基雅维利……或者说马基雅维利的《君主论》就是精装版的《厚黑学》。马基雅维利倒是没有公然反教会，但是他在书中对教会的道德说教、对《圣经》的传统价值观大肆嘲讽，认为都是面厚心黑的手段，其其实背后是强权。


    而到霍布斯这儿，可就不不仅仅是嘲讽了。霍布斯直接说《圣经》中所谓的启示都是当事人说梦话，而雅典哲学的什么 telos 都是无稽之谈。那什么是真的呢？权力才是真的。霍布斯提出，道德的对错、正义和非正义，都是相对于权力而言的——谁有权力，谁就是正义；什么能让你获得权力什么就是对的。人生哪有什么高大上的目的？活下去就是最大的目的。


    现在有一派哲学思想叫“道德相对主义（moral relativism）”，认为不存在客观的对错，霍布斯就是他们的祖师爷。


    接下来，荷兰哲学家巴鲁赫·斯宾诺莎（Baruch Spinoza，1632-1677），对宗教就不但是嘲讽和否定，而是敌视。斯宾诺莎认为宗教带来了人群之间的争议，乃至于仇恨——这个看法和当代最著名的无神论者道金斯是如出一辙。斯宾诺莎明确指出上帝是人造的。


    那既然没有上帝，人生的目的应该是什么呢？斯宾诺莎说，人生的目的就是要获得快乐，远离痛苦——“离苦得乐”，这跟现在某些佛教人士用的词汇差不多。


    跟霍布斯不同的是，霍布斯是主张专制集权政府，而斯宾诺莎则是一个“自由论者（Libertarian）”，主张最小化的政府。斯宾诺莎说每个人只要管好自己的事情就行了，不要把你以为正确的东西强加给别人，政府应该无为而治。


    大卫·休谟（David Hume，1711-1776）是我特别佩服的英国哲学家，他也是无神论者，但是他的观点就比前面这几位都高级多了。休谟用逻辑分析的方法论证人们声称的“奇迹”都不可信，还提出过严肃判断因果关系的哲学思想
    [2]。


    人生的意义在哪里？休谟的看法非常接近现代哲学家，认为人生其实没有意义——或者说至少没有客观的意义。


    休谟有个著名的“is - ought”区别论。所谓 is，就是世界是什么样的；所谓 ought，就是世界应该是什么样的——休谟说，是什么和应该是有什么没关系。你不能说因为世界是这样的，我们就应该做什么什么，那是两回事。那么由此说来，人就无法从对世界的观察中找到人生的目的。


    休谟这番逻辑无解可击。可是既然这也不对那也不对，到底有没有科学的人生目的呢？


    ### 2.用理性构建目的


    启蒙运动最大的特色就是人们越来越重视理性。上帝可能是假的，但理性总是真的。那我们能不能纯粹用理性来构建一个人生的目的呢？


    法国文学家伏尔泰（Voltaire，1694-1778）对人生意义的立场跟斯宾诺莎差不多，都主张人生的意义就是要离苦得乐，而且政府管制要最小化。伏尔泰的思想贡献在于他把这个立场归理性化，认为我们要做的就是不断改善物质生活条件，这里又借鉴了培根关于知识的说法。


    不过伏尔泰多考虑了一步。他想到如果人人都只想把自己的快乐最大化，那会不会都耽于享乐而不工作呢？那社会还如何运转？伏尔泰的解决方案是让那些理性不足的人、那些旧信奉上帝的人去工作吧，我作为最理性的人可以享乐……


    这当然就非常说不过去了。真正严肃地把人生目的理性化的，还是康德哲学。


    我们都知道康德（Immanuel Kant，1724-1804）有句名言：“有两样东西，我思考得越深越持久，就越让我感到赞叹和敬畏：一个是我头顶的星空，一个是我内心的道德法则。”


    康德的意思是说，人自身就有道德本能。人生的目的在哪里？就在我们内心预装的那套道德系统。这是一个“先验”系统，类似于数学公理不证自明。康德称之为“绝对律令”。


    康德的道德哲学我们专栏说过好几次 [3]，核心思想，简单地说，是——


    - 1. 你不能把人当手段，人只能是目的；

    - 2. 一个行动是好是坏，不是结果决定，而是由行动本身决定；

    - 3. 什么是好的行动？必须是适合所有人都这么做的行动——这有点像是“黄金法则”：你想让别人怎么对待你，你就这么去对待别人；

    - 4. 人生的自由就在于无条件地取好行动。


    这的确是一个逻辑自洽的系统。现在很多谈论道德，都采纳康德的标准。但是，这套标准是有问题的。


    一个问题是它不允许我们做复杂的道德计算。按照绝对律令，撒谎这个行动就是不好的。那么如果我撒一个小谎能给很多人带来好处，也不能撒谎吗？如果杀一个人，能救十万个人，也不能杀人吗？康德的跟你讨价还价。


    这也是为什么康德的系统不能让所有人接受。哲学家杰里米·边沁（Jeremy Bentham，1748-1832）就提出了另一个也是逻辑自洽的道德系统。边沁的思想叫“功利主义（Utilitarianism）”，主张道德就是要把全社会的总幸福最大化。边沁说你可以做计算：如果让一个人做键盘...


    那你说是康德对还是边沁对呢？此处古难全。


    目前为止，想要构建一个私人认可的、理性的人生意义，似乎是不可行的。


    再往下推导，人们发现连理性都可能是幻觉。


    ### 3.去除理性


    人真的是理性主导的吗？马基雅维利和培根都认为人除了理性（reason）之外，还有欲念（passion）。不过他倒还相信人可以用理性去控制欲念。比如如果我是政客，我就要使用我的理性去利用别人的欲念。


    而霍布斯干脆就认为人其实根本就是由欲念驱动的，人为了活着可以做任何事情。


    斯宾诺莎认为理性就算有用也很有限。人一直是被欲念驱使着走，而且还不知道自己是被驱使的——这就好比说一块在空中做自由落体运动的石头，还以为自己很自由，殊不知它是在沿着固定的轨道运动……


    休谟的观点则再一次取得最高分，跟现代进化心理学非常相似，认为理性其实是欲念的奴隶。你不是用理性决定想干什么事儿，你是已经想干什么事儿了，然后用理性说服自己和别人。


    卢梭（1712-1778）则提出，欲念也有好的啊！因为共情作用，我看见别人受苦自己心里也难受，我就想帮助他，这不好吗？恻隐之心人皆有之，我们为什么不能用所有人的共情作用共建和谐社会呢？


    理性一直在丢分，欲念一直在得分。


    等到达尔文提出进化论，就完成了对上帝的最后一击。人们终于意识到，人其实也是动物。


    很多人会问，真的有道德吗？动物的有些行为看起来像是在舍己为人做好事，可是你仔细想想，它那其实是为了保护自己自私的基因。我们人类的所作所为看起来非常复杂，归根结底还不是为了提高自然选择中的适应度吗？说白了还不是为了生存和发展，为了传宗接代吗？


    上帝已经彻底死了。


    有些思想家意识到，这样下去好像不行啊。失去信仰，人还能管好自己吗？


    俄国小说家、《卡拉马佐夫兄弟》的作者陀思妥耶夫斯基（1821-1881），表达过一个担心。他说可以不上帝，但总会信一个东西。比如说信君主。也许将来世间哪位君主能给人提供面包，人们就会崇拜哪位君主。人可能会变成只认面包的巨婴！我们会面临一个争夺惨烈的血与火的世界。


    德国哲学家尼采（1844-1900）则提出一个更激进的观点。在尼采看来，我们前面提到什么霍布斯、斯宾诺莎、伏尔泰、康德、边沁等等这些思想家，他们说来说去，人生的意义还不是追求幸福和做好事吗？这不还是基督教的那一套，只不过变个论证方法而已吗？现在既然上帝已死，我们就应该发掘全新的人生意义。


    尼采提出的意思，是诚实、自我奋斗、勇气和强大。


    今天讲的这些学说，你认同哪一款呢？我们看看身边和网上的人，他们的价值观中是不是都能找到前面某位思想家的影子。我们扪心自问，是不是自己也有类似的想法。当然这一讲说的都是十九世纪以前的事儿，现代哲学家又发觉了别的意义，我们后面还会讲到。


    但我觉得“意义”这个东西，有时候不一定非得太较真。咱们中国人都是实用主义者，没有整天追问人生的意义是什么、我到底应该采纳哪种价值观，糊里糊涂一辈子就过去了。从不好的方面来说这个不较真的态度使得中国近代没出什么有世界影响力的思想家。但是从好的方面来说，我们也不至于犯特别大的错误。


    下一讲中你会看到，特别较真的哲学，有可能给人类带来灾难。


