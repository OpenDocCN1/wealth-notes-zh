    # 日课精选


    # 企业家的风险基因


    万维钢 · 精英日课³

    今天


    企业家的风险基因

    11:30  7.9 MB


    你有“企业家基因”吗？有个我们不得不承认的观察，那些成功的企业家，好象有一些天生的素质。


    他们从小就跟一般孩子不太一样。他们喜欢折腾一些学校并不十分支持的事情。我上高中的时候个人电脑刚刚在中国出现，学校里还在教苹果II型上的简易编程，有两个同学就已经开始在家打电脑游戏了。而且他们玩的很专业，会自己折腾硬件，还去参加计算机展览会，和专业人员讨论性能问题。现在这两个人都是企业家。


    里吉尔在《生活黑客》这本书中提到，有些研究认为，企业家小时候的一个共同特点是喜欢去做一些聪明但不完全合法的事情，比如逃课去赌博。当然你也可以说这也是一种社会实践。当好学生们都老老实实地根据学校的指导适应规则的时候，这些年轻的企业家已经在试探规则的边界。


    这大约就是为什么好学生长大以后大多从事了正态分布的工作，而这些不安分的人则选择了幂率分布的项目。


    这真是人生징的一个根本矛盾。要稳定，你就做不成极端的大事业；可是要去极端，你就必须面临风险。这是一个两难选择，没有正确答案。


    那么问题来了。什么样的人愿意老老实实地过日子，什么样的人愿意去做一些冒险的事情呢？企业家的这种风险偏好，是基因决定的吗？


    第一，一个人是否愿意做企业家，这个倾向性，有37%-48%，是由基因决定的。


    第二，善于发现新的商业机会的这个倾向性，也是写在基因里的。


    第三，想当企业家，自己雇佣自己，那你这个业务能不能持续下去？你有没有赚钱的能力，也是遗传的。


    第四，企业家的一些性格特点，像外向、思想开放这些，也都有基因的作用。


    也许基因真有用，但是环境非常有用。


    ![](img/b58c3137b911797b913643bab2c018ea_92_0.png)


    图中说的是平均而言，十次机会之后两人的收入情况。


    可能会赔钱，你能忍受得了吗？


    有些人说“不在乎风险”是勇气。有些人则是真的不在乎。


    佩奇还引用了一项统计。我们知道数学能力在衡量人的钻研能力上很有用。调查发现，数学能力在前1%的孩子，他们将来申请专利的可能性大大高于其他人。不过这1%的孩子里也不是所有人都能申请专利，有些人可能长大了就“泯然众人矣”。而如果你的数学成绩在前1%，同时你的家庭收入又在前10%的话，你申请专利的可能性又会进一步大大提高。


    # 天赋对企业家的确有用，但是环境也很有用。


    风险投资都是要做一个系统。可能你连续投10个项目，其中9个项目都赔钱，但是只要有一个项目成功，你就能赚到大钱。你是足球俱乐部，你不在乎哪个天才少年球员受伤，因为你拥有很多天才少年。


    但是创业者可没有这个系统。美国的调查研究发现 [4]，小型创业公司平均需要3万美元的启动资金，而这笔本钱之中，超过80%，都是来自个人存款或者家庭的帮助。


    请注意美国人的习俗是不存钱，能拿出3万美元存款的都是富裕家庭。


    创业不仅仅是精神活动，你需要的不只是眼光和见识，创业需要物质条件。你得在需要用钱的时候能拿到钱，在不挣钱的时候不着急才行。


    菲茨杰拉德在《了不起的盖茨比》中有名言：每逢你想要对别人品头论足的时候，要记住，世上并非所有的人，都有你那样的优越条件。


    我们是不是可以把这句话改编一下，也许能起到一个灭 high 的效果——


    每逢你想要学习企业家精神的时候，要记住，你不一定有他们那样的优越条件。


    当然我们不能用这么丧的句子结尾……如果我没有冒险的物质条件，难道这辈子就不能做企业家了吗？那肯定也不是，将相本无种。也许你可以先找个正态分布的工作攒点钱再冒险。


    但我认为更重要的是，企业家精神可不仅仅是冒险。企业家精神更表现在不承认世界是个均衡态，总能发现不合理的地方并且从中找出新的商业机会，然后自己去把这件事办成。你要真有这样的本领，我想会有很多人愿意让你拿他们的钱去冒险。


    注释


    [1] How Entrepreneurship Might Be Genetic, inc.com, JAN 27, 2015.


    [2] BLACK, S. E., DEVEREUX, P. J., LUNDBORG, P. and MAJLESI, K. (2017), On the
    Origins of Risk - Taking in Financial Markets. The Journal of Finance, 72: 2229-2278.
    doi:10.1111/jofi.12521


    [3] Ross Levine, and Yona Rubinstein, Smart and Illicit: Who Becomes an Entrepreneur
    and Do They Earn More? The Quarterly Journal of Economics, Volume 132, Issue 2,
    May 2017.


    [4] Aimee Groth, Entrepreneurs don’t have a special gene for risk—they come from
    families with money, qz.com, July 17, 2015.


