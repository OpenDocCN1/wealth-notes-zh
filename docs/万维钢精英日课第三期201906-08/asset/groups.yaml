    总觉得，人活一世根本目的是为了修心，任何理论和方法都是修炼的工具，心自由与光明才是修炼的终点……自由来源于选择，来源于掌控，现实中的我们，没有足够的经济基础，上层建筑是很难做的清雅秀丽脱俗不羁的，您说对吗？


    万维钢


    要行家刚刷在得到开了个新课，叫《要行家说武侠》，其中有一讲说孔子的弟子子路 [1]，非常有意思。孔子说，“破衣衫衫地站在身着华服的贵人中间，能没有愧色的，只有子路了”。


    当然其实子路也是个贵族，物质条件是很不错的。这个道理是物质条件对一般人的气质的确会有些影响。物质条件充足的人可能会比较自信。有人认为只要对人无所求就可以保持不卑不亢的气度，但是我感觉如果自信心不足，就算是无所求，气场也还不行。


    那如果物质条件确实不行，怎么才能够有一个好的气度呢？关键还是在于自信心。人群中的自信心来自在大家都在意的这个项目上，你是什么水平。去中央党校学习的人不会在乎穿脏的衣服贵。开会讨论的物理学家不会比谁开的车好。


    精要主义的精要是精心选择自己的环境，不为外物所控制。如果你根本不在乎物质条件，就应该选择离开那些专门在乎物质条件的人远点。


    # 来自日课：身体优化大师


    # 读者时间风帆：


    生活黑客的一些做法确实令人钦佩，但是有些行为也确实让人感觉生猛些，我普通人估计不敢试。这样看来，咱们这些保守派是不是对未知世界的贡献就小很多了？


    万维钢


    今天探索未知世界的主力是科学家、工程师和创业者，他们属于创新阶层，但不一定是生活黑客——我敢说他们大部分都不是生活黑客。这体现在他们总是拿别人、而不是拿自己做实验。大规模的、使用科学方法操作的实验总是能得出更可靠的结论，而且科学家的想象力一点都不比生活黑客低。生活黑客们喜欢的学说，像“意志力”“专注力”之类，都是由科学家提出，经过正经的科学实验去研究的。现代创新更多地是讲合作，而不是讲破坏。


    那为啥还会有生活黑客存在呢？一方面的确是世界太复杂了，每个人的情况都不一样，必须拿自己做个实验才知道自己最合适什么。另一方面，科学研究的确是比较保守的。想要用科学方法确认一个效用是很艰难的，要耗费大量的时间和金钱。有些生活黑客不等科学结论出来直接就做了，也未尝不可。


    这么说的话，我们大体可以认为生活黑客是在正统科学研究之外的一个小补充。科学进步的最初始灵感可以来自任何地方。的确有可能，生活黑客折腾出来一个什么好东西，科学再跟进确认。


