    ｜选自：『环』｜


    今天我们把里吉尔的《生活黑客》这本书讲完。


    我注意到咱们得到的很多读者最想要的是可操作的方法，简单就是说你就直接告诉我该怎么办吧。《生活黑客》这本书的确讲了很多“怎么办”，但是这本书的副标题很有意思，叫“系统化生存及其反对者”——里吉尔不但介绍了方法，而且介绍了人们对这些方法的反对意见。


    如果这个讲法让你感到无所适从，说我到底该不该学习这个方法呢？我认为你不论是读书还是做事的功夫都不够家。


    讲一个方法的同时明白对这个方法的反对意见，这才是正确的讲法。


    这就好像卖药得给人标明所有的副作用一样。世界上并不存在什么有效而又完整的方法，其中包含一系列的“if……then……”条件语句，告诉你在这种情况下你就应该这么办，在那种情况下你只需那么办。事实上那种的世界也没意思。


    # 1.斯多葛哲学


    是的，就连一向提倡技术和算法的生活黑客们，也需要一点哲学。生活黑客倒是缺少人生意义，“加州意识形态”已经给他们提供了人生意义，那就是要通过工具和技术手段破解人生的各个系统，让自己活得更自由，要对生活有一种掌控感。但是生活黑客意识到，生活中有很多事情是不可控的。怎么面对人生中的失控和失望呢？


    # 2.个人操作系统


    斯多葛哲学非常契合黑客的精神。我们前面说了，黑客精神包括理性、实验、系统和个人主义。


    # 3.冥想的功效


    如果说斯多葛哲学是生活黑客的个人操作系统，来自佛学的“正念冥想”就是生活黑客的功效增强工具。'
  - '[PAGE 81]


    专注于自己的呼吸。有些生活黑客提供了特别简单的、算法化的冥想方案。有些生活黑客使用手机 APP 指导自己冥想。而事实证明，这种简单冥想法并没有什么特别显著的“疗效”。


    里吉尔说，如果你冥想只是为了让大脑变清醒一点，其实咖啡因更有效，而且还是经过科学验证的。事实上现在已经有一些嘲讽冥想的声音，认为像Google这种大公司之所以对员工大力推广冥想，其实是想让员工变得更温顺一点，接受现状，减少公司动荡，最好还能专注于公司给设定的目标……


    总而言之，斯多葛哲学也好，正念冥想法也好，在生活黑客眼中都只是工具。生活黑客并不在意古代先贤提出这些东西的本意是什么，也不愿意追求其中更精妙的道理，他们只是想解决自己的生活问题。


    这样真的好吗？


    我觉得挺好。生活黑客已经是人群中的先进代表，他们属于创新阶层。现在这个世界上有的人甘当螺丝钉，有的人只想把命运交给别人，有的人只会抱怨，有的人食草，有的人啃老，有的人“佛系”……而生活黑客积极主动，想要用工具和技术提升自己，破解系统，实现自由。还有多少比他们更聪明更进取的人呢？我们不应该用科学家和学者的标准要求生活黑客。


    而且生活黑客还拥有大多数科学家和学者所没有的品质，那就是敢干。他们满足于*知道*，他们总是*做到*。他们不但会*说*，而且真*练*。

    冒险者和探索者总是值得尊敬的。


    但是只要你做动作，你就会出纰漏。如果一个工具真有效，那你只要用它，就会有副作用，就可能会因为突破了一个度而走火入魔。如果你手里拿的是武器，你必须非常小心才行。


    我认为人生中没有什么一定对的操作。一切都只是选择而已，而且常常都是两难的、无奈的选择。这意味着你要想追求某个东西，就必须放弃一些别的东西。


    并不是所有人都适合做生活黑客。你要优化，就可能会黑化。你量化这里，就会忽略也许更重要的那里。你破解系统，就悔得罪系统。你把什么东西当做工具，就得改造甚至简化那个东西。


    你要做黑客，就必须承担黑客的代价。意识到这一点，也算是一种斯多葛精神。

