    问答：别在散步的时候听音乐..

    11:17 7.76 MB


    ## 来自日课：黑进生活系统


    ### 读者 小鸽子：


    老师，以前有中国人到国外去发现跨国电话短于一定时间就不收费，然后就利用这个便宜打免费电话。生活黑客和占便宜免费电话便宜的中国人有什么差别呢？


    万维钢


    有重大差别……这个差别就是用这么不方便的办法占这个小便宜打免费电话这种行为太土了，根本配不上“黑客”这个称号。我来告诉你黑客是怎么做的。


    1960 年代，有人声称自己破解了美国电话电话公司（AT&T）的系统，能够免费打长途电话。有两位黑客听说此事感觉难以置信，但是他们后来在斯坦福直线粒子加速器的图书馆里看到了一份AT&T的技术期刊，其中有一篇论文介绍了长途电话的操作原理。


    原来AT&T是通过一个由机器生成的、据信是人的嘴无法发出的、2600赫兹的声音信号来判断是合法的长途电话请求。两个黑客一看，他们完全可以自己做一个机器，在家用电话端伪造这个声音信号啊。


    他们真做出来了，称之为“蓝盒子”。只要把蓝盒子接到电话线上，用蓝盒子拨号，就能免费、无限制地长途通话 —— 包括国际长途。


    ## 来自日课：高效懒人士的一个习惯


    ### 读者 音乐：


    如果我能够像中央处理器一样，同时处理多项任务，是否是也相当于高效利用时间呢？举一个我个人的例子，我是一个盲人，视觉上的缺失对于我学习知识肯定是有很大的影响的。但是，因为我学习的方式主要是通过手机或者电脑上面安装的屏幕朗读软件来听读内容，所以，在洗漱、吃饭、散步的时候，我的耳机里面读屏软件的声音基本上都在响着，这能算高效利用时间吗？


    万维钢


    人脑处理多任务的功能的确有点像计算机的中央处理器 —— 但是请注意，中央处理器*并不能*同时处理多项任务！


    ## 来自日课：生产力色情


    ### 读者 倚你同行：


    生活中经常看到一些书中提到人有无限


    生活中经常看到一些书中提到人有无限潜能，比如照相记忆力，还有一些灵修，以及自闭症天才等，这些我感觉是真的修仙；除了这些还有记忆术，倍速阅读等是好像可以通过练习能达到的。类似的练习真的有用吗，还是说其实作用没那么大，和通过手机等工具实现记忆没有太大差别？


    万维钢


    照相记忆力那种听起来特别神的本领很可能是真的，我听说过一些案例。超强记忆术、快速阅读法这些也的确都是真的。鉴于人脑的存储容量非常之大，我们完全可以认为记忆力是几乎无限的。


    但是，以我之见，只要这个本领是“生理性”、而不是系统性的，它就没啥大用——最多只有比赛和表演的用处。我以前写过一篇《超强记忆力是个邪道功夫》，重点说的就是这种功夫没用，纯属浪费时间和精力。


    我认为这个关键在于真正有用的技能都需要你行使高级的理解和判断力，你得能理解复杂的思想，才能判断复杂的局面。要理解，是高级思维；而记忆，简直就只是肌肉能力。能记住和想得快都是简单的大脑运动；想得全面、想得丰富、想得深刻，那才是真有用。


    基于这一点，我认为所谓“最强大脑”都应该叫“最怪大脑”，比的不是实用的功夫，而是像什么金钟罩铁布衫之类的武术表演。


    生活黑客们根本不追求这种功夫，因为完全可以用外部工具替代。黑客是以解决实际问题为目的的，能用工具就用工具的人——黑客不是打把势卖艺的人。


