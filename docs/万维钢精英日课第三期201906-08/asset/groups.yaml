    # 《历史的正确一侧》1：站在西方的观念上理解西方


    万维钢·精英日课³

    今天

    进入课程 ›


    《历史的正确一侧》1: 站在..

    12:58  8.9 MB


    今天开始我们来说一本2019年三月份出版的新书，叫《历史的正确一侧：理性和谐德目的如何让西方伟大》（The Right Side of History: How
    Reason and Moral Purpose Made the West Great），作者是政论专栏作家本·夏皮罗（Ben Shapiro）。


    #1 NEW YORK TIMES BESTSELLER

    THE RIGHT SIDE OF HISTORY


    ![](img/b58c3137b911797b913643bab2c018ea_26_0.png)


    How Reason and Moral Purpose Made the West Great

    BEN SHAPIRO


    夏皮罗是个保守派，他写这本书有点忧国忧民的意思。他有感于现在自由主义盛行，很多 人已经忘了西方文明是为什么强大起来的。他想再一次提醒美国人，西方的道统是什么。这本书反响很不错，上了《纽约时报》的畅销书排行榜。


    那么中国人为啥要读这本书呢？我 beschleun three 位有思想的中国人说过的话。


    第一个是鲁迅。鲁迅先生说——


    > “中国人对于异族，历来只有两种称呼：一 样是禽兽，一样是圣上。从没有称他朋友，说他也同我们一样的。” [1]


    我觉得鲁迅先生说得有点偏激了，但是他确实有一定道理，就是我们把外族、或者说外国人不太当人。我们跟外人总有隔阂感，有时候会表现为极度的自尊或自卑。当然自尊还是主要的。我们中国人都有强烈的民族自豪感，认为我们是最有文化的，对外人通常是低看。


    那么第二个出场的是胡适先生，他说——


    > “我们不能坐在舢板船上夸精神文明，而 嘲笑五万吨大汽船是物质文明。” [2]


    鲁迅和胡适那一代中国人面临的大问题是如果咱们中国这么有文化，为什么近代西方这么强大，我们这么落后呢？有人提出西方只是物质文明强大，咱们中国的精神文明仍然是最先进的。而胡适先生不赞同这个自嗨的说法。其实这里面有心理学。我们专栏最近说过这个道理，人总是觉得自己身处马斯洛金字塔的顶层，有道德有追求，而认为外人只重利益没思想
    [3]。


    那么西方有怎样的精神文明呢？我们能不能以朋友的姿态，去平等地看待西方的精神文明呢？对今天的中国人来说，平等，已经解决了——现在世界最大的轮船是中国。那么下一步我们是保持这个平等姿态呢，还是再次把西方人看做禽兽呢？


    这就引出了第三个出场的人物，华为的任正非先生。他说——


    > “我们这些年，都是采用中国的思维方式去理解世界的格局、去揣测西方的意图。要对世界有充分了解，必须站在西方的观念上理解西方。” [4]


    # 1.西方文明的两个支柱


    # 2.什么是幸福？'
  - '[PAGE 27]


    你好好为完成人生的目的而努力，快乐会随之而来。有研究发现生活有明确目的的人，平均能比其他人多活两年，他们患上阿尔海默症的概率也比别人低，就算同样得了癌症，他们的治疗效果也会比其他人好……你会得到物质和人际关系的好处，但是你得知道，那些都只是幸福的副产品。


    这个幸福观指引了历代的西方精英。比如我们知道的纳粹集中营幸存者、精神病学家维克多·弗兰克（Viktor Frankl），就有一句名言，说“最重要不是你期待从生活中得到什么，而是生活对你有什么期待。”


    那今天的美国人，明明物质条件是有史以来最好的，为什么幸福感下降了呢？


    # 3.对幸福的追求


    请注意，根据西方道统，每个人都有*追求*幸福的权利 —— 可不是每个人都有幸福的权利。


    这就是为什么美国宪法说的是政府要保证个人追求幸福的权利，可没说政府要给人民提供幸福。比如说政府可以保护你的财产不受侵犯，但是你不应该指望政府给你提供财富。每个人应该为自己的幸福负责。


    幸福不是权利，追求幸福才是权利。这个区别有点微妙，但是非常重要。后面我们会讲到，为什么西方精英特别在意这一点，以及这个区别有什么后果。


    但是现在美国有很多民族式的自由主义者不是这么想的。他们认为人有幸福的权利，特别是享有乐的权利。他们说政府应该提供免费的大学、免费的医疗之类东西，政府应该给人民谋福利。但这其实是把自己的幸福交到了政府的手里，那你还算得上是个有道德目的有理性的人吗？


    而美国政客正在利用这一点。奥巴马夫人米歇尔在帮奥巴马竞选的时候，跟选民说“奥巴马会修复你们的灵魂！”总统能修复你的灵魂吗？特朗普更敢讲，说“我会给你一切东西。”可你的东西应该是总统给的吗？难道不是自己奋斗争取的吗？我觉得最厉害的还是现在民主党潜在的总统候选人，前任副总统拜登，他说如果他当选总统，他会治愈癌症！


    把幸福的指望放在别人身上的另一个表现是如果不幸福，那就是因为有敌人不让我幸福。比如现在中美贸易战，美国底层一些人就认为之所以他没有好工作，是因为中国人抢了他的工作。


    凡此种种这么一对比，我们很容易看出来西方先贤到底厉害在哪里，以及现在的西方文明出了什么问题。


    我们专栏去年重点讲过启蒙运动 [5]。史蒂芬·平克在《当下的启蒙》这本书里列举了启蒙运动以来的伟大成就，认为是启蒙运动造就了现代世界；卓纳·戈德堡在《西方的自杀》这本书里提出，启蒙运动和随之而来的资本主义都是不自然的东西，而现在人性的自然正在回头，所以西方文明有点危险。


    现在夏皮罗进一步分析这个问题，说为什么“自然的东西”以前没回头，现在开始回头了呢？


    根本原因在于，西方文明的这两个支柱 —— 人生的意义和人的理性 —— 都只是信仰，而不是科学结论。


    因为它们不是科学结论，所以你原则上可以不信！但是历史证明，当人们信这两个支柱的时候，文明就进步；当人们不信的时候，文明就会衰败。


    而现在的情况就是西方人开始不信了。宗教成了被嘲弄的对象，理性受到质疑。这就是为什么在这个物质文明空前繁荣的时代，有这么多人感觉不幸福。


    最后说明一点，夏皮罗本人信犹太教，但他并不是一个头脑死板的教徒，他能够以学者的态度对待基督教、古希腊哲学和现代科学。这本书说“信仰”也不是“宗教信仰”那个意思，但是你不可能脱离宗教去谈论西方文明。咱们完全不必纠结意识形态，下次讲就说宗教。


    # 注释


    +   [1] 鲁迅，随感录·四十七，收入《热风》《鲁迅全集》第1卷。

