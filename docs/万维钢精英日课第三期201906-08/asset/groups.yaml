    ## 《范围》7：工匠和学者


    万维钢·精英文课³

    今天

    进入课程 >


    《范围》7：工匠和学者

    12:09  8.35 MB


    今天我们把戴维·爱泼斯坦的《范围》这本书讲完。这本书从个人发展和工作方法这两个角度说明，在这个分工越来越细化的世界里、在这个奖励专才的时代，为什么通才将会胜出。


    你也许听说过一个著名的比喻——出自哲学家以赛亚·柏林——叫“狐狸与刺猬”。专才就像刺猬，一门心思就知道自己的一件大事，拿个锤子看什么都是钉子；通才就好像狐狸，对各种工具都知道一点。


    本来这个比喻是用來赞美刺猬的专业精神的！但是本世纪初，政治学家菲利普·泰特洛克（Philip Tetlock）通过一个历时将近20年的跟踪研究发现，那些刺猬式的专家常常对未来判断错误，而且经常错误的离谱；反倒是狐狸式的学者因为比较灵活和谨慎，预测常常更准确
    [1]。从此之后，“刺猬”、甚至“专家”都几乎成了预测界和决策思维界的贬义词——跟咱们中文本互联网上把国产专家称为“砖家”差不多了。


    ## 那专家该怎么办呢？这一讲咱们重点说说如何成为通才。


    ## 1.科技进步变慢了吗？


    很多科技工作者只关心自己做的项目，琢磨发表论文和申请经费。有些科学家关心国家的科技政策，他们偶尔还担任领导职务，对所在领域都有影响力。还有一些更厉害的人物，不但科研水平高、有领导力，而且对“科技进步”这个整体的事情，都有自己的看法。


    如果你拥有这样的视角，你不一定会感到特别乐观。是，像史蒂芬·平克那样乐观地赞美“启蒙运动以来人类取得的伟大进步”的学者也有，那是自由主义者的主旋律——但是如果你在一线搞过研究，你真正的知道科研是怎么回事儿，你会感到很多无奈。比如说，科技进步的速度，最近可能变慢了。


    约翰霍普金斯大学的分子生物学教授阿图罗·卡萨德沃尔（Arturo Casadevall）就感到忧心忡忡。2015年，他说过去这35年来，发达国家政府在生物和医学研究上的经费投入是以指数增长的，现在有无数科研从业人员，可是跟35年前的那一拔进步相比，现在的进展根本配不上这么高的投入。


    美国和英国是医学科技最发达的两个国家，特别是英国还是全民有医保，而最近这两个国家的人均预期寿命不是增长，而是下降了。现在每年都有几万人死于流感，而我们对付流感的疫苗，还是1940年代发明的那一种。卡萨德沃尔的妈妈已经九十多岁了，她平时要吃五种药，而那些药都是1980年代就已经有了。说好的“二十一世纪是生物的世纪”呢？


    当然你可以说以前的研究者摘取的都是“低垂的果实”，现在生物医学研究已经进入了“深水区”，搞的都是基础研究。像中国著名生物学家施一公，整天干的事儿就是拿冷冻电镜解析蛋白质结构，等将来有人把这些结构研究明白了，才好去做研发新药之类的事情。但是卡萨德沃尔拒绝相信研究者就只能做到这个水平。


    卡萨德沃尔认为现在之所以进步慢，是因为过度专业化。


    卡萨德沃尔举了个例子。如果你整个研究生涯就只研究一种细胞，你可以过得很不错，你容易申请到经费。但是如果你想研究比如说B细胞和巨噬细胞是怎么整合的，你就很难拿到经费，因为没人能看懂你的申请书！研究巨噬细胞的那一帮人并不研究B细胞！现代生物学研究分得超级细，连每次开会都是专门研究一个小领域的自己跟自己开。


    那么有些非常基本的问题，反而就没人研究。比如说人受了外伤会出血，那身体整体是一个什么样的反应？我们对这件事到现在还没有一个彻底的理解——因为研究血液的人和研究免疫系统的人是两拨人。更进一步，免疫系统本身也是一个巨大的研究系统，里面还有好多一般不互相往来的细分专业。


    更严重的问题是，现在连美国名校培养出来的理工科大学生，都缺乏足够的科研方法论训练。他们并不比普通人有更高的批判性思维能力，他们不知道科学研究是怎么运行的，他们连自己专业的研究工具的逻辑都不会怎么理解。他们只会按照固定流程操作，做出什么东西来拿通用软件分析数据，然后写论文。那又怎么指望这些人去搞什么跨领域的研究，去做出有创造性的科学发现呢？


    由此看来，虽然现在从事科学研究的人是比过去大大增加了，但真正的“科学家”的数量仍然不多。学者总是少数人，多数都只是以科研为生的工匠而已。


    那“学者”应该是咋样的呢？


    ## 2.真正的学者


    如果一个人真对学术感兴趣，他不太可能只对一门学术感兴趣。一个真正的科学家想要的事儿是探索世界，他不太可能一辈子研究一种细胞。


    爱泼斯坦采访了两位真正的科学家，一个是遗传学家奥利弗·史密斯（Oliver Smithies），一个是物理学家安德烈·海姆（Andre Geim）。他们都是诺贝尔奖得主，他们都是“刻意的业余者”。


    ## 所谓刻意的业余，就是专门安排一些时间去做一些自己专业以外的事情。史密斯是在每个星期六自己跑到实验室里去做一些“本职工作”以外的实验，海姆则是星期五去。这些周末研究都是没有科研经费支持的，纯粹是他们自己想干。史密斯的几乎所有重大发现都源于星期六，而且直接给他带来了诺贝尔奖。


    说到海姆的诺贝尔奖，我还听说过一段典故。海姆是因为对石墨烯的研究而获奖，而我听说，他们研究组里有个中国博士生，本来是有机会分一杯羹的。当时研究需要制备一层非常非常薄的石墨烯材料，而石墨烯的性质可以按层剥离，海姆就让中国博士生想办法。但是中国博士生没有想出来，他不知道有什么高科技能把石墨烯弄那么薄。他还跟海姆说你慢慢想办法吧……


    然后海姆自己想了一个办法——没用什么高科技——他用最普通的透明胶带粘上石墨烯，对折再撕开，就变薄了一倍，然后再拿胶带沾上变薄的这一层、撕开再对折撕开，就更薄了……就这么一层一层撕出来了只有一个碳原子厚度的石墨烯！


    难道路这种用小米加步枪打败美式装备的事儿不是咱们中国人擅长的吗？大概不是这一代中国人。


    上一代中国人里有这样的人。爱泼斯坦特别提到了屠呦呦。周总理要求治疗疟疾，人们测试了24万种物质没找到特效药，屠呦呦从晋代葛洪——用爱泼斯坦的话说就是“四世纪的一位炼金术师”——的《肘后备急方》这本书中得到灵感，发现青蒿素。


    屠呦呦没有冷冻电镜那样的高级设备，但是屠呦呦有想法。如果你搞科研忙得睁开书都不过了，我觉得你不太可能得诺贝尔奖。


    在这个极度专业化的时代，所有科学家都得靠专业生存，但是有些科学家拒绝始终留在一个专业。有些做得绝的人物几乎是强迫自己，每五年必须换一个研究领域。不是他在旧领域里没什么可干的了，是他就是想钻研新东西。


    这才是健全的智识人格。


    ## 3.怎样不做 nerd


    咱们中国有个有意思的现象是有时候“书呆子”被当做褒义词。可能是因为陈景润的形象过于深入人心，也可能是千年科举制度的文化遗产，我们认为那些只知道琢磨自己研究的一点事儿、两耳不闻窗外事、甚至对个人生活缺乏把握能力、过度专业化了的人才，是值得赞美、钦佩和模仿的。


    美国绝对不是这样。美国也有这样的人，一般被称为“nerd”，是个含贬义的称呼。美国文化不但不崇拜nerd，而且经常把他们描写成“疯狂科学家”的形象，自己躲藏搞一个什么东西弄出大麻烦，等着一位超级英雄出来救场。如果你只会专业技术，你不是主角。


    古之学者为己，今之学者为人。知识分子不能把自己变成别人的工具，真正的学者得追求一个知识上的健全人格。杨振宁的父亲让他读《孟子》，那不是为了给他搞科研做注释——而是为了培养……


    让他读《孟子》，那不是为了给搞科研做准备，什么“功夫在诗外”，而是为了培养健全人格。


    我认为这才是“通才”的本质。


    你读书学习，是想成为这么一种人——老百姓有什么事情搞不明白了，说“这人是个读书人，咱们应该听他的意见”——而不是说“我书呆子啥也不懂，你们商量着办吧”。


    一般通才都自己知道该怎么办。不过万一你还不是通才，这本书带给我们的也许有下面这些建议——


    - 第一，别怕起步晚。什么“赢起跑线”，以自己家孩子上幼儿园的时候会做小学二年级数学为荣，那是愚昧无知。各人的起步速度不一样，长大以后比的才算数。年轻时候是个宝贵的尝试期，别糟蹋了。

    - 第二，要追求一个“匹配质量”：随时想想你是谁，你做什么。但匹配终究是做出来的。

    - 第三，不管你的主业是什么，都要给自己留一个“刻意业余”的时间段。

    - 第四，要敢于跨界，大胆创新。在那些创造性强的领域，谁有多少年的工作经验根本不重要。

    - 第五，这一条是我说的：学习的目标不是把自己变成工具，而是磨炼知识上的健全人格。


    最后，作为对“专才”的平衡和安慰，让我们以我们专栏熟悉的物理学家弗里曼·戴森的一段话 [2] 共勉——


    > “有些数学家是鸟，有些是青蛙。鸟飞得高，能看到很广阔的数学景色，他们喜欢统一的概念，能把数学上不同的领地连在一起。青蛙住在泥地里，只能看见自己周围的花草，他们钻研细节，每次只解决一个问题。我碰巧是一只青蛙，但我的很多朋友是鸟。我想说的是，数学既需要鸟，也需要青蛙。”


    (THE END)


    ## 注释


    [1] 此事被无数作者（包括爱泼斯坦，和我）引用过，详情则见于 [美]菲利普·泰特洛克，《狐狸与刺猬：专家的政治判断》一书，有中文版（2013）。


    [2] Freeman Dyson, Birds and Frogs, Einstein Public Lecture, 2009. 戴森自称是青蛙，他的研发风格的确不喜欢追求大一统的理论。但是我们知道戴森经常对各种事物发表言论，我敢说在智识上，他绝对是一只大鸟。


