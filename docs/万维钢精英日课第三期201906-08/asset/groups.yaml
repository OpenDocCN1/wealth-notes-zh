    # 《历史的正确一侧》5：凡人的觉醒


    万维钢 · 精英日课³ 今天 进入课程 ›


    《历史的正确一侧》5: 凡人。 12:50 8.81 MB


    我们继续讲夏皮罗的《历史的正确一侧》这本书。


    以前凯文·凯利有个说法，技术是活的东西，好像自己就有生长的意愿似的，像生物一样演化。尤瓦尔·赫拉利也有个说法，小麦驯化了人，好像小麦有了自由意志，人是为小麦服务一样……效法这两位，我也有个看法——


    > “思想”是有生命的独立存在，人只是思想的土壤和传播媒介。这表现在思想一旦被释放出来，就不再受创造者控制。


    有些人怀孕并不是因为喜欢孩子。孩子出生的时候她他们或许会对孩子有所期待，但是孩子将来是个什么人，并不在乎母亲生他的时候怎么想。


    十三世纪基督教把唯物理性融入宗教教学之后，学者们开始用理性思考世俗的问题。这一讲我们要说的是接下来发生的两大思潮。一个是科学被用于改善人类自己的生活，一个是人们开始想要有自由和自然权力。


    # 1.科学和副产品


    今天人人都知道科学是好东西，咱们中国人爱说“科学技术是第一生产力”。但是这句话有问题。科学和技术其实是两回事；那么如果科学不是生产力，你还要科学吗？


    很多国人不能接受“中国古代没科学”这个事实，就是因为没有把科学和技术分开。技术是解决方案，可以在经验和试错中获得。好木匠不需要理解牛顿力学，乒乓球运动员也不必是一个空气动力学专家。而科学，钻研的是世界运行的底层规律。中国古代有很好的技术，但是没有科学[1]。


    李约瑟认为宋代沈括的《梦溪笔谈》是中国古代有科学的证据，但沈括其实只是用笔记的形式记载了当时的一些见闻和社会生活情况，涉及到科技的话题而已。他书里有很多属于怪力乱神的东西，跟龟鼐的《阅微草堂笔记》是一个性质，并不是为了探讨科学。


    那为什么中国人不研究科学呢？当然不是因为中国人不聪明，而是因为中国人务实！当科学还处于幼小阶段的时候，它是没有用的。科学不是生产力。


    最早研究科学的人都是精神驱动。雅典人是为了用自然的法则来修炼自身的理性，中世纪基督教科学家是为了荣耀上帝。伽利略晚年受到教会打压，但是他始终认为自己所有的科学研究都是为了证明上帝的伟大。开普勒和牛顿用非常精密的方法、最好的观测技术来研究天体运行，因为他们要证明只有上帝才能创造出如此精密的宇宙……


    可是人们慢慢发现，科学好像还有一些实际的用处，作为副产品，可以用来改善人的物质生活。比如天文观测可以带来更精密的历法，科学方法也可以用来研究政府的组织方式……


    弗朗西斯·培根（Francis Bacon，1561-1626），有感于此，提出了一个大胆的想法。他说我为什么非得把实用价值当做科学的副产品呢？研究科学就应该是为了改善人的生活！


    我们知道培根有句名言叫“知识就是力量”。在今天听来这句话天经地义，但是在当时，知识原本是人的道德义务，或者是一种修炼方式，人们并不推崇什么力量。如果培根跟柏拉图说“知识就是力量”，柏拉图会非常反感。所以培根喊出这句话来，其实是有点反叛精神！


    但是请注意，培根可不是一个无神论者。培根仍然坚信上帝，只不过他想让科学从上帝这条大船上脱钩，去为*人*服务。


    笛卡尔（René Descartes，1596 - 1650）赞同培根的知识观，而且走得更远。笛卡尔在数学和物理学上都有贡献，而且在哲学上质疑宗教教学。笛卡尔拒绝接受直接灌输给他的知识，他怀疑一切……但是，笛卡尔并不怀疑上帝的存在。他的论证方式是“我思故我在”，说我可以怀疑周围一切事物都是假的，但有一件事情我知道肯定是真的——那就是我正在思考。而既然我能思考，这就说明上帝是充满善意的，他允许我思考。如果没有上帝，我无法解释为什么会有一个“我”在思考。


    你看，宗教是科学的早期赞助人，而且在很长时间内都有存在感。但是，这个思想趋势是，研究科学的目的已经从以上帝为本，过渡到了以人为本。


    # 2.人权的起源


    在科学发展的同时，“自由”这个观念也在发展。我们知道《圣经》里就有自由的种子，但是这颗种子的发展壮大，可不是教会主动推动的——其实是教会压迫人民给压迫出来的。


    天主教会的势力越来越大，表面上说的都是信仰，实际干了很多黑暗的勾当，政治操作非常齷齪。人民厌烦了教会伪善的说辞，结果尼科洛·马基雅维利（Niccolò Machiavelli，1469
    - 1527）应劫而生。


    马基雅维利写了一本非常著名的书叫《君主论》，说什么美德啊、理性啊都是假的。马基雅维利不相信基督教道德义务和雅典理性那一套，认为人根本就不是由理性驱动的——而是由欲念（passion）所驱动的。人性本恶！权术运作本质上就是利用和操纵人的欲念。


    马基雅维利这一套有点像中国法家的思想，至今仍然有很多粉丝。《君主论》受到了热烈的欢迎……道德家可能会认为这种学说流行代表社会的堕落，但是，正是这样的学说让凡人——不是作为理性的修煉者也不是作为宗教的信徒，而是作为一个世俗的普通人——的意识觉醒了。


    几乎与此同时，马丁·路德（Martin Luther，1483 - 1546）领导的宗教改革进一步唤醒了个人主义。路德非常反感当时天主教等森严的体制，他说我们能不能不忘初心回到母体，上帝面前难道不是人人平等吗？哪怕是一个木匠、一个理发师，也可以自行亲近上帝，他们和主教是一样的！路德号召人人自己阅读《圣经》，还把《圣经》翻译成德语，推广到田间地头。天主教会的权威也动摇了。人说路德所做的，可以说是精神上的“人权宣言”。


    路德虽然重视个人，但他可不是一个“民主人士”，他赞同君主集权，而且认为权力应该忠于上帝。路德并不相信人民可以自己管理自己。


    但是思想只要开了头，就可能继续发展下去。人民越来越受不了教会的压迫，从1618年到1648年的欧洲“三十年战争”就是关于压迫和反压迫的一场宗教战争，总共死了800万人。人们意识到如果宗教再不宽容，结果就只能是大屠杀。这时候，“人权”这个概念出现了。


    第一个提出“人权”概念的，是咱俩都应该很熟悉的托马斯·霍布斯（Thomas Hobbes 1588 - 1679）。霍布斯的人权是人的自保权，也就是生命权。霍布斯认为人生的目的不是什么追求理性那些高大上的意义，而是……活着。


    但霍布斯的先进之处在于，他提出活着，是人的一项权利（right）。不是你允许我活着才活着，是我本来就应该活着。但当时的状况是老百姓就算有权利也没有权力（power），power
    都在教会和国王那里，这怎么办呢？霍布斯给专制政府找了一个合理性——他说老百姓为了自己的生存权，可以容忍一个专制政府。霍布斯说如果没有专制政府，社会上就会发生“一切人对一切人的战争”。这是一个非常著名的理论，关于霍布斯的《利维坦》这本书，你可以去听一听熊逸老师的课程[2]。


    霍布斯打开了“人权”的大门。人们意识到世界上除了 power 之外，有 right 的存在，原来有些东西不需要谁的恩赐，是我天生就应该拥有的。有了权利意识，人们就开始思考，除了生存权之外，还有没有别的权利呢？


    这就引出了我们这一讲最厉害的人物，十七世纪的英国哲学家约翰·洛克（John Locke，1632 - 1704）。洛克提出，人总共有三个自然权利，分别是财产权、生'
  - '[PAGE 39]


    总共有三个自然权利，分别是财产权、生命权和自由权。这三项权利来自于自然法则，是人天生就有的。


    为什么说天生就有呢？因为自然法则给人带来了三个义务，而义务就有权利。如果我们有义务不能偷盗，那么对应的就是每个人都有财产权才行。如果我们有义务不去杀人，那就得承认每个人都有生命权。如果人不应该压迫人，那就是说每个人都有自由权。


    洛克非常强调权利和义务的对等关系。比如你对某一块土地拥有财产权，那么洛克就要求你把这个土地利用起来，比如耕种它，否则你就不配拥有……我们专栏以前讲过洛克这个主张对美国西部大开发的意义
    [3]。


    好，既然人有自然权利，那么法律的作用就应该是保护这些权利。而既然人都是自由的，政府就不应该是专制政府，而应该所有人共同同意之下的产物。洛克认为如果这个政府是专制政府，人民就有权推翻它。洛克的这些思想跟霍布斯支持专制政府的态度完全不同。那你说谁说的对呢？那当然是有什么样的国民就是什么样的政府，只讲生存权的国民只配拥有专制政府。


    洛克甚至还提出了立法权和行政权两权分立的政治思想，给后来美国搞三权分立——再加上一个司法权——提供了理论基础。


    你可能想不到的是，18世纪亚当·斯密论证自由市场经济的理论基础，其实也是人权。自由市场的确有经济上的好处，但市场存在的理由并不仅仅是有好处，而是人的自由和财产权利——人有权自由交易。从权利角度来说，自由市场是唯一合理的经济制度。


    # 3.美国的建立


    夏皮罗认为，美国的建立，是前面说的所有这些西方重要思想集大成的结果。


    美国宪法讲平等。而平等思想最早来源于《圣经》中“上帝照着自己的形象造人”这句话。


    美国宪法讲保护人权，说人有三项权利：生命权、自由权和追求幸福的权利。那洛克所说的财产权在哪呢？财产权包含在“追求幸福的权利”之中。追求幸福的权利不仅仅是财产权，还包括每个人拥有自己的劳动、拥有自己的思想和信仰，包括信仰自由。


    美国宪法讲义务、讲权力的制衡，这些思想直接来源于宗教提供的意义和哲学家提供的理性。夏皮罗认为美国建国这件事儿，是西方思想的巅峰时刻……接下来就是衰败……当然对此咱们中国人不一定赞成。


    这一讲我们用极快的速度梳理了西方思想的流变，这个总结必定是过于简略了，但是你不难从中发现一点规律。


    思想是人提出来的。但是思想进步中的每一步，当事人都不完全知道这个思想意味着什么。科学家一边搞科学研究一边赞美上帝，哲学家一边倡导人权一边拥护专制，他们只是做他们的时代能做的事。


    而思想一旦产生，它就要传播出去，它就要长大，它就可能变成完全不是当初那个样子。人控制不了思想。


    这就是思想史的趣味。世界上真的有永恒不变的思想吗？


    注释

    [1] 关于这一点，可以看看吴国盛的说法 — 专访北大教授吴国盛：中国古代没有数理科学，这本是命运，记者藏继贤 朱凡，2016-09-03，澎湃新闻。

    [2] 熊逸书院，13.3 | 一切人对一切人的战争。

    [3] 精英日课第二季，铁丝网和“什么叫拥有”。'
