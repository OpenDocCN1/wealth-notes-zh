    # 来自日课：把思考正规化


    读者 水七友、Eugene：


    模型是简化的系统吗？系统和模型有哪些联系与区别？


    万维钢


    我们专栏以前讲过系统论。“系统”和“模型”不是同一个理论体系下的概念，没有严格的区分。我们大体可以理解为，系统是一种模型。


    当我们说“系统”的时候，我们关注的由多个部分组成的一个整体。我们研究各个部分之间的关系，看看其中有没有正反馈和负反馈，对系统的输入、输出和演化有什么样的影响。这个思路本身，就是一种模型。


    但并非所有模型都是“系统论”语境之下的“系统”。比如你要描写一个苹果从树上掉下来时空轨迹，可以使用一个简单的牛顿力学模型，而这个模型过于简单，谈不上是什么系统。


    所以“模型”是个非常广义的概念。只要你试图使用抽象的、精确的语言去描写一个或者一堆什么东西，你就是在使用模型。


    读者 王少年：


    部门经理可以从一次发文当中推测出发文后发生的事情，炒股高手可以从一条新闻的推测推测出股市的涨跌……这个和天赋有关吗？有没有人天生容易接受各种模型并且能够利用的很好？


    读者 雨山仕：


    模型是抽象化的真实，虽然抽象出错也会存在，但我能理解为了能获得有价值的东西抛弃许多不重要的是否有必要的，但这重要不重要是靠什么许的呢？


    万维钢


    一个模型好不好，其中应该保留哪些重要因素、忽略哪些因素，归根结底只能通过跟真实世界的对比来决定。你设计一个模型，它遵从数学和逻辑运行的结果，必须至少能解释已知的数据。


    # 来自日课：怎样研究“人”


    读者 淡色的天堂：


    在混乱局势下各种情况和其中的行为不可预测，在大部分人是非理性的情况下选择理性行事是否能获得更大的利益呢？但是换个角度来看如果理性能获得更大利益，人群确实会逐渐趋向于理性，这样就回到了稳定局势。那么万老师，在混乱局势中聪明真的就没有用了吗？


    # 来自日课：三种分布模型


    读者 竞静透人：


    老师请问：天之道损不足而补有余，人之道损有余而补不足，这俩概念的边界在哪里？

    '
  mdcn: '

    # 3.局面决定人


    比如你对哈尔滨市的城市交通进行建模，你的模型演化出来一个稳定解，你说哈尔滨市民天天都是这么上下班。在这个解里，有一个叫老王的人，每天上下班都绕了远路。明明有一条半小时就到的路线，老王却选了一条一个半小时的路线。那么你想想，你这个模型是不是有问题呢？


    老王作为一个正常人，不会放着更好的路线而不用。你可以认为老王有非理性的倾向，但是要想做一个有用的模型，你不应该看不起老王的智商。


    这叫做你的模型“逻辑不自洽”。


    这里面有个大道理。如果模型有一个比较稳定的解，那么其中就 不应该有傻子。


    我们专栏多次讲过一个概念叫“有效市场假设”：在一个有效市场中，每个人都做到了他行为的上限，一切获利空间都会被占据。博弈论中也有个概念叫“均衡态”：在均衡态中，谁也不可能通过单方面改变自己的行为来改变博弈的结果。


    用在模型上，就是说如果你 的模型演化出来的结果是一个比较稳定的状态——哪怕是出现一个循环的状态也行，只要是可预期的就行——那么其中的人就会适应这个状态，就会通过个人经验或者互相学习，找到最优解。这个模型的参与者，就应该是聪明人。所以你就应该用理性人或者适应性规则建模。


    反过来呢，如果你要研究的这个局面是非常混乱的，根本没有什么规律可循，那这里面的人就不用被假定是聪明人，用固定规则建模也许就是可行的。为啥呢？因为混乱的局面中没什么经验可以总结，也没什么可以互相学习的，人无法改善自己的行为。


    简单来说，在复杂没有规律的局面中，人们普遍不会很聪明，因为聪明也没用；而在平衡稳定的局面中，人们普遍不会很傻，因为人会学习。


    当然这里所谓的“聪明”都是相对于局面而言，不是绝对的智商测试。智商好不好使，还得看是干什么用。


    这个道理不仅仅适用于建模。如果你是一个政策制定者，你需要了解人群的这个特性。


    比如你管理一家医院。你注意到医院急诊室太小了，应对不了每天来那么多患者，所以你打算把急诊室扩大一倍。你的测算 是扩大一倍足够了。


    但是如果你理解人，你就得考虑患者对你这个政策的反应 [1]。急诊室扩大之后，患者发现不拥挤了，他们会老老实实享受这个局面吗？不会的。


    患者会适应这个局面。既然急诊变方便了，那些本来只有些小病，不需要看急诊的人，就也会来看急诊。你的急诊室将会再次拥挤。你的模型必须能够判断，方便不是均衡态，拥挤才是。


    所以人再复杂，也要受到均衡态的控制……要不怎么陈道明说“往往都是事情改变人，人改变不了事情。” [2]


    注释

    [1] 人会对政策做出反应，这个道理被称为“卢卡斯批判（Lucas critique）”，跟我们专栏在《信号与刷分》这期讲过的“坎贝尔定律”非常类似。卢卡斯批判说改变一个政策，人的行为也会随之改变，所以不要靠旧行为预测新形势。

    [2] 精英日课第三季，博弈论2. 群鸦的盛宴


