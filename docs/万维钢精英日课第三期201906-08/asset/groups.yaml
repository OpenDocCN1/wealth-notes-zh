    《范围》5: 一边自我实现，..

    12:08 8.33 MB


    今天我们继续讲戴维·爱泼斯坦的《范围》这本书。咱们先思考一个问题。如果<|message|>你申请去美国读大学和研究生，除了各种成绩要求之外，你还要写一份“个人陈述（Personal
    Statement）”，说说为什么想学这个专业，以前做过什么，对未来有什么打算 loot. 那你肯定能想到，这是一个用故事打动人的机会。


    经典的套路是从小时候开始讲，比如果说我八岁的时候听了爱因斯坦的事情深受感动，立志要成为一个科学家。我一直都对科学充满好奇，做出科学发现是我长期以来的梦想，我一定要实现这个梦想。


    # 1.匹配质量


    我们知道英国其实是由四个地区组成的，包括英格兰、苏格兰、威尔士和北爱尔兰。各个地区大学录取方式具有一定的自主性。北爱尔兰的事儿爱泼斯坦这本书没提，在英格兰和威尔士，学生们在高中时代就要选定自己的专业，然后上大学只能上到口专业；而苏格兰则正好相反，学生在大学的头两年都不需要选专业，先上两年基础课，大三再开始专业化学习。


    # 2.黑马计划


    以前我们讲过的《平均的终结》这本书的作者、哈佛大学教育学家托德·罗斯（Todd Rose），跟人搞了个项目叫“黑马计划”[2]，专门研究那些比较成功、经历又比较曲折的人，看看他们有什么共同点。


    # 3.我是谁


    心理学家丹·吉尔伯特（Dan Gilbert）提出一个概念叫“历史终结错觉（End-of-History Illusion）”。

    如果让你回顾在过去十年，你的各种喜好和生活追求有没有发生过什么变化，每个人都能说出一些来，说我已经不是十年前的那个我了，当年我喜欢的东西，现在我已经不那么喜欢了；现在我喜欢的很多东西是当年的我根本就不懂的。'
