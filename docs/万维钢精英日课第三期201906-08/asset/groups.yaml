    ## VR、5G和超现实时代


    万维钢 · 精英日课³

    今天

    进入课程 ›


    VR、5G和超现实时代

    12:08 11.1 MB


    专题：宁波


    这一讲我想跟你探讨一点可以预见的、近期的未来。你想必已经注意到了，最近有两个消费者技术热点。


    一个是 5G 马上就要来了。我们知道 5G 的传输带宽会比 4G 高出很多，5G 的信号延迟会非常少，5G 允许你用一个账号连接很多个设备。很多人设想 5G
    时代将是一个“物联网”的时代，但是物联网到底会有什么样的“杀手级应用”，目前我们还没有看到。


    另一个是 Facebook 推出了历史上第一个不用连接电脑的虚拟现实（VR）头盔，叫 Oculus Quest。我用了感觉还不错。就好像多年前第一次玩电脑游戏一样，有很多不足之处，但是它开启了未来。


    王煜全最近在得到开了一个全球科技洞察讲座，讲了一些对 5G 的应用预测，他还专门介绍了对“混合现实（MR）”技术的展望，你可以先了解一下当前的局面。这里我想大胆猜测一下，5G
    + VR 或者 MR 或者别的什么“R”，会在不远的将来带来给我们什么。


    从易到难、从近到远，我们大概会遇到三种结合了超高速网络和超现实技术的应用。


    ### 1.视角直播


    VR 带给我们完全沉浸式的体验。你戴上头盔马上就到一个全新的环境之中，上下左右随意看，全方位无死角。


    我明显能感到在 VR 环境中大脑更容易被欺骗，比如坐虚拟过山车的时候会当真，如果是站立、不把着点什么东西感觉自己会摔倒。我玩了一个半是游戏半是电视剧的星球大战节目，感觉相当真实……我会忍不住跟其中的人物说话。YouTube
    上已经有了专门的 VR 频道，其中有很多短片还是特意结合了VR的特点制作的，算是全新的拍摄手法。


    ### 2.人人换脸


    现在用 iPhone 的 FaceTime 跟人视频聊天，它有一个增强现实功能：允许你给自己换一张卡通脸。比如你可以变成一只小老虎或者一只独角兽。系统会自动把你的表情映射到独角兽的表情上，你可以笑、可以眨眼、可以吐舌头，而且周围环境还是真实环境。


    ![](img/b58c3137b911797b913643bab2c018ea_46_0.png)


    我最近得知，Facebook 把这个功能又往前推动了一步。两个人戴着VR头盔聊天，而你可以选择，让对方看到一张什么样的脸。这个脸就不只是卡通形象了，做得非常真实，表情映射很自然。


    ![](img/b58c3137b911797b913643bab2c018ea_46_1.png)


    这就意味着，你可以决定自己的形象。


    ### 3.你的化身


    我感觉现在的消费者信息产品，重点还是在信息的接收端上，比如说手机和VR头盔。其实信息的采集端——或者更广泛地说，在人的“远”端——大有文章可做。比如使用无人机航拍，就等于于是给人提供了一个“化身”，让无人机代表人飞到空中去拍摄。现在已经有一种无人机飞行比赛，人操纵无人机穿越各种障碍，使用无人机的第一人称视角，非常刺激。


    ![](img/b58c3137b911797b913643bab2c018ea_46_2.png)


    以前我们把这种行为称为“遥控”。但是将来如果实现更为高级、更为直观的控制，就不应该叫“遥控”了——也许应该叫“穿越”。


    叫“穿越”。


    这就相当于你以灵魂的形式穿越到另一个身体上。


    你只要把无人机想象成一只小蜜蜂，无人机航拍其实就等于孙悟空化身为一只蜜蜂，去刺探敌人的情况。有了这个采集端，这就比单纯的 VR 视角直播更积极主动。


    人们一直呼吁的一项网络应用是远程手术。说让一个医生，通过网络，直接操控远方的手术刀，给病人做手术。我不知道这么多年过去了这个功能实用化没有，但是它绝对是可以实现的。可是为什么局限在做手术上呢？


    也许未来可以这么操作。比如我人在北京，我要去上海做一件什么事情。上海有公司提供“化身出租”服务。这是一种人形、或者更简易的机器人，能到处移动，有手有眼睛。我在北京戴上
    VR 头盔和手套，直接操控这个机器人去做各种事情。我可以上街，可以搭车，可以跟人握手，可以说话，可以拿个粉笔在黑板上写字，可以给人提供保护，甚至可以照顾病人。


    而化身周围的人都戴着眼镜，他们感觉就好像我本人在现场一样。


    理论上，化身可以做一切工作。当然化身不能吃饭，但是吃饭这种生理活动本来就不是工作的一部分。那请问在这种情况下，人在哪里工作和在哪里居住，还有关系吗？这是终极的远程工作。


    其实现在就有化身，只不过一般都是从事危险工作的机器人，5G 时代这个技术有可能大发展……而这也让我们想到，化身可以用来犯罪。


    所有这些设想都不是科幻，它们都已经在一定程度上实现了，我只是做了一点简单的外推。这些技术对人工智能什么的要求都很低，纯粹就是个信息传递的问题。如果未来是这个样子，那我们想想，人的价值观会发生怎样的变化。


    简单的信息将会失去价值。如果用简单信息就能做一件事情，那这件事就应该以虚拟的方式、或者以化身的形式去做。日常工作、包括开会，都是简单信息的事情。人们现在就已经恨不得禁止使用语音讨论工作，全都是微信文字讨论。


    ## 凡是亲临现场去做的事情，一定是为了某种体验。


    如果一个旅游景点仅仅是好看，那我戴上头盔就去了，何必亲自去呢？我们亲自去旅游，一定是为了感受视觉和听觉这种简单信息以外的东西，比如当地的空气、温度、食物的味道、建筑物的质感。


    知道，很容易；感受到，则会很贵。


    ## 体验包括对危险的体验。


    人们可能会觉得不用化身、去亲自做一些有危险的事情，才是真的活着。


    ## 但在大多数情况下，我们对“真实”可能会敬而远之。


    罗辑思维最近有一期节目说人们去乌镇并不是真的去体验古镇生活——真的古镇生活并不好玩。也许未来我们对一切事物都是这样的态度。我们是选择性地体验。


    ## 我们也可以想象到，会有很多人非常反感这些虚拟的东西。


    他们刻意不戴眼镜，干什么事情都要亲力亲为，他们认为真实是唯一值得追求的东西。他们以直面真实拒绝虚拟为荣。


    但如果你想彻底拒绝超现实，你也应该拒绝看电视。因为电视本质上也是虚拟现实，只不过技术上落后很多。


    现在的 VR 设备仍然很初级，头盔很笨重，戴时间长了难受，而且画面分辨率明显不够。我在 VR 世界里常常发现很多地方画面处理得不是很好，不真实。


    但是我摘下头盔，走出家门，看看天上的云和路边的树，有时候会觉得真实世界里的图像，渲染得也不是很好，感觉不是很真实……


    ![](img/b58c3137b911797b913643bab2c018ea_47_0.png)


