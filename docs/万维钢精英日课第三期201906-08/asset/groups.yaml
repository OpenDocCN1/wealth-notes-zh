    ## 《模型思考者》9："市场定位"是道几何题


    万维钢·精英日课³

    今天

    进入详情 >


    《模型思考者》9："市场定位..." 12:17 11.25 MB


    【纯享：蒋沙】


    今天我们继续讲斯科特·佩奇的《模型思考者》。我们要用数学模型研究"市场定位"这个问题。


    商界的人喜欢谈市场定位：你这个产品主打什么功能？什么价格？面向什么样的消费者群？但定位并不仅仅是一个商业问题，比如政治家就要讲定位——你支持什么反对什么？你主打什么议题？你的基本盘是谁？你要争取哪些选民等等。


    谈论市场定位我们还必须考虑竞争对手的情况。现在这个市场中有多少玩家？这是一个蓝海市场、黃海市场还是红海市场？


    这些说法你可能已经很熟悉了，但是我相信，数学模型可以帮助你看得清楚。而看清楚了，你就能获得一些洞见。


    我们先说一个关键概念，叫"属性的维度"。


    ### 1.一维问题


    我们想象这么一个场景。在一条直线形的海滩上，有两家卖冰激凌的小摊，A和B，像下面这张图中这样——


    ![](img/b58c3137b911797b913643bab2c018ea_114_0.png)


    图中每个黑点代表一个消费者。我们假设这两家的冰激凌的价格和味道都是一样的，他们会去距离自己最近的冰激凌摊。


    这个场景我们以前讲博弈论的时候说过[1]，但这里我想用它说明一个概念："属性"。这两家冰激凌摊竞争的只有一个属性，那就是距离。它们所谓的不同定位，就是距离上的差异。


    表现在数学上，这就是一个一维的问题。我们画一条线，两家冰激凌摊的定位就在这条线上。我们把这条线叫做"属性空间"，也就是市场上各路玩家争夺的领地——对这个问题来说，属性空间是一维的。


    而有了空间和定位，就要划分地盘。图中在A、B两点正中间的那条竖线就是两家地盘的分界线，分界线左边的消费者都会在A家买，右边的消费者都会在B家买。


    这个一维属性完全可以是别的东西。换一个场景，A、B可以是在同一个位置卖不同口味的冰激凌商家，可能一个奶油多一个奶油少，这也是一维定位。我们还可以把A、B想象成两个政客，他们的政治立场一个偏左一个偏右，那么显然在左边的选民会支持A政客，右边的选民会支持B政客。不管是什么属性，只要是一维的，我们就可以如图那样划分地盘。


    而根据博弈论，这个一维的问题有个最优解。冰激凌摊应该摆在海滩上正中间的位置[1]。对政客来说，他应该把所有选民从左到右排队，然后自己选择排在中间的那些选民的立场——这个道理叫"中间选民定理"，政治选举演化到后期，总是中间选民的立场最容易被政客代表。


    那你可能就会问了，为什么真实世界里的政客并不都是采取中间立场的呢？为什么真实世界里商品的口味什么都有，并不都在中间呢？


    那是因为真实世界不是一维的。


    ### 2.二维维度


    真实世界里的商品常常会在多个属性上争夺消费者。咱俩考虑一个二维的局面，卖巧克力。假设巧克力有两个维度，一个是可可粉的浓度，有人喜欢重口味有人喜欢轻口味；一个是糖的浓度，有人喜欢甜的有人喜欢淡的。用数学模型表现，二维的属性空间就是一个平面的图形——


    ![](img/b58c3137b911797b913643bab2c018ea_114_1.png)


    图中横坐标表示可可粉的浓度，纵坐标表示糖的浓度。A和B是两个品牌的巧克力，各自吸引不同的人群。我们连接AB，对这条线做中垂线，这个中垂线就是A和B地盘的分界线。从几何学上来说，分界线左边的消费者的口味偏好距离A更近，他们会选择A品牌，右边的消费者则会选择B品牌。


    那现在假设你面对这个市场格局，也想做一个自己的巧克力品牌，我们称之为C品牌。那你的定位应该放在哪里呢？


    产品定位不是一个直觉问题，不说你喜欢什么样的产品就做一个什么样的产品。你必须考察市场上已有产品，他们的定位都是什么样的。你画一张图，看看消费者的分布情况，看看别人的地盘中有什么薄弱的地方，计算自己定位在哪里能占夺最大的地盘和最多的消费者。


    你需要数学思维——更准确地说几何学思维。比如如果C产品定位在高可可粉低糖的右下角，三家的势力范围就会按照下图划分[2]——


    ![](img/b58c3137b911797b913643bab2c018ea_114_2.png)


    然后你还要考察这个区域中有多少消费者。所以你看，市场定位其实就是一道几何题。


    成熟的市场中消费者是根据你产品的定位决定是否购买，成熟民主政治中的选民是根据政客的立场投票。美国议员和大法官的政治立场在很大程度上是非常稳定的，他们都有自己的定位。要得到我这一票，你长得好不好看、甚至你是不是好人都不重要，重要的是你赞成什么，你反对什么。


    几何学思维马上就能给我们一个洞见，那就是如果至少有两个属性维度，"中间选民定理"就是不成立的。这是因为从二维平面中的一点向四周看，会有无数个方向——那么除非选民是绝对均匀分布，你不可能保证每个方向上两边的选民都正好一样多。


    比如我们看下面这张图——


    ![](img/b58c3137b911797b913643bab2c018ea_114_3.png)


    图中每个"v"代表一个选民，总共有5个选民。圆圈处的那个政客采取最中间的立场，看起来离所有选民都比较近。可是另一个政客马上就可以在块那边位置插入！两人划分势力范围，方块的地盘小，但是里面有3个选民，是个多数。


    这个道理是只要属性达到二维以上，产品定位就只有一个往中间走的趋势，而不是必须位于中间。这里面没有必胜的定位！


    正是这个数学性质保证了市场的多样性。我们看到真实世界里的市场中什么样产品都有，总是有新品牌进入的机会。


    而这本质上是个几何学的道理......几何学还能告诉我们更多东西。


    ### 3.定位与价格


    我们前面讲的都是对"属性"的定位，特点是不同消费者对属性的偏好不一样。而产品还有一些别的特性，则是全体消费者有一致的偏好，比如说价格——全体消费者都希望价格越低越好。


    这就意味着，同样属性的商品，如果我把价格降低一点，那么我的势力范围就应该扩大一点。比如说，如果A家的冰激凌降价，那么有些消费者就会宁可舍近求远，也要选择它的冰激凌。当然不同消费者对价格的敏感度不一样，但是平均而言，我们可以认为人们在总体上，会为了多省一块钱，而放弃一点对属性的要求。


    那么我们就可以设定，消费者选择商品使用的效用函数，应该跟商品的价格成正比。而这就意味着，一款商品降价，就相当于把它的边界线向外移动了一段距离。


    那价格战有多大用处呢？咱俩看下面这张图——


    ![](img/b58c3137b911797b913643bab2c018ea_114_4.png)


    写留言，与作者互动


    ![](img/b58c3137b911797b913643bab2c018ea_115_0.png)


    图中 A、B 两个品牌本来已经分好了势力范围。现在 B 决定降价，结果就是 B 产品的势力范围会往左移动一点，B 的领地变大了。


    但是领地变大可不一定能弥补降价带来的损失。我们设想 A 和 B 原本各占 50% 的地盘，现在 B 把价格降低 10%，这个举动使得他的地盘从 50% 扩大到了
    54%。如果消费者是均匀分布的，那这也就是说，B 的地盘扩大了 8%，可是价格降低了 10% —— 这相当于总收入下降了 3%。所以 B 根本就不应该降价！


    B 不应该降价的根本原因是 B 原本的地盘太大了，它面对的是一个没有多少竞争对手的、稀疏的、蓝海市场。那我们再看看拥挤的红海市场是什么样的情形 ——


    ![](img/b58c3137b911797b913643bab2c018ea_115_1.png)


    上图中市场上有许多家品牌，每家的地盘都很小。B 同样把价格下降 10%，因为消费者眼中的一块钱就是一块钱，B 的边界线会向外平移同样的一段距离。而这次扩充边界，对领土很小的品牌来说就太重要了。B
    的地盘扩大了三分之一，即便考虑到降价，总收入也提高了 20%。这个价格战应该打。


    这两个例子给了我们一个洞见：要不要打价格战，和市场的拥挤程度有关系。


    如果竞争对手很少，你面对的是一个蓝海市场，那你降价只会伤害自己的收入。而如果竞争对手很多，你面对一个红海市场，价格战就能立即扩大你的市场份额，就很有效。


    那市场的拥挤程度和什么有关呢？和属性维度有关。


    比如像成品油啊、标准小麦这种商品，谁家生产出来的都是一样的，等于说属性维度是 0，那价格就是唯一重要的因素。而像海滩上的冰激凌，至少还有位置这么一个因素，是个一维市场，有些商家仗着地利就可以拿个高价。属性空间的维度越多，各个品牌就越容易找到属于自己的市场定位，在那里不需要面对很多竞争对手，就越没必要打价格战。


    以前苹果几乎是高端手机市场唯一最好的品牌，它当然可以要一个高价。苹果从来不打价格战，它拥有市场上最高的利润率。但是现在随着华为之类中国品牌的崛起，苹果在属性空间上的领土正在被入侵。如果将来苹果不再具有独一无二的技术优势，它就必须降价。


    所以最好的创新应该是发明一个新的属性，打开一个新的定位维度 —— 在那个维度上没人能跟你竞争，只要消费者对你认可，你就可以要一个高价。


    总结来说，模型思维能把“市场定位”这个问题变成几何学问题。产品的品质属性决定了定位空间的维度：一维就是一条线，二维是一个平面，三维是一个立方体，还可以有四维、五维。每一个定位都是属性空间中的一点，各个品牌根据定位划分地盘。维度越低，属性空间就越容易拥挤；空间越拥挤，各家就越容易打价格战……所以只有属性维度上的创新才能带来真正的蓝海。


    那你可能会说，这些道理我都懂啊！你可能懂，但是如果不用数学，你所谓的懂就都是一些直觉：你知道这个道理重要，但是你不知道这个道理有*多么*重要。你不会把问题量化，你就不容易做出精确的决策。


    现在很多商界大佬喜欢谈论物理学的概念，什么“熵”啊、“第一性原理”啊之类，我对此表示赞赏。但是你能用“信息熵”给我计算一下什么时候应该打价格战吗？如果大佬们能弄个黑板，画个势力范围地图，像解几何题一样研究怎么扩大自己的地盘，我看那个更高级。


    注释

    [1] 博弈论2. 群鸡的盛宴

    [2] 这种分割方法叫做 Voronoi neighborhoods.


