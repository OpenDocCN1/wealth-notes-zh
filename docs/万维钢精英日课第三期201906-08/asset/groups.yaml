    # 《模型思考者》1：把思考正规化


    万维钢·精英日课³

    今天


    进入课程 ›


    《模型思考者》1: 把思考正..

    11:51 8.14 MB


    | 转载：亦沙 |


    今天开始我们来讲一本新书，斯科特·佩奇（Scott E. Page）的《模型思考者》（The Model Thinker: What You Need to
    Know to Make Data Work for You）。


    ![](img/b58c3137b911797b913643bab2c018ea_86_0.png)


    你应该已经知道斯科特·佩奇，他是密西根大学政治学教授，我们专栏第二季讲过他的《多样性红利》。《模型思考者》出自佩奇开的一个“模型思维课”，最早是在大学，后来变成了一个网课，现在已经有各行各业超过一百万人在学习。


    这一百万人想学的是怎么理解和应对这个复杂世界。


    什么是模型呢？如果“多样性”说的是观察问题的“视角”，“模型”说的就是研究问题的“镜头”。你可能知道投资者查理·芒格喜欢谈论“思维模型”，不过在我看来那其实是一系列理解和思考的套路，相当于新时期的成语典故。佩奇说的模型要高级得多，是学者们使用的那种正规的“理论模型”。


    想要理解这个武器级的概念，你的思维方式需要先升级。


    # 1.什么是模型？


    要想用高级方法探究问题，你得把思考给正规化。咱们举个例子。


    一个小孩踢足球，他妈尽全力也沒踢出去多远，他踢不动。而一个大人飞起一脚，球就会被踢得很远。有人对这个现象总结了一个规律，说踢球的力量越大，球飞得就越远。


    这是很不错的观察和思考。足球运动员通过训练能对“球性”有深刻的体察，但是如果你让他谈谈力量和距离的关系，他大概就只能说到这个程度。各种成语典故，什么唇亡齿寒、扬汤止沸，包括古代军事将领写的兵书战术，什么《孙子兵法》，也都是这个水平的思考。这些思考都是有用的……但是，这种思考方式太落后了。


    首先它不精确。我把力量增大一倍，球的飞行距离能增加多少呢？你无法计算。其次它没有适用范围。这个道理一直都对吗？在什么情况下会不好使呢？你无从判断。


    复杂世界里的现代人，可不能靠成语典故和寓言故事指导决策。那种水平的思考没有精致推演的能力。


    现代学者都使用更高级的思考方式。


    最起码的一点就是一个数学公式能抵千万语。想要知道踢球的力量和球的飞行距离的关系，我们首先用牛顿第二定律公式描写力量和加速度的关系，然后通过加速度和触球时间计算速度，再考虑地球引力和空气阻力……这听起来比较麻烦，但是这一套思考允许你做精致的推演。


    这就是思考方式的正规化。请注意，你思考的其实已经不是那个具体的球和那个具体的踢球者了，你思考的是一个抽象出来的踢球模型。


    模型是对真实世界的抽象。我们以前讲过“逻辑思维”，我们知道，只有抽象的东西，才是属于逻辑世界[1]。建立了模型，你才能做推演。


    模型必须符合两个要求。


    第一，模型中包含的各种实体 —— 人也好、组织也好、物品也好 —— 以及这些实体之间的相互关系，必须都有非常明确的定义。


    第二，模型可以做逻辑推导。


    其实你每次做数学应用题，都是在使用一个模型。你知道题目包含什么假设，有什么因果关系，就能用数学推导出一个结果。


    正规化就是抽象化，抽象化才能可推导，而可推导是个非常厉害的能力。一旦思维上升到模型 impugn 的高度，你就不再是老百姓水平了，一般的道理就骗不了你。


    比如美国共和党总统都喜欢减税，一般讲的故事是减了税，老百姓的钱就多了；老百姓钱多了，就可 以扩大消费，经济就会增长；经济增长蛋糕大了，政府的税收反而会增加……你听着好像很有道理。


    可是咱们用一个最简单的数学模型推导一下。假设税率降低10%，那么要想收到跟原来一样多的税，经济必须增长10%以上才行……可是近年来美国经济最高也就增长4%左右，真要到10%那是一个奇迹！


    当然真正研究经济问题需要更复杂的模型，但是这个道理是我们需要模型，而不是故事。下面咱们讲一个真实的应用，看着模型思维的威力。


    # 2.洞见本质


    2008年金融危机期间，美国财政部在关键时刻出手，购买了AIG公司（美国国际集团，American International Group）的资产，使得AIG没有倒闭，保住了它。


    这个救援行动遭到了各方的猛烈批评。有人说这等于是政府直接干预经济，违背了自由市场的理念，这还叫资本主义吗？有人说雷曼兄弟公司你为啥就不救援呢？结果雷曼破产了AIG没事，这公平吗？


    美国政府行事的逻辑在哪呢？讲故事不如看模型。下面这张图是当时国际货币基金组织搞的一个模型，描写了各大金融机构之间的网状关系——


    ![](img/b58c3137b911797b913643bab2c018ea_86_1.png)


    各个机构之间的连线代表他们的关联，连线越粗越深，关联就越强。AIG处在这张关系网的一个中心位置。有好几个金融机构购买了AIG提供的资产保险，如果他们资产的价格下降，AIG会给他们兜底。


    有了这个模型，我们就可做推演了。我们可以想象，如果AIG倒会发生什么？使用数学推导，我们知道其他那些机构就会拿不到保险金，那么他们也会跟着倒闭，结果就可能是灾难性的连锁反应。AIG是“大到不能倒”，这就是为什么要救AIG。那为什么不救雷曼兄弟呢？因为模型中雷曼兄弟并不具有AIG这么核心的位置。


    事实证明雷曼兄弟的倒闭并没有牵扯到整个金融系统，模型的预测可以说是准确的。金融危机过去之后，美国政府又卖掉了AIG的资产，一进一出从中还净赚了230亿美 元……可以说当初救援AIG是一个正确的决定。


    模型帮我们看清了各个金融机构之间关系的本质。如果没有这个模型，你光说AIG很重要，就不足以做出这种精确而大胆的操作。但是问题来了，当初为什么要选择这个模型呢？


    为什么不考虑各个金融机构高官的任职情况呢？为什么不考虑这些机构在历史上对美国所做的贡献呢？为什么不考虑对舆论的影响呢？


    简单地说，只看关系模型，是因为你想要的是金融市场的稳定。不简单地说，忽略其他因素，这是一个非常主观的冒险选择。


    选择模型，你需要智慧。


    # 3.从数据到智慧


    Aa 字号

    写留言

    108

