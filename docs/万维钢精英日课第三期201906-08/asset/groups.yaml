    ## 读者,你好


    我和家人现在正在国内探亲访友，而且我要参加我们初中班级成立 30 周年的同学聚会，会喝一些酒……为了保证专栏写作质量，请允许我请假两个星期。我们会在 7 月
    22 日星期一的零点恢复更新。


    我们精英日课第三季是去年 11 月 18 日开始的，原定今年 11 月 17 日结束，现在顺延两个星期，改为 12 月 1 日结束。


    在这两周里，如果你有兴趣的话，也许可以先预习一本书——《生活黑客：系统化生存及其反对者》（Hacking Life: Systematized Living
    and Its Discontents），作者是美国东北大学的传播学助理教授约瑟夫・里吉尔（Joseph M. Reagle Jr.），今年三月份由麻省理工学院出版社出版。


    ![](img/b58c3137b911797b913643bab2c018ea_62_0.png)


    这本书中讨论了如何提高做事效率，如何自我激励，如何保持健康，如何改善关系之类的生活话题，但是，这可不是一本普通的“励志书”或者“生活指南”。


    我们要从这本书里学习的是*黑客思维*。


    所谓“黑客”，就是能“黑进”系统的人。比如计算机系统，它有各种标准化的操作，给你一个软件，它有一套常规的功能——但那只是表面上的标准和常规。系统的背后，另有一套规则……只有黑客能看到那一套规则，知道系统*实际上*是如何运行的。


    那又何必非得是计算机系统呢？生活中一切事物都可以是系统，都可能有“表面上”和“实际上”如何运行的区别。黑客思维，就是通过发现系统实际上的运行方式，使用非常规的操作，达到对自己有利的目的。


    黑客能做一些特别厉害的事情，黑客中有好人也有坏人。当一个黑客施展手段纵横江湖的时候，他的内心会有挣扎和迷茫。里吉尔这本书是近年来“生活黑客”这个新兴领域的集大成者，它不仅仅告诉你“what”和“how”，还会让你思考这一切到底值不值得……


    看到“麻省理工学院出版社”，你应该想到这不是一本按照畅销书套路写的书[1]……我认为它的难度系数[2]是 5。也许你可以自己先读一读，两周后咱俩一起讨论。


    如果你是新加入到日课的读者，我特别建议你从咱俩开篇的《相对论》学起，能把最难的搞懂了，其它内容也一定不在话下。


    ## 等我回来。也祝你度过一个愉快的夏天！


