    # 路径的反噬


    万维钢·精英日课³

    今天


    进入课程 ›


    路径的反噬

    10:28 9.59 MB


    【转述：柠汐】


    这一讲咱们讨论“路径依赖”这个规律的另一面。数学规律都是中性的，不分什么“好人的数学”和“坏人的数学”、“无阶级يد的数学”和“资助阶级的数学”、或者“令人高兴的数学”和“令人难过的数学”。“强奸的柯伊伯”这个模型可以描写强奸，也可以描写新事物的流行。“路径依赖”可以是好事儿，也可以是坏事儿。


    根据路径依赖原理，成功者总会做些事情，让自己以后更容易做成别的事情，这就来越成功。可如果事情都是这样的，这对别人不是太不公平了吗？那别人还能有机会吗？


    别担心，这是一个皇帝轮流做得世界，而且这也是规律。路径依赖带来优势的同时，也带来了反噬。


    《福布斯》杂志有个世界富豪400强排行榜，有人对比了榜单上的名单，发现1989年最富的400个人中，有230人，到2001年的时候已经不在榜上了[1]。十二年时间，60%的顶级富豪被挤下去了。再看得更近一点，三年就会被挤掉25%。


    看起来新人有机会，巨富不会一直是巨富。我们以前讲过[2]，“富不过三代”这个现象可以用统计学上的“回归平均”解释，人的好运气不会一直延续。但是富豪排行榜这么高的淘汰率，好像不能完全用回归均值解释。


    纳西姆·塔勒布在《非对称风险》这本书中引用过另一个统计[3]。现在一家公司入选标准普尔500成分名单，一般只能停留10到15年时间，然后就要么自己业务萎缩变小了，要么干脆就被人收购了。可是在上个世纪，典型的大公司往往能在名单中停留60年以上。


    “回归平均”无法解释为什么现在跟过去不一样了。而且美国和欧洲也不一样。塔勒布在书中还提到，现在美国的阶级流动性比欧洲好得多——欧洲有好多世袭几代的巨富家族，而美国最富有的500个人里，有超过90%是过去三十年刚刚崛起的新富。单纯的运气因素，解释不了这样的现象。


    为什么现在的公司和富豪都变得越来越像网红，根本就不讲传承，动不动就过去了呢？这很可能就是因为创新：现在比过去更容易创新，美国比欧洲更容易创新。


    路径依赖能让你在老路上越走越得心应手，可是别人可以走新路。


    财经专栏作家摩根·豪泽尔（Morgan Housel）最近写博客分析了为什么富豪在排行榜上站不住这个现象，他说这是因为获取财富，和保住财富，是两种不同的技能，甚至要求你有不一样的性格。


    获取财富要求你敢于冒险，对自己充满自信，往往创业者都是过度自信的人。而保住财富，则要求你有容错的能力，做事留有余地，有个缓冲ина，不至于因小失大才行。说白了，前者是进攻，后者是防守。


    而且这个规律不仅限于财富。公司要高速扩张还是要稳住现有的市场份额、国家要多占领土还是要好好经营现有的领土，都是不一样的技能。而进攻型人才和防守型人才，通常不会是同一个人。


    当然你可以说巴菲特就既能在早期赚到钱又能在后期守住和继续赚钱，但那是特例。如果你本来就是个喜欢进攻的人，而过去的进攻又让你非常成功，你很难转换心态去防守。


    你会根本就不在于防守。豪泽尔特别拿埃隆·马斯克做了例子。马斯克32岁的时候就认定、并且证明了自己能同时挑战通用汽车、福特公司和美国国家宇航局。马斯克的目标是殖民火星。马斯克不但擅长工程技术、热爱科学，而且还是个有哲学思想的人，经常参与诸如“人类有99.9999%的可能性是计算机模拟的产品”这样的讨论……


    那你说像这样一个人，会不会在乎别人说他“不谨慎”呢？马斯克在Twitter直接说公司的内部数据，美国证监会认为这违反了有关上市公司公布信息的规定，你猜马斯克会在此收敛吗？他的风格直接对标特朗普。他随意的发推会影响特斯拉的股价波动，他会担心吗？他没有那种
    confisc小心的玻璃质的心智模式。


    自信会让你更容易成功，成功会让你更加自信，……一直到你不该自信的时候也自信。


    这就是路径的反噬。这个规律适用于很多地方，并不仅限于进攻和防守。米奇·普林斯汀在《欢迎度》这本书里讲过一位“高中女王”的故事[6]。美国高中最受欢迎的女生都是那种长相出众而且性格强势的类型。她们的行为充满争议但是极受同学欢迎，她们不需要学习好，她们从不主动配合别人，她们一直都被同学宠着……


    直到高中毕业。因为女王忙于社交没有太多时间学习，就没有考上好大学，结果往往是迅速变成普通人。适合高中的性格，并不适合成人。那个路就会反噬。


    同样地，适合在大学做个好学生的性格，可能恰好不适合将来做个能做出开创性工作的科学家或者企业家。能迅速争取到恋爱对象的性格可能恰好不适合长期的婚姻。能在革命中取得奇迹般胜利的性格，可能恰好不适合和平建设。


    这就像生物演化一样，已经成功适应这个环境的生物很难在自己这一生发生什么特性的改变，但是环境可以变。而这就给那些特别人家、尚未证明自己的生物留下了机会。


    我们考察历史，路径反噬这个规律就好像宿命一样。唐朝初年重视武力，将领和士兵充满军营感融无不胜，因此造就了传世的中央帝国；可是等到时代变了，同样的武力会威胁到中央权势，导致唐朝灭亡。宋朝吸取教训压制武力，因此建成和平的平民社会；可是等到时代变了，被压制的武力就会因为没有力量而难以保卫国家。


    伊恩·莫里斯《西方将主宰多久》这本书里说的是也是这个主题。同一个地里环境，在文明发展的这个阶段是优势，在下一个阶段就可能是劣势。


    比如说，农业社会时代，中国作为一个统一的大国，拥有连成一片的广大的可耕种土地，是经济发展绝对优势。西欧四分五裂，各国的可耕种土地都很小，很多城市直接就是对敌前线不得不修筑城堡，是绝对的劣势。这就是为什么宋朝一个普通中国人的生活水平可以跟欧洲贵族相媲美。


    可是下一个时代，西欧被迫尽可能发掘土地的效用，弄出了像风车、水车这样的创新，还广泛地使用了机械化的磨坊，也就是面粉加工场。而中国因为原本土地就多农业就发达，所以人口就多，再加上加工大米不像加工面粉那么麻烦，用人力就行，反而没有要搞那些创新。


    西方，也曾经拥有对咱中国的“后发优势”。


    所以各个文明的此消彼长就好像宿命轮回一样，强者不可能一直强，旧的文明中心总会衰落，新的强者总是在旧文明的边缘出现。


    历史不会让谁永远独大，总会给别人变出机会来。


    那你说我就不想轮回，我要与时俱进，这行不行呢？作为个人来说那非常难。你的某些特性如果给你带来巨大成功，就一定会成为你的招牌动作，你很难再改人设。


    甚至连科学家都做不到。当一个学科发生根本性的观念革命，也就是所谓“范式转移”的时候——就比如物理学发生量子革命——老一辈科学家几乎就没有跟著一起转变得的。普朗克有句话说，新科学真理之所以能够胜出，并不是因为反对者被说服了，而是因为老一辈科学家最终都死了。


    所以换人比换思想容易多了。有人认为公司也会陷入个人一样的宿命，最终都会被往成功的路径反噬，但是我看数据并不支持这一。


    我们讲弗斯特的《规模》这本书的时候说过[7]，公司的标度率差不多正好是1，介于生物寿命长一定有限的生物体和生命可以无限长的城市之间。随着公司变大，平均而言，它的销售额和成本都恰好和员工人数成正比。这是一个非常危险的平衡关系：稍差差一点，公司就会陷入撒哈拉曲线[8]，被路径反噬而死亡；但稍微好一点，公司就能开创新颖的微笑曲线，继续成长。


    ……当然，我猜这个好结果的前提是公司得懂得换人才行。


    我们这一讲串联了很多以前讲过和没说过的知识，它们曾出现在看似完全不相关的领域。但是你看，这些事儿都是有联系的。


    注释

