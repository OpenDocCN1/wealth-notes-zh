    # 内隐学习和外显学习


    万维钢·精英语曰课³

    昨天

    进入专栏 ›


    内隐学习和外显学习

    11:14 7.71 MB

    | 译者：孙夕 |


    这一讲咱们说一个比较前沿的心理学概念，叫“内隐学习”，英文是 implicit learning。内隐学习是“当前科学理解”现在尚未理解的一种学习方式。其实你一直在用这个方式学习，但是你不一定知道。


    为了理解内隐学习这个概念，咱们先说它的反义词，叫“外显学习”，英文是 explicit learning。之所以强调英文是因为“内隐”和“外显”这两个词听起来都有点怪，看英文其实更容易看明白。所以外显学习，其实就是我们熟悉的、正常的学习方式。


    比如要学习一个数学知识，你肯定要先了解相关概念的定义是什么，掌握其中的使用规则是什么。你记住概念和规则，就可以在相应的场景下正确使用。这些知识都是明确的——所以叫“外显”。学校里教的和书本上讲的知识几乎都是外显的。像我这篇文章，也是先用非常明确的方式告诉你我要说的是什么。


    外显学习就如同程序员写程序，说究“先定义、后使用”。这样学习的内容才符合逻辑，才能被理解。


    但外显学习并不是最自然的学习方式。


    你想想一个两岁的小孩子语言是怎么学的。难道你会明确告诉她定义和规则吗？比如为了让她知道“桌子”这个词的意思，难道你会说“孩子你知道吗？桌子就是一个通常为长方形或者圆形的、表面绝对平整、有四条腿或者六条腿、一般用于写字和吃饭的物体”吗？你会教她语法规则吗？你不会的。


    小孩都是在潜移默化中学习语言。她根本说不清桌子的定义是什么，但是当她看见桌子的时候，她知道那是一个桌子。她不懂什么语法规则，但是她能把话说得符合语法；而而且如果你故意说一句不符合语法的{

    }话，她能听出来这句话有毛病。


    这种学习就叫内隐学习。内隐学习是必不可少的学习方式。我们长大以后在学校学外语用的基本上是外显学习法，又是背单词又是记语法，中英对照，学得很生硬。你非得到一个真正的外语环境之中，跟当地人打成一片，慢慢说溜了，才知道各种地道的说法，才会识别不地道的说法，才能体会到那个说不清道不明“语感”。


    不知不觉就会了，会了也说不清楚，这种感觉，你很熟悉吧。


    内隐学习到底是怎么进行的呢？你可能听说过各种民间说法，但是我可以非常负责任地说，目前没有被普遍接受的科学解释。


    小孩是怎么学会语言的？有一种说法认为语言学习有个“窗口期”，在1~3岁。而之所以这时候最适合学语言，是因为幼年大脑的“可塑性”特别高：这时候一学就会，长大了就算若努力，发音也会很生硬。这个解释强调的是硬件。


    但我们专栏还介绍过发展心理学家艾莉森·高普尼克（Alison Gopnik）的解释 [1]，强调的是软件。高普尼克说小孩的学习都是靠猜测和试错，是贝叶斯式的学习，而这个方法对人工智能算法特别有借鉴意义。


    这些说法都有道理，但是它们不能解释，既然儿童这么善于学习，他们学别的为啥不行呢？任何一个辅导过孩子数学的家长都有这样的体会：学说话好像没怎么教就会了，为什么学个二十以内的加减法这么费劲呢？


    现在很多研究内隐学习的研究者认为，内隐学习和外显学习的适用领域是不一样的。


    外显学习，适合规则明确的简单领域。没错，规则明确的领域其实是简单领域。二十以内加减法很简单，而你只要能把规则说明白，操控一个核电站其实也很简单。


    内隐学习，适合没有明确规则的复杂领域。语言是非常复杂的，这就是为什么让人工智能掌握人类的语言那么难。不过复杂并不完全等于困难，只要方法得当，连小孩都能应付一些复杂问题。


    比如说，就绘画而言，印象派、点彩派、野兽派和立体派，到底应该如何区分呢？你单单纯用文字很难明确描述。但是如果把各派的作品都找来一百幅，你一边看一边猜一边请人纠正错误，可能很快就会学会判断了。


    内隐学习的是一种“感”，似乎都是在实践中学。足球教练会阅读比赛，官场老油条善于判断形势，他们不再是孩子了，但是仍然在使用内隐学习。


    “当前科学理解”做事的风格是非常保守的。关于内隐学习，心理学家正在试图书明，它到底是不是一个真的不一样的学习方式。


    有很多猜测，内隐学习和外显学习调用的是大脑的不同部分和不一样的神经网络，这就是为什么小孩学语言比大人快，大人学规则比小孩快。可是你怎么证明呢？咱们体会一下其中的科学方法。


    我看到2019年七月刚刚发表的、威斯康星大学的一项研究 [2,3]，用四种方法测试内隐学习的能力，分别是——


    +   * 给若干段由虚构单词组成的句子，让你体会其中的语法结构，然后判断其他句子是否符合这种语法；

    * 观察一些图片导致的结果，判断新的图片会导致什么结果；

    * 观察屏幕上一个飘忽不定的圆圈的落点，判断它的下一个落点区域；

    * 根据反馈，给一个视觉刺激分类。


    研究者首先要证明，内隐学习的确是一种能力，而不是纯属瞎蒙的东西。他们的做法是找一群受试者，先用这四个方法测试一遍，看看到这些人中谁强谁弱；然后过一个星期让他们再来，换一套题再测试一遍。结果发现受试者在这些测试中的表现的确是因人而异，而且两次测试的结果具有相关性。也就是说，第一次表现好的人第二次表现也好。'
  - '[PAGE 105]


    这也就说，集中注意力，有可能会妨碍内隐学习。


    这是为什么呢？外显学习的规则是明确的，你肯定得集中注意力才能记住规则。而研究者分析，因为内隐学习的内容都是没有明显规则的，你越是努力寻找规则就越可能钻牛角尖，找到一些根本不是规则的规则；你还不如放松注意力，让头脑开放，直接感受信息，反而更容易领悟那种“感”。


    而这就解释了为什么学龄前儿童善于学语言而不善于学数学。学数学需要集中注意力。人脑负责集中注意力的区域主要是前额叶皮质。这个区域的发育非常缓慢，要一直到青春期以后才能成熟。儿童的前额叶皮质还没有发育好，当然就不善于集中注意力。


    儿童学语言可不是坐在那里认真听讲学会的。他们一边玩着一边学，有时候跟你对话，有时候是偶尔听到你说话。他们是不经意地学，你和他们自己都不知道他们什么时候学的——但他们就是学会了。他们不擅长集中注意力，而注意力恰恰还会妨碍“语感”！


    我们想想自己会的那些东西，是不是其中有一些就是不经意学会的。你是什么时候学会处理复杂人际关系的呢？你是跟谁学的讲笑话的呢？可能都是潜移默化的内隐学习。


    那由此说来，作家看看各种闲书，官员研究研究历史，这些事儿越是不刻意，可能反而效果越好。你想要的不是什么明确规则，而是把握一个说不清道不明的“感”。


    以前我读过一本大概是藤泽秀行写的围棋书，要求年轻棋手要多多地打谱。也就是拿前辈高手的实战棋谱，自己照着一步一步摆出来。那本书说打谱的时候不用想太多，不要停下来琢磨前辈当时为什么要那样走，你只要赶紧从棋谱上找到下一步的落子，能快速把一盘棋摆完就行。


    我当时无法理解为什么要这样打谱。现在想起来，也许打谱是内隐学习：你想要的是“棋感”，所以你不应该想太多。


