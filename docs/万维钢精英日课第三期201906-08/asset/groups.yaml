    # 问答：怎么提高社会信用？

    11:51 8.15 MB


    来自日课：只是权利，不是义务


    读者 听雨38748177：


    一个朋友是生猪养殖大户，为了冲市场价格波动可能带来的大幅损失，买了价格保险。若出售产品时，价格低于保险合同约定价格，保险公司就需要履约赔付；若市场价格上涨，他赚取了收益，只是与不买价格保险相比，多支付了保费。他的行为是否相当于买了猪肉市场的期权？


    万维钢


    这是个非常有意思的做法。如果生猪行情不好，价格低于约定价格，保险公司会负责赔偿——大约相当于这位朋友买了一个 put 期权。


    我大概了解了一下，感觉这个保险的流动性还不是很好。有报道说，养殖户只在生猪行情趋势坏的时候大量购买保险，趋势好就不买了，导致保险公司的赔债负担很重，不敢盲目扩大承保规模。如果保险合同随时可以交易，价格不断变动，比如说一个养殖户可以把自己的保险卖给另一个养殖户，保险公司还可以回购，乃至于猪肉收购者也参与进来，那就成了真正的期权了……


    读者 晓源才：


    期权的玩法很多，但是本质上就是“赌”，那么，也就是零和博弈。期权的作用是不是让市场变得更平衡而己呢？


    万维钢


    当一笔金融交易发生的时候，买卖双方对未来的看法并不一定就是相反的。也许我很看好这个期权的前景，但是我是最近需要用钱，所以我决定把它卖了；而你对它的看法其实跟我一样，但是你手里正好有闲钱，所以你决定接手——如果是这样的話，咱们等于是双赢：我赢了现在，你赢了未来。就算是这样，就算咱们对未来的看法不同，自由市场也是值得赞美的：当交易发生的时候，买卖双方都是自愿的，成交价是我们的共识，谁也没有觉得自己在此时刻的*这一笔*交易中是吃亏的一方。至少在达成交易的那一刻，我们都很满意，如果是面对面的话值得握手致意。


    # 来自日课：如果有权特权你应该喜欢什么


    读者 赵苏叶：


    在生活中使用期权的时候，到了交割时间，而且价格也是大涨，但是对方违约，不交付了，怎么办呢？


    万维钢


    这可能就是为什么生活中没有那么多期权交易。信用良好的社会有很多金融红利，不但能让期权之类的东西从不可能变成可能，更重要的是能降低金融产品的价格。


    # 来自日课：纳西姆·塔勒布与魔法石


    读者 夜猫子：


    反脆弱不是越努力越好吗？为什么如果健身是反脆弱，就得时而放松，时而猛练呢？'
  - '[PAGE 1]


    去，这就相当于把一个好运气的利益最大化。


    # 来自日课：现在和未来哪个更重要


    读者 Mr.liu:


    我们什么时候该用 “all in” 思维，什么时候该用期权思维呢？


    万维钢


    从利益冲突和道德角度来说，如果你只是打算用提供一部分风险保险来换取一定的好处，那期权操作就可以；但如果你不满于被动的好处，还想直接插手这个东西的运作，那应该改成持股，成为直接的利益攸关方；而对于像婚姻和执掌权力来说，你还应该all-in。如果你行为可能会给别人带来损失，你就应该跟着一起承担那个损失。


    而从纯粹个人利益出发，什么时候尽可能多保留一些可能性，什么时候专注地投入，这是一个永恒的话题。个人毕竟不是大自然，我们没有那么多时间永远看着事物演化，总要选定一些，自己参与一下。


    ……关于这个话题，我们下周要讲一本 5 月 28 日刚刚出版的新书，叫《范围：为何通才能在专业化的世界中取胜》(Range: Why Generalists
    Triumph in a Specialized World)，讲讲通才和专才的取舍关系，当前世界的技能格局，以及通才的技能策略。


