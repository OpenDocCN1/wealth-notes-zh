    # 美德的 “近敌”


    万维钢 · 精英日课³

    今天


    美德的“近敌”

    08:58 6.16 MB


    结记：“不沙”


    这一讲咱们说一个早已存在但是尚未流行的，而你听一遍就能记住，甚至可能时时回想的概念：近敌。这个词来自佛学，英文是 “near enemy” [1]。


    古代思想家对人类情感的思考和体验比现代普通人要精致和深刻得多。在 “近敌” 这个概念面前，你会发现那些整天只会呼喊 “给和平一个机会”、“让世界充满爱” 的歌手那里是粗俗的人。有了
    “近敌” 这个眼光，你或许学会做一个更高级的思辨。


    佛学中有个概念叫 “四梵住”，代表四种修行者应有的美德。如果你发愿要学佛，你就要终生做到这四个美德，或者说心境。四梵住也叫四无量心、四无量观，大约意思是要把这四种心境无限扩大。


    这四个美德是慈、悲、喜、舍。


    我理解它们共同的意思是要以平等和无我的精神去对待世间的众生。这是非常高的要求，不但不容易做到，而且很容易走偏。美德的 “远敌” 是各种坏的情绪，你很容易识别。而美德的
    “近敌”，则是各种跟美德非常相似的情绪，容易让你混淆。必须学会识别近敌，你才能掌握真正的美德。


    到底什么是 “慈、悲、喜、舍” 呢？各家有各家的解释，但是我觉得英文世界的解释好像比中文世界的解释更有说服力一点。我们专栏以前讲过《为什么佛学是真的》这本书，我们知道现在英文世界有很多对佛学的钻研还是比较有功夫的，而且因为他们去除了佛教中的超自然成分，更容易被现代人接受。鉴于英文佛经是直接从巴利语翻译过来的，也许值得我们参考。下面请允许我以英文版的解释
    [2] 为主，说说这四个美德的意思，特别けど它们的近敌。


    慈（metta，Lovingkindness），意思是n对他人有一颗关爱之心，希望别人好。慈大约相当于现代人说的 “爱”，但是特指那种 “大爱”，也就是孔子说的
    “泛爱众而亲仁” 的那种爱。


    慈的远敌（far enemy），也可以说是反义词，是恨。作为一个修行者你不能仇恨别人，更不能仇恨社会，这没啥可说的。


    慈的近敌，是贪。意思是特别的爱、有条件的爱、自私的爱。


    +   * 没有优先级的效率是效能的近敌

    * 财富是满足感的近敌

    * 数量上的极少是极简主义的近敌

    * 自我量化是自我认识的近敌

    * 引诱是关系的近敌

    * 工具化的哲学是智慧的近敌


    +   * 过分的乐观是希望的近敌

    * 自得感是价值的近敌

    * 没有自由发挥的严格是自控的近敌

    * 不敢与他人靠近是感情独立的近敌

    * 杂乱无章乃至于拖延是创造力的近敌

    * 越过人与人的界限是友善的近敌

    * 过分的理性主义是智慧的近敌……


    一念成佛一念成魔，想要做个真正的好


    一念成佛一念成魔，想要做个真正的好人，那是真不容易啊。


    # 划重点


    慈的近敌，是贪。

    悲的近敌，是可怜。

    喜的近敌，是只为自己人感到快乐。

    舍的近敌，是冷漠。

    一念成佛一念成魔，想要做个真正的好人，那是真不容易啊。


