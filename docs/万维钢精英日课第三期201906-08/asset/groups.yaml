    ## 怎样增加优异数


    万维钢·精算日课³

    今天

    进入课程 ›


    ![](img/b58c3137b911797b913643bab2c018ea_106_0.png)


    这一讲咱们把“正态分布”这个知识给发挥一下，看看你对数学模型能不能活学活用。我们知道世界上很多事物都符合正态分布，包括人的身高和智商、产品的质量等等。下面这张图描绘了一个均值是1，标准差是0.1，总数量也是1的正态分布曲线——


    ![](img/b58c3137b911797b913643bab2c018ea_106_1.png)


    咱们以智商为例。图中横坐标代表智商的高低，越往曲线的左侧智商就越高；纵坐标代表人数，越往上代表人数越多。曲线下方的阴影区域面积就是总人数。


    请注意这三个变量的大小都是可变的，针对具体的问题可以按比例放大或者缩小。

    比如智商的均值是100分，标准差是15分，那么图中横坐标的1.0对应的就是智商100；1.2对应的就是两个标准差之外，也就是智商130；如果你研究的总人数是100万人，那么阴影区的总面积就是100万。


    现在我们最感兴趣的，是我用红色的框标记出来的那个区域，称为“优异区”。它出现在分布曲线右侧的大约达到三个标准差之外的尾巴上，代表统计中最出类拔萃的样本。如果你研究的是人群的智商，这个区域就代表智商最高的人群，他们的智商都在140以上。如果你研究的是一个诗人的作品，这个区域就代表他最高水平产出。


    ### 我们的问题是，如何增加那个区域的面积。


    也就是说，如果你是老师，怎样让你的学生中多出几个聪明人呢？如果你是诗人，怎样才能多写几首好诗呢？如果你是企业家或者投资者，怎样才能多抓住几个出类拔萃的好项目呢？


    怎样增加优异数，这是 有进取心的人最关心的问题，而光凭直觉说我要“努力！奋斗！”那种思维太落后了。正态分布这个数学模型，可以帮你理清思路。


    根据正态分布，你可以影响的其实就是三个变量：总量、标准差和均值。


    ### 1.提高总量


    增加总量是个直观的办法：如果我们把总数增加一倍，优异区的数量自然也会增加一倍。


    比如作为一个专栏作家，我写的文章之中可能有的你感兴趣有的你不感兴趣，但是我什么都写。只要我写的东西足够多，总会有你感兴趣的内容。学生多的老师自然更容易遇到好学生，读书多的人更容易有真知灼见。


    提高总量，是个低效率的笨办法。


    ### 2.提升均值


    提升均值才是解决问题的根本办法。想要理解这一点，请你思考这么一个问题：为啥中国有十四亿人，都找不到十一个足球天才来呢？为啥冰岛只有三十多万人，足球水平却比中国队强那么多呢？


    ![](img/b58c3137b911797b913643bab2c018ea_106_2.png)


    从4个标准差到4.5个标准差，再到5个标准差，曲线纵坐标的落差是以数量级的方式下降的。这也就是说，越是天才就越罕见，而且罕见的程度急剧下降。哪怕你有十四亿人口，真到了代表天才的尾部区域，也没几个人。如果天才总共就没几个人，你就算把人口再增加一倍，也多不了几个人。


    真正有效增加天才的办法，是提高均值。我们看看，如果把全中国人民踢足球的平均水平提高5%，标准差和人口总量都不变，是个什么情形——


    ![](img/b58c3137b911797b913643bab2c018ea_106_3.png)


    ![](img/b58c3137b911797b913643bab2c018ea_106_4.png)


    4.5个标准差之外，面积会有几十倍的差距。均值对优异区的效果比总量的效果要厉害得多。


    > “所谓精神病，就是躺来覆去做同一件事儿，却期待能有不同的结果。”


    ![](img/b58c3137b911797b913643bab2c018ea_106_5.png)


    ### 3.大标准差


    抬高尾部曲线的第三个办法是加大你这个分布的标准差。我们把标准差提高 10%，从 0.1 变成 0.11，就成了下面这个情形 ——


    ![](img/b58c3137b911797b913643bab2c018ea_107_0.png)


    中间普通区的人数变少了一点，而优异区的人数明显增加 ——


    ![](img/b58c3137b911797b913643bab2c018ea_107_1.png)


    对个人来说，扩大标准差意味着你要去尝试一些更极端的事情。比如一个人的工作能力一般，在一个旱涝保收的公司干着，赚钱不多但是很稳定。如果他水平不变又想获得更高的收入，那么冒险加入一家创业公司，是一个办法。当然这么做的缺点是一旦创业不成就会落入曲线左边的尾巴，进入失败区。


    对一群人来说，标准差大意味着这群人的水平参差不齐，有的特别高有的特别低。这里有个著名的学术典故。2005年，哈佛大学校长劳伦斯·萨默斯（Lawrence Summers），就为什么女科学家的
    人数比男性科学家少这个问题，发表了一个私人的看法 [2]。萨默斯说这并不是因为女性的平均智商比男性低，而是因为女性智商分布的标准差比男性小。


    他说的恰恰就是我们这里讲的这个道理。男性的标准差大，所以在优异区有更多男性。而这并不是说男性作为一个整体优于女性，因为在曲线另一侧的尾巴，也是男性多。男性中特别笨的人，也比女性多。


    这纯粹是一个数学性质，但是很多人认为萨默斯这番言论是性别歧视，结果萨默斯就因为这段话而被迫从哈佛校长的位置上辞职了！


    我们这篇文章假设人的能力都是正态分布的，这个假设不一定对。我们的模型能解释为什么中国人多可是中国男足的水平不行，但是解释不了为什么中国没有那么多举世闻名的数学家
    —— 要知道中国人的平均数学水平可是很高的。


    我猜测到了特别高的水平，人的能力其实是幂率分布的：那些能力强的人会有更大的机会和意愿去进一步提升自己的能力，这里有个马太效应。要这么说的话，什么“高考加一门足球”这样的办法其实根本提升不了国家队的水平。


    但是那只是技术细节。我们今天的结论其实对长尾的幂率分布大体上也是成立的。总结来说，要想增加优异区中的数量 ——


    上策，是提升均值。这个方法对优异区的提升非常快，而且没有风险。


    中策，是扩大标准差。这意味着你要冒险去做一些极端的事情。


    下策，是增加总量。这是一个笨办法，效果很差。


    只要想想有多少人还在问“为什么十四亿中国人都找不到十一个会踢球的”，就知道并非所有人都理解今天说的道理。


    以数量取胜非常符合人的直觉。有些年轻人以上大学之前就通读了二十四史为荣，有些家长对孩子的期待是上小学之前认识几千个汉字，有些人四处积累“人脉”。他们犯了和爱新觉罗·弘历一样的错误，以为一只猴子只要不停地打字，就终有一日能打出莎士比亚名句来
    —— 他们大大低估了正态分布曲线尾部下降的速度。


    高手贵精而不贵多。如果你的输出很多可是你的水平还是以前那样，你从未探索新领域，你缺的不是运气。


    ……但是，当你的均值已经高到无法再高，当你把能冒的风险都冒了以后，数量，就是你唯一可以掌控的东西。巴拉巴西在《成功公式》这本书中提出的最后一个定律，恰恰就是要放量。一个人的科研水平二十多岁的时候就已经到顶了，成功科学家和一般科学家的最大区别是成功科学家一辈子都特别勤奋。


    水平够了才配得上比谁敢冒险。水平够了又敢冒险，那就只能比谁勤奋、谁家人多了。


    注释

    [1] 这位博主没有留下名字。他这篇博客文章在 https://putanumon ulterior.com/2015/11/10/003-soccer1/
    后面几张关于印度和挪威人口的图也是他画的。“海德沙龙·翻译组”翻译了此文，在 http://headsalon.org/archives/6560.html

    [2] https://www.theguardian.com/science/2005/jan/18/educationsgendergap.genderissues

    [3] 精英日课第三季，《成功公式》7: 与无常作伴


    ## 问答：创新靠什么驱动？


    万维钢 · 精英日课³

    今天

    进入课程 ›


    问答：创新靠什么驱动？

    12:02 8.27 MB


    |连续：蒋沙|


    ### 来自日课：大国崛起靠什么


    #### 读者 倪元禾, long：


    这种在模型的公式是作者自己思考的结果，是作者觉得技术这个变量特别厉害，人为加的平方；还是大量数据画在图板上，近似得出这样的结果。得来的公式又是如何验证的？总不能和物理定律一样吧……多问一句，物理定律的公式也是这样推的吗？


    万维钢


    任何一个模型的形成，都包括假设、推演和验证这三个阶段。


    假设，是一个比较主观的行为，也可以说是一种艺术。什么因素重要什么因素不重要，保留什么放弃什么，这些选择，你有一定的自由度。但假设可不是绝对的自由，你的选择必须让他人信服才行。


    索洛模型的一个最基本假设和我们在前面说的那个柯布-道格拉斯模型一样，是“单纯的投资对产出是一个边际效应递减的过程”，并且借用了柯布-道格拉斯模型的公式 —


    O = 常数 · √L √K


    你可以找到无数个例子说有这么多真实情况都不符合这个公式！但是你并不能据此就否定这个公式。这是因为对社会科学来说，真实世界不是一个单纯的实验室，真实世界里同时发生了很多事情，有很多很多因素在共同左右经济的增长。作为一个模型，我们关心的是一种比较单纯的、理想化的增长。


    ### 来自日课：传播公式和“引爆点”


    #### 读者 严谊萌：


    微博上那些留言和点赞数的流量明星，算是有效营销吗？


    万维钢


    有个现在已经很有名的社会学家叫邓肯·瓦茨（Duncan J. Watts），做过一个影响很大的实验。在实验室环境中弄一些新歌，让受试者下载。实验发现，如果人为地把一些歌曲的“下载量”这个数字夸调大，受试者就会以为这些歌曲是因为好听才获得了那么多下载，于也是会去下载这些歌曲，结果就真的把这些“运气好”的歌曲送上了排行榜。这个实验说明前期数据造假是有用的。

    '
  mdcn: '

    倍。对美国这种特别有效的市场来说，股市基本反映了国家的经济增长状况，它本质上并不是一个让人实现梦想的地方。


    那到底有没有特别厉害的猎手、能捕捉到罕见的机会呢？难道巴菲特的成功也纯属运气吗？


    ## 3.巴菲特真有水平吗？


    我们知道巴菲特的伯克希尔·哈撒韦公司表现的确很好，从1965年到2014年这50年间，巴菲特有42年打败了市场大盘。如果你当初花了1块钱买了伯克希尔的股票，现在值1万块钱。而与此同时标准普尔指数只涨了23倍。


    像这样的业绩，有没有可能纯粹是因为运气好呢？数学可以帮助你判断。


    我们设想，如果巴菲特是每年在标准普尔的基础上做随机行走，他有50%的可能性打败市场 —— 50年下来，他平均应该打败市场25次，而这个统计的标准差是3.5次。


    可是巴菲特赢了42次 —— 这个成绩，是在四个标准差之外。如果纯粹是运气，这件事发生的可能性是一百万分之一。当然有些彩票中大奖的概率低于一百万分之一，也有人中奖。所以你愿意相信巴菲特是真有水平呢，还是买彩票中了大奖呢？


    我愿意相信巴菲特是真有水平。但是从这件事情中我们也可以看到，想要判断一件事儿是真实的因果驱动的还是随机事件，那是非常困难的。而且别忘了巴菲特并不是操盘手，他喜欢做长期投资。


    到底是信号，还是噪音？


    到底是趋势，还是波动？


    我们的大脑非常善于在没有规律的地方找出规律来，而这也是一种迷信 [2]。数学模型可以让你清醒。模型思维有一个灭high的效果。


    我希望你下一次发现什么重大赚钱机会的时候，能想一想 Facebook 那一年的走势。


    操盘手认为自己的每一个动作都有道理 —— 也许真的有道理。但是因为大家都有道理，涌现出来的结果跟随机实在太像了，能看见的相关性都实在太弱了，以至于根本没有什么大机会，好成绩很大程度上都是好运气。有没有道理不重要，有没有机会才是关键。


    注释

    [1] 精英日课第二季，“有效市场”和做大事的机会 — 最好先读一下这篇文章，充分理解什么叫“有效市场”。

    [2] 精英日课第二季，广义迷信


    ## 内隐学习和外显学习


    万维钢·精英语曰课³

    昨天

    进入专栏 ›


    内隐学习和外显学习

    11:14 7.71 MB

    | 译者：孙夕 |


    这一讲咱们说一个比较前沿的心理学概念，叫“内隐学习”，英文是 implicit learning。内隐学习是“当前科学理解”现在尚未理解的一种学习方式。其实你一直在用这个方式学习，但是你不一定知道。


    为了理解内隐学习这个概念，咱们先说它的反义词，叫“外显学习”，英文是 explicit learning。之所以强调英文是因为“内隐”和“外显”这两个词听起来都有点怪，看英文其实更容易看明白。所以外显学习，其实就是我们熟悉的、正常的学习方式。


    比如要学习一个数学知识，你肯定要先了解相关概念的定义是什么，掌握其中的使用规则是什么。你记住概念和规则，就可以在相应的场景下正确使用。这些知识都是明确的——所以叫“外显”。学校里教的和书本上讲的知识几乎都是外显的。像我这篇文章，也是先用非常明确的方式告诉你我要说的是什么。


    外显学习就如同程序员写程序，说究“先定义、后使用”。这样学习的内容才符合逻辑，才能被理解。


    但外显学习并不是最自然的学习方式。


    你想想一个两岁的小孩子语言是怎么学的。难道你会明确告诉她定义和规则吗？比如为了让她知道“桌子”这个词的意思，难道你会说“孩子你知道吗？桌子就是一个通常为长方形或者圆形的、表面绝对平整、有四条腿或者六条腿、一般用于写字和吃饭的物体”吗？你会教她语法规则吗？你不会的。


    小孩都是在潜移默化中学习语言。她根本说不清桌子的定义是什么，但是当她看见桌子的时候，她知道那是一个桌子。她不懂什么语法规则，但是她能把话说得符合语法；而而且如果你故意说一句不符合语法的{
    }话，她能听出来这句话有毛病。


    这种学习就叫内隐学习。内隐学习是必不可少的学习方式。我们长大以后在学校学外语用的基本上是外显学习法，又是背单词又是记语法，中英对照，学得很生硬。你非得到一个真正的外语环境之中，跟当地人打成一片，慢慢说溜了，才知道各种地道的说法，才会识别不地道的说法，才能体会到那个说不清道不明“语感”。


    不知不觉就会了，会了也说不清楚，这种感觉，你很熟悉吧。


    内隐学习到底是怎么进行的呢？你可能听说过各种民间说法，但是我可以非常负责任地说，目前没有被普遍接受的科学解释。


    小孩是怎么学会语言的？有一种说法认为语言学习有个“窗口期”，在1~3岁。而之所以这时候最适合学语言，是因为幼年大脑的“可塑性”特别高：这时候一学就会，长大了就算若努力，发音也会很生硬。这个解释强调的是硬件。


    但我们专栏还介绍过发展心理学家艾莉森·高普尼克（Alison Gopnik）的解释 [1]，强调的是软件。高普尼克说小孩的学习都是靠猜测和试错，是贝叶斯式的学习，而这个方法对人工智能算法特别有借鉴意义。


    这些说法都有道理，但是它们不能解释，既然儿童这么善于学习，他们学别的为啥不行呢？任何一个辅导过孩子数学的家长都有这样的体会：学说话好像没怎么教就会了，为什么学个二十以内的加减法这么费劲呢？


    现在很多研究内隐学习的研究者认为，内隐学习和外显学习的适用领域是不一样的。


    外显学习，适合规则明确的简单领域。没错，规则明确的领域其实是简单领域。二十以内加减法很简单，而你只要能把规则说明白，操控一个核电站其实也很简单。


    内隐学习，适合没有明确规则的复杂领域。语言是非常复杂的，这就是为什么让人工智能掌握人类的语言那么难。不过复杂并不完全等于困难，只要方法得当，连小孩都能应付一些复杂问题。


    比如说，就绘画而言，印象派、点彩派、野兽派和立体派，到底应该如何区分呢？你单单纯用文字很难明确描述。但是如果把各派的作品都找来一百幅，你一边看一边猜一边请人纠正错误，可能很快就会学会判断了。


    内隐学习的是一种“感”，似乎都是在实践中学。足球教练会阅读比赛，官场老油条善于判断形势，他们不再是孩子了，但是仍然在使用内隐学习。


    “当前科学理解”做事的风格是非常保守的。关于内隐学习，心理学家正在试图书明，它到底是不是一个真的不一样的学习方式。


    有很多猜测，内隐学习和外显学习调用的是大脑的不同部分和不一样的神经网络，这就是为什么小孩学语言比大人快，大人学规则比小孩快。可是你怎么证明呢？咱们体会一下其中的科学方法。


    我看到2019年七月刚刚发表的、威斯康星大学的一项研究 [2,3]，用四种方法测试内隐学习的能力，分别是——


    - * 给若干段由虚构单词组成的句子，让你体会其中的语法结构，然后判断其他句子是否符合这种语法；

    - 观察一些图片导致的结果，判断新的图片会导致什么结果；

    - 观察屏幕上一个飘忽不定的圆圈的落点，判断它的下一个落点区域；

    - 根据反馈，给一个视觉刺激分类。


    研究者首先要证明，内隐学习的确是一种能力，而不是纯属瞎蒙的东西。他们的做法是找一群受试者，先用这四个方法测试一遍，看看到这些人中谁强谁弱；然后过一个星期让他们再来，换一套题再测试一遍。结果发现受试者在这些测试中的表现的确是因人而异，而且两次测试的结果具有相关性。也就是说，第一次表现好的人第二次表现也好。


    这也就说，集中注意力，有可能会妨碍内隐学习。


    这是为什么呢？外显学习的规则是明确的，你肯定得集中注意力才能记住规则。而研究者分析，因为内隐学习的内容都是没有明显规则的，你越是努力寻找规则就越可能钻牛角尖，找到一些根本不是规则的规则；你还不如放松注意力，让头脑开放，直接感受信息，反而更容易领悟那种“感”。


    而这就解释了为什么学龄前儿童善于学语言而不善于学数学。学数学需要集中注意力。人脑负责集中注意力的区域主要是前额叶皮质。这个区域的发育非常缓慢，要一直到青春期以后才能成熟。儿童的前额叶皮质还没有发育好，当然就不善于集中注意力。


    儿童学语言可不是坐在那里认真听讲学会的。他们一边玩着一边学，有时候跟你对话，有时候是偶尔听到你说话。他们是不经意地学，你和他们自己都不知道他们什么时候学的——但他们就是学会了。他们不擅长集中注意力，而注意力恰恰还会妨碍“语感”！


    我们想想自己会的那些东西，是不是其中有一些就是不经意学会的。你是什么时候学会处理复杂人际关系的呢？你是跟谁学的讲笑话的呢？可能都是潜移默化的内隐学习。


    那由此说来，作家看看各种闲书，官员研究研究历史，这些事儿越是不刻意，可能反而效果越好。你想要的不是什么明确规则，而是把握一个说不清道不明的“感”。


    以前我读过一本大概是藤泽秀行写的围棋书，要求年轻棋手要多多地打谱。也就是拿前辈高手的实战棋谱，自己照着一步一步摆出来。那本书说打谱的时候不用想太多，不要停下来琢磨前辈当时为什么要那样走，你只要赶紧从棋谱上找到下一步的落子，能快速把一盘棋摆完就行。


    我当时无法理解为什么要这样打谱。现在想起来，也许打谱是内隐学习：你想要的是“棋感”，所以你不应该想太多。


    注释

    [1] 精英日课第一季, 人工智能, 能婴儿乎?

    [2] Priya B.Kalraa, John D.E.Gabrielib and Amy S.Finn, Evidence of stable inpidual
    differences in implicit learning, Cognition V. 190, Pages 199-211, September 2019.

    [3] Emma Young, Distinct From IQ Or Working Memory, “Implicit Learning Ability”
    Is An Important, Stable Trait That Varies Between Inpiduals, BPS Research Digest,
    July 12, 2019.

    [4] Amy S. Finn, Taraz Lee, Allison Kraus and Carla L. Hudson Kam, When It Hurts
