    你有“企业家基因”吗？有个我们不得不承认的观察，那些成功的企业家，好象有一些天生的素质。


    他们从小就跟一般孩子不太一样。他们喜欢折腾一些学校并不十分支持的事情。我上高中的时候个人电脑刚刚在中国出现，学校里还在教苹果II型上的简易编程，有两个同学就已经开始在家打电脑游戏了。而且他们玩的很专业，会自己折腾硬件，还去参加计算机展览会，和专业人员讨论性能问题。现在这两个人都是企业家。


    里吉尔在《生活黑客》这本书中提到，有些研究认为，企业家小时候的一个共同特点是喜欢去做一些聪明但不完全合法的事情，比如逃课去赌博。当然你也可以说这也是一种社会实践。当好学生们都老老实实地根据学校的指导适应规则的时候，这些年轻的企业家已经在试探规则的边界。


    这大约就是为什么好学生长大以后大多从事了正态分布的工作，而这些不安分的人则选择了幂率分布的项目。


    这真是人生징的一个根本矛盾。要稳定，你就做不成极端的大事业；可是要去极端，你就必须面临风险。这是一个两难选择，没有正确答案。


    那么问题来了。什么样的人愿意老老实实地过日子，什么样的人愿意去做一些冒险的事情呢？企业家的这种风险偏好，是基因决定的吗？


    第一，一个人是否愿意做企业家，这个倾向性，有37%-48%，是由基因决定的。


    第二，善于发现新的商业机会的这个倾向性，也是写在基因里的。


    第三，想当企业家，自己雇佣自己，那你这个业务能不能持续下去？你有没有赚钱的能力，也是遗传的。


    第四，企业家的一些性格特点，像外向、思想开放这些，也都有基因的作用。


    也许基因真有用，但是环境非常有用。


    ![](img/b58c3137b911797b913643bab2c018ea_92_0.png)


    图中说的是平均而言，十次机会之后两人的收入情况。'
