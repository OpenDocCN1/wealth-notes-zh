    ## 《模型思考者》6：股价的走法（基本上）是随机的


    万维钢·精英日课³

    今天


    进入讲堂 >


    《模型思考者》6: 股价的走法 11:29 7.89 MB


    转载：不沙：


    今天我们继续讲斯科特·帕奇的《模型思考者》这本书。这一讲咱们说说数学家眼中的股市。


    我们专栏多次讲过“有效市场”这个概念，如果股市是个有效市场，它就不存在什么靠谱的赚钱机会，股价的所有波动都可以说是没什么意义的。看什么“K线”、什么“突破位”、“阻力位”之类的概念就都沒用……


    那么股市是个有效市场吗？我们要用数学方法来证明这一点。


    ### 1.Facebook 的走势


    下面是 Facebook 的股价从2012年6月到2013年6月的走势图——


    ![](img/b58c3137b911797b913643bab2c018ea_102_0.png)


    我们知道 Facebook 是2012年5月18号上市的，发行价是42美元，而到6月初就跌到了28美元，一年之后，价格是24美元。在这一年里，Facebook的股价经历了各种波动，有大波动也有小波动……那么请问，你能不能以股价评论员的视角，说说这一年中的Facebook都发生了什么？


    我相信一个专业股评人可以从这个走势图中看出很多东西来。他结合当年的四份财报，再参考当时的新闻报道，同时跟市场大盘作对比，对每一次波动都能给出一个解释。他会说这里是阻力位，这里是市场信心不足，这里是触底反弹，这里是上升动能耗尽……


    但是我给股评人再看看下面这张图，其中把同时期的Facebook，和一支虚构的股票做了对比——


    ![](img/b58c3137b911797b913643bab2c018ea_102_1.png)


    如果不说，你完全看不出来图中哪个是真哪个是假——而且请注意，这个假股票的走势图可不是人为故意画出来的，它是完全随机生成的曲线。


    简单地说，我们弄一个正态分布的随机数发生器，它会每次提供一个-1到+1之间的数，正负概率各占50%。如果收到负数，我们就让第二天的股价往下走一下，如果是正的就往上走一下——这就是真正的“随机行走”。请注意随机不等于均匀：尽管向上向下的概率严格相等，随机行走也不会一直原地活动，它也会有连续几天向上或者向下
    的情况，会走出很大的波动。


    我们看到Facebook股价的真实曲线好像跟随机行走没啥根本性的区别。但它们可不只是像。我们有三个证据证明，Facebook这一年的股价波动，几乎就是随机的。


    第一，随机行走中每天往上和往下的概率是一样的。Facebook在这一年 的249个交易日中，有127天是往下走，正好占51%。


    第二，随机行走中今天是往上还是往下，跟昨天的走法应该没有关系。Facebook连续两天上涨或者两天下跌的概率是54%，非常接近于50%这个理论值。


    第三，在一年的时间里，如果是随机行走的话，我们预期最可能的最长连续上涨天数是8天。Facebook的最长连续上涨天数是10天，也是非常接近。


    我们想象一位股评人，看着一张随机行走生成的股价走势图，也会做出各种预测判断——而殊不知第二天是涨是跌完全是随机的。


    那其他股票也是如此吗？


    ### 2.股市是随机的吗？


    一般的股票在比较长的一段时间里，都会有一个上涨或者下降的总趋势。如果经济形势和股票的基本面都很好，它在长期一定会上涨，这不是随机的。但是股市中的日常行为，用所谓的技术分析去搞微操操作，那基本上没意义。


    这体现在，如果我把这长期的总涨幅拉成一条直线，然后把这条直线作为“大势”，从股价波动曲线中减掉，那么剩下的那些涨落，基本上就是随机行走。


    比如我们使用刚才说的第二个判据。美国在1950年代到1980年代这段时间，股市连续两天的走法的确有一点点正相关，比随机行走的情况好一点。可是1980年代以后，连续两天走法都涨或者都跌的可能性就正好是50%了——交易员们从那时候起就已经非常、非常理性了，他们把股市变得非常随机。


    所以现在的股市是个相当有效的市场。当然这里面有个悖论。如果股市真的是绝对有效，股价走向完全随机，那人们就不用分析股市规律了……可是这样的话股市就会变得无效；而如果股市无效，人们就会又愿意来分析它的规律，股价又会变得有效。所以任何一个股市都不可能100%有效，还会有一定
    的规律存在。


    我打个比喻，这就好比说你在森林里打猎。如果这个森林中有很多特别好的猎手，那么猎物一出现就会被他抓住，所以猎物就会越来越少，也会越来越小，越来越不好抓。但你永远都不能说森林里没有猎物，因为如果真的没有猎物，所有的猎手就都走了，走了之后，森林里又会有猎物。


    所以现实是森林里总会有些小小的猎物，股市中总会有一些小小的规律可以让人获利。

