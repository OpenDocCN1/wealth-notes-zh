    # 《范围》2：改造出来的抽象思维


    万维钢·精美日课³

    今天


    进入译程 ›


    《范围》2：改造出来的抽象。 13:03 8.96 MB


    今天咱们继续讲爱泼斯坦的《范围》。后面我们会讲到这本书里的一个观点，说先回答问题再学习，效果会更好。所以我们先来思考一个问题——


    有一种射线，只要以一定的强度照射在肿瘤上，就能把肿瘤给杀死，等于是可以用来治疗癌症。现在问题在于，射线到达肿瘤之前肯定会先接触到患者身体的其他组织，那就是会把好的组织也给杀死。可是指如果把射线强度调低一点，好的组织能不被伤害，可是对肿瘤就没有用了。那有没有一个什么办法，不用做手术开刀，既能让射线杀死肿瘤，又不会伤害其他组织呢？


    我相信咱们专栏的很多读者知道答案。这个问题在1980年代被心理学家拿来做实验的时候，只有10%的人立即想到了解法。如果你没想FJ解法，你先慢慢想，与此同时我给你讲个故事。


    从前有一个将军，要攻打一座城。攻城需要有很多士兵同时发动进攻才好。可是这座城周围的道路都很窄小，并不适合大军通过。这怎么办呢？将军知道通往这座城的道路有很多条，于是他把士兵分散开，以小队的形式从不同的道路出发，按照既定时间一起到达。结果就把城给攻下来了。


    听了这个故事以后，想出前面那个问题解决方案的人数，上升到了30%。万一你还没有明白，我再给你讲个故事。


    从前有个房子着火了，可是消防车来了一看附近没有消防水管，只好发动邻居们到不远处的一个湖中取水。大家有的拿桶有的拿盆，买来一点水就往房子上泼一点，但是效果不太好。这时候消防队长说，你们把水取来先不要动，听我命令大家一起泼水！这招居然好使，火势立即就被压制下去了。


    听了这个故事之后，想出解决方案的人数比例上升到了50%。


    答案是用若干束低强度的射线从不同的方向照射肿瘤。因为射线强度不高，所以不会杀死途中所经过的身体组织；而因为在肿瘤上汇聚的多个射线加起来的强度够高，所以能杀死肿瘤。这个原理就好像用放大镜汇聚太阳光一样……其实这就是现在不少医院使用的“伽马刀”。


    这个答案本身并不重要，我们关心的是寻找答案过程中使用的思维方式。这个方法就是类比。用类比解决问题，是把一个领域的思想，运用到另一个领域中去。


    你专门学过用类比解决问题吗？你应该学，因为这并不容易。


    # 1.苏联往事


    1920到1930年代，苏联在全国范围内搞了个现代化大生产运动。中央政府把工作组派到各个边远地区，建立集体农庄。现在乌兹别克斯坦所在的某些地区，当时还是原始农业，那里的人从来没过过集体的生活，是这场现代化运动中被改造的对象……这个大场面给心理学家提供了一个天然实验。


    当时一个很年轻的苏联心理学家，叫亚历山大·鲁利亚（Alexander Luria），专门对改造前和改造后的当地人做了一系列的测试。我敢说你绝对想不到集体改造对人有下面这样的影响……


    有个测试是，一些羊毛线团，让你按照蓝色、红色和黄色这三种颜色，把这些线团给分类。对现代人来说这非常简单，但是原始农业社会的人就不 윤会做这个分类。比如有的线团是深红色，有的是浅红，在我们看来都是红色；但是在他们眼里，那明明是两个不同的颜色，怎么能分成一类呢？


    再比如几何图形。让你判断一个东西的形状是三角形、正方形还是圆形，你觉得很简单。可是对原始农业社会的人来说，用实线画的正方形和用虚线画的正方形，明显是两个不同的东西！他说实线正方形像是地图，虚线正方形像是手表，地图和手表怎么能分到一起呢？还有空心的圆和实心的圆，他们也无法认同那都是圆形。


    还有一种题是这样的，给你几样东西，让你看看其中哪个东西和其他几个不属于同一类。比如一张照片里有好多个大人和一个孩子，在我们看来显然小孩和大人不是同一类。但他们会说怎么分不对，那个孩子和大人是一家人，你怎么能把一家人分开呢？


    再比如说下面这四种东西：小鸟、步枪、匕首、子弹，我们一看小鸟肯定不是同一类的[1]。而他们说，你要打鸟，就需要用到步枪和子弹，然后你还要用匕首把鸟切开才能吃，这四个东西明显是一起的啊？


    这些原始农业社会的人的一切思维，都是基于自身经验的。而鲁利亚发现，只要经过一点短期的培训，让他们在集体农庄工作一段时间，他们就能迅速掌握现代人的思维方式，就能完成上面说的那些测试题了。


    这就是教育的作用。教育带给我们最基本的能力，就是能思考一些不是来自自身直接经验的东西。学习任何书本知识，你都得能想象一个你身边没有的东西。教给你一个规则，你得能把它用在你没有经历过的的事情上。


    这就是抽象思维。众所周知有个现象叫“弗林效应（Flynn effect）”，说在过去这一百年内，人的智力水平一直在提高，换算成标准智商相当于每十年会提高3分。那这个提高是来自呢？最明显的进步就是抽象思维能力。


    有抽象才有类比。


    # 2.开普勒的类比


    一般人看东西是关注不同点，而高手则善于发现两个很不一样的事物之间的相同点。


    表面上看来，攻城、救火和治疗肿瘤是三个完全不同的领域的事儿，但其实它们背后的思维模型是一样的。世界上的学问从来都不是严格按照学科分类的，跨界的类比有助於你解决难题。


    爱泼斯坦特别举了天文学家开普勒的例子。16世纪末，年輕的开普勒已经接受了哥白尼的日心说，他相信行星是在绕着太阳转动。但开普勒可不是相信就完了，他试图理解这件事情。


    开普勒观测发现，行星距离太阳越远，它的运动速度就越慢。可这是为什么呢？当时î的主流思想，说行星之所以会在天上运动，因为它们背后都有一个小精灵在推着它们走。开普勒不太认同小精灵这种东西，他就想，难道是因为距离远，小精灵的力气就变小了吗？这似乎是小精灵的一个性质。


    开普勒就开始类比，有什么东西是距离越远，强度越弱的呢？他首先想到的是气味和热量。你远離一个东西越近，它的气味和热量就越强，越远就越弱，对吧？那么开普勒就想，是不是太阳发出的光和热，在推动行星运动呢？他否定了这个类比，因为他知道在有日食的时候，太阳的光和热被挡住了一些，可是地球的运动没有任何变化。这说明推动行星的应该是某种具有穿透性的东西。


    当时正好有人在研究磁力，磁力是有穿透性的，那是不是磁力呢？如果是磁力，那为什么只有吸引没有排斥的现象呢？开普勒还设想了也许宇宙空间中遍布着某种“水流”，以太阳为核心形成了一个漩涡，而行星是在漩涡中旋转，但是细想也不对。


    最后开普勒判断，一定是太阳对行星有一种牵引的力量，而且行星越大，那个牵引的力量就越强。而且他还正确地推断出，地球之上所以会有潮汐现象，就是因為月亮对地球上的水的牵引力……


    请注意当时的人没有“万有引力”的概念，牛顿的学说要等到将近一百百年后才出来。开普勒获得这样的见识，仅仅是通过类比！


    # 3.类比的入门和精通


    苏联农民看不到深红和浅红的共同点，而开普勒却能把日常生活中的事儿类比到遥远的星体上去。心理学家认为，跟开普勒相比，普通人的类比能力并不比苏联农民高很多。


    比如下下面这六件事情，你能不能把它们给分类——


    +   1. 经济泡沫

    2. 北极冰川融化'
  - '[PAGE 5]


    +   2. 北极冰川融化

    3. 美联储调节利率

    4. 人的身体出汗

    5. 不同的商品相继涨价

    6. 大脑指挥身体做动作


    对美国西北大学的学生测试表明，如果是按照学科分，所有学生都能分的很好，我们都知道 1、3、5 是经济学问题，4、6 是生理问题，2 是自然环境问题。但要ا是按照这些事情的内部机制分类，就只有少数有跨界学习经历的学生能分好。


    事实上 1 和 2 都是正反馈现象（买东西的人越多经济越好，经济越好买东西的人越多；冰川越融化吸收阳光越多，吸收阳光越多冰川越融化），3 和 4 都是负反馈现象（美联储降息防止经济过热；皮肤出汗防止身体过热），5
    和 6 都是连锁信号传递（石油涨价导致日用品涨价；大脑神经信号传递到四肢）。


    能看出这种深层思维结构，才谈得上举一反三。但是一般大学生没有这个水平，他们就好像那些苏联农民只知道自己亲身经历的事情一样，只理解自己专业的哪一点知识。


    而哪怕是本专业的事儿，换个没见过的议题他们也不知道该怎么办。有人拿学习国际关系的大学生做了个实验，说假设现在有个跟美国友好的国家遭到了敌国的入侵，请问美国应该如何应对。实验人员把学生被分成两组，给他们分别提供一个美国历史上遇到类似事情的做法，并且说明这仅供参考。


    结果，如果学生拿到的参考事例是罗斯福当初的做法 —— 美国为了盟友而开战 —— 他们给的建议就是开战。而如果学生拿到的参考事例是越南战争，他们的建议就是把相关人员撤离就行。他们服从了自己遇到的第一个类比。


    类比思维的规律是，你能想到的类比越多，你的判断就会越准确；你能想到的类比越遥远，你出的主意就会越有创造性。


    那些最有创造性的科研小组，成员都是来自多个不同领域，一开组会分析问题总能奇计百出火花四射，总能从各个临近领域借鉴解决方法。而那些创造力最弱的组，则都是由经过相同训练培养出来的人组成。


    现在学科越分越细，我感觉能称得上是“大人物”的科学家越来越少了，剩下的都只能算是“科研工作者”，大部分人只知道自己做的那一点点事情。但是能跨领域思考、有高级类比思维的人仍然存在。


    有研究说，一般科研工作者的业余爱好水平跟普通老百姓没啥区别。但是学术水平越高的科学家，就越有可能在学术工作之外发展个什么业余爱好 —— 而诺贝尔奖得主有诸如演员、舞蹈家或者魔术师之类业余爱好的可能性，比一般科研工作者要高……22倍。


    诺贝尔奖得主不是靠什么从小养成的“坚毅力”得奖的。说到这里再想想那些一门心思就练一个手艺的人，你是不是觉得有的人比他们更值得我们佩服。


    注释

    [1] 如果你非要抬杠的话，原始农业社会的人说的也不是没有道理，因为正如我们以前讲过的“刁小鸭定理”所说的，一切分类都是主观的……但是现代生活不能没有分类，不能不会众所周知的简单分类。


