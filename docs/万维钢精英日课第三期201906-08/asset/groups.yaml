    # 如何理解西方？（下）


    万维钢·精英日课³

    今天

    进入课程 ›


    如何理解西方？(下)

    11:56 8.2 MB


    综述：万少 |


    很多年以前，中国的国际地位还远不如现在的时候，有些国家会不顾中国政府反对，去跟台湾建立“外交关系”。有一次又有有一个小国，大概是为了获得经济援助，跟台湾建交，中国不得不与之断交。


    那时候我还小，我记得当时报纸上发表了评论，其中有一句话台当局的话，让我记忆犹新——


    > “以利得之，必以利失之。”


    这句话的意思是光靠花钱是交不到真朋友的。道理我们都懂，不过今天最有钱的是我们，所以我们更喜欢英国首相帕麦斯顿说过，又被丘吉尔引用过的那句话：“没有永恒的朋友，也没有永恒的敌人，只有永恒的利益”。


    我想说的是咱们中国那句话是对的，丘吉尔他们这句话是错的。历史人物会在各种场合说各种话，有时候是为了自己的错误辩解，有时候只是随心感慨人生，他们说的不一定是历史定律。美国和英国、美国和日本的关系，跟俄罗斯和英国、俄罗斯和日本的关系非常不一样，这个不一样不仅仅是金钱数量的问题。利益是很重要，但是要想让人类相信跟你有长久的共同利益，让人不至于为了短期利益而背叛你，让人在你困难的时候仍然相信你，特别是在你跟人发生冲突的时候站在你这一边，你需要做的不仅仅是今晚的酒席买单。


    你需要文化输出。


    我们应该向西方输出什么样的中国文化呢？


    # 1.风俗不是文化


    什么是中国文化？我看很多人把中餐、武术、舞狮子舞龙、春节、鞭炮、中国字，“中国结”——一种绳艺——甚至所谓“中国红”——一种红色——当做中国文化，但是那些只能叫风俗。


    风俗没有深度交流的价值，因为每个国家的人都认为自己的风俗是最好的。很多人以为全世界人民都热爱中餐，其实根本不是。如果排除中国人口世界第一这个关键因素，中餐在国外的表现可以说是相当一般。


    著名数据预测网站 538，曾经在 2014 年举办过一次“各国食物世界杯” [1]，用民意调查的方式判断美国人最喜欢吃哪国菜——我们容易理解美国菜会胜出，但这个调查的有价值之处在于美国到处都有世界各国风格的餐馆。结果中餐不敌法国，以小组第二身份进入十六强，然后赢巴拿马，止步八强……


    ![](img/b58c3137b911797b913643bab2c018ea_56_0.png)


    这个道理是我们应该分清“喜好”和“实力”。我喜欢打乒乓球，这不等于我擅长打乒乓球，更不等于乒乓球是世界第一运动，而且不等于不爱打乒乓球的人都沒品位。喜欢打乒乓球只是我小时候上学的那個学校的1个风俗而已。


    很多人认为中国风俗在全世界被人仰慕，其实真不是。中国武术是表演性质的项目，全靠以前的香港武打片走向世界。武术没有搏击价值，武术运动在国外的流行程度还不如韩国的跆拳道。而且，武术电影不是主流电影。


    每逢春节的时候，世界各国政要都要祝贺一下中国新年。但是请注意，这是因为现在中国的面子大，不是因为春节这个习俗已经深入各国人心。意大利人的复活节和犹太人的几个节日更有行动上的影响力。


    可能我说的这些你全都不同意，你认为民族的就是世界的，中国风俗就是世界第一——行，可是请问，我们真的有必要为这些东西而感到自豪吗？


    如果食物值得让人自豪，那汉堡和炸鸡这些快餐怎么算？如果发明武术值得自豪，那篮球排球这些体育运动怎么算？如果节日值得自豪……别忘了我们的五一劳动节和六一儿童节都是别国发明的。


    如果这些东西也值得吹嘘，那美国人得吹嘘到什么程度。


    # 2.历史是本地文化


    中国人有超强的历史自信，中国历史的确值得自信。中国从大约商周帝王开始到大约清乾隆年间，经济实力是毋庸置疑的世界第一。中国诸子百家的经典，的确是高端文化，值得世界人民学习。


    我们的确是个伟大的文明，但公平地说，我们不是“The 伟大文明”——我们不是唯一的一个伟大文明。而且我们吹嘘中国历史的时候，往往吹嘘的不是地方。


    中国可考证的历史，满打满算大约四千多年。而在六千多年以前，美索不达米亚平原上已经出现了城市和城邦国家；五千多年前的古埃及已经有非常复杂的国家政治……那时候的中国还处于神话传说时代。要论最古老，法国和西班牙发现的史前岩洞里有非常高超的绘画艺术，而那个文化距今超过一万年。所以“古老”没啥意思。埃及文明比我们古老，我们跟埃及人做生意也不用给他20%的优惠。


    “根正苗红”不应该是一个现代人自信的来源。很多人至今不愿意接受我们中国人跟世界各国的“智人”都起源于非洲这个科学判断，非得想办法证明中国人就是从中国独立起源的——可是这有什么意义呢？是中国这块土地有神性吗？


    《孙子兵法》不是被世界各国战略家和企业家深入学习的伟大智慧，正如雷锋的故事没有进入西点军校的教材。西方的确有很多高水平的汉学家，我私下认为他们的水平比中国学者还高——但是，“汉学”并没有进入世界各国主流文化。有时候人们会引用一两句孔子、老子或者孙子的话，而那些话常常不是中国经典里他们本人说的。他们只是提供了一个有智慧的、异国情调的形象，有一种小众的高级感。


    如果非要比历史，那我认为最令人难堪的就是现代科学和工业革命都没有发生在中国。我们的祖上屡害过，但没有*那么*屡害。


    进入近代，中国更有一段非常屈辱的历史。这段历史创伤给我们带来了无比强烈的复兴愿望，所以我们绝对应该铭记——但是，我们这个“复兴者”情结，恐怕是其他国家的国民所不容易理解的。


    这就好比说，一个村子里的孩子总在一起玩，其中有一个孩子，平时不怎么合群，玩的东西也不时尚。你一跟他深入聊，他就说我家祖上曾经是村里的首富，可是后来败落了，所以我现在没时间跟你们玩没用的，我要努力复兴！请问你对他有安全感吗？你是不是有点担心他憋个大招要对付你呢？


    历史是宝贵的财富，但是是我们自己的宝贵财富。你对古罗马历史未必有多大兴趣，别人对你的历史也未必有那么大的兴趣。


    让人类愿意按照你的想法去做事，那才叫高水平文化输出。


    # 3.中国文化厝在哪


    好的文化应该是现时代意义的文化，如果你自己都不用，你不应该指望别人用。好的文化应该是普适意义的文化，应该既适合我们用，也适合全世界人民用。好的文化，应该是谁不会用谁就吃亏的文化。


    中国有没有这样的文化？真有。中国有非常高端文化基因，绝非什么吃饺子放鞭炮那些风俗可比。但是要想看出这些基因，你有时候的跳出中国视角，换个西方视角才行。


    # 一个是全局思维。我们知道西方是个个人主义，看东西就只看这个东西；而咱们中国人看东西总是要看它所处的环境，看它和周围事物的关系。中国人复杂的社会国际关系会让西方人感到难以理解，但这不是缺点，而是艺术。


    像曾国藩这样的中国人办事情，会给各方都留有良好的交代。萨拉热窝事件之后如果让中国人在各国间调停，第一次世界大战可能不会爆发。《凡尔赛条约》如果让中国……


    可能不会爆发。《凡尔赛条约》如果让中国人主持制定，第二次世界大战也许可以避免。


    现代世界要解决复杂的全球事务，中式全局思维，值得你拥有。


    # 一个是实用主义。中国人没有多少宗教情结，不爱较真，这固然让我们错过了现代科学，没出什么有名的现代哲学家，但是也能让我们避免特别极端的错误。


    走极端不是传统中国思维。传统中国精英的思想是比较开放的，百家争鸣，唯才是举，并不要求所有人都一个想法。当中国人不计较什么这思想那思想，不为某种意识形态钻牛角尖的时候，往往是中国闷声发大财的时候。实用主义让中国人充满乐观的情绪。


    在意识形态上和稀泥，唯独在赚钱这件事儿上认真的中国人，更容易跟世界各国民达成共识。


    有个专门研究中国的欧洲学者，中文名叫吉博明（Diego Gilardoni），还提出了一个特别有意思的视角 [2]。


    中国人特别擅长把看上去矛盾的、对立的东西综合起来看待。对西方人来说，对就是对，跟对的相反的就必定是错的 —— 但是中国人讲 “阴中有阳阳中有阴”，相反的两个东西可以共存。


    如果你认为这个制度就是好，那你为啥要搞 “一国两制” 呢？中国人就这么厉害，一国两制是大智慧。


    中国人能从坏事中看到好事，所谓 “塞翁失马焉知非福”。中国人还能从 “危” 中看到 “机”。如果中国人是一台电脑，它永远都不会死机。中国人的这种能力，再加上全局思维和实用主义，你说是不是特别适合解决复杂和棘手的问题呢？


    中国人还能从长远考虑问题，动不动就弄个什么 “百年大计” —— 而西方领导人通常只考虑自己任期之内的事情。中国人的执行力强，说干什么事儿就干了。中国人喜欢新东西，高科技不是最新的不干。中国人重视学习和教育，你这个东西要是真好中国人就真学。中国人不讲家庭出身，阶级意识比较淡化……


    这些，才是现在很多外国人羡慕中国的原因。


    那既然中式思维这么厉害，为什么近代中国落后了呢？这也许是对环境的适应问题。同样的思维方式，不适用于工业革命时期的简单问题，也许偏偏适用于未来世界的复杂问题。但这也许是因为我们并没有一直坚持这些高级思维。几代中国人曾经陷入过偏见、愚昧和盲目自大，今天也未必有多少中国精英真有能力扛起中式思维这些高级工具去解决世界的问题。


    而有一个开放的心态，能跟西方平等打交道，虚心交流，诚意合作，是施展这些思维的前提。


    总结来说，我认为和西方人打交道，我们应该多讲高级文化，少讲风俗自豪感；多讲未来、少讲历史；多讲合作共赢，少讲我要复兴；多讲问题，少讲主义 —— 但是也得讲思想，而不能只讲利益。


    注释

    [1] Nate Silver and Walt Hickey, What is Americans’ Favorite Global Cuisine? JUL.
    25, 2014, fivethirtyeight.com

    [2] Diego Gilardoni, Learning from China: three lessons for the ignorant West,
    SCMP.COM, 1 Sep, 2017.


    ![](img/b58c3137b911797b913643bab2c018ea_57_0.png)


    # 特别放送：极简西方思想史


    万维钢 · 精英日课³

    今天

    进入课程 ›


    特别放送：极简西方思想史

    00:34 396.48 KB


    万维钢


    今天我们来把《历史的正确一侧》这本书，帮你做个总结讲座。西方文明是怎么强大起来的？西方的道统到底是什么？它的宗教基因、文化传承、价值观的主干和分支都是怎样的？希望今天的串讲能帮你梳理得更清晰，理解了这套体系，对于如何站在西方的角度理解西方，会更有启发。


    # ★整个西方文明的思想，是建立在两个支柱之上


    一个支柱来自耶路撒冷，也就是犹太教和基督教。


    > 《旧约》明确提出，“上帝照着自己的形象造人”。


    - 1. 人人平等。

    - 2. 活着的目的：人生就是要完善自我。


    # 提供意义：意义带来人生的目的。


    另一个支柱是雅典：古希腊的科学家和哲学先贤


    理性：人应该通过理性去探索、研究和改造这个世界。


    # 提供理性，理性带来达到人生目的的能力。


    # ★从这两个支柱出发，可以推导出几个推论


    第一，人生在世不不仅仅有物质的追求，还有道德义务。你要做个更好的人，你要有道德，本质上并不是因为这么做对你有什么好处，而是因为你有一个更高的目标，那就是接近上帝。


    第二，大家都是用上帝的形象造出来的，所以除了上帝之外，没有别的权威。每个人如何接近上帝，那是个人的事情，而不是君主的事情。


    第三，用科学理解世界，用技术改造世界，这些事儿你不但可以做，而且应该做。科技来自理性。


    # ★耶路撒冷的一种论给人类的认知升级


    世界有规律，个人有自由，历史有方向，这就是耶路撒冷带给西方文明的进步基因。


    世界有规律：世界是有规则的，而且上帝本人也得遵守那些规则。


    个人有自由：你有神性，你应该完善自我，去模仿上帝。这就说明人不但有价值，而且还是自由的。这表现在你有自由意志，你有选择权。


    历史有方向：历史前進的方向則是讓人完善自我，最终让所有人都能接近上帝。


    # ★雅典的修炼系统给人提供升级方法


    目的论：人应该从自然法则中寻找人生的目的，也就是 “telos”——也就是运用理性——运用理性去识别世间万事万物的 telos，去思考和判断——如果一个东西能很好地完成自己的
    telos，就认为它具有美德（virtue）。


    雅典哲学家因为有了目的论，就建立了一个修炼系统——无上限地完善自我。


    ☆柏拉图：世界有一套统一的理性系统，而这套系统完美地映射到了人的头脑之中。宇宙是数学的，而数学是人可以单凭逻辑推理就推导出来的东西。柏拉图的主要修炼方法是思辨。


    政治主张：“理想国”是个等级森严的系统。国家的权力应该是一个严格的自上而下的系统：按照理性修炼的等级，最上层是哲学家，中间是战士，底层是普通劳动者。


