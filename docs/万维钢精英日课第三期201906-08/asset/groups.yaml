    # 《模型思考者》3：三种分布模型


    万维钢 · 精英日课³ 今天


    《模型思考者》3：三种分布。12:06 8.31 MB


    这里是斯科特·佩奇的《模型思考者》这本书的第三节，咱俩讲三个特别常用的统计模型，分别是“正态分布”、“对数正态分布”和“幂率分布”。


    # 1.正态分布


    咱俩先回到上一讲说的那个开餐馆的事儿。如果你的餐馆事业已经比较稳定了，你不会太担心顾客流量的波动。这种情况，就是正态分布。


    ![](img/b58c3137b911797b913643bab2c018ea_90_0.png)


    曲线的横坐标代表每天来的人数，纵坐标代表在比如说一个季度之中，来这么多人的时候有多少天。图中标记了正态分布的两个重要概念：平均值（μ），和标准差（σ）。


    # 2.对数正态分布


    ![](img/b58c3137b911797b913643bab2c018ea_90_1.png)


    它有一个比较长的尾巴。这意味着其中发生极端事件的可能性比正态分布高很多。


    # 3.幂率分布


    ![](img/b58c3137b911797b913643bab2c018ea_90_2.png)


    幂率分布的“长尾”，比对数正态分布更长——


    ![](img/b58c3137b911797b913643bab2c018ea_91_0.png)


    这意味着幂率分布中会有大量的极端事件。


    幂率分布是*不独立*的随机变量作用的结果。科学家找到了很多个能带来幂率分布的模型，咱俩这里说其中最常见的两个。


    # 第一个模型是“马太效应”。


    比如你去书店买书，那么多本书选哪本呢？你会优先关注那些上了排行榜的“畅销书”。这是人之常情，但是这对那些没上榜的书是不公平的——这等于说越畅销的书就会越容易被关注，而越容易被关注就让它进一步更畅销。这就成了一个富者愈富的局面。幂率分布使得图书市场中会出现少量特别畅销的书，而绝大多数书的销售成绩都很差。


    而这一切都是因为你做决定的时候是在模仿别人。你看到别人都买这本书，所以你才关注它。你的买书行为不是独立的。


    明星的粉丝数量、公司的大小、城市的大小，都是幂率分布。比如一个城市越大，其中人与人的互动就越多，就业机会和创新机会也会越多，就越能吸引到新人的加入。这就是为什么中国有那么多的超大城市。当然每个幂率分布中的那个幂率参数不见得是一样的，但是这一讲我们不关心具体的数学，只关心数学感。


    如果一个局面中有很多极端事件，我们基本上可以猜测它满足某种某种幂率分布。 偶奇做了个计算，说如果美国人的身高是幂率分布的，全美国就会至少有一个人比帝国大厦还要高，而且有一万人会比长颈鹿高……这就是幂率分布的威力。


    # 另一种幂率分布模型来自于复杂系统的“自组织”现象。


    一个系统在变大、变复杂的过程中，它的各个部分互相依赖的程度将会增加。到了一个临界点，因为互相关联实在太紧密了，一部分出个小问题就会导致整个系统出大问题，那就是雪崩式的灾难。


    核电站的安全性、地震、森林大火，这些事情中包含自组织，各个部分之间会有复杂的联动。而我们说过，所谓蝴蝶效应，罪过不在蝴蝶，恰恰就是因为系统中的复杂联动。这些系统可能平时什么事儿都没有，但是其中蕴含着大灾难的可能性。


    可能一个地区每天都发生一万次以上的小地震，影响微不足道，但是你考虑到地震是幂率分布的事件，就必须对大地震做好防灾准备。


    总而言之，如果这个事件代表多个独立随机变量之和，它就满足正态分布，你不用担心会有什么极端的情况发生。如果一个事件是独立随机变量的乘积，那就是对数正态分布，其中会有一些比较极端、但不是那么极端的事情发生。而如果一个事件中的随机变量不是互相独立的，有互相模仿或者达成了紧密的关联，那你就必须做好应对极端情况的准备。


    如果你是一个管理者，这个数学感会让你希望建立一个“原子化”的组织。其中的个体都独立决定，不要互相模仿、不要有什么民间组织和派系，实现正态分布。这意味着你要打压那些所谓一呼百应的“社会凝结核”，你要把坏消息的传播控制在最低限度。


    而作为个体，也许幂率分布对你有某种诱惑……咱们会专门说说这个。


    # 划重点


    +   1. 如果这个事件代表多个独立随机变量之和，它就满足正态分布，你不用担心会有什么极端的情况发生。 2. 如果一个事件是独立随机变量的乘积，那就是对数正态分布，其中会有一些比较极端、但不是那么极端的事情发生。
    3. 如果一个事件中的随机变量不是互相独立的，有互相模仿或者达成了紧密的关联，那你就必须做好应对极端情况的准备。


    注释 [1] 精英日课第二季，标准差和人生哲学 [2] 精英日课第三季，蝴蝶无效应安全有小事 [3] 而且特别好的一点是，那些用来相加的变量本身是不是正态分布都可以，只要互相独立，它们的和就是正态分布。


