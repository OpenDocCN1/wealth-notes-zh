    # 日课精选


    [PAGE 16]


    # 《范围》6：深度对广度


    万维钢·精英日课³

    今天

    进入课程＞


    《范围》6: 深度对广度

    13:14 9.1 MB


    [乔姆斯基注释：沙沙]


    今天我们继续讲戴维·爱泼斯坦的《范围》。这一讲的主题是专才和通才在创新方面的比较。咱们先从漫画说起。


    漫画是一个成熟的行业，美国有几百家漫画公司和出版社，像 DC 和漫威都是我们很熟悉的。因为这个行业特別繁荣，经济学家就可以从中做些研究。比如经济学家可以通过销量和影视改编的情况，测量一本漫画书的价值有多大，然后可以评估每个作者的创造水平。


    我还是先请你猜一猜。请问在以下这些因素之中，哪些跟漫画作品的价值在正相关？


    - 1. 作者是不是一个高产的作者，他出书的速度快不快；

    - 2. 作者的经验如何，他在漫画行业积累了多少年；

    - 3. 这本漫画是由单个作者完成的，还是由一个团队集体创作完成的。


    如果漫画是个熟练工种，特别高产又有多年经验的作者经过了那么多的练习，肯定水平更高……但事实不是这样。事实是一本漫画书的价值和作者的高产度是负相关的关系，和作者的经验则没有相关性——也就是说，那些出书频率特别快的作者出的书反而一般，而书的好坏和作者是新人还是老手也无关。


    那最有用的因素是什么呢？是作者涉猎的广度。研究者把漫画分成了二十多个类型，包括喜剧、犯罪、奇幻、科幻、非虚构、成人类等等，结果发现，一个漫画作者涉足的类型越多，他出一本书的价值就越高。而如果一个作家曾经出版过至少四个类型的漫画，他就比那些工业化集体创作的团队更有创造力。


    如此说来，漫画作家的创造力由广度决定。你是生手还是老手都无关紧要，但你最好是个多面手，而不是一个熟手。


    ## 那这是一个普遍规律吗？


    ## 1.遥远的连接


    我们专栏多次说过，所谓创新，就是想法的连接。就好像有性繁殖一样，新东西是几个现有的东西连接在一起创造出来的。连接越遥远，创新就越新颖。


    比如有个著名的众包网站叫 InnoCentive。如果你们公司有个什么技术问题无法自己内部解决，你可以把问题放到 InnoCentive 上去搞个悬赏。不管是谁，只要第一个解决了这个问题，他就可以得到你们出的一等奖金，通常是几千到几万美元。


    上了 InnoCentive 的问题大约有 1/3 都能最终得到解决。有意思的是，解决问题的人，往往不是出题人所在的那个细分领域中的人。问题往往是被外人、用一个充满偶然的思路给解决的。


    比如说怎么解决因为油轮泄漏产生的海上石油污染问题？是一位化学家，本身并不是研究石油的，曾偶然看到工地施工，发现工人們用一个搅拌器一直搅动水泥去防止水泥凝固，他从这里获得启发，提出方案，结果就真的把问题解决了。还有一个化学问题是被一个律师解决了——这是一个专利律师，看过很多化学方面的专利，想到另一个领域的技術好像可以用於这个问题，结果真好使。


    人们研究认为，InnoCentive 上的问题解决，往往越是外来的方案越好。


    爱泼斯坦还提到一个网站叫 Kaggle，相当于机器学习界的 InnoCentive。在 Kaggle 解决問題排名第一的人，是来自中国长沙的 Dai Shubin
    [1]。这个 Dai Shubin 的本职工作是“专为银行提供数据处理和分析解决方案”，但是他在 Kaggle 解决了很多诸如“如何用卫星数据判断亚马孙雨林的流失到底是自然原因还是人为原因导致”这种问题。Dai
    Shubin 在访谈中说，“我不认为我的专业领域知识发挥了极大作用”，因为“想要简单地通过使用成熟的方法赢得比赛非常困难，特别是在深度学习比赛中，因此我们需要更多创造性的解决方案……”


    那你可能会说，这些是不是幸存者偏差呢？凡是贴在 InnoCentive 和 Kaggle 上的问题，都是自己专业解决了才贴出来的，那自然就容易被别人解决！有没有一个更公平的研究，看看专才和通才的创新能力到底哪个强。


    还真有。


    ## 2.什么人最有创造力


    美国 3M 公司的业务非常广，产品从工业粘合剂到医疗设备到家用电子无所不包，它拥有各个领域的很多专利。研究者从 3M 公司的专利数据中，发现了创新人才的秘密。


    美国专利局把所有专利分成了 450 个类型，经济学家根据每个人申请专利类型的记录，就可以看到他是那种人才。


    专才（specialist）的做法是在一个领域中深耕，他的专利申请记录高度集中于某个类型。而通才（generalist），则是讲求广度，他在很多类型中都有专利，但是并不深入到任何一个特别的类型中去。


    研究者取得了 3M 公司的内部记录，能够评估每个专利带给公司的价值。结果发现专才和通才的专利水平可以说是平分伯仲，他们都不是最强的人才。


    3M 公司有个奖励创新的“卡尔顿奖（Carlton Award）”，相当于公司内部的诺贝尔奖。那么样的人最能获得这个奖呢？我们可以称之为“全才（polymath）”。


    全才的特点是，他有一个自己的核心领域，在这个领域中钻研比较深，比通才深但没有专才那么深。但是全才不仅仅专注于这一个领域，他能够把核心领域中的技能运用到邻近的领域中去。他通过这样的方式能不断学习新东西，以至于最后全才涉猎的广度甚至超过了通才。全才往往可以纵横几十个专利类型！全才的创造力是最强的。


    什么样的人最能创新？我们的结论是你钻研得特别深也行，或者特别广也行，最好是既深又广……最怕的就是既做不到深，也做不到广。


    研究者还统计了这几种人才贡献度的演变情况。从二战结束后开始的总体趋势是专才的重要性越来越强，世界的确是变得越来越专业化……但是专才的重要性在1985年就到顶了，然后剧烈下跌。通才和全才越来越重要。


    此后专才的作用保持了一段平稳期，但是2007年之后，又开始下降。研究者分析这很可能就是因为现在有了互联网，专业知识越来越容易被人得到，专才的稀缺性进一步下降了。


    所以现在这个世界恐怕是通才已经压过了专才。而专才更严重的问题在于他们擅长的领域都是比较狭窄的，这种方向的不确定性比较低。那么结果就是竞争很激烈，而且如果你取得突破，别人会马上学过去。


    那通才是怎么工作的呢？咱们再举一个例子，说说游戏公司任天堂。


    ## 3.任天堂的故事


    任天堂原本是个在日本卖花札纸牌的公司，这是一种赌博用的纸牌，任天堂靠享有专营权赚钱。到上世纪五六十年代，人们都不玩花札纸牌了，任天堂不得不用积累的资金探索新的业务。公司在1965年雇佣了一个电子工程师，叫横井军平。


    横井军平没去大公司大概是因为学业成绩一般。不过他的业余爱好特别多，会弹钢琴、喜欢音乐、跳舞、潜水和玩具火车。当时任天堂也没有什么电子项目，横井军平只是负责一些最简单的机械维护，非常清闲。穷极无聊之下，横井军平做了一个能够伸缩的机械手，自己拿着夹东西玩……


    结果被老板发现了。老板说你能不能把它做成一个玩具呢？这就是横井军平的第一个爆款产品，叫“超杀怪手”，卖了120万份。任天堂就此转为玩具公司，横井军平就是公司的研发负责人。任天堂公司发现，横井军平是个有哲学思想的人。


    一般的玩具公司都是追求使用最新的电子技术，而横井军平的理念却是把那些已经成熟的、甚至是过时的技术拿过来，便宜可靠，组合在一起变成一个让你意想不到的新玩具。横井军平的主要竞争优势是他头脑里的奇思妙想。


    头脑里的奇思妙想。


    比如他有个发明叫做“爱情测试机”……其实就是一个能读取电流强度的电表。两个人手拉手形成一个闭环，爱情测试机根据穿过两个人身体的电流的强弱给一个读数，说明这俩人有没有“心电感应”——其实是由手上出多少汗决定的。爱情测试机流行一时，男女老幼都爱玩。


    再比如说，当时无线电控制的玩具汽车很流行，但是价格非常贵。贵就贵在上面的无线电装置。横井军平发明了一款玩具汽车，只用最简化的无线电操控，以至于车轮只能左转——但是他把它弄成了一个绕着圈跑的赛车，会左转就够了。孩子们玩起来还挺顺手，而价格只有一般无线电玩具汽车的十分之一。


    有一次横井军平坐火车，看见邻座有个人穷极无聊，在那按计算器玩。他就突发奇想，说为什么没有一个可以装在口袋里的游戏机呢？他回去就说服了老板，找夏普公司合作，要用计算器技术开发一个掌上游戏机！


    计算器在最辉煌的时候，曾经卖过两三百美元一台。可是当时那个时候已经不行了，越来越便宜，利润很低，夏普正在发愁呢，双方一拍即合。一切技术都是现成的，液晶显示屏、计算系统都很便宜。这就是第一台手持式游戏机，大获成功。


    这个产品最终发展成了著名的 Gameboy。在 Gameboy 的时代，市场上出现了一些高端的掌上游戏机，有彩色的显示屏，但是都打不过只有黑白液晶屏的 Gameboy。按照横井军平的哲学，Gameboy
    价格便宜、结实摔不坏，进水了晾干还能用，装上AA电池能玩好多天，非常适合中小学生——横井军平知道这些人才是玩游戏机的主力。


    横井军平 1997 年不幸死于车祸，他的哲学一直影响任天堂到今天。比如 Wii 这个游戏机，分辨率远低于竞争对手，但是它是第一个把原本是汽车用的加速度计和陀螺仪用在手柄上的游戏机，结果是连英国女王都玩。


    说到这里我就想，咱们中国有任天堂吗？有横井军平吗？我们有多少全才或者通才式的创新人物呢？我们有没有“有中国特色的”创新哲学呢？


    爱泼斯坦书中提到一个研究说，除了投入最低的那些公司之外，一个公司在研发上投入的资金多少，和创新水平之间的关系并不大。


    创新并不仅仅来自更快、更高、更强的硬件，更是来自于人的思想。


