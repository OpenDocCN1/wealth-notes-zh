    3. 把理性科学，也当做是专制压迫的手段。


    这是当前美国社会的重大矛盾。族群身份，已经成了某些人的人生意义。


    思想，超越英雄和王朝。各路思想在千年的历史中交锋、融合和转变，就如同神力的修练和过招。有些人扮演思想的传承者，有些人扮演鼓吹者和维护者，有些人扮演创造者一一而其余的人，<|message|>无论权势再大，人数再多，也不过是一堆案例和数据。
