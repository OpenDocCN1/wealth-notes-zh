    ## 《生活黑客》3：生产力色情


    万维钢·精英文课³

    今天

    进入演讲 ›


    《生活黑客》3：生产力色情

    12:11 8.36 MB


    请不要担心今天的标题，我们谈论的是严肃话题。并非只有爱情动作片才叫色情。“色情”，或者用英文换个更中和的说法，叫 “porn”，具有更广义的含义。


    武侠和枪战动作片，其实也是 porn。这种商业片最重要的卖点都是其中的打斗戏。观众会产生代入感，就如同自己在打斗一样快乐。为了加入这些动作戏，电影剧情必须被夸张到不合理的程度，让主人公打得次数多、打得漂亮，打得有创造性。


    那么这么说，其实各种商业片都可能是 porn。我以前看有人甚至说，丹·布朗的小说，像《达·芬奇密码》之类，都是“智力 porn”。主人公无 Endpoint
    明，他运用历史文化知识随手破解各种谜题，你感觉就好像是自己在破解谜题，自己也那么聪明一样……殊不知真实生活里并没有那么聪明的人。


    凡是利用代入感，密集地、夸张地满足人的一项喜好 的东西，就是 porn。香港赌片难道不是赌术 porn 吗？郭敬明电影难道不是奢侈品 porn 吗？整天发食物美图的营销号，难道不是在做美食
    porn 吗？


    咱们继续讲里吉尔的《生活黑客》这本书，这一讲的主题是生产力 porn。


    ### 1.个人生产力


    传统的工作方式不需要多少“自控力”。比如在生产线上干活，别会不断地把东西传给你，你得赶紧做好再传给下一位，想走神都不可能。但如果你属于创新阶层，要自己为自己的生产力负责，你的自由度就大了。


    比如上午九点，你知道从现在开始的两个小时之内，都不会有人来打扰你，完全是你自己的时间。像这样的两个小时对你来说太宝贵了，你决心完成一项重要工作。


    开始工作之前，你决定最后一次查看手机。你发现大学同学群里正在讨论一个有意思的话题，就也跟着说了几句。在等待回复的时候，你又不经意地刷了一下朋友圈，发现有人分享了一篇好文章，你就读了一下。读的过程
    中你感觉文中有个事儿很惊人，又上微博上搜索了一下相关的评论。如此一来二去，两个小时已经过去了1小时20分钟。你一看剩下40分钟肯定不够做完工作的了，就索性看了一会儿小说……


    你是否曾经后悔过去这样的两小时呢？

    你比以往任何时候都需要两个小时的独处时间来完成工作，又比以往任何时候都不容易做到这一点。


    意淫什么动作、美食和奢侈品那些东西都太低端了。创新阶层追求的钻研的和炫耀的，是提高个人生产力。


    生活黑客对个人生产力有很多办法，其中有些很有用，有些看起来实在太有用了，让人感觉简直就是 porn。


    ### 2.两个原则


    咱们先说两个被多人证明确实有效 的原则。


    第一个原则是提高工作的“意愿”。意愿，就是你有没有足够的勇气去*开始*做一件事。我上大学的时候看过一本什么数文书，其中有一句话说“愿我们每天都有起床穿衣的勇气”，我感觉这不完全是矫情。有时候你躺在床上明知道有一大堆事儿要做就是不想起来，这就是意愿不足。


    而一旦你开始做一件事，要坚持做下去则是比较容易的。比如说洗碗，你要不想洗就会一直堆在那里；而你一旦开始洗碗，通常就会都洗完。当意愿低的人还在安逸和内心 PREF
    之 间挣扎的时候，意愿高的人可能已经都做完了。


    意愿，由期望、价值、冲动和延期决定。

    2011 年，管理学家皮尔斯·斯蒂尔（Piers Steel）提出一个“拖延公式” [1]


    ```

    Motivation = Expectancy × Value / Impulsiveness × Delay

    ```


    意愿 = （期望 × 价值）/（冲动 × 延期）


    期望，就是你觉得你能不能做成这件事。你要觉得反正也做不成，你就不愿意做。为了提高期望值，我们应该制定可实现的目标。


    价值，是你认为做这件事有多大意义。这件事越重要，你的意愿就会越强。


    冲动，是你容不容易分心。做别的事的想法越多，你就越不可能做这件事。


    延期，是你这个任务的进度怎么样。如果已经延期很多了，你就会觉得再拖延一段 时间也没关系；如果之前已经取得了很多进展，你就有更强的意愿做下去。


    加强期望和价值感，减少冲动和延期，你就会有更强的意愿去开始做一件事。


    第二个原则是避免干扰。做事的过程中，我们要保持专注，不能三心二意，这就要 求你要自己约束自己。


    我们专栏前面讲博弈论的时候，曾经提到 一位专门研究冲突与合作的博弈论专家，叫托马斯·谢林 [2]。谢林把抗干扰上升到了博弈论的层面。所谓抗干扰，本质上是 现在的你和未来的你之间的冲突。现在的
    你希望未来的你在那段时间好好干活别的 的，可是未来的你并不想在那段时间好 好干活。那现在的你该怎么办呢？谢林提出了三个方法。


    第一是避开干扰。干活之前把手机放到一个未来的你不容易拿到的地方，他到时候 看手机的冲动就会下降。


    第二是许诺一个回报。只要做完这件事，未来的你就可以获得一个奖励，比如立即 就可以玩电子游戏或者吃块饼干。


    第三是找人来监督未来的你。比如你可以把一笔钱交给朋友，说如果到时候你没完 成任务，这钱他就可以当罚款没收。


    把两个原则结合起来，人们发明了各种工作方法，比如流行的“番茄工作法”，要求 你以25分钟为单位工作，每工作 25 分 钟可以休息 5 分钟。在这25分钟里，如果
    你受到干扰，或者突然冒出一个什么分心的想法，你就先记录下来放在一边，等到 休息时间再处理。


    所有这些都不是时间管理，而是个人管理。自由度越大自控就越重要，你要控制你自己！经验证明这些个人管理的方法是有效的，包括里吉尔本人也相信使用这些方法可以提高我们的工作意愿，集中注意力，降低焦虑感，让我们对任务的完成时间有更科学的判断，甚至还能让我们面对复杂局面更有决断力。


    一般人如果能大体地执行这两个原则就差不多了。而有些生活黑客，则执行到了极端 的地步。


    ### 3.黑客的方法


    尼克·温特（Nick Winter） [3] 是APP的开发者和创业者，也是一个博主博主和著名的生活黑客。他在编程的过程中，完成了每天工作超过 12 小时的生产力忙碌。咱们来看看最高水平
    的个人管理是什么样的。


    在提高预期方面，温特使用逐渐延长的工作时间段。一开始是每次工作 25 分钟，然后是 30 分钟，以此类推。如果你能完成前面的任务，你就会对自己更有信心，你就会愿意挑战更长的任务。而且温特并不要求工作结果，只要求工作时间。这是
    因为结果是不可控的，编程过程中会有各种意外的难题，但是工作时间非常可控。


    在提高价值和减少延期方面，温特会优先做编码 —— 而不是 debug —— 的工作。这是 因为 debug 让人感觉不到进度，而如果你能早点写出程序的alpha版本，先弄上
    线再说，你的工作价值感会很强。这也保证了工作进度非常可见，延期也减少了。


    在排除干扰方面，温特做的非常极端。首先他会把像回复邮件、看手机信息这些事情放在固定的时间段做，工作时间坚决不做。其次，他让别人监督自己。工作时他会给自己和自己的计算机的屏幕同时录像，然后把录像在网上延迟直播，他的朋友随时可以看到几个小时之前的他在干什么！


    在一周工作超过 87 小时期间，温特还每天做了125个引体向上，社交互动五次，还好好照顾了女朋友。温特的最高纪录是在一周之内工作了120个小时 —— 平均每天工作17个小时、睡6个小时、吃饭22分钟。而就是这样的超长工作之中，他的量化记录表明，他的幸福感、精力和健康状况都显著超出了平均水平。


    温特说，如果你需要调用意志力去完成一项工作，那只能说明你对个人系统的破解还不够。生活黑客有个目标管理APP，叫Beeminder，允许你给自己设定一系列阶段性的目标，完成目标就罚款。


    对有些目标这个APP可以自动监督你的完成状况。比如说你说要每周给妈妈打一次电话，打没打，系统自动就可以知道。而对有些目标，则要你把完成情况主动报告给系统。比如你的目标是每天晚上使用牙线剔牙，用没用只有你知道。


    第一次没完成目标，系统会罚你5美元。第二次罚10美元，接着是30美元、90美元、270美元，依次递增。这个罚款是真罚，钱直接就被APP拿走了。而生活黑客不但认罚，而且还认为这个服务很值，因为这个方法能逼着他们去完成目标。


    温特承诺要完成一次高空跳伞，他不喜欢这个运动，但是觉得一生之中总得做一次。为此他向所有朋友公开宣布自己要做这件事，搞了直播，还设定了7290美元的罚款。他真的完成了。


    你想不想做温特呢？


    有些人认为这已经不是寻常的努力，这是 porn。为了应对现代社会的焦虑，人们迫切希望提高自己的生产力，其实这跟想要提高性能力一样不靠谱。一般人怎么可能像温特那样工作？温特怎么可能长期那样工作？我们愿意相信提高生产力这件事是可控的，甚至相信个人生产力可以无限提高，那其实是一种幻觉。


    提高生产力的方法都有用吗？科学地讲，有些方法真的有用，有些方法不一定有用，有些方法没用。即便是有效的方法，也不见得对所有人都有法。像温特这样的人本身就是工作狂，别人不一定追求这个。更有人认为，那些一天到晚励志，以为“磨刀不误砍柴工”的人，其实只会磨刀。


    归根结底，我以为，时间管理也好，生产力也好，这些执迷于提高自我的生活黑客的悲哀之处在于，我们是生活在一个世俗的世界中。我们这个世界里人的能力是有上限的 [4]，而他们想做的事情，其实是修仙。


    # 注释


    [1] Piers Steel, The Procrastination Equation: How to Stop Putting Things Off
    and Start Getting Stuff Done, 2011.

    [2] 博弈论9. 其身不正，虽令不从

    [3] 他的个人网站是 http://www.nickwinter.net/

    [4] 不过也许学习知识这件事是无上限的，因为人脑的容量实在太大了。


