    # 来自日课：精要主义之精要


    问答：为什么大侠必须有趁手的兵器。 12:18 8.45 MB


    转载：苡莎


    # 读者樾琪投手：


    开红酒不一定要用开瓶器。打火机加热瓶口，软木塞自动喷出。使用筷子也能开瓶盖以及完成其他的许多事。既然用简单工具就能完成专业领域的事情，为什么还要用单一功能的工具呢？


    万维钢


    这个问题本质是如何理解黑客的“工具主义”。偶尔对付一下的确是可以的，俗话说武林高手“飞花摘叶皆可伤人，草木竹石均可为剑”……那么为什么大侠们还非得有一两件趁手的兵器呢？


    专业选手会对工具非常非常敏感。我听说乒乓球运动员都不用现成的球拍，都是买个板，然后自己配胶皮。我偶尔也打乒乓球，但是没体会到胶皮有那么大的不同，我感觉标准球拍就已经挺好，所以我就有点怀疑，胶皮是不是真的那么重要。


    我的一个朋友业余打乒乓球打了很多年，每周都训练，现在水平相当于一个十二岁的专业运动员。我就特意问他，你对胶皮是不是也那么敏感。他说的是。他不是专业的乒乓球运动员，但他也是自己选择胶皮粘球拍。胶皮的弹性稍微差一点点，他感觉就顺手。他说胶皮要是太不对，平均每周会白丢一到两分。


    乒乓球每局最多丢 11 分，一两分就是 10% 以上的差距。而用专门的开瓶器开红酒，比打火机加热法的效率提高了远不止 10% —— 也许是 600%。


    你对工作的敏感度，到了在乎 10% 的水平了吗？专业选手会非常在乎。如果有什么装备能让职业运动员的成绩提高哪怕 1%，他们一定愿意多花几倍的价钱得到。


    而这还不仅仅是竞争和效率的问题。对一项工作做到精熟的时候，你自然就会变得敏感。像我是个写作者，我对键盘比较敏感，换了好几个。我完全不能容忍用 Word 写作，我要清爽的界面和简洁实用的功能，我极其反感
    Word 那种分页、过多的按钮和自作聪明的语法检查之类的功能，我甚至看见别人用 Word 都难受。我对操作系统和浏览器之类也有强烈个人偏好……我旁观别人操作计算机经常会感到恼火。


    所以我们应该同情黑客对工具的偏好。敏感度提高是个好事儿，你的生活中多了一个值得追求、而且可以被满足的点，这不更丰富了吗？


    # 读者 Ping：


    达不到物质条件又崇尚过精要主义的生活的人，又该怎么办呢？


    # 读者磊：


    总觉得，人活一世根本目的是为了修心，任何理论和方法都是修炼的工具，心自由与光明才是修炼的终点……自由来源于选择，来源于掌控，现实中的我们，没有足够的经济基础，上层建筑是很难做的清雅秀丽脱俗不羁的，您说对吗？


    万维钢


    要行家刚刷在得到开了个新课，叫《要行家说武侠》，其中有一讲说孔子的弟子子路 [1]，非常有意思。孔子说，“破衣衫衫地站在身着华服的贵人中间，能没有愧色的，只有子路了”。


    当然其实子路也是个贵族，物质条件是很不错的。这个道理是物质条件对一般人的气质的确会有些影响。物质条件充足的人可能会比较自信。有人认为只要对人无所求就可以保持不卑不亢的气度，但是我感觉如果自信心不足，就算是无所求，气场也还不行。


    那如果物质条件确实不行，怎么才能够有一个好的气度呢？关键还是在于自信心。人群中的自信心来自在大家都在意的这个项目上，你是什么水平。去中央党校学习的人不会在乎穿脏的衣服贵。开会讨论的物理学家不会比谁开的车好。


    精要主义的精要是精心选择自己的环境，不为外物所控制。如果你根本不在乎物质条件，就应该选择离开那些专门在乎物质条件的人远点。


    # 来自日课：身体优化大师


    # 读者时间风帆：


    生活黑客的一些做法确实令人钦佩，但是有些行为也确实让人感觉生猛些，我普通人估计不敢试。这样看来，咱们这些保守派是不是对未知世界的贡献就小很多了？


    万维钢


    今天探索未知世界的主力是科学家、工程师和创业者，他们属于创新阶层，但不一定是生活黑客——我敢说他们大部分都不是生活黑客。这体现在他们总是拿别人、而不是拿自己做实验。大规模的、使用科学方法操作的实验总是能得出更可靠的结论，而且科学家的想象力一点都不比生活黑客低。生活黑客们喜欢的学说，像“意志力”“专注力”之类，都是由科学家提出，经过正经的科学实验去研究的。现代创新更多地是讲合作，而不是讲破坏。


    那为啥还会有生活黑客存在呢？一方面的确是世界太复杂了，每个人的情况都不一样，必须拿自己做个实验才知道自己最合适什么。另一方面，科学研究的确是比较保守的。想要用科学方法确认一个效用是很艰难的，要耗费大量的时间和金钱。有些生活黑客不等科学结论出来直接就做了，也未尝不可。


    这么说的话，我们大体可以认为生活黑客是在正统科学研究之外的一个小补充。科学进步的最初始灵感可以来自任何地方。的确有可能，生活黑客折腾出来一个什么好东西，科学再跟进确认。


    # 来自日课：对浪漫关系的黑化


    # 读者 Jacky：


    那对夫妻的竞拍机制，其实也有模糊的地方，比如说一方很喜欢看电影，另外一方不喜欢看，那喜欢看的一方不停竞拍，那不爱看电影的，那不爱看电影的，岂不是很快就要破产了？


    万维钢


    应该不会出现那样的局面。不爱看电影的一方一开始会为了不看电影而花钱。但是等到他的钱变少了，他就会感到钱的珍贵程度上升，而对比之下，不看电影这个权利的价值就下降了——于是他就会选择看电影挣钱。


    这个机制就高就高在它不但让你表达愿意不愿意，而且让你精确地表达到底有多么愿意或者多么不愿意。出价代表了你的意愿强烈程度，从而使得你的意愿可以在市场上交易。


    与此同时，你还可以根据当前市场价格调节自己的意愿——这就相当于根据对方的意愿来调节自己的意愿，这不恰恰就是夫妻双方互相照顾吗？市场，促进了资源的有效调配。


    当然，如果一方的钱比另一方多很多，钱少的一方就不得不做很多自己原本不想做、但是看着钱的份上还是决定去做的事情。在外人看来，这有点不公平。但是具体到每一次交易，一方出钱一方做事，都是公平合理的。


    这个机制的真正问题在于夫妻之间的事儿要不要每次都弄得这么公平。难道不是说不计较什么公平不公平，主动为对方做事，这种真诚奉献精神才是我们结婚的目的吗？


