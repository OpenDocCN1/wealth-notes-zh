    当你揭开真象，见到一张梅花小二兼备角时，你的问题不仅是不爱自己的工作，你会发现自己跟同仁格格不入，其凄惨有如阿母斯壮回错了星球。以当初谋职之草率，大多数人的第一个工作很可能并不理想，至少不是他最能发挥自己本领的地方，所以本人常看不起从一而终的日本上班族，毕生努力于打破“终身雇用”的神话。


