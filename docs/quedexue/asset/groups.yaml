    # 缺德学


    蝉，容貌出众。王允便假托是自己的女儿，先把她许配给吕布，然后又献给董卓。一天，吕布进入董卓的住室，看见貂蝉，貂蝉用手指着自己的心向吕布示意，恰好被董卓发现。董卓以为吕布调戏自己爱妾，怒从心头起，拔出手戟向吕布掷来，吕布赶紧逃了出来。路上，吕布遇到了王允，把刚才的事情都对他说了。王允火上加油，以激怒吕布，从此，吕布对董卓便心怀不满。王允看到时机成熟了，就把诛杀董卓的计划告诉了吕布，并且约他为内应。吕布说：“我们是父子呵。”王允便解释说：“你姓吕，本来就不是董卓的亲骨肉，当他用戟掷你的时候，还有一点父子之情吗？”吕布听了，觉得很有道理。过了不久，正逢汉献帝大病初愈，在未央殿大会群臣。董卓穿着朝服，乘车而入。吕布秘密地布置了十几个勇士身穿宫廷卫士的服装，守在北掖门。董卓乘车进入掖门后，这些勇士一涌而上，用戟刺中了董卓的臂膀，董卓跌下车来。董卓一见有变，连忙大声呼喊“吕布何在！”吕布应声而出，说“有诏讨贼。”一戟刺死了董卓。


    英雄难过美人关，昏君奸臣则是难过色情关。


    ## 得势不张扬


    量小非君子。可历代君主、权臣又有几个是肚里能撑船的谦谦君子呢？他们有权则怕旁落，有利则怕夺走。总之他们时时刻刻处于高度的警惕之中。在他们看来，官场没有真正的朋友，只有真正的敌人，所以他们活得很累，所以他们时时的算计别人。所以，如果你想混迹官场，又平安无虞，就得经常用冷水冲冲头脑，得宠不跋扈，得势不张扬，该放手处就放手，该饶人处就得饶人，永远要做出“谦臣”“温臣”的样子。那些被眼前的荣光冲昏了头的人，没有不栽跟头的。


    春秋时期的楚国令尹孙叔敖深谙此道。一次，孙叔敖遇见狐丘老人。


    狐丘老人说：“我听说有三利也有三患，你知道此事吗？”


    孙叔敖恭敬而表情激动地说：“我很不聪明，哪里能会知道这呢。大胆地请问什么叫做三利？什么叫做三害？”


    狐丘老人说：“官位高了，别人便会嫉妒；官做得大了，君主也会嫌恶；俸禄多了，会招来别人的怨恨。就叫做三利三害。”


    孙叔敖说：“不会这样的。我的官位越高，我的志向越低；我的官越大，我更加小心谨慎；我的俸禄越多，我周济的人越多。可以用这种办法免除祸害吗？”


    狐丘老人说：“说得太好了！这像尧舜一样，还有什么需要担心的呢。”


    赵衰、郭子仪则是这种理论的实践者。


    晋文公通过践土会盟，登上了霸主地位，但他环顾各国诸侯，觉得自己的地位并不巩固，自己的权威还不算高，于是，召开集群臣商议对策。


    他首先对众臣说：“寡人依靠众卿之力，战胜了楚国。践土会盟，天子亲临指导，诸侯纷纷响应……但秦人不赴约；许人不会朝；郑人虽赴盟却仍怀贰心；卫侯则复位就擅杀受盟的弟弟。如果再不申明约誓，严行诛罚，诸侯之盟必然分裂。众爱卿看该如何处置呢？”


    于是众臣议论纷纷，有主张出兵讨伐的，有主张以礼服人的，还有主张以天子之名号召诸侯，再视其态度分别对待的。


    最后，赵衰发言道：“以朝觐天子之名号召诸侯，凡不至者即以慢王之罪讨伐，这个主张可以说是名正言顺。但是有一个问题，恐怕我们率诸侯入朝觐见的行动不能实现。”


    晋文公忙问：“什么问题？”


    赵衰解释说：“诸侯朝觐天子之礼已经很久没有举行了。目前晋国强盛，率领各国诸侯突然光临京师，天子一旦拒绝您的请求，就会损害您在诸侯中的权威。”“那么，我该怎么办呢？”晋文公有点着急了。


    赵衰胸有成竹地回答：“想办法让天子到温去，您率领诸侯在此朝见。这样做有三个好处：第一，君臣互不猜疑；第二，诸侯不用长途奔波；第三，温有带叔新建成的宫殿，不用再兴土木建宫殿。”


    “此办法好是好，不过天子会到温去吗？”晋文公不无担心地问。


    “天子喜欢晋国，又乐于受朝拜，怎么会不去呢？我请求您派我为使臣，同天子商讨朝觐之事。”


    于是，晋文公派赵衰为使臣，到京城朝见周襄王。


    赵衰见到周襄王，行礼过后，开门见山地说：“寡君重耳感谢天子不辞劳苦，亲赴践土赏赐之恩，打算率领诸侯到京师来，行朝觐之礼，请天子批准。”


    周襄王听罢，并没有表态，却借口赵衰远道而来，命人将他安排到馆舍就歇，朝觐之事，稍候再谈，安排走赵衰，襄王即召见卿士王子虎商讨对策说：“晋侯拥众人入朝，其心善恶难测，我该怎么拒绝他呢？”


    王子虎回答：“臣请面见晋国使者，探听一下他的来意，能拒绝他我就当面拒绝。”


    ## 缺德史话


    王子虎到馆驿见了赵衰，双方简单寒暄之后，就谈起了朝觐之事。


    王子虎说：“晋侯率领姬姓诸国，尊崇天子，实在是周王室的大幸！但是各国齐集京城，行李满街，车马结队，仆人随从众多，京城百姓从来没见过这么大的场面，会妄加猜测，引起流言，这反而会辜负了晋侯的一番好意。我看朝觐之事就免了罢。”


    赵衰回答说：“我君主想拜见天子，实是出于诚心，在派我来京城的那一天，已经命人通知各国，在温邑集合进京。如果取消朝觐，这不是拿王事当儿戏吗，我实在无法回国复命。”


    王子虎面有难色地问：“现在该怎么办呢？”赵衰故意思考了良久，才说：“古代天子有巡狩之典制，以观察四方民情。天子如果以巡狩为名，驾临温地，我君主借此机会率领诸侯朝觐。这样，上不失周王室的尊严，下不负我君主敬忠的诚意。不知此策是否可行？”


    王子虎连连回答：“你的策略，实在是两相方便，我当转达给天子。”


    周襄王听了大喜，约定十月驾车温地。


    赵衰回复晋文公。


    晋文公即以朝觐天子为名，通知各地诸侯，于十月朔日在温地聚齐。随后，晋、齐、宋、鲁、蔡、秦、郑、陈等10路诸侯齐集温地，朝觐周襄王。


    晋文公再次以霸主的身份发号施令，风光一时。


    郭子仪是唐中期著名的军事家、政治家，在平定“安史之乱”及藩镇叛乱中，立下了不朽的功勋，被唐玄宗以下四代皇帝倚为国家栋梁，功盖一代。


    郭做事十分谨慎，他家的门总是大开着，任人出入，从不过问。


    有一天，郭子仪帐下的一名将官要调到外地任职，特地来王府辞行。他知道郭子仪府中百无禁忌，就一直走进了内宅。恰巧，他看见郭子仪的夫人和他的爱女两人正在梳洗打扮，而王爷郭子仪正在一旁侍奉她们，她们一会儿要王爷递手巾，一会儿要他去端水，使唤王爷就好像使唤奴仆一样。这位将官当时不敢讥笑，回去后，不免要把这情景讲给他的家人听。于是一传十，十传百，没几天，整个京城的人们都把这件事当作笑话在谈论着。


    郭子仪听了倒没有什么，他的几个儿子听了都觉得大丢王爷的面子。他们相约，一齐来找父亲，要他下令，像别的王府一样，关起大门，不让闲杂人等出入。


    郭子仪听了哈哈一笑，几个儿子哭着跪下来求他。一个儿子说：“父王您功业显赫，普天下的人都尊敬您，可是您自己却不尊敬自己，不管什么人，您都让他们随意进入内宅。孩儿们认为，即使商朝的贤相伊尹、汉朝的大将霍光也无法做到您这样。”


    郭子仪收敛了笑容，叫儿子们起来，语重心长地说：“我敞开府门，任人进出，不是为了追求浮名虚誉，而是为了自保，为了保全我们的身家性命。”


    儿子们一个个都十分惊讶，忙问这其中的道理。


    郭子仪叹了口气，说：“你们光看到郭家显赫的声势，没有看到这声势丧失的危险。我爵封汾阳王，往前走，再没有更大的富贵可求了。月盈而蚀，盛极而衰，这是必然的道理，所以，人们常说要急流勇退。可是，眼下朝廷尚要用我，怎肯让我归隐；再说，即使归隐，也找不到一块能容纳我郭府一千余口人的隐居地呀。可以说，我现在是进不得也退不得。在这种情况下，如果我们紧闭大门，不与外面来往，只要有一个人与我郭家结下仇怨，诬陷我们对朝廷怀有二心，就必然会有专门落井下石、妒害贤能的小人从中加油添醋，制造冤案，那时，我们郭家的九族老小都要死无葬身之地了。”


    儿子们听了都心悦诚服。


    ## 好人要帮，坏人也要帮


    不偏不倚，亦即中庸。这是儒家思想的精髓，也是不少人做官处事的法宝。持中庸之道，不得浮躁，超然于派系斗争之上，不过分亲谁，疏谁；持中庸之道，良心不能大大的好，见人搞阴谋活动，要装瞎子，听人拨弄是非，要装聋子；持中庸之道，也不得讲原则，好人要帮，坏人也要帮。持中庸之道，得削磨棱角泯没个性，似人似鬼，任人评说；持中庸之道，也不等同消极软弱，见利得当机立断，毫不手软，但进得快，退得也要快，见好就收，知足常乐。


    由此以来，你的敌人就少，你的形象就好，你的官位就稳。


    不信，就瞧瞧徐世昌。


    徐世昌，人称“三朝元老”。慈禧掌权时，他做过军机大臣；载沣当政时，他做过邮传尚书；袁世凯任总统时，他做过国务总理；段其瑞执政时，他做过总统。可以说，他是个地道的不倒翁。


    在军人横行乱世，一个无兵、无地盘的文人，何以位及显要？


    有人总结了徐世昌为官四条经验：


    - 一曰圆通。


    也就是说，他说话圆滑，模棱两可，有伸缩余地；做事八面玲珑，能左右逢源。比如宣统逊位之后，他依旧保持与“朝廷”的关系，不忘旧主，心念皇恩；同时又成了袁世凯的“相国”，两面讨好，双方渔利。


    - 二曰沉稳。


    他遇事固守缄默，不急于表态，对于争议，要故意回避，多听他人意见。在他看来，贸然出政身陷漩涡之中，乃取败之道，因而没有十拿九稳的把握，他决不轻举妄动。


    - 三曰柔韧。


    以静制动，以柔克刚，必要时哼哼哈哈，转弯抹角，宁可做臭皮囊软磨硬泡，待对手力竭而胜之，不可逞一时刚勇而折弓。


    - 四曰机警。


    专注风云变幻，而决不为天下先，也不落人之后；时机不来，则耐心苦待，时机到时则狠狠抓住。


    这四条归纳起来就是两个字：“中庸”。那么，徐世昌究竟如何实践这一理论的呢？


    袁世凯死后，北洋军阀分裂，一派是皖系以段祺瑞为首；一派是直系，以冯国璋为首。这时，徐世昌仍然是超然于派系之外。


    1917年，张勋复辟失败，黎元洪下台，冯国璋继任大总统，段祺瑞任政府总理。


    冯、段二人貌合而神不合，虽同为北洋系，但二人手中有地盘，有军队，双方谁也不买谁的账，窝里斗是不可避免的。


    段祺瑞把持着政府，掌握实权，据此想把冯国璋当作黎元洪，当作受他操纵盖章的机器，是不可能的，冯国璋处处拆段祺瑞的台。


    段祺瑞对南方用兵，想统一天下，派皖系军人傅良佐主湘，冯国璋指示直系的军队不战而退，使皖系军队失利。


    冯国璋与段祺瑞交恶，梁士诒请徐世昌出面调解。徐说：“往昔府院明争，我能解。今乃暗斗，我没办法，做不到。”徐世昌太聪明了，他不想得罪任何一方。


    南北双方再战，北洋军直系的后起之秀吴佩孚一路取胜，直打到衡阳，但不久，吴佩孚就通电主和，公开攻击段祺瑞的“武力统一”政策“实亡国之政策”。


    为了倒冯，段祺瑞表示要与冯国璋同时下野，这样给冯国璋一个面子。


    9月4日，正在双方斗得不可开交时，安福会举行总统选举会，徐世昌当选中华民国总统。


    冯国璋在与段祺瑞相斗中失败，表示要“返我林泉”，不再出山。


    段祺瑞辞去国务总理的职务，但却以参战督办的名义，仍然控制着实权。


    徐世昌则毫不费力地捡到一个总统。这就是“鹬蚌相争，渔翁得利”。


    虽说徐世昌这总统的权力不大，但总归是个总统。


    徐世昌做官时间长，对上层的勾心斗角了解最深。在他做官时，尽量避免卷入政治斗争的漩涡，对官员们能保则保，能帮则帮，是个“大好人”，但他一旦看清形势，也是很果断的，敢做敢为。大凡行“中庸之道”的人，一向性格怯弱，徐世昌敢做敢为，又行“中庸”，二者兼有，实属“难得”。


    下面看看他在清朝时的行为。


    徐世昌是1905年入值军机处的。在军机处，他仍行“中庸”的为官之道。


    军机大臣当时是庆亲王奕劻，他与袁世凯关系密切，当时与奕劻和袁世凯对立的是瞿鸿机。


    瞿鸿机在他任期内干了三件大事：


    - （1）否决了袁世凯欲推奕劻任总理组阁的建议。

    - （2）赞同新设立的陆军部收回北洋六镇。

    - （3）供奕劻父子收贿纳妾为时议不容，向慈禧建议解其军机大臣，举醇亲王载沣以代之。


    瞿鸿机与袁世凯、奕劻对立，对徐世昌却颇有好感，他“独信徐世昌，谓其谨厚”。另一位军机大臣鹿传霖，又以乡谊与徐世昌亲近，因此，徐世昌在军机处颇为得意。


    徐世昌与瞿鸿机亲近，与袁世凯更近，在清末著名的“丁未政潮”中，岑春煊对慈禧痛言奕劻贪黩误国，要求罢奕劻之职，但后来，奕劻却保住了自己的权位，还与袁世凯一起反击。结果岑春煊被罢职。


    袁世凯在给两江总督端方的密信中说：“幸大老（奕劻）平时厚道，颇得多助，得出此内外夹攻之厄。伯轩（世续）、菊人（徐世昌）甚出力，上（慈禧）怒乃解。”


    由此看来，徐世昌为保奕劻出了力。


    徐世昌不得罪奕劻，也不得罪瞿鸿机。奕劻与瞿鸿机暗斗，奕劻总想把瞿鸿机挤出军机处。袁世凯对瞿早有不满，奕、袁二个人商议，借瞿鸿机当时兼外务部尚书为由，派他出洋，他自然无法推卸，只能离京启程。奕劻、袁世凯让徐世昌在军机处提出此议，这下子，徐世昌为难了。瞿听了徐世昌的话，一下子就明白了，他说：“我老了！不能远涉重洋，还是让年富力强的人去吧！”徐世昌随机应变，立即改为自请成行，给了瞿一个台阶，瞿对徐十分感激。


    徐世昌看上层斗争太激烈，难以应付，就请调东北三省总督，避开了官场激烈斗争的漩涡。


    这不失为明智之举。


    1908年，光绪、慈禧死去，溥仪入继大统，其父载沣做了摄政王。


    载沣为了打击北洋势力，将袁世凯开缺“回籍养疴”。徐世昌在此危急关头，激流勇退，采用以退为进的方法，疏清开缺，清廷却以他“向来办事认真，自应力任其艰”，驳回了他的辞职申请。


    不久，徐世昌离开东北，入京就任邮传部尚书。


    1910年，载沣又提任徐世昌任军机大臣，授体仁阁大学士，享受了清代文臣的最高荣典。


    1911年5月，清廷颁布内阁官制，及内阁办事暂行章程，设立责任内阁，奕劻为总理大臣，那桐、徐世昌为协理大臣。


    1911年10月10日，武昌起义爆发，清政府派北洋军前去镇压，但北洋军“只知有宫保（袁世凯），不知有朝廷”，因而作战不力，很快南方各省纷纷独立。


    徐世昌看到，这是一个不可多得的历史时机，必须靠他的密友袁世凯出山，收拾残局，于是加紧活动。


    溥仪在其回忆录中写道：“袁世凯的‘军师’徐世昌看出了时机已至，就运动奕劻、那桐几个军机大臣一齐向摄政王保举袁世凯，并以辞职、不上朝要挟，逼得载沣无策，最后乖乖地签发了谕旨：授袁世凯钦差大臣节制各军。”


    有人说，袁下野后，徐世昌是他在北京的“灵魂”，此话有一定的道理。


    徐世昌由科举之路，靠“中庸”之道，一路顺风，在仕途上十分得意。


    孔祥熙也是中庸之道的信奉者。


    孔祥熙虽然喝过洋水，工作方式有些洋化，大而化之，但做官、处世则更多地继承了儒家的伦理思想，不偏不倚，无过不及。在他身上中庸的成分占着很大的比重。


    譬如，义和团运动时，他反对屠杀教士教民，憎恨拳民无知，主张严惩山西巡抚毓贤，但不主张八国联军进攻山西，认为八国联军进攻山西只能是践踏百姓；李鸿章在近代史上签订了一系列卖国条约，国人皆曰可杀，但孔祥熙不仅认为李办洋务有功，与李往来，而且还接受李给予的“全权议和大臣一等肃毅伯随员”名义赴美留学；1907年孔祥熙回到欧柏林大学，在欢送会上，中国同学会提议捐一笔款子为庚子殉难教士立碑勒石建立一所纪念堂，孔认为纪念堂是死的纪念物，他根据孙中山“启迪民智”的指示，要求兴建一所学校作为活的纪念物，使殉难教士的精神长存；辛亥革命时，孔率中路军抵抗从太原南撤的清军，但又担心溃军抢劫桑梓钱财，采取施钱纵敌的策略；他信仰基督耶稣，但很少参加礼拜；他反对袁世凯称帝，但在上书中文毕恭毕敬；他参加了广东革命政府，支持北伐吴佩孚，但又和吴佩孚保持很深的私交友谊；1927年在政治上倒向南京政府以后，又和武汉政府保持一定关系，并站在南京方面竭力促使宁汉合流；1931年12月，蒋介石辞去行政院长职务，为表示与蒋同进退，孔祥熙也辞去了实业部长，但又由沪赴宁亲自把实业部大印交给汪派人物陈公博，以示不愿彻底决裂；出任财政部长后，他一面加强国民党国家银行，与外国金融团体抗衡，一面又于1934年12月英国汇丰银行发生挤兑风潮时，命令给予扶助，认为这是国际道义，不容推卸；“西安事变”发生时，孔主张智取，提出了四方面兼筹并顾策略，但却不愿得罪主战派。


    另外，孔祥熙用人也是一本中庸之道，做得适可而止，留余地而不为己甚，留退步而不走极端。有人说：“孔氏用人是善善而不能用，或虽用而仍故掣其肘腋，不尽其才；恶恶而不能去，或虽去而仍藕断丝连，不种仇恨。”世故圆滑，“人情”透深。


    下面几件事，也能说明孔的为人。


    1932年冬，长城谷口战役结束后，二十九军宋哲元部在华北七零八落，无依无靠。虽然拥有一个军的番号，但只有三千多支破枪，实力非常单薄。二十九军过去还是很能打仗的，作战能力在中国军队中还不是很少的。这次若能迅速得到补偿，恢复是不成问题的。但蒋介石在军队国家化的口号下，对于这些杂牌军，一向是不积极给予补偿的。宋哲元在百般无奈的情况下派萧振瀛到南京找孔祥熙，让他设法从中帮助。宋当时任实业部长，果然不负所托，过了几天就向蒋介石提出报告，希望蒋介石能够保存这支曾经在长城喜峰口“杀敌致果”的军队的实力。经孔说项，蒋介石同意给二十九军50万元，并增加每月军饷。后来在抗战期间，宋哲元部出力很大。


    抗战初期，曾经在武汉国民政府时代任外交部长因收回汉口英租界而名噪一时的陈友仁在九龙做寓公，生活非常苦闷。陈因营救关系和孔祥熙处得不错。正好孔祥熙的长子孔令侃也在香港，孔让其子就近去看陈，陈向孔令侃表示，他很想在国家对外作战时，出来为国效劳，以尽匹夫之责。孔令侃将此话电告孔祥熙，孔立即据此向蒋介石推荐，但蒋介石出于成见，以陈不会说中国话不适应在国内服务为托词，拒绝任命，孔只得作罢。陈友仁做过孙中山的英文秘书，国家民族意识非常浓厚。孔荐举虽不顺利，却很推崇他。后来日本占领香港，陈友仁不屈不挠的精神传到孔祥熙耳中，孔曾不止一次称赞陈友仁不失丧国格。


    抗战期间，孔祥熙曾派报界闻人薛大可秘密潜伏上海，担任分化敌伪工作。薛在工作期间，曾与汪伪政府梁鸿志保持联系。梁曾向薛汇报过一些敌伪政府机密，并帮助营救过辅仁大学法学院长董人骥等人。抗战胜利后，国内惩治汉奸的呼声震天动地，那些与沦陷区内伪政府人员保持秘密联系的国民政府官员，为了避嫌，不敢出面澄清是非。孔祥熙电促薛大可出庭作证。但由于梁鸿志罪大恶极，法院申明功不抵过，判处死刑。孔祥熙明知国内对汉奸议论鼎沸，而竟冒天下之大不韪，受到多数人的指谪，说他“爱憎不明”，但梁鸿志本人是很感激的，临死前曾向孔函谢，说孔祥熙“古道热肠，不遗患难待罪之身”。


    中庸本是一种折衷哲学，有帮好人的时候，也有帮坏人的时候。然这正是孔祥熙的处世原则。


    ## 忍一时海阔天空


    在官场混，总会碰到许许多多麻烦的事，权势过甚，君上、上司会误解你；才能超人，同僚会妒忌你；铁面无私，下属会怨恨你。如果你事事都要争个是是非非，弄个明明白白，只会招来更多的麻烦，甚至还有杀身之祸。怎么办？一些聪明的人常用“忍”来化解矛盾，渡过险滩，或以“忍”来等待时机。


    忍是大智。


    唐代名臣郭子仪是四朝红人，权倾朝野。他为官的诀窍就在于忍和慎。


    鱼朝恩是皇帝身边的宦官，此人虽无才情，但会溜须拍马，所以为皇帝宠幸。他对郭子仪的才干、权势十分妒忌，曾多次在皇帝老儿面前打小报告，诽谤攻击郭子仪，却没有成功，愤怒之下，竟暗中指使人盗挖郭家的祖坟。


    郭子仪知道这是鱼朝恩的卑劣伎俩，当时他身任天下兵马大元帅，手握重兵，一举手、一投足，都关系着大唐帝国的兴亡，连皇帝都敬着他三分，要除掉一名鱼朝恩，真可谓不费吹灰之力。当他从前线返回朝廷时，满朝公卿都以为他必将有所行动，岂料郭子仪却对皇帝说：“我多年带兵，并不能完全禁止部下的残暴行为，士兵毁坏别人墓坟的事也很是不少，我家祖坟被掘，这是臣不忠不孝，获罪于上天的结果，并不是他人故意破坏。”


    祖坟被挖，历来被视为奇耻大辱，而郭子仪却能隐忍下来，足见他的气度之大。也正因为他能曲能伸，能忍能让，他才能在那个奸佞横行、国君昏弱的时代，逢凶化吉，度过一次又一次政治险滩，享尽富贵，以85岁的高龄，安然辞世。


    其实，以忍化凶之道，不仅良臣君子懂得，奸臣枭雄也不糊涂。

    '
