    # 缺 德 学


    请他去做“精神讲话”，他说自己没有资格，也都一一婉言谢绝。遇到非去不可时，就只做一般性的业务报告，从不以领导人自居。军统每星期一上午举行纪念周，戴笠外出时，他总请郑介民或唐纵来主持，自己则从来不肯出面代替戴笠。


