    ## 香饵好吃口难开


    大凡钓鱼者，总会先装上香喷喷的诱饵，然后将鱼钩投入水中，才能钓到鱼。鱼之所以上钩，是因为那香饵实在太具诱惑力了。


    这一手段运用到人身上，就是要先设置一些如“香饵”的东西，让人觉得有利可图，欲罢不能，而不知不觉进入你的伏击圈，最后达到利用、控制对方的目的。运用这种计谋，关键在于投放的“饵”确实很香，有一种“挡不住的诱惑”的魅力，从而将对方的胃口吊得高高的，手伸得长长的。当然，也要讲究投放“诱饵”的方式，如果方式笨拙，则容易让对方看出破绽，计谋自然难以得成。


    1990年1月30日《法制日报》刊登过这样一个并非虚构的故事。


    河南有位农民叫王秀云，牵着一头大黄牛前往集市准备卖掉。路上，他拾到一只精致的盒子，顺手装进口袋，找了个僻静角落，想看看盒子里装的是啥东西。他刚从口袋里掏出盒子，只听到一声叫喊：“喂！拾到了我的东西想往哪里跑？”过来一个长有小胡子的人。王秀云问：“这里面装得是啥？说对了就还给你。”小胡子答不上来，要求“见面分一半”。王秀云说：“我拾的，我要一半。”打开盒子一看，只见里面两根金灿灿的金项链，里面还有发票，发票上写着：24K金项链，每根单价1200元，合计2400元。小胡子要分一根，王秀云要多一半。小胡子答应：“给我1000元算啦！”王秀云没有钱，就把一头牛给了小胡子。心想，又捉弄这家伙一下，这牛最多值800元，哼，又白赚了200元。


    事后，经人鉴定，这是两根上面涂有金粉的钢项链，最多值5元钱，王秀云听了这话，恰似五雷轰顶。


    这位王秀云，牵牛去赶集。路上拾到了一个精致的小盒子，他只为拣了便宜，但他哪里知道，这正是行骗人投下的香饵——引他上钩。王秀云在僻静处刚掏出盒子，想不到出现一个小胡子——钓鱼者出现了。这时，如果每人平分一根项链，王秀云也不会上当。可是，具有诱惑力的金项链，哪里会甘心让小胡子分去一半呢？小胡子装作让步，说只要1000元，王无现钱，竟把一头价值800元的大黄牛给了小胡子，还以为又赚了200元，得了便宜。在王秀云看来，从拾到了项链到分钱，步步沾光，而小胡子却步步退让，他哪里知道，这正是骗子步步设的诱饵，正像钓鱼收竿那样，吃了食的鱼儿便无法脱钩了。


    香饵钓鱼计没有国界，中国人能用，老外同样能用，效果都很显著。


    一个德国人梅里特兄弟移居美国后，定居密沙比。他们早起晚归，积攒了一些钱。后来无意中发现密沙比原是一个丰富的铁矿区。兄弟两人严守秘密，并开始大量收购地产，成立了铁矿公司。洛克菲勒早就对该铁矿区垂涎三尺，但由于晚来一步，只能眼睁睁地盯着这块肥肉，等待时机。


    1837年，美国发生了一次经济危机，市面银根告紧，梅里特兄弟陷入了窘境。正在这时，来了一位本地牧师劳埃德先生。梅里特一家人一看令人尊敬的牧师，忙恭恭敬敬地把他请进屋去，待作上宾并聊起家常来。梅里特兄弟从整个国家的经济危机谈到自己的困境，话语中充满了哀伤。劳埃德牧师一听这些，十分热情地说：“你们怎么早不告诉我？我可以助你们一臂之力啊。”


    梅里特兄弟听了大喜，忙问：“牧师有何高见？”


    牧师说：“我有一位大财主朋友，看在我的情面上，他可以借给你们一笔巨款。”


    梅里特兄弟说：“牧师你真是个大好人，真不知怎样感谢你才好。”


    牧师问道：“你们需要多少钱？”


    梅里特说：“42万元。”


    于是牧师就写了封借42万元的介绍信。


    两兄弟问：“利息多少？”


    牧师说：“我怎么能要你们利息呢？这样吧，低利，比银行利率低2厘。”


    两兄弟以为在梦中，呆了。


    牧师让他们拿出笔墨立了一字据：“今有梅里特兄弟借到考尔贷款42万元整，利息3厘，空口无凭，特立此为证。”


    梅里特兄弟念了字据，觉得一切无误，高兴地在字据上签了字。过了不到半年，有一天，劳埃德牧师又来到了梅里特家。


    一进门他就严肃地说：“我的那位朋友是洛克菲勒，他早晨来了一个电报，要求马上索回借款42万元。”


    两兄弟早已把42万元花在矿产上，哪里能拿出这么多钱？两兄弟无可奈何地被逼上了法庭。


    在法庭上，原告律师说：“那借据上写得非常清楚，借的是考尔贷款。”说着。他又引经据典：“考尔贷款是贷款人随时可以索回贷款，故其利低于一般贷款利息。根据美国法律，借款人或者立即还款，或者宣布破产，两者必居其一。”


    梅里特兄弟只好宣布破产，将矿产卖给洛克菲勒，作价52万元。


    洋鬼子劳埃德以投放低利息的42万元作诱饵，钩到了梅里特兄弟的铁矿区这条“大鱼”。


    ## 有福我享，有难你当


    中国人有结拜异姓兄弟的传统。只要情投意和便要义结金兰结拜换帖，有了八拜之交即可为朋友两肋插刀，“有福同享，有难同当”。这一传统大概是受了《三国演义》中刘关张“桃园三结义”的影响。想当年，刘备为了让关羽和张飞辅佐他打天下，与其结为换帖兄弟并发誓“不能同年同月同日生，但愿同年同月同日死”。这种做法对于笼络关张二将为其效力卖命起到了不可估量的作用，从此以后，关羽和张飞便成了刘备的左膀右臂，供其驱使，死而后已。为了一个“义”字，关云长经受住了曹操高官厚禄的诱惑，毅然挂印封金，过五关斩六将千里寻兄。正是有了关张二人的鼎力相助，刘备才得以在屡败之后终能据荆州取西川占汉中与孙吴和曹魏形成鼎足之势，终于成就了帝王之业。


    刘备当了皇帝，关、张二将所得到的不只是名列“五虎上将”的虚名而已。其实，在刘备眼里，关羽和张飞无非是供其利用的鹰犬罢了！若是有朝一日得天下，真能与关张平分吗？可惜关羽和张飞对此至死不悟，特别是关羽临死之前仍感念与兄长的桃园之义并拒绝了孙权高官厚禄的引诱。由此看来，害死关羽的其实并非孙权而是他自己满脑袋的江湖“义气”，一代名将竟落得如此下场，岂不悲哉！


    民国年间，乱世枭雄张作霖的飞黄腾达靠的也是所谓江湖“义气”。他早年结交了一批土匪出身的狐朋狗友，这些人与他臭味相投，患难相交，又都是“绿林兄弟”，其中较有名的有张景惠、汤玉麟、张作相等。为了所谓的哥们义气，这些人出生入死，为张作霖卖命，立下了汗马功劳。


    张作霖统治部下的手段主要靠权术，靠江湖“义气”，靠这种权术使部下服服帖帖，甘愿为他卖命。由于他善于玩弄权术，使他在土匪中有极高的威望，使他成为这帮人中当然的领袖。他用以团结部属的东西是权与钱，他的部下都可得到应有的财富，并随着张作霖的升官而升官，因而他们紧随张作霖，为升官发财而卖命。


    由于哥们“义气”这个东西是对张作霖个人的，因而也就不是最稳定的，当张作霖在时可以一呼百应，说一不二，震慑全军，然而，张作霖死后就必然发生分化。


    与张作霖一样，蒋介石也企图利用江湖义气笼络部下。他早年结交了黄郛、陈其美，后又与李宗仁、张学良结为换帖兄弟。


    蒋介石结拜异姓兄弟，自然有其目的。1926年7月，北伐军攻克长沙，蒋介石与李宗仁秘密结拜为兄弟。什么原因使他们二人情愿结为异姓兄弟呢？除了双方互有好感以外，利益的驱使是其主要原因。蒋介石比李宗仁大4岁，与李相比，蒋经历广，阅历深，素谙权力斗争中纵横捭阖的打拉之法。桂系虽说刚刚崛起，但实力绝不容忽视。同时，北伐前蒋介石在广州与各方关系弄得十分紧张，他虽为国民革命军总司令，但其资历与作风，在其他6个军长中早已引起不满。为确立自己在军界的领袖地位，蒋决心拉住李宗仁。北伐前夕，蒋提议白崇禧担任北伐军行营参谋长这一要职，以此来换取李宗仁的信任。北伐军攻克长沙后，蒋介石的司令部也随之移到长沙。那时，李与蒋的关系比较融洽。一日李蒋闲谈间，蒋介石突然提出要与李宗仁成为换兰拜帖的兄弟。接着蒋打开抽屉，取出一份红纸写的兰谱，请李收下。李先是不肯，并说：“我惭愧得很，实在不敢当。”“你不要客气，你人好，你很能干……”蒋边说边将兰谱塞入李宗仁军服口袋里。李辞出后打开兰谱，见上面除了写有蒋介石的生辰八字外，还有蒋撰写的四句誓词：谊属同志，情比同胞，同心一德，生死系之。几日后，李宗仁将蒋写的四句誓词抄下来，再写上自己的生辰八字，将帖子回送蒋介石。蒋十分愉快地表示，从此两人更加一层情同手足的关系，誓以同生共死，为完成国民革命而奋斗。就这样，李蒋结拜为兄弟了，并由此度过了一段亲密合作的“蜜月期”。可是，数月后当他们发生利益冲突时，蒋介石立刻扯去了同志、兄弟情谊的温纱，兵戎相见反目为仇了。


    除了李宗仁以外，蒋介石结拜的生死弟兄还有冯玉祥、张学良等人。可见，在收买人心、统驭部下方面蒋介石的确煞费苦心。


    ## 用千金做交易


    都说皇帝的女儿不愁嫁，但嫁给何人却是一门学问。嫁给异族首领，叫做“和亲”，是为了羁縻异族，安定边境；嫁给臣下的子弟，又何尝不是为了羁縻大臣、稳定皇权。在官场上，婚姻完全成了一种政治交易，一种权术手段。


    窃国奸雄袁世凯颇精于此道，官、钱、色这三样东西，常被袁世凯用作收买人心的主要手段，而且屡屡奏效。


    袁世凯手下有个叫阮忠枢的人，此人才华出众，是袁世凯的一个机要文书。阮颇有几分古代风流才子怜香惜玉的意味，他嫖妓到了不能自拔的地步。有一次，他爱上了天津名妓小玉，两人山盟海誓，如胶似膝。


