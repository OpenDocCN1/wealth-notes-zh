    ## 缺德丛话：雾里看花花更花，水中望月月更月


    鲁迅先生说过：几千年的中国文艺就是“瞒和骗”的文艺。如果不会和鲁迅先生打官司的话，我就要掠美一次：几千年的缺德历史也就是“瞒和骗”的伎俩之凝结。对此，我在上面已经作了一点阐述。在缺德丛话这一栏里，我所要谈的则是大逆不道之人的缺德美学观。或许，有人会问，你是怎么知道的，莫非你和这些缺德者有联系。诸位，请听我言，不管个人缺不缺德，倘若我连这个都看不透，又怎能向各位夸下海口，大谈特谈缺德学？大凡在世上干一件事总要讲究个“门道”。俗话说得好：“不会看的看热闹，会看的看门道”。


    干一行，精一行。缺德者亦是如此。日积月久，相互交流，慢慢儿就形成了一门学问：缺德学。缺德学学会还经常举行学术讨论会，定期召开年会，时不时慷一次国家之慨，吃一吃缺德饭，这也是常有的事。这事在古代可不就有？只是形式略有不同而已。过去，我们的传统习惯就是为名人讳，“讳”得连名字都找不到。即使找到了，也是言过其实。一般来说，古代之人的盖棺论定多数是好就好得不得了，坏就坏得不得了，很少有客观、公正、一分为二的分析评定。这并不是有德的表现，相反，在我看来，倒是一种缺德的表现。本来，缺德事就见不得人，所作所为者想尽办法要把它遮掩住，而我们还要使劲地为他打掩护，这岂不是为虎作伥？事实上，所谓的贤人也并不那么“贤”，所谓的伟人也并不那么“伟”。若真的要树新道德，那还就要从“零”开始，别再相信“瞒和骗”的一套。


    我本人是文人，那我们就从文人的世界开始说起。这里，我并没有“家丑不可外扬”的顾虑，只是希望同仁们不要轻易对号入座。大家都知道，现在大街小巷的卡拉OK生意都非常兴隆，而在其中歌舞升平、搂搂抱抱者都是些大腹便便之人。这好不令那些心中充满浪漫、口袋中却无钱的“穷措大”们眼馋得滴血。于是，提笔大骂特骂“大款”们缺德的文章塞满了大报小报。其实，这并不能说明什么问题，文人们也想去，只是没有和“孔方兄”搞好关系。你没有听过款爷们的自我开脱吗：“十个男人九个花，一个不花还缺点啥。”好了，我们没有时间去为花不花的问题打破沙锅问到底。还是让我们看看那些为我们一贯宠爱的人们到底是怎样一副德性。众所周知，白居易的《长恨歌》与《琵琶行》已经是传颂千年的绝唱。对前者，人们多欣赏其对李隆基与杨贵妃爱情的描绘如泣如诉；对后者，人们都为他那“同是天下沦落人，相逢何必曾相识”的千古名句而叫绝。可又有谁知道，就是这位写下了“商人重钱轻别离”的高雅之士，在伟大的同时还有着不伟大的一面。那是白居易70之年的当口，“既老，又病风”，此时家中尚有二十来岁的家妓樊素为之提供性服务。此刻，老翁已经无力享受樊素的青春妙龄，但他仍留其于家中。而且，白老先生还专此作了一首《不能忘情吟》作为纪念，足见其风骚的个性。这不由得让人想起他在“秋风瑟瑟夜送客”那个晚上的逸事：“添酒回灯重开宴，举酒欲饮无管弦”。想想看，和一个朋友饮酒还要找一个小姐作陪，不然就喝不下去。这是一种什么情调？用今天的话来说就是“三陪”。找“三陪女”作乐，在今天可是属于“黄”的范畴。如此说来，老白的诗还有什么情调？关于白居易的《不能忘情吟》，在他54岁时任苏州刺史时就有记载：“一抛学士笔，三佩使君符。未唤银青绶，唯添雪白须。公门衙退掩，妓席客来铺。履舄从相近，讴吟任所须。金嘶衔五马，钿带舞双姝。不得当年有，犹胜到老无。合声歌汉月，齐手拍吴歈。今夜还先醉，应须红袖扶。”这首《对酒饮》意在抒发对仕途的不满，青春年壮时没有，而到了半百才有妓乐，但是有总胜于无。其中所写的以乐舞待客，听凭客人调戏，也都真实可信。要知道，在古时家庭里的奴隶分为好几等，家妓是最为靠下的一等。家妓的主要功能在于：一是其服务以技艺服务即歌舞之类为主，当然也逃脱不了性服务，但并不以这为主；二是家妓还可作为待客的工具，宴客时以歌舞娱宾，乃至奉主人之命提供性服务，不算门风之耻。家妓和二房、通房丫头是有区别的。这些家妓，十二三岁，最多十五六岁时买来，并不会什么歌舞，主人家得费一番功夫教习。于是这里就有一个矛盾，恰如白居易所说：“莫养瘦狗马，莫教小妓女；……马肥快行走，妓长能歌舞；三年五载间，已闻换一主。借问新旧主，谁乐谁辛苦？”那意思是说，买来现教，虽然年轻，毕竟费功夫，不如买人家调教好的现成，尽管年纪大一些。这里，我倒有一点怀疑，是不是年轻的少女价钱要高得多，而白居易只能如此呢？因为下面的感叹令我们作此判断：“老去将何散老愁；新教小玉唱伊州。亦应不得多年听，未教成时已白头。”还有令其更为感慨的呢：“黄金不惜买蛾眉，拣得如花三四枝，歌舞教成心力尽，一朝身去不相随。”这首名叫《感故张仆射诸妓》的诗露骨得厉害，简直有点不把那些家妓替他殉葬誓不罢休的味道。


    老白若此，李白亦不甘示弱。想当年，老李“烟花三月下扬州”的滋味并不亚于老白。清代遗老辜鸿铭为妻妾纳妾的开脱可是颇有滋味：“世间只见有一个茶壶配好几个把茶杯的，哪见一只茶杯配几把茶壶的。”他的茶壶与茶杯之论享誉四海。就是那位被胡适当誉为“只手打倒孔家店的老英雄”、反对旧道德的新潮人物吴虞也只是一个“口头革命派”，他到了60还要纳妾。的确，道德不道德的事情有时真是“知难行易”。


    翻开我们文明古国的历史，哪一个皇帝不是以天子的名义下凡？就是这些以“神仙”自居的皇帝，哪一个又不是人民的救星？就是这些救星，哪一个又不是有一本说不清、道不明的缺德账？在“君君臣臣”、“父父子子”的背后，本身就有一个惨无人道的“秘诀”。商纣王的暴虐无度、荒淫无耻开了皇帝老子不讲理的先河。他所发明的“炮烙之刑”的鲜招令人不寒而栗：在铜柱上涂上膏油，下面烧起炭火，令其不顾眼之人在上面爬行。忍受不了烫烙，就掉进火堆被活活烧死。一个上了岁数的老人大清早赤脚过河，不畏水寒。纣王得知，便将他抓来，砍断小腿骨，看他与一般人有什么不同。更有甚者，他让人剖开孕妇的肚子，来观看婴儿如何在其中养育。有时，他还会别出心裁地让人在平地里立一根柱子，将诸侯吊起来看其挣扎状。九侯有一位端庄美丽的姑娘被进献入宫。此女不喜淫荡，纣王大怒，不但杀了她，还杀死了她的父亲，用乱刀剁成肉酱。这哪有一点文明古国的气息，整个一缺德大王。依次排下来，秦始皇嬴政、秦二世胡亥……隋炀帝杨广、唐玄宗李隆基……宋太祖赵匡胤……明太祖朱元璋……直到“文革”时期的江青之流，哪一个值得我们去为之唱“颂歌”。上梁不正下梁歪，他们手下的大臣哪个又好过？所谓的忠臣们，哪个又不是居心叵测的奸诈小人？秦桧、严嵩、魏忠贤、李莲英、林彪……一连串的名字后面无不带有讲不清道不明的缺德账。


    说过了斯文儒雅的帝王将相、风流墨客，再看看古代的“二流子”式的闲士也是颇有一番情趣的。俗话说得好，大千世界，无奇不有。就连帮闲的主儿都能写上洋洋几十万言。记得鲁迅先生曾写过一篇文章叫《从帮忙到扯淡》，大意就是讽刺那些“帮闲”者的。其实，帮闲者在古代就闲不住，并不是我们现在的发明。明人冯梦龙在话本小说《蒋兴哥重会珍珠衫》中这样写道：“世上有四种人惹不得，引起了头，再不好绝他。是哪四种？游方僧道、乞丐、闲汉、牙婆”。帮闲的起源，大概可以追溯到春秋战国时代的养士之风。号称“战国四公子”的孟尝君、信陵君、平原君、春申君，堪称是其中的代表性人物。自此开始，“帮闲”大量涌现并形成了一个特殊的寄食阶层。两宋迄元、明、清各代，有关“帮闲”的记载不绝如缕。许多不登大雅之堂的文学形式都有描写。如元杂剧《东堂老劝破家子弟》中的闲汉柳隆卿称：“不养蚕桑不种田，全凭马扁度流年。”这和今天流行的顺口溜“累死累活红芋干面馍，吊儿郎当喝羊汤”有些相似，都是对那些不务正业、游手好闲、坑蒙拐骗之徒的有力讥讽。明代凌蒙初的《拍案惊奇》卷三十一有诗云：


    > 每日张鱼又捕虾，花街柳陌是生涯；

    > 昨夜赊酒秦楼醉，今日帮闲进李家。


    方汝浩的《禅真后史》第十三回有短歌云：


    > 白面郎君，学帮了介闲，勿图行止只图介钱。脸如笋壳，心如介靛；口似饴糖，腰似介绵。话着嫖，拍拍手掌，赞扬高兴；讲着酒，搭搭屁股，便把头钻。兜公事，指张介话李；打官司，说赵介投燕。做中作保是渠个熟径，说科打诨倒也自新鲜。相聚时，卖弄介万千公道；交易处，勿让子半个铜钱。话介谎，以捕风捉影；行介事，常记后忘前。害的人虎肠鼠刺，哄的人绵里针尖。奉承财主们，呵卵脟，捧粗腿，虚心介下气；交结大叔们，称兄弟称表号，挽臂介挨肩。个样人勿如介沿门乞丐，讨得个无拘束的自在清闲。


    这段文字描写，将“帮闲”者的嘴脸跃然纸上。鲁迅先生在《从帮忙到扯淡》一文中写道：“他也得会下几盘棋，写一笔字，画画儿，识古董，懂得些猜拳行令、打趣插科，这才能不失其为清客。”这些人物在鲁迅看来也都在无聊、缺德之列。《水浒传》里的开场人物高俅就属于这号人物。他“自小不成家业，只在东京城里城外帮闲。因帮了一个生铁王员外儿子使钱，每日三瓦两舍，风花雪月。”“三瓦两舍”是当时色情业的代称，也是主要的“销金窟”和帮闲们一同揩油占便宜的好去处。这些“白相”之人别的本事没有，在色媒酒宴上陪座凑趣、浑水摸鱼可是他们拿手的看家本领。《金瓶梅》里有一段关于这种行情的描绘相当到位：应伯爵这批帮闲者陪着西门庆去妓院李桂姐家玩耍，吃得煞是舒服。“临出门来，孙寡嘴把李家明间内供养的镀金铜佛，塞在裤腰里，应伯爵推逗桂姐亲嘴，把头上金琢针戏了。谢希大把西门庆扇儿藏了。祝实念走到桂卿房里照面，溜了他一面水银镜子。带时节借的西门庆一钱银子，竟是写到嫖账上去了。”明末小说《拍案惊奇》中对这类情形描写的也是入木三分。如第二十二卷写道：有一个富翁郭七郎，在妓院中挥金如土，从不吝惜。一伙帮闲得知此情，便出来设法引诱郭七郎跳槽，去另一家妓院鬼混。同时又领了一些喜欢赌博的王孙贵戚前来聚赌，做下圈套，从中骗银子花。凡此种种，都是帮闲儿的原始本领。


    这样的“才子”若是没有还好，要是非常流行，中国的缺德账可就难算了。事实上，这些半吊子文人根本够不上什么赐封什么“风流才子”的雅号，充其量不过是一个流氓骚人。可别小看了这群鸟人，他们可是人们常说的那号惹不起之“二混子”。缺起德来，谁都缺不过他们。


    闲扯缺德，怎么也得给不阴不阳的太监们留一席之地。固然，他们也都是在缺德之人留下的“国粹”，但他们又是“千年媳妇熬成婆”后的极其变态的缺德者。有时候，阉臣们为了争权夺利，就会像疯狗一样六亲不认。汉武帝时，太子据宽厚仁慈，宦官竟然因此陷害太子。武帝晚年和一个皇子比较疏远，和皇后见面也很少，太子曾谒见皇后，呆了一天才离开，宦官苏文当时任黄门，他就造谣，告诉武帝说“太子和宫女玩了一天。”武帝毕竟有爱子之心，索性为太子增加宫女到200人。太子知道事情的来龙去脉后，心里耿耿于怀。苏文也更加怀恨起来，于是经常去到皇帝那里打太子的小报告。皇后对此恨之入骨，让太子诛杀苏文等人。太子说：“只要我没有过失，怕他们干什么。”武帝有一天生了病，叫常融去召见太子，常融和苏文串通谎报说：“太子听说皇上生病有喜悦的表情。”群阉陷害太子，皇帝真相大白。


    中国的缺德谱里向来就有“爬和撞”的艺术。自己遭了殃，也要别人陪着自己“流泪到天明”，自己没有的也不让别有人。明英宗时，有一个叫阮让的太监就非常缺德，他一次就把俘虏的苗族儿童阉割掉1565人，等到报告皇帝，已病死329人，于是于是就又买了同样数目的少年阉割了以充数。


    “爬和撞”并不能概括缺德“艺术”的全部。太监除了此种心理外，还有一种别人有我也要有的要求。明英宗时，太监吴诚就在南京置办庄园娶妻。太监娶媳妇，良辰美景岂不都成了虚设？但是，他们这类畸型物似乎并不甘心，明英宗末期，北京有一阉竖攀比玩耍功夫，用假阳具奸淫卖小唱的妓女，一下插进肛门，怎么也拔不出来，结果把那妓女胀死了。好像孬事都在明代发生了。有一名叫高策的太监到福建抽税，听信方士的胡说：“食小儿脑千余，其阳道可复生如故。”于是他就到处买小孩杀死食脑。


    这并非全是杜撰的民间故事。为了私欲而缺德是缺德之人的共同特点。


    缺德还有重要的一层，那就是挂在人们嘴边的“国骂”。无论是“他娘的”、“他妈的”，还是“他母亲的”，这些“骂”都与女性的生殖器有关。我们看到，缺德原理是最讲究隐秘的，可在这里缺德者又专拣隐秘的、见不得人的地方骂。骂来骂去，都离不开和女人睡觉。鲁迅先生曾有一篇谈“国骂”的文章，将中国的“他娘的”三个字分析得有来有去。他在回忆自己家乡的“土特产”时说，绍兴的骂人话是“娘东石杀”。我不知道它的具体意思，但从逻辑上来判断，与“操他妈”之类的方言没有什么两样。


    这让我不由得想起英语中的“洋骂”来。诸如“fuck you”等短语也和中国的“他妈的”有异曲同工之妙。不过，这些倒很值得分析一番。您瞧，无论洋人还是国人，他们在骂上都颇有讲究。俗话说“骂娘”，可“骂”的时候又从不出现“娘”，要是控制不住的人，也真的要要说一声：“真他娘的有意思”。文明可千万不能这样啊！幸亏中国有这么一个万能的“的”字拯救了国人的尴尬，否则文明古国的称号可就要打折了。“他妈的”，到底他妈的什么，大家都心照不宣。谁都知道，这是最为隐晦的字眼。在文明社会里，怎能说出如此脏的字眼呢？骂人好像是人的一种本能，大人小孩皆会。而且，都知道“日”、“操”、“弄”等动词后面的宾语一定是一位女性。“他奶奶的”、“他姥姥的”、“姐的”什么什么、“妹的”什么什么，反正是骂得越近越解气。尤其令人搞不懂的是，男人骂这些与女性生殖器有关的东西，女人自己也跟着凑热闹。做了母亲的人对自己的儿子不满时也是那副德行，居然骂起自己来。看来，国骂的意义远不止于“性”的生理范畴，他已是社会学里缺德学的研究对象。试想，当你骂出“真他妈的缺德”这句话的时候，你是否也把自己划进了缺德者的行列。蒋介石的“娘西皮”至今仍是家喻户晓的口头禅。要知道，他本来就不是什么有德之人。


