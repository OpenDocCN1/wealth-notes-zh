    # 上班族缺德讲座


    # 第七条 缺德资格


    详见开讲辞。


    # 第八条 情绪之超法律性


    公司（含代表公司之上司）之任何作为，均不得损及员工尊严或剥夺其培养健全人格之机会。违反以上原则者，纵不违该国现行各项劳动法令，上班族有权敢怒，敢言与否由当事人自行决定。


    # 第九条 缺德行为之中止


    凡事先或事后承认公司各项控制为正当，并由其中取回相当之物质报酬，经公司指出无误者，应于最短期限内中止缺德行为或跳槽。


    # 第十条 礼仪


    上班族不得因有志缺德而蓬头垢面，待人刻薄，应以自尊敬人之心与同处大难之同仁玩乐交欢，以同情爱护之念与上司、敌人周旋，忍悲带慈，视缺德为天下公器。'
