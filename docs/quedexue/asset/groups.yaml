    # 第五法——加入工会


    要是你和公司当局没有交情，偏偏又能伸不能屈，说不出肉麻话，本人劝你考虑置之死地后生，也就是成为工会的斗士。


    在工会活动，要善用法律和数据两大法宝，法律是常识的累积，数据是理论的结晶。


    当老板发现有个头痛人物出现，就会研究是要开除你还是要拉拢你，你要心中想好愿意出售的价格，等中间人来撮合就行了。话说回来，本方法是两刃剑，不是必要，不宜轻用。


    # 升官四法七原则


    以上的五个方法算是装炸弹，以下我们介绍如何拉导火线，也就是说，当你顺利地制造好升迁的情势后，就可以挥出以下致命的一击了。


    递补法——主管是一种具有“唯一性”的人物，因此把上司推到别的位子上，你自然就有机会填入他留下的空位。同样，如果你把手下拉到自己的位子上，有机会被推到上面去。本法不伤害任何人，说来是最理想的。


    谗言法——本人并不特别鼓励各位用这法子，但是它的确很有效，人言可畏，众口铄金都是古有的名训。只有在对手先使出这恶毒伎俩时，各位才可以毒攻毒，以牙还牙。


    以退为进法——向上司推荐升迁的人选，以便让别人更早了解上司的心意。本法的缺点在于若运用不当，会弄假成真，上司以为你无意角逐，便把机会送给别人。


    声东击西法——假设目前公司有发行部及企划部两个位'
