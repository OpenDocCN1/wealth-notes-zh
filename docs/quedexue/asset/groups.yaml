    事已至此，文种也只好拔剑自杀了。


    勾践一直被人们视为忘恩负义的典型，也是屠戮功臣的始作俑者。然而，后世的掌权者却是“青出于蓝而胜于蓝”了。屠戮功臣之多，涉及面之广，手段之残忍到了令人发指的地步。


    汉高祖刘邦称帝后，惟恐韩信、彭越、英布这些为他创建大汉基业立下赫赫战功的战将威胁皇权，便伙同吕后采取各种阴谋手段制造冤案一个个予以铲除。被刘邦称为第一功臣的萧何难免厄运，不惜自毁名声——侵占民田，欺压百姓，装出一副贪婪相。举朝上下人人自危。刘邦这样做的目的，无非是为了巩固自己的权力地位，奠定刘氏万年基业。临死之前，刘邦还令刘氏子侄杀白马为誓：“非刘氏而王者，天下共诛之。”


    游方僧出身的朱元璋，崛起于乱世，靠部将谋臣的辅佐，得以登上皇位，建立大明江山。然而，事隔不久他便开始以血腥的手段对付功臣，其手段之残暴，株连之众可谓亘古未有。朱元璋称帝后，先后借所谓丞相胡惟庸谋反案和大将蓝玉一案大肆屠戮功臣，短短几年时间，那些帮他夺得天下的文臣武将，全被斩尽杀绝。民间盛传朱元璋“火烧庆功楼”并非毫无根据。


    到了近代，“窃国大盗”袁世凯更是把过河拆桥的伎俩运用得十分熟练。


    袁世凯为了打击国民党，指使赵秉钧派人暗杀了宋教仁。事过之后，舆论哗然，为了掩饰自己的罪行，便用起了一系列过河拆桥的伎俩。


    赵秉钧原为袁世凯的心腹，宋案发生后，作为堂堂中华民国国务总理的赵秉钧因为参与策划此案，弄得声名狼藉，只得“引嫌辞职”，借以缓和舆情。袁世凯一再告诫他“少讲话”，说是“言多必失”，“沉默胜似强辩”，暗示他默默地代人受过。赵秉钧与袁氏共事多年，十分了解袁的为人，事已至此也只好由自己充当替罪羊了。可是，袁世凯却不肯就此罢休，作为刺杀宋教仁一案的幕后指使人，他不愿让部下从此抓住把柄，于是，卸磨杀驴的行动便开始了。


    4月24日，已被逮捕的刺客武士英突然在狱中暴病身亡。法医检查多次均未找出死因。既无外伤，也无内毒，但显而易见这是有人在杀人灭口。几个月后，另一位刺宋案的要犯应桂馨又在津浦路的火车上被人刺死。


    赵秉钧得到应桂馨的死讯，愤愤不平，兔死狐悲，他意识到袁世凯要拿刺宋“功臣”开刀了。情急之下，一个电话接通了总统府。他声嘶力竭，对袁世凯大声诘问：


    “如此得此下场，以后还有谁肯为大总统办事啊！”


    对方却不动声色用不紧不慢的语调抚慰了他几句，就把电话挂断了。


    此时，一向老练的赵秉钧才猛然醒悟过来，为自己刚才的莽撞而后悔不已。他十分了解袁世凯的为人，意识到可能由此而产生的严重后果，但是一切似乎都无可挽回了。


    果然，几天后赵秉钧突然腹痛不止，七窍出血，暴死厕所中。


    事后，据个中人透露：赵秉钧之死，实系袁世凯所为。他派人买通赵府的厨人，下毒毒死了这位昔日朝夕相伴的亲信。


    赵秉钧之死，固属罪有应得，然而袁世凯过河拆桥，卸磨杀驴的手段可谓毒矣！


    一般来说，凡是有资格参与阴谋的人，在当时都是当权者心腹中的心腹，亲信中的亲信，核心中的核心，是极受当权者宠信的人物。然而，对当权者来说，在官场上是不没有任何道德可言的，一切都是为了一种明确的功利目的。当这种目的已经达到之后，当权者对于功狗们可能有两种态度：一是能笼络住的，自然还是要加以笼络，但这要付出代价，你必须一辈子对你所干过的事守口如瓶，永远对主子服服帖帖；二是笼络不住的，则必定置之死地而后安。当权者的政治品德之低劣，决不是一般人所能想像出来的。


    ## 欲加之罪，何患无辞


    一般来说，当权者惩治的对象大都是他不喜欢的人或者是他巩固权力地位的障碍。俗话说：“欲加之罪，何患无辞。”这句话尤其适用于掌权者对部下的惩处。他们往往会以“莫须有”的罪名强加于人，使部下有口难辩。特别是那些喜怒无常的当权者，同一件事此时他认为是臣下的功绩彼时很可能就被当作罪过。


    春秋时期，弥子瑕很受国君卫灵公的宠爱。


    有一次，天色已经很晚了，弥子瑕的母亲忽然得了病。有人把这个消息连夜告知弥子瑕，弥子瑕甚为着急。他就不顾一切地跑到宫里，擅自驾着卫灵公的车去给母亲看病。


    按卫国的法律规定，私自驾驶国君车子者，判处砍脚的酷刑。


    当卫灵公听说此事后，不但没判弥子瑕的罪，反而夸奖他说：“孝顺啊，为了母亲，宁愿犯会被砍脚的罪呀！”


    一天，卫灵公到果园中游玩，看到这秀丽的田园风光，顿觉视野开阔，心旷神怡。


    正在这时，同游的弥子瑕从树上摘下一个桃子，他尝了一口，觉得很甜，便献给了卫灵公。


    卫灵公正在兴奋之时，又有自己的宠臣献桃，于是便乘兴说道：“弥子瑕真是一位忠臣贤士啊。因为尊敬君主而舍弃了自己的口福。”


    时光过得真快。转眼间弥子瑕就到了年老体衰，脑子迟钝的年纪了。卫灵公对他的宠爱与日俱减。终于有一天，因为一件小事他得罪了卫灵公。


    卫灵公左思右想，总算罗列出了弥子瑕的两大罪状：“以前他曾经假托我的命令驾我的车子，又曾把他吃剩下的桃子给我吃。”


    要想惩处朝夕相处的臣下，还怕找不到借口吗？面对这样的君主，作臣下的真是哑巴吃黄连——有苦难言。宋朝靖康年间，金兵南侵，灭北宋并掳走徽、钦二帝。钦宗之弟赵构建南宋政权。当时，各地百姓奋起抗金，朝廷中也有几名大将足使金兵闻风丧胆，这就是岳飞、韩世忠和张浚，时称三大将。这三位大将都是智勇双全，在与金兵交战中多次取胜。尤其是岳飞，当时年仅二十几岁，文韬武略样样精通，又善于带兵，作战勇敢无敌，金兵一看到岳飞的旗帜就吓得屁滚尿流，金营里有句口头禅“撼山易，撼岳家军难。”如果有一个好的领导者，抗击金兵收复山河还是很有希望的。可赵构却是一个昏庸无能之人，金兵不来，他就罢免一切抗战派将领，专门起用那些投降派的官员，一味向金人求和，甚至恬不知耻地上书金营表示“愿奉正朔，比于藩臣”。金兵打来时，才慌忙起用抗战将领带兵出去迎挡。当时，岳飞等人并不十分了解宋高宗偏安江南甘当儿皇帝的心理，仍以收复河山，精忠报国为己任。这便引起了宋高宗的不满。


    赵构向金人求和的借口就是要尽孝道。当时徽、钦二帝被拘押在北庭，只有与金人议和，割地称臣，才有可能迎回二帝和太后，这样他也算尽了孝心。其实他心里也明白，无论怎样金人也不会活着放回二帝。所以他每次倡导和议都必以此为理由。其实，他的真正用心并不在此，他还有更为隐蔽无法说出的心曲，这就是他并不太愿意迎请二帝还朝。因为如果二帝真的还朝，他的皇帝宝座就会动摇，最起码是有麻烦。所以他最厌烦听岳飞说“收复河山，迎请二圣还朝”之类的话。但这在表面上又说不出口。再说，金人势力正盛，与其作战多有麻烦，不得安宁，自己也无法享受。如与之讲和，便可偏安江南一隅，国家再小，供养一个小朝廷的享用还是宽绰有余的。


    岳飞和韩世忠等人反对议和，主张武力抗金并以收复中原迎回徽、钦二帝相号召，这不能不引起赵构的不满。但这两位都是朝中大将，抵挡金兵暂时还离不开他们，只等和议既成必欲去之而后快。


    1140年，岳飞率军北伐，在郾城大败金兀术统率的金军主力。随后，岳家军乘胜追击，逼近开封。眼看收复中原已是胜利在望，宋高宗和秦桧却命令岳飞班师，连续以圣旨的名义发出十二道金牌，结果使抗金大业毁于一旦。


    岳飞班师回朝后，赵构重用秦桧向金人求和。为取媚于金人，又无中生有制造冤狱将岳飞父子逮捕。岳飞入狱后，秦桧等人挖空心思，罗织罪名，然而，岳飞为人正直，精忠报国深受部将及同僚的敬仰与尊重，各种罪名均不能成立。最后，秦桧竟在赵构指使下，以“莫须有”的罪名杀害了这位令敌人闻风丧胆的民族英雄。


    岳飞被捕后，大将韩世忠曾当面质问秦桧，岳飞究竟犯了什么罪，秦桧答道：“虽未有实据，恐怕是‘莫须有’的事情。”韩世忠愤愤地说：“‘莫须有’三字何以服天下？”


    宋高宗伙同秦桧害死岳飞，挤走韩世忠和其他主战派将领，终于达到了向金人卑躬乞和的目的。


    ## 罪过是部下的


    “事成君收其功，事败臣受其祸”，这便是千百年来掌权者的逻辑。一个当权者，如果受到了来自外部的强大压力而无法自拔，或者当他闯了大祸，干下了什么见不得人的丑行，闹得民怨沸腾，不可收拾的时候，为了平息民愤，掩人耳目，替自己开脱罪责，便经常使用嫁祸于人的伎俩。


    唐高宗年间，武后专权，引起宗室大臣不满。为了铲除异己，武则天任用酷吏施展出大屠杀的绝招，即：谁不服，就杀谁。


    有一个胡人索元礼，因告密有功，被提为游击将军，武后让他专管各种案子。元礼生性残忍，每杀一人必定株连数十百人，武后几次召见并给予赏赐。另有尚书都事周兴、来俊臣之徒，也纷纷起来仿效。


    索元礼、周兴、来俊臣等人，极尽残忍，闻所未闻。他们纠集无赖之徒数百人，并编写出《罗织经》数千言。杀人名堂也五花八门，有什么“突地吼”，“死猪愁”，“求破家”，“反是实”等名号，不一而足。


    因为告密和杀人就能被重用，就能晋升，于是索元礼等人以杀人作比赛。周兴、索元礼各杀数千人，来俊臣使一千余家家破人亡。唐所封宗室诸王共杀二十七人；唐臣中上自宰相下至县令，共有二十九人被杀。等到索元礼等人已成为全国仇敌后，为了平息民愤、掩人耳目，武后又反过来将这几个屠夫处死。因为武则天任用酷吏的目的是歼灭异己，现在目的已基本上达到了，况且由于来俊臣等人滥杀无辜，搞得黎民百姓提心吊胆，就连武后的亲信也人人自危。若让这种局面持续下去，显然对自己的统治不利。在她看来，来俊臣等人不除，民愤难以平息。除掉几个屠夫，换取天下百姓对自己的拥戴，也是值得的。可怜这几个死心塌地为武后充当帮凶的酷吏，原指望事成之后能分一杯羹，没想到倒被主子抛了出来，充当了替罪羊。就这几个替罪羊而言，固然是咎由自取；就主子而言，却未免心黑手毒。


    到了近代，当权者委过于人，搪塞责任的事更是层出不穷。


    1927年7月，孙传芳联合张宗昌向北伐军发动了反扑，身为北伐军总司令的蒋介石骄傲轻敌，误认为这是孙传芳在作困兽之斗，根本不堪一击。为了显示一下自己的指挥才能，蒋介石亲临徐州坐镇指挥。他万没料到，敌军来势凶猛，国军一时竟难以招架。蒋介石顿时手足无措，由于他乱中出错，指挥失误，终于导致了国民党军队的全线崩溃。孙传芳乘势全线反攻，直逼蒋介石在老巢南京城下。


    前线失利，蒋介石负有不可推卸的责任，刚开始他还颇为内疚，大有“无颜见江东父老”之势。但不久蒋介石就施出了委过于人的伎俩，将正在前线指挥作战的高级将领，国军第十军军长王天培作为替罪羊就地正法了。王天培追随蒋介石多年，在战场上颇为卖力，他万没料到身为总司令的蒋介石竟会如此反目无情，自己糊里糊涂就当了替罪羊。


    无独有偶。1938年长沙大火之后，蒋介石又故伎重演。


    1938年11月13日凌晨，古城长沙陡然起火。顷刻间一座繁华美丽的城市变为断垣残壁，两万人丧身火海，二三十万人流离失所。这便是抗战初期举国震惊的“长沙大火”。


    自1937年抗战爆发后，国民党当局丧师失地，华北、华东大片国土沦丧。面对气势汹汹的日本侵略军，蒋介石不愿也不敢放手发动民众抗日，把退敌的希望寄托于他的“焦土政策”。对此，蒋介石自有他的一套“理论”。想当年，拿破仑大举进攻俄国时，俄国元帅库图佐夫不正是因为火烧莫斯科才转败为胜的吗？就在武汉沦陷的第二天，蒋介石突然坐飞机赶到长沙，召集军政大员商讨对策。时任湖南省主席的张治中出席了这次会议，会议刚开始，蒋介石就迫不及待地问：“敌人来了，你们长沙怎么办？”张治中心里非常明白，这是蒋介石让他贯彻“焦土抗战”精神，但作为一省之长，烧掉这座千年古城，实在于心不忍。还没等张治中回答，蒋介石即说：“还有什么可考虑的，用火烧掉算了，我们不能住，也不能叫敌人住。”这次会议开了近两个小时，蒋介石反复交待“怎么放火，怎么放火。”这样，一座没有外国租界的长沙城，就被选定来重演莫斯科大火的故事了。


    会议结束后，刚上任的长沙警备司令酆悌奉命迅速拟订放火计划。一切都在紧锣密鼓地进行，而长沙的平民百姓却仍蒙在鼓里。不久，日军攻陷岳阳并开始挥师南下。早已被日军的嚣张气焰吓破了胆的国民党的军警，急于逃命，没等日军进攻长沙便开始纵火了。长沙大火，千年古城被付之一炬，转瞬间成了瓦砾堆。但蒋介石却没有像当年的俄国名将库图佐夫那样转败为胜。因为此时日本人还不想进攻长沙。事已至此，蒋介石只好装模作样地赶到长沙视察灾情，并下令调查起火原因。其实，究竟是怎么回事，蒋介石心里比谁都清楚。他也明白，此时不杀几个替罪羊很难平息民愤，也不好向外界交待。于是，蒋介石决定拿酆悌等人开刀。本来，酆悌等人均系蒋氏嫡系，在内战外战中替蒋介石出力卖命，充当鹰犬。他们万没料到，一向声称“爱学生”的“蒋校长”会借他们的人头来搪塞责任。


    功劳是自己的，责任是下属的，这也许是所有当权者的通病。


    数为数。因为我的计划太大，不能很快完成。事已至此，我只得把整个计划写出来，作为草案，交给全体会员讨论。


    写好草案之后，我立刻就写信给费城报馆，并于下周某天在报上刊登。先讲讲怎么创建，然后再谈如何进行。同时我又写了几个题目，呼吁有财力的人参加。


    我把计划书交给一个朋友，他是个伟大的教育家，也是个热心的公益家。他建议我修改一下，他给某个计划书写了一个序，他这个人极为诚恳，平素绝不哗众取宠。


    关于建立公共图书馆的建议案，就是按照这个计划草拟的。以后我们还要从长计议，来决定它的命运。


    我在前面说过，我最初是利用各会员带来的书籍来办公。以后会员的人数增加了，书籍也随之增加。


    于是，我们决定把所有的书籍集中起来放到一个房间里，并且定了章程，各个会员都必须遵守。


    在那个时代，整个美洲的纸张都很贵，所以，一个会员要拿出那么多钱来买书，在新大陆的穷乡僻壤中确实是一种奢侈。


    ## 第三部


    ## 缺德整人术


    缺德者以整人为本。


    缺德之人，有的表面上很慈善，而内心却像蝎子一样毒狠；有的干脆表里如一，从脸上到骨子里都凶残无比，凶狠猛于虎也。


    缺德之人，对于阻挡自己任何利益的一切人，不论是谁，全不顾死活，无情无义。


    我们不是伪君子或真小人，不可为达到某种目的而不择手段。但当对手用卑劣手段攻击时，却要学会保护自己。


    ## 男人也用媚功


    常言说：“酒不醉人，人自醉，色不迷人，人自迷。”


    又道：“酒、色、财、气”是人生四大关口，这四大关口中以“色”关最难过，多少英雄豪杰，有海量不为酒醉，为胸怀不为气阻，有豪气不为财贪，但到了“色”关，经不过三番五次的考验，一个个地拜倒在石榴裙下。


    有人说，这个方法我早已知道，无奈此种方法只适用女人，而且还要有姿色，没姿色，哪里能升官，他又举出武则天、慈禧太后、杨贵妃的例子来说明男人用此术升官发财不易。


    缺德学与一般的学说不大相同，缺德学的妙处正在于明知不能为而为之，好比是“明知山有虎，偏往虎山行”、“人间盛景，常在于险要之处”，人人都能到的地方不值一看，一般人不能到的地方，你到了，那才是人生一大享受。


    把缺德学反复的研读，从中揣摸，日而月，月而年，就可以达到出神入化的地步，一旦达此境界，其中哲理就像玻璃一样透明，真正应用于现实生活，所有问题就会迎刃而解。


    男人们使用色的技术，绝不是去搞同性恋，而是要研究追求的对象，探讨掌权者的心理。经研究你就会发现，古代的帝王，三宫六院，粉黛三千，这么多女人围住他团团转，这皇帝多数不能活多大年纪，既使能长寿，他也要在胡子一大把时，再拥上几个绝色的美女，这美女之中，有的就会被封为皇后，这年轻的皇后自然是在老皇帝死了多年，她却仍像水蜜桃一样，年纪轻轻，独守寒宫，虽然儿子登了皇位，也耐不住青春寂寞，不免春情骚动。此时你送上门的男人就会渐渐红得发紫，得以升官进爵，这就是古代人们的升官术。


    此种升官术，不用花钱，那太后财宝无数，反要倒贴，不用找人，找了人反而会秘密泄露，反为不美；不用读书，板凳需坐十年冷，满腹诗书在此也无用，要的是善于奉迎献媚，会关心体贴人，有了这一招，哪怕不学无术，哪怕是无赖流氓，也能封官进爵。


    好在中国历史一卷又一卷，我们不妨翻开几页，偶一留心，就能从中发现以色进爵的以色谋利的史实。


    唐朝时的武则天先是被太宗宠幸过一两次，被封为才子，但暗中勾引太子李治，与其发生关系。太宗死，李治即位，武则天还宫夺宠，害死王皇后，终于夺得皇后之位。李治死后，武则天行为更加放肆。有一秃驴，名叫薛怀义，与武则天是老姘头，得以封为鄂国公。此人骄横无比，他在庙中，每月开一次大会，召集善男信女，大会寺中，见有姿色的妇人，就留住禅房，任情取乐。人们都畏惧他的权势，就是妻女被淫，也只好忍气吞声，不敢过问。薛怀义在庙中取乐，不思进宫，武氏传召，时常托辞不去，十次中不过应酬三四次，武则天思欲难熬，另娶了一个主顾，便是御医沈南璆。南璆房术，不让怀义，武则天也感欢慰。薛怀义，心中不满，骂武则天负情忘义，此话传入武则天耳中，武则天大怒，把他引入宫中杀了。这秃驴以色进身，被封鄂国公，不知珍惜，寻花问柳，用情不专，最终被杀，这是违背缺德学的原则的。凡缺德者的，须有一定的度，否则，就会引火烧身。


    后来太平公主，又引入一少年陪伴武氏，这人姓张名昌宗，系故太子少傅张行族孙。昌宗有兄易之，曾袭荫居官，累迁尚乘奉御，兄弟皆丰姿秀美，通晓音律，昌宗年仅及冠，更生得眉目清扬，身材俊雅。太平公主先为说项，引得武氏动情，然后召入昌宗，衣以轻绡，傅以朱粉，浴兰芳，含鸡舌，送入武氏宫中。武氏瞧入眼中，早已十分中意，一经侍寝，说不尽的旖旎，描不完的缠绵，薛怀义无此风情，沈南璆亦渐形秽。武氏生平，从未经过这般酣艳，此番天缘相凑，幸得这妙人儿，遂不禁百体皆酥，五中俱快，绸缪竟夕，尚觉是欢娱夜短，恋恋情深。昌宗暗想，这个老淫妪，真是天下尤物，居然能通宵达旦，极乐不疲，自己还恐招架不住，遂把乃兄易之，极力推荐上去。昌宗道“臣兄才力过臣，且善炼药石，陛下若召来一试，便觉臣言非虚哩。”武氏允诺，次日即召幸易之，果然枕席功夫，比乃弟尤为进步，不过柔情媚骨，似觉稍逊一筹。武氏各取所长，也与他彻夜交欢，越宿起床视朝，即封昌宗为云麾将军，易之为司卫少卿，特赐甲第，并给奴婢、橐驼、牛马等物，外加美锦五百疋。由是二张轮流进御，大得武氏欢心，宠遇无比。晋授昌宗为银青光禄大夫，追赠二张父希爽为襄州刺史。母韦氏臧氏，并封太夫人。臧氏系昌宗生母，年逾四十，姿色未衰。平时尝有外遇，尚书李秀与他有私，武氏竟许为情夫，准他来往。二张权力日增，不到一旬，已是门无隙地，威震京都。诸武兄弟及宗楚客等，争谒门墙，伺候颜色，甚至亲与执鞭，非常羡慕，号易之为五郎，昌宗为六郎。


    张氏兄弟不怕人戳脊梁骨，侍候一老妪，而不觉恶心，可见缺德学研究得多么到家。单靠床上工夫，得以光宗耀祖，其父被封，还为母亲大人找了一个情人，真比考个状元还美，真是又“忠”又“孝”，世上难寻。


    史学家说：“脏唐乱宋”，这话一点儿不假，武则天前面走，就有人在后步其后尘。


    武则天在晚年还政给中宗，自己退了下来，韦氏得以封后，这中宗本性怯弱，而韦氏又喜弄权，于是又生出是非来。


    有一上官婉儿，姿色可人，十分聪慧，武则天十分喜爱，被封为女官，在朝中侍候。


    中宗见婉儿诗意清新，容色秀丽，在复位后大权在握，便把婉儿召幸，合成一个鸾凤交，册为婕妤，封婉儿母郑氏，为沛国夫人。其实婉儿早已破瓜，并非处子，她自与六郎相谑，被武氏斥退后，耐不得寂寞，找到了武三思。可巧武三思是个色中饿鬼，因而两人眉来眼去，勾搭成欢。婉儿与三思，年龄虽不相当，犹幸三思生得颀皙，枕席上工夫又具有特长，便也乐得将就，聊解情怀。后经中宗召幸，自叹命不犹人，更嫁老夫，所有床长风<光>，远逊三思数倍，不过因皇恩加宠，没法推辞，只得敷衍成事，暂过目前。


    偏韦氏也是个好淫妇人，平时虽与中宗亲爱，心中很有不足意。婉儿素性机警，相处数日，便已猜透八九，更放出一种柔媚手段，取悦韦氏，引得韦氏不胜喜欢，竟视婉儿是个知己。暇时辄与她谈心，不论什么衷曲，无不传宣，甚至连中冓私情，竟敢说出。尝语婉儿道：“你经皇上宠幸，滋味如何？我看似食哀家梨，未曾削皮，何能知味？”婉儿乘势迎合道：“皇后与皇上同经患难，理应同享安乐，试思皇上自复位后，今日册妃，明<日>选嫔，何人敢说声不是？难道皇上可以行乐，皇后独不能行乐么？”这数语正中韦氏心坎，却故作嗔道：“你是个坏人！我等备位宫闱，尚可似村俗妇人，去偷男子汉么？”

