    头，就什么事都干不成。清代著名画家郑板桥的名言“难得糊涂”道出了一定的历史真实。对于上班族来说，最为重要的事情就是“不随便发牢骚”。对一些事情不必斤斤计较。如果您事事认真，还会找来许多不必要的麻烦。“指鹿为马”者都没有死，“指鹿为鹿”者可是个做了“阶下囚”。糊涂人不一定能办成糊涂事。唯有智慧者才能办成“糊涂事”。自作聪明的人永远成不了大事。难怪人们常说：“露相不真人，真人不露相”。《读者》里曾记述过这么一个极其聪明的“糊涂大师”的经历：一次，他不小心闯进一家人家，因为忘了敲门，看见一位女士正在洗澡。他急中生智，一边撤退，一边嘴里念念有词地说：“对不起，先生！对不起，先生！等会儿我再来。”如此，别人不难堪，自己也不尴尬。难道我们对这样的糊涂方法不另眼相看吗？


    第五，“金蝉脱壳”法。在深奥无比的古代智慧宝典中，“三十六计”是家喻户晓的名册。您可能还知道，这“三十六计”的首计可就一个“走”字。“走为上计”已成为颠扑不破的定律。当您在单位要卷入一起不幸事件时，您不妨借口避避风、躲躲险。还是那句老话，“三十年河东，三十年河西。”不要说过几年，说不定过了几天，您就成了一条好汉。“事不关己，高高挂起”虽说有些太滑头，但在缺德场里，你不这样又有何法？“各扫自家门上雪，莫管他人瓦上霜”固然是为君子不齿的明哲保身术，但是在大难临头的时候力挽狂澜岂不是无愧之事？为了“合法”地缺德，您又何妨像“指鹿为马”中的一些人，在关键时候采取“弃权”的方式来解决？


    过瘾，我对驾驭缺德的感受就是这样。


