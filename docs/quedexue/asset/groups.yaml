    财，在晋国京城绛州大兴土木，修建起一座规模壮观的花园。园中栽有各种奇花异草，养有从各地送来的飞禽走兽，建有各式各样的亭、台、楼阁。这座花园被称为桃花园。在桃花园中央，还修筑起一座宽大的高台，台高三层，高台上面建有一座楼宇，称绛霄楼。楼内雕梁画栋，丹楹刻桷，曲槛朱栏，装饰华丽。这座花园，无论其规模、布局，装饰的华丽，景色的迷人等，在春秋列国中都是独一无二的。


    晋灵公对屠岸贾为他精心修建这座花园，大为赞赏，对屠岸贾的宠信日隆。从此以后，灵公终日与屠岸贾领着一群宫女、姬妾，到桃花园中嬉游玩耍，登上绛霄楼弹鸟饮酒取乐，甚至还命屠岸贾到晋国各地，选择良家美女，强拉硬送入桃花园中淫乐，国家大事，庶民疾苦，全不放在心上。


    屠岸贾不仅怂恿灵公嬉游荒淫，而且还助长灵公暴虐人民。有一次，晋灵公把一群伎乐召至桃花园跳舞吹奏，园外围着绛州京城的许多庶民观赏，灵公和屠岸贾则在绛霄楼摆酒观赏，他忽然心血来潮，要同屠岸贾用弹弓射出弹丸打人取乐。于是两个人进行比赛，看谁射出的弹丸准确，击中人的眼睛者为胜，击不中者罚酒一斗，击中肩膀者则免罚。当他们的弹丸射入人群时，围观人群纷纷躲避，被击中者则叫苦不迭。灵公和屠岸贾见此状兴高采烈，盛兴之下，索性叫左右侍人，凡会放弹者都来发弹射人。霎时，弹如雨点，飞入人群，人们纷纷中弹。被击中眼鼻者，弄得眼青鼻肿；被击中耳朵者，则掩耳而逃；被打掉牙齿者，多口中流血；更多的是脑袋中弹，抱头大哭。人们受此飞来之祸，又恨又恼，哭声震天，乱挤乱嚷，灵公和屠岸贾则哈哈大笑。


    我们再来看看和士开的损招。


    和士开是南北朝时北齐武成帝高湛的宠臣。他虽然身居要位，却从来没有想过怎样为国为民做一两件好事，整天只想着往上爬，抓大权，保住贵盛的地位。因而竭尽全力和挖空心思获取宠幸。他的办法就是“导上为非”，引导高湛干些无道之事，不但言辞容貌和行为举止，都极其鄙亵，夜以继旦地寻欢作乐，君主不像君主，臣下不似臣下。甚至对高湛说：“自古帝王，死了都会变成灰烬，尧舜，桀纣，有什么区别呢！所以，陛下应当趁年轻及时行乐，好好享受，不枉过这一辈子。至于国家大事吩咐大臣去办就好了，何必自己亲躬呢。”做臣属的居然对君主说出如此的话来，而高湛皇帝对这些亡国丧邦的鬼话，不仅不感到恼怒或愤恨，反而乐意接受，并且果真去干，终日醉生梦死，不问政事，偶然坐朝，也是无精打采，心不在焉，胡乱批几个字，便匆匆退朝。


    后来，和士开又把这一方法运用到后主高纬身上，同样取得满意的效果。和士开的权势达到炙手可热的程度。


    “导上为非”术用得登峰造极的莫过于仇士良了。


    仇士良是唐朝后期的一名大宦官，他先后侍奉过六朝皇帝，专权达二十余年，一直居高位的宠幸不衰，他保权固位的秘术何在？仇士良晚年退休告老时，曾对前来送行的宦官们说：“你们想侍奉好皇上，讨个好前程，这并不难，我在宫中这么多年，总还有些经验之谈，你们愿意听我说说么？”大家一听，正求之不得，连声答应。


    仇士良把他集多年经验而行之有效的秘诀，明白无误地告诉了他的门徒们。他说：“你们侍奉皇帝，绝不能让他整日闲着。他一有了空闲，就必定去看书，会见儒臣，结果就会采纳朝臣的规劝和建议，变得聪明起来，考虑问题也就比较长远了，往往会从前代的兴亡中，看出今天的忧患。他一旦这样，就不再追求吃喝享受。游山玩水，那么对我们这些人就不可能宠信，也不可能给我们更多的权力。”


    说到这里，仇士良环顾了一下四周，见大家都聚精会神地在听，于是接着又说：“所以，为着诸位今后的前程考虑，最好就是想方设法多弄钱财，供皇帝享受，整天让他放鹰玩马，追求声色，而且极尽奢侈，天天花样翻新让他高兴，使他没有空闲，一心只想玩乐，这样他就没有心思再去读书，也无暇顾及其他事，凡事全听凭我们，这样一来，皇帝的恩泽、权力又能到哪里去呢？！”


    仇士良这番话，使在场的宦官如获至宝，老前辈真是侍帝有术啊。大家慌忙跪下来，拜谢仇士良的精心指教，然后一个个心满意足地走了。仇士良这番话，的确是他“成功”的秘诀，实际上，也是多数宦官控制皇帝的主要手段。


    ## 糊涂者最聪明


    当政治对手占绝对上风，进退都可能招来杀身之祸时，有些人便打扮成疯子、傻子来掩盖自己的真实意图，迷惑对方，放松对方的警惕，以求自保。这种方法便是“装疯卖傻”。


    装疯卖傻虽说是在万般无奈的情况下采取的对策，但效果还是比较明显的。


    古代著名军事家孙膑用这种方法躲过了他的同学庞涓即将落下的屠刀。


    孙膑与庞涓同为鬼谷子的弟子，共学兵法。俩人曾结为异姓兄弟。庞涓为人刻薄寡恩，孙膑则忠厚宽谦。


    一年，庞涓听说魏国正用重金招览人材，访求将相，不觉心动，就辞别老师，下山应召。临行，孙膑相送，依依不舍。庞涓说：“咱们兄弟有八拜之交，誓同富贵。此行若有进身机会，必举荐我兄，共立功业。”


    庞涓到了魏国，魏惠文王见他一表人材，韬略出众，便拜为军师，东征西讨，屡建奇功，败齐一役，声振诸侯，庞涓大名，惊动各国。庞涓虽显赫不可一世，却还记着一个人，那就是他的义兄孙膑。他认为孙膑具有祖传“兵法十三篇”，所学胜己，一旦给他机会，便会压倒自己，故始终不予举荐。


    鬼谷子与墨翟（墨子）相好，时过从甚密。一次，墨翟往访鬼谷子，见到孙膑，交谈之后，叹为兵学奇才。墨翟回到魏国之后，在魏惠王面前举荐孙膑，说他独得其祖传兵法，天下无有对手。惠王大喜，知孙膑与庞涓又是同窗兄弟，乃请庞涓修书聘请。


    庞涓明知若孙膑一来，必然超过自己，自己的权势将受到威胁，但魏王之命，又不敢不依，乃遵命修书，遣使相迎。鬼谷子深通阴阳之术，算知孙膑之前途得失，但天机不肯泄露，只改孙宾为孙膑，并给以锦囊一个，吩咐必须到最危急的时候方可拆看。


    孙膑辞别先生，随魏王使者下山，登车而去。见了魏王，叩问兵法，孙膑对答如流，魏王非常高兴，想拜为副军师，与庞涓共掌兵权，庞涓却说：“臣与孙膑，同窗结义，膑实为臣兄，岂可以兄为副？不如权拜客卿，待建功立业，臣当让位，甘居其下。”于是膑为客卿。从此，孙、庞两人频相往来。但此时此地，没有当年那样真挚，因庞涓心怀鬼胎，想除义兄，可又想学孙膑的祖传兵法。庞涓计划待学到“孙子兵法”后才下毒手。


    有一次摆演阵法，庞涓不及孙膑。庞涓便迫不及待开始用阴谋陷害孙膑。庞涓在魏惠王面前说，孙膑身在魏国，心怀齐国，有里通外国之嫌。后来庞又假造证据，赚出孙膑笔迹，骗孙膑请假回齐省亲。魏惠王不知其故，见孙膑准备回齐，认为孙膑有背魏向齐之心，于是就削其官位，发交庞涓约束监管。庞涓乘机落井下石，私奏魏王，说孙膑虽有私通齐国之罪，罪不至死，不如砍掉他的双腿，使其成为废人，终生不能归齐，既全其命，又无后患，岂不两全？魏王依奏，庞涓立即下毒手，将孙膑一双膝盖削去，又用针刺上“私通外国”四字。庞涓还猫哭老鼠般痛哭一阵，使人敷药膝盖，抬入书馆，好言安慰。


    孙膑堕此术中，身虽残废，但对庞涓还是感激万分。庞涓一心想着经过老师鬼谷子注解的《孙子兵法》，就试探孙膑，孙膑慨然应允，决定以木简刻写出来以供庞涓阅读。


    服侍孙膑的仆人诚儿，见孙膑无辜受害，反生怜悯之心。一天庞涓召见诚儿，问孙膑每天能刻多少？诚儿答孙膑两足不便，长眠短坐，每日只写两三策！庞涓大怒，说：“如此迟慢，何日可完？你可与我加紧催促！”诚儿惶恐退出，遇一近侍，告及“军师要孙将军写书，又何必如此催促？”那近侍小声告诉：“你有所不知，军师与孙膑，外好内异，目前使他苟延残命，不外欲得此兵书，到写完之时，马上让其绝食而亡，你且不可泄露风声！”诚儿闻言大惊，没想到军师竟是如此不义之人，回去将此话密告孙膑，孙膑才知底细，想此不义之人，岂可传以兵法？转而一想，如果不写，他必发怒，我命将在旦夕，左思右想，欲求脱身之计，忽然想起老师鬼谷子当日给的锦囊及吩咐的话：“到危急时，方可开看。”孙膑随将锦囊打开，乃黄绢一副，下写着“诈疯魔”三字。“哦，原来如此！”孙膑叹了一声，轻松了许多。


    晚上，饭送来了，孙膑正要动筷子夹饭吃，突然，身子一歪仆倒在地，口吐白沫，一会儿又大呼小叫：“你不毒害我！”接着将饭盒推落在地上，把写过的木简，扔向火里焚烧，口里喃喃谩骂，语无伦次。


    诚儿不知是诈，慌忙奔告庞涓。次日，庞涓来看，见孙膑痰涎满面，伏地哈哈大笑，忽然又放声大哭。庞涓问：“兄长见我为何又笑又哭呢？”孙膑答：“我笑魏王想害我命，而不知我有十万天兵保护，我哭的是魏国除我孙膑之外，无人可挡天兵天将。”说完，瞪眼盯着庞涓，叩头不已，口叫：“鬼谷先生，你救我一命吧！”庞涓说：“我是庞某，你认错人了。”孙膑拉着其袍，不肯放手，乱叫：“先生救我！”庞涓令左右将孙膑脱，才得以脱身回府去。


    庞涓回府，心中疑惑不定，认为孙膑是诈疯，想试探其真假，于是命令左右将孙膑抛入猪栏里，粪秽狼藉，臭不可闻。孙膑披头散发，若无其事地便倒身落粪屎尿中。有人送来酒食，说是偷偷瞒过军师送来的，是哀怜先生被刖之意。孙膑当然知道这是庞涓的把戏，便怒目大骂：“你又来毒我吗？”随将酒食倒翻在地，使者顺手拾起猪屎及臭泥块给他，他却抢过去送到口里吃了。使者将情况报知庞涓。庞涓说：“他已真疯了，不足为虑矣。”从此，便对孙膑不加防范了，任其出入，只派人跟踪而已。


    “孙疯子”行踪无定，早出晚归，仍以猪栏为室，有时整夜不归，睡在街边或荒屋中，在外时捡些食物充饥，时哭时笑，没有人怀疑他是装疯卖傻。


    这时墨翟云游到齐国，住在大臣田忌家里，其弟子禽滑也从魏国来。墨翟问他：“孙膑在魏国得志否？”禽滑随将孙膑被刖膝之事告之。墨翟听后大惊，叹曰：“我当日本想推荐他，今反而把他害惨了。”


    于是墨翟乃将孙膑之才及庞涓妒忌之事，转告于田忌，田忌又转告于齐威王。齐王以为本国有如是将才，见辱于他国，不只丢面，更重要是损失，便说：“寡人即刻迎孙膑回国！”


    田忌却说：“投鼠须忌器，孙膑既不见容于魏国，又怎容他回齐国呢？此事只可以智取，不可以硬碰，需如此如此，这般这般，密载以还，方保万全。”威王用其谋，即令客卿淳于髡为使，禽滑装作随从，假以进茶为名，到魏国去相机行事。


    淳于髡到了魏国见过惠王，讲明来意。惠王大喜，安顿淳于髡于迎宾馆住下，随从禽滑私下去找孙膑。一天晚上，找到了，见孙膑靠坐于井栏边，对着禽滑瞪眼不语。禽滑走到跟前哭泣着说：“我是墨子的学生禽滑，老师已把你的冤屈告之齐王，齐王命我和淳于髡假以进茶为名，实欲偷载你回齐，为你报此刖膝之仇，请不必见疑。”好一会儿，孙膑才点头，流着泪说：“唉，我以为今世永无此日了。今有此机会实心相告，庞涓疑虑太甚，恐多有不便。”禽滑说：“这一层你可放心，我已计划好了，到起程时我会亲自相迎。”同时约好第二天碰头地点及时间才离开。


    第二天，淳于髡一行要回国了，魏王置酒相待，庞涓也在长亭置酒饯行，但禽滑已于前夜把孙膑藏在温车里，叫随从王义穿起孙膑的衣服，披头散发，以稀泥涂面，装作孙膑模样，在街上疯疯癫癫的，瞒过了盯梢的，也瞒过了庞涓。


    禽滑驱车速行，淳于髡拥后，很快把孙膑载回齐国。过了几天，那位假孙膑也脱身回来。跟踪孙膑的人但见孙膑的脏衣服散在河边，报告庞涓，都认为孙膑已投水死了，根本不怀疑他会回到齐国去。


    孙膑秘密返齐，不出名不露面。后来赵魏交战，孙膑以“围魏救赵”之计，大败庞涓。韩魏之役，孙膑再“增兵减灶”之计，诱敌深入，终于把庞涓射死于马陵道。


    司马懿则用此术骗过了政敌曹爽。


    魏明帝死，幼子齐王曹芳即位。根据明帝遗诏，大将军曹爽、大尉司马懿共同辅政。曹爽是皇帝的叔父，司马懿是三朝名将，两人的地位不相上下。常言说，一山难容二虎，曹爽自恃是皇亲国戚，想要独揽大权，视司马懿为最大的绊脚石，总想将他搞掉。但司马懿岂是等闲之辈，不论年资、才干还是威望，司马懿都要远远高于曹爽，他又何尝不想把曹爽端掉呢？可他明白，曹爽身为皇叔，挟制天下，眼下还不是同他争锋的时候。他决定退避三舍，让人送书朝廷，说自己风痛（即中风偏瘫病）复发，不能上朝议事。


    司马懿居家不出，正中曹爽下怀，心病一去，得意忘形。终日与何晏、邓飏等人吃喝玩乐，作威作福，饮食车服一如皇帝规格，甚至把宫中的嫔妃、乐师也取回家中充作乐伎。而司马懿却一直在暗中窥测时机，以求一逞。


    不过，正在放纵欢乐的曹爽也没有忘记司马懿的存在。正始九年，曹爽的心腹李胜出任荆州刺史，曹爽便让他去司马懿处告辞，借机窥探一下司马懿的动静。到了司马懿家门口，李胜对守门的人说：“我没有什么功劳，只是由于皇帝看重而就任荆州，特地到阁中拜辞。”守门人便把他引过去见司马懿。


    一听说李胜来辞行，司马懿已经知道了李胜的真实用意，便让两个婢女搀扶着，自己坐在床上。见到李胜之后，用手拿衣服，衣服掉在地上，又向婢女示意口渴，婢女送上一碗粥，司马懿喝粥时，粥汁又都顺着口角流到胸前。看到司马懿如此衰朽不堪，李胜装模作样地哭着说：“方今主上尚幼，天下人都依赖明公，人们只听说您风病复发，可是没想到病得这么严重。”这时，司马懿长呼一口气说：“我年老沉疾，危在旦夕。君屈当并州，并州离胡人很近，好自为之，恐怕我们不能再见面了。”李胜连忙纠正说：“我是赴任本州，不是并州。”司马懿又故作昏谬地说：“君要去并州，努力自爱。”这时的李胜，再也顾不得用那些文雅的交际语言了，说：“我是去荆州，不是并州。”司马懿这才稍稍地明白过来，说：“君还本州做刺史，盛德壮烈，好建功勋，我与你分别以后，恐怕再也见不到面了。”接着，就把两个儿子司马师、司马昭叫出来，并让他们与李胜结为朋友，求李胜在他死后多多照顾，说着，司马懿又呜咽起来。其实，司马懿这时身体状况很好，故意装作昏聩的样子来迷惑李胜。李胜是荆州人，所以把到荆州做刺史说作：“当忝本州”，本、并音近，正好被司马懿钻了空子。李胜从司马懿家出来，复见曹爽，乐不可支地说：“太傅语言错误，口不摄杯，指南为北，肯定活不长了。”从此，曹爽不复以司马懿为意。


    第二年正月，幼主曹芳按惯例到高平陵去祭祀祖先，曹爽兄弟都随驾出行。司马懿立即在城中部署兵马，先占据了武库，控制了都城，随后，出屯在洛水浮桥。派人向曹爽等人送信说：“臣以前从辽东归还时，先帝诏陛下、秦王和臣一起升坐御床，把着臣的手臂，深以后事为念。臣对先帝说：‘二祖也曾嘱托臣后事，这些陛下都已见到了，万一有不如意的事情，臣一定以死奉明诏。’黄门令董箕等人都在场。今天大将军曹爽背弃顾命，败乱国典，内则僭拟，外专威权，破坏诸营，尽据禁兵，群官要职，皆置所亲，天下汹汹，人心危惧。过去赵高极意，秦氏以灭；吕、霍早断，汉祚永世。现在皇太后命令臣辄敕主者及黄门令罢免曹爽兄弟官职，自回家中，不得在外逗留，如果胆敢稽留车驾，便以军法从事。”


    曹爽得到司马懿的书信，顿时手足无措。这时，大司农桓范从昌平门跑出来见到曹爽说：“现在，应该让车驾幸许昌，招集外郡兵马，讨伐司马懿。”可是，曹爽反复看司马懿的信，觉得司马懿只是想要夺他的兵权，并没有杀他的意思，而且家属都在京城以内，就想罢兵投降，说：“即使没有兵权，我还可以做一个富家翁。”于是，罢兵回城。这时的曹爽，已经六神无主，罢兵回城，正是下策，如果听从桓范的建议，挟天子以令不臣，当然有可胜之势。


    曹爽兄弟回家之后，司马懿征发民工八百人，在爽家宅第围筑高楼，布置人在上面观察曹爽的举动。曹爽兄弟不知道司马懿究竟做什么打算，便给司马懿写了一封信，说家中没有粮食了，求司马懿接济一些。司马懿接到书信，马上命人送来一百斛，并且又送了一些肉脯、大豆，曹爽兄弟见司马懿送粮给他们，又都欢喜起来，以为自己可以免死了。这一次，曹爽又上了司马懿的当。这期间，司马懿在朝中翦除曹爽的党羽，把何晏、邓飏等人悉皆罢官免职，收入监中，不久，又收曹爽兄弟下狱，以谋大逆的罪名，诛杀净尽。从而，司马氏与曹氏的权之争以司马氏的胜利而告终。为司马氏篡魏铺平了道路。


    ## 炮弹不如肉弹


    饱暖思淫欲，高贵显权，衣食无虞，对国家利益，百姓疾苦又漫不经心，于是他们的精力就只好花在“玩”字上了。纵观封建官场，当权者大多以淫色作为玩的第一等选择。为了一个女子，他们可以争风吃醋，甚至不惜大动干戈。这样一来，那些拍马攀上之徒，或色鬼们的政治对手，就有隙可钻，他们投其所好，献上美人肉弹，让其尽情享受，讨得他的欢心，或消磨他的意志，最后趁虚而入，夺取他的权力。


    历史上不知有多少色鬼败倒在石榴裙下，丢了江山，失了权力，甚至丢了生命。


    吴王夫差就是一个。


    公元前 489 年，越王勾践从吴国脱身以后，抱定灭吴的决心，不惜进贡大批金银财宝，珍玩狗马，目的是使夫差更加骄纵任性，玩物丧志。


    这还不算，他还采纳了大夫文种的建议，在国内四境选择美女数千人，其中选了两个漂亮的女子，一个叫西施，一个叫郑旦。


    这西施尤其美丽，勾践把她们二人养在深宫里，每日教她们唱歌跳舞。歌舞学成之后，又给她们穿上用绫罗绸缎做的衣服，坐上帷帘重重的马车，让范蠡大夫把她们奉献给吴王。


    吴王见了美人，大喜过望。便把她们安置在姑苏台上，在灵崖上动土修建馆娃宫，又专门为二人造了响屐廊，修了采香径，奢侈华丽，无与伦比。吴王整日陪伴两人游玩嬉乐，不理朝政。特别是对西施更加宠爱，有求必应，以致于到了言听计从的地步。


    伍子胥看破越王勾践的用心，数次向夫差进谏。但夫差为美色所迷，只是不听。后来，吴国终于被越国灭掉，勾践报了大仇。


    董卓也是一个。


    公元 189 年，汉灵帝病故，少帝刘辩即位，其舅何进执掌朝政。由于汉桓帝以来都宠信宦官，以张让、赵忠等人为首的宦官徒党横行不法，屡举大狱陷害大臣。为了扭转这种局面，何进便与司隶校尉袁绍密谋杀宦官，并且援引关中豪强董卓的军队进京，帮助行事。董卓原是陇西人，在黄巾起义以后，在关巾一带养成了势力。在接到何进的书信之后，他看到这正是实行他野心的好机会，立即带兵向洛阳进发。但是，董卓还没有到达洛阳，何进由于事机不密，反被宦官杀害。接着，袁绍等人乘乱起兵诛杀宦官，京师一片大乱。宦官张让等人于慌乱之中劫持了少帝刘辩和陈留王刘协逃出洛阳，黑夜之中，来到小平津。后有追兵，前有大河，在无路可逃的情况下，张让等人投河而死。这时，董卓恰好带兵赶到这里，把少帝和刘协接到军中，护送回洛阳，这偶然的巧合，使董卓坐享了保驾之功。


    董卓刚到洛阳的时候，手下只有三千多人。他感到要篡夺朝政，这一点兵力是远远不够的，便图谋发展自己的势力。不久，董卓收买了执金吾丁原的部将吕布，刺死了丁原，吞并了丁原的军队，实力得到了加强。不久，又与袁绍发生矛盾，袁绍为了避难，逃到了冀州。自此，朝廷完全控制在董卓一人手中。


    在朝廷中的敌对势力消除之后，董卓篡逆的野心暴露得更加明显。九月，董卓废了少帝，立陈留王刘协为皇帝，是为汉献帝。接着，董卓又逼迫汉献帝封他为太尉兼前将军、郿侯，以后又晋升为相国。并且征派民夫在郿修筑了极为坚固的坞堡，在里面屯积了足够
    30 年吃用的粮食、物资，公然声称即使不能取得帝位，郿坞也可以坚守几十年。他篡夺帝位的心情愈益急切，在朝中的行为也变得愈益残暴，常常在朝廷之上殴杀大臣，自己则佩剑上殿，甚至衣服仪仗也完全与汉献帝相同。


    董卓的所作所为，引起了广泛的不满。第二年正月，逃出在外的袁绍、曹操等人联合一部分州刺史、郡太守起兵讨伐董卓。为了抵御各地勤王军队，董卓竟然毒死刘辩，胁迫汉献帝迁都到长安，把洛阳周围二百里地区烧为一片废墟。而各路军马也由于各怀心事，不能协同作战，以没有任何结果而告终。这样，依靠地方的勤王部队来解决朝廷问题的希望彻底破产了，铲除董卓的重任便落到了王允等朝官的肩上。


    王允，当时在朝中做司徒，由于才智过人，久负盛名。但是，苦于手中没有军队，在董卓专权日益严重的情况下，他只得与董卓曲意周旋。当迁都长安以后，董卓驻守在洛阳，朝中的事务全部委托给王允。从此，王允开始了诛除董卓的一系列步骤。


    董卓之所以敢在朝中公然图谋篡逆，主要是有骁将吕布辅佐。吕布，字奉先。在刺杀丁原，投靠董卓之后，二人结为父子，成为董卓的鹰犬。董卓因为自己多行不义，时常防备不测，出入总是把吕布带在身边。因此，欲除董卓，必须首先离间董卓与吕布的关系。经过一番观察，王允发现了二人共同的弱点，即他们都是色中饿鬼。恰好王允家中有一个侍妾名叫貂

