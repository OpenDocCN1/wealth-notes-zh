  - "[PAGE 292]\n\n# 缺德史话\n\n但有时做得过了头，不仅不能达到树德立威的目的，反而引起臣下的逆反心理，结果适得其反。\n\n 民国初年，袁世凯一心想登上皇帝的宝座。他指使党羽大造舆论，一时间谣言四起，劝进者络绎不绝。袁世凯不禁暗自高兴，但表面上装得煞有介事，一有机会就向别人表白自己是忠于民国的。即便是在他的心腹大将冯国璋、段祺瑞面前也是如此。\n\
    \n据说，冯国璋曾专程赶到北京向袁世凯探听虚实。袁世凯装得一本正经：“华甫，你我是自己人，难道你不懂得我的心事！不妨对你明说，总统的权力和责任已经与皇帝没有区别，除非为儿孙打算，实在没有做皇帝的必要。我的大儿子身带残疾，老二想做名士，我给他们排长做都不放心，能够付以国家的重任吗？而且，中国一部历史，帝王家总是没有好结果的，即使为儿孙打算，我更不忍把灾害留给他们。当然，皇帝还可以传贤不传子。但总统同样可以传贤，在这个问题上总统皇帝不就是一样的吗？”\n\
    \n冯国璋听后插言道：“总统说的是肺腑之言。可是，将来总统功德巍巍，到了天与人归的时候，只怕要推也推不掉啊！”\n\n袁好像很生气的样子，坚定地说：“不，我决不干这种傻事！我有一个孩子在伦敦读书，我叫他在那里置了一点产业。如果有人一定要逼迫我，我就出国到伦敦，从此不问国事。”\n\
    \n冯国璋听了老袁如此诚恳和坚定的表白，自然也就不存在任何疑心了。\n\n然而，冯国璋刚刚离开袁府，袁世凯就气冲冲地回到书房，大骂冯国璋忘恩负义，连声说：“冯华甫真是岂有此理！华甫真是岂有此理！”"
  - '[PAGE 293]


    # # 缺德学 · 281 ·


    老奸巨猾的袁世凯向来喜欢让部下猜测自己的心思，由于城府过深连心腹大将有时也难以领会其真实意图。冯国璋自恃跟随老袁多年，把袁世凯的一番假话当成了肺腑之言。但纸是包不住火的，冯国璋刚回南京，活灵活现的帝制机关筹安会便公然通电成立了。冯不禁跳起脚来发火说：“老头子真会做戏！他哪里还把我当作自己人！”从此与老袁分道扬镳。真可谓“聪明反被聪明误”，袁世凯深藏不露，机关算尽，结果只落得个部下离心离德，众叛亲离的可悲下场！


    # ## 高帽子愈大愈好


    聪明的掌权者一般不会让部下的权力过分膨胀，他会采取各种手段加以制止、预防，除了严刑重罚以外，明升暗降便是最常用的一种防范手段。有些部下德高望重，功勋卓著，又没有什么过错把柄，杀掉显然没有理由，而且会产生不良影响，但留着又不放心，于是便来个“明升暗降”，给你显赫的头衔、很大的荣耀，但暗中却夺去你的实权，虽然你对这种权术洞若观火，却哑巴吃黄连，有苦难言，只有乖乖就范。


    宋太祖赵匡胤建立北宋后，见天下已定，决定及早剥夺功勋显赫、至今重权在握的大将石守信、王审琦等人的军权。


    这就是历史上有名的“杯酒释兵权”。


    历史往往有惊人的相似之处。公元 1141 年 4 月，又一次“杯酒释兵权”的闹剧在杭州重演了。南宋宰相秦桧盛摆筵宴，招待朝廷中鼎鼎大名的三大将：张俊、韩世忠和岳飞。这三人，是南宋初年的著名将领，每人统率着十几万精兵，驻守在从长江上游到淮河口的千里江防线上，是南宋抗金的主要武装'
  - '[PAGE 294]


    力量。


    对于这几位大将，软骨头皇帝赵构觉得很难办。宋朝从开国以来一直重文轻武，不许武臣干政，甚至也不许直接掌握军权。赵构南逃以来，由于金人不断南侵，南宋的半壁江山全靠这几位大将支撑着。他不敢得罪他们，但对他们手中日益壮大的兵权、实力，赵构一直寝食难安。再说，要同金人议和，这几位大将必然反对，自己当儿皇帝苟且偷安的计划便难以实现。卖国贼秦桧非常了解赵构的苦衷，处心积虑。必欲置几位抗金将领于死地而后快。昏君奸臣一拍即合，经过一番密谋策划后，决定以庆功为名将三大将召到临安，解除他们的兵权。


    酒过三巡之后，秦桧突然宣读圣旨：授张俊、韩世忠为枢密使，岳飞为副枢密使，免去三人原任职务，三将原来统率的军队，一律由朝廷指挥。


    所谓枢密正副使，是中央政府的正副军事长官。从表面上看，这三个人从原来一路军队的统帅改任为朝廷的最高统帅，似乎是升了一级，但他们脱离了自己的军队，便如虎落平阳，难以再发挥什么作用了。说白了，这是明里升官，暗夺其权，他们完全被架空了。


    如果说赵匡胤“杯酒释兵权”是为了大宋王朝长治久安的话，赵构的所作所为只能说是为他此后的屈辱求和扫除了障碍。


    # 无处不在的第三只眼


    中国的特务机构，创始于明代。明朝的特务统治是历史闻名的，早在立国之初，便设立了专门的特务机构锦衣卫，后来'
  - '[PAGE 295]


    又增加了东厂、西厂。这些机构的特务多如牛毛，遍布在京城的每个角落，以至全国的城乡，严密监视着大小官员，以至普通百姓。


    始作俑者，便是开国皇帝朱元璋，这个人生性极为多疑，他对大臣的监视几乎到了毛发必究的地步，大臣家中一些极为琐细之事，如请了什么客，饮的是什么酒，两口子为什么吵架生气，都会及时反映到他那里，他也时常用这些事盘问大臣。这对大臣在心理上所产生的压力是十分巨大的，当他感到皇帝的眼睛时时刻刻在盯着自己时，他还敢有什么出轨的言行吗？


    到了近代，中国的特务机构发展到了登峰造极的地步。特别是在蒋介石建立南京政权以后，中国出现了“中统”和“军统”两大特务系统，并形成了遍布全国的特务统治网络，即便在蒋介石逃离大陆以后，潜伏下来的特务尚有60万人之多。


    蒋介石热衷于特务统治，主要在于此人生性多疑，心胸狭窄。蒋家王朝建立后，更时时防备有人图谋不轨，害怕大权旁落。他对任何人都持怀疑的目光，亲戚、朋友、部下、对手，概莫能外。


    据说，蒋介石用将，有个定规，要么出身黄埔，要么来自浙江。“学非黄埔，省非浙江，作官无路，眼泪汪汪”。他对一些凭战功晋升的非浙江省、非黄埔系的将领，总是千方百计限制其所辖军队的权力，并派人暗中监视其行动。卫立煌属蒋介石的“五虎上将”之一，被誉为常胜将军。但每次打完仗后，不是派其“进修”，就是委以虚名。1933年卫立煌在平息福建事变过程中又为蒋立了大功，但结果是卫的第五路军被解散了。为此，卫立煌不免发牢骚。这天，他和第五路军的其他几位高级军官在杭州西湖畔的迎春饭店宴会，酒后打“卫生麻'
  - '[PAGE 296]


    将”到天亮方散。次日中午卫立煌接到老蒋的电报，最后一句称“昨晚胜负如何？”千里之外的老蒋对卫立煌的一举一动了如指掌，这分明是有耳目在卫身边。于是，卫立煌回电：“昨晚欢宴过晚，是我的责任，我有错误。”午后，蒋复电：“戏言也，勿介意”。


    蒋介石对自己这一套特务手段似乎颇为得意，但“聪明反被聪明误”，更多的同道、部属却因此心灰意冷，离心离德，甚至私结朋党、多生反骨。到头来，“哗啦啦如大厦倾”，蒋家王朝众叛亲离，分崩离析，寿终正寝。


    # 狡兔死，走狗烹


    从历史上看，成大业的人，都能广揽人才，礼贤下士。他们统治的方法各种各样，五花八门，但无论怎样变化，总离不开两个基本点，一点是柔，一点是刚，如果能刚柔相济，其统治就稳定。


    柔与刚，都是正统的统御策略，从柔的一方面讲，施惠于民，减免赋税，于民有利；从刚的这一面讲，加强法制，严明刑罚，这也于民有利。


    从官场权术来说，柔可以理解为拉拢、软化，以小恩小惠私结之；刚则可以理解为对下属的高压政策。一个成功的统治者，要学会交替使用赏罚二柄，这在西方被称为“胡萝卜加大棒。”


    人们常说：“刑不上大夫，礼不下庶人”，以为统治者的严刑重罚主要是用来对付平民百姓的。其实并非如此。对统治者来说，刑罚主要还是用来对付他身边那些与之朝夕相处的部'
  - '[PAGE 297]


    下。因为这些人会对他形成实际的或潜在的威胁。


    一般来说，当权者施用刑罚的对象，不外乎这样两种人：一种是他认为有可能对他的地位、人身安全、名誉声望造成威胁的人；一种是他不喜欢的人。俗话说：“伴君如伴虎”，欲加之罪，何患无辞。当权者的政治品德，由此可见一斑。


    过河拆桥是掌权者经常使用的一种政治权术，即在达到目的之后，将帮助过自己的人一脚踢开。


    古往今来，奸诈的当权者无不遵循这样的原则：当他们用人之际，不惜弯下腰来，广招贤才，俨然一副正人君子的模样，诸如刘邦设坛拜韩信为将等。一旦大功告成，就翻脸无情，什么山盟海誓，统统忘掉，翻脸不认人，视亲为仇，视友为敌，必欲置之死地而后快。


    这正是所谓：“高鸟尽，良弓藏；狡兔死，走狗烹；敌国破，谋臣亡”。


    揭开历史，从古代直到近代，当权者无不心狠手辣，惯用卸磨杀驴的伎俩。


    越王勾践“卧薪尝胆”的故事，在中国可以说是家喻户晓，妇孺皆知。然而，勾践其人实际上是一个忘恩负义、反目无情的小人，臣下只能与他“共患难”，不能与之“共欢乐”。当勾践被围在会稽山上，粮尽援绝之时，有两个功臣为之出谋划策，与之同甘共苦，为勾践复兴越国立下汗马功劳。这两个人便是范蠡和文种。勾践听从了范蠡和文种的计策，经过十年生聚，十年教训，终于打败了吴国，成就了霸业。俗话说“功高震主”，就在欢庆胜利的时刻，范蠡根据自己对勾践多年的观察和了解，深知此人难以长期共事，便借机抽身潜逃，弃官经商去了。'
  - '[PAGE 298]


    # 缺德史话


    临行之前，范蠡派人给文种送来一封信。信中说：“飞鸟尽，良弓藏；狡兔死，走狗烹。越王这个人长得脖子细长，嘴像鸟嘴一样。这种人只可与其共患难，不可与其共享乐。先生为什么不尽早离他而去呢？”


    文种看信后，觉得有道理。回想起这些天来，越王对自己的态度是越来越冷淡了，许多重大事情也不同自己商量了。看来越王确实可能对自己有戒心。但文种还是不相信越王会对自己下毒手。不管怎么说，自己对越国的强大立下了大功，而且对越王又是忠心耿耿。文种左思右想，还是舍不得在越国的荣华富贵，但又不好继续呆在越王身边，便决定向越王称病，在家休养，以为这样就相安无事了。


    越王勾践对文种的才能是深深了解的，也知道在自己称霸之后，文种的才能很难再得到充分发挥。况且，在越国击败吴国的过程中，文种所起的作用是巨大的，封给他再大的官职，再多的财物都不能算过分。也正因为如此，越王勾践才对文种的存在表示担忧。万一他真的作起乱来，自己控制不了局势，那就晚了。


    于是，他借探病为名，来见文种，问他道：“先生曾以灭吴的七种手段指教过我，我只采用了其中的三种，便将吴国灭了，还剩下四种，你打算再怎么去使用呀？”


    文种说：“我看不出它们还有什么用处。”


    勾践说：“请先生带了这四种手段，到九泉之下去辅佐我的先人吧！”


    说罢起身登车而去，留下了一把名为“屡镂”的利剑。文种顿时明白了，当年吴王夫差就是用这把剑让一代忠臣伍子胥命归黄泉的，万没想到自己也会落得伍子胥那样的悲惨下场。'
  md: '

    时既无祖宗可认又无女婿可做，便只好编造自欺欺人的鬼话用以糊弄众人。


    在古代，人们大都相信所谓“天意”、“君权神授”，一个皇帝之所以能当上皇帝，是出自“天意”，并不只是由于人力。文官是天上的“文曲星”，武将也是天上的“星宿”，都不是凡人。因此，在取得某种权力地位之后，总要编造出许多离奇的神话，以证明自己权力的取得，实在是“受命于天”，以此来增强政权和个人的权威性，慑服臣僚。


    这些故事在今天看来自然是十分荒诞可笑的，但它却是中国古代官场中一种十分重要的现象，形成了一种历史悠久的造神运动。


    据说，在刘备当皇帝以前，尽管他家境贫寒靠织履编席为生，但也有许多与常人不同之处。刘备天生一对大耳朵，史书上称他“大耳垂肩”，天生一副帝王相。刘备家门口有一棵高耸入云的大杨树，据说很像帝王用的黄龙伞。本来，一个人的耳朵大一点并没有什么值得奇怪的，一棵普通的大树也根本没有必要载入史册，只因为刘备后来做了皇帝，这一切便统统成了“异象”。


    陈胜、吴广在密谋起义时，为了慑服众人也曾采用迷信的方法证明自己的行动出自“天意”。吴广在一块绢帕上写了“陈胜王”三个字，塞入鱼腹中，故意让部下在吃鱼的时候见到。随后，他又在夜深人静时装神弄鬼，打着灯笼在树林丛中时隐时现装出狐狸的叫声，喊着“楚国将兴，陈胜为王”。这一切当然只有他们两人知道。普通的士卒大都很迷信，听到见到这些怪异现象自然以为这一切都是“天意”，是上天的安排，所以等到陈胜、吴广杀死监军号召起义时马上群起响应，后来又推举陈胜为王。陈胜的个人权威就是这样树立起来的。


    汉高祖刘邦在做皇帝以前本是沛县的农家子弟，没有一点可资吹嘘的贵族血统。而且，刘邦在起义前只不过是一个横行乡里的地痞无赖，劣迹斑斑。在夺取帝位后，为了抬高自己的身份，增强影响力和号召力，刘邦苦心孤诣地编造出了许多荒诞的神话。


    据说，刘邦曾是中国的一名亭长，负责押送一批犯人前往咸阳。途中，有许多犯人逃跑。刘邦自知难以复命，干脆把犯人全都放了，自己带着几个人亡命于芒砀山中。刘邦在亡命途中斩了一条拦路的大蛇，这本是一件极平常的事，但不久即传说有一位老太太在这里哭泣，说什么她的儿子本是白帝的后代，被赤帝的儿子杀了，因此伤心落泪。这便是著名的刘邦斩白蛇起义的故事。既然刘邦的父亲是赤帝，刘邦便成了“真龙天子”，命中注定要当皇帝。


    这种类似的小花招在历朝历代都时有所闻，其用意是不言自明的。


    唐太宗李世民为了夺取帝位发动“玄武门之变”，亲手杀死了自己的皇兄御弟，并带兵入宫强迫父亲让位于他。然而，就在李世民登上皇帝宝座以后不久，也编造了一个精彩动人的神话以证明自己夺取帝位的合法性。据说，在李世民出生时，他的父亲李渊梦见两条龙在天空飞舞，大喊“济世安民”，李世民的名字即由此而来。这显然是某些人的穿凿附会。类似的记载在历史上还有很多。


    没有神话可以制造神话，没有理论可以制造理论，没有证据可以制造证据。为了攫取和巩固自己的权力地位，为了有效地驾驭臣下，身居高位的统治者是什么骗局都可以制造出来的。这是中国封建统治术中最为重要的内容，是愚民政策的一个重要方面。


    ## 一朝天子一朝臣


    俗话说：“一朝天子一朝臣。”当权者要想有效地巩固权力地位，树立个人权威，就必须大量提拔重用亲信。任人唯亲，这是古今中外掌权者的通病。即使是那些贤明的君王也不得不“明知其不可为而为之”。


    一般来说，掌权者在用人时首先关心的便是对方是否对自己忠诚，才能倒在其次。若是任用一个颇能干但对自己怀有二心的部下，天长日久势必会大权旁落，这岂不是养虎遗患？因此，重用亲信，排斥异己，形成自己的一派政治势力，这也是统治者驾驭臣僚，树立和巩固个人权威的重要手段。


    蒋介石用人，一般有两个标准，一是看对方是不是黄埔系，二是看对方是不是浙江人。对自己的嫡系部属，蒋介石恩宠有加，常常委以重任。除非万不得已，蒋介石不会重用非嫡系的人。在用人方面，蒋介石有其独特的方法。在他看来才学固然是一个重要标准，而对他忠诚却是第一标准。


    阎锡山的用人规则与蒋介石有一定的相通之处。蒋介石用人要过问是不是黄埔系，是不是浙江籍；阎锡山当政时山西有句民谣：“会说五台话，就把洋刀挎”，可见在晋系军阀中，阎锡山的五台老乡占了相当大的比例。由于阎锡山吸收人才限于山西，使人才的来源受到限制，因此，不能说是人才济济。阎老西拘于地域观念，大量使用为己所用的奴才，确实团结了一大批人达到了树德立威，巩固自身地位的目的，也为山西政局的相对稳定起了一定的作用。


    阎锡山善于提拔安排自己的心腹，这些心腹对他十分忠诚。1930年中原大战失败后，阎逃到大连隐居。山西被张学良接管，张学良对山西进行“整编缩军”。阎召集徐永昌、商震、傅作义等部下到天津商讨“整编”方案。这些晋军将领虽然领受了张学良的命令，但又在暗地里接受了阎锡山的操纵和遥控。山西的一切变更，包括人事安排，确定政策等，都必须向阎锡山汇报后才能决定。1931年8月，阎锡山潜回山西后，晋军将领直接受其指挥，他与亲信定下计谋，终于驱逐了蒋在山西的势力，东山再起，重握山西大权。


    阎锡山是民国年间少有的“不倒翁”，他之所以能屡挫屡起，除了善于运用政治权术外，其独特的用人方法起了不可估量的作用。有了一批忠于自己的部下，便可在险恶的政治风浪中翻云覆雨，纵横捭阖，而不必有后顾之忧。


    明朝末年，宦官专权，阉党猖獗。赌棍出身的魏忠贤独揽朝政。为了树立和巩固自己的个人权威，魏忠贤一方面排斥异己，对朝中的官员来了一次大清洗，凡是他看着不顺眼的不附和他的人都一律罢免。同时大量安插亲信，把效忠于他的那些卑鄙小人都派上官职，就连早年和他一起赌博的相好的赌徒们都当上了朝廷命官，里里外外，上上下下都布满了他的亲党。


    以魏忠贤为首的阉党上下勾结，狼狈为奸，到处兴风作浪。朝中正直保身之臣大都自动去职，贪恋禄位之吏亦相戒钳口。为了根除东林党人在朝中的势力，吏部尚书王绍徽秉承魏逆的旨意仿照《水浒传》的人数编排了东林党人一百单八将的名单，献给魏忠贤。魏忠贤按名黜汰，朝廷为之半空。魏忠贤又把自己原有的旧党逐一提拔，把那些刚投靠来的新党逐一安排，里里外外全换了他的人。文官有崔呈秀、田吉等人为之出谋划策，讲解起草诏书，时称“五虎”；武臣方面有田尔耕、许显纯等主掌武装杀戮之事，时称“五彪”，吏部有周应秋等人号称“十狗”，另外还有“十孩儿”、“四十孙儿”等名目。当时朝廷中受重用属魏忠贤一党的人在社会上大都得到了此类的封号。


    不仅如此，这是高一层次直接统属于魏忠贤的。这些“虎”、“彪”、“狗”之下每人又有自己的小体系，各有孝子贤孙，虎儿、彪孩、狗崽比比皆是，布满朝廷。朝中简直要成个动物园了。这样从内阁六部直到各地总督、巡抚乃至于州县都是阉党之人，网络严密，盘根错节，势焰熏天。魏忠贤的“威望”也空前提高，有些马屁精竟在各地替他建起了“生祠”，极力颂扬魏忠贤的所谓“功德”。魏逆的地位日益巩固。


    魏忠贤固然属于一世奸雄，然而一个无才无德的无赖赌徒竟能左右天下，祸国殃民到这种地步，其结党营私，任人唯亲的手段起了不可估量的作用。


    ## 像雨像雾又像风


    深藏不露是君王用以控制臣下的一种手段。聪明的当权者，一般不愿轻易表露自己的观点、见解和喜怒哀乐，而是把自己的思想感情隐藏起来，以免让别人窥出自己的底细和实力。这也是在臣下面前树立权威的重要方法。大凡帝王的深藏不露，或是由于情况不明，不便表态；或是由于时机未到，不可鲁莽；或者由于形势不利，无力反击。因此，帝王的深藏不露，便是为了弄清情况等待时机、积蓄力量，而决不是长期隐忍，无所作为。


    春秋时，年轻的楚庄王登基之后便宣布：“谏言者都要处以死罪。”从此不理国政，每天沉迷于酒色，日夜狂欢。


    贤臣伍举忍无可忍，但碍于诏示，不敢用直言劝谏，于是用谜题来代替：


    “有一只鸟站在山岗上，三年间既不飞又不叫，请问大王这是什么鸟？”


    楚庄王回答：“这只鸟虽然三年不飞不叫，但是一飞冲天，一鸣惊人，你想说的事情，寡人不懂得，你退下去吧！”


    然而，连续过了好几个月，楚庄王不仅不收敛自己，反而变本加厉，一些贪图功名的臣子为了迎合他，想出各种游乐的名目和他共同玩乐。但并非每位臣子都如此，其中不乏不参加游乐的人；国君耽于游乐，他们仍然尽忠职守，刚直清廉，丝毫不因局势而改变。


    大夫苏从非常看不过楚庄王的行为，于是当面谏言，楚庄王问：“难道你没有看过诏示吗？”


    苏从凛然回答：“臣当然知道。但如果这样能使您回心转意的话，臣死也瞑目！”


    楚庄王起身下座，握着伍举、苏从的手：“你们说得好！”他宣布重用苏从、伍举，提拔那些忠于职守的官吏，而对那些取悦逢迎并和他一起玩乐的人一律免职。


    原来楚庄王青年登基，很想有所作为，但此人城府极深，不愿向臣下表明心迹，所以想了这样一个投石问路的办法考验臣下的忠奸，同时也在臣僚面前树立了威望。此后，由于楚庄王任用贤才，励精图治，终于成为春秋五霸之一。


    深藏不露，固然是君王控制臣下，树立威信的有效手段，但有时做得过了头，不仅不能达到树德立威的目的，反而引起臣下的逆反心理，结果适得其反。


    民国初年，袁世凯一心想登上皇帝的宝座。他指使党羽大造舆论，一时间谣言四起，劝进者络绎不绝。袁世凯不禁暗自高兴，但表面上装得煞有介事，一有机会就向别人表白自己是忠于民国的。即便是在他的心腹大将冯国璋、段祺瑞面前也是如此。


    据说，冯国璋曾专程赶到北京向袁世凯探听虚实。袁世凯装得一本正经：“华甫，你我是自己人，难道你不懂得我的心事！不妨对你明说，总统的权力和责任已经与皇帝没有区别，除非为儿孙打算，实在没有做皇帝的必要。我的大儿子身带残疾，老二想做名士，我给他们排长做都不放心，能够付以国家的重任吗？而且，中国一部历史，帝王家总是没有好结果的，即使为儿孙打算，我更不忍把灾害留给他们。当然，皇帝还可以传贤不传子。但总统同样可以传贤，在这个问题上总统皇帝不就是一样的吗？”


    冯国璋听后插言道：“总统说的是肺腑之言。可是，将来总统功德巍巍，到了天与人归的时候，只怕要推也推不掉啊！”


    袁好像很生气的样子，坚定地说：“不，我决不干这种傻事！我有一个孩子在伦敦读书，我叫他在那里置了一点产业。如果有人一定要逼迫我，我就出国到伦敦，从此不问国事。”


    冯国璋听了老袁如此诚恳和坚定的表白，自然也就不存在任何疑心了。


    然而，冯国璋刚刚离开袁府，袁世凯就气冲冲地回到书房，大骂冯国璋忘恩负义，连声说：“冯华甫真是岂有此理！华甫真是岂有此理！”


    老奸巨猾的袁世凯向来喜欢让部下猜测自己的心思，由于城府过深连心腹大将有时也难以领会其真实意图。冯国璋自恃跟随老袁多年，把袁世凯的一番假话当成了肺腑之言。但纸是包不住火的，冯国璋刚回南京，活灵活现的帝制机关筹安会便公然通电成立了。冯不禁跳起脚来发火说：“老头子真会做戏！他哪里还把我当作自己人！”从此与老袁分道扬镳。真可谓“聪明反被聪明误”，袁世凯深藏不露，机关算尽，结果只落得个部下离心离德，众叛亲离的可悲下场！


    ## 高帽子愈大愈好


    聪明的掌权者一般不会让部下的权力过分膨胀，他会采取各种手段加以制止、预防，除了严刑重罚以外，明升暗降便是最常用的一种防范手段。有些部下德高望重，功勋卓著，又没有什么过错把柄，杀掉显然没有理由，而且会产生不良影响，但留着又不放心，于是便来个“明升暗降”，给你显赫的头衔、很大的荣耀，但暗中却夺去你的实权，虽然你对这种权术洞若观火，却哑巴吃黄连，有苦难言，只有乖乖就范。


    宋太祖赵匡胤建立北宋后，见天下已定，决定及早剥夺功勋显赫、至今重权在握的大将石守信、王审琦等人的军权。


    这就是历史上有名的“杯酒释兵权”。


    历史往往有惊人的相似之处。公元 1141 年 4 月，又一次“杯酒释兵权”的闹剧在杭州重演了。南宋宰相秦桧盛摆筵宴，招待朝廷中鼎鼎大名的三大将：张俊、韩世忠和岳飞。这三人，是南宋初年的著名将领，每人统率着十几万精兵，驻守在从长江上游到淮河口的千里江防线上，是南宋抗金的主要武装力量。


    对于这几位大将，软骨头皇帝赵构觉得很难办。宋朝从开国以来一直重文轻武，不许武臣干政，甚至也不许直接掌握军权。赵构南逃以来，由于金人不断南侵，南宋的半壁江山全靠这几位大将支撑着。他不敢得罪他们，但对他们手中日益壮大的兵权、实力，赵构一直寝食难安。再说，要同金人议和，这几位大将必然反对，自己当儿皇帝苟且偷安的计划便难以实现。卖国贼秦桧非常了解赵构的苦衷，处心积虑。必欲置几位抗金将领于死地而后快。昏君奸臣一拍即合，经过一番密谋策划后，决定以庆功为名将三大将召到临安，解除他们的兵权。


    酒过三巡之后，秦桧突然宣读圣旨：授张俊、韩世忠为枢密使，岳飞为副枢密使，免去三人原任职务，三将原来统率的军队，一律由朝廷指挥。


    所谓枢密正副使，是中央政府的正副军事长官。从表面上看，这三个人从原来一路军队的统帅改任为朝廷的最高统帅，似乎是升了一级，但他们脱离了自己的军队，便如虎落平阳，难以再发挥什么作用了。说白了，这是明里升官，暗夺其权，他们完全被架空了。


    如果说赵匡胤“杯酒释兵权”是为了大宋王朝长治久安的话，赵构的所作所为只能说是为他此后的屈辱求和扫除了障碍。


    ## 无处不在的第三只眼


    中国的特务机构，创始于明代。明朝的特务统治是历史闻名的，早在立国之初，便设立了专门的特务机构锦衣卫，后来又增加了东厂、西厂。这些机构的特务多如牛毛，遍布在京城的每个角落，以至全国的城乡，严密监视着大小官员，以至普通百姓。


    始作俑者，便是开国皇帝朱元璋，这个人生性极为多疑，他对大臣的监视几乎到了毛发必究的地步，大臣家中一些极为琐细之事，如请了什么客，饮的是什么酒，两口子为什么吵架生气，都会及时反映到他那里，他也时常用这些事盘问大臣。这对大臣在心理上所产生的压力是十分巨大的，当他感到皇帝的眼睛时时刻刻在盯着自己时，他还敢有什么出轨的言行吗？


    到了近代，中国的特务机构发展到了登峰造极的地步。特别是在蒋介石建立南京政权以后，中国出现了“中统”和“军统”两大特务系统，并形成了遍布全国的特务统治网络，即便在蒋介石逃离大陆以后，潜伏下来的特务尚有60万人之多。


    蒋介石热衷于特务统治，主要在于此人生性多疑，心胸狭窄。蒋家王朝建立后，更时时防备有人图谋不轨，害怕大权旁落。他对任何人都持怀疑的目光，亲戚、朋友、部下、对手，概莫能外。


    据说，蒋介石用将，有个定规，要么出身黄埔，要么来自浙江。“学非黄埔，省非浙江，作官无路，眼泪汪汪”。他对一些凭战功晋升的非浙江省、非黄埔系的将领，总是千方百计限制其所辖军队的权力，并派人暗中监视其行动。卫立煌属蒋介石的“五虎上将”之一，被誉为常胜将军。但每次打完仗后，不是派其“进修”，就是委以虚名。1933年卫立煌在平息福建事变过程中又为蒋立了大功，但结果是卫的第五路军被解散了。为此，卫立煌不免发牢骚。这天，他和第五路军的其他几位高级军官在杭州西湖畔的迎春饭店宴会，酒后打“卫生麻将”到天亮方散。次日中午卫立煌接到老蒋的电报，最后一句称“昨晚胜负如何？”千里之外的老蒋对卫立煌的一举一动了如指掌，这分明是有耳目在卫身边。于是，卫立煌回电：“昨晚欢宴过晚，是我的责任，我有错误。”午后，蒋复电：“戏言也，勿介意”。


    蒋介石对自己这一套特务手段似乎颇为得意，但“聪明反被聪明误”，更多的同道、部属却因此心灰意冷，离心离德，甚至私结朋党、多生反骨。到头来，“哗啦啦如大厦倾”，蒋家王朝众叛亲离，分崩离析，寿终正寝。


    ## 狡兔死，走狗烹


    从历史上看，成大业的人，都能广揽人才，礼贤下士。他们统治的方法各种各样，五花八门，但无论怎样变化，总离不开两个基本点，一点是柔，一点是刚，如果能刚柔相济，其统治就稳定。


    柔与刚，都是正统的统御策略，从柔的一方面讲，施惠于民，减免赋税，于民有利；从刚的这一面讲，加强法制，严明刑罚，这也于民有利。


    从官场权术来说，柔可以理解为拉拢、软化，以小恩小惠私结之；刚则可以理解为对下属的高压政策。一个成功的统治者，要学会交替使用赏罚二柄，这在西方被称为“胡萝卜加大棒。”


    人们常说：“刑不上大夫，礼不下庶人”，以为统治者的严刑重罚主要是用来对付平民百姓的。其实并非如此。对统治者来说，刑罚主要还是用来对付他身边那些与之朝夕相处的部下。因为这些人会对他形成实际的或潜在的威胁。


    一般来说，当权者施用刑罚的对象，不外乎这样两种人：一种是他认为有可能对他的地位、人身安全、名誉声望造成威胁的人；一种是他不喜欢的人。俗话说：“伴君如伴虎”，欲加之罪，何患无辞。当权者的政治品德，由此可见一斑。


    过河拆桥是掌权者经常使用的一种政治权术，即在达到目的之后，将帮助过自己的人一脚踢开。


    古往今来，奸诈的当权者无不遵循这样的原则：当他们用人之际，不惜弯下腰来，广招贤才，俨然一副正人君子的模样，诸如刘邦设坛拜韩信为将等。一旦大功告成，就翻脸无情，什么山盟海誓，统统忘掉，翻脸不认人，视亲为仇，视友为敌，必欲置之死地而后快。


    这正是所谓：“高鸟尽，良弓藏；狡兔死，走狗烹；敌国破，谋臣亡”。


    揭开历史，从古代直到近代，当权者无不心狠手辣，惯用卸磨杀驴的伎俩。


    越王勾践“卧薪尝胆”的故事，在中国可以说是家喻户晓，妇孺皆知。然而，勾践其人实际上是一个忘恩负义、反目无情的小人，臣下只能与他“共患难”，不能与之“共欢乐”。当勾践被围在会稽山上，粮尽援绝之时，有两个功臣为之出谋划策，与之同甘共苦，为勾践复兴越国立下汗马功劳。这两个人便是范蠡和文种。勾践听从了范蠡和文种的计策，经过十年生聚，十年教训，终于打败了吴国，成就了霸业。俗话说“功高震主”，就在欢庆胜利的时刻，范蠡根据自己对勾践多年的观察和了解，深知此人难以长期共事，便借机抽身潜逃，弃官经商去了。


    临行之前，范蠡派人给文种送来一封信。信中说：“飞鸟尽，良弓藏；狡兔死，走狗烹。越王这个人长得脖子细长，嘴像鸟嘴一样。这种人只可与其共患难，不可与其共享乐。先生为什么不尽早离他而去呢？”


    文种看信后，觉得有道理。回想起这些天来，越王对自己的态度是越来越冷淡了，许多重大事情也不同自己商量了。看来越王确实可能对自己有戒心。但文种还是不相信越王会对自己下毒手。不管怎么说，自己对越国的强大立下了大功，而且对越王又是忠心耿耿。文种左思右想，还是舍不得在越国的荣华富贵，但又不好继续呆在越王身边，便决定向越王称病，在家休养，以为这样就相安无事了。


    越王勾践对文种的才能是深深了解的，也知道在自己称霸之后，文种的才能很难再得到充分发挥。况且，在越国击败吴国的过程中，文种所起的作用是巨大的，封给他再大的官职，再多的财物都不能算过分。也正因为如此，越王勾践才对文种的存在表示担忧。万一他真的作起乱来，自己控制不了局势，那就晚了。


    于是，他借探病为名，来见文种，问他道：“先生曾以灭吴的七种手段指教过我，我只采用了其中的三种，便将吴国灭了，还剩下四种，你打算再怎么去使用呀？”


    文种说：“我看不出它们还有什么用处。”


    勾践说：“请先生带了这四种手段，到九泉之下去辅佐我的先人吧！”


    说罢起身登车而去，留下了一把名为“屡镂”的利剑。文种顿时明白了，当年吴王夫差就是用这把剑让一代忠臣伍子胥命归黄泉的，万没想到自己也会落得伍子胥那样的悲惨下场。

