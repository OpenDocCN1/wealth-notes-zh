    # 得势不张扬


    量小非君子。可历代君主、权臣又有几个是肚里能撑船的谦谦君子呢？他们有权则怕旁落，有利则怕夺走。总之他们时时刻刻处于高度的警惕之中。在他们看来，官场没有真正的朋友，只有真正的敌人，所以他们活得很累，所以他们时时的算计别人。所以，如果你想混迹官场，又平安无虞，就得经常用冷水冲冲头脑，得宠不跋扈，得势不张扬，该放手处就放'
