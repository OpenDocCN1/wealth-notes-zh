    # 上班族缺德讲座


    子，而公司同仁大多觊觎后者，你不妨装出对前者有兴趣的样子，那么你受攻击的机会将大大降低。到时大伙斗得非死即伤，你再去捡便宜。


    善用以上四法，争得“主任”位子应该没问题，但是当你升为中级干部后，除了继续往上爬外，还要小心手下赶上来。防止以下克上的原则大致有七：


    +   1. 自己绝不怕害，时常以局外人的客观看工作进度。

    2. 要使有能力的属下互相敌对。

    3. 绝不扮恶人。要责备手下，尽量找替死鬼。

    4. 保持威严，偶而指出手下的明显的错误。

    5. 不必深入了解每个人的分工，但要熟知大量专有名词(能以英文发音更佳)，在日常会话中百说不厌。

    6. 每周有一两天提早上班而延后下班，有五六天则迟到又早退。

    7. 不随意发牢骚。


    当你没有后顾之忧后，便可朝“经理”的位置迈进。


    当上高级干部后，除了要继续掌握前述的方法及原则，更要讲究开会的艺术。懂得如何开会的人，绝不放弃任何开会的机会，但是他到场却未必全神贯注，只在接近尾声时，大声赞同或极力反对，至于该赞成或反对，完全看在职场职位最高者的意思，“找理由来附和结论”的毛病就算在学术界也是常有的事，区区一营利事业团体中，然更可大用特用。


    开会的另一功能，是让别人觉得你很忙，老是不在位子上。说来有趣，现代人不肯耐心体会别人的心灵，便老爱强调一叶知秋、观微知着，你正好用这些经过设计的小地方来捞取声势。'
  - '[PAGE 431]


    平时的会议中，大可闭目养神（但不可打呼），一旦遇到一种会议，却要脱掉假面具，大作狮子吼。各位也许要问：“是哪一种会议？”答案不是董事长出席或事关公司存亡的会议，而是议题涉及你的手下的利害关系。原因在于这是一个明争暗斗的社会，大家久违男子汉的英姿，你肯为了部下拼命争取，大家心中必定深为感动。一旦收买了公司的人心，不但升迁有望，说不定还能收到几个效死的子弟兵，正如中国的“士为知己者死”。


    # 落地窗前的悲剧


    假设你已顺利地坐上总经理的王座，这时要给公司人员制造“天威难测”的印象，根据某伟大的表演家透露，总经理应该低头透过眉毛看人，先面无表情，再花三秒钟徐徐笑开，最后再皱眉作出不快状。


    如果真有那么一天，你背对着落地有色玻璃窗，环视宽大的办公室，想起漂亮的女秘书今天又穿哪件窄裙，也想起有一个股东必须摆平，你会发现人生实在无趣。你用蒸馏水服下一片降血压药，自问：“当年那人向我推销升官秘诀，会不会是想害我？”自答：“是我自愿缺德，又怪得了谁？”你一回头，一只鸽子飞向远方的白云，你叹一口气，决心再升一级。


    这次升迁就容易多了，你只要把左右心腹叫来说：“我累了。我该退休了……”


    其他什么都不必说。心腹们一定会极力挽留，但你阅人无数的眼睛早已看出他们心藏喜悦。你装糊涂说：“有你们在，我可以放心了。”心腹们更加惶恐，你不耐烦地挥手制止他们'
  - '[PAGE 432]


    多言，他们顿时陷入沉默。


    你卸下重职，用余生欣赏花鸟风月，雇一个富想象力而文笔不错的青年为你写回忆录，把一些见不得人的暗算或缺德的事都抹掉，让后人研究你的奋斗史。


    至此，本讲座应告一段落了，如果各位记得这是为上班族所开的缺德讲座，就不会相信以上有关总经理的部分是真的。像那种拜将入相型的人才毕竟是少数，本人只是随口冒充一下富想象力而文笔不错的青年，一般上班族最常犯的毛病就是容易受煽情文字的骗，那些身居要职者的背后都有一段沧桑，说出来可是一点都不美。'
  - '[PAGE 433]


    # 女性上班族发威术：

    善用女性的优势


    # 善用女性的优势


    本讲座共计十一讲，偏偏以一章的篇幅来介绍女性上班族缺德术，如果众新女性因而抗议，那就太自贬身价了。要论缺德，古今中外的女性何尝输给男性？倒是那些吃了哑巴亏，气得大骂：“难养！难养！”的家伙，颇令人一洒同情的泪兼笑破肚皮。


    有了以上心理建设之后，本人可要大弹弦外之音，各位女性上班族就把手中的番茄带回家榨汁喝吧，据说可以养颜美容。


    男性上班族也千万不要错过本讲，本讲也许是胡说八道，但观察女性读过本讲后的反应，各位将了解不少真理。


    好了，我们就从女性上班的目的谈起吧。依本人之见，女性上班的目的要比男性单纯多了，大多女性上班族谈起工作观，总是说“增加社会经验”、“自力更生”之类的台词，她们根本就不懂我们男性养家活口、打拼奋斗的苦楚，因此，她们无法全心全力投入工作，没有破釜沉舟的决心。


    总之，对众姑娘而言，办公室只是出嫁前的临时休息站，是找寻理想伴侣的瞭望台。上司对她的要求较小，她也不必为了讨好上司强颜欢笑、暗吞苦情。女性上班族不轻易跳槽，但'
  - '[PAGE 434]


    是万一她跳了，要找一个相同琐碎的工作也很容易。要是上司稍微面露凶色，女性上班族可以立刻拧手帕作泪水夺眶欲出状，任何男性主管恐怕都承当不起“欺负弱女子”的臭名。


    但是男性上班族能拧手帕吗？各位光是想像那情景，都要连呕三天。


    因此，各位女性上班族应该善用自己的优势。话说回来，有四种女性上班族并不能因自己性别而讨上便宜。


    +   一、在百货公司、化妆品公司、总机等女性占绝大多数的地方工作者。


    +   二、上司本人就是一个冷血的老小姐者。


    +   三、负担家计者。


    +   四、对婚姻不抱任何希望，决心单身以终者。


    话又说回去，上述四种不幸分子之外的有幸分子之外在见到自己的部分姊妹无计可施之余，更要力争下游，撕碎矜持，努力当一个以直报怨的缺德上班族。


    在第一讲到第八讲的章节中，我们谈了不少，其中绝大部分男女通用，少数涉及体能因素，各位女生不要太过度勉强，你们自有其他手法是男生学不来的。


    各位不妨揣摩舞台上男演员反串的动作。要能运用眼、唇、胸、肩、足、发、屁股来表现哭泣、撒娇、告状、耍赖、别扭、失措、迷醉等神情，你们要能表现出自己的年轻、貌美、懂事、孩子气以及其他任何可以瓦解男性斗志的气质。


    各位不要心存忠厚，不忍向男性下手，男性大约可分为两类，一是大男人主义者，一是温柔的自恋狂，这两种病只有吃大亏才会痊愈，各位女性上班族要本着“治病救人”的精神，勇猛挥刀砍下去，免遭妇人之仁之讥。'
  - '[PAGE 435]


    但是，“心狠手辣”必须和“眉开眼笑”同时施展，如此不但功效加倍，各位也不必牺牲女性特有的魅力，而保留魅力的目的只是在使自己高兴，遇到不顺眼的男性，给他“下马威”即可。


    # 装糊涂的艺术


    各位女性上班族，你们是否在男上司、男同事眼中看到宽容与爱怜？你们是否目击了两位男性上班族彼此怒目相视，明争暗斗？这说明了在公司对职员的要求以及男性对女性的要求之间有些矛盾。


    因此，真正聪明的女人要懂得装糊涂。


    各位要能干而无损于女性气质，又要糊涂以不伤害男性尊严，要能在两者间取得平衡，则凡事无不得心应手。即使是你花了很大苦心才办成的事，你也要让别人以为你是走运，办成后拍手笑道：“咦？怎么搞的？怎么会这样？好棒好棒。”然后又红着脸捂着嘴说：“女生不能说‘好棒’。”如此包管男性一头雾水，久而久之，你就成了“福将”，所谓的“福将”，说穿了就是受欢迎的成功者，其境界远高于“一将功成万骨枯”者。


    “装糊涂”的艺术又可见于猜谜活动上。明明出题者出了一个烂题目，众人为了给他面子，制造快乐气氛，故作想破脑袋百思不解状，等宣布谜底后，大家才后头拍膝拍案拍马屁地说：“哎呀！妙！”这个“妙”字其实是用来夸赞自己的。'
  - '[PAGE 436]


    # # 因材施媚


    各位要有迷倒所有男士的魅力，向严肃之人展现负责，向活泼之人展现幽默，向爱抬杠之人展现逆来顺受，向故弄玄虚之人展现神秘，只要你在一起头就抓住每个人的要害，因材施媚，你会在众多男性的权力结构中来去自如。唯一必须小心的就是：在不同类型男性同时出现的场合，你要摆出大家从来没有见过的样子，保持沉默，或者干脆避免参加。同理，当一个男性上班族有被某女同事吃定的感觉时，应小心观察她对其他男同事的态度，然后找一个机会和别的男士同时出现在她面前，使她露出破绽。


    总而言之，女性上班族如果想在办公室中发挥威力，就要学会一切男性专用的缺德伎俩，除此之外，也在乐于承认自己是女性的心态下，放弃那些体能上无法负荷的手段（喝酒、熬夜等）；改以女性特有的魅力。


    各位要利用男性对女性的刻板印象，能屈能伸，趋避进退全视利之所在。至于女性与女性应如何斗法，请恕本人的性别所限，无法一一陈述。但是，本人坚信有一天一定会有一位伟大的女性召开另一场缺德讲座，届时本人必定拍马而上，洗耳恭听，与天下所有向往缺德的男女上班族同乐。'
  - '[PAGE 437]


    # # 上班族党外精神考：

    ## 修炼上班族党外精神

    ### 风化作用


    天下没有不散的筵席，换句话说，恶梦总会过去，本讲座已接近尾声。各位用功的上班族，必定已发现我们的精神在于“反抗”，不反抗无以知上班族受到有形无形的束缚。

    在进入最后一讲之前，我们要谈一谈上班族的党外精神，请各位继续张牙舞爪、呼啸叫好。


    一般来说，上班族的生活没有什么高潮。除非特别好运或杰出，不可能平步青云或大发利市，地位和薪水都要靠长年累月的攀爬。上班族的宿命在于：不在长年累月之后，不知结局。而漫长的时间必然使各位有气无力，使各位成为规格化制品——一枚自傲或自卑的螺丝钉。我们把这三鼓丧气的过程称作“风化作用”。


    从另一方面来看，一个大企业总是由极少数有个性的人去领导大多数的规格化人类，如此才能把活泼乱跳的人性集中用在同一个方向，这种制度上的要求使“风化作用”更为严重。

    于是，各位也在相同时段穿相似的服装往返于家与办公室，你们看同样的电视节目，在同一个假日到郊外互相大眼瞪小眼。你们的学历、收入相仿，预计生相同数目的儿女，对黄色笑话感兴趣，不随便买陌生作家的书。这些就是企业成长的'
  - '[PAGE 438]


    副产品，而这些副产品若有缺陷，消费者团体也无计可施。


    各位在步入社会后学会了妥协，学会了用小部分时间及收入来解决良心不安的问题，在这处境下，如何促使保全自我？这就是我们缺德讲座的课题。我们的策略是把伪君子化为真小人，把真小人化为伪小人，然后看伪小人有朝一日能不能变成真君子。岂苦吸油！吾岂好缺德哉？吾不得已啦。


    # 规格化人类


    各位上班族从早忙到晚，从周一到周六，从月初到月底，从岁始到年底，从年轻到年老，如果说这就叫“敬业乐群”，“走马灯”不知又是什么。


    你有没有忽然放假却不知作何是好的感觉？如果有，你可能已经敬业乐群得太厉害了。负责任当然是一项美德，但是当你肩上不负重担就会心慌时，你的敬业乐群只是一卷反复播放的录音带：“我是规格化人类——我是规格化人类——”


    总之，我们一定要善加提防“风化作用”，千篇一律的录音带哪有立体声、多频道交响乐镭射唱盘美妙？


    提防的方法主要有三：


    +   一、应享的福利绝不放弃。但为了收买人心，在旺季或忙碌的时段不妨适度地奉献一些。


    +   二、不要为章程条文所绊。当然我们并不主张消极抵抗或存心捣蛋。只要知道有那么回事就成了，这正是模仿那些凭常识即不触法网的社会人。在以法律作武器时，自然另当别论。


    +   三、多多利用本讲座传授方法。


    至于公司为了维持金字塔组织所下的苦心，我们也要一眼'
  - '[PAGE 439]


    看穿。了解公司的经营理念是一回事，要员工熟背社训、熟唱社歌，甚至每天早上穿社服、举社旗到大街上做体操则是另一回事。一般而言，社训中的措词愈抽象高贵、愈像教派福音，表示公司控制员工的欲望愈强。


    说来“社训”只是公司草创人或功臣的主观想法，当初招考员工时的唯一标准是“生产力”，并没有就“社训”作详细的讨论。因此，对旗下员工宣扬“社训”的真正目的在于指鹿为马，该动物是鹿是马并不重要（所以措词不妨抽象空灵一些），重要的是要大家一起点头。


    # 观察沼泽


    依本人之见，各位上班族不要理会什么“忠贞精神”，爱公司和爱工作是不同的两回事，有人感激公司却不喜欢自己的工作，也有人讨厌公司却喜爱自己的工作，两者兼得是最理想了，不能兼得的话，还是找一个自己喜爱的工作吧，对公司只要“信义和平”，不必“忠孝仁爱”。


    各位应该早一天去观察沼泽，请注意那一生态系统中密密麻麻的小生物，你会发现身为人类，实在太幸运、太丰富了，你也要提醒自己不要毫不挣扎就沦为规格化制品。有主见的人，一生总是在进步，临终时就是最高点。附会潮流而又受潮流摆布的人，最迟在
    60 岁就要开始失落，所以那些需要靠外在条件支持自己的人常说：“其实我觉得人只要活到 50 岁就够了。”


    如果各位已经了解到何谓上班族的党外精神，一定会笑着说：“50 岁不够，到 100 岁再看情形吧。”各位过 100 岁生日'
