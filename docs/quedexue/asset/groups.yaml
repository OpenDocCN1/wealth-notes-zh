    # 缺德整人术


    婉儿又道：“则天大圣皇帝，皇后以为何如？”韦氏不禁一笑。婉儿索性走近数步，与韦氏附耳数语，韦氏还装着一种半嗔半喜的样儿。婉儿知己认可，遂出去引导可人儿，夤夜入宫。是夕正值中宗留宿别寝，趁着韦氏闲暇，即把情人送入，一宵欢乐，美不胜言。道是何人？原来就是武三思。嗣是三思一箭双雕，只瞒中宗一副耳目。韦氏与婉儿，且在中宗面前，屡说三思才具优长，中宗竟拜三思为司空，同中书门下三品，并进婉儿为昭容，令她专掌诏命。三思子踪训，与踪训妻李裹儿，当然封为驸马公主，不消细说，既而复封散骑常侍武攸暨为定王，兼职司徒，诸武声势复振。


    自从武则天下台后，朝中忠臣齐心协力打击武氏力量，武三思地位日下，但他却通过韦氏的肉体关系，再度入朝掌权，可叹中宗昏庸，人家给他戴了绿帽子，他还要封人家的官。后来武三思权力达到顶峰，连杀朝中忠臣，实施残酷的报复，而中宗也被韦氏用毒饼药死，大唐江山又一次发生震动。


    色情这个东西，好比鸦片，一旦陷进去，就会产生幻觉，不能自拔，反而越陷越深，弄得不好，还会引火烧身，弄个可悲的下场，正因为这个原因，以此作为升官的阶梯，是再快不过的了，也是再危险不过的了。


    张昌宗、张易之、武三思之流以色进仕，虽遭人们唾弃，但多少有加遮掩，而战国时秦国的嫪毐（涝矮）与皇太后私通，竟弄出两个儿子来。


    吕不韦是一个大商人，他看到秦国安国君的儿子子楚被送到赵国当人质，地位低下，又无钱财，就资助子楚，使子楚受到华阳夫人的宠爱，最后被立为嫡子。安国君只当了三天国王就死了，子楚即位，是庄襄王。早在赵国时，吕不韦就找了一个美女，与她同居，等有了身孕后，请子楚饮酒。子楚一见，就爱上这个美女，吕不韦就将美妇送与子楚，后来生了一个儿子，就是嬴政，子楚还以为是自己的儿子呢。


    子楚当了国君，吕不韦被封为文信侯。子楚死后，嬴政即位，此时他只有13岁，大权都掌握在吕不韦手中。


    子楚一死，吕不韦就与王后重温旧梦，以商量“国事”为名，经常出入甘泉宫，与太后像夫妻一般亲密。太后并命秦王嬴政尊吕不韦为“仲父”。


    秦王政长到20岁左右时，对他们的关系就有所风闻，吕不韦很怕事情败露，但此时的太后，淫心正炽，不时的召吕不韦进宫寻欢，吕不韦不便拒绝，他自己年事已高，不能满足太后的淫欲，于是想找出一个代替自己的坏主意来。


    吕不韦打听到民间有个叫嫪毐，其阳具大，许多淫妇争与他私通，此人多次犯罪，吕不韦都与他开脱，将他留在府中为舍人，以待时机。


    秦国当时有一种风俗，农忙结束，要娱乐三天，不管是谁，只要有一技之长，都可以当场表演。


    于是，吕不韦以桐木为车轮，使嫪毐以其阳具穿于桐轮中，轮转而阳具不伤，市人皆掩口大笑。


    太后听到这件事，就私下问吕不韦，吕不韦趁机说：“太后你想见此人吗？我可以请他来。”


    太后笑而不答，过了一会，说：“你说的是笑话吧？他是外人，怎么能进入宫内呢？”


    吕不韦道：“我有一计，可教此人进宫。先教人揭发他过去的罪行，判他一个腐刑，然后出重金贿赂刑官，搞一个假阉割，这样就可以进入宫闱而不受怀疑了。”


    太后听了非常高兴，按吕不韦的主意，“厚赐主腐者吏，诈论之，拔其须眉为宦者，遂得侍太后”，于是太后与嫪毐私通，非常喜爱。


    嫪毐与太后寻欢作乐，只图一时之快，不想太后怀孕了。当时又没有堕胎的方法，若产于宫中，此事不能隐瞒，怎么办呢？于是，太后就装作有病，不思茶饭，神魂颠倒。秦王一面找医生给母亲治病，一面求神问卜。狡诈的嫪毐便趁机用重金贿赂卜卦的人，说什么太后的“病”是因中了宫中的邪气引起的，应到西方去避灾，秦王政正想让母亲离吕不韦远点，他让太后带着嫪毐作为侍从，迁居到离咸阳二百多里地的雍城大郑宫居住。从此，他俩在这里更加放肆，仅两年多的时间，就生了两个孩子，嫪毐还私自把他们养起来，想伺机夺取国家政权。


    秦王政忙于国务，很少到雍城去，对于母亲的事也一概不知。嫪毐趁机让太后替他邀功请赏。于是，秦王政以嫪毐侍候母亲有功，封嫪毐为长信侯，予以山阳（在今河南修武县以北，太行山东南）地，让嫪毐居住。不久又封以“河南西太原更为毐国。”


    太后为了拴住这头淫驴，经常赏他金银财宝，供他玩弄。这个昔日的流氓，一下子富贵起来，为了巩固自己的势力，蓄养家僮千人，又结交宫中权贵，培植死党，一些无耻之徒都来投靠他，宫中大小事，都由他作主，俨然成了秦王政的太上皇，其势力很快就和吕不韦不相上下。他还收买朝中的权贵作为耳目，打探情况，吕不韦的一举一动，秦王政的言谈举止，都能很快传入他的耳中。有一次，秦王政由于多少听到有关嫪毐的一些事，正准备派人调查一下，但还没有作出决定。可是，就连这样的机密情报，也很快传到了嫪毐的耳里，可见他耳目之多，几乎是无孔不入。


    一个无赖流氓，有何才华，竟能平步青云，色也。


    像上述例子，真是举不胜举，如汉朝的吕后和审其食，清朝的慈禧太后和荣禄等，都是此类。


    ## 装聋作哑


    聋，就是耳聋，笑骂由他笑骂，好官我自为之。但聋子中包含瞎的意义，文字上的诅骂，闭着眼睛不看。


    聋的意思是看见的装作没看，听见的装作没听，别人骂让他骂去，只管自己做官，不管名声如何，虽然别人在戳自己的脊梁骨，自己也不生气。


    聋的另一方面意思是大事化小，小事化无，为了当官，即使有人骑在自己脖子上拉屎拉尿，也照样当作没看见，没听见。对奸佞们残害忠良，欺下瞒上，淫乱荒谬，也要视而不见，充耳不闻。


    魏晋南北朝时期，在以鲜卑族贵族为主的高氏齐国，出了一个大奸臣，他就是和士开。


    和士开掌了朝中大权后，作威作福，荒淫无耻，当时人们指责和士开贪淫乱政，凡是不向他屈服的文武大臣都被他一一杀害，手段残忍，令人生畏。


    和士开还秽乱宫闱，与武成胡皇后公然相姘，毫无顾忌，又仗势为非作歹，强夺人妻。有一个叫徐之才的官员，他的妻子是魏广阳王的妹妹，长得非常漂亮，和士开贪淫成性，竟跑到徐之才家里去强淫其妻，正好被徐之才遇见。可叹徐之才毫无男儿气概，只有缺德学术精通，为了官位竟自行避开，且自我解嘲：“妨少年戏笑。”


    开府仪同三司平鉴有爱妾刘氏很美，和士开派人强迫平鉴将刘氏送给自己，平鉴马上送去，平鉴送了爱妾，对人说：“老公安阿刘，与死何异。要为自身作计，不得不尔。”这才是真正的厚黑脸，为了自己，不顾一切。果然，和士开送给平鉴一个齐州刺史的官。


    上述两位官员对待和士开，均采用缺德的方法，若是热血男儿，当仗三尺宝剑，怒斗凶顽，以解心头奸妻之愤。此二人真是“大肚能容天下难容之事”。


    “聋”的缺德术还有一个意思，本人位居高官，部下谎报战功。如若实事求是的话，就要将他治罪，但某些时候情况特殊，不宜治罪，就装聋作哑，不但不治罪，反而给予奖励。从这一角度讲，任何事物都是不断变化发展的，因此，一般的原则也要随着事物的变化而灵活运用，不可死搬教条。


    在淮海战役中，有一次刘峙把自己的指挥失误，谎报成“徐东大捷”。所谓的徐东大捷是我军阻击国民党军两天后，主动撤退，目的是诱敌深入，以便在以后合围全歼。


    昏庸的刘峙给蒋介石发了一个电报，先分析双方兵力，然后吹嘘如何如何取得胜利，像“有我无敌，有进无退”之类的大话说了一大堆，又谎称歼敌 10 万以上，最后，又对蒋介石大加赞扬，什么运筹帷幄，英明决断之类的话自然又说了不少。


    蒋介石看了电文，心中非常高兴，终于又升起了一线希望。他要重赏刘峙。


    不一会儿，蒋经国也送了一份电报，这个电文是特派战地观察官李以匡，越过徐州“剿总”和国防部直接发来的。


    李以匡报告说：“这次徐蚌会战，徐州‘剿总’闭目塞听，处处被动，刘峙在会战之初，惮于徐州有失，命津浦、陇海各线部队猥集徐州，却不敢增援黄百韬，以致津浦路被截断，给会战造成更大的不利。所谓大捷，纯属子虚乌有。原为共军试图断邱（清泉）兵团东援后路，不期与邱兵团侧袭共军之74军遭遇，造成胶着，两军激战竟日，各有伤亡。后共军主动撤出，正面各部亦受命后撤至大许家，我判断是试图诱邱、李兵团深入而图歼灭。此乃所谓崩溃之说。现共军从少数兵力歼黄，大部兵力侧袭徐州，现已截断我对徐州的运输供给，徐州已形孤立，邱、李、孙三兵团危在旦夕……”


    蒋介石一看此电报，大骂刘峙无耻，恨不得立即杀了他。


    但不久以后，蒋介石冷静下来，他觉得这个谎报的战绩，不能揭穿，一揭穿就等于承认徐州会战失败，影响士气，还会使美国主子对自己失去信心，不如假戏真做，大奖官兵。


    蒋介石需要胜利，哪怕这胜利是假的。


    于是蒋介石命令给邱、李两兵团以重赏，给邱清泉兵团20万银圆，授予黄百韬“一等云麾”勋章一枚，兵团参谋长魏翱、第25军军长陈士章“四等云麾”勋章各一枚。在徐州，满街张贴标语，鸣放鞭炮，举办战绩展览。刘峙还向各方发出通电，宣扬：“徐东大捷”、“潘塘大捷”。宁、沪报纸、电台也忙不迭地挥毫鼓舌，大肆渲染，说什么“堪称战役绚烂之页！”远在华盛顿的驻美大使顾维钧听到这个消息后，在11月18日这天日记中写道：“徐州之战，国军获胜，这是一个非常及时的胜利，给政府以喘息之机，借以重新整顿以备未来。”中央宣传部部长张道藩还率慰问团并新闻界人士，搭专机飞往徐州慰问，搞得十分热闹。


    蒋介石自欺欺人，不久徐蚌会战全面失败，几十万大军被歼，蒋介石的命根子一下断送完了。不过后来蒋介石终于将刘峙大骂一顿，解了心头之恨。


    像蒋介石这样阴险毒辣的人，尚且装聋作哑，明知是假的，也要当成是真的。可见缺德术是大有用处。


    ## 只捧不恐难成大事


    李宗吾在《厚黑学》中说：“恐，是恐吓的意思，是及物动词，这个字道理很精深，我不妨多说几句。官之为物，何等宝贵，岂能轻易给人？有人把捧字做到十二万分，还不能生效，这就是少恐字的工夫。凡是当权的那些大人物，都有软处，只要寻着他的要害，轻轻点他一下，他就会大吃一惊，立刻把官儿送来。学者须知：恐字与捧字，是互相为用的。善恐者，捧之中有恐，旁观的人，看他在上峰面前说的话，句句的阿谀逢迎，其实是暗击要害，上峰听了，汗流浃背。善捧者，恐之中有捧，旁观的人，看他傲骨棱棱，句句话责备上峰，其实受之者满心欢喜，骨节皆酥，‘神而明之，存乎其人’，‘木匠能人与规矩，不能使人巧’，求官的人细心体会，最要紧的，用恐字的时候，要有分寸，如用过度了，大人们恼羞成怒，作起对来，岂不就与求官的宗旨大相违背？这又何苦乃尔，非到无可奈何的时候，恐字不能轻用。”


    李宗吾苦口婆心，大谈恐字，现实生活的确如此。只捧不恐，这上峰有时会不把你看在眼里，你若拿到了他的丑处或私吞公款，或收受贿赂，或乱搞男女关系，他就老老实实地听你的。正人君子当然不能为此，缺德之人为达到某种目的，不择手段，是什么都干得出来的。


    某市有一个人，想建办一个厂，但手中没有资金，想贷点款，他找到银行，信贷员一口拒绝，他又找信贷部主任，去时拿了好烟好酒，主任说可以考虑。过了十几天毫无消息，再送重礼，主任说让再等几天，几天过后仍无消息。再去，与主任密谈，贷款1万，给主任1千，再把自己的一座小楼抵押上，主任看毫无风险，就满口答应，约定第二天晚上在主任卧室先交千元现金，然后办手续。


    第二天晚上，主任收下了1千元回扣，给此人办了手续，但此人却又要贷1万元，主任不给贷，他从口袋中拿出一盒磁带，原来他将二人晚上的谈话用小录音机录了上去，主任十分害怕，连忙答应再贷1万，自此以后，不用送礼，随时贷款，随时答应，这就是缺德术中恐字的作用。


    威胁的手法，自古就有，明朝宪宗年间奸臣焦芳在翰林院任翰林院编修，为经筵讲官，在东宫讲读。


    按照明朝的规制，侍讲“满九年考，当迁学士”。成化10年，焦芳从年限上说虽然够了，但他不学无术，水平相差很远。所以，有人对大学士万安说：“不学如芳，将以为学士乎？”这句话不知怎么传到了焦芳耳中。他猜疑是大学士彭华搞的鬼，立即露出一副无赖相，并传出危言，以行凶相威胁：“是必彭华有间于予也，他日不为学士，我将杀华于长安道上。”彭华怕焦芳铤而走险，就请求万安，万安不得已，只好让焦芳“升为侍讲学士”。焦芳就靠这种无赖手法，达到了伸手要官的目的。


    非到无可奈何的时候，恐字不能轻用。特别是与皇帝等握有生杀大权的人相处，若用“恐”字，用不好丢掉性命，皇帝最怕人揭他的短。


    凡是出类拔萃的奸雄人物，必有过人之处，或性格异常，或心理构造特别，正是吃了“狼子心，豹子胆”的，其行为思想有一个“三怕三不怕”公式。所谓三不怕，即在未得志之时，不怕天诛地灭，不怕羞宗辱祖，不怕神憎鬼厌，故能任性横暴，恣意贪取，视人家生命如囊中之物，这是鼠窃狗偷时期；所谓三怕，那是在已得志之后，这已是有权可弄，有威可摆。这是可以控制一切，播讲仁义道德的显赫时期了，这时最怕旧闻，怕见旧人，怕提旧事了。这些旧闻、旧人、旧事，恰恰又与旧日的手足有密切的关连，如果没有人说出当年打家劫舍、嫖赌杀戮的秘密，他就可以堂皇装饰自己，扯起无烟大炮，既可以说自己是天父降生，星宿下凡，一落地就能“仁义为神，道为骨，吐气成云屁成风”，把拦途抢劫说成济贫劫富。所以，在想装扮自己的时候，把鬼脸扮靓，将“吃过同锅饭”的亲密战友杀绝灭口，因为他们知道的秘密实在太多了，这是大人物的伟大障碍。


    清朝雍正皇帝，皇位来得不正，史传康熙本把皇位传于十四阿哥，是隆科多修改圣旨，雍正才当了皇上，当其他皇子不服时，握有重兵的年羹尧给予雍正有力的支持，隆、年二人对雍正当皇帝功劳最大，而且知秘密最多。因此，雍正皇帝非常惧怕二人，极力不升二人的官，但最终还是把隆科多和年羹尧害死了。


    恐吓，自古以来都是黑社会的拿手好戏，他们对权贵们用威胁的方法进行控制，或暗杀，或绑架，无恶不做。上海青帮势力曾用此法对蒋介石进行过“恐吓”。


    在上海滩，青帮势力雄厚，大凡名人都要疏通关系向青帮交纳保险费，这已成惯例。否则身家性命难保。


    蒋介石曾一度加入青帮，与青帮关系密切，蒋介石发动“四一二”反革命政变，屠杀共产党人时，青帮曾帮过蒋介石打头阵，立下“汗马功劳”。蒋介石后来当了国民革命军的总司令，但帮中规矩不能破，也要按例交纳保险费。


    宋美龄是富家小姐，也属应交保险费的人，她从美国回来后，她的哥哥宋子文一直替她交纳保险费，但她本人一点也不知道。


    宋美龄与蒋介石结婚后，得知蒋介石还要向青帮交保险费，大为不满，她认为蒋已是总司令，不应向青帮交什么保险费，蒋认为宋美龄讲得有道理，就决定不再交保险费。


    杜月笙很快知道了这件事情，他决定“劝告”一下蒋介石的这位新夫人。


    一天，一辆豪华的轿车驶到西摩路宋公馆，汽车里钻出一个司机和一个漂亮的使女，说是要接宋美龄去见她的姐姐宋霭龄。但宋美龄上车后，汽车却驶入了杜公馆。蒋介石开完会议来接宋美龄，而宋美龄仍没回来，蒋介石一问事情经过，就知事出有因。


    于是，他给宋子文打了个电话，让宋子文查问一下。宋子文听完蒋介石的叙说，很快明白了是怎么回事。他挂上电话，又拨了杜月笙的号码，杜月笙告诉宋子文，夫人安然无恙，不必担心。杜月笙谎称他手下发现夫人只由一个使女陪伴，在危险的上海街道开车。考虑到无时不有危险存在，为了她的安全，她已被送到一所舒适的别墅，她得到了应有的礼遇。


    宋子文得知底细后，立即向蒋介石作了汇报，然后亲自驾车前往杜月笙的府邸，履行了“例行手续”，将宋美龄从“受照顾”的别墅里接了回去。


    这是杜月笙给宋美龄一点小小的颜色看看，让她知道，上海滩是青帮的天下。同时告诉蒋介石，你曾入过青帮，不要忘了祖宗。


    青帮势力庞大，盘根错节，十分复杂，不易对付，这些人翻脸无情，若得罪他们，什么事都能做出来，因此，蒋介石极力与杜月笙搞好关系，杜月笙更乐意找蒋介石这个大靠山，拼命为蒋介石效力，二人狼狈为奸，干尽人间坏事。


    ## 静如处子，动若脱兔


    静如处子，动若脱兔，告诉人们待机而发。时机不成熟时，既要表现出胸无大志，又要表现出毫无能力。有人认为无所作为怎么能保住官位，这正是缺德学的奥妙之处。缺德学博大精深，变化无穷，非一般人所能吃透其中哲理。


    无所作为分为两种，一种是暂时性的，一种是永久性的。暂时性的是隐藏才华，先保住性命，等待机会，卷土重来，读过《三国演义》的大都知道，刘备依附曹操时，不问大事，只种菜浇园，当曹操与刘备煮酒论英雄时，曹操与刘备议论天下英雄豪杰，曹操说：“天下英雄唯使君与我。”刘备惊得把筷子掉在地上，此时外面恰好响起雷声，大雨骤至。曹操问刘备，为什么把筷子掉了。刘备忙说：“圣人云‘迅雷风烈必变’。一震之威，乃至于此。”曹操说：“雷乃天地阴阳击搏之声，何为惊怕？”刘备说：“我从小害怕雷声，一听见雷声只恨无处躲藏。”自此曹操认为刘备胸无大志，必不能成气候，也就未把他放在心上，后来刘备逃脱樊笼，对关羽、张飞说：“吾乃笼中鸟、网中鱼，此一行，如鱼入海，鸟上青霄，不受罗网之羁绊也。”


    三国还有一个又厚又黑的司马懿，当曹爽掌权时，就伪装成病重在身，耳聋目呆的样子，曹爽看他有病将亡，就不把他放在心上，当曹爽外出时，司马懿就发动政变，杀了曹爽，夺得军政大权。


    又有人说，人象刘备、司马懿暂时伪装为无所作为，目的是为了保命，哪有为了保官，一辈子无所作为的？


    试想汉代末年的汉献帝不正是无所作为，昏昏庸庸，曹操才让他做皇帝的吗？再看清朝的光绪帝，一生怯弱，唯慈禧太后命是从，皇位坐得也安稳，当他试图一展雄才大略，实行维新时，慈禧太后就将他软禁起来，最终被折磨而死，若他一直无所作为，有美味可食，有好酒可喝，有美女侍候，皇位也能稳稳地坐下去嘛。


    人都有一股不安分的心，时间一长，不免不愿受人控制，总想自己干一番事业，因此，要在高位上做到无所作为真是一件很不容易的事。缺德的功夫不到家是做不成的。


    汉景帝时，郎中令中，有个叫周文的男人。最初，他是文帝的御医，后来被任命为太子的医生。太子即位，成了景帝，他就被升为郎中令。周文言谈十分谨慎，他总是穿着补丁衣服，肮脏的裤子，故意弄得很邋遢。这样，景帝很放心，连寝室都让他随便出入，做房事时也让他在旁边侍候，景帝每问他对于臣儒们的意见时，他就说：“请您自己判断吧”，从不说牵扯大臣们命运的话，为此景帝两次专程去访问，表示敬意。


    武帝即位后，他仍作为先帝的宠臣很受器重。像周文这样的人能被三个皇帝器重的不倒翁，靠的是什么？当然是无所作为，唯唯诺诺。试想，换了别人，他看了皇帝的房事出门来会对另外的人说吗？一说，就要被杀头。再者，他与皇帝那样亲近，官居郎中令，却一点也不过问朝政，这不是无所作为又是什么呢？


    缺德学有千万种变化，愈研究愈深刻，其妙处永远不穷尽，如果读了这门学问，想立即去试一试，不免碰个头破血流，读一遍两遍缺德学根本不能吃透其中的精华。


    好比无所作为这个谋术，若用之不当，也不能起到应有的效果。


    张作霖当了大帅后，要论功行赏，大封部下，但手下的一个秘书长，却被撤了职。几个朋友替秘书长去说情。“大帅待人一向厚道，秘书长撤职后，未派其他差使，生活都成问题。”张作霖说：“我对他并没有什么，不过他作了8年的秘书长，没有同我抬过一回杠，难道我8年之中，就没有做错一件事吗？这样的秘书长，又有何益？”


    周文与这个秘书长，采用了相同的方法，两者结果却大不相同，看来，应用缺德学也要从实际出发，不可死搬硬套啊！

