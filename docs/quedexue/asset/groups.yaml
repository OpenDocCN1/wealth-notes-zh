    因为隐私的泄露而自杀身亡。她们分别是艾霞、阮玲玉、林黛、杜娟、丁皓、莫愁、李婷……等 12 位艳星。鲁迅先生曾经为此感叹曰：“人言可畏”。在很大程度上，这些艳星的死都与翻嘴调舌的长舌妇有关。在西方，我们不能说一个没有，但是像我们如此之多的情形还不多见。曾记得，1993
    年的中国首届国际秘密社会讨论会的情形。当时，因为住房紧张，一位先到的先生一人住了一间，而一位晚到的女士则作了大难。幸亏人家两位都是老外，人家索性住到了一起。事后，这位女士十分感谢男士的盛情。若是在中国，这可是大会的主要议题了。


    西方人的缺德是“愿者上钩”，中国人的缺德是“骗你上钩”，或者是姜太公钓鱼——你敢不上钩！一边是“缺”你有商量，一边是“缺”你没商量。东边是泥淖陷阱，西边是明目张胆。下面这“故事”颇为值得回味：


    在生活中，我常常遇到模糊陷阱。一次，我在一座城市刚下火车，因为是夜里，没有公共汽车，所以就想走着达到要去的地方。就在这时，一位摩托车司机走了过来。他说：“去哪？我送你。”我说：“要多少钱？”他很慷慨地说：“7块。”到了目的地之后，他说：“总共28块。”我不解地问：“怎么还有总共？不是说好了7块吗？”他振振有词地说：“我说的可是每公里7元呐。”无奈，我只好吃个哑巴亏。俗话说得好：“吃一堑，长一智。”我偏偏不是那种能长一智的人。那年我上山旅游，有两个轿夫看见我后赶快围了上来。他们说：“每人10块。”我和另一位同事十分爽快地答应了他的价钱。上山后，我掏出10元钱给他们。他们异口同声地说：“一个人10块。上山一个人'
