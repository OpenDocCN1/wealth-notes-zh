    # 缺德史话


    王子虎到馆驿见了赵衰，双方简单寒暄之后，就谈起了朝觐之事。


    王子虎说：“晋侯率领姬姓诸国，尊崇天子，实在是周王室的大幸！但是各国齐集京城，行李满街，车马结队，仆人随从众多，京城百姓从来没见过这么大的场面，会妄加猜测，引起流言，这反而会辜负了晋侯的一番好意。我看朝觐之事就免了罢。”


    赵衰回答说：“我君主想拜见天子，实是出于诚心，在派我来京城的那一天，已经命人通知各国，在温邑集合进京。如果取消朝觐，这不是拿王事当儿戏吗，我实在无法回国复命。”


    王子虎面有难色地问：“现在该怎么办呢？”赵衰故意思考了良久，才说：“古代天子有巡狩之典制，以观察四方民情。天子如果以巡狩为名，驾临温地，我君主借此机会率领诸侯朝觐。这样，上不失周王室的尊严，下不负我君主敬忠的诚意。不知此策是否可行？”


    王子虎连连回答：“你的策略，实在是两相方便，我当转达给天子。”


    周襄王听了大喜，约定十月驾车温地。


    赵衰回复晋文公。


    晋文公即以朝觐天子为名，通知各地诸侯，于十月朔日在温地聚齐。随后，晋、齐、宋、鲁、蔡、秦、郑、陈等10路诸侯齐集温地，朝觐周襄王。


    晋文公再次以霸主的身份发号施令，风光一时。


