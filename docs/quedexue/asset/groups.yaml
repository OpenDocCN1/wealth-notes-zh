    转败为胜。因为此时日本人还不想进攻长沙。事已至此，蒋介石只好装模作样地赶到长沙视察灾情，并下令调查起火原因。其实，究竟是怎么回事，蒋介石心里比谁都清楚。他也明白，此时不杀几个替罪羊很难平息民愤，也不好向外界交待。于是，蒋介石决定拿酆悌等人开刀。本来，酆悌等人均系蒋氏嫡系，在内战外战中替蒋介石出力卖命，充当鹰犬。他们万没料到，一向声称“爱学生”的“蒋校长”会借他们的人头来搪塞责任。


    功劳是自己的，责任是下属的，这也许是所有当权者的通病。'
