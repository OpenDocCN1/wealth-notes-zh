    # 缺德史话


    待。凡是西北军官兵前来，均请入内，任其受用，分文不取。玩乐之间，蒋介石的特务从中拉拢。久受冯玉祥家长制和严明纪律控制、饱尝艰难生活之苦的西北军官兵，对蒋介石这一手段很欣赏，他们羡慕将军的这种高待遇，于是就想改换门庭，很快就有许多人表现消极，冯军的战斗力下降。


    在中原大战后期，蒋介石又以河南省主席之职和大量金钱收买了冯的骁将吉鸿昌，随后又收买了梁冠英、张印湘、王修身等高级将领，使他们率部倒戈。冯玉祥几十万大军在几个月的时间内被全部瓦解。参加中原大战的阎锡山晋系也损失惨重，丢了平津、河北等地盘，退回山西老窝。


    蒋介石用釜底抽薪的阴谋取得了胜利。


    # 过得海便是神仙


    “瞒天过海”，即俗话所说“过得海便是神仙”的意思。


    军事斗争中，不少兵家利用敌方思维定势造成的司空见惯，麻痹大意，将密谋隐蔽在公开的事物之中，依靠伪装的掩护来完成特定的任务，运用瞒天过海的战术以致胜。


    瞒天过海又是封建官场应用极广的政治权术，因为在官场中尔虞我诈，互相欺骗，是很普遍的现象。


    我们先来看看信陵君的瞒天过海术。


    秦昭王派白起为主将，在长平歼灭赵国 40 万大军之后，乘胜直逼京师，把邯郸团团围住。


    赵王弟弟平原君是魏国公子信陵君的姐夫。因此，赵王几次写信给魏王和信陵君请求魏国出兵援救，魏王便派将军晋鄙统率 10 万大军去救赵国。'
