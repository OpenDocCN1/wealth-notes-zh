    ## 缺德学


    名文学家巴金就曾十分虔诚地回忆说：“文革”时真的感到自己有罪，不是别人强加给自己的。对此，有一位评论家评论道：这才是真正的悲剧。混淆是非、颠倒黑白，让真理在邪恶面前低头，恰恰证明了一个民族的缺德程度。随便举一个具体例子，比如陈白尘先生在“牛棚日记”中记述当时强加在他头上的罪名——以剧作《石达开》“影射红军，咒骂红军”；“借阅《红旗》，读完批判文章，心痛欲裂。作为中央的党刊，对一个党员作如此批判，其势犹如泰山压顶，是无从分辩的了。……申辩，将说我是反对党中央；不申辩，也是欺骗党中央！我将何去何从？”这种极其缺德的“神明裁判”法是“文化大革命”中置人于死地的一大诀窍：被诬者对付用这种捕风捉影的方法强加在自己头上的罪名，不仅彻底丧失了辩驳自明的权利，而且连这种辩驳也完全失去了存在的意义。


    拐着弯子让你进入圈套，这就是“礼帽”的文明做法。俗语说得好，软刀子杀人比硬刀子更可怕。


    比较而言，西方的缺德术在操作方式上远比中国来得干脆、利索、直接、明了。即以中西黑社会的犯罪而言，也是略有差异。熟悉英语的人都知道，西方的黑手党并非是“black
    hand part”，而是用一个专有名词：“maffia”。在中国，黑社会可以黑到抢了钱、得了色还将你杀掉；在西方，只要是达到了自己预定的目的，就不会滥杀无辜，颇有“信誉感”。


    中国人有“兔子不吃窝边草”的忌讳；西方人则是无遮无掩、干脆直接：“我的目标遍天下”。


    中国人缺德的一个大的方面是爱打听别人的隐私，并添油加醋地予以张扬；西方人对此索然无味，不感兴趣。以电影行业为例，从中国开始生产自己的电影起，至少有“十二金钗”因为隐私的泄露而自杀身亡。她们分别是艾霞、阮玲玉、林黛、杜娟、丁皓、莫愁、李婷……等12位艳星。鲁迅先生曾经为此感叹曰：“人言可畏”。在很大程度上，这些艳星的死都与翻嘴调舌的长舌妇有关。在西方，我们不能说一个没有，但是像我们如此之多的情形还不多见。曾记得，1993年的中国首届国际秘密社会讨论会的情形。当时，因为住房紧张，一位先到的先生一人住了一间，而一位晚到的女士则作了大难。幸亏人家两位都是老外，人家索性住到了一起。事后，这位女士十分感谢男士的盛情。若是在中国，这可是大会的主要议题了。


    西方人的缺德是“愿者上钩”，中国人的缺德是“骗你上钩”，或者是姜太公钓鱼——你敢不上钩！一边是“缺”你有商量，一边是“缺”你没商量。东边是泥淖陷阱，西边是明目张胆。下面这“故事”颇为值得回味：


    在生活中，我常常遇到模糊陷阱。一次，我在一座城市刚下火车，因为是夜里，没有公共汽车，所以就想走着达到要去的地方。就在这时，一位摩托车司机走了过来。他说：“去哪？我送你。”我说：“要多少钱？”他很慷慨地说：“7块。”到了目的地之后，他说：“总共28块。”我不解地问：“怎么还有总共？不是说好了7块吗？”他振振有词地说：“我说的可是每公里7元呐。”无奈，我只好吃个哑巴亏。俗话说得好：“吃一堑，长一智。”我偏偏不是那种能长一智的人。那年我上山旅游，有两个轿夫看见我后赶快围了上来。他们说：“每人10块。”我和另一位同事十分爽快地答应了他的价钱。上山后，我掏出10元钱给他们。他们异口同声地说：“一个人10块。上山一个人能抬上去吗？”人家说得有理，我们只好拿了20元。可令我们吃惊的是，这账并没有算完。接下来，人家还有更深一层的道理：“20元怎么能行？你们是两人，每个人都得给我们20块。”他们的话说得很肯定。出门还是别惹事，于是我们又白白送给人家20元。


    现在看来，这真是缺德头等标兵。连骗带蒙，不知不觉中你就到了井底下。


    这事在西方的表现并不突出。固然，西方人拼命地赚钱并不错。而且，只要能赚钱，他们会什么都不顾。所以他们的赚钱方法可谓无奇不有。有时真让人接受不了。不过，这可是周瑜打黄盖的事，谁也管不着。最近，笔者看到一则国外新兴的职业：


    不久前，在法国里昂举行了一次接吻比赛，赢得冠军的“接吻大王”在赛后乘机做起了生意，开办了“有偿接吻”业务，每“献技”一次收费5美元，很快吸引了不少女性，她们要在“接吻大王”的明唇上投师学艺，一尝快感。如今，该生意已做了两万多起。社会上有人认为，从事这项工作财色兼收，极不道德，而“接吻大王”却极力否认这种看法。在他看来，这样做并不存在什么有伤风化的情节，他所挣的不过是一点血汗钱。


    无论怎么为自己开脱，中国人都不会原谅他的职业。我这里引用一些中西的例子，只不过是想借此说明缺德的模糊性与明显性。并没有多少好奇成份。大家可能还听说过职业杀手的事情。不用讳言，中外都不乏以此为生者。在西方，职业杀手很是“职业”。尽管其从事的内容不道德，甚至可以说是极为缺德，但是就事论事，在“敬业”这一点上，人家又是极为“道德”的。只要你给了钱，你的事就算包在他身上了，而且是万无一失。即使遭遇不测，也与你出钱者无干，大有“好汉奸做好汉当”的“义气”。比如说他不幸落入法网，他也不会供出你的机密之事。在中国，那就远没有那么简单。你花了钱，却很可能是鸡飞蛋打；也可能会“偷鸡不成蚀把米”。说不定那一天，你也被“株连”进去，成为被告。


    在此，笔者并没有丝毫的欣赏念头。无论是杀手，还是粉头，中外的行业都是缺德之列的。只不过缺德的方式与内容有别而已。试想，如果杀手的职业道德越来越“高尚”，那岂不是助纣为虐！同样，倘若色情业的服务愈来愈炽烈，那岂不是大大坏了社会风气！一句话：越道德、越正规，越说明其缺德程度之深；反过来，又是缺德场合的另一种变形。缺德丛话就到此为止，欲动真格，且等以下几章的分解。


    ## 缺德定律：八仙过海，各显神通


    有的读者在看了半天之后一定发闷：你说了那么多缺德之人的缺德事，我们一定不敢缺德了。可有一点我们百思不得其解，若是遇到了缺德人的挑衅，又没有一个讲理的地方，究竟怎么办呢？


    以我之见，最好的办法还是“以牙还牙，以眼还眼”。这正如数学上的负负得正原理。否则，真是“秀才遇着兵，有理说不清”。比如说，当不人道的战争燃起之时，你还在那里讲什么仁义道德，那不是痴人说梦吗？倘若真是这样，你又陷入了不道德的境地。东郭先生和狼的故事人人皆知，狼无德，人也跟着瞎摆弄，怎能不令人发指？


    说实在的，中国古代的所谓“圣贤”并不乏缺德带冒烟的主儿。然而，他们的贤明地位却从来没有动摇过。为什么？人家有谱儿。打了胜仗，得了便宜，还要卖上一段乖。而且，在名义上还落个“仁至义尽”的美名。“桃园三结义”是传颂了几千年的一段美谈。可有谁知道，刘备的心思并不只是一个简单的“结义”。他表面上仁义忠厚，可肚子里的计谋却并不亚于“诸葛亮”。只不过是他自愿摆出一副“大智若愚”的样子罢了。“不能同年同日生，只愿同年同日死”听起来固然是“义”字当先，也催人泪下。可是，我们也明明看到，在硝烟弥漫的战场，“大难临头各自飞”的情形也在所难免。无论“各自飞”的理由是多么充足，但是作为旁观者的我们总觉“只可意会”。尤其是在关羽的“义”字上，我个人以为，是缺德的传统观念造成了关羽的迂腐、愚忠。江山如此多娇，而一代英雄竟折腰。事实上，他们“只愿同年同日死”的誓言最终还是成了“食言”。这里，必须说明的是，“义气”本身并不是缺德的概念，关键是当“义气”成为一种负担、变成一种伎俩时，它本身就失去了应有的价值。鲁迅先生这样给悲喜剧下定义说：“喜剧是将无价值的东西撕破给人看，悲剧是将有价值的东西毁灭给人看。”要知道，“义气”也分两重情况，有时是悲剧性的，有时则是喜剧性的。


    这使我不由得想起隋朝的杨广来。杨广的例子告诉我们，缺德定律讲的不光是一个针锋相对的问题。在很多情况下，你的缺德定律“英雄无用武之地”。您不是要“合法”地缺德吗？人家早已“合法”过了，看你怎么办？而且做得比您还技高一筹。


    杨广的缺德之行告诉我们：世界上有两种东西能摧毁人性和人伦，那就是权力和情欲。在隋朝统一中国后不久，担任攻击陈国总领的杨广开始了丧心病狂的夺嫡活动。他的哥哥皇太子杨勇遭殃。杨勇是一个大而化之的花花公子，为所欲为，不拘小节。老娘独孤皇后最讨厌男人有姬妾，杨勇偏偏反其道而行之。皇帝老子杨坚最讨厌大臣们花天酒地，而杨勇偏偏歌舞升平，饮宴达旦。这些东西对一国的皇太子来说本是一些小事件，可是也足以让杨广乘机而入。杨广只有妻子萧妃一个人，仅此一点就让老娘高兴不已。皇帝夫妇有一次到杨广家，发现婢仆们老且丑，乐器上布满了灰尘，甚至连弦都没有，不禁大喜。老夫妇每次派人到杨勇家，杨勇都是以居高临下的眼光看待他们，而到杨广家则不然，夫妻俩总是亲自到门口迎接，临行时并送以厚礼。于是，从皇帝老子那里听到的全是一片赞扬之声。杨广出镇江都，每次入朝辞行时都痛哭流涕，依依不舍，父母看儿子如此孝心，也流下泪来，不忍他远行。杨广知识程度很高，有很好的文学素养，待任何人都很诚恳，而且谦虚有礼，尤其曲意交接政府重要官员，包括杨坚最为信赖的宰相杨素。总之，他所展示出来的，全是一个千载难逢的标准领袖形象：具有肝胆相照、救国救民的英雄性格。诸如节俭、朴实、谦虚、好学、礼贤、不爱声色狗马等，可谓集美德于一身。


    一旦时机成熟后，“诬以谋反”的罪名就压在了杨勇的头上。杨坚下令将杨勇贬为庶民，囚禁深宫。并宣布改立杨广为皇太子。杨广“秘则事成”，马到成功。杨广得手不久便露出了马脚。其母过世后不久，其父病重，杨广入宫侍候。小人得志，这种心情使他无法继续控制自己。他见皇帝老子即将命归西天，便对早已垂涎三尺、老爹最为喜爱的陈夫人下了手。一天，他乘陈夫人更衣之际一把将其抱住，欲行不轨。陈夫人慌忙挣扎逃跑，杨坚见她神色仓皇，便问她是怎么回事。夫人垂泪说：“太子无礼。”杨坚大怒说：“独孤误我。”于是命令他的两位心腹速去长安召回杨勇。杨广得知消息后，急忙通知杨素，杨素立即把两位亲信官员逮捕，勒兵戒严，包围仁寿宫，断绝内外交通。杨广的部将张衡，闯进杨坚的卧室，将其拖起，猛击他的胸部。杨坚口吐鲜血，哀求的声音传入后宫，陈夫人等全体宫女面无人色。


    杨广弑父后的第一件事就是找他的漂亮庶母陈夫人睡觉；第二件事就是派人赴长安将其心患杨勇除掉。杨广从开始夺嫡行动到他凶相毕露之日，历时14年。在这段漫长岁月中，他一直伪装得很隐秘。照实说来，若是没有一身练就的缺德素质，真是比登天还难。杨广之所以做得天衣无缝，就是因为他从缺德国中土生土长。


    究竟是世界改变了我们，还是我们改造了世界？这又是一个鸡生蛋、蛋生鸡的问题。但是，有一点我们现在可以做个结论：对待缺德素质较高的人，我们是万万不可去用教化的方式来解决问题。如上所述，对狼的恶性您就不需要讲什么仁义道德、良心发现。杨广的例子最能说明问题。在这个关键时刻，即使您给他磕头作揖也无济于事。“蛇与农夫”的故事则是一则童话。但这则童话的现实意义却是永恒的。说白了，对待像蛇一样的恶人，我们没有什么不可以做的。


    “朱门酒肉臭，路有冻死骨”说的同样是一种极为缺德的社会现象。“损不足而奉有余”的历史在中国比比皆是，而且渊源流长。以古代的实情为例，蔡京是宋朝有名的大奸臣。他的生活极其奢侈堕落。据史书记载，他的一餐包子宴要花费130万钱。元代笔记《东南纪闻》的原文这样说：有一次，蔡京请下属吃饭，点心是蟹黄包子。按照时价计算，当天仅一顿包子的花费就达1300缗钱，即是130万钱。而当时一般士大夫的消费每天也就是百钱左右。苏东坡谪居齐安时每日的花销是150钱，而且还有余钱请客。那时有个颇为讲究享受的官吏“十口之家，日用一千”，就被上司断定为“定非廉士”。如此看来，这样的世态正应验了那句古老的格言：“只许州官放火，不许百姓点灯”。毕竟，那位“日用一千”的官吏还是头带乌纱帽的大夫，要是老百姓，那就和蔡京差得更远了。在宋代，颠沛流离、卖儿鬻女的悲惨现象可谓不绝于目。有这样的宰相在，人民哪会有什么好日子想啊。


    您不必太在意，人家根本就不是故意的，人家只是习惯成自然而已。反正生活中本来就有许多不平事，所以我们只能自己安慰自己，自己为自己寻找一点开心。“忍”，好难认的一个字！可又有“谁解其中味”啊！


    时代毕竟不一样了，今天的你我难道一定要去重复昨天那个老掉牙的故事？


    回答当然是否定的。凡此种种，我们就拿缺德学的“定律”奉献给您，我的朋友。


    人不犯我，我不犯人；人若犯我，我必犯人。这就是对付缺德之人的妙方。


    在春秋时期，鲁国和颛臾这个小国唇齿相依。而且，颛臾这一小国已经向鲁国称了臣。即使这样，鲁国的国君季康还是不放过它。这就是《论语》中“季氏将伐颛臾”的由来。在这篇文章中，孔子讲述的不该“祸起萧墙”的道理十分深刻。只是没有下文，这里我们不妨设想，鲁国不仁，颛臾会不会“义”呢？或说该不该“义”呢？照我们的理论，颛臾不能坐着等死。


    说白了，我们要学会“合法”地缺德。


    ## 驾驭缺德：山穷水复疑无路，柳暗花明又一村


    人们在生活中常常有各种各样的无奈式感叹，其中“好人不常寿，坏人活百年”这句话就是针对缺德之人的一种诅咒。至少，他们是很不满：为何坏人还能活百年呢？恨不得他们即刻死亡的急切心情跃然纸上。当我们常常陷入缺德的圈套而不能自拔的时候，是否也会产生同感呢？遭遇缺德的时候，我们又该作何处理呢？


    第一，“草木皆兵”法。在生活中，无论是出门在外，还是寓居家中，都需要有较强的防范意识。“人人都献出一点爱”是歌曲里的一个美好愿望，切不可简单地以为“人之初，性本善”。更何况，人之初，性本善，并不等于他一成不变。千万不要以为世界早已变成一个美好的乐园。警惕！您身边时刻会出现危险。所以，在精神上时刻保持高度的“紧张”，有百益而无一害。1995年，公安部门破获了一起“黑衣人”的特大恶性杀人案。这名杀人犯心黑如炭，狡诈多端，用假身份证住进旅社，作案27起，杀死了25人。我们现在不去关心他是如何作案的，还是让我们先来看看其中的两位是如何幸免于难的吧。有这样一位青年，他带着女友出差，将女友安排在同一房间，他和“黑衣人”住在了一起。那位黑衣人几次和他套近乎，他都不予理睬。当天，他和女友上街买东西，回来后发现自己的枕头下面的身份证等物件不见了，立刻提高了警惕。夜里，那人喊“老乡，老乡”，他就是不答应。当黑衣人向佯装睡着的他举起匕首时，他大喊一声：“干什么？”黑衣人没有得逞。


    对待虚伪的人，你要比他更虚伪，不然你就有大祸临头的危险。同样是上面提到的那个黑衣人，他作案屡屡得手，而对其中的两位却是一筹莫展。除了上面已经说过的那位，有一个老头倒也算是老谋深算。当和他住一个房间的黑心人套近乎时，他便装起穷来，说自己是下岗工人，生活贫困，每个月只发50元生活费。这次来是为工厂讨债的，也不知能讨来不。其实，这个穷老头是个带着万元闯天下的推销员。保持高度警惕的老头因为不愿“露白”而幸免一死。古语说：“君子无罪，怀璧其罪”。这句话的意思是，您本来没有死罪，只是因为您暴露了怀中的那块价值连城的美玉才带来死罪的。


    任何人都不能不相信，这是铁的戒律。在生意场上更是如此。


    第二，“守口如瓶”法。“病从口入，祸从口出”。谁管不好自己的嘴，谁就会在关键时候吃大亏。尤其是当今人欲横流的时代。也许，我们平时对我们自己所说的话并不太在意，这可就是一个大漏洞。大家没有利益冲突，一切都好说定，若是论起真来，“言多必失”的教训就出来了。背后议论人是大忌，背后议论领导更是大忌。说不定哪一天你的话就会不胫而走，传到领导的耳朵里，到时候想收回来，可就不那么容易了。读者诸君，您要是经验少、阅历浅，还真有必要好好琢磨琢磨这些事体。笔者认为，自古以来中国的政治运动中，各派势力的倾轧中，整人害人的操作中，都有一个接一个的告密事件发生，这仿佛一条缺德小人的游戏规则。问题的关键是，告密大多数情况下又和诬陷是一对孪生兄弟。罗织周纳，吠影吠声，花样百出。中古以前就不多举了。从唐朝起，举无须寻索的显例，就有武则天这位女皇为剔除异己，大倡告密之风的盛举。她重用来俊臣、周兴、索元礼等大批酷吏，专门制造冤案，号召天下无赖，到长安去揭举，诬告者非但不反坐，而且供给驿马、食宿以及各种奖赏。于是朝士上下告密成风，演出许多荒唐故事。不仅酿成大批冤狱，屈害了大量显宦和平民无辜者，流风所被，非但政治性的谋反案告密者无数，连日常生活琐事，邀宠希赏之徒也竞打小报告以求一逞。此后宋、明、清各朝，告密事件层出不穷，如宋代元祐党案，明末东林党案，清代各起文字狱中，都有大批告密者纷纷出笼。其中有些还是颇有文名的佞人，如明末的阮大铖，写过《风筝误》、《燕子笺》等戏曲，很有点才情。他早先想依附东林直士左光斗，后来疑心东林人士对他不利，便投靠权阉魏忠贤，献上《百官图》，等于是一份“瓜蔓钞”式的黑名单，意欲置东林群贤于死地，假权阉之手一网打尽之。果然不出其所料，阮大铖立了大功，风光了一阵。可令其没有料到的是，新君登位，他被打入“逆案”，更为士林唾弃。由此，我们还可以联想到50年代后期以及“文革”时期的那段历史。这一时期士风颓败、社会道德大滑坡是与古代的故事一脉相承的。1955年的胡风案，因人告密，私人信件被人精摘精编成《材料》，诬人以十大罪状，造成成千上万人的大冤案。告密者一时成了风云儿，占尽人间春色。此风一起，天下无行之徒率先效尤，为了趋吉避凶，大量的人为了表示“觉悟”、“积极”，做窃听机器，打小报告。十年内乱时期，乱诬乱攀，父子构陷，夫妻揭丑，卖友背戚，六亲不认，天下道德荡然。


    一言以蔽之，一部缺德的历史就是一部黑透了的告密史。对此，我们切不可掉以轻心。


    第三，“以柔克刚”法。人是社会关系的总和。一个人生活在一定的环境中，总会受制于人。同事、上司、客户都是您常常短兵相接的敌人。这其中难免有一些狼心狗肺的人，因此要想在“四面楚歌”中轻松地活下去，就必须学会“以柔克刚”。对上司，虽说您不一定要为拍马屁而整天魂不守舍，但最起码的尊敬还是要有的。拿破仑这样说过：“不想当元帅的士兵不是好士兵。”您若是有真意，就更需要小心从事了。爱听好话是人之常情，谁都不愿意人家将自己说得一钱不值。即使一钱不值者亦是如此。有人说，“我就看不惯那些溜须拍马的奴才。”其实，他心里也明白：刺头总是得不到好报。由此，是否在工作中要多来一点“高帽子”。有时候，顺着上司的话走下去，把他的主意说成是一个绝妙的办法，进一步把他吹成一个响当当的人物，他会更得意。当然，“以柔克刚”并不是要你漫无边际的死吹、瞎吹，而要有一个节制。这就是要“实事求是”。即是把同样的意思说得更婉转、更艺术些。


    生活中曾流传着这么一则笑话，听后很受启迪：说得是一个很有学问的私塾老先生很不喜欢别人奉承人。一天，他的学生要到下面的一个县里做太爷。临行前，这位学生前来拜访老师。老师问他：“此行有何准备？”学生答曰：“我准备了一百零一顶高帽子。”老师听后甚为不悦。学生沉思良久说：“老师，天下像您这样刚直不阿、不喜欢听人奉承的人能有几位呀！”老师听罢笑着说：“这倒也是！”事后，这位学生对别人说：“我的高帽子只剩下一百顶了。”


    第四，“糊里糊涂”法。凡事不能太认真，一旦认真过了

