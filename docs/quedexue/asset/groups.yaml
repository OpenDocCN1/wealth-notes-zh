    # # 像雨像雾又像风


    深藏不露是君王用以控制臣下的一种手段。聪明的当权者，一般不愿轻易表露自己的观点、见解和喜怒哀乐，而是把自己的思想感情隐藏起来，以免让别人窥出自己的底细和实力。这也是在臣下面前树立权威的重要方法。大凡帝王的深藏不露，或是由于情况不明，不便表态；或是由于时机未到，不可鲁莽；或者由于形势不利，无力反击。因此，帝王的深藏不露，便是为了弄清情况等待时机、积蓄力量，而决不是长期隐'
