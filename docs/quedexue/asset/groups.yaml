    ## 缺德学


    左侧是周总理批示：“请人民银行立即拨给二十万元”及总理签名。下面注有：“为避免资本主义国家造谣，（1）要市场流通旧货币；（2）要拾圆票，包装好看一点，七时务必送到民族饭店赵全一（西藏工委宗教事务部）。”


    当晚七时，银行工作人员按照当时人行副行长石直“请会计发行局立即把款送去”的批示，把装满两麻袋的现钞共20万元人民币，如数交给了“赵全一同志”。


    事过6天后，银行负责同志向总理办公室请示这笔款如何下账，问谁都不知道这回事，西藏工委根本就没有向总理打过报告要款修缮寺庙，更没听说活佛讲经会的事，这才知道上了骗子的当。这起通天诈骗案，顿时轰动了中南海，震惊了公安部。经过公安人员的日夜奋战，在案发后的第16天，即4月1日，化名“赵全一”的大诈骗犯王倬终于落入法网，他原是国家对外贸易部出口局计划处干部。


    王倬编造毛主席的口谕，模仿周恩来的字体伪作批示，假托王命，行骗到中国人民银行总行，骗取巨额现金，可堪称建国以后第一号骗子手。


    在他看来，撒谎撒得越大，越不容易引起怀疑。撒小谎，耍小聪明，人人都敢，而弥天大谎却为绝大多数人所不敢做的事，甚至连想都不敢想，因此他倒可以乘虚而入。60年代初期，毛泽东、周恩来的威信，用俗话说，那是“绝对权威”。主席口谕、总理批示，谁轻易去“胡思乱想”地怀疑、猜测呢？罪犯正是抓住这一点，狗胆包天实行诈骗，加之王倬在国家外贸出口局计划处工作，熟悉中央机关首长公文来往那一套程序和做法，视为他行骗的有利条件。殊不知，“机关算尽太聪明，反误了卿卿性命”，王倬骗到的巨款还没有来得及挥霍，脑袋便已搬了家，王犯的母亲因窝赃包庇也被同案处理，判刑15年（后死于狱中）。


    ## 娇媳变成嫩妻


    移花接木，原意是指嫁接花草树木。后来，人们则用以比喻暗中使用手段、计谋，以伪易真，或在真情进行过程中更换人或事物。


    移花接木计的核心内容是以伪易真，要达此目的，往往采取偷天换日，冒名顶替，张冠李戴等手段。此计适用范围相当广泛，无论官场、商场，还是情场、战场，都可采用。


    卫宣公用这一计谋，将儿子的媳妇据为己有。


    卫宣公在做公子时就淫纵不检，与其父庄公之妾侍名叫夷姜者私通，生下一子叫急子，寄养于民间，到宣公即位之日，元配邢妃无生育，独宠其旧情人夷姜，如同夫妇，其私生子急子也凭母贵，立为公子做继承人。到急子年已16岁时，为之婚聘齐国僖公之长女齐姜为媳妇。但当使者往齐国行聘回来的时候，卫宣公闻听媳妇有绝世之色，便意乱神飘，却又难于启齿，乃想出一妙计，令巧匠在两国的界河上，筑一座华丽新台，后来又以聘宋为名，令急子为外交特使遣往宋国去。布置停当，然后派人到齐国迎接儿媳妇过门，到达沧河时，这位扒灰老爷已恭候于新台。肥水不流外人田，父承子业，生米煮成熟饭，枯树嫩藤，娇媳变成了嫩妻。到了急子回来，见此尴尬局面，只好自认晦气，乖乖叫未婚妻做庶母。


    雍正皇帝则要靠弄移花接木的权术，夺取了皇位。


    清朝康熙皇帝从公元1662年登基至驾崩，连续做了61年皇帝，他是中国上下五千年历史上在位最长的一位封建皇帝。三宫六院皇后妃子给他生了30多个儿子，可以编成一个皇子排。其中第四子爱新觉罗·胤禛最有权谋，文武兼备，只是反复无常，康熙皇帝对他不放心，诸皇子对他不拥护；第十四个爱新觉罗·胤祯聪明、贤达、仁慈，文武兼优，深得康熙皇帝和皇后的喜欢，在诸皇子中众望所归，是继承皇位的最佳人选。康熙六十一年，康熙帝临终前亲笔立下遗诏：


    “传位十四子胤祯”。


    遗诏写好后，锁在祖传铁盒中，交内侍太监梁英密藏，钥匙挂在康熙皇帝的脖子上，可谓再保险不过了，老四胤禛得知此事后，密令内务大臣隆科多伺机篡改遗诏，以争夺继承权。


    当康熙皇帝病重将死之际，隆科多支开一切侍者，盗取钥匙，打开盒子，取出遗诏，把“传位十四子胤祯”中的“十”字上头加一短横，下端往左加一勾，那“十”字便成了“于”；再把“祯”字略添几笔，改成“禛”字。只此稍做手脚，便把康熙皇帝的遗诏改成了：


    “传位于四子胤禛”。


    就这样，靠移花接木的手法，编造出一道字字千钧且又是弥天大谎的假遗诏。


    康熙皇帝死后，人死自然灭口了，又是他生前的亲笔御书，雍正也就遵照先帝“遗诏”即了大位，凭一句谎言便当了13年皇帝。后来雍正皇帝为了安坐龙椅，还处死了隆科多，杀人灭口，以除掉后顾之忧。


    现实生活中，也有一些缺德之徒，运用移花接木之术，为自己谋取私利。河北廊坊地区发生的杨振秀状告“杨振秀”的案件，就是其中一例。


    1988年，年仅17岁的马建华参加中考，以10分之差落榜了。生性倔强而又肯吃苦的马建华，想继续读书，但家里的经济困难却使她一筹莫展。父亲马宝玉了解女儿的心事，他下决心送女儿到外县一所中学补习。马建华经过一年苦读，成绩不断提高，渐渐地萌发了做一名教师的想法。转眼间，1989年中考临近。按规定，往届生是不能报考中师的。怎么办？马建华和她的父亲苦思冥想，终于想出了一个对策。1989年6月初的一天中午，马宝玉邀请大北尹中学的有关领导坐在了乡政府小会议室的饭桌旁。经商定，让马建华借用一应届毕业生中不参加中考的女生的名字和学籍表，报考廊坊师范学校。在乡中学教务室的办公室里，马宝玉从不参加中考的学生档案里，选中了本村的杨振秀。他心想，俩闺女同村，同龄，又是表亲，今后一旦出事也好调和。1989年6月下旬，马建华以杨振秀的姓名第二次参加了中考并一举中榜。1989年8月31日，马宝玉将本村会计王书汉请到家中，吃喝之后要求其出具两个证明：一是证明马建华是马宝玉的养女，原名杨振秀，如今考入廊坊师范学校，恢复原名；二是证明本村的“杨振秀”考入廊坊师范学校，请派出所准迁户口。吃了人家嘴软，王书汉只好按照马宝玉的要求开出了假证明，于是马宝玉持假证明将马建华的户口和粮食关系迁往廊坊市。1989年9月1日，马建华高高兴兴地迈进了廊坊师范学校的校门。不过，这时她的名字已改成“杨振秀”。1991年12月5日，杨振秀的父亲杨万友意外地收到一封廊坊师范学校邀请他参加三年级学生家长会的信。杨万友十分纳闷，自己女儿已务农三年……怪了！不久，杨万友在赶集路上遇见了马建华的母亲，问：“你闺女在学校叫什么名字？”这一问，使马母倒吸一口气。晚上，马宝玉与妻子一起赶到杨家赔礼道歉，当时气氛还算融洽。可是，隔了没几天，事情突变：杨家向马建华学校所在地廊坊安次区人民法院起诉。原告杨振秀，状告马建华冒名顶替，侵犯了她的姓名权。在法庭上，原告杨振秀提出：我的户口被非法转移，姓名被他人假冒，非常痛苦。请法院为我恢复名誉，并判决被告赔偿我的精神损失费5000元。经过法庭调查、辩论，在原告拒绝调解的情况下，合议庭经过慎重合议后审判长郑重宣判：马建华、马宝玉、王书汉、大北尹乡中学的行为侵犯了杨振秀的姓名权。被告马建华立即停止侵害；由被告向原告赔礼道歉；由被告赔偿原告直接经济损失586.5元，精神损失800元，共计1386.5元。马建华就读的学校也表示可能将马建华除名。马建华、马宝玉等人采取冒名顶替的卑劣手法，不仅侵害了他人的姓名权，也害了他们自己，真可谓偷鸡不成反蚀一把米！


    ## 假作真来真亦假


    真的就是真的，假的就是假的。这是一种客观现象。然而，判断真、假的主体是人，人的阅历是有限的，人的视野也是有限的，事事能明察秋毫的人是不多的。实际上，人大部分时候是糊里糊涂的。这就给那些奸佞邪恶之辈以假乱真创造了条件。


    以假乱真，须在“真”字下功夫，要从各个细节做起，将假的做得像真的一样，以造成对方的视觉错觉，混淆对方的真假概念，使其模糊不清，即所谓“假作真来真亦假”。当然，也要讲究时机，时机不当容易引起对方的怀疑。


    以假乱真，制造骗局，达到目的的事例举不胜举。


    东皋公运用此计，帮助伍子胥躲过了楚王的追杀。


    伍子胥在驿馆听到楚太子建被杀的消息，心惊肉跳，急忙带着建的儿子胜逃出郑国。又怕郑国来追，他们白天不敢露面，星夜赶路，慌慌张张来到陈国，准备到吴国去。


    昭关（今安徽含山县西北）是两座山当中的一个关口，平时也有官兵把守。楚平王和费无极料到伍子胥准会到吴国去，于是特意派大将蔿越带着军队守在那里。关口上挂着伍子胥的画像。对于这些，伍子胥一无所知。


    伍子胥和公子胜来到昭关60里处的历阳山，在树林中弯弯曲曲的小道上行走着。


    忽然从树林中走出一个老头，上前作揖说：“伍将军上哪去？”


    伍子胥急忙回答说：“老先生别认错了人，我不姓伍！”


    那老人笑着说：“真人面前不说假话，我乃是扁鹊之弟子东皋公，一辈子给人看病，在这儿有点小名声，观己年老，隐居于此。”


    伍子胥说：“先生有何指教？”


    东皋公说：“前天我去给把守昭关的蔿越将军看病，在关口上瞧见有张贴有伍子胥的画像。今天一见面，就认出是你。这里不是说话的地方，请随我山后寒舍叙谈。”


    伍子胥见东皋公诚心如此，就同公子胜随老人到他住的茅舍。


    东皋公说：“昭关把守森严，公子如何才能出关，必想个万全之策，不可贸然行事。”


    伍子胥当下即下跪道：“望先生想法使我脱险，日后必当重报。”


    伍子胥心急如焚，度日如年，一夜间悉白了头发。伍子胥在东皋公那里一连过了七八天，东皋公也没提起过关的事。


    又过了几天，东皋公带着一个朋友，名叫皇甫讷的回来。其人长相与伍子胥很像。东皋公将皇甫讷介绍给伍子胥，接着商量过关的办法。


    第二天一早，伍子胥扮作仆人，皇甫讷化装，穿上伍子胥的衣服，便向关门走去。


    把守昭关的士兵看见有人慌里慌张地过来，已经疑惑他定是逃犯，细细一瞧，果然是伍子胥，不由分说，一哄而上将他拿下，拉到蔿越面前。


    蔿越一见就说：“伍子胥你想瞒得过我吗？”


    守关的士兵见将军也认定其人是伍子胥，便把他捆绑起来。守关的其他将士听说拿到了伍子胥，都来围观，也没有谁再去对出关的人一一查验了。


    正是在这个时候，机智的伍子胥与公子胜混入出关的人群，乘关门大开没人盘查之机，匆匆出了关门。


    皇甫讷被当作伍子胥被捆绑起来后，蔿越亲自审问，并准备押送到郢都，向楚平王报功。


    但在审问时，这个伍子胥矢口否认，说自己根本不是伍子胥，而是住在这附近的龙山洞下隐士皇甫讷，自己没有犯法，为何无故被拿？再说蔿越在这以前，曾见到过伍子胥，听过伍子胥的讲话。现在听这个人的口音也不大像，不觉犯疑。


    知根知底的东皋公，故作镇静，见到蔿越，兴致勃勃地说：“恭喜！恭喜！听说拿着了伍子胥，我特地来道喜。”


    蔿越说：“士兵拿到一个人，脸庞身材都像伍子胥，但他不肯招认，听他口音也不大对头。”


    “是吗？让我帮你辨认。”东皋公慢慢地说道。


    蔿越一声令下，卫兵即将伍子胥推上前来。


    “伍子胥”一见东皋公，眼泪直往下淌，大声嚷道：“我们相约一道出关，你怎么现在才来呀，害得我莫名其妙地受欺侮，说我是伍子胥。”


    东皋公笑着对蔿越说：“拿错人了，他是我的朋友皇甫讷，跟我约好在关前见面，一起出去玩，怎么把他逮着了？”说罢，从袖中抽出文牒，交蔿越观看。这时，蔿越才恍然大悟。


    又如希特勒，这位战争元凶，由于罪孽深重，生怕遭人暗算。于是盖世太保以希特勒为范本，炮制了个赝品来当替身。


    这三个人经过整容专家的刻意修饰之后，不是特别熟悉希特勒的人，在一二十米之处是很难分辨出真假的，替身的主要工作是代替希特勒乘车巡行，检阅部队，或参加不需要说话的游行集会。当然，如果临时急需，而场合又不太重要，他们中的一人可以代替希特勒发表简单的演说——其声音也和希特勒极为相似。


    三个替身分别轮流在柏林、慕尼黑和贝希特斯加登值班。没有人知道他们的真名实姓，只知道他们的代号“第一”、“第二”和“第三”，并分别有自己的绰号“小威利”、“老俾斯麦”和“布齐”。三人中，只有布齐曾经在慕尼黑代主人受过。那一天，慕尼黑的“褐衫党”徒们举行集会，照例要接受元首的检阅。整个马司米连大街上成了彩旗和鲜花的海洋。狂热的党徒们声嘶力竭地呼喊“万岁——希特勒”，站在敞篷汽车上的“元首”神情激动，不断地向人们挥手致意，当检阅车队行进到国家戏院附近时，只见“元首”突然浑身一震，脸色变得雪白——布齐的肩部中了一枪，从伤口汩汩流出的鲜血很快浸透了前衫。但布齐并没有倒下，只是身子晃了晃，随即神态自若，挺立如常，一直坚持到检阅结束。由于行刺者的枪上装有“消音器”，所以，除了同车的人，谁也不知道“元首”受了伤，为此布齐曾受到希特勒的嘉奖，并得到一次假日和5000马克的奖金。


    替身们的活动都由盖世太保操纵控制。行动计划、行走路线、活动时间等有严密的部署。即便如此，也有忙中出错的时候。一次，希特勒去巴伐利亚会见纳粹党的另一位负责人，同时，有一个替身被派往法兰克福。结果，慕尼黑和法兰克福的新闻机构，同时报道了希特勒在当地公众面前出现的消息，世界舆论一片哗然，搞得希特勒非常狼狈。当然，元首是不会错的，错的是他的党徒，有三个高级盖世太保为此而倒霉。


    替身们待遇丰厚，生活非常优裕。但是，他们失去了人生最宝贵的自由。他们的一言一行都受到严密的监控，不可多说一句话，不可多走一步路，见不到亲人，也没有朋友，几乎完全与世隔绝，最多只能和希特勒的佣仆们厮混。


    所以，我们在辨别真假时，切切要记住一点，不要把注意力过多地放在对真假的解释上，而要牢牢地抓住真假的基本原则。只有这样，才不至于为对方的种种花招所蒙骗。


    ## 三、保住既得利益的妙法


    人怕出名猪怕壮，这不是吃不着葡萄就说葡萄酸。


    功高震主。当你最得意洋洋之际，也是危机重重之时。既可以让你荣华富贵，也可以让你家破人亡。所以得意莫忘形，得势需知退。否则，“机关算尽太聪明，反误了卿卿性命”。


    “祸兮福之所倚，福兮祸之所伏。”


    ### 趁着走红快退休


    俗话说，功高震主。大臣权势声望最高的时候，往往也是危机最重的时候。因为在封建时代，皇帝掌握了臣子的生杀予夺之权，他既然可以让你荣华富贵，那么他就可以让你家破人亡。作为万人之上的君主，他最担心的是大权旁落，你的权势大了，各种流言蜚语也来了，君主的疑心也来了。所以为官者，对付缺德的君上，切记老子所说的一句话：“祸兮福之所倚，福兮祸之所伏。”功成名就之时，也是退步抽身之时，千万不要被胜利冲昏了头脑。


    范蠡和他的朋友文种不同的结局则充分说明了这一点。


    越王勾践在范蠡和文种的帮助下灭了吴国，为了庆祝胜利，下令在国都内设置高台，在上面大摆宴席，宴请各位有功之臣。


    酒宴之中，众人难免得意忘形，到处是行酒猜令，整个高台是一片欢声笑语，好不热闹。只是越王勾践显得有些沉默少语，端着酒杯好久不喝一口，像有什么心事。


    灭吴首席功臣范蠡十分敏感地捕捉到了越王的反常心态表现。他知道，作为一国之君所必有的猜疑之心又完全占有了越王的心胸。他现在考虑的已经不是什么共享欢乐，而是怎样确保自己的江山不更姓易名了。想到这里，范蠡不由地感叹到：“这说明大王不想把灭吴强国之功归于众人的努力，不想与大家共享欢乐。如若不及时引退，恐怕凶多吉少。”


    第二天一大清早，范蠡便到宫中向越王勾践辞行。他对越王说：“臣下听说，君主犯了忧愁，臣下就要四处奔走，不惜劳苦，为的是解除君主的忧愁；君主受了污辱，臣下就该以死自责，不能苟且偷生。以前，大王您在全稽受到吴国的污辱，我之所以没有死，就是为了帮助大王雪会稽之耻。现在会稽之耻已经洗去，臣下的任务也已完成，特地来请求大王赐臣下死刑，以惩罚臣下使大王蒙受会稽之耻的行为。”


    越王勾践表现出十分惊讶的神情，对范蠡说道：“先生为灭亡吴国立下了不朽功劳，我怎么能加罪于您呢？”


    范蠡紧接着说道：“既然大王赦免了臣下的罪过，就请大王给臣下一个将功补过的机会。让臣下辞去官职，归老于江湖之上吧。”


    越王勾践坚决不同意，他用毫无商量余地的口气说道：“我将与你平分越国，共同治理。如果您不答应的话，我就要杀了您的全家。”


    范蠡心知越王勾践的真实意图所在，他无所顾忌地坚持要离越王而去。他说：“大王自然可以下令行施您的命令，可臣下仍然要按照自己的意愿去做。”


    第二天一大早，越王勾践见范蠡没有上朝，便立即命人到范蠡家中去请。谁知已经晚了，范蠡已于昨天晚上携带着家眷和金银细软远走他乡了。


    为了表彰范蠡的忠诚不渝，越王勾践将会稽山封给范蠡为封邑，并令人铸了一尊铜像放在大堂中的案几上，以示范蠡仍然在参与国政。


    范蠡离开了越国之后，到了齐国，在那里成了巨富，人称“陶朱公”，商贾之人尊为远祖和财神。


    范蠡在决意隐退避祸的时候，他没有忘记与自己相约入越、共事多年的老朋友文种，同样关心文种的安危。在出走前，曾劝文种也离开越国，说不然会被越王杀掉。文种或许是因为贪恋权位，没有理会范蠡的好意。范蠡离去之后，又特意写了一封书信语重心长而又一针见血地诫文种说：“飞鸟尽，良弓藏，狡兔死，走狗烹。越王为人长颈鸟喙（嘴），可与共患难，不可与共乐。子何不去？”文种见书，心有所动，但行动犹豫，未能果断离越。越王勾践确实如范蠡所料定的那样，自从国家兴盛之后，日益骄横，往日那种虚心纳谏的风度没有了，君臣离心，许多与他共患难过的大臣都疏远了。文种也终日心忧不乐，乃至装病在家，不敢去朝见越王。不久有人进谗言说：“文种助君王霸于诸侯，今官不加增，位不益封，乃怀怨望之心，愤发于内，色变于外，因此借故不朝。”越王对文种产生了疑心。过了些时日，越王一面让文种升为相国，一面步步进逼，进行旁敲侧击，曾故意召文种而问之：“吾闻知人易，自知难。相国自知何如人也？”文种已知祸将临头，只答道：“大王知臣勇，不知臣仁也。知臣忠，不知臣信也。臣曾数度进言劝大王减少声色玩乐，奇说怪论，尽言竭忠，以至忤犯了大王，必然以此获罪。当时伍子胥在吴国被夫差诛杀时，对臣说：‘狡兔死，良犬烹。敌国灭，谋臣亡。’范蠡也曾说过这话。今见大王所问，臣知大王的意思了。”勾践默默不语，但已下决心除掉文种。又过了一段时日，越王果然凶相毕露，恶狠狠地对文种说：“你有阴谋兵法，足以倾敌取国，你献九术之策，今用其三已破强吴，其六尚在你处，愿你有幸带着余术去见我的先人于地下，跟他们去谋算吴国的先人吧！”至此文种自知祸已临头，他仰天叹道：“呜呼！吾闻大恩不报，大功不还，讲的就是这样的吗？吾悔不随范蠡之谋，以至于为越王所戮。”越王即赐剑命他自杀，文种狂笑着伏剑而死。文种含冤而死，范蠡之言不幸而中了。


