    石显说：“人命关天，萧望之这次犯的罪不过是言语不当，没什么了不起，他怎么能轻易自杀？”汉元帝觉得石显说得有道理，就批准逮捕萧望之。


    石显一看皇帝答应逮捕萧望之了，立刻写了一道诏令，派谒者给萧望之送去，并嘱咐谒者要当面交给萧望之。随后，便派出宫廷卫队，全副武装包围了萧望之的家。谒者捧着诏书一到，萧望之就知道不妙，想要自杀。他的妻子劝阻他，说这不会是皇帝的意思。萧望之又去同他的门客朱云商量，朱云也是个刚直的人，他主张宁可自杀也不入狱。萧望之听后，仰天叹道：“我曾经做过前将军，现在六十多岁了，老了还要蹲监狱，再这样苟活活下去，不也太卑鄙了么！”说罢，给朱云写了一封信：“朱云，快点给我拿毒药来，不要再劝我了。”就这样，萧望之在石显的中伤下，终于喝毒药自杀了。


    可以伤人的谣言很多，诸如贪桩枉法啦，行贿受贿啦，作风不正啦，残虐百姓啦等，但最能致人于死命的还算是谋反叛逆，因为这将危及国君的宝座，这是国君最最担忧的。至于其他方面的问题，反正是官场的通病，彼此彼此而已，只要你对找皇帝老子忠诚，大事可以化小，小事可以化了，何必当真呢。所以，那些佞臣贼子抓住皇帝的这种心态，欲去除某人，大多在“不忠”方面作文章，叫你永世不得翻身矣。'
