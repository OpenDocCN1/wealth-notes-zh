    写到这里，忽然想起中国的一句老话来：三代以上有圣人，三代以下没有圣人。我不由得怀疑起来，真有些像鲁迅先生当年“怀疑一切”那个样子。鲁迅先生说中国几千年的历史都是“吃人”的历史，而且吃人者个个道貌岸然，满口仁义道德。于是我想，这几千年的历史真的产生过圣人么？我们通常所说的圣人尧、舜、禹、汤、文、武、周公、孔子到底应不应该怀疑一下呢？诸位注意，这八个圣人中，除掉孔子外，个个可都是开国之君呀！而孔子呢，一提起他的学生子路死于他那“君子死，冠不免”的说教，我就有点感到不对劲。有时候，我真想大声地喊一嗓子：“好一个缺德的道德说教！”


