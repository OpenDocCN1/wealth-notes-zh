    # # 缺德学 · 19 ·


    尖头棒当场倒下。棒头尖见状便抢得提兜，不由分说便将那撒了毒药的驴肉吃个一干二净。”另外一个故事同样是“技高一筹”，有力刻画了乡野中的肮脏卑鄙。故事说得是有张、李两家娶亲来龙去脉：张家有一男一女，李家也有一男一女。两家共同的特点是，女儿如花似玉，儿子皆不争气。张、李两家都急着给儿子娶媳妇，而又不舍得让女儿出嫁。于是两家各自打起了自己的主意。最后，两家不谋而合。在媒人的撮合下，张、李两家以亲换亲。迎亲那天，张家嫁出的是蒙着红盖头的“儿子”，迎回来的也是李家嫁出来的“儿子”。这下可热闹了，结婚竟然无婚可结，何以故？很显然，没有“女儿”。试想，没有女性怎成婚哪。嘿，你也别灰心，还有更好看的戏呢。不是都嫁了儿子吗，那留在家里的姑娘怎么处理呢？本来，他们都一厢情愿地用儿子换回一漂亮、俊俏的媳妇，不料，他们的如意算盘打错了。结果变成了无奈的“两厢情愿”。翻过来、倒过去都一个样，本想在“生米做成熟饭后”来个翻脸不认账，现在可是“两全齐美”。说来说去，这还是一个缺德学研究的范畴。像张、李两家的故事在中国民间颇具代表性，乡野之民的刁钻、无赖、油滑尽显其中。


    如果说战争是政治家对人口的一种摧残，那么发生在民间的拐卖妇女案件也和“州官”的“放火”有异曲同工之理。因此当我们对人贩子义愤填膺的时候，也不必为政治军事家的高明“战略战术”大唱“赞歌”。下面是笔者从新近中共中央党校出版社出版的《大法之下》摘出的一段骇人听闻的缺德事件：


