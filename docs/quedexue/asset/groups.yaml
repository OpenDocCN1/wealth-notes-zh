    1920年，张宗昌兵败湖南，只身逃走，从此成了光杆司令。张宗昌明白，要想发达，必须有靠山，他决定投靠直系，因引荐无门，只能用金钱打通关系。说来也巧，直系首领曹锟恰好在保定过50寿辰，张宗昌便以祝寿为名，风风火火来到保定。一进曹府，便当着众宾客的面从怀中掏出一个布包，拱起双手，自报家门：


