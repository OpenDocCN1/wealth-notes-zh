    ## 缺德学 · 221 ·


    毛人凤从一个小秘书爬上保密局局长的宝座，很大程度上靠的是一个“忍”字。


    毛人凤是军统头子戴笠的小学同学，但他不以此傲人。平时，总是把自己装扮成一副“宁静淡泊”超世脱俗的样子，见了任何人总是笑嘻嘻的。戴笠责备他时，他毫不勉强地接受。就是部下耍态度，发牢骚，也能忍受得住。戴笠的脾气十分暴烈，常为一点小事动辄打人、骂人、关人。每遇到这种情况，毛人凤总是从中为之说情，甚至还肯代人受过而无怨言。因此许多特务感激他、拥戴他。戴笠曾生气地斥责他是“菩萨心肠”不能成大器。


    戴笠与宪兵司令部不和，一次因交通检查问题而闹翻了脸。戴笠抢先向蒋介石报告，想借机把宪兵抓到自己手里。于是他把几年来军统在各地搜集到的宪兵不法材料一古脑地搬出来，准备搞成2万字的长篇报告。担任抄写这份报告的文书科员郭子良，因为抄到半夜还没抄好，身体实在支持不了，便去睡了一下。戴笠一大早就亲自到文书科去拿，找不到郭子良，立刻叫警卫从寝室床铺上把郭子良拖了下来。当戴笠听说报告还没有抄好，拿起棍子就要打郭子良。这时毛人凤连忙过来劝阻：“是我要他去休息一下，上午一定抄出来。”这样一来，戴笠无法下手了，只是转而骂毛人凤糊涂。不知轻重缓急，误了他的大事。戴笠走了以后，毛人凤马上对郭子良说：“你去睡觉怎么也不告诉我一声，几乎出了大问题了！”


    此事，郭子良对毛人凤感激涕零。


    毛人凤不但在军统中能忍耐，而且在外面也不要脾气。有一次，重庆稽查处何龙庆和他一起去看川戏，占了一排最好的座位。一会儿，来了几个空军飞行员，毫不客气地挤他们。何龙庆马上火冒三丈，与飞行员争执，双方均骄横惯了，都不肯示弱，大打出手。毛人凤始终保持他的“忍”的态度。由于力量悬殊，何龙庆挨了一顿打，而毛人凤只是挨了两句骂。后来，毛人凤曾拿这件事告诫沈醉，要能忍耐才不吃眼前亏。


    毛人凤对军统的一些元老们都十分客气和尊重，尤其对当时的副局长郑介民和帮办唐纵这两个资格最老，甚至可与戴笠平起平坐的特务头子，更是恭恭敬敬，态度谦和。在与同僚的交往中，他也从不摆架子，每个科员都可以随时找他解决问题。


    戴笠在重庆时，常常在军统局本部举行中午汇报，利用午餐时间听取各方面的工作情况。一些处长主任们总是提心吊胆地去吃这顿午饭，毛人凤也照例参加。每遇戴笠还没到时，他总是先开玩笑，打破紧张沉闷的气氛，让这些处长主任们的神经松弛一下。遇到戴笠不能参加而事先打电话告诉他的时候，他便故意慢一点去，一进门便说：“告诉大家一个好消息，戴先生今天有事不能来，大家痛快吃一顿吧！”这时全场皆大欢喜，空气立刻变得活跃起来。特别是戴笠到外地办事，改由毛人凤主持这顿中午汇报会时，更显得特别丰盛。因为他整天在军统办公，情况明了，所以坐下来，除简单地谈谈工作外，便天南海北地乱扯一顿，整个中午汇报始终是轻松愉快。这么一来，更多的人流露出对他的好感。


    在重庆时，军统掌握的公开单位很多，局本部主管部门的负责人常常借口视察工作，乘机捞油水，毛人凤也常被公开机关领导人请去视察，但他总是说：“我不是单位负责人，只是内勤部门的帮手，我没有必要，也不便去视察。”许多特训班请他去做“精神讲话”，他说自己没有资格，也都一一婉言谢绝。遇到非去不可时，就只做一般性的业务报告，从不以领导人自居。军统每星期一上午举行纪念周，戴笠外出时，他总请郑介民或唐纵来主持，自己则从来不肯出面代替戴笠。


    由于毛人凤做事谨慎，工作卖力，“于世无争”，终于使戴笠认定他是一个没有野心的得力助手，视为心腹，着力栽培。


    忍是大福。


    历史上不知有多少人就因为缺乏一个“忍”字，而丢了官，送了命。


    郑灵公和公子宋就是榜样。


    周定王二年（前 605 年），郑穆公去世，郑灵公即位，公子宋和公子归生辅助灵公执政。公子宋字子公，公子归生字子家。二人皆为郑国贵族，在朝势力甚大。


    一天早晨，两人准备入见灵公时，公子宋的食指突然跳动了几下。公子归生感到有点诧异，忙问是怎么回事。


    公子宋笑了笑说：“没什么，我平常如果食指跳动的话，这一天必定要尝好东西。上次出使晋国，我吃了石花鱼，后来出使楚国，一次吃了天鹅肉，一次吃了合欢橘，事先都有指跳的预兆，没有不灵验的。只是不知今日又该尝什么鲜味了？”


    两人说说笑笑，来到了朝门之外，正好碰见内侍在喊宰夫入朝。公子宋问侍者何故传唤宰夫？内侍告诉他，有人从汉江来，带回一个大鼋，重达 200 斤，献给了灵公。灵公命唤宰夫杀掉，要炖肉汤招待朝中诸大夫品尝呢。


    公子宋听了，洋洋得意地对公子归生说：“怎么样？我的食指不会无故跳动吧？”


    进朝一看，果然见一个大鼋拴在堂柱上。二人相视而笑，入见灵公。


    灵公见二人喜形于色，就问他们有何喜事如此高兴？


    公子归生不敢隐瞒，把事情的原原本本全部说给灵公。


    灵公听罢，半开玩笑半认真地说：“他的食指跳动灵验不灵验，还得由我决定！”


    到了吃饭的时候，郑灵公召集群臣入朝，品尝鼋肉。


    大家按官职大小，依次坐定。


    郑灵公先品尝了一下，连连称赞鼋羹鲜美，遂命人赐给诸臣一人一鼎鼋羹，并要求从最下席开始，这样，位居上席第一、二位的公子宋和公子归生就落到了最后。


    眼看诸大夫一个个都得到了赐羹，只剩下子宋和归生两人了，宰夫突然对郑灵公说：“鼋羹只剩下最后一鼎了，请问要赐给谁？”


    灵公随口说道：“给子家吧。”于是宰夫就把最后一鼎送到了公子归生面前。


    公子宋对众人得到赏赐而单单自己被冷落真是又羞又愤，怒火中烧。


    郑灵公目睹公子宋的窘态，哈哈大笑，指着他说：“我命令要遍赐群臣，谁料却偏偏少了子公一人。看来这是命里注定子公不该吃鼋肉啊。你的食指跳动哪里有一点灵验呢？”


    一听此话，公子宋完全明白了。为了挽回面子，他不顾君臣之礼，突然起身走到灵公面前，把手探进灵公的鼎中捏了一块肉，放入口中，并反讥灵公说：“我已经尝到了鼋肉，食指跳动哪一点不灵验呢？”说罢，不辞而别。


    公子宋的举动，激怒了灵公。他气的把筷子一摔，愤愤地说：“子宋也太无礼了，竟敢如此欺君。难道郑国就没有刀能杀掉他的头吗？”吓得归生等人跪在地上连连求情，灵公仍恨恨不已。


    本来欢欢乐乐的品鼋会，就这样不欢而散了。


    从此，郑灵公同公子宋结下了仇恨。公子宋惧怕郑灵公有朝一日找借口报复自己，竟在这一年的秋天派人刺杀灵公，与公子归生商议更立了新君。


    第三年，灵公之弟公子去疾追查公子宋指染君鼎之罪，将其杀掉，暴尸于朝，尽逐其族。这一件事才划上了句号。


    一句戏言，引起了仇恨，双方均死于非命，实在太可悲了。事情怎么会弄成这个样子呢？


    历史是鉴！


    ### 舍不得孩子打不着狼


    老子云：“将欲歙之，必固张之；将欲弱之，必固强之；将欲去之，必姑举之；将欲夺之，必固予之。”


    这段话的意思是说，你想收敛它，就必须暂且扩张它；你想削弱它，就必须加强它；你想废弃它，就必须暂且支持它；你想夺取它，就必须暂且给予它。总之，你若是想从别人那里得到什么，就得先给他点什么。这就像农民种庄稼一样，要问收获，就须先给地里施肥。


    在日常处事中，这一计谋常为某些缺德之徒运用。如果他是一位官员，他会给百姓一些小恩小惠，骗取民众的支持；如果他是一位商人，他会装出为对方着想的样子，让出一些无关紧要的利益，博取对方的好感，以求得高额利润；如果他是一位江湖骗子，他会投出一些有诱惑力的实物或信息，使人对他所言信以为真，或者暂且让你得到一点实惠，吊高你的胃口，让你觉得后面有大利可图而一步一趋地走入骗子设下的圈套。


    这样的事例实在太多了。


    郑武公是一个足智多谋、穷兵黩武的诸侯，他要扩张地盘，便打邻邦胡国（即后之匈奴）的主意。但当时胡国是一个强大的国家，国王又勇猛善战，经常骚扰边疆。用武力固然不容易，想政治渗透根本也不可能，因为当时胡国的内情实在是一无所知。在这样文武无所施其技的时候，唯有采取逐步渗透的战略，不能不忍耐一下，派遣一个亲信到胡国去，打入其最高组织。


    郑武公派了一个使者到胡国去，说要攀个亲戚，把自己的女儿嫁给胡国国王。国王听说自然万分高兴，立即答应。这样，郑武公就做了胡国国王的岳父。


    这位新夫人是负有使命的。她到了胡国，下足媚劲，把国王迷惑得昏头昏脑，日日夜夜，花天酒地，连朝也懒得上了，对国家大事简直置之不理。


    郑武公知道了，心里暗自高兴。过了相当时期，他忽然召开了一个公开的秘密会议，出席的全是文武高级官员，商议着要怎样开拓疆土，向哪一方面进攻。


    大夫关其思说：“从目前形势看，要扩张势力，相当困难，各诸侯国都是守望相助，有攻守同盟的，一旦有事，必会增强他们的团结，一致与本国为敌。唯有一条路比较容易发展，就是向‘不与中国’的胡国进攻，既可以得实利，名义上又可替朝廷征讨外族，巩固周邦。”


    郑武公一听，把脸一沉，问他：“你难道不知道胡君是我的女婿吗？”


    关其思还继续大发议论，口沫横飞地说出一大套非进攻胡国不可的理由，特别强调国家大事，不可牵涉儿女私情的话。


    “放狗屁！”郑武公火了，厉声斥责他：“这话亏你说得出口！你要陷我于不仁不义吗？你想要我女儿守寡吗？好吧，你既然有兴趣叫人做寡妇，就让你老婆先尝尝这滋味吧！左右！绑这家伙去斩了！”


    关其思被斩的消息很快传到了胡国，国王更加感激这位岳父大人。他认为郑国再也不会找本国闹事，便放心了，更加纵情于声色之乐，渐渐地连边关都松弛下来，而且郑国的情报人员也可自由出入。


    郑武公已掌握了胡国军政内情，认为时机成熟了，突然下令，挥军进攻胡国。


    各大臣都莫名其妙，连忙问：“大王！关大夫过去是因为建议进兵胡国而被斩首的，为什么隔不多久，又要伐胡呢？岂不是出尔反尔？”


    “哈哈，哈哈……”郑武公大笑一阵后，摸摸胡子，向群臣解释：“你们根本不知兵不厌诈的妙用，这是我的‘欲取姑与’的计谋呀！我对胡国早就打定了主意，肯牺牲女儿嫁给他，是为了刺探其国防秘密，斩关其思也不外想坚定他的无外忧之虑的信心，使其放松防备，一到时机成熟，就出其不意，一下子就可以把胡国拿到手。”


    “可是，大王！”其中一人说，“这样您的女儿不是要守寡吗！”


    “还是关大夫说得对，国家大事，怎可以牵涉儿女私情呢？”


    果然，郑军所到之处，势如破竹，仅几个回合，整个胡国已入了郑国版图，那位快婿只空留一个脑袋去朝见岳父大人了。


    行使此计谋，既要有一定的远见、智慧，也要有过人的耐心。


    相传，汉初北方有一个东胡国，向邻国寻衅，派一位使臣到邻国晋见国王，要国王送东胡一匹千里马。邻国国王冒顿觉得自己的实力还不够强大，不足以与东胡抗衡，便采用取姑与的策略，答应将本国最好的一匹宝马送给东胡。冒顿的大臣们认为，我国的这匹千里马是先王遗留下来的，不可轻易送人。冒顿却微笑着说：“我与东胡为邻，不能为了一匹马失了和气。”随即即叫使者把马牵了回去。过了一段时间，东胡使者又带来国书，说东胡国王看上了冒顿王妻子的美貌，要冒顿王把夫人送给东胡国王。冒顿的大臣们听后气愤万分，纷纷请求冒顿斩掉来使，发兵进讨东胡。冒顿又摇摇头说：“他既然喜欢我的夫人，给他便是了，岂可为了一个女人，失去一个邻国？”东胡国王得了冒顿的良马、美人，日夜荒淫，并认为冒顿真的惧怕自己的势焰。于是，得意忘形，过了一段时间，他又遣使者向冒顿索要两国交界的宝地。冒顿群臣得信后，对如何应付意见不一，有的主张给予，有的则强烈反对。冒顿此时却勃然大怒，说：“土地乃国家之根本，怎能给人！”接着喝令左右将东胡来使斩首，迅即向东胡出兵，东胡军队猝不及防，连战皆败，顷刻全军覆灭。冒顿直冲宫中，杀了东胡国王，尽灭其国。


    又如，有两个骗子共同行骗，一个在外物色张罗对象，一个住在旅馆里冒充是收购邮票的。一天，在外行骗的人遇上左某，两人素不相识，但左某很快被骗子的花言巧语迷惑了。骗子称，旅馆住着一个收旧邮票的人，每张可赚100元。左某以试试看的心理花300元先买了一张邮票，按照骗子说的房间，到旅馆果然卖了400元。左某见此生意赚头大，来钱快，何不大捞一把！于是又找到卖邮票给他的那位骗子，苦苦哀求再卖给他一些旧邮票，骗子装腔作势推辞了半天，最后同意将40张旧邮票卖给左某。左某东拼西凑，借来12000元，双手交给骗子，满心欢喜地接过那40张旧邮票，转身去旅馆卖邮票时，收邮票的人早已逃之夭夭，左某急忙回去找卖给他邮票的人，也早已不见人影。


    说起来这两个骗子的骗术也不十分高明，而且漏洞百出，既然知道有人收购旧邮票，自己为什么不去，而把钱让别人赚？而这位左某之所以受骗，除了缺乏头脑之外，不就是只看到骗子所设的诱饵，而没有想到诱饵中的鱼钩吗？


    ### 谎言重复千遍就成了真理


    战国时期，魏国大夫庞葱奉命陪同太子到赵国都城邯郸充当人质。临行前，为了劝谏魏王不听别人的挑拨离间，庞葱特意对魏王说：“如今有一个人说街上有老虎，大王相信这话吗？”


    魏王答道：“不信。”


    “有两人说街上有老虎，大王相信吗？”


    “我得怀疑了。”


    “有三个人说街上有老虎，大王相信吗？”


    魏王犹豫了一下，说：“我信了。”


    庞葱说：“街上明明没有老虎，可是你传我，我传他，说得人多了，也就使人以为街上真的有老虎了。如今我就要到邯郸去，邯郸要比街市远得多，今后议论我的人肯定会比三个人还多，请大王届时明察。”


    魏王爽快地答应下来。可是，庞葱走后，非议他的人一天天增多，魏王渐渐相信这些非议。等到庞葱从邯郸回来，魏王已经完全不相信他，将他贬弃于宫门之外了。


    这便是“三人成虎”的历史故事。它即反映了人们的从众心理，也显示出了“众口”的威力。


    “人云亦云”，“随大流”是人性的一大弱点。心理学家将这种现象称为“从众效应”或“感染效应”，其特点是个人对某种信息和心理状态下不由自主地产生无意识的盲从。这种盲从不是通过承受有组织的蓄意压力而接受某种信息或行为模式表现出来，而是通过传播某种情感状态并且无意识的进行心理调节而表现出来的。无组织的人群往往成为这种效应的加速器，如果置身其中，即使有主见的人也容易受其感染而失去辨别能力。


    某些心怀叵测的人，正是利用了人性的这种弱点，借助他人之口或舆论的力量，达到自己的目的。


    19世纪40年代末，在太平洋沿岸的美国加利福尼亚州发现了金矿。这一消息传开后，很快在美国和欧洲大陆出现了黄金热。这些欧洲人大多是在纽约登陆的。因为当时美国还没有连通太平洋到大西洋的铁路，巴拿马运河也还没有提到议事日程，所以前往旧金山的人们往往要坐轮船绕道南美的最南端。


    一个叫范德比的商人看到这是一个发财的机会，决心开辟一条通过尼加拉瓜的航线，让人们走近路直达旧金山。他亲自到尼加拉瓜四处活动游说，最终和当时的总统查库罗签定了一项秘密协定。这个协定规定：凡从尼加拉瓜过境的船只均由范德比负责。从此，范德比在这条航线上赚了好几百万美元。


    此事引起了一位叫华尔克的人注意。华尔克眼看老范德比靠这条航线，大把大把的钱财流入腰包，自己从商好几年却一直没有太大成绩，十分嫉妒，于是决心把这条航线夺过来，据为己有。这样，一来可以靠这条航线赚钱，二来还可以减少自己的黄金采购公司的运输成本。


    夺取一笔小生意好办，夺取一条航线谈何容易。老范德比从商几十年，可谓沙场老手，和他斗需要动一番心思。华尔克想：老家伙在国内政界、商界颇有影响，保镖成群。搞得不好不仅达不到目的，反而会身败名裂。思来想去，华尔克想出了一个计谋。他决心设法把老范德比引诱出国，然后乘其不备下手。


    他首先用重金收买了范德比的私人医生，请他如此这般。


    一天，医生就对老范德比说：“您最近身体状况不太好，可能是劳累过度，建议您去法国休养半年或更长一些时间，否则，您的心脏会有危险。”


    为了促使老范德比下决心出国休养，他还用钱收买了经常与范德比有来往的一些夫人和太太们，让她们给范德比的妻子、女儿和媳妇吹风，说：“您家老先生面色不好，心脏又不太好，不如到外国去休息一阵子，美国的气候太差了，再这样下去，恐怕会有生命危险。法国的巴黎最适合他这样的老人休养。”家人一听十分着急，一天催他三四遍，让他出去休养。


    俗话说：“三人成虎”。老范德比本来身体没什么大毛病，自我感觉也挺好，但经不住许多人劝说，自己也怀疑身体是否真的快不行了，于是，起身到巴黎休养去了。


    老范德比一走，华尔克立即采取行动。他用船装了几百名打手和满船的军火前往尼加拉瓜，登陆后，同事先联系好的尼加拉瓜内奸里应外合，以迅雷不及掩耳之势，攻占了尼加拉瓜首都，直捣查摩罗总统官邸，威逼查摩罗总统修改协定，让他主宰航线，查摩罗总统气之下，心脏病发作，当即毙命。华尔克立即扶持了一个尼加拉瓜人当总统，他自任尼加拉瓜军队总司令，控制了政权。不久，尼加拉瓜新政府宣布取消原政府和范德比的协定。


    谎言重复一千遍，也就变成了真理。


    ### 脚踏两只船


    赏与罚，这固然是掌权者驾驭臣下的主要手段，但也不可能每天施用，尤其是一些重大的赏罚，多用于非常之时、非常之事、非常之人。当权者与部属朝夕相处，如何在日常交往中牢牢控制住对方，这是一门值得研究的学问。


    掌权者要想巩固自己的权力地位，维持部下对自己的忠诚，最关键的一点是要制造向心效应，同时防止产生离心效应。尤其对那些权力过重，有可能对自己构成潜在威胁的臣下，必须严加防范并采取适当措施加以牵制，以免造成尾大不掉、喧宾夺主之势。


    中国历代官场都流行窝里斗的恶习，大臣之间为了争权夺利明争暗斗。如果掌权者能够巧妙地加以利用和操纵，便可收到意想不到的效果。


    韩非子认为，国君只有一个人，而臣僚却是一大群，以一个人的精力智慧来对付那么多的人，肯定无力应付，怎么办呢？若是国君利用臣僚间的猜疑和矛盾，便可居高临下，坐收渔人之利毫不费力地控制住臣下，将大臣们玩弄于股掌之中。


    一个能够控制住局势的掌权者，总是善于在派系林立、派系纷争的局面中寻求平衡，他或者调解矛盾，以和事佬的姿态出现，使对立的双方都对自己感恩戴德；或者听任双方争斗，自己坐收渔利；或者一边倒，利用一方去吃掉另一方。


    在中国历史上，女皇武则天特别善于玩弄政治平衡的把戏。武则天出身寒微，又曾做过唐太宗的才人，当她被立为高宗的皇后时，即遭到朝廷重臣和季氏家族的反对。因此，她不得不大力扶植原本孤寒的武氏家族，却又不能将权力完全交给他们；她毫不留情地打击季氏家族，却又不得不承认他们的合法继承人身份。她既要重用酷吏去打击些不太驯服的大臣，又不得不利用一批正直大臣来治理国家。她的一生就这样脚踩两只船，在政治波浪中航行。不过，当她还是强有力的时候，她能够控制住局势，而当她老迈之时，政治势力向一方倾斜，她终于还是翻船落水了。


    蒋介石也是一个善于利用矛盾，维持派系平衡以便为己所用的老手。早在他出任黄埔军校校长时，即开始在学校中“制造矛盾、利用矛盾、操纵矛盾，拿一个反动的看住一个进步的，叫一个反左派的牵住一个左派的，用反共的牵制相信共产主义的。”例如，1925年2月，黄埔军校成立了青年军人联合会，这是一个由左派进步青年组织的革命团体。为了牵制青年军人联合会，蒋介石授意成立了孙文主义学会。这样，在黄埔军校内部就出现了两个团体相互对抗的局面。蒋介石表面上假装公正，似乎不偏不倚，实际上他是想利用孙文主义学会来达到其控制青年军人联合会的自的，同时借对孙文学会的支持，

