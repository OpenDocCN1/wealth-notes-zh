    # 缺德学原理


    回了一名16岁的四川籍女青年。当夜，这个农民便要强行与这名女青年发生性关系，女青年羞辱万分，拼死拼活，决计不从。这时这个农民唤进早就等在那里的该村其他三名庄稼汉，将全力挣扎的女青年抬到床上，按住手脚，看着这个农民扒去这个小姑娘的裤子，施行强奸后方才离去。这一愚蠢到残酷的行为是对人类的亵渎！此后两个多月，这个年近40的农民都是在皮带或绳索绑后发泄性欲。


    也许，我们会将这极其残忍的一幕和中国人的愚昧、法官联系起来。但是，我们也必须看到，“法”与道德有着极为密切的关系。即使我们不懂法，我们是否可以有些人性、人心？请看，这是多么可悲的结局：“在宋氏家族所在的中町镇，另一名38岁的农民以2900元身价买回了一名唐姓女青年。为防止逃跑，将唐某关在屋内达8个月之久，由此人的母亲、妹妹轮流看管，连大小便也不许出院子。唐某不堪忍受，三次自杀未遂。多次逃跑，被抓回来时都遭到毒打。被解救出来时的唐某已是伤痕累累，体无完肤。”说这些，似乎众人都已司空见惯，不足为奇。其实，还有比这更为不忍卒听的案件：“四川籍少女姚某，年仅14岁时就被人贩子拐卖到安徽，辗转这7年之久，多次被人转手收买，无数次施暴强奸，致使其丧失了生育能力，专案组干警费尽周折将其解救时，姚某已对生活无望。姚的父亲接到电报，来到公安局认领女儿，父女竟不能相认。”好一个人间悲剧！天若有情天亦悲，天若有情天亦恸哟！像这样的事已不只是法律的问题，丧失人性的人比野兽更可怕。孔子曰：“苛政猛于虎。”依笔者之见，“缺德的行为比老虎还凶猛十倍。”'
  - '[PAGE 33]


    大大小小的书籍上都这样写着：一部人类发展的历史，就是一部人类文明史。你是否想过，我们可否换个角度，写一部秘密缺德史如何？我们虽不能说一部人类历史就是一部缺德史，但我们却可以毫不夸张地说，人类历史的发展，写满了缺德的血泪账。


    如果我们不是抱着游戏人生的态度去看这“花花世界”，那么阳光下的霉点就会原形毕露。莎士比亚笔下的伊阿古是世界文学中的一个著名典型。《奥赛罗》这个悲剧向我们叙述了威尼斯贵族的女儿苔思德梦娜与威尼斯大将摩尔人奥赛罗的婚姻故事。当时，他们的婚姻遭到了父母的反对。此时正值土耳其入侵，奥赛罗率兵御敌。奥赛罗提升凯西奥为副将，遭致手下旗官伊阿古的忌恨。他设下很多圈套，诬称凯西奥与苔思德梦娜有奸情，使奥赛罗轻信中计，将无辜的妻子扼死。伊阿古妻子哀米利霞得知惨剧，愤然揭发丈夫的缺德罪行，于是真相大白，奥赛罗悔恨自杀。


    从上面我们概述的缺德情形看，缺德的发生已超过了时空界限，缺德的天地犹如一张无形的网，笼罩着整个世界。由此，我们不能不感叹曰：“正像这个世界是由光明和黑暗组成一样，它的阴阳两极上，一边布满缺德的荆棘，一边装点着灿烂的鲜花。也许，我们会经常埋怨这个世界的肮脏、卑鄙、无情、残酷等不道德的内容，但是只埋怨又有什么用？何不手持一本教您怎样面对陷阱的书，潇洒、快乐、自在地生活在这个世界上。对了，差点忘记告诉您，《缺德学》让您有惊无险。'
  - '[PAGE 34]


    # 缺德原理：

    随风潜入夜，润物细无声


    我们讲解缺德原理，目的在于小心您身边潜伏的缺德之人。一般来说，缺德“圆舞曲”有这“三步”。


    第一，缺德事发生时，总是“这里黎明静悄悄”。密则事成，这是缺德者必须首先学会的讲义。您没有听说过“当面说好话，背后下毒手”的顺口溜么？它其实就是笑里藏刀、面善心恶、两面三刀、阳奉阴违的代名词。所以，当心您身边对您点头哈腰、阿谀奉承的小人是很有必要的。对于您的领导，他当面批评您并不可怕，他立即反驳您的批评也并不值得大惊小怪。最可怕的还是“小鞋”，而且您要记住，不少上司是秋后算账。“马上就给你小鞋穿”的领导并不是多么可怕的领导，但是在中国这种领导是不会干多长时间的。正直的人官运不佳，奸诈的人平步青云。像包大人这样的清官，在中国历史上毕竟寥寥无几。


    蚊子虹人总是在晚上或是黑暗的角落。见不得人的事也总是在隐形状态下密谋。而且这些缺德大人们都有一种天生的良好素质：即使做了亏心事，也是脸不红，心不跳。秘密的意义也正在于此。人们常说某某会做官，做人“滴水不漏”。可人们哪里知道，在“不显山，不露水”的背后又有多少奸头滑脑的事从我们身边溜走呢！秦桧为把立下汗马功劳的岳飞置于死地，便以“莫须有”的罪名将其打入死牢。奸臣诬陷忠良，天'
  - '[PAGE 35]


    理不容。秦桧的缺德可真是缺到家了。他堪称是中国历史上最为狠毒的缺德家。我想，他的缺德学问做那么好，完全可以招收缺德学博士研究生。现在我们就可以为他撰写一条招生广告：


    # 缺德学院缺德系主任兼教授秦桧先生招收博士研究生


    +   报名时间：随到随学、不受时间限制。

    报名地点：缺德市缺德路缺德学院缺德系办公室。

    联 系 人：恶先生、毒小姐。

    学习费用：视其智商情况而定。本期学不会者，可以跟班免费再学，不再另收款项。一次投资，终生受益。

    授课方式：机密传授、秘密进行。

    授课内容：借刀杀人法、挑拨是非法、坑蒙拐骗法、缺德学概论、西方缺德学、中国缺德史等。

    研究方向：秘密缺德技巧。

    学习方式：脱产、在职皆可。

    学习待遇：一律是国家包揽，带薪上学。毕业后工资按有关文件执行，另在原有级别的基础上官升三级。


    据说，现在有不少地方都在进行这项工作。只不过我们肉眼看不到罢了。因为这些人都是在秘密策划，不愿张扬此事。如果说道德在这里已经质变，但是它还有一样美德：谦虚。对于那些缺德的人来说，他们会自吹自擂的，用不着我们唱颂歌。历史上这样的故事并不少。自己杀了人，还要嫁祸于人。三国时期，孙权将刘备、张飞的结拜兄弟关羽杀害后，居然乘夜黑风高的时候秘密派人将关羽的人头送给曹操，以便让曹操'
  - '[PAGE 36]


    引火烧身。就是那位为人称道的诸葛亮在去为周瑜吊孝一事上也黯然失色。说得难听些，真有些“黄鼠狼给鸡拜年”的味道。其居心的险恶实在令人不敢恭维。


    中国有句无可考究的古话：“量小非君子，无度不丈夫”。一个字：“忍”。凡是土生土长的中国人没有谁不了解这句话的涵义。据此演变出来的同义语不一而足。诸如“退一步海阔天空”、“小不忍则乱大谋”、“张百忍忍得银人”等挂在口头的习语都能让人从中领会到传统文化的根深蒂固。可是，“忍”的结果会怎样呢？事实上，“忍”在这里不过是一种等待时机的手段。待到“千年的媳妇熬成婆后”，那就不是在“沉默中灭亡”，而是在“沉默中爆发”了。这会儿也会一反常态，从“无度不丈夫”转变为“无毒不丈夫”。这实际上也是一种密藏不露的手腕。有一本名为“糊涂学”的畅销书曾将糊涂的秘诀总结如下：


    世上计谋万千条，藏秘不露是高招。

    牢记凡事三缄口，慎言慎行勿招摇。

    须知树大必遭风，须知枪打出头鸟。

    自古真人不露相，大智若愚乐逍遥。


    什么文明古国，什么千年传统，尽是一派胡言！在忍字背后，哪有半点人味？这不都是一些“吃小亏占大便宜”的蝇营狗苟策略么？秘而不露实际上也就是老谋深算。所谓的处世圆滑、所说的“以直报怨”不是自相矛盾么？“直”本是德，叫嚷处世圆滑的说教又怎能“直”起来？


    为什么世上秘而不宣者竟然如此之多呢？“毛遂自荐”、“请君入瓮”已是大家熟悉的历史典故。战国时期的毛遂平时不露生色，但在平原君从赵国出发到楚国求救之际，他便挺身'
  - '[PAGE 37]


    而出。平原君说：“士人处在世上，如锥子装在麻袋中，尖子很快就露出来。现在您在我的门下已经多年，从未听说过您的名字，可见平平常了。”毛遂对答说：“将我装在囊中，露出来的就不止是尖子了。”后来，事实证明了自荐者的能力。毛遂的例子很有代表性，反映了他见风使舵的高超处事能力。这也是他能一举成名，“众压群芳”的原因。“请君入瓮”说的是在秘而不露的情况下以其人之道还治其人之身。唐武后时，周兴办案心狠手辣，极其恶毒。当这位平素受宠的奸臣企图与他人共谋不轨时，太后派来了来俊臣。下面这段对话颇能说明问题。


    来俊臣问周兴：“囚犯多半不愿认罪，何以为之？”

    周兴说：“这并不难，找一个大瓮，在四周烧火，叫犯人入瓮，还有谁敢不承认？”

    来俊臣说：“朝廷有件案子要侦察你，请君入瓮吧？”

    周兴听完吓得连忙叩头求饶。


    所以高明的缺德学家总是“阴”字当头。在电视、电影、报刊、小说、传奇中，我们经常能看到一些极为残忍的情境或镜头。不少头头惯用的保密伎俩大都不外乎在秘密干完一件不可告人的勾当后，命令或亲手将跟随自己多年的心腹杀死。黑社会的老大如此，就是蒋介石也常常如此操作。人们常将政治家和阴谋家相提并论，确有几分道理。国人无人不知，大阴谋家林彪就是最为典型的一个。他靠着特有的手腕爬上了国家副主席的宝座，一度春风得意，成为名声显赫的林副统帅，和毛泽东平起平坐，俨然一副“不可貌相”的样子。当年，在林彪与毛泽东同来同去的时候，一些爱看面相的老人禁不住心里直犯嘀咕：就凭他那个长相——秃头无毛的，怎能当上国家副主'
  - '[PAGE 38]


    席呢？嘿！有啦，原来林副主席乃一个“回头虎”。尽管这等说法有点儿迷信色彩，可这“谜”给猜对了。林秃子这厮还真有几下子！他这么一个貌不惊人的秃头竟然连咱们最最敬爱伟大的毛主席也给迷住了，不然何以有此显赫！要知道，林彪可是一个不折不扣的混世魔王。他曾是毛泽东最亲密的战友，他还是我们中国人民最伟大的统帅，更为关键的是，他还曾被光明正大地写进党章，完全有希望成为党的接班人。我们看到，正是这位靠骗、靠欺的阴谋家在急不可耐的权力欲催化下做了尸首不全的大厉鬼。中国共产党党内所批评的“当面说好话，背地下毒手”之人，林彪首当其冲。


    您还说，靠阴谋、隐秘起家的历史人物并不少。试想，林彪若不是摔死在蒙古的温都尔汗，如果他再伪装一段时间，说不定就成了历史上又一位篡权夺利成功的奸臣。历史啊，它就是那样的阴差阳错！不难想像，当“万间宫殿都成了土”之后再回想过去，又有多少大显大贵的人物都是靠缺德的阴谋发迹的啊！而且，很有可能有不少道德低下的“君子”留给后人的是光彩照人的“极品道德”，而那些真正高洁的雅士却成了无人问津的历史罪人。


    可悲！可叹！可笑！可气！可怜！……


    秘密的事情总是留下问号一串串。


    缺德事发生过程中，一切都显得那么“合理”。自然，它也就“合法”。秘密是合法的第一步，而“合理”则是以不变应万变的万无一失之保证。所谓“挂羊头卖狗肉”、“既要做婊子，又要立牌坊”都是这种情况的写照。给自己所做的丑事套上一层美丽的光环，这是连“屎壳郎”都知道的事。您瞧，狗、猫这类动物都知道在拉过大便后埋一埋、盖一盖，更何况'
  - '[PAGE 39]


    人乎？


    第二，缺德发生学告诉我们，做缺德事的人不是谁都能做的，尤其是想在历史上留下点痕迹的人。除了上面我们提到的需要具有“地下工作者的能力”外，还需要这样一个基本功，说得时髦些即是：需要具备缺德者的素质。那么，究竟缺德者应必备哪些条件呢？据我们博览群书、通阅古今之后得出的初步意见，他需要心黑过人。一部《厚黑学》早已把缺德家的形象刻划得淋漓尽致。“当面说好话”是秘密密谋的举措，而“背后下毒手”就需要心黑手辣才能付诸行动了。大凡缺德者，莫不心黑如炭，狼的狠毒、虎的暴虐、狐的骚媚在他手里都能得心应手。试问，您敢仿照如下方法“无中生有”吗？


    若是有人出差在外，他正好是你的敌人，你是否会打上一份加急电报：“母病速回”呢？如果回答是否定的，那么下面几个缺德行为你就不用去思考：


    您正在开会中，忽然接到：“贵府失火速回”

    您正在出国考察的飞机上：“令郎遇难速回”

    您正在酒吧舞厅来回应酬：“一切俱悉，妻”

    ……


    诸如此类的讯息，绝非一般的平常之人所能为之。缺德之人的最大特点就是“唯恐天下不乱”，乱了以后他则从中得益。“鱼蚌相争，渔翁得利”指的即是那种暗中使绊、心黑如炭的小人。一座缺德学府对晋升缺德学副教授作出了严格的规定：


    +   一、必须是从事 5 年缺德以上的工作者；

    二、在缺德事业中确确实实作出了重大贡献者；

    三、在缺德学核心刊物上发表一篇以上的论文，总共不得少于三篇；'
  - '[PAGE 40]


    四、必须取得缺德成果一项，档次不得低于省级；

    五、靠缺德手段取得一定的经济效益者，需盖有财务部门的公章。


    以上五条中，需要具备其中的三条。该专业的缺德学博士可减免一条。据悉，去年一位学问高深、知识渊博的博士就没有评上。事后这位博士很是愤愤不平。究其原因，原来，评委都是一群资历高深、缺德无度、心黑皮厚的老家伙。缺德专家们一致认为，某博士理论高深，唯一的缺陷是没有缺德实践，心地太善良，把天下的人尤其是知识分子想得太高了，以后要着重培养其做缺德事的实际操作能力。这位博士听到这样的结论后，立刻就懵了：原来如此，看来我真不是吃那碗饭的料。


    大千世界，无奇不有。堂堂一个博士竟然连区区一个副教授都评不上，岂不荒唐！可就是在这个缺德世界上，不讲理的事太多。要知道，人家博士申请的可是缺德学高级职称，而非缺德副教授。“学”和不学毕竟不一样，缺德学重在学，一个“学”理高深的人反而不及“不学有术”者，或者说不及一个很会缺德者，这多少让人感到有些不可思议。


    呜呼！天苍苍，野茫茫。博士，您太天真了！像您这样诚实厚道的人太少了。您的心太善，您的面子太浅。若是您也来个黑心缺德术，您的职称不就拿到手了吗？事到如今，就是您骂娘骂得个天翻地覆，也岂不是白费口舌？


    悄悄地告诉您，善良的人们，您可要时时小心那些嘴尖皮厚的人嗷！


