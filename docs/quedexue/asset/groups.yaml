    心腹中的心腹，亲信中的亲信，核心中的核心，是极受当权者宠信的人物。然而，对当权者来说，在官场上是不没有任何道德可言的，一切都是为了一种明确的功利目的。当这种目的已经达到之后，当权者对于功狗们可能有两种态度：一是能笼络住的，自然还是要加以笼络，但这要付出代价，你必须一辈子对你所干过的事守口如瓶，永远对主子服服帖帖；二是笼络不住的，则必定置之死地而后安。当权者的政治品德之低劣，决不是一般人所能想像出来的。


    # 欲加之罪，何患无辞


    一般来说，当权者惩治的对象大都是他不喜欢的人或者是他巩固权力地位的障碍。俗话说：“欲加之罪，何患无辞。”这句话尤其适用于掌权者对部下的惩处。他们往往会以“莫须有”的罪名强加于人，使部下有口难辩。特别是那些喜怒无常的当权者，同一件事此时他认为是臣下的功绩彼时很可能就被当作罪过。


    春秋时期，弥子瑕很受国君卫灵公的宠爱。


    有一次，天色已经很晚了，弥子瑕的母亲忽然得了病。有人把这个消息连夜告知弥子瑕，弥子瑕甚为着急。他就不顾一切地跑到宫里，擅自驾着卫灵公的车去给母亲看病。


    按卫国的法律规定，私自驾驶国君车子者，判处砍脚的酷刑。


    当卫灵公听说此事后，不但没判弥子瑕的罪，反而夸奖他说：“孝顺啊，为了母亲，宁愿犯会被砍脚的罪呀！”


    一天，卫灵公到果园中游玩，看到这秀丽的田园风光，顿'
  - '[PAGE 302]


    觉视野开阔，心旷神怡。


    正在这时，同游的弥子瑕从树上摘下一个桃子，他尝了一口，觉得很甜，便献给了卫灵公。


    卫灵公正在兴奋之时，又有自己的宠臣献桃，于是便乘兴说道：“弥子瑕真是一位忠臣贤士啊。因为尊敬君主而舍弃了自己的口福。”


    时光过得真快。转眼间弥子瑕就到了年老体衰，脑子迟钝的年纪了。卫灵公对他的宠爱与日俱减。终于有一天，因为一件小事他罪了卫灵公。


    卫灵公左思右想，总算罗列出了弥子瑕的两大罪状：“以前他曾经假托我的命令驾我的车子，又曾把他吃剩下的桃子给我吃。”


    要想惩处朝夕相处的臣下，还怕找不到借口吗？面对这样的君主，作臣下的真是哑巴吃黄连——有苦难言。宋朝靖康年间，金兵南侵，灭北宋并掳走徽、钦二帝。钦宗之弟赵构建南宋政权。当时，各地百姓奋起抗金，朝廷中也有几名大将足使金兵闻风丧胆，这就是岳飞、韩世忠和张浚，时称三大将。这三位大将都是智勇双全，在与金兵交战中多次取胜。尤其是岳飞，当时年仅二十几岁，文韬武略样样精通，又善于带兵，作战勇敢无敌，金兵一看到岳飞的旗帜就吓得屁滚尿流，金营里有句口头禅“撼山易，撼岳家军难。”如果有一个好的领导者，抗击金兵收复山河还是很有希望的。可赵构却是一个昏庸无能之人，金兵不来，他就罢免一切抗战派将领，专门起用那些投降派的官员，一味向金人求和，甚至恬不知耻地上书金营表示“愿奉正朔，比于藩臣”。金兵打来时，才慌忙起用抗战将领带兵出去迎挡。当时，岳飞等人并不十分了解宋高宗偏安'
