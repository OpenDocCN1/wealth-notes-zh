    让这些右派分子死心塌地忠于他本人。他一方面千方百计限制青年军人联合会的活动，另一方面对孙文主义学会分子的“出格”举动也严加禁止并予以“痛诫”。从表面上来看蒋介石似乎很超然，其实这是在玩弄派系平衡术，利用派系矛盾加以操纵，以便壮大自己的实力。


    国民党政权建立后，蒋介石利用国民党内派系林立的局面，朝秦暮楚，翻云覆雨，极尽纵横捭阖之能事，最后终于成为国民党无可争议的领袖。在蒋家王朝稳定下来以后，蒋介石再度玩弄权术，将自己的嫡系分成了CC系和黄埔系，让两派在自己面前争宠以便从中操纵，同时尽量保持两派政治势力的平衡，防止某些亲信、部将权力过重对自己的地位构成威胁。在近代内忧外患的混乱局面下，能长期维持自己在国民党内的领袖地位，让部下为其效力卖命，使用这种派系平衡的手法可谓煞费心机。


    ## 以子之矛，攻子之盾


    以牙还牙，亦即“以其人之道，还治其人之身”。缺德之人喜欢耍点自以为高明的诡计或说点自以为天衣无缝的言语，诱你落入他设置的圈套，侮辱你，整治你。这时候，你得保持冷静，不妨用“以牙还牙”来回击他。也就是说，用对方讲的道理、方法、要求，照样画葫芦，反还给对方，使其搬起石头砸自己的脚，而且“哑巴吃黄连，有苦说不出”。


    例如，有个小男孩在一家面包店买了一块两便士的面包。他觉得这块面包比往常买的小得多，便对老板说：“你不认为这块面包比往常的要小些吗？”


    “哦，没关系。”老板回答道：“小一些，你拿起来就轻便些。”


    “我懂了。”


    男孩说着，就把一个便士放在柜台上，正当他要走出店门时，老板叫住他：“喂，你还没付足面包钱！”


    “哦，没关系。”小孩有礼貌地说，“少一些，你数起来就更容易些。”


    老板哑然。


    这里，聪明的小男孩用的就是“以牙还牙”的计谋。


    再如，白族“巧嘴姑娘”智对大财主的故事，亦是如此。从前，一个大财主存心刁难“巧嘴姑娘”，他让人牵来一匹马，自己骑在马上，一脚踩着马镫，身子向上一挺问巧嘴姑娘：“你说我是上马，还是下马？”这意思很清楚：如果说他上马，他就下马；如果说他下马，他就上马。无论说他上马还是下马，都不对。巧嘴姑娘镇定自若，不作正面回答，而是缓步走到门前，伸出一脚踩在门槛上，另一脚踩在门外，反问财主：“你说我是进门，还是出门？你先回答了我的问题，我就能回答你的问题。”财主无言以对，只好认输。


    这样的事例，在古代实在不少。


    公元前532年，晏婴奉命出使楚国。


    楚灵王对大臣们说：“晏婴虽然身材矮小，但在诸侯中却很有声誉。我想借此机会羞辱他一番，来显显我们楚国的威风。”


    太宰薳启疆奏道：“晏婴能言善辩，单是一件事不足以羞辱他，必须如此这般！”


    楚灵王听了很高兴，吩咐他前去准备。


    ## 缺德史话


    第二天，晏婴乘车来了，只见城门紧闭，没有人来迎接，就让随从叫门。


    守城的军士指着城门边才挖的一个高不过五尺的小洞说：“大夫从此洞出入，宽绰有余，何必再开大门？”


    晏婴走到小洞前边，看了看说：“这是狗洞，不是城门。出使狗国的人，才从狗洞进去。现在我出使楚国，难道也从狗洞进去吗？”


    守门军士听了赶紧报于楚灵王。楚灵王说：“我本想戏弄他，反倒被他戏弄了。”于是命令打开大门，请晏婴入城，并在宫殿台接见他。


    楚灵王一见晏婴，故作惊讶地说：“难道齐国没有人了吗？”


    晏婴知道楚灵王是在讽刺他，不动声色说：“我们齐国的人多得很，摩肩接踵，呵气成云，挥汗可成雨，怎能说没有人呢？”


    楚灵王笑道：“那么为什么派一个小小的人来出使我国？”


    晏婴面无惧色，说：“这你就不知道了。我们齐国有一个规矩，漂亮、能干的人出使强大、有正义的国家，丑陋、无能的人出使不肖之国。我是最丑、最没出息的人，所以只配出使楚国。”


    楚灵王听了，弄了个大红脸，心中不由暗自惊异，想：“这晏婴果然厉害，我倒被他讽刺了一顿。”


    楚灵王只好顺手拿起一只合欢桔递给晏婴，以掩饰自己的窘态。


    晏婴接过合欢桔，连皮一齐吃下。


    楚灵王不由得又抚掌大笑道：“齐国人难道没有吃过桔子吗？为什么不剥皮？”


    晏婴回答：“我曾听说过这样的话，接受君主所赐给的，瓜、桃不剥皮、桔柑不剥皮。今承蒙大王所赐，就如我的主公所赐一样，大王没有让剥皮，我怎敢不连皮吃下。”


    楚灵王听了，心中不由肃然起敬。命侍者摆酒款晏婴。但楚灵王仍不死心。


    过了一会儿，有几个武士绑着一个犯人从前殿经过。


    楚灵王故意问：“这个犯人是哪国人？犯了什么罪？”


    武士回答：“是齐国人，犯了偷盗罪。”


    楚灵王看了看晏婴，笑嘻嘻地说：“齐国人都善于偷盗吗？”


    晏婴知道这又是楚灵王设下的圈套，便站起来很严肃地说：“我听人家常说‘桔子生在南方，长得又大又甜，生在北方则转变为枳，生得又小又酸。’为什么呢？因为南北的水土不一样。我们齐国的百姓，在齐国的时候又勤劳又正派，没有一个当小偷的；可是来到楚国却变成了盗贼，是不是楚国的风气与水土让老百姓学会了偷盗？”


    楚灵王听了脸上一阵红，一阵白，再也没话可答。


    晏婴不卑不亢，针锋相对，用楚灵王之“矛”，攻破了楚灵王之“盾”。


    明朝清官海瑞则用“以牙还牙”计，好好整治了严嵩之子鄢懋卿一番。


    海瑞在淳安县做知县时，正值大奸臣严嵩在朝廷中红得发紫。严嵩的干儿子鄢懋卿依仗严嵩的权势为所欲为，是严嵩最忠实的走狗和最凶恶的爪牙。一次，鄢懋卿到东南沿海搞所谓的“考察”，这家伙每到一地，排场阔绰得难以形容，敲诈勒索明目张胆，单在扬州一地就搜刮到几百万两银子。到了杭州，所有的官员都诚惶诚恐地围着他忙得团团转，惟恐得罪了他。他们还物色了许多美貌的年轻女子供他淫乐。他坐的是八人大轿，但轿夫却用了100多人。


    鄢懋卿虽然这样骄奢淫逸，但还经常做做勤俭朴素的表面文章，为自己装装门面，鄢懋卿这次所谓的“考察”也是这样。他在将进入包括淳安县在内的严州府地界时，表面上明文告示各县，宣称自己生性简朴，不喜欢别人逢迎，各地迎接款待，都应该俭朴节约，不要过分奢华，浪费钱财。


    明明是个婊子，还拼命给自己立贞节牌坊，如此无耻，根本不懂得什么叫虚名之忍；言行不一，表里不一，明明是欺压百姓，还要装成清官，不治这种人不足以解民恨。


    海瑞早就知道鄢懋卿卑鄙无耻，贪得无厌，自然不相信他这些专门用来欺世盗名的花言巧语。不过，不妨利用这一点来治一治这个不可一世的家伙。可是，他知道，鄢懋卿是严嵩的干儿子，硬碰硬自然不行，得另想办法，要让鄢懋卿有所收敛而又没地方发泄。


    眉头一皱，计上心来。海瑞召来一个小官吏，吩咐他到各地探听，看看鄢懋卿到各地到底搜刮了多少钱财，而各地为了迎接他又花费了多少财物。海瑞要人将各项费用详细列出，然后给鄢懋卿递交了一个报告，上面写道：“鄢懋卿大人：据我所知，大人这次视察，各地花费很大。大人每到一地，各地无不借机花天酒地奢侈无度，逢迎大人，这显然不符合大人向来简朴节俭、不喜逢迎的作风。现在大人马上就要驾临我县，我们为此深感为难，如照大人通知上所说的节俭办事，深怕获简慢之罪，大肆招待，又怕违背了大人体贴平民百姓的本意。请问大人，我们怎样办才好？”


    鄢懋卿见了海瑞的报告，知道海瑞这是有意在与自己过不去，心里恨得咬牙切齿，但又知道海瑞是个铁面无私的知县，弄得不好自己难以下台，所以只好在海瑞的报告上愤愤写下几个字：“当然照正式通知办事。”


    后来，鄢懋卿干脆绕道而去，没有进入严州地界——他怕去碰海瑞的软钉子。


    海瑞的软钉子并不软，不可一世的鄢懋卿碰得疼痛难忍，却又无处发泄。海瑞的高明之处在于：利用鄢公的表里不一，以子之矛，攻子之盾。


    ## 茅坑里也塞个亲信


    俗话说，物以类聚，人以群分。封建官场派系林立，臭味相投者往往勾结在一起，狼狈为奸，党同伐异，搞得官场乌烟瘴气。


    明朝太监魏忠贤与他的阉党沉瀣一气，干尽了坏事。明万历年间，朝臣分为两派。东林党和齐、浙、楚三党相互攻击又轮流执政。东林党人虽大都比较正派，对时局也有切中要害的针砭，但并无改革的有力措施，而且门户之见甚深。凡不合己见的，皆认为是异党，一旦掌权便大加贬斥，这就势必把一些人推到了对立面。天启初年东林党拥立朱由校登基并再度掌权。被排斥的官员为保全自身，便纷纷依附了魏忠贤。魏忠贤早就对东林怀恨在心，因为东林首领刘一燝、杨涟等曾力主客氏出宫并弹劾过自己。如今见朝中两派不和，乐得趁机张网抛线，搜罗党羽，壮大自己的势力。


    明朝不设宰相，内阁是主要办事机构，实有宰相之权。魏忠贤要建立一家天下，首先就想控制内阁，在阁臣中安插或培植自己的亲信。礼部尚书顾秉谦为了投靠阉党，曾率子跪在魏忠贤脚下，厚颜无耻地说：“我本想拜在您膝下为义子，又恐您不喜欢我这白胡子儿子，所以就让我儿子给您当孙子吧！”魏忠贤大喜，当场封这个乳臭未干的义孙为尚宝丞。顾秉谦也在天启三年入阁，不久即升为首辅，替魏忠贤总揽一切要事。


    阁员魏广微也是个无行小人。他原籍河北南乐，与魏忠贤并不同县，本无血缘关系。只因姓魏，他便认贼作父，以同乡、宗侄的身份最早巴结上魏忠贤，故得被点入阁。在他任大学士期间，每有机密文札，必亲自封好，在封皮上用行书体写上“内阁家报”四个大字，并盖上私人印章；然后差心腹家人送入宫内的值班房交魏忠贤的干儿李朝钦收。堂堂的内阁衙门，只不过是魏忠贤的私家的文书房！青年翰林、涿州人冯铨与东林党不和，又因和魏忠贤前妻冯氏同姓，魏忠贤便对他大有好感，不但认作冯氏同宗，还千方百计拉冯铨入了阁，作了“少年宰相”。后来，阉党残害东林，大半是冯铨的密谋。其他如黄立极、施凤来、张瑞图、来宗道、杨景辰等阁员，都是被魏忠贤看中加以重用的，无怪人称他们为“魏家阁老”。至于阁员中那些不肯附合魏忠贤的，都遭到了排挤，刘一燝、叶向高、韩爌、朱国桢四位首辅都被迫辞职还乡。


    内阁已属魏忠贤，其他各部官员，更有一些无耻之徒，不顾脸面，争相拜在魏忠贤门下，认阉人为父，充当干儿义孙。魏忠贤也是来者不拒，一律收纳，量佞使用，安插在各部作为亲信。在他的徒子徒孙中，最臭名昭著的是五虎、五彪、十狗、十孩儿和四十孙。


    五虎（崔呈秀、田吉、吴淳夫、李夔龙、倪文）之首崔呈秀，是魏忠贤最忠实的走狗，一贯趋炎附势。东林党掌权时，他请求加入，被拒绝；后又因贪污受贿，被东林党高攀龙参奏，革职候勘。崔呈秀索性投靠魏忠贤，做了养子。魏忠贤“相见恨晚遂用为腹心，日与计划。”一个龌龊的小人，从此成为朝中重臣，做了工部和兵部尚书，魏忠贤的一切恶行，无不与崔呈秀有关。五彪（田尔耕、许显纯、崔应元、杨寰、孙云鹏）或为锦衣卫首领，或为东厂特务，被魏忠贤委以要职，充当打手。兴冤狱，用酷刑，捕人杀人，都是他们直接干的。十狗、十孩儿、四十孙，都是些卑劣到极点的人。如十狗中的曹钦程，原是吴江知县，贪污营私，早已声名狼藉。认魏忠贤为义父之后，摇身成了“人物”，日夜出入魏门，逢人便夸耀干爸爸如何喜欢他，连同党人都嫌恶。后来魏忠贤瞧他讨厌了，削了他的官职，曹钦程竟顿首谢道：“君臣之义已绝，父子之恩难忘。”哭啼啼地走了。有了这帮死心塌地的狼狗，魏忠贤干起坏事来，自然得心应手。


    除了虎、彪、狗、儿、孙分面把守外，朝中重要部门都陆续被魏忠贤亲信控制。吏部是掌握官吏进退升迁的要害部门，魏忠贤就让投靠他的王绍徽担任吏部尚书。王绍徽每升降一人，必要禀告魏忠贤，又时常列出所谓“点将录”，诬告东林党。魏忠贤对他十分满意，称他“真吾家之珍也”，同僚们都叫他“王媳妇”。兵部尚书最初也是由魏忠贤的“愚甥孙婿”霍维华担任，他和崔呈秀为魏忠贤出谋划策，《本朝要典》就是他倡议修的。还有工部尚书徐大化、孙杰，刑部尚书薛贞，御史刘志选、卢承钦，兵部尚书刘诏等，都因谄魏有功而爬上高位。不只在朝廷上，就连地方上的总督、巡抚，也几乎都投靠了魏忠贤，这里不一一详述。


    总之，魏忠贤在几年之内，走狗爪牙已遍布京城内外，结成了势力浩大的“阉党”。崇祯二年公布的“逆案”名单，就列了阉党委员二百八十九人，上有内阁大臣，下有郡县官吏。一个大太监竟把国家权力部门变成听命于他的“魏家天下”，在宦官猖獗的明朝也是空前的。


    ## 四、牢牢控制下属的利器


    世界上有两种人既危险又可怕：聪明人和自作聪明的人。聪明人对别人耍点魔术，迷惑人；自作聪明的人常对他自己变点戏法，懵自己。


    当官的是聪明人。


    你要官给官，要钱给钱，爱色给美女……但“士为知己者死”，吃人家嘴软，拿人家手软，受人恩惠者自然要受人驱使，效犬马之劳。


    缺德者对付别人的手段花样多多，但也不过是“皇帝的新衣”。


    ### 高官，握在驴夫手中的青草


    古代君王控制臣下，大都注重“恩威并施”。有功则赏，有过则罚，让部下对自己怀德畏威。其实，处罚乃是不得已而为之，一个高明的统治者平时运用最多的是“赏”。采用各种各样的“损”招收买人心以便让部下为己所用，于是乎形形色色的统御术应运而生：爱官的给官；爱钱的给钱；爱色的给美女。


    俗话说，“士为知己者死”，在一般人看来，人生在世要知恩图报，受人恩惠自然要受人驱使效犬马之劳。事实上，这恰恰中了阴谋家的圈套。意大利著名思想家马基雅维里在其名著《君主论》中有过一段精彩的论述：“为了使大臣保持忠贞不渝，君主必须常常想着大臣，尊敬他，使他富贵，使他感恩戴德，让他分享荣誉，分担职责；使得他知道如果没有自己（按，指君王），他就站不住，而且他已有许多荣誉使他更无所求，他已有许多财富使他不想更有所得，而且他已负重任使他害怕更迭。因此，当大臣们以及君主和大臣们的关系是处于这样一种情况的时候，他们彼此之间就能够以诚相孚。”


    一个人投身官场，追求的目标便是一个“官”字，在他看来，升官晋爵不仅是事业有成的标志，而且能带来数不清的好处。有官便有权，有权便有了一切，有了享不尽的荣华富贵，亲朋好友的捧场恭维，部属的拍马奉承，妙龄女郎的献身邀宠……一个人一旦有了官“瘾”就像抽大烟一样是万难戒掉的。因此，利用高官厚禄来驾驭臣下，历来是掌权者手中的法宝。如何把握封官的时机，选择封官的对象，安排官职的大小、手段等等，这些都有专门的学问。


    记得有这样一则寓言，说的是一个车夫为使拉车的驴子跑得快些，便将一把青草拴在车子前面，恰巧离驴的嘴巴有半尺远。驴子为了得到那把绿茵茵的青草，便拼命地向前跑，可无论怎样的努力，那把青草离驴子还是那么个距离。正所谓，“看起来很近，走起来却很远”。其结果，草依旧是那把草，驴子却不是那头精神饱满的驴子了。当然，这个寓言说得有点言过其实。车夫完全可以在拉完货后，毫不犹豫地将那把已经有些发黄的青草丢到驴子脚下，任其去品尝胜利后所带来的喜悦。因为那青草遍地都是，远不必那么惜如金玉。可在官场上毕竟是粥少僧多，官位有限，不可能随意授人。再说如果封得太滥了，“官”自然也就贬值了，失去了诱惑力。比如，太平天国后期，在湘淮军的夹击下，太平军处境日益艰难。为了挽回败局，天王洪秀全采取了一种并不高明的策略，那就是大封诸王借以鼓舞士气。据统计，洪秀全先后分封了两千七百多个王，大小文臣武将，亲朋故友都如愿以偿当上了“王爷”。然而，时间一长，这一招就不那么灵了，太容易得到的东西往往不令人珍惜，不但没有达到齐心协力挽回败局的目的，反而导致了太平天国内部秩序的严重混乱。大家都是“王”，谁也不服谁，彼此离心离德，客观上加速了太平天国的覆亡。


    相比之下，春秋时期晋悼公的授官策略就要高明得多，这便是虚位待人，催人上进。春秋时期，诸侯争霸，晋国从晋文公时起就开始励精图治，国力逐渐强盛，终成霸业。晋悼公继位后，原来的军中老帅相继去世。为了保证军队的战斗力，有效地指挥军队，晋悼公在绵山大规模地整治军队。他拜荀偃为中军主帅，士匄为副帅。对于荀偃辞职后留下的上军主帅的空缺，晋悼公召见上军副帅韩起，表示出有意任命其为上军主帅。


    晋悼公这样做，有其更深层的意思。上军一直在荀偃和韩起的直接领导下，将士们自然对荀偃和韩起比较熟悉。况且，这支军队在战争中屡立战功，将士们对自己主帅的拥护率还是比较高的。现在荀偃改任中军主帅，韩起在上军中的影响自然就成了最大的了。如果没有韩起的认可，匆忙下令任命新主帅，恐怕会在上军将士心中产生疑虑，也害怕韩起会产生抵触情绪。其实，就韩起的才能而言，也只能当个副帅，很难胜任主帅之职。想来想去，便有了向韩起征求任命意见这一出。


    韩起又何尝不明白这一点，都是在官场上混的，连个语气、眼神都听不出来、看不出，还能混下去吗？如果晋悼公真的想任命自己为上军主帅，还用得着这么客气地找自己征求意见吗？只需要召开个大臣会议，一纸诏谕便行了，上下欢喜的事，何苦那么谦虚。这是在等着自己表态让别人来充任上军主帅，仅此而已。与其让别人说明，倒不如顺水推舟来个主动让贤，也落个好名声。君臣皆大欢喜，又何乐而不为呢？韩起想到这里，微微一笑，上前半步，拱手向晋悼公拜了一拜，朗声说道：“感谢主公的信任，臣感激不尽。只是末将才疏学浅确实难以胜任，新军主帅赵武才能远在臣之上，希望主公能任命赵武为上军主帅。臣下一定尽力辅佐赵帅。”


    晋悼公要的就是韩起这句话，顿时笑容满面，免不了多多地夸奖几句，随即下令任命新军主帅赵武为上军主帅。


    经过一番折腾，晋悼公终于按照自己的意愿将军队做了新的部署，只是一时找不出更为合适的人出任新军主帅。当然，有意谋得这个职务的人自然不少，但都不尽人意。晋悼公思前顾后，终于下定决心，新军不设主帅。封官不能一步到位，这也许正是晋悼公的先见之明。


    这种不同常规的决定，自然引起人们的议论。晋悼公回答得很干脆：“孤家宁肯让这个职位空着，也不能因为人多而滥设职位。”


    晋悼公这种宁缺勿滥、虚位待人的做法，使得众多的仕途求宦者认识到，要求得高官厚禄，关键在于自己的才能。那对常人来说可望不可及的王宫大院中或许还有一个为自己而空着的位置呢！


    其实，或许真的像那头驴子和青草那样，虚位的依然虚位，而求官者却已日暮黄昏了。


    人们常说“论功行赏”，仿佛应该根据功劳的大小来决定所封官职的高低。但功劳这种东西，不是一种器具物体，很难测出谁大谁小。封赏部下，固然要照顾功劳的大小，但更主要的，还是要考虑到封官的终极目的——笼络人心，这是自古以来封官晋爵的一个基本原则。


    刘邦当了皇帝以后，开始大封功臣，论功行赏，对于二十几个主要功臣早就决定封赏了，但对其他人则因评定太慢而迟迟未能决定。有一天，刘邦在走廊上忽然看到花园里聚集了好几个小集团，窃窃私语，似乎在商量什么事。刘邦百思不解，于是回头询问张良是否知道他们在讨论什么。张良的回答吓了刘邦一大跳：“陛下难道不知道吗？他们正在企图谋反。”刘邦赶紧问是什么原因。


    张良回答说：“陛下原来只是一介庶民，因为有了他们效力才得到天下。然而陛下成为天子，却只有萧何那些一开始就得陛下欢心的大臣们获得赏赐。而另一方面受到处罚的，仍是那些平常陛下不喜欢的人。现在虽然有专人负责评定功绩，但是合计一下封地，即使把全国的土地都封给功臣们，也是不够啊。他们害怕陛下不能让每个人都获得封地，或是因为过去的失败而受到惩罚，所以才聚集到这里计划谋反。”


    刘邦听后沉吟良久，又问：“那么这件事应该如何处理呢？”张良回答说：“是不是有一个陛下平日最讨厌的人，而大家又都心里知道呢？”刘邦回答：“雍齿这个人是我早就厌恶的，他最喜欢跟我作对，我早就想杀掉他，但是因为他的功劳卓著，所以只好忍耐住。”张良说：“那么，请陛下赐雍齿封地，而且当众宣布吧！只要雍齿得到封地，大家自然会安静下来。”


    于是，刘邦采纳了张良的计策，大开筵宴，封雍齿为侯，然后乘机告诉众人他已督促负责人尽快评定出每个人的功绩，请大家稍安勿躁。如此一来，将领们都停止喝酒，大声欢呼，并且交相耳语：“连雍齿都受封为侯了，我们一定也能很快受

    '
