    慨吗？据他津津有味地坦露，他已经骗得二十几位少女的信任，在这二十几个少女中，他想和谁结婚都成。其中，有大学生，有女兵，有干部，有教师，还有比他小一半的小姑娘。总结他的骗法，无非是吹嘘自己如何有地位、怎样有钱。一次，这位先生在火车上邂逅了一位来自东北的姑娘。他见这姑娘长得水灵，便见色起意，谎称自己是“导演”，姑娘就上了圈套。他们在武汉一家宾馆住下后，开始“导演”还装出一副道貌岸然的样子——分间而息，可过了两天之后，“导演”就开始不客气了。为了尽快将姑娘弄到手，他谎称要试镜头，便让她来到自己的住处。幸亏他有一台微型摄像机，不然姑娘根本不会那样很快投怀入抱。当时，那女孩儿的房间没有浴池，“导演”便“好心”地让她进自己的房间洗澡。而这边“导演”也不闲着，他将摄像机的镜头对准了女孩儿的胴体。“导演”很是明白俘虏女孩的方法。等把这些镜头说成是为了电影的需要之后，女孩子便默默地低下了头。他已习惯了这个“镜头”：女孩子涨得绯红的脸几乎流出血来，等他再得意地重放一遍，并要求这位少女一起“欣赏”自己的杰作时，他的目的就快要达到了。一边是羞愧难当，一边是得意洋洋；一边是无所适从，一边是稳操胜券；一边是“羊”，一边是“狼”。在这个久经骗场的色狼面前，姑娘只有任其摆布的份儿。你瞧，“导演”导得怎样？人家就像是吃家常便饭：既从容又潇洒，既稳重又大方，哪有一点骗子的痕迹？凭心而论，教您这样做，您能学会吗？要说心理素质那么重要呢！


    如果说上面这个爱情骗子值得“欣赏”，那么一些靠吃软饭过活的男人就更为缺德了。逼良为娼者有之，骗色又骗财者有之，前不久笔者在电视上看到一则报道就更为可鄙。那位冒充军官的罪犯在骗取了少女的爱情后竟然继而又去榨财。当走投无路的少女在被家人赶出门后，不得已做了一家舞厅的陪舞小姐。可就是这样，那个罪犯仍不放过，他在深圳的这家舞厅找到她后，继续向她敲诈钱财。缺德之人的厚皮脸做法就是这样让善良的人不忍去听。


