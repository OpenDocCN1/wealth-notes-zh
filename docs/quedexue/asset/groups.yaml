    # # 缺德定律：八仙过海，各显神通


    有的读者在看了半天之后一定发闷：你说了那么多缺德之人的缺德事，我们一定不敢缺德了。可有一点我们百思不得其解，若是遇到了缺德人的挑衅，又没有一个讲理的地方，究竟怎么办呢？


    以我之见，最好的办法还是“以牙还牙，以眼还眼”。这正如数学上的负负得正原理。否则，真是“秀才遇着兵，有理说不清”。比如说，当不人道的战争燃起之时，你还在那里讲什么仁义道德，那不是痴人说梦吗？倘若真是这样，你又陷入了不道德的境地。东郭先生和狼的故事人人皆知，狼无德，人也跟着瞎摆弄，怎能不令人发指？


    说实在的，中国古代的所谓“圣贤”并不乏缺德带冒烟的主儿。然而，他们的贤明地位却从来没有动摇过。为什么？人家有谱儿。打了胜仗，得了便宜，还要卖上一段乖。而且，在名义上还落个“仁至义尽”的美名。“桃园三结义”是传颂了几千年的一段美谈。可有谁知道，刘备的心思并不只是一个简单的“结义”。他表面上仁义忠厚，可肚子里的计谋却并不亚于“诸葛亮”。只不过是他自愿摆出一副“大智若愚”的样子罢了。“不能同年同日生，只愿同年同日死”听起来固然是“义”字当先，也催人泪下。可是，我们也明明看到，在硝烟弥漫的战场，“大难临头各自飞”的情形也在所难免。无论'
  - '[PAGE 62]


    “各自飞”的理由是多么充足，但是作为旁观者的我们总觉“只可意会”。尤其是在关羽的“义”字上，我个人以为，是缺德的传统观念造成了关羽的迂腐、愚忠。江山如此多娇，而一代英雄竟折腰。事实上，他们“只愿同年同日死”的誓言最终还是成了“食言”。这里，必须说明的是，“义气”本身并不是缺德的概念，关键是当“义气”成为一种负担、变成一种伎俩时，它本身就失去了应有的价值。鲁迅先生这样给悲喜剧下定义说：“喜剧是将无价值的东西撕破给人看，悲剧是将有价值的东西毁灭给人看。”要知道，“义气”也分两重情况，有时是悲剧性的，有时则是喜剧性的。


    这使我不由得想起隋朝的杨广来。杨广的例子告诉我们，缺德定律讲的不光是一个针锋相对的问题。在很多情况下，你的缺德定律“英雄无用武之地”。您不是要“合法”地缺德吗？人家早已“合法”过了，看你怎么办？而且做得比您还技高一筹。


    杨广的缺德之行告诉我们：世界上有两种东西能摧毁人性和人伦，那就是权力和情欲。在隋朝统一中国后不久，担任攻击陈国总领的杨广开始了丧心病狂的夺嫡活动。他的哥哥皇太子杨勇遭殃。杨勇是一个大而化之的花花公子，为所欲为，不拘小节。老娘独孤皇后最讨厌男人有姬妾，杨勇偏偏反其道而行之。皇帝老子杨坚最讨厌大臣们花天酒地，而杨勇偏偏歌舞升平，饮宴达旦。这些东西对一国的皇太子来说本是一些小事件，可是也足以让杨广乘机而入。杨广只有妻子萧妃一个人，仅此一点就让老娘高兴不已。皇帝夫妇有一次到杨广家，发现婢仆们老且丑，乐器上布满了灰尘，甚至连弦都没有，不禁大喜。老夫妇每次派人到杨勇家，杨勇都是以居高临下的眼光看'
  - '[PAGE 63]


    # # 缺德学 · 51 ·


    待他们，而到杨广家则不然，夫妻俩总是亲自到门口迎接，临行时并送以厚礼。于是，从皇帝老子那里听到的全是一片赞扬之声。杨广出镇江都，每次入朝辞行时都痛哭流涕，依依不舍，父母看儿子如此孝心，也流下泪来，不忍他远行。杨广知识程度很高，有很好的文学素养，待任何人都很诚恳，而且谦虚有礼，尤其曲意交接政府重要官员，包括杨坚最为信赖的宰相杨素。总之，他所展示出来的，全是一个千载难逢的标准领袖形象：具有肝胆相照、救国救民的英雄性格。诸如节俭、朴实、谦虚、好学、礼贤、不爱声色狗马等，可谓集美德于一身。


    一旦时机成熟后，“诬以谋反”的罪名就压在了杨勇的头上。杨坚下令将杨勇贬为庶民，囚禁深宫。并宣布改立杨广为皇太子。杨广“秘则事成”，马到成功。杨广得手不久便露出了马脚。其母过世后不久，其父病重，杨广入宫侍候。小人得志，这种心情使他无法继续控制自己。他见皇帝老子即将命归西天，便对早已垂涎三尺、老爹最为喜爱的陈夫人下了手。一天，他乘陈夫人更衣之际一把将其抱住，欲行不轨。陈夫人慌忙挣扎逃跑，杨坚见她神色仓皇，便问她是怎么回事。夫人垂泪说：“太子无礼。”杨坚大怒说：“独孤误我。”于是命令他的两位心腹速去长安召回杨勇。杨广得知消息后，急忙通知杨素，杨素立即把两位亲信官员逮捕，勒兵戒严，包围仁寿宫，断绝内外交通。杨广的部将张衡，闯进杨坚的卧室，将其拖起，猛击他的胸部。杨坚口吐鲜血，哀求的声音传入后宫，陈夫人等全体宫女面无人色。


    杨广弑父后的第一件事就是找他的漂亮庶母陈夫人睡觉；第二件事就是派人赴长安将其心患杨勇除掉。杨广从开始夺嫡'
  - '[PAGE 64]


    # 缺德学原理


    行动到他凶相毕露之日，历时 14 年。在这段漫长岁月中，他一直伪装得很隐秘。照实说来，若是没有一身练就的缺德素质，真是比登天还难。杨广之所以做得天衣无缝，就是因为他从缺德国中土生土长。


