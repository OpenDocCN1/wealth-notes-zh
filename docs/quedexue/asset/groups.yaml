    徐世昌由科举之路，靠“中庸”之道，一路顺风，在仕途上十分得意。


    孔祥熙也是中庸之道的信奉者。


    孔祥熙虽然喝过洋水，工作方式有些洋化，大而化之，但做官、处世则更多地继承了儒家的伦理思想，不偏不倚，无过不及。在他身上中庸的成分占着很大的比重。


    譬如，义和团运动时，他反对屠杀教士教民，憎恨拳民无知，主张严惩山西巡抚毓贤，但不主张八国联军进攻山西，认为八国联军进攻山西只能是践踏百姓；李鸿章在近代史上签订了一系列卖国条约，国人皆曰可杀，但孔祥熙不仅认为李办洋务有功，与李往来，而且还接受李给予的“全权议和大臣一等肃毅伯随员”名义赴美留学；1907年孔祥熙回到欧柏林大学，在欢送会上，中国同学会提议捐一笔款子为庚子殉难教士立碑勒石建立一所纪念堂，孔认为纪念堂是死的纪念物，他根据孙中山“启迪民智”的指示，要求兴建一所学校作为活的纪念物，使殉难教士的精神长存；辛亥革命时，孔率中路军抵抗从太原南撤的清军，但又担心溃军抢劫桑梓钱财，采取施钱纵敌的策略；他信仰基督耶稣，但很少参加礼拜；他反对袁世凯称帝，但在上书中文毕恭毕敬；他参加了广东革命政府，支持北伐吴佩孚，但又和吴佩孚保持很深的私交友谊；1927年在政治上倒向南京政府以后，又和武汉政府保持一定关系，并站在南京方面竭力促使宁汉合流；1931年12月，蒋介石辞去行'
