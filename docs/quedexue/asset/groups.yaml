    # 扶不起的阿斗不帮


    为人处事，求官从政，需要智慧，需要眼光。当某人处逆境，遭厄运时，适时拉他一把，帮他一忙，会使他感激万分。俗话说，滴水之恩，当涌泉相报。


    中国人是重情分的。倘若某人日后交上好运了，飞黄腾达了，多是会忘记在困境中帮助过他的恩人的，总会以各种方式报答他的恩人。即使某人不讲感情，但为了标榜自己的成功，或求得心理的平衡，也会显露一下自己的“义气”。如此一来，帮他的人就有回报了。当然，真正乐于助人的人，是不图回报的，也许他们早就把帮过的人忘了。所以在回报面前，他们会显得不安，总觉得这是“我应该做的”，何必斤斤计较？


    不过，贪财图利的缺德之辈，可不这样想。他们帮人的目的是为了获得巨额的回报。他们在帮人之前，先要算计一下，看看这样做是否值得，是否百利而无一害。所以他们帮人是有前提的，没有前途的弱者不帮，扶不起的阿斗不帮，不懂“礼尚往来”的不帮。所以，他们不是出自内心的帮人，他们虽助人却不快乐，因为担心肉包子打狗，有出无回。以最小的投资换取最大的利润，才是此类人的真正追求。


    在这方面，吕不韦堪称典范。


    # 缺德学 · 173 ·


    吕不韦是战国时期的大商人。


    有一天，他想：自己经商成功，如果再继续做下去，也没有什么意义，应该做些买卖以外的大事情。他开始关心政治，“如果能当个成功的政治家，就能操纵国事，倘若顺利，天下就是自己的，比起卖命经商一定更有趣。”终于，他下定决心弃商从政。


    一次，一个偶然的机会，在赵国都城邯郸遇到在赵国当人质的秦国公子异人，见他“车乘进用不饶，居处困，不得意。”认为“此奇货可居”。只要好好利用他，便可以做好一笔大的政治投机生意。回到家里，他问其父：“种田可赢利几倍？”答：“十倍。”“贩卖珠宝之利几倍？”答：“百倍。”“若扶立一个人为国君其利几倍？”答：“那就多得无法计算了。”吕不韦听了异常高兴说：“如今努力耕作，还不能吃饱穿暖，如果‘定国立君’所得的好处还可以传给子孙后代，我愿意去干这种事。”


    吕不韦把异人视为“奇货可居”，是把经商中的投机手段用之于政治，是洞悉当时天下形势和秦国政情内幕而作出的一种有胆识、有政治远见的决策。


    当时的天下形势是战国七雄中的齐、魏、赵、楚、燕、韩等六国一个个败落下去了，而秦国蒸蒸日上，由秦统一天下已成定局。本来，七国中，楚的疆域最大，秦、赵次之，齐、魏、燕又次之，韩国最小。从国力说，起初魏最强盛，秦还是个僻处西隅文化落后的国家，“不与中原诸侯之会盟，夷翟遇之”，为东方各国所轻视。因与魏为邻，经常遭到魏的攻伐，被魏夺去了黄河至洛水之间的一大片国土。但到了秦孝公（公元前361—前338年）时，秦国逐渐兴盛起来。秦孝公是位雄心勃勃的国君，“据崤函之固，拥雍州之地，君臣固守而窥周


    室，有席卷天下，包举宇内，囊括四海之意，并吞八荒之心”，“布惠，振孤寡，招战士，明功赏”。发奋图强，用商鞅变法，“内立法度，务耕织，修守战之备，外连衡而斗诸侯”，成为“兵革强大，诸侯畏惧”的强国。秦孝公采纳商鞅的意见，首先把矛头指向与秦为邻的魏国与韩国，一度越过黄河攻克了魏的都城安邑（今山西夏县北），迫使魏将国都迁到大梁，收复了一部分过去被魏夺去的黄河西岸地，并攻占了韩国的宜阳。


    继秦孝公之后的秦惠王（公元前337—前311年）是位有作为的国君，他用张仪为相，司马错等人为将，继续实行远交近攻的策略，先后攻占了魏、楚、赵国的不少城邑。


    公元前306年秦昭王即位。他也是位雄才大略的君主，用魏冉为相，白起为将，在兼并战争中取得辉煌的胜利。又先后攻占了魏、韩、赵、楚的大片疆土。到昭王末年，东方各国一个个败落下去，惟秦越战越强，由秦统一天下已成定局。当时魏国的子顺就看出这一局势，说：“当今山东之国敞而不振，三晋（韩、魏、赵）割地以求安，二周（东周、西周）折而入秦，齐、燕、楚已屈服矣。以此观之，不出二十年，天下其尽为秦乎？”吕布韦走游各国经商，自然也看到这一点。


    这时，吕不韦还深刻了解到秦国的政局内情。公元前267年（秦昭王四十年）秦昭王的长子悼太子质于魏而卒，公元前265年秦昭王立次子安国君为太子。吕不韦估计昭王年事已高，在位不会很久，安国君定能继承王位。安国君有二十多个儿子，但他所宠爱的华阳夫人却没有生子。华阳夫人为了保持自己的尊宠地位，必定要在诸子中选一个作为嗣子，这是一个可钻的空子。异人为安国君的夏姬所出，在兄弟中排行居中，按照立嫡长子不立庶子的封建传统习惯，异人是没有资格继承


    王位的。如果通过活动，使安国君和华阳夫人将异人立为嗣子，那么现今这个落难的穷公子将来就能登上王位。这样，他就成了“定国立君”的大功臣，位极人臣。


    为了实现这一政治投机目的，吕不韦便去结交异人，对异人说：“我能扩大公子的前程。”异人惊诧，丈二和尚摸不着头脑，便笑着说：“您可以扩大您自己的前程，怎么说扩大我的前程呢？”吕不韦直言不讳地说：“公子有所不知，我要靠公子才能扩大前程。”异人听出话中有话，心领神会，便请吕不韦就座，促膝交谈。吕不韦说：“公子的祖父昭王已年老，在位不会很久，公子的父亲安国君已立为太子，昭王一旦过世，安国君即可继位。我听说安国君宠幸华阳夫人，而她无嗣子。当今能立嫡嗣的惟有华阳夫人。公子兄弟二十多人，公子又属中子，且长期在赵当人质。待昭王死，安国君即位后，公子再要想和兄弟们争当太子就不可能了。”异人说：“您说得对，但这该怎么办呢？请多多赐教。”吕不韦见异人已动心，便说：“公子如今穷困，无钱去奉献华阳夫人和结交宾客，我虽然不富有，然愿以千金相助，为公子到秦去活动，劝说华阳夫人立公子为嫡嗣。”异人喜出望外，不胜感激，立即向吕不韦施礼，称谢说：“将来如当上秦王，一定分秦国与君共之。”吕不韦见异人如此表态，当即拿出五百金，让他用来结交宾客，又用五百金买了“奇物玩好”，到了秦国，先贿赂了华阳夫人的姊妹，托她把礼物奉献给夫人。其姊便在夫人前为异人说好话，称赞异人聪明、能干，结交的诸侯宾客“遍天下”，把夫人视为母亲，且日夜思念安国君和夫人。华阳夫人听了“大喜”，吕不韦又使她对夫人说：“我听说凡以姿色得宠的，一旦年老色衰就失宠。如今，夫人虽为安国君所宠爱，但夫人无子，应当及


    # 缺德史话


    早在诸子中选择一个贤孝的举立为嫡子。这样，夫在则重尊，夫百岁之后，所子者为王，终不失势。诸子中以异人最贤，而他自知次不得为嫡，其母不得幸，心甘情愿附夫人，夫人如在此时将他拔为嫡子，夫人则竟世有宠于秦了。“华阳夫人于是在安国君闲暇时，说在赵国做人质的异人“绝贤”，来往者皆称誉之。并撒娇地哭泣说：“妾幸得充后宫，不幸无子，愿立异人为嫡嗣，以托妾身。”安国君允许了，并与夫刻玉符为证。华阳夫人还说服安国君拜吕不韦为异人的老师，负责培养异人执掌国事。


    吕不韦将成功的消息带回邯郸，告诉异人。异人自然十分高兴，也十分感激吕不韦。两人几乎成了形影不离的朋友。


    吕不韦在邯郸与一个能歌善舞的美人赵姬同居，而且赵姬有了身孕。一天，异人与吕不韦在吕家饮酒，见了赵姬，十分爱慕，请求将她送给他。吕不韦大怒，但转念一想，为了钓这个“奇货”，不惜破家产相助，若为一个美人而闹翻了脸，岂不是小不忍而乱大谋，于是就将赵姬送给了他。异人与赵姬婚后十个月，即秦昭王四十八年正月，赵姬生了个儿子，因此取名政。政的生父是吕不韦，而不是异人。这个政，就是后来的秦始皇。


    公元前257年，秦昭王派王龁统兵围攻赵都邯郸。赵恨秦，曾想杀异人。吕不韦用重金贿赂了看守异人的赵官吏，异人因此得以逃出邯郸，回到秦军中，然后回到秦国。异人脱逃后，赵又要杀赵姬和政。赵姬是赵国富豪之女，因此得以藏匿下来，母子才未遭杀害。


    异人回到秦国，自然要先去向安国君和华阳夫人请安。吕不韦知道华阳夫人为楚国人，为了取悦于夫人，特地从让异人穿


    # 缺德学 · 177 ·


    了楚国的服装去晋见。夫人见异人这身装束果然大悦，遂把异人视作亲生子，改其名叫“子楚”。安国君让子楚诵经书，子楚说：“我自少即在国外当人质，无师傅教学，不会诵。”安国君也就作罢，把他留在宫中。一天，子楚对安国君说：“您曾停车于赵（即质于赵），赵之豪杰知道您大名的不少，您现在回国，他们皆翘首西望，十分想念您。但您却未派一介之使去问候他们，臣恐他们因此而生怨心。请将边境早闭晚开，以通往来。”安国君认为说得很对，惊奇他这样的心计。华阳夫人又劝他立为嗣子，于是召来丞相，下命令说：“寡人子莫若楚”，应立为嗣子。公元前251年秦昭王死去，安国君继位，封华阳夫人为王后，以子楚为太子。赵国为了讨好秦将使赵姬和政送回秦国。安国君的健康状况不佳，即位后一年就死了。太子楚即位，是为庄襄王。庄襄王实践诺言，以吕不韦为相，封为文信侯，以蓝田12个县为其食邑，后来又改封至三川郡的河南雒阳，食邑十万户。这样一来，秦国的军政大权就操纵在吕不韦手中了。


    吕不韦的政治投资终于获得了巨额的政治利润。


    # 权威的力量是无穷的


    社会是人群的集合，每个人都在孜孜以求，奋力拼搏。但单独的个人力量与整个社会的力量比较起来，如沧海一粟，高山一草，毕竟太小了。要做一番像样的事业，就不能仅仅局限于自身，必须借助第三者的力量，造成一种声势，这是利害成败的决定因素。而借助的第三者，最有力量的恐怕是那些有权有势或名望很高的人了。所以，中国历史上，假借皇权的名义来陷害忠良，排除异己的闹剧、悲剧就层出不穷。


    明武宗时因宠信太监，不管朝政，于是刘瑾得以擅权。


    武宗宠信的太监共有8人，即：马永成、谷大用、魏彬、张永、邱聚、高凤、罗祥、刘瑾等，时称为8党，后又号称8虎。这8人中，刘瑾最为狡诈。他曾读过一些书，粗通掌故，能力在7人之上，又最得武宗信任，因此被推为太监的首领。


    刘瑾擅权的手段主要是：“击球走马，放鹰逐犬，俳优杂剧，造作巧伪，”使皇帝心神淫荡，劳耗精力，起居失节，不问政事。刘瑾得以暗置党羽，矫传诏旨，排斥忠臣，陷害异己，阻塞言路，从中弄奸。


    大学士刘健、谢迁等上疏弹劾刘瑾等太监的罪状，被刘瑾矫旨罢官，逐出京都。给事中刘菃、吕翀中见逐走谢迁、刘健，心中不平，也上疏皇帝，乞留顾命大臣，并论及刘瑾奸邪，结果被刘瑾捕入监狱。兵部尚书林瀚、南京给事中戴铣、御史薄彦微，拜疏入京，说不可以排斥朝廷元老，不可信任太监，恰被刘瑾看见，恨得咬牙切齿。刘瑾趁武宗击球为乐时送上奏本，请求裁决，武宗只看了几句话，便掷交刘瑾：“朕不


    # 缺德学 · 179 ·


    想看这些胡言乱语，交给你去办吧！”刘瑾便传旨把上疏的几个臣子全部逮捕，处以“廷杖”，然后削职为民。当时任兵部主事的王守仁见戴铣等因为上谏而受罪，也觉忍耐不住，向皇帝上了一本奏章。哪知奏章并未送到皇帝那里，由刘瑾私阅了一遍，即假传皇帝诏旨，杖五十，死而复苏，贬为贵州龙场驿丞。王守仁被贬出京，行到钱塘江，发现后有刘瑾党羽尾随而来，知道要置他于死地，于是设下一计，乘着夜色朦胧，假装投江而死，让帽子鞋子浮在水面上，上写遗诗二句“百年臣子悲何极？夜夜江潮泣子胥。”然后本人逃到福建武夷山中，隐姓埋名。


    刘瑾与吏部尚书内外勾结，狼狈为奸，把持朝政。当时朝廷官员的罢黜和升迁，尽由刘瑾主持，而批答奏章，则归焦芳主政，所有给皇帝的奏本，须写成红本、白本两种，先向刘瑾处递上红本，然后才能向皇帝送上白本。有一天，都察院奏事，奏章内偶然提到刘瑾的名号，刘瑾便派人责问，吓得掌院都御史屠庸急忙率领十三道的御史到刘瑾住宅前谢罪，大家跪伏阶前，任刘瑾辱骂。刘瑾骂一声，众人磕一个响头，直到刘瑾厉声叱退，才起身告归。


    武宗正德三年，有一天午朝之后，皇帝将要回宫，忽见有遗留的书信一封，上面写着刘瑾的不法事情，当即饬交刘瑾自阅，刘瑾心中大恨，仗着口才，辩解了几句，武宗也没功夫理会，便还宫了，刘瑾立即到奉天门，传令众官马上到来，一起跪在门外，逐个进行清查，当时正是大热天，在阳光照射下，众官大汗淋漓，非常狼狈。太监李荣看了，也觉不忍，趁刘瑾退入内室，令小太监拿些冰瓜给众官解渴，后被刘瑾看见，太监李荣等被撤销差使。直到日暮，才驱使锦衣卫士把这些官员


