    # 缺德学


    之。所以，“凡才望功业出己右及为上所厚、势位将逼己者，必百计去之；尤忌文学之士，或阳与之善，以甘言阴陷之。”


    一天，玄宗陈乐于勤政楼，垂帘观望。兵部侍郎卢绚垂鞭按辔，横过楼下。卢绚风标清粹，玄宗目送良久，并“深叹其蕴藉”。李林甫闻知此事后，耽心卢绚会受到玄宗的重用，决意设计阻挠。翌日，李林甫召见卢绚之子，说：“尊君素望清崇，今交、广藉才，圣上欲以尊君为之，可乎？若惮远行，则当左迁，不然，则以宾、詹分务东洛，亦优贤之命也，何如？”卢绚害怕去交、广边远之地任职，上书请求派往宾、詹。李林甫“恐乖众望”，派其为华州刺史。卢绚到任不久，李林甫又“诬其有疾，州事不理”，被授太子员外詹事。卢绚并没有与李林甫有隙，只因玄宗对其表示出欣赏之意，便平地起风波，中李林甫之计自寻遭贬，尔后便屡遭压制，直到被冷落在一边。李林甫害怕别人与自己竞争，居然连皇帝赞誉他人一句话都怕得要命，可见其心虚到何种程度。


    不久，玄宗又向李林甫问起严挺之的情况，说：“严挺之今安在？是人亦可用。”严挺之原为中书侍郎，早年被李林甫挤出京，现任绛州刺史。李林甫深惧严挺之，恐其重返京都，便召见严挺之的弟弟严损之，说：“上待君兄意甚厚，盖为见上之策，奏称风疾，求还京师就医。”李林甫虚假地以关心严挺之的面孔出现，唆使严损之为其兄上奏谎称有病请求归京治疾。严损之毫无戒备之心，反倒非常感激，并且依计行事，实际上是跳进了李林甫设下的陷阱。李林甫手持严损之的奏表，对玄宗说：“挺之衰老得风疾，宜且授以散秩，使便医药。”不知究里者，谁都会觉得李林甫言之有理：既已衰老，且染风疾，给个闲官便于治疾，又归京都，岂不在情理?!'
