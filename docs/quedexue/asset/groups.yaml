    # 如何党同伐异：争取公司内部的同志以对抗异己


    三女成奸


    日本有句俗话叫：“三女成奸”，这句话和同性恋无关，意指女性爱聊天，三个女人凑在一起便可闹翻天（各位女性学员，别忘了这是缺德讲座）。当这三个女人中的一人离开时，剩下的两人又要议论起刚走的那一位，而那一位在别处也会怀疑另外两人在说她闲话。有趣的是，“三男”照样“成奸”，各位男性上班族是否会在目送一位同仁离开后，压低声音要旁人“凑耳过来，闲言碎语一番”？总之，党同伐异的“成奸现象”是人类的通性（我可没说是通病）。


    退一步说，即使自己公司的同事不爱在人背后议长论短，我们仍十分在乎别人如何评价自己，我们常担心自己没有别人。客套话所形容的那么受欢迎，甚至怀疑某个鞠躬成癖的人暗中大放冷箭。当同仁之间有明显的利害冲突时，上述不安更加噬人。


    各位要搞清楚（老式的说法是：诸君，猛醒吧！）：学生时代早已离开我们上班族而去，不要向现实社会乞讨太多的友情及诚恳，学生时代每年缴完学费，你可以随意自己安排功课及社团活动，就是夜秉烛游也没人管你，和朋友交往可以率性而行，不用心机，只和自己喜欢的人在一起，如今环境不同了，你由付钱者变为赚钱人，要认命。


    如果没有了亲爱及谅解，人生就毫无意义，这是本主讲人所深信不疑的，但是我们也应该否认：利害关系下的爱心常要受到残酷的考验。公司本身就是一个“利益分配系统”，上司、部下、同僚之间的关系，可能是分享食物的朋友，也可能是争夺食物的敌人，所以我们才会那么在乎别人的想法，我们深恐错估了敌友。


    上班族自有他狡诈之处，他可以向 A 提起 B 的恶行，然后加上一句：“其实 B 的人不错。”又对 B 说 A 的阴谋，并修正道：“A 的本性并不坏。”很少人直截了当地说：“我不喜欢
    A 和 B。”这是一种防御的动作。


    想起这些牵绊，各位上班族是不是不寒而栗了呢？我们难道真的要把半生投在这紧张的气氛中？


    对上班族而言，再没有比聚众饮酒，把共同的敌人贬得一文不值更痛快的事了。“勿议人短”、“爱你的邻人”等教训，交给道德家、基督徒去办可也。在现世这复杂离奇的利害关系网中，不讨厌人又不讨任何人厌，无为而治地度过一生，简直是奢想。


    ## 党同伐异之本


    因此，对那些永远无法了解我们的混蛋，不如就宣战一搏吧！想想看，和混蛋沟通协调要花多少力气？最后自己心里还不痛快。八面玲珑的人没有敌人，但也没有同志，寓言中非禽非兽的蝙蝠想要左右逢源，最后却两头落空，一方水土养一方人，一样米饲百样人，公司又不是一批志趣相投的人所组成的，怎可能没有恩怨？各位上班族可以检讨一下自己的人际关系了，你是不是因为不敢和某人扯破脸而吃不少亏？嫌“扯破脸”太暴力的人，不妨用“以直报怨”自勉，只要你克服了心理障碍，勇于处理混蛋，你就跨出了第一步。


    说得更清楚一点，以上纯是心理建设，各位千万别动声色，打击敌人之前要先争取同志，而和你有共同敌人的人就是同志。换句话说，党同为伐异之本。


    钓鱼要挑有鱼的地方出竿，轰炸要选有房子的地方下弹，有时候敌友藏身之处并非一目了然，我们必须先分析办公室中的人际关系、派系倾轧才行，为了教学方便，我们且把复杂的人事简化成
    A、B、C 的三角或 A、B、C、D 的四角竞争，以下的六大类型中，成员均为圈圈套住，那表示他们同处一利害系统下。


    类型一中的登场人物彼此憎恨（A→B 表示 A 排斥 B），历史悠久的贸易公司常出现本型关系，我们称之为“战国型”。类型二中，A 排斥 B，B 排斥 C，C
    又排斥 A，可称为“循环型”。在以上两型的关系中，A、B、C 均无法争取到同志。


    类型三中，B 是 A、C 共同的敌人，故 A、C 可结为盟友，但是由于 A、B 之间仅有单向的排斥，此结盟不十分强固（故以虚线表示），C 所负的风险比 A
    大，我们称之“不完全结盟型”。以 C 的立场来说，类型四的“完全结盟型”要有利多了，本型中的 B 可说是引起公愤，在保守而消息灵通的社会中，常出现这种情况。


    类型五中，两股势力旗鼓相当，有如美日争霸，各有喽罗，我们可看出它是由两个“完全结盟”交错而成，B 在本型中自然远比在类型四中有力，本型可称为“抗衡型”。类型六则是“循环型”的变形，只因多了一个
    D，A 和 D、B 和 C 都有结盟的可能，理由很简单——每个人都容易对敌人讨厌的人或讨厌敌人的人有好感，有时这些人会提供珍贵的敌情给你，本型可称为“假性循环型”，不可和类型二弄混。


    ### ▽ 人际利害关系六型 ▽


    ![](img/edb37364df251c1123d6acadab5d432a_390_0.png)


    ![](img/edb37364df251c1123d6acadab5d432a_390_1.png)


    ![](img/edb37364df251c1123d6acadab5d432a_390_2.png)


    ![](img/edb37364df251c1123d6acadab5d432a_390_3.png)


    ![](img/edb37364df251c1123d6acadab5d432a_390_4.png)


    ![](img/edb37364df251c1123d6acadab5d432a_390_5.png)


    分析至此，各位上班族可想想自己办公桌旁的人是敌是友，贵单位的人际利害关系图是何神面貌，想清楚后，就大胆地去爱去恨吧！信任你的盟友，打击你的敌人（我们在下一讲会详述），千万要有立场，别当蝙蝠！


    ## 利用共同情绪


    接下来的工作就是如何对待你的同志。


    所谓的同志，对你们的共同的敌人未必有相同的观感。譬如说，各位讨厌敌人的长相（大鼻子、厚嘴唇）以及盛气凌人，各位的某一位同志却讨厌同一敌人的盛气凌人以及鬼聪明，因此使你们同仇敌忾的只是“盛气凌人”那一部分，其他的个别的个人情绪，如果你在这位同志面前一味地攻击敌人的长相，说：“大鼻主贱，厚唇主凶。”你的同志不是不以为然，就是无动于衷，万一他的女友长相雷同，还可能将在无意间损失一名同志。


    请看图示。黑色部分即敌人，左右两圆互为朋友，中央斜线部分是指向敌人的共同情绪，两圆不相交的部分则是不易利用的个人情绪。


    因此，当你的同志不满于敌人的鬼聪明，而你却毫不在意（因为你的花样更多）时，不可让同志察觉这点，总要使他以为他的反感和你的反感完全同感，这是一种夸张共同情绪的技巧，你自己清楚了解共同情绪的面积大小便可以了，别人错估是他自己观察力不足。


    各位聪明的上班族，我要重述一遍先前讲过的话，公司并不是一群有共同理想的人所组成的（当然，草创时的少数几个合伙人可能是），为了生活及成就，你常要耐心和许多混蛋同事共处一室而又难免被另一些人当作混蛋。既然拉不下脸皮认贼作父，不如就敌友分明，以维护自己的利益及信念吧，这事并没有表面看来那么残酷，一方面绝大多数人的利害和你无关，这些点头之交可以冲淡火药味，另一方面，了解并在实行这些缺德行为的人，可能远比你想像的多（他当然不承认）。


    ![](img/edb37364df251c1123d6acadab5d432a_392_0.png)


    总而言之，人际关系不是本讲区区数千字所能摸透的，三个臭皮匠怎么也不是诸葛亮，十个好人未必能凑成一个好群体，化合物的性质绝非其组成元素之总和或平均，这暧昧难解的道理正好给我们缺德上班族以可乘之机。


    最后，本人为各位归纳出六条党同伐异的原则，各位不妨抄在小册子上，随身携带。


    - 一、经济学原则——和上司为敌时，要同时争取到和该上司实力相当或者实力比他强的人为同志。

    - 二、攻守合一原则——不可仅为了讨好同志而排斥他人，也不可仅为了排斥敌人而讨好他人。任何行动必须兼有“党同”和“伐异”两项效果。

    - 三、客观原则——仇恨难免带主观，利用同志之间的共同情绪时，应考虑社会一般的道德观念。

    - 四、俊杰原则——万一敌人势力坚强，在盟军茁壮之前，不可贸然宣战，应施以游击战术。

    - 五、飞鹅扑垒原则——我们不是伪君子或真小人，不能为达到目的就不择手段，但是当敌人先采用卑劣的手段攻击时，应坦然以相同卑劣的行为自卫。

    - 六、升华原则——应努力使同志间的共同情绪升华为较有建设性的人格共鸣。

