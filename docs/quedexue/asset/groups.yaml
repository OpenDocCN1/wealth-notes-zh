    ## 香饵好吃口难开


    大凡钓鱼者，总会先装上香喷喷的诱饵，然后将鱼钩投入水中，才能钓到鱼。鱼之所以上钩，是因为那香饵实在太具诱惑力了。


    这一手段运用到人身上，就是要先设置一些如“香饵”的东西，让人觉得有利可图，欲罢不能，而不知不觉进入你的伏击圈，最后达到利用、控制对方的目的。运用这种计谋，关键在于投放的“饵”确实很香，有一种“挡不住的诱惑”的魅力，从而将对方的胃口吊得高高的，手伸得长长的。当然，也要讲究投放“诱饵”的方式，如果方式笨拙，则容易让对方看出破绽，计谋自然难以得成。


    1990年1月30日《法制日报》刊登过这样一个并非虚构的故事。


    河南有位农民叫王秀云，牵着一头大黄牛前往集市准备卖掉。路上，他拾到一只精致的盒子，顺手装进口袋，找了个僻静角落，想看看盒子里装的是啥东西。他刚从口袋里掏出盒子，只听到一声叫喊：“喂！拾到了我的东西想往哪里跑？”过来一个长有小胡子的人。王秀云问：“这里面装得是啥？说对了就还给你。”小胡子答不上来，要求“见面分一半”。王秀云说：“我拾的，我要一半。”打开盒子一看，只见里面两根金灿灿的金项链，里面还有发票，发票上写着：24K金项链，每根单价1200元，合计2400元。小胡子要分一根，王秀云要多一半。小胡子答应：“给我1000元算啦！”王秀云没有钱，就把一头牛给了小胡子。心想，又捉弄这家伙一下，这牛最多值800元，哼，又白赚了200元。


    事后，经人鉴定，这是两根上面涂有金粉的钢项链，最多值5元钱，王秀云听了这话，恰似五雷轰顶。


    这位王秀云，牵牛去赶集。路上拾到了一个精致的小盒子，他只为拣了便宜，但他哪里知道，这正是行骗人投下的香饵——引他上钩。王秀云在僻静处刚掏出盒子，想不到出现一个小胡子——钓鱼者出现了。这时，如果每人平分一根项链，王秀云也不会上当。可是，具有诱惑力的金项链，哪里会甘心让小胡子分去一半呢？小胡子装作让步，说只要1000元，王无现钱，竟把一头价值800元的大黄牛给了小胡子，还以为又赚了200元，得了便宜。在王秀云看来，从拾到了项链到分钱，步步沾光，而小胡子却步步退让，他哪里知道，这正是骗子步步设的诱饵，正像钓鱼收竿那样，吃了食的鱼儿便无法脱钩了。


    香饵钓鱼计没有国界，中国人能用，老外同样能用，效果都很显著。


    一个德国人梅里特兄弟移居美国后，定居密沙比。他们早起晚归，积攒了一些钱。后来无意中发现密沙比原是一个丰富的铁矿区。兄弟两人严守秘密，并开始大量收购地产，成立了铁矿公司。洛克菲勒早就对该铁矿区垂涎三尺，但由于晚来一步，只能眼睁睁地盯着这块肥肉，等待时机。


    1837年，美国发生了一次经济危机，市面银根告紧，梅里特兄弟陷入了窘境。正在这时，来了一位本地牧师劳埃德先生。梅里特一家人一看令人尊敬的牧师，忙恭恭敬敬地把他请进屋去，待作上宾并聊起家常来。梅里特兄弟从整个国家的经济危机谈到自己的困境，话语中充满了哀伤。劳埃德牧师一听这些，十分热情地说：“你们怎么早不告诉我？我可以助你们一臂之力啊。”


    梅里特兄弟听了大喜，忙问：“牧师有何高见？”


    牧师说：“我有一位大财主朋友，看在我的情面上，他可以借给你们一笔巨款。”


    梅里特兄弟说：“牧师你真是个大好人，真不知怎样感谢你才好。”


    牧师问道：“你们需要多少钱？”


    梅里特说：“42万元。”


    于是牧师就写了封借42万元的介绍信。


    两兄弟问：“利息多少？”


    牧师说：“我怎么能要你们利息呢？这样吧，低利，比银行利率低2厘。”


    两兄弟以为在梦中，呆了。


    牧师让他们拿出笔墨立了一字据：“今有梅里特兄弟借到考尔贷款42万元整，利息3厘，空口无凭，特立此为证。”


    梅里特兄弟念了字据，觉得一切无误，高兴地在字据上签了字。过了不到半年，有一天，劳埃德牧师又来到了梅里特家。


    一进门他就严肃地说：“我的那位朋友是洛克菲勒，他早晨来了一个电报，要求马上索回借款42万元。”


    两兄弟早已把42万元花在矿产上，哪里能拿出这么多钱？两兄弟无可奈何地被逼上了法庭。


    在法庭上，原告律师说：“那借据上写得非常清楚，借的是考尔贷款。”说着。他又引经据典：“考尔贷款是贷款人随时可以索回贷款，故其利低于一般贷款利息。根据美国法律，借款人或者立即还款，或者宣布破产，两者必居其一。”


    梅里特兄弟只好宣布破产，将矿产卖给洛克菲勒，作价52万元。


    洋鬼子劳埃德以投放低利息的42万元作诱饵，钩到了梅里特兄弟的铁矿区这条“大鱼”。


    ## 有福我享，有难你当


    中国人有结拜异姓兄弟的传统。只要情投意和便要义结金兰结拜换帖，有了八拜之交即可为朋友两肋插刀，“有福同享，有难同当”。这一传统大概是受了《三国演义》中刘关张“桃园三结义”的影响。想当年，刘备为了让关羽和张飞辅佐他打天下，与其结为换帖兄弟并发誓“不能同年同月同日生，但愿同年同月同日死”。这种做法对于笼络关张二将为其效力卖命起到了不可估量的作用，从此以后，关羽和张飞便成了刘备的左膀右臂，供其驱使，死而后已。为了一个“义”字，关云长经受住了曹操高官厚禄的诱惑，毅然挂印封金，过五关斩六将千里寻兄。正是有了关张二人的鼎力相助，刘备才得以在屡败之后终能据荆州取西川占汉中与孙吴和曹魏形成鼎足之势，终于成就了帝王之业。


    刘备当了皇帝，关、张二将所得到的不只是名列“五虎上将”的虚名而已。其实，在刘备眼里，关羽和张飞无非是供其利用的鹰犬罢了！若是有朝一日得天下，真能与关张平分吗？可惜关羽和张飞对此至死不悟，特别是关羽临死之前仍感念与兄长的桃园之义并拒绝了孙权高官厚禄的引诱。由此看来，害死关羽的其实并非孙权而是他自己满脑袋的江湖“义气”，一代名将竟落得如此下场，岂不悲哉！


    民国年间，乱世枭雄张作霖的飞黄腾达靠的也是所谓江湖“义气”。他早年结交了一批土匪出身的狐朋狗友，这些人与他臭味相投，患难相交，又都是“绿林兄弟”，其中较有名的有张景惠、汤玉麟、张作相等。为了所谓的哥们义气，这些人出生入死，为张作霖卖命，立下了汗马功劳。


    张作霖统治部下的手段主要靠权术，靠江湖“义气”，靠这种权术使部下服服帖帖，甘愿为他卖命。由于他善于玩弄权术，使他在土匪中有极高的威望，使他成为这帮人中当然的领袖。他用以团结部属的东西是权与钱，他的部下都可得到应有的财富，并随着张作霖的升官而升官，因而他们紧随张作霖，为升官发财而卖命。


    由于哥们“义气”这个东西是对张作霖个人的，因而也就不是最稳定的，当张作霖在时可以一呼百应，说一不二，震慑全军，然而，张作霖死后就必然发生分化。


    与张作霖一样，蒋介石也企图利用江湖义气笼络部下。他早年结交了黄郛、陈其美，后又与李宗仁、张学良结为换帖兄弟。


    蒋介石结拜异姓兄弟，自然有其目的。1926年7月，北伐军攻克长沙，蒋介石与李宗仁秘密结拜为兄弟。什么原因使他们二人情愿结为异姓兄弟呢？除了双方互有好感以外，利益的驱使是其主要原因。蒋介石比李宗仁大4岁，与李相比，蒋经历广，阅历深，素谙权力斗争中纵横捭阖的打拉之法。桂系虽说刚刚崛起，但实力绝不容忽视。同时，北伐前蒋介石在广州与各方关系弄得十分紧张，他虽为国民革命军总司令，但其资历与作风，在其他6个军长中早已引起不满。为确立自己在军界的领袖地位，蒋决心拉住李宗仁。北伐前夕，蒋提议白崇禧担任北伐军行营参谋长这一要职，以此来换取李宗仁的信任。北伐军攻克长沙后，蒋介石的司令部也随之移到长沙。那时，李与蒋的关系比较融洽。一日李蒋闲谈间，蒋介石突然提出要与李宗仁成为换兰拜帖的兄弟。接着蒋打开抽屉，取出一份红纸写的兰谱，请李收下。李先是不肯，并说：“我惭愧得很，实在不敢当。”“你不要客气，你人好，你很能干……”蒋边说边将兰谱塞入李宗仁军服口袋里。李辞出后打开兰谱，见上面除了写有蒋介石的生辰八字外，还有蒋撰写的四句誓词：谊属同志，情比同胞，同心一德，生死系之。几日后，李宗仁将蒋写的四句誓词抄下来，再写上自己的生辰八字，将帖子回送蒋介石。蒋十分愉快地表示，从此两人更加一层情同手足的关系，誓以同生共死，为完成国民革命而奋斗。就这样，李蒋结拜为兄弟了，并由此度过了一段亲密合作的“蜜月期”。可是，数月后当他们发生利益冲突时，蒋介石立刻扯去了同志、兄弟情谊的温纱，兵戎相见反目为仇了。


    除了李宗仁以外，蒋介石结拜的生死弟兄还有冯玉祥、张学良等人。可见，在收买人心、统驭部下方面蒋介石的确煞费苦心。


    ## 用千金做交易


    都说皇帝的女儿不愁嫁，但嫁给何人却是一门学问。嫁给异族首领，叫做“和亲”，是为了羁縻异族，安定边境；嫁给臣下的子弟，又何尝不是为了羁縻大臣、稳定皇权。在官场上，婚姻完全成了一种政治交易，一种权术手段。


    窃国奸雄袁世凯颇精于此道，官、钱、色这三样东西，常被袁世凯用作收买人心的主要手段，而且屡屡奏效。


    袁世凯手下有个叫阮忠枢的人，此人才华出众，是袁世凯的一个机要文书。阮颇有几分古代风流才子怜香惜玉的意味，他嫖妓到了不能自拔的地步。有一次，他爱上了天津名妓小玉，两人山盟海誓，如胶似膝。


    身为军官，阮不敢贸然娶妓。


    阮忠枢不敢隐瞒，他将实情向袁世凯说明，恳请袁大人允其二人成婚。


    袁世凯假装十分生气，他说：


    > “军人应有军人的品德，背父母而婚，是为不孝；娶妓女为妻，更是内辱家门，外辱军荣。”


    阮忠枢一听，十分泄气。


    然而，袁世凯心里另有打算，他先派人到妓院里为小玉赎身，使其成了“良家女子”，再置新房，使阮能名媒正娶。而这一切准备都是背着阮忠枢进行的。


    婚娶之日，袁推说与阮到天津办事，同车前往，马车直奔一深宅大院。阮只见新宅院里悬灯结彩，红烛高照，是结婚的喜庆气氛。不久，佣人簇拥着一位新娘子从里屋走出来，袁世凯非让阮忠枢为新娘揭去盖头纱不可。阮莫名其妙，定神一看，新娘原是自己朝思暮想的小玉，顿时惊喜万分，此刻方知这一切都是袁世凯为自己苦心安排的。阮忠枢的感激之情，无以言表。于是，死心塌地为袁世凯效犬马之劳。


    袁世凯对于儿女们的婚事也大都是从自己的政治利益出发的，当他和所谓知己之交的朋友在私室密谈时，往往一两句话就决定了儿女们的终身大事。他所谓的知己之交中不少是他的部下，彼此之间结为儿女姻亲，显然是有其特殊用意的。为了拉住黎元洪，他为自己的九子克久聘定了黎元洪的女儿。为了平息满清皇族对他的不满情绪，袁世凯在当上大总统后还准备把自己的女儿配给清逊帝溥仪。不仅儿女的婚姻由他一手包办，就连袁家的女家庭教师也成了他笼络部下的工具。袁世凯图谋称帝时，害怕冯国璋不肯支持，便想方设法加以笼络。恰好这时冯国璋的原配夫人去世了，袁世凯便把袁家的家庭教师周砥收为义女，配给冯国璋续弦。周砥字道如，家住天津，曾教过袁世凯几个女儿英文，多年来与袁家关系十分密切。周砥是个老姑娘，年近三十仍未出阁。她曾声明今生不再嫁人，但经不起袁家大小从中撮合，最后还是答应了这门亲事。


    袁世凯写信告知了冯国璋，冯自觉艳福不浅，顿时心花怒放，发誓要“为大总统效犬马之劳”。婚礼由袁世凯一手操办，周砥的妆奁由袁世凯代为置办，还派了一个保姆作为陪嫁的老妈子。婚后，冯国璋异常兴奋，见夫人很能干，又添一层欣慰。日子一长，周砥觉得这位将军不过是一个才疏学浅、气量狭窄的武夫，但事已至此，也只好听天由命“嫁鸡随鸡，嫁狗随狗”了。有了周砥的小心服侍，冯国璋对袁世凯更加效忠。


    有了袁世凯的经验，蒋介石也不免如法炮制。为了笼络爱将陈诚，宋美龄在蒋介石授意下将谭祥收为干女儿并许配给陈诚，这样蒋陈之间又添了一层“翁婿关系”，陈诚对蒋更加忠诚。


    常言道：“英雄难过美人关”。有这些美女吹枕头风，还怕部下不忠诚吗！


    ## 摆出上司的派头


    居高临下，与臣僚保持适当距离，这是掌权者显示其高不可攀的尊严和不可一世的威风的一种重要手段。一般来说，掌权者是不会平易近人的，因为在他们看来那样会失去威严，会使臣下变得放纵，会“蹬着鼻子上脸”，因此，他们要装腔作势，显示出那么一副神圣不可接近的气度，距人于千里之外，仿佛越这样便越有威望，可以给臣下造成一种心理上的压力，使其自觉其渺小，自惭形秽，从而不由自主地对君上畏服。


    明太祖朱元璋出身寒微，做了皇帝后自然少不了有昔日的穷哥们儿到京城找他。这些人满以为朱元璋会念在老朋友的情份上给他们封个一官半职，谁知朱元璋最忌讳别人揭他的老底，以为那样会有损自己的威信，因此，对来访者大都拒而不见。


    有位朱元璋儿时的好友，千里迢迢从老家凤阳赶到南京，几经周折才算进了皇宫。一见面，这位老兄便当着文武百官大叫大嚷起来：“朱老四，你当了皇帝可真威风呀！还认得我吗？当年咱们俩一块光着屁股玩耍，你干了坏事总是让我替你挨打。记得有一次咱俩一块偷豆子吃，背着大人用破瓦罐煮。豆还没煮熟你就先抢起来，结果把瓦罐打烂了，豆子撒了一地。你吃得太急，豆子卡在喉咙里还是我帮你弄出来的。你忘了吗？”


    朱元璋听到这里，再也坐不住了，心想此人太不知趣，居然当着文武百官的面揭我的短处，让我这个当皇帝的脸往哪儿搁。盛怒之下，朱元璋下令把这个穷哥们儿杀了。


    “为尊者讳”，这是官场的一条规矩。一个人，无论他原来的出身多么低贱，有过多么不光彩的经历，一旦当上了大官，爬上了高位，他身上便罩上了灵光，变得神圣起来。往昔那见不得人的一切，要么一笔勾销，永不许再提；要么重新改造，重新解释，赋予新的含义。这位穷哥们哪懂得这一点，自以为与朱元璋有旧交，居然当众揭了皇帝的老底，岂不是自找倒霉吗？


    尉迟敬德是李世民的心腹爱将，曾协助唐太宗东征西讨屡建奇功，但敬德也因此居功自傲，盛气凌人。同僚中有不少人对他不满，就合计告他谋反。


    李世民平时对敬德十分尊重，优礼有加，接到报告后大吃一惊，便将他招至内室当面询问此事。敬德十分委屈地说：“当年，我随陛下征战四方，身经百战，从月光剑影中拣回了这条老命。如今，天下太平享乐之时，我怎会谋反呢？”说着脱下衣服，露出满身累累伤痕。李世民想起往事，很是感动，泪流满面，并用好言好语安慰了他。这样一来，敬德更加有恃无恐，骄横的品性暴露无遗，竟连李世民也不放在眼里了。


    有一次，他和一起饮酒的人争论谁是长者时，一时性起，和身旁的任城王李道宗殴打起来，并打瞎了道宗的一只眼睛。皇上见敬德如此放肆，十分不悦，罢宴而去。


    有人向唐太宗进谏道：“尉迟将军固然是有功之臣，但如今他在陛下面前如此放肆，而陛下对他也过于谦恭，失去了君臣之间应有的礼节，这是很不恰当的！”


    李世民颇有同感，于是传来敬德，直言相告说：“朕要与你同享富贵，兴国立业，而你却居功自傲。难道你不知道古时的韩信、彭越为何被杀的吗？”敬德一听此言，很是震惊，从此狂傲的举止收敛了许多。唐太宗在敬德面前拿出了帝王的派头，变得庄重、威严起来，敬德果然感到敬畏，行为逐渐变得谨慎起来。


    在封建时代，帝王平时深居简出，普通百姓自然难得一见，即便是文武大臣，能接近皇帝者也是寥寥无几。其实，帝王们是在有意营造一种神秘气氛，使臣民莫测高深，对之望而生畏。帝王出行时，往往是前呼后拥，仪卫如林，这并不完全出自安全的需要，最主要的目的还是为了保持他们与臣民的距离，显示自己不可一世的威风。


    ## 名人就是老祖宗


    权威对于任何一个当权者来说都是十分重要的，有了它就可以发号施令，驾驭臣僚。一旦失去了个人权威，其统治地位便很难长期稳固地维持下去。可见，权威具有威慑臣下、令人折服的超凡力量。古往今来，当权者为了取得权威、增加权威不惜人为地去立，去树。虽说这种人为树立的权威不能持久，但在一定时期内所起的作用，却是不可低估的。


    树立权威的方式，可谓多种多样。当权者为了达到某种目的，往往会不择手段。纵观古今官场，扯大旗作虎皮者有之；自我炫耀，欺世盗名者有之；制造舆论，强奸民意者有之；故弄玄虚，深藏不露者有之。总之，各种有助于提高自己威望的手段，无所不用其极。


    为了增强政权和个人的权威性，达到威慑臣僚、统治百姓的目的，当权者往往会极力炫耀自己的与众不同之处，以此来抬高身价，制服对手。


    自我炫耀的方式多种多样。中国人在几千年前就很懂得如何制造和利用“名人效应”，大凡出身名门望族的当权者往往会以显赫的家世相炫耀，中国人自古就有编“家谱”的传统，而且乐此不疲，这大概与此不无关系。这样做无非是想向他人证明自己的贵胄身份，拿祖先吓唬人，拿死人压活人。于是，“冒认”祖宗的事便在历史上屡见不鲜。唐朝天子姓李，于是乎追根溯源竟成了春秋时期著名思想家老子（李耳）的后裔，以至于唐朝初年道教（创始人为老子）大盛。刘备本是一个一文不名的贩夫，发迹后竟也和汉朝宗室攀亲，莫名其妙地成了“刘皇叔”，其实，这个冒牌货充其量也只是祖上姓刘而已。曹操的父亲本是一名宦官的养子，按理说本无可资炫耀的家族史，但当等到曹丕称帝后，便旁征博引得出自己原是古代某宗室贵胄后裔的荒唐结论。这样做，自然是有其不可告人的目的。


    唐朝初年，有个多事的和尚当着唐太宗的面竟不知趣地奢谈唐室宗族乃是陇西李氏，非但与李耳毫无瓜葛，甚至连纯种的汉人也算不上。和尚言之凿凿，唐太宗无可辩驳，盛怒之下竟以杀头相要挟，逼迫和尚改变观点。其实，唐太宗心里很明白，和尚说的并没有错，错就错在他不该当众揭短，皇帝作为一国之君，颜面何在？


    如果实在无法“冒认祖宗”，既非宗室苗裔，也非名门之后，那么就只好攀个名门亲戚，当当乘龙快婿以便抬高身价。


    1927年，蒋介石南京政府正式建立。然而，此时此刻蒋介石在国民党内的地位极不巩固，既无资历又无背景，各派反蒋势力群起而攻之。迫于种种压力，蒋介石只好宣布下野。这次打击使蒋介石清醒地意识到，在中国这样一个社会里，没有靠山和后台是绝对不行的，为了给自己找一个显赫的背景，他决定与宋氏家族政治联姻。宋氏家族是旧中国屈指可数的名门望族之一，在上海和江浙一带颇有声望。另外，宋氏家族与美国企业界过从甚密，有美国做它的后台老板，宋氏家族在中国实业界颇有呼风唤雨的能量。蒋介石看中的正是这一点。当时，宋美龄尚未出阁，不仅长得楚楚动人，令蒋介石神魂颠倒，而且宋美龄的举止言谈也颇有大家闺秀的风范，使蒋羡慕不已。此时宋美龄虽未出嫁，但与男友刘纪文已同居多年并生有一女，对此蒋介石并不计较，因为自己此时已过不惑之年并有一妻两妾。为了攀上这门姻亲，以便通过宋氏家族取得美国的支持，蒋介石煞费苦心，先是狠心与妻妾恩断义绝，随后又东渡日本讨好宋美龄的母亲。最后终于如愿以偿。


    其实，蒋介石与宋家联姻还有一个不便表白的原因。他想通过婚姻这条纽带，与孙中山攀上亲戚。孙中山作为国民党的领袖，在党内国内都有着无与伦比的号召力和影响力。孙中山先生死后，蒋介石背弃革命，但仍以孙中山的继承人自居，以此来增加蒋政权的号召力。然而，国民党内派系林立，蒋本人在国民党内资历甚浅，单凭他空口表白难以服众。若是蒋宋联姻，情况就不同了。孙中山的夫人宋庆龄乃是宋美龄的姐姐，蒋介石娶了宋美龄，他自然就成了孙中山的连襟了。这会在无形中抬高蒋的身价地位。有了这张王牌，谁敢不服呢？


    显然，“名人效应”对树立个人权威的确功不可没。但有

