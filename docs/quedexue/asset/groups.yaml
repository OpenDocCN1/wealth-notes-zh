    封。”


    封官许愿，目的在于让部下为己效力。因此，有些人往往乘机考察一下部属是否对自己忠诚。封建时代“家长式”的统治术，就闹出了不少诸如先打屁股后做官之类的笑话。


    冯玉祥是我国近代著名的爱国将领，但此人行伍出身，长期的军旅生涯使他沾染上了不少旧军队的陈规陋习。冯玉祥长于治军练兵，然而冯玉祥治军一直采用旧式的家长式的治军方法，他治理西北军采用很严厉的手段，不仅要求其高级将领过简朴的生活，甚至高级将领犯错误时，也采用罚跪、打军棍、罚站门岗等形式进行体罚，因此常招致手下将领的不满。可是，冯玉祥毕竟智慧过人，统御部下的才能也是卓越不凡。


    李宗仁在其回忆录中，对冯玉祥的治军有如下生动描述：


    > “冯氏行伍出身，未尝受正式军事教育。其部属也多系行伍出身，纵是高级军官，也每有目不识丁者。所以，冯氏治军，仍一本中国旧军的陈规。部下犯错，纵是高级军官，也当众打军棍，初不稍代。其部将也专以效忠其个人为职志，部队固然是其私产，将校也是其仆奴。军官每有升迁，冯氏常按北方军的陋习，先罚打军棍数千，然后发表升官命令。故其部属如有无故被打军棍者，其同僚必购酒肉，燃爆竹，为渠庆贺，因为打一顿屁股之后，官又升了一级。这种侮辱人性的作风，冯氏行之不以为怪。


    冯玉祥这种驾驭部下的方法，自然是沿袭了封建时代的旧习。但是，提拔部下时对之适当进行敲打也是必要的。一是让他不忘知遇之恩，以后加倍对自己效忠。二是让他不要功高震主，滋长野心。有些人一升官就得意忘形，想翘尾巴，以致滋生篡逆之心，这是当权者所应严加防范的。'
