    # 缺德整人术


    ## 缺德也需一技之长


    平头百姓，要想一步登天，青云直上，位列九公大臣之上，必须有一技之长，如拍马的技术，献媚的技术等，否则那真是癞蛤蟆想吃天鹅肉，痴心妄想。


    此处讲的技术，必须是特殊的技术，这种技术必须接近皇上才能有用武之处，因此技术的研究必须以皇上的喜好为依据，迎合皇上的心理。


    战国时齐国有三个缺德小人，竖刁、易牙、开方，他们除了逢迎献媚，吹捧奉承的共同特点外，还各有不同凡人的技术。


    竖刁此人有侍候人的技术，他侍候桓公时处处留心观察桓公的内心活动，注意熟悉桓公的生活习惯和各种嗜好，事事投其所欲，迎其所欢，满足其所好。使桓公感到竖刁此人使用起来真是得心应手，称心如意，以至于桓公的日常生活中，时时刻刻离不开他。于是，竖刁成为桓公所亲近的人。


    易牙此人有烹调的技术，善制各种美味佳肴。有一次，齐桓公的爱妾——长卫姬得病，久久不愈，不思饮食，易牙发挥自己的特长，为长卫姬精心制作美味食品，和五味以进，加以调整。长卫姬食后精神转好，病也很快痊愈了。


    从此，易牙便获得了长卫姬的宠爱。长卫姬不仅和易牙保持着非常暧昧的关系，而且常在桓公面前赞誉易牙，推荐易牙，猛吹枕头风，易牙通过长卫姬的关系，也获得了桓公的信任。


    易牙为了获得桓公的宠爱，除了通过长卫姬的关系外，还不惜杀害自己的亲生儿子，供桓公作美餐。


    桓公吃了易牙儿子的新鲜蒸肉，不由得认为易牙爱寡人而胜于爱子，忠心可嘉，从此对易牙非常宠爱。


    开方具有吹捧的技术，时时在桓公耳边说些奉承话，使桓公心花怒放。


    开方本是卫国国君的儿子，因齐国进攻卫国，卫懿公让开方带着五车珠宝，献给桓公，请求免罪。


    和议达成，公子开方却不想回卫国了。他看到齐国强盛，即向桓公提出留在齐国。桓公不解其意，他问开方：


    “你是卫侯的长子，按序次你当为世子，为什么要舍弃世子之尊，而甘心屈仕于寡人呢？”


    开方趁机吹捧桓公，他说：


    “君侯是天下贤侯，如果能执鞭随镫，侍候君侯，将感到荣幸之至，这种荣幸，胜过将来自己为君的荣幸！”


    桓公听了这话心中乐滋滋的，这开方舍弃太子之位，屈尊服侍自己，必然出自真心，遂拜开方为大夫之职。


    开方为了进一步讨好桓公，不惜出卖自己的妹妹，他告诉桓公卫懿公的两个女儿很美，齐桓公就派人向卫懿公求婚，卫懿公迫于压力，只得应允，桓公先后娶了卫懿公的两个女儿为妾，长女被称为长姬，少女被称为少卫姬，姊妹双双受宠。从此，开方也和竖刁、易牙一样得到桓公的宠爱。


    竖刁、易牙、开方三人实在有一定的本领，当齐桓公听从客仲的意见，将三人赶出宫后，心中有说不出的难受滋味，他见不着易牙等人的身影，就像被勾了魂魄一样，食无味，夜不安寝，终日闷闷不乐，而无笑容，久而久之就像得了大病一样容颜憔悴，后来不得不把三人重新接回宫中。


    由此看来，缺德之人，除了脸厚心黑外，也确实有些本事。


    细心的人都会发现，中国历史上，靠一技一长跻身权贵之列的，实在是不乏其人。


    清朝的大太监李莲英，可以说是臭名远扬，他是怎样跻身权贵行列的呢？靠的是苦钻梳头技术，赢得了慈禧太后的宠爱。


    李莲英，河间县人。出身贫苦，自幼丧父，曾因私贩硝磺（制火药的主要原料，属违禁品）被关进县城监狱。出狱后，他靠鞣制皮革，修补皮鞋为生，绰号“皮硝李”。


    李莲英的一个同乡名叫沈兰玉，此人在宫当太监发了家，于是李莲英也去北京，托沈兰玉介绍他入宫当太监，此时他已受宫刑，成了阉人。沈兰玉答应找机会介绍他入宫当差。但是，李莲英长得粗丑，年龄又大（超过了16岁），进宫的机会是很小的。李莲英并不死心，还是经常到闶阆房。有一次，听见几个梳头太监唉声叹气地聊天，说是西太后要梳一种十分流行的新巧发髻，前后换了几个梳头的太监给梳，都不“称意”，他们只好天天挨打，连“护身符”都快打烂了……清代宫廷对内监的管理极为严格，稍失职犯过，甚至毫无过失，只因“圣上”或“主子”心情不好，看着不顺眼，动不动就是“板刑”、“杖刑”侍候。板刑是长五尺，宽五分的青毛竹板；杖刑是长五尺，圆五分的实心青竹。行刑的时候，把受刑者投掷在地，使臀部突起，一人按头，两人按手，两人按腿，使之一点也不能躲闪动弹，然后由一人掌刑，一人数数，一个打一个数数。


    被挨打的太监还要一面挨打，一面喊：“饶恕奴才吧，下次不敢了。”要不喊求饶的话，就是顽抗不驯，要加倍重打，直打到你喊求饶的话。慈禧心狠手辣，喜怒无常，责打太监是家常便饭，有时一日之内，她就可以责打上百名太监。她还搞“连坐法”，一个太监犯错，当班的同类太监也要陪着受罚。太监们为了减轻痛苦，当班时都在大腿上绑两块一尺长，五寸宽的牛皮，这两块牛皮被太监们称为“护身符”。


    所谓“言者无心，听者有意。”李莲英一听就想：这可是个难得的机会！他不声不响地走出闼闼房，就往妓院跑。跑去做什么呢？跑去学梳头！因为最会梳妆打扮的能手都在那里呢！李莲英机灵过人，嘴甜手巧，而且这是有关他一生前程的手艺，他能不尽心尽力的学吗？他很快掌握了这门手艺，并请沈兰玉推荐他进宫。梳头房太监总管听说来了一位梳头巧手，会梳时下流行的最新发型，就像得了救星一样高兴。李莲英旗开得胜，第一天值班侍候“晓妆”，就赢得了慈禧的欢心。从此以后，给慈禧梳头就成了他的“专差”，也免去了梳头太监的“杖刑”、“板刑”。以至当他休息时，那些太监们宁愿自掏腰包贿赂他，只求他不要休息，仍负责侍候西太后的“晓妆”、“午妆”。


    李莲英还深入研究慈禧太后的心理，慈禧太后最怕梳头时掉头发，李莲英就一边给慈禧梳头，一边讲笑话或市面上听的轶闻趣事，借此分散慈禧的注意力，而把梳掉的头发，悄悄地装入袖筒之中。这样他梳的头样式又好看，又不掉头发，深受慈禧喜欢。


    就这样，靠此技巧，李莲英当了内务府大总管。


    看过《水浒传》的人都知道，宋朝有个高俅，是无赖出身，也是靠雕虫小技踢球而赢得皇帝宠爱，得以名列权贵。


    小小技术，威力无穷，现实社会此种以技而升的小人并未绝迹。某君不学无术，仅会下象棋，而上司也爱下棋，于是此君与上司成为棋友，得以步步高升；又一君善打麻将，而上司爱好此道，于是二人成了赌友，同台赌博，此君故意让上司赢，讨得上司高兴，在上司的庇护下，贪污公款，吃喝拿占。


    上述二君，亦精通缺德之道也。


    此种卑劣技术，只能用来对付那些昏庸或虽精明但贪婪爱玩的上司，对此种上司使用此法，可谓百发百中。


    ## 以不变应万变


    以不变应万变，并不是消极的等待，而是等待机会，积极进取。如果是消极以不变等待，听天由命，那就不是缺德术了。


    为什么说等呢？众所周知，职位是有限的，比如说正教授职称，有一定的限额，只有空缺时才可以递补上去，这样就必须等某人死掉，一旦出现空缺，想补上去的人很多，此时就要分析对手的情况，采取相应的措施，积极争取，如若没有机会，再等。


    以不变应万变这个缺德术，在封建社会，具有特殊意义，那时可以用钱捐官，但捐的官是空的，只有虚位，不能走马上任，只有在有空缺时才能补上去，要想补上去，又必须走后门找关系，花银子，所以，有的人虽然捐了官，却一辈子也没能上任。


    以不变应万变，本身有很大大学问，若你在上司手下工作，若他得知你在等着他死了顶上去，他一定先把你赶出去。因此，在等的时候，要有耐心，还要有信心，要善于伪装，表面上看自己并没有野心，工作又要勤恳。


    以不变应万变，一般只用于对付有才华，能力强，不易对付的上司，是没有办法的办法。若上司昏庸，根本不用等，应巧用计谋，将他推翻，置之死地即可。若上司有才华，善计谋，切不可急躁，如果鲁莽行事，不免碰个头破血流，粉身碎骨。


    国民党军统局大特务戴笠，他是一个人所共知的杀人不眨眼的刽子手，为人凶狠残暴，下属望而生畏。


    毛人凤与戴笠是小学时很要好的同学，但他在军统中资历较浅，他深知，在戴笠手下工作必须耐心等待，时来运转，才能出人头地。


    只消极等待还不行，又要积极工作，赢得戴笠的赏识，于是毛人凤勤勤恳恳，每天批阅数以百计的公文，同时他又对戴笠表现出绝对的忠诚，以赢得戴笠的信任。


    戴笠看毛人凤很忠诚，是一个没有野心的助手，就把他当作心腹。1942年中美合作所成立后，戴笠把主要精力都放在中美合作所，而军统局的工作交给毛人凤。毛人凤很快在军统局内造成了无形的领导地位，可以和郑介民、唐纵并驾齐驱了。在许多特务的心目中，除了“戴老板”外便是“毛先生”。毛人凤心里清楚，自己到了举足轻重地位，但他的目标不止于此。


    1946年3月，戴笠在戴山毙命，毛人凤终于等到了历史性的时机。但他权衡利弊，自觉力量不足，只有继续等下去。自己若争局长的位子，郑介民、唐纵会联合起来对付自己，结果只有落个身败名裂的下场，若不争局长的位，郑介民昏庸无能，局长的位子必定被唐纵争去，唐纵是老牌特务，日后不易对付，若唐纵上台，自己当局长的美梦就要破灭。


    经过深思熟虑，毛人凤决定先支持郑介民，让郑介民当上局长，然后再搞掉郑介民，这是一个迂回的办法。于是他向蒋介石建议，由郑介民代理军统局长，在毛人凤的帮助下郑介民坐上了局长的交椅。


    正在郑介民心中美滋滋的时候，毛人凤悄悄地向他发起了进攻。


    在郑介民过50岁生日时，毛人凤便指使保密局总务处处长沈醉搞出了一出闹剧。


    郑介民怕招惹是非，不想大张旗鼓地做寿。沈醉知道郑介民一向怕老婆，极力怂恿郑妻非为郑祝寿不可，以便大收寿礼，同时又鼓动特务们都去送厚礼。老奸巨猾的郑介民说服不了老婆，只好在生日的前两天去上海“避寿”。


    在郑介民不在的情况下，沈醉派人把郑家装饰一新，将许多贵重礼品都陈列在寿堂，大摆筵席。正在吃喝热闹之际，沈醉暗中派人把郑介民祝寿的情况告诉那些被冷落的特务家属。于是大批孤儿寡母拥到寿堂，连哭带喊地要饭吃。这时沈醉又装好人，出来解围。


    事后，毛人凤立即把郑介民铺张祝寿的事报告了蒋介石。接着，毛人凤一边买通蒋介石身边的俞济时，不断在蒋介石耳边讲郑介民的坏话，一边收集汇报郑介民结党营私、大肆贪污的材料。郑介民保密局局长的职务终于被毛人凤接任。


    毛人凤此人心狠手辣，他和戴笠一样是个杀人不眨眼的魔王，其心之黑，一点也不亚于戴笠，他不仅对共产党恨之入骨，要斩尽杀绝，甚至杀死了自己的同类。他杀过兄弟周伟龙，杀死过自己一手提拔起来的族侄毛森。1949年国民党从大陆撤退时，他亲手布置了血腥大屠杀，无数优秀的共产党员，牺牲在他的屠刀下。


    毛人凤手段高超，善玩权术，真是一个集缺德大成于一身的人。


    ## 背信弃义


    卖友求荣，或卖国求荣，都要有一定的条件，首先要有买的对象，其次是“友”要有点分量，值几个钱，否则没人买。或不值几个钱，徒背上缺德的名义，得不偿失。


    古往今来，靠背信弃义升官的人不计其数，就近代中国，也能找到几个赫赫有名的人物来。


    东北奉系军阀首领张作霖。出身盗匪，为人凶残，后投靠清军，为了往上爬，他出卖了拜把兄弟杜立三。


    杜立三是辽西一带著名的惯匪，他在奉天各匪帮中是力量最雄厚的一支，也是一个凶悍杀人如麻的枭雄。出身于土匪世家，其父杜宝增，叔父杜宝兴、杜宝善和杜宝旺都是著名的马胡子或坐地分赃的寨主。杜立三17岁时就开始当土匪，后啸聚二三百人，称霸一方。


    杜立三骁勇善战，骑好马，用好枪，每次出击，他骑一匹高头大马飞驰众匪之前，后面紧跟三个贴身护卫，枪法神奇，百发百中，人见人畏，远近地方听到杜立三的名字，无不闻风丧胆。


    清政府对杜立三毫无办法，多次围剿，均被杜立三击败。


    张作霖被收编之前，与杜立三有过一次交锋。张作霖仗着自己人多，想吃掉杜立三的小股匪徒，谁知杜立三带着马队一冲，自己的人就立不住阵脚，只得大败而逃，杜立三骑着快马穷追，从辽阳界一直追到镇安县。


    张作霖被逼无法，只得拿出缺德的本领，请出镇安县的大地主，号称“汤二爷”的讲和，汤二爷与绿林结交很厚，在他的调解下，张作霖与杜立三和解，从此结为“金兰之好”。


    张作霖想消灭杜立三为清政府建功立业，但凭他的武力根本不是杜立三的对手。“好汉”斗智不斗勇，张作霖用花言巧语说动杜立三的堂叔杜泮林，由杜泮林将杜立三骗到新民府招待所，张作霖埋下伏兵，以送客为信号，将杜立三和随从一起拿下。当晚在新民府大营西边，把杜立三和他的两个随从等三人枪决。


    由于张作霖剿匪有功，被清政府授予蓝翎都司，晋升为奉天巡尺前路统辖五营的统领。


    背信弃义的行为，虽然是缺德术中重要的一种方法，但此法使用时很不容易掌握，有些时候，由于选择买主不当，会被人看不起，不被人重用，升不了官，反落个让人唾骂的可冷下场。


    张国焘是一个臭名昭著的人物，他早些年曾追求进步，成为红四方面军的主要领导人，但逐渐对革命失去信心，对中央心怀不满，终于于1938年4月11日逃到武汉，投靠了蒋介石，张国焘满以为会被蒋介石重用，给予封官进爵，谁知蒋介石对他很冷淡。张想办一个刊物，蒋都不予批准，反将他交给戴笠“招待”，戴笠对他也不客气，令特务们像审问罪犯一样，轮番地从张国焘口中索取有关我党我军的情报，及党的地下活动线索。


    后来，张国焘先后到特务训练班讲过课，当过国民党参政员、救济总署江西分署署长。这一职务由于受到江西省政府主席王陵基的冷嘲热讽，多方刁难，到职不满两月就离职到了上海。


    张国焘到上海后，坐了近两年的冷板凳，到1948年6月，他多方筹集，办起了周刊《创进》，从事反共宣传活动。到年底，便举家逃往台湾。


    到了台湾，日子更难过，住了近一年，国民党既未安排他工作，也没问他的生活。最后张国焘在台北市的住房也被国民党“东南军政长官公署”大员所占，无栖身之处。


    1949年冬，张国焘一家到了香港，化名“凯音”参与顾孟余等人的第三势力运动，创立了“民主战斗同盟。”同时创刊了《中国之声》。朝鲜战争爆发后，他孤注一掷，以其仅有的全部卖身价5000美元作押金，在香港倒卖黄金以图厚利，结果因金价下跌而蚀尽老本。


    1956年，我党“八大”召开时，张国焘想回大陆，但他又不肯答复我方提出公开认错这个先决条件。60年代初，接受美国堪萨斯大学之约，用4年时期撰写《我的回忆》，做出他最后一次出卖。后来张国焘的妻子杨子烈也写了一本《往事如烟》的回忆。以后10余年，他多靠此版权维生。


    后来，张国焘移居加拿大，1977年，他患中风，半身瘫痪，申请入了免费的老人病院，1979年12月2日，夜间，张国焘翻身时被子、毛毡掉在地上，叫人无人，自己又动不了，至次日晨冻死。


    他的妻子哀叹说：“我们反共四十年，一生未享到半点幸福……”


    这就是大叛徒张国焘的最后下场。


    我们再看一下另一叛徒的下场。


    1928年6月18日至7月11日，中共“六大”在莫斯科举行。向忠发以湖北省代表的身份出席了大会并被选为主席团成员。7月4日，向忠发向大会作了关于工人运动的报告。19日至20日的六届中央委员会第一次会议上又被选为中央政治局委员、政治局常委、中央党委主席，向忠发成为党的第一号领导人。


    1931年4月，党中央情报保卫机关的总负责人顾顺章在汉口被捕叛变，给当时在上海的党中央各机关和中央领导同志的安全造成了极大的威胁。1931年6月21日向忠发去看望杨秀贞，第二天早晨，向忠发准备离开，当他去附近一家汽车行叫车时，认识他的车行会计为图一笔赏金，去特务机关告发了他。向忠发遂被捕。


    向忠发被捕后，党中央准备组织力量进行营救。但很快就得到消息说，向忠发已经叛变了。他叛变后，首先供出了陈琮英的住址，致使陈琮英与杨秀贞被捕。之后，敌人又根据向忠发的招供，破坏了我党中央机要处，逮捕了工作人员张越霞、张纪恩等人。同时，特务还在向忠发的引带下，搜查了周恩来、瞿秋白等同志的住处，幸好他们已经撤离。在审讯陈琮英的法庭上，向忠发还亲自出面对质，并对陈说：“你不要编口供了，有什么就讲吧。我们是什么人，他们都知道了。”


    6月23日，向忠发被引进到淞沪警备司令部。警备司令熊式辉立即电告在庐山的蒋介石，说抓到了中共的总书记。上海的敌人原来想利用向忠发的叛变，一举搞垮我党中央，但由于周恩来等人及时采取了措施，他们的企图未能得逞。所以敌人对这个叛徒已不太感兴趣了。


    正在这时，他们接到了蒋介石下达的“就地枪决”的命令，于是，于6月24日将向忠发处决了。这个叛徒在临死前还跪在地上向敌人求饶，由此看来，此人真是“缺德”得到家了。


    ## 凶：缺德者的不变定律


    缺德者说：“只要能达到我的目的，他人卖儿卖妇，都不必顾忌，但有一层应当注意，凶字上面定要蒙上一层仁义道德。”


    缺德之人，有的表面上很慈善，而内心却像蝎子一样毒狠，凶残无比，有的干脆表里如一，从脸上到骨子里都渗透一个“凶”字。


    唐朝武则天时大兴诬告之风，索元礼以善审诬而升官至推事，他审讯囚犯时，制作了一种“铁笼头”的刑具，紧箍犯人的头，还加上楔子塞紧，有不少人看到这刑具就违心地屈招，有的刚烈之士，死不承认，被整得头骨开裂，脑髓流满地。他还设计了“凤晒翅”、“猕猴钻火”等刑法，“凤晒翅”是用椽子锁住犯人的手足加以扭转，同时劈砍，直到骨头破碎。又把囚犯悬吊在屋梁下，用悬石下坠敲击他的头。此人真是凶残无比。


    武则天时的瀛州刺史独孤庄也残酷暴虐。一天他抓到一个窃贼，窃贼本已招供。独孤庄又喊道：“把我制作的刑具拿出来。”这个刑具是一个铁钩，一丈多长，非常锐利，有绳索挂在树上。独孤庄对窃贼说道：“你没有听说过‘好汉钩下死’吗？”就下令把他的面颊钩上，再派壮士拉曳钩上的绳索，把面颊从头上钩下来了。独孤庄非常得意，他问司法参军：“这个办法与什么相似？”答称：“用‘吊民伐罪’来比拟，可以说是十分相称的！”独孤庄纵声大笑。


    凶残的独孤庄常常以此取乐。


    武则天时，还有两位以凶残而升官的酷吏，一个是来俊臣，一个是周兴。


    周兴任刑部侍郎，审问犯人，手段凶残狠毒，善于研究刑具，刑法规定以外的痛苦手段，他没有不采用的，当时的人用“牛头阿婆”作为他的别号。


    后来周兴因害人太多，民愤极大，武则天决定抛弃他，令来俊臣逮捕和审讯周兴谋反。


    来俊臣心想周兴是办案的老手，一定不会老实招供，于是设下一谋，请周兴饮酒。


    饮酒之间，来俊臣装作请教周兴道：“囚犯十分狡猾，大多不肯认罪，你有什么办法？”


    周兴说：“这很容易，拿一口大瓮来，用炭火在它的四周烘烤，把囚犯放在瓮中，看他招不招！”


    来俊臣就令人抬来大瓮，用炭火在它四周围烤，起身对周兴说：“现有圣上批准审讯老兄的文书，请您进入这个瓮吧。”周兴惶恐不住地求饶，随即完全服罪。


    缺德之人对付缺德之人总有办法。


    北齐后主是个残忍无比的暴君，高绰为了讨得他的欢心，就献上了一个娱乐的方法。于是北齐后主令人把一斗蝎子放进洗澡的浴缸里，把人脱光衣服倒放在浴缸中，人在里面哀声惨叫，后主非常高兴，高绰因而得宠，被封为大将军。


    缺德之人，对于阻挡自己升迁的一切人，无论是父母、兄妹、亲朋好友，全不顾其死活，为了权力，不顾一切，无情无义，无君无父。

