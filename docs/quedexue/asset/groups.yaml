    ## 有孔必钻，无孔也要钻


    李宗吾说：“这贡字是借用的，四川的俗语，其意义等于钻营的钻字，‘钻进钻出’，可以说‘贡进贡出’。求官要钻营，这是众人知道的，但是定义很不容易下，有人说‘贡字的定义，是有孔必钻。’我说：‘这错了！只说对一半，有孔才钻，无孔者无奈之何？’我下的定义是：‘有孔必钻，无孔也要钻。有孔者扩而大之，无孔者，取出钻子，新开一孔。’”


    按李宗吾所说，这“钻进钻出”实属不易，掌握此术，一要脑袋尖，眼光利，脑袋尖可以钻孔，眼光利可以找孔；二要胆子大，不怕吃苦。有些时候碰到硬东西，不易钻进去，死命往里钻，不免头痛，有些时候，头虽然钻过去了，卡在脖子上，进不来，也要受罪。


    明朝太监焦芳，为了求官，苦读诗文，终于在天顺八年中了进士，进了翰林院。当时翰林院都是饱学之士，只有焦芳不学无术，从未赋一诗缀一文，并且凶狠无赖。他是怎样入翰林院的呢？原来他有个同乡李贤是大学士，焦芳与李贤攀同乡关系，“出入其门，为之厮役同列”，靠李贤的引见，进入了翰林院。


    - 这就是见孔就钻。


    焦芳此人，遵循的信条就是：“有奶便是娘”，在翰林院期间，时时窥视，寻找钻营的机会，一有于己有利的机会，便立即改换门庭，他看到吏部尚书尹旻权势日盛，焦芳立即投附于尹旻门下，为其效犬马之劳，但好景不长，尹旻因儿子“窃弄父权，大开幸路，纳贿如市”而被罢职，焦芳因与尹旻关系密切，也被赶出了翰林院。降为桂阳州（今湖南桂阳）同知。


    这是焦芳在投机钻营中第一次摔跟斗。好比钻营不当，卡住了脖子。


    焦芳被贬，日夜梦想东山再起，靠着钻营手法，他又找到了机会，弘治八年，曾出翰林院的李杰又入翰林院，焦芳得知，从南京日夜赶赴北京，援引李杰之例，又进了翰林院。


    焦芳进了翰林院，脑袋削得尖尖的，硬是又钻出一个孔来。明孝宗死后，武宗即位。武宗是明代最昏庸腐败的皇帝之一，他整天沉溺声色犬马之中，宠信阉臣，挥霍无度。弄得国家入不敷出，财政告急，大臣们劝皇上节俭，焦芳得知这一消息，认为是向武宗献媚表忠，立功晋升的良机，故意慷慨激昂地陈说：“庶民尚须用度，况县官耶！谚云‘无钱捡故纸’。今天下逋租匿税何限，不是检索，而但云损上何也？”说得武宗正中下怀，非常高兴，说：“焦芳可大用也。”正德元年四月，吏部尚书马文升离位，焦芳当上了吏部尚书。


    武宗年轻贪玩，太监刘瑾执掌朝政，权力很大，焦芳积极投靠刘瑾，充当走卒。正德元年十月朝中大臣弹劾刘瑾，武宗决定处置刘瑾，焦芳以为立功的机会到了，立即向刘瑾告密，刘瑾夜见武宗，痛哭流涕，致使武宗改变主意，第二天早朝，忠臣有的被罢官削职，有的被逮捕，刘瑾被任命“入掌司礼监，兼提督团营。”焦芳也因告密有功，而升为文渊阁大学士，掌管内阁事务。自此以后，刘瑾与焦芳相互勾结，排斥异己，荼毒缙绅，干尽坏事。


    求官之路千万条，走通与否全靠钻劲，钻得巧，钻得妙就能显赫一时，位居人臣。


    明朝太监魏忠贤是历史上数一数二的大奸臣，但他出身贫寒，本人又好逸恶劳，酗酒、聚赌，无所不好，是一个市井无赖。由此看来实是求官无“孔”，但魏忠贤为了日后富贵，就自己阉了自己，入宫当了太监，这就是无孔硬钻出一孔。


    ## 送礼送到心坎上


    送礼，即是送东西，分大小二种。大送，把银元钞票一包包地拿去送，小送，如春茶、火肘，及请吃馆子之类。所送的人，分两种：一是操有生杀予夺之大权者；二是虽未掌大权，而能予我以助力者。


    这一个送字，很有学问，送得好，送得巧，很不容易做到。


    人们送礼时有一个习惯性的心理，自己认为好的往往也认为受礼者喜爱，人的情性不同，自己喜爱的别人不一定喜爱。有的人认为送钱好，这要看你送给谁，送多少钱；有的人认为送东西好，无论送什么都必须从实际出发，从受礼对象的心理特点出发，有针对性地送礼。


    清朝乾隆年间，出了大奸臣和珅，和珅受乾隆宠爱，掌握朝中实权。


    乾隆48年，和珅升官至吏部尚书，协助办大学士。在查案办案的过程中，和珅收受的贿赂不计其数。


    有一年陕西抚台派员押送20万银来到和珅的府邸。和珅府上的内监问道：“是哪一档货色？”护送人回答：“足色纹银。”内监连看都不看一眼，说道：“像这样一些粗货往哪里放！”只好命人收在外库。和珅府上听差的都不愿意收银子这样的粗货，因为嫌它太占地面，没处存放。他们只愿收那些价值千金的珍珠。


    有些抚台知道和珅喜爱珍宝的贪婪特点，就搜罗奇异珍宝，献给和珅，以致皇帝库里有的珍宝他有，皇帝库里没有的，他家库里也有。


    有一次，和孝公主的异母兄弟七阿哥，不慎打破了一个碧玉盘，怕父皇怪罪，急得没法，来请和珅帮忙，和珅开始不管，后来七阿哥送了他一串正宗珠朝珠，和珅才把家藏的一个拿出来给他，让他换上。


    和珅是一个十分聪明的人，对送礼的艺术研究得很深，如果他给皇上送礼送什么呢？金银财宝，都不缺，简直没办法送礼。但和珅仍能曲径通幽，找出门路。


    十公主是乾隆最小的女儿，后来被封为和孝公主。乾隆非常疼爱他这个小女儿，他常说：“我这小女儿长得很像我，一定有福气。”还常常和这个小女儿开玩笑地说：“你可惜不是个男孩，要是男孩的话，我一定立你为太子。”十公主性格刚毅，不像一般的女孩子。她有些力气，据说十多岁就能弯十石硬弓，她也和父皇撒娇地说：“女孩儿又怎么样，我非要学个男孩儿的样不可。”小的时候，她常常女扮男装，跟着父皇打猎。乾隆微服私访时，她也扮成男孩跟着去。有和珅跟随时，她竟称和珅为“丈人”。乾隆对他这个小女儿特别喜欢，她提出的要求，乾隆百依百顺，她说的话，乾隆听来句句顺耳。


    和珅为了讨好乾隆，就特别想法讨好这位十公主。


    有一次，乾隆去圆明园游玩，和珅随驾，十公主也女扮男装一起前往。圆明园建造得十分华丽，有“万园之园”的称号，圆明园福海之东有同乐园，皇帝每年赐大臣在这里观剧。乾隆年间，每到新年，园中设有一条买卖街，这条街上，凡古玩古衣，茶馆酒肆，一切应用之物，应有尽有。这些走买坐卖的，都是那些专门为宫里办事的皇商经营。和珅跟随乾隆和十公主来到买卖街，走到一家店铺门前，见有一件大红呢夹衣挂在那里，十公主看了，微露喜欢之色。十公主脸上这细微的变化，一般人不会去注意，即使注意，也不一定看得出来。可和珅却极善于察颜观色，而且一看就能猜出人的心理活动。这时他看在眼里，想在心里，转眼之间，就去以二十八金的高价把那件衣服买了下来，进献给公主。


    和珅知道，博得十公主的欢心，也就是博得乾隆的欢心。


    和珅还用了许多小恩小惠，贿赂了在乾隆身边的一些太监。太监虽没有什么地位，但他们天天在宫中进进出出。他们的无意间的几句话，有时在皇帝和皇后面前会起很大的作用，心眼极多的和珅深谙此道。


    和珅花钱不多，迂回地给乾隆送了礼物，这就是送礼给“未操用舍之权，而能予我以助力者。”


    某君欲求助于一位官员，多次求见被拒于门外，彩电、冰箱、现金此官员均不收，可谓廉洁，实在是毫无办法。


    但这位官员有一娇小玲珑的妻子，此女子酷爱丹青，特别喜欢齐白石的“虾图”，某君打听到此事后，设法求购了一幅齐白石真迹，呈献于官员之妻，官之妻十分高兴，爱不释手，竟自称不枉来人世一场，于是官之妻求官，官爱其妻，某君目的达到。


    ## 帮助是为了整治


    如果有一个人突然要帮助你，而这个人又是你平时不太尊敬的人，这时你就要想一想，他为什么要突然帮助你，他的目的是什么，如果按他说的去做，会不会有危险。


    旧官场中，大臣之间是尔虞我诈，勾心斗角，互相欺骗，今日你整我，明日我整你，反来复去。而那些能左右逢源，投其所好，工于心计的高手是战无不胜，而那些书读得多，虽考了个头名状元，但迂腐僵化，免不了被动挨打，时时上当。如若缺德之人碰上了缺德之人，这才是“棋逢对手，将遇良材”，双方绞尽脑汁，斗智斗勇，好一场恶战，最后，还是看谁的手段高超以决胜负。


    清朝时太监李莲英受慈禧太后的宠爱，权倾朝野，人人望而生畏，人称“九千岁”，此人狐假虎威，老谋深算，心狠手辣，睚眦必报，可以算作大清王朝的缺德者之一。


    还有一人，掌管总理衙门，卖国求荣，步秦桧、贾似道的后尘，不可一世，飞扬跋扈，趾高气扬的人，此人就是李鸿章。


    李鸿章春风得意，有点对太监李莲英不敬，有意无意间得罪了李莲英。


    李莲英心想：这小子不知天高地厚，得给他点颜色看看，让他老实点。


    有一天，李莲英笑嘻嘻同李鸿章说：


    “老佛爷近年有意静居，想把清漪园修缮一番，以便颐养天年。苦的是筹款无术，时常焦躁。李伯爷是朝廷重臣，若能体仰上意，玉成此事，以慰太后，以宽圣心，当立下不世之功。”


    李鸿章听到有这样巴结慈禧太后的好机会，岂肯轻易放过？当即满口应承，并马上献计献策，同李莲英商量：以办新式海军为名，责成各疆吏岁拨定款，就中提取六七成作为造园经费。


    李莲英听了大喜，拍手称善。兴办新式海军，振兴国防，是谁也不会反对的堂而皇之的理由。谁敢不出钱？出师有名，筹款有术，那造园的经费还用愁吗？李莲英笑容可掬，着实奉承了李鸿章一番。看到李鸿章意得志满的样子，他憋在心里已久的那口闷气，就像快要爆炸的瓦斯一样，闹得他浑身火烧火燎，表面声色不动，心中却有主意，心想，也让你见识见识我的手段！他谦恭有礼地对李鸿章说：“既是筹款有术，就请李伯爷辛苦一趟，入园内踏勘一回，看看哪里该拆该建，做到心中有数。老佛爷要是查问起来，我们也好回话。”


    李鸿章看他想的周到，说得在理，当然点头赞成，哪会想到这不男不女的家伙在巧施计谋呢！


    到了约定的日子，李莲英借口有事不能奉陪，派了个伶俐的太监领着李鸿章，园前园后，园左园右，着着实实转悠了一整天。


    事后不久，李莲英故意拣了个光绪皇帝肝火旺的时候，像闲嗑牙似的告诉光绪：


    “听说李中堂那天带着个小谙达，在清漪园里足足逛了一天，山上水上玩得好不痛快……”


    光绪自4岁进宫称帝，从小慑于西太后的淫威，始终当着一个傀儡儿角色的皇帝，凡事都要看慈禧的脸色，自然有一肚子说不清道不明的委屈，他最忌讳的就是别人不尊重他的皇权帝位。听说权倾当朝的李鸿章竟敢大摇大摆的在御苑禁地游逛，顿时大怒。认为这是“大不敬”，是对皇权皇位的公然藐视和冒犯！光绪一怒之下，不问青红皂白，立即下诏“申饬”，将李鸿章“交部议处”。


    所谓奉旨申饬，就是由皇帝、太后或皇后派一名亲信太监，捧着“圣旨”去指着某人的鼻子，当众数落臭骂一顿。而被骂的人，既不能申辩，也不能回骂，还要伏在地上谢恩，因为那骂他的人代表着皇帝、皇太后或皇后呀！要是那太监学着皇帝皇后的口气骂，可能还能忍受点，无奈那些太监总是用最不堪入耳的粗野的话，浑卷滥骂一气。骂到最后还要跺着脚大喝一声“混账王八蛋滚下去！”这“申饬”虽不伤皮肉，却是极使人难堪的侮辱性惩罚，因受辱不过，一气成病，甚至一怒而归天的都大有人在。


    光绪年间，邮传部刚刚成立，委任张百熙为尚书，唐绍仪为付郎，张百熙向皇上谢恩后，就去拜见唐绍仪，说了很多自谦话，唐绍仪用广东方言回答他，张百熙听不明白，彼此发生了误会，第二天，唐绍仪回拜张百熙，请张百熙面奏皇上，调任一些官员充实邮传部，并交了一份调任人员名单，张百熙答应了。等上头宣布结果，唐绍仪提交的名单没有一个人被选中，唐绍仪十分气愤。于是两人关系恶化，都写了奏折揭发对方，奏折都留在皇帝那里没有指示。他们两人又都请了病假，不到部里办公，被御史弹劾，两人都受到圣旨的指责，着太监“申饬”。唐绍仪把400两纹银送给了太监，而张百熙不知道。


    等到传张百熙跪着听宣读圣旨后，太监跺着脚大骂：“混账王八蛋滚下去。”张百熙磕头后站起来，面色苍白。再要唐绍仪听宣读圣旨时，却没有像张百熙那样挨骂。张百熙更加气愤，回家后就生了病，没有多久，因忧伤而死去了。后来，还有一位任大学堂监督、编修的刘延琛被“申饬”，他无法筹措400两银子行贿，又不能忍受这样的辱骂，十分为难，只好托人向太监说情，交了200两银子，到时，太监在斥责时，只骂了“混账，下去。”这真是“半价半骂”。


    李鸿章被御批“申饬”，他自然懂得其中奥妙，立即送上银子，没有当众受辱。


    李莲英看到李鸿章使钱告饶，也出了心中那口恶气，乐得“和气生财”。


    李鸿章呢，自然很快悟出吃亏的原委，从此以后便对这位“九千岁”刮目相看，敬礼如仪，竟同对慈禧一样恭敬。


    二李均是缺德高手，权势又都重，但李莲英计高一筹，终于把李鸿章整得服服帖帖。


    ## 离间对手和上级关系，借上司之手将其整倒


    春秋战国时期，与孙武齐名的军事家吴起，在魏国为魏武侯效劳，镇守河西，立了大功，为人很正直廉洁，治军有方。


    魏相田文死，公孙得以继任为相，公孙无论从才能和功劳上都不及吴起，怕吴起取代自己的地位，非常忧虑，便与手下谋士商量除掉吴起，一个谋士献计说：“这很容易。”


    “有什么好主意？”公孙问。


    “你应当对武侯说：‘吴起是一个很有才华的人，应让他长期为魏国效力，但魏国小，而秦国强大，这样，吴起就可能背魏而去秦，实在令人担心。’


    武侯一定会问你有什么主意可以知道他是否忠心？


    你就向武侯献计说：‘令他娶公主（武侯的女儿），如果他答应，他就是愿意长期在魏国效力，如果不答应，就会背叛魏。’


    如果大王同意这样做，你就让尊夫人（公孙的妻子，也是武侯的女儿）在府上摆出公主高傲的神态，故做看不起你，让吴起看，吴起的自尊心很强，心想娶了公主一定也会受气，这样他就会拒绝娶武侯的女儿。”


    公孙照计而行，果然，吴起看到公孙叔窝窝囊囊的受公主的气，而又不敢反抗，一国宰相尚且受气，何况自己呢？就拒绝娶武侯的女儿。


    从此，武侯疏远了吴起，他再也不相信吴起了。不久，吴起发觉处境不妙，三十六计，走为上策，逃离魏国，去了楚国。


    采用离间的方法，公孙叔除去了自己强大竞争对手，他的相位就安定了，但国家却失去了一位栋梁之材。


    公孙叔的谋臣很善于分析形势，他了解吴起高傲、自负的个性，由此设下计谋，断绝了他与武侯的关系，如果吴起是一个性格软弱，善于拍马屁的人，他答应娶武侯的女儿，这样吴起的地位不是削弱了，而是加强了。因此，掌握对手的心理特点是非常重要的，否则，无论多么好的谋计，也会归于失败。像上面这个计谋失败了，公孙叔的地位就很危险，就可能被吴起所取代，吴起是一个心黑的人，他曾杀死自己的妻子以求拜将，但他的脸皮不够厚，所以他归于失败。


    战国时，齐国有一名大将叫田忌，他英勇善战，威震四方，是当时著名的将军。


    齐国还有一位文官，也是当时的贤相，他名叫邹忌，本来一文一武，国家昌盛，但邹忌与田忌却很不和睦，互相忌恨。


    有个叫公孙的对邹忌说：“您为何不帮齐王谋划攻打魏国呢？打赢了，是您的计谋，您就有了功劳；若打败了，田忌就会受到处罚，即使在战场上没有死，也不能与您争权了，您还可以以战败为借口杀他的头呢。”


    邹忌认为这个主意不错，于是动员齐王派田忌攻打魏国。


    田忌三战三胜，邹忌告诉公孙，问公孙该怎么办。


    公孙就派人拿着200两黄金到大街上去卜卦，说：“我是田忌家的人，我们三战三胜，威震天下，打算自立为王，请卜吉凶如何？”求卦的人走后，公孙又派人抓了算卦先生，在齐王面前验证了供词。于是田忌就被吓跑了。


    公孙的权谋抓住了一个普遍存在的君主心理。功高震主，手下的权力太大就会威胁自己的安全，手下的功劳太高，威望就要超过自己，这时就要削弱他们的权力，或干脆将他们杀掉，正是由于这个原因，公孙取得了成功。


    刘邦取得天下后，张良、萧何、韩信三人的功劳最大，张良辞官修仙去了，萧何故意霸占别人的财产，以降低自己的威望，只有英勇善战而不懂政治的韩信，舍不得权力，看不清刘邦的黑心肠，而自取灭亡。


    ## 挑起对手之间的矛盾，然后一一击破


    在政治斗争中，自己的敌手不一定只有一个，若敌手们联合起来，对自己就很不利，要打倒他们，最好的办法是挑起他们之间的矛盾，使他们互相残杀，然后一一击破。


    使用这种方法，自己既可以置身于外，眼看着对手之间残害，而无动于衷，也可以加入他们的争斗，帮助其中弱的一方，将强的一方击败，然后再回过头来击败弱的一方。国民党的保密局长毛人凤，在戴笠死后，为了争到局长的位置，就联合弱的郑介民击倒强大的唐纵，让郑介民当局长，然后再打倒郑介民，最后终于谋到了局长的位子。


    唐玄宗中的奸相李林甫就很善于利用这种方法，他总是能将敌手打倒，牢牢地坐在宰相的位子上，一直当了9年。


    户部尚书裴宽，为唐玄宗器重，李林甫恐他入相，内心十分忌恨。刑部尚书裴敦复因“平贼有功”受到皇上的表彰，李林甫也忌恨之。正好二人之间有矛盾，李林甫便从中挑拨，使二人矛盾扩大。他又指点裴敦复去买通杨贵妃姐姐，在唐玄宗前面说裴宽的坏话，致使裴宽被贬为睢阳太守。接着，天宝四年，李林甫又用明升暗降的方法，借口裴敦复有战功，奏请皇上让他充任岭南五府经略使。裴敦复稍稍迟疑，没有及时赴任，则被李林甫反奏一状，以“逗留京师”为借口，贬为淄川太守。就这样，不到一年的时间，李林甫整倒朝中的两位大员，阻止了他们入相的机会，减少了对自已权力的威胁。


    春秋时，齐国有田开疆、古冶子、公孙捷三勇士，这三人功劳都大，受齐景公的宠爱。这三人又结成异姓兄弟，自诩为“齐国三杰”，他们倚仗自己能力过人，十分傲慢，目下无人，对齐景公构成很大的威胁。晏子请求除掉他们，景公认为毫无办法，派人去刺杀根本不可能，他们武艺高强，晏子就想了一个计策。


    有一天，鲁国君主昭公来访，景公设宴相待。三位武士，挂剑而立。席间，晏子说：“御国的桃子已熟，摘一些来，给两位君主献上。”


    景公派人去摘，晏子亲自前往，以示庄重。一会儿，桃子摘回来了，金盘上只有六个桃子。两位国王各拿了一个吃起来。景公一时高兴对鲁国臣叔孙诺说：“此桃是人间仙物，得之不易，叔孙大夫，贤名著于四方，请吃一枚吧！”


    叔孙诺连忙跪下，说：“我哪能比得上贵国的贤相呢，仙桃应赐于相国。”


    景公便说：“既然叔孙大夫推让相国，可各赐酒一杯，桃一枚。”二人跪而领之，谢恩而起。


    这样一来，吃桃子就成了至高无上的荣誉了。


    盘子里只剩下两枚桃子了，晏子请示景公后传谕两旁文武，要各人自报功劳，凭功赐桃。


    公孙捷首先仗剑而立，开口说道：“我随主公在桐山打猎，力诛猛虎，这功劳怎么样？”


    晏子说：“擎天保驾，功劳很大，可赐酒一杯，食桃一枚。”公孙捷领桃后十分高兴。


    古冶子愤然站起，说：“打虎算得了什么？我曾随主公，”

