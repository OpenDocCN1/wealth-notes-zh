    瞎子装作十分操心的样子，费了很大的劲为她的儿子推算，最后他迟疑了很久，吞吞吐吐地好像有什么话不便讲出来。婆婆觉得不妙，就坚持让瞎子说出来，瞎子这才说道：“此人十日以内，前世的冤家来找他寻命，必然暴死，实在没有办法救他。可惜你们婆媳二人，这般命苦，命里如此，也无可奈何。”瞎子十分惋惜地走了。


