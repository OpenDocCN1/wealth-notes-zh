    # # 开讲辞


    各位优秀的上班族，欢迎参加本讲座，今天有这么多人共聚一堂，身为主办者的我不胜喜悦之意。


    只是“优秀”二字并不是用来形容那种日夜不忘公司大恩、本分稳重得不敢擅自拉屎放屁、凡事公司至上、生平只爱读书及听音乐、乏味而不显眼的人。这点请各位记住。


    我们生活在这个社会，个人凭才能争取财富，国家几乎不加干涉，放任自由竞争。外表上，公司像一道保证上班族的防波堤，可是我们除了化身为公司的一颗细胞，要对抗同业之外，仍得在堤内与同僚、部下、上司竞争，甚至要和一些模糊的评分标准比赛。“胜者王，败者寇”，当你在这些竞争中被打击落荒而逃时，前途便化为乌有。


    我们常听说一些在校学习十分好的学生，踏入社会后却一蹶不振，其原因，即在于校园内外的价值观不同。本讲座无意否定学校师长的说法，充其量只是在他们所谓的“优秀”中，补充一些竞争活力必备的项目，如强悍、大胆等。我们认为厚脸皮能适度地使坏的人（其实不是人，是上班族），才有资格参加本讲座，欠缺这些条件的人，又说错了，是上班族，不是人）上课必毫无所获。以下详述各位学员应具备的条件。


    +   A. 于社会大众所谓的“公司”的组织体中，提供精神方面为主的劳力，以换取每周或每月的报酬，并赖以维生。

    B. 不满于公司对自己的评价及待遇。'
  md: '

    在黄河的波涛之中，斩妖龟之头，救主之功怎么样？”


    晏子说：“在波涛汹涌之中，如不是勇士斩断妖龟之头，船一翻，一船人都很危险呢，这真是盖世之功，应当食桃饮酒。”


    说罢立即赏桃、赐酒。


    只见田开疆掀起衣服，大步走上来，说：“我奉命征伐徐国，斩杀敌将，俘敌五百多人，使徐国君主恐惧，纳款而降，威震邻邦，为主公奠定了盟主之位，这功劳怎么样？”


    晏子说：“您的功劳，比刚才二位的确大十倍也不止，但金桃已赏赐完了，请饮酒一杯，等待明年吧！”


    齐景公也说：“卿的功劳最大，但话说得太迟了。”


    田开疆不由一阵怒气升上心头，他按剑大声说：“斩龟打虎，算得了什么！我跋涉千里，屡战屡功，反而不能食桃，受辱于两国君臣之间，为万代耻笑，有何面目立于朝廷之上呢？”说完挥剑自刎而死。


    公孙捷一看大惊，也拔剑说：“我们功微而食桃，君功大，反不能食。取桃不让，是不廉，看到别人死而不跟从，是不勇。”说完也挥剑自刎而死。


    古冶子气愤而大呼说：“我三人义同骨肉，誓同生死，二人已亡，我苟活于世，于心何安？”说完也挥剑自刎而死。


    片刻之间，三勇士俱死朝堂。


    这场争斗，晏子充分利用了三人争功自傲，讲究信义的心理特点，故意用两个桃挑起他们的矛盾，害死了“齐国三杰”。


    自古以来，可以说晏子的手段是天下第一。


    ## 正面进攻，不如暗中下手


    明白了自己要竞争的对手，就要想办法将他整倒，在对方的势力很大，自己力量不足时，就不要正面与他争斗，而要暗中下手，这就如《孙子兵法》上说的“出其不意”，要从敌人没有防备，意想不到的地方进攻他。这样，你就一定能取得胜利。


    武林高手决斗，讲究的是光明正大，而黑道上的不义之徒，从不讲什么仁义、道德，他们用的都是毒辣手段，或放暗器，或挖陷阱，在兵器上抹毒药等，这样一来，往往是武艺高强的正人君子打不过卑劣的小人。这些黑道上的不义之徒，才是缺德的祖宗。


    在政治斗争的大舞台上，奸佞权贵们很善于使用暗箭伤人的绝活，他们一个个心狠手辣，狡猾多端，而品行端正的正人君子则往往讲什么仁义道德，结果无不被人暗算，或被置于死地，或不被重用。


    在战场上，敌我双方进行激烈的战斗，勇敢的将军冲入敌阵与敌人做殊死搏斗，正当他集中全力对付来自正面的敌人时，他的战友——来自内部的仇敌却向他开弓射箭，在混乱中谁也不知道他死于自己的战友之手，甚至连自己也不知中了谁射的箭，看，这一谋术是多么狠毒啊！


    《左传·隐公十一年》记载：

    一次，郑庄公在宫前检阅部队，一列列兵车浩浩荡荡，年轻的将军公孙子都精神振奋，年老的将军颍叔考虎气仍在，在分派兵车的问题上，二人为了争夺兵车，吵了起来，颍叔考经验丰富，拉起兵车，飞驰而走，公孙子都年轻气傲，哪里肯让，拔起长戟，飞奔追去，哪里能追得上，颍叔考已远远奔去。于是公孙子都怀恨在心。


    这一年七月，郑庄公大兵伐许，一路势如破竹，很快逼近许国国都。攻城的时候，颍叔考奋勇当先，高举大旗，爬上城头，公孙子都看到颍叔考将要抢去头功，心中更是妒忌，便抽出箭来，对准颍叔考就是一箭，颍叔考哪里会想到背后来箭，只见他一个跟头摔了下来。


    另一位大将瑕叔盈还以为颍叔考是中了敌人的箭，他连忙上前，拾起大旗，指挥士兵，继续战斗，终于把城攻破，郑军全部进城，许国国君许庄公逃到卫国，郑国取得胜利。


    像公孙子都这样的人，趁人不备，偷偷摸摸地暗放冷箭，就叫“暗箭伤人”。


    暗箭伤人，在政治斗争的舞台上，也广为奸佞、权臣所用。


    唐代大诗人李白，人称诗仙，其诗浪漫多彩，脍炙人口。李白被招入京，以其才华受到唐玄宗的赞扬，而太监高力士却十分妒忌，于是二人展开了一场尖锐的斗争。


