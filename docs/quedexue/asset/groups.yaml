    按照这些条件，显然只有胡适才够资格。让胡适当总统是美国人的意思，蒋介石提出这四个条件，也只是敷衍美国人。中华民国总統的头衔，他是不肯让给他人的。蒋介石讲话后，即宣布暂时休会，下午再开。


