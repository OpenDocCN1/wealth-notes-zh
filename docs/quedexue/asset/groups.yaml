    统统关进狱中，共三百多人。其中刑部主事何钺、礼部进士陆伸、顺天推官周臣等三人，因受暑过重而死于狱中，后查出写匿名揭帖的是某个太监，才把大臣放出监狱。


    刘瑾用假传帝旨的手段，对正直的朝廷大臣或诛杀，或下狱，或罢官，统统排斥掉。剩下的，不是刘瑾安插的亲信，就是仰承刘瑾鼻息办事的阿谀之辈，刘瑾完全操纵了内阁，各部尚书均系刘瑾党羽，内阁首辅焦芳甚至亲自到刘瑾家中去处理政事。刘瑾还操纵密探组织（东厂、西厂和内行厂），刺探情报，一经发觉有不满他的人，就加以陷害。明朝的宦官专政，在明武宗时达到了高峰。


    假托王命来行骗，绝不限于官场，商场有，学术界有，就是那些江湖骗子也深谙此术。新中国成立之后，曾发生过一宗假托王命，诈取巨款的大案。


    1960年3月18日下午5时50分，一位穿戴讲究神态庄重的干部，彬彬有礼地走进中国人民银行总行收发室，递交了一封急信。信封是用浅棕色牛皮纸制成的，落款的红色铅字是：“中华人民共和国国务院”，上用毛笔书写着：“速送（限下午五点四十分前送到）中国人民银行行长亲启。”信的内容是：


