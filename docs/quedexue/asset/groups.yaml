    这时，使者在外厅一遍声地催促扶苏和蒙恬赶快自尽。扶苏为人忠厚，便对蒙恬道：“父亲命令儿子死，君王命令臣下死，还有什么必要再请示呢？”于是，当即举剑自刎。蒙恬仍然坚持自己的想法，不肯自杀。使者便把他交给地方官吏关押在阳周城（今陕西子攻西北）的监狱里面。


    使者赶回车驾队伍汇报后，胡亥、李斯、赵高非常高兴，便急急忙忙赶回了咸阳，宣布秦始皇已经逝世的消息，并宣布胡亥继位为二世皇帝。这一切都按照赵高的预谋实现了。


    秦二世继位后，马上任命赵高为郎中令。原来，秦朝的中枢官制是三公九卿制。最重要的是三公，三公包括丞相（文官之长）、太尉（武官之长）和御史大夫（主管监察）。三公之下设九卿，分别掌管各个办事的职能机构，郎中令为九卿之一，其主要职责是守卫宫殿门户，下属有大夫、郎、谒者等官。这样，赵高便由一个宫廷内掌管皇帝御用车辆的官官，一跃而成为位列九卿的秦朝政府重要官员。由于胡亥的年纪轻、阅历浅，且对赵高有一种感恩戴德的思想，所以对赵极为宠信；赵高又常常能够为他出谋划策，因此，赵高的权力在某种程度上甚至超过了三公，成为可以操纵皇帝、左右朝廷政事的决策人物。


    在封建官场，要做成一件事情，手段权术是少不得的。当客观条件不允许你堂堂正正达到目的时，手段权术就显得相当重要了。田乞、赵高废旧立新的做法从宗法伦理来讲是说缺德不仁，受到卫道者的指斥，但后来者却又常常演义着这样的故事。'
