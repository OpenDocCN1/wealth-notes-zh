    ## 跳槽万岁论：把握一生成功的转机


    ### 准勤务理论


    公司是上班族的衣食父母，代表公司的主管有时比你的亲爹娘更有威严。一个下巴抬得半天高的大头目，大声地命令女职员泡茶、男职员去巷口替他买烟，可是当他回到家以后，可能要苦苦哀求自己的孩子别再头抹浪子膏，四处鬼混了。


    各位上班族不要笑，你们自己呢？周日在家中，令尊令堂喊你干活，你却大义凛然，充耳不闻，或者阳奉阴违，趁早鞋底抹油——溜之大吉。在公司的时候，上司才伸手入怀取烟，你的右手立刻在自己腰际一抹，当地晃了一下，打火机上跳着机灵的小火焰。


    综合以上的大观，我们可知：尽管上班族张牙舞爪，扬言无恶不作，他在内心仍对公司敬畏有加。每当忍无可忍，他就以“天下无不是的公司”自勉，最后证明了人类的耐性远非他所能想像。


    本人到今讲得极顺口，但是各位当真了吗？英勇的缺德战士们，公司毕竟不是父母，亲爹娘也不可能是圣人，当工作为你带来不胜负荷的痛苦时，请悍然跳槽、改行、倒戈及反正吧！跳、改、倒、反这套形似“文化大革命”用语的动作的确令人不安，可是，再保守的上班族都曾认真考虑过离职他就。


    “男怕入错行，女怕嫁错郎”，以上两大悲剧有甚于“艾迪帕斯王”与“窦娥冤”。所谓“乐以忘忧”、“乐此不疲”，上班族若能喜爱自己的工作，根本就不会计较心理及生理上的忧愤。反之，为了“有奶便是娘”的生活，就非常度日如年，水深火热了。


    上班族的私生活有限，一般只有平日的睡前 4 小时（假设 7 点到家，11 点上床）以及周六下午到周日晚上。以上“非勤务时间”姑以 OFF 代表。众所周知的“勤务时间”则以
    ON 代表。各位可以发现，OFF 之中有不少不甚利用的零碎时间，上班族必须在这些时间内为工作而待命或善后，我们称之“准勤务时间”，即所谓 SEMI ON。举例来说，各位在周日晚忽然想起第二天要早起上班，不由皱眉嘟嘴，心肌紧张，这就是一种
    SEMI ON。


    根据以上的“准勤务理论”，我们可以比较快乐的上班族 A 和痛苦的上班族 B。


    ![](img/edb37364df251c1123d6acadab5d432a_411_0.png)


    ### 准勤务时间与工作压力


    如图所示，A 的 ON 及 OFF 泾渭分明，工作压力不致于以 SEMI ON 的方式破坏他的私生活。A 的心中有如装了“心情频道”，上班时道貌岸然，一下班立刻欢天喜地，展臂投入私生活。他在休闲时不是从不想起工作，但那完全出于主动，许多妙点子因而诞生。


    B 的 24 小时则布满阴影，ON 时黑鸦鸦，OFF 时鸦鸦黑，工作中的痛苦成了被取缔的流动摊贩，偏偏 B 又经不起失败，结局只好变成一个精神官能症患者。


    总之，A 和 B 的生活有如天壤之别，有心跳槽的 B 不要再犹豫了。


    ### 半空半满的水


    谈到燃起工作热情，近来很流行一种说法，本人无以名之，姑且称它作“半杯水精神胜利法”。


    宣传本方法的人常用半杯水或半碗味噌汤作比喻，但是重点不在什么容器装了什么饮料。简单说，桌上放了半杯水，悲观的人看了说：“唉，半杯是空的，只剩半杯水。”乐观的人说：“半杯是满的，还有半杯水。”不同人对同一现象会有不同的反应。


    “半杯水”的寓言到此为止并不算错。错的是说故事的人要大家效法乐观者的看法。要是“资本主义企业分配体制下受薪阶级之精神结构的异化”那么好解决，本主讲人早就回家研究茶杯去了，何苦办这讲座，引起天怒人怨？当上班族追问他生而为人的价值何何时在，我们何忍教他“保持微笑”、“说话肯定而宏亮”、“随时给自己一个小奖励”等小秘诀？


    “半杯水精神胜利法”的优点在于“尽其在我”，职权再小的上班族，总有控制自己脸部肌肉的自由，他可以用张飞的洪亮声音讲话，也有权在桌玻璃板下压一张“半杯水是满的”当座右铭（又称智慧小语、人生金言、小故事大道理、隽永短文等）。问题是，我们这些老奸巨猾的上班族又何尝不知道“乐观”的重要，男士更是了解军中“从外在影响内在”的管理方法。


    我们偶尔可以用“半杯水思考法”安慰自己，但是千万不要放弃怀疑的机会——是不是你的部门、你的公司出了毛病？


    本人当然不主张“半杯水是空的”，这只有在跟以乐观为己任的人抬杠时有用，用完就要丢掉。最好的公式是：了解杯子的容量以及水的容积。一公升的杯子装了 500CC
    的水——这不是一目了然吗？


    客观地评估过杯子（公司）和水（上班族的自我）之后，各位就可自行判断要不要弃旧迎新，等决定不跳槽了，再来凝视那半满的水也不迟。


    ### 可怕的从一而终


    厌勤的上班族可分为四种类型：


    - 一、不得不然型——明知工作不符合自己的个性，却找不到更好的，只好一头栽进现在的岗位。

    - 二、幻灭型——抱着希望上贼船。

    - 三、综合型——不满于人际关系、待遇、公司政策、部门的气氛、上司的怪癖等，久而久之，郁结心中。

    - 四、忍辱负重 型——为了更崇高的理想，不惜屈就现职。


    本型人物与“不得不煞型”形似神异，差别在于有无长远的打算。


    第三种类型之所以厌恶自己的工作，主要是受到外在因素干扰，与工作的本质无关，只要外在因素改变，他会重新投入。第四种类型则是另有钟情之处，全靠本讲所提到的“心情频道”安抚自己，一旦他的理想落空，很有可能爱上目前的工作，举例来说，有许多文人放弃作家之梦后，反成了杰出的编辑或评论家。


    本讲乃为第一、二种类型人物而设，这些人早已心死，非跳槽不足以重建生趣，因为他的心死了，恐惧和自卫的本能更容易控制他，一拂袖而去，这是一个悲哀的恶性循环。


    选错行、进错公司、跟错老板都是生命的大缺憾，可是应届毕业生以及好些刚退伍的士兵、少尉，又花了多大精力在研究就业上？他们只知道问：“公司字号响亮吗？薪水高不高？”根本不知道自己想接受、能接受何种挑战。话说回来，我们的社会及家庭并不容许他们精挑细选，与其说他们踏入社会，不如说社会的巨足“踏入”他们的心灵，一切只好遵循“尝试、错误”法则，反正真相会在一二年内揭开。


    当你揭开真象，见到一张梅花小二兼备角时，你的问题不仅是不爱自己的工作，你会发现自己跟同仁格格不入，其凄惨有如阿母斯壮回错了星球。以当初谋职之草率，大多数人的第一个工作很可能并不理想，至少不是他最能发挥自己本领的地方，所以本人常看不起从一而终的日本上班族，毕生努力于打破“终身雇用”的神话。


    上班族的弱点就是“谨慎而不能断”，思考的目的不是采取行动时，久而久之，思考成了一种架空问题的自慰，你会以痛苦为乐，自以为是韩信，夸大外界的丑恶。


    ### 挥出青龙偃月刀


    在本人晓以大利（别替自己制造 SEMI ON）、驳斥邪说（别去喝那半杯水），又对从一而终者嗤之以鼻后，各位是否已有了跳槽的念头？容本人欺身上来，补上一刀。


    按月发下薪水，除了作为当月的报酬，也预期员工在相当时日之内回报以忠诚，在这根深蒂固的默契下，跳槽似乎成了一种背叛。本人要再提醒各位一次，有计划的跳槽等于回到自己安身立命的岗位，这叫“弃暗投明”。


    要知道，公司评价员工的标准在于的他是否能适应公司的企业文化、他到底能为公司营利提供多少贡献。一个好儿子（女儿）、好爸爸（妈妈）、好配偶、好公民、好邻居，很可能同时是一个坏员工，这不是一个上班族自己能决定的。于是乎，刁滑古怪的罪犯能组成一批英勇的敢死队，龙被虾戏、虎被犬欺的例子更是屡见不鲜。


    如果你在公司不受器重，必不必埋怨或泄气，上司用主观的标准衡量你，自然有他肯关心及不肯关心之处。你辛苦地吸收各种一时不用的知识、持之以恒地每天锻炼身体、对不幸的人付出爱心——又何尝是要表演给上司看的呢？和公司相处就像成熟的男女谈恋爱一样，重点在经验、成就的共享，不在第三者的艳羡，把持对方和被对方把持，都没什么好骄傲的，所谓“好聚好散”。中国的关公过五关斩六将，弃曹操而投刘备，史称忠义。其实曹刘二人哪一个才是明主并不重要，重要的是关公自己决定他想加入的阵营，本人敬重他有如敬重日本的宫本武藏。各位上班族，请立刻考虑跳槽吧，千万不要放过改变一生、反败为胜的机会。


    ## 如何对付上司：勇于面对你的主管


    ### 问题主管六大类型


    和上司相处而谈到“对付”两字，本人之恶毒早已昭同日月。最令人向往的上司，应该有如师长一般，他用超人一等的能力及人格领导我们，使我们服气而快乐地在春风细雨之中工作，既有绩效，又能在学习中成长。


    师长般的上司，并不是我们上班族空想而来（虽然它常以空想终），事实上是太多上司存心要手下拿他当师长看。当你提出一个意见时，他含笑摇头望你，仿佛不忍苛责你的幼稚，有时他明明很欣赏一份企划案，却咬唇沉思一会儿才勉强说：“你的案子有点主观，不过不妨试一下。”再看他们在人前人后的架式，以及高人一等的自尊心以及处理不完的工作，无不令人觉得深不可测，仰之弥高，望之弥坚，一下子在前面，忽然又跑到你背后。


    重点在于他们喜欢这样。


    但是当我们承认他们是权威，以权威的标准要求他们时，事情就变得有些古怪。当年的恩师有如宝藏，你只要勤于挖掘，一定受益良多，如今你的上司却像报废的矿坑，沟通特别困难，忌讳多于烧饼上的芝麻，最后还叫人愤然大怒，泄气无比。


    理想的公司体制下，决策者和执行者的意见能上上下下畅行无阻，当某部门的成员不了解自己的任务，或某主管不了解下一级部门成员的想法时，该部门主管就有问题了。这种问题主管可分六种类型：


    - 一、阴晴不定型——情绪容易波动，手下疲于了解他的想法。

    - 二、争功诿过型——出毛病叫手下负责，有了成绩却又归功于己。

    - 三、迟钝冷感型——言语乏味、面目呆板，手下对他敬而远之。

    - 四、冷血独裁型——比“争功诿过”型人物更聪明，待有利用价值者如上宾，待无利用价值者如废纸。

    - 五、特立独行型——不喜欢和其他部门主管相处，使自己部门的成员在公司抬不起头。

    - 六、舍生取义型——不向现实低头，老是领导众人赴汤蹈火，成仁取义。


    其实，问题主管何止以上六种类型？本人还特地保留了七种类型不说出来，以维持世界和平。所幸各位天资过人，缺德成性，不难举一反三，浮想联翩。


    ### 对付上司六大方法


    对付问题主管时，各位要有大敌临头的感觉。害怕上司是一种根深蒂固的本能，在展示权威的仪式、措词、手势、服装下，要能冷静地出手，才能成功，因此欺君罔上而良心不安固然不可，一心以为自己理直气壮是要为民除害也必败无疑。


    总之，要把上司当做有弱点、但隐藏得很好的对手。


    以下本人提供几个方法供各位参考。


    **第一法——对拼命三郎型上司火上加油**


    三郎既已决心拼命，身为部下的我们实在阻挡不了，为今之计只有推他一把，叫他快些挤掉老命。当他偶而请病假或事假，不要忘了打电话到他家说：“哎呀，科长不在，我们都慌了手脚。”最好是能使他重新披挂上阵，大耗元气，否则也要在他心中留些疙瘩，让他不能安心度假养病。


    一旦三郎病重住院，记得每周去看他一次，所有的主管都视自己的部门为地盘，久未坐镇，就会担心权势流失，针对这种心理，你时而说：“科长放心休养，科里有我们在，一切没问题。”时而说：“总经理最近常跟某科科长去打高尔夫球。”又说：“有好几个客户来公司找你，听说你病了他们都很遗憾。”如此这般，三郎死期不远。


    在日本曾有公司主管在出院前夕自杀的例子，原因就在他原本以为自己是公司的支柱，不料公司在他病时仍蓬勃发展，他的自尊心全垮，终于走上绝路。本人怀疑他就是被手下施以火上加油之法害死的。


    **第二法——抓住机会为上司打抱不平**


    时常叹口气说：“像某某主任那么有实力的人，待在这公司太委屈他了，不但浪费了人才，也是国家社会的损失。唉，可惜呀可惜。”这些表演不必当着上司的面做，只要一个月做十次，早晚上司会从侧面听到，这样效果更好。


    三人成虎，一人说三次也照样成虎，总有一天上司会认真地想：“果真如此？”由于“自己是不是天才”是个很愉快的话题，一开头他就会欲罢不能，想久了更是觉得理所当然，人类总免不了自我膨胀的毛病。


    其实，所谓“实力”只是“应付公司要求的能力”，各行各业需要不同的人才，甚至同一家公司在草创、成长、发展各期的人力规划都不相同。一个当上主管的人却很容易以为：“我的地位是靠能力赢来的。”这话不完全对，他低估了环境、机遇等因素。一旦他萌发了“我在其他公司一定更有发展”的信心，他会做出许多冒险的动作来。


    **第三法——大量提供民间流行的管理书籍给上司**


    对上班族而言，似最有用却无用的是那些以畅销为目的的管理书籍了。这些大作常标榜简明易懂，事实上却为了简明，不惜以风趣、新奇、诉诸权威来代替复杂的分析，甫出版时，广告自吹自擂，仿佛它要一语道破时代的盲点，不料同类书籍一本接一本地出现，仿佛武侠小说中的武林第一高手是被更高的高手取代，叫人不知道看哪一个马头才好。还不如本缺德讲座，一开始就自认缺德，以免大家误以为又有千钧巨著问世。


    但是，花钱买这些书的上班族却大有人在，原因何在？在于害怕自己跟不上潮流，不知道别人在想些什么（其实应该先搞清楚自己在想些什么）。


    基于以上心理，各位要常常推荐“好书”给上司说：“这本书的观念不错。”或说：“这本书很有启发性。”引得他去“水平思考 90 年代的的市场进化原则”。


    当你的上司脑袋塞满了空洞文字，又耽心部下读书时间比他多时，他的压力可想而知。


    **第四法——用问句和上司交谈**


    上司之所以是上司，在于他常要站在高位下判断，因此我们要大量提供各种问题让他烦心，再琐碎的小事都采取恭候圣裁的策略。譬如说：


    “您要搭计程车去还是坐公交车？”“中午要在轻松餐厅吃台菜，还是舒服饭馆吃火锅？”


    当然，婆婆妈妈久了，难免惹火对方，上司会说：“随便。”这时你就要不愠不火地说：“火锅的确不错，现煮现吃，滋味好，可是偶而吃一点道地的地方小菜也无妨，萝卜干炒蛋您喜欢吗？花生炒小鱼干也是一大美味。对了，或许我们去吃日本料理？”


    在任何人耳中，你的话都是关怀备至，可是由于上司是一种对问句敏感的动物，这种说话方式保证能大耗他的元气。不知大家同意不同意？嗯？啊？呃？咦？


    **第五法——把上司捧成明星人物**


    捧上司要注意不要在部门内捧，否则会引起同事的反感。同时，非必要也当避免直接向上司拍马屁，马屁必须转变，才能存其声而去其臭。


    把上司捧成明星人物的目的在于激发和他同级的主管嫉妒心，同时也激发上司和上司的戒心。试想，当大家到酒廊、饭店吃喝作乐时，娇滴滴的副理说：“咦？你们公司的某某科长怎么没来？”随后又到地下舞厅去，老板又问：“咦？你们的某某科长怎么没来？”有心人听在耳中，心中滋味并不好受。


    最好是想法子替上司安排接受记者访问的机会。一般人总觉得上电视、上报的是伟大人物，对于那些自己早怀戒心的人，大家更咬定他上了电视、上了报就是自认伟大。顺着这逻辑往下推，大家自然会合力推出许多证据，证明你的上司“骄傲自大、鼻孔朝天”，到时他就四面树敌，想不垮台也难了。


    捧上司的另一个目的是：防止别人向上司说你的坏话。


    **第六法——告诉别人你的上司是个吝啬鬼**


    当我们说别人坏话时，听者常紧张起来，可是当我们说某某主管是一个小气鬼时，大家却能笑着接受。也许大家早在心中认定有权有势的人常很吝啬（民间故事里有太多一毛不拔的员外），也有可能“吝啬”是最温和的攻击字眼。


    因此，各位在和上司共餐、共搭计程车时，要抢先付钱，事后再以一副委屈的表情向同事说：“那家伙真大牌，又爱贪小便宜，每次都慢吞吞地掏腰包，要不然就是拿百元大钞付小帐，我只好说，我有零钱。”大家听了哈哈大笑之后，便对这位上司产生恶感，你就成功了。日后别人又听到这位主管的其他恶评，也不会感到奇怪。


    其实，对付主管何止以上六法？本人还特地保留了七法不说出来，以维护宇宙和平。所幸各位天资过人，缺德成性，不难举六反七，闻六知十三。


    ### 爱护你的上司


    上班族之所以畏上司如畏虎，有时并不全是上司张牙舞爪的缘故，前述对付上司六大方法中已指出居上位者若干难为处，有时上司的确有他不得不道貌岸然的苦衷，换句话说，上司对你造成的压力有时来自你本人。


    理由何在？在于你的不安全感。不安全感的主要成分有二：一是单调的生活，一是受制于公司的经济来源。


    解决的方法在于发展多角化经营，不要使薪水成为唯一的活命钱，如此既可分担风险，又能丰富自己的人生经验，各位上班族应该争先恐后朝这方向发展才是。只是一般公司不大喜欢自己的员工在外兼差，甚至赚到大于薪水的外快，各位应该小心保密。


    当你的不安全感一扫而空时，就可以平心静气看待上司，不必气急败坏地用上“对付”两字，偶而心情特别好，甚至可以原谅上司犯的错误，摇头笑道：“主啊，原谅他吧，他不知道他在做什么。”本人也建议你准备一本簿子，定时对各级主管作考绩评定，当主管记满三大过时，你就拍屁股走路，让公司去痛失良才吧。


    当然，考绩簿要收好，不要破坏别人名誉，真正有信心的上班族要多爱护自己的上司才是。


    ## 如何升官：迈向金字塔顶端


    ### 从敬畏到被敬畏


    在前一讲中，我们谈到“敬畏”上司不如“对付”上司，“对付”上司又不如“爱护”上司。各位充满野心的上班族，在夜阑人静之际，你是不是曾告诉自己，“爱护”上司又不如让自己当一个令人“敬畏”的上司呢？


    以上的绕口令绝没有讽刺各位的意思，毋宁说，有为青少年均应向往出人头地（或者说念念不忘升官吧），可是，在你仍是基层职员的此时，请参考以下的名词解释：


    - ●基层职员——轻松的小角色。

    - ●组长——腰酸背痛的工人。

    - ●科长——腰酸背痛、心情紧张的小头目。

    - ●代理主任——腰酸背痛、心情紧张、开销奇大的大头目。

    - ●主任——腰酸背痛、心情紧张、开销奇大、无法跟妻子儿女共进晚餐的演员。

    - ●经理——“腰酸背痛……无法跟妻子儿女共进晚餐”的高血压兼糖尿病患者。

    - ●总经理——从棺材中伸出右手签字的伟人。


    各位不要以为我是吃不到葡萄就说葡萄酸的人，如果大官真的那么可怜，他们为何不顺着原路退下来，当一个轻松的小角色呢？你们或许要问。


    其实原因很简单，你升官之后，妻子在同学会上有面子，故乡的老村长还有机会接受访问，那些势利的昆弟妻嫂都侧目不敢仰视，你请大家吃饭，大家都低头嚼菜，仰头作无辜之微笑。此一美景，怎不令人心动？有了虚荣心之后，还有前辈、上司为你打气（换句话说，有了浮士德之后，还要有魔鬼才成），从你谋职接受面谈开始，你听到的就是公司未来的前途如何如何之光明，一个年轻人只要虚心努力就可以步步高升，仿佛我们的社会大众正咬着右手的四块指甲，期待你拍马而上。


    办公室也贴满了标语——


    努力为成功之本。灭私奉公，放眼未来。公司的远景全在各位的双肩之上。胜利是无从取代的。


    总之，公司抓牢上班族的方法有三：一是提供希望，二是博取信任。偏偏公司常在前一个方法上大作文章，因为后一个方法的成本比较高，前一个方法又特别适用于热情害羞的年轻人。


    于是，你把理想放在事业上，把事业建立在升官上，为了升官不惜权宜地暂缓追求理想，最后发现自己不配谈理想，终于一心升官，用虚荣心填补空虚。


    ### 大家来爬金字塔


    再说一次，本人无意讽刺什么，站在企业的人事金字塔前，不爬它一番也是挺可惜的。所以，让我们言归正传，各位

