    ## 美妇以黑对黑报奸污之仇


    清朝时，湖北有一个人，娶了一个很美丽的妻子，天生丽质，艳丽可人。他的邻居是一个寡妇，这个寡妇不甘寂寞，与外村的一个少年通奸。一日，少年到寡妇家，偶然看见隔壁的美丽妇人，一时心猿意马。于是给寡妇很多钱财，让寡妇想办法，设计谋诱奸美妇。寡妇说：“她刚刚新婚，夫妻和睦，是良家妇女，不能强逼，也不能利诱，她的丈夫虽然外出教书，但有一老婆婆相伴，实在无计可施。”


    那少年不能得到美妇，心中十分难受。一日，用重金购得闷香，这种香，人闻了就会手足无力，不能反抗。


    少年对寡妇说：“我已有了办法，你只要把她引到你家来，我就有办法。”寡妇说：“这事得慢慢地来！”


    自此，寡妇让少年购买精美的食物，时时到美妇家中与新妇相谈，不久，二人关系十分密切。美妇知道寡妇家没有男子，也以礼相答，到寡妇家中玩耍。


    一日，美妇再往寡妇家去，寡妇留美妇吃饭，进入卧室。这时，少年早已埋伏室中，点燃闷香。美妇觉得浑身发软，就伏在座位上。少年突然钻出来，将美妇抱到床上。寡妇避了出去。


    美妇手足麻木，口不能言，但心里十分清楚，只能任其所为，只是流泪而已。少年许之许多衣服美饰，美妇更加愤怒，泪如泉涌。少年将美妇强奸之后，扬长而去。美妇醒来，不见寡妇，将室中的东西狠砸一通，回到家中，郁郁不欢，得了重病。


    ## 缺德整人术


    美妇的父亲很善于计谋，是一个经常替人打官司的讼师。他听说女儿病了，就前去探望，询问病因。美妇为了得到计谋复仇，就把实情告诉了父亲。其父责怪她不应随便到别人家中，决定以毒攻毒，以诡计报阴谋。随后，写了一个计划，放在美妇的枕头下面，说：“你看这个计划可行，就把寡妇骗来，我让你的两个哥哥帮助你。”


    父亲回去后，美妇拿出父亲的信来看，看了信中的方法，十分高兴，病很快就好了。一天，美妇修饰打扮一番，派人将寡妇找来。美妇故意装作十分亲切的样子，留寡妇晚上同宿，悄悄地对寡妇说：“前日之事，为什么不先与我商量呢？这就是我恨你的原因。但事情已经如此，就是黄河水，也难洗掉我的不贞，我的丈夫久久不归，我一个人实在是太寂寞。今天叫你来是要问你，那少年曾许我衣饰，为什么又食言了呢？”


    寡妇只当美妇是动了心，就说：“这个少年虽然富足，但实有情义，他的确羡慕娘子，只是没有办法，才出此下策。不是他负心于你，只是怕你生气，我与你引见怎么样？”


    美妇说：“这太好了，只是要防外人耳目，要来一定等夜深人静的时候，这才保险。”


    二人约定时期，寡妇告诉少年，少年非常高兴。急忙购买了漂亮的衣服和珍贵的珠子。到了约定之日，少年先到寡妇家，到了四更时分，少年往美妇家，轻轻叩门，门打开，美妇把他引入室内，少年急不可耐，就要淫乱。美妇说：“既然来了，为什么这样急，我们二人同饮三杯酒以助兴。”桌子上早摆了美酒，美妇倒酒献上，少年视而不饮，于是美妇坐在少年怀中，以嘴喂少年，少年心情迷乱，把持不住，一口一口的喝了下去，突然见两个壮士操着大刀冲了进来，少年狂奔而出，被绊绳绊倒，美妇举着蜡烛出来，壮士将少年捆着手足，把他的头发割下，然后放他出去。


    壮士带着头发，来到寡妇门前，轻轻叩门。寡妇误以为是那少年回来，悄声说道：“夜已深了，正好安睡，为何又草草返回呀？想必是败阵而逃吧！”


    门刚打开，壮士即以矛刺其胸，寡妇当即毙命，然后，将头发缠在妇女手上。回到美妇房中，壮士说：“大事已经完成，可以向父亲报告了！”这两个壮士是美妇的哥哥，他们预设了绊绳，美妇喂少年的酒，其中加了哑药。


    少年逃回去后，口不能言。次日，亭长见寡妇被杀死于门前，报告县官，县官派人查验，看到凶刀插心，寡妇手握发辫，判定是强奸不从而杀人。捕快密访打探，发现少年头发被人拽去，少年口哑不能自辩，按大清法律，处以死刑。


    ## 少女用“缺德”法报父母之仇


    清朝，有一个恶霸横行乡里，为富不仁，他将一家夫妇二人害死，霸占了这对夫妇的小女儿。


    这个少女非常聪明，操持饮食服用之类十分得手，将那恶霸侍候得舒舒服服，恶霸非常高兴。这个少女不惜一切代价迎合恶霸，凡是可以博得他欢心的事，甚至荡冶押蝶，无所不至。人们都认为这个少女没有良心，忘了父母的深仇大恨。


    时间一久，恶霸对少女言听计从，受其蛊惑很深。于是，少女就开始引导他生活奢华，把他的家产败去了十分之七八，又在他的骨肉间进谗言挑拨离间，使家人如仇敌。


    恶霸过惯了奢华的生活，但他的家产愈来愈少，以致入不敷出，于是少女就怂恿他私通盗贼，干些杀人越货，拦路抢劫的事。终于，此人以杀人而被偿命，恶霸被斩那天，少女不去哭她的丈夫，却背着人携着一壶酒，祭奠她父母的墓，她说：“父母二老是在梦中惊吓我，恶狠狠得像要打我似的。现在知道了我当初为什么要那样作吗？”人们开始知道她是蓄志报仇雪恨。


    试想，在封建制度下，一个弱女子，呼天天不应，呼地地不灵，手无缚鸡之力，又出身贫寒，唯一的资本就是自己的身体。面对着杀父仇人，却强做欢颜，此少女心中是何其痛苦啊！但她忍辱负重，巧设陷阱，步步引诱，终于报了父母大仇。


    ## 谋害丈夫的缺德术


    清朝时，在直隶县有一个女子和人私通，两人的感情很深。女子出嫁以后，仍然不忘情夫，念念不舍。有一天，女子问情夫说：“你愿意和我做长久夫妻吗？要是愿意，三年以内，不要进我的家门，我终究会想出办法做你的妻子。”那男子听她的主意，三年不入她的家门。


    女子到了丈夫家，侍奉守寡的婆婆，十分孝敬，凡事总是先揣摸婆婆的意思，尽力事事做得周到。在婆婆有病时，她衣不解带，端药送茶，十分周到。还讲些乡间的趣闻俗事，以解除婆婆的烦闷，使她开心。女子待她的丈夫也是情意缠绵，夫妻和睦，恩爱相敬。邻居们都羡慕这家娶了一个好媳妇，都称赞那女子贤良。丈夫家衣食并不宽裕，仅仅能顾着衣食。但也想不出什么致富的方法。女子因为一直没有儿子，就到各地庙宇中求神拜佛。由于婆婆只有这一个儿子，也不想让他外出做生意。恰好有一个瞎子，算卦十分灵验，偶尔经过这一家门前，女子对婆婆说：“不如让他算一算我何时有儿子。”婆婆就将那瞎子请进来，先给婆婆推算，瞎子详细述说她哪年得子，哪年死了丈夫，哪年娶了媳妇，媳妇十分贤良，一一说明，十分灵验。婆婆不由感到惊奇，就十分相信。瞎子算到最后说：“可惜你的儿子不能长久侍奉你，但有孝贤的媳妇，老年时也并不受苦。”婆媳二人不由心中起疑，婆婆就让瞎子推算儿子的命运。


    瞎子装作十分操心的样子，费了很大的劲为她的儿子推算，最后他迟疑了很久，吞吞吐吐地好像有什么话不便讲出来。婆婆觉得不妙，就坚持让瞎子说出来，瞎子这才说道：“此人十日以内，前世的冤家来找他寻命，必然暴死，实在没有办法救他。可惜你们婆媳二人，这般命苦，命里如此，也无可奈何。”瞎子十分惋惜地走了。


    女子对婆婆说：“这个瞎子胡言乱语，我们不必信他，不过不能不妨。从今天起，我们二人不让夫君出门，日夜守着他，过了十天，也就没事了。”婆婆认为有理，就照媳妇说的去做。


    于是，将那男子关在屋中，婆媳二人日夜守护，过了三天，仍然平安无事。婆婆已六十多岁，本来还有精力，熬了三天，实在难以坚持下去。女子就说：“罪过呀！世上哪有儿子吃饱大睡，而让母亲日夜看护的呀？现在这样，料想也没什么大事，婆母不如回房暂睡，还有七天的时间，我们二人轮流守护，这样劳累就轻点。”婆婆听了儿媳的话，就回屋关门睡去了。到了三更时分，忽然听到刀杖敲击声和推翻桌子、摔倒板凳的声音。女子大叫道：“你的儿子疯了，拿着刀要杀我，还要把母亲您杀掉，你千万不要开门。”随即听到拍打门的声音。婆婆很害怕，忙搬了东西顶着门，浑身发抖。过了一会，女子又叫道：“你的儿子拿着刀跑出去了，快开门，我们一同去追。”婆婆开门，二人夺出向外追去，黑暗中只见她的儿子披头散发往前快跑。到了河边，纵身跳了进去。岸上只丢了一只鞋，确实是儿子的鞋。婆婆大声呼叫邻居，想尽办法打捞尸体，好几天也没捞出尸体。没有办法，就设了灵牌招魂，草草办了丧事。那女子日夜啼哭，痛不欲生，不吃东西，几次要以身殉夫。婆婆再三劝阻，这才稍微吃一点东西。终日穿着孝服，遵循妇礼，对婆婆更加孝敬。为了生计，女子就找些针线活做，挣了钱就为婆婆改善生活，二人相依为命，婆婆非常疼爱儿媳。


    一年多的时间过去了，婆婆可怜女子少年守寡，又膝下无子，就劝女子改嫁。女子趴在地上痛哭，誓死不嫁二夫。等到孝服已满，家中生计愈来愈困难，日子难以维持。婆婆就再劝儿媳：“家里生活愈来愈难了，我老了，没有用，你又是一个女孩子家，凭借十指哪能顾得上我们两个人啊，你要是不改嫁，你我二人都得饿死，你难道不为我考虑考虑吗？”女子哭泣着说：“婆婆您这样说，我也就不能再坚持守节了，但我离去后，您老人家谁来管，婆婆要是冻着饿着，我的罪过就大了。要是改嫁，就必定得找一个没有父母兄弟的，愿到我家来，肯拜婆婆为母，奉养终身，且与我夫同姓的人，我才嫁他，不然的话，我誓死不嫁。”


    婆婆就托人找符合这一条件的人，但符合这些条件的人往哪里找？几个月过去了，也没有结果。后来，有远村的一个少年来租房开店。婆婆考虑可增加收入，也就同意了，时间一长，她看这少年又勤快，又老实，又懂事，真是天下难找的好人。就悄悄地查访他的身世，正与媳妇要求的条件相合。就请了媒人说合，招作养老女婿，自此，一家三口，日子过得很好，那少年对婆婆也十分孝敬，又开店做生意，生活比儿子在世时还要好，邻居都说婆婆没有儿子又有儿子，全靠媳妇孝敬。婆婆也引以为荣。


    这个少年，就是女子原来的情夫。成婚后，那少年不愿住妇女前夫的寝室，就和女子一同搬到厨房边的小厢房去住，寝室则用来放杂物。


    过了两年，婆婆的一个弟弟回到家乡，他曾在云南为一个大官看门，积了一笔家私，忽然带着妻子回乡，正好赶在年底，一时找不到房子，就借住在姐姐家。由于常年在外，不免应酬乡邻，人情往来，几天不能安睡。他的妻子，在检验衣物时，闻到一股血腥气，就告诉了丈夫，丈夫斥责她胡说。但是，他询问了外甥的死因之后，不由心中起疑。一夜，他挖开炕土，见一个被肢解的尸体，仍掩埋好，也不告诉姐姐，直接告了大状。县官立即派人前去检验，随后将一干人犯一一审讯，那女子和少年都不肯承认，就是婆婆也责怪弟弟多管闲事，要求县官放了儿媳。这个官司拖了好几年不能定案。


    后来更换县令，人们对新县官说：“这个案子很难办，你要当心。”新县令说：“我自有破案的办法。”


    新县令到任后，前往城隍庙，将少年和女子分别绑到两个柱子上。事先让县吏伏在神案下面，让其他人都散去。三更时分，派人在城隍庙殿后台阶旁装作鬼的哭叫声。少年十分害怕，对那女子说：“太可怕了。”女子喝斥道：“有什么可怕的，不过如此，要不了几天我们就能回家了。”二人又说了一些秘语。县吏从神案中出来，已将他们的话都作了记录。


    县官根据记录，对少年施以重刑，少年忍受不住，就招供了。那女子也不再强辩。至此，案情大白。


    原来算命的瞎子，是女子事先用钱买通的。目的是为了迷惑婆婆。少年本来善长游泳，那天夜里，女子约他潜入室内，将丈夫杀死，埋入炕土。假作发疯，摔打桌椅，后来投河自尽等都是少年所做。投河时又故意丢下一只鞋子，这样婆婆就深信不疑。


    # 第四部


    ## 上班族缺德讲座


    上班如苦海，众生在苦海中匍匐潜行。无论你是谁，压力就像一张巨网，让你无所遁形。


    上班族除对抗同行之外，还要与同事、部下、上司竞争。“胜者王，败者寇”，当你在竞争中被打得落荒而逃时，前途便化为乌有。


    不要消极地等着被淘汰，而要主动地捍卫自己的权利。


    ## 开讲辞


    各位优秀的上班族，欢迎参加本讲座，今天有这么多人共聚一堂，身为主办者的我不胜喜悦之意。


    只是“优秀”二字并不是用来形容那种日夜不忘公司大恩、本分稳重得不敢擅自拉屎放屁、凡事公司至上、生平只爱读书及听音乐、乏味而不显眼的人。这点请各位记住。


    我们生活在这个社会，个人凭才能争取财富，国家几乎不加干涉，放任自由竞争。外表上，公司像一道保证上班族的防波堤，可是我们除了化身为公司的一颗细胞，要对抗同业之外，仍得在堤内与同僚、部下、上司竞争，甚至要和一些模糊的评分标准比赛。“胜者王，败者寇”，当你在这些竞争中被打击落荒而逃时，前途便化为乌有。


    我们常听说一些在校学习十分好的学生，踏入社会后却一蹶不振，其原因，即在于校园内外的价值观不同。本讲座无意否定学校师长的说法，充其量只是在他们所谓的“优秀”中，补充一些竞争活力必备的项目，如强悍、大胆等。我们认为厚脸皮能适度地使坏的人（其实不是人，是上班族），才有资格参加本讲座，欠缺这些条件的人，又说错了，是上班族，不是人）上课必毫无所获。以下详述各位学员应具备的条件。


    - A. 于社会大众所谓的“公司”的组织体中，提供精神方面为主的劳力，以换取每周或每月的报酬，并赖以维生。

    - B. 不满于公司对自己的评价及待遇。

    '
