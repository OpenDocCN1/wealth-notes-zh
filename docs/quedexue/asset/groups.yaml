    # # 缺德史话


    可又想学孙膑的祖传兵法。庞涓计划待学到“孙子兵法”后才下毒手。


    有一次摆演阵法，庞涓不及孙膑。庞涓便迫不及待开始用阴谋陷害孙膑。庞涓在魏惠王面前说，孙膑身在魏国，心怀齐国，有里通外国之嫌。后来庞又假造证据，赚出孙膑笔迹，骗孙膑请假回齐省亲。魏惠王不知其故，见孙膑准备回齐，认为孙膑有背魏向齐之心，于是就削其官位，发交庞涓约束监管。庞涓乘机落井下石，私奏魏王，说孙膑虽有私通齐国之罪，罪不至死，不如砍掉他的双腿，使其成为废人，终生不能归齐，既全其命，又无后患，岂不两全？魏王依奏，庞涓立即下毒手，将孙膑一双膝盖削去，又用针刺上“私通外国”四字。庞涓还猫哭老鼠般痛哭一阵，使人敷药膝盖，抬入书馆，好言安慰。


    孙膑堕此术中，身虽残废，但对庞涓还是感激万分。庞涓一心想着经过老师鬼谷子注解的《孙子兵法》，就试探孙膑，孙膑慨然应允，决定以木简刻写出来以供庞涓阅读。


    服侍孙膑的仆人诚儿，见孙膑无辜受害，反生怜悯之心。一天庞涓召见诚儿，问孙膑每天能刻多少？诚儿答孙膑两足不便，长眠短坐，每日只写两三策！庞涓大怒，说：“如此迟慢，何日可完？你可与我加紧催促！”诚儿惶恐退出，遇一近侍，告及“军师要孙将军写书，又何必如此催促？”那近侍小声告诉：“你有所不知，军师与孙膑，外好内异，目前使他苟延残命，不外欲得此兵书，到写完之时，马上让其绝食而亡，你且不可泄露风声！”诚儿闻言大惊，没想到军师竟是如此不义之人，回去将此话密告孙膑，孙膑才知底细，想此不义之人，岂可传以兵法？转而一想，如果不写，他必发怒，我命将在旦'
