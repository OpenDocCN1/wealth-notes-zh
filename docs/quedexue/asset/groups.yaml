    ## 封官许愿


    封官许愿，目的在于让部下为己效力。因此，有些人往往乘机考察一下部属是否对自己忠诚。封建时代“家长式”的统治术，就闹出了不少诸如先打屁股后做官之类的笑话。


    冯玉祥是我国近代著名的爱国将领，但此人行伍出身，长期的军旅生涯使他沾染上了不少旧军队的陈规陋习。冯玉祥长于治军练兵，然而冯玉祥治军一直采用旧式的家长式的治军方法，他治理西北军采用很严厉的手段，不仅要求其高级将领过简朴的生活，甚至高级将领犯错误时，也采用罚跪、打军棍、罚站门岗等形式进行体罚，因此常招致手下将领的不满。可是，冯玉祥毕竟智慧过人，统御部下的才能也是卓越不凡。


    李宗仁在其回忆录中，对冯玉祥的治军有如下生动描述：


    > “冯氏行伍出身，未尝受正式军事教育。其部属也多系行伍出身，纵是高级军官，也每有目不识丁者。所以，冯氏治军，仍一本中国旧军的陈规。部下犯错，纵是高级军官，也当众打军棍，初不稍代。其部将也专以效忠其个人为职志，部队固然是其私产，将校也是其仆奴。军官每有升迁，冯氏常按北方军的陋习，先罚打军棍数千，然后发表升官命令。故其部属如有无故被打军棍者，其同僚必购酒肉，燃爆竹，为渠庆贺，因为打一顿屁股之后，官又升了一级。这种侮辱人性的作风，冯氏行之不以为怪。


    冯玉祥这种驾驭部下的方法，自然是沿袭了封建时代的旧习。但是，提拔部下时对之适当进行敲打也是必要的。一是让他不忘知遇之恩，以后加倍对自己效忠。二是让他不要功高震主，滋长野心。有些人一升官就得意忘形，想翘尾巴，以致滋生篡逆之心，这是当权者所应严加防范的。


    ## 缺 德 学


    官职的设立，本来只是为了治理国家，但是在当权者看来，它已变成了笼络臣下，挟制部属的手段，或者是和部下搞某种交易的商品。封官如同商品交换一样，可以讨价还价，一分价钱一分货。立小功封小官，立大功封大官。有时还把封官的过程拉得特别长，使臣下的官欲永远不会有满足感。


    贪功求利，这正是人性的致命弱点，只有明白这一点并充分加以利用才能真正把握封官晋爵的玄机。


    ### 世界上没有无缘无故的爱


    讲究情义是人性的一大弱点，中国人尤其如此。“生当陨首，死当结草”，“女为悦己者容，士为知己者死”，无一不是“感情效应”的结果。为官者大都深知其中的奥妙，不失时机地付出廉价的感情投资，对于拉拢和控制部下往往能收到异乎寻常的效果。


    韩非子在讲到驭臣之术时，只说到赏、罚两个方面，这自然是最主要的手段，但却很不够，有时两句动情的话语，几滴伤心的泪水往往比高官厚禄更能打动人。因此，感情投资，是一种最为高明的驭臣术、统治术。


    有人说：“世界上没有无缘无故的爱”，掌权者对臣下的一切感情投资，都应作如是观。


    吴起是战国时期著名的军事家，他在担任魏军统帅时，与士卒同甘共苦，深受下层士兵的拥戴。当然，吴起这样做的目的是要让士兵在战场上为他卖命，多打胜仗。他的战功大了，爵禄自然也就高了。“一将成名千骨枯”嘛！有一次，一个士兵身上长了个疮，吴起竟然亲自用嘴为士兵吸吮脓血，全军上下为之感动，而这个士兵的母亲得知这个消息时却哭了。有人问她：“你的儿子能得到将军的厚爱，这是你家的福分，为什么痛哭不止呢？”这位母亲哭诉道：“这哪里是爱我的儿子呀，分明是让我儿子为他卖命。想当初吴将军也曾为孩子的父亲吸吮脓血，结果打仗时，他父亲冲锋在前，战死沙场；现在他又这样对待我的儿子，看来这孩子也活不长了！”


    人非草木，孰能无情，有了这样“爱兵如子”的统帅，部下能不尽心尽力，效命疆场吗？


    民国年间，身为一世枭雄的“北洋之父”袁世凯在统御部下方面也很注重感情投资。早在小站练兵时期，他就从天津武备学堂物色了一批军事人才。其中最著名的有三个人：段祺瑞、冯国璋、王士珍。后来都成了北洋系统中叱咤风云的人物。袁世凯为了让他们对自己感恩戴德，供其利用可谓煞费苦心。


    公元1896年，袁世凯选拔的各路将官汇集小站。在议事厅里，袁世凯举行了召见仪式。新来的将官一一呈上名帖。袁世凯丝毫没有摆出上司的架子，满脸堆笑，执礼甚恭，言谈中更是极尽夸赞和拉拢。他明白，要想成就一番事业，这些人是首先要依靠的力量。


    接见完毕，袁世凯突然发现段祺瑞没有来，便问道：“段祺瑞呢？段祺瑞怎么没有来？”


    坐在一旁的唐绍仪告诉他说，不巧得很，在接到命令前，段祺瑞正好回老家完婚去了。他还不知道自己被调来小站，所以未能及时赶来。“不过”，唐绍仪补充道，“已经去电，促他尽快报到。”


    “原来是这样。”袁世凯点点头。


    ## 缺德学 · 251 ·


    段祺瑞回合肥老家与原配吴氏结婚，行前尚不知自己已被袁世凯调往小站，但对袁世凯前往小站督练新军的消息已有所闻。回到合肥后才接到小站练兵处发来的电报，通知他已调往小站，并限期前往报到。


    段祺瑞接到电报后，既惊喜又懊丧。因为他平时经常批评旧军的种种弊端，倡导编练新军，现在终于有了一试身手的机会，段祺瑞自然十分高兴。但令他懊丧的是，刚刚回到家里，且又是婚娶大事。如果马上离开，对自己的长辈和女方的家族来说，都不好交待。然而，军令如山，段祺瑞又不能也不执行。


    正在左右为难之际，又一封电报送到了。这是袁世凯以个人名义发来的。大意是：婚姻乃大事，上以事宗庙而下以继后世，故君子重之，此乃人伦之在要，需妥办；来小站之事，可迁延时日，不必操之过急。此外，袁世凯还赠送银票一张，作为“区区薄礼”。


    这使段祺瑞十分感动。当时，袁世凯已是官居要津，颇有名气了。段祺瑞根本没想到，这位正在腾达的袁大人居然会对他如此看重，如此礼贤下士。


    段祺瑞办完婚事便匆匆赶赴小站报到。下车后，看到一行人正等在那里迎接他。身着新军制服的冯国璋首先向他迎过来。他和段祺瑞是武备的老同学、老同事了。见过礼后，冯国璋指着一位被人簇拥着的矮胖的人说：


    “芝泉，快来见过袁大人。”


    听说袁世凯亲自来迎，段祺瑞更激动了。他几步赶快去，行了大礼，说：“祺瑞不才，怎敢劳大人亲迎。”


    袁世凯一把拉住他的手，哈哈大笑起来。


    “不必如此，不必如此，”他说，“今后咱们就是一家人了。”


    接着，袁世凯邀段祺瑞同乘一辆车回营，当晚还专门设宴为段祺瑞接风洗尘，席间更是流露出相见恨晚之情。


    几天后，段祺瑞在天津一家饭店举行婚宴，招待小站的各位将领和同僚。袁世凯出席了宴会。婚宴的场面颇为盛大，饭店门口车水马龙，热闹非凡。婚宴结束后，段祺瑞通知店方结账。


    老板说：“袁大人已经吩咐了，所有花销都记在他的名下。”


    段祺瑞一下愣住了：“哪位袁大人？”


    老板说：“就是袁世凯袁大人啊！”


    段祺瑞又一次大受感动，尽管说起来这仍然是一件小事情。熟知袁世凯的人都知道，在拉拢人和控制人方面，他是极有手腕和韬略的，尤其善在小处用功，即便是公事也要私办，使之带有极浓厚的私人感情色彩。


    当然，袁世凯对段祺瑞恩礼有加，并不是无缘无故的。在他看来，段祺瑞素娴军学，才堪大用，在实现自己野心的道路上，这是一个不可缺少的得力臂膀。这一点，袁世凯没有看错。


    还有一件事更能表明袁世凯在统驭部下方面的超人之处。袁世凯在创办新军时，相继成立了三个协（旅），在选任协统时，他宣布采用考试的办法，每次只取一人。


    第一次，王士珍考取。


    第二次，冯国璋考取。


    从柏林深造回国的段祺瑞，自认为学问不凡，却连续两次没有考取，对段来说，只有最后一次机会了。第三次考试前，他十分紧张，担心再考不上，就要屈居人下，心中十分不快。


    第三次考试前一天的晚上，正当段祺瑞闷闷不乐地坐着发呆时，忽然传令官来找他，说是袁大人叫他去。段祺瑞不敢怠慢，立即前往帅府，晋见袁世凯。袁世凯令他坐下，东拉西扯，说了些不着边际的话。临走，袁世凯塞给段祺瑞一张纸条，段祺瑞心中纳闷，这纸条是什么呢？又不敢当面拆开看。急忙回到家中，打开一看，不觉大喜，原来是这次考试的试题。


    段祺瑞连夜准备，第二天考试时，胸有成竹，考试结果一出来，果然高中第一名，当了第三协的协统。


    段祺瑞深感袁世凯是个伯乐，对于自己有知遇之恩，决心终身相报。


    后来，段祺瑞、冯国璋、王士珍都成了北洋军阀政府的要人。段祺瑞谈起当年袁世凯帮他渡过难关的事，仍感恩不尽，谁知冯国璋、王士珍听了，不觉大笑，原来王、冯二人考试时也得到过袁世凯给的这样的纸条。


    袁世凯这种办法，可谓妙不可言，既可以使提拔的将士报恩，又能使没升官的将士心服口服，便于统帅，还给被提拔者创造了很高的声誉。由此可见，袁世凯在耍弄权术上是个高手。


    与袁世凯一样，蒋介石在用人统驭方面也很有政治家的手腕，恩威并济，收买人心。


    蒋介石有一个小本子，里面记载着国民党师以上官长的字号、籍贯、亲缘及一般人不大注意的细节。凡是少将以上的官长，他都要请到家里吃饭，每次都是四菜一汤，简朴之极，作陪的往往只有蒋经国。采用这种不请别人陪客的家宴方式显得更加亲热。同时，简单的饭菜给他的部下留下清廉的印象。


    蒋介石请部属吃饭后，总要合一张影。他与孙中山有一张合影照片，孙中山先生坐着，他站在孙先生背后，他与部属合影也摆这个模式，其中的用意不讲自明。他常对部属说：


    “叫我校长吧！你们都是我的学生。”


    如果不是黄埔生，他也很慷慨：“哦，予予以七期登记吧！”这样就提高了部属的身价，起到了收买拉拢的作用。


    蒋介石给部属写信，除了一律称兄道弟外，还用字号，以示亲上加亲，可以说他很懂人情世故。


    蒋介石不仅熟记部属的名号、生辰、籍贯，而且对其父母的生日也用心记得很准。有时，他与某将领谈话时，往往是在他提起某将领父母的生日时，使该将领受宠若惊，十分激动，深为委员长的关切所震撼。


    第十二兵团司令官雷万霆调任他职时，蒋介石召见了他，蒋介石说：“令堂大人比我小两岁，快过甲子华诞了吧！”


    雷万霆一听，眼泪都快出来了，激动得声调颤抖着说：“总统日理万机，还记着家母生日！”


    蒋介石说：“你放心去吧！到时我会去看望她老人家，为她老人家添福增寿。”


    雷万霆自然死心塌地成了蒋的心腹。


    当杜聿明在徐州为蒋介石打仗卖命时，蒋介石从小本子上查到杜母的生日，他立即命令刘峙在徐州举行为杜母祝寿的仪式，同时又令蒋经国亲赴上海，为杜母送去10万元金圆券的寿礼，并且在上海举行隆重的祝寿仪式。这个消息传到徐州，杜聿明十分吃惊，这不仅是因为蒋总统记得其母的生日并亲自派人祝寿，而且因为陈诚去台湾疗养，蒋介石才批5万元。


    蒋介石如此厚待杜聿明无非是让杜为他拼命死战。蒋介石对部属很能具体对待，爱官的给官，爱钱的给钱，爱地盘的给地盘。像陈布雷这不爱官、不爱钱的旧知识分子，他又区别对待，在陈布雷50岁生日时，为陈亲手书写一条幅，上写：“宁静致远，淡泊明志”八个字。蒋介石这一招正投陈布雷所好，收到很好的效果。平平淡淡八个字，使陈布雷认为蒋介石对他“知其最深”。士为知己者死，这是古代知识分子的人生追求。陈布雷正是奉行这一信条，兢兢业业为蒋效力，在蒋家王朝日落西山时，陈布雷以自杀表示了他对蒋的忠诚。


    ### 重赏之下，必有勇夫


    自古以来，“升官”是和“发财”紧密联系在一起的，有高官必有厚禄。任何一个政权的统治者都不会亏待死心塌地为自己卖命的属下。可以说，优厚的薪俸，丰足的物质利益正是做官的诱人之处。自古以来，君臣之间乃是一种买卖关系：君主为了夺取和巩固其政权，不惜重金收买臣下的聪明才智；臣下为了得到功名利禄而不惜向君主出卖自己的才智。因此，功名利禄也就成了联结君臣关系的重要纽带。所谓君臣之义、忠贞节操之类动人的言词都只不过是为了掩饰这种赤裸裸的金钱关系而已。试想一下如果“功高不赏”，只给官不给钱，人们自然也就失去了做官的兴趣。


    战国时期，燕国发生内乱，国力凋敝，齐国乘虚而入打败了燕国。燕昭王继位后决心复仇，开始罗致人才，改革政治以便复兴国家。于是乎，他向燕国名士郭隗请教，怎样才能招致贤士以报齐国灭燕之仇。郭隗便向他讲了这样一个故事：


    “我听说古代有个国君，愿花千金购买千里马。三年没有买到。这时宫中有个侍臣对国君说：‘请让我去买吧。’国君就派他去。找了三个月果然找到一匹千里马，可是那匹马已经死了。侍臣就用五百两黄金买下那匹马的骨头，回来报告君王。国君大发雷霆说：‘我要的是活马，死马有什么用？白白丢了五百两黄金？’那个侍臣说：‘一匹死马还用五百两金子买来，何况活马呢！人们必定认为大王确定不惜重金买良马，千里马很快就会送上门来了。’不到一年，果然有人送来了三匹千里马。现在大王真要招致人才，就从我开始吧。像我这样的人还能受到您的重用，何况比我更有才干的呢？哪怕千里之外，他们也会来的！”


    燕昭王采纳了郭隗的建议，专门为郭隗建造了一所宏大华丽的住宅并尊他为师，放下架子向郭隗学习。同时还在燕国都城之外筑起了一座高台，上面放了千两黄金，以招揽天下有才之人，此所谓“金台骏骨，以示招徕。”这一招果然奏效，造成了“士争凑燕”的局面。投奔而来的有魏国军事家乐毅，有齐国的阴阳家邹衍，有纵横家苏秦等，很快使燕国恢复了元气，成为战国七雄之一，后来还雪了国耻，把齐国打得只剩下两座孤城。


    俗话说：“天下熙熙，皆为利来；天下攘攘，皆为利往”，有钱能使鬼推磨。古往今来，为官者往往不惜重金收买部下，以便达到个人目的。于是乎，各种名目繁多的赏赐便应运而生。翻开二十四史，君王赏赐部下的记载比比皆是。到了民国年间，袁世凯、曹锟为了当上皇帝和大总统更是破费不赀。特别是布贩子出身的曹锟，为了满足权力欲望，圆多年的大总统梦，公然收买国会议员和议长，并因此而爬上了北洋政府总统的宝座，其卑劣手段在中外历史上堪称一绝。


    直系军阀曹锟是个地地道道的拜金主义者。他深信，只要以金钱作诱饵，不仅可以驱使部下为他打仗卖命，还可以弄个总统当当。经过一番筹划，大总统黎元洪被逼辞职，总统的位置便空缺下来。曹锟指使党羽紧锣密鼓地筹备总统“选举”，他以每张选票5000元的价码收买了480多个国会的“猪仔”议员，又以30万元的价格收买了议长。果然是有钱能使鬼推磨，天下有的是贪财好利的软骨头，于是，曹锟最终“合法”当选为中华民国大总统。


    曹锟贿选所用经费甚巨，共达1356万余元。其中包括补助各政党党费324万元，特别票价141万元，普通票价304.5万元，宪法会议出席费20万元，特别酬劳费32.4万元，“水敬”（夏季津贴）、“炭敬”（冬季津贴）和车马费190万元，招待临时费120万元，秘密费70余万元。


    当然，这些费用不会出自曹锟的腰包。他一当上总统便由民国财政部统统报销了。


    “文官爱钱，武官怕死”，这是宋朝官场的真实写照。自从赵匡胤“杯酒释兵权”之后，有宋一代，重文轻武，文武官员待遇优厚、养尊处优，对皇权已构不成任何威胁了。这也许正是赵匡胤的高明之处。然而，任何事情都其两面性，官吏俸禄高固然会使文武官员贪财好利，便于皇帝驾驭，但也必然会加重政府的财政负担导致“积贫积弱”的局面。到了明清两代，官员的薪俸相对较低，这在客观上又助长了贪污。允许贪污，对臣下的贪污行为视而不见，“睁一只眼闭一只眼”，这是清朝康熙皇帝笼络群臣的一个绝招。


    ## 缺德史话


    按照清制，一品高官的年俸只有180两银子，这一点微薄的“工资”，甚至还不够平时家里的日常开销，更无法满足文武官员的贪欲。何况，为官者平时还要上下打点，请客送礼。怎么办？“羊毛出在羊身上”，皇帝给他们的薪俸低，便只好凭借手中的权力“取之于民”。在清代，官僚贪污是个公开的秘密。贪污、受贿、勒索之风层出不穷。官员公开的贪污有所谓“陋规”、“银耗”。康熙皇帝公开说，所谓好官并不是丝毫不贪，只要能留下八成清白就行了。


    这种放任纵容的政策无非是为了笼络臣下。既然皇帝不能给他们支付丰厚的薪俸，便只好利用皇帝给他们的权力“另开财源”了。“三年清知府，十万雪花银”，当时掌握权力的大官僚大都敛财纳贿、贪赃枉法，中国最大的贪官和珅即出自清代。作为乾隆皇帝的宠臣，和珅利用职权之便收受贿赂，其财产之巨听起来不禁令人咋舌。嘉庆初年，和珅下台，家产尽被查抄，估价数亿元，相当于清政府5年的国库收入，可见其赃物之多，财产之富。甚至和珅的两个家人抄没的家产也值白银700万两之多。查抄和珅的家产，大部分都落入嘉庆皇帝的腰包，所以民间流传着“和珅跌倒，嘉庆吃饱”的谚语。


    和珅之所以敢于如此胆大妄为，完全是由于乾隆皇帝默许和纵容的结果。大约在他看来，“又要马儿跑，又要马儿不吃草”这是不可能的，既然实行的是低薪制政策，朝廷舍不得给大臣薪俸，就听凭他们自己去觅食吧，自己就睁只眼闭只眼算了。


    ## 大人不计小人过


    高官、厚禄、美名，这大概是投身官场的人所追求的三大目标。君上对于臣下的安抚笼络，一般来说，不外乎官职、钱财两种，但有时上级对下属不必付出实质性的东西，而只要通过某种表示、某种态度，便能给下属最大的满足，甚至会使他们产生受宠若惊的感觉，因而感恩戴德，更加忠心耿耿地为其效劳。


    汉高祖刘邦当上皇帝后，封萧何为第一功臣。按照当时的礼仪，大臣在朝见皇帝的时候，要跪着进殿，入殿前要去掉身上的佩剑，脱掉鞋，在拜见皇帝时，要自报姓名，而刘邦却给了萧何这样的特权，这便是允许他“入朝不跪，剑履上殿，赞拜不名。”后来，这几乎成为对功臣优宠的一种通例。民国初年，袁世凯称帝时也学会了玩弄这种小手段。当时，许多部属和民国元勋都不愿向他下跪称臣，登基大典日益临近，如不很好地安排他们，可能引起不良影响。于是，袁世凯便顺水推舟卖了个空头人情，他下令开列一个名单，将自己的旧侣故人统统罗列进去，并封徐世昌、赵尔巽、李经羲、张謇这些昔日同僚为“嵩山四友”，让他们享受以下五项优待条件：一、免其称臣跪拜；二、赏乘朝舆，到内宫换乘肩舆；三、皇帝临朝时，得设矮几赐坐；四、赏穿特种朝服；五、每人给以岁费2万元。然而，由于袁世凯恢复帝制不得人心，这些旧属亲友大多都采取了不合作态度，袁世凯耍弄的这种小手法最后还是落了空。


    为政者不仅要对待下属示以宠信，同时还要向他们显示自己的大度，尽可能原谅下属的过失，这也是一种重要的笼络手段。俗话说：“大人不计小人过”，“宰相肚里能撑船”。对那些无关大局之事，不可同部下锱铢必较，当忍则忍，当让则让。要知道，对臣下宽容大度，是制造向心效应的一种手段。


    战国时，楚庄王赏赐群臣饮酒，日暮时正当酒喝得酣畅之际，灯烛灭了。这时有一个人因垂涎于庄王美姬的美貌，加之饮酒过多，难于自控，便乘黑暗混乱之机，抓住了美姬的衣袖。


    美姬一惊，左手奋力挣脱，右手趁势抓住了那人帽子上的系缨，并告诉庄王说：“刚才烛灭，有人牵拉我的衣襟，我抓断了他头上的系缨，现在还拿着，赶快拿火来看看这个断缨的人。”


    庄王说：“赏赐大家喝酒，让他们喝酒而失礼，怎么能为要显出女人的贞节而辱没人呢？”于是命令左右的人说：“今天大家和我一起喝酒，如果不断绝系缨，说明他没有尽欢。”群臣一百多人都扯断了帽子上的系缨而热情高昂地饮酒，一直饮到最后尽欢而结束。


    过了三年，楚国与晋国打仗，有一个臣子常常走在前边，打了五个回合五次尽力冲在最前边。最后打退了敌人，取得了胜利。庄王感到惊奇，忍不住问他：“我平时对你并没有特别的恩惠，你打仗时为何这样卖力呢？”他回答说：“我就是那天夜里被扯断了帽子上系缨的人。”


    从这里，我们不仅看到了楚庄王的宽宏大度，远见卓识，也可以洞悉他驾驭臣下的高超艺术。


    无独有偶。刘秀后来的做法如果不是受了楚庄王的启发的话，应该说也有异曲同工之妙，公元24年，刘秀攻破邯郸，

    '
