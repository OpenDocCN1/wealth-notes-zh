    # 可以共打天下，但不能共享天下


    贪权置势者，未发迹之前，大都能与部属盟友同甘共苦，而且总是鼓励部属盟友私欲膨胀，放纵他们行凶作恶。一旦对手被打倒，目的达到，为了独享其成，或为了掩饰恶迹或为了平息众怒，便要对那些帮他成就了大事的部属盟友开刀了。这种谋术便叫“卸磨杀驴”。


    纵观中国几千年封建社会，一些以暴力夺取政权的出类拔萃的人物，其思想行为常常有一个“三怕三不怕”的公式。所谓“三不怕”：即未得志之时，不怕天诛地灭，不怕羞祖，不怕神憎鬼厌，故能任性横行，恣意贪取，视人家生命如囊中之物，这是鼠窃狗偷时期。所谓“三怕”，那是在得志之后，这已是有权可弄，有威可摆，可以控制一切，播讲仁义道德的显赫时期，这时则最怕旧闻，怕见旧人，怕提旧事了。这些旧闻旧人旧事，恰恰又是与旧日的手足有密切的关连，如果没有旧闻旧人旧事，恰恰又是与旧日的手足有密切的关连，如果没有人说出他当年打家劫舍、嫖赌逍遥的秘密，他就很可以堂而皇之把自己装饰一番：既可以说自己是天父降生，星宿下凡，一落地就能“仁义为神道为骨，吐气成云屁成风”；也可以把当日赤身入“鸡窦”说成虎穴救佳人，把拦路抢劫说成是“劫富济贫”。所以，他想粉饰自己的时候，把鬼脸扮靓，不能不择亲而噬，将“吃过同锅饭”的亲密战友杀绝灭口，因为他们所知道的秘密太多了，这正是得势者的最大障碍，不得不“卸磨杀驴”了！


    历史上，刘邦是以“烹走狗”著名的。他还在“一时悟偷鸡当保长”的时候，为要“取王位而代之”，拍尽多少胸脯，'
