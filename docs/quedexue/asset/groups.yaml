    岳飞班师回明后，赵构重用秦桧向金人求和。为取媚于金人，又无中生有制造冤狱将岳飞父子逮捕。岳飞入狱后，秦桧等人挖空心思，罗织罪名，然而，岳飞为人正直，精忠报国深受部将及同僚的敬仰与尊重，各种罪名均不能成立。最后，秦桧竟在赵构指使下，以“莫须有”的罪名杀害了这位令敌人闻'
