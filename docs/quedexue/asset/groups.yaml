    # 缺德整人术


    婉儿又道：“则天大圣皇帝，皇后以为何如？”韦氏不禁一笑。婉儿索性走近数步，与韦氏附耳数语，韦氏还装着一种半嗔半喜的样儿。婉儿知己认可，遂出去引导可人儿，夤夜入宫。是夕正值中宗留宿别寝，趁着韦氏闲暇，即把情人送入，一宵欢乐，美不胜言。道是何人？原来就是武三思。嗣是三思一箭双雕，只瞒中宗一副耳目。韦氏与婉儿，且在中宗面前，屡说三思才具优长，中宗竟拜三思为司空，同中书门下三品，并进婉儿为昭容，令她专掌诏命。三思子踪训，与踪训妻李裹儿，当然封为驸马公主，不消细说，既而复封散骑常侍武攸暨为定王，兼职司徒，诸武声势复振。


    自从武则天下台后，朝中忠臣齐心协力打击武氏力量，武三思地位日下，但他却通过韦氏的肉体关系，再度入朝掌权，可叹中宗昏庸，人家给他戴了绿帽子，他还要封人家的官。后来武三思权力达到顶峰，连杀朝中忠臣，实施残酷的报复，而中宗也被韦氏用毒饼药死，大唐江山又一次发生震动。


    色情这个东西，好比鸦片，一旦陷进去，就会产生幻觉，不能自拔，反而越陷越深，弄得不好，还会引火烧身，弄个可悲的下场，正因为这个原因，以此作为升官的阶梯，是再快不过的了，也是再危险不过的了。


    张昌宗、张易之、武三思之流以色进仕，虽遭人们唾弃，但多少有加遮掩，而战国时秦国的嫪毐（涝矮）与皇太后私通，竟弄出两个儿子来。


    吕不韦是一个大商人，他看到秦国安国君的儿子子楚被送到赵国当人质，地位低下，又无钱财，就资助子楚，使子楚受到华阳夫人的宠爱，最后被立为嫡子。安国君只当了三天国王就死了，子楚即位，是庄襄王。早在赵国时，吕不韦就找了一'
