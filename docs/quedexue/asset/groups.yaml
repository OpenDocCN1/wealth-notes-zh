    消灭了自己的劲敌王郎，从王郎的文书中材料中，发现了自己部下写给王郎的书信，都是攻击诽谤自己的。刘秀看也不看，当着诸将的面付之一炬，并说：“让那些提心吊胆的人放心吧！”


