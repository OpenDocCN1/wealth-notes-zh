    # 缺 德 学 · 195 ·


    和士开是南北朝时北齐武成帝高湛的宠臣。他虽然身居要位，却从来没有想过怎样为国为民做一两件好事，整天只想着往上爬，抓大权，保住贵盛的地位。因而竭尽全力和挖空心思获取宠幸。他的办法就是“导上为非”，引导高湛干些无道之事，不但言辞容貌和行为举止，都极其鄙亵，夜以继旦地寻欢作乐，君主不像君主，臣下不似臣下。甚至对高湛说：“自古帝王，死了都会变成灰烬，尧舜，桀纣，有什么区别呢！所以，陛下应当趁年轻及时行乐，好好享受，不枉过这一辈子。至于国家大事吩咐大臣去办就好了，何必自己亲躬呢。”做臣属的居然对君主说出如此的话来，而高湛皇帝对这些亡国丧邦的鬼话，不仅不感到恼怒或愤恨，反而乐意接受，并且果真去干，终日醉生梦死，不问政事，偶然坐朝，也是无精打彩，心不在焉，胡乱批几个字，便匆匆退朝。


    后来，和士开又把这一方法运用到后主高纬身上，同样取得满意的效果。和士开的权势达到炙手可热的程度。


    “导上为非”术用得登峰造极的莫过于仇士良了。


    仇士良是唐朝后期的一名大宦官，他先后侍奉过六朝皇帝，专权达二十余年，一直居高位的宠幸不衰，他保权固位的秘术何在？仇士良晚年退休告老时，曾对前来送行的宦官们说：“你们想侍奉好皇上，讨个好前程，这并不难，我在宫中这么多年，总还有些经验之谈，你们愿意听我说说么？”大家一听，正求之不得，连声答应。


    仇士良把他集多年经验而行之有效的秘诀，明白无误地告诉了他的门徒们。他说“你们侍奉皇帝，绝不能让他整日闲着。他一有了空闲，就必定去看书，会见儒臣，结果就会采纳朝臣的规劝和建议，变得聪明起来，考虑问题也就比较长远'
  - '[PAGE 208]


    了，往往会从前代的兴亡中，看出今天的忧患。他一旦这样，就不再追求吃喝享受。游山玩水，那么对我们这些人就不可能宠信，也不可能给我们更多的权力。”


    说到这里，仇士良环顾了一下四周，见大家都聚精会神地在听，于是接着又说：“所以，为着诸位今后的前程考虑，最好就是想方设法多弄钱财，供皇帝享受，整天让他放鹰玩马，追求声色，而且极尽奢侈，天天花样翻新让他高兴，使他没有空闲，一心只想玩乐，这样他就没有心思再去读书，也无暇顾及其他事，凡事全听凭我们，这样一来，皇帝的恩泽、权力又能到哪里去呢？！”


    仇士良这番话，使在场的宦官如获至宝，老前辈真是侍帝有术啊。大家慌忙跪下来，拜谢仇士良的精心指教，然后一个个心满意足地走了。仇士良这番话，的确是他“成功”的秘诀，实际上，也是多数宦官控制皇帝的主要手段。


    # 糊涂者最聪明


    当政治对手占绝对上风，进退都可能招来杀身之祸时，有些人便打扮成疯子、傻子来掩盖自己的真实意图，迷惑对方，放松对方的警惕，以求自保。这种方法便是“装疯卖傻”。


    装疯卖傻虽说是在万般无奈的情况下采取的对策，但效果还是比较明显的。


    古代著名军事家孙膑用这种方法躲过了他的同学庞涓即将落下的屠刀。


    孙膑与庞涓同为鬼谷子的弟子，共学兵法。俩人曾结为异'
