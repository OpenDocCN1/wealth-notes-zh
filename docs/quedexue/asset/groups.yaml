    ## 缺德学原理


    头，就什么事都干不成。清代著名画家郑板桥的名言“难得糊涂”道出了一定的历史真实。对于上班族来说，最为重要的事情就是“不随便发牢骚”。对一些事情不必斤斤计较。如果您事事认真，还会找来许多不必要的麻烦。“指鹿为马”者都没有死，“指鹿为鹿”者可是个做了“阶下囚”。糊涂人不一定能办成糊涂事。唯有智慧者才能办成“糊涂事”。自作聪明的人永远成不了大事。难怪人们常说：“露相不真人，真人不露相”。《读者》里曾记述过这么一个极其聪明的“糊涂大师”的经历：一次，他不小心闯进一家人家，因为忘了敲门，看见一位女士正在洗澡。他急中生智，一边撤退，一边嘴里念念有词地说：“对不起，先生！对不起，先生！等会儿我再来。”如此，别人不难堪，自己也不尴尬。难道我们对这样的糊涂方法不另眼相看吗？


    第五，“金蝉脱壳”法。在深奥无比的古代智慧宝典中，“三十六计”是家喻户晓的名册。您可能还知道，这“三十六计”的首计可就一个“走”字。“走为上计”已成为颠扑不破的定律。当您在单位要卷入一起不幸事件时，您不妨借口避避风、躲躲险。还是那句老话，“三十年河东，三十年河西。”不要说过几年，说不定过了几天，您就成了一条好汉。“事不关己，高高挂起”虽说有些太滑头，但在缺德场里，你不这样又有何法？“各扫自家门上雪，莫管他人瓦上霜”固然是为君子不齿的明哲保身术，但是在大难临头的时候力挽狂澜岂不是无愧之事？为了“合法”地缺德，您又何妨像“指鹿为马”中的一些人，在关键时候采取“弃权”的方式来解决？


    过瘾，我对驾驭缺德的感受就是这样。


    缺德学是一个说不完、道不尽的有趣话题。开头部分我就洋洋洒洒数万言，怎一个“完”字了得？“剪不断、理还乱”，是“胡言”还是“乱语”，抑或是一次别具一格的探索？请读者诸君为我呐喊！有一点我非常清楚，缺德学是第一次以文的形式问世，它的成长还有时间很长。


    ## 第二部 缺德史话


    ## 缺德学


    当心被别人活埋。


    有的人略施小技，便可弄得尸横遍野、血流成河。甚至在他挥舞屠刀杀人之时，被杀者还死心塌地高喊“谢主隆恩”呢！


    拒绝小人，迈向生命的圆满，轻轻松松过一生。


    ### 一、讨得上司欢心的秘诀


    穿鞋的人不一定在走路。狼在吃人时总要披上漂亮的羊皮外衣。真正聪明的人应该在不伤害他人的前提下保护自己，不足则近似迂腐，有余则有奸臣之嫌。


    对人，对己，做到洞若观火实在是不易的，所谓知人者智，自知者明，而达此境界者古今能有几人？


    #### 有钱能使鬼推磨


    送礼，大概是急于升官的人所用的“常规武器”。俗话说，没有不吃腥的猫。同样，也没有不贪钱的官。在封建时代如“权钱交易”、买官鬻爵早已司空见惯，就是在民主制度和公共监督机制较为完善的西方，对这一“灰色癌症”也是无可奈何。在官场上，许多人都把送礼作为巴结权贵，升官发财的手段，对送礼的学问有精湛的研究。


    李宗吾在《厚黑学》中对此有过精辟的论述，他写道：


    > “送，即是送东西，分大小二种，大送，把银元钞票一包包拿去送；小送，如春茶火肘，及请吃馆子之类。所送的人，分两种：一是操用舍之权者，二是未操用舍之权，而能予我以助力者。”


    人们对赵公元帅和“孔方兄”大都格外垂青，说来也难怪，俗话说，“有钱能使鬼推磨”，“一文钱憋死英雄汉”。即使在当今社会，许多人仍深信“钱不是万能的，但没有钱是万万不能的”。因此，遇到大事小事往往求助于“孔方兄”。这在官场上表现得尤为明显，常言道，礼多人不怪，给上司送了厚礼，有事的大事化小，小事化了，无事的则想办法找机会给弄个乌纱帽戴一戴。所以，送礼不愧为做官的终南捷径。


    送礼，首先要把握好对象，有时给甲送，而没有给乙送，得罪了乙也不上算。民国初年著名人物陆建章给袁世凯的妻妾送礼就是一例。


    袁世凯筹备帝制时，陆建章首先称臣。


    他听说袁妻子夫人要过生日，亲自献上一枚钻石戒指。于夫人很喜欢，向诸妾炫耀一番后，珍藏在卧室的首饰盒中，准备大典时戴。谁知第二天，钻石戒指不翼而飞。于夫人又气又急，召集众仆，严刑拷打、追问，钻戒还是没有下落。最后，她只好去翻检诸妾的卧房，竟在十姨太的屋里找到了那颗宝贝，窃贼是她。原来，这位姨太太嫉妒心极强，看到陆建章送给于夫人这么大的钻戒很是眼红，便悄悄偷去。


    于夫人很生气，向袁告状，袁特别宠爱十姨太，故袒护她，反而责怪于夫人：“小小钻戒算得了什么？过几天我可以给她几个更贵的钻戒，区区小事，何足挂齿。”果然，不出几天，十姨太手上一下子戴了五六个金光闪闪的钻戒，神气十足。于夫人差点气昏过去。


    这十姨太的钻戒由何而来？是袁世凯悄悄把消息传给了陆建章。陆心想：这可要坏事啦，十姨太万万得罪不起，我的乌纱帽还是得过她的鼎力相助才弄到手的。他火速购得十几颗贵重钻戒，特赠十姨太。


    此事办得巧妙、及时，解决了老袁的妻妾矛盾，又讨好了其宠妾，袁对陆建章自然就另眼相看了。


    送礼还要把握好礼品的轻重分量，以我手中钱，买你手中权。


    在清代，官员贪污是个公开的秘密。“三年清知府，十万雪花银”，中国最大的贪官和珅可谓生逢其时。乾隆年间，和珅是朝中的实权人物，皇上前面的红人。在和珅那里，大小百官皆有定价，出什么价钱做什么官，当时盐政、河道总督是两个最大的肥缺，标价也就最高。官员们必须先以“巨万纳其府库”，然后才能走马上任。即便好不容易捞到了一个肥缺，仍要经常向和珅行贿，因为天有不测风云，人有旦夕祸福，任何一个官员都有犯罪的可能。如果早早送上金银财宝，一旦获罪，和珅就可以为之从中斡旋，否则，就不要怪和珅手下不留情了。


    督抚们向和珅行贿的数额之大是十分惊人的，一二十万两银子在和珅眼里根本就算不了什么。有一位姓张的巡捕官受陕西巡抚的派遣，送20万两银子给和珅。张巡捕押着银子到了京师，却没想到竟然行贿无门，和府根本无人接待。后来花了5000两银子做“小费”，才出来一个穿着华丽的少年问：是白的，还是黄的？张巡捕答说是白银。那少年吩咐左右收在外库。然后给张巡捕一张名柬，说，“用这个作为回执，回信另发了。”张巡捕以为这个少年一定是和府的总管或者心腹，别人告诉他说，这不过是一个门子而已，几千两银子，就能见到和府总管吗？20万两银子竟不值总管出面，见一个奴才尚且需要几千两，真可谓“侯门深似海”！


    民国年间，官场送礼成风，一般官僚、政客大都精通此道，就连以“三不知”著称的狗肉将军张宗昌也不例外，而且还称得上是个送礼求官的行家。张宗昌本人土匪出身，臭名远扬，劣迹斑斑。但在官场上却能呼风唤雨，游刃有余，这在很大程度上得益于他的送礼艺术。


    1920年，张宗昌兵败湖南，只身逃走，从此成了光杆司令。张宗昌明白，要想发达，必须有靠山，他决定投靠直系，因引荐无门，只能用金钱打通关系。说来也巧，直系首领曹锟恰好在保定过50寿辰，张宗昌便以祝寿为名，风风火火来到保定。一进曹府，便当着众宾客的面从怀中掏出一个布包，拱起双手，自报家门：


    “俺，山东掖县张宗昌，如今落魄了，听到曹大帅做寿，俺想啦，都是行武出身，和尚不亲帽子亲，俺得来为大帅拜寿！”他转身又对曹锟说：“曹大帅，目下俺手里穷，没厚礼，千里送鹅毛，表表心意吧。你可千万别嫌礼太薄。”说着，自己把破布包打开。


    这包一打开可不要紧，竟吓得在场男女个个目瞪口呆，惊若木鸡。张宗昌的寿礼，原来竟是纯金铸的8个金仙寿星。光闪闪，金灿灿满屋放着光辉。


    原来，张宗昌兵败之前也颇有积蓄，攒下二十几万块大洋，若把这笔钱带回山东，却也可以购置一片像样的田产。张宗昌他不，他想买枪、买兵，想拉队伍。所以，张宗昌便倾囊而出，做了8只金仙寿星。


    曹锟虽觉此人粗鲁，但忽然间得到如此重金和一员干将，顿时心花怒放，马上委以重任。


    张宗昌从曹锟那里讨得一个师的番员，开始招兵买马，但却遭到直系干将吴佩孚的竭力阻挠，最后师长未当上，礼也白送了，只好改投张作霖。然而此时的张宗昌已无钱送礼，于是就别出心裁，拎着两个大抬筐去见张作霖。张宗昌指着两个抬筐对张作霖说：“远道来投，敬献礼物，还望笑纳”。


    众人看着两筐土，不禁交头接耳，暗暗耻笑张宗昌。唯独张作霖不动声色地沉吟着，张宗昌毕恭毕敬地等待着，心中忐忑不安。终于，张作霖露出笑容，点头允诺接受张宗昌的礼物，命令副官将两筐土收好，并任命张宗昌为高参，还让张学良给张宗昌送上2000元费用。左右官员不明所以，问张作霖究竟是何意。张作霖得意地说：“告诉你们，那两筐土的意思是要为奉系添把土。挑筐一副而无扁担——权柄，不能发挥作用，所以希望我授他职权。”众人恍然大悟。事实上，张作霖、张宗昌都是胡匪出身，确有许多相通的地方。


    送礼还要送得巧，送的不巧，拍马屁拍在马蹄子上，还要反被踢上一蹄子。


    民国年间，吴佩孚坐镇洛阳，俨然成了高高在上的河南王，原来不可一世的督军张福来却成了受气的媳妇，在吴佩孚面前连大气也不敢出。


    1923年4月22日，吴佩孚50诞辰。吴本想借祝寿之机大肆张扬，扩大自己的政治影响，但他沽名钓誉，为表示清廉，特意在报上刊登启事，三令五申要“谢寿”。自讨没趣的张福来忽地觉得：别人不来祝寿可以，可我这个在吴大帅眼皮底下的官与人家不同——受气媳妇不给婆婆拜寿，恐怕将来没有好果子吃。再则，常言说，礼多人不怪。于是，带人抬着厚礼进吴府拜谒，恭恭敬敬施礼说：“特来恭祝大帅千秋！”


    吴佩孚本来就看不他，见此，气不打一处来，他一蹦多高：“你没看见我的启事？你有功夫来拜寿，为什么不抽出工夫管教你兄弟？你的兄弟与赵三麻子有什么两样？”赵三麻子是河南前督军赵倜的痞子弟弟赵杰，此人作恶多端，人们对他恨之入骨。


    张福来的脑袋雷击一般，嗡嗡作响，好半晌不敢抬起，斜眼一瞥，忽见很多人都在座，羞得他汗流满面，无地自容。他回去后大哭道：“大帅不给我一点面子，我再也不干了！”


    其实，吴佩孚也喜欢拍马、送礼者，只是要拍得恰到好处。此日，他正想显示一下“刚正”、“清廉”、“说到做到”。于是倒霉鬼张福来一下子拍到马蹄子上，被踢个不亦乐乎。


    #### 做上司肚里的蛔虫


    心理学认为，人们意见、观点一致时，彼此就会相互肯定，反之，就会相互否定。所以，那些缺德谄媚之徒，在谄媚巴结他的上司之前，总是先细细揣摩他的喜好，然后尽量迎合他，满足他的欲望。更妙的是，有的谄媚高手还能够抢先一步，将上司想说而未说的话先说了，想办的而未办的事先办了，把个上司乐得美滋滋的，自然，上司回报给下属的东西总是沉甸甸的。


    清末巨阉李莲英可谓揣摩高手。


    自进宫廷当了小太监后，李莲英从来不放弃任何一个巴结上司的机会。在一个偶然的机会，他从同乡太监沈兰玉的嘴里得知，西宫的懿贵妃因梳头太监们梳不出时新的发式，经常呵责他们；而深居宫廷之内的梳头太监们见闻狭窄，只会梳一些传统的发式，面对着骄横逸纵的懿贵妃，无法讨得她的欢心。李莲英得到这个消息后，经常借机溜出宫外，悄悄地跑进妓院，观察着妓女的各种新颖、时髦的发式，偷学梳头的技术。


    经过一番勤学苦练，他觉得接近懿贵妃的机会已经来了，就主动向沈兰玉提出，请他在贵妃面前美言几句，推荐自己给其梳头。


    沈兰玉一听这话，顿时脸色发白，嗓子眼都变细了，入宫多年的他，深知“伴君如伴虎”的危险，他赶紧说：“你这孩子，真是不知死活，人家躲都躲不开，你却偏往里钻，万一主子发了脾气，你一个人倒霉还是小事，要是殃及于我那可怎么办，我可担当不起呀！”李莲英慌了神，生怕自己这些日子的功夫白搭了，慌忙扑倒在地，连声哀求说：“大叔，小子这辈子全靠您搭救了，若有得罪，全在小子的身上，决不牵累于您。”沈兰玉经不住他的请求，借着一次请安的机会，向懿贵妃提及此事，懿贵妃见有人自荐梳头，真是喜不自禁，立即答应了这个请求。


    几天之后，李莲英跪在了懿贵妃的面前。颇有心机的李莲英，一边回答着懿贵妃的询问，一边给她设计着发型并揣摩着她的心理活动。经过一番叩头谢恩之后，莲英站在这位贵妃的背后，使出了浑身的解数，给她梳出了最时新的妓女发型。妆成之后，便垂着双手，低着脑袋，心里打着鼓，侍立在一旁。此刻的懿贵妃，对着大立镜，左顾右盼，上下端详，真是心花怒放：只见自己头上那蓬松的黑发，远看如双凤朝阳，近看似莲花出水，连绵层迭，雍容华贵，恰到好处的显示了自己的身份；尤其是那两根晶莹闪亮、缀着珠花的银簪，斜插在后脑的发髻上，与黑天鹅绒般的乌发交相辉映，显得人真是精神焕发、熠熠生辉；更使懿贵妃惊喜不已的是，自己那美中不足的长脸，经这么一打扮，竟一点也显现不出来了，于是，连日来因梳头引起的闲气，一下化为乌有。她不由得拍手夸奖说：小李子，可真有你
    的，留下来吧，好好为咱家梳头，有你的好处。看着懿贵妃的这份高兴劲，李莲英，还有沈兰玉的心都落到了原处。凭着他的心窍，不多久，他就被提升为梳头房的首领兼敬事房的首领和御前近侍。


    李莲英当上了梳头太监之后，时时事事察颜观色，不久便把慈禧太后的好恶全摸透了。所以，在日常生活中，凡事不等慈禧开口，李莲英往往就给准备得妥妥帖帖。因此，慈禧太后更加对他宠幸非常，甚至一刻也离不开他了。每逢李莲英休假之时，别的太监代他值班，没有一个不挨慈禧打骂的，因为这些太监都摸不准慈禧的好恶。后来这些太监竟纷纷到李莲英面前哀求，希望他不要休假。就是有一些嫉妒李莲英的太监，因为他深得慈禧的欢心而且别人也实在难以取代所以也不想给他进谗言了。


    然而，李莲英却并不以此为满足。他深知，为了保住自己的地位，必须一刻也不能失去慈禧的欢心。因此，他凡事尽量小心谨慎，去迎合慈禧的心意。比如，他值班的房间离慈禧住的地方很近，有时慈禧也过来坐坐。这本来是一件微乎其微的事，可是，狡诈的李莲英也用作此做了一篇“大文章”。他每逢慈禧来坐过之后，都把慈禧坐过的椅子用黄缎包上。在清朝，黄色是帝、后专用的颜色，其他人不准使用。椅子一经用黄缎包上，别人就再也不敢沾边了。值班的屋内共有十把椅子，慈禧先后坐过八把，这八把椅子一律被李莲英蒙上了黄缎子，十分醒目。慈禧得知以后，对李莲英的忠心、细心十分欣赏。


    还有一例。一次，慈禧到恭亲王奕䜣家去，途经李莲英府第，看见大门上贴着“总管李寓”四个大字，慈禧侧过脸去瞅了好长时间。慈禧这个小动作也没有逃过李莲英的眼睛。到了恭亲王府，李莲英立即向慈禧告了一会儿假，获准后，他急如星火赶回家中，从大门上揭去“总管李寓”的门帖。然后，又一阵风似地赶回慈禧身边，跪下禀道：“奴才在宫中当差，总也不回家。那些小太监不懂规矩，竟然在奴才家的大门口贴上总管的字样，刚才奴才发现了，立刻请假回家，把总管的门帖揭下，并把那个混帐的小太监打了一顿板子，送交内务府严办，以警效尤！”慈禧一听，不由得笑出了声，说道：“你处理得很好，就不用交内务府了。”李莲英可谓谨慎到家了。


    李莲英为了讨好慈禧太后，真可谓机关算尽，绞尽脑汁。在慈禧太后庆祝60岁生日的时候，李莲英又要了新的花点子。他知道慈禧过生日的那天要“放生”以积累“阴功”。于是，他事先买下了许多鸟，暗中进行训练，最后，把鸟儿驯熟了，打开笼子在外边飞翔一圈又自动回到笼中。


    慈禧太后在生日那天，来到颐和园的佛香阁下，只见在“云辉玉宇”牌楼下边摆着许多鸟笼子，里面关着各式各样的小鸟，叽叽喳喳、扑扑楞楞，好不讨人喜欢。在正晌午时，李莲英恭恭敬敬地请慈禧太后“放生”。慈禧太后逐一将鸟笼子打开，刹那间，百鸟腾空，纷纷飞走。慈禧太后放空了一批鸟笼子，李莲英吩咐小太监又搬来一批鸟笼，请慈禧太后再“放生”一次，就这样一连“放生”数次，鸟儿都飞走了。最后一次，李莲英把驯熟了的那批鸟儿拿来了。慈禧太后打开鸟笼，百鸟鸣叫着在空中飞了一圈又纷纷飞回各自的笼中。对此，慈禧太后很是纳闷，就问李莲英：“小李子，这些鸟儿怎么不飞走哇？”李莲英连忙跪下高声说道：“喳，奴才回老佛爷的话，这是老佛爷皇恩浩荡，恩泽及于禽兽，这些鸟儿对老佛爷感恩戴德，才不忍飞走哇！这也是老佛爷上承天意，下顺民心所致，是吉祥佳瑞之兆，老佛爷定然万寿无疆！”李莲英这些肉麻的阿谀之词，慈禧太后听起来虽然舒服，但是她也知道这是小李子在弄鬼，是事前把鸟儿驯熟了的缘故。慈禧太后怕周围的大臣耻笑她昏庸无知，于是，一反常态，对李莲英大加训斥：“胆大的奴才，竟敢在我寿诞之日，把驯熟了的鸟儿拿来让我放生，你如此这般，是想骗取赏银，还是存心愚弄我？”气氛一下子紧张起来，众大臣、太监和宫女们个个敛息屏气，面面相觑。阴险狡诈的李莲英却面不改色，只见他过来跪在慈禧跟前，从容容地说：“奴才万万不敢愚弄老佛爷，实在是老佛爷洪福齐天，上天才降吉祥。如果是奴才欺骗老佛爷，就请老佛爷以欺君之罪将奴才处置了！不过，在老佛爷降罪之前，奴才还有个大胆的请求。”慈禧太后脸都气青了，她压着火气说：“说吧，你这奴才还有什么请求！”李莲英磕了一个响头，慢慢地说道：“老佛爷放生的盛典还没有进行完毕，湖畔尚有百桶金色大鲤鱼，等待老佛爷放生。自古以来，有训练鸟儿的，可是还没有听说能训练鱼的。奴才恳请老佛爷放鱼，以测天意。奴才即或能训练鸟儿可断言不能训练鱼儿呀！放生鲤鱼之后，老佛爷再降罪不迟！”


    慈禧太后听了这番话，越过牌楼，走到昆明湖畔，只见一百桶大鲤鱼，金翅金鳞，特别好看。慈禧太后走到桶前，轻轻用手摸一下鱼桶，说了一声：“放。”小太监们便一拥而上，把一百桶大鲤鱼全都放到昆明湖中去了。岸上众人瞪大了眼睛，盯着水中那些鲤鱼，说也奇怪，那些金翅金鳞的大鲤鱼游走以后，打了几个旋，又都游了回来，排成一个大横排，整整齐齐地排列在昆明湖畔的石台阶下边，头朝着慈禧太后吹着细浪，好像在朝拜一般。岸上众人，包括慈禧太后一时都看呆了。


    这时，李莲英满脸春风，一团高兴，急步走到慈禧面前，双膝跪倒，朗声说道：“启奏老佛爷，上天有眼，老佛爷洪福齐天，爱民如子。今天老佛爷寿诞之日，天降吉祥，放鸟，鸟不飞走；放鱼，鱼不游去，这是有目共睹的吉祥瑞兆，哪里是奴才指使的呀？这是天意呀！若说奴才愚弄老佛爷，奴才万万不敢，若说今天奴才要讨赏银，却是要讨定了！老佛爷万寿无疆！”说罢，一连叩了三个响头，手舞足蹈地仍不肯站起来。众大臣和太监、宫女们也跟着起哄，一齐跪下，高呼万岁。这一来，把慈禧太后乐得眼睛眯成了一条线，飘飘然起来。当下把自己脖子上戴的朝珠拿下来，赏给了李莲英，众人又是一阵高呼万岁！


    难道真是像李莲英说的那样，鱼儿不游走，是天降吉祥吗？当然不是。据爱新觉罗·溥佐先生说，奥妙仍出在李莲英之手。原来，李莲英事前弄来许多鱼虫，装在一个个小纱布口袋里，把这些小纱布口袋固定在湖边石阶下边的水里，鱼虫可以从纱布口袋的网眼中逐渐游出去，这样，台阶下边的水中，便集中了一大片鱼虫。当鲤鱼被放生以后，发现湖边台阶下有许多鱼虫，自然游了过来吃鱼虫，从而自然排成一列，乍看去，好像朝拜一般，其实是在那里觅食。李莲英就用这样的手段，神化慈禧太后，以讨得她的欢心。


    民国怪人戴季陶，一生疯疯癫癫，做了许多怪事，但他精通政治权术，善于揣摩上意，很能体会蒋介石的意思，关键时刻总能帮蒋介石一把，因而在民国官场立于不败之地。


    西安事变和平解决后，在国民党五届中央执委会第三次全体会议上，蒋介石决定辞去行政院长之职，各方以为宋子文救蒋有功，行政院长非其莫属。果然蒋推宋子文继任，无人异

