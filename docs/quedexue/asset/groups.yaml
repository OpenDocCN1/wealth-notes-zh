    # 缺德学原理


    产阶级文化大革命就是好》。原文如下：“无产阶级文化大革命，就是好来就是好就是好。就是好！就是好！就是好！”这哪叫唱歌，简直就是吵架。谁敢说不好，不然就给你踏上一只脚，让你永世不得翻身。我常常出神地想，或许缺德学就是这样产生的。不难看出，缺德理论中的皮厚一开始就是和假、大、空紧密相联的。其中，“假”又最为活跃。以自我为中心者往往容易“皮厚”，大到领袖，小到众庶，莫不如此。


    一个只有小学文化水平的爱情骗子可以冒充博士、教授；一个名不见经传的无名之辈可以在一夜之间成为名人、作家、导演；一个身无分文的小丑能够在乔装打扮后出入豪华酒楼，自吹为董事长、经理、厂长。皮厚的优势就在这里。一位习惯沾花惹草的花花公子曾恬不知耻地吹嘘自己的“花道”说：“人有多大胆，地有多高产。”那意思是说，只要你敢于去耍流氓，你就能获得“艳福不浅”的享受。的确，从他嘴里吐出的东西无不带有一定的颜色。一般来说，男女第一次约会总免不了害羞，在舞场里跳舞也少不了羞涩，可我们这位公子哥儿却从未有这种感觉。在光线暗淡的舞场里，他会把一个不曾相识的姑娘搂得紧紧地；如果是别人介绍，也并不给中间人留一点面子，硬是把人家少女往怀里拉，而且大有不到手誓不罢休的欲望。更有甚者，他会在大街上冷不丁盯上一个如花似玉、风姿绰约的妙龄女子，立刻上马，一追到底，直到达到目的为止。按理说，同性相斥，异性相吸。这无可非议。连《诗经》上都说：“关关雎鸠，在河之洲；窈窕淑女，君子好逑。”一贯主张“好色而不淫”的孔子尚且不那么“保守”，更何况两千年之后的“我们”呢？问题的关键是，我们能否像这位先生那样，“好色而且淫”。当这个色狼四处为虐时，我们能不为之情'
