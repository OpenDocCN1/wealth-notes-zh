    陈因营救关系和孔祥熙处得不错。正好孔祥熙的长子孔令侃也在香港，孔让其子就近去看陈，陈向孔令侃表示，他很想在国家对外作战时，出来为国效劳，以尽匹夫之责。孔令侃将此话电告孔祥熙，孔立即据此向蒋介石推荐，但蒋介石出于成见，以陈不会说中国话不适应在国内服务为托词，拒绝任命，孔只得作罢。陈友仁做过孙中山的英文秘书，国家民族意识非常浓厚。孔荐举虽不顺利，却很推崇他。后来日本占领香港，陈友仁不屈不挠的精神传到孔祥熙耳中，孔曾不止一次称赞陈友仁不失丧国格。


    抗战期间，孔祥熙曾派报界闻人薛大可秘密潜伏上海，担任分化敌伪工作。薛在工作期间，曾与汪伪政府梁鸿志保持联系。梁曾向薛汇报过一些敌伪政府机密，并帮助营救过辅仁大学法学院长董人骥等人。抗战胜利后，国内惩治汉奸的呼声震天动地，那些与沦陷区内伪政府人员保持秘密联系的国民政府官员，为了避嫌，不敢出面澄清是非。孔祥熙电促薛大可出庭作证。但由于梁鸿志罪大恶极，法院申明功不抵过，判处死刑。孔祥熙明知国内对汉奸议论鼎沸，而竟冒天下之大不韪，受到多数人的指谪，说他“爱憎不明”，但梁鸿志本人是很感激的，临死前曾向孔函谢，说孔祥熙“古道热肠，不遗患难待罪之身”。


    中庸本是一种折衷哲学，有帮好人的时候，也有帮坏人的时候。然这正是孔祥熙的处世原则。


    # 忍一时海阔天空


    在官场混，总会碰到许许多多麻烦的事，权势过甚，君'
  - '[PAGE 232]


    上、上司会误解你；才能超人，同僚会妒忌你；铁面无私，下属会怨恨你。如果你事事都要争个是是非非，弄个明明白白，只会招来更多的麻烦，甚至还有杀身之祸。怎么办？一些聪明的人常用“忍”来化解矛盾，渡过险滩，或以“忍”来等待时机。


    忍是大智。


    唐代名臣郭子仪是四朝红人，权倾朝野。他为官的诀窍就在于忍和慎。


    鱼朝恩是皇帝身边的宦官，此人虽无才情，但会溜须拍马，所以为皇帝宠幸。他对郭子仪的才干、权势十分妒忌，曾多次在皇帝老儿面前打小报告，诽谤攻击郭子仪，却没有成功，愤怒之下，竟暗中指使人盗挖郭家的祖坟。


    郭子仪知道这是鱼朝恩的卑劣伎俩，当时他身任天下兵马大元帅，手握重兵，一举手、一投足，都关系着大唐帝国的兴亡，连皇帝都敬着他三分，要除掉一名鱼朝恩，真可谓不费吹灰之力。当他从前线返回朝廷时，满朝公卿都以为他必将有所行动，岂料郭子仪却对皇帝说：“我多年带兵，并不能完全禁止部下的残暴行为，士兵毁坏别人墓坟的事也很是不少，我家祖坟被掘，这是臣不忠不孝，获罪于上天的结果，并不是他人故意破坏。”


    祖坟被挖，历来被视为奇耻大辱，而郭子仪却能隐忍下来，足见他的气度之大。也正因为他能曲能伸，能忍能让，他才能在那个奸佞横行、国君昏弱的时代，逢凶化吉，度过一次又一次政治险滩，享尽富贵，以85岁的高龄，安然辞世。


    其实，以忍化凶之道，不仅良臣君子懂得，奸臣枭雄也不糊涂。'
