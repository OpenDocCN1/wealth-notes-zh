    # 缺德史话


    死不能，欲走不放，并时时受到嘲弄的“媳妇”。这位女大学生之所以受骗，倒不是她贪什么便宜，她只是看到这位老大姐对她热情相待，说话投机，招架不住骗子“见面熟”、“套近乎”的进攻，甚至说心里根本没有设防，想不到笑后的藏刀，反而以热对“热”，以诚换“诚”，当邀她去玩时，不便拒绝，因而才上了当。


    # 扶不起的阿斗不帮


    为人处事，求官从政，需要智慧，需要眼光。当某人处逆境，遭厄运时，适时拉他一把，帮他一忙，会使他感激万分。俗话说，滴水之恩，当涌泉相报。


    中国人是重情分的。倘若某人日后交上好运了，飞黄腾达了，多是会忘记在困境中帮助过他的恩人的，总会以各种方式报答他的恩人。即使某人不讲感情，但为了标榜自己的成功，或求得心理的平衡，也会显露一下自己的“义气”。如此一来，帮他的人就有回报了。当然，真正乐于助人的人，是不图回报的，也许他们早就把帮过的人忘了。所以在回报面前，他们会显得不安，总觉得这是“我应该做的”，何必斤斤计较？


    不过，贪财图利的缺德之辈，可不这样想。他们帮人的目的是为了获得巨额的回报。他们在帮人之前，先要算计一下，看看这样做是否值得，是否百利而无一害。所以他们帮人是有前提的，没有前途的弱者不帮，扶不起的阿斗不帮，不懂“礼尚往来”的不帮。所以，他们不是出自内心的帮人，他们虽助人却不快乐，因为担心肉包子打狗，有出无回。以最小的投资换取最大的利润，才是此类人的真正追求。


    在这方面，吕不韦堪称典范。'
