    我归隐；再说，即使归隐，也找不到一块能容纳我郭府一千余口人的隐居地呀。可以说，我现在是进不得也退不得。在这种情况下，如果我们紧闭大门，不与外面来往，只要有一个人与我郭家结下仇怨，诬陷我们对朝廷怀有二心，就必然会有专门落井下石、妒害贤能的小人从中加油添醋，制造冤案，那时，我们郭家的九族老小都要死无葬身之地了。”


    儿子们听了都心悦诚服。


    # 好人要帮，坏人也要帮


    不偏不倚，亦即中庸。这是儒家思想的精髓，也是不少人做官处事的法宝。持中庸之道，不得浮躁，超然于派系斗争之上，不过分亲谁，疏谁；持中庸之道，良心不能大大的好，见人搞阴谋活动，要装瞎子，听人拨弄是非，要装聋子；持中庸之道，也不得讲原则，好人要帮，坏人也要帮。持中庸之道，得削磨棱角泯没个性，似人似鬼，任人评说；持中庸之道，也不等同消极软弱，见利得当机立断，毫不手软，但进得快，退得也要快，见好就收，知足常乐。


    由此以来，你的敌人就少，你的形象就好，你的官位就稳。


    不信，就瞧瞧徐世昌。


    徐世昌，人称“三朝元老”。慈禧掌权时，他做过军机大臣；载沣当政时，他做过邮传尚书；袁世凯任总统时，他做过国务总理；段其瑞执政时，他做过总统。可以说，他是个地道的不倒翁。


    在军人横行乱世，一个无兵、无地盘的文人，何以位及显'
