    # # 缺 德 学 · 171 ·


    如果能到京师，那就只等谁卸任，贬谪了。

    为了到京师去，严嵩进一步施展了奴颜婢膝、俯首帖耳的“功夫”。当时的官场风气论资排辈十分讲究，而内阁阁员中一般人的资格都不如严嵩。1536年，严嵩以祝贺皇帝寿辰的名义到了京城，夏言为报跪请之谊，以首辅的身份向嘉靖皇帝说了严嵩一大堆好话，为他谋得了一个更高的职位，使其进入了和内阁基本持平的权力机构。只要能够达到自己的目的，这严嵩可是谁的屁屁都能拍，什么手段都敢使的。


    现实生活中，以甜言蜜语包藏蛇蝎之心者大有人在，而听信甜言蜜语上当受骗者也比比皆是。


    《女子世界》1990年第4期曾讲述了一个大学生被拐卖的故事，现抄录如下：


    1989年5月2日，河北省邢台师专女生C从学校来到汽车站，想到邯郸去看一位老同学，后又犹豫不决。因为明天就要开学了，便蹲在书摊前翻书。这时来了一位操外地口音的老大姐也来翻书，一搭上话，她马上被老大姐的热情包围了。

    “小妹，你来车站准备出门吗？”

    “我原想去邯郸看老同学。”

    “太巧了，我就是邯郸人，我们一同走吧！”

    于是，被“笑脸”拉上了长途汽车，接着，就是一路红火投机的谈话。

    “这老大姐真好。”C女心想。

    车到邯郸，老大姐又邀C一同吃饭。饭后不久，C便有了困意。老大姐再次邀她到自己的“厂子”里去玩。C拒绝不过，就被老大姐拉到一辆红星牌中型轿车上。

    醒来已到山东一家人家里，并被说成受一桩“黄金案”的牵连不能放她走。两天以后，她被以价码3800元转卖到杨家，成了欲'
