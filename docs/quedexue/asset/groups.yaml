    # 缺德史话


    玄宗听后，“叹叱久之”，只好授以詹事，令其“东京养疾”去了。李林甫就这样将严挺之挤齐于朝廷之外。


    凡是玄宗意欲重用之人，李林甫都要加以压制和打击。汴州刺史、河南采访使齐澣，“亦朝廷宿望”。故被李林甫忌之，亦与严挺之一样，落个“东京养疾”的下场。


    公元742年7月，牛仙客死。8月，以刑部尚书李适之为宰相。李林甫视其为竞争对手，便伺机加害。利用李适之性情疏率的特点，李林甫对其言道：“华山有金矿，采之可富国，主上未知之。”隔了几天，李适之便将此事上奏玄宗。玄宗非常高兴，又问及李林甫。李林甫说：“臣久知之，但华山陛下本命，王气所在，凿之非宜，故不敢言。”玄宗听了，以为李林甫对自己忠心耿耿，而李适之考虑事情不周到，便对李适之说：“以后奏事，宜先与李林甫商量，不得鲁莽轻率。”李适之从此便束手，渐渐被玄宗所疏远。李适之所奏，乃是受李林甫的怂恿，而李林甫则又在唐玄宗面前番花言巧语，将李适之陷于被动地位。


    在耍弄“口蜜腹剑”术方面，明代权臣严嵩也算是个人物。年轻的严嵩本以为凭才学见地竞争便可出人头地，结果却败得一塌糊涂，他再也无法忍下去了，于是递上报告，病休十年。


    十年中，严嵩表面上手捧经书苦读，暗中却密切关注着政治的动态。经过潜心研究，他知道取得高位必须有进身之阶，除了本身的资格，还要有靠山。没有别人的肩膀，就没有自己的高位，于是，他一面写文章，结交文人墨客，一面利用一切机会巴结在他前后进士及第、已经掌握权柄的人，随时准备投身于政治漩涡里去拼杀一番。


    # 缺德学


    机会终于来了。刘瑾垮了台，一夜之间从天堂跌入地狱，但钱宁和江彬继续刘瑾的把戏，政局日益混乱，接连三年间出现了几件大事：其一，皇帝为应州大捷封赏5万余人，而应州大捷不过是皇帝亲自指挥，死了几千士兵，只割了十六个鞑靼骑士脑袋的一场大败仗；其二，新科状元舒芬等107人劝谏皇帝不要再贪玩废政，竟被罚跪露天地5天，再加廷杖，死掉12人；其三，宁王朱宸濠在南昌兴兵反叛了朝廷，朝中上下一片恐慌，几经兴师动众才得剿灭。严嵩非常激动，所谓乱世出英豪，“安知治天下者不是我？”于是，这位苦苦修行的不安分者，离开书斋，正式宣告回朝。严嵩，这个明代最大的奸臣，从此迈上了阴谋家政治舞台的第一步。此时，他已40岁。


    严嵩回朝以后，施展了他多年钻研的进官之术，对内对外，一团和气，极大的野心包藏在柔媚的外衣中，回朝一年，由七品编修升六品侍讲。经过不懈努力，又过几年，熬上了南京翰林院学士，属正五品。嘉靖六年，48岁的严嵩被召为国子监祭酒（国立大学校长），属正四品。升迁虽然不慢，但严嵩仍不满足，因为20多年过去，原同榜进士翟銮，甚至比自己晚16年中进士的张瑾都已入阁，自己却连给皇帝提供“参考”的机会也没有。想想自己的年龄，强烈的“紧迫感”促使严嵩决定加快入阁的进程。


    嘉靖皇帝有一个特殊的爱好：爱方术，崇道教。他少年即位，政事、女色使他的健康大受影响。“只缘多病，故求长生”，嘉靖帝一边服长生药，一边斋醮祈祷鬼赐寿，于是方士道士常出入帝王宫殿，宫内也设牌立位，到处道气仙风。嘉靖三年，龙虎山上清宫道士邵元节还被征入京城，尊为“致一真人”，建真人府，赐彩蟒衣，以备斋醮祈祷之时随请随到。


    # 缺德史话


    斋醮活动，需要焚化一篇青丝红字的骈俪体表章，奏报“玉皇大帝”，叫做“青词”。“青词”既要表现对玉皇大帝的奉承景仰，又要表明祈求愿望，多出自大学士之手，不少人因此取得了皇帝的恩宠。张璁从翰林到入阁不过六年；桂萼竟打破“故事”，全不按提拔规矩，以“礼部尚书兼翰林学士”入阁，固然有主张尊崇朱祐杬的原因，也和“青词”的写作大有关联；顾鼎臣只因七章“步虚词”就特受恩惠，连升连提。


    皇帝的“胃口”被严嵩瞧准了。他千方百计地把自己写的“青词”奉给嘉靖帝，一次不中再来一次。终于，嘉靖帝感动了，召见了严嵩。看着这位干巴巴，眉毛都已经发稀的老头儿，嘉靖帝觉得找到了一匹温顺恭谨的老马，肯干，朴诚。于是嘉靖帝给了他一个礼部右侍郎的名衔，并“开恩”地委派他代表自己去祭告父亲的显陵。


