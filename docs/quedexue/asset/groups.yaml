    ## 缺德学 · 155 ·


    1928年6月4日清晨，张作霖所乘的专列在皇姑屯附近被炸。一度自称是中华民国陆海军大元帅的风云人物张作霖身负重伤，折断一臂，张作霖从被炸毁的车厢里被抬出来后，虽经立即抢救，终因伤势过重当日午去世。这就是当时震惊中外的皇姑屯炸车事件。


    1928年日本关东军高级参谋河本大作就奉命制定暗杀张作霖计划，着手物色暗杀小组成员。他吸收的第一个成员是刚从参谋本部调关东军不久的川越守二大尉，此人平时沉默寡言，干起事来却异常果断，因此被河本看中，另外两名组员是工兵科出身的菅野大尉和从朝鲜龙山派来的独立工兵第20大队的中队长神田泰之助中尉。这是因为河本与川越商量暗杀方案时，一致认为采用爆炸专车的手段最为有效，所以这两名工兵军官，便被他罗织入伙。此外，还有一个是担任南满铁路跨线桥上警备任务的独立步兵第二大队守备队长东宫铁男大尉。据日方资料，当时为炸车需要大量炸药，河本怕暴露形迹，决定采取迂回手法从关东军那里得到炸药。当时正好关东军在旅顺工科大学设立了炸药讲座，川越听到这个消息后，就自荐担任这个炸药讲座的学科教师，让工兵出身的菅野大尉指导实习讲课，并且提出应由兵器部供给教学所需要的炸药。剩下的问题是选定实施爆破的地点。河本他们接连考虑了三个地点，最后选定皇姑屯附近的京奉、南满铁路交叉点。这个交叉点奉军的岗哨警卫松懈，而且负责桥上守备任务的正是东宫铁男大尉的部队，对于掩护和接应爆破行动有许多便利条件。此外，东宫的守备队哨所与奉天城内的关东军司令部有军用电话相通，河本可以用电话直接指挥现场行动。


    确定地点后，菅野大尉精确计算进行爆破所需的炸药。可是如何把炸药运到爆破地点，是个棘手的问题。河本在多次侦察地形时偶然发现了一个情况，原来在京奉、南满两路交叉点的跨线桥前15米远的路轨旁边，排列着几十个沙袋，他看到距此200米远的南面高粱地中，有一间关东军守备队的哨舍，河本想出了偷梁换柱的计算。河本让守备队长东宫大尉把沙袋里的沙偷偷换成炸药，炸药的引爆装置就设在那里梁间200米外的守备队哨舍里。为了万无一失，特意安装了两个起爆按钮，连接在通往炸药袋的电线上。另外河本还指示东宫大尉组织突击队，一旦张作霖伤而未死，准备在列车遇炸的混乱时刻，乘机冲上列车把张作霖杀死。这样河本已殚精竭虑，布成了谋杀张作霖的“必死之阵”。河北以及京奉铁路沿线要地配置人员，以便随时核实张作霖是否在车上。


    河本不仅布下了谋杀张作霖的必死之阵，为了逃避罪责，嫁祸于人，还在炸车事件发生前后故意大摆疑阵，企图把水搅混，转移世人视线。河本在奉天找了三个吸毒的无赖充当这次炸车事件的替死鬼。


    6月3日凌晨，在北京的竹下义晴武官从车站匆匆送走张作霖后，立即用暗号给河本拍发电报：“三日，午前一时十五分，特别列车从北京发车，‘那个人’在第八号车厢。”竹下的电报像是一道行动命令，立即启动了河本计划的整个机器。京奉沿线的情报人员也都陆陆续续电告张作霖专车的通过时间。6月4日午前4点来钟，已经确认张作霖乘坐的专列离开了距离终点奉天车站只有10分钟路程。列车速度降低为每小时10公里。早已接到河本命令的东宫大尉，这时紧张地站在铁路边。5时20分，随着铁轨的颤动声远远望见一条黑色长龙亮着前灯徐徐驶来，东宫叫了一声“来了”，举手一挥，埋伏在路边高梁地里的十余各突击队员立即散开隐蔽。东宫急忙跑进哨舍，把手指放在起爆按钮上，屏息注视着迫近的列车，好不容易等到第七节车厢进入爆破地点，便用力按下按钮！与此同时，旁边的神田中尉已经按下备用按钮，顿时轰隆一声，鲜红的火焰随着巨响冲向天空。东宫注视着烈火包围着车厢，断定张作霖已经丧命，认为没有必要再使用突击队，于是立即下令总撤退。东宫大尉完成了爆破任务，马上命令部下卷收引爆用的电线。部下退去后，他还用长靴的靴底仔细擦起电线压倒的野草，直到完全消除了电线留下痕迹，才从容不迫地离开现场，去向河本复命。此后日本军国主义分子照搬皇姑屯炸死张作霖的嫁祸于人的手法，又于1931年9月18日夜袭击沈阳城外文官屯南柳条湖附近南满铁路，随即反诬中国军队所为，命关东军进攻沈阳，开始长达14年的侵华战争。


    ## 大发死人财


    凡缺德邪恶之辈，生为的只是两个字：名、利。名者，既想当婊子又想立牌坊之谓也。但名最终也要落实到利上。他们或者先追求名，后追求利，或者以名来攫取更多的利。总之，在他们看来，名是虚的，利是实的，名是手段，利才是目的。而且他们的贪欲从无止境，越有利越想捞取，以致到了疯狂不能自拔的地步。古人云，人为财死，鸟为食亡。这话过于片面，实际上，真正为财而死，因财而亡的，只是那些贪得无厌的邪恶小人。真正的君子懂得适可而止，节欲而安。然而，小人是婊子，婊子是当定了，但又怕世人耻笑，斥责，于是想方设法立个牌坊，以证明是清白的，廉正的，于是他们就要巧立名目，或者损公济私，大发国难财；或者操办丧事，大发死人财；或者栽赃陷害，大发横财；或者卖官鬻爵，大发活人财；或者勒索百姓，大发黑财。或者……名目繁多，冠冕堂皇。


    贪婪之徒也是五花八门，有皇帝、总统，也有宰相、部长，还有商人、文人。正是有了他们，社会才有好人坏人之分，正是因为他们的贪婪疯狂，社会才不安宁，百姓才受苦。所以，贪婪之徒该杀、该改。


    这里例举几位贪婪小人，供善良的人批判。


    奸相秦桧利用职权广置家园，扩张产业，害国害民。


    先说高宗对他的赏赐就不计其数。绍兴十二年（1142年）刘光世病死时，高宗把刘的建康园赐给秦桧。秦桧改封益国公时，高宗又“划筑大第，穷土木之丽以赐桧”。后来还把著名的永丰圩赐给秦桧。永丰圩有田千顷，每年可以收租三万石。后因发水，圩岸被冲毁，秦桧即命丁祀为副总管“往集其事”。不久，又由其亲信户部侍郎徐宗说奏请派司农寺丞兼权户部郎官钟世明“前去措置，从之。”秦桧对于处理朝政大事，其“文案壅滞皆不省”，而对于修永丰圩，却怕丁祀，钟世明办不成，又特派龚鉴为本路提举司属官，“俾役其工役”。当时由于水灾，农民已“流徙过半”，但丁祀、钟世明、龚鉴等人为给秦桧修圩，却不管人民的死活，“所役夫万千，人之死者甚众”。之后，秦桧还滥用公款“修筑堤岸，自此水患及于宣、池、太平、建康”四个州府，田园被淹，生产锐减，人民苦不堪言。


    秦桧并不以赏赐为满足，他还利用各种卑劣手段巧取豪夺。张俊的房地产日收二百贯，俊死后被秦桧夺为己有。他还恣意兼并农民的土地，在“金陵，田业甚富”。为了榨取农民的血汗，他还派官吏去管理。如：权尚书部侍郎徐宗说“附秦桧以至从官，常为秦桧营田产，时人因目宗说为庄客”；右宣教郎、新通判湖州余佐“与秦桧管庄，苟贱无耻”；临安府守臣曹泳推荐监激酒库龚釜给秦桧“掌平江府、秀州庄产”。这些人倚仗秦桧的权势，欺压百姓，如龚釜管庄时，对其所管的田都要逐块察看，发现有“瘠薄者，即追售田之人，勒偿元值，民甚苦之。”他们还“常骑巨牛，纵食人禾麦，民请不悛。”他们以刮削民脂民膏为能事，“岁斋租入诣秦府”，供秦桧一家过着穷侈极欲的糜烂生活。当时国家财政不足，以“秦氏之家，金珠充物”，“教坊所汰之人，埏皆养之于家，以奉歌酒之欢。”“秦桧的家人一二百钱物，方得过一日，”秦家一次宴会就用钱“数百千”，“一领汗衫，止得数日，即弃去”。


    秦桧在任相期间，还倚仗权势敲诈勒索，贪污舞弊，贿赂公行，横行霸道。


    秦桧一向诡计多端，谋财有术。绍兴十年（1140），他以宋金战争“预备犒赏”为名，要老百姓“计亩率钱，偏天下五等贫民，无得免者”。但钱银聚敛以后，“兵未尝举”，他就丧心病狂地把这些银钱都吞为己有，发了国难财。


    至于贪污受贿，更是花样百出。他每年生日，臣僚都要献金为他祝寿，“金玉劝盏，为不足道，至于搜尽世间之稀奇以为侑。”有些官员想填补“监司帅守”之缺，他照例要索取珍宝，或行贿“数万贯，乃得差遣”。由于秦桧私自公开鬻卖官爵，贿赂公行，所以他的家门如市。“馈送四方，大帅、监司，君守，馈送无虚日。”曹泳为了媚奉秦桧，“将官钱、官物，馈送桧之父子”，“于常例外，辄更增添，如买花石，献时新，搜求难得之货，不可缕数。”吕愿中为了升官，“强买部民玩好古器”献秦桧。荆湖南路转运判官周坚，更是将“宝器奇玩，倾倒归于宰相秦桧之室。”总之，当时百姓百官献给秦桧的“黄金白璧、明珠、大贝、象犀、锦绣奇怪之物，车连载，舟衔尾，相属于水陆之道，昼夜不绝”，“外国珍宝，死犹及门。”何仅如此而已！尤其是那些利欲熏心之徒，惟恐馈送黄金等物不足以欢秦桧之心，更是在献物上搜尽枯肠，大用功夫。右承议郎、知信州林机，要“为桧搜求水精（晶），民极以为扰。”方滋“帅广东，为蜡炬，以众香实其中，遣驶卒持谒相府。”后来，有一次秦桧宴客，就点燃此蜡，“异香满座”，“秦大喜，以为奉己之专也，待方益厚。”四川宣抚使郑仲在秦桧修秦相府格天阁完工时，献上“锦地衣一铺，秦命铺阁上，广袤无尺寸差”，也在四川当官的符行中、郑蔼对秦桧的“馈送不可计，虽空书，亦于书匣中用金狮二枚坐书。”似此之类的行贿，真是不胜枚举！


    当时的许多官吏不但对秦桧，而且对秦嬉也是照样地奉承。秦嬉回建康扫墓路过镇江府时，镇江驻扎御前诸军都统制刘宝，即“遣所部以绣旗二万迎之，喜。”秦嬉过平江府时，“守臣汤鹏举先往吴江道周，伺候数日，迎送甚谨。”秦嬉到秀州时，江南西路安抚司参议官张瑜，“作衮绣堂，绘桧、嬉父子像于中。”由此，张瑜获得了秀州知府的官职。在秦桧两次为相专权的几十年中，秦嬉“无日不锻酒具，治书画”。就连崇国夫人丢失了一只狮猫，也“限令临安府访求。”府尹马上兴师动众派人四处寻找，到了期限仍未寻着，府尹即“捕系邻居家”来审问，且“欲劾兵官，兵官惶恐”，把大街小巷的狮猫“悉捕”，送给崇国夫人辨认，但皆非也。府尹又买通其家人询问狮猫的形状，请人画了一百张图形，“于茶肆张之”，但仍无下落。最后，府尹只好去请求“嫠人祈恳”崇国夫人开恩，才免于罪。这场寻猫怪事，竟闹得满城风雨，鸡犬不宁，居民被捕，兵官惶恐，府尹受惊。可见秦桧一家仗势欺人，何其甚也！


    秦桧贪污舞弊，贿赂公行，其家“富敌于国。”秦府的府库财富超过了高宗的“左藏数倍”。凡宫廷所稀缺的物品，他家都尽有。有一次，高宗需要“白脑为药”，而内库欠缺，即“求之秦桧取一匣进之”。打开匣内一看，却有“书题名衔”，原来是个西经略使方滋送给秦桧的。此事连高宗都觉得惊讶，他感叹地说：“御前未尝有如此白脑片子！”秦桧的妻子王氏经常出入禁宫中，有一次显仁太后对她说：“近日子鱼大者绝少。”王氏说：“妾家有之，当以百尾进。”她回家把此事告诉了秦桧，“桧咎其失言”，即责怪王氏不该把真情禀告太后，万一高宗知道此情会怪罪于他。秦桧召集馆客商量对策，结果用青鱼百尾代替子鱼奉送进宫。显仁太后见时大笑王氏为村婆子，把青鱼当成了子鱼。其实，倒是她自己被老奸巨猾的秦桧蒙骗了。


    慈禧太后的幸臣、清朝的大太监安德海的母亲死了。安德海为了给他娘出大殡，花银子像流水一样，光慈禧赏给的那5千两银子够吗？不够。那么他从腰包往外拿吗？不拿，既然不够，他又不向外拿，那指着什么出大殡啊！安德海就是办法多，他既不向来宾客分配上礼的数目，也不派人暗示，刮什么口风，他在出殡的头一天，让人把青县的知县时启强叫来了。


    本来这一个多月，时启强在汤庄子颠前跑后，他以为只剩下最后几天了，可以松一口气了，哪知这个时候派人把他叫来，他的心头小鹿似地扑通扑通直跳。他知道他是飞黄腾达，青云直上，还是卷行李回家抱娃子去，全在这位安大总管安德海的一句话上，说个好，他这七品县令就抖起来啦，说个破，他这官就算完啦，他心里能不扑通吗？


    一见安德海他首先叩头，起来后才小心翼翼地问道：“安大老爷，把卑职唤来，有何吩咐，卑职也好立即去办。”


    “好！”安德海半笑不笑地说，“起来，起来！我母亲明天发丧出殡，你打算怎么办？”


    时启强知县，多少天来，犯愁的就是这件事，上礼上少了，怕安德海不痛快，自己丢了官，十载寒窗不易。可是拿多了，又拿不出来，若是刮地皮，又怕有人向安德海禀报了。因为这儿是安德海的家呀。这又是一条罪名，他跟刑名师爷商量过多次，也想不出个办法来。


    可是怕什么就偏偏遇到什么。今天安德海当面锣对面鼓地提出来，想躲也躲不了啦，只好扑通一声又跪在地上。一边叩头一边说：“回安大老爷，卑职是两榜出身，十载寒窗家中又很清贫，到任才一年多，每年的年俸
    200 两银子，加上养廉银 240 两，总共才 440 两银子。不瞒总管大人，这青县是个苦地方，老百姓靠的是吃糠吃黄汤菜和黄菜盘子来度日，卑职怎忍心再去向他们身上榨油，所以我，我……”哆哆嗦嗦地“我”了半天，也没说出个子午卯酉来。


    “罢了，不要往下说啦，我听明白你的意思啦。”说到这儿，安德海把话锋一转，“到我这来吊祭的官员，就数你官职小，到你随礼上账的时候，怕你给我家乡丢人，我才提前把你叫来，好早些做个准备。”


    安德海这话的含义，时启强还摸不清楚是个什么意思，他那心里的小鼓敲得更厉害了，赶紧磕头说：“是，是，卑职一定遵照总管大老爷的吩咐去办。”说完又磕了一个头。


    安德海好像猫玩老鼠玩够了一样，这时才微笑着说：“起来罢！”时启强知县磕了一个头谢了恩起来，猫腰躬身立在一旁，听候安德海的吩咐。


    “我知道你是个穷官，家里没什么东西，上任不久，也没多少钱，话又说回来，让你刮了青县的地皮来孝敬了，我也从心眼里过不去，咱们这么办，既给我挡了脸，又不让你做鳖子，你从我这里拿十个大元宝去，到随礼的时候，你先上账，让他们看着，明白我的意思了吗？”


    安德海朝外拿银子，给他时启强做脸，这是他时启强做梦也不敢想的事，乍一听他还真愣住了，疑惑自己的耳朵听错了，他一时答不上话，直直地站在那里，不知所措。


    安德海白了他一眼说道：“嫌少吗？你要想一想，再多了别人就没法拿啦。”


    时启强知县这回完全明白了，赶紧又鞠了一个躬说道：“下官明白，下官明白，下官不是嫌少，只是对总管大老爷对下官的如此关怀，感恩莫铭，感恩交集之时，不知用什么语言来表达下官的心意，望总管大老爷恕罪。”接着又请了一个安。


    安德海一听是这么回事，暗想：这官还算有良心，将来得提拔提拔他。于是点头道：“没有别的事啦，你到账房去领银子吧！”


    时知县退了出来，擦了擦头上的汗水，暗道：“谢天谢地，不知道哪一辈祖宗做了积德的事，让我脱过这一大难，一定派人回家祭祀。”时知县心里揣着鬼，到账房领了十锭大元宝回来。


    ## 口有蜜，腹有剑


    次日收礼，安德海的管家李莲英让青县知县先上礼账，时启强说：“为了悼念总管大老爷的太夫人归天，特奉献素绢十匹，素缎十匹，素绸十匹，百两一锭的大元宝十锭，礼物甚微，聊表寸心。”他说完，李莲英还怕别人听不清楚，又把时知县所随的礼朗声念了一遍。


    这下子在场的所有官员乱了营：一个小小的七品知县竟然随了一千银子、三十匹绸缎的厚礼，他们这一品二品或者三品四品的该上多少？上北京来不及了，只好从河间府、肃宁、献县、任邱、青县、静海、沧州等府县国库中暂借。这回数目都上去了，再没有人随一匹绸子两匹缎子的了，都是两千两、三千两、五千两……连李鸿章也是被抬得从天津急借二百两白银上礼。


    安德海死了娘，绸缎布匹不说，光银子就赚了几十万两，堆在一起跟小山一样，安家发了，百姓苦了。有人给安德海编了个顺口溜：娘死发财几袋满，将来爹死照此办。若是娘多爹无数，财源茂盛达三江。


    莫要以为缺德小人似“文革”年代“样板戏”中的反面角色，生得丑陋，长得阴险，说得刻薄，一看就不是好东西。而实际上，邪恶狡诈之徒，从外表看，大多有模有样，冠冕堂皇，有的甚至斯文尔雅，一派知书达礼的书生像。但是所有这些是做出来的，装出来的，这是蒙人的有色镜，骗人的遮羞布。在他们心中，只有不变的目的，没有不变的手段。由于人们都有警惕心，明目张胆地去骗人，肯定会失败的。所以，他们得变变花样，人性最大的弱点是喜欢奉承话，赞美词，好话听了舒服，丑话听了硬喉，无论伟人，还是百姓都是如此，真正“宰相肚里能撑船”的人又有几个？缺德小人正是利用了人性的弱点，来行骗来整人的。他们甜言蜜语，见了老妪叫大娘，见了小儿叫乖乖，见了男子叫大叔，见了女子叫大姐，让你笑嘻嘻的，乐哈哈的。于是，你放松了警惕，于是他悄悄拨出了腹中的“剑”，你在笑声中倒下了，他却在笑声中成功了。


    史书将“口蜜腹剑”的专利权归属于唐朝奸臣李林甫，称他“口有蜜，腹有剑。”其实，他不是始作俑者，一切奸臣都是如此，李林甫只是一个代表而已，而后来的缺德小人又将它发扬光大，青出于蓝而胜于蓝，代代相传，世世相因，害苦了多少善良之人。


    不过，李林甫确实够得上玩“口蜜腹剑”诡计的大师。不信，举几件事为证。


    玄宗欲用李林甫为相之时，曾向中书令张九龄征求过意见，张九龄说：“宰相系国安危，陛下相林甫，臣恐异日为庙社之忧。”玄宗没有听从。李林甫知道此事后，对张九龄非常恼恨。但是，张九龄“以文学为上所重”，李林甫对其虽恨，亦无可奈何。于是，善于伪装的李林甫将其怨愤深藏于心，表面上对其“曲意事之”。侍中裴耀卿与张九龄关系很好，因此，李林甫对裴耀卿也非常恼恨。是时，玄宗在位已久，“渐肆奢欲，怠于政事。”每逢议事，无论大小，张九龄常与玄宗力争。李林甫则利用这个机会，“巧伺上意”，夺得玄宗的欢心，并想方设法中伤张九龄。


    开元二十四年（736年）十月，玄宗巡游到东都洛阳，欲还长安，裴耀卿、张九龄说：“今农事未毕，请俟仲冬。”裴、张二相考虑到时值秋收大忙季节，皇帝若返驾归京，沿途迎送，势必影响秋收，所以建议玄宗推迟到初冬再归。待裴、张二相退去，李林甫装作脚疼，落在后面。玄宗问其故，李林甫说：“臣非疾也，愿奏事。二都本帝王东西宫，车驾往幸，何所待时？假令妨农，独赦所过租赋可也。”玄宗大悦，立即西还。


    朔方节度使牛仙客，勤于政业，能节用度，仓库充实，器械精利。玄宗对其极为赞赏，欲拜其为尚书。张九龄反对，说：“不可。尚书，古之纳言，唐兴以来，惟相及扬历中外有德望者乃为之。仙客本河湟使典，今骤居哺要，恐羞朝廷。”玄宗改变了主意，决定对牛仙客加以“实封”。张九龄依然反对，玄宗听后沉默无语。李林甫趁此机会，对玄宗说：“仙客，宰相材也，何有于尚书！九龄先生，不达大礼。”李林甫一番话，既博得了玄宗的欣悦，又进了张九龄的谗言。第二天，玄宗复又提出此事，张九龄固执如初。玄宗非常恼怒，变色道：“事皆由卿也？”事后，李林甫向玄宗奏道：“天子用人，有何不可！”这话显然会进一步激怒玄宗，从而离间玄宗和张九龄的关系。


    不久，张九龄、裴耀卿被罢政，李林甫取代张九龄为中书令，牛仙客升任相职。开元二十五（737年）夏，监察御史周子谅上书弹“牛仙客非才，，滥登相位”结果是惨遭“杖之朝堂”，后又被流放襄州，至落田而死。李林甫乘机又进谗言，对玄宗说：“子谅，九龄所荐也。”玄宗又将张九龄贬为荆州史。李林甫终于达到了整治张九龄的目的。


    靠玩弄权术窃取相权的李林甫，始终耽心自己会被取取而代之。所以，“凡才望功业出己右及为上所厚、势位将逼己者，必百计去之；尤忌文学之士，或阳与之善，以甘言阴陷之。”


    一天，玄宗陈乐于勤政楼，垂帘观望。兵部侍郎卢绚垂鞭按辔，横过楼下。卢绚风标清粹，玄宗目送良久，并“深叹其蕴藉”。李林甫闻知此事后，耽心卢绚会受到玄宗的重用，决意设计阻挠。翌日，李林甫召见卢绚之子，说：“尊君素望清崇，今交、广藉才，圣上欲以尊君为之，可乎？若惮远行，则当左迁，不然，则以宾、詹分务东洛，亦优贤之命也，何如？”卢绚害怕去交、广边远之地任职，上书请求派往宾、詹。李林甫“恐乖众望”，派其为华州刺史。卢绚到任不久，李林甫又“诬其有疾，州事不理”，被授太子员外詹事。卢绚并没有与李林甫有隙，只因玄宗对其表示出欣赏之意，便平地起风波，中李林甫之计自寻遭贬，尔后便屡遭压制，直到被冷落在一边。李林甫害怕别人与自己竞争，居然连皇帝赞誉他人一句话都怕得要命，可见其心虚到何种程度。


    不久，玄宗又向李林甫问起严挺之的情况，说：“严挺之今安在？是人亦可用。”严挺之原为中书侍郎，早年被李林甫挤出京，现任绛州刺史。李林甫深惧严挺之，恐其重返京都，便召见严挺之的弟弟严损之，说：“上待君兄意甚厚，盖为见上之策，奏称风疾，求还京师就医。”李林甫虚假地以关心严挺之的面孔出现，唆使严损之为其兄上奏谎称有病请求归京治疾。严损之毫无戒备之心，反倒非常感激，并且依计行事，实际上是跳进了李林甫设下的陷阱。李林甫手持严损之的奏表，对玄宗说：“挺之衰老得风疾，宜且授以散秩，使便医药。”不知究里者，谁都会觉得李林甫言之有理：既已衰老，且染风疾，给个闲官便于治疾，又归京都，岂不在情理?!

