    能抬上去吗？”人家说得有理，我们只好拿了20元。可令我们吃惊的是，这账并没有算完。接下来，人家还有更深一层的道理：“20元怎么能行？你们是两人，每个人都得给我们20块。”他们的话说得很肯定。出门还是别惹事，于是我们又白白送给人家20元。


    现在看来，这真是缺德头等标兵。连骗带蒙，不知不觉中你就到了井底下。


    这事在西方的表现并不突出。固然，西方人拼命地赚钱并不错。而且，只要能赚钱，他们会什么都不顾。所以他们的赚钱方法可谓无奇不有。有时真让人接受不了。不过，这可是周瑜打黄盖的事，谁也管不着。最近，笔者看到一则国外新兴的职业：


    不久前，在法国里昂举行了一次接吻比赛，赢得冠军的“接吻大王”在赛后乘机做起了生意，开办了“有偿接吻”业务，每“献技”一次收费5美元，很快吸引了不少女性，她们要在“接吻大王”的明唇上投师学艺，一尝快感。如今，该生意已做了两万多起。社会上有人认为，从事这项工作财色兼收，极不道德，而“接吻大王”却极力否认这种看法。在他看来，这样做并不存在什么有伤风化的情节，他所挣的不过是一点血汗钱。


    无论怎么为自己开脱，中国人都不会原谅他的职业。我这里引用一些中西的例子，只不过是想借此说明缺德的模糊性与明显性。并没有多少好奇成份。大家可能还听说过职业杀手的事情。不用讳言，中外都不乏以此为生者。在西方，职业杀手很是“职业”。尽管其从事的内容不道德，甚至可以说是极为缺德，但是就事论事，在“敬业”这一点上，人家又是极为'
