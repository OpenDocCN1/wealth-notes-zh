    上，请示臣等今后应走的路，敢保证更会听陛下的话，遵陛下的指示去办事。”


    赵匡胤看见这般情形，也满心欢喜，却装出一副悲天悯人的态度对他们说：“人生一世，就如白驹过隙一样，几十年光阴，转下眼就过去了，就算说为国家建功立业，名垂史册吧，各位不都名成利就了吗？总算不负此生。今后岁月，只要能安享富贵，平平静静过日子，那是最好不过的事!”


    说到这里，故意向大家扫了一眼，见众人都像泥佛一样呆着，又摆出一副猫哭老鼠的脸孔继续下去：“唉，我坐在这个位子上已无法脱身了，一桩桩的外事内务，正所谓一年三百六十日，日日忧患频相逼。要干吧，事情这么多；不干，又失天下臣民之望。我为这个问题，日夜担忧，虽为一国之君，但个中辛苦，外人是无法知道的，因此很不愿意我的好兄弟再掉进这个泥淖里，再干这些吃力不讨好的事。唉……我是无法卸责的，而你们还可来得及，我为大家着想，各位最好把公事统统放下，退居林下，什么都不要管，可以睡到日上山巅，再不理五更三点穿朝服，可以骑驴买酒过农家，不听争吵杀伐之声，这种与世无争的宁静生活，真是神仙不如，世间难得。你各位如果愿意的话，我念在过去的情分上，会给大家巨额金钱，解职归田，安享下半辈子的清福。在我来说，虽然以后和各位不能时常见面，但只要大家能享福，颐养天年，我的心也觉得快乐，各位认为怎么样?”


