    儿子一代能够得到封赏的。”赵高说到这里，有意停下来让李斯思索了一番，然后又继续道：“先皇陛下有二十多位公子，丞相对他们是比较了解的。长子扶苏与蒙恬关系亲密，如果他继位，必用蒙恬为相，将来您能有好结果吗？公子胡亥很不错嘛！他遵守礼法，为人厚道，不贪财物，敬重读书人。虽然短于言辞，头脑却很清楚，很聪明。在他们兄弟中，谁也比不上他，所以他最适合于继承皇位。丞相，您看如何？”李斯说：“您请回去吧！我只知道遵照皇帝的命令办事，根本不敢考虑这样的问题。”赵高说：“在这安危关头如果自己不拿准把握，那是最愚蠢的人。”李斯说：“我本来是一个普通老百姓，得到先帝的宠信，提拔为丞相，赐给我侯爵，临终时又将有关国家安危的大事事托付给我，我怎能辜负先帝的信任呢？先生请不要再往下说了，那是犯罪啊！”


    这时的赵高当然不会接受李斯的劝阻，他仍然鼓起那薄薄的两片嘴唇：“现在先帝已经驾崩，情况变化了。圣人说，办事要随着形势的发展改变办法。”李斯仍然反对：“违背天意是不能长久的，将来连祖宗都没有人祭祀。我李斯是个正经人，决不干那种不能长久的事。”赵高又说：“您放心，只要我们齐心协力，就能够长久。”沉默一会儿，赵高看到李斯仍然不愿意的样子，于是打出了最后一张王牌，说：“丞相！老实告诉您吧，公子胡亥已经同意这样办了，您还怕什么？再说，您同意，得这么办；您不同意，也得这么办。”


    赵高的这几句话，深深震动了李斯的心。封建礼制、人臣的节操、国家的安危、自己和子孙后代的生死荣辱等想法都错综复杂地纠结在一起。现在胡亥和赵高已经串通在一起，如果我不同意，他们能放过我吗？寻思良久以后，他对天长叹一'
