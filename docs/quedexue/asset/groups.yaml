    孔子说：“别忙！郊祭的时候已到，这是国家大事，如君王还没有忘记的话，国事犹有可为。否则的话，再卷包袱也未迟。”


    到了郊祭期间，鲁定公虽照例去参祭一番，却一点诚心都没有，草草祭完，便又回宫享乐去了，连胙肉都不分给臣下。孔子便对子路说：“快去通知各位同学，卷好包袱，明早就离开这儿。”


    于是，孔子便弃官而去，气嘟嘟地率领一班学生去周游列国，过起流浪生活了。


    蒋介石则用釜底抽薪术，整垮了冯玉祥。


    1928年蒋介石收拾了桂系以后，就开始对付冯玉祥的西北军，但西北军有42万人，与自己势均力敌，而且西北军纪律严明，作战勇敢，战场上抢大刀，中央军根本不是对手。


    蒋介石对付西北军有新的办法，双方尚未交战，蒋介石就用高官厚禄收买了冯玉祥的两员战将韩复榘和石友三，使冯玉祥一下子损失了两部人马。


    1930年中原大战时，西北军英勇善战，中央军在陇海线连连受挫，几乎抵抗不住。


    冯玉祥的西北军长期生活在贫困地区，生活非常艰苦，为了瓦解冯的军队，蒋军采取了一系列措施。


    蒋介石看到了西北军的一个致命弱点，就是一些军官已不愿忍受西北艰苦的生活，渴望改变现状，他认为打西北军不应用炮弹，而应该采用“银弹”加“肉弹”的攻势。于是命令陇海线六个守备区都在前沿办起阵地俱乐部，他特命南京政府军事参议院院长办理此事，用火车车厢或者汽车，布置成流动酒店，备有中西大餐、烟具、赌具。雇佣上海舞女、妓女充当招待。凡是西北军官兵前来，均请入内，任其受用，分文不取。玩乐之间，蒋介石的特务从中拉拢。久受冯玉祥家长制和严明纪律控制、饱尝艰难生活之苦的西北军官兵，对蒋介石这一手段很欣赏，他们羡慕将军的这种高待遇，于是就想改换门庭，很快就有许多人表现消极，冯军的战斗力下降。


    在中原大战后期，蒋介石又以河南省主席之职和大量金钱收买了冯的骁将吉鸿昌，随后又收买了梁冠英、张印湘、王修身等高级将领，使他们率部倒戈。冯玉祥几十万大军在几个月的时间内被全部瓦解。参加中原大战的阎锡山晋系也损失惨重，丢了平津、河北等地盘，退回山西老窝。


    蒋介石用釜底抽薪的阴谋取得了胜利。


    ## 过得海便是神仙


    “瞒天过海”，即俗话所说“过得海便是神仙”的意思。


    军事斗争中，不少兵家利用敌方思维定势造成的司空见惯，麻痹大意，将密谋隐蔽在公开的事物之中，依靠伪装的掩护来完成特定的任务，运用瞒天过海的战术以致胜。


    瞒天过海又是封建官场应用极广的政治权术，因为在官场中尔虞我诈，互相欺骗，是很普遍的现象。


    我们先来看看信陵君的瞒天过海术。


    秦昭王派白起为主将，在长平歼灭赵国40万大军之后，乘胜直逼京师，把邯郸团团围住。


    赵王弟弟平原君是魏国公子信陵君的姐夫。因此，赵王几次写信给魏王和信陵君请求魏国出兵援救，魏王便派将军晋鄙统率10万大军去救赵国。


    秦王听到这个消息，立即派人去警告魏王说：“我攻打赵国，早晚准能攻下，任何国家敢派兵救援的，我打下赵国之后，接着一定移调军队去打它！”


    魏王给吓住了，急忙命令晋鄙停止进军，驻扎在邺城这个地方，名义上是说援救赵国，实际上观望形势，采取阳奉阴违的两面态度。


    平原君等得急了，不断派人到魏国去，并责备信陵君说：“我之所以跟魏国做亲戚，就因为你豪爽，够义气，能解救别人的危难。现在邯郸早晚会被攻破，眼看要投降秦国了，魏国的救兵又始终在途中观望，哪见得你还有什么义气？你的姐姐怕城破被俘，终日哭哭啼啼。你纵不同情我，难道也不可怜你的姐姐？……”


    情真意切，信陵君心里很难过，屡次去请求魏王火速进兵，但魏王害怕秦国报复，始终不答应。信陵君知道魏王已没有救援赵国的决心，便奋不顾身，独自一人毅然去救赵国。他和门客们商议好，结集了百多辆战车，准备冲入秦军中去，与赵国共存亡！信陵君率领了这支小部队经过了东门，见到了守门的老头子侯生，把自己要去跟秦军决一死战的消息告诉他。


    分手的时候，侯生只冷冷地这么说：“你努力去干吧，我老了，不能跟你一道去。”


    走了一段路程，信陵君心里想：“我平时没有得罪侯生的地方，现在我要去和人拼命，怎么没有半句话劝阻我或激励我，这确实奇怪……”因此，便叫大家停下来，独自跑回去。


    这时侯生正站在门外，一见信陵君回来，便笑着说：“我早就料到你一定要回来找我的。”


    “你怎么会知道呢？”信陵君问。


    “那还不简单！”侯生说，“你一向对我很好，现在你要去送死，我偏不给你送行，你心里一定不愉快，所以我料定你必然回来问个明白！”


    信陵君说：“很对，你猜得不错。我怕我有什么对不起先生的地方，会使你对我这么冷淡，所以想问个明白！”


    侯生说：“我知道你一向器重人才，养了这么多门客，但现在遇到了为难的事情，却毫无办法可想，光要跟秦军拼命，这正如把肥肉丢进老虎口里，试问有什么益处呢？”


    “我也知道没有什么益处，”信陵君说，“但平原君是我的姐夫，交情又深。眼下，他危在旦夕，我不能见死不救呀！虽然明知这样做无济于事，这也是万不得已之举。不知老先生有没有别的办法可想？”


    “请进屋里去坐吧，大家商量商量！”侯生把旁人遣开，细声问信陵君：“我听说现在魏王最宠幸的一个美人叫做如姬，是不是？”


    “是的！”


    “又听说如姬的父亲被人杀害，她怀恨了三年，从国王以下，都想为她报仇，却总是没办法找到这个仇人。有一次，她为这件事向你哭诉，你立刻派门下客去侦察，很快就把仇人的头弄到了手，献给如姬，是否有这件事？”


    “不错，果有此事。”


    “那就好办了。”侯生的老眼一闪，继续说出他的计划来，“你为如姬报了杀父之仇，她感激不已，就是为你牺牲生命，也决不会推辞的，你正好利用这个机会，从她身上打主意！”


    “她是一个女流之辈，有什么主意可打的？她又不能撒豆成兵！”


    “我再请问一句，”侯生说，“魏王是不是已派晋鄙率10万大军去救赵国？”


    “是呀！可是魏王叫他在半路上停下来，不准前进。”


    “且不必过问不进军的理由，但你可知用什么办法叫晋鄙进军？”


    “自然是魏王下的命令啦！”


    “那么魏王下的命令是凭什么做证据呢？”


    “兵符。”


    “这就对啦！”侯生霍然起来，神气十足地对信陵君说：“只要能把兵符弄到手，假借谕旨，瞒天过海，晋鄙的军权就归了你，魏军就可以立即开到邯郸去，赵国的危机不就解决了吗？唉，你听我说，魏王的兵符就藏在卧室里，那地方只有如姬一个人才可以接近。你现在即刻去见她，只要你一开口，求她帮助，把兵符偷出来，她没有不答应的。这样你便可以把晋鄙的兵权夺到手，就可以指挥大军，北面救了赵国，西面击败秦军，这可是了不起的功勋。这是千载难逢的机会呀！”


    信陵君果然采纳了侯生的意见，去请如姬设法。


    如姬毫不推辞地说：“公子过去对我有大恩典，我正想找个机会报答你，何况这些是公子的侠义行为，我无论如何都要完成这个任务。”


    当晚，如姬特设便宴把魏王灌醉，乘机盗窃兵符，用一个花盒密封好，托近身的侍女连夜送到信陵君手里。


    信陵君见到兵符非常高兴，立刻去见侯生，并请教他还有什么高见。


    侯生说：“凡是一个统帅在前线有绝对权威的，就是君主的命令也可以不接受。现在你拿了兵符前去，晋鄙仍然可以不把兵权交给你，如果他说要再向大王请示一番，那事就糟了。在这个危急关头，惟有断然处置才行。我有一个好友叫朱亥，是卖肉的，膂力过人，他可以帮这个忙。到时晋鄙能顺利地交出兵权来，那是最好不过的；要是拒绝的话，叫朱亥当场把他打死算了。”


    信陵君听了这番话，不觉心里一酸，眼泪夺眶而出。


    “怎么啦，你哭了？是怕死吗？”侯生惊奇地问。


    “不”，信陵君说，“我并不怕死，只是可怜晋鄙白白送了条性命。”


    “俗话说‘无毒不丈夫’。这是国家大事，不这样又怎能达到目的呢？走吧！”


    他们一同找到了朱亥，把来意说了。


    朱亥笑了起来，说：“我不过一个卖肉的，承公子你这般看得起，几次亲自来照顾我，过去我一直没有答谢过你，是觉得这种小礼小节没有多大意思。现在公子有了急难，这才是我报答你的时候。”立即答应下来。


    信陵君要出发了，来向侯生辞行。


    侯生告诉他：“照情理说，我也应该跟你一块去，只是年纪老了，不中用了，还是留在这儿吧。等你到了晋鄙军中的那一天，我只有用自杀来报答你平时对我的知遇之恩了！”


    信陵君率队来到邺城，假传魏王命令，要接替晋鄙的军权。晋鄙拿过兵符一验，的确不错，可是心里仍然非常疑惑，两眼不停地打量信陵君，说：“我领兵10万驻守在国境上，责任是重大的，现在你单身到来接替兵权，究竟是怎么回事？我要请示一下魏王才把兵权交给你，好吗？”


    朱亥在旁边早已忍不住了，立即拿出暗藏在袖筒里的那个铁锤，当头掷了过去，晋鄙应声倒地，血流如注，白眼一翻，小腿一伸，就再也不动了。


    信陵君接过晋鄙的兵权，检阅过人马，发布命令说：“父子同在军中的，父亲要退役回家；兄与弟在军中的，哥哥回去；是独生子的回家去奉养父母。”


    经过整编以后，得到精兵8万，然后使人告诉赵王，约期前后夹攻。到进军那一天，信陵君身先士卒，如出笼的猛虎，杀得秦军措手不及，血流成河，仓皇逃回秦国而去。


    就这样，邯郸被解围了，赵国也转危为安。从此，秦军再不敢轻举妄动。可惜信陵君窃符假传魏王令，军法不容，不敢回国，只好携家眷住在赵国。


    瞒天过海是一种高级骗术，其关键在于一个“瞒”字。会用，将别人愚弄于股掌之上；不会用则弄巧成拙。信陵君的瞒天过海用得生硬，虽然达到了目的，取得了巨大的胜利，也拯救了赵国，但自己却吞食了胜利后的苦果，落得个流落他乡，难回魏国。


    民国初年，袁世凯的长子袁克定用瞒天过海术骗他父亲加快称帝，也不高明。


    《顺天时报》在民国初期是销行数量很大的一份报纸，袁世凯平时专门看它。


    1915年，袁世凯笃信自己登基称帝的日子已经到来，因为最近的《顺天时报》几乎篇篇都是劝袁早日举行朝贺仪式，择吉举行登极大典，召宴外国使臣的文章。这正好与算命先生给袁批的八字相吻合，又正好与袁氏祖茔守茔人韩诚带来的消息相应验。前不久，韩诚匆匆忙忙赶来京城，诚惶诚恐地向袁世凯报告，说袁世凯的曾祖袁保中坟侧，夜间不时有红光出现，形同火炬，照耀方圆几里许。又说，袁氏祖茔附近生长出一棵紫藤树，状似盘龙，长逾丈许。韩诚还将一块刻着“天命攸归”字样的石块送上，说是最近在祖茔中发现的。


    以上这些都使袁世凯深信自己称帝是“天意”，于是加快了登极称帝的步伐。他曾首先向亲信透露：“如果全国老百姓一定要我做皇帝，我就做。”于是，袁世凯的狐群狗党便组织“筹安会”宣扬君主立宪，策动请愿闹剧。一时间，全国各地五花八门的请愿团纷纷出笼。参加请愿团，劝袁称帝者，上自王公遗老、政府官僚、各省督军、巡抚使，下至车夫游民，无所不包，样样俱全。北京的乞丐和八大胡同的妓女也被分别组织起来，成立“乞丐请愿团”、“妓女请愿团”，手持各色旗帜，大呼小叫奔向街头，齐立新华门外，跪呈劝进表，请求袁顺从民意，早登大宝。真是乌烟瘴气所在皆是，蛙鼓鸦噪处处可闻。


    袁世凯明里造声势，暗里指使他的亲信剥夺民众言论自由，封闭民党的报刊，并用逮捕、威胁、暗杀、金钱收买、许以高官等手段强奸民意。


    其次，宣布召开国民代表大会。袁和他的亲信为了保险，让各省的代表从布满武装士兵的将军署大门走到投票厅，先听将军、巡按使发表痛诋共和、称颂君宪的演说，再在虎视眈眈的监视人员监视下投票。这样，似乎国民们都投了袁世凯称帝的赞成票。


    1915年12月13日上午9时，中南海居仁堂设好御案、御座，北京的文武官吏前来朝贺将要登极的袁世凯。袁身着大元帅戎装，光着头顶，站在座旁，左手扶着御座扶手，右手掌向上，不断对向他行三跪九叩大礼的朝贺者点头示意。


    然而，喜荣华正好，恨无常又到。袁世凯万万没有料到日、俄、英等国突然转变态度，警告他“中国实行帝制，将立即促起变化”。这时，反对袁称帝的蔡锷又率领护国军占领四川南部；贵州、广西先后宣布独立，陆荣廷自任为两广护国军总司令；就连袁世凯手下的两员大将——段祺瑞、冯国璋也联合江西、浙江、山东、湖南四省督军，准备发出取消帝制、惩办祸首的电报，国内外反对袁世凯称帝的浪潮迭起。


    一天，袁世凯的女儿让丫头给他买点五香酥蚕豆来吃，无意间发现包蚕豆的《顺天时报》与家里的《顺天时报》在袁称帝问题上论调大为不同，就急忙找来同一时期的《顺天时报》来查对，结果发现内容根本不同。于是，她拿着那份真的《顺天时报》去给袁世凯看。袁世凯一看大吃一惊，厉声问：“哪里来的？”然后找来大儿子袁克定一问才知道，这些都是想当“皇太子”的袁克定搞的。袁世凯气愤至极，用皮鞭子把袁克定打了一顿，一边打，一边还骂他“欺父误国”。其实，看祖坟的韩诚来报“祖坟夜有红光”，“生盘龙紫藤树”的消息，也是急于当太子的袁克定一手导演的。


    在内外夹攻之下，袁世凯气恼成病，不得不于1916年3月22日撤销帝制，不久，便一命呜呼了。


    ## 拆散对手的同盟


    挑拨离间，即是当政治对手比较相当，从正面进攻难以奏效时，便着意从对手内部打开缺口，设法让对手和他的盟友相互猜忌，相互拆台，以至将他的盟友从他们内部拉出来，削其力量，孤立其身，然后轻而易举将其击败。


    挑拨离间之术关键在于找准能使对手同盟破裂的缺口。此术常为那些缺德小人所运用。


    东汉末年杨彪将此术用到李傕和郭汜身上，一针见血。


    公元192年，王允、吕布等合谋诛除了董卓。接着，便在朝中捕杀董卓余党，并且宣称凡是董卓的旧部都不能赦免。这引起了董卓的部将的不安。于是以李傕、郭汜为首发动暴乱，几天之间，攻下了长安城，杀死王允，控制了汉献帝，把持了朝政。随后，李傕、郭汜在长安放纵兵士大肆抢掠，居民死伤数万，长安城中米价达到五十万钱一石。以太尉杨彪、司马朱隽为首的一班元老重臣便图谋除掉二人。但由于二人勾结甚密，势大难图。因此，怎样拆散二人的联盟就成为一个难题。


    一天，杨彪与朱隽计议说：“李、郭二贼图谋不轨，他们往来密议，一定在夜间。我听说郭汜的妻子十分妒嫉，让一个人告诉她，说郭汜与李傕的妻子有染，她一定会禁止郭汜与李傕往来。然后，再暗中派人召曹操入朝勤王，乘二人分裂的机会攻打他们，一定十分容易。”


    郭汜与李傕的妻子有染的消息，终于秘密地传到了郭妻的耳里，郭妻果然禁止郭汜到李傕家去。一次，李傕约定郭汜饮酒，而郭汜由于妻子约束，不能前往。李傕见郭汜没来，十分过意不去，便派人把饭菜送到郭家，而郭妻则暗中在菜里放上毒药。之后，才端给郭汜。郭汜刚要吃饭，他妻子连忙阻止，把饭菜先给狗吃了一些，狗立即倒地死掉了。郭汜不明真相，自此与李傕有隙，而李傕却一点也没有察觉。又过了几天，李傕在家中宴请郭汜。事出偶然，郭汜回到家中，肚子忽然疼起来。郭妻更煞有介事地给他灌了一些粪汁，一番呕吐以后，郭汜的肚子竟然不疼了。这件事促使郭汜更加痛恨李傕。心想，如果自己不先下手，必然被李傕所害，便调动自己的军队，准备进攻李傕。李傕在家中听到消息，也整兵来战。这样，郭、李联盟被彻底拆开了。


    王钦若则用挑拨离间术赶走了寇准。


    澶渊之战，寇准劳苦功高，在众人之上，宋真宗对他特别厚爱。寇准也十分得意，王钦若却嫉恨得要死。


    一天，群臣会朝，寇准先退下。真宗目送他，久久地看着他的背影。王钦若乘机进言说：“陛下如此尊敬寇准，那您看他是不是匡扶社稷之臣呢？”皇帝说：“当然是了。”王钦若说：“澶渊一战，陛下不以为耻，反而还把它当成寇准的功劳，这是为什么呢？”皇帝不觉愕然惊诧，忙问其中的缘故，王钦若说：“城下之盟，《春秋》以为是奇耻大辱，而陛下为万乘之主，与胡虏订盟于城下，还有比这更耻辱的事吗？”皇帝愀然不乐。王钦若又进谗言说：“陛下知道赌博吗？博者赌钱非输光不可，常常罄其所有以做为抵押，就叫做‘孤注一掷’。陛下您成了寇准的‘孤注’了，这是很危险的呀！”宋真宗因为这个就逐渐疏远了寇准，罢了他的宰相之职。


    ## 在干坏事前，先找个替罪羊


    嫁祸于人，亦即移祸于别人之意。目的是消灭对方或排除异己。嫁祸于人往往与无中生有是一对孪生兄弟。嫁祸，一种是自己有祸，转嫁他人，使自己逃脱罪责，转嫁给自己的仇人，则是一箭双雕。另一种是自己无祸，而欲加罪于自己的仇人，故意制造一些罪名转嫁到仇人的头上。


    齐国有个中大夫夷射，有一次在王宫里参加酒宴，喝得大醉，靠在回廊门上。有个仆人叫刖跪对他请求说，“把您喝的酒给我一点儿好吗？”夷射叱骂道：“滚一边去，下贱的仆人还敢向贵人要酒喝。”刖跪急忙跑开了。等夷射走后，刖跪就在回廊门处洒了些水，好像有人在此撒了尿一样。第二天，齐王看到了这一滩水，以为是尿，便问：“是谁在这里撒尿？”刖跪回答说：“我没有看到，不过，昨天大夫夷射在这里站了一会儿。”当时，在宫廷内公共场合撒尿，是大罪。齐王便把夷射处以死刑。刖跪因夷射不给他喝剩的酒并叱骂了他，他便设计嫁祸，加罪于夷射，使夷射被杀，可见人心之险恶也。


    明代重臣严嵩是一个五毒俱全的家伙。他玩起来“嫁祸于人”术来，轻松自如，炉火纯青。


    嘉靖年间二十九年六月，蒙古俺答部进犯大同。当时负责大同防务的是大总兵仇鸾。仇鸾的官职是靠贿赂严嵩买来的，他是个大草包，面对俺答部的进犯，惊慌失措，不敢抵抗，只好偷偷派出自己的亲信去面见俺答，贿以重金，求他不要进犯自己的防地而转犯他处。俺答收了仇鸾的重礼，果然引兵东去，攻打古北口。一路烧杀掳掠，直奔北京。


    古北口一失，京师震动。朝廷慌忙集合京城各营兵加强防守。命令下达后，军队却久久集中不起来。原来自世宗继位以来，特别是后期由于严氏父子祸乱朝政，京城禁军籍册，多是空头名额，所有兵饷，全被统兵大员侵吞，一半进入私囊，一半用来向严氏父子进贡。有几个强壮兵丁，又大都在总兵、提督、太监家中使唤，仓促之间好不容易才集合起四五万人，都是些老弱残兵，没有一点儿战斗力。队伍集合起来了，却又领不到器械，原来武库中早已荡然一空，有的也不过是一些破盔烂甲废枪杆罢了，即便是这些，管理仓库的太监也要按例索取贿赂，没钱送他，也不肯发给。开始，兵部尚书丁汝夔因为世宗在西苑一心修炼，不敢去打扰他，情况如此紧急，再也不能不打扰他了。世宗听了报告，犹如闻晴天霹雳，吓了一大跳，慌忙命令文武大臣分守九门，同时传檄各镇兵入京勤王。


    各镇兵接到勤王的命令后，陆续到达北京。在此之前，仇鸾因为用重金贿赂俺答，求他不要进犯大同。他见俺答引兵东去，估计会深入内地，危及京师，为了乘机邀功和讨取世宗的欢心，便上疏请求进京勤王。昏庸糊涂的世宗竟嘉奖仇鸾“忠勇”，任命他为平虏大将军，节制诸路勤王兵马。这仇鸾本是个贪财怕死的懦夫，虽被委以重任，却按兵不动，不敢与敌军接战。


    俺答率军直逼北京城下，大肆抢掠村落居民，焚烧庐舍，奸淫妇女，洗劫了通州、涿州等地和北京四郊。兵部尚书丁汝夔请示严嵩是否出战，严嵩竟不顾百姓的死活，给他出主意说：“在边塞失败，还可以瞒住皇上，在京郊失败，就难以隐瞒了。俺答抢掠够了就会自己离去，我们千万不能出战，唯有坚壁守城是上策。”丁汝夔听信了严嵩的话，传令诸将坚壁不出，勿轻易出战。诸将巴不得有这样一道命令，眼看着俺答军队烧杀抢掠，却按兵不动。老百姓饱受俺答兵劫掠之苦，听说是丁汝夔不让出战，于是便大骂丁汝夔不止。


    俺答率军在京郊抢劫一番之后，便押运着大批男女、骡畜和金银财宝，志满意得地引兵退去。仇鸾率领十几万军队眼看着俺答的兵退远了，才尾随其后，佯作追击。不料俺答原计划从白羊口出塞，因遇到驻守在那儿的明将的阻扼，又折了回来。仇鸾事出意外，仓皇奔逃，军队也大乱。俺答斩杀明军千余人，然后率军从古北口从容退去。仇鸾收集溃军，沿途斩杀了七八十名百姓，冒称是斩杀的俺答人的首级，欺骗世宗，冒功领赏。因为嘉靖二十九年是庚戌年，所以这次事变在历史上便被称为“庚戌之变”。


    事变之时，当时北京西郊许多太监的宅园也被抢掠一空，焚烧干净。这次出战，以致烽火满郊，惊动皇上。世宗认为“庚戌之变”是自己受了一次奇耻大辱，听了太监们的告状更加恼火，便立即下令把丁汝夔抓起来治罪。丁汝夔原是按照严嵩的主意办的，他听到消息后立即求救于严嵩。狡猾的严嵩见世宗震怒，怕丁汝夔把自己也牵连进去，便宽慰他说：“有我在，一定不能让你死。”丁汝夔又一次听信了严嵩，果然没有说出这是严嵩的主意。谁知严嵩见到世宗之后，发现要处死了汝夔，却禁若寒蝉，一声不吱。丁汝夔临刑之时，才明白是上了严嵩的当，在刑场上大骂：“奸贼严嵩误我！奸贼严嵩误我！”可是已经晚了。就这样，严嵩祸国殃民，最后却让丁汝夔做了自己的替罪羊。


    本世纪20年代，日本人在皇姑屯炸死不太听话的张作霖，转而嫁祸于人，转移世人视线。

