    # # 缺德学 · 415 ·


    司自有他的弱点，明察秋毫谈何容易？这事无关于上司的品德，要管理我们这群缺德上班族确实很难。


    了解了“旁门左道”是必要之恶后，本人郑重推出五大升官方法，不知者请在心中思量，知者请若无其事。


    # ## 升官五大方法


    **第一法——琐事分给手下做**


    一般人以为居高位者劳心，而在低位者劳力，这话不全对。初级干部如组长、科长之流，往往跟基层职员一样要受皮肉之苦，头衔上有个漂亮的“长”字，工作跟手下差不了多少，倒不如说工作量更大，操的心更多。所以，要迈向“主任”的路，就得把那些烦人的琐事转嫁给别人。节省下来的时间要用来加强主任级人物应具备的能力，万一不小心还是接到一些烦琐的工作，请趁人不注意把它扔到垃圾桶中。不要怕，所谓的琐事，就是非得有人办，但是要是真的办不成，也没什么大不了的芝麻兼绿豆，要注意的是垃圾桶中的垃圾会不会落入别人手中。


    此外，你还得做出很忙的样子，偶而拨个空号说：“请接××大学黄博士。”也是妙法。


    运用这策略有几点要小心。


    +   1. 交给别人的琐事，自己要在完成后过目一下。

    2. 转嫁琐事要役劳平均。

    3. 要派适当的人做适当的琐事。例如派打字员打算盘，派司机推割草机。


    **第二法——抢功劳**'
  - '[PAGE 428]


    # 上班族缺德讲座


    这是一个不喻自明的方法。要在半斤八两中脱颖而出，想法子在起跑线上偷跑。但是本法对上司极有用，对同级的主管却有树敌的恶果。现在是集体合作的时代，抢功劳并非上策，即使成功，你也会失去同僚及部下。除非形势极不利，非背水一战不可，否则不可贸然实行。


    # 第三法——紧迫盯人


    本法又名橡皮糖法。也就是跟你想要的职位的现任者亦步亦趋，一起上班，一同下班，一块吃饭，连上厕所都不分开（当然，限男性的小解），就当自己是他的书僮丫环，发挥摇头乞尾相迎的精神，极尽拍马奉承之能力。


    # 第四法——攀裙带关系


    政治婚姻是大家熟知的老方法，但是这种方法用在从初级干部跳到中级干部有效，再往上就不行了，有时“内举避亲”仍是必要的。


    因此本人主张应该依“古典学派”的方法接近董事长、总经理的女儿，但是却绝不可和她结婚。要是大人物出言试探于你，你要含泪说：


    “什么？令千金？不，绝对不行，我的确对小姐很有好感，可是我更爱我们的公司，如果您一定要把小姐许配给我，我只有递辞呈了。我想靠我自己的力量出人头地，如果和令媛结婚。我在家中将是一个幸福的丈夫，在公司却免不了受人误解及中伤，这是我无法忍受的。也许，我这个人事业心太重，但是我早已认定这是我这辈子的方向了，所以，无论如何，请原谅我辜负小姐及您的好意。”


    这么动人的情景，早晚会传遍公司，你的准岳父会为你安排更高的位子，同事也会对你生出三分顾忌。'
