    # 缺德史话


    斋醮活动，需要焚化一篇青丝红字的骈俪体表章，奏报“玉皇大帝”，叫做“青词”。“青词”既要表现对玉皇大帝的奉承景仰，又要表明祈求愿望，多出自大学士之手，不少人因此取得了皇帝的恩宠。张璁从翰林到入阁不过六年；桂萼竟打破“故事”，全不按提拔规矩，以“礼部尚书兼翰林学士”入阁，固然有主张尊崇朱祐杬的原因，也和“青词”的写作大有关联；顾鼎臣只因七章“步虚词”就特受恩惠，连升连提。


    皇帝的“胃口”被严嵩瞧准了。他千方百计地把自己写的“青词”奉给嘉靖帝，一次不中再来一次。终于，嘉靖帝感动了，召见了严嵩。看着这位干巴巴，眉毛都已经发稀的老头儿，嘉靖帝觉得找到了一匹温顺恭谨的老马，肯干，朴诚。于是嘉靖帝给了他一个礼部右侍郎的名衔，并“开恩”地委派他代表自己去祭告父亲的显陵。


    严嵩知道不能丢掉这次机会。他大张旗鼓地“隆重”了一番，还觉不够，居然撒起弥天大谎，回朝真真切切地向嘉靖帝汇报：“祭祀那天，开始细雨，天都替陛下洒泪。待到臣恭上宝册奉安神床时，忽然云开日朗。臣在枣阳采来的碑石，多少年来一直群鹤绕飞护持，可见定是块灵宝。果真，载碑石的船进入汉江，水势突然骤涨，真正百神护佑。此皆陛下考思，显陵圣德所致，请令辅臣撰文刻石，记载上天的恩眷”。


    嘉靖帝听完，真是肝舒脾泰，觉得自己果然认准了人。高兴之后，自然是提升封赏，即传口谕提严嵩为吏部左侍郎，再进南京礼部尚书。不久，又改南京吏部尚书，严嵩一次大谎，竟在仕途上迈了三大步。那时，吏、户、礼、兵、刑、工六部加上都御史号为七卿，而内阁实际上是最高行政机构，阁臣一般由吏、礼两部尚书中选任。严嵩已经离阁臣没有多大距离，'
