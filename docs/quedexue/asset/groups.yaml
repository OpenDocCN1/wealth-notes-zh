    # 缺德史话


    政院长职务，为表示与蒋同进退，孔祥熙也辞去了实业部长，但又由沪赴宁亲自把实业部大印交给汪派人物陈公博，以示不愿彻底决裂；出任财政部长后，他一面加强国民党国家银行，与外国金融团体抗衡，一面又于1934年12月英国汇丰银行发生挤兑风潮时，命令给予扶助，认为这是国际道义，不容推卸；“西安事变”发生时，孔主张智取，提出了四方面兼筹并顾策略，但却不愿得罪主战派。


    另外，孔祥熙用人也是一本中庸之道，做得适可而止，留余地而不为己甚，留退步而不走极端。有人说：“孔氏用人是善善而不能用，或虽用而仍故掣其肘腋，不尽其才；恶恶而不能去，或虽去而仍藕断丝连，不种仇恨。”世故圆滑，“人情”透深。


    下面几件事，也能说明孔的为人。


    1932年冬，长城谷口战役结束后，二十九军宋哲元部在华北七零八落，无依无靠。虽然拥有一个军的番号，但只有三千多支破枪，实力非常单薄。二十九军过去还是很能打仗的，作战能力在中国军队中还不是很少的。这次若能迅速得到补偿，恢复是不成问题的。但蒋介石在军队国家化的口号下，对于这些杂牌军，一向是不积极给予补偿的。宋哲元在百般无奈的情况下派萧振瀛到南京找孔祥熙，让他设法从中帮助。宋当时任实业部长，果然不负所托，过了几天就向蒋介石提出报告，希望蒋介石能够保存这支曾经在长城喜峰口“杀敌致果”的军队的实力。经孔说项，蒋介石同意给二十九军50万元，并增加每月军饷。后来在抗战期间，宋哲元部出力很大。


    抗战初期，曾经在武汉国民政府时代任外交部长因收回汉口英租界而名噪一时的陈友仁在九龙做寓公，生活非常苦闷。'
