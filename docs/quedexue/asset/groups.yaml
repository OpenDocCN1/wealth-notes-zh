    手，该饶人处就得饶人，永远要做出“谦臣”“温臣”的样子。那些被眼前的荣光冲昏了头的人，没有不栽跟头的。


    春秋时期的楚国令尹孙叔敖深谙此道。一次，孙叔敖遇见狐丘老人。


    狐丘老人说：“我听说有三利也有三患，你知道此事吗？”


    孙叔敖恭敬而表情激动地说：“我很不聪明，哪里能会知道这呢。大胆地请问什么叫做三利？什么叫做三害？”


    狐丘老人说：“官位高了，别人便会嫉妒；官做得大了，君主也会嫌恶；俸禄多了，会招来别人的怨恨。就叫做三利三害。”


    孙叔敖说：“不会这样的。我的官位越高，我的志向越低；我的官越大，我更加小心谨慎；我的俸禄越多，我周济的人越多。可以用这种办法免除祸害吗？”


    狐丘老人说：“说得太好了！这像尧舜一样，还有什么需要担心的呢。”


    赵衰、郭子仪则是这种理论的实践者。


    晋文公通过践土会盟，登上了霸主地位，但他环顾各国诸侯，觉得自己的地位并不巩固，自己的权威还不算高，于是，召开集群臣商议对策。


    他首先对众臣说：“寡人依靠众卿之力，战胜了楚国。践土会盟，天子亲临指导，诸侯纷纷响应……但秦人不赴约；许人不会朝；郑人虽赴盟却仍怀贰心；卫侯则复位就擅杀受盟的弟弟。如果再不申明约誓，严行诛罚，诸侯之盟必然分裂。众爱卿看该如何处置呢？”


    于是众臣议论纷纷，有主张出兵讨伐的，有主张以礼服人的，还有主张以天子之名号召诸侯，再视其态度分别对待的。'
