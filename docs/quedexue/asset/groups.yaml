    # 前言


    揭示缺德是从政者的利剑；

    提防缺德是经商者的坚盾；

    识别缺德是安身立命的护身符。


    《缺德学》，一本绝世奇书。


    不是冲动，更不是为了标新立异，而是寻找人类自古以来埋藏在“光明”深处的幽灵。


    上下数千年，大千世界，色彩缤纷，鱼龙混杂，胜败之道难以料说。所谓人世间，大鱼吃小鱼，小鱼吃虾米，虾米啃泥巴，一片混杂。滚滚红尘，决不是人类理想中的桃花源；月白风清，香烟缭绕的幽谷独处的生活也只是难以寻觅的鸿爪。


    天下熙熙攘攘，尔虞我诈，彼此倾轧，演出了多少人间惨剧。面对现实强烈的竞争，任何人都在迫切渴求赢的策略。然而卑劣小人往往设下许多埋伏，增设许多障碍，既有刀光剑影，还有温柔陷阱，“随风潜入夜，润物细无声”，让人防不胜防。因此，在得意者盈盈笑脸的背后，常常藏出“缺德”的叫嚣。


    缺德现象，自古而然。不仁不义的奸佞小人虽然不可用譬如群星喻之，然而鬼蜮之徒，黑影幢幢。颠倒黑白、混淆是非者有之；阳奉阴违、两面三刀者有之；勾结党羽、狼狈为奸者有之；栽赃陷害、反口噬人者有之。缺德者捣鬼有方，诡计多端，花样万千；缺德手段登峰造极，令人深恶而痛绝之。


    厚黑大师李宗吾说：“古代成为英雄豪杰的人，不过脸厚心黑罢了”。其实，中国一部二十四史，哪一页不欠下血泪斑斑的缺德账？历史更迭，豪杰辈出，又有哪一个不是精于算计的？又有哪一个不是使用诡道才成功的？


    无赖小人刘邦虽无学无才，却用阴谋诡计成为一代帝王，谁说他不是缺德高手？一代明皇唐太宗李世民名垂青史，再听听幽光昏暗处无数冤魂的控诉，谁又能说他不是缺德大师？屈指数来，又有谁能把这缺德账算个清清楚楚、明明白白？


    我不禁要问：为什么骗子能得手？为什么小人能得势？为什么无赖能挣大钱？为什么伪君子还能当官？……


    “黑夜给了我黑色的眼睛，我却用它来寻找光明”。


    于是，我开始苦苦思索，苦苦探求，四十多年，惨淡经营，发明一部敢冒天下之大不韪的奇作《缺德学》，为善良的人提供一部警世之作，使您未雨而绸缪，看穿缺德小人的嘴脸及伎俩，明察世态，烛破奸诈轻轻松松过一生，而并非鼓励人们去缺德。


    《缺德学》与缺德大相径庭。前者让你谨防缺德陷阱，后者说的是陷阱黑幕，如果把缺德比作一枚地雷，那么《缺德学》就是一架探雷器。


    《缺德学》，一部人类隐秘历史的大曝光；


    《缺德学》，一部人类灵魂再铸的金钥匙。


    《缺德学》，给您穿上防弹衣，让您在变幻莫测的世界中经风雨、见世面。


    多少事，从来急。时代的车轮在飞速旋转，多长个心眼吧，当心别人把您活埋！


