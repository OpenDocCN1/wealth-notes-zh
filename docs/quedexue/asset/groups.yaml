    # 缺 德 学


    在当今社会，许多人仍深信“钱不是万能的，但没有钱是万万不能的”。因此，遇到大事小事往往求助于“孔方兄”。这在官场上表现得尤为明显，常言道，礼多人不怪，给上司送了厚礼，有事的大事化小，小事化了，无事的则想办法找机会给弄个乌纱帽戴一戴。所以，送礼不愧为做官的终南捷径。


    送礼，首先要把握好对象，有时给甲送，而没有给乙送，得罪了乙也不上算。民国初年著名人物陆建章给袁世凯的妻妾送礼就是一例。


    袁世凯筹备帝制时，陆建章首先称臣。


    他听说袁妻子夫人要过生日，亲自献上一枚钻石戒指。于夫人很喜欢，向诸妾炫耀一番后，珍藏在卧室的首饰盒中，准备大典时戴。谁知第二天，钻石戒指不翼而飞。于夫人又气又急，召集众仆，严刑拷打、追问，钻戒还是没有下落。最后，她只好去翻检诸妾的卧房，竟在十姨太的屋里找到了那颗宝贝，窃贼是她。原来，这位姨太太嫉妒心极强，看到陆建章送给于夫人这么大的钻戒很是眼红，便悄悄偷去。


    于夫人很生气，向袁告状，袁特别宠爱十姨太，故袒护她，反而责怪于夫人：“小小钻戒算得了什么？过几天我可以给她几个更贵的钻戒，区区小事，何足挂齿。”果然，不出几天，十姨太手上一下子戴了五六个金光闪闪的钻戒，神气十足。于夫人差点气昏过去。


    这十姨太的钻戒由何而来？是袁世凯悄悄把消息传给了陆建章。陆心想：这可要坏事啦，十姨太万万得罪不起，我的乌纱帽还是得过她的鼎力相助才弄到手的。他火速购得十几颗贵重钻戒，特赠十姨太。


    此事办得巧妙、及时，解决了老袁的妻妾矛盾，又讨好了'
