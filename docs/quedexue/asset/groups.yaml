    其宠妾，袁对陆建章自然就另眼相看了。


    送礼还要把握好礼品的轻重分量，以我手中钱，买你手中权。


    在清代，官员贪污是个公开的秘密。“三年清知府，十万雪花银”，中国最大的贪官和珅可谓生逢其时。乾隆年间，和珅是朝中的实权人物，皇上前面的红人。在和珅那里，大小百官皆有定价，出什么价钱做什么官，当时盐政、河道总督是两个最大的肥缺，标价也就最高。官员们必须先以“巨万纳其府库”，然后才能走马上任。即便好不容易捞到了一个肥缺，仍要经常向和珅行贿，因为天有不测风云，人有旦夕祸福，任何一个官员都有犯罪的可能。如果早早送上金银财宝，一旦获罪，和珅就可以为之从中斡旋，否则，就不要怪和珅手下不留情了。


    督抚们向和珅行贿的数额之大是十分惊人的，一二十万两银子在和珅眼里根本就算不了什么。有一位姓张的巡捕官受陕西巡抚的派遣，送20万两银子给和珅。张巡捕押着银子到了京师，却没想到竟然行贿无门，和府根本无人接待。后来花了5000两银子做“小费”，才出来一个穿着华丽的少年问：是白的，还是黄的？张巡捕答说是白银。那少年吩咐左右收在外库。然后给张巡捕一张名柬，说，“用这个作为回执，回信另发了。”张巡捕以为这个少年一定是和府的总管或者心腹，别人告诉他说，这不过是一个门子而已，几千两银子，就能见到和府总管吗？20万两银子竟不值总管出面，见一个奴才尚且需要几千两，真可谓“侯门深似海”！


    民国年间，官场送礼成风，一般官僚、政客大都精通此道，就连以“三不知”著称的狗肉将军张宗昌也不例外，而且'
