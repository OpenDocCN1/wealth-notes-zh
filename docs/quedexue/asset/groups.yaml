    # 缺德史话


    禄儿，乖乖。”安禄山也装出孩儿哭。逗得后宫一片喧笑声。玄宗听到热闹声，不甘寂寞，也来到贵妃宫中凑热闹，并学着他三位姨姊，拍了拍车上的三朝“婴儿”。安禄山睁眼一看是玄宗皇帝，吓得做了一个怪相。玄宗、贵妃、三位夫人和所有在场的人都忘记了自己的身份，一个个捧腹大笑。玄宗当即赐给贵妃洗儿金银钱，并再次给了安禄山珍贵的纪念品。这场戏直闹到深夜，贵妃与玄宗兴尽用尽为止。


    从此，安禄山的名声在后宫流传。这为他出入禁宫创造了条件。他常常假借玄宗和贵妃之命，涉足后宫。安禄山与杨贵妃表面上以母子相称，贵妃口口声声“禄儿”，安禄山将“母妃娘娘”挂在嘴边，实际上彼此早已眉来眼去，非同寻常。安禄山有时陪贵妃同桌欢饮，你来我往，亲亲热热，难舍难离。有时相聚到深夜，贵妃安排让安禄山在宫中宿寝，这是破先例的，不久，宫中便有人议论他们的关系。但玄宗感到自从安禄山常来后宫，沉闷的宫闱比往常活跃多了，三位姨姐更显得精神，贵妃也笑得更美更甜了，自己倒感到乐在其中，根本没有去想贵妃与安禄山之间有什么离格之事。


    其实，让安禄山出入宫禁，是玄宗的旨意。玄宗视安禄山为支撑国家的台柱，惟恐他被人用毒酒、毒食毒死，每次上朝总是提醒他。后来干脆不让他到外面去酒食，特许他在宫中用餐。自然，杨贵妃的种种桃色传闻最引人视听。玄宗不会不有所耳闻，有时也产生丝丝怀疑。但高力士等一班掌管宫内的宦官，总是给玄宗皇帝灌迷魂药，极力否认流言，担保决无此类事情；玄宗从内心也不希望自己最亲信的人会干出对己不忠的事。因此，经高力士一番化解，不仅心中的怀疑消释一净，而且更加亲信他了。


    # 缺 德 学


    历史上，安禄山这类官僚实在太多了，有的甚至更胜一筹。这类人做人的原则是：为了蝇头小利，千万别把自己当人看。唐中宗时代的御史大夫窦从一其实比安禄山更典型更无耻。


    窦从一在唐中宗时代任御史大夫，按照唐代的官制，这是一个三品官，是司法监察部门的最高长官，是一个地地道道的高干。可是这个人极没骨气，那时宦官很有势力，他见了没有胡须的人便以为就是宦官，都要低头哈腰，后来居然大大风光了一番，由皇帝李显亲自当月下老，给他娶了个老婆。


    一年岁末，李显在宫中设宴，酒酣耳热之际，忽然对窦从一说：“我听说你早已失偶，对你很是同情，今天是除夕，我给你成亲吧！”


    话刚落音，便有一行人由内宫迤逦而出，前面是宦官持着灯笼为前导，后面，在金缕罗伞的遮掩之下，有一个女人，身穿花花绿绿的衣服头上插满珠翠，由西阶进殿，坐到窦从一的对面。看来这一切是早已安排好的。


    皇帝命窦从一按当时的习俗念一首《撤扇诗》，念完之后，罗扇撤去，去掉头上的顶戴，换掉礼服，再一瞧，竟然是个老太婆！这个老太婆是韦皇后的奶妈。此时的韦皇后已是将近50的人了，这个老太婆少说也有70岁，而窦从一却只有四十多岁！这可真是一个恶作剧，李显及众位大臣都鼓掌大笑，十分开心，就这样，老太婆便成了窦从一的妻子。


    窦从一是真是哑巴吃黄连，有苦没法说，圣命难违啊！但他很快也就想开了：皇帝做媒，这是多大的面子啊，更何况娶的又是皇后的奶妈，他正可以利用这层关系去讨好、巴结皇帝皇后。当时人们将奶妈的丈夫叫“阿”，从此以后，窦从一每一次谒见皇帝或上书朝廷，便自称“皇后阿”，别人都叫他“国阿”，他还极为自得。


    # 若是上司打了你的左脸，就伸出右脸


    官场凶险，有时需要暂时忍耐以便待机而发。“忍”是中国人为人处世的一项重大发明，传到日本，变成了“忍术”。在儒家哲学中，它是为实现某种远大抱负而采取的一种自我克制、婉转退却的谋略。在道家学说中，“忍”更是一种柔韧的武器，运用得当，可以克制一切坚硬刚强的力量。俗话说：“忍字头上一把刀”，形象地说明了“忍”作为处世谋略的进攻性功能；它决不是逆来顺受，而是韬光养晦、待时而动。


    中国作为一个具有上千年历史的文明古国，自古及今造就了无数个忍学大师。


    战国晚期，秦灭掉魏国后，过了几年风平浪静的日子，忽然秦王嬴政听说有一个叫张耳的和一个叫陈馀的魏国贵族密谋复国，秦王害怕魏国的遗民死灰复燃，于是到处张贴告示悬赏重金捉拿这两个人，捉到陈馀的赏黄金500两，捉到张耳的赏黄金1000两。张耳、陈馀风闻此事，心想三十六计走为上，于是改名换姓，潜逃到陈国去当看门的小卒，两人就这样度着平静的日子。


    一天，当地一名小官吏无缘无故地找碴，说陈馀碍眼，顺手就鞭打陈馀，身为贵族这种污辱是陈馀无法忍受的，于是陡然站起来要反击。说时迟那时快，张耳一个箭步绊倒陈馀，丢个眼色要陈馀忍了这口鸟气，陈馀只好自认晦气，一吭也不吭地让那恶官使性子使个够。恶官走后，张耳一把扶起被打得半死的陈馀，架着他到桑树林中，数落一番：“老陈，记得咱们当初是怎么约定的吗？如今这小恶官的小小威风你都不能忍一忍，咱们还谈什么往后的大计划呢？所谓‘小不忍则乱大谋’，你懂不懂？！”


    后来，秦末农民起义爆发之后，张耳、陈馀分别起兵，叱咤风云地大干起来。


    一个人在轻蔑和侮辱面前，要忍得住，必须拥有宽广的胸怀和度量。唐代武则天的宰相娄师德可以算上一个忍术大师。他的弟弟奉命任代州刺史，上任时，娄师德告诫他：“我们两人在政治上都是青云直上，很容易遭人忌恨，你一定要小心谨慎，处处忍让为上。”他弟弟说：“好吧！假如有人向我脸上吐口水，我一定不去计较，只是默默擦去，这样做总可以吧。”


    娄师德说：“那还不够，别人向你脸上吐口水，一定是因为他恨你，如果当面擦去，反而会引起他更大的仇恨，以为你故意和他作对。遇到这种情况最好微笑不动，让口水自动干掉，这样，他一定恨不起来。”


    娄师德的忍耐精神可以说是登峰造极。


    坚韧的忍耐精神是一个人个性意志坚定的表现，更是一个为人处世谋略的运用。在官场上难得有事事如意，学会忍耐，婉转退却，可以获得无穷的益处。正如俗话说的：“忍得一时之气，免得百日之忧。”《圣经》上也曾劝告人们，如果有人打了你的左脸，就伸出右脸让他打。可见，东西方文化在这一点上还是相通的。


    “忍耐”也是民国总统黎元洪成功的经验。


    黎元洪清末在湖北时，一直位于张彪之下，张彪是张之洞的心腹，娶了一个张之洞心爱的婢女，人称“丫姑爷”。但张彪此人心胸狭窄，嫉贤妒能，对黎元洪十分反感，加之当时报纸亦赞扬黎元洪而贬低张彪，张彪心怀不满，常在张之洞面前进谗言，诋毁黎元洪。


    张彪在进谗言的同时，还以上级的职位，百般羞辱黎元洪，想让黎元洪不能忍受耻辱而离开军队。张彪的手法非常恶劣，曾经在军令黎元洪罚跪，并当着士卒的面，将黎的帽子扔在地上。黎元洪忍受着百般欺辱，不动声色，脸上毫无怒容，张彪对他无可奈何。


    然而，黎元洪亦非甘为人下者。他貌似忠厚而实有权术，他明知张彪欺侮自己，却不与之争锋，而是“平敛锋芒，海涵自负，绝不自显头角，以开异己者攻排之隙。”


    张之洞任命张彪为镇统制官，但军事编制和部署训练却要黎元洪协助张彪。张彪不懂军事，黎元洪呕心沥血，为之训练。成军之日，张之洞前往检查，见颇有条理，就当面称赞黎元洪，黎元洪却称谢说：“凡此皆张统制之部署，卑职不过执鞭随其后耳，何功之有？”


    张彪听了黎元洪这话，心中十分感激，从此二人关系逐渐融洽。


    1907年9月，张之洞任军机大臣，东三省将军赵尔巽补授湖广总督。


    赵尔巽看不起张彪，要以黎元洪取而代之，黎元洪坚辞不受。同时，黎又面见张彪，告知此事，建议他致电张之洞，让张之洞为其设法。张彪一听，心中大惊，立即让其夫人进京运动，才保全了职位。张彪对黎元洪十分感激，张之洞也认为黎元洪颇有信义，从此对他另眼相看，这样一来，黎元洪就攀上了张之洞这棵大树。


    实际上，黎元洪的官瘾一点也不比张彪小，但他考虑得比较远，虽说张之洞已离开了湖北，但在北京当军机大臣。俗话说，朝中有人好做官，如果借此机会攀上张之洞，自然会对自己的仕途产生莫大影响。可见，黎元洪于厚道的外貌之下，实藏着极深的权术。


    黎元洪这种“忍”的本领，影响到他的整个命运。1911年10月武昌起义爆发后，起义军强逼他做“都督”，他心里极不情愿，最后还是“忍”下了，附和了革命；他当总统时，国务总理掌握大权，他只做了傀儡总统，盖印章的机器，国务院的小办事员都看不起他，他多数情况下都是以“忍”了之。


    “忍耐”本身是痛苦的，特别是在做总统时，“位尊而权不重，名高而不符实，人不微而言轻”，这对于一个权力欲极强的人来说，是难以忍受的。因此，他也几次抗争，但此时黎元洪已无军事实力做后盾，面对那些骄兵悍将，他每次抗争的结果，都以自己下台了结。下台对于做惯了官，有了官瘾的黎元洪来说，更加不好受。“两害相权取其轻”，于是，他又以“忍”为重，重新出来做官。所以他重任两次副总统，两任大总统。


    # 哭出官运哭来财


    常言道：“男儿有泪不轻弹”。男子汉大丈夫哭鼻子实在不雅。但在官场上，有人为了升官发财，竟然用哭达到目的，可谓无奇不有。


    哭似乎是女人的专利，但男人若肯拉下脸面，大流眼泪，效果一定不亚于女人，搜寻古今历史，善哭的男人倒有几个，哭的妙的哭出了天下，次一点的也哭出官运亨通。


    男子哭自有哭法，不能像泼妇一样，一屁股坐到地上，双手握住脚脖子，像狼叫一样哭；也不能像含羞少女，低着头，用手绢边擦边哭。男子汉的哭，要高昂着头，任眼泪直往下流，若泪水少，千万不能擦，眼泪就是让人看时，此时不要不好意思，要以哭为荣，要哭出感情，哭出特色，哭出风度，要让人们为自己的哭而倾倒。


    政治家们是最善用眼泪的，他们有的是装一副诚恳的样子，让人们同情他，有的是对某种灾难表示悲痛，表现他的心情和人们的心情一样。


    哭的方法千奇百怪，哭的效果奇妙无穷，巧于用哭，可以达到事半功倍的效果。


    李宗吾在《厚黑学》中说刘备的特长“全在脸皮厚，依曹操，依吕布，依刘表，依孙权，依袁绍，东窜西走，寄人篱下，恬不知耻，而且生平善哭做三国演义的人，更把他写得维妙维肖，遇到不能解决的事情，对人痛哭一场，立即转败为胜，所以俗语有云：‘刘备的江山，是哭出来的。’”


    明朝有个大奸臣刘瑾，此人凶恶无比，残害忠良，其心狠毒如蛇蝎，但他却善于装出一副可怜相，哭得巧妙。


    刘瑾身为太监，在朝中为非做歹，引起了大臣们的不满，大学士刘健、谢迁、王岳等人联合弹劾刘瑾，明武宗听从大臣们的意见，决定明天早朝时处置刘瑾等人。


    吏部尚书焦芳听到这个消息后，立即密告给刘瑾，刘瑾带着同僚，连夜去见皇帝，见了武宗，他们一齐跪在御榻前，放声大哭，刘瑾哀求说：“如果皇上不开恩，我等奴才就要被杀扔到大场喂狗了。”


    武宗见自己一向宠爱的太监们俯首在地，哭得这般伤心，便安慰道：“我并未降旨拿你们问斩，你们哭什么？”刘瑾见武宗态度和蔼，趁机进谗言说：“陷害我们是王岳。皇上富有四海，玩几只鹰犬，岂能损伤于国事！王岳外结阁臣，企图挟制皇上，怕奴才从中阻拦，所以先发制人，欲置我等于死地。刘健、韩文等大臣，以为圣上年幼可欺，肆意横行，也唯恐我等把他们真实情况告诉皇上。假如司礼监与皇上一心，阁臣怎么敢如此逼迫皇上。”


    武宗本不想杀这些太监，听了刘瑾的话，立即改变决定，当即下令刘瑾掌握司礼监兼提督团营兵马。第二天早朝，王岳等大臣被逮捕，刘健、谢迁被迫辞职还乡。


    刘瑾一哭，不仅保住了性命，而且还反咬一口，残害了大批忠良。


    民国时期，国民党官僚谷正纲，当着文官武将的面，为蒋介石下野而痛哭流涕，虽然大失体面，却哭出了后半生的亨通官运来。


    1949年1月，蒋介石就宣布第三次下野问题在总统官邸召集国民党中央常委临时会议，决定自己退居幕后，由副总统李宗仁代行职权。


    当时的场面至为凄惋，到会众人，一个个表情阴郁，会场气氛冰冷。


    蒋介石首先发言，表示他个人非引退不可，讲话的声音低沉似有无限悲伤。


    突然有人放声大哭，一边哭，一边哽咽地说：“总统不能下野呀！总统！”人们举目望去，原来是CC系少壮派分子谷正纲在泪流满面哭声不止。


    蒋介石不由得心中一动，升起一股暖意，心想：自己在危难关头，居然有这样忠心的部下。真是难得呀！


    会场一片骚乱，人们交头接耳，窃窃私语。


    “我也反对，现在是非常时期，总统不能下野……”张道藩、谷正鼎也站了起来。


    蒋介石极力控制着自己的情绪，说：“这不可能，我意已决，明天就回奉化老家。”


    谷正纲这一哭，真哭出与众不同来，关键时刻以眼泪向蒋介石效忠，给蒋介石留下了极深刻的印象。


    为了表示忠心，蒋介石下野后，谷正纲又以“辞职”表示抗议，愤然离开南京跑到了上海。


    蒋介石兵败大陆后，在台湾对国民党进行了彻底改造，排除旧有派系，重新组建，以形成对国民党的绝对控制。众多的国民党元老、党国要人都已失势，唯独谷正纲倍受器重，其中奥妙自然是不言而喻的！


    作为部下，仅仅向上级表示自己的忠心还是远远不够的，还要善于时刻揣摸上级的意图。因为在官场，说话办事往往并非出自真心实意，有时正话正说，有时正话反说，当下属的决不能认为上级说什么就是什么。关键在于要明白上级的真实意图，理解上级的心思，敢讲上级想讲而不能讲的话，敢做上级想做而不敢做的事。


    例如，有一次，蒋介石提名宋子文为行政院长，众人都以为宋子文西安救驾有功，应该任行政院长。而蒋介石实际上不想让宋当行政院长，他故意提名宋子文，是想让下属提出反对意见，蒋则顺水推舟以不能通过为由而改任他人。这样蒋介石当了好人，下属当了恶人。


    另一次，蒋介石说他不当总统候选人，有些人信以为真，认为总统有名无权，蒋介石是真不干。只有张群摸透了蒋介石的心思，站起来反对，并建议修改宪法，赋予总统至高无上的权力。张群还亲自鼓动一帮元老前去劝驾，蒋介石见目的已经达到，自然很快就欣然同意了。


    知识分子，尤其是大知识分子，不宜当官，他们往往将上级的话信以为真。国民党选举总统时，蒋介石有意让胡适当候选人，胡适信以为真，实际上蒋介石不过是做做样子，让美国人看看，胡适不明白其中奥秘，结果空喜欢一场，还碰了一鼻子灰。


    上级的意图往往捉摸不定，善逢迎者必须下功夫掌握上级的心意，这样才能收到预期效果。


    # 不说假话办不成大事


    所谓欺骗，就是以虚假的言行掩盖事实真相，使人受骗上当。一说到欺骗，人们无不微词贬之，因为在日常生活中，善良的人们往往吃受骗的亏，严重的倾家荡产，直至人头落地。古今中外的大欺骗，可谓骗天骗地骗人，其手段之恶劣，其行为之卑鄙，违理之昧心，足以天诛地灭。


    然而，在某些哲学家的眼里，撒谎欺骗有时并非不道德。柏拉图在《理想国》里就说兵士对敌人，医生对病人，官吏对民众都应该哄骗，尤其是在官场上，人们相互之间并无真诚可言，无非是彼此利用而已，欺骗作为政治斗争的手段可谓无处不在。还是林彪一语道破天机：不说假话办不成大事。


    自古至今，不少人的高官显位并非来自真才实学，往往是通过不正当的手段骗来的。唐朝大将史思明的升迁即为一例。史思明本是少数民族突厥人，原名窣干。凭他的骗术，一跃而成唐朝的将军。


    唐玄宗开元年间，窣干因欠官府的债款走投无路，来到北部边疆的奚族地区，被一向排外的奚族人捉住。奚族人想杀死这个外地人，可窣干装出一本正经的样子说：“我是大唐派来与奚王和亲的使者，你们杀了我，如果惹下大祸将会影响你们的民族。”奚王见窣干一副气度非凡的派头，还真将之当成了大唐派来的使者，并以贵宾礼节接待他。


    奚王畏惧唐王朝的势力，决定派100人跟随窣干去朝拜大唐皇帝。窣干对奚王说：“你派去的人虽然不少，但我看多是浅薄之徒，这样的人怎能去见大唐皇帝呢？听人说，你手下有一个才华超群的琐高（将领称号），何不让他去呢？”奚王不敢违抗，便让琐高和他手下300人跟随窣干去朝拜大唐皇帝。


    他们一行人快走到平卢时，窣干先派人欺骗平卢守将裴休子说：“奚族人派琐高和精锐将士一起来了，他们嘴上说是去朝拜天子，实际是来偷袭平卢，你应该做好准备，不等他们动手就先干掉他们。”裴休子信以为真，在奚人进入平卢毫无防备的情况下，将琐高手下的300人杀得一千二净，单单留下了琐高。


    窣干把琐高捆绑好押送到幽州节度使张守珪那里。张守珪见奚人最有才能最有威望的琐高被捉来了，非常高兴，认为是给唐朝立下了大功，当即在给朝廷的奏折中大大地称赞窣干。窣干因此官运亨通，先当果毅（官职名），又升将军。后来他与唐玄宗谈及此事，越发得到赏识，便赐给他一个汉名——史思明。


    如果说史思明的做法多少还有些兵不厌诈的味道的话，那么清末江朝宗的升迁则是地地道道的江湖骗术。


    江朝宗原名江四，此人就是袁世凯当朝时赫赫有名的步军统领，府院之争时还当过几天国务总理。江朝宗早年家境贫寒，但他勤奋好学，粗通文墨，曾在台湾巡抚刘铭传手下当过书办——衙门里缮写文书的小职员。后来江四落难来到天津，经人介绍给直隶某绿营参将高孝承当书办。这位参将乃行伍出身，不通文墨，因而对江四格外重用，倚为心腹。


    高参将早年丧妻，膝下无子，只有一个女儿，视若珠宝，迟迟未曾许配人家，有道是“男大当婚，女大当嫁”，所以女儿的婚事成了高参将的心病。可是有财有势的门户谁愿意来娶这位芳龄已过的老处女？但一般小户人家，高参将又不甘心降格以求，日复一日，就这样高不成低不就把姑娘的婚事给耽搁了，越发难以出阁。自从江朝宗进了参将署，做小伏低，十分殷勤，上下都欢迎，参将也常夸奖他，久而久之，遂有欲将女儿许配给他的心愿，未料一打听，江四已有妻室，便不再提及此事了。不久，高参将的一位幕僚与江闲卿时，述及此中秘事，江听后内心十分懊丧，但又不可挽回，只有自怨自艾。


    江朝宗是个工于心计的人，为了自己一时失言而未能成为参将的女婿，终日心猿意马，不得安宁，思想着一条补救的办法。也是江四求利心切，终于想出了一条迷人眼目的招数，只待高参将自己找上门来。


    有一天，江朝宗备置了一桌酒菜，请那位幕僚和几名同事共饮。大家推杯换盏，开怀畅饮，都已有了几分醉意之时，蓦然间，江朝宗举杯嚎啕大哭起来。众人一怔，不知所以，都说：“四先生醉了！”江朝宗从怀中掏出一封“家信”，捧至脸前，涕泪俱下。那位幕僚先生拿过书信拆开一看，“哎呀”一声，说：“原来是夫人病故了！”江朝宗哭得更厉害了。


    过了几天，那位参将的幕僚笑嘻嘻地登门见江，一见就说道：“四先生，贺喜贺喜！”江朝宗心想：果然计谋应验了，但却佯装不解地问道：“我有何喜？”幕僚先生随即把受参将之托，欲把他的爱女许配与他的话说了遍。江朝宗再也控制不住内心的喜悦，当即站起来向这位幕僚先生深深地三作揖。第二天，江朝宗梳洗整冠去参将府邸，叩见高孝承，拜谢知遇之恩，口口声声恭称岳父大人，喜得高参将眉开眼笑。事不宜迟，高参将立刻请人选择吉日，为他们二人办了婚事。江朝宗遂了心愿，入赘参将府，从此青云直上。参将岳父关照爱婿，为他连捐带保了一个候补知县，加授五品衔。


    后来，高参将病故，所遗大宗财产，尽数为江朝宗继承。江四利用这笔家产，上下打点，终于攀上了北洋显贵袁世凯，成为民国初年投机政客中红极一时的人物。


    在当今社会，仍有不少人欺上瞒下，并以此作为升官的终南捷径，有些政府官员随意虚报政绩，作为自己攫取高官的资本。然而，迫于社会舆论的压力有时仍不免遮遮掩掩。倒是“文革”期间那位红极一时的“副统帅”说得更为直率：不说假话办不成大事！


    做官如此，做大官更须如此！


    # 要官，溜须拍马又何妨


    拍马，是看某人已得权势，就送礼、献策、溜须讨得他高兴，以达到升官的目的。

