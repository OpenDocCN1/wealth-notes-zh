    # 缺德史话


    得人多了，也就使人以为街上真的有老虎了。如今我就要到邯郸去，邯郸要比街市远得多，今后议论我的人肯定会比三个人还多，请大王届时明察。”


    魏王爽快地答应下来。可是，庞葱走后，非议他的人一天天增多，魏王渐渐相信这些非议。等到庞葱从邯郸回来，魏王已经完全不相信他，将他贬弃于宫门之外了。


    这便是“三人成虎”的历史故事。它即反映了人们的从众心理，也显示出了“众口”的威力。


    “人云亦云”，“随大流”是人性的一大弱点。心理学家将这种现象称为“从众效应”或“感染效应”，其特点是个人对某种信息和心理状态下不由自主地产生无意识的盲从。这种盲从不是通过承受有组织的蓄意压力而接受某种信息或行为模式表现出来，而是通过传播某种情感状态并且无意识的进行心理调节而表现出来的。无组织的人群往往成为这种效应的加速器，如果置身其中，即使有主见的人也容易受其感染而失去辨别能力。


    某些心怀叵测的人，正是利用了人性的这种弱点，借助他人之口或舆论的力量，达到自己的目的。


