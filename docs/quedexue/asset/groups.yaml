    # # 口有蜜，腹有剑


    来。

    次日收礼，安德海的管家李莲英让青县知县先上礼账，时启强说：“为了悼念总管大老爷的太夫人归天，特奉献素绢十匹，素缎十匹，素绸十匹，百两一锭的大元宝十锭，礼物甚微，聊表寸心。”他说完，李莲英还怕别人听不清楚，又把时知县所随的礼朗声念了一遍。

    这下子在场的所有官员乱了营：一个小小的七品知县竟然随了一千银子、三十匹绸缎的厚礼，他们这一品二品或者三品四品的该上多少？上北京来不及了，只好从河间府、肃宁、献县、任邱、青县、静海、沧州等府县国库中暂借。这回数目都上去了，再没有人随一匹绸子两匹缎子的了，都是两千两、三千两、五千两……连李鸿章也是被抬得从天津急借二百两白银上礼。

    安德海死了娘，绸缎布匹不说，光银子就赚了几十万两，堆在一起跟小山一样，安家发了，百姓苦了。有人给安德海编了个顺口溜：娘死发财几袋满，将来爹死照此办。若是娘多爹无数，财源茂盛达三江。


    莫要以为缺德小人似“文革”年代“样板戏”中的反面角色，生得丑陋，长得阴险，说得刻薄，一看就不是好东西。而实际上，邪恶狡诈之徒，从外表看，大多有模有样，冠冕堂皇，有的甚至斯文尔雅，一派知书达礼的书生像。但是所有这些是做出来的，装出来的，这是蒙人的有色镜，骗人的遮羞布。在他们心中，只有不变的目的，没有不变的手段。由于人'
  - '[PAGE 177]


    # 缺德学 · 165 ·


    们都有警惕心，明目张胆地去骗人，肯定会失败的。所以，他们得变变花样，人性最大的弱点是喜欢奉承话，赞美词，好话听了舒服，丑话听了硬喉，无论伟人，还是百姓都是如此，真正“宰相肚里能撑船”的人又有几个？缺德小人正是利用了人性的弱点，来行骗来整人的。他们甜言蜜语，见了老妪叫大娘，见了小儿叫乖乖，见了男子叫大叔，见了女子叫大姐，让你笑嘻嘻的，乐哈哈的。于是，你放松了警惕，于是他悄悄拨出了腹中的“剑”，你在笑声中倒下了，他却在笑声中成功了。


    史书将“口蜜腹剑”的专利权归属于唐朝奸臣李林甫，称他“口有蜜，腹有剑。”其实，他不是始作俑者，一切奸臣都是如此，李林甫只是一个代表而已，而后来的缺德小人又将它发扬光大，青出于蓝而胜于蓝，代代相传，世世相因，害苦了多少善良之人。


    不过，李林甫确实够得上玩“口蜜腹剑”诡计的大师。不信，举几件事为证。


    玄宗欲用李林甫为相之时，曾向中书令张九龄征求过意见，张九龄说：“宰相系国安危，陛下相林甫，臣恐异日为庙社之忧。”玄宗没有听从。李林甫知道此事后，对张九龄非常恼恨。但是，张九龄“以文学为上所重”，李林甫对其虽恨，亦无可奈何。于是，善于伪装的李林甫将其怨愤深藏于心，表面上对其“曲意事之”。侍中裴耀卿与张九龄关系很好，因此，李林甫对裴耀卿也非常恼恨。是时，玄宗在位已久，“渐肆奢欲，怠于政事。”每逢议事，无论大小，张九龄常与玄宗力争。李林甫则利用这个机会，“巧伺上意”，夺得玄宗的欢心，并想方设法中伤张九龄。


    开元二十四年（736年）十月，玄宗巡游到东都洛阳，欲'
  - '[PAGE 178]


    还长安，裴耀卿、张九龄说：“今农事未毕，请俟仲冬。”裴、张二相考虑到时值秋收大忙季节，皇帝若返驾归京，沿途迎送，势必影响秋收，所以建议玄宗推迟到初冬再归。待裴、张二相退去，李林甫装作脚疼，落在后面。玄宗问其故，李林甫说：“臣非疾也，愿奏事。二都本帝王东西宫，车驾往幸，何所待时？假令妨农，独赦所过租赋可也。”玄宗大悦，立即西还。


    朔方节度使牛仙客，勤于政业，能节用度，仓库充实，器械精利。玄宗对其极为赞赏，欲拜其为尚书。张九龄反对，说：“不可。尚书，古之纳言，唐兴以来，惟相及扬历中外有德望者乃为之。仙客本河湟使典，今骤居哺要，恐羞朝廷。”玄宗改变了主意，决定对牛仙客加以“实封”。张九龄依然反对，玄宗听后沉默无语。李林甫趁此机会，对玄宗说：“仙客，宰相材也，何有于尚书！九龄先生，不达大礼。”李林甫一番话，既博得了玄宗的欣悦，又进了张九龄的谗言。第二天，玄宗复又提出此事，张九龄固执如初。玄宗非常恼怒，变色道：“事皆由卿也？”事后，李林甫向玄宗奏道：“天子用人，有何不可！”这话显然会进一步激怒玄宗，从而离间玄宗和张九龄的关系。


    不久，张九龄、裴耀卿被罢政，李林甫取代张九龄为中书令，牛仙客升任相职。开元二十五（737年）夏，监察御史周子谅上书弹“牛仙客非才，，滥登相位”结果是惨遭“杖之朝堂”，后又被流放襄州，至落田而死。李林甫乘机又进谗言，对玄宗说：“子谅，九龄所荐也。”玄宗又将张九龄贬为荆州史。李林甫终于达到了整治张九龄的目的。


    靠玩弄权术窃取相权的李林甫，始终耽心自己会被取取而代之'
