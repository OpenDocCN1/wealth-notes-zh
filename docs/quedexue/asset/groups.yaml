    ## 高明者杀人无须自己动手


    杀人有贤愚之分：笨者杀人，直截了当的白刀子进去，红刀子出来，表面上既英雄，又痛快。可是这样一来，难逃法律的制裁，人家会说你是残忍暴戾。聪明者杀人不需要自己动手，而是公开利用法律或假手别人去执行自己杀人的意图。这样，目的达到了，在仁义道德的面具上还可以多涂一层油彩，这就是借刀杀人。


    费无忌借囊瓦之刀杀了对手郤宛。


    战国时，楚昭王即位，以囊瓦为相国，和郤宛、鄢将师、费无忌同执国政。


    是年，郤宛出征吴国，大获全胜，俘获兵甲无数。昭王大喜，将所获兵甲赐一半给他，每事必和他商量，宠幸无比。


    费无忌心生妒忌，和鄢将师一起设计陷害他。于是，费无忌对囊瓦说：“郤宛有意请客，托我来转报，不知相国肯降临否？”


    囊瓦立即回答：“既然相请，哪有不赴之理？”


    费无忌又对郤宛说：“相国早有意在贵府饮杯酒，大家快乐一下，不知你肯做东道主否？现托我来问一问。”


    郤宛不知是计，毅然答应，说：“我是他的下属，难得相国看得起我，真是荣幸之至！明天好了，我当设宴恭候，请你先去报告！”


    费无忌又问：“既然相国要来，你准备送他什么礼物？”


    “这倒提醒我了，”郤宛说：“不知相国喜欢什么？”


    “据我所知，唔……”费无忌故意停顿了一下才说：“他身为相国，女子财帛不稀罕了。惟有坚甲利兵，他最感兴趣，平日也对我暗示过，他很羡慕你分得的一半吴国兵甲，要来你家赴宴，无非是想参观一下你的战利品罢了！”


    “这个很容易啦！”


    郤宛随即叫人拿出战利品来，费无忌又帮忙挑选出100件最坚固的，且告诉郤宛说：“这些够了，到时，你把这些放在门边，相国来的时候，必问及此事，一问，你就拿给他看，乘机献给他，如果是别的东西，恐怕他是不会接受的。”


    郤宛信以为真，遂将那百件兵器及被俘吴兵安排在门内，用布帐掩蔽起来。


    次日，郤宛大摆筵席，布置堂皇，托费无忌去请囊瓦。囊瓦已准备启程，费无忌却说：“郤宛近来的态度十分傲慢，此次设宴又不知其中缘故。人心不可测，待我先去探听一下，看他摆宴的情况怎样，相国然后去，这样比较安全些，好不好？”


    “好！你先去看看罢！”囊瓦说。


    费无忌出去在街上胡乱转了个圈，忽然踉踉跄跄地跑了回来，一撞一跌的，喘息未定，气急败坏地说：“几乎误事！我已探听明白了，郤宛这次请客，是不怀好意的，欲将置相国于死地。我见他门内暗藏甲兵，杀气腾腾的，相国若前去，一定中他的计。”


    囊瓦一听，心里犹豫起来，说：“我和郤宛平日并无过节，断不会这样！”


    费无忌乘机挑拨说：“郤宛自从征吴有功，恃王之宠，早有对相国取而代之的野心了，这是尽人皆知的事，只瞒着相国一人，我和鄢将师正防他早晚有此一着。想想，过去吴乘我丧，我乘吴乱，郤宛本可以乘胜追击，把吴国灭了，可是他却俘获一些兵甲就班师，听说他当时得了吴国很多的贿赂，他一定心怀鬼胎，想在本国打主意，说不定——此人若得势，楚国就危险了！”


    他侃侃而谈，渐渐把囊瓦的思绪打乱了，但囊瓦还是不大相信，便另派心腹去郤宛家里打探个明白。


    那心腹回来报告，说是真有其事，门内果然伏有甲兵。囊瓦顿时雷霆大发，即叫人去请鄢将师到来，告诉他这件事，并问他要如何处置。


    鄢将师早与费无忌串通好，遂添油加醋地说：“郤宛想造反，并非一天了，他和城内三大家族伙同一党，正想谋夺国政，还幸今日发觉，再迟就后悔莫及了。”


    “可怒也！”囊瓦把桌案一拍，“我非宰了他不可！”


    当即奏请楚王，命鄢将师围了郤宛的家。郤宛这才知道自己中了费无忌的奸计，哭天无泪，欲诉无门，含冤莫辩，遂长叹一声，拔剑自刎。


    费无忌不动声色地便达到了翦除对手的目的。


    民国枭雄蒋介石的借刀杀人之术也运用得相当老道。


    1929年，蒋桂大战，蒋介石借助外力，使桂系败北。


    蒋介石先借唐生智之力，桂系白崇禧的部队都是唐生智的旧部，他让唐生智携带巨款活动他的旧部倒戈，使白崇禧只身逃走。


    蒋介石又借张发奎从江西发兵进攻湖北，再借俞作柏活动李宗仁的部下倒戈。


    事情发展的结果是蒋介石不费吹灰之力就占领了武汉。


    在蒋桂战争以前，蒋介石同唐生智、张发奎、俞作柏都是有很大矛盾的，但蒋介石却能在蒋桂战争中利用他们，由此可见他的阴谋诡术非一般人能抗衡。


    借刀必须有条件，或陈明利害，或许以重利，最关键的是利用矛盾。蒋介石就是在利用矛盾的同时许以重利。


    桂系的白崇禧曾打败唐生智，然后收编了唐生智的部队。唐生智的地盘在湖南，他时时刻刻想着东山再起，唐的部下也都想重回湖南老家，又都觉得当桂系的官兵不光彩。蒋介石承诺，只要唐生智能赶跑白崇禧，就让唐生智打回老家湖南去，唐生智一活动，蒋就取得了成功。只是唐不但没有回到湖南，而且蒋又发起讨唐战役，唐只得再次下台，蒋介石借了刀却不领情。


    张发奎与桂系也有矛盾，一心想占领湖北。张发奎的上级是汪精卫，蒋介石承诺汪精卫，打败桂系后，一切由汪精卫领导，汪精卫十分高兴，他一出面，张发奎同意从江西进攻湖北，汪精卫又出面请俞作柏到武汉活动李明瑞、杨腾辉倒戈。张发奎以为直捣桂系后路，无论如何已为蒋介石的南京政府建了一功，不料对桂系的战斗一结束，蒋介石的嫡系部队却向他展开了攻击。张发奎起先以为事出误会，但马上明白这是真的，张发奎被蒋介石的队伍追击，一直退到宜昌。


    汪精卫更糟，不仅没能上台领导一切，而且连被开除的党籍也没有恢复，自称“资望不足”的蒋介石地位巩固了。


    由此可见，蒋介石运用借刀杀人的方法，使桂系不战自败。大军瓦解，李宗仁等人逃往香港。


    ## 可以共打天下，但不能共享天下


    贪权置势者，未发迹之前，大都能与部属盟友同甘共苦，而且总是鼓励部属盟友私欲膨胀，放纵他们行凶作恶。一旦对手被打倒，目的达到，为了独享其成，或为了掩饰恶迹或为了平息众怒，便要对那些帮他成就了大事的部属盟友开刀了。这种谋术便叫“卸磨杀驴”。


    纵观中国几千年封建社会，一些以暴力夺取政权的出类拔萃的人物，其思想行为常常有一个“三怕三不怕”的公式。所谓“三不怕”：即未得志之时，不怕天诛地灭，不怕羞祖，不怕神憎鬼厌，故能任性横行，恣意贪取，视人家生命如囊中之物，这是鼠窃狗偷时期。所谓“三怕”，那是在得志之后，这已是有权可弄，有威可摆，可以控制一切，播讲仁义道德的显赫时期，这时则最怕旧闻，怕见旧人，怕提旧事了。这些旧闻旧人旧事，恰恰又是与旧日的手足有密切的关连，如果没有人说出他当年打家劫舍、嫖赌逍遥的秘密，他就很可以堂而皇之把自己装饰一番：既可以说自己是天父降生，星宿下凡，一落地就能“仁义为神道为骨，吐气成云屁成风”；也可以把当日赤身入“鸡窦”说成虎穴救佳人，把拦路抢劫说成是“劫富济贫”。所以，他想粉饰自己的时候，把鬼脸扮靓，不能不择亲而噬，将“吃过同锅饭”的亲密战友杀绝灭口，因为他们所知道的秘密太多了，这正是得势者的最大障碍，不得不“卸磨杀驴”了！


    历史上，刘邦是以“烹走狗”著名的。他还在“一时悟偷鸡当保长”的时候，为要“取王位而代之”，拍尽多少胸脯，说尽多少好话，表示如今有滴恩于他，将来必定涌泉相报。幸而天下越乱对他的形势越好，使他在浑水中摸到一条大鱼，居然无赖坐了龙廷。一旦基业已定，权力巩固，便一反解衣推食态度，开始嫉贤妒能起来。第一个被处决的便是为他冒生死扫荡群雄的韩信，跟着就公开大诛功臣，斩彭越为肉酱，杀英布于九江，囚禁萧何，逼反陈豨、姬信，甚至连当日一同闹酒玩女人的襟弟樊哙也险些做了刀下之鬼。张良也因为怕轮到自己，及时辞官入山去学做神仙，才免了一场灾难。


    还有朱元璋这个出身和尚、无赖、强盗而至做到皇帝的“天子”，其“卸磨杀驴”之彻底，手段之残忍，刘邦比之还要“稍逊风骚”。他做了大明皇帝，把当年帮他打江山的功臣，不分文武，借故杀戮。今日封侯，明日赐死，转瞬之间，诛戮殆尽，且九族株连，杀人之多，名列榜首。


    采用“卸磨杀驴”翦除旧属功臣，而又比较平和隐秘的，还算赵匡胤的“杯酒释兵权”一曲。


    宋太祖赵匡胤自从“陈桥兵变”，在孤儿寡母手上取得帝位之后，以赵普为枢密直学士，凡国家大事都与他商量。当时禁军将领石守信、王审琦、高怀德等都是赵匡胤的亲信，导演过“黄袍加身”，拥赵为帝的人物，在军队中有很大潜势力。


    赵普鉴于这几位将领的势力太大，怕会危及帝位，便对赵匡胤陈说个中厉害，劝说削弱他们的兵权。


    赵匡胤说：“这些人是我的心腹，决不会背叛我的，你放心好了。”


    赵普又说：“我相信他们是忠心耿耿的，只担心他们的部下一旦起野心的时候，恐怕连他们自己也做不得主！”


    赵匡胤即刻醒悟，想起了自己的皇帝宝座就是怂恿部下拥戴他而得来的，历史上又有过很多反客为主的例子，但怎样才能把这班共过患难的亲密战友的兵权夺回来呢？


    他真不愧是一个老谋深算的奸雄。他要政权巩固，不想学刘邦那样的快刀斩乱麻的激烈手法去排除心腹隐患，而要写几段漂亮的历史，反正自己手上握着生杀大权，对这班笼中鸡，目的不外要他们把兵权交出来，生要还是死要，不过就这么回事。他懂得捉苍蝇贴糖纸好过毒汁，文斗胜过武斗，于是来一个先礼后兵，不吃甜头的时候，再磨刀霍霍未迟。


    一天晚上，赵匡胤特别宴请石守信、王审琦、高怀德等禁军将领，正在酒酣耳热、谈笑风生的时候，赵匡胤忽然若有所感地停杯叹了口气，说：


    “今天我们大家高高兴兴地在一块儿饮酒作乐，可是谁又知将来还有没有这种机会聚首言欢？”


    石守信觉得奇怪，便问这番话的意思。


    赵匡胤说：“唉！你们不知道做皇帝的苦处了，整日提心吊胆，寝食不安，时时刻刻担心有人要取帝位，怎比得上你们这样无拘无束、自由自在的生活啊！”


    石守信说：“今天下大势已定，难道还有谁敢图谋不轨，自取灭亡吗？”


    赵匡胤奸笑一声，说：“我很相信你们对我的忠诚，可是万一你们的部下贪图富贵，硬要拥戴你们做皇帝，一旦黄袍加身，就由不得你们自己了。”


    这一番打牛射马的话，语气很平常，但在各人听来，却如旱天巨雷，大吃一惊，仓皇失色，不约而同地慌忙跪下来，向赵匡胤叩头请示：“臣等太过愚蠢了，不知怎样才好，自问忠心耿耿为国的，从无越轨行为，陛下可否看在多年追随的份上，请示臣等今后应走的路，敢保证更会听陛下的话，遵陛下的指示去办事。”


    赵匡胤看见这般情形，也满心欢喜，却装出一副悲天悯人的态度对他们说：“人生一世，就如白驹过隙一样，几十年光阴，转下眼就过去了，就算说为国家建功立业，名垂史册吧，各位不都名成利就了吗？总算不负此生。今后岁月，只要能安享富贵，平平静静过日子，那是最好不过的事！”


    说到这里，故意向大家扫了一眼，见众人都像泥佛一样呆着，又摆出一副猫哭老鼠的脸孔继续下去：“唉，我坐在这个位子上已无法脱身了，一桩桩的外事内务，正所谓一年三百六十日，日日忧患频相逼。要干吧，事情这么多；不干，又失天下臣民之望。我为这个问题，日夜担忧，虽为一国之君，但个中辛苦，外人是无法知道的，因此很不愿意我的好兄弟再掉进这个泥淖里，再干这些吃力不讨好的事。唉……我是无法卸责的，而你们还可来得及，我为大家着想，各位最好把公事统统放下，退居林下，什么都不要管，可以睡到日上山巅，再不理五更三点穿朝服，可以骑驴买酒过农家，不听争吵杀伐之声，这种与世无争的宁静生活，真是神仙不如，世间难得。你各位如果愿意的话，我念在过去的情分上，会给大家巨额金钱，解职归田，安享下半辈子的清福。在我来说，虽然以后和各位不能时常见面，但只要大家能享福，颐养天年，我的心也觉得快乐，各位认为怎么样？”


    这帮拥有兵权而且名声显赫的将领们，听了这番话，深知弦外之音，且软里带硬，不问就知怎么回事。心里虽然一万个不愿意，但在此时此刻，鉴于赵匡胤过去那种利用别人的作风和历史上过河拆桥的教训，不能不三呼万岁，叩头谢恩了。


    大家都知道，只要保得住脑袋光荣退休，已经是难得的了。第二天，便纷纷递表请求解甲归田，告老还乡，赵匡胤一日之间把兵权夺回手上。


    ## 走夫人路线


    在中国政治舞台上，像吕后、武则天、慈禧这样直接站在前台执政的女人不多，但隐身幕后对朝廷政治施加影响的女人却大有人在。当然，她们都是与皇帝关系密切的人，或是为皇帝宠幸的皇后、妃子，或是皇帝喜爱的公主，或是皇帝信赖的奶妈。几乎可以说，在中国历史车轮或前或后的运转中，或隐或显的，总可以发现一些女子的纤纤玉手。


    正由于这些女人能够对皇帝施加影响，所以那些溜须拍马者将目光盯在她们身上，设法取悦她们，借她们向皇帝吹枕头风以取得权势。这种手段我们把它叫做“走夫人路线”。


    魏忠贤就是靠走夫人路线，获得大权的。


    明熹宗的乳母客氏，是皇帝身边的亲信人物。魏忠贤便向客氏大献殷勤，立刻博得客氏的欢心。客氏本是魏朝的“对食者”。所谓“对食者”，是明朝宫中的一种惯例。明朝太监都要轮流在乾清宫值班。可是，他们又不能在宫中做饭吃。而宫女们却有伙房烧饭，于是太监都结交一名宫女，请她供给饭食。这种关系，被称为假夫妻，公开则称为“对食者”，也还有叫“菜户”的。按现在说法，就是“搭伙”的。魏忠贤过河拆桥，一下子抓住客氏，从魏朝手中夺取了客氏，两人成了“对食者”。魏朝对魏忠贤非常不满，但魏忠贤颇能笼络客氏，使客氏愈来愈疏远魏朝。他俩人相处得十分亲密。魏朝为了争风吃醋，竟然不顾一切，在乾清宫的暖阁子里破口大骂，对打起来。这事弄得不可开交，连熹宗皇帝也知道了，只好出面干预了这场纠纷。客氏向熹宗明确表示讨厌魏朝，喜欢魏忠贤。皇帝便把客氏配给了魏忠贤，魏朝灰溜溜地退了出去。


    客氏原为京城近郊农民侯二的妻子，18岁时选入宫中，由她哺乳熹宗。客氏生得标致，又会巴结，使太后非常喜欢她。在她进宫二年后，其夫侯二死去，她就被长期留在宫中。熹宗自幼受她乳育，对乳母感情颇深。继位之后，没有过一个月，便封客氏为奉圣夫人。并晋封其子侯国兴和弟客光先为锦衣卫千户。


    魏忠贤得到客氏的帮助，日益得到熹宗的信任。不久，魏忠贤便从惜薪司升任司礼监秉笔太监，兼提督宝和三店。司礼监秉笔太监是皇帝身边最亲近的人，要代皇帝阅批大臣奏章，但魏忠贤不识字，本不应充任此职，可在客氏的支持下，终于得到这个职位。魏忠贤大权在手，与客氏相勾结，恣意横行宫内。


    魏朝在与魏忠贤的较量中失败，被熹宗逐出宫廷，放到凤阳去守皇陵。魏忠贤和客氏却不肯放过这个倒霉蛋，派人跟到凤阳，害死了魏朝。从此，他们舒舒服服地做了假“夫妻”。


    皇后对魏忠贤与客氏紧密勾结擅作威福，很是不满，曾多次向皇帝告发他们的劣行，甚至以皇后的身份，叫来客氏，想依法惩处，对此，魏、客两人怀恨在心，便设法整治皇后。客氏侦知皇后有了身孕，她便布置自己心腹宫女，设法使皇后流产，造成熹宗无后。魏、客又诬告皇后不是其父张国纪的亲生女。他们买通死刑强盗孙二，让他胡说皇后是自己的亲生女。以此来诬陷张皇后出身不正，怂恿熹宗废后。但熹宗与张皇后感情很好，其奸计才未能得逞。后来，又诬告皇后父亲张国纪谋反，想以此株连皇后，废掉皇后，再把自己侄女册立为后。不料，这一恶招又落空了。熹宗听到后只是下了道旨意，让张国纪改过自新了事，不肯深究。当然更不肯株连皇后。


    张皇后虽没有被废掉，但所生的三男二女，都被魏忠贤暗害，一个也没有活成。至于其他嫔妃，魏忠贤拿她们更是愿杀则杀，愿废则废。光宗的赵选侍，仅是魏忠贤一道假圣旨，便被逼自尽。裕妃有了身孕，魏忠贤和客氏得知后，瞒着皇帝和皇后，硬是把裕妃囚禁起来，连一口水也不给喝，活活给饿死了。马贵人死得更惨。有一天，马贵人得机在皇帝面前，说了一句魏忠贤的坏话，皇帝前脚离开，魏忠贤跟着就派人来假传圣旨，将马贵人赐死。魏忠贤勾结客氏，操纵后宫一意孤行，达到无以复加的程度。熹宗后宫的后妃的生命，全操在魏忠贤的手里。


    流风余韵所及，在后世的官场上竟出现了抢夫人的闹剧：某一地方官携夫人走马上任，尽管这位夫人原不过是位抱抱孩子做做饭、整天围着锅台转的平庸角色，却被下属的一些小头目视作香饽饽，纷纷委以要职，酬以高薪，争着抢着要由自己来供奉。他们明白，只要能得到这位夫人的青睐，他们便会受宠，高升了。


    ## 纵火烧掉他的后院


    欲搞倒对手，避免作正面的主力攻击，而从对手的幕后去下功底，侧面暗算，来一个“兜底技术”，使其像个泄了气的皮球，无奈认输。这便是“釜底抽薪”术的妙用。


    这招术的厉害之处，在于听之无声，视之无形，无穷如天地，难知如阴阳。


    学问渊博的孔夫子也曾在“釜底抽薪”之计下栽了跟头，被迫到国外过流浪生活。


    齐景公自从在夹谷受过孔子一番奚落之后，很是耿耿于怀，一直想寻找机会报复。


    适巧，贤相晏婴死了，后继无人；而鲁国又重用孔子，国政大治，齐景公真有点坐立不安，便对大夫黎弥说：“鲁国重用孔老头，国政大治，这将会造成对我国的威胁，将来他的霸业发展，我国必首蒙其害，这却如何是好？”


    黎弥也是一位足智多谋的大臣，他沉思了一会儿，说：“釜底抽薪，逼走孔丘便是！”


    “怎么逼法？他正在得宠走红的时候！”景公问。


    黎弥把计策说出来：“岂不闻‘饱暖思淫欲，贫穷起盗心’这句话？今日鲁国天下太平了，鲁定公是个好色之徒，如果选一群美女送给他，他必会笑脸相迎，照单接纳。接受这些礼物之后，自然日夜在脂粉丛中打滚，什么孔子老子，怎及银子女子，他们还会像过去那样亲密吗？这样一来，保管把孔子气走，那陛下不是可以安枕无忧吗？”


    景公认为妙计，即令黎弥去挑选80名美女，教以歌舞，授以媚技，准备好向鲁国投掷几十个肉弹。


    训练成熟之后，又把120匹马，特加修饰，金勒雕鞍，装成锦绣一样漂亮，连同80个美女一起送到鲁国，说是给鲁定公享受的。


    鲁国另一丞相季斯，首先听到这个消息，心里便痒不可支，即刻换了便服，坐车到南门去看，见齐国的美女正在表演舞蹈，娇声遏云，舞态生风，一进一退，光华夺目，不禁目瞪口呆，手软脚麻，意乱神迷，魂消魄夺。


    因为迷于女色，季斯已忘记入朝议事这回事了。定公几番宣召，才懒洋洋地入宫进见。


    定公把齐国国书给他看，他即刻回答：“这是齐王的好意，不可推辞，照单接收就是！”定公也好此道，便问美女何在。季斯乘机做向导，带他换了便服到南门去。


    这秘密行动早已给齐使知道了，便叫那堆肉弹，下足媚劲，尽力表演，于是摆臂摇胸，似临风之芍药；巧笑媚视，像殒星之余晖；歌声乍起，疑是群莺出谷；裙带乱飘，不辨肉香花香。两位君臣，已乐得神荡魂飘，齿酸涎落，甚至手舞足蹈起来。


    “陛下请再过去看看那些良马吧！”季斯说。


    “不用看了，这班美人已够瞧了，不必再问良马！”


    当晚回军，鲁定公便叫季斯回信多谢齐王，重赏齐使，把那两批厚礼收入宫去，还额外开恩，分30颗“肉弹”给季斯。


    “从此君王不早朝”，“芙蓉帐暖春宵”。


    孔子得闻此事，凄然长叹。


    子路在一旁说：“鲁君已陷入迷魂阵了，把国事置诸脑后。老师！可以走了吧？”

