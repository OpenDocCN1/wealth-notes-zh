  - '[PAGE 286]


    时既无祖宗可认又无女婿可做，便只好编造自欺欺人的鬼话用以糊弄众人。


    在古代，人们大都相信所谓“天意”、“君权神授”，一个太之所以能当上皇帝，是出自“天意”，并不只是由于人力。文官是天上的“文曲星”，武将也是天上的“星宿”，都不是凡人。因此，在取得某种权力地位之后，总要编造出许多离奇的神话，以证明自己权力的取得，实在是“受命于天”，以此来增强政权和个人的权威性，慑服臣僚。


    这些故事在今天看来自然是十分荒诞可笑的，但它却是中国古代官场中一种十分重要的现象，形成了一种历史悠久的造神运动。


    据说，在刘备当皇帝以前，尽管他家境贫寒靠织履编席为生，但也有许多与常人不同之处。刘备天生一对大耳朵，史书上称他“大耳垂肩，天生一副帝王相。刘备家门口有一棵高耸入云的大杨树，据说很像帝王用的黄龙伞。本来，一个人的耳朵大一点并没有什么值得奇怪的，一棵普通的大树也根本没有必要载入史册，只因为刘备后来做了皇帝，这一切便统统成了“异象”。


    陈胜、吴广在密谋起义时，为了慑服众人也曾采用迷信的方法证明自己的行动出自“天意”。吴广在一块绢帕上写了“陈胜王”三个字，塞入鱼腹中，故意让部下在吃鱼的时候见到。随后，他又在夜深人静时装神弄鬼，打着灯笼在树林丛中时隐时现装出狐狸的叫声，喊着“楚国将兴，陈胜为王”。这一切当然只有他们两人知道。普通的士卒大都很迷信，听到见到这些怪异现象自然以为这一切都是“天意”，是上天的安排，所以等到陈胜、吴广杀死监军号召起义时马上群起响应，后来'
