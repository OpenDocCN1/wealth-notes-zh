    ## 缺德史话


    儿子一代能够得到封赏的。”赵高说到这里，有意停下来让李斯思索了一番，然后又继续道：“先皇陛下有二十多位公子，丞相对他们是比较了解的。长子扶苏与蒙恬关系亲密，如果他继位，必用蒙恬为相，将来您能有好结果吗？公子胡亥很不错嘛！他遵守礼法，为人厚道，不贪财物，敬重读书人。虽然短于言辞，头脑却很清楚，很聪明。在他们兄弟中，谁也比不上他，所以他最适合于继承皇位。丞相，您看如何？”李斯说：“您请回去吧！我只知道遵照皇帝的命令办事，根本不敢考虑这样的问题。”赵高说：“在这安危关头如果自己不拿准把握，那是最愚蠢的人。”李斯说：“我本来是一个普通老百姓，得到先帝的宠信，提拔为丞相，赐给我侯爵，临终时又将有关国家安危的大事托付给我，我怎能辜负先帝的信任呢？先生请不要再往下说了，那是犯罪啊！”


    这时的赵高当然不会接受李斯的劝阻，他仍然鼓起那薄薄的两片嘴唇：“现在先帝已经驾崩，情况变化了。圣人说，办事要随着形势的发展改变办法。”李斯仍然反对：“违背天意是不能长久的，将来连祖宗都没有人祭祀。我李斯是个正经人，决不干那种不能长久的事。”赵高又说：“您放心，只要我们齐心协力，就能够长久。”沉默一会儿，赵高看到李斯仍然不愿意的样子，于是打出了最后一张王牌，说：“丞相！老实告诉您吧，公子胡亥已经同意这样办了，您还怕什么？再说，您同意，得这么办；您不同意，也得这么办。”


    赵高的这几句话，深深震动了李斯的心。封建礼制、人臣的节操、国家的安危、自己和子孙后代的生死荣辱等想法都错综复杂地纠结在一起。现在胡亥和赵高已经串通在一起，如果我不同意，他们能放过我吗？寻思良久以后，他对天长叹一声，流着眼泪说道：“唉！偏偏叫我遇到了这样的事情，那我只好遵照公子胡亥和您的意思去办了！”


    赵高喜不自禁，急急忙忙地赶去向胡亥作了汇报。


    于是，胡亥、李斯、赵高三人密议，伪造了一道秦始皇给丞相的遗诏，立胡亥为太子；又伪造了一份给扶苏和蒙恬的诏书，“诏书”模仿秦始皇的口气说：


    “扶苏和蒙恬将军率领几十万军队驻守边疆已经十多年了，不但没有开拓疆土，反而损失了很多的兵力，丝毫功劳也没有。尽管如此，扶苏还三番五次上书，诽谤我的作为，这是因为不能回京城而产生的怨恨，作为儿子，太不孝顺了，所以，我赐给扶苏一口宝剑，由他自己处置自己！将军蒙恬作为臣下不忠着令自杀，军队交给裨将王离统领。”


    赵高在这份假诏书上盖上了秦始皇的玉玺，封好后，派遣其心腹宦官送到上郡。为了等候使者的消息，车驾一行绕道井陉（今属河北）、九原（今山西新绛县北）一大圈，然后向咸阳进发。


    胡亥的使者到达上郡后，向扶苏和蒙恬宣读了“诏书”。扶苏听后，失声痛哭，回到内宅，拿起使者带来的宝剑，就要自杀。蒙恬听了“诏书”后狐疑满腹，紧跟扶苏进了内宅。一看扶苏准备自杀，连忙劝阻道：“皇上巡游在外，一直未立太子，派我率领大军三十万驻守边疆，并派公子您来做监军，这是关系天下的重任啊！今天突然来一使者，您就自杀，这里面到底有没有假呢？”


    略为停顿了一下，蒙恬又接着说：“依我之见，您最好写份奏章再请示一下，如果皇帝仍然命令您死，那时再死也不迟啊！”


    这时，使者在外厅一遍声地催促扶苏和蒙恬赶快自尽。扶苏为人忠厚，便对蒙恬道：“父亲命令儿子死，君王命令臣下死，还有什么必要再请示呢？”于是，当即举剑自刎。蒙恬仍然坚持自己的想法，不肯自杀。使者便把他交给地方官吏关押在阳周城（今陕西子长西北）的监狱里面。


    使者赶回车驾队伍汇报后，胡亥、李斯、赵高非常高兴，便急急忙忙赶回了咸阳，宣布秦始皇已经逝世的消息，并宣布胡亥继位为二世皇帝。这一切都按照赵高的预谋实现了。


    秦二世继位后，马上任命赵高为郎中令。原来，秦朝的中枢官制是三公九卿制。最重要的是三公，三公包括丞相（文官之长）、太尉（武官之长）和御史大夫（主管监察）。三公之下设九卿，分别掌管各个办事的职能机构，郎中令为九卿之一，其主要职责是守卫宫殿门户，下属有大夫、郎、谒者等官。这样，赵高便由一个宫廷内掌管皇帝御用车辆的官官，一跃而成为位列九卿的秦朝政府重要官员。由于胡亥的年纪轻、阅历浅，且对赵高有一种感恩戴德的思想，所以对赵极为宠信；赵高又常常能够为他出谋划策，因此，赵高的权力在某种程度上甚至超过了三公，成为可以操纵皇帝、左右朝廷政事的决策人物。


    在封建官场，要做成一件事情，手段权术是少不得的。当客观条件不允许你堂堂正正达到目的时，手段权术就显得相当重要了。田乞、赵高废旧立新的做法从宗法伦理来讲是说缺德不仁，受到卫道者的指斥，但后来者却又常常演义着这样的故事。


    ## 吹喇叭抬轿子


    为官之道，要善于察颜观色，投人所好。自古以来，都是有坐轿的，就有抬轿的，有吹喇叭的。喇叭吹得响，就可以获得主子的恩宠，得到好处。


    政治舞台上，也是这样。一个人做了官，他手下就要有一帮子捧场的人，这一帮子人也就是吹鼓手的角色。


    这些吹鼓手靠吹捧的功劳，也可以捞个一官半职干干，享享荣华富贵。


    自古以来，在官场上，官员之间相互吹捧，奴才吹捧主子，小官吹捧大官，都是司空见惯的事。在日常生活中，人们总是把“投其所好”当作一个贬义词。事实上，投其所好，曲意逢迎不仅是一种人际交往的重要手段，更是一门高超的做官艺术。


    民国初年，曾两度任国务总理，叱咤政坛的政客靳云鹏，就有一段离奇的发迹史。靳云鹏早年家境十分贫寒，靠卖煎饼度日，由于入不敷出，他的母亲一度给人当奶妈。靳云鹏
    19 岁那年，投入袁世凯的“新建陆军”，后又入随营武备学堂第一期学习。


    段祺瑞当时任随营武备学堂的校长，二人有师生关系。后来，靳云鹏被调到段祺瑞手下任职，为了求升迁，靳云鹏细心研究段祺瑞的爱好，他发现段祺瑞爱下围棋，经常与幕僚王某对弈。


    于是，靳云鹏就从围棋入手，买来棋谱，精心研读，仔细推敲，又请名师指教，棋艺长进很快。他知道段祺瑞的棋下得不错，如超不过段，决不敢轻举妄动。


    一天，恰好王某不在，段祺瑞棋瘾发作，很想下棋又找不到对手，只能干着急。靳云鹏一看机会到了，就上前请求：“大人，学生原来也曾下过几次，能否陪大人解闷！”


    段祺瑞正求之不得，马上应允，二人就摆棋大战起来。


    段祺瑞的棋不是靳云鹏的对手，然而靳不敢赢段，但又不能让段赢得太顺利。


    第一盘，靳云鹏惨败，段有不屑一顾的意思，兴致大减。


    第二盘，段祺瑞感到下得很吃力，不由兴致大增，聚精会神，仔细研究，总算赢了，段非常高兴。


    第三盘，双方厮杀得难解难分，但最后还是段祺瑞赢了。


    自此，段祺瑞不敢小看靳云鹏的棋艺。


    以后，靳云鹏便成了段祺瑞的棋友，靳云鹏与段祺瑞下棋，多数让段赢，偶尔自己也赢一两盘，以讨段祺瑞的欢心。


    段祺瑞与别人下棋，也常请靳云鹏在旁观战，紧要关头，要靳出谋献策。


    由于下棋的关系，再加上师生关系，靳云鹏成了段的亲信，段提拔他当了标统。


    后来，段又推荐靳赴云南任更高的职务，当靳离开他时，他还恋恋不舍。


    靳云鹏由此成了皖系的干将，官升得很快，甚至两度受命组阁，出任内阁总理，成了当时政治舞台上的风云人物。


    长江后浪推前浪，与靳云鹏相比，蒋如镜可谓民国官场上的后起之秀。到了 30 年代，北洋军阀已悄然退出政治舞台，暴发户蒋介石一下子显贵起来。但蒋介石也有一块心病，他对自己的祖先是谁不甚了解，还不时有人攻击他，说他本不姓蒋，是他母亲带他到蒋家的，一些政敌也借此贬低蒋介石。在此情况下，蒋介石急于弄清自己的祖先是谁。一时间，他手下的文人忙了起来，但他们搞出的东西，蒋介石都不太满意。


    宜兴县的县长蒋如镜是个有心人，他翻阅古籍，走访民间，决心给蒋介石弄出个祖宗来。功夫不负有心人，他终于找到了可以取悦蒋介石的蒋氏祖宗线索。


    宜兴有一蒋姓大族，始祖函亭乡侯蒋澄是东汉光武帝时的婺州刺史，而蒋澄的父亲蒋横，光武帝时拜为将军，举家迁到宜兴，他的几个儿子都曾受封，显赫一时。蒋澄死后，在宜兴城内的东庙巷及官林镇附近的都山各有函亭侯祠一所。


    蒋如镜牵强附会考证出奉化蒋氏与宜兴蒋氏同出一脉，于是上书蒋介石并呈上家谱。


    蒋介石一看，高兴万分，祖上有一个蒋将军，还被封侯，有这样显赫的祖宗，蒋介石就成了将门之后，正符合自己总司令的身份，而且不仅有文字记载，更有两所函亭侯祠作证，比空口说话好得多。


    蒋介石马上认了祖宗，并偕宋美龄亲自到宜兴去“寻根”了。


    蒋如镜真可谓登龙有术。不知他是怎么想到这一点的，他这一考证，比送给蒋介石万两黄金更能取得蒋的欢心。试想，一个小小县长，想见蒋介石一面都不可能，现在却成了总统府的座上客，真是一步登天，自此以后，仕途平坦，步步高升，全靠的是这一“捧”之功。


    ## 最好在上司作乐时打报告


    皇帝老儿本来就是孤家寡人，可还有一些心术不正的臣子，绞尽脑汁，施展手段，将皇帝圈禁于深宫之中，阻断他与臣下的联系，斩断了他的臂膀，堵塞了臣下的言路，使君令不能下达，下情不能上通。这样，皇帝老儿便成了睁眼的瞎子，耳聪的聋子，对政情、民情全然不知，只能听任专权的大臣摆布、玩弄与欺骗。


    赵高残害忠良，滥杀无辜，自知结怨甚多，害怕大臣入朝时在秦二世面前揭露他的罪行，于是他用“断臂去翼”的手段，使秦二世成了地道傀儡。


    有一天，赵高对秦二世说：“天子之所以贵，就是因为臣下只能听到天子的声音，但是不能直接见到天子的面，所以天子自称为‘朕’。先帝在位的时间长，经验丰富，对群臣也都了解，所以群臣不敢在先帝面前胡说。如今陛下年纪比较轻，许多事情陛下还不是很熟悉。在朝廷上面对群臣奏事，举措如有不当，群臣就会立即发现陛下的短处，这就有损于天子的神明。今后，陛下宜深居内宫，臣下的奏章送来之后，可以与我精通法律的近侍商议之后，再发出诏令，这样，群臣们就不敢胡说，也可使天下都知道陛下的英明。不知陛下意下如何？”


    秦二世哪里知道赵高的鬼胎，还连连点头称是。从此，秦二世不再亲自出朝，会见大臣，只住在深宫内院之中，连丞相李斯也见不到皇帝。而赵高得以和秦二世经常议论朝政，所以朝中一切大事实际上都由赵高作出决定，许多不利于赵高的话和奏章秦二世根本听不到、看不到，赵高见此阴谋又获成功，便更加放心大胆地胡作非为了。


    宰相李斯对秦二世深居后宫，耽于声色犬马，深表担忧，他多次想劝谏，却苦于无法接近。赵高听到这个消息后，大喜过望，他赶紧跑到李斯的府中，似乎是一片至诚地对李斯说：“现在，关东地区的‘盗贼’如此之多，朝中大臣都急得不得了，但皇帝陛下却不以为念，不但加紧征调徭役赶修阿房宫，还豢养大量狗马以自娱。我离皇帝很近，本想劝阻他，但我的地位太低，想必说也无益，而这正是您君侯的责任哪，您难道不想去劝谏一下吗？”李斯一听，连声称是：“对，对！我早就想去说一下，但如今皇帝不上朝，居在深宫之内，很难有机会朝见，而我想说的话也不便由人转达，难啦！”赵高连忙说：“只要您愿意规劝皇帝，我可以找一个机会告诉您，在皇帝有空的时候，您就可以进宫求见了。”李斯高兴地说：“这样很好。”


    话虽如是说，但赵高却是在秦二世正与嫔妃们饮酒作乐、兴高采烈的时候，派人通知李斯来面谏。结果李斯的一番大道理，弄得秦二世大为扫兴，三番五次之后，秦二世终于忍不住了，李斯走后，他便对赵高说：“我闲空无事时，丞相不来，而正当我玩得高兴时，他就来唠叨一番，这不是存心和我过不去吗？”


    赵高乘机大大攻击李斯一番，渐渐地秦二世对李斯越来越不信任了。


    明朝巨阉魏忠贤也用“断臂去翼”术驯服了皇帝。


    明熹宗自幼有个独特的嗜好，就是特别喜欢做木工活。他自己不但会使用锛、凿、斧、锯，而且还能盖房子、刷油漆，尤其精于雕琢制作小型器件。在他干起这些活时，便全神贯注，什么事情都不能使他分心。如果这时有大臣来奏报国家大事，他也会不耐烦。


    魏忠贤摸透了明熹宗的一喜一怒，便故意寻找熹宗聚精会神干木工活时，送上奏章。这时，熹宗往往不愿问个究竟便随口说道：“我知道了，你去好好办理吧！”这样一来，许多大事，魏忠贤都可不再奏报。他的意志便成了皇帝的旨意。群臣明知如此，也只好照办。


    这种方法关键在于掌握时机，要利用上司最兴奋、最为专注的某一时刻，提出自己的要求，达到自己的目的。


    ## 赌博，不是为了赢钱


    升官之道，五花八门。尤其是在乱世，歪门邪道的升官方法很多。讨好上司以求显达，这是拍马者的最终目的，然而，拍马也需要技术，除了一般的技巧以外，还需要一些特殊的技术。如：某君善打麻将，而上司也乐于此道，于是二人成了赌友，同台赌博，此君故意拆牌，让上司赢，讨得上司高兴，由此得以升官。又一君善打桥牌，而某领导也乐此不疲，于是双方交往增多，成了好友，一有机会自然会提拔提拔。


    精于此道者，必须以掌权的上司为对象，瞄准上司的嗜好，以迎合上司的心理，讨取上司的欢心。


    民国初年，有人因善赌而爬上了内阁总理的宝座。


    潘复，山东济宁人。民国年间曾任财政部长、盐务署长等要职，是政坛上少有的“不倒翁”。潘复升官有一绝技——赌博，他爱赌，善赌，他在小小牌桌上发挥出神奇的魔力。他的宅第，客人来往不断，梁士诒、王克敏、张宗昌、李景林等权贵政要都是他家的常客。


    潘复常利用赌桌广交朋友，再利用赌友关系在政坛上维持和攫取权力。潘复本来做的是皖系的官，皖系被直系打败后，他本应下台，但他在赌桌上与直系的刘彭寿、吴毓麟交往甚密，他得到两位赌友相助，平安无事，官照做不误。


    奉系打败直系，人们以为潘复必下台无疑，谁知他不但没下台，反而升了官。


    原来，潘复在赌桌上又结交了奉系的张宗昌。他与张宗昌是同乡，又是赌友，潘复爱赌，张宗昌更爱赌，每次张宗昌到北京必到潘复家豪赌。


    有一次，张宗昌坐庄推牌九，潘复是押家，几注过去，张宗昌手头的钱就输光了。他一时输红了眼，从口袋里掏出刚从陆军部领来的5万元军饷的支票，当场签上名，“叭”地一声拍在赌桌上，瞪着牛眼冲潘复道：“再来一注！”


    潘复斜眼瞄了一下支票，心中一惊，这可是军饷啊，不是闹着玩的。但自己也不能丢脸，就故作镇静，说：“愿意奉陪。”


    张宗昌手气太背，揭开牌就傻了眼。潘复把那支票捡起来，慢慢地揣进西服的暗口袋里，含着笑对张宗昌说：“效兄，熏一口，缓缓劲再来。”


    张宗昌虽然大手大脚惯了，但此刻也有点急了，整师部队开不出饷，是要闹事的！但他也不能丢份子，仍旧满不在乎地说：“走吧！”


    两个人到了赌场专设的“福寿间”，躺上烟榻吞云吐雾吸鸦片烟。看着潘复笑吟吟地调理烟枪，张宗昌心中又气又恼，恨不得上前将他掐死，夺回支票。


    潘复并不恼，他收拾好了烟具，揭开烟灯罩，开始点火。只见他缓缓地从西服暗口袋里掏出一张纸，叠成引火纸捻，就着烟灯把纸捻引着，去点烟灯，灯点着了，他仍擎着这纸捻，一直等它烧成灰才松手。张宗昌在一旁看得清清楚楚，那个纸捻，正是那5万元支票！他不禁高叫道：“馨航（潘复字馨航），你这是——”


    潘复轻轻一笑，摆摆手说：“咱们义气，就值5万块钱么？”


    张宗昌感动不已，以后对潘复多有帮助。在张宗昌的支持下，潘复当上了财政总长。1927年6月，他终于爬上了内阁总理的宝座。


    无独有偶，北洋政府的“财神”梁士诒对方城之战也颇有研究，他靠拆牌弄了个北洋政府的财政总长。


    据说有一次，梁士诒陪奉系军阀头子张作霖打麻将。他故意坐在张作霖的上家，偷看张作霖手中的牌，张作霖要吃什么牌，他就打什么牌，喜得张作霖连叫“好牌运！好手气！”有一把牌，张作霖和坎“二万”“清一色”，梁士诒和“二、五万”“平和”。对家打出一张“二万”按顺序梁在张上家，是该他“和”的，他却不动声色，直到张作霖一把把这张牌抓走，连叫“满贯！满贯！”他才悄声对张说：“老帅，你瞧瞧我这把牌。”张作霖一看，心里明白，拍了拍梁的肩膀，作了个会心的微笑。此后，张作霖逢人便夸梁士诒有韬略，有涵养，是位难得的“理财专家”。


    在张作霖的游说和帮助下，梁士诒稳稳地做了好几任财政总长。


    一般来说，只要权力在手，众人就奉迎，但一朝失去权力，那情况就截然不同了。


    宋子文任财政部长时，下属都为他拆牌，让他赢钱。当他到美国当寓公时，再无人为他拆牌。一次，曾任财政部次长的徐堪在宋宅打牌时大赢宋子文，宋欲留徐继续打，想捞回本，徐却拂袖而去。事后有人对徐说：“TV（宋的英文简称）过去毕竟是提拔你的人，这点交情不能不讲。”徐却傲然答道：“我已入了葡萄牙籍，哪管他
    TV 不 TV。”


    ## 千万别把我当人


    旧时代官场乌七八糟，污浊肮脏，那些缺德的下级为了巴结上司，从不把人格当回事，而将自己当成奴仆、牲畜，主动地、心甘情愿地供上司驱使、耍弄，以此博得上司的一丝笑容。一点恩赐，并因此而沾沾自喜，自鸣得意。


    唐玄宗宠臣安禄山为进一步稳固和取得唐玄宗对自己的恩宠，心甘情愿认了比自己小十几岁的杨贵妃为干妈。


    杨玉环美貌绝世，深得风流天子唐玄宗的宠爱。好色的安禄山不仅想饱饱杨贵妃的丰姿秀色，更想攀附这位令唐玄宗神魂颠倒的女人。天宝六年（747年）他以新任御史大夫的身份进京谢恩，特意给贵妃娘娘准备了麝香、宝石、人参等当地名贵特产。其中还有一对能“说”会“唱”的玉白鹦鹉鸟，把它们放在金丝缕的笼子里，他企望这对宠物能被贵妃喜欢，也给自己带来艳福。


    杨贵妃收到礼品和鹦鹉鸟，果然十分高兴。尤其是那对雪白的鹦鹉鸟，学人言，知人意，非常讨人喜欢。贵妃通过高力士想正式见见这位献鸟的御史大夫安禄山。安禄山先到御花苑迎候，突然听到幽禁深处飘来清脆甜美的女儿声音。应声望
    去，一群天仙般的宫女，簇拥着一乘豪华精美的凤辇，缓缓而 来，安禄山在高力士的示意下，趋步上前，扑通跪下：“臣拜 见贵妃娘娘，万福。”贵妃说：“安大夫平身。”即令赐坐。安
    禄山方敢抬头仰望，二人双目对视，安禄山心里颤了一下：人 说贵妃的美貌举世无双，真是一点不假。他从来没有见过这样 的美人，而且双目含情脉脉……真让他爱慕得魂不守舍。话先
    从鹦鹉鸟谈起。杨贵妃说：“这鸟能学人言，解人意，十分活 跃，真是难得的一对上的好鸟。而且鸟中羽毛雪白的很稀少。 安大夫是怎么得到的呀？”安禄山说：“臣去年领兵讨伐契丹、
    奚人的叛乱，返回营地，忽然发现一对雪白的鸟儿立于营帐， 即令手下兵士捕捉，不得伤其一片羽毛。结果鸟儿没有飞，顺 顺利利地得到了它们，好像是无赐给贵妃娘娘的爱物。”他百
    般讨好贵妃，贵妃也颇对他有好感，双方初次相见，好像很投 缘分。正值花枝招展青春时的杨贵妃，生性爱少年，喜壮士， 见眼前这位具有武将风度的安禄山，身体充壮，鼻樑丰隆，眉
    宇透着英锐之气，与年过花甲的玄宗相比，……她没敢往这里 想下去。


    一天，玄宗让人召安禄山来宫侍奉圣驾，贵妃和韩国夫 人、虢国夫人、秦国夫人也都在场。安禄山趋步上前先冲着贵 妃：“儿臣……臣，安禄山拜见贵妃娘娘！”娘儿，总是连在一
    起说，称贵妃“娘娘”，安禄山不觉失口带出了“儿臣”。一 旁的玄宗觉得新鲜，大笑起来，说：“无意吐真言。朕就成全 安禄山的心愿。就拜贵妃为娘。”杨家姊妹也在一旁喝彩、助
    兴。杨贵妃有点不好意思，自己还不足 30 岁，听说安禄山 40 多了，这怎么好以母子相称呢。但又一想，既然圣上主张，又 是做长辈，也就应允了。安禄山受宠若惊，跪在贵妃面前，说：“儿，安禄山祝母妃福体万寿！”三拜。玄宗与贵妃坐在一起，笑着说：“禄山，你礼数行差了。欲拜母，须先拜父。”安禄山叩头奏道：“儿臣本胡人，遵胡俗，先母后父。”玄宗十分高兴，认这个胡儿作干儿子。并命杨贵妃的两个兄长和三个姐姐与安禄山叙兄弟，年长为姊、为兄，年少为妹、为弟。安禄山好不得意，因为从今他进入了玄宗最亲信的圈子里，是杨家兄弟姊妹的兄弟，更是贵妃和皇上的干儿子。这该是他第四次为人子了吧。


    正月二十日，是安禄山生日。玄宗和贵妃以干爹干娘的身份，特意为安禄山准备了一份丰厚的生日礼物。此外，玄宗还赐给上等酒馔和自己的衣袍等珍贵物品。杨氏兄弟姊妹也各自给这位新结拜的兄弟送了一份礼物，祝贺他的诞辰。第三天，安禄山进宫谢恩。先去宜春院给干爹玄宗谢恩。玄宗问：“禄儿，生日过得高兴吧？”安禄山说：“儿臣现四十有几，这次过生日令儿臣终生难忘。儿臣要殚心竭虑，不惜肝脑涂地来报答。”之后，便去叩见母妃杨娘娘。安禄山来到贵妃宫中，见贵妃正在微酣半醉之中，便上前跪拜，说：“孩儿禄山谢母妃娘娘大恩。”杨贵妃只听得“孩儿”、“母妃”的称呼，再看看这位大腹便便、身材粗壮的北方汉子跪拜的窘态，实在忍不住笑，便有意戏弄他一番，说：“禄儿；人家养了孩子，按规矩三朝就得洗儿。今日正好是你出生后的第三天。娘娘我今天要按规矩补行洗儿礼。”她乘着酒兴，唤来内监和宫女，令他们将安禄山的外衣脱下，象征性地往他身上浇洒几点水，然后用贵妃的锦绣床单作大襁褓，将安禄山全身包裹住，放在彩车上。贵妃和韩国，虢国，秦国夫人戏弄安禄山：“禄儿，乖乖，

