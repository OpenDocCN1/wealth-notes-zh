    ## 缺德学


    议，独有戴季陶站起来说，子文同志侃侃大才，党国倚畀正殷，将来必委重任。但在今日之情况，则天下将以为委员长以国家名器为私人酬庸之具，以为子文同志出处之玷，非所以爱子文之道。


    这一番慷慨陈词，显得堂堂正正，无可辩驳，弄得宋子文哭笑不得，眼看到手的行政院长又白白地丢了。


    戴季陶的这番话不合宋子文的心意，却很合蒋介石的心意。蒋不愿宋出山，因为宋子文有才华，在英美方面很有影响，不愿对蒋俯首听命，这正是蒋不能容许的，因此，蒋就借戴季陶的“元老”地位阻止宋子文当行政院长。


    不明白内情的人，还认为戴季陶这番话，既得罪蒋介石，又得罪宋子文，实际上蒋介石正希望戴这样说，无怪乎蒋说：“知我者，戴公也”。


    由此可见，民国政坛上的斗争是错综复杂的。政客们表面上一套，背后又一套，玩得非常娴熟。


    戴季陶作为蒋介石的政治工具，是很有用的，正因为这个原因，戴季陶官运亨通。


    再看另一次戴季陶对蒋介石用意的理解。


    按照“制宪国大”会议决议，1948年为“实行宪政年”。实行宪政，就得选举总统。


    显然总统非蒋介石莫属，但蒋介石既要做总统，又要造出人们拥戴他的气氛。因此，他首先便采取以退为进的办法“坚决辞让”作总统候选人。


    1948年4月4日，国民党中央在南京举行第六届中央临时全体会议讨论总统候选人提名问题。戴季陶本来可以因病请假，但他考虑到，选举总统是件大事，在这关键时刻，岂能袖手旁观？因此还是带病参加了会议。


    蒋介石在会上致词，他假惺惺地声称：“渠不拟参加大总统竞选，望本党同志慎重选择未来元首。”接着他提出了总统候选人必须具备的四个条件：


    - (1) 文人；

    - (2) 学者专家；

    - (3) 国际知名人士；

    - (4) 不一定是国民党员。


    按照这些条件，显然只有胡适才够资格。让胡适当总统是美国人的意思，蒋介石提出这四个条件，也只是敷衍美国人。中华民国总统的头衔，他是不肯让给他人的。蒋介石讲话后，即宣布暂时休会，下午再开。


    下午的会议，蒋介石未到，由何应钦主持，围绕总统候选人的问题，代表国民党各个派系的中央委员们便沸沸扬扬地闹开了。有的人直截地提胡适适当候选人；有的人则不同意，认为胡适不配作总统；于是，一些人又提出吴稚晖、于右任、居正做总统候选人。这些人在发言中，都先把蒋介石恭维一番，说他如何“劳苦功高”，为了爱护“领袖”应该让他暂时休息一下。发言的多是一些比较年轻、对蒋介石素来不太满意的人，特别是黄宗人一再上台发言，闹得最起劲。


    CC派的潘公展、萧铮等人则极力主张维护蒋介石的统治，他们提出反对意见，坚决拥蒋当总统。


    戴季陶坐在最前排，他一声不响，静静地听着两派人物的发言，同时内心也在思考着自己的对策。他深深知道，蒋介石提出不做总统候选人，是做戏给美国人看的，也是对国民党部属的一种民意测验，是争权力的一种手段。几十年的政治生涯，戴季陶对他这位把兄弟是深有了解的，以退为进，是蒋介石一贯的手法，他越是提出不愿当总统，就越是说明他想当总统，在这种时候，谁要是不明真象，顺了他的话去作，那保准是会倒霉的。戴季陶纵然对蒋介石也小有不满，但决不会与他作对头的。而最主要的是，戴季陶看到，国民党政权已成崩溃之势，只有蒋介石能与共产党抗衡，收拾残局，能稳定这风雨飘摇中的半壁江山。因此，他认为，这末代总统非蒋莫属。


    这时，刘公武上台发言，他主张接受蒋介石不任总统的提议，并剖析其利害，他的话没有说完，便遭到CC派气势汹汹地恫吓。见此情况，戴季陶再也忍不住了，他顾不得自己病势严重，以国民党“元老”的身份登台发言。他十分激动，满脸涨得通红，几乎是用教训的口吻斥责“总裁不当总统为宜”这一派人的意见。说他们不懂政治，不顾大局，此种做法只能致中华民国于绝境。他力言就国民党的历史来说，就目前的局势来说，就国民党对国家的责任来说，都非蒋先生担任总统不可。戴季陶一番话说得振振有词，台下顿时鸦雀无声，以戴季陶在国民党内的资历和威望，谁都不敢与之争锋。于是，戴季陶一锤定音，拥蒋派占了绝对优势。最后，通过一项决议，推张群、吴铁城等5人向蒋劝驾。结果是蒋介石欣然接受。


    ## 女人床上得天下


    俗话说：“男人百分之九十九都是好色之徒，只有一个还是有毛病”。英雄难过美人关，天下没有不吃腥的猫。明白这一点并在官场上巧为运用对于为官者在仕途上的飞黄腾达大有裨益。中国有这么一句俗话：男人马上打天下，女人床上得天下。利用某些人的好色本性，巧施美人计以求升官发财，这从中国的传统道德来讲，似乎是一种无耻行为，至少是一种不那么男子汉的行为。然而，在官场上，为了达到目的，可以不择手段。“道德”二字在当官者手中永远是没有标准的。


    中国历史上第一个成功的政治投机商，便是以“钓居奇货”著称的吕不韦。吕不韦本是位大客商，为人狡黠有心计，他偶然遇到在赵国做人质的秦公子异人，便以为奇货可居，在这位落难公子身上下了最大的赌注。吕不韦为了使异人能获得秦国的王位，耗费数千金，四下活动，奔走于秦赵之间并终于打动了秦王的宠妾华阳夫人。华阳夫人便向秦王大刮枕头风，谈异人的贤能之处。秦王爱美情浓，只要华阳夫人喜欢，言听计从，当即表示赞同异人为嫡子，并刻符为记，永不反悔。


    吕不韦将成功的消息带回赵国国都邯郸，告诉异人。异人自然十分高兴，也十分感谢吕不韦。二人自然成了形影不离的好朋友。


    这天，二人又在吕不韦家里狂饮作乐，为助酒兴，吕不韦命自己买来作乐的赵国美女在酒席间歌舞。谁知，异人一眼便看中了能歌善舞，楚楚动人的赵姬，便乘酒兴向吕不韦索要赵姬。吕不韦一听异人竟然向自己索要最喜爱的美人，不觉大怒，可又一想，万贯家财已为这个异人耗费殆尽了，今后的荣华富贵就系在这个异人身上，千万不能因为一名小妾得罪了他。况且，那位赵姬已经怀上了自己的孩子，何不趁此机会来个顺水推舟，将赵姬许配给异人，今后，如果赵姬生个男孩，这秦国的天下不就在不知不觉中易主了吗？自己又何愁官厚禄？


    异人看到吕不韦先是愤怒之极，后又陷入深思，酒也醒了不少，立即行大礼向吕不韦赔罪，深恐得罪了这位多财多智的救命恩人，影响自己顺利登上太子之位。


    不料，吕不韦闻言，连连摆手，说：“这就见外了。您能看中我家小妾，是她的福分，也是我家的荣耀，怎能不答应您呢？我看今天便是良辰吉日，我们请公孙乾做媒，在今晚便成了这门良缘吧。”


    异人得到赵姬后，自然是男欢女爱。几个月后，赵姬便生下一子，取名为“政”。他就是后来中国的秦始皇。吕不韦巧施美人计逐渐掌握了秦国的大权。异人为秦王时，他成为丞相，后又成了秦始皇的“尚父”，执掌大权多年，显赫一时，获得了无与伦比的效益。


    与吕不韦相比，同时代的赵国人李园似乎更是计高一筹。当时楚国国君考烈王没有儿子，大臣春申君为此十分着急，怕一旦楚王驾崩，因无继承人而会引起楚国内乱。他寻找了不少生育能力强的妇人进献给楚王，然而，最终还是没能得到一个儿子。


    有一个赵国人名叫李园的，为人机智，工于心计，但从表面上看却忠厚老实可靠。他有一个妹妹李嫣，长得非常漂亮。李园想把她送给楚王做妃子，又听说他生育能力不强，担心妹妹入宫后会因此得不到楚王的宠幸。他想：要想晋见楚王必须先搭上春申君这位炙手可热的人物，不如先把妹妹献给他，待有了身孕，然后再设法进献给楚王，万一妹妹的肚皮太不争气呢，自己至少也可以和春申君保持郎舅关系，不愁将来没有官做。


    于是李园便请求到春申君门下做了舍人。不久，一次李园请假回家，故意延误了日期。回府后，春申君问他延误归期的原因，李园便回答说：“齐王派遣使臣来求聘我的妹妹，我与齐国的使臣多喝了几杯，因此耽误了归期。”春申君问：“你已接受了齐王的聘礼？”李园答道：“还没有。”春申君心想，她既然名闻齐国，必定是位绝色佳人，便急忙问：“可以让我先见见令妹吗？”其实，这正中李园下怀。


    “当然可以，难得相国肯垂青提携！”李园知春申君已上钩了，很快便把妹子送到春府去。春申君一见，就像馋猫一样迫不及待地立即据为己有，立为姬妾宠爱。


    时隔不久，李嫣怀孕了。李园知道后便偷偷地与妹妹商量，二人定下妙计。一天，李嫣趁春申君高兴，乘机劝说道：“楚王一向对您宠幸重用，即使他的亲兄弟们也无法与您相比。如今您作楚相已二十多年了，而至今楚王还没有儿子，倘若有一天楚王驾崩，他的兄弟必然会再被立为楚王，新的楚王即位后，当然要重用提拔他的亲信，你想还能得到像现在的宠信那是万不可能了。况且，你掌握国政的时间很久，对楚王的兄弟有许多不周到的地方，不管他们将来谁继承王位，都必定对你不利，到那时，也许就会大祸临头了。”


    春申君听后，不禁连连点头：“有道理，我也考虑到这一点了，可是你又有何良策呢？”


    李嫣见他动心，便趁热打铁，将兄妹二人的计谋和盘托出：“现在我已知道自己怀孕了，但外人还不知道，我到您这里的时间并不长。如果你肯割爱，把我及时送进宫去，楚王看在你的面子上，一定会宠爱我，将来孩子生下来，必定继承王位，到那时，整个楚国不就是你们春家的了吗？”


    春申君同意了李园妹妹的说法。于是便将她移出府去另找地方安置居住，然后才将她介绍给了楚王。楚王把李嫣召入宫，一见就中意。过了几个月，李嫣居然生了个双胞胎，都是男孩，正所谓“有意栽花花不开，无心插柳柳成荫。”楚王对这意外的收获，自然是喜出望外，当即立李嫣为王后。李园做了国舅，参预国政。李园作为皇亲国戚颇受楚王器重，渐渐掌握了楚国大权。


    楚王死后，李园杀掉春申君以灭口。新主登基，这位工于心计的国舅便堂而皇之地做起宰相来了。


    其实，靠女人升官也并非古人的专利，在官场上，古往今来，政治联姻结成的关系网，成了不少人攀附权贵，升官保官的护身符。民国初年，袁世凯的亲信洪述祖献妹升官即是一例。


    清末民初，北洋之父袁世凯算得上个权倾朝野的风云人物。不少人托关系，想办法以便打通袁世凯的门路，真可谓八仙过海，各显神通。洪述祖靠一位亲戚的介绍，攀上了袁世凯这个高枝，对袁氏曲意承颜，无微不至，想方设法讨袁世凯的欢心。


    袁世凯看洪述祖是个会办事的人，就提拔他襄办军务。


    洪述祖小人得志，不免自傲起来，因发军饷，惹怒了某标统。这位标统是袁世凯的至亲，他上袁世凯处告了一状，袁欲将洪撤职。


    洪述祖得到消息，魂儿都要吓出来了，好不容易得来的官职，怎么能丢了去？想来想去，终于想出一个办法。洪的胞妹，有几分姿色。洪深知老袁好色如命，就将胞妹打扮一番，送入袁宅，说是让她服侍袁大人。


    袁世凯本是好色之徒，见了这个粉妆玉琢的美人儿，垂涎欲滴，一宵枕席风光，占得人间乐趣。


    是时，洪女年方十九，秀外慧中，善眉目传情，一张樱桃小口，尤能粲吐莲花，每出一语，无不令人解颐。袁世凯有时盛怒，但经洪女数言，当时破颜为笑，因此洪女深得老袁欢心，擅房专宠。


    袁世凯的诸妾，以入门先后为次序，洪氏排在第六，本应称她为六姨太，但袁世凯令婢仆，不准称六姨太，只准称洪姨太。


    洪姨太在袁世凯面前，说一不二，连袁世凯的儿子袁克定有事都要找洪姨太，让她在枕边给袁世凯进言。


    由于有了受老袁宠爱的妹妹，洪述祖不但没有被撤职，反而讨得了袁世凯的欢心，官职一升再升。


    ## 为主子夺位跑坏了腿


    中国封建朝廷总是派系林立，每一种政治势力，每一股政治派别，总要在具有皇位继承人资格的皇室成员中，寻找自己的靠山。只要皇位继承权还没有确定到了固若金汤的地步，这些政治派系便会使出浑身解数全力为自己的主子争取，一旦帝位更迭时机来临，他们总会千方百计，不择手段地将自己的主子推上台，以求得更大的权力或将原有的宠幸地位继续保持下去。


    东周时代，齐国田乞在家中立君的故事就是一例。


    公元前490年夏，齐景公的身体逐渐衰弱下去，诸位王公贵族大臣名门，都担心齐景公立最年幼的荼为太子。因为荼的母亲芮姬虽然是齐景公的宠姬，但她的出身却十分微贱，不属于当时齐国几个大家族中的任何一个。如果荼立为太子，就意味着这几大家族谁都没有完全的把握控制住她，而且她的儿子年纪也太小，且十分顽皮，也不符合当时社会的正人君子标准。所以，这些王公贵族名门大家都希望在与自己关系密切的其他公子中选出一个太子来。可齐景公虽然年纪老了，却仍然不服老，所以特别讨厌别人提立太子的事。也是年老国君的通病，齐景公特别宠爱芮姬，也有意让她的儿子荼出任太子。但齐景公知道王公贵族们都反对立荼为太子，自己也就不好亲口说，就只好采取拖的态度。他经常对手下人说：“立什么太子呀。及时行乐吧！还怕到时国家没有君王吗？”


    就这样，立太子的事也就拖了下来。


    转眼到了秋天，齐景公的病情越来越重了，眼看着就不行了。齐景公这才下令让齐国的大家族国惠子和高昭子拥立荼为太子，并下令驱逐其他的公子。


    荼终于当上了齐国国君，他就是历史上的晏孺子。


    当时，齐国的田乞家族虽然也算大家族了，但比起国、高两大家族来说，却还差得远。田乞一直梦想着能够替代国、高两姓在齐国政务上的作用。这次国、高两姓受齐景公的遗训，拥立晏孺子为齐国国君，正为田乞的野心实现提供了一个很好的机会。他一方面极力地巴结国惠子和高昭子，寻找一切机会与他们拉关系，还装成知己的样子对他们说：“您们得到了国王的信任，是无可非议的，只是许多大臣们从自己的利益出发，感到失去了国王的宠幸，都在图谋反叛。您们一定要小心才是啊。”


    可是一转眼，田乞便四处鼓动王公贵族们起来反叛。他对大夫们说：“高昭子这个人真是太可怕了，让他掌权，我们哪里还有活路啊！大家坐着等死，还不如趁着高昭子还没来得及迫害我们的时候，我们先起来杀了他。”


    就是这样阳奉阴违，田乞很快就获得了诸位大夫的拥护，经过充分的准备之后，公元前489年6月，田乞组织发动了宫廷政变。晏孺子荼被废逐，途中被杀。高昭子被杀。国惠子逃到了莒国。其他反对政变的王公贵族也是死的死，逃的逃。田乞终于掌握了齐国的控制权。


    为了能够更名正言顺地掌握齐国的大权，田乞派人到鲁国请回了齐公子阳生。由于阳生毕竟不是齐景公立的太子，田乞恐怕诸大夫们不服从，又引起什么别的乱子来，就先把阳生藏在自己家中，等待适当的时机再让其出来登位。


    到了10月，田乞觉得时机已经差不多了，便四处邀请诸位大夫到家中做客，他对大臣们说“今天是我家的祭日，我的妻子已经在家中准备好了菲薄的祭礼，敬请各位光临。”


    谁都知道田乞当时在齐国的地位，哪里还敢说个不去。有些人想去还愁没有机会呢。


    等大家的酒正喝到兴头上的时候，田乞令人抬出了一个大口袋，里面鼓鼓的不知装的是什么。田乞让人将口袋小心翼翼地放在座席正中央。


    众人不知田乞在玩什么鬼把戏，心里直犯嘀咕，嘴上却什么也不敢说。


    还是田乞来解了人们心中的疑惑。他先对着大口袋施了重礼，然后打开口袋，对众人大声喊道：“齐国国君到了，诸位还不赶快施礼。”


    众大夫定睛一看，可不，公子阳生从口袋里站了起来。这一惊可非同小可。诸大夫慌忙就地下拜。


    田乞就势要大家盟誓共立阳生为齐国国君。为了能够更有力地说服众大夫，田乞趁着齐景公时的重臣鲍牧已经喝醉的机会，欺骗大家说，拥立阳生的主意是自己与鲍牧两人共同策划的。


    谁知鲍牧是人醉心不醉，一听田乞以自己的名义欺骗大家，情不自禁地反驳田乞说：“胡说！难道你忘了齐景公的遗命是立荼为齐国国君了吗？”


    诸大夫一看鲍牧首先带头反对立阳生，许多人也想随着反悔。


    阳生一看形势不妙。他也确实搞不清楚自己当国君的可能有多大，但他知道如果自己不能被立为国君，恐怕连性命也就难保了。为了能够保住性命，阳生急忙上前一步，冲着鲍牧猛地就跪倒在地，叩起头来，口中还不停地说：“能立我为君就立，不能立也就算了，诸位千万不要勉强。”


    这回该轮到鲍牧害怕了。


    堂堂一位公子，也许马上就是一位国君，竟然在众目睽睽之下跪在了自己脚下，这些生来就是人臣的怎么能担当得起呢？再想想，田乞这次既然请大家来了，就是早已准备好了的。自己如果坚决反对的话，只可能给自己带来不愉快，丝毫不能阻止阳生当上齐国国君。好在鲍牧已经醉了，便趁着醉意对阳生说道：“什么可以不可以的！都是景公的儿子嘛，谁当国君都可以嘛。”


    田乞和阳生虚惊一场。


    众人看到鲍牧也表示赞同了，也纷纷地表示拥护阳生出任齐国国君，并当场盟誓。阳生也就是后来的齐悼公。田氏家族从此也就开始控制齐国的政事了。


    秦国太监赵高也用阴阳颠倒的手段，废掉秦始皇的继承人扶苏而另立胡亥为帝。


    公元前210年7月，秦始皇出巡死于河北沙丘。按照西周宗法制嫡长子继承王位的传统，秦始皇死后，自然应由长子扶苏继承皇位。始皇临终前给扶苏遗诏，也正是按照这一传统行事。心怀鬼胎的赵高明白，长公子扶苏因长期在将军蒙恬处监军，他继位后肯定不会重用自己，相位非蒙恬莫属。更令赵高胆寒的是，有一次赵高犯法，秦始皇命令蒙恬之弟、上卿蒙毅论处。蒙毅依法办事，削夺了赵高的官职，并处以死刑，若非秦始皇姑念赵高办事干练、认真，亲诏赦免，自己早就一命呜呼了。如果蒙氏兄弟日后果然当政，哪里还会有自己的好日子过呢？想到这里，他真是忧心如焚，整个晚上在床上翻来覆去睡不着，终于，他想出了一条偷梁换柱、反客为主之计。他要趁此遗诏尚未发出之际，串通胡亥和李斯，伪造一份诏书，杀掉扶苏和蒙恬，使胡亥继位，有了胡亥这个靠山，自己不但可免祸，还可升官。但是怎样才能拉拢胡亥和李斯呢？他琢磨着并准备了整整一套说辞，决心冒着生命的危险，孤注一掷，以求实现自己的愿望。


    第二天当车驾一行在途中休息的时候，他单独进见了胡亥，将秦始皇的遗诏呈给他。等到胡亥看完后，他以平缓却很重的语气说：“长公子扶苏回到咸阳，便可以继承皇位；而您却没有尺寸封地，真是太吃亏了！”胡亥说：“长兄将来是会做适当处理的。现在父皇刚去世，我怎好计较这些呢？”赵高又挑拨说：“事情恐怕不是那么简单，自己做皇帝和受皇帝的支配，是根本不同的。这份遗诏，只有您、丞相李斯和我几个人知道，我们只要将诏书略加修改，天下就是您的了。”胡亥听了这话，大吃一惊。他想了一会儿，说：“废长立幼是不义的，不尊父命是不孝的，靠别人的计谋成功是无能的。天下的老百姓不会心服，自己也不会有好结果。”胡亥的这种态度，早在赵高预料之中，他胸有成竹地继续说道：“这种事情，历史上多着呢！商汤、周武杀了他们的国君，天下却赞颂他们的仁义，并没有人说他们不忠。卫国的国君杀了自己的父亲，而卫国的人都赞扬他有道德，并没有人说他不孝，连孔子都在《春秋》中记载了这件事。干大事不必拘泥于小节，在这关键时刻顾小而忘大，将来就后悔莫及了。”胡亥说：“现在父皇逝世的消息尚未公布，这事怎好对丞相去说呢？”老奸巨猾的赵高一听到这话，知道胡亥虽然仍有疑虑，但心里已经有些活动，便赶快说，“丞相方面我去办，这您就放心吧！”在当皇帝欲望的支配下，胡亥终于同意，并派赵高去游说李斯。


    赵高马上兴冲冲地找到李斯，对他说：“皇上驾崩前赐给长公子扶苏一道诏书，命令他到咸阳去参加葬礼，并继承皇位，这事只有您和我、公子胡亥知道。现在这份诏书尚未发出，而且皇帝的玉玺和诏书都在公子胡亥手中，确立谁继承皇位，就在您和我一句话了。您看，这事怎么办好呢？”李斯听了此话后一愣，说：“您怎么说这种话？这可不是我们当臣子应当议论的事啊！”赵高又挑拨说：“请丞相自己估量一下吧，论才能您比得上蒙恬吗？论功劳您比得上蒙恬吗？论深谋远虑您比得上蒙恬吗？论无怨于天下您比得上蒙恬吗？论与长公子扶苏的关系和扶苏的信赖程度您比得上蒙恬吗？”赵高一连串问话，引起了李斯的很大震动，他无可奈何地回答道：“的确，这五点我都比不上蒙恬。”


