    术，却不是缺德的表现。即是说，只要不是小人奸计，都将排除在本书之外。


    不知道读者诸君是否已经明白了我的意思。反正缺德学这样一门学问，和模糊学、糊涂学、混沌学等相似，皆是对历史或社会现象的透视与暴露。模糊学意在让人更清楚一些问题，而不是对问题本身越来越搞不明白。比如，模糊数学讲的就是怎样让人思路更清晰。这里，我们也要提前告诉读者的是，缺德学不是为缺德而缺德，读完本书，缺德之人不会有什么长进。我们倒很希望芸芸众生从中获得一些人生智慧，藉此防范于未然。俗话说得好：“害人之心不可有，防人之心不可无。”进一步说，嘘！悄悄地告诉你，在世风日下、人欲横流的今天，无论是在商场角逐，还是在政界当差；无论是在人际交往的生活中，还是在花红柳绿的情场上……善良的人们，请您多长个心眼。


    当然，对一些经常陷入陷阱的人来说，本书的出现可能显得有些姗姗来迟。在此，我们要深情地说一声：“抱歉，让您久等了！”但愿下面我们的“危言耸听”能让诸君弥补您那“等待的太久太久”的饥渴热望。


    书归正传。鉴于“名不正，言不顺”的考虑，我们不妨先给“缺德”一词正正名。我们知道，一个人的名声与其道德素质有着极其密切的关系。因此也就有了“有德”与“无德”之分。不言而喻，“无德”就是缺德的一部分。但是，这里有必要说明的是，它们两个并不是半斤八两的关系。在某种意义上说，“无德”的意义意指一种没有付出行动的客观叙事，而“缺德”则是指一种已经造成严重不良后果的恶劣、卑鄙的行动。譬如说，“女子无才便是德”讲的就是这样一种情况。


    “女子无才便是德”，那要是有“才”呢？按照这一逻辑推演下去，很可能就是“女子有才便无德”。很明显，“无德”是一种静态概念。千呼万唤始出来，及此，我们该触及“缺德”了：“缺乏好的品德。指人做坏事，恶作剧，开玩笑，使人为难等”。这是颇具权威性的商务印书馆《现代汉语词典》的注释。平时我们日常生活中经常所说的“缺德话”、“缺德事”、“真缺德”等口头禅都是重现眼前事实的。


    或许这是每一位作者的习惯，每做一件事都要事先来个“留下真名从头说”。您说我“既要做婊子，又要立牌坊”也好；说我如同鲁迅笔下的哪个喝了人家的血，还要发一大通议论的蚊子也好；说我“写缺德书本身就缺德”也好，反正这次我已横下一条心，让“缺德学”走向角角落落。胡适博士有一句话颇为适合我们的心情：“既然做了过河卒，只得拼命向前了。”我想，当年胡适一帮人搞新文化运动时那种惴惴不安的忐忑心理一定和“寡人”有相似之处。


    ## 缺德物语：我的缺德学观


    不同的事物有其不同的特点。而对人们来说，即使是对同一个事物，从不同的角度去看它，又会得出截然不同的结论。就为人熟知的缺德观来说，可能也是仁者见仁，智者见智。即是说，一个时代有一个时代的道德。比如，很多在古代看来不道德或是缺德的事在令人眼里都成了过眼烟云。这就是哲学上所说的事物的相对性。古代人的婚恋凭借的是“父母之命，媒妁之言”。若是有谁违背了这个道德武器约束下的规定，随随便便的自我定情约会，那必定会被骂作大逆不道、为非作歹的缺德鬼。相反，今天若是有谁硬是逼婚强娶、拆散一对好姻缘，同样也会被人们指责为不尽情理的“半吊子”。“半吊子”者，“二百五”之谓也。依笔者看来，缺德的意义很难在此解释清楚。这并不是写书的人要滑头，或说缺德学的书还未出就开始缺德了。因为照我的想法，缺德的可塑性比任何品性都来得复杂。缺德是一种品性，它与高尚、美德、情操无缘。正因为如此，在中国这样一个一向以道德为第一准绳的国度里，缺德之人在所难逃。人们认为道德最高尚的人就是最伟大的人。“万恶淫为首，百善孝为先”从正反两个方面述说了道德的重要性。但就是这两句话是否就说得天衣无缝呢？“万恶淫为首”一古脑儿地将人性的本能给轻易否定了；“百善孝为先”则置“忠”的做事原则于不顾。难道说这就是道德高尚与道德低下之区别？可能问题并不如我们想像的那么简单。当然，人们对道德至高境界的追求并没有什么可以非议的地方。问题是好的理想总归是理想，它不可能代替现实的狼藉。中国流传不息的《三字经》第一句就是“人之初，性本善”。恕吾直言，直到今天我还是怀疑这句话的魅力。关于其不科学的质疑已经成为定论，而关于其道德不道德的疑问可能本人算是第一家了。要知道，在很多情况下，愿望和结果永远是一对扭在一起的冤家。


    您一定听说过不少关于仿造假药、假酒赚黑心钱的缺德事件。那些丧尽天良的人为了个人利益真是胆大妄为。可是，您是否知道，还有人曾打着锣鼓去深表谢意呢！何以故？原来，两口子生气喝了假农药安然无恙。“谁能告诉我，是对还是错？”这里，笔者并没有为造假者开脱的意思。我只不过是想借此说明道德不道德亦有偶然性。好的动机不一定有好的结果，好的结果也不一定就是好的动机所致。说来说去，缺德学就是这样不可思议！


    上面我们谈到了道德与时代的阴差阳错。这是否就是说道德是无标准、无国界、无定论的“三无”产品呢？这就是接下来我们要谈的问题。应该说，尽管道德的含义很难用一句话概括，但它在共相意义上说又是能够形成共识的。有的行为不需要什么讨论、质疑、辩证，一目了然，可以说是“司马昭之心，路人皆知”。譬如说，不管历史怎样演变，我想中外历史上第一个想用“阉割”的办法讨好皇帝的人应该说是极为缺德的一个人。从这个“馊主意”就足见其心狠手辣到了何种程度。但也就是这个“馊主意”，阉割法的发明人却深得皇帝老子的赏识。毕竟，割掉生殖器的举措可以省去许多让人心烦的事。一是皇帝身边的三妻六妾、妃妃子子们相安无事，不必要整天派人监视。更何况派人监视也不保险，说不定哪一天自己就会戴上“绿帽子”。在皇帝老子那里，戴“绿帽子”倒是小事，可自己的皇位要是落在了“野种”手里岂非大事！二是被阉割的太监会性情温存，失去了刚烈。这就好像是被骗了的狗和马之类，性欲没有了，雄心、阳刚的强健也随之消失了。嘿嘿，嘿嘿！缺德之人九分得意地阴笑，皇帝老子更是十分得意地好笑。


    试想，站在不同的角度思考问题怎奈何不出各利其利的结论！


    再想，我们又如何不为这种为了某种目的而不择手段的残忍与卑鄙愤慨！


    既然道德的躯体那样复杂，那么将之当作一门学问去研究就不是小题大做了。“恻隐之心，人皆有之。”同样的道理，不愿落缺德之名的心理也是人人尽有。如此说来，我们紧接着谈一谈如何恰当地运用招数应付环境，既能达到自家目的又不致遭受“缺德”的非议无疑是当务之急。


    ## 缺德夜话：说尽身边无限事，唯有缺德难开言


    您一定听说过这么一句话：“德不德，情来定”。说实话，道德听起来神圣，但做起来确实不那么听使唤。个中缘由还在于它属于情感、心性范畴的东西。有鉴于此，笔者就有了自己的缺德观。我这个缺德观就是要公然申明，本书是教育众人“如何合法缺德”的。我们不是伪君子或真小人，不能为达到目的就不择手段，但是当缺德者先采用卑劣的手段攻击时，应坦然以相同的手段进行自卫。既然敢这样冒天下之大不韪，自然就有一把他人有所不知的金刚钻。


    在兄弟看来，“德”这玩意儿是万万不可缺的，一朝缺了德，一辈子难翻身。可话又说回来，似乎这玩意儿总是和人做对，“德”又是人身上最为缺乏的东西。谁都想落个修养高深、德高望重的美名。可又有谁不知这样一个道理：“好事不出门，孬事传万里”。更为绝妙的一句话还在这里：“干净洁白的底子好脏”。对一个臭名昭著、无恶不作的奸佞小人来说，“我是流氓我怕谁”。他习惯了“破罐子”式的生活，索性“破罐子破摔”。而在一般人看来，反正他不是一个好鸟，犯不着跟他理论，更不值得大惊小怪。然而，对充当“君子”角色的人可就大不一样了。若是有小小的差错，那可是“不鸣则已，一鸣惊人”的买卖。在现实生活中，人们常怀一种好奇的心理，尤其是喜欢关心那些与自己容易形成对立之人的隐私。可能，这就是奥地利心理学家弗洛伊德所说的“窥淫癖”。信不信由你，“没有不透风的墙”说出了其中的奥妙。其他诸如“若要人不知，除非己莫为”等民间俗语都有极其深刻的社会背景。鲁迅先生就曾这样说过：你身边的人可能并不关心英国或是美国的某某和某某偷情，但是却十分关心自己周围的谁和谁幽会。如此这般，诸位还是好自为之。否则，诸如“东窗事发”之类的染指，那可就变色了。大量的事实证明，一个人生活在世界上最累的事情并不是工作，而是名誉。换句话说，道德的约束如同枷锁和缧绁，又如同是一张无形的网。何以故？兄弟有所不知，创德难，守德更难啊！俗话说得好，“学好三年，学坏三天”，“一朝失足千古恨”。在世人眼里，即使您一生一世积德行善、大恩大德，若是稍有不慎失了“节”，也还是得不到人们的谅解。他们挂在嘴边的一句话是：“临死喝碗狗汤”。的确，缺德事人人想了解，做缺德事的人却极力捂着藏着。与此同时，另一个缺德定律是：人人争传他人的缺德之行，独对自己的缺德行为避而不谈。大家瞧瞧，这又算不算缺德呢？进一步说，如果每一个人都躬身自问，是否缺德之行就完全与自己绝缘呢？


    真的，这缺德之事又有几分能说得清？有时候，真让人糊里又糊涂！


    这里，让我们从一位政治家为一位思想家所题的挽联谈起。1962年2月，当代思想大师胡适先生于台北逝世，蒋介石闻知噩耗后亲笔为胡适写了一副挽联：


    > 适之先生千古

    新文化中旧道德的楷模

    旧伦理中新思想的师表


    老蒋的“手感”究竟如何？胡适的道德究竟怎样？这一系列的问号说也说不清楚。众所周知，胡适是中国现代史上提倡新道德最为有力的人士之一，而最后的“盖棺论定”却又反映出他对“缺德”历史大打出乎后的回潮。恰恰是这么一个复杂的历史人物，在身后留下了显赫的功名。


    最近，我在一本日本人著的名为《缺德艺术》的书中看到这么一句话：“本讲座教大家如何缺德，但是缺德和犯罪不同，只有白痴和低能儿才会去冒犯法律条文，只要不违反法律，任何人都会惩罚你。”有点意思吧，只要你不犯罪，你的行为再“缺德”也没有关系。这可比鄙人的观点来得大胆干脆。前面我已说过，本书的重点不在教人缺德，而是教人怎样防止缺德之人的侵犯。不过，有可能的话，我还想介绍一下如何识别深藏不露的缺德行为，以及怎样在道德与不道德之间脱身。


    挖人隐私者算不算缺德？就算人家的丑事被你挖到，你到处翻嘴调舌算不算缺德？从尊重隐私权的角度来看，这乃是最大的缺德。俄国作家果戈里所作的剧本《钦差大臣》中有这么一个人物，专门私拆别人的信件，以窥探他人隐私。由此，他亲自导演了一幕惨不忍睹的缺德剧。其中的人物从大臣到女儿无不成了观众鄙视的缺德鬼。


    一句话：在缺德与不缺德之间只有一步之遥。


    在中国古代历史上，我们并不缺乏这号看似风光而着实缺德的“智慧”型人物。在残血如阳的古战场，一些叱咤风云的历史人物可不就是靠那些馊得不能闻的馊主意馊出来的。细说起来，我们这个最讲道德的民族从春秋战国时期就开始缺德了。他们的主意固然让一代君王成就了一番事业，可谁又曾想过，在这一番事业背后又有多少人做了冤魂。


    ## 缺德学原理


    春秋时代的名相管仲出台的“尊周攘夷”政策不是很值得我们研究吗?自从有了管仲的政策，齐国一跃而成为五霸之首。后来晋文公称霸，也是这一政策指导的结果。战国时代，有个叫苏秦的人面对强大的秦国，在其他六国国君都束手无策的情况下登高一呼：“联六国以抗秦国”，这同样是我们必须谈到的话题。要知道，他的纵约成功，使秦人
    15 年不敢出关。还有那精明过人的张仪，说起来同样让人为之一惊。吃政治饭的政客从来就是这样狠、阴、奸。他们为了取得主子的欢心，更是为了自己的利益，什么丧尽天良的事都能干出来。


    时势造英雄，英雄造时势。撇开这一鸡生蛋、蛋生鸡的“吊胃”问题不论，我们静下来想一想，为何做了婊子的人却能立起名垂千古的贞节牌坊？管仲生活的时代正值诸侯相互攻伐、异族军队乘机入侵的时代，此时周天子丧失了驾驭王朝的能力。在这种情况下，弱小国家受到践踏是自然而然的事。正在危急关头，忽然跳出一个挑起“尊重周王，攘除外族”的管氏，众人不觉有回头是岸之感。他那用天子的名义驱逐异族侵略，保全弱小民族的办法大受当权者的欢迎：齐去讨伐西戎而就燕国，共同攻打北边狄而救卫国。当时的形势是，楚国是第一强国，齐国国政不佳、祸起萧墙，齐桓公时，连鲁国这样的小国都敌不过，内部虚弱程度可想而知。召陵之战，竟把楚国给降服了。这完全是“管缺德”一手遮的天。这一计谋的缺德表现就是，“不适者”亦能生存，“适者”反而不利生存。从优胜劣汰的进化角度来看，这不是开历史倒车是干什么？翻手为云，覆手为雨。颠倒黑白的事一桩桩、一件件无不是他们捣腾出来的。就此而言，将给他们戴上“缺德”的“桂冠”，他们也是当之无愧的。后来，三国时期曹操的“挟天子以令诸侯”的举措也与其有点沾亲带故。诸葛亮的联吴抗魏不也是有案可稽的么？


    战国时期，七雄并立。齐楚燕赵韩魏秦并立竞进，“天子”的威信如同肥皂泡一样禁不住考验。如果再用那具“纸老虎”去做挡箭牌，无异于去施第二次“空城计”。“尊周”谈不上了，“攘外”也不好再提。因为秦国和楚国在春秋时期就是外族。当时，秦国势力在七国之中最为强大，有点老虎屁股摸不得的味道。尤其令其他六国为之担忧的是，秦国虎视眈眈，一触即发，随时有吞并六国的可能。说来也巧，历史再次为英雄提供了造“时势”的机会。苏秦挺身而出，到处游说，力主六国联合起来对付秦国。细心的读者会发现，这种合力政策不过是“管缺德”计谋的翻版。瞎！诸位可别小看了苏秦的“联纵”，为这玩意儿这小子可是花了点真功夫的。要不，怎么说这是一门学问呢！苏氏曾头悬梁、锥刺股，绞尽脑汁琢磨研究。功夫不负有心人。嘿！出来了。到底苏秦的主意又是从哪里来的呢？原来，他精通道家的“阴符”说，而这阴符说又从哪里得到说明呢？老子的《道德经》确有其理。在中国，老子的道德思想可谓家喻户晓，在这里我们真有点触犯众怒了。且听我慢慢地道来。老子说：“天道不就像拉弓瞄准一样么？高了，就压低些；低了，就升高些，对有多余田地的要减少它，对不足的要补充它。”苏秦就是从中学到了一个“平衡”原理。他出游六国，其基本理论还是“平定”天下。挂在苏秦嘴边的一句话是。“宁可做鸡的嘴巴，不愿做牛的肛门。”他说这话的时候，其实自己已经做了牛的“肛门”。


    苏秦刚刚出山的时候，游说很顺，这正应验了他自己的话。《战国策》上都记载有这样的话：“在那个时候，普天之下，众多的百姓，八面威风的王侯将相，掌握实权的谋臣，都服从苏秦的政策。”而且非常自信地预言：“苏秦游说诸侯国君，堵塞国君手下人的口，天下人没有哪个与他相抗衡。”然而，“苏缺德”毕竟没有“缺德”那样幸运，他的三寸不烂之舌最后只能是昙花一现。本来，苏秦的计谋并不亚于管仲，怎奈他是一个胸无大志之人，只不过是想借此混口饭吃，以解“近忧”。想当年，他只是因为忍受不了“妻不下纴，嫂不为炊”的气才发愤钻研、投机钻营的。待到佩带上了六国相印，那副小人得志的模样就原形毕露了。俗话说得好：“人无远虑，必有近忧。”像他这样满足当前的燕雀怎么能成就大事？更何况由于他的不思进取，未能建立一个以自己为中心的稳定结构。这种方法与无政府主义的“互助”之说颇为相似。在群龙无首的阵营中，最终的结果只能是和克鲁泡特金的无政府一样，化作过眼的烟云。


    说来说去，苏秦的缺德学问并不高明。若是他再潜心下去，弄懂“缺德缺在心里头，仁义善行作外露”的缺德秘诀，就不至于落到这步田地了。君不见，有些做了缺德大事的人仍能不为唾骂，反而为人尊称为什么大师、圣人呢。难怪有人常说“好人不长命，坏人活千年”呢。


    在赤裸裸的缺德面包上涂上仁义的奶油咽下去，远比其他吃法来得高明。夹心面包尽管里面包裹着黑色的豆沙，但外表的光彩夺目还是能让人接受的。


    诸葛亮历来被作为中国历史上一位贤明的正人君子出现在人们面前，而和他同时代的许多将士皆未能获得此荣，何故？若不是他跟随了一个讲究仁义道德、注重修养的刘备，恐怕就难以获此殊荣了。这里，与其说是蜀国人才受人欢迎，还不如说是其道德文章做得好。“孙刘联合，攻打强国”的政策在吴国只有鲁肃懂得，在蜀国只有诸葛亮了解，而这两人的主张又不过是管仲、苏秦两位缺德祖先的高足。


    说来话长，纣王的暴虐、秦王的苛政，从古至今，哪一个当权者不曾有过几桩缺德的血腥历史？楚汉相争，汉高祖屡战屡败，无奈之际，便采用了极不光彩的手段。所谓的“吾宁斗智不斗力”的宣言，无非是在力不及人情况下的一种无奈。在彭城被打败后，他问群臣有什么策略，张良献计。于是，刘邦将关以东的土地分别捐给韩信、彭越、黥布三人。齐王、梁王、九江王就这样产生了。刘邦技高一筹，他用兵荥阳，其他三人从它处进攻，西楚霸王项羽陷入四面楚歌的境遇。待到垓下之战把项羽杀死，刘邦的缺德学问才暴露无遗。


    写到这里，忽然想起中国的一句老话来：三代以上有圣人，三代以下没有圣人。我不由得怀疑起来，真有些像鲁迅先生当年“怀疑一切”那个样子。鲁迅先生说中国几千年的历史都是“吃人”的历史，而且吃人者个个道貌岸然，满口仁义道德。于是我想，这几千年的历史真的产生过圣人么？我们通常所说的圣人尧、舜、禹、汤、文、武、周公、孔子到底应不应该怀疑一下呢？诸位注意，这八个圣人中，除掉孔子外，个个可都是开国之君呀！而孔子呢，一提起他的学生子路死于他那“君子死，冠不免”的说教，我就有点感到不对劲。有时候，我真想大声地喊一嗓子：“好一个缺德的道德说教！”


    曾经在幽幽暗暗、反反复复中追问，才知道以前的认识太肤浅。在半梦半醒之间，我今天也要醉它一回：几千年旧账，就是一笔缺德流水账啊！


    这里，我要特别感谢鲁迅先生的提醒。


    ## 缺德原理


    ## 缺德园里：州官可以放火，百姓可以点灯


    中国有句成语叫“只许州官放火，不许百姓点灯”。而这句话若是用在缺德园里就不那么恰当了。俗话说：“上梁不正下梁歪”。所以我们说缺德大观园里什么鸟都有并不过分。大智、大勇、大权者有，奇娟、奇伶、奇阔者也不乏其人。


    缺德这玩意儿似乎没有专利，什么人都能做。而且，也没有时间限制，今人古人都能做。说得宽泛些，也没有地域限制，中外各地无不有之。列位听着，下面我们一一说来。


    一个仅有小聪明的人尽管缺德，但他“缺”不过一个具有大智慧的人。因此，我们的话题不免从“领袖”开始。毕竟，衣服的“领”与“袖”总是最为先烂的地方。


    大家一定听说过“指鹿为马”的成语。我总觉得这个成语里讲的人物赵高是一个极为缺德的奸人。说的是秦朝二世皇帝的时候，丞相赵高想造反，又怕别的臣子不附和，就先试验一下。他把一只鹿献给二世，说：“这是马。”二世笑着说：“丞相错了吧，把鹿说成马了。”问周围的人，有的不说话，有的说是马，有的说是鹿。事后，赵高就把说成是鹿的人杀了。固然，在他之前的商纣王等领袖型人物也很缺德，但相对而言，赵高的“黑”与“厚”更高一筹。依笔者之见，他是中国缺德史上最为值得大书特书之人。所谓的心狠手辣，所谓的颠倒黑白，所谓的丧尽天良，尽在其中。


    唐代奸相李林甫，北宋奸臣蔡京、奸相秦桧，明代贪鄙奸横的严嵩、阉党魏忠贤的缺德账可谓罄竹难书。在向来为名人讳的时代尚且能有如此之多的缺德谱，足见当权者的丑态矣。


    在当代，“文革”期间的缺德账我们历历在目。林彪之子选妃的丑行曾使很多人成为美好爱情的祭品。张宁一生的坎坷经历及其精神上的痛苦是无法用金钱和文字来衡量的。最近，我从1997年9月15日的《文摘周报》上看到了描写昔日“妃子”近况时所说的几段话：


    张宁的父亲是老红军，母亲16岁参加八路军。张宁小时候叫张宁生，1960年不到10岁时当兵成了部队前线歌舞团舞蹈演员，后改名为“张宁”。她在舞坛发展很顺利，成了舞蹈界的尖子。


    1968年底，林彪家庭开始了全国范围的“大选妃”，张宁被选上。后来，张宁因“九一三”事件被审查了4年。


    林彪的干部邱会作有个警卫参谋江水，也曾看上过张宁，事情被察觉后，他被开除党籍，定为现行反革命罪，押去四川山里服苦役。“九一三”事件后，他被平反。当张宁受4年审查从林彪专案组出来后，江水又找到张宁，他俩结婚了。但婚后两人拧不到一起。孩子6岁时，他俩离婚。离婚后，他独自抚养儿子江晨。作为当年的“妃子”她闻名遐迩，身边常有各种各样的人出现，在追求她的人中有个心理变态的青年叫孙斌，纠缠了好一阵，仍达不到目的，于是凶狠地对张宁说：“你可是落毛的凤凰不如鸡，谁能像我这样待你好。你不给我好过，我也不会给你好过，我要让你痛苦一辈子。”

    '
