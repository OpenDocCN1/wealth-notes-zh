    # # 跳槽万岁论：

    ## 把握一生成功的转机


    # ### 准勤务理论


    公司是上班族的衣食父母，代表公司的主管有时比你的亲爹娘更有威严。一个下巴抬得半天高的大头目，大声地命令女职员泡茶、男职员去巷口替他买烟，可是当他回到家以后，可能要苦苦哀求自己的孩子别再头抹浪子膏，四处鬼混了。


    各位上班族不要笑，你们自己呢？周日在家中，令尊令堂喊你干活，你却大义凛然，充耳不闻，或者阳奉阴违，趁早鞋底抹油——溜之大吉。在公司的时候，上司才伸手入怀取烟，你的右手立刻在自己腰际一抹，当地晃了一下，打火机上跳着机灵的小火焰。


    综合以上的大观，我们可知：尽管上班族张牙舞爪，扬言无恶不作，他在内心仍对公司敬畏有加。每当忍无可忍，他就以“天下无不是的公司”自勉，最后证明了人类的耐性远非他所能想像。


    本人到今讲得极顺口，但是各位当真了吗？英勇的缺德战士们，公司毕竟不是父母，亲爹娘也不可能是圣人，当工作为你带来不胜负荷的痛苦时，请悍然跳槽、改行、倒戈及反正吧！跳、改、倒、反这套形似“文化大革命”用语的动作的确令人不安，可是，再保守的上班族都曾认真考虑过离职他就。'
  - '[PAGE 411]


    “男怕入错行，女怕嫁错郎”，以上两大悲剧有甚于“艾迪帕斯王”与“窦娥冤”。所谓“乐以忘忧”、“乐此不疲”，上班族若能喜爱自己的工作，根本就不会计较心理及生理上的忧愤。反之，为了“有奶便是娘”的生活，就非常度日如年，水深火热了。


    上班族的私生活有限，一般只有平日的睡前 4 小时（假设 7 点到家，11 点上床）以及周六下午到周日晚上。以上“非勤务时间”姑以 OFF 代表。众所周知的“勤务时间”则以
    ON 代表。各位可以发现，OFF 之中有不少不甚利用的零碎时间，上班族必须在这些时间内为工作而待命或善后，我们称之“准勤务时间”，即所谓 SEMI ON。举例来说，各位在周日晚忽然想起第二天要早起上班，不由皱眉嘟嘴，心肌紧张，这就是一种
    SEMI ON。


    根据以上的“准勤务理论”，我们可以比较快乐的上班族 A 和痛苦的上班族 B。


    ![](img/edb37364df251c1123d6acadab5d432a_411_0.png)


    # 准勤务时间与工作压力'
  - '[PAGE 412]


    如图所示，A 的 ON 及 OFF 泾渭分明，工作压力不致于以 SEMI ON 的方式破坏他的私生活。A 的心中有如装了“心情频道”，上班时道貌岸然，一下班立刻欢天喜地，展臂投入私生活。他在休闲时不是从不想起工作，但那完全出于主动，许多妙点子因而诞生。


    B 的 24 小时则布满阴影，ON 时黑鸦鸦，OFF 时鸦鸦黑，工作中的痛苦成了被取缔的流动摊贩，偏偏 B 又经不起失败，结局只好变成一个精神官能症患者。


    总之，A 和 B 的生活有如天壤之别，有心跳槽的 B 不要再犹豫了。


    # 半空半满的水


    谈到燃起工作热情，近来很流行一种说法，本人无以名之，姑且称它作“半杯水精神胜利法”。


    宣传本方法的人常用半杯水或半碗味噌汤作比喻，但是重点不在什么容器装了什么饮料。简单说，桌上放了半杯水，悲观的人看了说：“唉，半杯是空的，只剩半杯水。”乐观的人说：“半杯是满的，还有半杯水。”不同人对同一现象会有不同的反应。


    “半杯水”的寓言到此为止并不算错。错的是说故事的人要大家效法乐观者的看法。要是“资本主义企业分配体制下受薪阶级之精神结构的异化”那么好解决，本主讲人早就回家研究茶杯去了，何苦办这讲座，引起天怒人怨？当上班族追问他生而为人的价值何何时在，我们何忍教他“保持微笑”、“说话肯定而宏亮”、“随时给自己一个小奖励”等小秘诀？'
  - '[PAGE 413]


    “半杯水精神胜利法”的优点在于“尽其在我”，职权再小的上班族，总有控制自己脸部肌肉的自由，他可以用张飞的洪亮声音讲话，也有权在桌玻璃板下压一张“半杯水是满的”当座右铭（又称智慧小语、人生金言、小故事大道理、隽永短文等）。问题是，我们这些老奸巨猾的上班族又何尝不知道“乐观”的重要，男士更是了解军中“从外在影响内在”的管理方法。


    我们偶尔可以用“半杯水思考法”安慰自己，但是千万不要放弃怀疑的机会——是不是你的部门、你的公司出了毛病？


    本人当然不主张“半杯水是空的”，这只有在跟以乐观为己任的人抬杠时有用，用完就要丢掉。最好的公式是：了解杯子的容量以及水的容积。一公升的杯子装了 500CC
    的水——这不是一目了然吗？


    客观地评估过杯子（公司）和水（上班族的自我）之后，各位就可自行判断要不要弃旧迎新，等决定不跳槽了，再来凝视那半满的水也不迟。


    # # 可怕的从一而终


    厌勤的上班族可分为四种类型：


    +   一、不得不然型——明知工作不符合自己的个性，却找不到更好的，只好一头栽进现在的岗位。

    二、幻灭型——抱着希望上贼船。

    三、综合型——不满于人际关系、待遇、公司政策、部门的气氛、上司的怪癖等，久而久之，郁结心中。

    四、忍辱负重 型——为了更崇高的理想，不惜屈就现职。'
  - '[PAGE 414]


    本型人物与“不得不煞型”形似神异，差别在于有无长远的打算。


    第三种类型之所以厌恶自己的工作，主要是受到外在因素干扰，与工作的本质无关，只要外在因素改变，他会重新投入。第四种类型则是另有钟情之处，全靠本讲所提到的“心情频道”安抚自己，一旦他的理想落空，很有可能爱上目前的工作，举例来说，有许多文人放弃作家之梦后，反成了杰出的编辑或评论家。


    本讲乃为第一、二种类型人物而设，这些人早已心死，非跳槽不足以重建生趣，因为他的心死了，恐惧和自卫的本能更容易控制他，一拂袖而去，这是一个悲哀的恶性循环。


