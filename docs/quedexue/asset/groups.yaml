    # 如何谋杀同仁：

    巧妙运用心理战术


    ## 缺德不受罚原理


    各位亲爱的上班族，在前二讲中，我们介绍了辨别战友、党同伐异等手法，各位是否已在办公室内牛刀小试了呢？今天我们要进入缺德艺术的殿堂——“谋杀”公司同仁而能逍遥法外。


    各位一定咽了一口口水吧？其实就连主讲人我都忍不住血脉贲张，蠢蠢欲动哪！


    “善有善报，恶有恶报”是人类的理想，从经济学的观点来说，行善和行恶都是为了逞一时之快或搜取眼前之利，我们社会鼓励善行，故要用各种奖赏来扩大行善人的快感及利益，同样的道理，反对恶行的具体作法就是使行恶人感到不快、蒙受损失。然而，古今中外总有一些狂人、巧人自信能在行恶后逃过制裁，其中有人自找麻烦，但不容否认的一定也有人狡计得逞。各位衣冠楚楚、一派斯文，当然不是狂人，以下我们来探讨一下如何用智慧享君子之名，获小人之利。


    在现代的法治社会中，缺德而不受罚的情况有四：


    - A. 缺德的行为无情而悖理，却又不构成法律上的犯罪要件。

    - B. 缺德的行为显然违法，但是技术上检察单位提不出有力罪证。

    - C. 缺德身份不明。

    - D. 受害者或社会大众不知罪行已发生。


    以上是泛就缺德而论，而社会中心犯罪最令人怦然心动的就是杀人了，“蓄意杀人”又比“冲动杀人”或“过失杀人”要刺激许多，君不见各民族在各历史时代中的法律或有差异，“杀人者死”的戒律却永远不变，这代表我们社会对杀人凶手深恶痛绝，这也是主张废除死刑者至今不能获全面成功的原因。


    各位压抑太久的上班族，请扪心自问：“我心中真的不想杀掉公司内那位老找我麻烦的同事么？”或许你不敢杀人，也不屑于杀人，但是你至少关心别人可能用什么手段杀你吧？


    ## 饮食交际杀人法


    敌人人人会杀，方法万千，各有巧妙不同，近身攻击可用刀斧剑棍，讲究音响效果的可用枪械弹药，若要神不知鬼不觉，暗中下毒最为合适。


    可是以上的方法常在尸体上留下痕迹，购买凶器及处理凶器也相当麻烦，实在不容易符合我们前一节所提到的 A、B、C、D 四种要素。


    在此，本人郑重推荐“饮食交际杀人法”。在运用本法之前，要先探知敌人的健康情况，然后对症下毒、锦上添花、雪中送炭。要是敌人饭后常要服用丸药，不妨假意慰问，前去看他的药是要治什么病，对那种上二楼也要搭电梯的胖子，我们可以假设循环系统有毛病，总之，对方每天要和你共同生活8小时，他想瞒你可不大容易，只要你有心观察。


    敌人有心脏病，你不妨常约他去爬山、游泳、拼酒、打麻将，当他力有不逮，想退缩的时候，你要用一切人情、权势使他欲罢不能。敌人要是有胃溃疡，更要示以名牌烈酒，他要是闻到酒香，肯自行了断便罢，否则你可以皱眉故作受到侮辱状说：“您不喝就太不给小弟面子啦。”自称“小弟”有什么关系，谋杀得逞后你还可以叫他“先友”呢！


    检讨“饮食交际杀人法”，我们可以发现法律条文无法规范它、事后搜证困难、不易确定犯人是谁、受害者及社会大众不知谋杀行动早已展开等四大优点，证诸前述的 A、B、C、D
    犯罪不受罚原理，显然各位上班族可以大胆施用，不怕东窗事发。


    讲到这儿，各位一定有一个疑问，那就是：“用这方法，要等多久才能置敌人于死地呢？”其实，杀人只是手段，关注自己的前途及工作信念才是目的，只要使对方无病成小病，小病成大病，最后不得不重重休养一阵子，他的事业就算毁了，现今的社会一日千里，哪容你稍有落伍？何况上司看他病容奄奄，气色不佳，心中一定觉得此人生产力不高，纵然他过去颇有贡献，而令于理当斩，把他放进冷宫，他自然知趣而去，辞呈上少不得还要感谢公司的栽培云云。


    ## 精神压力间接杀人法


    要是敌人健壮如牛，或是深谙养生之道，不肯上当，各位可在“饮食交际杀人法”外，另外施以“精神压力间接杀人法”。


    施加精神压力的另一个说法就是制造紧张气氛，各位可以利用信件、电报、电话、字条、公告等方式，令敌人随时感到举头三尺有神明。在不署名的情况，各位要想点子令敌人一心以为大鸟将至，但不知大鸟是好吃的雁，还是喜欢吃人的秃鹰。以下我们列出两组文字，前半部是电报内容，后半部是敌人接到电报时的活动，各位不妨试着思考什么情况下提供什么消息，最容易吓掉人命半条。


    - “母病速回” 出差中

    - “贵府失火速回” 开会中

    - “令郎罹难速回” 出国考察中

    - “速联络公司会计部” 休假中

    - “总公司督察莅临速回” 春节中

    - “一切知悉妻” 在酒廊应酬中

    - “速联络捐血中心爱滋病防治小组” 同事聚会中


    再镇定的人，接到这些电报，也会被吓得面无人色。


    在必须署名或不可能匿名的情况下，各位可以伪装成思路不清、爱咬文嚼字、记性差但是耐烦的人。平时冰雪聪明，一旦与敌人单独相处就开始纠缠不清，谈公事时先来一段面面俱到的开场白，进入正题后，随时修正前头的说法，措词以暧昧难解为佳，态度却严正而多礼，最后再以一个不通的成语当作结论。这种扮猪气老虎的方法尤其适用于职务低于你的敌人。


    谈到此，我们必须对“饮食交际杀人法”和“精神压力间接杀人法”的原理作一个分析。


    其实道理很简单，我们只是把上班族在公司付出的“隐藏性成本”特别提出来罢了。公司方面常以为它以一笔可观的薪水雇到的员工每天只工作 8 小时，我们不谈“8 小时”这种估计不准，因为人难免在上班时间偷个懒，在很多情况下，上班族也有可能在私人时间作额外的工作。我们要谈的是：公司运用权势时，是否考虑到员工的健康及心理？如果为了公司的利益，不得不请员工自残，公司愿不愿意加以补偿？各位上班族，你们的薪水中包括了医药补助费和精神赔偿费，至于那些金额能不能替代你们牺牲掉的身心，就要看各位是不是黄盖、各位的公司是不是周瑜了。


    ## 想像力及企图心


    奇怪，谈到这儿，各位为何掩面哽咽？这是本人生平所受最大的侮辱。别忘了本讲的题目是“如何谋杀公司同仁”，请以愤怒的表情面对黑板。


    前面我们提示两种杀人的方法，各位一定意犹未尽，但是把全世界的推理小说中的绝招收集起来，恐怕可以辑成一部巨著。本讲无非是一篇励志文章，有些上班族吃了太久的死薪水，失去了想像力及企图心，用“敬业乐群”或“替他人设想”来掩饰自己的懦弱，各位向往缺德的朋友千万不要学他们。


    身为一个人，必须不停反省过去、策划未来，公司体制虽不易摧毁，其中仍然大有可为，各位不要事事处于被动，要有争取更多报酬、更高地位的野心。


    本讲的结论可归纳成两句话：


    - 一、不要失去想像力及企图心。

    - 二、小心被杀。


    # 如何欺骗同仁：

    尔虞我诈在人际竞技场


    ## 干净的白衬衫


    我们在上一讲推出“如何谋杀公司同仁”，有许多非上班族来信指出那简直是开玩笑，本人不想多作辩论，以遵“天何言哉”的古训。


    倒是这种“不相信上班族会杀人放火”的心理，颇值得研究。换句话说，局外人（甚至上班族本身）对上班族已有了刻板印象，我们不妨举出两个讯息来源当例子。


    - 一、电视广告片——上班族漫步在压克力隔间的现代化办公室中，谈笑间咬一块饼干，惊喜地点头。由他们匀称的身材和纯真的笑容看来，这些人满面笑容，和蔼可亲，不可能有置公司同仁于死地的野心。

    - 二、早晨七点半到八点的公共汽车——上班族抽动着浮肿的眼皮，有的陷入半昏迷，有的索然咬一口站牌旁买来的饭丸，一个个獐头鼠目，就算有杀人的念头，也没有胆子下手。


    总之，公共场合中的上班族不是开心得离谱，就是窝囊得气人，这些都不是江洋大盗应有的身段。


    说到这儿，各位杰出的上班族恐怕要微笑了，男的抚弄下巴，女的掩住小嘴。不错，我们上班族是现代社会的中坚，讲究的是智慧型犯罪，古代血溅五步的那一套未免脏了我们身上的白衬衫。于是乎，风雨如晦，鸡叫个不停，各位以“管理技巧”、“政治艺术”、“公共关系”、“促销心理战”等名目，时而欺骗，时而欺瞒，或是夸张某一点事实，或是淡化某一点事实，要不就说些模棱两可的话，到时从权解释。这是什么？这就是欺骗，这就是我们的主题。


    ## 看不见的利益


    法律只是道德的最后防线，没坐过牢并不值得炫耀，一个商场的老狐狸当然可以不犯欺诈罪，那就得证明他有犯意、有犯行、他的行为和不当利益之间有直接的牵连关系，各位可以想一想，这有多难？任何有三年以上社会经验的人，都能说出一个吃亏的故事，如果他说不出来，可能是他不敢说，或者是他根本一直都被蒙在鼓里，人世悲惨，莫此为甚！各位缺德的同志，有了以上的认识，我们发现：欺骗公司同仁的要领在于争取“看不见的利益”，利益一旦隐形，犯意和犯行也就凭空消失，谁又抓得住你的小辫子？


    所谓的“看不见的利益”，就是“有利的情势”，“情势”是一种不能作定量分析的能源，它常在紧要关头发生作用，平时闷不吭声，敌人不容易嗅出味道，一旦亮相，往往沛然莫之能御也。相较之下，“看得见的利益”就危险多了，如公款、总经理的女秘书、回扣、保险金等，弄得不好就成了如山铁证，抵赖不掉。所以，聪明的上班族在行骗时，要急于摆脱有形利益，想法子将它送给非敌非友之人，至于为什么不能送给敌人及同志，我希望各位自己思考一下。


    ## 从人性弱点下手


    那么，要怎么骗人呢？请看附表。


    | A | B | C |

    | :--- | :--- | :--- |

    | 群 性 | 保持来往 | 纳入己方交际圈 |

    | 自 尊 心 | 表示敬意 | 使之高估自己 |

    | 上 进 心 | 授予空洞头衔 | 使之甘心卖命 |

    | 好 胜 心 | 授予高风险任务 | 转嫁责任 |

    | 嫉 妒 心 | 示弱 | 化解敌意 |

    | 自 卑 感 | 表示同情 | 收买人心 |

    | 羞 耻 心 | 无视于其失败或缺点 | 预防恼羞成怒 |

    | 模 仿 欲 | 鼓吹流行、提供典范 | 抹杀个性及创造力 |

    | 惰 性 | 言不及义、相约玩乐 | 瓦解斗志 |

    | 好 奇 心 | 提供错误的情报 | 使之拟错误战略 |

    | 服从权威 | 提供不合时宜法则 | 压缩其活动范围 |

    | 宗教意识 | 鼓励追求终极关怀 | 使之忽略现世利益 |

    | 创 造 欲 | 委任服务性活动 | 消耗对方机会成本 |

    | 破 坏 欲 | 发动发表改革性言论 | 代为制造敌人 |

    | 表 现 欲 | 诱使在公开场合发表言论 | 同上 |

    | 独 占 欲 | 使对方和他的职权界限不清 | 破坏人际关系，制造不满情绪 |

    | 性 欲 | 第九讲专文讨论 |  |

    | 食 欲 | 详见第三讲 |  |


    表中的 A 栏内列出了十八项人性弱点，B 就是我们针对 A 所设计出的欺骗行为，C 则是 B 所造成的情势。


    各位一定已经领悟出上述的 A、B、C 暗合“调查、行动、考核”的原理，不过大家不要忘了这套骗术不是你的专利，别人也可能拿它对付你，所以在骗人时固然要参考该表，平时更要以检讨自己的防卫策略。


    请各位不要说什么“平日不做亏心事，半夜不怕鬼敲门”，没有勇气与众人周旋的人，才会把凡事推给“自我修养”，在统一的人格内，各情绪及反应是平等的，但是在人与人的互动之间，你选择什么情绪反应就很重要了，这好比陆、海、空三军本一家，但是当有大敌临头，你就得看环境及情势出兵，不可兵来卒挡，水来即溶奶粉掩。总之，大家要承认自己有弱点，既然是弱点，我们就假设它不是那么好改的，不要为难自己，想对策才是好手。


    首先，各位要自问：“我有什么弱点？”写下来，再问：“别人有没有误解我？还是别人看出了我自己不觉的情况？”写下来。弄清楚以上问题后，各位就可以逐步地思考公司同仁对待你的策略了。


    ## 欲望的进化与退化


    本人很高兴看到各位冷笑不已。也许有人要问：“当敌人全身毫无破绽时，该怎么骗他呢？”这是一个好问题。有学问、有修养的人很懂得如何处理自己的贪念，他彬彬有礼、有卑不亢，实在是令亲快仇痛，心理学大师阿德勒就曾经研究化自卑感为上进心的方法，本人在此要特别扼腕三下。扼腕的理由不是说大师不该出版那巨著而是想到：要是只有我读过那本书就好了。


    话说回来，对付这种升华型人物，仍有一套方法。如果说前面那个表中的 A 是“第一欲望”，升华型人物就是成功地转移了 A 的走向，使它成为 A''，我们称之为“第二欲望”。对付之道不外是先使
    A'' 退化成 A，再依前法处理。本人很乐意意向各位宣布：


    “化自卑感为上进心有多难，化上进心为自卑感就有多容易。”假设有一位 F 君有好色的倾向，可是他生长在一个宗教家庭，他的知识、道德感都告诉他不可胡来，于是 F
    立志创作小说，主题多是男女情欲，他也自认是一个律己甚严的好人。


    对付这样的 F 时，我们首先必须有敏锐的观察力，看出他的第一、第二欲望是女色及创作。然后想法子削弱他的第二欲望 A''（告诉他历史上有多少小说家死于非命），当他的
    A'' 动摇之时，我们再强化他的第一欲望 A 与 A''（因为后者原本就是前者的化身），最后弃明投暗。


    以上就是人类堕落的步骤。人可以选择上帝，但是在他分不清上帝与魔鬼时，魔鬼便会选上他。人从来不会选择魔鬼。各位的公司同仁并不能逃避这个命运。


    骗子乃是万恶之王，他制造情势，引人自投落网，小偷和强盗就显得太粗糙了。受骗上当的人往往不愿承认自己无能，这又使骗子的行为不易曝光。


    各位上班族，你是不是曾被公司同仁耍得要捶胸顿足？你是不是嫉妒公司中的能人，而又看不起那些庸人，因而良心不安？让我们化悲愤为力量，不要再自外于尔虞我诈的人际竞技场，勇敢地去欺骗公司内那些和你一样不幸的同仁吧！


    最后，本人要提醒各位一句话，那就是：同一骗术在同一个人身上不要重复使用。这道理很浅明，在此就不多论了。


    # 上班族礼赞：

    上班族在社会中扮演的角色


    ## 你是现代英雄


    各位亲爱的上班族，在前四讲中，本人用尽一切方法去动摇你们原有的观念，有人因而坐立难安，有人甚至嗤之以鼻，也有人卷袖抡拳打算追问本主讲人为何是非不分。对这些人，我要表示敬意，如果面对本人的强词夺理而能无动于衷，信不信由你，我会找一个没人的地方嚎啕大哭。


    开讲以来，本人一直假设各位是不快乐的上班族，任何大道理都不能感化你，你对上班族的处境感到不安，又不知如何是好。现在该是从这现代都市的上空鸟瞰各位的处境的时候了。


    在谈上班族在社会扮演的角色之前，请允许本人引一段某日本名小说家的文字：


    > “他们满怀希望，向公司跨出第一步，他们前程似锦，未来充满了机会。可是，在两三年之内，这些人的热情恐怕要凄凉地凋谢，取而代之的是一种上班族特有的烦闷与庸俗。”


    各行各业都有上班族，工作内容虽有不同，能出人头地的毕竟是少数，因此大多数人都待在基层部门，过那呆板的生活，今天同于昨天，明天同于今天，依此类推。偏偏“呆板”并不等于“轻松”，为了一份薄薪，大家都在忍受各种有形、无形、合理、不合理的压力。本人承认有人很满意于自己的待遇，这些人是幸福的一群，请闻声起立，离开教室，不要影响别人上课。


    至于仍留在现场的朋友们，你们是否曾在上班时间忽然想起别的大楼中的上班族朋友？你该想一想有多少人正和你一样，茫然看着玻璃板下的绿绒布，不知自己日复一日、年复一年，到底在追寻什么？


    大家常说，男人要以事业为重，各位觉得自己目前的工作，担当得起“事业”这种神圣的头衔吗？身为一颗小螺丝钉，各位要肯定自己，理由很简单，再没有别人来捧你了。你穿着笔挺合身的西装，头发偏分而光洁（没有头皮屑的烦恼），任何人都要夸你一句“青年才俊”，可是你干的工作尽是盖章、打电话、接客户、开会等没有创造性的老套。


    说也奇怪，现代社会就在我们这些动作下运转起来了。要是火车站的剪票员忽然说：“我每天重复几千次的剪票动作，这对我的人格、生命有什么助益？”说完把剪票器放在出入口栅栏上走开，各位可想像到交通将立刻陷入混乱。


    因此，依我之见，烦闷而庸俗的上班族是英雄，是各位的保守、功利、不安、焦虑支撑了社会的地基。早晚两次交通颠峰，就是各位英雄集体出没的盛况。


    ## 胜利与幸福


    问题是，各位总有年华逝去的一天，各位的工作为社会带来好处（当然是由公司统一分级运销），但为你们自己带来了什么？


    谈到这儿，我们不禁羡慕教授、作家、记者、编辑等靠知识谋生的人了。这些人能在工作中自求进步，真是天底下最快乐的人，他们能亲眼看到自己的工作成绩，要骄傲就骄傲，要谦虚就谦虚，各位上班族真该频频鼓掌，并夹带飞吻。


    人的能力和际遇各有不同，强要劳心者劳力、劳力者劳心，毋宁是一种不效率。如果有人认为“螺丝钉”的烦闷是“分工合作、人尽其才”的必然结果，那就该想办法使这些钉子只在上班时间烦闷。


    各位上班族当然明白这是不可能的，有过失业体验的人更了解“工作（或者就是说事业吧）”可以成为一种 24 小时值班的生命意义，至于那些心理、生理上受到的伤害，不如就归因于“现代”及“文明”，称之为“现代病”、“文明病”吧。反正大家都一样。


    各位为什么忽然安静下来呢？本人并不想在本讲座中装神弄鬼，请不要引诱我。


    我们发现：上班族常不能兼顾“工作”与“人格”，前者追求“胜利”，后者追求“幸福”，只有少数人才能在工作中实现完整的自我。面对这种矛盾，上班族可能有三种反应：


    - 一、硬说“胜利”就是“幸福”。

    - 二、承认矛盾，但是把它当成天经地义。

    - 三、承认矛盾，企图反抗或化解它。


    本讲座就是为第三种上班族而设计的。我们其中的一人，可能会有在朝一日愤而脱掉上班族的制服，去追寻他自己的梦，那时他也失去参加本讲座的资格了。


    ## 变腰与折腰


    其次我们谈到上班族的勇敢。


    上班族如何表现他的勇气？


    走进上司的办公室，一言不合，手往桌子一拍，大叫：“你神气什么？此处不留爷，自有留爷处。肯干活，还怕饿死吗？老子不干了，不干了可以吧？”走出办公室，双臂上举，同事投来钦佩的眼光，女同事眼中除了钦佩之外还有爱慕，大家都觉得痛快无比——这种义无反顾的行为就是勇敢吗？


    要是人人都按照你的意思善待你，这世界就比西天还极乐了，现实生活中，人与人的摩擦几乎不可能避免。话说回来，你自认有理就真的有理吗？既然对方是上司，他的年龄很可能比你大，或者至少在公司中的资历比你久，会不会是你考虑得不够周全？意见一不合，你就不干的话，再多的鱿鱼也不够炒。还不如退一步，以更严格的标准问自己是不是理直气壮。


    发泄不满就跟拔掉热水瓶塞子一样容易，难的是握火抱冰、忍气吞声。日本武士和艺妓常爱说：“我只卖艺不卖身。”然而现实生活中又何尝少了为生存而卖身的人？各位请向“求生欲”致最大的敬意，好死不如歹活，当饥荒的时候，连树根、腐尸都要放进嘴中，更别说“嗟来之食”了。为五斗米而折腰，表示这人缺乏运动，腰部的柔软度不够，但是为五斗米而变腰，表示做事很有弹性，变腰舀米，站直身子吃饭，何辱之有？


    本人心目中的上班族勇士是这样的：早晨六点半起床，早上吃牛奶加吐司，七点挤进客满的公共汽车，进公司看到同仁就挥手道早，不管上司的能力高于或低于自己，都忠心地办事，在上班时间内不影响别人的工作情绪，傍晚又搭上客满的公共汽车回家。


    是的，各位要忍受这单调的生活，随时找机会发挥爱心，没有机会时，则要不卑不亢地当一颗小小螺丝钉。下决定时需要勇气，执行时需要的不是勇气，而是毅力。


    各位上班族，不论你尚是单身，还是已有配偶子女，你多少都对公司有所抱怨，觉得自己受到不合理的待遇。请不要埋怨自己没有条件拂袖而去，实情是你勇敢的为自己及家人负起责任，不以暴力犯罪发泄自己，不放逐自己于社会之外，偶而犯错也能良心不安，见到和自己处境相同的同事总有悲悯之情。


    这现代大都会已经够热闹光鲜了，我们不必再立什么海誓山盟。在此，本人愿意祝福所有的上班族身体健康、家庭生活快乐。各位也许正在奇怪，缺德讲座第五讲的味道和以前的不大一样，本人可以提供几种解释，请各位任选其一：


    - 一、前四讲是狗屁，第五讲是良心发现。

    - 二、前四讲是良心话，第五讲是狗屁。

    - 三、前四讲是大狗屁，第五讲是小狗屁。

    - 四、第五讲中的每一个字都是阴险毒辣的讽刺。

    '
