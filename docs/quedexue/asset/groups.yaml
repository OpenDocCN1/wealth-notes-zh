    将刘氏送给自己，平鉴马上送去，平鉴送了爱妾，对人说：“老公安阿刘，与死何异。要为自身作计，不得不尔。”这才是真正的厚黑脸，为了自己，不顾一切。果然，和士开送给平鉴一个齐州刺史的官。


    上述两位官员对待和士开，均采用缺德的方法，若是热血男儿，当仗三尺宝剑，怒斗凶顽，以解心头奸妻之愤。此二人真是“大肚能容天下难容之事”。


