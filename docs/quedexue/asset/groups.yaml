    婚娶之日，袁推说与阮到天津办事，同车前往，马车直奔一深宅大院。阮只见新宅院里悬灯结彩，红烛高照，是结婚的喜庆气氛。不久，佣人簇拥着一位新娘子从里屋走出来，袁世凯非让阮忠枢为新娘揭去盖头纱不可。阮莫名其妙，定神一看，新娘原是自己朝思暮想的小玉，顿时惊喜万分，此刻方知这一切都是袁世凯为自己苦心安排的。阮忠枢的感激之情，无以言表。于是，死心塌地为袁世凯效犬马之劳。


