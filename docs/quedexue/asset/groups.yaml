    # 缺德整人术


    线部队猥集徐州，却不敢增援黄百韬，以致津浦路被截断，给会战造成更大的不利。所谓大捷，纯属子虚乌有。原为共军试图断邱（清泉）兵团东援后路，不期与邱兵团侧袭共军之74军遭遇，造成胶着，两军激战竟日，各有伤亡。后共军主动撤出，正面各部亦受命后撤至大许家，我判断是试图诱邱、李兵团深入而图歼灭。此乃所谓崩溃之说。现共军从少数兵力歼黄，大部兵力侧袭徐州，现已截断我对徐州的运输供给，徐州已形孤立，邱、李、孙三兵团危在旦夕……”


    蒋介石一看此电报，大骂刘峙无耻，恨不得立即杀了他。


