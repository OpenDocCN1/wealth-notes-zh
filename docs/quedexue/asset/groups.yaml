    ## 摆出上司的派头


    居高临下，与臣僚保持适当距离，这是掌权者显示其高不可攀的尊严和不可一世的威风的一种重要手段。一般来说，掌权者是不会平易近人的，因为在他们看来那样会失去威严，会使臣下变得放纵，会“蹬着鼻子上脸”，因此，他们要装腔作势，显示出那么一副神圣不可接近的气度，距人于千里之外，仿佛越这样便越有威望，可以给臣下造成一种心理上的压力，使其自觉其渺小，自惭形秽，从而不由自主地对君上畏服。


    明太祖朱元璋出身寒微，做了皇帝后自然少不了有昔日的穷哥们儿到京城找他。这些人满以为朱元璋会念在老朋友的情份上给他们封个一官半职，谁知朱元璋最忌讳别人揭他的老底，以为那样会有损自己的威信，因此，对来访者大都拒而不见。


    有位朱元璋儿时的好友，千里迢迢从老家凤阳赶到南京，几经周折才算进了皇宫。一见面，这位老兄便当着文武百官大叫大嚷起来：“朱老四，你当了皇帝可真威风呀！还认得我吗？当年咱们俩一块光着屁股玩耍，你干了坏事总是让我替你挨打。记得有一次咱俩一块偷豆子吃，背着大人用破瓦罐煮。豆还没煮熟你就先抢起来，结果把瓦罐打烂了，豆子撒了一地。你吃得太急，豆子卡在喉咙里还是我帮你弄出来的。你忘了吗？”


    朱元璋听到这里，再也坐不住了，心想此人太不知趣，居然当着文武百官的面揭我的短处，让我这个当皇帝的脸往哪儿搁。盛怒之下，朱元璋下令把这个穷哥们儿杀了。


    “为尊者讳”，这是官场的一条规矩。一个人，无论他原来的出身多么低贱，有过多么不光彩的经历，一旦当上了大官，爬上了高位，他身上便罩上了灵光，变得神圣起来。往昔那见不得人的一切，要么一笔勾销，永不许再提；要么重新改造，重新解释，赋予新的含义。这位穷哥们哪懂得这一点，自以为与朱元璋有旧交，居然当众揭了皇帝的老底，岂不是自找倒霉吗？


    尉迟敬德是李世民的心腹爱将，曾协助唐太宗东征西讨屡建奇功，但敬德也因此居功自傲，盛气凌人。同僚中有不少人对他不满，就合计告他谋反。


    李世民平时对敬德十分尊重，优礼有加，接到报告后大吃一惊，便将他招至内室当面询问此事。敬德十分委屈地说：“当年，我随陛下征战四方，身经百战，从月光剑影中拣回了这条老命。如今，天下太平享乐之时，我怎会谋反呢？”说着脱下衣服，露出满身累累伤痕。李世民想起往事，很是感动，泪流满面，并用好言好语安慰了他。这样一来，敬德更加有恃无恐，骄横的品性暴露无遗，竟连李世民也不放在眼里了。


    有一次，他和一起饮酒的人争论谁是长者时，一时性起，和身旁的任城王李道宗殴打起来，并打瞎了道宗的一只眼睛。皇上见敬德如此放肆，十分不悦，罢宴而去。


    有人向唐太宗进谏道：“尉迟将军固然是有功之臣，但如今他在陛下面前如此放肆，而陛下对他也过于谦恭，失去了君臣之间应有的礼节，这是很不恰当的！”


    李世民颇有同感，于是传来敬德，直言相告说：“朕要与你同享富贵，兴国立业，而你却居功自傲。难道你不知道古时的韩信、彭越为何被杀的吗？”敬德一听此言，很是震惊，从此狂傲的举止收敛了许多。唐太宗在敬德面前拿出了帝王的派头，变得庄重、威严起来，敬德果然感到敬畏，行为逐渐变得谨慎起来。


    在封建时代，帝王平时深居简出，普通百姓自然难得一见，即便是文武大臣，能接近皇帝者也是寥寥无几。其实，帝王们是在有意营造一种神秘气氛，使臣民莫测高深，对之望而生畏。帝王出行时，往往是前呼后拥，仪卫如林，这并不完全出自安全的需要，最主要的目的还是为了保持他们与臣民的距离，显示自己不可一世的威风。


    ## 名人就是老祖宗


    权威对于任何一个当权者来说都是十分重要的，有了它就可以发号施令，驾驭臣僚。一旦失去了个人权威，其统治地位便很难长期稳固地维持下去。可见，权威具有威慑臣下、令人折服的超凡力量。古往今来，当权者为了取得权威、增加权威不惜人为地去立，去树。虽说这种人为树立的权威不能持久，但在一定时期内所起的作用，却是不可低估的。


    树立权威的方式，可谓多种多样。当权者为了达到某种目的，往往会不择手段。纵观古今官场，扯大旗作虎皮者有之；自我炫耀，欺世盗名者有之；制造舆论，强奸民意者有之；故弄玄虚，深藏不露者有之。总之，各种有助于提高自己威望的手段，无所不用其极。


    为了增强政权和个人的权威性，达到威慑臣僚、统治百姓的目的，当权者往往会极力炫耀自己的与众不同之处，以此来抬高身价，制服对手。


    自我炫耀的方式多种多样。中国人在几千年前就很懂得如何制造和利用“名人效应”，大凡出身名门望族的当权者往往会以显赫的家世相炫耀，中国人自古就有编“家谱”的传统，而且乐此不疲，这大概与此不无关系。这样做无非是想向他人证明自己的贵胄身份，拿祖先吓唬人，拿死人压活人。于是，“冒认”祖宗的事便在历史上屡见不鲜。唐朝天子姓李，于是乎追根溯源竟成了春秋时期著名思想家老子（李耳）的后裔，以至于唐朝初年道教（创始人为老子）大盛。刘备本是一个一文不名的贩夫，发迹后竟也和汉朝宗室攀亲，莫名其妙地成了“刘皇叔”，其实，这个冒牌货充其量也只是祖上姓刘而已。曹操的父亲本是一名宦官的养子，按理说本无可资炫耀的家族史，但当等到曹丕称帝后，便旁征博引得出自己原是古代某宗室贵胄后裔的荒唐结论。这样做，自然是有其不可告人的目的。


    唐朝初年，有个多事的和尚当着唐太宗的面竟不知趣地奢谈唐室宗族乃是陇西李氏，非但与李耳毫无瓜葛，甚至连纯种的汉人也算不上。和尚言之凿凿，唐太宗无可辩驳，盛怒之下竟以杀头相要挟，逼迫和尚改变观点。其实，唐太宗心里很明白，和尚说的并没有错，错就错在他不该当众揭短，皇帝作为一国之君，颜面何在？


    如果实在无法“冒认祖宗”，既非宗室苗裔，也非名门之后，那么就只好攀个名门亲戚，当当乘龙快婿以便抬高身价。


    1927年，蒋介石南京政府正式建立。然而，此时此刻蒋介石在国民党内的地位极不巩固，既无资历又无背景，各派反蒋势力群起而攻之。迫于种种压力，蒋介石只好宣布下野。这次打击使蒋介石清醒地意识到，在中国这样一个社会里，没有靠山和后台是绝对不行的，为了给自己找一个显赫的背景，他决定与宋氏家族政治联姻。宋氏家族是旧中国屈指可数的名门望族之一，在上海和江浙一带颇有声望。另外，宋氏家族与美国企业界过从甚密，有美国做它的后台老板，宋氏家族在中国实业界颇有呼风唤雨的能量。蒋介石看中的正是这一点。当时，宋美龄尚未出阁，不仅长得楚楚动人，令蒋介石神魂颠倒，而且宋美龄的举止言谈也颇有大家闺秀的风范，使蒋羡慕不已。此时宋美龄虽未出嫁，但与男友刘纪文已同居多年并生有一女，对此蒋介石并不计较，因为自己此时已过不惑之年并有一妻两妾。为了攀上这门姻亲，以便通过宋氏家族取得美国的支持，蒋介石煞费苦心，先是狠心与妻妾恩断义绝，随后又东渡日本讨好宋美龄的母亲。最后终于如愿以偿。


    其实，蒋介石与宋家联姻还有一个不便表白的原因。他想通过婚姻这条纽带，与孙中山攀上亲戚。孙中山作为国民党的领袖，在党内国内都有着无与伦比的号召力和影响力。孙中山先生死后，蒋介石背弃革命，但仍以孙中山的继承人自居，以此来增加蒋政权的号召力。然而，国民党内派系林立，蒋本人在国民党内资历甚浅，单凭他空口表白难以服众。若是蒋宋联姻，情况就不同了。孙中山的夫人宋庆龄乃是宋美龄的姐姐，蒋介石娶了宋美龄，他自然就成了孙中山的连襟了。这会在无形中抬高蒋的身价地位。有了这张王牌，谁敢不服呢？


