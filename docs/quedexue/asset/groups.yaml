    ## 缺德学 · 113 ·


    押宝，则是看某人有前途，在此人尚未荣耀时就帮助此人，以待将来此人官运亨通时提拔自己。


    推车，就是车子陷入泥坑，帮他推一把，在官场上就是某官不得意时帮帮忙，使他摆脱困境，等到他得意时，得点好处。


    若论拍马溜须，精于此道者比比皆是，但其集大成者首推安禄山。


    唐玄宗时，范阳节度使安禄山很受宠信，其实安禄山也并没有多少真才实学，他的升迁在很大程度上归功于那一套拍马的本领。


    安禄山是少数民族将领中最有心计的野心家。此人貌似粗犷，内有计谋。表面上给人一种憨厚忠直的印象，骨子里却狡诈多端。他身体肥胖，大腹便便。肚子大得突出一块，往下耷拉着，自称肚子就有三百斤。本来他的体态形象就很引人发笑，再加上又极为诙谐，善逗笑话，善于随机应变，逢场做戏。这就博得了玄宗的好感。有一次，玄宗指着他的大肚子问他：“这么大的胡腹之中装的都是什么玩艺呢？”安禄山拍拍大肚子，顺口说道：“臣肚子虽大，所装并无杂物，都是对于陛下的赤胆忠心。”玄宗大喜，赏赐他很多宝物，更信任他了。安禄山知道玄宗最宠爱杨贵妃，就认二十几岁的贵妃杨玉环做干娘，进一步讨取了玄宗的欢心。


    一次，玄宗把他介绍给太子，他竟不下跪施礼。左右的人问他为何如此无礼，他装疯卖傻地回答：“臣不识朝廷礼仪，皇太子为何人？”玄宗被他那愚钝不敏的样子惹得大笑不已，告诉安禄山：“朕百年之后，即传位于太子。”安禄山一听，赶忙跪拜，诚惶诚恐地说道：“臣愚昧不悟，只知有陛下，不知有太子。罪该万死！”安禄山这番似痴似真的表演使玄宗不禁龙心大悦。每次入宫，安禄山总是先拜贵妃，后拜玄宗，玄宗觉得奇怪，安禄山振振有词地回禀道：“番人先母后父。”玄宗因此更喜爱他了。靠着一套拍马溜须的本领，安禄山在外拥兵十几万，权倾朝野，后来公然起兵谋反，大唐盛世从此划上了句号。


    ## 无毒不丈夫


    民国人物李宗吾先生在《厚黑学》中把古往今来成功政治家的为官秘诀概括为“面厚心黑”。


    “三国英雄，首推曹操，他的特长，全在心黑，杀吕奢，杀孔融，杀杨修，杀董承、伏完，又杀皇后皇子，悍然不顾，并且明目张胆说‘宁我负人，毋人负我’，心子之黑，真是达到极点了。有了这等本事，当然称为一世之雄了。”


    俗话说，量小非君子，无毒不丈夫。官场凶险，尔虞我诈，最忌讳的莫过于心存妇人之仁。想当初，若是项羽听从范增劝告，在鸿门宴上诛杀刘邦，也不会落得个自刎乌江的悲惨下场。一世英雄竟败在市井无赖手中，怎不令人扼腕叹息！


    政治是最无情的东西，政治家对名利地位的追逐往往会导致人性的扭曲和变态，在他们的眼里，夫妻之情、骨肉亲情、朋友之情变得如此淡漠，统统成了他们手中猎取功名地位的工具。人性中最自私的一而在政治家身上表现得淋漓尽致，因为他们比一般人更为清楚，要索取就必须先付出代价，舍不得孩子就打不着狼。


    吴起是战国时著名的军事家，善于用兵并屡建战功。然而，吴起是卫国人，担任魏国将军属于魏文侯招贤纳士，“引进人才”，魏国君臣对吴起的忠诚不免有疑虑，这样一个“外来户”能为我们魏国真心效力吗？


    吴起来到魏国后就意识到了这一点，因此，练兵打仗格外卖力，以便求得魏文侯的信赖，捞个一官半职也好光宗耀祖。然而事与愿违，尽管吴起战功赫赫，仍没有得到一个像样的官职，他不禁心怀疑虑，思前想后终于明白了其中原委。当时，魏国和齐国是死敌，两国争霸多年，干戈不止，而吴起的妻子恰恰是齐国人。在魏人看来，一个有齐国老婆吹枕头风的将领，无论如何都是不会诚心诚意效忠魏国的。


    吴起看着跟随自己多年，年轻美貌的妻子不禁有些犹豫了。然而在功名和女人之间，他最后选中了前者，大丈夫何患无妻！有了功名地位还怕娶不到年轻漂亮的老婆吗？


    于是，吴起狠下心来，挥剑砍下了妻子的首级，提着血淋淋的人头叩见魏文侯。魏国君臣大为震惊，想不到吴起竟能如此“大义灭亲”，象这样的人能不重用吗？于是，魏文侯立即下令任命吴起为魏国的西河太守，从此成为魏国炙手可热的人物。


    吴起杀妻求将，此举令人震惊。由此可见为官者官瘾之大，手段之毒辣。


    如果说吴起的做法有点不合情理的话，那么武则天的作为则更能令人明白“毒辣”二字的涵义和妙用。与武则天相比，吴起耍弄的小把戏实在太微不足道了，太小儿科了！


    俗话说：虎毒不食子。亲生母亲亲手掐死自己的亲生女儿并以此嫁祸于人，换取自己的权力地位，这在一般人看来，实在有些不可思议。然而，这正是大政治家的过人之处——舍不得孩子就打不着狼。


    武则天本是唐太宗李世民的妃子——武才人。高宗皇帝在登基前就是一个好色之徒，他听人说武才人才貌双全，只是未曾亲见。太宗病重卧床给高宗提供了好机会，他同武才人一起守着病榻侍奉太宗，两人一见之下，眉目传情，相见恨晚，终于背着太宗勾搭成奸。太宗死后，高宗不顾传统礼仪，硬是把自己的“后妈”武才人召回宫来，二人如胶似漆，日夜荒淫。但是，武则天绝非等贤之辈，这是个工于心计，野心勃勃的女人，她明白自己在宫中的地位，要想攫取权力就必须先当上皇后。当时高宗的原配王皇后为人贤淑，武则天有心在高宗面前进谗言，只是找不到合适的机会和借口。


    一年之后，机会终于来了，武则天定下了一条狠毒的苦肉计。这一年，武则天为高宗生下一女。在封建时代，母以子贵，因为生的是女孩，武则天心里觉得很懊恼。想不到，高宗却格外喜欢这女孩子，生下几个月的孩子就会逗人喜欢，致使高宗每次退朝后，总爱到这边和武则天一起抱一会儿孩子，逗着孩子玩耍。


    武则天却另有心计，她想用这孩子的生命去对付她的死对头王皇后。她想：常言道，舍不得孩子就打着不着狼，我如今就试一下。


    有一天，高宗正在听政，武则天打发侍女去请王皇后过来一起看着孩子玩耍。侍女刚走出去，她就把门闩上，纵身上床，用双手狠劲地卡住女孩子的喉咙，致使孩子连哭一声也没来得及，便一命归天。武则天松开手，见孩子确实已死，就用被盖在床上，把门敞开，自己到隔壁房间去了。等王皇后进来，一看武则天不在，只是孩子盖着被子无声无息，以为孩子睡着了，便又出门寻找武则天。正在这时，高宗退朝到这里来看孩子，武则天从隔壁房间出来，与皇后、皇帝三人一起进了屋。王皇后说：“我刚才进来看，孩子睡觉了，不必动她。”武则天说：“皇上来看孩子，睡了也要叫醒她。”说着就动手去掀开被子，一看，孩子已经死了，便大声哭起来，一口咬定是王皇后扠死的。高宗大怒道：“自己不下生，还嫉妒别人生女，这算什么皇后！”王皇后有口难辩。高宗当着皇后和武则天的面说：“看我早晚把这贱人废掉！”接着就把王皇后幽禁起来。


    武则天用这种狠毒的伎俩扳倒了王皇后，为自己以后登上皇后、皇帝的宝座铺平了道路。俗话说：最毒莫过女人心。看来女人是天生的政治家。


    再看看民国官场，厚黑奸诈之道更为盛行，政界要人，如袁世凯、段祺瑞、张作霖、蒋介石、阎锡山之流，采取厚黑手段，都取得了不同程度的“成功”，谋取了地位和权力。以至于亲而不信，反目成仇、相互倾轧比比皆是，其手段之毒辣也是前所未有的。


    盛世才是新疆的军阀，为了整省主席刘文龙，使自己成为独霸一方的土皇帝，他可谓机关算尽，最后竟狠心牺牲对自己忠心耿耿的卫队长颜廉和副官长曾统。他将二人逮捕，罗织罪名，施以酷刑，逼迫他们自诬暴动，并将省长刘文龙说成后台。颜、曾二人糊里糊涂地做了盛世才夺权的工具。盛世才为了升官保官杀人如麻，直杀得官员们胆颤心惊。在他一连串的血腥清洗中，使人们摸到了他实现统治的一条规律，即是文官升到厅长，武官升到团长，便要准备后事，等候入狱了。在他手下，多数政府、军队官员惶惶不可终日，普遍担心今晚脱下的鞋袜，明朝还不知能否穿上。许多人都不愿升官，一升官不是高兴，而是全家抱头悲泣，深恐清洗的厄运降到自己头上。


    为了追逐权力地位，盛世才六亲不认，竟将自己的亲兄弟暗杀，毫不足软。


    山西土皇帝阎锡山经营山西多年，也是一个自以为“天下莫予毒也”的人物。太原解放前夕，阎锡山为了稳定军心，就在桌子上放了一个装有毒药的小瓶子，房间外面摆了一口棺材，他甚至令侍从给他物色一个具有“武士道”精神的日本人，整日随他行动，声言在危急时刻，让日本人开枪将他打死。但事实是，在城未破时，阎锡山就坐飞机逃跑了。为了蒙骗众人，在走时狠心地未带走他的妹妹阎慧卿，不少人认为他是去南京搬救兵，想办法救太原，还会回来，实际上他一去未返。他的妹妹在城破时与特务头子梁化之一起服毒身亡。但阎老西却因此博得了“死守太原”反共斗士的“美名”，堂而皇之地当上了国民党政府的行政院长。


    民国初期，心肠最黑者莫过于袁世凯。在袁世凯的一生中，厚黑行为接连不断：背叛光绪帝，告密得以升官；背叛清廷，逼清帝退位，自任总统；背叛共和，恢复帝制，自称洪宪皇帝。


    袁世凯如此反复无常，如此出朋卖友，卖主求荣，中国历史上难找第二人。纵观袁世凯的一生，告密求官是他的一个绝招。袁世凯早年发迹，主要在于他出卖维新派向西太后告密有功，因而才受到慈禧的宠爱，官位一升再升，最终成了影响清政府内政外交的北洋集团的首脑人物。在所有升官术中，告密被求官者视为升官最快、最省力的方法。既不花钱，又不用说好话，简单的通风报信，就可以飞黄腾达，青云直上。但有一点必须做到，那就是出卖良心。


    蒋介石更是一个厚黑兼备的人物，其手段之毒辣、残忍令所有人望尘莫及。


    蒋介石杀陶成章、邓演达、杨虎成，囚禁张学良，心黑如煤炭。


    蒋介石与冯玉祥、李宗仁、张学良结成金兰之好，称兄道弟，但为了自己的权力地位却又翻脸不认人，不惜拿自己的几个把兄弟开刀，真是面厚如城墙，心毒似蛇蝎。蒋介石一生最崇拜的人物是晚清名将曾国藩、胡林翼。胡林翼曾说过，为官之道“要有菩萨心肠，要有屠夫手段”，蒋介石把此话当作终身座右铭。难怪他在仕途上竟能如此风光，官运亨通，无人堪匹！


    ## 二、踩着别人肩膀往上爬的伎俩


    天地大舞台，舞台小天地。


    人生如棋，芸芸众生，当是有输有赢。输不怕，怕的是输不起，输不起者常输，于是就开始笑里藏刀，或偷子，或撸盘，或悔棋无赖，或设陷阱等，令大丈夫防不胜防。而真正的棋手又往往被这些无赖弄得焦头烂额，甚至一败涂地。


    ### 美人的笑能埋葬豪杰


    这是一种相当阴险的害人之术。


    对于人来说，最天真的本能就是笑和哭。由于人有奸诈，此本能也就变了质，走了样，哭和笑，就有真和假。真哭或假哭，不外乎发泄一下内心的郁闷或博人同情；但笑却不同，有天真的大笑、微笑和媚笑等，其目的不是谋人之财，就是害人之命。因为哭的形象是丑恶的，笑是美丽的，人多厌丑而爱美，所以哭计上当少，笑计上当多。美人的哭能淹没英雄，丽人的笑也可以埋葬豪杰。笑的方式可以多样。总之，表面上装出谦恭敦厚，和蔼可亲，以假笑争取真笑，以假真诚争取真真诚，以假同情换取真同情，使对手不知不觉坠入吾术之中，这乃“笑里藏刀”的妙用。


    郑袖是楚怀王的夫人，长得漂亮，又聪明机智，很得楚王宠爱。


    有一次，魏王赠送楚王一位美人，姿色艳丽，热情大方，一下子把楚王给迷住了。


    郑袖非常伤心，眼见被人横刀夺爱，大有被打入冷宫之险。但郑袖表面上却装出若无其事的样子，既不向楚王罗嗦，也不发半句牢骚，并且对那位新夫人表示特别好感。新夫人爱好什么衣服，喜欢什么玩物，郑袖一定给她办到；她要想把房子怎样布置，郑袖也很快给弄好。对新夫人的关怀，比楚王还周到，像婢女服侍主人一样，无微不至，还在楚王面前，大赞新夫人的好处。


    新夫人对这位老姐也非常感激，相处甚密，凡事都要找她商量，亲昵地以姐妹相称呼。


    “姐姐！”新夫人说：“我非常感激你对我这么好！”


    郑袖说：“这算什么！咱们姐妹共事一个丈夫，正所谓骨肉相连，不分彼此。再说丈夫为一国之王，日理万机，我们做妻子的，应该多方体贴他，使他的疲劳有一个轻松的时候。如果我们不把家事处理得和谐，不是在折磨丈夫吗？妹妹，你能够这样给丈夫快乐，我也快乐哩，我得感激你才对！”


    新夫人听了这番话，感动得眼泪都掉下来了，说：“姐姐的话过重了，妹妹实在担当不起，还请姐姐经常教训我，指导我怎样去增加丈夫的快乐！”


    “何必客气，看在丈夫份上，我们凡事要有商量，那丈夫就没有什么不快乐的了。”


    楚王见这一对如花似玉的夫人相处得这么好，心里也十分高兴，说：“女人大多凭美貌去博取丈夫欢心，且酸劲十足。但我的第一位夫人不会这样，她真能体贴我，晓得我喜欢新夫人，她竟比我更喜欢，简直比孝子侍亲、忠臣侍君更好。”


    郑袖知道楚王绝不怀疑自己吃醋了，暗自高兴。有一次，和新夫人闲谈的时候，似无意地告诉新夫人：


    “大王在我面前说你可爱极了，又漂亮又聪明，又温柔体贴。只有一点，大王嫌你的鼻子略尖了点儿！”


    “那怎么办呢，姐姐？”新夫人摸一摸鼻子问。


    “这也没有什么了不起的。”郑袖依然若无其事地回答，“你以后见到大王时，轻轻地把鼻尖掩一掩不就行了吗？”


    新夫人认为这个办法很好，以后每次见楚王时就把鼻子掩起来，楚王觉得很奇怪，又不便当面相问，便问郑袖：“为什么新夫人每次见到我时，就把鼻子掩起来？”


    郑袖诚恳地说：“我也听她说过，可是……”她向楚王飞一媚眼，欲言又止。“你说罢！”楚王追问：“夫妻间还有什么不可以直说的吗？就算说错了，我也不会怪你。”


    郑袖装出害怕的样子低声说：“她说你身上有一种恶心的臭味。”


    “啊！我身为国王，身上竟有臭味？她会讨厌我？岂有此理！”这位喜怒无常的楚王发怒了，猛力把桌子一拍，狠狠地咆哮起来：“来人哪！快去把那个贱人的鼻子割下来。”


    新夫人美丽的容貌被毁了，郑袖的情敌消除了。


    可悲的是，新夫人至死还不知是谁在捅她的刀子。


    笑里藏刀术还被蒋介石“发扬光大”，用它整倒了把兄弟李宗仁、冯玉祥和张学良。


    1926年8月，蒋介石同李宗仁结为兄弟，在给李宗仁的兰谱上有蒋介石撰写的四句誓词：谊属同志，情切同胞，同心同德，生死系之。


    李宗仁并不愿同蒋介石结为弟兄，但他必须应付一番，只得依样画葫芦，将蒋介石给他的帖子上的四言誓词，照抄上去，下署“李宗仁，妻郭德洁”应付了事。


    蒋介石看到帖子，笑容可掬，郑重地说，我们从今以后更加上一层亲切的关系，誓必同生共死，为完成国民革命而奋斗。


    事实如何呢？李宗仁先生在回忆录中说：“蒋先生给我的兰谱，后来在民国十八年（1929）他向武汉进兵，我身陷沪上，因军中无主，致全军瓦解，连我的行李也一道遗失了。兰谱中，所谓亲如兄弟，同生共死的话，转瞬间，竟变成兵戎相见，你死我活了。毋怪有深见的人曾说，政治是最污浊的东西啊！”


    1928年2月，蒋介石在开封同冯玉祥结为兄弟，他写给冯玉祥的帖子是：“安危共仗，甘苦共尝，海枯石烂，死生不渝。敬奉焕章如胞兄惠存，谱弟蒋中正谨订，年岁四十二岁，生于丁亥九月十五日。”


    冯玉祥给蒋介石的帖子写的是：“结盟真意，是为主义，碎尸万段，在所不计。敬奉介石如胞弟惠存，谱兄冯玉祥谨订。年岁四十七岁生于壬午年九月二十六日。”


    1930年，蒋介石在收拾了李宗仁的桂系后，转而收拾冯玉祥的西北军，双方在中原大战，真成了“碎尸万段”的“死生”对头。冯玉祥几十万大军被蒋一一瓦解击败，冯玉祥成了光杆司令。


    张学良将军也是蒋介石的结拜弟兄，蒋介石能统治中国与张学良关系很大，1930年蒋、冯、阎、桂大战时，蒋介石和冯玉祥、阎锡山双方都拉拢张学良，张学良帮谁谁就能获胜，张学良率兵入关帮了蒋介石，蒋介石获得胜利。


    “九·一八”事变后，张学良听从蒋介石的命令没有抵抗，蒙上了“不抵抗将军”的罪名。在这种情况下，蒋介石一改亲如胞兄的面孔，逼张学良辞职，后来“西安事变”后，张学良讲究信义把蒋介石送回南京，蒋介石却翻脸无情，把张学良推上军事法庭，后来又长期监禁。


    可以说，笑里藏刀是蒋介石惯用且擅用的政治权术。


    ### 用“不忠”整人效果奇好


    有一句古语叫“官场如战场”。派系之间，相互攻讦，斗争倾轧，结果不是你死就是我活。究其原因，倒不是彼此之间的政见有多大的差别，有的甚至是一丘之貉。说到底，只是为了两个字：“权”“利”。


    而为置对手于死地，造谣中伤又是一切争权夺势者惯用的手段。而那些摸透皇帝、上司脾气的亲信太监、大臣，暗语伤人，更奏奇效。被他们中伤的人，哪怕是栋梁之材，往往身败名裂，家破人亡。


    汉元帝所宠信的太监石显，害死汉元帝的老师，德高望重的儒臣，前将军萧望之，就是典型一例。


    由于萧望之反对太监干政，而被石显视为眼中钉，肉中刺，欲置之死地而后快。萧望之还反对外戚专权。有一个叫郑朋的儒生，想投靠萧望之弄个一官半职，于是投其所好，上奏章攻击史、许两家外戚不守王法，祸乱天下。萧望之接见郑朋，并同意给他个待诏的官职。后来，萧望之发现郑朋品行不端，再也不理他了。因此，郑朋怀恨在心。这时，与郑朋同是待诏的李宫被提拔为黄门郎，郑朋没有升官，于是，郑朋更加怨恨萧望之了。他一怒之下，转而去投靠曾被他攻击过的史、许两家外戚。郑朋对乐陵侯大司马车骑将军史高及侍中许章说：“我是关东人，怎么能知道外戚们的事呢？以前，我上奏章攻击外戚，是萧望之的好朋友周堪、刘更生叫我那么写的！”事后，郑朋到处扬言，侍中许章、车骑将军史高接见我了，我向他们揭发了前将军萧望之五个小错误，一件大罪行。如不信，中书令石显当时在旁边，可以证明。萧望之听说后，就到石显那里去打听消息。这正中石显下怀，认为陷害萧望之的时机到了。


    石显找来了郑朋，又找了一个与萧望之有仇的待诏，叫他们二人上奏章攻击萧望之，诬蔑萧望之搞阴谋，要撤掉车骑将军史高的官职，离间皇帝与外戚的关系。石显又乘萧望之休假，不在朝中的时候，叫郑朋等上奏章。事情果然不出石显所料，这道奏章一递上，皇帝就交给另外一个亲信太监弘恭去处理。弘恭是石显的同伙，也参与了这件事情。于是，立刻把萧望之叫来，进行询问、核实。萧望之对弘恭说：“外戚们当权，骄奢淫逸。我是想整顿朝政，不是搞阴谋。”弘恭、石显在向汉元帝汇报时，说：“萧望之、周堪、刘更生三个人结党营私，互相吹捧，联合起来三番五次攻击朝廷掌权的大臣们，挑拨离间皇帝与亲戚们之间的关系。他们是想独揽大权，作为臣子这是不忠的，侮辱皇帝更是大逆不道的，请命令谒者召致廷尉。”汉元帝刚当皇帝不久，不明白“谒者召致廷尉”就是逮捕入狱的意思，于是就批准了石显等人的处理意见。


    过了许久，汉元帝要召见周堪和刘更生，人们说早就押起来了。汉元帝大吃一惊，说：“不是到廷尉那里去了吗？”找来石显、弘恭进行追问，二人叩头请罪。汉元帝看见事已至此，也就无可奈何了，只得说：“释放他们，恢复职务。”石显、弘恭连忙去找车骑将军史高，让史高出面对汉元帝说：“陛下刚刚继位，就把老师和大臣送进了监狱，如果无罪释放，这会影响陛下的声名，应该给他们免职处分。”汉元帝为了个人的声望，下令不治萧望之等人的罪，但革职为民。就这样，萧望之与石显斗争的第一个回合，以石显的胜利而告终。


    富有统治阶级内部斗争经验的石显，深深了解，萧望之虽然丢官了，但他的影响还在，汉元帝对他的好感还在，他还会有重新上台的一天，所以，石显费尽心机要置萧望之于死地。不出石显所料，萧望之被革职数月之后，汉元帝又下了一道诏令，封萧望之为关内侯，食邑六百户，进宫办事，在朝廷上的位置仅次于将军。更使石显感到不安的是，汉元帝居然想让萧望之当丞相！恰巧正在这个时期，萧望之的儿子散骑中郎萧汲上奏章替父亲前番被革职一事喊冤，这件事触到了汉元帝的痛处，于是，命令有关的衙门处理萧汲。衙门的官吏当然能体会汉元帝的用意，在向皇帝报告处理萧汲时说：“萧望之从前犯的过失很清楚，不是别人陷害的缘故，可是，他现在居然教唆他的儿子萧汲上书，诽谤皇帝，这不是大臣应该做的，这是对皇帝不敬的行为，请将萧望之逮捕法办！”石显一看，害死萧望之的机会来了。于是，他同弘恭一起对汉元帝说：“萧望之以前当将军，辅佐皇帝，却要排挤许章、史高等大臣，他自己要独揽大权，本应治罪，幸而皇帝宽大，没有治他的罪，又封他为关内侯，赐给他领地，让他参与朝政。可是，他非但不悔过，反而心怀不满，教唆儿子上书，诽谤皇帝。他这是仗恃自己是皇帝的老师，不会被治罪，所以肆无忌惮。如果不把他送到监狱里去，彻底消除他的不满情绪，那么，将来，朝廷可就

