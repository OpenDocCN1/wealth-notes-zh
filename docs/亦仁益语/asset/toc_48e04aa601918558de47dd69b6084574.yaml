- - '##'
  - 9.2022 新年寄语
- - '###'
  - 1. 今年，想要赚更多钱，一定要去抖音，年后的大航海要跟上。
- - '###'
  - 2. TikTok 在 2022 年也有很好的窗口机会，去年出现了一些赚钱案例，如果你已经入场，两年内不要动摇，扎进去，留在场上就有好机会。
- - '###'
  - 3. 与成长一样，赚钱不是线性的，而是跃迁的。
- - '##'
  - 4. 在现在这个时代，每个人都有赚到 1000 万的机会，我不是说其他人，我是说在座的，加入生财有术的每一位。
- - '##'
  - 5. 更坚定的做一个真诚、利他、开放、平等、实干、长期主义、日拱一卒的人。
- - '##'
  - 6. 生财有术明确了自己的使命：帮助新一代年轻人通过互联网建立和扩大自己的生意。
- - '##'
  - 7. 生财有术 2022 年关键词：项目，抖音，实战。
- - '##'
  - 8. 坚定的创造价值，然后顺带把钱给赚了。
- - '##'
  - 9. 转眼，生财有术第五期还剩 2 个多月就要结束了，年后请各位用力一点，从生财有术榨出更多的油，抖音超级大航海和 9 个主题的小航海已经做好充分准备，迎接你的上船。
- - '##'
  - 10. 家人和健康，比赚钱更重要。
- - '##'
  - 10.从 0 到 1 做项目的 10 个建议
- - '##'
  - 1. 勇敢收钱，超预期交付
- - '##'
  - 2. 从朋友圈起步
- - '##'
  - 3. 通过问具体清晰的问题来理清赚钱路径
- - '##'
  - 4. 完整的阅读生财有术相关帖
- - '##'
  - 5. 每天制定计划推进就是最快的赚钱方式
- - '##'
  - 6. 不要成为学习高手，要成为实战高手
- - '##'
  - 7. 不要在短期的事情上想长期的意义
- - '##'
  - 8. 简单复制就可以有收入的已经被高手干完了，只有要动点脑的项目
- - '##'
  - 9. 任何赛道，不管竞争多激烈，都不多一个能赚几十万的人
- - '##'
  - 10. 你的时间成本相比于未来你要赚到的钱，不值一提
- - '##'
  - 11.给从 0 到 1 刚起步的圈友的 13 条建议
