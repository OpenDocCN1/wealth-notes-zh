  - 《人生感悟篇》
- - '#####'
  - 1.2020 年的个人目标
- - '#####'
  - 2.33 岁生日，与你分享我的几点感悟
- - '######'
  - 1. 尽可能早的接受自己是一个普通人。
- - '######'
  - 2. 尽可能让自己开心一点。
- - '######'
  - 3. 多认识一些乐观的、大格局的、相信长期主义的朋友。
- - '######'
  - 4. 懂得知足，对生活中有的一切保持感恩之心。
- - '######'
  - 5. 尽可能多的帮助别人，尽可能的让别人开心一点。
- - '######'
  - 6. 尽力照顾好家人。
- - '######'
  - 7. 钱并不是越多越好，够用就行。
- - '######'
  - 8. 尽早的找到自己的人生使命。
- - '######'
  - 9. 保持空杯心态，保持好奇心。
- - '######'
  - 10. 活在当下。
- - '#####'
  - 3.如何让自己过的开心一点
- - '######'
  - 不追寻让自己更开心，而是追寻让自己少一点痛苦。
- - '######'
  - 1、做顺应自己内心的事
- - '######'
  - 2、从内心里面真正接受人生是痛苦的观点
- - '######'
  - 3、努力工作，努力生活，减少让你痛苦的事情发生的概率
- - '######'
  - 4、降低预期，对别人，也对自己
- - '######'
  - 5、不去伤害别人，尽可能多的去帮助别人
- - '######'
  - 6、接受苦难和痛苦都是一种人生体验
