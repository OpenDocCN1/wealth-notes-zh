  md: '# 再谈防蚊和防晒


    ![](img/a92bee8d59e1575a5654154f04fd8f76_82_0.png)


    再谈防蚊和防晒


    关联文章：


    问答：夏天来了，怎么防蚊？| 2017.4.26


    那期说防蚊的节目之后还有不少听众继续问：DEET能灭蚊，是不是有害啊？我用蚊香也很管用啊？假如已经被蚊子咬了怎么止痒呢？还有听众说，既然都说到夏天防蚊了，那防晒是不是也说说
    causas。那这期我们就说说。


    # ｜防蚊


    先说DEET连蚊子都不能灭，会不会有害的问题。其实DEET不能灭蚊，它之所以能驱蚊是因为它会阻断蚊子嗅觉细胞上的一种受体，叫OR83B。嗅觉是蚊子赖以生存的功能，把它扰乱，蚊子闻到所有的味道都不正常了。


    也许曾经让它嗅浓欲滴的汗味儿、二氧化碳味儿，现在都成了刺鼻的味道，所以才避之不及，飞远了。DEET只能驱蚊不能灭蚊。


    DEET的安全性已经经过了最严格的检查，而且使用的年头也非常久了，所以出现危害的可能性就非常非常低，远比没有品牌和农药许可证的所谓纯天然植物精华驱蚊水安全的多。


    那期节目说到蚊香了，蚊香里的有效成分是菊酯，这东西遇热挥发后对蚊子是一种神经毒素，会引起钠离子通道的不正常，钠离子就只能进不能出了。对蚊子的效果就是最初闻到以后就会发疯癫狂，过度兴奋，接下来就会各种活动都抑制，然后死亡。


    菊酯挥发出来对人的影响很小，因为蚊子和人重量差太多了，但如果不留意吃下去的话，也会有这样的效果，所以家里有小孩的时候要告诉他蚊香不能吃。那些用火烧的蚊香是为了保持快速燃烧而专门添加的物质，虽然冒烟，但那些成分没法驱蚊，电蚊香又好又方便。至于效果，因为空气流动的问题，往往放在墙角基本没效果。


