    # 请把这10条健康问答，转给你最关心的人


    # No.1 中国人为什么坐月子？


    生孩子以后需要恢复，需要格外注意感染，所以中医理论套在这样一个大前提下，就诞生了“坐月子”。坐月子禁忌非常多，到现在我们已经可以轻松识别，不能洗澡、不能洗头、不能刷牙，这些是胡扯。但是不能碰凉水，不能吃凉性的东西，不能吹风，这些好像大家觉得有那么点道理，其实这些一样是胡扯，这只是中医套用了食物温凉寒热的那套理论。


    # No.2 水土不服是怎么回事？


    水土不服主要是因为消化道微生物菌群的变化导致的。我们消化道可能有好几百种细菌，它们的种类和占Estimated分配每个人都不同，来源主要是两个：一个是刚刚出生时吞下的母亲产道的酸性溶液里带的菌群和最开始母亲口中的微生物；另一个是后天吃的食物在消化道形成的环境适于哪些微生物生长，就有аком微生物。


    而母亲传给我们的微生物也由母亲的母亲和母亲平时吃什么决定的，所以这就是一方水土养一方人。当你更换生活环境时，肠道微生物不适应，自然就会出现拉肚子等水土不服的现象。


    # No.3 所谓“辟谷”的好处？


    辟谷就是指一周7天里有5天按正常习惯吃饭，另外两天每天只吃正常量的1/4，在科学研究里管这种方法叫轻断食。


    最稳妥的来看轻断食或者辟谷应该只能算作一种减肥方式，在健康上的其他益处有一些迷象，但是是不是如此？还需要更强的证据。当前不建议给孩子、老人、病人试。


    # No.4 得不得癌症是靠运气吗？


    《科学》期刊上刊登了一篇论文，结论说的是引发癌症的突变里有66%是随机突变导致的，29%是环境因素导致的，5%是遗传导致的。这些研究对科研人员是有意义的，它至少提示了科学家要重视随机错误对癌症发生的研究。


    但同时，这项研究是一个庞大的平均值，必然有一些突变更受随机因素影响，另外一些更受环境影响。哪些更受环境影响才突变呢，很不幸，抽烟导致的肺癌，喝酒导致的肝癌，胡吃海塞导致的结肠癌，不注意防护导致的皮肤癌都是更受环境因素影响的癌症。所以不要因为一篇权威期刊，就放心不管自己的生活。


    # No.5 藿香正气水能治中暑吗？


    中暑的本质是因为身体缺水缺的太多了，导致身体没有多余的水分可以用来调节体温。这时候喝一个非常刺激的液体，多少会让神经兴奋度提高一些，但是藿香正气水绝不会对中暑的人有好处。


    因为藿香正气水会继续耗费身体水分的，或者甚至是起到脱水作用，喝它只会加重病情。


    # No.6 大脑的耗能有多少？


    人类的大脑占体重的2%，它耗氧量占到全身的20%，消耗葡萄糖量占全身的25%。大脑需要的能量，平均1小时是5克葡萄糖，一天就是120克。如果一天吃120克葡萄糖，都消化了以后是480千卡能量。所以大脑一天消耗480千卡能量。


    # No.7 电子烟有害处吗？


    各个厂家对电子烟的研发思路大都是希望烟民能通过电子烟逐渐降低对真香烟的依赖。他们怎么做呢，就是用丙二醇来模拟吸入嘴里和喉子的时候那股辣和呛的感觉；用尼古丁来满足身体成瘾的需求；用甘油营造吞云吐雾的视觉效果；用化学香料模拟各种味道；用电加热的方式让这些成分挥发。


    总的说电子烟的危害至少比香烟小，但具体小多少，没有一个明确有效的测试。


    # No.8 入耳式耳机对听力有损伤吗？


    如果入耳式耳机的使用方法正确，其实更保护听力，因为入耳式耳机可以隔绝外界噪音。我们使用耳机的时候往往是坐公交，坐地铁的时候，这时候外界噪音本来就很大，大到面对面说语都不一定能听清，这种环境噪音本来就在损伤听毛细胞，这时候你塞上入耳式耳塞，就算是什么音乐都不放，都是对听力的保护。


    # No.9 该不该买电动牙刷？


    不一定非得买电动牙刷，如果用普通牙刷，只要你掌握巴氏刷牙法，效果也能很好。这个方法大致就是你刷牙时不把重点放在牙面上，而是更多的放在牙齿根部和牙龈上，所以刷的时候，牙刷一半盖住牙齿的部分，另一半盖住牙龈的部分。清洁时，每次牙刷覆盖两颗牙齿，反复刷上4秒钟，然后换到另外两颗牙齿上，内侧和外侧都刷到。


    这样刷最少也得需要3分钟，实际情况是很少有人能保持正确方式刷这么长时间。即便是这些人知道巴氏刷牙法，知道时长对效果的巨大影响，也还是如此。所以基于这种现状，电动牙刷还是值得推荐的。


    # No.10 美容保健水真能美容吗？


