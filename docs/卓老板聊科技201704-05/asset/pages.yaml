    +   1. 原子占据的空间中，原子核只占非常小的部分，大部分空间都是电子运动的区域，电子的能量状态决定了分子结构，也是因为这个由电荷力维持的空间让我们不会陷入土壤，让我们的屁股还能由椅子支撑。


    +   2. 但实际上这个空间里是可以容纳更多电子的，当有巨大压力的时候，电子的能量状态密度会很高，同一个能量状态还会排满一对儿自旋反向的电子。于是原子占据的空间会小很多。就像恒星变为白矮星后体积会大幅削减。


    # 本期音频金句 ↓↓↓


    > 当我们讨论黑洞时，它并不是一个实际存在的东西，它的各种性质，比如星星穿越时的那些跨入视界线啊，或者黑洞往外辐射物质啊，这些都不是黑洞的客观属性，而是在后续不同的理论框架中存在的，在数学计算和公式推导中预言的，真实情况是不是这样，那还要通过观测验证，最好是直接观测。


    > 在科学这件事儿上规律就是这样的，离今天越近的著作越值得参考，几百年前的科学著作，那里的内容如今早就被淘汰了，只能给史学家用了。


