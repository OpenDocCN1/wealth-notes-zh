    # No.1 问答：吃燕窝对身体有益吗？ | 2017-03-02


    正经的燕窝有50%左右是蛋白质，30%是碳水化合物，剩下是一些是水分、矿物质和一些微量元素。


    尽管燕窝蛋白质含量很高，但这里的蛋白质不是优质蛋白，不包含人体所需的8种必须氨基酸，营养不如鸡蛋或者豆腐。


    而且更重要的是吃燕窝不是生吃，用水一泡发，1克燕窝泡出10克来，蛋白质含量立刻变5%，快接近牛奶了。


    卓克

    这世上没有天然形成的神奇物质，所有稀奇古怪的东西就算没有害处，营养成分也很ingles比得上鸡蛋+蔬菜沙拉+面包。但价格却很可能贵上几百上千倍。这钱花出去就是把挣来的钱交税，很多时候还搭上了健康身体。


    # No.2 问答：为什么人会上火？ | 2017-03-16


    实际上，现代医学里根本就没有“上火”这个概念，它只存在于替代医学里，或者养生保健里。


    如果硬要往现代医学上贴，通常我们把牙龈炎、牙周炎、龋齿、咽部感染，甚至各种原因引起的便秘、结膜炎、各种疱炎，身体上各种疱疹病毒感染，身体缺水等一切，全都冠名上火。这是一种过于笼统的说法，上火几乎等同于感觉不舒服。


    卓克

    今后我们再遇到“上火”二字，要务实地找原因，再解决，随便吃去火的药不但没用，反而有害。


    # No.3 危险的糖 | 2016-09-06


    美国从1980年起每隔5年公布一次《居民膳食指南》，最开始的几版都推荐低脂肪低胆固醇饮食，让大家对脂肪和胆固醇留下了不好的印象。


    但实际上我们完全冤枉了胆固醇，也部分程度的冤枉了脂肪，其实他们两个都是为糖背了黑锅。食用越多的糖，心脏病发病率会增加，这要比食用高脂肪饮食更厉害。


    卓克

    我们已经知道了糖精对人体有害，所以阿斯巴甜、木糖醇、蔗糖素、甜菊糖等代糖有了出人头地的机会。

    欧盟食品安全局给出的结论是一个150斤的人，一天吃3克阿斯巴甜，连续吃好几年也没有问题。


