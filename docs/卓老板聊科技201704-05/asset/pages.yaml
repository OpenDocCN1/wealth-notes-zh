    # 问答：夏天来了，怎么防蚊？


    卓老板，最近蚊子多了，晚上睡觉就翻出去年没用完的电蚊香液。查了下里面对人体有害的是菊酯类化合物，安全线是多少没查到，使用空间大小和时间长短不同的话好像情况很复杂，想麻烦你讲一期这类灭蚊杀虫剂应该如何正确的看待和使用，孩子和孕妇需不需要特别的注意？


    卓克

    这个时间讲讲防蚊的方法，很有必要。


    夏天来了，怎么防蚊？


    4月份虽然北方还不那么热，但南方已经有人开始换蚊子咬了，这期我们赶在蚊子大军到来之前说说怎么防蚊。


    蚊子之所以能找到我们靠的是二氧化碳的味道。你可能觉得二氧化碳没味儿，那是对你，在蚊子那二氧化碳就是味道浓烈的，充满食物的香味。但这一步我们几乎没法避免，因为我们时刻在呼出二氧化碳。蚊子通过它做大致定位，然后再通过皮肤上汗水的味道定位哪儿可以下嘴。


    其实新鲜的汗水是没有味道的，但只要停留在身上时间久了，细菌就开始在汗水中繁殖，繁殖过程中会产生味道，即便味道很弱，对蚊子也是很明显的。它们就是通过汗水的味道判断哪儿可以下嘴。


    蚊子还倾向于往温度稍高的地方去，所以什么人最招蚊子呢，就是那种傍晚刚打完篮球的男生，他们呼出二氧化碳的量大，体温高，浮身还都是汗水。蚊子找准目标开始吸血，快的时候只要20秒就可以完成一次吸食，一次吸的量也不会很多，但是经常会肿起很大的包来。


    你要仔细听过免疫系统的那一系列节目就知道为什么会起包，那些是蚊子的唾液引起的免疫反应。它们吸食血液时会分泌十几种蛋白注入血管，就是为了防止血液凝固，另外还会扩张血管，但这种陌生的蛋白质被免疫系统认出来后，身体会启动防御机制，分泌大量组织胺，然后血管壁通透性增加，不少血浆就流出来到被吸食的部位，所以才会肿胀。


    这一肿胀就挤压刺激了神经，就会发痒，所以即使你用力抠，抠出来的也都是组织液，而不是蚊子的唾液。


    不同的蚊子唾液成分不同，所以起的包严重程度也不一样，有些刚被咬1分钟就肿起来，有些甚至几个小时后才有反应。一般来说在住家附近的蚊子咬了包以后反应会轻一些，因为我们的免疫系统经常遇到这种侵袭，有些适应了。出差去别的地方，或者刚刚搬家到其他国家，那前几个月被咬起来的程度都比较严重，因为蚊子唾液毕竟不是自身的蛋白质，所以一般都会引起免疫反应把它清除掉，所以都会起个包。


    这就是蚊子找到你和咬你的过程，防御方法有两种，物理的和化学的。


    物理方法就是蚊帐和长袖长裤。奥运会时巴西人看到咱们代表团的蚊帐都惊了，这些东西效果很好，咱们不多提。家具和墙上的纹路也尽量不选深色的，不选有细碎花纹的，这样更容易发现蚊子。物理防御的那些所谓灭蚊灯效果并不明显，蚊子并不会被吸引进丟送死，如果放在户外，反而会吸引很多趋光性的虫飞进去，蚊子并不是主力。


    化学手段防蚊。美国疾病预防控制中心曾经推荐过四种防蚊产品，这时你要注意，这就是主流科学观点了，它是一个科研机构通过大规模实验的统计得到的结论。


    第一种是DEET，中文名字叫避蚊胺，中国市场80%的蚊子水用的都是这个，只是含量上的差异，最低的3%，其实这么低就没什么用，最高的有50%以上的，不太好买到，浓度高防范效果好，保持时间长，但是抹上黏糊糊的，感受不好。


    DEET你要 dunes ...'
