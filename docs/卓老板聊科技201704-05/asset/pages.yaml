  md: '# 问答：绝对零度是怎么回事？


    ![](img/a92bee8d59e1575a5654154f04fd8f76_78_0.png)


    从小到大有一个问题一直弄不懂，为什么会存在绝对零度，可温度往升高的方向上是没有限制的，跟奇点和熵有没有关系？


    ![](img/a92bee8d59e1575a5654154f04fd8f76_78_1.png)


    卓克


    绝对零度是不可能达到的，物质的温度也应该是有限的。


    绝对零度是怎么回事？


    听众一军说从小到大有一个问题一直弄不懂，为什么会存在绝对零度，可温度往升高的方向上是没有限制的，跟奇点和熵有没有关系？


    绝对零度是多少呢？就是摄氏零下273.15°，当然，这用的是摄氏温标，如果用国际温标，开尔文的话，那绝对零度就是0开尔文了。


    温度的概念如果我们理解为冷热，就太表面化了，至少我们要把温度理解成大量粒子随机运动剧烈程度的平均描述。大量，有多大呢？估计至少也得有几万亿个原子那种规模才行。这时候，让我们的手摸到一个物体，这个物体表面的微粒正在剧烈的运动，咱俩皮肤上也有原子、分子，两个一碰触，振动得剧烈的带动振动不那么剧烈的也震起来了，这种刺激就会被神经传给丘脑，信号在丘脑中收集后送到皮层，经过意识的加工，就感觉这水温很合适，可以美美的泡个澡了。


    所以感觉到冷暖是神经信号的再加工，并不是物理属性。物理属性还是源于粒子的运动，但是温度也只能用在描述大量粒子的时候，只有一个粒子的时候温度是没有意义的。这有点像出生率，只有几十万人以上，你才谈得上这群人的出生率是多少。只有一个人的时候怎么衡量出生率呢？


    知道这些你就可以理解，为什么温度没有上限，因为这个假设也有点问题，虽然只要足够多能量，就会导致大量粒子运动得更剧烈，运动得越快，总体上看温度越高。但是有可能组成物质的原子也许都无法维持原子核的结构了，那时候你描述的物体已经不是它了，所以温度应该还是有限的。


    但对于变冷这个方向，运动得越慢，总体上看温度越低，但运动得最慢，最微弱，那就是不运动了，总不可能比不运动更加不运动吧。所以绝对零度的物理意义就是大量粒子的随机运动都停止了。


    不知道大家有没有留意随机运动这几个字，就是说微粒还会与在电场内运动，重元素也还有放射性衰变，一个接近绝对零度的钟摆也依然会在地球重力作用下精确地摆动。只不过组成它的微粒的随机运动减弱的非常厉害。


    这个应该比较好理解，比如钟摆的摆锤加温到800℃，只要它没融化，它也依然按照规律精确地摇摆。原子的随机热运动的速度在很高温的时候甚至都能达到光速的几十分之一，但是它们整体上依然可以维持缓慢的运动。就是这样的道理。


    那可不可能粒子完全不运动了呢？不可能的，你还记得从前我们说过的условно原理吗？在物理常用的就是，物体的位置和动量是不能同时是确定的值的，一旦位置确定的时候，物体的速度就是无限大，那就相当于运动无限剧烈。一旦速度确定的时候，物体的位置将是宇宙空间中任意的位置，所以根本谈不上这个粒子在不在运动了，你都找不到它了。


    所以最终是由量子力学上这个规则描述了绝对零度不可能达到，只能无限接近，那如果继续追问，为什么量子力学会有这样的规则，那就没法继续深入了，起码则是这样的，而且从这条假设导出的推论也和观测事实高度吻合，所以一切对不对都靠实验说话。


    那你要问，为什么是零下273.15℃呢，为什么不是其他数字，比如373℃？那是因为在热力学实验中发现，绝热过程中，保持气体压强不变，气体温度每下降1℃，气体的体积减少0℃时体积的273.15分之一，所以就这样推导出了273.15摄氏度这个数值。最开始的实验可能并不能把恒压或者绝热过程控制的非常严格，所以也只能测出个270左右的数字，不过随着测量越来越精密，这个极限值就能测的越来越准了。


    现在人类可以制造的最低温度能到多少呢？大约是比绝对零度高十亿分之一度，这个东西还在建设中，NASA要把一些特殊状态的原子送到太空中，这个实验叫寒冷原子实验室。这东西再过3个月由马斯克的SpaceX发到国际空间站去，到时候我们拭目以待。


