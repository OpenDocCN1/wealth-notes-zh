    # 关于心脏移植手术 ↓


    最近有一个公益广告的细节引起了听众·热云·的 兴趣，就是一个婴儿在哭闹，好几个人把他抱在 怀里，怎么哄都不管用，但最后 一个中年男人把 他抱起来，这时音效里突显出心脏怦怦跳的声
    音，这个小宝宝一下安静了下来。字幕这时候打 出来，说这个男人的心脏是孩子母亲移植给这个 男人的，宝宝听到了熟悉的心跳声找到了安全 感。热云想问问，对于婴儿来说真的可以通过感
    觉分辨出母亲的心脏的跳动吗？而且他也怀疑婴 儿听觉系统和记忆功能真的发育全了吗？


    说说婴儿，他的平均发育进度是这样的：在怀孕 25周的时候他的听觉系统已经发育完成，所以 也就是说在妈妈肚子里，他已经可以听到很多声 音了，这也是很多人说要胎教的理由。


    不过婴儿的神经系统可远没有听力进展这么快， 在妈妈肚子里时，不管是放《道德经》，还是 放“般若波罗蜜”都没什么区别，他们听觉器官后 面的神经系统并不能处理。我觉得最大的好处就
    是多疼妈，让妈每天美滋滋的，她心情愉快 的时候各种内源性激素都会给胎儿形成良好的环 境，我就见过一些研究是孕妇长期快乐的心情会 让孩子体内也产生同样的内源性激素的分泌，这
    些是让孩子更健康发育的关键。而让他什么时候 背单词，背唐诗，那都是很次要的东西了。


    胎儿3个月的时候就能分辨父母的声音，也能分 辨声音的方向了。那个公益广告里可以听到去世 妈妈移植后的心脏的跳动只是广告里的一个情节 而已，是不可能的。婴儿在妈妈怀里可以得到安
    慰，心跳也许是一个因素，但更多的是母亲抱他 的手法，母亲身上带着的他熟悉的味道，还有他 熟悉的母亲的嗳音。


    我第一次看到这广告稍微震了一下，因为这实际 上意味着母亲是在婴儿刚出生就去世了，而且通 常来说心脏移植的供体很多都是在急性事故中身 亡的，比如交通事故，所以这个小婴儿以后长大
    了也没了妈妈。


    我回答这个问题其实还想说说心脏移植手术的事 儿，这是人类医学的一项伟大的成就。谁都知道 心脏是生命的关键，比如战场上一刀捅在心脏上 那就死定了，但在1896年还是一位医生第一
    次把一个心脏外伤的病人缝合上，就这样，竟然 没有死掉，从此医生们开始试着拯救心脏。


    现实中， 第一次成功的心脏移植手术是直到 1967年才实现的，最早在没有人工心脏的时 候，这个手术要求时间配合点非常好，也就是那 个心脏衰竭的人需要把开胸手术都做了，敞着口
    等着，然后供体也恰好就在旁边刚刚死亡，然后 把健康的心脏取出来，才能移植给受捐助人。


