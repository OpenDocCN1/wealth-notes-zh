  md: '上可以达到100%浓度的，不过也就是在躲在外生存时能用上，这东西涂上感觉黏糊糊不好受。


    除了DEET，有效的驱蚊成分还有伊默宁，英文缩写是IR3535，中文名是驱蚊酯。这个在中国市场不如DEET广泛，效果在浓度超过20%以后和DEET差不多，但是低浓度时的防护效果就差很多，比如7%浓度的防护效果只有20多分钟。


    第三种有效的化学成分是艾卡瑞丁，这个是1980几年拜耳药业出品的，效果比刚刚说的都好，只不过更难买到。优势在于涂上以后还有清凉的感觉，不像DEET，Diamond了一身油那样子。


    第四种有效的是柠檬桉树油，听着好像很自然吧，但是防蚊效果是最差的，不论多浓，顶多2个小时。但是占了便宜，因为它有挥发性，让人感觉味道出来了，就是有效果，而且还凉凉的。


    以上说的这些都是主流科学界对防蚊产品的观点，安全并且有效，而且只推荐了这几种，其他就算有效果也不如这几种了。另外，蚊香用的菊酯类产品也是安全的，但是防护效果要比驱蚊液低一个数量级。


    如果这些防蚊方法核算成分数呢，满分100分的话，物理防御贡献55分，驱蚊水防御40分，蚊香贡献5分。


