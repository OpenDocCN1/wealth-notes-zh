  md: '# 问答：激光是什么？


    卓老板，激光就是γ射线吗？还是α、β、γ射线的混合，或者是其他光呢？


    激光是什么？


    听众万常华问，激光就是γ射线吗？还是α、β、γ射线的混合，或者是其他呢？


    估计你是听了月球到地球距离通过激光测距这段时候想到的吧。简单的给你答案呢，激光不是γ射线，也不是α、β、γ射线的混合，而是通过一种特别的机制，利用折腾电子的方式，产生的一种电磁波。这种电磁波能量可大可小。


    γ射线本质上也是一种电磁波，但它是折腾原子核的方式产生的，原子核几乎集中了原子所有的质量，所以定性的想想，折腾原子核射出去的电磁波应该会比折腾电子射出去的强很多了，其实真实情况也是这样的。大部分γ射线比X射线强得多。


    那什么是激光呢？中文翻译其实挺言简意赅的，就是受到激发后出来的光啊。它英文名是LASER，五个字母其实都 云缩写，全称是受激辐射光放大。


    那我们就仔细说说什么叫受激辐射的发光。


    咱们先看看普通的光源为什么会发光，比如像灯光、火光，它们是接收到能量以后，原子中的电子会吸收外界能量，注意是电子吸收了能量后，从低能级蹦到高能级上，就像楼梯台阶一样，但电子能站在第二级台阶上的时间短的可怜，一上去马上就下来。就在下来的時候，把刚刚吃掉的那份能量就又吐出去了，吐出去就是以放出一份光子的方式实现的。


    不过某种物质，如果你就是这么随随便便放在一个环境里，基本上说，只要温度还是几千度以下，那简直没什么电子能激发到第二层台阶，到第三层台阶那就更没可能了。有多少比例的电子去了2层、3层是有物理公式描述的，这些电子的分布满足一个叫做玻尔兹曼的分布规律。


    简单的说，能爬到更高能级的电子的数量随着能级升高，呈指数的下降，而且这个指数的数字还不小呢。比如说在20℃下，氢原子中处于最低能级的电子的数量是处于仅仅比它高一级的第二级能级电子数量的2.718的400次方，所以就算把温度提高到几百，上千度，也依然对这个悬殊的比例没什么提升。


    而且这个过程是很随机的，那些自发辐射出来的光子的方向往哪边的都有，相位也不一样，也有个别是从第三级往最低级跳的，这就是普通物体的发光，室温下几乎不可能看出来什么，温度特别高时，开始展现出一些颜色。


    但这些和激光完全没法比，差距就体现在发光的统一上，激光射出来的光子都是一个方向，都是一个频率，都是一个相位。


    这些是怎么做到的呢？这得先找到一些特殊的晶体结构，这些晶体如果你给它加电场，或者持续用粒子轰击这类晶体，就会让电子的分布出现奇特的现象，就不是所有电子都跪在最低能级了，会有相当多的电子被往上抛到第3能级，或者更高的能级，然后这些电子还会往下落一下，比如这时候它们被抛到第三能级后，最终都安安稳稳跪在第二能级，反正就是很奇特，它们竟然可以在第二能级待好久，比如几毫秒。


    我们就是要抓住这种电子分布的大反转，再用一个固定频率的光照射这个晶体，这个光的频率大都是从它当前那个能级往下跌落一个能级的，这两个能级差对应的就是光子的频率。


    这时候受激辐射就开始发生了，晶体就会发出跟诱发它的光完全一样的光子出来，频率一样，发射方向一样，偏振方向一样，波的相位都完全一样。而且你射入一个诱发的光子，那边出来的就是多个同样的光子，这就是一种放大效果，所以激光的英语
    LASER 中第二个字母 A，Amplification，就是放大的意思了。


    这个道理明白了，你就知道当我们掌握描述晶体的理论后可以计算很多事情，首先就是一个指定的晶体，它的电子能级分布是什么样的，外加电场需要调整到怎样的形式，就有可能让晶体的电子排布来一个反转。


    而且反转过后，我们应该用什么频率的光来激发它，激发出来的光是什么颜色的？放大的程度有多少。比如最早计算出来的就是用红宝石晶体做的，红宝石是什么呢，就是纯净的三氧化二铝晶体。通过计算，在里面掺万分之五的氧化铬，用高压氙灯把铬的电子激发到第三能级，这些电子被抛上去后，很快坠落到第二能级，然后就稳定了，这时候再算算这个晶体中氧化铬的第一能级和第二能级的差，把能量差对应的光子频率找出来，是694.3nm波长的光，这正好落在可见光范围，是红色的。就用这种光照射那个掺杂了的红宝石，就会出现红色激光了。


    上面大致就是激光发射的原理，这背后就是量子力学应用在晶体上的成果。


    基础科学有什么用？1920几年你问玻尔、海森堡、泡利、薛定谔，他们也不知道，但一个完全体系的新理论迟早会改变世界的。'
