    # No.10 美容保健水真能美容吗？


    人体从食物中获取的营养物质是最主要的，如果要把“最主要”这三个字按比例严格规定一下，至少要超过99.9%这个比重。所以不管是美容保健水，还是养生水，花样再多营养成分也是微乎其微的。比如，日本的水素水杯卖得很贵，那它主要卖的就是这个瓶子的钱跟广告费。


