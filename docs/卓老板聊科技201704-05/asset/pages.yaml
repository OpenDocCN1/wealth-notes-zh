  md: '# 问答：怎么看懂牛顿的《原理》？


    卓老板，你好，听说普通的物理学研究生毕业都看不懂牛顿那本自然哲学的数学原理，更不用说托勒密的十三卷的巨作了，这是真的吗？另外，很好奇手算天体运行的从前都发生过什么好听的故事，卓老板能讲一讲吗？


    卓克


    看古代科普书，盲目崇古的心态是要不得的。


    怎么看懂牛顿的《原理》？


    有听众说普通的物理学研究生毕业绝对看不懂牛顿那本自然哲学的数学原理，更不用说托勒密的十三卷的巨作了。另外他还想听听手算天体运行的从前都发生过什么好听的故事。


    首先我要说，牛顿的《原理》这本书怎么可能是在物理系研究生都看不懂的呢，网上也有下载的，大家下来看看，除了内容非常多，每个定理推导都是从头来的，有证明，绝大部分内容是高中生认真看都可以看懂的。虽说有一点微积分的知识，但也是从头讲起，高中生也可以看懂。


    另外提到的托勒密的十三卷巨作，就是《天文学大成》，也被翻译成《至大论》，要是觉得更看不懂了，这也是不对的。说是13卷，但加一起一共152页，一会儿就能看完。里面运用了基本的几何知识，也许推导的逻辑我们不熟悉，里面还夹杂着很多对神和自然的崇敬，但提出的那些大圆套着小圆，用偏心轮解决表观逆行的内容也很懂，可能初中同学也能看懂。


    其实这种想法也很有代表性，就是一种崇古尚古的心态，认为那是伟大到难以理解的地步。但科学这件事怎么可能100年前的理论比现在的更精准呢，所以就更别提几千年前的东西比现在的理论还好了。


    我们赞叹科学的伟大的时候，那伟大并不是知识细节上的伟大，而是这种思维方式的坚持和信息传递的方式是伟大的。在具体知识上只可能是现在的好比50年前的，50年前的比500年前的。


    这种心态下很多涉及科学著作的文字对普通大众容易造成误导，比如中国科学院自然科学史研究所的官网上这么介绍托勒密的《至大论》，说这是一部成就卓著的科学著作。它是希腊天文学的顶点；它是古代用数学语言来描述一大类重要的自然现象，同时在合理的精度之内预测它们变化的典范；它教会几世纪的科学家如何在经验观测的基础上建立几何和运动学模型，以此模拟自然界的运动，这一方法直到现在还影响着科学的研究方法。


    普通人听完就心生崇敬，但实际上他里面的核心内容就是地球是宇宙中心，其他行星、太阳、月亮绕着地球转，恒星都不动，然后为了和实际观测的结果吻合，需要设置很多奇怪的绕行轨道，就是我刚说的本轮和偏心轮，而且观测的手段就是肉眼。能够提出这些理论，放在古代是有他伟大的地方，在2000年前甚至600年前还都是在当年最好的模型，但论科学细节来说早就被淘汰了，如果不研究科学史，根本没必要看。


    牛顿的《原理》在看的时候，也总有一种所有剧情都被系统化的剧透过，但是现在正在每集每集按顺序看的感觉。总之这种盲目崇古的心态要不得。


    要说天文发现中比较吸引人的故事呢，倒是不少，先说个郝谢尔的吧，威廉·郝谢尔是发现天王星的人，这算是天文学家了吧，但其实他在34岁之前的人生轨迹就是一个音乐家，虽然远比不上贝多芬、巴赫，但也是国家军乐团的乐手，可以胜任小提琴和双簧管的演奏，这两种大类乐器都在乐团里都可以担任乐手，还是很厉害的，而且还作曲，留世的古典音乐作品有20首，基本就是个非著名音乐家的身份。


    但是在35岁那一年在他仔细研究和声规律的时候突然爱上了数学，在看数学书的时候又爱上了光学，最终爱上了天文观测，那时候他家里已经非常有钱了，搞音乐也只是个人喜好，所以搞数学搞天文也顺其自然，自己造天文望眼镜，到41岁的时候他才知道，原来自己造的望远镜的整体性能比天文台的还好。后来有皇家天文学会的人不服，说要比试比试，他拿着自己第二好的望远镜跟当时格林威治天文台最好的望远镜一比，分辨率高了10倍，当时那个不服的人就闭嘴了，天文台的人还要花钱把他造的望眼镜买下来。


    他的后半生几乎就再也没花精力在音乐上了。一辈子完成过4次巡天观测，6等星的巡天可能还好，但后来几次都是8等星的巡天，那大约包含了几十万颗星了。巡天观测是一种任务量巨大的活，可能一般天文学家一辈子也看不完一遍。他妹妹当年也是跟着哥哥的脚步，哥哥弄音乐，妹妹也学音乐，哥哥喜欢上天文，妹妹也帮着做辅助工作。据他妹妹说，当年哥哥要说哪天能休息，那只能看哪天阴天下雨乌云密布，赶上这种坏天气哥哥晚上才能睡觉，而且观测的时候眼睛不能离开目镜，一观测就是几个小时不能断，中间就是妹妹拿勺一口一口喂他哥哥吃饭。普通人这么努力都不能不作出成果，更何况这么天才的郝谢尔了。这个故事大概就是这样。'
