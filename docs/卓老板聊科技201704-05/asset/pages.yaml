  md: '# 问答：基因编辑未来的应用是什么？


    卓老板能聊聊基因编辑技术有什么应用场景吗？


    卓克

    “21世纪是生物工程的世纪”，只不过现在还没发展起来。


    基因编辑未来的应用是什么…


    有听众问基因编辑的未来应用有什么？他说10年前到15年前年生物工程毕业的同学，好像真的只有搞研究这一条出路，很少能有本科或者硕士找到和专业相关的理想工作。他们那批同学当年就是听了这句话“21世纪是生物工程的世纪”才入的行，结果很多找不到工作。


    但其实“21世纪是生物工程的世纪”这句话也没说错，因为一个世纪有100年呢，那前10年可能真没发展起来。现在生物工程的同学们要找工作，已经远比从前好了，生物的世纪，这个特征越来越显著。现在很多公司虽然规模很小，但已经拥有不错的核心技术，这就是一个标志。


    生物工程的核心就是分子生物学，尤其是从2013年开始使用的CRISPR Cas9的基因编辑技术，效率远远超过以前的技术，从前需要几个月的时间才能完成的工作，现在几天就能完成，所以针对指定基因设计实验，做起来速度就快太多了，再加上基础学科进展速度加快也导致应用领域的突破，所以像各个物种的转基因编辑，濒危动物的拯救，采用基因编辑制造的药物，或者可能算不上药物，只能算治疗方法，在今后就会出现。


    今后在医学上也许还会出现另一个场景，就是治疗疾病除了手术、吃药，还有基因编辑。刚刚说的CRISPR Cas9的专利中还有一个华裔科学家，张峰。其实在这波生物世纪的基础科学的发展中，中国第一次在一个大的学科分类上整体跟上了世界顶级水平。你想，1900年-1925年的物理学黄金年代咱们完整错过了；1970年到1995年，这25年的半导体的黄金年代，咱们也算错过90%。所以我很看好中国生物领域的进展。


    不过有喜也有忧，我也想顺便说说韩春雨事件。他第一次出名是去年五一长假里，到了6月份质疑声就四起了，后来就发展到国内外学术界的jön了。韩春雨团队一次次的把时间往后拖，但是上亿的科研经费和各种荣誉，全省最美教师啊，科协副主席啊，也都加身了。但是对质疑，他始终没回应。


