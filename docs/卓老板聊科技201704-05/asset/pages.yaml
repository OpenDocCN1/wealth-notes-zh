  md: '# 问答：如何用工具提高工作效率？


    能提高工作效率的，除了宽屏显示器，还有别的设备吗？桌老师能再多讲一些吗？


    如何用工具提高工作效率？


    之前说了一期用显示器增加工作效率的节目，很多人都要我说明还有没有其他配件可以提高效率的，那我就补充一些。


    首先就是听到的内容，我曾经看到过很多人िह在写东西的时候戴着耳机听音乐，其实这是一个非常耗费注意力的习惯，也许办公室很吵，有人说话，有人打电话，你把音乐声音放大一些会压过这些干扰你的声音，但那些音乐也是同样级别的干扰。


    一般你放的都是你喜欢的歌曲，所以每当歌曲里那些打动你的部分出现，你的情感就把思路Vtbl走了，时不时，一个钢音，一个鼓点就夺走了你的注意力。


    所以需要集中精力的時候去听歌，只能适得其反。这种分散注意力的还有QQ的闪动和微信的闪动，所以这些也都关闭，你可以试试，完成同样工作你会感觉轻松很多。


    当然，我知道，有些工作虽然也在写东西，但并不需要集中什么精力，动用什么脑力，类似于体力活，类似于抄写一样的工作，那为了避免无聊，窃说听歌了，听听语音节目都没问题。


    但假如周围总是 有干扰，别人的电话中的一问一答总把你的思路拽过去怎么办呢？我告诉你，买一个主动降噪的耳机，注意，要买耳罩式的，那种入耳式的虽然也不便宜，但效果远不如耳罩式的。戴上以后基本上就处在另外一个世界了，我第一次戴的时候就感觉进到了声压等级测试的屋子里，一切都静下来了，非常有利于集中精力。


    它虽然不能完全滤掉语音，但削弱60%的效果也是有的。虽然我说文音乐是有害的，但是有一类音乐我是写稿时听的，就是你现在听到的这个背景音，是非主流的音乐人做的，翻译过来叫做双曲螺旋（Hyperbolic
    Spiral），专辑叫螺旋的宇宙（Spiral Universe），既没有情感表达，也没有技术展现，其实你要是有印象，他和我很早以前说的木星探测器，朱诺号靠近木星巨大磁场时，沿途录下的声音好像，差不多就是宇宙的声音。


    这张专辑也是作者为了纪念天王星发现者赫歇尔做的，跟天文也多少有一些渊源。这类音乐就不会牵扯走你的思路，还可以完全盖住本来就已经被削弱很多的干扰，基本上我听这些音乐写稿子时，差不多就跟在宇宙里写稿子似的。


    肯定有人问买什么耳机，主动降噪这方面只要在BOSE和索尼里选就可以了，选最新和最贵的那几款就可以，不到3000块钱，提升工作效率好几年，这种设备不像手机，掉价掉很厉害，你只要没有额外需求，基本可以一直用下去，像坐飞机，坐火车也都是防噪音利器。


    再一个提升效率的就是输入法，我要说的是语音输入法。我举个例子，之前有一阵子，我有过一周左右严重的落枕，就是颈部肌肉严重拉伤，那次严重到头2天我连起身都难，没法保持坐姿。


    但稿子还得交啊，怎么办，逼着我躺着用手机写稿，我下了科大讯飞的输入法，在笔记软件里就说了起来，结果那期节目写稿的速度竟然比我健健康康坐在屏幕前写出来的速度还快。


    我那时还处于半残的状态啊，这当时给我触动非常大，后来我回复听众大段的内容时也都用语音输入了，比键盘敲出来的速度快2-3倍。


    不过这个技巧对我也有副作用，就是后来在我好了以后又打算用语音输入的时候就发现，这稿子写出来怎么质量这么低啊，不满意，只好再查再完善。


    后来我发现了，原因在于键盘写出的东西速度虽然比语音输入慢，但在我敲入那些字的时候，这半句话表达的意思，它前后逻辑是否通顺，是不是要在某些细节上再查查资料，补充一些数据，我后面要怎么引出下一个问题，这些思考过程也是写稿时间里一并完成的。


    但如果我用语音输入的时候，我根本来不及考虑这些部分了，我差不多全部精力都集中在怎么把我当前这句话，一次说完整，好让程序能正确识别，别呛咳，别啃里啃嚓。


    所以语音输入的稿子虽然快，但是有缺陷。不过我想，如果写一些早就在你脑中的短的内容，比如几百字，或者是一些不太需要强逻辑关联的内容，语音输入完全可以提高速度，并且保证质量。


    还有提升效率的就是SSD硬盘，而且要用那种速度比较棒的SSD，也就是采用PCIE接口的SSD硬盘，基本软硬件都是秒开，程序间切换起来一点卡壳都没有。


    这种SSD相比传统机械硬盘，在所有基本动作上完成的速度都能快几十倍到上百倍，比如一些零零散散的文件需要访问，机械硬盘的话，你的告诉机械臂这个数据在那个扇区，那个位置，然后读写头挪动到那里把数据读出来。这个过程需要的典型的時間就是0.3ms，但我说的那种比较牛的SSD完成这种动作典型時間是0.01ms，所以不光是人切换任务时耗费时间，电脑也是，切换带来的浪费越少，工作效率越高。


    总结一下呢，工作时不要听音乐，看qq，看微信，使用降噪耳机，听类似背景噪音一样的音乐。在合适的场景下用语音输入，使用PCIE接口的SSD。


    另外一个我想说的是，高效的工作方法很好找到，如果你还没有找到其实主要是因为你的工作量还不够大，否则真遇到那一步，大家都在用的最高效的方法，你也一样用的很溜。这也是为什么比赛中，激烈竞争下，大家的招数都一样的原因。


    关联音頻：

    问答：如何挑选显示器？

