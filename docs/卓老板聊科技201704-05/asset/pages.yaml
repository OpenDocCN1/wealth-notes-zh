  md: '# 认知升级与道德标准的改变


    本期你将听到↓


    认知升级与道德标准的改变


    # 本期知识清单↓


    —— ♦ 1 ♦ ——


    # 有一些认知能力是天生的


    +   1. 美洲豹可以轻松的区分出学火鸡叫的摄影师不是火鸡，它能把火鸡的叫声和火鸡的外形联系在一起，这是一种天生的能力。

    2. 因为海平面上升，在9500年前和澳洲大陆分离的坎加鲁岛上的袋鼠，虽然已经没有遇到过陆地上的天敌2200年了，但它们现在依然对典型的捕食者模型有恐惧和警觉的反应。

    3. 南极冰盖大约是3400万年前形成的，刚刚形成之初就有企鹅搬到这里居住，企鹅在陆地上没有天敌，水中的天敌外形又和陆地差异太大，所以3400万年过去，企鹅倒是完全丧失了对陆生动物的恐惧感，经常好奇的围观科考员。

    4. 人类可以对类似面孔的图案有快速加工能力，这种加工过程比普通图片要快，是通过检视回识别的，但如果把面孔倒过来180°放置，快速加工的能力就丧失了，对面孔的加速处理也是人天生的能力。

    5. 识别生物与非生物的能力也是人和动物共有的天生认知，但动物的认知是有限的，比如鹦鹉没法识别出猎豹间的区别，狗无法辨识主人的，性格，所以狗并不是忠诚而是认知能力有限。


    —— ♦ 2 ♦ ——


    # 对物理世界的认知升级


    +   1. 物理定律的基础就是人的认知，比如婴儿在4个月以后就会认为物体 analyte... 一个物体的形状、颜色的变化不是突变的。

    2. 物体属性的变化是连续的就是微积分的基本思想。但稍微一些数学的人也可以把函数在某点处的连续描述成曲线上那一点没有断掉。这种认知虽然好理解，但不严密。

    3. 类似 Y=sin(1/x) 这样的函数，如果问 x=0 点附近是否连续，就会让上面的语言描述中的漏洞显得无疑，因为你根本不可能看到这个点附近曲线的样子。

    4. 描述最准确的语言是数学，它对一个点上是否连续的描述可以理解成：如果一个函数自变量的微小改变，微小到几乎为零的时候，只能造成因变量几乎为零的改变，那它在那个点就是连续的。

    5. 人类发明了语言，已经让认知升级了，人类又发明了数学语言，让认知升级到更高的层级。


    # 原始尺寸


    # 放大20倍


    # 放大400倍


    # 放大8000倍


    —— ♦ 3 ♦ ——


    # 归因的思想与目的论


    +   1. 归因的思想也是人类大脑天生具有的思维习惯，但这种思维并不能让我们理解很复杂的对象，比如长颈鹿的长脖子是为了吃高处的树叶，天上有云彩是为了下雨，这都是孩子一样的思想。

    2. 成人之后，解剖中把肺归因呼吸用的，认为历史是进步的，生产力决定生产关系，社会是按照奴隶社会-封建社会-资本主义社会这样发展，也一样是这类思维。

    3. 神的出现用来解释为什么会有$人和世间万物也是这类思维的产物，但在今天，已经有一部分人抛弃了这种低层级的思维，尽管很多问题并没有找到更好的答案，但起码我们已经有勇气承认自己的无知。


    —— ♦ 4 ♦ ——


    # 认知的升级依赖于科技发展


    +   1. 训练得当的深度学习单元可以大幅超越人类对声音、图像的识别，人工耳蜗可以补足残疾人的听觉，甚至有可能增强人的听觉。

    2. 机器人技术和神经科学的发展，会让人"工视网膜、机械外骨骼补足残疾人的不方便，甚至增强正常人的能力，我们可能将会拥有超级视觉+超级听觉+超级活动力，那时我们的认知还会被颠覆。


    —— ♦ 5 ♦ ——


    # 道德约束是小，能源危机是大


    +   1. 道德和伦理由技术决定，1978年甚至很多科学家都批评试管婴儿，教会称之为恶魔，但如今回每年全世界出生40万试管婴儿，试管婴儿在全世界已经超过500万人，这种伦理上的质疑已经烟消云散。

    2. 只要新技术对个体有益，对群体无害，道德是无法阻挡的，尤其是当成本降低到足够普及的时候，道德标准也会随之改变，所以基因编码技术用来优化个人基因也是迟早的事儿。

    3. 能源危机是阻碍技术进一步普及的关键，因为生物体利用能$的效率非常高，远不是电力驱动可以比拟的，所以新技术能不能普及，就要看是否有可靠的新能源出现。


    # 本期音频金句↓


    我们就天生有一种能力，快速读懂别人表情上传递的情绪。甚至有的时候我们对着月亮上的一些陨石坑，对着树叶上虫子咬的窟窿，这种快速加工能力都能启动，我们经常会从其他物体的纹路上看到一张脸的特征就是这个原因。


    甚至像这样的表述，历史是进步的，生产力决定生产关系，生产力发展，社会就由奴隶社会，发展到封建社会，到社会主义社会，这也一样是目的论，社会形式的变化是多么复杂，几乎要包含人类所有文明积累的影响，也许永远也不会有一个理论能描述，怎么可能是那么一个提纲挈领的原因。


