    # 在科学这件事上崇古是多余的


    本期你将听到↓↓↓

    科学的发现其实存在许多“风口”；

    一个经典的科学家是怎么形成的？

    古代科学与现代科学对比，以显示差别。


    在科学这件事上崇古是多...


    # 本期知识清单↓↓↓


    ——♦ 1 ♦——


    # 科学的“风口”就是那些分支大节点


    +   1.科学也有风口，就是在它不断分支的时候站在了主要大节点上的科学家。所以谈科学发展必提牛顿，因为他是最大分支的创立者。


    +   2.而另一方面，这些学科领域分支的大节点就算没出现牛顿，没有爱因斯坦、玻尔、薛定谔、海森堡、罗素等等，也依然会有另一批人出现在那个节点上，因为科学方法已经出现了。


    ——♦ 2 ♦——


    # 一种“准确”的文化


    +   1.在研究历史时，经常遇到证据互相矛盾的情况，有些是被利益相关者润色，有些是转述的时候自作主张的戏剧化，而后人却只能依据这些内容做史料分析，令人绝望。


    +   2.罗振宇曾经这么看待这种现象：这些资料不准，肆意夸张，而引用不正确内容的就是历史本身，有记录的文明历史就是这样生成的，人类文明建立在各种错误之上。


    +   3.科学会颠覆这种模式，带有各种演绎和错误的内容在科学中几乎不存在，凡是可以写入科学史的内容，都是从诞生起一直被核实和订正的。


    +   4.科学体系里一个结论要成为经典，会经历同行们层层审核：有趣的→有建设性的→可信的→显而易见的，层层递进，一旦出现错误，将被修正或剔除。


    +   5.这样独特的文化积累可以让后人不必重做前人的工作，可以站在巨人的肩膀上不断变得更高大。


    ——♦ 3 ♦——


    # 古人怎么观察昆虫？


    +   1.《尔雅》里写“螳螂有子，蝉螗负之”，意思是说螳螂虫的幼虫会被细腰蜂捕食掠走。二百多年后的汉朝《法言》里对之前的说法有修正，说的是细腰蜂把螳螂幼虫掠到自己窝里后会向它嘤嘤叫，意思是：变成我的孩子吧。于是最终螳螂虫变成了细腰蜂。


    +   2.这种荒谬的说法，从公元十几年一直延续着，在《说文解字》、《毛诗草木鸟兽虫鱼疏》、《尔雅注》、《博物志》、《图经本草》这些专门论述相关知识点的书里也原样支持，全套照搬。


    +   3.直到600年左右，陶弘景才第一个提出了反对意见，他仔细观察后发现所谓的“蝉螗”有很多种，只有一ưởng是掠走其他昆虫幼虫当作食物，其他蝉螗不这样做。观察又进了一步。


    +   4.又过了500多年，到南宋时，才有其他论述说，陶弘景说的也不完全对，那些蜂抓来的幼虫并不是当食物，而是把卵直接产在那些幼虫体内。所以才会有之前幼虫变成蝉螗的情况。


    ——♦ 4 ♦——


    # 现代人怎么观察昆虫？


    +   1.蚂蚁受到攻击后会发出求救信息，附近蚂蚁通过视觉和听觉接收到求助信号后赶来帮忙，这些是肉眼可以观察到的，古人拥有同样的观测条件，但夹杂各种臆断。


    +   2.科学家猜测求助信号也可能通过化学物质传递，所以在显微镜下解剖蚂蚁，在蚂蚁身体各个部位寻找信号分泌源头，并用蚁群的反应确定是哪里分泌的求助信号。古人没有显微镜，所以做不到这一点。


    +   3.最终科学家们发现蚂蚁下颌底部和肛门尖端是信号源，并用质谱仪分析出化学物质成分为烷烃和萜类混合物，科学家们把这种信息素叫做费尔蒙。古代人没有质谱仪，所以也无法知道化学物质是什么。


