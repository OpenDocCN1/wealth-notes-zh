    > “我真觉得要流泪了，一个不懂得科学知识的人给他自己，给他的家人带来了多大的痛苦，他还不自知。我也读了许多心理学方面的书，我无法解释像我们父辈这些人为什么不相信科学与亲人的劝解，如此顽固的相信巫术、偏方与伪科学。


