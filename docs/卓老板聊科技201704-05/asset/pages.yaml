  md: '# 问答：脱发怎么办？


    卓老板，我最近脱发特别严重，有什么方法可以治疗脱发吗？


    卓克

    面对脱发坦然一点，如果一定要治，就用有效的药物，平时注意健康饮食，不要盲目相信商家宣传。


    脱发怎么办？


    有不少听众问治疗脱发和白头发的问题，我们先说说脱发要不要治。


    脱发是男性共有的特征，统计规律是这样的，35岁时大约66%的男人都存在程度不一的脱发，50岁时85%的男人严重脱发。一个半以上的人都有个现象，要不要治疗？这就很是问题了。


    如果你存在脱发，最好用平常心看待，这就好像有人问，年龄增加需不需要治疗一样。不过要究其原因，还是因为新生的头发不如掉落的头发多，为什么会这样呢？因为一些头皮的毛囊渐渐丧失功能了。为什么毛囊会丧失功能呢？因为雄性激素有一种叫做二氢睾酮，它和雄性激素受体结合后会产生毛囊萎缩的效果。那为什么脱发都是在头顶呢？就是因为二氢睾酮在头顶分布最多，所以那里的毛囊萎缩最严重，头发会越来越细，最后细到肉眼都不可见了，就不再长头发了。


    其实二氢睾酮在人体还有一个地方分布多，就是前列腺，凡是这里和受体大量结合，就会导致前列腺肥大，所以最早治疗脱发的药物本来是打算研发用来治疗前列腺的。


    如果秃顶了怎么办呢？


    曾经我们说过，只有两种药是效果可靠的，通过了FDA（美国食药监局）认证，外敷的叫做米诺地尔。其实它也是治疗高血压的，不过治疗高血压是吃下去的，治疗脱发是外敷的。它之所以可以治疗高血压就是因为可以促进血管扩张，扩张的同时也对头部毛囊附近供血提供了更好的条件，所以头发会长出来一些。这个药在临床上的有效率大约是50%，还有一个内服的药叫非那雄胺，非那雄胺的有效率超过85%，不过临床试验中一部分人反映非那雄胺影响功能，当然，这只是对少部分人，大多数人没有这个副作用。这两种药都是安全有效的。


    如果真想缓解脱发，就用它们，而且是边吃边起效的，停了药就还会回到从前的秃顶状态。除了这两种药以外，其它的，尤其是国内厂商推出的生发、防脱发产品，如果是涂抹的，90%是加了米诺地尔，如果是吃的90%是加了非那雄胺，但他们很可能不标注出来，而且价格比这两种正式药物贵很多。虽然有效但是伤钱。


    还有另外10%号称可以治疗脱发的，用一些精血不足需要补肾的理论给人吃何首乌，有不少要治疗脱发和白发的人信了这个。其实何首乌根本没有效果，还含有蒽醌类毒素，对肝有伤害，所以这部分人就属于伤钱又伤身了。


    原则上我建议秃顶的人坦然接受这个现状，在我看来这并不是什么病，我自己也是从25岁以后开始秃顶的，现状头顶已经可以看到肉了，这没有什么不好的，如果你爱看动物节目会发现黑猩猩群的头领大都是已经秃顶的家伙，人类社会里掌握权力和财富的人也有很多是秃顶的，这是一种成熟的标志。


    另外还有听众问白头发是怎么回事，头发之所以黑是因为它含有黑色素，所以当人体不再合成黑色素的时候头发就会白。现代医学证明在有些特殊情况下，即使人还很年轻，黑色素分泌也会停止，比如精神高度紧张的时候，还有免疫系统出问题的时候，黑色素细胞之所以罢工，是因为酪氨酸合成少的原因。哪些食物里有酪氨酸呢？一般肉类和鸡蛋里就很充足了，只要不是严重挑食，是不会因为酪氨酸摄入不足导致白发的。


    头发的生长速度一天大约半毫米，所以一个月能长出1.5-2毫米的长度，如果身体真的不再合成黑色素了，也是要经过2个月才会出现满头白发的情况，这不会一蹴而就，如果年纪轻轻，几个月就满头白发了，这时候更重要的问题不是治疗白发，他肯定遇到了更严重的问题需要解决。


    市场上销售的洗发水对治疗白发没有什么用，洗发水最大的作用也就是对头发的清洁，头发自从长出来以后就没有活的细胞了，所以根本谈不上滋养头发。


    所以最终总结一下，坦然面对脱发，如果一定要治，就用有效的药物，平时注意健康饮食，不盲目相信商家宣传。


