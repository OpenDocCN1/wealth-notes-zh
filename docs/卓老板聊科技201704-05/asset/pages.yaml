  md: '# 问答：如何挑选显示器？


    图片里卓老板的显示器好奇怪，为什么那么扁？


    # 卓克


    当你工作量大的时候，你就能清楚体会到注意力是一种宝贵资源，你用掉了一块就少一块。选个好的显示屏能节省很多注意力。


    如何挑选显示器？ ↓


    咱们节目是去年5月27日上线的，这也进入今年5月份了，所以一年的相伴就要结束了。上个月康康发了一篇文章，是一个征文的活动，就是想收集大家听节目一年的感受，已经发信的我已经找康康要来看了，跟我做节目一样，都是有感而发。


    有位听众看的细致，问我那个显示器好像很奇怪，为什么那么扁？我突然觉得这是一个好话题，因为选对显示器对提高写稿效率的作用很大。那我就分享给大家，咱们一起提高一下效率。


    # Ⅰ 显示器的长宽比


    显示器之所以扁就是因为它的长宽比是21:9，而普通的显示器是16:9或者16:10的，甚至还有4:3的。拉长之后，对有一类工作效率提高非常有帮助，就是需要左右对照才能完成的工作，不用切换窗口了，因为切换窗口后注意力还要重新寻找刚才的断点，所以不光是切换动作浪费时间，重新定位也浪费时间，而且重新定位还浪费注意力资源。


    当你工作量大的时候，你是能清楚体会到注意力是一种宝贵资源的，你用掉了一块就少一块。可能一天中清晰的时间只有10块注意力，那么在来回***去切换的过程中，以我的工作量，我觉得至少浪费掉我十分之一的注意力。


    你看到的只有我左手边的一个显示屏，其实现在我右手边还有一个显示器也是21:9的，左边这个是29英寸的，右边那个是34英寸的。而且右边那个分辨率更高，还是个曲面屏，这每个特性都有它发挥优势的地方。


    # Ⅰ 显示器的像素


    第一个是34英寸，你至少有可能把内容放得更大观看了，但这是需要特别设置一下的，一般在每个软件里有不同的快捷键，一般是ctrl加号就是放大。虽然34英寸比29英寸的尺寸大，但默认分辨率下，同样一个字在34英寸显示器里的尺寸更小，就是因为34英寸显示器里的像素点有500万，29英寸显示器里的像素点只有276万。


    也是因为这个因素，我不推荐小尺寸的高分辨率的屏幕，比如笔记本就是这样，很多14寸的屏，配了1920×1080的屏幕，这算一下，207万像素缩在那么小的屏幕里，字儿都小的可怜，看着非常累。


    有一个指标可以衡量最终显示出来的字儿的大小，叫做像素的点距，也就是两个相邻像素的间距，凡是超过0.26mm的，效果都显大，这个值很少超过0.30mm，超过的显示器基本都不属于最近5年的规格了，或者是不是桌面领域应用的。


    但这个值也很少低于0.20mm，低于这个值的使用起来字非常小，所以看着费劲，但现在很多笔记本屏幕都低于这个，它们是做过调整的，就是把桌面图标、菜单字体放大，你在看网页和用word时也都放大，实际可能一个屏幕里显示的总内容也不多，只不过每个显示出来的东西都更细腻了，因为你用更多的像素描绘一个物体了嘛。


    但真的原封不动，一点也不放大，0.20mm点距以下的显示器只会让人工作效率更低。所以很多人听说，4K显示器来了，很想试试，结果两千块钱出头买回去一个4K的，这么买回去的基本都后悔了。对于4K分辨率的显示器来说，至少要有32英寸，当然40英寸就更好了。


    # Ⅰ 曲面显示器


    下面再说曲面屏，简单说就是面向我的方向，显示器有一个向内凹的弧度，这个弧度有大有小，但通常没有变态大的，所以不会感觉到任何变形，但这个弧度就又增加了工作效率，原因就是节省了我的注意力，从前显示器太长了，比如长度超过71cm，我的眼神要从左侧的文档切换到右侧文档，我脖子得跟着转。但是我自从换了这个曲面屏以后，长度基本没变，但我脖子就基本没再转过了。眼神稍微一侧就能从左切换到右，效率提高的多不说，切换起来再也不累了。


    这种感觉是非常明显的，你可别小看这种注意力的花销，用得好的话，感觉就好像所有需要用的信息都摆在你眼前刚刚好的位置，找起来再也不费劲了。所以尤其对21:9这种看上去的超宽比例，如果用曲面屏，显示出来的内容虽然还是超宽的，但是感觉并不宽，和16:9的差不多。


    # Ⅰ 显示器的刷新率


    另外一个显示器的新特性叫做144hz刷新率。我们知道，屏幕里的图像活动起来是顺畅的，是因为每秒钟显示的画面超过了30幅，电脑显示器还会设置得更高，每秒60幅，其实现在已经超过了人眼平均的视觉残留时间，所以长久以来就没突破，但后来电子游戏竞技兴起了，逐渐成了主流娱乐，甚至是体育赛事，所以追求极限成绩的需求就都出来了，刷新率高得显示器可以表现的细节就更多，一些微小操作，比如瞄准啊，就更精确。有打守望先锋的人，从普通显示器换成144hz以后，命中率直接提升15%。


    当然，这是游戏，我相信咱们很多人不玩游戏，但即便不玩，在办公使用中也能感到流畅度变好了，鼠标的移动，文档的拖动，窗口的缩放、拉动，原来的感觉是骑自行车走在
    گیری道上，换了144hz刷新率后的显示器就感觉骑在了柏油路上了。这虽然不一定提高效率，但好心情是一定的。


    # Ⅰ 总结


    总结一下呢，推荐超宽比21:9的屏幕，但一定要留意像素点距，不要低于0.2mm，推荐选择曲面屏和144Hz刷新率。但同时也要提前预警，因为你一旦换了这个档次的显示器，就不太可能回到从前了，对办公设备就开始挑剔了，说不定家里的和单位的显示器都会换掉。好了，这个小技巧就说这么多。对了，大家别忘了写征文，一年的收获都有什么。


