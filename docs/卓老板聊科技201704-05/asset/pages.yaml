  md: '# No.6 好好认识你的胃 | 2016-09-23


    1994年世界主流医学界已经接受了胃炎、胃溃疡是幽门螺杆菌感染导致的，所以杀灭幽门螺杆菌成了治疗胃病的主要方法。马歇尔和沃伦也在2005年因为这些研究获得了诺贝尔奖。


    但是，经过后面的研究发现幽门螺杆菌越多，胃酸反流出现的情况就越低，这样就会降低食道癌和肺腺癌的发生率。


    现在，我们对幽门螺杆菌的研究更加深入，它在漫长的历史年代一直与脊椎动物一起生存，但是动物并没有进化出清除它们的机制，因为它们在胃中对免疫调控起了作用，它就像一把尺子，衡量什么时候免疫应该启动，什么时候不该启动。


    # No.7 问答：初春的禽流感有多危险？ | 2017-02-20


    禽流感病毒可以感染鸟类的体细胞，鸟感染H7N9后的症状不是很严重，大都不影响正常生活，但是对人类就不一样了。


    # No.8 问答：如何挑选空气净化器？ | 2017-01-11


    空气净化器的结构是类似的，滤网配风扇，然后用一套外壳把它们罩起来，一个口吸风，一个口出风。


    净化器使用的滤网是HEPA网，这是高效空气过滤网的缩写，有不同的等级，市面上销售的低端净化器大都用的是H9和H10，七八千块钱的用的至少是H12的，还有H13的。这些在净化器的参数介绍中都能找到，想要好效果就买等级高的，当然，一定也会贵，而且滤网是要定期更换的，所以后期维护的价格也高一些。


    # No.9 过敏与过敏药 | 2017-03-28


    哮喘和荨麻疹是不明物质刺激了肥大细胞，释放了组织胺，导致血管壁通透性增加，组织液外溢，皮肤、粘膜隆起，隆起发生在气管上就是哮喘，隆起发生在皮肤上就是严重的瘙痒，鼻粘膜隆起就是过敏性鼻炎。如果发生在脑部血管，就是组织液外溢刺激到硬脑膜上的神经造成偏头疼。一些过敏体质的人容易头疼就是这个道理。


