    科学思想起源于毕达哥拉斯，他在2000多年前，就开始运用逻辑来分析世界，他不相信纯思辨的东西。中国在百家争鸣时期也出现过研究逻辑的思想家，但是后来被统治者封杀了，可能是因为逻辑学能够直接挑战“君权神授”的统治体系。

    为什么科学在西方可以，而在中国就要被封杀呢？这可能与东西方的“语言”有关。

    西方由于是许多小国分裂的状态，互相之间语言不通，为了交流方便，各国只好约定俗成用音标（字母）当做文字。而字母的组合，是有其内部逻辑性的，前缀后缀都有特定的含义，语法和句式也有逻辑自治性。

    并且由于字母与音标形态相似，所以只要会说话的人就能大概地看懂一些书籍，因此国王和教会想要施行愚民政策来加强统治力度的成本就比较高。

    中国由于秦汉大一统的局面，赢政统一了文字（小篆），于是人们就一直沿用了脱胎于甲骨文的象形文字。通过学习《老浦识字》可以知道，许多汉字就是运用比喻、类比、甚至主观预测等原理而造出来的，毫无逻辑可言。

    而且汉字的识字门槛比字母高很多，于是政府就可以通过愚民政策来加强统治，底层民众也更容易被洗脑成为“忠君爱国”的奴隶。

    科学思想诞生在西方，以至于西医这样的科学医学也诞生在那里，因为科学相信数学逻辑，因此它愿意不断地接纳新的研究成果，并勇于颠覆既有的科学理论。

    而在东方，因为没有一套追求逻辑严谨的学科，所以医学一直以来都被看作“艺术”来看待，思辨成了“东方医学”的主色调。一旦严格追问它内部的逻辑问题，它便溃不成军。

