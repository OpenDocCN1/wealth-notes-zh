  md: '# 讨论：阴阳五行该写入科学素养准则吗？


    ![](img/a92bee8d59e1575a5654154f04fd8f76_22_0.png)


    阴阳五行该写入科学素养准则吗...


    最近在中科院搞的一次辩论，题目叫《阴阳五行该不该写入公民科学素质基准》，听众·科学有故事·提问，要我也说说这件事。


    我先介绍一下背景，这是2016年4月18日，科技部印发的《中国公民科学素质基准》，里面第九个基准点，要求公民知道“阴阳五行”、“天人合一”、“格物致知”等中国传统哲学思想观念，这是中国古代补素的唯物论和整体系统的方法论，并具有现实意义。


    其实这个准则已经提出快一年了，当时也有很多科学家反对，但因为3月20多号中科院人文学院的孙小淳教授和中科院高能物理所的张双南研究员就这个话题辩论了一场，所以算重燃战火。


    我的观点是反对把这些内容写进基准里，关键一点在那条基准的后半句，“阴阳五行等理论，具有现实意义。”所以尽管推的细则还没有出来，一旦出来，这半句，具有现实意义就会把戏唱歪。


    当时孙小淳在辩论时的理由是，其他国家列写公民科学素养的时候可以介绍性地说，为什么要写亚里士多德的元素说，怎么我们就不能说。这点辩论里张双南已经明确说过，因为科学是从人家那一支长出来的，那是现代科学出现的源头。就像你要介绍CPU发展史，虽然当年仙童出的芯片在结构上，技术上，算力上远近不如现在的CPU，但不好意思，INTEL和AMD都是那里的离职后创业才诞生的，是绕不过去的。但这时突然有个非洲人冒出来，说我们在1920年时还用过给绳子打结的方法做过计算，或者某个人说我们用算珠做过计算，这也是处理器的雏形，要写进CPU的发展史，那就有点攀亲攀太远了。


    另外一点是阴阳五行如果一定要写进科学素养准则，我觉得只能往这个方向写：他是一个古代人对世界真理的思考，但因为条件有限，所以思考出来的东西对当今现实只有历史研究的意义，是文化领域的一种非科学的东西。


    但实际上科技部是要按照对现实有指导意义的这个角度去写，所以我相信，编写公民科学素养条目的 \({ }^{1}\)人是缺少科学素养的。


    上周末熊逸答复万维刚的那篇文章里也正好提到了阴阳五行，《黄帝内经》发现中国的地势西北高，东南低，所以这一高一低就分出了阴阳，西北高所以西北方向的天就有所不足，于是西北为阴，东南照这个理论就是阳。然后继续对应在人身上，就认为右耳不如左耳灵，右眼不如左眼明亮，而左侧的手脚不如右侧强，这一条倒是反过来了。原因是，古人认为，东方为阳，所谓阳，精气上升，结果就是上明下虚，耳朵眼睛在上面，但手脚在相对靠下的位置，所以耳目是左边更强，到了手脚却是左边更弱。


    然后会继续延伸到对� PMS 的理解上，说，如果生活在西北的人和东南的人同时受到邪气的侵犯，表现在身体上，就会是左右的严重程度不一样。熊逸老师给的评价很好，这套医术真的不适合其他国家，除非那里也是西高东低的地势。这就是一个很典型的从阴阳五行演绎出庞杂的，比原理论内容丰富得多的过程。但因为每一步都没有现实上的证实，所以结论也是荒谬的。


    想了解熊逸老师是怎么讲《黄帝内经》的吗？

    点击下面图片，可试读《2.7丨熊逸答万维钢：国学的三个问题》


    ![](img/a92bee8d59e1575a5654154f04fd8f76_22_1.png)


    我们古代有相当多这样的例子，比如辩论中就提到屠呦呦获诺贝尔奖，说这个就是受到了中医的启发获得的成就，而中医就是讲究阴阳五行。可是诺贝尔奖委员会在接受记者采访的时候专门说过，我们不是把奖颁给传统医学，而是颁给了创造出新药的研究者。因为屠呦呦当年是从600多种药里挨个试，几千人帮忙，最终过了N年才碰到青蒿素，只有一个貌似有点用，但还要改进方法才行。另外600多种全都是无效的，往腋窝里夹热鸡蛋，抱着公鸡对太阳大喊，吃蜘蛛这些，都是通过阴阳五行理论得到的治病防疫的方法，而且医术里也都宣称这些有效。


    当然不止咱们国家，除了文艺复兴以后的欧洲，其他地区也都出现过各种掺杂着迷信、巫术、宗教的思想内容，如果把阴阳五行写进去，其他非科学内容也可以要求写进去，这准则就是一锅大杂烩。比如现在就有很多研究哲学的，研究社会科学的人要把自己学科领域内容往里加，认为编写基准的指导思想就是以马克思恩格斯创立的辩证唯物主义为指导，为什么要把他们排除在外，这明显违背了马克思主义。而凡是在中国的人文学科，大都跟马克思主义有关联。然后我们发现这是一项持续到2049年的大计划，之后也一定会在后续编写中要求入席。因为这套准则并不由科学家撰写，而是特别由那些专门搞贴标签活动的负责编写，所以很可能最终成为一个人文学科划分势力范围的工具。


