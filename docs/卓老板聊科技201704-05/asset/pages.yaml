    作家史铁生在《我与地坛》里说，我们每个人谁也不知道自己这一辈子是怎么开始的，人生好像一场梦，自己忽然之间就闯了进来。

    我们最古老的祖先，那些最初的复制子，它们也不知道自己为什么忽然间就有了意识，忽然就知道趋利避害了。

    组成这些复制子的分子，它们起初也只能进行特定的化学反应，但当它们啮合成复制子时，就开始“有意”地联合起来维系这个复制子的存在。

