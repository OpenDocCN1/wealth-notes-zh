  md: '# 问答：得不得癌症是靠运气吗？


    最近有一种说法是66%的癌症可能就是随机发生的，运气不好的结果，是这样吗？


    卓克

    这个说法来自《科学》上的一篇论文，但要怎么看待它，还需要另外的解释。


    得不得癌症是靠运气吗？


    听众Dolphin问，听说最近有一种说法是66%的癌症是基因的随机突变造成的，就是运气不好的结果，是这样吗？


    这个问题我看在“知识新闻”里前几天也更新了，我先介绍一下背景，这是三月二十几号《科学》期刊上刊登的一篇论文，结论说的是引发癌症的突变里有66%是随机突变导致的，29%是环境因素导致的，5%是遗传导致的。


    其实这要从2015年《科学》杂志上同一个作者的这方面研究说起，他当年被刊登的那篇论文也是要说明这个结论，但是搜集的数据，使用模型不如2017年的好，当年文章发布后曾经引起圈内热议，有很多反对声音，然后他经过改进，主要是数据量加大了很多，从69个国家的疾病控制机构拿到了数据，涵盖了48亿人，癌症涵盖了32种。所以这篇证据更强了。


    《科学》那是顶级期刊，能发表的文章都可以算得上是研究水平过硬的。这两位研究者一位是数学家，一位是癌症遗传学家，最早做这方面研究是源于这类事件，比如统计中发现人的一生结肠癌发病率4.82%，而十二指肠癌一生的发病率只有0.2%，如果环境和遗传因素是癌症发病的主要原因，那我肠道经历的消化液、食物环境是类似的啊，基因也是一样的,为为什么会造成数量及上的差异呢？


    咱们在细胞系列节目里也说过，癌症在细胞有丝分裂频繁的地方更高发，而干细胞的分裂就是很频繁的。所以最初他们就从研究结肠和十二指肠中的干细胞入手的。2015年1月份发的文章，他们那时只用了全美的数据，这次几乎覆盖了全球2/3的人口了，而且统计完之后和2年前那次结论依然大致吻合，所以结论被加强了。


    你说这怎么还有数学家啊？因为整个统计设计数据量非常庞大，每种癌症的发病因素又有很大差异，要想让结果可靠，就由这位数学家建立了一套比较复杂的统计模型。


    但这篇文章的隐患就是，一旦被媒体知道了，公众知道了，就会解读成反正三分之二都是运气，我干嘛还谨言慎行啊，我还是吃喝嫖赌吧，张学良不是一辈子抽烟喝酒吸毒，还是活到100岁嘛。就连文章作者也专门说到了这个问题，他们说如果多个驱动突变才能致癌，那么就算前面几个突变都是因为细胞分裂产生的随机突变造成的，只要最后一个关键突变是环境因素造成的，我们也不能说这个癌症是由运气差，因为最后造成癌症的突变其实是可控的，可预防的。


    咱们在上一个细胞系列的节目里最后提到了癌症，最终能形成恶性肿瘤可不是一个突变给予足够时间就可以的，因为它们往往被修复的机制干掉，或者被免疫系统干掉，而且肯定不是一次突变就能成为恶性肿瘤的，至少需要突变出十几种能力才行，比如生出可以忽略抑制细胞停止分裂的信号，再生出可以自行补上端粒的功能，再生出溶穿血管壁的功能，等等，等。等。


    这里每个条件都相当于文章里说的突变的发生，需要叠加十几个因素在一起才能最终变成癌症。三分之二的致癌突变来自于干细胞的随机突变，这句话不等于三分之二的癌症病例是随机突变造成的。所以媒体那么解读是错误的。


    但是这些研究对科研人员是有意义的，它至少提示了科学家要重视随机错误对癌症发生的研究，因为从前的观念是偏向另一侧的，就是癌症主要由环境因素和遗传因素导致。现在在码提醒了人们，你们是不是太低估了随机错误的影响呢？虽然文章发布在了《科学》上，但仍然属于新结论，需要后续的同行验证，也许今后会扭转癌症的研究方向，到时候进行普遍的早期癌症筛查可能就比现在更重要了。


    另外这是一个庞大的平均值，必然一些突变更受随机突变，另外一些更受环境影响，哪些更受环境影响才突变呢，很不幸，抽烟导致的肺癌，喝酒导致的肝癌，胡吃海塞导致的结肠癌，不注意防护导致的皮肤癌都是更受环境因素影响的癌症。所以真要是因为看了一句话标题就开始胡来的话，运气不会太好的。


