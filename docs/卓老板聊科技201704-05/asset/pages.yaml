    动物也能搞艺术吗？


    # 本期知识清单↓


    ——1•——


    # 动物在共情上也有表现


    +   1. 实验室的黑猩猩在小时候就知道利用障碍物遮挡自己取食，还知道去拿饲养员目光不及位置的水果吃。

    2. 恒河猴可以仔细观察饲养员的眼神，即使饲养员脖子扭向另一侧，但只要眼神还落在食物上，恒河猴就不会去取。

    3. 野外的黑猩猩会利用人类的煤油桶，通过敲击，恐吓其他群体成员，它知道其他黑猩猩听到这种声音后的心理状态，并持续通过在人类居所旁找新鲜东西吓唬自己的同伴树立威信，成为群体首领。

    4. 狗虽然不如黑猩猩那么接近人的DNA，但它们至少从1.5万年前就被人驯化，所以更加适应和人类一起的生活。狗是几万年前比较没有性的、容易屈服的狼，它们可以读懂人类的情绪，在人看不到它时，它会停止乞食。


    ——2•——


    # 合作的特点


    +   1. 人类可以合作，从某角度说人类自我驯化的结果。在进化过程中，我们淘汰了攻击性过高的个体，淘汰了专横跋扈的个体，可以跟人类用情绪、模仿、换位思考的生物都和人类形成了合作。

    2. 罗辑思维公司的一个底线就是不能撕破脸，这也体现了现代社会合作的底线，如果这点做不到，是没法在激烈竞争的公司中生存的。属于不合格特征。


    ——3•——


    # 艺术是一种关于地位的心理学


    +   1. 史蒂芬·平克说艺术是一种关于地位的心理学，如果抛开这点去讨论艺术的概念就容易得到一团糟糕的结果。

    2. 艺术是上层社会用来炫耀的，消费的，是他们的一种奢华。但因为人类社会的财富总有进展，从前上层社会享受的奢华总会被罗马大众模仿，上层社会这时就不能把这些东西当作一种可以炫耀的东西，他们只好再去找其他没法被模仿的东西。

    3. 一旦时尚、建筑、音乐被大众接受，它们就不再只属于精英阶层，所以这些东西就不再被精英们认为是A级艺术品。所以什么是艺术，它的定义总在变化。


    ——4•——


    # 艺术是一种关于美学的心理学


    +   1. 柏拉图就认为美是独立于观察者的，一个东西如果它是美的，那它永远都是美的。这样的观点已经站不住脚了，美存在于观众眼中，美是一种判断，这才是主流。

    2. 艺术作品是一种外界刺激，刺激转化成情绪的过程非常短暂，短暂到无法意识到，情绪又影响着感受，所以对作品的初步感受是无意识中产生的。

    3. 但人类又可以通过重新评估的过程对情绪再加工，这之后的感受有可能和初步加工的结果完全不同，很多当代艺术作品都需要这样的加工能力。加工过程越顺畅，之后评价的感受越正向。加工过程是否顺畅取决于之前受到的训练和熏陶。

    4. 能做这样的加工需要刻意的艺术教育，需要一定的美学素养，在人们为一幅看上去平平无奇的画出价100万的时候，关于美学的心理学和关于地位的心理学就同时展现出来了。


    ![](img/a92bee8d59e1575a5654154f04fd8f76_86_0.png)


    ![](img/a92bee8d59e1575a5654154f04fd8f76_86_1.png)


    ![](img/a92bee8d59e1575a5654154f04fd8f76_86_2.png)


    ——5•——


    # 黑猩猩的类艺术


    +   1. 岗贝国家公园的黑猩猩曾经在飘泼大雨中狂舞；还曾经在第一次见到瀑布之后，先兴奋，后惕惕的驻足观望很久，好像它们真的受到了自然之美的感召。

    2. 作画的黑猩猩可以全神贯注到忘却食物和玩伴，它们享受作画的过程，但却对画完的作品毫无反应，也会对画笔有偏好，作画时有先后顺序。

    3. 卷尾猴、寒鸦和乌鸦在实验中展现出，更偏爱有规律、有对称的图形，高等动物对图形最基础样式的偏好，是具备生物学基础的。


    # 本期音频金句↓


