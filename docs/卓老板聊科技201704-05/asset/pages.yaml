  md: '# 专题 | 5个知识点，弄懂减肥这件事儿


    # No.1 身体质量指数BMI


    1997年世界卫生组织提出了一个判断肥胖的标准，衡量 的参数叫做身体质量指数，body mass index，简称BMI，这个指数是体重除以身高的平方，体重单位公斤，身高单位米。


    世界卫生组织还给了两条标准线，第一条叫超重线，超过BMI超25就算超重；第二条线叫肥胖症线，超过30就算肥胖症。


    这个指数其实挺粗糙的，比如它对亚洲人来说就过于宽松了。所以对待亚洲人，两道线的指标要调整一下，一个从25降到24，一个从30降到28。


    说它粗糙，还因为它只适合测试成年人。小孩子和老年人，还有职业运动员都不符合，这些人要不就是身体指标在剧烈变化，要不就是肌肉含量超高，体重明显 况。


    # No.2 增重和减重的核心因素


    每天把减肥挂在嘴边的人，其实对减肥的理解有很多误区。首先我们要了解增重和减重的核心因素。


    增重的就一个，就是我们吃进肚的食物，但吃下的食物不一定全都变成能量，有很多还没来得及吸收就排出体外了，影响吸收效率的因素非常多，甚至我们肠道内的细菌都起了重要的作用。


    再看消耗的部分，最大的误区来自于很多人认为稍微体育锻炼可以消耗大量热量，消耗掉大量脂肪。其实不是，正常人，就是那些身体情况和运动量均值差不多的人，他们在此基础上增加运动量，比如每天通过运动燃烧450千卡的热量，坚持一个月，而且在这一一个月里饮食习惯不能改变，坚持下来后，这些热量核算成1.5公斤脂肪燃烧。


    每天要耗费450千卡的热量相当于什么概念呢？也就是商业楼宇的30层爬两个来回。一个 人，平常生活的好好的，现在突然让他每天从1层爬30层，来回两趟后他不会食欲大开吗？吃得更多，甚至有时候比运动量增加的还多。所以增加运动量对减肥的人来说，是意志和体能的双重考验，对一般的人效果不会很明显。


    其实我们一天消耗的总能量里有60%以上属于基础代谢。什么叫基础代谢呢，比如我们是恒温动物，维持体温恒定就是耗能最大的项目，还要维持血液循环，维持细胞内各种物质合成，虽然这些活动都进入不了我们的意识，它们的功耗也不高，但因为24小时一刻不停，所以耗能总量超过人体一天的60%。如果把有意识的运动，和不得不做的运动，比如上下班路上、走路、站立，敲键盘、思考这些都算在一起，只占一天耗能的20%-30%。还有一部分叫做消化耗能，就是分解食物需要的能耗。


    # No.3 减肥手术


    这里的手术减肥不是抽脂这类美容手术。


    比如最极端的减少摄入的手术，把胃做一个旁路手术，让胃的前部和小肠的后部连在一起，食物没经过消化和吸收就排出了。或者把胃切除一部分，容积小了，一吃就饱。通常这种方法要求BMI指数在40以上的人才可以批准做。


    # No.4 减肥激素


    激素减肥，只对先天激素分泌不足的人有效。


    除了手术减肥效果明显，还有利用激素减肥的，这种激素叫瘦素。


    瘦素一经发现就被美国的安进公司买下专利，开发减肥药。而药物上市需要得到FDA（美国食品药品管理局）的审批，这款减肥药从1994年开始申报。


    到了1997年第一期临床试验结束，能通过FDA审核的药都 要经过3期临床实验。按顺序，第一期要做的并不是疗效如何，而是安不安全，能不能给人用。而且初期的效果看，瘦素对健康的普通人，也有明显的减轻体重的效果。这让很多安进的大股东欣喜若狂。


    但2年后不好的消息传来了，在二期临床实验中发现瘦素开始是有效的，但后期减重的效果马上消失了，反弹明显，而且对肥胖造成的并发症，比如糖尿病、脂肪肝、动脉硬化、高血压都没有任何改善。安进不甘心，反复实验，希望能找到突破口，但是经过了又7年的努力，还是毫无进展，最终在2006年把瘦素的专利低价出售了。


    # No.5 减肥药


    这里说的减肥药，不是减肥保健品，比如减肥茶、减肥胶囊……


    想靠吃药减肥，还没有副作用，太难了，这关系到基本的生命活动。到现在为止，还没有被下架的非处方减肥药是奥利司他。


    在很多欧洲国家，这也是唯一一款非处方的减肥药，它的作用原理是减少肠道对脂肪的吸收。本质上是把你吃的油腻的东西中的油直接排出去，这一排，就难免超级尴尬，所以有人为了避免尴尬，吃
    饭时就特别注意少吃油脂。其实也就养成了一种饮食的好习惯。


    现在真正能做到排油的，就是这种药。其他什么秘方排油，那都是忽悠。'
