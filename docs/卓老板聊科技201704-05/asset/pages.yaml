  md: '# 辟谣：石油竟不是地下生物尸体变的？


    卓老板你好，今天在网上看到一篇叫做《石油竟不是地下生物变的》的文章，文中说：“生物变油”只是上世纪美国地质学家哈伯特提出的一个假设，是没有科学支撑的，而基于利益集团的利益牵扯，这种观点横行全球……而苏联科学家则发现：石油源于地壳深处的以太物质，在高压冷喷下进入地壳浅层地带，而且油田是可以自我修复的。我是觉得这观点不靠谱：1.
    文中的新观点没有进行可信的推论；2. 引用的材料没有注明出处，难以查证；3. “以太物质”，倒是是个啥也没有进行明确解释；4. 又是将故事置于“利益集团”“美苏冷战”这样的框架下，看着就不像真的。但是又不知道如何科学的反驳，请卓老板科普一下。


    # 卓克


    春节期间我们总结过谣言的特征，只看标题就能识别90%的谣言了，凡是出现了类似惊天大骗局之类的，直接当谣言就行。


    石油竟不是地下生物尸体变… ↓


    听众老耿最近看了一篇文章《石油竟不是埋在地下的生物变成的》，想让我帮忙看看是不是对的。


    文章里说，古生物变成石油是上世纪美国地质学家提出的一个假设，没有科学支撑，而且是石油利益集团勾结，苏联科学家就发现了不同的证据，证明石油源于地壳深处的太初物质，在高压冷喷下进入地壳浅层，油田是可以自我修复的。


    老耿觉得不可靠，因为他觉得证据不足，也没有注明出处，还专门提及了利益集团阴谋论。其实你这差不多就识别出来了。而且我搜了这篇文章，标题前半段是：三百年惊天大骗局。后面才是石油竟不是埋在地下生物变成的。


    咱们春节期间做的辟谣的系列节目就总结过谣言的特征，只看标题就能识别90%的谣言了，凡是出现了类似惊天大骗局之类的，直接当谣言就行。


    其实石油究竟是怎么形成的，科学界主流观点还是由生物形成的，但也有非主流观点。


    主流观点支持石油是海洋动植物、微生物的尸体和海底污泥混合，然后被埋在沉积岩下面，经过高温高压逐渐转化成石油的，因为它们最终的密度比较小，所以在地质活动中会往上飘，飘到一个适合聚集石油的地层就聚集起来形成油田，大约是四千米深处聚集最多。


    那个非主流观点就是文章里的观点，他们认为地壳中已经有很多碳的化合物存在了，主要就是碳氢化合物，石油里的生物标志物是因为那些生物本来就生活在那个区域，结果突然涌来了石油导致的。这种非主流观点没法解释为什么世界上99%以上的石油都存储在沉积岩中，也没法解释石油中广泛存在的生物标记物，比如甾烷、伽马蜡烷、植烷、藿烷、萜类和同位素偏轻等现象。


    像这篇文章里说的，不少干枯的油井丢弃过了一段时间后又可以产油了，就是因为石油是非生物资源生成的，在石油工程中也有详细的解释，那是因为油井压力回复的正常现象。这些内容大概就是这篇谣言文章的来源了，他拎了一个非主流的观点作为主要依据，然后再添加一些大国矛盾，利益冲突的故事就撇出一篇惊世骇俗的内容，主要还是为了吸引眼球。


    这个例子提示了我们，相信主流科学观点的重要性，任何单个科学家或者几个科学家的观点都不如主流科学观点可靠。比如现在连中学生都认可的，艾滋病是由HIV病毒感染导致的，这个观点在1980几年时就是主流观点，但当时加州大学伯克利校区的一位病毒学家就认为HIV并不是艾滋病的病因，你想，伯克利分校，这就够知名了吧，反对者还是病毒学家，这又是本门学科，还是教授，那他说了，艾滋病不是HIV导致的，他认为感染艾滋病是因为人存在易感体质导致的，如果你不是易感体质，你即使每天跟不同的艾滋病人耍耍啪啪也不会得病。


    我们普通人该信谁？还是得相信当时的主流科学观点，因为这是更多多数科学家认同的，这里有更多著名的大学，更多病毒学教授的支持。也许某天那个小众观点真的有机会翻身成为主流科学观点，但需要它提出足够硬的证据，其他科学家也会逐渐把兴趣转向那个角度的研究。


    但总的来说，小众观点成为主流总是很小概率的事件，我们相信大概率事件就可以。不过当年这位伯克利的病毒学家的主张有一个非洲国家采纳了，于是全国艾滋病继续肆虐。这类问题其实挺多的，比如说现在中国反对转基因的团体里，没有一个人是分子生物学专业的，大都是人文学者、社会活动家、主持人，拉来的最贴边的是一个农业经济学的人，这些人别说反对主流观点了，就算是写出非主流观点，有声望的学术期刊，比如SCI列表里的那些，都不会刊发。


    所以媒体如何对待非主流科学观点也可以算作是一个试金石，可以试出这家媒体的编辑和记者有没有基本的科学素养。


