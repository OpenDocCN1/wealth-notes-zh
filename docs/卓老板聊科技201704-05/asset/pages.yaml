  md: '# 认识人类的语言和手势


    本期你将听到↓


    认识人类的语言和手势 ↓


    # 本期知识清单↓


    ——♦ 1 ♦——


    # 回顾人类特征的进化


    1.1500万年前猩猩出现了，1000万年前大猩猩分化出来，500万年前黑猩猩分化出来。


    2.500万年前非洲一部分地区变得很干旱，于是有一部分黑猩猩走出热带森林，它们在后面的变化非常大，出现的种类也非常多，但绝大多数都灭绝了，只剩下人类这一支。而没出走的黑猩猩、大猩猩因为不需要被迫适应环境，所以样子和几百万年前差不多。


    3.人类脚趾只有朝一个方向，腿才能更直，才能长时间直立行走。会厌软骨下移，人才能说话，但这也增加了窒息的风险。人类大拇指的活动范围远超黑猩猩。人类的头盖骨要到30岁才能完全愈合，婴儿出生时大脑只发育了23%。


    ——♦ 2 ♦——


    # 可复现的可测量的认知实验才是科学发展方向


    1.黑猩猩可以认识到别的个体在观察它，如果有比它级别更高的个体在旁边，它是不会在有高级个体在场的时候把食物找出来的。


    2.黑猩猩和3岁以下的小孩一样，并不能意识到人类行为中犯的错误，而超过5岁的儿童是可以识别的，到底脑部产生了怎样的变化才导致了这样的认知差距呢？


    3.会说话的大猩猩Koko掌握了2000个英语单词，可以表达很复杂的内容，甚至有想象力。但这个进行了几十年的语言实验广受质疑，原因是，只有潘妮帕特森可以解释Koko表达的是什么，这没法验证。


    4.质疑也涉及其他猩猩的语言实验，用图形按钮和实物对应，训练黑猩猩在要表达这些物品时，按下对应按钮，最早参加实验的是一只母黑猩猩玛塔塔，但是经过2年学习，它好像没学会什么，也正因为在训练时它在养育儿子坎奇，这只坎奇却通过从小的耳濡目染学会了用图形按钮表达语言的技能。


    5.从可验证的实验，人们可以确认，黑猩猩可以记住几百个单词，也可以识别单词顺序导致语义的变化，但无法掌握介词、连词、时态。


    6.这一系列实验虽然在改进，但测试的本质还是动物掌握人类语言的能力，而不是掌握它们母语的能力。测试它们物种的母语能力需要更高的实验设计水平。


    ——♦ 3 ♦——


    # 语言的认知进化


    1.人类的语言中枢在左脑，黑猩猩的大脑结构和人类也是高度相似的，黑猩猩也具备一定的语言能力，也是左脑控制的，所以和人类一样，在说话时都用右手打手势，尽管黑猩猩大部分是左撇子。


    2.对于语言的产生有一个假说，那就是个体在观察其他个体行为时，神经的激活模式和自己做出这种行为时神经活跃的模式是高度相似的。说话和打手势有非常密切的关系，手势就是语言产生的雏形。


    3.聋人观看手语的时候，布洛卡区和威尔尼克区一样会活跃起来，但聋人在阅读的时候这两个区域并不活跃。黑猩猩在打手势的时候，这两个区域也在高度活跃。


    4.除了说话与打手势，其他动作的施者和受者也都有高度的神经活动吻合，这种结论后来发展成一种理论，叫做镜像神经元理论。这就是语言出现的动力。


    5.镜像神经元理论还伴随着动作抑制的机制，否则每个个体都会模仿头领的行为，但在身体比较放松的时候，有时候抑制机制会减弱，这时候模仿行为就产生了，有时甚至是跨物种的模仿。


    ——♦ 4 ♦——


    # 意大利人的手势


    1.不：先用右手比划出一个数字8来，就是用手比划出一个手枪的样子，然后左右旋转手腕子，这就代表“不/No”。


    2.美女：握拳伸出一个大拇指，然后大拇指贴在脸颊，上下搔动几下。


    3.小心：伸食指往下抠一下下眼睑。


    4.无奈：5个手指尖并在一起然后前后摇动，想表达 cực其无奈，就双手一起做这个动作。


    ——♦ 5 ♦——


    # 从解读语言信号到解读情绪信号


    1.像叫声源于喉咙，之后视觉也会被定位在其他个体的头部区域，那些可以感受对方是否在看着自己的个体<|start|>会得到更多对生存相关的信息，所以会慢慢进化出识别对面生物个体眼睛的能力来。


    2.总是时不时的看看对方，又不做出攻击，往往意味着对对方有很大兴趣，于是目光短暂的来回接触即使在动物世界中也是示好的意思，逗猫可以用这个方法。


    3.除了眼神之外，还有嘴。浑身覆盖满毛发的动物，一旦把嘴唇外翻，露出洁白的牙齿和粉红的牙龈，这个区域就真成了全身最显眼的地方。所以嘴部动作就成了表情的重要组成部分。


    # 本期音频金句↓


    咱们脚的大拇指不再跟另外四只脚趾垂直了，而都是朝向一个方向，也就是因为这样，我们才能长时间地直立行走。还有会厌软骨下移，脖子变长了，这种变化让我们可以发出更多的音调。但是这种变化也有一些风险，比如说饭吃喝水的时候容易被呛到，造成窒息。但是这跟可以用语言交流获得的生存优势比起来，被呛到窒息而死的劣势就小得多了。


    眼睛总是时不时地看看对方，又不做出攻击，往往意味着对对方有很大兴趣，目光短暂的来回接触即使在动物世界中也是示好的意思。如果你家里的猫对你一直爱答不理，你可以试试，在它看你的时候，你看它一眼，眨眨眼睛，然后马上撇开眼神，过几秒钟再扭头看它，你会发现它会回望你，你再眨它眨眨眼，然后再把目光避开，也许当你再扭头要看它时，它已经走到你旁边，用尾巴蹭你的腿了。


