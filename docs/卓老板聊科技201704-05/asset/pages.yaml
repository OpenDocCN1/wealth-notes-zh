    如果这样，那么生命的意识，本质上是这个生命体内的各种化学物质，维系现有平衡状态的宏观表现。（胖人减肥难，就是因为胖人要打破的，是一整套的化学平衡，他们是在和亿万年的自然本能对抗。）

    综上，生命的意识，跟化学物质的各种反应在本质上是一回事。生命没有什么特殊和高贵的，仅仅是茫茫宇宙中的一种比较复杂的，维系特定状态的组织结构罢了。

