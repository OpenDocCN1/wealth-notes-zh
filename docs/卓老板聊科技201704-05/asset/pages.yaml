  md: '# “毕业季”选文 | 科学是最好的声音


    本文来自1917小组成员-韩雪。


    也不记得是什么时候开始爱上这个声音的，也不知道是什么时候开始对一个爱骑摩托车的年轻人产生兴趣的。


    很可能是无意间听到“新能源车能不能买？”这期节目。刚好正在纠结要不要买个混动的汽车开开，听到从这样一个朴实的角度侃侃而谈的声音，感觉又真实又有趣。


    感谢「得到」，让我认识了这样一个有趣的人。


    一年的时间，让我又更加了解这个有趣的人。


    卓老板其人，以严谨的治学态度动人，何其怪异的问题，“力的传播速度”、“火是什么”等等，都能从学科属性、历史溯源、演化结论等各个方面严谨的给出解释，有理有据。这是让人津津乐道的一点，大家都感慨，一个年轻人，可以如此深入的了解方方面面的科学知识，然后总结成普通人能听懂接受的语言和文字做科普，很牛。


    「得到」上的专栏订阅一年，他讲了一些科学知识，也补充了上学时候物化生理论背后的历史，那些有趣的人和故事让我特别愿意再深入的了解一点相关的知识；


    他辟了一些谣，这恐怕是我转发最多的内容，因为他查阅了大量的资料，本着严谨求实SIGMA的态度得出的结论，我认为十分可信，有很大的欲望分享给关心的人；


    他关注了一些时事，我很爱边看着新闻边听他说朱诺进入了木星轨道，也很爱边逛着淘宝边听他说驱蚊液到底有没有毒性；


    他出品的内容引发了一些争议，关于转基因食物到底能不能吃，至今仍有微博的各种公知大V争论不休；


    关于中医中药是不是科学的，能不能继续指导现代生活更是不用说，中医粉质疑不休，甚至被“河蟹”的……


    可是，我对卓老板感兴趣，可不是把他当作成人版的故事机，我看透他是一个内心柔软的文艺男青年。很可能卓克本人不喜欢这个称呼，他一直在科普的其实是科学的思维方式，是科学素养的提升。


    # 但我喜欢他文艺男青年的人设。


    在一期问答节目“我们节目为什么不做的有感情些”中，他说科学是最大程度剥离了情绪影响的文化。但能回答听众的这个问题，本身就是一种反差萌。他在不断的强调科学精神的时候，也没有忘记人文关怀，愿意回答听众的各种各样怪异的问题。


    # 科学虽然高冷，但卓老板让它变得有点动人。


    我在得到订阅了7个专栏，但是每天最期待的就是出现卓老板的更新图标，每次别的专栏文章中出现卓老板三个字都觉得莫名兴奋和荣耀，就像自己的远方表哥得了什么大奖能萌庇众人一样。悄悄的说，因为卓老板在得到，我甚至忍受了「得到」初级版本那恼人的体验感。


    卓老板呢，是每天晚上陪伴我入眠的男人。今年年初，我怀孕了，孕期没有呕吐反应，就是睡眠不好。好在我有卓老板的音频，每天，真的是每天，都是他的声音陪伴我安眠，好多内容我都能背过了。虽然我不懂痴情，但陪伴我度过难熬的孕早期，这份恩情，还是永记在心。


    当然，卓老板也不是完美的，在「得到」的学习小组里，我也看到过一些疑问，和我一开始听卓老板的感觉一模一样。他们也觉得卓老板讲的有些东西有科学素养的门槛，有时候一些概念没有解释清楚，有时候一些结论没有给出。


    现在我也有自己的应对方法。卓老板聊科技是要配合谷歌或者百度共同“服用”的。真正动手去查资料，理解门槛下面的那些基础的科学内容，也是科学思维方式的一种表现形式。当然，我们还要共同督促卓老板，作为一个科普达人，要把浩瀚的科学世界拎出一些线头来，织成普通人世界的文字图案，这是一门很难的学问。


    # 所以难题交给卓老板，我们负责相信他。


    好吧，一年的陪伴虽然马上结束了，但还有下一年。想通了这一点，我居然不焦虑了。感谢卓老板，同时感谢可爱的康康一年的辛勤付出。并不伤感的期待新的一季，期待最美的科学的声音。


