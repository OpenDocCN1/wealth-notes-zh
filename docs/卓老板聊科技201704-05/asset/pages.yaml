    # 问答：加速度是什么？


    ![](img/a92bee8d59e1575a5654154f04fd8f76_9_1.png)


    把关于伽利略的谣语和后面月球自由落体实验，讲给身边的一个人，他反问我，耻笑到，所以你知道什么是加速度吗？我不知道他在嘲笑什么，卓老板可以解释一下吗？是有什
    么我没理解的科学常识吗？


    ![](img/a92bee8d59e1575a5654154f04fd8f76_9_2.png)


    # 卓克


    当你知道了什么是加速度后，你就知道了我们所认识的世界是别人给我们描述出来的，说不定以后还会有别的描述方式。


    加速度是什么？


    听众Rosa Han说，她把咱么专栏早期的一期节目分享给身边的一个人，是关于伽利略并没有在比萨斜塔上做过落体实验，而是登月时有宇航员在月亮上做过自由落体实验的故事。但不知道是什么原因，那人听了以后耻笑的说这都是初中知识，并且反问，你知道什么是加速度吗？Rosa
    Han觉得很不爽，想再问问，什么是加速度，是不是有什么没有理解的常识？


    挑这个问题回答的原因主要不是因为这个奇怪的人的耻笑，而是这确实有必要一提，那就是加速度是客观存在的吗？


    如果各位能意识到这是个问题，也许对如何看待世界就有了新一层的了解。直接给结论呢，加速度是牛顿理论体系中对物体在时空中运动时的一个属性的描述，是牛顿发明了加速度这个概念。


    你听着可能感觉很奇怪，物体运动速度的变化值，这怎么是牛顿发明的呢？牛顿出生之前也一样存在这个概念啊。 是的，但是牛顿把它用数学语言描述出来了，并且体系化、理论化了。所以如果谁要是深究加速度，就相当于要先默认大框架，那就是牛顿力学体系描述的那个世界。


    在这个世界中，加速度被定义成dv/dt，这是数学定义，用语言描述大家肯定都会，我就不重复了。但是其实，物理为什么在所有学科中力量最大啊，就是因为有数学做描述工具，而不是用自然语言，自然语言在描述物理时是一个非常低效的工具。


    然后我们再从根上倒一下，就是《原理》这本书是怎么给牛顿的全部思想画边界的，如果大家买过或者看过，可以翻开看，前几十页都是定义，比如我这本书里提到的物质的量是什么，先来个定义，然后下面举一些特定的例子。再定义，运动的量是什么，再给几个典型例子，然后就是力是什么，也配有例子。八个定义之后，紧接着就是解释，就是提醒人们，我这本书里出现的时间、空间、地点，这类词汇读者们虽然都很熟悉，也都经常用，但在
    tentando... 等等


    给你们解释这么一大套的目的是为了告诉读者，这不是你们自然语言里的那些含义。这本书里讨论的时间是均匀流动的，不随外界任何影响变化的，空间也是这样。现在咱们管这个叫绝对时空观。大多数应试教育的人第一次看到《原理》都会觉得意外，这跟我们上课学的牛顿完全不一样啊，是的，因为这本书全名叫《自然哲学的数学原理》。哲学在那个年代是高大上的，这本书名字的含义就是，我要用数学语言描述大自然，说大一点，就是描述整个世界的规律。你要以这样的心态去理解就能明白他为什么前面花好几十页去做每个名词的定义，用尽全力解释清楚。


    历史上，想用一个理论描述整个世界规律的事儿，可不止牛顿干过，亚里士多德也干过，基督教也干过，但也许没有这么全面，当我们横跨几千年看历史时就知道，这些都是肩膀头齐的理论框架，只不过基督教那个框架实在不符合现实，亚里士多德那个只有少部分符合现实，而牛顿这个直到提出之后300多年还挺准，算得上一个优秀的理论框架。


    但这个理论中的内容也仍然只是现实的近似，而不是现实本身。而且随着观察设备和精度的改进，牛顿的框架已经在更加微细的部分和更加庞大的尺度下出现了明显的误差。所以说到这了，你说加速度是什么呢？它是牛顿理论体系中的一个参数，并且用数学严格定义了。


    在《原理》出版后100年，加速度在其他的理论框架中已经变化了，比如在广义相对论中，弱等效原理说的就是对观测者来说不能在局部区分是加速度产生的力，还是引力产生的力。后来又出现了强等效原理，就不止是这两种情况下产生的力不可区分了，是一切物理效应都不可区分。在这个理论体系中惯性系虽然还有加速度这个名词，但它的概念用数学表达出来已经和牛顿定律的dv/dt不同了，它变成了一个四维的矢量，一个大家没见过的定义了。这些就需要更多基础知识铺垫了。听完我说的，大概对我们描述的世界有了新的认识了吧。


