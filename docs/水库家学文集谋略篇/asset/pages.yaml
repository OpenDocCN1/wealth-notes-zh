- pgno: 273
  md: '疯狂的官吏顿时原形毕露：“皆叩头，叩头且破，额血流地，色如死灰。”历时久长、以神的名义而官、寇勾结所设的骗局，就这样结束了。封建时代讲究天授人权统治阶级信奉神是政治的需要；西门豹信不信神不得而知，但他显然具有“民为贵”的意识，他用实践戳穿骗局实在智慧过人。


    这个故事值得回味。真与假本来是水火不容。一些凭常识就能判定的骗局能否存续，一是要看常识是否为社会所尊崇，更要紧的是有人能够从事情的表象中，揭穿其损人丧德的本质；二是社会是否具备包括法制、科学精神在内的运行机制；三是在本质危害清晰，法制健全可依靠，科学精神普及的基础上，还要看执政者的屁股坐向哪边，是助纣为虐还是惩恶扬善？理论的力量是不可蔑视的，邺地之民久受其苦而无人初始就从理论上论证河伯娶妇的荒谬性，这一点我们不必苛求于古人。历史是由人创造的，人类的历史便是不断推翻神权、解放自我的历史。相信，今人应该比古人做得更好。而做不好的主客观原因，明眼人一看便知。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '西门豹把为民谋利作为第一要务，这无疑是正确的执政理念，也不难发现在他没来之前强烈的兴利意识中却忽视了为民除弊。诸如贫民百姓安全国家财物受到威胁侵害；猫鼠同穴黑恶势力横行一方；挖空心思巧立名目的肥己收费；实权到手公器私用的暗箱操作；讨好卖乖投怀送抱的鄙俗行为；哄上瞒下欺世盗名的“大王”作风；走南闯北跑东跳西的虚幻浮燥；惠卖爷田一掷千金的豪华消费；凡此种种，不胜枚举。


    也就是说在兴利之前和之中各种弊病端倪已显，为了照顾方方面面的利益，或者害怕影响一个时期的工作目标的实现心存余悸，甚或为了保护既得利益和地方声誉而投鼠忌器曾几何时，一些地方出现了利寡而弊出，利多而弊众。物质财富充裕了，百姓的精神生活却未改善；官府的兴利投入多了，官员在百姓心目中的威信却没有自己估计的那样高；机构层次升了人员编制增加了会议也开了，工作还是马甩串豆腐一提不起来。


    这种尴尬的局面，倒是常常让人产生疑惑，究其原因 是执政者没有处理好兴利与除弊的关系。除弊是一个'
