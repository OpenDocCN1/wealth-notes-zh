    将他烹了。何直说： 有家奴捆绑出卖主人的，以后都比照这 种办法入理。 类似的， 宋太祖赵匡胤刚被拥戴为皇帝之 时，陈桥的守门人拒绝让他进入，没办法只好转道封邱门。
