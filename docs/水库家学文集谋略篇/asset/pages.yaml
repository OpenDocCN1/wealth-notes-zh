  md: '荣景象。然而，他没能做到。在灭掉孙吴实现国家统一后，司马炎渐渐骄傲自满起来。歌舞升平，感觉良好的心态下，以前制定的五大政策，也开始松动起来，到最后形同虚设。


    同所有骄奢淫逸，挥霍无度的皇帝老儿一样，他狂热地爱美女，爱金钱，生活奢靡的可谓一塌糊涂。史料记载，司马炎“诏选孙皓妓妾五千人入宫”，致使后宫美女佳丽太多，晚上都不知道该去何处就寝临幸了，于是就坐上羊拉的车子，车停在哪里就在那个嫔妃处就寝，结果引来了一段著名的“羊车望幸”的典故。


    好榜样产生正能量，坏榜样就有坏结果。有了司马炎这个老大做表率，整个社会奢靡之风刮的就掌控不住，且四处蔓延了。高官千崇，后房百数，大将苟晞，奴婢将近千人，侍妾数十，终日累夜不出户庭。开国元老之一的何曾，更猛，他吃一顿饭，要花去一万元，他的儿子何劭，也是“食必尽四方珍异，一日之供以钱二万为限”。司马炎有个女婿王济，更生猛。《世说新语》记述，此人竟拿人乳喂猪以使猪肉更为鲜美。一次，司马炎'
