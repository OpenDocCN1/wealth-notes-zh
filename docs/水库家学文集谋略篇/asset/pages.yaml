  md: '请求辞职含有被迫原因， 还可以从他后来被朱元璋剥夺俸禄一事加以佐证。


    公元1373年，胡淮庸当上了丞相，他对刘伯温曾经在明太祖面前不同意自己担任丞相一事，怀恨在心， 故诬陷刘伯温在故里谋占有王气之地为自己墓地，图谋不轨。朱元璋因疑心极至，
    遂于第二年下旨剥夺了刘伯温的俸禄。刘伯温被逼忍气吞声说明莫情， 不想在京积忧成疾， 公元1375年3月他至病不起， 被送回乡里，一月后逝世。


    如果刘伯温在朱元璋登基称帝的前夕， 不待封官列侯即隐退故里或山中寺院， 恐怕也不至于后来遭到剥夺俸禄的冤屈。由此看来， 政治斗争中的急流勇退宜早不宜迟， 否则，
    虽辞职也难保全终身。


    # 知进退，得善终


    中国自古以来就多有战乱，而有战争就少不了名将。比如兵仙韩信、兵圣孙武、保家卫国的卫青、霍去病、狄青、岳飞、戚继光等等。'
