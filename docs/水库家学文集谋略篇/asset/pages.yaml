  md: '悖入帐，裹诘夜间口令。操随口曰： “鸡肋！鸡肋！”


    悖传令众官，都称 “鸡肋”。


    行军主簿杨修，见传 “鸡肋”二字，便教随行军士，各收拾行装，准备归程。有人报知夏侯悖，


    悖大惊，遂


    请杨修至帐中问曰：“公何收拾行装？”


    修曰：“以今夜号令，便知魏王不日将退兵归也：鸡肋者，食之无肉，弃之有味。今进不能胜，退恐人笑，在此无益，不如早归，来日魏王必班师矣。故先收拾行装，免得临时慌乱。”


    夏侯悖曰：“公莫知魏王肺腑也。”


    遂亦收拾行装。于是秦中诸将，无不准备归计。


    当夜曹操心乱，不能稳睡，遂手提钢斧，绕寨私行。


    只见夏侯悖秦内军士，各准备行装。操大惊，急回帐召悖问其故。悖曰：“主将杨德祖先知大王欲归之意。”


    操唤杨修问之，修以鸡肋之意对。操大怒曰：“汝怎敢造言乱我军心！”喝刀斧手推出斩之，将首级号令于辕门外。


    原来杨修为人恃才放旷，数犯曹操之忌；操尝造花'
