- pgno: 270
  md: '敢再提起为河伯娶媳妇的事了。


    西门豹接着就征发老百姓开挖了十二条渠道，把漳河水引来灌溉农田，田地都得到灌溉，在那时，老百姓开渠稍微感到有些厌烦劳累，就不太愿意。


    西门豹说： “老百姓可以和他们共同成为成功而快乐，可以和 他们一起考虑事情的开始。现在父老子弟虽然认为因我而受害受苦，但 可以预期百年以后父老子孙会想起我今天说过的话。”
    直到现在邺县都能 得到水的便利，老百姓因此而家给户足，生活富裕。十二条河渠横穿御道，到汉朝建立时，地方官吏认为十二条河渠上的桥梁截断了御道，彼此相距又很近，不行。


    想要合并渠水，水渠将至驰道时，把三条渠道合在一起，架一座桥梁。邺地的百姓不肯听从地方官吏的意见，认为那些渠道是经西门先生规划开凿的，贤良长官的 法度规范是不能更改的。地方长官终于听取了大家的意见，放弃了并渠计
    划。所以西门豹做邺县令，名闻天下，恩德流传后世，没有断绝停止的时候，难道能说他不是贤大夫吗？'
