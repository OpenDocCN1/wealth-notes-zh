- pgno: 181
  md: '问他为什么迟到。 李园回答说： “齐王派人来娶我的妹妹，我和使者喝酒，结果耽误了回来的时间。“春申说：“送过聘礼了吗？”李园说：“还没有”春申君说：“可以让我见一下令妹吗？”李园说：“可以的”于是李园就把妹妹献给了春申君，得到春申君的宠爱。当李园知道妹妹有了身孕，就和妹妹商量了一个计谋。


    李园妹妹向春申君说： “君王宠信你，就连兄弟也不过如此。现在你当楚国相国已经 20 多年，可是楚王还没有儿子。等到楚王死后，必然拥立兄弟为王。楚国王位更换，必然重用自己的亲人，您又怎么能长久得到宠信呢？不仅如此，您出任相国的时间又长，难免对大王兄弟有许多失礼得罪之处。将来大王兄弟如果能登上王位，您定会身受大祸，又怎能保全相国和江东的封地呢？现在臣妾已经知道自己怀有身孕，旁人却谁也不知道。臣妾受你的宠爱还不算久，假如能凭你的高贵身份而把臣妾献给楚王，那楚王必然会宠爱臣妾，万一臣妾能得上天保佑生个儿子，那岂不是你的儿子作了楚王，到那时楚国的所有不尽在你的掌握之中吗，这和面对着'
  merge: -1
  img_proc: true
- pgno: 182
  md: '不可猜测的罪过相比，哪一个更好呢？“春申君认为这话 很对，就把李园的妹妹迁到一个秘密的地方，并向楚王说 进献李园妹妹。楚王把李园妹妹召来后就非常喜欢她。
    后来果然生了一个男孩，而且被立为太子。


    # 人性分析：


    如果没有春申君，历史上根本不会有李园的记载。但 这个人一定是个不简单的人，事前肯走谋划很久，能把 春申君拉下水，自己上位。


    李园借助别人（其妹妹、春申君、楚考烈王、楚幽 王）的力量从一个白丁当上了国舅。这棵大树上开的花， 好多好大好利用啊……可怜的是春申君临死不悟，他所犯 的逻辑错误就是模式化谬误。


    模式化谬误是一种在推理或论辩中误把某一模式当 作关于某类对象整体的准确概括而加以运用所引起的谬 误。所谓模式，是指人们用来对人群、对象和事件加以 归类的某些普遍性的信念，不过这些信念往往表现为某
    种概括性的命题，并非必然总是真的。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '春申君根据李园在门下的表现，却认为李园是“软弱”和“知恩图报”的人，这就是把李园的为人模式化了。人有两面性，如同正义和邪恶，真实与虚伪，克制与放纵，爱和恨一样地存在于一个躯体内，就像一架天平的两边，总是在动态的过程中追求一种心理上的平衡和社会的认同。如果只看到某人的一个侧面就盖棺论定，且又听不得旁边人的规劝，那么必然会被另一个侧面所蒙蔽。


    李园事前事后所作所为，可谓机关算尽，反映出了他的人品：当面是人，背后是鬼；既有“恭维”，又有“杀机”。春申君就是犯了模式化谬误的一个错误，以至于俞归黄泉都没有思考的余地，死得不明不白。


    李园的手段固然狡猎险恶，但春申君之死，却有咎由自取的地方。考其致命错误有三。


    +   一是“不识时务”。楚王一去世，迫切追逐权力的李园，势必抢先夺权，杀掉春申君。站在李园的角度，这样做既能剪除异己实力，又能达到杀人灭口、掩盖利用妹妹争夺权力的无耻行径，此为“时务”之一。继位'
  merge: -1
  img_proc: true
- pgno: 184
  md: '的新君实际上是春申君的儿子， 春申君可以利用这点大做文章， 揭穿李园以巩固自己的权位，并且可以先发制人除掉李园， 此为“时务” 之二。他的门人朱英就充分认识到了这两点。但春申君错误地估计了形势，没有清醒的洞察局势，
    也就意识不到即将到来的凶险。


    二是识人不明。 李园安排其妹嫁给春申君，待怀孕后再嫁楚王， 将 自己妹妹的幸福作为自己进身的阶梯和工具，只有利益和野心，少有血肉亲情 。春申君对这样不择手段的人认识不清，对其罪恶本性估计不足，缺乏识人的犀利眼光，反而认为李园是软弱无能之人，对自己很好。


    三是听不进不同意见，春申君的门人朱英有智慧，对形势洞若观火，对利害得失了然于心，有谋略，为春申君出谋划策， 找到了解决问题的方法——先发制人，除掉李园，将权力掌握在自己手里有。
    没勇气愿意自己涉险入宫中除掉李园！但春申君对朱英的建议竟然充耳不闻，既不采取措施进攻， 也不想办法自保。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '游走于权力场上人，过 的是刀尖舔血的生活。如果没有过人的谋略智慧，又不能识人用人，是很容易陷入绝境的。


    李园依狡幸，凭妹上青云。堪叹春申拙，善人终掘坟。


    # 野心生野马，一拊既悬崖


    原文：


    宋昭公出 亡，至于鄙，喟然 叹曰：“吾知所以亡矣。吾朝臣足人，发政 举事，无不曰：‘ 吾君圣者！''侍御数百人，被服 以立，无 不曰：‘ 吾君丽者！''内外不闻吾过，是
    以至此！'' 由末君观之，人君 之所以离国家失社稷者，谄 謏者众也。故末昭公亡而能悟，卒得反国。（节选自 《新序 》）


    译文：


    宋昭公国亡后出逃， 到达了邻国， 感慨说道：“我知道亡国的原因了。


    我朝做官的千百人，施政做事，没有一个不说：“我们君主圣明”！ 侍从妃子数百人，披着衣服站立，没有一个不说：“我们君王长得英俊！” 朝内朝外都听不到说我的过错，因
    此到了这个地步！” （ 在末君看来），'
  merge: -1
  img_proc: true
- pgno: 186
  md: '做君王的之所以离开国家失掉社稷，是因为说谄媚话的人太多。


    所以宋昭公逃出了国家后能够醒悟，最后得以返回国家。


    # 人性分析：


    世人大多喜听美言，故谀术无穷，海路难塞。古往今来，莫不如此。


    美言本身无可厚非，爱美之心人皆有之。赞美一个人的品行容貌，颂扬一个人的政绩功德，言者意衷，闻者仿效，嘉言懿行，实乃社会文明进步之标志。


    然而，在我国漫长的发展史上，在茫茫的人海中，总有那么一些人巧舌如簧，言过其实，处繁而不知变通，遇险而百无一能。像赵国大将赵奢之子赵括，熟读兵书，自以为天下无敌。后被赵王任命为大将，结果40万大军兵败长平，自己也被秦兵乱箭射死。像唐昭宗时的国子博士朱朴，自夸“得为宰相，月余可致太平”，任用后的结果却是“朴为人鄙迂僻，无他长”。


    更有一些人美言祸心。像唐玄宗时的宰相李林甫，口蜜腹剑，靠谄媚青云直上，直至宰相，为蔽塞玄宗的视听，达到独断专行之目的，专门召谏官曰：“君不见立仗马乎？食三品料，一鸣辄斥去，悔之何及！”从此谏路断。'
  merge: -1
  img_proc: true
- pgno: 187
  md: '像春秋时期的宋昭公，被逐出国时，方悟自己在位期间虽臣僚上于，但由于左右终日美言赞惜，以致听不到自己的过失。


    在现实生活中，这些美言祸心之人并未绝迹。所不同的是，随着社会的发展，他们的策略更高明，伪装得更严密，行动更隐蔽。这些人巧言令色，曲身钻营，采用卑劣手段找靠山，骗荣誉，拉选票，排异己；一朝大权在握，便瞒上欺下，拉帮结派，疯狂侵吞国家财产。


    美言可恶是因为讨好别人的话虽甜蜜、巧妙，却害人，甜言蜜语，似“久旱逢甘露”，如“他乡遇故知”，使听者不能自持，在不知不觉中飘飘然、忘乎所以起来，什么法律，早已抛之脑后。一顶顶保护伞就此打开，为别有用心者遮风挡雨。


    美言勿信，尤其不可偏听偏信。“偏听生奸邪，独任成祸乱”。应当广开言路，不以言举人，也不以人废言。要听得进谏言。


    《省心录》中说“谗言巧，佞言甘，忠言，信言寡”。直言虽苦口苦喉，却是醒世之良药，“能受善言，如市人求利，寸积铢累，自成富翁”。美言勿信需要正本清源，贪如火，遏之之法惟益抽薪。只要调节控制好私欲，固守“俸金以外都是赃”之古训，那么，任凭口吐珠玑，亦不为所动。美言勿信重要的是不听。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '《醉古堂》中说，听到诽谤就发怒的人是诬陷他人的诱子，被别人奉承就高兴的人是产生奸佞的媒介，惑之则乱， 信之则危。如果身为领导者而不善于识别， 让这样的人混进重要部门，
    骗得要职，危害就不远了。


    《帝范》中说， 夫倭佞之徒， 国之蠹贼也，争荣华于旦夕， 竞势利于市朝。 以其谄谀之姿， 恶忠贤之在己上； 奸邪之志， 恐富贵之不如先。朋党相持， 无深而不入；
    比周相习， 无高而不升。令色巧言， 以亲于上； 先意承旨， 以悦于君。朝有于臣， 昭公去国而方悟；弓无九石， 宣王终身而不知。 翻译过来是， 只会花言巧语的人，
    乃是一个国家的蠹贼，祸乱之根。


    这些人唯朝夕贪荣显华， 奔竞财利于市， 争夺权势于朝， 无心效力邦国。


    这些人以奸巧的嘴脸，憎恶忠良贤能之人处于自己之上； 怀其奸诈的心志， 唯恐富贵被别人占了先。


    这些人为了私利而勾结同类， 极其所嗜欲， 虽至深之所， 亦无不入； 为了营私而交相因习， 穷其所好乐， 虽至高之地， 亦无不进。


    这些人采用动听的语言， 使用谄谀之态， 取悦至上； 顺其入主之意， 迎其入主之趣， 取悦于君。


    末昭公被逐出国，才知自己在位期间， 臣僚上于人， 由于左右献谀， 以至平时听不到自己的过失而至于此；'
  merge: -1
  img_proc: true
- pgno: 189
  md: '周宣王好强驰射，其实所用不过三石，由于左右奉迎，宣王悦其名而丧其实，而终身以为所射是九石。


    不亲近的人常进谗语言离间亲近的人，所以春秋时宋平公的太子痤为其师所谗害以至死；奸佞者往往耍手段残害正直人士，因而春秋时期楚昭王的左尹郰芜无故被费无极等人所谗害。


    这一切，都是暗弱不主之君和庸愚无察之君，荒迷惑乱，拒贤听谗所造成的，以至于忠者如郰苑、孝者如太子痤，终被诬征屠戮，实在是可叹可哀而冤枉的了。


    因此，这就有如栾生之芳兰，将欲茂盛之时，竟被凄然之秋风败落了；君主方欲明察，就被谗说的小人障蔽了耳目。这完全是奸邪、谄谀、谗佞的人所造成的危害。


    # 庙小妖风大，位卑权术重


    清朝时的太监李莲英因梳得一手好头，为慈禧太后所宠爱。和他同朝的有一李姓本家，掌管总理衙门的李鸿章。李鸿章不必说了，成立淮军，平定了太平军和燃煤军的大功臣。可这位大人却竟被李莲英这个小太监给收拾了。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '有一天，李莲英找到李鸿章对他说：老佛爷最近有意静养，想把清漪园修缮一番，以便颐养天年。但可惜内务府拿不出这笔银子，老佛爷很伤心。李伯爷是朝廷至臣，若能体仰上意筹款促成此事，必定宽慰太后和圣上之心，这可是不世之功啊。


    有这样的机会能巴结太后和皇上，李鸿章怎肯放过？马上就将这事情揽过来了，准备以办新式海军之名，责成各疆吏岁拨定款，从中提取部分作为造园经费。


    李莲英听了大喜，说：兴办新式海军，振兴国防，是谁也不会反对的堂而皇之的理由，谁敢不出钱？出师有名，筹款有式，那造园的经费还用愁吗？李伯爷真是有办法。


    在奉承一番之后，他又说：既然款子有着落了，就请李伯爷辛苦一趟，到园内察看一下，有哪里该拆该建，这样您心中有数，老佛爷要是查问起来，也好回话。


    李鸿章想想是这个道理，十分感谢李莲英帮了他一个大忙，给了他一个这么好的机会伺候老佛爷。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '后来李鸿章在一个小太监的引领下，把清漪园上上下下、里里外外、左左右右走了个遍，并记录下了哪里该修一座假山，哪里该建一个湖亭，这一路下来，整整逛了一天。


    李鸿章心里很高兴，就等老太后的召见，自己就可以开始新的功绩了。没想到满心欢喜的李鸿章没有等来太后的召见，却等来了光绪皇帝下诏申饬交部议处的处罚。所谓申饬，就是由皇帝、太后位卑，未必权不至或皇后派一名亲信太监，捧潼圣旨去指着某人的鼻子，当众数落臭骂一顿。


    而被骂的人，既不能申辩，也不能回骂，还要伏在地上谢恩，因为那骂人的太监代表着皇帝、皇太后或皇后。李鸿章挨骂的时候，知道自己上了李莲英的圈套。


    原来，李鸿章大功初得，春风得意，心高气傲，没有把李莲英这么一个伺候人的角色放在眼里，言语之间的不敌得罪了李莲英。李莲英也不是善茬，他当然要令李鸿章点颜色看看。所以他才假传慈禧太后要修园子。等李鸿章上钩到勘察园子之后，李莲英一天有意无意地'
  merge: -1
  img_proc: true
- pgno: 192
  md: '对光绪皇帝说：听说李中堂那天带着个小太监，在清漪园里足足逛了一天，山上水上玩得好不痛快！这光绪皇帝四岁进宫称帝，但从小就生活在慈禧太后的淫威之下，始终当老一个傀儡皇帝。受太后的气也就罢了，现在你李鸿章也敢欺负我，居然到我的御苑禁地大摇大摆地游玩，你也太不把我当回事了。所以才有了李鸿章的苦果子吃。


    一个给太后梳头的太监，他也只还是个太监，可就是这样一个卑微职位之人，居然整倒了堂堂伯爷，堂堂一品大员。李莲英靠的是什么？因为他能接近慈禧太后，及时了解官场动态。他们的职位虽然卑微，但却与权利中心无限接近。如果谁得罪了他们，说不定什么时候，小人物就会使出大杀记，而那些位高权至的大人物，连点抵抗的余地都没有。恐怕吃此一亏之后，李鸿章一定会明白：位卑，未必权不重的道理。


    李鸿章初登权位，还不明白官场的险恶，还能说得过去。但所谓无奸不商商人在这种事情上也未必就完全看得懂。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '乾隆皇帝八十大寿。普通家里老人八十大寿都是个 大事情，更何况还是乾隆皇帝的大寿。各方官员当然极 力收集奇珍异宝，准备给乾隆做寿礼。


    有个广东商人，拿着一个大柜来向两淮盐政使兜售。 这不是普通的柜子，而是西洋来的对象。柜中有房屋门 庭，门一开，有一样人出来，对客人拱拱手，能自己研 墨，取红笔书写万寿无疆四字，挂在壁后，然后拱手退
    出。两淮盐政使觉得新奇，十分喜欢，也知道乾隆皇帝 喜欢这类西洋之物就准备买下。


    商人开价五万两银子，两淮盐政使毫不犹豫地答应 了。


    买卖敲定了，商人当然高兴，没想到出门时，盐政 使的门丁向他索要五千两银子，商人当然不愿意，你一 个小小的门丁，狮子大张口居然想要买卖的十分之一。


    门丁说：如果你不给我，这东西明天就没人要了。商 人没理他，认为是吓唬自己。没想到，第二天商人到 盐政使府上准备交易时，盐政使居然真的说不要了。无 论商人再怎么推销，对方就是不肯要了，最后下了逐客'
  merge: -1
  img_proc: true
- pgno: 194
  md: '令， 煮熟的鸭子就这么飞了。


    谁把鸭子给放飞了？真的就是那个门丁。原来，门 丁索要银子不成，就 准备坏商人的事。


    当天他找机会散布言论说：这样人的东西虽然精巧， 但 毕竟都是机关控制的。 如果在运送途中有什么碰撞 损 坏，等进 呈皇上玩赏时， 如果脱落了最后一个字，或根
