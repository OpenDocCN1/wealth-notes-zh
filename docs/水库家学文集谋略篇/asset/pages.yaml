- pgno: 280
  md: '埋在江湖中, 那也无妨, 可以习文从艺, 吟诗作画, 仙游天地之间。只要能洁身自好, 也是得道善终的结局。古代许多知识分子仕途坎坷, 以此为计的也不乏其人。


    刘伯温为朱元璋平天下, 治天下, 立下了汗马功劳。在功成之后, 多次上书请求告老还乡, 其原因亦是主动与被动两种因素相撞促成的结果。洪武三年(1371年),
    朱元璋授予刘伯温弘文馆学士, 封开国翊运守正文臣、资善大夫、上护军、诚意伯。


    刘伯温为了免遭朝廷官场斗争的不测之祸, 随即上书明太祖, 要求辞仕过隐居生活。原因有二: 一是青少年立下的报国志得以实现, 位至开国功臣之列。二是他生就这豪爽刚正、嫉恶如仇的思想性格,
    在为朱元璋出谋划策时曾得罪过不少人, 像宰相李善长、胡惟庸等人, 就是对明太祖朱元璋, 他也常常直谏不讳。因此, 他想尽早从官场的旋涡中抽出身来, 激流勇退。


    洪武四年二月, 刘伯温回到浙江青田南田山(今浙江省文成县)故里, 在乡间每日读书吟诗, 饮酒弈棋, 谢绝同一切官府来往, 静心修养, 乐哉快哉。说刘伯温上书'
