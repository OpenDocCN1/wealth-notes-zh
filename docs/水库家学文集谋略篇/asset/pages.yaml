- pgno: 70
  md: '族聚集，不见得就能立住脚。去投靠孙吴，先不说人家会不会收留自己，就是孙吴自己也不见得能自保，投靠孙吴的意义并不大。


    因此，打无可打，退无可退，投降未尝不是当时的最佳选择。 确实投降之后蜀国即亡，但老百姓却能减少灾难，更何况蜀国本就逃不开灭亡的命运。 这话不是我说的，是诸葛亮说的，他在《后出师表》中，曾清醒地指出：然不伐贼，王业亦亡。唯坐而待亡，孰与伐之？除去魏、吴的咄咄相逼，蜀汉政权还面临老少少数民族的顽强抵抗以及四川土著势力的顽强抵抗。诸葛亮这样的超人都无力回天，所谓七出祁山也只是避免坐而待亡的权宜之策。


    在这样的环境下，刘禅的选择不见得是完全不可取的。刘禅宁愿背负骂名也要投降，乃全国为上之策。在国 家人民去留之际，刘禅更注室国人现实利益，并没有与 对方做无谓抵抗，虽然留下了于古骂名，却让蜀国人民
    免受战争之苦，这算不算舍小家为大家呢？再者蜀魏 之争，只能算是人民内部战争，又不是抵御外敌侵略，


    72'
