  md: '左右虎贲军护卫而行。忽报斜谷山上两边火起，伏兵赶来。曹兵人人惊恐。正是：依稀昔日潼关厄，仿佛当年赤壁危。


    # 翻译:


    曹操聚集兵队想要进兵，又被马超拒守，欲收兵回都，又怕被蜀兵耻笑，心中犹豫不决，正碰上厨师进鸡汤。曹操见碗中有鸡肋，因而有感于怀。正沉吟间，夏侯惇入帐，禀请夜间号令。曹操随口答道“鸡肋！鸡肋！”夏侯惇传令众官，都称“鸡肋！”


    军主簿杨修，见传“鸡肋”二字，便让随行士兵收拾行装，准备撤兵。有人报告给夏侯，夏侯惇大吃一惊，于是请杨修至帐中问道：“您为何收拾行装？”杨修说：“从今晚的号令来看，便可以知道魏王不久便要退兵回都。鸡肋，吃起来没有肉，丢了又可惜。如今进兵不能胜利，退兵让人耻笑，在这里没有益处，不如早日回去，来日魏王必然班师还朝。因此先行收拾行装，免得临到走时慌乱。”夏侯惇说：“先生真是明白魏王的心思啊！”然后也收拾行装。于是军营中的诸位将领，没有不准备'
