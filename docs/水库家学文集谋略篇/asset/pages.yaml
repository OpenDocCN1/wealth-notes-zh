  md: '魏斯（魏文侯）当诸侯王的时候，西门豹出任 邺（今河南安阳市北， 河北临漳县西）令。他到邺县，会集地方 上德高望至的人，问他们有关老百姓痛苦的事情。这些人说：“苦于给河伯娶媳妇，因为这个缘故，本地民穷财尽。”


    西门豹问这是怎么回事，这些人回答说：“邺县的三老、廷掾每年都要向老百姓征收赋税搜刮钱财，收取的这笔钱有几百万，他们只用其中的二三十万为河伯娶媳妇，而和祝巫一同分那剩余的钱拿回家去。


    到了为河伯娶媳妇的时候，女巫巡查看到小户人家的漂亮女子，便说“这女子合适作河伯的媳妇”。马上下聘礼娶去。给她洗澡洗头，给她做新的丝绸花衣，让她独自居住并沐浴斋戒；并为此在河边上给她做好供闲居斋戒用的房子，张挂起赤黄色和大红色的绸帐，这个女子就住在那里面，给她备办牛肉酒食。


    这样经过十几天，大家又一起装饰点缀好那个像嫁女儿一样的床铺枕席，让这个女子坐在上面，然后把它浮到河中。起初在水面上漂浮老，漂了几十里便沉没了。'
