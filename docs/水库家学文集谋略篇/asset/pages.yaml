- pgno: 68
  md: '为郭崇韬不收礼物，也许就会生出许多事情来。


    同样是钱财，其代表的可不仅仅是钱那么简单，还是那句话：钱财，未必直小利。


    人性分析：


    人为财死，可见，钱财具有很大的魔力，因财可以荣，因财也可以辱，甚至钱财还会左右人的生死。钱财，未必只是一点蝇头小利，它本身就是一篇大文章，生活中避免不了利益纠葛，面对利益，要还是不要，这是个问题。很多职场人，面对这个问题时都不知道该如何取舍。


    我该不该向领导提出加薪要求？公司最近发放给自己的奖金是否该与同事分享？同事请客送礼，收还是不收？


    其实这些问题都不能一概而论。从萧何的例子中，我们可以看出，他接受赏赐可能会死，他贪钱财地却为他换来了生。钱财本身并不是问题，因什么得财，所处的时机、面对的对象、钱财本身所代表的含义才是问题之关键。萧何的故事告诉我们：面对钱财时，首先认清其背后所代表的含义！


    经常有人批评拜物观念，似乎钱财是万恶之源。但王翦却在上阵之前，拼命地向秦始皇要赏赐，萧何为了买地甚至举债打白条，郭崇韬银多得便不完，却依然收受下


