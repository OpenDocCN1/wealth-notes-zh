- pgno: 233
  md: '你会立刻被一个光环所包围， 他们 会记得曾经对你的批评， 与你的争执， 心中 充满悔意和愧疚。


    他们是在失去一种永不再现的情形，但你不必等到死去的时候：暂时地彻底消失，让你在死前就制造出了一种类似死亡的情形。当你回来的时候，就像你死而复生一样——复活的气息缠绕在你周围，人们会因你的归来而松了一口气。


    # 牵其错，控其行


    正文:


    李林甫可以说是唐朝由强盛走向衰弱的一个关键人物，是一个不学无术的人。他什么事都不会，专学了一套奉承拍马的本领。'
  merge: -1
  img_proc: true
- pgno: 234
  md: '李林甫是长平肃王李叔良的曾孙，因此也是皇族出身。他的舅父姜皎为玄宗皇帝的秘书监，由于皇族的出身和舅父的喜爱，最初做了千牛直长。后不断升迁，做了国子监司业。李林甫并不满足，拿出自己善于巴结逢迎的本领，做了宰相。


    李林甫一当上宰相，第一件事就是要把唐玄宗和百官隔绝，不许大家在玄宗面前上奏，有一次，他把宦官召集起来，公开宣布说：“现在皇上圣明，做臣下的只要按皇上意旨办事，用不到大家七嘴八舌。你们没看到立仗马（一种在皇宫前做仪仗用的马）吗？他们吃的饲料相当于三品官的待遇，但是哪匹马要是叫了一声，就被拉出去不用，后悔也来不及了。”


    有一个谏官不听李林甫的话，上奏本给唐玄宗提建议。第二天，就接到命令，被降职到外地去做县令。大家知道这是李林甫的意思，以后谁也不敢向玄宗上奏本了。就这样，李林甫终于把持了朝政，为所欲为，权倾一时。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '李林甫为什么能够阻止群臣进谏，从而打破自己与群臣之间僵局的平衡？就是因为他把握住了百官都想自保的心理，所以就用“立仗马”做了个比喻，声称“但是哪一匹马要是叫了一声，就被拉出去不用。”同时又严惩了一个进谏的官员，借此威胁了群臣。那些大臣都受到了这样的威胁后，就变得老实起来。


    这就是“胁而迫之”的威力，利用对方的要害加以威胁，从而达到了自己的目的。在历史上，除了这一种“胁而迫之”之外，往往还有另一种方式，那就是利用手里的把柄威胁对方，使对方就范。


    袁世凯善于抓住每一个对手的弱点，给予致命打击，达到控制别人的目的。在袁的一生中，被他算计的人无数，各种各样的手段被他用得淋漓尽致，活灵活现。


    在袁世凯算计他人的实例中，比较突出的是对黎元洪。在镇压革命军时，袁世凯就企图透过革命军从中获得利益。因此袁世凯一边用武力对付革命军，另一方面又积极与革命军政府和谈。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '在和谈中，袁世凯发现武汉军政府的都督黎元洪是自己可以利用的人，黎元洪是一个性格懦弱、政治立场不十分坚定的人。身为都督的他曾经是清军协统，因此其骨子里仍然带有封建官僚的气息，只是由于革命党人错误地认为依靠旧势力中有名望的人来领导，一定能将旧势力中的其他人号召过来。可是事与愿违，黎元洪不但未能量世凯号召到革命阵营中来，反而被袁世凯利用，成为其一颗棋子。


    袁世凯对黎元洪采取了长期战略，极为重视抬举，以期拉拢他，然后截断其后路，迫使黎元洪听命于己，成为他的俘虏。


    在和谈之初，袁世凯加巨同黎元洪联系，处处向黎元洪表示尊重，这使黎元洪感到受宠若惊，因为黎虽为军政府都督，但并未有实质权力，而且由于其性格懦弱，军政府内的事情通常不发表意见。袁世凯如此看他，使黎逐渐强硬起来，摆起了做都督的架子。和谈成功后，袁世凯加紧了逼宫的步伐，并顺利地使清政府退位，同时孙中山如期提出辞职，袁世凯登上


    238'
  merge: -1
  img_proc: true
- pgno: 237
  md: '了临时大总统的位置，这时他也不忘把黎元洪选为副总统。另外，袁世凯为了阻止革命党领袖黄兴加入新政府，把参谋总长的位置也给了黎元洪。


    袁世凯向黎元洪大大施恩，但他知道仅仅如此也不能完全控制黎元洪，于是袁世凯使出了要招。


    黎元洪在革命军政府中一直处于有职无权的地 位，为此黎非常苦恼。革命军政府中“三武”一直控制老局面，使黎没有出头之日。“三武”指的张振武、孙武、蒋翊武，三人都是革命军政府的功臣，享有很高的声誉。有这三人在黎元洪身边，黎便只能像愧偶一样。这种局面，袁世凯早就看在眼里，他特意派人假惺惺地对黎元洪表示同情，并暗示黎元洪说袁世凯可以帮他调开这三个人。


    黎元洪听后特别高兴，由衷地感谢袁世凯，于是 听从了袁世凯的提议，袁世凯找了个理由将“三武”调到北京，授予他们一个有职无权的“总统府军事顾问”。后来张振武无法忍受，率先返回到武昌，即他'
  merge: -1
  img_proc: true
- pgno: 238
  md: '的根据地————革命军政府。黎元洪的权力又受到了威胁。


    这一次黎元洪发下狠心，拍电报给袁世凯，要袁世凯杀掉张振武。袁世凯接到这份电报时，发出冷笑，他要用这张电报整垮黎元洪。袁世凯一面派人将张振武杀害，一面将黎元洪给他的电报公开在报纸上，由此，革命党人完全不信任黎元洪，使黎失去了权力的基础。


    从此黎便只能依靠袁世凯，听从袁世凯的调遣。在二次革命中，黎元洪就站在袁世凯一边，帮助其镇压革命党。后来，黎元洪无法在革命军政府中待下去，就从武昌到北京，被袁世凯安置在瀛台，虽然名为副总统，但始终无权，终日以散步、读书、写字度日。


    在权力争夺场上，黎元洪只能说是袁世凯的败将。袁世凯对黎元洪的策略是利用了黎元洪的弱势地位，先宠之，后控之，似乎有点像钓鱼一样，用诱套中他，然后再任意摆布。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '在袁世凯对黎元洪的招致当中，最为关键的一步是得到黎元洪的电报。这个电报就是袁世凯所掌握的“把柄”。他最后将这个把柄拿出来，立刻使得革命党方面不信任黎元洪，顿时黎元洪就成为了任凭自己摆布的旗子。


    # 牵其利，控其行


    汉高祖刘邦是西汉王朝的开国皇帝，他的妻吕雉（即吕后、高后）辅佐他夺取天下，巩固政权，在秦汉之际的历史大变动中起重要作用。


    刘邦和吕雉的婚姻，完全出之于吕雉之父吕公的撮合。吕公是单父（今山东单县）人，与沛县县令是朋友。他因为躲避仇人的寻衅，就到沛县投靠县令。


    一次，沛令宴请贵客，当地官吏与豪富纷纷祝贺。沛县主吏像萧何担任宴会的司仪，他依据客人送礼的厚薄安排座次。贺礼于钱以上的坐堂上，不满于钱的坐堂下。'
  merge: -1
