  md: '东诈降。


    # 人性分析：


    人心是肉做的，如果可以完全相信一个人，这个人完全值得信任的话，没有人想要去多疑，信任与不信任，总有情在里面，谁也不想承认和面对这样一种怀疑，既是 对自己的否定，又是对别人的一种伤害。


    有时候越是我们在意的东西，我们就越是保又狭小心态，无法容忍的事情也就越多，在不希望出现的事情出现之前，往往我们会先采取行动。


    读三国时，对曹操这个人总是怀有复杂的心t青，曹操其人雄才大略，古今少有，又兼于诗歌，其佳作千年之后读来，仍旧慷慨激昂，曹及世之奸雄，其多疑的性格更是印象深刻。


    而深受其疑心之害的，首推吕伯奢一家，曹操与陈宫逃亡之时，暂避于吕伯奢家，这吕氏欣赏曹的才干，亲自为曹打酒，而曹操听到后院磨刀之声，并听到把他绑起来杀了，曹以为这是要杀自己，便先下手为强，诛杀了吕氏一门八口，及至灭门后，方发现地上绑老一口猪，'
