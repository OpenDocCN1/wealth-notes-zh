- pgno: 80
  md: '故事。


    为什么勾践尝粪都可以，而刘禅只是说了句话就万夫所指呢？在勾践最后成功复国了，而刘禅没有。原来历史真的是以成败论英雄。忽然有个很好玩的猜想：如果勾践最后没有成功，如果刘禅最终统一了三国，历史又会如何评说？


    可惜，如果只是如果。


    # 人性分析：


    扶不起是阿斗背负于年的骂名，甚至直接成为骂人的话，这对于一国之君直是莫大的讽刺。在中国历史上，做皇帝的人不知凡几，亡了国的皇帝也是不少，但为何被骂最惨的却是刘禅？


    说起来很有意思，刘禅被骂倒和亡国没有多大关系，却只是因为那句——此间乐，不思蜀。但通过上面的文章，我们知道，刘禅并非是个只看乐子不想事情的人，他很努力地做老一切。曾经，他努力地平衡自己和诸葛亮之间的关系，曾经，他努力地希望闭关息民，曾经，他睿智地看清了魏延造反事件的本质。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '他真的用了心， 做了很多事， 结果这些事情没有人记得住，一句背后有台词的话却遗臭万年。 刘禅被后世骂，为我们昭示了一条生存法则： 人们只记住他们愿意记住的事情！


    既然这句话对刘禅而言如此至要， 就不得不对这句话及其背后的故事进行分析，通过 分析，我们可以发现，刘禅说这句话不是没心没肺， 事实恰恰相反， 这正体现出他的心眼太多了。


    他说这句话， 不是因为他贪图享乐， 而是为了给他曾经的属民争取更多的利益， 为了让自己的命 命可以得到更长的延续，以备完成复国的理想。


    虽然， 这一最终结果没有实现， 但前面的阶段目标刘禅是实现 现了。 而这同刘禅说这句话争取到时间和空间是密不可分的。 刘禅阶段目标的实现，为我们昭示了一条生存法
    则： 示弱是自我保护的一种方法！'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 利与祸同行，未或利祸已远


    故事：


    明朝正德年间，福建福州府城内朱紫坊有个秀才叫郑堂，字汝昂，号雪樵山人。他琴棋书画、诗词歌赋样样皆通。郑堂三十八岁那年，在繁华的鼓渡鸿口地方开设了一个字画店。几个月来，生意兴隆。


    一次，一个看上去文质彬彬的年轻人登门拜访，自报姓名，说自己叫龚智远。龚智远带来一幅传世之作《韩熙载夜宴图》押当，郑堂大喜，当场付了八千两银子，龚智远答应到期愿还一万五千两。


    一晃就到了约定的取当日期，但等到太阳落山了，仍不见龚智远拿银子过来赎画，郑堂突然有所醒悟，赶紧取出放大镜仔细一看，原来画是假的。郑堂被骗走八千两银子的消息，一夜之间不胫而走，轰动了全城。


    有人幸灾乐祸，有人同情惋惜。


    人们都以为郑堂的店铺会因此一蹶不振，谁知两天之后，郑堂却高高兴兴地在家摆起了宴席，大宴宾客，'
  merge: -1
  img_proc: true
- pgno: 83
  md: '遍请全城的士子名流和字画行家赴会。


    很多人甚至不请自来，酒宴热闹 闹闹地进行到一半，郑堂从内堂取出那幅假画挂在大堂中央，说道：今天请大家来，一是向大家表明，我郑堂立志字画行业，绝不会因此打退堂鼓；二是让各位同行们都来了解一下骗子的骗人伎俩，请同行兄弟们引以为戒。


    人群里一阵唏嘘，等到客人们一一看过之后，郑堂毫不犹豫地把假画投入了身边的火炉，并大义凛然地说道：不能留此假画在这世上再害人了！八千两银子就这样付之一炬，郑堂大宴宾客，当众烧毁假画的事再一次轰动了福州城。


    烧画后的第二天，郑堂刚把店门打开，就见那个本已销声匿迹的龚智远已经等在门外了，进入店里，龚智远解释 说有事耽误了还银子的时间。


