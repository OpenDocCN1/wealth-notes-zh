- pgno: 72
  md: '百姓为自己卖命的人不知要强多少。在这一点上，刘禅比南唐后主李煜强多了。


    当北宋大军杀来之时，李煜先是数次派使者请求退兵未果。宋太祖开出条件：只要李煜自降就不大兴伐兵。这位写朦胧诗的高手皇帝态度坚决，发动了他一生中第一次也是最后一次战争。他做的第一件事情就是号召百姓捐钱抗战，而事实上他自己尚有百万银子的私房钱，说是保卫祖国，其实是保卫自己的享受。


    南唐军民的拼死抵抗终于没能阻止宋太祖统一的步伐，金陵城终究还是破了。此时，李煜的民族气节全无，为了保全自己的性命，他以历史上规格最高的投降——肉袒（裸露上身），出城向宋军跪倒乞降。最是仓皇辞庙日，教坊犹奏别离歌。垂泪对宫娥。从李煜这首《破阵子》可以看出：


    > 山河失去了，我不在乎。家国破了，我也不心疼。只是身边的美人啊，让我惦念。那么多南唐臣民奋死保卫的不是家国，而是他李煜的美人。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '再来说说乐不思蜀。首先要弄清楚一个问题：刘禅是否真的是"纨绔子弟"？这个问题很重要，因为只有清楚一个人是什么样的人，才能更深入了解特定语言和行为的意义。


    刘禅是否是个傻冒儿？在回答这个问题之前，先要回答刘备是不是傻冒儿？恐怕不是。虽然顶着 一个皇叔的虚名，年近半百还寄人篱下，但被曹操被誉为：今天下英雄，唯使君与操耳。而事实上，刘备也确实成就了自己的事业，打下了自己的江山，这样
    的人不可能是傻冒儿。那么，诸葛亮是不是傻冒儿呢？这显然不用过多解释，就可以 得出结论：不是。这样 两个有智慧的人，会不会选择一个傻冒儿来做皇帝？恐怕不会。


    而事实上，刘禅不仅不是傻冒儿，而且历史上对他的评价还很高。据《晋书·李密传》载，李密认为作为君主，刘禅可 次齐桓。与春秋五霸之首的齐桓公比肩，这个 评价不能说不高吧？诸葛亮在《与杜微书》中评价阿斗今年始十八，天资仁敏，爰德下
    士。天下之人思慕汉室，欲与君因天顺民，辅此明主，以 隆季兴之功，老


    75'
