  md: '只不过在一次皇家葬礼的诵经过程中，他偶然遇到了大志在怀的燕王，一身本领不忍埋没，而后跟随后者举兵伐谋。可以说他在这个过程中只是为了相助主子，对日后的回报并没有特别的期待，这也跟他长时间钻研佛法有很深的关系，世间功名利远不能让他动心。


