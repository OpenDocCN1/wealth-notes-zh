    有人的地方， 就有贫富之分。穷人的理想， 大抵是为了解决每日三餐， 填饱肚子， 富人却不是这样， 他们除了锦衣玉食， 奢靡享受外， 有的富人还有一爱好， 那就是高调炫富，通过攀比斗富，
    来显示自己的身份和地位， 以满足虚荣的心。个人也就罢了。如果换成国家这个大家当， 就异常畸形可怕了。有一个朝代， 因为炫富之风猛刮， 硕生生地， 把一个国家毁了。这个朝代，
    就是西晋。


    这股炫富之风的带头人者， 首当是西晋开国皇帝， 带头老大司马炎阁下。 这位老大， 在创业之初， 也是一位励精图治、雄心勃勃、积极进取的好儿郎。 他曾制定了五条基本国策：
    一曰正身， 二曰勤百姓， 三曰抚孤寡， 四曰敦本息末， 五曰去人事。这五大政策的核心是： 休养生息、爱护百姓， 发展生产。


