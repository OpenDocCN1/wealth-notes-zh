- pgno: 251
  md: '当即下令全军出击，直逼汉阵。汉军因临河而战已无路可退，所以人人奋勇，个个争先。双方厮杀半日有余，赵军仍未能获胜，这时赵军营垒已空，韩信预先伏下的两千轻骑直驰而入，在赵军营垒插遍赤红旗。盟灶中的赵军突然发现背后营垒插满汉旗，队形立时大乱。韩信挥军趁势反击，将二十万赵军杀得大破血头，赵军统帅被斩杀，抓住了活生的赵王，从而赵军团队失败。


    战后，汉军将士们喝酒撺掇互相庆贺，他们纷纷问韩信：将军叫我们背水列阵，这是有悖兵法的啊，为什么竟然能取胜呢？韩信哈哈大笑：兵法上不是都说了吗？置之死地而后生，置之亡地而后存。如果我给他们一条生路，士卒们就不能拼死作战了。诸将这才领悟了背水列阵致胜之奥妙，为此他们对韩信大大地敬佩。


    井陉之战，韩信以万余的劣势兵力，正确合理的方法，背水列阵，灵活巧妙地用兵，一举击破二十万赵国大军，灭亡了项羽分封的赵国，谱写了中国军事史上的精彩篇章。王涯是一位唐代诗人，他在《从军行》里，生动描述了井陉大战，高度赞扬韩信一头聪明的高超谋


