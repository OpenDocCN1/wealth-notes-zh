  md: '当官，我也证明了自己能经商，但是我经商不是为了纯粹积聚财富；这种自足是要有自强的能力为基础的，也是要自信的精神为支撑，更要有一种自乐的情怀为保障的。能心安理得地把每一种生活都过好的人才是真正
    的知足者，知足不等于安于现状，更不等于逃避现实。


    其实，关于范蠡身上的生活智慧还有很多，讲得过多其实也并没有什么用，因为能够理解它的人是 可以触类旁通的。不能够理解它的人，我就是事无巨细地 列举出来，也是于事无补的。后世人
    对范蠡赞誉为“忠以为国，智以保身，商以致富，成名天下”，我认为范蠡是 当之无愧的。


