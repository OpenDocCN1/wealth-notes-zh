  md: '淋漓尽致地展现了范蠢深不可测的生活大智慧，这并不 是一种过度解读，历史上能深得范蠢智慧之精髓的其实 也不过张良等寥寥数人。


    那么，范蠢的大智慧究竟体现在哪几个方面呢？限 于篇幅，本文只选取几个最主要的点进行阐述。


    第一、自知。这两字十分简单明了，但是很多人一 辈子都没有弄明白。其实并不是很多人不明白这两个字的 室要性，而是很难理性地坚持这两个字。很多人或许都 知道自己要什么，比如文种和勾践都是这样的人，但这
    种人还不是真正自知的人。一个人不光要知道自己要什 么，还要在某些十字路口懂得选择、懂得取舍，这才是 真正的自知。强行占有和眷恋并不在自己能力范围内可以 拥有的东西，其实所谓的得到也是一种失去。范蠢最能难
    能可贵地就是任何时候都知道自己的位置、环境和能力， 所以总能做出相匹配的正确选择。比如，齐国慕名而聘 其为相时，他就说：“居家则致千金，居官则至卿相， 此布衣之极也，久受尊名，不祥。”


    第二、自如。很多道理其实并不复杂，想到、想清'
