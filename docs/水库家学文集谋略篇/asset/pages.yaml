  md: '作《韩娥传》。


    刘生曰：“韩娥少孤，遭时多艰，受叔母一言，微服处军中一纪，人莫辨其为女。譬之执玉驱马，马骤而玉不秕，捧盈开车，车摇而盈不溢，善于执捧故也。亦由洞洞属属之心坚似金石，故能保其身，归于马氏。娥有三善焉，智也，贞也，孝也。《诗》云：“既明且哲，以保其身”，娥之谓也。


