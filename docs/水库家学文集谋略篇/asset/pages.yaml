  md: '园一所；造成，操往观之，不置褒贬，只取笔于门上书“活”字而去。人皆不晓其意。修曰：“门内添活字，乃阔字也。丞相想阔门阔耳。”于是再筑墙围，改造停当，又请操观之。操大喜，问曰：“谁知吾意？”左右曰：“杨修也。”操虽称美，心甚忌之。


    又一日，塞北送酥一盒至。操自写“一合酥”三字于盒上，置之案头。修入见之，竟取匙与众分食讫。操问其故，修答曰：“盒上明书一人一口酥，岂敢违丞相之命乎？”操虽喜笑，而心恶之。


    操恐人暗中谋害己身，常分付左右：“吾梦中好杀人；凡吾睡考，汝等切勿近前”一日，晏寝帐中，落被于地，一近侍慌取覆盖。操跃起拔剑斩之，复上床睡；半响而起，佯惊问：“何人杀吾近侍？”众以实对。操痛哭，命厚葬之。人皆以为操果梦中杀人；惟修知其意，临葬时指而叹曰：“丞相非在梦中，君乃在梦中耳！”操闻而愈恶之。


