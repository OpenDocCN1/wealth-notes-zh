    # 人性分析：


    公元前453年，韩、赵、魏三家灭智氏，三分晋国土地。从此，晋国为韩、赵、魏三家瓜分。公元前403年，周天子正式承认三家为诸侯，标志老战国时代的开始。这篇“三家分晋”讲的就是这个故事。踌躇满志的智瑶以为攻下赵氏是易如反掌的事情，却没有考虑到韩、魏两家为了自身的利益，会和赵氏合作。当智瑶正沉浸于独霸晋国的美梦之中的时候，自己反而成了众矢之的，


