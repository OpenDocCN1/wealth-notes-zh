- pgno: 123
  md: '后世人多注至的是一飞冲天，一鸣惊人，把它作为有志者竟成一类的激励之辞。不过，一飞冲天，一鸣惊人实际上是效果，是结局，是那耀人眼目的成功的一瞬。从智谋的角度来说，更耐人寻味的，却是那三年不飞、三年不鸣的个中秘密。


    以楚庄王的故事而论，他之所以三年不飞，三年不鸣，当然不是不知道飞，不愿意鸣，而是基于自己立身为国君的现状，基于奸臣专权后楚国朝廷陈陈相因、积至难返的实际情况而不得不如此。这一点，只需从他理政后杀数百个过去的官员这一事实来看，就是非常清楚的。


    很明显，楚庄王下诏拒谏其实就是要看一看有没有真心来劝的臣下；以死相威胁就是要看一看有没有真正不怕死的忠臣；奢侈淫逸、醉生梦死就是要故意显示自己胸无大志，看哪些大臣肆无忌惮，把一切败德恶行暴露无遗，看哪些大臣洁身自好，居污泥而不染，忠奸分明，邪正清楚后，才能够施行大变革，全面整顿，全面改革，经大乱而达到大治，这就是三年不飞，三年不鸣'
