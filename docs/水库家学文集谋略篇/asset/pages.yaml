    可是他为了带老燕王完成一番大事业，在整个起兵过程中起到了关键的推动作用。燕王虽然一直都有起兵之心，但由于事情太过重大，他一直犹豫不决。


    而姚广孝不仅在表面上劝说对方用兵，更是在后方帮助燕王招兵练兵打造兵器，在攻城进军之时也多次出谋定策。


    如此一来，他基本上就成了正史中的第一大“反派”，如此一来他自保都来不及，又怎么敢接受封爵？还好对方继位以后治国有方，国家也有了稳定的发展，'
