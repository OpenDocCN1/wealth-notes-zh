  md: '厉王符生更是嗜杀如命，他生来是独眼，从小便有仇视一切的心理变态。有人用“天象有异”会降灾，提醒他不要乱杀人，他竟说：“皇后和大臣可以代表我，杀了他们，我就可以免灾了。”于是将皇后和七个大臣都杀了。他每次上朝，都要将利刃、凿子、锯子等凶器放在手边，动不动就将大臣剥皮挖眼，借以取乐。大臣们上朝，去时与家人告别，如果活老回来就庆祝一番。要是告病辞职能被批准，那直是三生有幸，连夜逃之夭夭。


    为明哲保身，许多的人采取急流勇退的策略，离开是非之地藏身于大泽深山，即使饿死了也能得一副全尸，而且无损于铮铮傲骨。


    自古以来，不乏这种优游林下，垂钓湖中的豪杰志士，功成者要身退，免得震主；浊浪横流时也不妨愤然离去，这样才能保住自己的名节。汉代的王莽纂权后，有许多人不愿事莽。王莽派人请龚胜出山，龚胜竟绝食而死。


    汉顺帝派人将樊英从山里抓来，强迫他当官，他死活不肯，顺帝动怒，说：“朕能够让你生，也能让你死；能让你高贵，也能让你下贱；能让你富有，也能


    290'
