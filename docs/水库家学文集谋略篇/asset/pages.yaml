    《增广贤文》有言： “客不离货，财不露白。” 指的是，在外旅行的人不随便离开自己的行李， 钱财不轻易泄露给别人看， 以防劫贼。人都是有嫉妒心理的，若是随意暴露自己的钱财，
    很容易遭人惦记， 甚至引来不好的灾祸。


    《西游记》中有这样一段故事。唐僧师徒二人来到观音院，院里老僧拿出自己的宝贝跟唐僧炫耀。孙悟空按撩不住， 拿出唐僧的袈裟与之一比高下。三藏告诫： “徒 弟，莫要与人斗富，
