- pgno: 78
  md: '除了任贤相外，还有一件事情可以证明刘禅很明白事理。曹魏政权司马懿篡夺后，夏侯霸为躲司马懿的迫害，逃到蜀国。夏侯霸心里对蜀国尤其对刘禅是有芥蒂的，因为其父夏侯渊在汉中战役中死于刘备军队。本来夏侯霸一直要为其父报仇的，多年带兵战斗在汉中与凉州地区，没想到这时他反倒要栖身于仇家。刘禅热烈欢迎他的到来，对于夏侯渊的死，


    刘禅说：卿父自遇害行间耳，非我先人之手刃也。那都是上一代的恩怨了，而且当时各为其主，且又不是我父亲刘备亲手杀了你父亲，因此，你我二人没有杀父之仇。一句话就化解了夏侯霸心中的顾虑和仇结，刘禅很会做人吧？


    试问一个如此明白事的人，会否不知道什么该做什么不该做？会否不知道什么该说什么不该说？可刘禅偏偏说了那句足以让他遗臭万年的，此间乐，不思蜀。


    刘禅投降后，举家迁往洛阳，被封为安乐公。此时的他，虽然是亡国之君，但不仅仅影响着自己的性命，家人及'
