- pgno: 303
  md: '垂于古。


    至于隐退与否，也是因各人性格不同而定。从最后的理想结局来看，当然是“功成身退”、“告老还乡” 能保平安，此乃“天之道”也。换个角度来看，历代用 人也倾向于录用“知退者”。


    如宋代工部尚书在谈录用人问题时，露骨地说过：


    > “应举吾引退者。”理由是：“举人大抵应举吾退者，因喜退者识廉知耻，而忠心事极，少生事。但若举奔竞者，此类人多骄矜好利，而易累及举官，故尽量避之”


    商鞅之所以惨遭要手，是他太不识时务，只知道进，而不识廉耻，且“好生事”，故而引起众怒，不死将何？在历史上，这样的例子不是很多吗？所以，我们只有居危思安、高瞻远瞩，认识到满方易折、物极必反的道理，才能保证实力、图发展。后退是一种策略。当前面的路被一座山挡住，我们只能绕过去。这样虽然要多走一些路，但却能保证到达目的地。因此，一个人要做成一件事，不懂得后退是不行的。后退是一种策略。不懂得后退的人，往往难以达'
