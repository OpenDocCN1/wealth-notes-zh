- pgno: 79
  md: '蜀地百姓的幸福也都要看司马昭如何看待他。司马昭对自己 的评价，直接影响到晋国对蜀地百姓政策的宽松与否。


    所以刘禅装憨卖傻，处处隐藏自身才能，不仅是为瞒天过海、养晦自保，更是为了给广大民众谋幸福。这个方针应该说是成功了，刘禅赢得了司马昭的那句：我无忧矣！


    说起来，当年越王勾践不是也采取了此种策略吗？


    公元前494年，吴王夫差攻破越都，勾践被迫屈膝投降，宰妻和大臣范蠡亲自去吴国做人质。到了吴国后，夫差有意羞辱他，将其囚于石室。要他住在夫差父亲吴王阖闾坟前的一个小石屋里守坟喂马，有时乘车出门还故意要他牵马在国人面前走过。勾践自称贱臣，对吴王执礼极恭，服铁鼻、老樵头，夫人衣无缘之裳、施左关之祸，如同夫差手下的仆役。最疯狂的是夫差生病，勾践前去问疾，还掀开马桶尝取尝夫差刚拉的大便，体察夫差病情，所谓问疾尝粪。三年后，夫差认为勾践已真心臣服，决定放勾践夫妇和范蠡回国，才会有了后面大败吴师的'
