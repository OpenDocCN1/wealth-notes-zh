    权力和财富、美色、具备刺激性的饮料一样，可以让贪婪的人快乐，也可以让他们呕心沥血，让他们出洋相。而对于权力的追逐，被一些人认为是高尚的事业，即使在追逐的道路上壮烈了，也会有高尚的同仁们，分泌出超过体温的液体——歌颂他们。'
