  md: '而是乐于承担更多责任。身为部属，在主管有很好的意见时要支持，但当他错了也要有勇气反对。当一个配合者，得拥有很强的能力，却也要有愿意居于副手的胸怀。


    庄子认为，当一个和而不唱的人是更难能可贵的工夫，只要能够做得好，反而可以吸引到更多人，彰显自身价值。


    # 缺点不隐藏，为人做衣裳。


    西汉开国皇帝刘邦曾经这样评价韩信：“连百万之军，战必胜，攻必取……”西汉著名丞相、开国元老萧何也曾经评价韩信“国士无双”。


    何曰：“诸将易得耳。至如信者，国士无双。王必欲长王汉中，无所事信；必欲争天下，非信无所与计事者。顾王策安所决耳。”——司马迁《史记·淮阴侯列传》


    （注：韩信先是被封为齐王，后来刘邦将他调到楚国当楚王，最后，刘邦以打猎为由，到楚国借有人告韩信谋反为由，削去了他的王位，羁押到京城长安软禁，贬为淮阴侯。因此，《史记》中才没有说是《韩信列传》，'
  merge: -1
  img_proc: true
- pgno: 167
  md: '而是《淮阴侯列传》，其实都差不多。）


    如此看来，韩信 的军事能力是毋庸置疑的。但是，这样一个盖世英雄，却落 得个 兔死狗烹的下场。


    前文提到，刘邦 将韩信软禁在长安，但是，可能是念及韩信战功赫赫，为 西汉 王朝的开创建立了汗马功劳，因此只将他软禁，并没有立即杀他。但是，吕 雉 吕后 并没有打算放过他，她
    与萧何商议，骗 韩信说，刘邦 已经消灭了叛军陈稀，让韩信入宫庆贺。最后，韩信被吕后杀于长乐宫的耳室。


    一代战神， 英年早逝。


    对于韩信的悲剧结局， 不少人都 说刘邦猜忌功臣，吕后心狠 手辣。但是，韩信本人也并非完全无辜。今天，就 让我们从《史记》里的这 3 个细节，来看看韩信自己身上所存在缺点。


    +   1、 在汉军中犯罪， 说明韩信对规则不重视


    一开始，在所有反秦 的义军中，韩信选择追随项梁。项梁死后，韩信自然就属于项羽的楚军麾下。韩信向项 羽献出自己的计策，奈何 项 羽并不重视。心灰意冷之下，'
  merge: -1
  img_proc: true
- pgno: 168
  md: '韩信转投刘邦的汉军。


    在汉军中，韩信还未崭露头角，就迎来了一场小风波。他触犯了法律，同伙的十三人都被杀掉了。


    汉王之入蜀，信亡楚归汉，未得知名，为连敖，坐法当斩，其辈十三人皆已斩……


    ——司马迁《史记·淮阴侯列传》


    可惜的是，韩信具体触犯了什么法律，《史记》中并没有提到。但是，从这个细节中，我们就可以看到，韩信对于规则不怎么重视。他并非那种穷凶恶极之人，但是法律是公平的，一码归一码，不会因为你平时多行善事、多作贡献，就可以脱离法网。而且，韩信触犯的法律还很重，到了要杀头的地步。这种性格特点，可能就会导致韩信在生活中更加倾向于我行我素，而不是明哲保身。


    好在，当轮到韩信被杀头的时候，他靠着自己的一表人才和远大志向，救了自己一命。


    韩信对滕公说： “汉王不是想统一天下吗，为什么要杀壮士？ ”'
