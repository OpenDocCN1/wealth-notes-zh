  md: '践成就霸业后，因功高而封上将军，正当他的政治前途眼见可以光泽耀世之际，却突然放下眼前的万般好事而急流勇退，直接请辞越王勾践，回归江湖并改名易姓“鸨夷子皮”，然后，过上了与“日月为朋，山川为友”，逍遥自在的闲散日子，常遨游于七十二峰之间。


    在这段日子里，其间，范蠡三次因为做生意皆成为巨富，可等每次富起来名声大噪之后，他曾三次散尽家财与知友乡邻为善。


    范蠡浮海出齐，变姓名，自谓鸨夷子皮，耕于海畔，苦身戮力，父子治产。居无几何，资产数十万。齐人闻其贤，以为相。范蠡喟然叹曰：“居家则致千金，居官则至卿相，此布衣之极也。久受尊名，不祥。--乃归相印，尽散其财，以分与知友乡党，而怀其珠宝，间行以去，止于陶，以为此天下之中，交易有无之路通，为生可以致富矣。于是自谓陶朱公，复约要父子耕畜，废居，候时转物，逐什一之利。居无何，则致货累巨万。天下称陶朱公。


    这段话言简意赅地介绍了范蠡丰富多彩的一生，也'
