  md: '城门让他进城。 可宋太祖即位以后，处死封邸门的官吏，而赏赐官位给陈桥的守门人，以表扬他对前朝的忠心。


    何直和赵匡胤的例子很类似，以后还有清朝入关之后，康熙帝曾组织修编贰臣传，用来批评那些背叛了前朝投降清朝的前明旧臣。其实都是一个道理，为的都是明确忠的伦理道德，以化解民众见利忘义的不良行为，引导大家向忠上靠拢。
    可见，明伦，未必不化俗。 其实明伦不仅仅使用于组织的领导者，也适用于普通受众。


    宋朝哲宗登基后，年纪还小，因此很多大臣根本不把他放在眼里。大臣有事上奏，都是直接向宣仁皇太后禀告。偶尔哲宗有话要说，大臣们也都认为是小孩乱说话，根本不给予理睬。
    只有苏颂一人，每次奏事时，在禀告皇太后后，必定再禀告哲宗，哲宗说的话，他也都极力去办好。 后来哲宗亲政了，他开始算旧账，把那些原来不理睬自己的元佑时期旧党的老臣都贬职了。
    有人想弹劾苏颂，但哲宗却说：苏颂素明君臣之义，不要轻率议论这位国家的元老了。苏颂明了君臣之义这个伦理，'
