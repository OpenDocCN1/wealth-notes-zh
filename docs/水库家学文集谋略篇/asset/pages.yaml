- pgno: 74
  md: '勋于竹帛也。诸葛亮不能说是那种阿谀逢迎的人吧？


    他给的评语应该还靠点谱吧！ 既然刘禅不是傻冒儿，那么他都做过哪些聪明事？又似乎没有。翻阅史书，关于他的记载很少，《魏略》记载，刘禅对诸葛亮说政由葛氏，祭由寡人，意思是他刘禅做了甩手掌柜，政治军事大事他让诸葛亮做主，而
    他只管祭祀这仪式方面的事情。后世也大都因此批评他没有做什么事情，愚下却以为这正是刘禅做的最大的一件事情。


    刘备死时六十三岁，托孤给诸葛亮，希望他帮助刘理、刘永和刘禅兄弟三人共扶汉室。但托孤时的话很耐人寻味，刘备对诸葛亮说：君才十倍曹丕，必能安国，终定大事。若嗣子可辅，辅之，如其不才，君可自取。


    那意思是，你诸葛亮有安邦定国之才，如果你看我的儿子还有点潜力能够辅佐就辅佐他，如果觉得他不行，你就自己来做皇帝吧。诸葛亮不是奸臣，肯定不能“自取”。那刘备为什么要说这样的话？因为诸葛亮的势力太大了，刘备认为自己死后，刘禅不一定能驾驭得了他，因此以退为进。刘备尚且需要“退”何况刘禅？'
  merge: -1
  img_proc: true
- pgno: 75
  md: '而随后发生的事情也证实了刘备的担心并不多余。诸葛亮立刘禅为帝，改元建兴，而刘禅是刘备三个儿子中最年幼的一个，登基时仅十六岁。


    《魏略》中载魏明帝的布告说：亮外慕立孤之名，而内贪专擅之实。刘升之（刘禅别名）兄弟守空城而已。虽然魏明帝此举有挑拨离间之嫌，但诸葛亮在蜀国的势力可见一斑。从政治经验到力量对比，刘禅都处于非常不利的境地，刘禅却能很好地处理了这一矛盾。


    刘备临终叮嘱刘禅：汝与丞相从事，事之如父。于是，刘禅政事无巨细，咸决于亮，放权给诸葛亮处理军政大事。实际上，这是对刘禅最为有利的选择。


    试问如果刘禅和诸葛亮争权的结果会是怎样？肯定刘禅会输。既然争不过，就让你先管我管着，因此才有了‘政由葛氏，祭由寡人’之说。刘禅这样做，实际上是把诸葛亮先放到忠臣贤相的位置上，刘禅把好名都给了诸葛亮，那诸葛亮也就只能鞠躬尽瘁、死而后已，而不能有其他的想法了。这样，刘禅保住了自己的位置，不会因一个政见不合让诸葛亮有自取的机会，同时对刘禅'
  merge: -1
