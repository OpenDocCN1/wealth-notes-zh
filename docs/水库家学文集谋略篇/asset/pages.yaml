- pgno: 243
  md: '瑜曰：“吾之粮草，颇足备否？”干曰：“兵精粮足，名不虚传。”


    瑜佯醉大笑曰：“想周瑜与子翼同学业时，不曾望有今日。”


    干曰：“以吾兄高才，实不为过。”


    瑜执干手曰：“大丈夫处世，遇知己之主，外托君臣之义，内结骨肉之恩，言必行，计必从，祸福共之。假使苏秦、张仪、陆贾、郦生复出，口似悬河，舌如利刃，安能动我心哉！”


    言罢大笑。蒋干面如土色。


    瑜复携干入帐，会诸将再饮；因指诸将曰：“此皆江东之英杰，今日此会，可名群英会。”饮至天晚，点上蜡烛，瑜自起舞剑作歌。歌曰：“丈夫处世兮立功名；立功名兮慰平生。慰平生兮吾将醉；吾将醉兮发狂吟！”


    歌罢，满座欢笑。故与同榻，伪遣曹营水军头领蔡瑁、张允诈降曹假信，夹于书中，故意诱蒋干窃取。蒋干中计，曹操一怒之下斩了蔡、张二将，即觉中计，便遣蔡瑁之弟蔡中、蔡和二人，以不满曹操杀兄为由，到江'
