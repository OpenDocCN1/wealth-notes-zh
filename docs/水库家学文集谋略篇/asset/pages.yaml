- pgno: 254
  md: '所以最大的耻辱莫过于卑贱，最大悲哀莫过于贫穷。长期处于卑贱的地位和贫困的环境之中，却还要贵难社会、厌恶功名利益，标榜自己与世无争，这不是士子的本愿。所以我就要到西方去游说秦王了。


    # 集万变，行于一事。


    原文：


    法正至荆州，阴献策于刘备曰：“以明将军之英才，乘刘牧之懦弱；张松，州之股胧，响应于内；以取益州，犹反掌也。”备疑未决；


    庞统言于备曰：“荆州荒残，人物弹尽，东有孙权骑，北有曹操，难以得志。今益州户口百万，土沃财富，诚得以资，大业可成也”


    备曰：“今指与吾为水火者，曹操也。操以急，吾以宽；操以果，吾以仁；操以诡，吾以忠；每与操反，事乃可成耳。


    今以小利而失信义于天下，奈何？”


    统曰：“乱离之时固非一道所能定也且兼弱攻味逆'
