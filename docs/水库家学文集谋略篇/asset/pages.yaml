  md: '都很难过。刘禅却仍然喜笑颜开。后来又有一天，司马昭问


    刘禅： 顾思蜀否？刘禅回答说：此间乐，不思蜀。


    乐不思蜀，于百年来，刘禅一直因此被人斥为扶不起，刘禅这个本名也因此被阿斗这个小名所取代。不思进取、贪图享乐，阿斗简直成了怯懦、没有进取心的代名词。可从另一个角度去研读这段历史，作为三国中最弱的一方，扶不起的阿斗刘禅能领导蜀国四十一年，而且难能可贵的是，最后虽然成了亡国之君，却能够得享天年，这很不简单。也许，阿斗并不是扶不起的。


    在说刘禅投降这事之前，先来看看当时蜀国所处的环境。魏国占据了长江以北的广大地区，东吴占据老除四川以及云南、贵州的部分地区之外的长江以南的广大地区，蜀汉政权只保有区区的四川以及云贵的部分地区。这也就是说，魏国占据全国十之七八的地盘，剩余部分东吴也占据了大部分。从实力对比上看，打是打不过了。而当魏军直指成都时又是什么情况呢？逃的路线无非是弃成都而进南中，或者投靠孙吴。但南中地区，也就是四川南部及云、贵部分地区情况复杂，且少数民族较多。


