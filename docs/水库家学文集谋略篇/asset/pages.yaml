- pgno: 268
  md: '那些有漂亮女子的人家，担心大巫祝替河伯娶媳妇去，因此大多带老自己的孩子远远地逃跑，也因为这个缘故，城里越来越空荡荡无人，以致更加贫困，这种情况从开始以来已经很长久丁。


    老百姓中问流传的俗语有（假如不给河伯娶媳妇，就会大水泛滥，把那些老百姓都淹死丁的说法。“西门豹说：”到了给河伯娶媳妇的时候，希望三老、巫祝、父老都到河边去送新娘，有幸也请你们来告诉我这件事，我也要去送送这个女子。”这些人都说：“是是。”


    到了为河伯娶媳妇的日子，西门豹到河边与长老相 会。三老、官员、有钱有势的人，地方上的父老也都会 集在此，看热闹来的老百姓也有二三千人。那个女巫是个 老婆子，已经七十多岁，跟老来的女弟子有十来个人，都
