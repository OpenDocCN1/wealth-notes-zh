- pgno: 245
  md: '知道自己杀错了人， 只好逃走， 却正好遇见打酒归来的吕伯奢， 这个疑心又狠辣的曹操一不作， 二不休， 竟乘吕不备， 杀了自己恩人， 曹的手段心肠， 可见一般。


    再有， 群英会蒋干中记一段， 心思缜密的曹操， 在接到蒋干盗取的假书信， 一怒之下， 杀了蔡瑗张允， 这蔡张原是刘表手下管水军的， 教习水军彼有法度， 成了周瑜心头之患，
    于是设计杀之， 而周深谙曹疑心至， 也深知曹从不相信蔡张莫非归顺， 待见书信， 便立刻斩首，待 首级呈上， 立刻知道上当， 为了掩饰， 又称二人怠慢军务，
    所以诛杀， 是 又多疑又奸诈。


    曹操没有安全感， 一个人杀人太多， 心里自然担心仇人报复， 曹自称有梦中杀人之习性， 有一次曹操夜里被子摔地上， 侍从将被子盖其身， 而曹立即起身一剑刺死侍从，
    然后安然大睡， 待早晨醒来， 惊见地上尸首，故问何人， 及知是从从盖被误杀， 后悔无矣， 厚葬了仆从， 从此没人敢他睡时接近他。


    自古以來疑心害人啊！


    有许多时候， 并不是周围真的草木皆兵， 而是心中'
