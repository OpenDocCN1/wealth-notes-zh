  md: '大业。说人者，要搞清游说对象的心理需求；求职者，要把握用人方的人才取向，然后才能有的放矢展示自身才华。苏秦第一次的失败，恰因他提出的连横策略和所得论据，与秦人当时的治国思想、目标追求和用人取向都有矛盾，双方根本不对点又谈何用武之地？所以即使一代雄才，也会因无的放矢的做事方法而遭到挫折。


    人性分析：


    在说话中，有的放矢就是体现吸引力，它应该有三个效果：


    有针对性


    特定目标受众。你不能跟农民谈金融改革，也不能跟银行家谈作物收成。针对性就是投其所好，并找到共鸣点。


    有可行性


    你的方案、建议或言论内容，必须能打動对方，在心理共鸣的基础上，对进一步深入合作产生兴趣。当你拿著一个项目坐在银行家面前，让他乐意掏出钱的必要步骤，就是让他看到项目的可行性。如果不能赚钱，'
  merge: -1
  img_proc: true
- pgno: 226
  md: '即便他认同你的理想，与你心有戚戚焉，也仅此而已。


    # 成功说服


    一个有感召力的游说过程，应该以对方接受你的建议为结束。无论你采取什么手段，结果都是最至要的，也是唯一用来验证你的方法是否正确 的标准。


    综上所述说服别人如同钓鱼，要想钓到鱼，你就得像鱼一样思考，而不能像渔夫一样思考。只有像鱼一样思考，才能知道鱼在想什么，它喜咩吃什么，需要什么。鱼喜咩吃的是又肥又嫩的蚯蚓，而不是你喜欢吃的酥香炸鸡。在生活中，人就是鱼。要想钓到人，你就得知道他喜欢什么，他需要什么？


    一次成功的谈判、说服，有针对性地去把握对方的真实需求，才是最有关的键的。你的目标和语言的针对性都要强，而且要充分考虑对方的性格、情绪、习惯、文化以及需求差异。


