  md: '到其府中，吃了一个清蒸猪蹄，味道甚美，问怎么回事？有人答：人乳蒸的。司马炎快活的频频点头，却不加以制止。


    还是这个王济，在京城黄金地段买了块地，建了一个射马场，用铜钱铺地，时人称其为“金沟”，这种赤裸的炫富烧钱之举，引起了另外一位超级富豪的极大不满，此人叫王恺，为打击王济的嚣张气焰，他用一头叫“八百
    里驳”的名牛跟他打赌，谁能射中这头牛，赌注是1000万钱。王恺自以为箭法好，就让王济先射，没想到王济那天运气超好，一箭就把那头牛放到了。


