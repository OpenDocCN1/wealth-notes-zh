- pgno: 301
  md: '待清醒和理智去面对环境的改变！


    # 高级动物，没有受不了的苦，只有享不了的福


    “盛极必衰，物极必反”，是事物发展的必然规律。然而真正能够懂得其深刻含义的人却未必多，因为人都向往老高官厚禄，幸福荣华。自古以来，人的进退，原来就不是件容易处理的事，尤其是“退”字，但是不管个人的主观愿望如何，只知进不知退，在“退”上欠火候，可能都会使一生功绩毁于一旦，身败名裂，遗恨终生！


    战国时代有一位叫商鞅的政治家，仕秦孝公时，以历史上有名的“商鞅变法”的功绩，奠定了自己的地位，同时巩固了秦国的统治。然而，他后来却遭到了五马分尸的极刑，使一世荣华，顿时化为乌有，死后仍骂声不绝。


    晚年的商鞅最大的不幸，就是触逆了原来是他强有力的靠山的孝公。当初，他在孝公的支持下，断然采取了极其严厉的政治改革措施，虽然为秦国政治清明、富国强兵作出了根本性的贡献，但是，改革也触动了新兴'
  merge: -1
  img_proc: true
- pgno: 302
  md: '地主阶级的利益，一时间朝野上下树起了数不清的政敌。变法期间有孝公支持，政敌们对他无奈何，但是危险是很大的。当时他已使孝公感到了威胁，据说，孝公生前曾故意要传位于商鞅，以试他心。《战国策》中有载：“孝公疾起，传位商君，商辞而不受”。可见商鞅已见疑于主子。


    这时他本该主动从位子上退下来，隐遁避险。据《史记》载，有位叫赵良的人引用“以德者荣，求力者戚”之典故力劝商鞅隐退，可是商鞅不以为然、固执己见，或许他想看看自己一手改革的政治是否能够进展下去，他这样的判断思考逻辑显然过于天真。


    孝公已将他驾空，下面政敌正伺机报复，他在台上一日，生命威胁就日大一日。秦孝公去逝后，新王即位，反对派们再也用不着“投鼠忌器”了，纷纷策划陷害他，他终于被以谋反罪名处以极刑。


    也许，商鞅的例子比较特殊，也并非所有“商鞅式”的人物都要惨遭如此害手，但是，凡是在进退上处理不当者，大多不得好的下场。相反，处理得当者，却能名'
