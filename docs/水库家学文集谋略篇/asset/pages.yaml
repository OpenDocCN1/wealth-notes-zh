    # 人性分析：


    每个人都有不安全感，当你在众人面前展示自我、显露才华时，自然而 自然会激起各种各样的怨恨和嫉妒，以及别人的不安全感，这是可以预见的。你不可能一辈子都因在意别人琐碎的感受而忧心忡忡，但是对于于权位比你高的人，你必须采取不同的策略和方式。如果你想要获得权力，而你却盖过上司的光芒，这恐怕是最严重的错误。


    学成不知隐和藏，经书万卷泪两行。两条你必须认清的两条规则：'
