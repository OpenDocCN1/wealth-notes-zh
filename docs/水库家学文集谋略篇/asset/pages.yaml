- pgno: 163
  md: '在濠水桥上看见水里的鱼，庄子谈到鱼儿自在游水多么快乐，惠施问道：你不是鱼，从哪知道鱼的快乐？庄子闻言反驳：你又不是我，怎么知道我你不知道鱼的快乐？两人随后展开一段精彩的辩论。


    这两个故事，让不少人觉得庄子似乎喜欢谈论形而上、看来无解的议题，造成庄子思想出世、不食人间烟火的印象，和一般人的生活无关也派不上用场。


    相较于儒家，我认为庄子更加入世、更加热情。而且，在这个混乱的时代，正是时候读庄子。


    庄子思想比儒家更入世，乱国之明就带有积极治国的思想。


    为什么说庄子思想比儒家更入世？蔡璧名举例，《论语》里谈到危邦不入，乱邦不居，就孔子看来，有能力和资格做官救世的人，必要进入危急混乱的国度，可以避祸远走；孟子也说知命者不立岩墙之下，告诫弟子要远离危险。但庄子却说：治国去之，乱国就之，一个已经治理好的国家，你尽大可离开；但当一个国家非常混乱，反而要积极投身到那里尽力拯救。庄子期许自己是


    165'
