    # 藏中有变，变从藏生


    贞女韩式，保宁人。元末明玉珍据蜀，贞女虑见掠，

    伪为男子服，混迹民间。既而被驱入伍，转战七年，人

    莫知其处女也。后从玉珍破云南还，遇其叔父赎归成都，

    始改装而行，同时从军者莫不惊异。洪武四年嫁为尹氏

    妇，成都人以韩贞女称。


    原文：《明史》卷301《列女传一》


    娥姓韩，元四川盐运司副使韩新泽之孙、处士韩成

    之女也。母王氏，生于元至正乙酉。娥甫三岁失怙，

