  md: '质入内府商议，因恐有人知觉，乃用大瓮藏吴质于中，只说是绢匹在内，载入府中。修知其事，径来告操。操令人于丞府门伺察之。丕慌告吴质，质曰：“无忧也。明日用大箧装绢再入以惑之。”如其言，以大箧载绢入，使者搜看箧中，果绢也，回报曹操。操因疑修语害曹丕，愈恶之。


    操欲试曹丕、曹植之才干。一日，令各出邺城门；却密使人分付门吏，令勿放出。曹丕不至，门吏阻之，丕只得退回。植闻之，问于修。修曰：“君奉王命而出，如有阻当者，竟斩之可也。”植然其言。及至门，门吏阻住，植叱曰：“吾奉王命，谁敢阻当？”立斩之。于是曹操以植为能，后有人告操曰：“此乃杨修之所教也。”操大怒，因此亦不喜植。


    修又尝为曹植作答教十余条，但操有问，植即依条答之。操每以军国之事问植，植对答如流。操心中甚疑。后曹丕暗买植左右，偷答教来告操。操见了大怒曰：“匹夫安敢欺我耶！”此时已有杀修之心；今乃借惑乱军心之罪杀之。修死年三十四岁。


