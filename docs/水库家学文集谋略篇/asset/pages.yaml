- pgno: 227
  md: '# # 牵其忧患，控其行


    原文：


    “于是始皇问李信：吾欲攻取荆，於将军度用几何人而足？李信曰：不过用二十万人。始皇问王翦，王翦曰：非六十万人不可。始皇曰：王将军老矣，何怯也！李将军果势壮勇，其言是也。遂使李信及蒙恬将二十万南伐荆。王翦言不用，因谢病，归老於频阳。荆人因随之，三日三夜不顿舍，大破李信军，入两壁，杀七都尉，秦军走。


    “始皇闻之，大怒，自驰如频阳，见谢王翦曰：寡人以不用将军计，李信果辱秦军。今闻荆兵日进而西，将军虽病，独忍弃寡人乎！王翦谢曰：老臣罢病悖乱，唯大王更择贤将。始皇谢曰：已矣，将军勿复言！王翦曰：大王必不得已用臣，非六十万人不可。始皇曰：为听将军计耳。”《史记•卷七十三•白起王翦列传第十三》


    翻译：'
  merge: -1
  img_proc: true
- pgno: 228
  md: '秦始皇二十一年（公元前 226 年），秦王嬴政召集群臣，商议灭楚大计，王翦认为“非六十万人不可”，李信则认为“不过二十万人”便可打败楚国，秦王政大喜，认为王翦老不堪用，便派李信和蒙恬率兵二十万，南下伐楚，楚将项燕以四十万楚军应对二十万秦军。


    王翦因此称病辞朝， 回归故里，


    楚国将领项燕奉领楚军乘机积蓄力量， 尾随跟踪追击李信军队， 连续三天三夜不曾停息， 结果大败李信的部队， 攻入两个军营， 杀死七名都尉，李信军大败而逃。


    秦王政听到这个消息， 大为震怒， 亲自乘快车奔往频阳， 向王翦致歉， 并答应加兵请求， 王翦统领六十万大军启程，王翦出征时向秦王“请美田宅园池甚众”、“以请田宅为子孙业耳”，出关前，又连续五次求赐美田，
    连部下也开始担心会不会太过份， 王翦才说出了自己的用意秦王生性多疑，如今秦国全国士兵尽交到自己手中， 此时唯有向秦王诸多要求， 才可以表明'
