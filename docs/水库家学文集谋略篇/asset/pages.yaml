  md: '杨修又经常教曹植十多条怎么回答的好，只要曹操问他问题，曹植就依照杨修教他的地回答。曹操问曹植军国大事，曹植对答如流。曹操心中非常疑惑。后来曹丕暗地里买通了曹植府中下人，偷着来告诉曹操。曹操见了大怒说："匹夫居然敢来欺骗我"那时就有了杀杨修的心思，如今就借惑乱军心的罪名杀了他。杨修死时才四十四岁。


