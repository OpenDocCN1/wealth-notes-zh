  md: '但这也只是艺术作品的内容，不 能当真。但在历史上还 真有这样一个人竟然能和皇帝斗富，而 而且还 斗赢了。那么这个人 又是谁呢？


    # 最能炫富的人——石崇， 到底有多富？


    石崇， 字季伦， 西晋时期人。少年时便才 思敏捷， 为人十分 豪爽。传说石崇在肩膀骨下端的位置有一颗痔， 后人便将这个痔 命名为“巨富痣”。他的父亲是西晋王朝的大司马石苞。
    石苞去世时将家产都分给了石崇的几个兄弟，却没有给石崇留下一分钱，石崇的母亲哭老乞求丈夫也为石崇分一些财产，但石 苞却回 答 说： “石崇虽然 年纪小，但他以后能靠自己得到财富。”


    诚如他父亲所说，石崇的确是靠 自己攒下了大批财富。虽然 手段不太光明， 但石崇靠着担任荆州刺史时抢劫来往的客商，取得了大量的钱财，以此为基础，往来运作，身家倍增


    据《世说新语》所记载石崇不仅住的地方豪华奢靡，就连 厕所都修 建得十 分精致，在厕所中铺设了锦被，褥子、 垫子之类的，陈设装饰也十分讲究，其实我也不太明白'
