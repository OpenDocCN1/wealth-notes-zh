- pgno: 241
  md: '这才是 识人的一种独特的眼力与远见。


    后来，刘邦果然 率众反秦，夺取天下。而当年在刘邦之上的萧何等 人，则成了他的辅佐大臣。


    人性分析：


    从来 能把握天时、改变自己一生造就锦绣前程的人，


    一定是慧眼识真、善于发现奇才的人。 在具有奇特才能而又身遭 苦困的人面前，能识得对方的才华，又能给予其丰厚的恩惠，那么，自己 一生的财、权也就全盘具备了。


    # 牵其多疑，控其行


    东汉末年时期，刘备和孙权联合抗曹，曹操亲率八十万兵马进攻坚口。


    诸葛亮到江东与东吴都督周瑜共商破曹大计，决定由周瑜统率大军水陆御敌。大战前夕，曹操谋士蒋干过江访 周，欲以同窗旧谊劝周瑜降曹。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '周瑜料知蒋干来意，盛情款待，叙礼毕，坐定，即传令悉召江左英杰与子翼相见。须臾，文官武将，各穿锦衣；帐下偏裨将校，都披银销；分两行而入。瑜都教相见毕，就列于两傍而坐。大张筵席，奏军中得胜之乐，轮换行酒。


    瑜告众官曰：“此吾同窗契友也。虽从江北到此，却不是曹家说客。公等勿疑。


    遂解佩剑付太史慈曰：“公可佩我剑作监酒；今日宴饮，但叙朋友交情；如有提起曹操与东吴军旅之事者，即斩之！”太史慈应诺，按剑坐于席上。蒋干惊愕，不敢多言。


    周瑜曰：“吾自领军以来，滴酒不饮；今日见了故人，又无疑忌，当饮一醉。”说罢，大笑畅饮。座上觥筹交错，饮至半酣，瑜携于手，同步出帐外。左右军士，皆全装惯带，持戈执戟而立。


    瑜曰“吾之军士，颇雄壮否？”


    干曰：“真熊虎之士也。”瑜又引干到帐后一望，粮草堆如山积。'
  merge: -1
