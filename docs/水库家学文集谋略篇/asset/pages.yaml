    结果就是我们最后所看到的， 文种死不见目， 范蠡继续逍遥。这其中最根本的原因还是在于范蠡和文种两个人对于生活和人性的理解不同， 选择不同， 最后导致命运不同。范蠡知道什么是“有舍才有得“，而
    文种却"重得而不舍”。


    范蠡的大智慧究竟是什么？


    范蠡（公元前 536 年一公元前 448 年）， 在帮助勾'
