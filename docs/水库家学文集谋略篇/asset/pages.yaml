- pgno: 306
  md: '刘巨塘来不及出府，被关在严府中，时近中午也无人安排酒食。他饥渴交加，只得在府中乱转。


    这时，严家的仆人严辛出现了，他把刘巨塘领到自己的住处，用丰盛 的酒食招待他。严辛还对刘巨塘说：


    “我家主人怠慢大人了，小人若能让大人不责怪我家主人，小人就稍感安心。”


    刘巨塘十分惶恐，忙道 “我官小职微，无足轻重蒙你家主人接待，已万感荣幸了，哪敢责怪呢？你切不可这样说，否则我承受不起啊。”


    严辛见刘巨塘脸色全变，于是一笑，他出口道：“大人远道而来，诚心祝寿，却无端被困，酒食无着，大人真的没有怨言吗？”


    刘巨塘生怕严嵩有意让严辛试探自己，马上室申说：“你家主人日理万机，他的身体全系国家安危，纵是你家主人不善加保养，我等也会极力劝奉。我真心为你家主人祈福，哪有怨言可发？你太多心了。”


    严辛摇头说：“此地就你我二人，大人不必讳言了。我虽为严家仆人，但也知世故人情，故而和大人倾心交谈。”


    刘巨塘听来，不明其意，只好道：“你有何意，请直接讲来，我决不外传就是了。”'
  merge: -1
