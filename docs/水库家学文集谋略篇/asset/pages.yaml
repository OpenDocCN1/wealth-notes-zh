  md: '他不是一直寻找机会巴结太后吗？ 有机会送礼却又为何不送了？明明说好 的是送子鱼，秦桧为何送去了一百尾腌青鱼呢？秦桧这样做岂不是很愚钝？ 他当然不傻，要不然他不可能那么奸诈，他如此做，正说明了：愚钝，未必是真傻。


    先来着看太后看到腌青鱼后的反应。 太后见了腌青鱼，不仅没生气，还哈哈大笑道：我就知道这婆子胡说，宫中都没有的东西，相府里又怎么会有呢？听了太后的这句话，就不得不佩服秦桧的奸诈。


    秦桧就是再位高，也不可能 有皇帝的位置高，秦桧就是再权至，也不可能有皇帝的权力至，秦桧就是再有钱，也不可比皇帝还有钱。 因为他是皇帝的臣子，奸臣也罢、忠臣也罢，位置决定了他必须比皇帝差一等。
    因此，皇帝有的东西，他不一定有，皇帝没有的东西，他一定不可以有。 否则，这就是个事儿！ 事情大不大？大，而且很大。


    如果秦桧傻乎乎地为自己比皇帝更富裕而沾沾自喜， 那他就离死不远了。'
