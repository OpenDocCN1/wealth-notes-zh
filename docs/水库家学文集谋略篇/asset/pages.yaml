- pgno: 249
  md: '劳，且兵力雄厚，处于优势和主动地位。反观韩信，麾下只有万余之众，且系新募之卒，行了很长的路程，人和马都很累，当时正处于不好的状态和被动的地位。


    赵军谋士李左车向陈余建议：正面避而不战，用一部分兵力绕到敌后切断汉军粮道，使韩信彼前不得斗，退不得还，吾奇兵绝其后，野无所掠卤，不至十日，两将之头可致戏下，最后前后夹击，一战而擒韩信。但陈余却是一名崇尚正面攻击的古典派军人，拘泥于义兵不用诈谋奇计的教条，且认为韩信兵少而疲，不应避而不战。


    李左车的建议被他拒绝了，执意地遵从兵书上吾闻兵法，十则围之，倍则战的公式而去行事。


    韩信深谋远虑，双方兵力相差悬殊是众所周知的。如采用强攻，必会受挫，于是决定在离井陉口很远方驻留下来，反复不断地研究地形地势和赵军部署。当韩信探知李左车的计策没有被采纳，赵军主帅陈余有轻敌情绪和企图速决的情况后，立即指挥部队进到离井陉口三十里远地方扎下营来。半夜时分，韩信选拔了两千轻


    251'
