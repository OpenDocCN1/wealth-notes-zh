  md: '不甚用力。到底是郑将出力，人人奋勇，个个夸张。就中颍考叔，因公孙阂夺车一事，越要施逞手段。到第三日壬午，考叔在略车上，将“骜弧，大旗挟于胁下，踊身一跳，早登许城。公孙阂眼明手快，见考叔先已登城，忌其有功，在人丛中认定考叔，陡的发一——冷箭。也是考叔合当命尽，正中心，从城上连旗倒跌下来。


