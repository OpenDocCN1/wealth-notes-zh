  md: '叔母杜氏度娥不能自保，密谓娥曰：“我夫妇老矣，汝年十二，必遭寇手。吾不忍视汝受掠，吾制男子衣裳，汝可服之。寇知汝男，或可免。”叔父又哭曰：“汝本故官之孙，吾鞠汝汝汝，愿汝有家，不幸至此，时也命也！汝宜自裁。”


    娥受叔母教，即易其服，总其角。旦日往拜叔母，曰：“而今而后，或违母训，有死无二。岂忍不念吾叔母言，甘受寇辱求苟活耶”


