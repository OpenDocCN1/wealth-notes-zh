  md: '到目的，还可能碰得头破血流。


    后退就得有牺牲。中国象棋中有“丢车保帅”一招。丢了帅，就等于认输，因此为了保帅，丢车是在所不惜的。


    东汉末年，汉献帝被叛军软禁在长安，他利用一个机会逃了出来，奔向洛阳，叛军骑兵紧追不舍。此时老臣董承提议把身上所带的金银财宝都扔到路上，最后连皇后的首饰都扔掉了。


    追兵看到地上的财宝，都跳下马来捡取，军官叱责也无用。因为他们捡到的财宝足够用一辈子了。这样汉献帝得以保全生命，逃到洛阳。


    # 春风得意时，莫忘厚雪埋乌鸦


    并不是什么船都能带你脱离“惊涛骇浪”的冲击，如果你不幸找了艘又小又破的旧船，可能两个浪头打来你就船翻人覆去海底喂鱼了。所以找“船”一定要练就一双慧眼，一是要“快”——“台风”未到时，找条船先逃之夭夭；二是要“准”——找条坚固结实，能够劈波斩浪的巨舰。有了这两手，什么大浪都对你无可奈何'
  merge: -1
