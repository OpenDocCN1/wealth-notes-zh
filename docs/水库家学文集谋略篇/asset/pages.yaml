  md: '然后让人走家中拿出三 四尺高的珊瑚树六七棵任王恺挑选。言下之意你 “牛叉” ， 我比你更 “牛叉“。


    互相斗富炫耀的结果，使国家失去了建国之初励精图治的光芒，整个社会变得越来越腐朽，处处透露出一股霉烂的气息。在短短只有51年的国祚里，动乱、政变，接二连三，几乎没有消停过。
