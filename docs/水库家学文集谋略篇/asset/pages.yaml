  md: '略和指挥艺术。


    # 小变于人，大变于境


    李斯列传原文：


    李斯者，楚上蔡人也。年少时，为郡小吏，见吏舍厕中鼠食不絜，近人犬，数惊恐之。斯入仓，观仓中鼠，食积粟，居大庑之下，不见人犬之忧。于是李斯乃叹曰：“人之贤不肖譬如鼠矣，在所自处耳！”


    乃从荀卿学帝王之术。学已成，度楚王不足事，而六国皆弱，无可为建功者，欲西入秦。辞于荀卿曰：“斯闻得时无怠，今万乘方争时，游者主事。今秦王欲吞天下，称帝而治，此布衣驰骛之时而游说者之秋也。处卑贱之位而计不为者，此禽鹿视肉，人面而能强行者耳，故话莫大于卑贱，而悲莫甚于穷困。久处卑贱之位，困苦之地，非世而恶利，自托于无为，此非士之情也。故斯将西说秦王矣”。


    李斯列传翻译：'
  merge: -1
  img_proc: true
- pgno: 253
  md: '李斯是楚国上蔡人。他年轻的时候，曾在郡里当小吏，看到办公室附近厕所里的老鼠在吃脏东西，每逢有人或狗走来时，就受惊逃跑。后来李斯又走进粮仓，看到粮仓中的老鼠，吃的是积积的粟米，住在大屋子之下，更不用担心人或狗惊扰。于是李斯就慨然叹息道：“一个人有出息还是没出息，就如同老鼠一样，是由自己所处的环境决定的。”


    于是李斯就跟荀子学习帝王治理天下的学问。学业完成之后，李斯估量楚王是不值得侍奉的，而六国国势都已衰弱，没有为它们建功立业的希望，就想西行到秦国去。在临行之前，向荀子辞行说：“我听说一个人若遇到机会，于万不可松懈错过。如今各诸侯国都争取时机，游说之士掌握实权。现在秦王想吞并各国，称帝治理天下，这正是平民出身的政治活动家和游说之士奔走四方、施展抱负的好时机。


    地位卑贱，而不想着去求取功名富贵，就如同禽兽一般，只等看到现成的肉才想去吃，白白长了一副人的面孔勉强直立行走。


    255'
