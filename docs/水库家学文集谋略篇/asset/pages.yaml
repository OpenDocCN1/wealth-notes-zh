    明日，智伯以疵之言告二子，二子曰：“此夫谗人欲为赵氏游说，使主疑于二家而懈于攻赵氏也。不然，夫二家岂不利朝夕分赵氏之田，而欲为难不可成之事乎？”二子出，疵入曰：“主何以臣之言告二子也？”智伯曰：“子何以知之？”对曰：“臣见其视臣端而趋疾，知臣得其情故也。”智伯不悛，疵请使于齐。


