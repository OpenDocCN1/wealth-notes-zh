  md: '元朝末年，兵荒马乱，贞女担心会被掳掠，便打扮成了男性，被盘踞在四川周玉珍的军队追赶入伍，在军队行军作战达七年之久，从未被人察觉。后来她随军队破云南，归来时遇见了分别多年的叔父，才和叔父一起回到成都，恢复了女性装束。她在军队里的“兄弟们”听说后去看她，无不惊奇。明朝初年，贞女嫁给一尹姓人家为儿媳妇，仍还是处女，所以成都人把她称之为“韩贞女”。


