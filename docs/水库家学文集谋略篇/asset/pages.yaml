- pgno: 240
  md: '当时，刘邦不过是个小小的亭长，身无分文，进门后却高喊“贺礼万钱”。众人大吃一惊，吕公却深以为奇，他仔细端详刘邦的相貌和气度，颇有出众之处，对他十分敬重，不顾众人猜忌的目光，径直将刘邦引入上座。萧何对此十分不满。他认为刘邦好说大话，成事不足，败事有余。


    刘邦却谈笑自若，不时对那些贵客流露出轻蔑的神色。酒宴快要结束时，吕公特意挽留刘邦，他对刘邦说：


    > “臣少好相人，相人多矣，无如季相（刘邦字季），愿季自爱。臣有息女愿为箕帚妾。”意思是想将自己的女儿嫁给刘邦为妻。吕公的夫人得知此事后，直埋怨吕公说，你经常说我们的女儿气质不凡，将来一定会成为贵人。沛令向你求婚，你都没有答应，怎么会许给刘季这样一个人呢？吕公不予理睬，终于将吕雉许配给刘邦。


    在吕公看来，刘邦除了相貌和气度不凡外，他的豁达大度、不拘小节，表现了藐视传统、官吏富豪的大家风度，认定刘邦将来一定大有作为。知人于未显之时，'
