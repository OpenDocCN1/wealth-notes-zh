  md: '不能饮，饮辄病。甲益至之，娥尤兢兢业业，惟恐有失，而违叔母训。出入军中，一十二年，人皆不能窥测。又善以父事甲，故甲信而不疑。甲尝谓人曰：“我之关保，干蛊之子也。为之婚娶，冀其成立。娥不得已，从，而百计避之。妇诉其父母，父母责娥夫妇不睦。娥犹隐讳不言。


