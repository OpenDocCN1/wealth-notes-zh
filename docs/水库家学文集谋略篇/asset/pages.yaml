  md: '严辛的一双慧眼和果断的出手为自己日后的身家性命的保全赢得了机会。


    他作为一个仆人来说，自是无法结交”上流社会”的，所以在适当的时候抓住机会，买了一张日后登上刘巨塘这艘“大船”的“船票”。


    他未雨绸缪，提前几年就已作好准备，这就显示了他出手之快；他看人并未走眼，知道刘巨塘日后必有发迹，能够在适当的时候“罩“得住他，从这一点也可以看出他看人之准。


    出手快，看人准，能同时做到这两点之人，避开祸患已是不成问题，适当的时候有适当的机会，能成就一番事业也未必不可能。做人多点“心机”对任何人来说，都不会是坏事。


