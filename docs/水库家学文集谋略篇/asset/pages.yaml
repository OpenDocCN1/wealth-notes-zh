    有个叫李英的小伙子，也是贩卖香料的，与他结伴同行一年有余，相处甚好，但未能察觉她是女性。后来黄善璐去南京看望她的姐姐，姐姐已经认认她认不出了。经解释后，姐姐怒骂道：“你这样胡来，跟男人们搅和在'
