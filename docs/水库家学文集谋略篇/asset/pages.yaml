    忘记 了他的地位是统治者给的， 以为是靠自己的努力取得的。这是杨修对自身价值和至要性不可饶恕的错误估计，他 为此付出了生命的代价。


    一定要记住： 永远不要以为自己的地位是理所当然的， 千万不要让你得到的恩宠冲昏了头脑。


    知道了盖过上司光芒的危险性，你就应 该转化运用，让它对你更有用， 首先你必须奉承你的上司， 让他飘飘然踌躇满志 公开的奉承吹捧可能有效果，但 也有局限性，
