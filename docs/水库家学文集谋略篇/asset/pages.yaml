  md: '是当别人对这东西或人表示重视与兴趣，你又会对这东西或人感到珍贵和敬重起来，并且还会怀疑自己不想要或不敬重的判断是否正确；如果这“别人”又是个不愿和你合作的人，他的重视就带有示威和羞辱的意味，于是这种种感觉又要加上面子问题，因此多半会改变当初“不想要”的主意——苏秦嫂子或许也有这样的困惑和挣扎吧！多以一个人改变别人看法的最好用以下两种方式是改变现处环境。


    一是，作为一个没有背景的普通人，要想改变命运，首先要有丰富的知识。知识改变命运。其次要把自己的知识同时代背景结合起来，站对了风口，猪都可以上天。要注意关注社会，关注国家发展。然后利用自己的知识从中掘得财富。


    二是，普通人的进阶路程是：先求富，再求贵。“富贵”一词，说的富和贵是连在一起的，密不可分的；另外，先有富，再有贵。所以，对于一个普通青年来说，人生第一要务就是挣钱，有了钱，才能有其它。


