- pgno: 246
  md: '之鬼， 挥之不去。


    这世界有的人很容易忘记伤害，有的人永远不会忘，  这种疑，会成为心中之鬼，这个鬼不知何时何地，  会跳出来，  伤及无辜。


    自古以来有句话，疑人不用，用人不疑，而懂这句话， 并非易事， 曹操是奸雄，是计谋，是权谋， 而对于普通人， 疑心又毁了多少人的幸福。


    多少夫妻因为猜疑， 从无比恩爱， 到反目成仇，全是 因为捕风捉影。


    如果没有他人设计，尚且无中生有， 若有人故意设计， 又当如何，后果更是不堪设想， 这世界因谣言杀妻的还少吗？


    劝世上人， 我做不了奸雄， 也切莫做疑心之人， 害人害已害亲人， 及醒悟时， 怕已来不及回头！'
