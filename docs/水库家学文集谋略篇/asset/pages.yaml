  md: '剧中的小丑一样，为大家表演。他们的贡献是巨大的，可以启迪许多人的理性思考。他们对于团体的学术或者政治贡献， 逐渐演为负值了。其中一个原因就是，这些人过于贪婪，迷恋于唯我独尊的感觉，迷恋于说一不二的快感，迷恋于操纵事态的玄妙中。


