- pgno: 250
  md: '骑，每人带一面汉军的红旗，趁天黑悄悄从山间小道迂回到赵军大营的侧后方埋伏，等翌日见赵军出动，营垒空虚之时，攻入赵军大营，把赵军旗帜拔下，插上汉军旗帜。随后，韩信传令部队就餐，他对将校们说：少餐即可，待天明破赵之后弄饱餐，将校们半信半疑，只好听命于他。


    韩信遂即传令击鼓，出大将旗仗，向井陉口出发出兵，他说：赵军早就占据了有利的地形，筑垒以侍，看不到大将旗仗，怕他们怀疑我还在后军，不肯发起进攻。


    汉军快到井陉口时，韩信连骑啁都不派，立即传令中军主力全部前出到河边背水列阵，营垒上的赵军远远见汉军背水列阵，没有路可逃，于是就纷纷讥笑韩信不懂兵法。


    不时，天色已然大亮，汉军阵营扬起一阵轻尘，随着激越的鼓声，一队旗仗转出，韩信在众将校的簇拥下纵马来到底前。陈余眼见韩信兵少，自己又占据有利地势，于是率轻骑锐卒蜂拥而出，欲生擒韩信。


    韩信令弃旗鼓仗，迅速转入阵中，陈余见此情景，'
