- pgno: 7
  md: '道可传，术已用，以术传道，名利双收。


    鲁国的法律规定：如果有谁能将那些做了诸侯臣妾的鲁国人赎回的话，可以从官府拿回赎金和奖金，有个人就真的从诸侯那里赎回一个鲁国人，但他却不肯接受按规定可领取的赎金和奖金。于是这个人的老师就说：他的做法错了，这位老师还有一名学生，一次这名学生救了一名溺水的人。被救的人为了感谢他，就送给他一头牛，这名学生推辞一下就收下了，这回老师很高兴。


    学生爱护本国人民，把人从诸侯那里赎回来，不计较金钱，这是多么崇高的一种行为啊？可这位老师却因为学生没有接受赎金而不高兴。而另外一位学生，救了别人却收下被救之人的礼物，本以为是一件见义勇为的事情，结果原来却是贪图人家的报答，这不是施恩图报吗？而这位老师居然高兴得不得了。


    这位老师是不是见钱眼开？是不是唯利是图？没有崇高的风节，没有令人敬佩的举动，却满身铜臭，这位老师是不是俗不可耐？'
  merge: -1
  img_proc: true
- pgno: 8
  md: '但如果您知道这位老师是谁，相信就不会这样认为了。这位俗不可耐的老师，正是子曰的孔子，那赎人的学生是子贡，收牛的学生是子路。孔子是什么样的人？这个问题显然不需要回答，那是圣人，恐怕再没有比他更有资格享受崇高这一评价的了。既然是孔子说过的话，想必是有一定道理的，那他的道理在哪里？


    孔子因子贡赎人不收赎金的事情而不高兴，他说：


    圣人的行事可以移风易俗，教化百姓，不不只是自己的行为高尚就行了。当今鲁国富人少穷人多人，拿回赎金并不损害自己的道德，不拿回赎金就不能鼓励其他人来效法了。而当他明伦，未必不化俗听到子路救人收牛的事情后，高兴地说：以后一定会有很多鲁国人勇于拯救溺水者了。


    本以为高风亮节的子贡，没顾及自己的行为对别人有何影响，他错就错在他以为自己是是一个人在战斗。鲁国之所以要发表这样的法律，就是希望有更多人能够去回应。但制定法律的人也知道，趋利避害是人的本性，因此才会提出给奖励。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '现在子贡做了好事，把人从诸侯那里赎回来了，结果他却不愿意去领奖金。他自己已成为道德标杆了，可没想到这会带来怎样的影响。想想吧，不是所有人都这么崇高的，如果有人为了奖励做事，现在因为子贡这样高风亮节，其他人还好意思去要奖金吗？


    那这个奖金都等于没有提出过，那肯去赎人的人就会少了很多，那不就意味着会有更多的鲁国人要做人家诸侯的臣妾了吗？这里有人“赎”有“赎”就有“卖”，被卖了去做老婆的人，不就是掉火坑里了吗？


    因此看似高风亮节的子贡，其实是把很多有希望从火坑里爬出来的人又给推下去了。正因如此，孔老夫子才会不高兴的。


    同样的道理，子路救人后收礼物，其实也是给这个行为立了一个道德标杆。这个标杆尽管看似不怎么道德，但却给了更多人舍己救人的理由。因为救人之后可以名正言顺地收礼物，送礼的人因为捡了一条命，所以虽然送点礼物也不见得有什么不愿意的。而且需要注意的是：子路并不是自己索要礼物，而是人家想送礼物意'
  merge: -1
  img_proc: true
- pgno: 10
  md: '思一下，他也就领了个意思。


    从这点来说，这个标举还有一定道德意义的，也就是说：救人后，如果被救的人愿意感谢，就可以得些实惠如果不感谢，救人的人也没有什么损失。正因为有他这个宣告作用，所以孔子才说：以后一定会有很多鲁国人勇于拯救溺水者了。


    每个人的行为都不是单一的，都会产生一定的影响，因此，不应该只着眼“行为标杆”？这个“标杆”会产生什么样的社会趋势？ 这样的事情会产生什么样的利害影响？ 拯救溺水者也好，救赎被卖的人口也罢，都可以上升到伦理道德的范畴。


    伦理道德，这是个大事。但这样的大事情在孔子眼中又都是小事，因为在他看来这是个风气的问题，而风气可以通过标杆人物的标杆行为来影响。套用一句很有名的话来说：这个世界本没有风气之说，做得人多了自然有了风气。就如子路一样，经他的标杆之后，鲁国勇于拯救溺水者的人也就多了，这样的事情做得人多了，也就成了一件自然的'
  merge: -1
  img_proc: true
- pgno: 11
  md: '事情，这样一个伦理道德的事情，就渐渐成了一种风俗，一种大家都能接受的行为准则。


    所谓：明伦，未必不化俗。以更符合大众价值观念的标杆行为来倡导教育，更利于改变风气。


    从这个角度来看，就明白为什么孔子对于子路的行为更加赞许了，因为他的行为要比子贡更利于引导百姓行善举，而这正是最大的善举。懂得这个道理的，不仅有圣人，很多人都明白这个道理。


    后汉有个叫贾彪的人，因为孝顺廉洁，被郡国推举为孝廉，而后做了县太爷。偏巧没过多久，县里就同时发生了两件案子。一是 - 伙强盗在城南劫财杀人，二是城北有个妇人要杀死新生儿。


    有案子，贾彪自然要去查办，属下就问去城南还是城北，贾彪生气地说：强盗害人是常有的事，母子相残却背逆天道。于是赶赴城北，查办妇人的罪，当时城南的盗贼听说此事后，纷纷良心发现，主动来自首了。


    明确了伦理道德，不好的行为也会受到改变，可见，'
  merge: -1
  img_proc: true
- pgno: 12
  md: '明伦，未必不化俗。 不过此处的化不是演化而是化解，俗不是民俗而是不好的事情。 贾彪以伦理道德为基准， 认为没有任何事情比违反道德更严重的事情了， 这才能让更多的人明白伦理的重要意义。


    如果说贾彪先抓盗贼， 而忽视伦理惨案， 那么， 只  会有更多类似的伦理悲剧发生。


    用明确伦理道德来化解不好的行为， 引导其他人向 善靠拢，元朝的何直和宋末太祖赵匡胤也都明白。 元顺帝至正年间，广东有王成、陈仲玉作乱， 何直率领义兵擒拿  了陈仲玉。
    而王成却建筑营寨防守，围攻了很久都无法攻 破。


