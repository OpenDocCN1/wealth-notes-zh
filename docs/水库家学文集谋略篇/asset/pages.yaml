  md: '第一， 只是自然本色地展现你自己，你 就有可能不经意地抢过上司的风头。如果生来魅力迷人、才华出众， 你就必须学会避开虚荣心过强的人， 或者找到适当的方法，在曹操这样的人面前隐藏你美好的资质。


