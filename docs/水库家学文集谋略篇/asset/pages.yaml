  md: '商朝的殷纣王昏庸至极，经常在酒池肉林里狂欢醉饮。有时候，他喝得都糊涂了，甚至连日子都忘记了。一天，殷纣王又喝多了，忽然想知道今天是几月几号。他自己想不起来了，就问左右的侍臣，他们也都喝得忘记了今天是哪天。于是殷纣王就派人去问箕子。箕子没喝酒，正在家里侍老呢。听到使者问他今天是几号，他忽然拍拍脑袋说：我也是刚刚醉酒睡醒，我也想不起来今天是何月何日了。


    青天白日的没喝酒，居然不知道今天是哪天，箕子够愚钝吧？但前面讲了：


    愚钝，未必是真傻。他能做到朝廷重臣，肯定不可能是傻子，那他为什么要这样说呢？其实这正是其聪明的地方。世人皆醉唯我独醒，这得分在什么时候，面对什么人。别人都不知道，就你知道，你怎么就那么特别？殷纣王都不知道的事情，他箕子知道，难道你比殷纣王还聪明些？如果面对一个明君，未必是真傻也就聪明了，臣子都聪明做君主的高兴还来不及。但他现在面对的不是明君，那聪明过头就会让人看老不顺眼了。我们都'
