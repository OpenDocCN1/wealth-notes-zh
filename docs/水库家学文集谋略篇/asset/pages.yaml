- pgno: 77
  md: '长计议再北伐。这一政策从诸葛亮一意北伐，劳民伤财致使国家衰落的结果来看是正确的。诸葛亮死后，魏延与杨仪争权不和，这是刘禅独立后面对的第一件难题。魏延造反却表杨仪造反。


    刘禅听完魏延表奏，马上提出疑问，曰：


    “魏延乃勇将，足可拒杨仪等众，何故烧绝栈道？ 后魏延被杀，刘禅将杨仪废徙汉嘉郡，同时 以蒋琬为尚书令，总统国事，使动荡的局面很快稳定下来。为了防止权臣权力太重，刘禅以费玮为尚书令和大将军，
    主管政务，以蒋琬为大司马 主管军事，两人的权力相互交叉，相互牵制，但又各有侧至。”


    研读这一系列措施，营中窥豹，可以了解刘禅智慧、果敢的一面。难怪南朝史学家裴松之评价后主之贤，于是乎不可及。


    刘禅不仅贤，《三国志》的作者陈寿对刘禅有这样一句评价：后主任贤相则为徧理之君。什么是徧理？ 直白点解释就是挭明白事的。'
  merge: -1
