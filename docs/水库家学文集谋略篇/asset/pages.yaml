- pgno: 248
  md: '谋不可预先周全，借机而变化，依事而变通。


    西元前 206 年， 雄霸一方的秦帝国灭亡后， 中 国 历 史进入了一个新的阶段。当时西楚霸王项谓和汉王刘邦，分 别 形成了两个新的素团， 双方为争夺天下，展开了历史上
    有名的楚汉战争。


    在这场历时近五年的战争中，汉大将韩信表现出了 连百万之军，战必胜，攻必取的卓越智谋和用兵韬略， 其战 绩堪 称 军亭 史上的奇观，井陉之战则是他辉煌战例 中的精粹，
    也是这 一战略计划的重要环节之一。


    汉高祖三年（西元前 204 年）十月， 韩信率一万余 新召来的汉军穿过太行山， 向东行进，去攻打项谓的附属 国赵匡 赵王歇和赵军统帅成安君陈余案中二十万兵力
    于太行山区的井陉口（今河北井陉东），占据有利地 形， 准备与韩信决战。井陉口是太行山八大隘口之一， 在它以西， 有一条长约百里的狭窄通道， 很难 攻打，不
    利于大部队行动。


    当时，赵 军先机扼 守住进 陉口，居高临下，以逸待'
