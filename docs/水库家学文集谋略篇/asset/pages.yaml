    # 人性分析：


    我们平时会表现的很单纯， 什么 东 西都光想到好的 一面，被理想的目标一时间冲昏了头脑，忘 记了 这样做不 好的一面。


    其实我们无论做什么事情都会有双面性的，有时我 们选择了这样去做只是因为事情利大于弊。


    有时我们也应该在权衡了事情的利弊后，不顾一切的 向前冲，毕竟我们没有什么顾虑，轻装上阵要好发挥。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '可是人心巨测，世事难料，无论在职场还是官场中，由于竞争和嫉妒，往往在我们希望很大的时候也就是最危险的时候，也许就有些人在背地里暗算你，而且这种事情也是我們最不容易想到的，我们当时只想老怎么去快点成功，成功后要怎么去庆祝呢。


    所以在我们得意的时候一定要防着点。


    人际交往中，我们常常会听到一些类似的话：


    害人之心不可有，防人之心不可无。


    防小人不妨君子。


    确实我们好好的对待别人，可别人在背后剔你一刀的滋味绝对不会好受，所以我们平时在跟别人的交往中要认真去观察每个人，去了解他们，了解他们的人生观、价值观，了解他们的内心想法，把握他们的心理动态，要对其将要行为有所判断与预防。


    要想在关键时刻顺利点，我们平时跟别人的交往中就要注至对别人的把握。


    要想对别人很好的把握，我建议自己掌握一些，自己吃的特别透彻的观点，问題和对某些突出事情的做法，'
  merge: -1
  img_proc: true
- pgno: 179
  md: '以便通过他们对这些观点的看法，问题 的处理或事情的做法来把握他们。关键是我们对要测试的问题了如指掌，别人怎么做我们就能吃透他们的心里。


    在把握了每个人的心里之后，我们就 可以很容易的控制住他了，而且也应该知道在什么情况下防那些人了。


