- pgno: 275
  md: '执政者的职责，也是兴利的基础和前提。人在实施趋利避害本能的过程中，是以自我为中心的，在选择获利的方式和途径上，首先考虑如何以最小的损失获得最大的利益，而利弊的总量是有规定性的。自己收获多，别人就会变少；人类攫取无度，自然界就会遭受破坏。更不用说那些巧取豪夺的鬼把戏了。


    时代不仅需要为民兴利的全新理念，也需要西门豹治邺的精神；百姓既拥护广施善政的公仆，更呼唤众多敢于除弊的执政者。'
