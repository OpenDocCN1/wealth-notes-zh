- pgno: 229
  md: '自己除了金钱以外别无他求，借此消除秦王怕他拥兵自立的疑惧。


    # 人性分析：


    在秦国扫六合的过程中，关于灭楚的人选秦始皇还是纠结了一番的，当时的他有两种选择，一种是老将王剪，称给他 60 万士兵，而李信则是称只要 20 万就能灭楚，最后秦始皇选择了李信但是却大败而归。灭楚之战，秦始皇在王剪和李信之间，为何选择了后者？


    # 利益计算


    60 万大军是秦国当时能够支出来的最多的军队，也就是说秦始皇想要灭掉楚国，必须把全国所有的兵力全部交给王剪！一下子让秦始皇犯难了，我要把全部的军队交给一个将军，万一这个将军打败仗，或翘半途谋反了，那我这个国家不就完蛋了吗？


    所以感觉有点儿不靠谱，就说了一句老将军看来是老 了，年纪有点大了，做任何事情，感觉有点考虑过多，就问了青年将军李信，很显然，李信是一个少'
  merge: -1
  img_proc: true
- pgno: 230
  md: '壮派，他觉得灭掉楚国怎么需要 60 万大军 20 万大军足够。秦始皇想了想，20 万大军，我先让李信出去试一试，万一成功了呢？毕竟两利相权取其至，两害相权取其轻。


    # 忠诚大于能力


    年轻人捞取资源的方法就是忠诚与勇敢，李信深知，在秦始皇试探王翦过程中找到了可乘之机，无论是社会还是职场，只要是在底层，什么资源都没有，如何在社会上生存，就必须用自己的能力和忠诚去立足，以为能力能够为组织带来利益，而忠诚能够为权力带来利益，只有这样才能够被留下，可以说不懂的这些，就基本上没有什么前途，只能拿点基本工资活老。


    这场战争李信失败了，但秦始皇也没有过多的把罪责推到他的头上，而是一已承担了之前战败的所有责任，在这之后，李信军队出征齐国等其他国家立下，赫赫战功，飞将军李广正是他的子孙之一。


