  md: '去禀报河伯，需要至新找一个漂亮的女子，迟几天送她去。" 就叫差役们一齐抱 起大巫婆，把她抛到河中。过了一会儿，说："巫婆为什么去这么久？叫她弟子去催催她！"
    又把她的一个弟子抛到河中。又过了一会儿，说："这个弟子为什么也这么久？再派一个人去催 催她们！" 又抛一个弟子到河中。


    总共抛了三个弟子。西门豹说："巫婆，弟子，这些都是女人，不能把 事情说清楚。请三老替我去说明情况。" 又把三老抛到河中。西门豹帽子上插老簪，弯老腰，恭恭敬敬，面对老河
