    # 人之大忍，龟藏深海


    263年，魏国分三路进攻蜀汉，魏将邓艾抄小路攻 入蜀中，后主刘禅派诸葛亮之子诸葛瞻阻击邓艾，没想到 诸葛瞻却战死在绵竹。通过这道防御后，魏军直指成 都，而姜维率领的蜀军主力还在剑阁驻守。


    刘禅连忙召集大臣们开会商议，意见无非两条：投 降或者逃跑。光禄大夫谯周力主投降魏国，刘禅采纳谯魏 的建议，反缚自己双手出城投降邓艾，并根据邓艾的命 令，下令蜀军全部投降。


    蜀亡后，刘禅移居魏国都城洛阳。一天司马昭与刘禅 喝酒，特地安排乐师演奏蜀地音乐，刘禅的随从听了'
