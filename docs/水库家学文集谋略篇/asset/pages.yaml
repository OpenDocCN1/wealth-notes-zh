    # 结语


    此材料到此就结束了，年轻时的我喜欢收藏故事，一个人故事看多了，见的事就的多，见的事多了，思路就多了，思路多了，事 就好办了。


    套用《传谟书》中的一句话 " 已有之事，后必再有；己行之事，后必再行；日光之下，并无新事"。


    从古至今，变的只有环境，人性从未变过， 大的智慧依赖环境做出治理，小的智慧根据人性进行牵制， 材料中 将“忍”和“癫”放 在文章开头讲，是 因为 人有隐藏自己的本性，才能观察出敌人的弱点，进行牵制。


    故事一说再说， 现在人为何百读不解。


    感谢大家的支持，端午安康'
