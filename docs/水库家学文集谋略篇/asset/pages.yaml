- pgno: 71
  md: '因此没有必要成为上纲上线的民族大义。


    刘禅虽然是亡国之君，但亡国不是他之罪，更非他所愿，没有任何一个皇帝愿意自己亡国。虽然刘禅最终选择了“自缚投降”，在那样的情形下换做是我们又能如何？号召人民奋力抵抗？有抵抗的余地吗？痛骂魏国“帝国主义侵略”？有用吗？即便是战死、英雄般倒下又有什么用？除了给中国历史留下光辉一笔之外，能够解决当时百姓即将为鱼肉的问题吗？能够对蜀国起到哪怕是一点有“建设性”的意义吗？


    中国几千年历史朝代更迭，所谓逐鹿中原，大都是兴，百姓苦。亡，百姓苦。舍得一身别很容易，但不管遇到什么事，都拼自己的命，别拿他人的命做挡箭牌。可又有多少所谓正人君子，打着仁义道德的幌子，卖老百姓的命，保的却是自己的荣华富贵。虽然刘禅在历史上显得那样没有气节，但他却给了蜀国人民最大的利益：民生，难道这不是一国君主应该为之奋斗的首要目标吗？在危难关头，舍弃自己而使国家人民得以保全。


    如此决策，比那些为了一己私利，就不断地鼓动老'
