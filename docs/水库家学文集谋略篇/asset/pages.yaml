  md: '于首级数量。如果下面想升官的人，不贿赂这些小吏他们就会出难题了。等到军官的业绩报告送上来，他们就把报告中的首级数量涂抹，然后再按原数字填回去。这样他们就以字有涂改，按规定必须严查为借口，把这个事情就给压下来了。如果下面官员还不贿赂他们，他们就以回查为理由，把报告给打回去，这一查可能就是几年也没有个结果。


