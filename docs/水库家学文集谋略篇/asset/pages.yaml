  md: '王剪，面对的是秦始皇，而萧何面对的是刘邦。秦始皇本就生于帝王之家，他对财富的观念显然不会与出身贫民的刘邦一样。且当时王剪是带兵上前线，而萧何是坐守后方，刘邦在前边打仗。在前边打仗的王剪贪财，表明的是这个人心里有牵挂，有牵挂的人就不会做出一些出格的事情。而且此时他索要赏赐，可以理解为阵前悬赏，这也是一个称之为他努力的目标而已，既然他的目标是钱财，秦始皇当然不会怕他有谋反之心了。


