- pgno: 76
  md: '打着诸葛亮的大旗，做自己想做的事情。


    刘禅继位第二年便推行农桑殖谷，闭关息民，第三年遣诸葛亮南征四群，四群皆平。


    《诸葛亮案》记载了初次北伐时蜀国的景象，吴王孙权同恤灾患，潜军合谋，椅角其后。凉州诸国王各遣月支、康居胡侯支富、康植等二十余人诣受节度门与


    《三国志·后主传》记载的刘禅登基时，几箭巡逻太守朱褒拥郡反，益州都有大姓雍在他反，越隽夷王高定亦背叛相比，经过几7乐不思蜀的阿斗年的时间，刘禅不但恢复了国家元气而且国力空前强盛。


    有人质疑，刘禅取得这样的成绩，与诸葛亮的辅助是分不开的。诚然，此时的功劳得有诸葛亮的一半，但值得注意的是：诸葛亮并不是辅佐了刘禅一生。没有诸葛亮后，刘禅还有哪些作为？


    刘禅十六岁登基，以诸葛亮为相。从二十九岁起，诸葛亮去世，刘禅亲政到五十七岁。在后诸葛亮时代，刘禅也并不是一无是处。刘禅曾提出须臾举动，东西椅角，


    以乘其畔的治国方案，意图先休养生息，积蓄力量后从'
