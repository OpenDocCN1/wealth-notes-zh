- pgno: 74
  md: '计算很容易理解，就是：“别争啦，我们坐下来算算账”。


    对于上述的第二点，我们用一个没有公式的例子来看一下“第一性原理”：


    X.com是马斯克的第2个大项目。他思考了人们最想从银行得到什么——  不是大楼房、实体银行卡或复杂的服务，而仅仅是为了转账。他回归基础，颠覆了整个行业，X.com后来合并成为了PayPal。


    人们热衷于追风口。但风口很多时候就是我所抨击的“夹层解释”。


    例如团购、O2O等等，凡是没能透过概念去思考本源的公司，基本都挂掉了。


    试一下去用大白话来描述你在做的事情。


    这个逻辑，和奥卡姆剃刀的“修剪”，以及香农对信息的定义是原理相通的。


    我们再说“干”。


    一是会干，二是肯干。


    有句扯淡的台词风靡一时：


    懂了很多道理，依然过不好这一生。


    姑且不论你懂的很多是山寨道理和夹层解释，即使你懂的是真道理，和“过  好这一生”也没有因果关系。


    区别在哪儿呢？


    认识世界和触碰世界是完全不一样的概念。


    就像我们前面讲的故事，即使你懂得水的分子结构，即使你知道在哪里找到原料，你还是可能在造水的过程中被联氨炸死。'
