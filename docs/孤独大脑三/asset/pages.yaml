    # 四维：更新


    继续说本文的四个维度的框架。


    至此，有人会说，你怎么知道胜率是多少？你怎么知道赔率是多少？不知道胜率和赔率你怎么计算下注比例？


    没错，胜率和赔率，是下注者的主观信念。


    +   在赌场，我们可以用“频次”来计算出轮盘赌的概率，因为可以大规模重复。


    +   在现实世界的更多场景下，我们需要贝叶斯理论的主观概率。


    即使是在一个“过去表现并不代表未来”的投资领域，概率思维一样适用。


    如果说，胜率是一维，期望值计算是二维，下注比例是三维，那么，在每一次下注之间，还有一个不断更新胜率和赔率的过程。


