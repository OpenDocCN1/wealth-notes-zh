  md: '将道德与策略联系在一起，我们脑海中就会浮现出“厚黑”这个词。然而这并不在本文的讨论范畴之内。


    即使李宗吾说：“用厚黑以图谋一已之私利，是极卑劣之行为；用厚黑以图谋众人公利，是至高无上之道德”，我也认为“厚黑”者诞可怜的。


    诚实就是诚实，只有作为美德的诚实，才能被称为诚实。


    诚实之所以被称为最好的策略，前提就是你的诚实本身是诚实的，而非厚黑式的设计和扮演。


    当然，如果肯装一辈子，也算是诚实的诚实。


    诚实是最好的策略，原因有二：


    +   a、人类社会从长期看会奖励诚实的人。


    芒格在2004年西科年会上谈及了这一点：


    > 当然，要了解自己的动机是很难的。但我愿意相信，就算这种经营方式并没有给我们带来许多经济上的好处，我们也会这样做好。而且每隔一段时间，我们就会有机会证明这一点。


    > 但更多的时候，我们由于固守道德而赚到更多的钱。在我们看来，本杰明·富兰克林是对的。他并没有说诚实是最好的道德品质，他说诚实是最好的策略。


    +   b、数字社会从技术上会惩罚不诚实的人。


    数字化，会令世界更即时，更透明。不诚实的人被惩罚的周期越来越短，作案成本越来越高。


    也许这个世界快要开始奖励诚实的人了。


    所以，我赞成康德的观点：'
