- pgno: 192
  md: '这样加起来的话，茅台股价多高都不为过呀。


    你想想看，两百年后还有啥能剩下，连房子产权都只有70年了。


    所以，“茅台悖论”明明一点儿都不悖论嘛。


    不过，如果按照200年的未来现金流折现计算，又会掉入另外一个悖论：


    # **圣彼得堡悖论。**


    ![](img/1b28e73d340463bb3046e948e240b367_192_0.png)


    让我们来玩儿一个游戏，叫“掷硬币掷到正面为止”。


    游戏规则如下：


    +   - 第一次掷出正面，就给你2元；

    - 第一次掷出反面，那就要再掷一次；

    - 若第二次掷的是正面，你就赚4元；

    - 若第二次掷出反面，那就要掷第三次；

    - 若第三次掷的是正面，你便赚8元……

    - ……

    - 如此类推，掷到正面为止。


    你可能掷一次，赌局便结束，也可能反复一直掷，掷个没完没了。


    问题是：你最多肯付多少钱参加这个赌局？


    图示如下：'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/1b28e73d340463bb3046e948e240b367_193_0.png)


    我们简单用期望值计算一下，这个游戏的价值：


    +   - 第一次的期望值是 $2 \times 1 / 2=1$；

    - 第二次的期望值是 $4 \times 1 / 2 \times 1 / 2=1$；

    - 第三次的期望值是 $8 \times 1 / 2 \times 1 / 2 \times 1 / 2=1$；

    - ......


    +   - 该游戏的期望值，等于把以上的数值加起来，那就是一直加上去，所以是无限大！


    可是，谁会为这个游戏付无限多的钱呢？


    再简化一点儿，如果最多玩儿100次，那么你的期望值是100元。


    即使如此，事实上也很少有人愿意为这个游戏付出100元。


    这就是著名的圣彼得堡悖论。


    丹尼尔·伯努利在1738年的论文里，对这个悖论提出了解答，他以效用的概念，来挑战以金额期望值为决策标准，论文主要包括两条原理：'
  merge: -1
  img_proc: true
- pgno: 194
  md: '+   1、边际效用递减原理：一个人对于财富的占有多多益善，即效用函数一阶导数大于零；随着财富的增加，满足程度的增加速度不断下降，效用函数二阶导数小于零。


    +   2、最大效用原理：在风险和不确定条件下，个人的决策行为准则是为了获得最大期望效用值而非最大期望金额值。


    （以上来自维基百科。）


    # 五


    你有没有发现，热情的人们当下对茅台的估值，是不是有点儿像圣彼得堡悖论？


    某书这样写道：


    设想有一家伟大的企业，前景无比光明，看上去将永远成长。


    即使假设我们能准确预测一家企业未来无限久的盈利，我们也很难准确预测其下季度的盈利。


    那么，这家公司的股票值多少钱？无限大吗？


    即使按照价值投资保守的未来现金流折现法，似乎也成立啊。


    类似的故事，在上个世纪60年代末和70年代初，在美国已经上演过，那就是所谓的“漂亮50”。


    大家疯狂下注于施乐、可口可乐、IBM、宝丽来等公司。


    那时候，人们的投资哲学，和现在对茅台、特斯拉、比特币的态度一样：


    **风险不在于买贵，而在于没买。**


    理由是它们的漂亮前景确定无疑，所以赶紧上车，管它票价有多高。


    1050'
  merge: -1
  img_proc: true
- pgno: 195
  md: '果真如此吗？


    众所周知，“漂亮50”后来不仅没有继续涨上天，而且看起来也没有一直漂亮。


    问题出在哪儿呢？


    大概有两个：


    +   1、圣彼得堡悖论里对于价值计算的函数是“无界”的，然而在现实中并非如此。


    +   2、我们在计算茅台的未来现金流折现时，会假设“增长率”永远大于“折现率”。


    例如在本文第三段的“计算”里，假设茅台的增长率是10%，假设折现率是8%。


    回看茅台的历史，一直都是30%的净利润增长率，10%的增长率难道不是很保守吗？


    我们可能忽略了一个事实，在过去40年里，中国经历了一个不可思议的超级增长，以致于人们觉得：


    10%的增长率有什么了不起啊。


    事实上，对《财富》500强过去50年的研究表明，只有少数几年年增长率达到了10%或更高。


    对于任何投资来说，10%的年回报都是了不起的事情。


    连续多年利润增长率超过10%，也不是容易的事情。


    我这里并非是预测茅台的未来增长率会低于折现率，而是想表达：'
  merge: -1
  img_proc: true
- pgno: 196
  md: '+   • 一切预测都具有不确定性;


    +   • 我们需要为自己的信念之前加上一个概率数值。


    稍微补充一下，当年在高位投资“漂亮50”股票组合的人，如果坚持拿上20年，回报其实也还可以，接近于标准指数的回报。


    但前提是，你要很有耐心，还必须是持有整个组合，因为：


    在这50只漂亮的股票里，5只股票在21年的时间里实际上亏钱，20只股票跑输滚动投资于90天美国国债，只有11只跑赢标准普尔500指数。


    没有物体能够真正摆脱地心引力。


    记住，再伟大的公司，也可能在“均值回归”的作用下变得平庸。


    一个不能永运动下去的物体，在充满摩擦力的现实世界，早晚也会停下来。


    再次重申，本文与茅台的投资没有任何关系。


    即使现在买茅台股票，没准儿都比把钱存银行好。


    以及，据说一个业余投资者，只要你你不买股票，回报就好过大部分投资股票的人了。


    所以，本文只是一个思考游戏。


    这样我就可以更自由自在地胡扯了。


    茅台成为某种信仰，有两个特别重要的要素。'
