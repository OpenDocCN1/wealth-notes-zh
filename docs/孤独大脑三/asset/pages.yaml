  md: '# B3


    2005年，一群麻省理工的学生发现了马萨诸塞州发行的CashWinFall彩票的漏洞，于是一举购买，赚了不少"反智商税"的钱。


    他们把自己的这个小团队称作"随机策略"（RandomStrategies）团队，因为麻省理工学院的本科生宿舍"随机厅"（RandomHall）。当初，该赚钱计划就是在这里草拟。


    那次极其罕见的赚钱机会，并不需要麻省理工学生的学位，也很容易理解。


    我想讲的是关于"随机"（Random）的故事。


    +   1863年，"随机游走"的概念，出现在法国的一名股票掮客朱利·荷纽出版的书中。


    +   1900年，法国数学家路易·巴舍利耶在他的博士论文《投机理论》讨论了类似观念。他提出：股票价格的日常变动从根本上是不可预知的。如果股票价格反映的是企业的一切已知信息以及所有合理推测的话，那么根据定义，股票价格未来的变动就应该是不可预知的。


    +   1953年，英国统计学家莫里斯·肯德尔得出的结论，人们根本无法预测商品期货市场的小麦价格。这引起了麻省理工经济学家萨缪尔森的注意。


    +   1954年，美国统计学家萨泽齐偶然看到了半个世纪前路易·巴舍利耶的论文，写明信片告诉给萨缪尔森。


    +   萨缪尔森将路易·巴舍利耶的模型修正为对数正态随机游走。'
