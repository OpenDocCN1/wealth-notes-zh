- pgno: 345
  md: '跑马场的赔率是根据马身上下的赌注来确定的，一匹马身上压的钱越多，赔率就越低。


    因为好多赌马的人对赛马或下注策略的知识少得可怜，所以他们就会把注下在最受欢迎的那匹马。


    赌马老手会挑选一匹赔率很大（比如15：1）、根本没机会赢的马，下注的窗口一打开，这人就把100美元投在这匹劣马上，于是计分板上显示的赔率一下就降到了2：1，创造出“这匹马很受欢迎”的假象。


    人们纷纷把钱压在这匹“最受欢迎”的马身上


    因此，老手真正看中的马赔率变得比较高。要是这家伙赢了，先前的100美元投资就能赚回好多倍。


    每当你下注的时候，请想起这个故事，记住有可能你的游戏是被老手们操纵的。


