  md: '消费升级，也是价格区间的迁徙。


    热闹的喜茶们，如果不能更好的赋予意义，并尽快形成自己的价值体系，以及企业基本功，也许就只是为星巴克们培养年轻客户。


    同样，星巴克也面临“价格区间”的挑战。


    简单来说，星巴克在中国面临两种挑战：


    1、用星巴克一半甚至三分之一的价格卖咖啡。


    例如加拿大本士咖啡（已被美国公司收购）Tim Hortons比星巴克更受欢迎，关键要素可能就是实在便宜。


    2、用星巴克的方式和价格区间去卖茶。


