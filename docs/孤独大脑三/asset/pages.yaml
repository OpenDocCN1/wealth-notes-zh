  md: '你很可能认为，失去一名队员是世界上最糟糕的事情。其实不对，损失整船队员更糟糕。你的决定避免了此事发生。


    # 工程思维之十


    # 少说废话


    不知何时起，人们开始把创业搞得特别悲壮。


    其实创业就是去干点儿自己喜欢的的事情，或者是也不算太喜欢，但有机会多赚点儿钱。


    煽情一下也无妨，但是有时候煽过了头，会毁掉理性。


    但对于创业者而言，只有理性才能救命。


    我特别喜欢《火星救援》男主角的那种逗逼精神。


    总结一下，就是：


    +   - 少说废话，埋头干活；

    - 别太伤感，别太悲痛，别太高尚；

    - 别太正经，找点儿乐子；

    - 像是在打游戏一样乐观。


    我赞成建立在私欲基础上的创业梦想，怀疑掩盖在漂亮话之下的私欲。


    《火星救援》的小说中，有一股浓浓的对成年人世界的结构，抛弃了宏大叙事与人类情怀，回归到个人层面的简单情绪。


    人生就应该是面对问题，解决问题。


    这是我所钟爱的“工程情绪”。'
