- pgno: 88
  md: '2019 年, 专注于 K12 在线教育业务, all in 大班课模式, 实现盈利, 成功上市。


    看, 这就是一个断臂、转型、重生的故事。


    对于创业者而言, 区分 “沉没成本”和“坚持到底”是一件很不容易的事情。


    失败, 出丑, 被嘲讽, 都不是什么了不起的事情。


    假如一件事情从“工程”的角度看的确无效, 就放弃它。


    别试图去维护自己的正确。


    关键是能够活下来。


    # ## 工程思维之八

    ### 在不确定性下启动火箭


    你无法确保自己能够做成某件事情, 你只是提升自己做成这件事情的概率。


    脑海里死守“有足够把握”的人, 不适合创业。


    当然, 完全不计算概率的赌徒也不适合创业, 尽管很多赌徒创业成功了。


    没有100%的可靠。


    《火星救援》的男主角有句话:


    不过了, 我能抱怨个毛, 现在能活下来的几率已经大多了。


    概率带给创业者更大的一个挑战是:


    你必须在不确定的情况下启动火箭。'
