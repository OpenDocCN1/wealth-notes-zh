  md: '资方支付给我们的股息才会被记录在我们的账簿上。根据公认会计准则，被投资方代表我们保留的巨额资金也变成无形资产。


    然而，这些看不见的东西不应该被忽视：这些未记录的留存收益通常为伯克希 尔 创 造 价 值 —— 大量价值。被投资方利用这些留存资金来扩大业务、进行收购、偿还债务，通常还会回购股票（这种行为增加了我们在他们未来收益中所占的份额）。


    正如我们在去年的股东信中指出的那样，留存收益在整个美国历史上推动了美国企业的发展。对卡内基和洛克菲勒行之有效的方法多年来对数百万股东也行之有效。


    当然，我们的一些投资人会令人失望，他们留存的收益几乎没有增加他们公司的价值。但其他公司会超额完成任务，其中少数公司表现出色。总而言之，我们预计自己在伯克希尔非控股业务（别人会认为是我们的股票投资组合）留存的巨额收益中所占的份额，最终会给我们带来等量或更多的资本利得。在我们56年的任期中，这一期望一直得到满足。


    我们GAAP数据的最后一个组成部分——丑陋的110亿美元减记——几乎是全部量化我在2016年犯的一个错误。那一年，伯克希尔收购了精密铸件公司（Precision
    Castparts, “PCC”），我付了太多的钱。


    没 有 人 以 任 何 方 式 误 导 我 —— 我只是对PCC的正常盈利能力过于乐观。去年，作为PCC最重要的客户来源，整个航空航天业的不利发展，暴露了我的误判。'
