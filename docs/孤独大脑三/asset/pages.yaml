  md: '在收购PCC的过程中，伯克希尔收购了一家很好的公司，同行业中最好的一家。PCC的首席执行官马克·多尼根是一位充满激情的经理，他一如既往地将同样的精力投入到我们收购的业务中。我们很幸运有他来管理。


    我认为我的结论是正确的，PCC将随着时间的推移，在其运营中部署的净有形资产上获得良好的回报。然而，我对未来收益的判断是错误的，因此，我也就错误地计算出了为收购该企业支付的合理价格。


    PCC远非我犯下的第一个错误。但这是一个大错误。


    # 我们的弓上有两根弦


    伯克希尔撒韦经常被贴上“综合企业集团”的标签，这是一个贬义词，指的是拥有大量不相关业务的控股公司。是的，这是对伯克希尔正确的描述

    —but只是部分描画。为了更好理解我们如何以及为什么不同于其他综合性企业集团，让我们回顾一下历史。


    长期以来，综合企业集团通常会局限于收购整个企业。然而，这一战略带来了两个大问题。有一个问题是无解的：大多数真正伟大的企业都无意让别人接管。因此，渴望收购的企业集团不得不专注于那些缺乏重要和持久竞争优势的一般公司。那不是一个钓鱼的好地方。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '除此之外，当联合企业不得不收购平庸的公司时，他们常常发现自己需要支付惊人的“控制权”溢价，以诱捕他们的猎物。一些精明的企业集团知道如何解决这个“超额支付”的问题：他们只需让自己公司估值变得高得离谱，来作为昂贵收购的“货币”。（“我愿意花1万美元买你的狗，做法是把我单价5000美元的两只猫给你。”）


    通常，让综合企业集团股票估值过高的手段包括促销和“富有想象力的”会计操作，这些手段充其量是欺骗性的，有时甚至会越界成为欺诈。当这些招数“成功”时，这家集团会将自己的股价推至商业价值的三倍，以便收购估值是实际价值两倍的目标公司。


    投资幻想可以持续相当长的时间。华尔街喜欢并购交易产生的费用，而媒体则喜欢精彩的推介者提供的故事。同样，有时候，一只被推销的股票飙升的价格本身也可以成为投资幻想就是现实的“证据”。


    最终，当然，盛宴结束，许多商业“皇帝”没穿衣服。金融史上充斥着许多著名企业集团的名字，这些企业家最初被记者、分析师和投资银行家誉为商业天才，但后来却被抛进商业垃圾桶。


    大集团声名狼藉。


    芒格和我希望我们的企业集团拥有具有良好财务状况和优秀经理人的多元'
