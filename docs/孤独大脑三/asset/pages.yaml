  md: '000英里的铁路，遍布28个州，必须不惜一切代价在其庞大的系统中最大限度地提高安全性和服务。


    尽管如此，BNSF（北伯林顿铁路公司）还是向伯克希尔支付了大量股息—— 总计418亿美元。然而，铁路公司只会在满足其业务需求和保持20亿美元现金余额后，再付给我们剩下的钱。这种保守的政策允许BNSF以较低的利率借款，而不依赖伯克希尔对其债务的任何担保。


    关于BNSF的另一个点是：去年，该公司首席执行官卡尔·艾尔（Carl I ce）和他的二号人物凯蒂·法默（Katie Farmer）在控制开支方面做了出色的工作，同时克服了业务的严重低迷。尽管载货量下降了7%，但这两位实际上使BNSF的利润率提高了2.9个百分点。卡尔如计划的那样，在年底退休了，凯蒂接任了首席执行官一职。因此，BNSF的管理依然优秀。


    与BNSF不同的是，BHE（伯克希尔·哈撒韦能源公司）不支付普通股股息，这在电力行业很不常见。我们拥有该公司21年了，这种斯巴达式的政策贯穿了整个时期。与铁路不同，我们国家的电力设施需要大规模的改造，最终的成本是惊人的。这一努力将在未来几十年吸收BHE的全部收入。我们欢迎挑战，相信增加的投资将得到适当的回报。


    让我来告诉BHE的一项努力——它承诺投入180亿美元，对已经过时的电网进行改造和扩建，这些电网现在正在向整个西部输送电力。BHE在2006年开始这个项目，预计在2030年完成——是的，2030年。


