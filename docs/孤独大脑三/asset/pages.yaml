- pgno: 108
  md: '围棋是古代文化中罕见的与“量化”有关的事物，因此，当其与不太在意“数 日化”的东方哲学关联在一起时，分外清新。


    吴清源的哲学，像是剑客生死决斗时的超然。这种超然没有脱离战斗的使命 与严酷，反而令其战斗值更高。


    尽管吴清源的胜率极高，但却没人视之为“胜负师”。


    小林光一、曹薰铉等人也极有天赋，他们下棋赢了，会被视为“真能打”。


    而吴清源赢了，却会被赞为“旷世奇侠”。这是其他超一流棋手无法触及的。


    围棋像是一个呈现《道德经》哲学的桌游。那些看不见、摸不着的词汇，例 如：气、场、势、利、虚、实，经由围棋的计算，以及终局精确的胜负评判 ，而变得量化而具体。


    围棋AI战胜人类冠军，一方面嘲讽了人类在围棋上的许多幼稚假设，以及无 知的夹层解释，许多定式和布局，甚至棋理，都被扫入了垃圾桶。而另一方 面，AI与人类高手似乎呈现出了某些“英雄所见略同”之处。


    例如本文开头吴清源那一手凌波微步的白16。


    显然，AI和吴清源是经由不同的计算路径实现巧合的。


    需要说明的是，尽管AI是人类设计出来的，但AI下围棋完全靠的是自学。


    AI通过数百万、数千万盘的强化学习，从零开始形成了自己的感觉，进而还 能在实战中通过仿真推理来评估不同选项的终局获胜概率。


    而人终其一生也下不了十万局，于是不得不依赖天赋、直觉，以及哲学。


    而这两条貌似截然不同的路径，一虚一实，一东一西，竟能相逢于华山之巅 。


    于是，一个大胆的念头冒出来了：'
