- pgno: 127
  md: '# 脑科学家发现“左脑右脑”模式


    右脑”模式不过是大脑最明显的分工之一；除此之外还有许多专门的模块，各自对应专门的技能，比如计算距离、分析音调等等。所有这些都同一时间进行，不同的信息在纵横交错的大脑网络中传递，跨半球交流也是常有的事。


    简言之，大脑不仅仅是在控制左右脑协作时表现出统一意识，自始至终大脑都需要在针锋相对的各种杂音中取得平衡，神经系统就好像喧闹的股票交易所一样。


    大脑是怎样做到这一点的呢？


    通过对脑裂人的研究，加扎尼加终于发现了一个秘密：


    左脑不过是在编造理由。


    左脑半球在其接收信息的基础上编造出条理清楚的故事，并告知人的意识。日常生活中这个过程不断在上演，大部分人都有这种行为，比如偷听到别人闲话的片段，然后用自己的揣度把故事补充完整。


    大脑中各种声音吵吵嚷嚷，却依然能保持一致，其原因就在于左脑半球中某个模块或是某处网络一直在滔滔不绝地叙事。


    加扎尼加说：“我花了25年，提出了正确的问题，并且找到答案。“加扎尼加博士决定把左脑叙系统命名为“诠释者”。


    “诠释者”扮成一副条理清楚的样子，创作看似富含深意的剧本。它整天忙忙碌碌，大刀阔斧地重组事实；编造故事、捏造原因，加入动机，添上意图……而这一切都是基于有限的、经不起推敲的信息。


    Master：人类不正是因此而进化、以及不进化的吗？《人类简史》认为人类祖先智人之所以能够崛起统治地球，是因为其拥有强大的虚构能力。


    不过好玩儿的是，作者正是用一种宏大的虚构力，来虚构人类的虚构史。'
