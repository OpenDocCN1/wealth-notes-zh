- pgno: 27
  md: '孩子早期的时候，一个一无所知的孩子的神经网络是非常强大的。但是在学习的过程中，一方面在强化神经元之间的连接，另外一方面其实也在斩断，或者在过于强化某些连接的时候，就会造成了一种割据。


    所以我觉得，在某种意义上来说，孩子的创造力，或者可以叫做通感，或者是天生通识的能力，在接受教育的过程中，被批量地给消灭掉了。


    从家长或者成年人的角度来看：


    +   - 一方面，应该在孩子小时候就能够有一个通识体系作为指导；

    - 另一方面，要做的就是怎么样能够避开这种成建制的摧毁。


    如果孩子很小的时候就够接触到童行学院，我会觉得他特别幸运。这件事从以前看不见、摸不到的东西，变成了一个有体系的事情。


    但是接下来他进入到一个加工厂。我们得承认，我们的孩子面对的是工业时代所诞生的教育模式，他不得不面对这个加工厂。


    所以我是不是可以去这么理解，童行学院一方面给孩子进行通识教育的启蒙，给孩子一个系统化的结构，另一方面也教孩子去穿行现实世界。


    郝景芳：


    是的。童行学院想要干的事情，就是对于孩子如何看待世界、理解世界，以及如何思考世界的一些方法上的启蒙。


    学校教的很多东西，有好的也有不好的，有合理的地方也有不合理的地方。'
