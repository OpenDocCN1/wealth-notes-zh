    《火星救援》的故事非常简单：2035年，在一次探险任务中，宇航员兼植物学家马克·瓦特尼不幸被遗留在火星。他的食物只够吃309个火星日，而下一班“星际公交车”要4年后才会到。


    马克·瓦特尼打算活下去，而全人类也展开了一场太空救援。'
