  img_proc: true
- pgno: 71
  md: '![](img/1b28e73d340463bb3046e948e240b367_71_0.png)


    所以我们需要氢和氧。


    火星大气含有95%的二氧化碳，而基地正好有一台“氧合机”，用于从二氧化碳中分解出氧气。


    剩下就是氢了。


    我们聪明的男主角突然想起来，登陆火星时省下的预备燃料：联氨。


    ![](img/1b28e73d340463bb3046e948e240b367_71_1.png)


    看，里面有四个氢原子！'
