- pgno: 59
  md: '当然不是。


    例如《故事工程》的作者拉里·布鲁克斯就认为，即使是写作这类看似非常依赖灵感的事情，也可以采用工程思维。


    > 拉里·布鲁克斯说：“故事创作本身既是一门艺术，同时又类似于工程构建。”


    他从工程构建的角度来分析创作活动，阐述故事创作的基本原理。


    拉里·布鲁克斯坚信，成功创作故事的方法是理解并运用如下六大核心技能：'
