  md: '此外，虽然我们不该像炼金师那样去追求“银弹”，但可以“乐高”。


    前面，我们提及了“模块化的系统思维”。


    **工程思维，要学会利用现有模块来搭乐高积木。**


    电影《**火星救援**》里，男主角想要活命，必须和地球取得通信联络，但是他没办法重新发明一个宇宙移动电话，所以他想到了一个现成的“模块”：


    “**火星探路者**“探测器。


