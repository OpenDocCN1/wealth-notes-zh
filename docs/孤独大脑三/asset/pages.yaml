- pgno: 320
  md: '# ## 最后


    就像《西游记》孙悟空的第一次落泪，是想到的自己作为肉骨凡胎，终究要面对死亡。


    我们无法为了获得长生而四处找神仙拜师学艺。


    但，是否可以倒过来想一下：


    人生其实就是一场对死亡的“做空”。


    该如何“做空”人皆有之的死亡呢？举例如下。


    +   - 问题：死亡会带走你。


    +   - 做空：努力在这个世界留下一些什么痕迹。


    +   - 问题：死了之后你什么都做不了。


    +   - 做空：种些树，或类似于种树的时代之事。


