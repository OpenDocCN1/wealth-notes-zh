- pgno: 330
  md: '这个整体框架包括四个维度，和一个原点：


    +   • 一维是胜率；


    +   • 二维是期望值；


    +   • 三维是根据胜率和赔率所决定的下注比例；


    +   • 四维是根据过往的下注结果和更新后的信息，重新调整“胜率、赔率和下注”。


    +   • 原点是人性。


    # ## 一维：胜率


    我用改编自《周期》里的一个比方来说。


    一个罐子里面装着100个球，有些是黑球，有些是红球。一个人从罐子里拿出来一个球，你猜它会是什么颜色？


    假如你对罐子里的黑红球分布一无所知，你怎么猜都没意义。


    但是，如果你知道其中70个是红球，30个是黑球，这就会让你赢的概率大大超过输的概率。


    你当然会猜随机拿出的球可能是红色，你的胜率是70%。


