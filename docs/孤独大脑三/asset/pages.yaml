    # ## 上：原理篇


    # ## 一


    ## 什么人能靠创业发大财？


    在这里，钱其实是一个计量工具，用于量化我们如下这个思考：


    ## 创业成功最关键的个人要素是什么？


    你可能会说，这类问题怎么会有标准答案呢？


    +   - 首先当然是要运气好，肯干，愿意冒险。

    - 从鸡汤的角度说，需要有意向，要追随内心的梦想；

    - 从鸡血的角度说，需要有执行力，百折不挠。

    - 从商学院的角度说，需要商业模式；


