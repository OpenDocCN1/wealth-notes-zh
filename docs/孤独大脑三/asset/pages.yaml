  md: '即使是追求“极其完美”，也要再试错的过程中一步步实现。


    否则挂掉的概率极大。


    最小化可实行产品的一个精彩案例是Dropbox。


    Dropbox 的 创 始 人

    Drew做了一个视频放在了YouTube上，这段视频介绍了Dropbox的各项功能，Beta版的等待用户一夜之间从5000暴增到75000，可当时Dropbox甚至连实际的产品都还没有。


    这也算可实行产品吗？


    算。


    因为在“卖”了。


    让我们回想一下第一代iPhone面世时鲜为人知的幕后故事：


    当时用于演示操作的iPhone还没有完全完工，换句话说只是工程机，会产生各种问题。


    在最后时刻，工程团队依然无法保证手机能够至始至终保持正常。有时会失去网络连接。有时电话无法接通。有时电话无缘无故就关机了。


    为了保证iPhone原型机可以顺利完美的完成演示操作，工程师们想出了一个方法，那就是乔布斯按照设定好的路线顺序来演示iPhone功能，否则会死机。


    为了安全起见，工程师将所有演示机的屏幕上的信号强度条全部写死，都是5格信号满格，管他真假。


    你看看，追求极致的乔布斯都这样，你有啥不好意思呢？


    当然，前提是你真的全力以赴要把绘制的馅饼做出来，不是当骗子。'
