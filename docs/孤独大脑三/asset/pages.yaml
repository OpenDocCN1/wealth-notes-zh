  md: '![](img/1b28e73d340463bb3046e948e240b367_87_0.png)


    现实中，断臂要艰难的多。


    因为创业中的实际困境，像是温水煮青蛙，反而不像处于绝境中那般好下决心。


    埃隆·马斯克说：有些事情没效果的时候不要欺骗自己，否则你会执着于一个糟糕的解决方案。


