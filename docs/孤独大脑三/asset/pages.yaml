  md: '多少英雄豪杰，就是因为不懂（或不接受）这一点，而被“吸附”在小概率的坑里爬不出来。


    此外，对于创业者和投资人，源源不断的弹药（不包括那些短期高息的负债），能够让他们在下注上更加从容。


