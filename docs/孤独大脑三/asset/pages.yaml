  md: '短期股市的预测是毒药，应该把它摆在最安全的地方，远离儿童以及那些在股市中的行为像小孩般幼稚的投资人。


    我们偏爱的持股期限是永远。


    你不会每年都更换房子、孩子和老婆。为什么要卖出公司（股票）呢？


    短线投机等于就即将发生的事情进行赌博。如果你运用大量的资金进行短线投机，有可能血本无归。


    希望你不要认为自己拥有的股票仅仅是一纸价格每天都在变动的凭证，而且一旦某种经济事件或政治事件使你紧张不安就会成为你抛售的候选对象。相反，我希望你将自已想象成为公司的所有者之一，对这家企业你愿意无限期的投资，就像你与家庭中的其他成员合伙拥有的一个农场或一套公寓。


    如果我们 有坚定的长期投资期望，那么短期的价格波动对我们来说就毫无意义，除非它们能够让我们有机会以更便宜的价格增加股份。


    必须要忍受偏离你的指导方针的诱惑：如果你不愿意拥有一家公司十年，那就不要考虑拥有它十分钟。


    # 行业与公司


    你应该选择投资一些连笨蛋都会经营的企业，因为总有一天这些企业会落入笨蛋的手中。


    当一个经历辉煌的经营阶层遇到一个逐渐没落的夕阳工业，往往是后者占了上风。'
