  md: '# 慢慢暴富：巴菲特致股东信1957-2021年全集


    一夜暴富，和慢慢暴富，


    你选择哪一个？


    A


    股神似乎不再“神”了。


    巴菲特公司的股价在过去一年、五年和十年的表现，都不如美股大盘。


    巴菲特终于开始改变对科技股的态度，在“买错”IBM之后，重仓了看起来没什么想象力的苹果。


    当然，在他漫长的投资历程中，10年只是一个很小的衡量尺度。


    《巴菲特超越价值》作者简恩认为：


    如果置于长期视野下，价值投资可能就是“战无不胜”的，但在某一个时期，它显然未必如此，这就更需要有足够的耐心。


    概括而言，在市场下跌周期，价值投资的作用比较明显，但在上涨周期（例如过去十年），价值投资的表现未必很强，但也不会差很多。


    一个普通人如果早年花1000美元买巴菲特的公司股票，现在大约值两千万美金。


    1075'
