  md: 'Master 没有人会意识到，我是靠大局观取得压倒性优势。没错，大局观就是“从棋盒中发现秘密”。


    孤独大脑：围棋的一个有趣属性：由于棋子并不具备可移动性（除非被吃），围棋的过去和现在是被平铺在一个坐标化的棋盘上的。而对未来的计算和决策，基于已知，同样将被平铺于此。


