    # # 八


    怀疑论创始人皮罗的最终目的是寻求幸福，为此要回答三个问题：


    +   - 什么是万物的本性？


    +   - 我们对它应采取什么态度？


    +   - 这态度将给我们带来什么结果？


    皮罗自己的答案是：


    +   1. 我们无法判定感觉与意见是否与客体一致，无法认识事物的终极本性，没有公认的标准可以裁决人们的意见分歧。


    +   2. 所以，我们不能相信自己的认识，应当“悬而不断”：对任何事物都说“既存在又不存在”，或“既不存在又不存在”。


    +   3. 这一“不断定”的结果就是“不动心”状态，又称“平静安宁”，或“无动于衷”，或摆脱烦恼。'
