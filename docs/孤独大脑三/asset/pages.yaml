  md: '# # 聪明下注的原理


    +   收录于话题

    #投资 3 个内容

    #概率 4 个内容


    最近有个传闻，某资本大佬创造了“人类历史上最大的单日亏损”：


    他的基金净资产峰值高达150亿美金，杠杆比例长期维持在3~4，所以总资产高达800亿美金。


    因其三只重仓股都在最近有过单日暴跌30%以上，人们猜测仅在这三只票上的亏损就达100亿美金，约是其净资产的2/3。


    还有各种更糟糕结果的传闻......


    都知道杠杆危险，为什么即使是“专业人士”也无法幸免呢？


    我对该传闻的总结是：一个因为运气发达的人被运气报复了。


    由此，我更发现了一个秘密：


    许多“赌徒”压根儿不懂基本的概率常识。


    广义而言，人是一种好赌的动物。


    1190'
