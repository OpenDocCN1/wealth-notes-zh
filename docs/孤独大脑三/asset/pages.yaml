  md: '在伯克希尔·哈撒韦我们不用去告诉一个打击率四成的选手如何挥棒。


    （对于购并所需资金，伯克希尔·哈撒韦随时作好万全准备，巴菲特说）如果你想买要打中罕见且移动迅速的大象，那么你应该随时把枪带在身上。


    伯克希尔·哈撒韦就像是商业界的大都会美术馆，我们偏爱收集当代最伟大的企业。


    # 其他


    信誉可能需要花一辈子的时间才能建立，但只要五分钟便足以摧毁之。


