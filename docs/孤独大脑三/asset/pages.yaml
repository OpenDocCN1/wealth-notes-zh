  md: '让我姑且用这句英文的中文翻译来解构一下:


    # **我一定要用科学在这个星球干出生天。**


    三个关键词：科学，干，生天。


    这三个词加在一起，就是“工程思维”。


    所以， **工程思维=科学思维+干+生天。**


    《转向》这本书里提及，一位由哈佛大学毕业学家改行的工程师乔治·怀特劳兹，提供了科学与工程之间另一种有用的比较:


    如果科学钟情于“追踪从离子和神经介质到勃拉姆斯《安魂曲》的机械路径”，那么工程的重点便是提供“分离无限氯二氧化碳的实际方法，使用在纳米比亚未曾用过的设备，提供无限供应的电力和清洁水并保证30%的税后投资回报率”。


    简单说，就是:


    # **科学的核心是发现，工程的本质是实现。**


    我们先说“科学思维”。


    埃隆·马斯克极有可能看过《火星救援》这本小说。我留意到，有次访谈中，他说过类似于下面的话:


    要让物理定律站在你的这一边。


    这句话，《火星救援》的主角说过。


    当时他计划种土豆来养活自己，但是没水。


    回到问题的最源头，水是由什么构成的？其结构如下:'
