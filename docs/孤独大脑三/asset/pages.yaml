    \    - 但事实是，比起堆积意义的“算棋”，无从捉摸的“形势判断”重要太多了。\n    - 而从棋盘整体直接判断形势，正好成了围棋AI的最强项。\n\n\
    以上与投资之道的相通之处，妙不可言。\n\n吴清源在对局中忘却胜负，反倒能够常胜。\n\n当马克.施皮茨纳格刚开始下场成为当时债券市场上最年轻的交易员，被导师告知要明白自己为何要待在芝加哥交易所："
