- pgno: 260
  md: '相仿有效市场投资就好比在打牌猜时认为不需看牌一样……如果市场总是效率的，我将会流落街头，沿街乞讨。


    我们一直觉得股市预测的惟一价值在于让算命先生过得体面一点。


    我们欢迎市场下跌，因为它使我们能以新的、令人感到恐慌的便宜价格抓到更多的股票。


    投资者应考虑企业的长期发展，而不是股票市场的短期前景。价格最终将取决于未来的收益。在投资过程中如同棒球运动中那样，要想让记分牌不断翻滚，你就必须盯着球场而不是记分牌。


    我不认为包含我自己本身在内能够“成功”地预测股市短期间的波动。


    被网络公司引诱的投资者就好像参加舞会的灰姑娘一样，没有在午夜的期限之前赶紧离开，结果漂亮的马车又变回南瓜。不过最大的问题在于，这场舞会上的时钟并没有指针。


    依我们过去的经验显示，从公开市场所买进部分股权的价格远比整笔购并所谈的价格要低的许多。


    我们从未想要预估股市未来的走势。


    （当1988年伯克希尔·哈撒韦股票在纽约证券交易所挂牌上市时，巴菲特半开玩笑地对经纪商说）假如你从今天起在两年内能成交一笔伯克希尔的股票，你就算成功多了。


    买股票时，应该假设明天开始股市要休市3—5年。


    1120'
