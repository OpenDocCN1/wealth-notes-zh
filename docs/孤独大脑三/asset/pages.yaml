  md: '# 人生是一场做空


    收录于话题

    #投资 3 个内容

    #做空 1 个内容

    #概率 4 个内容


    在较小的时间尺度上，


    人生就是一场做多做空的赌博。


    上个星期，我去给车做保养。


    4s店推销未来三年的保养优惠包，原价三千刀（是指你每次单独做总共要花的钱），现在一起买就可以打五折。


    突然想起某“做空大师”的一句话：


    所有的生意都是“做空”。


    例如，预售机票，就是“做空”你按时登机这件事。


    即：下注于你以为会发生的事情的反面，然后从中获利。'
