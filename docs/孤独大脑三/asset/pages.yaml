    # B2


    我喜欢用“数字化殖民”来比喻当今世界最大的一股变革浪潮。


    从生活，生意，到财富，人们正在从物理世界迁徙到数字化世界。


    也因此，苹果、亚马逊、腾讯、阿里巴巴等数字时代的新霸主，成为最富有 的公司。


    财富逻辑和当年探索新大陆的东印度公司和南海公司类似。


    最早建立物理世界与数字世界映射关系的人，香农算是其中的一个。


    +   •香农22岁时在硕士论文中，证明了布尔代数和二进制算术可以简化当时在电话交换系统中广泛应用的机电继电器的设计。'
