- pgno: 80
  md: '我们可以从中学习的是：


    +   1、不要为一个无解的问题而耽搁另外一个有解的问题；


    +   2、先做能做的，别为缺失的板块烦恼。


    +   3、别被看起来很严重的东西吓到，随时操起你手上有的家伙。


    《火星救援》里两次救下主角性命的东西，是“胶带纸”。


    随手能用的东西，比很厉害但不顺手的东西好100倍。


    我在公司里，一直鼓励小伙伴们采用“胶带纸原理”，先解决问题，再想是否好看，是否“高级”。


    例如现在人工智能和机器学习很时髦，有些创业者凹造型过了头。


    但 请 记 住 ， 连 苹 果 公 司 的 Apple Music，也强调人工编辑和机器推荐算法的结合。


    对于拥有“工程思维”的人来说，有效并且高效地解决问题排在首位。


    该用胶带纸的时候就用胶带纸。


    # 工程思维之五


    # 没有银弹，但有乐高


    这一节想讲的是：


    +   1、这个世界上很少有大杀器；


    +   2、但我们也敢于去做十倍速增长的事情；'
