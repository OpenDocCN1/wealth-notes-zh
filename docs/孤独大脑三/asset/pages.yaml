  md: '1958年，菲尔·费舍尔写了一本关于投资的极好的书。在这篇文章中，他将经营一家上市公司比作经营一家餐厅。他说，如果你在寻找食客，无论是汉堡配可乐还是带有异国情调的葡萄酒配法国美食，你都可以吸引顾客并获得成功。但是，费雪警告说，你不能随意地从一个口味转换到另一个：你给潜在客户的信息必须与他们进入你的场所后发现的一致。


    在伯克希尔，我们提供汉堡和可乐已经56年了。我们珍惜这一票价所吸引的顾客。


    美国和其他地方的数千万其他投资者和投机者有各种各样的股票选择，以符合他们的口味。他们将会找到拥有诱人想法的首席执行官和市场专家。如果他们想要价格目标，管理收益和“故事”，他们不会缺少追求者。“技术人员”将充满信心地指导他们，告诉他们图表上的一些波动预示着股票的下一步走势。要求采取行动的呼声永远不会停止。


    我要补充的是，这些投资者中的许多人会做得很好。毕竟，持有股票在很大程度上是一个“正中”博弈。事实上，一个耐心且头脑冷静的猴子，通过向标准500的上市公司投掷50支飞镖构建的投资组合，随着时间的推移，只要它不受诱惑改变原来的“选择”，它将会享受股息和资本收益。


