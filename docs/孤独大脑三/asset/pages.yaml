  md: 'Master：既然我是科学的产物，我何妨说说科学的定义——


    科学（英语：Science，希腊语：Eπιστήμη）是通过经验实证的方法，对现象（原来指自然现象，现泛指包括社会现象等现象）进行归因的学科。科学活动所得的知识是条件明确的（不能模糊两可或随意解读）、能经得起检验的，而且不能与任何适用范围内的已知事实产生矛盾。


    科学原仅指对自然现象之规律的探索与总结，但人文学科也被越来越多地冠以“科学”之名。人们习惯根据研究对象的不同把科学划分为不同的类别，传统的自然科学主要有生物学、物理学、化学、地质学和天文学。逻辑学和数学的地位比较特殊，它们是其它一切科学的论证基础和工具。


    科学在认识自然的不同层面上设法解决各种具体的问题，强调预测结果的具体性和可证伪性，这有别于空泛的哲学。


    科学也不等同于寻求绝对无误的真理，而是在现有基础上，摸索式地不断接近真理。故科学的发展史就是一部人类对自然界的认识偏差的纠正史。


    因此“科学”本身要求对理论要保持一定的怀疑性，因此它绝不是“正确”的同义词。


    孤独大脑：我一点儿都不嫌弃你长篇大论。因为我正处于一个反科学、伪科学盛行的时代。袁先生几乎无容身之地。


    Master：一般说来，科学涵盖三方面含义：


    +   - 观察：致力于揭示自然真相，而对自然作用由充分的观察或研究（包括思想实验），通常指可通过必要的方法进行的，或能通过科学方法——一套用以评价实验知识的程序而进行的。


    +   - 假设：通过这样的过程假定组织体系知识的系统性。


    +   - 验证：借此验证研究目标的信度与效度。'
