  md: '我们的要的不是一个99%（个的非常确定），而是很多个51%（很多个有点儿确定）。


    只有冒险，你才算安全；


    只有冗余，你才会精确；


    只有犯错，你才能“正确”；


    只有重复，你才能富有。


    # C1


    以下，请允许我自由地罗列10个观点（针对A部分）：


    +   ○ 这个世界没有神话，没有炼金术，也没有必胜的公式，只有常识。


    +   ○ 而这些常识只有代入你自己这个最大的变量，才能产生价值。


