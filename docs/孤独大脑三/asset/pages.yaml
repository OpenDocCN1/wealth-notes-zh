- pgno: 362
  md: '因为概率很难预估，并且由于投资并非扔骰子式的大规模重复，对结果无法验证。


    问题来了，凯利公式真的“重胜率轻赔率”吗？


    并非如此。


    要想回到这个问题，我们需要简单了解一下，凯利公式是怎么得来的。


    +   •某次下注，假如你赢了，总资金就会变成：


    现有本金=原来本金＋下注金额×口赔率。


    其中，下注金额=原来本金×口下注比例。


    +   •某次下注，假如你输了，总资金就会变成：


    现有本金”=原来本金”一下注金额。


    因为我们在乎的是长期下来自己的总收益是多少，所以，要计算的是多次下注后本金的最大值。


    在公式中，f为下注占总资金的百分比，p为获胜概率，b为赔率，E为期望值


    +   ○当你赢了，你的本金增加为原来的（1+fxb）倍。


    +   ○当你输了，你的本金减少为原来的（1-f）倍。


    +   •假如你一共下了N次注，那就是Np次赢，N（1-p）次输，并将所有的增减倍数乘在一起。


    对赌徒而言，最终收益，不是加减法，而是一个乘积，如下：'
  merge: -1
  img_proc: true
- pgno: 363
  md: '总收益 = 本金 × 0 (1 + f × b) × 0 (1 - f) × 0 (1 - f) × 0 (1 + f × b) ......


    凯利公式是为了让上面这个乘积长期而言最大化。


    每一次下注，都是二维的“期望值”计算，例如前面出现过的下图：


    ![](img/1b28e73d340463bb3046e948e240b367_363_0.png)


    连续N次的下注，就变成了三维世界：


