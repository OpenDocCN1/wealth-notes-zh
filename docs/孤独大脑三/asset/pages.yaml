- pgno: 389
  md: '本文所搭建的这个四维结构，表明世俗游戏非常随机，这样对每个参与者而言，人人皆有机会。


    否则，假如世界更像围棋这类确定性的游戏，赢家通吃，除了排名靠前的人，其他人还有啥搞头？


    那样的世界会更加残酷。


    所以，我们的这个世界更像德州扑克赛场。


    但是，请切记，即使如此，人生并非只是一个赌场，我们也不是孤注一掷的赌徒。


    这个世界仍然有一些值得我们去探寻的密码。


    人类并不擅长理性的赌博。（人类的生存和进化也受益于这种非理性）


    特沃斯基的价值函数表明：


    普通人很讨厌为不确定性下注，然而一旦下注失败就会变得非常疯狂。


    就像一个老实人见到女生会脸红，可一旦着火就像变成了燃烧的弹药库。


    普通人不敢赌，但是又偏好那种赔率大的游戏，并且不知道一个人最终财富取决于多次下注的统计学结果，而非单次输赢。


    他们不能够忍受在不确定性中赚确定性的钱，宁可要大概率输掉的确性。“全押”就是这种心理。


    假如人生真的是一个赌场，最重要的是构建你自己的个人系统，让自己长期地玩几下去，实现人生的遍历性。


    这就是我所说的“人生算法”。


    1255'
