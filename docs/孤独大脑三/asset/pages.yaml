    由于具有唯一性，在界定了价格区间后，你就不太会在意性价比。


    # 你觉得自己非去不可。


    对于婚礼，“发明”了结婚钻戒的德比尔斯，就利用了这一点。


    所以，曾经不那么值钱的钻石，变得很值钱了的。


    一份SKP的市况报告宣告：


    > “奢侈品定价的艺术，就是要量化产品对消费者的价值，不考虑成本、竞争对手或市场价。”


    有趣的是，蒂芙尼以钻戒出名，其银饰反而占了总销售额的25%，对比而言利润也更高。


    这便是“价格区间+价格锚定”综合作用的结果。


