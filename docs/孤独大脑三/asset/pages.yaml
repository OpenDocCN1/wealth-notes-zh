    不仅是投资，人生本来就像是一场随机漫步的游戏。


    随机性的思维，并不会把我们变成虚无主义者。


    亨利·庞加莱说：“或然性不过是我们的无知的一种尺度。”


    人们用偶然性、概然性或者机会等字眼来表达他们相信某件事情发生过或者将要发生。


    大多数人认为，一件事情或者发生，或者不发生，只有这两种情况。发生了就是100%，没发生就是0。


    但其实还有第三种情况：


    可能会发生。


    其可能的数值介于0和100%之间。


    生活中的“偶然性”，对应着专业领域里的“随机性”。


    所谓概率，就是用数学公理来量化偶然性。'
