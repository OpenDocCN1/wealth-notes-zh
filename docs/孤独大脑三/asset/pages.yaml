- pgno: 76
  md: '然而，埃隆·马斯克问的问题并非“什么是最好的火箭”，而是：


    **如何从火星多次往返？**


    还记得前面说过的，火星大气里是什么？


    没错，二氧化碳。


    埃隆·马斯克的火星梦想的关键一环就是，在火星就地取材生产甲烷，将二氧化碳和水变成甲烷和氧气。


    ![](img/1b28e73d340463bb3046e948e240b367_76_0.png)


