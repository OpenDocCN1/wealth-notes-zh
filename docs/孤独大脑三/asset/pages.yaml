  md: '直到大卫身体的能源用完，海水也被冰冻起来。时间经过了2000年，地球被厚实的冰层覆盖，人类已经灭亡，只剩下机器人生存下来。一群意图寻求根源的考古学家发现了在海中机能停止的直升机以及大卫，并再次将其启动。


