  md: '对于“既存在又不存在”，或“既不存在又不不存在”，我愿意将其理解为一种“概率化思维”.


    承认自己无知的“近似解”，比过于自信的“最优解”要好。


    在围棋棋盘上，“悬搁判断”并非不判断，而是如同阿尔法狗般，面对遥远的终局，以及模糊的当下，用概率计算来判断。


