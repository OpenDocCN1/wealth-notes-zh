  md: '众所周知，“小孩的AI”，实力可能领先“大人的AI”三十年。


    还不止如此。


    前几天，一条重量级的新闻静悄悄地溜过去了：


    AlphaGode 开发 者 DeepMind，

    在《自然》杂志上发表论文介绍“进阶版 AlphaGo”——MuZero：


    MuZero更“通用”了，它精通国际象棋、围棋、将棋，还能在数十款Atari 游戏上全面超越过去的 AI 算法和人类。


    但更 具 革 命 意 义 的 是 , MuZero 不像它的前辈们，它在下棋和游戏前完全不知道游戏规则，完全是通过自己的试验和摸索，洞悉棋局和游戏的规则，形成自己的决策。


    换句话说，AI 会自己“动脑子”了。


    MuZero能自己发现规则，自己“找寻动机”。


    如果不再沿用上面的“大人的AI”与“小孩的AI”的提法，MuZero也许就是“婴儿的AI”。


