- pgno: 62
  md: '还有一个是美学研究所。


    任正非认为：关注于色彩学，法国在色彩学上的积淀可以帮助华为的产品改变形象。


    《转向》一书认为，工程师思维（也就是工程学思维）是：


    +   - 严谨而系统的问题解决能力；

    - 一个全方位“即插即用”的多用途工具包；

    - 把多种知识的想法综合在一起的整合体系；

    - 可能性、可行性和可期待性的交叉点。


