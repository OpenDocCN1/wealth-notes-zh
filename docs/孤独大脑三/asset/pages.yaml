    | :--- | :--- | :--- | :--- | :--- |

    | 体积 | 最小 | 小 | 大 | 最大 |

    | 发动机 | 最简单 | 中等 | 难 | 最难 |

    | 存储 | 最长 | 长 | 短 | 最短 |

    | 常规应用 | 洲际导弹 | 火箭发动机 | 主力发动机 | 主力发动机 |

    | | 固体助推器 | 火箭上面级 | 液体助推器 | |

    | 举例 | 航天飞机助推器 | 长征 2F 火箭 | 土星五号火箭 | 各大主力火箭 |


    来自电子书：《一小时的霍金人类简史》'
