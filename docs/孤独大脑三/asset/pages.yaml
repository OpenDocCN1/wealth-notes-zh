  md: '化企业集团的全部或部分，而伯克希尔是否控制这些业务对我们来说并不重要。


    我花了好一会儿才明白过来。但是芒格，还有我在伯克希尔继承的纺织业务中苦苦挣扎的20年经验，最终说服了我，拥有一个很棒的企业的不控股权，要比拥有控股100%的挣扎在边缘企业更有利可图，更愉快，更少工作量。


