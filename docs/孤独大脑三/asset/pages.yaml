  md: '对于创造者而言，与其浪费时间解释自己的创想，不如直接做出来，然后说：看！


    一个厉害的“解释者”，心底都渴望成为一个“被解释者”；而“被解释者”则大多没有类似需求。


    不依赖运气的人喜欢用运气解释自己的成功，凭运气成功的人则千方百计找寻运气之外的解释。


    我对“解释”作出了如此多的解释，证明了人类对解释的深深迷恋。


