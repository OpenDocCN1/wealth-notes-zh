  md: '那是一种不期望得到的付出，那是一种淋漓尽致的厮杀死活，痛彻心扉但并不真正伤害你的败局，它是你可以爱一辈子的事情，不因你水平高而迎奉你，不因你水平低而嫌弃你，它是最好的人生隐喻，是不可测人生最小化的模型。


    Master，我们并非和你一样肩负使命，你需要为了胜率不断自我进化。


    我们更自由。世界并不因为我们的愚蠢而不前行，时间也不因我们无所事事而不容纳我们，


