- pgno: 220
  md: '+   1、买股票就是买公司；


    +   2、“利用”市场先生的情绪；


    +   3、安全边际；


    +   4、能力圈。


    前三个都是巴菲特的老师本杰明·格雷厄姆的概念。


    不过，有趣的是，巴菲特和芒格第一次见面，就是吐槽自己老师的理念。


    后来，受芒格影响，巴菲特开始用不那么便宜的价格买好的公司。


    所以，即使是狭义价值投资，也是在不断演变的。


    但是，价值投资的四个基本理念，的确可以作为投资的“元认知”。


    本文不会展开讨论价值投资，而是分享巴菲特过去数十年的股东信。


