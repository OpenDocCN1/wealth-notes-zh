- pgno: 333
  md: '+   • 就做事而言，也许是对的；


    • 就投资而言，还要看赔率。


    例如，下注于夺冠概率最大的巴西队，你未必能够赚钱。


    # 二维：期望值


    假如一篇讲胜率和赔率的文章，绕来绕去都不提及“期望值”，说明那篇文章的作者是个体率盲。


