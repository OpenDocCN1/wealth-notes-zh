- pgno: 55
  md: '不管是物理世界的达芬奇的直升机，还是数字世界的Dorsey的微博，都是在没有结构的情况下预见了前所未有的结构。


    工程师思维的第二个基本特征是：


    熟练地在约束条件下进行设计。


    因为工程学的目的和意义，是解决兑现实际生活中的某些实际问题，所以必然受到“约束”。


    这里的约束，首先是科学规律的约束。


    还有时间约束，财力约束，拥有资源的约束，竞争的约束，人类行为的约束，等等。


    梦想和现实的距离，商业上的投入产出比，也是约束。所以前面我说，创业成功学的公式里，工程学思维是把“梦想力”和“商业力”作为变量包含其中的。


    商业需要约束，否则谈何创造价值？凭什么获取利益？


    例如我参与的创业项目“未来脊梁”，这是一个致力于让每个中国家庭都能分享到一流教育理念和资源的产品。


    这个项目有很多“约束”，大公司不愿意去做，而小公司不会做。


    这些约束条件让我有某种“不确定的安全感”，否则我就无法回答自己对自己的拷问：


    凭什么由你来做这件事？


