  md: '由于采用了全新的技术与思路，我是从“棋感”入手来“思考”的。我的棋感和人类的棋感也许是一回事事情。只不过人类为自己的“棋感”作出了文艺术彩浓厚的“诠释”罢了。


    孤独大脑：下一步，工程师们没准儿可以为你设计一个“诠释者”模块，让你像人类那样，绘声绘色地讲述自己的传奇，毫不羞耻地夸大自己的智慧，虚张声势地赢得自己的地位。


