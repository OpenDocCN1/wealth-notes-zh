    但是，那又怎样？如今，克莱顿和Pilot的每人的年税前利润都超过了10亿美元。这两家公司共雇用了大约4.7万名男女员工。


    吉姆-克莱顿 (Jim Clayton) 在经历了几次商业冒险之后，于1956年以小本经营的方式创建了克莱顿住宅 (Clayton Homes)。1958年，“大个子吉姆”
    (Big Jim Haslam) 以6000美元的价格购买了一个服务站，创建了后来的Pilot Travel Centers。后来，他俩的儿子也都加入了他们的父亲的公司，他们的儿子有着他们父亲一样的激情、价值观和头脑。有时候基因太有魔力了。'
