- pgno: 75
  md: '“干”，是工程思维的精髓。


    只有将你真正懂得的道理，将你的方法论放进现实里，并且勇敢去“过”，才算是真实的一生。


    所谓工程思维，就是会干+肯干。


    我们再说“生天”。


    这是个佛教词汇，印度自古即有生天的思想，认为现世积善业、福德，死后即可生于天界乐土。


    《火星救援》作为太空版的鲁滨逊漂流记，其目标非常简单，就是活下去。


    我们现实中最本质的目的也是“活下去”，但是在一个充满欲望的世俗世界，生活的目标模糊了。


    生天在哪儿？


    “生天”是工程思维的目的地。


    定义任务，从来都不是容易的事情。


    比方说，假如你要造最好的火箭，你就会想，火箭使用什么燃料效率最高。


