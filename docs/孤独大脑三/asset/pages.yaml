- pgno: 64
  md: '![](img/1b28e73d340463bb3046e948e240b367_64_0.png)


    当时年近80岁的大导演斯科特拍摄这部电影时相当克制。事实上，原著小说更是一点儿正经没有，把一场史诗般的营救写得极其逗逼。


    但小说主人公在最后还是点了题：


    为什么一大堆人愿意付出这么大的代价来救一个宇航员？


    他们这么做的真正原因是：每个人有一种本能，那就是把同伴救出来，有时候可能看上去不太像，但事实确实如此。


    远足的人在深山里面迷路了，人们会发动搜救。火车出了事故，人们会排成长队献血。地震毁了一座城市，全世界的人都会捐出紧急物资。这种本能扎根于人类社会，每一种文化都不例外。


    是的，有些傻逼对此嗤之以鼻，但有多多多的人愿意这么做。正因为这样，才会有几十亿人站在我这边。相当酷，呢？


    “工程思维”应该是务实的，落地的，为什么一开始就说什么虚头虚脑的“使命”呢？


    原因如下：


    +   1、不管这个世界多么糟糕，人类的科技和人文都根植于美好的向往，以及对“存在”与“意义”的无止境追求。'
