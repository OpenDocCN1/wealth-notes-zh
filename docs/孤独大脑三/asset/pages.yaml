- pgno: 77
  md: '《火星救援》的原著，把科幻小说写成了硬科学。


    埃隆·马斯克更是把科幻电影干成了现实。


    然而在我们的现实生活中，有些人是把创业干成了科幻电影。


    # 工程思维之三


    系统论+还原论


    让我们回顾一下本文要讨论的话题，所谓工程思维，是指：


    有创意地应用科学定律，来系统化地解决现实问题。


    这里有个关键词是“系统化”。


    工程思维的核心之一就是系统思维。


    《转向》一书写到：


    > 一个系统因其各个模块之间的关系而成为一个整体。这样的整体是不能通过单独分析各组成部分就能理解的。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/1b28e73d340463bb3046e948e240b367_78_0.png)


    蒸汽机的线描图《系统思考》


    但如你所见，此前我们的话题，似乎都是围绕“还原论”展开。


    还原论是一种哲学思想，认为复杂的系统、事务、现象可以通过将其化解为各部分之组合的方法，加以理解和描述。


    我不打算陷入系统论和还原论的哲学争辩，只想表达如下观点：


    1、不懂还原论来谈系统论是骗子；


    2、只懂还原论不谈系统论是呆子。


    二者本质上都是对因果关系和运行逻辑的科学探索。


    《转向》说，模块化系统思维的一种特殊技巧是解构(把一个较大的系统打散成一个个模块)和重构(把这些模块重新组合起来)的功能性组合。


    真正的工程思维，既要解构，也要重构。'
