  md: '安德烈·高兹说：“我开始思考，什么是应该放弃的次要的东西，放弃了它我才能集中精力追求最重要的。而归根结底，只有一件事对我来说是最主要的：那就是和你在一起。”


    当然，最好我们手上有足够的、靠阿尔法狗概率计算法赢得的筹码，供自己去挥霍，或是帮助那些没有人生赌场权的人。例如盖茨的慈善基金。


    也许选择本身比财富更重要。如果说时光是最宝贵的财富，比时光还有有限的人生选择呢？


    我想起1995年毕业后独自去广州，遇到一位师长，他见我有些无师自通的灵性，不吝在旁人面前赞“这是天才少年”。（时光总是嫌老爱幼，迄今为止尚无人称我是天才中年。）


    他注册自己公司的时候，头疼选名，于是说：不如就叫“选择”。


    于是这公司成为我加入的第一间公司，其名字蕴含着广泛的人生隐喻：


    “选择有限”公司。'
