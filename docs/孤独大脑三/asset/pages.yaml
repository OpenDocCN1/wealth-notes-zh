    好的商业模式，是可重复的（聪明的）笨办法，而不是不可重复的（笨的）聪明方法。


    5、你我不必陷入“价格区间”的消费天梯。


    我是一个“差不多主义”者。


    例如，对于“公司股权”这类东西，我信奉数量级的‘正确”，20%和40%区别真的很大吗？


    +   • 如果好的话，得到两千万和四千万有什么区别？


    +   • 不好的话，就更没区别了。'
