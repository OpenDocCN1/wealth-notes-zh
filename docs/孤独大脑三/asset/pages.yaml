    现在，人们又指望去定向制造马斯克。


    我也并非彻底推到“规划”。例如日本就曾经规划“诺奖得主”。但这个“规划”，是“自下而上”与“自上而下”的结合。是去“规划”一整片森林，而非定向规划少数几棵看起来大有前途的天才树木。


