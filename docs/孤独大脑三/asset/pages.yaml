  md: '稳定的借款人支持的债券，来为目前可怜的回报提供动力。然而，高风险贷款并不是解决利率不足问题的办法。30年前，一度强大的储蓄和贷款行业毁了自己，部分原因是忽视了这条箴言。


    伯克希尔现在拥有1380亿美元的保险“浮动”资金——这些资金不属于我们，但我们可以配置，无论是配置债券、股票还是美国国库券等现金等价物。浮动资金与银行存款有一些相似之处：保险公司每天都有现金进出出，但保险公司持有的现金总额变化很小。伯克希尔持有的巨额资产很可能会在未来许多年保持在目前的水平，而且从累计角度看对我们来说是没有任何成本的。当然，这个令人高兴的结果可能会改变——但是，随着时间的推移，我会喜欢我们的胜算。


    在我每年给你们的信中，我已经重复地——有些人可能会说没完没了地——解释了我们的保险业务。因此，今年我会请希望更多了解我们保险业务和“浮动资金”的新股东阅读2019年报告的相关部分，今年再次刊发在A-2页。重要的是您要了解我们从事保险业务所存在的风险和机会。


    我们第二和第三大最有价值的资产是伯克希尔对以货运盘计美国最大铁路公司BNSF的100%持股，以及我们对苹果公司5.4%的持股。排名第四的是我们持有91%的伯克希尔哈撒韦能源公司（BHE）。这是一个非常不同寻常的公用事业公司，在我们拥有它的21年里，它的年收入从1.22亿美元增长到了34亿美元。


    关于BNSF和BHE在这封信后面我将做更多说明。然而，现在，我想把重点放在伯克希尔会定期使用的一种做法上，以提高你对它的“四大资产”以及伯克希尔拥有的许多其他资产的兴趣。


