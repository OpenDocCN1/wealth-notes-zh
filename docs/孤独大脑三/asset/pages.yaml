  md: '当一些大企业暂时出现危机或股市下跌，出现有利可图的交易价格时，应该毫不犹豫地买进它们的股票。


    # 伯克希尔·哈撒韦


    我非常热爱我的工作，每天早上去上班时，都会觉得自己好像是要到西斯汀教堂作壁画一样。（注：米开朗基罗名画“最后的审判”完成处）


    我们的集团总部占地仅1,500平方呎，总共只有十二人，刚好可以组一只篮球队。（这是前些年）


    伯克希尔·哈撒韦有两种低成本且无风险的资金来源：应付所得税与保险浮存金。


    尽管我们的组织登记为公司，但我们是合伙的心态来经营。


    一般共同基金的管理费用是百分之一点二五，我们则只有万分之五。


    四十五年前我看到机会却没什么钱，四十五年后我有钱却找不到机会。


    我们自给自足。


    （巴菲特在1985年结束伯克希尔·哈撒韦纺织部门营运时，曾解释道）我们不会因为想要将企业的获利数字增加一个百分点，便结束比较不赚钱的事业，但同时我们也觉得只因公司非常赚钱便无条件去支持一项完全不具前景的投资的作法不太妥当，亚当史密斯一定不赞同我第一项的看法，而卡尔马克斯却又会反对我第二项见解，而采中庸之道是惟一能让我感到安心的作法。


    1121'
