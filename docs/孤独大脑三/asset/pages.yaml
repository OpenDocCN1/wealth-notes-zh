  md: '《转向：用工程师思维解决商业难题》这本书里，说工程师思维有三个基本特征：


    首先是在没有结构的情况下“预见”结构的能力。


    作者认为，我们的世界依赖于结构。


    无论是无中生有，还是在已有的结构上类比、优化、模仿，预见结构都不是一件容易的事情。


