    答：该车是绿车但被看成蓝车的概率是（0.85×0.2），该车是蓝车且被看成蓝车的概率是（0.15×0.8），所以该车真的是蓝车的概率是（（0.15×0.8）/【（0.85×0.2）+（0.15×0.8）】=41.38%）。即，该车更可能是绿色的。


