  md: "BNSF和BHE。2011年，也就是伯克希尔拥有BNSF的第一个整年，这两家公司的利润合计为42亿美元。2020年，对很多企业来说都是艰难的一年，但这两家公司却赚了83亿美元。\n\
    \nBNSF和BHE在未来几十年将需要大量的资本支出。好消息是，两者都可能带来适当的增量投资回报。\n\n让我们先看看BNSF。它的铁路运输了美国境内所有非本地货物（按吨英里计算）的15%，无论是通过铁路、卡车、管道、驳船还是飞机。BNSF的负载远远超过任何其它承运人。\n\
    \n美国铁路的历史很有趣。在经历了150年左右的疯狂建设、欺诈、过度建设、破产、重组和合并之后，铁路行业终于在几十年前成熟并合理化了。\n\nBNSF于1850年开始运营，在伊利诺伊州东北部修建了一条12英里长的线路。如今，BNSF有390个前身，他们的铁路被收购或合并。这家公司广泛的血统分布可以参看\
