  md: '1983 年 ， 伯 克 希 尔 和 Blue Chip合并，使伯克希尔的注册股东基础从1900人扩大到2900人。查理和我希望所有人——新老股东和潜在股东——都能协调一致达成共识。


    因 此 ， 在 1983 年 的 年 报 中 ——首 当 其 冲 —— 列出了伯克希尔的“主要商业原则”。第一条原则这样开始：“虽然我们的形式是公司，但我们的态度是合作关系。”“这定义了我们在1983年的关系，这样是我们对今天的定义。查理和我——以及我们的董事们——相信这句格言在未来几十年里将对伯克希尔大有裨益。


    **********


    伯克希尔的所有权现在分为五个大“桶”，其中一个由我作为“创始人”占据。那一桶肯定会空，因为我拥有的股票每年都会分配给各种慈善机构。


    其余四桶中有两桶由机构投资者占据，各自负责管理他人的资金。然而，这就是这两个桶之间的不同之处：它们的投资程序截然不同。


    一个机构类型是指数基金，这是投资界一个规模庞大、迅速发展的领域。这些基金只是紧跟它们追踪的指数。指数投资者最喜欢的是标普500指数（S&P 500），伯克希尔哈撒韦是该指数的成份股。应该强调的是，指数基金之所以持有伯克希尔的股票，只是因为它们被要求这么做。他们处于自动驾驶状态，买卖只是为了“权重”目的。'
  merge: -1
  img_proc: true
- pgno: 238
  md: '另一个机构类型则是管理客户资金的专业人士，不管这些资金属于富人、大学、退休人员或任何人。这些职业经理人的职责是根据他们对估值和前景的判断，将资金从一项投资转移到另一项投资。这是一个光荣而艰难的职业。


    我们很高兴为这个“活跃的”团体工作，同时他们也在寻找更好的地方来配置客户资金。可以肯定的是，一些基金经理着眼长远，很少进行交易。还有一些人使用计算机，利用算法可以在一纳秒内指导股票的买卖。一些专业投资者会根据他们的宏观经济判断来回操作。


    第四类是个人股东，他们的运作方式与我刚才描述的积极型机构经理人类 似。可以理解的是，当这些股东看到另一项令他们兴奋的投资时，他们会 把自己持有的伯克希尔股票视为可能的资金来源。我们对这种态度没有异
    议，这与我们看待我们在伯克希尔持有的一些股票的方式类似。


    综上所述，如果查理和我们对我们的第五桶没有特别的亲缘感，那我们就没 有人性了。第五桶就是超过百万的个人投资者，他们相信我们会代表他们 的利益，不管未来会发生什么。他们加入我们并不打算离开，他们的心态
    与我们最初的合作伙伴相似。事实上，在我们合伙期间的许多投资者，以 及/或他们的后代，仍然是伯克希尔的主要所有者。


    斯坦·特鲁尔森（Stan Truhlsen）就是这些老合作伙伴中的一个典型代表，他是奥马哈市一位 开明慷慨的眼科医生，也是一位私人朋友，他在2020年11月13日迎来了
