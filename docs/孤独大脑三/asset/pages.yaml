  md: '到那一年，几乎所有我自己的钱，以及我妻子所有的钱，都一起投入了我的许多有限合伙公司的基金。我没有薪水，也没有费用收入。相反，作为普通合伙人，我的有限合伙公司只有在他们获得的年度回报率高于6%的门槛之后，才会给我报酬。如果收益未能达到该水平，差额部分就从我未来的应得利润中扣除。（幸运的是，从未发生过这种事：合伙人回报率总是超过6%的“标准杆”。）随着岁月的流逝，我父母、兄弟姐妹、姨妈姑姨、叔叔舅舅、表兄弟和姻亲都将大部分资金投资给了上述合伙企业。


    查理在1962年成立了合伙公司，运作方式和我差不多。我们都没有任何机构投资者，我们的合作伙伴中也很少有金融行家。那些加入我们公司的人 相 信 我 们 会 像
    对 待 自 己 的 钱 一 样 对 待 他 们 的 钱 。 这 些 人 一 一 要么凭直觉，要么依靠朋友们的建议一 一 正确地得出了这样的结论：查理和我对资本的永久亏损有着极端的厌恶，除非我们预期他们的钱会做得相当不错，否则我们不会接受他们的钱。


    1965年BPL收购伯克希尔哈撒韦的控制权后，我无意中进入了企业管理领域。后来，在1969年，我们决定解散BPL。年底后，这家合伙企业按比例分配了所有现金和三支股票，其中价值最高的是BPL在伯克希尔哈撒韦的70.5%股权。


    与此同时，查理在1977年结束了其公司的运营。在他分配给合伙人的资产中，有 Blue Chip Stamps 的主要股份，这是他的合伙人、伯克希尔和我共同控制的一家公司。Blue
    Chip 也是我的合伙公司解散时分配的三支股票之一。


