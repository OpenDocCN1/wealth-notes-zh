  md: '孤独大脑“这是心理治疗、文学创作、诺奖得主、硅谷思想家、华尔街作家、心灵鸡汤的杀手套路：我们自以为了解自已，其实不然。在讲述自己生活之时，我们会修饰每一个细枝末节；甚至回过头去修改事实剧本，而大部分时候我们对此根本没有意识。讲故事的人从来不肯停歇，除非在深度睡眠的状态下才有可能闭嘴。


