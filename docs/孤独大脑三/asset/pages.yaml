  md: '最后只剩胡林一人依然挺立。那一刻他抛下了盾牌，双手抡动一柄大斧。歌谣中说，斧头沾了勾斯魔格食人妖护卫的黑血，冒起烟来，竟至熔掉。胡林每砍倒一个敌人，就高喊道：“Auurentululva！光明必要再临！”如此他一共喊了七十次。


