- pgno: 97
  md: '![](img/1b28e73d340463bb3046e948e240b367_97_0.png)


    面对黑棋的两个小目，吴清源起手两个（白4和白6）二间高挂，相当罕见。


    黑9挺起时，白4相当于开局肩冲无忧角，亦不寻常。


