    埃 隆 · 马 斯 克 回 答 ：“ 嗯 ， 我 想 NASA做不到的真正原因恰恰是因为他们资源太多了。”


    ![](img/1b28e73d340463bb3046e948e240b367_49_0.png)


    这个世界缺顶尖工程师，更缺有顶尖工程学思维的老板。


    2001年，埃隆·马斯克诞生了“火星绿洲”这一概念：其实就是打算向火星发射一个装着植物的冲天炮，借此吸引公众对于太空探索的兴趣。


