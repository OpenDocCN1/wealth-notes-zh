  md: '让我们将“目的地”延展至商业。例如现在大家越来越不愿意出门，大多数商品可以在网上买到。


    所以，出门一定要有某个足够说服力的“目的地”。


    目的地通常是：电影院、餐厅、KTV，以及星巴克、喜茶等。


    对于买喜茶的年轻人来说，排队是一种消费，而非成本。


