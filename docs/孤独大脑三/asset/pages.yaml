  md: '不投资科技股绝对不是迷信不迷信的问题。


    我们充分了解科技为整个社会所带来的便利与改变，只是没有人能预测往后十年这些科技公司会变怎样，我常跟比尔·盖茨及安迪·葛洛夫在一起，他们也不敢保证。


    经验表明，经营盈利能力最好的企业，经常是那些现在的经营方式与5年前甚至10年前几乎完全相同的企业。而一家公司如果经常发生重大变化，就是可能会因此经常遭受重大失误。推而广之，在一块总是动荡不安的经济土地之上，是不太可能建造一座固若金汤的城堡似的经济特许权，而这样的经济特许权正是企业持续取得超额利润的关键所在。


    良好的管理记录与其说是你有很高效率，倒不如说是因为你上了哪条船。当有着辉煌名声的管理人员要去对付前程黯淡、管理混乱、声名狼藉的公司时，不变的只会是公司的名声。如果你发现自己在一艘长期漏水的船上，那么造一艘新船要比补漏洞有效得多。优秀的骑士会在好马，而不是衰弱的老马上充分发挥。我对此事的观点从未改变。


    # ## 安全边际


    架设桥梁时，你坚持载重量为3万磅，但你只准许1万磅的卡车穿梭其间。相 同 的 原 则 也 适 用 于 投 资 领 域 。 ——格 雷 厄 姆 - 多德都市的超级投资者们
    - 巴菲特1984哥伦比亚大学的演讲


    投资成功的关键是在一家好公司的市场价格相对于它的内在商业价值大打折扣时买入其股份。内在价值是一个非常重要的概念,它为评估投资和企业的相对吸引力提供了唯一的逻辑手段。内在价值的定义很简单：它是一家企业在其余下的寿命史中可以产生的现金的折现值。'
