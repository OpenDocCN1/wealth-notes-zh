- pgno: 197
  md: '+   ◆一、这些年来，人们在酒桌上的话题越来越分裂，大家共同相信和喜欢的东西越来越少了，所以需要 一个类似茅台的东西成为信仰。


    +   ◆二、茅台酒本身变成了一种类金融产品，被人们不断地存了起来以待升值。


    这个话题好大，我也不打算展开说了。


    但是可以确认的是：存酒游戏会有个头。


    这是一个集体的杠杆游戏，一旦反向砸回来，结果也很难预计。


    这让我想起了啤酒游戏：1960年代MIT的Sloan 管理学院所发展出来的一种类似“大富翁”的策略游戏。


    游戏是这样进行的：


    +   ◆由一群人，分别扮演制造商、批发商和零售商三种角色，彼此只能通过订单/送货程序来沟通。


    +   ◆各个角色拥有独立自主权，可决定该向上游下多少订单、向下游售出多少货物。


    +   ◆至于终端消费者，则 由游戏自动来扮演。而且，只有零售商才能直接面对消费者。


    据说，不管是多么专业的人，每次玩这个游戏，都会得到一样的悲惨结果：


