  md: '《火星救援》里去救男主角的一个方案是：直接用无人飞船运送物资去火星。


    当时有一个两难的抉择：


    **方案1：** 按照正常的流程发射飞船，发射前需要多花10天检测，但是差这10天男主角会饿死；


    **方案2：** 略去发射前的检查，省出宝贵的10天。但是可能导致发射失败。


    **计算：** 检查中发现问题的几率是5%，出现的问题导致任务失败概率50%，略过测试导致失败概率2.5%，但是可以节省救命的10天。


    **决策：** 省掉10天检测，直接发射。


    **结果：** 发射失败。


    那么，这个基于概率的决策到底对不对呢？


    是对的。


    因为我们要把决策的过程和结果区隔离开来评估，这是基于概率的决策的关键。


    理解概率，与确定性共舞，在灰色环境下做出黑白分明的决策，敢于拥抱失败。


    以上都是创业者必备的“工程思维”。


    埃隆·马斯克说：人们对冒险存在极大的偏见，每个人都在努力求自保。


    有趣的 是 ， SpaceX之所以成就斐然，非常重要的原因就是他们的“反火箭发射思维”。'
