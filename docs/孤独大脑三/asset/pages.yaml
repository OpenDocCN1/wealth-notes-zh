  md: '负，但往往只有微薄资本的人，通过创造新东西或用旧东西改善顾客体验，取得了超出他们梦想的成功。


    查理和我曾游历全美，与这些人或他们的家人相遇。在西海岸，我们从1972 年收购置诗糖果果（ See''s Candy ）开始了这一惯例。整整一个世纪前，玛丽·时恩（Mary
    See）开始推出一种古老的产品，她用特殊的配方对其进行了改造。除了她的商业计划之外，她还开设了一些古色古香的商店，里面有友好的销售人员。她在洛杉矶开的第一家小专卖店最终发展成了几百家商店，遍布整个西部。


    今天，时恩女士的作品继续令客户感到愉悦，同时为成千上万的男女提供终身就业机会。伯克希尔的工作就是不干涉公司的成功。当企业生产和分销一种非必需的消费品时，客户就是老板。而且，100年后，客户向伯克希尔传递的信息依然清晰：“不要乱动我的糖果。（喜诗糖果的网址是https://www.sees.com/，可以试试他们的花生糖。）


    接下来让我们跨越大陆来到华盛顿特区。1936年，利奥·古德温和他的妻子莉莲开始相信，汽车保险——一种通常从代理商那里购买的标准化产品——可以直接以低得多的价格出售。两人怀揣10万美元，与拥有1000倍甚至更多资本的大型保险公司展开了较量。政府雇员保险公司（后来简称为GEICO）由此开始了其漫漫征程。


    幸运的是，我在整整70年前就了解到了这家公司的潜力。它立刻成为了我


    1088'
