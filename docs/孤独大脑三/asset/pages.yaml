  md: '# 温顺的人，必将继承世界


    说起温顺，你也许可想起羔羊。


    温顺，温柔，温和。


    不错，我们喜欢这些词汇。


    然而，喜欢并不代表“立场”。


    就像我们喜欢好人，却未必愿意当好。


    我们的话语体系里，温顺象征着弱势：


    人善被人欺，没本事才老实。


    我们推崇胜者为王，重利害而轻是非，愿意先有屠刀然后再放下成修。


    既然如此，温顺的人，何以继承这个世界？


    最近，一个真实的故事正在上演：


    有个温顺的人，导演了一部尚显稚嫩的电影《你好，李焕英》，红遍中国。


    本文将借此热点来表达：


    温顺的人，必将继承这个世界。


    至少，我们期望如此。


    温顺并非逆来顺受，祈求命运给好子发糖吃。


