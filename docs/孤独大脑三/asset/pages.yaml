- pgno: 130
  md: '大师们以“组块”来感知棋子分布。大师在超前搜索时很少比新手走的更远，他们感知棋局的方式像一个过滤器：在观察局势时已经建立了更高层次的组织，坏棋一般不会彼想出来。


    智能紧密地依赖于为复杂对象——如棋盘、电视屏幕、书页或画面——构造高层描述的能力。


    孤独大脑：人类天才的大脑是如何做出对弈决策的？先从围棋的计算说起。绰号天煞星的加藤正夫，经常在不可能的情况下屠大龙，算路极深，可以50手几乎无变化的追杀对手。


    这种直线追杀仿佛福尔摩斯那种一连串拐了很多弯的演绎推理，炫目而有魔幻效果。但，难题不在这里。


    Master：这类问题固然复杂，仍然是有边界的，相当于超级死活题，有惟一解    对   于   A I   而   言  ，   算   不   上   挑   战   。


    孤独大脑：吴清源经常被问：目算步数时要算几遍，每一次目算能看多少步？


    他说：这是很难回答的问题。没法三言两语说明白。常听人说一眼看30步的话，其实不用看这么远，也可以下出好棋。每看一遍都见出许多枝叶的细节，如果只一个细节没看到，因而了解错误，则全部的目算就都没有用了。


    在目算棋势时，必须做最好的判断，在目算的同时就做到断了。


    如 果 判 断 错 误 ， 目 算 多 少 步 都 没 有 用 处 了 。


    木谷实被问及为何长寿，他回答说：首先在作为直感而浮现于眼前的四、五手中，从最不可能成立的一手开始，一子一子地往下计算。


    吴清源接着发表自己的看法：'
