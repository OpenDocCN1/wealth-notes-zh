- pgno: 332
  md: '在“对赌”的场合，关键在于你比对对手“蒙”得更准，就像两个人在森林里遇到狗熊，重点不是比狗熊跑得快，而是比另外一个人跑得快。


    霍华德·马斯克对此总结道：


    +   •要在这场对赌游戏中赢多、输少，你就必须在知识上有优势，你要比对 手知道得更多。这正是卓越投资人的优势所在：卓越投资人对未来的 趋势比一般投资人知道得更多。


    •你即使知道概率，也无法"确定"知道未来具体体会发生什么。你还是 有30%的概率会输，并且不知道具体哪一次输，哪一次赢。


    •对于投资这类"赌局"，理论上你只要50.1%的优势，并且形成下注的 连续性，就有机会实现接近于百分之百的收益。


    这里的关键是：


    对未来趋势，你知道得比别人更多，即占有知识优势，就足以让你取得长期 投资成功。


    这就是所谓的洞见。


    张磊早年敢满仓腾讯，下注京东等公司，都是因为他根据美国的"基础概率" 和自身的"知识优势"，比别人更早更准确地"蒙"对了这些公司的胜率。 他"偷"看了底牌。


    胜率，是用概率来做决策依据，也就是某种量化思维的大局观。


    然而，"追求做大概率正确的事情"，这句话百分之百正确吗？


    并非如此。'
