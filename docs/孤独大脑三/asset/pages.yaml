  md: '工程师思维的第三个属性关乎取舍：


    **经过深思熟虑后对解决方案和备选方案做出决断的能力。**


    资源和时间都是有限的，必须根据重点进行分配，要将弱目标从强目标中分离出来。


    在约束条件下，我们要学会取舍，以及进行“灰度认知+黑白决策”。


    例如特斯拉的SUV，为了“取”鹰翼门，“舍”了很多看起来根本无法舍弃的功能。在加拿大，夏天露营冬天滑雪，是很多家庭的传统。所以我开的燃油车 SUV，车顶的储物箱几乎必不可少，可以一般脑地把全家人的滑雪板全部塞进去。


    ![](img/1b28e73d340463bb3046e948e240b367_56_0.png)


