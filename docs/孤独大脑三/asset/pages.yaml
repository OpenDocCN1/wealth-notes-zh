  md: '价格是你所付出的，价值是你所得到的。


    于每一笔投资，你都应当有勇气和信心将你净资产的10%以上投入。


    在错误的道路上，奔跑也没用。


    如果你一生中**找到三个杰出的企业**,你就会变得非常富裕。


    控制风险的最好办法是深入思考，而不是投资组合。


    我们只是对于估计一小部分股票的内在价值还有点自信，但也只限于一个价值区间，而绝非那些貌似精确实为谬误的数字。价值评估既是艺术，又是科学。


    对大多数投资者来说，重要的不是他们知道多少，而是他们能在多大程度上认识到自己不懂什么。


    （有人质疑巴菲特的投资策略只是运气好而已，他讲了一个有关机率的故事回答它们）一群猪共有128000只，分别来自全世界各农场举行丢铜板比赛，投出正面的晋级，投出反面的淘汰，经过九回合后，只剩下250只猪晋级，有人认为那250只猪只是运气好而已。如果你发现晋级的250只猪有200只是某农场来的，那你就必须问：那个农场喂猪的饲料有没有特别之处？


    我对总体经济一窍不通，汇率与利率根本无法预测，好在我在作分析与选择投资标的时根本不去理会它。


    利率就像是投资上的地心引力一样。'
