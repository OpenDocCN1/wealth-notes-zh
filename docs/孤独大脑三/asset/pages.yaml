- pgno: 65
  md: '对此，埃隆·马斯克如是说：


    > “一定有一些原因让你 在早上起来，让你想要活下去。你 为什么想要活下去？有什么意义？是什么激励你？你喜欢未来 的什么？如果未来不包括置身于恒星之间，成为一个多星球的物种，我觉得这非常令人沮丧。”


    人生短暂，不干点儿有意思的事情真是太蠢了。


    有一个足够足够有意义的、无法被质疑的使命，是“工程思维”的守护神。


    +   2、 找到自己**喜欢并且擅长**的事情，以**最大的热情**为之奋斗，这很重要。


    生活艰辛，工作操劳，诸事不易，创业更是九死一生，挫折不断。


    如果不是干自己骨子里相信和喜欢的事情，很难熬下来。


    +   3、 愿景和使命是一种**粗线条**的算法，是一套导航系统。


    愿景是一种伟大的粗线条算法，能够帮助我们找到目标，制定战略。就像圣雄甘地说的，找到你的目标，方法就会随之而来。


    当我们在未来的森林里穿行时，如夜晚般黑暗。


    尤其是在那些创新领域，预测是徒劳的，但我们又不能如苍蝇一般乱撞。


    解决办法是：**长线如蜜蜂般追逐光源，短线像苍蝇那样乱撞**。


    个人和企业都需要有使命与愿景的确定性，战术和试错的随机性。


    +   4、 使命**聚合人才与资源**，甚至为产品赋予灵魂。


    埃隆·马斯克令身边的人相信：“他对火星的迷恋绝不是PR行为，SpaceX的 员工们在用血汗为之努力。


