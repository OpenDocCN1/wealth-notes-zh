  md: '人的一生，短期靠运气，长期靠实力。--中间是机会泵。


    +   •为什么有些笨家伙比你有更好的财运？


    +   •为什么你的桃花运还不如某些丑男丑女？


    +   •运气到底是天注定，还是靠努力？


    本文提出了一个原创的概念：机会泵。


    机会泵是这样的-种装置，其用于：增加好运气的可能性，降低坏运气的可 能性。


    如同心脏，泵的循环往复，像是一天、-一年的重复，更像是一个人的宿命。


    这宿命因为服从或反抗，而被改变，被强化。


    人的一生，短期靠运气，长期靠实力。


    但是，我们需要-个运气管理系统，把运气和实力连接起来。


