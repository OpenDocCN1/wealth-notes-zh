- pgno: 255
  md: '所有制“转机”的公司，最后很少有成功的案例，与其把时间和精力花在购买价廉的烂公司上，还不如以公道的价格投资一些物美的大企业。


    经验显示，能够创造盈余新高的企业，现在做生意的方式通常与其五年前甚至十年前没有多大的差异。


    我们判断一家公司经营的好坏，取决于其净资产收益率（排除不当的财务杠杆或会计做帐），而非每股收益的成长与否，因为即使把钱固定存在银行不动，也能达到后者一样的目的。


    （巴菲特反对股票分割配股，他甚至还开玩笑地在朋友的生日贺卡上写到）祝你活到伯克希尔分割股票之时。


    （在购并国际乳品公司时巴菲特说到）我们把钱摆在吃得的地方。


    （巴菲特在1985年结束伯克希尔纺织部门营运时，解释过）一只少数马的马是了一只不起的马，却不是了不起的数学家，同样的一家能够合理运用资金的纺织公司是一家了不起的纺织公司，但却不是什么了不起的企业。


    如果我们雇用一堆比我们矮小的人，那么我们会变成一堆侏儒，但相反地若我们雇用一堆比我们高大的人，那么我们终将成为一群巨人。


    寻找超级明星——给我们提供了走向成功的唯一机会。


    一个二流的企业最有可能仍旧是二流的企业，而投资人的结果也可能是二流的。


    1115'
