- pgno: 186
  md: '> 正如拉罗什夫利所说：意志薄弱的人，一定不会诚实。


    总之，Costco在中国的火爆，说明了一件事：


    # 在诚实这件事情上，我们还有套利空间。


    对个人而言，诚实就是本分。


    本分，首先是不骗自己，做正确的事。骗别人最大的坏处是，最后把自己也骗了。


    本分和人品没啥关系，本分其实就是“理性”，是一切思考、计算、决策中的第一因素。


    对企业而言，最基本的美德将成为竞争力的源泉。


    Costco的新任总裁杰夫·林奈克喜欢在谈话结束时说“好事将会降临在你身上”。


    例如，他会说：


    > “我们以最低的价格销售高质量的东西。如果你尊重顾客及员工，好事就会降临于你。”


    这些年，生意人日子不好过。但我们仔细想想看，那些爆掉的企业，大多是大忽悠。潮水退去，先挂掉的都是没穿内裤的。


    诚实，也就是极度坦诚，极度透明。


    无论是对个人还是企业，“诚实”可能会成为未来二十年中国最重要的商业文明变革。'
