- pgno: 308
  md: '因为：拥**有**太多，你会失去“得**到**感**。


    人们在拥有之后，会需要下一个“自己**不**拥有的东西”。


    人们购买商品，是在追求某些虚无缥缈的意义。


    叔本华说：人生就是一团欲望。当欲望得不到满足便痛苦，当欲望得到满足便无聊，人生就像钟摆一样在痛苦与无聊之间摇晃。


    价格区间的“人生意义”也在于此。当人们在某个价格区间的欲望得到满足，需要马上奔向下一个，否则就会无聊。


    拥有太多有什么坏处呢？你没有下一个价格区间的“消费目的地”了。你仿佛来到了无聊的极地，无处可摇晃。


    假如你能随意买到所有的东西，就会失去渴望得到某样东西的欲望，也失去了刚刚得到某样东西时的激动。


    所以，游走于“价格区间”的商人们，才是世俗世界的哲学家。


    ![](img/1b28e73d340463bb3046e948e240b367_308_0.png)


    # # 人生道理


    “价格区间”给我们的启发，远不止是商业上的。


    还包括我们的人生决策与选择：


    1、一切决策，首先是“数量级的决策”。


    例如你决定买房子，看中一套很喜欢的，卖家开价300万，你还价285万，对方不答应，你该怎么办？'
