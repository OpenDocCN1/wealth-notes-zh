- pgno: 184
  md: '诚实比一切智谋更好，而且它是智谋的基本条件。


    ![](img/1b28e73d340463bb3046e948e240b367_184_0.png)


    在我们的文化体系里，诚实和聪明是不太兼容的。


    我们的智谋故事里，“诚实”是一种选择性行为，例如对于君子要诚实，对小 人就可以不诚实。


    而且，对小人不诚实，还可以视为一种美德。


    但是，如果别人在你眼中都是小人呢？


    商人谈诚实，似乎也有些装腔作势。


    商人的本质就该是赚钱，否则不就是在失职吗？


    很多人格外鄙视商人。尽管这些人自己心底也很爱钱。但在我看来，商人对于钱，有婴儿对于食物的那种纯洁的欲望。对比起这个世间各种污浊，钱不算是脏的。


    Costco的故事告诉我们，诚实能带来长线收益。既然如此，那些希望长线赚钱的商人，就能主动地变“诚实”。他们对钱是如此贪婪，以至于他们的诚实最终弄假成真。


    自然界的进化，大脑的运转，都是基于类似奖励机制的强化作用。


    对此，芒格以收款机为例分析道：


    比如，收款机的发明能够使不诚实的行为难以得逞，所以它对文明社会作出了杰出的贡献。正如斯金纳十分清楚地知道的，得到奖励的坏行为特别容易形成习惯。所以收款机是一种伟大的道德工具。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '又例如，芒格还说：


    在我看来，修道士卢卡·帕乔利发明的复式簿记法在经济生活中产生了巨大的美德效应。它让商业变得更容易掌握，也让它变得更加诚实。


    从这个角度来看，诚实的确是一种很好的策略。


    但你必须“装”得非常彻底才可以。


    要想取得成功，光有诚实是不够的。


    最诚实的是劫匪，直接就说：我想要你们的钱。这种能算诚实吗？


    贪婪而自私的“诚实”，只能称之为无耻。


    诚实还需要智慧和坚定不移。


    聪明就不用了，其潜台词是，我聪明到可以不用太诚实的程度了，但我决定还是很诚实，所以我得到了奖励。


    狮子的仁慈才有价值。


    我并不是说弱者的诚实没有意义。但是在商业领域，有实力活下来是前提，否则多诚实都没有用。


    诚实，还必须是一种长期主义的战略。


    Costco的创始人西格尔看似随和，心底却有着极为坚定的信念。他一直想让企业有更长远的发展。他说：


    我的计划里没有“撤退”这个词。'
