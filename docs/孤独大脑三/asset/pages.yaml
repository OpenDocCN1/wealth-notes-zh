  md: '消费者总是选择一场与价格区间门当户对的“婚姻”。


    # ### 二


    # ## “价格区间”原理


    犹如宇宙主要是由暗物质组成的，人类大 多时候受弗洛伊德所发现的“无意识” 致使。


    我是一个数码爱好者，早些年最喜欢去HK逛几个电脑中心，那时候觉得琳 琅满目，美不胜收。


    有次带了一个朋友去，他问：这个有什么用？那个有什么用？我一想，好像 真没用。结果什么都没买成。


    人生迷惘，意义需要被人赋予。购买东西，是人类无意识的欲望释放。而人 们必须想买的东西，是盲目而漂浮的。


    另一方面，威廉·庞德斯通告诉我们：


    价格只是一场集体幻觉。


    在心理学实验里，人们无法准确地估计“公平价格”，反而受到无意识、不 理性、政治等不正确因素的强烈影响。


    这时候，惟一的指路明灯，便是价格区间。你年轻的时候想要一个Coach 包，现在想要一个爱马仕。你想把本田CRV换成奔驰GLE。


    这些或是内在的需求，或是外在的阶级符号，都通过价格区间来划分的，并 且形成强烈的用户指向。


