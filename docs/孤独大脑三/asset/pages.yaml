  md: '# 价格区间：你非买不可的“目的地消费品”


    几乎所有的商业秘密，都与价格有关。


    在本文中，我提出了“价格区间定理”：


    +   定理一：每个价格区间，至少都会出现一样牛逼的产品，和一家伟大的公司


    +   定理二：该产品能够带给你该价格范围内，你能够获得的最大满足感。


    “定理”是我号称的。其实，科特勒就说过：


    > “营销就是价格以产品为载体卖出去。”


    价格区间提供了一种独特的商业思考逻辑。


    作为配套概念，本文还提出了：


    所谓牛逼产品，就是你非买不可的“目的地消费品”。


    “价格区间”还给我们如下启发：


    +   1、一切决策，首先是“数量级的决策”。


    +   2、先做数量级正确的事情。


    +   3、模糊的精确，好过精确的模糊。


    +   4、可重复的较低“价格区间”，好过不可重复的较高“价格区间”。'
