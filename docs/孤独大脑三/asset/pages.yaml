    在线支付对街头乞讨是致命的摧毁，但却催生了百倍的各类“在线乞讨”。相同之处是乞讨者通常比施舍者更有钱。


    诗意一愁可能就淡了，展意越憋越浓。


    名校的本质，是一种高成本的智力测试系统。对社会而言是不合算的，对用人机构来说是合算的。


    一名设计师（尤其是室内设计师）的首要价值是阻止客户乱来。


    有时候旁观者清，有时候当局者清。前者有广度但缺深度，后者有深度但常常迷失于广度不足。


