- pgno: 5
  md: '# 前言


    当我们做一件事情或说一句话的时候都是有假设条件的，我们没有口头提出是因为如果我们每次说话都要像做数学题一样，先把假设条件说一下，再沟通也确实太闷或者无味了。


    我想必须要要有前言来说明一下写这本书的动机，而这个动机的背景、假设以及定位也要在这里做个具体的介绍。


    还得从 2010 年股指期货开通说起，股指期货的推出使得量化投资开始兴起，CTP（综合交易开发平台）的推出使得很多从事软件行业或者理工科背景的“牛人”纷纷转行进股指期货交易这个领域，当然那几年国内很多外资背景的电子行业的公司撤出中国也导致很多计算机行业从业人员转行过来，这和《我的宽容人生》里的主人公所处境背景差不多：美国“冷战”结束，在军工方面的经费投入急剧减少，使得很多火箭专家纷纷投入华尔街。新兴事物的发展总是由各种机缘促成的，这几年大数据、云计算和区块链等科技在大众创业、万众创新的潮流中精彩纷呈，从华尔街回来的“80
    后”创建自己的对冲基金，量化对冲基金逐渐成为国内的主流。


    总之，科技在改变生活，而离得最近、最值得挑战的就是金融市场，我们现在从事金融行业，研究量化投资和量化技术。


    这本书面向的读者是财经院校的大学生或者研究生，所以我不会讲很多知识点，不会讲得很复杂，尽可能讲得清楚。我认为本书更像是一幅地图，能让读者迅速了解这个行业，能掌握一个模型，快速上手去实践或参与项目，然后不断深入。


    本书可以作为培训教材，其定位也是希望让非财经院校背景的学生毕业后能迅速了解当前金融市场的生态，能在金融机构迅速上手做项目或成为一名基金经理助理；能让金融从业者或者投资者更好地使用量化投资工具进行数据分析，从而更好地进行投资。


    同时，本书不会花时间去介绍投资组合、风险管理等理论，更多强调的是使用 Python，而且假设都是使用 Windows 系统，我们不会告诉读者要在 Linux
    或者 Mac 上怎么做，我们仅仅提供一个系统的解决方案，让读者快速'
