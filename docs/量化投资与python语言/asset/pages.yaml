  md: '# ## 2.6 大数据人才


    传统的数据挖掘工具和 BI 系统已经存在很久了，通过各类报表展示，让管理层了解企业运营信息，过去的确帮助企业提高过管理水平，达到了预期目的。


    在大数据时代，企业需要的是实时数据，需要的是高效工具，需要的是决策支持和预测。传统的数据挖掘工具的性能和灵活性已经不能满足企业的需要，另外非机构化数据的应用也对传统数据工具提出了挑战。BI
    领域中的 SAS、SPSS、TD 等数据工具越来越被边缘化，R 和 Python 语言正在成为数据统计和可视化的新宠。


    数据的时间价值正在得到重视，特别是金融企业，所有的业务部门都期望在最短的时间里，看到资金使用情况、客户交易情况以及风险管控情况。企业越早了解信息，就会越早进行决策，时间就是金钱。过去数据需求可能是（T+5）或者（T+30），现在的数据需求往往是（T+1）或者（T+0），数据实时性、准确性、相关度被提到了一个非常重要的地位。业务的需求已经很明显了，但是数据工具和人才却是一个很大的挑战。


    中国 200 多家大数据企业，看到了大数据产业的曙光，看到了大数据产业的价值，同时也在经历着大数据企业的痛苦。大数据产业发展很快，市场正在逐步变大，但是其产业优势不明显，优势企业很少，数据商业化较慢，市场还不成熟，客户数据商业敏感度较低，缺乏高质量数据工具和人才。所有大数据企业内心的感受就是，站在了时代的风口，选对了方向和行业，但是想发展壮大还是很难。200
    多家大数据企业正在努力耕耘着大数据产业，痛并快乐着。


    就数学和统计专业而言，目前绝大多数的数据科学家有数学和统计专业背景，所以你选择的学校可能并没有所谓“数据分析”这个专业，但是其数学和统计专业很可能有开设一系列课程帮助你培养大数据分析的能力，甚至还会建议你选修一些外系的编程或市场营销课程来丰富你的技能组合。


    另一个进入大数据领域的方式是学习计算机科学专业，这一路线将会侧重于学习大数据采集和分析的技术问题。


    目前市面上许多的大数据技术，如 MapReduce、NoSQL 和 Hive 就是来源于软件工程师的发明创造。所以如果你对计算机科学感兴趣，又想毕业后从事大数据相关岗位，就可以在本科阶段侧重于对人工智能、机器学习和数据理论方面的学习。


    如果说计算机科学专业研究的是如何让大数据技术变得更快更好，那么商科生学习的就是如何用大数据技术去为企业赢得利润，因此更关注的是如何把大数据技术与市场营销、产品定位和购买模式等结合起来。


    与此同时，越来越多的商学院开始开设专业商业数据分析的本科和研究生项目，尽管不像计算机科学专业那样对于理工知识有那么多高的要求，但是还会涉及一定的数据库设计、分析和编程以及相关统计软件，如
    Python 的使用。'
