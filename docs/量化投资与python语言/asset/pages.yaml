  md: '# 第10章


    # Pandas 介绍


    # 10.1 Pandas 的特点


    Pandas 是金融行业从业人员做数据分析的首选库,如非必要,建议尽可能使用 Pandas,这也是本书前面几个部分对 Python 介绍得并不多的原因。


    Pandas 使得数据分析工作变得更加简单。


    Pandas 是基于 NumPy 构建的,这让以 NumPy 为中心的应用变得更加简单好用。


    Pandas 是 Wes McKinney 在一家对冲基金公司做量化投资工作时创建的,这让我们更有理由用好这个库。


    # 10.2 Pandas 的数据结构


    要使用 Pandas,其实最需要熟悉的就是两个数据结构: Series 和 DataFrame。这两个数据结构能够让我们解决金融行业的绝大部分的金融数据。


    这里有必要再讲讲为什么可以这么理解。其实我们看到的结构化数据基本上就可以理解为一个矩阵。Series 就是一个向量,DataFrame 就是一个矩阵,向量也是特殊的矩阵,N
    行 1 列的一种矩阵。


    大家可能也会发现这和 R 语言是很类似的,同时我们还会进一步讲解为什么有了 Python 的 list,进一步有了 NumPy 的 array,为什么现在还需要有个
    DataFrame。


    # 10.2.1 Series


    Series 是类似于于一维数组的对象。它由一组数据以及一组相关的数据标签,其实就是索引组成的。举例如下:


    Series 的形式如图 10-1 所示,左边是索引,右边是值。由于我们没有为数据制定索引,于是系统会自动创建一个 0~(N-1)(N 为数据的个数)的整数型索引。我们可以通过
    Series 的 value 和 index 属性获取,如图 10-2 所示。


    ```

    In [22]: import pandas as pd

    ret=pd.Series([11.45, 2.67, 36.45, 0.43])

    ret

    Out[22]: 0  11.45

    1   2.67

    2  36.45

    3   0.43

    dtype: float64

    ```


