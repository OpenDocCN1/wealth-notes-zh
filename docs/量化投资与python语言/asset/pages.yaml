  md: "# ## 10.2.2 DataFrame\n\nDataFrame 是一个表格型的数据结构。它含有一组有序的列，每列可以是不同的值类型(数值、字符串、布尔值等)。DataFrame\
    \ 既包含行索引，也包含列索引，也可以看作是由 Series 组成的字典。\n\n当然，在这里读者可能会想到 Numpy 的多维数组，其实虽然 DataFrame\
    \ 是按照二维数据结构保存的，但还是一样可以轻松地表示为更高维度的数据。这里，我们主要是面向金融行业的金融数据进行分析。\n\n创建 DataFrame 的办法很多，最常用的是直接传入一个等长的列表或\
    \ NumPy 数组组成的字典，如图 10-7 所示。\n\n```\n```\nIn [30]: data = {\"open\": [3245, 3246,\
    \ 3247], \"high\": [3255, 3256, 3257]}\nframe = pd.DataFrame(data)\nOut [30]:\n\
    \      high  open\n0     3255  3245\n1     3256  3246\n2     3257  3247\n```\n\
    ```\n\n跟 Series 一样，DataFrame 会自动加上索引，且全部列会有序排列。\n\n# ## 10.2.3 重要的方法介绍\n\n# ###\
    \ 1. 重新索引\n\nPandas 对象的一个重要方法是 reindex，作用就是创建一个适应新索引的对象。比如图 10-8 所示。\n\n```\n\
    ```\nIn [32]: sdata = {\"open\": 3246, \"high\": 3255, \"low\": 3229, \"close\"\
