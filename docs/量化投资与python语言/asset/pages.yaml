  md: '据的维度分析、数据的切片、数据的上钻和下钻、Cube 等。


    谈了这么多, 核心还是想说明大数据两大核心为云技术和 BI, 离开云技术, 大数据就没有根基和落地的可能; 离开 BI 和价值, 大数据又变变为舍本逐末,
    丢弃关键目标。简单总结: 大数据目标驱动是 BI, 大数据实施落地是云技术。


    大数据的本质就是利用计算机集群来处理大批量的数据, 大数据的技术关注点在于如何将数据分发给不同的计算机进行存储和处理。


    云计算的本质就是将计算能力作为一种较小颗粒度的服务提供给用户, 按需使用和付费, 体现了以下几个特点。


    +   1. 经济性。经济性是指不需要购买整个服务器。


    +   2. 快捷性。快捷性是指即刻使用, 不需要长时间的购买和安装部署。


    +   3. 弹性。弹性是指随着业务增长可以购买更多的计算资源, 可以需要时购买几十台服务器的 1 个小时时间, 运算完成即可释放。


    +   4. 自动化。自动化是指不需要通过人来完成资源的分配和部署, 通过 API 可以自动创建云主机等服务。


    云计算的技术关注点是如何在一套软硬件环境中, 为不同的用户提供服务, 使得不同的用户彼此不可见, 并进行资源隔离, 保障每个用户的服务质量。


    # ## 2.5 大数据产业


    数据作为一个新兴的产业, 一直处于舆论的风口浪尖。


    当前有人认为大数据产业“过热”, 事实上, 大数据的潜力应该还远远没被释放出来。目前从实际情况来讲, 大数据产业在硬件支持方面的布局如火如荼, 大数据中心也在纷纷建设之中,
    但是数据与数据的碰撞、数据价值的开发、数据价值的应用落地等, 仍然处于初期阶段。随着借助传感器、可穿戴设备、智能感知、视频采集、增强现实等技术可实现实时的信息采集和分析,
    这些数据能够支撑智慧城市、智慧交通、智慧能源、智慧医疗和智能环保的理念需要。大数据将充分实现对交通、医疗、教育、环保、农业等产业的升级改造, 以及大数据应在社会生产、生活更广的范围内得到普及。


    大数据的价值体现在预警、预测、决策、智能等方面。预警, 即通过数据采集、数据挖掘、数据分析, 对已经存在的风险发出预报与警示; 这个体现在气象预测、地震预测以及各个行业的舆情分析。预测,
    是指立足于纵向时间轴, 对相对长时间内某些问题的判断形成指导; 这个很多应用在金融行业, 比如当前很热的量化投资。决策, 是指通过所有相关数据的联动, 形成基于数据和分析之上的决策或结论;
    智能, 即当我们基于对现实问题的分析与判断, 通过技术手段实现智能化的行为。大数据相关的科技公司解决的问题基本上也是从这几方面进行发挥的。


    当然, 大数据也面临着一些需要逐步解决的问题, 包括技术问题、数据孤岛问题等。比如政府部门存在“不愿开放、不敢开放、不会开放”数据的问题, 如何开放共享仍有待探索。'
