  md: '# 内容简介


    Python 是当前金融行业的主流编程语言,金融机构特别是量化投资领域大量使用 Python 进行数据分析以及投资策略测试、实盘交易等。财经类院校基本上没有开设
    Python 编程这门课,主要还是 Excel、R 等。


    本书主要包括三部分:介绍金融领域内的前沿科技,主要是大数据、云计算、人工智能等;二是 Python 数据分析篇,主要介绍 Python 编程基础,Pandas
    数据分析以及网络爬虫;三是量化投资篇,主要包括量化投资常见策略,当前国内量化投资平台简介,平台策略开发案例分析等。


    本书适合财经类院校的学生、金融机构的从业人员学习,上手简单,有助于在大数据背景下的各种金融投资技术的应用开发。


