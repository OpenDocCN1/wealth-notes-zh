    # 6. 定义函数


    在 Python 中，定义一个函数要使用 def 语句，依次写出函数名、括号、括号中的参数和冒号。然后，在缩进块中编写函数体，函数的返回值用 return
    语句返回。


    举个简单的例子，考虑返回输入 $x$ 的平方的函数 $f$，如图 8-33 所示。


    ```

    In [45]: `def f(x):`

    `return x**2`

    f 12

    Out[45]: 144

    ```


    图 8-33


    请注意，函数体内部的语句在执行时，一旦执行到 return 时，函数就执行完毕，并将结果返回。因此，函数内部通过条件判断和循环可以实现非常复杂的逻辑。


    如果没有 return 语句，函数执行完毕后也会返回结果，只是结果为 None。


    return None 可以简写为 return。


    # 7. 过滤、映射和归纳


    Python 提供一些用于函数式编程支持的工具，也就是在列表对象应用某个函数。这些工具包括过滤、映射和归纳等。


    （1）熟练掌握 lambda 函数


    首先，要明白 lambda 表达在 Python 中是作为一个匿名函数的构造器而存在。其次，要明白 lambda 表达式的常用场景是 lambda 表达式对应函数的使用次数非常有限（因此，没有必要专门定义一个非匿名函数），同时保证了代码的简洁性。编程中提到的
