- pgno: 3
  md: '# 写在前面的话


    我本科和研究生都是学数学的，和朋友见面，很多时候知道你是数学专业的，都会觉得你好聪明，数学不是一般人能学习的。说实话，一直以来，我都认为数学和其他学科没什么两样，只是每个人口味不同而已，一些人喜欢物理，一些人喜欢土木工程；就像在农村学做个砖匠、木匠或者瓦匠一样，只是一门技艺。大部分人学习一门专业，其实更多的是一种方法论的学习，专业修养的积累；同时，做着文化传承的工作。当然，肯定也会有一些有兴趣或天赋的人一生致力于数学某一个领域的研究，比如陈景润。


    那么对于文科背景的人在当今这样的时代，怎样快速掌握金融领域内的科技以及量化金融工作方法呢？我认为方法论就很重要。比如我学习的是数学，大学时期就开始做家教，办培训班，对于数学我会看重三点：一是数学研究某一事物一般遵循三个步骤，首先把要研究东西的放在起，也就是要定义一些东西；接着就要研究基于这个定义的东西有什么性质，如果是代数方面的就是有哪些运算规则；最后就是这些性质对于我们生活有什么用，怎么解决现实的问题。二是搞数学就是搞关系，我们搞清楚了这个东西的性质，那个东西的性质也搞清楚
    了，它们之间有什么关系呢，某一个定理或者结论总是要解释事物间的关系。三是我们总是在受约束的条件下解决一个最优化的问题，不管是搞学术还是工作、生活都面临一个约束条件，我们要认识到这个约束条件，然后去讨论可行性，找出最优化的方案。


    写这么多其实就是想说，我接下来介绍的金融科技都是基于这样的理念去阐述的，希望大家掌握一个模型，快速掌握这些信息，至少让我们在这个行业有一幅“地图”，知道应该在哪个方面去最大化自己的能力和贡献，在工作和生活中更加游刃有余。'
