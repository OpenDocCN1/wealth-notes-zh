    # ## 6.2 常见开源包介绍


    这里我们针对国内读者在金融行业中的应用，介绍常见的库。


    +   1. **NumPy**


    NumPy (Numerical Python) 是一个开源的 Python 科学计算库。使用 NumPy，就可以很自然地使用数组和矩阵。NumPy 包含很多的数学函数，涵盖线性代数运算、傅里叶变换和随机数生成等功能。


    +   2. **Pandas**


    Pandas 是基于 NumPy 的一种工具，该工具是为了解决数据分析任务而创建的。Pandas 纳入了大量库和一些标准的数据模型，提供了高效地操作大型数据集所需的工具。Pandas
    提供了大量能使我们快捷便捷地处理数据的函数和方法。你很快就会发现，它是使 Python 成为强大而高效的数据分析环境的重要因素之一。


    +   3. **Matplotlib**


    Matplotlib 是 Python 最著名的绘图库，它提供了一整套和 MATLAB 相似的命令 API，十分适合交互式地进行制图，而且也可以方便地将它作为绘图控件，嵌入到
    GUI 应用程序中。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 4. TuShare


    TuShare 是一个免费、开源的 Python 财经数据接口包，主要实现对股票等金融数据从数据采集、清洗加工到数据存储的过程，能够为金融分析人员提供快速、整洁和多样的便于分析的数据，为他们在数据获取方面极大地减轻工作量，使他们更加专注于策略和模型的研究与实现上。考虑到
    Python Pandas 包在金融量化分析中体现出的优势，TuShare 返回的绝大部分的数据格式都是 Pandas DataFrame 类型，非常便于用
    Pandas/NumPy/Matplotlib 进行数据分析和可视化。'
