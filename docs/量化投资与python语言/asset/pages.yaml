  md: "（1）内连接需要的是两个表的某一行满足一定的条件（直接理解为：默认的是两个表的某一行相等的才返回这行的元素）。\n\n（2）外连接返回的是两个表所有列标签的元素，该列标签没有元素，Pandas\
    \ 中用 NaN 代替。\n\n先举第一个例子，如图 11-10 所示。\n\n```\n```\nIn [86]: df1=pd.DataFrame({\"\
    open\":[3200, 3201, 3203, 3204], \"name\":[\"a\", \"b\", \"c\", \"d\"]})\n   \
    \       df2=pd.DataFrame({\"open\":[10000, 10001, 10002, 10003], \"name\":[\"\
    a\", \"b\", \"c\", \"d\"]})\n          df1+df2\n```\n\n**Output:**\n\n|   | name\
    \ | open |\n|---|------|------|\n| 0 | aa   | 13200|\n| 1 | bb   | 13202|\n| 2\
    \ | cc   | 13205|\n| 3 | dd   | 13207|\n```\n\n![](img/06df04b918a135496579a0c4d2004314_88_0.png)\n\
    \n如果我们直接用加法，会发现这个可能并不符合我们的预期。\n\n第二个例子，如图 11-11 所示。\n\n```\n```\nIn [87]: df1=pd.DataFrame({\"\
    open\":[3200, 3201, 3203, 3204], \"name\":[\"a\", \"b\", \"c\", \"d\"]})\n   \
    \       df2=pd.DataFrame({\"open\":[10000, 10001, 10002, 10003], \"date\":[\"\
    20170301\", \"20170302\"\n          \"20170303\", \"20170304\"]})\n          df1+df2\n\
    ```\n\n**Output:**\n\n|   | date | name | open |\n|---|------|------|------|\n\
    | 0 | NaN  | NaN  | 13200|\n| 1 | NaN  | NaN  | 13202|\n| 2 | NaN  | NaN  | 13205|\n\
    | 3 | NaN  | NaN  | 13207|\n```\n\n![](img/06df04b918a135496579a0c4d2004314_88_1.png)\n\
    \n这个例子，可以看到，合并的时候如果列标签不一样，都是按照 NaN 处理的，当然我们也可以按一定规则进行数据补充。\n\n第三个例子，如图 11-12 所示。\n\
