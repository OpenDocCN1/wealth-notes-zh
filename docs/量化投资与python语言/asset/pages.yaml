    # 量化投资介绍


    近年来，量化投资成了国内金融市场发展的热点，大家聚在一起不谈一下量化对冲就觉得好像不是做投资的一样。现在，量化投资和基本面分析、技术面分析可以说是三大主流方法。


    # 1. 什么是量化投资


    提起价值投资，我们都太熟悉了，大家都知道其代表人物是巴菲特。


    提起量化投资，不得不提及华尔街传奇人物詹姆斯·西蒙斯 (James Simons)。西蒙斯是世界级的数学家，也是资深的对冲基金经理之一。因其通过将数学理论巧妙融合到投资的实战之中，西蒙斯成了投资界中首届一指的“模型先生”。由其运作的大奖章基金
    (Medallion) 在 1989—2009 年的 20 年间，平均年收益率为 35%。若算上 44% 的收益提成，则该基金实际的年化收益率可高达 60%，比同期标准
    500 指数年均回报率高出 20 多个百分点，即使相较金融大鳄索罗斯和股神巴菲特的操盘表现，也要遥遥领先十几个百分点。


    西蒙斯通过将数学模型和投资策略相结合，逐步走上神坛，开创了由他扛旗的量化时代。西蒙斯做的事情就是量化投资。


    量化投资就是利用计算机技术并且采用一定的数学模型去实践投资理念，实现投资策略的过程。


    价值投资和技术分析是引领过去一个世纪的投资方法，随着计算机技术的发展，已有的投资方法和计算机技术相融合，产生了量化投资。


    # 2. 量化投资 vs 传统投资


    传统的股票投资主要有价值投资和技术分析，价值投资是看基本面的，而技术分析研究的是各种图形。与传统的投资方法不同，数量化投资不是以个人判断来管理资产，而是将投资经理的思想、经验和直觉反映在量化模型中，利用计算机帮助人脑处理大量信息，并进行投资决策。


    对传统主动型投资人而言，决策广度的有限性，体现在跟踪股票数量上的限制，以及决策时思考变量上的限制；量化投资具有更大的投资视角和广度，能够快速高效地在全市场范围内海量信息处理和挖掘。当然，传统的主动投资方法在决策深度上是有优势的，所以，做更加深入的基本面研究，以弥补决策广度的不足是决定成败的关键。但是，随着市场信息传递速度的加快，众多分析师对基本面数据的不断挖掘、更加深入的分析似乎越来越难以弥补决策广度的不足。同时，传统投资的管理者本身情绪难免会受到周边环境的影响，常常会作出一些偏离自己判断的交易行为，而量化投资客观性、纪律性较强，按照严格的策略规则理性投资，能有效克服投资过程中的随意性和情绪化行为。


    量化投资方法可以广泛应用在整个投资流程中，从自上而下的资产配置、行业配置、'
  merge: -1
  img_proc: true
- pgno: 110
  md: '风格配置，到自下而上的数量化选股等。


    量化投资并不是传统投资方式的对立者，本质上只是一种投资手段，随着计算机技术的发展产生的一种投资手段。就像随着计算机技术的发展，大数据的概念也随之产生了。


    量化投资的主要特点是将定性研究的理论通过数量模型型演绎出来，借助计算机强大的处理信息的能力，全范围地筛选符合“标准”的股票，避免任何投资“盲点”的产生，最大限度地捕捉“标准”的投资对象。由于借助量化模型，定量投资能够避免基金经理情绪、偏好等对投资组合的干扰，精确地反映基金管理人的投资思想，最大限度地“理性”投资。


    # 3. 量化投资的价值


    量化投资对于基金公司/资产管理公司而言，有着非常明显的价值。


    首先是容易冲规模。一个有效的量化模型是可以在多个产品上进行快速复制，从而迅速做大规模。这个在巴克莱的指数增强系列产品上得到了最明显的体现。截至2011年底，巴克来量化基金，管理规模超过1.6万亿美元，超过富达基金，成为全球最大的资产管理公司。


    其次是可以获得绝对收益。利用量化对冲方式，构建与市场涨跌无关的产品，赚取市场中性的策略，适合追求稳健收益的大机构客户，如保险资金、银行理财等。这个产品的代表性公司就是目前全球最大的对冲基金
    Bridge Water，旗下的旗舰产品 Pure Alpha 过去5年共赚取超过350亿美元。


    最后是杜绝了内幕消息和老鼠仓。量化投资只利用公开数据，通过数学模型的运算，挖掘出隐藏在公开数据后面的信息，从而战胜市场，从方法论上杜绝了内幕消息的可能。在交易过程中利用复杂的IT系统进行程序化交易，使得老鼠仓也无法成为可能。在国内金融市场监管日趋规范的情况下，量化投资这种方法必然会成为投资研究的主要方法。


    # 4. 量化投资的理论基础


    说到量化投资的理论基础，就要从市场有效性假说说起，技术分析、基本面分析和量化分析代表了有效市场的三个不同的层次。在无效市场中，技术分析是充分的，这在中国资本市场最初的10年得到了很好的体现；当市场进入弱有效市场时，可以依靠基本面分析获得超额收益，2000—2010年这10年基本上属于这个时代；当市场进入半强有效市场后，也就是从2010年开始我们可以观察到大部分基本面分析的产品已经无法获得超额收益，此时国内市场已经进入半强有效市场。当然当市场进入强有效市场后，则无论哪种方法均无法战胜市场，那时候只能被动指数化投资。


    传统的有效市场假说认为，在半强有效市场，只能依靠非公开信息（内幕消息或者私人消息）来获得超额收益。但是我们可以知道的是，除了非公开信息并不是只有内幕消息和私人消息外，还有一个获得非公开信息的方法：就是利用数据挖掘的方法，从公开的数据中挖掘出非公开信息，也就是量化投资的方法。这也就是在美国成熟市场（基本上进入半强式有效市场状态），量化投资为什么可以得道蓬勃发展的原因。


    随着资本市场有效性的提高，中国开始进入半强式有效市场阶段，再加上监管层对内幕消息的监管越来越严厉，使得通过这种方式获得非公开信息的方式越来越难，因此量化投资就成了一个最好的获得非公开信息的科学理论与技术。


    通过上述对有效市场假说的分析，已经得到了明确的答案：量化投资是在半强式有效'
  merge: -1
