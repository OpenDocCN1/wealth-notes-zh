  md: '可问题来了，假如隔壁的二娃问你，科技金融和金融科技有什么区别呢？可能你会觉得，哦，好像没想过，然后你就支支吾吾，如果你还在金融圈混，想想你的形象是不是一下就弱了很多呢？


    举个例子，假设你是一个做大数据的技术“牛人”，有一次高中同学聚会，大家在一起聚餐，然后隔壁的老王夹了口菜说好吃啊，又夹了口菜说这个也很好吃啊；然后你突然放下筷子半开玩笑认真地说，其实我认为这个世界上最营养的菜有两种，这个时候可能你身边的葱花、油菜花还有小明都没回应说来来听听呢，然后你说第一种就是最难闻的，另外一种就是最难吃的。这个时候可能他们就突然会发现，哇，原来你还是很懂养生之道嘛，好像美食专家一样，而事实上，可能你就是一个宅男，无非就是运用了二分法，而这种方法在数学以及很多学科上应用得太多了。


    # # 1.2 金融、科技和互联网


    现在各种术语满天飞，有时候我们可能都不知道到底是什么意思，这就为我们塑造价值提供了机会，我们得有策略地告诉对方，我们对这些知识和前沿方向掌握得更好、更专业。


    互联网金融、科技金融和金融科技其实不就是金融、科技和互联网的名词组合嘛，那么我们还得顾名思义，至少这是思考的很重要的第一步。


    互联网金融和科技金融强调的是金融，互联网和科技只是一个定语。很多学科都需要这么简单的一个道理的建立，比如司法考试（2018 年就是法律职业资格考试）在刑法这方面，各个罪名的解释就是一个很重要的技术。


    比如，有个小白问你，互联网金融是什么呢？我们怎么回答呢，你可以直接说就是互联网时代的金融嘛，当然这样确实也是太闪了，我们适当包装一下就好了，我们可以这样讲：互联网金融，顾名思义就是互联网情景的新兴金融业务模式。甚至，还可以加一句“在美国这样的发达国家没有互联网金融”这种说法的。这样的回答，至少让对方觉得你举重若轻，很专业的样子。


    同时，最勾魂的是，你要互动，要让对方参与，让对方真正觉得你专业的还是你提问的方式。比如，你可以向对方抛出一个话题：你知道互联网金融的核心是什么？


    或者，你也可以这么问：你知道是什么让互联网和金融搞在一起的吗？


    对方可能会问：你说的是 P2P、大数据、互联网、民间理财这些吗？对方可能会把他接收到的信息或者概念很凌乱地抛给你。


    这个时候，你要显得很专业地说：其实就是两个字，支付。


    对方一听，忽然觉得，很有道理啊。


    下面这些就是你发挥的依据了。


    无支付不金融。


