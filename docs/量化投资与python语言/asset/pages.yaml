  md: "Drop_duplicates 方法用于返回一个移除了重复行的 DataFrame。\n\n# 11.2.4 利用函数进行数据转换\n\n在对数据进行处理的时候,我们可能希望方便地处理得到一些真正想要的数据,比如全部转换成为期望为\
    \ 0 的数据等。\n\n第一个例子,如图 11-19 所示。\n\n```\n``` \nIn [96]: data=pd.Series([1,2,3,4,5],index=['high','low','open','close','ma5'])\n\
    \         data.map lambda x:x**2\nOut[96]: high    1\n         low     4\n   \
    \      open    9\n         close   16\n         ma5     25\n         dtype: int64\
    \ \n```\n```\n\n图 11-19\n\n上面的方法就是把原来的 Series 的每个元素都平方并返回。\n\n第二个例子,如图 11-20 所示。\n\
