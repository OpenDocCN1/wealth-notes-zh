    # 2. 科技金融的核心


    科技金融的百度定义是科技金融属于产业金融的范畴，主要是指科技产业与金融产业的融合。科技金融的主题是金融，其实就是科技应用在金融中，金融本质也是一种服务，可以说是当前很重要的功能，最重要的体现就是效率和品质。


    以往，银行是“二八”法则的最忠实拥趸，他们坚信 20% 的客户能创造 80% 的利润，因此经营重心大多放在中高端客户吸储、理财与向企业大客户放贷上，希望借此来降低经营成本，提升经营收益。银行对于中小微企业、个人贷款以及普通客户的业务往往不够重视。因为对于银行来说，这些小客户就是“长尾”，投入过多的人手和精力去处理“长尾”客户的业务，只会增加银行的成本。最近几年，这一部分客户被互联网金融所吸纳，余额宝就是一个很好的例子。这是第一款意识到了“长尾”客户价值的产品，单个用户的购买量虽小，但庞大基数成就了余额宝的奇迹，让与之合作的天弘基金在不到一年的时间里“由鸡变凤凰”。金融业“长尾”市场表现为高度碎片化，用户数量庞大且个体资金量小，但通过技术手段进行整合和汇集，无疑将产生巨大价值。当这部分“长尾”用户的客户端使用黏性增加时，银行自然可以通过网络来进行推广和营销。


    我们可以从以下三方面来看。


    （1）供应链金融和消费金融。比如大家熟悉的马云做的事其实就是解决了金融服务对象的“长尾”现象，就是说在中国，很多科技公司做的事情就是做了一个中间的技术平台，上端去连接这种小
    B 或者是 C 端，它通过一些场景，比如一些核心企业、一些渠道，把这些场景全部连接起来，然后通过自建的技术系统把这些分散的资产集合起来，迅速地转化成标准化的金融机构能够认可的资产，当资产聚集到一定量之后，就可以对接资金及金融机构。


    （2）科技金融对社会的价值，表现在金融消费服务升级上。其实和金融消费里面无非是提高你的需求匹配效率，就是高精度的匹配，可以节省你的时间，比如不需要到银行去排队了。'
