    ![](img/06df04b918a135496579a0c4d2004314_123_0.png)


    图 17-4


    相信读者会发现大部分的量化交易策略都是这样的流程，先建立一个模型，然后不断熟悉，遇到问题不断查询和交流，然后应用其他的策略进行验证和学习。'
