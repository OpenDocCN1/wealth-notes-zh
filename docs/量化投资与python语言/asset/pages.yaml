- pgno: 101
  md: '# 第13章 金融数据分析


    # 13.1 金融时间序列


    在金融数据分析中，时间序列是用得最多的了，毕竟大部分人还是拿交易数据在进行分析。所以时间序列是一种重要的结构化数据格式。而且很多时间序列是固定频率的，比如我们一般都是分析日线数据，或者
    30 分钟数据，等等。时间序列数据的意义取决于具体的应用场景，主要包括以下几个：


    时间戳（timestamp）：特定的时刻。


    固定时期(period)：如 2017 年 3 月或 2016 年。


    时间间隔(interval)：由起始时间戳和结束时间戳表示。时期可以看作是时间间隔的特例。


    # 1. 日期和时间类型以及工具


    这里我们主要介绍 datetime 库，如图 13-1 所示。


    ![](img/06df04b918a135496579a0c4d2004314_101_0.png)


    在这个库中，我们用得最多的是 datetime 这个对象。这里有两个 datetime，前者是一个库，后者是一个对象。如图 13-2 所示。


    ![](img/06df04b918a135496579a0c4d2004314_101_1.png)


    Datetime. timedelta 表示两个 datetime 对象之间的时间差。'
  merge: -1
  img_proc: true
