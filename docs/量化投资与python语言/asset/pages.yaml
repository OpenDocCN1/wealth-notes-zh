    :[\"a\",\"b\",\"c\",\"d\"]})\n          df['open'].map lambda x:x+100000\nOut[97]:\
    \ 0   103200\n          1   103201\n          2   103203\n          3   103204\n\
    \          Name: open, dtype: int64 \n```\n```\n\n图 11-20\n\n这个例子中,我们针对 DataFrame\
    \ 对象中的 open 列每个元素都加 10 000 并返回。\n\n# 11.2.5 替换数据\n\n如果我们把 map 方法看作是针对全部或局部的数据替换,那么我们可以把\
    \ replace 看作是针对特定的数据替换。\n\n前面我们学习的 fillna 方法也可以看作是数据替换的一种特殊情况。\n\n我们看第一个例子,如图\
