  md: '# 量化策略


    # 第16章


    # 16.1 量化策略概述


    1. 什么是策略?


    策略,可以实现目标的方案集合;在证券交易中,策略是指当预先设定的事件或信号发生时,就采取相应的交易动作。


    2. 什么是量化策略?


    量化策略是指使用计算机作为工具,通过一套固定的逻辑来分析、判断和决策。量化策略既可以自动执行,也可以人工执行。


    3. 一个完整的量化策略构建


    一个完整的策略需要包含输入、策略处理逻辑、输出;策略处理逻辑需要考虑选股、择时、仓位管理和止盈止损等因素。


    # 16.2 常见的量化交易策略


    量化策略很多,我们会发现高校学生的优势可能就在于对算法的研究,因为在学校不像在市场上参与实务操作,有市场经验和感觉,但是对于一些理论研究反而没有边界,设计的一些算法可能还是不错的策略。我们这里介绍的策略也是基于一种分类,比如对于一个交易标的,可分为均值回归和动量策略;对于有两只交易标的的,可用配对交易或者统计套利;对于有多个交易标的的,可有多因子选股模型。接下来,我们将分别予以介绍。


    1. 双均线模型


    移动平均(moving average,MA),又称“移动平均线”,简称均线,是技术分析中一种分析时间序列数据的工具。最常见的是利用股价、回报或交易量等变量计算出移动平均。均线是最基础的动量指标,一般短期均线上穿长期均线意味着近期买盘较强势,可以作为买入信号,俗称“金叉”;反之短期均线由上向下突破长期均线意味着近期卖盘较强势,可以作为卖出信号,俗称“死叉”。


    2. 均值回归


    先讲一个故事。从前有座山,山里有座庙,庙里有一个老和尚,这个老和尚是个佛法高深的住持。山下不远处有一家证券公司,跟寺庙遥遥相对。一天,庙里来了许多炒股的人,在菩萨面前烧了许多香,求菩萨保佑他们脱离苦海。


    老和尚心善,问是怎么回事。香客们说:“股票大跌,我们被深度套牢,赔了很多钱,不知怎么才能脱身。”老和尚心想:“我不入地狱,谁入地狱?”于是倾其所有,买进股票。


    过了一段时间,股市大涨,一股难求,香客们又来庙中烧香,为买不到股票发愁。老和'
  merge: -1
  img_proc: true
- pgno: 117
  md: '尚念道：“善哉，善哉，先天下之忧而忧，后天下之乐而乐。”于是把所有股票都卖个精光。


    几个来回，老和尚赚了很多钱，大家纷纷向老和尚讨炒股秘诀。老和尚说：“哪有 什么秘诀，我只是无欲无求，抱着一颗善心而已！”


    老和尚用的就是均值回归策略。


    我们可以把均值回归看作是资本市场的万有引力定律，就像世事万物都有“分久必合，合久必分”的一样。


    # 3. 配对交易


    无论市场是牛市、熊市，配对交易都可以在高频交易中帮投资者获得一笔不菲且稳定的收益。这类配对方法主要是通过做多一只股票，同时做空另一只与其存在某种相关性的股票而获得平稳收益。


    +   量化策略实现步骤如下：


    +   1. 找到相关性高的一对股票


    直观上来看，我们需要寻找的是两只在公司主营业务、规模大小甚至是风险因素等方面要有一定的相似性的股票，可以在同一行业或者相关行业（如房地产和钢铁行业）中 寻找。另外，还可以通过编写程序自动查找近
    N 日内相关系数最大的或存在协整关系的 一对股票（可采用 Pearson 相关系数计算、Johansen''s 协整检验等）。例如：计算一段时 间某行业内所有股票价格的相关性矩阵，选取相关系数最大的两只股票。


    +   2. 计算时间段内股价间稳定关系


    设主流方法是寻找到对数股价间的协整关系，协整关系的检验又包括两个子过程，首 先是确定线性关系；其次是残差 (residual) 序列的平稳性检验。


    +   3. 交易规则的制定


    交易规则的制定主要包括触发机制的确定和止损机制的确定。价差序列是按统计规律依概率收敛而非必然收敛，所以在交易过程中可能会遇到价差序列发散的情况，如配对 组合中股票的基本面突然发生变化等，在带来巨额收益率的同时也会出现巨额亏损，因
    此对于配对交易策略，风险控制显得尤为重要。


    # 4. 多因子选股


    多因子模型是应用最广泛的一种选股模型，基本原理是采用一系列的因子作为选股 标准，满足这些因子的股票则被买入，不满足的则被卖出。


    举一个简单的例子：如果有一批人参加马拉松比赛，想要知道哪些人会跑到平均成 绩之上，那只需在跑前做一个身体测试即可。那些健康指标靠前的运动员，获得超越平均 成绩的可能性较大。多因子模型的原理与此类似，我们只要找到那些对企业的收益率最
    相关的因子即可。


    各种多因子模型核心的区别第一是在因子的选取上，第二是如何用多因子综合得 到一个最终的判断。


    一般而言，多因子选股模型有两种判断方法，一是打分法，二是回归法。


    打分法就是根据各个因子的大小对股票进行打分，然后按照一定的权重加权得到—'
