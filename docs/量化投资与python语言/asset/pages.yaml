    我们列出所有与描述统计相关的方法,如表 10-4 所示。


    # 表 10-4


    | 方法 | 描述 |

    |---|---|

    | count | 非 NaN 值的统计 |

    | describe | 统计汇总 |

    | min,max | 计算最小值,最大值 |

    | argmin,argmax | 计算最小值,最大值的索引所在的位置 |

    | idxmin,idxmax | 计算最小值,最大值的索引 |

    | quantile | 计算样本的分位数 |

    | sum | 样本值的总和 |

    | mean | 样本值的均值 |

    | median | 样本值的算数中位数 |

    | mad | 根据平均值计算平均绝对离差 |

    | var | 样本值的方差 |

    | std | 样本值的标准差 |

    | skew | 样本值的偏度（三阶矩） |

    | kurt | 样本值的峰度（四阶矩） |

    | cumsum | 样本值的累计和 |

    | cummin,cummax | 样本值的累计最小值,最大值 |

    | cumprod | 样本值的累计积 |

    | diff | 计算一阶差分 |

    | pct_change | 计算百分数变化 |


