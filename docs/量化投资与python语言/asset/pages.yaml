    # 2. 检查带有重复索引的时间序列


    有时候, 我们抓取数据或者拿到的数据可能需要去掉重复的, 比如某一天的数据重复了, 我们就需要去掉。举例如图 13-4 所示：


    ```

    In [58]: import pandas as pd

    import numpy as np

    dates=pd.DatetimeIndex([''3/1/2017'', ''3/2/2017'', ''3/2/2017'', ''3/3/2017'',
    ''3/3/2017''])

    data=pd.Series(np.arange(5), index=dates)

    data

