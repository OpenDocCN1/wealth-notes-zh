    # 1.4 金融科技与互联网金融的关系


    现在有两种极端的误区：一是认为“金融科技”基本等同于“互联网金融”，原因前面已经说明，两者侧重点有所不同；二是“互联网金融”与“金融科技”泾渭分明。


    互联网金融与金融科技的区别到底在哪儿？我们应该轻松地讲解两者之间的关系。


    互联网金融是将传统金融机构的产品、购买方式从线下搬到了线上，从本质上来看，在互联网金融条件下，金融机构优化了用户的产品体验、购买渠道、消费方式，对于金融本身来讲并未产生实质性的变化。


    互联网金融对行业的影响有限，金融科技却不同。当下互联网金融之所以会出现诸如此类的问题，其中一个很大原因就是互联网对于传统金融行业的改造并不彻底，甚至可以说并没有对金融行业产生实质性的影响。这就导致了很多传统金融已经出现的，如信息不透明、收益难保障、监管难实现等问题，在互联网金融时代依然会出现。


    写到这里，读者可能知道怎么去给对方去讲解了，我们可以说互联网金融注重的是形式的体验，金融科技强调的是内容的变革。其实，知识本无所谓的多u, 也本无所谓的专家，需要的是我们更好地在沟通中去切分罢了。毕竟，不是我们每个人都要去做学术，都要去做更深入的调研和发表论文。


    当然，我们还可以换一种说法。


    互联网金融是一种商业模式，金融科技是一种金融产品。


    如果将互联网金融看作是一种全新的商业模式的话，那么金融科技则是一种全新的金融产品。


    比如，我们不难发现，很多互联网金融企业都是将传统金融行业的一些业务转移到了线上，传统模式中需要到金融机构柜台办理的相关业务，现在动动手指即可实现。


    金融科技则不一样，它是基于金融本身萌发出来的一种全新的产品。这种产品主要是利用大数据、区块链等互联网创新技术进行风险管理与控制，降低成本，提升效率，并从金融本身作出改变，从而再借助互联网的力量给用户全新的体验。


    读者理解了这样的方法论，应该知道怎么去更快速地学习新的知识以及切分知识了。


    那么还可以说互联网金融是发展阶段，金融科技是最终目的。


    互联网金融只是将传统金融机构获取用户的方式转移到了线上，它主要借助的是当下互联网的流量红利，以破解或遏制当下传统金融机构用户不断减少的问题。金融机构借助互联网获得了线下流失的部分流量，并通过将传统产品转移到线上销售，让更多用户能够通过手机就能够买到自己所需的产品。


    互联网金融除了能够让用户获得轻松便捷的产品体验之外，还能让传统金融机构的门槛最大程度的降低，传统金融机构当中需要严格审核才能参与其中的投资项目，现在只要通过互联网便能够轻松参与。而互联网的用户又趋向于年轻化，这些年轻用户通常是'
