  md: '# 1. Figure 和 Subplot


    Matplotlib 的图像都位于 figure 对象中。我们可以用 plt. figure 创建一个新的Figure。这个就相当于提供了一块画布，我们可以在上面画一张图或几张图。当然我们要这样操作的话，就不能直接画图，必须先指定创建一个或多个图片窗口（subplot）。


    比如：


    ```

    ax1=fig.add_subplot(2,2,1)

    ```


    这个代码的意思是：图像是 2×2 的，就是说有 2 行 2 列，4 个图的，而且当前选中的是第一个。如果我们把后面的三个图都创建出来的话，则


    ```

    ax2=fig.add_subplot(2,2,2)

    ax3=fig.add_subplot(2,2,3)

    ax4=fig.add_subplot(2,2,4)

    ```


    如果这个时候，我们画图的话，默认的情况下是针对最后一个图片窗口画图的。比如：


    如果我们把 4 个图都画上，可直接调用每个图片窗口的 plot 方法，如图 12-2 所示。


    ```

    In [17]: import matplotlib.pyplot as plt

    fig=pl t.figure()

    ax1=fig.add_subplot(2,2,1)

    ax2=fig.add_subplot(2,2,2)

