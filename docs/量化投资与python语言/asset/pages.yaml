    # ### 1.3 金融科技概念


    # 1. 金融科技的核心


    金融科技 (fintech) 已经成为金融行业最时髦的话题。“fintech”到底 是什么，又为何在中国火了？


    同样的，假设二娃问你，金融科技到底是什么，怎么回答好呢？你可以回答，金融科技 就是科技在金融中的应用；或者你回答：用科技的手段改造金融行业。


    其实你会发现，我更强调的是一种回应 的技术，毕竟沟通很重要，包装也很重要，这样 回答如果你觉得还不过瘾，你还可以引用维基百科的定义：它是由一群通过科技，让金融
    服务更高效的企业构成的一个经济产业。fintech 公司通常是那些尝试绕过现存金融体 系，而直接触达用户的初创企业，它们挑战着那些较少依赖于软件的传统机构。


    金融科技的核心是什么呢？或者要解决的问题最明显的特征是什么？


    答案是信息和信用成本。


    金融作为一个现代庞大的支柱产业，其实是指金融服务业，也就是帮助资金融通的服务行业。这个行业从业人员所做的事情和所创造的价值，主要就是让资金从相对闲置、低 效率的人或机构手中，流动到可以更高效率使用，产生更大价值的地方。你每个月领工'
