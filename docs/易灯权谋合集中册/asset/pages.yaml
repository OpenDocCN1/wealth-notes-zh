- pgno: 626
  md: '之，义之悲喜交加，顾不上回答，只是一个劲儿地喊：“又活了！又活了！”武帝派中书郎周虁舍到淮河边劳军。韦睿把缴获的物资堆积在军门，周虁舍观看后，对韦睿说：“将军缴获的真的和熊耳山一样高了呵！”韦睿因功晋爵为侯。


    解析：


    团结就是力量。二个班子，尤其是领导班子，必须团结和睦，才能齐心协力，共同带好队伍，如果勾心斗角，打肚皮官司，就会整天限于内耗之中，耗掉感情，耗掉时间，耗掉精力，耗掉智慧，所以，时下在考核领导班子时，要看这个班子的和睦与团结如何，这样做是有


    627'
