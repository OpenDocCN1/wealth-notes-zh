    这几件事情，都不是不学无术三辈能够做得出的，由此，可见，和珅的成功也是靠了才学的帮助。当时名满天下的表章就曾称赞和珅兄弟说” 少小闻待礼，通候及冠军，弓矢朱雁落，健笔李摩云。
