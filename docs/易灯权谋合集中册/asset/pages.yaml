    # ### 虚静无为的帝王权术


    在古代帝王的统治术中，有一种名为“无为而治”的权术，主要表现为深藏不露、诡诈多变。这就是道家和法家所极力称道的帝王南面君人之术。


    “无为而治”是道家的政治哲学，主要是说统治者应尽量克制欲望，不要劳民扰民，对政事少干预，顺其自然，垂拱而治，这样做就会收到“无为而无不为”的效果，使社会得到大治。后来，他们进一步把这一原则用在君臣关系方面，于是便发展成一套颇具特色的帝王权术学。我国著名史学家钱穆先生指出：““无为'
