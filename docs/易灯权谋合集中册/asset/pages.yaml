- pgno: 1310
  md: '的人才。尤其要知道手上每个员工的优缺点，知道摆在哪里，才知善用，可以让每个员工都是菁兵。更知道手上这些菁兵，该如何彼此搭配，可以让整个公司或部门的战斗力达到良性竞争，效力施展到最高点。


    要当一个领导者，不是一定口气强悍，理直气壮。愈高位的领导者其实是谦逊和悦的，能让带领的员工受他激励，带人心坎里，员工会效忠，忍人之所不能忍，且愿意为他赴汤蹈火。真正强不在坚硬，而在温柔。情绪的内敛代表一个人的修为，如果只是拘泥一些无关痛痒的枝叶，而忽略了原本的
    中心思维，就很容易因外界的一些耳语而做了不正确的判断，丧失良才。


    光有高学历高文凭，不会让人成为有涵养的主管或一个好的领导者。知识与经验在累积转化后，会成为真正的智慧。在 职场 / 商场都必须在实战经验中，用心去感受，才会真正转化
    成个人的智慧资产。具有领导魅力与真知卓见老板，也不是天生出来的，是在压缩的商场 / 职场文化中硬磨练出来的。别忽略了人都有潜力，遇到艰难的困境后，突破后才能
    爆发出来的。'
