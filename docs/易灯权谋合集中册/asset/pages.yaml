    # 解析:


    功高君主，势必邀来杀身之祸。


    由于国家是皇帝家的，“普天之下，莫非王土；率土之滨，莫非王臣”，所以，文武百官只不过全是皇帝家的管家和护院的兵丁。如果你的功劳太大，以至于皇帝无法酬谢你的时候，那可就多一份危险了。因为皇帝总不能把自己的家让给你，所以，皇帝就必然会找个借口除掉你，'
