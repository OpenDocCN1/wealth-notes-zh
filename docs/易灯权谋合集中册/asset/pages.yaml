- pgno: 527
  md: '# 怎样才能对自己有一个正确地定位


    # 为什么要对自己定位


    1. 不定位就没有方向感、目标感


    2. 可能某些地方在别人眼里你是成功的，但是你自己也觉得 不是你所追求的。


    # 如何对自己进行定位


    1. 大至定位你想成为什么样的人：


    建立自己的信念或者价值观，就是你认为什么样的事情值得 你去追求的，你想成为什么样的人。所有的行为的驱动力都 是来源于你的价值观；有了价值观，你所做的事情你都会有一
    种感觉值。


    2. 制定你人生的目标计划，不让你偏离方向你的计划一定要 分一生的计划 一年的计划 一个月的计划 一周计划；周计 划着眼于现在（千里之行始于足下），年计划、月计划是过'
  merge: -1
  img_proc: true
- pgno: 528
  md: '程（保障执行力），一生的计划定好目标（掌控目标不偏离）。


    # 定位最适合自己的工作


    好的平台是好的成功的方法。


    兴趣 成长 学习 待遇 空间是选择平台的标准。


    # 开始对自己的分析


    写出你的优点、你的缺点；然后是如何继续发扬你的优点，


    如何克服你的缺点。


    在成功的道路上你必须具备的和必须修炼的。


    # 学习成功者的长处，不断修正自己的缺点


    按照上面的去做，你不仅感觉不到茫然，而且你过得充实，


    在成功的道路上少走弯路，祝你成功！！！'
  merge: -1
