  md: '# 情场定位


    1．清楚自己的定位


    懂得换位思考，懂得他的心理需求，合理运用吸引法则，遵循情感发展的规律，高姿态的去挽回。


    而不是“把自己的姿态放得很低，只要他愿意回来，你什么都愿意做”。


    在感情中，每个人都是独立的个体，更何况你们现在是分手，所以，你更没有权利去要求对方对你做任何事。


    如果你分手后，还是用以前的态度去对待他，那么，这只会加快他离开的步伐。


    很多人选择分手，是希望能换一种新的生活方式，如果你还是沉迷于以前的生活方式，不清楚自身的定位，那么，这只 会让对方觉得当初选择分手是正确的。


