- pgno: 106
  md: '# 读马基雅维利《君主论》有感——政治权术和政治道德之争


    马基雅维利以《君主论》开启了政治理论的新篇章，政治摆脱了道德，而权术堂而皇之地以赤裸裸的姿态助政治作为披荆斩棘。马氏决然背弃古典哲学认为政治必须服从于道德德性这一基本命题，而主张让德性服从于政治。


    这一命题的转向硬生生摧毁了一切关于政治的幻像，撕碎了弥漫在政治界上空的温情纱雾，取而代之以强取豪夺、生死相残的残忍和血腥。


    人性的脆弱被毫无保留地呈现，人类在权力和利益面前像个奴仆一样卑微地匍匐，再无高贵可言。也难怪施特劳斯称马氏为“罪恶的导师”，莎士比亚也冠之“凶残的马基雅维里”。


    权术和道德从来是政治实践和政治理想之间'
  merge: -1
  img_proc: true
- pgno: 107
  md: '难以调和的矛盾，曾有多少人前君子做着背后的龊龊，又有多少道德圣人被埋葬于权力的恶斗之中？马氏是个能透析历史的人，亦能穿越表面的重重浓雾到达最本质的人性希求，试问能有多少人安于守己，视金钱如粪土，又能有多少人
    不畏权贵，做得到人前身后坦荡荡？——普通人都难，何况在权力巅峰呼风唤雨的为人君者。


    权术并非全然污秽之事（人们却乐于将之等同于阴谋诡计），其生长、肥沃正是基于对政治权力的谋求，众所周知，权力是政治的核心，而权术只是手段。


    一、术，致帝王之功？


    无论古今中外，权术作为一种谋取政治权力的工具在实际的政治斗争的舞台上一度纵横驰骋、叱咤风云，从英雄到草莽争相为之折腰。'
  merge: -1
  img_proc: true
- pgno: 108
  md: '观乎中国古代的政治界，竟洋洋洒洒不下数十种权术：笼络之术、馋毁之术、诬陷之术、谄媚之术、阿附之术、结党之术、韬晦之术……不容置否，权术在实际的政治争斗中极为有效，它身披形形色色的外衣，在尖锐复杂的权力争夺中游刃有余，甚至比血缘的世袭、法律的制衡更容易奏效。也难怪冯用之在《权论》一书中感慨：“大哉！鼓天下之动，成天下之务，反于常而致治，违于道而合利，非权其孰能兴于此乎？”


    纵观古今，难承弄权御术的人君臣子有多少能久坐权力的巅峰，而往往开国建业的君主都熟谙权术，秦皇汉武、唐宗宋祖无不如此。马基雅维利亦赞赏罗马皇帝塞维罗的刚柔并济赏罚并行，而不屑于亚历山大的软弱无力。


    权术之于政治的意义无外乎两个方面，一为“夺权”，二为“守权”，正所谓创业容易守'
  merge: -1
  img_proc: true
- pgno: 109
  md: '业难，朝代的更替、王权的更换无疑向世人传达着“守成之难”难于“草创之难”的感慨。


    这便为君主用术提出了更高的要求。基于改朝换代之用的权术可以堂而皇之，动乱横行亦无妨，而守业之际的权术则必要湿行于面而厉行于内。


    “术不欲见”就成为政治艺术，为保天下太平就务必不能大动干戈，而权术正恰逢其用。“术者，藏之于胸中，以偶众端而潜御群臣者也。”（《韩非子·难三》）坐拥天下是为人君之福，却时常危机四伏，防臣民、防妃嫔，怕四境之敌、四海之诸侯，故而，若只会鲁莽行军作战之德行，或舞文泼墨之闲逸，则福之极而祸乱始。


    正所谓“自五帝既降，舍权机而治天下者未之有也。”（冯用之《权论》）'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 二、君者，言利不言义？


    马基雅维利主张“人恶论”，生而自私，趋利避害，谋权谋利，追求权力、名誉、财富是人的本性，因而其政治拜托了道德束缚，建立在权力之上。


    《君主论》认为一个君王要官运亨通，就应该丝毫不考虑道德问题，而要依靠势力和奸计。


    > “一般说来，人都善于忘恩负义，反复无常，装模作样，虚情假意，避险唯恐不及，逐利却不甘人后，你对他们恩惠有加的时候，他们似乎对你全心全意，并且在远不需要的时候表示愿为你献出自己的鲜血、财产、生命和儿女，一旦有这种需要了，他们却掉头而去。”


    诚然，依马氏而言，君者则言利不言义？


    无论是马氏之前的欧洲，还是古时的中国，道德向来是作为一个人安身立命的出发点，是一切行为的规范和准则。人们乐于相信人生之'
  merge: -1
  img_proc: true
- pgno: 111
  md: 初，心善如莲，人与人之间的交相往来未曾以利益为首位。“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”（《论语·颜渊》）讲求的是秩序和守恒，《荀子》提到君王之道——“用国者义立而王，信立而霸，权谋立而亡”。而马氏一语破天机，将金玉其外的表象下的败絮全部放大在世人面前，因而，人类开始慌张、惊恐，斥之以另类。无独有偶，马氏千年之前，韩非子已将人性之丑恶铺天盖地地渲染开来，“好利恶害，夫人之所有也”（《韩非子·难二》）人与人之间根本就没有什么亲情、友情可言，完全只是赤裸裸的利害关系。政治层面，即君王必须有“术”，才能致帝王之功，舍权术而任心治，则纵有尧舜之仁亦不能正一国。那么，基于趋利谋益之上的权术之用则必然与传统“向善”之道德产生摩擦、冲突。因为，无论人性善恶，人类总是试图要在外人面前做
  merge: -1
