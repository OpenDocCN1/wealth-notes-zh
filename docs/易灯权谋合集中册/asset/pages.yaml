- pgno: 876
  md: '曾做过蜀国官吏，这可是一段光彩的历史。三：李密此信要谢绝皇上的任命，这可是“不识抬举”的举措。难怪，这三个因素就像三座大山沉重地压在李密身上，简直喘不过气来。


    可总得喘气呀，总不能被这三点憋死啊。于是，李密拿出他从前在蜀国做官时，在官场上学到的那份老练，那份圆滑，竭尽全力拿起了笔，直指晋武帝的痒处，而且好好地搔弄了一番。他浓墨重彩地渲染了武帝“以孝治天下”的英明决策，把武帝老爷上台后的丰功伟绩搞了个大特写。武帝本来就是个喜欢奉承'
  merge: -1
