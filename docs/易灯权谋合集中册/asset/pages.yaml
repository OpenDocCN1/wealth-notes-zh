- pgno: 637
  md: '自刎在乌江！他死时三十一岁，若是东山再起，且能从失败中吸取教训，虽不至于一统天下，但从刘邦手里争它个半壁江山，也不能说没有这种可能。


    如曹操其人，也是一个脸皮揭不尽之物。在赤壁大战中，他把几十万人马损失殆尽。然而，他非但不学楚霸王自戕，反窘迫之中仰天大笑。尤其在华容道，他全不顾一位丞相之尊严，竟关羽面前苦苦哀求。然一到南郡城，他立刻就尾巴翘起，不但酒能喝得下，觉能睡得着，还说甚“胜败乃兵家常事。”他也不说“无颜见江东父老”，比起项羽，真不知道要'
  merge: -1
  img_proc: true
- pgno: 638
  md: '高出多少档次！


    又《三国演义》中有叫王朗者，虽有一肚子学问，但不该只有一张脸皮。本以为两军阵前卖一回能，不料反被诸葛亮奚落一番，于是王朗脸皮撕破，他又羞又气，便刹时地跌下马来一命呜呼。至于周瑜，虽也有几张脸皮，但诸葛亮面前显然不够用。于是在孙、刘两家争斗中，他不仅不是诸葛亮的对手，且几张脸皮，竟被诸葛亮三下五除二的撕得净光。他一口气之下丢了性命，死时年仅三十七岁。'
  merge: -1
  img_proc: true
- pgno: 639
  md: '然诸葛亮其人，乃是一个脸皮揭不尽之人物。他虽然气死周瑜，却又能换一张脸皮去东吴吊孝。只因脸皮换那恰到好处，于是灵堂内哭那真的一般。不仅感动了东吴将士，连小乔夫人也埋怨自家的丈夫人胸太窄。至于诸葛亮，只是用一场假惺惺的哭，不仅完成了孙、刘联盟，且自家的屎屁股也擦得一干二净。


    还有刘备，也是脸皮多不胜数之人，他不仅能“三顾茅庐，”还能多次寄人篱下。虽也野心勃勃，但从不敢喜形于色。在同曹操“煮酒论英雄”时，他把想当皇帝的那张脸皮揭而藏之，惟恐曹操看出破'
  merge: -1
