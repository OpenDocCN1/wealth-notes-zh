  md: '计谋有多么高深，但是却非常狠辣，假扮秦明劫掠青州，给秦明来了个绝户计，而在秦明全家被斩，不情不愿落草之后，宋江又马上递上一个甜枣，帮他说了一门亲事，深谙胡萝卜与大棒的平衡运用，秦明还不死心塌地为他卖命了？（为了断绝秦明后路，害了多少无辜的人，这样一个心狠手辣的家伙，也敢称仁义？）到最后，宋江喝了御赐毒酒之后还不忘毒死对他忠心耿耿的李逵，只为怕李逵坏了自己死后的名声，为其狠辣之心划上了一个圆满的句号。


