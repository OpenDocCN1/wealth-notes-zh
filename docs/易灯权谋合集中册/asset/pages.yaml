- pgno: 1037
  md: '韩非子的察言观色之道，对君王的确有着借鉴作用。


    # 沦为办公室炮灰怎么自救


    炮灰即，比喻为被强迫参加非正义战争去送命的士兵。在职场意为在现实激烈竞争中被淘汰的个体或者组织，或者在利益分配过程中被无视的个体或者组织的无畏牺牲者。炮灰有许多同义词：“做分母的”、“穿小鞋的”、“替罪羊”、“冤大头”、“垫背的”、“出局的”，而且越往后其程度越重。


    从这个定义可以知道，炮灰之广无处不在。一些大学毕业生刚进企业，不把“老江湖”当盘菜，结果频频被穿小鞋；与作为裁判的顶头上司混得太水乳交融，最后不知觉做了替罪羊；在职场爱抢上司风头终变冤大头；当局者最后一搏时殃及池鱼而制造'
  merge: -1
  img_proc: true
- pgno: 1038
  md: '一批垫背的；前任领导的宠臣，到了下任领导，被冰封出局……


    有人的地方就有江湖，有江湖的地方就有博弈，在博弈的过程中，有人是主角，有人就永远跑龙套；还有的在博弈过程中败阵而出局。总之，有博弈的地方就会有炮弹与炮灰。


    一起看看炮灰的诞生与自救之策。


    # I 型炮灰：主动把自己炼成牺牲者


    说起来很难相信，有些人一进职场就寻死觅活地想要做炮灰，仿佛这就是指派的任务。这些人时时刻刻都以“炮灰”自居，他们总是给人一副“谁都在欺负我”的样子。我就有这样一个朋友，他在一所学校工作，每次见到我都会诉说自己的不公平遭遇：“领导就是故意把课给我安排在了那一天，就嫌我那天有兼职”、“我打听了，给我发的奖金是最低的”、“我
    just 是不让他们过，我就把这些课


    1039'
  merge: -1
  img_proc: true
- pgno: 1039
  md: '占着”、“我受够了，感觉他们都在欺负老实人”、“你看如果我辞职会怎么样”……


    面对朋友的炮灰自居，我都无言以对，只感觉“他怎么这么不幸！”其实，真如人们所言“可怜之人必有可恨之处”，之后就是“可恨之人定会有可恨之果”。想想看，如果这样一个总是抱怨连天的人在你的周围，你会怎么对待他。周围的人慢慢就习惯于把他当炮灰了——“反正把他当炮灰还是不当炮灰成本都是一样的”。于是，炮灰型人才活生生地给自己制造了一圈把它定位成专职炮灰的人。


    在职场，相信这种炮灰型人才并不在少数。他们以“绝不做炮灰”为信条，义无反顾地走向炮灰之路。反思一下自己，想想看自己有没有对同事有感激之情；自己从同事那里都收获了什么样的支持与帮助；你如果离开目前的岗位，同事与领导会如何看。通过这些反思，你可能就会知道，其实别人的存在不是用来坑害你的，更多时候是在帮助你成长'
  merge: -1
  img_proc: true
- pgno: 1040
  md: '的。当有了这样的积极心态，以一种积极的眼光看待世界时，积极的东西也会多起来。


    心理学上有一个定律叫“自我实现的预言”。假如你相信我是一个著名的职业心理学家，而且相信掌握一种预测人未来成就状态的理论与方法。那么，我如果告诉你“你将来没什么大出息”，你听后可能会很沮丧——然后就缺乏了进取的勇气与激情——然后就失去许多成长的机会——于是就真的碌碌无为——于是，你就真的相信我是活神仙了。当然，反过来积极的预言也会得到应验。所以，当你在职场以一种更积极的预期去过职场生涯时，你会获得更多积极的价值实现。


    # Ⅱ型炮灰：原来我是想当炮弹的


    职场炮灰的第二种类型是以炮弹为使命，却最终成为炮灰。这脱胎于一个职场规则：职场混迹的过程中一定要发现谁是炮灰，否则你就是。真的就像这个世界有时候的样子：我每次去广州、深圳出差，总有“智者”谆谆告诫：“在广州、深圳需要有看


    1041'
