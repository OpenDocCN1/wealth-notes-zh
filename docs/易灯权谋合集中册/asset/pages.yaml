- pgno: 689
  md: '# 解析：


    何远的清廉,被史家们称为天下第一，而我们认为，他的伟岸气质也堪称举世无双。


    俗话说，当官就要提拔，只有上司提你，你才上得去,这话一点不假，尤其是在中国古代，可谓一语中的。


    怎样让人提你？你得首先挣表现,这表现分为四个乐章：吹。拉、拍、捧，少了一个也不行。


    首先是吹功。这点“大吹”就是“吹捧”的'
  merge: -1
  img_proc: true
- pgno: 690
  md: '“吹”， 也就是“吹嘘”、“吹牛”的“吹”。

    为了博得上司的欢心,你得凭着三寸不烂之舌,把小的说成大的，把丑的说成美的，把黑的说成白的，甚至指鹿为马，打胡乱说,这种“吹攻”绝对见效。


    不信，请看三国时代的华歆和刘琨,他们写了两篇奇文：《请受禅上言》、《劝进表》,对晋武帝篡位竭尽吹捧之能事,结果终于升了大官,发了大财。


    可何远却不如此，他对人从不“吹”，既不“吹”他人，也不“吹”自己，甚至对别人说“谁抓得住我一句不实的话(包括'
  merge: -1
  img_proc: true
- pgno: 691
  md: '吹捧话），我就奖励一匹细绢”。


    结果，许多人打起灯笼寻找，也没有找到可以得细绢的话，可见，何远是多么不善“吹”。


    其次是“拉”。为官老还需拉拢同僚、同行，才能造成一个晋升的氛围，出了事情，也好官官相护。


    可何远却不如此，他杜绝请客，也不拜访别人，与人交往。从低声下气，所以多受时人的忌恨，看来他对“拉”功一窃不通。


    再次是拍。这个拍，就是“拍马屁”的'
  merge: -1
  img_proc: true
- pgno: 692
  md: '“拍”，可何远却要反其道而行之，顶头上司——太守王彬来巡察工作，其他县令都以盛宴款待王彬，何远却只用干粮和清水招待，幸好，这位上司还不是很在乎这些，否则，何远不愁一辈子没有小鞋穿，看来何远还不知道“拍”功有多重要。


    最后是捧功。“捧”就是“吹捧”的“捧”，不过。“吹”功重要在“嘴上功夫”，所以从“口”；


    “捧”功重在上功夫，所以从“手”。这“捧”功包括：写吹捧信啦，做马屁文啦，不一而足。


    693'
  merge: -1
  img_proc: true
- pgno: 693
  md: '可何远在这上点上照样像个小孩子，他在与人通信时，无论贵贱，所用的称谓礼节都一样，而我们读遍有关他的所有传记，也没有发现他有

    任何吹捧大作问世。看来，他还不知“捧”

    功为何物。


    然而，正是这样一位有点“傻”气的人物，却受到了民众的衷心拥戴，甚至在他还未去世时就立祠朝拜，这在古代是非常少见的。


    明代的奸臣魏忠贤私自主祠，遭到万人唾弃，而何远被百姓敬重推崇，最终千古'
  merge: -1
  img_proc: true
- pgno: 694
  md: '流芳。


    颇为有趣的是，凡不善于“吹拉拍捧”者，往往是清官，而精于此道者，常常是贪官或者污吏，这就给我们令人一个深沉的启示：在人才物色和任用时，对于那些言辞甜蜜、善于对首长和同事公关外交的人，应该持什么样的态度。


