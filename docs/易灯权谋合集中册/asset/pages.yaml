    其二、领导者设计将下属诱入“陷阱”，然后逼其“就范”。


    采用此类手段，一般难度较高，往往需要领导者费尽心机。在施行过程中“引诱者”的手段有高有低。手段“高明”者，不露声色，不留痕迹，令人难以察觉；手段“拙劣”者，明火执杖，公开“要价”，显得俗不可耐。“猎物”的素质，也有优有劣。素质优良者，一般难以“上钩”，往往需要“引诱者”有一定耐心，巧设妙计，放长线，钓大鱼；素质低劣者，则轻而'
  merge: -1
