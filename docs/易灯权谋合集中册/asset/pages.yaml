  md: '如果你自己都不相信自己，就没有别人会相信你。保持一个“能行”的态度，敢于冒险。不要说，“我从没做过那个，”要说，“我会学着做。”不要害怕失败或犯错。如果你真的把事情弄糟了，承认之，然后继续。总之，在每个工作中找到学习机会。记住，随着时间推移，规避风险比犯错对你的职业生涯更具危害性。


