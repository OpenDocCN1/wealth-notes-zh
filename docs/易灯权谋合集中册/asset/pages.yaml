- pgno: 300
  md: '是为什么呢？相知还是不相知，不在于相处时间长短啊。所以，从前樊於期从秦国逃往燕国，把首级借给荆轲用来奉行燕丹的使命；王奢离开齐国前往魏国，在城上自刎用来退去齐军保全魏国。王奢、樊於期不是因为与齐、秦是新交，与燕、魏是老相识，他们离开齐国和秦国，为燕、魏二君去死，是因为行为和志向相合、对正义无限仰慕啊。


    这里又举樊於期与王奢的例子，说明相处不在长短，而在志向与正义感。用此暗喻本人与梁孝王相处，完全可以获得信任。意在与梁王拉近距離。


