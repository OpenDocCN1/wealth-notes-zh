- pgno: 230
  md: '于使臣下无从观测，无从知晓。君主虚静无为，暗中观察臣下的过失，见若不见，闻若不闻，知若不知；知其言则验其言行是否一致，每一官职设一人，无令其相互通气，则万物之情尽显。君主要掩盖行迹，隐匿念头，使臣下无从推测；去掉智巧，不显才能，臣下就无从揣度。不泄露意图而考核臣下是否与我一致，谨慎而牢固地执掌权柄。杜绝臣下的欲望，破除臣下的意欲，无使其贪求我之权柄……为君之道，以静退为贵，不亲操事务而知臣下办事之巧拙，不亲自谋虑而知臣下之谋虑是祸是福。（《韩非子·主道》。）


    韩非的这一段议论把这种“无为而治”的要旨讲得非常明白。在法家眼里，无为之术是君主驾驭臣下的一种特殊手段。这一权术的特点就在于：君主在驾驭臣下时，要处在虚、静的地位，以虚制实，以静制动，大智若愚，以“无'
