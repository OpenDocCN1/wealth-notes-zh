- pgno: 685
  md: 姓都为他设立生祠祭祀，又上表呈奏他的政绩，高祖常常下诏书褒美奖他。天监十六年，高祖下诏说：“何远先在武康任职，已经显扬廉明公正的名声，接着治理两个郡，更加体现了他的清正高洁。施政先修整道路，留下惠政百姓敬爱，即使是古代的贤良太守，也没有超过何远。应当迁升何远任朝中荣耀的职务，以表彰他在郡县任职的业绩。应当授任何远为给事黄门侍郎。”何远随即回郡，接着任仁威长史。不久，何远出京任信武将军，监吴郡。在吴郡常因喝酒而有过失，迁任东阳太守。何远任职期间，痛恨豪强富家，对待他们如同对待
  merge: -1
