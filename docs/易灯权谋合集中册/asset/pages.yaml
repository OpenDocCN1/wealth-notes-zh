- pgno: 627
  md: '其充分理由的，也是有源远流长的历史可寻的。


    本篇中韦睿和曹景宗在权势、地位、能力和战功上都不相上下，但并没有互相嫉妒，更没有互相陷害，而是精诚合作，在大军压境的危难时刻，他俩配合得天衣无缝，终于以微弱的兵力，战胜了百万敌军，成为军事史上的千秋佳话。其实，《易经》里早就说过：“一人同心，其利断金，同心之言，其臭如兰。”可见，团结就是力量，就是胜利的根本保证，周武王在跟商纣王作战时，商纣王自信的说；我的兵多！武王却胸有成竹地说：'
  merge: -1
  img_proc: true
- pgno: 628
  md: '你的兵多，但不齐心，我的兵少，但很团结，所以我一定会打败你。后来，事态的发展应征了武王的话。


    韦睿也是如此。当魏军将领杨大眼带领军队五万人突然降临时，大家都被吓怕了，但韦睿却说：“克敌致胜的原因在于人人团结相处，而不在于人多，”后来，韦睿终于带领军队，齐心协力击溃了敌军。


    在这些脍炙人口的千古佳话中，最著名的还数廉颇与蔺相如的“将相和”的故事。'
  merge: -1
  img_proc: true
- pgno: 629
  md: '廉颇是赵国赫赫有名的战将，而蔺相如本是宦官涿贤的门客，后因在秦赵两次重大的外交斗争中甘冒生命危险保全了赵国的尊严，因而被拜为上卿，地位比廉颇还高，这惹得廉颇很不高兴，扬言要污辱蔺相如，但蔺相如却不愿跟廉颇正面相见，甚至躲着廉颇，手下人对此百思不得其解，就询问蔺相如，蔺相如却不慌


    不忙地反问道：“各位看廉将军与秦王比起来，哪个更可怕？”众人都异口同声地答道：“廉将军当然没有秦王可怕！”蔺相如便说：“这就对了，试想秦王那么可怕，各国诸侯都畏之如虎，我都敢在朝'
  merge: -1
  img_proc: true
- pgno: 630
  md: '廷上当众责骂他，我蔺相如虽然没有什

    么大本领，但还不至于如此惧怕廉将

    军。只是我考虑到，强横的秦国之所以

    不敢来侵犯


    我们赵国，其原因就在于我们两人能够

    同心协力地对付秦国，如果我们两人争

    斗起来，那就必定给秦国造成可乘之

    视，我所以这样对待廉将军,是以国家的

    安危为重,不计较个人的私怨啊,”


    蔺相如是“团结就是力量”这一真谛的杰

    出人士，难怪他在任期间,赵国一直比较

    强大，秦国在这十年里,也没敢对赵国轻

    举妄动。


    中国有句成语“挑拨离间”,还有一句俗'
