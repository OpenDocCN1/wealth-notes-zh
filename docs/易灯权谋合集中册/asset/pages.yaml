- pgno: 1377
  md: '么，不该说什么。


    别奢望你私下说的话老板就听不到。老板能知道一切，这是真理。在职场上完全相同，只要你不是一人自言自语，就得担心谈话对象会把话传出去。而经验告诉我们，每一句对公司的议论，最后都会传到老板耳朵里。所以你跟任何人说话时，都要好好想想，该说什么，不该说什么。不该说的绝对不能说，可说可不说也闭嘴。


    7、偶尔对老板交心是必要的，但要有的放矢。


    记住，促膝长谈是种手段，而不是真的让你什么都说。偶尔的交心，说些无关紧要的私自话，能让老板觉着你贴心。而事实上，从没一个上司会对你真的交心。切忌一热泪盈眶，就把心窝子都交出去。被出卖的，永远是交心那个。


    8、不管什么时候，装傻总是最不易犯错。


    金庸也曾经说过，他年迈耳背，该听见的话就能听见，不该听见的话就听不见。当有人要你当面表态站队，要你选择事情的方向，不管你怎么选都是错的。那么装傻就是最好的选择，这是没选择时最不易犯错的方法。别担心装傻样子很拙劣，即使每个人都看出你在装傻，可他们依旧拿你没办法。真正倒霉的是那些明确表态的人，有这些龙套牺牲，怎么也轮不到你。


    9、把自己当成最聪明的人，往往是最笨的。


    在职场上，总把自己当最聪明的人，一定是做龙套的命。真'
