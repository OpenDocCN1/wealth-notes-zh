- pgno: 643
  md: '之赐，窃感豫让国土之分矣。常欲结缨 伏剑，少谢万一，割心摩踵，以报所 天。不图小人固陋，坐贻谤缺，迹坠昭 宪，身限幽圄。履影吊心，酸鼻痛骨。 下官闻亏名为辱，亏形次之，是以每一
    念来，忽若有遗。加以涉旬月，迫季 秋，天光沉阴，左右无色。身非木石， 与狱吏为伍。此少卿所以仰天抳心，泣 尽而继之以血者也。下官虽乏乡曲之 誉，然尝闻君子之行矣。其上则隐于帘
    肆之间，卧于岩石之下；次则结缓金 马之庭，高议云台之上；次则虏南越之 君，系单于之颈；俱启丹册，并图青 史。宁当争分寸之末，竞刀锥之利哉！


    644'
