  md: '# 长期向上级输送财富


    李侍尧为官二十多年，是以进贡见长而备受众人瞩目的。乾隆帝也不得不承认，李侍尧和山东巡抚国泰贡品在同僚中最优。进贡，是中国古代社会的一个传统。贡品成为天子与诸侯间政治经济联系的纽带，也是臣工取悦于皇帝的主要手段之一。进贡主要有三种形式，一是朝贡，二是地方向朝廷进献的常贡，三是个人向皇帝的进贡。当然，并不是每个人都有资格向皇帝进贡的，具有进贡资格是社会地位和权力的象征。乾隆时期，有资格向皇帝进贡的人主要有六类，其中地方大吏包括总督、巡抚、将军、提督等。


    作为具有进贡资格的地方大吏，李侍尧从乾隆十八年任热河副都统起至乾隆四十五年，进贡次数有档可查的达一百二十多次，有学者统计，李侍尧一年之中进贡次数最多达九次。按例，督抚进贡只有年节三贡，但李侍尧进贡的次数和名目'
  merge: -1
  img_proc: true
- pgno: 475
  md: '远远超出，其名目有迎銮贡、木兰贡、谢恩贡、传办公贡、贺捷贡等。据考证，在今天故宫博物馆钦安殿御座前，立有一对錾胎珐琅太平有象香薰驮于象背之上，其通高
    174 厘米，长 102 厘米，镌工极精，珐琅鲜艳如初，是广州錾胎珐琅的代表作之一。这对香薰就是李侍尧在乾隆四十一年（1776 年）的进贡物品之一，至今还立于殿上熠熠生辉。


    进献贡品需要大投入，李侍尧在置办贡品时不但费心，更要花银的。譬如，李侍尧进贡龙袍要在苏州订做，龙袍、龙褂共九套，计银四百五十两。李侍尧仅在苏州置办古玩、玉器、龙袍等物，就用银二万三千多两。再如，李侍尧任两广总督时，在广东以紫檀木、花梨木、红木为基本材料加工制作宫廷家具进贡，这批家具从订制到完工花了二年多时间，工银花费自然不菲。如此频繁进贡，投入巨大，银从何来？


    按例，办贡费用应自官员养廉俸银中支付，除织造、盐官、'
