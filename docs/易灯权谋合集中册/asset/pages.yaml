  md: '四周寻事生非，无理挑衅，弄得陈宝琛形影孤单、凄凄惶惶、日不能食，睡不安寝，处境尴尬、心绪烦乱，如坐针毡，如处火炉，狼狈至极。


    而此时，正是中法战争一触即发的时候，朝廷需要能打硬仗的曾老九，为安抚曾国荃，将陈宝琛连贬 5 级。陈宝琛身心交瘁，索性以母老为由，申请回籍侍亲，朝廷准奏。


    在陈宝琛登舟回籍的那天，江宁无人相送，只有一群兵痞在码头上焚纸燃炮，意为送瘟神。而此时京里，恭亲王、醇亲王、李鸿章均自私心庆贺，感谢曾国荃不但拔了钉子而且给大家出了气。当然慈禧是了解此次委屈了陈宝琛，所以才会有
