  img_proc: true
- pgno: 593
  md: '“掉”一个，就会引起全局的变动，这种愚蠢的举动那拉氏是绝不会做的。但还必须对汉族官僚集团的势力给与遏制，不然照这么发展下去，自己孤儿寡母的老巢非得被他们掀个底朝上不可，怎么办才好？重新扶植满族官僚集团？还是算了吧！有出息的如肃顺、奕䜣等恨不得早点把自己弄下去，再看看自己周围那几捆没出息的葱，怎么看都想把他们先做掉，这些满人给他们百万兵马也奈曾国藩、左宗棠不得。唯一的办法就是对曾国藩加倍鼓励、加倍体恤的同时，扶植别的汉人势力。


    于是那拉氏对曾国藩加大赏赐的同时，不久又把曾国藩调离其个人势力的中心南京，让其担任直隶总督，虽是平调，但世人都可看出其用心。此外，对左宗棠、李鸿章、沈葆桢等人均给与和曾国藩相差无几的待遇，这几人虽属曾氏集团，但个人均自己的想法，一旦曾国藩起义，他们随时可'
  merge: -1
  img_proc: true
- pgno: 594
  md: '做勤王之师。同时对左宗棠等人，那拉氏又安置了其他人加以制衡，可谓一环扣一环，每一环节都别有用心。曾国藩自然心里明白，他也不会任由那拉氏摆布，他同时也在培植李鸿章为自己的接班人，用淮军替代湘军。在自我削弱的同时，扶植新的势力。


    最后，曾国藩、左宗棠、李鸿章等人以中兴名臣的姿态出现在历史潮流之中，清王朝却最终仍被汉人推翻。千秋功罪，实难详说！


    晚清时期，风云际会，涌现出大量的杰出人物。他们未尝没有扭转乾坤，振兴中华的能力。清政府也未尝没有机会战胜列强，巩固统治。然而，杰出人物的大量时间都用在了做官之道上面，统治者的大量时间都用在了“制衡”之术上面。这不能不让人扼腕叹息！李鸿章在世时，被中外媒体称作“东方的俾斯麦”，但他却没有像俾斯麦一样让自己的国'
