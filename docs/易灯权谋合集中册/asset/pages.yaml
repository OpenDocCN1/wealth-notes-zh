- pgno: 1432
  md: '流，才不会因为老板的偏听偏信，导致员工可以透过非理性的手段来竞争。


    有些管理者可能以为，这些私底下的告状，能让自己掌握一切、收集公司运作的各种资讯，殊不知这些资讯最后将会反噬这个组织，让团队因相互中伤而瓦解。


    有人的地方就有江湖！部属私下举报，该怎么应对？


    只要有人的地方就是江湖，而人在江湖、身不由己已是职场中无法改变的事实。即使上位者做到避免偏听偏信的态度，也无法保证不会发生非理性的竞争，因此，建议担任主管运用下列
    3 项原则，降低这些竞争对于组织的影响：


    +   1. 没有具体来源、无法证实的资讯，不处理！


    收到未具名的检举信（黑函），或是同仁举报却无法提出具体证据，都不该进行处理，免得引发连锁反应，所有人都能以没有根据的资讯攻讦他人。


    +   2. 未涉及公司规范、与公务无关的资讯，不需报告、也不列入参考！


    对于员工的私领域与其他与公务无关的资讯，主管应避免透过公司其他同仁的协助搜集与了解，以免有加油添醋或是妄加评论的谬误。如果想较全面的观察特定员工，不妨采取
    1 on 1 的面谈，或是私下的交流进行了解，以避免有造成个人隐私成为办公室谣言的风险。


    +   3. 含沙射影、纯属臆测的资讯，不准报告！'
