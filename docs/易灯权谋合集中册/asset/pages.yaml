- pgno: 235
  md: '韩信尚在睡梦之中。刘邦直入其卧室收夺其印信符节，然后才召集众将听令。张耳、韩信从梦中醒来，方知汉王来临，不禁大惊失色。汉王遂命令张耳守赵地，同时拜韩信为相国，全权统兵进攻齐地。刘邦的诡诈之术，就连韩信也佩服之至，由衷地称颂他“善于将将”。


    总之，这种“无为之术”，其实质就是如何玩弄权术，搞阴谋诡计，愚弄臣下。历代帝王对这套东西非常欣赏，奉为圭臬。他们在统治过程中，无不熟练地运用这些权术，纵横捭阖。就连唐太宗这样一位被历代士大夫奉为至圣至仁的明君，虽然极力主张对臣下推心置腹，以诚相待，但在其晚年，也多次运用权术驾驭臣下。这是因为在集权专制的封建时代，皇权与其他集团之间始终存在着矛盾冲突，皇权的至尊无上和不容染指，决定了君臣关系中存在阴谋权术的必然性。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 成大事必备九种手段


    人生的计划和行动，是需要靠章法来完成的，而不是靠一些怪招去谋划的。这就好比在拳击台比赛一样：两个拳手相互较量，激战正酣，进退躲闪、扑让攻守，都有相当灵活的步伐和拳路，他们的一招一式都是为成功而做准备的，这一招一式就叫手段。可惜的是，有很多人并不能看到这一招一式的寓意。


    手段是成功的保证，没有手段的行动和计划一定是事倍功半的，孙悟空与牛魔王一比高低，靠的是什么？靠的是他七十二变的手段；一名话，没有手段，你永远吃不到成功的甜果。


    手段从何而来？对于那些成大事者来说，他们善于总结自己、反思自己、比较自己，从而避实就虚，找到自己人生的强项——自己究竟能干什么和不能干什么，并付出实际的行动。这个过程就是确立自己成大事手段的过程。不明'
  merge: -1
  img_proc: true
- pgno: 237
  md: '自这一点，一个人永远就会在错误的方向走下去。


    # 成大事的九种手段：


    # 1、敢于决断——克服犹豫不定的习性


    很多人之所以一事无成，最大的毛病就是缺乏敢于决断的手段，总是左顾右盼、思前想后，从而错失成功的最佳时机。成大事者在看到事情的成功可能性到来时，敢于做出重大决断，因此取得先机。


    # 2、挑战弱点——彻底改变自己的缺陷


    人人都有弱点，不能成大事者总是固守自己的弱点，一生都不会发生重大转变；能成大事者总是善于从自己的弱点上开刀，去把自己变成一个能力超强的人。一个连自己的缺陷都不能纠正的人，只能是失败者！


    # 3、突破困境——从失败中摄成功的资本'
  merge: -1
  img_proc: true
- pgno: 238
  md: '人生总要面临各种困境的挑战，甚至可以说困境就是“鬼门关”。一般人会在困境面前浑身发抖，而成大事者则能把困境变为成功的有力跳板。


    问题 4、抓住机遇——善于选择、善于创造


    机遇就是人生最大的财富。有些人浪费机遇轻而易举，所以一个个有巨大潜力的机遇都悄然溜跑，成大事都是绝对不允许溜走，并且能纵身扑向机遇。


    5、发挥强项——做自己最擅长的事情


    一个能力极弱的人肯定难以打开人生局面，他必定是人生舞台上重量级选手的牺牲品；成大事者关于在自己要做的事情上，充分施展才智，一步一步地拓宽成功之路。


    6、调整心态——切忌让情绪伤害自己


    心态消极的人，无论如何都挑不起生活和重担，因为他们无法直面一个人挫折，成大'
  merge: -1
  img_proc: true
- pgno: 239
  md: '事者则关于高速心态，即使在毫无希望时，也能看到一线成功的亮光。


    # 7、立即行动——只说不做，徒劳无益


    一次行动胜过百遍心想。有些人是“语言的巨人，行动的矮子”，所以看不到更为实际现实的事情在他身上发生；成大事者是每天都靠行动来落实自己的人生计划的。


    # 8、善于交往——巧妙利用人力资源


    一个人不懂得交往，必然会推动人际关系的力量。成大事者的特点之一是：善于靠借力、借热去营造成成功的局势，从而能把一件件难以办成的事办成，实现自己人生的规划。


    # 9、重新规划——站到更高的起点上


    人生是一个过程，成功也是一个过程。你如果满足于小成功，就会推动大成功。成大事者懂得从小到大的艰辛过程，所以在实现了一个个小成功之后，能继续拆开下一个人生的“密封'
  merge: -1
  img_proc: true
- pgno: 240
  md: '袋”。


    可以讲任何一 种手段，都可以导致一种结果，但这个结果是不是最佳的结果，恐怕就很难说了。成大事者总是关于选择最佳的手段，达到最完善的结果，这就是非一般人所能做到的。


    因此在成功之路 上，你要想成大事，首先要解决的就是：你的手段对你推动成功的计划是否立竿见影！


    # 晋惠公夷吾的权术


    据《史记 · 晋世家》 记载，晋献公死后，里克先杀晋献公指定的继承人奚齐（驪姬生），又杀刚立的悼子（奚齐弟），再杀拥立二孟的大夫荀息。里克 欲迎躲避在翟国的重耳（晋献公的儿子）上台，但重义气的重耳怕担杀二君一大夫的骂名，不愿意前往执掌晋国大权。而这正给了躲避在梁国的夷吾（晋献公的另一个儿子）一个千载难逢的机会。夷吾欲往，有人劝'
  merge: -1
  img_proc: true
- pgno: 241
  md: '说：“国内有公子可立，但不立，反而立国外的，不可以相信。一定要靠辅助你的强大的国家送你入境，不这样就非常危险，我考虑强大的辅助你的国家非秦国不可。”于是，夷吾厚赂秦国，与秦约定：“即得入，请以晋河西之地与秦。”并写信给里克：“诚得立，请遂封子于汾阳之邑。”于是，秦穆公发兵送夷吾回到晋国，再加上内外有里克的配合，夷吾当上了晋国国君，是为惠公。


    惠公元年，派使臣前往谢秦，说：“开始夷吾允诺将河西的地方给秦国，今天得以考虑这件事了。但是大臣们说：“土地是先帝留给后人的，你在外，怎么可以擅自将地给外人呢？惠公与他们相争，不能说服他们，所以在此特向秦国表示谢意。（始夷吾以河西地许君，今年得入立。大臣曰：“土地者先君之地，君之'
  merge: -1
