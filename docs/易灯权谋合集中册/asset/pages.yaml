  md: '不想被别人看扁，不需要刻意和别人吵架，只要懂得设底线即可。画出底线会影响我们的生活态度和工作成果，也会决定我们在朋友、上司和下属中的形象与地位。它能让你果断地承担风险，如果没有原则，很可能会长时间处于一种犹豫不决的状态。


    就像是主管对提案多问两句，你就退缩，工作等于没进展。失败的提案都是为了试探其他可能性。如果问主管：为什么不能接受？反而能听到主管真正的需求。


    想让别人知道你不是好惹的人，必须为自己安排最后一道防线，明白告诉自己：一旦退到这一步，要拒绝对方上前逼近，也要适时反推回去。在设立底线、原则前，可以试着每天晚上问自己
    5 个问题：


    +   * 我今天又放弃了哪些决定权？

    * 我今天对别人退让了吗？

    * 这种退让合适吗？

    * 我今天有没有坚持过自己的立场？

    * 明天我该怎么做？


    在问题后注明应该采取什么应对方法，未来如果发生类似状况，就可以坚定立场。


    # 两个实战练习


    +   1. 主管动之以情时，低姿态反将一军'
