- pgno: 301
  md: '遇的原因啊。苏秦出任燕国的宰相，燕国有人在国君面前诽谤他，燕王手按宝剑发怒，还杀了一匹骏马给他吃；白圭在中山名声显扬，中山有人到魏文侯面前毁谤他，文侯却拿出夜光璧赠给他。这是为什么呢？两主二臣之间，剖心、披胆，深信不疑，怎么能听到流言蜚语就变心呢！”


