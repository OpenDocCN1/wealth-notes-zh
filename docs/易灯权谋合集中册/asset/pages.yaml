  md: '失败需要正确面对，在很多情况下，失败并不是什么坏事。从另一方面看，有创造力的思考者会了解失败的潜在价值，会利用失败当作垫脚石，来产生新的创意。在现实生活中，如果非常害怕失败，这样会使孕育创新的机会大为减少。如果一个人很少失败，那表示该人不是很有创造力。


