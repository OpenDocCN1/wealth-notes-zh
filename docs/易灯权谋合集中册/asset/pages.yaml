- pgno: 129
  md: '# 官场大师是如何把握权术斗争的？


    孔子是自己开办的“中国做官职业学院”的校长兼首席教授。虽然他本人仕途不得志，但绝对是给一点阳光就灿烂的人。在他晚年被季氏重用后，短短的四年时间里使鲁国男女分途、路不拾遗，一派繁荣安定的大好形势，搞得齐国都害怕了。他一生中如
    何做人、做官的研究十分深刻和了得，其中关于如何把握官场权术争斗的心经，非常独到，值得学习。


    官场争斗，自古有之，后世亦然。对于此，人们一般称之为“内耗”，我们的很多事情也正是坏在这样的内耗当中的。所以，对于官场争斗，我们一方面对它痛心疾首、试图改善，一方面又看到“天下乌鸦一般黑”，心里也是无可奈何。那么，作为“官场大师”的孔子是如何看待这些问题的呢？


    官场争斗是正常现象。孔子说：君子和而不同，'
  merge: -1
  img_proc: true
- pgno: 130
  md: '小人同而不和。他认为，官场上的人来自五湖四海，各人的脾气不同、爱好各异，对人做事的看法总归不会老是一致，在研究讨论问题时不同看法是正常的。所以，他反对官场中人表面一团和气但背地里搞阴谋诡计。那些会上不说，会后乱说；当面奉承，暗地拆台的人，就是看上去追求不争而背后热衷乱斗的人。孔子尤其反对巧言令色的好好先生，主张像君子一样争观点、斗智慧，反对像小人一般争利益、斗心眼。因此，官场的争斗不是洪水猛兽，利用的好反而是团结的有利武器。


    官场争斗不能撕破脸。官场中人低头不见抬头见，如果因为政事伤了和气，你看我不顺眼，我瞅你不舒服，那就无法共事了。因此，孔子对官场中正常的争论也有明确的标准，他主张："君子无所争，必也射乎！揖让而升，下而饮。其争也君子。"就是，如果在官场中由'
  merge: -1
  img_proc: true
- pgno: 131
  md: '于认识不一致、观点不一样而引发的争论是不可避免的，那也要讲求适度，合乎礼仪。争论当中只能论事，不能谋人。并且，争论要局限於某一特定场合、特定范围，做到会议上争，私自下合。事理上争，人性上合。而不能因事伤人，搞得大家都不愉快。毕竟都是成年人，不能像小孩子过家家似的，今天好明天和。成年人万一撕破了脸是很难愈合的，什么时候都不能僵化到如此地步。


    官场争斗不能来阴的。孔子一生强调做人要仁义厚道，不能阴险狠毒。他强调：成事不说，遂事不谏，既往不咎。简单说就是过去的事就让他过去，不能揪别人的小辫子不放。而现实中的有些人却不怎么正大光明，总是背地里拿着放大镜察看别人过去的失误，还要一笔一笔记下黑帐，到时花上几毛钱往上面一捅，背后整人。这样的人看到别人工作有了错误，不但'
  merge: -1
  img_proc: true
- pgno: 132
  md: '不会感到不安，反而如同发现了宝贝一样收藏着、蓄谋待发。事实上，做这种事的人是不会有好下场的，往往是两败俱伤，被他人从中偷机渔利。


    官场争斗要讲求技巧。官场争斗说到底是为了强大自己的力量而实现自己的目的，那么争斗一个很重要的方面就要善于用自己的意志统一别人的思想和行动，这里面就要讲一些技巧。孔子认为：“信而后谏，未信，则以为谤己也。”就是说，要想让别人接受自己的观点，必须首先取得别人的信任，认为你这样做是为了共同的利益。如果别人不信任你，会可能会以为你这样做是在毁谤他。但现实中，很多人往往不善于迂回作战，而只是一根筋地不断地灌输。以为自己所持观点是对，别人就应该无条件接受。别人不听就发牢骚，到头来可能是“事君数，斯辱矣”。'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# 士君子和权术家


    韩信和陈平都是汉初重臣，对刘邦可谓是功莫大焉。但两人遭际各异，陈平位至右丞相，侯爵传至曾孙。而韩信则从楚王被降至淮阴侯，再被夷灭三族，不得善终。两人的命运，千古聚讼不休，但能说到点上的极少。


    韩、陈两人的命运差异，在于他们心底里要求自己做一个什么样的人。归根结底，是因为韩信是一位士君子，而陈平则是一名地道的权术家。


    韩信出身破落贵族之家，性格高傲，能守节不变。为了实现理想，他能够忍受胯下之辱，漂母对他的一饭之恩，他以千金相报。项羽劝他做“二五仔”，从背后给刘邦一剑，提前上演三国演义。他坚决拒绝，理由是刘邦“解衣衣我，推食食我”，以致今天的很多人还怀疑刘'
  merge: -1
  img_proc: true
- pgno: 134
  md: '邦和韩信是否有过一夜情。蒯通劝他做天子，他就像脖子涂了印度神油一样—— 硬颈，不为所动。要知道当时的他，正在坐观刘邦这两个不读书的主儿在相扑，以他强大的军事力量和彪悍的军事智商，一举消灭这两个现行反和平分子，并不是什么大问题。


    另一方面，韩信虽然能忍受胯下之辱，但却不能接受与樊哙等人为伍。刘邦诱擒韩信后，韩信从楚王降为淮阴侯。有一天他在街上闲逛，无意中到了樊哙家，樊哙见老上司来了，马上整肃衣冠，一路跪拜送迎，连连说
    “大王乃肯临臣”，仍旧以 “王” 称呼对方，言下之意是哪阵风把楚王您给吹来了，这真是小人的大幸，大王您等着，小的马上去厨房亲自杀狗做饭！


    但韩信没有理会他，而是大摇大摆地走了出去，回望樊府高悬的牌匾，轻蔑地 “呸” 了一'
  merge: -1
