  md: '般无二。因为“表夫妻素爱琮（刘表次子），合适（嫡）立庶，情计久定”。既然刘表夫妻为了将基业传给刘琮，甚至不惜废嫡立庶，怎么可能真心实意地让与刘备？何况对于刘备，刘表早就“惮其为人，不甚信用”。刘备来投不久，“荆州豪杰归先主者日益多，表疑其心，阴御之”。在这种情况下欣然接受刘表的荆州之托岂非取死之道？


