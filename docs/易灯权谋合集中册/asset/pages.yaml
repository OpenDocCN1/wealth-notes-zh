  md: '使公为将行，今中道而乱何也？』客因辞而去曰：公不知治，有威足以服人，而利足以劝之，故能治之。今臣，君之少客也。夫从少正长，从贱治贵，而不得操其利害之柄以制之，此所以乱也。尝试使臣彼之善者我能以为卿相，彼不善者我得以斩其首，何故而不治？


    # 译文如下:


