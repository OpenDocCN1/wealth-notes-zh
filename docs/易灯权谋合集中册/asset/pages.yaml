  md: 量经常给男人增加额外的权力分数。如果男人认为谁是至高无上的人，他们可能比较容易变得顺从和恭敬。女人获得权力的方式不同于男人，她们靠的是建立关系、寻找关系户的方法。女性团体最终可能会产生地位的差异，但她们却并不从建立差异开始。把一组互不熟悉的女人放在一起，她们会马上试图发现彼此之间的共同点。尽管女人对明显支配别人的方法不满意，但她们经常通过包容或排斥的方法行使权力。比如她们比男人更愿意上演“疏远游戏”。男人的权力作用方式是“上或下”，女人则是“里和外”。比如男人们通常不太清楚彼此的个人生活，因为他们觉得没有必要用这种方式建立关系。在由男人主导的团体里，经常发生的权力问题是：对于支配权的关注经常阻碍合作，每个成员都认为其他人没有权力来干涉自己的“领土”，大家都各自为战，避免合作。在女性主导的团体中，问题更容易出现在对关系“事务”的纠缠中。例如谁友好不友好，谁爱讲闲话，谁应该受关注，谁太尖刻等等。多数团体都是由男女共同组成的，
