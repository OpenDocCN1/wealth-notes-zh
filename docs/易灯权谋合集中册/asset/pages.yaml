- pgno: 83
  md: '记载：后汉末年，刘表的长子刘琦，为后母所不容，常请诸葛亮教“自安”的办法，亮不应允。一天，两人同上高楼，刘琦暗中叫人把梯子抽去，对亮说：“今日上不至天，下不至地，出君之口，入琦之耳，可以赐教矣。”诸葛亮见无法脱身，只得春秋时晋献公的妃子丽姬谋害太子申、重耳在外而妄指点刘琦。刘琦恍然大悟，便去请求父亲把他派往江夏，避开后母，免遭祸害。


    军事学上说的上屋抽梯，原意是把自己的军队置于有进无退的“死地”破釜沉舟，迫使士兵与敌人决一死战。如《孙子。九地篇》中就说：“帅兴之期，如登高而去其梯。”后人借用其它地方，多指诱敌陷入自己设置的“口袋”、“陷阱”里，置敌于死地。作者把它用到权术'
  merge: -1
  img_proc: true
- pgno: 84
  md: '上来，就是指领导者在用人行为中，利用各种不光彩的手段，将下属诱入自己设置的“陷阱”里，以达到牢牢“控制”下属的目的。这种权术与“利而诱之”权术相比，“目的”是相同的：都是通过不光彩的手段，为了牢牢控制下属。但在采用的具体手段和方法上，却迥然不同：“利而诱之”主要是用“甜头”引诱下属，使下属对自己感激涕零，心甘情愿为自己“效劳”；而“上屋抽梯”，却是先“甜”（满足对方欲望），后苦（掉入“陷阱”），迫使下属“不得不”为自己“卖命”，显而易见，“上屋抽梯”比“利而诱之”，在手法上显得更“高明”，在计谋上显得更“阴险”，而在效果上，也显得更“歹毒”。


    常见的“抽梯”手段有：


    其一、下属自己“上梯”，上司随即“抽梯”。'
