  md: '申不害研究术，有正面的领导控制方法，也有阴谋诡计，我们现在不能说他是非道德，但可以说，他的思想和研究是可以启迪后人的。


    # 不可共富贵 最爱卸磨杀驴


    皇帝大概是有史以来地位最受威胁的职业，百炼成钢，为了握紧手中的权力，皇帝们大多是不折不扣的阴谋家。权术权术，为权而术，当皇帝的，不仅要与家族争权，还要与下属争权。为了保护皇权，皇帝们连亲人的性命都可以毫不姑息，当地方割据势力与中央集权发生冲突时，这种严重威胁着中央大一统政权的分裂势力更是必然会被铲除，而且是越'
  merge: -1
  img_proc: true
- pgno: 1361
  md: '彻底越好，绝不留后患。那些皇帝当得稳健的，几乎无不是善弄权术、智商高明、手段多样之人，毕竟江湖险恶，你不杀人，别人就可能杀你。在这不断的尔虞我诈中，许多皇帝都成了三十六计计计精通的老狐狸。


    刘邦“敲山震虎”刘邦就是这一条老狐狸，当年和项羽争天下，老夫妻儿都被楚霸王抓去当人质，项羽通知刘邦要把刘父杀掉煮汤，对此，刘邦的反馈是，“好哇，到时候分我一碗！”这么一个为了权力六亲不认的人，打下江山后，岂能容忍任何人威胁到自己的地位。
    而且，他还有一个智力权术不在其下的老婆吕雉，自己不便下手的，就由老婆出马，比如，对付当年的功臣猛将、传说中的“战神”韩信。“成也萧何，败也萧何”讲的是韩信与萧何的故事。韩信被刘邦重用，首先是自身有才，所谓韩信点兵，多多益善，但萧何不遗余力地挽留和推荐也起了至关重要的作用。有了萧何这位伯乐，这才有了后来的刘邦筑坛拜将，而韩信之死，萧何同样有不可逃脱的责任，他是最大的帮凶。
    前文提到过，从历史发展的角度来看，在楚汉之争中，刘邦为聚集力量、争取同盟军，先后分封了7个异姓王，但战胜项羽、建立汉朝之后，一切都不同了，这七个异姓王成为他称帝之后贯彻专制主义中央集权的最大隐患，于是，在吕后的帮助下，刘邦选择了杀戮功臣。
    “汉初三杰”之一、被后人成为“战神”'
  merge: -1
  img_proc: true
- pgno: 1362
  md: '的韩信成了黑名单上的第一人。客观地讲，韩信虽然有成神之才，却并没有很高的情商，甚至可以说，他对自已的死应该负一定责任。他居功自傲，矜才自负，“矜味遏”，刘邦于汉高祖五年改封韩信为楚王，六年因被告发谋反而将其降为准阴侯等一系列暗式“你给我老实点儿”的举动，不但没有使韩信韬光养嗨收敛锋芒，反而导致韩信去唆使陈稀谋反。这正是任何一个帝王都丝毫不能容忍的，一心帮老公稳定江山的吕雉更是怀恨在心。公元前
    197 年，陈稀果然谋反，“上自将而往，信病不从。”一刘邦都亲自出征了，你韩信这种时候竟然连个样子也不肯做做。前线还没平叛结束，留守后方的吕后就“听说”韩信在关中与陈稀策应，便先发明人，用萧何之计，迅速除掉韩信—这一势力最大的异姓王。


    萧何给吕雉定计，诈称前线传来刘邦平叛胜利的消息，按照惯例，此时百官都要进宫朝贺，半信半疑的韩信刚一进宫，就被武士们搦了个结结实实。由于韩信为刘家天下立下的汗马功劳，刘邦曾给韩信“不死”的承诺：即见天不死，见地不死，见兵器不死！于是萧何又献计给吕后，用麻袋搦住韩信，拉到长乐宫的神室，把竹竿削尖了，一遭乱刺把韩信扎死。这一招实在高明，但让人奇怪的是，萧何的人品为何如此之差？出卖朋友，手段残忍。而这一点，正是吕后的高明


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1362_0.png)'
  merge: -1
  img_proc: true
- pgno: 1363
  md: '之处。吕雉是一个残忍果敢、有决断力的女人，即使刘邦不在，她也完全有能力凭己之力解决韩信的问题。但是，她选择了与萧何共谋此计，对于吕后来说，利用萧何既可以避免滋生其他祸端，更快更周密地解决掉韩信；又可以起到敲山震虎的作用：提醒萧何谨慎自己的行为，不可有半点儿谋逆之心。否则，不论军功大小，一概处之。借力打力，敲山震虎，被吕雉运用到了极致。


    她为何有把握，萧何愿意落井下石，不会为韩信辩解、开脱呢？对此，我们有必要了解一下萧何此时的处境。早在汉高祖三年，刘邦已经逐渐对萧何猜疑，吕雉凭着对萧何的了解，料定其为求取信任，摆脱艰难处境，必定选择出卖朋友，谋求自保。而有了韩信的前车之鉴，萧何也必定更加小心，实际上，终萧何一生，都表现得十分“乖巧”，当然，也正因此得以善终。


    媳妇吕雉使的这一手，刘邦是个什么态度呢？历史上是这么记载的：刘邦听到韩信的死讯，很高兴。


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1363_0.png)'
