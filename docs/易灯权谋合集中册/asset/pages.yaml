  md: '务，这实在不是我杀身所能报答朝廷的。我将以上苦衷上表报告，加以推辞不去就职。但是诏书急切严峻，责备我怠慢不敬。郡县长官催促我立刻上路；州县的长官登门督促，比流星坠落还要急迫。我很想奉旨为皇上奔走效劳，但祖母刘氏的病却一天比一天重；想要姑且顺从自己的私情，但报告申诉不被允许。我是进退两难，十分狼狈。


