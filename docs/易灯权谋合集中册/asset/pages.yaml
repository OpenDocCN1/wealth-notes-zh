  md: 尽心安抚百姓，全力处理政务，又以政绩著称。过了一年，何远迁任树功将军、赵墨内史。当时星陆堡芦谥朗任挂职刺史，他上任的时候，沿路抢劫掠夺，但进入始兴地界，他连草木都没有损害。任职的时候，喜欢开修道路，修墙建百姓住房，街市里巷，城池仓库，他一一整理，如同营建家室。田秩俸钱，何远全不取用，到了年终，他挑选最为窘困的百姓，用自己的俸禄充作他们的赋税，他经常这样做。但是他处理诉讼案件也如同别人，没有超过一般人的地方，但他生性果断，百姓不敢干坏事，
