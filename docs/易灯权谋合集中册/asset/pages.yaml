- pgno: 244
  md: '是一个千刀万剐的死有余辜的顶尖罪人了。


    再看晋惠公的权术之三：


    晋惠公四年，晋饥，乞余于秦。秦穆公问百里奚，百里奚说：“天灾流行，年年总会有的，救济灾民帮助邻国，是我国一贯遵循的道义，帮助他们吧。”（天灾流行，国家代有，灾恤邻，国之道也，与之。）有人反对，秦穆公说：“其君是可恶，但他们的老百姓有什么罪呢？”于是，秦国向晋国伸出援助之手。


    晋惠公五年，秦国饥荒，秦向晋国求援。有一个叫虢射的对晋惠公说：“那一年，我国饥荒，是天赐良机给秦国来犯我，但秦不知天意。今年，上天把秦国赐给我晋国，我们怎么能逆天意呢？立即去攻打它。”（往年天以晋赐秦，秦不知取我而贷我。今天以秦赐晋，晋岂可以逆天乎？遂伐之。）此话，正合晋惠公心意。


    245'
