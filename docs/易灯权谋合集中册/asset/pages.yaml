- pgno: 1255
  md: '▇ 不过我认为这样的领导人只是啦啦队的功能，你激励了属下，要他做什么事情，要带给他们方向，这才是最重要的。


    ▇ 我认为领导者最重要的功能是：要知道方向、找出重点以及想出解决大问题的办法。


    ▇ 可是你知道方向，却没有人跟着你，这样也不成为领导者，而且是最大的悲剧。


