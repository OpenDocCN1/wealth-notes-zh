- pgno: 1256
  md: '+   v 可爱与被喜欢不等于尊敬，大老被尊敬的原因是因为他们对问题能够深入了解，拟定正确的策略。


    +   v 威权领导是完全倚赖威权，如同一言堂，上面说什么就照着做。


    +   v 强势领导的特点包括：对重大决定有强烈的主见、常常征询别人的意见、对方向性及策略性以外的决定可如善如流以及不多时间去说服每一个人。


    +   v 威权与强势有个很重要的差异就是常征询别人的意见。


