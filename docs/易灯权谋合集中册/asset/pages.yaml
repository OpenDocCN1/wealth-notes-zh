- pgno: 245
  md: '于是，晋惠公用虢射之谋略，不与秦粟，反而发兵攻打秦国。


    人是要讲良心，讲公德的，在别人为难之时应帮一把，但晋惠公却是趁人之危，恩将仇报，先行下手，图谋一举置恩人于死地。


    这一次晋惠公权术也许玩过了头吧。结果呢，秦国上下一心，同仇敌忾，活捉了晋惠公夷吾。夷吾觉得没有脸见人，就把权力交给了儿子圉。


    晋惠公在历史上没有什么地位，比起他的哥哥晋文公要差得多，但是他的狡诈的权术却是出类拔萃。


    # 五条用人标准


    有一天，魏文侯对李克说：“先生曾教过我，家贫则思良妻，国乱则思良相。今有两个人，一个是魏文子，一个是翟璜，选谁为相好呢？”'
  merge: -1
  img_proc: true
- pgno: 246
  md: '李克说：“我听说，地位卑微的人不去考虑尊贵的人考虑的事，疏远之人不去考虑亲近之人考虑的事。我在体制之外，不敢当命。”魏文侯说：“先生临事不要推让。”李克说：“你是没有好好考察历史上的事情。居视其所亲，富视其所与，达视其所举，穷视其所不为，贫视其所不取。这五条足以确定哪一个人合适，还要等待我确定吗？”


    李克提出用人的五条标准，我们有必要逐条细读：


    居视其所亲。“居”可当地位讲，也可当住所讲。即要看这个人所处的地位，与哪些人亲近；要看他居住的环境，与哪些人来往。这一条明明确确地告诉魏文侯，看一个人，不能被其表'
  merge: -1
  img_proc: true
- pgno: 247
  md: '象所迷惑，不能只听他口头上说些什么，而要去实地察看，整天围绕着他的是一些什么人。是达官贵人？是巨商富贾？是三教九流？是黑道？是知识分子？是平民？这一点比调查其事迹，更能看出一个人的本质。这一条不仅说明“近朱者赤，近墨者黑”的道理，也说明这个人执政将会代表了谁的利益。如果，整天与他交往的是达官贵人，是巨商富贾，没有一个普通群众，他将来必然是这些人的代言人。如果，他与各方面的人接触，有高层的，更多的是基层的平民，那他一定会从多方面考虑民众利益，不被某些人所左右。


    富视其所与。致富了的人，就要看他能不能做善事，把自己的财富拿出一部分给予社会，给予贫民。这一条也是我国古代社会一直强调的。在同一个社会里，有人能力强，有人机遇'
  merge: -1
  img_proc: true
- pgno: 248
  md: 好，有人社会关系好人脉好，他们富裕了；但是，相反，另一些人没有这些因素，就贫困了。如果，富者紧紧捂住自己的钱袋，乃至于为了扩大自己的财富不择手段，为富不仁；而另一方面贫困人口增加，贫困化程度严重。这样的社会怎么可能持久呢？如果，富者帮助贫者，把助贫看成是自己的一种责任，使天下所有的人共享欢乐，这将是一个持久的和谐的社会。达视其所举。“达”的意思十分广泛，可与“通”连词。学识通达，人情通达，事理通达，心胸通达，上下通达等等。一个学识浅陋之人，不懂辩证法，不懂历史，不懂作文，不懂自然科学，在治理国家上是不可能有所举动的；一个人不通社情民意，对人民的疾苦无动于衷，无情无义，在治理国家上必然依靠强制和暴力来维持；一个人不通晓事理，做事缺少前后考虑，顾头不顾尾，朝令夕改，必然不能以理服
  merge: -1
  img_proc: true
- pgno: 249
  md: '人，而引起上下矛盾重重，怨声载道；一个人心胸狭窄，为小事耿耿于怀，今日与你记仇，明日与他为敌，意气用事，不能从全局考虑，这种人自己的小家治不好，当然更不能治理国家了；一个人只熟悉自己这一点，或者只熟悉自己周围小圈子的人，而不能了解国家范围内各种层次人口的需求，上下阻隔，必然结党营私，为极少数人服务。由此可见，一个人要做到“达”相当不易。而“达”并不是仅仅说在嘴上的，重要的是要看其举动，方能证明他是否做到学识通达、人情通达、事理通达、心胸通达、上下通达等。


    穷视其所不为。“穷”在这里并不是指贫穷，而是指极端状态。要看他在到达极端状态时，能不能坚守底线，固守人格，不去做伤天害理的事情。极端状态可以有多种理解：权力极大，'
  merge: -1
  img_proc: true
- pgno: 250
  md: '无人能监控时，能做到慎独，自我控制，不贪污不受贿；在生命受到威胁时，把生的希望留给别人，自己从容地接受死亡的考验，而不能相反，以牺牲别人换取自己的生命；在巨大的不义之财面前，能做到虽一毫而莫取。贫视其所不取。要看他在贫困时，能不能最大限度地克制自己，不偷不抢，不吃嗟来之食，不为五斗米弯腰。有人经受不住贫困的考验，道德败坏，做出偷盗抢劫之事，甚至于谋财害命。这一条道德标准与孟子说的“贫贱不能移”完全一致。


    李克的五条标准，没有什么豪言壮语和矫揉造作，非常实在，也非常顶用。它既重视人的一般表现，又重视人在关键时刻的表现；既重视人的品德，又重视人的业务能力；既体现“透过现象看本质”的原则，又具有“选择决定本质”的某种现代存在主义思维。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '当然这五条标准从根本上讲是维护统治阶级利益的。一个是魏文子，一个是翟璜，都是世卿之列。毋庸置疑，制定标准的本身就是为了维护统治阶级的利益。


    # 能使事情逆转的游腾、胡衍


    春秋战国时代多辩士，凭三寸不烂之舌，能使事情逆转。辩士多有了解天下大事，懂天文、熟历史、通地理的知识素养，又有猜测对方心理的能力。当然，作为辩士还是一个雄辩的天才，能说得天上有地上无，天花乱坠，把对方引入自己设计的迷宫，从而俘虏对方，实现自己的目标。成功的辩士会因自己一张嘴而封侯或成为富豪。也有先成功后失败的辩士，最终被施以酷刑。


    春秋战国时代辩士层出不穷，各有千秋，百家争鸣，百花齐放，思维特别活跃，表明那是一'
  merge: -1
  img_proc: true
- pgno: 252
  md: '个能人交锋的时代，是一个奋发向上的时代。真理越辩越明，国家越战越强，中华文明由此兴旺发达，在世界文明史上留下了光辉灿烂的篇章。


    司马迁在《史记》中有对刺客、酷吏、游侠、货殖的专门列传，但没有对辩士的专门列传，因为辩士太多、量太大，没法通过一篇列传承载，只能散见于各篇列传。有的已经超出了辩士的范围，成了大人物，如苏秦身挂六国相印，张仪为秦相；又如范雎是提出远交近攻的大战略家，长期为秦相，蔡泽后来也为秦相。有的辩士附属于豪门，如
    孟尝君的冯灌，平原君的毛遂。还有的是社会上的游说之士，如游腾、胡衍、虞卿、蒯通等。这些辩士风格各异，在历史上都有一席之地。


    笔者从中探寻辩士的思维痕迹，取胜的路径出'
  merge: -1
  img_proc: true
- pgno: 253
  md: '发，从中找出有规律性的东西。


    这里只谈两个没有名气的辩士，一是游腾，一为胡衍。


    据《史记・樗里子甘茂列传》记载，秦武王时，逐张仪、魏章，而以樗里子、甘茂为左右丞相，秦使甘茂攻韩，拔宜阳。使樗里子以车百乘入周。周以卒迎接，意甚敬。这件事惹怒了楚王，责备周，太过于看重秦国。辩士游腾为周游说楚王，说：“晋智伯伐仇犹，调遣大批车骑，随后是士兵，仇犹随即灭亡。什么原因？是因为仇犹没有防备。齐桓公伐蔡，号称攻楚，其实袭蔡，蔡亡。（蔡也是没有防备）今秦，虎狼之国，樗里子以车百乘入周，周接受仇犹、蔡灭国的教训，所以使长戟居前，强弩在后，名义上是卫疾（樗里子），而实囚之。防止他的侵犯。且夫，周怎么能不担忧自己的国家'
  merge: -1
  img_proc: true
- pgno: 254
  md: '呢？只恐一旦亡国而使您忧虑。”楚王听后，喜形于色。


    此辩：第一，设喻，是辩士惯用的论辩方法。目的，使听者从熟悉的事例中进入生疏的、不理解的现实，很符合人们从已知到未知的认识事物的方法。对于难以解释的事情，设喻不失为一种好方法。人们可以依此类推今天的事情。


    第二，紧扣对方的心理，使之逆转。游腾告诉楚王，有防备才不致于有灾祸，而周所谓的迎接樗里子，也是一种防备，这种防备甚至于是对樗里子的一种囚禁。楚王本以为周对樗里子的欢迎是对秦的敬意，现在明白了是一种囚禁，听了当然高兴。游腾探测到楚王的心理，如此心理疗法正是对症下药。


    秦昭王元年，樗里子将伐蒲。蒲守恐，请来辩士胡衍。胡衍为蒲对樗里子说：“你攻蒲是为'
  merge: -1
  img_proc: true
- pgno: 255
  md: 了秦国，还是为了魏国呢？你是为魏国做了一件好事，而为秦国则是做了一件坏事。”胡衍一开始就捉住了问题的要害，战争的目的是什么？你攻蒲实是为了魏国，这就从根本上否定了樗里子的战争意义。这是一种“开门见山，一针见血”的论辩方法。接着再进行具体的论述：“卫之所以为卫，是因为有蒲。今伐，蒲必定并入于魏，卫必定折而随之（亦并入魏国）。魏国失去了西河之外（为秦所占）之后就再没有得到什么，兵力才削弱的。卫并于魏，魏必强大。魏强之日，西河之外（秦）必危矣。秦王看到你做的事，害秦而利魏，必加罪于你。”辩士就樗里子的错误做法进行推导，得到了可怕的对樗里子十分有害的结果。谁人没有私心？对自己有害的事当然是不能做的。这种顺势推导以得到可怕结论的的论证方法叫
