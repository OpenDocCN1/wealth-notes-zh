- pgno: 477
  md: '给李侍尧家人带赴苏州办贡。这样，李侍尧的努力并没有白费，从他每年进呈贡品的单子中可以看出，其所呈上的贡品，颇受乾隆帝的喜欢，被驳回的数量极少，无怪乎乾隆帝夸他为“贡优奇才”。


    由此可以看出，精明的乾隆帝不想杀李侍尧，原因是多方面的。看中李侍尧的才干是一个方面，李侍尧婪赃大多与办贡有关也是一个方面。据有史家分析，乾隆让和珅来办理李侍尧案，似乎要借此抑制督抚以进贡为名而肥己的贪婪劣迹，一方面可以为皇帝纳贡正名，另一方面可以制止督抚贪婪日盛的势头。所以，乾隆在上谕中教训各督抚“须痛自梦省，毋调查办不及幸逃法网，辄自以为得计。总之，有则改之无则加勉。触目警心，天良具在，人人以李侍尧为炯戒，则李侍尧之事未必非各督抚之福也。"


    乾隆四十五年（1780年）十月初三日，乾隆帝依阅鄂元的'
