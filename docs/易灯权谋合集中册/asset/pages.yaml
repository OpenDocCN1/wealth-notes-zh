- pgno: 1012
  md: '嘜弄清事实真相，老板对他的话自然深信不疑，用什么人不用什么人，很多时候就根据他的意见而定。在这样的企业中，还有什么团结和公平可言呢？长此以往，就会形成马屁成风、人心浮躁的企业文化，没有谁真正做事情了。


    在同一个企业中，资源有限、机会有限、职位有限，马屁精迷惑老板，掠夺别人该得的东西。更严重的是，马屁精们随手送出的高帽对老板是一种“精神贿赂”，让老板沾沾自喜，失去了辨别是非的能力，在用人上任人唯“近”，甚至在战略决策上出现失误。


    (1)对待专门溜须拍马奉承领导而毫无其他能力可言的人，领导者对待他们的办法最简单，走人！毫无能力专善阿奉承的人在单位就像一条臭鱼，不仅自己的问题解决不了，还会把单位的风气搞坏。所以，让他走人是最明智、最大快人心的事情。'
  merge: -1
  img_proc: true
- pgno: 1013
  md: '(2)对于能力一般而有奉承爱好的员工，最好给他找个合适的位子，让他断了想靠拍马屁得宠的念头，只能努力工作。不辞退是因为他还有一定能力，不委以重任是因为他能力平庸，还爱溜须拍马，委以重任的话，迟早会坏了大事。在单位中要做到人尽其才，人才要有效地使用，而这些能力一般又有些毛病的人也要发挥他们的作用。


    (3)对于那些确有较强能力却也喜好溜须拍马的人。领导一定要小心对待，因为这些人可是破坏性很大的“原子弹”，弄不好会給公司造成极大麻烦。对待这种人，领导首先要依据他们实际能力而委以相应的职务。不能让员工认为领导者不识才，处理不好就会让不拍马屁但较有能力的人感到领导没有眼光，而对自己在单位的前途感到失望。如果领导不能给这类有奉承喜好的人以相应职务，其他那些持观望态度的有能力者则会认为公司不注重人才而离开。如果这些人都走了，对公司的损失是大的。'
  merge: -1
