- pgno: 956
  md: '# 慎用组织赋予管理者的权力：


    一、强制性权力（即威迫权力）类似于“大棒”，是建立在惧怕基础之上。


    其一，强制性权力的运用是针对不服从或者有违规的人，成熟的团队是并不一定要使用强制性权力；


    其二，此权力建立在惧怕基础之上，并非下属的真实意愿，强制性权力的运用会对团队建设有负面影响；


    心得：管理者最好先制定相关合法合理之制度来替代强制性权力的运用。


    二、奖赏性权力（即奖赏权力）类似于“胡萝卜”。


    其一，奖赏性权力是有必要的，若没有奖赏就很难有正激励，更不会有高士气；'
  merge: -1
  img_proc: true
- pgno: 957
  md: '其二，避免滥用奖赏权，如果奖赏权不能用得其所（与需求有关），激励会产生负作用；


    心得：管理者在管理过程中需适度运用奖赏权力。


    三、法定性权力（即合法权力）类似于“照章办事”。


    其一，法定性权力属于组织授予此职位的权力。


    其二，法定性权力包含强制性权力和奖赏性权力之外，还有职位上的权威。


    心得：合法权力的“胡萝卜”适度运用，合法权力的“大棒”通过完善的制度来替代。


    # 擅用管理者个人权力：


    四、专家性权力（即专家权力和讯息权力）类似于“行家”。'
  merge: -1
  img_proc: true
- pgno: 958
  md: '其一，管理者需要持续不断的更新自己的技术能力和行业知识库；


    其二，拥有专业知识和技术的管理者易赢得他人的敬重；


    心得：管理者需用专业知识和技术培训下属和支持上司（或他人）的工作。


    五、参照性权力（即参考权力和关连权力）类似于“明星”。


    其一，管理者需要炼就（培养和打造）自己的人格魅力；


    其二，管理者（或领导者）的人格魅力易让别人愿意跟随；


    心得：管理者（或领导者）利用个人魅力引导或影响他人的行为和态度。


    # 借用他人的管理者权力：'
  merge: -1
  img_proc: true
- pgno: 959
  md: '以上五大管理者的权力基础运用是修炼内功，组织赋予管理者的权力会得到“口服”，管理者个人的权力会赢得“心服”。


    若再借用他人的管理者权力来运作组织或团队，类似于“借力而行”或“空手套白狼”，如此资源整合，管理则会游刃有余。


    其一，管理者需要认知他人(下属、上司或其他人)的管理者权力的强项和弱项；


    其二，管理者帮助下属提高个人的自我管理能力有助于提升团队的绩效；


    心得：管理者（或领导者）借用他人之所长，整合团队资源，发挥团队最大效能。'
  merge: -1
  img_proc: true
- pgno: 960
  md: '# 法家权谋教你如何说服领导


    游说之难


    游说的困难：不是难在是否具有足够的才智向君主游说，也不是难在是否具有足够的口阐明我的意见，更不是难在是否具有足够的勇气而毫无顾忌地把看法全部表达出来。（非吾知之有以说之之难


    961'
  merge: -1
  img_proc: true
- pgno: 961
  md: '也，又非吾辩之能明吾意之难也，又非吾敢横失而能尽之难也。）


    游说的困难在于：了解进说对象的心理，以便用我的说法适应他。（在知所说之心，可以吾说当之。）


    +   1、 游说对象想要追求美名的，而你却用厚利去说服他，就会显得节操低下。得到则是卑贱待遇，必然受到抛弃和疏远。（所说出于为名高者也，而说之以厚利，则见下节而遇卑贱，必弃远矣。）；


    +   2、 游说对象想要追求厚利的，而你却用美名去说服他，就会显得没有心计而又脱离实际，你的意见必定不会被采纳。（所说出于厚利者也，而说之以名高，则见无心而远事情，必不收矣。）；


    +   3、 游说对象暗地追求厚利而表面追求美名的。你如果用美名向他游说，他就会表面上采纳你的意见而实际上疏远你；但如果用厚利向他游说，他就会暗地采纳你的主张，而表面上抛弃你。（所说阴为厚利而显为名高者也，而说之以名高，则阳收其身'
  merge: -1
  img_proc: true
- pgno: 962
  md: '而实疏之；说之以厚利，则阴用其言显弃其身 矣。）


    # 游说之险


    +   游说者谈话中无意中触及到君主心中隐匿的事。（凡事以密成，语以泄败。未必其身泄之也，而语及所匿之事，如此者身危。）


    +   君主表面上做这件事，心里却想借此办成别的事，游说者不但知道君主所做的事，而且知道他这样做 的意图。（彼显有所出事，而乃以成他故，说者不徒知所出而已矣，又知所以为，如此者身
    危。）


    +   游说者筹划一件不平常的事情并且符合君主心 意，聪明人从外部迹象上把事情推测出来了，事情 泄露出来，君主一定认为是游说者泄露的。（规异 事而当，知者揣之外而得之，事泄於外，必以为己
    也，如此者身危。）'
  merge: -1
  img_proc: true
- pgno: 963
  md: '+   4. 在未取得的充分信任的情况下，游说者尽说其

    所知。如果主张得以实行并获得成功，功德就会被

    君主忘记；主张得不到实行，其的才能就会遭到君

    主的怀疑。（周泽未渥也，而语极知，说行而有功

    则德忘，说不行而有败则见疑，如此者身危。）


    +   5. 在有过错的君主面前情况下，游说者倡言礼义

    等于挑他的毛病。（贵人有过端，而说者明言礼义

    以挑其恶，如此者身危。）


    +   6. 君主有时计谋得当而想自以为功，游说者同样

    知道此计，如此就会身遭危险。（贵人或得计而欲

    自以为功，说者与知焉，如此者身危。）


    +   7. 勉强君主去做他不能做的事，强迫君主停止他

    不愿意停止的事，如此就会身遭危险。（强以其所

    不能为，止以其所不能已，如此者身危。）


    +   8. 游说者如果在君主面前议论大臣，会被认为是

    想离间君臣关系；谈论近侍小臣，会被认为是想卖

    弄身价。谈论君主喜爱的人，会被认为是拉关系；

    谈论君主憎恶的人，会被认为是搞试探。（故与之

    论大人，则以为间己矣；与之论细人，则以为卖'
  merge: -1
  img_proc: true
- pgno: 964
  md: '重；论其所爱，则以为藉资；论其所憎，则以为尝己也；）


    +   9. 说话直截了当，会被认为是不聪明而笨拙；谈话琐碎详尽，会被认为是啰嗦而冗长。简略陈述意见，会被认为是怯懦而不敢直言；谋事空泛放任，会被认为是粗野而不懂礼貌。（径省其说，则以为不智而拙之；米盐博辩，则以为多而交之。略事陈意，则曰怯懦而不尽；虑事广肆，则曰草野而倨侮。）


    # 游说之术


    “游说”总原则：美化对方最自负的地方，掩饰其最自惭形秽的弱点。（凡说之务，在知饰所说之所矜而灭其所耻。）


    +   1、游说对象认为自己的计谋高明，就不要指出他过去的失败而使他受窘。（彼自知其计，则毋以其失穷之；）'
  merge: -1
  img_proc: true
- pgno: 965
  md: '+   2、游说对象认为自己果断敢为就不要用那因考虑不周造成的过错去激怒他。（自勇其断，则毋以其敌怒之）


    +   3、游说对象夸耀自己的能力很强，就不要拿他感到棘手的问题去挫伤他。（自多其力，则毋以其难概之）


    +   4、在游说对象面前，赞美第三者同样的事情和行为，文饰第三者同样的污点和错误。（规异事与同计，誉异人与同行者）。特别是，当第三者有与游说对象同样得污点，你就说第三者的事情不算事；如果第三者与游说对象有相同的错误，你就说第三者本来没有错。（有与同污者，则以饰之无伤也；有与同失者，则明饰其无失也。）


    +   5、忠心耿耿，言辞谨慎，不拂逆，不抵触进说对象的思想。然后择机去发挥自己的口才和辩智。这才可以亲近人主不被怀疑，最后达到尽诉说出自己的言论主张的目的。（大忠无所拂悟，辞言无所击排，乃后申其辩知焉。此所以亲近不疑，知尽之难也。）'
  merge: -1
  img_proc: true
- pgno: 966
  md: '6、更进一步，如果能与君主长期共事，感情融洽，深蒙恩泽，游说者深入谋划不再被怀疑，据理力争不再会获罪，就可以明确剖析利害来成就君主的功业，直接指明是非来端正君主的言行，彼此的关系能这样维持下去，游说才算最后成功。（得旷日弥久，而周泽既渥，深计而不疑，交争而不罪，乃明计利害以致其功，直指是非以饰其身，以此相待，此说之成也。）


    # 普通人难以识破的奴役术


    流传中国千年不衰、至今尤盛的帝王术创始者，韩非，虽然并非一个净身阉宦，但此人向君王进言的口气，却与清朝慈禧太后膝下的李莲英相差无几。谓予不信，翻开《韩非子》第一卷第一篇《初见秦》，其开篇第一段，便可了然：


    967'
  merge: -1
  img_proc: true
- pgno: 967
  md: '臣闻不知而言不智，知而不言不忠，为人臣不忠当死，言而不当亦当死。虽然，臣愿悉言所闻，唯大王裁其罪。—《韩非子·初见秦》


    为了突出自己的忠心，韩非甫一开口便将“不知而言”、“知而不言”定为死罪。至于如何算作“不知而言”或“知而不言”，当是很难划分和认定的。只是如此定罪，必然造成臣子在君王面前不知言什么为智、说什么为忠的恐惧。还不管臣子在君王面前的知无不言、言无不尽的自由被限制到最低限度，即便君王集思广益的可能性也被相应地缩小到几近于无的范围。而韩非之所以要把臣子的言论限制到如此严厉的程度，则无非是为了强调他
    自己所言的既智又忠。喜欢做人家的奴才并不稀奇，但把奴才做到如此份上，却实在罕见。


    若说智商，韩非似乎高于孟轲;但孟轲再弱智，与君王说话却从来不像韩非这般低声下气。孟轲语君，不说耳提面命，至少也是中气十足;而且总是居高临


    968'
  merge: -1
  img_proc: true
- pgno: 968
  md: '下，从不示弱。倘若孟轲看到韩非这付十足的奴才腔调，定然蔑视。儒法两家，儒家虽然讲究君君臣臣，但在君王面前倒还不无骨鲠传统。先秦有孟轲，西汉有辕固生，东汉更有陈蕃、杜密等一干不要命的儒臣。与此相反，主张刑名的所谓法家，虽然有商鞅的雷厉风行，有韩非的阴狠老辣，有李斯毫不留情的杀伐决断，但在主子面前却一个比一个奴颜婢膝。这些法家代表人物的结局又非常反讽，没有一个落得好下场。商鞅被车裂，韩非被李斯用计害死，李斯父子双双被主子就地正法。若说誓死效忠，倒也算全都如愿以偿。


    追根寻源，被后人认作法家先驱的管子，当年绝非如此低声下气侍奉君王。享有 “春秋第一相” 美誉的政治家管仲，不仅政绩赫然，而且个性独具，风采照人。有关管仲的政绩，连司马迁都称道：


    管仲既任政相齐，以区区之齐在海滨，通货积财，富国强兵，与俗同好恶。故其称曰：“仓廪实而知'
  merge: -1
  img_proc: true
- pgno: 969
  md: '礼节，衣食足而知荣辱，上服度则六亲固。” 一《史记•管晏列传》


    有关管仲的个性，司马迁记载如斯：


    管仲暉在青州临淄县南二十一里牛山之阿。说苑云齐桓公使管仲治国，管仲对日： “贱不能临贵。” 桓公以为上卿，而国不治，日：“ 何故?” 管仲对日：“贫不能使富。”
    桓公赐之齐市租，而国不治。桓公日：“何故?” 对日：“ 疏不能制近。” 桓公立以为仲父，齐国大安，而遂霸天下。一《史记•管晏列传》


    今世所说牛人者，其时诸子之中，无疑管仲也。这就好比一个才干出众的雇员，为老板打工之际，毫不客气地先向老板提条件。天底下没有免费的午餐，老板要雇员贡献才干如是，君王要臣子做出政绩亦如是。这与其说是一个有本事的人，需要满足自己的利益，或显示自己的个性，不如说是一个对


    970'
  merge: -1
  img_proc: true
- pgno: 970
  md: '自己充满信心的人，首先要让雇主懂得尊重雇员或者让君王懂得尊重臣子。以管仲的心胸，如此一再开价，并非仅仅是意在财富、地位，而更是在向君王标明，你我虽然君臣有别，但我管仲的尊严，不可轻视，更不容冒犯。


    管仲如此心高气傲，当今商明文明社会的高级白领看在眼里必定心领神会。但当时的一些迂腐士子，恐怕很难理解。比如孔丘，就读不懂管氏三归。提及管仲的尊王攘夷功绩，孔丘盛赞：“微管仲，吾其被发左衽矣”。但是人问：“然则管仲知礼乎？”孔丘马上回答：“邦君树塞门，管氏亦树塞门。邦君为两君之好，有反坫，管氏亦有反坫。管氏而知礼，孰不知礼？”又有问：“管仲俭乎？”孔丘断然回答：“管氏有三归，官事不摄，焉得俭？”


    不知孔丘倘若能读到韩非的“臣愿悉言所闻，唯大王裁其罪”，会发出什么样的议论。可以肯定的是，纠缠于等级观念的孔丘，不会懂得管氏三归，'
  merge: -1
  img_proc: true
- pgno: 971
  md: '别有一番尊严在其中。管仲之所以敢向齐桓公步步进逼，是因为在管仲的心目中，君王和臣子之间，彼此是完全平等的：要我管仲效力可以，但你必须给我管仲应有的待遇。这在商业文明无疑是常识，却绝对不符合孔丘所遵奉的君尊臣尊君贵臣贱的等级观念，以致会作出“不知礼”和“焉得俭”的道德判断。殊不知，这样的道德判断，全然有违于齐国的民意民心。有关管仲所获得的特殊待遇以及管仲的功绩，司马迁在《史记》中如此写道：


    管仲富拟于公室，有三归、反战，齐人不以为侈。管仲卒，齐国遵其政，常强于诸侯。－《史记•管晏列传》


    当然了，管仲的自尊，并非商业文明孕育，而是缘自华夏初民与生俱来的平等观念。在周室标榜尊尊亲亲之类的森严等级之前，臣子与君主说话，并没有仰视神明般的战战兢兢。《尚书•西伯戡黎》记载的殷臣祖伊，与商纣说话的口气，就算比不得管仲'
  merge: -1
  img_proc: true
- pgno: 972
  md: '那么豪放，至少也有孟轲那样的义正词严。人的尊严，并非书本熏陶出来的教养，而是发乎生命底蕴的人文品质。倘若没有周、孔等级观念日深月久的侵蚀，华夏民族天然具有的平等观念以及人之为人
    的尊严，绝对不会丧失殆尽到在君王的权杖面前诚惶诚恐的地步。


    春秋伊始，虽然周室周制已然数百年，但尊尊亲亲 的等级观念，并没有像“普天之下、莫非王土，率 土之滨、莫非王臣”那样统摄天下众人之心。鲁僖 公九年(公元前一六五年)，齐桓公在葵丘之盟提出
    “尊周室，攘夷狄，禁篡弑，抑兼并。”后世所谓 尊王攘夷，由此而起。这是对周室“普天之下、莫 非王土，率土之滨、莫非王臣”一个相当温馨的解 构，温馨到了把孔丘小可怜感动得如醉如痴的地
    步。然而，尊王攘夷再温馨，骨子起却不再把当初 周公建制时的等级尊卑当回事了。于是，就有了齐 桓公向管仲步步进逼的三归一再表示敬意的非常之 举，根本不管会有个叫做孔丘的破落子弟说三道'
  merge: -1
  img_proc: true
- pgno: 973
  md: '四。因为齐恒公内心深处也像管仲一样，毫无等级尊卑观念。齐恒公有过作为公子小白的流亡经历，再加上齐国当初乃吕尚之封地，不以“尊尊亲亲”为然，而以“举贤而上功”治国(参见《淮南子•齐俗训》);因此，齐恒公身上既无公子哥儿养尊处优的纨绔习气，也没有姬氏家族等级森严的尊卑观念。尽管在鲍叔牙推荐管夷吾时，齐恒公有过犹豫：毕竟当年与公子纠争夺王位时，曾被管仲射过一箭，几乎丧命。但齐恒公听了鲍叔牙之于管仲才干的一番盛赞后，旧日恩怨顿时消解于一片赤诚的爱才之心。及至获得管仲辅佐，更是乐不可支，管仲要什么都答应。如此的求贤如渴，后世的君王之中，也就曹操可相比拟。


    齐恒公和管夷吾的相知相善，与其说是君臣间的佳话，不如说是高山流水一类的美谈。对于管仲来说，从此英雄有了用武之地;而对于齐恒公来说，因为有了管仲的辅佐，得以成为春秋首霸(借用当今的'
  merge: -1
  img_proc: true
- pgno: 974
  md: '天下首富之说)。可以说，生机勃勃的春秋时代，就是这对君臣以尊王攘夷的名义共同开创的。


    历史的诡异在于，当初尊王攘夷之夷，乃一再北侵的南夷楚国。而后来对中原诸侯真正构成威胁的，却是最终吞并天下的西夷秦国。春秋时代的秦国，才刚刚崛起，除了野蛮，别无所长。及至秦穆公上台，才开始学习中原文明，不惜代价，网罗人才。诸如特地到楚国以五张羊皮换得虞国大夫百里奚，重用晋国亡臣丕豹，请出隐居的？叔，与百里奚一起，拜封为相当于丞相的左、右庶长。秦穆公由此大展身手，开疆扩土，跻身春秋五霸。秦穆公的成功与其说是野蛮之于文明的胜利，不如说是蛮力获得了文明的导引。或者说，中原人杰的加盟，使蛮秦摇身一变，成为强秦。


    毋庸置疑，秦穆公时代的君臣关系，不说完全平等，至少毫无主奴意味。秦穆公虽然身为君主，但同时又是百里奚、蹇叔等臣子的学生。搏战有赖于'
  merge: -1
  img_proc: true
- pgno: 975
  md: '野蛮，政治却需要智慧。这就好比西安以西的乡镇企业老板，请了上海的公司主管，绝对摆不出颐指气使的架子。而百里奚、蹇叔他们，也不可能像后来的韩非之于嬴政那样，在秦穆公面前诚惶诚恐。


    秦国历史上君臣关系演变的一个重大转折，见诸商鞅进谏秦孝公，以献称霸之道。


    公孙鞅闻秦孝公下令国中求贤者，将修繆公之业，东复侵地，乃遂西入秦，因孝公宠臣景监以求见孝公。孝公既见鞮鞅，语事良久，孝公时时睡，弗听。罢而孝公怒景监曰：“子之客妄人耳，安足用邪！”景监以让卫鞅。卫鞅曰：“吾说公以帝道，其志不开悟矣。”后五日，复求见鞅。鞅复见孝公，益愈，然而未中旨。罢而孝公复让景监，景监亦让鞅。鞅曰：“吾说公以王道而未入也。请复见鞅。”鞅复见孝公，孝公善之而未用也。罢而去。孝公谓景监曰：“汝客善，可与语矣。”鞅曰：

    “吾说公以霸道，其意欲用之矣。诚复见我，我知'
  merge: -1
  img_proc: true
- pgno: 976
  md: '之矣。”卫鞅复见孝公。公与语，不自知跂之前于席也。语数日不厌。景监曰：“子何以中吾君?吾君之欢甚也。”鞅曰：“吾说君以帝王之道比三代，而君曰：‘久远，吾不能待。且贤君者，各及其身显名天下，安能邑邑待数十百年以成帝王乎?’故吾以强国之术说君，君大说之耳。然亦难以比德于殷周矣。”
    —《史记•商君列传》


    与当年秦穆公的求贤若渴截然相反，秦孝公只消身子朝王座上随意一歪，自然就会有商鞅这样的中原士子进宫巴结，而且还要私走宠臣的门路，才能得见。此刻的商鞅，无疑比不得当年的百里奚、蹇叔，让秦穆公感觉如获至宝;更难望春秋名相管仲之项背。像管仲那样理直气壮地向齐桓公一一提要求，在商鞅可是想都不敢想。商鞅能够做的只是，向秦孝公点头哈腰地献计献策，一计不成，又生一计。从帝道说到王道，从王道说到霸道，一直说到秦孝公大悦，方才感觉大功告成。商鞅未必不知道自己是在取悦君王，内心深处更是明知，秦孝公的'
  merge: -1
  img_proc: true
- pgno: 977
  md: '喜欢霸术，“然亦难以比德于殷周矣”，但商鞅就是一味的奉迎，一味地寻求秦孝公所需所喜。


    秦国从偏隅一方的蛮夷，壮大到一统天下的王朝，依次走过由微而显、由荒蛮到暴虐的生长阶段。经由秦穆公，蛮秦变成强秦；经由秦孝公，强秦变成霸秦；其后秦昭公企图帝秦，被赵相平原君等中原士子挫败。所谓帝秦，实质上乃是暴秦，其标志性的历史事件，便是秦昭公手下的白起在长平之战得胜之后，坑杀四十五万赵国降卒。可叹的是，中原士子的义不帝秦，并没有能够阻止秦国的最终称帝。秦昭公受挫的帝秦或曰暴秦之业，最后在秦始皇嬴政手里，如愿以偿。


    倘若说强秦的标记是秦穆公利用了中原文化和中原士子，那么霸秦的标志则是中原文化经由诸如卫国人商鞅这类士子的臣服，完全匍伏于霸秦的军国主义。秦孝公要的是军国主义，而商鞅向秦孝公提供的，正是叫做霸道或者霸术的军国主义，如斯：


    978'
  merge: -1
  img_proc: true
- pgno: 978
  md: '令民为什伍，而相牧司连坐。不告奸者腰斩，告奸者与斩敌首同赏，匿奸者与降敌同罚。民有二男以上不分异者，倍其赋。有军功者，各以率受上爵;为私斗者，各以轻重被刑大小。僇力本业，耕织致粟帛多者复其身。事末利及怠而贫者，举以为收孥。宗室非有军功论，不得为属籍。明尊卑爵秩等级，各以差次名田宅，臣妾衣服以家次。有功者显荣，无功者虽富无所芬华。《史记·商君列传》―《史记·商君列传》


    用商鞅本人的原话来说，则是：


    夫秦之所患者，兴兵而伐，则国家贫;安居而农，则敌得休息，此王所不能两成也。故四世战胜，而天下不服。今以故秦事故，而使新民作本，兵虽百宿於外，境内不失须臾之时，此富强两成之效也。--《商君书·来民》


    979'
  merge: -1
  img_proc: true
- pgno: 979
  md: '因此，在国与民之间：


    民弱国彊，民彊国弱，故有道之国，务在弱民。--《商君书•弱民》


    换句话说，国家必须凌驾于国民之上。国家利益高于一切。此乃军国主义的基本特征。二十世纪中叶的德国、意大利、日本诸法西斯国家，无不如此。商鞅巧舌如簧地把这种军国主义说成是：


    “治世不一道，便国不法古。故汤武不循古而王，夏殷不易礼而亡。反古者不可非，而循礼者不足多。”孝公曰：“善。”以卫鞅为左庶长，卒定变法之令。－《史记•商君列传》


    商鞅的厚今薄古，表面上是相对于孔儒的厚古薄今，实质上却是以所谓的“不法古”为名，为军国主义铺平道路，从而推动秦国更上一个台阶：由霸秦走向暴秦。可以说，二千多年之后，东瀛之国的'
  merge: -1
  img_proc: true
- pgno: 980
  md: '法西斯军国主义，早在商鞅的政治主张里，就已现端倪。当年秦国向中原诸国发动的吞并战争，与日本法西斯以建立大东亚共荣圈为名的入侵中国，大同小异；骨子里都以野蛮强暴文明，以暴虐作践柔弱。商鞅变法，无论是对中国文化还是对中国历史来说，都毫无光荣可言，而是耻辱的标志。至于商鞅的结局，在秦孝公驾崩之后旋即遭到车裂，只不过是料想得到的报应罢了。


    当时向强秦献计献策献媚献丑的中原士子，并非商鞅一个。商鞅只是其中最为著名的例子。当野蛮向文明步步施虐之时，最为耻辱的还不是文明的柔弱，而是文化人的臣服。这种臣服不仅给当时天下的政治格局带来灾难性的后果，还给整个民族文化造成不可弥补的伤害。与卫国士子商鞅将自己绑上秦国的战车相对称、并且给后世的民族文化带来极大伤害的另一个中原名士，便是赵国人荀况。'
  merge: -1
  img_proc: true
- pgno: 981
  md: '商鞅在公元前三四八年被杀，荀况于公元前三一三年出生，卒于公元二三八八，比商鞅之死正好晚了一百年。荀况在世之时，恰逢秦昭襄王赢则当道。秦昭王做下的几件震动天下的大事，不可能不对荀况的思想和著述产生影响。一件是公元前二六０年的秦赵长平之战，一件是得胜的秦将白起坑杀四十五万赵国降卒，一件是随后发生的秦昭王企图称帝，还有一件是公元二五六年的秦昭王灭东周。春秋时代的“尊王攘夷”，到了战国时代，以秦昭王野蛮的夷灭尊，黯然落幕。


    在秦昭王不可一世的铁蹄面前，同为赵国人的相国平原君，宁可国破家亡，也不愿向暴秦以帝秦俯首就范，魏国的信陵君盗窃兵符以救赵，楚国的春申君毅然发兵以助赵，更有齐国一个布衣鲁仲连，傲然蔑视暴秦而义不帝秦。惟有学问家思想家荀况，以截然相反的姿态，又是入秦考察，又是在《强国》篇中盛赞暴秦：'
  merge: -1
  img_proc: true
- pgno: 982
  md: '其固塞险，形埶便，山林川谷美，天材之利多，是形胜也。入境，观其风俗，其百姓朴，其声乐不流污，其服不佻，甚畏有司而顺，古之民也。及都邑官府，其百吏肃然，莫不恭俭、敦敬、忠信而不楛，古之吏也。入其国，观其士大夫，出于其门，入于公门;出于公门，归于其家，无有私事也;不比周，不朋党，倜然莫不明通而公也，古之士大夫也。观其朝廷，其朝闲，听决百事不留，恬然如无治者，古之朝也。故四世有胜，非幸也，数也。是所见也。故日：佚而治，约而详，不烦而功，治之至也，秦类之矣。虽然，则有其譭矣。兼是数具者而尽有之，然而县之以王者之功名，则倜倜然其不及远矣!是何也?则其殆无儒邪?故曰粹而王，驳而霸，无一焉而亡。此亦秦之所短也。—《荀子•强国》


    荀况虽然像商鞅一样心知肚明，秦国“粹而王，驳而霸”，从而认定“其殆无儒邪”，用商鞅的话来说则是“难以比德于殷周”;却偏偏要恭维经过商鞅'
  merge: -1
  img_proc: true
- pgno: 983
  md: '军国主义调教的秦国，民是“古之民也”，吏是“古之吏也”，士大夫是“古之士大夫也”，朝廷更是“古之朝也”；从而得出了如此貌似很真理很公允的结论：“故四世有胜，非幸也，数也。是所见也。”这样的结论，足以让平原君、信陵君以及春申君乃至鲁仲连，全体瞠目结舌。


    说苟况弱智，也许会伤害华夏民族的感情。但说荀况的平庸与其自身的怯懦互为因果，即因为平庸而怯懦，由于怯懦而平庸，恐怕并非失实。试问，倘若没有秦国的咄咄逼人和一再得逞，荀况会那么煞有介事地援法入儒么？商鞅跑到人家宫廷里献媚取悦是为做官，苟况如此礼赞暴秦为哪般？倘若不知其写作背景，还以为荀况是在发展孔儒学说；但仔细观察一下其著书背景，才明白荀况其实是受了秦国威逼天下顶秦的霸道气势的震慑，才不得不在君王的“仁眇天下，义眇天下”之外，加上一个“威眇天下”，不得不在自己的学说里掺入些许商鞅的主张。这与其说是荀况有思想，不如说是荀况没胆


    984'
  merge: -1
  img_proc: true
- pgno: 984
  md: '识。这就好比在日本侵略者的铁蹄践踏中国之际，中国的知识分子歌颂日本人是“古之民也”，日本官员是“古之吏也”，日本天皇是“古之朝也”；于是，日本军国主义“威眇天下”。真不知荀况这番颂秦，发生在秦军坑卒之前，还是之后。但不管是之前之后，作为深受暴秦荼毒的赵国子民，说出这番谀词，都是极其丢人现眼的。尤其是比之于赵相平原君的宁为玉碎、不为瓦全，荀况的谀秦很难让人不鄙视。


    有其师，必有其徒。有荀况的谀秦在前，此后他那两个学生楚人李斯、韩人韩非的相继仕秦，也就顺理成章。或者说，荀况强调君权威严的君本主义学说，为李斯、韩非放弃自己尊严向秦王嬴政下跪磕头，扫除了可能会有心理障碍。于是乎，就有了本文开头所说的韩非写给秦王嬴政的那番叩首之言：“臣闻不知而言不智，知而不言不忠，为人臣不忠当死，言而不当亦当死。虽然，臣愿悉言所闻，唯大王裁其罪。”


    985'
  merge: -1
  img_proc: true
- pgno: 985
  md: '有关韩非其人，司马迁如此写道：


    韩非者，韩之诸公子也。喜刑名法术之学，而其归本于黄老。非为人口吃，不能道说，而善著书。与李斯俱事荀卿，斯自以为不如非。一《史记•老子韩非列传》


    在韩非与李斯的同门相残之中，韩非假若没有口吃，李斯恐怕不是其对手。当然，汉儒司马迁毕竟没有先秦诸子那样的学养，会把韩非的“喜刑名法术之学”，“归本于黄老”。反过来说，司马迁假如没有如此这般的糊涂，也不会将韩非与老子并列为传。因为事实上，韩非虽然在著述中劫持过老子学说，但韩非的帝王术在骨子里却是既继承了商鞅的军国主义主义的霸术理论，又师承了荀况的君本主义的威君学说。否则，韩非的著述，不会得到嬴政的如此赏识。


    986'
  merge: -1
  img_proc: true
- pgno: 986
  md: '人或传其书至秦。秦王见孤愤、五蠹之书，曰：“嗟乎，寡人得见此人与之游，死不恨矣！”－《史记•老子韩非列传》


    在这之前：


    非见韩之削弱，数以书谏韩王，韩王不能用。于是韩非疾治国不务修明其法制，执势以御其臣下，富国强兵以求人任贤，反举淫涬之蠹而加之于功实之上。以为儒者用文乱法，而侠者以武犯禁。宽则宠名誉之人，急则用介胃之士。－《史记•老子韩非列传》


    韩王的不能用韩非之说，既可说是韩王胸无一统天下之大志，也可说是韩非的学说实在太可怕。说儒者“用文乱法”，说侠者“以武犯禁”，还有“宽则宠名誉之人，急则用介胃之士”，在在处处，韩非都是在替君王着想。儒者侠客，名士武士，全都像是君王脚下的蚂蚁一般，韩非教君王想怎么踩就


    987'
  merge: -1
  img_proc: true
- pgno: 987
  md: '怎么踩。这确实很合乎想称霸天下的秦国君主口胃，但未必会让中原诸侯如韩王者愿意采纳。


    # 如果老板逼你做错事，怎么办？


    如果领导逼你做错事，如果你遇到类似情况，会怎么做？换句话说，做不利于消费者和客户的事，甚至是违法之事时，你如何应对？而且如果你的老板明确表示让你参与其中，并且这和你的奖金、升职甚至是工作本身挂钩，你会怎么做？


    人们很容易认为这些情况只能二选一：要么拒绝并等着承担相应后果；要么照办。但其实这些情况是灰色地带，我的核心指导原则是：面对棘手问题'
  merge: -1
  img_proc: true
- pgno: 988
  md: '时，要以管理者的心态处理它，用人的心态解决它。这个方法可以帮助你避免陷入二选一的困境。


    碰到自己可能得做些错事时，请遵循以下方法：


    # 确保你真的了解情况。


    单位的行为明显不对，但其他情况可能更微妙复杂。所以一定要自问以下问题：消费者真的被伤害了吗？该做法真的是已经不符合行业标准或明显偏离最佳实践？你所注意的做法是如何违反道德、消费者利益甚至是法律的？是否还有其他的角度看待这一问题———也就是认为这一做法还算可以或者对顾客或者他人有好处。


    # 提出并回答这些问题将有两个好处。


    第一，你会更明白你最初的判断正确与否。第二，如果你断定这一做法明显错误，现在你也将有充分


    989'
  merge: -1
  img_proc: true
- pgno: 989
  md: '的理由向别人说明想法，并让他们认真考虑你的担忧。如果你彻底想过整个情况，也比较容易坚持立场。


    # 如果可以的话，与他人商量。


    换句话说，不要做一个孤军奋战的天才。试着在组织里找一个见多识广又能保守秘密的人，和他讨论你担心的事情。先解释你的证据和逻辑，然后询问对方你是否遗漏了什么，或是还有其他观点。如果经过这一系列步骤，整件事看上去还是很有问题，就看看你能从中学到什么，你需要了解你老板或者更高层领导支持这一行为的原因。如果你想有效地说服别人，你需要知道他们的立场。而且在行动之前，你同样需要了解前方是否有可以避开的雷区。


    # 做一个简单的决策树。'
  merge: -1
  img_proc: true
- pgno: 990
  md: '在这些情景中你很容易陷入情绪陷阱。对自己所处的困境感到愤怒、受威胁、焦虑甚至害怕，但此时你仍需要保持客观。你可以在一张白纸上列出你的选择，写下每个选择可能带来的结果。如果你揭发一切，可能有什么后果，可能性有多大？如果你一切照办，你需要承担什么风险？你需要真正关注的是概率低但风险高的情况——比如你可能被起诉或者被调查。简而言之，一个简单的决策树可以多少给你一些关于情势走向的客观判断，帮你想明白你的选择，就像你考虑其他管理问题一样。


    # 创造性思考与务实性思考并行。


    当有人告诉优秀的管理者只有 A 或 B 选项时，他们常常会问 C 或 D 怎么样？优秀的管理者面对问题时既保持创意又很乐观。他们相信一定有更好的方法并愿意努力找到它。所以不妨问问自己，是否有不触犯令道德或法律的前提下，能够帮助老板实现目'
  merge: -1
  img_proc: true
- pgno: 991
  md: '标的方法。你可能会在自己也意想不到的情况下，将老板和自己拉出困境。


    考虑和老板好好谈谈。这个方法会出现在大多数决策树上，但这并不是个容易的决定。一旦出错将很可能影响你的职业发展。为了提高成功几率，你需要为老板想好替代方案，并要很巧妙地提出这些问题。而且，你可能要委婉一些，告诉别人他们所做之事违反道德，通常听起来更像指责而不是讨论。更好的提问方式是：我认为这么做可能会面临一些严重的法律风险；我们所做之事可能与客户或政府的想法背道而弛；或者是从长远看来，这会给我们带来不良影响，影响我们未来的发展。换句话说，试着把你的担忧描述成实际的、紧急的管理问题。


    面对这些艰难处境时，保持实际非常重要。即使你遵循了以上五条原则——换句话说，即使你以管理者的心态处理以上情况——你可能还是找不到解决方法。这时候，你需要回到单纯为人的立场来面对'
  merge: -1
  img_proc: true
- pgno: 992
  md: '艰难的决定。你需要后退一步，扪心自问是否可以忍受自己现在的做事方式，又或者这已超过你的限度。这时你就该准备更新你的简历了。虽然这意味着你可能遭受冷嘲热讽甚至失去工作，但是至少你风骨犹在。


    # 如何对待领导的批评'
  merge: -1
  img_proc: true
- pgno: 993
  md: '# 首先，挨批评时要沉着冷静。


    不管是因为什么原因，在遭受批评之后，沉着冷静是第一要务。面对批评，人的第一反应往往是情绪激动，并试图为自己的过失寻求开脱和辩解，特别是在受到误解时，然而在情绪激动时的辩解多数会转成无谓争吵，跟上司吵架显然是不明智的。你的激动会强化对方的情绪激动，而你的冷静可能会在一定程度上平息对方的怒气。让批评你的上司平静下来，对你是有利的。也只有冷静，才能让自己在此事件中的表现做出及时、客观的自我评价。


    # 其次，受到批评时不能当项顶撞。


    你跟上司纠缠、争辩，希望弄个一清二楚，这是没有必要。确有冤情，确有误解怎么办？可找合适的时间表白一下，点到为止。即使领导没有为你“平反昭雪”也完全用不着纠缠不休。这种斤斤计较型的部下，是让领导头疼的。如果你的目的仅仅是为'
  merge: -1
  img_proc: true
- pgno: 994
  md: '了不受批评，当然可以“寸土必争”“寸理不让”。可是，一个把领导搞得筋疲力尽的人，又何晋开呢？


    # 最后，挨批评后注意沟通。


    受到上司的训斥以后心情极度糟糕，如果回到自己的部门后对同事和下属乱发脾气，他们只能对你敬而远之。如果回到家里也对妻子乱发一通脾气，妻子也受不了的。合理的方法是回到自己的部门后把事情来龙去脉告诉同事，得到他们的理解和支持，有可能的话让同事们把事情的经过和原因再传达到领导那里，事情就好解决多了，也可以找家人讲一讲，让家人分担一下自己的压力。


    总之，挨批评终归不是什么好的事情，在被领导批评完了以后要认真地想想怎么样才能把工作做好，然后努力地去实行。即使最后的工作效果未必如领导当初要求的那样好，但有时你表现出来的知错就'
  merge: -1
  img_proc: true
- pgno: 995
  md: '改，并想 “戴罪之功” 的态度就能感动曾经对你发过火的领导。如果再取得不错的业绩的话，就更容 易得到领导的原谅了。如果你在单位里经常挨批 评，经常有人给你气受，那就要想想到底是单位其
    他人都跟自己过不去，还是自己与人交往的方式和 方法不对头，或者是自己太敏感了。自己平时做什 么事会使人际关系紧张，做什么事又会使人际关系 融洽？总结经验后运用到生活中去，相信会有一
    个改观的。


    # 做错事情不敢和领导说怎么办？


    有个小伙伴说：“我经常做错了事情因为怕被批 评，不敢马上跟领导说，结果就拖到领导发现了再 来质问我…”。职场中做错了事情，明明知道应该主'
  merge: -1
  img_proc: true
- pgno: 996
  md: '动和领导说，但就是没有和领导说，结果一直拖到了领导发现，最后小错竟然变成了大错。


    为什么做错了事情不敢和领导说？


    # 001 逃避心理


    人都是自恋的，主动去承认自己错了这件事会让我们觉得自己真的能力不行，会打击到我们的自恋，这个时候就会产生逃避心理，似乎只要不说这个错误就不存在了一样。


    # 002 侥幸心理


    基于逃避心理的深处还会存在一种侥幸心理：“万一领导没发现呢？”


    # 003 内心害怕


    害怕承担做错事的后果，如果不承认，至少现在可以不用想这个问题。


    那不敢说就没事了吗？当然不是，事实证明，不敢说自己做错了事情这件事本身就是个错误，再加上之前所犯的错误，其实是错上加错。这件事情被领'
  merge: -1
  img_proc: true
- pgno: 997
  md: '导知道了后不仅会为做错事情生气，更会因为你瞒错不报的这种行为恼火，同时也可能会因为你瞒错不报而导致失去了最佳补救机会，从而酿成大错。


    那么，职场中做错了事情到底应该怎么办？


    **001 首先，分析错误，看看这个错误自己是能补救或解决。**如果能那么先行补救或解决。不过这里有个前提，就是需要对自己 的能力进行正确的预估，千万不能以为自己可以解决，结果根本解决不了反而浪费甚至错过了解决问题的时间。


    **002 若是错误自己可以解决，那么就先行解决，解决了之后还是否需要告诉领导呢？**我的答案是：分情况。


    如果你的领导是容错度比较高的领导，那么是可以告诉领导的，当然方式上可以做的更好一些。比如你可以主动向领导汇报本次工作完成情况，然后可以顺带提出自己犯的错误，并且马上提出自己所采'
  merge: -1
  img_proc: true
- pgno: 998
  md: '用的解决方法，更重要的是你还可以写出若其他同时遇到同类型的错误该如何处理的解决方案。这个时候，你其实不是在承认错误，而是在邀功好么。但如果你的领导容错度比较低，同时你的错误又不会完全不会给公司带来不好看的影响，那么不向领导汇报也是没问题的。


    003 若是错误不能自行解决，那么一定要尽快向领导承认错误，并且向领导请求帮助。当然，这里不能仅仅是向领导请求帮助，你自己也要做出解决方案，最好能有几个解决方案，让领导去做选择或者判断，尽量把领导帮忙的成本降到最低。当然，这么做的前提是有足够的时间去做解决方案，若时间不够，还是以解决问题为第一要务。即便时间不够，最好也可以按照这个流程去进行思考，因为这个过程也是锻炼自己解决问题能力的一种有效的方式。


    最后，也是最最重要的，那就是你能发现并承认自己的错误，并且有改进的意愿和行动，这才是一切的 前提和基础。'
  merge: -1
  img_proc: true
- pgno: 999
  md: '# 面对职场中各类人的必杀技


    # 对付职场小人领导的方法之 “探人隐私”者


    人的成长伴随着众多丰富复杂的经历，其中不乏一些不愿别人知晓，尤其是不愿陌生人知晓的东西，这就是大家通常所说的隐私。在每个人的内心深处，这就是一块不希望被人侵犯的领地。可是有些人出于无知，或者出于猎奇，或者出于某些不可告人的目的……每次和你见面，都要问你
    “年龄几何？” “收入多少？” “夫妻感情如何？”等等让人不愿启齿甚至厌恶回答的话题。这种人虽然伶牙利'
  merge: -1
  img_proc: true
- pgno: 1000
  md: '齿，巧舌如簧，但却不知谈话的要领忌讳。一般来说，一个尊重他人的人，如果知道某某事情是他人隐私，便不会去问。反过来说，知道是他人隐私，偏偏去询问者，便是不懂得尊重他人的人。这样的人很可能会传播是非，很可能会三人成虎、蜚短流长。


    # 破敌必杀技：答非所问。


    遇到探人隐私者，千万不能傻乎乎的有一说一，有二说二，“逢人且说三分话，不可全抛一片心”，这句话对朋友当然不行，但那些探人私隐者就非常适用。答非所问是对待探人隐私者最好的法子。这样既能不泄露自己的隐私，又能不坚硬的搞坏两人关系。如果他问你“奖金多少”，你就说“不比别人多”。如果他问你“谁是你晋级的后台”，你就说“全托你的福”。如果他问你“如何追求女友的”，你就说“如果你感兴趣，待我以后详细告诉'
  merge: -1
  img_proc: true
- pgno: 1001
  md: '你”。总之，对于对方的提问，不是不答，但答非所问。


    # # “唉声叹气”者


    俗话说：人生在世，不如意事十之八九。有些对前途悲观的人、谈话以我为主的人，往往将他们的不幸、苦恼和忧虑当作谈话的主题。他们不断地大诉苦水，接连地唉声叹气，颇有点鲁迅笔下“祥林嫂”的风采，这样的表现，使交谈的人听也不是，不听也不是。当然有些苦水或许就真的是一江苦水，让人顿生共鸣抑或同情恻隐之心，但对于大多数情况，我们如果仔细分析一下唉声叹气者所说的不如意之事，就会知道，这些事实其实非常普遍，并不那么凄惨，有些甚至自己也遇到过甚至正在经历着，但唉声叹气者却将自己的境遇说得非常非常地严重，恨不得前无古人后无来者!


    # 破敌必杀技：注入活力。'
  merge: -1
  img_proc: true
- pgno: 1002
  md: '与“祥林嫂”这样的人进行交流，要给其注入活力。在唉声叹气者的心里，他们大多并不认为自己的能力差、抱负小，相反，在其内心深处，他们强烈认为自己有着非同一般的水平和不同凡响的天赋，并非常渴望别人尤其是领导的肯定和赞赏。所以与他们交流，千万不要吝啬自己的肯定和赞赏，应该不失时机的肯定他们的特长，表扬他们的功绩，给其注入蓬勃发展的活力。这样的话，他们会对你非常亲近，对你感激不尽。


    # “道人是非”者


    “来说是非者，便是是非人”。千万不要以为这些把他人是非告诉你的人就是你的朋友。道人是非者，既然能在你面前说他人的坏处，自然也会在他人面前说你的坏处。他们长于乐于道人是非，一方面是妒心过盛的原因，他们心里往往有酸葡萄心理，巴不得他人越来越倒霉，越来越困窘，另一方'
  merge: -1
  img_proc: true
- pgno: 1003
  md: '面恐怕还有自己心中的小算盘。与这类人交谈，切不可推心置腹。


    # 破敌必杀技：哼哈而过。


    面对这种人，我们要像隆冬的天气，尽量冷！对他说的任何是非话题都作出冷淡地反应，久而久之，是非人自然遇“冷”而返，知“冷”而退。对这种人，没有必得罪。他说的是非，不要赞同，也不要斩钉截铁的加以否定，否则你就是参与者了。与其言语交流，哼哼哈哈，不失为一种好办法。因为“哼”、“哈”是一种模糊语言，既会让道人是非者感受到你的成熟，又能让他觉得这项话题无法再交流下去，知趣而中止谈话，或者使谈话朝着健康方向发展。有些时候甚至可以说“哼哈”是一种不可忽视的处世学问。


    # “喋喋不休”者'
  merge: -1
  img_proc: true
- pgno: 1004
  md: '人与人交谈，最怕那种长篇大论跟你说个没完没了的人。有些人说得很多，尤其是说得多又说不。他们能一口气谈论一个上午，他们能用一个下午的时间谈论古今中外。他们似乎不但上知天文，下知地理，政治、经济、军事、文化甚至男女情事也能谈。眉飞色舞，滔滔不绝。


    # 破敌必杀技：巧妙中断。


    对喋喋不休者，万不能和他一起眉飞色舞，滔滔不绝，要学会巧妙提问。面对喋喋不休者，既不要伤及对方感情，又不能委屈自己当他的长期听众，要尽量让他少说，最好能不说。巧妙的提问来中断应该是最好的办法，一是根据他说的话题提问一些他不
    可能回答的难题，比如 “导弹的燃料分子式是什么?” “《水浒传》这本书里一共提到多少男的，多少女的?”等等。二是提问一些与当前话题无关的问题，如 “打扰一下，现在几点了?”
    “你的眼镜很好看，戴得舒服吗?”等等。让他不知怎么回答或一听'
  merge: -1
  img_proc: true
- pgno: 1005
  md: '就知道你的回答是故意想中断他的谈后。这样一来，他不得不少说几句或中断谈话，你也可以多说几句，他自己或许也能知道少讲停讲。这样一来，你也能腾出时间来干一些有益的事。


    # “咄咄说教”者


    “咄咄说教”者和上面的“喋喋不休”者有类似的地方，但还是有一定的区别。有些人喜欢对他人“谆谆教诲”。在他说的十句话中，你完全可以找出“你应该”、“你必须”、“你不能”之类的词语高达七八处。这种人往往自以为是，居高临下，盛气凌人，唯我独尊。在他们眼里，众人都是无知的幼儿，只有他是博学的先知圣人。和“喋喋不休”者不同，“嗦嗦说教”者虽然令人生厌，但对你并非全无益处。能咄咄说教者往往多少有一两刷子，你可以吸取其中有意的地方，学习提高。另外认认真真地倾听，会使他觉得心理满足，对增进情谊有好处。'
  merge: -1
  img_proc: true
- pgno: 1006
  md: '# 破敌必杀技：慎重聆听。


    和他们交流，要慎重聆听。只要你没有十万火急工作和事情，不妨静下心来，听一听，记一记。适时地重复一两句他说的话语，或者就某个问题询问一两句，交流一下看法。这样你或多或少会获得一些收获，得到一些益处。


    # “自我炫耀”者


    有些人见到他人，张口闭口就是 我人缘好，我能耐大。自己明明是平民，偏偏说自己是官，自己明明是科长，非要说是局长。听者都觉得不好意思，他却不知羞耻。自我炫耀者是自卑者和自负者的共同体。这类人一般外强中干，其“吹牛”的目的只不过是为了引起大家对他的关注、羡慕，以满足自己的虚荣心。这种胡乱吹嘘给人一种巧言令色、华而不实之感。'
  merge: -1
  img_proc: true
- pgno: 1007
  md: '# 破敌必杀技：幽默风趣。


    和他们进行交流，正确的法子是用幽默风趣的话语作答。他嘴上说是局长，你知道他是科长也不必和他叫真，对他说的大话，你不能加以肯定，也没有必要加以驳斥，事实上他内心也完全知道自己不是局长。幽默作答，似是而非，模模糊糊，嘻嘻哈哈而过。


    # "灭人志气"者


    有些人话语辛辣尖锐。从他嘴里说出的话，要么像一盆盆的冰水，不顾你是否接受，硬朝你头上泼去，要么像一个个大火盆，把你架在那里死烤。那个干劲，似乎不把你心头的自信火种毁灭就不罢休。这种人往往经历一些失败、万念俱灭，又把你瞧得一无是处、绝不如他，还认定自己做不到，他人也做不到，往往也能言善辩，但非常可惜，这样'
  merge: -1
  img_proc: true
- pgno: 1008
  md: '的人往往“茕茕子立、形影相吊”，周围人敬而远之。


    # 破敌必杀技：攻其痛处。


    被这种人攻击，一味顺承，会使他变本加厉，必须果断出击。要抓住机会，攻其痛处。那就是他当前说话的漏洞、逻辑错误等或者他历史上的失败、无能、可笑之处。


    # 与各级别交往要有自己的手腕


    # 一、职场相处要有“边界感”'
  merge: -1
  img_proc: true
- pgno: 1009
  md: '天生人是叫他们孤独的，一个个该各归各，老死不相往来。身体里容不下的东西，或消化，或排泄，是个人的事;为什么心里容不下的情感，要找同伴来分摊?聚在一起，动不动自己冒犯人，或者人开罪自己，好像一只只刺猬，只好保持着彼此间的距离，要亲密团结，不是你刺痛我的肉，就是我擦破你的皮。钱钟书这个说法应用在职场是非常恰当的。很多的人都想在职场中和同事很好的相处，但是这个问题却总是让很多职场中人苦恼，尤其是新人。其实同事关系就是同事关系，只有极少数有可能成为朋友。而且有调查显示，工作中，大家往往对陌生人的包容度更高。


    # ## 二、 对上级: 要执行，不要解释


    工作中最主要的一点就是和领导搞好关系，因为这可能直接关系到每个人的升迁和收入。和领导搞好关系的核心问题就是要增加自己的执行力。如果你在接到问题先讲困难的行为，让领导觉得你不配合'
  merge: -1
  img_proc: true
- pgno: 1010
  md: '他的工作，挨批是肯定了。接到任务，一定先要尽力去做，等事情完成后再告知领导完成得有多么不容易，不要一接到工作就强调困难，这样很容易让领导误以为你是怠工或不配合他的工作。


    # 三、 对平级：要有边界感


    和同事相处一定要建立边界感。同事就是同事，只有极少部分同事才能成为朋友，大多数同事都只是一种协作关系。不要对同事报以太高的期望，否则，期望越高往往就越是失望。其实在生活中，大家对陌生人的包容度更高，同事若走得太近了，反倒不利于工作开展。


    # 四、 对下级：多讨论，少指责


    生活中，大多有一定职权的领导对自己的决策都容不得下级有任何异议，这其实不是正常的同事关系。像小李的经理当着所有员工的面批评小李，这'
  merge: -1
  img_proc: true
- pgno: 1011
  md: '种作法也很容易让小李产生挫折感，不利于员工在以后的工作中发挥主观能动性。


    对待下级，应该多以指导为主，多和员工讨论，而不是粗暴地命令他该怎样，要怎样，更要少些批评和指责，尤其是当众批评或指责。因为我们现在属于社会的转型期，加班工作基本是一个常态。这依然成为了这个时代的特点，可以说每个人的压力都很大，聪明的领导要学会让员工释放压力，而不是给员工施压。只有让员工能从工作中得到快乐和满足其成就感，员工才可能为公司创造出更大的价值。


    # ## 对马屁精的整治


    职场中因宠信马屁精造成内部不和的却屡见不鲜。在拍马屁的时候，除了吹嘘自己，马屁精还得贬低别人，否则怎显得他鹤立鸡群?听得多了，再加上无


    1012'
  merge: -1
