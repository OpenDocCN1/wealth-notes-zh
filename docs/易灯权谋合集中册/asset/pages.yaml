- pgno: 701
  md: '可爱，当时的皇后听说这一喜讯后，前去祝贺，皇后刚走，武则天就听到高宗要来的消息，她顿时觉得：千裁难逢的好时机终于来到了。于是，她把手伸进被窝，狠狠地掐住女儿的脖子，直到掐死，然后再把被子盖上。然后若无其事地出去迎接高宗进来。等高宗打开被子想看女儿时，却发现女儿已经死了。武则天故作吃惊，


    大声悲号。高宗忙问左右的侍女，都说皇后刚刚来过，高宗愤怒地说：“皇后杀了我的女儿。”武则天又乘机历数皇后的罪过，皇后真是有口难辨了。'
  merge: -1
  img_proc: true
- pgno: 702
  md: '从此，高宗就下了决心，废掉原来的皇后，立武则天为皇后。


    就这样，武则天踩着儿女的尸体，沿着亲生骨肉销成的道路，一步一步地，残忍而坚强地登上了皇帝宝座。


    由此看来，官场是不讲任何亲情的，权力大于一切，为了夺得权利，即使粉身碎骨，或者骨肉相残也在所不惜，难怪西方皇帝拿破仑言：“政治不具肝肠。”


    而马基雅维里在《君王论》中也说道：


    > “为了达到目的，应该不择手段，应该具有豺狼和狮子一样的残忍。”


    真可谓一语道破天机。'
