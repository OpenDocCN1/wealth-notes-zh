- pgno: 112
  md: '出一副仁者慈悲的姿态（这是迫于社会交往或自身牟利的本能）所以，政治权术始终无法摆脱道德上的厄运，阴险狡诈、卑鄙无耻之类的评价形影相随。


    故而，为人君者，必须要擅于伪装。这种伪装依马氏而言，就是将道德脱离于政治，其并不是一味鄙弃道德，而是力求君主的一切政治行为不能用道德来评价。


    # 三、是狐狸，还是狮子？


    马基雅维利在讲道德剥离了政治之后，探讨了何以成就强有力的君主，其遭到后人诟病的一个焦点即是提出——“君主必须是一头狐狸以便认识陷阱，同时又必须是一头狮子，以便使豺狼惊骇。”（《君主论》十八章）其将工于心计的形象喻为“深知怎样做的狐狸”——这是马氏权术思想的精华。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '“狐狸”在此的形象是不用信守诺言（马氏在《君主论》里否定传统道德主要是讨论君主如何守信的问题）。其认为守信无疑是值得赞许的，但经验表明，那些曾经建立了丰功伟绩的君主们并不遵守诺言，而且最懂得运用阴谋诡计，最后往往是赢家。以教皇亚历山大六世，“除了欺骗人们之外，既不曾做过任何其他事情，也从来不曾梦想过任何其他事情，但他总是找到了上当受骗的货色。”


    但仅仅做狐狸还不够，君主能者必须既会善骗，又能狠斗，要像狮子一样在斗争时残酷无情。简而言之，马氏的权术就是君主应当是狮子加狐狸。


    何以马基雅维利以“狐狸+狮子”的形象来寻求其理想中的君主？观乎其所在的时代背景我们可以略知一二，意大利的统一依赖于强


    114'
