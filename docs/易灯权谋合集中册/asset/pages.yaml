  md: '# 给皇帝提出两条方案


    四十五年，云南粮储道海宁诉侍尧贪纵营私状，命尚书和珅、侍郎喀宁阿按治。侍尧自承得道府以下贿赂，不讳，上震怒，谕曰：“侍尧身为大学士，历任总督，负恩婪索，朕梦想所不到！”夺官，逮诣京师。和珅等奏拟斩监候，夺爵以授其弟奉尧。又下大学士九卿议，改斩决，上心欲宽之，复下各省督抚议。各督抚多请照初议定罪，独江苏巡抚闵鹗元迎上意，奏：“侍尧历任封疆，干力有为。请用议勤议能之例，宽其一线。”上乃下诏，谓：“罪疑惟轻，朕不为已甚。”改斩监候。


    # 《清史稿•卷三百二十三•列传一百十》


    在清代，《大清律例》中没有“贪污罪”这个罪名，与现代贪污罪相似的，是“监守自盗仓库钱粮”。本来根据《大清律例》的规定，犯这种罪，是赃至 40 两，斩。但是在司'
  merge: -1
  img_proc: true
- pgno: 462
  md: '法实践中，随着生活水平的提高和工资物价的上涨，贪官们贪污的数额也越来越多，如果 40 两就斩的话，恐怕没几个官员能活着了。所以，雍正三年，针对这一律条又附加了一个“例”，即“凡侵盗钱粮入己，自
    1000 两以下，仍照监守自盗律拟斩，准徒五年；数满 1000 两以上者，拟斩监候，秋后处决，遇赦不准援免。”也就是说，贪污 1000 两以下的，可以用 5
    年徒刑抵死罪，1000 两以上的，判处斩监候。李侍尧以金换银 3300 两，属于监守自盗，就这一条就够得上斩监候了。


    那么对于贿赂罪呢，《大清律例》对于贿赂罪的处罚要严于贪污罪。清代对于贿赂罪分为“枉法赃”和“不枉法赃”两种，也就是说，如果官员收受贿赂并为对方谋取利益了，那就是“枉法赃”，赃至
    80 两就是死罪，绞刑；如果只收礼而没有为对方谋取利益，就是“不枉法赃”，赃至 120 两'
  merge: -1
  img_proc: true
- pgno: 463
  md: '以上处绞刑。但在司法实践中，量刑的金额也加倍了，也就是枉法赃超过 **80** 两，不枉法赃超过 **240** 两才处绞刑。如果依法治罪，李侍尧贪贿金额总共
    **35000** 两，死多少次都够了。


    和珅有意置李侍尧于死地,可他清楚乾隆是十分爱惜人才的，于是拿出两种方案，最终和珅上奏：“拟斩监候,夺其爵以授其弟奉尧。。。后又建议将李侍尧“斩立决”。乾隆有免李侍尧一死。在将李侍尧交大学士、九卿会审的时候，把和珅所拟的“斩监候”的判决意见一并交给大家讨论，其实也就是暗示大家：就按照和珅的意见判吧！


    如何给领导提意见?牢记“一不”“二多”原则，领导高看一眼！在工作中，领导的决策安排有问题，很常见，但是我们该如何给领导提意见呢？有的人干脆就不提，领导怎么说我就怎么做，最后出了事情反倒自己背黑锅，领导反正'
  merge: -1
  img_proc: true
- pgno: 464
  md: 是不会背稿的；还有的人脾气比较暴，跟领导对着干，遇到比较心胸开阔，不计较的领导人还好说，遇到小心眼的领导，脸上挂不住，就暗暗给你使绊子，穿小鞋，这就难办了。很多说话无所顾忌的人，在朋友面前还沾沾自喜地炫耀自己和领导又公开吵嘴了。给领导提意见，一个别说，两个多说，领导不仅听得进，还得感谢你。"不一"指的是：不要反对领导的方案。即使领导的方案听起来非常不靠谱，有很多明显的漏洞，如果你当众反对领导的意见，然后给出了充足的理由，这不是当众给领导打脸吗，其实我们真正的目的并不是要让领导难堪，而是让领导不要在错误的方案上继续走下去，但是不一定非要用否定方案的方式来表达，该怎么说呢？可以遵循"二多"原则。"二多"原则的第一个"多"是事"多肯定领导正确的部分"。领导当出了一个方案以后，里面肯定有一些事值得借鉴，有一些是不太可行的，这
  merge: -1
  img_proc: true
- pgno: 465
  md: 时候呢我们既然不能完全的否定他的方案，就要肯定他的方案当中哪些是比较好的，单独的把学习好的内容给摘出来，因为无论是你的方案还是他的方案，好的东西都是可以用的，所以先肯定领导正确的部分，让他不会一开始就会有排
    斥感，不会丢面子。第二个"多"是"多说这样做可能会更好"。意思是领导的很好，不过有些部分这么做可能会更好， 并没有否认领导的说法，但同时又说出了可能更加好一点的
    行动方案，由于刚才也指出了领导里面特别好的部分，领导 好的地方和你认为还有哪些可以更好的地方结合在一起，就 显得是你和领导一起想出的方案，而不是否决领导的方案，
    最后用你的方案。大家都知道，狗毛一定要顺着毛摸，如果 你反着摸是会被咬的。为人处事也是一样，首先要顺着别人 的想法，顺着别人的方案，让别人舒服了，然后再指出更好
    的方案，这样提意见，不仅顾全领导的面子，而且成功推销
