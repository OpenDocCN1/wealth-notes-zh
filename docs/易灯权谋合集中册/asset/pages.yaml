- pgno: 1100
  md: '# ## 上中下三策轻松解决职场甩锅


    职场中总会有背黑锅的事情出现，同事甩的锅，老板甩的锅，让人防不胜防，尤其是对于职场菜鸟来说，被甩锅更是家常便饭，那我们该在职场中如何避免被甩锅，有效的保护自己呢？


    我在职场中就遇到过这样的事情，**一个是上司甩锅，一个是同事甩锅**。


    职场中我们多多少少会遇到领导和同事的甩锅，那么我们该如何保护自己呢？


    # ## 如何应对同事甩锅


    对于同事的甩锅，我们可以巧妙的拒绝，这里分为上、中、下三策。


    **上策：以领导为借口，挡回去**'
  merge: -1
  img_proc: true
- pgno: 1101
  md: '你可以说“哎呀，最近领导给了我一 项紧急任务，我这几天都加班忙这个，实 在抽不出时间，要不等我忙好了，我再给 你看看？”拿出领导来做挡箭牌，即满足 了对方的面子，又给对方台阶下，是一种
    比较高情商的拒绝方式。


    # **中策：先婉拒，然后再提出帮一小部分忙**


    婉拒对方，比如你可以说，“我最近很忙，我看 XX 比较轻松的，你可以找他试试看”，然后又表示实 在不好意思，自己可以挤出一点时间，帮他做点小 事情，（这种事情必须是边角料，不对整个项目构
    成决定性影响），这样既避免了对让方失望，又给 足了对方面子，做足人情。


    # **下策：直接拒绝**


    如果对方知道你 不忙，就想让你帮他做，你可以说“我自己能力有限，承担不了那么重的任务，希望还是找别人看看”。也许对方会不爽，但职场中保 护自己是第一位的，没有所谓的亲密战友，大家出卖自己的劳动力换钱而已，没有得罪谁不得罪谁的问题，
    如果一个人一有锅就想着让别人背，我觉得这'
  merge: -1
  img_proc: true
- pgno: 1102
  md: '个人人品本身就有问题，不值得交往，敬而远之比较好。

    但有时候同事的锅我们不得不接，因为同一个团队，有些事情的确很难分清谁负全责，那又该如何保护自己呢？


    这个时候最好是走邮件，比如你可以跟他说：“为了避免口头遗漏，你发一份邮件给我吧，项目的目前进展，以及以前相关的材料，这样我好更快接手，最后也抄送一下领导，让他知道这件事，这样领导也知道我手头上任务有哪些”。如果只是协助对方，要让对方在邮件中写清楚需要协助内容，并抄送领导，总是意思就是如果不得不接，一定要让领导知晓，不能自己默默做了，领导还不知道。


    1103'
  merge: -1
  img_proc: true
- pgno: 1103
  md: '# 如何应对领导甩锅


    一般来说，作为下属，对一些无关紧要的小锅，我们是可以主动去背的，如果领导有良心，会看在眼里，记在心里，在其他地方给我们找补回来，比如年终奖多发点，绩效奖金多给点，提成丰厚点。


    但如果遇到那种领导，功劳自己独享，背锅扔给下属，遇到这样的领导，我觉得就不要在他手底下干了吧，良禽择木而栖，这样的领导也干不长，一个优秀的团队领导者必然是责任自己承担，好处团队共享。


    现实中还有一部分人由于经济的压力，以及更好的去处没有找到，只能在这种领导手下接着干，那也有办法，就是凡事做好记录，尽量走邮件，聊天记录保存，会议谈话录音，这样等大领导问责下来，也可以直接发给大领导，写一份言辞恳切的邮件，邮件中首先承认自己工作没有做好，同时把自己被甩锅的过程说一下，然后表示自己愿意承担项目没做好的责任，最后把相关邮件、谈话记录、录音作'
  merge: -1
  img_proc: true
- pgno: 1104
  md: '为附件一起发送，这样大老板就知道事情的来龙去脉了。


    像那种功劳自己占，黑锅下属背，不仅团队业绩不好，自己也会干不长，还把自己的职场口碑搞坏了，说不定你忍忍，他比你们都先离开公司。


    职场就是一个小型社会，我们不欺负别人，但也绝不让 人欺负，不要觉得那些人欺负你是为你好，不要觉得那些是命运对你的磨难，他们欺负你，就是觉得你好欺负而已，当你有能力的时候，给我还回去。'
  merge: -1
  img_proc: true
- pgno: 1105
  md: '# 小心上司的这种行为，他在抹杀你的利益


    在职场中，很多人会纠结于一点，就是上司不夸奖自己。


    不知道从何时起，表扬似乎成了一种人人盼望的东西，员工在职场中，仿佛学生在课堂一样，每做一个事情，都希望上司来夸奖你。


    按传统习惯看，有人夸总比没人夸来得好，上司愿意夸你就是看得起你，就是器重你。所以我们一贯觉得，被上司夸奖是一个很有面子的事情，绝对多多益善。


    在从前或许这样，可如今就未必。因为时代在进步，上司的权术更在进步。从前的上司是吝于夸奖的，因为他们有一套做人做事的标准。


    而如今的上司却是唯利是图，他们为了自己的利益，绝对不会节约夸人术。所以现在 的上司夸奖不仅不值钱，有时甚至还是有害的。


    当你遇到问题时，不能用旧时候的技巧直接套用，在职场中，唯有悟透整个道理，才能分析透每个不'
  merge: -1
  img_proc: true
- pgno: 1106
  md: '同的细节。 而面对上司的夸奖时，也同样要冷静以对，看破事实的本质。


    # 1、夸奖是职场中最廉价的 “利益”


    职场是一个利益交换的地方，而利益有很多种。譬如加薪，升职等等。


    而上司能给你的最廉价的 “利益” ，就是口头夸奖，因为这是零成本的，上司只要张张嘴就可以完成。


    但夸奖却是每个职员都梦寐以求的东西，有些人宁可放弃实在利益，只要老板经常夸奖自己就可以。 这是为什么呢？


    有些人始终没弄明白，职场就是个交换利益的场所，你们来打工，老板给你们薪水。很多人以为职场是自己生活的延续，是自己努力工作做事的地方。'
  merge: -1
  img_proc: true
- pgno: 1107
  md: '而一旦你把职场本质理解成为做事，就会出现一个情况，在做完事情后，你会希望别人认同你。如果没人认同，你会以为自己干活干的不好，自己的职场生涯就失败了，而一旦有人夸奖了你，你就觉着满足，仿佛职场生活是成功的。


    但事实上，什么样的职场生活才是成功的？只有你赚到足够的钱，升到一定职务那才可谓成功。


    就算你连续被夸奖了一辈子，却没有人给你加薪，没有人给你升职，这些夸奖又与你何益呢？


    你被人夸几十年，到最后，所有同事都成了你上司，成为那个夸你的人，然后才会明白，自己是真正的失败者。


    # 2、现在的上司没有做事的标准，只有利益的标准。


    从前，要获得上司的夸奖是一件很难的事情，因为那时候，上司有一套自己的做人标准和做事标准。如果没有达到他们所要的程度，是没有人夸你的。正因如此，那时的夸奖才有稀缺意义，是和真正的


    1108'
  merge: -1
  img_proc: true
- pgno: 1108
  md: '职场利益挂钩的。但随着时代进展，现在的上司已经放弃做人做事的标准，他们心中所想的，唯有利益而已。要明确一点，现在老板或上司，都是被利益驱动的，他们是真正唯利是图的人。所以当它们夸奖你时，不再是因为你做得好，而是因为他们有这需要。在如今的职场上，你不能再把夸奖当作对你工作的肯定，只能当成一句闲话听。


    # 3、零成本的奖励就是节约。


    为什么夸奖不再重要呢？


    这必须从上司的利益角度来考虑。对每个上司而言，给下属升职加薪都是有成本的。升职是一件复杂的系统工程，既要把机会留给自己人，又不能让下属对自己产生威胁，这本就很难权衡。所以一些上司不希望乱给下属升职。加薪也是如此，给下属加薪，会让上司承担压力，'
  merge: -1
  img_proc: true
- pgno: 1109
  md: '而处理的不好，还会令部门乱象纷起。


    所以对上司们来说，升职加薪都是有成本付出的，能够不做就不做。但与此同时，他们发觉夸奖是件零成本的事情，只要张嘴就可以。


    之前我们已经说过，现在的上司是完全趋利的，他们已经没有做事做人的标准。当他们发觉夸奖可以节约成本时，自然不会吝啬。


    于是上司们逐渐形成用表扬夸奖来取代利益付出的习惯。当下属做好一件事情时，上司会做的事情就是大肆夸奖一番，从而算已经表彰过了，把真正的利益付出忽略掉。


    而零成本的夸奖，对上司就是种节约，节约就是赚。这是上司心中的利益原则。


    # 4、上司夸你越多，你拿到的就越少。


    正如上面所说，上司的夸奖，是一种零成本的奖励。而上司为什么要进行夸奖呢？他们是基于自身利益的考虑。'
  merge: -1
  img_proc: true
- pgno: 1110
  md: '你得到了夸奖，就得不到别的实质奖励，对上司而言，他们就省进一笔了。


    正因如此，所以在职场里，当上司夸你越多，你拿到的好处就越少。他们早已看透职场的本质，也明白小职员的心理，所以将夸奖当作无本买卖，把有本钱的奖励给隐藏起来。


    每次夸奖你，背后都潜伏着一个真相，那就是你少了本该得到的实质奖励。


    很多人工作能力非常强，也做了许多年，可就是一无所有，既没有很多钱，也没有升职，这就是他们在漫长工作里，始终被上司忽悠。


    被人用好话忽悠，或者被上司用表扬搪塞，本质都是一样的。当你得到虚假空洞的语言时，就会失去真正的利益。


    而在职场里，重要的是实质利益，而不是语言夸奖。任何言辞都是无法积累的，只能随风而散，最多令人高兴几个小时。那么高兴完之后呢？


    只有升职加薪才是最要紧的东西，你拿到实质的好处，它们就跟随着你，把你推上新的平台，这是可


    1111'
  merge: -1
  img_proc: true
- pgno: 1111
  md: '以累积在你的职场人生中的。


    # 5、夸奖应该和利益并行，纯粹的夸奖就代表着利益损失。


    那么，如何分辨上司是在用夸奖搪塞，还是真心欣赏你呢？


    我们不能否认，还是有真心欣赏下属而开口夸奖的人的。但我们必须要分辨清楚，究竟哪个在忽悠我们，那个才是真心对我们好。


    其实很简单，我们用趋利原则就能分辨。如果一个上司真的欣赏你，也是真心夸奖你，那么这并不会影响实质的奖励。


    也就是说，夸奖应该和实质奖励并行联动的。这也非常合乎逻辑，既然上司夸了你，当然也要用实质的东西来表达他的夸奖。


    所以当夸完你后，又给你实实在在的好处，那才是真心实意的好上司。


    而那些张口夸奖，闭口表扬，却连一丁点实质好处'
  merge: -1
  img_proc: true
- pgno: 1112
  md: '都不肯拿的上司，就是拿夸奖当无本买卖的人。真心实意的好上司，他们的夸奖是值钱的，因为有实质利益撑腰。而虚伪的上司，他们的夸奖是廉价的，对他们来说，这不过是最便宜的奖励，是随手可得的。


    而你得到纯粹的夸奖，就意味着利益损失。


    这正是我们所说的，上司夸你越多，你得到的就越少。'
  merge: -1
  img_proc: true
- pgno: 1113
  md: '# # 上司会挑动手下争斗是制衡也是权术


    在中国的职场上，平级官员或者相差半级的干部肯定很多，因为这是各方势力角力博弈的结果。怎么和等级相近的同事相处，成了一种危机术和生存术。而毫无疑问，等级越接近就越有危险。因为高你半级的人会有危机感，怕你随时都可能与他们平起平坐，所以有机会他们就会打击你。而不管高半级还是一级，都是上司，他们给你穿小鞋就危险万分了。而同级的人是必然的敌人，只要你们的上司不是傻瓜，就一定会挑拨手下争斗。


    **1、半级是最小的差距，也是最危险的差距。** 相差半级的情况很多见。很多人升职后，与上司之间只相差半级，却并没有意识到危机来临。或许你升职的幅度并不大，但一切都改变了。你以前的靠山，关照看你的上司，很快就会变成竞争对手。原因很简单，你和他之间，再没有缓冲地带了。你再进一'
  merge: -1
  img_proc: true
- pgno: 1114
  md: 步，就能达到他的位子，这是迎面而来的危险，任何一个上司都会感觉到，绝大部分人的心态都会有变化。一个上司愿意把你当成亲信，是由于你对他没有危险，而在职场上，只有距离差才能让危险减小?简单来说，你和上司之间等级差的越远，你对他的威胁就越小，而这个等级差距，就可被认为是缓冲。上司跟你之间有很大等级差的时候，他当然愿意罩着你，保护你，并且给你资源，甚至拔擢你。可当你们只相差半级时，一切都改变了，他不再信任你，不会再拔擢你，甚至会越来越讨厌你，乃至于暗中打击。因为你们之间没有缓冲，你和他已经直接面对，而在职场上，你们就是竞跑者，虽然你暂时还落后上司半个身位，但相差的不多了。懂么?当这时候，你其实已经是上司的竞争对手，他感到了恐惧。而真正应该恐惧的却是你。因为半级是最小的差距，也是最危险的差距。你失去了从前的靠山和保护伞，反之上司变成了对手，而他还是掌握着实权的，随时都可以压制住你，如果稍不留心，就会被穿上小鞋。一旦你和上司之间就差半级的情
  merge: -1
  img_proc: true
- pgno: 1115
  md: '形发生，应该怎么处理呢？在中国历史上，经常有如此的案例发生。


    在明朝嘉靖年间，严嵩身为首辅把持朝政一手遮天。徐阶乃是一代名臣，最大的志向就是扳倒严嵩，取而代之。当徐阶进入内阁成为次辅后，与严嵩实际只差半级。如果以旁人的目光看，徐阶已经有了和严嵩扳手腕的实力。但官场和职场一样，什么事情都不可以轻率尝试，因为一次失败，可能就会万劫不复。徐阶升任次辅后，对严嵩更加毕恭毕敬，简直比亲信还亲信，万事都由严嵩做主，什么时候都不违逆。整个明朝政坛上下，都指着徐阶脊梁骨骂他是严嵩的狗，可徐阶一意孤行，直至严嵩对他完全放心。这种日子，过去了许多年，徐阶离首辅位子一步之遥，可他比任何时候都要收敛，都要小心细微。直至嘉靖四十年，徐阶从千丝万缕的细节里，找到严嵩的致命弱点，终于突然袭击，将严嵩给彻底扳倒。而到此时，徐阶足足伺候了严嵩十多年，中间不知道经历多少险阻，受到多少指'
  merge: -1
  img_proc: true
- pgno: 1116
  md: '责，可谓卧薪尝胆。那些一再戳徐阶脊梁骨，认为徐阶是卑躬小人的道德君子们，穷极一生也没动严嵩分毫，除了跳脚骂人外毫无贡献。偏偏是处处逢迎严嵩的徐阶，在最后时刻一举扳倒大奸臣，为国为民立下惊世奇功。这就是张居正后来所说“循吏”与“清流”之间的区别。你可以不逢迎上司，也可以与上司对着干，但结果却是你被清扫出局。与己与人没有丝毫的好处。而暂时忍气吞声，却可以再图长远，如果你真的是有大决心大志向的人，又何必在乎区区眼前荣辱呢？


    +   2、同级并列是妥协的产物，是把你们丢进斗兽场，让胜利者脱颖而出。有些人在出事后总喜欢说怎么可以。譬如“上司怎么可以升了我又升他？”譬如“上司怎么可以让我们并列？”而实际上你要明白，重要的并非问怎么可以，也不是问为什么。真正重要的是你怎么做。事情已经发生，问怎么可以，背后指责上司根本于事无补，反而有可能被上司知道你态度后徒添恶感。同级并列的情形，在中国特别'
  merge: -1
  img_proc: true
- pgno: 1117
  md: '多，这是国情和民族文化的体现。同级干部并列往往不是有这个必要，而是高层妥协的产物。每个职场内，只要存在多个势力谱系，就一定会有斗争和妥协。而高层之间往往妥协多过斗争。而妥协的结果就是并级干部的存在。而毫无疑问的，同级并列的两个人，一定是天然死敌。因为你们就是被上司丢进斗兽场的角斗士，只有胜利者才能脱颖而出。同级别列的处理方法，与第一条完全不同。这绝不是隐忍退让的时候，上司既然把你放在这个位子，那就是让你表现自己的，如果你做不到，那就没有更进一步的价值。如果把职场当作一个竞技场，那相互之间的争斗就该发生在平级的人之间。遇到比你低的人只需要压制，遇见比你高的人可以隐忍，而同级之间就是相互竞争。


    3、上司会挑动手下争斗，这是制衡，也是权术。为什么职场内会有这么多纷争呢?其实绝大部分人都没有野心，他们不需要更高的职位，甚至不需要太多的钱。可偏偏是这些人，却相互撕咬在一起，让整'
  merge: -1
  img_proc: true
- pgno: 1118
  md: 个职场变成斗兽场。这是为什么？答案很简单，互相撕咬的人或许没野心，可他们的上司却有。在一个部门里，只需要两个野心勃勃的上司，就足够让几十人甚至上百个人争斗起来。电视剧《天道》里提出强势文化和弱势文化的区别。有野心的上司就是强势文化的代表，他们完全可以遥控指挥，让手下大打出手，而他们的手下，属于弱势文化的代表。没有野心，没有目标，除了受制于上司外什么都做不了。一个没有自己的目标，而无辜的为上司去战斗的人，就是为别人的理想奋斗，是典型的龙套，最后的结果就是被牺牲。对每个人来说，被利用是必然的，而强弱的区别就是在被上司利用的同时，你有没有同时利用上司。(这一点，之后章节将具体谈。)还有一种情况也时常出现，那就是同一个上司却挑逗几个手下自相残杀。这种例子通常发生在下属随时有可能威胁到上司时。这是中国帝王术的杰作。古代时，帝王为了能更好的操纵臣下，就让水火不容的人分列同级，让他们互相竞争互相搏斗。这种上司都相信，只有在竞争中，属下才可以创造
  merge: -1
  img_proc: true
- pgno: 1119
  md: '更好的成绩，而同样也唯有斗争，才能令属下对自己越发的忠诚。总而言之，下属斗则上司心安，下属合则上司心乱，这是古例。你明白了这些原理，就不会再去害怕上司所为，因为他们做的一切，实际都源自于心中的恐惧。当你恐惧上司时，上司也在恐惧着你。


    +   4、韬光养晦，再给予致命一击。一直在说，对上司的态度必须隐忍，让功。等级越近，态度就越要谦卑。如果你真的把上司当作绊脚石，欲除之而后快——我通常不这么建议，因为上司是一种消耗很快的资源，他本身就会在斗争里被消灭，如果没消灭则会带着你升职。如果一定要扳倒上司的话。你必须比别人更加的谦卑，你应该用尽所有的才能来讨好上司，让他对你完全的放心。扳倒上司的心越剧烈，就越不可以表现出来。你需要等，等待是漫长的，可也是有效的。任何一个人，都会在漫长的时间里露出破绽。但即使看到破绽也不要着急，小破绽对你毫无用处。你只有一次出手的机会，一旦'
  merge: -1
  img_proc: true
- pgno: 1120
  md: '失败就再无立锥之地。所以你必须要等到真正的机会出现，到那时才可以出手。出手后就不要留余力，一定要打到底，不管是成是败，都必须一战而胜。纵观中国历史，无数政坛老手都是如此登顶的，可谓中国权术和生存术的精粹。但最后再重复一次，我并不建议所有人都去扳倒上司，绝大部分人没这个能力也不适宜这么做，职场之路并非只有这一条。当然，有许多人就是靠此上位的，如果你已身为上司，可以参照谨记。


    # 如何提高办公室政治智商


    干是不够的，你需要借助政治智商的力量。这里的政治智商不是要你采取不道德的行为或玩弄权术，而是帮助你更敏锐地洞察身边的人与事，从而为自己赢得支持平台。政治直觉、同理心、融入“内'
  merge: -1
  img_proc: true
- pgno: 1121
  md: '圈”，以及政治洞察力是打造政治智商不可或缺的四个技能。


    不管你做什么工作，当你的技术能力达到一定水平之后，能够使事业更上一楼层的就是政治智商了。许多优秀人才正因为缺乏政治智商，得不到关键的支持，而不得不让位于那些深谙此道的同事，眼睁睁看着他们飞黄腾达。


    有时候，政治会涉及到打擦边球，或者要求你做出一些变通。不过更多时候，政治是为你的意见找到一个更好的支持平台，是知道在什么时候，用什么样的方式，对谁说一些什么样的话。问一问自己下面这几个问题：


    +   - 你是不是能够有效地影响别人对你，以及对你的意见的看法？


    +   - 你是否具备化敌为友的能力？'
  merge: -1
  img_proc: true
- pgno: 1122
  md: '+   - 你能否早在结果产生之前就对其加以控制？


    +   - 别人会不会认真听取你的意见？


    +   - 你知道应该在什么时候，用什么合适的方式提出你的意见吗？


    +   - 你有没有融进公司内部交流圈？


    这些政治技巧决定了一个人的职业发展前程，不过这还仅仅是开始。政治是一门相当复杂的学问。你对工作是否有安全感，就取决于你是否有能力影响别人对你以及你的意见的看法。


    # 培养政治直觉


    真正深谙政治之道的人都拥有政治直觉。他们能比别人看得更远，看到更多。他们对周遭环境的感知'
  merge: -1
  img_proc: true
- pgno: 1123
  md: '敏锐得不可思议。微小的肢体动作、话锋的转变，以及瞬间的情感表达都逃不过他们的法眼。


    直觉是一种特别的能力。少数能够凭直觉沟通的人才拥有这种技巧。这些人非常善于思考，从来不会想当然地采取行动。


    直觉的培养，要求你具有看穿事物规律的能力，并且能够广泛接受各种类型的信息，包括情感的暗示等等。


    具备了政治直觉，你就能够发现别人察觉不到的线索，从而感知某项政策会在何时发生改变；你会比别人先发觉有人在说谎，有人在推卸责任，有人在设陷阱，有人在掩饰不可告人的一面。你的直觉越强，就能越早辨别出这些行为。一旦你建立起“早期政治预警系统”，别人就很难占到你的便宜。'
  merge: -1
  img_proc: true
- pgno: 1124
  md: '要想培养政治直觉，你可以在与人打交道的时候采用寻根问底的方法。具有政治直觉的人会问很多问题：“你为什么这么想？你有没有想过别的可能？”在做出反应之前，他们会先思考某种情况可以有多少种解释。他们已经习惯于三思而后行，而且对其他他人有着异乎寻常的兴趣。


    那么，怎么能做到这一点呢？第一步，是要建立一个“红色”警报。当你说得太多，问得太少，或者当你假设得太多，却询问得太多时，这个警报就会响起。一旦你发现自己正在仓促地做出判断，或者没有询问足够多的问题时，马上停止一切行动！


    接下来，就要把这种寻根问底的方法演变成自己的风格。下一次，当你在与别人的交谈中发现有些情况不妙，而结果又可能影响你的职业生涯时，就要多问问问题了。不过，提问要有技巧，不要让人觉得你好像在盘问他。而且，提问的对象要选对，应该是那些有可能向你提供有价值信息的人。'
  merge: -1
  img_proc: true
- pgno: 1125
  md: '在培养直觉的过程中，最重要的是学会如何围绕关键的信息提问而不会跑题。绝大多数人心里想的，总是自己要告诉别人些什么，而不是自己要问别人些什么。知道自己最有力的观点当然很重要，但是了解对方的想法更加重要。如果没问出别人的想法，你所谓的最有力的观点也只会不堪一击。


    有位 CEO 很不幸地养成了一个恶习—为了表现自己的领导权威，喜欢当众粗暴对待反对他意见的人。对他而言，询问别人是懦弱无能的表现。因此，他不愿意征求别人的意见。这就让他的对手更加看不起他。于是他改正了这个习惯，每当他想要对别人说些什么，或者想着言辞激烈地驳斥别人的时候，都会先停下来想一想自己要说
    的话。就是这段短暂的思考让结果大不一样。


    有一次，一位董事会成员生气地对他说：“没用的，我们已经试过了。”这位 CEO 顿了一顿才回'
  merge: -1
  img_proc: true
- pgno: 1126
  md: '答：“既然你知道这样做行不通了，那你觉得现在我们应该做哪些改变呢？”这类问题将批评者推上了专家的位置，使得话题得以继续讨论下去，并且还可能令双方对前面失败的教训做出建设性的评估，反败为胜。那位CEO也可以这样问：“从那次失败中我们学到了什么？”至少，提问能帮你赢得思考的时间。提问遏制了我们想要显摆自己很内行的表现欲，还能帮助我们获得宝贵的信息，让事情更加清楚、明白。所有这些表明，提问是政治高手的秘密武器。


    具有政治直觉的人还会做一件事，就是观察正在发生的事情是不是符合预期。要想在一家公司站稳脚跟，了解“这里的做事方式”是极为重要的。当事态不妙的时候，直觉就能嗅出危险的信号。


    打造同理心'
  merge: -1
  img_proc: true
- pgno: 1127
  md: '直觉还包括站在别人的角度去看这个世界，去体会他们的感受。这一点很难做到，尤其是在如今这种讲究“大踏步前进”的环境下。不过，同理心也是可以学会并改进的。与直觉的培养相同，你首先要

    有能够吸收各类信息的开放心态，要对观察这个世界保持强烈的兴趣。


    有效运用同理心给你带来的政治优势是，能够深入理解别人的想法。“如果我是他，那我现在会是什么感受？”这个问题要求你走出自己的精神世界。


    同理心并不是用来判断人的，而是为了帮助你探索人们行为背后的原因。在试图用同理心去了解一个人的时候，我们要克服一种习惯性的倾向，就是把自己的判断强加到别人身上。通过提问和观察所了解到的情况，靠草率的假设是得不到的。如果我们要去检验自己的理解是否准确，就相当于架起了人与人之间的沟通桥梁。'
  merge: -1
  img_proc: true
- pgno: 1128
  md: '同理心连接起了双方的内心世界，让双方都能够预见对方的行为。因此，同理心有两个好处，一是让我们了解为什么某人会从某个角度来看问题，二是我们可以预见此人接下去会怎么做。


    高超的政治智商还包括了精明的说服能力，这种说服事实上就是让别人按照你希望的那样去思考和行动。如果你不清楚别人对某件事情的看法和感受，你就无法有效地说服他们。


    现在就可以立刻开始学习提高你的同理心。比如，明天你就试着去观察分析身边的人，边听边揣摩。对别人想说什么极为感兴趣的人通常十分罕有，你就要这样做。问一些你过去忽略了的问题，深入了解别人的观点，不要假设或者推断。花一整个早上来练习同理心的技巧。选几个关键人物，高度关注他们。这些经验很可能会对你有启发作用，会将你改造成一个更精通政治之道的人。


    # 融入“内圈”'
  merge: -1
  img_proc: true
- pgno: 1129
  md: '如果成为了“内圈”，中人，要了解别人的想法就会容易得多。身处“内圈”，就更容易得到来自于组织管理梯队上层的消息。一旦你证明了自己在处理信息上值得信赖，你就正式融入了这个“内圈”。


    当然，要达到这一步并不容易。为了能够走进“内圈”，你必须知道如何在合适的时间和合适的地点做合适的事情。大多数企业都有这种“内圈”，但是没有几个人能够轻而易举地进去。


    为了提高你的政治直觉，你需要与那些能够得到内部消息的人保持接触。


    因此，你要采取的第一个重要措施就是，与至少一个看上去了解公司内部情况的人接触。找个理由跟这个人聊天。每天都要拜访一位重要人物，但是他也尽量小心不去浪费这些人的时间。他只问他们一'
  merge: -1
  img_proc: true
- pgno: 1130
  md: '些对他目前正在做的项目有帮助的问题。他坚持认为，如果没有督促自己这么做，他就不可能坐到今天这个位子上。


    对大多数人来说，比起费心培养关系网络，他们觉得培养专业技能更加自在。但是仅有专业技能是不够的。在大多数企业里，事业成功的秘诀就是接触那些了解内情的人。在这个关系网中，你不一定要当众人瞩目的明星，你只要确保自己不出这个圈子就行。如果你好像总是最后一个才知道将要发生什么变化，或者你总是不了解身边发生的情况，那很可能就是因为你没有与合适的人建立联系。人的大多数行为都要受某些标准或规则的影响。通过观察和揣摩别人的行为，你就能够掌握这些规则。问问自己下面这些问题，看看你对公司的了解有多少。


    +   ● 在公司，谁跟谁说话？在什么时候说？


    +   ● 谁先讲？讲多久？他们的日程安排是什么？'
  merge: -1
  img_proc: true
- pgno: 1131
  md: '+   • 谁是“内圈”里的人？


    +   • 关于公司，他们的看法是什么？他们会彼此分享哪些事情呢？


    +   • 你周围的人是怎么完成工作的？


    +   • 他们的工作动机是什么？他们对工作持什么态度？


    +   • 他们站在谁那边？是你那边吗？


    +   • 哪些行为会受到奖励？谁来奖励？


    +   • 你的公司里可能有一个“内圈”，你在里面吗？


    回答这些问题会帮助你找到并且融入公司的“内圈”。


    1132'
  merge: -1
  img_proc: true
- pgno: 1132
  md: '# 具备政治洞察力


    一旦感知到有事情发生，接下来就要知道如何恰当地应对。这就要求你具备另一种技能：政治洞察力。


    具有政治洞察力的人会以一种独特的方式从别人那里收集信息。他们不会立即批评或者反驳他们听到的信息，而是先把这些话听进去，再加以分析，然后再把所听到的信息综合起来。通常在综合的过程中，他们能看到问题不同的一面，或者构想出一个不同的解决方案，或者两者兼有。


    在政治气氛浓厚的公司环境中，灵活思考尤为重要。在这样的公司里，如果你的一举一动都在别人的意料之中，别人就会知道哪些事情能让你心烦，哪些事情会让你鲁莽行事，以及如何暗中破坏你的


    1133'
  merge: -1
  img_proc: true
- pgno: 1133
  md: '事业。要想在这样的公司站稳脚跟，你必须掌握多种行动方法，用以应对各种可能出现的情况。


    情况不同，处理的方法也就不同。在每一种情况下，你都必须认真考虑什么对你来说是最重要的。在你做出任何有关政治的决定的时候，都要用以下这些问题问一问自己。


    +   - 你的首要事务是什么？明确你的目标所在，并且排出轻重缓急。确认这就是你最重要的事情。


    +   - 与你对话的人有着什么样的肢体语言和面部表情？


    +   - 你敢不敢和别人当面辩论？还是觉得应该用比较间接的方式？


    +   - 会有哪些人可能被触怒？谁的自我形象不堪一击？'
  merge: -1
  img_proc: true
- pgno: 1134
  md: '+   • 你一定会失去什么？一定会得到什么？如果结果令你失望，你能够坦然接受吗？


    不考虑不利影响就贸然行动是十分危险的。在很多涉及政治的情况下，你需要想一想，是现在就采取行动，还是花些时间先考虑一下采取这样的做法是否恰当。你有没有一个值得信任的导师，或者一个精于政治之道的同事？有的话，问问他们的意见。


    # 狗争术的几大特征


    什么是“狗争术”？


    为什么很多老板喜欢利用“狗争术”？


    等你看完这篇文章，或许就看穿了职场上老板们惯用的伎俩和手段。'
  merge: -1
  img_proc: true
- pgno: 1135
  md: '过去我喜欢阅读职场管理类的书籍，尤其是国外的很多流行著作，可是当试着把这些理论应用到实践中的时候，总是达不到理想的效果，我百思不得其解。后来，我同很多大老板、企业的管理者交流的时候才恍然大悟，原来是我一直注重于管理的形式，却忽略了管理的主体是人，从人性入手做管理才是最有效的。


    后来几年，我留心观察、总结、实践，终于发现了职场上，很多老板都爱使用的手段：狗争斗术。

    狗争斗术，源自“吕氏春秋”一个控制人心的绝妙权术。


    狗争斗术原理：“群狗相与居，皆静无争。投以炙鸡，则相与争矣。或折其骨，或绝其筋，争斗存也。”这段话意思很简单“一群狗相互呆在一起，都安安静静地无所争夺。把烤熟的鸡扔给它们，就相互争夺了。有的被咬折了骨，有的被咬断了筋，这是因为狗争斗术的存在。”'
  merge: -1
  img_proc: true
- pgno: 1136
  md: '人为什么被驱使？和这群饿狗一样，究其最根本的原因就是，满足自身欲望。尤其是职场上，老板们想要控制一群人，往往会设计一个欲望的争斗点，就比如：


    +   1、一份巨额的年终奖，但是名额只有一个，其他的奖项远远低于它。


    一个100万，一个一万，别说你不想争那个100万的奖项。别装什么清高说不想，因为人性本就贪，这没什么错。但是很多人就是利用人性的贪，去设置各种诱饵、各种陷阱，引起人们之间相互的竞争，来达到自己的目的。题外话，你去年的年终奖发了吗？


    +   2、一个看起来非常公平、合理、平等的竞争机会。


    就好像公司的高管出现了一个空缺，为了显示出自己的公正，很多老板往往会出一份公开竞聘的通'
  merge: -1
  img_proc: true
- pgno: 1137
  md: '知，不限条件，充分竞争，当然，还不忘加上高管的福利待遇作为诱饵，比如有股票分红，有公司配车配房，年薪几十万，有没有被套路呢？当年我初出茅庐，不知道这些套路，刚入职没多久就去和一个老员工竞聘主管的位置，结果我被穿了半年多的小鞋。


    # 3、还有一段足够长的竞争时间。


    时间太短，不能达到竞争的充分性；时间太长，又会导致竞争失去新鲜感和原动力。所以这点才是考验一个老板水平的分界点。精明的老板会让你感觉诱饵触手可及，但是却有唯一的对手阻碍自己得到，这个阻碍不是老板，也不是规则。比如说，小组
    PK 竞争，比如说搞个排名，比如说淘汰制……


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1137_0.png)'
  merge: -1
  img_proc: true
- pgno: 1138
  md: '# 用这几招吃定职场 “老油条”


    他们仗着自己资历较老或年龄较大，便同资历不深的老板叫板；他们的眼里只有大老板，对他们毕恭毕敬，对你却爱答不理，即便是自己为公司创造过价值，却不断纵容自己的恶习，诸如无视团队合作、考勤纪律等；


    他们靠着自己的工作经验而不思进取，自我感觉良好，却在困难面前脆弱无力；他们喜欢经营一个小团队，抵制对其自身不利的新规定、新计划；他们斤斤计较，缺乏奉献精神，却对公司的管理指指点点。


    他们就是职场中的 “老油条” ——他们的骄横倦怠不仅让管理者头疼，还让别的员工反感。可是在这种情况下，如果让这些比较资深，经验比较丰富'
  merge: -1
  img_proc: true
- pgno: 1139
  md: '的“老”员工走人，可能会对公司造成很大的损失。


    所以，如何有效的管好他们才是当务之急。面对这种情况，应该怎么办？有“手腕”的领导是这样做的：


    一、稳中求降


    何为老油条？一谓“老”，一谓“油”，老说明人家有资历，有经验，油说明人家处事圆滑，你轻易抓不住把柄。如果你能轻易抓住把柄，他们就不是老油条了。


    对待他们，不可操之过急。如果你贸然解雇他们，可能会损失一些人脉或者资源，甚至他会将一些自己培养出来的小油条一起带走。'
  merge: -1
  img_proc: true
- pgno: 1140
  md: '其次，他们虽然圆滑了一些，但毕竟是有些本领的。肯定工作经验比较多，若轻易放弃他们，可能没有更合适的人选来接替他的这个工作，毕竟培养一名经验丰富的员工不管是时间成本，还是金钱成本都不少，如此一来，可能得不偿失。


    所以对付这种人，只能慢慢来，慢慢抽凋他的一些权利，或者找个合适的时机，给他调离一些重要的工作岗位。


    # ## 二、由外到内


    老油条不仅自己油，还带着身边的人一起油。举个例子，本来公司里鱼龙混杂，有老油条也不为过。


    结果这个老油条又培养出了一位十分优秀的老油条，于是乎，二人每天合计着怎么收拾副总，后来'
  merge: -1
  img_proc: true
- pgno: 1141
  md: '副总实在拿二人没办法，只得让总部将其中一个调离到别的地方。


    可想而知，老油条的影响力不容小觑。


    所以这时候你要怎么办？你可以从老油条的周围入手，一个个攻破。今天整一个小油条，明天再收拾一个小油条。


    时间久了，老油条身边没有陪他一起折腾的了，他也会老实些，自己都成光杆司令了，他还能折腾啥。


    而且小油条们天天受惩罚，你觉得老油条能不害怕？所谓杀几只鸡，就是给猴看。


    # 三、去刺法'
  merge: -1
  img_proc: true
- pgno: 1142
  md: '对于老油条来说，如果你暂时没有什么大的能力去开除老油条，那就先尝试把老油条身边的人，跟着老油条一块学坏，不认真工作的小油条，给一点一点处理了。


    当老油条发现，混日子真的是要挨处理的时候，估计自己就改正错误了，就算没有改正，他也成了光杆司令，又有多大能力再阻碍工作呢？


    # 四、小恩小惠笼络着！


    所谓“吃人嘴短，拿人手短”，老油条为什么不听话？因为他觉得和你的感情不深，了解不多，那怎么办？


    工作之余，约个饭，约个茶，休息的时候大家一块去爬个山，相信经过这些活动的历练，你们的感情就会加深，感情加深的坏处是什么？'
  merge: -1
  img_proc: true
- pgno: 1143
  md: '——坏处是，你不能很好的批评他，一是碍于情面，二是他跟你熟练了，会有一定的免疫力。


    但是，也有好处，好处是，你交代给他的工作，他碍于情面，也不会推辞。甚至觉得你人不错，从而死心塌地的为你卖力工作。


    每个公司或多或少的都会有老油条，如果在可掌控的范围内还好，如果超过了掌控的范围内，那么你就需要及时的处理了。


    因为老油条并不可多可怕，可怕的是老油条会带来连锁反应。如果老油条再带出一堆小油条来，到时候再处理，就难上加难了。'
  merge: -1
  img_proc: true
- pgno: 1144
  md: '# 破解权谋领导玩平衡术的手段


    玩平衡术是指在用人行为中，通过玩弄各种不光彩的手段，来保持各种势力之间的平衡，进而达到巩固自己领导地位的目的的用人权术。


    玩平衡术作为一种用人权术，既不让某一种势力过分强大，又不让另一种势力过分弱小，反正谁也不能吃掉其他各方，最后还得维护我的地位，听我的指挥，这是典型的“玩”平衡术。


    玩平衡术手段


    常见的玩平衡术的手段有：


    +   (1)不辨是非，调和折衷'
  merge: -1
  img_proc: true
- pgno: 1145
  md: '前美国总统尼克松认为：在现实世界上，政治就是妥协。”(尼克松：《领导者》第375页)他在执政期间，在美国政界的各种势力之间，搞了不少无原则性的调和折衷活动，以此保持自己的统治权力。


    +   (2) 假意 “宽容” 反对自己的人，以此来调整各种势力的组织结构


    有的头脑人物，看到某一种势力的代表人物企图取代自己，乘他尚未足够强大之时，故意对他的非礼行为表示 “宽容”，甚至假装将自己的位置让给他，以此激起其他各种势力对他的不满和愤慨，从而使他很快丧失取代自己的优势，重新建立起一种新的有利于自己统治的平衡均势。


    +   (3) 容忍甚至重用品性恶劣的下属


    为了维持各种势力之间的平衡，进而巩固自己的领导地位，有些领导者，不惜出卖原则，有意容忍，


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1145_0.png)'
  merge: -1
  img_proc: true
- pgno: 1146
  md: '甚至破格重用某个与某一势力有联系的品行恶劣的下属。


    (4)权力均摊，在用人时充分照顾各方利益


    为了缓和各种势力之间的矛盾，在选用下属时，不是严格按照用人原则来物色合适人选，而是充分照顾各种势力的利益，丧失原则，尽量选用代表各种势力的核心人物，头面人物，使各种势力对自己产生好感，拥护自己的领导。


    (5)适时制造矛盾，阻止各种势力产生不利于自己的联合


    有时候，在各种势力之间，始终保特一定的隔阂和摩擦，对于维持领导者的有效统治，也许是有益的。在这一指导思想的支配下，领导者便十分小心地 “玩”起挑拨离间的把戏来。这样做，往往能收到巩固自己的地位的奇效。'
  merge: -1
  img_proc: true
- pgno: 1147
  md: '值得指出的是，从人才管理学的角度来看，在日常生活中，确实也存在着一些属性不甚清楚，界限不甚明晰的维持平衡的用人行为。这些行为，通常出现在用人谋略和用人权术的“接合”部位。作者认为，从理论上说，对这些界限不甚明晰的维持平衡的用人行为，依然是可以鉴别和区分的;但从实践上说，要做到这一点，却十分困难，而且有时也没有什么必要。为此，遇到这种情况，只要领导者认为，选择某一维持平衡的用人行为，有利于获取显著的社会效益和人才效益(用不是单纯谋取个人的私利)，就可以尽管放手去做。


    # 识别和提防玩平衡术的要诀


    +   (1)及时发现、制止个别领导者对各种势力不讲原则的调和、折衷、妥协、忍让行为。'
  merge: -1
  img_proc: true
- pgno: 1148
  md: '(2)坚持查处、纠正个别领导者有意重用品性恶劣的下属的失职行为。


    (3)发现个别领导者在各种势力之间有意制造矛盾，玩弄挑拨离间的把戏，应给予严肃批评教育，情节严重者，应及时进行组织调整。


    (4)发现个别领导者出尔反尔，一会儿将下属抬上天，一会儿又将下属按下地，应及时撤换这样的领导者。


    (5)对于各种玩平衡术的用人行为，最彻底、最根本的防范措施，就是建立一套科学的人才管理制度，从制度建设上为根治这一用人权术提供有力保证。


    (6)自上而下，搞好各级领导群体的思想建设和组织建设，取消家长制、一言堂的领导恶习。


    (7)让广大群众参与各级领导管理活动。'
  merge: -1
  img_proc: true
- pgno: 1149
  md: '# 小人能得利必定有这些因素


    职场上的人员形形色色，千奇百怪，在职场这个大舞台上，每个人都扮演着不同的角色，生旦净末丑，将职场变得分外的复杂。职场如官场，芸芸众生、悲欢离合，让职场与官场一般显得分外扑朔迷离，平添了不少的神秘感。


    唐宋八大家之一的欧阳修在《朋党论》一文中说：

    “小人无朋，惟君子则有之。其故何哉？小人所好者禄利也，所贪者财货也。当其同利之时，暂相党引以为朋者，伪也；及其见利而争先，或利尽而交'
  merge: -1
  img_proc: true
- pgno: 1150
  md: '疏，则反相贼害，虽其兄弟亲戚，不能自保。故臣谓小人无朋，其暂为朋者，伪也。”


    由此来看小人还不是一个一个的出现，通常是一窝一窝的出现，结党营私，损害公义，甚至为了谋取私利不惜大肆陷害忠良。假如之间有了利益纠纷，马上就会反目成仇，然后狗咬狗一嘴毛。假如有了足够的利益，就会产生背叛心理，即使是亲戚朋友也会将之抛弃，甚至会出卖，小人们追求的是短期利益，就像股市上的投机行为，哪有利益就会往哪钻，或许这些人也会有修养，但是绝对没有人格，因为他们的人格是用来出卖的。


    大体还有脸面的人还知道什么叫礼仪廉耻，可是小人没有，所以小人做事经常是肆无忌惮，孔子说这就是小人们的中庸。《中庸》原文：“小人之中庸也，小人而无忌惮也。”
    所以小人做事可以撕下脸皮，不会有什么顾忌，唯利是图，而且手段无所不用其极。历史上的小人做了些什么呢？有豆子的，'
  merge: -1
  img_proc: true
- pgno: 1151
  md: '有吸脓的，有尝屎的，有做零号的等等，小人们又做了些什么呢？大肆结党，陷害忠臣良将，毁坏国家社稷，以至于民不聊生，饿殍遍地，而现在职场小人虽然在行为上或许没有以前这么露骨，但是绝对是学会了古代小人的精髓，打听上级有哪些喜好，然后进行逢迎满足，打听上级有哪些需求，然后费尽心思去迎合。甚至将为上级处理私事当成工作，上级对于他们而言没有一分秘密，由于掌握了上级的兴趣爱好，更会满足上级的兴趣爱好，这些人成了上级最离不开的人。


    相比之下那些职场君子做了些什么呢？为了工作与上级发生争论，为了公利与那些破坏规则的人发生纠纷，为了公司利益兢兢业业，这些人的心思只放在了工作本身上，从未想过职场钻营之道，在这些人心里或许根本就没有这样念头。然而小人们又做了些什么呢？恶意中伤，背后造谣，挑拨是非，无中生有，栽赃陷害，排挤倾轧，最终败坏了整个公司的工作气氛，搞得所有人整日里人心惶惶，唯恐'
  merge: -1
  img_proc: true
- pgno: 1152
  md: 祸及自身。假如别人工作取得了功绩就会肆意打压，先是贬低别人，然后在鸡蛋里挑骨头，接着自我吹嘘，十足是专家能手的派头，最后是将别人的功劳据为己有，恬不知耻，不知仁义为何物。假如在分配工作任务的时候进行精心挑选一些相对简单的工作，即使分配下来以后，也会费劲心思地活动，唯恐自己吃了亏，做了一些难度比较大的事情，因为能力只在钻营上，工作能力很差，在途中又绞尽脑汁地请别人帮忙。在工作已经完成或者即将完成的时候，将请来帮忙的人一脚踹开，甚至还恩将仇报，在邀功请赏的时候，专走领导路线，先将别人的工作说得一无是处，然后再说别人的工作难度与自身比起来微不足道，其实目的很明确：贬低别人，抬高自己。即使有拼不过的情况，那么就在私下里活动：和上级领导活动，争取上级领导另眼相看，和有功之臣活动，意图能够分一些功劳。而一些上级显然耳根软，诱惑多，禁不住这些亲信在耳边磨，禁不住这些贴心人逢迎，在加上这些人
  merge: -1
  img_proc: true
- pgno: 1153
  md: '专精钻营之道，善于揽功推过，陷害忠良，上级会认为这些人不仅忠心而且能干。


    因为能力不足，难以形成影响力，所以小人们就会拉帮结派，在公司里称兄道弟，好一副热闹的场面，因为声势浩大、牵连甚广，因此其他人无不退避三舍，不敢缨其锋。而这种帮派中的人员如果占据了一些关键岗位就会排挤其他有能力的人，因为这些人可能会危及自身的地位，如果没有，就会将眼睛盯在坐在关键职位上的人的一举一动，稍有动静，就会趁机而动，目的就是目标扳倒，让自己人坐上了那个职位，然后尽可能斩草除根，以免留下祸患。接着他们就会将工作重心放在上级领导上，假如因为能力不足出了什么差池，就找个替死鬼代替，有时候甚至连‌“自己人‍‍”也不放过，然后跟上级领导说：‍‍“都是那个人的错，我本来是要这样做，结果他自己太自以为是，才将事情搞砸。‍‍”总而言之，自己总是对的，即使是错误的也是正确'
  merge: -1
  img_proc: true
- pgno: 1154
  md: '的，因为自己是他们的上级，下属只是他们推卸责任的工具。


    由于经常在上级领导身边活动，那么就会和上级领导及领导身边的人混个脸熟，甚至也会走曲线，先去迎合上级领导身边的人，比如：家人朋友，司机、保姆、甚至连清洁工也在其内，其活动能量也太过惊人，为什么？因为这些人的生存之道就是这样，假如不这样做，职场上根本不会有这些人的位置，而上级领导本身也是苍蝇不叮无缝的蛋，谁没有七情六欲？而这些人似乎生来就是这方面的专家能手，工作能力或许很差，但是胜在忠心，一心为上级着想，因此也能在上级面前游刃有余，占据一席之地，甚至能够影响左右上级的决策。


    而职场君子们似乎太单纯，太迂腐了些，只会将心思放在本职工作上，有时候为了工作难免与上级闹得不愉快，或许有些行为方式没有迎合上级的思维方式，甚至与上级背道而驰，惹得上级不喜欢。而'
  merge: -1
  img_proc: true
- pgno: 1155
  md: '那些有能力的人往往也比较有性格，常常让上级领导感觉到不听话，不好控制、不好管理，在上级手里既舍不得放下，又觉得扎手，这样的人上级绝对不会倚为心腹，因为对他们的控制不能如同手臂般随意，用则用之，但是心理会进行防备，以免事情脱离自身的控制，而且上级领导也会依靠这些人来出业绩、出成绩，因此会在有用处的时候扶起来，无用处的时候置之不理。


    想想以上的这些情况，除了职场小人以外，还有那些人能够在职场上活得有滋有味？蚂蚁咬死象，即使一个人再厉害，也双拳敌四手，何况是一堆堆、一伙伙的上？因此和小人帮派有利益冲突的精兵能将纷纷败下下来，因为他们根本不是什么“精兵能将”，妨碍了小人帮派的利益的忠臣直臣无不死伤惨重，因为手段毒辣，有的是办法证明你不是什么忠臣直臣，而你根本就是一个“奸臣”，而公司企业空降过来的人才无不偃旗息鼓，因为在小人当道的企业里寸步难行，最终也只能证明自己不是'
  merge: -1
  img_proc: true
- pgno: 1156
  md: '什么人才，只是一个“庸才”。于是忠臣、直臣、能臣、贤臣日退，而奸邪小人日进，而上级领导在包围中，将这些人倚为长城，在一番手段之下，上级领导认为除了这些人以外再无人才。


    再回看现在职场上的情形，没有人能够将全部心思放在工作上，也出现了很多书专门写在职场上的钻营之道，为什么？小人毕竟比其他人能够更好地在职场上生存。职场险恶，上有雷霆雨露，旁有明枪暗箭，即使有能力统御好下属，做好本部门工作，也不能保证在职场上的前途。而那些职场的君子们在深受其害之下，不得不研习权术，不仅为自保，也为寻求进身之途。一块臭肉坏了满锅汤，这句话虽然粗俗，但是也有大量的例证，因此职场上的君子们要时刻警惕着，别让自己成了小人们的进身之阶，而沦为公司斗争的牺牲品。'
  merge: -1
  img_proc: true
- pgno: 1157
  md: '# 看清这几点明白你是否被利用


    我经常说无论是职场还是官场，你是上司的人但是上司不一定是你的人，很多时候你为上司卖命，到头来才发现上司早已经把你给卖了，因为很多时候上司表面对你非常好，但是内心并没有把你当成自己人，什么事情都让你去干，结果到最后才发现他只是把你当成棋子，这样的上司在职场中是非常常见的，那么如何判断上司是不是把你当成长自己人，有五项标准对照：


    一，是否让你加入他的圈子。职场中有各种各样的圈子，比如酒圈、麻将圈、篮球圈等等，这些大圈套小圈、圈圈相扣，进入这些圈子你就能了解信息、分享资源，从而达到资源共享的目的，所以职'
  merge: -1
  img_proc: true
- pgno: 1158
  md: '场中如果上司把你带入他的圈子，办事从来不对你避讳，这就说明把你当成了自己人。


    二，是否为你办理私人事情。职场中新人刚刚参加工作，往往没钱、没本事、没关系，比如要孩子安排一个好学校，给老婆换一个好单位，职场中如果遇到这些事情，求助于上司，上司爽快答应，因为在这个社会人情用一次少一次，上司为你的事情肯动自己的人脉，对你的器重可见一斑，这样的上司可遇而不可求，这样的上司你一定要好好珍惜。


    三，是否为你承担摆脱责任。职场中做的事情越多，那么错的也就越多，有时会出现一些岔子，得罪人不说，可能需要承担责任，如果说上司主动靠前为你化解，用于承担责任，把错误揽在自己身上，这说明他们内心不坏，特别有人情味，是非常值得你的跟随的。'
  merge: -1
  img_proc: true
- pgno: 1159
  md: '四，是否和你谈论各种事情。职场中上司是上级，同样也可以是朋友，在闲着没事的时候和你拉拉家常，谈论单位、社会的一些事情，这些事拉近你们关系的润滑剂，彰显你们的关系不一般，如果有事的时候叫你，没事的时候对你爱答不理，只是一味的让你工作，那么你就需要好好的考量一番了，因为这说明上司并没有把你放在心上。


    五，是否为你指明职场前程。职场中刚参加工作的人都希望在学一点本事，而职场中的老人则希望有一个好的岗位，总的来说都是希望有一个人為自己指明职场的前程，如果上司肯为你的前途上心，那么你比别人就多出更多的优势，获得别人的指点也是需要代价的，你任何事情都没有付出想不劳而获这是天方夜谭，只能是竹篮打水一场空。


    无论是在官场还是在职场，一切都没有善意、也没有恶意，只有生意，没有比较级、最高级，只有上下级，所以官场或者职场中碰到一个好上司那是一'
  merge: -1
  img_proc: true
- pgno: 1160
  md: '种运气，如果你的上司满足这 5 项条件就说明非常难得，你必须回报上司对你的知遇之恩。


    # 深挖 4 大潜规则


    职场是一个神奇的世界。在这里，你可以看到团队协作的力量和伟大，也可以看到尔虞我诈，你死我活的无休无止的争斗;你可以看到睿智和龌龊并存，也可以看到善良者的狠毒和阴险者的良善。人类所知晓的各种兵法计策与厚黑谋略也在这里得到了发扬光大。职场如同战场，胜者为王败者寇，虽无流血却有牺牲，同样残酷惨烈;职场如同江湖，权术与智谋在这里激烈碰撞，智者和愚者轮翻较量，有小隐在野、大隐在朝，高手云集，各显其能。今天时'
  merge: -1
  img_proc: true
- pgno: 1161
  md: '代光华网要说的就是：中国式职场与4大潜规则，

    提高自己身的职业素养。


    潜规则，顾名思义，就是暗藏的规则，是话中应有之意，但话表面不说明，靠自己去意会。公司政治这个潜规则当然也不是白纸黑字标出来的，而是约定俗成的。强调政治是人与人交往的一种关系，而不是厚黑学，上升到厚黑学的层次就有些可怕了，政治素质只是在职场生存及发展的必要条件。


    要明利害，分清首要利害、次要利害。生存、内部竞争与末位淘汰属于首要利害。如一个公司两个高层势不两立，见着就掐、咬，不一定是他们个人有什么恩怨，很可能是他们的生存互相冲突，受到彼此存在的威胁。内部竞争则是一把双刃剑，采用末位淘汰的机制，刚开始也许可以提高业绩，但是从长期来看是一种慢性自杀，容易导致员工之间的互相倾轧和不正当竞争。分清首要利害后，还要辨别次要利害，这样才可以进退自如。


    1162'
  merge: -1
  img_proc: true
- pgno: 1162
  md: '# 潜规则一：不要凸显自己脱离团队


    “团结就是力量”是中华民族一直奉行的传统理念，但在工作状态中保持住这样的风范就不那么容易了。虽然美国崇尚的“个人主义”从表面上与“团队精神”有矛盾，但是老美们在工作中的确处处都在强调着“团队精神”。假如你来到一家外企公司工作，因工作能力突出业绩斐然而很快连跳几级，达到了“高处不胜寒”的位置，但却因为一时得意而忽视团队的存在，不仅与下属和同级同事很少沟通，在工作中出现分歧时还一意孤行，结果导致与团队间的关系很不融洽，工作无法进展。


    这显然是没有遵守外企中“团队精神”的潜规则。没有任何一个人能保证自己在工作中做到十全十美，老美们显然也清楚这一点。因此在外企中，经营者往往会更注重团队的建设，让团队的合力能够达到十全十美。我行我素的风格与团队文化是格格'
  merge: -1
  img_proc: true
- pgno: 1163
  md: '不入的，就算工作能力再强，没有团队的协作，也很难把任务在目标时间内出色完成。总是游离在团队之外，不仅会阻碍你的职业成长速度，与同事关系的僵化也会使你逐渐遭到团队排斥。长此以往，不仅工作无法完成，饭碗能否保住也会成问题。


    潜规则二：不要随便 “打小报告”


    打小报告的 “习惯” 从大家小时候就 “养成” 了，相信很多人在学生时代大多有过跟老师打小报告，或者被其他同学 “报告” 给老师的经历。很多外国人觉得中国人对别人的夸赞显得比较吝啬，其实中国人一方面是对夸耀别人羞于启齿，同时爱用镜子照出别人的缺点。当然指出对方的问题并没有什么不妥，但是在方法上如果没有把握好，在外企的工作过程中就很可能
    “触雷” ，甚至影响你今后的工作发展。


    潜规则三：不要一味附和别人的想法'
  merge: -1
  img_proc: true
- pgno: 1164
  md: '东西方文化的差异，导致了企业文化的核心差异 化，西方人更崇尚个人主义思想，也就是说，如果 想在外企中生存下去，在保证高效执行力的前提 下，必须保有自己的见解，并且适时提出，而不是
    总是去附和别人的想法。假如你工作能力不错，在 处理事情的时候谨慎细心，也有自己独到的见解， 却总在应该提出建议的时候顾虑太多，羞于表明 立场和看法，并且不管别人已提出的建议是否正确
    或完善，都一味地去迎合。


    潜规则四：不注意形象及素质的塑造


    个人形象包括外在行为、形象也包括内在行为素 质。得体的装扮不仅能够提高个人自信，而且还能 传达给对方愉悦感和尊重感。尤其是在对企业形象 尤其注重的外企，得体的着装就成为了成功的第一
    步，而行为职业素养也是衡量一个员工是否符合企 业文化及形象的另一个重要的标准'
  merge: -1
  img_proc: true
- pgno: 1165
  md: '# 如何提升高层领导力？


    作为企业的高层领导，该如何培养和提升自己的领导力，前文讲到，所谓领导力，其实就是做正确事情的力量，那么对于高层，什么是做正确的事情'
  merge: -1
  img_proc: true
- pgno: 1166
  md: '呢？又该如何通过做正确的事情来发挥自己的影响力呢？以下四个原则可以作为参考。


    # 一、高层领导力要以身作则


    所谓以身作则，是指高层管理者要在企业价值观、公司制度规定、流程运作等方面做员工的表率，为员工树立坚持原则，按原则办事情的榜样。


    通常，高层领导力是价值观、制度与流程的倡导者，他们最关心这些机制安排的完善性，最关心这些工作的进展情况，所以，经常，命令从这里发出，智慧从这里汇集，成果从这里体现，当公司上下经过紧张忙碌之后，形成了明确的企业价值观，形成了完善的制度安排，形成了高效的流程运作机制，成果形成了，但效果并不一定按照预期的体现。为什么？哪里出了问题？


    高层领导力这里的做事方式出了问题，明明制度规定了的事情，有些人不按制度办事，找高层领导力'
  merge: -1
  img_proc: true
- pgno: 1167
  md: '协调，这时候高层经常会从事情的本身出发，直接解决问题，动用企业赋予自己特有的职权，直接 就按照自己的想法把解决方案提了出来，而作为制度管理部门看到领导已经发了话，已经做出
    了决定，也就不敢再提制度的事情。下属之所以不敢再提，还有一层因素，就是这些人认为领 导决定的就是正确的，听领导的准没错，错了也没事，有领导担责，责任由领导背。


    这是哪里出了问题？是领导的榜样没有树立好，领导习惯了按照自己的意愿而不是原则办事情， 导致上行下效，下属不愿主动提醒领导，更缺乏风险意识，从而导致企业管理混乱，有制度不
    执行，有流程不按流程走，使得工作效率降低，工作氛围紧张。


    那么，高层领导力的这种方式会给员工造成什么影响呢？员工会认为领导说一套做一套，说 是要按章办事，规范现代企业制度，但是第一个打破制度的'
  merge: -1
  img_proc: true
- pgno: 1168
  md: '就是他。这会给员工一种印象，以后凡是不认真，领导都不认真对待，我们认真了只能咨询烦恼。这就是弱化了高层在员工心目中的影响力，就会造成领导说领导的，员工作员工的，两张皮。


    所以，高层领导力的提升从以身作则开始，对于原则的清晰界定以及坚守会逐步提升高层的影响力，高层领导要做到以身作则，树立榜样。


    # 二、高层领导力要探索航向


    企业管理上有一个著名的说法，就是管理者要做应该做的事情，而非感兴趣的事情。什么叫感兴趣的事，就是在自己提升高层自己做的事情，就是本质职责之外的事情，比如原来是业务经理，由于业务开展的好，被提拔为营销副总，但是由于角色没有转换到位，仍然喜欢抓具体的业务，而对于营销规划的制定，营销政策的调整，市场的预测则置之不'
  merge: -1
  img_proc: true
- pgno: 1169
  md: '顾，这就叫做感兴趣的事情，而没有做应该做的事情。


    那么，对于高层领导力来说，什么才是做应该做的事情呢？定方向，定目标。高层领导力是带队伍的，队伍往哪走，要由高层领导把握方向。所以，第二个方面就是探索航向，明确目标。


    高层领导大部分时间都在探索方向，在明确战略定位，描述愿景，而不是具体做某个事情，解决某个具体的问题。


    高层领导力的提升来自于对战略方向敏感认知和把握，在于对未来发展趋势的分析判断，在于把这些认知、分析和判断有效地传达给管理者，让他们也认识到这些，并认同这些，这就是探索航向的力量。当高层领导带领团队把战略方向明晰了，并通过有效的途径和手段把这些内容沟通给了管理者，高层的领导力就用在了刀刃上，就会对管理者形成'
  merge: -1
  img_proc: true
- pgno: 1170
  md: '一种影响力，就会吸引大批的追随者和崇拜者。这样的领导站到员工面前的时候，带来的是方向和力量，员工是欢迎的，企业也会因此更加成熟。


    # 三、高层领导力要整合体系


    战略方向明确了，高层领导还要规划支撑战略发展的管理体系，比如如何有效表达战略定位，让每个人都能清晰地认识战略目标，认识自己和战略的关系，这就会用到战略地图和平衡计分卡，使战略变成可执行的语言。


    战略目标分解到位了，全面预算是否完善，流程管理是否配套，人力资源管理体系、激励体系是否支撑？等等。这些配套支撑的管理体系需要高层通过影响力来整合布局，这也是高层提升自己影响力第三个该做的事情。


    # 四、高层领导力要充分授权'
  merge: -1
  img_proc: true
- pgno: 1171
  md: '战略方向明确了，企业管理体系整合了，领导要做的事情是什么？就是授权。如何高效地授权，如何保障授权之后不乱，也是高层领导要认真研究的课题之一。


    什么样的权力该授，什么权力不该授？授权之后如何监控进程，确保管理者按照权限履行职责，这些都是高层领导需要修炼的。


    # # 四种方法完美拒绝领导不合理的要求


    职场如何拒绝别人，这其实是一种智慧，很多人没有勇气拒绝，感觉不好意思，尤其是拒绝了领导就更是如此了，因而，如果想要继续保持与对方的良'
  merge: -1
  img_proc: true
- pgno: 1172
  md: '好关系，就必须做好拒绝别人后的消毒工作，防止因为拒绝而得罪上司，今天我们就来谈谈职场中如何拒绝上司不合理的要求：


    # 一，赞扬肯定法。


    职场中赞扬肯定法就是先给对方带高帽子，让对方产生一种荣耀，把他架上去，赞扬上司是如何的体谅下属、通情达理，再举出身边不会管理的领导的例子来对比，然后再把拒绝说出口，这样上司心里不会不舒服，和这种明知不合理而提要求的上司共事，就要采用这种策略。


    # 二，转移话题法。


    职场中当你不想正面拒绝时，就不妨采用所答非所问的方式，选择一个与原话无关紧要的话题作答，把这个问题绕过去，不要正面回应，这个时候，装傻的能力就比较重要了，表现出完全不明白他在说什么，用答非所问的的方式换一个与原话题无关的话题作答。'
  merge: -1
  img_proc: true
- pgno: 1173
  md: '# 三，缓兵之计。


    缓兵之计是解决棘手问题的上策，既不得罪领域又体现了自己的沟通能力。这个就像做销售时，很多客户都会说这么一句话，我先看看或者是我先考虑一下，如果合适的话我再联系你，这样的一个换从能够减小正面说出来的不适，如果他没有联系你就已经是表明了态度，这个时候即使你联系他也改变不了他对决策。


    # 四，插科打浑法。


    职场中当不好拒绝领导时，你就可以采取开外销的方法，缓解拒绝领导所产生的尴尬，因为生硬的拒绝不合适，那么就在玩笑中告诉上司这个事情我做不了，比如你可以说：“你让我上刀山下火海眼都不会眨一下，但要做这个事情真是咬了老命了”等等类似这样的话语，在轻松化氛围中，用诙谐的言语拒绝上司的不合理要求。'
  merge: -1
  img_proc: true
- pgno: 1174
  md: '我们经常说世事洞明皆学问，人情练达即文章，在职场中学会说话是一门很重要的生存智慧，他可以让你沟通顺畅的同时，也可以让你减少很多矛盾冲突，少树立很多敌人，当别人和你意见不一致的时候，你也可以通过良好的沟通方法让他暂时顺从你的意见，那就离不开这些高超的洗脑沟通技巧。


    # 面对小人的打压如何反击？


    俗话说，一样米养百样人，最令人受不了的，莫过“小人”。这种人本事不大，面子不小，有事看热闹，没事穷搅和，有好处尽量占，得了便宜还卖乖。其实，“小人”也是有些许调性差异，除了去庙里烧香拜佛“打小人”之外，你也可以试着对症下药，找出他们的弱点，或自我防范。'
  merge: -1
  img_proc: true
- pgno: 1175
  md: '现代人汲汲于事业，生命的重心几乎都在工作。因此，职场上最怕碰到的莫过于“小人”，无论是邀功卸责，或是找麻烦扯后腿，小人就像杂草一样，无所不在，很难根除。


    或许你也曾碰到过人厌的“小人”，甚至曾经有败于小人黯然离职的经验。也许，这就是人与人之间天生无缘，或磁场不合的实例，有时候明明自己工作认真、待人和善，但免不了遇上有人与你针锋相对；与其生气，不如争气，换个角度去思考，每个人都有自己的好恶，你也会有不合味口的饮食，或者看不顺眼的人，只是那些“小人”不如我们有好修为，所以任意表态，找人麻烦。


    另外，你也可以试想，那些讨厌人的小动作，不过是来自“小人”对你的嫉妒，也许你的存在与实力引发了对方的不安，但又没有把握能与你正面一较高下，所以才会选择这样的“奥步”。


    应付“小人”其实也没有想象中困难，高EQ不代表任人欺负，如果对方的言行举止实在过分，你也毋须客气，试试以下四大绝招“打小人”吧!'
  merge: -1
  img_proc: true
- pgno: 1176
  md: '# 适当还击


    初到一个新环境时，最常碰到的“小人”就是仗着自己资历去欺负新人的老鸟。这类小人凡事都挑简单易松的做，看准你的客气，所以出力最少邀功最多，或者为了显示自己的资深地位，对你做出一些排挤动作，纯粹以欺负新人为乐。如果这样的“小人”会令你会难，除了忍气吞声，也该适时反击。你或许比对方晚进这个环境，却不代表你在能力与经历上就注定矮对方一截，不了解你的过去就贸然挑衅，是对方过于天真，因此，你可以一笑置之，也可以还以颜色。


    # 冷漠以待


    “沉默是金”的解决方式，通常适用于喜欢蜚短流长的小人。无论茶会间或上班时间，总是有那群喜欢背后道人是非的小人，以制造、传播谣言为乐。最好的解决方式就是敬而远之，冷漠以待，对于探询与流言保持沉默。因为“清者自清、浊者自浊”，你响应的越少，他们可运用的素材也越少，'
  merge: -1
  img_proc: true
- pgno: 1177
  md: '如果真的听不下去,就提醒他们一下,法律上可是有“诽谤罪”专治信口开河之人。


    # 划清界线


    有一种小人喜欢打压别人突显自己的优越,你所说的一切都会被否决,任何事情无论懂不懂他都要提出见解,嘲笑你的看法。这样强大的虚荣心其实来自深沉的自卑,因为自己不够有信心,所以喜欢打击别人的信心,拖人和他一起卷入负面思考中,这样的“小人”着实是一个团队成长的绊脚石,如果不幸与这样的人共事,你千万要记得划清界线,看透对方的傲慢其实来自深沉的不安,他的否决未必客观,因此,不必受到太多影响,不如另谋建言。


    # 主持公道


    此处当然指的是恳请上司主持公道,虽然主管们大都不愿意卷入同事间的纷争,但上司存在的意义,不就是为了领导团队,并为下属解决问题吗也许你会觉得“告御状”不是光彩的行为,但是别忘了你的对象是“小人”,对方既然已对你不仁,你'
  merge: -1
  img_proc: true
- pgno: 1178
  md: '当然可以不义，这不算打小报告，只算伸张正义。如果你的上司不挺你，或者因为某些人脉背景，以致你的小人后台坚强，所以胆敢恶行不断，那你也不必太浪费精神，一间会任其恶瘤发展的公司没什么前瞻性可言，不如趁早求去以免浪费时间。


    每个人对付小人的招数都不尽相同，有人以上述的方式理性以待，也有人寄託信仰，戴尾戒摆水晶镇；好斗分子可能直接迎向挑战，不斗到其中一方丢出辞职信绝不罢休。但是，无论如何“小人”之先是“小人”，还谈不上“恶人”，就是因为他们所造就的，不过是小小的挫折与影响，其实不值得我们大材小用浪费太多时间。


    你必须正视“小人”不过像是鞋子里的小砂石，倒掉就算了，你不能忘记重点是你还走在迈向成功的漫漫长路。你真正的对手，应该是有竞争力的同事，或者掌控你升职进退大权的上司，或者，以自己为挑战对象，务必追求更好的表现。把眼光放远一点，你就会发现其实“小人”的存在其实还挺具娱乐性，算是为繁忙的职场生涯增添一点变化。因'
  merge: -1
  img_proc: true
- pgno: 1179
  md: '此，真的不要过于在意，和“小人”计较太多，只是自贬身价而已。


    # # 遭到遇同事排挤的原因


    如果有一天，你发现你的同事突然一改常态，不再对你友好，事事抱着不合作的态度，处处给你设难题刁难你，出你的洋相，看你的笑话，你就得当心了，这些信息向你传递了一个危险信号:同事在排挤你。被同事排挤，必然有其原因。
    这些原因不外乎'
  merge: -1
  img_proc: true
- pgno: 1180
  md: '以下几种情况:


    近来升级连连, 招来同事妒忌, 所以群起排挤你；你刚刚到本单位上班，你有着令人羡慕的优越条件，包括高学历、有背景、相貌出众，这些都有可能让同事妒忌；


    应对方法:这情况也很自然，所谓“不招人妒是庸才”，能招人妒忌也不是丢面子的事。其实只要你平日对人的态度和蔼亲切，同事们不难发觉你是个老实人，久而久之便会乐于和你交往。另外，你可以培养自己的聊天魅力，因为同事们的最大爱好之一就是聊天，通过聊天改变同事对你的态度。


    雇佣你的人为公司内人讨厌的人物，故连你也受牵连；


    应对方法:这是你本人的不幸，惟有等机会向同事表示，自己应聘主要是喜爱这份工作，与雇佣你的人无关，与他更不是亲戚关系。只要同事了解到你不是密探身份，自然会欢迎你的。


    衣着奇特、言谈过分、爱出风头，令同事却步；过分讨好上级而疏于和同事交往；'
  merge: -1
  img_proc: true
- pgno: 1181
  md: '应对方法:你要先反省一下，因为问题是出在自己身上，如果想令同事改变看法，惟有自己作出改善。平时不要乱发一些惊人的言论，要学会当听众，衣着也应切合身份，既要整洁又不要招摇，过分突出的服装不会为你带来方便，如果你不是土包子，就是为了出风头，这会令同事们把你当成敌对的目标。


    妨碍了同事获取利益，包括晋升、加薪等。


    应对方法:你要注意你做事的分寸。升职、加薪、条件改善甚至领导一句口头表扬都是同事们想获得的奖励，争夺也在所难免，虽然大家非常努力地工作，但彼此心照不宣，谁都想获得一种优先奖励权。'
  merge: -1
  img_proc: true
- pgno: 1182
  md: '# **职场拉帮结派现象**


    “职场站队”是职场“拉帮结派”的代名词，也是职场“潜规则”之一。有调查显示，逾6成职场人士承认身边存在“职场站队”现象，20%人士表示入职一年后开始“职场站队”。


    根据调查数据显示，62. 5%的受访者表示自己身处的办公室中“站队”现象很常见；但有超过六成职场人不愿意“站队”，除非是“非站不可”。对'
  merge: -1
  img_proc: true
- pgno: 1183
  md: '“站队”原因做了相应调查，13。64%的人表示其领导势均力敌，必须要选择一方“站队”；28。41%的人认为“站队”是职场潜规则，为了生存要站队；25%的人是有目标而“站队”，认为“站好队”有利于职场晋升；32。95%的人则表示“站队”是维护人际关系的一种方法。


    职场站队很常见，难避免。虽然站好队不见得有什么好处，但站错了队肯定没什么好下场”。不过，做“墙头草”是职场大忌：“作为上司，如果要在从一而终的忠实派和随机应变的两面派下属中选择，肯定选忠诚派。随机应变的下属看似聪明，但实际并不受职场欢迎，悲惨下场的来临只是时间的长短而已，有智慧的上司是不会亏待“忠诚派”的。”


    如果一定要选择“站队”，该如何应对？“要根据职场中人当下所处的环境、入职时间的长短，以及个人职业规划的方向等因素综合考虑，一般不建议'
  merge: -1
  img_proc: true
- pgno: 1184
  md: '初入职场的新人盲目“站队”，而是等其对工作环境和 社会环境有所了解后，或如果对自己的职业生涯有 所帮助，可以选择性或无意思的去“站队”，但 一定要保持一个度的衡量”。


    职场站队向来被理解为职场“潜规则”，大家承 认其存在，但尽量避免站队，毕竟同事之间还是希 望和睦共处、融洽协作的。其实，不一定要选择“站 队”才能在职场生存。忠诚派、中立派是在“跟对
    上司站好队”的前提下才受肯定的，如果跟错了上 司，忠诚可能会导致职场挫败，中立可能被职场孤 立排挤都是可能的。作为下属更重要的是做好份内 工作，踏踏实实向上进取，是否站队则顺其自然更
    好，切忌毫无原则的独树帜，避免在心理上和精 神上被他人排挤。工作的展开离不开同事间分工合 作，促进彼此协作的纽带就是微妙的人际关系，将 “站队”理解为维护同事间的人际关系不为过，反
    之“恶性站队”则违背了职场规则。'
  merge: -1
  img_proc: true
- pgno: 1185
  md: '“职场站队”已经成为了职场的潜规则了，那么，是什么原因导致职场战队现象呢：著名职场研究专家总结出以下几点：


    1. 领导相互抗衡


    至于站队的原因，13。64%的人认为，领导相互抗衡，必须要选择一方站队;28。41%的人认为站队是职场潜规则，为了生存要站队;25%的人是有目标而站队，认为站好队有利于职场晋升”;32。95%的人则表示，站队是维护人际关系的一种方法。职场站队向来被理解为职场潜规则，我们需承认其存在，但尽量避免站队，毕竟同事之间还是希望和睦共处、融洽协作的，所以大家默认了规则的存在，但不一定非要站队才能在职场生存。”


    2. 各自拉拢=各自为政


    为了加薪、升职，职场人士一直默默工作在自己的'
  merge: -1
  img_proc: true
- pgno: 1186
  md: '岗位上。不少人在工作中兢兢业业，很努力，可是却很委屈。这些人总告诉自己，自己的努力大家都看得到，自己的委屈事实上老板也是能洞悉的。可是事实是有 的事情自己也要懂得争取。


    不少职场人士在刚入职的时候，就开始到处拉拢关系，每天一包巧克力分给同事，每天一起找人吃饭，每次都故意赞美几句，尽管假惺惺，但是对很多人来说却很受用。大部分人都在为自己争取更多的联盟，对于完全陌生的“空降”主管，大家都在准备自己的备战策略。


    看着老板们、领导间的你争我夺，还不能看透吗？职场里尔虞我诈，都在各自拉拢，各自为政，对于职场新人来说，也只有融入到其中，选择好要归 于的队伍了。如果你不站队，如果你没有同事和你成为派别，那么当你发生了什么困难的时候也只有独自自面对了。'
  merge: -1
  img_proc: true
- pgno: 1187
  md: '# 3.  并肩作战=察言观色


    职场站队，只为了有人和自己并肩作战，这要求在刚入职的时候就要察言观色。站队就好比进股市，最重要的目标是保本，不发生损失，然后是取得收益。所以，在站队前，要先想到最坏的可能，即站队失败后，怎么才能保住现在的位置。看清自己的利益在哪，而不是随大流。每个人所处的位置不同，自然职场利益不同，随大流的选择未必对自己最有利。要跟着与自己价值观一致，风格匹配的上司。只有跟自己有同样的追求，并且做事风格匹配，能给予支持的上司，才能对自己在职场的长远发展最有利。


    刚入职时，不妨察言观色、熟悉环境，可能不知不觉哪天你就已经在大家心目中树立起了良好的形象。这种影响是潜移默化的，但是却会相当的根深蒂固。这样才是一个聪明的人！'
  merge: -1
  img_proc: true
- pgno: 1188
  md: '职场站队很常见。因为一朝天子一朝臣，任何管理团队的负责人或团队的主要成员的交替更换，必然带来“企业血液”的流动和更新。当“换血”势在必行，相应的大环境下的小圈子、小团体行为，导致职场站队不可避免地出现。面对这种职场站队现象，总结出以下经验：


    +   站队就好比进股市，最重要的目标是保本，不发生损失，然后是取得收益。所以，在站队前，要先想到最坏的可能，即站队失败后，怎么才能保住现在的位置。


    +   看清自己的利益在哪，而不是随大流。每个人所处的位置不同，自然职场利益不同，随大流的选择未必对自己最有利。


    +   审时度势。给博弈的双方或多方打打分，看看谁的胜算更大，站队自然要跟胜算大的人。'
  merge: -1
  img_proc: true
- pgno: 1189
  md: '+   4\. 跟着与自己价值观一致，风格匹配的上司。只有跟自己有同样的追求，并且做事风格匹配，能给予支持的上司，才能对自己在职场的长远发展最有利。"


    +   5\. 如没必要，最好“避而远之”，安心想实地做好本职工作，努力提升个人竞争力，比起一心钻营站队之术才是王道。


    # 职场没有靠山怎么办？


    “靠山山会倒，靠水水会流” 对于上班族来说，想要在职场上立足，不能一味的依靠别人。如果你光想着做寄生虫而缺乏相应的独立意识，那么你依靠的人一旦离职或是调任，很可能就会让你陷入举步维艰的境地，甚至会因为工作能力或是人际交往的'
  merge: -1
  img_proc: true
- pgno: 1190
  md: '不足而受到身边同事的排挤。想要打好职场生存保卫战，除了靠山之外，更多的则要依赖自身的价值。


    经常在职场见到这样一类人，他们不拉帮结派，不参与内部竞争。平时看起来不显山不露水的，可是到真正生死关头，却往往能起到决定性的作用。没有稳定的靠山，没有信赖的团伙，可是这类职场人却依旧能站的很稳。他们靠的是什么？不是所谓的靠山，而是自身的实力。


    曾看到过这样一则小故事，说的就是靠山的问题。刚看的时候没什么感觉，可是细细品味才发现其中句句是真理。故事是这样说的。一天一个同事和主人公聊天，同事问：“如果让你选的话，你觉得公司最大的靠山是谁”主人公不假思索的便说了总经理。同事回他说，不对。于是他非常的疑惑了，在整个公司里面总经理说一就没人敢说二，总经理做的决定没人可以推翻重来，可为什么最大的靠山不是总经理呢？'
  merge: -1
  img_proc: true
- pgno: 1191
  md: '想了半晌主人公还是想不出个所以然来，遂郁闷地问道：“不是总经理最大，那么谁还可以是我的靠山呢？”同事的回答出乎他的意料之外。同事说：“最大的靠山是你的价值。你自己如果没有能力，今天总经理在这里，你能站得住脚，那么明天假如换了新的总经理呢？你要怎么立足呢？”


    时间已经过去很久了，虽说不能完全的记住故事的内容，但是其中的道理还是非常深刻的。正如故事中所说的那样，人最大的价值是自己的才能。如果你光想着依靠别人而没有一定的能力的话，那万一哪一天你的靠山走了，你又该怎么办呢？是灰溜溜的走人，还是拉下脸皮在公司里忍受别人的说三道四。


    可是如果你有价值的话，那就不同了。有能力、有经验的你，一旦在公司里过的不顺心，就可以辞职去更好的地方发展。只要你能把自己的能力展示出来，且薪资要求较为合理，想必用人单位老板都会欢迎你留下。而且如果在以后的工作中为企业创'
  merge: -1
  img_proc: true
- pgno: 1192
  md: '造了价值，那你还能有和老板谈判的资本，到时候得到的会更多。


    在职场上不要总想着去找靠山，拉队伍。有那些时间，你还不如多看两本书或是多学一个技能呢。要知道外界的所有都是虚的，都可能一场风暴或是一次变动而消失殆尽。而你学的却永远是你自己的，谁也偷不走抹不去。与其追求那些水中月镜中花，还不如多将功夫用在更为实际的地方，没有人能比你自己的能力更为可信。


    # 与小人共处有术


    有是非的地方必然会有小人，你可以不做小人，但请别太善良。你也可以善良，但至少别那么容易相信人。问题不在于身边小人太多，而在于防备心不够，你总以为，每个人都是好的，大家都是有做人底线的。为什么你不想做小人，但小人却总能爬到你头上？


    1、小人更容易受到上司的喜欢'
  merge: -1
  img_proc: true
- pgno: 1193
  md: '小人为什幺总能爬到我们的头上？这是上班奴们遇到最困扰的问题了。要弄清楚这个问题，首先我们要明白一切的根源。


    当大部分上班奴们觉得，工作能力是职场最重要的事情时，小人们却已经发现，更重要的其实是上司。所以，你们在努力工作，而他们则在巴结上司，这是重心的不同，而最后的结局自然也不同。


    小人们为什么容易获得上司欢心呢？就因为他们是没有底线的，这和普通人不一样。普通人受道德底线约束，受家庭和社会教育约束，许多话说不出来，事情做不出来。而小人们却不同，他们可以阿谀奉承，可以说假话，可以顺着上司喜欢的话说。在做事情方面，他们愿意把上司的利益放在首位，甚至把上司的私事当做公事来做。


    千万别天真的幻想，上司可以看穿小人的居心。小人在你们面前，和在上司面前是不同的嘴脸，所以，基本上所有上司都会被蒙蔽过去，以为他们才是真正的好人，是真正的亲信。所以，上司们会把小人当做真正的贴心人，而其他说实话办实事的'
  merge: -1
  img_proc: true
- pgno: 1194
  md: '人，因为看不到，不了解，所以都会逐渐的疏远。


    +   2、 小人更会打压对手。


    小人除了巴结上司以外，还有一招就是打压对手。对上讨好，对下打压，才是一个完整小人的表现。


    如果巴结上司一样，他们打压对手也是不择手段的。为什么坏人总是赢，好人总是吃亏呢？就因为好人有底线，明明可以防备的事情不防备，明明可以反击的不反击。即使是占上风的时候，也不知道趁胜追击，可等到落了下行，小人却最会落井下石，把你打到再也翻不过身来。


    所以，只有你对小人的仁慈，没有他对你的宽容，到最后，受伤失败的，必定是好人。所谓好人有好报，不过是人们善良的愿望，却一定成不了真。


    +   3、 小人升职是最快的。


    小人升职怎么可能不快呢？他们一方面巴结上司，一方面又打击竞争对手。上有人替他们说话，下面也没有对手竞争，那升职的机会就一定他们的。


    如果我们仔细分析的话，小人这种生物，就是为升职而生的。而反过来讲，升职的最佳捷径，无疑就'
  merge: -1
  img_proc: true
- pgno: 1195
  md: '是做小人。他们在职场里的一切重心，都不是为了干活，也不是为了创造价值，只是为了让自己获取更大的权力。你用八小时干活，别人却用八小时来往上爬，最后的结果自然不一样。


    # 4、得罪小人最危险


    历史经验告诉我们，得罪小人是危险的。即使他和你的平级，甚至还是你的下属，去得罪他总会承担比平时更多的风险。原因无它，就是因为，小人升职是很快的。今天你和他平级，得罪他之后，可以忍你。可明天他却升职了，成为你的项头上司，那时候他还会忍你么？许多人在职场混不下去，并非能力不够，也不是没有智慧，只是没有前瞻性的眼光。他们看不惯谁就得罪谁，压根不管这个人的发展前途如何。


    但事实上，人和人还是不一样的，得罪任何人都有成本，而得罪小人的成本最大，也最危险。迟早有一天，他们会在你身上加倍讨回来，而且小人是不会心软的，他们会斩尽杀绝，直至把你打到翻不了身。'
  merge: -1
  img_proc: true
- pgno: 1196
  md: '# 给你一把钥匙——


    你可以不做小人，但请别太善良。你也可以善良，但至少别那么容易相信人。问题不在于身边小人太多，而在于防备心不够，你总以为，每个人都是好的，大家都是有做人底线的。小人其实并没有那么恐怖，他们的智慧没超过你，能力也不如你，唯一比你强大的是，他可以做你想不到的事情。


    所以，只要你足够的防备心，你可以保护好自已的利益，你能让自己的行事没有破绽，小人也不能拿你怎么样。你不一定要去做坏事，但至少，在别人使坏的时候，你要能判断，可以做出相应的回应。


    我的建议也很简单，既然这件事情还没有公布，就有挽回的机会。而既然你已经得罪了小人，就一定要得罪到底，否则等她真的爬上来，你就再也没有翻身之日。'
  merge: -1
  img_proc: true
- pgno: 1197
  md: '# 对付职场卑鄙小人的 7 种手段


    要避免被这类卑鄙无耻之徒伤害，防止被这类丑陋无比龌龊透顶的小人中伤，最好的办法就是远离这类卑鄙势利小人，不与他们为伍，不与他们共事，可事实上这是做不到的。因此，我们还应学会如何主动应对卑鄙势利小人的八种自我保护方法。


    1、、坚决不能将其列入好友名单。进了一个群体（如学校或工作单位等），在选择朋友时千万要把结交的朋友分成“三六九等”，根据不同等级的朋友采取不同的交往方法。而对于卑鄙无耻的这类小人，千万不能将其列入核心朋友或知心朋友名单，最好是连朋友的名单都不要将其列入，只要有表面上的礼节就可以了，防止在自己真心付出的时候受到伤害，更避免自己会遭到这类人的致命暗算。


    2、避免与其商议重要核心问题。每个人都会有自己的隐私或者是相对重要的问题需要得到朋友的意'
  merge: -1
  img_proc: true
- pgno: 1198
  md: '见和建议，如果是领导更会有公事或业务上的重大决策需要事先听取意见，这时，要尽量避免让这类“成事不足败事有余”的人参与进来，他们肯定不会帮你保守秘密，他们会为了显示自己能够比别人掌握更多的核心机密而到处显摆，为显示自己与领导的特殊关系或地位而沾沾自喜。


    +   3、避而远之或者说是躲之不及。对于卑鄙无耻的势利小人，由于他们经常采用“人前一套背后一套”的阳奉阴违手法，一方面千方百计地打压竞争对手，给竞争对手制造很多生存困难，另一方面又会想方设法溜须拍领导的马屁，因此，这类人一般来说都会得到领导的信任和重用，有的是你的直接领导，有的是你的工作拍档，有的是你的同事。怎么办？既然在工作和生活中无法与他们隔绝往来，那么，你可以在面对这些人时，惟一能做的就是尽量不要或减少与他们的来往，尽量避免或减少和他有工作或生活上的接触，尽量不要把自己的隐私透露给他。'
  merge: -1
  img_proc: true
- pgno: 1199
  md: '4、团队组建时坚决弃用这类人。俗话说 "一粒老鼠屎会毁了一锅粥"，如果说一个团队要有战斗力，首先这个团队的每个人都应有团队精神、合作精神、奉献精神，而卑鄙龌龊之徒首先考虑的并不是团队的战斗力和团队的聚集力，他们往往更多考虑的是自己在这个团队中能够得到多大利益，他们想得最多的是如何算计同事而能让自己名利双收，有时，他们会为了自己的蝇头小利而毫不犹豫地不惜牺牲团队和集体利益，这就是这类人的可怕之处，因此，这类人不可避免地会成为一个团队中的
    "老屎尿"。


    5、做足防火墙防卑鄙小人破坏。对于这种卑鄙势利小人，我们心中应该有杆秤，与这类人打交道时，害人心不可有，可防人之心不可无。对于这类人，你千万要记住祖宗传下来的那句
    "为人只说三分话，切莫全抛一片心" 的至理名言，要不然你会死得很惨，而且你还不知道自己是怎么死的。'
  merge: -1
  img_proc: true
- pgno: 1200
  md: '对付这种人的最好方法就是只听不说，心里时刻更新防火墙，时常提醒自己不要轻易暴露自己的真实思想，特别是对领导或朋友有什么想法，千万不能让这种卑鄙小人知道而去造谣生事和搬弄是非。


    6、择机提醒领导防范卑鄙之徒。对于被领导重用的卑鄙无耻的小人，记往千万不能在领导面前直接述说其卑鄙之处，你这样做往往会收到适得其反的效果。大多数领导会认为你是在怀疑领导的用人标准，是在怀疑领导任人唯亲，是在怀疑领导的工作能力，这是领导相当忌讳的“死穴”，有的领导还会认为你是在嫉妒和吃醋，从而怀疑你的人品人格是否存在问题，进而最终会影响到你在领导心目中的印象。最好的办法就是选择合适的机会，针对某一件没有做好的事情帮助领导分析原因，可以隐约告知领导某人在单位里的为人处事情况，如为什么得不到同事的协助等等，潜移默化地影响领导对其信任程度。'
  merge: -1
  img_proc: true
- pgno: 1201
  md: '7、当面对质和搞臭其生存环境。还有一种方法就是当你听到卑鄙小人在散布谣言或胡说八道的时候，可以让其在散布谣言的范围内进行当面对质，就是要让他下不了台阶，让他感到无比的难堪，让圈子里的人知道他喜欢搬弄是非，让大家知道和他的交往应该时刻提高警惕，让这种人没有随心所欲的生存空间。


    # 和领导关系的四个不同层次


    一提起下属和上司的关系，很多人都喜欢把它庸俗化。认为下属和上司搞关系，就是巧言令色、溜须拍马、结党营私，是为人不齿、见不得光的事。其实，下属和上司本身就是一种关系，是客观存在的，不是想搞不想搞的问题，而是如何把它搞得更好的问题。


    1202'
  merge: -1
  img_proc: true
- pgno: 1202
  md: '按照孔子的理论，我们不妨也把下属和上司的关系分为四种：共事、共求、共创、共享。


    第一个层次，共事。也就是说，上司和下属的关系完全是工作上的领导和被领导的关系。八小时之内，上司派活，下属干活。八小时以外，各回各的家，互不相干。这是最简单的一种关系。这种关系下，上司对下属往往用称职和不称职来评价，下属对上司一般用可敬不可敬来形容。


    第二个层次，共求。说白一点就是上司和下属有共同的追求。这个追求包括工作上的追求，人生上的追求，或其他方面的追求。有了共同追求，上司和下属自然会有很多共同语言，在共事的基础上，可以一起谋一些事。能够和上司共求的下属，一般都是比较有思想、有主见，敢于表达自己的观点，善于为上司出主意、想办法的人。如果上司和下属有了共同的追求，工作关系就会更进一步。上'
  merge: -1
  img_proc: true
- pgno: 1203
  md: '司会把下属视为贴己，下属会把上司看作知音，相互支持共谋前程。这种关系下，上司对下属会用可重用和不可重用来衡量，下属对上司则会用可信赖不可信赖来比较。


    第三个层次，共创。共创什么呢？当然是共创大业。如果说第二个层次关系上，上司对下属是任用，那么到了这个层次，上司对下属就是依靠了。如果说第二个层次关系上，上司重用的是下属的才，那么到了这个层次，上司依靠的就是下属的德了。处于这个层次的上司和下属，基本上没有上下级的严格分别。上司对下属是绝对信任，言听计从；下属对上司是无比忠诚，肝胆相照。两人可谓是同进退、共荣辱。这种关系下，上司对下属会用可依靠不可依靠来检验，下属对上司则会用可追随不可追随来度量。


    第四个层次，共享。共享什么？共享“蛋糕”，甚至共享切“蛋糕”的“刀子”。这个时候，上司'
  merge: -1
  img_proc: true
- pgno: 1204
  md: '和下属之间通达权变，不分你我。所以说，下属和上司之间的关系，并不是平常我们认为靠吃喝送礼形成的那种庸俗的关系。这种庸俗关系也有，甚至很盛行，但层次不会高，最多比第一个层次稍高一点。而要达到第二、甚至第三、第四层关系，则须用心、用情、用才、用德。把下属和上司关系庸俗化的人，表面看很会搞关系，其实根本搞不到点子上。


    # 上司挡了晋升路，怎么办？


    管理是一门艺术，不是所有的上司都有这一手。不要指望你碰到的上司都是懂得授权、乐意提携你的管理高手，有些上司就是你晋升路上的路障，你必须懂得如何与他们过招。'
  merge: -1
  img_proc: true
- pgno: 1205
  md: '# **缺乏安全感上司**


    有46%的新经理属于没有安全感的管理者，他们习惯将所有权限或大大小小的事情捏在自己的手上， 匿藏重要的工作信息，希望手下员工离不开他，只有这样，他们才有“稳坐钓鱼台”的安全感。


    他们很少授权或者根本不懂得授权的意义，情愿自己忙得像陀螺，也不愿意给团队成员指派工作安排员工可能，更谈不上指导或培训。这类上司喜欢受命执行、听话、不好挑战其权威的员工，更有些人
    从不雇佣比他们聪明的人，他们的团队就是“白雪公主与7个小矮人”。


    # **一句话对策：给上司时间与鼓励**


    管理学家研究发现：在现任主管、经理中，有40.8%的人因为不适应从个人贡献者到管理高手的转变而夭折，不得不“打回原形”。他们对专业、细节 的过分关注导致失去对整体的把握。对于这类上司，你的应对之道可以是：'
  merge: -1
  img_proc: true
- pgno: 1206
  md: '# 认可他的角色


    缺乏安全感的上司，多缺少自信心，他们或许是“不小心”被提拔为管理者，尚未做好心理准备；或者是对新角色缺乏认知，不知道如何驾驭管理岗位……不管是哪一种原因，你必须认识到：每个人都是从不会到会的。建议你给新经理时间和空间，即使他们的决策在你看来是错的，你也要学会去理解他们的本意，认同他们的角色感和所说的，然后以委婉的方式提出你的想法。


    # •建立信任感


    新经理们就怕别人或下属不把他“当回事”，因此，你要多向他们请示、汇报，哪怕是一些你认为“老掉牙”的事情。你可得注意，新经理往往是从专业岗位升上来的，他们对于诸多事情的来龙去脉并不知晓，如果你能耐心地向他们解释，相信他们一定会视你为知己。'
  merge: -1
  img_proc: true
- pgno: 1207
  md: '新主管、新经理希望拥有 “一切尽在掌握中”的感觉，你就满足他们吧！做事前，不妨告知你的行动方案，不要让他们有事后才知道的感觉。如果你做什么都要让他知道，相信过不了多久，他们就会放松对你的
    “步步紧逼”，把你视为是 “TA 的人”。


    # 发现他的盲区


    每个人都有软肋或不感兴趣的领域，建议你仔细留意和分析他热衷或习惯控制的领域，然后主动接下他们不愿意或者不屑做的事情。所谓的 “各取所需”，如果你再在他们面前强化他们
    “感冒” 的细节点，他们自然会依赖你、习惯 “利用” 你的价值。当你被需要，并拥有被利用的价值，你自然会步入红地毯。


    1208'
  merge: -1
  img_proc: true
- pgno: 1208
  md: '# 如何做个厉害的领导？三句话总结到位！


    其实在职场中，如何做个成功的、厉害的领导是个很大的命题。但是无论这个命题有多大，在我看来，以下三个关键是放之四海而皆准的。甚至来说，如果你是一个有野心的员工，想要升职，那么以下这三句话你更应该看看。


    +   1. 劳心不出力，有功无过，有误可推'
  merge: -1
  img_proc: true
- pgno: 1209
  md: '以前才进入职场没多久，发现那些领导每天上班几乎都不做事，有事也是安排给自己的手下。当时我就觉得，领导真好当，只不过是耍耍嘴皮子的功夫。后来工作多年了以后，事实远不是我看到的那么表面。


    有句话叫， 劳心者治人。职场中领导之所以只是耍耍嘴皮子，而不做具体的事情，其实原因无非是两点，第一，自己出主意，别人去做，出了事情可以推的一干二净，能够自保。第二，给别人出主意，别人做的好自己功劳也少不了，而且花费的时间极少。从投入产出比来看，非常划算。


    所以在职场中，想要利于不败之地，要有功劳，首先要尽可能少少犯错，但不是说少做事就不犯错。做事少了功劳同样也少。应该是给自己设置防火墙，有出错能够减小对自己的伤害，有功劳也能不少自己的份。'
  merge: -1
  img_proc: true
- pgno: 1210
  md: '# 2.  闲思不忙碌，有人敢用，要有重点


    很多人说公司领导很闲，不做事，每天就是上网看报纸喝茶。其实我要说这样的领导才是好领导。为什么呢？首先一点，如果领导很忙，那么他必定是没管理好自己的下属。第二是，领导很忙，没有把自己的下属给用起来。第三是，如果领导很闲，那么工作中必然是问题很少，各种事情很顺利，不用他去亲自管理。你看万科的玉石，当着董事长，全世界到处跑，万科不照样运行的很好吗？所以你看一个领导水平高不高，有个很简单的办法，就看他每天忙不忙。


    话说的好，浑身是铁又能打几根钉。职场中，一个人能力再强也很有限，毕竟时间就这么多，只能做了这么多事。所以想要成为一个厉害的领导，首要一点就是要能用人、敢用人，让员工帮你做工作。而自己同样也要关注工作，但是并不是说所有的事'
  merge: -1
  img_proc: true
- pgno: 1211
  md: '情都要去做。而是要有重点的选择。比如能给自己带来业绩的、能提升自己能力的事情等等。


    一个人在职场中的成就，并不取决于他一共做了多少事情，而取决于他所做事情中那最重要的 20%。但是往往大多数的人，都以为要多做事。其实应该多做那些重要的事。至于其他的事情就要交给别人来做。所以，一个领导想要做好，不能只依靠自己，更要依靠员工的力量。


    +   3. 唯上不偏移，有山可靠，位置坐稳


    为什么人在职场想要升职？很多人说是为了有更多的工资。我并不认同这种说法。我自己的观点是，升职是为了获得更多的权力，能够让别人听你的话，给你做事，当然事情做的多了、做的好了，钱也自然的会跟看来。'
  merge: -1
  img_proc: true
- pgno: 1212
  md: '那么职场中，权力的来源是哪里？不要说水能载舟亦能覆舟这种话。职场中，领导的权力来源，来自于他的上级领导，而不是他的下属。不是有句话叫，说你行你就行，不行也行吗？一个领导，如果在职场中没有更高层的领导支持他，绝对是做不长的。


    所以，在职场中想要成为一个厉害的领导，首先一点是必须维系好与自己上级的关系，让自己有靠山，有人支持才行。具体的做法就是，贯彻、落实、执行上级领导的指示，不要对着干。把上级领导安排的工作优先做了。不要觉得这是奴性，在职场中，你想做事想做成事，这是一条必经之路，毕竟只有活下去、坐稳了，才能实现你的理想和抱负。


    想一想明嘉靖、隆庆、万历年间抵抗倭寇和外敌的胡宗宪、戚继光，为了完成这些目标，不也是奉承了奸臣严嵩、权臣张居正吗？


    1213'
  merge: -1
  img_proc: true
- pgno: 1213
  md: '而你想升职，个人能力固然重要，但是更少不了领导的提拔和赏识，这个毋庸置疑。


    # 升职的核心秘笈'
  merge: -1
  img_proc: true
- pgno: 1214
  md: '对大多数人来讲，工作是实现人生价值、提升社会地位、改善人生活水平的主要手段。升职也是大多数人的梦想，因为它意味着更广阔的平台、更高的社会地位和更加丰裕的生活。但很多人想升职并不懂升职之道，因为他们不会总结。当然，更多的人懂一些，但他们不能付诸行动并坚持。其实，只要勤于总结、勇于行动、善于坚持，实现我们的人生梦想也许并没有我们想象的那么难。


    # ## 一、胜任你的工作


    这是升职的一个基本条件。美国学者劳伦斯·彼得在对经济组织中人员晋升的相关现象研究后，得出一个结论：在各种经济组织中，雇员总是趋向于晋升到其不称职的地位。也就是说，只要你能胜任自己的工作，原则上还有向上走的可能性。当然，胜任工作其实需要四个字：敬业、专业。


    # ## 二、给老板面子


    在中国，“面子”是人际关系的总开关，面子是可以买卖、存储、转换的。总的来讲，只有你给别人面子，别人才会给你面子。你给足了领导面子，领'
  merge: -1
  img_proc: true
- pgno: 1215
  md: '导也许会用另外一种方式回报你，那就是把你摆到更重要的位置，让你也更有面子。


    # 三、寻找职场中的贵人


    王立群说过：“人的成功有三条路径：高人指点、贵人提拔、小人监督”。在职场中，能不能得到关键领导的赏识至关重要。工作中一定要想办法引起领导的重视，进入领导的视野，然后通过一些公关手段和领导保持交往和沟通，时间长了，必有斩获。


    # 四、与顶上上司处好关系。


    其实，顶上上司对你的评价至关重要。要处好与顶上上司的关系，最核心的是要尊重他，要多向他请示汇报，要认真执行他的各种指示，做到“到位而不越位”。让顶上上司想到你时，一定要有一种“给力”的感觉。


    # 五、增强执行力。


    一个好的员工一定是善于“做事”的人。一个好的员工能准确理解领导的意图，在执行的时候却能发挥自己的主动性和创造精神，甚至在领导布置错了'
  merge: -1
  img_proc: true
- pgno: 1216
  md: '的时候了能主动调整，将其执行正确。对一名好员工来讲，执行力是其它一切能力的基础，没有这个能力，其它一切能力都没有多少价值。


    # 六、达成目标


    不管你的执行力有多强，其实最重要的还是达成目标。管理的本质就是达成目标。这要求我们在做任何事情的时候，一定要不断地问自已：“我正在偏离目标还是达成目标？”当然，达成目标的能力需要我们学会系统思考、看透本质、找到核心驱动力，最后要能突破、能坚持。


    # 七、赢得“口碑”


    “口碑”很重要，实际上，当老板周围人的都在不停地讲你的好话的时候，你想不升职都很难。好的口碑开源于良好的品行。首先，做人一定要懂得注意别人的感受，如果做人引起了别人的妒忌，说明修养还不够，姿态还不够低；另外，一定要尽可能去帮助别人，对于你的下属，最重要的是要感动他们，并帮助他们成长。最后，要为下属做出榜样：古希腊色诺芬将军说过：“领导人无论倡导什么，'
  merge: -1
  img_proc: true
- pgno: 1217
  md: '只要表明他自己最擅长履行，就很少会遭到手下人的蔑视”。一个率先垂范，做出榜样的领导，毫无疑问会受到下属的尊敬。


    # 八、勤奋并且坚持


    这似乎是一个最笨的方法，却无疑是一个最有效的方法。日本经营之圣稻盛和夫给出一个成功学公式：成功=激情*能力*思维方式，也就是说，人的勤奋能在很大程度上弥补能力和思维方式上的不足，当然，如果是一种持续的勤奋，效果则更加显著，因为任何事情坚持的时间长了，一定会有很多我们预料之外的附加价值和叠加效果，最后成为成功最强大的推动力。


    当然，所有的职场规则都不是绝对的，一定要学会根据不同的人、不同的情景做出调整。最后，不但要重视规则，更要注重潜规则，中国是“潜规则”超级大国，真正发挥作用的，不是规则，而是潜规则！'
  merge: -1
  img_proc: true
- pgno: 1218
  md: '# 升职无望的五种人


    你进入职场江湖多年。别人该升的早就升了，该跳槽的也就跳了，你怎么就老悬在半中央？上下不是。哎，升职路真是慢慢又漫漫啊！当你遇到这样的瓶颈时，不妨好好反思，看看自己是否已经混进职场5傻？


    第一傻：伴郎型


    这种人工作任劳任怨，认真负责，可是你的工作却很少被人知道，尤其是你的上司。别人总是用你的成绩去报功，你内心也想得到荣誉、地位和加薪，但没有学会如何使人注意你，注意到你的成就。一'
  merge: -1
  img_proc: true
- pgno: 1219
  md: '些坐享其成的人在撷取你的才智后，你只能面壁垂泣。


    这种人的毛病不在于做不好工作，而在于不能充分展现自己。当你用心主动时，你的工作绝对是一流的！但你的处事态度始终像伴郎一样，不想喧宾夺主，也不想出人头地，这阻碍了你升迁晋级。


    第二傻：水牛型


    对任何要求，都笑脸迎纳。别人请你帮忙，你总是放下本职工作去支援，自己手头拉下的工作只好另外加班。你为别人的事牺牲不少，但很少得到别人的感谢与上司的赏识，背后还说你是无用的老实。在同事、领导面前不会说“不”，受到委屈，只好到家中发泄了。


    第三傻：抱怨型


    一边埋头工作，一边对工作不满意；一边完成任务，一边愁眉苦脸。让人总觉得你活得被动。同事认为你难相处，而上司认为你是干扰工作、爱发牢骚的人，被称之为“刺儿头”。结果升级、加薪的机会被别人得去了，你只有“天真”的牢骚。'
  merge: -1
  img_proc: true
- pgno: 1220
  md: '这种人的毛病不在于做不好工作，而在于不能充分展现自己。当你用心主动时，你的工作绝对是一流的！但你的处事态度始终像伴郎一样，不想喧宾夺主，也不想出人头地，这阻碍了你开迁晋级。


    # 第四傻：鸽子型


    这种人勤于工作，也有技术和才华，但别人升迁，加薪，晋级，你却只是增加工作量。对这种境遇，你早就不满了，但你不能大胆陈述、努力捍卫，而只是拐弯抹角地讲一讲。信息得不到传达，或根本被上司忽视了。一切全因你像一只鸽子样温顺驯服。


    # 第五傻：敌视型


    这种人不能说不自信，甚至说是自信过了头。在工作上很能干，表现也很不错，却看不起同事，总是以敌视的态度与人相处，与每个人都有点意见冲突。行为上太放肆，常常干涉别人。大家对这种人只会“恨而远之”，无人理会你的好想法、好成绩。


    1221'
  merge: -1
