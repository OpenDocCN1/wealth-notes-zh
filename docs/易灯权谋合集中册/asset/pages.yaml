- pgno: 688
  md: '己的节操去贪求。何远的妻子儿女遭受饥馁寒冷，他们的生活和最为贫穷的百姓差不多。何远从东阳免职回家，经过很长时间，但始终不谈及个人的荣辱，士人因此也就更加敬重何远。何远轻财重义，别人有急事他愿全力帮助，不说空话大话，这实在都是他的天性。何远常常开玩笑似地对人说：“你能找到我一句虚妄的话，那我就酬谢你一匹绫。”许多人在暗中窥伺等待，但还是找不出来。


    后来何远又被起用为征西谘议参军、中抚司马。普通二年，何远去世，死时五十二岁。高祖给他家很丰厚的赠赐。'
  merge: -1
