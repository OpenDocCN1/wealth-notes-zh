  md: '经对于职场人的心理状态有深入研究，特别是初入社会的职场新鲜人，根据他长期的研究观察，发现职场人在面对困难或挫败时，经常会出现七种自我毁灭的反应，而这些反应只会把事情弄得更糟。


    # 1 反抗


    当你被主管指出缺点或短处时，会出现反抗、不愿沟通的行为。 例如主管要大刀阔斧进行一项新计画，但是就有部属不断在开会时唱反调，甚至还振振有词地说无法进行；但唱反调的人，有不少是害怕自己能力不足或担心增加工作量。员工不是不能对主管提出不同的意见，只是在反对的同时，更应该提出确切解决方案，否则，
    就没有唱反调的资格。


    # 2 攻击


    当员工感受到威胁的气氛，会反射性攻击主管或其他同仁，以求 自保。最明显的例子就是开会时，当老板提到某人的进度应该加快时，这位仁兄说：


    **你自己在某个专案上不也是没做到**。否则就说：**当初你怎么不先讲清楚**？藉由反击主管来卸责，可能会让主管下不了台，这么做，只会加速死亡。


    # 3 合理化


    员工会举一些似是而非的理由，掩饰自己的过错、原谅自己，给自己找台阶下。职场中动辄见到这种把责任推到别人身上的人，而**千万错万错都不是我的错**。面对这样的员工，主管不妨事前就先声明、有问题事先讲。'
  merge: -1
  img_proc: true
- pgno: 1313
  md: '# 4 压抑


    每个人都觉得老板应该知道我心里想什么，但事实不然，老板跟同事并没有义务了解你的内心。但压抑型的人，因为害怕与老板、同事沟通，进而压抑自己的情绪，时间一久，有可能瞬间爆发出来。例如许多人离职前都风平浪静，但一决定离职后，整个情绪就突然爆发，甚至到处恶意攻讦。为了避免这种难堪发生，


    职场人千万不要害怕与他人沟通，适时提出自己的想法、疑惑，才能避免一发不可收拾，甚至再也没有安然步下台阶的机会。


    # 5 否定


    员工通常会以情绪上拒绝接受的态度，完全否认主管的指导，而不论客观的是非。例如跟主管的意见不一，就将对方的想法全盘推翻。


    # 6 转移注意力


    用东拉西扯的做法来隐藏自己的无能，意图转移焦点，这对你的处境不会有帮助。例如开会时老板问你：这个月的业绩为什么没有达成？你却回答：没错，喔对了，我那天碰到陈老板，他说我们另一个部门卖给他的系统有问题喔！


    # 7 动摇


    通常员工会故意表现对主管的需要，希望主管会看不下去而跳出来帮忙。例如某位女员工来公司一年了，每次碰到事情'
