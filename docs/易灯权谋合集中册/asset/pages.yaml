- pgno: 449
  md: '死流放的流放，如今还到了不得不依靠装疯卖傻来苟延残喘的境地。北平的人心会慢慢倾向他，天下人都会开始同情他。而且必先朝廷先动手，士兵们会感到：侄子连一个装疯的叔叔都不放过，简直灭绝人伦。这个时候的朱棣即使造反，也不会看成十恶不赦的乱臣贼子。


