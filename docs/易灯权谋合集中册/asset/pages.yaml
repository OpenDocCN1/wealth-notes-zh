- pgno: 661
  md: '霜雪。


    历史上最不被人理解的杰出人物也许就是屈原了。屈原对楚怀王竭尽忠忠，可楚怀王却听信谗言，疏远屈原甚至流放屈原，终于酿成了屈原“汨罗沉江”的惨剧。


    本篇中的主人公江淹亦属此类，他对宋建平王刘景素非常忠诚，却因一判乱事件被连累，遭及莫须有的罪名，因而，他要奋笔疾书，在书信中为自己伸冤。


    江淹真是幸运，因为他的主子建平王还是一个重情理的人物，首先，建平王重'
  merge: -1
  img_proc: true
- pgno: 662
  md: '情，他永远难忘从前江淹在他门下与他亲密相处的那些情节，他是一个恋旧的人。其次，他是一个重理的人，建平王一，不昏庸，他善于动动脑子想一想事情的来龙去脉，调查了解一个事件的真实情况，绝不冤枉一个好人。


    可历史上不幸运的人物就太多了，殷朝末年的暴君纣王残忍无道，他的叔伯父（纣王的庶兄）比干满怀对自家肉骨的忧虑和关怀之情，强行劝谏，却使纣王龙颜大怒。有人劝阻纣王，说比干完全是一番好心和忠心，但纣王竟说出这样的话：那我就把他剖开来看看'
  merge: -1
