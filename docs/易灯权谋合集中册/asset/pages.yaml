- pgno: 817
  md: '翻译：


    隐公为什么不说即位？是为了成全隐公的意愿。为什么说是成全隐公的意愿？因为隐公准备治理好国家，然后还政于桓公。为什么还政于桓公？因为桓公年幼却地位尊贵，隐公年长却地位卑下；他们之间尊卑的差别是很小的，国都里的人没有知道的。隐公年长而有德行，众大夫攀援隐公而立他为国君。隐公在这时要是不推行即位，就不知道桓公是否一定能立为国君；如果桓公立为国君，又恐怕众大夫不能辅佐幼君。所以，总的来说，隐公的即位，正是为了桓公'
