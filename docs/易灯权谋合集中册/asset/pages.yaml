  md: '一清二楚。时机成熟了，她便使用坑了。武则天头胎生了个女孩，皇后去看望，等皇后走后，她便掐死了孩子，偷偷的放在被里。一会儿皇帝来了，她佯装不知，皇帝要看孩子时，掀开被子一看，孩子已经死了。左右都说皇后来过，武则天放声痛哭。皇帝不能觉察，非常生气。有瘗皇后的意思。她够残酷吧，为了害人把女儿也搭上了。她又经常到皇帝面前诬告皇后，还造谣皇后和她母亲请巫师诅咒她。皇帝不再犹豫，下令瘗掉皇后，立武则天为皇后。这样，武则天用权术完成了她的第一个飞跃，顺利地当上皇后。


    取得皇后地位后她采取一迷二杀的方针。对高宗采取“痛柔屈不耻”，曲意奉承，极尽柔媚驯服，取悦皇上，并不感到羞耻，借此成就她的大事。这样的结果使高宗很高兴，觉得只有'
