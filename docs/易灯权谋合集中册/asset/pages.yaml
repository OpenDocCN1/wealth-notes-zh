  img_proc: true
- pgno: 8
  md: '# 斗争的实质在于制衡，制衡的精神在于适度


    > “大人虎变，未占有孚。’”


    人与人相处以和为贵，世界也以和平为正途，而斗争冲突是和平共处的手段，和平共处是斗争冲突的目的。


    写下这篇文章的目的并不是为了鼓励勾心斗角，只不过现实生活中有许多不平事，无妄祸。


    往往君子失意，小人得志，以致世风日下，为了成君子之美，驱小人之恶，创立一番事业，匡扶一股正气，于是写下这篇文章。


    天行有常，不以尧存，不以桀亡，残酷的现实是没有不变的朋友，只有不变的利益。我们有必要吸取春秋战国时代国与国斗争的经验，把无用的东西抛弃，有用的东西提炼出来，才能更好地纵横榷阖，自立自强于世界---既壮大了自己，又赢得了尊重。


    但有一点是关键；斗争的实质在于制衡，制衡的精神在于适度。这个世界上只有相对好的结果，没有绝对好和绝对坏的手段。可以为了一个光明的目标，用阴谋的手段来实现。


    人与人，国与国的关系有两种，协作和斗争，'
  merge: -1
  img_proc: true
- pgno: 9
  md: '两者相反相成。斗争是协作的手段，协作是斗争的目的。两者处于此消彼长的相对变化之中，平衡［斗争适度］则成就事业，失衡［斗争过度］败坏事业。掌握制衡原则，则有助于成就事业。而掌握制衡原则，就得从学会斗争开始。


    # 人性如水，兵势如水。 斗争的原理在于


    +   1。把握时机，


    +   2。利用敌人的弱点［包括性格上和形势上的］，


    +   3。因势利导，以己之长，攻对手之短。


    4。削弱对手，壮大自己。


    ［一］根据对手的性格特点使其暴露缺点，丧失正常能力。可有下列几种；


    对于个性多疑者，不妨多设圈套迷惑之，使其犹豫不决，丧失进攻时机。就象诸葛亮设空城计迷惑司马懿一样。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '对于刚愎自用者，不妨曲意奉承，使其逞强自伤，众叛亲离，失势而终。就象勾践应对夫差一样。


    对于心怯者，不妨虚张声势，乱而取之。就象前秦和东晋的淝水之战。


    对于骄横者，不妨隐藏自己，不断示弱加以迷惑，然后待其势弱时奇袭之。就象孙膑与庞涓的马陵之战。


    对于有勇无谋者，不妨简单设谋，对于性聪者，要么设奇谋，要么直接了当，打破常规，出其不意发动进攻。


    总之使对方暴露缺点，使其短之又短，疑之又疑。骄之又骄，怯之又怯。丧失正常的判断能力。从而发扬自己的优点。


    [二] 根据敌我形势，采用手段来破坏瓦解对手的组织结构和运作机制。


