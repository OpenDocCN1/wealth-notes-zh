- pgno: 524
  md: '气才可以更加冷静客观的分析局势才能给自己找到最好的定位点，以发挥出做自己最大的作用。暴躁总是会让自己处于劣势之中，而人在劣势之中很难正确自己的定位。建议不要有偏激的想法，平稳自己的心态。


    # 有全局观


    不要只站在自己的立场上看问题想问题，要全方位的去思考。只有全面的思考才会有准确的定位。特别是在团队作战的时候，不能以自我意识为中心。其实简单的说没有全局观的表现最明显的一点就是看不惯别人。一个拥有自己的准确定位的人是不会有一种看不惯别人的想法。


    # 有主见


    要有自己的主见思维不能轻易的被别人所左右，要有自己的是非观。如果连自己的主见都没有的话，小编表示是没有办法正确自己的定位的。因为自己都不相信自己，自己在自己'
  merge: -1
  img_proc: true
- pgno: 525
  md: '的世界里都给自己定位为配角，那在人生的舞台中你怎么演好这出戏?请坚定自己的信念。


    # ### 有证明自己的能力的


    能力总是可以一言不发的证明一切的，自己可以正确的审视自己对自己有一个正确的定位，可是别人不相信你怎么办？你会用自己的能力证明自己还有相信别人的说法才是对的呢?很多时候只是一念之间，要相信自己的能力，用能力证明自己的想法是正确的。


    # ### 能看到别人的优点


    生活中从不缺少美，只缺少一双发现美的眼睛。在生活中，你可以看到别人的优点吗？对于别人的有优点你是嫉妒还有学习呢？这些选择都可以让你对自己的定位变得不一样，对于这些问题你有不同的选择就会有不懂的自我定位。但是小编希望网友们能对自己的定位高一点。


    526'
