- pgno: 1294
  md: '上述是汉、明两朝开国君主的个性及行事风格，一个是开展型，一个是保守型，这两种作风，也影响了汉、明两代的组织——亦即管理的另一面向。本文的重点是领导者的特质，因此不拟在本文评述两朝的典章制度，只在刘邦、朱元璋两人的行事风格，稍论其发展的趋向。


    刘邦开国以后，杀害了彭越、英布、韩信三人，因为这三人虽是他围攻项羽的盟友，却也是必须消灭的对手。对于功臣，刘邦却是广为封赏。在天下初定时，功臣们猜疑，刘邦听取张良的建议，封雍齿为列侯。刘邦与雍齿一向不和，雍齿封侯，众心始定。此后功臣们都得封爵，汉初天下，遂是刘氏子弟为诸侯王，功臣为列侯，这是一个家族与功臣安天下的局面。汉初经过吕氏及七国之乱两次家族的内乱，都是功臣集团出力，保住了刘姓政权。功臣集团的实力，反映于丞相由列侯出任，中朝及郡国两千名大吏，历高祖至武帝初，习惯上都由功臣集团掌握。汉初政权的实力，不在皇室子弟，而在那两、三百家列侯的家族。武帝时，察举发展为制度，方由儒生及地方势力，构成专业文官的集团。是以汉初政，若用今日企业组织为比喻，那是一个创业董事长及其老伙计群结合的共同体。武帝以后，老伙计们逐渐隐去，才转化为专业人员（文官管理企业）的形态。汉代丞相的权力极大，也俨然有企业
    CEO 执行长）抗衡董事会之势。'
  merge: -1
  img_proc: true
- pgno: 1295
  md: '明初则不然。朱元璋规画的结构是皇子们各自有封地，这些宗藩分布边境及内地的冲要地区，握有相当财富与武力，以捍卫皇室。明初尽杀功臣，于是内外都是文吏，从来没有尺寸凭借，都只能仰皇权的鼻息。是以


    明初格局是一个家族企业，由创业董事长的子弟分别掌握权力，专业管理人员不过是雇员而已。永乐以大藩夺位，将朱元璋原来的布局打乱了，从永乐以后，宗藩唯享厚禄，不再分享帝国的权力，方出现了文官系统专业经理人。但明代没有决策的
    CEO，而是承命皇帝的秘书班子。这一朱姓家族企业集团，受制于其原来规划的结构，遂始终不能发展为专业经理人掌权的经营方式。


    总结言之，不论是历史上的皇朝，抑是今日市场经济的企业组织，其领导人的行事风格，在开创阶段，即不仅决定了企业能否成功，并且也会影响其后发展的格局与形态。本文由刘邦与朱元璋两人的性格及其规画为例，不过是借历史引喻譬解而已。历史并不全是过去的陈事，若是活学活用，历史仍有可以作为镜鉴的作用。不过，历史到底是过去的事，一个时代有一个时代的特殊背景，历史可为参考，却不能将历史当作规律。如何从历史汲取智慧，终究还是靠各人体会。运用之妙，存乎一心，千万不能胶柱鼓瑟！


    1296'
