  md: '应体现社会公众的利益，权术家们一旦确认制度的权威，必定会损害自己的私利。《三国演义》中诸方的首领，从曹操到刘备、孙权，从曹丕到司马懿，哪一个不是私心当头呢？


    # 王熙凤是玩弄权术的高手


    王熙凤是在封建特权中泡大的，她的祖辈既管外交，又管贸易，父辈又掌握了兵权，对于权的妙用，她耳濡目染，感受深刻。她从小就充男儿养，因而培养了两方面的才能：一是"
    从小就有杀伐决断"。所谓杀伐决断就是镇压别人、攻击别人绝不手软；二是心机又极深细（冷子兴）。所谓深细就是眼观八面，耳听四方，随机应变，见风使舵。有了权，又有才，于是就爱弄权。王熙凤深深懂得特权、地位、金钱三位一体的关系，她既要弄权，过那总是高人一头的权势瘾，还要通过弄权谋取私利，满足欲望。'
  merge: -1
  img_proc: true
- pgno: 32
  md: 她协理宁国府单纯是为了过权势瘾。本来事情并不是她分内的，而且又庞杂，连王夫人也担心她干不了，她却偏偏要揽到身上。你看她处罚那迟到者，多么神气！先是鄙：“原来是你误了！你原本比他们有体面，所以不听我的话！”次是打：“带出去打二十板子！”三是革：“说与赖升革她一个月的钱粮。”丧事完后，她用正话反说的语调向贾琏夸耀说：“珍大哥再三在太太面前跟着讨情，只要请我帮他几天，我再三推辞，太太做情应了，只得从命，到底叫我闹了个人仰马翻，更不成个体统。至今珍大哥还抱怨后悔呢。你明儿见了他，好歹配释配释，说我年轻，原没见过世面，谁叫大爷错委了她呢。”真是神来之笔，这段话可谓是话中有话，王熙凤弄权后那踌躇满志的神态跃然纸上。
  merge: -1
  img_proc: true
- pgno: 33
  md: 弄权铁槛寺是作者直接表明王熙凤弄权的半回书，同样也是谑事。不过这次弄权弄得大，既是过权势瘾，也是满足贪婪欲。铁槛寺的老尼姑请王熙凤帮助张家打通云南节度使的关节，毁掉一个婚约，开始也许是欲擒故纵，她表现得不太积极，但当老尼姑用了激将法后，她发了兴头，兴头从何而来？一是卖弄本事，二是想乘机捞一把，于是毫无顾忌地说出了“你叫他拿三千两银子来，我替他出这口气。”随后她竟然假造书信，打通关节，断送了一对未婚夫妻的性命，安享俩三千两银子。事后，作者叙述道：“凤姐胆识愈壮，所作所为，诸如此类，不可胜数。王熙凤的胆识是从生活实践中来的，她非常熟悉封建特权的魔力，她看清了封建统治集团成员之间的相互勾结，狼狈为奸的关系，她也学到了一套如何弄权的本领，权势之家的子女容易堕落，可以从凤姐这
