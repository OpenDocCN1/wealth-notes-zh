- pgno: 323
  md: '魅力，以致无法形成巨大的凝聚力，让大家团结在自己周围。刘项原来不读书，大功业往往是具有匪气的不学无术的无赖建立的，这也许是历史跟一向推崇“万般皆下品，唯有读书高”的民族开的天大玩笑吧？


    二，知识分子往往做事优柔寡断，缺乏魄力。


    乱世之中，要想造反成功，必须审时度势，当机立断，否则容易丧失大好战机。可是，由于知识分子读书太多，考虑问题往往较全面，前思后想，唯恐有缺漏之处。这固然有一定好处，但恰恰也是一个致命的弱点，因为世事往往难以十全十美，有时必须两害相权取其轻，大胆决策。等你考虑得万无一失时，最有力的时机已丧失殆尽，结果是竹篮打水一场空。不败而何？韩信就是这类知识分子的典型：当他的实力达到顶峰时，别人劝他背弃汉王，他优柔'
