  md: 用修颐和园的钱去训练一支海军，去购买一些先进的武器装备，去培养新一代的青年，那么我们的那场战争就不会是那个结果，甚至就根本不会发生。年轻的光绪帝深知闭关锁国的危害，他听从康有为等人的建议进行了轰轰烈烈的百日维新（也称戊戌变法）可是却因慈禧的阻挠被迫停止。这个新生的婴儿本来能给新中国带来希望与光明，却被慈禧亲手扼杀在了摇篮里。光绪帝也不得不又听从慈溪的言语行事。当义和团将愤怒的火把烧到宫外后，日军也由此入侵。慈禧却在仓皇出逃前杀死了珍妃。因为珍妃想把皇上留在京城与日本和议，慈禧命太监崔玉贵将其推入井中。在于各国纷纷签订丧权辱国的协定后，光绪帝突然驾崩。有人说光绪帝的死与慈禧有关，那么为何在光绪帝死后仅过二十小时慈禧就病故呢？又有人说这与宦官李莲英有关。一切的一切都是个
  merge: -1
