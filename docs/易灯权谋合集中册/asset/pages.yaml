  md: '因此，你必须适时的保护自己，并做某种程度上的反击，好让自己不被侵犯。这是需要战术的。但也不是要你变得跟那些人一样，为了保护自己不惜伤害别人。基本上，如果你不希望人家这样对你，你就不该这样对待别人。还有，即使反击成功，也得住意两人的关系是否已产生裂痕，要是一个不小心关系破裂，进入长期冷战的状态，那就得多花一些心思了。


