- pgno: 471
  md: '侍尧罪状书，计有：营私罔利，任意贪婪，李将上贡的珍珠卖与同知、知县等人索要银子二三千两，又复将珍珠收回；一皋司馈送李金如意三柄，李接着将金如意售卖给皋司得银五千两；一通判管理乐马厂，李逼勒他送银八千两。另据史料，李侍尧任所被查抄的资财，其金银、珠宝、洋货等共九百零一项。各类珍珠共二干颗，宝石及宝石料共一百四十多块，各类金器共重五千四百六十三两九钱一分，朝珠六十余盘，自鸣钟等洋货四十四项，玉器共一千余件。另有各类名人手卷、画轴、墨迹等共二百余个。同时，其家人倚主之势勒索诈骗的房产、资财等亦是不计其数。


