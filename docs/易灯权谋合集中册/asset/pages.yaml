- pgno: 839
  md: '贻曰：“久废过庭，不闻善诱，陟岵瞻望，惟日为岁。知以直道不容于时，棁山乐水，家于阳城。道近路夷，当即聘问，天状婴疾，阙于所仰。顷闻上帝震怒，贬黜鼎臣，人鬼同谋，以为天子当贞观二五，利见大人，不谓夷之初旦，明而未融，虹蜺扬辉，弃和取同。方今天地气闭，大人休否，智者见险，投以远害。虽匿人望，内合私愿。想甚欣然，不为恨也。愿怡神无事，偃息衡门，任其飞沈，与时抑扬。”顷之，帝崩。陈蕃为太傅，与大将军窦武共秉朝政，连谋诛诸宦官，故引用天下名士，乃以膺为长乐少府。及陈、窦之败，膺等复废。


