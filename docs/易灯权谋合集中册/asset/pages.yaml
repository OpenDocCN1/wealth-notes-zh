- pgno: 37
  md: '# 权术发展的历史


    作为政治斗争手段的政治权术，毕竟只是人类社会特定阶段的产物。奴隶时代的争霸斗争的需要促成了政治权术的迅速发展。


    封建时代权术逐渐走向成熟，成熟的标志首先是权术在政治斗争中的重要作用越来越被人们深刻认识。


    第二个标志就是政治权术的合理性逐渐得到封建统治者的公开认可。为了解


    除传统政治道德观念对权术的束缚，新兴地主阶级的政治理论家担负起论证权术合理性的任务。


    第三个标志是一批专业化的权变之士的出现。第四个标志就是权术自身的系统化和完备化。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '中国古代的各种基本的权术手段，到战国秦汉时期已经发展趋于完备。权术家族的各个成员，在这一时期的政治舞台上均已粉墨登场。以夺取君权为目的的政变之术、为专制君主服务的驭臣之术、欺骗民众的愚民之术、无耻的献媚之术、阴险的韬晦之术、卑劣的谗毁诬陷之术。。。。。。都在战国秦汉时期的历史中留下了各自独特的印迹。尽管后世的政治权术在运用方法和熟练程度上还有新发展，但就古代权术的主要种类而言，大概在战国秦汉时期就已经发展齐全了。


    汉朝以后政治权术的发展发生了新的变化。


    +   变化之一是：政治权术在政治思想领域显得更加虚伪。

    变化之二是：政治权术的运用场合发生了转移'
  merge: -1
  img_proc: true
- pgno: 39
  md: '并逐步扩展。


    变化之三是：政治权术与兵家权谋的分野日趋明朗。


    中国古代政治权术在汉朝之后所发生的变化，概括起来说，就是：政治权术在表现形式上趋于“道德化”；在运用范围上趋于“扩大化”；在方式手段上趋于“政治化”。这些变化反映了中国封建社会中后期政治斗争的一些新的特点，同时也标志着政治权术发展到了一个新的阶段。权术在历史中磨练成长，同时也留下了自己成长的神秘历史，经过漫长的历程，中国古代的政治权术形成了一种无形的网络，繁衍派生出了一个庞大的家族。


    政变是统治集团内部政治斗争的一种重要手'
  merge: -1
  img_proc: true
- pgno: 40
  md: '段。政变不同于其他的政治斗争手段，它是由统治集团中的一部分人所发动，以夺取最高统治权为目标，采用非常手段，在较短时间内，以较小的代价，完成政权的更迭。政变的这些基本特点，使其与一般的社会革命、军事暴乱、人民起义等有着明显的区别。


    中国古代的政变主要有几个特点：


    一是，就政变的目标而言，一般表现为直接夺取君位。最高的统治


    权集中为君权。君主对人民、臣属以及其他成员拥有生杀予夺之权。天下所有财


    富归君主支配，君主的金口玉言就是法律。君权的争夺就成为皇族成员之间以及统治集团'
  merge: -1
  img_proc: true
- pgno: 41
  md: '内部不同政治派系之间政治斗争的焦点。


    二是，就政变的参与者而言，一般是统治集团的上层人士。策划和


    发动政变需要一定的条件，决非一般人或者普通官吏所能为之。主要是皇族成员、天子近臣和朝廷权臣。


    三是，就政变的手段而言，一般具有冒险性和诡秘性的特点。


    四是，就政变的时机而言，一般具有随机性和突发性的特点。


    五是，就政变的后果而言，一般具有 “成者为王败者寇” 的必然结局及其相应的道德评价倾向。在中国封建社会中，对于政变的历史道德'
  merge: -1
  img_proc: true
- pgno: 42
  md: '评价是以胜利者的倾向为主的。因为历史总是由胜利者编写的。政变的成功与否，政变成果的巩固与否，成为封建正统观念评价政变者的主要标准。政变成功者，不论其政变的性质多么恶劣，动机多么可耻，手段多么卑鄙，仍然不持有开国君主的桂冠；政变失败者，则不论其政变的性质多么进步，动机多么高尚，手段多么光明正大，都难以逃脱人们对于“逆臣”的谴责。


    政变的后果和影响：


    政变是一种复杂的历史现象。自从它在人类社会政治斗争史上崭露头角以来，当权者为之恐惧不安，野心家为之心驰神往。政变不过是一种手段而已，脱离政变发生的时代背景和经济政治条件、脱离政变对当时社会发展所产生的后果和影响，就无法对政变作出正确的评价。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '政变是统治集团内部矛盾的一种爆发形式和手段，矛盾的焦点是争夺最高统治权。当社会矛盾激化、统治危机加深的时候，统治集团内部的矛盾也会趋于激烈。统治集团内部的不同派系，从各自的利益出发，在统治方针、政策和策略方面产生尖锐的分歧，各派政治力量企图通过夺取最高统治权来贯彻自己的政见。

    在这种时刻爆发的政变，往往会对整个社会产生广泛的影响，加速或者延缓历史前进的步伐。政变纯粹是统治集团内部权力再分配的斗争，政变的目的是为了决定皇帝姓张还是姓王，新君主应该是哥哥还是弟弟，如此而已。政变是在权力的诱惑面前，历代统治集团贪婪凶残本性的暴露。


    # 将魔术用于权术


