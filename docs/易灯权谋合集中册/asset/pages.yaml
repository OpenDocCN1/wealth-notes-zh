- pgno: 912
  md: '之学，有个前提，那便是对手乃一理智之人，此前提下方可明析情势，料敌于先，出奇制胜。不问对手，不审时度势，只是凭着权谋书，必定左右皆误，不但没学到权谋，倒先让摞书贼猜透了心思，骗去了钞票。一笑。


    # 找到领导者的“软肋”


    《韩非子*八奸》详细剖析了臣下为权为利而侵犯君主的权和利的八种阴谋手段，即八奸。并针对这八种奸术提出了相应的防范措施。


    看过韩非对八奸的阐述，第一个感觉就是"后人不长进"。从古至今，上至君主，下至一般领导，因着奸人之道而身败名裂的数不胜数，而前人已尽述说得'
  merge: -1
  img_proc: true
- pgno: 913
  md: '很清楚了，就是不长记性。这也是我在“领导术”之前先讲领导者软肋的原因。笔者在转述韩非的论述时，尽量结合现实，不求忠于原文，因此难免有断章取义之嫌，还请见谅。


    # 一、 “同床”：枕边风


    就是部下想方设法接近领导者的夫人[或丈夫]，或投其所好、或重金收买，利用其枕边之便，在领导酒醉色迷时，为自己的私利或阴谋做工作。“为人臣者内事之以金玉，使惑其主”，“乘醉饱之时，而求其所欲，此必听之术也”。最典型的例子就是“狗盗”的故事：孟尝君到秦国，秦昭王素知孟尝君之名，欲用为相，有人在秦昭王面前说了孟尝君的坏话，于是秦昭王便把孟尝君囚禁起来。孟尝君想办法使人去找秦昭王幸姬求解，幸姬不要别的贵重礼物，只想要白狐裘。孟尝君原有一件白狐裘，但已献给秦王，正在无奈，其门人中有一能为狗盗之徒，说可以偷回白狐裘。果然于当夜偷回。献与


    914'
  merge: -1
  img_proc: true
- pgno: 914
  md: '幸姬，幸姬大喜。于是在夜里与秦王饮酒取欢之时对秦王说：“我听说孟尝君是天下大贤，又是齐国的国相，现在我们把请来，不用也就罢了，还要杀他。岂不既得罪齐国，又有害贤之名吗。这样，天下的贤士谁还会再到秦国来呢？”秦王一听有道理就把孟尝君给放了。


    # 二、“在旁”：利用领导者的秘书或司机


    就是接近或收买领导者周围的亲信或“红人”，或在外为这些亲信、红人做非法之事，然后让他们去改造腐蚀领导，使领导看道。这些人往往为“好好好”“是是是”的主，深得领导的宠爱，他们做领导的工作往往比“枕边风”的技巧要高得多，效果自然也要好得多。这一招术，时下很是流行。不信你拍拍胸脯想想自己。


    # 三、“父兄”：利用领导者的亲属或言听计从、亲密无间的人'
  merge: -1
  img_proc: true
- pgno: 915
  md: "这些人的话，领导不仅愿听、常听，而且领导还愿跟他们商量事--说不定还是关于单位人事或重大业务的事呢。他们往往会领导的决策产生重大影响。让他们做工作是比较容易如愿的。\n\
    \n# 四、\x03“养殃”：投其所好\n\n领导者都是各自的嗜好的。养殃就是投其所好以腐蝕之。领导爱烟就送烟、喜酒就送酒、好色就送小姐，还有古董、字画等等，只要他喜欢，就可以送。这样领导就容易心满意足，也就会为你所用\
    \ 了。\n\n# 五、\x03“民萌”：假公济私，收买人心\n\n有的人喜欢用公家的财物去为大家谋福利，以搞好群众关系，赢得民心，并威胁领导的威信和权力。这就是民萌。很多人都是这么上来的。这种人很有"
  merge: -1
  img_proc: true
- pgno: 916
  md: '耐心也很有城府，却是最危险的炸弹。许多领导被架空就是这么来的。


    # 六、“流行”：旁敲侧击


    流行就是通过收买能言会道之人，为自己的私利去向领导游说。前面举的例子里，孟尝君因别人说他的坏话而遭囚禁。而这个人就是秦国的国相樗里疾。他恐怕孟尝君被重用，夺了他的相位，就让他的门客去游说。门客对秦王说：“孟尝君是齐国人，如果用他做秦国国相，他肯定会先齐而后秦。况且孟尝君乃天下大贤，筹划事情没有不中的，他周围又有一大批能干的门客，如果他利用秦国来为齐国做事，秦道可就危险了。”秦王拿不定主意，就去问相国樗里疾，樗里疾说：“他说得很有道理，我本来想劝大王的，又怕大王误会，说我妒贤忌能。”于是，秦王便把孟尝君给囚禁起来了。樗里疾的目的也得逞了。'
  merge: -1
  img_proc: true
- pgno: 917
  md: '# **七、“威强”：营造自己的势力，威逼领导**


    有的人利用领导脱离群众的毛病，精心营造自己的势力，形成“顺我者倡，逆我者亡”的局面，恐吓群众，同时威逼领导。或者利用自己的势力，使领导既怕他，又离不开他。曹操是这样，赵高也是这样。


    # **八、“四方”：利用外部力量来制约领导**


    有的人为了制约他的领导，还会利用外部力量，比如其他同级单位、企业的竞争对手，还有领导的领导来诱惑、威胁、压制他的领导，迫使领导着道就范。也就是里外夹击、上下夹击、左右夹击。


    这八条其实没有什么新鲜的，一说就懂、一点就明。但所有身败名裂的领导无不是着了其中的某一“道”或几“道”。说到底就是领导者对于“势治”、“术治”和“法治”的失控。'
  merge: -1
  img_proc: true
- pgno: 918
  md: '那么，如何才能避免自己的“软肋”被部下击中呢？韩非也给出了明确的回答：


    +   - 对于“枕边风”，就是“情爱是情爱，工作是工作”，不让情侣瞎搅和。古代不让后宫干预朝政，就是这个道理。


    +   - 对于亲信，精明的领导会严格限定他们的职权范围，督责他们的言论，不让他们擅自发挥。


    +   - 对于影响自己决策的人，在听取他们的意见时，一定要他们对自己所说的话负责。他们不会为了别人而伤害自己，因此他们就会谨慎从事。


    +   - 对于自己喜欢的东西，精明的领导一定会让他们有正当的出处，这就不至于上当受骗。


    +   - 对于为群众谋福利，精明的领导一定会作为自己分内的来对待，不使恩惠归于部下。


    +   - 对于部下的进说议论，精明的领导一定会利用自己的洞察力去辨明是非。'
  merge: -1
  img_proc: true
- pgno: 919
  md: '-对于强硬的部下，精明的领导一定不会让他们形成势力，而会防患于未然。


    -对于部下驱动的各方压力，精明的领导首先会防患于未然，再不然，也会兵来将挡、水来土掩，战而胜之。


    # 权利的最初来源


    组织当中到底由谁说了算，这个问题我们可以 在《西游记》中窥见端倪。唐三藏西天取经离开 长安的时候，唐太宗李世民想给他派护送部队，被他谢绝了，最后离开长安的时候只有两个仆人和一匹普'
  merge: -1
  img_proc: true
- pgno: 920
  md: '通的马。佛祖想到的是给唐三藏安排三个徒弟和一匹神马，于是一路上在五行山收了孙悟空，鹰愁涧收了小白龙，高老庄收了猪八戒，流沙河又收了沙和尚，取经的团队终于建立起来了。


    为什么要建立这个团队呢？原因很简单，唐三藏人单力孤，需要帮手，这就是组织建立的最初原因——协作以集中更大的力量达到目标。团队建立以后确定了权力结构和分工，三个徒弟有开路的、有牵马的、有挑行李的。


    有了这种权力结构和分工，组织才能朝着既定目标前进。


    西天取经实际上是一次外交上的胜利，每次遇到妖魔鬼怪时都需要孙悟空上天、入地、下海去请神仙搬救兵，这就是管理中的一个重要规律——到组织外部去寻求资源，强大的外交能力可以弥补自身的不足。尽管孙悟空能力非常大，但他终究是被管理'
