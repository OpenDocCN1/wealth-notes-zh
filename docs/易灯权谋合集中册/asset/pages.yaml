  md: '# 职场定位


    不管你是职场新人还是已经熟悉了职场的各种规则，想要游刃有余的在职场上生存，首先要做的就是对于自己的职场定位。所谓定位，就是明白当下自己的能力，能清楚的知道现阶段自己该做什么，不该碰什么；另外，就是要对未来潜力有所认知，这样在业务和技能方面的提升才更有方向感和针对性。其实定位简单的说就是明白自己有几斤几两，不要逾越也不要总是“包子”。


    如果你还不知道如何自我定位，那么就从下面这八大准则中找到方法吧。


    八大法则帮你职场自我定位 认清自己的能力和潜力


    # 资源法则


    资源是成功的基础条件。在生活中，大部分资源以物质形态'
  merge: -1
  img_proc: true
- pgno: 537
  md: '出现，如金钱以及其他所有能看得见的财产；一些资源以非物质形态出现，如知识、技能、思想、精神、理念以及自身的素质等；还有的资源介于两者之间，如人际关系、父母的传承或特殊的机遇等等。


    假如月收入是一百块，那就表明所拥有的资源在一百块的 水平上；假如月薪是一万块，那就表明所拥有的资源处在一万 块的 水平，包括能力、朋友圈子以及知识等。资源越使用它，
    它增值越快。比如说朋友资源，越爱结交朋友的人，朋友就 会越多，结交新朋友的机会也越大，成功的机会也越多。此 外，时间是一种需要特别珍惜的资源。合理地利用时间，做
    该做的事，就会离成功越来越近。


    # 长效法则


    不要只注重“杀鸡取卵”的短期效果。一个企业有短期的销 售目标，也会有长期的发展计划。职场中人也一样，不但要'
  merge: -1
  img_proc: true
- pgno: 538
  md: '有近期目标，也要有长远打算。许多人之所以不能成功、不能实现自己的梦想，往往并不是缺少能力，而是缺少正确的方向和明确的目标。成功者与平庸者的区别就在于：成功者始终有一个明确的目标、清晰的方向和十足的信心;平庸者却终日浑浑噩噩、优柔寡断，迈不出决定性的第一步。


    # ### 坦诚法则


    承认不足并将缺点转化成优点。做事先做人，把自己培养成一个道德高尚的人，不管事业成功与否，最起码人生是成功的。不断地改进自己的短处，才能不断地走向完美。需要注意的是：坦诚法则要灵活运用，否则会弄巧成拙。


    # ### 领先法则


    做得更好不如成为第一优越。在市场经济中，每个人也同样是商品，必须遵守这个法则。可在现实生活中，许多人不想当第一，或者不知如何当第一。他们往往这样想：公司也不'
  merge: -1
  img_proc: true
- pgno: 539
  md: '是我的，何必干得那么卖力。还有一种想法：工资又少，待遇又低，等找到待遇好的公司再“玩命”干。


    第一种人，不管干什么工作都不可能是最好的，因为他们没有积极主动地工作;第二种人，他们也许很有才能，但不想发挥。时间一长，很可能养成不好的工作态度，影响以后的职业发展。因此，一定要明确知道自己喜欢干哪类工作，选准方向后，就可以在该行业不断地积累资源，最终走向成功。


    # ## 成功法则


    用“成功”搏取成功。对于刚刚开始奋斗的创业者来说，营造成功者的形象尤其重要。对于形象来说，衣物的质量远比数量更为重要。检查一下衣橱经常会发现，有很多衣服只穿过几次，如果付两倍的价钱买一半的数量时，会发现很合算，并始终觉得自己处于一种最佳状态。


