- pgno: 1296
  md: '# 见招拆招破解办公室权谋游戏


    基于单位的本质，我们承认，这个世界的竞争激烈，所有单位都有政治权谋存在。员工会因此分心，无法全心工作，对于公司的承诺也随之减弱；比较专心一致的竞争对手则坐收渔翁之利。


    贱招不光会危及个人的事业发展，近年来各大单位、组织爆发的丑闻也和这些脱不了关系。


    单位深陷入围权力斗争和负面权谋的泥潭中。我们挖掘得愈深，就会发现愈多的权谋花招。这些招数为什么可以在我们的单位、组织中历久不衰？为什么能力架构、角色定位、愿景以及价值观无法让我们规避这种剥削？言行之间为什么有这么大的鸿沟？


    视若无睹、举棋不定、保持沉默再也行不通了；双手高举，宣称自己不搞权谋，也一样于事无补。耍弄权谋的管理者长久以来就是利用这种情形大出花样，诚如我们所说，拟定有'
  merge: -1
  img_proc: true
- pgno: 1297
  md: '效对策，预防和规避这些权谋斗争，会比较有收获，对每个人而言都是如此。


    # 人人都会揭隐私


    我们从小就学会揭人隐私，而且在成长过程中一再演练精进。我们小时候都会告状，并发现这一招可以迫使别人就范，而这也是揭人隐私的起源。我们也发现到，大人往往同意这种威胁的方式，让我们更加相信这是达成目的的好办法。除了大人同意之外，还能够打赢对手，在这样双重好康的吸引之下，也难怪我们会一再演练以便日后运用。


    当然，如果是为了全体利益，以及职责在身，那也无可厚非。如果小孩揭发同学打破学校的窗户，动机是为了保护学校和其他同学的安全与健康，这就是应该的，而不是耍计谋。不过，如果故意隐匿不报，只是借此威胁打破窗户的同学，或是要求回报（或许是要糖果），那么就是耍贱招。


    我们小时候如果出于善意而告发，却被父母、师长等人视为打小报告，甚至更糟糕的行为；这一点会对我们早年观念的建立造成混淆。等到我们进入职场时，已经知道这一招虽然有危险，但是能够奏效。不过别紧张，这种招数通常不会造'
  merge: -1
  img_proc: true
- pgno: 1298
  md: '成严重的后果，其普及程度超出我们的想像。


    若有人暗示：如果不配合，就会给我们好看。这个**好看**的部分就是计谋的开场白。如果是真心沟通，态度坚定的话，那么是透过公平的利益交换达成**双赢**。而**揭人隐私**则是威胁要公布我们的秘密，以达到**你死我活**的目的。我们必须避免这种伎俩对自身和公司造成伤害。


    简单来说，**揭人隐私**这一招就是公司里的勒索，我们只要有想要隐瞒的消息，不论基于什么动机，都会让别人有机可乘，对你进行勒索和威胁。不管是企图掩饰什么重大问题（接受治疗、发生意外、女儿滥用毒品、夸大自己的资历等等），对于想要计谋的人而言，都是利用**揭人隐私**这一招的大好机会。


    # **破解招数：开诚布公**


    所以我们的建议是：一开始就不要惹上这种麻烦！真诚和公开是最好的预防策略。如果已身陷其中，这个建议虽无济于事，但还是有挽回机会。


    这类招数在比较极端的情形下往往会构成犯罪，所以威胁要


    1299'
  merge: -1
  img_proc: true
- pgno: 1299
  md: '**揭人隐私**的人本身也面临极大风险，可能被反将你一军。**加害者**耍弄这一招的段数不论如何，其实是在赌你在压力和恐慌之下，不会注意到本身持有的筹码，以及此举令他们自己陷入险境。


    另一个策略就是抢在他们行动之前坦白。跟需要知道事情真相的相关人士**忏悔**，这样的沟通虽然困难，却能让威胁你的人无以为继。抢在别人揭发之前招供，知无不言，言无不尽，别人谅解和支持的程度会让你感到惊讶，特别是如果你的专业能力很强的话。这样一来，下回**揭发者**企图威胁你时，你就立于不败之地。只需告诉对方**真相已经大白**，他们再也威胁不了你。


    想想看，如果你的工作毋须**耍手段**就能顺利完成，会是什么样的光景？你可以省下多少时间？你跟团队伙伴和所属公司又能提升多少效能？增加多少收获？现在是著手改革的时候了！就让我们齐心扭转办公室政治的权谋文化，重新谈判政治契约。这项挑战已经开始，现在就让工于心计的职场小人无所遁形！


    # **做到这两点，就会很容易在职场升迁**'
  merge: -1
