  md: '原文：


    公何以不言即位？成公意也。何成乎公之意？公将平国而反之桓。曷为反之桓？桓幼而贵，隐长而卑；其为尊卑也微，国人莫知。隐长又贤，诸大夫扳隐而立之。隐于是焉而辞立，则未知桓之将必得立也。且如桓立，则恐诸大夫之不能相幼君也。故凡隐之立，为桓立也。隐长又贤，何以不宜立？立适，以长不以贤；立子，以贵不以长。桓何以贵？母贵也。母贵则子何以贵？子以母贵，母以子贵。《公羊传》'
