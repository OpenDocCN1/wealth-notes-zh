- pgno: 87
  md: '易举就能上钓，不用耗费多少时间和精力。在引诱方法上，则灵活多样，不拘一格。金钱、美女、官职、名誉、地位，各种物质待遇和精神享受，都可以作为诱饵，将“猎物”诱入陷阱，逼其“就范”。


    在众多实例中，有这样一件耐人寻味的例子：某单位有一个德才皆优的中年干部，自参加工作以来，十几年如一日，任劳任怨，工作上从未出过半点差错。在与领导接触时，他总能保持正常的工作关系，从不搞猥琐迎合那一套。于是，有个领导者，看上他的才能，想把他“拉”过来。经过仔细观察，他发现该中年干部，上进心强，好胜心也强。每当与他同期参加工作的同事，职务上得到晋升，他总要有几天不太高兴。针对他所需的“权欲”，该领导者采用了以下“引诱”方法：在一次研究工作的时侯，'
