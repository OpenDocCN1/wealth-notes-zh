- pgno: 1251
  md: '+   - 经营管理不是一套办法在各种情况下都能使用，也不是在同一家公司内部都可使用。


    +   - 在员工升迁的时后，不只要看他过去的工作记录，更要看他是认认同公司的经营理念。


    +   - 一个公司的成员应该要志同道合，所谓的志就是愿景，而道就是企业文化，但是道不同则不相为谋。


    +   - 什么是好的组织？我不赞成所谓金字塔型的组织，太过僵化。我主张流体型组织。


    +   - 一般的企业组织不可避免的会形成金字塔式的结构，但是这种模式的缺点，在下情上达时要经过数个层级，当最高层听到时不仅为时已晚，讯息也被「过滤」的只剩十分之一。


    +   - 金字塔式组织还有一个缺点，就是降低了各级主管在组织存在的价值。


    +   - 经常看到三个人就有一个人的管，这个附加价值很低，一个企业的层级越多，主管的附加价值也越低。'
  merge: -1
  img_proc: true
- pgno: 1252
  md: '+   v 实际上每一个组织都是不同的模式，不管是地方分权、中央集权或是团队力量，都不是绝对可行、放诸四海皆准的模式。


    +   v 革新性的扁平化组织，层级少，每个人管理的事情多，常常是十几个人向一个人报告。


    +   v 还有一种「流体型组织」，就是同层级的人可以管别人的事。


    +   v 这种互相参与的管理，可以建立开放的「建设性矛盾」环境，互动机会多了，很多问题都可以在同一层级之间解决。


    +   v 组织层级多，让二、三个人就有一个人管，不是训练员工的好方法。我认为理想的方式，好比现在有一个人都学会游泳，但还没实际游过长距离，我就会把他们丢到海里去让他们游一公里，不要找擅于游泳的人在旁边抓他的手带他游，但是有救生员坐快艇在旁边巡逻，看到有人快淹死了再去救。'
  merge: -1
  img_proc: true
- pgno: 1253
  md: '+   v 训练员工最好的方法，就是给他事情，也给他责任。理想的状态一个主管大概管七、八个员工，这个主管就好比那位坐着快艇的救生员。


    +   v 经营一个公司的三大基石为：愿景、价值和策略。


    +   v 假如以人作为比喻，有了愿景和价值再加上策略，就可以说是成功的人，一个企业也是如此。


    +   v 成功的策略规划包含十分之一的灵感，也可以说是策略形成，接着策略规划决定怎么做，再看看有多少资源和核心优势可以运用，最后就是执行的过程。


    +   v 经营管里是一门活的学问，不像物理或工程学，你学会了这些理论就可以解决问题。


    +   v 经营管理则是没有一套完整的东四传授给你应用，因为这些模式常常在变，而且变得越来越快也变得越来越复杂。


    +   v 组织伦理最重要之处就是责任归属。一个主管在做决策的过程中，无论是任何阶层，他可以去询问朋友或是同事，但是事情决定之后，责任一定在这主管本人身上。'
  merge: -1
  img_proc: true
- pgno: 1254
  md: 'v在决策过程中，有些主管常常有错觉，认为多数人赞同这个意见所达成的决策，就是最稳当、最没有风险的决定。


    v这样万一结果是对的，大家自然高兴，如果结果是错的，至少大家都跟我一样意见。其实这是错误的，你征询过的人很少会认错。因此有很多重大决定，参与决策的人要提出书面意见。


    v授权，主要的目的是为了授责，授责应该比授权要多。被授权的人要是没想到有授责的话，那就应该被授权。


    v在企业里通常授责的情形比授权多，授权好比是自己创造出来的地心引力，例如有人经过提拔被授权，可是他并不是马上就拥有权力了，而是要靠下面的人尊重你，才会开始有权。


    v在这种程序中，责任比权力要来的早，年轻有为的人勇于负责，权力才会慢慢进来。那些坚持先有权再有责的人，或是希望权与责一起来的人，到最后常常是二个都不来。


    v成功的企业家曾说，现在领导人最重要的工作是激励他的属下，做一个激励者。'
