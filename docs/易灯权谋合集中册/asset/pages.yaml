    当时民间流传这样一句话和珅跌倒，嘉庆吃饱，那么和珅这么多钱放到今天他在世界能排第几呢？


    按照当时的购买力来计算。根据清朝军机处档案记载，光绪十五年上半年直隶省顺天府、大名府、宣化府的粮价，以谷子、高粱、玉米三种粮食计算，平均每石计银一两四钱六分。“当时的一石是94.4公斤，那么一两银子大概就是70公斤粮食。按照现在的粮食价格，每公斤2.5元计算，那么一两银子就是175元人民币。在此基础上乘以11亿两白银等于1925亿人民币，换算成美元，根据目前汇率，大约等于310亿美元。这个数字在目前最新的世界富豪排行'
