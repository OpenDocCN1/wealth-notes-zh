  img_proc: true
- pgno: 141
  md: '马上打的跑到吕后的面前，一把眼泪一把鼻涕地诉说自己的不该和无奈。最后吕后放过了他。后来吕后要违反刘邦的遗命，封姓吕的为王。她问右丞相王陵，王陵坚决不同意，问左丞相陈平，陈平就一口表示坚决支持和拥护以吕后为核心的吕家统治集团。就这样，王陵被废黜，陈平上位，当上了右丞相。右丞相是站立在皇帝右手边的相，在汉代它是国务院总理，级别最高。


    陈平当上主相之后，假意纵酒狂歌、调戏妇女，让吕后放心地办她的事。就这样一直隐忍到吕后死去，才和周勃联手，一举诛灭吕氏，光复刘家。


    再反观韩信，心性高傲的他，即使是面对领导刘邦，也不肯恭维妥协。刘邦问他：“我能带多少兵马？”韩信直言不讳：“最多十万，否则就不行。”刘邦眯着眼睛笑问：“那么你呢？”'
  merge: -1
  img_proc: true
- pgno: 142
  md: '“我韩信当然是多多益善。”虽然最后给了刘邦一个“陛下不能将兵，而善将将”台阶，殊不知刘邦的笑容当中已经隐藏了杀机。韩信的心术，实在太正，直接导致他不能在这个政治舞台上更长久地演绎下去。


    不单只是在政治舞台，即使是泡妞，相信韩信也会输给陈平。陈平长得帅气，又有点坏，最讨女人欢喜。而韩信呢，在评价女人的身材时，必定会如实地说“你最多能戴个B杯”，然后在挨了一巴掌之后，还会直愣愣地说：“我说错了吗？”


    韩信和陈平都对恩遇自己的人忠心耿耿，是骨鲠之臣。但陈平善始善终，韩信悲剧收场。两人的差异，源于他们的心性。后世对韩信的赞誉，着重于对其军事才能，而对他的惋惜，则是在于他的情商太低。其实，这些评价，都只是隔靴搔痒。韩信是一个有着贵族气质的人，'
  merge: -1
  img_proc: true
- pgno: 143
  md: '这使他有着别于陈平的美德，他可以心狠，但干不来厚黑之事。陈平不一样，他的这一辈子，就是在这件事情上钻营，他根本不会考虑他追求成功的手段，是否戕害了人性的正义。


    后世的权谋家盛赞陈平的智谋，然而忽略了陈平思想中对人性的漠视；而道学家则指责陈平的“阴祸”，却要求人们去做圣人。执于一端，聚讼不休。但是却鲜有人去指出一条路，那就是更多的具有韩信之德和才的人，需要学习陈平的智术，才可以在这个世界上生存下去。这一类人，在今天就是知识分子。须知，推动这个世界进步的，不是革命家陈胜吴广，不是痞子刘邦，也不是那些虚无缥缈的“人民大众”，更不是成功的阴谋机器陈平，而是土君子韩信。


    # 铁腕权术女人


    说起慈禧，几乎每个人都会说她是一个历史上'
