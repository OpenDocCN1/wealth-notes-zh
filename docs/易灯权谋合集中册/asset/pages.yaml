  md: 意见下谕，留下了李侍尧一条性命。《清史稿》记载说：“屡以贪黩坐法，上终怜其才，为之曲赦。”第二年年 初，乾隆帝派李侍尧任陕甘总督镇压回民起义。具有讽刺意义的是，同年五月又任命李侍尧查办甘肃布政使王亶望折监冒赈案。李侍尧感恩不尽，效力自然不在话下。然而，乾隆这一赦免之举，更推动了地方大吏以进贡为借口的侵贪之风。虽然皇帝屡颁谕旨停止进贡，但臣工们的进贡就从来没有停止过。公事废弛，贿赂公行，官官相护，进贡成了各级官吏“升迁倚仗”的法宝，与进贡相伴的官吏侵贪对清代吏治产生了恶劣的影响。
