  md: '勉励朋友要成为强中手，就要经得起磨。把每一次的挫折与痛苦，当作磨练自己，不要执着在一堆烂泥中，泯灭了自己的能力，不断的转换，不能的吸收，才能成为更棒的领导者。


    所以你要让人家认为是"不会用人"，而不是用不对人。柔软不代表软弱，无言不代表妥协，日后的成就留待时间验证吧！


