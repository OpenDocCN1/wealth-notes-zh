- pgno: 174
  md: '这样的老同志亲自出手。可以认为，如来的权力地位比玉帝高一个等级。也就是说，权力生物链的顶端，是如来，他可以决定一切。


    对于玉帝治理下的种种弊端，如来并非不知，只是不管罢了，但事情竟然发展到孙猴子造反，直接危及管理层稳定，如来不能不对整个治理结构重新思考。经过深思，他下定决心，必须选拔新一代领导人，并重新梳理各方力量。


    唐僧取经，体制外升级道路


    君不密失其国，臣不密失其身，如来当然懂这个道理。因此，经过考查，他选定了座下弟子金蝉子作为新的接班人培养，借口他不听讲座，贬下凡去，让他投胎成为未来的唐僧。然后在盂兰盆会上借讲经的机会，言道有三藏真'
  merge: -1
  img_proc: true
- pgno: 175
  md: '经，可以劝人为善，需得东土寻一个善信。当时观音就自告奋勇道：“弟子不才，愿上东土寻一个取经人来也。”


    为什么观音自告奋勇呢？因为她也是这个接班人计划的制定者和实施者之一，亲自送金蝉子投胎的人是谁？观音大士也。她去东土寻那个取经人，自然万无一失。为什么如来心中大喜，还特意嘱咐观音此去要踏看道路呢？因为观音神通广大，足智多谋，足以完成选拔新一代领导人和重新梳理各方力量这两个目标。也就是说，唐僧的取经也好，孙悟空等3人做徒弟也好，都是如来和观音一手安排，同时，81难也早就安排妥当。


    作为新一代接班人，有什么条件呢？换句话说，孙猴子为什么就不能成为接班人呢？说白'
  merge: -1
  img_proc: true
- pgno: 176
  md: '了还是出身问题，孙猴子无根无基，修行不过300 来年，而唐僧乃金蝉子投胎，此前已经十世修行，转世之后，自幼在寺庙修行，所谓根正苗红，年资充足。有书称唐僧是什么完美型领导者，悟空是力量型员工，什么团队组合等，那是接近戏说。领导说你行，你就行，不行也行；领导说你不行，你就不行，行也不行。


    唐僧作为天定的取经团队头儿，从第一次被妖怪捉去“几乎唬死”，到最后一次被捉去仍然只会战战兢兢大喊“大王饶命”，不知是该佩服他，还是该 BS 他。按常理，一个人历经多'
  merge: -1
  img_proc: true
- pgno: 177
  md: '少年的磨难，意志应该坚强无比，就算天生是个软蛋，但只要没有得失忆症，他总该记得自己一路上反反复复地被妖怪捉去，又反反复复地被神仙解救，每次都有惊无险吧。因此，我们只能认为，唐僧明明知道在权力生物链上，妖怪们跟自己完全不是一个等级，但他仍然兢兢业业地扮演弱者，避免玉帝这样的权力对手的警觉，博取更大的同情。


    唐僧是领导者么，是一个优秀的领导者么？我没看出来。整部《西游记》里只有一个领导者，就是如来。在他设定的旅游线路上，傻子坐在唐僧那个位子，也能把真经取到手。至于唐僧那
    3 个徒弟，如来的使用手法，让人不禁想起唐太宗临死前对徐世磴的运用。据说太宗皇帝为了让儿子高宗有可用之臣，特地找个岔子把'
  merge: -1
  img_proc: true
- pgno: 178
  md: '徐世磾关进死牢，观察他的表现，考验合格后等高宗继位再放出来重用。这样一来，徐世磾不但不敢对新皇帝摆老臣的谱儿，反而会无尽感激新皇帝的救命之恩。八戒沙僧都是玉帝下旨干掉得，猴子则是如来亲自下手，再由唐僧把他们救出来，手法如出一辙。


    唐僧作为未来领导者，不足之处，一是没有神际关系网，二是没有政绩，三是没有班底，四是没有威望。要解决这些问题，十万八千里的取经，足矣。唐僧的嫡系班底就是 3
    个徒弟，全部是体制外动物，这也是如来有意安排的。说穿了，3 个徒弟代表的是众多中下级神仙妖怪，这就给了广大体制外人物的一个晋升的希望。


    取经路上，为什么那些妖怪许多是天上的座'
  merge: -1
