- pgno: 879
  md: '司马懿以及爷爷的上级曹操那样，将一批不听从、不听话的人砍头，然后判以不孝的罪名。所以，李密充分预料到这一点，为了不引起武帝爷爷的怀疑，他干脆反反复复地在“孝”字上做文章，把自己的孝心说得如何如何诚恳，把武帝推行孝道的基本国策吹捧得如何如何了不得，这一招，做得天衣无缝，而且卓有成效。武帝爷爷正好上了李密的当，他的国家现在多了一个孝子，却少了一个忠臣，这对他这个当皇帝的人来说，岂不是天大的悲哀！


