- pgno: 484
  md: '做理论依据。所谓“八议”，包括“议亲”、“议故”、“议功”、“议贤”、“议能”、“议勤”、“议贵”、“议宾”等内容。《大清律例》的“八议”对象，实际说来都是统治集团的“亲贤勋旧”，他们即使犯了法，执行过程中的程序也与芸芸众生不同，法理上获得特殊待遇。


    “八议”的好处究竟有哪些，害处又如何理解，为什么自从它在三国曹魏时期入律以来，直到清朝都成为历代法典中的一项重要制度？只简单否定或苍白肯定，未免显得稚嫩和空洞。但就李待尧一事来讲，“八议”使铁案迅速软化，最后乾隆皇帝下诏：“罪疑惟轻，朕不为已甚。”改斩监候。也就是说，李待尧判了个死缓。至于那个闵鄂元，因为此事做合乎圣意，而被调任到富庶的江苏做巡抚。


    大约半年之后，乾隆寻了一个机会，李待尧便走出监狱。乾隆皇帝授予他三品顶戴，命他赴甘肃“总办军务”，接着又'
