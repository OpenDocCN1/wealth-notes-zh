- pgno: 529
  md: '# **如何正确定位好自己呢？**


    合理定位就是确定自己今后的发展方向。了解自己、学校和专业是给自己准确定位的前提条件。


    首先，要了解自己。要对自己有一个清醒的认识，你的性格、兴趣爱好是什么，你在哪些方面更有发展潜力，身体条件怎样等等，从而确定自己的志向和职业规划，确定自己将来最有兴趣、而且最适合从事的职业，最后根据从事该职业所必须掌握的专业知识来确定自己填报的学校和专业。了解自己当然也包括对自己的高考成绩有一个比较客观、准确的估计。当然，如果你有政策性加分或照顾性加分，应当在填报志愿时一并考虑进去。


    其次，要想定位准确还应当对你所填报的学校有所了解。学校的学科优势、办学条件、发展前景、所处的地域等都需要了解，但更主要的是了解学校的招生政策和往年的录取情况'
  merge: -1
  img_proc: true
- pgno: 530
  md: '(特别是近几年的录取线），并对当年该校的录取情况有一个估计。需要提醒广大考生的是，只根据自己的兴趣爱好选择学校或专业和拿自己的成绩与高校录取线对着填报志愿的方法都是不可取的。


    再次，要预见未来。在填报志愿时要充分考虑到未来人才市场的需求，也就是说选择学校时，特别是选择专业时要有前瞻性，既要考虑当前人才市场的需求，又要善于寻找、发现那些现在还不被看好、但将来有着比较广阔就业前景的长线专业。从这个意义上讲，考生在填报志愿时不必对专业过分挑剔，最好填上服从调剂。应该看到，能够考入任何高校接受任何专业训练和培养，在一个人的人才道路上都是一个重要的里程碑。


    # 怎样避免定位不当


    要想在填报志愿时给自己一个准确、恰当的定位，必须对自'
  merge: -1
  img_proc: true
- pgno: 531
  md: '己和自己所要选择的高校和专业有一个比较全面的了解和认识。任何在填报志愿时只凭兴趣、爱好，不顾本人学习成绩，或者只是简单地把自已的绩去对照高校前一年的录取分数线填报高考志愿的做法都是不可取的。


    高校录取时每年都有这样一些学生——以很高的分数考入了很好的专业，但入学后却想调换专业。主要是因为其在填报高考志愿时，没有很好地了解自己的性格、爱好等因素。所以，建议广大考生在填报高考志愿时既要充分考虑自已的兴趣、爱好、性格等因素，也要对自已的高考成绩有一个正确的估计，如果站得再高一点，还应该考虑社会的需求和祖国的需要。


    # 考虑的侧重点应不同


    合理定位主要是指在定位时要结合自己的实际情况，也就是说，每一个考生在考虑影响定位诸因素时的侧重点应有所不'
  merge: -1
  img_proc: true
- pgno: 532
  md: 同。成绩优秀的考生在选择学校和专业时，应重点考虑本人的兴趣、爱好和志向；而成绩不是特别突出的考生在选择学校和专业时，应根据自己的成绩报考哪所高校、什么专业更有把握，作为自己定位时考虑的首要问题，只有这样才能够使自己的高考成绩在录取时发挥出最大的效益，也可以避免不必要的“撞车”。
  merge: -1
  img_proc: true
- pgno: 533
  md: '# 什么是正确的自我定位


    正确的自我定位就是明白自己的价值点准确的认知自己，一个人的价值，除了本身的存在价值外，还包括在行业中、人生中和社会中创造的相关价值。给自己定位要做到高点定位与低点起步相结合，不让浮躁的心态毁了对定位的把握，用做人做事的方式定位正面的社会形象。


    自我定位通俗地讲就是寻找一个适合的位置。一个人要想不活得稀里糊涂、浑浑噩噩，就要学会先给自己定好位。懂得定位，就可以学会以理性的态度追求更好的生存状态，这样才能把命运的主动权握在自己手中。'
  merge: -1
  img_proc: true
- pgno: 534
  md: '# 如何找到自己的定位


    找准方向--找准职业定位和发展方向


    这是避免盲目转行最重要的一条。要先行挖掘自己的职业气质、职业兴趣、职业能力结构等方面的因素，找到自己的职业潜力集中在哪个领域，只有找准方向才能最大限度地开发和发掘自己的潜力。[分享]教你少走弯路的十条忠告


    看清行业--看清目标行业的发展趋势


    主动、全方位地了解目标行业现状和前景，毕竟朝阳行业才更有前途，也能给你这位新人更多的机会。俗话说隔行如隔山，不能仅仅靠报纸或者杂志介绍，比较理想的做法是向目前已在该行业供职的朋友打听，以便获得可靠消息，打听的内容包括升迁制度、薪资状况等各个方面，多多益善。剖析自我--认清自己的优势和不足


