  md: '通常我们每个月会开一次全员大会，在大会中，我会以大家长身分期勉大家，同时也对这位主管表示认同与肯定，这些仪式，都在确立公司的指挥权与权力结构，让我和这位主管充分信赖又合作无间。

    只要真心相待，再可怕的人也可真诚合作。


    # 有这 4 个特征，与部属关系就毁了


    深受尊卑地位以及儒家思想的影响，常以家长长制作为维持秩序的基础，企业不外如是。而这种将公司的领导者视为长辈或大家长的独特领导风格，称为家长式领导，其中包括威权、仁慈、德行
    3 大元素。


    家长式领导 3 元素：威权、仁慈与德行


    家长式领导中的威权领导主要源自法家文化，威权领导的主管有以下 4 种行为特征：


    专制的行为：严格控制部属，期望得到毫无疑问的服从。


    贬抑部属能力：忽视部属的建议、贬抑部属的贡献。'
