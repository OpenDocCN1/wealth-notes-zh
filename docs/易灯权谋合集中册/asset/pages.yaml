  md: '流湊背。一次李林甫与他在中书省大厅同坐，很温和的慰问安抚他，还解下自己的袍子披在安禄山身上，安禄山极为感动，自此后与之无所不谈，毫无保留。因李林甫排行第十，所以称之为“十郎”。后来安禄山回到范阳，每次驻长安的部将刘骆谷回来，安禄山必定问他：“十郎可有什么吩咐？”若是听说李林甫对他有所夸奖，那就兴高采烈，大为欢喜，若是听李林甫说：“回去告诉安大夫，要他检点一些！”他就反手按在床上，大叫：“完了，完了，我死定了！”


