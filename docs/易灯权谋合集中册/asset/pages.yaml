  md: 立围栏数百步，截断淮河通道。韦睿打 造大舰，命梁郡太守冯道根、庐江太守 裴邃、秦郡太守李文钊等水军。碰上 淮水暴涨，韦睿立刻派他们出战，一时 战舰齐发，全都逼近魏军营垒。梁军又
    用小船载草，灌上火油，放船来烧魏军 桥梁。风急火猛，敢死之士拔除木栅， 砍断桥梁，水流又急，转眼之间，桥栅 全被破坏。道根等人都亲身搏斗厮杀， 军士们奋勇作战，喊声震天动地，无人
    不是以一当百。魏军大败，元英脱身逃 走。魏军投水逃命淹死的有十几万，被 杀的也有这么多，其余脱甲叩头求为俘
