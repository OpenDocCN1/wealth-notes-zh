  md: '+   10、一定要有靠山，但比靠山还可靠的，是让自己有价值。所以在职场中，和上司们搞好关系是一门必须的功课，为自己找好靠山很重要。而比此更重要的是，是让自己有足够的价值，以致于每个上司都必须拉拢你。


    +   11、你是上司的人，上司却不一定是你的人，这层意思一定要明白。当一个上司对你说，你是他的人时，心里一定要清楚，上司并不是你的人。你是他的，他是他自己的。当你的事情与上司的利益有冲突时，他们会毫不犹豫的出卖你。无论何时都要记住，你是你自己的，只有你才能对自己负责。别相信上司故作亲近的话，那随时都会是陷阱。


    +   12、上司说他对你很放心，事实可能正好相反。如果上司真的对你放心，他根本不用经常提及。真正的信任，是通过行动表现的。当上司愿意把害人的事情，把职场斗争的事情和你一起做，那才是信任的表现。而上司口头说对你放心，则反而要当心了，很可能你做了什么，让上司产生你不忠的怀疑。


    +   13、站在上司立场上想问题，站在自己立场上办事情。当上司相信你，让你做一些事情时，心里必须要本帐，别傻兮兮的什么都做。你要站在上司立场上去考虑问题，了解'
