- pgno: 523
  md: '# 如何对自己进行准确的定位


    年轻人难免眼高手低，对自己的定位于自己的能力不能相匹

    配。其实年轻人自信是好事，只有自信才可以勇往无强闯荡

    出一片自己的新天地。但是要对自己拥有正确的定位，不然

    就会很容易误入歧途。今天小编跟打击分享一片一篇如何正

    确的自我定位。


    # 看清时代的走向


