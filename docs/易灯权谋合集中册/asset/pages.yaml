- pgno: 576
  md: '# 历史案例


    为什么那么多人总是默默无闻一生，可悲过完一生，你知道这是什么原因么？不是他们缺乏野心，也不是他们没有成功的欲望，核心是他们设局和做局的能力，所以他们一生都默默无闻。


    最近几年流行狼道和权谋文化，而这些文化一直停留在浅层次思维，他们告诉你了一大堆成功的故事，其实这卵用没有。他们从没有涉及到成功的核心本质，那就设局和做局的能力，没有这种能力，你只能在底层挣扎。


    所以的赢家都在根据人性的弱点在设局，无论是善良优秀的品质还是阴昏暗昧的品质，这在赢家眼里都是设局和做局的工具而已。他们非常善于利用人性设局，所以他们百分百是赢家，所以要想学习赢家思维，必须要读懂人性。


    明朝的大文学家冯梦龙在《智囊》一书中，讲述了这么'
  merge: -1
  img_proc: true
- pgno: 577
  md: '一个故事，很值得思考，会让你的头脑会清醒很多。


    有天杭州西湖上来了一个人，自我吹嘘自己会炼丹，家人和仆人非常多，还有许多迷人的美女陪伴，他和妻妾们在西湖上饮酒作乐，而陈列的生活用品和酒具，猛然一看全是 用真金白银打造的。


    当地有个富翁非常羡慕炼丹人的财力，就想着上去请教一下炼丹人是如何发财的，自己照猫画虎来发财。


    炼丹人告诉富翁自己全靠炼丹发财的。于是富翁就炼丹人和 他的小妾来到了家里，并且拿出两千个金作为炼丹的丹引。炼丹人给丹炉里注入铅药，炼丹炼了十多天，炼丹人找了一个托来到富翁家，让托说：“先生家突然遭到丧忧，请先生
    赶紧回家。”


    炼丹人假装很悲痛，对富翁说：“事出无奈，我不得不 暂时离开丹炉，回家处理善后之后。劳烦您与我的小妾一起'
  merge: -1
  img_proc: true
- pgno: 578
  md: '看守丹炉吧！完事之后，我就马上回来。”


    临走时，炼丹人将里面的丹药早已偷走，又去命令他的小妾与富翁滚床单，这一切富翁都不知情，一直在富翁圈套中。


    富翁与小妾一起干柴烈火数天之后，炼丹人打开丹炉，故震惊讶地叫道：“完了，看来遇到了不干净之事了。”立即指责富翁失去道德，竟然玷污了他的小妾。


    富翁见无法隐瞒，只好拿出钱财来赔罪，炼丹人故意装作不开心的样子离去。


    那富翁以为安然送走炼丹人感到开心，自己却不知道炼丹人的东西一切都是假的，那名小妾也是从妓院里顾来作为诈骗的工具。


    富翁自己贪财好色，才入了炼丹人所设的局，这名炼丹人很富有智慧吧！'
