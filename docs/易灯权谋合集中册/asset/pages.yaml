  md: '且看天蓬元帅醉酒戏嫦娥被打了 2000 锺再贬下凡尘；卷帘大将失手打碎了琉璃盏，被打 800，贬下界来，又教 7 日一次，将飞剑来穿胸肋百余余下。处罚何等严酷！而奎木狼与披香殿玉女私通，玉帝只收了他金牌，贬他去兜率宫与太上老君烧火，有功复职，无功重加其罪，处罚又何等之轻。说白了，天蓬元帅也好，卷帘大将也好，都没有什么靠山，而奎木狼乃
    28 星宿之一，有团队做后盾。玉帝对猴子、八戒、沙僧这种没有靠山的动物，是从不不不会手软的，而对有后台的动物，从来都是高举轻打。


    天庭权力结构，貌似二元对等，行政事务管理由玉帝负责，另有一个平行的宗教事务管理层，由如来总负责，表面上互不相关，其实不然。如来时刻在关注和指导行政事务。比如平息孙猴子造反这样的大事，危急时刻还得如来'
  merge: -1
