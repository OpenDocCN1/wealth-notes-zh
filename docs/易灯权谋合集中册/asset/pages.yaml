- pgno: 697
  md: '浑谋反，显祖年仅十二岁，居住在守丧的小屋中，太后秘密定下大计，诛杀乙浑，于是临朝听政。等到高祖出生，太后亲自抚养。此后免除制令，不处理政事。太后行为不端正，在宫内宠爱李弈，显祖藉故诛杀李弈，太后不满意。显祖突然逝世，当时人说是太后谋害的。


    解析：


    俗话说 “赌场无父子” 其实，官场更无父子。


    司马迁在《韩长孺列传》里深有感触地写道：“虽有亲父，安知其不虎？虽有亲兄，安知其不为狼？” 由此可见，在官场'
  merge: -1
  img_proc: true
- pgno: 698
  md: '斗争中，父、兄有时会与子、弟反目为仇，形同虎狼。《国语·晋部》里记载有一个叫骊姬的女人对晋献公面授机宜：统治者应该六亲不认，《邓析子·无厚》也告诉从政者“又与子无厚，兄于弟无厚”。


    由此可见，再也没有什么东西比“权”更具有诱惑力，也更具有杀伤力了。


    本篇中的文成文明皇后正是不折不扣地履行了骊姬的谆谆叮嘱，她杀掉显宗这样的亲生骨肉，表面看来是为自己面首李乔报仇，其实是夺权而采取的必要步骤。'
  merge: -1
  img_proc: true
- pgno: 699
  md: '历史上为争夺权位而母子残的现象很多，本来，母爱应该是最无私和最神圣的了，但如果跟皇权相比，这无私和神圣就变得像肥皂泡一样脆弱，一吹就破。


    由此可见。官场是权欲与人性交锋的屠场，人在官场上真不知会变成什么动物，文成文明皇后如此，还有一个封建“铁娘子”更是如此验就是武则天。武则天的确是一位有作为的女皇，在中国历史上占有重要的地位，但我们不去评论她的功过，而是看看她作为一个女人，一个母亲，是怎样对待她的儿女的。'
  merge: -1
