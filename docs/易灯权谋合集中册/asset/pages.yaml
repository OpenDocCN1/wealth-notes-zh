- pgno: 1258
  md: '另一种则是激励因子，其中包括成就感、除底薪外可供致富的钱钱、团队乐趣及被认可。


    心理学家认为培养一个人进取心及对成就的满足是很重要 的事。


    如果你找一群人跟你一起打拼，就要找有成就感潜力的人，如果找一群以赚钱为主要目的的人，我的经验是赚钱固然是激励因子之一，但是这种激励没有成就感因子强，且非长久之计，常有人赚到钱了就失去激励因子而离开。


    中国与西方都强调赏罚必需相称，中文常说赏罚分明。不过在企业界，实际上赏多于罚的比例非常大，受到惩罚的人很少，但是受赏的人却多如过江之鲫。


    考绩是为了达到激励与塑造所产生的制度，不过却少有成功的例子，原因是常将重点放在考绩上，而忽略了塑造。


    考绩有塑造我的功能。 考绩制度的重点在于培育塑造，而不是仅看过往的表现。


