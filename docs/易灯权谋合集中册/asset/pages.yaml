- pgno: 135
  md: '口水，鄙夷地说：“生乃与哙等为伍！”对于这句话，普遍的解释是：我韩信怎么说也是汉初三杰之一，你樊哙虽然会点武功，怎么也是个杀狗的，我怎么能跟你一样是“侯”？


    但是事情并不是这么简单。


    樊哙是吕后的妹夫，在众多开过功臣之中，他与刘邦的关系最为亲近。而且论武力，自项羽乌江自刎之后，除樊哙外当世不作第二人想。


    从他对韩信恭敬的态度也可以看出，这绝非是一无德无能之辈。众所周知，樊哙曾是韩信的手下大将，但刘邦诱擒韩信时，带上的人正是樊哙。这位武力指数仅次于项羽的勇将，在刘邦的命令下，亲手将自己的上司韩信绑上了囚车。之后韩信就从原来的刘汉中央政治局的常委，降为一个县长，并且还被软禁在京城洛阳。心里烦闷的韩信干脆称病不去朝见刘邦，刘邦也奈何不了他。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '所以，韩信看不起樊哙，是因为他绑了自己、镇压自己的封国，这是一种莫大的以下犯上。


    尽管樊哙是君命不可违，但无疑他是失去了士君子的气节，这在韩信看来，才是最紧要的事情。


    在秦汉时期，长官和下属之间，存在着一种君臣之义，不像今天，上司和下属更多地是主子和奴隶的关系。说起君臣之义，它远非今人所理解的“君要臣死臣不得不死”那么简单粗暴，它要求“君”要爱“臣”，“臣”要敬“君”。在那个时候，如果哪一方被杀，那么另一方是有义务为之报仇的——注意，是义务而不是权利。格于和刘邦的关系，樊哙应该在这件事情上选择缺席和沉默，但现在却是直接侵犯韩信，这就是不可饶恕的事情了。这才是韩信看不起樊哙的根本原因，而不是仅仅因为自己与樊哙享受同等待遇。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '种种迹象表明，韩信是一个彻头彻尾的士君子，因为他行已有耻，不会随便同流合污。人一旦有了羞耻之心，就很难获得俗世意义上的成功。项羽也是这样，如果刘邦威胁要烹了项梁，项羽或者自刎，或者投降，他绝不会说出“愿分一杯羹”那样的话。而有同样心性的韩信，延续了项羽的悲剧。这也是千万个有羞耻心的人的悲剧，千古皆然。


    在这一方面，陈平给韩信们上了很好的一课。和韩信一样，陈平出身也贫寒，但他知道怎样去获取成功。他住在陋巷，穷得要用一张破席子做门，但是门外的黄泥地上，车轮痕迹从未间断，而且到来的车辆，都是保时捷或劳斯莱斯级别的，你要来一辆宝马奔驰，人家陈平还瞧不起。可见陈平所乐意结交的，都是一些拥有社会资源的人。


    正是这种心性，决定了陈平这一种思想：为了'
  merge: -1
  img_proc: true
- pgno: 138
  md: 取得成功，可以不择手段。当刘邦被项羽围困在荥阳——这里就是楚河汉界，刘项两人中分天下的那一道鸿沟就在这里——的时候，陈平几乎用屁股就给刘邦思出了一道妙计：用重金去贿赂一些楚兵，让他们在楚营里散布谣言，说范增和钟离昧对项王有异心。项羽生性多疑，就对这两位重臣的意见不予采纳。这还不算狠的，更绝的是，陈平驱赶两千名女子走出荥阳的东城门，强迫她们搔首弄姿地摆POSE……项羽的士兵连年打仗，那时又没有慰安妇，最多晚上满头大汗地幻想一下虞姬。他们一看到这种情形，哪里还能忍得住？于是一个个都像饿狼一样扑了上去，任凭项羽在后面怒斥，也压制不了这种生理的冲动。而那一边厢，陈平和刘邦已经偷偷地从西门逃出生天。在和韩信的一次最直接的对话中，陈平也是利用了韩信的本真的气质，击败了对手。汉初三
  merge: -1
  img_proc: true
- pgno: 139
  md: '杰之中，张良和萧何都不会像韩信那样使刘邦忌惮万分，况且萧、张两人都懂得自我保护，在天下大定后，选择了收敛锋芒，萧何故意做出了强抢民女、侵占民田等事，以污名节，自降官位；而张良更是直接退隐。只有韩信，即使原来在齐国的兵权被剥，仍旧是汉朝诸臣当中对刘邦威胁最大的人，他辉煌的战绩使得他在军队中的拥有非常高的威望，可以说到处都有对他心悦诚服的部将。所以当有人打小报告说韩信要谋反的时候，平时对韩信羡慕嫉妒恨的人都众口齐声地说“坑了这小子”时，刘邦仍旧顾虑重重，找陈平商议。这时候的陈平，没有叫刘邦先调查清楚韩信谋反的流言是否属实，而是直接献计除掉韩信。

    陈平问：“您的兵干得过韩信的兵吗？”刘邦这人就好在老实，放在今天，绝对不能做统计'
  merge: -1
  img_proc: true
- pgno: 140
  md: '局的局长：“不能。”陈平又问：“那您手下的将军，能牛逼得过韩信吗？”刘邦摇头：“这个更不能。”于是又是陈平，给刘邦出了一道诡计：刘邦假装去巡幸诸侯，让韩信到领地的边缘地带迎接，这样韩信不好带兵马去。而那边的韩信呢，他甚至为了表明自己的忠心，带上了钟离昧的人头去。但是他一到来，就被樊哙按在地上，五花大绑，自此直到被吕后杀死，都未能脱离刘邦的控制。

    如果让陈平和刘邦带上几倍的兵力与韩信 PK，也一样会灰飞烟灭。但这么复杂的事情，原来就这么简单，解决掉最棘手的韩信，真的就是“一力士之事耳”。试问在战场上攻无不克战无不胜的韩信，能想得出这样的诡计吗？能！但他绝对做不出来。

    后来的陈平受刘邦的命令，绑了吕后的妹夫樊哙，押解的途中收到“刘邦一命呜呼”的短信，'
