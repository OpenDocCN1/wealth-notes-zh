- pgno: 406
  md: '致寒门学子：


    随着社会的发展，发现越来越多社会底层的家庭孩子正在放弃高考，不是选择早早进入社会，辍学打工就是学门技术，好找工作。但对于高层家庭孩子来说，经济条件完全不用担心，甚至高考对某些家庭而言都可有可无，因为他们都早早就把孩子送到国外，选择一年数十万的贵族学校，不受高考的约束。


    而高考的意义对于普通家庭来说，无论是学习的证明还是人生命运的转折亦或者是晋升更高层次的希望，在每一个普通家庭心里都有着雷打不动的地位，但很难想象因为宝贵让每个学生把它当做“奢侈品”的高考，在高层家庭眼里是什么？或许对于他们来说，高考并不显得那么珍贵，“奢侈品”这个词也显得过于滑稽，但我们不得不承认，家庭条件的确决定了孩子们的发展和眼界。'
  merge: -1
  img_proc: true
- pgno: 407
  md: '当绝大多数家庭为“择校难”烦恼时，世界上5%的高层家庭却在犹豫该送孩子去哪个贵族学府享受世界最好的教育和知识，这些对于平民学生而言都是不可想象的。他们或许也会参加高考，但不过只是走一个形式而已，高考不会影响他们升学以及就业，如果说条条路通罗马的话，他们出生时就已经在“罗马”了，而他们需要做的就是怎么样让下一代继续出生在“罗马”。


    曾经我看到一位家长对自己孩子说：读这么多书有啥用？还不是要回来种地，能认个字就行了。类似的话我们或许听的很少，但在许多乡村这些是很常见的，几乎所有的父母都会劝说自己的孩子跟自己学手艺，好早点来接自己的班。


    据显示，越贫穷的家庭对教育认可越低，他们深信类似“读书无用”的观念，并且他们用自己的想法影响一代又一代'
  merge: -1
  img_proc: true
- pgno: 408
  md: '人，但 5% 的高层家庭他们很清楚教育的重要性，不在乎高考的重要，只在乎什么样的教育适合自己的孩子！对于这 5% 的人，高考可有可无，但对于普通家庭以及中层家庭而言，高考决定了人生命运，不过幸运的是世界上还有
    95% 的人进行着同样的角逐。


