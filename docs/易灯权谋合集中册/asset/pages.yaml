- pgno: 257
  md: '请注意，这只是在大真实之下的一点点用以获利的谎言。如果没有基本事实的真实，任何一点谎言都是不可取的，获了利也要吐出来，或者要遭到恐怖的刑法。


    由胡衍的辩词观之，此人对蒲、卫、西河之外、魏、秦的地理形势非常熟悉，对樗里子、秦王、蒲守、卫君的为人也较清楚。


    # 雄辩方法多变


    苏秦是战国时期的辩士之最，其一，所辩的是合从之术，关乎战国时期的两大根本战略，具有全局意义，行踪遍及齐、楚、燕、韩、赵、魏、秦七个国家；其二，所言历史、地理、军事等知识丰富，语言多排偶，气势磅礴，雄辩方法多变；其三，成就最大，挂六国相印，使得战争硝烟平息十五年。历史上还没谁能比得上苏秦，凭一个人的力量使得战事频发时期和'
  merge: -1
  img_proc: true
- pgno: 258
  md: '平能保持这样长的时间。


    那么苏秦究竟是怎样游说六国，以使合纵之策得以成功实施的呢？试就游赵之说分析之，据《史记・苏秦列传》记载：


    苏秦游说燕国后，接受燕文侯资助车马金帛，到了赵国，奉 阳君已死，当政的为赵肃侯，苏秦说：


    > “天下卿相人臣及布衣之士，皆赞扬贤君您的行义，都愿在您的面前接受教诲、陈述忠心，我等待这一天已有好长时间了。前奉阳君因嫉妒您使您不能执政，宾客游士不敢在奉阳君面前进言。今奉阳君捐馆舍（去世），您复与士民亲近，臣才敢进言，谈谈自己的愚虑。”


    苏秦首先要了解奉阳君与赵肃侯的矛盾。不然，不能这样说话。苏秦把对方赞扬一番，当面奉承，抑故扬今，褒贬分明，以拉近自己与'
  merge: -1
  img_proc: true
- pgno: 259
  md: '对方的距离，按现在的话说叫“套近乎”，这是游说成功的第一步。


    > “我为您考虑，没有什么比安民的事大，无用的执政者才有事于民（扰民）。安民之术在于择交，择交而得，则安民；择交而不得，则民终身不安。”


    苏秦从执政的原点“安民”出发，由此推导出“择交”，即选择什么样的外交，再回到原点，择交而得——安民；择交而不得——扰民。从而提醒对方：自己所谈外交问题的重要性。


    > “请让我说说外患：齐、秦为两敌，相互交战民不得安宁。别的国家倚秦攻齐，民也不得安宁；倚齐攻秦，民同样不得安宁。谋人之主，伐人之国，都是不友好的侵略行为。愿君谨慎勿出于口。”


    苏秦在此否定了可能出现的以秦国为首或以齐国为首的军事同盟。否定，是立论的基础。'
  merge: -1
  img_proc: true
- pgno: 260
  md: '“请辩白黑，异阴阳。君诚能听臣，燕必在旃裘狗马之地有所作为，齐必在鱼盐之海发展自己的特色，楚必在橘柚之园建设新天地，韩、魏、中山皆可为汤沐之奉，而贵戚父兄皆可受封侯。”


    究竟苏秦是什么样的外交政策，还没有说出， 但已勾勒出美好的前景，引起对方向下探寻的 浓厚兴趣。


    “今天大王您与秦好，则秦必弱韩、魏；与齐好， 则齐必弱楚、魏。魏弱则割河外，韩弱则效宜 阳。宜阳效则上郡绝，河外割则道不通，楚弱 则无援。此三策者，不可不孰计也。”


    苏秦还是没有谈自己的外交方略，荡开一笔， 批评现行赵的摇摆不定、没有方向的外交政策 可能会产生的后果，指向了一个国家——秦 国。此处语言对仗工整。苏秦在一步步地接近'
  merge: -1
  img_proc: true
- pgno: 261
  md: '自己的外交政策。


    “夫秦下轵道，则南阨危；劫韩包围，则赵氏自操兵；据卫取卷，则齐必入朝秦。秦欲已得乎山东，则必举兵而向赵矣。秦甲渡河逾漳，据番吾，则兵必战于邯郸之下矣（兵临邯郸城下）。此臣之所以为君患者。”


    苏秦为赵敲响了警钟！为自己正确的外交政策出台作了垫铺。


    “当今之时，山东之建国莫强于赵。赵地方二千余里，带甲数十万，车千乘，骑万匹，粟数年。西有常山，南有河漳，东有清河，北有燕国。”


    歌颂赵之大好河山，及赵国的实力，句式或三字一逗，或四字一逗，气势非凡，实则激起赵王求得好的外交政策的心理。


    “燕固弱国，不足畏也。在天下所有国家中秦国所恨的莫大于赵，然而秦不敢举兵伐赵者，'
  merge: -1
  img_proc: true
- pgno: 262
  md: '何也？是担心魏、韩会说本国也会紧随赵之后被秦灭。然而韩、魏，在赵国的南边，实际上起了保护赵国的作用。秦之攻韩、魏也，没有名山大川的阻碍，稍蚕食之，魏、韩不能对付秦国，必定入秦称臣。秦国既然已吞韩、魏，则灾祸必定降临赵国了。此臣所以为君患也。”这是苏秦第二次说“此臣所以为君患也”。第一次仅仅是警示，而这一次是在做了详细分析之后的实实在在的告诫。秦、魏、韩、赵，四国之形势，苏秦了如指掌，分析得令听者心服口服。


    > “臣闻尧无三夫之分，舜无咫尺之地，以有天下；禹无百人之聚，以王诸侯；汤、武之士不过三千，车不过三百乘，卒不过三万，立为天子：诚得其道也。”'
  merge: -1
  img_proc: true
- pgno: 263
  md: '连续用五位圣人的类比，只是说明一个道理，得道者得天下。


    “是故明主外料其敌之强弱，内度其士卒贤不肖，不待两军交战成败则已形成于胸了，难道还要等待众人之言冥冥决事哉！”


