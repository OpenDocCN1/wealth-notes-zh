- pgno: 700
  md: 她一共生了四个儿子，但为了不使大权落到儿子们的手里，为了自己今后能做女皇，她竟然毫不手软地毒死了已被立为太子的长子，对第二个儿子也是一样，立为太子后，他居然不听武则天的话，武则天便先废了他的太子称号，然后再贬往巴州，随后又派人将他杀死。她的第三个儿子和第四个儿子都曾被她推上皇位，但不久又被她废掉，幽禁在别处，好歹留了他俩的性命，总算没有赶尽杀绝。对儿子如此，对女儿更是如此。公元
    654年春，武则天生下一个女儿，极其灵秀
