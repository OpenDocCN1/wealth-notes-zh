  md: '性情相契，孙氏兄弟以意气相投”。曹操驭人之术招数奇特多样，对于有功之士必以各种方式给予经济、名位、精神等方面的奖赏。但他又生性多疑嗜杀，荀彧、许攸、孔融、崔琰、娄圭、杨修等都因言语不慎等琐碎小事而被逼死、杀害乃至灭族。因此，曹操的驭人可谓恩威并用、软硬兼施，使手下的文臣武将抱着感恩和恐惧的复杂心态为其谨慎效命。


