  md: '制服朝臣，她提出十二条治国方略，其中有劝农桑，薄赋徭；广言路，杜馋口；父在为母服齐衰三年；等等。用富国之策让众人畏服。又提出增加官员薪奉，减免百姓人口税。争取了民心。取得了大多数人的支持。为了坐稳皇帝位子，她还发动大家告密。对告密者，‘吏不得何诘’，无论农人樵夫必定自己亲自接见。一时‘人人屏息，无敢议’。她对人才的选拔，也不拘一格，有一技之长者，都加以任用。采取了这些政策后，人心归伏，出现了一时的繁荣。


    武则天在位四十年，国家统一，人民安居乐业。发展了经济，对开元盛世起了承上启下的作用。应当得到肯定。


    # 权术与制度之别


    《三国演义》是中国权术的大全。所谓权术，'
  merge: -1
  img_proc: true
- pgno: 26
  md: '就是政治手段。但政治手段有些是必要的、负责的政策与策略，有些则完全是诡诈性、奇谲性的计谋手腕，后者便是权术。宋代叶适所作的《宝漠阁待制知隆兴府徐公墓志铭》写道：


    “三代圣王，有至诚而无权术”。把权术视为“至诚”的对立项，十分准确，权术的主要特点正是没有真诚，只有机变手段。叶适这句话的重要性还在于说明，中国汤尧禹舜时代的上古原形文化，没有权术，只有真诚。到了春秋战国时期，《孙子兵法》、《韩非子》、《鬼谷子》、《战国策》等兵家、法家、道家、纵横家等着作出现，中国文化才发生巨大的伪形，出现权术政治游戏的第一个高潮。东汉末年，也就是三国时代，则出现第二次高潮，后一次高潮，其规模之大、谋略之深、诡计之细密，是第一次高潮无法比对的。


    倘若如叶适所言，“三代圣王有至诚而无权'
  merge: -1
  img_proc: true
- pgno: 27
  md: '术”，那么，《三国演义》中的权人权术家们则相反，可谓“三国诸王有权术而无至诚”，个个都极会伪装、极善于耍弄阴谋诡计。被《三国演义》捧为正面形象的仁君刘备，其特点也是只有权术而无至诚，或者说，只在拜把兄弟的小圈子内有真诚而在圈子之外则无真诚。刘备的胜利，乃是伪装的胜利。


    权术归根结蒂是种手段和技巧。“术”本来是与“道”相对立的概念。世无道，术便悖兴。中国文化以诚为本，诚能通神，诚即道，因此，世无诚时术也悖兴。三国时代是个战乱时代，中国文化中的“道”到了此时已全面崩溃，权术家们口中念念念有词的道，只不过是“术”的面具。曹操对皇帝早已失去忠诚，但还需要皇帝做招牌，“挟天子以令诸侯”，此时维护天子，不是道，而是术。


    中国古代文化中所讲的道，在现代文化中则用'
  merge: -1
  img_proc: true
- pgno: 28
  md: '另一套语言表达。如果我们暂且悬搁形而上层面的哲学表达，那麽，在现实社会政治层面的道，主要应当是指制度。而权术恰恰是制度崩溃后的产物，中国的权术那麽发达，就因为制度无效，反而是权术机谋有效，生存技巧有效。


    钱穆先生一生研究中国文化，得其要点，他在《中国历代政治得失》一书中，特别指出“制度与法术”的对立，两者此起彼伏，制度衰则权术兴。分清“制度”与“法术”这两个基本概念极为重要。他说：


    我们讲政治制度，有一些确实是制度，有一些则只能叫做事件或法术。制度指政而言，法术祇是件事情或手段；不好说是政治。大抵制度是出之于公的，在公的用心下形成的一些度量分寸是制度。而法术则出之于私，因此没有一定恰好的节限。所谓方法与权术，二者之间，'
  merge: -1
  img_proc: true
- pgno: 29
  md: 当然又不能仔細分。而且一个制度之成立，也当然有許多複杂关係，总不免夹带有当时一些私意的。要说建立一制度，而绝对地大公无私，不仅古代历史未之有，就是将来的历史，要說一个国家建立某项制度，而绝无人事関係，绝无无私心夹杂，恐怕这希望也还远。不过公私之间该有分量的轻重。现在再说中国历代政治制度究竟是出于公的多呢？还是出于私的多呢？究竟法术的意义重呢？还是制度的意义重？论汉代，西汉可说是制度，东汉则多半出于光武的私心。论唐代，确实可说在建立制度，而宋代则有许多只算是一种法术。明代，有许多只能说它是一些事，不能说它是一些制。尤其是清代，可说全没有制度。它所有的制度，都是根据着明代，而在明代的制度里，再加上他们许多的私心。这种私心，可说是一种“部族政权”的私心。一切由满洲部族的私心发出，
  merge: -1
  img_proc: true
- pgno: 30
  md: '所以全只有法术，更不见制度。


    (引自钱穆《中国历代政治得失》第五讲“清代”，台北大中国印刷厂，一九六年）钱穆先生说，有些朝代有制度，如西汉、唐代；有些朝代则空有制度之名，实际上只有法术，如东汉、清代。东汉的第一位皇帝刘秀就开始露出术的端倪，到了汉末，则完全是权术的天下。当时政治大舞台，成了一个傀儡皇帝(汉献帝)当看守的权术比武大擂台。各种制度只是一张废纸，连圣旨也是废纸(只有密旨密诏在求诸于人)，那么，要存活就只能靠玩手段与玩技巧了。谁玩得好，谁就是胜利者。钱穆先生在论述制度与法术的区别时还指出关键性的一点，就是凡热中于法术者都有私心，这一意思实际上是说，凡玩弄权术者都是心术不正者。品端心正的大公无私者依仗健全的制度，无须依靠政治技巧和其他生存技巧。制度'
  merge: -1
  img_proc: true
