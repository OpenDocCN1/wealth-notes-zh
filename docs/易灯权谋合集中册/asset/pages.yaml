  md: '乾隆立刻召见满朝文武，质问和珅，和珅说道："启奏皇上，奴才蒙皇上器重，官是一宰辅，焉能不知自重，臣对家人等也一向严加管束，深恐有负皇上深恩，今御史曹锡宝弹劾刘全，臣也不敢庇护，臣多年跟随皇上身边，手下人等趁臣不知，做了些不轨之事也有可能，可命人即刻拘捕刘全，严加审问，若果如曹御史所言，臣定当领罪。"
    和珅的这一番言辞，有理有据，说得乾隆心中的怒气已然消掉了大半，当下询问百官，以为和珅所言如何，百官中有不少已是和珅的党羽，自然连连应和，说和中堂所言极是，乾隆立即命人将刘全抓到热河，短短两、三日之内，刘全已是二进热河了。


    和珅力请皇上在金殿亲自审问刘全，以正视听。乾隆端坐在金殿之上，命人带过刘全，问他："曹御史弹劾你衣服、车马、居室皆超出祖制，可是属实吗？" 刘全诚惶诚恐'
