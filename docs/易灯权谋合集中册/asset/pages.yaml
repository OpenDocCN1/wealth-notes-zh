  md: '架抬下阵来，三分之一的俊杰在每天告诉自己 “给老子顶住” ，三分之一的俊杰在通往理想的道路上跋涉前进——————不仅后两个三分之一中随时有人加入到第一个三分之一中来，最后一个三分之一的又大部分在不停地为下一个
