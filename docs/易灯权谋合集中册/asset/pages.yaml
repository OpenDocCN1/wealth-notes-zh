- pgno: 878
  md: '也只字未提，这大概是历史学家孤陋寡闻或故意不提吧。现在李密出来，鼓足勇气，气运丹田，大展吹功，把武帝老爷“以孝治天下”的实效和功绩吹得神乎其神，武帝当然会喜上眉梢，对李密的一切要求都“好说好说”了。


    俗话说“伴君如传虎”，要给皇帝搔痒，也会像给老虎搔痒一样，你得知道对方最痒的地方在哪儿，李密就找到了晋武帝最痒的部位，那就是“孝”这个穴位，他本人在行动上是否孝敬爹妈确实值得怀疑，但他在口头上喊“孝”，嗓门却最高，他甚至像他的父亲司马昭、爷爷司'
