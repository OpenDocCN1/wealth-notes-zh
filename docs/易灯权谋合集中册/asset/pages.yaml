- pgno: 443
  md: '以惑其心志（行美人计），四曰遣之巧工良材，使作宫室以罄其财（引导荒淫），五曰遣之谋臣以乱其谋（渗入间谍），六曰离其谋臣使自杀以弱其辅（互相残杀），七曰积财练兵以承其弊（养锐待变）。这一套连环的“釜底抽薪”，终于复仇成功，到夫差被俘时，勾践展现本来面目，逼得夫差自杀身亡。


    # 故事二：南园遗爱，故剑情深的刘病已


    汉宣帝刘询是西汉中兴之主，早年在权臣霍光的支持下登上了帝位。一开始刘询对他都是言听计从，百依百顺的。就只有一件事例外，这就是立皇后。当时众公卿都认为霍光之女是最佳的皇后人选，甚至于集体上书。这时候，皇帝却下了一道莫名其妙的诏书：“我在贫贱之时曾经有一把旧剑，如今我十分的想念它啊，众位爱卿能否为我将其找回来。”群臣揣摩上意，开始一个个请立许平君为皇后。许平君与刘询'
