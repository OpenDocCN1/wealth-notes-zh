  md: '或许是因为个性懦弱，不擅长反驳别人；口齿不伶俐，即使回嘴，最后还是会被驳回；或是担心回嘴会破坏跟对方的情谊等各式各样的理由，所以即使不断遭受攻击，却也只能忍耐。


    换个角度来看，搞不好对方本来就是所谓的强者，很会说话且态度十分坚决，根本就不担心人际关系会遭到破坏，而你也早就发现自己处于弱势，并衷心的期盼能有更顺畅、更和平、更安全的选择，所以才会不断的容许这样的情形发生：即使有人说你坏话，也选择默默承受；即使有人故意讽刺你，也选择忽略不理。当然，这也是一种方法啦！更何况像这样不反驳对方、装傻带过，表面上看来，人际关系应该很顺利吧！


