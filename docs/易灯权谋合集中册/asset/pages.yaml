- pgno: 1033
  md: '——保持距离。别和小人过度亲近，保持淡淡的关系就可以了，但也不要太过疏远，好像不把他们放在眼里似的。


    # 老狐狸察言观色的五种方法


    韩非子是战国末期的大政治家，也是察言观色的高手，他认为只有能看透人心的君王，才能妥善地驾驭臣子。他所总结概括出来的察言观色五法分别是：


    # 一、紧扣事实，对照语言。


    韩非子认为，只听他人的语言，而不用事实来证明，是难以知道真相的。臣子向君王进言，总是免不了带着说话者的立场和主观印象，即使他想如实诉说，话语表达上也不一定完全与事实相一致。如果说话者渗透进个人的主观愿望，或者是为了达到'
  merge: -1
  img_proc: true
- pgno: 1034
  md: '某种目的的故意说出一些与事实不一致甚至是相违背的话来，都是有可能的。


    君王总是喜欢听好话，所以总有那些臣子投其所好，专拣好听的说，而这些好听的话不一定都是与事实相一致；还有些好话是别有用心的恭维，甚至是曲意歪曲事实以达到某些不可告人的个人目的。君王听惯了好话，以后就再也听不到与事实相一致的话了，他的判断与决策就会脱离事实，就会偏离方向，那就很危险了。


    所以，听其言，观其行。听完臣子的进言以后，一定要找到事实，用事实来对照，真正弄清楚这些话的真假。千万别轻信所说。


    # **二、创造机会，发掘才能。**


    君王要相信每一位臣子都是有才能的，要善于发掘每一位臣子的才能，让他们为国家服务。发掘臣子才能的最好的办法就是创造机会，让每一位臣子都能够将自己的才能展现出来。就是吹夸，也不能总是合吹，每次都是合吹，就有充数的人。要经常搞'
  merge: -1
  img_proc: true
- pgno: 1035
  md: '些单独吹等。要在实际工作中，创造一个个机会，让每一个人都单独表现的机会，这样才能观察出每一个人的实际才干。


    # 三、故弄玄虚，探知究竟。


    君王要想真正驾驭臣子，还必须在正常的管理制度之外，做一些故弄玄虚的工夫，比如给某位臣子突然安排一件事情去做，临时中止某件事情的办理，交给另外的臣子去办，让臣子摸不清君王的真实心思，让臣子总在揣测君王的真实想法，同时永远有种丈二和尚摸不着头脑的感觉。这种不断的变招，会使君王对臣子的情况有更清楚的掌握，而臣子对君王总是战战兢兢。有种不服不行的意愿。


    # 四、若无其事，试探对方。


    君王对自己明明知道的事情，也假装不知道，心理已经很明白了，还是若无其事的去问一问臣子，这样也可以试探到一些臣子的真实情况。战国时期的韩昭侯，一天在修剪指甲，故意将一片剪下的指甲屑放在手心内，然后问身边的侍臣：“有片指甲屑'
  merge: -1
  img_proc: true
- pgno: 1036
  md: '丢了，你们帮我找一找。”大家都没有找到，这时有位侍臣悄悄出去剪下了自己的一片指甲呈上，禀报说找到了。昭侯由此知道这位侍臣是一位会说谎的人。


    # 五、故布疑阵，试探人心。


    君王总得知道臣子的真实想法才可以驾驭，而怎样才能知道臣子的情况，这


    君王的驭人之道。有时可以故意设下疑阵，臣子的本来面目就空显出来了。


    有这样一个故事，燕国的宰相子之一次在家闲聊，几位家臣与子之不着边际的聊着，子突然说：“刚才从我们家门前出去的是不是一匹白马？”大家面面相觑，谁也不敢吱声。后来有人说：“没有啊，我没看见。”跟着大家都说没看见。这时有一位家臣外出转了一圈，回来报告：“确实有一匹白马从这里过去了。”子之明白了，这位家臣是一位会说谎的人。'
