- pgno: 631
  md: '谚“坐山观虎斗”,这说明，如果一个团体、一个国家、一个民族自身不团结，甚至发生派系纷争现象，就会给对手提供千截难逢的良机。所以，万事和为贵，即使因工作发生一点争吵和摩擦，也应互相体谅、互相理解，共同努力，解去一切误会和疙瘩：要知道，内讧和自相残杀对大家都没任何好处。


    # **成事的关键在于一张脸皮**


    人不能只有一张脸皮，如一张脸皮，一旦被人撕破，虽不至于危及生命，然血淋淋情状，足以令人怕不胜怕。尽管当前有修补术，但比起原装的那一张，恐怕有天渊之差了！'
  merge: -1
  img_proc: true
- pgno: 632
  md: '故认定一张脸皮不行。尽管《厚黑学》作者对“厚黑”之优越性一再润色，然再厚也终究是一张而已。即便厚度如城墙一般，但若是被人一镢头下去，虽然出血之类的情景暂不考虑，然面颊上筑一个偌大窟窿，不但外人看着不美，便自家心里头恐怕也不是滋味。于是，认定那《厚黑学》的作者实在幼稚可笑，且可笑之余，决心杜撰一遍文章，虽不敢说标新立异，但也有心在鲁班门前耍一回斧子。


    从此，便置身于这一领域之研究。几经'
  merge: -1
  img_proc: true
- pgno: 633
  md: '苦思冥想，终于得出：“一张脸皮属愚，数张脸皮属智，揭之不尽者属圣”的最新理念。后来，又从《川剧》之变脸术中得到启发，然又以为美中不足。尽管精彩，但毕竟脸皮有限，若是能有一张“多功能脸皮”岂不最好。如“多功能脸皮”者，那就任人揭去，因他揭去一张旧的，我还能生出一张新的。于是屡揭屡有，如之奈何？所以谋大事者，决不可只有一张脸皮。不然，如何经受住各种打击，又如何能承受那奇耻大辱！


    就如韩信碰上了无赖，虽腰间也有一把刀挂着，但韩信非但不敢杀，还众目睽'
  merge: -1
  img_proc: true
- pgno: 634
  md: '暌之下，从那无赖的裤裆底下爬过去。若是韩信只有一张脸皮，那就势必与那无赖鱼死网破。于是，不仅后来的“三齐王”难当，恐怕一条小命也保俱全。又如张良，若是也只有一张脸皮，便不会为黄石公三次拾履。然不拾履，如何能得黄石公之真传！不得黄石公之真传，又如何能干出一番名彪青史的大事业！


    然而，《水浒传》中之杨志便不同了。他也遇一市井无赖，然只有一张脸皮。于是一怒之下，竟将无赖一刀斩杀。后来，不仅功名不存，又被官府判了充军。所以一旦遭到侵犯，一定要权衡利弊。


    635'
  merge: -1
  img_proc: true
- pgno: 635
  md: '被人羞辱时，最好冷静考虑。若是环境不利于我，我决不可以鸡蛋碰石头，也不能一双新鞋踩那臭狗屎，这就是大丈夫能屈能伸的道理。


    凡“多功能脸皮”者有两类人：一类是事业中人，一类是堕落中人。前者属君子，后者属小人。如君子的“多功能脸皮”，是为了成就事业；而小人的“多功能脸皮”，则是为了继续堕落。因为事业，君子在某种情况下不得不忍辱负重；因为堕落，小人在某种情况下不得不寡廉鲜耻。'
  merge: -1
  img_proc: true
- pgno: 636
  md: '所以，君子的美德在于忍耐，然忍耐不等于懦弱。于是，一切耻辱反而会成为干事就业之动力。就如越王勾践被吴国俘虏之后，他就立刻换了一幅面孔，且装那夹尾巴狗一般。不仅响屁不敢放一个，还大庭广众之下尝那吴王夫差的粪便。然而一旦获释，他立刻如猛虎归了山林。且从此卧薪尝胆，终于在范蠡、文种之辅佐下灭了吴国。


    假若勾践只有一张脸皮，且抱定“士可杀，而不可辱”之决心，那就非但完不成复国大计，恐怕连小命也没了。如楚霸王项羽，若也能多几张脸皮，又岂能会


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_636_0.png)'
