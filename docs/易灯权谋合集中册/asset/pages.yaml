- pgno: 311
  md: '# 完成了自己人生认识的一次

    重大转变


    汉高祖刘邦本不喜欢儒生，甚至恨儒生，有客戴儒生的帽子来，刘邦强行“解其冠，溲溺其中”。“与人言，常大骂”儒生。究竞高祖为什么恨儒生，可能他的生性就不喜欢读书人吧。既然刘邦不喜欢儒生，那么儒生为什么还要投身于刘邦帐下呢？第一，儒学的本身是积极用世，儒生们总想一展自己的执政能力；第二，秦王朝“焚书坑儒”，哪个儒生不恨秦始皇，不少儒生就因此加入了秦末农民起义军。但是刘邦接触的三位儒生使刘邦的人生认识发生了重大的转变。这三位儒生分别是郦食其、叔孙通和陆贾。


    先看郦食其。据《史记·郦生陆贾列传》，沛公率兵过陈留，郦生用脚踢开军门，要使者通报，“口画天下便事”，即讲述谋天下的大事。'
  merge: -1
  img_proc: true
- pgno: 312
  md: '郦生入，长揖不拜，原因是沛公正偃床使两女子洗足。郦生说：“你要聚义兵诛无道的强秦，不应该以这样傲慢的态度见长者。”直言不讳的批评使刘邦醒悟。刘邦“辍足，起摄衣，延郦生上坐”。郦生说：“足下起纠合之众，收散乱之兵，不满万人，欲以径入强秦，此所谓探虎口者也。陈留，天下之要道，四通五达之郊，今其城又多积粟。我与其县令相熟，请让我去劝说，令其归顺沛公。如不然，足下举兵攻之，臣为内应。”于是，郦生行。但陈留令是不愿随沛公的，郦生夜半斩下陈留令的人头，逾城而下报沛公。沛公随后占领陈留。沛公在陈留南城门安营扎寨，依靠其充足的兵食积粟，出入三个月，部队得到休整和扩充，“从兵以数万，遂入攻秦”。


    如果沛公不能占有陈留，得不到充足的粮食和兵源，“遂入攻秦”是不可能的。'
