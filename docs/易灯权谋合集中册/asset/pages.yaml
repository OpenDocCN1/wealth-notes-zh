- pgno: 243
  md: '的权力早就垂涎三尺，可惜自己的力量不够，因而玩弄欺诈之术。他在对秦国说“以晋河西之地于秦”、在于里克说“封子于汾阳之邑”时，心里就不想兑现。这只是政客的一种借力之术。政治家们越是在实施关键的阴谋步骤时，越是制造弥天大谎。正如，越是毒性大的蘑菇，越是鲜艳美丽。而涉世不深者，总是信以为真。箴言，是不需要伪装的，她清白如水；一旦披上华丽的色彩，必定是谎言。“以晋河西之地与秦”，那是一片多么大的地方，颇具诱惑力；“封汾阳之邑”，简直把里克抬到仅次于君主的地位了。


    晋惠公的权术之二：转移视线，嫁祸于他人，把有助于他的人整死。世人都认为二君之死与夷吾上台有关。晋惠公却赐死为他上台有功之臣里克，夷吾就成了严惩凶手、为民讲话、为死去的君主伸冤的英明君主，反之，里克就'
