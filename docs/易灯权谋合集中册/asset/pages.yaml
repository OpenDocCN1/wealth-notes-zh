  md: '的午餐休息时间调整成跟所有同事都不一样，以此做为对你消极的挑衅惩罚，我重写一下她真正想说的话。她说：哈！你有三个星期没办法跟你的朋友一起吃午餐啰。但是我发誓你听到的会是：我说你也不敢用这些没有朋友打扰、宁静的午餐休息时间去应征工作！让她知道，你就是敢这么做！


    # **大人级的回嘴技术，吵赢又不撕破脸**


    职场上有些人说得一口好工作，靠着口才装腔作势、把事情推给别人。


    像是被问到工作进度时，回一些模棱两可的词句，像是我会尽快回覆我会秉持诚意来处理。如果轻易接受这些托辞，不只把自己累得半死，还可能得收烂摊子。还有一种情况是，利用情绪化发威吓吓你，要你接受他的方案，例如不把这个客户交给我，我就不加入这次的专案。


    面对威吓或滑溜的言语，如果不适时反击，在别人眼中很有可能就变成好欺负的人。因为在面对与自己立场不同


