- pgno: 603
  md: '为了达到自己的卑鄙的目的，不惜让自己的妹妹作色情间谍，但美人计之所以得逞，亦全在于春申君晚年的腐化蜕变。正好像很多男人在“枕边风”前，一吹就迷惑，春申君竟然对李园之妹的话深信不疑。春申君从一个礼贤下士、机智多谋的英才蜕变为腐化奢侈、专断昏愤的庸人，最终走向自己的反面，更值得人们深思，这可为贪恋权势者戒。


