- pgno: 403
  md: '# 从小励志


    和珅能够在窘迫，贫寒的家境中脱颖而出，成为权倾朝野，富可致国的巨贪。与他很早就立下志向是分不开的。


    和珅生于乾隆十五年，他的父亲常保曾经是乾隆时期的福建都统。常保为官清廉，而且多年征战戍守在外，所以，没留下多少家产。等他乾隆二十五年病逝在福建任上时，和珅的家境立刻窘迫起来。


    和珅的亲生母亲生下他的弟弟和琳之后不久就病逝了。继母对待他们兄弟二人极其苛刻。这些都使和珅从小就饱尝了人间冷暖，受尽了别人的白眼。然而这些并没有让和珳就此消沉下去，反而激起了他出人头地的强烈欲望。


    乾隆二十四年，和珅和弟弟和琳一起被远入咸安宫官学。这是京城最好的学校，入读的大多是家境殷实的八旗子弟或是内务府子弟。这些人倚仗着父祖的富有和权力，宝马'
  merge: -1
  img_proc: true
- pgno: 404
  md: '轻工业裘，骄横拔扈。贪婪好学的和珅兄弟，虽然天资聪颖，才智过人，却屡屡遭人歧视、侮辱。


    有一次，一位大员的儿子写了一首嘲讽老师的诗，却说是和珅作的。恼羞成怒的教师不容和珅分辩就抄起戒尺一通乱打。和珼知道，向这样的教师只敢在他这等学生身上发泄自己的怒火，却无论如何不敢招惹大员的儿子。戒尺一下下打在和珼的身上，渐渐打碎了他心中的良知。


    和珅知道，在这样的社会中，最重要的就是权力和金钱。只有有了这二样，才会得到别人的尊重，才能尽情的享受人生，才能要那些势力的人们屈从奉承自己。


    从此，权力和金钱就成了和珼生命中最重要的目标。为了得到权力，他刻苦攻读，处心积虑，想尽一切办法去接近皇帝，放弃了做人的人格和尊严，不惜一切的阿谀奉承，曲意逢迎付得了乾隆的欢心，以罕见的速度一路攀升，终于成'
  merge: -1
  img_proc: true
- pgno: 405
  md: '了一人之下，万人之上的宰相。他几乎把握过大清帝国所有有实权的职位，国家的人事权、财权、军权，文化教育大权，民族事务及外交大权都直接的控制在他的手里，以改于朝鲜使者和英国使者都把当成二皇帝。


    对于金钱，和珅更是显示出了绝无仅有的贪婪，他对金钱的执着几乎是变态的。他被嘉庆帝查抄时的财产，相当于他执政二十年间整个大清帝国财政收入总和的一半还要我多。堪称当时的世界首富。


    纵观和珅的一生，他从来对自己少年时立下的志向有过一丝一毫的动摇，也可以说得上是矢志不渝了。这也许是人对权力和金钱的追求因为欲望的驱使更容易持守，但和珅为此而作的种种努力与忍耐，付出的种种艰辛，对我们或许也不无教益。'
