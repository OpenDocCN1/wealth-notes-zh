  md: '权有力的君王，而强权有力的君王绝非泛泛之辈，优柔寡断畏畏缩缩者不行，四肢发达头脑简单者不可，纯粹的狮子无法“守业”，完全的狐狸难于“创业”，故而，在马氏看来，狐狸和狮子的结合成就了完满。


    # 枭雄权术上位之道


