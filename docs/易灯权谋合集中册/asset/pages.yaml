  md: '愿意向他“透露”一件人事机密：最近，“我”打算提拔某人当生产科长，（向他显示我有提拔干部这实权）；过不多久，某人果真被提拔为生产科长（再次“刺激”他一下）；乘他心情不好之际，向他“暗示”：某人有一个突出优点，就是领会领导意图较快，爱“接近”领导（他听了以后，低头不语）；又过了几天，他主动找到领导家里，要求今后对他多“帮助”（终于“上钩”了）。从此以后，该中年干部，果真被这个上司牢牢“控制”在自己手里，成为“他”的人了。


