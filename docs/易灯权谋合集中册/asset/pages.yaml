- pgno: 234
  md: '赂之罪杀之。宋太宗即位之初，为了考察臣下处理刑事案件是否公正，用权威镇服臣下，令侍从用自己的佩刀杀死一个在富户门前无理取闹的乞丐，然后弃刀而去。案件上报朝廷，太宗下令严加搜查，务必缉拿凶手。官府以刀为证据而判该富户犯有杀人罪。刑官将审理结果上奏朝廷，太宗问：“该犯服其罪吗？”刑官答曰：“服矣。”太宗令献上刀来，又叫内侍取来自己的刀鞘，对刑官说：“此为朕所佩之刀，乞丐实为朕使人所杀，你如何冤枉好人？”《宋人轶事汇编》卷一《太宗》。满朝文武大臣始知太宗治臣有术。


    其五，君主驾驭臣下要诡诈多变，出其不意，使其防不胜防，因而不得不慑服于君主的威势。楚汉战争时，张耳、韩信统帅汉军救赵。一天早晨，刘邦带领侍从突然驰入军营。张耳、'
