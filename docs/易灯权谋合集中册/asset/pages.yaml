  md: '周文王茫然地问道：“这么说来，的确是我错了。可是，国家毕竟还是需要管理的，我应该怎样做才对吧？”


    姜子牙说：“管理之道，在于以人为本。当你懂得了以人为本的道理之后，你就懂得了管理学的奥秘。”


    # 以人为本的“本”义


    以人为本是人力资源管理的核心内容。可是，究竟什么是以人为本呢？是以人为资本吗？或者以人为成本吗？


    在一个渔夫式的老板眼里，人力资源管理的的确确是一种资本或者成本。在他看来，所谓以人为本，不过是因为使用人才所付出的资本或者成本罢了，如同因为钓鱼所付出的资本或者成本一样。于是，人力资本和人力成本的管理学理念，在这个渔夫的世界里大行其道。


    但是，这个理念错了。在汉字文化中，以人为本的“本”其本义，指的是树木的根部。所以，以人为本的意思是说，管理学最根本的道理，乃是对人的理解、尊重和爱护。'
  merge: -1
  img_proc: true
- pgno: 1414
  md: '问题在于，渔夫怎么会懂得爱呢？渔夫只懂得贪婪、权谋、战争，以及战争所带来的利益和成本。就像张嘴和尚念经一样，以人为本的本来意义在渔夫的管理学词典中遭到了曲解。


    让我们抛弃那种渔夫式的管理学吧，因为那是一部错误的和可耻的管理学。我们需要一部正确的和高尚的管理学，那是一部园丁式的管理学。只有园丁才懂得以人为本的“本”义，只有园丁才懂得如何让生命去生根、发芽、长出枝叶、绽放花朵，直到成就和奉献出甜美的果实。


    所以，当周文王向姜子牙请教的时候，姜子牙说：“研究管理学的目的，在于培养员工的奉献精神。请你去看一看那些果树吧！在那些果树身上能够找到管理学的奥秘。”


    经商像治国，商场如官场'
  merge: -1
  img_proc: true
- pgno: 1415
  md: '16 世纪意大利政治家马基维利写的这本《君王论》（1532 出版），一出版即被贴上阴谋论的标签。古今能够如此大格局地洞察人性的奇书，在欧陆也唯有《君王论》。


    强权就是真理在这本让他流芳百世也遗臭万年的小书中，马基维利诚实而直接地揭露了群众的人性面，并且毫无愧色与迟疑地劝说君王善用人性的弱点，在维护政权和国祚的前提下，甚至可以运用诈术或欺骗手段。这种将道德视为附属于政治对策的权宜之计，让后世衍生了马基维利主义等负面的名词。


    而从马基维利的生平来看，他也贯彻了他的信念，一生都追随并支持大胆的野心家（如他心中典范型的领导者——范伦铁诺公爵席萨尔包尔琪，他对内屠杀占领区的王室强敌和军阀，对外积极拉拢罗马强权来巩固势力），认同强权即真理。从历史角度来看，在
    16 世纪动荡分裂、强敌环伺的义大利，马基维利的权谋其实有其不得不然的理由，背后也有复兴义大利的使命在支撑，因此渴求一位机伶的强者。而历史的明证是，纯粹的权谋者往往也被权谋者所害，并且无法带人带心，败德的领导者更无法激起民心士气。


    # 永远不能与群众为敌


    企业的经营、开创和领导上，很多地方和治国有类似之处。为何今日我们仍然能够从这本书获得不少宝贵的心得，那是因为它一切的术数都是源于一个伟大的前提——只要能'
  merge: -1
  img_proc: true
- pgno: 1416
  md: '国（企业）强大地维持下去，守护（服务）万千子民的大仁大义，远比君王本人的小仁小义要更加可贵。


    马基雅维利不否认，君主的荣誉和品德才是号召人民的最大条件，因此君王即使自身没有条件来奉行仁义的时候，也要伪装拥有这些品德。宽容地来看，这是因为领导者所为的是国家而非个人毁誉，为此伟大的目的，则一切小恶都显得高贵了。


    书中提到，凭借自身能力才智来得到大位的君王，如带领以色列人出埃及的摩西，或罗马的开创者罗穆拉斯，要建立王国极其困难，因为开创一个新制度遇到的阻碍最大。但是一旦能够克服万难，就能够长久、顺利并受敬重地维持下去。而光凭借幸运得到权势的，却少有能够长久的。因为开始没有把根基稳固，往后就得用极大的聪明才智才能保持。


    而如果是靠着残暴手段来攫取王位的，事实上只能在一开始一次用尽残暴手段，之后就必须放下屠刀尽力与人民修好，甚至善待人民，如果这样，就会赢得人民信任。因为君王永远不能同平民为敌，而却可以同贵族为敌，因为平民人数众多。


    就像是企业可以得罪同业或其他竞争者，却永远不能与顾客为敌，永远要努力与顾客站在一起，因为顾客才是支持企业的力量。


    领导不可以假手他人'
  merge: -1
  img_proc: true
- pgno: 1417
  md: '总之，一个君王要维持他的国祚，并非靠幸运、手段、军队或其他，马基维利道出的重点，其实应该是，什么都可行，但是只能用来对付敌人而非人民，若要基业长青，一个领导者最后能够凭恃的还是亲力亲为，以及个人的勤恳和实力。领导不可假手他人，就像国家不能倚赖雇佣兵。企业领导者就像君王，时刻都要以商场、策略、管理为念，并且也不应该再有别的目的和思想。当领导者开始想到奢侈安逸时，国桓亡。在管理上，平时要比战时更重训练。


    一个好的领导者要在平时操练他的士兵，让他们保持高度的行动力，也要永远熟悉自己的地形（商场），勤于思考战术，才能让领导者可以随时发现敌人、选择营地、统筹作战。


    # 大局不需要在意外小节


    最后，关于君王的品德，马基维利也给了精采的答案：很多看似好的品质其实不见得是好事。君王与其慷慨不如吝啬，让国库充盈，在战时或萧条时也不至于增加赋税，才是真正的慷慨。这和今日企业领导讲求精实领导的精神不谋而合，企业不分大小任何支出都要务求合理，连干毛巾都拧得出水的程度，企业才能够长久。如果小钱不守，景气不佳大钱不入的时候，往往就因为管理上的宽松而导致组织的灭亡。


    又如，君王要被爱还是被惧比较好？如果必须择其一，被惧比被爱安全得多。而君王如果不能得到爱戴，至少要避免被


    1418'
  merge: -1
  img_proc: true
- pgno: 1418
  md: '怨恨，这时候领导者严格驭下的纪律就胜过仁慈地放纵。又如，君王是否要守信？马基维利认为君王既要用法律也要能用武力，当有人对你背约失信的时候，你也不必要守信，而只要能够找到正当理由就可以大方地背信，甚至只要装得像是仁慈守信即可。这说法不免让我们联想到今日的某个托拉斯企业，看似最照顾消费者，其实是市场的垄断者、资讯的阻挡者，而它们看来正是马基维利主义的最佳信徒，为何仍享有高度的信誉和肯定呢？


    其实以上这些让《君王论》恶名昭彰的说法，客观看来不无道理，只是当它们被断章取义的时候，才会让这些言论变得危险。所有的必要之恶，只要大方向是正确的，或许也就可以被体谅。只要掌握到最核心的思想——领导者应该全心全意以国家（企业）为念，避免贪婪和个人欲望，勤于治国（管理），则其他的招式或术数都可以一概遗忘。


    1419'
