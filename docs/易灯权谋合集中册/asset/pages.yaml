  img_proc: true
- pgno: 1318
  md: '晰认识，对领导的战略规划坚决支撑，对部门的各项事务合理安排，对下属的具体工作不厌其烦的指导，更为重要的是对自己和所在部门设定的目标要自始至终的坚持，面对诸如市场状况的变化、组织结构的调整、人力资源的整合等现象，大胆的声明自己在事业中的执着态度，决不放弃个人和组织既定的目标。


    # 3. 必不可少的宽容


    睚眦必报者不能管理。所以，作为中层的管理人员还要有必不可少的宽容之心。这里强调的必要的宽容是对同事和下属的疏忽大意、不重细节、方法迟钝甚至妄言是非的宽容，但又不能无限制的宽容，尤其不能对那些消极应对、满腹牢骚的工作态度予以宽容。方法不先进可以磨砺，态度不端正不能容忍。在必要的宽容中，以极大的耐心帮助周围的这些方法落后人，以坚定的勇气批驳那些态度倾斜的人。不但如此，中层管理者还要宽容那些团队中性格张扬、才华卓越的人的某些做法，无论是不拘小节言语唐突，还是能力非凡气质昂扬，其实需要的恰恰是别人的宽容，给他们必要的宽容则收获惊艳的成就。


    # 4. 合理适度的创新


    中层管理者不是优秀的技术人员，也不是精英式的市场人


    1319'
  merge: -1
  img_proc: true
- pgno: 1319
  md: '才，更不是一呼百应的企业领袖，侧重于日常经营的常规性工作。所以，要在工作中以创新的思维开创新鲜的思路和方法，但不能过分的追求创新的程度和数量，保持合理适度的创新，既活跃了工作的基本程式，又不会靡费太多时间。把创新交给钻研创新的人去，把精力放在耗费精力的事上。


    # 5. 近乎偏执的仔细


    近乎偏执的仔细是中层管理者的一件法宝。管理者，管人理事也。管人无大事，理事不可轻。对工作的仔细，近乎偏执的仔细就是“不放过任何一个细节（松下幸之助语）”，从细节中关注每位员工的工作态度和情绪，从细节中分析任何一件事务的处理方法和效果。对于企业制度的建设、企业文化的锻造、突发事件的处理、危机管理的实施，我们不能粗犷地对待任何一个环节。


    # 6. 长期共同的学习


    学习型组织和学习型个人的概念决非一个时髦的词语，而是要管理者无时无刻不关注的一种理念。对中层管理者而言，只有长期不断地学习才能保证自己地管理方法先进、管理技巧灵活，能合乎时代的思想启发上司、带动下属。另外，我们更关注的是管理者带动全体的共同学习思潮，特意组织和安排相关的人员参与集中式学习，在日常工作中采取现代


    1320'
  merge: -1
  img_proc: true
- pgno: 1320
  md: '多媒体手段实施日常化学习，让组织及其成员感受到时代的气息和学习的巨大能量。


    # 7. 融洽欢畅的沟通


    中层管理者的日常工作之一就是沟通，应该如此讲，能否在一种融洽欢畅的氛围中和上下层进行沟通反映出管理者的基本能力。工作计划的传递、执行困难的反馈、日常经营的现状都必须在沟通中反映出来，更要在沟通中不断地加以解决。融洽欢畅就意味着思路开阔、代表着不急不躁，管理者要运用各种方法进行协调，创造沟通中地融洽和欢畅。


    # 8. 决不彰显的奉献


    面对各种升迁、学习和表彰的机遇，中层管理者要能够表现出决不彰显的奉献精神。其实奉献是一种精神，但决不彰显的奉献就是一项难能可贵的素质。从组织整体的发展来讲，这种奉献素质有利于协调整体的利益，增强组织成员的工作动力。但是，我们中层管理人员必须重视的是——不彰显，否则容易被别人误认为故作姿态、炫耀而已，非但达不到奉献的目的，甚至有可能弄巧成拙。


    # 9. 大智若愚的智慧


    领导者自有谋略，管理者无缺智慧。对于广泛接触各个层面'
  merge: -1
  img_proc: true
- pgno: 1321
  md: '的中层领导者而言，更需要智慧，而且是一种大智若愚的智慧，而不是精明算计的智慧。这种智慧表现在对上层保持本色不谄媚，对下属中正和不摆谱，对惊喜之事由衷地欣赏不遮掩，对烦扰的事保持冷静不厌烦。体现出这样地智慧会让所有的同事都坚信你在管理岗位的合适和必要，既能找到和睦的归属感，又能看到组织环境的稳定。


    # 10. 勇敢沉着的果断


    中层管理者的第十项必备素质是处事果断，风格鲜明，决不拖泥带水。日常工作中的果断体现在对制度的熟悉和坚持，对责任分析和承担，对不合理现象的明确和批评，尤其是在关键时刻，作为直接面对员工、外界甚至危机的直接责任人和处理者，必然要求中层管理者具备勇敢、沉着、果断的作风，给内部因素和外界环境一个赏罚分明、有章有度、责任明确的形象。


    1322'
  merge: -1
  img_proc: true
- pgno: 1322
  md: '# 慎战谋攻的战略决策


    《孙子兵法》是兵家思想的典型代表，一方面体现了刚健进取的齐文化精神，另一方面也蕴涵着崇尚静柔的吴、楚文化特色。同时，包含着丰富的管理智慧。后人根据孙子和历代兵学家的思想，结合中国古代实际战争案例，总结出“三十六计”，使《孙子兵法》所代表的兵家思想更加通俗易懂、具体实用。


    孙子把战争实力表述为静态的“形”和动态的“势”。围绕“形”的分析和判断形成了以“庙算”为主要形式的战略运筹理论和慎重决策思想。围绕着战争实力的建设和保持，形成了以“令文齐武”为核心的用人思想，以“五德”兼备为主要内容的将帅论和以“因粮于敌”为主的后勤理论，并以“虚实”为核心形成了各种具体的作战原则。


    今天，我们全面发掘和深刻体会兵家的智慧，对于当代的经营管理、行政管理及其他各类管理活动都会有重要的借鉴和指导意义。


    # 运筹帷幄的管理战略


    1323'
  merge: -1
  img_proc: true
- pgno: 1323
  md: '在孙子的战略体系中，国家利益永远高于一切。为了实现这一最高利益，他提出了“合利而动”、“慎战谋攻”、“广结友好”等一系列主张。


    特别要指出的是，孙子研究战争的落脚点不在于胜负，而在于“利害”。既要在有利的形势下看到潜在的问题，以防患于未然，又要在不利的情况下看到有利的一面，创造条件，使利害关系向着有利于己的方向发展，以最小的代价换取最大的胜利。


    # 合利而动的战略原则


    孙子认识到，利益冲突是战争的根源。基于这种认识，他把战争分为“合于利”与“不合于利”两种。“利”具有广泛内容，归纳起来有三个方面：


    +   一、是指国家的政治利益；


    +   二、是指经济利益；


    +   三、是指军事上的有利地形。


    孙子把“利战”的思想贯彻到战争的整个过程之中，因为战争的出发点就是要保护本国民众的利益，只有民众和部属得以保全，才符合国家和君主的根本利益。'
  merge: -1
  img_proc: true
- pgno: 1324
  md: '# 慎战谋攻的战略决策


    孙子提出“慎战”的思想，主要表现在以下三个方面：


    首先，慎重决策。孙子把战争摆在了关系社稷民众之生死存亡这一国家大事的位置上来，因此必须要谨慎而行。战与不战，要看是否于国有利，切不可依据个人的喜怒好恶而草率作出决定。明智的君主对待战争必须慎重，良好的将帅对待战争必须警惕，这些都是关系到国家和军队安全的根本道理。


    其次，慎用武力。战争中，尽量用伐谋、伐交的方法达到“不战而屈人之兵”的目的。在孙子看来，要取得战争的胜利，不一定非得动用武力不可。他指出：大凡用兵的法则，使敌人屈服是上策，用武力击破它就次一等。因此，“百战百胜，非善之善者也；不战而屈人之兵，善之善者也。”


    最后，有备而战。迫不得已要进行战争，就要先进行“谋攻庙算”，做好各方面的充分准备。至于谋算的内容，孙子指出，从以下五种情况便可预知胜利：知道什么情况下可以打，什么情况下不可以打的，会胜利；懂得根据兵力多少而采取不同战法的，会胜利；上下齐心协力的，会胜利；以有'
  merge: -1
  img_proc: true
- pgno: 1325
  md: '准备对待没有准备的，会胜利；将帅指挥能力强而国君不加牵制的，会胜利。因此，孙子特别强调：“知彼知己者，百战不殆；不知彼而知己，一胜一负；不知彼，不知己，每战必殆。”


    柳传志曾说，制定路线时要分析四个方面：大的形势、企业内部的资源能力、所从事的行业、竞争对手。对这四个方面进行了分析之后，才能制定出好的战略路线来。


    # 广结友好的外交韬略


    中国古代的政治家和军事家，很早就注意到了外交活动的重要性，他们把发展同周边国家的睦邻友好关系，结成友好互助同盟看作是富国强兵的重要手段。孙子说：“故上兵伐谋，其次伐交，其次伐兵，其下攻城；攻城之法，为不得已。”


    要实现“伐交”胜敌的目的，首先要以强大的实力作为后盾，威慑敌国；其次，要亲仁善邻，广结友好；第三，要多方干扰敌国，使之内外交困。'
  merge: -1
  img_proc: true
- pgno: 1326
  md: '中国古代通过外交手腕达到战略目标的事例甚多，如孔子的高足子贡曾运用外交手段而“存鲁，乱齐，破吴，强晋而霸越”。张仪提出“连横”政策，瓦解了六国联盟。


    # 奇正相生的经营策略


    策略首先是一种原则，即它必须要符合总体的战略目标；同时它又是一种艺术，即在总目标确定以后，在具体运用时，还要作一些变通。在军事和经营领域，都非常强调变通，即“奇”与“正”之间的变化。


    # 正合奇胜的权变策略


    现代权变理论管理学派认为，由于组织环境变化迅猛，管理者必须善于变通，运用不同的管理方法和手段，以适应不断变化的环境。在中国管理哲学中，兵家主张对军事组织的管理要运用奇正因变之术，既有正兵，又有奇兵，有时以正为奇，有时以奇为正，奇正相生，因势而变。


    对于奇正相生的具体方法，孙子在《计篇》中作了详细的描述：能攻而装作不能攻，要打而装作不要打；要在近处行动而装作要在远处行动，要在远处行动而装作要在近处行动；


    1327'
  merge: -1
  img_proc: true
- pgno: 1327
  md: '对于贪利的敌人，要乘机攻取它；对于力量充实的敌人，要加倍防备它；对于强大的敌人，要暂时避开它；对于鄙视我方的敌人，要使其更加骄傲；对于休整得充分的敌人，要设法离间它。这种奇正因变的思想可以说是贯穿着《孙子兵法》的始终。


    # 避实击虚的致人策略


    关于进攻的方向，孙子认为， “夫兵形像水，水之形，避高而趋下；兵之形，避实而击虚。”避实击虚是进攻者在选择作战目标、确定进攻路线和主攻方向时所用的一个谋略。孙子讲虚实是从应变角度出发的，着眼点在争取作战的主动。在他看来，善于指挥作战的人，总是能调动敌人，而不被敌人所调动。古代兵书《李卫公问对》认为，兵法中千言万语，其最重要的莫过于
    “致人而不致于人” 这句话，它揭示了打仗要争取主动这个真理。


    避实击虚的方法多种多样，其中最常用的有攻其无备，出其不意；避敌坚实，攻其空隙；避实击弱，避众击寡等。它之所以能够克敌制胜，一是因为虚弱之处易打，二是虚破则实减，把手虚弱地方攻下来，其实处就必然变得虚弱，整个体系就必然随之动摇。'
  merge: -1
  img_proc: true
- pgno: 1328
  md: '孙子认为，可运用“示形”的方法，把我方的兵力和进攻意图隐藏起来，给敌人造成假像，使其上当受骗。“三十六计”、“百战奇略”中的许多计谋都是与避实击虚相关联的，如声东击西、调虎离山、降战（假投降）、强战（强则示之弱，能则示之不能、弱战（弱则示之强）、远战（远则示之近）、近战（近则示之远）等等。


    # 迂直兼用的制胜策略


    在《孙子兵法》讨论的种种矛盾关系中，迂直关系是其中的一对，也是权变策略中出奇制胜的一种。《孙子兵法·军争篇》提到：军争之难者，以迂为直，以患为利。所谓“迂”，就是弯曲遥远的意思；所谓“直”，就是直接切近的意思。两点之间直线最短，这是常识，不足为训；但在战争中，就没这么简单了。由于时间、空间、士卒、虚实等因素，会促使矛盾转化，原来切近的不见得就切近了，而原来遥远的也不再那么遥远了。近而实者反而行难，直变成了迂；远而虚者反而行易，迂变成了直。


    直接正面接触敌人为常法、正法；不直接正面与敌人交锋，绕个弯子，甚至甘心遭受一些损失，避开与敌人主力交战，'
  merge: -1
  img_proc: true
- pgno: 1329
  md: '这是变法、奇法。迂直之计也是奇正之计，它是指表面上走迂回曲折的道路，而实际却为更直接有效地获利创造了条件。故意迂回绕道，并用小利引诱迟滞敌人，这样就能做到比敌人后出发而先到达必争的要地，这就叫作懂得“以迂为直”的计谋。如果不懂得二者之间的变化，就不能与人争胜。


    # 令文齐武的统御方略


    孙子主张，不管是用人或是组织，都要用文武两手去管理。士卒之所以能认真执行命令，是由于将帅与士卒相互取得信任的缘故。因此，统御兵卒就要做到上下协调，赏罚严明，令行禁止，宽猛相济，恩威并施。而这一切，又都取决于德智兼备的将帅素质。


    # 上下同欲的协调方略


    兵家认为，“和”是人际关系的理想状态，是力量的源泉和成功的保证。有了“和”，才能集合群体的力量，提高工作效率，实现理想的目标。孙子非常重视和谐与协调的作用。他认为，“上下同欲者胜”。'
  merge: -1
  img_proc: true
- pgno: 1330
  md: '如何才能实现组织内部的协同呢？孙子认为，协同乃是双方之间的事情。


    一方面，下级一定要服从上级的指挥和命令。只有在特殊情况下，才可以作一些灵活变通，但任何活动都必须符合国家战略目的这个大前提。


    另一方面，上级要给予下级以爱护和关怀。当然，为了协同，仅靠爱护和厚赏是不够的，还必须有一套严明的纪律，令行禁止，赏罚得当。


    新加坡南益集团的创始人李光前非常重视员工，并努力促使他们以厂为家，树立主人翁的责任感。


    南益集团制定了“居者有其屋”的计画，使每一位职员都拥有自己的房屋。集团以无息贷款的方式，把约3年的薪金总额借给职员购买房屋，房贷的业主是集团。而在每年的年终花红中，将该职员的花红的一半用于偿还买房贷款，直到还清。然后把契约归还职员，即房归己有。


    由于南益集团以人为本，顺乎人心，职员们都竭诚为集团卖力工作，成为中坚分子、骨干人员。所以在新加坡流传着一句话：“没有人有本领把南益的人挖走。”'
  merge: -1
  img_proc: true
- pgno: 1331
  md: '# 赏罚严明的激励方略


    在兵家思想中，也提到了激励和赏罚的问题。激赏既是确保实现“利”的重要手段，又是用人使众的一种方法。


    孙子看到军心士气对于用兵作战的重要性。他指出：“三军可夺气，将军可夺心。”那么，如何才能形成高昂的士气呢？


    首先，要善于与部属进行情感的沟通。孙子认为，要想让部属英勇善战，置生死于度外，就必须要爱抚部属。部属从上级那里得到了尊重，士气就会高涨。


    其次，鼓动部属形成同仇敌忾、压倒敌人的英雄气概。要使部属勇敢杀敌，就要激起他们对敌人的仇恨。


    最后，要以赏罚作为激励的重要手段。在《计篇》中，孙子把“赏罚是否严明”作为“七计”，即决定战争胜负的七种考虑内容之一，可见他对赏罚的重视。


    如何行使赏罚，孙子认为：'
  merge: -1
  img_proc: true
- pgno: 1332
  md: '一要让部属心悦诚服，然后再进行赏罚。如果将帅在部属尚未亲近依附的时候，就贸然处罚部属，那部属一定不服，这样就难以使用他们去打仗了。


    二要赏罚及时。打了胜仗而不及时论功行赏，那就很危险。如果有功而不赏，有罪而不罚，则部属疑惑，军心就会涣散。


    三要敢于破格奖赏。如果指挥者敢于施行超出惯例的奖赏，颁发打破常规的号令，那么就会收到万众一心的效果，指挥全军之众就如同使唤一个人一样。


    四要赏罚严明，执法如山，但不可数赏数罚。如果三番五次地犒赏部属，只能说明自己已经没有别的办法了。


    # 恩威并举的控制方略


    兵家主张对兵民既要爱恤，又要使用刑罚，做到恩威并举，宽猛相济，使部属完全听从统治者的指挥，满足统治者的需要。


    孙子认为，要提高军队的战斗力，首先是要爱兵恤卒。他认为，将帅只要能够体恤部属，部属就可以把生死置之度外。但统领军队，仅仅靠爱兵是远远不够的。因此，对部属还要进行严格管理和训练。在《计篇》中，孙子把士兵“是否训'
  merge: -1
  img_proc: true
- pgno: 1333
  md: '练有素” 作为“五事七计”中的一个问题提出来，以强调训练部属的重要性。他要求部属做到令行禁止，闻令而从，违令必究，从而使三军齐勇若一。


    孙子还提出了治兵统军的组织编制问题。一个人统领千军万马，在管理上必然会遇到很多困难，但如果对军队进行队伍划分，分级管理，遇到问题召集各级将吏协调，并授之以方策，则统领三军就会变得如同管理几个人一样容易。


    # 德智兼备的用人方略


    战争的胜负，起根本作用的当然是士气的高低、民心的向背，但是统领将帅的个人因素也起着非常重要的作用。孙子认为，将帅是国家的辅佐，辅佐周密国家就可以强大起来，辅佐疏忽国家就要衰弱下来。


    那么，作为将帅究竟需要具备哪些方面的素质呢？孙子概括为五个方面：智、信、仁、勇、严。后人把这五个条件称为“五德”，这是考察将帅是否称职的标准。在这五个条件中，孙子把“智”放在首位，也比较符合战争要求将帅善于随机应变的实际。'
  merge: -1
  img_proc: true
- pgno: 1334
  md: '除此之外，孙子还讲到将帅应有的其他一些方面的素质。如在性情修养方面，孙子在《九变篇》中指出，将帅有五种致命弱点——有勇无谋，只知死拼，就可能被敌诱杀；临阵畏怯，贪生怕死，就可能被敌俘虏；急躁易怒，一触即跳，就可能被敌凌辱而妄动；廉洁好名，过于自尊，就可能被敌侮辱而失去理智；只知爱民，就可能被敌烦扰而陷于被动。以上五点，是将帅易犯的过失，是用兵的大忌。


    孙子认为，作为一个将帅，应该进不求战必胜的功名，退不回避违抗君命的罪责，只求使民众和部属得以保全，符合于国家的根本利益，这样的将帅才算是国家最宝贵的人才。


    在现实中，五德俱全的将帅往往是可遇而不可求的，高明的统帅就要洞察部下的特点，取长补短，使其通力合作，即能达到胜利的目标。'
  merge: -1
  img_proc: true
