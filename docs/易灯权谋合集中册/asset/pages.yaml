    # 故事一：三千越甲可吞吴的勾践


    勾践于国破家亡的时候，不殉节以谢先王，反而厚着脸皮归降吴王夫差，被囚禁在石屋之内，受辱于强梁之下，身为奴，妻为婢，赤膊躧足，蓬头垢衣，扫牛栏，拾马厩，尝夫差之粪而取怜，甘言阿谀以求赦，这种“扮猪”的精神，放到现在来看，也是真的没谁了。而一旦获释归越，便卧薪尝胆，阴谋复仇，实行谋臣文种的七策，一曰捐货币以悦其君臣（行贿求宠），二曰贵籴粟以虚其积聚（扰乱经济），三曰遣美女'
  merge: -1
