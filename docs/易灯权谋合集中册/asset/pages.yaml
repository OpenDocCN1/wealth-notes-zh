  md: '种“玩死你”的游戏，下到一个小公司里，又何尝没有具体而微者呢？


    我的朋友是中关村某大公司的前财务总监，一年前这家公司刚换了总裁，新总裁过去对她并不欣赏，但是新官上任，首先要了解公司，并根据财务宿弊来铲除异己。于是一年内，我这位朋友一不怕苦二不怕死，帮新总裁纠财务问题，干掉了几个眼中钉，立下汗马功劳。刀光剑影的一年过去了，我这位朋友满心以为去年立了功，今年可以舒舒服服地享受成果了，没想到新总裁新年第一件事就是将矛头对准她。干掉她的办法也很简单，新总裁把原来在她手下的一个她比较看不上的人提起来当她的领导，因为领导没有办公室，所以她必须从办公室里办出来，给新领导腾地方，而自己坐到开放式办公区里去。'
  merge: -1
