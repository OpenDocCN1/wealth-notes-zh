  md: '粗暴、使用蛮力求争取，则落了下乘。即使文学作品也是如此。比如为了写出富贵之象，李庆孙的《富贵曲》是，“轴装曲谱金书字，树记花名玉篆牌”，夸人有钱，不过是堆金砌玉，几乎要去比较一下谁家的金玉堆得更高，码得更好。这样的人虽然有钱，其实还没有脱离穷者心态，还在为自己银钱之多而惊喜，心情久久难以平静。晏殊觉得这样的诗十分好笑，根本没有什么富贵气象，就像有点小钱的，天天拿出来炫耀，随时挂在嘴边，而真正有钱的，反而不显山不露水，但人家一看体貌谈吐，就觉得与众不同。晏殊写富贵，不会说金子、玉器之类，而只写“楼台侧畔杨花过，帘幕中间燕子飞”，“梨花院落溶溶月，柳絮池塘淡淡风”，“笙歌归院落，灯火下楼台”，富贵之

    象自然就流露出来了。这体现出来的心态是，对自己的富贵居之不疑，而没有艳羡或炫耀的'
