    +   v 在这个模式中，收讯者的能力与发讯者的能力同样重要。


    +   v 我相信你听的越仔细，就会越累。 因此必须培养你收讯的能力。


    +   v 好的收讯者要全神贯注的聆听，其实阅读也是一种收讯，须要全神贯注及去除心理包袱的虚心'
