- pgno: 877
  md: '的人，现在，有李密这位被国人敬重的孝廉人歌功颂德，当然喜不自胜，对李密没有怀疑、没有提防，只有喜爱和欣赏了。


    历史上的晋武帝确实提倡过孝道，成熙二年十一月，他就要地方官推举各地孝子出来做官，泰始四年六月，他又发布了内容相同的指示，但我们细读了《晋书•武帝本纪》，发现历史学家们只记载了武帝嘴上说得好，究竟以身作则、把“孝心”落实到行动上没有，就不得而知了，长长的《武帝本纪》，对武帝统治下的晋朝是否真的推行了孝道，'
