- pgno: 1032
  md: '不了你，但你要 知道：小人之所以为小人，是因为他们始终是在暗处，用的始终是阴暗的手段，而且不会善罢甘休。你别说你不怕他们对你的攻击，看看历史的血迹吧，有几个忠臣
    抵挡得过奸臣的陷害？


    小人成事不足，败事有余。如果你这辈子让小人盯上了，那么就麻烦了。小人没有什么事好做，因此他可以专心致志地琢磨你，并把这当作专业。


    所以在交际过程中，为了自己的利益，必须小心谨慎，处理好与 "小人" 的关系。


    聪明人能妥善处理和 "小人" 的关系，主要是这两个策略：


