- pgno: 659
  md: '他怀着对楚国国君的一片赤诚，把宝玉献给了楚厉工和楚武王，可是，两位昏庸的国王都认为这是一块石头，卞和的行为，纯属欺诈主上，因而残忍地斩断了卞和的双脚。等到楚文王继位，卞和抱着宝玉在深山痛哭三月，楚王派人落实，发现果然是一块宝玉，这才为卞和平反昭雪。


    这种人间悲剧一直没有间断过，《淮南子》中记载了这样一个故事：有一个叫邹衍的优秀人才，对燕惠王非常忠诚，可燕惠王却相信谗言，将邹衍抓入大牢。邹衍仰天大哭，悲怆之情感动了苍'
