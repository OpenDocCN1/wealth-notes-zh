- pgno: 1455
  md: '豪瑟现在会用谢谢来取代道歉，她会说：谢谢你邀请我，只是那个时间我已经有事了，所以没办法去参加。她建议所有女性经理人，要有意识地提醒自己，妳是不是在为没有理由的事情道歉？妳不应该为没有理由的事情道歉。同样地，妳在会议上想提意见会说：我觉得我可能是错的……我不不是很确定……或是愈讲愈小声、愈讲愈意低。有时用问句的方式说：是这样吧？是这样吗？是因为妳不想要太突兀，可是它反而让你像是不确定自己要讲什么。


    方法四：  采用强势的肢体语言


    有研究指出，采取强势肢体语言（非语言讯号）的女性，其实不会给别人强势的感觉，并不会被讨厌。弱势的肢体语言是把自已的物理空间缩小，例如翘脚、耸肩、让肩膀缩小等等。强势的肢体语言，则像是把脚平放、挺直胸、背，甚至可以站起来讲话，都会让你感觉比较有自信。


    # 反驳领导意见的两个小技巧


    想要说服老板，你不用拥有超越常人的沟通能力，只要善用暗示，像是认同加询问，或是把责任推给时机，就能在无形中扭转主管的想法，又不用承担惹怒对方的风险。只要小王开口，一定要得到资源每次小明提案，老板都会举双手支持看到这些情境，大部份人会以为，拥有上述能力的


    1456'
