  md: '# 不给小人机会


    御史曹锡宝写了本章参劾和珅的管家列全，说他建造的府第深宅大院，早已超出了应有的住房规格，平时出行的穿戴及所用舆也是超出限制，想借此来扳倒和珅。消息被吴省钦得知之时，和珅正陪同乾隆在热河行宫，吴省钦立刻回到府中，命家人对来访的客人一律称病不见，自己不带一名随从，骑一骑快马赶到热河，通报和珅。


    和珅急忙命人传见刘全，要他风雨无阻，入手下头的一切事务，火速到热河见他。刘全起点到后，和珅把御史曹宝锡参奏他“恃势夸私、衣服、车马、居室皆逾制”的事告诉他，然后命他火速回去，迅速拆掉愈制房屋，烧掉超过规格的车舆，把不该穿戴的东西统统销毁，不留一丝痕迹。等到曹锡宝乘车来到热河，面见乾隆，呈递奏折的时候，刘全家中一切愈制的东西已经荡然无存了。'
