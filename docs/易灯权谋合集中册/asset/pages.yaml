- pgno: 521
  md: '熹宗对木工器制作和建筑的酷爱，还表现在对朝廷建筑工程的关心上。天启五年(1625 年)到天启七年(1627 年)间，明朝对皇城中的太和殿、中和殿和保和殿三座大殿进行了规模庞大的重造工程，从起柱、上梁到插剑悬牌，在整个工程中熹宗几乎都亲临现场。


    熹宗好建房屋，喜弄机巧，对自己心爱的事物总是不遗余力的投入。房屋造成后，他常常高兴得手舞足蹈，反复欣赏，待高兴劲过后，又立即毁掉，重新设计新样制作，从不感到厌倦。兴致高时，甚至脱掉外衣，挥汗劳作。治国平天下之事，早被他远远地抛诸脑后，无暇过问，这就为奸臣魏忠贤创造了良机。他常趁熹宗引绳削墨，兴趣正浓时，呈上公文请熹宗批示，熹宗自觉扫兴，便随口说道：“朕已经知道了，你尽心照章办理就是。”按明朝旧例，凡廷臣奏本，必由皇上御批。由于潜心于制作木器房屋，熹宗把上述公务一并交'
  merge: -1
