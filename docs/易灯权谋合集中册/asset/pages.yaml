- pgno: 483
  md: '性地揣摩领导意图。因此，当大学士、九卿会审认为李侍尧应“请从重立决”时，乾隆很不满意。皇帝不满意，但又不想抛开“尊重律令”这块金字招牌，同时又要装作倾听“众议”的姿态，没完没了召开商讨会议便是持有权力者爱用的一招。没完没了的讨论，会使人精神懈怠、崩溃，最后顺从权力的意志，使权力者满意。


    不满意的乾隆，又命令“各省督抚议”，而督抚依然是“咸请如大学士九卿议”，主张从重处理，判斩立决。就在乾隆有点伤脑筋的时候，江苏巡抚闵鄂元(当时他还在安徽巡抚任上)主张给李侍尧一条活路。据《清史稿》云，闵鄂元是窥得了皇上的真实意图——“宽侍尧”，所以，他才别出手眼，与众不同地认为：“侍尧历任封疆，勤于有为，中外推服。请用议勒、议能例，稍宽一线。”闵鄂元做这样的表态，并不是毫无据的乱说，而是有《大清律例》的“八议”'
