    # 中层管理者的十项素质修炼


    中层管理者的十项素质修炼


    任何组织的中层管理者都是充满了责任和挑战的经营群体，他们承上启下、协调资源，为组织的长久发展而尽职尽责。中层管理者没有一定的级别界限，在我看来，这主要是指能准确的理解上层领导的计划意图，并运用各种素质确保下属和自己共同完成任务的中层管理人员。作为中层管理者，既'
  merge: -1
  img_proc: true
- pgno: 1317
  md: '要严格贯彻组织高层的战略意图，又需要结合本部门具体状况合理配置资源，充分调动下属积极性，发挥团队的合作能力与创造能力，坚定地执行计划，进行具体的操作运营。这是任何组织中难度颇大的工作，通过观察和分析，笔者认为成功的中层管理者一般要具备十项基本素质。


    # 1. 灵活贯通的关照


    中层管理者的首要素质不是所谓的学习、创新、执行力等，而是对上层领导、下层员工和同级别其他职能管理者灵活贯通的关照。这项素质要求中层管理人员对所有的同事都给予充分的关心和照顾，能根据不同人的
    ([具体情况进行赞扬和鼓励](#))，包括对各个层次人员的事业发展、生活琐事、学习计划都给予关注， ([站在他人立场关心他人长远发展上](#))，替他们筹谋划略。这样作的效果是更多的同事会在工作中保有一颗“感恩的心”。在感恩之心的包围中，每位元同事都会站在你的立场中，协助你完成计划，主动的努力工作，积极的解决困难，形成一个良好的工作环境和高效率的工作团队。


    # 2. 坚定不移的执着


    执着是成功者的通行证。对中层管理者来讲，坚定不移的执着尤为为重。相信很多管理者的成功秘诀就在于关键的 ([时刻](#)) 还有自己一如既往的执着。执着就是要对组织的长远目标清


