  md: '# 玩转职场政治 5 个技巧


    1、心智


    （1）对公司政治有个正确的认识


    公司政治不是多么黑暗的东西，他是公司员工和公司之间相互谋取利益的一种必然的方式。在一家公司里，公司政治只是从属的，不会成为主导作用的，否则这家公司已经不成其为什么公司了。公司政治从从属于利益的，这就是公司政治的核心。公司的大利益实现不了，那么团体的利益也不会实现。所以公司政治在公司的成长期很弱，公司成熟了、经营平稳了，那么公司政治也开始表现的明显了；公司在衰退期，公司政治就更强烈了。公司政'
  merge: -1
  img_proc: true
- pgno: 1016
  md: '治在公司生命周期里强弱表现不同，是跟公司可分配的利益的多多少有关。


    利益的争取也不是什么遮掩的。《史记》有“天下熙熙，皆为利来、天下攘攘，皆为利往”的说法。韩非子也说过，“鳝似蛇，蚕似蝎。人见蛇，则惊骇；见蝎，则毛起。渔者持鳝，妇人拾蚕，利之所在，皆为贵诸。”再说了，我们到一家公司里去工作，难道就是为了所谓的“服务社会”吗？显然不是。


    再者，公司里绝大部分时间都是在处理正常的经营管理事务的。公司政治多发生在8小时之外，谋划、培植势力等等大都不是在工作时间内发生的。公司内发生的，还是通过实际业绩的达成意图和实现利益的。“十目所视、十手所指”，谁也不会做的过分；一些政治图谋大都是工作之外完成的。即使是一些重要的涉及公司政治的策略和制度，他们的思路的形成也都是在饭桌上和闲聊中形成的。所以，在8小时以内，只需要留意小心就是，其他心'
  merge: -1
  img_proc: true
- pgno: 1017
  md: '思只管认真做事，没必要处处觉得别人在算计自己。而在 8 小时之外，还是要花些心思的。


    # （ 2 ）决定自己以什么态度对待公司政治


    这里是要决定自己是单打独斗的方式谋利，还是参与到公司某股势力里去进行争斗，还是就完成自己的工作、对这些争斗保持中立、不闻不问。个人谋利行为，我的意思是不要算到政治行为里，虽然个人争利采用的手法多和前面我用的公司政治行为的手段相同或相似。


    参与到政治行为里，能更好、更大的实现自己的利益；但势力选择不当，不但正常的利益得不到实现，反而可能当普通员工都不可能。所以不可不慎重。


    # （ 3 ）审视自己


    要参与公司政治首先得具备若干心理素质。参与公司政治活动，是得具备一些 “厚黑学” 技能的。心不能太软，也不能太看重浮名，太清廉，也不要在'
  merge: -1
  img_proc: true
- pgno: 1018
  md: '案面对一件事情的时候一定怎样、必须达到如何目标。


    孙子曰：必死可杀，必生可虏，忿速可侮，廉洁可辱，爱民可烦。看不看出形式、知不知道如何做是一回事，能不能忍下新去动手做是另一回事了。能屈能伸，能上能下，或许这样才能在公司政治里不至于被对手打得一败涂地吧。


    心有不忍、注重清名而不能务实、只会论道而不会作事，终无所成。如果能权衡得失、隐忍果决，注重实力和谋划，是那种把目的的真正实现看得高于一切，那么你具备了从事公司政治的心理条件。


    # ## （ 4 ）不要把道德和个人感情太多的带到公司政治里。


    玩政治的不需要这些。我个人看法是，在与不相干的人之间交往，道德和情感都是必需的，而且重要的；但在利益面前，道德和情感显得淡了许多。公司政治的一些手段无所谓高尚与卑鄙，是而这些手'
  merge: -1
  img_proc: true
- pgno: 1019
  md: '段的动机和目的显示出这些手段在道义上的卑 猥崇 高来。


    # ## 2、 角色、时机、分寸、场合


    无论一个人决定他 要参与到公司政治与否，他首先 必须要明白自己所扮演的角色。首先，他必须得明 白他在这个公司里所扮演的角色；其次还要明白他 在某个势力团体里所扮演的角色；最后还要明白他
    个人在与公司上下左右交往中做能发挥的作用。自 审如此，在看待其他人的时候也要弄清楚对方的这 个角色。


    角色基本决定了一个人的行为方式。很多人奇怪像 一些民营企业里，几乎拿不出像样的制度规定，但 这个公司的运转也还算是井井有条。这里很多时候 不能排除公司领导人的经营管理有方；另一个很重
    要的方面是，员工大致都能明白自己在这个公司的 角色，他们按照这个角色的基本演技来扮演就足够 应付大部分公司事务了。'
  merge: -1
  img_proc: true
- pgno: 1020
  md: '如果一个人的角色是做具体事情的，那么他如果频繁的干涉哪怕他自己所属的团体的人和利益的再分配，那么他也是要被本势力团体所打压的；因为这些不属于他所扮演的角色所应该做的，他要遵守这个游戏规则，越出自己角色范围去做其他事情，自然要被盯上。一个公司的公司领导人专职司机是公司领导人身边的人了，公司领导人的很多事情他都知道，但他的角色就是开好车，管好嘴。公司领导人可以带他去吃喝，可以带他去
    K 歌，甚至还可以和他一起去风月场合，但只要他敢于对外多说话、对公司领导人问了公司经营管理的 事情，那么他就必须得走人。


    自己所应该扮演的角色没演到位，那么也会有人出来帮他“演”的。这就是说这个人失职，事情还是得做，失去的职责，就会有其他人来帮他承担的。那么时间一长，正角往往沦落到配角的地位，配角反客为主了，也就导致人事、职权、利益的重新分配。'
  merge: -1
  img_proc: true
- pgno: 1021
  md: '提出意图或做事的时机，做事情、说话的分寸和场合，都是十分艺术性的。如何做到恰到好处，是计算不出来的。在《中国式管理》的讲座里提到的一个例子十分生动：


    某人（部门经理）向领导汇报工作，结果领导说，哦，哦，你给我把窗户擦擦吧。这个笨蛋果然就擦了，然后向《中国式管理》大师曾仕强先生抱怨。曾大师给他分析，你是个部门经理，公司领导人让你做这个位置不是让你擦窗户的；他之所以让你这么做，是因为他现在有不方便的地方。你找个人去给他擦擦就是了，你过一段时间再去汇报！这就说明了，例子中的部门经理汇报工作的时候，没注意到场合和时机。


    在分寸这个方面，除了说话、做事要把握分寸、不能过分外，还有一个方面就是，要注意和他人或其他势力保持合适的距离。子曰：近则不逊，远怨。合适的距离是不至于走太近、又不能疏远到工作、交流中有所隔阂。这难道不是一种艺术吗？'
  merge: -1
  img_proc: true
- pgno: 1022
  md: '# 3、个人如何适应和利用公司政治


    在对公司政治有了正确的认识后，适应它不是什么难事。所谓适应，就是面对公司政治坦然自若，没必要战战兢兢如临深渊如履薄冰。按照自己在公司应该扮演的角色正常表演就是了。总之，对待公司政治，要以平常心来对之。自己不算计别人是自己的厚道，被别人算计了，一怒走人，是懦弱的表现；不讲策略的反击，是勇而无谋。


    在适应公司政治的时候，要多观察、多学习、多思考，曾子曰：博学之，审问之，慎思之，明辨之。在做事情的时候要先考虑到这件事情背后的利益关系。比如，某件事情做的让老板不满意，老板把这个事情交给你来做，做还是不做呢？


    我们可以这么分析：如果做好了，下面都会让你做了，他们随便应付了，反正做不好老板会让你做。想起我中学的时候，某人外语考试得了149分，老师大夸特夸。结果老师再问问题的时候，其他人都不说话了，这时候一个人小声的说了句：让那个'
  merge: -1
  img_proc: true
- pgno: 1023
  md: '149 分回答。当你做不好的时候，别人会来嘲弄你——也不过如此嘛被他们看轻。所以，这种场合最好的策略是将老板的意图跟原来做这个事情的人说明白，以老板的名义责成他重新做。


    看上去自己做这个事情合情合理——老板要求的嘛；但如果真的做了，就会损害别人的利益。本人有更深切体验的例子，但不方便举。


    公司政治既然是普遍存在的现象，那么作为个人就可以利用它实现自己的利益。利用公司政治，最常见是在排队上接近势力带头人。排队就是跟哪个势力来实现自己的利益；接近带头人就是让自己的成绩被人看到。


    有些人在小公司里做事非常好，但到了大公司就没什么名声。这个道理很简单，小公司里你所做的一切老板看的到；到了大公司，难以接近到公司领导人那里。在基层，做事后的功劳主要是部门经理的，你得先把抬到更高的位置你才有可能出头。'
  merge: -1
  img_proc: true
- pgno: 1024
  md: '# 4、作为公司（领导人）如何利用公司政治、避免公司政治的不利影响


    在公司政治方面，公司多半是作为被动一方的，因为各种势力争取的利益都是从公司整体利益中分走的。公司在对待政治问题上，还是要从一些公司政策上采取一些预防措施，防止势力的膨胀损害公司利益。


    前面在分析公司现象的时候大都从正反两方面说明了公司如何利用公司政治和预防正式势力膨胀的问题。


    **其他还有几个方面需要说明一下：**


    +   首先，公司在人事政策方面要特别注意；

    其次，在考核措施上，不要只罚错，还要奖惩；

    再次，坦诚的态度对待下属，以德服人；强硬的立场对待各种干涉和干扰；

    还有，对下属有收买人心的现象要尤为关注。公司的各级员工是属于公司的（公司领导人有奖'
  merge: -1
  img_proc: true
- pgno: 1025
  md: '罚），不属于其他任何某一个人的；最后，注意后备人才的培养。


    # ## 5、直指人心，见性得正


    这里借用了禅宗里的一句话，叫直指人心，见性成佛。实质上，公司政治的争斗成败与否，关键不在平衡术、人事、意图等方面做的如何，而在于对人性的把握。历来国家政治斗争的成功着，莫不是深刻的把握住人性的；而战国学客以三寸之舌纵横捭阖，更是典型的从人性入手的。公司小政治也是如此。人性为本，平衡术、人事等只不过是外用之末。前面所举的每一个例子，背后都是以对人性的把握作为前提的。


    每个人人性中的善与恶、贪欲和良知要有清晰的衡量和娴熟地引导，说服对方，必须要有一个将自己置换成对方的过程。掌控对方的状况和需求，才能对症下药、以为我用。对待人性，如果积极成分多，就用褒扬的、激励的方式以利益和荣誉使其就


    1026'
  merge: -1
  img_proc: true
- pgno: 1026
  md: '范，若人性中否定成分多，就要靠威胁的、惩罚的方式使他就范。


    # 法家揣摩领导的心思有高招


    如果你在单位是一位中层以上的领导干部，那么你很有必要看看韩非子的《说难》。在说难中，韩非子一语中的，“凡说之难，在知所说之心，可以吾说当之”。说不仅仅当说客，日常生活中揣摩别人的心思也是这个道理。游说的难度，不在于如何深知人君之心意用自己的话去打动他，而在于如何迎合人君的心意，并与他的心意能一致。如果我们想去给主子出主意（拍马屁也好、巴结也好），如果主子想立名声，你却用利益好处去说，那他就会认为你品德低下，而给你卑贱的待遇，并疏远你；如果主子本意是想得到利益好处，你却说名声的高风亮节，那么主子一定不会采用；'
  merge: -1
  img_proc: true
- pgno: 1027
  md: '如果主子实际上想要利益好处，而表面上装作图名声，你以名声之好说他，那他表面上接受你的说法，而实际上会疏远你；如果实为利益，表面要名节，你说给说利益的好处，那么他表面上疏远你，而实际上会暗自用你的那一套。实际上从韩非子的观点来看，最好的方法是什么主意也不给领导出最好，不然是，反面正面都得不到好，除非领导非让你出主意，那另说哈。


    另外是，当领导面说话，还要注意保密。 “夫事以密成，语以泄败。” 也就是我们现在所说的慎言。有一点不合领导的心意，领导会记恨一辈子的，大多是这样。还有一个最重要的是，“凡说之务，在知饰所说之所蔽，而灭其所丑。”
    也就是，真要是揣摸领导心思的时候，应该知道领导所推崇的事，并且知道用好的话去掩饰领导认为丑恶的事。注意为领导遮丑，领导认为这事不好，那最好不要宣扬出去，并想法给予粉饰。


    这些建议不仅适用于揣摩领导的心思，就是平时日常生活中非领导或非上下级关系的人际之间的各种'
  merge: -1
  img_proc: true
- pgno: 1028
  md: '关系也普遍适用。就是你是一个普通的非领导干部，看完韩非子的《说难》，也有益于你保持一个圆润的了际关系。


    不过韩非子时运不济，他天生口吃，不善言辞，白白的做了思考，写了这么好的文章，自己却没能够实践开来。他没有像管仲遇上鲍叔牙那样的知己，却遇上了像李斯这样的同学，遗憾而终。


    # 法家除掉小人的手段


    > 削迹无遗根，无与祸邻，祸乃不存。


    ——《韩非子》


    韩非子告诫我们，处世就像砍伐树木，不要留下树根，不要与祸害为邻，祸害就不存在。这里祸害可以理解为那些身边的小人。要想不受到这些小人的陷害，就要学会 应对他们，要做到害人心不可'
  merge: -1
  img_proc: true
- pgno: 1029
  md: '有，防人之心不可无。那么，要如何去呢？不但要像韩非子说得那样，远离他，不与他为邻，还要避免得罪他。


    生活中，谁都不愿意与小人打交道，可不管你愿意还是不愿意，谁都会不可避免地碰到小人。那些工作在我们身边的小人，他们的眼睛牢牢地盯着周围大大小小的利益，随时准备多捞一份，为此甚至不惜一切代价准备用各种手段来算计别人，令人防不胜防，说不定什么时候就会在背后给你一刀。


    在对付小人方面，古人的智慧为我们今天的“个人安全”提供了有益的镜鉴。


    为大唐中兴立下赫赫战功的唐朝名将郭子仪，不仅在战场上战无不胜、攻无不克，而且在待人处世中，还是一个特别善于对付小人的混世高手。郭子仪与小人打交道的秘诀，就是“宁得罪君子，不得罪小人”。


    “安史之乱”平定后，功高权重的郭子仪并不居功自傲，为防小人嫉妒，他反而比原来更加小心。有一次，郭子仪正在生病，有个叫卢杞的官员前来探'
  merge: -1
  img_proc: true
- pgno: 1030
  md: '望。此人乃历史上 声名狼藉的奸诈小人，相貌奇丑，生就一副铁青脸，脸形宽短，鼻子扁平，两个鼻孔朝天，眼睛小得出奇，时人都把他看成是个活鬼。正因为如此，一般妇女看到他
    都不免掩口大笑。郭子仪听到门人的报告，立即让身边人避到一旁不要露面，他独自等待卢杞到来。卢杞走后，姬妾们又回到病榻前问郭子仪： “许多官员都来探望您的病，你从来不让我们躲避，为什么此人前来就让我们都躲起来呢？郭子仪微笑着说：
    “你们有所不知，这个人相貌极为丑陋而内心又十分阴险。你们看到他万一忍不住失声发笑，那么他一定会心存忌恨，如果此人将来掌权，我们的家族就要遭殃了。”


    郭子仪对这个官员太了解了，在与他打交道时做到小心谨慎。后来，这个卢杞当了宰相，极尽报复之能事，把所有以前得罪过他的人统统陷害掉，唯独对郭子仪比较尊重，没有动他一根毫毛。这件事充分反映了郭子仪对待小人的办法之高明。'
  merge: -1
