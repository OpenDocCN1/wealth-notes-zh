- pgno: 592
  md: '受重用，甚至被提拔到和你一样的位置，使你感到你所拥有的权力和荣誉在被另外一个人瓜分。这就是“制衡”之术在你身上起作用了。


    在晚清官场 上，制衡之术随处可见，特别是当汉族官员功劳过大，声誉过高时。曾国藩在消灭太平天国之后，个人功绩、威望和荣誉已经达到了有清以来汉族官员的巅峰。曾国藩虽然深谙并运用道家“无为”、“处下”、“不争”之理，又是主动裁军，又是让曾国荃回家养病，但仍然无法消除当政者那拉氏对他的猜疑。


    但那拉氏是个“不学有术”的奸猾老太婆，她不会随便编个理由就把有功之臣“做掉”，而且曾国藩代表了整个汉族官僚集团，当时的汉族官僚集团正处在上升势头，不仅不能压制，还必须继续加以利用。国家还不稳定，平捻、平回等诸多战斗任务还需仰仗汉族官僚集团，这个时候，“做'
