- pgno: 1240
  md: '直走狗屎运，也可以预约，IM 也不错，邮件也很好，直接打个电话更直接……总之没时间这是个很烂的借口。 总之，不汇报或少汇报时，工作都存在着或多或少的问题，也使你少了一些压力和约束，这种不解决问题，不追求进步的放任态度，也成了工作进步，职场进阶的绊脚石。除非这就是你想要的，否则一定要尽快改变，从汇报开始。


    # ### 这样做事滴水不漏，升职必备


    严谨细致地对待工作的态度，是一个人减少工作失误的根本保证。


    2000 多年前，道家学派的创始人老子说过： “图难于其易，为大于其细。天下难事必作于易，天下大事必作于细。” 到了韩非子时，又将此段话做了进一步的提炼：
    “慎易以避难，敬细以远大。” 可见，古人对严谨细致的做事态度的重视。


    在现代职场中，在我们的日常工作中，没有哪一个人不想把事情做好，可是有很多人尽管做事十分努'
  merge: -1
  img_proc: true
- pgno: 1241
  md: '力，但却总是因为自己的粗心，把不该做错的事情做错了，把该做好的事情做砸了。这正是因为，他们在工作时不够严谨、不够细致而造成的。有些人因为对上级安排的工作粗心，或是没有做好，或是忘记了没有去做，造成工作被动、工作效率低下，从而长期难以得到提拔或重用。很多人会责怪领导做事不公，没有发现、重用他，其实这都是自己的粗心造成的恶果。所以，每一名员工都应在工作中培养自己严谨细致的做事态度。


    对于每一名员工来说，只有具有严谨细致的做事态度，才能在事业上走得稳、行得远。否则，大部分的时间都会花费在做事不够细致认真所造成的失误上。因此，作为员工，绝不要忽略那些简单的小事情，不要轻视那些被别人认为很容易的细节和细致的工夫。如果一个人能够把简单的事情天天做到位，这就是不简单；大家都认为非常容易的事情，如果一个人能认真谨慎地做好，这就是不容易。


    一名严谨细致的员工，总是会考虑应该怎么做、要怎么做，只有这样才会把工作做得更令人满意。由'
  merge: -1
  img_proc: true
- pgno: 1242
  md: '注意细节所做出来 的工作也一定能抓住人心，虽然在当时也许无法引起他人的注意，但久而久之，这种工作态度形成习惯后，一定会给你带来巨大的收益。


    那么，作为员工应该怎样去做才能培养自己 在工作中严谨细致的良好态度呢？


    1、从对点滴小事的严格要求做起；


    2、做任何事情都要想得全面周到；


    3、对自己一定要“苛刻”。


    总之，作为员工，只有在工作中做到严谨细致，才 能把个人潜在的智慧和力量更有效地凝聚起来，发 挥出来；才能少走弯路，少出纰漏，稳操胜券，取 得事业上的稳步前进。'
  merge: -1
