  md: '体鳞伤。


    # # 权术智谋审时度势十三招


    # ## 一、智察


    注意那些有智而无义的人，因为他们会变成 佞人。


    上当之后不要责怪人心难测，而要检讨自己的不察。


    对手对你怒目而视，并不可怕；如果他对你微笑，或异常殷勤，那你可要小心了。像使用矛一样使用智慧吧，在不断的较量中才能提高智谋的锋利程度。


    听他怎么说，然后考察他的行为；看他的表情，然后把握他的内心。


    先辨出一个人的优劣真伪，再确立与他交往的尺度。


    # ## 二、筹谋


    99'
