  md: '场做戏来逗乐的，这样这盘棋这场戏才有滋有味，才能不那么平淡。


    除了是一代君主，他也是一个人。朝野上下都是纪晓岚、刘墉一样的廉明、两袖清风、刚直不阿的忠臣，试想，谁来修饰朝野之外的政治生活，没有了牵制，这场博弈似乎没有丝毫的乐趣，自然人，都会受不了这种生活方式。


