    成为别人的囊中之物。


    这时，你该怎么办？愤然而起，痛斥领导不公？你这辈子基本上就见不到领导了。面带微笑，从容认栽？也许这是很多人不得不采用的表现形式。虽然心里边苦涩一些，但惟有咬紧牙关，继续努力，希望领导
    “龙颜大悦” ，对你深明大义之举牢记在心，他日必有 “酬谢” 。


    但问题是，后年的 “先进个人” 又被领导以同样的方式平衡出去了怎么办？在当前的很多事业单位，个人奖励就像接力棒一样传个遍，今年不得，后年必得，大家在心里虽然不满，
    却也没法公开地发泄。因为这种 “平衡” 于情于理似'
