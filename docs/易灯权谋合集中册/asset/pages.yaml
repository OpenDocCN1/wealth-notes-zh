- pgno: 314
  md: '其的一生就这样结束了。与其说酈食其死于齐王之手，不如说酈食其死于韩信之手。


    不知韩信怀有何种目的，将已经归顺汉王的齐国还要用武力收复？在《史记·淮阴侯列传》中酈通劝韩信的一番话也许会回答这个疑团：


    “为将数岁，反不如一竖儒之功乎”？原来韩信一方面极端看不起儒生，又一方面又在炫耀武力、迷信武力。其用意，并不是做给齐王看的，而是做给刘邦看的。后来刘邦不是就真的封韩信为齐王吗？“不然，变生”。


    都说韩信为“汉初三杰”，然而此处两者相比，一是韩信，一是酈食其，究竟谁高大？刘邦在心里自然也能比较得出来。


    《史记·酈生陆贾列传》中写道：“汉十二年……高祖列举例侯功臣，思酈食其。酈食其子酈疥数将兵，功未当侯，上以其父故，封疥


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_314_0.png)'
