- pgno: 96
  md: '《旧唐书》对李林甫如此评价：“生既唯务陷人，死亦为人所陷。”其实，李林甫在世时便考虑过自己的下场。《资治通鉴》中记载了这样一件事：李林甫结怨甚众，他儿子李岫对此非常忧虑恐惧。某日，李岫陪李林甫游后花园，看到有个下人正在拉很重的东西。李岫指着下人对父亲说：“人久处钧轴，怨仇满天下，一朝祸至，欲比此人得乎！”李林甫听了，烦躁地说：“事情已经到了这一步了，还能怎么办呢？”


    李林甫无奈之叹，让人想到了两个人的临终遗言。三国时的陆机临死时慨叹：“华亭鹤唳，岂可闻乎？”秦朝李斯临终悲言：“牵犬东门，岂可得乎？”陆机和李斯一生谋于政治权谋临死时才悔之不及，李林甫倒是领悟得早，不过他更明白权场之上的骑虎难下。'
