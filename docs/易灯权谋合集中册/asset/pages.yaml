  md: '份文件后打，先打的自然可以获得审批，后打的自然就失去了机会，所以打字号借着衍生隐权利，坐收渔利，虽然打字号并不掌握审批权，但由于她身处权力辐射范围，与权力沾上了边，因此拥有了间接话语权，得以从中获取额外的腐败“蛋糕”，要知道在政治体制中任何环节的疏忽都有可能给权力寻租行为留下腐败空间。


    一个单位正式权力的管辖失控，隐权力则嵌入严重，往往盛行裙带关系、利益交换，很多时候这种隐权力领导层不杜绝，因为他们无力改变整个大环境，另外一个原因这种官僚权力支撑起来的灰色权力，能够给领导层带来实实实在在的好处，所以他们往往睁一只眼闭一只眼，将利益落袋为安。'
