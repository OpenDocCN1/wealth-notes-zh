- pgno: 1355
  md: '燕国因此没办法决定外交政策方针，以致举棋不定，不知所从，这时苏代就对燕国宰相说：


    臣听说，在外交上，如果态度卑躬屈膝，而又用很重的厚礼臣事故国的，通常就是失去天下诸侯支持的人；反之态度强硬，轻用外交礼仪的，都是已得到天下诸侯重视的人，如今魏国，不但态度强硬，而且送礼也很薄，大王应可以有所选择的啊！


    于是燕国就选择魏国为盟邦，并且和赵国结为盟友，赵、魏、燕联盟，齐国终于不敌而失败！


    一个人机识能力的高低，跟他的思维世界成正比例，思维世界大者，心灵所涵摄者大，机识能力高；思维世界小者，则相反，正如唐君毅先生所云：人之有德行者，其心态大，而所关切者大，则其思虑，于远近之事，无所不及，而于任何切近之事，皆可由其所感应之范围之大，以知其变化之可能之无限而无穷，而见一无方之神。此变化之可能无限，然其每一可能之实现，皆有一始点，此即为f一凡之一可能之变化，无不始于f一，一事物可引起种种之变化，即有种种之几。几定而有某一方向之变化，即日势知几，只是知其变化之始点。在一变化之始点上，其中亦有其他种种之'
  merge: -1
  img_proc: true
- pgno: 1356
  md: '变化之可能，聚于一变化之始点。故知几之义微，其事亦难。此人之能知几，赖于人之能知一事物种种变化之可能，亦即赖于知一事物，与其他事物可能之种种感应关系，故必人于一物对其余一切物之感应关系，所知之范围愈大者，乃愈能知几。此则全赖于人之心志所关切之物之范围之大，亦即系于人之德行。人之德行厚、而心志大者，其于个人之得失利害看得轻，则能知存亦知亡，知得亦知丧，知进亦知退，而皆有以自处之正道，以成其德行。由是而亦能平心观其个人与他人之一切存亡、得失、进退之事。


    所以说，研习谋略学，增强机识能力是第一要义！


    # # 申不害传略


    申不害，（约公元前 385—公元前 337），亦称申子，郑国京（今河南荥阳）人。战国时期韩国著名的思想家。他在韩为相 19 年，使韩国走向国治兵强。作为法家人物，以“术”者称，是三晋时期法家中的著名代表人物。


    郑国灭国之时，申不害年岁约在 20—30 岁之间。作为一个亡国之贱臣，申不害可能杂学诸说。因为在他之前的管 子、李悝、慎到的学术理论中都有“术”的成份。有人根据申
    不害思想中有道家思想的痕迹，认为他是由道入法。这种说法 有一定道理，但不能把他的思想仅归为道法两家。


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1356_0.png)'
  merge: -1
  img_proc: true
- pgno: 1357
  md: '申不害相韩时，韩国已处弱势。韩昭侯即位不久，颇具雄心，任用贱臣申不害即为一例，申不害才华得有用武之地。


    申不害的学术思想，明显地受到道家的影响，但他的直接来源是老子还是慎到，不得而知。但他的哲学思想与慎到有极相似之处，他们都遵循老子的大统一哲学。 “人法地，地法天，天法道，道法自然”。申不害认为，自然运行是有规律的，也是不可抗拒的。他认为宇宙间的本质是“静”，其运动规律是“常”。他要求对待一切事情应以“静”为原则，以“因”为方法，“因”指“因循”，“顺顺”。“贵因”指“随事而定之”，“贵静”的表现就是“无为”。申不害将这些原则用于人事，构成他的社会哲学思想。“无为”主张的渊源即《老子》的“绝圣弃智”，申不害的“无为”，要求的是君主去掉个人作为的“无为”，以便听取臣下的意见。但是，申不害仅仅把这种“静因无为”的哲学思想用于“权术”之中。为了完善这种方法，他进一步发挥《老子》“柔弱胜刚强”的思想，要求君主“示弱”，决不是指君主无所作为，只是君主决策前的一种姿态。在关键时刻，申子要求君主独揽一切，决断一切。申不害的哲学思想，是君主哲学，是政治哲学。这种哲学由道家的“天道无为”演化发展来，是他的法家“权术”思想的基础。'
  merge: -1
  img_proc: true
- pgno: 1358
  md: '申不害主“术”，但他所说的“术”，是在执行法的前提下使用的，而“法”又是用来巩固君主统治权的。因此他并不是不讲“法”与“势”的。


    关于君主的权势，申不害认识得很清楚。在战国诸侯争霸的情形下，君主专制是最能集中全国力量的政权形式，也是争霸和自卫的最佳组织形式。他说：“君之所以尊者，令也，令之不行，是无君也，故明君慎之。”令是权力的表现，是一种由上而下的“势”能。“权势”是君主的本钱。


    > 申不害提出“君必有明法正义，若悬权衡以称轻重。”


    为了说明“法”，他提出“正名责实”的理论。“正名”主张，首先由孔子提出。申不害吸收了这个主张，是名分等级，不得错乱。与孔子“正名”不同之处在于包括责任、分工的内涵。申子“正名”的意义在于确定了“主处其大，臣处其细”的大原则，而且把这个原则具体化，即把名分按实际情况规定下来，然后进行任命，听取意见，检查监督。


    申不害的“名”，主要是政治概念，他的“名”是法的等值概念，是为人君制定的工具。所谓实，也就是君主给臣下规定的责任和职权，是臣下遵从君主的规范。申不害本来是劝戒君主发令施令要慎之又慎的，但其效果是加强了君主的个人专制。申不害找不到如何提高君主权威，而又能制约君主的方法，这是一个二律背反的问题。'
  merge: -1
  img_proc: true
- pgno: 1359
  md: '什么是“术”？申不害没有明确规定。“术”是君主的专 有物，是驾驭驱使臣下的方法。“法”是公开的，是臣民的行 动准则，而术却是隐藏在君主心中，专门对付大臣的。申不
    害说，“君如身，臣如手”，既然如此，君主仍要对付大臣 是由复杂的社会斗争所决定的。春秋战国时，臣下弑君，酿 成习气。现实告诉申不害，人君的主要威胁不是来自民众或
    敌国；而是来自大臣。所以他一再告诫君主，对君臣关系要 有清醒的认识，那就是不相信所有的大臣。


    申不害认为，君主有了势，定了法，其地位还不是稳固的， 必须有两面之术，不然势与法就会变得威严而不受用，刻板 而不通达。如果以术来联通势与法，就如虎添翼，无论动静，都会使臣下慑服。他的术分两类，一类是控制术，像前面提到的“正名责实”，就是讲规定职责，考核监督的。还
    有如君主以静治动的，无为而治的，这些属于领导管理方 法，有一定的合理性。另一类是搞阴谋，耍手腕，弄权术。 玩弄权术，当然不是自申不害开始，但他是第一个在理论上
    的系统研究者，这在官场的政治斗争中，很受历代统治者的 喜爱。但从本质上说，无补于稳固政权。因为既然有驭臣之 术，必有欺君之方，尔虞我诈，你争我斗，加剧了政权的不
    稳定性。


    1360'
