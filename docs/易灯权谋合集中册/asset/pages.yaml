  md: '我们看到很多人自认甚至公认为努力工作并积极上进，但始终郁郁不得志。仔细分析一下，原来他的努力都是无用功，尽管多数时候他的行为和工作方法都是正确的和符合实际情况的，但总是做不出老板想要的结果。举个简单的例子，老板希望得到的业绩分析报告的主旨是说明业绩做得“还不够好”，而你的分析却是说明为什么业绩如此之差，两者尽管分析相同的内容，甚至原因都是一致的，但是报告写法确实完全不同，得到结论也会完全不同。你再有理有据的分析在老板眼里一定还是一堆垃圾。


