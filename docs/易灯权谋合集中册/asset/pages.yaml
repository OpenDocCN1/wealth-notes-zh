- pgno: 1257
  md: 'v 至于发讯者，做简报是最频繁的一种型式，口头报告及演讲都是做简报的意思。


    v 发讯者的最大秘诀，就是要对讯息彻底了解，这个条件是没有替代品的。


    v 第二就是要知道对象。


