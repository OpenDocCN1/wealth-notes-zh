- pgno: 843
  md: '荀爽敬重李膺，担心李膺名声大大而招致灾祸，才写信规劝他“怡神无事，偃息衡门，任其飞沈，与时抑扬”。


    “古之君子，邦有道则仕，邦无道则隐。除非君子之所欲也，人莫已知而道不行，邪群共处而害将及身，故深藏以避之。”


    这里宣扬的，是中国封建社会中一种儒家学派的“做官”精神。明哲保身，但求无过，是其核心。荀爽给李膺的信，不正是宣扬了这样一种官场哲学吗？信奉这种哲学的官员似乎既不挖空心思地曲意媚上，谄媚奉迎，整日奔走于权贵之门，也不卷入勾心斗角的漩涡，'
