  md: 泛应用的洗钱手法。由于和珅位高权重，又深得乾隆皇帝的宠爱，所以想托和珅“办事”的人很多，和珅自然也不会放过这么一个发财的机会。但“受人钱财、与人消灾”时间不长，和珅意识到，送到家里的钱多了，太容易出问题。于是，他想出了一个办法——成立一间当铺，把家里不值钱的瓶瓶罐罐拿到当铺出售。每当有人想托和珅办事送礼的时候，就到和珅开的当铺，以极高的价格赎出一件根本不值钱的东西，或者是以极低的价钱当掉一件极其珍贵的物件。这样一来，送给和珅的钱表面上根本没有经过和珅的手，钱都来源于他的当铺，都是正当收入，但合法的外表下，却掩盖行贿受贿的实质。当铺掌柜会定期向和珅进行汇报，当和珅发现谁送的钱多的时候，就会派人去问有什么事，然后利用手中的权利搞定。如此一来，和珅的不义之财安全地在他的当铺中越积越多。
