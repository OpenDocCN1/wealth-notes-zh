  md: '工做的事情可能是白忙一场，累翻不说，若表现出来的与老板有一段差距，到头来还要帮主管被数落一番，背黑锅当垫背。


    如果朋友的主管是属于 " 将帅无能累死三军型 " 的，朝夕令改，颠三倒四，遇到懦弱一点的就更没担当负起该负的责任了。


    想起之前我在当主管时带人的心境，也曾经历过也可以深深体会 " 将帅无能累死三军 " 的辛苦，我的一个指令或政策没有很清楚 的让底下的人知道，只是丢一件事，没头没尾的要他们生出一堆东西，想当然尔，出来的东西一定是南辕北辙，自己被底下的人气到不行，脾气乱发不说，也严重影响团队士气。后来才体悟很多事情不能只用自己的思维想，如果底下的人也是如此的思维，就不会你是老板他们是员工的情形了。当时为了当一个有谋略的领导者，也是用尽心思费尽苦心，希望带的人能有所做为，甚至早点功成名就开公司去。青出于蓝胜于蓝，我就可以很骄傲的说：这家公司的老板是我带过的员工，与有荣焉呀！


