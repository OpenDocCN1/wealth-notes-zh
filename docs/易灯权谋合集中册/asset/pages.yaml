  img_proc: true
- pgno: 844
  md: '忌贤妒能，诬陷忠良。只要能逃避是非，远 近祸患，他们似乎可以割舍一切，甚至自己的官 位。


    不过这常常是一种假象。他们表面上把 不偏不倚、中庸老成、与世无争、四平八稳作为 待人处世中刻意追求的境界，实质上只不过是对 “欲速则不达”。“物极必反”有更深的体验，善
    于窥测时机、待价而沽罢了。


    即使在“乐山乐水”之时，爵禄、官位 仍然在他们空虚的心灵中躁动不安。


