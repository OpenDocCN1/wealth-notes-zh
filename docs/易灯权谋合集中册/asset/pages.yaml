- pgno: 307
  md: '此处，也是用秦、越来比梁。


    “我听说把月明珠或夜光璧，在黑夜的路上抛向行人，人们没有不惊异地按剑斜着眼睛看他。为什么呢？是因为宝物无端地被抛到面前。……如今那些平民百姓和穷居陋巷的士人，处在贫贱的环境下，即使有尧、舜的治国之道，持有伊尹、管仲那样的辩才，怀有龙逢、比干那样的心志，打算尽忠于当世的国君，而平素没有被推荐的根底，即使是用尽心思，献出自己的忠信，辅佐国君治国安邦，那么，国君仍然会像对待投掷宝物的人那样按剑斜视你。”


