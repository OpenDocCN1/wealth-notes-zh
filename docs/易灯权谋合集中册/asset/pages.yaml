  md: '寡断，思之再三，认为汉王有大恩于己，不肯背叛；当刘邦要收拾他以消除对自己的威胁时，他兵权明明已旁落，却想造反，结果落得身首异处的可悲下场。从这一点来说，知识分子只能做别人的谋士，为他人做嫁衣裳，不能独立为王也。不亦悲夫？


    三，知识分子最爱窝里斗，互相瞧不起，这恰恰是知识分子的致命弱点。曹丕在《典论·论文》中说：“文人相轻，自古而然。”即指出了知识分子自命清高的毛病。俗话说：两人智慧胜一人。三个臭皮匠，顶个诸葛亮。知识分子虽懂得这个道理，但在实际生活中，明明自己脱离实际，纸上谈兵，却往往目高于顶，自以为是，谁也不服谁。用老毛的话说——知识分子的臭毛病。其实这也毫不奇怪，就自然界来说，一种旋转的天体，一旦自身有了巨大能量，就会产生离心力，而不是向心力；知识分'
