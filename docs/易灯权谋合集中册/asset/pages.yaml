- pgno: 144
  md: '最败家的女人。可是，我们要站在历史的角度去客观地评价她的一生。


    慈禧，叶赫那拉氏，小字兰儿，咸丰帝之贵妃。咸丰帝，先不管别人如何评价他，我对他只能如此评价：沉迷女色、不问国事、黑白不分、胆小怕事的一个昏君。


    咸丰帝在英法联军入侵北京时逃离京城去热河行宫。可是这一路上他也并不好过多少，据史料记载：当御厨做好饭后，还没等咸丰帝闻到味，就早被官军给抢着吃了。当时因走得急，随性人员又多，御厨又没带那么多吃的，所有人都如饿狼一般，那还顾得上什么等级之分。


    # 145'
  merge: -1
  img_proc: true
- pgno: 145
  md: '在热河行宫时，咸丰帝病重，他在临死前所做的最正确的一件事就是将祂唯一的儿子载淳立为皇太子，将“同道堂”这枚铃印交给了慈禧。在热河举行完咸丰的丧礼后，慈禧和慈安不顾肃顺等奸臣的阻拦回到京城。她和慈安也正式开始了垂帘听政。


    她们垂帘的第一件大事就是铲除了肃顺这个集团，后来她和慈安二人又办了不少大事。可她的儿子载淳日日成长起来，于是她和慈安又为同治帝选妃。这几个妃子都不合皇上的心意，特别是这个皇后，可以说是难看至极。可是慈安却极喜欢她。于是这也引发了慈禧的不满。同治帝刚刚亲政就惹出大乱子，心情极不好，就与恭亲王之子载澄偷偷出宫去八大胡同、几大名楼花天洒地，以至于皇上因天花和梅毒致死。当时，梅毒几乎就等于是要症，皇'
  merge: -1
  img_proc: true
- pgno: 146
  md: '上患了这病，慈禧自然不敢声张，只让太医按天花治疗，自然加快了同治的死亡。

    同治未留下任何儿女，国不可一日无君，慈禧果断决定立醇亲王之子载湉为光绪帝。她对载湉的好不亚于慈安对载淳的好。而这个载湉，他的亲生母亲是慈禧太后的亲妹妹，那慈禧应该是载湉的亲姨妈，可她却让载湉叫她亲爸爸。


    与此同时，慈安太后却在光绪帝年幼时病故，有人怀疑此事也与慈禧有关。慈禧那么争强好胜的人怎么能容忍别人与她分权呢？


    在载湉长大成人后慈禧决心修建颐和园，给后人一个能记录她功绩的东西。她不惜挪用训练海军的公款，以至北洋舰队在甲午海战中惨败。邓世昌舰长不惜开足马力撞击日舰与日军同归于尽。如果有足够的银子、足够的鱼雷、先进的远程利炮，谁都不会舍命去撞舰。如果'
