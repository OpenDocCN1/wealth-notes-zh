- pgno: 330
  md: '曹操的疑墓告破，形成文史学界对曹操的历史事迹议论纷纷，对真墓的判断也仍存疑。


    当我重读《三国志·魏史》时，却引出关于曹操与泪的一段故事，值得作为史鉴的谈助。


    故事是因曹操出征，军容鼎盛，旌旗飘扬，他以得汉献帝封为魏王之尊，临行时百官部属及其亲属多趋辕送行。他最爱的儿子曹丕曹植也躬列左右。曹植于送别辞中备述魏王的文治武功，辞章炫丽，引得在场的人群瞩目赞美，曹操也深感怡悦。这样的气氛、场合，令曹丕不知怎样应对而感到尴尬惶恐。就在这紧急关头，曹丕的知交挚友吴质向他耳语，于是令他醒悟过来，当魏王动程的刹那，曹丕向魏王倾泻伤别的眼泪，真是涕泗滂沱，竟引得魏王动容相向。就是这样临歧送别的一幕，曹植的华章不敌曹丕的煽情，埋下了曹操偏于选曹丕为太子继承的心意。就曹操的感受而言，曹植炫'
  merge: -1
  img_proc: true
- pgno: 331
  md: '文而少诚心，曹丕献泪而具人伦情感，正投合曹操标榜“以孝治天下”的理念。


    这送别的一幕，是吴质以权术为曹丕解困。吴质早就是曹丕的挚友，从曹丕的名文《与吴质书》中即可获证明——


    “二月三日，丕曰：岁月易得，别来行复四年。三年不见，东山犹叹其远，况乃过之，思何可支。虽书疏往返，未足解其劳结。


    “昔年疾疫，亲故多罹其灾；徐、陈、应、刘，一时俱逝，痛可言耶！昔日游处，行则连舆，止则接席，何曾须臾相失，每至觞酌流行，丝竹并奏，酒酣耳热，仰而赋诗，当此之时，忽然不自知乐也。谓百年已分，可共长相保。何图数年之间，零落略尽言之伤心！……”


    曹丕信中还提到邺下文士集团各个作家的文章优越及缺点，也是他在《典论·论文》所评'
  merge: -1
  img_proc: true
- pgno: 332
  md: '论的观点。最后，他信中感慨自己“年行已长大，所怀万端。时有所虑，至通夜不瞑，志意何时复类昔日？已成老翁，但未头白耳……少壮真当努力，年一过往，何可攀援，古人思秉烛夜游，良有以也”！末了，曹丕问吴质：“顷何以自娱？颇复有所述造不？东望于邑，裁书叙心。”这封信写得很富感情，追念旧游，感伤逝者，抒情真挚，反映了两人不同寻常的友谊。


    真情是自然流露的，要人耳语提醒才想起来的那场大哭，则很难说是自然流露。所以，洒泪的权术虽骗得过当事人，却骗不过无数旁观的后人。今天我们读《魏史》中的记载与读《与吴质书》，孰为真情，孰为假意，并不难辨。那么，这是不是也可以作为今人为文和为人的一种借鉴，或一点教训呢？'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# 憧憬权术也会失败，原因有以下几点


    李斯是历史上很令人迷惑的人物。


    李斯的成功，有着如此夺目的光辉。但李斯在历史上最引人注目之处，却不是他的成功，而是他的失败。


    李斯的失败，两千年之后，还令人浩叹。


    他是当时最有名的政治哲学家荀子的高徒，也算是当代大师那里拿到了政治哲学博士学位，但最后却败于一个宦官之手。


    作为一个外国人，不远千里，来到秦国，他奋斗达到了人生所能达到的最高地位。如果秦始皇因为统一六国而被称为“千古一帝”的话，李斯被称为“千古一相”也毫无愧色。秦始皇对他基本是言听计从。就君臣际遇和取得的成就来说，可算得国史第一。功高而未震主，秦始皇直到死都没有怀疑过他，对他的信任可以说是无以复加了。李斯对少主还有拥立之功，'
  merge: -1
  img_proc: true
- pgno: 334
  md: '但二世皇帝居然会怀疑他谋反，最后居然相信他谋反，少主继位一年，拥立的功臣就身败族夷，也是史上罕见。


    李斯是法家的代表人物，算得上是一个大政治家，但很多时候，他的作为又跟最无耻的政客差不多。


    李斯的才学、手腕，都是历史上第一流的，他的没有好下场，也在历史上有其特别的代表性。


    李斯为什么会败于赵高？如果我们了解了以下几点，对这个问题就不再去感到不可理解。第一， 李斯没有把赵高作为敌手，而赵高把李斯当做了敌手。


    第二， 赵高掌握了跟皇帝的联络权，李斯想见皇帝一面都难，更谈不上在皇帝面前剖白自己，揭发别人了。


    第三， 还有一个不是那么不重要的原因：赵'
  merge: -1
  img_proc: true
- pgno: 335
  md: '高用威逼利诱的方式很快建立了自己的势力集团，而李斯始终没有自己的势力集团。


    先说第一点。


    在始皇时期，李斯的地位已经达到了最高一级，不可能再升高了。而赵高，虽然身份是宦官，品质是小人，也怀有升官掌权直至位极人臣的心思。这也不能说是错误。李斯要保，赵高要争，要斗，这个李斯是知道的。李斯不知道的是，赵高的野心，并不像李斯估计的那样小。也就是说，李斯低估了赵高。赵高的最终目的，至少是独揽朝廷大权。这样子的赵高，李斯根本就没有想到。李斯“知己不知彼”。'
  merge: -1
  img_proc: true
- pgno: 336
  md: '李斯之所以在沙丘与赵高合作，是信服了赵高的分析。他把蒙恬作为最重要的对手，联合赵高，矫诏除掉扶苏与蒙恬。这样，李斯就以为，在大秦帝国政界，自己就没有分量足够的对手了。


    李斯肯定自以为这个想法不错。表面上看确实是这样。功劳和才能，还有谁比自己更强呢？至于皇帝，是自己矫诏拥立的，肯定会感谢自己、信任自己、倚靠自己。长保富贵，似乎没有任何问题。


    但李斯恰恰错了，而且错得很彻底。


    在政治上，昨天的盟友很可能是今天的敌手。赵高跟李斯结盟，拥立二世成功之后，马上就把李斯当成了最大的敌手。


    从李斯这边来说，秦始皇在沙丘死去的时候，如果他主动想到了赵高劝说他的那些理由，为'
  merge: -1
  img_proc: true
- pgno: 337
  md: '自身长保富贵打算，最好的办法当然就是联合赵高，矫诏拥立胡亥。拥立胡亥成功之后，应该立即着手剪除赵高的势力，甚至在肉体上消灭赵高。


    但李斯没有这样做，也没有这样想。


    他在被动中接受了赵高的阴谋。历史不是“李斯联合赵高，发动沙丘之变”，恰恰相反，历史是“赵高联合李斯，发动沙丘之变”。从此之后，李斯就一直处于被动的位置，没有主动做过一件大事。


    李斯知道自己已然跟赵高成为最主要的政治敌手之后，仍然小看赵高。他觉得自己以丞相之尊兼有拥立之功，对付个把赵高，是绰绰有余，根本就没把对方放在眼里。以至于一次次错失机会，直到最后局面再也无法逆转，事情已无法收拾的时候，他才跟皇帝说赵高要谋反。其实这也是诬告，李斯并没有掌握任何赵'
  merge: -1
  img_proc: true
- pgno: 338
  md: '高谋反的证据。


    李斯这也是急了乱咬。如果他脑筋还清醒的话，就知道这么说根本就没用。


    原因无他，就是我们下面说的第二点。


    第二点：赵高独占了跟皇帝的联络权。


    当初在沙丘的时候，赵高问李斯：“如果扶苏继位的话，跟新皇帝的关系，您与蒙恬相比如何？”李斯说：“不如。”


    李斯未曾细想：“胡亥继位之后，跟新皇帝的关系，自己与赵高相比如何？”


    二世继位之后，长期不见群臣，他几乎就只从赵高那里获得关于国家局势的报告。赵高也极力撺掇二世荒唐游幸。


    有拥立大功的李斯，反而见不到皇帝。


    这个情况，李斯都知道。


    那李斯怎么能指望，通过一份书面报告，说赵'
  merge: -1
  img_proc: true
- pgno: 339
  md: '高谋反，皇帝就会相信自己呢？


    皇帝接到报告，可能会这样想：


    “赵高先说你谋反，你后说赵高谋反。你的话不能信。”


    “赵高，我天天都见，他的建议，都是让我高兴的事情，怎么可能谋反？”


    李斯当初在荀子那里学的是帝王之学，在他跟秦始皇的关系中，他获得了成功，他得到了秦始皇的信任。在二世手下，他的帝王学基本就没什么用武之地：李斯对秦二世几乎没有影响。


    我们知道，凡是跟皇帝关系密切的人，接近权力中心的人，相对于其他人，在权力斗争中占有优势。也因此，历代想要固宠的人，无不想方设法打听皇帝的爱好，揣摩皇帝的心思，不惜重金打通与皇帝的联络渠道。但李斯却不此之图，在与皇帝的联络中，居然借助自己的敌'
  merge: -1
  img_proc: true
- pgno: 340
  md: '手！敌手怎么会给他这样的好机会呢？


    第三点：政治斗争需要自己的班子。


    李斯贵为丞相，百官之首，但没有自己的私人势力集团。这也许是秦始皇没有怀疑他的原因。在始皇帝活着的时候，靠着皇帝的完全欣赏与信任，李斯的地位是牢固的，韩非出现的时候，李斯略施小计就去除了这个威胁，李斯不需要结党。


    始皇帝活着的时候，李斯也不能结党？如果被皇帝发现，李斯将无以自辩。


    但始皇帝死了。新皇帝最信任的人不是李斯自己。这一点，李斯很长时间以来都没有认真考虑。即使认真考虑了，也没有认真采取行动。赵高已经成为自己政治上最大的敌手，在赵高的势力还没有膨胀的时候，立即建立自己的势力集团，以李斯的地位，他是可以做到这一点的。'
  merge: -1
  img_proc: true
- pgno: 341
  md: '虽然法律规定皇帝拥有最高权力，李斯知道，这个权力的“运用之妙，存乎一心”。二世初登大宝，没有经验，如果李斯有心的话，完全可以组建自己的班子，把持朝政。


    但李斯没有做这些。


    他的敌手赵高很快利用自己的特殊地位，胁迫一些朝臣，当然，我们也不排除有真心投靠的朝臣，很快建立了一个与李斯相对的集团。等到这个集团实力坐大，李斯想要反击的时候，一切都已经太晚了。


    李斯为什么没有建立自己的集团？据分析，可能跟吕不韦的命运有关。


    吕不韦在秦国建立了自己庞大的政治势力集团，李斯初到秦国，就参加了这个集团。但始皇帝亲政之后，很快就摧毁了这个集团，李斯作为集团一分子，受到牵连。李斯亲眼看见了吕不韦集团的败亡，可能他会暗暗地想：以后'
  merge: -1
  img_proc: true
- pgno: 342
  md: '我坐到吕不韦那个位子，绝对不能像他这样干。


    我们有了这些认识之后，再来详细考察李斯的一生，就会有更深的感悟。


    # 职场中的潜规则，不懂就永远不能当领导


    在三国的人物中，曹氏父子是特别引人注目的，不仅在中国文学史上，曹操的诗，颇受关注，曹丕的《典论论文》名闻遐迩，曹植的文采，他的《洛神赋》和“七步诗”，鲜有可比者，而且，还在于曹氏父子在魏晋时期的历史地位和历史经历，包括曹家内部的复杂关系，特别是曹氏兄弟在争夺太子问题上的明争暗斗，多方位的较量。


    在东汉末年，宦官干政，外戚专权，天下大乱。曹操乘时机而发迹，他利用打败起义军的机会，积累家底，逐步做大，先是依托袁绍打董卓，接着，挟天子以令诸侯，与强敌袁绍对抗，官渡之'
  merge: -1
  img_proc: true
- pgno: 343
  md: 战，打败袁军，之后，扫平乌桓，镇压燕地，平定中原，成为统一北方的军事霸主，虽后来暂时败于赤壁，但在三国鼎立中，他依然是很有实力的一方。到了晚年，染病的魏王曹操，不得不考虑曹氏政权的接班人问题。作为权倾朝野的魏王，他虽不是皇帝，却是掌握着比皇帝还大的实权，他怕被骂篡权，他怕称帝后群王并起，没有称帝，但他或许预想到，他的下一代是会称帝的。曹操说：“若天命在吾，吾为周文王矣。”周文王坐拥天下三分有二，但仍臣服于商朝，到其子周武王方灭商立周朝，曹操自比周文王，那么，他一定得选一位继承者来当“周武王”，对曹氏家族，对曹魏政权，这可是极为关键的大事。所以，在继承人选择的问题上，曹操这位果断的政治家，也犹豫了很长时间。他得在他的儿子中，精心选择一位最称职的来继承他的宏大国业。曹操早年娶一妻两妾，妻丁夫人无子，妾刘氏生曹昂，卞
  merge: -1
  img_proc: true
- pgno: 344
  md: '氏生曹丕、曹彰、曹植、曹熊。曹昂早逝，卞氏继夫人位，据记载，曹操“使丁夫人母养昂，昂死于穰，丁夫人哭泣无节，操怒而出之，以卞氏为继室”。卞氏成正室，如此一来，卞氏所生的四个儿子，自然成了继曹操之位的候选人。在此四子中，曹熊年幼，尚无能力继位；曹彰“好为将”，不兴趣太子之位，剩下的只有曹丕和曹植两人进入继位的角逐之中。


    建安二十一年(公元115年)，曹操晋爵为魏王，曹丕和曹植争夺太子之位的竞争，进入了决定性阶段。对这两个儿子，曹操也拿不定主意让谁来接班，他在犹豫，在比较，在考察中，这就使得继位之争更为激烈。


    曹氏一门，不乏大才，曹操的这两个儿子，可都是非同寻常的人物，两个人都很聪明，很有文采，也很有想法，而且两个人都有朝中很有地位的大臣的拥戴和支持，可谓是势均力敌。当然，两人'
  merge: -1
  img_proc: true
- pgno: 345
  md: '也各有不同的优势。


    曹植机警聪敏，才华横溢，据说，他年少时很像小时候的曹操，长大后，文艺才能十分突出，多才多艺，才藻敏瞻，他反应特别机敏，文章写得极快，又写得极好，他非凡的文才，在当时，几乎是无能可比，所以，曹植颇得曹操的喜爱，很早，曹操就有立他为储的想法。


    曹植的杰出的才华，以及他的十分出色的文章，使他还得到了朝中的大才子们的青睐，丞相主簿杨修，是当时很有名的聪明才子，他和曹植经常在一起吟诗作赋，切磋文章，他一心想辅助曹植等太子之位，为曹植出谋划策，尽心尽力。


    还有另一位大才子丁仪，也是颇有名气的，原来，曹操曾经想把一儿女嫁给他，但曹丕嫌丁仪一只眼睛不好，极力反对，曹操只好作罢。丁仪因此怨恨曹丕，他与其弟丁廙，利用各种机会，多次在曹操面前称赞曹植的才华，努力劝曹操立曹'
  merge: -1
  img_proc: true
- pgno: 346
  md: '植为嗣。


    曹植在多次的文章“比赛”中，写得比曹丕快，比曹丕好，很受大臣们的称赞和曹操的喜爱，在这些方面，曹植占有巨大的优势。


    可是，曹丕也拥有曹植所没有的一些优势。曹昂死后，曹丕成了长子，这是他最大的优势，在传统封建社会，自古以来，长子继承权是被宗法制度所认可和倡导的，长子继位，理所当然。


    在立储的问题上，曹操也曾秘密征求大臣的意见。


    尚书崔琰认为：“《春秋》之义，立子以长。加五官将仁孝聪明，宜承正统，琰以死守之。”（“五官将”即曹丕，当时曹丕任五官中郎将）尚书仆射毛玠认为：“近者袁绍以嫡庶不分，覆宗灭国，废立大事，非所宜闻。”东曹掾邢颙说：“以庶代宗，先世之戒也，愿殿下深察之。”朝中大臣们的意见对曹丕十分有利，也对曹操的决策倾向很有影响。'
  merge: -1
  img_proc: true
- pgno: 347
  md: '后来，曹操特别召来太中大夫贾诩，他屏退左右，很严肃地问贾诩，该立谁为太子？颇有谋略的贾大夫对曹操的问话默然不答，曹操很急，又问：


    “与卿言，而不答，何也？”贾诩这会回答了，他说：“属有所思，故不对耳。”曹操急忙又问：“何思？”贾诩狡谄地说：“思袁本初、刘景升父子也。”曹操一听，哈哈大笑，作为深谙时势的杰出政治家，曹操对贾诩在他立储问题上的主张了然于胸。


    贾诩实际上是在用历史的经验教训，来说服曹操立长继位。


    当年，袁本初，即袁绍，承继着“四世三公”的家业，辉煌一时，袁绍有三子：袁谭、袁熙、袁尚。袁绍偏爱小儿子袁尚。袁绍死时，未立嗣，逢纪、审配与袁谭不和，伪造遗命立袁尚为主，结果造成袁氏兄弟分裂，袁谭、袁尚互相攻杀，'
  merge: -1
  img_proc: true
- pgno: 348
  md: '其内耗最终彻底削弱了袁氏的实力，宏大家族最终败亡，为曹操所灭。刘景升，即刘表。刘表有两个儿子：刘琦、刘琮。刘表先是偏爱刘琦，后来又不喜欢他，死前立刘琮为嗣，刘琦十分失落，曹操南征，刘琮投降，而刘琦投靠刘备，兄弟俩分道扬镳，刘表的荆州事业，也彻底毁了。贾诩深思着“袁本初、刘景升父子”，这非常明显地在提醒曹操，袁绍、刘表在立储问题上的前车之鉴，是深刻的教训，及时立嗣，极为重要；嫡长继位，极为关键，只有这样，方能避免往后的祸害和衰败，对此，谋略家曹孟德，当然是心中有数的。


    曹植虽然在机敏和才华方面，频频胜出曹丕，但关键事件的较量上，曹植却常常落败，曹丕除了有以上所说的居长之位外，还有两个很重要的优势，一个是他的心机比曹植多，热衷于写优秀文章的曹子键，才华横溢，但太多的艺术性的天真，


    349'
  merge: -1
  img_proc: true
- pgno: 349
  md: '在韬略和计谋上，不是曹丕的对手；与此相关，曹植身边的人，虽然是当时的一流的才子，极为聪明，但都有太多的文人气质，太自负，太自信，太轻敌，切磋文章是行家里手，而参谋用略却是隔靴搔痒，抓不到关键之处。


    比如，有一次，曹操领兵要出征，出发前文臣武将和曹丕、曹植兄弟们到路旁去恭送。曹植送别的场面上，出口成章，文辞华丽，为其父歌功颂德，其表现十分精彩，在场的大臣们听了无不佩服曹植的出色才华，曹操听了，十分很高兴，为曹植大有出息感到很自豪。曹丕同处与一个场所，看此情景，感到很失落，很无奈，一时想不到更好的办法来赢得其父的欢心。这时，曹丕的谋士吴质在他耳边悄悄说："王当行，流涕可也。"聪明的曹丕随即醒悟，面对着即将出征的曹操，跪拜告别时泪流满面，依依难舍，犹如生离死别一般，他表达着一个孝子对父亲出征的难别之情，'
  merge: -1
  img_proc: true
- pgno: 350
  md: '曹丕的诚孝的样子，使“操及左右咸欿欿”，众人觉得虽然曹植极有才华，但曹丕更为孝顺，在十分讲究忠孝的古代社会，曹丕在曹操和大臣们的严重，得了更高的赞许分数。


    再如，曹丕的一系列的精彩表现，有人去报告说是谋士吴质的参谋所起的效用，吴质经常到曹丕府中去商量对策，对此，曹操发生疑问。为了保密，曹丕叫人把吴质藏在车上的大簏里，载进曹丕府中，结果，这藏簏的举动被曹植的谋士杨修知道了，杨修马上跑到曹操面前打小报告，说吴质的不是。但是，对这一次举动曹操来不及派人追查，不知真假与否。曹丕很害怕，怕引起父亲的反感，但吴质对曹丕说：“别担心，我自有办法。”第二天，吴质让人用大簏装着绢，大摇大摆地往曹丕府中运，杨修见了，又去打小报告，曹操马上派人去搜查，当场抓住运簏的车，但在车里发现的，只有绢布，根本就没有吴质，于是，'
  merge: -1
  img_proc: true
- pgno: 351
  md: '曹操开始怀疑杨修是有意陷害曹丕，不再听信杨修的话了。


    又如，曹植虽然才华横溢，文章出众，但这位十分有才的公子，常常是“任性而行，不自雕饰”，有时更是不守规矩，我行我素。说实话，这倒是得到了曹操的“真传”，可是，当他这方面表现得过分了，连曹操也会反感。有一次，曹植喝多了酒，乘车马行至邺宫司马门，喝令守门者开门让路，这司马门可不一般，它是只有曹操出入才能打开的一个特别的门。曹操知道曹丕的不轨举动后，勃然大怒，把曹植狠狠地训斥了一番。


    另外，曹操一贯提倡节俭，不准妇女穿绸衣，有一次，曹操在铜雀台上看见曹植的妻子穿着绣花的绸衣在园林中游逛，下严令责罚。曹植的妻子违背禁令，在曹操看来，是曹植治家不严。曹丕正是利用曹植喜欢喝酒，任性而为的弱点，算计'
  merge: -1
  img_proc: true
- pgno: 352
  md: '曹植的，有一次，曹操想让曹植到边疆去历练历练，于是，就令他和一位将军领兵出征，出发前的那天晚上，曹丕假惺惺地带着酒去为弟弟送行，并大大地夸他，祝贺他出征能凯旋归来，表示弟弟如果成功他是真心高兴的，他频繁敬曹植喝酒，让曹植那天晚上喝得呼呼大睡，到第二天，当出征队伍已在外面整装待发，领兵的武将已在点名，曹植还在熟睡着，他误过了出征的时间，这可是大罪过，曹操知道后，取消了曹植的统兵资格，对他非常失望，感觉这位才华横溢的儿子难堪大任。最终，曹丕登上了太子之位。


    曹植之负于曹丕，在争夺太子之位的角逐中彻底失败，让我们悟出了古代官场的一些潜规则。

    首先，曹植及他的智囊团，可称得上是当时由顶级才子组成的团队，但是，才华横溢的人，往往热衷于展示自己的才华，习惯于在众人的夸耀声中鸣鸣得意，容易飘飘然，容易理想化，而对自'
  merge: -1
  img_proc: true
- pgno: 353
  md: '己的弱点没有清醒的认识，对自己的被动局面未能及时感觉到，结果在政坛的角逐中，往往败给对手。


    其次，曹植属于极有才华的人，一流文采，洒脱举止，任性而为，我行我素，他不喜欢循规蹈矩，他视规矩为束缚，这在诗坛、文坛上，表现着创新的意识，是优点，是长处，而在政坛上，特别是在尔虞我诈的朝廷争斗中，却是致命的弱点。才华出众而不懂得低调，很容易罪人，很容易成为众矢之的。而忽视规矩却容易被视为是大逆不道，甚至被认为是犯上作乱，其政治后果，不堪设想。


    再次，曹丌虽然在敏锐、才华方面不如曹植，但作为文章的高手，他深知古今文人有“不护细行”的通病，所以，他在平素场合，谨小慎为，矫情自饰，让对方难以抓到把柄，对曹操周围的人，'
  merge: -1
  img_proc: true
- pgno: 354
  md: '他谦和与之相处，对其智囊人物，他敬重有加，而对曹植，他充分了解其弱点，巧妙进行攻击，将自己的弱点转化为优点，很有针对性地攻击对方的要害。所以，著有《典论论文》的这位文学评论家，一点都不像是知识分子，而更像是谙熟权谋的政坛老手。或许，我们可以这样理解：曹植更多地继承了曹操的潇洒、敏锐和才学，而曹丕则更多地继承了曹操的狡诈、心机和韬略，最终，在曹氏继承人的争斗中，曹丕打败曹植，获得辉煌的胜利。


    最后，曹植、杨修等，作为极具才情的大文人，他们把更多的时间和精力用于吟诗作赋上，他们常常聚集一起，品酒论文，谈天论世，洒脱而务虚。这看似聪明绝顶，诸事能任性而为，而实际上，很多事情都没有办彻底，没有落到实处，最终的失败是不可避免的。而曹丕、吴质等，将更'
  merge: -1
  img_proc: true
- pgno: 355
  md: '多的心思用在政坛的角逐中，深谋远虑，计周策全，而且，他们不像文人那么天真，也不像文人那么道德，他们敢于使诈弄假，惯于不择手段，如此看来，在政坛上，真正有文人气质的，在争斗中败北似乎是不可避免的。曹植这位大才子，在三国文坛上，在曹魏的文臣中，看似傲视同侪，才学超人，也曾深得父曹操的赏识和宠爱，但在实质性的政坛争斗中，他还是被更具有政治素质的曹丕比下去了。


    善于“御之以术，矫情自饰”的曹丕，最终赢得了大多数大臣的支持，获得了曹操的赏识，最终荣登太子之位。


    其实，老谋深算的曹孟德，当然也知道，在政坛的无情争斗中，真正能将曹魏政权发扬光大的，不是才华横溢的文人曹植，而是不失文才，而又颇有心计、政治手腕娴熟的曹丕。自古文人多天'
  merge: -1
  img_proc: true
- pgno: 356
  md: '真，那堪敌对权谋家！


    # 狡兔三窟出高招


    战国时代的齐国有一个显赫的贵族孟尝君，名叫田文。他有一个高明的策略，就是招养门客，以此来储备人才资源，将他的财富巧妙地转化为随时可用的才智。据说，孟尝君门下养有食客三千。其中当然有混口饭吃，碌碌无为的，也不乏才华横溢，智谋超人的。


    这位有远见的贵族将他的食客分为三个等级，上等的称为“代舍”，住高级房屋，享受鱼肉佳肴，出门有车；中等的称为“幸舍”，住中等房，食物有肉，但出门无车；下等的称为“传舍”，住下等房，只有粗茶淡饭，只能将就度日。


    齐国有个叫冯谩的人，穷困潦倒，投靠到孟尝君的门下，孟尝君问他的助手：“新来的人有什么'
  merge: -1
  img_proc: true
- pgno: 357
  md: '专长吗？”助手说：“没有什么专长。”宽容的孟尝君还是让助手收留了他。当然，助手知道他 没有本事，只给“传舍”的待遇，住简陋房，只 提供粗茶淡饭。


    过了十来天，孟尝君问助手，新来的冯谖在干吗？ 助手说，他无所事事，经常靠着柱子，敲弹着他 长剑，哼着歌：“长剑啊，我们回去吧！吃饭没 有鱼！”孟尝君说：“给他吃鱼，给予‘幸舍’
    待遇。”过了不久，冯谖又弹奏剑唱着：“长剑 啊，我们回去吧！出门没有车！”左右人嘲笑他， 告诉了孟尝君，孟尝君说：“给他提供车，让他 住高级房。”又过了不久，冯谖又弹剑唱着：“长
    剑啊，我们还是回去吧！没有办法养家！”左右 人很厌恶他，告诉了孟尝君，孟尝君问：“他有 亲属吗？”助手说：“家中有个老母亲。”孟尝 君派人供养他的老母亲。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '从此，冯谡不再弹剑唱歌了。


    后来，孟尝君需要有人替他到封地薛邑去收债，就问：“谁能为我到薛地收债？”冯谡自告奋勇愿意去。冯尝君召见他，为他准备好马车，整理好行装，交给他债券，临走时，冯谡问：“收债回来后，先生需要买点什么？”孟尝君说：“看看我缺了什么就买什么！”


    冯谡到了薛地，把欠债的人召集起来，一一核对债券，分别贫富，能还的约定还款时间，写在债券上，贫穷而不能还的，把债券烧了。


    冯谡假传孟尝君的指令，对众人说：“孟尝君借款给你们，不是为利息，而是为了你们的生活。但是，他府中有门客数千，俸食不足，不得不来收取些利息，今天能还的按期偿还，贫穷而不能'
  merge: -1
  img_proc: true
- pgno: 359
  md: '还的，债券都烧了，不用再还，这是君王对薛地百姓的深厚恩德！”


    百姓都叩头欢呼：“孟尝君亲如父母！”


    冯谖回去见孟尝君，孟尝君问：“你这么快就回来，债都收完了吗？” 冯谖回答：“都收完了！” 孟尝君说：“买了什么东西？” 冯谖说：“根据你的意思，‘缺什么就买什么’
    我想，您有用不完的珍宝，狗马满园，美女多多。您缺的只是‘义’，我帮您买了‘义’。” 孟尝君感到奇怪，问：“怎样买‘义’呢？”


    冯谖说：“薛邑是您的封地，对待那里的百姓，您未能像对待自己的儿女一样去善待他们，却如商人一样榨取利息。我自作主张，假传命令，把那些无法还债的穷人的债券都烧了，百姓高兴地'
  merge: -1
  img_proc: true
- pgno: 360
  md: '欢呼您亲如父母，这就是为你买回了‘义’！”冯尝君听了闷闷不乐，但事已至此，只好令他退下。


    一年后，有人在齐王面前进谗言，齐王让孟尝君回到了自己的封地薛邑。孟尝君走到离薛地不到百里，薛地的百姓就赶来欢呼迎接，孟尝君对身边的冯谖说：“先生为我买回了‘义’，我感觉到了。”


    冯谖说：“狡兔有三窟，才能免于死，您现在只有一窟，还不能心安理得地高枕无忧，我再为您再凿两窟。”


    于是，冯谖带了冯尝君为他准备的 50 辆车，500 斤的黄金，去了魏国，他对魏惠王说：“齐王放逐了他的得力大臣孟尝君，诸侯谁先迎接他，谁'
  merge: -1
  img_proc: true
- pgno: 361
  md: '就能富国强兵。”


    魏王觉得有理，就领令腾出相位，令原来的丞相改任上将军，派使臣带黄金千斤，恭迎孟尝君。


    冯谖先回到薛地，对孟尝君说：“千斤黄金是厚礼，马车百辆是高级礼节，齐国一定会知道的。”


    魏国的使臣连续三次恭迎孟尝君，孟尝君都拒绝了。齐王听说后，君臣都害怕了，就派太傅带了黄金千斤，豪华车两辆，佩剑一把，齐王亲笔信一封，向孟尝君道歉，诚恳地说：“都是寡人不好，受到神灵谴责，面临大祸，听信谗言，得罪了您。我算不了什么，但愿您能顾念先王宗庙，重新回来治理国家吧！”冯谖告诉孟尝君说：“希望您请求先王以祭祀用的礼器，在薛邑建立宗庙。”后来，宗庙建成了，冯谖说：“三窟已成，您可以高枕无忧过快乐日子了。”'
  merge: -1
  img_proc: true
- pgno: 362
  md: '此后，孟尝君任相 10 年，没有遇到任何灾祸，


    这都是因为有冯谖为他出谋划策！


    这是一个许多人知道的故事，从这个古老的故事中，有许多值得现代人思考的深意：


    冯谖给人的启示是：当你落泊潦草时，只要有自信、有才能，用不着阿谀奉承，也不能卑躬屈膝，要像冯谖一样，弹剑高歌，懂得去取得尊重、待遇和信任。只要你合作的人是胸怀宽广的，能爱才识才，你要敢于按自己的主见去处理事务。聪明人该明白，只有愚蠢的、心胸狭窄的领导、老板，才会喜欢点头哈腰的蠢货。冯谖的行为，也让人联想起姜太公钓鱼的故事，自愿上钩的周文王也是高明的君主。'
  merge: -1
  img_proc: true
- pgno: 363
  md: '孟尝君给人的启示是：养食客三千，财富是损失了，但得到的却是更为难得的智力资源，关键的时候，“才”远远胜于“财”。此外，当领导的，做老板的，要有豁达大度，不要计较蝇头小利，更要敢于授权，要创造条件让为你工作的人发挥创造性。


    冯谖的策略告诉我们：狡兔尚需三窟，何况人也。多考虑几种选择，多准备几套方案，多关注发展的各种方向，才能避免危机，稳操胜卷。要善于应用竞争的现实（如故事中齐王与魏王的矛盾、竞争）来创造有利于自己的态势，要善于应用传统的力量（如故事中祭祀礼器的影响）以形成有利于自己的局面。这都是谋胜之道。


    故事的主题还启示我们：“利”是必要的，否则，孟尝君就无法养食客三千，但“义”才是最重要'
  merge: -1
  img_proc: true
- pgno: 364
  md: '的，重义积德，遇到危难、在关键时，才能得民心而化险为夷，永远立于不败之地。


    # 临危智取安居平五路


    激烈竞争时代的残酷和无情，从三国的故事中可以一目了然。刘备报仇心切，轻敌用兵，被东吴年轻的儒将陆逊火烧连营，惨败溃逃，命丧于白帝城，棺材刚运回成都，傻阿斗刘禅继承皇位，以诸葛亮为相父，这时蜀国处于悲乱之中。枭雄刘备刚死，继任的新皇帝又傻呼呼的，众官处于悲哀之中，举国上下，慌乱无措，作为主政的丞相，诸葛亮是百事缠身，蜀国处于从没有过的危难之中。但残忍狡诈的魏国帝王曹丕，根本不会同情蜀国的悲惨和危难，当他得知消息后，大喜地说：“刘备已经死了，朕不用担忧了。何不乘蜀国没有主政的，起兵去征伐呢？”谋士贾诩有所担心，劝谏说：“刘'
  merge: -1
  img_proc: true
- pgno: 365
  md: 备虽然死了，必然托孤于诸葛亮。诸葛亮感激刘备的知遇之恩，必然倾心竭力地扶持嗣主。陛下不可仓卒起兵讨伐。”正说着，更加残忍和狡诈的司马懿，从班部中奋然而出，果断建议：“不乘此机会进兵，更待何时？”曹丕大喜，急问司马懿的详细计谋。司马懿说：“如果只起中原的兵力，一时是难以取胜。必须用五路大兵，四面夹攻，使诸葛亮首尾不能救应，然后可图。”随后，这位魏国未来的大都督提出了很有攻击力量的五路大军同时进攻的毒辣计策：第一路，写信派使者送往辽东鲜卑国，晋见国王轲比能，以金帛贿赂，令起辽西羌兵十万，先从旱路攻取西平关；第二路，写信派使者送到南蛮，晋见蛮王孟获，许以封官赏赐，令起兵十万，攻打益州、永昌、牂牁、越嶲四郡，攻击西川的南部；第三路，派使者到东吴，要
  merge: -1
  img_proc: true
- pgno: 366
  md: '求和好，许诺割地给吴国，令孙权起兵十万，攻两川峡口，径取涪城；第四路，派使者去找投降的将领孟达，令尽起上庸的兵力十万，西攻汉中；第五路，令魏国的大将军曹真为大都督，提兵十万，经由京兆径出阳平关直取西川。五路大军，兵力五十万，齐头并进。


    司马懿认为，诸葛亮纵然有姜子牙的才能，也无法抵挡这五路大军的进攻。曹丕乐坏了，对司马懿的建议言听计从，派遣信使，任命都督，实施攻击计划。


    蜀国悲痛、忙乱，傻皇帝得到报告后大惊失色，无计可施，紧急召见相父入皇宫商议，可丞相府的人却说，诸葛孔明有病无法出门，刘禅吓了一身冷汗，急忙令大臣董允、杜琼到丞相府去拜见，但也都㧕㧕在门外。丞相连日不出门，大臣们也都慌乱了，杜琼奏请刘禅亲自前往丞相府问计，刘禅只好亲自去见孔明。'
  merge: -1
  img_proc: true
- pgno: 367
  md: 当刘禅进入丞相府，却见诸葛亮悠闲地独倚着竹杖，在小池边观鱼。他只好在后面站了很久，后来才轻声轻气地问“丞相健康快乐吗？”孔明回身一看，见是后主，慌忙丢掉竹杖，拜伏于地说：“为臣罪该万死！”后主刘禅急忙扶起，问：“如今曹丕分兵五路，侵犯我境，非常紧急，相父为何不肯出相府处理事务呢？”孔明大笑，扶后主入内室坐好，报告说：“五路兵到，为臣的哪会不知道，臣并不是在观鱼，是有所思考啊。五路兵中的羌王轲比能，蛮王孟获，反将孟达，魏将曹真的四路兵，臣都已经退去了。只有孙权这一路兵，臣已有退兵之计，但还须有一个能言善辩的人作为使者。因为还没有合适的人选，所以在深思。陛下何必担忧呢？”傻皇帝听了放心地傻笑了。当诸葛亮送刘禅出相府时，发现大臣邓芝在会意地微笑，他素知邓芝很有辩才，就派他出使
  merge: -1
  img_proc: true
- pgno: 368
  md: '东吴，邓芝果然成功地说服了吴王孙权与蜀国结盟，共同抗击曹魏大军。诸葛亮成功地击退了司马懿五路大军的进攻计划。


    那么，诸葛孔明为什么能够不出相府，于安居观鱼中轻松地退去强大的五路军团呢？这是由于诸葛亮的神机妙算，智略过人。他对敌我双方将领的能力、心理，对战场地理的环境、特征，对历史、习俗的影响，以及对国与国关系等，都有深刻的了解，并能把所有这些因素巧妙地在关键时候加以运用，才能在巨大的危机来临时，化险为夷，轻松退敌。


    诸葛亮在为傻阿斗解析退兵之策时说出了他的策略：


    在侵犯蜀国的五路大军中，西番国王轭比能，引兵所进犯的是西平关，而现在的蜀将马超祖上是西川人氏，素来深得羌人的民心，羌人把马超誉为是神威天将军，诸葛亮先派一人送快'
  merge: -1
  img_proc: true
- pgno: 369
  md: '信令马超紧守西平关，埋伏四路奇兵，每日轮换把守，以抗拒敌军，所以此路军不必担忧；


    第二路军是南蛮孟获，引兵侵犯四郡，诸葛亮令人写快信派蜀将魏延带领一军险要地段左出右入，右出左入，以作为疑兵之计，南蛮兵只凭勇力作战，但是疑心重，如果看见疑兵，必然不敢进攻，此路军也不必担忧；第四路是孟达引兵进攻汉中，孟达与蜀国大臣李严曾结拜为生死之交，诸葛亮回成都时，留下李严镇守永安宫，诸葛亮写了一封信，冒充李严的亲笔信，派人送给孟达，孟达见信后必然推病不出，以慢军心，此路军也不必担忧；第五路是魏军的嫡系，由曹真领兵侵犯阳平关，但阳平关地势险要，完全可以守住，诸葛亮调赵云引一支军把守关隘，只镇守，不出战，曹真如果见蜀军不出战，时间久了就会自己退去，此路军也不必担忧。为防万一，诸葛亮还秘密抽调'
  merge: -1
  img_proc: true
- pgno: 370
  md: '关兴、张苞二将，各带领三万兵力，屯守于紧要之处，为各路由救应。第三路是东吴的军队，但这一路也未必马上会来进攻：如过看到四路兵得胜了，川中危急，他们必然来攻；如果四路都进攻无效，他们哪里还敢动手？诸葛亮料定孙权回想曹丕曾三路大军侵犯过东吴，结怨很深，必然不肯听曹魏的进攻计策。为了保险，还派一位能言善辩的大臣，到东吴说明利害关系，如果能先退东吴，其他四路军也就不用担忧。


    这是非常高明的退兵之策，真可谓“运筹于帷幄之中，决胜于千里之外”。相府中池畔闲观鱼，安居摇扇，智退大军五路；危机时冷静出奇谋，泰然自若，轻松转危为安。


    诸葛亮的高明在于：熟知历史因素，利用马超家族在羌人中的威望，退去轲比能进犯西平关的军队；巧用心理战术，抓住南蛮孟获的多疑'
  merge: -1
  img_proc: true
- pgno: 371
  md: '特点，以疑兵退去侵犯四郡之敌；利用情感的弱点，抓住孟达和李严的结义之情，以假信让叛将推病不出；发挥将领的震慑作用，让赵云（要知道：赵云曾在长坂坡于数万曹军如入无人之境，令曹军胆寒）统领实力部队只守不攻，使敌将曹真不战自退；深谙划交谋略，以善辩的邓芝为说客，从外交上将东吴化敌为友。


    本来诸葛亮遇到的是危难之时的巨大危机，但由于他对历史（羌人的习俗）、地理（阳平关的险要）、外交（吴蜀的利害关系）、人情（孟达李严的结义）、心理（孟获的多疑）、将领（赵云的威望）文臣（邓芝的善辩）等各方面有深刻理解，胸有成竹，并能驾轻就熟地运用这些因素，将巨大的危机转化为难得的机遇，在刘备去世时，成功地化解了由关羽引起，而刘备扩展了的蜀、吴恩怨，重新形成吴、蜀联'
  merge: -1
  img_proc: true
- pgno: 372
  md: '盟，在新的基点上建立了三足鼎立之势。


    这是解救危机的经典案例，对于政治、军事、外交，特别是对于现代企业如何从巨大的危机中走出来，转危为安，转败为胜，具有十分重要的启示，很值得深思！可以说，历史小说中深谙韬略的诸葛先生，他的“安居平五路”的精彩故事，为现代企业家上了一堂深刻的危机管理的课程。


    # 空城妙计两帅心相知


    空城计深藏玄机，魏蜀两军统帅，心意相通，也许比通常的分析，更有令人琢磨的深意。诸葛亮在刘备死后，迅速解除了危机，恢复与东吴的联盟，并平定南中，开始实施北伐曹魏的计划。蜀汉建兴六年（228
    年）春，诸葛亮率蜀军第一次北伐，他令赵云等佯疑兵，摆出由斜谷（今陕西眉县南）攻取城池的态势，以吸引魏军，自己则率主力向祁山（今甘肃西和'
  merge: -1
  img_proc: true
- pgno: 373
  md: '县祁山堡）方向进攻，陇右的天水、南安、安定等郡闻风而动，相继叛魏降蜀。此次北伐，开始阶段进展顺利：收城掠地，招降姜维，一时关中大幅。然而，蜀军的气势未能保留，诸葛亮没有遵守刘备临终时嘱咐，误以为马谡是“匡世奇才”，重用这位“言过其实，不可大用”参谋，他没有实战经验，又在关键时候被派去镇守街亭这一战略要地。马谡死背兵书，纸上谈兵，扎兵于没有水源的秃项山上，满以为蜀兵可以“置之死地而后勇”，结果被魏军断了水源，蜀军大乱，被魏将张郃所败，丢失了街亭这个战略要地，蜀军的战场形势逆转，由攻而退，陷入了十分危急的处境，随时都有被魏兵堵截归路、全军覆灭的危险。


    诸葛亮面对这一危机，颉足长叹：“大势去矣，这全是我的过错造成的！”为避免更大损失，'
  merge: -1
  img_proc: true
- pgno: 374
  md: '他急忙整顿人马，迅速实施撤退的策略。


    为防魏军乘势追击，急令关兴、张苞两员小将：


    “各带三千人马，在武功山小路两侧布置疑兵。如果魏军来到，敌众我寡，切不可战，只大声击鼓呐喊，用疑兵计吓退敌军。然后，急奔阳平关，撤回国内！”又命令张冀：“引领部分蜀兵，快速修理剑阁通道，为大军准备退路。”然后传令：大军悄悄收拾行装，分别从各自驻地快速撤回国内。


    此时，诸葛亮的中军营地，在易攻难守西城县内，身边人马都已分派出去，城中已没有能战的兵力了。诸葛亮正要下令撤退，忽然哨兵来报：“司马懿亲率十五万大军，已向西城扑来，大军很快兵临城下！”'
  merge: -1
  img_proc: true
- pgno: 375
  md: '这时，诸葛亮身边只剩下一些文官，连一员武将也没有，仅有的两千老弱病弱，根本无法应战。众官员听到这消息，一个个吓得面无血色，一声都不敢吭。大家明白，中军营地，正陷入绝境：战无力战——都是老弱病残，只有一些文官，没有武将；逃无法逃——此地路经狭窄，惟一大道已为司马懿占领。再加上辎重行李多，马匹车辆少，逃不出几里，就会被魏军的铁骑追杀殆尽。


    诸葛亮也心急如焚，忙登城观望。果然，西北方向尘埃滚滚，隐约已有大军奔来。


    诸葛亮沉思片刻，急中生智，立即传下将令：把城内所有旗帜全都放倒，藏匿起来！城内士'
  merge: -1
  img_proc: true
- pgno: 376
  md: '兵，各自隐藏在驻地房舍、围墙内，不许走动呼喊，违令者立斩不赦！大开东南西北四城门，每一门前，派二十名老少军兵打扮成百姓，洒水扫街，不许神色慌张，不能举措不当。如果魏军冲到城前，不能退入城内，要镇静自如，一如既往。


    众人不解其意。诸葛亮微微一笑，胸有成竹地说：“我自有退兵之法，你们不必惊慌。”说罢，他身披鹤图长衫，头戴绸布便帽，令两个小童抱着一张琴、一只香炉，随他登上城楼。诸葛亮悠闲端坐于城楼之上，焚香摆琴，闭目静养，然后缓缓睁开眼，虚视前方，安然自得地弹起琴来。


    魏军先头部队兵临城下，见此情形，都不敢贸'
  merge: -1
  img_proc: true
- pgno: 377
  md: '然前进，急报主帅司马懿。


    马司马懿不敢相信，以为部下看错了，他急令三军暂停行动，自己飞马跑到城下，向城楼观望。


    只见西城楼上，诸葛亮丞相笑容可掬，轻松端坐琴前，伴着袅袅上升的香烟，旁若无人，安然自得，正沉浸在自己所弹奏的琴音中。他左边的童子，手捧一把宝剑；右边的童子，则拿着一把尘尾。城门口处，有二十余老少百姓正低头洒扫街道，有条不紊，不惊不慌，丝毫没有兵临城下的感觉。


    司马懿观望了许久，细细品听诸葛亮的琴声，他感觉到：弹琴人动作悠闲，表情自然，琴声优雅，没有丝毫破绽。


    身边的长子司马师兴奋地说：“我们即刻冲杀”'
  merge: -1
  img_proc: true
- pgno: 378
  md: '进去，活捉诸葛亮！他分明是故弄玄虚，肯定是空城！”众将也要求攻城去。


    司马懿凝神谛听，忽然神色一变，露出紧张模样，忙下令：“后队改作前锋，前锋变为后队，立即撤退！”众人不解：并无异常情况。司马懿怒道：“立即撤退。违令者斩！”众将仍疑惑不解，但只好遵令撤退。离西城稍远，估计已脱离危险，司马懿才心有余悸地解释：“诸葛亮和我多年交战，他一生谨慎，从不冒险！如今城门大开，故意显示空城，引我军进城抓他。这定有埋伏，是个骗局！我军若贸然轻进，必中其计。”


    司马师问：“父亲一直凝神静听，并无异常动静，您为何突然改变神色，下令撤军呢？”'
  merge: -1
  img_proc: true
- pgno: 379
  md: '司马懿冷笑： “当统帅的，必须善于观察天地之间的运行变化，了解人间世上的各种知识！我听诸葛亮琴音，初时恬淡平和，却突然高扬激昂，露出杀气！显然是要动手出兵了！再不走，如果被围住，四面挨打，必败无疑！”


    司马师及众将虽觉得有理，但仍不十分信服。


    大军撤临武功山，突然从山后传来杀声，震天动地，显然是蜀军伏兵袭来，众将大惊。司马懿道：“刚才若不及时撤退，必中其计！”话音未落，只见旁边大道上一军杀来，旗上大字：“右护卫使虎翼将军张苞”。这是当年当阳桥头单枪匹马吓退曹军的西蜀将名张飞的儿子，魏兵一见，心惊胆战，弃甲抛戈而逃。


    380'
  merge: -1
  img_proc: true
- pgno: 380
  md: '逃不多远，山谷中又喊杀声起，鼓角喧天、尘埃滚滚。一杆大旗上写着：“左护卫使龙骧将军关兴”。魏兵一见是关云长之子，更是魂飞魄散！哪敢接战？！


    山地中喊声杀声鼓声激荡回响，似乎是千军万马，魏军匆忙丢弃辎重，仓皇而逃。


    张苞、关兴并不追赶，只收拾魏军丢弃的辎重物资，迅速撤回。


    西城中的诸葛亮，见司马懿带兵疾驰而去，轻轻长吁一口气，放松地笑道：诸葛亮笑道：“兵法云，知己知彼，方可百战不殆。司马懿知我一生谨慎，从不弄险，所以见今天情景，以为我在用计，想骗他入城。所以反慌忙撤退。而知司马懿了解我的这一贯作风，所以便借用'
  merge: -1
  img_proc: true
- pgno: 381
  md: '这种心理，乘机算计了他！只有知己知彼，方敢如此！若换上司马昭或曹操统兵，我绝不会如此的！不过，司马懿也确是知我之人。如果不是没有它法，我也绝不会用此险计！实在是万不得已！”
    众人倾心叹佩服，但又后怕不已。


    从历史小说关于空城计的描写中，可以看出魏蜀两军的统帅，由于多年的交手，更由于彼此都是智谋大师，确实是两心相知。司马懿确信，诸葛亮一生谨慎，绝不会冒巨大的风险使用空城计，如果不是逼不得已，诸葛亮确实也不会敢冒此风险，是战争的实际形势使他采取此计策；诸葛亮也了解司马懿深知司马懿会考虑到他从来谨慎的个性，推测他是在使用计策，不'
  merge: -1
  img_proc: true
- pgno: 382
  md: '敢贸然攻城，可是蜀军遇到战争急转直下的形势，似乎司马懿还不敢相信。这也应了一句兵法古语：兵形象水。水在流动中是时时在变化的，无法准确的预测。杰出的军事统帅，其英明之处在于根据形势的变化及时采取对应的措施。在这一点上，诸葛亮的聪明机智恰好成为马谡死背兵书的鲜明对比。


    还有一种猜测，说明魏蜀两军的统帅是在更高的层次上彼此心知肚明，虽然不一定是事实，但却不无道理：两帅是默契地演了一出两国元首和双方众将均没有觉察的绝妙好戏。诸葛亮在马谡兵败街亭后，已无兵力守住易守难攻的西城，只好演了一出空城计，但他清楚地知道，即使司马懿知道是空城计，也绝对不会攻进城'
  merge: -1
