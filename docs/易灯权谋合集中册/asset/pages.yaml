  md: '# 选择一所好的学校


    曲意逢迎，阿谀谄媚自然是和珅少不了的致胜法宝，但是，倘若没在真才实学的积淀，他也不能博得乾隆的如此信任。将国家大权玩弄于股掌之中。


    这一点，和珅早在进入咸宁宫官学的时候就已经明白了。咸宁宫官学对学生的要求极益严格。


    读书诸生清晨入学，日暮散归。如果遇到天气不好，经过请求，学生可以留宿在学内学校没管理大臣，协理事务大臣，另外还有满汉总裁两名，必须是翰林才能担任，学内的散师也大多是翰林，极少数不是翰林的，也是享有盛名的饱学之士。'
