- pgno: 1379
  md: '上司为什么要做，能达到什么目的。然后再以自己的立场抉择，有些做，有些推脱。就算是象余则成这样看似对站长忠心耿耿的人，也不是什么都会做的。选择符合自己利益的事情去做，不符合利益的想法推搪。用做了的事情取悦上司，而不做的事情则让上司知道，你已经完全尽力了。


    +   14、上司突然垮台，不要惊慌，独自完成任务，然后借此再找到新的靠山。


    在职场里，经常发生上司突然垮台的事情。如果你不幸遇见，千万别惊慌，独自完成手上的工作，而且要做的漂亮精彩。而这就是你将求安身立命的资本，你可以借此找到新的靠山。还是那句话，必须要让自己有价值，这比有人罩着你还重要。


    +   15、做事做的好，干活干到老。


    “做事做的好，干活干到老” 和 “让自己有价值” 这两句话间并没有矛盾。价值是体现在关键处，是一个至关重要的地方才要突然爆发的。而无关痛痒时，尤其是做些没功劳只有苦劳的活，别做太好。永远干得好，就会一直干下去。若让人觉得，你只有做庸碌工作的才能，就算干到累死，你也没有爬上去的那一天。


    +   16、一定要有缺点。


    在职场，一定要有缺点，一个完美而毫无缺点的人，会遭人嫉恨，会被人敬而远之。如果连上司都对你敬而远之，那职'
