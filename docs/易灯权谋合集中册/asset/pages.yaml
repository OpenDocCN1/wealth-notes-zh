    # 故事三：“周公在世”的王莽


    王莽，字巨君，魏郡元城人，新显王王曼长子、西汉孝元皇后王政君的侄子。王莽为西汉外戚王氏家族的重要成员，其人谦恭俭让，礼贤下士，在朝野素有威名。西汉末年，社会矛盾空前激化，王莽被朝野视为能挽危局的不二人选，被看作是“周公再世”。很快，为了登上帝位，王莽开始撕开他的面具，大肆屠杀异己，不久后建立新朝，建元“始建国”，宣布推行新政，史称“王莽改制”。


    王莽统治的末期，天下大乱，新莽地皇四年，更始军攻入都城长安，王莽死于乱军之中。而新朝也成为中国历史上很短命的朝代之一。


