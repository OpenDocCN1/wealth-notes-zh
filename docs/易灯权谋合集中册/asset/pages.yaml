- pgno: 588
  md: '# **“制衡”之术**


    说起“制衡”之术，我们在生活中或多或少会有所涉及，也许你是因此而得福，官运亨通。但在很多情况下，这是一种很无力又很无奈的行政运行方式。


    很多人认为“制衡”之术源于“中庸”之道，其实这恰恰是对“中庸”之道的错误理解。“中庸”一词源自于《中庸》一书中所提出的“执其两端，用其中于民”，其原意是该注意事物过和不及的两个方面，采取中正的办法实施于民众。


    中庸的“中”是不偏不倚的意思，而不是当今很多人认为的“折中”之意。而官场盛行的“制衡”之术却在很大程度上是“折中”主义的写照。


    比如你在单位兢兢业业，勤恳工作，工作能力和业绩一'
  merge: -1
  img_proc: true
