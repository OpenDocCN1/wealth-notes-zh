- pgno: 644
  md: '然下官闻积毁销金，积谗 糜骨。古则直生取疑于盗金，近则伯鱼被名于不义。彼之二才，犹或如此；况在下 官，焉能自免。昔上将之耻，绛侯幽狱；名臣之羞，史迁下室，如下官尚何言哉！夫鲁连之智，辞禄而不反；接舆之贤，行歌而忘归。子陵闭关于东越，仲蔚杜门于
    西秦，亦良可知也。若使下官事非其虚，罪得其实，亦当钳口吞舌，伏匕首以殒身， 何以见齐鲁奇节之人，燕赵悲歌之士乎？


    方今圣历欽明，天下乐业，青云浮雒，荣光塞河。西泊临洮、狄道，北距飞狐、'
