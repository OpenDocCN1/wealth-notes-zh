  md: '# 愤青、俊杰和犬儒主义者的办公室政治观


    官僚的时代将成既往，公司的时代正在降临。


    于是，“办公室政治”成了一个时髦的玩艺。


    但是，与“网恋”一样，“办公室政治”绝对是一个逻辑非常荒谬的伪概念——80 年代通过书信进行的柏拉图式恋爱只能暧昧地叫做“笔友”，偏偏 90 年代将互联网上装模作样的打情骂俏叫做“网恋”。


    同样道理，办公室古已有之，政治这东西更是与人类社会相始终，偏偏等小白领们开始扎堆的时候，就把他们心中的小九九像回事似的捧出来，还美其名曰：办公室政治。


    呀呸！后现代的愤青们几乎要诅咒这种对公司的媚态思维了。'
  merge: -1
  img_proc: true
- pgno: 1392
  md: '# 愤青


    在愤青们看来，办公室实在不是什么好玩意。起码从养生的角度来讲，办公室生活绝对是不“环保”的——朝九晚五，高度机械；职业套装，放眼望去一片阴沉的灰色；每天蜷缩在空调房间里，不透空气，不见阳光；受过标准职业训练，每个人脸上都是职业化的表情，一笑一颦，张弛有度——上帝，这是人呆的地方吗。瞧！愤青指着高密度的写字楼，然后走到楼里指着透明化的格子间：这不是鸟笼是什么？


    或许愤青们对了，办公室可能真的就是鸟笼。


    那办公室政治呢？难道是鸟笼里的鸟在互相厮杀？如果你这样问愤青，愤青肯定还你一个鄙夷的微笑：难道有这么悲壮吗？


    是的，在愤青的眼里，“厮杀”这个用在战士们身上的词语用在鸟儿们的身上未免自玷清白之身。嗯……，愤青手捻下巴，打个比方，也就是鸟儿们用各自的喙啄一对对方槽里的食而已。明星，或暗着的。——愤青还不忘补充一句。'
  merge: -1
  img_proc: true
- pgno: 1393
  md: '所以，愤青们开始逃离鸟笼，甚至看见办公室就远远地躲开。“宁做笼外犬，不做笼里鸟。”愤青们说。


    # 俊杰


    愤青不过是愤青，识时务的俊杰们一下子从他们愤怒的表情中看出他们的未来———在自由经济大潮汹涌而来的今天，人文主义的愤怒只能当作边缘声音“仅供参考”。


    让愤青们自由职业去吧！如果办公室里都是鸟的话，那我也是鹰隼———俊杰向来是“时代的弄潮儿”，乘着经济全球化之风浪，俊杰们在办公室里扬帆远航，在其公司之帆上，“为了理想，将办公室政治进行到底”的旗帜高高飘扬。


    俊杰终归是俊杰，他们是这个社会的中流砥柱。经历过办公室政治的洗礼，胜出的他们头脑聪慧，人情练达，不仅专业技能精熟，领导能力也是高人一等。他们精力旺盛，心态健康。他们乐观开朗，坚定果断。他们心存梦想，脚踏实地。他们屡挫屡战，一往无前。如果是男性，俊杰们最好身体坚实，风流倜傥，硬度里不乏柔和；女性则曲线优美，面孔清'
  merge: -1
  img_proc: true
- pgno: 1394
  md: '丽，干练而不失温婉。


    ————天哪，连债青们也不禁乱刮情迷起来。但是，一想到办公室政治的副作用，债青们立刻打了个寒战——跟前的那张自信的阳光笑脸可信吗？光鲜的衣着下面，有几颗温润如玉的成熟之心被打磨出来？


    当领袖们的标准像在人们的厅堂里消失的时候，这些标准形象又接过接力棒，开始充当起人们的精神领袖，给人们一个奔头。但正如神情伟岸的领袖们没有几个像标准像那样值得景仰，当下的现实中能达到标准形象的俊杰也少之又少。


    办公室政治并非每个自认为是俊杰的人就玩得起的，当然也不是每个俊杰都玩得转的。资质稍差者，人们不仅担心其心理是否会变态，更直接的是关心其身体。善良的医生们像老太婆一样喋喋不休地提醒俊杰们————要注意身体，如果你不停地去洗手间，对异性或者提不起兴趣或者有心无力，或者记忆力减退，或者觉得那些新鲜事很没劲，或者老是莫名烦躁，或者睡眠质量持续下降————医生们告诉俊杰，这个时候你最好亲自保留自己的理想，暂时退出笼子里的游戏。


    债青们还在笼外逡巡畏义，三分之一的俊杰遍体鳞伤地被担'
