  md: '一，知识分子有这一缺陷，焉能成功？


    四，知识分子大多不够残忍，缺乏权术。中国的历史早已证明：成大事者，必须有“忍”的功夫，这“忍”字有两层含义：一是“忍耐”，也叫韬光养晦；二是“残忍”。不具备这两个素质者，绝难成功。君看越王勾践，把这两项功夫练到了绝顶：他在吴王夫差面前再三装孙子，为表“忠心”，甚至不惜品尝夫差的粪便；当取得成功以后，他不惜杀害建立大功且一直忠心耿耿的文种。其他如曹操、司马懿、武则天、朱元璋、朱棣、雍正、、、、、哪一个不具有心狠手辣的特点？反面的例子就是水泊梁山的头领白衣秀士王伦，这位老兄不想接纳晁盖、吴用等好汉，却又心慈手软，不忍对他们下手。结果吴用看出了问题，便煽风点火，利用林冲杀了王伦，这位王秀才只落得身首异


