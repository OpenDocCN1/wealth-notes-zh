  md: '皇后能侍奉他，对他好。先让她批阅文件，慢慢地参与了朝政，甚至逐渐地取代皇帝。对于反对她的大臣，则不论何人，一律杀灭。皇帝大舅长孙无忌、大臣褚遂良“踵死徙”，皇帝的侍臣上官仪被杀后，皇权就旁落到她的手里了。武则天就这样用尽心机，一步步蹬上了皇后的宝座，并坐得稳稳的。为了当皇后，她够残酷了吧？


