  md: '到了时机成熟、有隙可乘之时，才一下子以闪电手段，把他结束了，这就是“扮猪吃虎”的妙用。所谓“扮猪”，即孙子所说的“藏于九地之下”，“吃虎”是“动于九天之上”。


