  md: '是时，朝廷日乱，纲纪隳阯，膺独持风裁，以声名自高。士有被其容接者，名为登龙门。及遭党事，当考实膺等。案经三府，太尉陈蕃却之。曰：“今所考案，皆海内人誉，忧国忠公之臣。此等犹将十世宥也，岂有罪名不章而致收掠者乎？”不肯平署。帝愈怒，遂下膺等于黄门北寺狱。膺等颇引宦官子弟，宦官多惧，请帝以天时宜赦，于是大赦天下。膺免归乡里，居阳城山中，天下士大夫皆高尚其道，而污秽朝廷。


    及陈蕃免太尉，朝野属意于膺，荀爽恐其名高致祸，欲令屈节以全乱世，为书'
