- pgno: 1260
  md: '+   v我毕生印象最深刻的教授，是人文学老师，他是一位教导我们学习思考、活学的人，而经营管理也是一门活学。


    +   v我所谓的思考的步骤，就是观察、阅读、学习及思考。其中工作上的观察约占三分之二，工作以外观察占三分之一，而工作上的阅读占五分之一，公余之暇的阅读占五分之四。


    +   v学习是一连串观察加上阅读的结果。


