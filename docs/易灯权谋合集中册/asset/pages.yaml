- pgno: 716
  md: '获取权力。权谋与权术的关系，用个不恰当的比喻就好像是战略与战术的关系，权谋是高层次的，是对权力的策略、谋略，而权术是应用层面的，是具体的“战术”手段，具有技术性和技巧性。懂得权谋是帅才，会用权力是将才。权谋的实质是谋取权力，权术的本质是运用权力。能够把现有的权力用足用活，那是权术；现在没有或缺少某种权力，运用计谋或策略取得想要的权力，那是权谋。


