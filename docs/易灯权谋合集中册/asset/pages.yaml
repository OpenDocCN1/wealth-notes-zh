  md: '身兼朝廷 60 多要职，终其一生，怎样走上了这样的令人惊羡之路？


    我想，乾隆不会对其阿谀奸佞一无所知，否则不可能延续一个盛世。


    和珅有其过人之处，处世圆滑变通至极，懂得琢磨人心思，懂得理财，熟读圣贤书苦读官学，更重要的是善于抓住机会，也许这些是让和珅平补青云不可抹煞的优势，由于过分的贪财后人更多的忽略了他的过人之处，纪晓岚和和珅斗了一身，嘉庆年间和珅才被二十纵罪状刺死，所有答案我都只能想到一个词------制衡。


    乾隆也是人，他有他的七情六欲，他有他衷于的一些人和事，也免不了他也需要不同的角色来调剂人生这场戏，让他喜忧参半，让他经历那些跌宕起伏，总有那么一些场合适纪晓岚是刘墉救不了场的，总有那么一些境况是需要人家捧'
