- pgno: 119
  md: '实力的重要部分。


    # 3、步步为营，点点突破


    # **鼫鼠五技**


    宋江的权术，其为谋权，而不能尽人心；其为掌权，而不能立功名；其为固权，而不能循法治，最后的丧权也就是必然的了。权术的成功，取决于个人实力和上无私心，而宋江“文不能定国，武不能安邦”，兼具私心太重，想不做鼫鼠也难。


    有人说，宋江是个天才的领导，尤擅弄权，把梁山事业给发扬光大了。那么，有无值得商榷之处呢？其实仔细琢磨宋江的各种权术，有一个明显的感觉，就是成语“鼫鼠五技”。据说鼫鼠有五技，不算少了，我们有一技就足以安身立命，何况五技？但鼫鼠技能虽多，《劝学篇》却说：“五技者，能飞不能上屋，能缘不能穷木，能泅不能渡淢，能走不能绝人，能藏'
  merge: -1
  img_proc: true
- pgno: 120
  md: '不能覆身是也。”宋江的弄权，有点“鼱鼠”的意思。


    # 能飞不能上屋


    鲁智深、杨志、武松他们几个上梁山以后，似乎相互之间的话题只剩下喝酒、回忆过去，就连老大晁盖也是一样。书中就有林冲与鲁智深、杨志、武松一起聊上梁山之前的旧事，莫不感叹。大家每天这般吃饭喝酒恣意欢乐，能不能让梁山的事业长久地发展下去呢？是个问题。


    一个组织是否腾飞，关键看制度是否完善，目标是否正确，理念是否先进。很显然，梁山在晁盖主政时期，既没有制度，又没有目标，更谈不上什么理念。到了宋江时代，稍微有所进步，譬如宋江提出了“忠义”理念，设置了“替天行道”的目标，更进一步提出接受朝廷招安的目标等，只是没有建立一套完善的制度，这'
  merge: -1
  img_proc: true
- pgno: 121
  md: '是历史的局限，也是宋江个人的局限。


    但仔细思考，宋江的理念和目标又存在着致命的非科学性，一切都在围绕他的权术在设计。如“忠”，是指归顺官府，“义”是指大家要听宋江的话，“替天行道”是指无条件帮组织做事，这个理念和目标本身还是人治的表现，是文字化的人治，而不是以制度管人，或者说法制。貌似进步，可使众兄弟不再背负土匪强盗的骂名，其实还是半吊子，能飞不能上屋，无论宋江怎么努力，梁山事业注定没有未来。


    # 能缘不能穷木


    缘木，即爬树，在于手脚并用，互换而上。引申到权术层面，即着力点的“虚实互换”，把具体的说成概念的，把概念的说成具体的。比如“组织”这个概念，地球人都知道是指上级领导。说“组织”，肯定是虚，是偷换了上级领导这个“实”。互换虚实，实现权术目的，'
  merge: -1
  img_proc: true
- pgno: 122
  md: '宋江也擅长的。


    招安平辽后，很多人不满朝廷的封赏，张横，张顺，阮家三昆仲等个个抱怨，宋江通过一系列 的“虚实互换”实现了控制。看他的话：“俺是郓城小吏出身。又犯大罪，托赖你众弟兄
    扶持，尊我为头，今日得为臣子……”在这段话 里，朝廷是虚的，宋江是实的。本来众人的矛 盾是冲着朝廷来的，经宋江这么一互换概念，倒成了众人冲着他来的了，谁还好意思再发表
    什么不利于团结的言论？于是“众人听了宋江 之言，俱各垂泪设誓而散”，权术目的实现了。


    作为领导，勇于为所服务的“组织”担当，自 然是应该的，但赵炎想说的是，以宋徽宗为代 表的“组织”有没有把宋江当自己人呢？梁山 好汉们是否都心悦诚服了呢？前一个问题无
    需回答，三岁孩子都明白是咋回事，后一个问 题需要从“俱各垂泪设誓而散”这句话里找答'
  merge: -1
  img_proc: true
- pgno: 123
  md: '案。兄弟们只能靠垂泪发誓来维系服从了，还谈什么权术 “控制”？那个 “散” 字则明明白白地暗喻了梁山未来的结局。善于爬树，却不能爬到树的顶端， “能缘不能穷木”，又是个半吊子。


    # 能泗不能渡沫


    宋江不是文盲，子曰诗云啥的，他也会，体现在作重要讲话时，也还有些道理，起码不像其他好汉那样满口粗话。燕青在双林渡学射箭，有只大雁倒了霉，宋江就乘机进行了一番演讲。


    这篇讲话稿是宋江的即兴发言，不是秘书操刀，半文半白的，也不难读懂。他借大雁比喻众兄弟，有点水平；强调 “尊者在前，卑者在后，次序而飞，不越群伴” 的人治思想，有点深度；最后得出结论：
    “兄弟今后不可害此礼义之禽”，也即不能挑战我宋江作为领导的地'
  merge: -1
  img_proc: true
- pgno: 124
  md: '位，权术乃显。


    但有一句话我们也不能忽略，那就是“众人心内如何”？当时众人心内如何呢？书中明确写着大家都叫好喝采，民意基本是一边倒的，都站在燕青这边，怎么到了宋江嘴里反成众人不高兴了呢？


    联系到后来招安故事，梁山不愿接受招安的大有人在，说明宋江的权术，所起作用非常有限。


    正如他有文化而不能考中科举，有权谋而不能尽得人心一样，“能泗不能渡渎”，会游泳却不能渡过寻常的小水沟，半吊子罢了。


    # ## 能走不能绝人


    毋庸置疑的是，宋江是能干的，带兵打仗的事儿且不说，三打祝家庄、平辽、征方腊等等，原著的叙述都很详尽，我们单说他在发展梁山事业上的努力，所谓“求生存，而后图发展”，生存是个大前提，也即经济基础，经济基础决'
  merge: -1
  img_proc: true
- pgno: 125
  md: '定上层建筑嘛。


    梁山的发展一直面临一个困境：越发展壮大，

    经济来源就会越少。所以，宋江不得已采取了

    许多措施，一方面攻击附近的州县山寨，抢过

    路的客商、抢附近的富户，抢附近的地方政府；

    一方面延揽懂经济的人才，譬如三打祝家庄时

    极力游说李应入伙，李应就是一个会做生意的

    江湖人。宋江在李应身上是寄予厚望的，基本

    上是把李应看成是陶朱公了。


    如果李应上梁山后，能尽其所长，说不定梁山

    可成功转型为商业集团。到那个时候，就算不

    招安，也算出人头地，总比始终做强盗要好一

    些。可以说，请李应上梁山也是宋江具有长远

    眼光、并努力求发展的一个表现。但宋江的努

    力始终没有效果，这是为何呢？其实还是竆鼠

    之技，能走不能绝人，还属于半吊子。


    宋江的“能走不能绝人”，在对李应的使用上'
  merge: -1
  img_proc: true
- pgno: 126
  md: '也可见一斑，花了大力气请来了人家，却只安排人家做了敲算盘的会计，而不是发展顾问或设计师，身份排名也只在天罡星之列，令人大跌眼镜。


    # 能藏不能覆身


    水浒传六十七回中，李逵到韩伯龙开的酒店里白吃白喝，二人起了争执，李逵杀了韩伯龙。


    原来韩伯龙曾在江湖上打家劫舍，要来上梁山泊入伙，却投奔了旱地忽律朱贵，要他引见宋江。因是宋公明生发背疮，在寨中又调兵遣将，多忙少闲，不曾见得，朱贵权且教他在村中卖酒，却死在李逵之手。


    紧接着又发生了一件事，还是跟李逵有关。李逵遇到焦挺，对焦挺说：“你有这等本事，如何不来投奔俺哥哥宋公明？”焦挺道：“我多时要投奔大寨入伙，却没条门路。今日得遇兄长，愿随哥哥。”'
  merge: -1
  img_proc: true
- pgno: 127
  md: '两件事做个对照，你发现了什么？显然作者在暗示我们一个道理：一朝天子一朝臣。李逵一句话就决定了一个人事安排，而朱贵是梁山的元老级人物，和王伦是一辈的，到宋江起码是三朝元老，却安排不了一个韩伯龙，对比是多么的鲜明。


    新领导上台，换一批中层干部，换一批下层干部，这个规律在梁山也是有的。比如晁盖上位，王伦的老部下就不怎么吃香，宋江任事，晁盖的那几个人就不怎么好混，尤其是在晁盖死后，宋江的手段甚是高明，不着痕迹而大换血，从排座次上可见端倪，正应了一个“藏”字。


    但明眼人还是能从李逵的两个故事里找到蛛丝马迹：跟的是哪个人，站的是哪个队，决定了什么样的出路。由此观之，韩伯龙倒也死得不冤。


    宋江确实在“藏”，比如常把吴用当作挡箭牌'
