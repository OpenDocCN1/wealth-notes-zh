  md: '心情。


    做官也一样，有明显的高下之分。老子在《道德经》中把做官者分为四种类型：“太上，下知有之；其次亲誉之；其次畏之；其下侮之。老子：《道德经》，第十七章。”认为最高明的掌权人，百姓只感觉到他的存在；其次，百姓亲近而歌颂他；再次的，百姓畏惧他；更其次的，百姓轻蔑他。让百姓感觉不到自己在被领导，而什么事情就都做好了，这是最高明的领导者。这样的领导者，不轻易发号施令。功业建立了，事情成功了，人们感觉不出这是他努力、安排、运作的结果，却说是我们自己顺乎自然。老子推崇的是“无为而无不为”，无为并不是什么事情都不做，而是顺着人性和自然的规律去行动，做最少的事情却达到最好的政治效果。而不是政令繁杂、人为生事，让下'
