  md: '置身的环境和社交网络有很大的关系，换句话说就是你牛不牛逼不要紧，只要背后支持你的那个人牛逼就可以，所以自古以来就有宰相门前七品官的说法，换在我们如今就有了我爸是李刚、我爸是双江，遇事不用慌的隐权力，所以职场中、官场中很多人都致力于钻营、致力于攀附，结交各种各样的权贵，形成权力同盟，以求获得权利的庇护，而庇护人通过拉拢人心、谋取为个人效忠以获得权利的拥护拓展，最后实现个人谋取利益最大化。


    # 二，规则的隐权力。


    规则隐权力来自政治不同势力范围的摩擦，他的权值取决于个人在政治网络中所处的地位，你的地位越高则这个规则带来的隐权力越大，所以官场很多人就一件事情喜欢看领导的表态，领导喜欢看的事情就多干，不喜欢看的事情就不做，他们做的一切都是从领导喜好的角度出发，目的就是为了获得上级的青睐，要知道很多事情这样解释也可以，那样'
