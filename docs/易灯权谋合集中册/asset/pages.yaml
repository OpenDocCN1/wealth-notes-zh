  md: '立公孙无知为皇帝。公孙无知乃齐僖公的侄子，因为当时齐僖公比较喜欢他，给了他以太子一样的待遇。到了齐襄公即位，便取消了无知的特殊待遇。无知因此暗恨齐襄公，后来连称、管至父谋反，便与公孙无知串通一气，又加连妃做内应，便将齐襄公杀了。公孙无知即位后，由于管理国家事务一窍不通，真是人如其名。加上连称、管至父又都是武将，古人云：“文能治国，武能安邦”。连管二将本是定国安邦大臣，面对治国的确有些为难。又兼无知毫不通晓政治，本来朝廷内就人心不服，结果越搞越乱，终于激起大臣们的不满，被大臣雍廪（音līn）人杀了。公孙无知死后，大臣就商议拥立新君。齐襄公无子，只有两个弟弟，一个在鲁，即公子纠；一个在莒，即公子小白。大臣们商议已定，决定迎公子纠入齐即位。


