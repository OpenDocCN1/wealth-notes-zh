- pgno: 640
  md: '绽。如图西川时，虽众人面前吃肉撒腥，\n\n但很快露出庐山真面目，硬是把同族兄\n\n弟刘璋拿下。至于五十多岁，又娶人家\n\n十七、八黄花闺女，也并非是一张脸皮\n\n所能办到的。


    譬如袁绍，虽有雄兵百万，谋士如云，\n\n然因只有一张脸皮，故非但不能一统天\n\n下，反以强败弱。于是“官渡一战”，便\n\n刹时元气失尽，不仅没那“来年再战”的\n\n勇气，反悲愤之中与世长辞了。所以，\n\n干大事者，万不可只有一张脸皮。不然\n\n非但事业不成，且一旦失败，又势必气\n\n出绝症。想那干大事之人，原本走的就'
