  md: '# 历史背景


    御史曹锡宝劾和珅家奴刘全奢僭，造屋逾制，帝察其欲劾和珅，不敢明言，故以家人为由。命王大臣会同都察院传问锡宝，使直陈和珅私弊，卒不能指实。和珅亦预使刘全毁屋更造，察勘不得直，锡宝因获谴。逾月，授和珅文华殿大学士。诏以其管崇文门监督已阅八年，大学士不宜兼栈务，且锡宝劾其家人，未必不因此，遂罢其监督。


    # 《清史稿•卷三百十九•列传一百六》


    乾隆上谕《夏季档》中也记载了这件事。御史曹锡宝本想先参劾和珅的家人刘全，从中打开缺口，攻一攻和珅。但曹锡宝做事不慎，他将奏折稿子拿给他的老乡吴省钦过目，没想到吴省钦是和珅的老师、亲信。吴省钦连夜派人赶赴热河向和珅告密，和珅知道后，在乾隆跟前吹了风，仅仅隔了一个月，乾隆《秋季档》中就记载了这件事的查办结果，'
