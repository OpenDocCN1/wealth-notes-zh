  md: '是不太可能发生。因为几乎老板需要的都是能帮忙他/她降低风险的人，一个人若能把事情都想的周到、看得远、顾虑的清晰，他的重要性其实只会增加不会减少。职位常常只是一个过程，尤其当你日后回头看时，更会发现没有什么职位你是需要小心保护着的。因为越准备充分，越容易能往前走；越能往前走，空间只会越大、能学到更多的东西、能做更多的事情。所以透明、以及预想日后的接班反而是让自己更好、而非挖洞害自己。


    不过我也坦承。虽然以上我讲的都是真的，但恐怕不是这么容易能够被理解的概念就是。。。。


