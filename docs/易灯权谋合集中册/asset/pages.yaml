  md: '给了魏忠贤处理，给他创造了排斥异己，专权误国的机会。而熹宗对于朝廷的腐败、国家的动荡却耳无所闻，目无所见。可叹他虽是一名出色的工匠，却是一位使大明王朝摇摇欲坠的失败之君。


