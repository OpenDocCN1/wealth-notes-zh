  md: '之。羊鹗就是一个典型，他是魏晋时代有名的酷吏，让两百多百姓变成了冤死鬼，如果按照“杀人偿命”的原则，他应该判两百次死刑，所以连皇帝都觉得不杀羊鹗不足以平民愤。于是打算破除“八议”惯例，赐羊鹗死，就在这时，说客行动起来了，先是羊鹗的侄儿和侄女亲自和晋帝说情，然后是王导亲自出马，终于使晋明帝软下心来。


