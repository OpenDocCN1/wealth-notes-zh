  img_proc: true
- pgno: 556
  md: '人生有五业：学业、就业、职业、创业、事业。所谓“建功立业”，就是指拥有和成就自己的事业。拥有财势，权势的人，不一定有自己的事业，他完全有可能是位所谓的“打工皇帝”，或者政府公务员，这些，不过是他的“职业”而已。拥有声势的人，也不一定非要有自己的事业，或者财与权，他或许注定就是位清贫的学者，如果不懂得“借势”转化的话。


    但是，要追求和建立事业的人，却不得不在财势、权势、声势中左右纵横，把握互用。哪怕你的事业，卑微得仅仅是摆在路边的简易大排挡，你也得有相对的“财势”做基础，投入所必需的固定资产、流动资金，你还得积极主动的与“权势”建立关系，无论是工商城管还是黑道小混混的“保护费”，为了事业的长续经营，你得做个明白人。当然，即使你做好了这两点，面对四周并起的竞争对手，你还得有意'
  merge: -1
  img_proc: true
- pgno: 557
  md: '识的宣传和传播，哪怕是简单得仅仅动用你的口或媒子的口去告诉身边有限的人，你得制造这种“声势”。


    “没事找事”是不对的，很有可能，你找来的更是让你更加头疼的麻烦事。为什么会有相当多的人都倒在了“创业”的路上，根本成就不了心中神圣的事业梦想。


    在迈向成功的路上，你首先需要的是，重新认清自己、调整思路、看清形势，才能步步为赢。


    如果你只想平平顺顺，默默无闻一生，你只要做到“懂事”就行，把该做的事情做好就足够啦。


    如果你不想仅仅平平顺顺、默默无闻一生，还希望有一番大作为，不枉来到人世一遭，那么，“没事找势”的道理，你一定要懂！


    成功一定有方法，但是这个方法，并不是书本上的知识可以告诉你的，当我们捧起书本的时候，著书人的那个时代，


    558'
  merge: -1
  img_proc: true
- pgno: 558
  md: '已经流逝了。成功也不是那些自我标榜为成功学激励大师们的一些空洞陈乏的口号可以改变你的，尽管我们不否认多多少少还是略有一些改善。


    不过那些成功学激励大师们，还是有值得我们学习的地方，那就是他们造势兴势的本领，这，往往是我们忽略的。我们往往只会被他们的表面激情所感染、迷惑。


    大师们当然不肯教会你，他是怎么在你身上找到成功者的感觉的。


    正所谓：妙，不可言！


    什么叫成功？成功就是差一点点就失败了，所以自古有名言：失败是成功之母！


    很多人熬不过这个关口，或者看不透这个“成败”转换的本质。所以，只仅仅见到了成功的“老妈”，却让成功“胎死腹中”了。


    559'
  merge: -1
  img_proc: true
- pgno: 559
  md: '为什么会失败呢？判断失误，没有“审时度势”；运气不佳，是为“时势未到”；孤掌难鸣，是为“势单力薄”；弱势强攻，最终“势成骑虎”……


    # 期望借隐居而博取功名的李白


    时不至则运不开，此时不可力行。必须懂得韬光养势，积蓄势能，四方聚合，暗造声势。就像唐朝的卢藏用，一心想要在朝廷求取功名入于仕途，却一直不得志，后来“逆转乾坤”、改变策略，巧借地势，隐居终南山，人为的进行炒作包装，制造出一个“隐士”的声势出来。如此这般之下，居然吸引了大批的达官贵人，最后“攀龙附凤”，得到朝廷的任用，开创了一条快速成就强势的“终南捷径”出来。


    后来，号称诗仙的李白也依将此策略“移花接木”运用起来，好好炒作了一番，同样为朝廷所召，激动之情溢于言表，留下了“仰天大笑出门去，我辈岂是蓬蒿人”的千古名'
  merge: -1
  img_proc: true
- pgno: 560
  md: '篇。内心真实的策划目的全然暴露，一点不在乎世人对其“故作姿态”的看法。


    人生在世，富贵功名也好，成败得失也罢，看穿了，不过是一场游戏，千万别太较真。


    如果你想在“多、快、好、省”的原则下实现成功，达到和拥有自己理想状态的事业，你就必须学会和遵循这种“谋势”的策略，或者叫游戏规则。


    如果你拒绝这种游戏，哪怕你再有才能，恐怕连汤都喝不上。


    “没事找势”，成败之要，在乎一势，运用之妙，存乎一心！'
  merge: -1
  img_proc: true
- pgno: 561
  md: '# ## 企业文化势学


    一个企业经营无非两个任务：战略和文化。战略指明方向，制定策略，指导方法，规定战术。战略是刚性的，明确的，条文化的，侧重于力的作用。正是因为战略这些特性，使其具有一些先天的不足。一是不能随机应变地适应实际情况变化，二是容易给人钻空子找纰漏。一些别有用心的人，总是上有政策下有对策。战略擅长于管事，但不擅长于管人。人是企业中最活跃的因素。要真正把管好，必须采用文化管理。


    企业文化就是一种管人的手段。企业文化与战略不同，不是通过具体条文规定，要求员工怎么说怎么做，而是营造一种氛围，激励和引导员工朝着正确结果前进。人往高处走，水往低处流，这就是企业文化所营造的氛围。在这种氛围之下，不管员工具体如何言行，都是朝着积极向上的结果努力。'
  merge: -1
  img_proc: true
- pgno: 562
  md: '这种氛围之势，是无法具体明确事先规定的。


    孙子兵法里也说：此兵家之胜，不可先传也。孙子兵法重在谋势，就是营造一种有利态势，使战争局势无论如何变化，都朝着胜利的结果前进。


    企业文化的目的，也就是营造一种有利态势，使员工言行无论如何复杂，都朝着正确的结果前进。这就是孙子兵法与企业文化一个根本相通之处，也就是两者都是为了谋势。


    企业文化管理，就是侧重于势的功能。在势的作用下，力可以发挥更大作用。相反，如果失去势的协助，力的作用就会大大减弱。


    孙子兵法说：激水之疾，至于漂石者，势也。可见，即使水这样柔弱无力的东西，在势的作用下，也可以产生巨大的力量。良好的企业文化也一样，可以使最一般的员工，'
  merge: -1
  img_proc: true
- pgno: 563
  md: '发挥超乎想象的能力。


    而不良的企业文化，即使个人能力再强，也很难发挥应有的价值。在对员工和干部管理上，更是求力不如谋势。


    孙子兵法说：故善战者，求之于势，不责于人，故能择人而任势。良好的企业文化，一方面要充分教育培训员工，一方面要充分发挥员工现有的能力，有什么人就用什么人，并且想方设法用好，而不是一味求全责备员工的这个力那个力。一个人的能力，不是几次培训就可以快速提升的。


    所谓领导力，执行力，组织力，营销力等等，都是一种不切实际的幻想。事实也证明，很多老板都哀叹，花费了大量资金时间搞得这些快餐式培训，根本没有起到什么实际效果。培训之前什么样，培训之后还是什么样。这是理论界培训界对企业的极大误导。'
  merge: -1
  img_proc: true
- pgno: 564
  md: '企业文化又是通过什么机制来谋势的呢？这方面正是孙子兵法的高明之处。通过比较两者之间的作用原理，可以发现企业文化是通过六种机制来谋势的，而孙子兵法与其具有惊人的相通之处。


    这六种机制就是：动力机制，引导机制，保障机制，评价机制，学习机制，创新机制。孙子兵法不是通过一般泛泛而谈的论述，如同《论语》《道德经》那样，读起来貌似有理却不得要领。孙子兵法既是世界观，又是方法论，是道法术在谋势上的统一。


    谋势首先是要解决一个最基础的问题——企业和员工的心态问题。端正员工心态，改造文化土壤，让员工明白赏罚两手的存在。有了这种对赏罚的敬畏心态，以后谋势才有了最基本条件。


    > 孙子兵法开篇也说：**兵者，国之大事，死生之地，存亡**'
  merge: -1
  img_proc: true
- pgno: 565
  md: '之道，不可不察也。一个军事统帅，如果根本不重视谋势，兵法学得再多也无意义。企业管理者如果不重视谋势，不重视企业文化，学再多的企业管理知识也没有什么价值。员工对赏罚没有敬畏心态，再多的规定和说教都发挥不了什么作用。


    民不畏死，奈何以死惧之？孙子在说明自己的兵法之前，就通过训练宫女实例，说明了什么是造势之要。孙子将两位担任队长的宠姬斩首示众，让宫女们知道了什么是赏罚分明。孙子正是首先端正了心态，改造了土壤，才使得军令得以畅通施行，将一支宫女组成的乌合之众，训练成可以赴汤蹈火的军队。企业文化建设也一样，没有良好的心态土壤，其他的一切努力都是白费功夫。


    在讨论谋势的机制之前，先要明确谋势必须具备的条件和资源。孙子兵法说：一曰道，二曰天，三曰地，四曰将，'
  merge: -1
  img_proc: true
- pgno: 566
  md: '**五曰法。**这就是孙子兵法谋势的条件和资源。


    企业文化谋势，也需要相应的条件和资源。第一是思想政治作工作，第二是工作生活条件，第三是人际关系网络，第四是人才队伍建设，第五是法律规章制度。


    简单说，首先是教育培训-以理服人，其次是福利待遇-以利诱人，再次是集体影响-以礼待人，再次是相互竞争-以例示人，最后是赏罚分明-以力制人。谋势必须要有手段，否则造势就是空穴来风无中相生。企业文化谋势，就是充分而巧妙地运用这五种手段，营造一种有利于员工朝着正确结果前进的必然态势。


    **一、动力机制。孙子兵法说：道者，令民与上同意也。又说：上下同欲者胜。**同意的 基础前提是同利，只有大家最大限度形成利益共识，才能让观众员工与老板同生死共。然而，很多企业都有意无意地忽略了这个基础前提。只要求员'
  merge: -1
  img_proc: true
- pgno: 567
  md: '工与自己同意，却不愿意与员工一起同利。在福利待遇上，不是善待自己的员工，而是刻薄寡恩斤斤计较。有话说的好：你给员工吃草，你将迎来一群羊；你给员工吃肉，你将迎来一群狼。不善待自己的员工，最终得到报应的还是企业自己。不善待自己的员工，企业文化在动力机制上就明显不足，总体上就无法形成有利态势。


    二、引导机制。孙子兵法说：故兵贵胜，不贵久。又说，故兵闻拙速，未睹巧之久也。战争一切为了胜利，不在乎具体招式如何。合于利而动，不合于利而止。企业文化也一样，应该营造一种务实的氛围，一切为了实际的效益，一切为了解决实际问题。华为的文化就提倡，决不让雷锋吃亏。正是这种正确的导向，才造就了华为狼性气质。


    现在很多企业文化则恰恰相反，追求一种表面上的奢华炫丽，而不是追求务实高效。在这种氛围之下，各种溜须拍'
  merge: -1
  img_proc: true
- pgno: 568
  md: '马，弄巧耍滑的人大行其道，而默默无闻，努力踏实的人得不到好处。错误的导向必然导致灾难性的结果。


    三、保障机制。孙子兵法说：故令之以文，齐之以武。又说：凡治众如治寡，分数是也；斗众如斗寡，形名是也。合理的组织体制和规章制度，是确保军队战斗力的关键。企业文化也要有相应的组织体制和规章制度来保障。企业文化自身更需要相应的组织机构和管理机制。如设立企业战略文化委员会，设立执行与督导双轨机制，发扬企业民主，规范言行礼仪等等。很多企业的企业文化机构设置，都是严重边缘化底层化的。如随便设立在人力资源部，信息资料室，市场营销部等，与企业战略和品牌管理严重脱节。这样就严重限制了企业文化在谋势方面的作用价值。


    四、评价机制。孙子兵法说：将者，智，信，仁，勇，严也。全书中对将士有多处论述。如将有五危：必死，必生，'
  merge: -1
  img_proc: true
- pgno: 569
  md: '忿速，廉洁，爱民。正确而公正的评价机制，是引导人才发展和行为的坐标系统。企业文化就是企业的精神坐标，没有这个坐标，或者坐标歪曲错位，都会误导员工的成长和行动。


    俗话说，上有所好下必甚焉，上梁不正下梁歪。企业老板自己首先要确立正确的坐标系，给员工一种积极向上的示范效应。没有哪个企业老板个人德行低劣，而企业文化却高尚卓越的。


    五、学习机制。孙子兵法特别强调知的重要性。书中多次出现：不可不察也。这就要求将帅经常学习研究，做知兵之将，知三军之事，学知胜之道。要知彼知己，百战不殆。要知战之地，知战之日，知得失之计，知九变之术，知诸侯之谋，知用兵之利害。知彼知己，胜乃不殆，知天知地，胜乃不穷。知之者胜，不知者不胜。吾以此知胜负矣。孙子兵法也非常间谍情报的巨大价值，成功出于众者，先知也。通


    570'
  merge: -1
  img_proc: true
- pgno: 570
  md: '过学习研究获取信息，可以获得相对于敌人的不对称优势。企业文化也一样，通过加强学习研究，也可以使员工产生相对于竞争对手的不对称优势。


    六、创新机制。孙子兵法有句名言：将在外，君命有所不受。这就要求将帅要结合实际敢于创新。孙子兵法通篇贯彻一种活学活用的思想。如：劳者，因利而制权也。又如：兵者，诡道也。凡战者，以正合，以奇胜。奇正之变，不可胜穷也。兵无常势，水无常形。兵以诈立。要通九变之利，知九变之术。要根据天时地利人和条件，灵活机动采取战略战术。孙子兵法专门写了一篇火攻，其实就是要善于借助当时局势条件灵活创新。相对于固步自封的保守态度，灵活创新本身就是一种优势。企业文化就是要创造一种鼓励创新的氛围，营造相对于竞争对手的优势。


    企业文化是一种活的机制。孙子兵法也特别强调一个活字。


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_570_0.png)'
  merge: -1
  img_proc: true
- pgno: 571
  md: 活，就是掌握主动权和主导权。首先是要庙算。多算胜，少算不胜。这是掌握主动权主导权的根本之道。先为不可胜，以待敌之可胜。把自己先立于不败之地，就有了战胜敌人的最可靠保障。攻其所必救，守其所不攻。胜兵先胜而后求战，败兵先战而后求胜。故善战者，致人而不至于人。面对强大的敌人，要先夺其所爱，则听矣。企业文化也要善于掌握主动权主导权。只要抓住人们喜荣恶辱趋利避害的心理，牢牢把握赏罚两个基本手段，就能始终处于主动主导地位。每个人都有自己的人性弱点，也有自己所不能割舍的最爱。这就是治人的命门。上可以使其尽享荣华富贵，下可以置其于死地而后生，中间有利益共识拴住身心。在这种有利态势下，没有哪个员工会不在掌控之中。战争中掌握主动权主导权就是最大的优势，失去主动权主导权就是最大的失势。企业文化也是企业最能发挥主动权主导权的最大优势。一个企业，
  merge: -1
  img_proc: true
- pgno: 572
  md: '其硬件条件和周边环境经常是不由自主的，而唯有人才队伍才是自己最可靠的保障。企业文化通过对人的塑造，建立起一支能征善战的核心团队，打造起一个卓越优秀的企业文化，就具备了自已独特而无法超越的竞争优势。企业文化通过治气，治心，治变，以达到最终治力的效果。没有企业文化的企业，也就失去了自已最可依赖的优势。


    孙子兵法说：不战而屈人之兵，善之善者也。企业经营优势，集中体现为品牌。而企业文化，则是品牌最强有力的支撑。品牌是企业文化大树上最美丽的花朵。有了品牌，企业就可以避免价格战，促销战，渠道战，广告战等低端竞争，也可以吸引更好的人才和市场资源，获取市场营销上的巨大优势地位。企业谋势就是谋品牌，谋机制，谋主动权主导权。


    一句话，就是谋企业文化。没有企业文化，是不可能产生好品牌的。品牌之道，就是企业文化。企业文化就是企业


    573'
  merge: -1
  img_proc: true
- pgno: 573
  md: '最响亮的品牌。只有深厚而卓越的企业文化，才是品牌优势的持久保障。


    孙子兵法说：善用兵者，携手若使一人，不得已也。企业善于管人用人，也是因为善于利用上述五种手段（理，利，礼，例，力），营造了员工不得不团结顺从的有利态势。一个企业，聘请、空降、拥有和培养卓越人才固然重要，而营造有利态势，让人才能尽其所能，正常或超常发挥更重要。相比而言，前者来得直接快捷；后者来得稳健恒久。企业是求力还是谋势，要根据具体情况。最好是两者兼行，不可偏废。力与势之间，是可以相互转化的。有力才有权，有权更有效。总体而言，求力不如谋势。因为求力的主动权主导权在人，而谋势的主动权主导权在自己。经验证明，求力往往是欲速则不达；而谋势是慢工出细活，磨刀不误砍柴工。人都有习惯懒惰的天性，就像战争中士卒都有贪生怕死逃避'
  merge: -1
  img_proc: true
- pgno: 574
  md: 畏战心理一样。自力而作不如顺势而为。不要过多把希望寄托在员工自觉自愿之上，应该努力创造一种必然之势，必胜之势。这就是孙子兵法对企业文化最大的启示。
