  md: '# 从身边人下手


    和珅这次反贪，主要经验是反贪要选准突破口。他选的突破口是深知内情的仆人。撬开了仆人的嘴，掌握了大量线索和证据，然后扩大战果，查办对象就难以守住自己的防线。


    和珅的“反腐高招”告诉我们，一个官员若贪腐，是瞒不过身边人的。不法的事，他不便直接出面去做，常常要借身边人之手。这样，他做的见不得人的事，便为身边人所掌握。一般情况下，身边人会为他保守秘密;然而，当身边人受到审查时，为自保，会供出所掌握的主子的情况。所以，撬开家奴的嘴，是彻查贪官罪行的好办法。


