  md: '# 历史背景


    四十五年，云南粮储道海宁讦侍尧贪纵营私状，命尚书和珅、侍郎喀宁阿按治。侍尧自承得道府以下馈赂，不讳，上震怒，谕曰：“侍尧身为大学士，历任总督，负恩婪索，朕梦想所不到！”夺官，逮诣京师。和珅等奏拟斩监候，夺爵以授其弟奉尧。又下大学士九卿议，改斩决，上心欲宽之，复下各省督抚议。各督抚多请照初议定罪，独江苏巡抚闵鹗元迎上意，奏：“侍尧历任封疆，千力有为。请用议勤议能之例，宽其一线。”上乃下诏，谓：“罪疑惟轻，朕不为已甚。”改斩监候。


    # 《清史稿·卷三百二十三·列传一百十》


    有史家举要清朝三大悬赏大案，一是甘肃布政使王亶望折冒冒赈案，二是云贵总督李侍尧贪纵营私案，三是嘉庆帝立诛和珅案。这三个大贪案均发生在乾隆朝，王亶望后来被


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_468_0.png)'
  merge: -1
