- pgno: 85
  md: '被上司用此手段“捕获”的下属，大都属于廉价“猎物”。他们自身素质一般都有毛病，有的甚至有严重的品德缺陷。他们为了满足私欲，不惜以身试法，结果铸成大错，被居心叵测的领导者乘机抓住把柄，牢牢控制在自已手里。从此，他们失去了人格尊严，失去了人身自由，只得死心踏地替主子卖命。在日常生活中，此类例子不胜枚举，例如：


    ——某出纳员贪污公款，领导当场查获。在个别谈话时，该出纳员痛哭流涕，苦苦哀求领导不要将此事宣扬出去，她情愿今后“一心一意”为领导者效劳。该领导假装“答应”了她的要求。从此以后，该领导者就抓住她的把柄，将她牢牢控制在自已手里。


    ——某下属在工作中犯了严重的过失，领导者让他写了一份深刻的检查，然后对他说：你今后只要“好好干”，我就将这份检查还你，保'
