  md: '人才观已经超越历史，具有未来意识。


    ……


    “如今，国君沉湎于阿谀谗媚的言词之中，牵制于姬妾近侍的包围之下，使卓异超群的士人，混同于骏马和老牛同槽。这就是鲍焦为什么对世道忿懑不平，对富贵毫不留恋的原因啊。我听说庄重严整上朝的人，不会贪图利禄而玷污道义；追求名誉的人，不会放纵私欲败坏自己的品行。因此，县名叫作“胜母”而曾子就不进去；城县的名字叫“朝歌”而墨子就回车离去。如今，让抱负远大的人，被威重的权势所震惺，被高位大势所压抑，那么有志之士就会老死在岩穴之中了，怎么肯竭尽忠诚信义追随大王呢！”


