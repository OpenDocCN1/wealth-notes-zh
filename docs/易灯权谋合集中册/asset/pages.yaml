  md: '归谬法。


    听到这里樗里子如梦方醒，问胡衍：“那我怎 么办？”胡衍说：“公释蒲勿攻，我试试为你 入卫谈谈这件事，就说秦国一向是有德于卫君 的（要卫国不并入魏国）。"


