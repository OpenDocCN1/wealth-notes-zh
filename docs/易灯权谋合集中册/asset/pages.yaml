- pgno: 516
  md: '# **第一节；定位**


    我们用 “我能做到什么” 来判断和定位自己，而别人用 “你已经做过什么” 来判断和定位你。


    这个世界上最难的事情莫过于认识你自己。


    其实很多时候你都不清楚自己真正的位置。因为对自己的定位不准，基于这个定位而希望达到的很多目标便很难得以实现。比如一个人本来就五音不全，却想要当一名歌唱家，这当然非常困难。


    可见，自我奋斗是有前提的，这个前提就是有一个准确合理的自我定位。'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# 历史案例


    韩信年轻时，家里很穷，经常吃蹭饭。有很多妇女在河边漂洗丝纱，有位老大娘看见韩信饿了，就匀出自己的饭给韩信吃。韩信感激地对这位老大娘说："达志以后，一定要重重地报答您老人家！"谁知这位老人非常生气："你作为男子汉，居然不能养活自己！我是看着你可怜才给你饭吃的，谁指望你报答啊？"就是这位养活不了自己的韩信，却有着杰出的军事才能，"韩信将兵，多多益善"，找对了处所，就是一个将军。找不对处所，就是一个流浪汉。


    中国古代的皇帝拥有至高无上的权威和享用不尽的荣华富贵，但皇帝的身份却紧紧地束缚着他们的一言一行，使他们无法像平民般无拘无束的生活，更不能发挥自己的特长，去做自己真正喜欢的事情。明熹宗朱由校就是位这样的天子。如果不是生在帝王之家，他肯定会成为一个出色的'
  merge: -1
  img_proc: true
- pgno: 518
  md: '木匠。


    熹宗朱由校在明朝乃至中国历朝历代的帝王中都算得上是一个很有特色的皇帝。他心灵手巧，特别是在制造木器方面有极高的天赋，举凡刀锯斧凿、丹青揉漆之类的木匠活，他都曾经亲手操作过。他手工制作的床榻、梳妆匣、漆器等，均饰以五彩，做工精细，美轮美奂。史书上有记载称：明天启年间，民间匠人所造的木床，需十几人合力才能费力移动，不仅粗笨费料，样式也板单调普通。熹宗有感于此，开始琢磨改进床的样式。他亲自设计图样，锯木钉板，花了一年多的工夫造出了一张与众不同的床。这张床不仅床板可以折叠，方便携带移动，还在床架上雕镂了各种花纹，既实用又美观，当时的工匠无为主叹服。明熹宗还善于做木制的小玩具，他做的小木人，不仅能够区分男女老少，且四肢动作、五官神态无不具备，惟妙惟肖，堪称一绝。熹宗不时派内监'
  merge: -1
  img_proc: true
- pgno: 519
  md: '将自己做的木器拿到市面上出售，见者无不以重价购买。熹宗听闻更加高兴，往往不休不眠地工作到下半夜，还常令身边太监做他的助手。


    对于漆工活，熹宗也很是在行。从配料到上漆，他都喜欢自己动手，并且时常推陈出新，让身旁的太监们欣赏评论他创造的新式样。


    这位酷爱木匠活的皇帝还有一大爱好，就是喜欢看傀儡戏。当时的梨园弟子用轻木雕刻成海外四夷、蛮山仙圣及将军士卒等人形形象，用以表演各样的戏文。熹宗情绪高时，也会施展自己的手艺亲自制作傀儡。他做的木像男女长幼不一，高约二尺，有双臂但无腿足，均以五色油漆勾勒眼眉表情，彩画如生。每个小木人均在下面的平底处安一个卯，用长三尺有余的竹板支撑着。为了上演水傀儡的戏码，熹宗还专门制作了戏台。这是一个用大木头凿钉成的长宽各一丈见方的'
  merge: -1
  img_proc: true
- pgno: 520
  md: '水池，里面添水七分满，池内养有虾蟹、活鱼之类的海货。用凳子将小方池支起，再用纱在周围围成屏幕，以竹板在围屏下游移转动。屏幕后面，有艺人随剧情将不同小木用竹片托浮于水面之上，游斗玩耍。傀儡戏上演之时，宫内每每鼓声喧天。当时宫中最常演出的剧目包括《八仙过海》、《东方朔偷桃》、《孙行者大闹龙宫》、《三保太监下西洋》等，均是装束新奇，扮演巧妙，活灵活现。熹宗做傀儡做得如醉如痴，看戏时更是如醉如痴。


    除木工活外，熹宗还醉心于建筑。他曾在庭院中自己制作了一座仿乾清宫样式的小宫殿，高不过三四尺，微妙曲折，巧夺天工。他还曾以沉香为假山一座，池台林馆俱有，无不雕琢细致，堪称当时一绝。熹宗喜欢蹴鞠，常与太监一起踢球，他觉着在长乐宫玩起来不过瘾，就亲自设计建造了五所蹴园堂。'
