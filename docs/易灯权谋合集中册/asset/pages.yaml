  md: '# 玩权术者终被权术玩弄


    人总难忍受繁华过后的落寞，因为习惯了高处的风光，一旦走下权利的高台总是难以抑制心头的失落，况且，人走茶凉的现实有时残酷地让人胆战心惊。如今，病榻上的大唐权相李林甫便是如此心情。


    玩弄权术所向披靡的一代奸相掌控朝权数十年，最后败在了裙宠乱臣杨国忠的手里。病情沉重的李林甫已然意识到自己已经走到了生命的终点，他如今最为担心的便是家人的安危，数十年翻手为云覆手为雨，好人坏人不知害了多少，仇家遍天下，一朝失势，结局可想而知。


    此时，在朝权争夺战中荣获全胜的杨国忠假惺惺地来到了李府探病，李林甫老泪纵横，苦苦哀求：“我死后我们李府的家眷就要拜托你照'
