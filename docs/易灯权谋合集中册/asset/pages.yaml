    # 管理学的三种权谋


    周文王慌忙扔下手中的弓箭，向老头表示敬意，说：“老先生，我是一个国王，我要管理一个国家。你能否告诉我，怎样才能找到管理的正道呢？”


    姜子牙说：“我听说是人可以分为君子和小人两种类型。君子喜欢琢磨人生的意义，小人喜欢琢磨做事的技巧。我现在就是这样，对于能否钓到鱼并不关心，而是希望通过钓鱼这件事，来感悟生命的大智慧。虽然我现在是一个普通的老百姓，你是雄踞西方的国王，但我们都需要理解自己的人生，所以，请你向我学习吧！”


    周文王问：“你究竟感悟到了什么呢？”


    姜子牙说：“我觉得钓鱼这件事，体现了管理学的三种权谋。第一种权谋，利用鱼饵钓鱼，就好比利用薪水招纳人才。第二种权谋，在芳香的鱼饵诱惑下，往往有鱼儿前来送'
