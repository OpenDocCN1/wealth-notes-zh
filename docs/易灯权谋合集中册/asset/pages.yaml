  md: '# 七招从办公室政治中取胜


    办公室政治，对有些人来说是一个禁忌词汇，但在工作场合它却不可回避。简单来说，它就是职场上人与人的不同：观念的差异、利益的冲突都可以看成是办公室政治的表现。它等于人与人之间的交流和关系。


    没必要害怕办公室政治，职场中的成功人士往往是掌握了办公室政治艺术的人。以下是让你从容应对办公室政治的七个好习惯：


    # 选择权在于你


    在办公室政治中最常见的反应是斗争与逃避。即使回到史前时代，这也是人类在野外求生的正常反应。职场是一个现代丛林，但仅靠本能反应是不足以赢得办公室政治的：斗争只
    会给你想要实现的目标带来更多的阻力，而逃避会让人们理所当然地把你看成弱者。两者都不利于健康的职业生涯发展。


    办公室政治的胜利需要有意识地去选择你当下的反应。你要清楚：不管情况如何恶劣，能决定你的心情和行动的你只有你自己。那么要怎样选择呢？让我们进入下一个问题...
    清晰目标'
  merge: -1
  img_proc: true
- pgno: 1383
  md: '当冲突发生时，人们很容易陷入短视并看重眼前的分歧，而这是一个弄巧成拙的做法。过度关注职位的高低和意见的不同可能会引起更多的反抗。


    避免被别人认为想要成为这场冲突的赢家的办法是关注商业目标。根据商业利益来讨论每一个选择。最终，每个人都想商业获得成功——如果公司不获利，没人能获利。这比每个人为了自己微薄的利润勾心斗角容易多了。


    通过学习将讨论引导至这个方向，你将学会脱离无用的分歧，把自己定位成想要做事的人。你的老板也会欣赏你，认为你成熟，有策略，可以赋予更大的责任。


    # 影响范围（做你能做的）


    在工作中，有很多我们难以控制的状况。企业政策，客户需求或老板命令影响个人利益的事情并不罕见。牢骚和抱怨都是常见的反应。但想想看，除短期情绪宣泄，发牢骚能实现什么具体的目标吗？在大多数情况下，没有。


    不要感到痛苦和生气，而应该尽你所能来影响现况。这是一项克服无助感的有效方法。它消除了你的负面情绪，也让别人把你看作一个在不利条件下也知道如何工作的人。你可能无法改变或决定最终的结果，但你知道你已经做了当你能做到的最佳。


    工作场合中有很多制约因素。通过这种方法，你的老板会来欣赏你的包容力和积极的。'
  merge: -1
  img_proc: true
- pgno: 1384
  md: '# 保持中立


    在办公室政治中，你有可能会发现自己卡在两个对立的权力人物中。他们试图欺骗对方并捍卫自己的立场，于是将你扔来扔去。你的工作成了代价。你不能让他们对一个决定达成共识，也无法让他承担工作的责任，他们太害怕会被告在背后捅一刀。


    在这种情况下，你得专注于商业目标并不偏担它们中的任何一方——即使你偏爱其中的一个。把他们放在一个共同的沟通平台并确保不同团体间有开放的交流，使任何人都不能说类似“我没这么说过”的话。


    中立将有助于你客观地解决冲突。你将与双方都建立信任感。这将有助于保持建设性的合作并专注于商业目标。


    # 拒绝人生攻击


    在办公室政治中，你会生气。这很正常。有时，你会想教训某人，想给他点颜色看看。但千万别这么做。


    人们往往记住他们觉得丢脸或被侮辱的时刻。虽然你赢了这一次，还感觉非常好，但当有天你需要这人的帮助时，你会付出代价的。种瓜得瓜，种豆得豆。


    想成为职场赢家，你得建立一个你可以信赖的同盟。你一时的情绪爆发会让人反感并在以后为难你，这是要避免的。


    职业生涯发展是另一个控制情绪的原因。越来越多的公司会全方位考察一个人是否值得提升。'
  merge: -1
  img_proc: true
- pgno: 1385
  md: '即使你是一个明星职员，如果其他经理或同事认为你很难共事，你的老板将不得不为你的升职打场艰难的战争。你得避免让老板奖励你成为一件困难的事情


    先理解别人


    人们感到不公平是因为他们觉得被误解。比起先去理解别人，我们本能地更希望能先得到别人的理解。优秀的人事经理和商界领袖都知道要压抑这种本能。


    令人惊讶的是，试图了解对方是一个缓解敌意的很好方法。一旦对方觉得你了解他/她的出发点，作为回报，他们会减少防备并乐于去了解你。这创造了一个开放的交流平台，可以产生双方都接受的解决方案。缺乏这样的理解而要实现解决方案是很困难的-缺乏信任和太多猜忌。


    双赢


    正如前面所说，政治冲突的发生是因为利益的冲突。也许是因为我们的学校教育，我们要赢，别人要输。反过来说，我们是害怕让别人赢，因为这意味着我们失败。


    在商业和工作中，并非如此。


    学着思考“在这种局面下，要如何双赢？”这需要先了解对方的观点和从中能得到的利益。其次，明白你从中能得到的利益。努力寻求一种双方都能接受的双赢的解决方案。这样做将确保所有人都真正为之工作而不是嘴上功夫。'
  merge: -1
  img_proc: true
- pgno: 1386
  md: '人们讨厌失败。在胜负思维下，你可能会赢个一两次，但很快，你会发现自己在职场中被孤立。双赢思维，是一个能帮你建立同盟获得长远利益的持久方法。


    # 职场心计与城府


    公司里曾有一个年轻女职员，很多人都说这个人不好，太有心机，见人说人话，见鬼说鬼话。可公司人力资源部的主管把她提拔了做公关经理。但是在提拔前，他和这个女职员有一番交谈，经理说：其实见什么人说什么话本身没有什么问题，问题在于你让别人都意识到了你的不真诚。而你原本的想法是达到一个好的目的，使自己成为一个让人喜欢让人信任的人，但是显然你的目的没有达到，这就说明你的有心机反而拖了你的后腿。


    现在这个女职员已经成为一名优秀的公关经理，她能贴切得体地处理各种关系，但是不会让人觉得世故圆滑。在我看来，她正渐渐从低段位的心机修炼成高段位的城府。


    如果有人跟你抱怨说她的男朋友对她不好，打她骂她花她的钱吃她的喝她的却对她简单粗暴，你会不会立刻劝他们分手？'
  merge: -1
  img_proc: true
- pgno: 1387
  md: '年幼无知的我就干过这样的蠢事，后来人家两人喜结连理，我前去道喜，送上的是红包收获的是白眼。


    还有一次，一个朋友跟我抱怨她的老板对她如何如何不好，我信其言感其诚恳，于是巴心巴肺地告诉她如果是我遇到这样的老板，我一定会怎样怎样，结果没过几天，就听到江湖上的传闻，大意意思是她如何如何之没有城府，结果在单位里成了任人宰割的羔羊，而我则如何如何之城府深深深几许——仿佛她宁愿做一只待宰的羔羊，也不愿意牺牲自己的纯洁。那个小姿态拿的，二分天真，三分无辜，还有好几分的倔强。而我，整个一反面陪衬。


    我对着镜子照了半天，里外不是人，遂下定决心，哪里跌倒哪里爬起来，于是我学会了微笑倾听——那个朋友又来向我诉苦了，说谁谁恩怨负义，过河拆桥，说谁谁谁杀熟，谁谁谁对不住她，我一律微笑，就是听着，她还在说：说为什么坏人总是得势呢?像我这样不会玩心眼的人可怎么办?我忍不住揶揄：不会玩心眼和玩得不高明是两回事哦。


    她目瞪口呆，悲愤交加，对我说：早知道你城府这样深，我真是没必要和你说这些。'
