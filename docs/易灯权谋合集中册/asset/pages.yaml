  md: '礼仪，提升皇帝的威严；儒生虽自己不能创造历史，但能从历史的长河中、从政权的相反结局中吸取教训，总结经验，让现实走得更好。人生贵在不固执己见，在对客观世界的认识中不断提升自己的主观境界。刘邦从开始看不起儒生，恨儒生，到最终依重儒生，提拔儒生，完成了自己的人生认识的一次重大转变。自古以来，凡做出成就的政治家、科学家、文学家、企业家，一切有成就之人都有这样的心路历程。否则，不可能出成就。


