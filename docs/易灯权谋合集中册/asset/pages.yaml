  md: '会被怀疑” 。臣总以为这是千真万确的真理，然而这不过是虚有其词，实际生活中不是这样。过去，荆轲慕燕太子丹之义，尽管天上出现白虹贯日的征兆，而太子却贪生怕死；卫先生曾为秦策划长平之事，尽管天上有太白蚀昂的预兆，而秦昭王反而怀疑卫先生。此两人的忠心，天地可证，却不被两主认同，岂不哀哉！”


