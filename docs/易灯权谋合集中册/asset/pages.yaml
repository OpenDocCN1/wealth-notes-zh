- pgno: 580
  md: '# 谋局者的最高境界


    做局都是一个跟人性博弈的过程。这种博弈分为四种境界：技术——艺术——法术——道术。


    纵横捭阖、抽丝剥茧、设点控局；洞察人性冷暖，解析大众行为，这一路走来，如果做到游刃有余、可收可发，便抵达了''道术''的境界。此时万事万物、相生相克，生来病死，一切在你心里来去自如。


    最强的对手就是你自己。一旦你战胜了自己，如同跳出三界外、不在五行中。宠辱不惊，看庭前花开花落；去留无意，望天上云卷云舒。'
  merge: -1
  img_proc: true
- pgno: 581
  md: '# 职场制衡


    因为资历不够深，总是有很多时候思维打不开，我不知道这样的理由算不算是废话或者找理由，但是自己确实很多时候真切的感觉如此。最近掉进一个漩涡里一个人纠结了两天，萎靡也好恍惚也罢，真的是浑浑噩噩的罪恶了两天，手头的事情除了紧急的其它都搁浅着，以至于新拜的师傅都懒得理我，和我说“工作时间”抑或总是发同一个图片回复我所有的问题，我真的只能说“OMG”
    ----给自己。想了两天，终于悟出点什么。


