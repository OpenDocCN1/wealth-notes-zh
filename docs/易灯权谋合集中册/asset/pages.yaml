  md: '处，鹊巢鸠占，还落了个心胸狭窄的恶名，贻笑千古。知识分子为什麽大多不残忍？因为他们自小学习的是儒家的仁义礼智信、温良恭俭让；“仁”是他们的最高灵魂之一，于是他们成了谦谦君子，品德高尚，胸无渣滓，更
