- pgno: 101
  md: '也是一种“走”。


    # # 六、度势


    智者不仅能够把握势，利用势，还能够造势。做大事的人，眼光是胆略同等重要。人所好者，利禄也；见利而争先，或利尽而交疏，实为人之本性。


    智谋没有见识就不能制定，没有胆量就不能实行。


    胆量和智慧都具备了，就可以造势了。


    不要丧气，耐心等待势的变化，而用自己优势来对敌人的劣势。


    知其不可为而为。许多人都在犯同一种错误：把时间浪费在不可能完成的事情上。


    # # 七、攻心


    攻取人心，就要用理来说服，用感情来打动，用义来引导，用威来震慑。


    刚柔相济，可以消除对方的对抗情绪，缓解矛'
