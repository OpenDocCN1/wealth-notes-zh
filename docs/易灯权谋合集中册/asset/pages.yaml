- pgno: 1233
  md: '# 是什么阻碍了你的发展？


    很多人认为他们富不起来是因为自己挣的钱太少。事实是，成为百万富翁与你能挣多少钱之间几乎没有太大的关系。你为什么富不起来，以下十个缺点可能是你在发财致富的过程中最常出现的：


    +   1。你太在意别人怎么看你的车：很多人将汽车视为身份的象征，每隔几年就会在车子上花上一笔钱，而不是在汽车依旧能用的情况下继续开下去，将节省下来的钱用于投资。其实，车只是一个“代表”，你在衣食住等方面也喜欢看别人的眼色行事，为了面子，打肿脸充胖子，结果永远也完不成最基本的原始积累。


    +   2。你总认为你应该过好日子：如果你认为自己应该以某种特定的生活方式生活，那你必须拥有特定的东西，必须花一定数量的钱，如果你现在还没能力'
  merge: -1
  img_proc: true
- pgno: 1234
  md: '达到这些，你就可能去借钱消费。寅吃卯粮，大笔的债务注定影响你的发展，你也就离积累财富越来越远。


    3。你的理财方式缺乏变化：这是最古老的最有价值的理财箴言：不要将所有鸡蛋都放在一个篮子里。拥 有多元化的投资组合才能在很大程度上避免你的财富突然蒸发。


    4。你存钱和投资起步太晚：在投资理财中有一个术语叫“复利”，类似利滚利，但“复利”的神奇力量往往要很长时间后才会显现出来。如果你发现自己一 直在说以后有的是时间存钱和投资，总有一天你会突然发现退休已经离你不远，而你的退休账户中仍一无所有。


    5。你不喜欢自己的工作：虽然你的工作并不一定是你梦寐以求的，但是你必须喜欢它。如果你仅仅因为钱 选择了一个你并不喜欢的工作，那么你将要花'
  merge: -1
  img_proc: true
- pgno: 1235
  md: '掉所有余钱，才能减轻你因从事这份不喜欢的工作而产生的压力。


    6. 你不喜欢学习：你可能存在这样一种想法，一旦大学毕业，你就再也不需要学习了。这种想法也许能让你保住第一份工作，但是它永远不会让你变得富有。如果你想变富有，自觉自愿地学习各种知识，提高工作质量，增加理财知识，是十分必要的。


    7. 你经常买一些你根本不用的东西：看一看你的房子、壁橱、储藏室、车库，是否有很多在过去一年里你从没使用过的东西。如果有，那么你购买这些东西可能只是在浪费本来可以增加你的资产净值的钱。


    8. 你不懂得什么是价值：你因为各种原因购买很多东西，但是从来不知道这些东西能给你带来什么好处。这种情况不只发生在那些只买最贵的东西的人'
  merge: -1
  img_proc: true
- pgno: 1236
  md: '身上，那些只买最便宜的东西的人也存在上述情况。这种做法很少能体现出产品的真正价值，只有当你学会购买有价值的东西的时候，你才能有余钱投资未来。


    +   9. 你的房子太大：如果你买了负担不起或是不需要的大房子，结果你会偿还更长时间的贷款、缴纳更多的税、花费更多的维护费，还要购买更多东西来填充它。一些人可能会争辩说，房子会增值，因此购房是最好的投资，但是，除非你是房虫，有炒房的技巧，或者你愿意降低自己的居住标准，今年住100平方米，明年改住50平方米，否则你的房子永远都不会变成可供你使用和享受的流动资产或资金。


    问题是，住惯了大房子的你愿意改住小房子吗？


    +   10. 你抓不住机遇：你可能不止一次听说某些人时来运转，终于大发横财，这时你可能会很后悔：'
  merge: -1
  img_proc: true
- pgno: 1237
  md: '“本来我也可以想到的，我也可以这样做的。”如果你有恒心和毅力时刻做好准备，你会发现有很多这样的好机会的。问题是，你有这样的恒心和毅力吗？


    # 职场发展的绊脚石


    工作汇报很重要，但绝大多数职场小白不会汇报，不重视汇报，也不在乎汇报，仿佛做好自己的一亩三分地，不出错就高枕无忧了。而这种心理反过来导 致了目标不清、效率低下、不受重视，形成了恶性循环。汇报不是形式主义，更不是溜须拍马，汇报本就是工作的重要组成部分，除非你是纯体力劳'
  merge: -1
  img_proc: true
- pgno: 1238
  md: '动者，在流水线 上甘愿做一颗螺丝钉。否则，不汇报就像人机交互半天没有响应——需要加载没关系，但没有过场动画，更没有加载条，鬼知道你是挂了还是死机了？
    汇报，就是汇总+报告，但为什么那么多人不会汇报？究其原因有以下几点： 懒得汇报。自己做的堂堂正正天地良心，各方面协调到位，过程流畅结果完美，用成绩说话就行了，领导都知道。
    可领导不是你肚里的蛔虫，自己一堆破事儿都搞不完，怎么知道你具体干的怎么样，下一步又准备做什么？更可悲的是，你自鸣得意最近没有被领导挑刺找事儿的 时候，殊不知领导已经把你定位成流水线螺丝钉了。
    没什么好汇报的。懒得汇报的人，基本上还有成绩可以得瑟；没什么好汇报的人，就像考试总不及格的孩子，低个头，羞涩，自卑，沉浸在自己的小世界里。这个弱肉强食的世界对你们太残忍了，如果领导对你更残忍，你还有救，否则的话，回家洗洗睡吧。职场不是撒娇的地方，没人喜欢侉候您。
    最近没什么进展，再等等信息吧。没什么进展，只有两种情况。要么就是遇到了


    1239'
  merge: -1
  img_proc: true
- pgno: 1239
  md: 困难，进展不下去；要就是瞎忙了，走神了，打酱油了。遇到困难总要解决，即便不找诸葛亮，也可以找找臭皮匠，但困难总是暂时的，如果持续没进展，那么一定是去打酱油了。领导最痛恨的就是打酱油的人，懒得汇报是有傲气，没什么好汇报的是有脾气，打酱油纯属站着茅坑不拉屎，杯具的是，领导都喜欢把不汇报的人跟打酱油挂钩。怕浪费领导时间。你太自作多情了，汇报能浪费领导时间？没时间，领导会告诉你没时间，然后再定个时间，但你不用自己帮领导决定有没有时间。另外，比起来方向偏离、关键性遗漏和资源冲突，汇报通气能节约大量的隐形时间和机会成本，即便真的是鸡毛蒜皮的小事儿，烦的应该是领导而不是你，更何况，相对于对目标和资源的失控，被烦根本算不上什么事儿。领导总没时间。人总是喜欢给自己找各种各样的借口，就像被逼无奈要不得已的电话，恨不得响一声就挂断，然后自我安慰对方没接到。恩，领导就在那，如果不是你刻意去找领导吃喝拉撒的时间汇报，你总是有机会的，即便真的一
  merge: -1
