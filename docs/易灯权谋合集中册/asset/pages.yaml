- pgno: 696
  md: '亲冯朗，是秦、雍二州刺史、西城郡公，母亲是乐浪人王氏。皇后出生在长安，有神光的异彩。冯朗因事获罪被诛杀，皇后于是进宫。世祖的左昭仪，是皇后的姑姑，一向有女性美德，对皇后抚养教导。十四岁时，高宗登位，被选为贵人，后来立为皇后。高宗逝世，按旧例：国家有大丧事，三天以后，皇帝穿戴使用的车马器物全部加以焚烧，百官和皇后都围绕着火堆痛哭流涕。皇后悲伤地呼叫着自己投入火中，左右的人救出她，很久才苏醒过来。

