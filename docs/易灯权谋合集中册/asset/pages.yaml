- pgno: 486
  md: '官员不以清廉品格相尚，出于能员的贪官倒不乏其人。帝王的这种理念直接源于专制的皇权思想。因为专制体制下，皇帝需要的是听话的官员，哪怕他是一个贪官，但只要奴性十足，效忠主子，也会得到恩宠。这些贪官，喜爱的只是财色酒，根本不会公然挑衅皇权，不会导致皇权不稳固。老百姓的日常生活虽然也是皇帝思考的，但与权力的垄断和独占比起来，永远处于第二位，甚至是末位。这种逻辑，虽然没有一位帝王肯明确加以表述，但观其行为，却大多如此。而且愈到皇朝末期，那些皇帝秉持这种逻辑的痕迹愈明显，直至新王朝建立。


    缘何立国皇帝重反贪甚于重臣子个人的能力？皆因他们亲眼见到腐败对国家的侵蚀，亲眼看到官员的贪腐怎样激起民愤，亲眼见到贪腐怎样把老百姓逼上梁山，亲眼见到敌手如何摧枯拉朽。所谓能臣创造的价值，与贪腐巨大的负效应比'
