- pgno: 99
  md: '营造势者为智，善用势者为谋。


    谋定而思动，后发制人则胜机已握。

    善谋者从来不是依据道理，而是根据利害做出决定。


    注意强弱的变化。用己之强，来攻敌之弱。


    要偃旗息鼓、不事声张，如此胜机便大了。


    不要主动与人为敌，不要放弃修好的机会。


    # 三、用人


    君者只需知人善任、赏罚分明；臣者只需能言能行。


    要注意不说谎偶尔说谎，不使诈偶尔使诈的人。


    第一印象好的人不一定是好人，因为小人更擅伪术。


    要考察人的本质，要顺应人的性情，则事情就可为了。


    发现和使用贤能的人则事有成，不辨和使用奸佞的人败机先伏。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '当权者首先看重的是忠诚而后才是才能。


    经世之道，识人为先，用人后之。


    # 四、事上


    以德报怨是下级化解矛盾、取得谅解的有效办法。


    在大事上忠心，同时不忽略小事；干着上面所想的，想着上面未想的，这是仕途升迁的智慧。


    恪尽职守，是一种大的聪明和智慧。


    智慧是一种品格，聪明绝不等于智慧。


    一次雪中送炭，胜过十次锦上添花。


    # 五、避祸


    以其昭昭，示人昏昏，而后可以全身。


    以无示有，可获得利益；以无示无，可消弭灾祸。


    柔能克刚，弱能胜强。舌头比牙齿更坚固。


    功大才强者，如果没有权谋，处境就凶险了。


    三十六计中，走为上计。消除危险、避免事端'
