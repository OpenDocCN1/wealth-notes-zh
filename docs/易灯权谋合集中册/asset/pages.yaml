- pgno: 1031
  md: '在与小人打交道时务必考虑周全，最好不要与其发生正面冲突。论实力，小人并不强大。但他们不择手段，什么卑鄙的招数都可能使出来。冲突起来，纵使赢了小人，也会付出代价，所以：还是躲为上策。


    “小人”随处可见，这种人常常是一个团体纷扰之所在，他们的造谣生事、挑拨离间、兴风作浪很让人讨厌，所以有些人对这种人不但敬而远之，甚至还抱着厌恶的态 度。厌恶小人固足以显出你的正义，但这并不是明智之举，反而凸显了你的正义的不切实际，因为你的“正义”往往并不能解决任何问题。


    再坏的人也不愿意被人认为自己“很坏”，总要披一件伪善的外衣，而你偏要以正义之手，揭开他们的面纱，照出了不少人的原形，这不是故意和他们过不去吗？


    君子不怕传言：因为他问心无愧。小人看你暴露了他的真面目，为了自保，为了掩饰，肯定会对你打击报复。也许你不怕他们的反击，也许他们也奈何'
