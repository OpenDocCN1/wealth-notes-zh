- pgno: 313
  md: '秦灭以后楚汉战争开始。汉三年秋，项羽击汉，拔荥阳，汉兵遁保巩、洛。楚人听到韩信破赵、彭越多次反梁地，分兵救之。郦生据此形势为刘邦谋划：“臣闻知天之天者，王事可成，不知天之天者，王事不可成。王者以民为天，民以食为天。夫敖仓，天下转输入矣。臣闻其下乃有藏粟甚多。楚人拔荥阳，不坚守敖仓，乃引而东，令戍卒分守成皋，此乃天所以资汉也……愿足下急复进兵，收取荥阳，据敖仓之粟，塞成皋之险，杜大行之道，拒蜚狐之口，守白马之津，以示诸侯效实形制之势，则天下人就都会知道将来天下的归属了。方今燕、赵已定，唯齐未下。”刘邦认同郦生的战略，让郦生亲自去齐国，说服齐国归顺汉王。


    郦食其游说得非常成功，而韩信“闻郦生伏轼下齐七十余城，乃夜度兵平原袭齐。齐王田广闻汉兵至，以为郦生卖己……乃烹之”。郦食'
