  md: '身亡，则是能胜不能败。——项羽的气质，恰是成大事业者最不应有者。


    # 明太祖：按部就班得江山


    明太祖是另一个创业成功的开国皇帝。他是一无凭借的贫苦孤儿，依附佛寺为僧，然后投入红巾，以其勇力，由郭子兴的卫士，逐渐独当一面，逶迤中原，荡平群雄，高举抗元民族主义的旗帜，驱逐蒙古政权，建立汉人的明皇朝。朱元璋能如此作为，当然有其雄鸷过人之处。论其用人，他以淮西功臣为将领，以浙东儒生为谋士，缺少宏大的气魄。他的谋略**广积粮，高筑墙，缓称王**，是在厚植实力的阶段，保持低姿态——这是稳扎稳打的策略。先灭陈友谅，后打张士诚，是由于后者恃富自保，不足为患；也由于前者占有的长江流域，腹地广大，进可攻、退可守，而张士诚的江南，虽然殷富，却偏居东南，不在要冲。削平群雄后，朱元璋才全力驱逐蒙元，一则当时蒙元已衰乱不堪一击，二则还是采取稳扎稳打的基本战略。凡此都是从保守中求进取的策略。朱元璋的开创业业，其做法与刘邦豁出去的作风相比，当是谨慎有余，进取不足。'
  merge: -1
  img_proc: true
- pgno: 1293
  md: '明皇朝统一了中国，朱元璋满足于自保，沿北边筑长城守塞，既未如汉代边郡有万骑巡边的机动，也未如唐代设都护驻防，甚至没有建立中国与蒙元残余之间的宗主藩属关系。他诛杀功臣，广封皇子，全是家天下


    下的作风，其气度不如刘汉远甚！终有明一代，中国始终是自保的格局，缺少了开张的气魄。虽今日颇有人盛述永乐皇帝（明成祖朱棣）时，郑和下西洋之事，以为这是中国人对外开拓的大事。其实郑和在海上的大举，并没有在海外建立据点，正如明朝未在蒙古驻守，是同一保守的作风。


    明代最后一个皇帝崇祯，其所作所为，十足代表领袖特质负面。崇祯自信太    深，刚愎自用，单以其辅政大臣而言，即更迭频繁。他用人不专，轻信而又猜忌，举棋不定，以致不断改易将帅，于平定内乱及防御外敌两方面，都不能成功。在全局腐烂，自缢煤山时，还自以为不是亡国之君，责怪举朝都是亡国之臣！他的一生作为，没有一处不是违背了领袖应有的特质：既无见识，又不能用人，缺少自知之明，更不知反省，一味盲目自信，刚愎任性！


    明 vs. 汉：决策 CEO 不见了'
