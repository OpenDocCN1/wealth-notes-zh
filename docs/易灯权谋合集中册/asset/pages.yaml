  md: 关差每年有专门银两用来办贡外，所有臣工置办商品均由自己出资。但是，云贵总督岁给养廉也不过二万两左右，这二万两银也仅仅是李侍尧万寿贡中一盘朝珠的价格。李侍尧自然不会自己掏腰包，来源就是“众人头上刮”喽，他仅仅被查实地累下层的银两就达三万多两。李侍尧上任云贵总督后，对云南钱局铸钱之事特别关心，常常亲自过问钱局的事情，并当众以钱局应有出息为由责难蔡司汪圻。汪圻知道其中原委，立备三柄金如意送给李侍尧。但李侍尧并非满足，传话让汪圻每年必须奉上例银五千两。临安府、署札川府知府看见别的官员都送银给李侍尧办贡，知道李侍尧“素性傲岸，不讲情理，若不从便有祸患”，也连忙筹措银子交给道员庄肇奎送李侍尧。结果，庄肇奎发现银子尚未凑齐，离李侍尧交代的数额还差二OOO两，为难免惹麻烦，他不动声色地自己拿了三OOO两补足了一万六OOO两，准时如数地将银子交给李侍尧。
