- pgno: 469
  md: '乾隆下令杀头，和坤被新皇上嘉庆所杀，而李侍尧案发后却诡异外地死里逃生。这是怎么一回事呢？民国赵尔巽编写的《清史稿·李侍尧传》等史料记载了事件原委。


    李侍尧，八旗勋旧大臣之后，其父李元亮官至户部尚书。乾隆初年，李侍尧以荫生授员外章京。乾隆十四年，乾隆帝初见李侍尧，即夸其“天下奇才”，立擢副都统。此后，李侍尧又历任工部侍郎，户部侍郎，广州将军等职。乾隆二十一年后，李侍尧历任两广总督、户部尚书、湖广总督、工部尚书等高官，乾隆四十二年，李侍尧调任云贵总督，官至从二品。此人精明干练，颇有才略。《清史稿》评价他：“短小精敏，过目成篇。见属僚，数语即辩其才否。拥几高望，语所治肥瘠利害，或及其阴事，若亲见，从皆悚惧。”这是说他很会驾驭属僚，对他们的长短处尤其是“阴事”了解的清清楚楚，故属下都怕他。我想，这就为李侍尧之立功和贪贿'
  merge: -1
  img_proc: true
- pgno: 470
  md: '埋下了伏笔。


    乾隆四十五年（1780年）正月，原云南粮储道海宁在乾隆帝召其面询时，不断地夸奖李侍尧颇能办事，而私下又议论李侍尧在滇的婪赃劣迹。乾隆帝闻讯传谕将海宁交军机大臣严讯，严审之下，海宁供出了李侍尧的婪赃情形。正月二十六日，乾隆帝立刻下谕派尚书和珅、侍郎喀宁阿前往贵州查办事件。同天，乾隆帝又命户部尚书英廉查封李侍尧在京家产。和珅、喀宁阿等抵昆明府后密提李侍尧家人，严讯之下家人供出了李侍尧承受官员馈送的详情。接着，和珅等又审李侍尧，李侍尧对家人所供各情供认不讳。于是，乾隆帝命和珅将李侍尧解京质审，并将送银各员亦一并革职严审定拟。


    据史料，李侍尧婪赃罪行整竹难书，但不同今日之判决有个总计数额，且选用同年五月初七日大学士公卿核议的李'
