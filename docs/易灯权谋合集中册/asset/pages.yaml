- pgno: 1043
  md: '苦工作的你既得不到同事应有的尊重，又要受关系户显赫地位的刺激，颇觉天下不公。类似的不公平还有：每次外勤都是你去穷乡僻壤，而老板的亲信们总是去繁华大城市；公司平均加薪
    8%，你只加了 5%；被提升的那个人明明还没有你能干……于是，“不在沉默中死亡，就在沉默中爆发”，你开始与不公平的事物为敌，以为自己不会是“一个人在战斗”，一定会有盟友来支援。结果，在你的带领下，大家都义愤填鹰准备跟着你大干一场。只是当你真的冲上阵的时候，发现大家都隐身而去，然后你独独成了靶子被射得千疮百孔，俨然一副炮灰样儿。


    关于这种「型炮灰，如果是主动做炮弹类型的，基本没什么解药。因为当事人并没有自觉性，而且估计在做炮弹的时候得到的甜头还不少，自然缺少改变的动机了。而当其一旦沦为炮灰，基本上也就没什么翻身的机会了。只有一点可以反省一下：在职场你是否把别人(尤其是与自己资历相同的同事)都当'
  merge: -1
  img_proc: true
- pgno: 1044
  md: '傻瓜？如果有，而且如果你的 IQ 没有达到 160 以上，那么还是需要有所改变，职场钻营的动机需要收敛一些，并且最好改钻营为协同合作的努力。


    职场发展非常重要的一个资源就是同盟军。岳飞同志在职场对谁都攻击，说别人怕死、腐败、无能，最后被下狱时，竟然没有当权的同僚为他求情。所以，在职场混还是要学习张居正，无论何时都有人为他说话，而且为他说话的人都不是一般人。而对于II型里的被动攻击型，需要更清醒地看世界，要知道世界就是不公平的，“（站出来捍卫权利”这样的壮举需要有丰富的群众基础以及领导者基础才可以。


    # III型炮灰：就是因为知道得太多


    成为职场炮灰的第三种类型就是“你知道得太多了”。大家都知道这句话后面会接上什么。在职场，信息就是权力和权利。因此许多人职场混迹的原则就是高度敏锐地捕抓“内幕”。比如，管理者往往会培养几个“线人”来了解下面员工或下一级'
  merge: -1
  img_proc: true
- pgno: 1045
  md: '管理者的心思与动向，下层员工则总是关注着从领导办公室出来的人。但因为这种信息渠道的不正规，往往使得这个渠道里的信息变得“小道化”。而信息小道化之后，往往会被不由自主地演绎，因为每个信息传递都为了实现自己的权力与权利，为信息附加了新内容。


    于是掌握这些小道消息太多的人，往往会被当成“搅屎棍儿”遭人厌弃。因此，面对小道而来的“秘密”，需要“不参与，不评论，不作为判断标准”，这样才可以有效避免“知道太多”不得不“被炮灰”的结局。另外，还有些领导故意想表现得很亲民，而把自己的私生活、自己的一些小缺点暴露给了一些下属，其实这对于领导与下属都是非常危险的。领导可能是一时冲动说了些极端的话，之后可能会很后悔，而下属则因为“真的知道太多”而成为领导眼中特别的人——特别被当成会随时出卖自己的人。面对这种领导的私密信息，还是学学这位职场高手的方法吧。姑且把这位高手称为'
  merge: -1
  img_proc: true
- pgno: 1046
  md: '老 H。老大给老 H 说了一个秘密，并特别叮咛他要保密，结果老 H 的反应是：“哎呀，现在年纪大了耳朵不好记性也不好，您刚才说的是什么来着？”


    # 如果你正在或已经“被炮灰”


    其实炮灰的类型还有很多，比如那种 “被炮灰” 型，即太怕 “被炮灰” 反而逃避职场纷争，结果要么广泛地 “被炮灰” ，要么连炮灰的资格都没有了；比如那种喜欢职场斗争却不自量力而败阵出局
    的类型；比如幻想职场清平的，就像傻根儿喊出 “谁是小偷，出来让我看看” 一样地喊出 “有本事向我开火” ；还有一种就是，为了工作起早贪黑，为了博得领导青睐宁愿主动加班，光鲜的身份和外
    表是用牺牲个人时间和健康换来的，结果只不过成 就了自己进入 “白领炮灰团” 变成一个十足的职场 “焦郁碌” (焦虑、郁闷、忙碌且碌碌无为)。


    对于上面几种正在变成炮灰的人，如果有自觉性， 能够去反思改变，就还有改变的机会。'
  merge: -1
  img_proc: true
- pgno: 1047
  md: '其一，想想自己工作是为什么。其实许多时候人们把工具当成目标，把在职场上位、博得领导赏识、获得更多发展机会作为目标。其实这些只是过程，目标就是这些都达到的时候你想做的事情。


    其二，给自己做好定位。最好先好好地以别人期待的方式出现，然后慢慢改变，否则人们会吃不消，以为你想如何如何呢。比如新来乍到的，还是好好观老人眼色行事为妙。做好自己新兵的角色，慢慢争取群众基础。


    但如果已经成为根深蒂固的炮灰，也许只能改头换面重新做人了。做法就是主动改变自己混迹的江湖，换换地域或者换换领域。另外想特别补充说明的是，职场其实更多时候是阳光的，大家都是善良且助人的。如果每个职场人都能如此心态，其实职场何愁不成一片净土。只是这个需要大家的共同成长与建设。


    最后说明一下，前面提到的老 H 就是和珅，他的老板就是乾隆。面对和珅说自己“没听清楚”，乾隆'
  merge: -1
  img_proc: true
- pgno: 1048
  md: '会心一笑。估计他心里在想：这个老狐狸，很可爱，可信任。


    # 4 大妙招甩掉额外工作！


    滥好人其实不是好人，因为代表你什么都没做好。所谓的滥好人，就是别人来请他做事或帮忙时，什么都说好、都说 Yes，但却没有考虑到个人甚至部门的时间能否允许去帮这个忙；最后，答应了人家，却只是像沾豉油一样沾一下，所有的事情都做不好、做不到，自己还累得半死，才会得到这样的封号。'
  merge: -1
  img_proc: true
- pgno: 1049
  md: '另外，主管也不喜欢只会说 Yes、太过听话的员工——太过被动，没有自己的声音和意见，就代表无法提出创新的想法。


    # 真正帮到忙，才能加分


    如果你发现自己有这种滥好人的倾向，建议你赶快检视自己的时间管理，看看是否出了问题。


    无论是公事还是私事，当同事来请你帮忙时，首先最重要的考察就是 priority（优先级）。简单来说，当然就是要先把自己分内的工作做好，再来，同事若有工作或私事想请你帮忙，在时间允许的状况下，可以答应。


    说 Yes 的同时，一定要确定自己有能力完成这件事才点头。不然到头来自己忙得团团转，内耗精力，却一事无成，也得不到别人的感谢和赞赏，在人际关系上反而减分。


    不过，无论是对同事或主管，能够多接一些工作、多帮助别人，对自己的职业发展其实是正面的。'
  merge: -1
  img_proc: true
- pgno: 1050
  md: '现在职场上十分竞争，千万不要为了避免做滥好人，而抱有多做多错、少做少错的保守心态。当你将本分做好，也确认自己有多余的时间和能力时，多做反而是多学，间接增强了自己的专业能力；甚至跨部门伸出援手，更能增加自己在公司的能见度。未来如果有升迁机会，额外做了很多
    special project 的你，表现自然加分。


    # 说 No 也要有技巧


    然而，从公司或主管的角度来看，只会说好、总是没有不同意见的员工，对公司的贡献是有限的。


    现在一般上班族都是所谓的知识工作者，不像在工厂工作的作业员，只是重复而规律地说一做一、说二做二，一定有需要自己做判断、为工作增加 value 的时候。


    面对主管的要求，尽管心里有疑虑，但做部属的似乎很难跟上司开口说 No？我的建议是，还是要先应答下来：没问题，我先回去研究，日后会尽快回复'
  merge: -1
  img_proc: true
- pgno: 1051
  md: '报告。之后，再表达你不同的想法意见，甚或拒绝。


    跟主管说 No 时，应该把握以下 3 项原则：


    **1．呈现数据和数据。**


    为了显示自己不是为了反对而反对，一定要提出佐证自己想法的数据和文件，来说明这样做可能会有什么后果。


    **2．秉持诚恳的态度。**


    理性说明自己觉得这样做可能会有什么问题、为什么无法帮这个忙，而不是只会说真的没办法！、不行！


    **3．能提出不同的解决方案。**


    员工的职责之一，是提供主管更多可行的选择。你应该将研究过后的数据系统化整理，并和原方案一起附上利弊得失的评价，把决定权交给主管：上次您交代我的事情，我了解您要这样做的立意，但我搜集数据研究后，发现这是有问题的，会有些不好'
  merge: -1
  img_proc: true
- pgno: 1052
  md: '的影响，所以我提出 A 和 B 两种方案，回来跟您确认一下，是否还要这样做？


    在职场上，大家绝对不喜欢永远只会说 Yes 或只会说 No 的人。其实，重点不在 Yes 或 No，而是你能否真正帮助他：面对主管，能提出自己的想法和方案；面对同事，能帮他想出解决的建议。


    # 解密领导阴谋玩法


    韩非子是统御权谋的集大成的大师。所谓的统御权谋其实就是我们现在的管理谋略。韩非子在《韩非子》书中的《内储说 七术》篇提出了领导对下属管理的三种阴谋玩法。领导需要的人才又是又红又专，意思就是忠诚和技术都需要，而技术能不能干活这个都是明面上的，办事能力都能一眼看穿，但是一个人是不是忠诚，是不是白眼狼，这个人心隔肚皮。不是谁都知道的。所以所有的领导都有意无意的，测试自己的员工或是手下是不是忠诚，关键时候会不会变节，都会使出各种招数来，尽管各种案'
  merge: -1
  img_proc: true
- pgno: 1053
  md: '例很多，但是归结起来，无非就是就是韩非子说的如下三种种。


    # 1、疑诏诡使


    解释这个词之前，先给大家讲个故事。周亚夫是汉景帝时期杰出的军事人才，三个月平叛七国之乱。功劳不可谓不大。但是汉景帝，不了解他是不是忠诚，是不能能够为自己的儿子汉武帝所用。所以，一天，汉景帝就请周亚夫吃饭，弄个一大块肉，没有给筷子。周亚夫不知道何意，于是发脾气给侍者要筷子。汉景帝说是他的意思，于是周亚夫不告而别，怨气外泄。于是汉景帝觉得这样的人不可能辅助自己的儿子。于是最后找借口除掉了。汉景帝对周亚夫就用了疑诏诡使这一招。这一招的本质就是给你一个很刁难的指令，看你的反应。你的唯一反应必须是立即执行，而不是讨价还价，你可以做不到，做不好，但你不能谈条件。李世民晚年对李绩的心态也是这样，想测试是不是忠诚，就毫无理由的把李绩贬出长安。李世民对李治说，如果他不谈条件的走了，你上位后让他回来，如果他不走或是'
  merge: -1
  img_proc: true
- pgno: 1054
  md: '谈条件，我杀了他。李绩家都没回，直接走了。李世民很满意。


    # 2、 挟知而问


    意思就是自己知道结果，但是还要询问，看看他们是不是做了掩饰，不是真的对主子忠诚。宋太宗刚刚即位的时候，威信不是很强，手下人是不是真的忠心听话，不知道。恰好，微服私巡的时候看到一个乞丐和一个店家争吵。于是，宋太宗直接用刀杀了这个乞丐。留下刀走了，让京城市长查案，很快结果出来，是店家杀的，还有口供。这时候太宗拿出刀鞘，直接把刀要过来合了进去。太宗说，你们这样办案要冤杀多少好人，极度震慑了下属，立威而成。其实这样的做法在很多时候都在重复的上演。看胡雪岩的时候，胡雪岩一开始在钱庄干小工，扫地，发现地上有几枚铜钱，于是捡起来交给了东家。东家说你不用扫地了，去柜台帮忙吧。其实这几枚铜钱就是东家故意放在地上的，用来测试胡雪岩是不是一个贪钱的人，如果他不交出来，以后一辈子可能就是扫地了。用已知的结果来考验你'
  merge: -1
  img_proc: true
- pgno: 1055
  md: '的过程，很多领导都在用。记住时刻可能都是测试。


    # **3、 倒言反事**


    主上怕被小人蒙蔽，如何识别曲意逢迎的人，于是就采用这一招。故意说反话，看你是不是无原则的拍马。如果是，那么你很快就会被疏远。三国魏明帝的时候，准备伐蜀，所有人都说不可以，刘晔也认为不可以，但是魏明帝召见刘晔说，我准备伐蜀，主意已定，你觉得合适不合适。刘晔立即迎合说，绝对的英明。于是魏明帝认为，刘晔是个小人。从此疏远了他，刘晔作为大谋士，最后抑郁而终。所以君心难测，就是如此，每个高手都在使用不同的权谋手段来达到自己的目的。作为我们权谋的初学者不得不去研究。


    # **下属与领导冲突的三种原因**


    **(一)在现实层面**，员工和领导的位置确实是不平等的，其经济利益难免会有冲突，这在任何时代都难以完全避免。


    1056'
  merge: -1
  img_proc: true
- pgno: 1056
  md: '(二)沟通不畅：职场人士都渴望与领导建立良好的关系，而员工上司之间存在的最常见的障碍就是缺少沟通，员工不好意思沟通、不敢沟通、不知道如何沟通等时有发生。


    (三)在心理学的层面，精神分析认为每个人都会不同程度的自恋，或称自爱，以自我为中心，在潜意识中会假设和要求别人就是 “应该 ” 理解自己，“应该 ” 为自己服务，而容易忽略了对
    方也是一个独立的人，有自己独立的感受和需要。


    如何与领导搞好关系，减少和避免不必要的矛盾呢？


    (一)尝试接受与领导事实上不平等的现实，比尔盖茨曾说： “人生是不公平的，习惯去接受它吧。 ”所以，对人生的不完美应采取顺其自然的态度，把更多精力投入自己能做好的事情上，高质量履行自己职责，完成工作任务是与上司建立良好关系的前提，千万不要忽略了这一点。有的人通过消极怠工的方式来反抗领导，并不是明智的做法，反而容易和领导的关系进一步恶化。


    1057'
  merge: -1
  img_proc: true
- pgno: 1057
  md: '(二)凡事多沟通，加强与上司之间的互相理解，减少可能的误解，在工作中要善于把自己的强项表现出来，让上司知道你有这个能力去很好地完成任务，让自己的能力得到肯定。记住：老板不是高不可攀的，有事情多和领导谈谈，老板会理解你的。


    (三)学会换位思考，理解领导的苦衷，不要遇到什么事首先去抱怨领导的不对，做到领导理亏时给他留台阶，避免当众纠正领导的错误。对领导的期望别太高，尤其是有明显人格缺陷的领导，尽量积极配合其工作是上策。


    (四)不要仅仅因为和领导关系不好而轻易跳槽，在跳槽前需要反思一下，自己的哪些认知和行为方式导致了目前的困境，会不会到了新单位，又遇到老问题？自查自省的良好习惯是会让人终生受益。'
  merge: -1
  img_proc: true
- pgno: 1058
  md: '# 职场争斗中的陷阱


    许多人一听到职场争斗，第一个反应就是避而远之，不愿卷入办公室的尔虞我诈里，遗憾的是，那些想要明哲保身、图个耳根清净的上班族，最后还是没有脱离是非圈，甚至可能连工作都莫名其妙丢了，编辑此文，并不是要教你诈，而是教你看清世事，认清人性，让你在职场中能更好地保护自己。


    1059'
  merge: -1
  img_proc: true
- pgno: 1059
  md: '# **“先下手为强”**


    中国有句成语—— “芳兰当户，不得不锄”。在职场中，同样存在着这样的一个道理，跟主子穿一条裤子打天下的臣子，常常第一个被杀掉。


    刘涛从大学一出来，就跟了现在这个老板，经过几年的拼搏，公司现在也有了一定的规模，而他也算是劳苦功高的重臣了。所以，当人事部晋升他为总经理特别助理时，公司其它同事都没有任何异议。自刘涛出任特别助理以后，他凡事总是亲历亲为，对待员工，也是理让有加。公司的各项工作也做得十分出色。这对于他的顶头上司来说，简直就是如虎添翼。在每次主管会议上，总经理都是对他大加赞赏。一次总经理还特别提意，让刘涛给公司做一份详细的计划书，好在国外开拓一个新的市场。


    在了解各个部门的情况之后，刘涛把一份厚厚的计划书，交给了总经理。“刘涛呀!你的计划书做得很好，而且内容也很详细，但是有一个问题，别的人'
  merge: -1
  img_proc: true
- pgno: 1060
  md: '对这个项目都不熟悉呀，对于人员问题，我考虑了一下，可能就只有你最合适了。所以公司决定在法国设立一个办事处，请你过去担任驻法代表。同时为了使你无后顾之忧，公司还为你准备了一套房子，你的出差费全都由公司承担。”多么优厚的待遇啊!公司所有同事对刘海投来了羡慕的眼光。可只有刘海自己心里清楚，总经理是担心自己一不小心“功高盖主”
    ，抢了他的风头，阻碍了他的仕途，找了个理由把身边最亲近的人外放了而已。


    历史上许许多多为草莽出身的皇帝打天下的臣子，后来都没有好的下场。刘涛的“功高盖主”，正是因为他的大力改革，凡事亲厉亲为。虽然看似对老板有利，但是和老板一起打拼多年，其威望在员工心里也很高。而老板就怕这种情况会给自己带来威胁。所以，最后他遭到了“外放架空”的命运。


    在主人的眼中，臣子是他的工具，那工具对他有利时，他会重用;无利时，他就要除去。不要以为，你'
  merge: -1
  img_proc: true
- pgno: 1061
  md: '给老板打拼多年，无功也有劳，他会一直善待你的。如果你自认是“芳兰”，那么你就要学会先下手为强的道理，在老板还来不及下单诇前，就做好万全的准备，使自己不至于陷入他的陷阱当中。


    # ## “利用”第三者


    当上级主管与直属主管的命令不一致时，在职场中的你，不妨多长一个心眼……


    杨志是一家报社的编辑，现在的他正愁着稿子怎样处理呢？原来，在选题会后，报社副总特别把他叫过去，针对这一期的选题给他布置了一个特别的任务，可副总给他下达的命令却和自己先前部门主任下达的命令有明显的不同。两个领导都是个性极强的人，得罪哪边都不行，这下可把杨志给难住了。下属遇到主管不和，就像夹心饼干，若不懂得明哲保身，而涉身其中的话，纵使错根本不在自己，也往往会成为矛盾的牺牲品。尤其是社会新鲜人，不'
  merge: -1
  img_proc: true
- pgno: 1062
  md: '知如何处理这种状况，当情绪累积到一段时间后，就会变成负面的抱怨与批评。

    如此一来，这些抱怨与批评，难免会传到直属主管耳中。不断恶性循环的结果，会使自己与直属主管间产生不信任，因此，在单位内难以立足，最后只能选择离开。


    当上级主管与直属主管的命令不一致时，你要学会“利用”第三者。这位第三者最好是直属主管的平行主管，且这个第三者在组织内发言具有公信力，让他替自己去与直属主管沟通。把这一情况说明后，让自己的直属主管去和领导沟通。下属与直属主管之间的互信很重要，下属只能提醒直属主管，上级主管的要求有什么地方不同，这样才不会造成越级报告的大忌，让直属主管自己去协调或定夺这一事情，比你自己去处理更有利得多。


    # 分享他人的秘密'
  merge: -1
  img_proc: true
- pgno: 1063
  md: '如果别人对你说出秘密，也交换了你的秘密，你就要小心了。如果你说出他的，他就会说出你的。


    小莉是一个才进公司的新人，工作做得蛮出色的，就是整天没有一点笑容。公司的李姐很热心地邀请小莉去吃饭，说着，说着，李姐就告诉了小莉自己的秘密。听着李姐的这些事，小莉不禁愣住了，觉得李姐就似一面镜子，和自己心心相惜。于是乎，小莉把自己的心事也全都说了出来。原来，小莉爱上了自己的上司。可没多久，同事们都用一种奇怪的眼光看着她。终于有一天，马姐偷偷地对小莉说：“你的事，大家都知道了!其实，你的事不该告诉李姐，她是个大嘴巴，说她知道你的私事”。

    “可是她，她不也一样……。”小莉疑惑地说道。马姐笑笑地对小莉说道，什么一样?人家李姐和她老公幸福得很哟。


    小莉的失败在于，以为别人与自己有相同的遭遇，就轻易说出自己的秘密。我们要知道，不论对别人'
  merge: -1
  img_proc: true
- pgno: 1064
  md: '说自己的秘密，或去听别人的秘密，那都没什么好处，你可能有“短利”，也可能有“长害”，何况在秘密传递的过程中，又会产生许多副作用。


    要跟一个人建立特别亲密的关系，最直接的办法，就是分享他的秘密。为了达到这个目的，人们会使用各种手段，他们可以为你算命，为你填表，为你做心理测验的游戏，也可以用他们的秘密来交换你的秘密：甚至用“假秘密”换你的“真秘密”。同样的，如果别人对你说出秘密，也交换了你的秘密，你就要小心了。如果你说出他的，他就会说出你的。更遭的就是人家用“假心”换来了你的“真心”。'
  merge: -1
  img_proc: true
- pgno: 1065
  md: '# 与上司相处的九个准则


    每一个人都有一个直接影响他事业、健康和情绪的上司。与你的上司和睦相处，对你的身心、前途都有极大的影响。以下九条准则可供参考：


    +   一、倾听。我们与上司交谈时，往往是紧张地注意着他对自已的态度是褒是贬，构思自己应作的反应，而没有真正听清上司所谈的问题，并且能理解他的话里蕴含的暗示。这样，才能真正理解上司的意图，明智地作出反应。怎样做到这一点呢？当上司讲话的时候，要排除一切使你紧张的意念，专心聆听。眼睛注视着他，不要死呆呆地埋着头，必要时作一点记录。他讲完以后，你可以稍思片刻，也可问一两个问题，真正弄懂其意图。然后概括一下上司的谈话内容，表示你已明白了他的意见。切记，上司不喜欢那种思维迟钝、需要反复叮嘱的人。


    +   二、简洁时间、就是生命，是管理者最宝贵的财富。办事简洁利索，是工作人员的基本素质。简'
  merge: -1
  img_proc: true
- pgno: 1066
  md: '洁,就是有所选择、直截了当、十分清晰地上司 报告。记备记录是个好办法。使上司在较短的时间 内，明白你报告的全部内容。如果必须提交一份详 细报告，那最好就在文章前面搞一个内容提要。有
    影响的报告不仅反映你的写作水平，还反映你的思 考能力。故动笔之前必须深思熟虑。


    三、讲一点战术。如果你要提出一个方案，就要 认真地整理你的论据和理由，尽可能摆出它的优 势，使上司容易接受。如果能提出多种方案供他选 择，更是一个好办法。你可以举出各种方案的利
    弊，供他权衡。不要直接否定上司提出的建议。他 可能从某种角度看问题，看到某些可取之处，也可 能没征求你的意见。如果你认为不合适，最好用提 问的方式，表示你的异议。如果你的观点基于某些
    他不知道的数据或情况，效果将会更佳。别怕向上 司提供坏消息，当然要注意时间、地点、场合、方 法。愿意优雅地向上级告诫“皇帝没穿衣服”的下 属，最终会比只晓得献媚而使上级做出愚蠢决策的
    下属境遇好得多。'
  merge: -1
  img_proc: true
- pgno: 1067
  md: '四、解决好自己份内的问题。没有比无能解决自己职责分内问题的职员更使经理浪费时间了。解决好自己面临的困难，有助于提高你的工作技能、打开工作的局面，同时也会提高你在上司心目听地位。


    五、维护上司的形象。良好的形象是上司经营管理的核心的灵魂。你应常向他介绍新的信息，使他掌握自己工作领域的动态和现状。不过，这一切应在开会之前向他汇报，让他在会上谈出来，而不是由你在开会时大声炫耀。当你上司形象好的时候，你的形象也就好了。


    六、积极工作。成功的领导者希望下属和他一样，都是乐观主义者。有经验的下属很少使用“困难”、“危机”、“挫折”等术语，他把困难的境况称为“挑战”，并制订出计划以切实的行动迎接挑战。在上司前谈及你的同事时，要着眼于他们的长处，而不是短处。否则将会影响你在人际关系方面的声誉。'
  merge: -1
  img_proc: true
- pgno: 1068
  md: '七、信守诺言。只要你的长处超过缺点，上司是会容忍你的。他们最讨厌的是不可靠，没有信誉。如果你承诺的一项工作没兑现，他就会怀疑你是否能守信用。如果工作中你确实难以胜任时，要尽快向他说明。虽然他会有暂时的不快，但是要比到最后失望时产生的不满要好得多。


    八、了解你的上司。对上司的背景、工作习惯、奋斗目标及他喜欢什么、讨厌什么等等了如指掌，当然于你大有好处。如果他爱好体育，那么在他所在的运动队刚刚失利后，你去请求他解决重要问题，那就是失策。一个精明强干的上司欣赏的是能深刻地了解他，并知道他的愿望和情绪的下属。要审慎考虑问题。如果你的上司没有大学文凭，你也许会以为他忌妒你的硕士学位，但事实上，也可能他会为能显示自己有一个硕士当下属而骄傲。


    九、关系要适度。你与上司单位中的地位是不同的，这一点心得有数。不要使关系过度紧密，以致卷入他的私人生活之中。过分亲密的关系，容易使他感到互相平等，这是冒险的举动。因为不同寻常'
  merge: -1
  img_proc: true
- pgno: 1069
  md: '的关系，会使上司过分地要求你，也会导致同事们的信任，可能还有人暗中与人作对。任何把自己的地位建立在与上司亲密关系上的人，如同把自己扎在沙滩上一样。与上司保持良好的关系，是与你富有创造性、富有成效的工作相一致的，你能尽职尽责，就是为上司做了最好的事情。


    # 办公室里如何掌握说话技巧


    在办公室里与同事们交往离不开语言，但是你会不会说话呢？俗话说“一句话说得让人跳，一句话说得让人笑”，同样的目的，但表达方式不同，造成的后果也大不一样。在办公室说话要注意哪些事项呢？


    不要人云亦云，要学会发出自己的声音。'
  merge: -1
  img_proc: true
- pgno: 1070
  md: '老板赏识那些有自己头脑和主见的职员。如果你经常只是别人说什么你也说什么的话，那么你在办公室里就很容易被忽视了，你在办公室里的地位也不会很高了。有自己的头脑，不管你在公司的职位如何，你都应该发出自己的声音，应该敢于说出自己的想法。


    # 有话好好说，切忌把与人交谈当成辩论比赛。


    在办公室里与人相处要友善，说话态度要和气，要让人觉得有亲切感，即使是有了一定的级别，也不能用命令的口吻与别人说话。虽然有时候，大家的意见不能够统一，但是有意见可以保留，对于那些原则性并不很强的问题，有没有必要争得你死我活呢？的确，有些人的口才很好，如果你要发挥自己的辩才的话，可以用在与客户的谈判上。如果一味好辩逞强，会让同事们敬而远之，久而久之，你不知不觉就成了不受欢迎的人。'
  merge: -1
  img_proc: true
- pgno: 1071
  md: '# 不要在办公室里当众炫耀自己。


    如果自己的专业技术很过硬，如果你是办公室里的红人，如果老板非常赏识你，这些就能够成为你炫耀的资本了吗？再有能耐，在职场生涯中也应该小心谨慎，强中自有强中手，倘若哪天来了个更加能干的员工，那你一定马上成为别人的笑料。倘若哪天老板额外给了你一笔奖金，你就更不能在办公室里炫耀了，别人在一边恭喜你的同时，一边也在嫉恨你呢！


    # 办公室是工作的地方，不是互诉心事的场所。


    我们身边总有这样一些人，他们喜欢向别人倾吐苦水。虽然这样的交谈能够很快拉近人与人之间的距离，使你们之间很快变得友善、亲切起来，但心理学家调查研究后发现，事实上只有1%的人能够严守秘密。'
  merge: -1
  img_proc: true
- pgno: 1072
  md: '所以，当你的生活出现个人危机，如失恋、婚变之类，最好还是不要在办公室里随便找人倾诉；当你的工作出现危机，如工作上不顺利，对老板、同事有意见有看法，你更不应该在办公室里向人袒露胸襟，任何一个成熟的白领都不会这样“直率”的。自己的生活或工作有了问题，应该尽量避免在工作的场所里议论，不妨找几个知心朋友下班以后再找个地方好好聊。


    说话要分场合、要有分寸，最关键的是要得体。不卑不亢的说话态度，优雅的肢体语言，活泼俏皮的幽默语言这些都属于语言的艺术，当然，拥有一份自信更为重要，懂得语言的艺术，恰恰能够帮助你更加自信。娴熟地使用这些语言艺术，你的职场生涯会更成功！'
  merge: -1
  img_proc: true
- pgno: 1073
  md: '# 应对领导的控制——潜伏


    绝大部分职场新人在遇到领导时，首选放弃，或者辞职或者换岗，总之是避着走。但这种方法并不可取，因为领导在职场中比比皆是，在基层更是数不胜数，就算换工作，又怎么保证新上司就不属于此类呢？


    有些人总觉得，自己的上司是“**”，是前所未有的“孤品”。但我可以向各位保证，这样的上司太多见了，是为数最多的一类上司，每个人的职场生涯中或多或少都会碰到这样的上司。逃避绝对不是办法，你可以逃一次，却逃不了一辈子，只有找到战胜这类上司的方法才能一劳永逸。'
  merge: -1
  img_proc: true
- pgno: 1074
  md: '还有些人虽然不逃避，却采用硬碰硬的方法。这种方式看起来很悲壮，但结局却往往两败俱伤，下属伤得更重。因为无论如何，领导也是上司，他们就算自己过不好，要打压下属也是很容易的事情。即便你在对抗中成功了，拼个你死我活对你又有什么好处?你的职场生涯又有什么好处?职场是个特别需要理性的地方，是一个要看未来几十年发展的地方，绝不能逞一时之快。


    那么，怎样面对这样变态的 “*” 上司呢？


    唯一的法则就是 “潜伏” 。


    你要看到，就算是在领导的部门里，也会有混得不错的人，这些人通常有几种特性：


    首先是 “无能” ，这类人没有表现出自己的能力，看起来远远不如上司能干，所以能让上司放心。


    其次是 “逆来顺受” ，这类人似乎没有性格，没有脾气，不管上司怎么对他们，他们都笑脸相对，从不硬碰硬。'
  merge: -1
  img_proc: true
- pgno: 1075
  md: '最后是“听话”，上司要他做眼线他就做眼线，要他办事他就办事，几乎成了上司的左膀右臂，上司一天都离不开他。


    绝大多数人都会看不起这样的人，觉得这些人是在混日子、熬日子，甚至是当变态上司的爪牙。但有句古话说：吃得苦中苦，方为人上人。这里的吃苦绝不仅仅是指肉体上的，更是指精神上的。


    “潜伏”和“混日子”是两个完全不同的概念。只有那种没有目标，只想过一天算一天的人才叫“混日子”，而有目标，知道自己在做什么，心里面有杆秤，知道黑白对错，只是暂时低头屈就的人绝不是“混”，而是在“潜伏”。


    面对领导你不可以暴露出野心，就算你有远大的目标，也只能暂时“潜伏”，做出混日子的样子。既然上司喜欢控制一切，那你就让他控制。必须要记住，工作能力强不是表现好，满足上司的控制欲才是真正的良好表现。你需要做的就是成为上司的一枚棋子，让他敢于用你，放心地用你，甚至到最后不得不用你，少了你不行。'
  merge: -1
  img_proc: true
- pgno: 1076
  md: '这就是满足上司控制欲的成果：你成为上司能力的替代品，成为他的手臂或者眼睛，缺了你了上司自己就无法生存下去。而“潜伏”到那一天，才是你可以翻身的日子。因为你用潜伏的代价，换来了战胜上司的资本。


    # 越不让你做的越重要


    领导会有很多禁忌，会给下属制定一系列规则。很多人因为害怕上司，所以不敢越雷池半步。实际上，领导越不让你做的事情就越重要，你越要去做。


    前文一再重复，领导是最怕下属进步，最怕下属超越自己的。一言蔽之，领导把好的、有利的事情都划入保护圈，不让下属做。


    这就形成了一种模式：凡是上司让你去做的，都是没什么油水却很可能背黑锅，做死做活都没好处的'
  merge: -1
  img_proc: true
- pgno: 1077
  md: '工作;凡是上司不允许你去做的,才是真正的核心工作,是真正能让你得利的事情。所以,要明确一个观点:


    领导说是好的,事实就是坏的;他说是坏的,事实也许是好的。要坚信这一点,不要天真,不要抱有侥幸。


    所以在工作里,你必须有两面。表面上你是上司的人,事事受他的控制,做他的提线木偶,他要你做好什么,你就得做好什么。而另一面,你则是自己的人,必须清楚什么对自己有好处,什么是浪费精力。你必须偷偷去做上司不允许你做的事情,在这方面的投入的精力甚至应该超过上司分给你的工作。但值得注意的是,你私下做的事情决不能让上司知道,这是你潜伏在职场的秘密,不能对任何人透露。任何风吹草动,都能令领导感觉到威胁。没有直接对抗上司的实力,就要把野心深藏起来。'
  merge: -1
  img_proc: true
- pgno: 1078
  md: '# 喂养上司步骤


    领导的喂养法则。从一开始，你通过装傻潜伏在他的身旁，减轻他的戒备心;然后你利用他的控制欲，让他逐渐信任你;再接着，利用他对你有限的信任，更多地接受工作，接触资源，在事实上取代了他;最后，你走出了他最不希望看到的一步，就是获得更高层的支持。


    潜伏了这么久，隐忍了这么久，你想要的东西都已经得到，现在是反击的时候了。


    可能许多人都在想，不就是一个上司吗，为什么需要准备这么多，隐忍这么久?难道要点花招儿就不能扳倒他吗?事实是不能，因为职场里有森严的等级制度，对新人来讲，这是难以逾越的障碍。如果说职场是一家餐厅，那么普通职员都是站着吃饭的，只有管理层才有资格坐在餐桌前。


    你的上司无论多狭隘，无论多不讨人喜欢，可他毕竟是管理者。你觉得自己是要打败一个上司，而实'
  merge: -1
  img_proc: true
- pgno: 1079
  md: '际上，你是在等待机会，等待一个可以坐下来的机会。


    千万别把扳倒上司当做最终目的，那只是过程，你需要通过突破上司的囚笼来实现职场目标。在职场上，大家都是为了利益忙碌，个人恩怨其实并不重要，如果投入太多个人情感很容易用力过猛，会有反作用。


