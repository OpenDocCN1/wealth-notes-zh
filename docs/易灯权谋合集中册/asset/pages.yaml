- pgno: 179
  md: '骑、童子下凡变的，而孙猴子为什么动不动就上天去搬救兵，说白了，联络各部关系，让各位大仙认识一下唐僧，在战火中培养出的感情，以便唐僧接触各方神圣，建立神际关系网。


    至于政绩，是历经苦难取得真经么？非也非也，真正的政绩是唐僧们一路灭了无数妖魔鬼，又收伏了无数妖魔鬼，为天庭提拔了一批骨干力量，建立了一个广泛的群众基础。


    为什么说“吃了唐僧肉长生不老”是一句谣言呢？第一个说这话的妖怪是谁，白骨精！后来的金角大王也教育弟弟说：“……我当年出天界，尝闻得人言：唐僧乃金蝉长老临凡，十世修行的好人，一点元阳未泄，有人吃他肉，延寿长生哩。”观音不是在长安嘱咐众神“汝等不可走漏消息”么？怎么现在变成地球人都知'
  merge: -1
  img_proc: true
- pgno: 180
  md: '道了？是谁传出这个信息呢？还不是观音自己。这叫引蛇出洞一网打尽，省事。


    那么，为什么我又敢说唐僧之取经，不过是为了接班人的培养计划呢？所有的谜底都在《西游记》的结尾揭开。依如来的说法，西天取经的原意，是为了普渡众生，而唐僧历经艰苦取得真经，就应该留在大唐，像历史上的玄奘大师那样翻译传播，为普度众生奉献自己的一生才对。但小说告诉我们，金刚把唐僧们送到长安，停在空中叫道：“圣僧……汝自去传了经与汝主，即便回来。我在霄汉中等你，与你一同缴旨。”看看，传了经给唐王就回西天就职去，一刻都不能耽误，哪来普度众生的样子？


    而唐僧师徒回到灵山之后，如来对4人的考评、授职和使用，有根有据，合情合理，较之玉帝'
  merge: -1
  img_proc: true
- pgno: 181
  md: '一会儿弼马温，一会儿齐天大圣，水平高下不言自明。纵观整个西游故事，如来作为最高领导，计算之精，安排之密，成果之丰硕，足令人高山仰止，回味无穷。


    # 从事件看官场潜规则


    取经是一个大肥差


    取经这件事，表面上看历经千辛万苦，这罪没人愿意受，这活也是没人愿干的苦差事。但仔细一琢磨，又似乎不是那么回事。你看，悟空十几年前还在五行山下服刑，后来给了他一个戴罪立功的机会，结果放出来后，经过十四年就已成佛。唐僧被如来贬下界去，经过十世修行，也成了佛，这个过程不超过五百年，因为镇元大仙让弟子好好接待唐僧一行时，曾说过这样的话，“那和尚乃金蝉子转生，西方圣老如来佛第二个徒弟。五百年前，我与他在兰'
  merge: -1
  img_proc: true
- pgno: 182
  md: '盆会上相识，他曾亲手传茶”，可见那时金蝉子还在天上，并在重要会议上做过端茶倒水的工作。


    相比之下，镇元大仙自己有四十八个弟子，其中“两个绝小的”是清风和明月，都已经分别有一千三百二十岁和一千二百岁了。清风、明月在修道过程中肯定吃了很多苦，而所得却相对有限，虽然有镇元这样的名师指点，迄今还不过是童子而已。这样看来，取经事业绝对是一条快速成佛的捷径，是一个超级大肥差。对这样的说法，有人会不同意，说你这是“事后诸葛亮”，在出发之前，唐僧、悟空并不知道会有这么好的结果。好，就算唐僧、悟空不知道，但安排这次取经活动的如来佛事前总知道吧，因为这个结果本身就是他安排的，是由他的意志所决定的。于是问题产生了：如来为什'
  merge: -1
  img_proc: true
- pgno: 183
  md: '么要把这么大好事安排在唐僧、悟空，而不是其他人的头上。


    当然，在取经队伍中，并不是每个人得到的好处都那么大，如果这样，取经行动在世人眼中就真成了镀金行动了，这在社会舆论上会造成一些不好的后果。对猪八戒、沙僧来说，取经行动的收益与取经过程中付出的成本相比，收益似乎不算特别吸引人，对八戒来说尤其如此。他们算是做了取经行动的陪衬了吧。


    有趣的是，在如来给取经队伍论功行赏之际，在干部人事任命大会这样庄重的场合，猪八戒感到不公平，竟然嚷嚷起来：“他们都成佛，如何把我做个净坛使者？”八戒话里面的“他们”指的是唐僧与悟空，不过，我们似乎可以把唐僧与悟空分开来看。八戒感到不公平，可能并不是拿自己与悟空相比，而是拿自己与唐'
  merge: -1
  img_proc: true
- pgno: 184
  md: '僧相比。觉得连唐僧都能成佛，自己在取经过程中也吃了不少苦，受了不少罪，做个净坛使者，是不是有点太低，太说不过去了。从这种意义上说，八戒的话也可以颠倒过来理解，“我只做了个净坛使者，他们怎么都成佛了”。八戒不完全是觉得自己的待遇低，而是觉得受到的待遇不公平，就像孔子说的，是“不患寡而患不均”。其实，八戒没有什么好抱怨的，在取经路上六丁六甲、五方揭谛、四值功曹、一十八位护教伽蓝也一直在暗中保护唐僧，没有功劳也有苦劳。结果唐僧等人功成，五圣成真之际，他们却没有任何封赏，人比人还真是气死人呢。所以要调整好心态，不要随便跟人比，特别是不要跟那些不该比的人比。


    乌巢禅师是世外高人，平时并不过问政治，但以他的政治觉悟，一看到唐僧带领的取经队'
  merge: -1
  img_proc: true
- pgno: 185
  md: '伍，便本能地认识到这是一次重要的机会。见八戒跟着唐僧，禅师“惊”问道：“你是福陵山猪刚鬣，怎么有此大缘，得与圣僧同行？”


    （第十九回）觉得八戒能进入取经队伍，是一个天大的造化。乌巢不明白的是，这个造化其实主要是应在孙悟空而不是猪八戒的身上。但从乌巢的潜台词看，唐僧到西天的正果不会小是理所当然的。而这件事，是在猪八戒加入取经队伍的同
    一 回发生 的。


    取经行动是一个一石数鸟的安排。一方面，借这次机会把经书送到东土，在大唐扩展佛教的势力；另一方面，把孙悟空、猪八戒、沙僧纳入门下，收编一些玉帝体系受排挤的势力，虽然这几个人似乎算不得什么，但由此发出的信号所能够产生的作用是巨大的，这会使西天对那些在天庭混得不得意的神仙产生莫大的吸'
  merge: -1
  img_proc: true
- pgno: 186
  md: '引力；从这种意义上说，取经行动是一项能大大增强西天“软实力”的行动。此外，如来还有一个非常重要的目的是，把自己看中的金蝉子提拔起来。


    取经行动的主要目的，并不在于把经书传到东土。依如来的说法，西天取经的原意，是为了普度众生，如果这样，唐僧历经艰辛取得真经后，就应该留在大唐，像历史上的玄奘大师那样，翻译著述传播，为普度众生奉献自己的一生才对。结果却是，当唐僧一行回到东土之际，唐太宗想请唐僧将真经演诵一番。唐僧刚要演诵经书，八大金刚从半空中现身高叫：“诵经的，放下经卷，跟我回西去也。”于是唐僧将经卷丢下，相随腾空而去。吴承恩如此写，意图十分明显，就是要说明，经书并不一定非要由唐僧送到东土，才能达到在中土宣传佛教教'
  merge: -1
  img_proc: true
- pgno: 187
  md: '义的最大效果。由别人取回去并没有太大分别，反正他把经书放下就不管了。


    在狮驼岭一役，当孙悟空在三个妖怪的手下遭到挫败之时，还在那里寻思，觉得取经行动是如来坐着没事干折腾出来的，如来其实舍不得把经书送到东土。孙悟空所想的其实是再浅显、再明白不过的道理。如果如来的目标只在于把经书送到东土，就算是唐僧领导的队伍，也可以在徒弟的保护下，采取腾云驾雾的方式（相当于在现代坐飞机去），迅速达到目的，这还可以节省时间，让东土之人早日见到经书。何况，如来的手段和神通，要把经书送往东土，毫无疑问可以通过很多种更容易的方式做到。如来非要他们“苦历千山，远径万水”，一步步行来，他这样做，不仅增加了取经队伍的难度，也增加了佛祖、观音工作的难度。这'
  merge: -1
  img_proc: true
- pgno: 188
  md: '肯定是另有所图，而且所图非小。


    其实在此以前，就有多支取经队伍试图前往西天，光沙僧在流沙河就吃掉了九个取经人。沙僧本人曾对观音大言不惭地说：“向来有几次取经人来，都被我吃了”。由于九个取经人的骷髅在“鹅毛也不能浮”的流沙河中并不沉下去，他认为是异物，“将索儿穿在一处，闲时拿来顽耍”。这充分说明，光有虔诚之心不能保证真能取到经书，因为路上死得太多了。也不想想，到西天取回经书这样的好事，哪能随便落到那些背景不清、来历不明的人头上。不过由唐僧带领的这支队伍就不同了，他们是只许成功、不许失败的。


    如此看来，取经行动的主要目的还在人事方面，毕竟人才是第一位的嘛。以孙悟空而论，'
  merge: -1
  img_proc: true
- pgno: 189
  md: '从玉帝那里转到西天，给予一个相应的级别是符合官场规则的，但要越级提拔金蝉子这事就难了。


    # 金蝉子是如何进入取经队伍的


    为了使金蝉子成为取经队伍的掌权人，如来先把他贬到东土，取得大唐国籍，从而有了进入取经队伍的资格。然后又派遣心腹观音菩萨前往“寻访”取经人。这就相当于先把自己看中的人放下去，然后派遣自己信得过的人下去挑选“干部”后备人选，这么一放一收，就实现了培养的目的。我们看一下确定取经人的过程：


    > 如来说：“怎么得一个有法力的，去东土寻一个善信，教他苦历千山，远经万水，到我处求取真经，永传东土，劝化众生，却乃是个山大的福缘，海深的善庆。”'
  merge: -1
  img_proc: true
- pgno: 190
  md: '性修养不好，希望找个信佛的把经书传送到东土，劝化众生。如果是从完成这项任务的角度选人，并不是什么难事，很多人都能做到。如果有诸天神佛在背后再帮助一下，这简直是很轻松的事情。按这个标准选人，可选的人很多，被选中的很可能就不是金蝉子了。


    明明不是一件难事，如来却说“怎么得一个有法力的”人去，这话大有深意啊。观音出来主动承担这项任务后，如来大喜道：“别个是也去不得，须是观音尊者，神通广大，方可去得。”


    不过是找一个“善信”之人，怎么要用到观音“神通广大”的本事呢？这里的神通广大显然不是指观音的识人之能来说的，而是有两个方面：一方面，观音善能揣摩如来的心意；二是她不仅能揣摩到如来的心意，还有本事能把事给办成了。与此相对应的具体的两个方面就'
  merge: -1
  img_proc: true
- pgno: 191
  md: '是：一方面，如来属意的取经人选是被提前安排贬入凡尘的金蝉子，这一点不能明说，但如来确信观音能想到这一点，所以很高兴；另一方面，去的这个人还要把金蝉子转世后的这个人找出来，这个任务并不那么简单，不过观音肯定能做到，所以观音是此去寻找取经人的不二人选。


    如来怎么就肯定观音一定能找到转世后的金蝉子呢？一方面，观音确实有大神通，能知过去未来，对观音的本事，如来是了解的。另一方面的原因我们看看观音寻访取经人的过程就非常清楚了。


    却说观音领了如来的佛旨以后，在长安寻访了很长时间，却没有碰到“真正有德行的”（其实重点当然不是碰到的人都没有德行）。正在这个时候，唐太宗要办水陆大会，并让陈玄奘'
  merge: -1
  img_proc: true
- pgno: 192
  md: '做坛主。观音听到消息，是什么反应呢？“忽闻得太宗宣扬善果，选举高僧，开建大会，又见得法师坛主，乃是江流儿和尚，正是极乐中降来的佛子，又是他原引送投胎的长老，菩萨十分欢喜。”


    这段话揭示出来的信息再清楚不过了。菩萨为何十分欢喜，不是因为陈玄奘德行高深（这她暂时还看不出来），而是知道这“正是极乐中降来的佛子”，更妙的是，原来金蝉子转世是“他原引送投胎的”，即由观音一手操办的。看到这里，佛祖说的“别个是也去不得，须是观音尊者……方可去得”，这话的含义不是再明白不过了吗。这句话，听在别人耳中是一层意思，听在观音的耳中，显然是另有深意了。


    观音“见得”法师坛主是金蝉子，并不是说她亲眼见到了玄奘，而只是说她“知道”的意思。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '为什么说“见得”不是“见到”的意思呢。原来，观音在水陆大会的第七天才决定亲眼去看一下，她对木叉说：“我和你杂在众人丛中，一则看他那会何如，二则看金蝉子可有福穿我的宝贝，三则也听他讲的是哪一门经法。”显然是没有见面就知道此人是金蝉子转世了。这不是如来说的神通是什么，这个神通孙悟空显然是没有的。


    金蝉子被以“上课不认真听讲”的罪名贬下界去，应该是在孙悟空被压在五行山下后不久发生的事情。因为他下界后，是个“十世修行的好人，一点元阳未泄”，把美好的青春都献给了佛教事业。既然经历了十世，总要几百年的时间。如来这一手颇为高明，如果在取经行动


    开始前二三十年把金蝉子贬下界去，那他培养自己人的意图就太明显了。而在几百年前就把'
  merge: -1
  img_proc: true
- pgno: 194
  md: '他贬下界去，这招棋就埋伏得很深了。这两件事之间的关系看起来就比较模糊，人们不大能把它们联系起来。


    # 如来的帝王心术


    孙悟空被压在五行山下，给了如来一个采取行动的契机。如果没有悟空被压这件事，如来应该不会找借口把金蝉子贬下界去，毕竟再要找个合适的理由把金蝉子重新提拔回来是很困难的。现在有了一个像孙悟空这样身份的人做大弟子，那么，金蝉子重回西天之后，身份地位想不高都不行了。连徒弟都这么牛，师父不牛一下，怎么能说得过去呢，那不成个样子嘛。唐僧如果是作为别人的师父到达西天，即使取到经书，给他的安排也不会太高。真是机会难得呀。毕竟像孙悟空这样级别的神仙，如果稍微有点社会经验，是轻易不会犯下如此重大的'
  merge: -1
  img_proc: true
- pgno: 195
  md: '错误的，而且，犯了错误一般也不用劳动如来出手，从而也不会被*在五行山下。这样的机会可遇而不可求，不大大利用一番实在太可惜了。


    唐僧要做悟空的师父，也不是那么容易，毕竟孙悟空是出了名的顽皮。为了让唐僧坐稳师父的位置，如来是使了帝王心术的。把孙悟空压在五行山下后，下一步考虑的就是在什么情况下把他放出来的问题。如果由如来自己放，一来没有什么意思，二来也太便宜孙悟空了，而且无形中贬低了自己，抬高了悟空的身份。在这种情况下，把自己的二弟子贬下凡尘，然后让他把悟空放出来，这就给金蝉子做了一个天大的人情。从此以后，无论如何，孙悟空就欠了唐僧一个很重的
    情，以此为基础，唐僧做悟'
  merge: -1
  img_proc: true
- pgno: 196
  md: '空的师父就名正言顺了。在唐僧有了大徒弟的借力后，自然就可以比较容易地收伏二徒弟和三徒弟，一支队伍就这么拉起来了。相反，如果是派个什么文殊、普贤之类的菩萨来，从五行山下放出孙悟空，然后把他领到唐僧面前，告诉他说，以后唐僧就是你的师父了，悟空肯定不会服气，师徒关系就又大不一样了。没有这一出，孙悟空可能真不听唐僧的，而唐僧一点辙没有。


    如来玩的这一手，《西游记》中的唐太宗在历史上也玩过。贞观二十三年，唐太宗李世民知道自己已是“病瘥弥积”，病得不轻了，遂于当年五月十五，一纸诏书把李世绩调出京师去做叠州都督。当时李世绩已是宰相，出京做地方长官相当于贬职。李世民的考虑是，李世绩和太子李治的关系浅，所以让李治在自己死后'
  merge: -1
  img_proc: true
- pgno: 197
  md: '把李世绩调回来，借此给李世绩一个恩德，这样李治以后才好控制这位在贞观后期逐渐成为军中第一人的将军。李世民的这一招用得颇为高明，它还可以收到一些附带的效果，一是借机敲打李世绩，稍微抑制一下他的权力；而且在这个敏感时期，把他调离中枢，不让李世绩在辅政大臣中名位最重，反而有利于发挥他在军事领域的专长。二是让李治再把他提拔起来，不是在李治刚上台时他就是位高权重的大臣，这样可以避免李治对他的反感，也让李治今后在使用李世绩时更放心些。


    唐僧与悟空的关系与此确实极为相似，如果孙悟空没有犯错误，还在天上好好地做他的齐天大圣。在这种情况下，如来把悟空领到唐僧面前，说以后齐天大圣就跟着你混，那还不把唐僧给吓晕了，他哪敢做这种人的师父。现'
  merge: -1
  img_proc: true
- pgno: 198
  md: '在则不同了，悟空是可怜兮兮地在五行山下盼着唐僧早日来救他。而他如果做出什么于师父不利的事情来，难免在世上背上“忘恩负义”的骂名。


    不管怎么说，如来的这一手玩得颇为高明且成功。对于师父救自己逃离苦海，悟空一直心存感激，至少在口头上始终如此。在三打白骨精一段中，悟空曾给唐僧跪下叩头，说“幸师父救脱吾身，若不与你同上西天，显得我知恩不报非君子，万古千秋作骂名。”在黄袍怪一段中，当猪八戒请回孙悟空时，小猴子们悟空要走，慌忙拦住他，让他别走，悟空说这可不行，“天上地下，都晓得孙悟空是唐僧的徒弟。”看来顶着个师徒名份，有时也是能够压死人的。


    # 唐僧的思维局限'
  merge: -1
  img_proc: true
- pgno: 199
  md: '如来为了提拔金蝉子，所用的一番苦心天日可鉴。不过，唐僧没有佛祖那么高的境界，看事情还不是很透彻，他还憋着劲要赶走孙悟空呢（如来也在哀叹：他怎么就这么不开窍呢）。


    很多人说，没有孙悟空，唐僧到不了西天。可唐僧本人不这么看，他认为只要有观音、佛祖的支持，自己就可以到西天，至于孙悟空，不是最重要的。所以他在取经路上，数次坚决地要赶走孙悟空。他却不知道，到了西天后给他安排的职务大小，在很大程度上就是以他的徒弟为参照系的。如果唐僧就带着八戒、沙僧到西天，那怎么好给他安排高级职务？撑死了也是个副部，这还有人说闲话。要不，就安排个正局级？但如果那样这取经行动干什么费这么大劲啊，如来的一片苦心不也就全泡汤了嘛。不行，必须让唐僧打消这个愚蠢的念头。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '在这种情况下，观音明确地给了唐僧一个警告，唐僧才转变观念，不再提赶走孙悟空的事了。


    我们基本上可以明确的是，只要有如来、观音的支持，没有孙悟空取经队伍也是可以到达西天的。毕竟很多妖怪孙悟空也不是凭自己的本事打败的。观音也可以给八戒弄个救命毫毛什么的。取经事业不是离开孙悟空就玩不转了，没有孙悟空，还可以去找别人嘛。但如来、观音的意思很清楚，他们选来保唐僧的就是孙悟空。由孙悟空保唐僧到西天，能够更好地达到宣传、教育以及选拔人才的多方面目的。由孙悟空保唐僧到西天，与另找一人保唐僧到西天的意义、意思是大不一样的，在这件事上，如来有他的考虑。'
  merge: -1
  img_proc: true
- pgno: 201
  md: '唐僧没有如来站得高，看得远，他不知道佛祖“在下一盘很大的棋”，而只能看到自己眼前的一丁点儿事，总觉得悟空与他不和。却没想到，如来佛对整个取经活动有着通盘的考虑，这件事，就是从悟空被压在五行山下才开始谋划的，唐僧要是赶走了孙悟宄，那不是釜底抽薪，把取经行动的本意给淘空了吗。如来要达到的效果，就是要把这个不好管的刺头放在取经队伍内，再由唐僧给带好了。这样，就可以借取经路途之机，向整个天界社会展示取经队伍的能力与业绩，同时，也通过取经队伍内部的和谐，展示唐僧的“领导”能力，如此，才好名正言顺地把唐僧安排在高级官职岗位上。唐僧只知道死背佛家经典，没有政治家的视野，哪能明白佛祖的这些心思。


    试想一下，如果唐僧手下收伏的不是一个像孙'
  merge: -1
  img_proc: true
- pgno: 202
  md: '悟空这样法力高强、难以管教、曾经让整个天庭都觉得头痛的徒弟，那怎么能显出唐僧的本事来呢？唐僧以一个凡人之身，就能带领悟空、八戒、沙僧这几个如狼似虎的弟子前往西天，这是多好的宣传创意。如来要的就是这个效果，唐僧怎么能负气将悟空赶走呢？赶走了孙悟空，即使取经队伍到达西天，整个取经行动也失败了。如此一比较，如来与唐僧的高下简直判若云泥，真是天壤之别啊。不管怎么说，唐僧也许是个好人，但在政治上还不是很成熟。


    让唐僧一路与孙悟空在一起，也是帮助唐僧的一个办法。唐僧的优点是政策水平高，听朝廷的话，缺点是有点死心眼，不够变通，不深入了解基层情况，实际工作经验不足。唐僧虽然讲起大道理来一套一套的，但他对人际关系的'
  merge: -1
  img_proc: true
- pgno: 203
  md: '理解主要是书本上的那一套，什么“扫地恐伤蝼蚁命，爱惜飞蛾纱罩灯”，“千日行善，善犹不足；一日行恶，恶自有余”，“暗室亏心，神目如电”等等。唐僧在取经路上奉行的，不外乎是温良恭俭让、逢人要讲礼貌，不动百姓一草一木等等之类的行动准则。他对妖怪、强盗也采取劝善的做法，试图以德服人，想把“己所不欲，勿施于人”这一套用到强盗身上。他不知道自己奉行的这一套，在江湖之中是完全行不通的。漫长的取经之旅使他慢慢体会到，书本上描写的主要上是一种理想形态的人际关系。在现实中，还要具体情况具体分析。


    在取经路上，唐僧性格上的弱点多次被妖怪所利用。唐僧以后是要到高官岗位上工作的，不积累一点社会经验、政治经验怎么行？这十四年的锻炼，对于唐僧的成长十分重要，所以啊，'
  merge: -1
  img_proc: true
- pgno: 204
  md: '就让他们在路上慢慢走，不着急，多锻炼锻炼有好处。


    悟空对唐僧的帮助


    孔子说“三人行，必有我师”。悟空身上有很多值得唐僧学习的地方。让他们俩在一起，十几年朝夕相处，怎么着唐僧也能从悟空身上学到不少东西。至少到后来，唐僧做起事情来，不像一开始那么迂腐了。别看孙悟空没有受过多少正规的教育，他对道法、佛法的理解上还是有一些独到之处的，特别是，他善于打破盘中哑谜，能从书本中读出弦外之音、自然之理，这就很难得了。一路上师徒二人讲讲谈谈，从多方面丰富了唐僧对经书的理解。在这些方面，唐僧能从八戒、沙僧身上学习的东西就少多了。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '例如，在第八十五回，孙悟空提醒唐僧，“佛在灵山莫远求，灵山只在汝心头。人人有个灵山塔，好向灵山塔下修。”叫他不要害怕妖怪，也不要光想着西天那点事，老老老实实地把握好自己的心态就行了。又如在第三十六回，悟空对唐僧说：“师父啊，你只知月色光华，心怀故里，更不知月中之意，乃先天法象之规绳也。”唐僧听了悟空的话，“一时解悟，明彻直言，满心欢喜，称谢了悟空。”


    在第九十三回，唐僧见前面一座高山，感到悚惧，此时，师徒之间进行了一场重要对话：


    行者道：“师父，你好是又把鸟巢禅师《心经》忘记了也？”三藏道：“《般若心经》是我随身衣钵。自那鸟巢禅师教后，哪一日不念，哪一时得忘？颠倒也念得来，怎会忘得！”行者道：“师父只是念得，不曾求那师父解得。”'
  merge: -1
  img_proc: true
- pgno: 206
  md: '三藏说： “猴头！ 怎又说我不曾解得！ 你解得 么？ ” 行者道： “我解得，我解得。” 自 此， 三藏、行者再不 作声。旁边笑倒一个八戒，喜 坏一个沙僧，说道：
    “嘴脸！ 替我一般的做 妖 精出身，又不是哪里禅和子，听过讲经，哪里 应佛僧，也曾见过说法？ 弄虚头，找架子，说 什么晓 得，解得！ 怎就不作声？ 听讲！
    请 解！ ” 沙僧说： “二哥，你也信他。大哥扯长话，哄 师父走路。他晓得弄 棒 罢 了，他哪里晓得讲 经！” 三藏道： “悟 能 悟净，休要乱说，悟空 解
    得 是 无 言 语 文 字，乃 是 真 解。” （第 九 十 三 回）


    孙悟空看到唐僧的情绪，说唐僧把《心经》给 忘了。唐僧不服，说《心经》我天天在念，倒 背 如 流，怎么会忘。显 然，唐僧所说的没有忘， 是说他记得其中的每一句话，不过是能背诵的'
  merge: -1
  img_proc: true
- pgno: 207
  md: '意思。悟空说唐僧忘了，是说他没有理解其中的真正含义，特别是还不能融会贯通，身体力行，做到知行合一。唐僧反问悟空“你解得吗”，悟空只说“我解得，我解得”，却不再用语言来解释，就是这个意思了。唐僧倒不糊涂，马上明白了悟空的意思。如此一来，他对佛经的理解就又进了一层。


    来觉得金蝉子这个弟子还是比较有悟性的，不过就是死抠书本，有点教条主义倾向，不能理论联系实际。有些道理，如来不好说，如来说给他听，他也不一定明白。就这样在西天路上，让他慢慢体会，积累实践经验，再由孙悟空在一边旁敲侧击几句，效果就很好。


    另外，孙悟空那种不折不挠的精神、那种勇敢乐观的人生态度，以及变通的处世、灵活的心'
  merge: -1
  img_proc: true
- pgno: 208
  md: '机都是值得唐僧学习的。唐僧特别缺乏“社会经验与政治经验”，安排他做悟空、八戒、沙僧三人的师父，对唐僧是一个巨大的挑战，也是一个极大的锻炼，这对于他以后在官场上混，是很好的启蒙教育。唐僧的性格比较柔弱，在取经过程中吃了这么多苦，对他的性格也是很好的磨练。如果像上一章说的，孙悟空是太上老君的徒弟，那唐僧的收获就更大了，从此与太上老君一系也扯上了关系，这是未来可以动用的极大资源，是仕途发展的重要助力。


    至于安排八戒和沙僧进入取经队伍，则可以起到掩人耳目的作用，表明这次行动，不完全是为了提拔唐僧和悟空而设的。在对八戒与沙僧的安排上，如来也颇费了一番心思。对八戒的安排是，“挑担有功，加升汝职正果，做净坛使者”。对沙僧的安排是，“登山牵马有功，'
  merge: -1
  img_proc: true
- pgno: 209
  md: '加升大职正果，为金身罗汉”。对白龙马的安排是，“加升汝职正果，为八部天龙马”。八戒是“职正果”，沙僧却与唐僧、悟空一样，都是“大职正果”，这样，从职称上，沙僧就比八戒高了一级，八戒则与白龙马是一个级别。不过在官职的排名上，八戒又在沙僧之前。因为在《西游记》最后两段：


    大众合掌皈依，都念：


    南无燃灯上古佛。南无药师琉璃光王佛。南无释迦牟尼佛……南无旃檀功德佛。南无斗战胜佛。南无观世音菩萨。……南无净坛使者菩萨。南无八宝金身罗汉菩萨。南无八部天龙广力菩萨。（第一百回）


    中间是唐僧、悟空和观音，最后三人是八戒、沙僧和白龙马。这个名单，绝对不是排名不分先后，而是按照职务、资历综合平衡得出来的'
  merge: -1
  img_proc: true
- pgno: 210
  md: '次序，先后顺序是一点也马虎不得的。从这里 看，八戒的职务虽与沙僧平级，但排名还是要 靠前一点的。


