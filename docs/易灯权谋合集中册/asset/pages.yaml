- pgno: 318
  md: '形式为内容服务。叔孙通的功绩看似在形式上做文章，为皇帝立威，实质上是为汉朝建立一套完整的中央集权的封建正统制度。没有一定的形式，内容是没法保证的。

    在《史记·郦生陆贾列传》中还写了另一个儒生陆贾。司马迁写道：“陆生时时前说称《诗》、《书》。高帝骂之曰：乃公居马上而得之，安事《诗》、《书》！”意思是陆生常常在高帝前说起《诗》、《书》之事，高帝骂他说，你的高祖皇帝是在战马之上南征北战而得来的天下，哪里是靠什么《诗》、《书》？陆生回答说：“能够马上得天下，但是难道可以马上治天下吗？商汤、周武用武功夺得天下，但靠文才治理天下，文武并用，才是长久之术。过去吴王夫差、晋智伯，极武而亡；秦国重刑法，日益强大，终使赵国灭亡。假使秦国在并得天下后，能行仁义，法先王，高祖你怎么会得到'
  merge: -1
  img_proc: true
- pgno: 319
  md: '秦朝的天下呢？”高祖不愉快面带惭愧之色，对陆生说：“试试为我写一本书，总结秦所以失天下，而汉所以得天下的原因，并且总结自古以来各国成败的道理。”


    陆生从此著书，深入探究存亡之理，共著十二篇。“每奏一篇，高帝未尝不称善，左右皆呼万岁。”此书的名称为《新语》。


    如此三位儒生，郦食其是在谋取天下的方略上辅助刘邦，直至以身殉国；叔孙通是在礼仪上辅助刘邦完善了封建制度，使刘邦感叹“今日知为皇帝之贵也”，对加强中央集权起到至关重要的作用；陆贾则为刘邦治理国家，如何做到长治久安，不再重蹈秦的覆辙，提供了理论依据。可以说，儒生虽然不会打仗，但是能制定战略，与对手谈判，做到不战而屈人之兵；儒生虽然没有皇帝的威严，但可以为皇帝制定'
