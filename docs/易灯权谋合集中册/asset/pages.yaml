  img_proc: true
- pgno: 1041
  md: '谁都像是贼的准备，才可以不被偷。”于是，这种防患心态练就一副炮弹架势。


    具体的表现就是，许多能干的职场人以攻为守，时 时处处都以发现炮灰为终极追求。


    小林与小王是一年前一起进单位的大学生。小林做 事低调，而且很喜欢做自己的工作，因此工作做得 很出色，只是他不善于表功，所以经常更多从工作 中得到的只是“自身的锻炼”。而小王就大不同，
    他在与小林一起合作时，总是能“发现”更轻松的工作内容，但是，面对领导时小王总是能把两人的 工作表达成像他自己一个人的功劳。而且小王总 是在领导在场的时候，表现得积极主动，仿佛单位
    的工作都是他一个人干的：经常会扛着水桶经过领 导开着门的办公室；经常会在领导经过的时候大声 说“这个事情虽然很麻烦，但我一定做好”，经常 充当领导的“眼线”溜进领导办公室密谈，经常对
    同事说“有什么事情就找我”却从来在需要他帮忙 的时候“非常忙”……'
  merge: -1
  img_proc: true
- pgno: 1042
  md: '小王的这种行为，不仅小林，单位与小王接触过的人人都心知肚明，只有小王自己还以为自己拥有职场金刚钻。只是小王渐渐发现，没有人再愿意与他合作了，只要大家有一起合作完成的工作，宁愿一个人完成也不愿与小王合作。也没有人再把他放在自己的人际圈里了，大家聚会都借故不带小王。自然，领导奇怪地发现，他从小王那儿得到的关于下属的信息都是负面的，好像都没有一个好人似的。于是，领导认为这个眼线已经没有价值了，于是暗示小王“以后还是工作期间来汇报工作点好啊”。


    小王以做炮弹的架势却成为炮灰的结果，这是一种必然。炮弹毕竟不像“飞去来器”打了人还能原样收回，真的炮弹打过一次就成炮灰，职场炮弹打的地方和次数太多了，也只能沦为炮灰。


    当然有时做炮弹可能并非斯人主动，有时真的有想攻击之物。比如新来的 HRD 是董事长朋友的女儿，每天上班的工作是八卦世界奇闻，还对人际指气使，更可乐的是，大家都还来巴结她。于是每天辛'
