- pgno: 642
  md: '尝不废卷流涕。何者？士有一定之论，

    女有不易之行。信而见疑，贞而为戮，

    是以 壮夫义士伏死而不顾者也。下

    官闻仁不可恃，善不可依，始谓徒语，

    乃今知之。伏愿大王暂停左右，少加

    怜鉴。


    下官本蓬户桑枢之民，布衣韦带之士，

    退不饰《诗书》以惊愚，进不买名声于天

    下。日者谬得升降承明之阙，出入金华

    之殿，何尝不局影凝严，侧身启禁者

    乎？窃慕大王之义，为门下之宾，备

    鸣盗浅术之余，豫三五贱伎之末。大王

    惠以恩光，晒以颜色。实佩荆卿黄金'
