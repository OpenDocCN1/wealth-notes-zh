  md: '“秦国任用商鞅推行变法，向东削弱了韩、魏，他的军队在天下称强，而终于把商鞅车裂而死；越国采纳大夫种的计谋，攻灭了强大的吴国，称霸中国，而最终文种遭到杀身之祸。因此，孙叔敖孙叔三次离开相位而不懊悔；于陵子仲推辞了三公的职位去替别人浇水灌园。如今国君果真能去掉倨傲的情绪，心里存有让别人效力的意念，披露心腹，以见真情，披肝沥胆，施以厚德，始终和别人共甘苦，爱戴士子，那么，就是桀养的狗也可以让它咬尧，而蹠的门客可以让他行刺许由；何况您依仗大国的权势，凭借圣王的才能呢？既然如此，那么荆轲甘冒灭七族的大祸，要离烧死妻子儿女，难道还有什么值得称道的吗！


