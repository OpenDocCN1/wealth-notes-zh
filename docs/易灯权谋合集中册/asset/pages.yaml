  md: '# 权谋家怎样得到上级授权


    一个人要想得到上级的授权就必须注意以下几点：


    +   第一，你千万不要表现出来想要权，一旦表现出来，上级绝不会授权给你，因为他的警觉性很高。“授”是他主动给的意思，而不是你争取的意思。他认为不该授给你就不会授给你，你争取也没有用，你越争取他越怕。


    +   第二，当你的上级讲得很清楚，说这件事情我授权给你时，你一定要回答说“我还是会具体地向你汇报”，这样他就会对你很放心。因为没有一个人真正舍得把'
  merge: -1
  img_proc: true
- pgno: 813
  md: 权授给别人，他只是为了方便才授权给
  merge: -1
  img_proc: true
- pgno: 814
  md: '你，权他还是耍抓住的，要不然人家当老板怎么办呢？他可是耍负全部责任、承担全部风险的。


    第三，我们得到上级授权后，千万记住要做到四个字：及时汇报。“及时”这两个字很重要，但很多人却经常忽视这一问题。领导到你这儿来视察工作，你完全不当一回事，他回去后一定会打电话把你叫去大骂一通。他心里想：我到你这儿来是关心你，就是要你跟我汇报的，你却不把我当人看，那我还授权给你干吗？'
