  md: '嗯。再来八卦一下，宋江对待女人的态度也十分让人玩味，初时不肯，却又讨了阎婆惜做外室，随后夜夜春宵，不久之后又号称什么只爱学使枪棒，于女色上不十分要紧，纯是放屁，不要信老施，他是大弄春秋笔法哩。我们看这个情节，分明是开始矫情，后来见人家是美女就扑上前去了。然而这宋江其貌不扬也就罢了，我估计他那方面是不行了，古时候又没伟哥吃，于是假装爱使枪棒去了，就他那三脚猫的功夫，也敢称爱使枪棒？


