- pgno: 1309
  md: '主管才需要有能力的员工来掩饰自己的不足。问题可能是在周遭人的身上，或许不小心踩到地雷了（尤其是裙子）。既然有这么多莫名奇妙的讯息出现，一个公司做事待人若不光明磊落，只会耍小花招，想必也不是什么大格局的公司，所以也劝其不能待就不用浪费时间，不需屈就自己，留着让人糟踏何必呢？又不是能力不好。所谓赢在终点，盖棺论定才算数。甭花时间精力了，趁早离开是非圈，免受波及，不然日后还要费力气去做危机处理！毕竟谎言说多了，总会有被拆穿的一天！只能说他们不会用人。


    只要清楚什么是真正的目标，有很强的执行力，就能有效达成目标。如果你的主管领导能力不强，未经过磨练，往往会造就更多的弱兵，制造更多潜藏的危机。这绝对是老板的悲哀，因为主管不会用人，出了问题也不愿正视问题，以为惩处员工就是解决问题，这是典型鸵鸟心态，殊不知问题的根源没解决，只是一个人换过一个人。当然老板也不能免责，推托不知道，（对于职场生态及文化，只要有历练的人都知道是在演戏，除非是新鲜人，因为这些桥段自己也演过，哈⋯⋯）


    真正的主管或老板，会把弱兵引导成为菁英。要想找到优秀的人才，首先要让他有发挥的舞台，甚至尊重对方是个优秀'
  merge: -1
