    “我查过天下所有的地图详详细细地进行比较，诸侯之地五倍于秦，料度诸侯之卒十倍于秦。六国为一，并力西向而攻秦，秦必破矣！”


    六国合从之主题终于破土而出！千呼万呼始出来，才显其非同凡响。


