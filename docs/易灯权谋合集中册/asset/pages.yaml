  md: 后来何远又被起用为镇南将军、武康令。他更加砥砺清廉正直的节操，他除去各种不合礼制的祭祀，公正不阿，尽心奉职，百姓非常称道他。太守王彬巡视属县，各县都置办隆盛的宴席招待王彬，到武康，何远却只准备干粮茶水而已。王恣离去的时候，何远送他到边境，进献一斗酒一只鹅为王彬饯行。王彬和何远开玩笑说：“晋朝陆纳用一斗酒、一盘鹿肉送礼，你的礼物超过陆纳，会不会被古人嘲笑呢？”高祖知道了何远的才能，就把他擢拔为宣城太守。从县令提拔为京畿附近大郡的太守，这是近代没有的事情。宣城郡经过叛贼洗劫，坦达
  merge: -1
