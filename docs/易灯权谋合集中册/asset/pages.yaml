- pgno: 315
  md: '为高梁侯。后更食武遂，嗣三世。”汉十二年，也就是刘邦去世的一年，在临死之前，刘邦也未尝忘怀故人酃食其。


    第二位儒生，是叔孙通。据《史记·刘敬叔孙通列传》记载，秦时叔孙通“以文学征，待诏博士”。二世时，农民起义，秦二世最恨大臣说人民造反。叔孙通对二世说：“人人奉职，安敢有反者！这不过是狗盗耳，何足挂齿！”二世听了高兴异常，拜叔孙通为博士。诸生反诘叔孙通：“你怎么会这样的阿谀奉承？”叔孙通说：“我不这样说，怎么能逃出虎口？”叔孙通从汉，当时他穿着儒服，汉王憎之，“乃变其服，服短衣，楚制，汉王喜”。很长时间叔孙通无所进言，跟随来的儒生都要离他而去。无可奈何之下，他对众儒说：“诸生且待我，我不忘矣！”后来叔孙通拜为博士。'
