    # 识破领导玩的权术


    在错综复杂的用人纠葛中，每个人都可能遇到施加于你的用人权术。有些奸诈诡计领导者，运用用人权术，就像高明的魔术师变“魔术”一样得心应手，又像狡猾的狐狸玩“智力游戏”一样驾轻就熟。面对这个复杂的世界，我们的头脑也应该“复杂”一些，要善于识破'
  merge: -1
  img_proc: true
- pgno: 71
  md: '领导的用人权术。


    # 一、识破领导玩的平衡术


    这里的所谓平衡，是不讲原则的平衡，既不让某一方“势力”过分强大，又不让另一种“势力”过分弱小，反正谁也不能“吃掉”其他各方，最后还得维护我的地位，听我指挥。这种在用人行为中，通过玩弄各种不光彩的手段，来保持“势力”之间的磨擦平衡，进而达到巩固自己的领导地位的目的的用人权术，就叫做玩平衡术。


    常见的玩平衡术的手段有：


    +   1、不辨是非，调和掣夷


    +   2、假意“宽恕”反对自己的人，以此来“调整”各种势力的组织结构


    +   3、容忍甚至重用品行恶劣的下属


    +   4、权力均摊，在用人时充分照顾各方“利益”


    +   5、适时制造矛盾，阻止各种“势力”产生不'
  merge: -1
  img_proc: true
- pgno: 72
  md: '利于自己的联合


    +   6、及时缓和矛盾，防止各种“势力”发生威胁自己领导地位的“火并”


    +   7、出尔反尔，忽然将其下属“抬上天”，忽然又将某下属“按下地”


    # 二、识破领导玩的偷梁换柱术


    偷梁换柱术，指的是有的领导为使自已“看中”的下属能得到“重用”，不惜弄虚作假，欺骗上级，玩弄一整套偷梁换柱的权术。


    常见玩的偷梁换柱术的手腕有：


    +   1、对上级指示断章取义、各取所需


    +   2、故意曲解上级指示的原意


    +   3、选择所谓适当的时机传达上级指示精神


    +   4、片面理解上级指示含意，暗中贩卖“私货”


    +   5、阳奉阴违，制造“贯彻”上级指示的假象，欺骗、搪塞上级部门


    +   6、创造土政策'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 三、识破领导玩弄的拉帮结派术


    任何领导者，要想获得事业上的成功，要想遇险不惊，足以应付各种错综复杂的困难局面，必须要在自己的周围，聚集起一伙志同道合的战友。


    这是一个 人皆知的公开“秘密”。


    然而，同样是“聚集”自己的队伍，但动机却不同。


    这里说的拉帮结派，就是一种被老百姓深恶痛绝的违反组织原则的“聚集”行为，一种通过各种不光彩的手腕，为自己网络亲信和死党的用人权术。


    在实施过程中，拉帮结派能够做到上、下、左、右“四面开花”，因而在所消耗的时间和精力上，以及所投入的“成本”上，都要远远超过其他任何一种权术。


    拉帮结派常用的手腕有：'
  merge: -1
  img_proc: true
- pgno: 74
  md: '+   1、投靠上司，寻找“靠山


    为了达到巴结上司，投靠上司的目的，单靠吹吹拍拍、吃吃喝喝，显然是远远不够的，还必须舍得下在“赌注”，并且作出必要的“牺牲”，甚至冒一定的风险，才能被上司接纳为“心腹成员”。下面，举几个被“行家”们视为比较“高明”的“投靠”例子：


    闻风而动，按照上司的“思想”，出“经验”、出“典型”，上面每产生一个“思想”，每下达一个“指示”，也不管它是否正确，立即就在自己管辖的地区和单位进行“试验”，想方设法制造一个“典型”，总结一套成功的“经验”。然后，大肆宣扬，将“成绩”记在上司的“功劳薄”上（当然也记在自己的“功劳薄”上），以此来进政治投资，下“政治赌注”，骗取上司的信任和重用。


    在上司和其他领导成员“摊牌”时，冒着风险，'
  merge: -1
  img_proc: true
- pgno: 75
  md: '坚决站在上司一边，协助他战胜对手。此举尽管之下的“赌注”较大，但只要判断准确，方法得当，还是可能“取胜”的。只要上司最终战胜对手，和他“共患难”的下属，自然身价百倍，平步青云。


    打小报告，出卖朋友和同志，以此换得上司的信任。以歪曲事实，编造谎言等手法，向上司打小报告，揭露某甲与上司“离心离德”，企图“威胁”上司的“官位”，以此来作为投靠上司的“见面礼”，乞求上司让自己进入他的“心腹圈”。


    为上司“办实事”，使上司深受感动，从此“记住”自己。在多数情况下，上司本人大权在握，无求于下属什么。然而，他的亲属好友，难免遇到一些“难题”，需要有人出面帮助解决（上司“不便干”亲自出面）。这就为投靠上司者，'
  merge: -1
  img_proc: true
- pgno: 76
  md: '提供了“一试身手”的机会。他可根据上司的不同“需要”，热情地为他“办实事”，诸如：


    +   给上司的家属找个好工作，提拔上司的儿女……通过办这些令人终身难忘的“实事”，上司自然深受感动，日后肯定“亏待”不了自己。


    千方百计和上司“结亲”。例如，将自己的女儿许配给上司的儿子，将自己的外甥介绍给上司的侄女，等等。实在不行，还可临时招认一个美女为自己的“养女”许配给上司的某个亲戚。通过这种“结亲”手段，缩短和上司的“距离”，再和上司说话，自然就要“随便”多了。


    +   拉拢同级，结交“盟友”


    拉拢同级的目的，是为了壮大自己的力量，彼此之间可以“遥相呼应”，“相互关照”。


    +   收买下属，培植“亲信”


    +   四、误码领导玩弄的金底抽薪权术'
  merge: -1
  img_proc: true
- pgno: 77
  md: '锅里的水沸腾，是靠火的力量，而柴草则是产生火的原料。止沸的办法有两种：一是扬汤止沸（必须接触滚烫的水）；二是抽薪止沸（只需拿走对人没有伤害的柴草）。所以，古人说：“故以汤止沸，沸乃不止，诚知其本，则去火而已矣。”这名成语的原意，是比喻做事应当从根本上解决。引申到用人权术上来，就是指，领导者在用人行为中，遇到实力强大、锋芒毕露的对手，不是从正面和他交手，而是采取各种“抽薪”的手段，削弱他的气势来制服他。这种权术，就叫釜底抽薪术。


    常见的“抽薪”手段有：


    故意“冷淡”锋芒毕露的下属。


    不向下属提供“显露”才华的机会。


    制造不均等的“知识更新”和“才能增长”的机会，有意扶持某下属的竞争对 手，使他渐渐落后于对手。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '使某下属的才华和锐气“磨灭”在束缚他手脚的恶劣氛围之中。


    切断某下属的知识源、信息源、才能源，使他陷入“断炊”困境。


    以动听的借口，阻止陷于困境的某下属摆脱恶劣的氛围。


    # 五、识破领导玩弄的反客为主权术


    反客为主，原意是主人不会待客，反受客人招待。用在用人领域里，是指上级不会指挥下级，反受下级指挥。再作进一步引申，就成为具有个人私心的下级常用的一种篡权计谋，它是指：在用人过程中，下属采取各种手段，骗取上司信任，渐渐夺取上司的权利，最终完全取代上司，显然，这是一种十分阴险狡诈的用人权术。


    第一，他要想方设法骗取领导的信任。


    第二，为“往上爬”占据重要位置。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '第三，打着领导的旗号，指挥他的下属。


    第四，“架空”领导者，逼其“就范”。或者让他体面地下台。


    # 六、识破领导玩弄抓替罪羊的权术


    抓替罪羊，是指领导者在遇到重大挫折以后，为了摆脱困境，化被动为主动，而玩弄手腕，转嫁灾祸，有意牺牲某个下属的用人权术。领导者不必费尽心计，被动防卫。而是从一开始就以所谓正确的面貌出现，抓“替罪羊”，将他置于死地。乘人们的注意力被吸引到“替罪羊”身上之际，真正的“罪魁”——领导者，反而从人们的视线溜走了。


    常见的抓替罪羊的手段有：


    领导者首先利用某个下属“制服”那些反对自己的人，当这个下属“出色”完成任务，同时激起了人们的普遍愤慨时，领导者又突然把他“抛”出去，严厉“惩处”他，以平民愤。'
  merge: -1
  img_proc: true
- pgno: 80
  md: '某项工作由于种种原因，长期搞不上去，群众意见很大。为了转移群众的视线，保住自己的地位，便将主管该项工作的某甲当作替罪羊，“撤职查办”出去，以显示自己的正确。


    领导集团遇到严重危机，广大群众对现领导层疑心重重，很不信任。为了维持多数领导成员的权力，化被动为主动，经过一番权力之争，无情地将“失败者”抛出去，并且向广大群众“解释”说：现领导犯的种种错和过失都是这个“坏蛋”干的。


    某项工作自以为干得不错，报给上级部门“请功”，谁知违背了上级领导的“意图”，犯了“原则性错误，日后“有桨”烧，经过一番策划，赶紧找一个下属当替罪羊，向上级有个“交待”，以解燃眉之急。


    向下属布置任务时，再三强调：“此事关系重大，只许干好，不许干坏”，借此留下“伏笔”。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '倘若下属出色完成任务，便将此“功”窃为己有，大肆宣扬，扩大自己的“影响”，万一下属惨遭失败，也无甚紧要，反正自己“有言在先”，只须将此“过”推给下属，让他替自己“背”着就是了。


    此事明明是自己的“得”力下属办砸了，为了“保住”该下属，赶紧想个应急的办法，将造成重大损失的直接责任，推给另一个“参与”此事的下属


    一人错误，集体来“承担”，让整个集体为个人当替罪羊。上级部门一旦怪罪下来，只须“集体出面”，作一次“深刻检查”，表示今后一定“吸取教训”就行了，谁也不掉乌纱帽。在一些地区，往被那些政绩平平的领导者所采用。


    最有趣，也是最“精彩”的是，当某项工作出现重大失误时，领导为了逃脱上级部门的追'
  merge: -1
  img_proc: true
- pgno: 82
  md: '查，竟然在同级之间、上下级之间，相互抓起了替罪羊。这种毫不留情的“抓羊”游戏，令人瞠目结舌。最后的结局，往往是势单力薄的“失败者”，成为可怜的替罪羊。


    识别和提防的“要诀”：


    凡是遇到虚伪、狡猾的领导者，就应该注意观察，他平时是否“喜欢”将一切成绩归于自己，同时又将一切过失推给别人。


    与有“抓羊”前科的领导者打交道，应多加小心，有条件允许的情况下，应尽量做到事事留有“实据”，以便日后“查找”。


    健全法制，不给抓羊者留下“可乘之机”。


    无情揭露抓羊者的卑劣行径，使他在群众的监督之下，不敢胡作非为。


    依靠上级组织的帮助和支持。


    # 七、识破领导玩弄上屋抽梯的权术


    上屋抽梯，又称“上楼抽梯”。据《三国演义》'
