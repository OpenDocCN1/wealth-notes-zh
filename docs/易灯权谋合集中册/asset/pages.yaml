  md: '而无不为’、‘后其身而身先’，此乃完全在人事利害得失上着眼，完全在应付权谋上打算也。”钱穆：《庄老通辨》卷中《道家政治思想考》。马来西亚大学的郑良树先生也认为“无为”是权谋之术。不过他进一步指出：“大概《韩非子》在解释《老子》、利用《老子》之际，于老子‘无为’思想别有会心的了解，乃创立‘人君无为，臣下无不
    为’的政治法术。后人不察，竟以此权谋法术加在老子朴素的哲学上。”郑良树：《论帛书本老子》，《竹简帛书论文集》。


    这一帝王权术的内容，首先是指君主不要亲自处理政务，而是指挥臣下干一切事情，使自己处在虚静无为的地位，垂拱而治。君主逞能恃才，事必躬亲，其实并不表明君主的聪明，反倒表现出君主的无本事和低能。法家认为，如果人君亲自处理一切政务，这是代臣下蒙劳负'
