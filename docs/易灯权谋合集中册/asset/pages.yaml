  md: '# 职场三大忌


    原文：


    兰陵武王长恭，一名孝瓘，文襄第四子也。累迁并州刺史。突厥入晋阳，长恭尽力击之。芒山之败，长恭为中军，率五百骑再入周军，遂至金墉之下，被围甚急， 城上人弗识，长恭免胄示之面，乃下弩手救之，于是大捷。武士共歌谣之，为《兰陵王入阵曲》是也。历司州牧、青瀛二州，颇受财货。后为太尉，'
