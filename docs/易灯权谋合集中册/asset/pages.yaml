  md: 的权术用得很残酷，总起来分两个阶段。一是执政前，一是执政后。执政前用的是一哭二媚三骄四坑害。唐太宗死后，武则天当了尼姑。面对青灯古佛，一个正值青春年少的她，真不是一件容易的事。但是，高宗当太子时曾见到过她，很喜欢，可谓一见钟情。作了皇帝后有一天经过佛寺，武氏见了，大哭，高宗看到她眼泪汪汪的，受到触动，便把她带进宫，脱离了青灯古佛的清苦生活。这一哭，完成了进宫的第一步。第二便是谄媚皇后。皇后是她的顶头上司，要高升，还得攀着皇后。于是她便“下辞降体”，低声下气，卑躬屈节，尽力侍奉皇后。皇后很高兴，便多次在皇帝面前称赞她，皇帝进封她为昭仪。这样她的地位提高了，受到天子的眷顾和宠幸，逐渐超过了其他妃子。她便不再曲意奉承皇后，并和她逐渐不和起来。同时买通宫女和女官，对皇后的事知道得
  merge: -1
