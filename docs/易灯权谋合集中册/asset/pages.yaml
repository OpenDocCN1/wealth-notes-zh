  md: '成了一棵掏空了根基的老树，他心里比谁都清楚，这个表面繁华无比的画船已经经不起任何风雨了。想当初，他为了一己之死推荐藩人为将，因为之前的宰相郭元振、张嘉贞、张说、萧嵩、李适之等人，都是从边将、节度使等职升至相位的。为了避免自己的位置受到威胁，李林甫对李隆基说：“以陛下之雄才，国家富强，而蕃之未灭者，由文吏为将而怯懦不胜武也。陛下必欲灭四夷，威海内，即莫若武臣，武臣莫若蕃将，生时气魄，少养马上，长习陈敌，此天性也。陛下抚而将之，使其必死，则夷狄不足图也。”这个冠冕堂皇的理由既捋顺了皇帝的胡子，又保住了自己的帽子。


    然而，任用藩人的弊端他却了然于心。他在位时尚且凭着绝代的权术手腕震慑住了各路各怀鬼胎的藩镇，他一死，仅凭着平庸的杨国忠是无法辖制天下枭雄的。'
