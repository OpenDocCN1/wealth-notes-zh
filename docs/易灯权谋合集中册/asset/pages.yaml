  md: '场之路就危险了。所以聪明人会故意暴露些缺点，尤其是无关痛痒的缺点，让上司以为他能拿捏住你，那才是最安全的境地。但缺点绝不可致命，却不能是你真正的短处，只可以是风花雪月时谈起的余兴节目，和人套近乎有余，想以此要胁则没门。


    17、高你半级的人，往往是最危险的，同级的是天然敌人。如果已经有一官半职，那对这句一定感同身受。因为高你半级的人会有危机感，怕你随时都可能与他们平起平坐，所以有机会他们就会打击你。而不管高半级还是一级，都是上司，他们给你穿小鞋就危险万分了。而同级的人是必然的敌人，只要你们的上司不是傻瓜，就一定会挑拨下手争斗。


