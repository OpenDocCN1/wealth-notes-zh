  md: '# 想抓替罪羊必须知道特征


    基本含义:因某事物而引起的强烈情绪和冲动不能直接发泄到这个对象上去，就转而移到另一个对象上去了。在人群心理学中，人们把替罪羊引起的心理效应现象，称之为替罪羊效应。替罪羊原指古代犹太教在赎罪日用做祭品的羊，表示由它替人受罪，后比喻代人受过的人。


    # 简介


    平时所言的"替死鬼""背黑锅"也是此意。这种运用"替罪羊"代过、受罪、遭害的做法，最著名的莫过于希特勒的反犹太人运动。他为了要掌握国内非常难以掌握的中等阶级，不惜将犹太人当作"替罪羊"而加以排斥，并且将一切集团里造成的矛盾、纠葛的原'
  merge: -1
  img_proc: true
- pgno: 1097
  md: '因及其后果都归咎于他们，所以集团里的对立就被暂时地压下来了，使当时德国国民精神得到了统一。这是运用"替罪羊"产生的替罪羊效应很"成功"的例子。


    为什么会产生这一替罪羊效应呢?其主要原因有如下几点:


    +   一是"替罪羊"的软弱性。


    一般而言，在人群组织中，找替罪羊的往往上司较多，上司在寻找替罪羊时，往往会寻找一个不太会反抗或较少后遗症的软弱者，以及时平息事端的蔓延。因此，这种软弱者经常就成了无端的受害者。


    这大概也是人的一种"以强欺弱"的劣根性，但最主要的还是与这个上司的品行不端或耍弄权术有关。可见，"替罪羊"的软弱性往往是产生替罪羊效应的原因之一。'
  merge: -1
  img_proc: true
- pgno: 1098
  md: '二是"替罪羊"的进攻性。


