  md: '仅品行恶劣而且才能平庸，当此非常之时，恐坏国家大事。陈宝琛回到江宁，将这些情况告诉曾国荃，岂料曾国荃不但不支持陈宝琛，反而指责他不该随便批评前线将士，扰乱军心。


    但陈宝琛依然秉着他在京时的清流亢直之气，认为不向朝廷如实反应，则有负朝廷的重托，于是上了一道密折，将江南海防的实情，以及陈缇、曾国荃等行为一并上奏。这封密折刚到北京，便有平时用重金收买的宫廷耳目报告曾国荃。


    曾国荃一面指使人上奏朝廷，无端给陈宝琛加上一个收受法国人五万两银子的贿赂罪名，又无中生有地说陈宝琛在江南期间狎嫖嫖妓，行为不轨，有伤风化。同时在江宁城里，对陈宝琛彻底孤立，所有该陈宝琛管的事情一律不许他参加。陈缇更指使一帮兵痞在陈宝琛的住宅'
