- pgno: 1338
  md: '# 权谋操作技术布局


    <布局>是谋略方法学中的核心课题，到底什么是谋略的布局呢？我们先来看布局的局，局是整体中的一部分，在礼记曲礼中就有左右有局，各司其局的一段话，而根据郑玄的注，这里一局一即是部分之意，类似今日政府机关中称呼分治一事之处所，即有教育局、工业局、公路局……等皆是取其整体中各有司之部分之意。


    布是什么意思呢？布同布，布是用线经纬交织而成的织物，引申在动词方面就作全盘性、系统性的敷陈、安排之意，布和局连结起来，就是把全体的各部分，各就各位敷陈好。布局之意恩掌握之后，我们再回头来看谋略，谋是什么呢？谋是言某的组合，是一种少数几个人在交头接耳秘密密度计划的行为诗经小雅皇皇后华篇中，有所谓同爱咨谋，传曰：咨事之难易为谋其意即与言某相近而略又是什么意思呢？略是田亩的组合，田系在大地上划地筑埂种谷，以井田制度的井田来说，它即是一套划分土地权义的蓝图或计划，依此略的意义就出来了，它是一套做事的轮廓计划或大纲。再把谋略相连起来，我们就可以了解谋略是一种隐藏不外显的做事计划，这种计划的目的特别是要使事情的发生，一切都控制在预设的情况下，以遂行其目的。'
  merge: -1
  img_proc: true
- pgno: 1339
  md: '为何要强调谋略是一种隐藏不外显的计划呢？


    大家一定知道谋略另一个称呼叫韬略，韬略的韬，本意即指裹剑藏锋之囊，因此韬略也是指深藏在里面的做事计划之意，它们都是指涉谋略共同的特征之一：以阴制阳、柔克刚、斗智取代斗力。


    谈到斗智，是一种真正在以人定胜天的力量以操控人世、自然因果法则的技术，它的目的在将天、人都轻巧地控制在人为预设的状况下进行以遂行特定目的。而做事将全盘计划中的部分做各种技巧性的安排，例如部分显在，部分潜藏，以引动对手或第三者的力量相随变化，就是在操控事情依预设进行的手段之一。


    进言之，这时所牵涉的布一局一天人斗智：如何把全盘计划中的部分做目的性的安排，让它产生特定的效果，以便把对手或第三者甚或自然界的力量引进来加以变化，使事情的发展、进行导向预设的状况。
    当然要操作这种布局，技术是非常费神的。


    首先一定要有统摄全盘的能力，要有敏锐的机识觉，要能掌握各种可能的机势，要预见错综复杂的因果关系，加上要有'
  merge: -1
  img_proc: true
- pgno: 1340
  md: '超人的抽象、组织和幻想能力，同时，一定要能守口如瓶，做事不露痕迹，这样才能使谋略内藏不外显的特质保存住。


    布局的技术--故示一部埋伏他部


    前面已经谈到谋略是一种内藏不外显的做事计划，但这与布局有什么关系呢？首先布局可以将全体计划中的各部分加以敷陈配置，使左右有局，各司其局，若牵一发必动全身，但外观永远只能看到一部分，这样布局就有明的、有暗的，有显在、有潜在，可以组合很多效果，诸如：奇正、顺逆、虚实、曲直等，来达到谋略目标。


    其次布局也是谋略实现的必要步骤，没有布局，谋略就只是抽象的思维而已，不能发挥推动自然界或人世间事情的变化，也谈不上什么操控外界事务的生成发展了，因此布局涉及很多自然或人设法则的因果力操纵问题。'
  merge: -1
  img_proc: true
- pgno: 1341
  md: '# 权谋两义


    <权谋>在谋略学中是一个重量级的概念，班固在汉书艺文志中，将古代兵法书分成权谋、形势、阴阳、技巧四类，一权谋——类即占着极重的份量，像孙子、吴子兵法皆属于这一类。


    权谋到底为何物？关键就在权字上，权有时指原则坚持而手段灵活，孟子曾说过：常谓之经，变谓之权，怀其常经而挟其变权，乃得为贤，冯用在权论中亦曾提到夫权者，适一时之变，非悠久之用。......


    圣人知道德有不可为之时，礼义有不可施之时，刑名有不可威之时，由是济之以权也。


    设于事先之谓机，应于事变之谓权。......机之先设，犹张罗待鸟，来则获之，权之应变，犹荷戈御兽，审其势也。权有时也表示：权衡事物轻重之意，朱熹曾指出，权者，权衡之权，言其可以称物之轻重而游移前却以适于平。等等皆是，而今日在实务上，有所谓主权、权力者，亦皆从此引申而'
  merge: -1
  img_proc: true
- pgno: 1342
  md: '来，是指掌握事物权衡之柄，居于众皆听其权衡判定之地位的意思。


    前者的权谋强调在见机而制变，与守常奉经相对，后者之权谋则强调在权力如何之营取与运用，慨念有别。权谋是一种务实返经的治事方法我们再从机谈起：


    提到机识，是策定谋略的第一步，为什么机如此重要呢？这跟权谋之制变有密切关系，我们常把制变机先相联在一起，因为制变于机先，才有宽广的决策自由度，使力起来也比较轻，没有阻力，力少而功多，为什么呢？因为机者，离无入有，理而未形，不可以名寻，不可以形睹，一般人都是未察觉的，一般人未察觉做事才能隐而不外显，人才好操纵，事才好做，没有什么阻力，其次机者，微也，因事物初动之时势微，还有很多的发展可能性，还来得及加以改变或控制，就如鬼谷子所言抵巚之理：巚始有肤胀，可抵而睾一一样，及早掌握事情发生的因子及因果动向，要改变它、控制它或利用它，机会比较大，同时也省力气。因此谈权谋制变，几乎无法与见机分离，权谋是根据机识范围的大小和内容来策定的，不见机，一切都无能为力。


    # 其次谈方法上之权谋


    1343'
  merge: -1
  img_proc: true
- pgno: 1343
  md: '前面已经提过，策谋的第一步在见机，然后见机始能便宜行事，至于如何便宜行事？即权，这里的权即包括一些反常道的奇、虚、屈或逆的方法，与常道的正、实、直、顺的方法相对，盖所谓权者，反常而合于道者，权者，道之变，变无常体也。因此有人说权是经的变体。


    这道理就像在用秤称物一样，称重时每件物是特定的，人员必先用秤勾把物勾起来，之后权即锤必置于秤杆的另端下方，而且为了让秤杆持平必须在杆上调整物与锤间的距离刻度以读出数字，以权衡出物件轻重，在这个动作当中，我们说用秤称物要让秤杆持平是不易之道，用秤勾向上提起物件，是正向使力，权锤在秤杆另端是向下使力，以免权锤一端翘起，或垂下。这时再调动秤杆上的刻度以求取物与权的距离使秤杆得其平衡，其间最值得我们注意的是，使用的秤杆刻度是固定的，此即常常经，而调动秤杆上的刻度，求其平衡即权变。因此权变是不离经的，只在经的刻度内取舍不同的刻度而已，在谋略学上就取权乃游移于经，让人捉摸不定这一点，来作为筹谋订策的方法核心。


    总之权之运用，有几个特色：一它的方法，通常是令人捉摸不定，变化无常的，最常用的是反其道，屈其直，虚其实


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1343_0.png)'
  merge: -1
  img_proc: true
- pgno: 1344
  md: '等。二它是必须计长短精算轻重的，三它的方法是变动的但绝不离一经距范围因为万事不能离事理，一缺乏事理基础，即脱离因果法则的支配，任何动作都无法期待其效果，宇宙秩序将破灭。


    这也是说权术是务实而迳经的，只是在手段上权术是很讲究奇而已。再者权术与常经是相对的，而且是互相依存的，无常经，权术就没用，无权术常经也没作用，所以习谋略学的人无不统合全盘、经权合参才能有得。


    权谋也是一种经营权力的谋略


    前面已说过，权力是指一种主操事物权衡、可居于决定地位者的力量，因此凡遇事由谁来权衡轻重，由谁来作决定者，谁就是权力者。


    不论王权、兵权、财政大权或投票权，都是这样的，因此说起来，权谋也就是追求事务决定权的一种谋略，像追求政治上的同意权，命令权，预算使用权等，就是显明的例子。'
  merge: -1
  img_proc: true
- pgno: 1345
  md: '# 权术到底是什么


    谋略学程序论中，最重要的四部曲，一是机识，二是权衡，三是决，四是布局，机识相当于决策论中的问题认知与情报分析，权衡相当于决策论中-对第方案的拟设与可行性分析，决相当于决策论中的方案评估与选择等，布局则是方案的执行。


    我们这里所提之权衡的概念，与注重算学的数术关系密切，算学中的三大法，分别是度、量、衡，度所以分别长短之法也，量所以分别多寡之法也，衡所以分别轻重之法也，权谋、数术经常联想在一起，实在都是因为一谈到控制、管理、计划之略，就必须做力的计算，甚至于—谈到谋略的设计，就常要借用剑算学三法精髓的缘故：例如取形之谋略者：如古代的兵阵法、苏张的纵横大战略、美国的围堵战略、权力的三角枢纽战略，就常借用算法中的勾股法三角形算法，勾是三角形之横阔，勾股之形，即今工匠所用曲尺之形形积法方、圆、直、梯、斜等形之算法，以纵、横周经求积的算法。二取数意之谋略者，就常借用剑算法中的加减乘除运算或大于、等于、小于


    .....等意念来指导谋略的操作，例如孙子的分合术治众如治寡，分数是也，斗众如斗寡，形名是也。形人而我无形，则我专而敌分，我专为—，敌分为十，是以十攻其—也，则我'
  merge: -1
  img_proc: true
- pgno: 1346
  md: '众而敌寡，能以众击寡者，则我之所欲战者，约矣！三取用神之谋略方面，也常借用到度、量、衡或权衡的神髓，以下我们就从这里谈起：


    # 经用之道在权衡


    谈到权衡，刘勰有段话说的非常中的：


    循理守常曰道，临危制变曰权，权之为称譬犹权衡也，衡者测邪正之形，权者探轻重之势，量有轻重平而行之，亦犹此也。


    刘勰就是以度量衡的操作公式来阐释权衡之术的，这是怎么说的呢？


    先说人类脑中用来指导行动行为的知识体系大体可分两类别，一是实然界的知识定律，二是应然界规范定律，其实是非常复杂的，它们平常储存在人的脑库中，可谓杂然并陈，就像一座大图书馆一样，有物理、数学、化学、电子、生化、核能、机械、植物、医药、伦理、道德等等各门各类一条一条的知识理则，有的重复、近似，有的可替代、串接，有的彼此冲突矛盾，有的层面大，有的小，有的是对人的，'
  merge: -1
  img_proc: true
- pgno: 1347
  md: '有的对物，不一而足，其中有些是历久不变，或放诸四海皆准的，即称为经体，人类即运用这些经体中杂然并陈的条理型脑库一条条的经来观察、分析、推论、预测或批判外界事物或指导自己及他人行为的，这就是—经用，这道理就像吾人运用下棋规则在下棋一样，下棋规则是棋的经体，把规则拿来组合行棋布局则是经用。


    而当人类在操演这些经体时，有一个现象很重要，那就是经的取用、组合是不规律的(它不像电脑的資料庫结构，有固定的资料搜寻法则)因此有时候从经体中取用的一经—是单一的，有时是多元的，多元的经，有的彼此不相干，有的甚至互相矛盾。取用的经，有时粗糙，有时细致，取用时也不—定经过选择，有的会经过简单的比较，但是常无法尽作比较。因此对事情的看法、做法往往有多角度，多种不同的方法和多种评价，这时候在人的脑海里的思绪，就会丰富、但也是复杂，甚至是混乱的，—经一—律的分辨、组用也就成为人类之所以有上智下愚之区别的关键。


    际此有些正经八百的人就会坚持非选用某些正经不可，有些思想定型的人就会习惯成自然地选用他所熟悉的经纬，只有一些可与权之人，才会运用权术或长短术或句距术，用证


    1348'
