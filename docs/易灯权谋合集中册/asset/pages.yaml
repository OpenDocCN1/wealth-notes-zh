- pgno: 229
  md: '仩，而臣下反而无所事事，享受安逸。这样，君主就把自己降到臣下的地位了。另外，君主处处争先逞能，容易把自己的一切长短优劣都暴露给臣下，而使君主失去主动权，处于被动的尴尬地位。君主的职责是用臣，而不是代臣下办事。君主如果能够像汉高祖那样善于用将，善于任用和指挥天下最有才智的人为其尽力，这才是最高明的统治艺术。韩非说：


    明君在上行无为之道，群臣在下则竦惧而不敢为非。明君之道，使智者尽其思虑，而君主因之以断事，故君之智慧无穷；使贤者贡献才能，君主因而任之，故君之才能无穷；办事有功则君主受贤名，有过则臣下承担罪责，故君之声誉无穷。如此，君主虽不贤，可为贤者之师；君主虽不智，可为智者之准则。能使臣任其劳，而君有其成功，此即君主之常法。为君之道在'
