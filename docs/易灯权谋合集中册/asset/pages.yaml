- pgno: 1354
  md: '又悲切；飞得缓慢是因为它旧伤疼痛，叫得悲切是因为它离开了雁群。旧伤还没有好，惊惧的心还没有解除，一听见弓弦的声音就吓得拼命高飞，以致使它的伤口破裂落下来。现在的临武君曾被秦军大败，他的心中对秦尚有余惧，因此不适合派他去担任抗秦主将啊！


    楚春申君颇不以为然，结果楚军果然因为惧秦过度，听说秦兵将偷袭，即自动引退，合纵因此瓦解，春申君一世英明也因此扫地。


    其他在情报分析方面也都仰赖这种机识能力，战国策燕策中就有段这样的故事：


