  md: '那个扮猪吃老虎、视天下如无物的胡人安禄山，平生唯一惧怕的人就是李林甫。想当初，杨国忠借着贵妃的裙角风官至御史中丞之时，风头渐盛，然而对安禄山却总是曲意奉承，安禄山每次上下宫殿的台阶，都要亲自上前搀扶。安禄山见皇帝宠臣尚且如此，便愈加骄横，见到李林甫时，态度颇有几分不驯。某日，李林甫传见安禄山之时，假装忽然想起了重要之事，差人传王鋛来见，王鋛和安禄山同为御史大夫，不过，王鋛还身兼数要职，论起来权力与地位远在安禄山之上。片刻王鋛即到，在李林甫面前毕恭毕敬，安禄山不由大吃一惊，卑恭收敛了许多。


    此后，李林甫每每与安禄山说话，必然揣测出安禄山心中所想，先行说出，安禄山大为惊叹佩服，以之为神，敬畏之心日积月累以至后来每次李林甫传见，即便是隆冬腊月，也常常汗'
