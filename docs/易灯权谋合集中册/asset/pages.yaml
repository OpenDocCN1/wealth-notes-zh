  md: '军统领，内务府大臣，户部侍郎，刑部尚书，正黄旗满洲都统，协办大学士，直隶总督，东阁大学士加太子太保，并担任过《四库全书》总总裁等重要官职，在乾隆一朝，他是颇得重用的大臣。在他乾隆四十八年（公元
    1783 年）逝世的时候，乾隆还特赐银 5000 银作为他的丧葬费用。《清史稿》中有他的传，并且说他“ 先陟外合，考厉着声绩 ”。即是说他在同僚中颇有威望，作出一定的政绩。


