- pgno: 880
  md: '即位，他的养母刘太后（969-1033）垂帘听政。这对母子，便是传说中“狸猫换太子”的那一对。不过，我在这里说的，是另外一个故事。


    当时宰相丁谓（966-1037）当国，权势震主。副宰相王曾（978-1038）心怀不满，却引而不发，反而对丁谓极尽巴结讨好之能事。只要两个人单独相对，王曾必定哭哭啼啼，摆出一副可怜相。丁谓的好奇心被撩拨起来，追问根由。问了十几次，王曾终于扭扭捏捏地开了口，说自己爹妈早死，跟老姐相依为命，可是外甥不争气，竟然当了兵——宋朝的兵'
  merge: -1
  img_proc: true
- pgno: 881
  md: '在脸上、手上刺着字，属于贱民。


    副宰相的外甥当兵，面子着实在说不过去。丁谓建议王曾写个书面报告，请皇帝（实际上是太后）下旨为其解除军籍。王曾表示不愿意拿自家的丑事来羞辱朝廷，说完又哭。丁谓就劝王曾，等宰相们集体向皇帝、太后汇报工作之后，再单独求见，当面向太后请求恩典。


    在丁谓的一再敦促之下，王曾半推半就，申请单独面谈。王曾与太后的面谈一直持续到午饭时间。他深刻揭发了丁谓的种种罪行，指出惩治丁谓刻不容'
  merge: -1
  img_proc: true
- pgno: 882
  md: '缓。太后同意了。丁谓连遭贬谪，一直被流放到崖州（今海南）。


    问题是，王曾真的有过如此戏剧性的表演吗？


    我很怀疑。至少，这与《宋史•王曾传》中力图传递的王曾形象不符。那个王曾“方严持重”，“进止有常处，平居寡言笑”，是端方严肃的。上面那个故事，来源于南宋人王铚的小说《默记》，小说么，不必事事皆实录。不过南宋史家李焘在《续资治通鉴长编》中，也记载了王曾求见太后之事：'
  merge: -1
  img_proc: true
- pgno: 883
  md: 王曾想除掉丁谓，可是无从下手。一天，他对众位宰相（包括丁谓）说，我没儿子，想过继弟弟的儿子，明天退朝之后，我要留下来跟太后说这件事。丁谓没想到王曾会对自己不利。在单独面谈中，王曾向太后报告，说丁谓包藏祸心，指使大宦官雷允恭把先帝的山陵擅自转移到“绝地”。太后大惊失色。丁谓跑到帘前极力为自己辩护，正剖心剖肝、痛哭流涕间，内侍忽然把帘子卷起来，说：相公在跟谁说话呢？太后早就起驾回宫了！
  merge: -1
  img_proc: true
- pgno: 884
  md: '王曾过继弟弟的儿子，确有此事。宋代宰相奏事，按制度，是所有宰相一起面见皇帝和太后，共同议事。王曾想要揭发丁谓，又不给他当场辩解的机会，就非得避开众人，单独求见。拿“过继”来说事，颇合情理。这有可能就是历史的真实。只是在小说中，王曾的“独对”却被王铨演绎成了前恭而后倨的戏剧。


    更耐人寻味的，是王铨在故事讲完了之后所发的感慨：假如丁谓早知道提防王曾，哪里还会招来这样的灾祸？王曾的权术就是比丁谓高。丁谓本是玩弄权术的高手，他从崖州给留在洛阳的家人写'
  merge: -1
  img_proc: true
- pgno: 885
  md: '信，故意委托洛阳的最高地方行政长官河南知府刘烨转交，而且偏挑刘烨跟僚属聚会的时候送达。这样敏感人物的敏感信件，刘烨哪敢私相授受，直接就交给皇上。那信上满是对皇恩的感念，对自己的谴责，和对家人的谆谆教诲，要他们不能有所怨望。于是，丁谓被从海南岛转到条件相对较好的雷州。丁谓高吧？可是，王曾比他更高，更能隐藏真实意图，更会装。


    丁谓并没有被正史归入“奸臣”类，不算是大奸大恶，但是，官方书写的正史在王曾和丁谓之间还是有所轻重的，王曾'
  merge: -1
  img_proc: true
- pgno: 886
  md: '是正人君子，丁谓的道德水准明显要低很多。而笔记小说则是“私人书写”，以同僚、亲友、后辈为目标读者，较少顾忌，更容易表达真实想法。于是，在王铨的笔下，道德暂时隐身，剩下的只是权术的比拼，看谁的技术更高，用网络技术语来说，这是“技术帖”。


    古人比我们更尊重文字的尊严和力量，因此，即使是“技术帖”也并非毫无顾忌，士大夫父子兄弟之间心口相传的“官场秘笈”，肯定有比这更直白、更露骨的。每念及此，我都不禁一阵寒战。'
