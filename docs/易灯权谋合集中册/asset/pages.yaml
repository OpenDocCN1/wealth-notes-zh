- pgno: 897
  md: 中国的现代化，大家都说，首先是富国强兵，富国是解决吃饭的问题，强兵是解决挨打的问题。近代以来，我们是先解决挨打，再解决挨饿——勒紧裤腰带，也要有根打狗棍，这是被逼无奈。但是足兵摆在足食前面还是当时的硬道理。春秋战国时期，战争频仍，手中没有杀人刀，怎么办？战国末年更残酷，动辄几十万、上百万人被杀。《鹖冠子•近选》说，天地人，天地远、人道近，三者之中，人最重要，人道又以兵最重要，叫“人道先兵”。因此，《孙子》开篇就讲“兵者，国之大事，死生之地，存亡之道，不可不察也。”
  merge: -1
  img_proc: true
- pgno: 898
  md: '身处春秋乱世的孔子，奔走各国践行其济世理想，世称圣人。有人认为，圣人谈德政、谈礼教。那么，孔子的治国方略中有“谋略”和“兵法”吗？


    《论语·卫灵公》引孔子的话曰：“军旅之事，未之学也。”可见孔子并没有学过兵法。但子贡问政，孔子讲了三条：“足食，足兵，民信之矣”。（《论语·颜渊》），其中还是有兵，这就涉及了谋略问题。记得曹操写《孙子略解》序，引经据典，特别提到孔子所谓的“足兵”。'
  merge: -1
  img_proc: true
- pgno: 899
  md: '不过孔子有孔子的理解，在他看来，这三条，信最重要，食次之，兵又次之。三者之中，如果让他挑选，舍什么留什么，他先舍的是兵，其次是食。没有武装要死人，不吃饭也要死人。但去食去兵顶多个死，自古以来，死人的事常有，没有信却不行。


    《孙子》的“五事七计”强调道、天、地、将、法的重要性。其中，“道”位列第一。“道”是什么？道就是民心向背。得人心者得天下，失人心者失天下。得道多助，失道寡助，这就是政治。孔子说：“自古皆有死，民无信不立”，民信就是与上同


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_899_0.png)'
  merge: -1
  img_proc: true
- pgno: 900
  md: '心同德。孟子说：“天时不如地利，地利不如人和”（《孟子•公孙丑下》），人和就是民不违。我们也可以说，道就是民信，道就是人和。可见，孙子也将孔子所谓的“信”作为至关重要的战争要素。


    但是，另有人讲。“兵者，诡道也。”用兵，就是要用计谋，讲仁义道德无异于作茧自缚。我以为，此话只讲对了一部分。总的来说，道德沦丧的时代，谋略往往比较昌盛。而非道德性，确实是传统谋略的一个缺陷。《孙子》所谓之“道”在这种条件下就往往沦落为阴谋诡计。'
  merge: -1
  img_proc: true
- pgno: 901
  md: '事实上，谋略可分为三个层次。


    第一层是战略性谋略，可以称之为大谋。大谋是一种引进了价值判断的谋略，一定要以人心向背为依归。刘向说得好：“夫权谋有正有邪，君子之权谋正，小人之权谋邪”。大谋，就是君子之谋，就是孔子的“信”，孙子的“道”，孟子的“人和”。


    第二层次是战术性谋略，可以称之为中谋。他是战略性谋略的实施方案和操作步骤。战术上的谋略强调兵不厌诈，同'
  merge: -1
  img_proc: true
- pgno: 902
  md: '时，兵贵防诈。孔子坠三都就含有战术性谋略。


    第三层次是智巧谋略，可以称之为小谋。“兵者，诡道也”用在这里最为恰当。智巧性谋略是落实战术性谋略的具体措施。它以结果为导向，操作的极端往往忽视道德。


    以《三国》为例。隆中对是大谋，是战略性谋略，重点是建立统一战线，欲判天下三分的局势；赤壁之战是中谋，是战术性谋略，重点是抗曹；围绕赤壁之战设下的种种计谋，如苦肉计、连环计、'
  merge: -1
  img_proc: true
- pgno: 903
  md: '离间计等等，则都是小谋，是智巧性谋略，是诡道。


    孔子所讲的“民无信不立”恰恰是最高层次的谋略，是大谋，是战略性谋略，是长期谋略。显然，战略性谋略用好了，对手受到最大程度的孤立和限制，战术谋略和智巧谋略就不需要了。这就是孙子追求的“上兵伐谋”和“不战而屈人之兵”，这才是兵法的最高境界。然而世上并不具备孔子思想施展的条件，又可惜世人贪得无厌、以邻为壑，只知兵不厌诈、巧取豪夺，都走上了歪路。'
  merge: -1
  img_proc: true
- pgno: 904
  md: '# 饭局到底是个什么局


    中国的饭局吃饭事小，设局事大。所以菜不一定丰盛，但一定有个主题。中国的饮食之道，也是人情融合之道。一场饭局，既是亲朋故交之间的沟通交流，也是生意对手间的交锋谈判。所谓人脉，所谓圈子，所谓社会关系，所谓资源，所谓一个人的能量，所谓友谊，所谓生意和交易，最后通通绕不开饭局。酒肉虽然穿肠过，交情自在心中留。


    饭局之妙，不在“饭”而尽在“局”也——一个完美的中国式饭局，设局人、入局人、局托儿、陪客各角色一个都不能少。'
  merge: -1
  img_proc: true
- pgno: 905
  md: '有组织，有派系，有结交，有承诺，有阴谋。


    在中国饭局无处不在，结婚有饭局，升学有饭局，赔礼有饭局，办事有饭局，过节有饭局，跳舞有饭局，开会有饭局，打球有饭局，电影收官有饭局，开业有饭局……


    透过饭局里的中国人，我们看到的却是饮食之道里的政治利益、社会关系、人际规则和文化滋味。所谓饭局之妙，不在“饭”而尽在“局”也——饭局千古事，得失寸唇知。


    906'
  merge: -1
  img_proc: true
- pgno: 906
  md: '中国人崇尚民以食为天。又说，人生在世，不过吃穿二字。所谓的历史纵横，文化长廊，风土人情，上下五千年，其实都蕴藏于日常生活的吃喝之间。


    中国古代最著名的饭局，莫过于两千余年前那场“鸿门宴”，但觥筹交错背后暗藏的玄机、杀机却未必是中国饭局传统的常态。同样是司马迁，他在《史记·孟尝君列传》里的另外一段，却写出了中国饭局的原汁原味。孟尝君广招宾客，对于那些投奔自己而来的侠士，无论贵贱都与自己吃一样的馔品。但明白人一'
  merge: -1
  img_proc: true
- pgno: 907
  md: '眼就能看出，这里所谓请客吃饭，从一开始吃的就不是饭桌上的东西。而战国四君子，门下笼络了食客三千，每日都会有大大小小的饭局开张——中国最早的圈子文化，就这样诞生在夜夜笙歌不绝的饭局之中。


    老子在《道德经》里说：治大国如烹小鲜，说的就是当权治国，就像一个星级大厨，将各种食物配料和烹调，从而达到政通人和的佳境。


    对中国人来说，饮食之道，也是人情融合之道。可以是一场饭局，也可以是亲'
  merge: -1
  img_proc: true
- pgno: 908
  md: '朋好友之间的沟通交流，或者一个生意场上的谈判，在这一点上，与西方人自居一隅，各自分餐有着文化根源上的区别。易中天说，中国人喜欢请客吃饭，并不是中国人好吃，而是中国文化的思想内核——群体意识使然。所以，看一个人经常混迹于何类饭局，几乎便可以洞悉其兴趣、爱好、财富、身份、地位。饭局在中国，也是一个人的社会身份认同体系。


    # 漫谈权谋


    权谋，是近来才流行起来的词，对于它，说实话我不喜欢，甚至有些讨厌，偏偏市面上流行起种种“权谋”书，令嗜痂者'
  merge: -1
  img_proc: true
- pgno: 909
  md: '如发狂疾。他们可曾想过，权谋书究竟能带来何种益处呢？


    权谋源出兵法，乃以诡谲之道用于经世之学，其死穴在于不讲正义性，这是我不喜欢它的一个原因。当然，诡谲之计原可用于正途，这是不能抹煞的，人若能借鉴于此，跳出习惯思维，解开难题，亦不失为功德无量的好事。可问题在于，熟读“权谋”书，未必能学得秘技，这才是我想说的。


    兵法上讲有正有奇，权谋书偏重用奇，教人反其道而行止，现代所谓“逆向思'
  merge: -1
  img_proc: true
- pgno: 910
  md: '维”者也。然而用奇之道一旦成为圭臬，便不复有当日之功效。现在不少书讲三国权谋，不妨举几个《三国演义》里的例子，看看权谋是否可学。


    话说长坂坡前尘土飞扬，张飞身后却只有十几个人，七八条枪，你当然可以得出结论：“虚张声势者必定外强中干”，这结论怕不一定对：因为曹丞相兵败赤壁，放着寂静的大道不走，偏选烽烟四起的小路，用的正是上面这种逆向思维，结果却是不幸正中埋伏！


    你若以此为由坚信直觉，排除狐疑，可'
  merge: -1
  img_proc: true
- pgno: 911
  md: '知那周瑜督见南郡城头虚搠旌旗，便催马进城，正合此理，结果却中了暗箭！


    你若由此断定：城门大开必有埋伏，却无端地让孔明逃去了性命！


    当你为学得了空城计而欣喜不已，魏禧却在一旁冷然道：“余尝笑《三国演义》孔明于空城中焚香扫地，司马懿疑之而退。若遇今日山贼，直入城门，捉将孔明去矣！”（见《日录》卷一）


    权谋之学，俗点讲就是猜心思，雅点讲就是现代经济理论所谓博弈者也。博弈'
