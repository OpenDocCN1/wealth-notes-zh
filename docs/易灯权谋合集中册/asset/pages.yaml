- pgno: 663
  md: '吧，结果，比干被活活剖心而死。


    所以，历史把人教聪明了，于是人们不再盲目提倡忠诚，不再莫名其妙地为人冲锋陷阵，甚至为人抛洒热血。于是人们响亮地提出“士”只为“知己者”死，并且发誓：“良禽择木而栖，贤士择主而行。


    # 学与用


    知识即商品，然商品有贵贱之分。之所以贵，乃因知多，有一长也；之所以贱，乃因知寡，而无一长也。故欲人贵，非好学不能贵；欲使人高造价，非自奋不能高造价也。


    664'
  merge: -1
  img_proc: true
- pgno: 664
  md: '夫人有不学而能身价高乎？不能！尽管有贻娘老子“商标”而贵者，然只可贻一时，而不能贻一世；尽管能贻一世，然因“伪劣商品”，不能为人所敬重也。故欲贵之，必先学之。学即买进，用即售出。


    然买进，是为售出而买进；而售出，是为赢利而售出。盖人之大脑，如一储备库，又如一生产厂家。学习，即我购进原材料，一经加工，而后售出。故人生之过程，乃是不断求知，又不断致用之过程也。'
  merge: -1
  img_proc: true
- pgno: 665
  md: '孔子曰：“精义入神，以致用也；利用安身，以崇德也”。故学习之目的，在于使所学有作用于国家，有作用于社会。所以，学习旨在提高做人之品位，然后使我进入最完美之境界。无人买则罢，但有人买，必不敢如酱油、醋一般讨价还价。


    所以，少年贵于学，成年贵于用。然成年又不可不学，其如不断进货，不断售出，不断赢利之过程。且知识之交易过程，大不乏如商品之交易过程；而商品之交易过程，又不乏是人与人之交易过程也。'
  merge: -1
  img_proc: true
- pgno: 666
  md: '如均有买卖双方，均有商品名称，均有产地、包装、品类，以及质量高低之诸特征。所不同者，只是额头上不贴价格标签，也不标明价位，不设置防伪标志。且自身价值，从表面看，似乎也不按生产成本核算，而实际上也是以生产成本，工艺流程，质量品牌，以及诸多因素核算之。故一旦投放市场，予其说知识，还不如说是人与人之交易。


    所以，人不能不学。不学，即我库中无货；无货，如何同人交易？然货多，又要看其紧俏否！紧俏与不紧俏，又要看


    667'
  merge: -1
  img_proc: true
- pgno: 667
  md: '其能推销否！如不能推销，即便货物再多，只能积压之，霉变之。故学习如进货，进货重在推销，推销重在赢利。


    于是，凡善学者，当以善用为上。不然，虽有知识，而不能活用者，则如无知识一般。故学习如制商品，商品又不能不以社会需要而制作。只有按社会需要制作，方能使消费者踊跃购买。故拥有知识，不过是完成做人之第一道工序，而做人之最终目的，则是让知识成为紧俏商品，而使人购买，然后从中取利之。


    所以学在于用，在于能否将所学发挥'
  merge: -1
  img_proc: true
- pgno: 668
  md: '之，凡能发挥者，如所有商品悉数推销之；若不能发挥，如商品虽多，但积压霉变，无人购买之。故不在知识多少，重在能否发挥。如十分知识，只能发挥一半者，则按一半计算之；若十分知识，只能发挥一分者，则按一分计算之；若半点发挥不出者，则不能计算之。


    故文凭不等于知识，而知识又不能等于人才。其如鲁迅笔下之孔乙己，虽有满腹经典，然因不能所用，不能将所学变为商品，虽有知识，乃死知识，故有知识如同无知识一般。其如生意，进一堆'
  merge: -1
  img_proc: true
- pgno: 669
  md: 货物而不能推销，安能不赔乎？
  merge: -1
  img_proc: true
- pgno: 670
  md: '相反，有大事业成就者，虽不曾高等学府就读，但不等于知识不曾买进。只是知识之进货渠道不同，故被人不以“知识分子”看待之。如电视剧《大染坊》中之陈老板，虽字不识几个，然耳濡目竭尽能悟不胜悟，于是不仅事业成就，且做人之品位，远比那些酸文人高尚得多。


    故能事业成功者，虽多无名牌大学之文凭，然因“敏而好学”，且又能举一反三。于是知识买进越多，则售出越多，自然利润越大。又因其善于交易，虽仓库无货，却能先拿订单而后生产之。更有不


    671'
  merge: -1
  img_proc: true
- pgno: 671
  md: '生产者，能以人之产品，贴己之商标。


    于是知识能买进，又能售出，且在一买一卖中，不仅能知识转换为商品，又能知识转换为荣誉与权力。


    噫嘻！人如电脑。不学，是不输入也；不输入，即品牌再高，形同虚设。又学不能所用者，虽能输入，然无显示功能，即便输入再多，是白输入也。所以，编辑电脑之程序，是因用其程序，倘不能用，岂不自程序乎？


    所以，求知是为理明，理明是为谋事能明。如理明者，采众家所长，为我家所长；'
  merge: -1
  img_proc: true
- pgno: 672
  md: '分析众家之不足，而避我之不足。然后身价高，一旦遇之以买主，则势必以“高档商品”交易之。且又因其知多，因其有一能之务，所以一旦投放市场，安能不纷纷抢购之。


    孔子曰：“待价而沽。”待价者，乃是等待机遇，又等待买主也；沽者，机遇至，买主求购，自然高价兜售之。如孔子周游六国，是推销其思想；毛遂自荐，是推销其才能；孙膑、庞涓、苏秦、张仪，是推销其谋略。然敢于上门推销，是因有知识推销，若无知识，何以推销之？'
  merge: -1
  img_proc: true
- pgno: 673
  md: '然尽能推销乎？有能推销者，又有不能推销。能推销者，未必货真价实；不能推销者，未必不是极品。所以，有逢其时，有不逢其时。至于有不愿推销者，如鬼谷子，司马水镜先生，定有其不推销之理由，故不属所论范畴，所以，暂且不论之。


    夫学而致用之理，万劫不复之理焉。故能推销于当代者，自然为佳；倘不能，还可身后推销之。盖大千世界，又非一条路可走，故此路不通，当走之以彼路。岂能因一处受阻，便沮丧乎？如孔子不'
  merge: -1
  img_proc: true
