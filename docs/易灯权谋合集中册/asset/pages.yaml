- pgno: 231
  md: '为”而达到“无不为”。这一权术的内容可以归纳为以下五个方面：


    其一，君主要深居简出，神出鬼没，隐蔽自己的行踪，使自己在臣下的心目中充满着高深莫测的神秘感。这种神秘感会对臣下产生巨大的威慑力量。在这方面秦始皇最为典型。他经常变换居住的宫室，严禁侍从把他的言行透露给大臣。侍从违令，泄露了他的行踪，就要被处死。汉武帝经常潜游离馆，外朝官难以面见帝王，凡请奏机宜，多由宦官充任，这就增强了汉武帝的神秘性。明世宗十几年不见大臣，有一次，他在内廷召见大臣，几位大臣战战兢兢，诚惶诚恐。世宗听了汇报后，感到不满，哼了一声，一位大臣当即吓得尿屎失禁，秽气熏天，被内侍拖出了内廷。


    其二，君主对任何事情都不要事先表态，不要'
  merge: -1
  img_proc: true
- pgno: 232
  md: '流露出自己的意向。只要君主有任何意向性的表示，臣下都会钻空子，或乘机使诈，这样一来，人主就难免受到迷惑。君主应该尽量让臣下发表意见，让他们尽力去做，自己则冷眼旁观，不露声色，不置可否，在暗中观察臣下的一举一动，伺机捕捉臣下的过失。这就是韩非所主张的“虚静无事，以暗观疵”之术。


    其三，君主不要显示自己的欲望，不要随便表示自己的好恶。韩非说，君主不要显示自己的欲望，若君主显示出欲望，臣下将千方百计满足君主的欲望以献媚；君主不要暴露心意，若君主暴露心意，臣下将显示其异能以投其所好。所以君主能隐蔽好恶之情，臣下就能现出本质。臣下总是要千方百计地观察君主的欲望和好恶，然后投其所好，设诱饵以钓之。据说，燕昭王爱说梦话，为了不把自己的心思泄露给侍从，经常独寝一室。'
  merge: -1
  img_proc: true
- pgno: 233
  md: 其四，用权术参验群臣，以察奸邪。韩非对君主参验臣下的权术列举得非常详细，其大意是：参听众人之言，以知其是否忠诚；改易臣下任职之地及其职位，以观其实际才能；根据现有的事实推测审查其隐私隐情，举其往事以知其现状；通过亲昵之人而探其内情；以诡谲之道而使之，以杜绝其渎慢行为；故意说错话、说反话、做错事，试探所怀疑的人，以得奸情；派间谍监视、伺察专任之臣；扬言欲做某事，以察奸人动静；故意显示意欲好恶，以观察人臣的正直或谄谀；臣下结成朋党，则从中挑拨离间，制造事端，使其内部争斗，以散其党羽；详尽掌握一事的原委细节，以惊惧臣下之心，等等。隋文帝就曾派人向官吏行贿，凡接受贿赂者皆处以重刑。唐太宗为了考察官吏是否廉洁，也密使左右向掌管全国关卡通行以及赋税事务的司农令史行贿。该人受绢一匹，就以贿
  merge: -1
