- pgno: 591
  md: '乎都说得通，且还蕴含着一股温馨的人情味。


    长期“平衡”下去的结果是没有人变得过于突出，也没有人显得过于糟糕，这对单位的整体发展不能说没有一点好处，但对个人的积极性未免会造成打击。


    这个例子其实只是“制衡”之术的基础，充其量算是“平衡”之术，但这种“平衡”之术却是我们日常生活中经常遇到的。


    再举一个例子。如果你在单位担任中层领导而且表现突出，深受下属的拥护，你的受拥护程度甚至超过了你的上级领导。如果你对古往今来所有“功高盖世”的人的下场没有深刻的认识，再加上你遇上个小肚肠又熟练掌握纵横捭阖之术的领导，你所面临的处境就未必有你想象的乐观了。


    一般情况下，你不会因“功高盖世”而直接被淘汰，除非你的上级领导脑袋进水过多。但也许会有另外一名同事借


    592'
