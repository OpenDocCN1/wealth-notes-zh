  md: '盾；但收取人心，柔在刚上。


    扰乱对方，激怒对方，等待对方的破绽，然后可以获胜。


    使对方畏惧，并处于危险之中，此后方可施行收心的计谋。


    削弱对手，比强固自己更加便利有效。敌人弱了，就等于我变强了。


    # 八、权奇


    善察者明，慎思者谋，无言者智。


    擅使“拖刀之计”者，往往是最后的赢家。


    想要战胜对手，就一定先要放纵他们，使他们骄横。


    故意违背他的愿望，使其浮躁，诱其露出漏洞，则大事可成。


    善隐者胜，善显者败，善辨吉凶者无忧。


    计谋没有好坏高低，能适用者为上策。


    # 九、谬数'
