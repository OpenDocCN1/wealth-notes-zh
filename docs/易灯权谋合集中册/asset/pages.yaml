  md: 这是一种为极端的封建专制扭曲了人格的人所遵奉的可怕的官场哲学。它用一已私利绞杀了真理，窒息了正义，笼罩了光明；其结果是邪恶更加肆无忌惮，暴虐更加张牙舞爪。当这种官场哲学日益像毒品一样，麻醉越来越多的灵魂，历史便会由此放慢或停止它前进的步伐。李膺，作为一个封建士大夫，竟然能唾弃这种可怕的官场哲学，毅然决然地率领众多“党人”和儒生与宦官、乃至宦官背后的皇帝殊死抗争，这是多么难得可贵啊！
