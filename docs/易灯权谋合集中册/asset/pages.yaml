- pgno: 1390
  md: '一条路走不通了，有城府的女人不会钻牛角尖。她知道什么时候该坚持，什么时候该退让。不会耿耿于怀，也不会傻乎乎地去争那“一口气”。保持头脑的灵活与好奇心，保持身手的敏捷与眼光的长远，永远给自己留一条后路。


    高端的城府是回归纯真


    鲁菜中有一道经典的“开水白菜”：高汤历练，文火焙烘，再蒿去沉淀，看似清澈见底，但所有精华都浓缩在汤水中，口感淳厚，回味无穷。最有城府的女人，是能够将一切尽收眼底，取精华，去繁复，遇事沉着冷静，更为重要的，还能在这种坦然与冷静下，保持轻松和单纯的心态。


    不是每个女人都能修炼出最高级的城府，就像不是每个学武的人都能练成大师——她必得聪明过人吃过苦头，同时又须有足够的善良敏感和睿智，才可以在掌握一切技巧之后，依然正直纯粹，并执着于此间的爱与生活。'
