  md: '置，同样的部门，不同的人其权力使用效果是大不一样的。善于用权的人，能把权力无限放大，官小能办大事，不会用权的人，好事办不好，坏事管不了，给好人做不了主，还要被赖人欺负。对于善使权术的人，权力是工具，想怎么用就怎么用，对不懂权术的人，官位是个规矩，出不得圈，也碰不得框，囿于其中。权术在术不在德，是种技巧，技术娴熟、收放自如为上乘，德艺双全者少之又少。


