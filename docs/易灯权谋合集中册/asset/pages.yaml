    # 蜘蛛、蚂蚁、还是蜜蜂该倾向哪一种？


    历史上成功的创业家或创新者，往往从他人身上得到灵感，或从他人手上偷抢而来，再不断改良与精进。不过，神偷与其他人最大的差别，就是有没有经过创造，让偷来的东西成为截然不同的新作品，跳脱小偷格局。


    就像诺贝尔文学奖得主、诗人艾略特的名言：不成熟的诗人只会依样画葫芦，成熟的诗人懂得偷天换日。拙劣的诗人会弄巧成拙，优秀的诗人则会转化提升，创造出独一无二的作品。'
  merge: -1
  img_proc: true
- pgno: 1262
  md: "英国哲学家培根也说，人分成 3 种，\n\n一种像蜘蛛结网，所有作品完全出自自己，不擅长从外界取得元素，只能闭门造车；\n\n第二种像蚂蚁囤粮，只会原封不动地把外面的东西搬回巢里，不懂得运用资产；\n\
    \n第三种人像蜜蜂酿蜜，采了花蜜，经过消化后成为蜂蜜。\n\n要像聪明的蜜蜂一样，将外界的事物转化成自己的东西，可以运用加减乘除重新诠释：\n\n+   1.\
    \ 拷贝他人精髓\n   是一种资讯搜集、储存及模仿的能力，要有足够的参考资料，才有办法形成自己的观点，它是获取灵感最基本的方 式。\n\n无论在哪个领域，想成为顶尖的人，就是先想办法把竞争对手的本事学起来，好好复制别人的能力，再从这个基础加上新元素、点子，做出更好的东西。"
  merge: -1
  img_proc: true
- pgno: 1263
  md: '+   2. 去除无用资讯


    把东西拷贝回来后，要先拆解，把没用的东西去除，留下有用的。


    减法思维是一种逆向思考，不停地将无用且多余的部分去除，才能看见重点、专注在重要的东西上。


    +   3. 资讯加乘


    是一种资讯转换能力，将搜集回来的东西消化吸收后，再融入自己的经验、创意，改造成全新的东西。


    大部分的创新都是乘法游戏，结合两个原先不相干的元素，比方说，将不同领域的专业或兴趣结合，就有可能找到新的切入点。


    +   4. 浓缩、整合


    整合、浓缩，用除法萃取精华，创造自己的作品。


    借用他人的资源、元素，完成自己的目的，是所有成功事业都在做的事。经过这些步骤，跳脱既有框架，发明出新的商业模式和产品服务。'
  merge: -1
  img_proc: true
- pgno: 1264
  md: '# 应对办公室政治的 11 种策略


    办公室政治在中国一直是很多管理学家不愿意去碰、去谈的管理问题。就是在国外，我目前所见研究也比较少。我相信办公室政治在国外也是普遍存在的，只是没有在中国企业里这么突出。而在中国的民营企业里，办公室政治的作用和影响就更加巨大了。


    # 企业产生办公室政治的原因


    要搞清楚办公室政治，有必要先搞清楚什么是政治。古希腊哲学家亚里斯多德在两千年以前就说，人生来就是政治的动物。也有人将自古以来林林总总的政治理论分为了四类：作为政府艺术的政治、作为公共事务的政治、作为妥协和共识的政治、作为权力和资源分配的政治，并将其概括为：通过妥协、调解和谈判而非武力和赤裸裸的权力来达到目的。


    1265'
  merge: -1
  img_proc: true
- pgno: 1265
  md: '其中一位现代学者将政治理解为：政治是这样一种活动，它根据不同利益集团对整个共同体福祉和生存的重要性，给与相应的权力，以此来调解它们在既定的统治单位内的关系。


    马克思则认为：政治是经济的集中表现，任何阶级的政治都是以维护本阶级的经济利益，建立和巩固本阶级的统治为目的。政治的核心，是解决有争议的事物，常常是有关社会资源的分配。推行政治，需要有权力，需要有权威。政治作为的影响和结果总是涉及许多人。


    办公室政治就是把你自己的人搞得很多，把反对自己的人搞得很少。


    不用列举更多定义，我们就已经可以得出一个基本结论：政治其实是一群人当中的权力、利益分配制度设计或分配机制。


    那么，将政治概念延伸到企业管理当中之问，准确地讲它到底指的是什么呢？网上意见很多，但其实质比较一致，现抄录几则如下：'
  merge: -1
  img_proc: true
- pgno: 1266
  md: '——办公室政治就是办公室人际关系的竞争，是能力和智慧的体现，是没有硝烟的战争。简而言之，就是应对进退的分寸拿捏，是害人之心不可有、防人之心不可无的谋略。


    ——办公室是个小社会，不像学校和家庭那么单纯。在办公室混饭吃的人很少能感觉到做人的轻松与悠闲。职场中固然充溢着世俗的体面和晋升的诱惑，但也充满了人际的诡谲、攀爬的艰辛和竞争的陷阱。通晓办公室“政治”，你将从竞争中脱颖而出，稳稳占有自己的一席之地。


    ——办公室作为一个团队，是人的结合，每个人都有自己的优先顺序和利害关系，你是其中一员，如果不学会协调人与人之间的关系，玩儿不转“办公室的政治游戏”，是很难平步青云的。即使你拥有一身过硬的本领或像爱因斯坦那样聪明，也要学着了解办公室的生态环境，才能在办公室的政治游戏中，保护自己不受伤害。


    为了便于理解，可以这样说，办公室政治就是企业内部所有成员在权力、利益分配上的一成文、不成文的规则和机制。事实上，办公室政治表面看上去你跟谁好，谁和谁一派，是人际关系，其实质却是为获得并保障自身利益的权力。有人的地方就存在利益分配，就会存在政治，企业办公'
  merge: -1
  img_proc: true
- pgno: 1267
  md: '室作为一种经济谋利组织，大家聚在一起就是为了谋利益，自然也不能免俗，甚至有此风颇盛之事实。


    决定企业办公室政治风气和游戏规则的因素相当复杂，但总体而言，不外乎以下几大因素：企业老板的看法、企业发展的历史沿革、企业主要管理者及骨干带来的影响、企业管理团队中各成员之间的背景及对企业贡献大小程度等等。而就民营企业来讲，什么样的老板基本上决定了企业会用什么样的管理方法，也就在很大程度上决定了企业会有什么样的办公室政治。显然，不同类型的老板对应企业会有不同类型的企业办公室政治。下面，我将分一言堂型与非一言堂型老板的两种企业来分析。


    # 一言堂型企业中的办公室政治特征及管理者可采用的政治策略


    在唯我独尊型老板的企业里面，企业的企业办公室政治一般具有以下几个鲜明特征：


    在企业里只有一个老大，就是老板；在企业也只有一个决策人，也是老板。其他人在老板面前均没有什么真正的地位，'
  merge: -1
  img_proc: true
- pgno: 1268
  md: '再大的官也不过是老板的附庸。从管理权威上讲，老板拥有全部绝对的权威。就其他管理者来说，幸运的佼佼者可能拥有专业权威或道德权威，但也只是部分或者完全没有管理决策权威，一切决策均须以老板最后的决策为准。


    由于在大小决策中，老板一股独大，其他人完全没有实质性发言权，而只有建议权和游说权，所以迫使其他的管理者包括企业创业元老甚至员工要采用变形的方式来参与决策。这五种基本的政治策略如下。


    # 1、附议者策略


    无论在任何场合，也无论自己是否真地认同，都将自己坚决、毫无保留地装扮成老板的附议者，以此博得老板必要的安全信任度，提高自己在公司中的地位和影响力，然后通过事先事后与老板的私下沟通建议，来影响老板的决策意见。此策略可称为义无反顾并始终如一的附议者策略。


    在许多企业，面对一言堂型老板，此政治策略颇为管用。其妙处在于首先在政治上站好队，永远站在老板一边，然后通过私人场合而非公开场合对老板提出管理建议，从而极大地'
  merge: -1
  img_proc: true
- pgno: 1269
  md: '满足一言堂老板的管理威信需要，以及老板的自尊心甚至可笑的虚荣心。


    该政治策略的好处是永远不会被看作异己份子，所以比较安全；坏处是这一策略只是适应甚至盲目迎合老板好恶，政治上是永远正确的了，但业务上却完全可能犯下不必要的错误。老板作为企业的所有人，最终业务上的得失会转化为政治上的得失，管理者如果在业务上犯错误，同样也会造成政治上不受信任。


    因此，从严格意义上讲，对于一言堂型企业来说，附议者策略不失为一种好的策略，但并非完美。不过完全可以通过改进变成一个最佳政治策略。


    # 2、忠诚者策略


    并非任何公开场合或任何公开决策都坚决支持老板决策，但却以对老板绝对忠心耿耿出名，并且对老板个人的忠诚已经经过较长时间的证明。此一政治策略可以简要概括为长期忠诚者政治策略。


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1269_0.png)'
  merge: -1
  img_proc: true
- pgno: 1270
  md: '长期忠诚者策略的根本要点不是管理者能够为企业服务的业务能力，而是一种绝对服从老板和企业根本利益的忠诚度和因此而建立起来的相互信任和深厚感情。这是大多数成功的创业元老所采取的明智的政治策略。但如果职业经理人看好老板本人和企业发展前途，长期忠诚者也不失为一个较好的政治策略选择。


    忠诚者策略也有利有弊。好处是无论你说什么，只要不伤害老板自尊心，老板都不会对你产生怀疑，在企业也人人知道你是老板死党，因而也能够分享到老板所带来的部分权威，但在处理自我角色地位时需要成熟的智慧。


    坏处是需要极强的忍耐力和相对较长的时间来逐渐建立这种政治关系，千万不可急于求成，因为忠诚需要经过许多严峻时刻的考验才能体现出来。另外，忠诚型管理者在前期需要放弃部分应得利益，尤其是需要放弃跳到另一家企业获得更好发展的机会收益，代价同时是金钱、感情和精神上的，非常巨大。


    而且忠诚者要忠于企业和老板利益，在性质上不同于惟命是从者，有时为了维护企业和老板利益，可能需要采取适当方式修正老板意见，这需要极高的技巧和较好的胆略，弄不好'
  merge: -1
  img_proc: true
- pgno: 1271
  md: '要受打击。当然，一旦忠诚关系建立起来，回报也是巨大的。尤其是在中国民营企业里面，忠诚型管理者很有市场。从民营企业健康稳健的发展角度考虑，老板喜欢这样的人也是对的。忠诚者策略也不是最佳策略，但可能是适用于多数民营企业的次佳政治策略之一。


    对于忠诚者来说，最大的危险是控制不住自己，利用自己特殊的忠诚关系谋取个人利益。这样子就演变成了和坤型管理者，一方面是权势薰人，另一方面是危机四伏。由于不当谋利其实是损害企业老板利益，时间一长，老板一旦察觉，想法就会改变，虽然暂时不会下手，但被清除也是迟早的事情。因为忠诚者已经变成不忠了，其价值也就跟随失去。


    # 3、应声虫策略


    这种策略简单明了，就是老板说什么我就做什么，无论对错，完全服从，百分之百执行。这样的策略没有风险，但也不受老板器重和同事尊敬。这对于许多没有太大能力的管理者来说，应当也是一个好的政治策略。因为企业永远需要能够不折不扣认真干活的人，这些人老板并不要求他们很聪明，经常有什么新想法，而是要求他们认认真真把吩咐他们做的事情做好就行。'
  merge: -1
  img_proc: true
- pgno: 1272
  md: '# 4、魏征型策略


    这种策略也容易理解，就是经常只从企业利益角度考虑，敢于向老板进谏。这是我本人不提倡的一种策略，原因是没有任何一个领导或老板真正从内心深处愿意别人公开指出他的缺点，这种策略是对，但政治风险太大。就是你业务能力再强，讲得再对，但领导感情上非常别扭，不是一种让双方都舒服的上上策略。就是李世民如此明君，魏征也经常有杀头的危险。而且采用这种策略往往在企业树敌颇多，因此无法得到大多数人的认同，也就不能团结大多数，因此也做不到太高的职位。如果从管理者个人成长角度来讲，这显然是一个不小的损失。因此，本策略于己于人皆非最佳策略。


    # 5、忠诚同盟者策略


    就是周总理对待主席的策略。这个策略非常好，为所有策略中能够创造多赢局面的最佳政治策略。这个策略的特点是：管理者不是企业老板的附庸，而是老板亲密无间并且长期忠诚的合作者。合作者意味着大家地位虽然不同，但基本上是相对平等的，大家谁也都是真正地需要谁，事业也是大家共同经营的一个事业。忠诚意味着管理者与老板之间不仅是合作关系，而且建立起了一种非常可靠的相互完全信任的


    1273'
  merge: -1
  img_proc: true
- pgno: 1273
  md: '牢不可破的思想、感情关系。既有了忠诚，还有合作，所以正常情况下，这种关系虽然会有所起伏，但从较长时间来看，仍然是非常有效而且长久的密切关系。


    如果一个管理者能够与老板达成这样一种关系，那么对于个人、对于老板、对于企业、对于其他员工的影响都是正面的，在政党管理、国家管理中也好，在企业管理中也好，忠诚同盟者均应是管理者应当采用的最佳策略。忠诚同盟者可大可小，对于管理才能也有一定的较高要求。说白了，这样的管理者对于企业老板来说那真的是已经“德才兼备”，既无限忠诚可靠，又非常能干，企业老板没有理由不将他纳入自己的事业伙伴和感情、精神世界。


    在中国的民营企业中，一言堂型老板占的比例较大，国有企业中也有一些。但在另一些管理相对较好的民营企业和大部分国有企业里面，仍然存在一些非一言堂型的老板。


    # 办公室政治特征和管理者采用的政治策略


    非一言堂型企业的办公室政治具有以下几个共同特征：


    1274'
  merge: -1
  img_proc: true
- pgno: 1274
  md: '企业里面老板并非事事一言堂，而是能够倾听几个或一些管理者的决策意见，最后采用集体研讨、老板拍板的民?集中制模式进行大的企业经营事项的经营决策；


    企业老板并非事事都必须自己拍板，而是按照一定规章制度对各级管理者均有一定的授权，具体授权范围大小因不同企业、不同部门、不同岗位有差别变化；


    企业管理相对比较正常，所以企业办公室政治气氛也随之比较公开和正面，因为政治原因而引起的企业内部冲突会相对较少一些，企业政治以“显规则”为主，完全大同一言堂型企业中存在的大量“潜规?”；


    由于非一言堂型企业文化的公开性和正面性，管理者相对较容易认知并融入企业的文化和管理结构，因办公室政治因素而引起的管理冲突会明显减少，管理效率相对较高，企业政治气氛相对舒畅开放。


    在这样的企业中，企业对管理者的政治能力要求相对低一些，但企业的政治作用仍然十分巨大。如果管理者采取错误的政治策略，违反企业公认的基本政治游戏规则，同样可能倍受打击甚至被清除出局。'
  merge: -1
  img_proc: true
- pgno: 1275
  md: '非一言堂型老板又可细分为寡头决策型老板和团队领导型老板。两者的差异主要在于寡头决策型老板主要与企业当中最核心的几个管理者共同决策，而团队领导型老板则基本上向所有管理层成员开放决策建议权。这两种老板所在的企业中，管理者的政治策略基本类似，可以采用以下六种基本政治策略。


    # ## 1、忠于职守型策略


    就是认认真真干好自己份内的事，既不惹事生非，也不帮助或主动影响其他部门或同事。完全遵循企业已经存在的相对比较成熟的工作、政治显规则办事，满足企业老板和其他同事对自己的工作、政治期望。


    这个策略的好处是简单正确，无须付出太多心血去经营自己的政治关系，在公司完全以纯粹普遍的工作合作关系为主。坏处基本上没有，但一旦自己或自己部门有事，在企业中就没有朋友，因此没有会帮助你和你的部门说话。可是任何一个部门或个人总归有需要其他人或部门帮助的时候。因此，忠于职守型策略属于合格的没有毛病的基本策略，但远非最佳政治策略。'
  merge: -1
  img_proc: true
- pgno: 1276
  md: '# ## 2、友好帮助型策略


    友好帮助型策略是在完成自己个人或部门本职工作外，经常有意识地主动关心、帮助其他同事或部门完成他们的工作。这一策略的实质是主动为工作付出更多，不只顾自己而且还服务他人。这样做一方面是表示对于其他部门或个人的友好之情，另一方面也是希望其他部门或同事能够投桃报李，在自己需要帮助时能够马上伸出援手。这种政治策略比忠于职守型高明，它能够帮助管理者通过正面的帮助行为改善自己与其他部门或个人的政治关系，也能够给自己在公司的声誉、地位巩固、提升带来一定但并非决定性的政治价值。


    # ## 3、开放影响型策略


    开放影响型策略指，不仅在具体工作上主动帮助他人部门，而且通过推销自己、展现自己、加强思想感情交流等多种方法推广自己和自我部门，不仅帮助他人部门在工作上提升，改善他们他们的工作质量，而且通过互动交往，加深双方的工作、思想、感情上的联系，发掘更多的共同点和共鸣点，从而形成一个相对较和谐紧密的跨部门非正式组织联系，与正式工作关系相补充，最终在企业内部形成自己的一种决策影响能力。


    1277'
  merge: -1
  img_proc: true
- pgno: 1277
  md: '这种策略当然比友好帮助型更高明，但对管理者的能力和智慧也提出了更高要求，管理者对企业各部门、各同事付出的心血也要更多一些。


    本策略的关键是要围绕如何实现企业价值和个人与部门价值双赢前来实施。如果一旦偏离了这一原则，就很容易蜕变为拉帮结派、谋取私利的企业内部小山头、小团伙，影响力由正面变成负面，对于企业工作由推动变成阻碍，对于企业政治由福音变成毒瘤，破坏作用不可小视。所以企业内部，任何的政治行为都应该同时为企业和相关当事人同时谋利，如果只谋局部私利，则必然损害企业利益，迟早会出事。


    # 4、协同提升型策略


    协同提升策略又更上一层楼，它指管理者不仅帮助、影响其他部门或同事，而且经常能够站在比自己职业自己部门更高的点上来观察思考公司事务，从而能够不断站在企业全局提出对于某些部门和整个企业非常有利的改进措施，并且在工作交往中始终有意识地推进部门与部门之间的良好合作关系，整合资源，让所有部门和同事发挥出协同作战的更大能量和团队优势。这样的管理者能够以一种正常的大家都认可'
  merge: -1
  img_proc: true
- pgno: 1278
  md: '的非常正面的方式不断扩大自己部门或个人在企业的决策影响力，最终成为企业核心高级管理人员。


    这样的策略对于管理者素质能力会有更高的要求。一般管理者不可强求，应当量力而行，根据自己所处的环境状态，结合自己的能力、地位和定位来合理使用。


    这一策略的最大好处是一种正面的健康竞争策略，是依靠自身能力、智慧、品德为根基的显规则层面的竞争方式，是能够令人信服的“阳谋”策略，对企业、他人、个人都有正面促进作用。可能的风险是如果处理不好，就会变成多管闲事、自高自大不可一世，所以采用此策略的管理者务必永远保持必要的谦逊和坦诚大度。没有宽广的胸怀和高超的沟通技巧，本策略很难顺利实施。


    # 5、个人魅力型策略


    个人魅力如果运用得当，对于管理者来说是件好事。而作为管理者，魅力只能从这三方面的一方面或综合作用产生：高尚的人品、超群的能力修养、悠久的从业资历。当然突出的外表形象或美好性格也能够增加管理者的魅力，但不构成实质性支持。个人魅力型管理者在打造团队时拥有优势，但仍


    1279'
  merge: -1
  img_proc: true
- pgno: 1279
  md: '然需要明白自己在企业当中的正确地位和恰当身份，一旦超越了地位身份表现，管理者再有魅力也不会见容于上级或同事，魅力就会转化为一种令人生厌的坏事。


    # 6、无所作为型策略


    最后一种就是无所作为型策略。说白了，也就是混日子。在非一言堂型企业中，这样的策略也仍然有管理者采用。这种策略只有在企业巨变、方向不明、人事混乱时采用，目的在于明哲保身，但企业一旦恢复正常运作，无所作为策略就不应该再采用。如再采用此策略，管理者可以有饭吃但也就到此而已。


    纵观以上各种政治策略，我们可以发现企业政治是非常费时费力、需要管理者全身投入去做的、一件工作之外但没有它工作便不可能做好的重要事情。而且我上面所讲政治策略还主要只是针对如何赢得上司依赖讲的，但企业真实的政治是关系到上下左右许多不同人群的。如果想要在企业活得不错，就必须花精力去处理好这些繁杂的利益关系。可见，作为一个企业家或管理者，其职业生涯其实不易。我个人自2003
    年来一直坚持一个观点，就是在所有管理者中，对政治家和企业家的素质是要求最高的，社会对这两者的基本要求


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1279_0.png)'
  merge: -1
  img_proc: true
- pgno: 1280
  md: '也一致：不断创造经济价值，并处理好人与人之间的利益关系。


    # 如何正确应对办公室政治


    无论在哪种类型的企业，面对哪种类型的老板，管理者在对待办公室政治时都应该牢记下面六个基本原则。


    # 1、认可办公室政治


    有人的地方就有利益冲突，有利益冲突就会有政治。政治是一种客观现实，必须承认它存在的合理性和现状。对于企业管理者甚至员工来说，企业办公室政治不是我们拒绝去认可、努力去回避就能解决的事，它是社会生活的必然产物。只有我们认可它存在是正常的，是不可避免的，我们才能够很好地面对它。


    # 2、接受办公室政治


    从管理者角度讲，企业它作为一种社会经济组织，并非因你个人而存在，因而不可能因你个人的加入就突然改变其政治气氛。因此，当我们进入一家企业时，首先要做的不是去'
  merge: -1
  img_proc: true
- pgno: 1281
  md: '指责、抱怨这家企业已经在存在了五年或十年的政治，而是先要在理智上接受该企业目前办公室政治的现实。


    抱怨抵触有没有用？没有用。抵触的结果往往是管理者自己头破血流，被人弄得满头包还不知道是怎么一回事。所以我的建议是：先仔细观察体会，花上三个月到半年的时间努力把企业内部存在的政治关系和政治问题一一搞清楚，知道它现在是怎么样
    的，问题在哪里，原因又是什么，等等。总之，作为管理者，必须政治敏感，对于企业政治要做到尽快心中有数。只有对企业政治格局心中有数之后，才有可能真正有效率地做事。因此，从心理上、感情上、理智上理解并接受办公室政治是管理者处理好政治问题的第二步。


    # ### 3、适应办公室政治


    光是心里理解了，接受了，行不行？行，但还不足够。管理者作为企业政治格局中的重要一员，接下来要做的第三件事是：必须想办法先适应企业目前的政治，经过周密分析之后，根据自己的地位、职位、能力、愿望、观点及公司对我们的期望，将自己正确定位在企业政治格局中的某一个恰当位置，即以—种适应的方式先安全进入这个企业目前的政治系统。只有我们能够先顺利进入这样一个政治系统，我们才


    1282'
  merge: -1
  img_proc: true
- pgno: 1282
  md: '能被原有政治人物真正接受，才能被认可为他们这一政治群体当中的一员。只有这样之后，你才能算是正式进入这个企业，你的企业政治生命才能得到可靠保证。那些站在企业政治之外指责评判企业政治的管理者，他们的命运永远相同：要么永远处于企业管理团队的边缘地带，要么出师未捷身先死，壮志未酬人先走矣。


    # 4、改良办公室政治


    已经进入企业的管理团队，在心理、思想、政治上也得到了他人的认可，那么那些真正有思想、有理想、有智慧的管理者就能够更进一步，可以开始尝试以温和渐进的方式，从内部建议政治团体改进自己的政治关系。由于你自己也已经身处其中，你又完全理解了当前政治形成的历史，所以你才能理解所有其他政治格局中人的利益、观点、立场，才能找出真正适合他们愿望并且使整个政治系统局部调整后得到提升的好办法，你提的改进意见才有可行性，做起来才有人支持，你改良企业政治与企业管理的良好愿望才不会因企业主要人物的反对而落空。


    # 5、发展办公室政治'
  merge: -1
  img_proc: true
- pgno: 1283
  md: '事实上，一个身居要职的管理者，必然成为一个企业政治中心人物。等你成了一个核心管理成员，除了改进企业政治之外，你又增添了新的政治任务，那就是朝良性方向努力推动企业发展出更好的更健康的办公室政治。


    办公室政治表面是一种人际关系问题，其实质却仍然是一种更加深刻全面的利益关系问题。因此，改变和发展政治关系，就需要对某些原有利致关系进行调整，而既得利益者对于利益要求永远是具有刚性的，这变与不变之间、这么变与那么变之间永远存在着一种博弈。如何处理这种博弈，需要对利益各方立场、观点的深刻理解，在提出解决方案时需要高度的人生智慧。所以，凡是大一些的企业政治的发展，如创业元老的和平退位，或将老板亲戚从非管理者行为习惯中转变过来等等，从来都不是一个简单方案就能解决的棘手问题。但企业要发展，管理要提升，企业一些原来合理但现在已经不合理的做法和政治倾向，必然需要在核心管理成员的共同努力之下吐故纳新，与时俱进，方可保持企业的健康和生命活力。


    # **6、显化办公室政治**


    1284'
  merge: -1
  img_proc: true
- pgno: 1284
  md: '办公室政治要消除其负面的东西，一方面是通过不同的措施不断地改良它，另一方面则就是企业管理者要有意识地不断把原本“只能做不能说，只管做不管为什么做”的许多办公室政治规则，由桌子底下的“潜规？”转变成明明白白放在桌子上面的“显规则”。


    近年来许多企业热心搞的企业文化建设，其实质就应该是在处理和调整企业所有 人的多种利益的原则，清晰准确明白无误地公示出来，从而减少企业潜规？，增加企业运作的“阳光率”。办公室政治一旦显性化，良性、正面的东西就会增加，恶性、负面的东西就会得到抑制，企业办公室政治气氛就会变好。


    政治规则显性化的过程，也就是企业政治将更多利益关系的调整规则经济化、制度化、公开化的过程。在许多百年企业中，企业将几乎所有能够遇到的利益关系全部用企业文化或规章制度的形式固定下来，因此，政治也就成了企业文化，政治也不再神秘，政治黑幕也就没有了生长的土壤和根据地。


    # 总结'
  merge: -1
  img_proc: true
- pgno: 1285
  md: '政治是一种客观存在，有人的地方就有政治；


    目前的政治是以前历史发展的合理结局，要理解当前政治格局，必须历史地看问题；


    企业政治无法也无处有效逃避，只有正确面对；


    进入一个企业，首先要认识企业政治现状和形成的历史原因，并且从理智上、思想上、感情上接受这一事实，将自己纳入这一政治系统，尔后才能寻找对政治系统的改进；


    一旦管理者成了核心管理成员，他还有责任发展出更健康的办公室政治的使命，最后应当尽量将企业政治显性化，将其转化为企业文化性质的阳光明媚的东西。


    办公室政治相当复杂，我的看法是，对于企业政治，勇敢面对它、客观地认识它、然后从内部改造它，是唯一可行的途径。抱怨或抵触无异于一种自毁行为。'
  merge: -1
  img_proc: true
- pgno: 1286
  md: '# 创业与守成


    他们是中国史上白手起家的创业皇帝：刘邦原是混混，却打败世家出身的项羽，取得天下；朱元璋当过小僧，却驱逐蒙古，建立明朝。他们是不同的领袖：刘邦知人善任，能屈能伸；朱元璋稳扎稳打，随势推进。进取与保守的经营之道，决定汉、明两朝不同的国运……


    现代资本主义市场机制下，企业管理是重要的强项。过去，投资与经营都可由一个人（或少数人）直接处理。一个自然人可以全凭自己的意愿，驰骋于市场，运用之妙，存乎一心，并不需要管理理论。但是，今日的战场是许多法人角逐的竞技场。如何组织高效率的团队？如何筹募最佳的策略？都是这些企业群体盛出成败之所寄。而不论组织，抑是经营，这一群体的决策中枢，亦即领袖的领导功能，尤是举足轻重的因素。


    大凡历史上的国家治理，何尝不是在处理群体组织及资源运用方式？近代以前，资本主义市场的企业还未出现，然而一个皇朝的开创与守成，又何尝不是经营与管理两个领域的操作？'
  merge: -1
  img_proc: true
- pgno: 1287
  md: '拙论取材，大多从历史中引述，或为典章制度，或为人物传记，却不拟涉及今日管理理论。这种做法别出蹊径，只能算是一番尝试，提供管理学专家参考。


    管理一词，应当包含经营与组织两个项目：经营部分，既有开拓的宏旨，也有风险的处理；组织部分，也兼具结构与运作两个方向。领导者在经营与组织双方，都必须注意，方能成事。


    # ### 经营事业，是一道方程式


    中国历史上，皇朝起伏代谢。以皇朝兴衰为基本资料，则开国时的创业，当然是经营的现象，其领袖（开国君主）必须有所筹措；开国后继续垂统（编按：垂统意指将基业传给后代，多半用在皇位的承袭）的君主，也时时必须面对种种问题，例如天灾人祸、内忧外患，。。。如何处理这些问题，也是经营。


    凡此均可与现代企业的创业人及其后续董事长的功能相似。


    兹将此种经营模式简约为一个方程式：


    资源（经过。运用）= 能量'
  merge: -1
  img_proc: true
- pgno: 1288
  md: '人力资源比较复杂，既指涉可以运用的人力，包括劳力及智力；也可以表示领袖及其所有依其驱策的人士（或人群）的诸项因素（例如性格），及其可能呈现的制约限度（例如，因个别人士的性格及彼此关系，引起的正面或负面后果）。这一方程式是示意性的，其中诸项较不易量化测度，是以也不能进行精确计算。


    此处将考察领袖的性格与作风，以覘见（编按：窥视、观察）其应具备的品质。事实上，人间不可能有完美的人物。我只能从中国皇帝中挑选比较成功的个例，以讨论他们在历史上呈现的特质。同时为了逆证，我将


    挑选若干失败的亡国之君做比较。


    中国开创皇期的君主，全无凭倚、白手起家的例子，只有汉高祖刘邦与明太祖朱元璋两人。唐太宗李世民的表现也不错，但是他有北周世家大族的身分，又有父亲唐高祖李渊在太原的资源，因此不能算是白手起家。至于失败的亡国之君，刘邦的对手项羽与明代的崇祯皇帝（思宗朱由检）足可为领袖品质的逆证。


    # 汉高祖：从江湖搏到天下'
  merge: -1
  img_proc: true
- pgno: 1289
  md: '汉高祖出身在农家，为诸子中的老幺，在年轻时无所作为，父亲太公曾经指斥他不治生产。他曾担任亭长，是地方上的基层管理人员；在押送戍卒时，戍卒逃亡，他干脆释放所有戍卒，自己也逃亡大泽中，后来则据沛县起兵，参加了推翻秦代政权的活动。天下各路人马在项羽领导下，与秦军作战，刘邦偏师疾驰入关中秦王子婴投降。项羽进入关中，据说违背了先入关为王的誓言，只封刘邦于汉中，刘邦在汉中休养生息，渡陈仓，再出谷据有关中。在这一战项刘对决中，刘邦遣韩信取得齐地，北联张耳、陈余，南结彭越、英布，诸军会合，大败项羽于垓下。刘邦的开创汉朝，是一个辛苦的过程。


    史称刘邦豁达大度、不拘小节，从他微时作为看来，他是从江湖上混出来的人物。这种人物，善于结交朋友，对朋友也有一定的义气，有时为了充阔气，或是由于自信，会大言不惭，更有孤注一掷的勇气。刘邦以地方小混混，混到亭长职位，遂结识了县中的小吏（如萧何、曹参），在县令招待故人吕公时，刘邦不名一文，却敢于冒称赠送厚礼，居上座狎侮宾客，居然虏获吕公欣赏，将女儿下嫁刘邦。刘邦以武力据沛，则是由于获得萧何、曹参诸人的支持。——凡此早年事迹，足以说明刘邦敢于—博胜负的勇气，而他可凭藉的资源仅是自己的人际。当时秦人暴政，已到人民难以忍受的地'
  merge: -1
  img_proc: true
- pgno: 1290
  md: '步，刘邦并不是唯一站起来反抗的人物；因此，刘邦起兵是有胆，但未必是由于其见识过人。


    # 项羽：败在能胜不能败


    在反秦与对抗项羽的过程中，刘邦几次关键性的决定，却不能说是凭血气之勇。他在不断扩大自己的力量时，接纳了不少人才：张良与韩信是其中最著名的佼佼者。他听取伙伴的建议，信任他们的能力。在诸军忙于战争时，刘邦疾驰入关；又听取萧何建议，获得当时全国户籍、赋税档案与舆图。这一大批资料，使刘邦有了全国形势及资源的资讯，为当时其他武装集团所未有。


    刘邦从汉中潜出陈仓，掌握了秦国故地，关中表里山河，易守难攻。毗邻的巴蜀、陇右，属北方边郡，握有盐、铁、战士，与马匹等重要资源，是其能取得天下的重要原因。天下既定，刘邦又听取娄敬建议，定都关中，也是为了继续掌握这些资源，高屋建瓴（编按：比喻居高临下，形势无法挡），控御东方。—这些计算就不能说是偶然的幸运，而是他能接纳他人的建议。


    刘邦也能处逆境，父亲被项羽劫持，刘邦回答，烹了我的父亲，请分我一杯羹。妻女失去联络，他也忍了。鸿门宴上，'
  merge: -1
  img_proc: true
- pgno: 1291
  md: '冒死赴宴，对项羽低声下气，他也忍了。韩信收齐地，自立为王，等于背叛，他生气之余，听张良劝谏，忍住气，封韩信为齐王。至于立了第一个攻进关中的大功，却被贬至汉中，刘邦更是以此时机经营，卷土重来。


    综合上面的叙述，刘邦的领袖气质在于能与人相处，更能接受别人的意见，以提升自己的识见。有胆子，却又能忍受挫折。有了这些气质，他在重要关口的决定，都是准确，而且及时。他紧守关中为基地，不仅在群雄之中能脱颖而出，而且汉家两百年的统治，也因中原居形胜之地，帝业因此不坠。——以刘邦创业的经营言，一个领袖必须气量宽大，有胆有识，胜不骄、败不馁，知人善任，听信谏言，收集资讯，集众人慧，


    以成自己的智慧。一位企业的创业者，也是如此，方能成功。


