  md: '+   v 公司在新人面试尤其是副总经理以上的人，他们都说要再学习。我 对这种回答没有太多好感。


    +   v 终身学习固然是重要的,但当你 的职位高到一个程度的时候,更 大的责任是在教导别人。


    +   v 总经理最好不要管太多事，而应 该将大部份的时间用在思考未来上。


    +   v 如果事事都要报告老板才能获得解决，无异庸人自扰。


    +   v 所谓的企业文化，要当成公司行 为的典范，而不是随公司成长自 然形成;要由创办人或执行长制定 出来，当成主动出击的准则，这 也是领导者的责任。


    +   v 企管大师彼得。杜拉克曾经表示， 以往让大家参与决策制定的过程被 认为是很好的制度，但是要是一艘 船要沉了，船长还要透过开会的方式来寻求解决办法吗？他最
    好是直接下令准备应变。'
