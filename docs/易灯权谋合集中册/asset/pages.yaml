  md: '者，权力归唐三藏。因为唐三藏是如来大弟子转世，这是身份基础；是十世修行的好人，这是道德基础；受到唐太宗李世民的委托，有正式的授权；是如来钦定的人选，这是获得的外部支持；另外，唐三藏还有一个法宝，就是他会念紧箍咒，孙悟空不听话的时候他可以念紧箍咒，这就是强制力。从这种身份、道德、授权、外部支持和强制力当中，我们可以看到权力的最初来源。


    我们可以看到，个体的渺小和协作发展的愿望是一个组织建立的起点。但是简单地把一些人聚到一起，只能是形成一个群，是人员数量的增加，还不能完全形成一个组织，从人群到组织，不仅是量的增加，还是一个质的飞跃。这次质的飞跃需要组织建立一个共同发展的目标，形成权力结构。这种权力结构是一种稳定的内在结构，包括制度的建立、部门的设置、人员的分工、资源的配置方式等。


    总体来讲，管理的逻辑发展是这样进行的：'
