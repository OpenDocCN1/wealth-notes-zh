- pgno: 316
  md: '汉五年，高祖已得天下，在定陶，诸侯共尊汉王为皇帝，叔孙通专管国家的礼仪，当时为简易起见，高祖尽去秦苛仪法，群臣饮酒争功，喝醉了就大呼大叫，或是拔剑击柱，一点没有约束，不分上下，乱得一塌糊涂。高祖为此种状态而忧虑。叔孙通也知道皇帝讨厌这种状况，对高祖说：“儒者难与你一起取得天下，但可与你守成，助一臂之力。我愿征召鲁地诸生（儒生），与弟子共起朝仪。”


    于是，叔孙通与所征召的鲁生三十多人、皇帝左右为学者及其弟子百余人，一同西行，住宿在野外，进行封闭式训练。习之月余，叔孙通说：“可让皇上来观看了。”高祖亲临现场，参与礼节，说：“这些我能做得到。”接下去，令群臣演练。


    汉七年十月，长乐宫建成，诸侯群臣皆来朝。'
