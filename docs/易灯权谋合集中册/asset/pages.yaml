  md: '终的毒计，就是以退为进，先发制人，亦即所谓 ‘恶人先告 状’ 也。” 恶人先告状利用的就是首因效应，首因效应是指 个体在社会认知过程中，通过“第一印象”最先输入的信息
    对客体以后的认知产生的影响作用。对于这种因信息输入顺 序而产生的效应的现象，有种种不同的原因解释。一种解释 认为，最先接受的信息所形成的最初印象，构成脑中的核心
    知识或记忆图式。后输入的其他信息只是被整合到这个记忆 图式中去，即这是一种同化模式，后续的信息被同化进了由 最先输入的信息所形成的记忆结构中，因此后续的新的信息
    也就具有了先前信息的属性痕迹。另一种解释是以注意机制 原理为基础的，该解释认为，最先接受的信息没有受到任何 干扰地得到了更多的注意，信息加工精细；而后续的信息则
    易受忽视，信息加工粗略。


    实验心理学研究表明，外界信息输入大脑时的顺序，在决定'
  merge: -1
  img_proc: true
- pgno: 502
  md: 认知效果的作用上是不容忽视的。最先输入的信息作用最大，最后输入的信息也起较大作用。大脑处理信息的这种特点是形成首因效应的内在原因。首因效应本质上是一种优先效应，当不同的信息结合在一起的时候，人们总是倾向于重视前面的信息。即使人们同样重视了后面的信息，也会认为后面的信息是非本质的、偶然的，人们习惯于按照前面的信息解释后面的信息，即使后面的信息与前面的信息不一致，也会屈从于前面的信息，以形成整体一致的印象。当不同的信息结合在一起的时候，人们总是倾向于重视前面的信息。
