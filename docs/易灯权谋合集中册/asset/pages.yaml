- pgno: 1364
  md: '# 办公室玩政治，如何自保？


    有争权夺利的地方就有政治，办公室也不例外。夹在当权派与非主流派之间、大老板与小老板之间、新主管与旧团队之间，你该如何左右逢源？


    麻烦：我不喜欢争权夺利，难道每家公司都会存在办公室政治吗？对策：有人的地方就有结党拉派、争权夺利，企业也不例外。没有一家公司可以对办公室政治免疫，这是组织与生俱来的一部分。


    当公司处于成长期时，通常不太会出现办公室政争，一切以战功为依归；但是，只要是超过30年以上的企业，或者是进入高原期、停滞期的企业，就很容易有严重的办公室政治问题。一般来说，愈高层的办公室政治斗争，愈是你死我活，'
  merge: -1
  img_proc: true
- pgno: 1365
  md: '动辄可能工作不保。而基层的政争多半只是一些鸡毛蒜皮、容易解决的小事，


    几年前我面试过一个人，自称很讨厌办公室里的权谋与手段，也拒绝玩那种游戏，结果没有被录取。办公室里确实存在着政治性的算计，这是事实，你不能当鸵鸟，装作没有这回事。要看清楚每一个角色，然后设定你自己的策略，有效地应付他们。


    虽说，办公室政治可能造成派系利益凌驾组织利益之上，以及多数欺凌少数的团队暴力等负面影响。但是，办公政治与派系也有些正面效果。


    隶属于小圈子的归属感，可以稳定员工的情绪，以及协助彼此完成任务，新人训练同梯的情谊就是最佳例证。小团体的存在，能有效地降低员工流动率。


    只是，水能载舟亦能覆舟，端看从什么角度来看办公室政治。


    麻烦：公司内派系林立，我是不是也该加入小圈圈呢？


    1366'
  merge: -1
  img_proc: true
- pgno: 1366
  md: '对策：人和大多数的猴子一样，是高度社会性的动物，有一种结盟的亲和本能。


    只是，当主角从猴子变成上班族的时候，是否要结盟或加入派系，却是个两难的问题。加入特定圈圈，很容易被其他圈圈排斥；不加入的话，又难做人。赵善挥形容，加对派系，鸡犬升天；加错派系，打入地狱；但是不加入，就变成上不上，下不下。


    况且，加入哪个派系较有利，风险瞬息万变。企业发生任何一个变化，如：大客户换人、技术变迁或股东结构、老总换人，都会使得当权派情势丕变。


    公司一旦改朝换代，就又要重新选边，而且很可能会因为先前选边站，而遭到秋后算帐。


    # 让各个派系都想争取你


    那么，究竟该不该加入派系？务实派的企管顾问建议审慎分析情势后加入，想要活下来，就一定要加入；不加入就不能存活、无法晋升。端看你是想要在组织中活下来，或者是想要在组织中力争上游。'
  merge: -1
  img_proc: true
- pgno: 1367
  md: '另一种观点则是建议，提高自己的被利用价值，尽量保持政治中立立场，没有永远的执政党，应该要让自己成为优势的绝对少数，宋一非说。


    与其考虑加入哪个圈圈，不如让各个派系都设法争取你的支持，始终让自己保持被利用的价值、让自己的重要性不易被取代。不过，**这是一条很辛苦的路**。


    如果真的必须表态、选边站，宁可选择与工作利益、部门紧密密度最相关的，否则，**就算搭上主流派，但工作上最密切合作的部门排挤你，也没有好日子过**。


    如果企业的派系政争过于激烈，会使得企业的所有力气都在内耗、竞争力下滑，应该好好思考是否值得在这种公司待下去。


    麻烦：我的直属主管在公司是**非主流派，最近主流派的其他主管，积极在拉拢我，我夹在中间该如何应对？**


    对策：能够获得**国王人马**青睐，要恭喜你，表示你有很高的利用价值，不过，建议合作**仅止于工作合作，而非政治合'
  merge: -1
  img_proc: true
- pgno: 1368
  md: '作，不要让自己跳到复杂的关系里。


    就算直属主管是非主流，但他负责指挥你，这个基本原理是不会变的。就算隔壁邻居的爸爸比较有钱，但你总不能一天到晚往别人家跑。所以，最妥善的处理方法是，忠于直属主管的一切指挥；但不要带着太多的派系观念，在能力所及范围内，尽量配合其他旁支主管的要求。


    基层员工最好不要太早靠门靠派，就像 15 岁时就立志一定要嫁军人一样荒谬。应该让自己保有更多的可能性。更重要的是，应建立起积极的心态，如果整个部门团结一心、表现杰出的话，说不定主管很快地也能晋升为主流。


    而且退一想想，有许多企业采行主管提报备晋升，如果你只是一味地讨好国王人马，纵使国王人马提报备你晋升，但只要主管不挺你，晋升之路一样无望！


    麻烦：大老板最近常跳过小老板直接找我，他们两人关系似乎暗潮汹涌，我要如何与上级互动？


    对策：一般来说，高层主管会越级管理，原因不外乎：中间主管难沟通、能力不足，高层有意架空中间主管、或是纯属'
  merge: -1
  img_proc: true
- pgno: 1369
  md: '高层主管个人的管理风格。


    高层主管越级直接找上你，在这种情况下，**如果中间主管没有实权，你可能很快就能出头天；但是，如果中间主管有实权的话，你就可能会死得很惨**。


    因此，除非你真的一心想要干掉直属主管，否则最好还是主动向他报告，高层找你谈什么、交代你做什么，以免直属主管起疑。


    一旦你被直属主管误认为是高层安插的棋子，就很可能被刻意修理。因此，最好主动交代你与高层的互动情形，设法维持关系的平衡。


    **麻烦：我是部门主管，最近公司高层安插一个人到本部门，我要如何管理这个员工？**


    对策：公司高层跳过正常的程序，直接空降一个员工给你，你究竟要巴结这位**国王人马**，还是一视同仁，或者放宽管理标准、纵容他打混摸鱼？首先，应该先厘清高层的意图。


    第一种可能性是**徇私**，安插自己的亲朋好友。在管理这种**皇亲国戚**时，最好采取公归公，私归私的态度，私底下用各种'
  merge: -1
  img_proc: true
- pgno: 1370
  md: '方式攀关系、拉交情都无妨，但工作上必须公事公办。因为，上级引介亲朋好友到公司，目的绝不只是找份差事混薪水，更希望从工作获得学习成长；所以，你应该扮演良师的角色，该教就教、该骂就骂，有表现机会的时候，就尽量给他机会，甚至可以暗中相助。上级主管看到亲朋好友在你手下脱胎换骨，肯定龙心大悦，对你的能力也会刮目相看。


    如果在工作上太袒护皇亲国戚，不但其他部属会鄙视你、有损你的领导威信，这名皇亲国戚也会被视为特权分子，而遭到其他同事的杯葛与孤立，恐怕很快就待不下去，想帮他，反而害了他，上级主管对你也会不谅解。


    第二种可能是荐才，上级主管认为对方是个 人才，很适合放到你部门。当然，上级难免也有看走眼的时候，但无论如何，你不要先入为主抱着排斥的心态，应该先假设对方能力一定有过人之处，上级才会如此青睞，试着接纳对方。如果最后你跟对方搞得不欢而散，上级主管不但颜面无光，也会质疑你的用人气度。


    第三种可能性是监军，上级主管对你的工作表现不太满意，甚至打算找人接替你的位子，所以派人进驻。这是很严重的警讯，你必须赶紧力图振作、交出令上级满意的成绩单。对于这名监军更是不能得罪，要设法让他了解你的苦衷，例如


    ![](img/7609f5d1ba4dd6250f5273e53c0ea3cb_1370_0.png)'
  merge: -1
  img_proc: true
- pgno: 1371
  md: '公司给的资源太少、其他部门扯后腿、公司产品本身有瑕疵等。如果运用得当，这位**监事**甚至可能被你**策反**，变成同情你的**传话人**，将你部门的窘境反映给上级，你反而因祸得福也不一定的！


    # 麻烦：公司最近空降一个高官，而且带来一票自己的人马，我该如何跟他们互动？


    对策：以人性来说，空降主管想要在短时间之内做出成绩的话，找一批自己信得过的人马班底，是再自然不过的事，**只不过城里（空降部队）、城外之间，需要时间加以融合。**


    企业从外部礼聘专业经理人，通常意谓着旧团队出现问题，因此林涛认为，旧员工在心态上应该主动配合，**如果一直抗拒的话，公司很有可能会走向灭亡。**不要一心想着高层发生了什么事，而应该思考接下来你能做些什么事，如何在会议上求表现、如何做一场出色的简报等，以赢得新主管的信任。


    而且，空降部队是否有真本事，很快就会得到验证，如果真是一块料的话，马上就能看出绩效，否则一块砖头再怎么用灯光照，还是一块砖头。


    1372'
  merge: -1
  img_proc: true
- pgno: 1372
  md: '**麻烦：我们公司即将被合并，我很想给新主管一个好印象，怎样才不会显得太拍马屁？**


    **对策：** 请试着用新主管的角度看事情，并且假设他们都是好人，能够感到被并购员工的恐慌，在即将空降的外来新主管面前，可能表现得很不自在、不自然。


    新主管会特别小心、多所观察，他们会希望看到一群心平气和、坚守岗位的部署，当这些部属被要求工作做一些改变、以适应新流程的时候，能够很明理、敞开心胸地如善如流。他们最不见惯的是有人很顽固、猜疑，或很夸张地奉承。


    所以，不需要对新主管人马，表现出**不自然的接炯热忱**，这样会让你看起来太逢迎拍马，不仅新主管对你很反感，而且还会失去原有工作伙伴对你的尊重与情谊。


    **麻烦：自己职级不够高，需要别的部门配合支援时，别人根本不想搭理我，怎么办？**


    **对策：** 在东方社会，只要搬出官阶及职衔，做许多事都容易讨到方便。如果你的**职级罩不住**的话，林涛建议，不妨请主管先拨个电话照会对方一声，**你应该先请出尚方宝剑，而不是骑着白马就直接过去**。在和对方


    1373'
  merge: -1
  img_proc: true
- pgno: 1373
  md: '沟通时，可以运用先给、再要的原则，先问对方我能够协助什么，而不是直接要求对方帮你做些什么。林涛认为，从人性角度出发，客气地拿苹果去换对方的梨子，有时候不必给对方苹果，就能够拿回一半的梨子。


    对于经常需要仰赖其支援的部门，平常就应该做好内部公关，利用员工联谊活动、教育训练、尾牙等跨部门共聚的场合，多认识一些其他部门同事，有空就勤于串门子走动，建立私人情谊。有时透过个人交情，比请出上级主管更有效。


    麻烦：除了直属主管外，其他部门主管也来指挥命令我，感觉上好像有两个老板，我该听谁的？


    对策：这种自己只领一份薪水，但为什么有两个老板的观念大错特错。在外商企业，（双线主管制度）很常见，许多本土公司的业务、企划部门也不乏这种情形。


    涉及跨部门的案子、且主管们意见分歧的时候，陈若玲表示，原则上，应以直属主管的意见为主；但若是专案性质的话，则应以专案的直属负责主管为主，例如：全新产品的开发案，按理应以行销主管意见为依归。


    1374'
  merge: -1
  img_proc: true
- pgno: 1374
  md: '# 麻烦：不知哪里得罪了同事，大家都很讨厌我，我打不进他们的小圈圈，怎么办？


    对策：在军中，搞不清状况的菜鸟被称做**天兵**，在职场上也不乏天兵，最大特征就是**白目**，总是做些惹人厌的事，对人际交往的分寸、职场的基本生态，简直一无所知，对别人的情绪反应也漠不关心。


    这类型的天兵，连自己的问题出在哪里都不知道，更不知道如何去改，最后落得被大家讨厌及排挤。


    被同事排挤必定事出有因，不妨请同事坦言相告，了解自己究竟哪里有问题，例如情绪化、自私、不守信用、爱说是非等，改进之后，再想办法建立人际关系。


    在同事相处上，不要一心想等着别人采取主动，**就像男生在追求女生一样，要主动示好、借故交流**。'
  merge: -1
  img_proc: true
- pgno: 1375
  md: '# 不得不看的 20 条职场潜规则


    办公室政治学：不得不看的 20 条职场潜规则


    “学会说与做”是纵横职场最重要的一课。身在职场，熟练掌握办公室实用规则，相当于人在江湖，深谙四两拨千斤之道。


    +   1、办公室里只有两种人，主角和龙套。


    职场上，想要过的轻松，不想往上爬，那就只能做一辈子的龙套。作龙套的坏处就是：送死你先去，功劳全没有，裁员先考虑。现在的职场绝不是养懒人的地方，你要比别人生存的好，就唯有当主角，让别人去做龙套。你不能踩着别人肩膀，就只能做他人垫背。


    +   2、每个人都要有大志，就算要毁灭世界也可以。


    胸怀大志是做主角的首要条件。在职场上，你若没有一个奋斗目标，就不可能进取的往上爬，到最后只能沦为龙套，成为别人的牺牲品。所以不管毁灭世界，还是成为第一首富，你都必须心存志向，以此为目标。


    1376'
  merge: -1
  img_proc: true
- pgno: 1376
  md: '3、别被理想忽悠，理想是需要的，但不是别人的理想，而是你自己的。


    当提起大志时，有人会想到企业目标，想到企业文化，想到老板慷慨激昂的演说。忘了那些吧，老板的理想只是老板的，而职场上，你是独立的。要保持清醒头脑，不能被轻易忽悠。不管别人有什么理想，要牢牢记住自己的大志，这才是立命之根本。


    4、如果真的没大志，那就为钱奋斗。


    每个人都有解甲归田的时候，如果不是为了钱，谁要当这个官呢。所以赚钱是人最主要的追求。职场上很危险的局面，就是老板用理想笼络人，想让人不拿钱白干活。但真的肯不要钱干活，那你就是没价值的，既然没价值，还有什么存在的必要呢？金钱是唯一衡量你价值的东西。你真的一无所求的话，那就为赚钱而奋斗。


    5、你可以不聪明，但不可以不小心。


    职场与此一样，你可以不聪明，但不可以不小心。不聪明的人，最多笨拙一些，事情做的差一些。而在职场上，这不是很大的罪过。但不小心就随时会触犯到别人的利益，犯下得罪人这个职场大忌。到那时，穿小鞋都不晓得是为什么穿的。管牢嘴，能风花雪月的时候就少议论同事，能说人好话时就别说坏话。


    6、你说的每句话，老板都会知道。所以要好好想想该说什么。


    1377'
