  md: '阳原，莫不浸仁沐义，照景饮醴。而下官抱痈圜门，含愦狱户，一物之微，有足悲者。仰惟大王少垂明白，则梧丘之魂，不愧于沉首；鹄亭之鬼，无恨于灰骨。不任肝胆之切，敬因执事以闻。此心既照，死且不朽。


