- pgno: 931
  md: '职场中隐权力的分类，学会了玩转职场我们都知道实际权力等=名义权力+隐权力，所谓的的名义权利就是职位、权力含金量等方面来中和考量，从理论上上来说，这种权力是固定的，而隐权力则是通过则是通过圈子、规则、衍生而来，他有着自己的权力划分，有自己的管辖范围，隐权力和名义权利相互衔接，共同划分职场、官场的势利范围，很多时，候隐权力甚至比名义权利更加管用，因为隐权力不受正式权利的约束，又可以越过正式权利的边界，官场中职场中隐权力妙用无穷，所以很多人对隐权力趋之若鹜，今天我们就来我说一说职场、官场当中的隐权力：


    一，人情的隐权力。


