- pgno: 1442
  md: '# 部属叫不动管理的第一道坎


    A 在公司做了五年工程师，经验愈来愈丰富，业务愈来愈熟悉， 很得同事和老板的信赖。有一天，公司主管希望 A 做自己部门的 直属经理，问 A 的意见。A 说：哪有什么意见，太好了！


    A 第一次从个人贡献者成为管理者，很激动。可是，上任没多 久，他就遇到了人生中第一个管理问题——他的员工不如他。


    交给员工做的事，得到反馈时，A 恨不得把报告撕得粉碎。 这都是什么垃圾啊！拿回去重做！可是，重做之后还是一样， A 简直要崩溃了。但专案等人，于是，他狠狠骂了一顿后说：算了算了，放着我来。


    这样的场景，在全世界的每个角落、每家公司，每天都在发生。 A 确实用更少的时间做出了更好的结果。但这样正确吗？


    当然不正确。A 犯了几乎每一个初级管理者都会犯的错误， 叫做看我来。拿主管的薪资，抢员工的工作，管理者愈来愈忙， 甚至成为团队的瓶颈，而员工却没有成长，更没有成就感。'
  merge: -1
  img_proc: true
- pgno: 1443
  md: '英国证券交易所前主管古狄逊针对这种情况说：不做累坏的主管。管理是让别人干活的艺术。


    古狄逊定理是从员工到经理必须学会的第一个定理，也是衡量一个人能否成为一员合格的管理者必经的第一道生死门。一个小男孩问迪士尼的创办人华特。迪士尼


    ：你画米老鼠吗？华特说：不，我不画。、那么你负责想所有的笑话和点子吗？、也不，我不做这些。 男孩很困惑，接着问：那么，迪士尼先生，你到底都做些什么啊？ 华特笑了笑，回答说：我是一只小蜜蜂，从一角飞到另一角，搜集花粉，给每个人打气，这就是我的工作。


    也许有的人会觉得奇怪：不是说管理者要身先士卒吗？不是说管理者要带头往前冲吗？成为管理者，就可以不干活，还能拿高薪资，这太不公平了吧？


    其实不是。管理者是一个工种，和工程师、设计师、环卫工人一样。不经过管理，十个人也许只能产生三个人的价值。管理者就是会让这十个人因为管理和协作，产生十个甚至十五个人的价值，自己因此拿两个人的收益。


    所以，一个人拿两个人的薪资，却去做一个人的活，即使做得再好，把自己累死在办公桌上，都对不起公司。很多公司学而优则仕，都是专业能力最强的员工做经理。因此，从员工到经理，心理上必须迈过去的第一道坎就是他们都不如我。'
  merge: -1
  img_proc: true
- pgno: 1444
  md: '怎么办？这里有三个建议。

    第一，明确分工。所有的具体工作，管理者都要合理安排给员工，不要有我擅长，我来做的心态。要给自己清晰的定位。比如，每天花两小时审阅程式代码，然后有针对性地辅导员工，安排经验分享。再比如，陪同拜访重要客户，下属主导，自己支持。同时，接受可控的错误。把一定范围内员工犯错的损失，当成团队培训的成本。

    第二，轻易不动手。我在微软时，有一次写了一份重要的报告要寄往美国，先发给老板过目。老板在回信中提了很多意见，但就是只字不改。于是，我根据他的意见改好了，再发过去。没一会儿，他的意见又来了。就这样来来回回，为了一份报告，我俩都留在办公室加班，一直改到第二天早上七点。也许有人觉得这个老板有病，而我却充满感激。因为，他最经济的做法是自己改完，然后回家，但他却花了整整一夜与我沟通修改意见，这是在对投资。

    第三，区分方法和习惯。从员工成为经理，必须要学会区分：优秀员工的做法中，哪些确实是值得学习的好方法，哪些只是个人习惯？比如，见客户一定要穿着得体，是值得学习的好方法。但是穿白皮鞋还是黑皮鞋，就只是个人习惯，不需要强求。方法的不同，会带来结果的不同；但有些习惯的不同，只是让自己感觉舒适。很多新上任的管理者对下属'
  merge: -1
  img_proc: true
- pgno: 1445
  md: '的要求，其实都是希望别人按照自己无关紧要的特有习惯做事。


    # 下属只有三种，你是哪一种？


    在我只是一个工作者时，通常只要花 60% 的时间及精力，就可以完成公司交付的任务。


    虽然我可以轻松完成，保持着好整以暇的余裕，可是根据我对所有同事工作状况的观察，仍有许多同事要很努力投入，才能勉强完成。另外还有一部分的同事，无法准时完成公司交付的任务，经常面对主管的责备和脸色。


    久而久之，我得到一个清楚的结论：在组织中，任务与工作者的关系存在 3 种不同的现象：


    +   第一种人是能够勉强完成公司的任务，这种人大约占 60%；


    +   第二种人是无法完成公司交付的任务，这类人占比不高，大约也有 20% 左右；


    +   第三种人，就是像我一样，能轻松完成工作，而且还有余裕游玩耍，这种人也大约有 20% 左右。


