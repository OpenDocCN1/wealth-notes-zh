    # **秀才造反，十年不成。**


    不知从何时起，中国就流传一句话：秀才造反，十年不成。还有一句话叫做：百无一用是书生。这两句话有一个共性：对知识分子都存在歧视或嘲弄。同时，也揭示了一种现实情况。不由得让我深思：秀才（这里的秀才，其实是文人的代名词）造反，为何十年不成？觉得至少有以下几个原因：


    一，知识分子没有极强的号召力。大凡历史上的起义成功者，往往具有一定的人格魅力，而这人格魅力往往与勇武、豪放，不拘小节、讲'
  merge: -1
  img_proc: true
- pgno: 322
  md: 义气、粗犷、敢想敢干等紧密联系在一起，与知识的多寡无关。比如，汉高祖刘邦，年轻时不学无术，无赖成性，好赌嗜酒，乱搞男女关系。。。。。可以这样说，这家伙在品德方面无一可称道之处，在一般人眼里，无非是个无赖，以至于当时这家伙年近而立仍讨不到老婆，连老爹刘太公都骂他。可是，偏偏就是这家伙，成就一代帝业，最终打败了勇武过人、不可一世的项羽，奠定汉家四百年的江山。为什么？这就是在乱世，他的缺点恰恰成了他的优势：正由于他豪放，讲义气，胆大，才团结了夏侯婴、樊哙等等一帮武夫，使他们把刘邦视为知己，愿意为其卖死力，也使有谋略的萧何认为他可辅佐，以建功立业。这就是他的人格魅力！试想，论才干，他与韩信、张良、陈平等无法相比，可是，后者都缺乏这样的人格
  merge: -1
