- pgno: 680
  md: '受罚者所谤，坐免归。


    远钦介无私曲，居人间，绝请谒，不造诣。与贵贱书疏，抗礼如一。其所会遇，未尝以颜色下人，以此多为俗士所恶。


    其清公实为天下第一。居数郡，见可欲终不变其心，妻子饥寒，如下贫者。


    及去东阳归家，经年岁口不言荣辱，士类益以此多之。其轻财好义，周人之急，言不虚妄，盖天性也。每戏语人云：


