  md: '情况时，他不知道怎么办。长期下来，大家会形成刻板印象，这件事虽然是他的权限，但我自己决定，他也不会有意见推给他，他绝对不会拒绝，一旦需要牺牲某人时，
    好欺负的人第一时间就会被想到。


    不被欺负，就得学会保护自己。假如对方不管真心或故意，摆出愤怒姿态时，你更要冷静下来，不必急着回应，可以先重复对方的话：你刚是说『不接这个工作就 走人吗？』借此观察是为了激怒你而演戏，还是真的生气而怒骂你。


    跳出对方的框架，站在不同层次反击他


    如果是真的生气，就给对方一点时间发泄；若是在演戏，就让对方明白这招对你没用。面对负面批评，无论是顶撞、回击，或是试图讲道理，都没有跳出对方的打击范围。更好的做法是站到更高层次，对他进行降维打击。举例来
    说，时常有人酸女性：学历太高、事业心太强，小心嫁不出去。这时，无论你愤怒反击或冷静说理，都还是在他的框架里，怎样回答都不对。最有效的方法是简单回应：你会这样想，很正常。


    这句话的潜台词是：你的眼界在哪，就只有那样的观点。当你跟他站在不同层次对话，自然也就跳出对方预设的框架。如果对方反问，你也可以顺着他的话说清自己的立场。


