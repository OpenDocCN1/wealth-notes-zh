  md: '# 生


    乾隆十五年五月二十八日（公元 1750 年 7 月 1 日）和珅出生在福建副都统常保家中。


    三岁时母亲因难产而去世临终时产下弟弟和琳，父亲常保在和珅九岁时亦因病去世，幸得一位老家丁和父亲的一位偏房保护的和珅、和琳两兄弟才能免于被赶出家门。


    他更成功考上咸安宫官学，和珅仪表俊雅，精通满、汉、蒙古、西藏四种语文，更精通四书五经。


    更得老师吴省钦、吴省兰器重。十八岁娶直隶总督冯英廉之孙女冯氏，和珼从此一鸣惊人。'
