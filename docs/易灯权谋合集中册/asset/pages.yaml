  md: '# 领导者心里


    对噶嗟国基的人，皇帝虽然很生气乃至生出杀气，内心却对他们有感情，常常放一马。这一点，和他们用强硬手段对付“谋反”的人是有些不同的。乾隆对李侍尧就是一例。据说，云贵总督李侍尧贪污索贿一案败露后，经钦差大臣和珅初审，定为“斩监候，秋后处决”，但大学士、九卿奉旨核议时，认为应从重，改为即行斩决。复审报告送达皇帝那里，办事果断的乾隆皇帝不仅不再果断，而且相当犹豫。为什么犹豫？因为李侍尧乃乾隆的宠臣，乾隆帝不想让他这么死掉。乾隆最看重的不仅在于李侍尧对自己的忠诚，也看重李侍尧的能力。他曾多次当着其它臣子的面表扬李侍尧“天下奇才”、“最能办事”、“最会办贡”，言外之意“人才难得”。一般而论，对领导宠幸、看重的人，集体讨论其善恶美丑时，讨论云云，只是一种形式，讨论者往往只是奴'
  merge: -1
