  md: '曹操在谋权方面的最成功之举莫过于“挟天子以令诸侯”。建安元年(196 年)，正当各处割据政权疲命战场之际，曹操接受首席谋士荀或的建议，将逃难中的汉献帝迎至许都(今河南许昌东)。尽管当时的皇帝是个傀儡，但毕竟在名义上是“万乘之尊”，是最高权力的象征。把这个傀儡控制在自己的手中，就可以打着皇帝的旗号对其他割据势力发号施令，在政治上取得“挟天子以令诸侯”的优势。


