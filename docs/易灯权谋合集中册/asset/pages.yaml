- pgno: 1243
  md: '上等人的目标是要保持他们的地位。中等人的目标是要同上等 人交换地位。下等人的特点始终是，他们劳苦之余无暇旁顾，偶 尔才顾到日常生活意外的事，因此他们如果有目标的话，无非是取
    消一切差别，建立一个人人平等的社会。


    因为中等人标榜自己为自由和正义而奋斗，把下等人争取到自己 一边来。中等人一旦达到目的就把下等人重又推回到与那里的被奴役 地位，自己变成了上等人。


    三等人中，只有下等人从来没有实现过自己的目标，哪怕是暂时实 现自己的目标。


    > ——乔治·奥威尔《一九八四》


    # 体制内，如何“混”出头


    很多人做职业规划往往着重于探索自己的能力、兴趣和价值观，而 忽视了对于外部职场的研究。外部职场的探索是职业规划不可或缺、 极其重要的一环，很多人都是因为对这方面研究不足，多走了许多弯
    路，甚至蹉跎了一生。


    中国的职场有很独特的地方，突出表现在“体制”上。因为有了“体 制”，中国这个职场在解读起来注定有其奥妙，而这奥妙又是各种舶 来的职业规划理论所无从窥透的。幸好，可以以史为鉴，又结合笔者
    自身数十年的亲身经历与研究，总算略通一二。好了，现在就让我大 家带路，逐巡前行，秉持好奇之烛光，对体制内职场一探究竟。'
  merge: -1
  img_proc: true
- pgno: 1244
  md: '政府机关、事业单位、大型国企，这三类“单位”，可以被归入我们中国职场所特有的体制内职场。在此职场中生存与发展必须遵从此中规律、道理，否则，前景堪忧。这些规律和道理，我将之总结为六条，可称为体制内职业规划的成功六诀。


    # 第一诀  靠拢党组织


    党组织在体制内职场中的地位与作用不需要详细论证，想必大家也心知肚明。因为在这些“单位”中，党组织是最高领导，这个地位独一无二，也无从质疑，这个领导地位超过业务范畴的管理，所以，加入、靠拢党组织，就是加入、靠拢核心领导层。


    冯仑在《理想丰满》中提及过的“大会解决小问题，小会解决大问题”，其中，解决大问题的小会在体制中常常是党委 会。不加入党组织，就没了开小会的可能，不开小会，自然就远离了大问题，远离了大问题，意味着远离了核心权力。这就是为什么仅从专业、业务角度上努力，是很难突破发展瓶颈，走向体制内高层管理的原因所在。


    # 第二诀  依靠关系获取资源


    1245'
  merge: -1
  img_proc: true
- pgno: 1245
  md: '体制内单位不是在行政权力上的垄断，就是在行业中业务垄断，所以，这些单位占据资源高位，基本没有生存的压力，也很少重视来自外部客户的压力。这样的单位，待遇很好，没有外部压力，自然而然，大家的精力几乎全部投入了内部位置的争夺与比拼。争夺中，不自觉地会形成帮派，一个不依附于帮派的个体是很难获得内部竞争胜利的。在这里，最重要的是平衡好各方关系，取得自己发展所需的各种资源，而专业能力、工作业绩等现代管理中看重的东西仅是一种竞争手段而已，不宜摆位过高。特别提醒初入体制内职场的新人，体制内职场中的发展，一定要注重关系，尤其是与上级之间的关系。


    比起市场经济模式下的职场，体制内职场更多地承袭了中国传统的官场文化。“一入宫门深似海！”，《后宫甄嬛传》中的甄嬛从一个不谙世事的单纯少女成长为一个善于权谋的深宫妇人，正折射出了环境对个人成长的决定性影响。尽管，深宫权妇不会是甄嬛想要成为的样子，但却或许是后宫中最合理，最成功的生存之道。皇帝、太后、皇后这三方后宫权力，在成长的过程中，无论如何，都要维系好至少一方关系，否则，便得不到资源可用，永无出头之日了。


    # 第三诀 懂尊卑，不僭越'
  merge: -1
  img_proc: true
- pgno: 1246
  md: '体制内的职场，通常设计了许多岗位层级，管理目标更侧重稳定而不是发展，也因为稳定的需要，下级对上级通常要绝对服从。一个人在工作中的效果与评价，上级握有绝对的话语权。在这种职场中，工作中的种种努力，都要通过上级的认可而取得成果与回报，所以，上级的认可是多么重要啊！不争工作短长，永远甘居领导之下，正是一个好下属处事的原则。


    慈禧不给北洋舰队军费，致使北洋舰队三年来未购一炮，技术上的落后，最终导致了中日甲午战争的全面落败。在此之前，李鸿章多次申请军费不果的情况下，没有继续对领导施压，反而，通过海防捐的方式筹措了大笔银子为慈禧的生日献礼，这就是颐和园的来历。李鸿章明哲保身，终成中国历史名臣。懂尊卑，不僭越，是一条体制内存活的原始法则。


    “领导永远是对的！”，记住这句话吧，在体制内，这是一条真理。


    # ### 第四块 巧建功，知进退


    尽管体制内的职场不特别注重专业能力，工作业绩，但很多时候，也需要这些为领导排忧解难。这样时刻来临的时候，一定要抢抓机遇，不可错过，毕竟，业绩是职业发展的基石。取得成绩之后，不要居功自傲，一定要退下来，将功劳全部让与领导。后这一点，确是许多职场人所不理解，也因'
  merge: -1
  img_proc: true
- pgno: 1247
  md: '而不能更进一步的原因。以退为进，领导自会明白你有能力，懂尊卑，是个得力下属，不会舍你不用；反之，如你功成不退，自然大大威胁了领导的管理权力，他必然想方设法削弱你的功绩，到头来，你终得不偿失。


    小周是我朋友，曾工作于体制内单位，管理一个客户服务部门，短期内大幅度地提高了客户满意度，同时让自己的团队保持着团结与高效。这个成果显而易见，也因此，小周自认为会得到领导嘉奖，低估了风险，没有停下来思考，而是更加努力地投入了工作。后来，结果大出小周及团队所料，小周团队在绩效考评中被评为最差，奖金最少，领导用这种方式否定了小周团队的工作，瓦解了这个团队的军心、斗志，进而削弱了小周在团队的权威。


    岳飞可以帮助朝廷打仗，但岳飞别想把岳家军的威势带到朝廷里来，进而影响宋徽宗的统治权威，所以，岳家军终会解散。如果，岳飞也有范蠡、曾国藩的智慧，建功的时候建功，退隐的时候退隐，便不会落得最后身首异处了。


    # 第五诀 关注趋势，保持开放


    从本质上讲，体制内职场承袭了太多中国传统官场文化，但，随着时代的发展，其中的许多事物也在发生改变，比如，外部的社会环境不同于以往，与世界先进文化交融愈加深化；管理者的眼界比原先开阔，思想观念意识中时代感逐'
  merge: -1
  img_proc: true
- pgno: 1248
  md: '步增强；管理文化、制度的设计更加科学化，关注公平等等。奋斗其中，在接受其传统性的同时，还必须关注到其变化趋势。因为这些变化会影响整个职场的价值取向，你努力的方向、方式和方法也应因之而变。开放的眼光和态度会让你不致封闭保守，从而跟上时代进步的脚步，把握成功脉搏。


    # 第六诀 看淡得失，寻求多元支点


    体制内的职场，即使自以为洞悉了所有规律，也不会永远在潮头屹立不倒。这是一个充斥着各种潜规则的地方，即使你规避甚至利用了某个潜规则，却难免被另外的规则牺牲掉。走到某个阶段，难免压抑、彷徨、委屈、痛苦、妥协。如果你还没有足够的能力与勇气选择彻底放弃，另辟蹊径的话，那么看淡得失，寻求多元支点，应该有助于平衡身心，度过难关，而不致导致过激行为。身体健康、孩子优秀、家人平安和睦、与朋友谈天说地、寄情山水、业余时间的第二职业或金融投资，都会给你带来喜悦与成就感。


    体制内的职场，许多时候，在温情脉脉的背后，充斥着各种争斗，心理上的、行动上的。这样的组织已经变成了伪群体，只有对手、没有伙伴，是心理上的丛林世界。在此种环境中，人难免要么防卫过度、变得世故油滑，要么生出邪念，在别人背后上下其手。此两种切要警惕，既要警惕别人


    1249'
