- pgno: 579
  md: '富翁为啥会进入了炼丹人圈套，因为富翁的本性如此，又被表面现象所迷惑，让富翁失去了本该具有的思考的能力。


    所有的高手，都是非常善于设局的，所有的赢家，都是非常了解人性。根据人性所设局，没有人可以躲的过，这就是赢家的核心本质，不论他是好人还是坏人。'
