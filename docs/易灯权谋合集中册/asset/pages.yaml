- pgno: 686
  md: '仇敌，而看待贫穷孤弱之家，如同自己的子弟，因此那些豪门大族特别畏惧害怕何远。何远在束阳任职一年多，又因为受到那些曾被他责罚之人的毁谤，免职回家。


    何远为人光明正大，不阿附私情，他处在官场上，断绝私人请托，自己也不谒见权贵。何速写信给人，无论贵贱，都以同样的平等之礼相待。他聚会遇见人，不会显露卑贱的神色逢迎奉承，因此何远常被一些平庸浅薄的士大夫厌恶忌恨。何远的清廉公正实在居于天下第一位。他在好几个郡任职，虽然见到'
