    # 「催眠術應當被毀滅」的兩大本意


    「催眠師應當被毀滅」、「根絶催眠術一詞」等等，雖然我不斷這樣訴說，但我真正想要表達的是，「應該停止催眠禿的現有形式」、「不需要用到催眠術這樣的說法」。


    拘泥於催眠術的形式，最後肯定會碰到困難。


    「他真的被我催眠了嗎？不會只是配合演出裝出來的吧？」不禁開始懷疑自己。


    手掌握不開、無法從椅子上站起來等等，若有過親身經歷那還好，但許多人是未曾體驗過催眠術，初次想要嘗試被催眠的感覺。


    所以，遇到這樣的人，無論施術者怎麼說「張不開」、「站不起來」，催眠最加上「沒錯：……」內心仍會感到不安：「他真的被我催眠了嗎？」


    更不用說引起「看見幻覺」、「妳最喜歡的偶像就在眼前。妳會把我看成某個偶像」等超自然現象，即便對方欣喜萬分要求握手，仍不由得想：「他是在逢'
  - '[PAGE 188]


    場作戲吧。


    如果只是當作一場表演，完全不用在意這個部分。


    因為即便對方只是上道識趣，做做樣子，在觀眾眼裡是真的引起催眠現象，所以完全沒有任何問題。


    試想這種情況。在居酒屋稍微向朋友施展催眠術，成功後滔滔不絕、得意炫耀：「誰都會中我的催眠。」朋友可能訕笑：「其實，我剛才沒有被催眠。」內心不禁會感到不安吧？


    老實說，沒有方法可以辨別對方是真的被催眠還是裝出來的。


    因為每個人被催眠後的特徵不一定相同，比如催眠術教材寫「瞳孔放大，就是中了催眠術」、「被催眠的人，會不自覺抖腳」（這些僅為舉例），但即便是這樣的狀態，還是很多人真的被催眠。


    催眠術這種東西，不可能設立明確的標準。'
  - '[PAGE 189]


    # 舉證之所在，敗訴之所在


    「所有權的證明責任在於當事者，由於無法或難以提示無限追溯的繼承取得之情形，視為敗訴。''


    這是著名的「惡魔的證明」，也就是「舉證之所在，敗訴之所在」。簡單講就是「我們難以證明不存在的事物」。


    其實，世上各種超自然現象、超能力者，甚或氣功師、魔術師的說詞，都與惡魔的證明」脫離不了關係。


    反過來說，證明「存在的事物」就非常簡單。


    假設氣功師對十人伸手發功，運氣讓他們的身體「發熱」，只要其中一人說：「我感覺到真氣。」就能證明「氣功存在」，即便沒有感覺到氣的人表示：「我什麼都沒有感覺到。」氣功師可以反駁：「那麼，你要怎麼解釋感覺到氣的人？'''
  - '[PAGE 190]


    表演湯匙彎曲，說：「這是利用宇宙之力。我是全人類中被宇宙神選出來的人。」只要湯匙彎曲的事實存在，就沒有人能推翻宇宙神的存在以及我的主張。


    如果有此人藉此建立大型宗教團體，卻被拆穿「湯匙彎曲只是把戲。這本書有寫怎麼做到，方法完全一樣。」其他信徒不會相信，反而會提出經驗談「不對，我看到的是不同的彎曲方法」、「或許湯匙彎曲是一種把戲，但我真的感受到身體被聖光包覆。」等等，即使那些經驗完全沒有事實根據。


    > 神秘宗教的盲目信仰，主要就是靠著反覆提示「惡魔的證明」而建立。


    魔術師說中觀眾抽出的紙牌，並說：「我能夠讀取你的內心。」這代表，只要「說中紙牌」這個事實存在，就沒有辦法證明「無法讀心」。換句話說，想要營造某樣特別的存在，只要「先說先贏」就行了。


    以前，我的熟人表示：「前陣子在那邊的神秘研究社，我成功召喚UF⊙。」


    「前幾天真的跟外星人通信了。」


    雖然少有人當真，但還是有一些人相信。


    「真的嗎？我得好好尊敬你一番。」甚至有人這樣說。


    當然，那間神秘研究社數年後就被曝光是惡作劇，但他表示：「那是為了防'
  - '[PAGE 191]


    止社會混亂，國家才謊稱是惡作劇。」「大家也認為荒唐至極、異想天開吧。


    然而，在電視的特別節目上，遇到UF O信徒發表意見時，你可以試著回想「惡魔的證明」再聽信徒的說法，你會發現雖然說得天花亂墜，但同樣是「先說先贏」的情形。


    「國家想要當作機密」、「有能作為證據的文件」等等，沒有人能全盤否定這樣的說法，即便國家正式出面否定，信徒也可說：「官員被宇宙人控制了。」


    # 「雪佛氏鐘擺」與靈能者的機制


    「雪佛氏鐘擺（Crowell''s Pendulum）」是指左右晃動的擺錘。


    想成用長細線綁上中間有洞的五圓日幣，「啊——是催眠時常用的道具嘛。相信馬上就能浮現畫面。'
  - '[PAGE 192]


    實際上，催眠師在眼前邊晃動擺錘邊說「你漸漸陷入沉睡」，現在已經看到這樣的光景。實際分析這項行爲，大概只是眼睛追擺錘追累了，漸漸想闔眼休息而已。


    若真要說，在眼前點燃打火機，「注視著火焰，你的眼皮漸漸變沉。」持續注視一點讓意識集中的「凝視法」，反而是比較常見用以深化恍惚狀態的方法。


    如同觀看電影等，畫面不斷左右晃動會讓人分心無法感動，讓對方凝視一點，是基本的催眠導入法。


    然而，使用五圓日幣在眼前晃動，卻是做完全相反的事情。


    實際上，雪佛氏鐘擺大多是讓受術者拿著擺錘，再說：「請想像擺錘左右晃動。」結果擺錘真的擺動起來。這是自己沒有自覺的肌肉運動，在催眠學上稱為觀念運動（念動反應，ideomotor），只需在腦中想像，物體就會自然動起來。


    人類的身體會像這樣做出微妙的反應，但因為是無意識的運動，自己也會覺得不可思議。當然，你現在只要將五圓日幣綁上細線，馬上能體驗這般神奇的現象。


    同樣的道理，把水晶石連接鏈子在地圖上左右晃動，說出「失蹤的人在這'
  - '[PAGE 193]


    裡」的靈能力者，其實是自己無意識地認為「大概在這裡」，水晶才會見到那個位置。


    鐘擺運動，簡單講就是「國外的錢仙」，因為心想「希望情況是這樣」，錢幣才真的自己動起來。其實，催眠術與錢仙有很深的淵源，歐洲以前還有流行過桌子旋轉（Table
    Tunning）、通靈板（Ouja Board）等占卜……但這邊就不多談。


    如同上述，表現方法各有不同，但基本上都是無意識地引起不可思議的運動，再宣稱「成功降靈」、「神明附體」，大家要知道曾經流行這樣的占卜方式。


    總而言之，若你認為「會動起來」，真的會產生沒有自覺的肌肉運動；若你認為「不會動起來」，就不會發生這樣的現象。


    這就是催眠的本質，自認為「會被催眠」的人，才會發生催眠現象。


    讀者可以找幾個人試驗，讓他們拿著綁上細線的五百日幣，接著說：「拿著就會左右動起來喔。」此時，應該會有人硬幣完全沒有動靜：「根本不會動啊。」但有些人的硬幣卻擺動得很恐怖。'
  - '[PAGE 194]


    # 專業與業餘的差異


    對擁有許多機會教導他人魔術的我而言，魔術的高明與否跟手是否靈活沒有關係。業餘人士當中有人有技法媲美世界級魔術師；專業人士當中也有人的手法令人不敢恭維。


    長年接觸形形色色的魔術師，我發現專業與業餘之間有著決定性的差異。


    那就是「是否打從心底相信自己」。


    兩者的差異只有這一點而已。


    「紅心A有著神奇的力量，打一個響指，紅心A就會自己飛出來。」魔術師的第一句話能否讓魔術聽起來神奇又具真實性，就知道這場表演秀有沒有看頭。


    「真心相信『紅心A有著神奇的力量』的魔術師所說出來的語調，與僅是照本宣科念出來的語氣，帶給觀眾的真實感截然不同。


    在催眠術上也是同樣的情況。


    為什麼明明很可疑的宗教勸誘，卻還是有那麼多人盲目追隨？試著想想這個'
  - '[PAGE 195]


    問題。這是因為勸誘一方真心相信「只要跟隨我們，你就能獲得幸福。」


    即便魔術背後有著如何「給予夢想」、「帶來歡笑」等正面課題，但其根本行動還是「欺騙」、「說謊」。


    這邊絕對不是要否定魔術師這項職業，而是說關鍵在於行為與對該行為的意識。


    「打完響指，客人做過記號的紙牌就跑到最上面。」這麼說的同時，卻對響指會跑到最上面根本是騙人「的行為湧起罪惡感，那就會淪為極其無聊的表演、魔術現象。


    「打個響指而已，紙牌怎麼可能像魔法般跑到最上面。」「只要心中稍微閃現這樣的想法，那位魔術師仍舊是業餘人士。'
  - '[PAGE 196]


    # 完美的說謊要先騙過自己


    與此相近的觀點有，原為冒牌靈媒師 M．拉瑪爾．基恩（M. Lamar Keese） 在自白書《心靈黑手黨（The Psychic Mafia）》中，將靈媒師分為「清醒類型」與「昏睡類型」兩類。


    「昏睡類型」是指，真的感受到來自靈界波動「Vibrations」的人；「清醒類型」是指，知道並承認自己已是詐欺師的人。


    他指出，開始從事耍詐買賣，需要定位自己是「昏睡類型」還是「清醒類型」。


    魔術師必須是「清醒但昏睡的類型」。拉瑪爾．基恩先生最後把自己和同行 的夥伴定位為「唯我獨醒的類型」，這是基於「雖然是欺騙他人，但我們是在推廣心靈主義」的想法，認為自己不是存心惡意欺騙他人。


    魔術師有著「取悅客人」的正常理由，照料來說應該能讓自己轉為昏睡類型。如此一來，才能展現專業人士的「真心欺騙」。'
  - '[PAGE 197]


    換句話說，不論有沒有惡意，想要欺騙他人得先有正當理由。


    請讀者想像一下。


    你的朋友被遮住眼睛，站在距離懸崖數公尺前等候你的指示。你要做的是讓


    這位朋友摔落懸崖（雖然有點異想天開，但還請讀者想像一下）。


    朋友再前進三步就會摔落懸崖，你說：「你再前進三步，就安全了。」如果


    此時內心閃過念頭：「雖然說是工作，但還是覺得對不起他。」語氣中就會顯現


    「罪惡感」。


    而朋友把自己的行動託付給你，因此能敏感察覺到你語氣中的「罪惡感」。


    「這個人只有摔落懸崖，才能獲得真正的解脫。」如何讓自己如此相信來消


    去罪惡感，是能不能完美說謊的關鍵點。


    套用這個觀點，擁有良知的世俗懷疑論者，需有天才般的自我暗示能力，才


    能為私利私慾謊稱「我是神明的使者」，拉攏信徒建立巨大組織。


    如果無法在欺騙他人之前先騙過自己，那就不可能完美騙過他人。


    當然，對「昏睡類型」的人來說，即便不用這樣欺騙自己，內心也早就這麼


    認為，所以說出來的說服力可是深不可測。'
  - '[PAGE 198]


    # 完全推卸責任的說話技巧


    然而，魔術師得在了解手法、把戲的前提下，成為「昏睡類型」。專業的魔術師果必須具備天才般的自我暗示能力。


    稍微接觸魔術之後，會學到宛若超能力般的技巧「魔術師選擇」。


    此技巧是表演者如同預期演出，卻讓觀眾覺得是以自己的意志選擇。


    假設你手邊有紅色紙牌與藍色紙牌，想要讓對方選擇紅色時，說：「紅色和藍色，請選擇一種顏色。」


    如果對方選擇紅色，「你選了紅色。」繼續表演下去；如果對方選擇藍色，「那麼，我也選擇藍色吧。難得有機會一起上台遊戲，你不如選紅色吧。」運用言語上的詭計，讓演出如同預期進行或者得到相同的結局。


    或許有人會說：「我早就知道有這樣的技巧」、「什麼嘛，是這回事啊。我'
  - '[PAGE 199]


    才不會被這樣的詭計給騙了」。這樣想的人，多半認為這是「讓對方選擇」的話術。


    然而，使用這項技巧的時候，比起注重讓對方選擇，更應該重視在對方選擇後，「強調這是對方自己的選擇」。


    魔術師在公開「說中結果」之前，得先問：「為什麼選擇紅色呢？」客人回答：「嗯……憑感覺選的。」然後，魔術師說「請將紅色紙牌翻到正面」並邊提示一致的答案，這樣對方就會認為「怎麼會這樣，明明是我自己選擇的。」


    這邊的重點是，藉由詢問：「為什麼選擇這個？」誘導對方認為「這是自己的選擇。」


    人的記憶相當曖昧含糊，即使使出各種手段誘導選擇，只要一問：「為什麼選擇這個？」對方就會擅自解釋：「這是我自己的選擇。」


    「為什麼選擇這個？」雖然聽起來像是問句，但其實是狡猾的間接暗示。


    「為什麼會和我交往呢？」「您是從哪邊得知本店的？」


    只需要投出類似的質問，就能讓人覺得「這是自己的選擇」，說得難聽一'
  - '[PAGE 200]


    點，這其實是在「推卸責任」。


    「為什麼會和我交往呢？」「總覺得我們好像合得來。」


    若是在魔術表演，「這是你自己的選擇，但結果被我說中。很神奇吧？」只是娛樂性質而已，無傷大雅，但同樣的做法換到社會上，「這是你自己選擇的，我不用負任何責任。」卻變成聽起來好像理所當然，其實極其狡詐的說法。


    即便你的意志受到魔術師的選擇而扭曲，你仍然會相信這是自己的意志。


    # 與時俱進的「不明生物」


    被多數人自擊卻消失蹤跡的人面犬，不再現身都會城市的裂嘴女，其他還有尼斯湖怪、天笨魚 (Skunk) ……


    過去人們口口聲聲「我絕對沒有看錯」的「不明生物」，現在幾乎全都遭到世人遺忘。'
  - '[PAGE 201]


    只要有一台智慧手機，任何人都能製作合成照片、影片，少有人再相信靈異照片（雖然我個人相信真的有靈異照片……）。


    就某種意義來說，超能力少年也是隨著時代誕生、漸漸遭到人們遺忘的存在。


    十九世紀大量存在「降靈術召喚出來的吹喇叭幽靈」，現在卻連一點影子都沒有。


    隨著智慧手機等科學日新月異，超能力現象逐漸消逝蹤影。


    拍立得相機淪為收藏品，數位相機無法做到的念寫能力，現在也已經不復存在。


    然而，人們還是繼續探求「未知事物」。現在仍有來自全日本的客人，光臨我開的咖啡店，只為了詢問：「催眠術真的存在嗎？」


    不論是詐騙、騙人伎倆還是魔術現象，都得隨著時代演進，維持未知的狀態才行。


    很久以前，手機簡訊會收到「我是○○小姐。如果方便，點擊這個網址回個簡訊給我。」如果真的點擊連結，可能會被索取大筆金額；再回到更早之前，信'
  - '[PAGE 202]


    箱甚至會收到實體倩件，寫著「恭喜您中獎……」。在昭和時代（一九二六～一九八八年間），據說攤販會販售「三十日圓吃一個月（ひとつき）的方法」的小冊子，結果花錢買來翻開，裡頭卻寫說「去吃涼粉，花三十日圓推一下（ひとつき）就能吃到。」0


    即便是現在認為「傻到不行」的詭計，當時還是有人受騙上當。你沒有辦法保證現在自己所相信的「未知事物」，近似超自然現象的「心理學」，數十年後不會被說是「傻到不行」。


    # 「催眠術是控制潛意識」的謬誤


    人的心理有兩個部分，一部分是意識，另一部分是無意識。「心理學權威西格蒙德・佛洛伊德（Sigmund Freud）提出了這樣的觀點。也就是所謂的顯意識與潛意識。


    0'
  - '[PAGE 203]


    雖然本書前面多次提到「潛在的」，但實際上並未清楚解釋潛意識。「我們認識到的意識（顯意識）僅為海面上的冰山一角，隱藏於海面下的無意識（潛意識）才是其巨大的本體。」佛洛伊德說道。


    我為其關鍵在於「觀看的意識」。催眠教室、催眠教材肯定都會提到「冰山一角」，解釋「催眠術是利用無意識狀態，也就是控制潛意識的技術。」然而，催眠術、暗示必須在本人「意識」的情況下，才會發生相應的效果。假設手邊有一瓶無酒精啤酒，將瓶外的標籤換成普通啤酒的包裝，讓受試者飲用，結果他真的喝醉。


    而催眠術的做法，正是把無酒精啤酒放到對方面前，不斷在耳邊低語：「想像眼前這瓶是含有酒精的普通啤酒，喝下去你會醉釀釀。」這就是為何我認為「催眠術應當被毀滅」，如果真的想要引起「喝下無酒精啤酒喝醉」的現象，更換外包裝的標籤更為實在。


    像這樣仰賴對方的想像力，「想像……」的「催眠術」行為，暗示有時會成功。


    涼粉是用一塊塊寒天推壓出細麵條。ひとつき同時雙關一個月和推一下的意思。'
  md: '

    # 「前世催眠」的本質


    如果一定要購買類似的資格才能出來教催眠術，那麼我早就是背負無數前科的重大要犯。

    總之，不論是「聽課數百小時所頒發的資格」，還是「參與三天研修所頒發的資格」，各機構依商業利益所販售的資格，皆不是具有效力的證明。

    有些人別有用心，取得這些資格後，會宣稱「我能讓你心智退化」、「我能看見你的前世」等等。

    前往學習催眠術的人，沒有自覺「自己中了威光暗示」，催眠術這種東西，只要有心施展，可以現學現賣。


    有多少人相信前世呢？

    這會因不同的國家、信仰的宗教觀，而有很大的差異。


    認為透過催眠術可以看見前世的人，實際上有多少人呢？真要說，轉世是從哪裡轉世過來的呢？若人只能轉世為人，世上理應不會有人口增減的問題。以前面章節提到「既然如此」的思維，討論輪迴轉世是否存在，只會是沒有結果的謬論。實際上，催眠對方陷入恍惚狀態，回到自己的前世，有些人會看到身為蟲子的前世，有些人卻只能看到身為人類的前世。


    先不討論輪迴轉世是否真的存在，他們看到的大概是「自己能夠想像的前世」。


    讓女性看見前世時，多半會浮現中世紀歐洲的景象；讓男性看見前世時，大多會變成江戶時代的武士或商人。


    不過，人從死後到轉世的間隔，真的時長都差不多嗎？我至今看過將近一百位「被催眠看見前世的人」，倒是不是任何人回到「嗚嗚嗚嗚」叫的原始人。


    在我開始學習催眠術時，已經有各種千奇百怪的教室。有一次在某間教室，老師要我喝下漂浮著可疑葉子的開水，引導我躺到沙發上：「躺下來和你心中的神明對話。」然後，老師對我說：「你慢慢會看見前世。」或許就是這樣的經驗，讓我有「前世催眠」產生偏見。


    不過，「前世催眠」實質上是「看見自己想要看到的事物」。


    中世紀歐洲是日本女性自小在少女漫畫上經常接觸的世界，而日本男性對前世的印象多是來自描述江戶時代、戰國時代的時代劇。


    即使是單純暗示「你現在是一條狗」，有些人會變成腳步沉重的大型犬，有些人則是變成活潑亂跑的小型犬，可見催眠術只是引出當事人能夠想像的情報而已。


    ## 「鬼壓床」機制解說


    「身體束縛」是相當有趣的現象。


    人極度興奮或者極度放鬆會進入暗示狀態。換句話說，睡著、睡糊塗也可說是某種程度的催眠狀態。睡覺做夢的狀態也是如此，睡夢中出現朋友、殭屍，僅是因為當事者有著相關記憶而已。


    而「身體束縛」的狀態是指，在半睡半醒之間發生的肌肉僵直，亦即陷入「身體變得硬梆梆動不了」的暗示狀態。


    為什麼會引發這樣的狀態呢？這是因為大家都知道「鬼壓床」這有名的現象。


    一般認知的定義是「半夜醒來，身體整個完全動不了」，聽過這件事的人在半夜醒來，「我好像被鬼壓床了」於是自己暗示自己。


    為什麼只有身體束縛的現象，「我昨天被鬼壓床了！」能融入日常會話當中，廣為一般人所知呢？這真是個未知的謎。


    這或許是因為，「身體無法動彈的狀態」是人在睡眠與覺醒之間一定會出現的生理反應。


    重要的是，「身體動不了後，聽到誦經聲，瞥見祖母站在牀頭旁邊。」還出現如此具體的證言。


    若將身體束縛理解為一種暗示，那麼誦經聲就是幻聽現象、祖母是幻覺現象。想要進入深層睡眠、深度恍惚狀態，如同前面提到的，關鍵在於現象的連續性。


    那麼，這邊試著用此觀點來探討身體束縛吧。


    首先，身體陷入無法動彈的狀態。自己感到驚訝害怕，結果加深自身的恍惚狀態。愈是認為「動不了」，愈會形成自我暗示，引發嚴重的肌肉僵直，變成「全身無法動彈」的狀況。


    催眠師引發「手指黏在一起」的催眠之後，趁對方感到驚訝，緊接著說：「你現在覺得全身僵硬！」有時對方的身體會真的變僵硬無法動彈。


    換句話說，身體束縛的原型，與利用生理現象誘導進入深度催眠的催眠術相同。


    # 外國人被鬼壓床，不會聽到「誦經聲」


    反覆數次暗示後產生幻聽，對此感到驚訝而深化恍惚狀態，進而看見幻覺，其中比較有趣的地方是「誦經聲」的部分。


    當然，外國人無法理解誦經的內容。不如說，腦中本來就沒有「佛經」的概念，所以不會聽到誦經聲。


    以前，某位腦外科醫生說：「真的有死後的世界。我親眼看到了。」當時蔚為話題，我對此感到興趣，但聽他說：「我浮在雲端上，聽見了聖歌。」我便大失所望。


    如果真的有没有死後的世界，我認為不應該出現個人的宗教觀。就結果來說，那位醫生只是重現腦中的記憶，仍舊停留在暗示、催眠的範疇。


    其實，關於「鬼壓床」現象中「無法動彈」的狀態，可用「睡眠麻痺（sleep paralysis）」來說明。


    感到驚訝，就會進入恍惚狀態，而後續產生的幻聽、幻覺可理解為一種催眠現象。


    據說，外國人僵直後多是看見「惡魔」。另外，自稱被UFO綁架過的人，大多都曾經有過鬼壓床經驗。以暗示的角度來想，會覺得「原來如此」吧。


    這邊再重申一次，關鍵在於「因為本人有所認知，才能夠引發現象」，而「鬼壓床廣為一般大眾所認知」。在歐美，儘管大部分人對「UFO會綁架人類進行各種手術實驗」抱持懷疑的態度，但「好像有這回事」仍舊受到一般人所認知。


    就這樣來說，只要人們對於「催眠術」一詞，存有的印象是「好像有些人會被催眠，有些人不會」、「聽說單純的傻瓜才會被催眠」。那麼提問「你認為自己會被催眠嗎？」的效果甚至贏不了「你認為鬼壓床真的存在嗎？」


    說來可悲，只要前提不離催眠術，就難以引發催眠現象。


    # 「催眠術應當被毀滅」的兩大本意


    「催眠師應當被毀滅」、「根絶催眠術一詞」等等，雖然我不斷這樣訴說，但我真正想要表達的是，「應該停止催眠術的現有形式」、「不需要用到催眠術這樣的說法」。


    拘泥於催眠術的形式，最後肯定會碰到困難。


    「他真的被我催眠了嗎？不會只是配合演出裝出來的吧？」不禁開始懷疑自己。


    手掌握不開、無法從椅子上站起來等等，若有過親身經歷那還好，但許多人是未曾體驗過催眠術，初次想要嘗試被催眠的感覺。


    所以，遇到這樣的人，無論施術者怎麼說「張不開」、「站不起來」，催眠術加上「沒錯：……」內心仍會感到不安：「他真的被我催眠了嗎？」


    更不用說引起「看見幻覺」、「妳最喜歡的偶像就在眼前。妳會把我看成某個偶像」等超自然現象，即便對方欣喜萬分要求握手，仍不由得想：「他是在逢場作戲吧。」


    如果只是當作一場表演，完全不用在意這個部分。


    因為即便對方只是上道識趣，做做樣子，在觀眾眼裡是真的引起催眠現象，所以完全沒有任何問題。


    試想這種情況。在居酒屋稍微向朋友施展催眠術，成功後滔滔不絕、得意炫耀：「誰都會中我的催眠。」朋友可能訕笑：「其實，我剛才沒有被催眠。」內心不禁會感到不安吧？


    老實說，沒有方法可以辨別對方是真的被催眠還是裝出來的。


    因為每個人被催眠後的特徵不一定相同，比如催眠術教材寫「瞳孔放大，就是中了催眠術」、「被催眠的人，會不自覺抖腳」（這些僅為舉例），但即便是這樣的狀態，還是很多人真的被催眠。


    催眠術這種東西，不可能設立明確的標準。


    # 舉證之所在，敗訴之所在


    「所有權的證明責任在於當事者，由於無法或難以提示無限追溯的繼承取得之情形，視為敗訴。」


    這是著名的「惡魔的證明」，也就是「舉證之所在，敗訴之所在」。簡單講就是「我們難以證明不存在的事物」。


    其實，世上各種超自然現象、超能力者，甚或氣功師、魔術師的說詞，都與「惡魔的證明」脫離不了關係。


    反過來說，證明「存在的事物」就非常簡單。


    假設氣功師對十人伸手發功，運氣讓他們的身體「發熱」，只要其中一人說：「我感覺到真氣。」就能證明「氣功存在」，即便沒有感覺到氣的人表示：「我什麼都沒有感覺到。」氣功師可以反駁：「那麼，你要怎麼解釋感覺到氣的人？」


    表演湯匙彎曲，說：「這是利用宇宙之力。我是全人類中被宇宙神選出來的人。」只要湯匙彎曲的事實存在，就沒有人能推翻宇宙神的存在以及我的主張。


    如果有此人藉此建立大型宗教團體，卻被拆穿「湯匙彎曲只是把戲。這本書有寫怎麼做到，方法完全一樣。」其他信徒不會相信，反而會提出經驗談「不對，我看到的是不同的彎曲方法」、「或許湯匙彎曲是一種把戲，但我真的感受到身體被聖光包覆。」等等，即使那些經驗完全沒有事實根據。


    > 神秘宗教的盲目信仰，主要就是靠著反覆提示「惡魔的證明」而建立。


    魔術師說中觀眾抽出的紙牌，並說：「我能夠讀取你的內心。」這代表，只要「說中紙牌」這個事實存在，就沒有辦法證明「無法讀心」。換句話說，想要營造某樣特別的存在，只要「先說先贏」就行了。


    以前，我的熟人表示：「前陣子在那邊的神秘研究社，我成功召喚UFO。」

    「前幾天真的跟外星人通信了。」

    雖然少有人當真，但還是有一些人相信。

    「真的嗎？我得好好尊敬你一番。」甚至有人這樣說。


    當然，那間神秘研究社數年後就被曝光是惡作劇，但他表示：「那是為了防止社會混亂，國家才謊稱是惡作劇。」

    「大家也認為荒唐至極、異想天開吧。」


    然而，在電視的特別節目上，遇到UFO信徒發表意見時，你可以試著回想「惡魔的證明」再聽信徒的說法，你會發現雖然說得天花亂墜，但同樣是「先說先贏」的情形。


    「國家想要當作機密」、「有能作為證據的文件」等等，沒有人能全盤否定這樣的說法，即便國家正式出面否定，信徒也可說：「官員被宇宙人控制了。」


    # 「雪佛氏鐘擺」與靈能者的機制


    「雪佛氏鐘擺（Crowell''s Pendulum）」是指左右晃動的擺錘。


    想成用長細線綁上中間有洞的五圓日幣，「啊——是催眠時常用的道具嘛。相信馬上就能浮現畫面。


    實際上，催眠師在眼前邊晃動擺錘邊說「你漸漸陷入沉睡」，現在已經看到這樣的光景。實際分析這項行爲，大概只是眼睛追擺錘追累了，漸漸想闔眼休息而已。


    若真要說，在眼前點燃打火機，「注視著火焰，你的眼皮漸漸變沉。」持續注視一點讓意識集中的「凝視法」，反而是比較常見用以深化恍惚狀態的方法。


    如同觀看電影等，畫面不斷左右晃動會讓人分心無法感動，讓對方凝視一點，是基本的催眠導入法。


    然而，使用五圓日幣在眼前晃動，卻是做完全相反的事情。


    實際上，雪佛氏鐘擺大多是讓受術者拿著擺錘，再說：「請想像擺錘左右晃動。」結果擺錘真的擺動起來。這是自己沒有自覺的肌肉運動，在催眠學上稱為觀念運動（念動反應，ideomotor），只需在腦中想像，物體就會自然動起來。


    人類的身體會像這樣做出微妙的反應，但因為是無意識的運動，自己也會覺得不可思議。當然，你現在只要將五圓日幣綁上細線，馬上能體驗這般神奇的現象。


    同樣的道理，把水晶石連接鏈子在地圖上左右晃動，說出「失蹤的人在這裡」的靈能力者，其實是自己無意識地認為「大概在這裡」，水晶才會見到那個位置。


    鐘擺運動，簡單講就是「國外的錢仙」，因為心想「希望情況是這樣」，錢幣才真的自己動起來。其實，催眠術與錢仙有很深的淵源，歐洲以前還有流行過桌子旋轉（Table
    Tunning）、通靈板（Ouja Board）等占卜……但這邊就不多談。


    如同上述，表現方法各有不同，但基本上都是無意識地引起不可思議的運動，再宣稱「成功降靈」、「神明附體」，大家要知道曾經流行這樣的占卜方式。


    總而言之，若你認為「會動起來」，真的會產生沒有自覺的肌肉運動；若你認為「不會動起來」，就不會發生這樣的現象。


    這就是催眠的本質，自認為「會被催眠」的人，才會發生催眠現象。


    讀者可以找幾個人試驗，讓他們拿著綁上細線的五百日幣，接著說：「拿著就會左右動起來喔。」此時，應該會有人硬幣完全沒有動靜：「根本不會動啊。」但有些人的硬幣卻擺動得很恐怖。


    # 專業與業餘的差異


    對擁有許多機會教導他人魔術的我而言，魔術的高明與否跟手是否靈活沒有關係。業餘人士當中有人有技法媲美世界級魔術師；專業人士當中也有人的手法令人不敢恭維。


    長年接觸形形色色的魔術師，我發現專業與業餘之間有著決定性的差異。


    那就是「是否打從心底相信自己」。


    兩者的差異只有這一點而已。


    「紅心A有著神奇的力量，打一個響指，紅心A就會自己飛出來。」魔術師的第一句話能否讓魔術聽起來神奇又具真實性，就知道這場表演秀有沒有看頭。


    「真心相信『紅心A有著神奇的力量』的魔術師所說出來的語調，與僅是照本宣科念出來的語氣，帶給觀眾的真實感截然不同。


    在催眠術上也是同樣的情況。


    為什麼明明很可疑的宗教勸誘，卻還是有那麼多人盲目追隨？試著想想這個問題。這是因為勸誘一方真心相信「只要跟隨我們，你就能獲得幸福。」


    即便魔術背後有著如何「給予夢想」、「帶來歡笑」等正面課題，但其根本行動還是「欺騙」、「說謊」。


    這邊絕對不是要否定魔術師這項職業，而是說關鍵在於行為與對該行為的意識。


    「打完響指，客人做過記號的紙牌就跑到最上面。」這麼說的同時，卻對響指會跑到最上面根本是騙人「的行為湧起罪惡感，那就會淪為極其無聊的表演、魔術現象。


    「打個響指而已，紙牌怎麼可能像魔法般跑到最上面。」「只要心中稍微閃現這樣的想法，那位魔術師仍舊是業餘人士。


    # 完美的說謊要先騙過自己


    與此相近的觀點有，原為冒牌靈媒師 M．拉瑪爾．基恩（M. Lamar Keese） 在自白書《心靈黑手黨（The Psychic Mafia）》中，將靈媒師分為「清醒類型」與「昏睡類型」兩類。


    「昏睡類型」是指，真的感受到來自靈界波動「Vibrations」的人；「清醒類型」是指，知道並承認自己已是詐欺師的人。


    他指出，開始從事耍詐買賣，需要定位自己是「昏睡類型」還是「清醒類型」。


    魔術師必須是「清醒但昏睡的類型」。拉瑪爾．基恩先生最後把自己和同行的夥伴定位為「唯我獨醒的類型」，這是基於「雖然是欺騙他人，但我們是在推廣心靈主義」的想法，認為自己不是存心惡意欺騙他人。


    魔術師有著「取悅客人」的正常理由，照料來說應該能讓自己轉為昏睡類型。如此一來，才能展現專業人士的「真心欺騙」。


    換句話說，不論有沒有惡意，想要欺騙他人得先有正當理由。


    請讀者想像一下。


    你的朋友被遮住眼睛，站在距離懸崖數公尺前等候你的指示。你要做的是讓這位朋友摔落懸崖（雖然有點異想天開，但還請讀者想像一下）。


    朋友再前進三步就會摔落懸崖，你說：「你再前進三步，就安全了。」如果此時內心閃過念頭：「雖然說是工作，但還是覺得對不起他。」語氣中就會顯現「罪惡感」。


    而朋友把自己的行動託付給你，因此能敏感察覺到你語氣中的「罪惡感」。


    「這個人只有摔落懸崖，才能獲得真正的解脫。」如何讓自己如此相信來消去罪惡感，是能不能完美說謊的關鍵點。


    套用這個觀點，擁有良知的世俗懷疑論者，需有天才般的自我暗示能力，才能為私利私慾謊稱「我是神明的使者」，拉攏信徒建立巨大組織。


    如果無法在欺騙他人之前先騙過自己，那就不可能完美騙過他人。


    當然，對「昏睡類型」的人來說，即便不用這樣欺騙自己，內心也早就這麼認為，所以說出來的說服力可是深不可測。


    # 完全推卸責任的說話技巧


    然而，魔術師得在了解手法、把戲的前提下，成為「昏睡類型」。專業的魔術師果必須具備天才般的自我暗示能力。


    稍微接觸魔術之後，會學到宛若超能力般的技巧「魔術師選擇」。


    此技巧是表演者如同預期演出，卻讓觀眾覺得是以自己的意志選擇。


    假設你手邊有紅色紙牌與藍色紙牌，想要讓對方選擇紅色時，說：「紅色和藍色，請選擇一種顏色。」


    如果對方選擇紅色，「你選了紅色。」繼續表演下去；如果對方選擇藍色，「那麼，我也選擇藍色吧。難得有機會一起上台遊戲，你不如選紅色吧。」運用言語上的詭計，讓演出如同預期進行或者得到相同的結局。


    或許有人會說：「我早就知道有這樣的技巧」、「什麼嘛，是這回事啊。我才不會被這樣的詭計給騙了」。這樣想的人，多半認為這是「讓對方選擇」的話術。


    然而，使用這項技巧的時候，比起注重讓對方選擇，更應該重視在對方選擇後，「強調這是對方自己的選擇」。


    魔術師在公開「說中結果」之前，得先問：「為什麼選擇紅色呢？」客人回答：「嗯……憑感覺選的。」然後，魔術師說「請將紅色紙牌翻到正面」並邊提示一致的答案，這樣對方就會認為「怎麼會這樣，明明是我自己選擇的。」


    這邊的重點是，藉由詢問：「為什麼選擇這個？」誘導對方認為「這是自己的選擇。」


    人的記憶相當曖昧含糊，即使使出各種手段誘導選擇，只要一問：「為什麼選擇這個？」對方就會擅自解釋：「這是我自己的選擇。」


    「為什麼選擇這個？」雖然聽起來像是問句，但其實是狡猾的間接暗示。


    「為什麼會和我交往呢？」「您是從哪邊得知本店的？」


    只需要投出類似的質問，就能讓人覺得「這是自己的選擇」，說得難聽一點，這其實是在「推卸責任」。


    「為什麼會和我交往呢？」「總覺得我們好像合得來。」


    若是在魔術表演，「這是你自己的選擇，但結果被我說中。很神奇吧？」只是娛樂性質而已，無傷大雅，但同樣的做法換到社會上，「這是你自己選擇的，我不用負任何責任。」卻變成聽起來好像理所當然，其實極其狡詐的說法。


    即便你的意志受到魔術師的選擇而扭曲，你仍然會相信這是自己的意志。


    # 與時俱進的「不明生物」


    被多數人自擊卻消失蹤跡的人面犬，不再現身都會城市的裂嘴女，其他還有尼斯湖怪、天笨魚 (Skunk) ……


    過去人們口口聲聲「我絕對沒有看錯」的「不明生物」，現在幾乎全都遭到世人遺忘。


    只要有一台智慧手機，任何人都能製作合成照片、影片，少有人再相信靈異照片（雖然我個人相信真的有靈異照片……）。


    就某種意義來說，超能力少年也是隨著時代誕生、漸漸遭到人們遺忘的存在。


    十九世紀大量存在「降靈術召喚出來的吹喇叭幽靈」，現在卻連一點影子都沒有。


    隨著智慧手機等科學日新月異，超能力現象逐漸消逝蹤影。


    拍立得相機淪為收藏品，數位相機無法做到的念寫能力，現在也已經不復存在。


    然而，人們還是繼續探求「未知事物」。現在仍有來自全日本的客人，光臨我開的咖啡店，只為了詢問：「催眠術真的存在嗎？」


    不論是詐騙、騙人伎倆還是魔術現象，都得隨著時代演進，維持未知的狀態才行。


    很久以前，手機簡訊會收到「我是○○小姐。如果方便，點擊這個網址回個簡訊給我。」如果真的點擊連結，可能會被索取大筆金額；再回到更早之前，信箱甚至會收到實體倩件，寫著「恭喜您中獎……」。在昭和時代（一九二六～一九八八年間），據說攤販會販售「三十日圓吃一個月（ひとつき）的方法」的小冊子，結果花錢買來翻開，裡頭卻寫說「去吃涼粉，花三十日圓推一下（ひとつき）就能吃到。」


    即便是現在認為「傻到不行」的詭計，當時還是有人受騙上當。你沒有辦法保證現在自己所相信的「未知事物」，近似超自然現象的「心理學」，數十年後不會被說是「傻到不行」。


    # 「催眠術是控制潛意識」的謬誤


    人的心理有兩個部分，一部分是意識，另一部分是無意識。「心理學權威西格蒙德・佛洛伊德（Sigmund Freud）提出了這樣的觀點。也就是所謂的顯意識與潛意識。


    雖然本書前面多次提到「潛在的」，但實際上並未清楚解釋潛意識。「我們認識到的意識（顯意識）僅為海面上的冰山一角，隱藏於海面下的無意識（潛意識）才是其巨大的本體。」佛洛伊德說道。


    我為其關鍵在於「觀看的意識」。催眠教室、催眠教材肯定都會提到「冰山一角」，解釋「催眠術是利用無意識狀態，也就是控制潛意識的技術。」然而，催眠術、暗示必須在本人「意識」的情況下，才會發生相應的效果。假設手邊有一瓶無酒精啤酒，將瓶外的標籤換成普通啤酒的包裝，讓受試者飲用，結果他真的喝醉。


    而催眠術的做法，正是把無酒精啤酒放到對方面前，不斷在耳邊低語：「想像眼前這瓶是含有酒精的普通啤酒，喝下去你會醉釀釀。」這就是為何我認為「催眠術應當被毀滅」，如果真的想要引起「喝下無酒精啤酒喝醉」的現象，更換外包裝的標籤更為實在。


    像這樣仰賴對方的想像力，「想像……」的「催眠術」行為，暗示有時會成功。


    涼粉是用一塊塊寒天推壓出細麵條。ひとつき同時雙關一個月和推一下的意思。

