    此時，客人突然就不認為這是「超能力」了，開始思索「他是怎麼讓身體浮起來的？」「是不是用看不見的繩索吊起來？」「這就是我所謂的「山谷」。


    接著走到戶外，讓車子向上浮起。


    「這很厲害沒錯，但是怎麼辦到的？」


    表演到這邊，還沒有跨越山谷。


    實際上，在國外的表演中，魔術師會乘坐在車轎裡頭，自由自在地在空中飛行。「太神了！」觀眾無不拍手叫好，雖然感覺不可思議，但沒有人感到害怕。


    我用催眠術讓友人的手變僵直，對方會反應：「哎！好厲害！我竟然中招了！」但若是讓他學狗「汪汪！」叫，他會說：「我只是配合你演出而已。」


    在電視節目的魔術，有時會讓建築物或者有大象般大小的生物消失，如果那場演出跨越了「山谷」，「建築物裡面的人沒事吧」「快把大象從異次元中變回來啊！」馬上會湧現這樣的反應吧。'
