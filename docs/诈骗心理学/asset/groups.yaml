    # 立即實踐催眠術的五個「催眠SOP」


    催眠術僅是建立投契關係上的主觀深信，不會有超乎想像的效果，也不是誰都會被暗示……前面從各方面否定催眠術，但為了想要嘗試催眠他人的讀者，這邊準備了具有某種程度效果的催眠SOP範文。


    我想這些比其他催眠教材來得容易實踐，馬上就能自認為「催眠師」（再重申一遍，我並不是要肯定應當被毀滅的「催眠師」稱號）。


    首先，受術者約三人為佳。


    如果只有一位受術者，且深信「我絕對不會被催眠」，那不會成功；如果有十幾位受術者，當某一人表示：「我沒有被催眠。」周遭就有可能被「被催眠會很丟臉」、「也是，哪有人會被催眠啊」的氛圍支配。


    再來，不太親近的對象為佳，如當天在派對上認識的親近程度。至少，應該避免能直言不諱的好友，不要選擇親兄弟姐妹，催眠的成功率會大為提升。'
  - '[PAGE 234]


    這樣選擇是為了避免被受術者先入為主認為：「這傢伙哪可能會催眠術。」抱持「這間店不好吃」的成見走進拉麵店，不管師傅端出多麼美味的拉麵，也不會感覺好吃。


    那麼，確保三位左右的受術者，再來就是第一句開場白。


    # 催眠 SOP①


    引起注意的第一句開場範文，如下：


    「之前，我有上過催眠術課程。」


    關鍵在於不是說「我最近開始學習催眠術」，而是強調「上過催眠術課程」。


    提示自己砸錢學習了某事物，能引起對方的興趣：「原來有這樣的課程啊。」


    接著，對方通常都會像下面這樣回問（屢試不爽，各位試過就知道）。'
  - '[PAGE 235]


    「真的催眠術嗎？」


    「有人會被催眠、有人不會被催眠吧？」


    重要的是，對方一定會拋出問句。


    此時，你變成是提供資訊的一方，而對方是想要資訊的一方。


    # ◎催眠SOP②


    萬一對方面堅稱「我有自信不被催眠」，請先直接跳過該人，催眠剩下的其他人。


    當然，也有許多方法可以催眠這樣的人，繼續閱讀下去就會知道該怎麼付。


    這邊僅是分享制式的催眠術。


    「真的有催眠術嗎？」


    「有人會被催眠、有人不會被催眠吧？」


    面對這樣的質問，可以回答：'
  - '[PAGE 236]


    催眠造成的身體束縛只是一種主觀深信而已。也就是說，想像力豐富、經常妄想的人比較容易被催眠。


    以常聽到的身體束縛現象，讓對方產生「對喔！」的認識；以「經常妄想的


    人」這個說法，刺激「悲劇英雄主義」、「少數派心態」。


    而且，這樣一說，如果對方是朋友團體，會出現「你可能會被催眠喔！」


    「我想他絕對會中催眠術！」的聲音。


    在圈子中，如果A是容易被其他人說：「A應該會被催眠。「A會因這樣的


