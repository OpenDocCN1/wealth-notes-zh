    ## 專業行為中的策略與誤區


    「去哪裡了？」

    「你應該很難若無其事地說：『沒去哪裡。』」


    這樣的場合，你不應該說「沒去哪裡」，而是說「和同事一起去喝酒」才對。這就是「雖然是在騙人，但我沒有說謊」的行為。


    ## 詐騙是一種專業


    想要成功詐騙，技巧知道了，但真正成功關鍵在於個人膽量、資質與骨氣。說出口的謊言，會不斷遭受質疑。


    回到湯匙彎曲的話題上，即便順利用謊言包覆了真實，也得做好覺悟觀眾會從各種方面追問。「真的是超能力嗎？」「真的是用念力彎曲的嗎？」「難道不是魔術嗎？」面對排山倒海的質問，如果只能支吾其詞，那打從一開始就不應該說謊。


    「謊話說一千遍，就會變成真話。」


    這是德國納粹黨約瑟夫·戈培爾（Joseph Goebbels）在政治宣傳時所講的名言。


    當然，無論是不利於他人的詐騙行爲，還是爲了保護自身秘密的發言，亦或是湯匙彎曲的原理本身是魔術還是超能力，皆是如此。本人有都覺得是謊言，必定會在哪邊露出馬腳，產生前後矛盾。


    照這樣推論，如果沒有反覆某種自我暗示「我所說的是真理」的覺悟，撒謊本人肯定會對說出的謊話感到後悔。


    想要成爲專業人士，謹記「不管被說什麼，都絕對不能動搖」。


    ## 詐騙就是見人說人話，見鬼說鬼話


    對話交流時，人會自然地「看著對方」。路上有時可看到小混混挑釁：「喂，你這傢伙看什麼看啊！」但若對方明顯是凶狠的暴力集團，就算被盯著瞧，小混混也不敢像這樣嗆聲。做生意也是如此，如果店長看起來軟弱好欺負，有些上班族會吵鬧：「餐點要等多久！叫店長出來！」但若是在身強力壯的暴走族所經營的海外酒吧，客人就不敢如此大聲嚷嚷。


    這樣的情況在魔術師身上尤為明顯，「等等，你的右手怪怪的喔，讓我看看。」若是遇到這樣的情況，對方肯定是認為「這位魔術師可以找碴」。


    不論自身的理想多麼崇高，我們還是會「看人行事」，所以遇到有人說「我絕對無法允許這樣的事情」，別全然相信他口中的「絕對」。


    即便是宣言自己「我就是這樣的人」，也會因不同的場合、情況而改變行動。我們身邊有形形色色的人，但表現得高高在上的人，並非打從出生就「高傲自大」。


    換個角度來想，「瞧不起你的人」亦即「他認為即便對你頤指氣使，對自己也不會有任何影響」。說得極端一點，當你手中握有手槍，任何人都會乖乖聽你的話。


    一個人的人際關係是由自己本身做決定的。沒有一位詐騙犯會在知道對方是警察後，還繼續詐騙斂財；也沒有人在知道對方是拳擊手後，還想繼續逞兇鬥狠。


    有人會偷走父母錢包裡的錢財，「即便露餉了，父母也會原諒自己」、「沒有父母會控訴自己的孩子」等等，他們是經過狡猾的計算才犯行。雖然是理所當然的事情，但這樣說的話，想以什麼樣的立場跟周遭人相處，其實取決於自己。


    這並不是你採取「平時就在身上帶把手槍」的暴力手段，而是說你可以透過計算，構築自己想要的人際關係，如受到異性歡迎、受到他人尊敬等等。


    如果魔術師表演時被觀眾「瞧不起」，有問題的是「被人瞧不起的魔術師」，而不是「瞧不起表演者的觀眾」。


    ## 「專家證實推薦」沒有用


    雖不能以偏概全，但坊間心理學溝通技巧叢書，上頭常可見到「經○○學者實驗歸納，命名為○○理論。」不知名大學教授的推薦（本書「極力」避免類似的情況）。


    對心理學、心靈術「操縱他人等關鍵字符敏感的人，光是聽聞過去知名人物的名字，就會輕易信服：『原來如此。』這也可說是一種威光皓示吧。


    我認為，不論是心理技巧還是與人的溝通技巧，實踐才是至關重要。「當人這樣做時，傾向出現這樣的行動」等等，再怎麼翻閱書籍，像這樣以一概全的方式，到底是不可能掌握人類行動。即便將「催眠術的施展方法」的書籍背得滾瓜爛熟，也不可能百發百中讓每個人都昏厥過去。


    「坐於靠近心臟位置的左側，容易讓對方感到心跳加速，進而發展成愛戀關係。」即便再熟知這類「好像真有這回事」的準則，也未必事事如自己所願。生活於熱帶叢林的少數民族說：「○○部族都是這樣啦。」還具有可信度；


    用手比手槍的姿勢，朝著關西人「碰！」一聲，對方就會配合地中彈倒下。」也多少有幾分事實。


    總歸來說，心理學等溝通技巧，欠缺揭露人類卑鄙齷齪的部分，如慾望、差別意識等。這些研究「人類有這樣的傾向」的人，是在自己的國家以自身周遭的人際關係為對象構築相關的實驗，卻打著日本人「溝通技巧」的名號，拿國際心理學家的實驗進行比較，這樣做根本沒參考價值（而且，出版這類書籍的人還是日本心理學家）。


    每個人的生長環境、現實狀況不盡相同，如果真的想要操縱他人、掌握圓滑的溝通藝術，就得具備分辨對方是什麼樣人物的判斷能力。然後，實際與他人接觸交流，經歷幾次惹他人生氣、受到他人喜歡，才能真正內化成自己的東西。


    我幸運地接觸催眠術，獲得催眠師的稱號，而且每天可以催眠數十人、一年催眠數千人，還擁有表演魔術的咖啡店，所以我才能對催眠術有所了解，寫出這本書與各位讀者分享。


    ## 立即實踐催眠術的五個「催眠SOP」


    催眠術僅是建立投契關係上的主觀深信，不會有超乎想像的效果，也不是誰都會被暗示……前面從各方面否定催眠術，但為了想要嘗試催眠他人的讀者，這邊準備了具有某種程度效果的催眠SOP範文。


    我想這些比其他催眠教材來得容易實踐，馬上就能自認為「催眠師」（再重申一遍，我並不是要肯定應當被毀滅的「催眠師」稱號）。


    首先，受術者約三人為佳。如果只有一位受術者，且深信「我絕對不會被催眠」，那不會成功；如果有十幾位受術者，當某一人表示：「我沒有被催眠。」周遭就有可能被「被催眠會很丟臉」、「也是，哪有人會被催眠啊」的氛圍支配。


    再來，不太親近的對象為佳，如當天在派對上認識的親近程度。至少，應該避免能直言不諱的好友，不要選擇親兄弟姐妹，催眠的成功率會大為提升。


    這樣選擇是為了避免被受術者先入為主認為：「這傢伙哪可能會催眠術。」抱持「這間店不好吃」的成見走進拉麵店，不管師傅端出多麼美味的拉麵，也不會感覺好吃。


    那麼，確保三位左右的受術者，再來就是第一句開場白。


    ### 催眠 SOP①


    引起注意的第一句開場範文，如下：


    「之前，我有上過催眠術課程。」


    關鍵在於不是說「我最近開始學習催眠術」，而是強調「上過催眠術課程」。提示自己砸錢學習了某事物，能引起對方的興趣：「原來有這樣的課程啊。」


    接著，對方通常都會像下面這樣回問（屢試不爽，各位試過就知道）。


    「真的催眠術嗎？」

    「有人會被催眠、有人不會被催眠吧？」


    重要的是，對方一定會拋出問句。此時，你變成是提供資訊的一方，而對方是想要資訊的一方。


    ### ◎催眠SOP②


    萬一對方面堅稱「我有自信不被催眠」，請先直接跳過該人，催眠剩下的其他人。當然，也有許多方法可以催眠這樣的人，繼續閱讀下去就會知道該怎麼付。這邊僅是分享制式的催眠術。


    「真的有催眠術嗎？」

    「有人會被催眠、有人不會被催眠吧？」


    面對這樣的質問，可以回答：


    催眠造成的身體束縛只是一種主觀深信而已。也就是說，想像力豐富、經常妄想的人比較容易被催眠。以常聽到的身體束縛現象，讓對方產生「對喔！」的認識；以「經常妄想的人」這個說法，刺激「悲劇英雄主義」、「少數派心態」。


    而且，這樣一說，如果對方是朋友團體，會出現「你可能會被催眠喔！」「我想他絕對會中催眠術！」的聲音。


    在圈子中，如果A是容易被其他人說：「A應該會被催眠。」A會因這樣的指摘，而確立在圈子內的立場。說得通俗一點，就是「被欺侮的角色」，只要自己甘願被其他人羞辱，就能在圈子中保有一席之地。這樣的狀況，A會是受術者的最佳選擇。換句話說，A自身也會努力成為「容易被催眠的人」。


    ### ◎催眠SOP③


    如果發現A或者類似立場的人物，可對他說：


    「那麼，我們稍微來試試看吧。」


    讓對方握住小東西，如打火機等等。需要伸直第一關節、以指尖壓住的物體為佳。然後，暗示：


    「請將意識集中到指尖上，在腦中想像指尖和打火機黏在一起，自己想要分開卻放不掉，在不移動指尖下用力伸直手指，有感受到手背在使力嗎？沒錯，你想要使勁放開，但指尖和打火機卻緊緊黏在一起。」


    這就是我開發的「三十秒肌肉僵直」催眠範文。


    「在不移動指尖下用力伸直手指，手背會感受到在使力。」


    其實，這是多數人張開手掌時都會有的狀態。過去催眠師的做法是，暗示「手變得像石頭一樣」、「手變得硬梆梆」後，將在場碰巧肌肉僵直的人選為「示範硬直的人」。


    我的範文僅是說明施力的方式，誘導對方進入「硬直狀態」。這樣可讓更多人體驗手掌硬直的狀態（我自認比過去高出五倍以上）。


    施展催眠術時，請觀察對方的表情變化。看到對方出現驚訝的表情，表示這個人的手掌已經僵直，可接著說：「你張不開手掌了！」


    催眠術中，後暗示非常關鍵。當對方認為變得僵直時，要馬上暗示：「沒錯，你已經張不開了！」


    在手僵直之前暗示：「張不開！」對方回應：「沒有啊，張開了。」此時你會感到無地自容吧。如果沒有出現驚訝的反應，則進入下一個的階段。


    ### ◎催眠SOP④


    「接著放掉手上的力量，感受血液慢慢回流，手掌會漸漸張不開。當你認為自己張不開時，用力張開手掌看看。」


    到這邊，多數人都會露出驚訝的表情。


    這個範文狡猾之處在於，「當你認為自己張不開時，用力張開手掌看看。」


    有注意到嗎？因為先說了「當你認為自己張不開時」，所以手掌能夠張開的話，表示「你還沒有認為張不開，就自己張開手掌了」，錯在對方沒有認真投入。術師完全沒有任何責任。


    「用力張開」間接暗示了「不努力就張不開」。


    透過這樣的語句組合，「手掌張不開的催眠術」十之八九真的會成功。


    ### ●催眠術SOP⑤


    當對方手變僵直，不用立刻解開催眠，枉費難得的機會。你可以繼續下一個的催眠。


    「手變得硬梆梆了。那麼，你的手臂能夠伸直嗎？」


    這麼一問，若對方反應「沒辦法伸直！」馬上接著後暗示：


    「沒錯，你的手臂變得更梆梆，伸不直。」


    其實，前一個的問句完全沒有提到「手臂伸不直！」


    只是問：「能夠伸直嗎？」


    所以，若是對方說「能夠伸直」，而伸出手臂，也不會有任何不自然的地方。


    「那麼，請你伸直手臂。」


    若是對方說「不能伸直」，則直接追加後暗示「沒錯……」


    對方回答「能夠伸直」時，可以這樣說來結束催眠：


    「那麼，伸出手臂，我來解開手僵直的催眠。」


    或者誘導至不同的方向：


    「那麼，伸出手臂，這次想像伸直後無法彎曲......」


    如果對方做出「伸不直！哇！」的反應，則馬上說：「沒錯，手臂也變得梆梆，伸不直！」然後，緊接著問：「能夠站起來嗎？」一連串催眠下來，對方應該會站不起來。


    這可說是零失敗的催眠方式，照這個SOP，大家可輕鬆多練習嘗試。如此一來，你就能培養「催眠術重於後暗示」的感覺，漸漸成為一位有模有樣的催眠師。


    ## 「簡易幻術」教你立刻看見幻覺


    有「讓對方產生幻覺」的催眠術。


    眼前的人看起來什麼都沒穿、把認識的人看做憧憬的偶像等等，這些都是催眠術所產生的現象。我自己在表演催眠秀的時候，也施展過幾次類似的催眠。暗示「眼前的人是」，你憧憬的偶像○○小姐！」對方竟然流淚上前握手、緊緊抱過來，讓人印象深刻。


    因為印象過於深刻，許多人會把催眠術認為是幻術的一種。甚至還有人提出恐怖的問題：「能夠催眠喜歡的女孩子把我看成偶像，跟熱情擁吻嗎？」「能夠讓對方產生大廈頂樓旁邊有地板的幻覺，一不小心墜樓下去嗎？」


    這邊我想來探討「利用催眠術產生幻覺」的真相。


    ### 首先，幻覺必須是真的存在的現象。


    就現象的觀點來說，因腦部障礙或者嘛藥、安非他命所引發暫時恍惚狀態的人，以及思覺失調症（舊稱：精神分裂症）的患者，會出現幻象、幻聽等臨床症狀。


    但就視覺的觀點來說，幻覺僅是映出光的反射，經大腦辨識、後形成可見影像。


    實際上，我自己沒有見過幻覺。雖然可以自我催眠讓身體動不了、笑個不停，但從來沒有體驗過「看見幻覺」。


    不過，「看見幽靈」、「被 UFO 抓走」等幻覺才有可能發生的現象，已經超越鬼壓床等一般現象的範疇，若將鬼壓床理解為肌肉僵直的催眠術，那麼在腦中產生「幻覺」的催眠術，也是真有可能做到的吧（雖然鬼壓床的幻覺很可能只是一種睡眠狀態）。


    但是，只靠輕度的催眠術，沒有辦法「看見幻覺」。


    想要讓對方看見幻覺，需要如同麻藥、安非他命所造成的「強烈恍惚狀態」。


    在催眠教室，「好，你能看見幻覺了」、「好，你看不見了」可看到催眠師施展類似的催眠術，但這僅是受術者習於被催眠，或者由「想被催眠」的強迫念頭，產生「好像看見」的感覺而說出「抽象事物」。


    有鑑於此，我想出了暗示文「簡易幻覺（Easy Phantasm）」，任誰都能簡單獲得類似讓他人看見幻覺的效果。


    就想法上來說，如果打算用作控制情感的暗示，則需留意大多數人的共通感受。「這支筆很有意思！」笑容滿面地說，對方會跟著笑出來：「是啊，好像很有意思。」


    這是利用跟著笑的情感傳達。


    同樣地，「這支筆真的很棒耶！」飽含感情這麼說，對方就會表示：「的確看起來很棒。」


    這類等於「將對方看成憧憬人物的催眠術」、「喜歡上某人的催眠術」。暗示文如下面所述。


    將過去的說法：「數到三清醒後，你會把眼前的人看作偶像田中先生（假定）。一、二、三！」改成：


    「數到三清醒後，你會對眼前的人產生類似遇到偶像田中先生的情感，感到臉紅心跳，覺得非常害羞。一、二、三！」


    不論是被哪一種說法催眠，不覺得都會發生相同的現象嗎？只要練熟這個傳達情感的暗示，便能獲得類似幻覺效果。


    我把這個想法命名為「簡易幻術」，數年前於日本發售成DVD。比如，「看見腳邊有許多蟑螂！」的幻覺暗示，說成：「數到三清醒後，你會覺得腳邊好像有很多蟑螂，內心感到非常害怕。」即便後面加上「看不見」的敘述，仍舊有相同的效果。


    「數到三清醒後，腳下出現一大片絨毯，上面每個接縫都看起來像小蟑螂一樣噁心，整個人感到毛骨悚然。一、二、三！」即便描述成「看見絨毯」，對方清醒後，還是會嚇得跳上桌子上不願下來。


    「雖然想要嘗試被催眠，但我不怎麼相信能看見幻覺。」這樣想的人請務必試試「簡易幻術」。


    反覆數次後，真的受術者興奮地說：「我看見了！」


    ## 自我催眠、自我暗示有極限


    「能靠自我暗示激發潛能、控制情感嗎？」這也是我常被問到的問題。


    偶爾遇到擺明是來賜餓的客人：「催眠我看看看啊！」我會淡定回應：「你先自己握拳，如果你深信手會變僵直，就會變得硬梆梆。你自我暗示成功後，我再接著下面的催眠。試試吧。」但這只是把責任轉嫁給對方，跟自我暗示相去甚遠。


    如同前面提到，在不曉得無酒精啤酒的包裝標籤被調包的情況下，許多人真的會因此喝醉，哪天店家擅自更換標籤，就變成了日常上的暗示了。


    這次直接拿出無酒精啤酒，說：「我現在要催眠你，把這瓶無酒精啤酒想成是普通的啤酒。數到三，這會變成普通的啤酒，喝下你會醉醺醺。一、二、三！」就變成了催眠術。


    而自我暗示是，自己買瓶無酒精啤酒，放到桌子上喃喃自語：「這是瓶普通的啤酒、這是瓶普通的啤酒……」


    可想而知，少有人真的因此喝醉。換句話說，自我暗示得具備足夠的深信能力，才有辦法實際做到。假設「真的做到自我暗示」，這跟中了催眠術的人相同，只是當事人「自身相信自我暗示」。


    比如，你看著桌上無酒精啤酒，喃喃自語：「這是瓶普通的啤酒……」同居的女友看得傻眼，趁你稍微去上廁所的空檔，一時興起惡作劇，瓶子保持無酒精的包裝，但把內容物換成普通的啤酒。


    上完廁所回來，你繼續低喝：「這是瓶普通的啤酒！」然後喝下去，你會因為酒精作用而臉龐泛紅、心跳加快。


    此時，你會認為：「太棒了！成功了！我做到自我暗示了。」


    後來，因為你相信了自我暗示，即便女友沒有調包內容物，自己對著無酒精啤酒低喃「這是瓶普通的啤酒」再喝下，真的會發生酒醉臉紅的現象。


    大家隱約體會到自我暗示的極限了吧？


    ## 催眠原理可運用到實際生活


    了解自我暗示的原理後，「喔，原來如此。」那麼，自我暗示對我沒有效，因為我自己又不相信。」許多人會導出這樣的結論，但這是非常可惜的事情。


    「店家販售裝成普通啤酒的無酒精啤酒」、「女友偷偷掉包無酒精啤酒」等，你必須碰到這樣的情況，暗示才可能成功。


    順著本書的內容讀下來，或許會覺得這是理所當然的事情，但喝無酒精啤酒而喝醉，說是魔術戲法也不為過。實際上，這也經常發生在日常生活上。


    學習催眠術，掌握施展方式，並經歷失敗的經驗，作為催眠師從事講師的工作，這樣真的非常可惜。


    你現在掌握催眠術的真相，了解真的有人會中催眠術、被催眠的理由以及催眠的原理，經過一番計算謀劃，你應該能夠引發「把無酒精啤酒說成普通的啤酒」的現象（這並不是要你經營販售偽裝無酒精啤酒的餐飲店）。


    使用的方式有好有壞。


    如何讓無法挽救的商品好看大賣、怎麼吸引心上人的注意，讀完本書之後，應該都有能力「謀劃」。


    算計「感到棘手的對象想要什麼？」「提出什麼條件對方才會滿足？」等等，還可以輕易操弄對方。


    這樣才是真正的「善用催眠術」。


    ## 克服失敗挑釁是成功關鍵


    想要控制自身內心，根本想法必須要改變。


    簡單講就是「不向對方展露惡意」。


    洞察對方的人性、欲求以及他想要扮演什麼樣的角色，不輕易讓自己生氣或者嫌惡對方。


    施展催眠術時，對方表現挑釁的態度：「能夠催眠我，你就試試看啊。」表演魔術時，不願服輸小學生常說：「這個我知道」、「之前在電視上看過」等等，這些都是再正常不過的情況。


    當然，不能一被挑釁：「你就試試看啊！」自己就氣憤：「誰怕誰，一決勝負！」這樣即便真的被催眠了，對方也不會說：「我服輸了。」


    「這個我知道。」「你絕對不知道。」不對峙下去，魔術秀只會不了了之。


    演變到最後，觀眾要求綁住雙手雙腳，裸露全身表演魔術，不但表演會以失敗告終，表演者也會顏面盡失（我曾有過被說「右手很可疑、袖子很可疑」，最後裸露上半身繼續表演魔術的經驗，那真的是愚蠢至極）。


    「能夠催眠我，你就試試看啊！」這樣說的人，只是想要展現「我不會被催眠」。


    「這個我知道。」這樣說的小學生，只是想要主張：「大家都被騙得團團轉，我才不會被那種伎倆騙。」


    想要演出滿足所有人的娛樂節目，除了想辦法滿足這樣的觀眾，還要讓表演秀完整落幕。


    即便對方莫名採取敵對的態度，也要試著理解他有自己的立場、身邊有跟著一起來的人，或是他想要展現上下關係（對魔術、催眠術表現敵視的場合，基本上是想要展現自己優越於表演者）。


    表演者需要洞察對方心情，比如在高速公路上遇到加速超車的車輛，不是破口大罵「到底會不會開車啊」，而是設想「他可能遇到親友病危吧」，只要你這邊充分發揮想像力，就不會被敵對的態度惹著鼻子走。


    施展催眠術時，必須抱持著像這樣有如受虐狂的思維才行。


    ## 【一、結論】


    ### 終極的催眠技巧


    我從小就喜歡「不可思議的東西」、「娛樂他人的事情」，所以才開始接觸魔術、催眠術。


    起初，我跟其他人一樣疑惑：「真的有催眠術嗎？」而敲響催眠教室的大門。然後，我抱著「能夠催眠我，你就試試看啊」的心情，站出來挑戰被催眠。


    學到一定程度之後，某個晚上我找酒吧的客人嘗試，「要不要試試手變僵直的催眠術？一、二、三！」


    然後，那位客人邊揮舞拳頭邊緊張地說：「哎！張不開！快點幫我解開啊！」


    若這是吉他教室，情況會是如何呢？


    當天學到一點皮毛就跑到酒吧表演，被數落：「彈得真爛。再加點油吧。」


    吉他不是一天就能學起來的技術。不過，催眠術馬上就能發揮效果。


    這是因為催眠術不是技術、也不是話術。

