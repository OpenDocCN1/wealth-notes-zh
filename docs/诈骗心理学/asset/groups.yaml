    這個催眠成功與否端看「喜歡上花瓶這件事，對受術者來說是否有好處」。舉個不乾淨的例子，假設暗示「喜歡上眼前的寶貝」，是不會有人真的上前抱住寶貝的，不論受術者是否被深入催眠。反之，若是暗示「喜歡上眼前的鑽石」、「喜歡上眼前的金塊」，受術者就容易接受催眠。


    換句話說，在施展喜歡上異性的催眠時，對方的容姿、其他條件，會對「喜歡上的對象是否重要」產生某種程度的影響。


    不論催眠再怎麼順利，若不符合對方的喜好，長相不夠好看，「喜歡上我」的催眠仍舊不會成功。


    嗯，這真的是毫無夢想與希望。


    雖然提示超出外貌不足以上的好處，能打破這樣的情況，但可以肯定的是，外貌是放在天秤上的砝碼之一。


    其貌不揚的人想要靠催眠術受歡迎，難易度會相對提高許多。


    「什麼嘛，那我不可能了……」內心失落的你現在放棄還太早。


    本書最後準備了讀者限定的特典——「喜歡上我」的催眠暗示文。


    有興趣的讀者可連結網址（http://retp.jp/birdie）免費下載。因為是嚴禁濫用的技巧，請各位自行斟酌使用。


    ### 手機保護套讀心術


    光臨咖啡店的客人，多會把飲料與智慧手機放在吧檯上，看我表演魔術秀。現在不分男女老少，基本上是人手一台智慧手機（其實，筆者現在還是用舊式摺疊手機）。


    智慧型手機的各種配件，現在隨處都能購買，由智慧手機上的保護套，可以窺看使用者的個性。


    這是相當容易實踐的讀心術。因為使用者是從成千上萬的種類中，特意選出現在使用的保護套。保護套的顏色會是該使用者喜歡的顏色，套上的人物圖案會是該使用者喜歡的角色。


    有趣的是，大部分的人沒有特別意識這件事，對選用藍色智慧手機保護套的人說：「你喜歡的顏色是藍色吧？」對方會驚訝反問：「你會怎麼會知道？」


    或者不用直接點明，譬如看到保護套又舊又髒，「你很念舊，會一直使用自己喜歡的東西，直到不能用才換新，像是錢包之類的……」說些乍聽之下好像沒有直接關係的部分；如果看到客人持有最新型的智慧手機，「一有新產品推出，你會想要搶先他人嚐鮮吧？」諸如此類，每次都能讓客人大為驚訝。


    縱使只是客人剛好更換新機，只要說得煞有其事就行了。


    當然，這不僅限於智慧手機，服裝打扮同樣適用，舉凡手錶、外套、飾品等，稍微留意一下，就能從對方身上所有的物品「讀心」。


    當客人掏出錢包，撇見裡頭的整備中心掛號單時，「身體哪裡不舒服嗎？關節……是腰在痛吧？」便能像這樣展現讀心術。


    這稱為「熟讀術（hot-reading）」，是知名算命店常用的手法。


    店家會先安排客人進入等候室，觀察對方的樣子，揣摩需要的資訊。看到對方戴著價值數百萬日圓的手錶，不會明說「愛慕虛榮」，而是說「你是遇到自己喜歡的事物，會不惜花錢投注熱情的人吧？」


    ## 「鏡像效應」的真相


    熱讀術的要點就是，說出對方希望聽到的話。


    所謂鏡像效應，是指對方喝飲料時，自己跟著喝飲料；對方搔頭時，自己跟著……恍如鏡子映照般模仿動作，能讓對方湧起親近感。這是許多職場心理書籍常使用且容易實踐的簡易心理技巧。


    其實，這技巧有多少效果不好說。光靠單純的模仿動作，並不會讓人感到「嗯……怎麼說呢？我就是覺得有一股親近感。」更不會讓女性產生前擁抱的衝動。


    即使對方說「我們之後再約吧」，也難以判斷這是不是鏡像效應的功勞（不過，對實踐該技巧的人來說，大概會覺得真的有效果吧……）。假設恍如鏡子映照般模仿對方的動作，真的能夠帶來效果，男性在追求女性時，應該要穿著女裝吧。


    就催眠術的觀點來講，同調行為應該運用於對話上。


    講話非常快速的人碰到講話蝕吞緩慢的人，內心會焦躁難耐。


    在催眠暗示對方時，施術者講話愈快，受術者也會跟著加快說話速度。換句話說，不是施術者配合受術者，而是誘導受術者跟上自己。


    如果說催眠術是在建立投契、信賴關係的狀態下，由施術者以飽含情感的說法（如說話快速、臉帶微笑、生氣語氣）誘導受術者做出同調行為，那麼鏡像效應則是完全相反的情況。


    對方講話快速時，自己跟著加速說話速度；對方高興談話時，自己也跟愉快地搭話；對方在說某人的壞話時，自己就邊點頭同意邊批評那人的不是。如此一來，你們之間就會形成新的信賴、投契關係。


    除了對話之外，文字也具有類似的效果。


    當對方在 LINE、Facebook 等平台上撰寫推文，回覆時試著與對方的訊息風格同調。


    比如，「今天天氣真好！！！我要不要來穿個迷你裙呢（笑）」「你看到這篇報導了嗎？太離譜了！」「那個明星居然說這種話，真是丟臉到極限。」「好棒！一定要去看現場！」


    樣的短訊後打算回覆「真的是好天氣耶，好想看妳穿迷你裙的樣子。」


    此時，若想與對方的訊息風格同調，引發文字的鏡像效應，回覆應該改成「真的是好天氣耶！！！好想看妳穿迷你裙的樣子（笑）」。


    在日本，常見的「（笑）」還有其他表達方式，像是「好想看妳穿迷你裙的樣子」w」使用「w」代表「樣子笑」不加括弧的形式，或者「好想看妳穿迷你裙的樣子w」使用「w」代表笑的形式。


    需要與對方同調的地方，不是「真的是好天氣耶」的意見，而是「！！！」和「（笑）」的部分。


    如此一來，對方讀到訊息時，會覺得「我們說話的調調一樣」，愈聊愈開心，產生新的信賴關係。


    鏡像效應是在對方沒有注意到的情況下，帶出「莫名的親近感」。如果看到對方喝飲料的動作，自己才慌張伸手拿起杯子，只會讓對方感到關鍵不在「喝飲料」的行爲，而是與「行為風格」同調，比如對方是一口氣暢飲還是用吸管慢慢啜飲。


    在棒球場的觀眾席上，大家同樣是來支持自己喜歡的隊伍，但想要「坐著靜靜聲援的人」與「站著敲打喊話筒的人」好好相處，基本上是「不可能吧。


    在「聲援棒球」的形式上同調，就能產生所謂的鏡像效應。同樣都是會站起來大聲加油，興奮地敲打喊話筒或者出聲喝倒采，即使兩人支持不同的隊伍，心中也會產生好感，「真是場不錯的比賽。」


    ### 禁忌的鏡像「呼吸」


    在配合對方的行為上，「呼吸」同樣是重要的要素。


    催眠術經常活用「呼吸同調」。


    比如，魔術者配合對方的呼吸來暗示。在對方吐氣時，邊說「呼～地放掉力量。」在吐完氣換成吸氣的瞬間，暗示「你的身體漸漸僵直變硬！」


    這僅是「配合對方呼吸」的方法，不足之稱為禁忌之術，但若是想要操弄對方，必須意識「以自己的呼吸影響對方」。


    舉個簡單的例子吧。


    假設跟朋友一起從外面回到房間，你馬上坐到椅子上，「呼——」大口吐氣。此時，在一旁的朋友也會跟著吐氣：「有這麼累嗎！」


    請把這想成是操弄對方情緒的呼吸


    換句話說，明顯向對方傳達自己的呼吸時，對方的情緒狀態會跟著「受到影響」。


    想要讓對方情緒亢奮，就在對方的耳邊急促呼吸（請自行判斷情況適不適合這樣做）。用於暗示的場合，請先面對面而坐，配合對方的呼吸。


    一開始可以先用言語誘導對方。


    「請先緩慢深呼吸。」然後，注視對方的眼睛，讓對方的肩膀動作對上自己的呼吸。


    接著，稍微超前對方的動作，做出些許誇張的呼吸動作，如聳起肩膀、漲起肚子等。


    這邊僅是「稍微超前」而已，不能和對方的呼吸有過大的落差。


    當對方的呼吸追上自己後，再稍微加快呼吸速度。只需要大約五分鐘的時間，就能成功讓對方的呼吸比平常快上許多。如果順利，甚至還能讓對方上氣不接下氣。不過，這屬於高難度的技術，一開始可找朋友試試，在不告知內容的情況下進行練習。


    在魔術界中，有個演出名為「心理強選（Mental Force）」。比如，從紙牌中抽出紅心K、黑桃7、方塊A、紅心4、方塊9，按照這樣的順序排序五張牌。「請你選一張你喜歡的牌。」當魔術師這樣一說，大部分的人都會選紅心4，非常神奇的現象。為什麼會是紅心4呢？因為紅心K是唯一的頭牌，黑桃7是唯一的黑色牌，方塊A太過顯眼，而排在最右邊的方塊9又讓人覺得不安（？），所以大部分的人才會選擇平淡無奇的紅心4。


    這項演出已經改成適合性格保守的日本人，但原先的戲法是出自國際魔術界有著「教授」綽號的魔術師戴·福農（Da Vernon），此魔術戲法又稱為「心靈強選（Psychological
    Force）」。


    雖然前面列出各種「不選的理由」，但還是會有人「刻意這樣選」，所以並非百分之百都會說中。


    這個現象的真相是「在平淡無奇的氣氛下選擇」，如果魔術師宣示「我絕對會說中你選擇的紙牌」，出現的選擇又會是千變化吧。


    在催眠他人時，不會有人明說「我要讓你丟臉」；在欺騙他人時，不會有人聲明「我現在要來騙你」。詐騙犯最在意的是「氣氛」，若讓對方提起警戒，那對方就不會「受到當下的氣氛所影響」。


    無論多麼幼稚的戲法、多麼明顯的詐欺，只要對方受當下的「氣氛」影響，就都能夠成立。


    曾有年輕魔術師來店向我「討教魔術」，當時我拿出一副五十二張全是紅心A的牌組，跟他說：「你試著用這副牌對沒看過『陰魂不散(Ambitious Card)將客人抽出的紙牌永遠變到第一張的魔術）』的客人表演。」


    當然，只要紙牌全部翻成正面，手法馬上就會露餡，但若能營造好當下的氣氛，能夠不讓客人起疑：「這副牌有問題，讓我檢查一下。」


    「他是很厲害的魔術師」、「現在要表演非常高明的魔術」，只要讓客人心中浮現這樣的意識，就能讓客人不疑有他。


    這樣的手法用在魔術上還沒問題，但若用到斂財宗教，或者擾亂人生的詐騙行銷，那可是教人恐懼萬分。


    ## 讓對方答應要求的話術


    想要請別人幫忙，假設可以分為「拜託幫忙」的第一階段，與回答「不方便」、「好啊」的第二階段。


    因為是「你開口要找人幫忙」，因此決定權在對方，對方有可能拒絕，不會事事如你所願。


    那麼，現在轉換觀點。


    大家應該都有過尋求他人幫忙的經驗，其實只需稍微計算、理解、運用技巧，便能大幅增加解決事情的效率。


    比如，想要請某人幫助時，表示：「我明天有話跟你說，能留點時間出來給我嗎？」


    「他找我有什麼事情？」對方心中會感到不安、期待，追加了一個多餘的思考階段。


    「如果有話要說的人是主管，部下會感到不安「我該不會做錯了什麼事吧？」所以隔天聽到「能請你幫忙我搬家嗎？」「什麼嘛，只是幫忙搬家啊。還好沒事。」「不難想像部下會鬆了一口氣，同時爽快答應吧。


    追加一個思考階段的做法非常有用的，對異性表示：「我明天有話跟你說。」對方就會馳騁思緒，「不會是要向我告白吧？若真的被告知該怎麼辦？要拒絕他嗎？」


    隔天，「其實，想要請妳幫忙寫大卡片。「聽到這樣的話，「什麼嘛，不是要告白啊？」心中難免有些失望，怦然心動的感覺消失，好像缺少什麼似的。


    基本流程是，「應該是這樣吧？」先讓對方擅自想像最佳狀況或最壞狀況，然後再背叛他的期望。這就是反轉立場的訣竅。


    販售商品的場合，遇到看起來不打算花錢的人，老闆可以營造不妥協的氣氛，「我是不會砍價的，你就自己看著辦吧。」


    如此一來，對方內心就會追加一個思考階段，「雖然沒有什麼希望，但老闆還是可能算我便宜一點。」讓看起來不打算花錢的客人多加遐想，「老闆會算便宜一點？還是不會算便宜一點？」


    追加一個階段的時間不可過長，短短的即可，但也不可以過短。時間會根據當時的情況而改變，跟感覺、對方的心情也有關係。


    稍微實驗一下，打開LINE等通訊軟體，傳送訊息「下次見面時，我有話想跟你說。細節到時候再談。」


    僅僅只是在傳達前穿插一個思考階段給對方，就能讓你掌握主導權。


    就催眠術的觀點來說，這是因為「不安會深化恍惚狀態」。催眠術包括兩個面向,「極度緊張」與「極度放鬆」都屬於催眠狀態。


    若說「完全信賴你」是對你產生興趣,「對你抱持懷疑」、「對你感到害怕」則是代表對方已經受到你的影響。


    「給我做」、「做就對了」當我們被他人強迫,原本想做的事情也會變得不想做。放到「利害系統」上看,不想做是因為我們極度想要避免他人得利。簡單舉個例子。


    「請和我交往」、「好啊」這樣的告白情境,說穿了,其實只是「自身利益」勝過「對方利益」而已。


    所以,前面提到的「穿插一個思考階段」是非常「狡猾」的做法,先讓對方意識「想要知道」、「想要聽聞」、「想要迴避預期的最糟狀況」等,再提議怎麼做可以達成、迴避，讓對方覺得接受提議對自己有
    lợi。


    不讓對方認為自己是被迫受害，情況會變得相當有趣。


    對購買音樂會門票的客人，說：「不確定還有沒有位子，我幫您確認看看。」「讓客人想像『去不成』的最糟情況，接著再說『最後一排還留有座位』，客人會覺得『迴避損害是利益』，心態轉為『還有位置就好』。


    如果售票員直接表示：「剩下的位置就只有最後一排了。非常抱歉。」客人只好將就前往音樂會，這兩種情況有著雲泥之差。


    這項方法的濫用例子，有「和解金」「詐騙。


    先敘述「親人遭遇事故」的事實，讓被害人聯想「警察」、「監獄」、「判刑」、「賠償」、「殺人」等最糟的情況。


    接著，誘導被害人意識「迴避損害是利益」。


    詐騙犯先掛斷一次電話，讓被害人不斷想像最糟情況，再致電「對方願意談條件和解」，騙取被害人能夠支付的金額。


    此時，對被害人來說，付錢變成利益。如果一開始就提「支付和解金」，會讓被害人起疑：「真的嗎？不會是詐騙吧？」


    ## 魔術、催眠和戀愛，都需精巧構思安排劇本


    我經常把催眠術比喻成電影。


    催眠術可想成是一連串暗示的電影。


    不論是催眠術從最初到最後的演出，還是從愛慕某位女性到她喜歡上自己的發展，抑或是拜訪推銷到購買產品的過程，都可說是類似的情況。


    每部電影都有主題。


    主題可能是「感動落淚」、「恐怖尖叫」、「引人發笑」或者「戀愛情結」。


    透過暗示讓人哭泣或者給予恐懼，就是製作電影一樣，把自當作電影的導演、腳本來構思。


    前面穿插許多下流的黃腔，接著安排「來吧，傷心落淚吧！」的感動場景，


    這需要非常高度的構思。才剛看完英雄與邪惡帝國在外太空的對決場景，下一幕很難接上鄰近流氓的日常情景。


    另一方面，想要讓他人看得熱血沸騰，卻全程安排功夫英雄的打鬥場景，不用多久觀眾就會看膩，但也不能前面兩個小時連續播放日常情景，這只會讓滿心期待功夫打鬥的觀眾百無聊賴。


    如果電影的主題是「感動落淚」，製作時就得計算怎麼切入主題、哪邊要進入高潮、在哪邊刺激淚腺。


    最為重要的是「抓往人心」。


    表演魔術秀的場合，客人買票進場都是「想看神奇的演出」。


    然而，一開始卻演出：「這邊有四張A。確認一下，一張、兩張、三張、四張……然後，這邊有四張老K。一張、兩張……」


    這是置換A與老K的經典魔術《R2R2》，但若一開始選擇這個表演，會讓觀眾浮現疑問：「這個人真的能表演神奇的魔術嗎？」


    第一齣演出必須「抓住人心」。


    我是什麼樣的人？想要把觀眾怎麼樣？想要讓觀眾喜歡表演嗎？想要讓觀眾看得盡興嗎？


    這些答案，得在魔術表演、問聲招呼或者最初對話中展露出來，否則這場秀可能就會以失敗告終。


    如果要演出催眠術，就表現出「我是高明的魔術師」；如果要表白，就表現出「和我交往，你會有好處」，務必在一開始就這麼做。


    魔術師從口中變出紙牌做為開場，演出同時傳遞的訊息是「我是有趣的人喔！接下來的表演會讓你們又驚又喜」，是非常出色的「抓住人心」。藉助從口中拿出紙牌，讓客人想要期待後面的魔術，興趣濃厚地觀賞演出。


    當然，除了魔術現象之外，「外表」、「地位」等各種要素，也能發揮「抓住人心」的作用……


    「抓住人心」後，接著是「營造高潮」。


    營造高潮首先得引發數起現象。若是培養兩人關係，就先多約會幾次；若是販售商品，就先平淡介紹商品的優勢、好處，接著再提供決定性的事物，炒熱當下的氣氛。


    當然，這個決定性的事物會因狀況而變，但如此用心構思，肯定能帶來預期的結果。


    想要擄獲異性的芳心，達成「對方喜歡上自己」，至少要有「抓住人心（第一印象）」、「營造高潮」的構成，才有機會迎接結局。


    二十四小時連發「我喜歡妳」、「我愛妳」的訊息，就像是一場無聊的電影，對方一點都不會想要理你。


    ### 魔術技巧「多重解釋」


    遇到不確定、不確實的現象，學會魔術技巧中的「多重解釋（Multiple Out）」，有非常大的幫助。


    暗殺者最初一招未能斃命目標，會繼續祭出第二、第三招——雖然實際上沒有這麼誇張。


    如果說前面的魔術師選擇類似「複數故事情節」，像是遊戲書（Game-Book）④的中途選擇，那麼多重解釋就相當於「多重結局」。


    與遊戲書、電玩遊戲最大的不同是，不讓對方察覺「有其他結局嗎？」若最後是歡樂的結局，就得讓對方認同「只有這樣的結局啊。」講得極端一點，「請想一個你喜歡的數字。」表演者這樣問，而對方回答：「3。」


    然後，表演者自信說道：「跟我猜想的ㄧ樣。請看ㄧ下你眼前杯墊的背面。」誘導對方翻開杯墊。結果，背面上頭寫著「你選擇了3」—｜。


    雖然這例子過於極端，讓人不由得搖頭，但大致的情況就像這樣。表演者胸口袋裡放了寫有「你選擇了1」的紙片，房間的扁額後面寫有「進入這個房間的人，只會選擇2」。


    當然，作為魔術表演，會以極為巧妙的說詞、手法包裝，不讓人察覺「可能還有其他的結局」。


    重點是，給予對方選擇項目時，得事先準備好雙重、三重結局。


    邀約女性一同看電影，要先準備好戀愛、動作、恐怖電影等三種票券再約（雖然現在少有人握著電影票邀約女性的光景，總之勉強想像一下吧）。當對方說出想看的電影，「其實，我手邊剛好有那場電影的票券。」這就是多重解釋的思維。


    進一步，晚餐也可以事先準備中餐、西餐、日本料理等三種選擇，再事先預約好飯店，見面後可先問：「妳想要一起去用餐還是看電影？」


    如此一來，就有六種多重解釋。


    除了男女約會之外，報價時也可事先準備不同的定價單，再視客戶公司的財務狀況來提示不同的定價單，透過有意識地準備結局，就能宛若使用超能力般，讓事情順利推進下去。


    ②泛指自以為是活在自己世界，做出自我滿足的特別言行，青春期特有的價值觀。

    ③結合了書與遊戲的因素，讀者可自己選擇中途的情節，最終達到不同的故事結局。典型的情節岔口如「如果你決定回家，請翻到第4頁；如果你決定等待，請翻到第5頁」。

    ④ Game-Book（遊戲書）：結合了書與遊戲的因素的互動小說。

