    # 克服失敗挑釁是成功關鍵


    想要控制自身內心，根本想法必須要改變。


    簡單講就是「不向對方展露惡意」。


    洞察對方的人性、欲求以及他想要扮演什麼樣的角色，不輕易讓自己生氣或者嫌惡對方。


