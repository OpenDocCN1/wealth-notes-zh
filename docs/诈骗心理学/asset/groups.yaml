    重點在於「我被催眠的話」，這樣設想就等同於預設自己會中催眠術。「我大概會被催眠吧。我好怕被催眠後，不曉得會被怎麼樣。」「這樣思考的人容易中催眠術(建立催眠術的投契關係)。


