    # 日常生活中潛藏的「間接暗示」


    如前所述，間接暗示具有無比強大的力量。舉例來說，比起直接表示喜歡對方，由朋友間接傳達「他好像喜歡你喔？」更能讓對方產生意識。待意識產生，只需稍微溫柔體貼，對方會在意：「他是不是喜歡我？」相較於高喊「我是有錢人！」秀出一疊鈔票的行為，在結帳時撇見錢包裡的鈔票，或者親見手腕上的高檔手錶，更能讓對方留下強烈的印象，這就是「間接暗示」（這是我自己的定義，其他催眠師可能有不同的見解）。簡單說就是「讓對方擅自推測現象」。在催眠界，催眠師不會明說：「你不管怎麼努力都站不起來！」而是說成：「你」（不管是不是真心這麼想）。'
  - '[PAGE 100]


    「你努力站起來看看。」


    後者的說法能間接傳達：「你需要用力才能站起來」。


    在日常生活上，尤其是商業買賣上，間接暗示可說是隨處可見。


    「嚴禁濫用！」暗示「這商品厲害到可用來为非作歹」；「結束大拍賣」暗示「我們準備收攤了，快來搶便宜的優質商品。」


    我們身邊到處都有類似的間接暗示，若能理解並知曉如何運用，你對各種事物的看法也會為之一變。


    # 使對方自己發現、主動聯想


    前面已有提過，在我自己經營的咖啡店，吧檯後面的電視會不斷播放我上電視的節目。來店的客人看到這個節目，首先心理會預設「老闆是上過電視的高'
  - '[PAGE 101]


    手」。


    這是也是一種間接暗示，藉助威光效應來建立投契關係。


    間接暗示追求的，是「讓對方自然察覺背後隱藏的真正用意」。反過來說，也可想成是「因為沒有人知道真正用意是什麼，所以不會失敗。『


    低頭輕聲說「喜歡你」稍微讓對方聽到，就是出色的間接暗示。不難想像對方會非常在意：「他喜歡的人是我嗎？『


    # 「間接暗示」的強大工具隨手可得


    講到「悄悄話（呟き＝推文、貼文）」，應該有人注意到了吧，我們身邊就可以任意間接暗示的強大工具。


    那就是 Twitter、Facebook 等社群網站。'
  - '[PAGE 102]


    「Paper」不是針對特定人物談論，能讓所有追蹤人看到推文訊息，是強大的間接暗示工具。


    你現在可以馬上針對追蹤人，進行間接暗示的實驗。試著在「Paper」上發文「上週遇到的傢伙，真是沒禮貌」。上週與你碰過面的追蹤人看到這則訊息，都會不由得擔心：「我是不是做了什麼失禮的事情？」


    我實際在「Paper」上這樣發文後，隔天就有收到五位追蹤人「我是不是不小心冒犯您」、「前幾天受到您的關照了」等訊息。


    這就是間接暗示的效果。


    這也可以簡單運用於戀愛上。


    發文「每次想到那個人，我就覺得心臟跳得好快」，能讓其他人覺得「他是在喜歡我嗎？」前關注你的動態，接著你再推文「我想我還是放棄那個人吧」，此時就會有許多人主動敲你聊天。


    這比市面上的戀愛守則更有效果，而且容易實踐。不僅限於戀愛，不論是商業買賣還是欺騙他人，沒有比社群網站更強大的自動暗示工具。'
