    # 催眠術與低飛球技巧


    催眠師所需要的能力，是洞察心理上微妙的數值變化，了解對方當下為何種數值。


    只是透過學習心理學，掌握「這個現象是根據這項理論」的結果論，對催眠技巧完全沒有幫助。


    「低飛球技巧（low-ball technique）」，是先提出簡單的條件讓對方吞下，後面卻突然改變，讓對方不好否定已經做出的承諾，巧妙利用「事先取得承諾請求法」的商談技巧。


    低飛球（low-ball）是設想别人一開始容易接受的條件，比如，店家先以「便宜！大拍賣！」等口號吸引客人上門，最後才在結帳時說：「這幾樣商品不是優惠對象。」「在成人影片，中，風俗店會用「看看小姐也行」之類的說詞來拉客'
  - '[PAGE 172]


    (勸誘方式純屬想像虛構)。


