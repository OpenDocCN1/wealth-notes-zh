    在社群網站發達的現代社會，個人情報、喜好、興趣幾乎無所遁形。稍微聊一陣子，就能套出許多情報。


    > 「喜歡某某偶像」、「經常去星巴克」……等。


    這很簡單吧？


    欺騙者只要說「我之前見過那位偶像」，對方就會對你感興趣；說「曾在星巴克工作過」，就能贏得對方的信賴。


    雖然聽起來像是理所當然，但說穿了就是藉助威光的對話罷了。


    > 「我有很多演藝圈的朋友，跟○○也認識喔」等等，你曾過像這樣想要引起對方興趣的愚蠢搭訕方式吧，如果對方回說「○○是誰？我不認識」，那就失去意義。


    套用對方明顯感興趣的事物，由欺騙一方改變說法（說謊）來建立投契關係。


    這就是「詐騙」的真相。'
  - '[PAGE 91]


    # 迎合對方相信的事物來建立「威光」


    「催眠療法」有這樣的療法。我認為，利用催眠術從事治療、醫療行為是很危險的（需對病患負起責任），自己實在做不來。如同前面所說，催眠術不過是一種主觀深信、想要相信的心情而已。


    當然，就「病由心生」的觀點來看，催眠療法或多或少是有效果的。例如壓力造成胃痛、煩惱過度造成頭髮稀疏等等。可是，實際運用催眠來治療，那就是另外一回事。


    雖說如此，催眠療法還是有存在的意義。


    對於「深信」自己中了暗示的患者，這是非常有效的療法。


    比如，有個病患說「我以前被不好的催眠師給催眠，之後每次喝熱湯都會吐出來」（真的有類似症狀的患者）。


    想要排除這位病患的症狀，只能靠催眠師。'
  - '[PAGE 92]


    這與是不是催眠術所引起症狀沒有關係（就深信不疑這點來說，所有的事情都可說與催眠術有關係，但情況沒有那麼單純……），重點是當事人認為是催眠術引發病症。


    遇到認為自己「被惡魔附身而感到頭疼」的人，必須請驅魔師出馬。


    而且，這位驅魔師還得煞有其事：「我至今驅除了數百隻的惡魔……原來如此，你的確被強力的惡魔附身了，但交給我我就沒問題了。」


    換句話說，對於相信惡魔的人，不論請來多少位「科學權威的學者」，也不會有效果出現；對於相信催眠術的人，氣功高手也無法引起任何現象，完全不會有任何感覺。


    這就是「對於自己相信的東西，會產生威光效應」。


