    # 悲劇英雄主義


    會對自己尊敬的人提出不合理的事情，或對小孩講出無理的要求。

    對方明顯幼稚、傲慢的舉止，背後肯定潛藏「希望被如此看待」的願望。能否捕捉到背後的訊息，搶先給予肯定「你是這樣的人」，將是對方決定需不需要你的重要關鍵。

    主動接受對方的理想自我，可使對方認為你是重要的存在。


    「悲劇英雄主義」是我自創的用語。

    「英雄主義」是指，醉心懲惡揚善的故事情節、崇拜英雄的心理，而悲劇英雄主義則反指「憧憬悲劇主角的心理」。

    這樣傾向較常發生於女性，你應該遇過高興說著「我男人運不好」、「我想結婚但結不了」的女性吧？'
  - '[PAGE 126]


    # 嚴禁濫用！催眠女性這樣說


    這邊來傳授我在催眠女性時的秘術。


    不過，這些女性的心理有些複雜。


    有些人想要主張「悲劇英雄主義」，但本身卻抱有差別意識，被條件比自己差的人說：「妳的男人運真差。」會想出言反駁：「至少比妳好。」


    我個人認為，「差別意識」的影響勝過「肯定需求」的影響。所以，遇到這類型的人，請幫她準備好「能夠間接主張」的有利情況。


    做法有些複雜，但用法相當簡單。


    催眠對方時，只要說「會被催眠的人，大多男人運不好。」如此一來，她被催眠後，可以順水推舟主張「我是少數派」、「我是悲劇女主角」。'
  - '[PAGE 127]


    「那麼，我接下來要對大家施展催眠術。很多人或許認為，會中催眠術的是思想單純的人，但其實沒有這回事。比起思想單純，想像力豐富的人，說得極端一點，喜歡妄想的人更容易被催眠。這是統計上的結論，但女性在戀愛上容易看不清周遭，太過喜歡對方而聽不進朋友好言相勸。當然，女性也因此容易被男性欺騙、在情場上失敗；兩人在一起的結果容易不是極好就是極壞。」


    大致像這樣置入開場白。

    這個開場白的意圖如下：


    +   ●避免對方認為「單純的笨蛋才會被催眠」。


    +   ●有利於主張自己是少數派「喜歡妄想」的人。


    +   ●藉由「這是統計上的結論」，避免對方誤解「這是你想要讓我最容易被催眠，才這麼主張」。


    +   ●有利於主張自己是「我是專情到看不清楚周遭」的人。


