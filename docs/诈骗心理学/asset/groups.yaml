  - '[PAGE 29]


    表演成功後，會有人說：「那麼，你猜我現在在想什麼。」也就是「如果你的能讀心，不用我說出口也不用演出，應該能馬上猜中才對。」


    我在自己開的魔術咖啡店也遇過類似的情形，詢問前來的客人：「你想要看什麼表演？」他卻回說：「你用魔術猜我想要看什麼表演。」（）雖然這情況跟邊沒有什麼關係。（）


    不僅限於魔術（但還是希望不要這樣為難魔術師），如果對可疑的演出、未知現象抱有疑問，拿出關鍵詞「既然如此」自我防衛，就可以保護自己遠離詐騙。'
  - '[PAGE 30]


    # 「集客術」講師，

    自己卻招不到學生？


    市面上，有許多心理學大學教授出版「人際溝通技巧」相關書籍，雖然銷售 跟宣傳手法也有關係，但若能運用心理學吸引消費者，照理來說這些書應該都能 成為暢銷書。然而，現實卻不是如此。即便是教導溝通技巧的人，仍會和他人吵
    架、經歷離婚（事實上，就有心理學者在 Twitter 上大打筆戰）。


    經濟學的權威只需要專心投資股票就好，何必出來從事教學生這檔麻煩事 呢？


    「既然」具有攬客技巧，講師開課教導「集客術」，理應不會遇招不到學 生的窘境；「既然」有絕對賭贏賽馬的系統，應該不用販售該系統也能夠大賺一 筆；「既然」身為經營顧問，只需要自己開店不就行了。


    如果真的有怨念存在，贏得體育競賽的隊伍，全員都會因敵方隊伍的怨念而'
  - '[PAGE 31]


    身體運作失靈。

    就像這些例子，面對未知或者自己無法理解的現象時，先以「既然如此」的思維來質疑，是保護自己遠離詐騙、可疑勸誘的第一步。


    # 被洗腦的人都在想什麼？


    做不到「既然如此」思維的人，不慎誤信不正當的事物時，反而會執著於自己所相信的東西。


    實際上，有許多店會將魔術包裝成超能力，展現不可思議的現象。以前對超能力感興趣時，每聽聞有類似的店家，都會實際走訪一趟。


    某天，我在網路上看到有人說「那家咖啡店的超能力是真的」。


    那間店我以前曾經去過，店家只是演出一般的魔術表演，但所提示的根據實在令人不敢苟同。他們動不動就說「我來幫你清除邪氣」，把手懸於客人的頭'
  - '[PAGE 32]


    上，娓娓道出：「你的祖先……」

    網頁最後設有「你相信嗎？」的調查選項，我勾選「不相信」並提交表單。然後，該網頁管理者傳送這樣的訊息給我。

    「為什麼不相信呢？」

    詳細的往返內容這邊就省略，當我回答：「因為魔術也可以做到相同的現象。」對方就傳來這樣回覆：

    「你或許能用魔術做到相同的現象，但那位大師是使出真正的超能力。請不要濫用魔術來模仿。」

    他是打底從心底這麼認為，我也就不好說服他。

    最有趣的是，他說：「那位大師能讓木箭穿過五元日幣的孔洞。這個魔術能夠做到嗎？」

    其實，這是名為「箭矢穿孔（矢れば出来る）」的商品，上網搜尋一下就能找到的「販售品」。這是秋田縣的傳統工藝，看到他傳送過來的照片，我差點當場暈倒。我記得我的回覆是「這在市面上可以買到」，並附上商品的連結網址。

    這位「信徒」信誓旦旦回覆：'
  - '[PAGE 33]


    「或許市面有在賣相同的東西，但我是親眼看到木箭穿過去的，那是真正的超能力。」


    這完全是被洗腦的狀態。「洗腦」一詞本來是指「戰爭時的思想改造」，但大家對「洗腦」的印象應該多像是這位信徒的狀態吧。


    本書是將誘導對方相信，定義為「暗示」，而拒絕他人否定自己相信的事物，定義為「洗腦」。


