    # 從催眠術看「戀愛」機制


    不論性別，對於給予自己正面評價的他人，都會覺得對方對自己有利。


    人，總是希望自己的價值受到肯定。換句話說，遇到對自己抱有有意的人，會認為他對自己是有好處的。


    這個說法又叫「好意的回報性」。


    美國心理學家費斯汀格（Festinger）提倡「好意的回報性」，是指人會對「對自己抱有好意的人」產生好感，當受到對方關照，自然會產生主動回報的念頭。


    我將此稱為「收到手寫賀年卡覺得必須回覆對方的效果」。


    當然，相貌俊俏、年輕水嫩等等，還牽扯到許多條件要素，但即使對方不符合自己的喜好，不是未來想要交往的對象，說出「喜歡」自己的人，會形成無法取代的利益要素。


    那麼，人在哪個瞬間會喜歡上對方？'
  - '[PAGE 104]


    答案是「不想失去這個利益」的時候。當表示喜歡自己的對象，對其他異性釋出好意的瞬間，會覺得「不想要失去」。也就是覺得「失去這個利益對我來說是損失」。雖然講得稍嫌複雜，但最後都會產生類似的想法。說穿了，就是嫉妒、獨占慾。


    「因為長相帥氣，所以喜歡」、「因為對方有錢，所以喜歡」等等，僅是單純憶憬對自己有利的異性。然而，不論面對哪種類型的異性，只要「能讓對方覺得自己是有利的存在，失去是一種損失」，對方便會湧現「喜歡」的情感。一般來說，「人容易愛上喜歡自己的人」，就利害系統來看，其實相當合情合理。


    利用「間接暗示」讓對方覺得有利益、產生不想失去的感覺，即簡單的戀愛守則，但本書不是講述這類愛情叢書，這邊便不多談。然而，戀愛說穿了就是「嫉妒」與「獨占慾」。某人告白後兩人開始交往，但現在先保持距離……像這樣的戀愛遊戲總是讓'
  - '[PAGE 105]


    人臉紅心跳，不過就心理學的角度來看，交往這項行為只是「當你與其他異性發展成戀愛關係時，我擁有提出意見的權利」；結婚這項的行為僅是「我擁有施以法律制裁的權利」。


    兩者都是從獨占慾衍生出來，不想失去利益、迴避損失的行為。畢竟已經在戀愛上花費許多金錢、時間，只有像這樣衡量自己與對方之間的利害，才能冷靜地維持這段情感，得到期望中的結果。


    # 催眠狀態的持續時間


    施展催眠術後，經常有人會問：「如果解不開，催眠會一直持續嗎？」我的答案是「沒有這回事，睡一晚後就會解開。」但正確來說是「只要當事人還記得，催眠就會持續存在」。


    換句話說，在他認為「我被催眠了」的期間，會一直處於催眠狀態；當他認為「我沒被催眠了」，催眠也就解開了。'
  md: '

    會這樣說的人，大多是出於「沒有實際根據」的單純心理，認定這些沒有科學上的證據。


    就我來看，他們「明明不是專攻科學的人，只因為身邊周遭常有的現象，就自以為知道其中的原理」只是這樣而已。


    反過來說，遇到這類型的人，「只要能提示根據，反而更容易受騙上當」。因為他們不具備驗證該根據的知識。


    不曉得電燈為什麼會發光，僅因為平常看到房間的電燈點亮，就自以為了解其中的原理。


    順便一提，我大學專攻腦科學，當時教授常說：「不移開眼睛，注視強烈白熾燈泡三分鐘以上，光線就會刺激大腦中樞讓人笑個不停，所以不要直直盯著燈泡喔。」


    其實這根本是胡說，但很多人會差點相信吧？


    像這樣以權威、學術作為根據，對於「催眠術沒有科學根據！我才不相信！」的人，反而真的會看著燈泡笑出來。


    催眠師常隨身攜帶筆燈，暗示對方「持續注視燈光，你會感到意識朦朧」。


    ### 一旦開始相信，就會接連被催眠


    如果對方說「我完全沒事！」只需要稍微提示根據，對方就會被催眠。像是「這支不是普通的筆燈，它的光線是最新研發的……」


    一旦對方接受暗示，他就會產生新的認知，「我中了這個暗示」。相反地，「不管這位催眠師做什麼，我絕對不會被暗示。」如果對方這樣認為，那麼不管做什麼，暗示都不會成功。


    這邊說的暗示並不僅限於催眠術，比如「這家店的料理很好吃」、「這個寫曲子很棒」等等，生活處處都潛藏著暗示。


    當暗示成功，會產生主動相信該暗示的效果，所以一旦施術者成功施展有利於自己的暗示，之後就能簡單操弄對方。


    舉例來說，如果某人認為「這家店的料理很好吃」，即使店家端出調味非常淡的料理，他也會認為：「這是為了襯托後面的料理嘛。」


    在算命占卜方面，常可聽聞「算命師只是擅長例行話題（Stock Talk），描述適用任何人的說話技巧」、「觀察對方的表情來判斷有沒有算中」、「占卜，其實是冷讀術」。


    然而，一個擁有驚人技巧的算命師，如果客人事前探聽到「那位算命師算得不靈驗」，情況又會是如何呢？


    算命師再怎麼努力使出豐富多樣的話術，在「不靈驗」的前提之下，占卜就絕對算不中。假設你之前聽別人說「那邊的算命師是假的」，打算前往一探究竟，結果一去就被算命師叫出自己的名字。


    「你是太郎吧！」


    但是，事前就聽聞「他是假的」的你，應該會這麼想：「他是從哪邊得到我的個人資料？真是狡詐的騙子。」


    只有讓客人事前覺得「靈驗」，算命師的例行話題才會成立，營造說什麼都靈驗的氛圍。


    比如，算命師煞有其事說：「你最近會有意外之財。」


    然後，你隔天湊巧中獎數萬日圓。


    如果算命前後一個星期什麼事情都沒有發生，你會漸漸遺忘這件事，但現在卻湊巧中獎數萬日圓。此時，你會覺得「那位算命師很靈驗」，產生「想要相信的心情」，建立投契關係。


    下一次，那位算命師說：「最近，你會遇到不錯的異性。」你隔天就會以不同的眼光看待異性。再下一次，算命師說：「最近，你又會有意外之財。」隔天發現自動販賣機還有剩餘額，你就會認為「他又算中了！」


    經過一個月後，你可能只是在便利商店買東西獲得折扣，也會認為被算命師說中。


    這邊的重點是，「最近」這個詞沒有特定指「隔天」或者「數個月後」，金額也沒有限定「數十塊」或者「數萬日圓」，因為這些的模糊說法，才會產生偏見「這位算命師很靈驗」。


    「讓對方深信不疑」的行為，能發揮超出話術的效果。


    ## 第 3 章 詐騙救戰守則——被濫用的行騙技巧


    ### 詐騙的第一步


    前面多次提到「建立投契關係」，但能自然接受這個概念的人，或許之前有讀過心理學的文獻。


    投契關係是指，心理學用語上的「相互信賴的關係」。換句話說，建立投契關係相當於雙方完全信賴對方，此狀態被認為是所有治療與療法的必要前提。


    當然，「騙子」才會考慮相互信賴。「這傢伙，完全相信我了，好極了。」騙子只會打歪腦筋。


    說個冷知識，第一位利用投契關係的人，是被稱為催眠師始祖的法國茲安東•梅斯梅爾（Franz Anton Mesmer）。


    梅斯梅爾醫生認為每個人身上都具有「動物磁力（Animal Magnetism）」，提倡以手部運動控制磁力，整頓磁力流動來達到治療的效果。


    患者在治療過程中會發生痙攣或者昏厥，他稱這樣的症狀為「感應到動物磁力的狀態」，亦即「建立投契關係的狀態」。


    當然，人體不會因為動物磁力而發生痙攣或者昏厥。換句話說，這些是藉助「與患者建立信賴關係」所引發的現象。雖然這可能不是梅斯梅爾原本的目的，但只要建立起信賴關係，將手懸於頭部上方，就能夠讓對方昏厥，完全佐證「催眠術是投契關係的建立」。這個情況並不僅限於催眠術，還能套用到現代的各種事情上。


    「○○產的食物好吃或難吃」、「這是三星級的餐廳」、「曾經發生食物中毒的店家」等等，不論評價的好壞，我們平時都會依據各種情報建立對事物「信賴」。


    這與在十八世紀相信「動物磁力好像真有療效」而痙攣的人沒有什麼不同。就好像前往評價不錯的美容院，就算頭髮被理得奇葩前衛，你也會欣然接受。


    透過投契關係的建立，產生「味覺改變」、「商品變得好看」的錯覺。這和「昏厥」相比起來，完全不是什麼困難的事情。


    即便沒聽過「建立投契關係」的術語，知曉這種心理作用的「騙子」，時時會想盡辦法建立投契關係，企圖藉此謀取利益。


    ### 找出對方相信的事物


    我們會對什麼事物建立投契關係呢？


    平時過著什麼樣的生活，基本上都是靠我們自己的意志做選擇。是否有信仰、宗教觀是什麼、在超市都購買什麼商品等，全部都包括在內。


    雖然「相信什麼取決於自己」很單純，但如果沒有意識這會被拿來利用，就有可能被詐騙。


    以前曾經流行過「我是從消防署那邊來的，您得買新的滅火器更換」的詐騙行為，這是以權威機關為名義的慣常手法。現在，大家都知道其中的詭計，不會有人被騙。


    不過，就暗示方面來看，大多數人會對「消防署」感受到威光效應，內心產生信賴、安心感，完全符合催眠所需的要素。


    那麼，將這個滅火器的販售搬到電視購物節目，情況會變得如何呢？


    「這支滅火器，是經過消防署保證品質的商品！」


    這邊的重點是，大多數人會對消防署一詞產生信賴，無意間建立投契關係。


    主持人想要賣出商品，必須思索如何贏得多數人的信賴，讓在分母上面的分子變大。這並不僅限於言語，譬如想要推銷催眠術的相關教材，只要印上「催眠師××××掛保證！」或許就有機會大賣吧（笑）。


    在一般家庭向的電視購物節目當中，主持人可以說：「知名演員○○也在使用？」


    ### 利用對方感興趣的事物來說謊


    針對大多數人建立投契關係，會舉例消防署、知名演員等眾人信賴的事物，不過若是針對個人的詐騙，就得找出被害者對什麼抱持信賴，才能進一步深化投契關係。


    舉例來說「說謊搭訕女性」。


    在社群網站發達的現代社會，個人情報、喜好、興趣幾乎無所遁形。稍微聊一陣子，就能套出許多情報。


    - 「喜歡某某偶像」、「經常去星巴克」……等。


    這很簡單吧？


    欺騙者只要說「我之前見過那位偶像」，對方就會對你感興趣；說「曾在星巴克工作過」，就能贏得對方的信賴。


    雖然聽起來像是理所當然，但說穿了就是藉助威光的對話罷了。


    - 「我有很多演藝圈的朋友，跟○○也認識喔」等等，你曾過像這樣想要引起對方興趣的愚蠢搭訕方式吧，如果對方回說「○○是誰？我不認識」，那就失去意義。


    套用對方明顯感興趣的事物，由欺騙一方改變說法（說謊）來建立投契關係。


    這就是「詐騙」的真相。


    ### 迎合對方相信的事物來建立「威光」


    「催眠療法」有這樣的療法。我認為，利用催眠術從事治療、醫療行為是很危險的（需對病患負起責任），自己實在做不來。如同前面所說，催眠術不過是一種主觀深信、想要相信的心情而已。


    當然，就「病由心生」的觀點來看，催眠療法或多或少是有效果的。例如壓力造成胃痛、煩惱過度造成頭髮稀疏等等。可是，實際運用催眠來治療，那就是另外一回事。


    雖說如此，催眠療法還是有存在的意義。


    對於「深信」自己中了暗示的患者，這是非常有效的療法。


    比如，有個病患說「我以前被不好的催眠師給催眠，之後每次喝熱湯都會吐出來」（真的有類似症狀的患者）。


    想要排除這位病患的症狀，只能靠催眠師。


    這與是不是催眠術所引起症狀沒有關係（就深信不疑這點來說，所有的事情都可說與催眠術有關係，但情況沒有那麼單純……），重點是當事人認為是催眠術引發病症。


    遇到認為自己「被惡魔附身而感到頭疼」的人，必須請驅魔師出馬。


    而且，這位驅魔師還得煞有其事：「我至今驅除了數百隻的惡魔……原來如此，你的確被強力的惡魔附身了，但交給我我就沒問題了。」


    換句話說，對於相信惡魔的人，不論請來多少位「科學權威的學者」，也不會有效果出現；對於相信催眠術的人，氣功高手也無法引起任何現象，完全不會有任何感覺。


    這就是「對於自己相信的東西，會產生威光效應」。


    詐騙犯做的，就是找出對方相信的事物，並且毫不猶豫地佯裝成該方面的專家。


    ### 從平常對話中，瞬間找出人性特質


    如同前述，對世界上的騙子來說，看清對方的特質比什麼都來得重要。


    雖然我不是騙子（笑），但這在魔術界也是相同的。


    累積足夠的經驗，習慣後不是什麼難事。


    我在桌子上攤開紙牌表演魔術秀，說：「請抽一張你喜歡的牌。」同時會在心中大致將人分成五類。


    - 什麼都沒想就抽取第一張的人。

    - 認為沒有第一張牌會讓魔術師困擾而抽取第一張的人。

    - 什麼都沒想就從中間抽取的人。

    - 再三猶豫，最後選擇抽取中間偏右或者偏左的人。

    - 認為會讓魔術師困擾而抽取最後一張的人。


    這樣大致分類，我便能從容地演出：「數字 1 到 5 ，請在中心想一個你喜歡的數字。」（雖然未必能百分之百說中，但魔術都會事先拉起預防線）。


    如果客人是來看魔術，可透過對話來看清對方的特質，但若是來看催眠秀，在踏上表演台之前，就得掌握客人的特質。


    所以，我經常在正式表演前，先到觀眾席閒晃，豎起耳朵捕捉訊息。之後踏上舞台後，我會先讓所有觀眾玩簡單的小遊戲，看清他們的特質。


    對方「容易接受」、「不容易接受」「暗示，並沒有一套制式的判斷方式，本書也難以說明其中的微妙差異，譬如「催眠術？我想被催眠看看」這句話，可能是「我真的想被催眠看看！」但也可能是「我不認為自己會被催眠，你要是真能做到就試試看！」


    再者，「我或許會被催眠吧！」這句話，可能是真的認為「自己會被催眠」，但也可能是「催眠絕對不會成功，看我讓你下不了台！」


    這語氣中的微妙差異很難用文字說明，但對於「你要試試看催眠術嗎？」這個問題，幾乎就像前面的敘述，只有這幾種反應而已。


    不過，同樣一句話的背後包含許多不同含意，魔術師需要有讀取語氣中微妙的差異。


    假設你現在想要賣汽車，隨便抓十幾個人問：「你想要買車嗎？不外乎得到「我想要買車，但？」或者「沒有，手頭目前……」之類的回覆。


    然而，這些回覆當中，可能是「我想要買車，但最低你能賣多少？」或者「我想要買車，但實在負擔不起。」包含各種不同的含意在裡頭。


    ### 暗示是否成功的判斷方式


    除了對方的語氣之外，在判斷催眠是否成功時，「表情」也是重要的要素之一。被催眠的人，簡單講就是「情感消失的狀態」，臉部會整個放鬆。


    眼睛半開、嘴巴微開，拿起鏡子並放鬆所有臉部肌肉，在完全沒有使力的情況下，臉會呈現這樣的表情。


    若要舉日常上的例子，就像什麼都沒有想，恍神看電影，或者上課時分心想別的事情，對老師講什麼完全沒有印象的狀態。


    這就是「恍惚狀態」，無法判斷實際看到什麼、聽到什麼。


    處於這樣的狀態，容易接受「你喜歡上○○」等情感控制暗示。


    催眠師在暗示前會先說「閉上眼睛，當我數到三……」，就是為了讓對方進入這樣的狀態。


    這可以想成是，切斷身體視覺、聽覺的「馳驀妄想」。


    這樣理解就不算是詐騙，在各種商業買賣上，「誘導對方想像」是非常有效的做法。


    比如旅行社提供具體的視聽宣傳，「在新綠飄香的山巒環繞下，與家人一塊烤肉亨樂。「誘導客戶聯想該畫面。當客戶開始恍惚想像，後續的合約大概就跑不掉。


    反過來說，由對方的表情，能知道「暗示是否成功」。


    恍惚狀態會呈現上述的表情，而引起手部僵直的瞬間，客人多會「笑起來」。


    「嗯？怎麼可能！「當腦中瞬間這麼想時，臉上會出現笑容。


    此時，從對方的臉部表情能讀到許多情感，解除恍惚狀態。


    ### 自己打從心底這麼認為，對方也會受影響


    在對想要被催眠的人上課時，最難教的地方是「情感投入」。不論用什麼教導方式，皆會出現有人擅長、有人不擅長的情況。


    情感，是會傳染的。


    如同陪著他人哭、跟著眾人笑的現象，參加關係不深的親戚婚禮，聽到新娘邊哭邊讀給母親的信，自己也會跟著鼻酸流淚。


    這不是因為內容感動而哭泣，也不是因為產生親近感而掉淚。


    那麼，為什麼會鼻酸流淚呢？


    這是因為新娘是真的「感傷」讀信的緣故。


    陪著他人哭泣，就是情感傳達的一種。


    換句話說，如果想要暗示對方「放掉身體中的力量……」，自己就得以真的放掉身體力量的「心情」來講；若是想要暗示「你現在站在很高的地方，青白得雙腳顫抖」，自己就得以實際想像該情況而雙腳顫抖的感覺來講，暗示的效果才會顯現出來。


    想要「傳達情感」、「自己必須「投入演出」。


    比如推薦商品，得以真心喜愛該商品的心情，述說「這商品真的很棒」，對方才會跟著這麼覺得。


    反過來說，言語加上「真的很棒」的情感，說：「你好，我有想要讓你看看的東西。」「對方自然會覺得「你是真心推薦好東西」（不管那東西是不是真的很棒）。


    這適用於其他大小事、暗示或者催眠。


    比如，抱著「喜歡你」的想法來搭話，對方會對你產生意識。交談時打歪腦筋，對方會察覺到你的邪念。


    你應該也遇過類似的經驗吧。「時間晚了，我送你回家吧。」「向女性這樣搭話的男性，若是明顯別有企圖，只會被委婉推拒。


    若是打從心底「我擔心你」，提議「我送你回家」，對方就會表示「謝謝」。


    ### 日常生活中潛藏的「間接暗示」


    如前所述，間接暗示具有無比強大的力量。舉例來說，比起直接表示喜歡對方，由朋友間接傳達「他好像喜歡你喔？」更能讓對方產生意識。待意識產生，只需稍微溫柔體貼，對方會在意：「他是不是喜歡我？」


    相較於高喊「我是有錢人！」秀出一疊鈔票的行為，在結帳時撇見錢包裡的鈔票，或者親見手腕上的高檔手錶，更能讓對方留下強烈的印象，這就是「間接暗示」（這是我自己的定義，其他催眠師可能有不同的見解）。


    簡單說就是「讓對方擅自推測現象」。


    在催眠界，催眠師不會明說：「你不管怎麼努力都站不起來！」而是說成：「你努力站起來看看。」


    後者的說法能間接傳達：「你需要用力才能站起來」。


    在日常生活上，尤其是商業買賣上，間接暗示可說是隨處可見。


    - 「嚴禁濫用！」暗示「這商品厲害到可用為非作歹」；

    - 「結束大拍賣」暗示「我們準備收攤了，快來搶便宜的優質商品。」


    我們身邊到處都有類似的間接暗示，若能理解並知曉如何運用，你對各種事物的看法也會為之一變。


    ### 使對方自己發現、主動聯想


    前面已有提過，在我自己經營的咖啡店，吧檯後面的電視會不斷播放我上電視的節目。來店的客人看到這個節目，首先心理會預設「老闆是上過電視的高手」。


    這也是一種間接暗示，藉助威光效應來建立投契關係。


    間接暗示追求的，是「讓對方自然察覺背後隱藏的真正用意」。反過來說，也可想成是「因為沒有人知道真正用意是什麼，所以不會失敗。」


    低頭輕聲說「喜歡你」稍微讓對方聽到，就是出色的間接暗示。不難想像對方會非常在意：「他喜歡的人是我嗎？」「


    ### 「間接暗示」的強大工具隨手可得


    講到「悄悄話（呟き＝推文、貼文）」，應該有人注意到了吧，我們身邊就可以任意間接暗示的強大工具。


    那就是 Twitter、Facebook 等社群網站。


    「Paper」不是針對特定人物談論，能讓所有追蹤人看到推文訊息，是強大的間接暗示工具。


    你現在可以馬上針對追蹤人，進行間接暗示的實驗。試著在「Paper」上發文「上週遇到的傢伙，真是沒禮貌」。上週與你碰過面的追蹤人看到這則訊息，都會不由得擔心：「我是不是做了什麼失禮的事情？」


    我實際在「Paper」上這樣發文後，隔天就有收到五位追蹤人「我是不是不小心冒犯您」、「前幾天受到您的關照了」等訊息。


    這就是間接暗示的效果。


    這也可以簡單運用於戀愛上。


    發文「每次想到那個人，我就覺得心臟跳得好快」，能讓其他人覺得「他是在喜歡我嗎？」前關注你的動態，接著你再推文「我想我還是放棄那個人吧」，此時就會有許多人主動敲你聊天。


    這比市面上的戀愛守則更有效果，而且容易實踐。不僅限於戀愛，不論是商業買賣還是欺騙他人，沒有比社群網站更強大的自動暗示工具。


    ### 從催眠術看「戀愛」機制


    不論性別，對於給予自己正面評價的他人，都會覺得對方對自己有利。


    人，總是希望自己的價值受到肯定。換句話說，遇到對自己抱有有意的人，會認為他對自己是有好處的。


    這個說法又叫「好意的回報性」。


    美國心理學家費斯汀格（Festinger）提倡「好意的回報性」，是指人會對「對自己抱有好意的人」產生好感，當受到對方關照，自然會產生主動回報的念頭。


    我將此稱為「收到手寫賀年卡覺得必須回覆對方的效果」。


    當然，相貌俊俏、年輕水嫩等等，還牽扯到許多條件要素，但即使對方不符合自己的喜好，不是未來想要交往的對象，說出「喜歡」自己的人，會形成無法取代的利益要素。


    那麼，人在哪個瞬間會喜歡上對方？


    答案是「不想失去這個利益」的時候。當表示喜歡自己的對象，對其他異性釋出好意的瞬間，會覺得「不想要失去」。也就是覺得「失去這個利益對我來說是損失」。雖然講得稍嫌複雜，但最後都會產生類似的想法。說穿了，就是嫉妒、獨占慾。


    「因為長相帥氣，所以喜歡」、「因為對方有錢，所以喜歡」等等，僅是單純憧憬對自己有利的異性。然而，不論面對哪種類型的異性，只要「能讓對方覺得自己是有利的存在，失去是一種損失」，對方便會湧現「喜歡」的情感。一般來說，「人容易愛上喜歡自己的人」，就利害系統來看，其實相當合情合理。


    利用「間接暗示」讓對方覺得有利益、產生不想失去的感覺，即簡單的戀愛守則，但本書不是講述這類愛情叢書，這邊便不多談。然而，戀愛說穿了就是「嫉妒」與「獨占慾」。某人告白後兩人開始交往，但現在先保持距離……像這樣的戀愛遊戲總是讓人臉紅心跳，不過就心理學的角度來看，交往這項行為只是「當你與其他異性發展成戀愛關係時，我擁有提出意見的權利」；結婚這項的行為僅是「我擁有施以法律制裁的權利」。


    兩者都是從獨占慾衍生出來，不想失去利益、迴避損失的行為。畢竟已經在戀愛上花費許多金錢、時間，只有像這樣衡量自己與對方之間的利害，才能冷靜地維持這段情感，得到期望中的結果。


    ### 催眠狀態的持續時間


    施展催眠術後，經常有人會問：「如果解不開，催眠會一直持續嗎？」我的答案是「沒有這回事，睡一晚後就會解開。」但正確來說是「只要當事人還記得，催眠就會持續存在」。


    換句話說，在他認為「我被催眠了」的期間，會一直處於催眠狀態；當他認為「我沒被催眠了」，催眠也就解開了。

    '
  mdcn: '

    會這樣說的人，大多是出於「沒有實際根據」的單純心理，認定這些沒有科學上的證據。


    就我來看，他們「明明不是專攻科學的人，只因為身邊周遭常有的現象，就自以為知道其中的原理」只是這樣而已。


    反過來說，遇到這類型的人，「只要能提示根據，反而更容易受騙上當」。因為他們不具備驗證該根據的知識。


    不曉得電燈為什麼會發光，僅因為平常看到房間的電燈點亮，就自以為了解其中的原理。


    順便一提，我大學專攻腦科學，當時教授常說：「不移開眼睛，注視強烈白熾燈泡三分鐘以上，光線就會刺激大腦中樞讓人笑個不停，所以不要直直盯著燈泡喔。」


    其實這根本是胡說，但很多人會差點相信吧？


    像這樣以權威、學術作為根據，對於「催眠術沒有科學根據！我才不相信！」的人，反而真的會看著燈泡笑出來。


    催眠師常隨身攜帶筆燈，暗示對方「持續注視燈光，你會感到意識朦朧」。


    ### 一旦開始相信，就會接連被催眠


    如果對方說「我完全沒事！」只需要稍微提示根據，對方就會被催眠。像是「這支不是普通的筆燈，它的光線是最新研發的……」


    一旦對方接受暗示，他就會產生新的認知，「我中了這個暗示」。相反地，「不管這位催眠師做什麼，我絕對不會被暗示。」如果對方這樣認為，那麼不管做什麼，暗示都不會成功。


    這邊說的暗示並不僅限於催眠術，比如「這家店的料理很好吃」、「這個寫曲子很棒」等等，生活處處都潛藏著暗示。


    當暗示成功，會產生主動相信該暗示的效果，所以一旦施術者成功施展有利於自己的暗示，之後就能簡單操弄對方。


    舉例來說，如果某人認為「這家店的料理很好吃」，即使店家端出調味非常淡的料理，他也會認為：「這是為了襯托後面的料理嘛。」


    在算命占卜方面，常可聽聞「算命師只是擅長例行話題（Stock Talk），描述適用任何人的說話技巧」、「觀察對方的表情來判斷有沒有算中」、「占卜，其實是冷讀術」。


    然而，一個擁有驚人技巧的算命師，如果客人事前探聽到「那位算命師算得不靈驗」，情況又會是如何呢？


    算命師再怎麼努力使出豐富多樣的話術，在「不靈驗」的前提之下，占卜就絕對算不中。假設你之前聽別人說「那邊的算命師是假的」，打算前往一探究竟，結果一去就被算命師叫出自己的名字。


    「你是太郎吧！」


    但是，事前就聽聞「他是假的」的你，應該會這麼想：「他是從哪邊得到我的個人資料？真是狡詐的騙子。」


    只有讓客人事前覺得「靈驗」，算命師的例行話題才會成立，營造說什麼都靈驗的氛圍。


    比如，算命師煞有其事說：「你最近會有意外之財。」


    然後，你隔天湊巧中獎數萬日圓。


    如果算命前後一個星期什麼事情都沒有發生，你會漸漸遺忘這件事，但現在卻湊巧中獎數萬日圓。此時，你會覺得「那位算命師很靈驗」，產生「想要相信的心情」，建立投契關係。


    下一次，那位算命師說：「最近，你會遇到不錯的異性。」你隔天就會以不同的眼光看待異性。再下一次，算命師說：「最近，你又會有意外之財。」隔天發現自動販賣機還有剩餘額，你就會認為「他又算中了！」


    經過一個月後，你可能只是在便利商店買東西獲得折扣，也會認為被算命師說中。


    這邊的重點是，「最近」這個詞沒有特定指「隔天」或者「數個月後」，金額也沒有限定「數十塊」或者「數萬日圓」，因為這些的模糊說法，才會產生偏見「這位算命師很靈驗」。


    「讓對方深信不疑」的行為，能發揮超出話術的效果。


    ## 第 3 章 詐騙救戰守則——被濫用的行騙技巧


    ### 詐騙的第一步


    前面多次提到「建立投契關係」，但能自然接受這個概念的人，或許之前有讀過心理學的文獻。


    投契關係是指，心理學用語上的「相互信賴的關係」。換句話說，建立投契關係相當於雙方完全信賴對方，此狀態被認為是所有治療與療法的必要前提。


    當然，「騙子」才會考慮相互信賴。「這傢伙，完全相信我了，好極了。」騙子只會打歪腦筋。


    說個冷知識，第一位利用投契關係的人，是被稱為催眠師始祖的法國茲安東•梅斯梅爾（Franz Anton Mesmer）。


    梅斯梅爾醫生認為每個人身上都具有「動物磁力（Animal Magnetism）」，提倡以手部運動控制磁力，整頓磁力流動來達到治療的效果。


    患者在治療過程中會發生痙攣或者昏厥，他稱這樣的症狀為「感應到動物磁力的狀態」，亦即「建立投契關係的狀態」。


    當然，人體不會因為動物磁力而發生痙攣或者昏厥。換句話說，這些是藉助「與患者建立信賴關係」所引發的現象。雖然這可能不是梅斯梅爾原本的目的，但只要建立起信賴關係，將手懸於頭部上方，就能夠讓對方昏厥，完全佐證「催眠術是投契關係的建立」。這個情況並不僅限於催眠術，還能套用到現代的各種事情上。


    「○○產的食物好吃或難吃」、「這是三星級的餐廳」、「曾經發生食物中毒的店家」等等，不論評價的好壞，我們平時都會依據各種情報建立對事物「信賴」。


    這與在十八世紀相信「動物磁力好像真有療效」而痙攣的人沒有什麼不同。就好像前往評價不錯的美容院，就算頭髮被理得奇葩前衛，你也會欣然接受。


    透過投契關係的建立，產生「味覺改變」、「商品變得好看」的錯覺。這和「昏厥」相比起來，完全不是什麼困難的事情。


    即便沒聽過「建立投契關係」的術語，知曉這種心理作用的「騙子」，時時會想盡辦法建立投契關係，企圖藉此謀取利益。


    ### 找出對方相信的事物


    我們會對什麼事物建立投契關係呢？


    平時過著什麼樣的生活，基本上都是靠我們自己的意志做選擇。是否有信仰、宗教觀是什麼、在超市都購買什麼商品等，全部都包括在內。


    雖然「相信什麼取決於自己」很單純，但如果沒有意識這會被拿來利用，就有可能被詐騙。


    以前曾經流行過「我是從消防署那邊來的，您得買新的滅火器更換」的詐騙行為，這是以權威機關為名義的慣常手法。現在，大家都知道其中的詭計，不會有人被騙。


    不過，就暗示方面來看，大多數人會對「消防署」感受到威光效應，內心產生信賴、安心感，完全符合催眠所需的要素。


    那麼，將這個滅火器的販售搬到電視購物節目，情況會變得如何呢？


    「這支滅火器，是經過消防署保證品質的商品！」


    這邊的重點是，大多數人會對消防署一詞產生信賴，無意間建立投契關係。


    主持人想要賣出商品，必須思索如何贏得多數人的信賴，讓在分母上面的分子變大。這並不僅限於言語，譬如想要推銷催眠術的相關教材，只要印上「催眠師××××掛保證！」或許就有機會大賣吧（笑）。


    在一般家庭向的電視購物節目當中，主持人可以說：「知名演員○○也在使用？」


    ### 利用對方感興趣的事物來說謊


    針對大多數人建立投契關係，會舉例消防署、知名演員等眾人信賴的事物，不過若是針對個人的詐騙，就得找出被害者對什麼抱持信賴，才能進一步深化投契關係。


    舉例來說「說謊搭訕女性」。


    在社群網站發達的現代社會，個人情報、喜好、興趣幾乎無所遁形。稍微聊一陣子，就能套出許多情報。


    - 「喜歡某某偶像」、「經常去星巴克」……等。


    這很簡單吧？


    欺騙者只要說「我之前見過那位偶像」，對方就會對你感興趣；說「曾在星巴克工作過」，就能贏得對方的信賴。


    雖然聽起來像是理所當然，但說穿了就是藉助威光的對話罷了。


    - 「我有很多演藝圈的朋友，跟○○也認識喔」等等，你曾過像這樣想要引起對方興趣的愚蠢搭訕方式吧，如果對方回說「○○是誰？我不認識」，那就失去意義。


    套用對方明顯感興趣的事物，由欺騙一方改變說法（說謊）來建立投契關係。


    這就是「詐騙」的真相。


    ### 迎合對方相信的事物來建立「威光」


    「催眠療法」有這樣的療法。我認為，利用催眠術從事治療、醫療行為是很危險的（需對病患負起責任），自己實在做不來。如同前面所說，催眠術不過是一種主觀深信、想要相信的心情而已。


    當然，就「病由心生」的觀點來看，催眠療法或多或少是有效果的。例如壓力造成胃痛、煩惱過度造成頭髮稀疏等等。可是，實際運用催眠來治療，那就是另外一回事。


    雖說如此，催眠療法還是有存在的意義。


    對於「深信」自己中了暗示的患者，這是非常有效的療法。


    比如，有個病患說「我以前被不好的催眠師給催眠，之後每次喝熱湯都會吐出來」（真的有類似症狀的患者）。


    想要排除這位病患的症狀，只能靠催眠師。


    這與是不是催眠術所引起症狀沒有關係（就深信不疑這點來說，所有的事情都可說與催眠術有關係，但情況沒有那麼單純……），重點是當事人認為是催眠術引發病症。


    遇到認為自己「被惡魔附身而感到頭疼」的人，必須請驅魔師出馬。


    而且，這位驅魔師還得煞有其事：「我至今驅除了數百隻的惡魔……原來如此，你的確被強力的惡魔附身了，但交給我我就沒問題了。」


    換句話說，對於相信惡魔的人，不論請來多少位「科學權威的學者」，也不會有效果出現；對於相信催眠術的人，氣功高手也無法引起任何現象，完全不會有任何感覺。


    這就是「對於自己相信的東西，會產生威光效應」。


    詐騙犯做的，就是找出對方相信的事物，並且毫不猶豫地佯裝成該方面的專家。


    ### 從平常對話中，瞬間找出人性特質


    如同前述，對世界上的騙子來說，看清對方的特質比什麼都來得重要。


    雖然我不是騙子（笑），但這在魔術界也是相同的。


    累積足夠的經驗，習慣後不是什麼難事。


    我在桌子上攤開紙牌表演魔術秀，說：「請抽一張你喜歡的牌。」同時會在心中大致將人分成五類。


    - 什麼都沒想就抽取第一張的人。

    - 認為沒有第一張牌會讓魔術師困擾而抽取第一張的人。

    - 什麼都沒想就從中間抽取的人。

    - 再三猶豫，最後選擇抽取中間偏右或者偏左的人。

    - 認為會讓魔術師困擾而抽取最後一張的人。


    這樣大致分類，我便能從容地演出：「數字 1 到 5 ，請在中心想一個你喜歡的數字。」（雖然未必能百分之百說中，但魔術都會事先拉起預防線）。


    如果客人是來看魔術，可透過對話來看清對方的特質，但若是來看催眠秀，在踏上表演台之前，就得掌握客人的特質。


    所以，我經常在正式表演前，先到觀眾席閒晃，豎起耳朵捕捉訊息。之後踏上舞台後，我會先讓所有觀眾玩簡單的小遊戲，看清他們的特質。


    對方「容易接受」、「不容易接受」「暗示，並沒有一套制式的判斷方式，本書也難以說明其中的微妙差異，譬如「催眠術？我想被催眠看看」這句話，可能是「我真的想被催眠看看！」但也可能是「我不認為自己會被催眠，你要是真能做到就試試看！」


    再者，「我或許會被催眠吧！」這句話，可能是真的認為「自己會被催眠」，但也可能是「催眠絕對不會成功，看我讓你下不了台！」


    這語氣中的微妙差異很難用文字說明，但對於「你要試試看催眠術嗎？」這個問題，幾乎就像前面的敘述，只有這幾種反應而已。


    不過，同樣一句話的背後包含許多不同含意，魔術師需要有讀取語氣中微妙的差異。


    假設你現在想要賣汽車，隨便抓十幾個人問：「你想要買車嗎？不外乎得到「我想要買車，但？」或者「沒有，手頭目前……」之類的回覆。


    然而，這些回覆當中，可能是「我想要買車，但最低你能賣多少？」或者「我想要買車，但實在負擔不起。」包含各種不同的含意在裡頭。


    ### 暗示是否成功的判斷方式


    除了對方的語氣之外，在判斷催眠是否成功時，「表情」也是重要的要素之一。被催眠的人，簡單講就是「情感消失的狀態」，臉部會整個放鬆。


    眼睛半開、嘴巴微開，拿起鏡子並放鬆所有臉部肌肉，在完全沒有使力的情況下，臉會呈現這樣的表情。


    若要舉日常上的例子，就像什麼都沒有想，恍神看電影，或者上課時分心想別的事情，對老師講什麼完全沒有印象的狀態。


    這就是「恍惚狀態」，無法判斷實際看到什麼、聽到什麼。


    處於這樣的狀態，容易接受「你喜歡上○○」等情感控制暗示。


    催眠師在暗示前會先說「閉上眼睛，當我數到三……」，就是為了讓對方進入這樣的狀態。


    這可以想成是，切斷身體視覺、聽覺的「馳驀妄想」。


    這樣理解就不算是詐騙，在各種商業買賣上，「誘導對方想像」是非常有效的做法。


    比如旅行社提供具體的視聽宣傳，「在新綠飄香的山巒環繞下，與家人一塊烤肉亨樂。「誘導客戶聯想該畫面。當客戶開始恍惚想像，後續的合約大概就跑不掉。


    反過來說，由對方的表情，能知道「暗示是否成功」。


    恍惚狀態會呈現上述的表情，而引起手部僵直的瞬間，客人多會「笑起來」。


    「嗯？怎麼可能！「當腦中瞬間這麼想時，臉上會出現笑容。


    此時，從對方的臉部表情能讀到許多情感，解除恍惚狀態。


    ### 自己打從心底這麼認為，對方也會受影響


    在對想要被催眠的人上課時，最難教的地方是「情感投入」。不論用什麼教導方式，皆會出現有人擅長、有人不擅長的情況。


    情感，是會傳染的。


    如同陪著他人哭、跟著眾人笑的現象，參加關係不深的親戚婚禮，聽到新娘邊哭邊讀給母親的信，自己也會跟著鼻酸流淚。


    這不是因為內容感動而哭泣，也不是因為產生親近感而掉淚。


    那麼，為什麼會鼻酸流淚呢？


    這是因為新娘是真的「感傷」讀信的緣故。


    陪著他人哭泣，就是情感傳達的一種。


    換句話說，如果想要暗示對方「放掉身體中的力量……」，自己就得以真的放掉身體力量的「心情」來講；若是想要暗示「你現在站在很高的地方，青白得雙腳顫抖」，自己就得以實際想像該情況而雙腳顫抖的感覺來講，暗示的效果才會顯現出來。


    想要「傳達情感」、「自己必須「投入演出」。


    比如推薦商品，得以真心喜愛該商品的心情，述說「這商品真的很棒」，對方才會跟著這麼覺得。


    反過來說，言語加上「真的很棒」的情感，說：「你好，我有想要讓你看看的東西。」「對方自然會覺得「你是真心推薦好東西」（不管那東西是不是真的很棒）。


    這適用於其他大小事、暗示或者催眠。


    比如，抱著「喜歡你」的想法來搭話，對方會對你產生意識。交談時打歪腦筋，對方會察覺到你的邪念。


    你應該也遇過類似的經驗吧。「時間晚了，我送你回家吧。」「向女性這樣搭話的男性，若是明顯別有企圖，只會被委婉推拒。


    若是打從心底「我擔心你」，提議「我送你回家」，對方就會表示「謝謝」。


    ### 日常生活中潛藏的「間接暗示」


    如前所述，間接暗示具有無比強大的力量。舉例來說，比起直接表示喜歡對方，由朋友間接傳達「他好像喜歡你喔？」更能讓對方產生意識。待意識產生，只需稍微溫柔體貼，對方會在意：「他是不是喜歡我？」


    相較於高喊「我是有錢人！」秀出一疊鈔票的行為，在結帳時撇見錢包裡的鈔票，或者親見手腕上的高檔手錶，更能讓對方留下強烈的印象，這就是「間接暗示」（這是我自己的定義，其他催眠師可能有不同的見解）。


    簡單說就是「讓對方擅自推測現象」。


    在催眠界，催眠師不會明說：「你不管怎麼努力都站不起來！」而是說成：「你努力站起來看看。」


    後者的說法能間接傳達：「你需要用力才能站起來」。


    在日常生活上，尤其是商業買賣上，間接暗示可說是隨處可見。


    - 「嚴禁濫用！」暗示「這商品厲害到可用為非作歹」；

    - 「結束大拍賣」暗示「我們準備收攤了，快來搶便宜的優質商品。」


    我們身邊到處都有類似的間接暗示，若能理解並知曉如何運用，你對各種事物的看法也會為之一變。


    ### 使對方自己發現、主動聯想


    前面已有提過，在我自己經營的咖啡店，吧檯後面的電視會不斷播放我上電視的節目。來店的客人看到這個節目，首先心理會預設「老闆是上過電視的高手」。


    這也是一種間接暗示，藉助威光效應來建立投契關係。


    間接暗示追求的，是「讓對方自然察覺背後隱藏的真正用意」。反過來說，也可想成是「因為沒有人知道真正用意是什麼，所以不會失敗。」


    低頭輕聲說「喜歡你」稍微讓對方聽到，就是出色的間接暗示。不難想像對方會非常在意：「他喜歡的人是我嗎？」「


    ### 「間接暗示」的強大工具隨手可得


    講到「悄悄話（呟き＝推文、貼文）」，應該有人注意到了吧，我們身邊就可以任意間接暗示的強大工具。


    那就是 Twitter、Facebook 等社群網站。


    「Paper」不是針對特定人物談論，能讓所有追蹤人看到推文訊息，是強大的間接暗示工具。


    你現在可以馬上針對追蹤人，進行間接暗示的實驗。試著在「Paper」上發文「上週遇到的傢伙，真是沒禮貌」。上週與你碰過面的追蹤人看到這則訊息，都會不由得擔心：「我是不是做了什麼失禮的事情？」


    我實際在「Paper」上這樣發文後，隔天就有收到五位追蹤人「我是不是不小心冒犯您」、「前幾天受到您的關照了」等訊息。


    這就是間接暗示的效果。


    這也可以簡單運用於戀愛上。


    發文「每次想到那個人，我就覺得心臟跳得好快」，能讓其他人覺得「他是在喜歡我嗎？」前關注你的動態，接著你再推文「我想我還是放棄那個人吧」，此時就會有許多人主動敲你聊天。


    這比市面上的戀愛守則更有效果，而且容易實踐。不僅限於戀愛，不論是商業買賣還是欺騙他人，沒有比社群網站更強大的自動暗示工具。


    ### 從催眠術看「戀愛」機制


    不論性別，對於給予自己正面評價的他人，都會覺得對方對自己有利。


    人，總是希望自己的價值受到肯定。換句話說，遇到對自己抱有有意的人，會認為他對自己是有好處的。


    這個說法又叫「好意的回報性」。


    美國心理學家費斯汀格（Festinger）提倡「好意的回報性」，是指人會對「對自己抱有好意的人」產生好感，當受到對方關照，自然會產生主動回報的念頭。


    我將此稱為「收到手寫賀年卡覺得必須回覆對方的效果」。


    當然，相貌俊俏、年輕水嫩等等，還牽扯到許多條件要素，但即使對方不符合自己的喜好，不是未來想要交往的對象，說出「喜歡」自己的人，會形成無法取代的利益要素。


    那麼，人在哪個瞬間會喜歡上對方？


    答案是「不想失去這個利益」的時候。當表示喜歡自己的對象，對其他異性釋出好意的瞬間，會覺得「不想要失去」。也就是覺得「失去這個利益對我來說是損失」。雖然講得稍嫌複雜，但最後都會產生類似的想法。說穿了，就是嫉妒、獨占慾。


    「因為長相帥氣，所以喜歡」、「因為對方有錢，所以喜歡」等等，僅是單純憧憬對自己有利的異性。然而，不論面對哪種類型的異性，只要「能讓對方覺得自己是有利的存在，失去是一種損失」，對方便會湧現「喜歡」的情感。一般來說，「人容易愛上喜歡自己的人」，就利害系統來看，其實相當合情合理。


    利用「間接暗示」讓對方覺得有利益、產生不想失去的感覺，即簡單的戀愛守則，但本書不是講述這類愛情叢書，這邊便不多談。然而，戀愛說穿了就是「嫉妒」與「獨占慾」。某人告白後兩人開始交往，但現在先保持距離……像這樣的戀愛遊戲總是讓人臉紅心跳，不過就心理學的角度來看，交往這項行為只是「當你與其他異性發展成戀愛關係時，我擁有提出意見的權利」；結婚這項的行為僅是「我擁有施以法律制裁的權利」。


    兩者都是從獨占慾衍生出來，不想失去利益、迴避損失的行為。畢竟已經在戀愛上花費許多金錢、時間，只有像這樣衡量自己與對方之間的利害，才能冷靜地維持這段情感，得到期望中的結果。


    ### 催眠狀態的持續時間


    施展催眠術後，經常有人會問：「如果解不開，催眠會一直持續嗎？」我的答案是「沒有這回事，睡一晚後就會解開。」但正確來說是「只要當事人還記得，催眠就會持續存在」。


    換句話說，在他認為「我被催眠了」的期間，會一直處於催眠狀態；當他認為「我沒被催眠了」，催眠也就解開了。

    '
