    # 歷史一百二十年都沒有改變


    催眠術一詞在日本傳播約是在明治二十年（西元一一八七年），也有人說是在更早的時候，催眠大約具有一百二十年以上的歷史。


    當然，我們沒有辦法見到當時的情景，但由拍賣會等地方出現明治時代的古老催眠書籍，其盛行可見一斑。不過這邊並不是要追溯催眠術的歷史。回溯其歷史沒有太大的意義，因為由現代的催眠術來看，可以確信「催眠術沒有任何進步」。


    對「術」的隱匿說法感到憧憬且性格陰沉的人們，願意砸下重金討教學習，其中有些人順利學會，但也有些人不是，而這些順利學會施展催眠術的人，後來又出來當「老師」，收取重金傳授催眠術。


    而那些催眠師，當遇到有人表示自己「我才不會被催眠」，就蔑視對方「你的受暗示性低下」；當遇到容易被催眠的人，就「任由自己擺佈」，讓他被觀眾看笑話。'
  - '[PAGE 177]


    雖然這麼說有些極端，但無論是電視媒體興起的現代，還是 YouTube、社群媒體的網路時代，我想一百三十年都沒有成長的祕術正是催眠術。


    一百三十年來，催眠師給人的傲慢形象已經根深蒂固，如今才想「改變催眠術的形象」，可說是不可能的任務。


    各位想想看，嘴巴說說就能讓手掌張不開，明明是如此神奇的現象，卻少有人想要學習這樣的技術，真是令人不敢相信。


    一百三十年間沒有辦法消除「那只是騙人把戲」的偏見，完全歸咎於催眠師的怠慢。


    雖然不是說所有的催眠師，但很多人穿著前衛視覺、怪異滿點的服裝……


    我曾經有一次在正式表演秀之前，對幾位來賓進行「測試受暗示性」，如「手指黏在一塊」、「整隻手變沉重」等等，但果然有其中幾位得意地伸出沒有黏在一起的手，說：「我不容易被催眠，真是對不起喔。''


    這是因為很多人都認為「催眠術」讓人笑話的節目」。他們不想要上台後被當成跟狗一樣，受到觀衆指指點點、嘲笑一番。


    到底來說，催眠術不適合作為給衆人觀看的表演。僅有被催眠的人才能體會'
  - '[PAGE 178]


    自身發生的變化，在其他人眼中卻是「那是騙人的啦」、「他只是裝作被催眠」、「他識趣上道」，並暗起哄：「咳？！真的嗎？」看到、聽到這樣的反應，催眠師還一臉得意自滿。


    若是在觀眾看到斷體魔術會昏倒的時代就算了，但時至今日，這樣的表演秀怎麼能稱作娛樂節目呢？


    所以，我要鄭重地在這裡說：「催眠術一詞和催眠師應當被毀滅。」


    只要撤出催眠術一詞，只要打著催眠師的名號，就得背負一百三十年來無法抹滅的負債。


    # 「資格」砸錢就可買到


    催眠師其實沒有什麼正式的資格。


    自稱「我擁有正式資格」的催眠師，大多只是拿著個人工作場所頒發的「催眠師證」，'
  - '[PAGE 179]


    眠師認定」、「催眠治療師○級」等證書。


    那些證書，不過是用來誤導人的普通紙張而已──誤導那些不了解催眠術業界的人們，以為「他持有正式資格，所以真的會催眠術」，讓砸錢學習習催眠術的人能夠自誇「我擁有正式資格」。


    大多數的情況是如此，而剩下的少數人，則是由國際大型催眠協會獲得資格。


    那麼，國際資格才是真的？其實不然，實際走訪一趟會發現，國際根本不需要聽課，閱讀幾本相關書籍便能獲得證明，消費相當於幾萬元金額，不久便能收到資格證書，完全淪落為「買賣的商品」。對國際機構來說，只需要頒予認定，就有相當於數十萬元、數百萬元進入口袋，沒有比這更有賺錢的商品吧。


    國際證書還可以引發崇洋情緒。


    美國的確有不少大型的催眠術、催眠治療團體，高喊「催眠療法在國際受到認可」、「歐美有催眠博士的稱號？」但是，為什麼會有人沒有注意到日本其實並未承認這樣的資格，不惜砸錢購買資格呢？


    因為在「售出」資格的同時，也「售出」了教導他人的資格。'
  md: "\n# 不著痕跡地準備，避免遭受質疑\n\n魔術之所以為魔術，是因為表演「從準備階段就已經開始」。當觀眾看到表演者從包包或者口袋裡拿出紙牌、外幣，不論接下來表演多麼不可思議的現象，內心都會產生逃避現實的質疑「那副紙牌有問題」、「那個道具很可疑」。\n\
    \n「因為他有事先準備，所以不管發生多麼神奇的現象，都必定有詐。」觀眾心裡會這麼認為。\n\n「大家好，我是魔術師 Bruce。」只是打招呼，但觀眾會想「他是魔術師，肯定有先練習過表演吧。」並認為「這個人為了讓我驚奇，可是有備而來的」，這樣想法會阻撓觀眾內心產生純粹的驚訝、情感的動搖。\n\
    \n當然，作為一場表演秀，觀眾或許能享受各種魔術演出，但並非真心覺得不可思議。\n\n因此，以超能力表演的超能魔術，不論安排什麼樣的演出，切忌使用「自己準備的道具」（這是我倒的見解）。\n\
    \n使用現場有的紙張、鉛筆，或者借用觀眾帶來的物品，成功表演讀心等現象，才真的教人拍案叫絕。\n\n拿湯匙彎曲的演出為例，比起自己從袋中拿出準備好的湯匙並宣稱「這是剛買來的」，不如此向觀眾借用剛用完餐的湯匙，用餐中紙擦拭乾淨後再表演湯匙彎曲，驚訝度立刻增加數十倍。\n\
    \n對於不曉得從何而來的物品，觀眾會質疑其中有詐，沒辦法給予完全的信賴。\n\n在電影、連續劇中，曾經看過說著「我開好房間。」一面把玩飯店鑰匙的男性（現在請不要這樣做），這正是「打從一開始就別有居心」的代表例子。\n\
    \n女性見到這種行爲，「他今天本來就打算過夜？」會油然而生不信任感。\n\n另一個例子，日本忌諱白包放入新鈔。因為新鈔得由銀行重新印製，可讓人解讀為「早就預想到有人會過世」，是受人避諱的奠儀禮儀。\n\
    \n在商業上，「今天打算和你們簽契約。」客戶話才說完，「我想也是如此。」你就好像等不及一樣，拿出契約書推到客戶面前，笑說：「只蓋蓋印章而已！」這樣的舉動會讓客戶不是滋味。簽契約是讓己方賺錢、贏取利益的行爲，事前準備好契約，會讓客戶強烈覺得是一種損失、弊害。\n\
    \n話題回到魔術上。\n\n「請教教我能在飲酒會、聯歡會上簡單表演的紙牌魔術。」經常有客人這麼討教，但請仔細想一下，當你在聚會上從包包裡拿出撲克牌，「那個人想要表演魔術來吊女人。」不是馬上露餡你居心不良了嗎？\n\
    \n真的能夠吸引對方的是，「經過計算但表現得不着痕跡」的行爲。\n\n簽約時，你得先表現得一臉意外。哎！真的嗎！才翻找包包拿出契約書；約會時你得確定女性願意一起過夜，才慌張地預約飯店。\n\
    \n當然，這些實際上都是經過計算的行爲。\n\n# 史上最厲害的魔術\n\n稍微偏離話題一下，提到魔術的事前準備，每當被問到：「哪個魔術最厲害？」我都會分享以前的經驗。\n\
    \n我開始接觸魔術時，老家神戶有間英式酒吧，我每週約會去表演兩次魔術秀（雖然現在那家店已經收掉了）。\n\n當然，我那時還在跟當地的魔術師慢慢學習，只能算是初學者，在酒吧獻醜，很多時候難以稱作是魔術秀，被客人辱罵、跟酒醉的客人吵架是家常便飯。\n\
    \n那個時候，供我上台表演魔術的酒吧，打算舉辦吸引客人的活動，利用當時的社群網站企劃「魔術愛好者聚會」。\n\n那是一個月一次的聚會，辦得還算不錯，每次都有數十人前來參加。某一天，我在那間酒吧討教的魔術師更上面的老師，「穆罕默德・福岡」大師突然光臨酒吧。\n\
    \n看完魔術的福岡大師，「不錯，表演得很有氣氛。」不吝惜稱讚我，接著準備打造回府：「那麼，有緣再見。」\n\n「大師，能否請您表演一個魔術？」我惶恐地拜託。「不了，我沒有什麼好表演的魔術。」「拜託，一個就好。」「那就一個吧。我借用一下那邊的紙牌。」「大師伸手拿起不曉得誰玩完沒有整理，隨意堆放在店裡一角的破爛紙牌。副牌就夠了。」大師說完就開始表演魔術。\n\
    \n「別這樣，大師！我馬上拆封一副新的紙牌！」「我馬上說道。「不用啦，這真的是不可思議的魔術。詳細的過程省略不說，簡單講就是大師依序說中我和其他觀眾手中的牌組。我當下非常感動，當天聚會就這樣落幕。\n\
    \n事後，我始終忘不了福岡大師的魔術，翻閱了各種書籍，真的讓我找到完全相同的魔術。\n\n但是，書上卻這麼描述：\n\n> 「紙牌的排列要看似凌亂卻有規則。所有的紙牌都要事前準備好。」\n\
    \n此時，我再次對這個魔術感動，真的流出眼淚。\n\n換句話說，福岡大師為了前來表演，幾天前就來過這間英式酒吧，在店內一角留下有規則排列的紙牌。  \n那些紙牌可能被店員收掉，也可能遭人動過而改變排列。真要說的話，若是\n\
    \n我那天沒有要求「請您表演一個魔術」，福岡大師大概會當作什麼事都沒發生，  \n直接離開吧。\n\n我這時才真正了解。想要讓觀衆看得盡興，需要如此柔軟思考、事前做好準備，這樣才是真正的魔術師。\n\
    \n### 最簡單的催眠術\n\n哪種催眠術最簡單？  \n稍有涉獵的人可能會舉出「兩根手指黏在一塊！」「整隻手變沉重！」「左右擺動硬幣！」等各種誘導催眠吧。\
    \  \n我認為最簡單的催眠術是「微笑打招呼」。\n\n好！\n\n「你好，我是 Bruce！」當我微笑向他人搭話時，對方也會回以微笑：「你好，我是 Bruce。我能夠讀取別人的內心。」\
    \  \n一臉嚴肅地打招呼，對方也會一表正經回看你。\n\n想成是陪著哭、跟著笑的情景會比較容易理解，亦即對方跟自己的情感同調。\n\n當你看漫畫看得哈哈大笑，朋友會邊微笑邊湊近：「什麼劇情這麼好笑？」這是朋友與你的情感同調，或說是「對你敞開心房」的狀態。\n\
    \n這算是催眠術的基本形式。\n\n上台表演魔術秀時，「大家好，我是 Bruce！」我接著會邊微笑邊說：「說來丟臉，我剛剛不小心迷路了。」\n\n此時，我會觀察會場當中，約有多少觀眾跟著我笑起來。如果遇到沒有任何人跟著笑，那麼接下來不管做什麼，表演都不會順利。\n\
    \n專業相聲演員或者工作上需在眾人面前開口的人，都有過類似的體會吧。\n\n「場子暖起來」可說是「對表演者、演出企劃建立信賴關係（投契關係）的狀態」。\n\n\
    那麼，為什麼「微笑」的情感會比「一臉嚴肅」更簡單呢？這是因為「微笑」這個行為，不會讓人覺得有什麼壞處。\n\n哪天你想要測量或者縮短與顧客、戀人之間的距離，你可以先帶著笑容打招呼，嘴角輕輕揚起說些好笑的内容。\n\
    \n若是對方無動於衷，請繼續若無其事地閒話家常，直到對方笑起來。在情感沒有傳達出去的狀態下，不論談多麼重要的商談、事情，都絕對不會有好的局面出現。\n\n\
    身體僵直的催眠也是相同的做法，自己先要真的認為肌肉會僵直，再說：「肌肉變得僵直！」笑個不停的催眠，要自己先真的認為很有趣，邊笑邊說：「你會笑到停不下來！」確實讓對方與你情感同調，這些現象都不難做到。\n\
    \n想要掌握所有催眠術的根本，莫過於「微笑打招呼」。\n\n# 耍人要真心才有效\n\n在魔術界，有稱這種演出名為「耍人戲法（Sucker Trick）」。即便不曉得這個名詞，應該也曾經聽過類似的現象。\n\
    \n「你抽出的牌是紅心3吧！」「不是。」「哎！弄錯了嗎！？不過，把這張紅心3在袖子上摩擦一下，就變成你抽出的牌了！」\n\n換句話說，這是刻意讓對方覺得魔術失手，但卻在其他地方成功的把戲。\n\
    \n說穿了，觀眾內心多多少少都會想「魔術失手也會很有趣：……」才剛想說魔術師回應了這份期待，不料馬上遭到背叛，如同在傷口上塗抹鹽巴再貼OK繃的演出。\n\n\
    因為有太多魔術師都用這招，最近即便說：「蛤！搞錯了嗎？」觀眾只會反應：「少來這一套，你早就知道我抽出的牌吧？」「反正你最後還是會說中嘛？」\n\n翻開魔術教材，裡頭寫到「先假裝表演失敗，最後再背叛觀眾，說中他抽出的牌」，但許多魔術師都沒有了解這句話的本質。\n\
    \n真正的重點不是說中紙牌，而是讓觀眾覺得「失手了？」「聽起來理所當然，然而，現在許多的專業魔術師，都只是平淡地說：「蛤？搞錯了嗎！換句話說，他們根本沒有真心想要耍人。\n\
    \n「我其實早就知道你抽出什麼牌了！！甚至還有魔術師毫不掩飾，矯揉造作地說：「搞錯了嗎！」真是讓人不勝唏噓。\n\n沒有比預定和諧的緊張刺激，更為無聊的事情。\n\
    \n試想，在看動作電影時，打出字幕「拍攝場景皆有考慮演員的人身安全」。這根本是荒誕至極。\n\n即便知道那是電影，即便早就了解魔術手法，觀眾還是想要沉浸其中，體驗刺激。想要說謊，那就得真心扯謊才行，只有真心的謊言才有辦法把對方拉進恍若電影般的世界當中。\n\
    \n# 在戀愛上活用「吊橋效應」\n\n「吊橋效應」是有名的心理效應，很多人都有聽過吧（這個效應是不是真的這麼有名，我自己抱有很大的疑問……）。\n\n在安穩的地面上與在搖晃的吊橋上，對異性說「之後再聯絡」而真的有繼往的情況，實驗的結果顯示，在吊橋上傳達的成功率會高出兩倍。\n\
    \n原理是人容易將外因造成的心跳數上升，誤以為是對異性的戀愛情懷。如果真的只靠怦然心動，就能讓對方誤以為對異性產生戀愛情懷，那麼世上所有的人，現在都應該馬上練習加快他人心跳的方法吧……\n\
    \n就催眠術的觀點來說，產生戀愛情懷時，有些人會心跳加快，但有些人卻不會。\n\n如同被催眠「你現在是一條狗！」，有些人會變成大型犬，但有些人會變成小型犬，一樣米養百樣人，每人的戀愛觀、經驗都不同，所以需先設想對方產生戀愛情感、對異性抱持憧憬時，內心會發生什麼變化。\n\
    \n實際上，在吊橋上成功的機率為67%，在安穩場所成功的機率為37%，單就「戀愛∥心跳加速」，亂槍打鳥的效果還算不錯。\n\n然而，利用暗示、催眠來控制對方的場合，通常是針對特定的人，不可能每天十幾個人分別帶到吊橋上。\n\
    \n不過，催眠術、暗示是在對話中也能進行的高明話術。\n\n雖然未經過實驗證實，但有許多加快心跳的有效方法。產生戀愛情感、對異性抱持憧憬的當下，內心會發生什麼變化？答案請直接詢問對方就好。\n\
    \n拋出類似下面的問句，對方便會在腦中浮現符合條件的異性。\n\n- 「妳過去最喜歡的人，是怎麼樣的人？」\n- 「妳現在最想見到誰？對方是演藝人員也沒關係。」\n\
    - 「當妳非常喜歡對方時，會採取什麼樣的行動？」\n\n這樣問下來，對方就有機會心跳加速。當然，對方也有可能想起苦澀的戀\n\n情，頻頻嘆氣；也有可能想起已逝的戀人，傷心落淚。\n\
    \n但是，內心產生這些情感的當下，對方眼前的人就是你。這可說是在現代戀愛上活用「吊橋效應」的正確方法。\n\n「向異性朋友尋求戀愛上的建議，最後跟那位朋友走到一起。」這樣的例子真的不少見。\n\
    \n就像看完恐怖片後，會突然對隨處可見的廚房門、房間門感到毛毛的，面對再熟悉不過的朋友——你，邊想像喜歡、憧憬的人邊尋求建議時，對方有機會把你視為戀愛對象。沒錯，即使你只是那扇有點髒髒的廚房門。\n\
    \n# 不被拒絕求人術\n\n如自己所願地控制對方，對於「能為我做……嗎？」像是「跟我交往」、「拜託工作」等要求，對方全都回答「好的，我很樂意」。簡單講，就是不讓對方說「不」的方法。\n\
    \n如果對方說「不」。拒絕的理由如同前面的解說，只是「因為沒有好處」。比如，有一位朋友邀你：「一起去吃碗拉麵吧。」\n\n沒錯，那位朋友在你讀這本書的現在，邀請你一同外出用餐。選擇拒絕的人，心中應該會浮現各種壞處，如「沒有錢」等等，也有人會想說，「現在肚子沒有很餓，去居酒屋小吃一下還可以，但去拉麵店就得點一大碗的拉麵。我是可以只跟朋友討一口吃啦，不過這樣好浪費時間。」\n\
    \n那麼，如果邀的人是你憧憬的異性呢？你大概就會去了，沒錯吧？\n\n對於一件拜託，會想得如此複雜的動物就是人類。換句話說，聽到「跟我交往」的瞬間，腦海中會立刻分析，「雖然我喜歡年紀比我小的人，但年長者的經濟能力很有魅力。可是，被朋友認為自己和中年大叔交往，又覺得挺丟臉的，而且，如果發展到結婚關係，他的年齡又不好向父母介紹。」即便不是「瞬間，在數秒內就會將利害放到天秤上衡量，評估各種好處與壞處。\n\
    \n而我要介紹的不被拒絕拜託方式，不是其他心理書籍、心靈控制術等可疑叢\n\n書中，「YesSir語法」、「叫名字比較有親近感」等技巧。\n\n而是能向對方傳遞多少「和我交往能讓你得這麼多好處！」「拜託工作的場合，就展現『做這件工作能讓你得這麼多好處！』『就男女交往往來說，只要讓對方感到『和這個人交往好處多多』，即便沒有主動告白，對方也會自己貼過來。\n\
    \n若想要跟異性交往，但告白卻屢屢失敗，你得改變一下根本觀念。\n\n只要不斷展現「我能給你這麼多好處」，就不會碰一鼻子灰。\n\n了解對方對自己抱有什麼印象，假設是「聽這傢伙講話就教人氣憤」，想讓這樣的人答應交往，難易度會非常高吧。\n\
    \n被部下討厭的主管、被後輩討厭的前輩，或者相反的情況，必須聽從後輩指示的前輩、不得不採納部下點子的資深主管……\n\n在金字塔階級較分明的職場，拜託他人是否成功的關鍵就在於，該怎麼展現對方能獲得好處，創造對方自願帶著肯定回答來找你的狀況。\n\
    \n# 催眠術是心理學嗎？\n\n該如何辨認對方是否中暗示？催眠術指南書常會舉手掌的發汗狀況、閉眼的眼球運動、臉部肌肉的鬆弛狀況等。\n\n這些特徵屬於基礎心理學中的生理心理學（探討生理活動與心理現象之間的連結）。\n\
    \n當然，讀取各種徵兆判斷是否中暗示很重要，但置入暗示的前提部分，亦即前暗示的部分，就前面解說的「利害系統」來看，會比較接近「數學心理學」。\n\n將利害系統化為數值，辨別受術者「有無進入催眠狀態」。\n\
    \n而暗示的部分，譬如「周圍的人都催眠了，所以我也會被催眠」、「周圍沒有人被催眠，只有我被催眠就太丟臉了」，這種想法則偏向社會心理學（社會環境的影響對心理產生的效果）。\n\
    \n不過，無論是數值化還是統計化，催眠和被催眠之間並非不連續的數位狀態，而是連續的類比狀態。只要身為人類，1與0之間還存在著0.5、0.52。\n\n# 催眠術與低飛球技巧\n\
    \n催眠師所需要的能力，是洞察心理上微妙的數值變化，了解對方當下為何種數值。\n\n只是透過學習心理學，掌握「這個現象是根據這項理論」的結果論，對催眠技巧完全沒有幫助。\n\
    \n「低飛球技巧（low-ball technique）」，是先提出簡單的條件讓對方吞下，後面卻突然改變，讓對方不好否定已經做出的承諾，巧妙利用「事先取得承諾請求法」的商談技巧。\n\
    \n低飛球（low-ball）是設想别人一開始容易接受的條件，比如，店家先以「便宜！大拍賣！」等口號吸引客人上門，最後才在結帳時說：「這幾樣商品不是優惠對象。」「在成人影片，中，風俗店會用「看看小姐也行」之類的說詞來拉客\n\
    \n(勸誘方式純屬想像虛構)。\n\n施展催眠術時，很多人一開始會說，「好可怕！」「不曉得會發生什麼事，我不要！」他們會這樣說，是因為認為「我被催眠後，可能會被做奇怪的事」。\n\
    \n重點在於「我被催眠的話」，這樣設想就等同於預設自己會中催眠術。「我大概會被催眠吧。我好怕被催眠後，不曉得會被怎麼樣。」「這樣思考的人容易中催眠術(建立催眠術的投契關係)。\n\
    \n遇到這樣的人，表演者還是得想辦法讓催眠秀進行下去。\n\n然而，「沒事的，我不會害你啦，總之你就試試看嘛。」「這樣的勸說跟影片中的勸誘方式沒有兩樣。「只是手變僵直！真的就手變僵直而已！」在催眠師苦口婆心的勸說下勉強接受請求，受術者卻沒有注意到手變僵直的嚴重性。對沒有過催眠經驗的人來說，手得僵直可是件不得了的事情。\n\
    \n催眠術中的「低飛球」出現在哪邊？答案是把催眠術本身包裝成「低飛球」的最初「對話」。\n\n- 「你聽過身體束縛嗎？那其實是催眠術的一種。」\n- 「有些國家承認催眠術的醫療效果。」\n\
    - 「你知道刨冰的味道其實都一樣嗎？只是因為不同顏色的暗示，才產生味覺上的變化喔。」\n\n像這樣將催眠術中肌肉僵直（Catas）等術語，轉換成味覺變化等日常現象，「這樣啊，原來大家平常都會被催眠嘛。」便能讓對方產生這樣的想法。\n\
    \n這就是催眠術上「讓對方接低下飛球」。\n\n開始催眠時，「上小學的時候，你應該也有玩過才對？兩手像黏在一起一樣交指相握。」邊說邊在對方眼前實際表演。\n\
    \n「這是小學生也會做的事情」、「我現在也在你的眼前做」、「這一點都不可怕」，重要的是誇張表現，自然傳達「沒有人會因催眠而死亡」的意圖。\n\n當然，判斷對方上鉤後，馬上投出低飛球：「瞧！你真的動不了！變得硬梆梆了！」\n\
    \n# 催眠術應當被毀滅\n\n![](img/01c0a84ac99c39972bbc7f26fee40445_175_0.png)\n\n# 歷史一百二十年都沒有改變\n\
    \n催眠術一詞在日本傳播約是在明治二十年（西元一一八七年），也有人說是在更早的時候，催眠大約具有一百二十年以上的歷史。\n\n當然，我們沒有辦法見到當時的情景，但由拍賣會等地方出現明治時代的古老催眠書籍，其盛行可見一斑。不過這邊並不是要追溯催眠術的歷史。回溯其歷史沒有太大的意義，因為由現代的催眠術來看，可以確信「催眠術沒有任何進步」。\n\
    \n對「術」的隱匿說法感到憧憬且性格陰沉的人們，願意砸下重金討教學習，其中有些人順利學會，但也有些人不是，而這些順利學會施展催眠術的人，後來又出來當「老師」，收取重金傳授催眠術。\n\
    \n而那些催眠師，當遇到有人表示自己「我才不會被催眠」，就蔑視對方「你的受暗示性低下」；當遇到容易被催眠的人，就「任由自己擺佈」，讓他被觀眾看笑話。\n\n\
    雖然這麼說有些極端，但無論是電視媒體興起的現代，還是 YouTube、社群媒體的網路時代，我想一百三十年都沒有成長的祕術正是催眠術。\n\n一百三十年來，催眠師給人的傲慢形象已經根深蒂固，如今才想「改變催眠術的形象」，可說是不可能的任務。\n\
    \n各位想想看，嘴巴說說就能讓手掌張不開，明明是如此神奇的現象，卻少有人想要學習這樣的技術，真是令人不敢相信。\n\n一百三十年間沒有辦法消除「那只是騙人把戲」的偏見，完全歸咎於催眠師的怠慢。\n\
    \n雖然不是說所有的催眠師，但很多人穿著前衛視覺、怪異滿點的服裝……\n\n我曾經有一次在正式表演秀之前，對幾位來賓進行「測試受暗示性」，如「手指黏在一塊」、「整隻手變沉重」等等，但果然有其中幾位得意地伸出沒有黏在一起的手，說：「我不容易被催眠，真是對不起喔。'\n\
    \n這是因為很多人都認為「催眠術」讓人笑話的節目」。他們不想要上台後被當成跟狗一樣，受到觀衆指指點點、嘲笑一番。\n\n到底來說，催眠術不適合作為給衆人觀看的表演。僅有被催眠的人才能體會\n\
    \n自身發生的變化，在其他人眼中卻是「那是騙人的啦」、「他只是裝作被催眠」、「他識趣上道」，並暗起哄：「咳？！真的嗎？」看到、聽到這樣的反應，催眠師還一臉得意自滿。\n\
    \n若是在觀眾看到斷體魔術會昏倒的時代就算了，但時至今日，這樣的表演秀怎麼能稱作娛樂節目呢？\n\n所以，我要鄭重地在這裡說：「催眠術一詞和催眠師應當被毀滅。」\n\
    \n只要撤出催眠術一詞，只要打著催眠師的名號，就得背負一百三十年來無法抹滅的負債。\n\n### 「資格」砸錢就可買到\n\n催眠師其實沒有什麼正式的資格。\n\
    \n自稱「我擁有正式資格」的催眠師，大多只是拿著個人工作場所頒發的「催眠師證」，\n\n眠師認定」、「催眠治療師○級」等證書。\n\n那些證書，不過是用來誤導人的普通紙張而已──誤導那些不了解催眠術業界的人們，以為「他持有正式資格，所以真的會催眠術」，讓砸錢學習習催眠術的人能夠自誇「我擁有正式資格」。\n\
    \n大多數的情況是如此，而剩下的少數人，則是由國際大型催眠協會獲得資格。\n\n那麼，國際資格才是真的？其實不然，實際走訪一趟會發現，國際根本不需要聽課，閱讀幾本相關書籍便能獲得證明，消費相當於幾萬元金額，不久便能收到資格證書，完全淪落為「買賣的商品」。對國際機構來說，只需要頒予認定，就有相當於數十萬元、數百萬元進入口袋，沒有比這更有賺錢的商品吧。\n\
    \n國際證書還可以引發崇洋情緒。\n\n美國的確有不少大型的催眠術、催眠治療團體，高喊「催眠療法在國際受到認可」、「歐美有催眠博士的稱號？」但是，為什麼會有人沒有注意到日本其實並未承認這樣的資格，不惜砸錢購買資格呢？\n\
    \n因為在「售出」資格的同時，也「售出」了教導他人的資格。\n"
  mdcn: "\n# 不著痕跡地準備，避免遭受質疑\n\n魔術之所以為魔術，是因為表演「從準備階段就已經開始」。當觀眾看到表演者從包包或者口袋裡拿出紙牌、外幣，不論接下來表演多麼不可思議的現象，內心都會產生逃避現實的質疑「那副紙牌有問題」、「那個道具很可疑」。\n\
    \n「因為他有事先準備，所以不管發生多麼神奇的現象，都必定有詐。」觀眾心裡會這麼認為。\n\n「大家好，我是魔術師 Bruce。」只是打招呼，但觀眾會想「他是魔術師，肯定有先練習過表演吧。」並認為「這個人為了讓我驚奇，可是有備而來的」，這樣想法會阻撓觀眾內心產生純粹的驚訝、情感的動搖。\n\
    \n當然，作為一場表演秀，觀眾或許能享受各種魔術演出，但並非真心覺得不可思議。\n\n因此，以超能力表演的超能魔術，不論安排什麼樣的演出，切忌使用「自己準備的道具」（這是我倒的見解）。\n\
    \n使用現場有的紙張、鉛筆，或者借用觀眾帶來的物品，成功表演讀心等現象，才真的教人拍案叫絕。\n\n拿湯匙彎曲的演出為例，比起自己從袋中拿出準備好的湯匙並宣稱「這是剛買來的」，不如此向觀眾借用剛用完餐的湯匙，用餐中紙擦拭乾淨後再表演湯匙彎曲，驚訝度立刻增加數十倍。\n\
    \n對於不曉得從何而來的物品，觀眾會質疑其中有詐，沒辦法給予完全的信賴。\n\n在電影、連續劇中，曾經看過說著「我開好房間。」一面把玩飯店鑰匙的男性（現在請不要這樣做），這正是「打從一開始就別有居心」的代表例子。\n\
    \n女性見到這種行爲，「他今天本來就打算過夜？」會油然而生不信任感。\n\n另一個例子，日本忌諱白包放入新鈔。因為新鈔得由銀行重新印製，可讓人解讀為「早就預想到有人會過世」，是受人避諱的奠儀禮儀。\n\
    \n在商業上，「今天打算和你們簽契約。」客戶話才說完，「我想也是如此。」你就好像等不及一樣，拿出契約書推到客戶面前，笑說：「只蓋蓋印章而已！」這樣的舉動會讓客戶不是滋味。簽契約是讓己方賺錢、贏取利益的行爲，事前準備好契約，會讓客戶強烈覺得是一種損失、弊害。\n\
    \n話題回到魔術上。\n\n「請教教我能在飲酒會、聯歡會上簡單表演的紙牌魔術。」經常有客人這麼討教，但請仔細想一下，當你在聚會上從包包裡拿出撲克牌，「那個人想要表演魔術來吊女人。」不是馬上露餡你居心不良了嗎？\n\
    \n真的能夠吸引對方的是，「經過計算但表現得不着痕跡」的行爲。\n\n簽約時，你得先表現得一臉意外。哎！真的嗎！才翻找包包拿出契約書；約會時你得確定女性願意一起過夜，才慌張地預約飯店。\n\
    \n當然，這些實際上都是經過計算的行爲。\n\n# 史上最厲害的魔術\n\n稍微偏離話題一下，提到魔術的事前準備，每當被問到：「哪個魔術最厲害？」我都會分享以前的經驗。\n\
    \n我開始接觸魔術時，老家神戶有間英式酒吧，我每週約會去表演兩次魔術秀（雖然現在那家店已經收掉了）。\n\n當然，我那時還在跟當地的魔術師慢慢學習，只能算是初學者，在酒吧獻醜，很多時候難以稱作是魔術秀，被客人辱罵、跟酒醉的客人吵架是家常便飯。\n\
    \n那個時候，供我上台表演魔術的酒吧，打算舉辦吸引客人的活動，利用當時的社群網站企劃「魔術愛好者聚會」。\n\n那是一個月一次的聚會，辦得還算不錯，每次都有數十人前來參加。某一天，我在那間酒吧討教的魔術師更上面的老師，「穆罕默德・福岡」大師突然光臨酒吧。\n\
    \n看完魔術的福岡大師，「不錯，表演得很有氣氛。」不吝惜稱讚我，接著準備打造回府：「那麼，有緣再見。」\n\n「大師，能否請您表演一個魔術？」我惶恐地拜託。「不了，我沒有什麼好表演的魔術。」「拜託，一個就好。」「那就一個吧。我借用一下那邊的紙牌。」「大師伸手拿起不曉得誰玩完沒有整理，隨意堆放在店裡一角的破爛紙牌。副牌就夠了。」大師說完就開始表演魔術。\n\
    \n「別這樣，大師！我馬上拆封一副新的紙牌！」「我馬上說道。「不用啦，這真的是不可思議的魔術。詳細的過程省略不說，簡單講就是大師依序說中我和其他觀眾手中的牌組。我當下非常感動，當天聚會就這樣落幕。\n\
    \n事後，我始終忘不了福岡大師的魔術，翻閱了各種書籍，真的讓我找到完全相同的魔術。\n\n但是，書上卻這麼描述：\n\n> 「紙牌的排列要看似凌亂卻有規則。所有的紙牌都要事前準備好。」\n\
    \n此時，我再次對這個魔術感動，真的流出眼淚。\n\n換句話說，福岡大師為了前來表演，幾天前就來過這間英式酒吧，在店內一角留下有規則排列的紙牌。  \n那些紙牌可能被店員收掉，也可能遭人動過而改變排列。真要說的話，若是\n\
    \n我那天沒有要求「請您表演一個魔術」，福岡大師大概會當作什麼事都沒發生，  \n直接離開吧。\n\n我這時才真正了解。想要讓觀衆看得盡興，需要如此柔軟思考、事前做好準備，這樣才是真正的魔術師。\n\
    \n### 最簡單的催眠術\n\n哪種催眠術最簡單？  \n稍有涉獵的人可能會舉出「兩根手指黏在一塊！」「整隻手變沉重！」「左右擺動硬幣！」等各種誘導催眠吧。\
    \  \n我認為最簡單的催眠術是「微笑打招呼」。\n\n好！\n\n「你好，我是 Bruce！」當我微笑向他人搭話時，對方也會回以微笑：「你好，我是 Bruce。我能夠讀取別人的內心。」\
    \  \n一臉嚴肅地打招呼，對方也會一表正經回看你。\n\n想成是陪著哭、跟著笑的情景會比較容易理解，亦即對方跟自己的情感同調。\n\n當你看漫畫看得哈哈大笑，朋友會邊微笑邊湊近：「什麼劇情這麼好笑？」這是朋友與你的情感同調，或說是「對你敞開心房」的狀態。\n\
    \n這算是催眠術的基本形式。\n\n上台表演魔術秀時，「大家好，我是 Bruce！」我接著會邊微笑邊說：「說來丟臉，我剛剛不小心迷路了。」\n\n此時，我會觀察會場當中，約有多少觀眾跟著我笑起來。如果遇到沒有任何人跟著笑，那麼接下來不管做什麼，表演都不會順利。\n\
    \n專業相聲演員或者工作上需在眾人面前開口的人，都有過類似的體會吧。\n\n「場子暖起來」可說是「對表演者、演出企劃建立信賴關係（投契關係）的狀態」。\n\n\
    那麼，為什麼「微笑」的情感會比「一臉嚴肅」更簡單呢？這是因為「微笑」這個行為，不會讓人覺得有什麼壞處。\n\n哪天你想要測量或者縮短與顧客、戀人之間的距離，你可以先帶著笑容打招呼，嘴角輕輕揚起說些好笑的内容。\n\
    \n若是對方無動於衷，請繼續若無其事地閒話家常，直到對方笑起來。在情感沒有傳達出去的狀態下，不論談多麼重要的商談、事情，都絕對不會有好的局面出現。\n\n\
    身體僵直的催眠也是相同的做法，自己先要真的認為肌肉會僵直，再說：「肌肉變得僵直！」笑個不停的催眠，要自己先真的認為很有趣，邊笑邊說：「你會笑到停不下來！」確實讓對方與你情感同調，這些現象都不難做到。\n\
    \n想要掌握所有催眠術的根本，莫過於「微笑打招呼」。\n\n# 耍人要真心才有效\n\n在魔術界，有稱這種演出名為「耍人戲法（Sucker Trick）」。即便不曉得這個名詞，應該也曾經聽過類似的現象。\n\
    \n「你抽出的牌是紅心3吧！」「不是。」「哎！弄錯了嗎！？不過，把這張紅心3在袖子上摩擦一下，就變成你抽出的牌了！」\n\n換句話說，這是刻意讓對方覺得魔術失手，但卻在其他地方成功的把戲。\n\
    \n說穿了，觀眾內心多多少少都會想「魔術失手也會很有趣：……」才剛想說魔術師回應了這份期待，不料馬上遭到背叛，如同在傷口上塗抹鹽巴再貼OK繃的演出。\n\n\
    因為有太多魔術師都用這招，最近即便說：「蛤！搞錯了嗎？」觀眾只會反應：「少來這一套，你早就知道我抽出的牌吧？」「反正你最後還是會說中嘛？」\n\n翻開魔術教材，裡頭寫到「先假裝表演失敗，最後再背叛觀眾，說中他抽出的牌」，但許多魔術師都沒有了解這句話的本質。\n\
    \n真正的重點不是說中紙牌，而是讓觀眾覺得「失手了？」「聽起來理所當然，然而，現在許多的專業魔術師，都只是平淡地說：「蛤？搞錯了嗎！換句話說，他們根本沒有真心想要耍人。\n\
    \n「我其實早就知道你抽出什麼牌了！！甚至還有魔術師毫不掩飾，矯揉造作地說：「搞錯了嗎！」真是讓人不勝唏噓。\n\n沒有比預定和諧的緊張刺激，更為無聊的事情。\n\
    \n試想，在看動作電影時，打出字幕「拍攝場景皆有考慮演員的人身安全」。這根本是荒誕至極。\n\n即便知道那是電影，即便早就了解魔術手法，觀眾還是想要沉浸其中，體驗刺激。想要說謊，那就得真心扯謊才行，只有真心的謊言才有辦法把對方拉進恍若電影般的世界當中。\n\
    \n# 在戀愛上活用「吊橋效應」\n\n「吊橋效應」是有名的心理效應，很多人都有聽過吧（這個效應是不是真的這麼有名，我自己抱有很大的疑問……）。\n\n在安穩的地面上與在搖晃的吊橋上，對異性說「之後再聯絡」而真的有繼往的情況，實驗的結果顯示，在吊橋上傳達的成功率會高出兩倍。\n\
    \n原理是人容易將外因造成的心跳數上升，誤以為是對異性的戀愛情懷。如果真的只靠怦然心動，就能讓對方誤以為對異性產生戀愛情懷，那麼世上所有的人，現在都應該馬上練習加快他人心跳的方法吧……\n\
    \n就催眠術的觀點來說，產生戀愛情懷時，有些人會心跳加快，但有些人卻不會。\n\n如同被催眠「你現在是一條狗！」，有些人會變成大型犬，但有些人會變成小型犬，一樣米養百樣人，每人的戀愛觀、經驗都不同，所以需先設想對方產生戀愛情感、對異性抱持憧憬時，內心會發生什麼變化。\n\
    \n實際上，在吊橋上成功的機率為67%，在安穩場所成功的機率為37%，單就「戀愛∥心跳加速」，亂槍打鳥的效果還算不錯。\n\n然而，利用暗示、催眠來控制對方的場合，通常是針對特定的人，不可能每天十幾個人分別帶到吊橋上。\n\
    \n不過，催眠術、暗示是在對話中也能進行的高明話術。\n\n雖然未經過實驗證實，但有許多加快心跳的有效方法。產生戀愛情感、對異性抱持憧憬的當下，內心會發生什麼變化？答案請直接詢問對方就好。\n\
    \n拋出類似下面的問句，對方便會在腦中浮現符合條件的異性。\n\n- 「妳過去最喜歡的人，是怎麼樣的人？」\n- 「妳現在最想見到誰？對方是演藝人員也沒關係。」\n\
    - 「當妳非常喜歡對方時，會採取什麼樣的行動？」\n\n這樣問下來，對方就有機會心跳加速。當然，對方也有可能想起苦澀的戀\n\n情，頻頻嘆氣；也有可能想起已逝的戀人，傷心落淚。\n\
    \n但是，內心產生這些情感的當下，對方眼前的人就是你。這可說是在現代戀愛上活用「吊橋效應」的正確方法。\n\n「向異性朋友尋求戀愛上的建議，最後跟那位朋友走到一起。」這樣的例子真的不少見。\n\
    \n就像看完恐怖片後，會突然對隨處可見的廚房門、房間門感到毛毛的，面對再熟悉不過的朋友——你，邊想像喜歡、憧憬的人邊尋求建議時，對方有機會把你視為戀愛對象。沒錯，即使你只是那扇有點髒髒的廚房門。\n\
    \n# 不被拒絕求人術\n\n如自己所願地控制對方，對於「能為我做……嗎？」像是「跟我交往」、「拜託工作」等要求，對方全都回答「好的，我很樂意」。簡單講，就是不讓對方說「不」的方法。\n\
    \n如果對方說「不」。拒絕的理由如同前面的解說，只是「因為沒有好處」。比如，有一位朋友邀你：「一起去吃碗拉麵吧。」\n\n沒錯，那位朋友在你讀這本書的現在，邀請你一同外出用餐。選擇拒絕的人，心中應該會浮現各種壞處，如「沒有錢」等等，也有人會想說，「現在肚子沒有很餓，去居酒屋小吃一下還可以，但去拉麵店就得點一大碗的拉麵。我是可以只跟朋友討一口吃啦，不過這樣好浪費時間。」\n\
    \n那麼，如果邀的人是你憧憬的異性呢？你大概就會去了，沒錯吧？\n\n對於一件拜託，會想得如此複雜的動物就是人類。換句話說，聽到「跟我交往」的瞬間，腦海中會立刻分析，「雖然我喜歡年紀比我小的人，但年長者的經濟能力很有魅力。可是，被朋友認為自己和中年大叔交往，又覺得挺丟臉的，而且，如果發展到結婚關係，他的年齡又不好向父母介紹。」即便不是「瞬間，在數秒內就會將利害放到天秤上衡量，評估各種好處與壞處。\n\
    \n而我要介紹的不被拒絕拜託方式，不是其他心理書籍、心靈控制術等可疑叢\n\n書中，「YesSir語法」、「叫名字比較有親近感」等技巧。\n\n而是能向對方傳遞多少「和我交往能讓你得這麼多好處！」「拜託工作的場合，就展現『做這件工作能讓你得這麼多好處！』『就男女交往往來說，只要讓對方感到『和這個人交往好處多多』，即便沒有主動告白，對方也會自己貼過來。\n\
    \n若想要跟異性交往，但告白卻屢屢失敗，你得改變一下根本觀念。\n\n只要不斷展現「我能給你這麼多好處」，就不會碰一鼻子灰。\n\n了解對方對自己抱有什麼印象，假設是「聽這傢伙講話就教人氣憤」，想讓這樣的人答應交往，難易度會非常高吧。\n\
    \n被部下討厭的主管、被後輩討厭的前輩，或者相反的情況，必須聽從後輩指示的前輩、不得不採納部下點子的資深主管……\n\n在金字塔階級較分明的職場，拜託他人是否成功的關鍵就在於，該怎麼展現對方能獲得好處，創造對方自願帶著肯定回答來找你的狀況。\n\
    \n# 催眠術是心理學嗎？\n\n該如何辨認對方是否中暗示？催眠術指南書常會舉手掌的發汗狀況、閉眼的眼球運動、臉部肌肉的鬆弛狀況等。\n\n這些特徵屬於基礎心理學中的生理心理學（探討生理活動與心理現象之間的連結）。\n\
    \n當然，讀取各種徵兆判斷是否中暗示很重要，但置入暗示的前提部分，亦即前暗示的部分，就前面解說的「利害系統」來看，會比較接近「數學心理學」。\n\n將利害系統化為數值，辨別受術者「有無進入催眠狀態」。\n\
    \n而暗示的部分，譬如「周圍的人都催眠了，所以我也會被催眠」、「周圍沒有人被催眠，只有我被催眠就太丟臉了」，這種想法則偏向社會心理學（社會環境的影響對心理產生的效果）。\n\
    \n不過，無論是數值化還是統計化，催眠和被催眠之間並非不連續的數位狀態，而是連續的類比狀態。只要身為人類，1與0之間還存在著0.5、0.52。\n\n# 催眠術與低飛球技巧\n\
    \n催眠師所需要的能力，是洞察心理上微妙的數值變化，了解對方當下為何種數值。\n\n只是透過學習心理學，掌握「這個現象是根據這項理論」的結果論，對催眠技巧完全沒有幫助。\n\
    \n「低飛球技巧（low-ball technique）」，是先提出簡單的條件讓對方吞下，後面卻突然改變，讓對方不好否定已經做出的承諾，巧妙利用「事先取得承諾請求法」的商談技巧。\n\
    \n低飛球（low-ball）是設想别人一開始容易接受的條件，比如，店家先以「便宜！大拍賣！」等口號吸引客人上門，最後才在結帳時說：「這幾樣商品不是優惠對象。」「在成人影片，中，風俗店會用「看看小姐也行」之類的說詞來拉客\n\
    \n(勸誘方式純屬想像虛構)。\n\n施展催眠術時，很多人一開始會說，「好可怕！」「不曉得會發生什麼事，我不要！」他們會這樣說，是因為認為「我被催眠後，可能會被做奇怪的事」。\n\
    \n重點在於「我被催眠的話」，這樣設想就等同於預設自己會中催眠術。「我大概會被催眠吧。我好怕被催眠後，不曉得會被怎麼樣。」「這樣思考的人容易中催眠術(建立催眠術的投契關係)。\n\
    \n遇到這樣的人，表演者還是得想辦法讓催眠秀進行下去。\n\n然而，「沒事的，我不會害你啦，總之你就試試看嘛。」「這樣的勸說跟影片中的勸誘方式沒有兩樣。「只是手變僵直！真的就手變僵直而已！」在催眠師苦口婆心的勸說下勉強接受請求，受術者卻沒有注意到手變僵直的嚴重性。對沒有過催眠經驗的人來說，手得僵直可是件不得了的事情。\n\
    \n催眠術中的「低飛球」出現在哪邊？答案是把催眠術本身包裝成「低飛球」的最初「對話」。\n\n- 「你聽過身體束縛嗎？那其實是催眠術的一種。」\n- 「有些國家承認催眠術的醫療效果。」\n\
    - 「你知道刨冰的味道其實都一樣嗎？只是因為不同顏色的暗示，才產生味覺上的變化喔。」\n\n像這樣將催眠術中肌肉僵直（Catas）等術語，轉換成味覺變化等日常現象，「這樣啊，原來大家平常都會被催眠嘛。」便能讓對方產生這樣的想法。\n\
    \n這就是催眠術上「讓對方接低下飛球」。\n\n開始催眠時，「上小學的時候，你應該也有玩過才對？兩手像黏在一起一樣交指相握。」邊說邊在對方眼前實際表演。\n\
    \n「這是小學生也會做的事情」、「我現在也在你的眼前做」、「這一點都不可怕」，重要的是誇張表現，自然傳達「沒有人會因催眠而死亡」的意圖。\n\n當然，判斷對方上鉤後，馬上投出低飛球：「瞧！你真的動不了！變得硬梆梆了！」\n\
    \n# 催眠術應當被毀滅\n\n![](img/01c0a84ac99c39972bbc7f26fee40445_175_0.png)\n\n# 歷史一百二十年都沒有改變\n\
    \n催眠術一詞在日本傳播約是在明治二十年（西元一一八七年），也有人說是在更早的時候，催眠大約具有一百二十年以上的歷史。\n\n當然，我們沒有辦法見到當時的情景，但由拍賣會等地方出現明治時代的古老催眠書籍，其盛行可見一斑。不過這邊並不是要追溯催眠術的歷史。回溯其歷史沒有太大的意義，因為由現代的催眠術來看，可以確信「催眠術沒有任何進步」。\n\
    \n對「術」的隱匿說法感到憧憬且性格陰沉的人們，願意砸下重金討教學習，其中有些人順利學會，但也有些人不是，而這些順利學會施展催眠術的人，後來又出來當「老師」，收取重金傳授催眠術。\n\
    \n而那些催眠師，當遇到有人表示自己「我才不會被催眠」，就蔑視對方「你的受暗示性低下」；當遇到容易被催眠的人，就「任由自己擺佈」，讓他被觀眾看笑話。\n\n\
    雖然這麼說有些極端，但無論是電視媒體興起的現代，還是 YouTube、社群媒體的網路時代，我想一百三十年都沒有成長的祕術正是催眠術。\n\n一百三十年來，催眠師給人的傲慢形象已經根深蒂固，如今才想「改變催眠術的形象」，可說是不可能的任務。\n\
    \n各位想想看，嘴巴說說就能讓手掌張不開，明明是如此神奇的現象，卻少有人想要學習這樣的技術，真是令人不敢相信。\n\n一百三十年間沒有辦法消除「那只是騙人把戲」的偏見，完全歸咎於催眠師的怠慢。\n\
    \n雖然不是說所有的催眠師，但很多人穿著前衛視覺、怪異滿點的服裝……\n\n我曾經有一次在正式表演秀之前，對幾位來賓進行「測試受暗示性」，如「手指黏在一塊」、「整隻手變沉重」等等，但果然有其中幾位得意地伸出沒有黏在一起的手，說：「我不容易被催眠，真是對不起喔。'\n\
    \n這是因為很多人都認為「催眠術」讓人笑話的節目」。他們不想要上台後被當成跟狗一樣，受到觀衆指指點點、嘲笑一番。\n\n到底來說，催眠術不適合作為給衆人觀看的表演。僅有被催眠的人才能體會\n\
    \n自身發生的變化，在其他人眼中卻是「那是騙人的啦」、「他只是裝作被催眠」、「他識趣上道」，並暗起哄：「咳？！真的嗎？」看到、聽到這樣的反應，催眠師還一臉得意自滿。\n\
    \n若是在觀眾看到斷體魔術會昏倒的時代就算了，但時至今日，這樣的表演秀怎麼能稱作娛樂節目呢？\n\n所以，我要鄭重地在這裡說：「催眠術一詞和催眠師應當被毀滅。」\n\
    \n只要撤出催眠術一詞，只要打著催眠師的名號，就得背負一百三十年來無法抹滅的負債。\n\n### 「資格」砸錢就可買到\n\n催眠師其實沒有什麼正式的資格。\n\
    \n自稱「我擁有正式資格」的催眠師，大多只是拿著個人工作場所頒發的「催眠師證」，\n\n眠師認定」、「催眠治療師○級」等證書。\n\n那些證書，不過是用來誤導人的普通紙張而已──誤導那些不了解催眠術業界的人們，以為「他持有正式資格，所以真的會催眠術」，讓砸錢學習習催眠術的人能夠自誇「我擁有正式資格」。\n\
    \n大多數的情況是如此，而剩下的少數人，則是由國際大型催眠協會獲得資格。\n\n那麼，國際資格才是真的？其實不然，實際走訪一趟會發現，國際根本不需要聽課，閱讀幾本相關書籍便能獲得證明，消費相當於幾萬元金額，不久便能收到資格證書，完全淪落為「買賣的商品」。對國際機構來說，只需要頒予認定，就有相當於數十萬元、數百萬元進入口袋，沒有比這更有賺錢的商品吧。\n\
    \n國際證書還可以引發崇洋情緒。\n\n美國的確有不少大型的催眠術、催眠治療團體，高喊「催眠療法在國際受到認可」、「歐美有催眠博士的稱號？」但是，為什麼會有人沒有注意到日本其實並未承認這樣的資格，不惜砸錢購買資格呢？\n\
    \n因為在「售出」資格的同時，也「售出」了教導他人的資格。\n"
