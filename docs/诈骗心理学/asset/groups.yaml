    # 從平常對話中，瞬間找出人性特質


    如同前述，對世界上的騙子來說，看清對方的特質比什麼都來得重要。


    雖然我不是騙子（笑），但這在魔術界也是相同的。


    累積足夠的經驗，習慣後不是什麼難事。


    我在桌子上攤開紙牌表演魔術秀，說：「請抽一張你喜歡的牌。」同時會在心中大致將人分成五類。


    +   ◎ 什麼都沒想就抽取第一張的人。

    ◎ 認為沒有第一張牌會讓魔術師困擾而抽取第一張的人。

    ◎ 什麼都沒想就從中間抽取的人。

    ◎ 再三猶豫，最後選擇抽取中間偏右或者偏左的人。

    ◎ 認為會讓魔術師困擾而抽取最後一張的人。'
