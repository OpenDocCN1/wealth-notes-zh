    功，有時會不成功。


    另外，這個「喝下無酒精啤酒喝醉」並非無意識的現象。


    這是唤起飲用啤酒的「意識」。


    面對衆人感到緊張不是「無意識」的反應，而是「面對衆人」的意識讓你整個人盜汗、心悸。而催眠師要做的事情就是，誘導對方「想像你現在正面對衆人。」


    如同上述，讓對方產生意識，就能引發現象，催眠術是「控制潛意識」這種說法，只是為了聽起來煞有其事、帥氣。


    我在本書描述的「潛在的」，絕對不是指「無意識」的情況。


    而是指「儘管自己產生意識，但精神上不願意直接承認」的情況，或者「尋找別的理由，解釋該狀況不是自己的意圖」。


    ### 「非語言暗示」的異常人氣


    讀完前面的解說之後，相信大家都理解，催眠、暗示跟非科學的要素不相幹。


    然而，學習催眠術的同時，也會觸及氣功、靈異等非科學的要素。


    「你內心中的神明……」「前世的罪業……」催眠教室好壞參半，甚至還有心靈導師想以打開脈輪⁵為名義騙色（雖然我不曉得打開脈輪是什麼樣的行為），駁頭無奇不有。


    較具代表性的例子有「非語言暗示」，如同字面上的意思，「不使用語言，成功暗示對方」。這是非常不真實的現象，但部分「催眠愛好者」對此趨之若鶩，只要催眠教室不斷高唱非語言暗示的名號，打出「終極！非語言暗示」的標題，就能吸引眾多狂熱份子上門。


