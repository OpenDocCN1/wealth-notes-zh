    ### 「非語言暗示」的異常人氣


    讀完前面的解說之後，相信大家都理解，催眠、暗示跟非科學的要素不相幹。


    然而，學習催眠術的同時，也會觸及氣功、靈異等非科學的要素。


    「你內心中的神明……」「前世的罪業……」催眠教室好壞參半，甚至還有心靈導師想以打開脈輪⁵為名義騙色（雖然我不曉得打開脈輪是什麼樣的行為），駁頭無奇不有。


    較具代表性的例子有「非語言暗示」，如同字面上的意思，「不使用語言，成功暗示對方」。這是非常不真實的現象，但部分「催眠愛好者」對此趨之若鶩，只要催眠教室不斷高唱非語言暗示的名號，打出「終極！非語言暗示」的標題，就能吸引眾多狂熱份子上門。


