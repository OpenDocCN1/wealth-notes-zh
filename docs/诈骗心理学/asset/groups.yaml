    # 詐騙集團掌握「未知」的恐懼心態


    雖說如此，但並非買各種東西都需要專業的知識，我自己也不是每天都在吸收各方面的知識。我們容易接受「大公司、大品牌說的準沒錯」的威力效應，建立信賴關係、投契關係。


    形成投契關係就能無往不利，商業上也存在這樣的催眠思維。


    需要警戒的是，**抱持惡意、明顯利用對方缺乏專業知識，而蔽詐的騙徒**。


    退款詐騙、點擊詐騙⑥等現代詐騙手法也是如此，騙徒會說出「您有一筆退款詐騙⑥的詐騙手法。'
  - '[PAGE 222]


    款，請小額轉帳至此帳戶」等等。即便沒有專業知識，只要認清「不可能有這種事情」，就足以保護自己。


    一般平民百姓不具備公家機關的專業知識，「政府不會用轉帳來退款」、「只需要一點警覺心與常識就好。


    點擊網站廣告連結的瞬間，跳出「我們已取得你的住所地址、電話號碼。若未收到轉帳款項，不排除付諸法律行動。「低劣的詐騙手法如此猖獗，也顯示了「仍有一定的人數缺乏專業知識」的事實。


    點擊連結後，對方頂多只知道你有點擊而已，沒有辦法獲取住所地址、電話號碼。


    當我們誤信「請回覆電話」、「請回覆信件」等說法，對方才有辦法獲得你的電話號碼、電郵地址。


    「點擊連結只能獲得 IP 地址，知道網路服務供應商與大致所在區域。「我


    知道知識就這一點而已。


    從「你的電腦有風險」擬似電腦系統的警告視窗，到網站要求安裝可疑軟體，「安裝？警告視窗？有這種的網站？」「現在仍有人不了解這些，所以我只需要'
  - '[PAGE 223]


    輸入「↓請點擊這個網址確認」等，就能成功詐騙這些人。


    大致上可說，「詐騙是指，針對沒有任何相關知識的人，搬出一堆有利自身的虛假專業知識，藉以迷惑他人的作業。」


    靈能者的演出主要是展現心靈力量，需要在開場時含糊說明力量的來源。但是，對於自稱擁有心靈力量的謊言，靈能者在道德與良心上會有所抗拒，所以不會直接說「超能力」。


    良心譴責帶出的模糊說法，會使靈能者更難獲得觀眾的共鳴與信賴感。講得難聽一點就是：


    「搬出不負責任的科學知識、超自然用語，迷惑低智商的觀眾。」


    這項難題永遠跟著靈能者，但也只有靈能者自身才能解決其中的矛盾。在觀眾面前展現真實的自己還是戴起面具，都只是演出者自身的個人問題。


    ——松田道弘《心靈魔術事典》


