    # 第4章

    # 詐騙技巧的正面運用，無往不利、隨心所欲


    ## 刺激需求「只有自己賺到」


    前面舉了一些商業例子，這一章再多介紹一些具體說明用法。


    因為擔心前面舉出的暗示、催眠相關例子，大家只是草草認為「好像有這回事」，所以這邊再多著墨一些。


    重要的不是膚淺理解「好像有這麼回事」，而是對於生活常聽到的說詞、行動，能有系統分析其背後的「暗示」。


    繼續以「利害系統」來討論。如同前面多次提到，人的行動仰賴利害評估。比如，推銷汽車時常用的煽動用句「我特別給您優惠」。當然，這能讓客人產生「只有自己是特別的」的感覺，刺激每個人心中「只有自己賺到」的欲求。


    換成利害系統來看，亦即「其他人沒有得到或者不知道有此優惠」，認為一定有人損失的想法。


    如果說他人獲利是一種損失，那麼他人沒有獲利可看作是自己獲利。


    然而，我想……現在沒有「收到這封信件才有的專屬折扣優惠」的廣告信件了吧，但這在過去是非常有效的行銷手法，一時間大為流行，現在或許還能吸引一些年長者。


    推銷人員為了不讓你感到可疑，會搬出「給你這樣的優惠，公司都要虧本了」、「我自掏腰包送你這些吧」等等說詞，增加真實性。「自掏腰包」的說詞還牽扯到「好意的回報性」等其他要素。


    即便隨著時代改變形式，「只有你賺到」的行銷手法依然留存下來。這是因為沒有其他手法比「能夠獲得利益」更為簡單又有效。


    郵購、電視購物也不例外，每天反覆播放：「只優惠給收看本雜誌、節目的觀眾！」電視購物剛流行起來時，常可見這樣的推銷說詞，雖然最近許多觀眾會白眼看待，但此手法仍舊有不錯的效果。


    長遠來看，這種行銷制度、效果是不會改變的，只是載體從廣告傳單轉為電視節目，隨時代誕生新的形式而已。


    ## 自我批判，增添真實性


    購買者、消費者會隨著時代成長，現在一味推銷「這項商品很棒」，只會讓人認為：「哪有人會說自家商品不好？」講點題外話，每當我使用我公司的洗衣劑卻洗不乾淨時，都會感到非常生氣。這不僅限於洗衣劑，在對話中加入一些自我批判，容易贏得對方的「信賴」。


    假設有A商品與B商品，客戶決定要買哪種商品，推銷員說「嗯……這只是我個人的意見，老實說我不推薦A商品，使用後總是出現一些毛病。」因為販售方主動提供不利自己的情報，消費者會覺得「他講的是事實」。再加上，賣家表示這是「我個人的意見」，更增添真實性。換句話說，「這對敝公司來說是不利的情報，但為了客人著想，我才私底下偷偷告訴您。」包含了這層含意。如同前述，「不想讓他人獲利」的心理，會讓消費者「選擇相信不利對方的信息」。


    ## 主動肯定對方心中的「理想自我」


    相信，是建立投獎關係的一環。


    雖然此手法的應用、構想有些複雜，但只要能建立投獎關係，「不過，B商品就真的很棒。」再提出真正打算推銷的產品，消費者便會輕易認為「這也是事實」。


    「只要獲得對方的信賴，即使是隨便說說的巴南效應，也會發揮效果。」


    如同前面章節的內容，是單純從信賴到暗示的過程，在「贏得信賴」、「建立投獎關係」的部分，這邊採用的技巧是「提示讓自己、公司蒙受損害的情報」。


    放到「利害系統」上，自我批判也可以是工於心計、控制人心的利器。


    接著要介紹的心理技巧，除了用於商業上，也可用於私人生活。


    每個人心中都有「希望自己是這樣」的願望。


    然而，這個樣貌未必都相同，不同的人有著不一樣的理想自我。有的女性希望在男性面前表現自己的嬌嗔；有的男性希望在女性面前表現自己的體貼。


    每個人心中都存在著「希望被這麼看待」的願望。


    根據對方的周遭情況、擁有資產、家庭環境以及當下狀況，洞察「現在，他希望怎麼被看待？」搶先給予肯定，讓對方認為「這個人認同我心中的理想形象」，如此一來，你就會成為對方心目中「有利於自己的存在」。


    肯定需求，是「想要獲得他人認同」的心理，亦即「這個人希望被這麼看待」，這會因時間、場合而有所差異。


    雖然同樣是給予認同，但擁有高度的察覺能力，才有辦法洞察對方的理想自我。


    有趣的是，除了一般認為正面形象的「體貼」、「寬容」之外，很多人的理想自我是負面形象的「傲慢」、「幼稚」。


    如同在媽媽身邊想要當個孩子的心態，強烈想對戀人「撒嬌」時，內心會希望對方認為「你真像小孩子，一個人什麼都做不來」。


    愛耍任性的戀人，不會單純是「不講理的任性」。即使任性也會分場合，不會對自己尊敬的人提出不合理的事情，或對小孩講出無理的要求。對方明顯幼稚、傲慢的舉止，背後肯定潛藏「希望被如此看待」的願望。能否捕捉到背後的訊息，搶先給予肯定「你是這樣的人」，將是對方決定需不需要你的重要關鍵。


    主動接受對方的理想自我，可使對方認為你是重要的存在。


    ## 悲劇英雄主義


    「悲劇英雄主義」是我自創的用語。


    「英雄主義」是指，醉心懲惡揚善的故事情節、崇拜英雄的心理，而悲劇英雄主義則反指「憧憬悲劇主角的心理」。


    這樣傾向較常發生於女性，你應該遇過高興說著「我男人運不好」、「我想結婚但結不了」的女性吧？


    ## 嚴禁濫用！催眠女性這樣說


    這邊來傳授我在催眠女性時的秘術。


    不過，這些女性的心理有些複雜。


    有些人想要主張「悲劇英雄主義」，但本身卻抱有差別意識，被條件比自己差的人說：「妳的男人運真差。」會想出言反駁：「至少比妳好。」


    我個人認為，「差別意識」的影響勝過「肯定需求」的影響。所以，遇到這類型的人，請幫她準備好「能夠間接主張」的有利情況。


    做法有些複雜，但用法相當簡單。


    催眠對方時，只要說「會被催眠的人，大多男人運不好。」如此一來，她被催眠後，可以順水推舟主張「我是少數派」、「我是悲劇女主角」。


    「那麼，我接下來要對大家施展催眠術。很多人或許認為，會中催眠術的是思想單純的人，但其實沒有這回事。比起思想單純，想像力豐富的人，說得極端一點，喜歡妄想的人更容易被催眠。這是統計上的結論，但女性在戀愛上容易看不清周遭，太過喜歡對方而聽不進朋友好言相勸。當然，女性也因此容易被男性欺騙、在情場上失敗；兩人在一起的結果容易不是極好就是極壞。」


    大致像這樣置入開場白。


    這個開場白的意圖如下：


    - ●避免對方認為「單純的笨蛋才會被催眠」。

    - ●有利於主張自己是少數派「喜歡妄想」的人。

    - ●藉由「這是統計上的結論」，避免對方誤解「這是你想要讓我最容易被催眠，才這麼主張」。

    - ●有利於主張自己是「我是專情到看不清楚周遭」的人。

    - ●若是和幾位朋友一起來，「聽不進朋友好言相勸」等說法，會讓曾經發生幾次苦勸無用的友人感同身受，忍不住說：「不就是在說妳嗎？」間接滿足友人的肯定需求。

    - ◎刺激「容易被男性欺騙」的悲劇英雄主義。

    - ◎藉由「不是極好就是極壞」的說法，避免冒犯對方。


    這所有的要素都藏在前面的開場白中。


    說完這樣的開場白，女性團體就會出現「不就是在說妳嗎？」「我哪有！」的聲音，自行炒熱現場氣氛，後面會有半數以上的人成功被催眠。


    而沒有被催眠的少數人，看到身旁被催眠的友人，會說：「好厲害，她真的被催眠了。」再為現場氣氛加溫。


    這是「差別意識影響較大的友人關係」的情況，結果屢試不爽，讀者可以找機會試試看。


    ## 如何讓人覺得「只有你最懂我」


    「只有你最懂我」的心理其實很簡單。


    很抱歉這邊從男性觀點出發，但遇到非常善於社交、精力充沛的活躍女性，想成為她心中無可取代的人，對她說「妳真是開朗活潑」，是不會有任何進展的。因為平常就有很多人這麼說她了。


    雖然抽象且明確且沒有太大的意義，但女性總是希望別人看到、察覺到「真正的自己」。


    換句話說，不表現在外的自己才是「沒有任何人知道的真正自己」。對個性開朗的女性說「妳其實有獨自一人哭泣的時候吧」；對善於社交的女性說「妳其實挺喜歡一個人獨處的時間吧」，就能說到她的心坎裡，讓她覺得「你真的瞭解我」。


    雖然聽起來沒什麼，但真的就是如此。


    不過，對個性陰沉的女性說「妳其實善於社交、個性開朗吧」，只會得到「沒有這回事」的回應。


    不可思議的是，日本人對「開朗」這個詞不太抱有肯定的意象，反倒比較喜歡「個性陰沉但擁有自己世界的人」。


    就這點來說，還有一句通用的話。那就是「妳很常把事情往心裡放吧」。


    生活上，人或多或少都會感受到壓力。不論是個性開朗的人還是個性陰沉的人皆是如此。這個魔法句，可以說得好像你了解對方心中的壓力、欲求一樣。


    遇到個性開朗的人，溫柔地說：「雖然妳平時表現得活潑外向，但在我眼中，妳會一個人把許多事情往心裡放。」遇到個性陰沉的人，體諒地說：「雖然妳不怎麼愛說話，但妳會一個人把許多事情往心裡放。」如此一來，對方就會擅自認為「這個人了解我心中的壓力」。


    雖然聽起來有點像是搭訕說詞，但這是能刺激女性的悲劇英雄主義，可說是瞬間贏得信賴的魔法用句。


    ## 嚴禁濫用！催眠男性這樣說


    那麼，面對男性一開始該怎麼說？


    基本上是相同的思維。


    「溫柔體貼的男性容易被催眠。」就算這麼開場，通常不會真的有人說：「我被催眠了。看來我是溫柔體貼的男性。」因為這樣太過於厚臉皮。


    目的是刺激男性的悲劇英雄主義，「憂鬱男子傾向被催眠」這樣開場就可以。


    如果想要保守一點，那就說成「潛在的憂鬱男子……」吧。


    不過硬要說，男性比較傾向慵懶瘋狂。常用開場白的例子，感覺像是這樣：


    「催眠術說穿了就是對方的想像力，喜歡妄想的人比較容易被催眠，這類型的人認為自己不行時，就真的事事不順；認為自己可以時，就真的無所不能，是不論結果好壞都往前衝的人。這樣的人可能時常感到憂鬱，潛在地抱持著自殺願望。」

