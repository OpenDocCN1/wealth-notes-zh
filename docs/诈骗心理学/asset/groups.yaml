  - '[PAGE 18]


    # 不相信「降靈術」，說成是「心理學」卻相信


    近來，一般人多會認為「Mesalist」就是「讀心師」的意思。


    這是由於這些人上媒體時，多為表演讀心術的緣故。


    但其實這一詞從很早以前就已經出現，過去這個詞的意思更偏向「靈能者」，是指具有心靈感應能力的人，自稱能夠洞察他人心思或把自己思想傳達給他人，在十九世紀的歐洲還曾刮起降靈術的熱潮，那個時代的人幾乎都相信心靈現象。


    從福克斯（Fox）姐妹的「海德村（Hydesville）事件」，謊稱捻動腳趾關節發出辟啪聲為「靈媒的回覆」，到在黑暗中使用鋼琴線懸浮椅子，整個歐洲被捲入靈異世界當中，引起一股降靈術風潮。


    這些表演「冒牌靈媒」把戲的人，當時的人稱之為「靈能者」。'
  - '[PAGE 19]


    如今，這些現象在魔術愛好者之間被稱為「心靈魔術」，保留靈媒使用的花招手法，昇華成一種魔術表演。


    據說，當時甚至連以《夏洛克·福爾摩斯》成名的亞瑟·柯南·道爾等知識份子、政治家，都相信妖精、靈魂的存在（花仙子靈異照片事件）。時代再往前追溯，催眠術（Hypnotism）始祖法蘭茲·安東·梅斯梅爾（Franz
    Anton Mesmer）提出動物磁力（magnetism）大為盛行；再更往前追溯，還有陰陽師、薩滿教（Shamanism）……等。



    群眾所信信的根據，會因時代、環境而改變。


    舉例來說，假設你穿越時空回到中世紀歐洲，讓當時的人們視聽DVD播放出來的聲音影像，你該怎麼向大眾解釋其中的原理呢？如果僅說「這是科學。」大概沒有人會理你吧。


    「這個箱子寄宿了靈魂。」這樣描述會比較妥當。如此一來，人們就會讀作：「這個人是靈媒專家。」


    但是，到了現代，靈能者在演出「讀心」、「找到遺失物」、「傳遞死者的訊息」等靈異現象時，必須提出「心理學」的相關根據。'
  - '[PAGE 20]


    # 世界上所有一切都是催眠術


    現代人大多不相信靈魂、妖精，而是信奉科學、學術，所以與其用「邪靈作怪『、「降靈成功」的說法，說成是心理學會更具有說服力。


    沒錯，兩百年前的人們與二十一世紀的我們沒有什麼不同，同樣容易相信毫無理由的根據。


    接受現代靈能者所提示「心理學」根據的我們，與認同「邪靈作怪」的說法並毫不懷疑相信靈魂存在的兩百年前古人，同樣非常危險。


    我們不是心理學專家，沒有辦法證明其中的根據。儘管如此，「心理學」一詞，卻如同兩百年前的「降靈術」，在科學、學術發達的現代，被認為是「理所當然的字詞」，甚至不覺得有必要去證明它。


    僅作為舞台演出還算無傷大雅，但世上卻猖獗著謊稱科學的「冒牌貨」。'
  - '[PAGE 21]


    如同醫療領域有「偽科學」這樣的說法，這些冒牌主張聽起來像是有科學根據，所以社會上才會充斥各種乍看之下荒唐的詐騙手段。


    其實，「相信」這個心理，與催眠術、暗示、魔術等大家所不熟悉的世界有很深的關係。


    學習催眠術、暗示的原理，能讓你稍微了解魔術師的手法，接下來，就能以第三者的視角理解「其中的真意」，防止自己被騙或者因人際關係、戀愛陷入疑心暗病之中。


    除了上述的自我防衛之外，在日常生活中也非常實用，比如：


    · 想要和這個人變親近，我該怎麼行動？


    · 想要讓這項商品賣得好，我該怎麼推銷？


    自己會變得不再憑感覺行事，「這樣做會讓對方產生這樣的感覺，所以先發出這樣訊息。」而是具體策劃下一步該怎麼行動。


    在撰寫本書的同時，我還有錄製魔術教學DVD，僅僅不到一個月的時間就登上魔術商城的年度銷售冠軍。雖然聽起來像是自賣自誇，但我真的成為二〇一六年日本魔術師教學DVD最暢銷的魔術師。'
  - '[PAGE 22]


    這大概可歸因於我熟習催眠術的知識，而且太過連續好幾天以魔術「欺騙他人」的經驗，才能達到這般「暗示」的銷售手法吧。


    在翻閱本書之前，你可能會懷疑：「真的有催眠術嗎？」這和我在敲開催眠教室大門之前是同樣的心情。


    不過，讀完本書之後，相信你肯定也會認為：「催眠術一點都不難。」


    而且，你會開始覺得，只要運用催眠術的思維，不管是戀愛、地位、工作業績，你想要的東西都能得到，甚至能夠看穿詐騙、銷售騙術等。


    我們可以說「這個世上的一切都是催眠術」，但也可反過來說「催眠術其實並不存在」。


    了解催眠就是知曉世間一切，那麼催眠就等同於不存在。


    你現在或許還沒有這樣的體會，但請繼續閱讀後面的詳細內容。


    閱讀完後，相信你也會邊笑邊說：「原來如此。」'
  - '[PAGE 23]


    # 面對未知事物的心理變化


    眼前所發生的現象是超能力？還是魔術？


    雖然多數人說「彎曲湯匙是超能力」，但仍舊爭議不斷，其中的原因只有一個。那就是，「不曉得那是怎麼辦到的。」


    人在面對未知的事物時，內心會產生畏懼。並想要尋求根據。


    但是，自己卻不知道……


    看完魔術後會想問「是怎麼辦到的？」想像一下這個心理，可能會比較容易理解。


    這個「是怎麼辦到的？」所隱含的心理，就是「我不知道！好可怕！拜託告訴我！」


    雖然聽起來理所當然，那麼沒有表現出「告訴我！」的觀眾，內心會出現什麼樣的變化呢？他們會告訴自己「這是魔術」，努力讓內心平靜下來。


    相反地，魔術酒吧的魔術師在演出彎曲湯匙之前，若沒有宣告「我現在要表'
  - '[PAGE 24]


    演魔術」，相信會有很多客人問：「這是魔術吧？」

    他們希望聽到「這是魔術」的答案，藉以讓自己感到安心。

    然而，仔細一想，這些客人並不是真的了解「魔術」的手法、花招，自身也不是魔術專家或者魔術師。


    不過，魔術對一般人來說並不陌生，經常可在電視上看到相關的演出，大致能掌握其中樣貌，比如「魔術就是讓觀衆抽出的紙牌總是變到最上面的第一張嘛？「


    因為有了根據就能獲得安心，所以把彎曲湯匙硬說成是「氣功」，把讀心術解釋為「心理學」，都能讓人覺得「啊！原來如此。」


    人為了逃避面對未知事物的恐懼，寧願選擇相信立論點不足的根據。

    如同前面所提到，這是非常危險的行為（僅作為表演的話還好……）。


    專攻電漿學知識的大學教授，認為靈魂、鬼火是「電漿」。

    然而，我們明明對「電漿是火焰還是電力？」了解不深，但當身邊有人看到恍如鬼火的發光體，大叫：「哇！有鬼火！」很多人會鄙視大叫的人，得意地宣'
  - '[PAGE 25]


    # 你是否輕易「接受」根據


    稱：「你有點知識好不好？那是電漿球啦。」


    實際上，你可以裝作害怕地說：「前幾天去墳場時，我真的看到鬼火了！」肯定會有人跟你解釋：「那只是電漿球啦。」我身邊還有人會說：「鬼火是遺體中的磷自燃所產生的現象。（土葬還有可能，但現在多已是火葬……）。換句話說，當人們看到魔術、超自然現象時，會自己找理由來減輕對未知事物的恐懼。


    這邊先稍微整理一下。

    「湯匙彎曲了。」

    看到的人會問：「那是怎麼辦到的？」

    表演者可任意提示根據。'
  - '[PAGE 26]


    「這是超能力。」

    這是我演者利用觀眾「想要減輕不安、恐懼」的心理，提示答案來讓觀眾安心。

    除了魔術、彎曲湯匙的表演之外，宗教人士讀心也會採取類似的做法。

    「你怎麼會知道！」「這是神的力量。」

    這樣一說，「原來如此，是這麼回事啊。「真的有人直接相信。認為「自己不會有這樣的情況」的人遇到魔術、鬼火時，同樣也會產生「想要減輕不安和恐懼」的心理。

    這是相同的心理機制。

    正因如此，我們才有必要學習「不接受」、「不相信」、「不認同」的思维，以防自己為了逃避對未知事物的恐懼而輕易接受根據。'
  - '[PAGE 27]


    # 一 關鍵詞遠離詐騙


    在表演彎曲湯匙時，最令我感到困擾的是「既然如此」的想法。「既然你能簡單彎曲湯匙，為什麼不去金屬加工公司上班呢？」真的，是不必接觸就能自由移動物體，肯定還有其他更有意義的用法吧。比如，在危險的情況中作業，或者應用於醫療領域之中。（我真的遇過觀眾認真追問：「我們要不要討論怎麼運用這份力量來幫助社會？」）如果大家都有這樣的「既然如此」，那我就得花更多精力才能夠炒熱演出吧，幸好目前還未碰到這樣的情況。就我個人來說，在彎曲湯匙方面，我自負擁有世界屈指可數的技術。經過不斷研究魔術、機關、精神論、氣功、等各種「心靈魔術」，我最後得到結論是，一切都建立在「催眠術」這項要素之上。所以，我才能不用道具也不用事先準備，就能彎曲觀眾帶來的湯匙、鑰匙。'
  - '[PAGE 28]


    然而，表演本來就需要各種演出效果，被套上「既然能做到這樣……」的思路，只會讓我感到為難而已。


    反過來說，身為一位表演者，安排演出時就必須考量這兩方面的問題。比如，演出「我有透視能力」時，說：「我會使用讀心，說中觀眾抽出的紙牌。」觀眾有可能說：「既然你能透視，在抽出紙牌的時候就能說中吧？」所以，我認為，身為一位表演者，必須不斷思索觀眾心中「演出」與「真相」的界線。


    如果說成「在空中飛舞的卡片分子進入箱子中」，屬於「演出」。當然，這是不錯的娛樂表演，不會有人真的問：「分子是在空中分解後，再進入箱子中重組的嗎？」


    然而，若是說「我可以從小動作、視線飄移，猜出對方心中所想的數字」，肯定會有人問：「真的能夠辦到嗎？請告訴我們『真相』。」


    後者屬於讀心術、心靈魔術的範疇。


    這並不僅限於魔術，人面對「未知現象」尋求答案時，都有類似的狀況。因此，有些人會產生「既然如此」的思維。'
