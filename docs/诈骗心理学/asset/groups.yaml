    社會上各種勸誘也是如此，讓人聯想成功的情景，或者聲稱是資產數兆元的富豪心法，但這些都是空談而已。


    讓對方集中在意識在好的方面，企圖隱瞞其他矛盾。這是「報喜不報憂」的手法，極為單純的思維。


    在事先預告的催眠術上，為什麼催眠術還能成功呢？答案非常簡單。因為來的客人都是對催眠術感興趣、想要被催眠的人。


    想要催眠不認識的人，需要先努力引起對方的興趣、贏得對方的信賴。同理，勸誘拿起自我啟發、成功論書籍的人參加講座，是非常簡單的事情。這應該可以瞭解吧。


    「對感興趣的人報喜不報憂。」這是各種商業上常見的慣用手法，但我們要不時留意壞處，養成習慣——當對方一直提示好處，自己要同時思考壞處。這樣才能保護自己遠離可疑的自我啟發團體、勸誘詐騙。'
  - '[PAGE 113]


    # 無償行為都是建立在利益基礎之上


    這邊再稍微解說「利害系統」。這是一種基本且真實的思考方式。


    其實，世上並不存在「無償行為」。


    假設一個情況，有兩人靠著同條繩索懸於半空中，快要掉下山崖，下面的男性說「你要好好活下去」，選擇自斷繩索救助另一人。即使是這種情況，同樣不是無償行為。


    雖然說來有點刺耳，但對於無償行為，我們通常關注金錢、時間的部分，而忽略精神上的利益。


    自斷繩索並說出「你要好好活下去」的人，對另一人抱持「希望他活下去」的願望，他實現這份願望，獲得精神上的利益。


    自願清掃沙灘的志工們，實現「希望沙灘乾淨」的願望，從中獲得成就感、爽快感，其中也有人是想要獲取名聲，或者展現自己願意付出的形象，尋求他人認同。'
  - '[PAGE 114]


    我絕不是要蔑視這些行為是「虛偽的善意」，只是想要表達，從另外一個角度想，行為其實並無善惡之分，人的所有行為都是建立在利益基礎之上。


    相信這麼說，讀者必會出現贊同與不贊同兩種聲音，但我們必須如此分析討論，才能觸及「控制他人」、「保護自己不受他人操弄」的真實部分。


    各位女性朋友對男性提議「我幫妳拿東西」的行為有什麼想法呢？即便是無償的志願行為，妳應該也能察覺行動背後有著「他想要向我、周遭女性展現自己很體貼」、「他想要追求我」等各種意圖吧。


    「這個人只是喜歡拿行李。」「妳肯定不會這麼想。


    當遇到自身即將受到威脅、詐欺剝削的狀況，我們會質疑對方自我犧牲的說詞，但卻會欣然接受與自身無關的無償行為。


    撇出無償來誆騙的人會勉強踩在邊緣線上，「免費檢查水質」、「免費清掃冰箱」、「免費提供試用品給您使用」等等，偽裝成沒有損害的無償說詞，企圖突破你的心防。


    因此，我們必須抱持「無償、志願行為不存在」的想法。'
  - '[PAGE 115]


    # 不要相信「老闆賠錢賣」


    再說得更加刺耳一點，人非常討厭他人獲得利益。


    當然，確實有給予他人好處，自己獲得精神上市益的情況，但看著親近的人獲得好處，人會莫名覺得有所損失。


    不論是有心還是無心，或者只是依感覺而這麼做，在商業買賣上，常會搬出「我們沒有獲利」的說法。


    放到前面的「利害系統」來說。如果店家叫賣「這是低價買進、高價賣出，我們準備大賺一筆」，客人完全不會買單，甚至不願拿起商品一探究竟。


    高價買下便宜的東西，會讓人覺得是一種損失，若還得知對方從中大賺一筆，更會因此湧起厭惡感。


    那麼，「這是高價買進的優質商品。不是我在說，各位能以這個價格買到，真的很幸運啊。本店只賺取微薄的利益，大家趕快來買！」如果這樣叫賣又是如何呢？'
  - '[PAGE 116]


    雖然排除了從中賺一筆的部分，但我們還是會對對方獲利的部分感到厭惡。這純粹是「對方獲益是自己損失」的感覺。那麼，換成這樣的說法呢？「本店大量低價進貨，大家快來搶便宜！」這個說法聽起來好像消費者只會得到好處。然而，「就算便宜進貨，店家還是會賺吧？」仍舊會湧現這樣的想法。人就是對「對方獲益是自己損失」這麼敏感。在這樣的前提下，衡量自己與對方獲得的利益，才決定要不要購買。這是我們潛在的感覺。偶爾看到「清倉庫存降價出售」、「廢藥品」等標語，都是為了營造「店家虧本」的計策；「跳樓大拍賣」也是如此，是店家為了展現「我們沒有賺」的行銷招數，巧妙利用「人不想讓對方獲利」的負面心理。店家需要雇用人員陳列、販售商品，不可能沒有得利，但消費者會評估「店家的利益」與「入手想要商品的利益」。這個「不想讓對方獲得利益，但想要那項商品」的衡量，是潛在行為，有時甚至自己不會察覺。電視購物節目的慣用手法，會由一位男主持解說商品的各項好處，再由旁邊'
  - '[PAGE 117]


    明顯是部下的女來賓報價。


    男性：「這麼棒的商品？」


    女性：「現在只要九千八百元！」


    女來賓會像這樣在絕妙的時機點接話。


    這也是巧妙運用心理技巧。


    解說商品的人，適合由在公司背負責任的主管階級擔任。但是，若是在「這麼棒的商品」的解說後面，又由同一位人物來報價，會讓消費者敏感覺得「到頭來還不是他在賺……」所以，節目會安排看起來是領薪水的女來賓報價，巧妙模糊帶過這個部分。


    不論做什麼事，若是捨棄衡量利害，未能看清事物、行動背後的真意，最後勢必會有所損失。'
  - '[PAGE 118]


