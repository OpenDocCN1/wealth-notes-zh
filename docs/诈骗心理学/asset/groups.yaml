    響……等。同理，對不相信催眠術的人，要費盡心力才能引發現象。為此，催眠師會先做出手指黏在一塊等簡單的現象，製造「我是厲害的催眠師！」的威光效應……催眠師真是煞費苦心。不過，如果不說是「催眠術」呢？比如，氣功師對相信氣功的人把手懸放在頭上，說：「你現在感到身體發熱。」在我來看，這也是一種「暗示」。換句話說，對方只是中了名為氣功的催眠，陷入相信氣功的狀態罷了。對相信氣功的人說「我要施展催眠術」，反而難以引發現象。那麼，該如何讓相信氣功的人接受「手變僵直」的暗示呢？其實相當簡單。「我學了很多年的氣功。這個房間裡充滿了真氣。請你閉上眼睛並緊握雙拳，將這些真氣聚集到手掌中，如果沒辦法用自己的意志打開，就表示你吸收了我的真氣。」像這樣講得「煞有其事」。如此一來，大部分人也會成功被催眠。'
