    \n「為什麼那個人不會被催眠呢？」\n「為什麼那個人看了魔術不感到吃驚呢？」\n\n循循苦思這些問題，我將得到的答案統整到這本書當中。然後，在逐步理解催眠術真正樣貌的過程中，也對世上的「真理」有某種程度的了解。\n\
    \n- 「為什麼會被詐騙犯給騙？」\n- 「為什麼算命會說中？」\n- 「為什麼會覺得那間店的料理美味？」\n- 「為什麼人會愛上對方，最後又失去熱情呢？」……\n\
    \n這些世間「真理」就是，人的行動會受到「催眠術」、「暗示」左右。\n\n我注意到，不論是賺大錢的富翁還是善於詐騙的騙子，這些被稱為人生「贏家」的人，都會自然且無意識地操弄「暗示」。同時，受騙者等被稱為人生「輸家」的人，像是自願似地受到「贏家」所控制。\n\
    \n若是稍微擁有催眠、暗示的技術，或者略懂一些皮毛，他們應該就不會被騙、被甩或者當冤大頭才對。\n\n我因為湊巧對催眠術、魔術感興趣，也具備一點彎曲湯匙的能力，錄製結合催眠術與魔術的教學DVD，並在各領域小有名氣，才能像這樣自己經營咖啡店。\n\
    \n然後，與多到數不清的客人交流「催眠術、魔術」，多年觀察「會被催眠的人」、「不被催眠的人」，才能像這樣以出版書籍的形式，分享自己所得到的結論。\n\n雖然聽起來像是自吹自擂，但這本書可是集結「多年來不斷催眠他人所體悟的真理」，極具價值。\n\
    \n就像自稱「我是催眠師」會遭到客人挑釁：「能夠催眠我，你就試試看啊！」出版有關「操縱他人」的書籍，肯定會有人跳出來：「有種，你就操縱我的內心看看啊！」\n\
    \n有贊同的人、也有反對的人，但這本書毫無疑問集結了我多年來從實際經驗所推導出來的結論。\n\n如果本書能對讀者在某方面帶來幫助，那將是作者我至高無上的喜悅。\n\
