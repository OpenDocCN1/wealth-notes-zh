    # 宗教的自動自我催眠系統


    一般人通常一天食用三餐。每次用餐時回想「我接受過胃縮小手術」的暗示，重新陷入催眠狀態。反覆愈多次暗示、主觀認識，愈會留下強烈的印象，會形成一種「習慣」，不斷反覆進行來深化記憶。


    提到「反覆暗示深化記憶」，各種宗教儀式都是這樣的系統。就催眠術的觀點來看，宗教是透過「每天朝拜」、「每日誦經」的方式，提示「心情獲得平復」、「內心覺得幸福」的現象。當然，不能說宗教都是以這樣的思維來構築組織，但世上有多到數不清的信仰，也不能說完全沒有這樣的情況。


