    # 史上最厲害的魔術


    稍微偏離話題一下，提到魔術的事前準備，每當被問到：「哪個魔術最厲害？」我都會分享以前的經驗。


    我開始接觸魔術時，老家神戶有間英式酒吧，我每週約會去表演兩次魔術秀（雖然現在那家店已經收掉了）。


    當然，我那時還在跟當地的魔術師慢慢學習，只能算是初學者，在酒吧獻醜，很多時候難以稱作是魔術秀，被客人辱罵、跟酒醉的客人吵架是家常便飯。


    那個時候，供我上台表演魔術的酒吧，打算舉辦吸引客人的活動，利用當時的社群網站企劃「魔術愛好者聚會」。


    那是一個月一次的聚會，辦得還算不錯，每次都有數十人前來參加。某一天，我在那間酒吧討教的魔術師更上面的老師，「穆罕默德・福岡」大師突然光臨酒吧。


    看完魔術的福岡大師，「不錯，表演得很有氣氛。」不吝惜稱讚我，接著準'
  - '[PAGE 159]


    備打造回府：「那麼，有緣再見。」


