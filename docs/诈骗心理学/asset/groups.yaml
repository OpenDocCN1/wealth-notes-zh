    苦勸無用的友人感同身受，忍不住說：「不就是在說妳嗎？」間接滿足友人的肯定需求。


    ◎刺激「容易被男性欺騙」的悲劇英雄主義。


    ◎藉由「不是極好就是極壞」的說法，避免冒犯對方。


    這所有的要素都藏在前面的開場白中。


