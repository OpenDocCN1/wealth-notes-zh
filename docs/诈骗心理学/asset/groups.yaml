    # 如何讓人覺得「只有你最懂我」


    「只有你最懂我」的心理其實很簡單。


    很抱歉這邊從男性觀點出發，但遇到非常善於社交、精力充沛的活躍女性，想成為她心中無可取代的人，對她說「妳真是開朗活潑」，是不會有任何進展的。因為平常就有很多人這麼說她了。


    雖然抽象且明確且沒有太大的意義，但女性總是希望別人看到、察覺到「真正的自己」。


    換句話說，不表現在外的自己才是「沒有任何人知道的真正自己」。對個性開朗的女性說「妳其實有獨自一人哭泣的時候吧」；對善於社交的女性說「妳其實挺喜歡一個人獨處的時間吧」，就能說到她的心坎裡，讓她覺得「你真的瞭解我」。


    雖然聽起來沒什麼，但真的就是如此。'
  - '[PAGE 130]


    不過，對個性陰沉的女性說「妳其實善於社交、個性開朗吧」，只會得到「沒有這回事」的回應。

    不可思議的是，日本人對「開朗」這個詞不太抱有肯定的意象，反倒比較喜歡「個性陰沉但擁有自己世界的人」。

    就這點來說，還有一句通用的話。那就是「妳很常把事情往心裡放吧」。

    生活上，人或多或少都會感受到壓力。不論是個性開朗的人還是個性陰沉的人皆是如此。這個魔法句，可以說得好像你了解對方心中的壓力、欲求一樣。

    遇到個性開朗的人，溫柔地說：「雖然妳平時表現得活潑外向，但在我眼中，妳會一個人把許多事情往心裡放。」遇到個性陰沉的人，體諒地說：「雖然妳不怎麼愛說話，但妳會一個人把許多事情往心裡放。」如此一來，對方就會擅自認為「這個人了解我心中的壓力」。

    雖然聽起來有點像是搭訕說詞，但這是能刺激女性的悲劇英雄主義，可說是瞬間贏得信賴的魔法用句。'
