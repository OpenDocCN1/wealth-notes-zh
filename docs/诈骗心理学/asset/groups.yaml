    說得通俗一點，就是「被欺侮的角色」，只要自己甘願被其他人羞辱，就能


    在圈子中保有一席之地。這樣的狀況，A會是受術者的最佳選擇。


    換句話說，A自身也會努力成為「容易被催眠的人」。


    # ◎催眠SOP③


    如果發現A或者類似立場的人物，可對他說：'
