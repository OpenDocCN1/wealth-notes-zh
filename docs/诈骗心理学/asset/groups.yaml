    # 為什麼實踐成功者的習慣卻不成功？


    市面上有許多「教人成功的書籍」。這些多是有錢人分享「這樣做，你也會是成功者」，內容不外乎「成功法則」、「成功習慣」等等


    然而，仔細一想，這些全都是結果論。有錢人每天早上都吃塗有奶油的麵包，就說：「想要成功，每天早上都要吃麵包和奶油。」如果讀了本書的人肯定會成功，且這本書成為暢銷書籍，那麼就應該出現成千上萬的有錢人。


    實踐其中幾項法則，並不是什麼困難的事情。'
