    # 當心數字的「間接暗示」


    「類型的人，施術者得改用手掌貼額頭來量測體溫。在商業上，透過高明的行銷手法，有機會對任何人引發類似前面的昏厥現象，讓對方買下一千萬日圓的房子。


    由前面的體溫計例子可知，「數字」是非常容易理解，誘導對方想像的要素。


    所以，詐騙集團、催眠師通常都熟習操弄數字。


    我們每天都會接觸大大小小的數字。


    比起「能大賺一筆」，「獲得一千萬元」更容易讓對方瞭解，具體的數字能激發對方的想像。但是，將「獲得一千萬元」說成「一億元」，效果卻不會增加十倍。'
  - '[PAGE 58]


    若想試圖「讓對方想像」，關鍵在於使用大家所熟悉的數字。某理財投資的推銷，「你瞧瞧。」拿出自己的存摺給對方看。


    在理財推銷的世界，「讓對方看存摺」儼然成為標準流程，觀看存摺的一方容易誤以為存摺上記載的數字可以證明「沒有說謊」。


    比如，「一天一百元，只要一杯咖啡的價錢。」透過這種說詞，勸誘客戶購買高額貸款、分期付款、加倍利率等等，會在各個地方提出數字證明。


    這其實是相當巧妙的「間接暗示」。


    演出催眠秀時也是同樣的情況，不是說：「我催眠過很多人，是催眠術的專家。」而是說：「我三年來催眠超過兩千人。」


    如此一來，觀衆會在腦中推算，「三年催眠兩千人，也就是一年……」


    我們從小就被灌輸算數、數學、統計等知識，像這樣的計算可說是後天的接受暗示性。


    在腦中將三年兩千人換算成一年六六六人，自然會形成「這個人三年來每天都會催眠約兩個人」的認識。


    在此藏有重要的關鍵。'
  - '[PAGE 59]


    其實他並沒有明說：「我三年來『每天』都會催眠他人。」而是利用人會主動計算數字的習慣，傳達「間接暗示」。


    正因如此，對施術者來說，數字是非常有效的手法。


    再試著以前面的理財推銷作為例子。


    當客戶聽到「兩年間每個月可賺進二十萬元」，馬上就會推算一年可獲得二四○萬元、兩年可獲得四八○萬元。而且，這還不是推銷員說的，是客戶自己計算。


    因此，只要說「投資兩百萬元，連續兩年每個月可賺進二十萬元」，即便推銷員沒有直接說出「這投資不會有損失。每年可獲利二四○萬元」，也會間接傳達這樣的暗示。'
  - '[PAGE 60]


    # 當心「品牌」威脅效應


    相較於「未曾聽過的東西」，人會選擇信頼「曾經聽過的東西」。雖然聽起來理所當然，但反過來看，這也可說是「對未知的恐懼」。


    在催眠術上也是如此，我們人類具有「害怕未知事物」的畏懼本能。


    舉個比較誇張例子，如：原始人第一次看見火焰嚇得全身發抖；中世紀因害怕魔術而發起魔女狩獵。想要消除對未知事物的畏懼，是件相當困難的事情。


    即便是效果、性能完全相同的商品，人們容易選取大廠的產品，或者曾在電視廣告上「聽過」的品牌。


    顯見，相信品牌威光的人不在少數。


    藉助威光的方式大致有兩種。


    第一種方式是運用自身的權威。第二種方式是「狐假虎威」，利用其他已經存在的權威。


    比如，利用知名人士的名字或者大家熟悉的話語。'
  - '[PAGE 61]


    僅是藉助威光，他人的看法就會截然不同。


    以魔術秀來說，加上「那位知名魔術師親授」、「曾上過電視節目」，即使是相同的演出，觀眾的熱絡程度也會有所不同。


    題外話，我會在店裡播以前上電視的演出節目，初次來店的客人會問：


    「電視上的那個人是你嗎？」


    這其實也是簡易的威光效應。


    不知名咖啡店老闆所表演的湯匙彎曲魔術，與曾上過電視節目的湯匙彎曲魔術，明明是同樣的演出，觀眾的反應卻截然不同。


    催眠客人的時候，看過節目影集再催眠與什麼都沒有看就直接催眠，我自己覺得前者的成功率高出兩倍。「他是曾經上過電視的催眠師，我肯定會被催眠吧。「只要客人產生這樣的想法，就容易被我催眠。'
  - '[PAGE 62]


    # 當品牌威光失去效果


    不過，任何事情都一樣，一旦被對方識破藉助威光效應的意圖，情況就會反轉過來，產生負面的效果。


    就「利害系統」來看，這如同「他不惜說謊也要藉助威光效應，試圖從我這邊佔便宜」，會讓對方覺得是明顯的損害。


    譬如對來店的客人，直接打開電視說：「你瞧，我有上過電視表演催眠術！厲害吧！」可想而知，此行爲的意圖過於明顯，即使我沒說謊，仍會給人厭惡的感覺。


    客人走進店裡，不用多做其他表示，讓他自己注意到眼前的老闆與電視中的是同一號人物——


    這就是活用品牌威光的間接暗示。


    不久前蔚爲話題的「隱性行銷（stealth marketing）」①，請有權威的知名人士在自己的部落格（讓人不覺得有商業利益的場所）進行宣傳，這樣的巧妙方法'
  - '[PAGE 63]


    也是間接暗示的典型例子。如大家所知，此做法被揭穿後，只會帶來反效果而已。


    # 最危險的是「主觀深信」


    我的魔術秀當中，有個節目是「偷錶魔術（Watch Steal）」。如同字面上的意思，這是趁觀眾不注意時，偷偷取下觀眾手腕上手錶的演出。


    這在海外被稱為「扒手秀（Pickpocket Show）」，是相當大眾的表演，但原本是扒手的技術。當然，因為只是演出而已，結束後會把手錶歸還客人。


    日本不常見這樣的表演秀，這或許跟沒有肢體接觸、擁抱的文化有關。不


    ④隱性行銷：指「刻意隱瞞消費者（情報受體）」這是一個宣傳的行銷行為」，大家熟知的「業配文」，就是一種很典型的隱性行銷。'
  - '[PAGE 64]


    過，雖然只是一支手錶被偷，表演卻相當受到客人的喜愛。


    當客人看到自己的手錶出現在眼前，無不感到驚訝：


    > 「我完全沒有注意到。錶帶明明繫得好好的……」


    表演偷錶時有三個要點。


    +   第一，轉移對方的注意力。


    讓客人握住硬幣，邊說「請緊緊握住」邊慢慢抓住對方的手腕，此時對方的意識集中在硬幣上，不太會注意到手腕被抓住。


    +   第二，不讓對方意識「手錶會被偷走」。


    雖然是理所當然的事情，但如果哪天王主持人介紹：「這位是偷錶高手。我們現在來看看他的拿手絕活。」那手錶是絕對偷不成的。


    +   第三，不讓對方意識「手錶能被偷走」。


    這和第二點很像，但「會被偷走」與「能被偷走」有點不太一樣。換句話說，因為大部分的客人都認為「我怎麼會沒注意到手錶被偷」，後面才會驚訝：


    > 「錶帶明明繫得好好的！」


    偷走手錶之後，我又表演其他魔術約十分鐘，但沒有人注意到手錶不見了，'
  - '[PAGE 65]


    甚至有人是突然想看時間，才自己解釋：「啊！我今天沒有戴手錶。」自認沒有問題的注意力、記憶力，就是如此不可靠。將外出時都放在臀部右邊口袋的錢包，哪天試著改放到臀部左邊的口袋數小時後，「咦？錢包不見了！」你就能夠體驗這般奇妙的感受。「我不可能被騙。」「怎麼可能沒注意到。」「哪有可能會被偷走。」正是這樣的主觀深信、信心十足，最是危險。'
