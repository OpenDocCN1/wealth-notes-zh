  - '[PAGE 253]


    用一句話來說催眠術，就是「相信催眠師」。想要讓他人相信自己，靠得不是言語，而是「我能為那個人做點什麼」的心態。認為娛樂他人就是自身的快樂，這樣的我就花了一天的時間就成為催眠師。反過來說，不是真心想要娛樂他人的人，把催眠術理解為一種技術、話術，只想著「磨練自己的手腕」，不論經過多少年都「沒辦法催眠他人」。我認為，終極的催眠技巧是「不樹立敵人」、「和敵人處好關係」。不斷表演催眠術與魔術，經歷種種失敗，我注意到各式各樣的法則、傾向。這些法則、傾向，就「如同」本書所分享的技術。「為什麼那個人不會被催眠呢？」「為什麼那個人看了魔術不感到吃驚呢？」循循苦思這些問題，我將得到的答案統整到這本書當中。然後，在逐步理解催眠術真正樣貌的過程中，也對世上的「真理」有某種程度的了解。「為什麼會被詐騙犯給騙？」'
  - '[PAGE 254]


    「為什麼算命會說中？」

    「為什麼會覺得那間店的料理美味？」

    「為什麼人會愛上對方，最後又失去熱情呢？」……。

    這些世間「真理」就是，人的行動會受到「催眠術」、「暗示」左右。

    我注意到，不論是賺大錢的富翁還是善於詐騙的騙子，這些被稱為人生「贏家」的人，都會自然且無意識地操弄「暗示」。

    同時，受騙者等被稱為人生「輸家」的人，像是自願似地受到「贏家」所控制。

    若是稍微擁有催眠、暗示的技術，或者略懂一些皮毛，他們應該就不會被騙、被甩或者當冤大頭才對。

    我因為濤巧對催眠術、魔術感興趣，也具備一點彎曲湯匙的能力，錄製結合催眠術與魔術的教學DVD，並在各領域小有名氣，才能像這樣自己經營咖啡店。

    然後，與多到數不清的客人交流「催眠術、魔術」，多年觀察「會被催眠


    254'
  - '[PAGE 255]


    人」、「不被催眠的人」，才能像這樣以出版書籍的形式，分享自己所得到的結論。


    雖然聽起來像是自吹自擂，但這本書可是集結「多年來不斷催眠他人所體悟的真理」，極具價值。


    就像自稱「我是催眠師」會遭到客人挑釁：「能夠催眠我，你就試試看啊！」出版有關「操縱他人」的書籍，肯定會有人跳出來：「有種，你就操縱我的內心看看啊！」


    有贊同的人、也有反對的人，但這本書毫無疑問集結了我多年來從實際經驗所推導出來的結論。


    如果本書能對讀者在某方面帶來幫助，那將是作者我至高無上的喜悅。


    Birnie


    結語 終極的催眠技巧

