    # 詐騙犯都懂的「驚奇谷」


    我所提倡的另一個觀念是「驚奇谷」。


    大家是否聽過「恐怖谷（Uncanny Valley）」理論？


    這是指機器人、人形機器人的外觀不斷近似人類，超過一定的相似度後，人會莫名感到「恐怖」的心理現象（大家可以想像容貌逼真的人偶影集《電鳶神機隊》）。


    長年表演的經驗，我發現魔術也有這個「山谷」存在。


