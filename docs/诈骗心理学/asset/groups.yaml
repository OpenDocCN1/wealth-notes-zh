    # 經驗聯想的想像威力


    當我說「我要施展催眠術」，肯定會出現「我才不會被催眠！」與「我絕對會被催眠！」兩種聲音。


    這不是挺矛盾的嗎？


    因為大部分的人都沒有被催眠的經驗。換句話說，這些人只是在腦內擅自這麼判斷，聯想以前在電視上看過的催眠術，施加在自己身上的情況。


    比如聯想吃檸檬後大叫「好甜！」的催眠，或者女性對男性表白「喜歡你！」並抱住對方。


    人會從過去所獲得的情報，擅自在腦內聯想「催眠術」。


    當我說「我來表演魔術」，許多人會認為是「說中抽出的紙牌」，但稍微年長的人則會覺得是「從帽子中變出兔子」。


    「經驗聯想的想像」威力非同小可，而且還相當危險，施術者可以好好利用一番。'
  - '[PAGE 69]


    說到「壽司店」，跟我同一世代的日本人，容易聯想慶祝時叫外送壽司，或者緊坐於檯前讓直屬上司請客的光景吧。


    「年輕人！今天去吃壽司吧。我請客。」「哎！真的嗎？」


    然而，最近的小孩外出上館子時，通常會覺得：「今天要去家庭餐廳？還去吃壽司？」提到壽司就想到迴轉壽司，聯想到輕鬆愉快的畫面。


    這些孩子長大後，聽到上司邀約：「年輕人！今天去吃壽司吧。我請客。」他們很有可能說：「壽司嗎？怎麼不請好一點的東西：．．．」


    如同上面的例子，不同世代的聯想意象會有所不同。提到「酒吧」，對年輕世代來說是歡唱跳舞的場所，但對父輩來說卻是沉澱心情的喝酒之處。


    而提到催眠術，許多人抱有宛若魔法般的意象。


    打一個響指，就突然倒下失去意識，醒來後才驚覺發生不得了的大事——這是多數人對催眠術的聯想吧。


    被催眠，其實就只是「相信」而已。


    認為自己被催眠的人，會覺得「檸檬吃起來是甜的」，因為他們相信「被催眠」這件事是「有可能發生的」；相反地，也有人認為「這樣的事情不可能發'
