    \n世及出版\n\n![](img/01c0a84ac99c39972bbc7f26fee40445_1_0.png)\n\n# 詐欺心理學\n\n破解邪教團體、詐騙犯慣用的心理技巧\n\
    \nBirdie／著 衛宮絃／譯\n\nTHE KILL JOKER\n\nTHE KILL JOKER\n\n# 前言「詐騙」的慣用心理技巧\n\n感謝各位讀者購買本書。\n\
    \n如同本書書名《詐騙心理學》，在我們身邊充斥著許多令人防不勝防的詐騙案件，有些甚至會危及人生，如金錢、財產、人際關係、心靈等 aspect。\n\n「邪教團體」、「詐騙」、「算命」、「神明起乩」、「老鼠會」、「洗腦」……這些一聽就覺得可疑的單詞，大多數人或許會認為「這和我沒有關係。」\n\
    \n但是，這麼想可就錯了。\n\n這些事件絕非僅存在於遙遠的世界裡，它們只需巧妙改變名稱、描述方式，就能簡單融入我們的日常生活。然後，再透過各種具有社會信用的媒體，宛若理所當然地擴散、侵入我們的生活之中。\n\
    \n比如，近年日本媒體炒得沸沸揚揚，滲透一般大眾的「靈能者（Mentalist）」。\n\n許多人會說「催眠術」不科學，但卻覺得「讀心術（Mentalism）」是科學的。不對，與其說是如此認為，不如說是如此深信會比較正確吧。這些人是以什麼來區分科學與非科學？明明自己又没有專業的科學知識。就多年以催眠魔術師的身份向世人表演催眠術、魔術的我來說，「催眠術」、「讀心術」不過是大家憑藉固有觀念、主觀深信，擅自決定「相信與不相信」罷了。\n\
    \n「語言謬誤」、「主觀深信」……這樣的情況時常發生在我們身邊。明明沒有任何根據卻深信不疑，因此上當受騙，讓自己蒙受巨大的損失。最近，詐騙手法更是無奇不有。\n\
    \n或許，人生「贏家」與「輸家」的差異，就在於知不知道這其中的機制。拿起這本書，並且擁有非凡直覺與感受性的你，期望你也能成為人生上的「贏家」。\n\n心理技巧並非全為不好的東西。若能正確使用，可以讓人生過得更加豐富多彩。\n\
    \n本書將完全公開心懷不軌的邪教團體、超能力者、算命師、詐欺犯等，猖獗社會的「騙子」所使用的「心理技巧」，並传授看穿這些詭計、保護自己的方法。\n\n另外，本書還會分享如何正確使用心理技巧豐富你的人生。\n\
    \n這邊所介紹的全是嚴選簡單且實用的技巧。為了幫助讀者馬上應用，我還準備「三秒學會催眠SOP」，這是我獨自開發的催眠範文。只要參照範文上的內容，就能發揮心理技巧的效果。\n\
    \n不僅只有初學者，相信本書的內容也能滿足已經接觸催眠術、讀心術的人。\n\n本書詳盡收錄常聽聞的心理技巧，介紹其本來的使用方法、實際情況與發揮其效果的技巧。\n\
    \n## 第 1 章\n\n「是怪力亂神，還是一場騙局」，將徹底解說多數人所誤解的心理技巧世界。\n\n## 第 2 章\n\n「愈是信心滿滿，愈容易受騙上當」，將從「容易被催眠」與「不易被催眠」，兩種人的差異切入，說明人被欺騙時，大腦、心理的運作機制。\n\
    \n## 第 3 章\n\n「詐騙教戰守則」如同字面上的意思，將完全公開猖獗社會的騙子所使用的詐騙手法。\n\n使用的心理技巧與詭計。\n\n## 第 4\
    \ 章\n\n「詐騙技巧的正面運用,無往不利、隨心所欲」,將具體解說用來豐富你的人生正確心理技巧。\n\n## 第 5 章\n\n「催眠術應當被毀滅」,將揭曉過去催眠術世界的負面意象,同時提示其未來的展望與熟習心理技巧的方式。\n\
    \n本書詳盡收錄我多年來身為「催眠魔術師」實際的經歷體驗,所推導的真諦。\n\n如果本書能夠讓你大開眼界,幫助你提防不肖之徒,並利用這些心理技巧讓人生更添風采,我將會感到無比的榮幸。\n\
