    # 詐騙的第一步


    前面多次提到「建立投契關係」，但能自然接受這個概念的人，或許之前有讀過心理學的文獻。


    投契關係是指，心理學用語上的「相互信賴的關係」。換句話說，建立投契關係相當於雙方完全信賴對方，此狀態被認為是所有治療與療法的必要前提。


    當然，「騙子」才不会考慮相互信賴。「這傢伙，完全相信我了，好極了。」騙子只會打歪腦筋。


    說個冷知識，第一位利用投契關係的人，是被稱為催眠師始祖的法國茲安東•梅斯梅爾（Franz Anton Mesmer）。


    梅斯梅爾醫生認為每個人身上都具有「動物磁力（Animal Magnetism）」，提倡以手部運動控制磁力，整頓磁力流動來達到治療的效果。


    患者在治療過程中會發生痙攣或者昏厥，他稱這樣的症狀為「感應到動物磁力的狀態」，亦即「建立投契關係的狀態」。'
  - '[PAGE 87]


    當然，人體不會因為動物磁力而發生癢摯或者昏厥。換句話說，這些是藉助「與患者建立信賴關係」所引發的現象。雖然這可能不是梅斯梅爾原本的目的，但只要建立起信賴關係，將手懸於頭部上方，就能夠讓對方昏厥，完全佐證「催眠術是投契關係的建立」。這個情況並不僅限於催眠術，還能套用到現代的各種事情上。


    「○○產的食物好吃或難吃」、「這是三星級的餐廳」、「曾經發生食物中毒的店家」等等，不論評價的好壞，我們平時都會依據各種情報建立對事物「信賴」。


    這與在十八世紀相信「動物磁力好像真有療效」而癢摯的人沒有什麼不同。就好像前往評價不錯的美容院，就算頭髮被理得奇葩前衛，你也會欣然接受。


    透過投契關係的建立，產生「味覺改變」、「商品變得好看」的錯覺。這和「昏厥」相比起來，完全不是什麼困難的事情。


    即便沒聽過「建立投契關係」的術語，知曉這種心理作用的「騙子」，時時會想盡辦法建立投契關係，企圖藉此謀取利益。'
  - '[PAGE 88]


    # 找出對方相信的事物


    我們會對什麼事物建立投契關係呢？

    平時過著什麼樣的生活，基本上都是靠我們自己的意志做選擇。

    是否有信仰、宗教觀是什麼、在超市都購買什麼商品等，全部都包括在內。

    雖然「相信什麼取決於自己」很單純，但如果沒有意識這會被拿來利用，就有可能被詐騙。


    以前曾經流行過「我是從消防署那邊來的，您得買新的滅火器更換」的詐騙行為，這是以權威機關為名義的慣常手法。

    現在，大家都知道其中的詭計，不會有人被騙。

    不過，就暗示方面來看，大多數人會對「消防署」感受到威光效應，內心產生信賴、安心感，完全符合催眠所需的要素。


    那麼，將這個滅火器的販售搬到電視購物節目，情況會變得如何呢？

    「這支滅火器，是經過消防署保證品質的商品！」'
  - '[PAGE 89]


    這邊的重點是，大多數人會對消防署一詞產生信賴，無意間建立投契關係。


    主持人想要賣出商品，必須思索如何贏得多数人的信賴，讓在分母上面的分子變大。這並不僅限於言語，譬如想要推銷催眠術的相關教材，只要印上「催眠師××××掛保證！」或許就有機會大賣吧（笑）。


    在一般家庭向的電視購物節目當中，主持人可以說：「知名演員○○也在使用？」


    # 利用對方感興趣的事物來說謊


    針對大多數人建立投契關係，會舉例消防署、知名演員等眾人信賴的事物，不過若是針對個人的詐騙，就得找出被害者對什麼抱持信賴，才能進一步深化投契關係。


    舉例來說「說謊搭訕女性」。'
