    ## 觸發式郵件與深化恍惚狀態


    最容易理解且常見的是，名為「觸發式郵件（Triggered Mail）」的營銷手法。這是依循「招攬」、「教育」、「販售」的步驟，推銷某樣商品的自動送信系統。


    首先是招攬，這類似網路上的「訂閱電子報」。點擊訂閱後，每隔三天就會自動寄出事先作成的郵件內容。這就是觸發式郵件。


    接著，教育是「透過數封郵件來激發購買意願」。


    最後是「販售」。


    「深化恍惚狀態」的思維，理所當然是用於「教育」的部分。


    試想，收到第一封訊息後，整整半年都沒有再收到郵件，有些人甚至會忘記自己已訂閱。但是，馬上收到的第二封訊息是「請購買一百萬日圓的掛軸」，也不會有人真的購買。


    所以，第一封訊息寫說：「您好，我的興趣是收集掛軸。」第二封訊息寫說：「掛軸真的是很棒的东西。」第三封訊息寫說：「最近買進了非常雅緻的掛軸。」第四封訊息寫說：「這原本要價五百萬日圓的珍品，但我努力跟對方談了價錢。」第五封訊息寫說：「現在只要一百万日圓就可入手。」


    這就是透過間隔適切的時間，連續送出這五封郵件進行「教育」，提高收件人的購買意願，深化恍惚狀態的做法。


    當然，販售掛軸是極端的例子，但商業上也存在如同安排魔術秀、製作電影或者連續劇一樣的手法。


    ### 以「體溫計」說明如何深化恍惚狀態


    前面提到「投契關係」這個關鍵詞，這邊再稍微進一步說明。


    各大心理叢書常提到的「投契關係」，大家可先理解為「建立信賴關係」。


    若放到催眠術、魔術世界中，就是「與受術者建立投契關係的狀態」，亦即「受術者信賴施術者的狀態」。


    在解釋「深化恍惚狀態」時，我經常舉「體溫計」作為例子。


    試想，你手上有一支可任意改變溫度顯示的體溫計。眼前有位正準備接受催眠者。


    他的實際體溫為36.5度。使用體溫計量完體溫後，騙說：「你的體溫37度。」並給他看溫度顯示，結果對方表示：「聽你這麼一說，我覺得身體有些疲倦。」


    這就是暗示所引起的「催眠現象」。


    如果想強化投契關係、信賴關係，你可以穿上白袍，假裝自己是醫生，宣稱：「這支體溫計的精準度是世界第一。」


    經過這樣的事前誘導，對方會相信你所提示的溫度。


    然後，實際體溫與你所提示的溫度之間的溫度差，相當於商業上消費購買意願與營銷商品價格之間的落差，或是對方能接受的催眠現象與即將施展的催眠現象之間的差距。


    對體溫36.5度的受術者，突然說：「你的體溫40度。」對方很難相信。這就像是對存款只有十萬元的人，推銷：「買間一千萬元的房子吧。」


    那麼，專業魔術師、商業人士會採取什麼樣的作法呢？


    答案是階段性提高謊稱的體溫。


    先謊稱「體溫37度」，誘導對方感覺身體有點發熱。過一會兒，再說：「現在升到38度了。你有感到頭痛嗎？」相信這說法的對方，可能會開始覺得頭痛。


    「體溫變成39度了，你的呼吸有些急促喔。」


    「哇啊！現在升到40度了！」


    此時，有些人會失去意識，當場昏厥。


    這就是逐漸「深化恍惚狀態」的感覺。


    當然，一樣米養百樣人。「喂！你的體溫有40度！」走在路上被陌生人男性搭話，有人真的會大叫：「哎！不會吧！」當場昏倒。


    如果遇到這一類型的人，可能在頭部附近打一個響指，就會直接昏過去，成功施展像是催眠術的催眠術。


    然而，大多數人都不是這一類型。


    不過，當表演者穿著醫生的服裝，或者穿得像是催眠師，對方就有可能無意識下建立起投契關係。


    逐漸提高謊稱的體溫，慢慢讓對方感到頭痛、臉紅，最後才有機會昏過去。


    換句話說，施術者暗示時需要拿捏：「對體溫36.5度的人，該先謊稱幾度他才會相信？」


    當然，有些人會說：「我才不相信醫生！」當遇到「體溫計等機械都是騙人的」這類人，施術者得改用手掌貼額頭來量測體溫。在商業上，透過高明的行銷手法，有機會對任何人引發類似前面的昏厥現象，讓對方買下一千萬日圓的房子。


    ### 當心數字的「間接暗示」


    由前面的體溫計例子可知，「數字」是非常容易理解，誘導對方想像的要素。


    所以，詐騙集團、催眠師通常都熟習操弄數字。


    我們每天都會接觸大大小小的數字。


    比起「能大賺一筆」，「獲得一千萬元」更容易讓對方瞭解，具體的數字能激發對方的想像。但是，將「獲得一千萬元」說成「一億元」，效果卻不會增加十倍。


    若想試圖「讓對方想像」，關鍵在於使用大家所熟悉的數字。某理財投資的推銷，「你瞧瞧。」拿出自己的存摺給對方看。


    在理財推銷的世界，「讓對方看存摺」儼然成為標準流程，觀看存摺的一方容易誤以為存摺上記載的數字可以證明「沒有說謊」。


    比如，「一天一百元，只要一杯咖啡的價錢。」透過這種說詞，勸誘客戶購買高額貸款、分期付款、加倍利率等等，會在各個地方提出數字證明。


    這其實是相當巧妙的「間接暗示」。


    演出催眠秀時也是同樣的情況，不是說：「我催眠過很多人，是催眠術的專家。」而是說：「我三年來催眠超過兩千人。」


    如此一來，觀衆會在腦中推算，「三年催眠兩千人，也就是一年……」


    我們從小就被灌輸算數、數學、統計等知識，像這樣的計算可說是後天的接受暗示性。


    在腦中將三年兩千人換算成一年六六六人，自然會形成「這個人三年來每天都會催眠約兩個人」的認識。


    在此藏有重要的關鍵。


    其實他並沒有明說：「我三年來『每天』都會催眠他人。」而是利用人會主動計算數字的習慣，傳達「間接暗示」。


    正因如此，對施術者來說，數字是非常有效的手法。


    再試著以前面的理財推銷作為例子。


    當客戶聽到「兩年間每個月可賺進二十萬元」，馬上就會推算一年可獲得二四○萬元、兩年可獲得四八○萬元。而且，這還不是推銷員說的，是客戶自己計算。


    因此，只要說「投資兩百萬元，連續兩年每個月可賺進二十萬元」，即便推銷員沒有直接說出「這投資不會有損失。每年可獲利二四○萬元」，也會間接傳達這樣的暗示。


    ### 當心「品牌」威脅效應


    相較於「未曾聽過的東西」，人會選擇信頼「曾經聽過的東西」。雖然聽起來理所當然，但反過來看，這也可說是「對未知的恐懼」。


    在催眠術上也是如此，我們人類具有「害怕未知事物」的畏懼本能。


    舉個比較誇張例子，如：原始人第一次看見火焰嚇得全身發抖；中世紀因害怕魔術而發起魔女狩獵。想要消除對未知事物的畏懼，是件相當困難的事情。


    即便是效果、性能完全相同的商品，人們容易選取大廠的產品，或者曾在電視廣告上「聽過」的品牌。


    顯見，相信品牌威光的人不在少數。


    藉助威光的方式大致有兩種。


    第一種方式是運用自身的權威。第二種方式是「狐假虎威」，利用其他已經存在的權威。


    比如，利用知名人士的名字或者大家熟悉的話語。


    僅是藉助威光，他人的看法就會截然不同。


    以魔術秀來說，加上「那位知名魔術師親授」、「曾上過電視節目」，即使是相同的演出，觀眾的熱絡程度也會有所不同。


    題外話，我會在店裡播以前上電視的演出節目，初次來店的客人會問：


    「電視上的那個人是你嗎？」


    這其實也是簡易的威光效應。


    不知名咖啡店老闆所表演的湯匙彎曲魔術，與曾上過電視節目的湯匙彎曲魔術，明明是同樣的演出，觀眾的反應卻截然不同。


    催眠客人的時候，看過節目影集再催眠與什麼都沒有看就直接催眠，我自己覺得前者的成功率高出兩倍。「他是曾經上過電視的催眠師，我肯定會被催眠吧。」只要客人產生這樣的想法，就容易被我催眠。


    ### 當品牌威光失去效果


    不過，任何事情都一樣，一旦被對方識破藉助威光效應的意圖，情況就會反轉過來，產生負面的效果。


    就「利害系統」來看，這如同「他不惜說謊也要藉助威光效應，試圖從我這邊佔便宜」，會讓對方覺得是明顯的損害。


    譬如對來店的客人，直接打開電視說：「你瞧，我有上過電視表演催眠術！厲害吧！」可想而知，此行為的意圖過於明顯，即使我沒說謊，仍會給人厭惡的感覺。


    客人走進店裡，不用多做其他表示，讓他自己注意到眼前的老闆與電視中的是同一號人物——


    這就是活用品牌威光的間接暗示。


    不久前蔚爲話題的「隱性行銷（stealth marketing）」①，請有權威的知名人士在自己的部落格（讓人不覺得有商業利益的場所）進行宣傳，這樣的巧妙方法


    也是間接暗示的典型例子。如大家所知，此做法被揭穿後，只會帶來反效果而已。


    ### 最危險的是「主觀深信」


    我的魔術秀當中，有個節目是「偷錶魔術（Watch Steal）」。如同字面上的意思，這是趁觀眾不注意時，偷偷取下觀眾手腕上手錶的演出。


    這在海外被稱為「扒手秀（Pickpocket Show）」，是相當大眾的表演，但原本是扒手的技術。當然，因為只是演出而已，結束後會把手錶歸還客人。


    日本不常見這樣的表演秀，這或許跟沒有肢體接觸、擁抱的文化有關。不過，雖然只是一支手錶被偷，表演卻相當受到客人的喜愛。


    當客人看到自己的手錶出現在眼前，無不感到驚訝：


    > 「我完全沒有注意到。錶帶明明繫得好好的……」


    表演偷錶時有三個要點。


    - 第一，轉移對方的注意力。


    讓客人握住硬幣，邊說「請緊緊握住」邊慢慢抓住對方的手腕，此時對方的意識集中在硬幣上，不太會注意到手腕被抓住。


    - 第二，不讓對方意識「手錶會被偷走」。


    雖然是理所當然的事情，但如果哪天王主持人介紹：「這位是偷錶高手。我們現在來看看他的拿手絕活。」那手錶是絕對偷不成的。


    - 第三，不讓對方意識「手錶能被偷走」。


    這和第二點很像，但「會被偷走」與「能被偷走」有點不太一樣。換句話說，因為大部分的客人都認為「我怎麼會沒注意到手錶被偷」，後面才會驚訝：


    > 「錶帶明明繫得好好的！」


    偷走手錶之後，我又表演其他魔術約十分鐘，但沒有人注意到手錶不見了，


    甚至有人是突然想看時間，才自己解釋：「啊！我今天沒有戴手錶。」自認沒有問題的注意力、記憶力，就是如此不可靠。將外出時都放在臀部右邊口袋的錢包，哪天試著改放到臀部左邊的口袋數小時後，「咦？錢包不見了！」你就能夠體驗這般奇妙的感受。


    「我不可能被騙。」「怎麼可能沒注意到。」「哪有可能會被偷走。」正是這樣的主觀深信、信心十足，最是危險。


    ## 第2章 愈是信心滿滿 愈容易受騙上當


    ——容易被催眠的人與不易被催眠的人


    ### 經驗聯想的想像威力


    當我說「我要施展催眠術」，肯定會出現「我才不會被催眠！」與「我絕對會被催眠！」兩種聲音。


    這不是挺矛盾的嗎？


    因為大部分的人都沒有被催眠的經驗。換句話說，這些人只是在腦內擅自這麼判斷，聯想以前在電視上看過的催眠術，施加在自己身上的情況。


    比如聯想吃檸檬後大叫「好甜！」的催眠，或者女性對男性表白「喜歡你！」並抱住對方。


    人會從過去所獲得的情報，擅自在腦內聯想「催眠術」。


    當我說「我來表演魔術」，許多人會認為是「說中抽出的紙牌」，但稍微年長的人則會覺得是「從帽子中變出兔子」。


    「經驗聯想的想像」威力非同小可，而且還相當危險，施術者可以好好利用一番。


    說到「壽司店」，跟我同一世代的日本人，容易聯想慶祝時叫外送壽司，或者緊坐於檯前讓直屬上司請客的光景吧。


    「年輕人！今天去吃壽司吧。我請客。」「哎！真的嗎？」


    然而，最近的小孩外出上館子時，通常會覺得：「今天要去家庭餐廳？還去吃壽司？」提到壽司就想到迴轉壽司，聯想到輕鬆愉快的畫面。


    這些孩子長大後，聽到上司邀約：「年輕人！今天去吃壽司吧。我請客。」他們很有可能說：「壽司嗎？怎麼不請好一點的東西……」


    如同上面的例子，不同世代的聯想意象會有所不同。提到「酒吧」，對年輕世代來說是歡唱跳舞的場所，但對父輩來說卻是沉澱心情的喝酒之處。


    而提到催眠術，許多人抱有宛若魔法般的意象。


    打一個響指，就突然倒下失去意識，醒來後才驚覺發生不得了的大事——這是多數人對催眠術的聯想吧。


    被催眠，其實就只是「相信」而已。


    認為自己被催眠的人，會覺得「檸檬吃起來是甜的」，因為他們相信「被催眠」這件事是「有可能發生的」；相反地，也有人認為「這樣的事情不可能發生。」


    當然，真正的催眠術並非僅有誇張的現象，但就我自身的經驗來說，只要施術者宣示「我要施展催眠術」，對方就會陷入自己擅自設想的「催眠術」中。


    ### 「受暗示性」是催眠師的推託之詞


    那麼，當遇到對方表示「我絕對不會被催眠！」大多數的催眠師會解釋：「你是不是不容易被催眠，受暗示性低落的人。」


    在催眠術的歷史中，這個「受暗示性」不斷被拿出來使用，但在我看來，這詞只不過一種藉口、說詞。


    「受暗示性」意即「接受暗示的程度」，但人並非天生就具備這樣的特性。去催眠教室或者購買催眠教材，通常會寫說「測量每個人的受暗示性，可發現十個人當中約有五個人會發生肌肉僵直（Catatonia）的現象。」「還有，「十個人當中約有三個人會受到情感控制的暗示左右，甚至有人會中看見幻覺、操弄記憶的催眠術。」


    然而，仔細一想。


    如同前述，這只是受術者「自己擅自設想的催眠術」。正確的说法是，「催眠師施術後，十個人當中約有五個人相信手臂可能發生僵直的现象。」


    會怎麼受到催眠、會受到什麼樣的催眠，都跳脫不了受術者的設想。


    「我曾經聽說過，小孩看了電視上的催眠秀，突然就被催眠了，兩手好幾天都不開。」這是因為孩子深信「透過螢幕也會中催眠術」，所以才覺得「不解開催眠就回復不了原狀。」


    「人聽到一個響指，會瞬間倒下失去意識。」這樣想的人實際聽到響指時，真的會當場失去意識。


    「可是，是否被催眠要看個人。我聽到響指大概不會失去意識吧。」這樣想的人即使聽到響指，仍舊能保持清醒。


    因此，宣布「我擅長這類催眠術」、「我能一瞬間施展催眠術」的催眠師，僅是為了發揮威光效應才這麼說，若是真的認為「我的催眠術非常厲害，眼受暗示性沒有關聯」，那只是自身的錯覺而已。


    搬出受暗示性一词，會讓人覺得責任好像在自己身上，這只不过是催眠師對不相信催眠術的人，解釋為什麼他不會被催眠的推託之詞，能夠暫且逃避責任，才會長期使用沒有根據的「受暗示性」一词。


    ### 不易被催眠？ 這樣「暗示」立刻中招


    那麼，該如何催眠不相信催眠術的人呢？


    假設有一位受術者名為A先生。首先，矇住A先生的眼睛，拉著他的手走一段路。A先生完全不會得被帶到什麼地方。


    接著，讓A先生坐進車內、搭乘電梯，最後在他的耳邊低語：「現在，我們來到大廈的頂樓，邊緣沒有圍欄防護，你要小心不要掉下去了。」此時，A先生會感到：「好可怕！」雙腳站不穩而跌坐在地上。然而，那裡其實只是一間普通的房間而已。


    這邊的重點是，A先生相信了「我們來到大廈的頂樓」這個謊言。明明不是真的在頂樓，為什麼他會信以為真呢？


    那是因為A先生真的有移動，實際想像被帶到大廈的頂樓，認為這是「有可能發生的情況。


    如果想用催眠術引發相同的現象，難度會大幅提升。


    我現在要施展催眠術。請你閉起眼睛、放鬆身體，想像你坐進車子被帶到某個地方，搭上的電梯來到頂樓。數到三清醒後，你會怕得雙腳顫抖！


    實際想像情境，如果雙腳真的顫抖，那就是「中了催眠術」。怎麼樣？應該不好想像吧？


    認為「自己不會被催眠」的人，會拒絕憑空想像。


    想像你坐進車子。「這麼說的時候，對方會反駁：『哪來什麼車子啊！』認為「自己會被催眠」的人，大多也會反應：『嗯……我努力過了，但實在太難想像了。』


    反過來說，沒有宣示「我要施展催眠術」的場合，實際帶著對方移動，讓他認為情況是「有可能」發生的，就能輕易製造跌坐在一間普通房間的狀況。


    如同講述真實的恐怖故事後，再前往靈異場所，有些人會覺得「背部有一股寒氣」、「這邊氣氛怪怪的」，「暗示」愈加真實，對方就愈容易深陷其中。


    ### 成功的暗示基於信念


    一個不相信靈異現象的人，對他說再多恐怖故事，只是適得其反。


    想要讓他感到恐怖，光說不夠，還得調暗照明、替換背景音樂、製造靈異聲響……等。同理，對不相信催眠術的人，要費盡心力才能引發現象。為此，催眠師會先做出手指黏在一塊等簡單的現象，製造「我是厲害的催眠師！」的威光效應……催眠師真是煞費苦心。


    不過，如果不說是「催眠術」呢？比如，氣功師對相信氣功的人把手懸放在頭上，說：「你現在感到身體發熱。」在我來看，這也是一種「暗示」。換句話說，對方只是中了名為氣功的催眠，陷入相信氣功的狀態罷了。對相信氣功的人說「我要施展催眠術」，反而難以引發現象。


    那麼，該如何讓相信氣功的人接受「手變僵直」的暗示呢？其實相當簡單。


    「我學了很多年的氣功。這個房間裡充滿了真氣。請你閉上眼睛並緊握雙拳，將這些真氣聚集到手掌中，如果沒辦法用自己的意志打開，就表示你吸收了我的真氣。」像這樣講得「煞有其事」。如此一來，大部分人也會成功被催眠。


    這邊的重點是，因為對方相信「氣功」，換成跟氣功有關的說法，他就會接受暗示。


    實際上，這樣真的會引起「手變僵直」的現象，是很成功的暗示。


    ### 讓對方接受暗示的密技


    將「讓對方接受暗示」理解為「讓對方相信自己」，大家應該能夠了解宣示「我要施展催眠術」，只會增加施術的難度。然後遇到催眠不成功，催眠師就會推託辯稱：「你的受暗示性⋯⋯」


    那麼，為了讓對方接受暗示，首先應該做什麼呢？


    答案是「找出對方相信的事物」。


    對相信氣功的人，改用氣功的說法；對相信靈異現象的人，改用靈異的說法；對相信算命占卜的人，改用算命的說法⋯⋯


    ### 人容易輕信「統計、醫療、權威、學術」等用語


    如同前面的例子，只要講得「煞有其事」，就能輕易用暗示引起催眠現象。其實，真正相信催眠術的人並不多。人數肯定比相信氣功的人來得少。社區大學可能會開辦氣功教室，但基本上不會看到催眠教室。


    找出對方相信什麼事物，再換成相關的說法──。


    但是，氣功、靈異現象、算命占卜等，真心相信的人也不算多。如果是女性，大多會喜歡算命占卜（這也是女性比較容易被催眠的原因）。


    氣功到底只是其中一個例子，但其實還有更簡單、讓多數人都相信的說法。


    那就是，穿插「統計」、「醫療」、「權威」、「學術」等名詞。


    這些是日常生活上，常接觸到的正式用語。


    現代很多靈能者會高舉「這是心理學」，其緣由就在這裡。


    對相信氣功的人說「我會使用氣功」，對方就暗中暗示「對於大部份信奉科學的人來說，僅僅只是在前面加上「統計上來講……」就能讓對方不疑有他。這真的非常簡單。


    那麼，將「手變僵直」的現象轉換為「偽科學」的催眠範文，如下：


    「我在東京大學教導人體力學。在醫療領域方面，我具備復健醫療等專業技術。現在請你像這樣握拳、伸直手臂，並在手肘的位置用力。然後，你會覺得沒辦法自主張開手掌，產生類似痲痹的感覺吧？拳頭打得開嗎？」


    說法不用完全一樣，但只要這樣一講，很多人就會反應：「真的耶！拳頭打不開！」


    來店的客人當中，若遇到這種類型：「能夠催眠我的話，你就試試看啊！」


    我會這樣切入話題：


    「其實，催眠都是騙人的，那不過是利用人體反應罷了。要不要試試看？比如……」


    十分鐘後，那個人手掌就張不開了。


    雖然這樣做與催眠師追求的「驚奇」相去甚遠。將催眠術說成是「科學」，讓對方張不開手掌，客人也只是覺得「原來如此！」


    不過，在日常生活上，像這樣讓對方相自己的行為，真的不難做到。


    ### 愈是認為「我才不相信沒有科學根據的事情」，愈容易受騙


    催眠術、幽靈、氣功，絕對都是騙人的！

