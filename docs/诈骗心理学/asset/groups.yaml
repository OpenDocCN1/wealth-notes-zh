    # 以「體溫計」說明如何深化恍惚狀態


    前面提到「投契關係」這個關鍵詞，這邊再稍微進一步說明。


    各大心理叢書常提到的「投契關係」，大家可先理解為「建立信賴關係」。


    若放到催眠術、魔術世界中，就是「與受術者建立投契關係的狀態」，亦即「受術者信賴施術者的狀態」。


    在解釋「深化恍惚狀態」時，我經常舉「體溫計」作為例子。


    試想，你手上有一支可任意改變溫度顯示的體溫計。眼前有位正準備接受催眠者。'
  - '[PAGE 55]


    眠的觀察、受術者，他的實際體溫為36.5度。使用體溫計量完體溫後，騙說：「你的體溫37度。」並給他看溫度顯示，結果對方表示：「聽你這麼一說，我覺得身體有些疲倦。」


    這就是暗示所引起的「催眠現象」。


    如果想強化投契關係、信賴關係，你可以穿上白袍，假裝自己是醫生，宣稱：「這支體溫計的精準度是世界第一。」


    經過這樣的事前誘導，對方會相信你所提示的溫度。


    然後，實際體溫與你所提示的溫度之間的溫度差，相當於商業上消費購買意願與營銷商品價格之間的落差，或是對方能接受的催眠現象與即將施展的催眠現象之間的差距。


    對體溫36.5度的受術者，突然說：「你的體溫40度。」對方很難相信。這就像是對存款只有十萬元的人，推銷：「買間一千萬元的房子吧。」


    那麼，專業魔術師、商業人士會採取什麼樣的作法呢？


