    ## 「集客術」講師，自己卻招不到學生？


    市面上，有許多心理學大學教授出版「人際溝通技巧」相關書籍，雖然銷售跟宣傳手法也有關係，但若能運用心理學吸引消費者，照理來說這些書應該都能成為暢銷書。然而，現實卻不是如此。即便是教導溝通技巧的人，仍會和他人吵架、經歷離婚（事實上，就有心理學者在
    Twitter 上大打筆戰）。


    經濟學的權威只需要專心投資股票就好，何必出來從事教學生這檔麻煩事呢？


    「既然」具有攬客技巧，講師開課教導「集客術」，理應不會遇招不到學生的窘境；「既然」有絕對賭贏賽馬的系統，應該不用販售該系統也能夠大賺一筆；「既然」身為經營顧問，只需要自己開店不就行了。


    如果真的有怨念存在，贏得體育競賽的隊伍，全員都會因敵方隊伍的怨念而身體運作失靈。


    就像這些例子，面對未知或者自己無法理解的現象時，先以「既然如此」的思維來質疑，是保護自己遠離詐騙、可疑勸誘的第一步。


    ## 被洗腦的人都在想什麼？


    做不到「既然如此」思維的人，不慎誤信不正當的事物時，反而會執著於自己所相信的東西。


    實際上，有許多店會將魔術包裝成超能力，展現不可思議的現象。以前對超能力感興趣時，每聽聞有類似的店家，都會實際走訪一趟。


    某天，我在網路上看到有人說「那家咖啡店的超能力是真的」。


    那間店我以前曾經去過，店家只是演出一般的魔術表演，但所提示的根據實在令人不敢苟同。他們動不動就說「我來幫你清除邪氣」，把手懸於客人的頭上，娓娓道出：「你的祖先……」


    網頁最後設有「你相信嗎？」的調查選項，我勾選「不相信」並提交表單。然後，該網頁管理者傳送這樣的訊息給我。


    「為什麼不相信呢？」


    詳細的往返內容這邊就省略，當我回答：「因為魔術也可以做到相同的現象。」對方就傳來這樣回覆：


    「你或許能用魔術做到相同的現象，但那位大師是使出真正的超能力。請不要濫用魔術來模仿。」


    他是打心底從心底這麼認為，我也就不好說服他。


    最有趣的是，他說：「那位大師能讓木箭穿過五元日幣的孔洞。這個魔術能夠做到嗎？」


    其實，這是名為「箭矢穿孔（矢れば出来る）」的商品，上網搜尋一下就能找到的「販售品」。這是秋田縣的傳統工藝，看到他傳送過來的照片，我差點當場暈倒。我記得我的回覆是「這在市面上可以買到」，並附上商品的連結網址。


    這位「信徒」信誓旦旦回覆：


    「或許市面有在賣相同的東西，但我是親眼看到木箭穿過去的，那是真正的超能力。」


    這完全是被洗腦的狀態。「洗腦」一詞本來是指「戰爭時的思想改造」，但大家對「洗腦」的印象應該多像是這位信徒的狀態吧。


    本書是將誘導對方相信，定義為「暗示」，而拒絕他人否定自己相信的事物，定義為「洗腦」。


    在被洗腦的狀態下，即便我說：「可見，那位超能力者會偷天換日。」那位信徒也絕對不會信服。


    否定自己堅信的事物，就等同於否定自己本身。


    換句話說，受暗示的程度愈為強烈，愈趨近洗腦的狀態。


    以這個的例子來說，那位信徒只是拒絕否定自己在網路宣傳上的努力、來回咖啡店的時間以及各種金錢開銷。


    這結論是基於我所提出的行動原理「利害系統」。


    「否定自身投資的努力是一種損害」的心理。


    ## 騙子如何讓你走入陷阱


    讓人自動走入陷阱的契機，可能是輕微的暗示。


    不過，暗示時所花費的時間、精力愈多，愈能趨近洗腦狀態。


    曾接過詐騙電話小額轉帳的人，若再次接到同一虛構單位的來電，多數仍會回應對方的要求。


    這是因為受害人不願否定前面的小額轉帳，產生「我做的事情沒有白費」的心理作用。


    在詐騙銷售手法中，「您先來參加說明會」、「您先撥出一點時間」就屬這類型，總之先要求對方撥出時間參與說明會。


    因為騙子了解這或許是一種本能，人自然會產生「不想否定花費的時間、精力」的想法。


    詐騙犯、假宗教人士虎視眈眈瞄準機會，製造「輕微的契機」、「些許的付出」。


    認為自己不會中這樣圈套，但參加說明會的人當中，只有自制力堅強的人才有辦法拒絕對方的推銷。


    然而，「我做的事情沒有白費」的心理，在日常上也會形成巨大的枷鎖。


    比如，你以十萬日圓格外廉價的價格買下店員所推薦「狀態良好」的中古車，過戶後坐進車內，發現座椅綻開破裂，你會憤而提出客訴：「聽你們講狀態良好才買的，這是欺騙消費者！」


    然而，如果你是以兩百萬日圓價格買下中古車，發現座椅綻開破裂，你可能會認為「很有復古味」吧。


    即便課程內容相同，比起一萬日圓的講座，三十萬日圓的資訊教材會得到更多「很有幫助」的正面回饋。


    希望各位不要被「不想有所損失」的心理所矇騙，謹慎看清事情的真相。


    ## 大街小巷各種「心理技巧」的真面目


    打著讀心術之類名號的可疑講座、教室，會裝模作樣教導容易實踐的技術。比如，鏡射、同調行爲的「鏡像效應」，模仿對方的動作能夠產生親近感。還有「XoSo語法」，反覆多次誘導對方肯凈回答，當問及真正的問題時，對方容易直覺地肯凈回答（一貫性法則）。


    - 「今天天氣真好。」「是啊。」

    - 「最近開始變冷了。」「對啊。」

    - 「昨天的節目不錯看耶。」「真的。」

    - 「今晚，陪我一下。」「好啊。」


    情況有這麼簡單嗎？當然沒有這回事。


    這是比較極端的例子，但實際上，即使自然對話出現好幾次肯凈的回答，對方自我防衛的門檻也不會因此有明顯的下降。


    換句話說，因為鏡像效應與「XoSo語法容易實踐，「精神控制狂」才喜歡一臉得意展現這些技巧。


    即便讓對方說出一百次肯定的回答，對方也不會做原本不想做的事情。


    當然，實際接到電話誘導時，「不想讓電話費變便宜？」等等，推銷員會更巧妙包裝句子來引導你說出肯定回答，但如果對方的意圖過於明顯，那麼 Yes Set 語法的真正目的會在別的地方。


    對方不是真的要你說出「Yes」，而是「繼續肯定回答的對話」。


    也就是建立不斷同意的展開，讓你覺得「說的也是」，自然同意提問、對話，維持意見不相衝突的對話。


    藉助靈驗算命師的威光，與客人形成信賴關係後，即便結果說得抽象模糊，「說中了！」客人也會自己對號入座。


    這個說得抽象模糊的心理技巧，又稱為「巴南效應 (Barnum effect)」。


    簡單講就是，「煞有其事講述適用於任何人的描述，會讓人誤以為是在說已本身。」


    常見的例子如下：


    - 你希望被他人喜歡，但卻總是遭受批評。

    - 雖然自身有很多缺點，但你相信最後有辦法克服。

    - 自己還有尚未被激發出來的潛能。

    - 雖然對外表現堅強，但其實內心時常感到不安。


    「操縱人心的○○○」、「無往不利的心理技巧」等書籍通常會寫到，使用『巴南效應』(Barnum Effect)可以和人『建立投契關係 (rapport)』、『靈驗的算命師常用的巴南效應』，其實只是適用於任何人的描述。


    不過，仔細一想。


    面對初次見面的人，像是看透一切地說：「雖然你表現得堅強，但其實內心是軟弱的……」「對方反而會疑惑：「哎！到底是堅強還是軟弱？」


    其實，這是完全相反的情況。


    換句話說，不是「只要說出適用任何人的描述，就能贏得對方的信賴。」「而是「獲取對方的信賴後，即使結果說得抽象含糊，對方也會投射在自己身上。」「所以，真實情況不是「靈驗的算命師運用巴南效應，讓客人覺得是在說自己


    ## 為什麼「相同的藥物，醫生開出來的有療效，鄰居老爺爺給的卻沒用」


    的情況，而是「因為聽聞他是「靈驗的算命師」產生巴南效應，才自己對號入座，聽什麼都覺得在說自己。」


    日常生活上，我們會在不知不覺中根據對方的情報、職業、決定給予多少信任。


    看病前會先打聽醫生的評價如何，是「某某人去看過，結果愈看愈糟」，還是「他是全國有名的名醫」，進而產生「安慰劑效應 (Placebo Effect)」（透過心理暗示，讓不具作用的藥物發揮療效），建立信賴關係、投契關係。


    但是，鄰居老爺爺給的藥物就沒有什麼效果。


    如果「安慰劑效應」能幫助改善症狀那還好，但對於算命師、可疑的保健食品，我們得先確認自己心中有沒有無意識下形成投契關係。


    比如，「某位名人也有在服用」這類宣傳、知名食品工廠推出的商品等等，需要注意後續有沒有出現巴南效應，以免盲目相信「模糊不清的宣傳文句」。


    說穿了，催眠術就是「安慰劑效應」。


    如同「因為是醫生開出來的，所以藥物才有療效」，「因為是催眠師施展的，所以才真的會被催眠」。


    前面也有提過，巴南效應的本質只是「建立投契關係」。


    以前催眠教官傳授「數數」、「讓受術者向上凝視」等細項的催眠技巧，都是在建立投契關係的前提下才有意義，不如說這些是「藉助像是催眠術的演出，稍微博得受術者信用的技巧」。


    前往氣功教室，氣功師傅只要「哈！」地一聲將手往下揮，有些人會立刻軟倒在地。


    氣功，並沒有任何科學根據。


    假設他是「被可疑的氣功老師給騙了」（這邊暫且不論氣功的有無），那麼為什麼沒有放出真氣，只是手往下一揮就能擊倒學徒呢？這是因為「該學徒對氣功老師和氣功給予絕對的信賴」、「兩者之間建立了投契關係」。真相就只是這樣而已。


    這與催眠師獲取受術者的信賴後，「我數到三並把手往下一揮，你會軟倒在地」是相同的情況。


    數數方式與把手往下揮的動作並沒有太大的意義。


    不論是氣功、惡魔之力還是催眠術，只要建立起投契關係，讓受術者深信不疑，就會真的感受到不存在的真氣、看到惡魔的面容，產生強大力量操弄對方的感覺、讓對方產生幻覺。


    你或許不相信氣功、惡魔或者催眠術，也許有自信不被這些可疑的事物欺騙。


    然而，當大企業家、自己喜歡的名人、權力者、科學家、醫生說「這個商品很有效」或者「氣功真的存在」時，你確定自己能懷疑他們的話嗎？


    ## 操縱人心的重要思維——利害系統


    各種心理技巧，相信許多心理學書籍都已有詳盡的介紹。不過，如同前面提到的，巴南效應會因投契關係是否建立而受到影響。現在則要解釋，在操縱人心技巧上重要的思維——「利害系統」。如同字面上的意思，這個思維是考量「情況是有利還是有害」，可說是各大心理技巧的源頭。


    講得極端一點，不管受術者進入多麼深度的催眠狀態，說出多少次肯定的回答，但若被命令「現在馬上脫光衣服跳舞」，受術者也不會真的這麼做。這是因為不論暗示得多麼深入，對方的意識還是會判斷「現在脫光衣服跳舞是利益還是弊害？」「反過來想，如果讓對方覺得有利，催眠就有可能成功。所謂操縱人心的技術，說一切全看如何運用這項思維也不為過。


    我在故鄉以催眠術成名的時候，有許多客人慕名而來，其中有人說：「如果我


    真的被催眠，就給你一萬日圓。


    就利書系統來說，一萬日圓明顯屬於弊害。而且，自己明言前來挑戰卻真的被催眠，自己會感到丟臉。這對他來說也是一種弊害。


    若是他還帶了其他人一起來，那就會更加丟臉了。


    然而，如果他是一個人前來，而且擁有數億日圓的資產，那麼一萬日圓代表的意義就不同了。對這個人來說，被催眠是利還是弊，得當下觀察判斷才行。


    比如，有一群大學生組成的加油團前來我這邊。團員對團長處處照顧謙讓，但團長卻大擺架子，總是顛指氣使其他人。


    而且，假設這位團長是非常容易接受暗示的類型。


    在這樣的條件下，即便我暗示團長：「你會像狗一樣吐出舌頭，汪汪地叫。」他也不會真的被催眠。因為如果他真的在其他團員面前這麼做，對他自身的威脅會大打折扣。


    反過來說，在約女性出去玩時，即便不使用「Kiss」語法等技巧，只要想想能否讓對方感受到足夠的好處，自然就知道約不約得成。


    如果自己打扮邋遢、又髒又臭，對她來說是壞處；但若自己是有錢人，就會變成是好處。


    「兩人有共通興趣」、「明顯在打歪主意」等等，女性會潛在判斷各種條件來決定，絕對不是看說了多少次肯定回答。


    ## 詐騙犯都懂的「驚奇谷」


    我所提倡的另一個觀念是「驚奇谷」。


    大家是否聽過「恐怖谷（Uncanny Valley）」理論？


    這是指機器人、人形機器人的外觀不斷近似人類，超過一定的相似度後，人會莫名感到「恐怖」的心理現象（大家可以想像容貌逼真的人偶影集《電鳶神機隊》）。


    長年表演的經驗，我發現魔術也有這個「山谷」存在。


    比如，讓放置在眼前桌上的香煙滾動。此時，客人會反應：「哎？是不是你在吹氣？「接著，讓香菸懸浮於空中，「真不敢相信！這是超能力啊！」


    然而，如果繼續追求更為驚奇的演出，就會掉落「山谷」。


    這次讓身體向上浮起，雙手攤開，整個人懸於半空中。


    此時，客人突然就不認為這是「超能力」了，開始思索「他是怎麼讓身體浮起來的？」「是不是用看不見的繩索吊起來？」「這就是我所謂的「山谷」。


    接著走到戶外，讓車子向上浮起。


    「這很厲害沒錯，但是怎麼辦到的？」


    表演到這邊，還沒有跨越山谷。


    實際上，在國外的表演中，魔術師會乘坐在車轎裡頭，自由自在地在空中飛行。「太神了！」觀眾無不拍手叫好，雖然感覺不可思議，但沒有人感到害怕。


    我用催眠術讓友人的手變僵直，對方會反應：「哎！好厲害！我竟然中招了！」但若是讓他學狗「汪汪！」叫，他會說：「我只是配合你演出而已。」


    在電視節目的魔術，有時會讓建築物或者有大象般大小的生物消失，如果那場演出跨越了「山谷」，「建築物裡面的人沒事吧」「快把大象從異次元中變回來啊！」馬上會湧現這樣的反應吧。


    「山谷」就是這麼又深又長。


    表演，存在人對該現象感到真實、驚奇的界限，與超越這個界限的部分。


    磚幣在眼前消失是「魔法」；東京鐵塔在眼前消失是「很厲害的演出」。單就現象來說，東京鐵塔消失應該更加神奇千萬倍才對，但過於不可思議反倒會失去真實性。這情況並不僅限於魔術秀，不論想要演出什麼，掌握「山谷」的位置都是重要的環節。


    在詐騙方面，騙說「退還一百萬日圓，還可能湧現「真的嗎？」的心情，但若騙說「贈送一百兆日圓」，大多數人都會一笑置之吧。


    不過，仔細一想，拿到一百兆日圓應該會比較高興，賺得比較多才對。但是「缺少真實性」，人們反而不會把它當作一回事，而詐騙集團正是瞭解真實性的界限，熟知「山谷」的位置。


    當遇到逼近心中真實性底限的山谷時，人會輕易地跌落下去。


    ## 高明的魔術師懂得推測「驚奇谷」


    就表演者的立場來說，鄰近山谷的表達非常重要，但也要知道每個人對真實性的界線有所不同。


    簡單來講，對擁有資產一百億日圓的人說「贈送一億日圓」，對方會覺得「這是有可能的。」但同樣的話對存款餘額兩千日圓的人說，對方會認為「這是詐騙吧？哪有這麼好康的事情。」


    這會因環境、狀況而改變，所以不論是詐騙還是魔術，都得思考「向對方提示什麼樣的真實性表達」，這方面的推測技能可是詐騙犯的看家本領。


    表演湯匙彎曲的時候，我會先將湯匙放到自己的手掌上，以指尖摩擦變彎湯匙。


    接著，演出不觸摸湯匙使其彎曲，最後再讓湯匙在觀眾的手中彎曲。


    「有這樣的現象存在」、「世上也有這樣的事」如果不循序漸進，一開始就讓觀眾拿湯匙，表演「請壓住湯匙！瞧！湯匙彎曲了！」觀眾會反問：「這湯匙


    ## 高明魔術師如何提升「驚奇谷」


    有動過手脚吧？」不會認為這是真實的超能力現象。


    「湯匙彎曲」的現象是其中一個例子，當然在魔術秀整場演出中，從客人還未來店到離開店門口的這段期間，都存有著這樣的意圖。


    推測「能夠獲得多少觀衆心中的真實性」來安排魔術秀，就看魔術師的本事。


    「請在紙上寫出心儀對象的名字。我知道了！你喜歡太郎！」突然這樣演出，只會讓觀衆起疑：「你是從哪邊偷看的？」


    猜中名字的现象本身固然神奇，但如果魔术师不先让观众「对不可思议抱有一定程度的真实感」就直接说出名字，等同于「让这个现象白费」。


    換句話說，一場高竿的魔術秀並非不斷演出刺激的魔術。


    如同片長１２０分鐘的戰爭電影全都播出戰鬥場景，會觀眾覺得「夠了」一樣，不斷演出刺激的魔術，最後說：「請抽出一張紙牌。」觀眾也只會一臉無趣：「反正你會猜中嘛？」


    > 美國天才魔術師查理·米勒（Charlie Miller）曾說過：


    「若是有人要求你表演魔術，記得只表演一個就好了，而且結束後就立刻停止。好魔術只表演一個，你會得到很大的迴響。若是兩個、三個繼續表演下去，你的觀眾就能看飽看足了。所以，總是在『觀眾期待下一個魔術』時停止表演，是非常重要的。」


    當然，在觀眾面前演出魔術秀時，不可能僅表演一個魔術，所以需要時常意識不要讓觀眾看膩，別一直表演刺激的花招，透過巧妙安排讓觀眾從開始到結束都宛若看電影般盡興。


    然後，過程中，表演者要讓觀眾認識「自己是一樣的人？」「能夠做到什麼厲害的事情？」即便看到非常驚奇的演出，也會產生「這魔術師的確有可能做到的想法——


    這就是「驚奇感的提升」。


    正確安排如下：


    - ①先表演「湯匙彎曲」，讓觀眾認識「這個人很厲害」。

    - ②再表演猜中觀眾心中所想的數字，讓觀眾認識「這是會讀心的人」。

    - ③最後表演猜中名字，讓觀眾認識「超能力可能真的存在於世上，而這個人的或許擁有這樣的能力。」


    當回頭客帶了朋友來，要求「表演那個紙牌魔術」、「表演那個硬幣魔術」、「表演神奇的讀心」等時，表演者除了提升「真實性的山谷」，還得盡可能按照要求來安排演出（對經營魔術表演的店家來說，第二次前來的客人可是棘手的對象：．．．）。


    總而言之，每個人的山谷程度不盡相同，山谷可分為一到十的等級。當表演者遇到山谷等級十的觀眾，就得以逐漸提升等級的方式進行演出。


    ## 不讓「恍惚狀態」冷卻的方法


    「日本人的反應總是忽冷忽熱。」不時可聽到這樣的描述吧。但是，這現象並不僅限於日本人，發熱的東西放久了，自然會像燒熱的水壺一樣冷卻下來。


    原本喜歡的異性，經過了一陣子後，會漸漸失去當初的熱情；小時候非常憧憬結婚的偶像，現在已經沒有什麼印象了；曾經購買「成功法則」的書籍，熱衷遵循裡面的內容，但在不知不覺之中就忘記了這件事；明明下定决心要減肥，還畫出了圖表，結果……諸如此類。


    這可說是人類都具有的特質。


    然而，「將容易冷卻的水壺持續加熱，溫度反而會逐漸上升。」其實，這類似於催眠術中的「深化恍惚狀態」。意思為「讓水壺持續在瓦斯爐上燒開」，但興奮狀態、狂熱狀態會隨著時間經過而冷卻下來。


    比如，電影每播放十分鐘就穿插上廁所、休息的時段，會讓觀眾沒有辦法投


    入內容。明明是功夫電影，卻沒有打鬥場面，不到一個小時就會不想看。


    催眠時也是同樣的情況。


    「哇！我被催眠了！」如果不能持續讓受術者有這樣的感受，恍惚狀態就會逐漸冷卻下來。


    像是讓受術者的手變僵硬再解開催眠，解說手為什麼會變僵硬，等到要再施展下一個催眠的時候，受術者的恍惚狀態已經冷卻下來。


    因此，如果催眠者沒辦法間不容髮地接續下去，會無法成功引發「讓對方產


    生幻覺」的催眠現象。


    這與前面的「驚奇谷的提升」是類似的概念。


    ## 「深化恍惚狀態」應用於商業


    商業上也常遇到這樣的概念。

