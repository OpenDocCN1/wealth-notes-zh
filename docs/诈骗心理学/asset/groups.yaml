    ## 「一段時間就好，請喜歡上我。」


    許多人想要學催眠術的理由是，「希望讓異性喜歡上我」。現在打開瀏覽器，鍵入關鍵字「催眠術」搜尋，會出現「靠催眠術任意擺佈異性」等字眼，並附上大量情色的圖像。


    讓對方產生喜歡的心情，這樣的催眠是有可能的。


    催眠受術者喜歡上毫不起眼的花瓶，大家應該都曾看過類似的影片或者電視節目。就我個人的經驗來說，讓人喜歡上某物的催眠術相當容易，甚至比「手變價直」、「笑個不停」還要簡單。


    我非常擅長「操弄喜歡情感的催眠」，只要確實掌握前面提到的「利害系統」，便可用語論解說其中的機制。


