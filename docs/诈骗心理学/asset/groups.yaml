    內心會想靠「學習催眠術來左右他人」，這樣的人，本身就缺乏一般交流對話的能力，即便面對喜歡的女孩，大多也不敢開口：「我能催眠妳嗎？」


    況且，自己在被催眠的狀況下，壓根兒不會想靠催眠術來讓異性喜歡上自己。


    能不使用語言施展催眠術，讓對方在不知不覺中如自己所願行動——


    作為如此方便的催眠術，「非語言暗示」被視為重寶。


    想要仰賴非語言暗示的人，大多已經陷於「想抓住最後一根稻草」的狀態，所以即便老師信口胡謅：「只要輪出真氣，對方就會有反應。」


    「只要讓意識同調，就能如你所願。」


    學徒也會信以為真「可能真的會這樣。不對，是一定會這樣」，深陷其中而不自知。


    其實，我也曾經接過好幾通電話，「有辦法不表明是催眠術，成功催眠對方嗎？」


    甚至還有人提到「遠距催眠」、「遠距氣功」等意義不明的用語，說：「幾點幾分我會在家做好準備，請你送暗示過來。」


    盲信到這種程度，我也只能攤手投降。


    恐怖的是，在網路搜尋一下「遠距氣功」，竟然跑出「四十分鐘五千元」


    團」的費用明細。真是令人不勝唏噓。


    ### 別讓催眠術成為心靈沉迷的藉口


    單就「非語言暗示」來說，是有可能做到的。


    當然，這並非指氣功、潛意識等眼睛看不見的東西，催眠是讓對方產生意識的行為。


    前面的「換掉無酒精精啤酒的外包裝，讓對方以爲是普通啤酒，他就會喝醉」，就是一種非語言暗示。


    其實，你只要面帶微笑看著對方，對方同樣會回以笑容，根本不必用語言強迫「請你面帶微笑」（如果你面帶微笑看著對方，但對方卻回瞪著你，可能是身上有什麼致命性的缺陷吧）。


    看到別人打哈欠「也跟著打哈欠」、跟著他人一起笑、陪著他人一起哭：看到你這邊使勁全力，對方也會不遺餘力跟你競爭，這些都屬於非語言暗示。而不是意識共有、氣功連結等可疑的說法。


    遠距氣功，必須本人產生「幾點幾分會送真氣過來」的意識，才會真的奏效。若是利用者頑固表示：「我能感受到遠距氣功。相信我！」準備二十四小時待機，那我只想問：「你會在幾點幾分感受到？


    我本來就不推薦在暗示前，宣示「我是催眠師，現在要催眠你」的行為。只要讓對方產生意識，就算是暗示。授課中，直直盯著異性的臉龐，對方會想說：「他該不會喜歡我吧？」這就是一種暗示。


    若有催眠師持相反的意見，「真的有非語言暗示存在。別聽 CCC 在那隨便說亂說。」那就請不要只對自己身邊的人或者學徒這麼宣揚，隨時歡迎你對我施展非語言暗示。


    然而，他是絕對不會來挑戰。


    我真的想看看看看他用非語言暗示，讓人無法從椅子上站起來。不是僅在電車中，凝視坐在自己前面打盹的男子，不明所以地說「我暗示他打瞌睡」，而是希望他能夠確實驗證暗示的方法。


    我再重申一次，他是絕對不會來的。


    接下來，我想用更宏觀的框架追溯催眠術這個詞，探討催眠術究竟是怎麼一回事，並以「催眠術可說是無所不在，但也可說在哪裡都不存在」的觀點，改變世人對催眠術的認知。


    怎麼可以因為催眠術本身給人陰沈的印象，就一群陰沉的人聚在一起互道「催眠成功」，應覺自覺這樣的行為很不健全。


    這不僅限於催眠術，牽扯到「想要控制他人」等陰險思想的偽心理學、心靈教室，我認為都應該要徹底驅逐。


    如果真的能無視意志控制對方，根本就不需要特地招募學員。


    ### 獻給「想要體驗瞬間催眠！」的人


    繼非語言暗示、遠距催眠、遠距氣功，另一個受到歡迎的是「瞬間催眠」。


    過去，我曾在影片網站上傳演技影片，只需多打上「瞬間催眠」的關鍵字，點擊數就立即暴增。


    老實說，沒有其他比瞬間催眠，看起來更像是催眠術的演出了。兩人握手，催眠師稍微拉一下，對方就虛脫無力地倒地。


    這究竟是什麽樣的現象呢？


    如果拉手一下就被催眠，「跟我来一下！」每當被男朋友稍微拉手，女朋友就無力倒地，約會要怎麽繼續下去。


    就算是熟練的催眠師，隨便拉起路人的手，還是有可能遭到報警。不過，網路上真的有幾部突然拉住路人的手，路人就無力地倒下的影片。


    如同前述，暗示得讓對方產生意識才會凑效。


    換句話說，路人必須先意識到「對方打算催眠我」，才會發生催眠現象。比如，路人知道對方是上過電視的知名催眠師，就會意識「這個人是催眠師」。我的棉被拉到了，我肯定會被催眠。


    其他簡單的做法還有，拿出寫有「催眠師」職稱的名片。有些人在看到名片後，被敲擊手背便突然昏倒過去（這並不代表我認同「催眠師」這個職稱）。


    會說「有些人」是因為，對方必須先意識「我中了被催眠師敲擊手背，就會突然昏倒的催眠術」。


    要先有「催眠術就是這樣」的認知才會湊效。催眠師的英文是 Hypnotist，如果對方不清楚「催眠師是做什麼的？」不會真的昏倒。


    另一個方法是，事前佈局「瞬間催眠」的暗示。


    引發數起催眠現象，讓對方產生意識，再給予暗示：「聽到響指後，你會全身無力。」也就是所謂的「後催眠」、「後暗示」。


    只要受術者抱有这样的意識，每次聽到響指都會無力倒下。


    雖然瞬間催眠看起來像魔法一樣，但仍是對方有意識下所引起的現象。


    > 你聽到響指後會全身無力，聽到鈴聲後會跳起來，被敲擊手背後會開始唱歌，和我對上眼後會笑個不停。


    即使進入深層的催眠狀態、恍惚狀態，一次接收到這麼多的暗示，受試者聽到響指會疑惑「到底要做什麼反應」。這也證明了暗示不是利用潛意識、無意識，而是有意識地理解暗示所引起的現象。


    ### 催眠術可以消除記憶嗎？


    認為催眠術是方便魔術的人，接著會問：「催眠術可以消除記憶嗎？」


    他們的想法是，利用催眠術如自己所願地操控對方，但害怕對方清醒後進行報復，或者控訴自己為非作歹，所以得另外施加暗示，消除催眠過程的所有記憶。這真的是如意算盤。


    前面提過好幾次，催眠術是在「對方有意識」下，才能夠引發的現象。若是不記得起被暗示，就等同於「沒有意識」。


    譬如你施展催眠術，讓對方上前抱住異性，接著暗示：「你被催眠想要抱住他人和真的抱住異性的事情，全部都忘得一乾二淨。」


    之後，受術者發生催眠現象，產生「忘記自己抱過他人」的意識，發揮暗示的效果……


    但是，這樣不是很奇怪嗎？


    因為若是意識了「忘記自己抱過他人」、「上前抱住」等暗示單詞，就不會忘記「抱過他人」的事實，陷入兩相矛盾的情況。


    暗示是本人的利害衡量，判斷對自己是好是壞，才決定該不該接受催眠現象。只有當受術者本身有某種程度上的需求，認為這樣做也沒有關係，暗示才會績效。


    忘不忘记，要看待自己來說是有利還是有害。這就像是藕斷絲連的男女關係，若是「真心想要忘記對方」、「認為忘記是為自己好」，就會「完全不再去想這段關係」。


    這就是忘卻的現象。催眠術無法隨意玩弄大腦來消去記憶。


    ### 催眠專家的迷思


    長年接觸魔術，會進入「魔術迷」的境界。不在魔術酒吧或咖啡店以客人為表演對象，而是利用週末與其他愛好家互相分享獨創的技術、手法機關，形成彼此批評指教的關係。


    催眠術有相同的情形，報名催眠教室，會結交到許多催眠愛好家的朋友，相互切磋琢磨，觀看珍貴古老的催眠影片，研究催眠術的技法。


    進入這樣的領域之後，「自己心中的常識」恐怕會被重新改寫。


    第一次觀賞魔術表演時，魔術師說中自己抽出的紙牌，我當時覺得：「好厲害！我想要知道是怎麼做到的！我想學魔術！」但幾年之後，卻認為：「說中是理所當然的。」


    下面是某位魔術愛好家的演出情況。


    「那麼，我接著來猜觀眾抽出的紙牌。首先，先正反面混在一起洗牌，然後把紙牌排開來…………全部一致變成背面，只有觀眾抽出的紙牌為正面。」魔術師接著說：「到這邊為止是理所當然的現象，不過，當把紙牌全部翻向正面，所有的花色都按照數字大小排列！」


    看到這裡，我整個人無言以對。


    正反面混在一起洗牌的紙牌，怎麼可能理所當然一致變成背面。不過，他會這麼覺得，大概是因為每天都接觸魔術，才會產生「這現象是理所當然」的感覚。


    長年不斷表演、鑽研催眠術，表演一個把觀眾的手「變得僵硬張不開」是理所當然的事，不再覺得有什麼了不起。


    有些術師甚至表示，自己已經不覺得讓別人手掌張不開有什麼神奇了。魔術、催眠術基本上是對「什麼都不知道的一般觀眾」進行演出，所以愛好者反而更容易感到麻煩。


    「精神控制狂」也可說是同樣的情況。


    翻閱各種「心理學」、「操縱人心」的相關書籍，參加各種講座，結識了許多相同愛好的朋友，最後反而忽略應當操縱的對象是「什麼都不知道的他人」。


    雙重束縛（double bind）、鏡像效應、Yes Set語法……等，過程中能接觸各種深具魅力且看似容易實踐(實際上不好做到)的心理技巧。


    但是，接收這些並產生各種感受的對象，是什麼都不知道的陌生人一般人，而非志同道合的朋友。


    「請我吃壽司或天婦羅。」


    流口水之前，得先設想對方突然被要求「請客」，內心會產生什麼想法。


    獲得愈多該方面的知識，最後會成為該領域的專家，但一般人觀賞畢卡索的畫作，不難想像其內心會覺得「不懂是要表達什麼」、「我也能畫出類似的話。」。


    了解畢卡索的生平、作畫時的時代背景、家庭環境以及各種知識，才能真正了解畫作的深度。然而，許多人在明白之後，便得意說：「你不了 解這幅畫好在哪裡嗎？」


    如果自已已擁有專業的技術、知識，而展覽的對象是沒有繪畫知識的一般大眾，作畫時考慮一般大眾看到寫實的、肉感的圖像時會湧現什麼樣的想法，才能獲得好的評價與結果。


    「讀心術」也是同樣的情形。


    ### 超能力者是這樣誕生的


    翻閱各種書籍，「鏡像效果是指採取相同動作會讓對方潛在地產生親近感」比起熟知各種定義，「就算對方模仿我的動作，我也不會有任何感覺吧」這樣的一般評價更為重要，且更接近真實。


    回顧近代的歷史，可發現許多超能力者、超越人類睿智的異能者。


    在日本較有名的例子有明治時期的超能力者御船千鶴子。她在二十二歲時，說中丈夫錢包裡不見的五十圓日幣在佛龕的抽屜中。


    接著，在老家，受到姐夫清原猛熊催眠，妳具有透視能力，展現出驚人的成果。


    她承接公司的委託來到福岡縣，利用透視能力發現了萬田礦藏，獲得謝禮兩萬日圓（價值約相當於現在的兩千萬日圓）。


    據說，她還正確指出蟲子在樹皮下的位置、幫忙找到遺失在海中的戒指。


    更令人驚訝的是，清原還試著讓千鶴子透視人體診斷疾病，把手懸於頭上進行治療。


    電影《七夜怪談》中有名的貞子，是以山村貞子作為原型，兩人的共通點是「通過大學教授驗證的超能力者」。


    御船千鶴子受到京都帝國大學醫科大學的今村新吉教授（醫學），與東京帝國大學文科大學的福來友吉助教授（心理學），兩位東大、京大權威教授的驗證，這使她的超能力者名聲更為響亮。


    如果千鶴子的超能力真的，大學教授的驗證應該會出現驚人的結果吧（萬一超能力是真的）。


    不過就我看來，當時進行透視信封中的內容、透視鉛管中的名片等實驗，仍舊不離魔術的範疇。


    然而，看見透視結果的大學教授，卻寫定：「這是超能力。」


    教會這麼說，我想只有一個原因：


    > 「因為心理學、醫學的專家並不精通魔術。」


    ### 高知識份子為什麼反而容易被騙


    雖然是理所當然的事情，但不管在哪個時代，會把魔術認定為「超能力」的人，都是大學教授、醫生等科學或者醫學上的專業人士。


    尤里．蓋勒（Uri Geller）也是同樣的情況，但因為他們精通的是科學、醫學，所以才將超過這些範疇的現象，以「現代科學無法解釋」等常見說詞，說成「超能力」。


    接著，只要再大肆宣揚「某位大學教授認定的超能力」、「某位科學家無法解釋的力量」，没多久社會上就會誕生超能力者。


    真正精通魔術的專家是魔術師，絕對不是大學教授。


    我經營的咖啡店鄰近大學校園，那邊的大學生、大學教授明顯沒辦法解釋所有的魔術現象（不如說他們完全不能理解。不過對我來說卻是理所當然的事情……）。


    魔術的性質上，從「飄散在空中的分子，進到箱子重新組成紙牌」到「我透過你的內心、大腦」、「從身體上的小動作，我能說中你抽出的紙牌」等等，都是經過虛偽表現包裝，所以科學的視點容易關注這邊，而忽略藏於背後的真正機關，可以說愈是精通常科學學問的人，反而愈容易被。


    不過，這樣的情形在其他專業領域也一樣。


    對於「如果不夠精通，容易受騙上當」的根本部分，我們可逆其道而行，遵循「不輕信自己不懂皮毛的領域」、「若想要相信，至少要有所領域最低程度的專業知識」，作為保護自己的防衛手段。


    這種滅火器的成分添加了○○新素材，能比一般滅火器更快速、更廣範圍撲滅火苗。」對於到府推銷員的說詞，一般人容易輕信：「是這樣啊。」「專家說的準沒錯。「明明壓根兒沒有用過原廠牌的滅火器、滅火劑，看到推銷員拿提示的實驗結果、圖表、比較圖像等資料，就匆匆囫圇吞棗不求甚解，即使新素材沒有太大的差別，只因相信「兩倍效果」的片面說詞，就覺得「原廠牌的效果只有一半」。


    市面上，天天都可看到標示○○新成分配方的商品推出。但是，裡頭添加了什麼新成分？具有什麼樣的效果？一般人難以掌握這些問題，因此是不是真的有效都還是未知數。


    ### 詐騙集團掌握「未知」的恐懼心態


    雖說如此，但並非買各種東西都需要專業的知識，我自己也不是每天都在吸收各方面的知識。我們容易接受「大公司、大品牌說的準沒錯」的威力效應，建立信賴關係、投契關係。


    形成投契關係就能無往不利，商業上也存在這樣的催眠思維。


    需要警戒的是，**抱持惡意、明顯利用對方缺乏專業知識，而蔽詐的騙徒**。


    退款詐騙、點擊詐騙⑥等現代詐騙手法也是如此，騙徒會說出「您有一筆退款詐騙⑥的詐騙手法。


    款，請小額轉帳至此帳戶」等等。即便沒有專業知識，只要認清「不可能有這種事情」，就足以保護自己。


    一般平民百姓不具備公家機關的專業知識，「政府不會用轉帳來退款」、「只需要一點警覺心與常識就好。


    點擊網站廣告連結的瞬間，跳出「我們已取得你的住所地址、電話號碼。若未收到轉帳款項，不排除付諸法律行動。「低劣的詐騙手法如此猖獗，也顯示了「仍有一定的人數缺乏專業知識」的事實。


    點擊連結後，對方頂多只知道你有點擊而已，沒有辦法獲取住所地址、電話號碼。


