    這樣大致分類，我便能從容地演出：「數字 1 到 5 ，請在中心想一個你喜歡的數字。」（雖然未必能百分之百說中，但魔術都會事先拉起預防線）。


    如果客人是來看魔術，可透過對話來看清對方的特質，但若是來看催眠秀，在踏上表演台之前，就得掌握客人的特質。


    所以，我經常在正式表演前，先到觀眾席閒晃，豎起耳朵捕捉訊息。之後踏上舞台後，我會先限所有觀眾玩簡單的小遊戲，看清他們的特質。


    對方「容易接受」、「不容易接受」「暗示，並沒有一套制式的判斷方式，本書也難以說明其中的微妙差異，譬如「催眠術？我想被催眠看看」這句話，可能是「我真的想被催眠看看！」但也可能是「我不認為自己會被催眠，你要是真能做到就試試看！」


