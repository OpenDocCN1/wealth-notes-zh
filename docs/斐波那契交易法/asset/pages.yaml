  md: '# 5号模型


    ![](img/421d880e6971922e2fddb42e9cb1b38b_82_0.png)


    +   1. 点X和点A的时间段在5到13根K线之间（例如5分钟线，30分钟线或日线）。在罕见的情况下也可能是21根K线。这些都是斐波那契数字。


    +   2. 在点1和A之间没有价格模型。


    +   3. 当价格从X到1的运动非常强烈时，那么到A点的回撤可能只到达1X的38.2%或者50%。


    +   4. 如果从0.618到0.786的价差非常大以至于交易者不愿意承受，交易者应该等待进一步验证（例如，动能的改变或者蜡烛图形：'
