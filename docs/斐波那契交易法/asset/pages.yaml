  md: '停了跌势，而止损点可以放在前一个低点之下。


    ![](img/421d880e6971922e2fddb42e9cb1b38b_147_0.png)


    十次中有八次，当这些特定条件都发生了，紧跟着的就是一个可以提供可观收益的反弹。另外两次，只需要承受很小的损失。在依托这个形态交易的过程中，观察者靠的是两个经常遇到的反转形态，头肩顶或者双底正在形成的概率。


    处理这样一种操作的关键点在于：


    +   1. 有足够耐心去等待，直到一次足够大比例的回落发生；


    2. 观察到所有需要的条件都满足了；


    3. 有勇气在探底的小幅反弹显示枯竭后立即买入。


    4. 有勇气在获得可观利润（10%～20%）后出场，或者至少用止损点保护它。


