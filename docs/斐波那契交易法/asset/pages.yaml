- pgno: 56
  md: '点移动)，预示着市场将继续顺着原来的趋势大幅运动。


    ![](img/421d880e6971922e2fddb42e9cb1b38b_56_0.png)


    ![](img/421d880e6971922e2fddb42e9cb1b38b_56_1.png)


    5号模型和6号模型是反应模式。市场从点1开始的运动可能到达38%，50%，61%，70.7%，78%，100%（双顶或双底）。


    我唯——次使用38%的回撤位作为入场点，是当市场从X到1点的运动是一个巨大的冲剌（3到5倍的通常交易价差）的时候。如果你在市场的新运动中观察回撤，你将发现市场给你的关于下一步动向的强烈暗示。如果市场在第一波的价格摆动中仅仅达到38%的位置，那么很可能接下来的第二次或第三次价格摆动也会是38%。'
