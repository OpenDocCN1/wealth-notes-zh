  md: '# 伽特利 “222” 的说明


    这部分是关于伽特利“222”模型的说明，与他的著作《股市的利润》的221页和222页一模一样。


    # 最好的交易机会之一


    在那些初涉华尔街的人的生活中，在某个时刻会听到一声充满渴望的声音——“把它们买下来吧，抓住这次机会，以后再也碰不上了。”对那些有耐心的人来说，对顶部和底部模型的研究将时不时地提供这样一种机会——这种风险小回报丰厚的机会并不是每天都出现的。


    让我们看看图27（A）。在一个牛市或者熊市里经过一场中级的下跌之后，例如图中的A-B下跌。下跌已经进行了一段时间，市场运动已经显示出精疲力尽的迹象，表明流动性正在枯竭，一个类似B-C的小幅反弹出现了，伴随成交量的上升。当这个小反弹开始回落，在回落到先前的反弹（B-C）的1/3到1/2的点位时市场暂'
