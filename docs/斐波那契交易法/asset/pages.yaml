- pgno: 47
  md: '# 几何原理


    # 哲学几何


    古老的哲学家们教学生们神圣几何以开发其洞察力。


    从无限的纷乱无序中，到无止境的互相关联的数组形式中，几何试图重新抓住那些有序的运动，同时在重新创造这种从 1 到 2 的神秘过程中，呈现出图形上的可行性。


    神圣几何的实践是一种自我发展的必不可少的技术。


    几何解决单纯的形式，哲学几何从前一种形式中重新演化出每种形式的演变。


    # 比例规则


    我们今天已经知道了数学里蕴涵的自然法则起源于宇宙。人类并没有发明数学，只是通过对行星的研究发现了它。


    世界第七大奇迹吉萨金字塔的结构中隐藏了我们需要知道的所'
  merge: -1
  img_proc: true
- pgno: 48
  md: '有数学“秘密”。


    金字塔是地球、月球和它们围绕太阳公转的图形表现。金字塔显示出正方形、圆形和黄金分割之间的约束关系。


    ![](img/421d880e6971922e2fddb42e9cb1b38b_48_0.png)


    现代科学研究已经确认了月球和地球之间的距离。


    月球的半径是 1080 英里，地球的半径是 3960 英里。两者相加得 5040 英里（此数为柏拉图神秘的日历天数，即相当于 720 周*，360 的两倍，240
    的 3 倍，180 的 4 倍，144 的 5 倍，90 的 8 倍）。


    一个正方形环绕着一个圆表示地球有 4 边，每条边与地球的直径相等，例如 3960×2 或 7920 英里。这个正方形的周长为 31680 英里（7920 的
    4 倍，720 的 44 倍，360 的 88 倍，240 的 132 倍，180 的 176 倍，144 的 220 倍，90 的 352 倍）。


    如果把地球和月亮紧挨着放在一起，它们两个中心之间的距离将等于半径的和，例如 3960 加上 1080，等于 5040 英里。如果以 5040 为半径画一个圆，它的周长将等于
    $2\pi r$ 或者是 $2 \times 22/7 \times 5040$，等于 31680。


    圆周的长度和正方形周长的比例关系是 1.000 : 1.000。


    * 5040 = 7×720'
  merge: -1
