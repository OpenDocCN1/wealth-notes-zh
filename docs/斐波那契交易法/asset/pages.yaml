- pgno: 19
  md: '你用 255 除以 365，得出的数字大约是一年的 0.618。因为这是黄金分割，这让我变得十分兴奋。


    对于金星和天王星，每年有 12 个或更多的强硬相位。一个强硬相位是 30° 角或者它的倍数。


    幸运的是，我有从 1896 年至今的股票市场数据。所有我需要做的，只是找出 1896—1986 年间的金星—天王星的相位。1896—1986 的这 90 年给了我超过
    1000 个金星—天王星的相位例子。吉姆·特温迪曼，我的好友同时也是商品期货公司的交易员同事，在露丝的关注下，帮助我进行这个研究。


    关于金星—天王星的相位研究成绩很突出。目前这项研究具有超过 100 年的数据，而且统计数据是经得起考验的。它对于股票市场里 3~8 天周期测定的精准度令人称奇。股票似乎受此周期影响上下波动直到相位日。


