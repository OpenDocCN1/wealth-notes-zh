- pgno: 25
  md: '技术分析专家们一致认为图表分析就相当于查看一份路线图。这里有一个 X 轴和一个 Y 轴：图表专家们用 X 轴表示时间，Y 轴表示价格。当观察坐标的时候，你知道价格和时间相交的那一点。这个信息并不能告诉你接下来将要发生什么，没有任何东西能做到这一点。它所能告诉你的是，在这一时刻一个模式或许已经形成。我目前使用的“神经网络”只能做到这一点；同时滟音数字帮助我做出这个估计。它已经把这些模式按时间和价格进行了分类。作为一名交易者，我必须决定何时进场、何时出场，这就是交易的全部。然后我问自己两个问题：1.
    市场上是否有模式和比例信号存在？2. 我能承担得了这个风险？如果对上述两个问题的答案都是“是的”，那么我就进行交易。没有人能预料哪一个交易会取得成功。这是一场关于胜算的游戏，但可能性和结果在我的掌控中。


    你使用滟音数字的唯一方式，就是仔细检查一个接一个的例子，看看他们是如何起作用——他们的确有效！在过去，透露像这些数字这么重要的东西曾经是我的困扰。吉姆·特温迪曼用一句独创的话让我放下心来：“挑战人性——自己做工作！”这句话是总结！大多数交易员想让别人为他们做工作。这是不是懒惰、缺少责任心与工作热忱？我真不知道。但我的确知道，只有
    10%～15%的读者将实际深入研究日内图表，以证明这些滟音数字的价值。


    这里阐述的滟音数字都是我确定有效的。(关于如何发现震荡数字有一条明显线索，如果你感兴趣的话我将在本章结尾告诉你)'
