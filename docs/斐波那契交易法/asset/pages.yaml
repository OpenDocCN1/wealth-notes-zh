  md: '过了几个月他们打回电话，当他们说他们的盈余没变，他们在挣钱也仍然在犯错误但除了那个错误的时候，我们一起大笑。


    我们曾经有个学生，他非常想学习如何在标普指数交易中获利。当我们教他如何去做的时候，他总是说：“我懂得你们教我的东西，但我不想按那种方式交易。”


    最后我们中的一个问他是否在交易中获利了。“不完全是。”他回答。我们的经验告诉我们，他实际上在说他已经输光了。


