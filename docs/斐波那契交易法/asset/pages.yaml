- pgno: 174
  md: '要做它。市场就是它表现的那样，走势也是它表现的那样。它不在乎我们是谁或者我们在做什么。如果我们选了一个错误的决策，市场不会有什么反应。我们所有人有多少次听到某人的抱怨：“看看市场今天对我做了些什么？”市场不会针对个人或任何其他人做任何事。它不知道他是活着的，也不会在乎，它不欠我们任何东西，它就是简单的那样，所有发生的事情都是交易者自己造成的。例如，成功的交易者在基于市场内在韵律重复概率上做出错误决定。之前发生的事情将会再次发生。交易者通过分析建议何时、什么点位，以及会发展到什么程度。演化的形态总是很类似但是很少完全相同。他们可以被看作市场语言的语法格式，就像单词是语言的构成成分一样。


    第二个教训是做交易的时候不能带有情感。数学是干净、精练、合乎逻辑的。本书的模型识别和趋势分析提高了你交易胜算的机会，但你必须保持头脑清醒才能用它来赚钱。除此之外的忧虑，特别是个人的和情感上的，一定要放在一边（这很难做到），要么你不要交易。允许“烦心事”在你交易的时候干扰你几乎一定会造成灾难。拥有智慧和纪律能看出差别并且正确行动的价值不能被过分估高。因为错误的判断和情绪冲动而做出决定所损失的钱，比你通过实行正确的交易技巧而获得的收益要大得多也重要得多。因为一时冲动做出错误决策的情感代价要昂贵得多，心理上的伤害也比金钱损失大得多。


    重新获得金钱要比重建信心和自信容易得多。幸运的是，拉瑞知道他自己朝着危险的方向前进，强烈的自律能让他砍掉损失继续前进。


    第三个教训是，当作出一个错误的决策，并且在你知道错误的'
