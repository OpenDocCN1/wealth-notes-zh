    当布莱斯·吉尔莫和我在利用他的波浪交易者软件进行例行分析的时候，我们一起发现了这个模型。这是一个非常强力的模型，它只出现在非常大的顶部和底部。这个“蝴蝶”模型的美丽在于它的对称。这是我第二喜欢的模型（第一个是伽特利“222”模型）。


    当我的几个密友评论这本书时，他们建议我忽略这个蝴蝶模型。我那时已然明了我对这个建议的回答。我坚信就算你给交易大众们圣杯，他们也仍然领会不了交易的本质。原因或许是普遍存在的疑'
