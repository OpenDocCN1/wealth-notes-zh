- pgno: 18
  md: '+   b)《投机市场的行星谐波》

    c)《谐波振动》


    +   3. 150 个交易者到加利福尼亚的庇斯摩海滩来学习我的方法，他们中的大多数至今和我保持联络。


    +   4. 我在美国及其他 8 个国家给几千名交易者做讲座。


    +   5. 经济节目有线电视网 FNN（现在的美国全国广播公司财经频道 CNBC）定期邀请我作为嘉宾讨论行星周期。


    +   6. 皮萨万多指数在米勒博士的催促下诞生，现在它是俄克拉荷马州塔尔萨的商品交易员弗兰克 · 陶斯哲出版年鉴的日常部分。


    这个指数每天都标注出当天的行星周期数字。平均一天 8 个周期。当只有 3 个或更少的周期时，预示着市场有很大的可能性改变趋势。同样 13 个或更多的周期也预示这一点。


    我在过去 30 年间研究了大量的市场分析方法，这个方法非常独特。传奇交易员 W. D. 江恩是一个狂热的占星术支持者，伯纳德 · 巴鲁克也是。巴鲁克的评论
    “百万富翁不用占星术，但是亿万富翁用” 总是让我着迷。他雇佣了伊万杰琳 · 亚当斯作为他的私人全职占星家/天文学家。但让我对这个课题更感兴趣的是我早年读过的一些书。阿尔伯特
    · 爱因斯坦和艾萨克 · 牛顿都是狂热的占星家/天文学家。有一次，在一个非常重要的会议上，牛顿和现代物理之父约翰 · 开普勒争论占星术的话题，经过热烈讨论之后，牛顿评论说：“亲爱的爵士，我们俩之间的分歧明显在于，我已经广泛研究了这个主题，而你没有！”


    露丝告诉我的第一个循环是金星—天王星循环。她知道我已经深入研究了斐波那契而且对之兴趣浓厚。金星围绕地球的公转时间是 255 天，这也是金星穿过和天王星形成的
    360° 相位的时间。如果'
