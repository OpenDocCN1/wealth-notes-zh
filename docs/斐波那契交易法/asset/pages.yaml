- pgno: 149
  md: '# 伽特利“222”的说明


    那些日内图形。在附录部分，我选出了一些日内图形来图解这些模型。


    附录中还包括我在显示器上贴的纸条，告诉了大家我目前研究的商品和股票。它们每一个都有一个月线图、日线图和日内图。日内图包括 2 分钟线图、5 分钟线图、30
    分钟线图、60 分钟线图，还有一个闪电图用来记录市场的每一个变动。这很有帮助，因为它可以用来衡量你是否专注于你的指令以及当时的价位。


    如果一位读者阅读了由 H. M. 伽特利注释的“222”模型，他需要领会 3 个基本交易守则。


    +   1. 等待市场形态完成的耐心。

    2. 具备入场交易的勇气，并且使用止损点来最小化风险。

    3. 具备做空的勇气和力量，仍然利用止损点来保护头寸。


    “222”模型是一个交易者所能期待的最好模型之一。当它失败的时候往往意味着一个更大的趋势还没有结束。“222”模型的失败会从以下几方面表现出来：


    +   1. 靠近结束点 D 的位置出现一个大的缺口。

    2. D 点形成的时候价格的波动幅度非常大。

    3. D 点形成后，市场没有反转。这或许指明在继续趋势前，市场将在这一线筑底。'
