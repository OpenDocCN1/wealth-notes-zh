  md: '在世界范围内，占星术是一项大产业，许多人根据占星术规划自己的生活。在公元 552 年召开的君士坦丁堡大公会议上，很多宗教师把占星术视为一种科学禁止传播。这就是为什么梵蒂冈储藏着有史以来最杰出的占星术书籍，却不能被公众接触的原因。我对于占星术的兴趣纯出于实用目的。我在寻找交易中的“圣杯”。我真正获得的是一些能运用在交易中，并且远超平均水准的工具。但我的确认为市场的律动受行星的运动控制，这个结论是我基于唐纳德·布拉德利的研究做出的。1947
    年布拉德利写了《证券市场预测》一书，这本书是介绍如何利用测量各大行星（周期）来提前一年预测证券市场的。布拉德利的模型在整个年度预测证券市场趋势的成功率为 70%
    左右，这其中包括了一些令人称奇的成功预测，比如 1987 年 10 月 17 日的市场大跌，以及 1990 年伊拉克开战后的市场上涨，1994 年 1 月证券市场的飙升也很好地验证了布拉德利的模型。这个模型的出色之处在于它可以提前数年完成，同时它用行星的测量作为唯一的数据来源。据我所知，没有其他技术系统能够或者将做到这一点。


    我对于这些图形的比率和比例，以及它们在宇宙中的起源非常了解。这次我仅做了少量占星学的研究。这些图形能让你获得更多的胜算，同时能容易控制风险。这些是一个交易者十分需要的。'
