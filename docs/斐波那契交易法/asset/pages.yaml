- pgno: 138
  md: '保险的构想就是“夏皮罗反复”或者说“5分钟法则”。


    当在交易时间做出一个交易决定，这个决定通常仅仅在一个计算的基础上做出，而不是在很多同样或者类似的价格走势判定的基础上的更可靠确认。


    很多时候，当我们坐着观察屏幕时，会有交易冲动，因为市场开始朝我们希望的方向运动。在市场开始运动前，我们就预见到了，但是由于某些原因没有发出交易指令。


    当价格向我们希望的方向前进的时候，特别是当市场运动开始加速的时候，我们会经历情感的冲击。这情感里包括由于交易方向正确而产生“我是对的”的感觉，和因为没有下达交易指令所产生的觉得自己没有决断力的感觉，以及错失利润的懊悔和生气的感觉。准确地说，这种仍然想在火车从站台驶离之前跳上火车的想法经常给我们带来麻烦。除非价格运行骤然变慢，或者是一起转向，情感上的冲击将继续发作，很多时候我们下达了交易指令，尽管我们理智上知道这不是行动的最佳时机。


    这样做的结果看起来像是交易之神给我们的报复。我们都有这样的经历，当经过激烈的关于是否下单的思想斗争后，我们最终做出了决定，几乎在我们把电话放回支架的同时，价格趋势改变了。我们几乎相信了市场是活生生的，它在等我们发出交易一张或两张合约的指令的那一刻反转价格的运动趋势。


    当这种情况发生时，要明白市场并没有生命也没有对错，它也不会为我们的错误惩罚我们。记住这点非常重要。市场简单而且总是那样。是我们自身因为发怒、贪婪、犹豫或者没有做准备工作而惩罚自己。


    因为一时冲动而在错误的时间里下了正确的交易指令，这样的'
  merge: -1
  img_proc: true
- pgno: 139
  md: '事情发生过很多次（甚至比我愿意承认的次数还要多）之后，一个非常简单的结论出现了。因为实际下单的时间和市场看起来要反转趋势的时间非常短（它经常看起来像同时发生，不管我如何努力“智胜”或者“击败”市场），所以唯一合乎逻辑的对付这个看起来无法战胜的诱惑的方法是，在最终决定做交易的时候写下确切的时间和价格，并且迫使自己在开始交易前等待至少
    5 分钟、300 秒。


    这个逻辑简单。如果交易之神真的在等待伏击我因为一时冲动而在错误的时间点做出的交易，5 分钟内我可以观察到价格运动的显著变化，证明我之前不应该做交易。


    如果情况是这样的，免于损失的资金通常会很可观。这是真的。原因有如下两个：首先，当价格朝一个方向快速运动后反转，它的变动速率和幅度经常和上一次运动相同。如果我设置平仓止损点来限制损失，价格通常会很快触及它。如果没有设置止损点，它会变成一个破坏性的追赶游戏，或许会让一个起先不会发生的小损失发展成一个更大的亏损。这种情况发生后，你通常会专注于损失而不会寻找下一个盈利机会。


    如果情况是我观察了 5 分钟后内心告诉我一分钟也不能等了，那么我所失去的全部也不不过是一点还可以挣回的利润。无论在哪种情况下，净利润仍然是正的。'
