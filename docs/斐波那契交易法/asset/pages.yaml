- pgno: 120
  md: '心和对需要投入的工作无能为力。这个模型和任何形式的圣杯都相距甚远！你需要发现自己的圣杯并且做出你自己的判断。我相信你会发现花掉的时间是值得的。


    ![](img/421d880e6971922e2fddb42e9cb1b38b_120_0.png)


    “蝴蝶”模型的特点：


    +   1. 它由两个三角形相连构成。


    +   2. 一个 AB=CD 模型出现在市场的扩展运动中。


    +   3. 市场的扩展运动是 1.27 或者是 1.618。任何超过 1.618 的运动都否定了这个模型。如果发生了这种情况，说明市场在继续之前的运动。


    +   4. 此模型只出现在非常大的顶部和底部中。


    +   5. 时间段的关系通常和价格段的比例和比率一致。


    +   6. 在 80% 的情况下它是正确的。


    +   7. 蝴蝶模型内部的市场运动通常包括 0.618 和 0.786 的运动。'
