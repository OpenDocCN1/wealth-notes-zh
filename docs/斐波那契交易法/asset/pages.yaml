- pgno: 49
  md: '![](img/421d880e6971922e2fddb42e9cb1b38b_49_0.png)


    ![](img/421d880e6971922e2fddb42e9cb1b38b_49_1.png)


    用正方形框住圆形是大家都知道的几何练习。π是毕达哥拉斯用来测量圆或球形的。π的小数形式是无理数 3.14159。


    圆的半径 5040（1080+3960）与地球半径的比例，相当于 5040:3960或 1.2727:1。1.272 是数学上 1.618 的平方根。


    使用上图中圆形的半径 5040 和上图中正方形边长的一半，例如地球的半径 3960，来计算直角三角形斜边的长度，将得出如下结果。'
  merge: -1
