- pgno: 57
  md: '![](img/421d880e6971922e2fddb42e9cb1b38b_57_0.png)


    ![](img/421d880e6971922e2fddb42e9cb1b38b_57_1.png)


    7号模型和8号模型是扩展图形，这个图形改变了我的交易方式。我在瑞士做交易的时候，得和很多银行家打交道，过去几天，几乎我做的每场交易都在突破点X止损离场。在酒店房间里，我开始计算为什么我的止损点刚好在当天市场的高点或低点上。我的止损点刚好在从X到1的1.27的位置上。当我在计算器上按下根号键，我第一次意识到比例1.27的重要性，$\sqrt{1.618}$=1.27。


    一个有益的经验是，当价格触及点A时，等待一个蜡烛图形出现，例如一个十字星或者大锤。记住这个图形是一个扩展图形，我们不能保证价格不运动到更高的点位上去。'
  merge: -1
