- pgno: 23
  md: '# — 淅音数和震荡数字


    司离职进入我们公司，之前他是那里的一个非常成功的经纪人。现在他帮助我管理我的期货交易顾问公司，A. V. M 联合公司。1977 年吉姆买了台王安电脑做关于周期和数字的研究，他也曾经休过两年假来研究传奇交易者
    W. D. 江恩的著作。


    我有幸进入位于西洛杉矶投资中心书店的图书馆。这个图书馆储藏有我所见过的最精美的藏品。任何我曾经听过的书都可以在这里找到，包括一些 20 世纪 20 年代和
    20 世纪 30 年代关于占星学和古老技术分析的珍本书。一旦你读了这些年代久远的古籍，你将意识到技术分析仅仅更新了一小部分内容。更确切地说，现在有新概念和新思维，但是大多数当前的书中蕴涵的思想都可以追溯到早期的交易者。我认为你将赞同把淅音数和震荡数字放进“新概念”的范畴。


    类比法能通过最简单的方法解释淅音数字在交易中起作用的原因。假如你往水池里扔进了一块石头，当石头砸入水中的时候，水波将从撞击的中心位置向四周震荡，直到石头砸入水中的冲击消散。这里有三个因素决定水波的扩散性和持续时间：1.
    石头进入水中的高度；2. 石头的重量；3. 水的深度（请参见下面的插图）。


    市场对冲击的反应与此类似。通常，一个新的声明或者定期发布的经济报告将影响投机市场。目前，国民生产总值、就业数据、生产者物价指数和消费者物价指数，还有其他许多经济数据，都会影响金融市场。老练的交易者清晰地记得货币供应数据
    M1 和 M2 是如何每周冲击金融市场的。现在你必须搜索并找到这些经济数据。不久，一个经济基本面的新主导因素将会出现，而目前的主导因素将会成为历史。'
