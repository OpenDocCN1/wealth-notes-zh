  md: '# 一条来自宇宙的线索


    1986 年夏，我的好朋友和导师露丝·米勒博士寄给我一张便签。便签上写着 10 月豆油合约将涨到 14 美分/磅，然后开始一段大牛市。我把它贴到了我交易用的显示器上，直到
    10 月才想起来。在 10 月豆油飙涨到接近她的预测价位时，我给她打了电话。她仍然住在印第安那州经营她的大豆和玉米农场。在我还是德崇证券的一个经纪人的时候，她的丈夫是第一个在我那里开户做大豆对冲交易的客户。在电话里，露丝告诉我，她挖掘出（抱歉使用双关语）了一些难以置信的精确周期。她说这些周期建立在行星运动的基础上。她的兴奋劲儿促使我登上下一趟飞往印第安纳州的航班，然后在那儿接受了后来改变我的人生长达两周的私人辅导。和她在一起两周的意义，完全可以和一个教区的牧师和教皇在一起相相同时间的意义相比。下面仅仅是其中一些令人惊叹的成果。


    +   1. 建立“天文周期通讯”。在超过 22 个国家以及美国的每个州里都可以看见它。7 国集团里的 5 国都有人订阅了它。


    +   2. 在接下来的 6 年里撰写了三部关于金融占星术的书籍。


    a) 《天文周期：交易者的视角》'
