- pgno: 83
  md: '# 主图形


    十字星、锤线）。以标普 500 指数为例，如果 0.618 和 0.786 的价差大于 1.70 点，我将等待进一步确认后才进入市场。


    5. 时间段，下一个市场运动通常猛烈地向下进行。如果从点 1 到 A 的时间超过了 8 根 K 线，紧接着的回撤将很可能不那么强烈。


    6. 交易者永远不会知道市场将会到达哪一个回撤数字，交易者需要决定在交易中承担多大的风险。


    7. 这个模型迫使你利用短线趋势交易，你不需要努力抓住市场的顶部或底部。


    8. 在进入市场后，一旦价格跟随趋势到达了 61.8% 的位置，保护性止损点也应该移动到点 A。这样我们后面的交易就是风险较少的。


    9. 价格的最小目标应该与点 A 到 1 的距离相等。'
  merge: -1
