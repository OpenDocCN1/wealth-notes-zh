  md: '时候还继续坚持它，阻止了你去寻找和利用其他的盈利机会。一个交易，特别是一个坏交易，它结束的时候就是结束了。忘记它继续前进。


    这些观察看起来冷酷和审慎，并且很难实行。但这就是一个专业交易者如何做交易的方式。他们需要纪律、信心和自我的力量去承担行动的责任。无论何时，只要LP和我遵守我们的准则，我们总能赚钱。当我们认为我们比市场聪明或者“只是想再多要一点”，失败几乎是必然的。


    有一个关于这个概念的最佳例子，现在已经成了一个我们经常说的笑话。这个笑话是关于“十个一角硬币如何变成一美元”的故事。一天，当LP进入一轮利润丰厚的交易后，他看起来对于什么时候出场犹豫不决。他在这笔交易的很短时间内挣了一大笔钱，LP对于是否退出它犹豫不决。很快，市场到达了LP计划的盈利目标，并且继续前进，然后价格转变了方向，于是一大笔收益变成了损失。


    “LP，为什么你让这种情况发生？”我问。他有点怯懦地回答：“我刚在第一垒和第二垒中挣了钱，我想试试本垒打。”


    “哦，得了吧LP”，我笑着骂骂他：“你明知道不该干，每次不论我们俩中的任意一个这样做了，我们总是陷入麻烦。”我们俩都很清楚那样做不对，但偶尔我们还是会那样做。


    当他下决心去做的时候，拉瑞几乎是一个完美的交易者，把每件事都做得和他所教的完全一致。理解“不是每场交易都要盈利”是非常重要的。它表明的是，在正确的时候为正确的人做正确的事情，那么收益将会随着时间增长，收益可能很大。你要学会查看十场交易的净收入，或二十场的，而不是一场。


    “道克，别挑剔我了。我知道我做了什么。”他大笑。'
