  md: '飙涨或者抛售期间，这种来去匆匆的举动经常能看见。当市场变动不那么剧烈了，我就进入场内并选择相反的方向（在反弹高点卖出，在下跌底部买入）。我用的交易卡片上面写了所有的斐波那契数字和它们的0.618与1.618。如同本书开头所提到的，1989年以前我并不知道斐波那契数字的平方根的重要性。下面两页是我所用过的交易卡片的复制品。为了你的方便使用，我已经把0.786和1.27的价格关系放进去了。直到今天，我仍然使用这些卡片，但是现在它们被放大后装在一个木框里，栖息在我的桌面。


