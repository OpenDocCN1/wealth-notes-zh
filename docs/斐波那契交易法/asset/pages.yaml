  md: '+   1. 价格从A波动到B有60%的可能与CD的价差相同。剩下40%的可能是CD的价差是AB价差的1.618。


    +   2. BC的价格波动可以是AB价差的0.618或0.786倍。在趋势非常强的市场里，BC波动只会出现在0.382的回撤点位上。


    +   3. 如果AB的波动非常强烈，它对于BC将如何运动给出了很好的线索。


    +   4. 从点A到点B的时间段60%的情况下和CD的时间长度一致。另外40%的情况是这些时间长度可能是1.27或1.618倍的AB时间段。


    +   5. 如果CD的价格波动出现了跳空价差或者一根长线，交易者应该把这理解为市场动力强劲，并期待价格扩展到1.27或1.618倍。'
