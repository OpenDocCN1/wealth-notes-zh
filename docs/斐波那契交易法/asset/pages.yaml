- pgno: 50
  md: '# 框住圆


    ![](img/421d880e6971922e2fddb42e9cb1b38b_50_0.png)


    使用毕达哥拉斯定理，例如直角（90度角）三角形斜边的长度将等于剩下两边的平方之和的平方根。


    直角三角形的斜边 = $\sqrt{5040 \times 5040 + 3960 \times 3960} = 6409$ 英里。


    如果我们把三角形的底边当做地球的半径，例如3960，那么直角三角形的斜边6409.6与底边3960的比例是6409:3960或1.618:1.000。


    无理数1.272是1.618的平方根，即$1.272 = \sqrt{1.618}$。下面通过这个实验来演示吉萨金字塔的设计者是如何获得他们的测量值的。我们也可以注意到无理数$\varphi=1.618$和$\pi=3.14159$是相关联的。


    $1/4(3.14159)=0.786(1/\sqrt{1.618})$


    $1/4$是正方形的渨音比例，1.618是黄金分割率。'
  merge: -1
