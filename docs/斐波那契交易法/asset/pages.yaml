- pgno: 170
  md: '# 交易往事*


    我头一次听说拉瑞·佩萨温托的事，是关于他利用星相学来买卖股票。当时，我刚刚从东部迁到加利福尼亚中部海岸小城，也一直自命为伪博学的自由主义者。我的脑海里立刻勾勒出一个消瘦的老头，长长的胡须，戴着一顶很大的黑色尖顶帽，披着斗篷，帽子和斗篷上都装饰着白色闪亮的星星和半圆形。他甚至可能会蹒跚而行，随时带着一根大法杖，行走的时候就用法杖拄着地来支撑自己。


    那时候，我去西部接受一个在加利福尼亚州立理工大学（波利海峡）任教的职位，正在忙于结识新朋友。他们中的一个叫迈克·温特劳布的人，非常热情，是路易斯·欧比斯波的一家皮草店的店主。路易斯·欧比斯波在一个小城镇里，年平均温度在70.2华氏度（约21.2摄氏度），这其中的反常之处让我和迈克都非常惊讶。他喜欢吓唬人，当他问我闲暇时候喜欢做什么，我回答期货交易，他戏剧性地介绍了拉瑞。


    > * 本节由史蒂夫·夏皮罗写作，即文中的“道克”。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '此后的一天晚上，当我在迈克的店里遇见拉瑞的时候，我被他的外形震惊了。我失望地发现他没有戴尖帽和斗篷，也没有星星和半月形的点缀。第一眼看上去他和别人没什么两样，直到你注意到他的一直在闪烁的眼睛，向你叙述对生活的热爱，邀请你一起度过人生。没有魔法，也没有神秘。只是一个喜欢与人交往的帅小伙。他看起来慷慨而且乐于助人。事实也的确如此。


    别被外表所欺骗，是我从拉瑞身上学的第一课。（我们的友谊不断加深，他开始喊我“道克”，我喊他 LP）这里面蕴涵的寓意是：注意你的期望值。更进一步说，不要抱期望值，这样他们就不会被滥用。要敬畏市场，不要在这儿寻找你想要的东西。学会看到市场提供的东西并且尊重它。简单来说，不要在交易中寻找你期望的结果，学会观察交易中包含的信息。这是让我俩难忘的一堂课。


    当麦克介绍我们的时候，他对我说：“去啊，问他任何你想知道的事情。”好像在暗示拉瑞是掌握了部分市场智慧的神秘大亨。


    LP 看了看麦克，知道他喜欢“搅局”。为了减轻由于麦克故意的耍宝引发的难堪，拉瑞微笑着说道：“来吧，我不介意。我喜欢我的职业，也喜欢和别人一起聊聊市场。”


    就这样我开始了和 LP（拉瑞·佩萨温托）的友谊，同时我们也展开了一系列讨论。不但覆盖了交易技术，而且几乎包含了生活中的每个方面，以及如何把它和交易心理联系起来，并把交易作为人生的隐喻。


    我们相遇以后不久，LP 邀请我去他的交易工作室继续我们的讨论并观看他交易。那时候我还是一个夜猫子，只有很少一些东西能让我在早晨 5：20 起床。债券和货币在西海岸的那个时间交易（纽约时间早上
    8：20）。LP 看起来如此有趣和幽默，以至于我决定去瞧'
  merge: -1
  img_proc: true
- pgno: 172
  md: '瞧。这是我所做过的英明决定之一。我们会坐在一起观看市场，LP 会诉说过去担任股票经纪人和场内交易人的时候遇到的市场的“战争故事”，以及他认为那一天将要发生什么。我对他知识的广博、言谈的风趣和对市场判断的准确度感到高兴。


    拉瑞是我见过或者读过的最棒的纯粹做交易的人。一天早晨，在一个市场走势特别缓慢的交易日，他转过头对我说：“我厌倦了，来做些生猪的模拟交易吧。”拉瑞喜欢交易生猪而且对此相当精通。短时间内，他在生猪交易中成功获利
    15 次。不夸张地说，如果是一张合约的话，他可以通过这张合约挣得 1000% 的收益。


    当他说：“让我们现在入场”，或者“让我们现在出场”，我总是问他：“为什么你要这么做？”他总是会回答：“因为这样做是正确的。”“来吧 LP，你能详细点解释么?”
    我回答，假装对他漫不经心的态度不满。他会看着我，带着夸张的愤怒和戏谑：“快点道克，你在和我开玩笑么？这很容易啊。现在的你不但应该知道它而且应该能教会别人。”然后，他当然会教给我，缓慢而细心，总是强调不要在
    没有止损的情况下入场的重要性，以及同样重要的，知道在何时出场的价值。


    不需要多久就能看出他是对的。一旦我开始关注模型，我发现它比我原先想象的要容易。没过多久，我就可以通过观察把它们从任何图表中挑选出来。本书中讲述的技巧是有效的，这包括正确运用它的智慧。


    当我第一次开始观察 LP 做交易的时候，我问出了一个我认为是关于逻辑的问题，一个我从那以后多次听到的问题。“这个对所有交易都起作用么，你怎么知道呢？”当我第一次问的时候，LP
    只是笑了笑，抓起一张图表。他把图表的名字和刻度切掉了，所以我不知'
  merge: -1
  img_proc: true
- pgno: 173
  md: '道这是什么，不知道它是一只股票还是一个商品，也不知道它的时间刻度是什么。他给我这个图表，告诉我去找寻模型。“但是这上面没有时间刻度啊，我怎么知道我在找什么呢？”我抗议了，并没有仔细思考我的论点。


    他突然罕见地严肃起来。“注意，停止寻找你期待的东西。只是寻找市场蕴涵的信息和你看到的东西。”


    他当然是正确的。一旦我停止寻找我所期望的东西，开始查看市场表现的东西，模型们就纷纷跳到我的面前。他看到我的表情变了，又回到了那个随和的 LP。


    举个恰当的例子。一天早晨我们在观察市场的时候，LP 接了个电话，电话中的交流并不顺利，当 LP 把听筒放回底座时他立刻又把它拿了起来，拨通了他的经纪人的电话，在一个非常差的点位下单而且没有设置止损，等他下单后市场立刻开始向相反方向运动。他看着价格继续向相反的方向运动，忽略了我们考虑过的大量其他可能，他的沮丧和恼怒越来越严重。


    看到他烦闷了一阵子以后，我转向他，轻轻地说：“LP 你知道你刚才干了什么吗?”


    他看着我，好像刚刚回过神来。他很清楚我指的是什么，作为一个真正的行家，他说：“道克，你是对的，那样做真是太蠢了，我情绪化了。”他立刻拨通了经纪人的电话关闭了交易，只受了很小的损失。作为我永远的朋友和老师，他毫无难堪之感地说道：“让我们谈谈刚才发生了什么。”


    从这短短几分钟时间的行动里，我们甄别出大量需要学习的教训。首先，当你交易的时候，别在这个时间里想其他事情。集中注意力到你正在处理的事情上，你如何干的，最重要的是，为什么你'
