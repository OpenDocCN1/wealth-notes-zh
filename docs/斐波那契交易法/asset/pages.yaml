  md: '# # 前言


    过去 20 年里，对斐波那契数列应用泛滥，以至于电视商业频道的评论员都自称为专家。我还没有资格自称专家。然而，我的研究一直包括了对斐波那契数列的广泛探索。我对于任何学习都保持务实的态度，如果我所研究的课题对交易没有帮助，那我就没有兴趣继续研究它。如果这本书激发了你对应用斐波那契数列的兴趣，那么把它介绍给你就是值得的。我要提醒大家，这本书是基于交易胜算基础上的。交易艺术是一种风险管理。阿莫斯·贺斯泰德是商品期货公司的创立者之一，他曾经说过：“控制好你的亏损，收益就会自动增长。”我经常引用这句话，因为它非常重要。


    本书介绍的图形识别法，将会吸引每一个曾经使用过技术分析方法的交易者。我可以自信地说，很少有人研究图形像我一样透彻。一些参考图形甚至可以追溯到 1900 年。每一个图表都是基于斐波那契比率和比例的。一个技术分析图表不外乎是一个以价格和时间为轴的路线图。


    这些图形的重复带有非常大的规律性。我最好的几个学生同时也是航空公司的飞行员，他们学习交易的方法和按飞行计划学习飞'
