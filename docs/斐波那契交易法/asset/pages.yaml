  md: '我的，市场真的是很多其他东西的隐喻。


    或许这个过程的最佳例子，在那些刚刚学习交易的初学者中大量发生。


    拉瑞指导他们选择三个或四个不同的市场，同时从每个市场中选出一个来交易。如果有人问的话，我们通常推荐债券、一种金属和一种谷物。


    三个月后，学生们将会给我们打电话，告诉我们交易进行的情况。当学生打电话的时候，他们经常会报告 30% 或者 40% 的当期收益。然后他们会询问现在是不是可以开始交易三个或者四个更多品种的期货。这个问题总是惹得我们发笑，因为我们知道接下去会发生什么。我们会用我们独有的问题回答：“如果你把你交易的合约数量翻倍，而不是把你交易的期货品种翻倍，会发生什么？如果每件事都像以前一样进行，你将如何改变你的盈利率？”


    大多数时候，学生会花些时间做一些计算，然后通常会回答：“我不确信。”这让我们再次大笑而去故意惹怒学生。“你们为什么发笑？”将会是下一个问题。


    “你没有听。”我们中的一个会回答。“收益的百分比将会保持一致。收益的数额将会改变。为什么要通过增加你的工作负担（你交易的商品都必须要做分析），而当你需要做的只是提高你交易的合约数量来挣更多的钱呢？引用一句老话：‘如果它还没破，不要去修补它。’不要给你自己增加更多的工作负担，而要增加更多的钱。”


    还有其他的例子。当一个学生打电话过来，说：“我刚在大豆上赢得了 5 美分的差价。现在我该怎么办？我应该平仓还是等待获取更多利润呢？”


    我们再一次大笑，然后再一次，这个学生首先会被我们的大笑'
