- pgno: 191
  md: '# 更多的实践技巧


    > “抛弃你的观点，而不是你的钱”

    ——保罗·都铎·琼斯


    I 风险投机的资金管理应当保持简单。这里是一些“牢不可破的规则”和“准则”。


    +   A. 牢不可破的规则

    1. 如果头寸亏损，不要增仓。

    2. 在任何交易中所冒风险不要超过你交易资金额的10%。

    3. 在每一次交易中设立保护性止损位。

    4. 如果你在3天内都无法获利，平仓出场。


    +   B. 准则

    1. 如果没有原因就不要关闭交易。

    2. 对你的交易负责。

    3. 低点越来越高说明市场在上升趋势中。高点越来越低说明市场处于下降趋势中。

    4. 总是在开盘前做好分析。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# II 平仓前问自己如下问题


    +   1. 这个头寸亏损了么？


    +   2. 它达到价格目标了么？


    +   3. 你被你的观点说服了么，它很具说服力量么？


    如果以上三个问题的答案都是不，那么你必须保持你的头寸。如果以上三个问题的答案都是肯定，那么如果你希望的话你应该关闭交易。


    # III 观察


    +   A. 计算你的交易资金然后乘以 3%，这是你在任何交易中承受的损失上限。例如：$ 1000×3% = $ 300。你在交易中所冒的风险不应超过 $
    300。


    +   B. 当你的账户内的金额增长了，你还是必须贯彻 3% 的准则，但你可以交易更多的合约。


    +   C. 如果你可以交易很多合约，你应该考虑在某一头寸上运用移动止损策略。这个策略取自系统在市场转折点时入场的能力。


    +   D. 交易者必须始终保护自己免受性格弱点的影响。止损点的设立是为了免受交易者自身的影响。


    > “市场很少犯错；而人类经常犯错！”


    ——罗伊·隆斯特


    # IV 推荐阅读


    +   A. 《股票大作手回忆录》


    +   B. 《纪律交易者》


    +   C. 《孙子兵法》


    +   D. 《赢家心理》'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 波动率止损入场技巧


    波动率止损通过运用K线（或棒线）的平均幅度来计算波动率。用平均幅度乘以一个乘数得到波动率。卖空的时候把波动率加到最低的收盘价上，买多的时候用最高的收盘价减去波动率。


    平均幅度=平均幅度×（N-1）+（高点-低点）/N


    +   · 卖空=最低的收盘价+平均幅度×C


    买多=最高的收盘价-平均幅度×C


    ![](img/421d880e6971922e2fddb42e9cb1b38b_193_0.png)'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 危险信号


    市场很少出错！市场中一直存在的一个事实是：如果价格走高，说明市场中出现了更多买家；如果价格下跌说明出现了更多卖家。这里有一些技术指标暗示市场或许在转换性格。


    A. 缺口


    图表上的一个大价格缺口指明市场情绪发生改变，应该引起重视。行动前应用夏皮罗反复（等待一根完整 K 线*）。


    B. 宽幅


    当价格变化幅度反常变大，那么市场可能会越过价格目标（1.618）。你应该了解你所交易商品的每日平均价格波幅。


    C. 收盘价


    市场在极高点或极低点收盘说明市场的动力强劲或不足。观察在同一方向的几天的收盘价。


    > “控制好你的亏损，收益就会自动增长。”


    ——阿莫斯·贺斯泰德


    * 比如，以 5 分钟 K 线图观察交易，则等待当前的 5 分钟 K 线完成。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 杰西·利弗莫尔法则


    以下节选自《股票大作手回忆录》一书。


    +   1. 在所有的重大投资失误中，没有几个比在亏损时加仓更愚蠢的了。


    +   2. 总是卖出亏损的头寸，保留获利的头寸。


    +   3. 你不能强迫市场给你它不想给的东西。


    +   4. 投机者的勇气就是按自己的想法行动。


    +   5. 亏损在我接受它之后并不能让我烦恼。我在一夜之间就忘记了它。但是这么错下去——而不是接受损失——这是在和你的钱包过不去，同时也在伤害你自己的灵魂。


    +   6. 一贯正确的人总是受到两种力量的支持——基本面和那些总是错误的人。


    +   7. 市场趋势对于那些具有开放的头脑和理智清晰视野的人来说非常明显。对于一名投机者来说，把事实硬套到理论中去是愚蠢的。


    +   8. 在一个狭窄市场里，当价格窄幅运动时，交易员要做的就是关注市场，观察报价判断价格上下限，然后下定决心在价格没有向某一方向突破前不做交易。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '+   9. 你观察市场的目的是：判定市场的方向或价格趋势。价格，像其他东西一样，沿着阻力最小的方向运动。


    +   10. 长期来看，商品价格只受一个法则控制——供需法则。


    +   11. 我花了几百万美元领悟到，一名交易员的最大敌人就是他怀疑富有魅力的个性和优秀的头脑结合起来的激情。


    +   12. 赢得利润——忘记它！遭受损失，忘得更快些！


    +   13. 我从没想过挣大钱。我想的总是我的处境，我的耐心等待。


    +   14. 股票市场中只有一个方向，它既不是向上也不是向下，而是正确的方向。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# 不知道自己风险的人在冒所有的风险！


    为了交易成功你需要建立三条规则：


    +   1. 建立一个对你信任的基金，这样你可以为了你自己的最大利益而行动——毫不犹豫。


    +   2. 通过一系列步骤来建立信心和对自已的一致性信任。这其中包括学习，不要把你的钱送人了。


    +   3. 当信号出现的时候，完美地执行交易。问自已以下三个问题：


    A) 这是一个可识别的模型么？


    B) 这里存在神圣比率么？


    C) 我能负担得起这个风险么？


    如果对以上三个问题的答案皆为：“是的！”那么你应该入场交易。


    记住以下这些重要的因素：


    +   - 资金管理的地位永远在任何交易方法论之前。你永远不能把自己暴露在无限的风险中。止损位的设置是为了防止你自身的干扰。


    +   - 永远不要进入风险未知的交易。


    +   - 犯错本身并不是错误；知道错还要坚持才是！'
  merge: -1
  img_proc: true
- pgno: 198
  md: '+   - 恐惧收窄了我们注意力的焦点，同时扭曲了我们对环境的知觉。


    +   - 自律就是当环境中的事物都在冲突中时仍然能集中注意力的能力。


    +   - 永远别让市场拯救你——你必须自救。利用止损！


    +   - 我们交易的是概率！市场比我们想象的任何东西都要强大。没有任何交易法则能告诉你下一刻将要发生什么。收益来自一系列交易而不是某一次交易。


    +   - 控制好你的亏损，收益就会自动增长！把你从害怕做错和害怕亏损的恐惧中释放出来。交易不是关于正确或错误的游戏，它是获得收益的过程。


    +   - 严守你的规则，灵活处理观察结果。'
  merge: -1
  img_proc: true
