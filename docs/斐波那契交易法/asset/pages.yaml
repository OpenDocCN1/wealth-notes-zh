- pgno: 27
  md: '当你用第七个渀音震荡数字除第八个渀音震荡数字，你将得到这个数等于 0. 618


    \frac{21835}{35346}=0. 618


    一旦达到第八个数字，后面数字间的比例将几乎保持不变一直到无限。这是一个关于两个不相干的数字如何在未来互相联系的极好范例。价格和时间图形在重复的时候同样显示出这一特质。S&P
    标普 500 共有 5 个渀音数——3 个首要的和 2 个次要的。次要渀音数在强势市场中十分重要。首要渀音数是：270 点、350 点和 540 点。次要渀音数是
    170 点和 110 点。


    美国长期国债 长期国债的渀音数是 20 点。如果长期国债波动超过 20 点那么它就很可能波动到 40 点。在强势市场中，我们将会看到渀音数的倍数出现。（例如
    2 × 20，3 × 20，4 × 20）。


    白银 白银的首要渀音数是 18 美分和 36 美分，次要渀音数是 12 美分。


    小麦 小麦的渀音数是 17 美分和 11 美分。在强势市场中我们将会看到 17 美分和 11 美分的倍数出现。


    大豆 大豆的渀音数是 18 美分和 36 美分。


    黄金 黄金的渀音数是 17 美元和 11 美元。


    瑞士法郎和德国马克 瑞士法郎和德国马克的渀音数是 27 点和 54 点。瑞士法郎有一个次要的渀音数 81 点（27 + 54）。


    原油 原油的渀音数是 44 点和 88 点。


    道·琼斯工业指数 道指总共有 3 个渀音数：2 个主要的（35 和 105）以及一个次要的（70）。'
