    这个故事还说明了另一点：只有在发现的初期，我们才意识到自己是多么的无知。为了这个目的，拉瑞喜欢引用一句孔子的名言：“弟子若准备好时，老师自会出现。”


    我们的一个志同道合的朋友曾经告诉我：“要越过自己的局限去探究……”这本书中教授的技巧能让那些认真的学生做到这一点。


