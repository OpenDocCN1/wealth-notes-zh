- pgno: 51
  md: '# 正方形的调和比


    # 正方形的对角线


    ( $ \sqrt{2} = 1.4142 $ )


    正方形由四条互成直角的等长线段组成。


    利用毕达哥拉斯定理我们可以计算出对角线的长度。这个斜边的长度始终保持着对任一正方形边长的比例（1.4142 : 1）。


    边长为 1 的正方形的斜边是：$\sqrt{1^2+1^2}$ 或者 $\sqrt{2}$，即 1.414。


    斜边和正方形任意一边的关系都是 1.4142 : 1。


    ![](img/421d880e6971922e2fddb42e9cb1b38b_51_0.png)


    按斜边的比例放大正方形产生了混音比例数列。


    1.000 &nbsp;&nbsp;&nbsp; 1.4142 &nbsp;&nbsp;&nbsp; 2.000 &nbsp;&nbsp;&nbsp; 2.828


    它们的反比关系是：


    0.354 &nbsp;&nbsp;&nbsp; 0.500 &nbsp;&nbsp;&nbsp; 0.707 &nbsp;&nbsp;&nbsp; 1.000'
