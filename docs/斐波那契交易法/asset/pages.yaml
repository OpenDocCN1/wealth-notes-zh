- pgno: 135
  md: '# 进场技巧


    这些是我最喜欢的进场技巧，需要与几何图形配合运用。他们按照重要性排列（对我来说的重要性）。


    +   1. 夏普罗反复（Shapiro Iteration）——将在后面的章节叙述。


    +   2. 限价指令——把止损/止盈点位放在精确的几何价格测量值上面或下方几个点位。一个事先设想好的止损（大约 600 美元）也同时设置好。


    +   3. 蜡烛图模型——这些模型描述了交易区间的重要性，同时也强调了开盘价。


    # 4 个可用的模型


    A. 镊子——这个图形也就是双底或双顶。当两条线接连出现相同的高点或低点，镊子模型就形成了。它们在几何图形完成的时候帮助交易员量化风险。


    B. 十字星——价格在创出高点或低点后收盘价与开盘价重合。它们发生于市场模式从牛市转为熊市的时候，或者相反。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '十字星在几何图形的底部甚至更加重要。当它们出现在极度动荡不安的市场中，它表达的意义也是正确的。它的出现标志着所有的市场参与者——多头和空头——都很紧张。


    C. 锤线——锤线代表当市场经过急剧卖空后，市场获得强劲支撑。它的名字来自“锤出底部”。一个锤线应该是蜡烛长度的两倍。锤线应该视觉上容易辨认。如果你对它存疑，那么它很可能就不是一个锤线图形。


    D. 流星——它的出现常常伴随一个在开盘时出现的向上跳空缺口，而收盘价靠近当天的交易低点。在几何形态的末期这些都是很有用的入场技巧。它们作为上吊线的对立图形存在。


    很多蜡烛图的模型或许也一样有用。但我只用这四个图形，因为它们看起来似乎与几何模型同时出现。


    4. 波动止损（Volatility Stop）入场技巧——波动止损通过运用价格的平均波动幅度来计算波动率。通过乘以一个平均波幅的常数计算出来。当做空的时候，这个值被加到最低的收盘价，当做多的时候，要从最高的收盘价中减去这个值：


    ```

    波幅=波幅×（N-1）+（最高价-最低价）/N

    ```


    ```

    做空=最低收盘价+波幅×常数

    ```


    ```

    做多=最高收盘价-波幅×常数

    ```


    根据我的经验，波动止损适合用在具有较强趋势性的市场里。这是一个优秀的入场技巧，而且在大多数情况下都比有效趋势线突破和通道突破等技术工具表现得更好。当和波动率联系起来的时候，反转止损（Reverse
    Stop）同样可以用来量化风险。所用的常数应该限制在2.5到4之间。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# ## 夏皮罗反复


    当我进行日内交易，并且仅仅运用一种工具计算入场和出场点的时候，在进行交易前我会选用我称作“夏皮罗反复”的工具。当我确定在交易中采用的时间周期图表后，夏皮罗反复工具需要等待在那个时间周期区间内的K线走完。(如果我用5分钟线来做交易决策的话那我就等待5分钟，如果我用30分钟线图表的话我将等待30分钟，等等）某一天当史蒂夫·夏皮罗刚下达完交易指令还没把电话放回到支架上，他几乎立刻发现了市场在朝他的交易方向反向运动，于是他提出了夏皮罗反复。像我们其余的人一样，多数情况下做决定受情感的影响多于受理智的影响。当我们开始运用它的时候，这个技术已经给我们俩节省了一大笔钱。被他称作“5分钟法则”，而我喜欢称为“夏皮罗反复”的解释，我们有很多经验教训。


    对于所有交易者来说，最困难的一件事就是把他思考中的情感因素与交易隔离起来，防止它影响交易。完成这个任务的方式之一就是在交易前就计划和设置好入场点和目标位。


    当你发出原始交易指令的时候，要包括上文说的两个价格点还要加上止损点，这样可以减少交易中的情感因素。这个构想的问题在于，不论出于什么原因，大部分交易者就是不能机械地去操作交易。


    因此，如果我们不能理智地进行交易，那么保持务实并且努力建立一个安全阀，来保护我们免于受情感影响的策略是十分必要的。在交易最激烈的时候，我所能发现的可以使用的最接近故障'
