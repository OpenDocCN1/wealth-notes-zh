- pgno: 125
  md: '# 开 盘 价


    1974 年底或 1975 年初，在北卡罗来纳州的亨德森维尔，我首次遇见了期货研究院的约翰·希尔。那个时候，我正逐步从投资活牛期货、豆油期货和豆粕期货的巨大损失中恢复过来。在
    1974 年 10 月的假期中我做多了很多期货合约。我开始做的时候一无所有，然后通过投资挣了一大笔钱。此后我知道我有在交易中获利的能力。然后，我没有意识到我的成功是恰好遇上了牛市，所以当熊市来临的时候我一败涂地。


    在此后的 14 年里，约翰和我一直是好朋友，并且分享了大量的交易思想。1982 年，我去约翰在亨德森维尔的牧场拜访，并在那儿待了两个星期，一起探索种种交易方式。我们做出的最棒发现，是一个通过计算机所作的研究，该研究揭示了顺应开盘价的方向做交易的法则。我们在几个市场里做了整整两周的研究，把开盘价和当天的市场反应联系起来。在交易商品中，我把它作为一个技术指标使用，认为这是我所用过的最令人称奇的发现之一。


    几年后，哈达迪-西贝特公司的俄尔·哈达迪在一本名为开盘价的重要性的书中出版了同样的数据。对期货交易感兴趣的人，'
  merge: -1
  img_proc: true
- pgno: 126
  md: '特别是那些做日内交易的人，我们诚意推荐这本书。当你顺着开盘价交易时，它能给予你巨大优势。


    开盘价的重要性理论或许来自于市场一天只有六小时交易时间的事实。它留下了18小时的决策时间。当你意识到外围市场将在香港、东京、新加坡、悉尼、伦敦和阿姆斯特丹开盘的事实，你将对这18小时内发生的事情如何影响市场的开盘价有更深了解。我知道大多数交易量没有在刚开盘的时间内发生——它发生在一整天。然而，要解释开盘价是如此重要，人们必须记住这些人在过去的18小时内已经经过深思熟虑，以便为将来的发展提出新策略。


    开盘价法则如下：85%~90%的情况下，开盘价将是或者接近当天的高点和低点。也就是说，开盘价要么与当天交易高点相差不到10%，要么与当天交易低点相差不到10%。你可以使用这两种方法来证明这个法则。首先，取一张期货日线图，拿红色铅笔在每个开盘价的地方画一个圈，你会发现十有八九你都圈到了当天的最高价或最低价。第二种试验开盘价重要性的方法是运用每日交易图表——也就是日内图表——如果你能获得它的话。运用这张图表，标记开盘价然后画一条线穿过当天的剩余交易时间——一张指示开盘价的水平线。你将非常惊奇地发现价格非常频繁地围绕开盘价上下波动，不论开盘价是高点还是低点。开盘价似乎是某种混音数或者平衡价，以至于市场当天要针对这个价格波动好几次。


    了解到这个信息，日内交易者和长线交易者可以凭此进入市场并拥有胜算的优势。随后几页上的图表将举例解释在一个长线交易或者日内交易的基础上，如何运用开盘价优势作为你的一个工具来为进场制定策略。记住这个技术并不是百分之百灵验，但它'
  merge: -1
  img_proc: true
- pgno: 127
  md: '确实在很多时候给你提高了胜算。


    这里有一个重要概念需要牢记：忘记昨天的收盘价。它对你运用开盘价的概念毫无用处。当你运用开盘价进入市场时，无论价格是走高还是走低都对你没有影响。你必须忘记前一天的收盘价；你的焦点是开盘价，特别是日内交易的时候。无论我在何时教授这个法则，学生们似乎总是想抓住昨天的收盘价不放。当你运用开盘价法则的时候必须记住不要使用昨天的收盘价。


    当你变得越来越习惯于运用开盘价时，你将发现这个技术越运用越简单。下面几页的图表将会举例介绍如何把开盘价和模型结合起来提升日内交易胜算。你也许想同时使用“日内之匙”（开盘价+高点+低点的和除以3）技术和开盘价技术。如果价格在“日内之匙”上方，买多。如果在“日内之匙”之下，卖空。


    记住在日内交易——同时也长线交易中——你必须关心价格和时间轴。一些日内交易者会在没有意识到的情况下亏损，因为他们忘记了时间轴。他们认为仅仅交易几天，事实上，他们做了日内交易然后因为没有平仓转变为长线交易，结果趋势与他们持有的头寸相反，造成损失。当你做日内交易时，你应该在收盘前平仓出场。如果你做的是长线，你应该想得长远些，比如从3天到3个月，这取决于你的交易风格。


    关于如何运用开盘价的第一个例子会在119页进行图解，这个图显示了市场在点A开局然后开始下跌并持续下跌。那些买在日内高点附近交易者现在担心市场是否会上涨并穿过高点或者在下降过程中出现反转。你可以看见，一段时间过后，市场到达了支撑位。这个支撑位是一个主要的斐波那契数字，距离开盘价0.618位置的回撤。市场在这儿停顿然后开始继续爬升。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '我们最喜欢的一个日内交易技巧是在距离开盘价0.618的回撤位买入并在0.85的位置设置止损。也就是说，如果市场在0.618之下下跌了25%，你可以说你看错了市场；你的止损非常小，当市场再次上涨时你还可以获利。正如这个例子给出的证明，市场真的涨得更高，你在当日收盘时获得收益。


    日内交易的时候，手续费的费率也非常重要。对于谷物、债券、标普指数期货以及其他一切品种来说，25美元~30美元的手续费价格区间完全可以接受。好的波动率对于日内交易也非常重要。要选择高波动率、高活跃度以及高成交量的市场交易。这些将在另一部分里详解。


    本书第120页图解了第二个如何运用开盘价的例子。注意开盘价。价格迅速做出突破然后开始回归开盘价，反弹回斐波那契数字0.618，然后继续向下运动。这两个例子揭示了如果一个交易者有足够耐心等到这个模型出现，将有双倍的胜算。首先，他在开盘价的方向交易。它在趋势进行的方向上下波动，十次有七次或八次市场站在他这一边。其次，他顺应趋势的方向交易并且卖在反弹点*，同时它也是一个非常有利的数学点位，在这个点位风险被锁定了。因为如果市场继续上涨，交易者能用很小的代价止损。这些特殊模型起作用的胜算要高于十分之七的概率。


    > * 指反弹到0.618位置放空。'
