  md: '# 在斐波那契数列求和的混沌中发现的秩序


    过去很多年，我发现把任何市场都视作一个从某些能量点震荡的方法十分有帮助。过去发生的事情对预测未来价格运动十分有帮助。斐波那契数列求和与混沌理论是相关的。在市场运动的混沌中，有一些可以辨认的模式经常出现。可以用下列的例子来描述斐波那契数列的一个不同寻常的特性：取任意两个从
    1 到无限的数字，任何两个都可以，但我以 124 和 963 开始。注意当你做以下事情时发生了什么。对它们求和：


    +   124

    +963

    1. 1087

    +963

    2. 2050

    +1087

    3. 3137

    +2050

    4. 5187

    +3137

    5. 8324

    +5187

    6. 13511

    + 8324

    7. 21835

    +13511

    8. 35346'
