- pgno: 5
  md: '# 译者序


    如果你想像众多讲解趋势跟踪和均值回归的交易书籍中解脱出来，看一看别处的风景，那么本书就是为你准备的。斐波那契数列已经被广泛应用于国内外金融市场。在《华尔街日报》、消费者新闻与商业频道（CNBC）等著名金融媒体中，投资者经常可以看到分析师运用黄金分割或者
    50% 回撤等技术分析工具来分析市场，而这只是斐波那契数列在金融市场上的“牛刀小试”。


    对于投资者来说，投资方法、心态和资金管理是在残酷的金融市场中取得胜利的基石。心态可以在交易中磨炼，资金管理可以在实践和学习中不断完善，交易方法和技巧却是不传之秘，很少有人倾囊相授——而本书恰恰就是让交易者得悟真谛的一部关于交易方法和技巧的秘笈。


    作者是一位具有 30 年交易经验的交易界斗士，曾出版过 9 本交易书籍，本书是他的代表作之一，并获得 1997 年《超级交易员》杂志的年度大奖。


    书中主要介绍了一些作者经常使用的具备高胜率和高风险收益比的交易定式，而这几个定式的数学基础，就是斐波那契数列——'
  merge: -1
  img_proc: true
- pgno: 6
  md: '该数列不但是波浪理论的数学基础，也是很多交易老兵偏好使用的交易参数。


    本书开头以风趣幽默的叨吻介绍了斐波那契数列的起源和一些涉及到的几何知识，然后对斐波那契数对在金融市场中的一些运用做了介绍和拓展，把作者自己在数十年交易生涯中总结的几个交易模型，以实例的方式详细讲解。读者可以发现，书中介绍的定式在很多情况下风险暴露非常小，但是获得的收益却经常在10倍以上。本书图文并茂，简单易懂，即使是初级交易者，经过短时间的训练也可以迅速把从本书学到的知识运用到交易实践中。书中介绍的知识，不但可以运用于中长线交易，在日内交易中也经常可以遇到书中描述的交易模型。作者还把蜡烛图、趋势线等交易工具和斐波那契数列结合起来，增加了本书的实用性。最后，作者把自己几十年积累的交易感悟也奉献给读者，这也是全书最重要的一部分瑰宝——读者早日领悟到这些道理，就可以在交易的世界中渡过难关，更快地实现财务自由。


    读完本书，读者可以在趋势跟踪和均值回归的交易方法外再多了解一条交易途径，在交易员的工具箱中再添加工一个实用工具。


    让我们记住作者拉瑞·佩萨温托常说的一句话，“交易你所看见的，而不是你所想象的”，进入作者所营造的利用斐波那契数列进行交易的世界，一起享受交易的乐趣吧！


    刘轶卿


    2016 年 6 月 14 日'
