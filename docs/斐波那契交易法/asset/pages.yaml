    最后，我写这本书的目的之一是向读者展示古代几何学。有兴趣的读者将会兴味盎然地发现这些神圣的比例来源于宇宙。我不会花太多时间进行占星术的研究，这个主题对我来说太宽泛了，更主要的是，它对于在交易中获得收益并不是必需的。'
