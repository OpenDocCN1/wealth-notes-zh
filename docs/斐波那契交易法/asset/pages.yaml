    0.382、0.500 或 0.707 的位置。


    +   2. 市场从 A 到 D 的运动过程中一定会有 AB=CD 的图形出现。


    +   3. BC 应该运动到 AB 的 0.618 或 0.786 的位置。在趋势较强的市场 BC 将会运动到 AB 的 0.382 或 0.500 的回撤位。


    +   4. 分析从点 X 到 A 和从 A 到 D 的时间段。我们发现这些时间段也有比例和比率关系。例如，从点 X 到 A 的 K 线数目为 17 个。从
    A 点到 D 点的 K 线数目为 11 个。17 基本上是 11 的 1.618 倍。


    +   5. 在一些情况下，AB=CD 的图表形态会把 X 作为目标价位。这是一个真正的双底形态。


    +   6. 如果市场走势超过了 X 点，那么市场将继续下行的幅度至少为从 X 点到 A 点距离的 1.27 倍或 1.618 倍。'
