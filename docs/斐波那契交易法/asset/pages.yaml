- pgno: 89
  md: '例来说，如果 0.618 和 0.786 之间的差额大于 170 点，我将等待市场的进一步确认信号才入场交易。


    +   5. 点 X 和点 A 之间的 K 线数目给出市场下一个波段的强烈提示。当从 1 到 A 的距离非常短，3~5 根 K 线，下一个波段将会强力上涨。如果从下方的点
    1 到点 A 的 K 线长于 8 根 K 线，那么随后的反弹将很可能不强劲。


    +   6. 投资者永远不会知道市场将会达到哪一个回撤数字，这得由投资者来决定在交易中承受多大的风险。


    +   7. 这个图形迫使你做短线交易，你不要去努力追寻顶部或底部。


    +   8. 入场后，一旦价格顺着趋势的方向移动到 0.618 的位置，止损点应该移动到点 A。这样将给投资者一个风险较小的交易。


    +   9. 最小价格目标应该和点 X 到点 1 的距离相等。'
  merge: -1
