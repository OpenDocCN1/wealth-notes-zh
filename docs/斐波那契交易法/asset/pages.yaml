- pgno: 16
  md: '结果不一致。他们谦虚地承认对方都是正确的。他们是我见过的最棒的技术分析师。布莱斯通过他的软件和他写的《波浪交易者》向技术分析师们介绍了真正的市场几何学。他是我非常好的朋友，我永远欠着他的人情。你不需要过于担心数浪，尽管这样或许会使艾略特波浪理论的信徒们对我的说法不满，但是斐波那契数字的平方根和倒数对于分析地道的艾略特理论用处很大。


    通常，当我就一个题目著书时我会把其他作者的成果包含进去。长久以来我一直想做这件事，但我决定放弃。全世界有非常多的技术分析专家们符合并且应该提及，甚至有更多的个人交易者具有相同的技术水平或更高，而我们从未听说过他们。对于那些不能在此提及的不知名艺术家们，这是对他们的不敬。你知道那种感觉——当我遗忘了某人而那人恰好是我的朋友！


    本书不能被看作一个交易系统，它不能独立存在。它是一种市场中的交易方法，需要判断力和纪律。如果交易者掌握了它们，就有可能实现财务自由。真正的自由必须与纪律相随。'
