  md: '所激怒。我们中的一个将问他这个交易持续多久了。回答通常是：“半小时”或者“一小时”。我们又笑了，然后我们中的一个再问：“这是你想从交易中获得的结果么？”回答是：“是的。”我们继续问：“你喜欢持续四个小时才能获得收益的交易么？如果你能获得你所分析的预期收益，拿上它然后寻找下一个交易。你愿意在半小时后获得你的10个点的收益还是想在半天后获得？”通常解决问题的是当我们问道：“如果我们在开盘前告诉你怎么能一天挣10个点，你会做而且心里满足么？”


    如果答案是“是”，通常都会得到这个回答，我们会告诉学生去回答自己提出的问题，怎么在交易中抉择。这是关于教学流程的非常重要的一部分，它让学生决定对自己的决策满意与否，而不是我们的。这有助于帮助学生建立信心。


    经常有学生为开始的决定和结果辩护，说：“但我想……”我们中的一个会在这时候打断他，礼貌地说：“不，你没有思考，而这将花费你的钱。现在告诉我你今天学了什么？”这个学生会回答他开始被我们的大笑惹怒了，没有仔细想形势。这恰恰是我们想要的效果。就算在极端的情况下，这个学生再犯这个错误也不可能。我们所有人都想自己保持正确，如同我们想获得利润，有时候更多。这是麻烦的根源。一次精准的分析正确的人场可以被一个改变规则的冲动回答给毁了。好的技术，加上坏的心理等于一个坏的结果。学生们总是看见了教训，和我们一起嘲笑自己的反应，对我们致谢然后离去。他们给我们打电话要求一次明确的交易，但我们把这变成一堂课让他们回答自己的问题。这一般都奏效。它和古老的寓言讲述的是一个道理，当你给一个饥饿的人一条鱼，他一天就吃光了。如果你给他一张渔网并且教他钓鱼，他每天都有吃的。'
