  md: '# 伽特利“222”模型


    ![](img/421d880e6971922e2fddb42e9cb1b38b_55_0.png)


    这是我所能找到的最优秀的图形。我把它命名为伽特利“222”模型，因为它在伽特利书中的222页。他在讲述这个模型所花的时间要超过其他任何模型。这个模型显示了为什么没有必要抓住顶部或者底部——只需要等待跟着顶部和底部出现的第一个“222”模型。这个模型的最美之处在于它包含了一个AB=CD图形。这让交易者通过计算不同价格波浪的比例和比率，以便决定交易中的风险大小的做法成为可能。如果日内交易者只学会了这个图形，他也能做得更好。值得注意的是，当“222”模型失败了（市场超越了X'
