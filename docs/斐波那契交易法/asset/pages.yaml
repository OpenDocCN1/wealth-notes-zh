  md: '![](img/421d880e6971922e2fddb42e9cb1b38b_58_0.png)


    ![](img/421d880e6971922e2fddb42e9cb1b38b_58_1.png)


    9 号模型和 10 号模型在日线图中很难发现，它们在日内交易图中经常出现（例如 5 分钟图、30 分钟图）。威廉·邓尼肯在邓尼肯单向法和邓尼肯穿刺法中介绍了这两个图形。在交易者眼里三段式冲刺模型充满了美感。它应该跃入你的眼帘。如果你发现你硬把三段式冲刺模型套入市场，它或许就不是适用的模型。


    对这个模型来说，最重要的应该被牢记的事是对称。在价格和时间上这些波浪应该是对称的。


    注意：琳达·布拉德福德·拉舍克在她的《街头智慧》中提到了这个图形，并把它叫做三个小印第安人。'
