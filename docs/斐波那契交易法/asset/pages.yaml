- pgno: 24
  md: '![](img/421d880e6971922e2fddb42e9cb1b38b_24_0.png)


    吉姆·特温迪曼痴迷于研究当前数据，他拥有我所见过的最好的数据，完美无缺！吉姆和我曾经把所有的主要商品按 5 分钟价格波动图分类。我们在 1985 年完成了对标普的数据分析。我们把主要商品的每一条
    5 分钟线数据输入王安电脑里，然后电脑开始检索这个价格波动的价值并报告每一次价格波动的频率分布。当偏态分布的时候你将会得到一个泊松分布以及你的第一个涟漪数或震荡数字的暗示。很明显，你唯一能证明这个理论的方法就是观察几千个图表来确定假设是否成立。我们测试了这个方法，发现它的精确度令人满意，并且在技术分析中十分有用。'
