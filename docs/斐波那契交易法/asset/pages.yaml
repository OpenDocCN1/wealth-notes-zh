- pgno: 15
  md: '# 介 绍


    让你知道下一刻会发生什么。没有人知道这个！（好吧，是有人知道，但他不会做交易）没必要知道 5 天内会发生什么。需要知道的是判断 5 天内的潜在风险和收益是多少。胜算是问题的实质，风险管理也同等重要。赢家思考他们会失去多少，失败者只关心他们能获得多少，“控制好你的亏损，收益就会随之增长。”
    ——A. B. H.


    在本书结尾，希望你能看到几何图形和斐波那契比例间的相关性。这些我将尽量简单地为你讲解。如果你想阅读更加详细的资料，可以在参考书目中找到它们。


    本书令我和那些赞同本书介绍的市场分析方法的交易员同事们十分兴奋。我认为，它回答了如下问题：“在混乱的市场中是否存在秩序？”我多么希望 20 年前我能像现在这样了解市场！


    再介绍一种关于黄金分割的平方根数字的观点。这些数字第一次出现在威廉·盖瑞特的杰作《证券市场周期的力矩分析》中。毫无疑问，这本书是我读过的关于周期的最好书籍。1972
    年这本书仅仅售出了 200 本。因为乏人问津，剩余的书都被普伦蒂斯·霍尔图书公司销毁。对每个图书馆来说，此书都是优秀藏品。


    本书包括了许多图表。我不知道如何用其他的方法来解释这些概念。图表来自各个领域，从商品到道·琼斯股票，我选择了几个不同的时段，因为这些模式在所有的时段都能找得到。


    如果你没看到传统的艾略特波浪图形的标记，请不要失望。如果你使用短期的模式识别方法，艾略特波浪图形是不必要的。重要的是每一浪的比例和比率。坦白说，精确地数出每一浪从来没有让我觉得心安。对此，我感受最深的就是几年前在位于加利福尼亚底斯摩海滩边上的交易公司里发生的事情。当时布莱斯·吉尔莫和罗伯特·麦纳都在我的公司里讨论美国国债。他们同时数艾略特波浪，'
