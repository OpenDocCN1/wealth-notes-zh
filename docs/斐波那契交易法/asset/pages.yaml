  md: '我接下来要说的脱口而出。直到说出来以后我才意识到，我们俩一起大笑。“LP，十个一角硬币就是一美元。你想要一美元，别懒惰了。挣十个一角钱，因为一美元或许一次挣不到。”


    拉瑞停止了说话，表情一本正经，看起来在深思，他伸手取了一支铅笔，一边说话一边好好表现了他的书法。“等等，道克，我反应有点慢，让我把它写下来，‘十个一角硬币组成了一美元’”。


    我们两个人都大笑，开始讨论它。很多道德规范都清楚明了，我们两个破坏了我们的准则太多太多次。不要贪婪，不要寻找市场没有的东西，只取市场提供我们的东西，在市场做交易获得收益以后就别再想了。一旦你获得了收益，那就是你的。别愚蠢地又把钱还回去。仔细计划你做的每笔交易，把它当作你做过的最重要的交易——直到下一次交易。


    拉瑞是对的，他让识别和辨认模型变得容易，最后我真的开始帮助他教授他的技术。像在大学里教学一样，帮助LP训练期货交易员经常让我觉得从他们那儿学会的东西和我教给他们的东西一样多，如果不是更多的话。前一秒钟某人的脸上还是一片茫然，下一秒就看到恍然大悟的表情，这不但让教师在心理上获得满足，同时得以分析灵感什么时候出现和为什么出现。这同时启发了学生和老师的头脑。LP和我都从我们的学生那里学了很多东西。对于市场来说，秘密是观察和查看那里有什么，而不是我们要从那儿得到什么。


    当我观察到教授学员如何在市场中交易，和我在大学教授传播学有很多相同之处时，LP只是笑得像个孩子，然后用夸张的惊奇语气问我：“你很吃惊!?”事实上，了解市场教会我最多的是关于我的行为以及其他人的行为，而不是别的什么。再一次，LP和我讨论了很多次。它教会了我们如何更明晰地“看”很多事情。正如LP教'
