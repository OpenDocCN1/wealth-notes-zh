- pgno: 14
  md: '斐波那契对我的影响就是开阔了我的视野。这些斐波那契比例关系一直在市场中存在着。在亨德森维尔商品研究所的约翰·希尔先生催促下，我从 1974 年起开始运用斐波那契数字。我阅读了艾略特的所有论文以及他与查尔斯·柯林斯的所有通信。几年后，弗罗斯特和普莱切特写了《艾略特波浪理论》，这本书解释了波浪结构和斐波那契数字的用法。我注意到不是所有的波浪都在
    0.382、0.5、0.618、1.618 的位置。直到 1988 年，我才开始运用斐波那契数列的平方根 $\sqrt{0.618} = 0.786$ 和
    $\sqrt{1.618} = 1.27$。通过这两个平方根比例关系的帮助，波浪结构解释起来更加容易。布莱斯·吉尔莫的第一本书《市场几何》，把这个比例关系介绍给了大众。《艾略特波浪理论通讯》从没使用过这些比例。我曾经给他们传真过斐波那契数列平方根数字的信息，但是从来没有得到过他们的回应。亚利桑那州图森市“动态交易者集团”的罗伯特·麦纳使用所有的谐波比例。我认为他寄发的通讯和技术分析是行业里最出色的。如果你没有时间去做分析，地球上最棒的技术分析专家罗伯特·麦纳可以帮你的忙，不过你需要按月支付一小笔费用。这让我想起一条来自我的朋友、交易员吉姆·特温迪曼的引言：挑战人性——独立完成工作。


    本书的主要目的，就是诠释如何运用斐波那契比例、斐波那契比例的平方根和倒数来判断波动的结构。在我的图书馆里的所有藏书 中，没有一本关于波浪理论的书涉及这个重要概念。我将尽力简单地解释它。如果你能记住一两个概念或者图形，那么这本书就算没有白写。我向你做这个保证，当你研究了本书的比例和图形后，你将意识到市场在它们的乱象后面总隐藏着一个确定的模式。整理这些乱象，你能从中得到启发。本书的目标不是努力预测未来或者'
