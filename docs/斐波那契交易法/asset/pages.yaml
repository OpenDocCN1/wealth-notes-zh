- pgno: 100
  md: '# 9 号模型


    ![](img/421d880e6971922e2fddb42e9cb1b38b_100_0.png)


    +   1. 这个模型应该很容易辨认。如果你得凑出这些数字，那它或许就不是这个模型。


    +   2. 对称是这个模型的关键。点 2 和 3 一定是 A 波段和 C 波段的 1.27 或者 1.618 倍。


    +   3. 从点 A 到点 2 和从点 C 到点 3 的时间段应该是相等的。


    +   4. 任何时候如果在这个模型中有一个巨大的价格跳空缺□，这表明 3 段上冲模型是错的，交易者应该等待顶部正在形成的更多信号。


    +   5. 点 A 和 C 的波段通常将在前一个波段的 0.618 或 0.786 的位置。当市场主势是陡峭上升时，这些回撤位仅仅能到达 0.382 的位置。


    +   6. 三段上冲到顶模型是一个罕见的模型。当你开始注意到这个图形后，它很容易被解释。不要浪费精力寻找这个图形，它应该在你研究图形的时候跳到你的面前。'
