- pgno: 52
  md: '# 主图形


    这一节讨论我在交易中使用的一些最重要的图形。我的很多学生问我为什么要分享这些信息，很简单，有两个原因：首先，这些图形是在过去70年间被别人发现的；其次，每一名交易者都有他自己喜欢的时间周期。所以，碰见一个能让人感觉到自我实现的交易，是非常遥远的。


    本节介绍的图形识别中有一个非常重要的不同，这个不同就是所有讨论的图形，使用的都是古代几何学中的数学比例，斐波那契数列只是其中的一部分。在这里，我努力要让你明白的是，如何使用仅仅四个斐波那契数列中的数字就能在数学上确认这些图形。我一直认为，这些价格波动的数学关系就是这些图形未能表示出的动因。这对于艾略特波浪理论家们特别适用。1974—1978年间，我深入学习了艾略特波浪理论。我发现艾略特的那些原则与其说是无懈可击的定律，不如说是一些守则。直到今天，如果你把12个艾略特波浪理论家们集中在一个房子里，你可以得到24个或者更多的对于价格运动的解释。这没有什么错。这从另一个方面反映了没有人知道市场下一步将如何运动。更重要的是，'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 主图形


    它重申了知道市场的下一步运动是不必要的，必要的是知道交易中的风险。既然我们针对的是数学关系，那么对风险控制的量化就很容易。


    我花了30年中的大半时间观察这些图形。我的信息来源于加利福尼亚州圣塔莫尼卡市投资中心的唐·马克和北加利福尼亚州亨德森维尔市期货研究院的琼·希尔。我认为我并没有忽视任何曾经描述过一个价格模型的人。这里我强烈推荐两本书：


    +   1. 《股市利润》，作者 H. M. 伽特利（1935）。这实际上是伽特利在20世纪初开办的股票市场课的内容。它在当时价值1500美元，相当于那个年代的三辆福特轿车的价格。在它的200~250页我们可以找到大部分被人们讨论过的图形。书中的交易系统被引用和售卖的数量超过其他任何书。包括：《塔布斯证券市场教程》、《三叉戟策略》、《反转点波浪》和一些其他书。这本书厚逾700页，书中附有大量20世纪20年代和20世纪30年代证券市场变化图表。


    +   2. 《证券市场周期的力矩分析》，作者威廉·盖瑞特（1971）。这本书是真正的珍宝。这是第一本揭示价格图形中的数学关系和几何关系的书。与盖瑞特的书几乎同时期出版的还有一本论述周期的书，詹姆斯·赫斯特的《证券交易测时的价格魔术》。赫斯特的书比较便宜并且更易懂。但是盖瑞特的书回答了很多关于周期和斐波那契的关键问题。


    如果你花些时间浏览我的参考书目，你将会看到其中覆盖了相当多的作者。我一直认为他们中的每一个人都为技术分析的科学做出了贡献。'
  merge: -1
  img_proc: true
