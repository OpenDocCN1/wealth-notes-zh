  md: '娱乐圈之所以会发展到现在的局面，与zi本入驻有着很大的关系。尤其是以华姨、钢炮等京圈人物为核心的团体的崛起，更是标志着一个新时代。之所以扌爷会把王朔比喻成“业务部经理”，相信很多对于这部分八卦有所了解的童鞋，应该都能心领神会。没错，钢炮甚至是华姨能够发展成一方势力，与京圈的“精神领袖”——王朔的才华密不可分。


    97年，《甲方乙方》创造了国内的票房神话，也开创了一个“贺岁电影”的新时代。小钢炮为华姨带来了巨大的收益，也让他成了国内一线大导。而这一切成就，即使不说是全靠王朔的好剧本也是差不多的。


    在那个还没有3D、电脑特效的时代，一个好的剧本对于影视剧来说简直就是重中之重。所以，当年的编剧可不像现在，随便就能被投资方手撕（对，比如说“香蜜”的闹剧）。比如曾经享誉国际、如今跌落神坛的陈kai歌，当年让他获奖无数的电影《霸王别姬》的剧本虽说是著名作家李碧华的同名小说，本身就算hammer高起点；


    > 李碧华是香港文坛大名鼎鼎的才女。她才格高绝，行踪神秘，从不在大庭广众前抛头露面，坚持不公开照片、身世、年龄，容貌不详。李碧华道：“别人好的书的面貌，我是那种躲到人群里，不容易特别被认出来的样子，没什么好描述的。和外界的人和事保持适当的距离，对我来说是好的，不老注视着自己的影响力，不去想有多少人正在看你写文字，不至于动不动就把自己当成苦海明灯，才方真可以潇潇洒洒地写。她还说，写的时候真的进入那个一个世界，讲得玄一点的话，似乎是有一个人借着我的手来写。”她自称一份“档案”，展示了她的萧洒、幽默和神秘。
    [2]


    # 小说


    | 《霸王别姬》 | 《鸳鸯蝴蝶》 | 《胭脂扣》 | 《黄金建筑之前世今生》 |

    | 《生死桥》 | 《香蜜》 | 《请悲》 | 《亲子》 |

    | 《离洲国状桥-川岛男子》 | 《烟花三月》 | 《紫荆城的女鬼》 | 《天安门旧貌新规》 |

    | 《楼梯青衣》 | 《流星雨断片》 | 《倾次》 | 《梦迟》 |

    | 《羊眼包子》 | 《吃眠耽的女人》 | 《吃猫的男人》 | 《如墙》 |

    | 《喜材》 | 《冰壶》 | 《未经过约》 | 《马窝》 |

    | 《爱情-绕钱选集》 | 餐最后一块菊花糕 | 《慕秋痕》 | 《追迹桃花》 |


    但就像现在那些IP再创作一样，并不是说一部小说拿过来就能拍成电影，而是需要编剧根据实际情况，结合导演的创作思想重新创作的。遇到好的编剧，那就是相得益彰；遇到不好的编剧，再牛的原著也照样被改成烂片。《霸王别姬》的编剧芦苇，按照帮派划分的话，他是跟老谋子一样同属于“西北帮”的。


    出道开始，芦苇就一直跟着王朔等京圈大腕身边进行剧本创作。之后更是跟老谋子等西北帮班底合作、京圈演员（葛大爷），制作出了获得“戛纳电影节”国际奖项的经典电影——《活着》。有这样牛的履历，芦苇的创作功底即使是放眼现在，也是圈子里数一数二的。所以，这才诞生了那部他跟陈导合作的影坛经典——《霸王别姬》。可惜，陈导却太过自大，在成功名就后总想着去炫耀自己的才华（然鹅他在编剧这方面的才华，是远远比不上导演天赋的）。


    陈导自己担当编剧的那些电影，比如史诗级大烂片《无极》，时隔多年都是网友的槽点。这类情况在其他导演身上也是能看到的，比如老谋子早年的那些经典电影，要么就是名家小说改编的，要么就是有著名编剧亲自操刀改编的，所以才让老谋子有了那么多的优秀作品。比如，《红高粱》的原作者是莫言，就是那位国内首位获得了诺贝尔文学奖的莫言；比如，《大红灯笼高高挂》的原作者是苏童（国内著名作家），而编剧可是大名鼎鼎的倪匡的儿子、周慧敏的老公倪震。一旦老谋子离开了这些大咖编剧，像陈大导演一样选择自己亲自上阵的时候，出来的效果就再也不复当年的光辉荣耀了。


    所以，以前人们常说京圈有多厉害，并不是指京圈有什么神秘力量，而是指京圈的“剧本”即编剧牛掰！这也是为什么“首富”马爸爸当初拆了命地想要拉拢京圈的原因。'
