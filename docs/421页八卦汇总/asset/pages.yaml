  md: '也正是因为白龙王晚年不愿看到“曾让自己做错事”的刘嘉玲，拒绝接见了她；以至于坊间才因此传出了“白龙王不喜刘嘉玲，从不见刘嘉玲”这样的传闻。殊不知，其实梁朝伟跟白龙王的缘分，就是刘嘉玲牵引介绍的。要怪也只能怪她自己，为了己私欲把白龙王的信任给作没了。


