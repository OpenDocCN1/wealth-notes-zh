  md: '炒，拍个电影能从头炒到尾。所以大家的感觉就是阿Sa比阿娇更火。那时候阿Sa是公司第二受捧的女星，第一个就是那个命里会旺公司的女歌手容祖儿（感兴趣的话可以去搜搜她的“春卷小故事”）。


