    有了帽子叔撑腰英子可就不一样了，因为在此之前，她在歌坛根本就算不上什么，为了出圈更是没少给那时候的“歌后”毛姐毛阿敏当小。在有了靠山、加上毛姐后来远走国外，这才让英子在歌坛占据一席之地。而英子也确实是成大事的，以前有多能忍，上位后就有多嚣张。当所有好运都降临在她头上红了之后，英子也终于果断地撕下了面具，开始杀伐果决地为自己的地位稳固而战（撕）！


    如今一说英子，都知道她“敢说”，甚至连同行都敢怒！哪怕是“湾湾第一美女”林志玲，到了她的地盘上，即使“喝酒过敏”也要“先干为敬”。而让圈子里的人都惧怕她这位大姐大、让她“一战成名”的，如今很多人都以为是跟另外那位“田震”歌后田震的争执；


    其实啊，早在那次之前，就发生过一件事情，让英子成功奠定了自己“东北圈一姐”的地位。想当初，随着帽子叔等东北圈中人霸占了C晚舞台，连带着让很多东北的明星都成了演艺圈和歌唱圈的当红。


    当时除了英子，本来还有一个东北出身的小歌后“孙悦”很红。只是，说也奇怪，孙悦跟英子、田震一样，都是“沙哑派”唱法的歌手。这，就导致了争执了：大家都是一个类型的歌手，那些作词作曲的大咖写的歌一共就那么几首，分给谁啊？你们自己抢去吧！原本孙悦也打算加入到帽子叔的东北帮，可既生瑜何生亮，已经有了英子了，聊能容得她来放肆？


    不过，孙悦也是个厉害角色（毕竟都是东北银，谁又比谁虎呢？）。原来，孙悦早年还是酒吧驻唱的小歌手时，就是东北地区一位“黑色”大佬——四爷的小三。四爷对她不仅宠爱有加，为了让她出道还专门送她去学习歌唱技巧，并为她砸钱铺了很多关系，这才有了之后的出道经历。


