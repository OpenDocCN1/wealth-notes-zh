- pgno: 9
  md: '![](img/055f3fb69bcde98e1e3f873187ca8154_9_0.png)


    先说“财务部”的叶。年纪小的宝贝对于这位的名字，应该是不太了解的。不过，如果有看过《甲方乙方》的童鞋，要是扒爷起说“尤老板”，或许就会想起电影中那个“吃贿了龙虾鲍鱼，被扔到农村体验生活”的土豪老板形象了。叶虽是四大元老中最低调的那位，却是“实力”最牛的一位。不仅出身最高贵，身家也是最富有的那个（初期）。


    叶跟王朔是一起长大的发小，两人还一起开过菜馆。叶虽然自己在影视圈发展得不算好，导演的几部作品均没能引起什么大水花，但要说到他的“财务部”的“下属”，大家应该都知道。没错，就是“一指禅”夫妇陈羽凡白百何。


    涛哥（陈羽凡原名陈涛）虽然也是大院子弟，但由于年比四大元老小得多，所以早期并不是圈子里的人。直到叶要筹拍《与青春有关的日子》，以此来纪念自己身边这群大院子弟的青春时，才找到了涛哥来出演。也是这部剧，让涛哥认识了老婆白小姐。所以说，叶还算是两人的媒人呢。


    当时的一众京圈人，都迷徐静蕾迷得不得了，觉得这个“大妞蜜”太漂亮了。叶就是因为看过老徐后，决定要找一个跟老徐一样漂亮的女孩来演。刚好当时的白小姐是关锦鹏旗下的艺人，关锦鹏跟叶又是多年交情，知道叶导在找女主角，就把白小姐推荐过去了。结果叶一看到白小姐，立刻就觉得她长得太像年轻时候的老徐了，二话不说拍板就是她了。


    可白小姐自己清楚，戏结束后，自己照样不属于这个圈子，照样红不了。于是在了解到涛哥的背景后，白小姐便不顾当时的涛哥有女朋友的事实，奋力倒贴，哦不，奋起直追涛哥。又是关心涛哥吃不惯制组盒饭每天买午餐，又是大胆告白一副颇爽英姿的劲儿。当她终于拿下涛哥后，涛哥身边的朋友其实都不看好。尤其是涛哥的母亲，直接“警告”涛哥今后少带女孩子回家。


    当然，之后白小姐成功怀了孕，一切就也水到渠成了。而且，就算Split是两人的婚姻破灭了，可“京圈人抱团”的属性，照样还是能够让白小姐资源不断。比如很欣赏白小姐的老徐，就在白小姐丑闻爆出后选择力挺她。虽然扒爷认为，这份“力挺”的背后，更多地应该是老徐故意想要“恶心”范冰冰的。谁让当时胖冰正好是截胡了白小姐的“潘金莲”呢，向来看胖冰不爽的老徐，别说白小姐有“京圈人”的身份了，估计就算她是个圈外人，也难保不会被老徐“捧”。


    说完了“财务部”，接下来我们来看看同样不太高调的“管理部”。


    叶大鹰，同样是一位名字不算耳熟的人物。可扒爷要是给大家举出几个新闻，相信宝贝们就能恍然大悟了。对，就是那个之前曾经炮轰过《建军大业》，还被部分粉'
