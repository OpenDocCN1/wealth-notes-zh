  md: '两人还经常出双入对，关系一度扑朔迷离。之后，贾静雯和孔孔还在生日会上热吻，让人以为她们要对外公开恋情。然而，贾静雯随落后发文回应称，自己只是人缘好而已，身边有很多疼爱自己的人，大家走进一点，就会被揣测关系不简单。


