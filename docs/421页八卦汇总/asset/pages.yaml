    等到一年多以后，姜文又和一个法国女学者桑德琳认识了，谈了差不多2年，两人就结婚了。之后还生了个很可爱的女儿。但这位法国高知也没能看住姜文。她在巴黎大学教书，所以很长时间两人是两地分居。有时桑德琳也会带着孩子来中国，还去探过姜文的班。


    然而那又有什么用？在拍摄《天地英雄》时，正牌老婆来过，却也挡不过姜文和周韵看对眼。用周韵的话来说，他俩就是一见钟情。这部电影是周韵第一部影视作品，也让她和姜文走在了一起。可说的再怎么好听，也是明晃晃的小三插足啊！


