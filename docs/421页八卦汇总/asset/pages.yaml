  md: '恋的。如果写清楚时间，难免会有“婚外恋”、“劈腿”的嫌疑。虽说这样的行为确实不道德，可钟丽缇却对这些毫不不在意，直接在百科里就写明相识的经过，这种直率的态度反而让她的真性情圈了不少好感。


    要说钟丽缇也是够任性，已经经历过一次失败的婚姻了还不懂得吃一堑长一智。明明身边所有人都不看好，却偏要一意孤行选择跟严先生结婚。虽说这个严先生也算是半个圈内人，可跟钟丽缇的知名度比起来，简直就是天壤之别。多少过来人都劝她，这样的差距迟早会让婚姻破裂。可真真的钟丽缇就像美人鱼一样，坚持“真爱能够克服一切”。


    但她是不在乎财富不在乎背景，却没想到男方是在乎的。每次钟丽缇跟老公出席场合，媒体报道的称谓都是“钟丽缇老公”。这种长此以往的压力，再加上音乐行业不景气，严先生接不到工作只能在家带孩子，终AM于缓慢彻底沦为了男人的尊严跟钟丽缇的积怨加深。果然，在第七个年头的时候，钟丽缇终究没能逃过“这一痒”，再一次宣布了离婚。


    如果换做别人，在经历过这些之后肯定会大受挫折。可钟丽缇却偏偏不一样，即使遇到再大的困难，她每次出现在公共场合被问到对婚姻、对爱情的看法时，都表示自己仍然相信爱情。而且她虽然自己带着三个女儿生活，却从来不会“卖惨”，而是通过自己的努力工作和敬业态度赢得身边人的尊重。比如同样是在《天龙八部》里出演角色的钟丽缇和刘涛，敬业程度就可以通过细节看出来：钟丽缇扮演的马夫人在临死前的戏，按照书中的设定是要爬满蚂蚁的。当时导演都提出可以用替身或是特效来完成了，但钟丽缇却坚持表示自己亲自拍摄。


    想象一下满脸的蚂蚁，而且钟丽缇还要张口说台词！这种事光是想，就足够让人敬佩了。再看看其他版本的这个场景，没有一个女演员能做到钟丽缇这个程度。这倒也不是说别的演员就一定没有钟丽缇敬业，但正所谓“没有无缘无故的爱，也没有无缘无故的恨”，钟丽缇到现在48岁了仍然能没黑料地受到一众影迷的推崇，正是因为她这一
    点一滴地积累。


    这样一个微笑面对坎坷、积极乐观的女人，也注定不会受到亏待。就象现在，上天让她遇到了张伦硕，一个长相帅气性格又体贴的男人来把她捧在手心里。同样是带着孩子再嫁的洪欣，同样是开始就不被看好的“姐弟恋”，洪欣早已“查无此人”退出娱乐圈了，而钟丽缇到现在仍然努力拼搏在前线（虽然影视资源少了，但钟丽缇却一直坚持在走穴接商演）。可见，女人想成为女神，永远都不能放弃事业，放弃做自己。


    而且通过钟丽缇的日常状态也能看得出，她现在是真的很幸福、快乐。不然她也不会不顾高龄产妇的危险，也要为老公生下两人爱情的结晶。钟丽缇身上最让人欣赏的地方，就是她即使面对失败的爱情也从没有任何消极的态度。


    这个消极的态度是指包括在婚姻里和离婚后的所有态度的。张雨绮虽然也独立、坚强，在前夫哥爆出“瓢c”丑闻后也没说过王全安什么不好；包括对现在的袁巴元，也只是发声明表示离婚而已。可当她在婚姻中的时候又怎么样呢？张雨绮多次被拍到的“家暴”照片：当街踹王全安的车门，在家里跟袁巴元互砍（主要是她拽袁巴元），这背后是否有隐情，或许我们不能随便下结论，但一个女人若是只有“强悍”的一面，而失去了“温柔、体贴，甚至在公共场合下不给自己老公留一点脸面、不把对方当个人来看待”，那么，即使最后得到的结果是“婚姻失败”，恐怕也不见得都是男方一个人的过错吧。


    反观钟丽缇，在婚姻失败后不仅懂得自我反省，从自身找缺点，为了之后的幸福改变；再受伤也不会真的动摇自己追求真爱的心，也从不会去立人设或是发表“大女人”宣言。因为真正的坚强，并不是通过武力或是外在行为来表现，而是拥有一颗强大的内心却依然温柔、善良、乐观地面对世界。这，也许就是钟丽缇永远是大家心中，唯一的“性感女神”的原因。'
