  md: '![](img/055f3fb69bcde98e1e3f873187ca8154_268_0.png)


    还有《城市猎人》里的美艳警察！甜笑、红唇、潇洒、帅气完全直击人心~

    在这里，抓爷要感谢下王晶那时慧眼独具，看中了邱淑贞。抓爷把动图发上来给小婕贝们看看，港真邱淑贞在那个没有PS的年代是不是美的让人无话可说！


    ![](img/055f3fb69bcde98e1e3f873187ca8154_268_1.png)


