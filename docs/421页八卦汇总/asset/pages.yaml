  md: '不过大院是要更新换代的，最初的一批被带着玩的大院子弟，其实比第一批年纪要小个十几岁，第一批京圈算是看着第二批长大的，所以带弟弟妹妹们玩，自然是要抱团的。陈羽凡就是其中一位被带进去的。陈羽凡这个人有了资源以后也没忘本，把自己认识的一个东北大院长大的小东西带上了，这个哥们就叫胡海泉吧。虽然陈羽凡当年够义气，但胡海泉后来可是不太地道的，这个事我们等下会讲到。


    当年哥哥们让他给一个歌手写歌，他就带上了胡海泉；当年哥哥们给他介绍了演电视剧，他虽然没带胡海泉演，那也只是因为他看不上胡海泉的演技，但是主题曲什么的可都是胡海泉帮了忙的。后来陈羽凡觉得胡海泉这人挺有心的，还带着胡海泉一起继续搞创作，顺便一起飞飞飞，光看胡海泉后来的反应，是不是突然觉得陈羽凡低谷了他的演技？


    这个圈子就是这样，大难临头各自飞，胡海泉学到了精髓哦。


    继续说陈羽凡的事哈，相信大家对他的成名史是没什么兴趣的，所以我们直接步入正题，他当年可是混得风生水起，于是就在剧组认识了他老婆白百何。单看白百何的长相，那叫一个清纯，那一年的白百何还只是学生呢，但她的心机可是足以混迹娱乐圈了。


    其实她当年盯上的第一人不是陈羽凡，因为陈羽凡长得不咋地，当时剧组里有个特别好看的胖哥（只是脸胖而已），她当时就蛮力想勾搭胖哥。胖哥和她暧昧了一段时间，被女友发现了，当时女友处理得特低调，白百何这边有点吊着胖哥，也没给到什么甜头，于是胖哥就索性回归了正途。


    后来白百何看揪着戏要拍差不多了，还没捞到一个能靠得住的大树，索性就转移了视线找到了陈羽凡。陈羽凡这个人大刚刚的，也没留意到白百何居然是这么绿茶的一个人，就跟她关系走得近。后来白百何反思了一下，没搭上胖哥主要是因为自己没舍得付出，这次痛改前非，一付到底，两眼一闭，成其好事...


    果然，陈羽凡就认真了～


    其实陈羽凡当年也不只有她的，但是白百何付出以后，就认死了对方要对自己负责，当时陈羽凡的女朋友也有点二心，最后结果当然是白百何成功挖墙角，正式上位。


    白百何当年想跟陈羽凡，主要也是看中了他背后的圈子。当年陈羽凡的老妈就跟他说不行，但是陈羽凡这人好面子，白百何很会伏低做小（没错，她对外傲气，对内很会哄人的）随后肚子又争气，就这样登堂入室了。说到这里，陈羽凡给白百何资源成其人之美，白百何抱子在腹一路乘风起.按理来说应该是闺家欢乐了吧，然而根本不是那样的～


    陈羽凡这个人，虽然长得不咋地，但是人有点花花，特别爱玩，尤其喜欢玩大的...一开始白百何还能靠清纯吸引他，后来可就不行了...登堂入室后开始变得端庄，少了当年那些又纯又媚的娇羞感，陈羽凡就渐渐少了很多兴趣。再者，白百何可是一直嚎着想红，陈羽凡其实挺烦她这一套的。


    所以有很多一段时间，陈羽凡和白百何都是在各玩各的，当时陈羽凡的主要心思放在玩上，白百何则是放在红上。不过长期不受到关注，缺少爱的滋养，白百何也烦啊，甚至还怀疑过自己是不是缺少女人味了。


    好在后来遇到了邋哥，邋哥长好看还会撩，一来二去就看对了眼。结果世上没有不透风的墙，这事被陈羽凡知道了。陈羽凡特别气，就给棒打鸳鸯，还让白百何受到了重挫。但是呢，扒爷也说了他这个人是真的好面子，自己的老婆被人给狗了，虽然棒打狗男女，但还是不解气，总觉得这个白百何不像当年那么纯洁了。


    于是，陈羽凡越来越冷淡白百何了，甚至连家都不爱回了，在外面也有了同居多年的好“毒”友。开飞趴什么都是常见的，真玩起来可比这厉害多了，最近这不就搞出事了，这还是运气好的，运气不好的话，被人撞到那些事，可是连脸都没了。'
