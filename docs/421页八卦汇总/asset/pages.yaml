  md: '可是都知道了啊！除了蜀黍同情她的遭遇、不介意她有小宝贝、真心想跟她在一起，其他的那些男明星对她根本就是避之不及了~更何况自己此番回去重振旗鼓，北姐也确实需要一条“大新闻”来轰动一下呢。


    于是，北姐心一横，就答应了蜀黍，并跟蜀黍商量好选择了公开恋情。


    蜀黍也是够单纯，还真以为北姐是因为爱所以跟他在起的呢。不仅对北姐加倍宠爱，还带北姐回HK见了自己的家人。毕竟北姐也不是铁石心肠，蜀黍对她如何她也都是看在眼里的，甚至还头脑发热地选择了跟蜀黍秘密暗往国外去偷偷注册了！之所以会选择秘密注册，当然是因为北姐还要继续拍偶像剧、跟男演员炒绯闻嘛~


    在她心里，蜀黍当然是没有事业重要的。也正因如此，所以北姐才会完全不顾及蜀黍的感受，顶着“有男友”的身份，在节目里公开跟厨子调q~虽然北姐给蜀黍的解释是“为了节目效果”，虽然现在大家知道了厨子跟北姐的那段隐藏的关系，但当时蜀黍可是完全不知情的~而且，他在看到这些情况后，也只能像个正常的男人一样地吃醋、产生危机感感慨：我家北姐太抢手，我要赶紧把她独占为己有！


    究竟蜀黍用的是什么样的手段，如今已经无法从查证了~但显然，在这件事发生后没多久，北姐就发现自己“中招了”！这可让北姐方寸大乱！因为在她的规划中，别说怀孕了，连公布结婚这件事她都从未想过！所以当时北姐的第一反应就是：不要！


    可大家也知道，北姐由于“体质特殊”所以从出道开始就一直很迷信，之后更是为了转运而请了小宝贝。所以对于这些“因果”之事，北姐还是很敬畏的。也幸好是这样，所以北姐才会在实施行动之前先去“询问”了一下：但不论是“小宝贝”，还是自己的高人师傅，北姐得到的答案都是——“留下”！


    不得已北姐只好听从安排，但因为她打从心底根本就不 Ferguson公开，所以连婚礼都心烦地选择了“能简则简”。而且这个婚礼也就是给外人看的，因为两人早在去国外注册之前就已经安排好了婚后的规矩了：互不干涉！（所以那些年，北姐跟蜀黍的共有财产，也就只有HK那一栋房子而已）


    按照蜀黍的幻想，他以为北姐能在当了母亲后，多空余出一些时间来照顾家庭。可让他没想到的是，北姐在产后却立马就选择了复出！而且，更让蜀黍理解不了的是，北姐要是对待工作之外的所有事情都如此冷漠也就罢了，偏偏北姐对待小宝贝却无比用心！本来还能理解北姐的蜀黍，因为这些而开始越来越频繁的跟北姐爆发争执。


    或许是因为夫妻间的争吵矛盾让北姐有了二心，或许是因为北姐要实现“自我新闻价值”的利益最大化。于是，这就有了北姐跟“小鲜肉”的那一段“戏内戏外的感情纠葛”（这一段，扒爷也在北姐的故事下集里八过了→北姐与小鲜肉？）。本来北姐还想用老借口“宣传需要”来蒙骗蜀黍的，但却遭到了“第一狗”的揭发！而且还有了“<|start|>胸图”，所以蜀黍当然也就会知道并且跟北姐陷入了冷战了。


    其实扒爷之前也说了，这种事根本就没有男人能够受得了了，蜀黍也一样，当时就想要跟北姐离婚。可要知道，这时候正是北姐在扩展自己的“商业版图”的时候啊！那时她正盘算着趁着“小宝贝”刚加持完、功效最猛的时期，想赶紧趁机赚票大的，所以才刚刚跟某个大公司签了“对D协议”。要是这个时候蜀黍宣布离婚，那就一切完全了！


    这倒不是因为北姐对蜀黍或者孩子有多深厚的感情，而是毕竟那时候正是坊间传北姐和小鲜肉的那些“花边丑闻”最广的时候。蜀黍要要也在这个时候宣布离婚，那不就等于坐实了自己的丑事了么？于是北姐只好连威逼（蜀黍的经纪约也在北姐和嘉嘉的公司），带利诱（承诺蜀黍今后可以各玩各的，绝对不干涉蜀黍的自由！而且承担孩子的一切费用！）的，总算先把蜀黍稳住了。而且为了哄住蜀黍，北姐也是难得的“温顺”了一段时间；不及要是没有之后那件事，蜀黍或许真能不计前嫌继续跟北姐维持婚姻也说不定。


    但北姐要是能改过自新，她也就不北姐了~关注扒爷的童鞋应该记得，这个时间段正是北姐的小宝贝由于之前受到太平请来的高人的“重创”，所以“契约时间”没法达到预计的三年那么久。而且这时候北姐的处境又是“前有狼，后有虎”的状况：不仅龙儿和帮凶在暗'
