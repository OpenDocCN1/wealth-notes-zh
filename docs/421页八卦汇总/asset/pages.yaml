  md: '关注过“四旦双冰”系列的宝贝应该还记得，扒爷说过杨幂那时候能够进周迅和燕子赵薇那部“画皮2”，就是靠着冯绍峰的关系（毕竟那部戏的最大投资方，就是冯绍峰所在的“兄弟公司”）。


