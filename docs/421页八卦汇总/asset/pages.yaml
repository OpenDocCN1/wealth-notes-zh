    就这样，在畸形思想环境下生长的吴绮莉，看似正常的长大了。 17岁，吴绮莉当选亚洲小姐冠军而被大家所关注。得奖后她自然也就进了娱乐圈，因为吴绮莉不缺钱，所以她对演艺事业就不怎么上心。所以“大小姐”一般的吴绮莉，在遇见当时还是土警的36岁成龙时，根本就瞧不上他。
