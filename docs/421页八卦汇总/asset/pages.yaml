  md: "2002年，小娥贝们心目中的大仁哥在自己稚嫩的年纪时出演了男主一角，女主是《不能说的秘密》中的女主角桂纶镁。美好的故事和人设让大家记忆犹新，直到前段时间当初拍摄《蓝色大门》的取景地——台北师大附中，这所学校里的泳池马上要拆除改建，依旧聚集了众多粉丝前来。\n\
    当天校方给了师生们一个大福利，在游泳池内给师生们做了一场《蓝色大门》的露天放映，还邀请来了导演易言和主演桂纶镁、陈柏霖。两人穿着当年戏中的校服出来到现场，虽然陈柏霖的胡子让扒爷有点出戏，但是桂纶镁经过十几年还是那副童颜啊！小娥贝们不信的自己回家再扒出片子看看，扒爷在这儿就放张当年的剧照，请自行对比~\
    \ \n写到这儿扒爷是真心感慨自己不怕暴露年纪，带着娥太的一片丹心给大家种草！！种草目的就是为了扒故事，今天小娥贝们要看的就是桂纶镁的忘年恋~ \n女主：桂纶镁，35岁；男主：戴立忍，52岁\
    \ \n22岁的桂纶镁在入行第四年接拍《经过》这部作品时认识了戴立忍，然后这位看似安静的文艺女神一头撞向了这堵南墙，一撞就是14年！ \n其实要说星途，如果桂纶镁不是因为性格低调，早年就开始跟大叔恋爱的话，她应该早就坐稳台湾文艺片一线女星的位置了。当年桂纶镁18岁读高中时就被导演易智发掘，主演了扒爷上面提到的《蓝色大门》，刚入行的她可是有着难得的清新感。2007年，由周杰伦执导并主演的《不能说的秘密》一炮而红后，连带着女主桂纶镁也人气飙升。\
    \ \n这张剧照是很多人的青春回忆吧！扒爷就随便问下，有多少人当年看完电影后想去学钢琴的！！ \n没多久桂纶镁还和周迅、张钧甯拍摄了《女人不坏》，受欢迎的程度之大连导演王家卫在考虑作品人选时都有想到她。最后人家也不负希望的被安乐影业签去，顺利与汤唯成为同公司前后辈。据说，桂纶镁当年的片酬可是由6位数直接升到了百万元啊！\
    \ \n然后就是这样一位前景大好的桂纶镁，当时谈着的却是年近四十却依旧默默无闻的戴立忍，没钱、没作品、没名气的三无人员。不知道小娥贝们记不记得，两年前赵薇的电影男主角因个体问题被观众集体抵制，最后不得不被替换。\
    \ \n这个被换掉的人就是戴立忍了，最初他未做任何回应，直到舆论不断波及到他身上丝毫没有停歇的意思时，他才发文否认此事。但由于后期官媒也开始重视有关个人立场倾向的问题，观众也没有原谅的意思。所以他最终只得选择放弃内地市场，就连这部电影也一起夭折在摇篮里。\
    \ \n虽然他是个有才华的导演、演员和编剧，但早年间的事业是真的不顺，甚至还身背债务，连生活都十分艰难。 \n两人最初因双方名气、年龄等各方面相差太大，所以在一起后十分低调行事，但依旧遭到女方家人的强烈反对。扒爷觉得也不怪家里长辈不同意，一两\
    \ 人年纪相差了17岁，二女方家境有着实太好。 \n桂纶镁的爷爷是黄埔军校一期毕业，一期哎！！老人家当年在世时担任过中华民国海军总司令，国民政府国防部参谋总长，桂纶镁可算是典型的名门之后了……\
    \ \n而男方那边只是普通家庭，没甚东西可说。 \n扒爷就问一句，这种背景不算悬殊算什么？ \n其实两人当年无论是年龄、经济实力，还是名气，这种差距很容易给感情造成障碍，但男方对女方一直都很呵护。戴立忍在未出名前曾经说过一段话，“她是有国际潜力的演员，我是什么咖？不能给对方加分就不希望提自己。”\
    \ \n谈了五年后，戴立忍带着自编自导的作品《不能没有你》站在了金马奖台上，成功夺得最佳原创剧本奖。身为开奖嘉宾的桂纶镁在台上便为男友感到激动，两人在镜头前便相拥在一起，他们以这种形式首次在大家面前公开这段感情。\
    \ \n明星们一般在大家面前公开恋情后，都躲不掉被询问结婚计划这件事情。这不，忘年恋这对也一样~人家男方刚拿奖就因为年龄关系被记者追问何时结婚，这位事业刚有的苗"
