  md: '用价值了。不过周迅这人还算仗义，在一起的时候，还是帮过老公的。比如广告商指定周迅夫妻档代言，周迅同意但老公却不想，所以代言就没接。比如周迅给老公拉资源，但老公却推了不少，因为嫌累不想接那么多活。嗯……怪不得老公演那么多年戏还没混出个名堂。）。


