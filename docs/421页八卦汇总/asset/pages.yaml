  md: '也是很斯文，脾气很好的。这一点，从他在吐槽大会上，被别人diss上九重天还能没心没肺地傻笑也能看得出来。正是因为从小在画家父亲的熏陶下，王岳伦的性格一直都是这样慢条斯理的，跟李湘的火爆脾气形成鲜明对比。


