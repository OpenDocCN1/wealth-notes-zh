    在面对两个旧爱联合上法庭的严肃对峙下，张铁林依旧口口声声表示两个旧爱都是为了钱才联合起来。


    扒爷不得不感叹皇阿玛的三观是真有问题啊！人家姑娘家怀了孩子不负责你还有理了？真不愧是真是荧幕“渣皇帝”现实“渣男人”的第一人！


    写到这里，扒爷想最后提醒各位小娄贝们，千万别在垃圾堆里找男人！


    # 21、杜淳


    这两年娱乐圈里的男星、女星似乎爱上了健身人设，不管是不是一直在坚持做运动人，都会po个健身房pose照上微博。小娄贝们可以去看看，但凡健身有明显成效的明星，晒照的次数会越发频繁。


    扒爷发现最近杜淳就走上了疯狂晒健身照的路线......他半个月时间只发了六次微博但其中三次都在晒腹肌，并且照片里的尺度一次比一次浪。就杜淳这裤子低的程度，估计半个屁股都露在外面了吧！！'
