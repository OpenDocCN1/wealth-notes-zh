  md: '人的他不再把重心放在袁立身上。这一点完全戳痛了袁立那敏感的神经，绝对不允许自己被无视的她直接把陆毅和导演的关系，还有男方和她的亲密事事儿都播给了媒体朋友。她以最直接的方式与陆毅划清界限，本以为能泼人一身黑水，没想到很多消息还是被快速的处理了，透出来的也只一丢丢风声而已。


    而陆毅那边也早就是为自己的后路做好了打算，演技不算好的他在事业上没有太大冲进，所以他早早就向多年痴情女友鲍蕾做出结婚的承诺。之后，陆毅在那些大导面前面样子做够了，也就被玩腻丢弃了，只见新人笑不见旧人哭的情况正好满足了陆毅退出结婚的意愿，现在的陆毅也差不多把自己从之前的丑闻中洗白了。


    在03年这个时期，真正跟陆毅传出绯闻的，可是田海蓉啊~估计很多童鞋可能不知道田海蓉是谁，可要说起陆毅的“情史”，她可是不得不提的一个。现在一提起陆毅，都知道他的老婆鲍蕾也是演员。但由于没有什么代表作，又鲜少有新闻。所以鲍蕾不论在名气还是各方面，似乎都跟陆毅不在一个级别。早些年陆毅还没跟鲍蕾结婚的时候，两人就从没隐瞒过有恋人的身份。可别看鲍蕾现在是这种专心带娃、当陆毅背后的女人，当年她也是个不好惹的主儿。


    03年，陆毅作为国内当红小生之一，影视歌多栖发展得顺风顺水。可没想到，坊间却突然爆出了“陆毅是陈世美”的消息。一查新闻的源头，居然疑似是从同属圈内人的田海蓉嘴里传出来的。这一来自然是引起一片哗然了。正当记者要动笔报道田海蓉跟陆毅的旧情时，鲍蕾却站出来开怒了：田海蓉就是看陆毅红了才这样倒贴炒作的！通读全文，相信大家也能感受到鲍蕾这份霸气的“护食”态度了。不仅直接炮轰同样是明星的田海蓉，更是完全不带<|start|>羞耻地，直呼自己才是跟陆毅好了五年的女人！


    记者随后又采访了陆毅、鲍蕾、田海蓉在上戏的同学，同学表示田海蓉跟陆毅应该是好过一段时间。也有同学表示，是田海蓉一直在追陆毅，但陆毅一直没答应（不过这样回应记者的这个同学，在之后被证实可能是鲍蕾）。所以就出现了：鲍蕾说不是事实，陆毅说不是事实，田海蓉不承认不否认，同学们说在一起过这样的尴尬答案了。不论田海蓉究竟是不是跟陆毅在一起过，但看了陆毅的回应，也是很斩钉截铁地跟对方划清界限的。


    如果排除掉个人性格的原因，按照娱乐圈里的套路来说，陆毅完全可以更委婉地回应一下这件事。可这么直截了当回应“我不喜欢”，反倒是有点奇怪了。毕竟，众所周知…


    好了，扒爷也不说这些“场面话”了。其实大家应该都听说过、看见过，网上那些关于陆毅出道时期的“内幕”爆料。陆毅出道很早，可真正让他走红的，还是那部海岩的《永不瞑目》。在这部剧中，陆毅的痴情也是rio大的。那时候，海岩还跟赵宝刚强强联手共同进步。海岩写，赵宝刚拍，基本上面能够出演他们俩的作品的演员，就没有不红的。由于捧红的都是男演员，所以海岩剧便因此而生出了一个专用头衔——岩男郎。


    当时海岩要筹拍“永不瞑目”，原本是要用第一代岩男郎陈坤的。之所以选择了陆毅，据海岩自己说是因陆毅的身高更高、更符合原著。虽说宝大爷在坊间还有不少“女明星”的料，不过海大爷就显得“专一”得多。不仅从始至终，都流传着他与“男朋”们的不可说的小故事。凡是被他捧过的男朋，无一例外都流传过“qian
    gui ze”的传闻。


    远的不说，就说今年才被爆出的“性侵案”男主高云翔，当年就曾经传出过跟海大爷的绯闻。（关于董璇、高云翔“共享金主”的深八长文，扒爷已经放在小号后台了，大家移步去“浑水扒娱”搜索后台就可以看到了。）陆毅就在那时候被网友爆出了跟海大爷的秘闻。具体的扒爷不好意思说，大家就自己看图吧。


    现在再看一下陆毅的这份明显“急于撇清”的回应，是不是有点意思了呢。不过陆毅仅仅跟海岩合作了这一次，便再没合作过了。这其中的内幕，据说也与陆毅“无法违背自己的内心”有关。没有了海大爷的力捧，陆毅之后的作品质量也确实不如从前。


    海大爷还频频在媒体前喊话：我一定会捧出一个比陆毅更火的！潜台词：陆毅你就后悔去吧！而在这一期间，陆毅过的也确实很惨。甚至还一度传出了“借酒浇愁”的抑郁迹象。要不是鲍蕾在此期间，对他不离不弃，估计陆毅没准早就放弃了。大概正是经历过那'
