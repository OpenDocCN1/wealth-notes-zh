- pgno: 23
  md: '有了胡仙的支持，范冰冰的运气便肉眼可见地上涨了。不但凭借某部“大尺度”电影苹果，一举入围了电影节最佳女主；之后更是借此成功杀回了内地娱乐圈，并且自立了门户。电影双线发展，内地、香港资源不断！更让所有女星“闻风丧胆”的是，范冰冰居然将圈内第一炒作女王——无邪女士收为己用！一时间，各种艳压通稿，搞得所有女星苦不堪言。


    直到这时，章子怡才终于后知后觉地意识到了危机。绝不肯坐以待毙的章子怡，立刻出手了：在她自己投拍的电影中，找来范冰冰做“洗脚妞”女配！章子怡想得倒是挺好，却没想到自己的主动示威，竟然正中范冰冰的下怀！


    范冰冰非常爽快地同意了，连章子怡故意恶心她的“二线演员的片酬”，都毫不在意。拍戏的时候，范冰冰也是各种花式讨好，谄媚恭维齐上阵。这反倒让章子怡不知如何是好了，她原想着范冰冰要是不反抗的话，自己就正好给她些教训。结果范冰冰这么乖巧，倒是让章子怡不好发作了。所以，即使心里并没有真正地把范冰冰当姐妹，章子怡表面上表现得也是很亲近的。


    范冰冰如此讨好，当然是有她的目的的。大家应该听说过，09年两人在宣传电影时，曾经爆出过这样一条新闻：范冰冰自爆章子怡曾有意为她介绍外国男朋友。而章子怡的反应却是“反常”，甚至有些急于辩解、澄清的意思。要知道，第二年章子怡就因为“反噬”，被爆出了“三重门”事件。尤其属赵嬉娘赵欣瑜爆出的这段“财色丑闻”，最让人震惊。


    接下来，扒爷给大家讲个“纯属虚构，绝非影射”（被自己的求生欲感动了）的故事：范冰冰跟章子怡故意接触后，没多久就知道章子怡当时就已经跟她那位“世界级土豪”的感情，发发可危了。虽然章子怡对外宣布分手的时间是10年；实际上早在08年，章子怡跟她那个“一毛不拔”、“结婚必须先签婚前协议”的老男友，就已经处在长期争执的状态了。


    而当时章子怡刚刚结交了邓姐邓文迪，邓姐才刚跟她谈好了一部“大投资”电影。此时正是邓姐等着看章子怡“能力”的时候。章子怡原本想着，忽悠自己的土豪老男友投资。谁知道对方不但一毛不拔，还因此生了戒备心。


    好在章子怡在酒会上，结识了有“红色背景”的赵嬉娘。章子怡便想通过她去结交一些人傻钱多的富家子弟，来给自己和邓姐的“大投资”指点钱。赵嬉娘也是全无防备的，居然把有妇之夫的郁先生（郁国祥，人称小宁波）介绍给章子怡认识了。


    郁先生很快就被章子怡迷住了，送钱、送钻石，想要什么都给她。可惜啊，章子怡的事很快就被郁夫人知道了。而且这位郁夫人才是真正有实力、有背景的厉害人物，章子怡当然不敢再跟郁先生见面了。


    这时候，范冰冰就非常及时地出现在章子怡面前了。而且范冰冰还非常天真单纯地跟章子怡“诉苦”：哎，真羡慕你有国外的男朋友啊！这样的男朋友带出去才有面子呢！哪像我，成天被那些土包子暴发户缠着，烦都烦死了。


    章子怡听她说完，就随口问了一句：什么暴发户？

    范冰冰很是气恼地说：还不就是那个“卖矿泉水”恒大冰泉的老男人嘛~

    章子怡一听，愣了半天，激动地差点喊出来：这个傻子真是不识好歹！土包子可是国内顶级的富豪啊！


    不过章子怡很快就冷静下来，并且马上就换了一副“亲昵”态度：哎，可不是嘛~国内那些暴发户都没什么文化的！哪像我男朋友啊~你要真是想找国外男朋友，就得好好学外语才行啊~等你练好英语，我到时候帮你介绍一个。


    之后，范冰冰每天都带着“英语书”学习，章子怡也很热情地指点她。不过更多的时间里，章子怡都是在问范冰冰跟暴发户有关的事情，并且时不时地就要暗示一下，自己现在缺少资金的事情。


    范冰冰一听，立马非常大度地说，没问题，我帮你介绍！'
