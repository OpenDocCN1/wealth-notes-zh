    # 帮派系列


    # 1、京圈往事


    扒爷在看过留言后临时起意决定开八的“帮派”系列。其实关于娱乐圈里的各大势力，扒爷一直以为大家是都了解的呢。没想到却还是有不少童鞋表示缺课、不明白，所以接下来扒爷会简单地把之前娱乐圈里那些“圈子”，作为单独的一个版块跟宝贝们八一八。


    很多宝贝在看过“四旦双冰”后，都一直在后台留言问扒爷，娱乐圈里究竟有没有出身清白、堂堂正正出圈的明星。虽然如今的娱乐圈各种黑幕秘闻层出不穷，可早在上世纪90年代时，一些德艺双馨的老一辈艺术家确实多数都是凭借自己的实力成名的。可随着zi本入驻，让娱乐圈这个本该是文艺工作者完成业务的圈子，变得跟名利挂钩；身处其中的明星也越来越浮躁，到最后同流合污、不能免俗。


    而这种“zi本”干涉的现象，就是以“京圈”的核心——华姨的崛起开始兴起的。90年代初，国内兴起了港台偶像的追星热潮。看到商机的王氏兄弟，当时刚在国外赚到了第一桶金。在眼看着“四大天王”、“小虎队”等港台艺人，为经纪公司、娱乐产业带来了巨大的利益后，二王兄弟便决定开创国人自己的“娱乐时代”。于是，当时更了解“广告行业”的兄弟俩，在思虑再三后，决定从“电影”入手，成立影视公司。“华谊”，就这样承载着兄弟俩的梦想，在94年正式成立了。


    之后由于招纳了小钢炮作为旗下的主力导演，小钢炮又通过拍摄王朔小说改编的电影一炮成名，华姨也开始了自己的崛起之路。也正是由小钢炮，导致如今很多人一提起京圈，总认为京圈就是华姨，其实这个概念完全弄混了。其实华姨只是京圈的一部分，后来因为华姨逐渐坐大，再加上其他京圈人物都不爱炒作，所以才给人了这种印象。


    如果把京圈比作一个企业，那么这个“京氏企业”有五位“元老”，分别是：“工程部经理”郑xiaolong，“业务部经理”王shuo，“管理部经理”叶da鹰，“财务部经理”叶jing，“文艺部部长”崔jian（由于与影视圈关系不大，今天就不说了）。'
