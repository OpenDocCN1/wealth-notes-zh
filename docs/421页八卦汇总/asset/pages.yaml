    莫少聪开始卖起了思子人设，认下亲儿子的他通过媒体表了番爱子情说自己很想念儿子，顺便diss洪欣不允许他看望。姨太告诉抓爷，洪欣也是够善良，如果换成她连不给探望都不会说，只要敢提就直接曝光他各种丑闻堵住他的嘴。


    对了，在打完亲情牌没几个月莫少聪就表示要和小自己21岁的北京圈内女友洪雁结婚照顾两人的孩子。有消息称两人仅结婚数月便闪离了，不过女方之后在接受采访时直接全盘否认，一没有结婚想法，二更没有孩子。


    呸呸呸，抓爷看着都觉得脸疼~

    当时还有很贱的媒体去问洪欣，对前男友莫少聪结婚有什么感觉……人家回应：“一点感觉也没有”


    写到这儿，抓爷想“夸”这些媒体了，真是厉害死问这种破坏问题。

    而姨太已经在抓爷旁边吼起来了……她让抓爷告诉小姨贝们，洪欣那时候正被张丹峰猛追，虽然还没有真正接受男方，但也不会关心里面的那位渣男好嘛！这确实说的没错，那时的洪欣担心跟张丹峰两人相差十岁，自己还有单身妈妈的身份，所以刚开始拒绝了张丹峰。


    闻蜜蔡少芬知道这件事后，还特意跟洪欣提出反对意见，表示不看好张丹峰。但两人还是排除万难在一起至今~


    可是只要人家过的好，莫少聪就会不开心…这不当张丹峰一家四口好好过日子的时侯，他又整出幺蛾子来。


    有年莫少聪联动了香港那边的《明报周刊》一起报道自己有多冤，自己各种有情有义。为了证明自己一直在努力维护亲情，还把自己和儿子的私信截图都登在了周刊上。在这儿先放个清晰版聊天记录，小姨贝们自行品品这次回复的速度，算是亲情沟通？想看详细狗血文字的小姨贝们自行看图，抓爷就不用文字叙述了，免得自己先被恶心吐。


    此事发生后，洪欣第一次公开发声回应，表示孩子被这么曝光觉得很伤心，感觉被“利用”了一样。


    抓爷觉得没毛病，这样看完全就是莫少聪下的一个套路！


    虽然张丹峰前段时间的舆论让他的好丈夫形象有些崩盘，但是也不能一同否认掉人家对孩子的付出。洪欣的大儿子莫镐廉因为十分满意、依赖张丹峰，甚至直接把姓名改成了张浩峰。


    虽然现在微博名还是张镐廉，但抓爷觉得这也所谓了，心意在就好。


    抓爷其实挺心疼这孩子的，有次洪欣在做客访谈节目时曾提到称她问儿子，“是害怕失去妈妈吗？”儿子哭了好久只说了一句，“我不是害怕你，我害怕爸爸（张丹峰）不再爱我了。”


    抓爷写到这儿，姨太已经放弃形象在一旁眼含热泪的看着张浩峰的帅照了……看着这么懂事的孩子，抓爷再想到开头曾提到过张丹峰经纪人毕滢那些绿茶行为，真是一言难尽。


    很多小姨贝估计还在纠结这两人如果真发生了事情，为何洪欣还不离婚丢掉渣男。'
