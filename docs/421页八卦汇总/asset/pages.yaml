    # 2、章子怡


    昨天扒爷说过，赵薇在01年“连走背运”后，曾一度远走香港。即使后来再周转回到了内地，也不复当年的声势，之后更是淡出娱乐圈转战商海去了。没有了赵薇这个最有力的竞争对手，剩下的三个人都明显松了口气，纷纷暗中发力想要夺得王位。


    其中发展势头最好的，就属章子怡了。


    章子怡的走红，全靠张国师慧眼识珠。享誉国际的巩皇巩俐，就是张国师一手捧上位的。而章子怡的脸，又跟巩皇有那么几分相似。所以，从章子怡出道起，她就一直被人嘲笑只是纯元·巩皇的替身罢了。但要知道，章子怡可是个非常要强的女人，这样的评价只会让她更加努力，想要超越巩皇、超过所有人。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '可是娱乐圈里，努力未必就一定能成功。尤其在章子怡接演了台湾李大导李安的电影后，更让她意识到了这一点。就因为李导的心仪人选并不是她，所以她再怎么努力，都没能得到李导的认可。


    章子怡嘴上不说，心里却是苦恼。这时候的她，便开始琢磨着想用“其他方法”上位了。可惜，章子怡想要“献身”的发大哥，对她根本就没兴趣。自己讨了个没趣的章子怡，反而成了剧组的笑柄。好在她所在的剧组里，有个平时跟她关系不错的杨姐。杨姐看章子怡郁闷，就好心提点她：要想在娱乐圈里出人头地，未必非要“卖身”求荣啊，“偏门”也是可取的！


    章子怡当然明白杨姐是想让她去“东南亚”，求一些在港圈很是流行的“小gui”。


    章子怡这人心里虽高，但她可不是缺心眼！她很清楚有些东西，一旦反噬了会是多严重的后果。不过，章子怡对于这个提议也的确是动了心思的。于是，在多方做了调查之后，她最终选择的是“狐仙”（以下用胡仙代替）。


    一方面，是因为她想求得的，并不是“小gui”主招的名利、财富，而是人缘（即人脉和异性缘）；另一方面是因为，其他门派的规矩、禁忌，实在是太多了！章子怡很清楚自己绝不是什么有原则的人，一旦有那个必要，她是一定会为了目的不择手段的。到时候真要是破了规矩，别说“红”了，能不能保住命都不一定。而胡仙就不同了。不仅好处多，而且门下只有一个禁忌：绝不能跟同行的姐妹横刀夺爱！


    章子怡自作聪明的以为，这个禁忌发生的概率太低了。既要是同行的圈内女星，还要恰好跟是拜在胡仙“门下”的弟子，世界上哪有那么巧的事儿啊！可惜，章子怡后来真就被设计得犯了禁忌，差一点都翻不了身了。


    章子怡打定了主意，就开始四处打听哪里有这样的地方。刚好章子怡的剧组中上到导演、下到工作人员，很多都是台湾人。而台湾又刚好就有一座胡仙山——阳明山。山里修行着上百位胡仙，一部分是台湾本地的，一部分是被大师从香港带过来的。


    至于这其中的缘故，还要追溯到八几年的那件，轰动全国的“香港胡仙事件”。由于比较恐怖，扒爷就不详细说了。感兴趣的同学，可以去网上搜一下“81年香港温莎大厦”（不要被吓到鸣~）。


    当然了，你们现在能够看到的新闻，只是写到了“放生到阳明山”。这件事，其实还有很多有趣的内幕（比如如今内地的某个香港当红小生，当年是如何拜入门下的？）以及后续，由于与今天的故事没什么关系，就留待以后再讲了。


    章子怡知道后，便通过同剧组的本地朋友，找了一位道行非常高的陈道长，求回了胡仙。（原本陈道长才是正宗的混元“嫡传”，可惜由于种种原因，现在在台湾盛行的是“禅宗”一派。如果有谁能够寻访到陈道长的道观，也许你会发现就在道观里的墙上，就贴着章子怡跟陈道长的合影呢！）并且按照陈道长的叮嘱，潜心供奉。有了庇佑，章子怡的事业也越来越好。


    扒爷说过，胡仙这类<|message|> 的 xian 家供奉久了，门徒的外表也会有所变化，跟 xian 家越长越像。细细观察就会发现，在那段时间里的章子怡，跟现在就不太一样。胡仙主婚、旺人缘，所以章子怡一连几任的绯闻男友，全部非富即贵。当时还有不少“不雅照”流传出来，甚至在此期间，章子怡还拍了一部疑似“不爱国”的电影。这要是换成别人，早会被骂的抬不起头了。可章子怡有着胡仙庇佑，居然完全不受影响。照样接拍的全是圈里最顶级的资源，一时风头无两。


    # 3、章子怡被设计'
