  md: '急删掉，重新发了不带果照的微博（目前均已被删），但还是被手快的网友截图保存了证据。


    这种做法已经不能说黄毅清是单纯的“无耻掀屎棍”了，现在的他简直就是个人神共愤的沙雕深井冰。就算离婚了，黄奕毕 竟也是自己女儿的妈。黄毅清居然就敢这么直接地发果照出来，真是要多low逼有多low逼。


