  md: '五月十五日香香公主颖儿和付辛博在巴厘岛举行婚礼一事，真是引爆话题，热搜居高不下。作为新郎官的付辛博也在微博晒照，感慨新生活的开始。颖儿也夫唱妇随，转发该条微博，甜蜜回应。而郭碧婷，薛凯琪，沈梦辰，马可，胡夏等一众明星更是组建兄弟团，姐妹团用行动为新郎新娘呐喊助威。


    话说，颖儿付辛博去年8月在微博认爱后，没过几天，就被网友爆料他们领证结婚了。而且当时外界还猜测颖儿已经怀孕了，如今看来娱乐圈的事也并非是空穴来风啊！


    想当初，颖儿凭借着香香公主一角在娱乐圈崭露头角。之后，颖儿获得杨子的赏识，其后签约到杨子的娱乐公司。当时颖儿深受老板杨子的宠爱，不但以毫不吹灰之力得到颇多的影视资源，以新人姿态出演多部影视剧的女一号。甚至还可以让公司一姐黄圣依为她作配，于是关于颖儿和杨子的绯闻甚嚣尘上。


    当时盛传黄圣依看不惯颖儿和杨子走得太近，抢了自己的风头。直到在一次电影发布会上发生的大龙凤，似乎印证了这一说法。当时，作为电影女一号的颖儿去出席发布会，竟然被现场保安拦截下来了，不管怎么解释就是不让放行。


    无可奈何的颖儿更是急得眼泪刷刷往下掉。在苦等半个小时后，颖儿才得以进入会场。当时她只能回应称，没有接到主办方的通知。写到这里，扒爷不禁一脸懵逼！新电影发布会不请女一号出席，这么清新脱俗的宣传方式，也是厉害了。


    然而就是这么一闹，当时颖儿也毫无忌惮的上了新闻，以致于很多人猜测，这是黄圣依为了给颖儿一点教训，才百般阻挠，不让她进场的。甚至更有传闻颖儿因和杨子关系暧昧不清，而被黄圣依下令封杀。但是，颖儿很快就否认了这一说法。


    直到黄圣依杨子结婚的事被曝光后，这场所谓的三角恋又被媒体旧事重提。于是隐忍多时的颖儿只能发声明，澄清自己和杨子并无不正当交往及情感纠葛。事后，她解释当年自己被拦截在会场外一事，和黄圣依无关。只是电影制片方不让她去而已，完全是因为沟通没做好，才有了这么一出闹剧。


    虽然，颖儿声称和杨子没有任何情感上的纠葛。但是至于另一香港富商纪晓波，她倒是十分大方承认两人的确有爱过。想当初，九头身美女吴佩慈为纪晓波产女不久后，网上竟然流传出颖儿和纪晓波的亲密合影。


    其后大批媒体报道吴佩慈生完女儿后，被纪晓波抛弃。而颖儿在这个节骨点晒照，无异于是向吴佩慈宣示主权。于是颖儿吴佩慈纪晓波当时处于风口浪尖，吴佩慈更是被群嘲豪门梦碎。


    但是，面对这一困局，纪晓波马上向媒体澄清，颖儿只是过去式。马上撇清两人干系。之后，颖儿在接受访问时，也为自己喊冤。她声称自己没有在微博朋友圈晒照，本来就几个个人知道的事情，不知道怎么会流传出来了。所以这么说颖儿是被人出卖暗？！


    其实综合以上说来，颖儿一直被外界标签为小三，总是陷入情感的漩涡。就连当初和付辛博走在一起，也是被传是插足感情，饱受争议。颖儿付辛博一开始被媒体偷拍到两人同回酒店，于是被认为两人有情况。谁料，不久后，付辛博又被爆出和嫩模王靓雅在酒店同房两天两夜。


    当时，媒体还把王靓雅进出付辛博房间的视频放出来。一时间，付辛博负心汉的形象跃然纸上，颖儿也被获封是小三。两人随即受到大众的道德抨击。不过，面对大众质疑的颖儿随即澄清，自己和付辛博在合拍电视剧，只是住在同一酒店而已。两人是清清白白的。但言辞中还透露出付辛博单恋颖儿。至于付辛博也回应，自己是无辜的，和王靓雅根本不是恋人关系，她只是朋友的朋友。不过，这位王小姐似乎没那么好应付，因为她之后又放出和付辛博的聊天记录，以此证明两人道不清说不明的关係。


    虽然媒体晒出视频，王小姐亮出聊天记录，都以为自己胜券在握了。但是，面对这一连串错漏百出的证据，一众网友纷纷侦探上线，细细分析后，认为这是王小姐串通媒体，妄怂付辛博颖儿的不要脸的行为而已。


    本来，颖儿付辛博就属于是神女无情襄王有意的局面，现在经过王小姐这么一闹，反'
