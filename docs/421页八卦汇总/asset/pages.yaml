  md: '回应，不会再生了。幽默感十足的她，最后还不忘调侃自己想要抱孙子。试图转移生子话题。


    自从嫁入豪门后，徐子淇一直过着女人艳羡的富太生活。出门有私人飞机接送！！在自家后花园开个派对，作为主人家肯定要打扮美美哒，直接一个电话打给Tony让他上门服务就行了。过个生日，老公还会砸个1.35亿买个新游艇作为生日礼物，仿佛就当是买个玩具那么轻松。就连给儿子的磨牙玩具也是法国定制的18k纯金打造的手机壳，话不多说，宝贝儿子喜欢最要紧，钱不是什么大问题。写到这里，扒爷都忽然恨自己不是女人了。（好像说得自己是女人了，人家就会看上我一样。这都是命啊！）


    虽然，徐子淇的生活过得有声有色，但想要作为受宠的豪门媳妇不但要听话，首要条件更是要为夫家继后香灯。扒爷不得不说光鲜的背后，这不为人知的辛酸更是令人唏嘘。


    想当初，年仅24岁的徐子淇和李家诚在2006年底走进婚姻殿堂，当时两人还举办了一场耗资7亿的世纪婚礼，砸钱程度让人咋舌。其实婚礼时的徐子淇就已经有孕在身了，可谓是双喜临门！但因为要遵守习俗，所以没有对外公开而已。当时徐子淇的公公还十分上心，特地跑到西安为孙儿祈福，所以可想而知徐子淇的生子压力究竟有多大。


    婚后不到7个月，徐子淇诞下一女，当时徐子淇和老公表示非常开心迎接新成员的到来。不过生女不久后，徐子淇又火速怀上二胎，于是被外界指她为赢得公公的欢心，稳坐豪门媳妇的位置，只能马不停蹄追生儿子，为李家传宗接代。可惜，希望越大失望越大，对二胎寄予厚望的徐子淇并未能如愿，还是诞下女儿。于是引发外界一致认为徐子淇在李家的地位已是岌岌可危。


    多年后，徐子淇的前贴身保镖向媒体透露，徐子淇只是生活在笼子里的金丝雀而已，她的豪门生活并非一般人想象的那样。他甚至说，虽然徐子淇的公公天天跟她说“生子生女不要紧”，但公公这番高情商的催生儿子的说辞，听多了，再笨的人也会领悟到个中缘由吧。


    不过，还没等徐子淇来个绝地反击，她那还没成家的大伯李家杰就迫不及待跑去美国，找DY生了三胞胎儿子。虽然，当时李家杰找DY这事闹得沸沸扬扬，被大众抨击道德有问题。但还是止不住徐子淇的公公喜上眉梢，毕竟同时添三个孙子，真是睡着了都会笑醒的事呀。


