  md: '大计（在紫薇格格的婚礼上，范冰冰跟周迅出乎所有人的亲密，让多少人没看懂？），周迅却没有忘了自己的复仇大计。


    那时候，刚好坊间传出了要翻拍“小说剧”如懿传的消息。其实在最开始，剧方的确是有心想请梁朝伟的。周迅虽然在那时候已经开始转移到小荧幕圈，但剧方碍于周迅的天价片酬，根本就没敢去请周迅。结果周迅却主动通过中间人，示意剧方自己可以接演。原本一切就要定下来了，但道高一尺魔高一丈的黎嘉玲，在最后关头给梁朝伟下了死令：绝对不许去！


    这一来，虽然让周迅的如意算盘落了空。但一计不成还有一计：三姐早晚有机会，先搞别人！首要目标，当然是赵薇！要知道，虽然赵薇是自己作si、用了“立场错误”的“台du”艺人不假。可仅仅凭借“官博”的力量，是并没有那么大的舆论影响的。毕竟某浪就是跟赵薇长期合作的马爸爸的，而某搜索也跟赵薇是长期密切合作的。那么问题来了：在所有人的发声都被屏蔽的情况下，事件又怎么被“上头”知道的呢？


    具体的扒爷不能多说，但可以很肯定地告诉你们：如果不是有人脉、有背景的人在背后向“上头”汇报了，这件事根本就不会造成如此大的影响！更不要以为“共xx”的官博是个多厉害、多有背景的官博，真的有背景，赵薇就不敢删了（比如赵薇怎么不敢删“ren民网”的？）要不是这事件的背后，有周迅示意“上头”，拿“王大师”做文章，根本就不会闹得那么大！所以，这回大家知道，为什么周迅当初一定要把赵薇甚至是马爸爸跟王大师“捆绑”在一起了哈？


    莲花姐比赵薇幸运的地方就在于，她早早地就退出了内地的圈子的争斗，躲去了国外；而还想在国内继续挣钱的赵薇，自然就很容易被抓到把柄了。尤其是在上头想要整顿圈子的时候，像赵薇和马爸爸那种“割韭菜”圈钱的行为，再加上周迅这边安排人向上示意赵薇跟王大师一样，是“对立立场”的。自然很快就容易“出事”了（不然那些以前就有的问题，为什么当初没被报道过？反而会在这一系列事件发生后，很快就被查出来了呢？）~


    娱乐圈看起来是娱乐，其实真到了四旦那个境界了，根本就不可能单纯涉及到“娱乐”而已。当天真无邪的周迅，跟当年在香港结交下的好友“阿峰”表示，自己对“窦靖童”很有兴趣之后。同样是佛教信徒的谢霆锋，在看到周迅现在也是很虔诚的佛教徒后，便毫不怀疑地安排了聚会。


    周迅和老公分开后，她又为了报复那一拨人，蓄意接近“窦靖童”。要不怎么说周迅是个天生很有魅力的人，简直老少通吃，厉害得很。渐渐地大家发现周迅和窦靖童走的越来越近，表面看似是好友、忘年交的感觉，其实就是暧昧关系哦~而且窦靖童自打和周迅在一起后，变得很开心，完全不见以前那种冷酷到底的范儿。想想，能让窦靖童辣么开心笑的人，上一个是谁？叮咛，就是那个清纯女星“周冬雨”啊！


    周冬雨和窦靖童当初是因为一部拿奖电影开始交熟的，两人年龄差的<|message|>不错，所以玩得很好，后来就真的慢慢好上了。这里插播一句，好上了不代表周冬雨择偶取向就彻底改变了，在娱乐圈很多概念、边界可没那么清晰。那一阵子周冬雨也常常被拍到和窦靖童一起出去玩，每次露面两人都是乐呵呵的，一时间“闺蜜情”都被炒了起来。


    但姜还是老的辣，周迅的出现改变了格局，她又插足当小三了，之后窦靖童果然就和周冬雨越走越远。眼见窦靖童变心，周冬雨也很生气，再也不想搞什么互动了，甚至出席活动再见面时都变得不再亲密。


    虽说周冬雨情场失意，但职场得意啊。也多亏了和窦靖童的关系，周冬雨当初才能搭上前辈赵薇大姐，得了不少资源。比如大姐赵薇搞的那个做饭综艺节目，周冬雨能参加，其实就是跟赵薇大姐关系打得好的原因。所以别看周冬雨年纪不算大，但一点也不傻，对自己有用的
    人、比自己厉害的人，她都会特别对待。也不能说周冬雨势利眼，毕竟然圈里混的都这样。'
