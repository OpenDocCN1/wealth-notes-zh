  md: '不过要是有宝贝们去KTV，点了她们的歌，看着MV，你会怀疑自己的眼睛有毛病……因为她们刚出道时，长得虽然不是特别惊人的美，但是满满胶原蛋白的小圆脸，也很可爱甜美。再看看现在姐妹俩，变成了这样。上面那张还是精修图，现实中她俩的脸整容痕迹很明显。


