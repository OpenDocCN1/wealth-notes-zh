  md: '没成想跨过海峡来了内地，陈妍希还是不改本性，又开始撩男人了。在拍摄一部演员随时改戏改台词的烂片时，陈妍希和已婚男“文章”看对眼了。在剧组里陈妍希跟谁都不怎么爱搭理，就喜欢搭理文章。拍戏期间两人就睡一块了，尽管文章老婆知道，也懒得管。一段露水姻缘罢了，正房看得很开。那为啥文章后来被爆出和另一个小三女姚笛的新闻呢？其实还真不是文章老婆干的，而是小三女让狗仔来拍，想着逼宫上位。但谁知道文章老婆不走寻常路啊！大方包容，还开创了新一代原谅体。


    等到戏拍完了，文章和陈妍希也断了关系。紧接着陈妍希靠着金主，加上男主“陈晓”对她之前的清纯角色有好感，于是多重推荐下，陈妍希出演了那个著名的表情包角色。


    陈妍希一来就看上了帅气的陈晓，毕业陈晓颜值还是可以的。虽然这时的陈晓有对象，就是那个和他一部戏火起来的“赵丽颖”。但陈妍希出现的时机太巧，正好赵丽颖和陈晓因为各种原因导致感情有缝隙。


    所以陈妍希靠着温柔的撩汉技能，在剧组里和陈晓各种互动，让陈晓感觉还是陈妍希这样的更适合自己。女友赵丽颖性子太要强，还和自己理念不合，而且他还疑心赵丽颖在拿他炒作，所以陈晓觉得两人不合适。


    于是本来摇摆不定的陈晓，最后就和赵丽颖分手了，然后就和陈妍希在一起了，甚至后来还求婚了。可陈妍希是一身黑料啊，还早会被陈晓察觉到，于是有一段时间两人表现的很不甜蜜，其实就是翻烂账生气呗。


    但要不怎么说陈妍希会哄人，仗着自己未婚先孕，卖卖惨抹抹泪，竟真的又把陈晓哄回来了，两人婚礼正常进行。所以很多人都会纳闷为啥这些黑历史多多的女人，还能嫁的不错，原因很简单，靠手段啊。


    而陈妍希就是佼佼者。想想当初她和那个犯罪男星K间翻后，还能趁着他被抓时，在微博上蹭个热度一句话博好感，就知道陈妍希不skr简单人~所以拿下感情用事、耳根子软的陈晓，根本就是so
    easy的一件事。


    抓爷押注，只要陈妍希见好就收，那么陈晓真的就能和陈妍希一直过下去


    # “插足”成瘾？


    由于有着“女神光环”，所以陈妍希一来，就待遇颇高。不仅能有当年正当红的文章、刘诗诗，更有李连杰这样的国际巨星加持。虽然这部电影（不二神探）最终的票房不功不过，并不算大爆。可倒霉的是，这部并未让陈妍希再进一步的电影，却在上映后不到半年，男主角文章就被爆出了震惊众人的“周一见”事件。


    随着文章的好男人形象崩塌，神通广大的网友也开始了“大家来找茬”的趣味活动，纷纷八起了那些年跟文章合作过的女演员，还有谁可能跟他有“不当”关系。然后，倒霉的陈姑娘和文同学那张著名的“摸臀”照，就被扒出来了。


    虽说关于这件事，网友一直分成“摸了”和“没摸”两派，不能最终得到确切的答案。但陈妍希在明知道文章是有妇之夫的情况下，还这么不避嫌也是确实有问题的。虽然这件事在之后双方的辟谣澄清下，不了了之了。可紧接着被爆出“陈妍希要出演小龙女”的消息时，网上又双叒炸了锅。


    陈妍希的娃娃脸，演现代剧的话还是比较有优势的。可一旦涉及到古装，尤其是那些非常“显脸型”的发型时，效果就会非常惨烈。果然，定妆照一出，网友就纷纷直呼辣眼睛、接受不了。


    但彼时正是于妈最得意的时候，不仅放豪言表示“陈妍希就是我心目中的小龙女”，更称“定妆照不及正片的万分之一！”。结果，等正片出来以后大家才知道...这特喵的还不如p过的定妆照呢！！


    这部剧没能有多高的收视，反倒是个小筐包，哦不，小龙女的表情包成了那些年网友的快乐源泉。'
