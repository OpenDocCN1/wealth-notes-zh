    # 小生系列


    # 1、黄子韬


    在大家的惯性认知中，都认为在一个剧组里面，最有发言权的肯定非这部剧的导演莫属；而关注过扒爷的童鞋或许也能够知道，比导演还有实权的，是那些联系投资方的制片人。


    话是没错，但凡事可是有例外的。比如，演员是超一线红星，全剧组都指望着人家带票房、带投资的话，那肯定是非常有话语权了。所以在圈子里常流传着一句话：甭管一个明星在粉丝、媒体面前，有多“温顺”，但要
