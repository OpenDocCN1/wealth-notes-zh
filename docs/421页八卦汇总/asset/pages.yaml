  md: '山帽子叔在么~


    95年，英子跟帽子叔同台上了C晚，当时还懂得做小伏低的英子向来会溜须拍马，所以一见到帽子叔就开始攀关系。当时正是帽子叔野心勃勃招兵买马的时候，由于帽子叔涉及的舞台不过就是“春晚”那片天地，这能赚钱什么钱呢？


    毕竟都知道，像他们这样的“文艺工作者”可都是靠“跑外场”来捞金的。于是，英子便靠着自己那位高情商、有经纪头脑的姐姐，成功换取了帽子叔的青睐，就此形成了初期的“东北帮”一代核心骨干。之后还在帽子叔的牵线下，结识了“国脚”高峰谈起了恋爱。


    一个是新一代歌坛小天后，一个是足坛名将，一个是未婚生子，一个是孕期劈腿。这随便哪一条都是能燥热搜的新闻呢！~没错，如今很多人都以为，英子跟高峰是“婚姻”关系。其实这二位根本就没登记，说句难听的，英子那可是“"刚贴”。最终分手，也是实在忍受不了高峰的花心了。


    本着“谁掌控了话语权，谁就是胜利者”的原则，英子那时候没少在媒体面前 ansi高峰。导致高峰在多年之后结婚时，还要恨恨地强调“第一次结婚很开心啊！第一次结婚很幸福”来恶心英子呢。


