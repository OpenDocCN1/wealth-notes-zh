  md: '话说有个高磊鑫，之前一直混迹在圈子的边缘。有一次在聚会上，机缘巧合下让她认识了国内某个薛之谦。虽说当时薛之谦已经“过气”了，但对她来说也总比那些油腻的老男人强。于是高磊鑫就开始用尽各种手段，想要套牢这个薛之谦。可惜啊，这个薛之谦可是个“夜店小王子”！他对外的形象很纯情，私底下却是个不折不扣的“花心鬼”。圈子里的女明星他都暧昧交往过好几个，更不用说像高磊鑫这种“十八线”外围他都约过多少个了。


    不过，这个高磊鑫也是个有心计有手段的。她直接放了个大招：“我怀了你的孩子！你不娶我就告诉你的粉丝！”，薛之谦怂了，只好跟她结了婚。可婚后薛之谦才发现，高磊鑫原来根本没怀孕，气得他马上就提出了离婚。高磊鑫狮子大开口狂敲了一大笔钱一千万之后，便也答应离了。


    原本这事应该就此结束了，可谁知道，才刚一离婚，薛之谦就翻红了，而且是爆红。这下高磊鑫可后悔了，但是两人已经离婚了，而且薛之谦也有了新欢李雨桐了，这可怎么办呢？


