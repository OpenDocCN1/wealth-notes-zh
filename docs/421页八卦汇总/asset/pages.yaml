    夏雨和袁泉是一个学校滴，而且都属于那种还没出校门就先出名的类型。巧的是，两人都是靠电影火的。但袁泉能接到大导的戏，还能一下子拿奖，也是有所付出滴。话说这位大导当时去学校挑女演员，可是一下子就相中了幸运鹅袁泉呢。其实扒爷也不想说这里面有什么se交易，但谁让这位大导是圈里出了名的色呢~


    在袁泉之前，大导其实有一个多年的小情人C，那时候他的戏很多都给了C拍。只不过后来C遇见了C男，所以大导这才和小情人分开了。身边没了人，空虚寂寞冷的大导当时和袁泉，就一拍即合、各取所需啧~


    拍完电影后，袁泉毕竟还只是个大学生，所以还是得回学校。于是她在学校，就和同校的夏雨认识了，然后相恋了。后来两人就谈了很多年之所以能搞那么长的“恋情长跑”也多少因为他们拍戏而聚少离多。可就算不怎么常在一起，两个人还是会闹矛盾。因为别看两个人好像都很低调有素质，其实夏雨这个人很花心，袁泉则脾气无敌臭。


    可即便这样，两人也没有真正的分手，毕竟他们可是顶着“模范情侣、金童玉女”的称'
