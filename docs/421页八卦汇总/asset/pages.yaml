    大概是命不该绝，章子怡非常幸运地获得了，一个改变命运的绝好机会。多年以后，她也多次提起，当年的自己就是靠着这部作品有了翻身的机会的。（所以说，有很多时候圈子里的人说的话，都是有深意的。因为明明在外人看来真正让章子怡翻身的，是那部“好几代大师傅”；


    可章子怡却偏偏对这部并不算大热门的作品《最爱》，念念不忘、感恩戴德，这里面的原因要不是扒爷今天讲起，又有多少人会知道呢~）这部作品对于章子怡来说，不仅仅仅是“雪中送炭”，更让她因为这部作品而终于找到了“倒霉蛋”撒贝宁。


    原本章子怡是绝对看不上酒老师的，这点从她交往过的历任男票全都非富即贵就能看得出来。可对于当时的章子怡来说，酒老师却比世界上任何一个男人，都难得'
