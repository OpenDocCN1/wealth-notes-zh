  md: '齐版等作品。姨太很纳闷，明明是港姐出身，怎么来了内地接的戏都那么粗糙呢？看看《龙门镖局》里的她，真的是很尴了。


    来了内地，袁咏仪的资源是远不及当年，不仅拍的少，大制作就更少了。所以慢慢的袁咏仪也被大家有点忘记了。跟袁咏仪的黯淡相比，以前不出名的张智霖却开始一路直上。《谈判专家》就让人印象深刻。到了13年的《冲上云霄2》那是妥妥的吸了一大波粉啊！


    很多人竟然一得知他老婆是袁咏仪，还为此抱屈过，觉得袁咏仪配不上他。不过路人简直瞎操心，人家都已经在01年注册结婚不说，还在06年生下了儿子，小名魔童。两口子虽然有矛盾，比如张智霖爱赌球，比如袁咏仪产后更暴躁，夫妻吵架绝对不比普通人家少。但人是慢慢成长的，越大多越不爱揪着鸡毛蒜皮的事吵，所以磨合下来两人竟还过成了人人羡慕的恩爱夫妻。


    比如大家都知道，袁咏仪喜欢买包，还是奢侈品爱马仕。出街几乎全是爱马仕，对爱马仕简直就是死忠粉，可以说收礼只收爱马仕。因为她实在是太爱买了，于是张智霖都想对着天空说，别买了！


    嘴上这么说，该掏钱的还是会掏。姨太猜想，为什么出门逛街总是手牵手，是不是就是防着老婆冲过去买包？


    虽然老婆爱买包，其实老公也不省钱啊，除了赌球，张智霖还热爱买豪车。


    都是会花钱的主啊，反正人有钱，爱买啥也是个人自由。这么一看，倒是爱好灰常般配啊~


    这对看起来很宠的夫妻，15年参加了一档旅游综艺，于是变得更出名了。节目播完，可是圈粉无数，成了很多网友心中恩爱夫妻的代表之一。两人今年也已经结婚17年，那时还去马来西亚旅游庆祝了。


    所以怪不得那么多人羡慕，毕竟坚持这么久的婚姻也不容易。这么多年有矛盾有甜蜜，日子也是有滋有味啊。


    姨太说起来也很羡慕呢，主要是那些包，真的是剁手也买不起……


    # 28、伊能静


