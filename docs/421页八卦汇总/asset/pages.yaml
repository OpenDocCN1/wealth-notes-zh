  md: '回想2014年那会儿，高圆圆与赵又廷正式结婚后引得无数直男们声嘶力竭，纷纷不甘自己女神弟弟恋成功远嫁台湾。但自从赵又廷出演《三生三世十里桃花》后，演技口碑深受好评，人气也随之飙升，现在更多人又觉得男方配女方可惜了。


    不过不管怎样，虽然高圆圆的感情史确实“过于丰富”、各段恋情都速度飞快的“无缝衔接”，但毕竟如今的她，已跟赵又廷组建了家庭，实现了自己多年“恨嫁”的小心愿。至于那些“不堪”的过往，大家就让它们随时间消散好了。不论女神的人生多么“丰富精彩”，那都是“别人的”人生。


    看完这些过往黑料，想必小婊贝们对高圆圆又有了全新认识。虽然现在这位已经跟退圈没两样了，但想要彻底洗白自己可没那么容易哦~


    # 4、江一燕


    说起江一燕，无非会提到这几个词：“摄影”，“支教”，“小三”。首先得说，江一燕一些照片确实很够水准。即便算不上顶级，也能看出她在“摄影”上，的确下过很多功夫。但江小姐为了宣传自己的“文艺”素养，故意夸大“水平”的某些做法，就难免惹人非议了。


    比如之前各种吹捧的“江一燕获得美国国家地理摄影奖”，就被扒出，介只是美国的“国家地理杂志”，专为中国设立的一个奖项。“华夏典藏奖”？这么一个看起来略显“野鸡”的奖，在江女神的通稿里却被吹上了天？看来也是时候向各位展示一下，扒爷我低调多年的牛掀身份了。


    而说起江一燕的另一个“本职”身份，作为演员出道这么久的她，却一直到现在，都没有什么能让人记得住的作品。上一次江一燕让大家关注，还是她去年在《极限挑战》上，因为“娇嗔”被骂惨。节目里跟王迅组队的江一燕，因为全程黑脸+抱怨，结果被网友炮轰“势力眼”、嫌弃王迅“咖位低”。


    比如说，在下雨打伞的时候，王迅举着伞就会很绅士的把伞举在两人中间。而等伞到了江女神手里后，她就只顾着自己一个人打了。在她“花式甩脸王迅”的衬托下，就连同一期里，张歆艺被群嘲的“巨婴哭”，都顺眼了许多。


    当然了，这也不是“文艺女神”江小姐，第一次做这种“情商很low”的事情了。像评论里就有人提到，她把孙杨送给她的手表拿去拍卖这种“招黑”的行为。可能有人会辩解，说“既然别人送给了她了，那就是属于她的东西。她当然有权随意支配。”


    so？？？


    讲真，要是我送给朋友的礼物被他转手就拿去卖掉，肯定是分分钟要绝交的。因为这根本无关礼物的贵重，或者卖礼物要做的事情有多高尚。这代表的，是朋友之间的尊重。至于另外一些人反驳说的，“既然江一燕能卖，孙杨肯定知情并同意”的说法。


    贴上一位不知名网友的答案，扒爷给这位陈独秀童鞋手动点个赞！谁不成江女神“拿别人的礼物卖掉，再以自己的名义做慈善”酱婶的做法，是表现在现在的“文青青年”，都是如此的不在乎世俗的眼光，任性妄为、恣意洒脱？更何况，原本的江女神，压根就与“文艺”这个词不沾边。


    江一燕早在99年就以歌手的身份出道了，02年才开始接拍一些影视剧。直到09年，出道已10年却仍然“连二线都算不上”的江一燕，却接演了知名导演陆川的电影——《南京！南京！》。


    大家惊讶于她突如其来的好资源，还发现就在这一年，江一燕居然还成了国内知名蛋糕品牌“好利来”的形象代言人。当然，现在大家都知道这背后的原因了：“好利来”的老板，就是现在江一燕的“神秘男友”，罗红。


    两人结识，源自两人的“共同爱好”——摄影。但由于当时罗红“有妇之夫”的身份，俩人也只能偷偷摸摸地搞一搞“兴趣爱好”，不敢公开。别看现在到处宣扬自己“低调”，当年江一'
