- pgno: 400
  md: '而在所有禁忌中，最重要的一点，也是X老师今天要主要给大家讲的一点就是：在拍恐怖片的时候，不论是哪条禁忌、包括祭拜，必须要心怀诚意！绝对不能嬉笑打闹，更不能口头上开“好兄弟”的玩笑！


    不少演员就是因为刚了解拍恐怖片的规矩时，觉得都是胡扯而没那么有诚意，结果“中招”发生了灵yi事件。像是湾湾的“性感女神”舒淇小姐，当年在拍鬼片《见g2》的时候（说来这个也是很好笑，当时导演本来没打算让她来演的，结果听说是在看到了舒淇小姐不化妆的照片时，直接拍板定下来就是她了，因为她的素颜够吓人！），就经历了从“不信”到“完全信”的过程。


    由于是港产片，所以这部电影的尺度和氛围也是很大的，光是呆在剧组就能让人汗毛直立。舒淇小姐那时候也是年轻气盛，所以在拜的时候就没有怎么有诚意。结果说来也是奇怪，那天舒淇小姐在拍一场哭戏的时候，连拍了7条居然一毛一样！舒淇小姐明明用了不同的表情和情绪，结果看到这个结果她都吓傻了。赶紧合十双手边拜边道歉，又让助理去买了贡品回来，这才回复正常。


    经历过这件事的舒淇小姐心理阴影也是很大，杀青后都很久不敢坐电梯、不敢一个人回家。连首映礼都沒敢看完电影，就一个人先溜了~从那之后，她也是能不接恐怖片就不接，看来是真的吓坏了。


    今天X老师要给大家讲的，是某影视基地最近才发生过的一起灵yi事件。不过由于剧组方面保密，所以这件事除了影视基地这边的内部人，是没有多少人知道的。


    “胡须小哥”是“北姐”工作室最近力捧的新人，正在影视基地拍摄新剧。可能是“初生牛犊不怕虎”，胡须小哥对于这些怪|乱shen的东西是真的不信。或许他这种态度在粉丝看来，显得很man、很霸气；可在剧组工作人员看来，这就是件很头疼的事情了。可因为人家背景硬，所以导演也只是敢怒不敢言、不敢往深了说。这就导致了，胡须小哥最近终于为自己的“轻浮态度”付出了惨重代价。


    有一天，剧组在拍gui市某场夜戏的时候，由于执行导员和武术指导都是香港来的，特别重视开机前的祭祀问题，所以准备的时间也是很久很复杂的。胡须小哥等的时间久了，难免有点不耐烦，所以轮到自己去拜的时候，就开始“揶揄色搞事情:故意表现出自己不把这个当回事，还特意跟戏里饰演gui的演员在“拜拜”的时候搭话聊天、有说有笑（那个女演员毕竟是个小透明，所以虽然知道规矩，也碍于身份不敢不回应~）。


    那两位香港来的指导，在跟导演抗议无果后（导演也不敢惹啊~），就在一边冷眼看着胡须小哥的行为，脸上都是一副：后生，有你后悔的时候！


    拜完之后，剧组就按部就班地开拍了。可以往明明能很顺利的一些普通戏，在那天偏偏就是很奇怪地处处都不顺。比如明明一个地方的灯光布置好了，结果在拍完之后却发现，镜头里明明应该有光的地方却莫名其妙出现了一大块阴影；要么就是道具放好的位置，莫名其妙地被不知道谁给挪动了。原本应该拍两三个小时的戏，生生就这样折腾到了后半夜。


    结果，等到终于要拍到男主角跟gui同框的那场戏时，副导演忽然发现，之前一直在角落里等戏的那位扮gui的特约演员居然不见了！问了旁边的人，大家都不知道那个人到底去哪里了！打电话也均是处于无法接通的状态，微信发出去也没有回应。


    这下剧组的人都慌了，戏也不拍了。毕竟，虽然说这个演员只是一个普通的影视基地的特约，不是<|message|>什么大牌。但即使再怎么地位，那也是个大活人、是个生命啊！这要是丢在这偌大的影视基地，那怎么交代啊！


    于是，所有工作人员就都被发动了去找这个演员。胡须小哥到这一刻，也终于意识到不妙了，便也让自己的工作人员去帮着一起找。就这样，当晚剧组所有人都丢下自己的工作去找人，可这事也是很诡异，那么多人找了半宿愣是怎么都找不到！？'
