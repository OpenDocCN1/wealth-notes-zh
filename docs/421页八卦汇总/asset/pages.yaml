  md: '张天爱自身的性格其实跟她的外表人设差别很大，不能公布正牌女友关系的她显得十分委屈，一直在男方身边可怜兮兮的引得杨洋也很内疚。为了弥补女友杨洋就想办法帮她拉资源，男方定了新戏也不忘推自家女友，最后他和张天爱家公司出面共同帮张天爱从别人手中抢来了角色。


