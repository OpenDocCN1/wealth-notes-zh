  md: '另外他也特别喜欢擅自改剧本，这点弄得编剧导演很烦，可他自己不知道。而且别看他名气不算大，脾气可不小，不顺心了罢演也干过（剧组里他算大腕的前提下）。啊，对了还有人设这事，张译是从几部军旅题材的电视剧里火出来的，他自身也有相关经历，自然大家都以为他很喜欢这一块。但其实他不是铁杆军迷，戏只是戏而已，宝贝们不要入戏太深哈。


