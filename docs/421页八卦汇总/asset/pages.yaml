    Quarts 的一批了。因为这一次刘亦菲的目标，很显然就是冲着剧组去的了。原因也是在那段时间内，网上突然流传出了许多“刘亦菲在剧组耍大牌”的爆料。爆料人这绘声绘色的描述，简直就跟亲临现场一样。随着事态愈演愈烈，剧组也不得不硬着头皮发出声明。之后更是派出剧组的工作人员，力证刘亦菲清白。但眼看着刘亦菲跟剧组闹了两次不愉快，再怎么澄清，说她跟剧组“和谐友爱”，恐怕也是没人信的了。  而刘亦菲这场“取关”的闹剧，被爆出的频率却高成“月经帖”了，也难怪惹来了许多路人的腻烦。随着大家对于“现在刘亦菲，怎么不像过去那么低调了”的态度，提出疑问。坊间关于刘亦菲的“陈年旧料”，也被一些有心人给翻了出来。很多人对刘亦菲的某些八卦有所耳闻，大概还要追溯到前年在某节目上，卓伟说的一席话。  在“狗仔之王”还没被全网封杀的16年，卓伟在做某访谈时，曾公开声称“自己很同情刘亦菲”。此话一出，网上随即便涌现出了许多“瘦马”论。（不懂的童鞋可以自行百度，为免惹麻烦，扒爷就不明说了）都知道当年刘亦菲在出道伊始，便能获得跟陈坤合作这样的好资源，全倚仗着她的教父——陈金飞。  提到陈金飞，其实现很多网友都把他的能力“妖魔化”了。而之所以会出现“陈金飞能一手遮天”这样的夸大言辞，也是由于他当年在“钓鱼台”给刘亦菲办的那场，轰动全国的“成人礼”。  “钓鱼台国宾馆”作为我们国家如此敏感、神圣的地方，绝不是有钱就能去得了的。因此就总有很多人跑出来说，“陈金飞给刘亦菲拿了多少资源”，或是“陈金飞帮刘亦菲有了今天”这些言论。  虽然的确得承认，在刘亦菲的演艺事业上，陈金飞没少出力。但当年陈金飞作为一个海归商人，仅靠着金钱就在娱乐圈呼风唤雨，也没那么简单。《金粉世家》作为刘亦菲的处女作，虽然背后的确是靠着陈金飞花了大价钱搞到手的。但之后的一系列作品，可不是他一个人的功劳。  扒爷在之前的文章里就说过，在03年之后，华谊已经在内地影视行业中迅速崛起，并且形成了一家独大的霸主地位。而陈金飞当年就正是靠着跟华谊联手，才让刘亦菲得以爆红的。  都知道父母离婚后，刘亦菲就随妈妈刘晓莉姓“刘”了。但少有人知道的是，她的亲生爸爸安少康，不但是一位大才子，还是满族人。（娱乐圈的满族人：英达、刘亦菲、安少康、那英、胡军、马景涛、富大龙、惠英红、黄海波、金巧巧、齐秦、齐豫、赵忠祥、林依轮、王中军王中磊、汪小菲、佟大为、文章、李宗翰、王丽坤、赵奕欢、阎清子、朗朗、吴京等）而据说陈金飞当年就是靠着刘亦菲“满人血统”这件事，才能成功把她忿悠进了王中磊的京圈的。  再说张纪中，别看张大爷这几年轻得没几个年轻人认识了。搁在当年，华谊虽然在电影上有冯小刚。但在电视剧方面，张纪中可是绝对的主心骨。而刘亦菲能在刚出道就一下拿到两部张纪中的作品，没有华谊的力挺是根本不可能的事情。当然也更不可能是刘亦菲早年采访中说的，“金庸强烈推荐她出演”的原因了。这个说法不但后来被金庸老爷子亲自否认打脸，当年也是刘亦菲被群嘲“撒谎精”的黑点之一。  之后陈金飞又携手华谊，拿到了《功夫之王》这样的好莱坞大制作，连李冰冰这个“华谊一姐”，都要给刘亦菲做配。然而，这部剧给刘亦菲带来了多大的荣耀，就为她之后的“被封杀”，埋下了多大的祸根。
