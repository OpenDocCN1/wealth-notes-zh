    # 1、周润发


    如今大家在网上搜“发哥不要孩子”的原因，大多都是说他因为当年刚结婚时，女儿不幸夭折，他不忍心再让妻子受苦，所以才不要孩子的。但实际上，坊间还流传着另一个版本：据说当年发哥痛失爱女后，曾经去泰国拜见了白龙王，询问自己的子女缘分。结果白龙王告诉发哥，他现在的名气和身家到了这种高度，已经是透支了祖先留下的福荫了。这些超乎常人的名利和财富，上天不允许他带走或传承下去，所以女儿的命才会“被收走”。如果发哥执意要孩子，那么很可能会连累到他自己。轻则家财尽散，重则性命不保。


    经过白龙王的指点，发哥这才彻大悟，从此一心向善，不仅投身于公益事业，更是立下了遗嘱：在自己去世后会把全部身家，捐回给社会。当然了，不论发哥是出于什么原因做善事，他的行为都是毫无疑问值得敬佩的。


