    # 26、阿SA蔡卓妍


    在娱乐圈如果身后有好的公关团队，就算是黑的也能洗成白的，她/他们的经历能写出无数本撕逼小说。今天扒爷要说的主公是阿SA。


    阿SA正值青春18于香港出道，刚刚高中毕业的年纪就与“钟欣桐”以侧手翻特技出名~为了红听从经纪人安排的小姑娘，除了要学习马戏团杂糅舞艺还要陪酒，被高层吃吃豆腐也都是常见之事。被带着去见见客户，赴老板的约，陪富豪游玩，与圈内人士约会、陪酒，参加情色派对等等活动对阿SA来说都属于搓洽工作的一部分。（海天盛筵那种在她眼里也很正常哟~）


    人乖嘴甜又听话的阿SA在这些方面都做得很好了，所以很快就得到高层们的喜爱，自家经纪人“霍希汉”看到这情况也非常高兴。她对阿SA越来越偏爱，而相反面容姣好的钟欣桐却多年来一直都是傍白甜状态，经常气的霍希汉不想再管她。


    然后…钟欣桐的人生中发生了巨大的改变，因为巨大舆论导致原本被圈内十分看好的两人前途一并受到了极大伤害。在大家正对要玩完的时候，阿SA想出了一个主意，她对霍希汉表示既然两人都有可能保不住，那就先单保一个继续活跃在圈内。


    既然是从高层重视的人口中提出 tension，当然很快就实现了！阿SA如愿以偿的脱离了钟欣桐的连累，自己开始了独行侠的圈内事业，钟欣桐却彻底没法再继续工作，只能继续沉寂着。


    当事情过去一阵子后，两人时不时会接受一些采访，那时阿SA却开始害怕钟欣桐翻身复出成功收获大批同情心及人气超过自己。为了把这个可能扼杀在摇篮里，阿SA只要抓住机会就会在记者面前重复多次提起钟欣桐心中的伤痛，让大家又再度想起舆论那时的丑闻。


