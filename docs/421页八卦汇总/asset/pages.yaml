  md: '一两全其美的方法。So~聪明的 小姨 贝们再联系前面扒爷提的一连串“好事儿”的线索， 是不是突然get到杨紫的作用了？


    杨子借此机会美其名曰培养新人实际背后金屋藏娇，那一年黄圣依跟杨子的关系逐渐疏远了许多。杨紫就这么傻傻的，被背后这股作用力推到了风口浪尖，正式成为黄圣依眼里那个即将被箭射穿的靶子。


    比杨紫大很多的黄圣依一边唯 奔杨子泡妞没底线，一边不肯放手这个金主。（毕竟苦 熟了多年，她可是带着不成功便成仁 坚强意志啊~）被气炸了的黄圣依并没有因怒气而丧失理智，她立刻盘算了一个泼脏水大计，准备往死里整杨紫。


    扒爷现在看都觉得这计划真是牛逼，不愧是秃总身边走到最后的女人啊！！事实证明这波6到极致的营销确实达到了黄圣依理想效果，年纪轻轻的杨紫被刺激到亲自与骂她的网友们解绑丑闻，但却无济于事。受到舆论影响的她，口碑与人气一落千丈，再加上杨子公司的不作为模式让她失去了大把资源，签约了一年不到只拍了一部作品。


    杨紫被流言蜚语冲击的遍体鳞伤，一直陪在她身边的父母也开始对杨子的目的产生了质疑，两个长辈这才意识到自家女儿应该是被骗了。为了尽快让杨紫脱离这个是非之地，他们立刻去跟杨子谈解约问题，其实那个时间杨紫对杨子已经没有什么利用价值了，所以对于杨紫父母的决定他二话不说就点头了。至此杨紫才算彻底解脱，虽然无法及时得到清白但也算是识清圈内的复杂了。


    世界上没有不透风的墙，杨子那边一直瞒着小四 颖儿因行为太不收敛而最终被黄圣依抓住，随后痛下狠手解决掉了！杨紫虽然后期经历了很长时间的沉寂期，但最终也靠自己的实力打了个漂亮的翻身仗，这也算是好人有好报吧~


    杨紫是个演员，演技虽然没有到十分优秀的程度，但还是被大部分人认可的。她本身戏路也比较广，可以演偶像剧、可以演正剧，也有自己的代表作。扒爷看了下作品，杨紫确实“艳福不浅”。合作的男主角都是各式各样的大师哥。但这也有个坏处，就是定力不深的话，很容易就会被迷上。毕竟几个月都对着大师哥，还演着爱情故事，想要不入戏也不容易。这也是圈里头因戏结缘的情侣夫妻
    堪么多的原因之一。


    杨紫也难逃这个魔咒，因为长沙男主角“霍建华”确实是长得不错。她发现自己喜欢上霍建华后，也分不清是入戏太深，还是真的喜欢。所以杨紫就想等到结束后再看情况。没想到一直到杀青，她还是很喜欢他！


    于是杨紫就鼓起勇气向霍建华表白了。但霍建华非常冷静，拒绝了她。大概就是说，演戏是演戏，生活是生活，不要混为一谈。杨紫知道霍建华对她没意思，可还是很想知道拒绝的原因。于是她问霍建华：是不是自己再好看点，漂亮点，你就会喜欢上我？


    杨紫当时也才二十出头的年纪，哪里能看透三十多岁的霍建华呢。霍建华之所以对杨紫不来电，一是因为她年纪小，一直把她当妹妹看。二是，霍建华的性格和外表、人设差别有些大，感情这块其实玩的很开。


    当然不想沾惹上这种乖乖女，怕被她缠住。所以为了快刀斩乱麻，霍建华对于杨紫的提问并没有再回复。但杨紫却有了心结，而且她一直对自己外貌不满意。于是.che在拍戏结束后，就去偷偷整容了。


    外人不知道个中缘由，以为杨紫是为了打开戏路才去整的容。看到这，有人可能会说杨紫为了一个不爱她的人去整容，显得很卑微。但其实很多女人都会有这种想法，清纯的爽妹子也不曾自卑过吗。说到底当年的杨紫也只是一个为情所困、为自己所困的小女生而已。


