  md: '其实陈羽凡的出事，跟他老婆有一定关系，他的八字里有“比劫为忌”，有这样命格的人很自大，要收敛自己的脾气，否则婚姻容易出现不幸，大概就是.容易和人发生情感纠纷。所以陈羽凡的前女友是背弃他而去的，被人拐走了。他的老婆又是被人勾了，后来也频繁和人有暧昧，最后又被人拍到给他戴绿帽子的。


    尤其是他老婆被拍到出轨的时候，正好走的是“癸未大运”，本来癸未大运就对夫妻关系有负面影响，他自己又是个人“比劫为忌”的运势，自然是要出问题的。更惨的是，他的“比劫”又在“癸未大运”的这一年遇到了白百何的“亥水”，结果被绿又损财，背字走到了极致了。


    除了八字相克之外，他当年要是听老婆劝，估计也能吃饱饭~他老婆一心想红，跟好哥们文章请教了如何走偏门，想找老公陈羽凡拿个主意的时候，老公的“比劫”发作，特别清高，就是看不起他们，连听都不想听..


    当年白百何也劝过他去看看八字啊，就算是信不请符，也可以了解一下嘛。陈羽凡特别傲气，死活就是不肯去。如果他早些年去看了，知道自己是“比劫”命运，又和妻星“亥水”巧遇，随便找个大师化解一下，也就没后面的事了...


    继续说陈羽凡的悲惨遭遇哈，最近陈羽凡的事大家都知道的，他被带走了。扒爷前面也说了，他是丢妻破财的八字运，一辈子里有无数次机会可以去看看，偏他就是不信，破财就应验到最近了。


    陈羽凡在他老婆出事的时候，本来说是要退了的，奈何不住胡海泉劝他啊，退什么呢，劈够了么，老婆出事算什么，钱才是重要的呀哥哥~然后陈羽凡就觉得，好像是那么一回事，就果断备出来捞钱。结果呢，运气不好，还不自律，就栽到了群众的手里面...对，还被胡海泉给闹着说了一顿...其实半斤八两，借着辛苦洗白自己吧~


    其实在早些年，他的“癸未大运”就有征兆了，只不过到出事这两年比比较背，全部都是忌神感应，又在戊辰年冲了八字，最后闹出这些事。看他的命，到了今年就应该是消停呆着，本也就没有什么大事业巅峰，当年的好运气也不复存在。可他的那个“比劫”命让他不能服输，越求财越丢财，和胡海泉投资进去准备钱滚钱的那些成本，也毁了，自己的事业也毁了，未来不会有大发展了。如果他能知足，从现在开始就放下所有的功利心，攀比心，他未来还是能过得顺风顺水，不然的话，他后面还有两个忌神大运在等着他。


    # 10.1 白百何&陈羽凡


    俗话说得好，不是一家人不进一家门，一般娱乐圈内组建家庭的大多数都存在着利益牵扯和一些不干净的事儿。有名的明星夫妻表面恩爱不已，实际早已分崩离析，毫无感情可言。今天扒爷要说的两位故事主角人公就是这样的人，这对夫妻就他们“陈羽凡”和“白百何”吧！


