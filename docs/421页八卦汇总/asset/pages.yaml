  md: '俗话说的话，“天道好轮回”。这两位在辜负了曾哲贞后，应该不会有什么发展。

    可出人意料的是，张庭在内地爆红不说，林瑞阳也适时出来跟张庭一起表演“求婚”等痴情戏码。最后两人的那些黑料不但全都洗白了，还圈了不少忠实粉丝。甚至直到现在，也仍有一些死忠粉坚决表示tiali张庭不是小三。

    至于这段感情到底是不是插足，虽然林瑞阳之后有出来澄清，但疑点也是不要太多滴~20年没见过面没说过话，新闻爆出是16年，所以98年才离婚的林瑞阳，在96年就不跟前妻见面了？98年7月8号离婚，其实在71月1号就被爆出了绯闻。so...没出轨？

    “小三上位”实锤到这种程度，这对夫妇都能洗白成“真爱”：明明是在台湾被骂的混不下去才来内地发展的，却洗成“林瑞阳追求真爱为张庭放弃演艺事业？”“如此”颠倒黑白”的洗白功力，难怪这对夫妇，在之后也能把那么多“代理”全部洗脑了！

    只可惜，粉(代)丝(理)可以跟网友抬杠，却扛不过事实。接下来，一起来看一段“巴啦啦反转打脸合集”：

    我！林瑞阳！此生不会再娶！

    我！林瑞阳！天生脾气暴不好惹，谁敢再说我“求婚八次”才娶回来的媳妇是小三，我就起诉谁！

    我！张庭！这辈子绝对不会嫁给林瑞阳！

    我！张庭！结完婚腿脚就不利索！上厕所必须背着上！

    我！林瑞阳！直男一个！不会说情话！

    巴...

    巴啦啦啦泥煤啊！

    不会说情话？我只想替“不会说情话，只会秀恩爱”的林瑞阳问一句：请问李响此时的心理阴面积是多少？

    就是这样一对言而无信的夫妻，他们推出的商品居然真有人敢买？

    ok，我知道可能会有粉丝说：“感情”不上升“事业”！就算张庭和林瑞阳有插足、劈腿感情方面的黑历史，也不能代表他们的人品和商品有问题。那么，坑业主的买楼钱、拖欠工程款、违法解雇员工，这些算得上商业污点了么？

    要知道，之后公司破产、要自己“跳艳舞”卖微商产品的林瑞阳，在当时都穷困落魄到，需要靠着大肚子的老婆复出拍戏养家地步了。结果做了微商没两年，夫妻俩就摇身一变成了百亿富翁了。片酬动辄上千万的明星，都能不顾粉丝偏见，跑来给微商站台，张庭不属于拍戏赚片酬，心甘情愿搞这些，真的有人会觉得价货成本高、利润低？

    所谓的“活酵母”，在20年前就是电视购物产品（你懂的），在张庭林瑞阳拉来了一众明星大腕为其“镀金”后，就成了如今的庭秘密。

    ▲唯一一个有美容功效的谷胱甘肽（美白针主要成分）外用还是无效的

    当成千万上万个“代理”心甘情愿自掏腰包，“爱的供养”这对夫妇，林瑞阳、张庭能成为“豪门”的答案，已经不言而喻了。

    扒爷也承认，张庭跟林瑞阳是真爱不假。只是，当这份“爱”成了圈钱、坑人的遮羞布，就已经失去了“爱”原本的美好。那些满怀“成功梦”可怜人，被成功洗脑后用双手捧上自己的血汗钱，最终却成了装B犯炫富的资本。


    # 12、苗圃


    苗圃这人出道可以说是一帆风顺，签了大导后，戏路更宽了，而且苗圃还被夸演技派。其实这也是木有办法，毕竟苗圃想当花瓶或者流量，自身条件还差点。但不适合偶像剧，还可以走主流路线，所以成绩也还不错。

    然而看似一心拍戏，很老实的苗圃，感情生活却有些不光彩。因为苗圃也是个小三'
