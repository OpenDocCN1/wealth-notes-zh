  md: '对待柴格，何老师也是真的宠爱。不仅把自己的重要作品给柴格当男主，还没少在节日期间带柴格一起出国游玩，其中就包括以“小宝贝”和“异性变同性”而闻名的一一南洋某国。


    事实上，有不少人应该听说过南洋某国的某个“节日派对”。

    当年王凯就因为跟这个派对沾染上，而被爆出了取向有问题。

