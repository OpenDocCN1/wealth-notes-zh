  md: '这里要说明一个问题：被小宝贝纠缠上的人，会有两种情况：一种是“迅速见效”的，即几个月之间就让一个人从疯魔，变成自sha（参见之前扒爷说过的那位女星陈宝莲）；另一种则是“缓慢渗透”的，即或许会持续很久，让人在痛苦与折磨中，形容枯槁、三魂七魄都被侵蚀。这类人的特征，多半是没有精神、面色惨白无血色等等。

