  md: '这里涉及到一个小情况：真正供养小宝贝的饲主，是绝对可以跟小宝贝“心灵沟通”的。有的是在梦里，有的甚至在平时也能“听到”小宝贝偶尔跟自己说话。结果等杨幂把小宝贝请回来之后，按照仪式（每次回炉后都要重新结契约）做完一切程序之后，却打从心底地发现并不对头。不仅感受不到小宝贝对自己像妈妈一样的那份有爱的气场，反而心头总有一种不安的感觉。


    杨幂也不知道为何以前活泼可爱的小宝贝，现在居然每次在梦里都呼喊自己饿。不得已的杨幂只好想要求联系到HK的中间人，想搞清楚到底是怎么一回事。结果一联系才知道，这个人已经去国外了。更惨的是，就连那位南洋的师傅，杨幂也联系不上了。


    这下慌了神的杨幂，虽然还是不明就里，但还是吩咐连夜跑去了四川某佛教名山，去找自己的师父。关注杨幂的宝贝可能知道，杨幂一直就是个迷信之人，不仅早早就拜入了佛门下，还有自己的“法号”。虽然她并没有诚心诚意地相信过（真信的话她哪还会去请小宝贝那种偏门呢？），但那几年也是没少为庙里供奉香火钱的。可大家也知道，请神容易送神难，小宝贝除了自己的“制作者”能够解决以外，其他人最多也只能是将其镇压。


    要不怎么说杨幂心狠手辣呢，别看小宝贝跟她做了那么久的母子，帮她转了不少的好运；可真的听到师父说小宝贝恐怕会危害到自己的时候，讲究“普度众生”的师父根本就不能让杨幂心安。她要的，是彻底让小宝贝在这个世界上灰！飞！烟！灭！


    可那位师父一个是法力并没有那么高（那种香火旺盛的地方，难免会沦为商业化的旅游圣地），一个也是出于人道并不想斩草除根。


    焦虑的杨幂这下可慌了神了，不仅整天精神状况奇差，休息不好连带着脸都垮了不少。而眼看着就到了跟范冰冰一起宣传小矮人郭敬明导演作品的时刻了，范冰冰见到杨幂的状况，在再三询问下，杨幂才终于道出了实情。


    范冰冰倒也不算坏，就把周迅是如何找到西域高人化解了小宝贝的纠缠以及把杨幂的小宝贝重伤的情况都告诉了杨幂。杨幂自然是不敢去找周迅和厂花陈坤的那位高人的，但直到西域高僧有办法的她，还是拖关系联系上了一位之前有过一面之缘的“某高僧的老婆”—“刨冰姐”。刨冰姐碍于情面，加上杨幂“诚意”十足，况且帮杨幂化解厄运也算是行善事，这样，杨幂才终于得以保全了自己，让小宝贝再不存于这个世界。


    可这样做的结果呢？杨幂就真的高枕无忧了吗？


    要知道，扒爷一直强调，世间万物都是因果循环一切都有定数。斩草除根的杨幂虽然没有了小宝贝的纠缠，但也并没有得到什么好下场。不仅刚刚处理完小宝贝，就被爆出了早被她“偷天换日”的原版“不雅视频”；之后她更是像精神错乱一般，做（打）错（手）事（ji）败光仅存的路人好感。


    当终于发生了那场跟章子怡当年的丑事如出一辙的事（zha）件（juan）时，杨幂的好运也仿佛消耗殆尽一般。可怜又可恨的杨幂，还单纯地以为自己是因为残害了小宝贝所以遭到了报应呢~殊不知，正在背后的那双看不见的双手，才是让这一切爆发的根源！


    究竟，是谁在暗中伺机打压杨幂？又是使用了什么样的xie术来整杨幂的呢？倪妮篇章里你会知道。


    # 3、1杨幂'
