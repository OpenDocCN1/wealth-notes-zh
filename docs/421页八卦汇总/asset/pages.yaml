    哦！这么土的人居然跟她合作真是丢人啦！”还趁着“服务器故障”，大肆造谣赵丽颖的微博被公司拉黑了！赵丽颖是不是被嫌弃了？”的消息！要不是有黄斌撑腰，赵丽颖当时怕剧挺不住了！


