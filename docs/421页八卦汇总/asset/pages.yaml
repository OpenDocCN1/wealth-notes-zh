  md: '至于接下来的剧情，就是“土豪与女明星”的18禁小故事了。章子怡跟暴发户shui了几次之后才知道，原来暴发户早跟范冰冰在一起了。但直到这时章子怡还被蒙在鼓里呢，居然想跟范冰冰一较高下，打算独占暴发户。所以，章子怡才没少在电影上映期间，明里暗里地打压范冰冰。


    范冰冰是什么感想呢？看她对这件事情有多“无所谓”就知道，她早就不成竹在胸了：师姐啊，你可是睡了我的男人啊，你还要横刀夺爱？那我就等着看，你会怎么死吧！


    果然，不到半年，章子怡就被爆出了“三重门”事件（ Notifications 门许捐捐拖照门）。三连击的“重锤”，锤锤致命！整整缓了四年，章子怡才缓过了这口劲儿。当然，在自己倒下的那一刻，章子怡也终于知道真相了。章子怡告诉自己：早晚有一天，她会让范冰冰也尝一尝，同样的滋味！


    话说当时章子怡出事后，第一时间就去了湾湾，去找了当年为自己引荐的陈道长。可扒爷也说过了，陈道长跟为范冰冰引荐的马娘娘比起来，就是凡人与仙人的区别。所以陈道长面对章子怡的状况，也是无能为力的。但就像前面说的：凡事有利也有弊。陈道长虽然没能搭救章子怡，却为章子怡推荐了另一位高人。


    这位高人，可不是谁都能见到的。若不是有陈道长的关系，即使是许多同行的修道之人，都未必能知道这位高人的存在。大家还记得扒爷在之前提到的“温莎大厦狐妖事件”吧？当时温莎大厦请了一位法师前往去捉hu妖，可道长的法力并不足以将hu妖全部收服，只能短暂镇压。最后，是hu仙娘娘托梦给一位一直在台湾修行的“胡门弟子”——黄神婆，并由她亲自到香港，把温莎大厦的几位胡仙带去阳明山放生的。这个黄神婆，就是指点了章子怡的高人！


    黄神婆虽然不及马娘娘那样，是“胡仙转世”；但她却也比寻常的胡门弟子要高出几个等级。因为她自小就是胡仙选中的“媒介”，也就是我们俗称的——“灵媒”。每逢胡仙有事要传达或是需要亲自处理的时候，就会“通过她”来到人间。（化为人的狐一般有四姓：康胡黄白，按照修炼年数不同来改变姓氏，白姓等级最高）


    小时候的黄神婆，就是她家那一带的“名人”。几次被“附体”的经历，在外人看来就如同“起死回生”一样。早期家里人还不知道内情时，几次都以为她死了，甚至还去医院开了死亡证明。结果等到她还阳之后…（请自行想象周围人“作shi”或“借shi还魂”的情景），就有了那些新闻报道里的“借尸还魂”啥～当年她奉命去香港，用玉器带回几位胡仙并放生到阳明山后，有不少人慕名而来，求她帮忙拜入胡仙门下。不堪打扰的黄神婆，不久就搬去了阳明山隐居了。只有像陈道长这样的人，才知道她的下落。


    黄神婆告诉章子怡，只有国内某个“道家名山”的李道长才能帮她。章子怡刚要道谢，黄神婆却接着说了一个让她极为恐惧的条件。胡仙知道章子怡现在在寻出路自保，但胡门规矩不能违背，所以胡仙绝不允许章子怡“活着”见到李大师——这是其一；再就是，章子怡并不是自己去就可以解决的。她必须按黄神婆说的，找一位有特殊命格的异性同去，李道长才能帮她化解。黄神婆给了章子怡一道保命符，可以帮她抵挡一阵、拖延时间。但最后能不能找到符合条件的入陪她去，就要看章子怡的造化了。


    说到这，估计大家也都猜到了。没错，这个“倒霉蛋”，就是wuli“酒老师”。两人在12年年初去的时候，还非常不巧地被路人遇见了。


    那么，章子怡究竟有没有成功化解呢？要是成功化解了，章子怡为什么在之后又带着酒老师，去了“盛产小gui”的东南亚某国呢？更恐怖的是，两人在某国回来后没多久就分手了，为什么分手后娘娘便开始好转、而酒老师却沉寂很久？李道长又有没有解决掉周迅身上的小宝贝呢？谨慎、心细的杨幂，又是破了什么规矩谴小gui反噬的呢？


    上篇说到，章子怡在“三重门”事件爆发后，便火速赶去了台湾，并经由陈道长的引荐，得到了黄神婆的指点。黄神婆给了章子怡一个保命符，以便让她寻到一位“特殊命格”的异性，一同去国内某座道教名山去寻那位李道长来帮她化解。'
