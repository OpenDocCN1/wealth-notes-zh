  md: '高云翔一出事，关于董璇夫妻“共有金主”的谣言又被翻了出来。都知道扒爷我一向讨厌“跟风黑”。那些根本不知道“金主”是谁、看到别人说就假装知道的人也是有毒。其实网上从来就没有一条新闻，明确说出过“金主”身份。但眼看大家都好奇真相，扒爷今天只好亲自出手扒瓜唻。


