  md: '吴睿轩从小学习古典钢琴、小提琴及古典作曲，毕业于伯克利大学。早年间还和十岁的欧阳娜娜合作过四手联弹~那时候吴宗宪还在接受采访时开笑道：“我儿子从小就跟欧阳娜娜玩在一起，以前两家人也住得近，她都来我们家一起练琴。想不到娜娜长大那么漂亮，儿子以前怎么没开把呢？”


