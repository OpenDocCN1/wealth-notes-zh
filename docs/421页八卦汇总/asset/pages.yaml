  md: '以到头来，巨额财产竟然没有落到头上，怪不得很多人都说李嘉欣当年辛辛苦苦求上位，却竹篮打水一场空。毕竟200万对于普通人来说，是不小的一笔钱。但对于开销大的富豪家庭，这点钱就不够看了。


    独子竟还继承遗产，可见父亲是有多怕他承担不起，毕竟许晋亨可是有名的大废柴。

    比起白手起家一手做大的 人来说，少了些冷酷与精明。但也只有这样，李嘉欣才能靠着手段拿下他，所以今天姨太就来说说这位美貌港星的情史与上位史。


    李嘉欣打小就是个美人，中葡混血让她五官显得更加精致洋气。憨憨年轻时候的照片，简直是无论哪个年代都觉得美。有一副好皮囊的李嘉欣，哭都哭得这么好看。年轻时她是越长越美，经常在路上被星探拦住。所以她18岁去竞选香港小姐，也自然靠着不俗的美貌当选了冠军。那时候她也顺利进入娱乐圈，但也是因为这样，她工作强度大，又一脚踏进了名利场，所以和当时的男友倪震分歧越来越大，最后分手了。


    倪震就是那个后来娶了周慧敏的男人。


    后来入了圈，公司非常看好她，很多大制作电影都给了李嘉欣。虽然奖项没拿几个，但李嘉欣的名气越来越大。可李嘉欣的心思并不在演戏上，事业异得再红火，也没有嫁入豪门来得爽啊！那时候很多豪门都喜欢跟港星谈恋爱，或者说包养。李嘉欣就和有名的富商刘銮雄在一起了。


    相信比较爱看香港圈故事的粉丝一定对刘銮雄很熟悉，毕竟他接触过的美人很多，比如关之琳、洪欣、蔡少芬等等。这里面他也很宠李嘉欣，送房子送珠宝送好东西，对她还特别上心。李嘉欣说想学点东西，他就送李嘉欣出去学习。


    都是做小三，蔡少芬是为母还债，但李嘉欣是想踢走正房自己上位，所以刘銮雄正房宝咏琴灰常讨厌她。因为李嘉欣还打电话来骚扰过她。作为小三李嘉欣还打电话质问刘銮雄，为什么对小四小五那么好！语气里不少脏话，可见是气急了，生怕自己地位没了一样。


    闹吧，闹到最后原配还真的和刘銮雄离婚了。但离婚又不代表李嘉欣能上位，所以李嘉欣也和刘銮雄分开了。


    以为离开了刘銮雄会消停点，但李嘉欣真的是游走在各式有钱人、名人之间。比如她和黎明，两人是同一公司还共用一个经纪人，所以走的很近。当年之所以认识还是因为王祖贤要给黎明拍个MV但没时间，于是请李嘉欣帮忙。


