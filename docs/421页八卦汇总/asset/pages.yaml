- pgno: 405
  md: "从1985年的《僵尸先生》到1995年的《僵尸道长》，在这十年间里只要你有租录像带或者光碟片的时光，就应该记得当时的架子上有一半以上的空间都是留给僵尸喜剧片的。当时的扒爷和姨太没少被片中的青面獠牙吓到……\n\
    \n有兴趣的小姨贝们可以回去看看，大家看的时候应该都会爱上剧情中一边怕一边又想笑的刺激感。对于喜欢僵尸片的影迷来说，片中的男主林正英大家应该很熟悉吧？\n\n\
    林正英从小家境贫寒，兄弟姐妹众多，因无法供所有家中孩子上学，年少时期的他就中途辍学参加京剧团拜师学艺。在京剧圈辗转几年后林正英经朋友介绍正式进入电影圈出道，林正英以武术指导身份与李小龙多次合作，在李小龙去世后他选择加入洪家班。\n\
    \n在整个80年代，林正英以一部《僵尸先生》爆红整个香港，引起僵尸狂潮。深受观众喜爱的他正式奠定了自己僵尸道长的经典形象，之后接拍《僵尸道长》电视剧后再度掀起一股热潮！\n\
    \n林正英可以说是僵尸片的开山始祖，人称“九叔”的他是僵尸片历史上赫赫有名的人物。可惜的是九叔英年早逝，年仅45岁就因为癌症去世了。无论是香港娱乐圈还是内地娱乐圈素来都有信奉迷信一说，尤其是拍摄过各类鬼片还是僵尸片的演员，他们的身上总是流传着灵异传闻。\n\
    \n而关于九叔，最大的传闻就要从电影《僵尸先生》说起，该片拍摄于1985年，在香港一直拥有“灵异片之王”的头衔。除了电影本身好看以外，让人不得不注意的就是该片工作人员在现实生活中遇到的灵异话题。“二黄一林英年早逝，个个活不到五十岁！”这是当年人口流传着的一句话。\n\
    \n之前扒爷也提到香港和内地娱乐圈都很信奉这些无法认证的说法，所以每家戏在开机前都会有非常讲究的仪式。例如，为了避免煞祸上身，不仅要切烧猪祭天地神佛保佑，拍摄期间忌讳谈论鬼神论等等……\n\
    \n小姨贝们一定很好奇是不是拍摄电影《僵尸先生》时发生了什么“不详”的故事？\n\n如果有这个想法的，扒爷只能告诉你猜错了！\n\n因为这个剧组在荒郊野外拍摄近一个月，期间没有灵异事件发生，但在上映之后的20年里，却因三人英年早逝，一人发疯几乎杀掉丈夫，一人深陷社会丑闻，师徒同月同日去世，而被盖上了“不详”的帽子。\n\
    \n1、《僵尸先生》编剧黄炳耀，1991年，电影里有“桥王”之称的另位编剧黄炳耀则是在德国拍戏的时候因心脏病突然发身亡。 \n\n2、《僵尸先生》编剧黄鹰，1992年，有“鬼王”之称的著名香港电影编剧同时也是此片的编剧黄鹰，因到处外借高利贷拍戏，没钱还债后被债主打死在家中，直至尸体发霉后才被发现。\
    \ \n\n两人相隔仅一年时间，不仅属于猝死还皆不足50岁。 \n\n3、《僵尸先生》男主角林正英，九叔原名林根宝，在拍摄其它鬼片的中途有遇过几次灵异事件，觉得不对劲的他去找师傅算了一卦。师傅说他的原名接九土，根深入狱，跟阴阳界牵连太深，所以强烈建议他把名字改掉。最后，定下来“林正英”这个名字是根据九叔的生辰八字而来，寓意：正气英豪，防止拍戏过程中被附身，可他最后还是身患癌症去世。\
    \ \n\n4、《僵尸先生》女鬼角色王小凤，这个小姨贝们如果看过昨天的文章，应该就已经了解她的身上到底发生了那些故事。 \n\n被称作“鬼后”的她在拍摄完多部灵异电影后，开始精神恍惚发生自虐和谋杀的倾向，后经过丈夫的不懈努力才得以恢复。\
    \ \n\n5、《僵尸先生》徒弟角色许冠英，片中和林正英搭档师徒戏的“文才”，真名许冠英。在电影14年后的2011年因突发心脏病去世，死亡日期与“师傅”林正英去世日期在同一天，都为11月8日。\
    \ \n\n6、《僵尸先生》徒弟角色秋生，2000年，饰演秋生的香港演员钱小豪因涉嫌以摄影"
