  md: '那时的容祖儿可是英皇老板杨受成的＂心头肉＂，据说曾志伟这一举动被杨受成知道后没几天就被尖东之虎杜连顺旗下势力当众打进了医院。直接缝了29针不说，就连他最爱的港姐选美都没赶上～人家被打了后可没急着找记者也没去警局，直接当没发生事情一样过去了。


