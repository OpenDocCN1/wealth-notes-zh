    那么，黄神婆为何要明知是这种情况，还要章子怡找一个异性呢？好一招借刀杀狐。

    何谓胡仙转世？

    相信宝贝们都听说“采阴补阳”的说法，可要是以此纯粹是乡野怪谈那就真是大错特错了。这件事不仅在古代有，现代照样也有。前些年就报道过，有对新婚夫妇因为妻子难以满足，结果让自己老公“一夜白头”。那位新闻中的胡女士，就极有可能是狐妖转世。

    关于这一点，大家更不要觉得不可思议。早在之前的香港某档知名灵异节目（恐怖在线）上，就证实过我们郭嘉内，有多个“胡精托生为人”的案例。当期节目里，不仅提到了马娘娘。并且在节目上打电话爆料的那位神秘人，不仅自己就是胡精转世，他身边的很多师兄弟也都是胡精转世（要注意这里说的托生为人的并不是胡仙，而是胡精；胡仙转世的，反正扒爷所知道的就只有马娘娘、黄神婆以及在温莎大厦里提到的，那位认“小徒弟”当女儿的人；其他的，由于来历不明所以不可称之为“仙”。至于节目，感兴趣的童鞋可以去自行搜索并观看）。

    而胡精转世的人的共同点，除了相貌上异于常人、经常会显现出“狐相”之外；还有一点就是，对于男女之事异常“热情”。很多前世“定力不高”的，就会出现上面新闻里提到的那种“采精气”的行为。为了。这些现实的例子加上古代典籍中的记载，都能证明一点：胡精是需要采集精气修行的。道行高、本性善的，或许还会以“月亮精华”为主。但不论修行的年份长短，万物之灵的人一一都是对它们最有吸引力的“修炼材料”。

    章子怡的这位，是出自天师府一脉有仙籍的胡家族的。但之后扒爷也说了，它们由于流落在阳阴山难免显露了本性。原本它惩罚章子怡，是名正言顺地执行门规；但一旦它没能把持住，盗取了无辜的人的精气，这可就是触犯了道界天条，从此要堕入妖道的。

    黄神婆历害就历害在这：她自知保命符不会护住章子怡太久，所以便兵行险招，让章子怡找一个命格特殊的男人，诱使胡仙自己违反天道。这样，等到章子怡去找李道长的时候，李道长除了它就是替天行道了。

