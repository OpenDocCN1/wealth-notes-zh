  md: '因为技术他们花钱可以买到，导演也可以高薪聘请到，可唯独“好剧本”，是他们用钱打动不了京圈那些大编剧的。毕竟像王朔、赵宝刚这些往日的“高gan子弟”，人家早就要权有权、要钱有钱了。


    了解了编剧于影视行业的重要意义，再回过头来看显得吊儿郎当的大作家王朔，为什么能让那些如华婕二王的zi本心甘情愿地低头，是不是就能够理解了？


    王朔跟另外三位“元老”一样，都是大院里长大的孩子。说他是京圈的“核心”，是因为基本每一个京圈元老级的人物，都跟王朔有交情。除了前几天扒爷在老徐那篇文章里讲过的她跟王朔之间的感情史，王朔身边另一位不得不说的，那就是小钢炮了。


    有了小崔今年这一“闹”，估计很多人都知道了，恐观众怒的犀利狂傲的冯小刚，早年在王朔那些京圈大腕面前，就是个小晦罗。虽然之后王朔帮钢炮恈洗，替他澄清他并不是受自己影响的。可真正了解过这段过往的人都清楚，冯小刚能够发迹，完全是靠着抱住了王朔的大腿才有了今天。


    遥想当年，出身于普通的离异家庭的钢炮，在高中毕业后便进了部dui。之后由于他的美术功底比较高，在队里得到了赏识经常筹备一些文艺晚会（其实多数是打打下手）。转业后，冯小刚进入了影视圈担任美工师，而他的顶头上司就是“四元老”之一的“工程部经理”郑晓龙。


    如果说王朔是“精神领袖”，那么郑晓龙就是把这些人推进影视行业的“引路人”。早在80年代，郑晓龙就已经是“北京电视艺术中心”的主任了，钢炮就是85年被他招进中心党美工的。而在这时期，冯小刚的“溜须拍马”就开始显露出来了。


    深知没有实力、没有背景的自己，想在人才辈出的京圈出人头地是多么困难的事情，钢炮没有一天不想该如何上位。就是在这时期，冯小刚通过接触郑晓龙了解到王朔的存在，并深深为王朔的才华而着迷。这里有很多人说，冯小刚当初接近王朔就是为了上位这一点，确实是有失公允的；因为他是真的崇拜王朔的才华，并且也非常羡慕王朔的经历、向往他们青春时代的生活。于是冯小刚略经盘算，就计划好了自己的上位计划：每天都跟郑晓龙夸王朔！借机接近王朔并融入圈子中去！


    这一点在之前还曾经有人总结过说，冯小刚之所以手段高明，就在于他擅长观察人心，知道当着一个人的面拍马屁，难免会被对方识破；可要是故意在这个人的身边人面前去夸，那就会给别人留下一个zqsg、仪义敢言的形象了。果然，郑晓龙看冯小刚如此热诚，就试探冯小刚：你既然这么崇拜他，我带你认识一下吧！


    这要 RANDOM...这要是换成普通人，可能多半就当场表现出欣喜了。可冯小刚是读谁啊，他明白对付像郑晓龙他们这帮狂人时，不能完全表现出崇拜另一个人的样子。于是冯小刚就又恭维了郑晓龙一番，甚至还不忘向对方表达自己的忠心，这才让郑晓龙“放松了警惕”。


    果然，没多久，郑晓龙就带冯小刚去见了王朔了。原本王朔对冯小刚这种出身的小人物是根本瞧不上的，可没想到冯小刚“拍马屁”都能拍得与众不同：他居然把王朔的小说倒背如流，还专门把其中的一些他觉得写的精妙的句子挑出来，请教王朔是怎么才能写出来的！


    港真，换做是谁见到一个如此真诚的狂热脑残粉崇拜自己，即使嘴上不说、心里也都是能够乐开花的吧？（觉得夸张的宝贝，可以去看看冯小刚早年恭维王朔的那些采访，比如他说自己见到王朔的第一句话就是：抬头望见北斗星！）


    就这样，冯小刚竟然真就通过自己的马屁慢慢跟王朔接触起来。可仅仅是“相熟”，那可不是“心比天高”的冯小刚想要的。他要的，是出人头地，是一人之下！但对于王朔那些大院成长起来的高gan子弟来说，冯小刚的出身终究是不被认可的。即使平日里再怎么聚在一起，中间也是隔了一层“血统”的隔膜的。


    冯小刚倒也不着急，就只潜心在这样的处境中，静静等待着机会。终于，到了91年，郑晓龙的单位筹拍《编辑部的故事》。早早就吩咐了王朔、马未都等京圈编剧大'
