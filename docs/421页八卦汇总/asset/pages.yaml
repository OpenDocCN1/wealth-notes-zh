  md: '胖冰眼见自己没有出路，在这时候就已经去香港投奔那位胖大佬去了。等到04年拍“壮志凌云包青天”的时候，她就已经跟王学兵在一起了。所以，邵小珊说胖冰在03年跟自己认识，在算过八字知道自己跟陆毅不和后，就跟王学兵在一起了。


