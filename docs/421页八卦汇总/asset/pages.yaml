    而且陈志朋的体质还有点特殊，他的体质就是俗称的“招阴体”。按理说这样的人在娱乐圈里应该是很容易红的。比如大家都知道的大霏霏就是这个体质，所以她才会在出道后也长期跟某个大师合作，让大师帮自己出谋划策、在家里摆风水阵之类的。


    但陈志朋为什么会成为现在这样，扒爷也一度很不理解。就像以前台湾那边有传说，“艺人发片时要是出现灵异事件，这张唱片或是电视剧都会大卖”。大霏霏和陈志朋这种平日在生活里都经常撞gui的人，怎么可能陈志朋会到这个地步呢？（陈志朋之前就曾经在台湾的综艺节目里自爆，称自己经常“撞gui”。有一次他在电梯里，就感觉到身后有“眼神”在盯着自己。吓得他原本是虔诚的基督教信徒，都要赶紧默念“阿弥陀佛”来给自己壮胆了。）扒爷也只能推测，大概是因为平日里的那些经历混杂在一起，再加上之前的组合成员如今都比自己好很多，所以越发让陈志朋的性格古怪、行事风格也越来越迷了吧~


    28、甄子丹被电影方diss的消息可能宝贝们都看到了，这样的操作也是实属罕见——电影方把票房扑街的原因，全都归结在演员身上！甄子丹目前已经在微博上回应并澄清了这件事了。虽然他说的有理有据，可联想起之前甄子丹被爆出过的那些“戏霸”新闻，片方的指控也不是完全不可信哟~


    前几年赵文卓因为跟甄子丹合作，最终却爆出了两人交恶的消息。当时赵文卓就指控甄子丹戏霸、干涉影片正常拍摄流程等。虽然当时炒得沸沸扬扬，也有很多人网友支持赵文卓，可最后没落的还是赵文卓。不过要因此就把赵文卓糊了的原因归结到甄子丹身上的话，那可就大错特错了。


    真要说起当年两人对骂的事，扒爷只想说，谁都别diss谁，因为这两位其实都没好到哪里去。甄子丹戏霸、喜欢装B、打压后辈；赵文卓也是黑料一堆：涉嫌骗粉丝钱、孩子入外籍却屡屡打着爱国旗号上央视节目、跟业内人士交恶、要大牌得罪了一票人等等。以及让他凉凉的最直接原因：把自己的经纪公司“乾澄影视”都得罪了，直接被“封杀”（赵文卓不听公司安排，擅自接通稿、且拒绝公司给他接的资源等等）。正因为如此，所以赵文卓才会
    Gér 战发生后，没有几个圈内人愿意帮他发声。


    有意思的是，这两位当初在网上对骂得轰动全网的“功夫巨星”，这几天很巧地在同一时期上映了新电影，结果票房却全都扑街了，口碑评价更是低的惨不忍睹。这个现象也说明了，“时间才是最好的品证明方式”。两个当年都认为自己才是正义一方的演员，如今却都走上了“拍烂片圈钱”的道路。没品的事情做多了，结果也只会被这个圈子慢慢淘汰、被观众淘汰。


    29、梁洛施养小gui的事估计大家都知道了：之所以能够跟“李泽楷”有交集，是靠着她之前去求的那位泰国师傅，帮她给“李泽楷”下了情降。后来梁洛施在接受采访时还不承认，可她也是万万没想到，那位师傅居然“留了一手”：师傅在答应帮梁洛施的时候，就预料到梁洛施母女那么贪财，最后可能会不履行承诺（梁洛施承诺法师在事成后会去还愿，还愿当然就是要砸重金建庙了）。于是法师在给梁洛施作法前，就找借口跟梁洛施拍了那张合照，这才有了之后她这件“秘密行动”被曝光的消息。


    可能有的童鞋会提出疑问：像“李泽楷”那样背景的人，不是应该都有风水先生平时给他把关吗，梁洛施的歪门邪道怎么能灵验呢？关于这个问题扒爷也特意去打听了~


    首先就是因为豪门的风水师傅，大多都只是负责从布局等建筑方位来提运势的。比如在富豪要做某个商业决定前，才会找来风水师咨询。风水师并不是像保镖那样整天陷在那些有钱人身边的。所以“李泽楷”当时在跟梁洛施交往时，他身边应该是没能接触到那些专业人士；其次，“降头”这种东西也确实是很厉害，即使有其他高人发觉，也未必能解决得掉。尤其梁洛施找的那位师傅，还是拿“shi油”抹在她嘴上的，属'
