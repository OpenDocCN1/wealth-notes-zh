  md: '张靓颖在比完赛后，只花了4、5年的时间就能有这样的成绩，除了有点实力之外，会营销会推广也是非常重要的。冯柯就出了不少力在这块。因为他深知营销的意义，于是拿着张靓颖赚来的钱，不仅买好车买好房，还开办了一家网络公司，俗称水军公司。


    但只有冯柯最聪明？当然不，张靓颖随着年龄的增长，见识的增长，脑子也长了点。当年啥也没有的穷孩子，现在有钱有名。自己的闺蜜也不是酒吧里的Linda、coco，而是刘亦菲、唐嫣之类的明星。出入的场合再也不是那些酒吧夜店，而是各种正儿八经高大上的场合，还认识了更多大名人。各种跟奥运有关的活动，都有张靓颖的身影。就连中国海军慰问活动，张靓颖也被邀请了。当然，像春晚这样的舞台，张靓颖不仅去了文化部，还去了全国的。


    张靓颖虽然选秀出身，但是发展却越来越不接地气，нуне的高逼格。张靓颖因为这些成就，难免心有点飞。


    冯柯同志会让她飞？看出苗头不对的他，开始对张靓颖进行高压政策。


