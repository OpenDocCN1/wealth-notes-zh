    可但凡一个明星火了后，就容易被扒料，陈伟霆也不例外，以前的那些个事就被扒出来不少。明星嘛，没几个不整不调不打针的，好在陈伟霆调整后变得帅了，没白整。早先看活动照片也知道，他是和前任baby一起慢慢变好看的。


