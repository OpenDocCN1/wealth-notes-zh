    古力娜扎虽然有勾搭的手段，但还没来及用在张翰身上就被网友们硬发了盆脏水。不过尿盆子已经扣在古力娜扎头上，任由她再解释也没用，被骂成狗的古力娜扎原本都不想再跟张翰有任何交集。奈何老司机制张翰的哄女人手段一流，花钱花心思不重样的放在古力娜扎面前，这对于特别喜爱物质的古力娜扎来说非常动心。


    女方压根没坚持多久就被乘势凶猛的追求攻势拿下了，张翰之 hörte她当成公主宠着，在男方眼里女方的黑料都是假的。（张翰对古力娜扎可是真有想要跟她成家的意思~）可惜古力娜扎在与张翰相恋期间接了档让她翻身的节目花儿与少年，从那时后她就存了分心的<|message|>。


    这次机会让古力娜扎有机会认识了另外两个撩妹老司机，外省型男男星“陈柏霖”和“杨佑宁”。陈柏霖对古力娜扎算是初见钟情的印象，男方天生好混血口味的妹，所以整个录制期间对古力娜扎明显关注。（节目后期还故意剪辑出了两人不合的小细节，想要造成明显冲突，但其实根本没那么夸张~）


    他甚至直接在镜头前称古力娜扎为小公主，种种贴心的行为每天都在上演，明眼的同组嘉宾“小哈”都看出了点苗头，而古力娜扎则是轻车熟路的接下了这份小暖昧，就是不挑明~她享受陈柏霖关怀的同时也没忘记自己还是有男友的状态，况且张翰还时刻远程叮嘱，让节目组的眼线帮忙看着他家小女友的动态。


