    很多人认识董洁是在春晚上，她扮演谢霆锋的“新娘”，没台词跟着谢霆锋溜一圈，就让全国人民都知道了她。董洁是临时顶替周迅的，不过这次的救场，却给她带来了很多机会。张艺谋就相中了她，让她拍了《幸福时光》，成了谋女郎。后来董洁没有继续拍电影，而是转战电视圈。《金粉世家》就是让她爆红的一部剧。冷清秋的形象简直是深入人心。


