    （抱子在腹，顺风顺水登堂入室说的就是她~）


    白百何大学刚毕业就缠着要跟陈羽凡结婚，婚后没有还没什么事业心的她就在家被养了几年。可她看着男方在外花天酒地（虽然婚前女方也差不了多路数）自己却只能当个家庭主妇，时间一长就觉得愤愤不平，白百何想红的心又再度活了起来。


    她开始缠着老公陈羽凡商量要拍一些小作品，过气的陈羽凡其实那时已经挺烦白百何的了，所以他在听完这个建议后就顺势答应了下来。没想到原本只是想试试水的白百何碰上了天时地利人人和的机遇，签了牛逼的经纪人接了部黑马电影。


    上映后大受好评让她一次性得到爆火的机会，这让自傲、没素质的白百何十分欣喜，从那时起她的眼睛基本就按在头顶上。感觉打开自己新世界的大门后，白百何为了拿到更'
