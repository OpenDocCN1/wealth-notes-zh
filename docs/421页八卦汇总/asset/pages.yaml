  md: '仔细一看话题竟然是被追债？网上搜了下消息，原来是有爆料者称其所住楼层，不停收到有关向樊少皇追债的欠单。有单位更遭到淋红油漆，事后获悉是其父樊梅生的单位。樊少皇妻子演员贾晓晨代言的美容院亦收到50个滋扰电话及两名大汉上门骚扰，甚至她新签的公司也受到追债电邮。


