  md: '另一个国际友人的坑，就是李承铉。10年安以轩跟李承铉相恋，毕业竟那时候的李承铉长相还还可以。要说安以轩比起大花小花差点，但比起来汉李承铉，资源还是更胜一筹。所以她没少推荐男友。安以轩对李承铉非常照顾，连自己拍戏都要跟片方商量带着李承铉参演。结果到了12年，李承铉跟戚薇拍戏时却传出了绯闻。安以轩真是辛苦了自己，成全了别人。


    当然�-f，李承铉不靠谱，也是因为戚薇也不简单。早先人设和现在可是截然相反。当初刚出名就把谈了多年男友甩了的人，可没有表面看上去那么豪爽。虽然戚薇和李承铉均称那些只是为戏炒作，戚薇甚至还跟自己当时的女朋友（对，是女朋友。当时“七哥”的大名在“蕾丝圈”可是响当当的）保证，她跟李承铉真的没什么。结果到了13年年初，戚薇的女朋友就发了ins表示两人已经分手了。说的话也是“意有所指的。当时她还被不少戚薇粉丝，骂“戏精想红”来着。


    之后在这一年里，戚薇跟李承铉多次被拍，包括戴情侣戒指、李承铉公开摆出代表戚薇的“7V”手势等蛛丝马迹，但两人却始终不承认恋情。但到了这个时候，安以轩再傻也明白了。等到戚薇“插足”的话题尘嚣直上时，李承铉还特意发了条“暗怼”安以轩的声明，表示没有插足没有劈腿自己没有“吃软饭”。可真相到底如何，很显然，时间和现实也已经给出答案了。这可真是屋漏偏逢连夜雨了~原本她可是“小地方”出来的女演员里，最具潜力的那一个。可经历过汪小菲的事情后，她居然成了全网嘲的可怜虫了。


    安以轩感情是不太顺，事业呢，也没有再来个小高潮。毕竟新血液往上涌，所以安以轩这种老人也就搞起了饭局的生意。为啥感觉安以轩人缘特好，一是人确实不那么精，二是靠各种局打下的基础啊。


    一直到后来她结婚才稍稍搬回一局，但也是难以再有什么突破性的发展了。现在安以轩也结婚啦，老公对外通稿也吹是个大富豪。嗯，有钱不假，水分也有，所以吃瓜群众不用太在意到底多少钱，反正比扒爷多。


    在娱乐圈里从来就不是讲究“公平竞争”的地方。比如最近那位徐璐，明明是个糊咖，在被“十八线”曝光后，大家不是也才知道这样的“糊咖”居然也能有“通天的本领”么？安以轩就算bat''瘦死的骆驼比马大”的隐藏级boss：虽然略显过气，但在普通剧组（大咖云集的《某某传》这样的剧组除外）里照样是处处占据话语权的。


    16年，一部大投资大制作的电视剧独孤皇后居然传出安以轩主演的消息。毕竟，当时安以轩已经并不算当红了，但还能有这样的资源，着实让不少人意外。当然了，这天下可没有什么“掉馅饼”的好事；这其中的原因，也在去年安以轩大婚的时候揭晓了——她那位老公，就是位从事“投资业”的超级大金主。


    这部剧，虽然明面上不是她老公参与的；但看看她老公的履历表、一人身兼多家巨型企业的董事长的身份就知道，这样的背景让安以轩去演个女主，那不是轻松加愉快的事情嘛~所以这部剧不论是服化道还是后期制作，都是精良之作。而且，更加别出心裁的是，这部剧的女主设定是很不走寻常路的。


    因为那时候的影视行业，正是观众纷纷声讨“拒绝玛丽苏！拒绝傻白甜”的时候。太多的大女主戏都是清一色的傻白甜女主，简直就是挑战观众的底线、侮辱大家的智商一样！而这部跟“外面那些妖艳J货”完全不同的剧，女主居然是个腹黑、有手段、可爱又迷人的“反派”角色！


    光是听着就很动心啊有木有！（这样的主角设定，还被业内一位喜欢抄袭的知名编剧于正效仿，不过这个编剧很聪明，知道把自己笔下的那位腹黑女主角吴瑾言的“善良”和“正义”保留下来，所以才得以顺利送审~）


    拍摄过程倒是很顺利，安以轩也并没拿太多架子摆谱，跟演员之间的关系也算友好。可等到后期杀青了，却出了幺子了：原来上头根本就不允许“反派”当主角！在送审时直接责令退回去重改！这下可坏了，要是不过审，那投的那些钱可就全砸了。'
