    不过有次拍戏《我的朋友陈白露小姐》，她遇见了一件贼尴尬的事。那就是当年分手的两个人又在一起合作了！不知道两位再见时，心里是不是都在憨慨，娱乐圈的猴粪无处不在。可他已经不是那个他，她也不是那个她了。相比于张天爱的一步登天，李子峰则是稳扎稳打，蹭了水果台的资源，露了几次脸，还和乐
    couple 谈过一段。谁让乐 couple 谈对象挺看脸的呢？


