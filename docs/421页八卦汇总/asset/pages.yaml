    贪心的刘芸一边想跟郑钧名正言顺的在一起，一边又不想分手后便宜了对聂远有好感的女星，所以她把之前记下的小名单用了起来。在她主动对聂远提出分手后，专门找来记者口述感情经历，以唯一受害者的身份自爆与聂远的恋情。破口大骂聂远奉负了自己，还劈腿了小名单上的三位女星，香港妹“佳佳”，内地女星“珂珂”，女主持有“辣辣”。


