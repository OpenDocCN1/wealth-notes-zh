  md: '所以，12月上旬才出面道歉请求大家原谅的赵薇，没过20天，她就意识到自己的道歉，根本没什么卵用了。


    01年12月末，赵薇经万了自己人生中，最不愿想起的“泼fen”事件。在参加芒果6周年台庆晚会时，舞台上突然冲上来一位狂热的男观众。本来保安刚想上台阻止，却看到这个男观众只是献上拥抱，就又都停下了脚步。谁知一转眼，男观众便把赵薇推倒在地，并伸手试图从兜里掏东西。赵薇见状不妙想跑，却已然是来不及了。男观众迅速把瓶子里的“金汁儿”，一股脑地全泼向了可怜的赵薇。直到赵薇自己挣扎着站起来，被吓傻了的保安们才想起来冲上去，但也为时已晚了。


    这事直接让赵薇成了全国观众的笑柄。丢人丢面的赵薇，之后只好黯然转战港台圈。可谁知道，她拍的烂片票房几乎都扑街了，让她又被扣上了“票房毒药”的帽子，真是倒霉到家了。


    按理说，赵薇如果保持低调，凭借自己的知名度还是有机会翻身的。可当时还是年轻气盛的她，哪那么容易就能按捺住自己那颗躁动不安的心呢。果然，消停了没多久的赵薇，到了04年年中，就突然被爆出了“指使司机殴打孕妇”的消息。


    一位名叫邹雪的女士向媒体爆料，称自己被赵薇的司机在内的20多个男人殴打，原因是“商业纠纷”。消息一出，迎来一片哗然。其实这件事，赵薇打人固然是不对，不过这个邹雪也的确可恨。因为当年的“jun旗”事件，就是这个邹雪一手策划的。事后，邹雪假惺惺的“引咎辞职”让赵薇很是内疚，甚至还给她投资开了酒吧。结果这个邹雪不仅把酒吧经营得赔光本钱不说，赵薇想跟她要账目查账，邹雪直接“人间蒸发”了。这时候才有人告诉赵薇，邹雪当初策划的jun旗事件，压根儿就是她被别人收买了来故意坑赵薇的。这事换谁不生气啊？简直就是现实版的“宫心计”了好吗！赵薇一怒之下，这才动手打了邹雪泄愤。


    这些内情，当时的媒体其实都是知道的。可比起“赵薇司机殴打jun旗装幕后指使人”这种话题，显然是“赵薇殴打无辜孕妇”更能吸引观众眼球啊。所以说在那几年，赵薇的烂人缘真是差得不能再差了。


    也是从这时开始，赵薇终于意识到：在娱乐圈，想当一个人畜无害的“白莲花”，是根本不可能的事！这一刻起，曾经那个善良的赵薇已经“死了”；活着的，是钮祜禄·腹黑·赵薇！赵薇开始学得精明，开始学着跟圈子里的“大势力”示好，主动寻找靠山。


    一开始，天真的她还以为华姐在自己“水深火热”的时候岀来帮她一把，是“人间有真情，人间有真爱”呢！其实人家只不过是想借用她的国民度赚票房罢了。两部电影接连扑街，之后的资源当然就再没她的份儿了。好在赵薇懂得变通，知道“干得好不如嫁得好”。


    女明星再红，也是前途未卜的。即使如她当初那样“红遍亚洲”又如何？还不是出了事就被打回原形！唯有找个豪门嫁了，这一生才有保障。当然了，想“攀高枝”还得“自身硬”，像眼前这么“全民黑”肯定是不行的。于是，为了实现自己的愿望，“逼上梁山”的赵薇便去找了当时在圈里很受追捧的“王大师”，来给自己看上一看。


    别说，这个王大师还真有些手段。用了他的“独门秘法”（上床）为赵薇开光后，他还告诉赵薇：凡事不能操之过急！你越想在事业上有所求，便越得不到；不如换个思路，从哪里来回哪里去，没准就柳暗花明又一村了！


    于是，赵薇接连几年“不务正业”：不仅重新回到小银幕“圈观众缘”，还开始“不玩演戏、玩音乐”了！对待媒体也懂得“大家都是一家人”了。发发红包、送送礼，媒体也马上笑脸相迎、没那么刻薄了。还纷纷为她发声、替她喊冤，帮她向公众解释：“孕妇是个忘恩负义、两面三刀的小人！赵薇当年是被陷害的！赵薇不仅有情有义还是个大善人呢！'
