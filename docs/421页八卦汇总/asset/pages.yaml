  md: '自从发生了这一系列事件之后，周迅的事业便以肉眼可见的速度连续走低呢？即使演技再怎么受到认可，也难以回到巅峰状态。当然，这些隐情周迅当时是不知道的。一直到周迅跟眼帝分手，她也一直都以为两人就是今生无缘，好聚好散而已。

