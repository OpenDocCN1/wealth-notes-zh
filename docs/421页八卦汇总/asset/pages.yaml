  md: '觉很委屈的微博。这么干可不就招人打吗……网友纷纷表示这不叫幽默，这叫情商低！


    袁弘很喜欢凑热闹，啥事有关系没关系都会掺和一脚。


    之前关于难民，发表了不当言论的公知姚晨，被网友diss后，她就出了篇洗白文。这事按理说和袁弘一毛钱关系都没有，但是他还出来站队支持。袁弘的留言，一下子引来网友的新一轮教导。


    所以麻烦袁弘以后不了解真相不明白事情经过的话，还是不要参与了。老老实实当好演员，才是本分。


    不过袁弘也是个捞街体质，明明和张歆艺结婚后，资源上来了，但是综艺电视剧都没有什么大水花。就连最近的《爱情公寓》大电影，明明自己是主演，但是宣传时却没人带他玩？被网友戏称为“0番主演”。


    这部电影被大家发现是披着爱情公寓皮的盗墓片后，引起一片群嘲。这时袁弘还顶风作案，不停的发微博宣传电影。其他主演后来都没有再宣传，避风头去了，就只有袁弘还蹦出来，不被骂才怪。


    袁弘是做事欠考虑，张歆艺也经常不过脑，微博上引起的矛盾也不少。


    有次在微博上吐槽医院不干人事，说她去了急诊，大夫头都不抬就给开了打针，后半段就集中吐槽医生的口腔问题。还说医院打针都不给皮试，自己去查了这针是有风险的，还截图科普起来。


    但很快就被医院和医护人员证明，这就是在碰瓷！


    首先张歆艺不理会挂号实名制的要求，说出事自己负责。做完检查又改口说出了事找医院领导。而且她和助理就医过程中态度非常差。再有医院也并不是上来就打针，而是之前已经给她做了脑CT检查。医生是看了片子后才决定打针的，而且这针不需要皮试！


    本来社会医患关系就紧张，作为公众人物还隐瞒事实公开diss医院。而且医院本身做法是没有问题的，若真有不满为何当时不投诉，非得回来微博上闹。等事情闹大了，她才发了微博道歉。


    但亲爱的的，这并不是一句“二”就能翻篇的……不能因为自己是明星，就要求有特权啊。


    要是只此一件也就罢了，张歆艺真的是不消停。


    她和贾乃亮拍了部戏，后来她就在微博揶揄贾乃亮，还被李小璐恐……《绣春刀》上映，张歆艺发微博把所有人夸一遍，但就是没提女主刘诗诗。网友就问原因，问多了，张歆艺就发了这样的微博。看起来像是夸，但是语调很奇怪。再有一次张歆艺发了张自拍，被很多网友说像杨幂。然后她就再发了一张搽脚的照片暗讽杨幂……毕竟杨幂臭脚是人尽皆知的梗了。除了明星圈的事，当年她还在朱令投毒案闹得沸沸扬扬时，把这事改编成段子发出来……


    这些事非常败好感，对于姨太来说，对张歆艺唯一有好感的事就是她给慰安妇记录片《二十二》资助了100万。


