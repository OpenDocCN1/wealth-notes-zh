  md: '倒是让颖儿注意到这个明恋自己的小伙子了。于是，两人之间开始有了不一样的火花。之后，两人更是相约庆祝中秋节，还被媒体拍到两人共度春宵的实锤。但是面对种种传闻，两人都不作回应。之后，他们又共同参加了一档恋爱真人秀。兩人在节目里打着恋爱的名号，正大光明的撒狗粮。节目过后，两人也终于公开承认恋情。之后，领证结婚。


    我们今天就来聊点深刻的，扒一扒这对夫妻之间的不和谐关系。颖儿和付辛博AA制婚姻...这一点，付辛博在节目里也提到了，他的钱是自己在管，颖儿的钱可能是颖儿爸妈在管。其实呢，已经到了2018年了，很多人在恋爱的时候也会选择AA制，毕竟大家开始追求男女平等了，但扒爷还很少听人说起婚姻AA。


    哪怕是真的AA，也是双方都有这种想法。但付辛博和颖儿这一对里，付辛博是乐意的，颖儿似乎并没有那么乐意。颖儿在节目里跟他提了个要求，说让付辛博拿出一小部分资金，让自己买买买，因为用老公买的东西能感受到幸福。当时付辛博看着她的表情...扒爷觉得好凝重啊...再结合前面说的交银行卡的不乐意，扒爷竟然觉得这一对似乎有点不太熟的感觉。不然这么简单的事，为什么不在家商量，而是拿到节目里说，还要用上“提要求”这种方式。正常的情侣夫妻关系，难道不是撒娇，老公你给我买这个好不好，就解决了么？


    除了金钱问题，扒爷还发现付辛博和颖儿很多不太熟的地方。别人都是老公对妻子表白，以后我照顾你，而颖儿他俩刚好相反，实质上也是颖儿照顾付辛博，他来和自己度过浪漫旅行，颖儿还主动给他揍背，付辛博吐槽说她演的好，她还说平时在生活里也没少揍。节目组让老公们策划一次浪漫旅行，付辛博给颖儿准备的看似很合大家心意。有好看的房间，满屋子的啦啦A梦：可这个看似准备精心的房间，其实也就是付辛博找工作人员挑选的吧。。。。因为他自己进到房间里，也是提到了，他们说这是一个非常好的一...（他说了半天没说出来，扒爷猜测，应该是视风景很好的房间或是什的）


    但付辛博人不在本地，会不了解也能够理解。但另外一个细节，扒爷就很迷了...大家还记得颖儿恐高吧？过那个极限木桩什的，脸都吓得扭曲了；另外一项高空运动，她的脸也是扭曲的...恐高的问题，作为老公的付辛博肯定是知情的。但他在节目里表示，颖儿跟着他去澳门塔蹦极过。并且一上去就哭了...澳门塔是233米，颖儿就陪付辛博去了...但是明知道老婆恐高，付辛博还是给她安排了一段高空浪漫...付辛博知道她刚生完孩子，体力又不好，还是选择了一个需要“长途跋涉”的地方：颖儿爬坡的时候也是边爬变吐槽；颖儿恐高，而付辛博选择的地方却是一个柏林栈道...这个栈道是全海景的玻璃栈道，虽然站上去的人很多，但是对于恐高的人来说，还挺可怕的。如果扒爷没猜错，他们去的应该是厦门大佛石的玻璃栈道，最高的海报是450米..。


    所以，扒爷现在说一句，付辛博对颖儿不好，你们相信么？


    如果不信的话，我们继续来看。


    颖儿在打不通付辛博电话的时候，第一反应是他是不是出逃了...她还不止说了一次，在找到付辛博以后，当着面还说了一次呢！这得是对自己的老公多不信任，才会有这种感觉...而付辛博在给颖儿发浪漫礼物之前，不是主动表示，让你找不到是我的错，而是先吐槽，你为什么直接冲着我就过来了，白瞎了大家准备的惊喜。给礼物的时候，也是单手给？他准备的礼物也是看似很浪漫的：吵架马上和好卡，替老婆分担操心卡，以及储蓄卡。抛开储蓄卡不说，吵架马上和好以及帮老婆分担，难道不是每个男人都该做的事么？毕竟你们不是恋爱，而是已经结婚了...所以这个卡，是用他克扣颖儿的老婆权利，来给了颖儿一个浪漫？


    这一对的婚姻，请恕扒爷愚笨，实在是看不懂呀！为什么会有这种婚姻存在，那扒爷也来解释一下，因为他俩根本就不是正常流程是恋爱结婚那么简单。


    ✓ 颖儿是如何斗败YP嫩模成功上位的'
