    失去了靠山的孙悦，此后也确实再没原创代表作，靠着“翻唱外国歌曲”在圈里混了一段时间。后来搭上了一位“韩国棒子”的大佬当干爹，可惜也没能折腾几年，还差点被国内的某个大老虎的落马带下水，所以没多久就隐退结婚生子去了。包养过黄晓明。


