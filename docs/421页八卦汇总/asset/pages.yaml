    # 9、白百何


    今天要给大家讲的这位女明星“白百何”。白百何从出道开始就一直黑料不断，不仅路人口碑不太好，圈内人缘也是很差的。按理说，圈子里的女明星就算爱撕x、容易四面受敌，多半也得是胖冰那个咖位的，才容易引来“群愤”啊；谁能想到就凭白百何这种“小花旦”，居然也能四面受敌呢？不仅她的老同学“唐嫣”不喜欢她，跟她长得像亲姐妹一样的“绵羊音”王珞丹也跟她水深火热。


    要知道俗话说得好：一个人不喜欢，或许是别人的问题；可要是所有人都不喜欢，那就是自己的问题了！但倘是如此“不受待见”，白百何却还是红了！这其中的原因，除了有她靠老公的资源之外，再也与她那位男闺蜜“文章”提携。


    说起白百何和文章，在两人没“凉凉”之前，绝对是圈子里著名的“模范好同学”：隔三差五地两人就一起上节目谈友谊，而且还常常带对方介绍资源。当初白百何能够出演一部爆火的电影，就是靠着男主角文章的推荐，使白百何一跃成为了风头正劲的新小花。


    可要知道，有句话叫“鱼找鱼虾找虾”，物以类聚人以群分！这两位好朋友，可都不是什么省油的灯。不仅最后“凉凉”的原因，都是“婚内出轨”，而且两人的性格也很像，都是“狗眼看人低”的主儿。没红之前，做小伏低；红了之后，捧高踩低！


    坊间关于白小姐的料很多，妥妥儿的“宝藏女孩”，黑历史多到数不清。


    扒爷一直说，明星在被媒体抹黑、造谣时，合理维护自己的名誉是正常的，也是应该被支持的；但一味地要大牌、爆黑料、人品差，被媒体客观评价却只会一味删帖河蟹、仗势欺人，等到一旦自己出了事哪还有人愿意帮其发声？

    白小姐和文先生就是典型的在这方面吃亏的主儿。在自己红的时候，没少要大牌得罪媒体（迟到、采访时不配合、骂记者），等到出事的时候，放眼望去没有一家媒体不“叫好”的。


    白小姐除了“一指禅”以及“学生时代的那些黑历史”（如偷东西、小三上位等）之外，最令人印象深刻的就是她当年“大闹银行”的事了。据说白小姐在银行排队时，自觉是明星、有身份，不仅不愿意跟人民群众一起排队，还嚷嚷着必须要vip特权。在遭到拒绝后，居然坐在银行里就开始嚎啕大哭：“你们丫的知道我老公是谁吗？我老公是陈yf！
