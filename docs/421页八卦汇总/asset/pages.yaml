    # 25、古力娜扎


    娱乐圈内有很多演技差，背着一身黑料的明星（不分男女），他/她们入圈时间一长就会被爆出很多过往经历。这样的情况经常会使得大家的路人缘蹭蹭下滑，为了防止这类情况持续恶化，各家团队这两年想营销人设的有用方法。今天扒爷要说的故事主人公就是先摔倒，再从节目讨喜人设中又重新出发的娇情姑娘古力娜扎~


    古力娜扎出道时就带着金主的光环签下了影视公司，主演了IP作品与一众大火明星搭档，公司将她作为一姐小花位置力捧。可惜的是，虽然她自身外貌身材各方面条件都不错，但就演技实在不过关，无论给她多好的资源，古力娜扎都没有红起来。不过身后有金主的她并不担心，古力娜扎知道自家公司正处于用人阶段，不会因为这点业务能力差就放弃她。（虽然她入行前的男人缘实在是太emmm...）


