    成为品牌代言人后的她们从一众香港女模中脱颖而出，逐渐受到广告商们的青睐。跟现在的网友有点相似，也是一样从网络红到平面媒体，最后转到演艺圈~


    2007年，MV、广告应接不暇的文咏珊参演了个人首部电影《十分爱》和青春偶像剧《过渡青春》两部作品。那时她和天使大宝贝的闺蜜友情还在在线，两人在2008年共同创建潮牌“CHOICE”。这样看来，其实要论入演艺圈的时间文咏珊比天使大宝贝要早好几年呢~


