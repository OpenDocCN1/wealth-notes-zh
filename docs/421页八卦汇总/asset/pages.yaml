  md: '自己的面子，怕把奖给了田震，田震却不能到场，所以才最终决定把奖给英子。而英子只是按照自己得到的通知，按约定去现场领奖而已。结果没成想，田震一听说了英子，又决定去现场了。这才有了后来现场发飙的结果。


