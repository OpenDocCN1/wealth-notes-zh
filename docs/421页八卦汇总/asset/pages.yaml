    # 26.1 阿sa蔡卓妍


    阿Sa这个人长得 虽然不是多漂亮，但可爱的长相、开朗的性格让她人缘也挺好（异性缘更好）。不过这也不全都是好出，阿Sa因为长相导致她十几岁、二十几岁路线竟然都是一样的！加上她和同伴“阿娇”，那简直是要把青春、清纯、可爱进行到底。可气人的是，阿娇虽然脑子不如她精明，但长相却比她吃得开，戏路上也更宽些。


    但阿Sa其实也不用多羡慕阿娇，毕竟阿Sa可是公司的小公主（谁让阿Sa嘴甜听话会来事），阿娇能有当时的待遇，也是沾了阿Sa的光。阿Sa是小公主这话一点也不假，因为她背后的经纪人就是那个灰常有名的“宝珠”霍汶希。宝珠可是更注重阿Sa。阿Sa特殊在哪呢？阿Sa当年背后的公关团队，不是公司的，是赌王女儿开的那个。表面上是带她俩，其实95%的精力都在阿Sa身上。这个团队熟知内地、HK的通稿套路，为阿Sa两地大炒特'
