  md: 丝质疑是“炒作想红的那位导演。可港真，叶大鹰人家确实有那个资格质疑电影啊。就好像他发博说的一样，电影剧本如果涉及历史人物，那么在拍摄前是要经过家属同意的。而《建军大业》这部电影中的将军叶挺，正是叶大鹰的爷爷。叶大鹰也是圈中较早接触导演行业的人，而且他不光能导，还能“编”能“演”。之所以坊间一直对老徐的“才女”头衔有所质疑，就是因为当年那部让老徐声名鹊起的“导演处女作”《我和爸爸》，其中就疑似有叶大鹰的功劳。要知道，这部电影里叶大鹰虽然是作为男主参与的，可他是什么身份？在老徐一个“新手”拍摄电影期间，他可能完全不插手么？而且更可疑的是，自从老徐脱离开了叶大鹰这样的京圈大咖后，后续拍摄的那些电影一部不如一部。这种质量上的断层，更让她那部获得金鸡奖最佳导演的《我和爸爸》，被怀疑并不是完全出自于她手的了。而提起叶大鹰，除了疑似帮老徐当“枪手”之外，最著名的八卦就要数他跟梅婷的那段往事了。想当年，梅婷可是能让龙儿章子怡羡慕的人，就知道她的资源得好到什么地步了。很多人都以为梅婷跟叶大鹰是在《红色恋人》在一起的，其实从梅婷踏入影视圈起，就一直有叶大鹰在她身边为其保驾护航。94年，已经导演了电影处女作《大喘气》的叶大鹰，决定拍摄电视剧《血色童心》。这时的梅婷根本还不是北电的学生，而是一名在南京Jun区歌舞团的文艺bing。也正是因为这个身份，让她在叶大鹰选演员的时候，因为长相大气而被叶大鹰一眼相中。有了这次合作，当时还很懵懂的梅婷也在拍戏过程中对年长的叶大鹰由崇拜逐渐产生了爱慕之情。虽然这部戏在当年造成了很大轰动，但后续的片约却都因为梅婷的身份而被推掉了。但如此严格的管理下，梅婷却能登上95年的春晚。这当然就可想而知，叶大鹰的背景有多厉害了。也正是由此次的拍戏经历，让梅婷对演员这个行业产生了兴趣。在等了两年后（队里不出证明考不了），她在面对队里的挽留时也毅然决然地选择了退役报考。并且终于在96年考上了中央戏剧学院，还跟龙儿一起组成了闻名校内外的“八朵金花”。都知道中电在当时可是根本不许新生外出拍戏的，可有着叶大鹰做靠山的梅婷却根本不用理会那些规矩。不仅在入学第二年就主演了叶大鹰导演的第三部电影《红色恋人》，搭戏的还是当时万千少女的偶像张国荣。就是因为这段经历，所以才有了之后龙儿章子怡在采访中提起的那段往事：梅婷拿回来的张国荣的墨镜，引起了所有女同学的羡慕嫉妒恨。要知道，在那个年代，香港艺人想来内地拍戏根本就不像现在这样容易，而是需要审核的。可叶大鹰却轻松就让张国荣过审了，所以他让还是学生的梅婷出来拍戏那不是小菜一碟么？！只不过，虽然这部电影让梅婷获奖无数，可学校也是要面子的。而年轻气盛的梅婷，在面对老师的“碎碎念”后没多久就受不了了，甚至一气之下就选择了退学，并开始了跟叶大鹰的同居生活。可谁又能想到，叶导却有个不为外人知道的“坏毛病”：家暴！当然，这件事也只是听说，并没有实质性证实了。据说，那时候的梅婷不顾叶导的已婚身份坚持跟对方住在一起后，没想到叶导居然在喝多了以后经常动手。没多久，不堪忍受的梅婷就选择了分手（也有说是叶导另择新人的）。也正是因为有了这段经历，所以梅婷才能在之后把《不要和陌生人说话》演得如此传神。对于这份爆料的真假性，扒爷也不敢完全确定，毕竟年代已经过去太久了。可如果这件事是真的，那梅婷早年的感情经历也是够惨的了。不仅经历过这样的痛苦，之后还遇上了花心渣男郝颐（没错，就是后来因为李小冉被砍了的那位）。好在如今的梅婷，有了体贴的老公、圆满的家庭，还有了“幸福肥”，也算是上天待她不薄了。不过，叶大鹰在经历过这些之后，导演事业也是走起了下坡路。不仅投拍的影视剧越发收视、反响平平，到后来居然还沦落到被新生代粉丝嘲笑的地步。这还真是一个“虎落平阳”的悲惨故事呢~
