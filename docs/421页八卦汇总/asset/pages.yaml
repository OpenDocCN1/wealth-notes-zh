    # 12、江疏影


    江疏影之前在学校里，就是个女神级的人物，因为长相清纯、纯天然，跟外面那些妖艳J货网红脸很不一样，所以刚踏进圈子就被一个很牛掰的大佬看上了。要知道这个大佬可不光是有钱，人家还有红色背景你说厉不厉害？但江疏影也不是个省油的灯，整天就想着让大佬捧她，给她砸钱拍戏。要知道，有时候话说多了就容易让人厌烦，而且这个江疏影又是個没眼力见的。当时正是大佬为自己的前女友闹心的时候，她居然还在一旁喋喋不休。于是，大佬就很意告诫江疏影：“我要好好打造你！但你这个学历不行啊！”，然后把江疏影给送去国外深造了。


    江疏影在国外学习的时候，大佬的周围处境早已风起云涌、换了新天地了。大佬不仅在此期间又结交了新欢女明星“樱桃”，还因为前女友“上了法制新闻”。


    等到江疏影学习归来以后，她才知道自己已经指望不上大佬了。但俗话说“爱睡的女孩运气不会太差”。果然，江疏影就凭借自己的“镀金”身份+“身世清白”，居然成功睡到了一个业内的制片人。制片人还帮她拿下了一部赵薇拍的“处女作”致青春的女二号！可是，江疏影通过这样的手段上位，让“赵薇”很不喜欢她，一直在捧自己选的那个女主。所以演完了这部戏，江疏影的处境其实也没改变多少。而且，虽然说江疏影有制片人当靠山，但制片人的受制因素也是很多的，不能部部戏都做主。


    但制片人对江疏影也是真的好，在看到江疏影不开心后，就各种托关系最后给她拿到了一个电视剧的女主角，谁知道江疏影却不满意。因为她一直在跟“处女作”的那个女主杨子姗比较，而那个女主杨子姗一直是演电影的，自己要是演电视剧岂不是不如她了？


    直到制片人告诉江疏影，这部剧的男主是当红小生“胡歌”，江疏影这才又转怒为喜的（看过之前八卦的童鞋估计看到这个名字就能猜到了）。要不怎么说江疏影有心计呢，她知道胡歌正当红，所以便在拍摄过程中各种主动示好，最后居然真让胡歌以为她是个“好单纯好不做作”的女生。可江疏影根本就是为了上位才跟胡歌在一起的，之后更是自抛腰包找狗仔来拍照把绯闻曝光。胡歌这才知道真相，于是没多久就跟她分手了。


    可这时候的江疏影已经有恃无恐了，都红了还怕什么呢？包括那个又丑又老的制片人，她也用不着了。有了“胡歌前女友”的这个光环，江疏影轻而易举就挤上了二线的位置。还靠着“烈焰红唇”圈到了不少宅男粉！人气和资源都有了的江疏影，也开始越来越飘！甚至就连某个国内顶级的说唱小生吴亦凡，都被她迷住跟她来了个“419”！


    不过，天道好轮回善恶终有报！谁能知道，在圈子里巧取豪夺、抢资源的江疏影，居然被之前的制片人算计了！原来，当初制片人跟她在一起时，就担心她日后会甩了自己所以居然早就留了一手：制片人的手里居然有他跟江疏影在床上的“桃色录影带”！眼看江疏影如此得以，还睡了说唱小生，一怒之下制片人便把录影带卖给了媒体！


    虽然江疏影之前就得到了风声，一早就买通了各大网站禁止录影带被流传曝光。但纸终究是包不住火的，总有神通广大的网友能够通过各种渠道发现这段“肥肠精彩”的视频。终于，这段被“尘封”已久的录像，就酱紫在私下里流传开来了…


