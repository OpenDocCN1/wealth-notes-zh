  md: '按理说，看过前天扒爷那篇“温莎大厦”的宝贝，应该能提出这样一个疑问：章子怡当初拜入胡仙门下，是由陈道长引荐入了“台湾阳明山”那一脉的；这一脉的胡仙，都是龙虎山天师府的胡仙家族的，天师府早在49年便经由张恩溥天师迁徙去了台湾，章子怡直接去天师府不就可以了吗？为什么黄神婆要舍近求远，让章子怡回内地解决呢？


    黄神婆会这样安排，的确是有她自己的考虑的。


    其一，就是上篇扒爷略微提到的：第六十三代天师张恩溥仙逝后，第六十四代天师由于某些原因，并未设典仪正式召回胡仙。致使胡仙流落在阳明山，后来被叶云尧请回了堂内。这个做法，其实一直是黄神婆不能接受的。毕竟她作为胡仙在人间的“传达者”，她代表的就是胡仙啊。当她看到第六十四代天师居然如此不把胡仙当回事，最后甚至还让胡仙被一个“远房弟子”（叶云尧也是师承“正一派”的，算起来跟天师府也是同根同源，但终究不算是“天师府”的正宗血脉）请了回去，这么“大不敬”当然不配再跟胡仙一派“互相扶持、共同进步”了！所以，黄神婆虽然跟天师府同在台湾，却宁可独自一人隐居修行，也不愿意多有来往；


    其二，黄神婆这么做也是为了保住章子怡的性命。要知道，胡仙之所以会惩罚章子怡，是因为章子怡自己先破了门规的，胡仙这样做是属于“执行家法”。即使是张天师亲自出面解决，多半也是要遵从胡仙的意愿的。就算张天师能保住章子怡，她的下场也多半不会太好过，“非死即残”也差不了多。那就还不如让“外人”出手，尽最大程度地把章子怡保下来呢。毕竟章子怡并非有意要犯禁忌，罪不至死。


    况且，黄神婆当时也确实有个私心想护住章子怡，这也是第三点原因。事实上，在11年章子怡去寻黄神婆的时候，黄神婆早就不是当年那个隐居修行、不问尘俗事的修道之人了。黄神婆的丈夫是一位商人，早年丈夫需要她一同公开露面时，黄神婆对外身份便一直以“商人”自称。直到过了千禧年，台湾的某个“大文人”不知通过什么渠道，竟然得知了黄神婆的身份。大文人便以“拜访”为名，先是对黄神婆的灵力大肆恭维；之后还极力游说黄神婆“出世”为人算命、指导迷津。文人把这种课利益的事情吹嘘成是在“行善事”，甚至还不停地给黄神婆洗脑，这样做是普度众生，有助于黄神婆羽化后成仙。


    要知道，对于像黄神婆这样的人，没什么能比“死后成仙”更有诱惑力了。况且黄神婆一直也知道，有不少道士最后都选择了出世，甚至还有一些高人被不少富豪开重金，去堪舆风水保其生财有道。就这样，黄神婆被文人说动了心，决定外出帮人看事解运。但前期黄神婆毫无名气，根本就没有几个信众会去找她。


    于是，大文人便派上用场了：他不仅出了几本文集吹捧黄神婆的灵力，还频频通过朋友的关系，参加电视节目来宣传黄神婆。这样一来，黄神婆的名声终于在台湾流传开了，每天都有不少信众前去找她卜卦。一开始黄神婆还ımı坚持原则，卦金随缘即可，并不多要；可随着她的名气越来越大，难免就开始有更多的富豪名流去找她帮忙，卦金也是水涨船高。尤其在看到丈夫的产业靠着她的钱越做越大，女儿的生活也越来越好的时候，黄神婆到底还是“随波逐流”成了商业化的风水师傅了。


    大家都知道，有句老话叫“天机不可泄露”。很多修道之人的原因是为违背了天意，强行替一些人逆天改命最后不得善终。黄神婆也在不久后，尝到了苦果。她唯一的女儿，从小就因为长相甜美受到娱乐行业的赏识（就像马娘娘那样，那些“胡仙转世”的人，尤其是女人，天生长相就很美很魅。甚至仔细观察还能看这些人的脸上，有狐狸的影子）。


