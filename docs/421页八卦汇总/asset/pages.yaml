  md: '起；到了15年，正逢袁姗姗巅峰的时期（黑红也是红嘛~），曹曦文也要在微博上主动发两人的“自黑合照”，在引发争议后又出来回应质疑称自己跟姗是铁瓷；包括在此期间，刘涛凭借《半月传》和《欢乐颂》翻红后，“胜似姐妹花”的通稿更是层出不穷；在被刘涛粉丝质疑后，又要跑出来抱委屈，称“我就是我”。所以说曹曦文的这些经历，她只能庆幸是因为她真的不红；换成任何一个流量，她这种做法估计早就被饭圈手撕出天际了。


