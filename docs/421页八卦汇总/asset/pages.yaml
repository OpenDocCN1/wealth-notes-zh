    想要进京圈的，那可不是谁都能进的。其实原本这个圈子里，是很讲究“根正苗红”的“大院子弟”身份的。要不炮导演怎么那么久都没被硕大爷、海大爷他们瞧得上呢？还不是因为出身卑微么~只不过是在后来，炮导演靠着华姨的财大气粗，才最终得到了认可罢了。华姨后来为了广招豪客，又在“红色子弟”的条件上，额外通融了一个“满族”血统的条件。像是大家都知道的“京圈格格”关晓彤，她之所以她能混到这个名头，不外乎就是靠着她那位老艺术家的满族爷爷和夫妻而已。


    而“满族”这个条件一开，京圈的范围可就确实扩大了不少了。不少并不是北京出身的圈内人，都有幸受到了华姨的提携。比如像零几年时，华姨花了大手笔投拍的那部电影《腕儿特大》，里面的香港女主角就是位“皇族”后裔。


    虽然看上去，这个条件还是充满了“遗老”的腐朽风味，但在当时的大的方向上，确实对后来京圈的发展壮大有了很深远的影响——实现了京圈与其他帮派的合作共赢。这也是为什么，在一开始京圈一直在抗衡“西北圈”的老谋子张艺谋，人家拍“英雄”，京圈也要找来当时国内的顶级流量小燕子跟自己的“一哥”文大导演，合作了一部“天地间的英雄”，还不是见不得人家崛起么~


    可到了后来华姨决心扩大阵容的时候，两方就不再像过去那样剑拔弩张，而是充分贯彻了“有财一起发，有难你来顶”的思路了。不过，西北帮毕竟由于结怨已久，并不是京圈拉拢的第一个选择。真正得到京圈重视的，正是扒爷上一篇文章里提到的帽子叔为代表的“东北帮”。而让两派达成合作的中间人，就是我们今天的主角——英子。


