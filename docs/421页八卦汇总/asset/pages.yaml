    32、张曼玉如今一提起张曼玉远走法国的原因，总会跑出来一帮人称是因为张曼玉拒绝成龙的“潜规则”，为了躲成龙才远走法国的。扒爷只能说，这样的谣言居然能成为“主流的说法”也是很让人无语了。


    要知道，当年张曼玉跟尔冬升是有过一段情的，而且一直在分手很久之后，尔冬升对张曼玉跟别人在一起的事情都很难释怀，常说一些很酸的刻薄话；而尔冬升跟成龙的关系，那不仅仅是很铁而是非常铁啊。所以对于尔大导演那样小心眼的男人，如果真的是因为成龙想要潜规则张曼玉还把张曼玉逼走的，那尔冬升怎么可能还会在之后继续跟成龙合作呢？


    张曼玉跟成龙的关系一直不错，早年两人的确曾经暧昧过，但由于当时还涉及到另外一个人——关之琳，所以张曼玉并没有跟成龙在一起，但两人仍是非常好的朋友。当初张曼玉一直被港媒诟病是花瓶，直到后来她接演了《阮玲玉》才得到认可。但由于这部电影比较敏感，所以并没能在内地上映。而那部真正让她被内地观众也认可的《甜蜜蜜》，就是成龙推荐她去拍的。所以根本就不存在坊间传说的那些“她被成龙逼走”的故事。


    张曼玉当年是因为一心想嫁给法国导演阿萨亚斯，为了爱情放弃的事业。可惜，这段情却只维持了四年就分开了。张曼玉在之后也经常回香港，但因为太反感香港的狗仔记者，尤其是当时被港媒各种报道称她插足梁朝伟的新闻，所以张曼玉才会宁可一个人法国住，也不愿回到香港那个是非之地的。


    33、“鉴gay神器”刘姥姥（看看刘姥姥经常跟谁合照？刘姥姥相比于娱乐圈，显然对类似超级丹那样的体育圈明星更感兴趣？）；比如“歌手圈出<|message|>现象比演艺圈多”（老牌歌手圈的“旧船票”毛宁、“365个祝福”蔡国庆、“阿莲”戴军？老牌曲艺圈的“猴哥”？新生代歌手圈的“寂寞就好”田馥甄、“盖世英雄”王力宏？）比如演艺圈很多人都是早年为了出道，迫不得已改变过取向。有些人在之后虽然后正常了，但也留下不少心理阴影（港圈的大师哥“MaggieQ前男友”吴彦祖？）；有些人从此就被掰弯了（有名的“yan男郎”们？）；还有的人是天生就“与众不同”（之前扒爷爆过后来被河蟹的“京鲍”和“养眼”？“石光荣老婆的前夫哥”？）


    34、扒爷说过莲花姐担心拜入“胡仙”门下有不妥，所以最后选择的是“刺符”求红。而这个方法，其实比“拜入门下”更在圈子里普及。既没有风险又有效果，所以很多女明星都喜欢用这个方式，其中就包括今天的主角——女明星“白冰”。


    白冰早年的经历，一直让很多人觉得不可思议。因为她明明姿色就普普通通嘛，可她接到的资源却都是很给力的呢。不仅接连出演了几部“IP”电视剧，即使是在一些大制作里出演的“小配角”，也能跟其他主演大腕一样，参加前期的宣传、红毯等出风头。


    其实啊，白冰之所以能够如此，一是因为她背后一直是有某个香港的金主在捧她；另一个原因，当然就是她在香港求了胡仙的“刺符”咯~刺符后的白冰不仅外貌气质变得越来越妩媚动人，资源更是一路看涨，还得到了跟内地实力派的偶像小生——“胡歌”合作的机会。


    白冰当然不会浪费这个好机会了原本她只安排了团队发通稿炒绯闻（所以那时侯坊间全是“胡歌秘恋白冰，暗中追求”之类的报道），可谁知道，这样炒着炒着，白冰居然真对胡歌动心了！还被媒体拍到了她送礼物给胡歌的照片！这要是被金主知道了还得了？可白冰陷入情网已经顾不得那么多了，她心里就只有一个想法，那就是她要跟胡歌在一起！'
