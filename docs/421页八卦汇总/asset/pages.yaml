    霍思燕百科上说她00年出演《贫嘴张大民的幸福生活》，而正式进入娱乐圈。（剧里搭档就是年轻时的潘粤明）01年她在《铁齿铜牙纪晓岚》中饰演“香草”，是不是看起来楚楚可怜？03年她在《少年天子》中饰演的“乌云珠”，更是成为不少网友心中的“白月光”。05年她在《欢天喜地七仙女》中扮演角色比重大的“七仙女”。即使现在看，也是清纯又可爱啊。所以说刚出道的霍思燕资源确实不差，演的剧虽说不是高大上的类型，但是每一部国民度都很高啊。


