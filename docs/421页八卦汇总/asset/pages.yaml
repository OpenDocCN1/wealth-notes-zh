  md: '娘，两人结婚育有一女，取名张月亮。这段婚姻因张铁林事业心强烈，只顾工作一直想归国发展等个人原因，与波兰妻子和平离婚。女儿自出生后便一直跟随母亲在英国生活，很少回中国。


    张铁林相较于自己的那些遗落在民间的小燕子们，对前妻的女儿可谓是好的没话说。2014年特意为了弥补之前儿时对女儿的愧疚，选择与女儿高调亮相《极速前进》综艺节目，这也是张月亮首次出现在大众面前。女儿大学毕业时特意赶到女儿的学校，陪伴女儿参加毕业典礼。


    扒爷记得张铁林当时给孩子取名的时候就决定了，儿子叫太阳，女儿叫月亮。这真是现实生活也在养公主的感觉呀~可惜的是树立“好爸爸”形象的张铁林，真实的私生活却到处留情，不负责任！他甚至觉得“常玩两三夜情很正常”？


    扒爷鉴定：真·渣男无疑！怪不得张铁林会被两位旧爱一同告上法庭。女方们更直接对媒体自曝，已为其分别生下私生女和私生子两个孩子的惊人消息！


    其中一个旧爱是徐静蕾的北影校花同学侯俊杰，她与张铁林两人是1995年相识1997年恋爱同居。侯俊杰在1999年为张铁林生下一个女儿，但张铁林那时正处于《还珠格格》播出大火的时间。对于这段感情男方并未提出结婚还恶意谎道，最后侯俊杰忍无可忍后带着女儿离开了张铁林。


    离开期间张铁林也未承担起女儿的抚养费，直到2015年侯俊杰因女儿出国问题找到张铁林被拒认后，主动提出亲子鉴定并将张铁林告上法院。官司的结果可想而知，当然是亲生无疑，实锤落下后张铁林便付清了这个女儿18周岁的抚养费。


    第二个旧爱是暨南大学艺术学院高校女学生，女生比张铁林小二十岁。在校期间便受到张铁林热烈追求，陷入爱情的女生最后为他产下一子。女生在怀孕期间告诉张铁林这个消息，得到的回复却是“你们这些年轻女生怎么就不能碰呢？一碰就出问题。”


    写到这，扒爷快要拉不住蔡萌暴躁的行为......（扒爷+1）


    张铁林最后还是接受了这个私生子，他安慰女生让她生下孩子。但却一直未曾有结婚打算，之后女生自己带着儿子离开了张家。后期便发生了当年著名的，张铁林暴力抢夺“私生子”事件。


    对，小娄贝们没看错，就是暴力！！！


    女生与张铁林分开后便独自一人带着儿子过日子，可张铁林却恶意雇人去抢这个儿子，以至于母子分离多年。最后这孩子的母亲在家门口发生严重车祸，伤势被医院评定为九级伤残！


