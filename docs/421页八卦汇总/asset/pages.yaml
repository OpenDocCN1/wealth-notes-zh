    恋爱时被拍到的女人，叫得上名字的就有六七个，各个还都是实锤啊！谈恋爱时风流不改，没想陈思成结了婚还这样。他又被狗仔拍到大晚上和2个野女人“斗地主”。绯闻爆出来之后，佟丽娅正怀孕在家歇着呢。陈思成都这么渣了，粉丝们劝佟丽娅赶紧离婚，因为这个男人不会给她幸福。就连圈内一个男星“大猪蹄子”都发微博，让陈思成做个人！


    但最后人家两口子，并没有离婚！这一个愿打一个愿挨的架势，让不少人想去敲敲佟丽娅的脑袋，看看是不是被下了盅。下盅当然没有，因为佟丽娅和陈思成都明白人，清醒着呢。


    原来两人婚前就已经签订了协议，互相不会干预私生活。所以男方出去和小姐姐玩，佟丽娅不仅不会闹，还会在网上平息群众们的怒火。还会给媒体发红包，希望大家不要把事情再继续扩散。


