    # 3、掉价操作


    欧弟在台湾时一直处于不火的状态，能进芒果台完全要感谢汪涵。07年汪涵邀请他主持《越策越开心》节目的周年庆晚会，之后看好他便带他一起做了《天天向上》。虽说欧弟的个人风格是那时内地少有的类型，所以至蜜圈粉的~但他经常会出现玩脱了的场面，每次也都是靠汪涵及时救场！


    就连当年欧弟在布拉格举办婚礼的场地，都是汪涵跟当地旅游局的人打了招呼才帮他安排下来的。做大哥、做师傅能帮衬你到这一步已经算够意思了吧！可他在离开之后的回应却让人一言难尽……


    在全明星探爆出大张伟与经纪人隐婚领证时，他发了这样一条配文为“我经纪人长这样”的微博↓微博发出后得到网友们一致的反感，评论逐渐开始逆风。


    估计欧弟自己也觉得事态风云急转直下，发出不久后便删了微博，但是又发了这样一条这样的微博↓这画风被网友们指出有意暗讽汪涵↓


    后期就是欧弟在金星的《今夜百乐门》借搞笑短片吐槽，自己在节目中的位置被人顶了↓然后欧弟与韩庚在《今夜百乐门》里同台自黑调侃“罢录”《天天向上》的事↓


    一个是经纪人因节目大荧幕放了四张韩国女艺人照片，录制现场暴力叫停！后台破口大骂工作人员作势打人，后续恶意炒作事件！另一个是说走就走不留余地，俩人同上一台又聊起“罢录”话题，或许是嫌樱相惜了？


    这次过后共恐过后，欧弟又在参加节目《饭局的诱惑》中聊起《天天向上》哔嗒说道“每分每秒都在想念”↓


    一会儿吐槽，一会儿想念，这截然不同的态度转变算怎么回事儿呢？怪不得向来儒雅的汪涵在节目中主动向当期嘉宾苏芒提问，有没有遇到过悉心培养的员工，说走就走的？并继续追问再回来你接受吗？汪涵还在郭德纲做客《天天向上》时，直接发表了看似玩笑的“有眼无珠”言论↓这没毛病的恕人方式，怕是为了说教给该听的人吧~


    最后扒爷想提醒小妹贝们，做人呐，一定要记得知恩图报啊！


    # 34、吴睿轩


    前两天吴宗宪替他19岁的大儿子吴睿轩（艺名：鹿希派LucyPie）出面道歉，上了热搜。原因大概很多小妹贝们都了解了，因为他儿子带女友去医院看病时在私人Ins上发了条激进言论。“女友生病，要是没好起来，我就做炸弹，炸台北市政府，全民赔罪。”


    台湾瓜民们的攻击力大家应该也有目共睹过，所以这一言论发出后便被网友检举，还因涉嫌触犯恐吓公众罪被警方传唤。嗯，去警局报道的时候只有吴睿轩一个人……


    隔天，吴宗宪便带着儿子出席了三立电视台《综艺大热门》记者会，正式出面道歉并宣布儿子正式退出演艺圈。吴宗宪直接在出席发布会的时候就开始在镜头前痛骂儿子：“我真的觉得很白痴很愚蠢，我的努力都在你这里溃败了。你身上唯一一点亮度就是因为你是吴宗宪的儿子，那你在牛什么？没有家教的保护，还有什么呢？演艺圈不需要你这种咖，差不了你一个人”


    与其包庇袒护儿子引来大家更多的不满，还不如做出痛心疾首的样子怒斥儿子以此来显示自己的大义凛然。反正儿子是不可能入圈了，还不如先保全自己的名声，真·高操作，扒爷从这次更加看出吴宗宪果然姜还是老的辣！


    这次事件爆发后，扒爷发现吴宗宪其实一直对自己这个小儿子的演艺事业道路十分上心。'
