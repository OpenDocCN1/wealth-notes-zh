  md: '“Kimi走了，徐小姐要代替他笑着活下去”徐小姐有什么资格代替Kimi？别说人家早就有女朋友，光是之前徐小姐在录节目时的那些花式拉踩，她到底是怎么有脸面说出这些话的？


    都知道15年的时候，徐璐跟Kimi一起参加了综艺《我们相爱吧》。原本在节目上很是登对的两个人，不仅组成了大受欢迎的“慌张夫妇”，还圈了很多cp粉。可节目上大秀恩爱的两个人，却在之后状况频出。


    最早导致两家互撕的起因，是被网友发现女方的宣传主管泓小希，开小号黑乔任梁。就连Kimi精心准备的“告白演唱会”，都被这个女的恶意扭曲成“女方花钱帮乔任梁办的”。然而事实是这场演唱会，乔先生早在节目播出前的一个月就在排练了。徐小姐的团队在明知事实的情况下，居然还能瞧着脸在节目播出后，发通稿说“徐璐精心安排了演唱会给Kimi圆梦”？？被乔任梁粉丝反驳后，又让自己的粉头和营销号出来洗白，想把锅推给节目组。在发现根本没人相信之后，就立马撕破脸？要不是看她是个女的，抠衮真的想瓢脏话好吗！


    看到这里，如果粉丝还想强行洗地说“宣传总监说的那些，未必是徐璐本人的意思。”“经纪人总该是最清楚徐小姐的意思，最能按徐小姐指使办事的人了吧？Kimi去世的当天，微博上出现了不少无耻之极的营销号，为求关注疯狂在微博上造谣死因。在这种“键盘时代”，辟谣总不及造谣的传播速度快。在这种情况下，徐璐的经纪人蔡涛如，居然能点赞“造谣微博”谁特么敢信？


    参加节目时，两方出于公司利益或是个人发展考虑，最后意见不合、分道扬镳等情况，这些都还可以理解为人之常情。那么，在人家已经走了的情况下，就算是男女朋友，就是不是朋友，也不至于像徐小姐这样，一丁点尊重都不留、不愧于Kimi的最后一点热度不罢休吧？那点所谓的“流量”，难道真的比一条活生生的生命还重要？


    是，Kimi在录节目之前，就已经有了很严重的抑郁症，徐小姐并不是让他患病并选择结束生命的那个罪魁祸首。但就算不是直接原因，她也绝脱不了干系。Kimi因为跟她的合作，在两家团队互撕时就没少被她的粉丝辱骂；节目结束后，Kimi又因为说了“不可能跟圈内女明星交往”的话，被很多cp粉攻击；这些都很有可能，让Kimi更快、更决绝、更绝望地选择了结束生命。


    如果当初女方团队没有做出那些卑劣行为，也许Kimi就不会在之后那么讨厌徐璐；如果Kimi没有那么厌恶徐璐，也许两人即使成不了情侣，也总会成为朋友；毕竟，Kimi连当年一同参赛的很多朋友，即使如今都已经不在娱乐圈发展了，都很珍惜那份友谊。又何况是他原本视若珍宝、为她写歌的“可爱女人”徐小姐？


    如果Kimi跟徐小姐能够成为朋友，就不会有那些辱骂，也许Kimi就还能拥有一丝希望；如果Kimi跟徐璐能够成为很好的朋友，两人甚至可以像其他“夫妇”（如无尾熊夫妇）那样，捆绑炒作双方共赢。也许Kimi就不会对这个圈子、对这个世界失望，也许就能够让他重新振作起来…


    只是，世界上没有如果，也没办法可以让一切重来。徐小姐从做出决定的那一刻起，即使她事后想要扔掉那个“人xue慢头”，她的双手，也早已沾满鲜血了。与其妄想当“演员”出名得利，不如先搞搞清楚，什么叫做“生而为人”吧。


    # 21、曹曦文


    上一次同剧演员因为“抢戏”、“戏霸”互撕，貌似还是赵文卓与甄子丹的那场battle。虽说大部分圈内人由于不敢得罪甄子丹都选择了“支持甄子丹”或是三缄其口，但前段时间又一次爆发的“甄子丹被剧方手撕”的新闻，相信已经证实了真相如何了。'
