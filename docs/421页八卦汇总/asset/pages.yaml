    就是这么个女人，游走在各式各样的富豪间，一时间成为豪门太太眼中的毒瘤。也是因为她有美貌有手段，所以她后来就被赌王女儿何超琼介绍给了许晋亨。而何超琼是许晋亨的前妻，那时候两家豪门的世纪婚礼可是很轰动。当时何超琼和许晋亨没啥感情的结了婚，婚后也变成各玩各的。何超琼有了杨其龙，许晋亨有了陈法蓉。但豪门婚姻哪有那么容易离婚，所以何超琼为了继承权不能离，于是干脆让许晋亨主动离。所以她才会让小三姨李嘉欣上去勾搭他，果然顺利把许晋亨的魂都勾走了。


    许晋亨这次是一点也不避讳，两人被拍到过好多次激吻，酒店不拉窗帘的事也被拍到过。所以何超琼顺利以受害者身份离婚，然后李嘉欣就牢牢把控住了许晋亨。2年后她还'
