    # 24、阎清子&纪凌尘


    娱乐圈里只要流量明星恋爱、分手、结婚、离婚和出轨各种好坏事儿，只要一爆出就会立刻占据热搜。用钱把自己送上热搜的大有人在，不管出于什么原因，他们大多数都得到了自己想要的热度。就是黑红带来的烂口碑流量，在这些明星眼里也都无所畏惧，因为他们觉得有骂声就代表有人在关注他/她。对于忘性很大的观众来说，只要不是触及及底线的法律问题，大家很快就能无其间接接受了黑红明星自带的洗白路线。今天扒爷要说的故事情侣主人公阎清子和纪凌尘也走着差不多的路线！


    阎清子和纪凌尘的爱情，就像很多小女生憧憬的一样，打闹闺闺总有人咪着。在还没公开恋情时，两人的感情其实非常好，虽然工作处于不同领域，但也不妨碍小两口谈恋爱。自公开后的那几年，阎清子和纪凌尘就开启了分分合合的过程，吵架基本是每日必备的工作。本就有年龄差的两人，因此相处起来感到越发疲愈不堪，疑心很重的女方总想叨梢心性不定的男方，以防他偷偷摸摸，但只要分隔两地就没什么卵用。


    阎清子出道比较早，大大小小演过一些年度大剧，但却多数都是女配角色，跟她同期的同学都红翻了天，而她却在蹭热度碰瓷的路上停滞不前。眼看着步入青衣年龄的阎清子对自己拿不到好资源这点十分急躁，她觉得光扑在作品上也不是办法，所以把视线转移到了真人秀掀粉这一路径上。


    阎清子通过关系想办法搭上了这根线，然后她与纪凌尘商量着怎样靠着节目翻身，双双获利~确实节目播出后两人直接爆火，各自粉丝短短几天就增加了几十倍！节目当天到隔天阎清子和纪凌尘必上热搜，很多合作方看到这样的話題度纷纷考慮与这对情侣合作。


    在网友们都觉得两人的恋爱互动很接地气的时候，其实阎清子和纪凌尘心里早有了嫌隙。


    通过阎清子开始进入娱乐圈的纪凌尘，身边围绕的女生越来越多，而阎清子看着自己的资源往好的方向发展，也不再像以往那样执着于结婚成家。所以在节目播完这对情侣过了不到半年就分手了，只是并未对外公布出来而已……


    两人心里都打着小算盘，为了给自己捞到更多的利益，女方决定跟男方公司联手将他们分手一事来个连环炒作。男方其实没有女方聪眀，所以很多事情都是听公司的话~他们先联系好各家媒体集体放出“纪凌尘阎清子分手”的消息，再发出“纪凌尘被捉奸”的话题引爆微博，最后将舆论引导至第三者据足的绯闻上。


    在提高网友们的吃瓜热情后，再由男方公司带上自家需要提升知名度的艺人进行配合。之后，故意让人找出疑似线索的照片po上网，让事件中出现的几个当事人来回打几个疑似否认的太极，维持着阎清子和纪凌尘分手话题的热度。这样正好为男方公司里冒出的第三、第四者增加无数曝光讨论~


    有容和男方公司联手将事情舆论闹到最大后，再与各方分别发出否认声明，由女方亲自抛清“第三者”言论。最后一招使出最好的结果就是，不仅男方在众人面前能清洗之前的劈腿绯闻，还连带阎清子和男方公司的人也增加了曝光率，身价连带着一并水涨船高。


    经过几个月精心策划的炒作机会就这么接近尾声，他们都是这场互利互惠戏中的受益者。只是没想到后期男、女雙方过度的炒作引起了网友们的部分反嘲~但无论是对于阎清子还是纪凌尘来说，这样的一次操作总归是赚了的，两人一个宣传团队这样的年度大戏也'
