  md: '宝刚喝多了，陈坤还能忙前忙后的照顾。就这么个暖心小宝贝，赵宝刚当然是有了新剧就先想着他，让他当男一号，包贝尔当男二号。（赵宝刚是双，不像纯钓海岩那么小肚鸡肠，还是有一些男人义气的，所以才会把他俩都带上）陈坤那可是川剧里混出来的，情商早就练出来了。


