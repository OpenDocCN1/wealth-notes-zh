    阳光这名字或许大家不太熟悉，但她饰演的角色你一定都有印象！她是电视剧《冒险王卫斯理》中中心思细密、敢爱敢恨的三观超正女主白素。白老大和哥哥白奇伟的掌上明珠，知书达理的大家小姐与吴奇隆饰演的男主卫斯理是官方CP。在剧中开场一袭白衣出现，明眸皓齿让人无法挪眼~干净纯真本真、宛若仙子本仙，说的就是阳光了吧！


