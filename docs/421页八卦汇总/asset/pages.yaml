  md: '未传出过任何花边绯闻。起码就目前看来，张晋蔡少芬，是绝对有资格占据一个名额的。比起那对表面恩爱、私下各玩各的的夫妻，张晋和蔡少芬，恐怕才真的是“你在闹，他在笑”哈~


    # 15、林青霞


    前两天网曝一代女神林青霞离婚的重磅炸弹......说是林青霞因无法忍受丈夫在外一直有新欢，已与其悄悄结束了24年的婚姻，并拿了20亿港币赡养费。 当然一堆憨慨过往女神可惜了的网友们突然冒了出来~特别是有关林青霞过往的情史，又被纷纷们如数家珍的总结了一遍。其中她与秦汉那段情缘纠葛，真是逢提必说的重
    要环节。那么，今天扒爷也来给各位年纪小的小姨贝们普及下老故事吧！ 琼瑶曾经说过：“没有遇到过第二个可以和林青霞媲美的女子。”当年林青霞在美貌上完全无可挑剔，虽然1954年出生的林青霞到今年已经64岁了，但从她的脸上依旧可以看出曾经的美丽。
    在扒爷的印象中，林青霞年轻时期不仅拥有七八十年代的经典美人形象，还有着与生俱来的英姿飒爽感，所以在众多女星中依旧显得洋气十足。这一点，小姨贝们可以从她饰演的“东方不败”一角中就能发现。
    1973年，19岁的林青霞在台北西门町被星探发掘，出演琼瑶半自传小说改编的《窗外》正式踏入演艺圈。影片播出后紧接着片约滚滚滚而至，林青霞最火的时候同时拍摄了六部戏！《不一样的爱》、《秋歌》、《金色的影子》、《海誓山盟》、《枫叶情》、《八百壮士》，尬戏说的就是这种啊~
    但人家虽然尬戏却依旧凭借《八百壮士》这部电影，荣获了亚太电影节最佳女主角奖，当年22岁。 之后林青霞加入了琼瑶自组的公司，接连主演了十几部根据琼瑶小说改编的影片，正式成为琼瑶戏女一号的首席代言人。一直饰演着花瓶角色的林青霞虽美但无力，在这段时期她努力的寻求突破。
    1977年，李翰祥邀请她出演《金玉良缘红楼梦》，选角之初原定当时还是高雅清纯形象的林青霞饰演林黛玉一角。但导演看到林青霞后却相中了她身上拥爽气质，临时将角色互换，于是留下了俊俏英气的反串贾宝玉。
    1980年-1982年间，她凭借《碧血黄花》《慧眼识英雄》两部电影，接连两次提名台湾金马奖最佳女主角奖。 1983年，又凭借徐克导的电影《新蜀山剑侠》提名香港电影金像奖最佳女主角。之后，林青霞将事业重心从台湾转至香港。
    接下来的影片中林青霞剪短了一头长发，真正开始她的中性美之路。 姨太跟扒爷说，林青霞在徐克的《刀马旦》中完全是她心目中的英俊男神~这个新形象的达巅峰时期应该就是1992年，她在电影《笑傲江湖之东方不败》中出演大反派“东方不败”那次。那一年她因此角提名了香港金像奖最佳女主角，但最后斩获奖项的是张曼玉。不过这一中性美出击后已经让林青霞在香港一炮打响，之后无数女扮男装的片约涌至，她也接连出演了多个相同类型的角色~
    1990年，林青霞主演了三毛的遗作《滚滚红尘》，凭借获得了第27届台湾电影金马奖最佳女主角，这也是她一直期待的奖项。但说句实话，扒爷对于女神演艺生涯中的作品深刻记忆只有“东方不败”和她情感故事~
    在当时的台湾影坛上，林青霞与林凤娇以及秦汉、秦祥林并称为“二秦二林”，这里面提到的二秦就是接下来扒爷要说的两位男主。演艺圈的红颜虽美，往往情路却也十分坎坷，林青霞也算其中之一。她与秦汉、秦祥林的狗血三角恋如果放在现在发达的网络媒体上，'
