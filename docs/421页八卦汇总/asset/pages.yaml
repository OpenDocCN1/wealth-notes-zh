    杜志国一共结过三次婚，杜淳是他跟第一任妻子舞蹈演员杨丽的孩子。夫妻两人在杜淳12岁那年因双方矛盾激化，于是选择分开。但害怕孩子受到伤害，所以两人一直等到杜淳考上北京电影学院之后才正式办理离婚手续。


    当时杜志国在杨丽生养杜淳之后有被传出移情别恋，爱上当年与刘晓庆齐名的演员赵娜。杜志国与赵娜是经朋友介绍认识相恋，2004年两人正式结婚。然而婚后，这位新继母和杜淳的关系非常不好。那时杜淳正处于叛逆期，认为是因為赵娜的出現才导致自己父母离婚，所以他非常反感赵娜。杜志国在这一期間一直無法调停兩人的矛盾，常年累月夫妻之间也产生了一定间隙，矛盾也逐渐变大最后以离婚告终！


    杜志国与现任妻子郑卫莉是因戏结缘，这次三婚后杜老爷子就比较低调了，二人只共同参加湖北卫视一档访谈节目。但在2017年63岁的杜志国却被突然曝出婚外恋，“诱奸”圈外女性这一丑闻！


    当时杜老爷子表示自己遭到了陷害，但当女方公开录音和聊天记录抨出实锤后，便无话可说。在扒爷看来，无论女方是不是冲着钱来的，杜老爷子婚内出轨已是事实。安抚女方怀孕却不给名分，口口声声说爱惜家庭却依然与别的女人在一起，真是渣中之渣！


    杜淳跟杜老爷子真是一个德行，感觉俩人都是不求最好只求最渣。在扒爷看来，杜淳这样的人还是别随便结婚了，毕竞每个女生都是爹妈的掌上明珠，经不起这种渣男的伤害。


