    得到王晶的认可后，邱淑贞先在他的《撞邪先生》中饰演了配角。紧接着同年拍第二部影片《最佳损友》时，王晶就为她定下了女一号屈豆豆一角，还特意找来了刘德华做男主角，关之琳当女配。在片中邱淑贞与刘德华饰演情侣，也是从这开始邱淑贞有了属于自己的艺名，豆豆。

    王晶作为豆豆的事业推动大佬和饭圈唯粉，在邱淑贞十年的演艺花路上可谓是费尽心思，只带一人。但邱淑贞的清纯路线女星并没有大火，直到王晶为她重新打造了个“性感小'
