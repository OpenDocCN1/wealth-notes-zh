  md: '杨丞琳解释，虽然恋情得到了双方家长的同意，但因为事业发展，最后不得已分开了。虽然这段恋情是因女方的事业分开的，但不得不说，杨丞琳上一段恋情却是前男友的问题才分道扬镳的。


    众所周知，杨丞琳和唐嫣的前男友邱泽也发展过一段日子。而两人是因拍戏相识，最后发展成恋人关系的。不过，在两人交往过程中，邱泽则保持自己的一贯套路，就算是被拍到了，也死不承认恋情，能拗则拗。


    后来杨丞琳在节目中不点名的说过，自己曾在一段恋情中十分卑微，根本感觉不到被爱，自己要看男友脸色过活。而且在交往的8个月里，两人只是见了10次面而已。最后杨丞琳闹别扭说分手，也被前男友一口答应，让她傻眼。


    此话一出，外界都纷纷猜测这位前男友便是邱泽。不过，在找到真爱前，谁还没遇到过几个zha男呢？更何况，现在的杨丞琳不是已经遇到了好男人李荣浩了吗？不过小姨贝们还是too
    young too simple了！


    要知道，李荣浩在晒出亲密合照之初，就被好友爆料，他和前女友陆瑶分手没两天，就迫不及待和杨丞琳晒照要公开，一时让难以接受。虽然后来杨丞琳李荣浩在演唱会上的恩爱亲吻，受到很多人的祝福。但李荣浩的前女友也不甘示弱，晒出自己和李荣浩的亲吻照，隔空表不满。


    而这也导致杨丞琳被记者追问，自己是否是李荣浩的小三？既生气又无奈的杨丞琳只能反击记者说，每个问题都太针对了。不死心的记者紧接着问杨丞琳，关于李荣浩前女友晒出激吻照的事情。而此时的杨丞琳都已经笑不出来了。


    虽然，有人认为李荣浩有劈腿嫌疑。但是更多人觉得，这位前女友想要借李荣浩上位的心思也是不少啊！陆瑶在参加的节目中，嘴里说着放下过去，但另一边又一直碰瓷前男友，难免会让人觉得有蹭热度的赶脚啊。


    不过，话说回来，感情这种事，作为局中人就很难理得清了，更何况是旁观者的我们呢？还是希望他们且行且珍惜吧！


    # 24、徐若瑄


    许久未见的徐若瑄，最近在北京出席了“中国演出行业协会30周年庆典暨中国演艺品牌评选颁奖典礼”。活动间隙中，她接受了香港中评社的专访，在采访中，她大谈两岸演艺合作交流，并称“我是台湾土生土长，我是台湾人，我当然也是中国人。”


    emmmmm， 这段报道出来后真是一石激起千层浪啊！抓屡不看都知道，大家又把之前徐若瑄说的那段“亲日”(待会说)言论拖了出来…..


    估计很多年轻的小姨贝们还不知道徐若瑄这个人，来来来，又到抓屡的科普日了！


    徐若瑄，原名徐淑娟，1975年出生于中国台湾省台中市，中国台湾女歌手、演员。徐若瑄儿时一直住在出租屋内，因为家里穷，父母不断更换职业，面店、洗车店、服装店都开过，但都屡开屡倒，为此他们前后搬过三十多次家。


    抓屡从这件事看出一个真理，不是做生意的料还不如老老实实当个上班族。


    徐若瑄五岁时父母便离婚了，五岁之前徐若瑄一直跟着父亲生活，母亲那段时间离开台湾出走日本生活。早年间徐若瑄接受采访时曾说过：“爸妈离婚的时候，我跟弟弟是分给爸爸，男人不会照顾小孩，原本只是接我们到台北聚聚的妈妈，发现我们有状况了，就坚持由她来照顾我们……”'
