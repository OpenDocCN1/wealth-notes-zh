  md: '启了一波通稿宣传。小娥贝们要知道在娱乐圈里既然有宣传就会有黑料出现~这不通稿还没刷到位潘粤明前经纪人陈祉希就已经在微博上diss了。


    她发文称：“看了这篇文章内心就像看剧一样爽！我就是喜欢秦岚的富察皇后，她是乾隆心里的白月光，其她的人就别演了，演啥也洗不变，越作越死。”光在微博diss还不够，陈祉希在朋友圈还指名点姓亲自下场手撕董洁。


    陈祉希在朋友圈表示，“别用品行不好，道德败坏的艺人朋友，否则作品受牵连！别结交这样的朋友，负能量会传染。”“心疼某演员（陈坤），不站出来帮帮SB，自己的戏也不会扑那么惨！”“本想放过你，但自从（潘粤明爸爸）抢救，跟你联系想让孩子来看看爷爷，结果你却说没有义务。”“看上去像白莲花，也许是毒蘑菇！”


    陈祉希还在评论区直接称，“我骂的是董洁，这么明显还看不出来吗？”

    emmmmmmmmm.....被这么letter 上董洁都没出来澄清，怕是真有其事~


    不过对于董洁不让孩子见潘粤明和他的家人这点，其实也不是第一次被质疑了。


    2016年董洁带儿子顶顶参加《妈妈是超人》的时候，顶顶曾经说过“爸爸工作忙，没时间看他。”当时节目播出后顶顶的粉丝们纷纷去微博给潘粤明留言，一方面不满他没尽到做父亲的责任，一方面也想呼吁他有空多去看看顶顶。但潘粤明自己曾在节目中表示，已经很长时间没有见到孩子。每aq在顶顶生日的时候也只能在微博上发祝福。


    在扒爷看来，这怕是董洁一边瞒着顶顶说爸爸工作忙没时间看孩子，一边阻止潘粤明跟孩子接触？大人的事情自己解决不了，为何要苦了孩子，扒爷和娥太真是心疼顶顶！


    现在再说起董洁当年一步错步错的身影，真是让扒爷印象深刻！


    潘粤明是北方人，不太懂浪漫，嘴不会特甜，但心不坏。董洁也是北方人，做事很有主见，但长相比较有迷惑性，颇有南方女子的温婉。俩人能认识，还是因为合作一部民国年代剧。单看外表，他们绝对是金童玉女，还是那种特别有气质的类型。但抛开外表的般配，潘粤明和董洁其实并不合适。


    潘粤明家教不错，而且多才多艺，颇有些文艺小青年的意思。而且他的爱好也比较传统，喜欢品茶、收集紫砂壶、集邮。（这回是指真的邮票哈）而董洁呢，打小就上了军艺，练舞的时间远多于学习文化课，所以董洁肚子里没墨水，和潘粤明其实没啥共同话题。


    没话题也不是多严重的事，但三观不同这事却很严重。潘粤明就是个普通男人，因为从小教育，对金钱反而欲望不大，喜欢平淡过日子。但董洁就不简单了，对于身外之物一直很追求。没出学校时就认识了一个卖家具的老板，还和一个香港老板有点不清不楚。


    后来她就和一个大家都知道的温州富商在一起多年，这位大她十多岁的老板，和她家人还都相处的不错。两人是包养关系，富商要求董洁那几年要老老实实陪着，别接太多工作。而董洁很懂规矩，所以富商也乐意给钱给房子。


    后来合同到期后，董洁也就暂时和温州富商分开了。


    接着董洁后面几年就开启了三线发展模式。

    第一条线：她和潘粤明拍戏认识，并且渐渐相恋。

    第二条线：她和一个已婚外籍高管认识，并当了小三。歪果仁甚至为了她办了离婚，还把工作调到董洁的城市。

    第三条线：董洁转战HK市场，开始和老牌男星L认识，还成了pao友。

    等到有一天，董洁有了孩子，潘粤明就打算和她结婚。（所以不要问扒爷孩子是谁的，扒爷也不是专家啊）

    跟其他人比起来，潘粤明没那么有钱，所以董洁妈妈还不乐意潘粤明。在她心里，富商是最佳选择。所以董洁妈妈对潘粤明一点面子也不给，外人在时也会数落他。这时候董洁也不知道怎么了，就是要和潘粤明在一起，于是两人就低调结婚了。'
