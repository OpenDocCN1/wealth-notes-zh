    # 22、刘芸


    娱乐圈形象似白莲花一样的女星不在少数，但真正性格、品德、为人能配上这词的却要灭掉大半数以上的量。如果真是神颜说不定有些人还会忍着看看，可总有每样都凑不上的女星就非硬把自己往这上面凑~今天扒爷要说的故事主人公是刘芸！


    刘芸非北京人却总爱操着一口京音，现在已是有老公有儿的女人了。在外人看来比她大十六岁的歌手老公“郑钧”非常宠她，自从跟她恋爱后就开启言听计从模式，外界称之为“恩爱夫妻”。可扒爷不都说了是外界嘛，事实上刘芸到手的这些生活都是从别人手里抢来的！


    这些年只要做任何有关老公的采访，刘芸都会主动提及两人第一次见面就互生好感，然后三次见面后就定情了，之后相恋刚一星期就结婚了，这一举动显得十分敢爱。但事实却是，刘芸跟郑钧勾搭上时男方未与第一任妻子离婚，女方则还在跟古装小生演员“聂远”'
