  md: '其实舒淇的演艺路，在前期不过就是众所周知的那些故事。比如，跟某个天王的恋情，被天王家人拒绝最后分手；比如，跟自己的异性湾湾男神闺蜜王宇直是长期的P友，后来还差点喝多了大闹人家婚礼（导致男神的老婆对她也是颇有怨言的）；比如，扒爷之前就爆料过的，为了红、为了桃花运，舒淇在家里供奉了好多小宝贝，还专门弄了一间屋子来供养。


    当然这些都是老料了，扒爷今天要讲的是她跟内地某个总裁的故事：


    那时候，正是港台娱乐圈走下坡路的时候，不少港台艺人都纷纷来到内地捞金。当时圈子里一家顶级的经纪公司眼看要投拍一部电影非诚勿扰，导演也是圈子里很有名的那位冯小刚。这种资源可是多少人梦寐以求的！


    消息传出后，各大团队就开始纷纷把自家艺人往总裁怀里送。舒淇也听说了消息，可无奈那时候一是内地的观众，还有不少人对她的印象停留在“小电影”上；二来，她也没那个人脉。这时候，舒淇忽然想到了自己合作过的那位“大花”闺蜜——赵薇。于是舒淇便前去跟赵薇交涉，想借助她的力量拿到资源。但大家也知道，赵薇这个人可是无利不起早的主儿。没有点“投名状”哪能轻易帮她呢，可没想到舒淇也是足够豁的出去，直接告诉赵薇：钱我可以全部都给你，你只需要带我引荐就可以了！


    赵薇心想，反正今后自己也需要在湾湾那边扩展人脉，既然舒淇自己把条件开到这个地步了，那也没必要太得罪了她。于是，赵薇便安排舒淇，跟自己一起出席了“J圈”的一场饭局。舒淇不愧是豪放做派（自己的身体竟然那么多人都有过了，还在乎饭局上那几个人看吗？），又是陪酒又是宽衣解带的。


