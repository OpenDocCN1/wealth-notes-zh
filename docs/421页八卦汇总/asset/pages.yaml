    # 33、欧弟


    因为《天天向上》开播十周年，最近关于欧弟缺席的讨论相当密集，比如昨天的热搜：天天向上十周年，缺了你可评论区的字眼就没那么好看了，网友们多数都在吐槽……


    据说虽然欧弟没去现场，但也有视频连线。但在微博上关于这次缺席天天兄弟的重聚，欧弟也没有什么表示……他的微博更新状态还停留在7月28日的一条模仿言承旭的内容上：“教你如何一秒变言承旭……”
    。


    芒果台可以称得上长寿王牌综艺的只有两个！一个是何炅带着的《快乐大本营》，另一个就是汪涵主持的《天天向上》了。这样一档陪伴几夺走过青葱岁月的综艺，从7个人变5个人最后变成4个人。这次的全聚缺一岗位，未免让人唏嘘不已……


    大家应该都知道，俞灏明是因为烧伤而离开；田源是因为被卓伟爆出出轨实锤照而离开的；小五是回国服兵役；唯一一个最早下车的矢野浩二倒是有些许无奈的成份在里面；最后只有欧弟的离开扑朔迷离……


    可能有好多小婊贝们对于当初欧弟是怎么离开《天天向上》的很好奇？这次扒爷就来给小婊贝们开8一下欧弟那些年作出来的事！


    ——我是学会做人的分割线———


    +   1、卖惨人设


    欧弟在当年的《天天向上》里可是有着“黄金绿叶”的称号，跟汪涵的互动向来十分默契。他最后一期节目是在2016年1月中旬，之后就再也没有出现在节目中。随后节目依旧正常录制，但二番主持人的位置却已改为人气翻火的大张伟。


    在节目改版播出后，欧弟连发几条微博“人走茶凉”“老狗被人嫌，不如别家新狗帅”等似乎有所指的内容。这些让人摸不着头脑的言论，直接引发舆论爆发!导致各方网友及粉丝们全力抵制，纷纷diss刚上节目的新主持人大张伟恶意抢位。


    当一波脏水被泼上身后，大张伟也没有作何解释。倒是节目组官博首当其冲发出回应，大致意思是：不要带节目，我们明明有请你，是你自己不愿意来而已。官博还给了个台阶下，顺便再带了句回归邀请，可是直接被欧弟本人拒绝了。


    洒脱离开，微博叫屈！这波操作666666~


    +   2、忘恩负义


    在欧弟还未离开《天天向上》时节目收视便已大不如前加上个别主持人的个人原因以及方方面面的事情在同时期发生，使得节目陷入低谷期，收视率暴跌雪上加霜。


    在这一特殊时期，欧弟趁着节目要有大变时间，趁机要求节目组给他张片酬。再加上早前欧弟因事业重心转移，而长期接触电影、新综艺等各方面资源时常请假缺席节目录制，要走看起来是早在计划之中了。


    可当他有意离开节目组时却还拿休产假当借口，就连汪涵也在不知情下为他自圆其说。那时的欧弟未将任何安排告知他人，导致节目组所有工作内容都包含欧弟在内。


    直到临近《天天向上》改版录制开始时，才得出出来不了的结果。最后还是台里给大'
