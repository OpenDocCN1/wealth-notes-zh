  md: "熊奖，逼格一下子就高起来了。这部片子让张静初算得上是“横空出世”，之前那些打酱油的电视剧自然也就不再拍了。\n\n之后她又和印小天合作，出演了章家瑞导演的《花腰新娘》，拿下了第12届北京大学生电影节最佳女主角。\
    \ \n\n05年她出演徐克的《七剑》，还获得了第25届香港电影金像奖最佳女配角的提名。 \n\n06年《芳香之旅》上映，张静初凭借此片，获得了第30届开罗国际电影节最佳女主角奖，这可是国际A类奖哦~\
    \ \n\n07年张静初开始和香港导演合作，拍摄了尔冬升执导的《门徒》，获得了第27届香港电影金像奖最佳女主角提名。 \n\n这一年她又走向国际，在布莱特·拉特纳的《尖峰时刻3》中当了把“龙女郎”。\
    \ \n\n出道前几年，不管是拿奖的文艺片还是大制作的商业片，张静初的资源可以说是非常好，超越大花也是指日可待。可没想到，事业高峰刚刚到来，她却突然放弃内地市场，转战香港，演了不少烂片。《唐伯虎点秋香2之四大才子》、《天机·富春山居图》、《全城戒备》、《侠盗联盟》……还有一些没啥水花，娴太连名字都不知道的电影。\
    \ \n\n这真是典型的“高开低走”了，越混越回去。到了15年她居然又回到电视剧圈，演了几部配角戏，甚至还参演了网剧。 \n\n不是娴太“阶级歧视”，实在是“电影咖\
    \ > 电视咖 > 网剧咖”就是娱乐圈的现状。张静初混得不仅档次降下来，还都不是主角，十分心酸了。可为啥电影路都快接轨国际了，张静初却突然从内地转战香港当花瓶呢？当然不是胸袋被门夹了，传闻她是因为当小三，被导演太太逼走的。\
    \ \n\n网友们的回复里，就藏有很多信息哦。接下来娴太就要开始说说她和几位大导演的故事了。 \n\n张静初的第一部电影《孔雀》就是顾长卫拍的，而这是顾长卫作为电影摄影师改行后第一部执导的电影，可以说是意义非凡。没想到主角却给了毫无名气的张静初。自打这部剧开拍，顾长卫和张静初就传出了绯闻。有探班记者说张静初和顾长卫经常逛马路，样子很像情侣。\
    \ \n\n还有网友爆料，顾长卫并非因电影认识的张静初，而是在她上中戏预科班的时候就已经认识，所以他经常来学校找她。99年张静初排演毕业话剧《夕鹤》时，顾长卫还亲自扛着摄像机为她“掌镜”。\
    \ \n\n随着爆料越来越多，两人的绯闻越传越真，顾长卫妻子蒋雯丽虽然嘴里说着不相信，但她却又立刻带着一岁的孩子去探班《孔雀》片场。顾长卫和张静初的绯闻还没凉透，张静初后来又被拍到和章家瑞导演私下约会的照片。一块吃饭，回家2个多小时才离开，简直就像是谈恋爱。对啦，张静初能出演《花腰新娘》和《芳香之旅》，就都是因为这个导演力排众议定的她，也是“真爱”啊！\
    \ \n\n然而被拍到的张静初却不承认绯闻，还回应道：以后不会再演他的片了。因为比起章家瑞来说，顾长卫这个“伯乐”更厉害点啊。于是等到06年顾长卫的《立春》选角时，张静初依然是热门候选人，不过老婆蒋雯丽也有可能。\
    \ \n\n等到角色确认了，张静初成了配角，蒋雯丽成了主角。定角后的第二天就传出了张静初是第三者，顾长卫要和蒋雯丽离婚的消息。不过张静初在接受采访时否认了此事，还说顾长卫是个好男人。\
    \ \n\n我滴妈呀，不说他是好老师、好导演，说什么好男人？这不是公开喊声吗？果然到了影片正式上映的时候，张静初的戏份全部被删！只剩下谢幕时一句：特别演出张静初。戏份删了，电影发布会时也没有张静初的影子。\
    \ \n\n采访环节时，被记者问到为什么张静初戏份被删，顾长卫还支支吾吾，旁边的蒋雯丽也脸色不好。推脱2个来回后，蒋雯丽才草草回答一句“为了照顾节奏”。 \n\
    \n这么精彩的一幕自然被大写特写，转天消息飞满天，气得蒋雯丽没有出席后面所有电"
