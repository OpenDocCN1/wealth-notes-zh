- pgno: 261
  md: "好到把对方当成爸爸。简单介绍一下，王伟忠是《康熙来了》《黑涩会美眉》《模范棒棒堂》的制作人，真正的台湾电视综艺教父。\n\n杨千霈口中的王伟忠对她十分关心害怕她太瘦弱，所以只要有美食绝对拿给她吃。女方还几次三番十分不介意的在节目中主动提到她被王伟忠昵称为“小贱骨头”。扒爷觉得这昵称起的这么够�°,啊！\n\
    \n之后还是在《康熙来了》的节目里，杨千霈又以台湾演员屈中恒早年间拍戏认得妹妹身份出现。屈中恒，小姨贝们应该对他比较熟悉了~他是《春光灿烂猪八戒》里的孙悟空，《命中注定我爱你》里的“郝医生”，也算是台湾的“金牌绿叶”了。对，没错……接下来扒爷要说的就是姨太和小姨贝们都讨厌的那种干哥哥干妹妹剧情~\
    \ \n\n屈中恒和妻子Vicky一起约会的时候，这位干妹妹一同参与了这场活动，并且还希望坐在夫妻两人中间，这样方便她跟干哥哥讨论剧情……顺便还演示了如何蔑视人家正主的姿态~杨千霈发短信给屈中恒的内容也真是让人看了一言难尽……Vicky正妻正生病躺在家时，竟然看到丈夫和杨千霈在北京游玩的合照？\n\
    \n对于这一系列的动作都被这位干妹妹解释为Vicky作为正妻太敏感，我俩是清白的。在澄清环节的时候，杨千霈还娇羞的打了屈中恒，说不要讲出来啦~这要是放在扒爷身上，估计她本人那只手和扒爷挨打的地方都会被姨太给捅了吧！\n\
    \n那期节目最后杨千霈竟然还哭了并娇嗔的表示绝交算了，自己真的分不清和异性朋友交往的界限在哪儿？小S当场表示“该哭的应该是Vicky, ok?”\n\n扒爷觉得S和蔡康永说的话都很对，“够朋友的话就应该不要做这件事！”。\n\
    \n节目中间两人还被另一位嘉宾爆料，关于屈中恒送手表给杨千霈的故事。抖出因为私下未跟老婆报备便直接给杨千霈买了名贵手表当做生日礼物，事后屈中恒才补送另外一只手表给老婆的事。\n\
    \n扒爷真是不吐不快一句，真是给我们男人丢脸！\n\n除了这些台面上暧昧的已婚男性外，还有她在各大八卦周刊上的众多绯闻男友，其中最为著名的要数与霍家三少的邢段了~\n\
    \n2008年，杨千霈与霍启刚的弟弟霍启仁传出绯闻，两人被拍到逛夜市、喝酒、唱K同游一天。那时有很多人猜测杨千霈要嫁入豪门与郭晶晶当妯娌，但此事随后便被霍启仁携正牌女友现身当面否认。而杨千霈在赴内地录制快本时也澄清表示二人只是哥们关系……\n\
    \n之后就是和台湾餐饮集团老板黄宝世的恋情，杨千霈直接跟媒体认爱，承认二人是带着结婚目的在一起的，可最后也不了了之。\n\n两次的豪门梦碎后的杨千霈情史持续丰富着，从混血模特、台湾演员、萧亚轩前男友到台湾集团接班人全部括入囊中。就是这样一枚撩男小妖精在2016年与她大学时期的学长台湾纺织业富二代洪家杰结婚了，今年年初生下一个女儿。\n\
    \n扒爷记得当年小妖精刚嫁人的时候还跟媒体自爆每天不断哭泣，只因为自己太幸福了。\n\n不亏是在节目里被小S恕的，边哭边喊“打电话叫爸爸来”的女人。小姨贝们千万别以为她叫的是她亲爸，其实她一直叫黄子佼“爸爸”。高段位绿茶白莲花，就是她了~\n\
    \n# 4、翁虹\n\n前段时间景甜在微博上晒出与翁虹的自拍合照，一个50岁一个30岁同框还跟姐妹差不多。扒爷不由自主地看了下身边的姨太，夸了句“真美啊”。小姨贝们，姨太以为这句话是在夸她并表示很是受用~\n\
    \n来来来，逃过一劫的扒爷今天来说说这位90年代的三级风情女神翁虹吧~\n\n对于年龄较小的 小姨贝们应该已经不太熟悉了，但在八九零后的年少记忆里应该对于这位女明星肯定不陌生。扒爷首先想到的就是她在《春光灿烂猪八戒》里扮演的猫妖！虽"
