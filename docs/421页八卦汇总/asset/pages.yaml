  md: '当初大导赵薇落难，有的人选择站队大导，有的人就另谋出路，周冬雨就是搭上了圈内著名经纪人W才过了这一关。当然，现在的周冬雨又搭上了圈内炒作第一人Y，真是细不简单啊不简单。所以周冬雨这个人，即使和窦靖童分开了，她和前辈赵薇的关系还是挺好，没有受到太大影响。


    现在明眼人都能看得出来，周冬雨和女星马思纯玩得很好。一是因为马思纯有背景众所周知，前男友能入他们那个圈子就是靠着马思纯。周冬雨自然喜欢跟这样有资源的人一块玩。二是马思纯心思单纯点，才会和心眼多的周冬雨处得来。否则但凡来个聪明的，谁还会和周冬雨做闺蜜。


    后知后觉的王菲，却一直到周迅带着窦靖童去拜见了她跟陈坤的那位师傅时才知道，周迅这是把女儿“握”在手里了。


    也许有的宝贝会觉得，这有什么可要挟的？那么，不知道大家是否记得，前几天去世的那位蓝女士，当年是如何疯掉的呢？她被下降头后的内幕其实早在12年就被爆出过，以防有的同学不知道，扒爷还是简单说一下好了：蓝洁瑛当年跟“富二代”郑某恋爱的时候，曾被郑某的女性朋友计算。这个妹妹妹一开始故意跟蓝洁瑛套近乎、当闺蜜。在之后三人一起去西zang找法师“灌顶”的时候，妹妹妹就鼓动蓝洁瑛也做一个。殊不知妹妹妹早就买通了喇嘛，在做仪式的时候喇嘛就给蓝洁瑛下了降头。回去之后，蓝洁瑛不仅性情大变，从曾经的“温柔似水”变得喜怒无常；还经常出现幻觉，总说自己能看到gui，闹起来的时候为了把gui赶走经常扔东西。可这些行为在别人眼里，她就成了乱砸乱叫的“疯婆子”了。所以没多久，郑某就跟蓝洁瑛分手了。被失恋打击的蓝洁瑛，又遇到了被大佬强暴的事情，终于彻底崩溃了。


    喇嘛灌顶这种事，可大可小，轻则出现幻觉，重则一命呜呼。你说王菲能不怕吗？看看两人同台时，周迅气定神闲、而平日里潇洒不羁的王菲却反而常地显局促不安；也许你们就知道，扒爷说的，并非虚言谰听了。现在虽说周迅和窦靖童还开开心心参加活动，但私下窦靖童却经常去找一个女大学生玩，还被很多在校学生看见了。So，说不定未来又是一个新故事啊~


    # 老家伙系列


    # 1、何炅老师


    今天要说的这位男明星，我们就叫他“何老师”吧。


    何老师这个人，其实光看他的业务能力，扒爷是很欣赏的；而且他对朋友也是没的说，人品是圈子里出了名的好。但要知道，即使是小说里的“伟光正”的正派角色，也是难免会有人性的弱点的。所以何老师也不例外，一些嘈点、缺点、黑点虽然不如大部分明星那样所为人不齿，但也是相当精彩的。


    何老师出道很早，早些年也一直是“官方”的代言人。本来所有人都看好何老师的未来，认为这个年轻人前途无量；可没想到，那个在外人看来充满羡慕的位置，何老师居然说不要就不要了，而是跑去了自己的家乡“重头做起”。


    这里就又要分两个版本了：对外的说法，何老师是自己认为自己的风格不适合那里；为了寻梦，所以甘愿放弃安稳、另求发展。但实际上啊，这世界上哪会真有那么多“勇者”呢？何老师当年出走，其实真正的原因是因为他的“恋情”被曝光了。


    当然不是普通的恋情了！是“同x恋”啊！要知道，在那个年代人们的思想意识还相对保守呢，对于这种事情就是“想一想”都觉得接受无能。可谁承想，何老师居然被撞见（那时候还是员工宿舍）了跟男票在c上的“不雅举动”啊！'
