  md: '却还是好的。（他是真的蛮疼自家女儿的~）


    之后，杨幂为了借壳上市获得上亿投资，不惜走上“对赌”这条险路，杨幂自立门户的新公司需要在三年内实现税后净利润高于3亿元以上！其中还约定他们的公司在运营期间内不得出现核心管理人员、实际控制人员和核心艺人退出公司等变动状况，因为这些原因所以这对夫妻撑着。就算现在杨幂和刘恺威的婚姻感情早就emmmmm.....但也不会轻易公布分家的决定，毕竟对于这两人而言，他们更看重自身的利益。


    可好不容易才有了喘息的机会，又出了一部大热的“桃花树下”的作品圈了点好感回来，却立马又遇上了一直躲在暗中的倪妮的“灵童”，被爆出了“公益丑闻”！这一波未平一波又起的灾祸不断，难怪此前一直苦心保养的杨幂，仿佛一夜之间便苍老了十岁！其实在一开始杨幂是不慌的，一个是她仗着自己有“小神童”加持的好运，再就是因为她的那几个“竞争对手”，都被她“暗中发力”搞得不足以与她抗衡了！


    没错，扒爷终于要给大家八到“小宝贝”究竟是如何让“供养者”身边的个倒霉的这一部分了！之前坊间就有不少爆料，说杨幂的那些个“绯闻男友”相继出事，都是因为受了杨幂“小宝贝”的牵连。


    虽说这件事扒爷已经给大家缕清楚了，但小宝贝确实是有这个能耐的~通常情况来讲，小宝贝“蛊惑人心”的方式有两种：一种是“意念式”的，也就是说供养者只要在家跟小宝贝“沟通”，告诉小宝贝自己的诉求，小宝贝便会去“实施行动”（像太平当初被小宝贝狠整，其实就属于这个情况；毕竟杨幂那时候心里是很恨太平的，而小宝贝是可以感知人心的）；另一种是“接触式”的。关于这一中方式，以前就有媒体爆料过：早年有某个男演员（已经糊了）养小宝贝，在原本剧方已经定下另一位男演员主演的情况下，这个男演员居然想到，把小宝贝的“shi油”浸湿在钱包上，之后特意去了剧组导演的家里拜访，然后又把钱包“不小心”遗落在导演家。结果导演当晚就做梦，梦里不断有個声音“告诉”他，选男演员做男主角这部剧才会大卖等等等等。等到早晨导演起来后，就力排众议、死活非要男演员做男主角了！


    而杨幂这个人，扒爷也说过了，虽然平日里表现出来的仿佛“人人爱她”的样子，其实私下里她的同性人缘并不好。除了能够接触到她之前的的那位“好闺蜜”阿紫（，其他女星都对她避之不及（至于紫霞是不是经历过被杨幂用“接触式”的方法来“搞过”？扒爷会在“紫霞的故事”详细扒给你们喔~）~


    要说杨幂养小宝贝，从来都没有“害过人”那是根本不可能的。毕竟这个圈子的“饼”一共就那么几块，别人拿了自己就拿不到；所以为了利益、资源，哪怕就只是求自己的运势都是会变相地害了别人的了，就更不用说杨幂确实也存在狠整过一位小花的——“刘亦菲”。


    刘亦菲能够被杨幂“瞧得起”虽说是她倒霉，但也说明她的确是有那个实力，足以让杨幂这种人物嫉妒。要说杨幂之所以记恨刘亦菲，就不得不提起当年杨幂还是新人时的一个小插曲了~


    遥想当年，杨幂刚刚崭露头角便参与了一部“大型古装IP巨制”剧。杨幂那时候还是个初出茅庐的新人，还没有经历过后来发生过的那些可怕的经历，所以也算是活泼可爱。可在这个圈子里，没有背景、没有关系、没有钱，那就只有等着被别人瞧不起（不知道大家还记不记得，扒爷曾经在“四旦双冰”系列里，po过一张杨幂的图，里面是杨幂参加访谈提到自己以前的遭遇时，恶狠狠地说“早晚有一天我会让你们瞧得起我”，说的就是这个时候的遭遇了）。


    而当时的杨幂就属于这个情况，毕竟那时候的她一没名气、二没背景，不仅经常被那位“胡子太长、年纪太老”的导演（没错，就是x老师在“人妻芳芳”那篇里说过的那位）训斥，就连其他的剧组工作人员，对她都不像其他明星那样尊重。


    原本杨幂仍然想发挥自己的“天赋”去“结交”那部剧的男主——“黄晓明”，可谁知道黄晓明却对她完全不感兴趣，态度也是爱答不理的。其实要只是这样的话，杨幂倒也不至于记恨了那么多年，毕竟当时的黄晓明就已经是国内的当红小鲜肉了，不理她这种小角色也是'
