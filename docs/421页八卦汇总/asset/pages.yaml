  md: '至于英子能不能躲过这一劫？那就要看英子的命运咯～

    那英跟金星熟是很正常的事情，关注扒爷的童鞋应该知道，扒爷常说早年的娱乐圈是很复杂的，身处其中的明星多数都涉及到“站队”：比如以张艺谋为首的“西北帮”；以钢炮、华谊为主的“京圈”；以本山大叔为核心的“东北帮”。后来由于资本入驻，这才让一些小帮派合并或者解体的，但曾经身处同一个“帮派”的明星之间的那份交情还是在的。

    那英和金星当年就都是东北帮的成员，两人虽然是同岁但金星比那英大几个月，所以那英以前就叫她金姐；而且金星的履历和地位在当时也比那英高、比那英早。以前两人在一起就是平起平坐的关系，甚至那英还经常会出于演唱会等问题有求于金星，所以就出现节目里那种“那英在金星前面，显得像个新人一样拘谨”的现象了。再加上金星的“毒舌”、犀利，那英在她面前根本是玩不转自己“大姐大”那套的。否则金星随便把从前的那点料爆出来，对那英也是没什么好处的。（比如你们看金星撕的那些圈内人，有东北帮的么？）。当然，这些都是陈年往事了，东北帮已经随着本山大叔的没落土崩瓦解了。


    # 四旦双冰记


    扒爷今天之所以会以赵薇，为“四旦双冰系列”的开篇。正是因為赵薇现在，早就不算娱乐圈的人了。千禧年过后，娱乐圈里人才辈出。不光有一众才貌双全的小生横空出世，女明星阵容更是人才济济。其中尤以赵薇、章子怡、周迅、才女四人，最为出众。不仅她们每人都有
    removal 一部或几部的爆款代表作，观众缘也是极好的。于是，独得观众恩宠的四人，因此喜提观众赐予她们的“封号”——四大花旦。

    以下内容，不代表扒爷的立场，请大家理性吃瓜


    # 1、小燕子


    按照“出道时间”，有请今天的主角——赵薇。

    范冰冰一凉，别看大花们表面上毫無反应，心里指不定也会感慨：如今的日子也周迅淡了！也许“四旦双冰”霸占所有流量的时代，不是最公正、合理的时代；却绝对是最热闹、最让媒体人兴奋的时代。

    98年，赵薇被“万人追捧”的现象，让各大经纪公司看到了国内市场，在“造星”領域上的空缺和潜在的商业价值。一时间，不论是各大电视台，还是地方的媒体杂志，都以能够“请到赵薇”，作为自己实力或收视的衡量标准。这么被所有人“捧在手心里”，也让赵薇的能力越来越大。

    赵薇当年多有实力呢？举个栗子：跟她一起拍了“还珠”的范冰冰，因为年少轻狂得罪了赵薇，一直被暗里掖里地打压着。直到后来范冰冰找到了靠山，以及赵薇有了“更重要”的事情要忙，才得以翻身。

    这个稍后再提，我们继续说回赵薇。俗话说：眼看她起高楼，眼看她宴宾客，眼看她楼塌了。赵薇就是这么被周围的恭维声迷得乱了心境，结果一个不小心就跌下神坛的。01年年中，赵薇穿着一身跟“日本jun旗”极为相似的衣服，登上了《时装杂志》，一石引起千层浪！

    在全民的指责与讨伐中，赵薇一开始选择了避而不谈。事后她其实解释过，那时自己并不是故意不想出来面对的，而是实在不知道该如何面对。但对于“骂红了眼”的观众来说，“事发后间隔了两个月”的这份迟来的道歉，自然就显得没那么有诚意了。'
