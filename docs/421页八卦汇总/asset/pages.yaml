    当时邱淑贞不停向媒体解释，自己小时候曾经跌断过下巴，只是做了手术修复，并未整形。“但经多番解释后发现无效，绝不承认整容的邱淑贞只能在TVB的建议下退赛。由于TVB早就看中邱淑贞，所以在退赛后邱淑贞与当时的男友一起被TVB签下。与梁朝伟、邓萃雯、刘嘉玲、刘青云等热门演员合作电视剧《新扎师兄1988》……

