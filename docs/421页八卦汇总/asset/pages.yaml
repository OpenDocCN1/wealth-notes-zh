  md: '野猫"形象，从此成为一线女星。邱淑贞在王晶的建议下，放弃了清纯少女形象。


    开始转型之路，邱淑贞在第一部性感之作《赤裸羔羊》里饰演性感女杀手。这部电影是由王晶监制，当年票房口碑都很成功，邱淑贞凭借此片顺利提名了第12届香港电影金像奖的最佳女主角。


