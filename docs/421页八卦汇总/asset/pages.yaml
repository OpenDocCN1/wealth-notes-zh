- pgno: 404
  md: '1984年，王小凤接受当年炙手可热的影坛红人尔冬升的邀请，担任电影《错点鸳鸯》女主角。未接受表演的她，凭借天生出色演技令业界和观众均感眼前一亮。 同年，王小凤又参演了惊悚片《平安夜》，播出后她的出色演绎再次大受好评。
    在这一年第五届香港金像奖上，她同时获得最佳女主角和最佳女配角提名，并凭借自己首部主演电影《错点鸳鸯》成功封后！扒爷觉得当年王小凤初入圈后的星途真是一帆风顺，在用一部电影打响名声获奖后就片约不断。
    王小凤在获得影后称号后依旧不改豪爽性格，立刻推出了自己首个全裸写真。这一大胆举动引发大批舆论，媒体直接称其为才艳双绝的一线女星。不仅如此，这姑娘虎到上黄霑、蔡澜、倪匡三位老司机的《今夜不设防》节目时，现场上演了一场反将质问道：“你们男人婚后可以在外面养女人，我们女人为什么不可以？”
    这脾气不愧是当过“大姐大”的人…… 1985年，王小凤出演了令扒爷至今念念不忘的电影《僵尸先生》，这也是她获得“鬼后”称号一系列女鬼角色的原因。片中，她出演的鬼新娘小玉应该是所有女鬼角色中最不吓人的了。姨太让扒爷告诉小姨贝们，可以去看看她在片中和主角僵尸道长弟弟的小感情戏份，蛮有言情小说feel的~
    1990年，王小凤还和林青霞、王祖贤搭档主演的《迷魂记》，当时还处于恋爱中的王小凤天天秀恩爱的行动令其他两位女神羡慕不已。 1991年，次次出演女鬼角色的王小凤在大红状态时与前男友分手后，选择嫁给了当年从事IT行业的小老板许立信。嫁人后的她由于母亲逝世的原因导致原本就有的情绪病加重，为了更好改变自己的精神状态，王小凤选择与老公许立信搬到美国。
    理想总是美好的，现实却往往很残酷。 王小凤到了美国过不仅状态没有好转甚至越发严重，她自己在后期接受采访时称“到了美国不就又失常了，不仅自己打自己伤到手骨都断掉，还用头开始撞墙”。
    “吞100颗安眠药自杀，殴打国外警察，酗酒吃药……” 她在这中状态下老公许立信依旧离不弃，一边兼顾在美国越做越大的电脑事业，一边照顾着她的生活。为了不拖累许立信，女士甚至主动跟老公提出离婚请求，但被男方拒绝了。这种状态一直持续多年，直到王小凤干禧年初得到陈宝莲和张国荣先后去世的消息后，她才决定由老公送入疗养院接受治疗。
    王小凤在这期间多年毒瘾、酒瘾及躁狂症在院内显现的越发明显，疯癫的她一度想要杀掉自己的老公许立信。但是许立信依旧坚持照顾这样状态下的王小凤，并且在她病愈后将自己已做大的电脑公司以2.9亿美元彻底售出，并将获利的五成半分给了公司上下140名员工。据说，当年每人分得了约50万美元，按照当时的汇率折算下大约是人民币400万元啊！
    在许立信做出这样决定的后，王小凤也在治疗下终获解脱，不仅将吸了二十多年的毒彻底戒掉了，还开始虔诚信教静心。之后王小凤带着好转的状态，在老公的陪同下一起又回到她热爱的演艺事业。
    扒爷觉得王小凤虽然前半生的风雨太过艰辛，但还是得到了圆满的结局，这样的幸福真的来之不易。


    # 6、林正英


    咱先来回忆一下僵尸道长这部电影讲的是些什么~ 影片的故事背景设定在民国初年，富贵乡绅任发的先父当年威逼利诱求得一块风水宝地，经风水先生指点，下葬二十年后必须起坟迁葬，才能泽被子孙。任发请来道士九叔和他的两个徒弟迁葬，未料尸体已化作僵尸，由此展开一场恶斗。'
  merge: -1
