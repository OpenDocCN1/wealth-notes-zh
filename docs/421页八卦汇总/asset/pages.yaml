    费曼今年已经十岁了，长得壮壮实实，个子都快到爸爸肩膀了。不过个子还是其次，重点是颜值。因为伙食太好，费曼已经变圆了。而且在他爸爸的镜头下，费曼名式各样的古怪照都有了。


