  md: '为什么说这段经历是杨幂的屈辱呢？因为要是但凡换成了是其他的圈内大佬或是豪门来做，大家就都能心照不宣地知道这不过是“利益往来、各取所需”；可这位“霸王硬上弓”的主儿，偏偏不过是个小角色（所谓的某影视公司大佬，其实真正的大佬哪有那么low呢~），正愁没地方炫耀自己能睡到杨幂呢，于是居然拿手机拍下了“十八禁”的过程！！可怜的杨幂，当时连穿的“白色背心”都是在戏里穿过的那件。


    要是大家以为，杨幂在这件事发生后，会选择一怒解约那就大错特错了。都是圈子里的人，对于这种事就当是“419”了，无所谓吃不吃亏~只是，这个痴三也是可恨，居然在勒索不成后，把视频曝光到了网上！要知道，杨幂这个人之所以不被圈内人待见，就是因为她做事太狠辣。甚至连不少日后的“公关手法”都是从她这里模仿开来的！


