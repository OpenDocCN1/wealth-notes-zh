    # 4、杨洋


    娱乐圈内的小鲜肉们只要谈恋爱基本都是能藏就藏，大家看到自爆的大多都是有被狗仔拍到，避免来日担心就干脆承认了。也有很多因合作日久生情的明星，早年在一起时没什么人知道，所以分手后也还能安（藕）然（断）自（丝）处（连）的联系着。


    扒爷今天要说的故事主人公杨洋就占了上面两样~


    杨洋从小受纪律管束长大，少年时期进圈的他有一位青梅竹马的初恋情人“晴儿”，两人度过了几年甜甜的暖昧时期就在一起了。成名前的杨洋没有太大野心，单纯的他觉得能和晴儿走到最后，但是随着公司老板对下面演员非常不好的原因（优秀的小婊贝应该知道扒爷隐射的是sei~），导致杨洋有了离开的心思。


    杨洋很快为自己找好了下家，然后将老板告上了法院，虽然未能胜诉但最终也只是由下个东家为他赔付了百万赎身费。晴儿虽然也有同样的想法但却没他幸运，两人最终因意见不合决定分手回归朋友身份。（其实就是藕断丝连，毕竟那么多年打断了骨头还连着筋呢~）


    换了地儿的杨洋资源飙升，虽说不是大制作但部部爆款却是事实，人红自然又想往高处走，所以他在新东家没呆多久又再次出走。这个时候晴儿也从老东家离开了，两人私下的联系越发频繁，复合的迹象非常明显，可这种兜兜转转的情感一般放在娱乐圈总会有不一样的发展~'
