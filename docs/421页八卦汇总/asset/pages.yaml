    张歆艺常被称为“二姐”，一直是走大大咧咧、没心眼、粗线条的人设。然而二姐做的事情，可是一点都不“二”，毕竟能得一个“惯三”的称号，可不是单纯一个“二”就能解释。


    张歆艺被人熟知的三段恋情，每一段都不是无缝衔接，而是传说中的“骑驴找马”。


    张歆艺当年上中央戏剧学院，接了一部《风吹云动星不动》，由此认识了王志飞，开始了大家熟知的第一段恋情。是不是很眼熟？这王志飞有演技，戏拍了不少，圈内也是小有名气。但问题就在于这位可是65年的大叔啊，比起张歆艺大了16岁。更严重的是这位有妻有儿，是已婚人士。张歆艺从05年和王志飞认识，到最后12年分手，足足谈了7年。


    期间王志飞的妻子本来是不想离婚的，王志飞就搬出去和张歆艺住，最后耗到07年，妻子才签了离婚书。不过最后他俩也没在一起，因为张歆艺提了分手。当时王志飞在外拍戏，还觉得特别突然，试着挽回过，不过终究是散了。


    这里面“衷心祝你们幸福”，祝得其实就是张歆艺和她第一任老公杨树鹏。两人结缘是因为张歆艺拍了杨树鹏导演的电影《匹夫》。


    说到这里婶太给大家梳理下时间点，王志飞发声明虽然是12年3月，但从11年7月两人感情就出现问题了，而这时正好是《匹夫》的拍摄期。12年4月电影上线，6月就传出了她与导演同居的新闻！网友当然不相信是电影拍完后才有的感情。再加上王志飞说的话，张歆艺没分手就瞄上新人是肯定的了。倘若这段婚姻能够好好处，之前顶多算跨腿，但张歆艺与导演13年结婚后，14年10月又离了？！


    而张歆艺14年8月进组《解忧公主》，袁弘是男主，当时就有人传是袁弘在追张歆艺，所以这又是一出婚内出轨的戏码。袁弘追已婚人士，这样真的没问题吗？而且被卓伟爆两人同居时是20号，为啥15号还要立单身人设？如果说5天后就能找到女朋友同居的话，婶太无fuck说。


    自打两人结了婚，秀恩爱是隔三差五，但是张歆艺整容被网友指出出来，做老公的袁弘还要不分事实的维护吗？别说6岁，就说跟年轻时比，她都长得不一样了，还不许网友说？


    袁弘自打和张歆艺在一起，网友说他被老婆带的也挺“二”，不过这事不能赖张歆艺。明明是袁弘一开始就“二”，啊不，确切的说，是“蠢”。有次北京如家旗下和颐酒店发生了女生遇陌生人袭击拖行的事件，袁弘作为公众人物如果想要搭上这种社会新闻，那么可以呼吁一下。


    在他明星都提醒大家注意安全时，就他非得抖机灵。大家买这些防狼器材是因为人心惶惶，寻求自保，他还在开玩笑。经过网友群嘲后，袁弘删掉了微博，然后又发了个感'
