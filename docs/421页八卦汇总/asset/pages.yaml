  md: 于让梁洛施接触“gui术”了。这种阴物效果猛、见效快，但后果也严重。一旦违反了当时立下的承诺，就算是师傅也无法阻止小gui的报复反噬。所以也要再次劝告大家：不管是什么困境，“靠自己”才是最安全稳妥有效的方法。一定不要总想着去琢磨那些歪门邪道，因为没有哪个偏门是能够永保无虞的~
    30、邵小珊，娱乐圈的知名“裸体”演员。之所以要加上“知名”两个字，是因为按照正常来说，没有几个从事这个职业的演员尤其是女演员，会愿意抛头露面地以这个职业当作宣传点。毕竟，在国内相对保守的传统下，就连汤唯都是因为在《色戒》里的大胆表演被吐槽了好几年，更何况是专职以此谋生的女演员了。而偏偏邵小珊却“不走寻常路”。
    遥想当年，她刚作为章子怡的果替演员拍完《夜宴》不久，却在电影上映后突然公开发声，称自己出演了影片却没有得到应得的“尊重”。原来，邵小珊当年通过客串《手机》中女主持的角色，跟冯小刚以及华谊方面的选角导演认识。由于邵小珊的性格大方开朗，所以在之后冯小刚筹拍《夜宴》时，由于剧情需要有“婉后”的裸露镜头，于是片方负责人便打电话给邵小珊，邀请她来充当“裸替”的角色。
    这里驼爷其实想说一下，在那时的影视圈（即使现在也是大多数情况）关于“裸体”演员，按照正常的影视制作程序，是都要签署一份“保密协议”的。即支付给裸体演员高于普通演员的酬劳后，还意味着裸体需要保守秘密。只是这份“保密协议”在国外更为发达严苛的影视制作流程下，是会签署合同的；而在国内，这只是一个业内人心照不宣的事情。
    这么说吧，如果当时邵小珊就提出片方必须在片尾加上自己的名字，那么这个角色肯定是不会给她的。这一点通过《夜宴》在上映时，利用各种“章子怡首次大尺度裸露”这类话题来宣传就能知道（要是一开始就定下来要公开有裸体这一点，剧方何必还要借此造势呢）。
    包括平时几乎不理会这类新闻的周迅，也在这期间站出来发声指责邵小珊。其实就是因为对于圈内人来说，邵小珊是违反了圈子里不成文的<|start|> 规矩。她只是利用了普通大众不了解的内情，才故意出来制造话题的，目的也很显然，就是想红。结果，邵小珊是红了，可她又得到了什么呢？依然没有谁愿意找她来担当“能见光”的角色，因为都知道她就是个“不守规矩”的人。而且还因此，失去了当时马上就要结婚的男朋友。
    最让驼爷无语的，是邵小珊居然还好意思跟媒体说，是剧方害她失去爱情的。可要不是她自己出来说，谁会知道这件事情呢？自己为了上位炒作，把男朋友作没了，后来闪婚的老公没多久也离婚了。这或许也是她如今“如此分裂”的原因。
    不过，这次炒作倒也有个好处。不少“大尺度”的电影，会为了让电影话题更足而找她来“锦上添花”。一来二去的，她在圈子里的接触到的人脉当然也就更多了。据她自己说，她是在03年就认识范冰冰的。在范冰冰还没爆红之前，跟她的关系也一度不错，还找她帮忙联系大师来算八字（所以说，胖冰一直都很信这些这件事真是圈内人都知道的事情）。有意思的是，当时的邵小珊，对待胖冰的态度可是截然不同的。不仅语气中跟范冰冰颇为亲近，末尾也不忘呼吁大家不要再因为这些事情打扰到范冰冰了。也不知道这其中究竟是发生了什么缘故，居然让邵女士在之后性情大变，突然就跟范冰冰反目成仇了？（会不会与龙儿章子怡有关呢？）
    这条消息是邵小珊07年发在博客上的，文章里不仅提到了范冰冰，还提到了陆毅。根据胖冰的作品信息，应该就是在她跟陆先生合作“少年包青天”期间了。只是这样一来，就有一些漏洞在了。首先，“少年包青天”第二部是在01年年初开拍的，并在同一年年中上映。随后，二人又合作了《一见钟情》，随后电影在第二年2月上映。但看过驼爷“四旦双冰”系列的宝贝应该知道，那时候胖冰可不是后来的地位，当时简直就是“前有小燕子，后有荡花姐”的局面。
