    # 18.1董洁（姨太版）


    这个暑假清宫剧倒是挺火，一荏接一荏的，因为里面很多历史人物都是重叠的，所以这些角色也难免被拿出来一次次的比较。今天“董洁 富察”的热搜已经挂了大半天了，PK的两方是秦岚饰演的富察皇后和董洁饰演的富察皇后，一水儿的都是吹董洁演的更好。


