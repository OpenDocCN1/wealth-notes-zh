    于是wuli金巧巧就用了一招炒作，把自己出淤泥而不染的形象树立起来了。那就是著名的“短信门”。金巧巧还义正言辞的回复，不会为了钱去参加酒席。所以人家可是拒绝潜规则的好姑娘呢。


    最后，凭借着嘘寒问暖、不争不抢、简单纯粹，金巧巧嫁给了于老板。


    要不怎么说她聪明呢，有的人嫁入豪门就膨胀了。但金巧巧却很少主动炫富，而是在家相夫教子，贤惠的很。所以于老板也乐意给她面子，让她好好享受老板娘的待遇。没有作品不怕，照样可以走马上纳，还可以走出4分钟的记录。41岁这种非整岁生日，也还可以有那么多圈内明星来参加。而且章子怡都只画了一个淡妆出席，没有抢正主风头。


    金巧巧现在拥有一切，也是人家一路拼出来的。毕竟嫁入豪门可没有那么简单。不仅嫁进去不简单，嫁人后的生活怎么过也很重要。


    正房最需要什么？大气！


    只要那些小情人不影响到地位，人家也能付之一笑不去理会，用得着别人心疼吗？当然也不能太过放任，适当维护下主权，也是对外面那些女人的一种示威。传闻中的柳岩，她就直接在朋友圈diss了。微博上也不放过，说真小三都会说自己不是小三。（你真的不是说自己吗？）


    但diss也得看对象，对于爱搔搔爱撒娇的胖冰，金巧巧选择假装看不见。


    这是多么懂事的老婆啊！所以真正的勇士敢于直面这样尴尬的画面，还可以笑得出来。


    金巧巧的“成功史”和现在的“辉煌”，是不是会让不少人想起一句老话，“干得好不如嫁得好”。现在想想这句老话有些偏颇，毕竟很多人已经把“嫁得好”当成事业来做了。


    姨太balabala: 金巧巧其实没啥代表作，顶天印象比较有名的就是西游记里的孔雀公主。而且别看现在整的有点老气，人家当年也还不错，要不怎么能拿下见惯美女的于老板？


    # 19、袁泉&夏雨


