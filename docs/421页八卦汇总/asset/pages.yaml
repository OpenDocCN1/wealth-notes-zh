    善良的扒爷，就只能祝她好运了。


    # 22、杨紫


    娱乐圈里永远不缺年轻漂亮的小姑娘，贪心不足的某些人一般没亲爹靠的，就只能靠干爹。这些基本人都是想在圈内受到重金扶植，持续走红的，但真正成功登顶的其实没几个，甚至还有半路被骗的！今夭扒爷要说的故事主人公杨紫就属于最后一类~


    杨紫其实算高开低走（靠自己翻身）的典型例子，从小长相清秀的她应该也算是前两代人心目中的国民闺女。受欢迎是肯定不用说了，应该现在对家里老人提到她的角色名字，都能得到回应。


    杨紫在她国民度最高的时间认识了错误的伯乐“杨子”，这位包养了众多女星的男主对杨紫“一见如故”就动了捧她的心思。行事作风大手笔的杨子，是个动了念头就行动的人，这边刚想好计划另一面就已经叫人去跟杨紫谈签约的事儿了。


    杨紫的爸妈看到这位资金雄厚的主儿竟然主动找上门来，当下就毫不犹豫的把女儿交给给了他。当时还年纪尚小的杨紫觉得签约新公司那年是自己最幸运的时候，被捧到天上的她接受了杨子送来的隆重生日宴会！她的身边围绕着上百家媒体，还有从小到大都未曾拥有过的各类奢侈礼物，确实小姑娘就这样被迷住了双眼。杨紫抱着要当影视歌三栖明星的梦，期待着自己即将到来的精彩未来。


    杨子在人前以最积极的态度夸奖杨紫，给小小年纪的她戴上了无比高的帽子。（小婊贝们请自行脑补Y麻麻的无脑夸赞强操作……）他在杨紫面前承诺要将她捧成超一线巨星，为她打造专属IP影视作品，让她成为90后心目中的少女偶像。（秃总捧人总是同一套程序啊~）


    当杨紫沉浸在这个美梦中时，这个“天降大饼”背后隐藏的目的正在慢慢渗透出来！其实杨子签下杨紫主要是给自家小四“颖儿”找个替死鬼，因为那时他的小三“黄圣依”已经发现他在外又养了个新宝贝。


    心机极深黄圣依开始多方打探小四到底是何人，为了保护颖儿杨子想到了转移视线这'
