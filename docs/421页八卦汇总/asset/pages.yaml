    # 14、乌哥大鹏


    要知道，明星表现给外界的形象虽然都是很光鲜靓丽的，但内里如何可就不一定了。对于那些“金玉其外、败絮其中”的艺人来说，根本不存在“没有黑料”，而是只存在黑料被爆出还是没爆出的区别。


    今天要给大家讲的这位男星，我们就叫他“大鹏”吧。纵观大鹏的出道经历，绝对是“草鸡变成金凤凰”的华丽蜕变。初来乍到的 大鹏，只是 个没背景、没学历、没钱的三无青年。但是大鹏最会的，就是抓住机会抱大腿。比
    如一开始，大鹏还是个大公司的小员工，根本就 没机会进娱乐圈。可谁又能想到，这家公司的大老板“月日哥”居然是个双x恋的花心大渣男。


    遥想当年，月日哥作为行业巨头，却意外地没有绯闻传出，婚姻等恋情方面的消息更是扑朔迷离。正当所有少女都以为这是个钻石级的王老五时，坊间却突然惊现“月日哥强扰名校小花长达十年”的新闻！而且，经过记者采访以及知情人士爆料，还意外曝光出了月日哥有“钝”的倾向。


    其实这样的事在圈子里倒也常见，比如众所周知的“小王吧”就是这个类型，毕 竟像他们那个身家的大佬们，什么事情都喜欢“尝鲜”嘛~女人玩腻了，那么换换口味也是可以有的。


    当初还是个青涩少年的大鹏，其实在刚进公司的时候，就是抱着“出道当歌手”的梦想的。可惜大家都知道，这年头没有人捧、想靠自己的实力出圈的，那真是太难了。有多少本来正常的男明星，为了上位不得不出卖自己的肉体~不过大鹏可就不一样了，别人如果是“委曲求全”，那他就是“主动献身”了：自己去酒店、自己开房间、自己洗白白、脱光光地躺在床上迎接月日哥的到来！


    而这样的付出，也确实是很成效的~果然没多久，月日哥就给了大鹏机会。不仅让他当了公司旗下自制的某个节目的主持人，还给他版面让他增长收视，简直就是要多宠爱有多宠爱~


    如果你以为，月日哥就这样跟大鹏成了包养关系，那就大错特错了。毕竟，能跟月日哥主动献身的人太多了~而大鹏之所以能够做到“集万千宠爱于一身”，其实是由于他“放得开”。每次月日哥跟业内大佬聚会玩到兴头上，总是要把大鹏叫过来，让他为所有大佬一起“助兴”（用嘴巴神马的扒爷是真的不懂，不过这件事之所以能够被媒体知道，就是因为曾经有可怜虫不幸撞见过
    大鹏跟大佬们在包房里的“快活”情景） ~


    到了这步，如果是普通人可能就只会想到死死抱住月日哥的大腿就算了；可大鹏是谁啊，人家在给大佬“吸”的同时，居然还不忘要个联系方式维持关系，这样的人不红谁还能红呢？果然，有了这些大佬的关系，大鹏的事业上升得也越来越快。


    当然，在大鹏的后台关系网越来越庞大时，难免也会有膨胀的时候。比如其间因为得罪过一个在当时略显过气的乐队主唱，他就不 współp 而是... 等等。 比如，在拍摄短片期间，不论是经常合作的那位身材炒鸡有料的“御用女主”柳岩，还是请来的“岛国女u”。大鹏都充分利用了自己的“导演”特权：跟女演员们“白天假情侣，晚上真夫妻”呢~'
