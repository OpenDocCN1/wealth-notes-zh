    谁又能知道文章在之后由于过度膨胀，脾气越来越差得罪了一众媒体不说，还在某次言语间得罪了圈子里的某个大佬！最后导致他在送小宝贝回去“加持”的时候，居然被那位大佬暗中命人把它给阴了！！（关于这一段精彩的内容，由于不是几个字就能说完的，所以扒爷决定还是留待下个月在小号的“求偏门的男星”系列里给大家开个吧~）


    可恨又可怜的文章，后来果然被反噬得惨不忍睹，成了全网diss的渣男。


