    # 20、张铁林


    昨晚的《中餐厅》迎来了还珠“一家三口”小团聚，皇阿玛、蛤哥和小燕子来了个横跨百年的世纪同框。《还珠格格》距今播出已有整整二十年之久，对于各位小妹贝们来说这部剧应该是不可缺少的童年回忆之一吧！这次在节目中能够聚集张铁林、赵薇、苏有朋，也算是比较难得的事情了。


    当综艺还未播时便已曝出张铁林当嘉宾的路透照，结果引起网友们一阵热议。既然上了热门话题，那么今天扒爷就跟大家好好唠嗑下这位娱乐圈宝藏老男人，张铁林。'
