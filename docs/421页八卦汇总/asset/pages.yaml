    张嘉倏是在06年，凭借选秀“寻找紫菱”的冠军正式出道的。处女作便是琼瑶的女一号，对于一个“小透明”新人来说，这起点也是相当高惹。别看现在大家都在“吹”张嘉倏的颜，比赛时张嘉倏的“第一”可是没少被质疑“内定”的。其中的主要原因，就是因为她当时的颜值不够。初出茅庐的张嘉倏在一众选手中，的确显得又黑又干瘪。


    坊间那些传来传去的“黑幕”，其实到底也没能传出什么实锤来。与其信那些“空口言”，倒不如说张嘉倏就像锢弩搭着自己的实力，得到皇后的力挺那样，她其实也是靠着自己的聪明的、机灵，得到了琼瑶的认可。


    琼瑶也是真心想捧张嘉倏的，不仅找来正当红的保剑锋出演男二，还让另一位“琼女郎”秦岚给她做配。只可惜，当时已经是“琼瑶时代”的没落期了。即使有前期的“选秀”炒噱头，剧集播出后依旧反响平平。剧中的角色表演几乎都是在照搬“老版”，张嘉倏的紫菱也没演出陈德容的灵气。


    看完整部剧，除了那句炒鸡毁三观的台词，反正扒爷是真的什么都没记住。就像富察容音太过善良，没办法一直守护璎珞。琼瑶在影视市场的无能为力，让张嘉倏之后的发展愈发平庸。接连几部剧都不温不火，让她一度被嘲是“最难捧红的琼女郎”。一直到了11年，张嘉倏跟于正合作了两部剧，才有了些水花。


    说来也怪，几乎每部于妈的戏都能看到“琼女郎”的身影。看来于妈不光要“模仿”剧本，“审美”也要紧跟上琼瑶的步伐呢。现在很多人都以为，张嘉倏跟杜淳是因为一起拍于妈戏“结缘”的。实际上，两人在拍戏之前就在一起了。张嘉倏能拍于妈的戏，多半也是杜淳牵牢线的。


    杜淳早说过过，自己跟于正的关系很好，11年他还跟于正签过经纪约。张嘉倏就是在11年连拍了两部于妈戏的。也正是因为杜淳“提携”过张嘉倏，所以两人分手后，才会有很多杜淳粉丝骂张嘉倏“忘恩负义”。曾经的杜淳有多好，后期熊袁春望一样“变心、黑化”的他，对张嘉倏的伤害就有多深。


    12年年初才爆出恋情的杜淳和张嘉倏，合作的第二部剧还没开播，就被爆出了分手的消息。被爆出分手的起因，先是杜淳在5月末过生日的时候“借酒消愁”。之后到了6月1号，杜淳又发了条“分手祝好”的微博。正当所有人还在猜测两人之间出了什么问题时，张嘉倏却完全不想配合杜淳的“深情表演”。直接开怼也是rio刚了。


    张嘉倏的态度，也让各种“杜淳劈腿”的新闻在坊间流传开来。虽然杜淳一直强调“没有第三者”，然鹅他那位想红的“新任”可不愿意低调。不仅随后就有网友扒出，在杜淳生日当天，这位新女友就送过祝福。连520这种特殊日子，两个人
    encompass都暗戳戳地甜蜜互动过。


    so...没劈腿？

    杜淳大概也是看到没法再掩饰“劈腿”了，索性“破罐子破摔”：分手后不到一个月，就公开承认了这位新女友。


    so...说好的不会公开呢？

    两位蒸煮都“撕破脸”了，粉丝就更没在怕的了。果然，分手后杜先生家的粉丝，就写了一篇“质问张嘉倏”的帖子，细数张嘉倏的各种罪行。▲其他人都不信也是rio监'
