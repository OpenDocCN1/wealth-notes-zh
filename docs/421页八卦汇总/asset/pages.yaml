    张歆艺要是因为此而被打败，就不叫张歆艺了。在张译推荐的那部电影里，又顺利拿下了导演杨树鹏！王志飞当然不要了，蹬走！再后来张歆艺又婚内出轨，和袁弘在一起了，这就是后话啦。


