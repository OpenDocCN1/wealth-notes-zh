  md: '4、章龄之自己虽然没什么名气，但她的几个前任可都是赫赫有名的。比如，让胡彦斌至今不待见薛之谦的冲突，就是因为她而起的。当初薛之谦是章龄之的男朋友，后来又跟胡彦斌在一起了，这种前任与现任的关系当然没少起冲突了（最戏精的是：薛之谦红了之后上节目，居然还直接在节目上喊话章龄之“后悔了吗？”）。但胡彦斌是什么花心大萝卜大家也知道，所以两人在一起也没多久就分手了。分手后章龄之居然找了台湾的老演员陈为民，这个陈为民可是比章龄之大21岁啊！也是不懈章龄之的眼光是什么情况。跟陈为民分手后，章龄之才在拍摄《渡江！渡江！》时认识了陈龙，陈龙经过猛烈追求，最终两人闪婚（陈龙也比章龄之大10岁）。至于两人现在的婚姻，相信关注了扒爷的童鞋应该也有了“心理准备”了吧？都是情史丰富的人，逢场作戏的情况还是会有的唉~当然了，对于章女士来说，老公知道回家睡觉就够了。


    5、李连杰对前妻的那一段晶莹说并不光彩，但他对利智确实是重情重义了。当年利智被“赌王”看上，砸重金求包养，结果惹怒了自己老婆。要知道，赌王能发迹其实完全是靠自己的黑道老婆。所以当太太们知道了利智的存在时，真的是恨不得弄死她了（其实这跟利智当时在HK的风评太差有关，造成这种风评的原因，一部分是因为媒体夸大其词，一部分也确实是利智过于妖艳显眼），甚至不惜下达江湖追杀令誓要把利智弄死。


    其实这时候利智已经跟李连杰暗生情愫了，迫于威胁利智只好去了国外躲避，但合约还在HK的李连杰只好“拍戏伪身”了。不过这个所谓的“追杀”其实也没持续太久，因为那个一直在搞李连杰的黑道大佬，最后还是被另外那位如今也有名气的某黑色大佬的帮派给弄死了


