  md: '姨太看扒爷写到这儿的内容，已经开始骂起这对不负责任的父母了。扒爷觉得当年王杰浪子这一外号其实很符合他的个人成长历程~半工半读的王杰做过油漆工、小时工、驻唱歌手等等底层工作……


