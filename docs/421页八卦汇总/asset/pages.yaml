    # 17、陈柏霖


    娱乐圈最大的迷雾就是人设！很多人会因为一个角色或者营造打造的人设而喜欢上某个明星。但殊不知很多明星有时演技不咋地，维护自己人设倒是很在行。所以至今行走江湖还没有被大面积爆出真相的明星，大多都是公司和明星双方“努力”的结果。

    今天要讲到的这个男演员“陈柏霖”，就是一个比较成功的案例。陈柏霖的长相属于各花入个眼的类型：有人说他帅，有人说他不帅。但是他有演技，还能用成绩说话拿了不少的奖。所以早先他就是靠着一个港台剧里的备胎角色而大大走红的，在网络上还掀起一阵备胎讨论风潮，好多迷妹都因为这个角色而爱上他成为忠实粉丝呢～

    不过这位看起来彬彬有礼、灰常绅士的好演员，私底下其实很open呐！陈柏霖和他的好友基房祖名经常私下鬼混，夜店酒场啥的玩的都超嗨。除了兴趣相投，两人喜欢的女生类型都是一样的：大胸、大长腿、年纪小，要是能混个血那就最好了。好基友和陈柏霖从长相上就能看得出来是那种性欲很强的人，所以两人这方面经常搭伙玩，甚至连女人都是可以共享的！

    除了跟着好基友找刺激，陈柏霖这人有时候还嫌直接“真枪实干”没意思，还会和粉丝luo聊，来寻找精神上的满足。不过后来好基友惹了“大事情”，所以沉默了，陈柏霖也跟他疏远了很多。

    注意不要以为看到这就能猜到了，扒谷才不会写那些众所周知的料呢！

    所以这个luo聊的陈柏霖可不是那个都知的男星噢～因为陈柏霖做事是很隐秘的，要不是被粉丝转黑的粉丝说出来，这些事也不会有很多入知道。但陈柏霖也是个人，他再谨慎也会有疏漏，做事不可能天衣无缝。而且人设演久了自然就会有蛛丝马迹露出来。

    他的行事作风，圈内人也是有所耳闻的。所以这部戏的导演还有合作的女演员才会说，陈柏霖和角色性格完全不一样。那些会相信陈柏霖是本色出演的宝贝们，你们真的94傻啊。

    这个陈柏霖人设还有个闪光点就是有内涵。这点大家在看陈柏霖的微博，和一些社交平台就能知道。除了广告，陈柏霖发的都是几个字概括一句话、非常文艺范的那种，装逼满满啊！俗话说“装逼易上瘾”！所以陈柏霖对外还有一个形象，就是会多国语言，算上广东话，陈柏霖擅长5国语言呢～

    有内涵的人设其实压根就是公司给打造的亮点而已～因为陈柏霖根本就没啥高学历，甚至比起咱普通人还不如呢！缺什么补什么，越没文化就越要显得自己有文化！为此坊间还有他的一个牛掰传闻：在台湾一个答题节目里，他是第一个拿走10万奖金的人。不过这个想想就知道，他是提前知道答案的啊。'
