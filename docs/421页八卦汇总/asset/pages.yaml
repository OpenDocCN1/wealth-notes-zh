    汪小菲公子正喝在兴头上，便厉声呵斥让她呆着。赵薇好歹也是一线花旦哪受过这个气啊，便甩手就想直接走人。汪公子被打了脸趁着酒劲儿，冲上去就甩了赵薇一巴掌：给脸不要脸，真以为你是个腕儿了？


    终于被打醒的赵薇这时候才知道，原来对方根本就没真心爱过自己，于是她终于选择了跟汪公子结束关系。


    心灰意冷的赵薇，重新找到王大师，声泪俱下的承认自己的错误并求得了大师的原谅。当然，王大师能不计前嫌地原谅她的主要原因，也是因为赵薇的“谢师礼金”够多。王大师继续加持并指出赵薇：光靠女明星的光环是不够滴，想要被顶级富豪“看上”，你还要有内在。


    听听！这话多有道理！成天在“菜市场”瞎逛的人，上哪能认识“豪门”去？得先进入豪门的圈子才能有机会啊！于是，赵薇乖乖地“重返校园”念（镀）书（金）。


    之后，考察了赵薇一年的王大师甚是欣慰，于是便做主，把黄·有龙先生介绍给了赵薇。从此，赵薇的人生就有了“质的飞跃”，让她彻底从娱乐圈，转战金融圈了。


    不过，赵薇的婚姻却是有可疑的。毕竞她可是国内的一线女星，嫁的又是顶级富豪。但这两人却连个婚礼都没办，偷偷摸摸地就登记怀孕生子了。更让人疑惑的是，赵薇的老公也是相当神秘的。在恋情曝光之前，国内查不到任何关于他的消息，简直就像从地里冒出来的一样。于是，关于赵薇的婚姻，坊间便开始流传起一些带有“传奇色彩”的民间版本了…


    说回06年，赵薇跟汪公子分手后，竟然逐渐“低调”起来，平日里也不见她炒作发通稿了。也是在这一年，范冰冰逐渐兴起了。虽然说这其中有范冰冰寻到靠山的缘故，可范冰冰的“大佬”洪金宝毕竞在遥远的香港，即便有能力也不及赵薇在内地的“权力”啊。以前别说范冰冰能发通稿宣传，哪怕稍想要有点动作，都会被赵薇全网压（抹）制（黑）。


    难不成，赵薇有其他更重要的事情在忙？

    看看时间线：

    07年，赵薇全年几乎都在拍戏。

    08年，被媒体拍到了她跟黄先生的同框照，恋情被曝光。

    同年，赵薇跟黄先生秘密登记，并于10年生下了小四月。看起来没什么对吧！那么再看看这几年，国内又发生了什么大事情呢？


