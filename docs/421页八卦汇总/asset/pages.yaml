    有这样一个干净的背景，当然没人知道以前那些事了，然而老板觉得还不够，一个学生咋起步呢，于是就给她编，说她家里人有钱，厉害，有背景，反正就是宣传得可神秘了。她自己也是配合，还给老父亲送去外面拍照什么的，其实被人们发现都是假的，她父亲就是个普通人。这些都一些题外话，我们重点还是放在她的钻营上位上。她的路线和安吉拉baby真的如出一辙了，连抱上的大腿都是相差无几。上次扒爷提到“吴千语”，也提到了她的第一部作品起步超级高，都是大腕带着她的，而且那时候她的背景就已经是老子了。


    一个学生，是怎么一下得到老子的倾心的呢？这就要问问儿子了，因为是儿子的上贡。上次扒爷提到了，安吉拉baby连络两父子，父子并不是那么介意，因为儿子不承认，然而他心里还是会有那么一丢丢别扭的，只是安吉拉baby的存在让他不至于跟儿子明面上表现。


