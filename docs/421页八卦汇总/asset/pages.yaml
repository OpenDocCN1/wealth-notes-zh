    在她恋情公布后的转年，袁咏仪就和成龙合作了《霹雳火》。当时因为袁咏仪拍完电影也不配合后续宣传工作，不出席活动，所以让成龙感觉她工作不认真。甚至还去导演协会举报她，虽然对外没说姓名，但媒体一猜差不了就是她。一时间很多被得罪过的都出来吐苦水。


    这一闹还怎么混？于是她就转战内地市场。接拍了《花木兰》、《笑傲江湖》任贤'
