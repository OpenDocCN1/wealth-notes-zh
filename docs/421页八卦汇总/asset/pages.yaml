    曾经梁朝伟跟刘嘉玲的“七年之痒”时，刚好让梁朝伟遇到了一位红颜知己张曼玉。这位红颜知己张曼玉虽然不是倾国倾城，但跟刘嘉玲忠于追求“商场权益”相比，红颜知己张曼玉却是个跟梁朝伟一样，感情至上的女人。他们在一起不仅有共同语言，而且心意相通。当时梁朝伟甚至已经动了心思想要跟刘嘉玲分手了，要不是刘嘉玲去找了那位一直照顾自己的“南洋”高僧——白龙王，她就要失去梁朝伟老婆的位子了。


