  md: '神婆隐居的阳明山后山，盖了一座胡仙庙。女儿看到大佬这样做，更以为对方对自己是真心实意的了。


    当然，之后没过两年，这个大佬就原形毕露了。不仅被媒体抓包，劈腿了公司的—个“女服务员”，更是与多个女明星传出了暧昧绯闻。但这都是之后的事情了，我们还是继续说章子怡。


    章子怡去找黄神婆的时候，正是黄神婆的女儿刚刚生下孩子、却迟迟等不到“认可”的时候，为母心切可想而知她会多焦急了。这里要简单解释一下：黄神婆是有能力整大佬不假，但像她这样的修道之人，一是不可以主动伤人；二来也是因为黄神婆的女儿即使被大佬伤了心，在当时却还是念念不忘。再者说，小孩子是无辜的，黄神婆也不能让外孙没有爸爸。黄神婆知道自己再怎么劝女儿，女儿也是铁了心地就想嫁给大佬的。所以黄神婆也只好顺着女儿的心意，尽自己最大能力地帮女儿。刚好她从女儿口中得知，大佬的公司正想在内地开拓市场，还提到了当时正被国内所有媒体关注着的、赵薇的那位神秘的富豪老公。


    要不说女人呐，一旦为感情（爱亲亲情友情）焦心，智商都会变低。黄神婆以为，要是自己能够结交到赵薇那号人物，甚至要是能帮大佬牵线拉到赵薇老公的投资，那大佬就一定能娶女儿了。所以，黄神婆才这么卖力地帮章子怡，为的就是想让章子怡帮她结交到赵薇。


    其实大家都知道，当年章子怡和赵薇虽然从没“正面交锋”过，但也是没少“暗地里撕x”的。但章子怡为了保命，哪敢跟黄神婆说这些啊~听完黄神婆的诉求，她想都没想就答应了。之所以有这样的底气，也是因为章子怡确实跟赵薇的老公有过“交情”（在一起偷吃过）。于是就这样，章子怡带着黄神婆的保命符，回了内地拍戏，一边伺机寻找那个“特殊命格”的倒霉蛋。


