  md: '![](img/055f3fb69bcde98e1e3f873187ca8154_54_0.png)


    本来公司里的人就觉得，何老师这个人“娘里娘气”的有点过于斯文、不像个男人；但谁也沒想到，他居然真的会有这种取向！这种事别看放在现在可能就大事化了了，可这在当时那种大环境里，重点是要“挨批评”、“取消籍”的！所以，饶是惜才、想让何老师做幕后工作的领导想息事事件，何老师自己也无法忍受同事异样的眼光，所以只好辞职离开了。


    有了事业的打击，何老师已经够惨了。可更惨的是，等他回到家乡后，他的恋人居然也因为忍受不了两地分离的痛苦而跟他分了手。这差点让何老师因为打击而退圈，缓了好一段时间才缓过来！好在，大概是命中注定要何老师在娱乐圈发展，他居然得到了一位贵人——“戴军”的青睐！


    原来啊，这个戴军别看现在胡萝卜没什么关注了，当年也是红遍全国的当红小生呢。可戴军为什么不能长远发展下来呢？因为戴军也是个“钝”啊！在那个当红小鲜肉都需要“依靠富婆”寻求出路的年代，戴军在面对那些老女人时，根本就直不起来啊，你说他能发展起来么？


    事实上，何老师走后不久，圈子 Hutchinson的人就差不多传开了都<|message|>’d了这件事。也是在这时候，戴军知道了这件事，并且开始想方设法地联络到何老师。虽然自己的事业也并不算顶级，但比起还是小年轻的何老师来说，戴军的资源自然是要比何老师好太多了。而且，戴军这个人虽然爱耍嘴皮子，但对何老师也是真的好（甚至多年之后，何老师的“暖男”性格的形成，也很难说这其中没有戴军的功劳呢）。


    于是就这样，有了戴军的扶持，何老师也慢慢地重新振作起来。或许是出于“报复”的心里，何老师在自己的家乡根本毫不避讳自己跟戴军在一起的事情。不仅经常光明化日下出去旅行，平时也经常挽手逛街、恩爱有加。


    # 双排券恩爱


    ![](img/055f3fb69bcde98e1e3f873187ca8154_54_1.png)


    这样的日子要是能一直继续，也算是能像当年的哥哥和唐先生那样成为一段佳话。但万万没想到，随着何老师逐渐在家乡站稳脚跟、甚至还发展成了国内顶级的“明星”，而与此同时的，是戴军的没落、逐渐糊到没有了名气。这样的处境，让昔日一直'
