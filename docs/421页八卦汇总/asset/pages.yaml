  md: '正是这部戏，让陈金飞这个“圈外人”，身上自带的“目光短浅”、“不懂规矩”的真实本性，彻底显露了出来。他以为国内一众媒体的狂吹乱捧，就能证明刘亦菲有巨大的流量价值。妄想仅靠刘亦菲一人，便能在国内的娱乐市场，打下一片天。

    当“刘亦菲要签约美国经纪公司”的消息一经传出，华谊也终于明白，辛辛苦苦出钱、出资源捧红的人，压根就没打算跟自家签约。这让习惯了呼风唤雨的王氏兄弟如何受得了。两人跟陈金飞之间的梁子，也就此结下了。华谊随后更是跟京圈的一众大导都打了招呼：绝不许捧刘亦菲。而早看见刘亦菲不顺眼的各路大花，也都等着看她被整治的好戏，根本没有人愿意站出来帮她说话。这也是刘亦菲作为一个“曾经风头强劲的当红小花，却没拍过一部京圈导演的戏”的原因。

    由于跟华谊交恶，陈金飞也为自己的自大付出了代价。10年他的公司就被举报“涉嫌违法运营”，之后两年里也不断被当局调查，陷下了困境。随着陈金飞这边一出事，也彻底宣告着刘亦菲的“跌下神坛”。

    经历过从“爆红到”全网黑的刘亦菲，也悟出了“低调才长久”的道理。（短短两年就爆出了数不清的各种扒皮）哪怕之后陈金飞无恙回归，刘亦菲也依然不再张扬，始终保持着低调的作风。所以，当如今刘亦菲居然一改往常，几次三番地高调“叫板”剧组。也暗示着此刻站在她身后为其撑腰的这位“大人物”，显然已不是当初的陈金飞了。

    上集说到了陈金飞疑似遭报复，公司被举报涉嫌违法运营。而在教父惹上事的两年里，天仙的演艺事业也是一言难尽。不仅频频被爆出，她出席活动穿的礼服，都是“山寨货”这种致命low的新闻。甚至还一度传出一些，关于天仙妈妈的“恐怖谣言”。

    在台湾的某档综艺节目上，嘉宾公然在录制现场，亲口爆出了影射天仙的猛料。不仅给出了“金庸剧”、“女鬼新戏”等细节，甚至连现场音乐，都直接用了《情女幽魂》的BGM。这跟直接说出名字，也没什么区别了。虽然最后被禁声了，但想也知道这份爆料，指的就是“聂小倩”的角色，是靠天仙妈讨（qian）好（gui）了（ze）制片人才拿到的。这种“圈内人公开爆料”的八卦来源，实在是让人想不信都难。

