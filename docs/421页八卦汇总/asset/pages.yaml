    # 2、薛子谦


    大家还记得叶璇被网友吐槽“下降头”的事吧？在娱乐圈里，是真的什么事都有可能发生的。像“降头”就并不是什么泔人听闻的谣传，而是确有其事。比如年初被爆过“曾遭圈内大佬侵犯”的蓝洁瑛，就与这个有关。


    她被下降头的内幕其实早在12年就被爆出过，以防有的同学不知道，扒爷还是简单说一下好了：蓝洁瑛当年跟“富二代”郑某恋爱的时候，曾经被郑某的女性朋友算计。这个妹妹妹一开始故意跟蓝洁瑛套近乎、当闺蜜。在之后三人一起去西zang找法师“灌顶”的时候，妹妹妹就鼓动蓝洁瑛也做一个。殊不知妹妹妹早买通了喇嘛，在做仪式的时候喇嘛就给蓝洁瑛下了降头。回去之后，蓝洁瑛不仅性情大变，从曾经的“温柔似水”变得喜怒无常；还经常出现幻觉，总说自己能看到gui，闹起来的时候为了把gui赶走经常扔东西。可这些行为在别人眼里，她就成了乱砸乱叫的“疯婆子”了。所以没多久，郑某就跟蓝洁瑛分手了。被失恋打击的蓝洁瑛，又遇到了被大佬曾志伟强暴的事情，终于彻底崩溃了。


    这件事是发生在以前的，接下来，给你们讲一个最近的：现在一提起“降头”，大家总觉得这是南洋的巫术。实际上，最早的这类法shu，是源于我们的“道教”。'
