    1993年那会还是王杰事业最辉煌的时候，移民去加拿大治病休养之前与他的第二任模特出身的妻子莫绮雯结婚。王杰在节目上表示，结婚前这姑娘人品好，又温柔，很会照顾他和女儿。结果婚礼办完，刚踏上蜜月行程时王杰才发现莫绮雯是个两面派，对自己女儿一点都不好。


