  md: '土包子的赵丽颖合作了！要不然，一向“信自己”、喜欢单打独斗的baby，也不至于会去求别人合作了～


    不过一开始，baby在“时尚”这方面并没有没把赵丽颖放在眼里（毕竟那时候的赵丽颖确实没有现在“洋气”嗖～），所以也并不立刻就对赵丽颖“出手”。迫在眉睫、必须赶紧“解决”的，唯一能让baby倍感压力的，只有当上正挡在她前面、跟那家“资源公司”关系极好的刘亦菲！


    要知道，之前baby跟那家公司的所有合作事项，都是交由黄晓明手下的黄斌来处理的！本来有黄斌在，baby对于胜过刘亦菲那是志在必得的！可如今黄斌一气之下走了之，如果拿不到跟“公司”的合作，那baby之前的那些努力和心机可就全都得打了水漂了！


    baby苦苦思虑一番，也只好主动找到了杨幂联手了～因为她相信，如果杨幂跟她是一样的人，都是“为达目的不择手段”的狠角色；那么杨幂就也一定同样信奉“没有永远的敌人，只有永远的利益”的信条！


    杨幂看到baby前来，聪明如她当然很快就明白是什么情形了，毕竟她们俩也算是“敌人的敌人就是朋友”的关系：都想扳倒刘亦菲！虽然彼此都存了自己的小心思，可有了共同的目标，也是一拍即合的～决定好“联盟”，两个狠角色就立马展开了行动。北按照姐和baby的计划，两人是打算“暗中”联手、表面装“不熟”的，因为这样才好分别出手、前后夹击嘛！～


    于是，纵观那时的“战况”也是rio险象环生的：一个先是在坟间狂发“刘亦菲的脸惨了！桃花树上坐着的女人只有杨幂才最正宗”，以达到“如今刘亦菲的人气已经不行了”的现状；而另一个，则一边在坟间大肆散播“刘亦菲即将继续跟公司合作”的消息，一边跑去跟公司负责人说“你们看！这个刘亦菲多有心计啊！知道自己人气不好了，就赶紧发通稿说自己还要继续跟你们合作，这是在给你们压力呢吧～”


    要知道，在时尚圈可是有很多“暗规则”的，尤其是那种“全球顶级”的公司，确实是比较忌讳“提前泄密”这种事的（baby早年就吃过这个亏：那时候某个品牌方找她合作，结果年少轻狂的baby过于得瑟，提前透露了消息不说，还直接晒出了“产品图”，搞黄了合作还得赔钱～）。


    果然，在两人的联手出击中，刘亦菲直接成了“炮灰”，而baby果然顺利拿下了这一局的胜利。可眼看杨幂和baby还没来得及松一口气、庆祝首度联手成功，居然又出现了一场意外——螳螂捕蝉、“赵丽颖”在后！


    曾经的“不懂时尚”的赵丽颖，居然在黄斌的帮助下，没多久就也跟公司达成了合作！这下就连一向隐忍的baby都抓狂了：“公司才刚跟我合作，我这 enfoque 还没坐热乎，就又找了赵丽颖！这不摆明了是不拿我当回事么！”


    要知道，之所以过去杨幂和baby并没有太把赵丽颖当回事，就是因为赵丽颖这个人，并不像其他小花那样懂得“讨好、围络”来求资源；所以虽然赵丽颖的作品成绩不错，却一直够不到她们真正看重的“时尚”利益。可如今赵丽颖有了黄斌保驾护航，轻而易举就跟公司达成了合作不说；而且赵丽颖由于作品好，连路人缘和风评也比baby和杨幂强的多，眼看风头都要超过她们这两个“时尚宠儿”了！这要是让赵丽颖起来，那还能有她俩的一席之地么？


