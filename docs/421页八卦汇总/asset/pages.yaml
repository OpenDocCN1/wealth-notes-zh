  md: '己心里真没有ACD数？不是每个人都是王志飞那种老实人的。“前夫哥”撕破脸，分分钟上个头条，谁都捂不回面子。


    大概是这次终于被“震慑清醒”，又经历了各种“被扒皮”，张歆艺之后到现在的确学会低调了。甚至“低”到要不是现在爆出“怀孕”，很多人都快忘了有她这个人了。毕竟本来就是个“傻傻分不清楚”的名字，容易让人记不住。之后自己又非要把原本“很有辨识度”的一张脸，折腾成了千篇一律的“蔡明同款”。


    不过话说回来，既然现在难得了“爱情结晶”，况且孩子也是无辜的。大家还是应该送上祝福滴。只希望张歆艺这次是真的能够“白头偕老”走到最后，千万别再辜负了爱她的袁弘。毕竟，可是有相当多的“CP粉”，都在虎视眈眈地盼着接手呢哟！


    # 6、陈妍希


    接下来就让扒爷带大家来回顾一下，那些年，我们爱过的那个女孩陈妍希是如何跌下“清纯神坛”的吧！陈妍希是一个很容易让人第一眼就看上的女人。因为陈妍希的长相没有攻击性，所以第一次见面，一般人不会知道看起来傻白甜的她，其实是个聪明的女人，尤其是情商很高。


    不过要是有高情商却为人不厚道，那么就可以用“心机婊”来称呼了。当初陈妍希被签在知名制作人柴智屏旗下，柴智屏灰常捧她。可惜强捧不红，一直在剧里当女二刷脸。好不容易遇上一个人设好到谁演都能红的剧本，陈妍希也终于火了。


    能出演这剧本身就是柴智屏在出力，但火了后的陈妍希就一脚踹开柴智屏，仗着自己身价上涨，去了别的公司。可以说陈妍希要的就是利用价值，木有价值了就会立马say拜拜。而她这套看人下菜碟的本领，还曾帮她打好与HK娱乐圈的关系。


    HK有个非常有名的笑星女演员吴君如就被她哄得开开心心，还给陈妍希介绍了HK知名男星古天乐，意思就是相亲。然而陈妍希竟然看不上古天乐，可是当时湾湾女星陈乔恩很喜欢古天乐啊。女星陈乔恩是HK另一个笑星女演员杨千嬅介绍给古天乐的。陈乔恩和古天乐正谈着，半路不知情的吴君如大姐带着陈妍希插进来，就让陈乔恩很恼火，为啥古天乐还要相亲。于是冷战加上陈乔恩去拍戏，最后爱情的小火苗就灭了。


    即使陈妍希这次相亲失败，也没有得罪吴君如大姐，可见其哄人手腕之高。而陈妍希聪明的地方不止这一点。观众喜欢什么，她就会投其所好，因为角色清纯走红，说明大家喜欢这类型，那老娘就走清纯路线。于是私下穿着喜欢性感范的陈妍希，以后出入上节目都是保守打扮。别人问她前任有几个，陈妍希就敢舔着脸说没有！


    于是脸长得不妖冶的陈妍希，扮清纯那叫一个得心应手，加上湾湾女人自带嘟嘟的调性，陈妍希成功骗过很多人。靠着金主营销删帖洗白白，陈妍希顺利转战内地市场，还大炒一波清纯女神的通稿。但事实上，陈妍希在老家情史简直不要太乱。不仅拍戏时各种炒绯闻搞暧昧谈对象，还常常光顾夜店，私下里其实也是出来交际拽钱的人。'
