    鉴于可能会有部分宝宝不了解这个派对，扒爷就简单说一下吧：要知道，这个派对可不是普通人想去就能去的（当然，土豪除外）。如果你是想去里面当“玩家”，多数情况下，都是需要联系内地的一
    些“组织者”报名前往的。一旦报名成功，不仅有专门的航班安排你跟其他G模一同前往，到了之后还有专人安排你入住专供的酒店。


