  md: '林更新这个人，虽然外表看上去大大刚刚的，但要是这样就以为他是个单纯耿直之人，那可就大错特错了。林更新这个人能成功，靠的就是高情商+抱大腿。每个合作过的圈内大佬，林更新都一贵地喜欢溜须拍马一条龙，只为之后还能给自己的资源。林更新应该算是圈内人脉最广的明星之一了，别看狗子在综艺上显得傻乎乎、耿直，但私下里尤其是在那些圈内大导面前，表现得可是要多好有多好的。参见他对撕葱，被骂了还要赔笑脸这种态度，就知道他为什么能在圈里混得开了。当然，说这个并不是抨击反感他的做法，相反地，扒爷对于狗子这种能屈能伸的态度非常赏识。因为他知道自己没有金主捧，想通过自己去争资源这种做法并没有什么错（总比早年那些男明星比如绿大暗那样，靠“卖p股”上位要光彩多了）。


    所以，林更新其实才是电影咖，而且跟每个“带派”都能保持好关系。比如，之前在wd出现问题的时候，狗子就能搭档赵小花拍热门电视剧；比如，徐老怪的电影拍完之后，他又能跟京圈搭上线，接下来一部京圈新生代大导的电影，预计他就是主演。这样的好资源，估计圈子里有很多人都要暗中羡慕，也难怪王小姐抱紧这条大腿不肯放了。


    别看林更新在那些有权势的男人面前低三下四，在女人面前他可是不一样的。凭着自己的帅气外表，不仅圈外的女生喜欢他，圈内的异性缘也是很好的。今天的故事，就是他跟两个圈内女星的一段不为人知的“狗血三角恋”。


    遥想当年，林更新刚解决了跟前公司的麻烦，正处在事业上升期。由于要保持形象、笼络粉丝，所以即使他经常被狗仔拍到跟绯闻女友的照片，也从来不肯正面承认恋情，只强调自己是单身。因此，粉丝就认定了自己爱豆一直是单身，照片都是那些不要脸的妖艳贱货故意倒贴的。


    可其实那些绯闻里还真就有 一个是真的，而且这个“真女友”也是个圈内的女演员——“蒋梦婕”。蒋梦婕跟林更新因为同拍一部戏认识，虽然林更新这个人臭毛病很多，但蒋梦婕却偏偏就喜欢他的男子气概。知道林更新正是上升期，蒋梦婕也心甘情愿地当他背后的女人，跟林更新偷偷地搂着地下恋情。哪怕被狗仔拍到，也乖巧地闭口不谈。


    两人的戏拍完后，林更新又接到了 一部电影。这部电影其实就是个大烂片，林更新之所以会接，除了因为他一心想转型为“大银幕”之外，也是因为这部电影的导演之前就曾经跟林更新合作过。但由于剧本实在是太烂了，又不是什么大制作，所以很多明星团队都不肯接演。


    本来林更新以为自己就是剧中咖位最大的了，可谁知道片方最后居然找到了当时很红的女明星“张静初”！张静初也是个有故事的女同学，虽然观众不怎么喜欢她，但架不住人家放得开啊。为求上位甘愿放弃一切，什么自尊、肉体啊，全都无所谓！所以别看张静初现在不怎么样了，早年也是很红过一阵的。


    按理说，以张静初当时的咖位，她是根本就不会出演的。张静初是看到林更新的名字才答应了出演的。原来啊，大家都以为张静初只是为了上位才会出卖肉体。其实人家本来就是个很有欲望的“干柴”，就喜欢找一团“烈火”来“点燃”自己！冲着林更新参演的张静初，等到电影一开机就使出了浑身解数地勾引林更新。


    话说，张静初虽然年纪比林更新大，但姿色和身材还是可以的。而且，林更新本来就是个花心的雏儿，就算他当时是跟蒋梦婕在一起，他也压根没打算跟蒋梦婕长期发展。送上门的，又何乐而不为呢？


