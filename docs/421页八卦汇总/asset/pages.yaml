  md: '到了90年代末，赵宝刚开始自起炉灶，也是在这时，他认识了他的老搭档——海岩。两人合作的第一部剧，就是火遍全国的《一场风花雪月的事》（王朔通过关系，推荐了老徐当女主角；不过老徐也确实得到了海岩的认可）。紧随其后的《永不瞑目》更是直接让两人的电视剧事业达到巅峰。如今人们常说“京圈捧谁谁火”，其实按照当时以电视剧为主的国内影视行业来说，这夸的就是以郑晓龙为首的赵宝刚这一派人的电视剧。比之前几天扒爷说过的岩男郎陆毅，包括很多日后的一线演员如陈坤、袁立等等，都是出演过赵宝刚那些剧之后慢慢上成为一线的。


