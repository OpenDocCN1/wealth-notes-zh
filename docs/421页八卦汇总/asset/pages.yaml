    港姐一般都是直接签约TVB进圈，所以袁咏仪也不例外，当了冠军后也开始出演电影。这部《阿飞与阿基》直接让她拿到了金像奖的最佳新人奖。好运气简直是要待在袁咏仪身上不走了，后面她参演的《新不了情》、《金枝玉叶》又让她连着拿下了两届金像奖的最佳女主角。


