    19岁的吴卓林别看年纪不大，但却经历了很多：家暴、自残、举报母亲……简直不要太丰富。有前因才有后果，娱太就來给大家补补课，吴卓林成了现在的状态到底是为什么。很多事，还得从她妈妈吴绮莉说起。
