  md: '1998年在加拿大期间，倪震为香港社交圈名女人姚乐碧新书《随意随心》写了个情欲序言。之后，姚乐碧曝光了倪震写给她的情书。


    2006年，倪震被传出狂追香港演员陈颖妍，隔年又被爆出留宿25岁模特香阁。真的是轻则酒吧热吻，勾搭火辣女，重则直接把外面的女人带到家，更有媒体爆料倪震曾3次被捉奸在床！


    2008年，倪震更是直接被拍到与某女大学生“激吻”照片！这位浪子大少爷在与周慧敏相恋20年间，数次劈腿，几乎每年一单偷吃案。


    当倪震与女大学生的照片曝光后，周慧敏似乎是被震得激怒了，直接发了份分手宣言宣布回归朋友状态。抓爷直到现在都记得女神当年可做教科书式的分手信，小姨贝们赶紧来学学什么叫做高情商！通篇文辞优美，情真意切，句句秒杀！一没撕前任，二没提小三，不愧为优雅、涵养兼备的初代玉女掌门人。


    但在大家都以为周慧敏要重新开始的时候，一周之后又突然后降两人结婚的消息！！这剧情反转的速度让抓爷差点的心脏病！倪震还特意写有一封声明邮件。


    其实从这次对待分手的处理方式就可以看出，周慧敏绝对不是一个没有灵魂的花瓶。私下里的周慧敏，致力公益参加义卖去扶贫教孩子写字画画，弹得好钢琴，画得好油画，是真·才女无疑！


    在抓爷看来，周慧敏既可以在事业高峰期选择这个男人，又没有依附于他，而是默默充足自己的业余生活，从这点就说明她很有自己的主见。


    虽然说不能保证这样的爱与原谅，会在未来得到圆满的结局，但还是祝福这位初代玉女掌门人活得开心快乐。


    # 8、邱淑贞


    之前有网友偶遇一身休闲打扮的邱淑贞，50岁的她被网友吐槽身材不忍直视，喋讥类标题尘器而上。抓爷有时候真想把某些站着说话不腰疼的网友一个个拎出来！邱淑贞作为九十年代香港娱乐圈最知名的美艳女星之一，颜值巅峰时期，你们估计还没出生呢！


    邱淑贞让抓爷印象最深刻的角色是在《赌神2》里的饰演的红衣“海棠”。


    ![](img/055f3fb69bcde98e1e3f873187ca8154_267_0.png)


    李连杰版《倚天屠龙记》里的小昭~'
