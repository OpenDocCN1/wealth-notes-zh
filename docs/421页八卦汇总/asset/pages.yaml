  md: '其实现在坊间就一直传曹女士的金主才是这部剧最后的大老板，曹女士只不过是见不得光的金主的“发言人”。那么要知道，这部剧可是号称有“十家联投”的剧。主演赵小花作为门面与收视担当，也是参与分成的。“天工开物影业”，就疑似是黄经纪人跟赵小花合资的公司。


    那么，哪个才是曹小姐的金主的公司呢？


