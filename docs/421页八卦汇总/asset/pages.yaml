    # 18、周一围


    姨太看周一围上微博热搜了，原来是因为新剧书粉不满周一围出演。书粉也不是说他演技不行，就是觉得周一围整个气质和书中角色不匹配。虽然周一围被书粉不喜，但必须得说他能拍这戏，说明资源是越来越好了。毕业2年前，他还是个七八线。

    周一围这个名字也是这几年才被大众所熟悉。随着和老婆朱丹的恋情曝光，他的名气也开始上来了。尤其是他拿了第一届戏精诞生的总冠军，让他“有演技、为人低调”的人设建立了起来。

    他的粉丝也说，周一围是被埋没的金子，是金子就会发光。但“金子”自从13年开始接触大制作，发光到现在，这么多年怎么还嗨奖也没有？

    作为北电表演系学生，咋混成这样了？

    其实还真不赖北电，因为周一围就是高职班的，不是本科那种哦。英雄可以不问出身，但不能不爱惜自己的羽毛。去年他竟然接了大宝贝的槽暄创业剧，显然是不在乎刚刚做起来的口碑了。

    周一围一边自诩艺术家，持才傲物，一边却拍着烂片，也不知道是不是缺钱了。

    除了事业，感情这块，很多地方也让人看不懂。他对特家庭的神奇理论是一套又一套。


    朱丹作为以前的浙江卫视一姐，名气可是比周一围大多了。但是在家庭里，周一围却是实际的掌控者。以前朱丹很喜欢微博分享生活，后来周一围不仅不让她分享，还一点都不和她微博互动。在老婆生孩子这么重要的时刻，周一围也只是在微博上发个笑脸。然后又点赞了一条别人的转发，不点赞自己老婆的微博，这个操作也是很有意思了。

    不知道的人还以为两人一点关系都没有呢？

    若不喜欢公开秀恩爱，那么当年大马路上亲起来的人，难道是假的周一围？在微博上不互动也就算了，但在家里，周一围依然很大男子主义。所有家务都是朱丹承包，周一围是那种不做饭不做家务的“皇帝型”老公。而且周一围还曾说过这样一段话，他说找女友不是找善解人意，而是要找一个不用他说，就知道该做什么的女友？

    您这是找肚子里的蛔虫做女友吗？

    别看现在朱丹这么付出，其实她的性格，也不是那种隐忍型。但她在经历了一次失败婚姻和那么多男友后，对周一围是真的很上心。所以愿意为他做饭、照顾他，甚至提起他来都是星星眼。周一围说不让发微博，她就听话少发点。周一围为了工作牺牲家庭，她丧偶式带娃也任劳任怨。

    然而周一围根本不满足！借着拍戏的机会，没少和剧组女演员勾搭。作为主演，这部戏竟然都没有出现在周一围的百公里，这不是心虚是神马？'
