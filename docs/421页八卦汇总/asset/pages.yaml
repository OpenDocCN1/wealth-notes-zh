  md: '姥姥的一部“穿越”神剧宫。其实这也并不是杨幂的眼光有多好，而是因为她“来者不拒”！大家也知道她那前东家“剥削”艺人非常苛刻，杨幂在那根本就没赚到什么钱。所以等她解约之后，只要有资源，萧管钱多钱少都接，因为人家靠的是“走量”。况且，好运来了谁都挡不住。谁能想到那些不被看好的大烂片，只要杨幂接下来就都能火得一塌糊涂！这直接让杨幂晋为最红的小花，哪怕这其中夹杂着许多的群众质疑声，也依然挡不住她接资源。她还凭借跟杨树的合作，搭上了华娱。于是，就有了她跟周迅合作的机会。因为离间周迅赵薇不成而反遭对方的识破，迫使自己的小宝贝为了维护她而做了一系列伤害她人的事情。如果宝贝们有印象应该还记得，扒爷说过，原本杨幂的小宝贝的“有效期”仅有3年，这个“有效期”就是所谓的“契约时间”，超过了就容易反噬危害到自己。而原本杨幂的小宝贝在11年请回去之后，按理说应该能坚持到14年的。可谁知道，这期间由于“那位被反噬的大花”周迅去了西域高人加持后，致使小宝贝也在这过程中影响了法力。


    11年，杨幂请回小宝贝后，事业确实是肉眼可见地蒸蒸日上。除了中途因为得罪了周迅而被换角之外，可是影视歌三线开花的。也是在这个期间，杨幂跟拍戏时认识的“蜀黍”看对眼了。没多久，两人就公开承认了恋情。


    其实啊，这段感情一直到现在大众都不是很理解。毕竟对于当时的杨幂来说，不论是名气还是资源，都显然要比蜀黍更好。她为什么放着内地的小生不找，非要找一个“外来户”呢？


    关注杨幂消息的童鞋应该听说过，前几年坊间一直在传杨幂因为养小宝贝而反噬了自己的两任恋人。虽然扒爷已经澄清过，这件事根本就是子虚乌有。但那些报道中，有一个关键点却确实是真假不假：报道里说，杨幂男朋友俞灏明的母亲知道杨幂有小宝贝后，禁止儿子再继续恋爱。


    确实在内地来说，不论是明星还是明星的家人，对比港台艺人都是很难接受小宝贝的存在研究报告。反倒更是迷（传）信（统）的港台艺人，倒是更笃信这些。蜀黍作为来自港圈的“星二代”，从小就跟着父亲了解很多这方面的东西，所以对杨幂的做法早就见怪不怪，反而还能给杨幂不少意见呢~就像章子怡找到了汪峰一样，杨幂遇上了非常能够理解自己的蜀黍，自然也是难免会动了真情的了。


    有了小宝贝的加持，杨幂不光是情场得意，事业也是越来越顺。不仪成为了顶级的一线小花，而且还“自立门户”：先是成立了个人工作室，之后又是入股大公司、后来又抛股赚了一大笔（当然最终大家知道杨幂现在自己当老板了）~


    可渐渐地随着小宝贝的力量越来越弱，杨幂也意识到自己的运势有了低糜的趋势。尤其是在自己跟HK公司解约后的那段时间，每天都“噩梦缠身”被小宝贝纠缠的杨幂更是心力憔悴。而这个时期的杨幂也尝试过很多方法，比如之前就有离职的工作人员爆料的“放生”，那就是杨幂为了“消除业障”而做的法事来积福报。可惜，这些终究是没什么用~最终解决的方法，还是要送回去重新加持。


    13年年初，杨幂正式转约到了新公司；这段时间也算是杨幂的一个“小低潮”，因为小宝贝这期间并不在她身边。要说杨幂这个人，的确是有些运气的。事后懂行的朋友每每说起，都难免要感慨杨幂的好运。


    就像扒爷给大家讲过的，有不少圈内人由于供奉小宝贝都不敢要孩子，甚至即使怀上了，也会先把小宝贝送走或是去别处安置。像杨幂这样机缘巧合地刚好在小宝贝不在的时候幸运地有了身孕的，的确是很少见。


    杨幂也在知道自己有了之后，拼了命地接戏，确保自己即使接下来在孕期休息的时候，也能保证曝光率。这就又让杨幂做出了被不少路人吐槽的黑历史——尬戏。当时的杨幂，这边拍着电视剧，那边又接了电影，忙得不亦乐乎。其实最初杨幂只是想拍完“小矮人导演”的电影小时代就收工的，谁知道中途却又接到了一个电影分手大师，而且对方还指名让她来拍。'
