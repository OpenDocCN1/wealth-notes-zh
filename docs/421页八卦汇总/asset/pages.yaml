  md: '介呢这种“尬黑”操作，其实也是意料中的事。毕竟杜先生“插刀教教主”的称号可不是浪得虚名！对昔日的好兄弟他都能“插两刀”，又怎么会放过张嘉倪这种“分手时完全不留情面”、让她丢了一波路人缘的“渣”前任呢？只是这洗白软文的三观都要飞上天跟太阳肩并肩了！！知音体都没你敢写啊！！！上来就说自己是“纯米”，是生怕别人不知道是洗白文？还有“不能接受分手，当初就不该接受别人的爱”这种奇葩观点？“对于一个劈腿渣男”，前女友不祝福、不宽容就是女人人品不好？


    没了于妈，又因为拍于妈剧得罪了琼瑶奶奶，再加上教主在那边各种控评抹黑，张嘉倪在之后的一年多时间里，像被“封杀”一样，几乎销声匿迹了。只是杜先生也没能得意太久，不仅第二年就被拍到“劈腿小四”，去年更是爆出了杜老爷子被“仙人跳”这种丑闻。


    ▲“渣”这种品质居然也是可以遗传的！？


    当然，除了被恶意抹黑，张嘉倪自己的确有“不检点”的地方。毕竟“黑料”爆出的时间虽然是在分手前后，可“要大牌”这事在分手前就被爆出过。▲疑似为《精忠岳飞》的工作人员爆料：张嘉倪因请不了假，而故意撞工作人员撒气；而且张嘉倪刚出道演“紫菱”的时候，就传出过“要大牌把手中信气黑脸”这样的新闻，


    琼瑶在事后的澄清里，措辞倒是很“委婉”。可张嘉倪一个新人，有傲骨、有倔强是好，但过度的“执拗”就成了“特宠而骄”了。▲在自己的确有错误的前提下，面对前辈的指责，一个新人不知道要先道歉？这样的性格即使在职场里也不会有好人缘。在很长一段时间，张嘉倪只能够拍着不入流的剧，“高开低走”快要糊成了N线咖。可谁又能想到，演过“紫菱”的张嘉倪，在现实中居然也能像紫菱一样幸运：都有位有钱、有颜的霸道总裁爱她爱得死去活来！也像樊缨珞一样，都能嫁入顶级豪门！


    张嘉倪的老公买超，是做“婚庆设计”的。两人第一次见面，是张嘉倪去参加朋友的婚礼。据说当时张嘉倪刚一到场，负责婚礼策划的买超就对她一见钟情了。之后买超还偷偷跑去跟“新郎”要了张嘉倪的电话号码，接着就是一顿“猛烈攻势”，最后也终于成功打动了张嘉倪。14年张嘉倪生日的时候，买超就向张嘉倪求婚了。随着越来越多的人关注张嘉倪的这段恋情，买超的“豪门”身份也被扒了出来。超级富二代的身份，已经让人惊掉了巴了。再对比一下那位已经糊穿地心的前任，张嘉倪的幸福日常，更成了一众女生心里的“羡慕嫉妒恨”。


    有人祝福就会有人“眼红”。张嘉倪跟买超生了第一个孩子之后，就一直有人爆料说两人并没有举办婚礼，甚至恶意揣测张嘉倪是“未婚生子”，买超并不重视她。“未婚”就不用猜了，“结婚证”很早就领完了。至于婚礼，张嘉倪的确是从15年一直“遛”到去年，每年都要爆几次“补办婚礼”的消息。然鹅现在二胎都有了，而婚礼嘛，貌似还是没有要补办的动静。偏偏买超的职业就是婚礼策划，所以不办婚礼的原因也的确让人有点怀疑。


    可话又说回来，即使没有婚礼这个仪式，买超的种种表现也能让大家感受到，他对张嘉倪和孩子是真的很宠爱。就像樊缨珞根本无所谓当不当“皇后”一样，张嘉倪这样的真·人生赢家，可能早就不在乎那些“虚名”和“形式”了。


    因为“幸福”，早就写在她的脸上了。


    # 11、张庭


    这个“适宜分手”的八月终于要过完了。本以为爽妹子的新男友承认恋情，能给受够了“分手连击”的吃瓜群众们，一个圆满的大结局。结果，一条“疑似出轨”的热搜，到底还是争分夺秒地，抢占了“分手季”的最后一个名额。林瑞阳的反应倒也快，没等舆论发酵就先出来澄清了。'
