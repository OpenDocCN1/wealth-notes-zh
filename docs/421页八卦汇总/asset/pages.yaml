  md: '好的资源，开始重操旧业用起了当年在学校混日子的脏手段。


    为了让自己的事业更上一层楼，白百何将目标定在了大导“冯小刚”手上的一部冲刺拿奖的电影，陪酒这些肯 joint 定是少不了的活动。但没想到的是她没圈内人设大花“范冰冰”的手段牛，人家带着背后势力
    and 一流谈单经验，一出手就把白百何的女主给抢了过去。


    原以为靠着之前跟冯小刚“合作”过的关系绝对稳赢这局，所以好胜心强的白百何完全没想到自己会被顶替掉。为了抢回女主角色，白百何想到了最直接的方法，她去找到冯小刚跟他Shui了！（范冰冰抓住这一把柄，将消息透露给了冯小刚家正宫娘娘徐帆，结果换人的事更加板上钉钉了～）


    那边刚刚失去资源，这边白百何陪shui的消息就被戴了绿帽的陈羽凡知道了，他直接开启暴走模式。（虽然两人那时已经在私下偷偷办里了离婚，陈羽凡本身也在同小区养着小三，但对于白百何的所属权陈羽凡依旧不愿放手。）


    反正这俩在扒爷眼里都是不干净人（这已经不是白百何第一次陪睡被发现了，当年她在剧组睡外省鲜肉时还被陈羽凡打过，这次反击也是抱着老娘都离婚了有什么管我的心思～），所以大哥别嫌二哥好停！


    嫌弃就算是了这俩暴脾气的人还动起了手，当时陈羽凡质问白百何后得到了确定回应，一时没忍住就打了起来。女方虽然长相小家但也是混社会出身的好嘛，被动手后当然直接二话不说回击反打，现场战况十分惨烈。


    俗话说得好，好事不出门坏事传千里，两人动手后双双负伤，接到他们的工作人员赶紧忙着将两人错开时间送去了医院。骨折的骨折，断腿的断腿，这消息一下就被蹲点的狗仔捕捉到，他们赶紧引起此事的主要人物冯小刚。为了不让此事曝光，冯小刚被迫花了大价钱买下了这条丑闻，在活生生的套路里硬吃了一个哑巴亏～


    虽然这趟暗示让白百何得不偿失，但范冰冰也因此事被冯小刚记恨上了……就算当了人家的女主角也依旧被滞，甚在拿奖后都对句句暗藏着讽刺的意思，不得不说冯小刚果然是小心眼中的战斗机。


    白百何和陈羽凡经过这次事情后，虽然在人前依旧装着恩爱模样，但私下早就彻底分道扬镳，再看现在女方回踩洗白的方式真让人啼笑不已。


    # 11、王珞丹


    女明星要想在娱乐圈混得风生水起必定要脑子灵活，心机婊到处都是就看谁的手段更高明，这其中不乏也有想做心机婊却无脑的女星们～今天扒爷要说的故事主人公王珞丹就是这样的人！


    王珞丹属于先天条件一般的女明星，但入行后却运气很好，掌握大把好资源，只可惜后期发展一落千丈，甚至成为娱乐圈中典型的反面教材。王珞丹进圈至今一直属于个性“耿直”说话不讨喜，为人傲慢又清高的类型，说话不过脑子也是她演艺道路上的阻碍之一。


    扒爷记得早年王珞丹在和文艺大花徐静蕾合作时，自诩年轻优秀所以特别骄傲，王珞丹一直嫌弃前辈比她年龄大，所以明目张胆的台前台后diss对方，故意让人下不了台。


    （她完美为自己关上了一扇闯入京圈的大门～）


    如果单看颜值，王珞丹在她班上应该连前十都排不上，但奈何人家出道后还是有点手段的。刚入行没多久，她就学会了傍金主的这招，凭借清纯稚嫩的外表为自己招来了一位大户编剧“景康”，顺利一部开门红的现代剧《奋斗》。这部剧原定的女主是与她极其相似的女星白百何，但由于她要陪老公出游海外，再加上景康的强烈推荐所以最后改为王珞丹顶替。'
