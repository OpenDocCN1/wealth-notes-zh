  md: 'L女士想帮他，也是多少有点看上黄明的意思。按道理，解约就是拿钱赎人。但在海岩这里，可不单单是钱的事。好在L女士家里也不是吃素的，hong三代的背景让L女士可以和海岩抗衡一下。于是最后的结果是L女士不光不用赔钱，还带走了黄明。然而黄明这情况，自然不能和L女士最后走到一起，毕竟家境悬殊且还有那一档子事。不过黄明还是非常感恩的，有了自由身后，黄明还改了名字，希望自己能有一个新的开始。


