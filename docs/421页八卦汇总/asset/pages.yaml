  md: '在知道赵丽颖要“戴礼帽”之后，baby不仅给自己挑了一套更为出挑的礼服，还吩咐小矮女也“戴礼帽”赴宴！等到第二天小矮女与赵丽颖尴尬撞衫之后，baby当然就让手下把那些早就准备好的“惊！小矮女与赵丽颖撞衫，赵丽颖竟败给了小矮女？”通稿铺天盖地发到了网上。


    终于，在这样的狂轰乱黑之下，赵丽颖这个“新晋合伙人”就这样成了baby的“踏脚石”，被秒到了尘埃里。而另一方的两位胜利者，杨幂和baby，自然是因为大获全胜而欣喜的。可人一旦得意过头了，再缜密也容易出纰漏~


    被她们两人联手折腾了一番的赵丽颖和刘亦菲也不是傻子，事后当然早就打听出来到底是谁搞的鬼了。于是，刘亦菲和赵丽颖的团队便也想去网上指明真相。结果万万没想到，杨幂和baby或许是得意过了头，还是觉得“既然对方知道，那就也不藏着”了？当两人得知另外两家都要“报复”、说出真相之后，她们居然真的有恃无恐地大方公开了两人的“闺蜜情”、晒合照！


    这样一来，自然圈子里所有人都知道，“强强联手”的情况了！


    随着这个消息一公布，自是有人欢喜有人愁的~愁的，当然是赵丽颖这种“眼下还没找到办法来对抗两人”的；可“喜的”那个人，估计很多人就会大感意外了！没错，她就是扒爷之前说的——倪妮！


    要知道，倪妮之前可是baby的“塑料姐妹”啊~虽然圈子里没有什么真正的友情，但就像杨幂和赵丽颖的“公开”一样：明星的不经意的某个举动，其实就很可能隐藏着更深的含义！那些所谓的“合照”、“闺蜜聚会”，其实都是一种昭告天下的“联手信息告示”，来向其他人表明关系和立场的。


    倪妮瞧不上杨幂这件事，baby也是知道的。以此前倪妮和baby在一起的时候，没少一起说杨幂的坏话（baby也没少因为杨幂“手滑点赞”的事情diss杨幂）！结果现在这两人居然合作了，这对倪妮来说简直就是赤裸裸的背叛啊！


    而且倪妮还有一个更恐惧的担心：当时正是她用“灵童”搞杨幂的重要关头，万一baby透露了风声、让杨幂有所防备就全完了！但幸好由于baby和杨幂的“膨胀”选择了公开关系，这也让倪妮有了“提前准备”的时间，所以在大局上来说，这对倪妮反而算是件好事的。也正是因为这样，倪妮当时就把自己原本要到“灵童”准备好的时候才做的那场“远程的法事”，提前开动了。于是就有了杨幂的“公益”丑闻咯~


    之后，就是众所周知的赵小花被手撕的狗血情节了：代言“雕牌”被批没有安祖拉洋气遭全网喷；“金鹰奖”被质疑不如大幂幂的“水晶杯”含金量高...可结果又如何呢？通稿和水军刷出来的热度，根本就没有实质性意义。收视，才是唯一的证明。


    # 3.2杨幂离婚事件分析


    其实就像扒爷说的那样，北姐和蜀黍的婚姻破裂根本就是圈内人都心知肚明的事情。扒爷也不止几次地“明示”或“暗示”过宝贝们了。那么，为什么扒爷不能早点“确凿”地告诉大家呢？


    其一，当然是因为扒爷在根本拿不到实锤的情况下（扒爷不可能跑去人家家里，把协议书偷过来啊对不对？），说了也会被人家“否认”的，到时候难免又会有一帮人过来吐槽扒爷；其二，如果扒爷以一个有影响力的媒体人的身价来宣布这件事的话，那么扒爷所面临的情况，就很可能会跟“第一狗”一样了。


    为什么？且听扒爷从头给你细细八来~


    遥想当年，北姐在不满前东家的压榨后，便毅然决然选择了那家HK的影视公司。可出人意料的是，一心以为自己会在此开辟一番新天地的北姐，却遇到了狗血的“霸王硬上弓”事件（详情请回顾扒爷的“北姐的故事故事”→北姐不雅照：）！被那个暴发户灌醉后失身也就'
