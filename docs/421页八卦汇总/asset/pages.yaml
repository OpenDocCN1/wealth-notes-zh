  md: '不过，她跟彭于晏合作完刚好是13年，那时候正是龙儿要翻身的时候。结果自作聪明的白百何就因此以为，“胡门反噻”也不过如此！（她哪知道龙儿历尽千辛万苦才翻身啊）~


