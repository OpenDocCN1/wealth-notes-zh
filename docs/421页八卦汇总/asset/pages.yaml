    # 18、林俊杰


    要论乱其实在圈子里混的大多数人都彼此彼此，只不过有的维护好了人设无人知晓，有的 一次失足便众人皆知。很多人说自家爱豆业务技能牛怎样浪都行，扒爷对这个观点持反对意见！听歌归听歌，人还是别追为好，比如今天的故事主人公林俊杰就适用于这句话。


    林俊杰自小出生富贵，在蜜罐里长大的他对外谦谦公子、温润如玉，其实私下就是标准 的自恋狂魔，对人挑剔且超爱泡妞。他的自恋属于看到镜子都要多照一下的那种，扒爷记得几年前他身边有一位颜值很高的工作人员，跟他一起出行被粉丝发现后还意外转化了一些粉丝。


    这件事让林俊杰非常在意，因为他觉得自己被夺去了光芒，所以林俊杰从那时起就明令禁止这位工作人员跟随他时洗头和打扮自己。扒爷觉得其实真帅哥就算不打理自己也有颓废帅的味道，刻意遮盖也无用，就像扒爷一样！


    关于林俊杰撩妹这个事情，他向来有自己明确的爱好，D、E杯类的绝对都能入他法眼。他平时除了在混夜店找辣妹外，还会盯上自家公司的师妹们，比如双个出道的“小二”和清纯小妹金莎就都沦陷过。这些姑娘在林俊杰身边跟了一段日子，但并没有被当正式女友身份对待，只是纯粹玩玩而已。


    她们出道那儿混约一炮后也没做太多纠缠，毕竟林俊杰要想不让她们在圈里混很容易，姑 娘们被玩腻了后就被林俊杰遣散各自去寻别的出路。有傍金主男友的，也有整容复出的（金莎），花样多多但就是没有任何水花，毕竟上面提到的姑娘们都不是善茬，心眼、黑料都多的不行~


    她们虽然都糊了，但林俊杰却带着才子的光环常年在歌坛立着。人气依旧很高的他拥有大批死忠粉，确实扒爷也承认林俊杰的嗓子是真的好，但玩女人这点就真的让人一言难尽。林俊杰为了给自己建立痴情单身人设，抢上了圈内冷艳牌女歌手田馥甄给他当挡箭牌，他故意让所有人都误以为自己追女多年无果。


    其实林俊杰早就知道田馥甄不好男生这口，但他觉得女方一直不回应就代表这样的炒作对双方都有益，所以他就开始不停地煽动CP粉们的情绪。这些行为在田馥甄看来就跟大傻子一样，冷静理智的她也是有底线的，在男方多次抛来“追求被拒”的信号后，田馥甄直接对镜头前婉转回应没可能，断了所有炒作的可能。少爷气十足的林俊杰知道后非常不高兴，但他也还是要摆出一副“没关系，大家都是朋友”的痴情模样来应付媒体。


