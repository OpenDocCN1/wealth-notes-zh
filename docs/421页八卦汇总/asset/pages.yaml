  md: "可以往前翻翻看。\n\n据说，她当年曾主动在记者面前提及到自己在养小鬼，还表示因供养不周遭到反噬。人生坎坷的她在29岁就自杀逝世，之后有关陈宝莲养小鬼的传闻更是尘嚣而上，未曾停歇。\n\
    \n7年前，张柏芝在当年与谢霆锋离婚后就被港媒爆料，称她花几十万港币亲自赴泰请回五大古佛之一，有200年历史的骨董笋笋神护身符。张柏芝还曾在家中大设神坛被孩子看到，Lucas曾向其母亲的好友透露，自己在有神坛的房间里看到好多糖果、玩具和公仔。当时谢霆锋到家中为Lucas庆祝生日回家后便接连高烧3天不退，被媒体称之为被“煞到”，这件事吓得谢霆锋妈妈狄波拉在Lucas生日当天前往泰国请示白龙王。\n\
    \n甚至有说法称早在二人未离婚之前，就有法师建议把“小鬼”送走，不然就会接连走衰运，结果张柏芝没听劝说，之后没多久艳照门事件就爆发了。不过现在的张柏芝也活得滋润很多，她与谢霆锋也算各自安好的状态。\n\
    \n2013年，港媒周刊曾指出陈奕迅老婆徐濠萦近3年花百万港币供奉“小鬼”，只为求缚住老公陈奕迅以及医好男方的躁郁症。当时还有爆料称，徐濠萦是在贝克汉姆的纹身师Gaby介绍下，认识九龙城一家泰佛店老板，在对方知道下供奉小鬼。这种说法最后被徐濠萦在微博上否认了，并表示媒体的创作能力令她佩服，此事便一带而过了。\n\
    \n2002年，一代巨星张国荣与林嘉欣拍完《异度空间》后，精神就出现了问题。\n\n在拍摄电影期间，他经常出现精神恍惚以及失眠、健忘的症状，张国荣的朋友一致认为他在拍摄电影时撞邪了。据张国荣生前好友刘培基爆料，张国荣生前经常讲有声音骚扰他：“为什么你还不死”，但一直没有找到声音的主人。\n\
    \n在张国荣去世前一个月，好友林建岳曾请白龙王与张国荣见面，但白龙王听到张国荣的名字将他拒之门外，当时媒体称白龙王直到张国荣气数已尽，无力回天。关于能“预知未来”的白龙王说出的话实现性有多强，从描写成的书中就可看出。\n\
    \n这位白龙王的事故抓爷在这儿先挖一个坑，小姨贝们想看的留言点赞到时回来再填~ \n\n在张国荣未与白龙王见面后的一个月，2003年愚人节当天他选择了电影《异度空间》中同样跳楼结局的方式结束了自己的生命。张国荣的至亲好友，一代歌后梅艳芳的亲妈也曾在她去世后的百日召开过新闻发布会，公开说自己女儿是中降头而死。在她去世后媒体称她曾被下过无情降，所以梅艳芳一生中经历的所感情都基本无疾而终。\n\
    \n这件事抓爷觉得梅艳芳就算不是被下降头，也会被她亲妈折磨死。吸血老妈有多吸血有多狠，详细的内容小姨贝们可自行搜索下，大概讲下就是，一个连自家孩子去世后畜犁度日花光所有钱，然后还公开拍卖女儿遗物拿钱养儿子的人。\n\
    \n蓝洁瑛，当年靓绝五台山的美女之一，据说当年与富商男友去尼泊尔时被下降头……\n\n她的好友杨曼莉说，因为当年蓝洁瑛与男友信佛教，有次两人和相熟的女性朋友一同前去尼泊尔找了一个喇嘛给他们灌顶。蓝洁瑛自己也曾说过，当时灌顶的时候她被下了降头，从尼泊尔回国后自己性格大变，最后两人无法走下去只得分手。\n\
    \n在他们分手后，当年一起出游的女性朋友和蓝洁瑛的前男友在一起了，最后还顺利结婚。\n\n这种容易让人浮想联翩的后续，确实也会引起好奇心重的人来探究。\n\n\
    除了抓爷上面这几人外，在袁立的爆料中还曾提到过内地女星李冰冰的名字。其中提到过她与已经去世的王林“大师”关系很好…… \n\n这位王林“大师”跟上面的白龙王性质有些像，但是从认可度上当然是无法跟白龙王相提并论。三年前王林因涉嫌非法拘禁罪被公安机关刑事拘留，一年前这位就因器官衰竭抢救无效死亡。\n\
    \n当年王林身边站着的人，小姨贝们去大概看下就能数出半个娱乐圈一线男女明星，受欢迎程度真是令人咂舌。虽然之后王林被央视曝光是套着骗子外壳的人，但上述的照片还是能找到的，里面的内容嘛小姨贝们吃瓜看看就好。"
