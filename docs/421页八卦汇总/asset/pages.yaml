  md: '当年这部剧播出后让陈乔恩坐稳了偶像剧女王的宝座，际经天重新翻身一炮而火，顺其自然的扒爷肯定就想着扒扒他们。可素这一行动还没开始就被娅太制止了！只因为她想重温当年饰演男二Dylan的陈楚河，扒爷被扒着衣服来给小娅贝们说下这位神父小天使的现实故事。


