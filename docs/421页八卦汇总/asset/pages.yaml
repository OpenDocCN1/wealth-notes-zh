  md: "孙俪妈妈本意是想把女儿送给Q大佬的，但是那时候Q大佬已经有了黄奕“玉壶美人”黄奕正得宠，Q大佬也就没打算收下孙俪。于是把孙俪转手送给了刘燕铭大佬。\n\
    \n刘燕铭大佬其实手头也有个“元美人”袁立，但是袁立有自己的小脾气，不咋听话。并且拍戏的时候还和陆毅眉来眼去。刘燕铭大佬一气之下，干脆不要袁立了。于是大佬为了不给自己找罪受，打算要个听话的。而孙俪都能被老妈带出来干这个，能不听话吗？所以刘燕铭大佬就很高兴的收下了孙俪。\n\
    \n不给小情人花钱的金主，不叫好金主。刘燕铭大佬有自身优势，捧个角出来简直不要太简单。于是孙俪被送出去参加比赛新加坡玲华横溢出新秀，连名次都是内定的，因为刘燕铭大佬投钱给这个比赛了。\n\
    \n有了出道由头，刘燕铭大佬打算推广一下孙俪。不过因为这个比赛没啥水花，所以孙俪也没啥热度。不过这都叫事，孙俪的演艺路才刚刚开始。刘燕铭大佬做主，让她签了海岩的公司，成了旗下第一个艺人。好了，wuli孙俪终于可以演热门剧的女主角了。然后命好的孙俪真的凭借玉观音这部剧拿了好几个奖（怎么来的，都懂哈）。接着孙俪又继续演女主戏，事业真是红红火火，有了很高的国民度。\n\
    \n别看孙俪火了，可她不会被成绩冲昏了头脑，知道一切都是靠金主，所以孙俪一直都很听大佬的话。刘燕铭大佬也喜欢带她在身边。出国玩、约见大佬时，还会让孙俪作陪，如果看上了，那就陪到底喽。\n\
    \n听话，自然就会有好果子吃。只要金主大佬在一天，自己就不会扛街。孙俪背后的资源就一直没差过。不过刘燕铭大佬后来玩腻了，送人情又把孙俪送给了另一个金主。换金主不换钱啊，孙俪事业可是完全不耽误~\
    \ \n\n这边刘燕铭大佬也不闲着，又找了一个新情人童蕾。童蕾也不是简单人啊，上学时就被人包养，花钱走后门才上的艺校。刘燕铭金主自然不是第一个也不是最后一个。童蕾自从被力捧之后，别看咖位不大，在剧组可都是豪车接送，完全奢华待遇。\n\
    \n后来童蕾在剧组拍戏时还认识了男星周一围，和周一围谈了好几年的恋爱。最后当然是没成啊！周一围和女星朱丹结婚生子了。而童蕾出道到现在，名气始终混的不如孙俪，后来也旧人退位，找了个大老板结婚了。\n\
    \n所以说，还是孙俪聪明啊，知道自己要什么，干什么。把大佬维护好了，不仅她恋爱了，金主痛快放手，还一点不影响星路。孙俪是跟谁好上了呢？同期组的男星“邓超”。当初是邓超追的她，因为傻子都能看出wuli孙俪来头不简单啊！所以邓超追她，也有巴结的意思。谁让自己正是低潮期呢~\
    \ \n\n一来二去，两人还真的走在了一起，后来还又结婚生子了。两个人要说没感情吧，那是不可能。要说非常恩爱，这就有點虾扯蛋了。所以恩爱就是秀给吃瓜路人看的，既然大家喜欢看，那孙俪他们就继续秀，反正有的是人捧场。而私底下呢，孙俪不仅要忙事业、忙家庭，还得忙金主，也是忙的不得了。邓超呢，可想得开，自己也没少曝光。黄晓明都能把老婆送出去各种孝敬，邓超他俩这才哪到哪\n\
    \n有付出就有收获，让孙俪后来大爆的战国剧，能演出主角就是靠着背后资源拿下的。因为投资方本来是要找“姚妞妞”的（没错，就是昨天出场打酱油的那个）。但考虑到孙俪背后的资源SN，剧方这边才最后定的孙俪。\n\
    \n现在孙俪和邓超事业都不错，形象还特好，国民度很高。发展到现在，孙俪其实没走多少弯路。要知道很多女星那是睡了一圈才知道自己的路子该怎么走，比如范冰冰。而孙俪只要哄好那几个，就一路顺遂，已经算很幸运了。\n\
    \n时至今日，功成名就的孙俪要是在家看电视，估计还能看见某位大头主持人钱枫在台上傻笑。孙俪可能会呵呵一下，对着自家邓超说：“你看，我初恋像不像，现在还混成这diao样”。"
