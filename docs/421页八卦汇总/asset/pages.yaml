  md: '看过“四旦双冰”的童鞋应该记得，扒爷说过“胡门弟子”求得的“功效”是：女一媚、男一魅的！像扒爷之前说过的那位HK小生“阿勇”陈伟霆，当年不就是拜入胡门后，成功靠着那部跟杨幂合作的“爆款古偶剧”成为国内的顶级流量的嘛！~


