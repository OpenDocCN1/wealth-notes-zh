  md: '则。还因为被怀疑有些影射央视，所以开年大戏《人間正道是沧桑》被替换了。


    这份暴脾气，和同样来自东北的小沈阳遇上后，在《三枪拍案惊奇》拍摄时间又闹出过打架的新闻。孙红雷的手还骨折了，那段时间他都是包着手出席活动。孙红雷对外是说因为拍戏训练而受伤，不过知情人士透露，其实是两人喝酒喝大了，开玩笑没把握好分寸，孙红雷一使劲，手就砸在桌上的花瓶了。


    不过东北黑道汉子的形象早就/perl好？不流行了，所以现在的孙红雷改走卖贱卖萌卖可爱的路线，人到中年又杀出隶属于老腊肉的一条路。他现在微博也是走搞笑风格，隔三差五调戏黄渤等人，也是吸粉不少呢。粉丝也不再只是中老年妇女了，年轻小MM也是有的。


    所以啊，当年靠女人上位过去也已经被很多人忘记了，中戏的一年半也被人们以为是正儿八经本科生。那些誓七八糟的绯闻也都留在了过去，现在记住的则是 格？有演技性格好玩的“颖王”了。时间啊~真是神奇的力量！


    # 13、陆毅


    小婊贝们如果看过扒爷之前的文应该心里都清楚，在娱乐圈里陪shui换资源的明星数不胜数。无论是同性恋还是异性恋，大家都可以me?在感情方面变得毫无底线，男女苟且不忌。今天扒爷要说的是陪睡导演上位，后又成功脱身成家的男星陆毅。


    陆毅当年是真帅，阳光有型又有绅士风度，他凭借shui功上了两位导演（海岩赵宝刚）的床，其中一位让他出演了《死不闭眼》这个资源，助陆毅一炮而火。在这一局中，陆毅成功替掉了大导赵宝刚的备选情人陈坤！


    拍戏前，几位主演和配角都要互相先认识一下，剧中出演女二的激进女星“袁立”初次见面就看上了陆毅，随即便开启了撩汉技术。虽然陆毅对于这个拿着rou体换来的资源十分珍惜，但也耐不住袁立硬送上床，这两人在拍戏期间就shui了。


    这看似是性欲占大头的情况，其实还有另一层真相，袁立虽然看上了陆毅的皮相，但shui他实际上是为了报复赵宝刚。因为赵宝刚一直都很看不起袁立（其实这也跟女方不会说话，做事没分寸有关），他经常会在众人面前故意羞化袁立，这让一直被男友捧在手心里养着的袁立十分生气。


    记仇且自大的她得知陆毅的存在后，立刻就想到了给他戴上绿帽子的计划。但她不知道，在赵宝刚的眼里陆毅是随时可以被替换的人~就算赵宝刚已经知道他上了袁立的床，也不会有嫌弃或被戴绿帽的背叛感，毕竟都是跟另位编剧导演换着玩的人啊！更让人没想到是，向来以感性行事的袁立竟开始把这个有目的的感情当真了。（她那时可是有男友的人哦！）


    袁立谈了近十年的富商男友在得知她跟陆毅有一腿后，立刻与她的关系产生了嫌隙。但男友却未立刻和袁立分手，毕竟有那么多年的情分在还有一丝回头的余地，可惜袁立无法理性思考此事。在那种风口浪尖上，她依然不顾男友的感受再次与陆毅开启第二次合作，自此袁立因任性彻底失去了对她最好的男友。


    她的富商男友人品还是很不错的，之后跟圈内其他女星也没有谈过感情，直接选择与运动员张怡宁相恋结婚，安稳的过着自己的小日子。而陆毅这边也不慢，虽然知道袁立为了他放弃了多年男友，但他根本没把女方当回事儿，依旧过着撩妹陪大佬们的日子。扒爷也是佩服陆毅一人分身术的能力，那时身边加上自家正牌女友（现在的老婆）应该有四个人呢~


    袁立心里一直很清楚圈内上男也上女这种公开的秘密，但她对自己相当自信，袁立肯定制自己能拿下陆毅的人和心。所以，她在明知道男方徘徊在各家身边时，竟然难得收起了脾气忍下了一段日子下来。可惜她做的梦太美好，事实却往往相悖...


    还没过一年的时间陆毅身边就又有新的妹子和男人冯绍峰出现，忙于拍摄新剧和新情'
