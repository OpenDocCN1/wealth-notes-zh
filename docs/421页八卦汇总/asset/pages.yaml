  md: '倪妮看冯绍峰看的很重，可冯绍峰却没有那么专一。当时刚好有另一个心机婊小花跑过来勾引冯绍峰，所以没多久，倪妮就跟冯绍峰分了手了。然而小三“林允”其实和倪妮有很多共同点。长相都是一派，而且上学时都不是乖乖女。林允以前就各种约pao，感觉某个男人对她能有点帮助，她就会约，所以很是open。当然林允也没在线多长时间，也掰了。而冯绍峰和倪妮分手后，冯绍峰也顾念旧情，把自己团队的一部分人给了倪妮。


    但分手的悲痛不仅没能让倪妮恢复理智，反而把这些全算在了杨幂的头上。


    本来按照倪妮的计划，她早该这“出手”来搞杨幂的；可无奈杨幂身边一直有小宝贝看护着，所以倪妮一直没能等到合适的机会，倒是自己的运势旺了许多。但皇天不负有心人！就在倪妮跟冯绍峰分手后不久，终于让倪妮等到了机会——那正是杨幂“第二次回炉小宝贝出状况”的好时机。


    复仇心切的倪妮，便趁着杨幂的小宝贝被龙儿和帮凶除掉后的机会，开始暗中发力了。本来就因为“斩草除根”而结下了因果的杨幂，也不知道是真的被倪妮暗中法力搞垮的，还是自己也该春有此劫：不仅频频被爆出“没素质”的新闻，还沾上了一场“欺骗大众，做假公益”的丑事，彻底败光了自己仅存的好感。


    这样的情况，本来杨幂应该是不知道的；可谁承想，当后来杨幂遇到了来自HK、倪妮昔日的“塑料姐妹”——“大眼姐”baby时，她才终于从其口中得知了真相。这件事虽然是之后被爆料出来的，但当时杨幂却并不知情。毕竟杨幂这个人，你说她“太过耀眼、遭人嫉妒”也好，或是“生性凉薄、捧高踩低”也罢，圈内的人缘确实是不好。眼红、嫉妒、憎恶她的人，比比皆是！所以她即使觉得倒霉，当时也是想不到倪妮身上去的。


    而倪妮入了“魔道”之后跟冯绍峰生了嫌隙，最终被另外那位“妹妹婊”小花林允趁虚而入、插足上位，所以也是很难说丢了爱情、赢了事业的倪妮到底是赢家还是输家。


    倪妮呢，开始走起时尚icon的路线。没办法，谁让倪妮属于那批花里混的最惨的呢～要粉丝没粉丝，要资源没资源，还黑料一波又一波的炒来炒去，所以倪妮急需改变现状。于是靠着前男友冯绍峰留下来的路，倪妮和兄弟公司搭上了。那时候公司力捧的小生“井柏然”刚刚被狗仔抓到把柄（咳咳，属性问题）。所以他需要赶快想办法解决，于是决定找个女票自嘲恋情，先下手为强。正好倪妮单身女士一枚，有过多次合作机会且关系还近，经历过情伤甚至有些双性恋的倾向，所以简直就是完美人选。于是两位就被狗仔“拍”到了超清晰出行照、高像素入住照。恋情自然就顺理成章爆出来了。


    倪妮当初跟小井在一起，纯粹是因为自己被黄蛮要心计撇走了冯绍峰，所以才会因为情伤、出于发展考虑，同意华嫂的安排“签合约的”。不论是倪妮出道前的那些丰富情史，还是之后跟冯绍峰那段，她应该都更倾向于异性恋，即使是“同性”也是因为情伤的原因（这个扒爷也在之前盘点gay明星的时候提到过）。两人喜好不同，那些“恋爱期间”的那些糖，随便磕着玩就好，别太当真。后来他们眼见各自拿到所需，也就和平分开了。


