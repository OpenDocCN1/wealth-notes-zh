  md: '肯定逃不过圈内人的法眼，慢慢这两人在一起的消息很快就传开了，越来越多 人知道他们的事。


    当时人气正旺的流量鼎盛的时候，圈外多多少少开始掀起了李易峰和杨幂的绯闻，但相信的人少之又少。圈内有人故意透露两人同居的消息出去，也很快就被网友们的质疑和杨幂、李易峰的公关压了下来。


    男女双方建立在欲望上的感情当然图一时之爽，但在他们身边的工作人员却志否不安，特别是李易峰那边。身为当红小生的李易峰带着巨大女友粉的流量输出，在公司眼里完全就是棵摇钱树。这种时候他跟杨幂的五间如果一旦被发现，那绝对分分钟就跌入深渊无法翻身。当他们意识到这点时，圈内传出的那些消息已经进入了一些准备要与李易峰合作的金主爸爸耳朵里。


    从商业角度来看，当然要选最有热度的明星来给自家当面子，这样才能给自家赚多多的钱。但听到李易峰的情况，金主爸爸们更担心如果合作代言人就被爆出负面新闻，别到时候没蹭上热度先引来一身骚。带着这种顾虑，很多公司都打消了与李易峰合作的念头，这种事情次数开始增多后也引起了李易峰公司的担忧。


    李易峰这件事的方向越发无法控制，最后就连李易峰的妈妈都知道自家未婚儿子跟已婚女人混在了一起，扒爷依旧还记得那时与圈内朋友约着聊到这消息的时候，被震惊到下巴半天没合拢的样子。


    那时扒爷十分心疼杨幂老公头上顶着一片草原，也不怪人家自家老公会生气到不管不问妻子，就算在外重新找都说得过去了。李易峰他娘身为长辈可别提有多生气了，一边诅咒杨幂天生狐狸精勾引李易峰，一边催促儿子与杨幂分开。老人家忙着给李易峰各种介绍女票，但李易峰依旧没有放下的打算，自打那时起李易峰他妈恨不得手撕了杨幂。


    最后，因为两人的消息在圈内外风声太大利易峰的事业受到了影响，公司拿李易峰未来的发展警示他。李易峰这才意识到需要收敛了，为了尽快平息这场风波公司开始给李易峰减少宣传低调。（中间还发生了场祸事~车祸，打胎）


    清醒后的李易峰开始与杨幂划清界限，女方其实一直都无所谓，所以男女合计了一下共同出手买断五间，但藕断丝连总是归还是有点儿痕迹的。初期两人没有分开的那么彻底，直到他发现杨幂又跟其他男星（黄子韬和黄轩）搭上后，李易峰那边才完全放下之前浪荡的几年回忆。


    现在的杨幂依旧十分潇洒，不受老公管束的她身边男友换个不停，而李易峰那边也有着固定PY陪伴左右。扒爷不知道，这算不算是皆大欢喜的局面？？


    而杨幂呢？她也有自己的烂摊子要收拾：本来她跟蜀黍就是因为小宝贝的事情产生了隔阂，之后宣传自己跟李易峰的cp她也一直告诉蜀黍是炒作需要；可如今不但有了“袭胸”实锤照，蜀黍也不是完全没有关系的人，私底下一打听真的就知道了老婆跟李易峰的事情。


    按理说，像这样的“被绿”经历，是个男人就没发忍受的；一开始杨幂还想要挽回，可无奈蜀黍根本过不去心里这道坎，所以两人只好步入了冷战的状态。不过，杨幂的感情状况虽然显得有些糟，但是事业方面却并没有什么大影响。即便有一些谣言传出，但秉承着“黑红也是红”、有话题总比没话题强的娱乐圈，加上杨幂本来就是个只注重曝光不注重人缘的狠角色，所以那些黑料她压根没怎么放在心上，反正只要粉丝和团队控评就够了。而且，有小宝贝的加持，还怕没有资源和热度吗？


    果然，没多久杨幂就又接到了一个大制作幻城。虽说并不是主演，但这种大银幕巨制、又是“自带话题”的“小矮人郭敬明”导演的作品，自然是要接下的。而且，更重要的是，这部戏的女主角，正是杨幂一直想要进入的“大花旦”圈子里被她封为“炒作榜样”的一一范冰冰！'
