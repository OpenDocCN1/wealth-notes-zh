  md: '还带着浓妆和一众圈内好友去吃了趣火锅。这中间还不忘坑一把女友钟欣桐，在聚集众多记者后，她打电话叫来毫无准备的女友，让对方全素-faced上了镜头。扒爷真要感慨一下，还好天真的钟欣桐颜值能抗，就算全素颜也都丝毫不逊于阿SA，最后媒体的自发通稿的重点都变成了钟欣桐素颜美呆了！


    阿SA除了明挟暗踩好友钟欣桐外，还不忘挎着自己两个前任一同折磨，那他们的口碑给自己铺路。


    在钟欣桐出事那阵子，阿SA已经与圈内富二代“郑中基”隐婚两年了，当年觉得要给自己备一条后路的阿SA看上了家世有钱有权的郑中基。郑中基是个花心货，当年因为劈腿女星“啾啾”所以跟歌手女友“羊羊”分手，谈了一阵子后又跟羊羊的助手勾搭上了。这样的近距离劈腿没多久就被羊羊发现了，之后两人就十分不愉快的分手了。


    阿SA瞄到这一时机后就趁此空档拐来了郑中基，原本只是想谈谈恋爱就分了的郑中基没想到阿SA会如此死缠烂打，恋爱两年就硬逼着要结婚。出于稳住太子妃位置的目的，阿SA天天软磨硬泡要郑中基答应领证，郑中基完全是个吃软不吃硬的人，在对阿SA提出隐婚条件得到同意回复后就跟她去海外领证了。


    撇开别的 不说，光从两家背景来看，阿SA完全是高攀了～


    如愿嫁人的阿SA一边在镜头前演着未婚少女人设，一边在丈夫家中受着地位不 unequal 的对待，日日子十分不如意。这样的日子过得当然不舒坦，在婆家不受重视就算了，连郑中基那  这样子
    。不甘心就这样跟郑中基过一辈子的阿SA实行了一场大计。


    两人 在共同商量后开了离婚发布会，两夫 妻 生怕对方胜过自己，现场比赛比谁哭的最狠，结果郑中基演技更胜一筹把离婚锅全推给了女方。出于报复心理阿SA当然不接盘，直接大手一挥请了团队进行了一场枪林弹雨式攻击郑中基，直指其实花心渣男变态癖好多。在这场战争中阿SA获胜，前夫斯几年
    都活在骂声中，抹黑程度只有你想不到没有她做不到的。


    不过常在河边走哪有不湿鞋的，离婚没  几个月 阿SA就被曝出跟男星“陈伟霆”的新恋情，公开后男方被骂的一塌糊涂。


    这个恋情过程可以简单总结为：阿SA恋陈伟霆未深→陈伟霆被骂多年未还口（公关黑稿直指男方吃软饭）→阿SA对陈伟霆感到厌烦（实为倒贴男方，男方家境最少过亿）→陈伟霆内地爆红二人疏离（没红前不想提，红了后使劲蹭）→阿SA携危机感逼婚未遂→最终二人分手→公关通稿转黑陈伟霆（渣男爆红抛弃心友）


