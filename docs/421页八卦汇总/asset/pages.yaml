  md: '原本白冰以为自己有刺符的灵力，胡歌肯定逃不脱被自己“睡到”的命运。谁知道胡歌不仅无动于衷，还主动跟媒体说两人没有关系。终于心灰意冷的白冰只好做最后的“挽尊”，讪讪地跟媒体说“我们确实不是情侣关系，因为我已经有男朋友了，而且马上就要结婚了呢！”。


    可惜即使白冰努力解释，这件事也被金主知道了。没了金主的白冰，没多久就草草嫁人生子了，即使是如今又复出了，也只能徘徊在圈子的四、五线。


    原本到这里，她跟胡歌的故事就该结束了。谁知道多年以后，居然还有个“反转”后继：白冰复出前，居然听到一个朋友讲述了胡歌的事情，时隔多年她终于知道了当年的真相。


    原来，胡歌之所以不选择她，一是因为知道她身后有金主；二是因为白冰在追求胡歌的时候，还有另一位女明星“王晓晨”也在追胡歌！更不可思议的是，那个王晓晨居然也跟白冰一样，刺过符、注过胡仙。正因为两人是“同门”，所以白冰才会那么倒霉！


    听完朋友的话，白冰都快吓死了！还好她当时没能成功睡到胡歌，要不然指不定会被惩罚成什么样呢。事后白冰就去香港找了师傅，收回了身上的灵力，从此也变得本份、安心做个小龙套也无所谓了。


    王晓晨的后续其实也没有多好。毕竟她当时也不是胡歌的女朋友，所以“触犯胡仙门规”被惩罚是跟白冰一样的。虽然她没像白冰那么惨，但也是诸事不顺一直不温不火的。倒是最近这阵子，王晓晨有一点“翻红”的迹象，但未来会不会如愿火出圈，就不得而知了。


    哦对了，她们俩之所以都没能追到胡歌，是因为胡歌在遇到她们俩之前，出过一件大事情，他妈妈在事后拗高人为他求了一个很厉害的“护身符”。要是换做正经拜入门下的胡仙弟子，兴许还有可能勾引成功；像白冰和王晓晨那种“半吊子”，在家家的护身符面前，根本就起不到一点作用好吗！


    35、这个章泽天其实就是挖空心思想嫁有钱人的，她自己家里也有钱，但是她爹不满足，各种想让她进入上层社会，做真名媛。她呢，后来还真是成功实现了梦想，不过真名媛是做了，但真上层社会，没进去。


    她嫁人以后，虽然一直炒作的是高知女性，精英女性，实际上，做的投资大多数都失败了…被人骗啊，投资不当啊，其实公司里不少人不服她，而且是看着她闹笑话。当初的学历跟这些投资也没啥关系，挂科，抄袭，多的是黑料。


