  md: '且不说她跟孙志浩当年离婚撕x究竟谁对谁错，光是她结婚前插足黄jianqun导致黄夫人流产、为上位忘恩负义的那些黑料就一只手都数不过来。这不最近她就又被爆出“忘恩负义”的新闻了么：当年一手把她捧红的周游即将举办“红宝石”婚礼，希望贾静雯要能够前来参加。周游是亲自打电话给贾静雯母亲邀请的，结果贾静雯知道后，却只是通过经纪人来回复周（娓）遊（体），称自己要跟弟弟卫斯理忙着处理开店的事情，没有时间去参加。


