  md: '再反观圈内一二线的女星，往往最后会找圈内人结婚。比如皮裤子汪峰那对，比如黄晓明那对。原因一，大家都是圈里混的，门门道道都清楚，谁也不比谁清白，豪门也看不上自己。原因二，说白了还是为了利益。凑一对共享资源，合作共赢，夫妻双双人气上升，多好~So，那些情侣、夫妻别看外表甜甜蜜蜜，背地里可是弯弯绕绕多着呢。


    抓爷要说的故事主人公就是圈内女星+圈外富豪（暴花户）的组合。


