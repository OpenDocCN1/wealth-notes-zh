    有的宝贝会想，孙怡不是钢琴电子琴满级吗？为什么不凭借这个去做兼职呢？宝贝们不要过于轻信这些话哈，会说两三句日语，和会一门外语可不是一个意思。所以孙怡能卖的只有年轻的外貌和身材，卖艺是够呛了。毕竟一个满级的人又怎么会忘记《菊次郎的夏天》、《致爱丽丝》，反而最有信心的是《童话》？《童话》是流行歌曲，可是连业余级别都排不上号啊！但人设立出去了，就得撑住，所以她平时也只会搞点简单的流行歌曲弹一弹。


    但俗话说得好，只要有特长，就能找到“伯乐”。“腿特长”的孙怡一到北京就被发现了。北漂经验不足1年的她开始演戏，还是热门的大戏或者拿奖的电影哦。宝贝们想一想，这种“空降”型演员，还不是科班出身的话，上来就有好角色，真的就是纯靠才华？再说孙怡的演技也没好到那种程度，起码我都是看不下去。要说她背后没有推手，谁信？


    其实孙怡早有了金主，而且还谈过一个有钱的男朋友，有超跑的那种。所以孙怡的资源才会那么好，除了上面的戏，她还有好多主角戏，搭档的都还是有名气的演员。


    孙怡资源越来越好，但这和董子健并无关系，因为这时候他还没认识孙怡呢。俩人第一次见面是15年底的东京电影节，还只是留了个印象没聊过， 回国后董子健才开始经人介绍认识了孙怡。所以回国后，没过几个月孙怡就进组开拍的电视剧也和董子健没关系，因为这些都是早先拿下的资源。


    本来就靠着主角光环有点名气的孙怡，16年10月公布恋情之后，加上花姐的一通炒作，又让孙怡的名气更上一层楼。有了大批粉丝的孙怡，还有圈里不看僧面看佛面的规矩，她以后的资源是越来越好，基本上部部女主，搭戏的都是热门男演员。


    最近孙怡正和小白合作，估计到时候又得掀起一阵热潮来。


    戏路很顺的孙怡，现在还有了工作室，并且发了张EP，摇身一变成了影视歌三栖艺人了。专辑图拍的还是挺美的，估计是已经忘了自己以前长这个样子了吧~毕竟微调可是能让一个人慢慢变美的法宝哦！


    变美了变白了的孙怡现在上了位，却还是走了以前那些小花的老路，传不了绯闻，就发点拉踩的通稿呗。最常被她踩的就是三水小姐姐。而且孙怡特别怪的是，一边特讨厌被比较，一边又跑去学人家妆发造型之类的。


    所以这样子来看，孙怡就有点小家子气了。


    姨太建议孙怡啊，多打点美白针，多拍拍大长腿就挺好的。不用非得学谁不可，省的画虎不成反类犬。再说，你孙孙怡都已经拿下背后有人的董子健了，这本身就是证明了自己的实力。毕竟热搜隔三差五的上，不就是“实力”的二次证明吗？


    姨太也知道你特别不乐意上热搜，但是人红能有什么办法？


    最后姨太也不多说，就送一句祝福：孙怡早日领证✿、(´∀`)ノ✿


    # 18、潘粤明&董洁


    最近因为秦岚和董洁两人分别在两部剧中饰演同一个角色，大家不时总会拿来比较些许。两个剧中人物虽是同一人，但形象设定确实两类。一个是温柔大方善良的形象，另一个却是费尽心机的阴毒形象。


    既然有热剧在播肯定就会有通稿出现，新剧播出后没多久董洁就带着这个人设争议开'
