  md: '斯理认识了修杰楷，两人还一起健身跑步，所以感情就出来了。修杰楷比贾静雯小9岁，这对姐弟恋很快在15年修成正果，登记结婚了。然后贾静雯同年生下咘咘，17年又生下bo妞。后来孩子大点了，贾静雯就带着孩子上了好几个亲子节目，成功打造了“好妈妈”人设。


