    你们说，这事巧不巧？（娱乐圈万年不变的炒作大法果然好使）而袁泉获利最大，因为她才不是什么白莲花，知道只要以受害者的身份，就能让舆论都站在她那一边，所以她才不会说出内情呢。闹到最后，自然是高圆圆和夏雨分开了，而夏雨发现自己背上了“劈腿”骂名后，不太利于事业，加上炒剧的目的达到了，高圆圆也玩到了。


