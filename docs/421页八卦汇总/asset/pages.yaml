    （比如在“东瀛”期间，跟N多模特群的男艺人“夜夜欢场”；又或是跟她的“思密达歌手偶像” 早就在酒吧“约过”？）还是来了内地之后，跟“小王吧”那群高层的糜烂事，绿总裁也都是了
    如指掌的。 可就算“都不干净”又如何呢？绿总裁还不是照样要为了形象、为了利益，跟大眼姐 在台前表现得恩爱有加，哪怕下了台就翻脸也无所谓嘛~因为他们都知道，对于目前的两
    人来说，只有他们继续在一起，才更有利于彼此的捞金事业。 所以说，在这个圈子里，“真爱”才是奢侈品~当然了，也或许对于他们来说，这个“奢 侈品”，本来也不是什么“必需品”吧~
