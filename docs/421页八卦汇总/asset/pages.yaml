    好了，今天的故事就说到这里。一句话，很简单！


    # 27、阿娇钟欣桐


    要说娱乐圈的人，哪个都不简单。尤其是混出点名堂的人，那就更不简单。不是背后力量不简单，就是这个明星心机不简单。今天姨太就给宝贝们讲一个不简单的“傻白甜”女星，欣欣。


