  md: '进组后，为了让角色人物更符合王珞丹，他直接自己动手改了原定剧本里的角色人设，让那时外表端不上台面的王珞丹变得合情合理。白百何这人看过之前文章的应该都知道，她跟王珞丹相比在智商上就高了不止一倍。王珞丹小心思在白百何看来都是她玩剩下的，当她知道原属于自己的被抢了后早就把这笔账记在了心里。（在之后可是狠狠地将王珞丹踩在脚下，不让她有翻身的机会～）


    那时王珞丹在拍戏期间正和景康打得火热，跟文艺人在一起她努力把自己塑造成文艺女神路线，人气暴涨后她开始有些飘飘然。王珞丹偷偷借景康的光上了导演赵宝刚的床了（虽然这位大导性向方面emmmmmm），这次白百何也在争取上戏的机会，结果只能在王珞丹身边演个绿叶角色。


    从那时起，白百何就已正式把王珞丹当成假想敌，她拼命以shen换资源外加咔老公的手段在很短的时间内成功爆火。（这也是一种“运气”呵～）火了后的白百何故意利用媒体针对王珞丹发出碰瓷长相的通稿，这时候沉不住气的王珞丹不断对身边工作人员发脾气抱怨，工作人员也感到烦透了索性给她出了个烂主意。


    狗头军师让王珞丹故意与白百何爆火的新电影扯上关系，让外界误以为是白百何截胡抢了原本属于王珞丹的角色，王珞丹被激怒后不 onderzo的听从意见照做了。结果没想到，白百何那边很快就去跟新电影导演稻白莲委屈哭诉，希望对方帮忙她澄清此事。（以白百何的手段他们当中有关系，小妹贝们懂得咯～）


    人家导演当然义正言辞的出来发言，直接表示自己从未邀请过王珞丹，都是王珞丹个人的炒作行为。然后白百何再往上浇了一把火，利用原本给好钱的媒体和网友翻出她和王珞丹早年间顶替角色的旧账，直指王珞丹在恶意营销操作。


    娱乐圈的话题热度一起来就容易烧伤人，这次被烧伤的主就就是王珞丹了！扒爷跟圈内朋友聊天时曾谈到白百何，我俩的想法基本一致～虽然白百何做事向来可恶可恨，没脸没节操（背后有资本撑着），但她对王珞丹的所作所为还是情有可原的，因为后者虽然无脑但也绝不是善茬儿。


    早年两人搭档合作时王珞丹没少欺负白百何，从嘴上得理不饶人到借机推推搡搡都曾有过，那时人气不高的那方只能忍受着，所以从后期看来也是女人的一种反击吧。后期王珞丹眼睁睁看着白百何迅速上升的势头完全被惹毛了，她甚至私下警告身边人不准记者提及白百何的名字，相关问题一律筛掉。


    王珞丹在白百何红了的日子人气明显下滑，但她一味只愿钻牛角尖的单方面跟白百何对着干，从没想过要努力提升自己稳住位置。急功近利的她甚至在资源找上门的时候，直接当对接方面的面就问出这部戏能不能超过白百何的成绩，这种令人呐青的问题。（这种问题鬼能保证的了哦！）


    王珞丹没得到自己想要的答复，就直接不管戏到底好不好就推了～


    这部资源就是《泰囧》，当年没成功邀请到女主，编剧就直接把它改成了以男人为主的戏，未料到上映后直接火到带动了一个国家的旅游经济！它现在是非常成功的系列片，也成为演员转型导演的男主演徐峥成功打下了好口碑的基础。


    当推掉这部戏后的一年，一部IP新戏资源又再度找上了她，但王珞丹还是觉得票房没保障（她跟身边人一再表示只找超过白百何的资源），所以又双推掉了。事实证明，这部戏在四年前的票房超过了五亿以上，比白百何当年的成绩高出两亿多……


    那时的王珞丹悔得肠子都青了，这也是扒爷说她比白百何菜的地方！虽然当年白百何没红时很难猜（脾气简直恶心人），但识时务者为俊杰。当人家发现对自己有利的戏她毫不犹豫的收起了脾气，各种宣传活动都开始无条件配合起来。


    像王珞丹这样目光短浅的人，糊只是时间早晚的问题而已。虽然白百何之后因为个人原因被小狼狗坑了个狗吃屎，但总体资源至今还是依旧活跃着。相反，这两年努力想做新尝试的王珞丹却依旧一再作死，各种临时反悔的戏数不胜数，光上星剧就不止一部。


