    营造了一波恩爱形象后，他俩也就领证结婚了，毕竟孩子先有了，那就结呗。一直到现在，两人还是走低调秀恩爱路线，这操作很成功啊！袁泉是个很聪明的女人，她才没有看上去的那么“不问世俗”呢。如果说高圆圆的“丰富情史”是所有人都知道的，那袁泉的“心机”就是所有人都看不到的。当初夏雨、高圆圆因为拍话剧闹出绯闻，原本夏雨跟袁泉商量好想通过跟高圆圆的绯闻炒作的（夏雨跟高圆圆暧昧的时候，告诉高圆圆他已经跟袁泉分手了），谁知道高圆圆居然真动心了。本着“送上门的不白不要”的心态，这才有了之后高圆圆被拍到夜宿夏雨家的那些新闻。


