  md: '不自赏）等丑闻，但让所有质疑她的人都惨遭打脸的是，15年安祖拉小姐居然获得了，有“国内电影艺术标杆”的百花奖的最佳女配！


    原本大幂幂跟安祖拉是没什么交集的，虽然心里彼此看不上对方，但也没涉及到利益，所以一直也算相安无事。可当赵小花被卷进来，“三个和尚没水喝”的真理就要验证了。


    原本赵小花跟安祖拉认识的时间更早，原因当然是那位黄经纪人了。黄经纪人跟黄晓明的关系非常好，也带过安祖拉。所以即使之后在帮助赵小花撕时尚资源的时候，赵小花也并没有跟黄晓明和安祖拉撕破脸，关系还是比较和谐的。


    大幂幂原本知道赵小花再怎么有实绩，时尚资源都是她的短板。演的剧再多，终究上不得大（银幕）台面。可现在赵小花有了黄经纪人指点江山，眼看着还要跟安祖拉以及安祖拉身后的黄晓明、华姨站队了，这让大幂幂以后还怎么玩？于是，大幂幂便火速建立人脉：主动示好安祖拉，并抢先赵小花跟安祖拉结成一派。杨幂


    今天的故事，我们又要先暂时把冯绍峰搁置在一边，而先从杨幂的那一头开始讲起了（抓爷是真的很想直接给大家讲赵丽颖的故事，可由于关系网和背景实在太太太太复杂！不把这些前因后果的内情交代清楚，是根本没法说的鸭！~所以大家耐心一点看下去，相信抓爷！当这些“隐情”交代清楚之后，这个复杂的“小花大乱斗”的故事，你们一定会炒鸡喜欢！）。


    之前说到，杨幂自从被龙儿和蒋凶整得没有了小宝贝，那真的是霉运当头了。不仅事业上各种负面缠身，家庭中她跟蜀黍的关系也眼看着就要崩盘的边缘。要不是命不该绝（实际上是因为她去求了“德基小神童”~）而幸运地碰上了“第一狗”帮倒忙、爆出了蜀黍跟“炮灰姐”的丑闻，怕是早在16年就要满盘皆输了。


    杨幂和刘恺威的相识相恋其实与一般明星没两样，只不过男方没有女方聪明，杨幂在选择刘恺威时主要考虑到男方好掌控，事实上也确实如她所愿。但两人在杨幂上升期时的结婚决定只是因为突如其来的孩子，女方补了这张车票后就又恢复本性。


    在圈内人眼里她就是“微开大门”的女星，只要有合作的男星大多数都来一趟露水情xing缘，无论被骂的有多惨，在杨幂看来都是她人气的证明。杨幂年少被相中进入资源非常好的影视公司，先是被安排伯乐安排去了电影学院读书，再学会如何面对媒体。她不用向其他同学一样需要去跑剧组面试，从高中起就有一堆剧等着她。这样的生活让杨幂脾气越来越大，把自己当腕儿的她与剧组撕再和前辈撕遍，只要是她上的剧，在开拍之前就会去讲条件，面对媒体的采访也时常会放鸽子。


    气焰嚣张的杨幂最后就连公司的安排也不放在眼里，这样一搞让公司高层十分恼怒，为了压制杨幂他们选择直接将她雪藏了。为了给自己争取翻身的机会，杨幂都没细想就选择最快捷的方式，与公司合同到期后离家恢复自由身后。她这个选择确实很对，因为之后杨幂就遇上了IP系列剧《仙剑奇侠传》的资源，剧中她顶了女二（她曾经的好闺蜜）原定的造型成功出演了，并正式在新人中突起。


    抓爷说起来也蛮好笑的，如果从那时发愤图强的话，杨幂的演技应该早早上升不止一层。可惜对她来说赚钱最重要，所谓的研究角色，钻研演技在她看来都是空气。（就算想炒作转型被群嘲也是正常的…）


    而杨幂与刘恺威在结婚后确实没过多久好日子，男方就因为性格偏软而被女方嫌弃，他们名存实亡的婚姻就连圈外人都看得出。可惜两人也只能这样硬维持着，甚至还有暗自窃喜的时刻，比如刘恺威和青衣演员王鸥的合作，女方被当成了炮灰，两人被全网骂时就是杨幂和团队最想见的画面。


    早前杨幂为了防自家老公对自己不利的甚至在他身边放了眼线，为她时刻汇报自家老公的情况，这两人把夫妻生活过得像打地道战一样。（利益永远走在最前沿…）但时间一长杨幂发现，她对刘恺威的警惕其实有些多虑，男方只是懦弱的性格迫使他低头。结婚后才发现杨幂贪欲太强的他状态也挺差的，虽然对自己老婆已经彻底失望，但刘恺威的心眼'
