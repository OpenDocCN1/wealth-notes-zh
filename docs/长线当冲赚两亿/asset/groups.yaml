    # **重點7：別急著賺大錢，一步一腳印才是王道！**


    懂得如何面對並控制風險，才能持續獲利，為此你必須有能力面對市場和自己。


    我畢業進入社會後，被任職的證券公司分派到交易部門，至今還記得新手時代持有部位虧損的事情。


    那是一筆僅有一口的大阪日經225指數期貨。當時我還是菜鳥，要透過直屬主管用電話下單。


    其實前一天快收盤時，我就想賣掉手上持有的期貨，也有告知主管，但主管正熱衷於自己的交易，沒有聽見我的要求，結果那一口指數期貨就這樣持倉過夜。


    隔天，美元兌日圓跌破1美元兌100日圓，開盤後日經225就跌了500點，讓我的多頭部位損失50萬日圓。對當時的我來說，50萬日圓的損失實在太巨大，當時眼前真的是一片漆黑。


    後來我的心理素質變得越來越堅強，甚至賠6486萬日圓，也相信總會有辦法賺回來。經歷過無數次的痛苦和'
  - '[PAGE 198]


    恐懼，為了克服困境，每天都都會檢視交易、不斷自我檢討、鑽研交易手法、持續建倉反覆越過困境，所以才有現在的我。


    這段路程大概花了 10 年。不管是職業的交易員或散戶都一樣，鍛鍊心理素質必須長時間累積各種經驗，不要想 1、2 年就能達到這樣的水準。


    要得到真正的實力，應該持續面對市場和自己、不要心急。有時候，市場多頭確實能趁機賺一波。但這時如果誤以為能輕鬆獲利是自己的實力，只會讓你變成遇到空頭就賠光出場的投資者。


    交易員不會如此簡單就成長茁壯，要懂得如何面對並控制風險，才能持續獲利，因此你必須有面對市場和自己的能力，一步一步成長茁壯即可。


    我目前在培育年輕的交易員，他們的狀況就跟以前的我一樣。讓毫無基礎的人上場，每月大概會固定損失數十萬日圓，之後才會越賠越少。


    藉由各種磨練，例如：在快要崩潰時，抽身重新評估進場時機等，慢慢學會面對市場和自我的方法，讓自己逐漸能逐漸獲利。直視並分析自己的失敗，並活用在下次的交易上，必須靠枯燥而踏實的累積，才能獲得真正的實力。


    散戶也一樣。因為是自己做投資，周圍不會有人幫忙檢查或制止，必須自行摸索如何自我控制並成長，有時候或許比交易員更困難。'
  - '[PAGE 199]


    觀察成功的散戶，會發現其運用的資產金額增加幅度大致呈現 J 曲線（這是因為隨著本金增長，獲利也會慢慢以複利增加）。乍看之下好像能短期賺大錢，但其實不是這麼一回事。


    「手上有 100 萬日圓，1 年後要把它變成 1 億」的想法，實在太過輕率。市場不會依照你的願望行動，所以應該改用持續累積的方式，例如：今年目標 10%，把
    100 萬日圓增加成 110 萬日圓，明年再努力一點，把 110 萬日圓增加 20%，每年不斷努力提升績效。腳踏實地重複累積經驗，才能讓獲利增加幅度呈現 J
    曲線。


    想要不靠運氣，而是在可控制的狀態下達成目標，需要許多前提條件。雖然無法一步登天，但只要持續努力就會有成果，所以不需要著急。想在 1 年內用 100 萬賺 1
    億的人，必須自覺到：自己正在冒 1 年可能賠 1 億的風險。


    我能理解想要賺錢、想要早日變成大人物的心情。但請先瞭解這條道路既險峻又遙遠。市場有各種變化，唯有持續奮戰和經歷各種磨練，才能獲得真正的實力。


    如果想越級成長，一旦碰到沒經歷過的局面，很可能會蒙受意想不到的鉅額虧損。請不要焦急，一步一腳印慢慢成長茁壯。'
