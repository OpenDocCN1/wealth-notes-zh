    ## Chapter 1


    ### 傳奇交易員如何一個月賺兩億？


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_22_0.png)


    ### 1-1 什麼是股市交易員？


    在網路交易普及和通訊高速化後，投資人只要在網路下單，便能立刻成交。現在散戶的交易環境，幾乎和證券公司的職業交易員一樣。


    大概只有日本才會用 Dealer 一詞來稱呼股市交易員。每次向外國朋友說明自己的職業時，如果自稱是 Dealer，他們肯定會面露疑惑，或是反問：「你說的 Dealer
    是指買車之類的嗎？」


    國外的交易員通常稱為 Trader，代表交易投資商品的人，其中分成替自己公司運用資金的「自營交易員（Proprietary Trader）」，以及處理客戶買賣單的「執行交易員（Execution
    Trader）」。


    無論是外資證券的 Proprietary Trader，還是日資證券的 Dealer，指的都是用證券公司自有資本進場並獲益的職業。


    雷曼風暴之後，國際社會開始加強管制金融機構的暴險。在美國，因為伏克爾原則 (註4)和陶德—法蘭克法案 (註5) 等限制，外資證券或大型證券商等金融機構，已經很難讓交易員像過去一般從事高自由度的投資。近年來，確實少了很多只靠自身市場觀念進行自營交易的公司。


    **本書內容包含我在證券公司自營部門，擔任自營交易員時的操作方式，並述說二十多年的交易員生涯中，學習到的經驗和重點。**


    我希望本書可成為一本適合自營交易員的教科書，讓今後想在交易員這條路更上一層樓的年輕世代，從中得到收穫。若不論組織或資金量，其實交易員做的事情也適用於散戶，所以我認為本書的內容對散戶也會有幫助。


    大約二十年前，日本出現網路證券公司後，個人的股票投資環境發生很大的變化（詳細內容將在第 9 章解說）。在那之前，大家都用電話向證券公司下單，證券公司接單後，再手寫傳票向交易所下單，是一個悠哉的時代。


    網路交易普及和通訊高速化後，投資人只要在網路下單，便能立刻成交。**現在散戶的交易環境，幾乎和證券公司的職業交易員一樣。因此，散戶應該也能從交易員的交易手法中學到很多東西。**


