    ## 推薦序一


    ### 我有信心與能力賺回一千萬！


    財經暢銷書《空軍一哥教你K線放空法》作者、私募基金合夥人 陳韋翰


    回顧 20 世紀的日本，除了令人印象深刻的偶像劇《東京愛情故事》之外，就是 1989 年 12 月底，日經 225 指數創下史上最高價 38957.44 點，2
    個月後台灣加權指數也搭上熱錢列車，創下 12682.41 點新高，這項記錄台日至今都還未能突破。


    但自此日股沈睡許久都無力再創漲勢，直到 2012 年，扭轉 311 大地震與福島核災頹勢之後，才展開一波 3 倍的大漲行情，沈睡巨人終於喚起世人的記憶。


    本書作者工藤先生從事交易二十多年，由交易員一路升職到部門經理，管理近 50 位交易員。操作商品方式包含當沖、短期、中長期、套利等。


    對於每一種操作方式，作者都詳盡說明自己運用的分析方法與投資觀念，舉凡 K 線、均線、MACD 指標、獲利與虧損退場、攤平、金字塔加碼、下單時機、避險等，毫不起眼地分享給讀者，堪稱本書的精華。


    文中提及作者曾經單月虧損 6486 萬日圓的經歷，讓同樣曾身為自營交易員，單日虧損一度高達 1300 萬的我，感觸頗深。**如何從絕境中重新站起，並且建立自信扳回損失，甚至讓獲利翻倍，這種蟄伏的心路歷程與經驗能力的累積，遠比一出手就大賺錢還來得珍貴。**


    我曾經歷過 2000 年、2008 年的股市崩跌，也曾站在加權指數 9859.65 點、11270.18 點的資金浪潮上，很慶幸自己能持續在投資領域中存活並逐步茁壯。


    讀者若是能善用本書中的技巧與觀念，逐步累積投資經驗，便能掌握如何正確而快速地判斷行情，因為股市景氣循環是固定的劇本，只是演員不同，而人性永遠不變。只要能掌握「貪婪」與「恐懼」的轉折點，就能複製股神巴菲特的獲利方程式：平均每年讓本金成長
    20%，10 年翻 10 倍，直到 56 年後成為全球首富。


    對我而言，股市就像宇宙，每天打開電腦程式，就能看到全球變化。投資的過程便是反覆執行指令，這是我們可以掌握的部分，而過程中要承擔多大的風險、可能面臨多大的損失，也是由自己來控制。但結果究竟是賺
    1%、賠 1%、賺 50%、賺 500%……，還是得看老天爺的面子，這正是投資最有樂趣的地方。


    我曾在券商與私募基金任職多年，體會到：**當操盤手能認清自己的渺小，愛上投資的孤獨感，學會享受進場時的恐懼與投資過程的樂趣，並且瞭解財富是靠逐步累積而成，再加上對自己的無比信念，便能夠進入獲利循環，令財富不斷往上竄升。**


    身為一個擁有類似經歷與感動的讀者，我想這應該是作者工藤先生贈送給投資人的珍貴禮物！


    ## 推薦序二


    ### 想在股市長期致勝，你需要的是……


    知名理財書作家、嘉實資訊專業講師 艾致富


    在接到出版社邀請，為《我在股海賺二億》撰寫推薦序時，我毫不猶豫，立馬同意了。


    過去一年之中，連同此本著作，我已經為三本日本投資大師的書籍撰寫專文推薦，這是因為我發現日本的股票投資書籍，無論是淺顯到專為股市新手而寫，或是針對已有豐富股市經驗的投資人，提供更專業、更多元化的股市投資領域知識，其共同特色就是**非常強調投資人在投入股市時，要先釐清每一種投資方式應懷的觀念**，這也是我在**教學時最強調的重點**。


    至於投資方式，雖然也是每本書中作者想要傳達給讀者重點，但重要性卻遠遠不如基礎觀念。在我閱讀過由日本傳奇交易員工藤哲哉所寫的這本著作後，我只能以「非常驚訝」這四個字，來表達對本書及作者的敬意。


    一直以來，自營交易員應該是許多散戶投資人非常好奇、很想瞭解的一項職業。這群操盤手的職務內容是用券商的自有資金，幫助券商創造獲利，投資人對於他們的每日工作內容、時間安排與投資方式，雖然好奇卻又難以窺視，本書作者竟願意將自身經驗與大眾分享，這是第一個讓我感到驚訝的地方。


    第二個驚訝之處在於，本書的內容雖然是把作者二十年來的每日工作內容，經過有系統的濃縮整理後，再分享給讀者，背後卻隱含深遠的意義。


    **這些每天不斷反覆的動作，正是投資人要在股市中長期致勝，必須具備的觀念與習慣。**作者願意如此鉅細靡遺地把它們整理出來，讓讀者參考學習，我必須說作者創作此書的動機中，想要傳承的意願肯定遠大於其他一切利益。有幸閱讀此書的讀者，實在應該感謝作者毫不保留地分享給大家。


    **我很榮幸能向大家推薦此書，其中除了讓讀者一窺自營交易員的工作內容之外，還濃縮了作者二十年來對於各項投資手法，包括超短期、短線、中長期投資等的經驗與智慧，幫一般投資人大幅縮短在股市中摸索所需的時間。**更重要的是，許多寶貴的經驗並非人人都有機會接觸或學習，作者儘管身在日本，但所寫的內容也適用於台灣的投資市場。


    看完本書內容後，我深刻地體會到，作者恨不得在本書中，一次把他所有的經驗都分享給讀者，所以對於一般讀者而言，部分內容或許過於深奧。但我仍然期盼所有讀者都能花點心思，用心閱讀、思考、融會貫通，才不會辜負作者的用心良苦。


    ## 前言


    ### 面對市場時所有人都是孤獨的，做好準備才是上策


    最近出版社向我提案：「能不能請你寫一本，適合公司新進交易員閱讀的股市交易教科書呢？」我們既然以股市交易為業，就必須控制風險並持續獲利，而散戶也非常關心我們的思考方式與做法。出版社認為這樣的內容一定有帮助，於是找我寫書。


    我不知道自己能否充分滿足這樣的請求，但試著有系統地歸納重要的部分並集結成書，包括至今二十多年的交易員（自營交易員）職涯經驗，以及管理交易部門時考慮的事。


    基金經理（避險基金、投資信託）、自營交易員、交易員、散戶……，市場上有各種身分的人在進行操作，我也有許多不同身分的朋友。


    各種身分都值得尊敬，沒有優劣或上下關係，而且大家都十分熱愛市場，因此一定也有許多共通或深有同感的事物。事實上，如果不討論組織構成或資金量，在市場上操作的人，包含散戶在內，該做的事都一樣。


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_17_0.png)


    **日本股神教你長線 & 當沖賺二億**


    因此撰寫本書的目的，主要是希望幫助年輕人在專業操盤手道路上有所成長，並提供指導，對散戶而言應該也有所幫助，希望大家能或多或少在書中找到值得參考的地方。


    此外，除了職業級的散戶外，我也希望從少額開始投資股票，或是有意願投資的一般散戶，能透過本書對股票市場產生興趣。大家享受市場就好，不需要像職業人士賭上人生般努力。


    即使只是一點小錢，一旦投資某檔股票，你就會開始注意新聞和報紙。因為與自己切身相關，你也會開始對經濟感興趣。日本的資本主義經濟是以股份有限公司為中心，了解經濟知識、學習投資，其實是非常重要的。


    我畢業於 1990 年代前半，剛進入公司就被分配到交易部門，接觸過各種不同的運用方式，包括以選擇權為中心的金融衍生商品、個股、多空策略、活用編程進行分析的系統交易等。


    我一路見識過許多次市場劇烈震盪，包括阪神大地震、霸菱銀行事件 (註1) 、山一證券風暴 (註2) 、IT 泡沫、股市熱潮、雷曼風暴、311 大地震等。


    即使自己剛畢業時什麼都不懂，只能靠著年輕和努力作為本錢，也逐步成長為交易員，直到能做規模不小的操作。


    我原本自認已是合格的交易員，但後來到新加坡參與避險基金的設立，認識一群在全球運用資產的避險資金經理人，才瞭解到自己的格局有多麼渺小。現在我在總公司位於日本橋兜町的山和證券，與近
    50 位年輕有為的交易員一同努力。


    2005 ～ 2009 年左右，我開始感覺到「這樣下去不行」，尤其是在 2010 年以後，有時間交易員甚至被揶揄是「瀕臨絕種」的職業。


    我感受到許多後進已經陷入絕望，無法描繪未來的夢想。我不願看見後進在自己熱愛的市場中努力工作，卻變成這個樣子，因此我目前希望能建構一個環境，讓他們可以夢想未來的模樣，並積極追求自身的可能性。


    目前我致力在山和證券培育未來的交易員，包含應屆和無經驗的求職者。有些人不到幾年就成為頂尖好手，能更進一步展翅高飛，這對公司、業界和市場來說都很重要。看到他們活力充沛地樂在工作之中，是最讓我湧現幹勁的事。


    金融市場和大自然一樣，或多或少潛伏著危險。


    我的興趣是水肺潛水，這對我而言不僅是最棒的休閒活動，也可以幫助轉換心情。不過，我能徹底放鬆、享受這項活動，是因為身邊陪伴著值得信任、經驗豐富的潛水導遊。儘管我有潛水證照，也具備自保的基本知識，但如果有人問我：「在水流突然變急時，能否自行冷靜應對」，我會回答：「沒有百分之百的自信」。


    市場也一樣。我曾遇過好幾次出乎意料的狀況，原以為風平浪靜的市場突然發生劇烈震盪。這時候，在股票市場很難找到像潛水導遊般令人放心、能告知該怎麼做的人。交易員和同事或夥伴之間的感情再好，在盤中都是孤獨的。因此發生狀況時，不會有人告訴你要在哪個點位進出場。


    面對市場時，所有人都是孤獨的，只能自己思考行動，然後獨自承擔結果，從這點來說散戶也一樣。而且，散戶不用拿證照、沒有任何基礎知識，一樣可以立刻進入市場。


    「無論是專業操盤手或散戶，都應該先理解市場的潛在風險，學會保身的方法，再來享受這個世界」，正是我撰寫本書的初衷。如果你期待這是一本標榜「讓數萬元變成數億元」，或是「股市必勝法」的書籍，可能會覺得索然無味。我長年經營部落格（註3），而看過的讀者應該都知道不會有浮誇的內容。


    本書中包含我以操盤手的身分，從一無所知的年輕人一步步成長，直到在業界小有名聲的親身經歷。有些內容是要在市場吃過苦頭、實際克服後才寫得出來。哪怕只有一丁點也好，我衷心期望這些經歷能為你帶來幫助。


    金融市場中沒有絕對的答案，所以不需要模仿別人。正因為有各種不同的人，市場才會成立，你只能設法從中找出自己的生存之道。這或許是一條辛苦又險峻的道路，但如果你十分熱愛市場，肯定能吃苦當吃補，不斷成長。


    請務必樂在其中，並且持續抱持熱忱。


