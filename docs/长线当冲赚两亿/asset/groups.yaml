    ## 短線交易時，要懂得退一步觀察潮流


    如果股價在一天內達到既定目標或跌到停損點，當然應該停利或停損，但如果沒有大的利空利多，卻時常發生這種狀況，代表進場依據本身有問題。


    短線交易的持倉時間大約在數日到數週之間，是在以當沖為代表的超短期買賣中，加入跨日的要素，也就是「持倉過夜」。是否跨日是當沖與短線交易最大的差異。


    2010 年 1 月東證的箭頭系統上線和 HFT 急速湧進，對交易員帶來巨大的衝擊，再加上交易所的檔位最佳化（參照第 9 章），也讓以當沖為主要操作方式的交易員身處逆勢，於是許多人從當沖改成做短線。


    當沖以極小獲利為目標，像是「買一元賣兩元」，買賣速度是重要關鍵。若是缺乏瞬間判斷力和能快速執行交易的環境，很難進行有效率的超短期買賣。


    職業交易員在過去有壓倒性的環境優勢，但網路在 1995 ～ 1999 年開始普及，網路券商跟著嶄露頭角，逐漸縮小交易員和散戶的交易環境落差。


    最關鍵的就是東證箭頭系統的啟用，使得在歐美買賣比重非常高的 HFT，一口氣湧進東京市場，HFT 能用遠超乎人類的速度和頻率反覆進出場，席捲日本股市。


    倖存的交易員則致力因應市場的變化，摸索不與 HFT 正面衝突的交易手法。其中一種做法，是採取比較不容易受交易速度影響的短線交易，也就是改用時間軸更長的交易方式。


    短線交易的前提，是一一定程度地擴大手上持有的部位，包含持倉過夜在內。換句話說，必須有一定程度的耐心。交易員一整天都在觀察市場和盯盤，所以很可能受價格變動影響，不小心就出手下單，或是賣掉原本打算持有的部位。


    為了避免這種狀況，「與市場保持適度的距離感」顯得格外重要。如果股價在一天內達到既定目標或跌到停損點，當然應該停利或停損，但如果沒有大的利空或利多，卻時常發生停利或停損的狀況，代表你的進場依據本身就的問題。


    另外，如果持有的部位過大，有時會禁不起損益的波動，無法長期持有。如果建置大部位是勇氣，守住小部位不賣也一樣。必須確實理解自己預期的獲利與背後的風險，再控制部位的數量。


    不要太深入盯盤，要與市場保持適當的距離感，並保持部位平衡。就這幾點來看，該觀察的地方和超短期買賣不同，除了需要更高一層的分析能力，進場依據也必須更有邏輯。短線交易需要能退一步觀察潮流的客觀態度。


    ## 中長期投資，重點在於懂得估價與分散標的


    中長期操作最重要的是分散。投資有賺有賠，所以不要冒壓錯寶就賠大錢的風險，操作的時間越長，越要分散標的。


    中長期投資的交易方式，是在某段期間內持有部位。「中長期」一詞沒有明確定義，這裡以數週～數年的時間軸為前提進行說明。


    **由於持有時間大幅延長，相較於超短期買賣或短線交易，事前應檢查的重點增加，判斷時更重視經濟或企業的基本面。** 前兩種交易中重視的技術分析，雖然能夠在中長期投資中派上用場，但只能視為參考指標。


    2010 年交易業界的生態大幅改變之後，這幾年增加不少採用中長期交易策略的交易員，許多人都交出很棒的成績單。


    中長期投資單純是指持有部位的期間，實際樣貌可說是五花八門，以下舉兩個代表性的例子。


    ### 1 多空策略


    這是最具代表性的操作方式，正如「多空」兩字所示，搭配做多和做空，將市場方向性造成的風險降到最小。許多避險基金都採用這種策略。


    持有部位的期間越長，損益就越容易受整體行情的變動影響。即使買進再好的個股，也不會持續上漲，在上升趨勢中，一定有價格下修的调整局面。有些操作者非常喜歡多空策略，因為他們即使在價格下修的情況下，也不能有巨大虧損。


    舉例來說，證券公司的交易部門大多會規定「單月虧損上限」，更嚴謹的公司甚至規定當日虧損上限，但這類公司在現實上恐怕難以做中長期操作。


    達到月間虧損上限後，該月就無法繼續交易，這對交易員來說是生死存亡的問題。所以，搭配多空策略的買賣組合，除了行情上漲以外，下跌時也能獲利，屬於合理的策略。


    但當行情一路上漲時，多空策略便陷入苦戰，常會出現「放空基本面不佳或被高估的個股，但該個股卻被行情帶動而上漲」的狀況。而且，如果個股的信用交易有大量賣單，還可能會有轧空的風險。


    轧空的意思是指，當使用信用交易掛賣單時，一旦股價出現上漲，反而擴大損失的狀況。此時，持有該部位的投資人必須抱著損失的覺悟，從市場買股票回補平倉。這個操作會讓股價再次上漲，導致其他使用信用交易建實倉的投資人，不得不跟著回補空倉，產生買股的連鎖反應，加速股價上漲。這就稱為「軋空行情」。


    軋空行情開始上軌道後，股價便會漲到原本不可能有的價位，使放空的投資人蒙受鉅額損失。這類因短期供需而使股價出現異常價位的狀況，會對根據基本面建倉的多空策略帶來巨大風險。


    另一方面，從長期來看，軋空局面的股價大多相當異常，或許是建新空倉的機會。


    重要的是依據自己目前身處的環境、操作規則、操作資金的性質、損失容許度等，控制部位和風險的量。


    多空策略有各種操作方式，有重視成長性、以業績變化大的中小型股為目標的操作，也有利用相同業種間的價差獲利的方式，還有做多績優股、同時在股市指數期貨放空指數的方式。預期獲利或風險，也會依操作方式的不同而異。


    ### 2 僅做多


    正如其名，只做多的操作方式。這種手法在有規定「單月虧損上限」的交易部門非常罕見，但在投資信託中則十分常見。僅做多可分為成長投資和價值投資兩種，前者是投資未來可望大幅成長的企業，後者則是投資股價相較於企業價值被低估的股票，這兩種的獲利目標都是優於標準股價指數（大盤）。


    附帶一提，日本股的標竿通常會用東證股價指數（TOPIX）和 JPX 日經 400 等。不搭配做空，只靠做多的操作方式，在牛市可期待高額獲利。相反地，行情走跌或進入盤整時，也會產生相對的損失。


    盤整時間短倒還好，如果下跌趨勢拉長，很可能造成持續虧損。過度相信「投資的是績優股，所以沒問題」，將導致嚴重失敗。


    如果身處的環境能允許某種程度的虧損倒無妨，倘若是自己的錢，便自負盈虧。但如果因為虧損額超出預期的風險，導致手上的績優股必須停損，確實堪稱憾事。重點在於理解自身的風險容許度，思考是否要選擇這種操作方式，或是能否在風險容許度內控制損失。


    不管是以月還是以年為單位，交易部門和避險基金都要求持續獲利。不管行情是牛市、熊市還是盤整，都必須採取能獲利的操作方式，幾乎不允許靠牛市能賺大錢，遇到熊市卻產生相對損失的操作方式。


    投資信託會用績效是否優於大盤來評估好壞，只要挑選較好的個股進行投資，讓績效優於大盤，便能獲得一定程度的好評。即使基金的操作成績是負值，下跌率若能低於大盤，也可說是操作卓越。


    以上兩項是最普遍的操作手法，若再細分還有很多不同方式。舉例來說，許多避險基金會觀察世界局勢進行操作，不過幾乎都是歐美的避險基金，源自日本的「全球宏觀」基金可說是相當罕見。


    話說回來，在中長期投資中挑選個股有許多方式，不過通常是以企業分析為基礎，篩選出應該做多或做空的個股。**此時重要的是，不能只憑個股是優良企業就做多，而是要看估值是否恰當。換句話說，要比對該企業的股價，相較於價值、成長性或未來的股價預測是否被低估，投資人必須對股價有一定的判斷基準。**


    這項作業近似於分析師。為了確實建立基本面或估值等判斷基準，必須理解該企業參與的事業內容和業界情況。這類學習和研究是投資判斷的基礎，因此最近有不少分析師出身的避險基金經理人。


    **中長期投資最重要的是分散。** 當可運用資金不多時，你可能想集中投資在自己認為最好的個股，這樣做如果壓對寶就能得到巨大獲利，確實也有散戶因此成功。但投資有賺有賠，不要冒壓錯寶就會賠大錢的風險，確實分散投資個股比較重要。操作的時間越長，越要分散標的。


    如果是當沖等超短期買賣，過度分散反而會造成反效果，因為超短期買賣必須隨時做出即時判斷。人類無法同時觀察多個標的，並即時進行判斷或處理，因此必須控制在可顧及的範圍內。


    相反地，進行中長期投資時，需要做瞬間判斷的情況比較少，因此投資人比較能同時操作一定程度的分散標的。


    另外，中長期投資還必須分析市場供需，例如：前面介紹多空策略時曾提到的軋空。個股在信用交易有大量空倉時，較容易發生軋空狀況，這類個股儘管業績等基本面不佳，有時卻可能因供需而導致股價暴漲。反之，信用交易中有大量多倉的個股則可能發生大跌的情況。為了不受這類風險（股價大幅變動）波及，最好事前針對投資組合內的個股，進行需求分析。


