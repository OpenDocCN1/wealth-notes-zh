    ## 圖表 4-2 隨時間經過的調整案例

    （日經 225 日 K 線與 100 日移動平均線）


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_123_1.png)


    換句話說，如果進場用 MACD，將採逆向操作（股價上漲時賣出、下跌時買進），用移動平均線則會採順向操作（股價上漲時買進、下跌時賣出）。


    但要注意，就算 DIF 線回歸零軸，也不代表一定要停利。與移動平均線的乖離縮小，有時是隨著股價下跌或上漲的調整，有時則是隨時間經過的調整。


    如圖表 4-2 所示，暴漲的股價維持高價盤整時，移動平均線會緩緩上升，與股價之間的乖離也會收斂趨零，這是典型因時間經過而帶來的調整。


    ## 圖表 4-8 背離的案例

    （日經 225 週 K 線與 MACD）


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_124_0.png)


    這種情況下，即使還不到停利水準，在乖離趨零時就應該確實平倉清空部位，這個概念相當重要，因為股價沒有下跌，而是隨時間經過調整，代表趨勢強勁、買單持續湧入，所以可當作是在高價水準賣出。這種狀態下，當乖離調整完畢，進入下一個上漲循環後，賣方可能會蒙受巨大損失。


    此外，當股價經過充分的下跌調整時，我也會將手中持有的空頭部位做一定程度的停利。


    此時，若是股價繼續維持下跌趨勢，獲利雖然能提升，但如果 MACD 朝負值擴大，是因為股價跌破移動平均線，且趨勢有大變化，股價也可能在移動平均線附近調整完畢後再度上漲。


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_125_0.png)


    即使在這種情況下，只要在檢查點先進行一定程度的停利，最糟頂多同價回補，依舊能保留獲利。這種部位控制法可以避免讓獲利變虧損。


    在檢查點確認是否要續抱部位，可用包含 MACD 在內的技術指標，判斷趨勢反轉的機率後再決定。此時的關鍵就是「背離」。


    正如圖表 4-3（由於觀察期間較長，此處採用週 K 線）所示，股價破前高，但 MACD 卻沒突破前高的水準，就是背離訊號。此時趨勢大多會有大變化，至少會有大幅度的價格調整，甚至是多空互換。


    看圖表 4-3，日經 225 在 2007 年春季和夏季，都突破 2006 年 4 月創下的 17563.37 點，但同時期的 MACD 卻遠不及 2006
    年 4 月的水準。比較 2006 年 2 月和 2006 年 4 月的高價，也會看到同樣的狀況。股價本身創新高，但 MACD 卻未跟上，代表上漲動能趨緩。


    不過，我在設定停損點時，不是靠股價水準決定，而是當 MACD 出現平倉訊號時，一定要做停損。只要在 MACD 大幅乖離零軸的地方建倉，照理說不會頻繁發生需要停損的狀況。不過，若是在未充分達到停利水準時出現訊號，就表示趨勢非常強勁，一旦隨時間經過調整完畢後，股價很可能持續上漲，所以才需要先平倉。


    ### 4-5 短線交易的重點整理


    本章解說完短線交易的重點和其他注意事項，本節做個整理。


    - 交易目的是靠一定期間的股價變動獲利。

    - 既然獲利的目的和期間改變，應該觀察的事物也會改變。

    - 確實分析圖表，釐清現在的股價位置和今後預測。此時，也要確定目標價位和停損點。

    - 事先掌握和分析個別的空利多、新聞或財報發表等。

    - 事先掌握和分析海外動向，或是對市場整體有影響的利多利空。

    - 事先確認財經行事曆或財報時間表等預定。

    - 不要過度沉迷看盤。要和市場保持一定的距離感與客觀的態度。

    - 進出場的依據要有一貫性。

    - 攤平要有計畫，嚴禁胡亂攤平（同超短期買賣）。

    - 做金字塔加碼前，要先看清楚目標價位、加碼後的風險和獲利（同超短期買賣）。

    - 發生意想不到的價格變動時，要依倉位狀況（個股數或風險量的狀況）判斷該優先避險還是停損。


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_128_0.png)


    NOTE


    ## 5-1 中長期投資，最重要的是分析基本面！


    既然要站在中長期的視點，靠基本面的變化獲利，就要做好倉位控制，不要受到短期市場變動的過度影響。


    中長期投資要做的事前準備，和當沖或短線交易有很大的差異。盤中幾乎沒什麼事要做，但調查企業或分析的時間會大幅增加。


    中長期投資的投資判斷大多以基本面為基礎，但基本面短期間內不會有巨大的變化。如果是採多空策略，也不用太在意市場短期振盪。相反地，假如明明是以基本面為依據建倉，卻因為短期的市場變動而造成投資判斷出現偏差，就會造成問題。


    即使只做多，如果資金操作前提條件（停損點等）的風險耐受力較高，就不需要因為短期的市場變動而患得患失。換個說法，既然要站在中長期的視點，靠基本面的變化獲利，就要做好倉位控制，不要因短期市場變動而過度受到影響。


    此外，分析個人交易表現的重要度下滑，研究業界、研究企業和分析個股的時間則會增加。資訊來源除了《四季報》、分析師報告、各企業的即時公開資訊之外，法說會也很重要。最近有些企業還會錄下法說會的影像。


    如果是投資信託或避險基金，基金經理人或分析師會直接拜訪企業，除了驗證數字之外，也會調查企業經營者的資質，或公司氣氛等無法從公開資料得知的資訊。


    另一方面，隨著電腦處理性能急速成長，有很多公司開始活用AI，並依據資料分析結果進行投資。利用大數據進行分析或教導AI，同時建構出投資策略的流程，也是一種「量化投資」。


    不過，由於股市相當複雜、變動因素眾多，尤其投資期間越長，左右市場的要素越多，因此目前中長期投資的電腦程式交易還在發展階段，相較於短期交易，程式式交易在中長期投資的世界裡依然是稀有存在。


    ## Column：交易員的幕後幫手


    交易員是孤獨的，尤其在盤中和市場對峙時，會格外明顯地感受到這一點。不管多麼辛苦和害怕，到頭來都只能由自己做決定。不過，一旦有巨大獲利時，交易員也容易變得傲慢，覺得「錢都是我在賺」。


    散戶一切都是自理，所以有這種想法或許無可厚非，但是交易員的狀況就不一樣了。交易員的確是舞台上的明星，但不能忘記後台其實有許多人在幫忙。再好的舞台，都要靠導演、大道具、小道具、照明、聲音、服裝、化妝等各式各樣的人協助才能成立。


    交易員的背後有管理部門、監察與法規遵循部門、資訊部門、會計部門等後勤支撐。下單成交後，票據處理、管理、結算處理等工作都是會計部門在負責。系統發生故障時，有資訊人員幫忙解決。若發生問題，由監察與法規遵循部門向政府管轄單位呈報。負責監控每日交易的，則是管理部門，而且，最重要的是信任你這個交易員，願意讓你在市場建倉的經營高層。


    如果你因為賺錢就變得傲慢，忘記心懷感謝，當陷入困境時，不會有人想幫你，當想嘗試某種新事物時，也不會有人願意協助。


    交易員的工作是在市場獲利，能賺到錢只是最基本且理所當然的事。千萬不能忘記，交易員是因為有他人的信賴和協助，才能長期從事這份工作。


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_134_0.png)


    ## 5-2 為何市場話題股不是中長期投資的首選？


    當個股開始受到市場矚目時，代表股價已經被高估。應該仔細思考該企業或個股的將來價值，已經在當前的股價上反應多少，再做投資判斷。


    相較於超短期買賣，中長期投資進場時機的重要性較低。投資的目的著重於企業的成長性、價值的修正和變化，所以在分析階段能確實擬好劇本，並設定目標價位。


    做多時，如果當前股價遠低於目標價位、獲利的可能性相較於風險更高時，就應該考慮進場。別因貪圖「買在最低點，賣在最高點」，而延誤進場。


    中長期投資的交易目的，不是靠短期的股價變動獲利，所以應該避免「擬定劇本卻無法持有個股」的風險。持有期間可能會有某種程度的未實現損益，但只要劇本尚未完全亂套，價格應當會逐漸回穩。


    最理想的進場時機，是在沒人注意到的時期持續買進，並持有一段期間，等到該個股的利多在市場上成為話題，帶動買氣使股價暴漲時出場。


    因此，假如標的已在市場上成為話題，使股價處於上升局面，買進並非上策。當個股開始受到市場矚目時，代表股價已經被高估。應該仔細思考，該企業或個股的將來價值已在當前的股價上反應多少，再做投資判斷。


    如果只做多，建倉時機便要一定程度地分散。如果在市場整體處於高價位時，一口氣建倉，可能會在價格調整的局面蒙受巨大損失，而不得不停損。只做多時，容易受市場整體的方向性影響，所以相較於多空策略，進場時機有更重要的意義。


    此外，多空策略因為搭配空頭部位，所以能抑制市場整體變動的影響，相較之下，只做多較容易直接承受市場變動的风险，部位控制也會變得更困難（參照本章第 4 節）。


    ## 5-3 別在盤中分析、判斷出場時機，而應該……


    不管是進場或出場，中長期投資都不是靠短期的價格變動獲利，所以分析、判斷時不要看盤中的價格變動，而應該在收盤後冷靜進行。


    以長期持有為前提時，不適合「未實現損益達到幾%就停損」的規則。實現劇本、達到目標價位便可停利，劇本失靈則應該停損。


    最困難的是發生意外狀況時。如果股價跌或漲到一個不可思議的水準時，該如何對應呢？


    基本上，出現意外事件時必須視為劇本失靈，應盡快停利或停損。但在此之前，必須確實分析意外事件的原因。假如相較於自己當初擬定的劇本，出現新的利多足以讓股價漲破目標價位，而且是自己能理解的狀況時，應該繼續持有。相反地，當跌破目標價位時，如果能預測這個狀況只是暫時性、遲早會恢復水準時，也可以選擇不要停損。


    不管是進場還是出場，中長期投資都不是靠短期的價格變動獲利，所以分析和判斷時，不要著眼於盤中的價格變動，而應該在收盤後冷靜分析。假如經過分析後依舊無法理解原因，只要在下一個營業日執行停損，或是採取降低風險對策等應對措施即可。


    不要過於拘泥每日的價格起伏，除非出現極端的股價變動，否則應根據平日的分析逐一對應才是上策。


    ## 5-4 投資時間越長，越要分散風險與評估投資組合


    分析能力再優秀，預測也會有失準的時候。如果在一筆交易中投入大筆資金，失敗時將會受到致命的傷害。


    中長期投資的部位控制重點在於分散個股。先不論沒有資金的情況，分散個股也能達到讓獲利穩定的目的。這是因為無論分析能力再優秀，預測也會有失準的時候。如果在一筆交易中投入大筆資金，失敗時將會受到致命的傷害。


    當然，你可以依照自己的信心程度增減投入的資金。但如果太過集中，一次失敗可能對投資組合造成巨大影響，影響整體的操作。


    **分散個股時，還必須考慮到個股的流動性。各部位的流動性如果不平衡，容易有過高的流動性風險，導致進出場的執行成本增加。**


    舉例來說，假如想用 1000 日圓的股價買進，但該個股沒有一定的賣單，因此下單時股價就會上漲，導致只能用比預期股價更高的金額購買，這部分相當於執行成本。相反地，想用
    1000 日圓賣出，卻沒有一定的買單時，賣單的成交價將會低於預期。所以投資組合的規模越大，流動性的考量越重要。


    此外，運用的資產規模越大，越不能只是分析個股，最好也要學習評估和分析整個投資組合。**在市場變動時，應該事前掌握自己的投資組合會出現何種反應和風險。**


    例如：用多空策略進行中長期投資時，如果多方偏重於中小型股，空方卻是代表性的大型股或股價指數，多空的投資組合特性將大相徑庭。兩者的差異可能成為獲利來源，也可能變成風險，因為中小型股主要是散戶，大型股則是外資的占比較高，這些投資人的動向將影響整個投資組合。


    如前所述，應該進行各種分析，事先理解自己的投資組合績效好壞的原因。特別是運用他人資金的職業操盤手，因為負有向投資人說明的責任，更必須理解自己操作的投資組合。


    ## 5-5 中長期投資的重點整理


    目前已經介紹完中長期交易的重點和其他注意事項，本節做個整理。


    - 交易目的是從企業成長、業績變化等基本面和估價的變化中獲利。

    - 以長期持有為前提，不要拘泥於短期的價格變動。

    - 對股價水準，應該要有自己的基準和預測。

    - 研究業界與企業分析是投資時的基礎。要確實擬定自己的劇本。

    - 不要去追買賣已經很熱絡且正在飆漲的個股，應依照自己預估的股價水準進行投資判斷。

    - 運用的資產越多，越要確實做好分散投資。

    - 運用的資產越多，越應該充分考慮到流動性風險。

    - 劇本實現後，達到目標價位便停利；劇本失靈或股價出現意外變動時則停損。

    - 不光是分析個股，還要考量投資組合整體的特性或風險。


    NOTE


    ## 6-1 什麼是衍生性金融商品？


    若確實理解衍生性金融商品的機制，你不僅能比無法理解的人早一步發現獲利機會，還可以充分理解市場發生的狀況。


    光是「衍生性金融商品的交易」這個主題，就能寫一本書，但本書的目的不在於此，所以本章僅介紹其特性、歷史和常識。


    衍生性金融商品也分成超短期、短線與中長期交易，但由於衍生性金融商品是期貨交易、選擇權交易或兩者的組合，因此會產生各種交易方式。以衍生性金融商品為主的交易員，和以操作個股為主的交易員，有許多不同之處，這裡將以對象商品的特徵和注意事項為切入點，來進行整理。


    閱讀本章時，可能會覺得艱澀或難懂，但衍生性金融商品的部位對股市整體影響相當巨大，因此確實理解衍生性金融商品的機制，有助於比無法理解的人早一步發現獲利機會，也能充分理解市場中出現的狀況。


    日本代表性的股價指數期貨，有日經 225 指數期貨和 TOPIX 期貨，最近受矚目的還有 JPX 日經 400 期貨和 Mothers 指數期貨等。


    此外，日經 225 指數期貨有在 SGX（新加坡交易所）和 CME（芝加哥商品交易所）上市，TFX（東京金融交易所）也設有日經 225 的保證金交易。不僅如此，還有和各股價指數連動的
    ETF。以日經 225 或 TOPIX（東京股價指數）為交易標的的衍生性金融商品，可謂數量眾多。


    此外還有選擇權交易。選擇權交易中，流動性最高、交易最頻繁的是日經 225 選擇權。個股也有選擇權交易，但不怎麼熱絡。


    這些交易有各種運用方法，接觸時必須使用不同於個股的視點。以下將介紹其中幾個重點。


    ## 6-2 期貨的重點，在於先理解理論價格


    實際上，在市場中的期貨交易價低於交易標的，絕不等於價格被低估。應該比較的是：期貨價格是高於還是低於理論價格。


    這是衍生性金融商品交易中最單純的方式，也具有一定的流動性，因此也可用較大筆的金額交易。2005年前後，地方券商的交易部門頻繁進行期貨交易，有段時期買賣資訊的前幾名都是地方券商。當時我也是其中一人，和其他公司的交易員（他們是朋友兼競爭對手）進行激烈的競爭。


    但期貨交易相較於個股，受 HFT 或交易高速化的影響更大，導致地方券商能以此手法為主，賺取高額獲利交易員銳減，現在已幾乎沒有交易量。


    基本上，衍生性金融商品在短期交易上應準備和注意的事和個股相同，技術指標的有效性或事前應調查的項目也相同。在個股方面，必須事先掌握指數相關性較高的個股資訊，但相關性較低的則不需太過關注。


    附帶一提，指數相關性較高，代表個股股價會大幅影響指數動向。對日經 225 影響力較大的個股有迅銷、軟銀、發那科（提供機器人和電腦數控工具機等自動化產品服務）、KDDI、東京威力科創、京瓷等。


    分析和預測日經 225 指數期貨的價格變動時，必須注意這些與指數相關性高的個股動向。接下來，說明交易期貨時必須先理解的重點。


    ### ① 理論價格


    大阪日經 225 指數期貨隨時會有 13 種期貨，都是以 3 月、6 月、9 月、12 月（稱為「交割月份」）第二個星期四為交易最終日（一個交割月份的期貨到期後，下一個期貨會接著上市，所以隨時會有
    13 種日經 225 指數期貨）。


    此外，還有迷你大阪日經 225 指數期貨（註10）和不同交易所的日經 225 指數期貨等，上市的交割月份皆有不同 的規定。


    期貨交易其實只是衍生性金融商品。換句話說，因為有交易標的，才從中衍生出商品。大阪日經 225 指數期貨的交易標的，則是日經 225 股價指數（＝日經平均指數）。


    實際看兩者的價格變動就能明白，日經 225 指數期貨是以日經 225 為交易標的，但價格絕不會一致。日經 225 指數期貨在交割月份的第二個星期五結算期貨交易時，會採用
    SQ 值作為結算價（指數特別報價，也就是用成分股開盤價計算出的數值）。此外，兩者價格會反覆呈現若即若離的關係。


    那麼，期貨交易的理論價格又是什麼？要先理解理論價格，才能判斷當前期貨交易的價格是被高估還是低估。其算式可以簡單寫成如下：


    **日經 225 指數期貨的理論價格＝日經 225 ＋利息－股利**


    利息是日經 225 採用的所有個股（以下簡稱一籃子股票）持有到 SQ 日（最後交易日的次營業日）為止的利息成本。股利則是一籃子股票持有到 SQ 日為止，能獲得的股利收入。


    期貨交易不必支付總額，只要支付部分的保證金就能交易，所以不需要大筆的現金。相較之下，如果買一籃子股票，基本上要支付全額現金。


    如果期貨和交易標的的價格一致，交易時不需要全額現金的期貨將比較有利，如此一來會產生矛盾，因此要在交易標的加上利息。


    另一方面，股利則是持有一籃子股票的期間能得到的股利收入，但期貨不會有股利，所以要扣除股利部分。此

