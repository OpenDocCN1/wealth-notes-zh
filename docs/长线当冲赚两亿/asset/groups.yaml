    原則上日經平均指數是以 225 檔個股的股價平均算出，如果面額 50 日圓的個股和 50000 日圓的個股相加，後者的股價會大幅影響日經平均指數，因此計算時，會把面額
    50 日圓以外的個股全部換算為 50 日圓（即「視為同面額」）。


