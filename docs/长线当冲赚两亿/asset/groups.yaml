    但期貨交易相較於個股，受 HFT 或交易高速化的影響更大，導致地方券商能以此手法為主，賺取高額獲利交易員銳減，現在已幾乎沒有交易量。


    基本上，衍生性金融商品在短期交易上應準備和注意的事和個股相同，技術指標的有效性或事前應調查的項目也相同。在個股方面，必須事先掌握指數相關性較高的個'
