    225 暴跌。對理解股價指數成分股、計算方法及市場會出現何種交易的人來說，這是很大的獲利機會。


    雖然往後應該不會再出現如此草率又危險的個股替換，但投資人還是要事先瞭解，替換成分股會影響股市波動，有時甚至會創造獲利機會。個股投資人也可能交易到被汰換或更新的個股，所以應該先理解供需背景。


