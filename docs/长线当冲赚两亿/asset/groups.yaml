    ### 一個月賺兩億，我的一天行程如何安排


    交易員這個職業總給人光鮮亮麗的印象，但頂尖好手之所以頂尖，是因為他們都嚴以律己，努力不懈。


    我還在第一線時，是如何度過每一天呢？我把它整理成圖表 1-1 供各位參考。


    收盤後要做的事情，光是大致列出來就跟山一樣多。反省、確認和準備工作需要花費許多時間。過去在收盤後還要整理傳票和核對，因此我年輕時幾乎每天都在公司待到三更半夜。


    不管是什麼交易，如果想獲利，就不能怠慢準備和努力。據我所知，頂尖好手都是一群嚴以律己、努力不懈的人。


    交易員這個職業總給人光鮮亮麗的印象，大家往往關注他們的收入或花錢方式，但頂尖好手之所以頂尖，是有原因的。


    圖表 1-1 我現役時代的每日行程


    | 時間 | 內容 |

    | :--- | :--- |

    | 四點 | 起床 |

    | 四點～五點 | 確認美股到收盤為止的走勢，同時確認睡覺時發生的新聞或消息。確認日本市場相關個股的動向等。 |

    | 六點左右 | 通勤，在電車上仔細閱讀《日本經濟新聞》。 |

    | 七點左右 | 進公司，確認當天的消息或行程（大致記下當週的事情）。利用資訊裝置等，確認其他新聞或消息。依據收集到的資訊，針對當天的市場動向擬定交易劇本。
    |

    | 八點 | 交易所開始接單。確認委託單，觀察買賣狀況，確認是否有不協調之處、和自己預想的劇本有無差異。 |

    | 九點 | 開盤。這個時段，市場的波動比較大，也是超短期買賣的機會。不過，供需關係容易出现非預期的波動，所以我大多一直觀察到價格相對穩定為止。 |

    | 盤中 | 集中交易。 |

    | 收盤 | 收盤前股價比較容易有波動，所以是超短期買賣的機會。從當日的股價變動，可推測出這個時段的波動及供需，所以我會積極參與。不過，有些證券公司會限制這個時段的交易。
    |

    | 盤後 | 確認和反省自己的交易內容。再次確認自己在盤中的行動是否適當。 <br> - 超短期買賣（當沖）會對照跳動點圖，逐一確認。<br> - 分析觀察股的圖表（我自有近
    900 檔）。<br> - 檢查主要指數、匯率、利率、商品等圖表。<br> - 分析財報或指標。<br> - 收集數據、分析程式。<br> - 列出下個交易日預定交易的個股，並存入觀察股名單。<br>
    - 如果交易目的是做短線，先確認和登錄進場價格、停損、目標價位。 |

    | 盤後 | 對於選擇權策略等部位，會以模擬的方式再次計算和修正對沖計畫。<br> 分析、整理中長期持有個股的相關消息與新聞。<br> 進行其他研究。 |

    | 傍晚 | 持倉或有交易機會時，會利用夜盤交易。<br> 有時參與交際應酬，在這類活動中獲得助益。 |

    | 晚上 | 持倉或有交易機會時，會用夜盤或到海外交易所進行交易（任職於有這種環境的公司時）。 |


    ### 對於「靠做空賺錢」這件事，我認為……


    交易員不僅要在上漲時賺錢，即使在盤整或下跌趨勢中也必須獲利，所以應該認真面對「做空」的選項。


    過去在交易部門，操作個股的交易員當中沒多少人擅長做空，甚至還有資深交易員主張「股票要從做多開始」，這或許是因為他們覺得看空行情對市場不好。但在擅長操作金融衍生商品的交易員當中，喜歡下跌行情的人應該占壓倒性多數。


    我還在第一線時，也喜歡恐怖但有緊張感、會讓人腎上腺素大增的市場暴跌。因為下跌時的速度和股價波動都會比較大，是非常吸引人的獲利機會。


    稍微思考一下，便發現這也是理所當然，因為大多數的投資人會用各種方式買進股票並持有，其中包括日本政府年金投資基金（GPIF，以下簡稱年金）或企業交叉持股等。所以在股價上漲時，獲利只會不斷增加，只要靜觀或停利即可，不需要慌張。


    然而，若股價大跌，他們持有的部位或投資組合便會產生巨大的損失，於是不得不採取防衛行動，進行避險或認賠殺出，或是因產生追加保證金而強制停損。此時市場投資人容易受情緒影響，導致行情暴跌，波動性也會增加。


    在操作選擇權方面，這時候賣權的隱含波動率將高居不下。波動性在暴跌市場中會增加，但在暴漲市場卻難以增加，是因為暴漲時，市場參與者的部位會壓倒性傾向買方，但避險需求只有在下跌方向會增加。雖然用布萊克－舒勒模型（Black-Scholes，OCR
    原文誤為休斯）計算時，隱含波動率看起來會上下對稱，但這種情況源自市場供需，無法靠公式計算出來。


    但其實，做空的風險相當大。股市有句話：「股價無上限」，下跌的極限就是歸零，而上漲在某個角度來說是沒有極限。有人把賣空（包含期貨等做空）比喻成「未來的做多」，因為賣掉的部位遲早要買回補平，這個舉動也會引發俗稱「軋空」（參照第
    2 章第 4 節）的現象。


    另一方面，在暴跌局面中，有時會因為有人回補而停止下跌。如果所有人都做多，當市場暴跌時，很難有買單入場，可能會使恐慌更加擴大。


    在市場成熟的先進國家，經濟成長率不會太高，市場絕不會只漲不跌。或許有人覺得「靠造成股災的暴跌行情獲利是一種罪惡」，但如果因為工作需求，必須用中立態度面對市場，基於合理的運用作針（OCR
    原文誤，應為“作準”或類似意涵，保留原意修正）讓獲利最大化，那麼靠暴跌行情獲利也無妨。


    確實，我曾因為靠做空獲利而感到過意不去，也曾好幾次揳心自問（OCR 原文“捫”應為“扪”或“扪心”，修正為“扪心”）。但既然我的工作是在行情變動中尋找獲利機會，就應該把個人情感擺一邊，用最佳方式運用自己分配到的部位，將獲利最大化。


    過去在震災時，有位後進交易員也有同樣的煩惱，我告訴他：「既然這是工作，就應該把個人情感擺一邊，全力做好最恰當的交易。然後，去當志工或捐款，才是你個人能盡到的心力。」


    不管是上漲、下跌或盤整行情，交易員都必須持續獲利，所以在思考這份工作時，必須正視做空的選項。


