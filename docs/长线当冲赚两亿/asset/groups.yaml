    # 3-2 為什麼盤中盡量不要查資料，或看新聞評論？


    當日沖銷等超短期買賣，大家常會忽略收集和分析資訊的重要性，僅靠委託單資訊或主觀感覺做判斷，如此一來，容易受股價變動影響，使得視野變狹隘，一旦判斷錯誤，便會陷入惡性循環而無法拉回正軌。


    這種時候必須俯瞰市場，保持客觀的距離感。要保持這樣的冷靜，重要的是利用事前準備和事後分析，收集與分析基礎資訊。


    事前準備的另一個重點是挑選個股（這點在盤中也一樣）。超短期買賣時，如果選擇業績優良、預期將有高成長性的個股，是否恰當？


    雖然無法保證要等多久，但這樣的個股股價確實會穩健成長。不過，正如前文所述，績優股也有下跌的時候。在當沖等超短期買賣中，業績或基本面良好的個股優先順位較低。


    **超短期買賣最重視的是波動性**。由於要在極短時間內進出場，**股價變動大的個股，交易機會也會比較多**。如果用這個觀點來選股，會大涨或大跌的個股就不用說，還要注意成交量急速增加的個股。此外，符合市場主題或話題的個股，也會受到許多參與者的矚目，導致股價波動偏大，事先列出這些個股也是重要的事前準備之一。


    > 註 7：Proprietary Trading System，譯為私設交易系統，也就是不經證券交易所進行交易的系統。


    > 註 8：American Depositary Receipt，即美國存託憑證，是大多數外商公司在美國股票市場的交易方式。美國投資人可以藉由美國存託憑證，間接投資外商公司的股票。


    若是依賴第三者的預測或判斷，一旦資訊有誤，便蒙受損失，而且買賣時機會跟其他大多數的投資人一樣，絕不可能提早一步或兩步行動。


    持續進行當沖這類超短期買賣時，視野會逐漸變得狹隘，因為你會一直注意自己交易的個股。不知不覺間，變成下意識只會確認該個股的委買委賣。


    交易個股時，應該俯瞰市場整體，並與市場保持適度的距離感。即使做超短期買賣，也應該記住：自己是靠巨大市場的一部分動向或潮流來進行交易。過去我會先掌握潮流，再靈活調整部位，或是決定基本策略要用順向還是反向投資。因此，必須先做好前一節提到的事前準備。


    **盤中基本上沒什麼東西要調查。雖然當發生可能影響行情的重大突發事件時，依然必須進行事後調查，但為了集中精神在交易上，最好盡量不要查詢資訊。**


    舉例來說，例如某天早上行情突然暴漲。要是事前沒收集資訊，遇到行情暴漲的局面才慌忙入場，就會因為搞不清楚暴漲的原因是什麼，而在盤中陷入不斷調查資訊和思考的窘境。


    但是市場的動向很快，當你理解暴漲的原因時，短期的上漲循環可能已經跑完一輪，或是不得不在飆漲後才進場等，所有的行動都會淪為被動。


    當然我們也可以參考市場評論員的評論或新聞解說，省去自己下判斷的時間。但若是依賴第三者的預測或判斷，就無法靠自己的力量獲利，一且資訊有誤將會蒙受損失，況且，當你透過媒體得知資訊的同時，別人一樣看得到這些資訊。換句話說，你的買賣時機會跟其他大多數的投資人一樣，絕不可能比別人提早一步或兩步行動。


    **如前所述，如果確實做好事前準備，預先理解股價變動的理由或背景，便能做到某種程度的預測，可以比其他市場參與者早一步行動**。如此一來，在晚一步入場的人買進時，你卻能從容停利，同時等待下一個上漲時機。超短期買賣最重要的是節奏，事前是否做好準備，將會產生巨大的差異。


    此外，盤中還希望各位注意一點：即使行情預測錯誤，也要保持冷靜。大家都希望自己的預測能做到精準，但不可能百分之百正確。


    當然，為了提升預測精確度，分析後也必須進行修正，或是透過反省來逐步改善，但請大家務必記住：因為預測失準而生氣或意氣用事，是一件非常愚蠢的事。


    為何預測錯誤會讓人生氣？這是源自自尊心過高，或是「明明已經很努力了」的情感。這樣的情感會讓判斷失真或變得遲鈍。預測終究只是預測，當失準時，只要找出原因，加以考察和修正即可，不要忘記：承認錯誤也是一種勇氣。


    ### 3-3 想抓準進場時機，就要事先鎖定交易個股


    > 盡快找出股價有波動性的個股，並將個股變動的因素或相關個股預先記在腦中，就能早一步對應。


    超短期買賣當中，進場的時間點很重要。做當沖時必須盡快找出股價有波動性的個股，並將個股變動的因素或相關個股預先記在腦中，便能早一步對應。但股價變動大，也表示風險高，正因如此，實際買賣的進場時機十分重要。


    我在計算超短期買賣的進場時間點時，常會用到技術分析。此外還會觀察新聞報導、股價指數、利率、匯率、商品等指標，掌握市場狀況的同時，隨時觀察事前擬好的劇本與實際動向是否有差異。


    確實做到這樣的觀察十分重要。正如前述，持續進行個股或期貨的超短期買賣時，容易在不知不覺間，只關注標的個股的動向或委託單，使得視野變狹隘，因此可能漏看重要的變化或不尋常的地方。所以要和股市保持適度的距離感、俯瞰大局，再估算個股價位變動的時機，請務必抱持這樣的感覺來面對股市。


    當然，買賣時機比任何事情都重要。超短期買賣是靠極小的波段獲利，所以一旦時機開始失準，容易變成高賣低賣、低賣又高價買回的失序交易。這種時候，等收盤後回顧自己的交易內容，大概會覺得自己是全世界最蹩腳的交易員。


    當沖這類在極短時間獲利的方式，基本面不會有太大的變化。原則上，需求變化是股價變動的要因。


    但最近這類短期供需變得比以前更難判讀。因為以前沒有演算法交易或 HFT 等電腦高速交易，不僅公開證券公司的買賣資訊，而且會公開一定數量以上的大筆交易，便於掌握買賣狀況。在這樣的環境下，有時間徹底分析的當沖交易員簡直如魚得水。


    現在券商的買賣數量基本上不會公開（註9），資訊量也變得有限，再加上交易的執行變得高速且複雜化，所以短期供需很難只靠券商的買賣數量或委託單判讀。在這樣的環境下，圖表或技術分析便成為確認短期股價的重點，或是買賣時機的指標。


    我過去在做超短期買賣時，也會頻繁使用圖表或技術分析，這是為了不過度盲從委託單和股價變動。有時光看委託單和價格變動，可能讓人感覺正是進場時機，但再觀察 RSI、KD
    指標或 MACD 等技術指標，卻可能顯示市場明顯過熱，便能因此恢復冷靜。适度運用振盪指標類的技術指標，便能看出此時是否應該深造。


    技術分析使用的指標有許多不同類型，如果想全部理解會花上許多時間，又相當辛苦，所以建議各位挑幾個眾所皆知的光術指標，先試著使用看看。我自己就會頻繁使用移動平均線等基礎指標，詳情請見下一節說明。


    > 註9：2003 年以前，日本各券商的買賣資訊會在盤中即時公布給所有券商，便於投資部門的交易員參考，這項措施於 2003 年 6 月停止。


    ### 3-4 做當沖時，怎麼用移動平均線看進場點？


    許多市場參與者會觀察移動平均線，而大多數人觀察的技術指標訊號，容易成為股價的轉換點。


    **技術分析使用的技術指標各有優缺點，使用時要先理解指標才有意義。** 技術分析說到底只是工具，如果只是盲目使用，不知道其目的或用法，便無法獲得預期的結果，就像是用尺來量體溫。因此，重點在於理解工具的目的，且適當使用、不要盲信。


    我會依照各種技術指標，使用過去幾年的數據徹底進行回測和驗證，再依狀況使用。使用部分的技術指標時，還會嘗試變更基本的設定值。我做當沖時，會頻繁使用移動平均線和
    MACD。


    **不同的技術指標，所顯示的方向性、訊號、時機各不同，一次看太多指標反而會混亂。** 因此我經過徹底研究，選擇移動平均線和 MACD 當作判斷基準。超短期買賣必須頻繁下判斷，所以我盡可能簡化判斷基準。


    本節會針對最通俗、大多數人參考的移動平均線，解說我觀察的重點（MACD 會在第 4 章第 4 節詳細解說）。


    有些人會覺得：「移動平均線只是一定期間內的股價平均值，有什麼意義嗎？」但從結果來說，大多數人觀察的技術指標訊號，容易成為股價的轉換點。由於有很多市場參與者會觀察移動平均線，因此用來估算入場時機相當有幫助。


    我過去做當沖是用 5 分 K 線為基礎的移動平均線，並用 5、25、75 和 100 週期觀察（做短線看日 K 線時也一樣）。基本上採用順向投資法的拉回買進及回漲賣出。


    我在股價急速上漲時，除非是做非常即時性的交易，否則幾乎不會在價位大幅偏離移動平均線時順向進場，因為這種時候不容易判斷目標價位和停損點（我個人稱這類交易為「空中戰」）。


    在觀察移動平均線和股價時，會傾向於注意「急漲（急跌）後的調整→進入下一個起漲（起跌）的時間點是哪裡」，也就是大家常用的拉回買進和回漲賣出。這裡以圖表 3-2
    簡單說明（為了讓圖表更單純，這裡只用 25 週期和 100 週期的移動平均線）。


    首先在交易時，應觀察何種週期移動平均線，會依價格變動的幅度和時間而異。


    如果在漲勢強勁的狀態下，想撿短期的拉回買進，可以觀察 25 週期的移動平均線的水準（淺色線），找出股價拉回時的進場點（白色圓）。但在短期的情況下，持續下跌的可能性也很大，我還會參考其他的指標，判斷上漲趨勢較強時，才會使用
    25 周期移動平均線。


    # 「拉回買進」和「回漲賣出」的移動平均線使用例（日經 225 指數期貨 5 分 K 線）


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_86_0.png)


    除此之外，我大致上會觀察 100 週期的移動平均線（深色線），找出拉回買進的進場點（灰色圓）。但最後一個灰色圓部分，由於移動平均線出現死亡交叉，所以不要在那附近買進，就算買進也必須在死亡交叉出現時平倉。


    當然有時也會出現股價一直不跌到移動平均線，或是稍微跌破的情況，這時就必須思考該如何修正買進時機、買入方式和停損點的設定方式等。


    具體來說，我會基於自己驗證的經驗，制訂一套規則對應，例如：使用移動平均線買進時，會在平均線上下方設一定範圍的區間，並在該區間內分散時間點買進；當股價跌破移動平均線到一定程度以上，或跌破其他圖表上的點位時，則會進行停損等。


    此外，若開盤時跳空開高或開低，我也會使用技術指標來計算進場時機。開盤跳空除非有很大的利多或利空消息，否則我會盡量避免進場。


    市場處於興奮狀態而開盤跳空時，股價容易產生波動。有人會抓準這樣的機會，但我認為這種狀況的不確定性偏高。為了估算出股價回穩的時機，我會觀察移動平均線來找出適當的進場時機。


    實際上，很多人會觀察移動平均線，所以股市因為平均線的狀況而止跌的情況並不算少見。如果使用這種方法，進場點即為移動平均線本身的變化，所以進場時機也會變得單純。


    另一方面，也會有難以判斷目標價位和停損點的狀況，這時光看移動平均線也不會有答案。所以我會活用股價的前高前低或其他技術指標來設定目標價位。搭配使用的技術指標有
    MACD、RSI、隨機指標（KD）、P & F、拋物線指標等。但主要運用的還是移動平均線和 MACD。


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_88_0.png)


    # 盤中出現重要新聞時，該怎麼應對？


    即使在新聞出現的瞬間入場，你也不會是最先搶到部位的人。總會有人比自己更早進場，因此必須在短時間內做出各種判斷，再思考如何停利或停損。


    超短期買賣有時會遇到一種狀況，乍看似乎無視「①收集資訊→②分析→③判斷」的基本交易流程，便是依據新聞等突發消息交易的時候。


    從宏觀到微觀的各種新聞都可能影響市場，包括政治新聞、評論、地緣政治風險、經濟統計、企業業績發表、即時揭露資訊、財政發表等。


    新聞或消息對市場造成影響後，股價當然會劇烈變動，因此難以決定目標價位或停損點。


    即使在新聞出現的瞬間入場，你也不會是最先搶到部位的人。最近，許多機構採用系統交易，利用程式監控新聞，在新聞出現的瞬間便進行交易。然而，人類是用肉眼看新聞，透過大腦思考後才下單，在手動進行這個流程時，機器早已搶先好幾步交易。


    所以要記住；總會有人比自己更早進場，再思考如何停利或停損。該新聞或利空利多的題材是否會形成長期趨勢，或是只有短期影響、對股價會造成何種程度的影響、會有多少炒短線的人進場等，必須在短時間內做出各種判斷同時應對。


    即便在這樣的狀況下，只要事前確實收集資訊和分析，通常還是能取得優勢。經濟統計或企業業績相關的資訊，只要事前記住過去的變化和預測值，就能做出某種程度的預測，瞭解當預測值和實際數字出現落差時，股價會有什麼反應。


    拿最近的例子來說，我們來看 2016 年 6 月英國公投決定要脫離歐盟後，對市場造成的影響。當時我特別注意的是，掌握哪個網站的資訊比較快、哪個市場對這項題材反應最快，以及公投結果出來的時間和流程為何。事前做好這些準備，就有機會比其他市場參與者早一步下判斷。


    此外，還必須一併思考現在的市場預測有什麼共識，以及股價反應到何種程度。當時市場參與者大多認為英國不會脫歐的機率比較大，證據是當時日經 225 從 2016
    年 6 月 16 日的最低點 15395.98 點，一路來到 6 月 24 日的最高點 16389.17 點，上漲將近 1000 點。


    從這個動向來看，市場對英國脫歐被否決的期待感較高，因此事前便可預料到：當結果出乎意料，也就是公投支持脫歐時，潛在風險將大幅提升。


    實際上，6 月 23 日脫離歐盟的公投結果出來後，日經 225 當天便大跌超過 1000 點。公投結果出來的時間，剛好是亞洲的白天，所以沒經過歐美市場的緩衝，日本成為首當其衝的市場，這也是股價暴跌的主要原因。這時如果事先預測公投後可能會脫歐，並做好收集資訊及分析等準備，就能做出適當的應對。


    換句話說，由於市場預測英國脫歐會被否決，令股價提前上漲，因此事前便能預測：在極短期的供需上，下跌的風險大於看漲的期待。這點在 2016 年川普對希拉蕊的美國總統大選時也一樣。


    個別企業的業績預測也一樣，事前做好準備，明白目前的股價是在何種共識下成立，新聞出現時便能避免受到後續的暴漲暴跌波及，提高安全下檔的機率。


    為了在盤中冷靜做超短期買賣，事前準備很重要。超短期買賣並非直接下場決勝負，而是需要一定的準備才能提高勝率、做更穩定的交易。正是因為事前有做好①收集資訊→②分析，才能適當地做出接下來的③判斷。


    # 出機相關的重點如下：


    ## ① 先決定出場點再進場


    交易時，出場可說是最困難的部分。出場有三種：停利（勝）、停損（負），以及同價賣出（平手，正確來說會損失交易成本）。


    在進場時，大多數人會有「看起來會漲所以做多」、「看起來會跌所以做空」等某種程度的預測，但不少人卻是先持有部位後，才考慮出場的事。超短期買賣要維持穩定獲利，重點在於進場前能否先有確實的出場點。


    假設是「看起來會漲，所以做多」的情況，但買進後股價不如預期並開始下跌，此時肯定會感到不安，同時出現不想賠錢的想法。當股價繼續下跌時，這樣的情緒逐漸增強，導致無法冷靜客觀地做出判斷，有時還會感到焦躁、激動和憤怒。


    股價變動和預期不同卻能繼續忍耐，有不少人會說這叫「毅力」。但遺憾的是，假如沒有客觀依據，即使偏離預測仍一昧忍耐，這只能算是「死撐」。事情演變成這個地步，表示該筆交易已經失控，這種死撐會在不知不覺間變質，甚至變成希望神仙來救的期待。


    正如「不能抱著期待看行情」這句格言，假如一直持續上述的做法，就算行情救了你再多次，總有一天還是會賠大錢，落到必須退出市場的地步。


    人在還沒持有部位時，最能冷靜客觀地分析市場。雖然是理所當然的道理，但很多人會忘記這一點，總是想持有部位，這樣的想法在當沖更是大忌。這些人輕忽交易流程而總是胡亂進場，於是受制於股價的波動，心情像洗三溫暖，勞心費力卻沒賺到錢。


    超短期買賣最重要的是節奏和時機。為了能順利交易，就算交易間隔再短，也必須確實完成交易流程。為此，必須先決定好出場點再進場。


    出場點也會影響到進場的判斷，不能單純因為「看漲所以做多」，還必須思考「可望漲到多少」或「可能跌到多少」，這個依據可以是技術分析或利多利空消息。如前所述，可望漲到多少是期待獲利，可能跌到多少則是風險。


    事先確實評估風險和獲利，就不會一直隨便進場。


    **當獲利＞風險，持倉才有意義，假如獲利≤風險，則必須拋售。** 這項原則能幫助你整理交易項目，並克制自己不去碰獲勝機率低或高風險的交易。


    ## ② 設定停損點，釐清認賠殺出的時機


    超短期買賣的好處，是不用一直持有部位（風險），「只要挑油水最多的地方交易就好」。


    說到超短期買賣，有靠小幅的股價變動套利，或 HFT 交易等透過反覆交易來獲利的手法，而這裡說的超短期買賣，則是靠目視和手動進行的當沖，不是靠交易次數多寡來決勝負，請先理解這個前提。


    正如前述，超短期買賣重要的是節奏和時機。為了提高勝率，必須在短時間內完成①收集資訊→②分析→③判斷的流程。**不要胡亂增加交易次數，重點是謹慎做好每一筆交易。**


    當我還在第一線當交易員時，我將「謹慎做好每一筆交易」這句話貼在辦公桌前。超短期買賣要成功，除了提高勝率之外，還要維持「勝利％數（獲利）＞失敗％數（風險）」的平衡。換句話說，要維持損小利大，這也決定了最後是否能留下獲利。


    為了持續保持獲利與風險的平衡，應該在最能冷靜與客觀的狀態下執行交易流程，也就是手上沒部位或準備進場時，先行考慮出場點，並分析、判斷風險與獲利。這是一切的重點。


    此外，事先決定停損點還有一個用意。決定停損點後，就可預測「在這個股價停損會損失多少」，掌握虧損上限。如此一來，即使股價在停損前出現振盪，還是能保持內心的平靜。


    相反地，如果事前沒設停損點，即使基於客觀分析進場，也可能掉進惡性循環的陷阱，也就是在不知不覺間變得過度情緒化，等到損失不斷擴大到無法停損後，卻還是一股腦地想繼續回單，害自己越賠越慘。重複進行這樣的交易遲早會出事，為了讓自己不管遇到哪種狀況都能保持冷靜，請事先決定好「認賠殺出」的時機。


    股市交易賠錢在所難免，不可能百戰百勝。為了在反覆的交易中長期穩定獲利，學會「怎麼賠錢」十分重要。


    ### 3-7 停利或停損點，不是看賺或賠多少來決定，而要......


    行情絕對不會照自己的想法走，既然要靠股價的變動獲利，停利或停損點都應該依股價的變動客觀決定。


    停利的目標價位與避免大賠的停損點，都必須以股價為基準，本節要思考該如何設定。


    可能有些人會用「賺了多少就停利」或「賠了多少就停損」來決定，但這只是主觀想法。行情絕對不會照自己的想法走，既然要靠股價的變動獲利，停利或停損點都應該依股價的變動來客觀決定。


    另外還有一個重點，就是進場和出場的依據要一致，或是有合理的共通點，兩者必須有一貫性。


    超短期買賣時，雖然用技術分析進場，結果卻看委託單的氣氛出場。中長期投資時，明明依據基本面進場，最後卻用技術分析出場。這類進出場依據不一致的案例，經常出現在股市中。反覆進行這樣的交易，當你回顧交易記錄時，會搞不清楚自己到底是要抓哪種獲利、想進行什麼樣的交易。為了避免這種狀況，進出場依據必須保持一貫性。


    如果是做超短期或短線交易，要設定目標價位或停損點時，技術分析是有效且能廣泛運用的工具。當然還有其他東西能當作依據，但首先應學會運用技術分析。


    不過有一個問題：其實並沒有任何技術分析的手法，能淺顯易懂地告知目標價位於哪裡。


    在做當沖時，可以用以日 K 線為基礎的指標，加上前高和前低、移動平均線或同樣以日 K 線為基準的一目均衡表、樞紐點等，事前整理出價格上的轉折點，然後參考這些資訊，思考目標價位應該落在哪裡。


    前面提到的移動平均線，以及下一章將詳細介紹的 MACD，其實本質上有共通要素，所以我以前常併用。


    這裡先略提一下 MACD。MACD 的計算基準「指數移動平均線（EMA）」，類似於移動平均線。當 MACD 的乖離變大時，移動平均線和股價的乖離也會變大，所以當乖離較大時所產生的訊號，可信度相較之下會比較高。


    依據該訊號進場時，我會用股價觸碰或接近移動平均線（即 MACD 收斂）當作平倉（停利）基準。換句話說，移動平均線和股價的乖離較大時，我會與市場逆向操作，並將股價觸碰到移動平均線（乖離收斂的時間點）當作目標價位。


    雖然這是與市場逆向操作的情況，不過該目標價位應

