  - '[PAGE 194]


    避險基金之王索羅斯、奧瑪哈的先知巴菲特等投資世界的佼佼者，也承認自己時常犯錯。所以像我們這樣的凡人會犯錯可說是理所當然。


    我也不例外，由於自覺到這一點，我將部落格取名為「渺小交易員部落格」。金融市場實在過於龐大且複雜，自己相較之下只是渺小的存在，所以犯錯也無所謂，重點在於要避免在犯錯時受到致命傷。


    接納不成熟的自己，理解自己身為凡人也會犯錯，如此一來，當判斷失誤時，就不會做出傲慢且不合理的行動，像是因固執而不肯停損，或隨便亂攤平等。


    請告訴自己：「犯錯也沒關係」，看清自己的弱點，謙虛接受錯誤。因為知道自己會犯錯才會努力，並且成為你的勇氣，讓你面對市場的恐懼。正視自身弱小踏出第一步，才能學會真正的堅強。'
