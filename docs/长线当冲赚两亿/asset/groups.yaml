    不過，這樣的時代對交易員來說反而是春天。交易雖然系統化，但處理能力還很慢，基本上是靠目視交易。當時還會公開各券商的買賣量，所以容易判讀部位（哪家持有多少部位）和委託單等。


    從螢幕的委託單畫面上，可感受到市場參與者的氣氛和熟絡程度，能推測「在這種賣盤買進會出現軋空」，或「這裡賣一下就會有人拋售」等，交易員透過委託單持續戰鬥。


    接近 2000 年左右，中小證券的套利機會逐漸消失，市場價差也沒有 1990 年代這麼大，但依舊有充足的獲利機會。更重要的是，交易員的收入在這個時代暴增，也出現好幾位年收破億的交易員。


    當時日本還有「高額納稅者公布制度」（已於 2006 年廢止），中小證券的交易員也曾經出現在名單中。甚至還有中小企業的交易員跑到新加坡成立避險基金等，整個業界算是相當活絡。


    2003 年時，東證決定不再公開券商的交易資訊。在那之前，一有大筆買單，大家都會知道是哪家證券公司買進的（超過一定數量的大單甚至還會廣播），如果是大型證券或外資證券，大家會立刻跟著主力買進。


    此外，也常發生交易員被人知道手頭有什麼部位，結果被其他公司的交易員做空的狀況。當時的頂尖交易員能做出某種程度的預測，甚至知道對手是哪家公司的誰，也會大概知道該公司的停損規則等，所以彼此競爭相當激烈。


    或許，因為大型證券或外資證券不喜歡被當主力跟隨，業界要求不要公開買賣量資訊的聲音越來越大，交易所也從善如流。


    對交易員來說，這等於少了一種「判別部位」的手段，但也產生幸運的副作用。頂尖交易員一口氣買進大量部位，也不會有人知道是誰買的，於是市場便跟風，有利交易員的操作。


    接下來是人稱股票熱潮的 2005 ～ 2006 年，股價持續上漲，散戶開始急速增加，書店也能看見「把 100 萬日圓變成○億日圓」之類的書籍。


    網路證券崛起，使交易員和散戶之間的環境差距逐漸縮小，但從資訊量等條件來說，交易員還是比較有利，甚至連週刊雜誌，都專文介紹交易員豪邁的賺錢法和遊玩方式。


    在極盛時期，據說有多達 2000 ～ 3000 名交易員在股市中熱絡交易，讓期貨的買賣量資訊上排滿日系證券的名字。當時的交易員可說是春風得意，盡情享受最美好的時代。


    註 15：住專是住宅金融專門公司的簡稱，為一種貸款業。


    1990 年代初期，日本的泡沫經濟結束後，因為地價貶值，多家住專手頭多出許多呆帳。日本國會在 1996 年決定挹注 6850 億日圓解決此問題，避免金融系統崩盤。


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_242_0.png)


    ## 2010年前後：雷曼風暴與HFT崛起，大幅改變市場環境


    2010年東證箭頭系統啟用後，HFT一口氣湧入，以及2014年階段性實施檔位最佳化，都對仰賴當沖的交易業界造成衝擊。


    2007年美國發生次級房貸的呆帳問題，使得次貸風暴越演越烈。


    2007年4月，美國大型銀行新世紀金融公司破產，7月貝爾斯登公司也出現重大財務危機，8月引發了人稱「巴黎銀行危機」的大混亂，導致2008年9月美國大型投資銀行雷曼兄弟破產。這場危機俗稱「雷曼風暴」，造成全球股價暴跌，日本也受到影響。


    這次市場暴跌是否讓交易員陷入苦戰？其實未必。個股交易員因為容易偏向做多，所以苦戰的人不少，然而交易衍生性金融商品的人大多積極做空，於是急速上升的波動性反而成為絕佳的獲利時機。


    對短期交易來說，個股價格變動大和波動性高正是獲利機會，所以對交易業界來說，雷曼風暴絕對不算巨大的衝擊。


    但 2006 ～ 2007 年出現的徵兆，讓交易員感到痛苦，因為外資在日本股市的交易占比增加，使得市場較少在日本時間變動，即使大漲也是在晚上，股價漲完到日本時間又不動了。


    根據我當時分析的資料，就算日經 225 在 1 個月內上漲 1500 點，但在日本時間開盤到收盤為止的漲幅合計，也頂多漲 200 ～ 300 點，表示漲幅幾乎都在晚上。


    而且，演算法交易和 HFT 這兩種當時還聽不慣的東西，在歐美市場急速崛起。我就是在這時開始強烈意識到依賴當沖的危險性，而不久後危險終於到來。


    2010 年 1 月 4 日東證箭頭系統正式啟用，嚴重衝擊中小證券的交易部門。東證箭頭是東京證券交易所提供的全新股市交易系統，當時全世界的證交所都積極投資設備，持續建置可高速執行交易的環境。環境整備的幕後推手，是在歐美市場急速崛起的
    HFT 等，利用高速交易環境，賺取獲利的新市場參與者。


    箭頭系統啟用前，日本股市系統處理能力非常低，下單到成交為止需要耗費一點時間。如果發生買賣單湧入的狀況，常會出現數十秒至數分的延遲。東證認為這樣下去，日本的證券交易所將無法和世界上交易所競爭，於是更新交易系統。這是時代的變化、科技進步的產物，也是理所當然的過程。


    但是，這對交易業界卻是致命性的變革，就像江戶幕府末期的日本。當時日本長期鎖國，武士階級梳著武士頭、手持武士刀，誇示自己的強悍，並深信這樣的時代會永遠持續下去。後來幕府決定開國，落後於世界的狀況讓武士感到驚慌，於是反對開國，試圖保護自己的權益，但依舊無法反抗時代的潮流。


    老舊的交易所系統，阻擋擁有 HFT 等先進交易技術的市場參與者，也保護了當時的日本交易業界。直到箭頭系統啟用後，HFT 一口氣湧入，直接衝擊仰賴當沖為生的交易員。


    原先慣用的委託單判讀不再適用，即使下單也會處於被動。當時完全仰賴當沖和超短期買賣的交易業界，被迫和 HFT 在同一個擂臺上競爭，使得業界面臨危機。


    這樣的結果並不是箭頭和 HFT 的錯，而是怠惰於研發投資、設備投資和人才培育的交易業界自食惡果。回顧業界的歷史，會發現這是理所當然的結果。


    此外，東京證交所從 2014 年階段性實施檔位最佳化，也對仰賴當沖的交易業界造成衝擊。由於檔位被細分、上下能看見的範圍變窄等變化，過往判讀委託單的技巧不再適用，肉眼不再跟得上瞬息萬變的買賣盤。


    事實上，對於這種制度修正，其實用 HFT 交易的人也多有批評。對他們來說，價差是獲利泉源，所以檔位變細不是好事。


    散戶的交易環境因為網路證券企業的努力，而變得更快速且穩定，也提高交易的自由度，所以接連出現大獲成功的散戶。相反地，交易業界的未來則一片黯淡，兩者的立場好像不知不覺逆轉了。


    但並不是完全絕望，也有不少交易員努力順應時代的變化，希望能做出更高水準的操作。


    雖然我現在已經離開第一線，改做管理，但每天都在努力嘗試開拓未來。目前，我隸屬的山和證券有近 50 名交易員，也聘用並栽培應屆和無經驗者擔任交易員，操作手法確實相當多元。


    一度被揶揄是瀕臨絕種動物的交易員，現在致力於拓展新的商業模式、研究開發和人才培育。我期待能透過每天的工作和他們一起開拓未來。


    ### 9-4 2020年以後：FinTech將改變未來


    正因為身為人類，才能感受到市場瀰漫的不安心理或危險。瞭解人類和AI的弱點與優勢，再建構能互補弱點的未來。


    今後時代也會持續改變我們所處的環境。2017 年，幾乎每天都能在報紙上看到「AI」、「虛擬貨幣」、「群眾募資」等 FinTech（金融科技）的相關詞彙。就像網際網路剛出現時一樣，我們所處的世界在不久的將來，或許會出現技術奇點（註16）。


    但我不認為 AI 會贏過人類，讓人類變得毫無用處，也強烈希望這一刻不會到來。如果只把 AI 視為威脅，等待我們的恐怕是不幸的未來。我們應該和 AI 新創企業或研究人員保持接觸，照自己的步調努力學習。


    市場就像大自然，會展現各種不同的表情，有平穩的日子，也會有颳狂風的時候。即使是 AI，也很難預測變化並做出對應。


    2009 年，我以與談人的身分，受邀參加「Battle of Quants (註 17) 」這項國際論壇活動，和其他 4 位與談人進行討論。其中 3 位活用
    HFT 或量化投資等科技，擁有全新的交易模式，而我和另一名英國交易員則是非機器交易方的代表。


    論壇主題是「機器 v.s. 人類」，我和機器方的 3 人交換名片，令人訝異的是，他們的頭銜不是「Trader」，都是「Professor」或「Scientist」。老實說，這讓我有點怯場，心情就像舊薩克遇到鋼彈一樣(註
    18)。


    但論壇結束之後，聽眾反而覺得非機器交易比較厲害，因為機器方操作者在前一年的投資績效其實算不上優異。2008 年正值雷曼風暴，當時恐懼和情緒支配了市場，導致市場一整個都呈現不穩動向，無法只靠既往數據預測。這顯示在這樣的市場中，人類的適應能力仍然高於機器。


    心理控制對人類來說一直都是難題，也是弱點所在，但正因為身為人類，才能感受到市場瀰漫的不安心理或危險。即使技術奇點真有一天會發生，人類具有的優勢也絕對不會消失。


    瞭解人類和 AI 的弱點與優勢，再建構能互補弱點的未來。瞭解現在、想像未來，並創造自己的立足之地，相信交易員和 AI 十分有可能共存共榮。


    註 16：Singularity，部分科學家推測，科技發展將在短時間內發生極大的進步，人工智慧將完全超越人類的智慧，導致現有社會模式崩解，由新的規則主宰這個世界。


    註 17：目前無官方中文譯名，暫譯「量化戰爭」。


    註 18：日本動畫作品《機動戰士鋼彈》中出現的虛構兵器系列。在該作品世界觀中，兩種兵器的武力差異懸殊。


