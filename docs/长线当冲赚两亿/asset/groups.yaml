  - '[PAGE 205]


    # 如何分析交易的表現？檢視這三個指標就OK！


    每天監控三個指標，能看出自身交易是否順利並找出問題點。確實記錄指標後，只要觀察時間軸，就能驗證自己的交易。


    資金管理的第一步是理解自己的交易。如果不理解自己交易的績效和特性，就無法做好資金管理。避險基金也需要分析自己的基金是如何運用、有何特性，然後向投資人說明，使其理解後掏錢投資。


    不管是交易員或個人都一樣，必須先理解自己的交易。過去我在第一線時，也會分析自己的交易績效。當時，我是以短期交易為主，所以分析並不複雜，只要會用Excel 等試算表軟體便能輕鬆計算。


    具體的計算方式是合計所有的交易並計算勝率。如果勝率有 51% 屬於剛好及格，60 ～ 70% 算是相當不錯，超過 80% 則是特優（但很少會超過）。


    計算勝率後，再針對每筆交易的獲利或虧損，計算獲'
  - '[PAGE 206]


    利額和損失額。這裡要注意「平均獲利額應大於平均損失額」，如果兩者相反則表示不合理。除此之外，還要檢查最大獲利和最大損失是否平衡。


    分析短期的交易績效時，我會確認以上三個指標。若能讓勝率在 51%以上、平均獲利額超過平均損失額，且最大獲利大於最大損失額的話，獲利必定为正。相反地，三個指標中若有一個太差，等於無法穩定獲勝，就必須找出原因。有時可能是自己的市場觀點不正確，或是心理控制不佳。


    透過這三個指標尋找交易不順遂的原因，有兩個重點：


    # ③ 勝率 50%以下時，可能是對市場的判斷有問題，或是過多無益的交易


    勝率無關賺賠的金額，只是單純顯示市場是否朝自己建的部位方向變動，所以機率越高，等於市場越如自己所願。換句話說，勝率越高等於對市場的預測越正確。


    勝率太低大多是因為預測不準，很可能是自己沒有正視市場，或因焦躁等原因而被價格變動牽著鼻子走，於是做出多餘的交易。當流程中的分析不順或被輕忽時，容易發生這種狀況。'
  - '[PAGE 207]


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_207_0.png)


    # 平均損失額大於平均獲利額，最大損失額大於最大獲利額時，很明顯是沒做好停損


    這種情況等於獲利沒增加又賠大錢，頻繁發生這種交易就表示沒有設好目標價位和停損點，而且心理控制不確實，導致損大利小。尤其當最大損失額過於極端時，往往是在交易中完全失去自我，又不願服輸而造成的結果，必須正視自己沒勇氣認輸這件事。


    每天監控這三個指標是件簡單的事，能看出自身交易是否順利並找出問題點。沒耐心持續記錄交易日誌的人，只要確實記錄指標、觀察時間軸，就能驗證自己的交易在哪裡發生問題、哪裡順利，問題點又是在哪裡。


    至於中長期投資或多空策略等，由於還需要其他不同的分析，內容相當複雜，因此在此省略。重要的是客觀分析自己的操作，掌握其特性、問題點、獲利泉源和風險等狀況。'
  - '[PAGE 208]


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_208_0.png)


    # 先弄清楚資金的來源與性質，再判斷可承擔多少風險


    運用資產時，最重要的是合理思考：在自己的風險容許度下，該以何種獲利為目標。看清這一點，便能掌握停損點，並選擇適合的投資策略。


    有一句話說：「錢沒有顏色」，但絕非如此。在投資的世界中，金錢是有顏色的，投資的資金管理要從分辨顏色開始。


    金錢顏色指的是「金錢的性質」。每筆資金追求的事物、期待獲利、容許風險等各不相同。


    第 7 章提到：「最多只能損失 100 萬日圓的情況下，想在 1 ～ 2 年內賺到 1 億日圓」，這種運用方式在想法上就已經失敗了。


    但金融市場絕無不可能。假如要用 100 萬日圓的資金，在 1 ～ 2 年賺到 1 億日圓，這時或许可用 100 萬日圓當保證金，持續進行高槓桿交易，或投資波動性高的個股，賭看看是先賠掉本金還是先賺到
    1 億日圓，說不定也有機會'
  - '[PAGE 209]


    達成目標。


    但這種涉險的方法能稱為資產運用嗎？靠這種賭博的做法，風險容許度卻只有100萬日圓，怎麼看都不對等（本金先賠光的可能性相當高）。


    從這個例子也能看出，運用資金時，最重要的是合理思考：在自己的風險容許度下，該以何種獲利為目標。看清這一點，便能掌握停損點，並選擇適合該操作的投資策略。


    以交易員來說，由於操作的是公司自有資金，所以金錢的顏色會依公司而異。具體來說，公司內部會規定：「操作金額是多少，因此每個月的虧損上限大約多少」。


    主管也會改變金錢的顏色。就我個人的情況來說，我會信任交易員，只要不到停損點，都會交由交易員自行判斷。但有些主管即使還沒到停損點，只要損失金額擴大就會開口干涉。站在交易員的角度看來，明明是照公司規則在思考風險和獲利，還要被指手畫腳，實在讓人受不了。


    總之，以交易員身分進行操作時，要掌握公司給的操作金額、停損點，以及主管對風險的寬容度，並配合他們，否則工作很可能不順利。雖然這是交易員受限制的地方，但反過來說也能幫忙踩剎車。身為專業人士，應該在被賦予的規則範圍內控制風險。


    避險基金的操盤手則必須遵循公開說明書，參酌委託操盤的投資人意向進行操作，而且會規定每年要有多少獲'
  - '[PAGE 210]


    利。


    操作年金也一樣，大家或許以為他們能用非常長期的時間進行操作，但其實年金必須每年公佈運用績效，所以只能以年為單位擬定運用計畫。


    信託投資更複雜，因為投資人是不特定多數的散戶，很難預測他們會用什麼模式追加資金和申請解約。


    如果是年金基金等的操作，每年會結算一次。只要績效良好，投資契約隔年就能續約；要是成績不好，契約可能會改簽給其他投資公司，但至少能操作一年，有明確的時間間隔。


    然而，以個人為對象的投資信託一切都看個別投資人的心情，因此必須一邊計算資金的出入，一邊進行投資。


    散戶的情況又是如何？因為運用資金是自己的錢，所以不必向他人報告，運用度的確最自由。然而，還是應該確實計畫和管理，在有限範圍內自由操作。


    例如：把生活費拿去投資股票就是錯誤的決定。無論挑選的個股股價再怎麼穩定，股票永遠都有下跌風險。生活費是指每月的伙食費、治裝費、房租、教育費和其他日常生活的必需開銷，不應該拿去投資有風險的股票。


    有些人投資股票的原因，是想要早點賺到買房的頭期款，但想得過於簡單。要儲蓄買房的頭期款，應該靠能確實獲利的金融商品。


    從這個觀點來看，散戶投資股票應該使用閒錢。閒錢'
  - '[PAGE 211]


    是指純粹當作金融資產儲蓄的部分，舉例來說，如果投資目的是為了退休生活，若希望增加儲蓄，以長期投資的觀點來看，一定範圍內的股票投資算是妥當。


    不論如何，在投資前最重要的是，先整理自己想運用的金錢具備何種性質。


    交易員或基金經理人等操作他人資金者，要掌握公司規則、規定的風險容許度，以及相對於風險上限，該以何種獲利為目標。散戶應該先規劃好生活和未來，知道自己能承受的風險有多少，應該以何種獲利為目標。瞭解投資運用的前提條件，是資金（風險）管理的第一步。'
  - '[PAGE 212]


    # **8-3**

    # 資金控管的藝術，在於「贏要衝、輸要縮」！


    獲利和虧損時，也要彈性調整部位。獲利時要更積極，虧損時則要保守。


    拳擊比賽時，如果只會全力打直拳，是贏不了的。必須確實做好防守，一邊閃避不讓對方擊中，一邊打出刺拳。等待機會，並在抓到時機後，用全身力氣打出直拳。遇到強勁對手時，防守更要確實。


    交易也一樣，確定行情能獲利就多冒一點險，但賺不到錢或難獲利的行情，則必須做好防守。有時就算靠判定獲勝，也必須贏得比賽，不是每次都必須靠 K.O. 來風光取勝。


    如果是能輕鬆取勝的行情，不妨做滿部位一決勝負；但如果遇到難做的行情，使用同樣的方法八成會途中陣亡。配合狀況彈性調整部位，對交易員來說是重要的技巧。


    市場不會永遠都有趨勢。當出現明確且持續性的趨勢時，只要順勢建立部位即可，所以能懷著自信進行交易。'
  - '[PAGE 213]


    但如果是小幅波動的行情則難以預測，有時也會不確定自己建立的部位是否正確。


    對個股的分析也會出現自信上的差異。有時對分析結果充滿自信，有時則不然。即使對於市場的預測或個股分析並非一直有把握，卻總是把部位建好建滿，說不上是有效率的做法。


    此外，投資也跟拳擊一樣，反擊拳的威力可能會造成致命傷。只想靠大贏或一注逆轉的人根基往往不穩，容易失控重複賭博性的交易，1、2 次可能還很順利，但總有一天會遭到反擊而消失在市場中。為了避免這樣的下場，應該學習彈性地操作部位，這就是部位控制。


    附帶一提，這裡說要依自信的程度彈性建倉，但不等於沒什麼自信就不要建倉。有時為了讓自己恢復冷靜，應該暫時離開市場，但如果必須持續進場，從維持心理素質的觀點來看，即使不太有把握，不妨也試著建小倉，因為有可能出現沒建倉，股價卻上漲的狀況。


    第 7 章提過，遇到這種狀況，有時會後悔沒先買，然後因為焦躁而決定追高進場，結果股價已經觸頂。與其如此，不如在內心猶豫時，先少量建倉來維持心理狀態。該休息時則抽離市場，停止一切交易，確實分清楚狀況。


    同樣地，獲利和虧損時也要彈性調整部位。獲利時要更積極，虧損時則要保守。依損益狀況調整風險量，就是損益控制。這是資金管理基本中的基本，一定要記在心裡。'
  - '[PAGE 214]


    最危險的情況是損失越滾越大，卻冒更大的風險想拚一次逆轉。這種行動往往是出於想快點挽回損失的情緒，具有這種個性的人基本上不適合做投資。


    虧損一定有理由，例如：行情的預測錯誤或進場時機錯誤等。明明犯錯，卻不積極驗證是哪裡做得不好，反而建更大的部位想扳回一城，不可能會成功。就算行情剛好救了妳，遲早也會出局。


    虧損時應該縮小部位，極端來說，一天就算賺 1 元也好，應該累積小小的勝利。如此一來，遲早會恢復交易的節奏，讓妳能再次獲勝挽回虧損。


    這裡舉我的親身經驗為例。在我單月虧損 6486 萬日圓時，雖然公司給我的單月虧損上限是 7000 萬日圓，但在達上限前我就自己踩剎車。


    在那之後，我細心驗證每一筆交易，重新建構交易流程，並把交易的部位量減少到 6 分之 1。接著決定好獲利目標，例如：賺回 500 萬日圓就把部位量調高，下一個目標則定為
    1000 萬日圓。達成後便再調高部位，再以 2000 萬日圓為目標……。階段性提升目標，並慢慢回升部位量。


    孜孜不倦地重複這個過程，下個月的交易成果終於讓我滿意，不僅挽回 6486 萬日圓的損失，還賺到總額 1 億 2104 萬日圓的獲利。由此可見，靠這種樸實的方法，一樣能扳回一城。


    另一方面，交易持續獲勝時可增加部位。基本上，在'
  - '[PAGE 215]


    獲利時可以積極搶攻，如果這時候不積極獲利，你永遠沒辦法建大倉，無法將獲利最大化。而且，該積極時不積極，也無法提升運用資金的能力。以我自己來說，這時候我會盡量嘗試用
    120%的力量去操作。


    但太過積極也可能陷入意想不到的危險，因此必須格外留意。不管交易多麼一帆風順，市場總有一天會颳起逆風。屆時，如果冒太大的風險，很可能会造成致命傷。


    另外，當節奏跑掉、覺得「這波虧了」的時候，也要有勇氣停手，這點很重要。如果還固執地加碼進場，可能會把至今累積的獲利吐回去。


    雖然都是涉險，但獲利時和虧損時的涉險方式應當不一樣，若能確實控制，最後肯定能獲得確實的利益。'
  - '[PAGE 216]


    # # 投資絕不是無本生意，要先設定風險容許度


    如果能輕鬆變成億萬富翁，背後一定藏著莫大的風險。不要想一夕致富，並在覺得能獲利時就出手。請務必牢記這兩點，慢慢累積獲利。


    該容許多少風險，又該以多少獲利為目標？基準該如何設定？許多人在建倉時，會先設好虧損上限，因為沒人想賠錢。換句話說，大家對風險的容許度會有明確的想像。


    但獲利又如何呢？既然開始投資了，應該都會有「想賺多少」的想像。人類都有欲望，獲利時欲望會不斷湧現，即使每月的虧損上限只有 100 萬日圓，卻會期待每月能有
    1000 萬日圓的獲利，容易設定欠缺平衡的獲利目標。


    然而，這樣的風險和獲利設定並不合理。若要比較賺到 1000 萬日圓的機率與賠 100 萬日圓的機率哪個高，肯定是後者大幅領先。用這種獲利目標投資，只會增加馬上賠光
    100 萬日圓出場的機率。所以，只能承擔 100 萬日圓風險的人，不能追求 1000 萬日圓的獲利。'
  - '[PAGE 217]


    相對於 100 萬日圓的虧損上限，該設什麼程度的獲利目標才算合理呢？依我的經驗來說，「目標獲利是風險容許度的 2 倍」最為合理。換句話說，每月虧損上限如果是
    100 萬日圓，單月目標獲利就是 200 萬日圓。但會因為交易手法（操作策略）或各種條件（例如金錢的性質等）而改變。


    可能有人覺得 2 倍很少，但這就是現實。不過，如果單月的獲利能到 200 萬日圓，下個月的風險容許度便能上調到 150 萬日圓，讓目標獲利變成 300 萬日圓。如此一來，隨著達成獲利逐漸上調風險容許度，終究能帶來巨大利益。


    如果希望總有一天能成為可動用大筆資金的交易員，唯一的做法是慢慢增加操作金額。這點對散戶來說也一樣，想成為億萬富翁，只能一點一滴慢慢累積。


    不要想一夕致富，並在覺得能獲利時出手。請務必牢記這兩點，慢慢累積獲利。能輕鬆變成億萬富翁的方法，背後一定藏著莫大的風險。


    我還是菜鳥交易員時，有人告訴我：「每個月能賺 1000 萬日圓，才稱得上是交易員。」一天賺 50 萬日圓，20 個營業日都獲利就能賺到 1000 萬日圓。但實際上，不太可能做到勝率
    100%，每天都獲利。


    所以我當時想：「想達成每月 1000 萬日圓獲利，只要讓自己一天能賺或賠 100 萬日圓，並且讓勝率達到 75%'
  md: '

    避險基金之王索羅斯、奧瑪哈的先知巴菲特等投資世界的佼佼者，也承認自己時常犯錯。所以像我們這樣的凡人會犯錯可說是理所當然。


    我也不例外，由於自覺到這一點，我將部落格取名為「渺小交易員部落格」。金融市場實在過於龐大且複雜，自己相較之下只是渺小的存在，所以犯錯也無所謂，重點在於要避免在犯錯時受到致命傷。


    接納不成熟的自己，理解自己身為凡人也會犯錯，如此一來，當判斷失誤時，就不會做出傲慢且不合理的行動，像是因固執而不肯停損，或隨便亂攤平等。


    請告訴自己：「犯錯也沒關係」，看清自己的弱點，謙虛接受錯誤。因為知道自己會犯錯才會努力，並且成為你的勇氣，讓你面對市場的恐懼。正視自身弱小踏出第一步，才能學會真正的堅強。


    想要控制心理層面，懂得轉換心情很重要。


    有些人靠喝酒來達到目的，但切記：可以喝酒轉換心情，但喝酒逃避現實就不是好事。


    要鼓勵失落的人，常會說：「忘了煩心事吧」，但這句話不適用在市場。正是因為虧損，所以必須確實面對現實，並把失敗當作墊腳石。


    判斷哪裡出錯、該怎麼做才能避免失敗、如何實現更大的獲利……，應該面對自己的失敗。


    要治癒在市場上受到的傷，只有在市場賺回來。但想一次就恢復原狀是錯誤的想法，是因為過度期盼「想快點解脫」、「想脫離困境」，而產生焦躁。任何人都容意有這樣的想法，但想一口氣挽回損失，跟賭博沒兩樣。


    想挽回損失是自己的主觀想法，但市場不會照自己的想法走。那麼，該怎麼做才好？答案是


    不停累積勝利，讓自己重整旗鼓。先從「讓一整天的收益變正值」開始，就算賺 1 塊也好，每一筆交易都要有獲利。


    會賠錢到被逼入絕境，表示自己在市場上迷失了，這種狀態下想急著獲利遲早會受重傷。正因為情勢很苦，更應該一筆一筆仔細交易並獲利，找回原本的自己。


    **超短期買賣的獲益是由慢慢累積而來，不重視每一筆交易和每日交易的人，肯定不會順利。** 因此重點在於是否能細心地累積交易。


    必須挽回的損失越大，越應該朝附近的供水站前進，而不是看著遙遠的終點。附帶一提，當我出現大筆損失時，不會讓當月獲利等資訊顯示在電腦上，因為這會讓我因終點太遠而感到挫折。即使如此，只要持之以恆，往往能在不知不覺間挽回損失。


    # **重點7：別急著賺大錢，一步一腳印才是王道！**


    懂得如何面對並控制風險，才能持續獲利，為此你必須有能力面對市場和自己。


    我畢業進入社會後，被任職的證券公司分派到交易部門，至今還記得新手時代持有部位虧損的事情。


    那是一筆僅有一口的大阪日經225指數期貨。當時我還是菜鳥，要透過直屬主管用電話下單。


    其實前一天快收盤時，我就想賣掉手上持有的期貨，也有告知主管，但主管正熱衷於自己的交易，沒有聽見我的要求，結果那一口指數期貨就這樣持倉過夜。


    隔天，美元兌日圓跌破1美元兌100日圓，開盤後日經225就跌了500點，讓我的多頭部位損失50萬日圓。對當時的我來說，50萬日圓的損失實在太巨大，當時眼前真的是一片漆黑。


    後來我的心理素質變得越來越堅強，甚至賠6486萬日圓，也相信總會有辦法賺回來。經歷過無數次的痛苦和


    恐懼，為了克服困境，每天都都會檢視交易、不斷自我檢討、鑽研交易手法、持續建倉反覆越過困境，所以才有現在的我。


    這段路程大概花了 10 年。不管是職業的交易員或散戶都一樣，鍛鍊心理素質必須長時間累積各種經驗，不要想 1、2 年就能達到這樣的水準。


    要得到真正的實力，應該持續面對市場和自己、不要心急。有時候，市場多頭確實能趁機賺一波。但這時如果誤以為能輕鬆獲利是自己的實力，只會讓你變成遇到空頭就賠光出場的投資者。


    交易員不會如此簡單就成長茁壯，要懂得如何面對並控制風險，才能持續獲利，因此你必須有面對市場和自己的能力，一步一步成長茁壯即可。


    我目前在培育年輕的交易員，他們的狀況就跟以前的我一樣。讓毫無基礎的人上場，每月大概會固定損失數十萬日圓，之後才會越賠越少。


    藉由各種磨練，例如：在快要崩潰時，抽身重新評估進場時機等，慢慢學會面對市場和自我的方法，讓自己逐漸能逐漸獲利。直視並分析自己的失敗，並活用在下次的交易上，必須靠枯燥而踏實的累積，才能獲得真正的實力。


    散戶也一樣。因為是自己做投資，周圍不會有人幫忙檢查或制止，必須自行摸索如何自我控制並成長，有時候或許比交易員更困難。


    觀察成功的散戶，會發現其運用的資產金額增加幅度大致呈現 J 曲線（這是因為隨著本金增長，獲利也會慢慢以複利增加）。乍看之下好像能短期賺大錢，但其實不是這麼一回事。


    「手上有 100 萬日圓，1 年後要把它變成 1 億」的想法，實在太過輕率。市場不會依照你的願望行動，所以應該改用持續累積的方式，例如：今年目標 10%，把
    100 萬日圓增加成 110 萬日圓，明年再努力一點，把 110 萬日圓增加 20%，每年不斷努力提升績效。腳踏實地重複累積經驗，才能讓獲利增加幅度呈現 J
    曲線。


    想要不靠運氣，而是在可控制的狀態下達成目標，需要許多前提條件。雖然無法一步登天，但只要持續努力就會有成果，所以不需要著急。想在 1 年內用 100 萬賺 1
    億的人，必須自覺到：自己正在冒 1 年可能賠 1 億的風險。


    我能理解想要賺錢、想要早日變成大人物的心情。但請先瞭解這條道路既險峻又遙遠。市場有各種變化，唯有持續奮戰和經歷各種磨練，才能獲得真正的實力。


    如果想越級成長，一旦碰到沒經歷過的局面，很可能會蒙受意想不到的鉅額虧損。請不要焦急，一步一腳印慢慢成長茁壯。


    # 7-12 心理控制的重點整理


    本章解說心理控制的重點和其他注意事項，在此做個整理。


    - 重點一：虧損時先和市場保持距離。

    - 重點二：客觀分析交易部位。

    - 重點三：別做不合理的行動。

    - 重點四：不要迷失交易的依據。

    - 重點五：最理想是變成觀察者。

    - 重點六：自覺自己只是普通的人。

    - 重點七：成長需要花費時間。


