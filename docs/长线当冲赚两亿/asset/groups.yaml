    要治癒在市場上受到的傷，只有在市場賺回來。但想一次就恢復原狀是錯誤的想法，是因為過度期盼「想快點解脫」、「想脫離困境」，而產生焦躁。任何人都容意有這樣的想法，但想一口氣挽回損失，跟賭博沒兩樣。


    想挽回損失是自己的主觀想法，但市場不會照自己的想法走。那麼，該怎麼做才好？答案是'
  - '[PAGE 196]


