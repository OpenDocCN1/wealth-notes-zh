    # Chapter 3 超短期買賣（當沖），該怎麼賺到錢？


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_72_0.png)


    ## 3-1 做當沖，開盤前務必先做好功課！


    事前收集並分析基礎資訊，才能大致理解價格在一日之內的變動原因，並進行預測，或是察覺預測和實際變動的差異所產生的不協調感。


    做超短期買賣時，需要什麼事前準備？過去有許多做超短期買賣的交易員，不用看新聞，也不需要做分析，只要在開盤前一刻到公司，觀察委託單再進行交易即可。但股市沒這麼好混，如果你能靠這種方法一路贏下去，八成擁有天才般的投資靈敏度。


    我也有一段時期迷上當日沖銷，並且投入大筆資金。當你冒著如此大的風險，就算是當沖，盈虧也會有相當大的振盪。如果此時完全不做準備，在缺乏足夠依據的狀態下交易，心臟恐怕會承受不了。所以，從維持心理層面的觀點來看，即使是當沖，我也不會輕忽事前準備。


    為了在短時間內重複進行同樣的交易流程，交易員必須儘可能簡化在盤中關注的資訊，因此應事先收集並整理好其他的基礎資訊。


    或許有人不需收集資訊也能交易，但是否做好事前準備，帶來的些許差異經常會決定勝負。正因為事前收集並分析基礎資訊，才能大致理解價格在一日之內變動的原因並進行預測，或察覺預測和實際差異所造成的不協調感。


    **為了在股市獲利，不管是早一步或兩步都好，必須比其他市場參與者更快洞察先機**。如果沒做好準備，事後才去調查或思考股價變動的原因，肯定會失敗。不怠惰於事前收集資訊，一步一腳印累積分析預測的功力，便能逐漸領先其他的市場參與者。


    下頁的**圖表 3-1**是我擔任交易員時，每天都會進行的資訊收集流程。


    或許有人會這麼認為：「當沖的事前準備有必要做到這種地步嗎？」但透過事前準備，大致理解股價變動的背後，盤中須觀察的資訊就會變得單純，心思也能集中在交易本身或對交易的判斷上，更快做出應對措施。


    超短期買賣必須在一天之內反覆進行「①收集資訊→②分析→③判斷」的基本交易流程。**為了妥善、有效率地進行交易，應盡可能在盤中以外的時間，完成基本的資訊收集**。


    **圖表 3-1** 列舉的是每日例行公事，另外還有每週要調查的事情，如籌碼面、未平倉餘額、投資信託相關資訊或個股成交狀況等。


