    # **重點7：別急著賺大錢，一步一腳印才是王道！**


    懂得如何面對並控制風險，才能持續獲利，為此你必須有能力面對市場和自己。


    我畢業進入社會後，被任職的證券公司分派到交易部門，至今還記得新手時代持有部位虧損的事情。


    那是一筆僅有一口的大阪日經225指數期貨。當時我還是菜鳥，要透過直屬主管用電話下單。


