    那檔股票業績的確很好，但股市總是有蕭條的時候。他可能覺得是好股票，所以炒短線建立大量多頭部位，然而市場環境惡化，讓炒短線的人紛紛停損出場。當時，該名前輩交易員不願自己採取的方針是當沖，一直持續攤平（買進後隨著股價下跌而持續買進），結果達到虧損上限，因此被公司停止交易。


    這個案例明明是做當沖這類超短期買賣，卻一直在看基本面，而沒有考慮到目前的股價位置、需求分析和市場整體狀況。


    如果是中長期投資，必須依企業的成長性或業績變化來獲利，遇到股價停漲下修時，可用不同的方式應對，例如：選擇按兵不動或用其他方式避險，或者是當作增加投資金額的機會。做超短期買賣，卻在股價停漲下修的局面持續攤平，實在很不合理。


    如上所述，即使已經設定妥善的操作方針，但在實際交易時，投資的目的和依據一旦背離方針，就算交易的個股再好，也無法順利獲利。


    執行的是何種操作？在此前提下，應該觀察什麼、如何判斷、靠什麼獲利？這些問題非常重要，因為你應該觀察的事物會因此改變。


    ## 圖表 2-1 基本交易流程


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_52_0.png)


    ## 基本動作 2 確實執行「基本交易流程」


    在進行判斷時，理論上都應該要依循一套固定流程，但交易時間越短，越容易輕忽基本交易流程。


    這裡說的基本交易流程，是指下一頁的**圖表 2-1** 所示的①收集資訊→②分析→③判斷。不管採用何種交易策略，基本上都要重複這個流程，以下解說這三步驟的重點。


    ### ① 收集資訊


    不管是短期或中長期操作，收集資訊（數據）都非常重要。應獲取的資訊內容會依交易手法或操作期間而異，但收集資訊是所有交易的基礎，重點在於「該觀察什麼」。


    此外，雖然獲得大量資訊很重要，但更重要的是整理資訊，也就是決定資訊的優先順序或取捨。常見的錯誤是，囫圇吞棗各種資訊，反而被牽著鼻子走。為了避免這種情況，更應該配合交易的目的和依據整理資訊。


    ### ② 分析


    依據收集到的資訊進行分析。這個步驟其實就是「思考流程」，若流程欠缺合理性或理論性便無法成立。我看過很多人在使用技術分析時用錯方式，或是誤解該指標的特性及意義。這點在基本面分析也是一樣，為了執行正確的分析，必須確實學習分析的方法和思維，並做好回測或驗證，才能成為可安心使用的工具，確立思考流程。


    ### ③ 判斷


    依據分析結果，決定「該做什麼」。由於做出判斷的是人，結論就會因人的個性而產生差異。如果確實做好前面的收集資訊和分析兩步驟，便能做出一定程度的穩定判斷。但在變動的行情下，任何人都會因不安、期待或焦躁等情感，使判斷產生無謂的偏差。


    其實能否做出穩定的判斷，取決於是否確實看清自己。「心理控制」是否確實，比收集資訊或分析更為重要。交易期間越短，判斷越容易受情感波動影響。尤其是做當沖時，幾乎沒有緩衝時間讓你恢復冷靜，很難客觀地看待自己，所以必須特別留意。


    上述基本交易流程，不僅在建立新部位時相當重要，在建倉後要停利或停損時，一樣必須經過這個流程。交易其實就是不停重複這個流程，並增加獲利。


    不管是哪種策略，都要經過這個流程，不過應收集的資訊內容、應觀察的重點或優先順序，則會依交易期間和策略而異。


    一旦流程從某處開始瓦解，交易就變得不順遂，請記住這一點再往下閱讀。接下來，介紹三種策略的特徵和適合哪種個性的人。


    ## 2-2 做當沖，最重要的是買賣時機


    超短期買賣的獲利源頭是短期的股價變動，想在極短時間內賺價差，買賣時機比任何事情都重要。


    這種交易手法可說是股市交易員的代名詞，利用此手法交易的人現在還是占最大宗。當沖要求的資質是心理控制、瞬間決策力和判斷力等，條件接近運動選手或賭徒。


    由於必須在短時間進行前述的基本交易流程，所以要簡化應檢查的事項。此外，在收集資訊方面，基本面相關資料難以成為短期的變動要因，所以優先順序較低，唯一的例外是要靠財報公布後的股價變動來獲利時。


    假如基本面中有意外性的要因，修正財報後股價將大幅變動，如果要抓這個時間點獲利，必須先觀察業績狀況，或股價已提前反應到某種程度。


    超短期買賣的獲利源頭是短期的股價變動，想在極短時間內賺價差，買賣時機比任何事情都重要。


    此外，這種方式一天內會頻繁交易，所以講究速度與當機立斷。要是因為一點小事而導致節奏亂套，便容易陷入泥沼無法抽身。常見的狀況是：剛開始交易狀況順遂，於是開始掉以輕心，逐漸放鬆風險控管，甚至隨意決定進出場時機，導致虧損。


    這時若急於再進場扳回一城，反而容易越賠越慘，不僅毫無效率，也只會徒增無意義的交易量。若是持續這種不合理的交易，將進一步擴大損失，我自己也有好幾次這樣的經驗。


    在超短期買賣中，大多時候「看清自己」比「看清市場或個股」更加重要。知道哪個時間點該放手一搏、懂得克制自己不貿然出手、具有「贏要衝輸要縮」的平衡感、擁有瞬間判斷力、不因一次失敗就耿耿於懷等，都是重要的素質。


    交易員的工作，並非一流大學畢業的聰明人才能勝任並獲利。有許多案例是，越優秀的人反而越無法認清自己的錯誤，導致太晚停損而產生致命損失，或是迷失自己。自尊心高或是一旦在市場虧損就會激動的人，不適合做當沖等超短期買賣。


    要穩定操作超短期買賣，重要的不在於聰明與否，而是能否在變動的行情中不迷失自己。從這個角度來說，曾在體育競技中體驗過輸贏或精通賭博的人，比較適合超短期買賣，因為他們從過往經驗中，瞭解到要如何認賠出場才能在下次獲利，而且可以在任何局面保持冷靜。


    ## Column 小心「胖手指」惹禍


    人在交易時難免犯錯，不僅會誤判行情，有時還會按錯鈕。我自己曾犯過幾次大錯，但還不至於像「J Com 股票大量錯單事件（注6）」那麼嚴重，甚至衝擊公司。


    有一次發生在早期，當時還會公布證券公司的個股買賣數量。有一檔高價股突然湧進十幾萬股的限價買單，我心想：「喂喂！是誰啊？這麼大手筆」，結果那個人就是我自己。


    後來我慌忙取消訂單，但大筆買單的資訊已經被公開，會場還廣播：「○○證券，○○（個股名），買○○股」，讓其他公司的交易員都打來問：「剛才那張買單是工藤你下的嗎」，讓我很想找個地洞鑽進去。


    又有一次我用選擇權建倉，在交易所的裝置下單，想賣掉價外賣權，卻發現相同履約價的買權出現大量賣單，原來是我下單時把賣和買搞錯了。


    除此之外，我還曾搞錯過電腦和下單裝置的鍵盤，結果連續按到期貨的買單。


    我曾因為這些錯誤而受到慘痛教訓。不過，為了管理部門的名譽，我必須事先聲明，這些錯單都是在我被允許的操作範圍內，並非公司的管理體制有問題。


    2010年6月1日，我和夥伴一起成立避險基金，摩拳擦掌準備開始交易。沒想到當天開盤時，日經225指數期貨突然湧進總價超過9兆日圓的限價賣單。


    我大吃一驚：「該不會是我們下的單吧？」確認不是我們下的單後，準備開始交易時，卻接連有電話和郵件進來，大家都跑來問我：「工藤，你的避險基金是今天開始交易吧？那筆大單該不會是你下錯的吧？」


    其實，這麼大筆的單要在系統化的下單環境，才能夠執行，事後才得知是歐系券商的問題，但那天我先是嚇出一身冷汗，又被人懷疑，實在是哭笑不得。


    最近系統的管控比以前更嚴謹，但還是要注意千萬別下錯單。


