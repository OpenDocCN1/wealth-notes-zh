    # 想長期在股海生存，該如何做好心理控制？


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_170_1.png)


    ## 交易期間越短，心理控制越難，所以……


    最有效的心理控制法，是在尚未持有部位時，先整理好獲利和風險。如此一來，只要客觀觀察股價變動，同時採取必要的對應即可。


    建倉就等於冒險，而人類在冒險時，心理上會因期待和不安而產生糾葛。大家常說股市是欲望和恐懼的遊戲，這句話一點都沒錯。


    交易時間軸越短，難度越高。這是因為必須在短期間內不斷做出判斷和決策，而無法冷靜觀察市場。短線交易或中長期投資時，比較有時間回顧交易，但超短期買賣則沒有時間上的餘裕，常被迫當下做出判斷和決策。


    因此請記住：交易時間軸越短，越需要具備心理控制的技巧；交易時間軸拉長時，則比較需要具備分析能力。究竟如何應對，才能做到適當的心理控制呢？


    必須做到不被情感受和主觀迷惑，客觀面對市場。最好的方法就是事先確立「會漲多少」，也就是預估獲利和停損點（目標價位），同時思考「最低可能會跌到哪裡」，也就是風險的最大值和停損點。投資人如果能自行事先預測停利和停損點才進場，便能在股價振盪時保持冷靜。


    另一方面，沒有這些劇本、只因感覺會漲就買進的投資人，遇漲會開心，遇跌則感到不安。因此，最有效的心裡控制方法，是在尚未持有部位時，先評估獲利和風險。


    只有在尚未持倉時，最能冷靜客觀地判斷市場。因此在進場前，先思考這檔股票可能會漲到哪裡，以及會跌到哪裡，決定好目標價位和停損點後再建倉。如此一來，只要客觀觀察股價變動，同時採取必要的對應即可。


    如果想 在股市長期存活並不斷取勝，必須能夠感受、面對恐懼，才能察覺危險並努力克服。


    在充滿危險的金融世界中，恐懼的情感顯得非常重要。如果想在股市長期存活並不斷取勝，不知道或不願意面對恐懼絕對不是好事。有些膽小是好事，但如果害怕到不敢出手、裹足不前的程度就太過頭了。正因為知道自己害怕，才能努力克服或拚命研究；能夠感受到恐懼，才能察覺到危險。


    感受不到或無法直視恐懼的人，會做出危險的投機行為。對以投資為職業的操盤手而言，如此冒險的方式絕不會被公司或投資人允許。至於散戶，雖然只需自行承擔虧損的額度，但如果導致必須退出市場，肯定不是出於自己的本意。


    我曾經害怕到雙手發抖或睡不著，還曾懊悔地關在房間裡大吼大叫。有一次，因為損失的金額多到讓我太過難過...

    '
  mdcn: '

    外，交割月份不同，結算期間也會改變，使得期間內可獲得的股利產生變動，因此理論價格也會依交割月份而異。


    當股利收入大於利息收入時，兩者價差越大，期貨的理論價格會越低於交易標的價格。尤其在這幾年的零利率狀況下，理論價格往往會低於交易標的。實際上，期貨在市場中的交易價低於交易標的，絕不等於價格被低估。應該比較的是：期貨價格是高於還是低於理論價格。


    只要知道這一點，就能增加期貨的交易機會。理解各交割月份的理論價格，便可以看出期貨價格是否被低估或高估。


    期貨和交易標的是個別變動的市場，所以價格偶爾會乖離而出現套利機會，舉例來說，「跨商品套利」包括賣期貨、買現股（賣期買現）或買期貨、賣現股（買期賣現），還有「跨月份套利」，是靠不同交割月份的價差或是與理論價格的乖離來獲利。


    ## ② 指數成分股與相關率


    交易標的的股價指數是由複數個股組成，而股價指數會依成分股產生特徵和差異。理解股價指數的差異，也能作為當沖或超短期買賣的選股基準。


    例如：當特定業種或個股有極端的變動時，哪些股價指數容易因此產生變化？哪些股價指數容易受匯率或利率變動影響？瞭解這些能幫你判斷當日的操作，應該以哪項指數為標的。


    在此延長線上，還有一種交易手法稱為「配對交易」，NT 倍率（日經 225 ÷ TOPIX）就是其中代表。舉例來說，判斷 NT 倍率暫時會上升時，代表日經 225
    比 TOPIX 強勢，所以可買進日經 225 指數期貨，賣掉相同金額的 TOPIX 期貨。


    在此簡單介紹代表日本的股價指數裡，包含哪些個股。日經 225 是日本經濟新聞社所挑選的 225 檔個股，TOPIX 則是由東證一部的所有個股組成。


    兩者計算方法不同，日經 225 採用「修正式算術平均」，合計 225 檔個股的股價，再除以除數（註 11）計算得出（必須考慮到「視為同面額」）（註 12），因此基本上股價越高的個股相關性會越高。


    TOPIX 則是使用「總市值加權平均」，以總市值為基準。即使個股的股價再高，只要發行量少或公眾流通市值加權較低，與指數的相關性就不會太高。


    這樣的差異讓日經 225 和 TOPIX 的前 20 檔股票各不相同，兩種股價指數的特性也隨之產生差異，進而產生靠 NT 倍率獲利的機會。


    JPX 日經 400 指數和東證 Mothers 創業板指數期貨（簡稱 Mothers 指數期貨）也各有特性。尤其是 Mothers 指數期貨，不僅採用的個股和其他代表性的股價指數完全沒重疊，且投資人以散戶占最大比重，與外資占最大比重的東證一部不同，所以常會出現完全不同的動向。為了理解各種指數的特徵，必須一定程度地掌握成分股。


    另外，指數成分股也可能出現替換，有時會是很大的交易機會。以下列舉 2000 年 4 月日經 225 的成分股大量替換為例。


    2000 年 4 月 15 日，日本經濟新聞社宣布將同時替換 30 檔日經 225 的成分股，使得日經 225 暴跌，NT 倍率急速降低。日經 225 從發表後第一個交易日（4
    月 17 日），到當月底下跌 12.04%，對比 TOPIX 同時期僅下跌 0.29%，表示只有日經 225 暴跌，可得知替換成分股的消息成了利空。


    當時正值 IT 泡沫的尾聲，只要名字有「網路」或「高科技」的個股，都會有人買。鋼鐵、化學、素材等重工業類股，在股市的交易並不熱絡，股價持續走低。在這當中，日本經濟新聞社宣布，為了因應時代變化，將大量採用符合新時代的產業類股，並汰換掉舊有的重工業類股。


    對理解股價指數的機制，以及知道該如何以此交易的人來說，這是一個驚人的決定。圖表 6-1 分別列出被汰換和新增的 30 檔個股。


    **圖表 6-1 2000年日經平均（日經 225）替換的 30 檔成分股**


    | 類別 | 個股名稱 |

    | :--- | :--- |

    | 汰換 | Nichiro、三井礦山、住友石炭、日本甜菜製糖、Honen、富士紡績、東邦合成纖維、Rasa 工業、NIPPON CARBIDE、日本化學工業、日本合成、旭電化、日本油脂、東洋橡膠、Nippon
    Carbon、Noritake、品川白煉瓦、日本金屬工業、日本冶金工業、日本電工、三菱製鋼、志村化工、昭和電線電纜、東京製網、NIPPON PISTON RING、西華產業、岩谷產業、丸善、山九、三井倉庫
    |

    | 採用 | JT、花王、第一製藥、衛采、泰爾茂、TDK、三美電機、松下通信工業、愛德萬測試、卡西歐、發那科、京瓷、太陽誘電、松下電工、三菱汽車、富士重工、東京威力科創、7-11、伊藤洋華堂、佳世客、日本興業銀行、大和銀行、東海銀行、靜岡銀行、住友信託銀行、安田信託銀行、住友海上火災保險、JR
    東日本、DDI、NTT DOCOMO |


    從發表前的收盤價來看，被汰換的個股股價合計是 7819 日圓，新採用個股的股價合計是 148672 日圓。兩者的價差過於懸殊，因此大幅影響維持日經 225
    連續性的除數。


    此一決定發表後，預計被汰換的成分股湧進大量賣單，新替換的成分股則大漲。然而，股價被哄抬的新成分股只是單純因為供需原則而大漲，在替換實施後，股價隨即大跌。


    一些和日經 225 連動的投資信託，因為購買一籃子股票的所需金額急速增加，所以必須賣掉所有部位，累積並調整購買力。套利投資人也因除數大幅上升而受到影響，這些因素都造成日經
    225 暴跌。對理解股價指數成分股、計算方法及市場會出現何種交易的人來說，這是很大的獲利機會。


    雖然往後應該不會再出現如此草率又危險的個股替換，但投資人還是要事先瞭解，替換成分股會影響股市波動，有時甚至會創造獲利機會。個股投資人也可能交易到被汰換或更新的個股，所以應該先理解供需背景。


    註 10：大阪日經 225 指數期貨和迷你大阪日經 225 指數期貨，相當於臺灣的台指期和小台指。


    註 11：為了維持日經 225 的連續性，在計算日經 225 指數時，並非將股價總和直接除以 225，所使用的除數是將股票除權、增資、減資等可能影響股價的非市場因素考慮在內後計算出來。


    註 12：過去日本的股票面額沒有統一，舊公司大多是面額 50 日圓，但新公司面額通常是 50000 日圓，還有個股是採面額 500 日圓。


    原則上日經平均指數是以 225 檔個股的股價平均算出，如果面額 50 日圓的個股和 50000 日圓的個股相加，後者的股價會大幅影響日經平均指數，因此計算時，會把面額
    50 日圓以外的個股全部換算為 50 日圓（即「視為同面額」）。


    日本已在 2001 年廢止股票面額，統一為無面額股票，現在的面額也不具實際意義，但回收流通的股票、再重新發行會耗費成本，所以很多公司沒有回收。


    ## 6-3 簡單介紹三種套利交易


    交易標的和其衍生商品所組合的多空交易手法，目的是看準理論價格與市場價格的乖離，藉此從中獲利。只要能用好的價差建倉，幾乎不會產生風險。


    一般說到「套利交易」是指靠期貨和交易標的的價差獲利，也就是賣掉被高估的期貨，買進被低估的一籃子現股（賣期買現）、買進被低估的期貨，賣掉被高估的一籃子現股（買期賣現）。


    「未平倉餘額」是指套利交易所建的現股部位餘額。交易標的和其衍生商品所組合的多空交易手法，是看準理論價格與市場價格的乖離，藉此從中獲利。只要能用好的價差建倉，幾乎不會產生風險。


    1990 年代，各證券公司都在做套利交易。不只是外資證券和大型證券商，連中小證券的交易部門也相當積極。當時交易速度很慢，因此有時交易標的和期貨的價差相當大，讓中小證券也有十足的獲利機會。


    但隨著時代演變，這樣的機會將逐漸消失。交易速度越來越快，透過系統與程式監控的自動下單增加，讓交易系統產業隨之誕生。如此一來，資本雄厚、能大筆投資設備的外資、大型證券和銀行類證券獲得壓倒性優勢，現在中小證券已經不再進行這種交易。


    此外，交易標的和期貨的價差也縮小，變得沒什麼甜頭，所以套利交易的目的也逐漸改變。外資證券和大型證券會進行「主要經紀業務」，把股票借給避險基金等客戶。


    基本上，這項業務是向機構投資人或大股東借股，然後再轉借給別人。實際做法是透過自營的套利交易來限定風險，在公司內大量持有「一籃子現股」並外借，藉此賺取借券費。


    這種交易的前提，是要具備資本力或極低的資金調度成本。不過，這類交易的規模會達到數兆日圓，所以必須注意其動向。


    此外，還有各種「套利交易（避險交易）」，主要有以下幾種：


    ### ① 跨市場套利


    相同交易標的在不同市場上市，當出現價差時，賣出價高者買進便宜者的一種交易。具代表性的有日經 225 的大阪交易所、新加坡交易所（SGX）和芝加哥商品交易所（CME）之間進行的跨市場套利。


    此外，在東京證券交易所上市的 ETF 和東京金融交易所上市的 CFD（Click Kabu 365），都是以日經 225 為交易標的的商品，也是套利的對象。


    ### ② 配對交易


    這是在不同交易標的的衍生性金融商品間，進行買賣的套利。


    最具代表的是前面曾提過，搭配日經 225 指數期貨和 TOPIX 期貨的 NT 倍率交易。也有人在交易時，會搭配日本國內的其他股價指數期貨、海外股價指數期貨或商品期貨等。


    ### ③ 期貨與選擇權套利


    在日本，具充分流動性的選擇權市場，只有日經平均指數（日經 225），所以通常是以日經 225 期貨指數搭配選擇權做套利。


    選擇權可搭配稱為「合成期貨」的買權和賣權，組成實質的期貨，藉由期貨和選擇權市場之間的乖離來套利。


    充分了解期貨或類似商品的價格，便能進行這樣的交易。但是，當前已經高速化的市場若沒有系統輔助，很難靠價差套利。從這方面來看，配對交易需要一定程度的市場觀點，交易員或散戶以此套利或許比較實際。


    ## 6-4 為何有人說：選擇權賣方很危險？


    在確實理解的前提下，選擇權是自由度極高的商品，無論市場是漲、是跌，還是停滯不動，只要照自己的預測走就能獲利。


    我第一份交易員的工作就是選擇權交易員。為了做選擇權交易，我做過許多功課，甚至學習程式語言。在做選擇權交易的期間，曾經歷阪神大地震和霸菱銀行事件。之後也做過個股、期貨的短期交易、多空策略、技術分析等各種交易。


    因為有這些經驗，我能清楚告訴大家：沒有比選擇權更能自由呈現自己市場觀點的商品。


    為什麼如此有魅力的商品，在日本市場卻不熱絡？這是因為過去出現鉅額損失的案例屢見不鮮，所以許多不想理解選擇權的市場關係者，才會亂貼「選擇權很危險」的標籤。


    本節將講解造成這種結果的來龍去脈，說明問題的癥結，同時仔細分析選擇權交易。


    **圖表 6-2 選擇權交易的鉅額損失案例**


    | 時間 | 案例說明 |

    | :--- | :--- |

    | 1990 年～ 2000 年 | K 證券在日經 225 選擇權賣方的買賣持有量都在前幾名，每個交割月份都有大量的賣方部位。結果市場出現劇烈變動時蒙受鉅額損失，交易部門被迫關閉，甚至要向關係企業的銀行私募新股來救濟。
    |

    | 1995 年 | 英國歷史悠久的霸菱銀行，僅因為一名交易員導致破產。雖然眾所周知，是因為他在 SIMEX (現 SGX、新加坡交易所) 持有大量的日經
    225 指數期貨多頭部位，但一切都是始於選擇權的賣方部位。 |

    | 2000 年～ 2010 年 | T 證券建立大量的極價外賣方部位，後來市場進入強勁的上升趨勢，因此產生鉅額損失，導致交易所變更保證金制度。 |

    | 2011 年 | 日本 311 大地震和後續的核災使得股市大跌，導致建立極價外賣方部位的散戶產生鉅額損失，陷入無法償還債務的狀態。各家網路券商也不得不認列損失，甚至有公司被迫退場。
    |


    選擇權交易過去出現鉅額損失的案例如圖表 6-2 所示。這些案例的共通點是做「選擇權賣方」。


    從此之後選擇權賣方就被貼上危險的標籤，於是各家證券公司開始對選擇權賣方加上不合理的限制，導致選擇權逐漸失去妥善管理的交易環境，因此成為交易量無法成長的最大原因。


    選擇權賣方真的很危險嗎？絕沒有這回事。有危險是因為沒有正確判斷選擇權賣方的風險，就隨便開大量的部位，這麼做是輕視「Gamma 風險」。


    圖表 6-3 介紹評估選擇權的重要術語，請參考並閱讀以下的說明。這些用以表示選擇權風險參數的用語也被稱為 Greeks（希臘字母），因為給人數學的感覺，所以容易覺得困難。但這裡不用學到能懂該算式（模型）或算數細節的程度，只需大致理解即可。有些入門書籍會淺顯易懂地解說，也有網頁會提供模擬器等。


    前面列出過去的鉅額損失，都有某種共通的想法：「如果是履約價較遠的選擇權，即使當賣方，風險也會比較小（不至於大跌或大漲到履約價）」或「同時賣出買權和賣權，就不會有方向性的風險」。


    但這種想法有很大的陷阱。履約價較遠的選擇權稱為「極價外」，由於日經 225 到履約價的可能性很低，所以權利金非常便宜。


    選擇權賣方的獲利有限，最多只能賺回權利金，因此期待獲利較少。於是，投資人想賣多一點口數，又因為認為履約價還很遠，便賣出一堆買賣權，或是誤認為同時賣出買權和賣權風險會比較低。這正是外行人的想法。


    如果同時賣出買權和賣權，確實該時點的 Delta 值會非常小，乍看之下沒有方向性的風險，但此時的 Gamma 值會變得非常高。


    **圖表 6-3 評估選擇權的重要術語**


    | 術語 | 說明 |

    | :--- | :--- |

    | **買權** | 買的權利。假設是履約價 25000 日圓的日經 225 買權，就表示有權用 25000 日圓購買日經 225 。 |

    | **賣權** | 賣的權利。假設是履約價 25000 日圓的日經 225 賣權，就表示有權用 25000 日圓出售日經 225 。 |

    | **SQ**<br>(Special Quotation) | 指數特別報價。SQ 日是指計算 SQ 的日子，日經 225 選擇權從 2015 年開始引進一週到期選擇權，所以每週五會計算
    SQ 。 |

    | **權利金** | 選擇權的價格。 |

    | **隱含波動率（IV）** | 從市場上的選擇權價格（權利金）計算出的預測波動率。 |

    | **歷史波動率（HV）** | 由交易標的過去的價格變化，計算出的預測波動率。 |

    | **Delta 值** | 交易標的變動 1 單位時，選擇權價格的變動率。Delta 值為 1 時，價格的變動等同於交易標的，也就是和期貨（如果是日經
    225，則為大阪日經 225 指數期貨）一樣。 |

    | **Vega 值** | IV 變動 1% 時，選擇權價格的變化。 |

    | **Gamma 值** | 交易標的變動 1 單位時，Delta 值的變化。 |

    | **Theta 值** | 買進後，時間會經過 1 天，選擇權會跌價的幅度。 |

    | **Rho 值** | 對利率的敏感度。除非持有大量的選擇權或交割月份非常久的選擇權，否則可略不計。 |


    ### 外行人想法欠缺的是「日經 225 可能會到履約價」的慎重心態。


    駕訓班會告訴學生開車不能抱持「應該吧」的想法，而是要做好「可能會」的心理準備，股市也一樣。


    個股和期貨可輕鬆計算花了多少金額買進，如果跌到多少就會出現多少損失。選擇權雖然比較難計算進出場價，但既然有風險參數，就應該能試算出日經 225 跌到多少時，該選擇權的權利金會變多少。


    不管有多少種選擇權的組合，還是要一一試算。確實做好這類模擬，就能防止自己像過去產生鉅額損失的案例一樣冒險。


    在我還是菜鳥選擇權交易員時，做的是持有選擇權賣方部位的交易的交易，是稱為「賣波動性、負 Gamma」的部位。眾所周知，這種策略 10 次能贏 9 次，但只要輸
    1 次損失就會超出前 9 次獲利。


    當時曾發生阪神大地震和霸菱銀行事件，如果不採取對策便會出現一定的損失，但結算時，我都能成功沖銷部位，並以獲利告終。


    當時我每天早上都會做選擇權的模擬計算，以建立避險方案，例如：日經 225 跌到哪裡，就賣期貨避險；漲到哪裡時，賣權的權利金大概會變多少，再買回並用預測的履約價賣掉。


    如此一來，因為已經能想像日經 225 跌到某價位時，部位會變得如何，所以不會動搖和焦躁，只要以平常心控制部位，照著事先訂立的方案執行即可。


    選擇權的確是很困難的商品，必須確實讀懂使用說明書。然而，選擇權並不危險，危險的是「未確實理解選擇權就冒險的行為」。若能確實理解，選擇權是自由度極高的商品，無論市場是漲、是跌，還是停滯不動，只要照自己的預測走就能獲利。


    遺憾的是，現在只有極少數的證券公司，可在一定程度的自由環境下操作選擇權。你或許會覺得，學會也無用武之地，但日本業界已開始出現一些動向，旨在讓更多人理解選擇權的魅力。如果你有興趣，請試著深入研究看看。


