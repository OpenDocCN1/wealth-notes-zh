    ## 中長期投資，最重要的是分析基本面！


    既然要站在中長期的視點，靠基本面的變化獲利，就要做好倉位控制，不要受到短期市場變動的過度影響。


    中長期投資要做的事前準備，和當沖或短線交易有很大的差異。盤中幾乎沒什麼事要做，但調查企業或分析的時間會大幅增加。


    中長期投資的投資判斷大多以基本面為基礎，但基本面短期間內不會有巨大的變化。如果是採多空策略，也不用太在意市場短期振盪。相反地，假如明明是以基本面為依據建倉，卻因為短期的市場變動而造成投資判斷出現偏差，就會造成問題。


    即使只做多，如果資金操作前提條件（停損點等）的風險耐受力較高，就不需要因為短期的市場變動而患得患失。換個說法，既然要站在中長期的視點，靠基本面的變化獲利，就要做好倉位控制，不要因短期市場變動而過度受到影響。'
