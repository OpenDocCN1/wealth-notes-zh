    # Chapter 9


    # 從股市的歷史循環，判斷未來股市會怎麼走？


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_224_1.png)


    ## 9-1 1990年代：靠價差賺取獲益機會


    這個時代對交易員來說，雖然個人的報酬面不佳，但交易環境卻十分受惠。就算交易系統再慢，環境也遠優於客戶。


    我畢業進入業界，是在 1990 年代前半。剛進入社會時，我被分派到股市部的期貨選擇權課，擔任選擇權交易員。當時我連電腦都沒真正摸過，也不擅長數學和英文（簡單地說就是書沒讀好），所以我當下的心情是「怎麼會這樣！」


    當時的主管曾創立套利團隊，有實力又嚴厲，不過也很會照顧人。報到後主管立刻要我「出去見識見識」，把我送到債券部實習幾週，也當過幾週的交易所經紀人，累積各種經驗。


    **本章會逐一解說從我剛成為社會人開始，一路看下來**

    **的「交易員」樣貌。**


    1990 年代前半電腦才剛普及，當時的 Windows 版本是 3.1，Excel 雖然已經問世，但當時的人大多使用一種叫 Lotus 1-2-3 的試算表軟體。年紀較長的大叔們大多苦於不知如何因應時代變化，使得電腦教室風行一時。當時的我也不太精通電腦，所以剛開始一樣很辛苦。


    不管是法人還是散戶，當時的股票交易主要是用電話透過股票部交易。在此簡單說明當時買賣單如何成交。


    證券交易所有 一項稱為「交易所經紀人」的工作，會在證券交易所的大廳（交易廳）走動並下單。假如客戶透過業務負責人（或法人客戶的專屬交易員）下 1000 股豐田汽車的買單，營業負責人接單後會告知股票部內的熟線負責人。


    熟線負責人會透過連接證券交易所和證券公司的「下單熱線」傳達買單內容，在交易所接熱線的人，便會用手勢把下單數量告知交易所經紀人。隨後，交易所經紀人會把買單交給負責撮合各證券公司買賣單的人，進行競價撮合。


    有大筆買賣單進來而交投熱絡的個股，撮合者那邊也會鬥庭若市。交易所經紀人要在吵雜的環境下，邊推邊前進，設法讓自家的買賣單早一點成交。


    當時交易所經紀人的必備條件是強韌的肉體，所以多半是高中畢業、有運動鍛鍊過、身心強韌的人才，而非一流大學畢業生。


    買賣單好不容易成立後，要依照下單的相反步驟，把買賣單成交一事告知客戶，完全靠人工作業。從客戶下好買賣單到得知成交內容，再快也要花好幾分鐘。


    當時有一部分個股稱為「系統交易股」，能透過交易所所提供的裝置買賣，衍生性金融商品主要也是透過交易所的裝置交易。但要設置這些裝置的成本高昂、有許多限制，所以能使用的人數相當有限。


    但在這樣的環境下，當時的交易員卻是人手一台裝置，可自行判斷直接下單。雖然交易廳個股只能透過熟練負責人進行電話下單，不過由於他們都在同一樓層，隨時都能找到人。因此這是交易員具有高度環境優勢的時代。


    客戶的買賣單送到交易所前會經過好幾道流程，執行過程也較花時間。相較之下，交易員只要一覺得「有賺頭」，就能直接透過裝置或熟練負責人立刻下單。


    這不代表當時允許「超前交易<sup>註 13</sup>」，但從客戶角度來看，這個環境的確堪稱不公平。


    那當時的交易員會被嫉妒或厭惡嗎？其實並非如此。當時交易員和業務部門之間沒什麼隔閡，管制也比較鬆散。


    當客戶想處理大筆賣單或拋售（認賠殺出）時，市場有時會沒有足夠的買單。此時交易員可以自行承擔風險買下來，協助客戶完成訂單，也就是增加市場的流動性，擔任協助客戶成交的角色，所以交易員甚至會受到業務負責人感謝。


    但這種寬鬆的環境也成了非法手段的溫床，例如：彌補虧損和利益輸送等問題。彌補虧損是指，當證券公司的大客戶在股市交易蒙受損失時，由證券公司代為彌補。同樣的，也會讓大客戶進行有利的交易以輸送利益。這些做法明顯違反規定，所以法律和社會對證券公司加以嚴厲制裁。


    1990年代初期，日本泡沫經濟崩盤後，被確保獲利壓得喘不過氣的各家證券公司，必須面對這些所謂證券業界醜聞所引發的問題。


    之後法規強化，能頻繁聽到「防火牆<sup>註 14</sup>」一詞。交易員逐漸與其他部門隔離，因為資訊阻斷等因素，失去協助客戶下單和提供流動性的作用。提高獲利成了僅存的職責，所以逐漸變成一切自理的工作。


    當時的交易員基本上是正職員工，幾乎沒有像現在這樣的簽約制，一般員工會被分發到交易部門擔任交易員。此外，也幾乎沒有成功報酬（獎金），即使能夠年賺幾億日圓，頂多也只是獎金增加
    100 萬日圓，或是獲得總經理獎而已。從公司角度來看是一個美好的時代。


    在此介紹一下，在我剛畢業時所接觸到衍生性金融商品的情形。


    各位知道日本第一個期貨是什麼嗎？其實不是大阪日經 225 指數期貨，而是 1987 年，在大阪證券交易所上市的「股票期貨 50」。不過，在我進入業界時，股票期貨
    50 已慢慢式微，交易比較熱絡的是大阪日經 225 期貨指數或 TOPIX 期貨。


    1990 年左右，所羅門兄弟靠套利獲得鉅額利益，於是其他證券公司也爭相開始套利。這是一種需要足夠資金的操作方式，但中小證券也很積極投入。因為市場有很大的價差（獲利機會），據說當時日經
    225 和日經指數期貨的價差甚至可達數百點。


    當時市場分析師最常說的評論是：「未來漲勢可期，所以期貨被大量買進。」只要確實理解理論價格和 SQ 的機制，沒有比這風險還低又美味的交易。「理解商品機制讓價差成為獲利機會」，在現今也很重要，所以請牢記在腦中。


    我過去隸屬的衍生性金融商品團隊，也有做過這種套利。要買日經 225 的一籃子股票，就必須一口氣下單買進 225 檔個股，如果每一檔都要手工處理，實在太花時間，所以我們還特地投資設備，打造出能用系統下單的環境（話雖如此，不過就是靠薄薄的
    8 吋磁碟片，發出「咔嚓、咔嚓、咔嚓……」的聲音，把訂單發送出去）。


    接著會用印表機印出成交內容，把成交價手動輸入 Excel 或 Lotus 1-2-3，再用工作表計算，花費這麼多工夫，才終於計算出這一籃子股票換算成日經 225，是用多少價位買進或賣出。


    這個過程中所耗費的工夫和時間，在現代簡直難以想像。不過，當時市場確實有很多足以獲利的價差。


    其實這個時代對交易員來說，雖然個人的報酬面不佳，但交易環境卻十分受惠。交易系統再慢，環境也遠優於客戶。以現在來說，便是能做到「靠下單延遲做套利」的一方。


    在客戶的買賣單送達前，具有環境優勢的交易員能先下單到市場中，並在得知客戶的買賣單內容後，早一步搶單。當時也禁止這種超前交易的行為，但回想起交易廳的景象，會覺得靠下單延遲的套利確實存在。


    昔日的交易所經紀人，會注意大型證券或外資證券設在交易所內的小房間。小房間裡有各券商的熟練負責人，等著接客戶的買賣單。


    熟練負責人透過電話接到單時，馬上對自家的交易所經紀人比手勢，告知交易的個股和股數等，交易所經紀人收到資訊後，跑到撮合者那裡讓買賣單成交。基本上，各家證券公司的手勢都一樣，所以大型證券或外資證券只要一進大筆的單，其他券商也會看得一清二楚。


    因此，大家都會留意常有大陸買賣單的大型證券或外資證券。一旦發現動向，便爭先恐後跑到撮合者那裡，以便自家的交易比大型證券或外資證券的大單，更早一步下單。雖然相當手工，但也是一種靠下單延遲的套利。


    然而，那樣的時代在 1999 年 4 月 30 日宣告結束，東京證交所關閉交易廳，買賣單的撮合全部系統化，從此再也看不到這樣的景象。


    交易所經紀人也失去舞台，大多轉行當自營交易員。過去的交易員大多身材壯碩，正是因為有很多人以前是交易所經紀人。


    在這個時代，一樣有賺錢和不賺錢的交易員。兩者的差異，取決於他們能確實看清自己與市場到何種程度。回顧當初，由於當時的市場有很多價差，交易員又身處優勢環境，賺錢可說是理所當然。


    我做了一陣子交易員後，便能做到單月獲利幾乎未虧損的程度，用第 8 章解說的績效分析來看，當時的單月勝率應該有 90%。


    > 註 13：搶在客戶交易之前先買賣，屬於非法交易。

    >

    > 註 14：防火牆為日本金融用語，意指銀行業務與證券業務的資訊阻斷，以防止利益衝突和非法交易。


    ### Column 交易員的另一項作用


    獲利是交易員在工作上的最大目的和作用。正如本文中介紹，交易員的角色隨著時代變化，逐漸集中在獲利上。但不能忘記，另一個作用就是提供流動性。


    對過去的市場來說，交易員的買賣單或交易是支撐流動性的重要存在，有人想賣就去買，沒人委買或委賣就自行出示價格。隨著時代演進，這項工作被俗稱「造市者」所取代。


    對於變成契約制、一切都要自理的交易員來說，做上述的麻煩事只有風險沒有優點，可說是一大負擔。現在交易已經高速化和複雜化，缺少能用系統揭示價格的環境，要造市反而相當困難。


    交易所也一樣，由於交易員的買賣占比大幅減少，轉由 HFT 取代，所以也有許多人認為 HFT 能帶來充分的流動性。這幾年，造市者和 HFT 支撐著市場的流動性，讓交易員的存在感日益薄弱。


    我在新人時代，每當交易所有新的期貨或選擇權商品時，會理所當然地協助該商品在市場上立足，包括學習商品內容、計算出理論上的適當價格、下單使其成交等。


    這是因為如果該商品成功且頻繁被交易，自己就會多一口飯吃，也對市場有助益。


    但時至今日，若要交易新商品，每次都必須投資和開發系統，所以越來越多證券公司以「不知道該商品能賺多少」為由，不進行應對。這導致交易員幾乎無法在新商品出現時，立即開始學習，交易所也越來越依賴造市者。


    造市者基本上只會被動涉險，相較之下，交易員會憑藉自身的市場觀點積極涉險。正因為有交易員進場交易，買賣單才會有意價，然後逐漸形成市場。


    市場的多樣性非常重要，交易員能提供市場流動性、幫助市場發展，我們應該回想交易員其實還有這樣的作用。


    一度瀕臨絕種的交易員，應該以發展和活化市場的角色重新活躍。努力讓市場相關人士覺得交易員不可或缺，這對業界的未來也非常重要。


    ## 9-2 2000年前後：IT泡沫造就股市黃金期


    交易員所處的環境從此產生劇變，契約逐漸成為普遍的聘用形態，許多公司開始網羅優秀的交易員，希望靠交易金融商品獲利。


    1990 年代泡沫崩潰之後，日本社會處於痛苦之中，對金融的不安節節攀升，住專問題<sup>註 15</sup>、證券交易不景氣和證券商醜聞屢上新聞版面，山一證券、北海道拓殖銀行和日本長期信用銀行等大型金融機構相繼破產，其他金融機構和證券公司也接連整併求生存。


    我個人印象最深刻的是 1995 年的霸菱銀行事件，一名交易員在 SIMEX（現在的 SGX，新加坡交易所）操作日經 225 指數期貨，竟然把英國歷史悠久的霸菱銀行弄到破產。正因為我們曾在相同舞台，用相同商品在市場競爭，更讓我切身體會到：絕不能用傲慢的態度面對市場。


    幾年後，我第一次跳槽，對當時還是新手的我來說，真的是背水一戰。交易員換了新公司就必須有一定的成果，否則要有被解雇的心理準備。當時我拚命想獲利，原本是以期貨為中心交易，後來拜託主管也讓我交易個股，開始親自參與各種交易。


    那時候網際網路一詞還很新穎，正開始成為熱門話題，我為了做選擇權交易，還特地去學程式語言。當時我也覺得網路時代十分有趣，因為改變正在發生，會讓人期待時代變化。


    報紙上每天都能看見網際網路一詞，俗稱「網路概念股」的企業股價也开始飆漲。高科技企業的股價全面上漲，逐漸呈現泡沫化的狀態。交易員之間甚至流傳一句話：「漲停就閉著眼睛買（因為通常隔天開盤會買單高掛）」，這是人稱
    IT 泡沫的上漲行情。


    在泡沫崩盤的前夕，分析師報告開始出現些許的變化，彷彿在正當化暴漲過頭的股價，至理開始變多。股價已經漲到 PER、PBR、ROE 等常用指標都無法正當化的水準，所以股價的計算基準開始出現「股市未實現獲益」一詞。


    附帶一提，1980 年代後期的泡沫時代，有個稱為「Q 比率」的數字，這是在泡沫快破裂前會出現的訊號，大家不妨稍微記一下。


    那時候，對背水一戰轉行的我來說，網路泡沫是一種幸運，甚至可說是一帆風順。年輕毫無畏懼的我，積極在市場搶攻，獲利也急速增加，成長到在所有交易員中前幾名的程度。


    我能交易期貨和個股，但主要的獲利大多來自個股。偶爾交易期貨時，也不會選日經 225 指數期貨，而是做 TOPIX 期貨，這是有理由的。


    當時的日經 225 沒有太多的高科技企業，大多是重工業的鋼鐵與原料相關產業。換句話說，因為指數成分股的問題，日經 225 常會被 IT 泡沫的漲勢排除在外。


    另一方面，TOPIX 的成分股則是東證一部的所有個股，於是股價急速上漲，使得總市值大增的軟銀或光通信等個股，站上指數成分比例的前幾名。


    因為我理解指數的差異，所以才會選擇交易 TOPIX，而非日經 225。第 6 章曾提及 2000 年 4 月時，日經 225 大量替換成分股，就是因為有這樣的背景。這個例子告訴我們，事先理解股價指數的機制有助於交易。


    交易員所處的環境從此產生劇變。1990 年代以正職員工為中心，交易員的報酬過於低廉，大幅落後歐美美連線基金「Two-Twenty」的報酬體制（管理報酬 2%、成功報酬
    20%）。


    對此感到不滿的交易員強烈要求提高報酬，但如果只給交易員成功報酬而調高待遇，可能遭其他部門的員工反彈，所以解套的方法是推動交易員契約制，基本上是一年一約，績效不好就會被解聘。這是因為契約交易員要承擔這樣的風險，所以會得到符合績效的報酬。


    站在公司的角度來看，也能藉此維持整體的平衡，因此契約制逐漸成為普遍的聘用形態。


    聘用形態的變化，給交易業界帶來很大的影響。交易員為了保住自己的工作，會以獲利為最優先考量，不再培育人才，也不再替公司或組織做其他事情。成功報酬漲到和避險基金一樣的
    20% 後並未就此打住，2000 年後更進一步高涨。


    另一方面，觀察證券業界整體，連同 IT 泡沫一起出現的「網路證券」，威脅到仰賴面對面營業的中小證券。善用新基礎設施（網路）的年輕世代客戶，逐漸流入網路證券。


    中小證券在法人業務上贏不過大型證券、外資證券或銀行類證券，逐漸看不到未來，因此許多公司開始網羅優秀的交易員，希望靠交易金融商品獲利。


    於是，大家開始互相挖角優秀的交易員。對被挖角的公司來說，花金錢和時間栽培的交易員可能三兩下就被挖走，所以業界逐漸不再培育人才。如此一來，交易員更進一步朝獨立作業前進，感覺就像外籍傭兵。公司的其他部門對待交易員，像在對外人一樣畢恭畢敬。


    這個過程導致交易員被孤立，大家不再像 1990 年代的套利交易一樣，成立組織嘗試新作法，也不再做大型的設備投資，就像是放棄研發投資、設備投資和人才培育的企業。

    '
  mdcn: '

    （15 勝 5 敗），就能賺到 1000 萬日圓。」


    話雖如此，剛開始交易技巧還不好，所以要從更小的金額開始慢慢獲利，讓公司增加自己的虧損上限和可控制的部位量。當我總算達到單月獲利 1000 萬日圓的那一刻，不禁相當感慨：「終於走到這一步了。」


    接下來繼續挑戰單月獲利 3000 萬、5000 萬，再來是 1 億……，花了好幾年的時間來慢慢成長。


    當我察覺時，當初虧個 50 萬日圓都會眼前一片漆黑的我，已經成長到即使虧損 6486 萬日圓，也相信有辦法解決的地步。


    總之，唯一的做法是要理解風險的本質，配合虧損上限來控制風險，持續獲利並慢慢拉高目標。你必須花費時間，腳踏實地、不疾不徐地重複累積。配合風險容許度設定合理的目標值，再搭配風險控制，讓交易有彈性。只要能確實做到這些細節，雖然需要耗費時間，但終究會達到期望的結果。


    此外，請理解風險量不等於金額。舉例來說，投資的個股屬於新興股時，流動性會降低，但股價的波動性則會變高。用這種個股建倉時，雖然能期待更高的獲利，但風險也會增加，所以必須控制部位量（風險量）。


    操作交易波動性高的個股時，如果腦中只想著「期待獲利」，而建立大量的部位（冒高風險）是很危險的事。投資大型股 1 億日圓和投資新興股 1 億日圓，風險截然不同。


    只想著獲勝後的期待獲利，而隨意冒巨大風險的人，不可以說是能控制風險。最重要的是，如何面對壓錯寶時的風險。


    此外，散戶依個人年齡、家庭成員、生涯規劃，可容許的虧損上限和目標獲利也會不同。用類似財務規劃師的想法來看，越年輕的人能冒的風險就越大，而家中小孩越多的人所需的教育費越多，能冒的風險則會變小。


    想在金融世界長期存活，不可或缺的是對風險抱有確實的想法。


    ## 8-5 買在最低點、賣在最高點？專家說：不要想賺好賺滿


    要是股價照預期高漲，期待便會水漲船高，但潛在的下跌風險也會提高。如果此時先賣掉部分的部位落袋為安，就能以優勢立場，在市場上用剩餘的部位奮戰。


    每個人都想買在最低點，賣在最高點。但實際上沒人能做到，就算做到了也不過像中樂透一樣，純屬運氣好而已。此外，停利時也並非一定要一口氣出清部位。


    舉例來說，目標價位預設是 1500 日圓，而你在 1300 日圓進場買了 1 萬股。現在股價漲到 1450 日圓，這時你賣出一半的部位落袋為安，便能獲利 75
    萬日圓。


    這樣做的好處是，假如 1450 日圓是股價的高點，即使接下來跌回進場價的 1300 日圓，但你已經在 1450 日圓時，將一半部位落袋為安，此時出清還是能賺
    75 萬日圓。


    **如果能夠 1 萬股握到最後，再一口氣停利，會賺得更多，但你無從得知哪個時間點才是「最後」。**


    有時候雖然事先設定目標價位，卻在還沒到達時，股價就下跌了。當股價跌到進場價時，許多人都認為：「一定會再上漲」，但股價很無情，有時就是會續跌。


    假設你捨不得在 1300 日圓賣出，結果又跌到 1150 日圓。如果你持有 1 萬股用 1300 日圓進場的股票，跌到 1150 日圓等於損失 150 萬日圓。但如果在
    1450 日圓時先賣出 5000 股，手上就會有 75 萬日圓的獲利，即使不得不將剩餘的 5000 股在 1150 日圓時脫手，也能抵銷產生的損失。


    未實現獲利是尚未確實入手的東西，會依分秒變動的股價增減，所以只要持有部位，就會因股價變動而患得患失。要是股價照預期高漲，期待便會水漲船高，但潛在的下跌風險也會提高。此時如果先賣掉部分的部位落袋為安，就能以優勢立場在市場上用剩餘的部位奮戰。


    此處舉的例子只是其中一種做法，不但屬於資金管理，同時也是心理素質管理。千萬要記住：不要把獲利變成虧損。


    出場不是只抓一個點位，有時分散會比較好，這點也能套用在進場。不要一次投入大筆金額，可以把資金分成 3 等分試水溫，如果上漲就分 2 次進場，逐漸增加部位。


    若是股價在試水溫的階段就開始下跌，也可以馬上停損。如此一來，因為只用 3 分之 1 的資金進場，損失也會變小，分散買賣時機也是一種技巧。


