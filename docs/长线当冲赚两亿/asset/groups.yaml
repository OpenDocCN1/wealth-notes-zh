    倖存的交易員則致力因應市場的變化，摸索不與 HFT 正面衝突的交易手法。其中一種做法，是採取比較不容易受交易速度影響的短線交易，也就是改用時間軸更長的交易方式。


    短線交易的前提，是一一定程度地擴大手上持有的部位，包含持倉過夜在內。換句話說，必須有一定程度的耐心。交易員一整天都在觀察市場和盯盤，所以很可能受價格變動影響，不小心就出手下單，或是賣掉原本打算持有的部位。


    為了避免這種狀況，「與市場保持適度的距離感」顯得格外重要。如果股價在一天內達到既定目標或跌到停損點，當然應該停利或停損，但如果沒有大的利空或利多，卻時常發生停利或停損的狀況，代表你的進場依據本身就的問題。


