    ## 7-3 狀況不對時，別急著贏回來，你應該......


    想扳回損失終究只是一廂情願的主觀想法，而交易一旦陷入自己的一廂情願之中，就代表失敗。


    在此談談我的經驗，聊聊關於「這輩子都忘不了的一天」。各位記得 2003 年 12 月 13 日發生什麼事嗎？美國在 911 事件後引發第二次波斯灣戰爭，伊拉克首都巴格達淪陷後，美軍在這天的「紅色黎明作戰」中，捕獲一直逃亡在外的前伊拉克總統海珊。


    當時我只是一介股市交易員，而那一年的狀況很好，到 10 月為止氣勢如虹，幾乎足以刷新最高的年獲利。光是 4 月到 10 月的獲利就超過 3 億日圓，可說是勢如破竹。但
    11 月後狀況卻開始不對勁，變得跟市場不合拍，不停出現一賺一賠的狀況，不但損益的振盪幅度頗大，又無法獲利。


    這種不協調感到 12 月進一步惡化，儘管我察覺不對勁，卻無法克制自己，於是用一大筆錢隨便亂建倉，導致出現幾百萬日圓的損失。然而，此時我還是覺得這點錢有辦法賺回來，於是繼續交易。


    沒想到，原本虧的幾百萬日圓不但沒賺回來，損失反而逐漸擴大，甚至超過 1800 萬日圓。我從沒輸得這麼慘過，心裡當然很慌，覺得必須設法挽回。這時，我看到海珊落網的新聞，認為是個絕佳的機會，因此立刻買滿銀行股和日經
    225 指數期貨的多頭部位。我的劇本是海珊被捕後，中東情勢會穩定下來並使股價上漲，希望藉此挽回虧損的劣勢。


    建倉後我馬上得到一大筆帳面獲利，不過還沒有完全彌補 1800 萬日圓的損失，所以決定繼續以買滿部位的狀態持倉過夜。這是因為我期待歐美股市會隨著東京股市上漲，並使東京股市在下一個交易日持續漲勢。然而，這裡有一個很大的陷阱。


    海珊落網的新聞披露於日本股市交易時間，並使得日經 225 上漲。歐美股市的股價如果沒有更大的漲幅，就表示日經 225 的漲勢不合理。當天晚上，我心驚膽跳地觀察紐約市場的交易日，紐約道瓊一開盤就大漲
    100 點。我當下覺得「壓對寶了」，但若紐約道瓊只上漲 100 點，日經 225 的上漲依舊不具正當性。


    附帶一提，12 月 13 日捕獲海珊是日本時間的週六，所以股市休市，而 15 日週一的日經 225 比上週末漲了 321 點。要正當化這波 321 點的漲勢，紐約道瓊僅漲
    100 點是不夠的。


    隔天一覺醒來，卻發現紐約道瓊的 100 點漲勢沒有維持住，而是開高走低。當下我的眼前一片漆黑，接下來的心情從搭電車到公司上班為止，好像受刑人在等候執行一樣。


    日股開盤後，我想先處分手頭一半的部位，於是下了銀行股和日經 225 指數期貨的賣單，但大家都在想一樣的事情，一堆市場參與者開始拋售手頭的部位。


    特別是銀行股當初有很多投機客進場炒熱行情，因此拋售也相當狠，導致市場持續賣單高掛，無法成交。後來日經 225 指數期貨也開盤，我預測會下跌，並建置空頭部位想填補損失。但等銀行股成交停損後，日經
    225 指數期貨卻一口氣漲了 100 點，讓我的損失進一步擴大，最後這個時間點，我的損失已經達到 3400 萬日圓。


    當時我被允許的單月虧損上限是 4000 萬日圓，我認為在這樣的狀況下已無法挽回損失，所以向主管道歉，並清空所有的部位，請主管讓我自己判斷何時再開始交易。這是為了在不持倉的狀態下，冷靜分析自己的交易哪裡出問題。


    一旦在交易中出現鉅額損失，肯定會忍不住拚命想彌補。不管是操作公司資金的交易員，還是操作個人資金的散戶都一樣，因此容易引發焦躁情緒，造成下了壞棋。


    總而言之，假如自覺狀況不妙時，應該暫時離開市場。在停損的狀態下退場固然難受，不過清空部位可以讓自已暫時恢復冷靜。我會離開市場，重新檢視當初建立的部位，藉此冷靜分析自己是哪裡做得不好。


    當時我的具體做法，是逐一檢視 11 月以後交易不順利部位。我找出的結論是因為 10 月以前的良好狀況讓自己太自滿，導致和市場動向不合拍，最後引發焦躁。


    為什麼我會知道？因為我發現，自已在平常會慎重判斷的地方隨便涉險。自滿讓我連續虧損，又因急著彌補而心浮氣躁，於是陷入惡性循環。我帶著主觀看市場，才會不由自主地胡亂出手，明明時機不對，卻誤認為機會來了。


    換句話說，我的交易是追著市場和價格變動，交易次數雖然增加，但卻不是基於客觀判斷建倉，所以勝率才會一路下滑。再加上至今累積的獲利讓我輕忽風險，完全沒有控制部位。我不斷濫用大筆資金，甚至不顧自已對交易是否有把握。


    想扳回損失終究只是一廂情願的主觀想法，但交易一旦陷入自已的一廂情願之中，就代表失敗。我之所以在海珊落網時，全力買進銀行股和日經 225 指數期貨，又冒著過高的風險持倉過夜，都是因為急著彌補損失。這種判斷源自自我的一廂情願和焦躁，虧損也是理所當然。若沒控制好心理，不管是散戶或交易員，都有可能陷入泥沼。


    ## 7-4 想培養心理素質，要先從「對自己有 信心」開始


    一天損失 1000 ～ 2000 萬日圓鉅款卻不痛不癢的人，不叫心理素質堅強，而是喪失生存所需的迴避危機本能。


    不管再怎麼認真，腦筋再怎麼好，我認為心理控制做不好的人最好不要碰超短期買賣。此外，不服輸、自尊心高和容易一頭熱的人，也不適合超短期買賣。


    雖然超短期買賣和完全靠運氣的賭博截然不同，但還是有投機和賭博性的因素。一旦血氣上衝，你不會有時間恢復冷靜，如果在這樣的狀況下重複進行短期交易，很可能出現鉅額虧損。


    另一方面，交易時間軸越長，越容易做好心理控制。即使當天在盤中虧損，內心七上八下又焦躁，收盤後還是有時間重新檢查自己的部位，客觀分析變成這樣的原因，所以比較容易控制自己的心理。


    我目前管理近 50 名股市交易員，他們的心理素質和交易手法各有不同。不擅長心理控制的人，也能用交易時間軸較長的策略獲利。市場的範圍非常廣，獲利方法也不只一種。因此，確實掌握自己的優缺點，找出符合自己的交易方法，才是在這個世界成功的秘訣。


    相反地，即使是具有高潛力的交易員，如果一直用不適合自己的方法交易，也永遠都贏不了。要找到適合自己的交易方法，心理控制是最簡單的測試法。


    如果你是不擅長心理控制、容易在瞬息萬變的狀況下，隨波逐流而失去自我的人，即便想選擇短時間軸，最好不要選擇當沖，只做到短線交易才是上策。


    可能會有讀者覺得：「心理素質的強弱是與生俱來的，再怎麼努力都無法改善」，但我不這麼認為。或許有人天生心理素質比較強，但也能靠後天的努力鍛鍊，而我就是過來人。


    我小時候讀書和運動都不是特別優秀，整體算是平均水準，在班上也不是特別引人注目。當時我的心理素質並不比其他人優越，甚至對自己沒有自信。


    後來我遇到了改變自己的機會，是一次自行車公路賽。既然是比賽，就要獲勝才有意義，所以我拚命練習，也參加過許多大賽。雖然剛開始得不到名次，但我仍因不甘心而不斷練習，並且持續參加比賽。在反覆練習和參賽的過程中，我終於在某次大賽得到優勝。


    這個經驗讓我開始相信自己的可能性，就算是這樣的我，只要持續努力一樣能有成果，讓我產生自信。自信不是自戀或平白出現的東西，而是相信自己肯定做得到，並為了挑戰自己的可能性，而不斷努力學習或鍛鍊身體，才能培養出自信，也就是相信自己。


    這股自信是我鍛鍊心理素質的契機。所以我認為自信不但可以靠後天努力獲得，心理素質也能靠後天培養，只要能找到讓人改變的契機，任何人都能鍛鍊出堅強的心理素質。


    這裡說的心理素質堅強，不等於麻木不仁。一天損失 1000 ～ 2000 萬日圓鉅款卻不痛不癢的人，不叫心理素質堅強，而是喪失生存所需的迴避風險本能，這會產生另一個問題。


    舉例來說，我以前常會全力建滿部位，卻因股價變動而造成數千萬日圓損失。這時候經常有人問我：「賠了這麼大筆錢，為什麼你還能毫不在意呢？」


    其實我絕不是毫不在意，而是因為我從過去的經驗學會面對自身弱點的方法，而且我相信即使蒙受鉅額損失，憑自己的能力再花一些時間，就能完全回填。就算狀況很糟糕，我仍相信有辦法解決並冷靜應對。因此，前文提及那次難忘的損失，後來也被我回填了，這讓我變得更強大。


    面對市場時要學會控制自己，所以我非常重視心理控制。當出現損失時，我常對自己說：「我一定能回填這筆損失，但不能急躁，想扳回一城的情緒太過強烈，交易就會失敗。」


    第 7 章 想長期在股海生存，該如何做好心理控制？下一節將具體解說這句話，告訴大家穩定心理的 7 個重點。


    ### 7-5 重點 1：賠錢時，應暫時與股市保持距離


    金融市場中，不同交易市場和個股會以各種形式互相影響。因此投資個股拼勝負時，必須記住巨大金融市場的關聯性和結構。


    短期交易容易讓視野變得狹隘。不斷在極短時間內下判斷和決策的過程中，不知不覺會變得只關注特定個股的股價動向和委託單資訊。即使知道真實的股價是隨著經濟、政治、社會情勢等各種新聞而變動，也容易忘記關心相關資訊，只追著股價和委託單跑。


    想在股市獲利，要避免陷入視野狹隘的狀況。或許有人會說：「我只交易中小型個股，對市場整體動向沒興趣」，但個股的價格變動多少會受市場整體價格影響。


    此外，除了國內外的股市，還有買賣特定資產的個別市場，例如：國內外債券市場、外匯市場、原材料商品市場、不動產市場，或是最近成為熱門話題的虛擬貨幣市場等，也會相互影響價格。日圓漲會帶動日股跌，日圓跌時日股則會漲，便是典型的例子。


    舉最近的例子，如果比特幣等虛擬貨幣市場大幅崩盤，日本的新興市場股價可能也會大跌。原因在於，目前聚集在虛擬貨幣市場的投資者多半是散戶，而且據說世界上的虛擬貨幣交易，大約有
    4 成是日本散戶。在這樣的市場結構下，假如虛擬貨幣的泡沫崩盤大跌，大多數散戶都會縮小自己在市場的部位。


    此外，即使日經 225 持續上漲，新興股市市場的成長也可能停滯。這是因為東證一部市場的交易比重中，外資占近 7 成，而東證 Mothers 或 JASDAQ
    等新興股市場則有 6 成是散戶。如前所述，不同交易市場和個股之間，會以各種形式互相影響。因此，想透過投資個股撈勝負時，必須記住巨大金融市場的關聯性和結構。


    為了不讓自己陷入視野狹隘的窘境，應該有意識地與市場保持距離。我做當沖等超短期買賣時，只要交易虧損，就會立刻停止交易，重新估算時機。先果斷停損清空部位，並在手中沒有部位的情況下觀察市場，便能讓自己暫時恢復冷靜。


    ### 7-6 重點 2：交易完成後，記得為自己寫檢討報告


    很多失敗是因為無謂的判斷錯誤而賠大錢，讓人想消除這段記憶。但正因為是令人想遺忘的失敗，事後確實驗證才更有意義。


    我剛當上交易員時，常對所有交易寫下評論。不只記錄當天的交易收支，還會檢討當天自己進行的每一筆交易。做當沖時，一天可能會做幾十筆交易，我每天會花 2 ~ 3
    小時，一邊回顧跳動點圖，一邊反省交易內容。


    實際回顧交易狀況，會清楚知道，一整天所有交易都很順利的狀況十分罕見，一年都不一定有一次，而且肯定會出現「過早停利」或「不該有的損失」的狀況。因為無法在盤中回顧，所以我選擇在收盤後，最冷靜、客觀的狀態下進行。


    每天重複這項作業，理當能慢慢減少失敗。事後觀看評論的筆記，能為自己累積更確實的經驗。這項作業或許漫長又無趣，但我持續了 5 年以上，這個過程幫助我累積自信，讓我在面對嚴峻的市場環境時，依舊保持冷靜。


    中長期的部位交易雖然與當沖的分析方法不同，但本質是一樣的。為了客觀分析自己的投資組合部位，不過度沉浸在特定的單一部位，讓自己變得一頭熱，必須客觀地自我分析。


    ### 7-7 重點 3：別逞一時之快，下單前多問自己：「為什麼？」


    市場不會逃走，往後肯定還有其他機會，應避免因為「沒賺到這一波」的情緒，而採取不合理的行動。


    許多投資人在某檔個股賠了大錢後，都會想著「必須回補這筆損失」。每個人都不會有這種想法，我也不打算否定，但奇妙的是，許多人會想靠著害自己賠錢的那檔股票扳回一城。這或許是基於心理因素，因為蒙受損失會讓人感覺被否定而不甘心，才會想靠同一檔個股贏回來。


    但這是不合理最合理的想法。損失是因為誤判個股的價格動向。如果知道誤判的理由，修正後的確可以再用相同個股進行交易，但許多人不明就裡，只是一廂情願地覺得「在哪跌倒就要從哪站起來」，於是又買相同的個股。


    這種行為不僅不合理，甚至是錯誤的。同樣地，還有其他因不合理判斷而影響交易的案例。舉例來說，假設找到一檔覺得很好的個股，稍加觀望後，發現股價果然逐漸上漲。這時候，照理說就應該買進，但許多投資人反而覺得：「早知道應該在上漲前先買」，並開始煩惱：「應該在這裡買進嗎？可是股價已比當初看到時漲了許多，等股價拉回時再買比較好吧。」


    猶豫不決的過程中，股價卻沒有如願拉回，反而不停上漲。如此一來，這些人會覺得沒賺到這一波而開始焦躁。直到最後一刻，才下定決心追高買進，但股價往往在此時觸頂，這可說是看心情建倉的典型模式。


    原本應該在覺得可以買的空間，或確認起漲時就買進，結果卻猶豫不決，直到股價漲更高後（事後看來正是在快觸頂時）才決定買進。客觀來看，這是最不合理的行動。


    **如果到最後一刻都不進場，起碼不會虧損。確實，沒買進就沒賺到這一波，但實際上也沒有損失。** 若你遇到同樣的情況，應該多加警覺，避免因為「沒賺到這一波」的情緒，而採取不合理的行動。市場不會逃走，肯定還有其他機會。


    上述交易開始的那一刻，你可能已經失去冷靜。此時更應該暫時和市場保持距離才是上策。


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_189_0.png)


    ### 7-8 重點 4：切記進場與出場的依據必須一致！


    越短期的交易越容易輕忽依據，很可能成為逐漸迷失自我的契機，影響到下一次交易。


    進場時一定會有依據，但持有部位後，可能因為種種情緒，而在不知不覺間迷失。這時候，出場的依據容易和進場時不同。冷靜且客觀地回顧交易時，可能連自己都搞不清楚為什麼要這麼做。為了避免迷失在市場這片大海中，進場和出場的依據是否一致非常重要。


    舉例來說，儘管股價如預期上漲，卻因為完全不同的依據中途出場，可能因此成為逐漸迷失自我的契機，因為「搞砸了」或「好可惜沒賺飽」的焦躁感影響到下次交易。尤其越是短期的交易，越容易輕忽依據，請提醒自已意識到這一點。


    相較於短期交易，中長期投資比較有時間客觀分析狀況。換句話說，中長期投資的心理狀態，會因為收盤後的冷靜分析得到控制。收集微觀和宏觀的各種資訊並分析時，便會逐漸恢復冷靜。中長期投資比較有時間控制心理狀況，所以比短期交易更容易應對。


    做中長期投資時，股價動向有時會和擬好的劇本相反，造成未實現損益膨脹。中長期投資的交易員要依據基本面、財報內容、業績變化率來擬定劇本、預測未來的股價，不過，預測也可能猜錯。此時的重點應該放在是否知道股價為何和預測不同。


    股價不光反應基本面和業績預測，也可能因供需動向或 M&A 等事件而大漲，各種因素相互交雜。如果能看出這些因素，只需要修正劇本即可。修正劇本後如果判斷可繼續持有，就應該不停損而繼續持倉，因為股價遲早會回歸正軌，損失也可能回復。


    但偶爾也會找不出股價和預期方向相反的原因，導致未實現損益膨脹，這時候的應對會變得十分困難。


    若不知道股價往反方向前進的理由，就無從應對，而且中長期投資很難先暫時平倉。當你不知道股價走勢沒照劇本走的原因時，當然也無從判斷該在哪停損。即使是心理控制比較容易的中長期投資，也會陷入焦急難耐的狀態。


    因此，中長期投資要在操作方法下工夫，避免在發生上述狀況時造成致命傷，也就是分散投資組合，不要讓風險過度集中。如此一來，心理層面的控制也會比較穩定，不易被擊垮。


    ### 7-9 重點 5：別因漲跌改變目標價位，要冷靜觀察股市


    不管是停利或停損，都應該在進場階段決定好，並且謹慎執行。如此一來，便能冷靜客觀地觀察自己的部位，避免出現重大的失敗。


    不管是短期或中長期，建部位前都應有確實的依據，並且事先決定目標價位和停損點，精神上才會比較輕鬆，內心也不會像在搭雲霄飛車。我自己都會嚴格遵守，就算是超短期買賣，也很少看委託單就下單。


    假如原本打算在股價上 1000 日圓時停利，但是從委託單發現買盤較強勢，股價可望破 1000 日圓時，多數投資人應該都會把目標價位上修到 1100 日圓左右。這時如果實際股價持續上漲，上看
    1050 日圓、甚至 1100 日圓，目標價位又會被拉高到 1200 日圓。


    然而，當快到 1200 日圓時，股價卻開始下跌。假設目前跌到 900 日圓，而進場價是 700 日圓，代表每股的未實現獲利有 200 日圓，所以現階段出脫所有持股還能獲利。


    不過，即使能賺 200 日圓，大部分看過 1100 日圓的投資人卻不會在 900 日圓賣出。


    他們會一廂情願地認為「稍微再堅持一下，股價可能會回到 1100 日圓，運氣好可能會漲到 1200 日圓或 1300 日圓」，於是繼續持有部位。這就是所謂「錨定效應」，內心會覺得買得比之前的高價低，都是在賣心酸的。這個例子就如本章第
    7 節所述，沒虧損卻覺得好像虧損一樣，導致做出不合理的行動。


    現實往往沒自己想得這麼美。股價會從 900 日圓不停往下跌，買方看到下跌就不再進場，而高價買進的市場參與者則陷入恐慌而拋售。到了那個時候，可能會陷入想賣也賣不掉的窘境。


    這是典型的交易惡例，如果有充分的依據倒另當別論，若只因價格變動就隨便更換目標價格，又因為沒賣到最高價而覺得虧損，反而把獲利都賠光了。為了避免這種狀況，最理想的做法是：不管停利還是停損，都應該在進場階段決定，並且謹慎執行。


    過去，我在進場後會馬上用事前決定的目標價格下 LIMIT 單（原譯註：Limit Order，限價單），停損則會在股價跌到停損點時，一口氣全額賣出。


    因此，下完單後只要站在觀察者的立場，冷靜地觀察自己的部位狀況，一邊和市場保持距離，一邊觀察市場有無照預測走，是否有奇怪的走向。如此一來，便能冷靜客觀地觀察自己的部位，避免出現重大失敗。


    ### 重點 6：股神也會犯錯，要勇於承認自己的錯誤


    金融市場實在過於龐大且複雜，相較之下，自己只是渺小的存在，所以犯錯也無所謂，重點在於要避免在犯錯時受到致命傷。


    我在養成回顧交易的習慣後，內心彷彿多一個人監視自己，如果交易得太得意忘形，他就會發出警告：「你稍微休息一下比較好。」


    **回顧交易是非常枯燥乏味的作業，但反覆進行能客觀看待自己，甚至注意到自己的傲慢**。 沒看見自身傲慢的人，往往無法冷靜檢討自己的錯誤，甚至會把錯誤推給別人，覺得「是市場有問題」、「是告訴我買這檔股票的人不對」。這種人最好不要在金融世界交易。


    世上確實有天才型的交易員，他們不需特別努力，靠感覺便能拿出確實的成果，而且心理控制也相當完美，但大多數的人並非如此。假如交易稍微順利一點就過度相信自己，肯定會失敗。

