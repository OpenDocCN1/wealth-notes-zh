    # 2-1 進行交易前，要先做兩個基本動作！


    交易是不停重複基本交易流程並增加獲利，一旦流程從某處開始瓦解，交易就會變得不順。


    如前文所述，職業股市交易員都有自己擅長的交易手法，主要包括超短期、短線、中長期、衍生性金融商品等，本章會分別說明以上幾種手法，深入挖掘其中的特徵和重點。


    不管是哪種策略或手法，要妥善操作與進行交易都有共通之處。儘管這些都是理所當然的事，但在瞬息萬變的市場中持續交易時，卻經常被忽略，因此本節要解說所有手法共通的交易基本動作。


    # 基本動作 1  確立交易的目的與依據


    釐清自己想透過該筆交易得到什麼，是很重要的事。不管是哪種交易手法，都要先確立交易的目的與依據。只'
  - '[PAGE 50]


    要做到這一點，就能減少不必要的混亂。


    當沖等超短期買賣中，交易目的是靠極短時間產生的價格變動獲利，所以交易時應該觀察或考慮的要素其實非常單純。


    如果是短線等持倉時間稍長的交易，就會出現其他要素。應觀察或考慮的要素會隨時間變長而增加，例如：經濟統計等宏觀事件、財報發表或其他個別企業活動、以圖表為基準的價格變動等。若是要持倉過夜，還要預測歐美市場的動向或事件。


    到了中長期交易，基本面變化造成的影響會增加，必須根據各種因素，判斷股價相對於個股成長性或企業價值，是被高估或低估，再持有部位。這些因素包括經濟成長、宏觀政策、企業成長、科技變化或業界變化等。


    請先確立以下的操作方針：期間是多久、資金規模是多少、哪種交易手法、以多少獲利為目標（能容受多少風險）。如果是股市交易員或基金經理人，前提條件可能會依所屬公司或操作的基金規定而異，也必須遵守。


    實際在市場進行交易時，都要遵守這些前提條件，同時必須確實釐清每一筆交易的目的與依據。如果操作方針失去合理性，或混雜不同的操作方針，可能導致大失敗。


    舉例來說，某次遇到行情暴跌時，我曾聽到一位做當沖的前輩交易員看著一檔股票的價格，不斷地說：「業績這麼好，股價怎麼會下跌？」'
  md: '

    要為限縮金融業規模與自營交易。


    註 5: Dodd-Frank Act，全稱《陶德－法蘭克華爾街改革和消費者保護法》，於 2010 年 7 月 15 日由美國總統歐巴馬簽署，是 1930
    年代以來美國改革力道最大、影響最深遠的金融監管改革。該法案旨在透過改善金融體系的問責制和透明度，以促進美國金融穩定，解決「大而不倒」的問題，保護納稅人與消費者的利益。


    ## 1-2 市場的參與者


    主要分三類


    在操作自由度方面，散戶是第一名。但一般散戶的資金不多，雖然能不受束縛自由投資，資金面上能做的事情卻有限。想持續累積獲利，就必須有嚴以律己的自我管理能力。


    在日本，有人說資產的「運用」就是「把運氣拿來用」，說到資產運用者（操盤手）有許多類型。當然，我們這些運用公司資金的交易員，也是操盤手的一種。


    操盤手可概分成三種類型：


    - 基金經理人

    - 交易員

    - 散戶


    基金經理人是指受投資人委託來操作基金的人，例如避險基金或投資信託等。


    避險基金或信託基金的投資經理人，會向投資家集資當作本金來操作。舉例來說，投資信託是透過銀行或證券公司等金融機構，向許多散戶集資並設立基金，分散投資全世界的股市、債券、不動產或原材料商品等。


    不過，這類運用基金的經理人必須提供客戶公開說明書，並依照其中寫的操作方針操作資金，絕對不允許偏離方針。


    當然，基金經理人的操作自由度會隨公開說明書的內容而異，但不管是避險基金還是投資信託，基本上都不是自有資本，而是運用他人的資金，所以基金經理人無法隨心所欲地買賣，必須嚴格遵守事前向投資人提出的投資方針。


    **基金管理業務的操作自由度非常狹隘，但因為資金是向不特定的多數投資人集資，所以單一運用資產的規模會非常大，這也是優勢。** 當然，如果操作成績良好，新資金會不斷湧入，可運用資產規模便日益增加。如此一來，就能投資許多不同個股與資產類別，建構分散的投資組合。運用自由度低，但可操作龐大的資金，可說是基金經理人在操作上有趣的地方。


    另一方面，散戶又是如何呢？說到操作自由度，沒有人能贏過散戶。他們運用自己的資金，所以能自由決定要投資什麼。日本有句話說「休息也是市場」，散戶不想持倉時，也不會被主管罵。**在操作自由度方面，散戶是第一名。**


    相對地，散戶的弱點是操作資產的規模很小。當然也有極少數的散戶能操作 10 億、20 億日圓規模的資金，但大多數一般散戶的資金並不多，雖然能不受束縛自由投資，但資金面能做的事情卻有限。


    而且，自由度高是兩面刃，因為沒人監督，在風險管理方面容易變得比較隨便，常見的情況是：好不容易賺到獲利，但一轉眼就賠光了。所以，散戶想持續累積獲利，就必須有嚴以律己的自我管理能力。


    再說到交易員，給人的感覺應該介於基金管理人和散戶之間。交易員可操作的資金額度，依所屬的金融機構而異。如果是資本雄厚或資金週轉能力強大的金融機構，便能運用龐大的資金，但如果所屬的金融機構並非如此，手頭資金肯定較少。此外，雖然交易員在操作上有相當大的程度是仰賴個人判斷，但必須遵守公司訂定的操作規則。


    相較於避險基金和投資信託的基金經理人，過去交易員的限制比較鬆散，但近年來交易員的操作自由度逐年限縮，有些金融機構的限制甚至比基金經理人還要嚴苛。總之，請大家先記住：本書介紹的交易員，在資金操作上介於基金經理人和散戶之間。


    ## 1-3 交易員都是靠當沖賺錢嗎？


    以當沖為中心的超短期買賣，不過是以前的交易員會運用的手法之一。當沖開始成為許多交易員的主力運用手法，與證券公司的雇用制度改變有關。


    大家對交易員這個職業抱持著什麼印象呢？恐怕有很多人認為：「會短時間反覆進出場買賣股票，是非常投機且不穩定的工作」。散戶當中有一部分的投資人也是炒超短線，以分鐘為單位進出場，大概有很多人覺得他們和交易員一樣吧。


    不管做多做空，持有的部位都會在當天平倉確認損益，不會保留到下一個營業日，這種交易手法稱為「當日沖銷（當沖）」。原本並非交易員擅長使用的方法，大約在 2000
    年後，才開始極端偏向這種交易法。


    原本交易員使用的交易手法更多樣，然而隨著公司提高操作限制，加上靠當沖獲利對交易員也相對輕鬆，於是許多交易員逐漸集中火力在當沖上。曾幾何時，當沖成了交易員的代名詞。


    1990 年代我還是新手時，日本股市尚未脫離泡沫化的影響，日經平均指數（以下簡稱日經 225）找不到上漲的契機，因此持續低迷。


    雖然處在這樣的時期，我第一家任職的證券公司中，交易部門的交易員前輩們真的是用盡各種手法，每天和股市奮戰。


    舉例來說，有一種手法叫「套利」，他們會比較日經 225 這類由現股構成的股票指數，和與其連動的期貨價格，當現股的價格在理論上被低估時，就整筆買進該指數構成的現股，並平倉期貨（賣期貨買現股）。相反地，當現股理論上被高估時，就平倉現股並買進期貨（賣現股買期貨）。


    有些人的交易是用個股搭配可轉換公司債（CB），或附認股權公司債。有人採用多空策略（賣出被高估的股票並買進被低估的股票），也有人選擇「搭配複數選擇權交易做策略投資」的方式，還有人如前述，以當沖為中心專做超短期買賣。


    以當沖為中心的超短期買賣，不過是以前的交易員會運用的手法之一。當沖開始成為許多交易員的主要運用手法，與證券公司的雇用制度改變有關。


    過去幾乎沒有成功報酬制，就算賺 10 億日圓，頂多只是獎金變多或是獲得表揚。以前交易員大多都是隸屬證券公司的正職員工，理所當然地要負責教育和指導新人，所以交易員之間具有前輩和後進、主管和部屬的關係。


    到了 2000 年後，交易員逐漸轉為契約制，理由在於成功報酬的暴漲。一般來說，歐美的避險基金會支付獲利的 20％給操盤手作為成功報酬，相較之下，當時日本交易員的報酬顯得相當低，導致不滿聲浪高漲。許多證券公司為了解決這個問題，引進成功報酬制。


    但這又讓其他業務的正職感到不滿，覺得「為什麼獨厚交易員」。為了讓成功報酬制正當化，於是逐漸轉為契約制，理由是「有一年一約的雇用作風險，所以高成功報酬很正常」。


    在推動契約制後，交易員被解雇的風險提高，因此逐漸專注在自己的獲利上，不再栽培後進或部屬，公司也把契約交易員視為食客。


    大多數的證券公司認為，即使承擔費用和風險培育人才，等他們會賺錢之後，就會被其他條件更好的公司挖角，於是不再培育年輕人才。結果導致必需的知識和經驗不再傳承，多數交易員無法從前輩身上，學到需要大量學習、研究和技术知識的複雜交易手法，因此將心力傾注在手法單純的當沖上。


    此外，待遇的差距加深管理部門和交易員之間的鴻溝，管理方和交易員都逐漸偏向做法比較輕鬆的當沖。不知不覺間，當沖成為股市交易員的代名詞。


    目前，又逐漸產生轉變，東京證券交易所在 2010 年啟用新一代的箭頭交易系統，可以用毫秒（千分之一秒）為單位高速成交，大幅縮短下單到成交的時間。


    在歐美具壓倒性交易比重的 HFT（High Frequency Trading，中文稱為「高頻率交易」）以此為契機，大舉進入日本股市。這種交易方式是在毫秒單位以下的極短時間內，使用電腦系統進行各種交易，以賺取小額的利差。


    **日本引進 HFT 後，直接衝擊到專注於當沖的交易員。** 委託單資訊的變動方式產生根本性的改變，導致交易員無法參考委託單資訊來判斷交易狀況，或是因為委託單的變動速度過快，使下單無法趕上變動速度等狀況。各公司的交易部門相繼縮小規模、撤退或關閉，令交易員的人數大幅減少。


    ## 1-4 交易員的操作手法，大致有四種


    如果所有人都採取超短期買賣，就很容易持有類似的部位，分散交易手法可讓各交易員的持有部位產生差異，對公司整體來說，算是一種避險方案。


    我現在隸屬於山和證券，總公司位於東京的日本橋兜町，是一家經營規模較小的地方證券公司，無法和大型證券公司相比，但在交易領域上，我們的實績在業界堪稱頂尖。


    截至 2017 年 12 月，本公司交易部有 48 名交易員。2015 年 4 月成立大阪交易室，2016 年 4 月也開始啟用新加坡交易室。


    山和證券交易部的特徵是推動交易手法多樣化。如前所述，日本的交易員從 2005 年開始，因為成功報酬制普及，主要的獲利手法變成當沖。但 2010 年 1 月東京證交所引進箭頭系統後，HFT
    大舉來襲，過去靠解讀委託單做當沖獲利的交易員，要勝出變得極為困難。為了對應時代潮流，山和證券領先業界，推動多樣化的交易手法。


    我認為以下的內容也能讓散戶當作參考，因為現在在散戶身處的投資環境，與職業交易員沒有太大的差異。


    應該有許多散戶抱持著這樣的煩惱：「解讀委託單太困難，短期交易賺不到什麼錢。」既然如此，就別再拘泥於當沖，應該嘗試其他的交易手法。


    附帶一提，山和證券內部當然有靠當沖獲利的交易員，但也有許多善用各種交易手法在市場奮戰的交易員，主要的交易手法如下：


    ### ① 超短期買賣（當沖）


    這種手法也稱為搶帽子。持倉不過夜，當日平倉了結。這是一種靠極短期的股價變動來獲利的投資手法，目前採用這種方式的交易員依舊占大宗。


    ### ② 短線交易


    這種交易法會持倉過夜，但不是長期持有部位，而是從數日之內的股價變動獲利。這也是交易員愛用的交易手法。


    ### ③ 中長期投資


    中長期投資不像當沖或短線是靠股價的變動獲利，而是把重點放在分析企業的基本面，以中長期賺取高報酬的交易手法，比較接近投資信託的基金經理人。


    此外，還有一種方法稱為「多空策略」，是搭配被高估的空頭部位和被低估的多頭部位，持有較長時間並從中獲利的操作手法，以時間軸來看也屬於中長期。


    ### ④ 衍生性金融商品


    英文是 Financial Derivatives，有不同的操作時間軸，期貨交易或選擇權交易就屬於這一類。包括利用期貨或選擇權的超短期買賣和各種套利，以及基於策略進行的部位交易等，涵蓋的交易手法可說是包羅萬象。


    衍生性金融商品交易相當複雜，光是要講解基礎知識便能寫成一本書，不過本書的目的不在於此，所以第 6 章僅針對其特性、歷史與一般知識進行解說。


    正如上述，交易具有各種不同的類型，大家會選擇適合自己的手法進行交易。乍看之下相當分散、沒有統一感，但這對公司整體來說也算是一種避險方案。


    如果所有人都採取超短期買賣，容易持有類似的部位，若是交易手法分散，可讓各交易員的持有部位產生差異。從結果來看，有些時候能藉此度過嚴峻的局面，例如：在當沖無法獲利的局面，靠中長期的多空策略依舊能確保獲利，整體不會產生太大的損失。


    ### Column

    **「不准賠錢」這句話會壓垮交易員**


    我目前職稱是交易部經理，負責做整體的管理，已經不需進場操作並持有部位。


    其實在業界中，從交易員爬上來的交易部經理相當少見，因此我時常在想：管理層當中，到底有多少人確實理解「為了操作股票獲利，應該容許多少風險」？


    在 2010 年以前，我還是一名交易員時，業界可容許的風險相當高。我曾經單月最高損失 6486 萬日圓，當時公司給我的單月虧損上限是 7000 萬日圓。然而，現在已很少看見交易員能被允許如此高的風險。


    的確，公司能夠容許的風險必須考量各種要素，例如：公司的經營狀況、資本力、資本適足率、獲利能力等。儘管操作股票必須獲利，卻有交易部經理毫不在乎地要求交易員不准賠錢，這實在毫無道理。但讓人驚訝的是，我看過好幾個這樣的交易部經理。


    **交易員的工作，是在被容許的風險範圍內和市場搏鬥，創造出高於風險的獲利。** 在我單月損失 6486 萬日圓的時期，單月最高獲利可以超過 2 億日圓。當時公司正是理解到這一點，才會在後面支持我，讓我成長茁壯。


    要擊潰交易員不用拿刀子，只要一句「不準賠錢」，就能扼殺交易員的可能性。在判定「股票交易賺不了錢」，並責備交易員之前，應該仔細思考是否有依照交易員的能力或實績，賦予他們適當的風險額度。


