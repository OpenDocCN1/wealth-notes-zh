    # 推薦序二


    # 想在股市長期致勝，你需要的是……


    知名理財書作家、嘉實資訊專業講師 艾致富


    在接到出版社邀請，為《我在股海賺二億》撰寫推薦序時，我毫不猶豫，立馬同意了。


    過去一年之中，連同此本著作，我已經為三本日本投資大師的書籍撰寫專文推薦，這是因為我發現日本的股票投資書籍，無論是淺顯到專為股市新手而寫，或是針對已有豐富股市經驗的投資人，提供更專業、更多元化的股市投資領域知識，其共同特色就是**非常強調投資人在投入股市時，要先釐清每一種投資方式應懷的觀念**，這也是我在**教學時最強調的重點**。


    至於投資方式，雖然也是每本書中作者想要傳達給讀者重點，但重要性卻遠遠不如基礎觀念。在我閱讀過由日本傳奇交易員工藤哲哉所寫的這本著作後，我只能以「非常驚訝」這四個字，來表達對本書及作者的敬意。


    一直以來，自營交易員應該是許多散戶投資人非常好


    13'
  - '[PAGE 13]


    奇、很想瞭解的一項職業。這群操盤手的職務內容是用券商的自有資金，幫助券商創造獲利，投資人對於他們的每日工作內容、時間安排與投資方式，雖然好奇卻又難以窺視，本書作者竟願意將自身經驗與大眾分享，這是第一個讓我感到驚訝的地方。


    第二個驚訝之處在於，本書的內容雖然是把作者二十年來的每日工作內容，經過有系統的濃縮整理後，再分享給讀者，背後卻隱含深遠的意義。


    **這些每天不斷反覆的動作，正是投資人要在股市中長期致勝，必須具備的觀念與習慣。**作者願意如此鉅細靡遺地把它們整理出來，讓讀者參考學習，我必須說作者創作此書的動機中，想要傳承的意願肯定遠大於其他一切利益。有幸閱讀此書的讀者，實在應該感謝作者毫不保留地分享給大家。


    **我很榮幸能向大家推薦此書，其中除了讓讀者一窺自營交易員的工作內容之外，還濃縮了作者二十年來對於各項投資手法，包括超短期、短線、中長期投資等的經驗與智慧，幫一般投資人大幅縮短在股市中摸索所需的時間。**更重要的是，許多寶貴的經驗並非人人都有機會接觸或學習，作者儘管身在日本，但所寫的內容也適用於台灣的投資市場。


    看完本書內容後，我深刻地體會到，作者恨不得在本書中，一次把他所有的經驗都分享給讀者，所以對於一般'
  - '[PAGE 14]


    讀者而言，部分內容或許過於深奧。但我仍然期盼所有讀者都能花點心思，用心閱讀、思考、融會貫通，才不會辜負作者的用心良苦。'
