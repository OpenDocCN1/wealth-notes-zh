    ## 6-3 簡單介紹三種套利交易


    交易標的和其衍生商品所組合的多空交易手法，目的是看準理論價格與市場價格的乖離，藉此從中獲利。只要能用好的價差建倉，幾乎不會產生風險。


    一般說到「套利交易」是指靠期貨和交易標的的價差獲利，也就是賣掉被高估的期貨，買進被低估的一籃子現股（賣期買現）、買進被低估的期貨，賣掉被高估的一籃子現股（買期賣現）。


    「未平倉餘額」是指套利交易所建的現股部位餘額。交易標的和其衍生商品所組合的多空交易手法，是看準理論價格與市場價格的乖離，藉此從中獲利。只要能用好的價差建倉，幾乎不會產生風險。


    1990 年代，各證券公司都在做套利交易。不只是外資證券和大型證券商，連中小證券的交易部門也相當積極。當時交易速度很慢，因此有時交易標的和期貨的價差相當大，讓中小證券也有十足的獲利機會。


    但隨著時代演變，這樣的機會將逐漸消失。交易速度越來越快，透過系統與程式監控的自動下單增加，讓交易系統產業隨之誕生。如此一來，資本雄厚、能大筆投資設備的外資、大型證券和銀行類證券獲得壓倒性優勢，現在中小證券已經不再進行這種交易。


    此外，交易標的和期貨的價差也縮小，變得沒什麼甜頭，所以套利交易的目的也逐漸改變。外資證券和大型證券會進行「主要經紀業務」，把股票借給避險基金等客戶。


    基本上，這項業務是向機構投資人或大股東借股，然後再轉借給別人。實際做法是透過自營的套利交易來限定風險，在公司內大量持有「一籃子現股」並外借，藉此賺取借券費。


    這種交易的前提，是要具備資本力或極低的資金調度成本。不過，這類交易的規模會達到數兆日圓，所以必須注意其動向。


    此外，還有各種「套利交易（避險交易）」，主要有以下幾種：


    ### ① 跨市場套利


    相同交易標的在不同市場上市，當出現價差時，賣出價高者買進便宜者的一種交易。具代表性的有日經 225 的大阪交易所、新加坡交易所（SGX）和芝加哥商品交易所（CME）之間進行的跨市場套利。


    此外，在東京證券交易所上市的 ETF 和東京金融交易所上市的 CFD（Click Kabu 365），都是以日經 225 為交易標的的商品，也是套利的對象。


    ### ② 配對交易


    這是在不同交易標的的衍生性金融商品間，進行買賣的套利。


    最具代表的是前面曾提過，搭配日經 225 指數期貨和 TOPIX 期貨的 NT 倍率交易。也有人在交易時，會搭配日本國內的其他股價指數期貨、海外股價指數期貨或商品期貨等。


    ### ③ 期貨與選擇權套利


    在日本，具充分流動性的選擇權市場，只有日經平均指數（日經 225），所以通常是以日經 225 期貨指數搭配選擇權做套利。


    選擇權可搭配稱為「合成期貨」的買權和賣權，組成實質的期貨，藉由期貨和選擇權市場之間的乖離來套利。


    充分了解期貨或類似商品的價格，便能進行這樣的交易。但是，當前已經高速化的市場若沒有系統輔助，很難靠價差套利。從這方面來看，配對交易需要一定程度的市場觀點，交易員或散戶以此套利或許比較實際。


    ## 6-4 為何有人說：選擇權賣方很危險？


    在確實理解的前提下，選擇權是自由度極高的商品，無論市場是漲、是跌，還是停滯不動，只要照自己的預測走就能獲利。


    我第一份交易員的工作就是選擇權交易員。為了做選擇權交易，我做過許多功課，甚至學習程式語言。在做選擇權交易的期間，曾經歷阪神大地震和霸菱銀行事件。之後也做過個股、期貨的短期交易、多空策略、技術分析等各種交易。


    因為有這些經驗，我能清楚告訴大家：沒有比選擇權更能自由呈現自己市場觀點的商品。


    為什麼如此有魅力的商品，在日本市場卻不熱絡？這是因為過去出現鉅額損失的案例屢見不鮮，所以許多不想理解選擇權的市場關係者，才會亂貼「選擇權很危險」的標籤。


    本節將講解造成這種結果的來龍去脈，說明問題的癥結，同時仔細分析選擇權交易。


    **圖表 6-2 選擇權交易的鉅額損失案例**


    | 時間 | 案例說明 |

    | :--- | :--- |

    | 1990 年～ 2000 年 | K 證券在日經 225 選擇權賣方的買賣持有量都在前幾名，每個交割月份都有大量的賣方部位。結果市場出現劇烈變動時蒙受鉅額損失，交易部門被迫關閉，甚至要向關係企業的銀行私募新股來救濟。
    |

    | 1995 年 | 英國歷史悠久的霸菱銀行，僅因為一名交易員導致破產。雖然眾所周知，是因為他在 SIMEX (現 SGX、新加坡交易所) 持有大量的日經
    225 指數期貨多頭部位，但一切都是始於選擇權的賣方部位。 |

    | 2000 年～ 2010 年 | T 證券建立大量的極價外賣方部位，後來市場進入強勁的上升趨勢，因此產生鉅額損失，導致交易所變更保證金制度。 |

    | 2011 年 | 日本 311 大地震和後續的核災使得股市大跌，導致建立極價外賣方部位的散戶產生鉅額損失，陷入無法償還債務的狀態。各家網路券商也不得不認列損失，甚至有公司被迫退場。
    |


    選擇權交易過去出現鉅額損失的案例如圖表 6-2 所示。這些案例的共通點是做「選擇權賣方」。


    從此之後選擇權賣方就被貼上危險的標籤，於是各家證券公司開始對選擇權賣方加上不合理的限制，導致選擇權逐漸失去妥善管理的交易環境，因此成為交易量無法成長的最大原因。


    選擇權賣方真的很危險嗎？絕沒有這回事。有危險是因為沒有正確判斷選擇權賣方的風險，就隨便開大量的部位，這麼做是輕視「Gamma 風險」。


    圖表 6-3 介紹評估選擇權的重要術語，請參考並閱讀以下的說明。這些用以表示選擇權風險參數的用語也被稱為 Greeks（希臘字母），因為給人數學的感覺，所以容易覺得困難。但這裡不用學到能懂該算式（模型）或算數細節的程度，只需大致理解即可。有些入門書籍會淺顯易懂地解說，也有網頁會提供模擬器等。


    前面列出過去的鉅額損失，都有某種共通的想法：「如果是履約價較遠的選擇權，即使當賣方，風險也會比較小（不至於大跌或大漲到履約價）」或「同時賣出買權和賣權，就不會有方向性的風險」。


    但這種想法有很大的陷阱。履約價較遠的選擇權稱為「極價外」，由於日經 225 到履約價的可能性很低，所以權利金非常便宜。


    選擇權賣方的獲利有限，最多只能賺回權利金，因此期待獲利較少。於是，投資人想賣多一點口數，又因為認為履約價還很遠，便賣出一堆買賣權，或是誤認為同時賣出買權和賣權風險會比較低。這正是外行人的想法。


    如果同時賣出買權和賣權，確實該時點的 Delta 值會非常小，乍看之下沒有方向性的風險，但此時的 Gamma 值會變得非常高。


    **圖表 6-3 評估選擇權的重要術語**


    | 術語 | 說明 |

    | :--- | :--- |

    | **買權** | 買的權利。假設是履約價 25000 日圓的日經 225 買權，就表示有權用 25000 日圓購買日經 225 。 |

    | **賣權** | 賣的權利。假設是履約價 25000 日圓的日經 225 賣權，就表示有權用 25000 日圓出售日經 225 。 |

    | **SQ**<br>(Special Quotation) | 指數特別報價。SQ 日是指計算 SQ 的日子，日經 225 選擇權從 2015 年開始引進一週到期選擇權，所以每週五會計算
    SQ 。 |

    | **權利金** | 選擇權的價格。 |

    | **隱含波動率（IV）** | 從市場上的選擇權價格（權利金）計算出的預測波動率。 |

    | **歷史波動率（HV）** | 由交易標的過去的價格變化，計算出的預測波動率。 |

    | **Delta 值** | 交易標的變動 1 單位時，選擇權價格的變動率。Delta 值為 1 時，價格的變動等同於交易標的，也就是和期貨（如果是日經
    225，則為大阪日經 225 指數期貨）一樣。 |

    | **Vega 值** | IV 變動 1% 時，選擇權價格的變化。 |

    | **Gamma 值** | 交易標的變動 1 單位時，Delta 值的變化。 |

    | **Theta 值** | 買進後，時間會經過 1 天，選擇權會跌價的幅度。 |

    | **Rho 值** | 對利率的敏感度。除非持有大量的選擇權或交割月份非常久的選擇權，否則可略不計。 |


    ### 外行人想法欠缺的是「日經 225 可能會到履約價」的慎重心態。


    駕訓班會告訴學生開車不能抱持「應該吧」的想法，而是要做好「可能會」的心理準備，股市也一樣。


    個股和期貨可輕鬆計算花了多少金額買進，如果跌到多少就會出現多少損失。選擇權雖然比較難計算進出場價，但既然有風險參數，就應該能試算出日經 225 跌到多少時，該選擇權的權利金會變多少。


    不管有多少種選擇權的組合，還是要一一試算。確實做好這類模擬，就能防止自己像過去產生鉅額損失的案例一樣冒險。


    在我還是菜鳥選擇權交易員時，做的是持有選擇權賣方部位的交易的交易，是稱為「賣波動性、負 Gamma」的部位。眾所周知，這種策略 10 次能贏 9 次，但只要輸
    1 次損失就會超出前 9 次獲利。


    當時曾發生阪神大地震和霸菱銀行事件，如果不採取對策便會出現一定的損失，但結算時，我都能成功沖銷部位，並以獲利告終。


    當時我每天早上都會做選擇權的模擬計算，以建立避險方案，例如：日經 225 跌到哪裡，就賣期貨避險；漲到哪裡時，賣權的權利金大概會變多少，再買回並用預測的履約價賣掉。


    如此一來，因為已經能想像日經 225 跌到某價位時，部位會變得如何，所以不會動搖和焦躁，只要以平常心控制部位，照著事先訂立的方案執行即可。


    選擇權的確是很困難的商品，必須確實讀懂使用說明書。然而，選擇權並不危險，危險的是「未確實理解選擇權就冒險的行為」。若能確實理解，選擇權是自由度極高的商品，無論市場是漲、是跌，還是停滯不動，只要照自己的預測走就能獲利。


    遺憾的是，現在只有極少數的證券公司，可在一定程度的自由環境下操作選擇權。你或許會覺得，學會也無用武之地，但日本業界已開始出現一些動向，旨在讓更多人理解選擇權的魅力。如果你有興趣，請試著深入研究看看。


