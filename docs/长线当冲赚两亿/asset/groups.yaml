    格變動獲利，所以分析和判斷時，不要著眼於盤中的價格變動，而應該在收盤後冷靜分析。假如經過分析後依舊無法理解原因，只要在下一個營業日執行停損，或是採取降低風險對策等應對措施即可。


    不要過於拘泥每日的價格起伏，除非出現極端的股價變動，否則應根據平日的分析逐一對應才是上策。'
