    ## 短線交易該如何避免「早知道」的懊悔？


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_108_1.png)


    ### 4-1 短線交易時，除了留意海外市場，還有……


    不僅要掌握國內消息，也要包含海外一定期間的經濟統計或事件等，調查市場共識，並確實做出自己的預測。


    當沖等超短期買賣的目的，在於從短時間內的價格變動中獲利。這也是擁有更高速交易環境的 HFT 所擅長的領域。


    HFT 基本上適合做當沖，傾向單純的交易，較不容許過夜風險與不確定性。相較之下，短線交易這類時間軸較長的交易日，事先必須確認的因素較多，交易也會變得更複雜，但好處是可在不同的舞台獲利，不用和擅長
    HFT 等高速交易的市場參與者競爭。


    換句話說，從事短線交易，在預測時必須考慮市場的流動、股價水準的含意，以及各種題材。


    短線交易在①收集資訊→②分析→③判斷的各個流程中，和超短期買賣不太一樣。具體來說，該做好哪些準備？以下我整理以前的日常工作。


    #### ① 資料的收集與分析要更縝密


    交易的時間軸越長，必須確認的事當然會增加，舉例來說，當沖比較不需要注意歐美市場的動向，而短線交易的持倉會延伸到歐美市場交易的時間帶，所以必須預測其動向。此外，匯率和利率等股市以外的市場動向，也必須觀察得比當沖更深入。


    重點在於，不僅要掌握國內消息，也要包含海外一定期間的經濟統計或事件等，調查市場共識，並確實做出自己的預測。


    股市的供需分析也會比當沖更重要。由於任何人都能輕易從網路上下載供需數據，包括各類投資人（散戶、法人、國外投資人等）的買賣動向、未平倉餘額、保證金交易的未平倉合約等，所以要時常注意這些數字。基本面則要掌握財報發表等時間表，並調查市場共識。


    這些都是非常基礎的資訊，事前確實收集與分析，在做短線交易時極為重要。


    此外，我認為技術分析在短線交易也非常有幫助，但觀察的圖表時間軸不太一樣。當沖會用 5 分 K 線或 10 分 K 線，短線交易則用日 K 線等較長的時間軸做判斷。使用圖表時，最重要的是時間軸要符合自己想執行的交易。如果兩者不合，進場的時間點等就會有差距。


    如前所述，當沖不需注意的部分，在短線交易中則因為持倉時間拉長、風險增加，而必須事前確認。可能有人覺得這樣很麻煩，不過確實收集資訊並做好分析流程，便能預測市場的動向、提高勝率。


    #### [2] 掌握各類投資人的行動模式


    以不容易受利多利空或指數動向影響的個股為中心進行交易時，較不需要在意歐美市場的動向或其他市況。我在交易這種個股時，也會同時在股價指數期貨建很大的部位（承擔較大風險），所以相當重視市場整體的動向預測。


    此外，從 2000 年開始，由於外資在日本股市的交易比重和持有比率提升，有時會出現以下狀況：日經 225 在幾週內大漲 1500 點，但都是晚上在漲，日本的交易時間內股價幾乎沒有變化。當時我注意到這個現象後，開始更詳細預測海外市場的動向，並思考收盤時該如何建倉。


    這邊稍微整理一下，當時各類投資人具體來說會有什麼樣的動靜。當時日本股市有句話說：「外資進場，股價就會上漲」，每當外資進場就會出現漲勢，出場則呈現跌勢。觀察外資以外的投資人，會發現年金通常在股價上漲時賣出，下跌時買進，散戶也常使用這種反向投資法。


    基本上，年金投資組合的構成比例須遵守一定的範圍，股價上漲後在股票投資組合的占比會變高，因此必須賣掉以進行調整。


    假設年金的日本股投資比重是 30%。股價上漲後投資比重變成 40%，該投資組合在日本股的暴險便會增加，所以多出的 10% 會被賣掉，將比重降回 30%，同時再用賣出的獲利買進其他貶值的投資部位，以調節整體的比重，稱為「再平衡」。


    年金和散戶基本上會在日本交易時間操作。股價晚上漲完，年金和散戶會在白天賣出，所以在日本交易時間中，股市上漲會趨緩。


    在這種情況下，日本的主要市場東京證交所收盤後，賣壓會消失，加上收盤後才是外資牽引股價上漲的時間帶，因此日本股價在晚上會比白天更容易上漲。


    股價變動一定有其原因。重點在於理解原因，並持續調整自己的交易與觀察重點。過去我頻繁進行短線交易的時期有許多外資進場，他們的動向常影響日本股價。所以我格外重視歐美市場的動向預測。


    此外，我在調整持倉過夜的倉位時，也會注意在日本時間晚上開市的歐美市場。若覺得歐美市場可能會大幅上漲，就積極持有多頭部位；對預測不太有信心時，則挑選指數敏感度低、對個別利多利空有自信的个股，降低整體部位的風險。


    #### ③ 在前一天收盤後判斷，並於盤中調整


    在①收集資訊→②分析→③判斷的流程中，短線交易在①和②花費的工夫會比當沖多。舉例來說，除了要弄清清楚想投資的企業狀況，還必須估算該個股的價值（被低估或是高估）、整理圖表和收集利多利空消息、分析及預測歐美市場、匯率、利率和商品市場的動向等。


    短線交易在收集資訊和分析上比當沖花時間，是因為交易的時間軸變長，暴露在風險中的時間和影響風險的要因也會增加。正因如此，才能用不同於 HFT 的觀點進行交易，避免受到
    HFT 的影響。


    **與當沖不同的是，短線交易在收盤後也花時間收集資訊與分析。交易的時間軸越長，我在盤後收集資訊或分析的時間也會增加。**


    應該在哪個時間點進行③判斷呢？我在收盤後進行分析時，會先擬定隔天交易的劇本，包括目標個股的建倉價位、目標價位或停損點等。隔天便依照劇本下限價單。建倉時，也要留意不被盤中的價格變動過度影響。


    **這裡必須強烈注意一點：不要太沉迷於盤中的行情或股價變動。**換句話說，必須和市場保持一定的距離感。有時在交易中會不自覺太過沉迷，容易在多餘的地方出手，或在錯誤的時機平仓。有些交易員會同時做短線和超短期買賣，這種情況下容易錯亂。千萬不要忘記自己是以什麼依據在交易。


    但是，當交易的前提條件（即市場整體狀況或劇本）有應變更的要因時，我會在盤中調整。市場的變動幾乎不可能照自己的預測走，因此③判斷最好在前一天收盤後進行，並於盤中調整。不過，要小心別過度沉迷於行情，以免失去客觀性而錯失調整時機。


    ## 4-2 開盤時，我為何都事先下好限價單？


    盤中出現利多利空、異於事前劇本的動向或其他主題時，當然必須臨機應變。為了讓自己有餘力對應這些狀況，應事前擬定劇本，在開盤時下好限價單。


    關於進場的部分，前一章提到當沖的進場點可用技術分析來推估，短線交易也一樣，技術分析是有效判斷進場點的方式之一。


    我在做當沖時，會用移動平均線和 MACD 估算時機。進行短線交易時，除了上述兩種方法外，有段時期還會用 RSI 和拋物線指標。使用技術分析的好處，是可以簡單而有系統地找出進場的依據。


    其實那段時期，我曾嘗試用程式計算有一定流動性的個股，從中抽出符合自身技術分析條件的幾檔個股，盡可能分散建倉。當時使用的技術指標，是以過去幾年的數據為基礎，徹底進行回測，判斷出能維持一定勝率的標的。除非符合條件的個股有應該排除的理由，否則便依照分析分散個股建倉。


    使用技術分析時不要盲信教科書上的內容，應該自己做回測，仔細確認可用性或缺點，才能增加訊號的可信度。


    此外，確實分散投資的個股也很重要。沒有 100%準確的訊號，機率再高的訊號也會有不準的時候。賭機率時應該確實分散投資，比任何事情都重要。


    建倉前要先確認日 K 線，針對想交易的個股，事先想好進場價格、目標價位和停損點的劇本。在前一天收盤後，冷靜思考並仔細打好上述基礎的人，跟在盤中隨市場變動而匆忙分析的人，兩者判斷的精確度會有很大差異，這點在當沖也一樣。


    當然，盤中如果出現利多利空或突發性的變動，也必須要快速做出判斷，但進場時的劇本，建議盡量在前一天先擬好。


    依照事前擬定的劇本，在隔天開盤後陸續建倉。基本上，我會事先在決定建倉的價位下好限價單。因為在盤中看盤下單，容易在沒必要的地方建倉，導致交易過於匆忙，可能會讓事前準備變得毫無意義。


    盤中出現利多利空、異於事前劇本的動向或其他主題時，當然必須臨機應變。為了讓自己有餘力對應這些狀況，應事前擬好劇本，並在開盤時下好限價單，在盤中下單應該只限於發生異常狀況時。具體該用何種方法進場，會在本章第
    4 節進行解說。


    ## Column 股市交易員的交易系統


    「交易員用什麼系統做交易？」如果你是散戶，應該會對這個問題感興趣。


    雖然以前有好幾家中小型的系統公司，但目前大多以 Intertrade 和 TCS（東證電腦系統）兩家公司為主。這兩種交易系統在發展上，主要迎合以當沖等超短期買賣為主流的交易員，所以其交易速度和穩定性的水準相當高，且倉位管理功能也相當優異。


    證券公司的交易部門必須即時管理風險和倉位，為了控管錯單或有法規問題的交易，必須具備高水準的管理功能。雖然多數交易會在下單時確認，但依舊能維持交易員要求的交易速度，從這點來看可說是相當好的系統。


    此外，還有幾個外商系統公司，例如：Trading Technologies 的 EMSX、Bloomberg（彭博有限合夥公司）的 TORA 等。這些是海外的避險基金等經常使用的系統，而日本有些交易部門也會用來交易海外商品。這些系統都支援
    API（應用程式介面），大多能撰寫程式並自動進行交易。


    這些系統有各自的特徵和優缺點。當自家公司交易員運用的手法或交易商品越多，選擇也會越困難。


    交易員能選擇自己喜歡的系統嗎？基本上相當困難，因為交易員往往多達數十人，如果使用個別的系統，統整和管理上將非常困難。所以，各公司大多會從前面介紹的兩個系統中擇一使用，只有部分經手特殊商品的交易員，能獲准使用其他系統。


    我曾經和許多系統公司交流過，不僅使用過各種系統，也經常在開發階段被徵詢意見。不論如何，交易系統是連接市場和交易員的重要工具，它的發展可以讓交易員在市場中更加如魚得水。


    ## 4-3 照劇本事先下好賣單，從此不再懊惱「早知道」！


    如果股價變動是照進場依據和擬定的劇本走，達到目標價位即可停利，但在劇本被推翻的瞬間則應該是停損點。


    短線交易和當沖一樣難在出場，這也是很多人做不好的部分。事後看圖表，馬後砲說：「早知道就在這裡停利」或「早知道就在這裡停損」很簡單，但要在盤中做出適當的判斷卻很困難。


    重點和當沖一樣，要事先決定目標價位和停損點。只要能做到這一點，就能和進場時一樣事先下好賣單。如果股價變動有照進場依據和擬好的劇本走，達到目標價位即可停利，但當劇本被推翻的瞬間則應該是停損點。


    因此，用「損失多少%就停損」或「獲利多少%就停利」，來決定目標價位或停損點，本質上並非正確的做法。因為損失或獲利多少%未必和進場依據有連結，終究只是投資人的主觀判斷。這樣的決定方式最好當作次慢方案，只在無法明確擬定劇本，或不知該如何制訂目標價位或停損點時才使用。


    損點時使用。


    該如何決定目標價位或停損點呢？前面提過，我在操作當沖和短線時，大多會使用技術分析（主要是移動平均線和 MACD）。當交易的期間改變，指標的計算期間或優先順序也會改變。例如：短線等時間較長的交易日
    K 線，當沖則使用 5 分 K 線等。


    此外，以日 K 線為基礎，我還會活用波浪理論等預測趨勢的強弱，讓交易有節奏，思考該用順向還是反向操作、該強勢涉險入場或下單哄抬，還是應該穩健獲利不靠價格變動等，每天都會改變我的立足點。


    波浪理論的詳細介紹在此省略，使用方式如下：當我認為處在推動波（第 1 波、第 3 波、第 5 波）時，基本上當沖和短線都會以順向操作為主，在第 3 波時則會積極增加部位獲利。處於調整波（第
    2 波、第 4 波）時，則是以逆向操作為主。


    上一章已經介紹過當沖用移動平均線進場、MACD 出場的方法，下一節會針對 MACD 的使用方式進行更詳細說明（由於無法假設使用場景，此處的 MACD 會採用一般的計算期間）。


    ## 4-4 使用MACD分析，我如何判斷買賣訊號與騙線？


    當 DIF 線突破 MACD 訊號線時是買進訊號，反之則是賣出訊號。但買賣訊號發生時，重要的是 DIF 線的位置。


    本節解釋的 MACD 用法，與技術分析教科書上的內容有些差異，是我反覆回測驗證過的使用方式。


    首先必須理解 MACD 的特性。MACD 有兩條線，一條叫「DIF 線」，表示兩條 EMA 的差值。以技術指標來說，數值的基礎近似於「移動平均線的乖離」。MACD
    的另一條線稱為「MACD 訊號線」，是用前面計算出的 DIF 值去計算 EMA。


    簡單來說，當 DIF 線（又稱快線）突破 MACD 訊號線（又稱慢線）時是買進訊號，相反的情況則是賣出訊號。


    但買賣訊號發生時，重要的是 DIF 線的位置。移動平均線的乖離概念是算式的基礎，所以 DIF 線接近零軸時（計算依據的 2 條 EMA 彼此接近時），理論上移動平均線和股價幾乎是相同水準（乖離小）。此時出現的買賣訊號大

    '
  mdcn: '

    該會在 MACD 計算期間的移動平均線上（此外，由於很多人會觀察移動平均線，所以用較常用的計算期間往往會比較精準）。重點是，既然「目標價位=移動平均線」，表示該價位也會持續變化。


    MACD 的乖離過大所產生的訊號，以我的經驗法則來看準確度較高。這是因為與 EMA 之間的乖離變大時，一旦漲勢趨緩，便會發出訊號。


    不過，當市場的趨勢相當強勁時，股價的供需調整大多不是靠下跌調整，而是隨時間經過調整。換句話說，股價居高不下後，移動平均線會隨著時間經過，逐漸接近股價（下一章會詳細解說）。這種情況下，即使是同價或未實現損益，當股價接近移動平均線時，就應該賣出清空部位。


    MACD 的要素近似移動平均線和股價的乖離。移動平均線和股價乖離的基本思維，是判斷「乖離過度發散，代表上漲（下跌）已經接近極限或過頭」。MACD 這項指標也近似這樣的思維，但顯示出的訊號更淺顯易懂。


    換句話說，既然交易目的是要在股價出現一定程度的調整（上漲或下跌）時獲利，當調整完畢後，也就是股價觸碰到移動平均線、乖離收斂的時間點，就是平倉的時機。


    附帶一提，這種方式不是靠大方向（趨勢）獲利，而是趁供需調整時反向操作，此時使用移動平均線，是為了找出該供需調整結束的大致時間點。


    那麼，這時停損點又應該設在哪裡？這真的是一道難題。既然有明確的目標價位，停損幅度的最低條件便是必須比獲利幅度小。如果是進場做空，那停損點可能就是前高或其他技術指標顯示的價位。由於這裡解說的交易是逆著趨勢走的反向投資，應該先理解這一點，再畫出必須認賠殺出的停損點。


    以上只是我過去當交易員做當沖常用的方式之一。實際操作時，當然也會用順向投資進場。


    此外，投資新股時由於沒有過去圖表分析，所以不可能靠技術分析來研究。這一類的個股，只能事先確實調查業績或需求面，藉以掌握出場價位。


    重點在於：不管用什麼方法，都應該確立每一筆交易的目的和依據，事先設定目標價位及停損點再進行交易。


    ## 3-8 進場後如果想加碼，你可以……


    攤平是增加風險的行為，應該把它當作有計畫持倉的技巧之一，而不是為了填補虧損或意氣用事下的舉動。


    至今我們已解說過進場和入場，本節將說明進場到出場之間的流程。到出場為止的流程因人而異，這和心理素質直接相關，所以投資人的個性會產生很大的影響，也會依據收益狀況、資金餘力、對交易的自信程度等各種因素而產生變化。以下挑幾個重點來說明。


    ### ① 攤平策略


    首先是關於攤平策略。這是指當股價跌破進場價位時，在覺得股價已經觸底的價位加碼買進，藉此壓低買進的平均成本。當股價止跌反漲時，攤平有機會提早弭平損失，所以大家容易濫用這一招。不過，市場也有一句格言是「隨便攤平，越攤越貧」，對攤平抱著否定看法。


    基本上我不是全面贊成攤平策略，也不會全盤否定。我認為可以有計畫的攤平。


    什麼樣的交易可以被稱為有計畫的攤平？股市交易要「買在最低點，賣在最高點」，是一件比登天還難的事，不要以此為目標才是聰明人。過於在意高低點，容易錯過買賣時機，而且如果之後股價的變化真如預期續漲或續跌，便會產生「錯過好機會」的焦躁情緒。


    從這點來看，某種程度來說必須想開一點。**買進和賣出不要想買在最低點或賣在最高點，只要在附近就好。這是持有或賣出部位時應有的技巧之一，這時有計畫的攤平便可能產生作用**。


    例如當做多時，不知道股價會在哪裡觸底，所以不將手上資金整筆投入，而是分批買進，這就算是有計畫的攤平。本章第 4 節介紹的移動平均線買進法也是一個例子，這樣的攤平方式才足以視為策略。


    有些人認為攤平是愚蠢行為，是因為很多人依據自己的主觀意識或因意氣用事而攤平，例如：因不肯認輸而固執地一路往下買，即使股價已大幅偏離當初的預期，卻還想用更便宜的價格拉低部位的平均單價，再祈禱股價反彈。


    如果事前便決定好目標價位和停損點，照理說不會出現這樣的攤平做法。當你開始做這種事，等於失去當初的交易目的或依據，一心只想著「不想賠錢」而意氣用地交易。將這種行為正當化並美其名為毅力，是一大錯誤。


    即使股價剛好回漲，只能算是市場碰巧救你一把而已，因為情況早就大幅偏離你進場時的預測。


    基本上希望各位記住：攤平是增加風險的行為，應該把它當作有計畫持倉的技巧之一，而不是為了填補虧損或意氣用事的舉動。


    ### ② 金字塔加碼


    另一方面，「金字塔加碼」也和攤平策略一樣，是增加風險的行為，該怎麼看待呢？


    金字塔加碼的前提是已獲得某種程度的未實現獲利，以及股價變化正如自己的預測，所以和攤平策略的狀況有很大差異。話雖如此，金字塔加碼也有應該注意的地方。


    **最重要的是，必須確實分辨「股價距離目標價位還有遠」**。因為金字塔加碼是將獲利最大化的行為，但如果在目標價位附近加碼，風險會大於期待獲利。基本上，要在期待獲利大於追加風險的時機，才可以做金字塔加碼。


    所以，加碼進場前，也要看清楚獲利和風險。不過，由於已有未實現獲利，因此可允許稍微加碼趁勝追擊。另外，像是在極短期間內靠小額價差獲利的交易，最好不做金字塔加碼比較安全。


    ### 3 避險


    再來談論可減少持倉風險的「避險」手法。進行超短期買賣時，原則上不應該考慮避險，如果持有多檔股票並建立投資組合，或是大量買進流動性較低的股票時，若發生突發狀況，有時會用期貨交易或選擇權避險。


    但當沖這類超短期買賣，本來就要避免分散買太多檔個股，所持的股數也不應該影響到流動性。當股價出現意外變動時，該採取的不是避險，而是在第一時間停損，再換一套劇本來對應變化。


    ## 3-9 超短期買賣的重點整理


    目前解說了超短期買賣的重點和其他注意事項，本節先做個整理。


    - 交易目的是從短期間的股價變動中獲利。

    - 在極短時間執行交易流程，必須要有瞬間判斷力、決斷力和心理素質。

    - 事前確實做好準備，考量價格變動的背景或要因等，寫好劇本再進場交易。盡可能不要在盤中思考價格變動的.background或要因。

    - 不能看氣氛交易，要確定交易的目的和依據。

    - 挑選個股時，波動性和流動性比基本面更重要。

    - 為了不被價格變動左右，要有自己的一套方針，例如：靠圖表或技術分析等。

    - 交易的時機和節奏很重要。

    - 盡可能先決定目標價位和停損點再建倉。

    - 攤平要有計畫，嚴禁胡亂攤平。

    - 做金字塔加碼前，要先看清楚目標價位，以及加碼後的風險和獲利。

    - 發生意想不到的價格變動時，應優先停損而非避險。


