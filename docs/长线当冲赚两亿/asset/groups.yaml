    # 想長期在股海生存，該如何做好心理控制？


    ![](img/f7e350af0a20abb47d69331eb02fb5c4_170_1.png)


    ## 交易期間越短，心理控制越難，所以……


    最有效的心理控制法，是在尚未持有部位時，先整理好獲利和風險。如此一來，只要客觀觀察股價變動，同時採取必要的對應即可。


    建倉就等於冒險，而人類在冒險時，心理上會因期待和不安而產生糾葛。大家常說股市是欲望和恐懼的遊戲，這句話一點都沒錯。


    交易時間軸越短，難度越高。這是因為必須在短期間內不斷做出判斷和決策，而無法冷靜觀察市場。短線交易或中長期投資時，比較有時間回顧交易，但超短期買賣則沒有時間上的餘裕，常被迫當下做出判斷和決策。


    因此請記住：交易時間軸越短，越需要具備心理控制的技巧；交易時間軸拉長時，則比較需要具備分析能力。究竟如何應對，才能做到適當的心理控制呢？


    必須做到不被情感受和主觀迷惑，客觀面對市場。最好的方法就是事先確立「會漲多少」，也就是預估獲利和停損點（目標價位），同時思考「最低可能會跌到哪裡」，也就是風險的最大值和停損點。投資人如果能自行事先預測停利和停損點才進場，便能在股價振盪時保持冷靜。


    另一方面，沒有這些劇本、只因感覺會漲就買進的投資人，遇漲會開心，遇跌則感到不安。因此，最有效的心裡控制方法，是在尚未持有部位時，先評估獲利和風險。


    只有在尚未持倉時，最能冷靜客觀地判斷市場。因此在進場前，先思考這檔股票可能會漲到哪裡，以及會跌到哪裡，決定好目標價位和停損點後再建倉。如此一來，只要客觀觀察股價變動，同時採取必要的對應即可。


    如果想 在股市長期存活並不斷取勝，必須能夠感受、面對恐懼，才能察覺危險並努力克服。


    在充滿危險的金融世界中，恐懼的情感顯得非常重要。如果想在股市長期存活並不斷取勝，不知道或不願意面對恐懼絕對不是好事。有些膽小是好事，但如果害怕到不敢出手、裹足不前的程度就太過頭了。正因為知道自己害怕，才能努力克服或拚命研究；能夠感受到恐懼，才能察覺到危險。


    感受不到或無法直視恐懼的人，會做出危險的投機行為。對以投資為職業的操盤手而言，如此冒險的方式絕不會被公司或投資人允許。至於散戶，雖然只需自行承擔虧損的額度，但如果導致必須退出市場，肯定不是出於自己的本意。


    我曾經害怕到雙手發抖或睡不著，還曾懊悔地關在房間裡大吼大叫。有一次，因為損失的金額多到讓我太過難過...

    '
