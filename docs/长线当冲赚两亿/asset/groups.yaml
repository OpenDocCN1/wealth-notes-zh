    # 推薦序一


    # 我有信心與能力賺回一千萬！


    財經暢銷書《空軍一哥教你K線放空法》作者、


    私募基金合夥人 陳韋翰


    回顧 20 世紀的日本，除了令人印象深刻的偶像劇《東京愛情故事》之外，就是 1989 年 12 月底，日經 225 指數創下史上最高價 38957.44 點，2
    個月後台灣加權指數也搭上熱錢列車，創下 12682.41 點新高，這項記錄台日至今都還未能突破。


    但自此日股沈睡許久都無力再創漲勢，直到 2012 年，扭轉 311 大地震與福島核災頹勢之後，才展開一波 3 倍的大漲行情，沈睡巨人終於喚起世人的記憶。


    本書作者工藤先生從事交易二十多年，由交易員一路升職到部門經理，管理近 50 位交易員。操作商品方式包含當沖、短期、中長期、套利等。


    對於每一種操作方式，作者都詳盡說明自己運用的分析方法與投資觀念，舉凡 K 線、均線、MACD 指標、獲利與虧損退場、攤平、金字塔加碼、下單時機、避險等，'
  - '[PAGE 9]


    毫不起眼地分享給讀者，堪稱本書的精華。


    文中提及作者曾經單月虧損 6486 萬日圓的經歷，讓同樣曾身為自營交易員，單日虧損一度高達 1300 萬的我，感觸頗深。**如何從絕境中重新站起，並且建立自信扳回損失，甚至讓獲利翻倍，這種蟄伏的心路歷程與經驗能力的累積，遠比一出手就大賺錢還來得珍貴。**


    我曾經歷過 2000 年、2008 年的股市崩跌，也曾站在加權指數 9859.65 點、11270.18 點的資金浪潮上，很慶幸自己能持續在投資領域中存活並逐步茁壯。


    讀者若是能善用本書中的技巧與觀念，逐步累積投資經驗，便能掌握如何正確而快速地判斷行情，因為股市景氣循環是固定的劇本，只是演員不同，而人性永遠不變。只要能掌握「貪婪」與「恐懼」的轉折點，就能複製股神巴菲特的獲利方程式：平均每年讓本金成長
    20%，10 年翻 10 倍，直到 56 年後成為全球首富。


    對我而言，股市就像宇宙，每天打開電腦程式，就能看到全球變化。投資的過程便是反覆執行指令，這是我們可以掌握的部分，而過程中要承擔多大的風險、可能面臨多大的損失，也是由自己來控制。但結果究竟是賺
    1%、賠 1%、賺 50%、賺 500%……，還是得看老天爺的面子，這正是投資最有樂趣的地方。


    我曾在券商與私募基金任職多年，體會到：**當操盤手能認清自己的渺小，愛上投資的孤獨感，學會享受進場時**'
  - '[PAGE 10]


    的恐懼與投資過程的樂趣，並且瞭解財富是靠逐步累積而成，再加上對自己的無比信念，便能夠進入獲利循環，令財富不斷往上竄升。


    身為一個擁有類似經歷與感動的讀者，我想這應該是作者工藤先生贈送給投資人的珍貴禮物！'
