    # （三）瞄准


    射击的时候，为了使弹头打中目标，就要握起枪，用一只眼睛从缺口对准准星，同时移动枪口的高低和方向，使枪对准目标，保证打出去的弹头能中在目标上。这叫瞄准。


    # 瞄准具有什么用？


    每一支枪上，都有表尺（缺口）和准星，这两个东西都是瞄准用的，所以叫它瞄准具。没有它，就没有办法指挥弹头向指定的方向、地点飞去，那是不容易打中目标的。因此，我们要特别爱护枪的瞄准具。


