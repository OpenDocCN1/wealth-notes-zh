    \ | 攝子鈂損坏或污話太多 | 如有污垢，分解清試；如損坏，送修械所修理；脫困弾壳用通条痛出 |\n| 退彈时彈壳(子彈)不能投出 | 發完彈鎗被彎曲，或發完鎗鉤磨癈有汚垢\
    \ | 用手取出彈壳(子彈) 擦試汚垢，如發完鎗損坏，经修鉏所修理 |\n| 拉枪机向后时枪机潑脫 | 拨机鎗螺絲过紧，拨机阻簧或通架凹槽面整磨損 | 把机机装螺絲上紧，如枪机阻鎗鈂鎗磨損經修械所修理\
    \ |\n\n86\n\n①故障的預防，為了防止射击时发生故障，必须严格遵守分解、结合、擦拭、保管和检查的规则。在严寒的季节里，应当把枪的活动机件（枪机等）涂冬季擦枪油；射击前应当检查弹夹和子弹，有毛病的和有污垢的子弹不可以装入枪内，这种子弹应当先用干布擦淨，再用蘸有少许擦枪油的布擦拭。\n\
    \n②故障的原因及排除方法，见上页表。\n\n#### (二) 三八式步枪：\n\n> “三八式步枪是日本明治三十八年（1905年）制造的，所以叫三八式步枪，过去我国山西和沈阳兵工厂都有仿造，它的口径是6.5毫米，所以又叫六五步枪（图28）。”\n\
    \n![](img/b41346f815189f79888890b5225a828a_42_0.png)\n\n1. 战斗性能。保管和擦拭得好，能经久耐用；瞄标基线长，命中较精确；子弹装药量少，初速也较小，但射击时震动不大；枪管长，射程较远；携带不够方便；适用白刃格斗。\n\
    \n37\n\n- 2.一般构造和使用。与七·六二步（骑）枪相同。\n\n装子弹的方法也和七·六二步（骑）枪相同。\n\n退子弹的方法，向上、向后打开枪机，退出子弹。\n\
    \n击发：和七·六二步（骑）枪相同。\n\n保险：关上枪机后，推机尾至尽头，向右旋转（转到不能再转时即可。\n\n- 3.分解和结合。注意事项与七·六二步枪相同。\n\
    \n①分解：取下通条——将枪垂直放在凳子上或地上，左手握头箍附近通条中，右手握通条头并向上拔出。\n\n取下枪机——将枪放在桌子上；左手托弹仓盖，右手提枪柄将枪机向上向后拉，同时左手拇指将枪机卡笋向左旋打开，再将枪机慢慢地向拉，即将防尘盖同时取下。\n\
    \n分解弹仓——左手握住弹仓盖，右手食指将弹仓盖卡笋向前推，使弹仓盖慢慢张开，将托弹簧由弹仓抽出，再取下托弹板。\n\n分解枪机——以左手拇指压住机头，其余四指紧握机体，手心向上。右手手掌压住机尾向前推至尽头，向右旋转至顶点，然后放松则机尾自然脱落；取出撞针及撞针簧，将抓子钩推向左方瓦斯孔上，用左手食拇指握压机头及抓子钩，拇指与其他各指紧握机体及抓子钩中部（使抓子钩向上），用右手拇指抵住抓子钩下端，用力向前推送即可取下（通常不分解）。\n\
    \n②结合：按分解时的相反顺序进行。\n\n- 4.故障的原因和排除的方法：\n\n| 故障现象 | 故障发生的原因 | 排除方法 |\n|---|---|---|\n\
    | 不发火 | 撞针尖端损坏 | 撞针尖端可自行修正，短和损坏可送厂修理；撞针簧无力，垫一段铜簧；击锤内部不带火引或底火被油污和装错。 |\n| 弹壳退不出\
    \ | 弹膛弹壳没磨开，抓子钩损坏，弹壳膨胀，撞针后没有立即开枪机 | 注意擦拭，射击后立即开枪机。如弹壳炸裂可用铜或铜条拔出或撑出，抓子钩损坏送厂修理。\
    \ |\n| 击发后枪机后面出烟 | 撞针尖太长磨掉了子弹底火，或底火装置过于自由 | 关紧枪机，修理撞针尖（磨去一点）。 |\n| 击发后枪机退不出 |\
