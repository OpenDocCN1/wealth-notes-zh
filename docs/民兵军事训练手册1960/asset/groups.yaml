  md: "\n带的用具上，插树枝或青草。疏密的程度应该注意和所利用的地形协调。在围墙或棱线后边进行观察的时候，可以取下帽子减低目标；附近的草被火烧过，取下帽子就更加隐蔽了。\n\
    \n- 一切反光的东西，如刺刀、铁锹等，都应该确实隐蔽好，因为这些东西的反光，在两华里内就可以被看到。\n- 停留不动的人，哪怕是在比较暴露的地方，也不容易引起对方的注意。因此，在观察位置上不要乱动。转移地方的时候，必须注意隐蔽，以低姿从隐蔽物的后面运动，不要触动树枝、禾苗等，以免引起敌人的注意。\n\
    \n## 观察的方法\n\n进行观察的时候，首先应该记住观察区域内各种地形地物的原来情况，然后在自己的观察区域内，聚精会神地、有次序地、由近到远、由右到左、反复不断地进行细致的观察。如果发现同原来的情况有变化，应当特别注意，直到弄清楚为止。对每一个可能被敌人利用（运动或停止）的地形地物，须要特别注意。粗心大意，东看一眼前后一眼，一定会有很多地方被漏掉，甚至在已经观察到的地方，还不能发现所在的敌人。\n\
    \n对禾苗、草丛、小树丛的观察，应该注意它的摇动情况，以判别是人触动的，还是风吹动的。对山的顶界线，容易攀登的地方，必须通过的部分（如鞍部）及沟口、山脚等，都应当注意。对森林，应当仔细听各种声音，和周密的观察林空。对村庄、市街应当注意进出田、边沿、围墙和拐角的地方。对屋顶、大树等，应当注意上边是否有人向我方观察。对复杂地形，应该特别注意两种地形的结合部，如林沿、田畔等。\n\
    \n## 识别目标和征候判断\n\n- 重机枪和迫击炮的识别。在暴露地带内，炮身向前上方是迫击炮，枪身近似平的是重机枪。\n- 根据各种征候判别敌人的兵种。尘土低而浓，运动缓慢，是步兵。尘土高而淡，运动迅速，是骑兵。尘土高而浓，所断续的，是炮兵。尘土飞扬，运动特别迅速，是汽车。\n\
    \  夜间可以根据声音来判别，从远方来的均等的“沙沙”声，是步兵部队。骑兵可以根据马蹄声判明。笨重的铁器磨擦声和炮车的隆隆声，是炮兵。汽车、坦克、飞机等，根据摩托的响声可以判明。\n\
    - 村中人急奔走，树林、禾苗地鸟雀惊飞，鸟虫叫声忽然停止，是敌人接近的征候。\n- 见到雾气状的白云、微带其他颜色的烟，或者炮弹炸声小、有上述形状的大量气体的时候，可能是毒气的征候。\n\
    \n## 报告的方法和內容\n\n报告的方法，可以用口头、规定记号、音响报告，远方观察哨可以带通信工具，如电话机、自行车和手旗等，用它来报告。\n\n报告的内容，时间，地点，方向，距离、兵力、兵种、兵器、敌人行动以及自己的位置。\n\
    \n## 四 行军\n\n行军，是使部队按时到达指定的地点。行军有两种；一是进行军，又叫向敌行军，这是为了消灭正面敌人而采取的行动。二是背敌行军，又叫撤退行军，这是为了摆脱敌人而采取的行动。有的时候我们在敌人的翼侧行动，这种行军叫侧敌行军，它可能是前进，也可能是后退。\n\
    \n行军的组织。接受行动任务后，是否能顺利地到达目的地，决定于行军组织的好与不好。行军的组织在一般情况下，应当注意减少部队力量的消耗，必须符合下述要求：\n\
    \n1. 确定行军的目的。在目的没有确定前，不应该行动。确定之后，才能规定行军的队形、道路、警戒兵力、行动速度等。\n2. 应当选择比较隐蔽、便利运动的路线，确定大、小休息的地点，并且派出设营人员预先出发。\n\
    3. 可能有敌情的时候，派出前方、侧方和后方的警戒。\n4. 为了防止敌机空袭，或者与地面敌人遭遇，可以将行军队形的前后距离，作适当的调整（增大或缩小），以便遇到情况的时候，部队能迅速展开进行战斗。\n\
    \n行军的速度，依据道路、地形、敌情、气候、季节等来决定。正常情况下的行军，每小时五公里，有时为了完成战斗任务，采取急行军（也叫强行军），每小时可达七公里左右。\n\
    \n出发前应该准备的事项。每个战士应该抓紧时间出发前的准备时间，作好下面几件事：\n\n1. 把装备整理好，带起来试试；不合适的立即修正，否则行军途中容易疲劳。零星东西、工作器具等不要忘记。\n\
    2. 临时借住的民房，要仔细检查一遍，如有借用老百姓的东西，一定要送还，损坏了的一定要赔偿，并且报告上级。\n3. 如果行军途中有遭到敌人飞机空袭的可能，应该作好的装备。\n\
    4. 出发前要多喝点开水，免得路上口渴；事先要大小便，免得在路上掉队。\n\n行军中应该注意事项。\n\n1. 在行军时，按次序一个一个的跟上，不要拉长距离或者掉队。距离拉长了，要大步跟上，不要跑，不要失掉连锁。夜间行军，要记清连号记号。\n\
    2. 过河的时候要快，过去以后要慢；上坡要快，下坡要慢，以免拥挤和掉队。\n3. 行军中，对体弱、有病的同志，要帮助他拿些东西，发扬我军革命友爱的光荣传统。有病不能走的时候，要报告班长。\n\
    4. 在行军中无论是从前面或者后面传来的口令，都必须能清楚；并且确实、迅速的传到后（前）面去。\n5. 在大、小休息的时候，应该坐在路的一旁，不要乱跑。大、小便要到下风远一些的地方去，并且掩盖好粪便。\n\
    6. 发生了情况，要听从班长的指挥，没有命令不要随便乱动。\n\n## 五 宿营\n\n宿营，是恢复战士的体力，保持战斗力量。因此，必须便利部队安全的休息和隐蔽。宿营分营（居民地内）、露营（野外）两种。\n\
