    偵察組長受領任務以後，應當將敵人的情況、偵察組的任務、執行任務的方法等，告訴偵察員。每個偵察員必須確實明了自己的任務。


    為了防止泄密和暴露我軍番號，嚴禁 偵察員攜帶能判明我軍番號和情況的物件，如：標有我軍配置的 地圖、作戰文書 和個人文件等。在出發前，組長必須確實進行檢查。


    整理好自己所攜帶的裝具，不使在行動中發出聲音。 裝 好子彈，關上保險。


    # 2. 偵察組前進的隊形


    偵察組前進的隊形，是根據敵情、地形和任務來決定的。 一般採用以下幾種（以三人小組為例）：


    +   在隱蔽地行進，多採用前三角隊形 (△) 或後三角隊形 (▽)；


    +   在平坦開闊地，多採用一字隊形；


    +   在狹隘地，多採用一路縱隊；


    +   在複雜地形，多採用左梯次 (▚) 或右梯次 (▞) 隊形。


    偵察組組長多走在主要方向上。


    各偵察員彼此間的間隔，根據地形以听力、視力能夠互相連絡、并且能夠互相援助來決定。通常在日間不超過 150 米， 夜間不超過 50米。


    # 3. 對各種地形地物的探索方法


    偵察組的行動，應當力求秘密，不使敵人發覺，并且便於 我方觀察。 為此，在白天行進時，應當保持方向，充分的利用 地形地物，由這一隱蔽地向另一隱蔽地運動，并且不間斷地進
    行觀察。在夜間行進，應當保持肅靜，不使自己的裝具和行動 發出聲音，并且注意靜听。 如果敵人照明，應迅速臥倒，待照'
