  md: "\n### （三）冲击准备和冲击\n\n1. 冲击准备：听到连长“冲击准备”的口令以后，应当停止射击，并且作好如下准备：\n   - (1) 装满子弹，以便在冲击中保持对敌人不间断的射击；\n\
    \   - (2) 准备好手榴弹，将弹盖拔松，便于及时迅速的向敌人投出；\n   - (3) 整理好服装和装具。服装、鞋子应当穿着好，弹药、土工工具（小圆锹等）、化学防护器材等应当携带牢固，不致碰撞或者丢失脱落。携带不好，在行动中也会增加疲劳；\n\
    \   - (4) 做好跳出塹壕的准备，左脚踮足踏脚孔，左臂及腰部勒紧背带，右手持枪将枪斜置于胸前背带上，这样便于四肢同时用力跳出堑壕。\n\n在冲击准备过程中，应当不间断的监视敌人，并且看清自己前进的道路。\n\
    \n2. 冲击 冲击的时机是：\n   - (1) 上级发出冲击口令或者信号的时候；\n   - (2) 我炮兵和空军火力转向敌人纵深射击的时候；\n  \
    \ - (3) 我坦克越过冲击出发地线的时候；\n   - (4) 发现敌人混乱或者企图转移位置、逃跑的时候。\n\n发现以上情况之一，应当立即报告连长。冲击一般是根据指挥员的口令发起的，但是也有由于战场上发现特别有利的机会，机敏的发动冲击，而带动全体冲击的。\n\
    \n听到班长“冲击——前进”的口令后，应当善于利用四肢的支撑力量，迅速、勇猛的跳出战壕，持枪快跑，在班的散兵队形中前进。冲击地段的距离比较短，应当跑步迅速接近敌人，以减少敌火的伤害；冲击地段的距离较远，为了保持体力，在跳出堑壕跑8-10步以后，可以变为快步前进，以后逐渐加快前进的速度（必须注意，采取快步前进，应该有我强大的炮兵和机枪火力掩护）。在冲击中，应该向前的战士看齐，任何人不得落后于本连散兵线的后面，并且边打边进，边射击，以压制残存的敌人。\n\
    \n行击中冲击动作的要领有两种：(1)“不停的概略瞄准射击”，就是一面照常前进，一面射击；右脚前出时即迅速握枪并且概略瞄准目标，左脚一落地就击发；(2)“短停顿的概略瞄准射击”，在左脚将要落地时迅速握枪，左脚落地后暂停（暂停的时间约相当于快步前进一步的时间），在这短促停顿的时间内，迅速概略瞄准目标击发，此时右脚已不是全脚掌着地，而是右脚尖已经提起，准备前进的姿势。\n\
    \n有坦克配合进攻的时候，不得落后于坦克；当坦克越过本分队冲击出发地线，应当紧随坦克向敌人冲击。在前进中，根据班长的命令或主动帮助坦克指示阻碍我步兵前进的目标，并且以自己的火力消灭敌人反坦克武器的射手。坦克受阻时，不得停止前进，应当利用我炮兵和机枪火力继续向前冲击。\n\
    \n通过敌人防御前沿障碍物通路的时候，根据班长的口令，应当迅速靠拢，成一路或二路纵队以快跑通过。通过以后，立即展开，仍成散兵线前进。\n\n接近敌人前沿的时候，应当准备手榴弹：左小臂拉栓，左手帮助右手取出手榴弹，擦开弹盖，交与右手并套好拉火圈，同时右手握住枪的枪颈上方（右手持枪亦可），作好投弹准备。当前进到距敌人\
    \ 25-30 米，迅速向敌人投去，并且立即卧倒；乘手榴弹爆炸烟尘飞扬的时候，大喊“杀”声，突入敌阵地。\n\n如果与敌人突然接触，不应当停下来，可以以左手将枪对向敌人，右手握枪柄，右臂将枪托夹于右肋处，以抵近射击杀伤敌人。如果与敌人接近，应当迅速进行“突刺”，或者以枪托打击，将敌人刺死；刺后，立即拔出刺刀，成“准备格斗”姿势继续前进。没有指挥员的命令，不得进入敌人堑壕内战斗，因为这样会迟缓前进的速度；堑壕内残存的敌人，由上级所指定的分队负责消灭。\n\
    \n必须记住，只有坚决的冲击，才能消灭敌人。坚决的前进也是给友邻最大的支援。\n\n### （四）纵深战斗\n\n每个战士都应该知道，突破敌人前沿，仅仅是胜利的开始，要取得最后胜利，还必须经过在敌人纵深内残酷的复杂的战斗。因此，突入敌阵地以后，不管遭受到任何挫折和困难，甚至有被敌人包围的危险，仍应沉着，并且以各种手段发动连续不断的冲击，顽强的抵抗敌人。如果冲击受挫，应当巩固已得的阵地，抓紧时间进行准备，再次向敌人冲击。必须记住，在这种情况下稍一犹豫动摇，不仅会增加以后行动的难度，甚至会招致失败。\n\
    \n纵深战斗，须要特别注意观察和警戒敌人；注意班长的指挥，并且和友邻协同好。在前进的时候，由于情况复杂而且变化也多，更应该机警、灵巧的利用各种地形地物，采取曲身前进、匍匐前进或者跃进的方法，从这一隐蔽地向另一隐蔽地运动；利用我机枪火力的掩护，尽可能紧随我炮兵火力的爆炸线，迅速的接近敌人，向敌人冲击。\n\
    \n在前进中，如果陷入敌人炮兵火力射击区（炮火地带），应当勇猛地快跑冲出敌人的火力区。因为，就地卧倒或者寻找掩蔽地，不但会减低我进攻的速度，而且会遭到敌炮火更大的杀伤。如果被敌人猛烈的、有组织的机枪火力所阻止无法前进，应当就地利用有利地形向敌人射击；并且在我机枪火力的掩护下，隐蔽地接近敌人，将其消灭。遇到敌人防御纵深内的各种障碍物，如壕沟、墙壁、铁丝网、废屋（树枝围起来的）、拒马（木架子上边装上铁线的）等，能绕过就绕过去，否则，用手榴弹炸掉，或者利用自己携带的和缴获的敌人工具（如剪子等）来破坏，或者利用就便物体（如木板、梯子、被、毯等）垫起来或填平通过。遇到地雷，应当绕过或者用手榴弹炸掉。\n\
    \n如果敌人使用原子、化学武器袭击的时候，动作要领可参阅本书第24页“在原子、化学武器袭击下的战斗动作”。\n\n发现敌人反冲击的时候，按照班长的口令，迅速占领有利地形，实施近迫作业；以猛烈的火力和勇敢的冲击击退与消灭敌人。如果敌人有坦克配合反冲击，应当以火力消灭坦克后面的步兵，并且以反坦克手雷击毁敌人的坦克。发现敌人退却，应当毫不犹豫地、勇猛地跟踪追击。\n\
    \n奉命消灭堑壕和交通壕内的敌人的时候，在跳入堑壕之前，如果估计里面有敌人时，应当先投手榴弹。在堑壕内和交通壕内应当以快速前进，成端枪姿势，以便准备随时用抵近射击、刺刀和枪托打击歼灭敌人。在拐角的地方，为了防止敌人突然射击，应当先迅速的实施一次射击，并且细心观察有无敌情。遇有障碍物（如拒马等），先观察有没有加强的爆炸物（系有手榴弹、地雷等），如果有，可以用挂钩的绳子拉动引信，或者用手榴弹投掷诱发爆炸，然后将障碍物抛出壕外，继续迅速前进。遇到敌掩蔽部，应当向里面投掷手榴弹，消灭内部残存的敌人。\n\
    \n### （五）教学实施方法\n\n1. 精讲多练。对必须讲解的部分，可由教员（或民兵干部）讲授，然后让大家讨论，也可以先由大家讨论，提出问题，再由教员讲解。必须掌握精讲多练的原则，腾出更多的时间进行练习。\n\
    2. 基本动作练习，必须反复进行，达到确实与熟练。练习时应当在現地进行。先以连或排为单位，按照每个动作，随讲要领，随做示范。各班排开后，按照情况可以分组练习；由动作较好的同志当小先生，也可以自由结合，互相纠正动作，共同研究，取长补短。\n\
    \n练习中也可以采取在较远的距离上设上假设敌（注意不要派人太多，以免影响学习），观察运动时的姿势是否过高，如果过高，可吹哨示警引起注意。\n\n对于动作较好的同志，可以在全连作示范表演，启发大家研究，学习。\n\
    \n3. 每一个动作都熟练以后，应当把各个动作连贯起来进行综合练习（参看下页附表二）。\n\n## 八 防御战斗中的战士动作\n\n### （一）防御战斗的目的\n\
    \n防御是战斗类型的一种。防御的目的是固守占领的阵地，利用有利的防御工事，以火力和反冲击，抗击敌人优势兵力，力的进攻，给敌人以重大的杀伤，从而为转入坚决的进攻造成有利的条件。所以说，防御战斗是暂时的，而且是积极的。\n\
    \n为了坚决完成防御任务，担任防御的战士，必须善于选择、利用地形和构筑工事，以发扬最大的火力杀伤敌人；并且力求隐蔽自己，避免敌火力对我的伤害。\n\n在防御战斗中，每个战士都必须以机智、坚定、沉着和顽强的精神，抵抗敌人的进攻。在任何情况下，没有指挥员的命令，不得放弃阵地。\n\
    \n### （二）防御战斗前的准备\n\n1. 抵抗位置的选择（即射击位置的选择）。 在防御战斗前，应当在班长指定的地区内观察地形，选择自己的抵抗位置。选择的抵抗位置，应当注意充分利用地形，具有良好的视界和射界，能够隐蔽自己，更重要的是能够观察到阵地前面的一切目标，并且火力能够射击到。\n\
    \n2. 构筑工事和伪装。 抵抗位置选好后，应当按照班长指示的时间和工事的种类，挖掘散兵坑。如果是与敌人直接接触，通常在夜间构筑，一般是先构筑卧射散兵坑，再逐渐加深为跪射、立射散兵坑，并且以堑壕连接起来。如果不是与敌人直接接触，构筑工事可以在白天进行，一开始就可以构筑立射散兵坑，并且以堑壕和交通壕连接起来。\n\
    \n在构筑工事前，应该准备好对空和对地面敌人的伪装。如将杂草、树枝等插在前方，不使地面敌人观察到；发现敌人飞机，可以蹲下，将杂草、树枝举起来掩蔽。作业的时候，应该把枪支和装具等放在侧后方隐蔽处。放的位置不要过远，以能够随手拿取投入战斗；应当放在上风向的地方，以免在作业的时候尘土沾污武器。\n\
    \n构筑好的工事，必须加以伪装。善于伪装的战士，能使自己的工事和周围的地形、颜色完全混同起来，使进攻的敌人接近到50米的地方还不能发觉。实施方法：挖的新土不要随便乱投，应该堆在一定的位置，这样，既能够逃避敌弹，又便于伪装。散兵坑四周的草木，应该尽量保持原来的样子，不要践踏，以免露出痕迹。工事周围的新土，应该从其他地方割草叶、树枝、草皮和干土等，来加以伪装。\n\
    \n工事前方如果有妨碍射击和观察的地物（树枝、草丛等），应该一律清除。\n\n3. 射击前的准备。按照班长的指示，阵地前的各个方位物的距离，都必须测量好，并且熟记。如果需要，可以画在地上或纸上，纸可贴在或用土块压在容易看到又不暴露的地方。\n\
    \n方位物标定好以后，应当依照各个方位物的距离，装定表尺试瞄，发现射击依托有不妥当的地方等，立即修正。\n\n在敌人原子、化学武器袭击下的动作要领，可参阅本书第24页“在原子、化学武器袭击下的战斗动作”。\n\
    \n### （三）防御战斗\n\n1. 抗击敌人的冲击\n\n听到班长“进入战斗”的口令后，应当迅速进入自己的抵抗位置，打开保险，观察敌情，准备射击。敌人进到400米距离，按照班长的口令进行射击；敌人进到200米以内，可以自动选择最有利的时机和对我危害最大的目标瞄准射击。\n\
    \n当敌人进到25-30米的时候，听到班长喊“目标——敌人步兵，手榴弹预备”的口令，应当准备好手榴弹，听到“投”，立即向冲击的敌人投去，并且以抵近射击杀伤敌人。对后退的敌人，应当以猛烈的火力进行追击。\n\
    \n发现阵地前的死角有敌人，应该协同友邻消灭。遇到危害友邻而友邻又射击不到的敌人，应该自动射击协助友邻。\n\n如果敌人有坦克配合冲击，当坦克进到适当的距离以内，按照班长的口令向坦克投掷防坦克手雷，并且力求将手雷投于坦克的履带下击毁它。如果没有击中，敌坦克继续前进越过我野壕时，应当迅速避开，或者隐蔽在野壕底部，等坦克刚一通过，立即以防坦克手雷或燃烧瓶击其尾部，然后以手榴弹和抵近射击杀伤敌坦克后面的步兵，使它与坦克脱离，并且将其消灭在阵地前。\n\
    \n2. 歼灭突入阵地内的敌人:\n\n如果敌人突入我阵地内，应当乘敌人超越野壕立足未稳的时候，以抵近射击或者勇猛地跳出野壕与敌人进行白刃格斗，消灭敌人。\n\
    \n当敌人突入我部分野壕，应当迅速拉下预先准备好的拒马或者其它障碍物，阻止敌人的发展，并且占领野壕的弯曲处，向敌人投掷手榴弹，随时准备抵近射击和进行白刃格斗。\n\
    \n当敌人手榴弹落在自己身边的时候，应该乘它还没有爆炸的瞬间，毫不迟疑地拾起来再投向敌人。必须知道，这样机敏的动作，只会减少对自己的危险，因为落在身边的手榴弹对自己的杀伤是不能避免的。\n\
    \n每个战士在战斗中都应该具有坚定、沉着和坚韧不拔的精神；在任何情况下，都应该积极地顽强地以各种手段与敌人进行战斗，没有指挥员的命令，就是剩下一个人也不能擅自撤退。如果班长或机枪手伤亡，应该勇敢的代替他们的职务。\n\
    \n### （四）教学实施方法\n\n组织和实施步骤，可以参考“进攻中的战士”部分进行。\n\n战士对抵抗位置选择的实施方法，可以先在适当的地形上一面讲解，一面作示范动作。然后以班为单位带到选好的地形上，由班长说明情况，指定一个战士在指定地区内选择抵抗位置。战士接受任务以后，就一面作动作一面说明为什么要选择这里作抵抗位置。示范以后，各班再分成两、三小组，在各种不同的地形上演习。演习后，应该就地讨论，使每一个战士确实体会选择抵抗位置的要领。\n\
    \n在研究工事构筑和伪装的时候，应该在各种不同的地形上构成各种不同姿势的散兵坑，并且加以各种不同的伪装（有的是伪装很好的，有的是伪装不好的，有的没有伪装的）。在讲解工事构筑和伪装之后，叫大家从敌方来反看各种工事伪装的强度，使每个战士体会到工事和伪装的重要性。然后各班离开，由班长指定防御的区域，各个战士就在指定的区域内自行选择抵抗位置，根据地形构筑适当的工事和伪装，使每一个战士在各种地形上都能够熟练地构筑自己的散兵坑并且加以伪装。\n\
    \n在构筑工事的时候，可以随时出些情况（如发现敌机或者是地面的敌人侦察等），以使演习者熟悉作业时的隐蔽动作。\n\n在分组或者各个战士构筑工事完了以后，应该继续互相参观和研究。最后在讲评的时候，对好的典型应该介绍和表扬。\n\
    \n对防御战斗的实施方法，可以把内容分成若干个问题，由干部（或教员）出情况，在现场逐项研究、练习。\n\n干部和教员，预先应确定方位物，并且派出情况显示员，规定好情况显示的记号。如：红旗高举是第二方位物敌人步兵开始进攻；红旗平伸是第五、六号目标敌人步兵冲击前进；红白旗交叉是第七号目标敌坦克，等等。对各种情况的出现，由战士自己来处置；并且反复练习。\n\
    \n每个动作熟练以后，可进行一次综合练习（参看下页附表三）。\n\n## 九 小组的战斗动作\n\n### （一）小组的任务和作用\n\n组是在排的任务范围内具体执行任务的战斗群。在进攻战斗中，它的基本任务是根据敌情、地形；迅速的接近敌人，坚决勇敢的投入冲击，歼灭敌人。分组长的好处是：第一，加强了班长的指挥。班长指挥组长，组长指挥组员，这样在班长口令指挥的范围内，各组的火力和运动就能很好配合。第二，白刃格斗的时候，可以一组对付敌一、二人，完全可以歼灭敌人。第三，便于研究情况，发挥战士的积极性，创造性，及时反映意见，使组（班）长在战斗中对情况的判断与决心，处置得更恰当。第四，尤其在进行山地战斗、森林战斗、夜间战斗以及巷战的时候，更能显示小组的灵活性和机动性。\n\
    \n### （二）组长在战斗中的指挥\n\n组长受领任务以后，应当向战士传达任务，引导大家研究执行任务的方法，发挥战士的集体智慧。组长在依据班长命令进攻的路线指挥全组运动的时候，应当带领全组灵活的变换队形和各种运动方法，指挥各个战士利用地形地物，力求安全、隐蔽、迅速地前进，并且积极协同友邻动作。在进攻中，组长要不间断的观察敌情、地形，保持与班长及友邻的联络。全组到达一定地点后，指挥组员迅速靠拢，准备冲击。\n\
    \n在整个战斗中，组长都要以自己的模范行动带动全组。\n\n### 附表二 进攻中的战士战术作业进程参考表\n\n| 研究事项 | 教 者 的 动 作 |\
