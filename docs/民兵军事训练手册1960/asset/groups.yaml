    # 射击的时候为什么会有后座？


    我們在打靶的时候，枪一响，同时就会觉得枪向后一退，肩膀也就稍稍被震动一下，这一退就是后座。


    后座的发生，是由于弹壳里面的火药燃烧以后，大量的气体在枪膛内上、下、左、右冲撞，因为力量大小一样，互相抵消了，向前冲撞的气体，把弹头推出了枪膛，向后冲撞的气体，虽然被枪机挡住没有挤出来，但是却把整个枪身向后撞了一下，使枪身向后一退。后座就是这样发生的。


    射击的时候会不会因为后座而打不中目标呢？只要操作正确，是不会的。因为武器的后座是沿着火身轴线正直向后退的，并且后座距离很小，只有芝麻粒那么大小，这一点后座距离，在弹头没有出枪口之前，影响枪身跳动很小，操作正确，不会影响命中。当然，弹头刚离开枪口的一刹那，由于火药气体与枪口外的空气冲击而引起的后座跳动是比较大的，但是这时弹头早已飞出枪口，所以后座对单发武器（步枪、机枪）来说，也不会影响命中。至于对速发武器（冲锋枪、机关枪）来说，第一发弹头飞出枪口后，产生的后座破坏了原来的瞄准线，对第二发弹头的命中是有影响的。但是操作正确，把枪管控制得很规矩，使枪身跳动很小，也不会影响命中目标。


    后座力对射击虽然有上述这些影响，但是也有用处，它可以作为自动武器的原动力。很多冲锋枪和手枪，就是利用后座的力量，使枪机后退来完成半自动的。


