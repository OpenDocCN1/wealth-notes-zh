    +   （5）搜索較大村庄的时候，應該首先在村外觀察村內的動靜。 搜索街道的時候，應該利用街道兩旁的牆角彼此交互前進和交互觀察。 通過橫巷口的时候，應該由先在巷口对面的偵察員進行觀察，待他發出确实沒有人的批号以後，另一偵察員可以轆入巷內或者通过巷口（图116）。
