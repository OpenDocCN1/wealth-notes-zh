    （5）如果突然与敌人遭遇，假如自己陷入危险，应当鸣枪报警或者是勇猛突围。倘若同志遭遇危险，必须机敏勇敢的用射击或突刺去营救他。


    # 二 警戒


    # （一）步哨勤务原则


    1. 步哨是由班哨或者排哨派出的，和派出哨所的距离，依据具体情况而定，一般白天不超过400米，夜间不超过50米。


    步哨通常由正副步哨员两人组成（也有因特殊原因派出—人或三人）。由正步哨员负责，副步哨员执行正步哨员的命令。步哨员的主要职责，就是把发现的各种情况随时报告班哨长，并且根据班哨长的命令动作。


    2. 步哨的换班，必须隐蔽静肃，并且将情况向接班的人交代清楚。


    正副步哨员的换班，一般是每小时换班一次。每次以新副步哨员上班，原副步哨员升为正步哨，原来的正步哨下班。


    单人哨一般是两小时换班一次。三人哨的换班时间，按情况决定，一般是两小时以上，也可以只规定归队的时间而不换班。


    3. 步哨员注意事项


    步哨员位置的选择，要既便于观察，又便于隐蔽（夜间应当选在低处）。采取何种姿势，根据地形决定。已经选定，就不准随便离开位置和变换姿势，任何时候都不能吸烟。步哨员为了时刻准备战斗，枪不能离手，要装上子弹，关好保险，上好刺刀，准备好手榴弹。


    不断地观察哨长所指定的地区，并且照顾两侧的情况。'
  - '[PAGE 138]


    对認識的我軍部隊指揮員、偵察員、通信員，准其通過。对于其他任何人員，都应当命令他站住，放下枪。白天停止在步哨前 50~60米处，夜间只要一发现，立即命令他站住。


    对于被扣的人員，必須命令他面向敌方，然后請班哨长来处理。班哨长沒有来以前，不准被扣人員离开位置，也不和他談話，并且随时准备射击。


    对不听步哨命令者，如判断确系敌人，应当捕捉或射杀。


    4. 發現敌人的处置。


    发现敌人进攻和各种征候（烧火、灰尘、音响等），应当立即报告哨长，并且繼續觀察。对单个敌人，应当力求将其俘获，对集群的敌人，应当射击抵抗。


    报告連絡的方法，用預先規定好的目標、音响的記号或口头报告；必要的时候以射击或投手榴彈报告。


    5. 除步哨外，还有了望哨、潜伏哨、連絡哨。


    了望哨，又叫远方观察哨，担任三至十里以内情況的觀察；按情況的需要，由一至三人組成。連絡哨，是担任步哨与警戒部队之间，或者警戒部队与被警戒部队之间的連絡；通常由一人担任。潜伏哨，是在重要方向为了发现敌人，由排哨派出独立执行任务的；通常由三人組成，指定一人为哨长。


    他們的動作要顧和步哨同。只是了望哨、潜伏哨不处理来往人員。


    # （二）步哨勤務動作


    1. 步哨的配置，通常是由班哨长（或排哨长）亲自率領到步哨位置，授予特別守則，步哨員随即复誦任务。有时步哨位置比較明显，哨长一時有別的工作，可以指示步哨員以概略位置和观察方向，步哨員在复誦后，可以自己选择隐蔽道路到达'
  - '[PAGE 139]


    步哨位置。待哨长来时，向哨长报告所得到的新情况，并且接受特别守则。


    ![](img/b41346f815189f79888890b5225a828a_139_0.png)


    2. 到达步哨位置后，先隐蔽地观察附近地形，选择便于观察和隐蔽的位置；必要时需要和副步哨员交互的将观察位置稍加修理，并且加以伪装。正副步哨员的配置，白天以能口头和配号互相通知，夜间以能低声互相谈话为原则。有时为了便于观察，可以一人在树上，另一人在地上（图118）。


    观察要细致周到，正副步哨员不要同时看一个方向，可以一人注意前方，一人注意两侧和后方。


    对敌人容易隐蔽接近的地点，或者是通向敌人的要道，尤其应该特别注意。


    3. 对哨长交给的任务要确实记住，在执行任务的时候要认真负责，换班的时候要交代清楚。


    问口令通常是先命令前边的人站住，问明番号，然后命令其中二人到步哨位置附近，用低声问口令，如果口令不对或者答不出来，就请班哨长来处理。


    4. 步哨员碰到下列情况中的一种时，可以射击：①情况紧急，有使被警戒的部队可能陷于危险的时候；


    184'
