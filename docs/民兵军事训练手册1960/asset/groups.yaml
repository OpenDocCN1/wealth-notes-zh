  md: "\n击后，必須及时的对人员、武器和地面所沾染的放射性物質和毒剂，进行清除和消毒。\n\n放射性物質的特点是不能用化学薬品消灭，用火也烧不掉，但是会慢慢滅弱和消失放射性。因此，可以用拍、打、刷的方法来清除掉，或者把沾染物質割除、掩盖、隔离。毒剂可以用消毒剂消毒，也可以用割除、掩盖、火烧、水冲洗等来洗消，利用破布、棉花之类，蘸上煤油、汽油、酒精及植物油、肥皂水擦拭，也可以。\n\
    \n### 洗消的方法怎样\n\n#### 对人員的洗消：\n\n对于人員沾染的洗消，在沾染地内，可以先擦去能看見的灰尘，或者用吸水性較好的破布、棉花，吸去有毒的液滴，然后用沒有沾染的水（如水壺里的水）冲洗，或者用没有沾染的水浸湿毛巾，消毒棉花，擦拭暴露的皮肤。擦拭的时候应当順着一个方向多次进行，并且不断轉动或更換毛巾、棉花球。如果没有戴防毒面具，对于面部也应当冲洗、擦拭，并且用沒有沾染的水漱口、挑鼻。所有揉脏了的棉花球、破布、毛巾，应当挖个小坑埋掉。\n\
    \n人員离开沾染地面后，还应当用肥皂水再仔細冲刷一遍，眼、鼻、口腔等处，更要特別注意冲洗干净。有條件的話，最好洗一个澡。\n\n对于染上毒液的皮肤，可以用个人消毒包的消毒剂进行局部消毒。\n\
    \n#### 对武器和服装的洗消：\n\n对武器的洗消，可以先用紗布、棉花吸去表面液滴，然后用沒有沾染的破布、棉花做成破布团，蘸上沒有沾染的水或煤油、汽油等，仔細擦拭。有条件的話，应当用水冲洗，用汽油、煤油洗滁另件。\n\
    \n![](img/b41346f815189f79888890b5225a828a_34_0.png)\n\n図20 自己或相互拍打掉放射性灰尘\n\n\
    ![](img/b41346f815189f79888890b5225a828a_35_0.png)\n\n対服装的洗滁，如果是染上毒剤，可以用个人消 毒包进行局部消毒，或者用日晒、风吹、蒸煮、用水冲洗等方法\
    \ 进行消毒；如果是放射性沾染，就应当仔細地拍打，抖動或者 用水冲刷掉(図20)。\n\n対地面的洗滁：\n\n対受沾染的地面，可以将沾染的土层劃除掩埋，或者蓋上\
    \ 一层新土，沙子、草皮、树枝、木板等，或者用水冲洗。対染上 毒剤的地面，除了上述办法外，还可以用火烧。至于工事、墙 壁等地方，可以用湿扫帚、湿稻草或者抹布等仔細打扫、擦滁。\
    \ 対壘壕内、掩体内停留的毒气，可以抖動被单，将毒气敲出。\n\n対食物和飲水的洗滁：\n\n对于沾染或染毒的食物，去掉表面一层即可，如果沾染、 染毒过多，应当抛掉。\n\
    \n对于沾染或染毒的水，可以用澄清、煮沸或者蒸瀆法洗 滁。澄清法是把水静放10~15小时(如果加入凝聚剂等化学 物質，時間可以縮短)，沾染物質和毒剤就会沉淀，把上層水吸\
    \ 出(下層水不可以用)，再煮沸就可以了。\n\n經過洗滁后准备食用的食物和水，必須經過专门檢驗，才 准飲用。\n\n30\n\n## 射 击 训 練\n\n\
    ### 一 步(騎)枪的构造和战斗性能\n\n射击是軍事知識的基本内容之一。学习射击,具有精确掌握手中武器的本領,就能在战斗中以准确的射击杀伤和歼灭敵人,取得战斗的胜利。\n\
    \n现在各地民兵使用的步(騎)枪,有几十种,很复杂,这里仅介紹几种数量較多的,“七·六二”、“六五”、“七九”三种步(騎)枪于后。 因为步(騎)枪的构造原理,使用方法以及战斗性能等,大体上是相同的。\
    \ 能够了解和掌握了这几种主要的步(騎)枪,其它也就能掌握和使用。\n\n#### (一)七·六二步(騎)枪\n\n现在使用的七·六二步(騎)枪有两种,一种是\
    \ 1891/30 年苏式步枪,另一种是1944年苏式騎枪。 两者的区别只是重量不圈(步枪4.5公斤,騎枪 3.9 公斤),枪管长度不同(步枪带枪刺 180\
    \ 厘米,騎枪帶枪刺 133 厘米),枪刺不同(騎枪是折迭式的),其它战斗性能和构造原理等是相同的。\n\n苏联造的1944年式騎枪,我国于1953年制造成功,命名为1953年式七·六二毫米騎枪,简称53式七·六二騎枪(图劃),这种枪构造簡單坚固,不容易发生故障,使勿力太,命中精度特別良好。是过去战争中世界上最优良的步兵武器。从下列\n\
    \n![](img/b41346f815189f79888890b5225a828a_37_0.png)\n\n### 图21 七·六二骑枪\n\n表中可以看出它的特点：\n\
    \n| 区分 | 58式七·六二骑枪 | 三八式六五步枪 | 二四式七九步枪 |\n| :--- | :--- | :--- | :--- |\n| 口径\
    \ | 7.62毫米 | 7.5毫米 | 7.9毫米 |\n| 枪全重 | 3.9公斤 | 3.9公斤 | 4.08公斤 |\n| 枪全长 | 1330毫米\
    \ | 1280毫米 | 1160毫米 |\n| 枪管长 | 550毫米 | 780毫米 | 597毫米 |\n| 瞄准基线长 | 416毫米 | 685毫米\
    \ | 504毫米 |\n| 枪刺长 |  | 500毫米 | 425毫米 |\n| 膛线 | 4条，右旋 | 4条，右旋 | 4条，右旋 |\n| 初速\
    \ | 820米/秒 | 762米/秒 | 810米/秒 |\n| 最大射程 | 3000米 | 2400米 | 2000米 |\n| 有效射击距离 | 600米\
    \ | 600米 | 600米 |\n\n1. 步（骑）枪的用途。七·六二骑枪和其他步（骑）枪一样，是步枪手的基本武器，用火、枪刺和枪托杀伤敌人，它是杀伤单个生动目标（暴露的、伪装的、移动的和短时间隐显的）最有效的武器。\n\
    \n在400米以内可以获得最大的射击效果；集中火力可以杀伤1,000米以内的集体目标；在500米以内可以射击飞机和伞兵；使用带瞄准镜的狙击手，可以在800米以内杀伤敌人的生动目标。有折迭式枪刺，在战斗中使用方便，特别是在整壕、建筑物和森林中以及在超越各种障碍时更方便。\n\
    \n2. 一般构造和使用。全枪由枪管、机槽、枪机、弹仓、木托及上护木、枪刺六部分组成。\n\n装子弹的方法：向左转牙机柄；向后拉开枪机到尽头，装上弹夹，压下予弹并擲去弹夹，向前推回枪机；将机柄转到右方。\n\
    \n退子弹的方法：向上向后打开枪机退出第一发子弹后；压其余子弹向下，打开弹仓盖取出子弹。\n\n击发：扣扳机即行击发。\n\n关保险：将机尾向后拉到尽头转向左方即可。\n\
    \n3. 分解结合。步枪分解结合是为了擦拭、上油、排除故障或检查。分解结合的时候，应该注意在桌子、凳子或板子里进行，如果在野外，应当在清洁的垫布或衣服上实施；卸下或装置机件的时候；应当格外小心，以免损坏；分解的各机件要按顺序放好，以免混杂或损失。\n\
    \n- 分解的步骤如下：\n  取下枪机——左手食指扣扳机，同时右手打开枪机，并随后拉（图22）。\n\n  拆迭枪刺——将枪托放在地上，枪面向内，左手握枪口部分，右手将枪刺管向上拔起，使驻笋孔离开枪口后，\n\
    \n  ![](img/b41346f815189f79888890b5225a828a_38_0.png)\n\n  即向右折下枪刺，使其刃部纳入下护木内(图23)。\n\
    \n  旋出通条——右手向左旋转并向上拔出。\n\n  取下弹仓盖——用右手食指按下弹仓盖卡笋的按钮并打开弹仓盖，然后以拇指压紧托弹机，从摇摆螺上取下弹仓盖。\n\
    \n  分解枪机——左手握枪机，拇指推机柄，食指扳机头，右手拉开机尾，拉的时候要使螺形突出部的扣突脱离凹槽，击发阻铁突笋不要从连接叉内滑出，然后将机尾\n\n\
    \  ![](img/b41346f815189f79888890b5225a828a_39_0.png)\n\n  转向左方 拉(图24)。\n\n  右手握机尾，左手向前推动连接板的机头，而后取下，并从连接板上卸开机头。\n\
    \n  分解机尾的时候，垂直放置机体，将撞针尖抵在木板上，左手压下机柄，尽力压缩撞针簧，右手向\n\n  ![](img/b41346f815189f79888890b5225a828a_39_1.png)\n\
    \n  ![](img/b41346f815189f79888890b5225a828a_39_2.png)\n\n  左方向旋下机尾，左手慢慢放松在机柄上的压力，取出撞针及撞针簧（图25）。\n\
    \n  ②结合：按分解的相反顺序进行。\n\n  结合枪机——将撞针簧套在撞针上，并装入机体滑孔内；垂直放置机体，将撞针尖顶在木板上，左手压下机柄，右手将机尾摉在撞针上，慢慢放松在机柄上的压力，将机尾螺形突出部放在机体的螺形缺口内，用解锥的大缺口转动撞针（图26），以对准机尾钮上的刻线。\n\
    \n  ![](img/b41346f815189f79888890b5225a828a_40_0.png)\n\n  ![](img/b41346f815189f79888890b5225a828a_40_1.png)\n\
    \n  左手将机头装在连接钣管上，向右撞到尽头，右手把撞针插入连接钣管的滑孔内，机头扣簧进入机体槽中，用解锥的缺口检查撞针突出的程度，撞针尖能通过解锥的第三缺口（上面注有95），不能通过第二缺口（上面注有75）为最好（图27），再检查退弹钩和击发阻铁缺尖笋是否磨损，连接钣是否弯曲。\n\
    \n  左手握机柄，食（中）指探机头，右手拉机尾向后向右旋转，使机尾螺形突出部扣簧进入机体凹槽内。\n\n  装弹仓盖——左手握枪，右手压紧托弹槽，使弹仓盖的缺\n\
    \n  口卡佳弹簧的搖摆螺栓，然后放松托弹机，盖上弹仓盖。\n\n  捧上通条———将通条插入通条槽內，擰紧。\n\n  打开枪刺———将枪托放在地上，左手握枪口部分，右手将枪刺管向下拉，然后从右向\
    \ 上 轉开枪刺到尽头，使駐彈孔套在枪口上。\n\n  裝上枪机———左手握枪頸，食指扣扳机，右手装上井关上枪机。\n\n#### 4.故障的預防及排除的方法。\n\
    \n| 故障現象 | 故障发生的原因 | 排除方法 |\n| :--- | :--- | :--- |\n| 将子弹装入弹仓时弹仓盖自行脫开 | 彈夹盖卡鈀齿損坏或螺絲松勭\
    \ | 不用弹夾而逐个将子彈装入机槽，射击完后經修械所修理 |\n| 子彈不能入膛，发生卡弹 | 装彈时沒有将子彈压到鎗完與鋸背之下，鎗完鈌損坏 | 把子彈扶正，送人彈膛，如重復发生这一故障，可送交装械—射击后經修械所修理\
    \ |\n| 子彈在枪膛中卡紧，关梭机时需要用力 | 子彈变形或膛火凸出，弹膛發鉍 | 退出不良的子彈，用通条擰試枪膛 |\n| 子彈不发火 | 哑水受澗，撞針尖突出的程度不夠。撞針折斷或磨癈，撞針簧力弱，机件彈孔內有積鐵\
    \ | 換子彈后再射击，如重復发生这一故障，检查撞針尖突出的程度，如机件扎孔內有疤铁，試式井除淨油。撞針、撞針簧損坏时，經修械所修理 |\n| 不能拉出彈膛內的彈壳\
    \ | 攝子鈂損坏或污話太多 | 如有污垢，分解清試；如損坏，送修械所修理；脫困弾壳用通条痛出 |\n| 退彈时彈壳(子彈)不能投出 | 發完彈鎗被彎曲，或發完鎗鉤磨癈有汚垢\
    \ | 用手取出彈壳(子彈) 擦試汚垢，如發完鎗損坏，经修鉏所修理 |\n| 拉枪机向后时枪机潑脫 | 拨机鎗螺絲过紧，拨机阻簧或通架凹槽面整磨損 | 把机机装螺絲上紧，如枪机阻鎗鈂鎗磨損經修械所修理\
    \ |\n\n86\n\n①故障的預防，為了防止射击时发生故障，必须严格遵守分解、结合、擦拭、保管和检查的规则。在严寒的季节里，应当把枪的活动机件（枪机等）涂冬季擦枪油；射击前应当检查弹夹和子弹，有毛病的和有污垢的子弹不可以装入枪内，这种子弹应当先用干布擦淨，再用蘸有少许擦枪油的布擦拭。\n\
    \n②故障的原因及排除方法，见上页表。\n\n#### (二) 三八式步枪：\n\n> “三八式步枪是日本明治三十八年（1905年）制造的，所以叫三八式步枪，过去我国山西和沈阳兵工厂都有仿造，它的口径是6.5毫米，所以又叫六五步枪（图28）。”\n\
    \n![](img/b41346f815189f79888890b5225a828a_42_0.png)\n\n1. 战斗性能。保管和擦拭得好，能经久耐用；瞄标基线长，命中较精确；子弹装药量少，初速也较小，但射击时震动不大；枪管长，射程较远；携带不够方便；适用白刃格斗。\n\
    \n37\n\n- 2.一般构造和使用。与七·六二步（骑）枪相同。\n\n装子弹的方法也和七·六二步（骑）枪相同。\n\n退子弹的方法，向上、向后打开枪机，退出子弹。\n\
    \n击发：和七·六二步（骑）枪相同。\n\n保险：关上枪机后，推机尾至尽头，向右旋转（转到不能再转时即可。\n\n- 3.分解和结合。注意事项与七·六二步枪相同。\n\
    \n①分解：取下通条——将枪垂直放在凳子上或地上，左手握头箍附近通条中，右手握通条头并向上拔出。\n\n取下枪机——将枪放在桌子上；左手托弹仓盖，右手提枪柄将枪机向上向后拉，同时左手拇指将枪机卡笋向左旋打开，再将枪机慢慢地向拉，即将防尘盖同时取下。\n\
    \n分解弹仓——左手握住弹仓盖，右手食指将弹仓盖卡笋向前推，使弹仓盖慢慢张开，将托弹簧由弹仓抽出，再取下托弹板。\n\n分解枪机——以左手拇指压住机头，其余四指紧握机体，手心向上。右手手掌压住机尾向前推至尽头，向右旋转至顶点，然后放松则机尾自然脱落；取出撞针及撞针簧，将抓子钩推向左方瓦斯孔上，用左手食拇指握压机头及抓子钩，拇指与其他各指紧握机体及抓子钩中部（使抓子钩向上），用右手拇指抵住抓子钩下端，用力向前推送即可取下（通常不分解）。\n\
    \n②结合：按分解时的相反顺序进行。\n\n- 4.故障的原因和排除的方法：\n\n| 故障现象 | 故障发生的原因 | 排除方法 |\n|---|---|---|\n\
    | 不发火 | 撞针尖端损坏 | 撞针尖端可自行修正，短和损坏可送厂修理；撞针簧无力，垫一段铜簧；击锤内部不带火引或底火被油污和装错。 |\n| 弹壳退不出\
    \ | 弹膛弹壳没磨开，抓子钩损坏，弹壳膨胀，撞针后没有立即开枪机 | 注意擦拭，射击后立即开枪机。如弹壳炸裂可用铜或铜条拔出或撑出，抓子钩损坏送厂修理。\
    \ |\n| 击发后枪机后面出烟 | 撞针尖太长磨掉了子弹底火，或底火装置过于自由 | 关紧枪机，修理撞针尖（磨去一点）。 |\n| 击发后枪机退不出 |\
    \ 涂油少，枪机和机槽不干净 | 擦拭涂油，射击后迅速拉开枪机。 |\n| 枪身炸裂 | 枪膛未擦干净，有东西塞住；未拔枪口帽；第一及第二发，误用长枪子弹；在极端的地方射击\
    \ | 射击前注意检查枪膛是否擦净，子弹有无裂纹，拭去枪口帽后再射击；射击时如无未出枪口，应用通条推出枪膛内的弹丸或用较轻的空包射出；在极端的地方射击，应将枪尖在土尖内保持温暖。\
    \ |\n| 不能保险 | 保险机内生镸，保险室失去作用，保险室及保险转键棱角磨光 | 擦拭涂油，送厂修理。 |\n| 滑机走火 | 扳机头和卡铁棱角磨光，扳机卡住自行滑动，复簧失去作用，扳机头压不出来\
    \ | 送厂修理。 |\n| 表尺准星发亮影响瞄准 | 由于保管不好致使 | 用火柴熏黑。 |\n\n#### (三) 七九式步枪\n\n七九式步枪是仿照德国\
    \ 1898 年毛瑟枪，国民党加以改进\n\n后于1935年正式生产的，它的口径是7.9毫米，所以称为七九步枪（图30）。\n\n![](img/b41346f815189f79888890b5225a828a_45_0.png)\n\
    \n- 1.战斗性能。初速大、弹道低伸；枪的口径及子弹装药量都较大，所以杀伤力也大；装上枪榴弹发射筒时，可以发射枪榴弹。\n\n- 2.一般构造和使用。同七·六二步（骑）枪。\n\
    装子弹的方法同七·六二步（骑）枪。\n退子弹的方法同三八式步枪。\n击发同七·六二步（骑）枪。\n保险的方法，关上枪机后，将保险机转到右方即可。\n\n-\
    \ 3.分解结合。分解结合注意的事项与三八式步枪同。\n①分解；取下通条——将枪垂直放在凳子上或地上，\n手握住前准器附近，右手握通条头向右旋转向上拔出。\n\
    取下枪机——先把枪机打开随即关上，使其成待发状态，\n然后将保险机扳起直立，右手再打开枪机向后拉，同时左手\n拇指将枪机卡簧向左拨开；取下枪机。\n分解弹仓——右手用通条头下压弹仓盖卡笋，同时左\n\
    手用拇指将弹仓盖后推，拿下弹仓盖、托弹管、托弹板、钢\n的起子，先把弹仓前后的下制螺钉卸下来，然后再卸\n弹仓即可拿下（这一部分通常不分解）。\n\n分解枪机——左手握住机体，用右手拇指尖压住定位\n\
    锁并握住机尾管与机尾，向右旋五周，取下机尾管和\n锁针；右手握住机尾管把锁针放在枪口里面（枪要直立，\n注意不要使撞针歪了，免得折断），右手拇指用力压保险\n\
    机，用左手握住机尾向右旋转九十度；右手慢慢放机尾管，\n取下撞针及撞针簧，机尾和保险机；右手握机体及机\n框，左手拇指用力顶抓子钩，使抓子钩的头部仰起；右手\n\
    将机体向左旋，把抓子钩对准瓦斯孔，再以右手拇指用力\n前推取下（这一部分通常不分解）。\n\n②结合时按分解时的相反顺序进行。\n\n#### 5. 故障的原因和排除的方法：\n\
    \n| 故障现象 | 故障发生的原因 | 排 除 方 法 |\n| --- | --- | --- |\n| 不发火 | 弹簧失效；扳机内凡士林油太多；撞针簧失效或折断\
    \ | 更换子弹和撞针（簧）或松撞针簧；将零件擦拭干净 |\n| 不击发 | 扳机部故障，或结合的不够当 | 检查扳机部的零件，结合适当 |\n| 装填后自动击发（滑机）\
    \ | 击发阻铁、（尖笋）失效 | 缓慢关枪机 |\n| 退壳困难 | 抓子钩失效，或弹膛内有灰尘或接壳旋失效 | 弹膛内加涂油，修理抓子钩和撞壳旋 |\n\
    | 机件脱落 | 涂油太少（多），机件内不干净 | 涂油擦拭干净 |\n| 子弹不能退膛 | 子弹变形，有异弹壳 | 翻换子弹，检查擦拭枪膛 |\n| 断壳脱落\
    \ | 弹壳裂了或弹壳旋不干净 | 先装一粒子弹，将其带出，或用通条从枪口向后推掉 |\n| 子弹装在弹仓内不能升起 | 托弹簧失效 | 修理或调换托弹簧\
    \ |\n\n### 二 步（騎）枪的擦拭、上油和保管規則\n\n現在我們民兵手中使用的武器，一部分是同志們用鮮血和生命換來的，一部分是我們自己制造的。它不同于一般用具，而是同敌人斗争的工具，因此，不能隨便亂丢、亂放，更不能任意借給别人。否則，保养不好，容易損坏，发生故障影响枪的寿命，也会发生个别\
    \ 的丢失和被盜现象。\n\n为了很好地爱护自己手中的武器，充分发挥它最大的威力，这里給大家介紹一些有关的知识。\n\n#### （一）步枪的擦拭、上油\n\
    \n步枪应当經常保持完好与清洁，并且按照下列規則擦拭。\n\n- 1. 擦拭枪的時間。在射击、作业以及執行勤务后，应当在不全分解的状态下擦拭。污垢過多或被水浸湿时，就应当在全分解的状态下擦拭。如果放置未用，每十\
    \ 日擦拭一次。\n\n- 2. 擦拭的順序及方法:\n\n擦拭枪膛，在通条上的孔内穿以适量的布条，将枪垂直夹在两腿之間，把通条插 入枪管内，左手握住枪管前部，使枪托抵在牢固的物体上，右手握住通条一端，沿枪管来回拉动通条，而后更換布条，再按上述方法擦拭，直到清洁为止。擦拭时注意不要磨損枪口，弹璺和坡膛也用同样方法擦淨。\n\
    \n擦拭机槽，用缠有洁净的布条的小竹签擦拭，对沟、槽、键和 圓孔等部分，要用削尖的小竹签擦拭，然后用擦枪布擦拭。\n\n擦拭枪机，执行任务后，应在不分解状态下擦拭，在野外实施作业及射击后，则在分解状态下擦拭。\
    \ 对枪机的各部分要用干布擦拭，有烟垢的部分，先涂油再用干布擦拭。\n\n擦拭弹仓，要用缠有擦枪布的小竹签擦拭，在擦拭弹仓盖的候，不要取下枪机。\n\n通条、木托、上护木和各种螺丝，都应当用干布擦拭。\n\
    \n所有机件擦净以后，要在金属部分上涂上黄油，并结合检查各部机件机能是否正确。之后再擦净及整理好附属品。\n\n#### （二）步枪保管的方法\n\n- 1.\
    \ 条件许可，最好是放在枪架上，没有枪架，应当放在或挂在方便与安全的地方（离门窗及火灶远些），并且将枪机关闭，扣引扳机。\n\n- 2. 行动的时候，以肩枪或托枪的姿势携带。\n\
    \n- 3. 在野外带枪工作、劳动或操作休息的时候，要利用枪圈实施架枪或将机柄向下放在地上。\n\n- 4. 作业、执行勤务和工作、劳动前，要先检查武器，作业和工作中，不要使枪沾上泥土、砂子和灰尘；在射击前后都要擦拭枪膛，任何时候都不要使枪跌落或碰在硬的物体上，尤其是枪管、准星和表尺，更应当爱护。\n\
    \n- 5. 任何时候都不要堵塞枪口，以防止枪管生锈和射击时枪管膨胀和爆炸。\n\n- 6. 在拉开枪机和推子弹上膛的时候，如果遇到障碍，不要猛拉硬推，应当查明原因，排除故障。\n\
    \n- 7. 乘坐车辆的时候，将枪夹在两腿之间，以免碰坏。\n\n### 三、射击动作\n\n#### （一）射击预备\n\n- 1. 装退子弹。\n\n\
    - (1) 装子弹动作：开枪机——右手小指与无名指最后关节部分托住机柄，手指半屈，用力向左，向后拉开。\n\n43\n"
  mdcn: "\n击后，必須及时的对人员、武器和地面所沾染的放射性物質和毒剂，进行清除和消毒。\n\n放射性物質的特点是不能用化学薬品消灭，用火也烧不掉，但是会慢慢滅弱和消失放射性。因此，可以用拍、打、刷的方法来清除掉，或者把沾染物質割除、掩盖、隔离。毒剂可以用消毒剂消毒，也可以用割除、掩盖、火烧、水冲洗等来洗消，利用破布、棉花之类，蘸上煤油、汽油、酒精及植物油、肥皂水擦拭，也可以。\n\
    \n### 洗消的方法怎样\n\n#### 对人員的洗消：\n\n对于人員沾染的洗消，在沾染地内，可以先擦去能看見的灰尘，或者用吸水性較好的破布、棉花，吸去有毒的液滴，然后用沒有沾染的水（如水壺里的水）冲洗，或者用没有沾染的水浸湿毛巾，消毒棉花，擦拭暴露的皮肤。擦拭的时候应当順着一个方向多次进行，并且不断轉动或更換毛巾、棉花球。如果没有戴防毒面具，对于面部也应当冲洗、擦拭，并且用沒有沾染的水漱口、挑鼻。所有揉脏了的棉花球、破布、毛巾，应当挖个小坑埋掉。\n\
    \n人員离开沾染地面后，还应当用肥皂水再仔細冲刷一遍，眼、鼻、口腔等处，更要特別注意冲洗干净。有條件的話，最好洗一个澡。\n\n对于染上毒液的皮肤，可以用个人消毒包的消毒剂进行局部消毒。\n\
    \n#### 对武器和服装的洗消：\n\n对武器的洗消，可以先用紗布、棉花吸去表面液滴，然后用沒有沾染的破布、棉花做成破布团，蘸上沒有沾染的水或煤油、汽油等，仔細擦拭。有条件的話，应当用水冲洗，用汽油、煤油洗滁另件。\n\
    \n![](img/b41346f815189f79888890b5225a828a_34_0.png)\n\n図20 自己或相互拍打掉放射性灰尘\n\n\
    ![](img/b41346f815189f79888890b5225a828a_35_0.png)\n\n対服装的洗滁，如果是染上毒剤，可以用个人消 毒包进行局部消毒，或者用日晒、风吹、蒸煮、用水冲洗等方法\
    \ 进行消毒；如果是放射性沾染，就应当仔細地拍打，抖動或者 用水冲刷掉(図20)。\n\n対地面的洗滁：\n\n対受沾染的地面，可以将沾染的土层劃除掩埋，或者蓋上\
    \ 一层新土，沙子、草皮、树枝、木板等，或者用水冲洗。対染上 毒剤的地面，除了上述办法外，还可以用火烧。至于工事、墙 壁等地方，可以用湿扫帚、湿稻草或者抹布等仔細打扫、擦滁。\
    \ 対壘壕内、掩体内停留的毒气，可以抖動被单，将毒气敲出。\n\n対食物和飲水的洗滁：\n\n对于沾染或染毒的食物，去掉表面一层即可，如果沾染、 染毒过多，应当抛掉。\n\
    \n对于沾染或染毒的水，可以用澄清、煮沸或者蒸瀆法洗 滁。澄清法是把水静放10~15小时(如果加入凝聚剂等化学 物質，時間可以縮短)，沾染物質和毒剤就会沉淀，把上層水吸\
    \ 出(下層水不可以用)，再煮沸就可以了。\n\n經過洗滁后准备食用的食物和水，必須經過专门檢驗，才 准飲用。\n\n30\n\n## 射 击 训 練\n\n\
    ### 一 步(騎)枪的构造和战斗性能\n\n射击是軍事知識的基本内容之一。学习射击,具有精确掌握手中武器的本領,就能在战斗中以准确的射击杀伤和歼灭敵人,取得战斗的胜利。\n\
    \n现在各地民兵使用的步(騎)枪,有几十种,很复杂,这里仅介紹几种数量較多的,“七·六二”、“六五”、“七九”三种步(騎)枪于后。 因为步(騎)枪的构造原理,使用方法以及战斗性能等,大体上是相同的。\
    \ 能够了解和掌握了这几种主要的步(騎)枪,其它也就能掌握和使用。\n\n#### (一)七·六二步(騎)枪\n\n现在使用的七·六二步(騎)枪有两种,一种是\
    \ 1891/30 年苏式步枪,另一种是1944年苏式騎枪。 两者的区别只是重量不圈(步枪4.5公斤,騎枪 3.9 公斤),枪管长度不同(步枪带枪刺 180\
    \ 厘米,騎枪帶枪刺 133 厘米),枪刺不同(騎枪是折迭式的),其它战斗性能和构造原理等是相同的。\n\n苏联造的1944年式騎枪,我国于1953年制造成功,命名为1953年式七·六二毫米騎枪,简称53式七·六二騎枪(图劃),这种枪构造簡單坚固,不容易发生故障,使勿力太,命中精度特別良好。是过去战争中世界上最优良的步兵武器。从下列\n\
    \n![](img/b41346f815189f79888890b5225a828a_37_0.png)\n\n### 图21 七·六二骑枪\n\n表中可以看出它的特点：\n\
    \n| 区分 | 58式七·六二骑枪 | 三八式六五步枪 | 二四式七九步枪 |\n| :--- | :--- | :--- | :--- |\n| 口径\
    \ | 7.62毫米 | 7.5毫米 | 7.9毫米 |\n| 枪全重 | 3.9公斤 | 3.9公斤 | 4.08公斤 |\n| 枪全长 | 1330毫米\
    \ | 1280毫米 | 1160毫米 |\n| 枪管长 | 550毫米 | 780毫米 | 597毫米 |\n| 瞄准基线长 | 416毫米 | 685毫米\
    \ | 504毫米 |\n| 枪刺长 |  | 500毫米 | 425毫米 |\n| 膛线 | 4条，右旋 | 4条，右旋 | 4条，右旋 |\n| 初速\
    \ | 820米/秒 | 762米/秒 | 810米/秒 |\n| 最大射程 | 3000米 | 2400米 | 2000米 |\n| 有效射击距离 | 600米\
    \ | 600米 | 600米 |\n\n1. 步（骑）枪的用途。七·六二骑枪和其他步（骑）枪一样，是步枪手的基本武器，用火、枪刺和枪托杀伤敌人，它是杀伤单个生动目标（暴露的、伪装的、移动的和短时间隐显的）最有效的武器。\n\
    \n在400米以内可以获得最大的射击效果；集中火力可以杀伤1,000米以内的集体目标；在500米以内可以射击飞机和伞兵；使用带瞄准镜的狙击手，可以在800米以内杀伤敌人的生动目标。有折迭式枪刺，在战斗中使用方便，特别是在整壕、建筑物和森林中以及在超越各种障碍时更方便。\n\
    \n2. 一般构造和使用。全枪由枪管、机槽、枪机、弹仓、木托及上护木、枪刺六部分组成。\n\n装子弹的方法：向左转牙机柄；向后拉开枪机到尽头，装上弹夹，压下予弹并擲去弹夹，向前推回枪机；将机柄转到右方。\n\
    \n退子弹的方法：向上向后打开枪机退出第一发子弹后；压其余子弹向下，打开弹仓盖取出子弹。\n\n击发：扣扳机即行击发。\n\n关保险：将机尾向后拉到尽头转向左方即可。\n\
    \n3. 分解结合。步枪分解结合是为了擦拭、上油、排除故障或检查。分解结合的时候，应该注意在桌子、凳子或板子里进行，如果在野外，应当在清洁的垫布或衣服上实施；卸下或装置机件的时候；应当格外小心，以免损坏；分解的各机件要按顺序放好，以免混杂或损失。\n\
    \n- 分解的步骤如下：\n  取下枪机——左手食指扣扳机，同时右手打开枪机，并随后拉（图22）。\n\n  拆迭枪刺——将枪托放在地上，枪面向内，左手握枪口部分，右手将枪刺管向上拔起，使驻笋孔离开枪口后，\n\
    \n  ![](img/b41346f815189f79888890b5225a828a_38_0.png)\n\n  即向右折下枪刺，使其刃部纳入下护木内(图23)。\n\
    \n  旋出通条——右手向左旋转并向上拔出。\n\n  取下弹仓盖——用右手食指按下弹仓盖卡笋的按钮并打开弹仓盖，然后以拇指压紧托弹机，从摇摆螺上取下弹仓盖。\n\
    \n  分解枪机——左手握枪机，拇指推机柄，食指扳机头，右手拉开机尾，拉的时候要使螺形突出部的扣突脱离凹槽，击发阻铁突笋不要从连接叉内滑出，然后将机尾\n\n\
    \  ![](img/b41346f815189f79888890b5225a828a_39_0.png)\n\n  转向左方 拉(图24)。\n\n  右手握机尾，左手向前推动连接板的机头，而后取下，并从连接板上卸开机头。\n\
    \n  分解机尾的时候，垂直放置机体，将撞针尖抵在木板上，左手压下机柄，尽力压缩撞针簧，右手向\n\n  ![](img/b41346f815189f79888890b5225a828a_39_1.png)\n\
    \n  ![](img/b41346f815189f79888890b5225a828a_39_2.png)\n\n  左方向旋下机尾，左手慢慢放松在机柄上的压力，取出撞针及撞针簧（图25）。\n\
    \n  ②结合：按分解的相反顺序进行。\n\n  结合枪机——将撞针簧套在撞针上，并装入机体滑孔内；垂直放置机体，将撞针尖顶在木板上，左手压下机柄，右手将机尾摉在撞针上，慢慢放松在机柄上的压力，将机尾螺形突出部放在机体的螺形缺口内，用解锥的大缺口转动撞针（图26），以对准机尾钮上的刻线。\n\
    \n  ![](img/b41346f815189f79888890b5225a828a_40_0.png)\n\n  ![](img/b41346f815189f79888890b5225a828a_40_1.png)\n\
    \n  左手将机头装在连接钣管上，向右撞到尽头，右手把撞针插入连接钣管的滑孔内，机头扣簧进入机体槽中，用解锥的缺口检查撞针突出的程度，撞针尖能通过解锥的第三缺口（上面注有95），不能通过第二缺口（上面注有75）为最好（图27），再检查退弹钩和击发阻铁缺尖笋是否磨损，连接钣是否弯曲。\n\
    \n  左手握机柄，食（中）指探机头，右手拉机尾向后向右旋转，使机尾螺形突出部扣簧进入机体凹槽内。\n\n  装弹仓盖——左手握枪，右手压紧托弹槽，使弹仓盖的缺\n\
    \n  口卡佳弹簧的搖摆螺栓，然后放松托弹机，盖上弹仓盖。\n\n  捧上通条———将通条插入通条槽內，擰紧。\n\n  打开枪刺———将枪托放在地上，左手握枪口部分，右手将枪刺管向下拉，然后从右向\
    \ 上 轉开枪刺到尽头，使駐彈孔套在枪口上。\n\n  裝上枪机———左手握枪頸，食指扣扳机，右手装上井关上枪机。\n\n#### 4.故障的預防及排除的方法。\n\
    \n| 故障現象 | 故障发生的原因 | 排除方法 |\n| :--- | :--- | :--- |\n| 将子弹装入弹仓时弹仓盖自行脫开 | 彈夹盖卡鈀齿損坏或螺絲松勭\
