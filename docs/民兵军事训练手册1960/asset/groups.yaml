    # 再版說明


    為了適應廣大民兵普遍學習基本軍事知識的需要，我們曾於1959年3月編寫了一本“民兵軍事訓練手冊”，由中國青年出版社出版。現在根據全國民兵的組織和軍事訓練的發展情況，我們在原來小冊子的基礎上，又增加了部份的內容，同時對原來的內容也作了些刪改，在內容的順序上，亦按著訓練實施步驟，作了必要的調整。


    這本小冊子，內容較充實，是每個民兵應該具備的基本軍事知識，可供_factory、公社區、學校和機關的民兵教員，教授共同課目的基本參考材料，也是廣大民兵自學和覆習的課餘讀物。


    1960年3月'
