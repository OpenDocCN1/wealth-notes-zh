    我們平常用煤烧飯，用炸药开矿，都只是利用原子间电子的相互作用和变化而发出的热能，与原子中间的原子核毫无关系。


    ![](img/b41346f815189f79888890b5225a828a_19_0.png)


    但是原子核里蕴藏着巨大的能，叫原子能。原子核分裂的时候，就放出原子能，它的能量，要比电子间相互作用和变化放出的能量起码大一百万倍。例如，一斤煤燃烧所产生的热，可以做一个人的饭，那么一斤煤的原子核的分裂所放出的热，至少可以做一百万人的饭。但是，目前人们还只能用人工控制镭原子等少数原子核的分裂，而大多数原子是很难分裂的。


    ![](img/b41346f815189f79888890b5225a828a_19_1.png)'
