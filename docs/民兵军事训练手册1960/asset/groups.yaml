    ## （三）原子、化学武器防护的方法


    ### 对面部的防护方法


    毒剂、放射性灰尘随呼吸道进入人体后，伤害是严重的。因此，必须很好地对面部（包括呼吸道和眼睛）进行防护。这方面的防护器材有以下几种：


    - 1. 防毒面具：是防护呼吸道和眼睛的主要器材，由面罩和滤毒罐组成（图6）。面罩能够使面部与染毒空气完全隔绝；有毒的空气经过滤毒罐过滤后，变为无毒空气，然后经过导气管进入面罩供人呼吸。戴面罩的动作是，一发现有毒气或放射性沾染，应当立即屏住气，闭上眼睛，迅速戴上面具；戴上后先用力吹一口气，将面罩内有毒的空气吹出，然后睁开眼睛。动作越快越好。


    ![](img/b41346f815189f79888890b5225a828a_26_0.png)


    - 2. 防毒口罩和防毒眼镜：防毒口罩（图7）是专门用来防护呼吸道的，和普通口罩差不多，只是里面加上棉花和碱类，有的浸过药液。平时用油纸包着，用时和防毒眼镜一起使用。防毒眼镜（图8）和普通防风护目镜差不多，但是戴上后非常密封。


    ![](img/b41346f815189f79888890b5225a828a_27_0.png)


    - 3. 如果没有防护器材，可以用毛巾（手帕）或脱下的衣服，蘸上水或尿（碱水更好），堵住口鼻，闭上眼睛，或者把口鼻贴在松软的泥土上，躺干草堆、木灰和锯木屑中，和缓的呼吸。这些东西都有吸收、隔绝部分毒剂的能力，可以减少伤害。


    ![](img/b41346f815189f79888890b5225a828a_27_1.png)


    在没有战斗任务的情况下，最好离开毒区。离开的时候，应当以缓步向上风方向走；切记不要惊慌和跑步，这样会加快呼吸，因而多吸去毒气。如果已经了解毒区不大，也可以屏住气一下跑出毒区。


    由于毒剂比空气重；所以森林、草丛和低洼的地方，很容易积聚毒气，放射性灰尘降落到这些地区也不容易被风吹散，因此，应该很快离开这些地方。


    ### 对皮肤的防护方法


    对于敌人布洒的液滴毒剂和原子武器爆炸后降落的放射性灰尘，不仅要戴防毒面具防护呼吸器官，还应该采取措施防护皮肤不受毒液的伤害。目前，常用来防护皮肤的器材有以下几种；


    - 1. 防毒衣(图 9.)，用橡胶布或者油布制成，専門的防化兵才配备这种器材。


    ![](img/b41346f815189f79888890b5225a828a_28_0.png)


    - 2. 防毒斗篷(图10)，用橡胶布、油布或者特种紙制成，主要是用于个人防护从空中落下的毒液和放射性灰尘；在通过染毒、沾染地区的时候，可以改成防毒垫使用。

    - 3. 防毒靴套、手套(图11)，用橡胶布或者油布制成，用来防护足部、手部。在走出或通过染毒、沾染地区的时候，都必须穿上防毒靴套。

    - 4. 沒有防护皮肤的器材时，可以利用雨衣、油布、大衣、毛毯、棚布、棉被、雨伞等代替防毒斗篷，或者躲避在屋内、树下，总之凡是能够遮蔽身体的，都能够防止毒液和放射性灰尘的伤害。用帆布手套、皮手套来代替防碍手套。用油紙、帆布、麻布等包扎在脚上代替防毒靴套。


    ![](img/b41346f815189f79888890b5225a828a_28_1.png)


    ![](img/b41346f815189f79888890b5225a828a_28_2.png)


    - 5. 在战斗情况下，通过染毒、沾染地区的时候，往往必须要在毒区内臥倒。如果没有専門的防毒垫，可以预先利用就便物资，如稻草、小树枝、蘆葦等来鋪制。一般宽度为70-75厘米，长度約130厘米，厚2-6厘米，在距上边10厘米处和距下边三分之一处，加两根木杆，并且作两个提把（图12）。使用的时候，右手持枪，左手提防毒垫的两个提把，随队倒将防毒垫铺在地上。然后身体卧在防毒垫上，通过寨区后抛掉掉。


    ![](img/b41346f815189f79888890b5225a828a_29_0.png)


    图12·用应用器材编造的防 毒 垫

    甲、用稻草头编造的 乙、用置塞铝编的 丙、用小树枝编造的


    ### 防毒掩蔽部


    防毒掩蔽部是集体的防护器材，可以同时防护许多人免受原子、化学武器袭击的伤害。它有通风式的和不通风式的两种。通风式的防毒掩蔽部内装有滤毒通风机，可以持久的防护；不通风式的主要是密封，不使有毒空气进入掩蔽部内。


    坚固的地下室、防空洞、地窖和密封的房子，都可以改装成防毒掩蔽部。防毒掩蔽部必须耍：1、坚固，以便可以抵挡炮弹、炸弹和原子武器爆炸后冲击波、光幅射、贯穿幅射的伤害；2、密封，以便防止毒气的侵入。防毒掩蔽部最好有门，并且在人员进入的时候不要同时打开，这样才能更有效的防止染毒空气的侵入。


    ### 在原子、化学武器袭击下的战斗动作


    - 1. 听到（看到）原子、化学武器袭击警报信号的时候，应当将个人防毒器材作好“准备”，同时继续执行战斗任务。

    - 2. 敌人化学武器袭击的时候，听到“戴面具”或“毒气”的口命令后，迅速戴上防毒面具，如果敌人施放毒液，还应当披上防毒斗篷。如果是在战斗准备阶段，可以根据指挥员的命令，留下观察员和警戒员继续监视敌人，其余人员进入防毒掩蔽部，或暂将掩盖下隐蔽（但是还需要戴面具）。

    - 3. 原子弹爆炸的时候，一发发强烈的闪光，应当不待口令，毫不犹豫的立即进入距自己跟前三两步内的各种掩蔽地。因为从原子爆炸闪光起到冲击波的到达还有几秒钟的时间，还来得及在几步内进入掩蔽地。


    断壕、坑穴、沟渠、弹坑、小土堆或土堤、坚固的墙壁后，都是很好的掩蔽地（图13—16）。如果两三步内没有掩蔽地，千万不要惊慌，乱跑，应当立刻趴倒，脚向爆炸点，脸朝地面，两眼紧闭，两手弯曲放在脚下，如图17，这样也可以减少冲击波、光辐射的伤害。


    冲击波过去后，应当立即戴上防毒面具，穿防毒靴套，戴防毒手套，继续执行战斗任务。


    - 4. 通过染毒、沾染地段，通过前应当准备好防毒垫，戴好防护器材（面具、靴套、手套）。在敌火力下通过的时候，一般是采取分组跃进的方法。有时在毒区内被迫不能前进时，应当挖掘掩体，保护自己。通过后，根据指挥员的命令，丢掉防毒垫，脱下防护器材，然后继续前进。


