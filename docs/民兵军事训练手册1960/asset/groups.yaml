    1. 埋设地雷位置的选择：在战术上容易吸引敌人，如村巷、通道、阵地前死角、主要交通路附近、森林和敌人便于利用的地形地物，在技术上便于伪装及作业的地方，如草地、乱石地、坟堆、土堆、青苗地等。


