    方是迫击炮，枪身近似平的是重机枪。


    (2)根据各种征候判别敌人的兵种。尘土低而浓，运动缓慢，是步兵。尘土高而淡，运动迅速，是骑兵。尘土高而浓，所断續的，是炮兵。尘土飞扬，运动特别迅速，是汽车。


    夜间可以根据声音来判别，从远方来的均等的“沙沙”声，是步兵部队。骑兵可以根据马蹄声判明。笨重的铁器磨擦声和炮車的隆隆声，是炮兵。汽车、坦克、飞机等，根据摩托的响声可以判明。


    (3)村中人急奔走，树林、禾苗地鳥雀惊飞，鳥虫叫声忽然停止，是敌人接近的征候。


    (4)見到霧气狀的白云、微帶其他顔色的烟，或者炮彈炸声小、有上述形状的大量气体的时候，可能是毒气的征候。


    # 报告的方法和內容：


    报告的方法，可以用口头、规定記号、音响报告，远方观察哨可以带通信工具，如电話机、自行车和手旗等，用它来报告。


    報告的內容，時間，地点，方向，距离、兵力、兵种、兵器、敌人行动以及自己的位置。


    # 四 行 軍


    行軍，是使部隊按时到达指定的地点。行軍有两种；一是前进行軍，又叫向敌行軍，这是为了消灭正面敌人而采取的行動。二是背敌行軍，又叫撤退行軍，这是为了摆脱敌人而采取的行動。有的時候我們在敌人的翼侧行动，这炎行軍叫側敌行軍，它可能是前进，也可能是后退。


    行軍的組織。接受行動任务后，是否能順利地到达目的地，决定于行軍組織的好与不好。行軍的組織在一般情況下，


    138'
  - '[PAGE 144]


    应当注意减少部队力量的消耗，必须符合下述要求：


    1. 确定行军的目的。在目的没有确定前，不应该行动。确定之后，才能规定行军的队形、道路、警戒兵力、行动速度等。


    2. 应当选择比较隐蔽、便利运动的路线，确定大、小休息的地点，并且派出设营人员预先出发。


    3. 可能有敌情的时候，派出前方、侧方和后方的警戒。


    4. 为了防止敌机空袭，或者与地面敌人遭遇，可以将行军队形的前后距离，作适当的调整（增大或缩小），以便遇到情况的时候，部队能迅速展开进行战斗。


    行军的速度，依据道路、地形、敌情、气候、季节等来决定。正常情况下的行军，每小时五公里，有时为了完成战斗任务，采取急行军（也叫强行军），每小时可达七公里左右。


    出发前应该准备的事项。每个战士应该抓紧时间出发前的准备时间，作好下面几件事：


    1. 把装备整理好，带起来试试；不合适的立即修正，否则行军途中容易疲劳。零星东西、工作器具等不要忘记。


    2. 临时借住的民房，要仔细检查一遍，如有借用老百姓的东西，一定要送还，损坏了的一定要赔偿，并且报告上级。


    3. 如果行军途中有遭到敌人飞机空袭的可能，应该作好的装备。


    4. 出发前要多喝点开水，免得路上口渴；事先要大小便，免得在路上掉队。


    行军中应该注意事项。


    1. 在行军时，按次序一个一个的跟上，不要拉长距离或者掉队。距离拉长了，要大步跟上，不要跑，不要失掉连锁。夜间行军，要记清连号记号。


