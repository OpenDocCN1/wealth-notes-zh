    持防毒垫卧倒的要领，左脚向前半步，将防毒垫右下角在左脚尖前着地，躺在地上，同时右脚沿防毒垫右边向前一步，然后将身体卧翻在防毒垫上，出枪射击。起立的时候，身体向左侧，左手抓住防毒垫的上提把，以枪托支在防毒垫上将上体


    ![](img/b41346f815189f79888890b5225a828a_32_1.png)


    支起，跪左膝，同时右脚向前半步在防毒垫右边着地，左手抓住防毒垫下提把迅速起立（图18）。


    在毒区内挖掘掩体的动作要领是：侧身卧在防毒垫上（枪先放在防毒垫上，然后可放在翻过的地上），用圆锹先翻除地表面一层土，向下风方向投出，注意不得将土扬起，以免沾染别人和自己；然后用没有沾染的土修补胸墙（图19）。在挖掘掩体的时候，应当注意不间断的监视敌人。


    ![](img/b41346f815189f79888890b5225a828a_33_0.png)


    必须记住，在任何情况下，都应该以坚决，勇敢的行动，来完成战斗任务。任何时候，都不得因为防护敌人原子、化学武器袭击而停止战斗。


    ## （四）原子、化学武器袭击后的善后工作


    ### 什么叫洗消


    洗消就是消毒和消除放射性沾染的统称。为了使人员免遭敌人放射性物质和毒剂的伤害，在敌人的原子、化学武器袭

    '
  mdcn: '

    我們平常用煤烧飯，用炸药开矿，都只是利用原子间电子的相互作用和变化而发出的热能，与原子中间的原子核毫无关系。


    ![](img/b41346f815189f79888890b5225a828a_19_0.png)


    但是原子核里蕴藏着巨大的能，叫原子能。原子核分裂的时候，就放出原子能，它的能量，要比电子间相互作用和变化放出的能量起码大一百万倍。例如，一斤煤燃烧所产生的热，可以做一个人的饭，那么一斤煤的原子核的分裂所放出的热，至少可以做一百万人的饭。但是，目前人们还只能用人工控制铀原子等少数原子核的分裂，而大多数原子是很难分裂的。


    ![](img/b41346f815189f79888890b5225a828a_19_1.png)


    利用原子能来杀伤人畜、破坏物体的武器，就叫做原子武器。原子武器有两种：爆炸性原子武器和放射性战剂。


    什么是爆炸性原子武器？爆炸时的外暴怎样


    大家常听说的原子弹、氢弹，都是爆炸性原子武器。另外，还有原子炮弹、原子鱼雷、原子火箭、原子飞弹等（图2）。


    原子爆炸的时候，首先是发出比太阳光还亮许多倍的耀眼的闪光，接着是暴雷似的爆炸声，在几十公里远的地方都能看到和听到。空中接着升起一个火球，迅速扩大、升高，然后逐渐冷却，变成一团团的烟云，与地面上扬起的尘土连接在一起，形成一个原子爆炸时所特有的蘑菇状烟云。烟云能够上升到10～15公里的高空，然后随风扩散下降（图3）。


    ![](img/b41346f815189f79888890b5225a828a_20_0.png)


    ![](img/b41346f815189f79888890b5225a828a_20_1.png)


    图3 原子爆炸时的外暴：上、空中爆炸；下、水下爆炸


    ## 原子武器的杀伤破坏作用


    原子武器爆炸后，有四种杀伤破坏因素：


    - 1. 冲击波：冲击波是原子爆炸时最主要的一种杀伤破坏因素。这是由于爆炸后形成的一股气流，急剧地向四周扩张，就好像一阵猛烈的飓风扫过大地。冲击波的威力大、速度快，在二秒钟内就可到达距爆炸地点1000米（一公里）以外的地方。它能吹坏500米内的坦克；700米内的火炮；1200米内的汽车；并能把房屋树木推倒。被冲击波推倒的房子、吹毁的石块等，对人的伤害也很大。不过，距离爆炸点愈远，冲击波的力量就愈小；冲击波的速度再快，也还要有段时间。所以我们可以抓紧这极短的几秒钟时间，采取适当办法避免冲击波的伤害。例如趴倒在地面，躲入坚固的房屋和物体内等（图4）。


    ![](img/b41346f815189f79888890b5225a828a_21_0.png)


    图3 冲击波推进的速度和防倒情况


    - 2. 光辐射：原子爆炸所形成的火球，比夏天太阳光的强度还大许多倍，这就是光辐射。由于它的光线极强，可以烧着或熔化各种物资，引起火灾；照射到暴露的皮肤上，就会灼伤皮肤。


    肤；照到眼睛上，可以使双目暂时失明，等等。不过，光辐射的时间只有几分钟，也容易防护，任何能挡住光的东西，都可以防止光辐射的伤害。


    - 3. 贯穿辐射：我们检查身体的时候，往往用X光来透视肺部。X光是一种看不见的光线（也就是射线），这种射线穿透力很大，能穿过人的皮肤，把肺部显示出来。但是，使用X光透视身体的次数不能太多，每次照射的时间也不能太长，因为它能破坏人体内正常的组织作用；使人得一种放射线病，轻者发烧、头晕、恶心、全身无力，重者皮肤出血、毛发脱落。原子爆炸后的15秒内，也有一种极强烈的射线，这就是贯穿辐射。它比X光的穿透力要强得多，人身受到大量贯穿辐射的照射，同样也会得放射线病。


    贯穿辐射的威力半径比冲击波、光辐射要小，而且各种物体都能减弱它的威力（物体越厚减弱越多）。因此，能躲过冲击波、光辐射的伤害，那么受贯穿辐射的伤害也就不会太大。


    - 4. 放射性沾染：原子爆炸所产生的烟云和从地面扬起的灰尘，都带有放射性。这些物质随风飘游，降落到地面上、物体上、或者混在空气中和水中，这种现象叫做放射性沾染。沾染放射性的物质，也能够放射出看不见、嗅不出的伤害人的射线。人身体上沾染了放射性物质，或者由于没有戴防护用品，随着呼吸到人内部。也会得放射线病。皮肤上受了沾染还会引起溃烂、发炎，对于放射性沾染的防护，我们将在后面再谈。


    把含有放射性原子的混杂物製成液体或粉末，这就是放射性战剂。可以和毒剂混合，装在炸弹、炮弹、火箭、迫击炮弹内使用，也可以用飞机来布满。它的伤害作用，和原子爆炸后产生的放射性污染一样。


    ## （二）化学武器


    用毒剂（就是**人们常说的毒气**）制成的武器，叫化学武器。敌人使用毒剂的化学武器，有：化学炸弹、化学炮弹、化学地雷、毒剂手榴弹、毒烟罐、洒毒车和飞机布洒器等（图5）。


    ![](img/b41346f815189f79888890b5225a828a_23_0.png)


    毒剂施放后，呈气状、烟状、雾状和液滴状态散布在空气中、地面上、物体上或水中，人们呼吸了染毒的空气，吃了染毒的食物，或者皮肤上沾染了毒液，就会破坏人体内正常的组织作用，产生各种轻重不同的伤害：从个别器官的暂时刺激（眼睛流淚，打喷嚏）起，一直到全身中毒（呼吸困难、全身溃烂），严重的甚至死亡。


    ### 毒剂的种类和它们的杀伤作用


    毒剂按照它保持杀伤作用的时间，分为暂时性毒剂和持久性毒剂：一般气状、烟状、雾状的毒剂，只能使空气染毒，染毒使用的时间只有儿分钟到几十分钟，是暂时性毒剂；液滴状的毒剂，除了能直接伤害人外，慢慢蒸发的气体还可以保持致小时到数天的伤害作用，通常叫它持久性毒剂。


    毒剂按照它对 人、畜的毒害作用，分为以下四类（参照下頁附表一）：


    - 1. 全身中毒性毒剂：呈气体扩散在空气中，有的呈液滴状洒布在地面或物体上。这类毒剂的毒性猛烈，能使人、畜神经和血液很快中毒，发生痉挛（抽筋），不省人事，严重的以至死亡。

    - 2. 靡烂性毒剂：多为持久性毒剂，呈液滴状洒布在地面上、物体上、饮食中或水中。它的液滴能渗透衣服，使皮肤发红，起水泡，破裂溃烂；能伤害眼睛；它的蒸气被吸入体内，或吃了染毒的食物和水，能伤害肠、胃、肺。

    - 3. 窒息性毒剂：多为暂时性毒剂，呈气体扩散在空气中。窒息就是透不过气来。这类毒剂主要伤害人的肺部，引起肺水肿，使人呼吸困难，严重的以至死亡。

    - 4. 刺激性毒剂：为暂时性毒剂。呈烟状、雾状。这类毒剂包括催泪性和喷嚏性两种，主要是刺激人的眼睛和呼吸道，使人流泪、打喷嚏、咳嗽、流鼻涕、胸部阁痛甚至呕吐，难受得无法继缽战斗和执行任务，一般不会死亡。


    ### 敌人使用毒剂的征候


    在战斗中，除了有专门防化学兵来侦察敌人 是否使用化学武器外，我们从下列征候中也可以判断：


    - 1. 敌机机尾出现一至四条黑色带，这些黑色带迅速下降扩散，到达地面时好象下黄色小雨，就象飞机布洒农药一样；

    - 2. 敌人的炸弹、炮弹爆炸时声音轻微低沉，在爆炸地点出现白色或黄绿色、灰色烟云，在弹坑附近发现有油状液滴或斑点；

    - 3. 在敌人阵地前地雷坑附近，以及敌人车辆走过的地方发现有油状液滴或斑点；

    - 4. 早晨、傍晚、夜间，微风自敌方吹来的时候，发现有烟、雾吹来，或者嗅到特别的气味和刺激等；

    - 5. 当地景色如树叶、草丛等突然枯黄或变色，或者发现有毒死的小虫小鸟，同时嗅到有特别的气味和刺激。


