    2. 过河的时候要快，过去以后要慢；上坡要快，下坡要慢，以免拥挤和掉队。\n3. 行军中，对体弱、有病的同志，要帮助他拿些东西，发扬我军革命友爱的光荣传统。有病不能走的时候，要报告班长。\n\
    4. 在行军中无论是从前面或者后面传来的口令，都必须能清楚；并且确实、迅速的传到后（前）面去。\n5. 在大、小休息的时候，应该坐在路的一旁，不要乱跑。大、小便要到下风远一些的地方去，并且掩盖好粪便。\n\
    6. 发生了情况，要听从班长的指挥，没有命令不要随便乱动。\n\n## 五 宿营\n\n宿营，是恢复战士的体力，保持战斗力量。因此，必须便利部队安全的休息和隐蔽。宿营分营（居民地内）、露营（野外）两种。\n\
    \n选择宿营地必须注意下述情况：\n\n1. 能保证战士获得很好的休息，和具备一般的（喝水、做饭等）生活条件。\n2. 距离敌人近的时候；应该以适合战斗要求为主。距离敌人较远的时候，以适合休息为主。但是无论在任何情况下，都必须隐蔽，不被敌人、空侦察所发觉。\n\
    3. 要保证在发现敌情的时候，能够迅速展开投入战斗。\n4. 规定警戒位置和受敌陆、空袭击时各单位紧急集合地点、占领地区以及疏散地区等。\n\n战士到达宿营地以后应该作些什么？\n\
    \n1. 到达驻地以后，除班长分配的勤务工作外，应该立即打扫收拾住处。在指定的地点马上挖好厕所，不要到处大、小便。注意遵守群众的风俗习惯。临时借用群众的东西，一定要得到群众的允许。\n\
    2. 携带的武器，要放在适当的位置。\n3. 住地内、外打扫清洁后，再洗脸洗脚、擦枪等。事情做完后，要注意抓紧时间休息，不要乱跑。\n"
