    图16 原子爆炸时在墙后卧倒的姿势


    ![](img/b41346f815189f79888890b5225a828a_32_0.png)


    持防毒垫卧倒的要领，左脚向前半步，将防毒垫右下角在左脚尖前着地，躺在地上，同时右脚沿防毒垫右边向前一步，然后将身体卧翻在防毒垫上，出枪射击。起立的时候，身体向左侧，左手抓住防毒垫的上提把，以枪托支在防毒垫上将上体


