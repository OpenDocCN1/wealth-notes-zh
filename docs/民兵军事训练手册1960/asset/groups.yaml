    带的用具上，插树枝或青草。 疏密的程度应该注意和所利用的地形协调。 在围墙或棱线后边进行观察的时候，可以取下帽子减低目标；附近的草被火烧过，取下帽子就更加隐蔽了。


    (2)一切反光的东西，如刺刀、铁锹等，都应该确实隐蔽好，因为这些东西的反光，在两华里内就可以被看到。


    (3)停留不动的人，那怕是在比较暴露的地方，也不容易引起对方的注意。 因此，在观察位置上不要乱动。 转位地方的时候，必须注意隐蔽，以低姿从隐蔽物的后面运动，不要触动树枝、禾苗等，以免引起敌人的注意。


    # 观察的方法：


    进行观察的时候，首先应该记住观察区域内各种地形地物的原来情况，然后在自己的观察区域内，聚精会神的，有次序的、由近到远、由右到左、反复不断地进行细致的观察。
    如果发现同原来的情况有变化，应当特别注意，直到弄清楚为止。对每一个可能被敌人利用（运动或停止）的地形地物，须要特别注意。粗心大意，东看一眼前后一眼，一定会有很多地方被漏掉，甚至在已经观察到的地方，还不能发现所在的敌人。


    对禾苗、草丛、小树丛的观察，应该注意它的摇动情况，以判别是人触动的，还是风吹动的。 对山的顶界线，容易攀登的地方，必须通过的部分（如鞍部）及沟口、山脚等，都应当注意。对森林，应当仔细听各种声音，和周密的观察林空。
    对村庄、市街应当注意进出田、边沿、围墙和拐角的地方。 对屋顶、大树等，应当注意上边是否有人向我方观察。 对复杂地形，应该特别注意两种地形的结合部，如林沿、田畔等。


    # 识别目标和征候判断：


    (1)重机枪和迫击炮的识别。 在暴露障地内，炮身向前上


