    \ 140\n\n## 防空、防原子、防化学常识\n\n未来战争的样式，将是按电钮式的，这就是说，敌人在发动战争的时候，不是先将部队运出来作战，而是首先在他早已设置好的各种军事基地上，按电钮，发射导弹，射击他预先瞄准好的目标。因此，战争的突然性是很大的。帝国主义历来惯于背信弃义，使用突然袭击的手法。在导弹、原子武器、氢武器和化学武器时代，这种突然性就更大。美帝国主义，有所谓“战争最初六十天制胜”论，当然这是一种妄想。但他们采取这种手段，将会增大战争的突然性和破坏性，尤其是战争的初期，对政治经济军事文化中心、工矿重点和交通枢机地区，更是它主要的破坏目标。在袭击的同时，还可能对纵深地区实行空降，那时战争将没有前后方的分别。这样看来，我们民兵在和平建设时期，就应当提高警惕，防止帝国主义的突然袭击。\n\
    \n大家都知道，打仗要有武器，要有人，武器是人来制造和人来掌握的。因此人是战争中的决定因素，但也不能藐视武器在战争中的重大作用，尤其是原子、化学武器。因为它是一种大规模的杀伤和破坏性武器。它对于部队的战斗行动、后方补给、交通运输和人民的生命财产等等，都会有很大的影响。这就需要我们在和平建设时期，经常做好对现代武器的防护准备工作，进行深入的政治动员，构筑必要的防护工事，组织好对空的观察和通讯联络系统，及时获取敌人空中的情况。俗话说得好：“有备无患”。只要在平时做好准备工作，一旦帝国主义挑起重战争、发动突然袭击，就能够及时采取有效措施，避免或减少损害。\n\
    \n## 一 防空常识\n\n每一个民兵，特别是海、陆边防地区的民兵，都应当懂得如何对付敌人的飞机、空降部队和空降特务。因为，这种情况不论在战时或平时都经常会遇到的。\n\
    \n### （一）飞机的识别\n\n为了及时发现敌人的飞机，首先要学会识别敌方和我方的飞机。识别的方法，主要是根据标志。各国飞机在机翼、机身和尾部都涂有不同的标志。如苏联飞机的机翼、机身涂有红五星；我国飞机的机翼、机身涂有嵌着“八一”字样的红五星，两边各带一条红杠，机尾有两条红杠；美国飞机的机翼、机身涂的是白五星，两边各带一条白杠夹红条；国民党飞机的机翼、机身涂的是青天白日“党”徽，机尾是蓝杠夹白条。但是敌人有时候也伪用我国标志来欺骗我们，所以应该警惕。\n\
    \n根据飞机声音的不同，可以辨别出飞机的种类，各种不同的飞机的声音特点，大致如下：\n\n-   侦察机——一般不作激烈飞行姿态，声音平和柔软；\n-  \
    \ 驱逐舰——飞行姿态变化甚多，声音强硬，而且忽高忽低，有时像巨响，有时轻得听不到声音；\n-   轰炸机——声音像载重汽车载量过度，或者爬山坡的时候所发出的哧嗒声；\n\
    -   运输机——飞行较慢，声音沉重，有如雷鸣，但比轰炸机严密些。\n\n### （二）疏散、隐蔽、伪装\n\n敌机袭击的时候，只要沉着应付，隐蔽起来，伪装得好，就不容易被炸伤、打伤。对付敌机的隐蔽和伪装方法，原则上和对付地面上的敌人一样，就是尽量利用地形、地物把自己隐蔽起来，使敌人看不见、找不着，一有机会就设法消灭敌人。不同的只是：对付敌机要隐蔽的是上方，对付地面敌人要隐蔽的是前方。\n\
    \n#### 疏散\n\n疏散的用意有两个，一个是减小目标，因为把大队疏散成小队或个人，敌机就是发现了也不会重视，看不出我们有多少人，不知向什么地方投炸弹、打机枪。最低限度可以分散敌人的注意力。另一个是疏散开以后，就是敌机投炸弹、打机枪，受伤的不过是极少数的人，或根本伤不着人。\n\
    \n行军的时候，如果遇到敌机，应当根据当时地形和指挥员的口令，以组、班或排为单位有组织地散开。在平地上，散开后就应立即面朝南向下队；在田地附近，就扑在稻沟里，总之越躲在低的地方越好。躲低是为了减小目标，使敌机不容易发现，不容易扫射到，就是有炸弹投下来，弹片也打不着。\n\
    \n#### 隐蔽\n\n隐蔽就是利用自然的地形、地物，或构筑工事，把自己隐蔽起来，使敌人看不见，打不着。隐蔽的方法是千变万化的，主要是靠自己根据当时当地的具体地形、地物，灵活运用。\n\
    \n-   1、单人用的防空洞，应分散配置，两个相距一般要在12米以上，分布成梅花桩形或波浪形，这样才不致同时受到损害。\n-   2、防空壕，先挖一人或大半身深，再紧贴底斜向里挖，洞的大小以人能蹲进去，头不露出就行；如果挖得深些、宽些，能躺下一个人更好。为了避免敌机侦察，必须用树枝、杂草等伪装起来。\n\
    -   3、利用自然的地形、地物。可作隐蔽的自然地形、地物很多，如山坡、土坎、树林、沟渠、天然洞穴、村庄、庄稼等，都可以按照当时的情况灵活运用。树林本来是很好的隐蔽地方，尤其是隐蔽运输车最合适。但是小树林往往是敌机扫射、轰炸的目标，最好不去利用。在村庄附近，敌机来袭击的时候，可以进入乡村隐蔽，因为田野上到处都是乡村，敌机发现不出目标。接近战线和交通要道附近的乡村不要利用，最好在山坡、道沟或其他容易隐蔽的天然地形上分散隐蔽。在小城市附近，估计敌机可能来轰炸时，要离开房屋院墙处再隐蔽，以防建筑物倒塌伤人。\n\
    \n#### 伪装\n\n伪装包括两种不同的意义：一是把真的装成假的；二是把假的装成真的。如明明有人，伪装好了叫敌人看起来像没有人一样；明明没有车马，作些假车马叫敌人看起来像有车马一样。伪装是为了帮助隐蔽，所以在隐蔽的时候最好加上伪装。\n\
    \n1. 日间伪装。在战场上的车队、武器、工事，必须利用周围的环境，和色调一致的自然植物（稻草、树木、杂草、伪装网等）加以伪装。伪装的时候应注意以下几件事：\n\
    \n-   尽量避免在敌人空袭时活动——当敌机来空袭的时候，不要慌张乱跑，否则容易被敌机发现目标。如果头上带着树枝作的伪装帽，敌机来时在路上乱跑，以为伪装好了敌人看不见，其实在空中一看，地下长出了许多活动的小树木，太奇怪了，就知道一定是目标。\n\
    -   特别注意各个方面的伪装——从头上到身上、携带的武器和物品，都要进行伪装，并且应颜色调和。如果仅伪装了头部，而身体其它各部和枪械、刺刀、水壶等，没有与头部取得一致的颜色，那是很容易被发现的。\n\
    -   要与附近环境的色调一致——如果是下雪天或是在雪地行动，就要伪装成白色（可将棉衣反过来穿或用白色的伪装服等）；如果在黄土的地面上活动，就要用黄色的东西（如稻草）来作伪装。\n\
    -   注意利用地形、地物，半隐蔽半伪装——能完全隐蔽妥善，当然是防空最好的办法，但是在战场上常常没有这么好的条件，因此，半隐蔽半伪装是非常需要的。可以半隐蔽的地方（沟、坑、树、竹、堤、坝、战壕、弹穴等），应当与伪装配合利用。\n\
    \n2. 夜间伪装。夜间发现目标比较困难，但对于醒目的目标，白色或反光物（白色衣服、白粉墙、玻璃等）很容易发现，尤其在明月之夜，这些目标，应当特别注意遮蔽，和避免使用。\n\
    \n预备警报发出后，应该熄灭一切灯火，如因工作需要，则应将门窗用黑布遮蔽起来，不使光线外露。\n\n### （三）防空降\n\n**怎样打伞兵？**\n\n\
    伞兵能超越我军队面上的抵抗，降落在我后方要点附近，对我方的飞机场、工厂、仓库、据点、机关等施行扰乱和破坏，或者降落在我阵地后方，协同其他地面部队向敌方进攻，或者降落在海岸线附近，占领滩头阵地，接应登陆部队。但因孤军深入，得不到群众的支援，补给联络困难，地形生疏，而我国军民一家，全民皆兵，因此很容易被我们消灭。\n\
    \n伞兵的特点是：\n\n-   1. 降落一般选择在开阔地，或公路大道连接点附近。\n-   2. 伞兵跳伞降落，通常选择天气晴朗、不刮风的日子，有时也利用夜间降落（多在月夜，没有月亮时利用照明器材）。\n\
    -   3. 伞兵自飞机向下跳的高度，一般为800米，也有低至300米左右降落的。伞兵从600米高度下降，大约90秒钟就可着地（一般每秒下降5-6米）。降落的时候，通常先用战斗机在降落地上空掩护。\n\
    -   4. 伞兵着地后，通常都须立即奔赴预定集合地或公路连接点。\n-   5. 伞兵也有化装成便衣伪装成我方兵员降落的。\n-   6. 伞兵着落种类，有分散着落及一处和多处着落等几种。有时先投若干假人于地上，引起我部队出动后，再在另一地点，突然跳伞降落，或在低空散布烟幕掩护降落。\n\
    \n**怎样打伞兵？**\n\n-   1. 打伞兵要沉着、勇敢、迅速。在敌伞兵降落尚未着地的时候（在半空中），一面使用高射机枪、高射炮射击运输伞兵及担任掩护的敌机，一面对下降的伞兵用机关枪扫射及步枪齐射，在未着地之前消灭他们。\n\
    -   2. 在伞兵着地集中后，因为他对降落地区不熟悉，接济困难，可以用普通进攻作战的方法，抓紧时机，迅速歼灭。\n\n**如何歼灭空降特务？**\n\n\
    敌人派遣特务的方法有两种：一种是从沿海、边境我防务薄弱或者是空降地带偷偷摸摸地潜进来；一种是用飞机载运特务空降到我国内地。因此，我们除加强海防、边防和地方治安外，还当组织对空警戒，以便及时发现敌人的空降特务并且把它消灭。\n\
    \n**特务空降时候的一些征象：**\n\n1. 装载特务的飞机要在某地空降的时候，首先要在800米左右的低空盘旋，选择跳伞点。盘旋以后，即降至五、六百米（最低三、四百米）的空中，开始跳伞降落。\n\
    2. 空降特务与空降伞兵不同，它降落的地点一般不选在大道或机场、城市附近容易被人发觉的地方，而多选择在人们不太注意的偏僻地方，如山地区、森林区、村落稀疏点等。\n\
    3. 空降特务的时间大都在黄昏、拂晓，或者是夜间，白天如果疏警或疏忽，亦可能空降。\n4. 空降的特务，时常预先与地下隐蔽的特务匪徒有联系。空降的时候，地下的特务匪徒即配合放信号。特别是在夜间，地下特务常以放信号枪、烧野火、装有彩色灯光等办法，指引空降特务。\n\
    \n**对空警戒：**\n\n要想消灭空降特务，必须有周密的对空警戒，才能及时发觉。对空警戒应该根据地理条件和民兵组织情况，明确划分警戒区域。各警戒区应该选择适当地点，设立对空监视哨，规定警报信号（如打鼓、烧火、鸣枪等），并且建立与友邻部队通报情况的制度，制定实施戒严的方案。\n\
    \n对空监视哨，除注意白天监视外，要特别注意黄昏、拂晓和夜晚的警戒，因为这些时候常是敌机空降特务的有利时机。晚上警戒应该禁止喧哗、吸烟和睡觉。监视哨发现有敌机来的时候，要察明飞机来向和去向，辨别飞机上的标志，注意飞机在何处盘旋，并且把这些情况及时向上级报告。当发现敌机低空盘旋的时候，不仅要严密监视敌机有没有空降，而且要严密注意地面有没有隐藏的匪徒放信号与敌机联络。\n\
    \n现敌机空降特务，应该迅速发出紧急警报。\n\n一般民兵、群众，如果发现敌机空降特务或者其它可疑情况，也应该迅速向有关上级报告。\n\n**遇到敌机空降特务时候的处置：**\n\
    \n1. 发现敌机空降特务，应该迅速组织力量前往空降地区，搜剿；同时迅速通知友邻；报告上级及附近驻军派人围剿。\n2. 当敌人空降特务着地后，应该按照划分的警戒区域戒严，动员群众配合民兵四出巡逻，严密封锁，防止特务逃跑、分散隐藏。一发现空降特务，就要坚决、勇敢、迅速地消灭之。在战斗中应该注意利用地形地物，不要混乱和拥挤。如果因我兵力限制不能立即消灭空降特务，应该将敌人包围，待增援部队到达后，共同消灭。在警戒的时候要严格注意被管制分子、潜伏的反革命分子等的活动。\n\
    3. 围剿特务的民兵，如果是两个不同建制单位，应该组织统一指挥部，加强通信联络，密切协同动作；配合作战，切忌各自为战，互不联系，特别不应该争功争战，以妨碍作战任务的完成。\n\
    4. 到达空降特务着地点，如果特务已经逃跑，应该细心观察敌人的各种痕迹，判明敌人可能逃跑的方向，组织力量跟踪追击，务必作到全部彻底干净消灭空降特务。\n5.\
    \ 在搜剿的时候应该提高警惕，注意敌人化装我方人员来欺骗我们。必须认真盘查行人，严格清查户口；将来历不明的分子，送交上级审查处理。\n6. 夜间搜剿困难，可以严格戒严，层层包围，待天明后有指挥有计划地进行搜剿。但是在有月光的时候，就不一定要等天明后才进行围剿。\n\
    7. 战后注意事项：①对已经被我俘获或者是自动放下武器的空降特务，应该注意俘虏政策，不得随意搜腰包或侮辱他的人格。②俘虏的空降特务，应该迅速解交上级审讯。③在战争中缴获的一切物品，禁止损坏、打埋伏，必须送交上级处理。\n\
    \n## 二 防原子、防化学常识\n\n现代条件下作战，必须对原子、化学武器，采取可靠的防护措施。原子、化学武器并不可怕，只要我们了解了这种武器的性能和特点，是能够防护的，在战争中是可以避免或减少伤亡的。大家都知道，帝国主义特别是美帝国主义，正在集中力量研究和制造原子、化学和细菌武器。他们在侵略朝鲜战争中曾大量使用过化学和细菌武器，也曾在台湾海峡地区指挥蒋介石集团使用过导弹和化学武器，这就不能不起我们高度的警惕。为此，我国每一个民兵同志，都必须学会对原子、化学武器的防护知识，并且熟练的掌握它，一旦帝国主义挑起战争，就能够粉碎敌人原子、化学武器的袭击。\n\
    \n### （一）原子武器\n\n什么是原子武器呢？要了解原子武器，必须先弄清楚什么是原子能，什么是原子。\n\n我们周围的一切东西，都是由极微小的原子组成的。原子小得很，用倍数最大的显微镜也看不见它。原子本身则是由更小的原子核和电子组成的。原子核由质子和中子构成，位于原子的中心，重而极小，电子则按照一定的规律，不停的绕着原子核回转（图1）。原子共有100多种，不同种类和不同数量的原子结合起来，就是各种不同的东西。\n"
