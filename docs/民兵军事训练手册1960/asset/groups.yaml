    \ 再版说明\n\n为了适应广大民兵普遍学习基本军事知识的需要，我们曾于1959年3月编写了一本“民兵军事训练手册”，由中国青年出版社出版。现在根据全国民兵的组织和军事训练的发展情况，我们在原来小册子的基础上，又增加了部分的内容，同时对原来的内容也作了些删改，在内容的顺序上，亦按照训练实施步骤，作了必要的调整。\n\
