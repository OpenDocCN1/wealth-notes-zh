    ## 在有风的天气里怎样进行射击？


    风向和风力的大小，对弹头的飞行都是有影响的，首先我们来分析一下风向的影响。按风向来分，风可分为四种：


    - （1）顺风：它能把弹头吹得远一些。

    - （2）逆风（顶风）：它能把弹头吹得近一些。


    以上两种风，对射击影响不大，在200米以内射击的时候，可以不去管它。


    - （3）横风：是影响射击最大的风，它能把弹头吹向一旁。

    - （4）斜风：就是从斜前方或斜后方吹来的风，对弹头的影响，只等于横风的一半力量（参见图51）。


    按风力的大小来分，可分为弱风、和风、强风和暴风四种。风力愈大、射击距离愈远，对射击影响就大；风力小（如弱风），射击距离相近（200米内），射击的时候，可以不进行修正。


    为什么要注意射击距离呢？比如从横侧方吹来的和风，射击100米的目标，弹头要偏3厘米，200米要偏9厘米，400米要偏40厘米，500米要偏70厘米，600米要偏100厘米。可见射击距离愈远，偏差越大。


    ![](img/b41346f815189f79888890b5225a828a_66_0.png)


    ## 怎样对风进行修正射击？


    风既然能把弹头吹偏，在有风的天气里射击，就不能按照老规矩向目标正中间瞄准，一定要把瞄准点搬一搬家。这是对风进行修正射击的一般常用方法。方法是这样的：根据风向、风力计算，估计弹头可能偏右20厘米，在瞄准的时候，就要把瞄准点从目标中央往左移20厘米。这样，弹头飞出去的时候是偏了，可是在飞行时，风却把它送到目标正中去了。


    ## 在阳光下怎样射击？


    太阳光照在很多东西上，会有反光。所以在太阳光下面瞄准，便会看到两个缺，甚至会看到两个准星。一定要记住，真正的缺和准星是黑色的，白色的是太阳光反射出来的光芒，误用了，就会打不中目标。


    ## (五)对各种目标的射击方法


    ### 对不动(固定)目标应当怎样射击？


    步枪基本射击练习用的靶子，战场上敌人的发射点等，都是不动目标，又叫固定目标。对不动目标射击的时候，应当根据：(1)目标距离；(2)天气对射击有什么影响，来确定应当装定多少表尺和瞄准点选在什么地方。在一般平地上，没有外在条件(风、雨)影响，对于比较小的单个目标射击的时候，距离在300米以上，可以装定实距离的表尺，瞄准目标中央进行射击；不到300米，可以装定表尺“3”，瞄准目标中央下沿。对较大的单个目标射击的时候，应当装定实距离的表尺分划，瞄准在目标中央。


    ### 对隐显目标应当怎样射击？


    隐显目标就是一会显现、一会又隐避的目标，战场上的敌人，行动很隐避，露出头来看一看，又藏起来了；出现得快，隐避得也快，暴露的时间短，这就是隐显目标。要消灭这种目标，就要特别注意仔细观察战场，很快发现目标，迅速测定距离，尽快的完成射击准备，把枪瞄向目标将要出现的地方，等目标一露头，立即修正瞄准射击。如果事先不知道目标在那里出现，可以把枪口指向目标可能出现的地区，等目标一出来，很快瞄准射击。在紧急的情况下，为了不让敌人跑掉，可以不用精确瞄准，而采用概略瞄准射击；但是时间来得及，还是应当在精确瞄准后再射击。


    ## 五、刺杀教練


    学习刺杀，是为了在战斗中接近敌人的时候，以白刃格斗达到最后消灭敌人的目的。因此，在平时的练习中，必须认真，确实地掌握刺杀的要领；并且养成机智灵活、坚韧不拔，英勇顽强的战斗作风。每个民兵在学习战术之前，应该熟悉这一动作。


    刺杀訓練的要求，必須切合实战应用。在学习每一个细小动作的时候，都应该精神集中，两眼随时注意敌方，时刻准备对敌进行突刺、打击、防刺、反刺等动作。


    1. 准备格斗。是与敌人进行白刃格斗的准备姿势。在听到“准备——格斗”的口令后，将刺刀指向前，左手由侧方握二道箍，右手握枪颈，同时左脚前出一歩，两腿微屈。上体微向前倾。体重平均落于两脚上。刺刀尖和左眼在一条线上。两眼注视敌方（图52）。


    ![](img/b41346f815189f79888890b5225a828a_68_0.png)


    由准备格斗的姿势听到“枪放——下”的口令后，右手握二道箍上方，左脚收回靠拢右脚，同时将枪放下，成持枪立正姿势。


    2. 突刺。是指向敌人空隙要害部分（头部、咽喉、胸部、腹部）实行刺杀。听到“刺”的口令后，迅速而有力地将刺刀刺向目标，上体前倾，同时左脚（或者是右脚）向前踏出一箭步。刺后，立即拔出刺刀，然后伸枪向前，成“准备格斗”姿势（图53）。


    ![](img/b41346f815189f79888890b5225a828a_69_0.png)


    3. 防刺。敌枪阻碍我刺，或者向我刺来的时候，使用防刺。防是对敌枪作短促猛烈的打击，防后即进行刺。


    - 防右。听到“防右——刺”的口令后，左手将枪向右并稍向前，以枪的下护木打击敌枪，将敌枪击向右。防开敌枪后，即向敌进行刺。

    - 防左。听到“防左——刺”的口令后，左手将枪向左并稍向前，借右臂的助力以下护木打击敌枪，将敌枪击向左。


    防开敌枪后,即向敌进行刺。


    - 防右下。 听到“防右下——刺”的口令后,左手向左下回转;同时借右手向右上运动的助力,将刺刀经左下向右下划半圆形猛烈打击敌枪,将敌枪击向右边。此时弹仓转向右上方。


    4. 打击。 当不能用刺刀刺杀敌人的时候,可使用枪托打击来消灭敌人。


    - 侧击。用枪托后蹬打击敌人,由侧方打击头部。听到“枪托侧——击”的口令后,右手由下向左运动,左手将枪后拉,同时身体向左转,以枪托猛烈打击敌人。打击的时候,右脚上前半步(或一步),体重移到左脚上(图54)。

    - 弹仓打击。 以两手猛烈的动作,用枪的弹仓打击敌人的面部,同时两腿挺直,上体前倾(图55)。


    ![](img/b41346f815189f79888890b5225a828a_70_0.png)


    ![](img/b41346f815189f79888890b5225a828a_70_1.png)


    5. 夺取袭击者的武器。 敌人准备进行抵近射击或刺的时候,迅速向侧方跨出一步(离开),同时用下臂挡住敌枪(手向下或向上划弧形),并用手紧紧抓住敌枪。向右离开的时候,右脚跨一步,左臂挡住和左手抓住敌枪。向左离开的时候,左脚跨一步，右臂挡住和右手抓住敌枪。


    夺取敌枪的时候，必须：1、向右离开的时候，右手由上打击敌人的左手手腕或在敌人两手之间抓住敌枪，右臂在敌人的肘下猛力上顶；把敌人的左手从枪上推开，然后将敌枪向前猛拔，同时用脚跟蹬敌人的膝盖（图56）。2、向左离开的时候，左手在敌人两手间抓住敌枪，将枪向自己怀中猛拉，用头撞击敌人面（颈）部，然后用膝盖或右脚尖踢敌人的裆部（图57）。


    如果没有能夺下敌枪，应当将敌人推动。这时，如敌人背朝向夺枪人，用脚踢敌人的膝窝，同时打击敌人的咽喉（图58），如果敌人胸朝向夺枪人，则用后绊的办法将敌人推动（图59），然后用脚踢倒下的敌人的头和手，并夺取他的枪。


