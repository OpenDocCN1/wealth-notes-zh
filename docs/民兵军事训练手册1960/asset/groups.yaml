    \ |\n| 不能保险 | 保险机内生镸，保险室失去作用，保险室及保险转键棱角磨光 | 擦拭涂油，送厂修理。 |\n| 滑机走火 | 扳机头和卡铁棱角磨光，扳机卡住自行滑动，复簧失去作用，扳机头压不出来\
    \ | 送厂修理。 |\n| 表尺准星发亮影响瞄准 | 由于保管不好致使 | 用火柴熏黑。 |\n\n#### (三) 七九式步枪\n\n七九式步枪是仿照德国\
    \ 1898 年毛瑟枪，国民党加以改进\n\n后于1935年正式生产的，它的口径是7.9毫米，所以称为七九步枪（图30）。\n\n![](img/b41346f815189f79888890b5225a828a_45_0.png)\n\
    \n- 1.战斗性能。初速大、弹道低伸；枪的口径及子弹装药量都较大，所以杀伤力也大；装上枪榴弹发射筒时，可以发射枪榴弹。\n\n- 2.一般构造和使用。同七·六二步（骑）枪。\n\
    装子弹的方法同七·六二步（骑）枪。\n退子弹的方法同三八式步枪。\n击发同七·六二步（骑）枪。\n保险的方法，关上枪机后，将保险机转到右方即可。\n\n-\
    \ 3.分解结合。分解结合注意的事项与三八式步枪同。\n①分解；取下通条——将枪垂直放在凳子上或地上，\n手握住前准器附近，右手握通条头向右旋转向上拔出。\n\
    取下枪机——先把枪机打开随即关上，使其成待发状态，\n然后将保险机扳起直立，右手再打开枪机向后拉，同时左手\n拇指将枪机卡簧向左拨开；取下枪机。\n分解弹仓——右手用通条头下压弹仓盖卡笋，同时左\n\
    手用拇指将弹仓盖后推，拿下弹仓盖、托弹管、托弹板、钢\n的起子，先把弹仓前后的下制螺钉卸下来，然后再卸\n弹仓即可拿下（这一部分通常不分解）。\n\n分解枪机——左手握住机体，用右手拇指尖压住定位\n\
    锁并握住机尾管与机尾，向右旋五周，取下机尾管和\n锁针；右手握住机尾管把锁针放在枪口里面（枪要直立，\n注意不要使撞针歪了，免得折断），右手拇指用力压保险\n\
    机，用左手握住机尾向右旋转九十度；右手慢慢放机尾管，\n取下撞针及撞针簧，机尾和保险机；右手握机体及机\n框，左手拇指用力顶抓子钩，使抓子钩的头部仰起；右手\n\
    将机体向左旋，把抓子钩对准瓦斯孔，再以右手拇指用力\n前推取下（这一部分通常不分解）。\n\n②结合时按分解时的相反顺序进行。\n\n#### 5. 故障的原因和排除的方法：\n\
    \n| 故障现象 | 故障发生的原因 | 排 除 方 法 |\n| --- | --- | --- |\n| 不发火 | 弹簧失效；扳机内凡士林油太多；撞针簧失效或折断\
