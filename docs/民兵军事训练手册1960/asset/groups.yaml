    +   7. 战后注意事项：①对已经被我俘获或者是自动放下武器的空降特务，应该注意俘虏政策，不得随意搜腰包或侮辱他的人格。②俘虏的空降特务，应该迅速解交上级审讯。
    ③在战争中缴获的一切物品，禁止损坏、打埋伏，必须送交上级处理。


    # 二．防原子、防化学常識


    現代條件下作戰，必須對原子、化學武器，采取可靠的防護措施。原子、化學武器并不可怕，只要我們了解了這種武器的性能和特點，是能夠防護的，在戰爭中是可以避免或減少傷亡的。大家都知道，帝國主義特別是美帝國主義，正在集中力量研究和製造原子、化學和細菌武器。
    他們在侵略朝鮮戰爭中曾大量使用過化學和細菌武器，也曾在台灣海峽地區指揮蔣介石集團使用過導彈和化學武器，這就不能不起我們高度的警惕。為此，我國每一個民兵同志，都必須學會對原子、化學武器的防護知識，並且熟練的掌握它，一旦帝國主義挑起戰爭，就能夠粉碎敵人原子、化學武器的襲擊。


    # （一）原子武器


    什麼是原子武器呢？要了解原子武器，必須先弄清楚什麼是原子能，什麼是原子。


    我們周圍的一切東西，都是由極微小的原子組成的。 原子小得很，用倍數最大的顯微鏡也看不見它。 原子本身則是由更小的原子核和電子組成的。 原子核由質子和中子構成，位於原子的中心，重而精尖，電子則按照一定的規律，不停的繞着原子核回轉(圖1)。原子共有
    100 多種，不同種類和不同數量的原子結合起來，就是各種不同的東西。'
