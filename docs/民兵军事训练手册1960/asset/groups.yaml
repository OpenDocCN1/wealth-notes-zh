    ![](img/b41346f815189f79888890b5225a828a_86_0.png)


    缺点是：由于山地多岩石，容易受跳弹兼伤，构筑工事也困难，但是，可以利用岩石构成坚固的坑道工事，在朝鲜上甘岭战斗中，我志愿军就是依托坑道工事粉碎了敌人进攻的。其次，山地道路少，山路狭窄、崎岖，军队行动不便，往往只能成一路纵队行进。夜间行动，容易失掉联络。重要的道路、山口，容易被敌火封锁和打埋伏，因此，必须加强侦察、警戒。


    至于深山、密林、山谷等地，可以避免敌人空中和地面的观察，便于隐蔽活动和进行游击战。但是这也正是敌人空投特务的地区，应当特别注意。在这些地区，各种火器的效力常常受地形地物的限制；通信联络、补给运输亦比较困难。


    2.丘陵地：一般高度在200米以下，斜坡比山地小，而且多被开垦成梯田。丘陵地带对进攻和防御战斗都有利，便于构筑工事，便于部队机动，也可以充分发挥各种火器的威力。丘陵地内的深谷、雨裂地、河流等，是防坦克的天然障碍，对原子、化学武器的袭击也便于防护。


    3.平坦地：村落较多，道路稠密，展望良好，射界开阔，便于军队运动和发挥各种火器的威力。但是不易隐蔽。因此，在战斗中应当特别注意利用坟丘、土坎、道沟、弹坑等地物。


