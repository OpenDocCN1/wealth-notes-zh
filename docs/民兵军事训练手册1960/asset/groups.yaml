    +   1. 居民地（村落）：有互相毗连的房屋、建筑物，不便于观察和射击，部队的机动亦受限制，是炮兵、空军轟击的目标。坚固的城墙、围城河沟等，可以形成防坦克、防步兵的障碍物。地下室可以做掩蔽部。在居民地战斗的时候，应当利用门、窗、墙垣、辕口等，进行观察和射击。


    +   2. 道路：铁路、公路和各种道路的桥梁，在战斗中对军队的运动、补给起着重要的作用，尤其是交通枢纽和重要桥梁更为重要，但是这也正是敌空军、炮兵轰击的目标。因此，在这些地区的民兵，必须加强关于防空、护路、伪装和抢修工程等方面的教育。


    +   3. 江河：一般的河流便于观察射击，较大的河流，是防御、战斗的天然障碍，可以用火力控制两岸和浅滩。


    由于天气、季节的变化，江河对战斗影响的程度亦不同。平时能通行的河流，到雨季、汛期就可能成为通行的障碍。一般在冬季影响小，夏季影响大。因此，在河流地带行动的时候，应当加强对河流的侦察。


    +   4. 水网地：地面平坦，展望良好，射界开阔。有错综稠密的河流、湖泊、池塘、水田等。道路（特别是公路）较少，乡村的道路多在田埂或河堤上；交通不便，军队行动比较困难。工事大多只能用推土构筑。另外，水网地带潮湿，应当特别注意武器、弹药的防潮。


    +   5. 沼泽地：地面经常潮湿或部分被水淹没，有的沼泽地，步兵也不能通行，对部队的行动有限制。防御阵地前沿的沼


