    图81 装上子弹后的姿势


    ### 4. 停止射击


    为了完全停止射击，下达“退子弹——起立”的口令，此时射手应按要领复表尺，退出子弹，右手掌握表尺前方，将枪稍向后收；左手向内，手掌着地；屈左膝于右腿下；右手将枪收回；以左手掌及左膝的撑力将身体支起，右脚向前一步，左脚再向前一步，然后右脚靠撑左脚，恢复持枪立正姿势。


    如仅下达“退子弹”的口令，则复表尺，退出子弹，将枪收圆，置于身体右侧，枪面向上，枪的上背带孔与第一道箍之间置于右腕上，不起立。


    ## （二）射击实施


    ### 1. 据枪


    据枪就是瞄准，击发时托枪的方法。据枪的关键在于射手姿势的稳定，并使武器有一定的位置，以便射击瞄准和精确的击发。据枪时射手一面注意目标，一面将枪托紧紧抵在眉窝，右手握枪颈，食指第一关节贴住扳机，头部略向前倾，但颈部不应紧张和伸长，右腿自然搁在木托上（搁腿时要右腿沿着木托左侧由上向下搁住，使右腿骨的肌肉靠于木托上，这样，可以增加枪的稳定）。


    如果是有依托射击，可以将表尺下方的下护木直接放在依托物上，左手靠右肩，四指靠拢，拇指从枪的下面向上托住枪（图32）。


    ![](img/b41346f815189f79888890b5225a828a_51_0.png)


    如果是无依托射击，左手握弹仓（指槽）附近，两肘合力支枪，使其稳定（图33）。


    ### 2. 瞄准


    枪身保持水平，右眼从缺口通视准星尖，使准星尖在缺口上沿中央成水平，构成正确瞄准线，把瞄准线指向瞄准点，这就是正确瞄准。


    ![](img/b41346f815189f79888890b5225a828a_51_1.png)


    ### 3. 击发


    击发的时候，食指第一关节扣住扳机均匀正直向后，逐渐增加压力，并在正确瞄准的瞬间停止呼吸，同时增大压力，一直扣到不知不觉中击发为止。如果瞄准基准移动，射手在扳机上的压力不增加也不放松，而是纠正瞄准，待瞄准线与瞄准点相吻合后，再继续增加扳机上的压力，击发。


    击发的时候应当集中精力注视目标和瞄准线的指向，并自然停止呼吸。


    击发的时候应当防止以下情况：①猛扣扳机。当瞄准线与瞄准点刚一吻合时，为了抢机会击发，不是逐渐增加压力，就可能引起“猛扣”。②不是适时停止呼吸。在扣扳机时，过早的停止呼吸，击发的瞬间就反而忍不住了。


    ## 四 简易射击原理


    ### （一） 发射


    装在枪膛内的子弹，由于锤针的冲击点火，使弹壳里的火药燃烧起来，产生了强大的气体，硬把子弹的弹头顶出枪膛，抛射出去。这就叫做发射。


    那么，子弹头是怎样规规矩矩地从枪膛内飞出去的呢？子弹的构造是怎样的？


    子弹由弹头、弹壳、底火和发射药四个部分组成（图84）。


    ![](img/b41346f815189f79888890b5225a828a_52_0.png)


    ### 图84 子弹的构造


    弹头就是子弹上那个尖头的东西（有的弹头是圆的）。射击的时候，就靠它去杀伤目标。弹壳是个比较粗大的铜（或钢）壳子，里面装有发射药，是一粒粒或一片片的火药。弹壳口连接弹头底部。弹壳底部的中央有个圆形的东西，叫做底火，是用来点燃弹壳内的发射药粉。底火里装有一种烈性药粉，叫“起爆药”，非常容易发火，外面用一层很薄的铜皮盖着，有两个喷火的小孔通向弹壳内部。


    射击的时候，只要起爆药被稍稍用力撞击一下，就会燃烧起来；把火从小孔喷到弹壳内，使发射药很快地燃烧起来，这种火药一燃烧，很快就形成强大的气体力量，将弹头推出枪口。


    ### 弹头是怎样从枪膛内飞出去的？


    子弹推送到膛内以后，弹头就压进枪管的后膛，弹壳就压进四面碰壁的弹膛里，子弹的底部被枪机紧紧地顶住。当撞针的尖端将子弹底火撞了一下后，里面的起爆药粉就燃烧起来，火苗立即从两个喷火小孔喷到弹壳里面，很快地点着发射药。发射药燃烧起来很快，并且能突然形成强大的比原来要大好几千倍的气体，这些气体被憋在弹壳里，四周都被密封着，挤不出去。只有弹头是插在弹壳里面的，于是大量的气体就从弹壳口往外冲，冲着弹头顺着枪膛往前跑，最后把弹头冲出枪口，飞向目标（图35）。


    ![](img/b41346f815189f79888890b5225a828a_53_0.png)


    图35 发射药燃烧后气体推动弹头前进


    ### 射击的时候为什么会有后座？


    我们在打靶的时候，枪一响，同时就会觉得枪向后一退，肩膀也就稍稍被震动一下，这一退就是后座。


    后座的发生，是由于弹壳里面的火药燃烧以后，大量的气体在枪膛内上、下、左、右冲撞，因为力量大小一样，互相抵消了，向前冲撞的气体，把弹头推出了枪膛，向后冲撞的气体，虽然被枪机挡住没有挤出来，但是却把整个枪身向后撞了一下，使枪身向后一退。后座就是这样发生的。


    射击的时候会不会因为后座而打不中目标呢？只要操作正确，是不会的。因为武器的后座是沿着火身轴线正直向后退的，并且后座距离很小，只有芝麻粒那么大小，这一点后座距离，在弹头没有出枪口之前，影响枪身跳动很小，操作正确，不会影响命中。当然，弹头刚离开枪口的一刹那，由于火药气体与枪口外的空气冲击而引起的后座跳动是比较大的，但是这时弹头早已飞出枪口，所以后座对单发武器（步枪、机枪）来说，也不会影响命中。至于对速发武器（冲锋枪、机关枪）来说，第一发弹头飞出枪口后，产生的后座破坏了原来的瞄准线，对第二发弹头的命中是有影响的。但是操作正确，把枪管控制得很规矩，使枪身跳动很小，也不会影响命中目标。


    后座力对射击虽然有上述这些影响，但是也有用处，它可以作为自动武器的原动力。很多冲锋枪和手枪，就是利用后座的力量，使枪机后退来完成半自动的。


    ### 怎样减少后座的影响？


    枪的后座会不会影响射击的命中，就看你抵肩正确不正确（参看图36）。正确的抵肩姿势是：把枪托的底钣，正确地抵在肩窝，也就是要使底钣的四部和肩部突出的肌肉紧密地靠在一起，这样才能平稳地接受枪的后座，使后座无法起破坏作用。用冲锋枪和轻机枪射击的时候，除了要把枪托抵好在肩窝内以外，两只手一定要把枪身控制得很结实。


    ![](img/b41346f815189f79888890b5225a828a_55_0.png)


    ![](img/b41346f815189f79888890b5225a828a_55_1.png)


    抵肩抵得不正确，特别是抵肩过高和过低，使枪托不能平稳地全部抵在肩上，这样，有一部分抵不着肩，当枪向后退的时候，就好像缺了一只脚的桌子一样，站不稳了，就要影响射击的命中。例如：枪托抵得太高，上面没有抵着，枪向后退的时候，枪托的上半部就向后倒，这样，枪口就跟着向上跳，弹头就偏到上面去了。同样，枪托抵得太低，下面就空了，枪向后退的时候，枪托的下半部就向后倒，这样枪口就跟着向下倒，弹头就偏到下面去了。


    ![](img/b41346f815189f79888890b5225a828a_55_2.png)


    图86 正确的抵肩姿势


    ### 膛线（俗称来复线）有什么用？


    枪膛是火身（也就是枪管）最重要的部分，因为，它能叫子弹头规规矩矩地从枪膛内飞向目标。我们都希望射击的时候能把弹头打得很远、很准、力量更大，要做到这样，除了子弹本身的构造，射击时要瞄准外，在枪膛里还有四条膛线（有的三八式枪是六条），控制着打出去的弹头，叫弹头打得稳，打得准，飞行中不翻筋斗。


    膛线是怎样控制着打出去的弹头的呢？我们先举这样一个例子，假如你抛出一根约一尺长的小棍，出手后小棍就东摇西晃的，说不定哪头先着地。可是如果象小孩玩的陀螺一样，叫它在地上边转边走，就不会摇晃了。


    ![](img/b41346f815189f79888890b5225a828a_56_0.png)


    我们就是利用这样一个简单的道理，在枪膛里刻上几条从左向右上方旋转的线（图37），让弹头冲出枪口之前，沿着膛线所规定的跑道旋转起来。弹头离开枪口以后，仍然从左向右旋转着飞行，就不会摇晃了。这样，弹头的尖端老是指向前面。弹头的尖端很尖，空气的阻力就不大，弹头能飞得更快，更远。而一碰到敌人的时候，就会象锥头钻东西一样，一下子就狠狠地钻到目标里去（图38）。


    ### 为什么要爱护枪膛，怎样爱护？


    射击的时候，火药在枪膛里燃烧，会不会烧坏枪膛呢？我们知道，射击时火药在枪膛里烧过以后，留下很多烟灰，如果对枪膛保护的很好，射击以后，每天细心地把这些烟灰擦干净，上好油，那么枪膛是坏不了的。如果射击后不好好擦拭枪膛，这些烟灰就好象蛀虫一样，在枪膛里乱咬，被它咬过的地方都起了锈。日子久了，光滑的枪膛被咬得一块块的生锈，锈掉以后，就留下许多小坑。枪膛里有了小坑，弹头跑的道路就被破坏了，射击就会打不中目标。更严重的是，如果枪膛太脏，射击的时候还会发生炸膛现象。


    另外，我们也要注意不把枪管撞弯和压弯，不要用通条或其他硬东西去磨膛线，磨坏了膛线，射击就不准确了。枪膛坏了，外表再漂亮的枪，也不能算是好枪。


    ### （二） 弹道


    什么是弹道：弹头跑出枪口后，一直到达目标所经过的这条路线，就叫做弹道。


    弹头在空气中是怎样飞行的？


    有人认为弹头出枪口后，是一直朝前飞的，其实不对，如果是那样，飞出枪口的弹头永远也不会落到地上来了。实际上弹头飞行的道路是弯曲的，画出一条抛物线（参看图39）。


    为什么弹头飞行的路线是弯的？因为弹头在飞行的时候受到两种力量的影响：一种是空气的阻力，一种是地心吸力。


    关于空气的阻力，道理很浅显。比如你骑自行车骑得很快的时候，虽然没有风，也感觉好象有一种风力阻挡前进。气对弹头飞行的阻力，就使弹头越飞越没有力气，不得不慢慢地停下来。


    关于地心吸力，道理也很浅显。我们把任何东西往上丢，都要落下来，就是因为地心吸力把它往下拉的缘故。地球对弹头的吸引力，就使弹头在飞的时候，不得不慢慢向下降落。


    这两种力量的影响，就使弹头飞行的路线是弯曲的。


    所以当我们瞄准目标射击，弹头刚出枪口飞行的路线是偏高一些的。这样慢慢弯曲下来，刚好击中目标，这个弯曲的度数，在造枪的时候已经计算好了。我们射击的时候只要把表尺定对就行了。


    ### 弹道低伸有什么实用意义？


    弹道是弯曲的，但是各种武器的弹道弯曲程度不同。弯曲度小，就叫做弹道低伸。如七、九三骑枪和冲锋枪，同在200米射击距离上，骑枪就比冲锋枪的弹道低伸得多（图40）。


    ![](img/b41346f815189f79888890b5225a828a_58_1.png)


    那么弹道低伸有什么意义呢？弹道愈低伸，危险界就愈大，测定目标距离误差对命中的影响也小。


    什么是危险界：危险界就是弹道降落那一段的弧度，在瞄准线上的高度；不超过目标高的界限，称为危险界。因此，弹道愈是低伸，也就是危险界愈大、愈好。


    弹道低伸，危险界就大，与目标高低也有直接关系。如果射击距离相同，目标愈高，危险界愈大；目标愈低，危险界愈小（参看图41）。


    ![](img/b41346f815189f79888890b5225a828a_59_0.png)


    甲、弹道低伸，危险界就大； 乙、目标高，危险界就大


    为什么弹道愈低伸愈好？我们看看图42就明白了。


    ### 实地危险界的实用意义


    以上所谈，都是在瞄准线水平情况下，如果是从上面往下面射击，或者是从下面往上射击，由于射击角度不同，还是有些变化的。另外，我们常进行射击的实地，也不可能都那么平坦，特别是在战斗中。所以实地危险界的大小，与地形倾斜情况关系很大。地形与弹道弯曲相适应，实地危险界就大，如果不适应，危险界就小（图43、44）。


    ![](img/b41346f815189f79888890b5225a828a_60_0.png)


    甲、抛物力大，射程远


    ![](img/b41346f815189f79888890b5225a828a_60_1.png)


    乙、对于向我或背我运动目标射击时，可以不用常换表尺


    ![](img/b41346f815189f79888890b5225a828a_60_2.png)


    丙、距离测得不准时，跳弹也能杀伤敌人


    图42 弹道低伸的好处


    ### （三） 瞄准


    射击的时候，为了使弹头打中目标，就要握起枪，用一只眼睛从缺口对准准星，同时移动枪口的高低和方向，使枪对准目标，保证打出去的弹头能中在目标上。这叫瞄准。


    ### 瞄准具有什么用？


    每一支枪上，都有表尺（缺口）和准星，这两个东西都是瞄准用的，所以叫它瞄准具。没有它，就没有办法指挥弹头向指定的方向、地点飞去，那是不容易打中目标的。因此，我们要特别爱护枪的瞄准具。


    我们知道，弹头飞行的路线是成抛物线渐渐向下落落的。


    ![](img/b41346f815189f79888890b5225a828a_61_0.png)


    ![](img/b41346f815189f79888890b5225a828a_61_1.png)


    如果将枪放平对着目标射击，弹头飞不到目标就落地了（图45）。为了要击中目标，就要定表尺。表尺上刻有距离分划，


    ![](img/b41346f815189f79888890b5225a828a_61_2.png)


    根据射击距离的远近，规定枪口要抬多高。举例说，你如果在300米距离射击，定了表尺300，这样，枪口抬高的高度，使你打出的弹头弯下来时恰好能击中目标（图46）。


    ![](img/b41346f815189f79888890b5225a828a_61_3.png)


    ### 怎样才能正确瞄准


    在向目标瞄准的时候，枪面一定要放得很正，使准星处在缺口的正中央；准星尖要和缺口上沿在一条线上，并且正确地瞄准在需要瞄准的那一点（瞄准点）上，这就是正确瞄准。


    正确瞄准的时候，缺口上沿中央、准星尖中央和瞄准点这三个点，都是在一条直线上的，这条线就叫瞄准线。如果这三点不在一条直线上，比如准星偏右，那么打出的弹头也偏右。在100米距离上射击的时候，准星每偏1毫米，六五（三八式）步枪着点就偏14.5厘米；仿二四式七九步枪就偏20厘米。所以，不瞄准是打不中目标的（后面还要详述）。


    ### （四）命中精度


    我们知道，即使你射击的技术和所用的枪都很好，并且在同一距离、同一瞄准点上射击，打出的每个弹头决不会落在一点上；总是有散布的。这是因为：第一，你连续射击的几发子弹，它们的装药、弹头重量和火药干湿程度等，不可能都绝对相等；第二，发射每一发子弹时，气象（风、气温和气压）总会有些变化；第三，在射击操作时，每次也不可能都一样。特别是当你射击几发子弹以后，眼睛会有些花，疲劳也有些增加。


    打出的子弹既然不可能都落在一点上，那么打得准不准的标准是什么呢？


    ### 怎样才算打得准（即什么叫命中精度）？


    所谓打得准与不准，就是看你打出的弹头，是不是都打在目标的中央，并且紧靠在一起。大家看看图47，就知道怎样才算打得准了。


    ![](img/b41346f815189f79888890b5225a828a_63_0.png)


    甲，射弹散布大，平均弹着点和预期命中点不吻合，不好；


    乙，射弹散布虽小，但没有在中央，不好；


    丙，平均弹着点在中央，但东一发、西一发也不好；


    丁，这样才算好。


    ### 为什么会打不准？


    打不准的原因很多，下面我们就来分别谈谈：


    **（一）操作技术上有那些毛病就会打不准：**


    - 1. 射击姿势不好就会打不准。比如，卧姿射击的时候，身体所对的方向和目标斜的太大或者太小；两肘过于向里合和向外张，使据枪、贴腮、瞄准的时候很别扭，当然打不准确，另外，这样的卧姿不舒服，不能持久，也会打不准。


    ![](img/b41346f815189f79888890b5225a828a_63_1.png)


    - 2. 据枪的动作不正确，就会打不准。如枪面偏左，射弹就偏左下，枪面偏右，射弹就偏右下（图48）。


    - 3. 依托的位置不适当，也会打不准。枪身下面的依托物太硬了，会使枪向上跳，太软了会使枪向下沉。依托物太高或太低也不舒服，最好是将枪的重心（枕铁下部）放在依托物上面。


    - 4. 瞄准不精确，就会打不准。这道理很容易懂，参看图49就明白了。


    ![](img/b41346f815189f79888890b5225a828a_64_0.png)


    图49 瞄准误差对击中精度的影响


    - 5. 扣扳机不正确也会打不准。假使猛扣扳机、眨眼、皱眉、不能屏住气等，都会破坏瞄准线，使射击不精确。


    **（二）武器、弹药有了那些毛病就会打不准？**


    枪和子弹出厂的时候，质量都是很好的，但是我们天天用它，如果不注意爱护，把枪和子弹东碰西撞，当然免不了要出毛病，出了毛病就会打不准。特别是准星和表尺，要是碰歪了，你瞄东边，打的是西边。比如准星碰的偏左了，打出去的弹头就会偏右。而表尺恰和准星相反，表尺往这边偏了，子弹就往那边偏（图50）。此外，枪管生锈，枪管膨胀，膛线磨坏，枪口被磨坏或者碰伤，子弹受潮或者被火烤过，弹壳被压得变形，弹头松动等等，所有这些毛病，都会影响射击的命中率。


    **（三）天气变化，也会打不准。**


    在晴天、雨天、刮风、下雾，白天、晚上，冬天或夏天进行射击，都有区别。


    晴天、日暖无风的时候射击，能打得很准，因为天气好的时候，看得清楚，瞄得准，没有风，打出去的弹头不会被风吹，天气不冷不热，弹头飞起来轻松，所以能正确地打中目标。但

