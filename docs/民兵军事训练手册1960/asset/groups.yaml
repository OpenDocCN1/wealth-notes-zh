    3. 卧射预备 听到："卧姿——装子弹"的口令后，右脚向脚尖方向迈出一大步，左脚尖稍向右，枪口斜向目标；左手在右脚尖前支地，向新方向迅速卧倒，并以身体的左侧和左臂支持全身，将枪向目标方向送出，左手接握表尺下方，木托着地；右手顺着枪面向后收，托住机柄，目视前方，按要领装上子弹，定好表尺后，右手掌握枪颈，食指在护圈外面伸直，全身伏卧地上，两脚分开约与肩同宽，两肘着地（图81）。


