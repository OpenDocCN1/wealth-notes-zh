    +   ②自己要脱离危险，或是援助自己人脱离危险的时候；


    +   ③在战斗中，有人通过步哨线，不受步哨指示和检查的时候；


    +   ④在战斗中，有人接近步哨线问他三声不回答的时候；


    +   ⑤假装投降，而企图有其他行动或者逃跑的时候。


    5.发现敌情，应该及时以记号或者是由副步哨员回去向哨长报告，并且通知邻哨。这时步哨员不仅要注意发生情况的地方，而且对侧方、后方也应该严密注意，防止敌人斁馘。副步哨员报告完毕，应该迅速回到步哨位置。


    换班的时候如果发现敌人袭击，接班者应该协助原来的步哨共同抵抗，由原来的副步哨员回去报告。


    夜间换班，通常由班哨长亲自带去。白天可由班哨长指示接班的步哨员自己去做换班。换班回来的步哨员，在返回哨所的时候，应该注意隐蔽身体。


    # 三 观 察


    # （一）观察勤务原则


    1.情况是指挥员指挥作战的根据，观察是了解情况最直接的方法。在战场上进行不间断的观察，就是保证指挥员在战斗中对自己部队顺畅的指挥。因此，除了被指定的观察员外，每个战士在战斗中都有观察的职责。


    +   2.观察员分两种，一是被指定随指挥员行动作为指挥员的助手的，一是临时派出独立担任对远方观察的。


    +   3.观察员应该注意观察如下事项：


    +   ①敌人的兵力、兵种、武器如何配置和运动；


    +   ②本军各分队及友邻指挥员的动作；'
  - '[PAGE 141]


    +   ⑧空軍；坦克和毒气警报的信号。


    观察的时候应该注意一切征候，如路上的尘土飞扬，村寨中狗的狂叫，人畜奔跑，武器的闪光，射击的声音，飞机的出现，夜间的灯火，可疑的便衣人员等。从这些征候中判断敌人的行动，兵力的多少，和距离的远近。
    要善于从武器、服装和运动序列的不同来辨别情况。


    +   4．对于一切重要的发现，无论是敌人的，友邻的，或者是自己各分队的，观察员都应尽快速的报告指挥员。


    # （二）观察勤务动作


    观察员位置的选择：最好的观察所（位置），要能够观察到所指定的地带，便于报告，而且不容易被敌人发觉。


    白天应该在高处，如树上、山顶、楼房等。一但是要注意不要利用明显的物体和遮蔽天空的地方，因为利用一个孤立的大土堆不如利用有许多草丛和小树丛的地方更隐蔽。站在很高的没有隐蔽的山顶上，很容易被远处的敌人发现。


    对于背景的明暗也要注意。如穿黄色或灰色的衣服站在白色物体前面，比站在黑色物体前面，目标要明显的多。


    夜间的位置、姿势，都应该低些，这样可以听得多、看得远，特别是对于遮蔽在天空的目标，更容易发现。伏在地面上，容易听到远处的声音，伏在石地、草地、禾苗地附近，可以听得更远一些；但是不应该靠近有声音的河边、风车、水磨以及有杂乱声音的地方。
    在刮大风的夜里，选择的位置要避开大树。


    # 隐蔽和伪装：


    +   （1）要使自己同周围的脸色混同起来。例如，利用树丛或者草丛向敌人观察的时候，应该用伪装网，或者在帽子上、携'
  md: "\n## （三）小组的战斗队形\n\n小组在进攻战斗中，通常分为一路队形和散开队形两种。战士的间隔距离一般为6—8步（4.5—6米）。组长通常在组的先头、中央或一翼，以便于指挥联络。\n\
    \n组长使本组成一路队形前进的时候，口令是：“第一组成一路跟我来！”组长在先头对正目标前进，各战士按次序取适当距离，随组长前进（图106）。\n\n组长使本组由一路队形散开队形前进的时候，口令是：“目标——（方向）某处——散开！”这时，以组长为基准，对准目标前进。第二、四名向组长左方，第三名向组长右方，迅速散开前进（图107）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_125_0.png)\n\n组长为了适应情况，使本组由一路队形向一翼散开时，口令是：“目标——（方向）某处——向左（右）散开。”组长对准目标前进，其余战士按次序向组长左（右）散开前进（图108）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_125_1.png)\n\n![](img/b41346f815189f79888890b5225a828a_125_2.png)\n\
    \n组长使本组就地散开停止的时候，口令是：“目标——（方向）某处——就地散开！”组长对准目标停止，第二、四名向左，第三名向右迅速散开，各自利用地形地物，取适当姿态停止（图109）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_126_0.png)\n\n如果本组突然遭受敌火射击，或者情况需要迅速散开，组长可以直接下“散开”或“就地散开”的口令，不指示目标与方向，各战士迅速向组长左（右）散开、前进或就地停止。\n\
    \n小组在运动中的战斗队形，是根据敌火、地形不断变化的，有时形成一路队形（如通过凹沟狭窄地形）；有时形成一线的散开队形（如通过棱线或停止在棱线后方）；有时成三角散开队形（如通过开阔地及停止在森林、起伏地、坟地等）；有时形成左（右）梯次（如翼侧有顾虑的时候）。为了便于运动和执行任务，有时也可具体指示成何种散开队形。口令是：“目标——（方向）某处成一線（或左[右]梯次）散开！”（图110、111）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_126_1.png)\n\n![](img/b41346f815189f79888890b5225a828a_126_2.png)\n\
    \n![](img/b41346f815189f79888890b5225a828a_126_3.png)\n\n成战斗队形前进时，应为持枪姿势。在行进中要停止或者由停止继续前进的时候，组长可以下“停止”、“前进”、“向某处前进”的口令，或者以动作引导前进。在前进中需要变更方向的时候，组长可以以动作引导，或者以口令、手势指挥。\n\
    \n## （四）小组在敌火下的运动\n\n在前进运动中，组长指挥的要领除前面已谈的外，应该注意保持全组前进方向，避免在敌火下作横方向的运动；同时不间断地观察敌情、地形，带领本组不失时机地前进；还应注意向前进最快的小组取齐（取齐是跟上，不要拉远，而是在一条线上看齐）。\n\
    \n小组在什么情况下向前运动？一般地说最好的运动时机是：敌火间断、稀疏、转移和被我所压，或者地形隐蔽，或者有烟幕掩护的时候。\n\n在进攻战斗中小组的运动方法有两种：一是全组跃进，二是各个跃进。在敌火间断、地形隐蔽和有我火力掩护的时候，实行全组跃进。地形开阔，敌火力稀疏或者敌我火力中和的时候，实行各个跃进。全组跃进，组长以口令指挥，如“目标——（方向）某处——全组跃进！”各个跃进，一般是采取具体指挥方法，并由组长具体指示某战士前进至某处停止及停止后的动作。有时也可以用口令指挥，并且给战士一定的机动范围。\n\
    \n前进的时候应当密切与友邻协同。当友邻遭受敌害的时候，应迅速以火力和运动援助友邻；当友邻火力射击敌人有效的时候，应当迅速乘机前进。\n\n## （五）小组的射击指挥\n\
    \n在进攻中，通常是在得到班长指示以后开始射击。如果进至步枪有效射程内被敌火所阻，需要交互掩护前进，以火力支援友邻，或者发现有利的目标，小组也可以实行间断射击。\n\
    \n射击目标的指示，通常是在没有开始射击前，组长即将目标、方向、位置及射击方法简明告知战士。对于射击目标的选择，步、骑枪要选择最近的对我危害最大的目标，如正向我射击的敌人，或准备向我射击的敌机枪手、特等射手、炮手，以及指挥员、侦察员、通讯联络员等。\n\
    \n进攻中的射击方法，通常分为各放和齐放两种。对于敌人的散兵，一般采用各放，即各个战士自己寻找射击目标（或者根据上级指示），自选瞄准点，自行射击。指挥口令是：“目标——某处敌人散兵——各放！”如果需要加快射击速度，可以指示“快放”。齐放是由组长指定射击目标，在统一口令下，同时射击，如发现敌人向我反冲击，或者敌人危害我前进，我只有以突然齐放，才能将其消灭或者给与很大的杀伤。齐放口令是：“目标——某处附近敌人，瞄准——放！”射击中如果目标隐匿，组长可以发“暂停”口令，如果目标消灭，则发“停放”的口令。\n\
    \n小组在前进中，距敌较近，地形开阔，被敌稠密火网所阻，需要暂时停止或者进行射击制压敌人，则实行近迫作业。\n\n## （六）小组的冲击动作\n\n小组的冲击出发地，通常由上级具体指定。有炮兵掩护时，一般距离敌人前沿200米左右，没有炮兵掩护时，一般在敌手榴弹投掷的距离外。地点的选择，在地形上应当尽量求得隐蔽，便于进行冲击准备。\n\
    \n到达冲击出发地后，组长应该隐蔽地将战士稍做整顿，将班的冲击目标、道路、队形和冲击信号，简明告知，并且命令各战士迅速上刺刀、准备手榴弹和整顿装具。如果不占领冲击出发地，组长应该在运动中指示战士逐渐完成冲击准备。\n\
    \n冲击发起后，组长应该以自己的英勇模范行动，率领战士坚决地向敌猛冲。开始队形较疏散，在冲击前进中，逐渐缩小间隔距离。冲击既已发起，应当不顾一切损害，在我火力支援掩护下，乘我炮火及手榴弹的爆炸烟幕，迅速、坚决、顽强地向前猛冲，并且以短兵火器歼灭敌人。\n\
    \n# 战斗勤务\n\n## 一 侦察\n\n### （一）侦察勤务原则\n\n1. 侦察是获得敌人情报的一种手段。确切的情报是指挥官正确下定决心的重要根据。因此，侦察员是部队行动的耳目。\n\
    \n   侦察员的任务，是用一切手段，捕捉俘虏，缴获敌人的文件，力求发现敌人行动的一切征兆，如：敌人的兵力、兵种、技术兵器等。最有情报价值的是捕获敌人的军官和传达联络人员。\n\
    \n   侦察的方式很多，有化妆侦察（便衣侦察）和武装侦察。除此以外，每个战士都有收集敌人情报的责任，都应该将自己直接看到或者间接听到的情报随时报告给指挥员。\n\
    \n2. 这里着重介绍的是武装侦察，就是战士被派出担任一定的直接搜索任务。武装侦察通常是由两至三个侦察员（或战士）组成侦察小组，一人任组长。侦察小组有被专门派出搜索某一地区的，或者是派出在部队前方、侧方和后方担任侦察、警戒任务的。\n\
    \n### （二）侦察勤务动作\n\n1. 侦察员出发前的动作：\n\n   侦察组长受领任务以后，应当将敌人的情况、侦察组的任务、执行任务的方法等，告诉侦察员。每个侦察员必须确实明了自己的任务。\n\
    \n   为了防止泄密和暴露我军番号，严禁侦察员携带能判明我军番号和情况的物件，如：标有我军配置的地图、作战文书和个人文件等。在出发前，组长必须确实进行检查。\n\
    \n   整理好自己所携带的装具，不使在行动中发出声音。装好子弹，关上保险。\n\n2. 侦察组前进的队形：\n\n   侦察组前进的队形，是根据敌情、地形和任务来决定的。一般采用以下几种（以三人小组为例）：\n\
    \   - 在隐蔽地行进，多采用前三角队形 (△) 或后三角队形 (▽)；\n   - 在平坦开阔地，多采用一字队形；\n   - 在狭窄地，多采用一路纵队；\n\
    \   - 在复杂地形，多采用左梯次 (▚) 或右梯次 (▞) 队形。\n\n   侦察组组长多走在主要方向上。\n\n   各侦察员彼此间的间隔，根据地形以听力、视力能够互相联络、并且能够互相援助来决定。通常在日间不超过150米，夜间不超过50米。\n\
    \n3. 对各种地形地物的探索方法：\n\n   侦察组的行动，应当力求秘密，不使敌人发觉，并且便于我方观察。为此，在白天行进时，应当保持方向，充分的利用地形地物，由这一隐蔽地向另一隐蔽地运动，并且不间断地进行观察。在夜间行进，应当保持肃静，不使自己的装具和行动发出声音，并且注意静听。如果敌人照明，应迅速卧倒，待照明炮火再继续前进。遇到道路，应当在道路两旁沿着沟渠或顺树木的阴影前进（图112）。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_132_0.png)\n\n   (1) 对高地搜索的时候，应当尽量利用高地的阴暗处运动，切忌从山顶透空的棱线上运动（图113）。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_132_1.png)\n\n   对独立小高地搜索的时候，应当从两侧绕过，或者先向高地背面敌方进行观察，然后从有背影或隐蔽的侧斜面处通过。\n\
    \n   (2) 搜索凹地和谷地的时候，一人在低处行进，其余在岸上行进，并且互相保持密切的联系（图114）。\n\n   (3) 通过隘路的时候，先选定便于观察的位置，观察入口方面的险情，然后以一人接近入口处观察，如果隘路较短，先以一人迅速通过，到前面出口处观察后，其余侦察员再通过。如果隘路较长，则采用一路队形通过。必要的时候可以交互掩护搜索前进。到达出口处，先隐蔽的周密观察出口外面的情形后，很快的跃出去。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_133_0.png)\n\n   (4) 搜索森林之前，必须先在林沿外面精密的观察林内有没有征候，然后交互掩护搜索前进。在林中行进的时候，要保持静肃，不要撞动树枝，踏响枯草枯叶等，要时常止步倾听四周的音响，随时观察树上和草丛里的征候，如果有树枝、草叶动摇，就要仔细观察，判别其是否被风吹动，或者是有人触动。\n\
    \n   在森林内行进，间隔距离要根据森林的疏密程度适当的缩小或者扩大，以能互相联络和及时援助为适当（图115）。\n\n   在出林沿之前，应该对林沿外面严密的观察，并且选好停止的位置，然后迅速跃出。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_134_0.png)\n\n   (5) 搜索较大村庄的时候，应当首先在村外观察村内的动静。搜索街道的时候，应该利用街道两旁的墙角彼此交互前进和交互观察。通过横巷口的时候，应该由先在巷口对面的侦察员进行观察，待他发出确实没有人的记号以后，另一侦察员可以滚入巷内或者通过巷口（图116）。如果遇到较小的村落，可以按照图117要领搜索。\n\
    \n   搜索房屋的时候，先观察周围后，一人在门口作准备射击的姿势，防止敌人冲出，另一人在窗户观察或瞄准屋内，一人进屋搜索。\n\n   (6) 通过开阔地的时候，容易为敌人发现，应该扩大间隔，并且以低姿迅速通过。\n\
    \n4. 对各种征兆的判断：\n\n   敌人（尤其是敌人的侦察员）的行动常是诡秘的。因此，每一个侦察员应当善于发现问题，哪怕是轻微的征兆也好，都应该加以推测、分析、判断。尤其是对一切反常的状态，必须更加注意。例如：\n\
    \   - 在战斗期间的村落，如果发现狗乱叫、人喧哗、夜间发现火光等，都是敌人进村子的征兆，应该仔细查问。\n   - 如果村落、田野（农忙的时候）、大道上看不见行人，可能有敌人埋伏，不可冒然前进。\n\
    \   - 林鸟惊飞，虫声突然停止，必定有人行动，应该注意搜索。\n\n   对敌人驻过的村子应该仔细搜索。根据宿营后的痕迹（锅灶、马蹄印、车轨等）可以判断敌人的兵力、兵种和运动方向等。特别是对遗留下来的文件（哪怕只字片纸），也应当很好的搜集起来。必须知道，这些东西可以作为指挥员判断敌情的很好材料。\n\
    \n5. 对各种情况的处置：\n   - (1) 敌人侦察员经常化装居民、民兵以及我军人员等，来侦察我军的情况。我侦察员对这类情况应该特别注意，如果有可疑的人，就逮捕起来递交上级。\n\
    \   - (2) 遇到单个的敌人，应该尽量秘密捕捉。\n   - (3) 遇到多数敌人，如果还没有被发现，可以一面派人或者用记号报告部队，一面隐蔽地绕到敌侧继续观察。遇到敌人向我急进，来不及报告的时候，鸣枪报告。\n\
    \   - (4) 遇到优势敌人，除了迅速报告外，应当占领有利地形先敌开火（距离近的时候），就地抵抗。或者一方面报告，一方面绕到敌人侧面观察其后续部队，设法捕捉其掉队人员。捕捉了俘虏，首先解除他的武装，搜索他身上的文件、符号、日记本等；然后送部队处理。\n\
    \   - (5) 如果突然与敌人遭遇，假如自己陷入危险，应当鸣枪报警或者是勇猛突围。倘若同志遭遇危险，必须机敏勇敢的用射击或突刺去营救他。\n\n## 二\
    \ 警戒\n\n### （一）步哨勤务原则\n\n1. 步哨是由班哨或者排哨派出的，和派出哨所的距离，依据具体情况而定，一般白天不超过400米，夜间不超过50米。\n\
    \n   步哨通常由正副步哨员两人组成（也有因特殊原因派出一人或三人）。由正步哨员负责，副步哨员执行正步哨员的命令。步哨员的主要职责，就是把发现的各种情况随时报告班哨长，并且根据班哨长的命令动作。\n\
    \n2. 步哨的换班，必须隐蔽静肃，并且将情况向接班的人交代清楚。\n\n   正副步哨员的换班，一般是每小时换班一次。每次以新副步哨员上班，原副步哨员升为正步哨，原来的正步哨下班。\n\
    \n   单人哨一般是两小时换班一次。三人哨的换班时间，按情况决定，一般是两小时以上，也可以只规定归队的时间而不换班。\n\n3. 步哨员注意事项：\n\n\
    \   步哨员位置的选择，要既便于观察，又便于隐蔽（夜间应当选在低处）。采取何种姿势，根据地形决定。已经选定，就不准随便离开位置和变换姿势，任何时候都不能吸烟。步哨员为了时刻准备战斗，枪不能离手，要装上子弹，关好保险，上好刺刀，准备好手榴弹。\n\
    \n   不断地观察哨长所指定的地区，并且照顾两侧的情况。\n\n   对认识的我军部队指挥员、侦察员、通信员，准其通过。对于其他任何人员，都应当命令他站住，放下枪。白天停止在步哨前\
    \ 50~60米处，夜间只要一发现，立即命令他站住。\n\n   对于被扣的人员，必须命令他面向敌方，然后请班哨长来处理。班哨长没有来以前，不准被扣人员离开位置，也不和他谈话，并且随时准备射击。\n\
    \n   对不听步哨命令者，如判断确系敌人，应当捕捉或射杀。\n\n4. 发现敌人的处置。\n\n   发现敌人进攻和各种征兆（烧火、灰尘、音响等），应当立即报告哨长，并且继续观察。对单个敌人，应当力求将其俘获，对集群的敌人，应当射击抵抗。\n\
    \n   报告联络的方法，用预先规定好的目标、音响的记号或口头报告；必要的时候以射击或投手榴弹报告。\n\n5. 除步哨外，还有了望哨、潜伏哨、联络哨。\n\
    \n   了望哨，又叫远方观察哨，担任三至十里以内情况的观察；按情况的需要，由一至三人组成。联络哨，是担任步哨与警戒部队之间，或者警戒部队与被警戒部队之间的联络；通常由一人担任。潜伏哨，是在重要方向为了发现敌人，由排哨派出独立执行任务的；通常由三人组成，指定一人为哨长。\n\
    \n   他们的动作要和步哨同。只是了望哨、潜伏哨不处理来往人员。\n\n### （二）步哨勤务动作\n\n1. 步哨的配置，通常是由班哨长（或排哨长）亲自率领到步哨位置，授予特别守则，步哨员随即复诵任务。有时步哨位置比较明显，哨长一时有别的工作，可以指示步哨员以概略位置和观察方向，步哨员在复诵后，可以自己选择隐蔽道路到达步哨位置。待哨长来时，向哨长报告所得到的新情况，并且接受特别守则。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_139_0.png)\n\n2. 到达步哨位置后，先隐蔽地观察附近地形，选择便于观察和隐蔽的位置；必要时需要和副步哨员交互的将观察位置稍加修理，并且加以伪装。正副步哨员的配置，白天以能口头和配号互相通知，夜间以能低声互相谈话为原则。有时为了便于观察，可以一人在树上，另一人在地上（图118）。\n\
    \n   观察要细致周到，正副步哨员不要同时看一个方向，可以一人注意前方，一人注意两侧和后方。\n\n   对敌人容易隐蔽接近的地点，或者是通向敌人的要道，尤其应该特别注意。\n\
    \n3. 对哨长交给的任务要确实记住，在执行任务的时候要认真负责，换班的时候要交代清楚。\n\n   问口令通常是先命令前边的人站住，问明番号，然后命令其中二人到步哨位置附近，用低声问口令，如果口令不对或者答不出来，就请班哨长来处理。\n\
    \n4. 步哨员碰到下列情况中的一种时，可以射击：\n   - ① 情况紧急，有使被警戒的部队可能陷于危险的时候；\n   - ② 自己要脱离危险，或是援助自己人脱离危险的时候；\n\
    \   - ③ 在战斗中，有人通过步哨线，不受步哨指示和检查的时候；\n   - ④ 在战斗中，有人接近步哨线问他三声不回答的时候；\n   - ⑤ 假装投降，而企图有其他行动或者逃跑的时候。\n\
    \n5. 发现敌情，应该及时以记号或者是由副步哨员回去向哨长报告，并且通知邻哨。这时步哨员不仅要注意发生情况的地方，而且对侧方、后方也应该严密注意，防止敌人钻隙。副步哨员报告完毕，应该迅速回到步哨位置。\n\
    \n   换班的时候如果发现敌人袭击，接班者应该协助原来的步哨共同抵抗，由原来的副步哨员回去报告。\n\n   夜间换班，通常由班哨长亲自带去。白天可由班哨长指示接班的步哨员自己去做换班。换班回来的步哨员，在返回哨所的时候，应该注意隐蔽身体。\n\
    \n## 三 观察\n\n### （一）观察勤务原则\n\n1. 情况是指挥员指挥作战的根据，观察是了解情况最直接的方法。在战场上进行不间断的观察，就是保证指挥员在战斗中对自己部队顺畅的指挥。因此，除了被指定的观察员外，每个战士在战斗中都有观察的职责。\n\
    \n2. 观察员分两种，一是被指定随指挥员行动作为指挥员的助手的，一是临时派出独立担任对远方观察的。\n\n3. 观察员应该注意观察如下事项：\n   -\
    \ ① 敌人的兵力、兵种、武器如何配置和运动；\n   - ② 本军各分队及友邻指挥员的动作；\n   - ③ 空军；坦克和毒气警报的信号。\n\n   观察的时候应该注意一切征兆，如路上的尘土飞扬，村寨中狗的狂叫，人畜奔跑，武器的闪光，射击的声音，飞机的出现，夜间的灯火，可疑的便衣人员等。从这些征兆中判断敌人的行动，兵力的多少，和距离的远近。要善于从武器、服装和运动序列的不同来辨别情况。\n\
    \n4. 对于一切重要的发现，无论是敌人的，友邻的，或者是自己各分队的，观察员都应尽快地报告指挥员。\n\n### （二）观察勤务动作\n\n观察员位置的选择：最好的观察所（位置），要能够观察到所指定的地带，便于报告，而且不容易被敌人发觉。\n\
    \n白天应该在高处，如树上、山顶、楼房等。但是要注意不要利用明显的物体和遮蔽天空的地方，因为利用一个孤立的大土堆不如利用有许多草丛和小树丛的地方更隐蔽。站在很高的没有隐蔽的山顶上，很容易被远处的敌人发现。\n\
    \n对于背景的明暗也要注意。如穿黄色或灰色的衣服站在白色物体前面，比站在黑色物体前面，目标要明显的多。\n\n夜间的位置、姿势，都应该低些，这样可以听得多、看得远，特别是对于遮蔽在天空的目标，更容易发现。伏在地面上，容易听到远处的声音，伏在石地、草地、禾苗地附近，可以听得更远一些；但是不应该靠近有声音的河边、风车、水磨以及有杂乱声音的地方。在刮大风的夜里，选择的位置要避开大树。\n\
    \n**隐蔽和伪装：**\n\n- (1) 要使自己同周围的颜色混同起来。例如，利用树丛或者草丛向敌人观察的时候，应该用伪装网，或者在帽子上、携\n"
  mdcn: "\n## （三）小组的战斗队形\n\n小组在进攻战斗中，通常分为一路队形和散开队形两种。战士的间隔距离一般为6—8步（4.5—6米）。组长通常在组的先头、中央或一翼，以便于指挥联络。\n\
    \n组长使本组成一路队形前进的时候，口令是：“第一组成一路跟我来！”组长在先头对正目标前进，各战士按次序取适当距离，随组长前进（图106）。\n\n组长使本组由一路队形散开队形前进的时候，口令是：“目标——（方向）某处——散开！”这时，以组长为基准，对准目标前进。第二、四名向组长左方，第三名向组长右方，迅速散开前进（图107）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_125_0.png)\n\n组长为了适应情况，使本组由一路队形向一翼散开时，口令是：“目标——（方向）某处——向左（右）散开。”组长对准目标前进，其余战士按次序向组长左（右）散开前进（图108）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_125_1.png)\n\n![](img/b41346f815189f79888890b5225a828a_125_2.png)\n\
    \n组长使本组就地散开停止的时候，口令是：“目标——（方向）某处——就地散开！”组长对准目标停止，第二、四名向左，第三名向右迅速散开，各自利用地形地物，取适当姿态停止（图109）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_126_0.png)\n\n如果本组突然遭受敌火射击，或者情况需要迅速散开，组长可以直接下“散开”或“就地散开”的口令，不指示目标与方向，各战士迅速向组长左（右）散开、前进或就地停止。\n\
    \n小组在运动中的战斗队形，是根据敌火、地形不断变化的，有时形成一路队形（如通过凹沟狭窄地形）；有时形成一线的散开队形（如通过棱线或停止在棱线后方）；有时成三角散开队形（如通过开阔地及停止在森林、起伏地、坟地等）；有时形成左（右）梯次（如翼侧有顾虑的时候）。为了便于运动和执行任务，有时也可具体指示成何种散开队形。口令是：“目标——（方向）某处成一線（或左[右]梯次）散开！”（图110、111）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_126_1.png)\n\n![](img/b41346f815189f79888890b5225a828a_126_2.png)\n\
    \n![](img/b41346f815189f79888890b5225a828a_126_3.png)\n\n成战斗队形前进时，应为持枪姿势。在行进中要停止或者由停止继续前进的时候，组长可以下“停止”、“前进”、“向某处前进”的口令，或者以动作引导前进。在前进中需要变更方向的时候，组长可以以动作引导，或者以口令、手势指挥。\n\
    \n## （四）小组在敌火下的运动\n\n在前进运动中，组长指挥的要领除前面已谈的外，应该注意保持全组前进方向，避免在敌火下作横方向的运动；同时不间断地观察敌情、地形，带领本组不失时机地前进；还应注意向前进最快的小组取齐（取齐是跟上，不要拉远，而是在一条线上看齐）。\n\
    \n小组在什么情况下向前运动？一般地说最好的运动时机是：敌火间断、稀疏、转移和被我所压，或者地形隐蔽，或者有烟幕掩护的时候。\n\n在进攻战斗中小组的运动方法有两种：一是全组跃进，二是各个跃进。在敌火间断、地形隐蔽和有我火力掩护的时候，实行全组跃进。地形开阔，敌火力稀疏或者敌我火力中和的时候，实行各个跃进。全组跃进，组长以口令指挥，如“目标——（方向）某处——全组跃进！”各个跃进，一般是采取具体指挥方法，并由组长具体指示某战士前进至某处停止及停止后的动作。有时也可以用口令指挥，并且给战士一定的机动范围。\n\
    \n前进的时候应当密切与友邻协同。当友邻遭受敌害的时候，应迅速以火力和运动援助友邻；当友邻火力射击敌人有效的时候，应当迅速乘机前进。\n\n## （五）小组的射击指挥\n\
    \n在进攻中，通常是在得到班长指示以后开始射击。如果进至步枪有效射程内被敌火所阻，需要交互掩护前进，以火力支援友邻，或者发现有利的目标，小组也可以实行间断射击。\n\
    \n射击目标的指示，通常是在没有开始射击前，组长即将目标、方向、位置及射击方法简明告知战士。对于射击目标的选择，步、骑枪要选择最近的对我危害最大的目标，如正向我射击的敌人，或准备向我射击的敌机枪手、特等射手、炮手，以及指挥员、侦察员、通讯联络员等。\n\
    \n进攻中的射击方法，通常分为各放和齐放两种。对于敌人的散兵，一般采用各放，即各个战士自己寻找射击目标（或者根据上级指示），自选瞄准点，自行射击。指挥口令是：“目标——某处敌人散兵——各放！”如果需要加快射击速度，可以指示“快放”。齐放是由组长指定射击目标，在统一口令下，同时射击，如发现敌人向我反冲击，或者敌人危害我前进，我只有以突然齐放，才能将其消灭或者给与很大的杀伤。齐放口令是：“目标——某处附近敌人，瞄准——放！”射击中如果目标隐匿，组长可以发“暂停”口令，如果目标消灭，则发“停放”的口令。\n\
    \n小组在前进中，距敌较近，地形开阔，被敌稠密火网所阻，需要暂时停止或者进行射击制压敌人，则实行近迫作业。\n\n## （六）小组的冲击动作\n\n小组的冲击出发地，通常由上级具体指定。有炮兵掩护时，一般距离敌人前沿200米左右，没有炮兵掩护时，一般在敌手榴弹投掷的距离外。地点的选择，在地形上应当尽量求得隐蔽，便于进行冲击准备。\n\
    \n到达冲击出发地后，组长应该隐蔽地将战士稍做整顿，将班的冲击目标、道路、队形和冲击信号，简明告知，并且命令各战士迅速上刺刀、准备手榴弹和整顿装具。如果不占领冲击出发地，组长应该在运动中指示战士逐渐完成冲击准备。\n\
    \n冲击发起后，组长应该以自己的英勇模范行动，率领战士坚决地向敌猛冲。开始队形较疏散，在冲击前进中，逐渐缩小间隔距离。冲击既已发起，应当不顾一切损害，在我火力支援掩护下，乘我炮火及手榴弹的爆炸烟幕，迅速、坚决、顽强地向前猛冲，并且以短兵火器歼灭敌人。\n\
    \n# 战斗勤务\n\n## 一 侦察\n\n### （一）侦察勤务原则\n\n1. 侦察是获得敌人情报的一种手段。确切的情报是指挥官正确下定决心的重要根据。因此，侦察员是部队行动的耳目。\n\
    \n   侦察员的任务，是用一切手段，捕捉俘虏，缴获敌人的文件，力求发现敌人行动的一切征兆，如：敌人的兵力、兵种、技术兵器等。最有情报价值的是捕获敌人的军官和传达联络人员。\n\
    \n   侦察的方式很多，有化妆侦察（便衣侦察）和武装侦察。除此以外，每个战士都有收集敌人情报的责任，都应该将自己直接看到或者间接听到的情报随时报告给指挥员。\n\
    \n2. 这里着重介绍的是武装侦察，就是战士被派出担任一定的直接搜索任务。武装侦察通常是由两至三个侦察员（或战士）组成侦察小组，一人任组长。侦察小组有被专门派出搜索某一地区的，或者是派出在部队前方、侧方和后方担任侦察、警戒任务的。\n\
    \n### （二）侦察勤务动作\n\n1. 侦察员出发前的动作：\n\n   侦察组长受领任务以后，应当将敌人的情况、侦察组的任务、执行任务的方法等，告诉侦察员。每个侦察员必须确实明了自己的任务。\n\
    \n   为了防止泄密和暴露我军番号，严禁侦察员携带能判明我军番号和情况的物件，如：标有我军配置的地图、作战文书和个人文件等。在出发前，组长必须确实进行检查。\n\
    \n   整理好自己所携带的装具，不使在行动中发出声音。装好子弹，关上保险。\n\n2. 侦察组前进的队形：\n\n   侦察组前进的队形，是根据敌情、地形和任务来决定的。一般采用以下几种（以三人小组为例）：\n\
    \   - 在隐蔽地行进，多采用前三角队形 (△) 或后三角队形 (▽)；\n   - 在平坦开阔地，多采用一字队形；\n   - 在狭窄地，多采用一路纵队；\n\
    \   - 在复杂地形，多采用左梯次 (▚) 或右梯次 (▞) 队形。\n\n   侦察组组长多走在主要方向上。\n\n   各侦察员彼此间的间隔，根据地形以听力、视力能够互相联络、并且能够互相援助来决定。通常在日间不超过150米，夜间不超过50米。\n\
    \n3. 对各种地形地物的探索方法：\n\n   侦察组的行动，应当力求秘密，不使敌人发觉，并且便于我方观察。为此，在白天行进时，应当保持方向，充分的利用地形地物，由这一隐蔽地向另一隐蔽地运动，并且不间断地进行观察。在夜间行进，应当保持肃静，不使自己的装具和行动发出声音，并且注意静听。如果敌人照明，应迅速卧倒，待照明炮火再继续前进。遇到道路，应当在道路两旁沿着沟渠或顺树木的阴影前进（图112）。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_132_0.png)\n\n   (1) 对高地搜索的时候，应当尽量利用高地的阴暗处运动，切忌从山顶透空的棱线上运动（图113）。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_132_1.png)\n\n   对独立小高地搜索的时候，应当从两侧绕过，或者先向高地背面敌方进行观察，然后从有背影或隐蔽的侧斜面处通过。\n\
    \n   (2) 搜索凹地和谷地的时候，一人在低处行进，其余在岸上行进，并且互相保持密切的联系（图114）。\n\n   (3) 通过隘路的时候，先选定便于观察的位置，观察入口方面的险情，然后以一人接近入口处观察，如果隘路较短，先以一人迅速通过，到前面出口处观察后，其余侦察员再通过。如果隘路较长，则采用一路队形通过。必要的时候可以交互掩护搜索前进。到达出口处，先隐蔽的周密观察出口外面的情形后，很快的跃出去。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_133_0.png)\n\n   (4) 搜索森林之前，必须先在林沿外面精密的观察林内有没有征候，然后交互掩护搜索前进。在林中行进的时候，要保持静肃，不要撞动树枝，踏响枯草枯叶等，要时常止步倾听四周的音响，随时观察树上和草丛里的征候，如果有树枝、草叶动摇，就要仔细观察，判别其是否被风吹动，或者是有人触动。\n\
    \n   在森林内行进，间隔距离要根据森林的疏密程度适当的缩小或者扩大，以能互相联络和及时援助为适当（图115）。\n\n   在出林沿之前，应该对林沿外面严密的观察，并且选好停止的位置，然后迅速跃出。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_134_0.png)\n\n   (5) 搜索较大村庄的时候，应当首先在村外观察村内的动静。搜索街道的时候，应该利用街道两旁的墙角彼此交互前进和交互观察。通过横巷口的时候，应该由先在巷口对面的侦察员进行观察，待他发出确实没有人的记号以后，另一侦察员可以滚入巷内或者通过巷口（图116）。如果遇到较小的村落，可以按照图117要领搜索。\n\
    \n   搜索房屋的时候，先观察周围后，一人在门口作准备射击的姿势，防止敌人冲出，另一人在窗户观察或瞄准屋内，一人进屋搜索。\n\n   (6) 通过开阔地的时候，容易为敌人发现，应该扩大间隔，并且以低姿迅速通过。\n\
    \n4. 对各种征兆的判断：\n\n   敌人（尤其是敌人的侦察员）的行动常是诡秘的。因此，每一个侦察员应当善于发现问题，哪怕是轻微的征兆也好，都应该加以推测、分析、判断。尤其是对一切反常的状态，必须更加注意。例如：\n\
    \   - 在战斗期间的村落，如果发现狗乱叫、人喧哗、夜间发现火光等，都是敌人进村子的征兆，应该仔细查问。\n   - 如果村落、田野（农忙的时候）、大道上看不见行人，可能有敌人埋伏，不可冒然前进。\n\
    \   - 林鸟惊飞，虫声突然停止，必定有人行动，应该注意搜索。\n\n   对敌人驻过的村子应该仔细搜索。根据宿营后的痕迹（锅灶、马蹄印、车轨等）可以判断敌人的兵力、兵种和运动方向等。特别是对遗留下来的文件（哪怕只字片纸），也应当很好的搜集起来。必须知道，这些东西可以作为指挥员判断敌情的很好材料。\n\
    \n5. 对各种情况的处置：\n   - (1) 敌人侦察员经常化装居民、民兵以及我军人员等，来侦察我军的情况。我侦察员对这类情况应该特别注意，如果有可疑的人，就逮捕起来递交上级。\n\
    \   - (2) 遇到单个的敌人，应该尽量秘密捕捉。\n   - (3) 遇到多数敌人，如果还没有被发现，可以一面派人或者用记号报告部队，一面隐蔽地绕到敌侧继续观察。遇到敌人向我急进，来不及报告的时候，鸣枪报告。\n\
    \   - (4) 遇到优势敌人，除了迅速报告外，应当占领有利地形先敌开火（距离近的时候），就地抵抗。或者一方面报告，一方面绕到敌人侧面观察其后续部队，设法捕捉其掉队人员。捕捉了俘虏，首先解除他的武装，搜索他身上的文件、符号、日记本等；然后送部队处理。\n\
    \   - (5) 如果突然与敌人遭遇，假如自己陷入危险，应当鸣枪报警或者是勇猛突围。倘若同志遭遇危险，必须机敏勇敢的用射击或突刺去营救他。\n\n## 二\
    \ 警戒\n\n### （一）步哨勤务原则\n\n1. 步哨是由班哨或者排哨派出的，和派出哨所的距离，依据具体情况而定，一般白天不超过400米，夜间不超过50米。\n\
    \n   步哨通常由正副步哨员两人组成（也有因特殊原因派出一人或三人）。由正步哨员负责，副步哨员执行正步哨员的命令。步哨员的主要职责，就是把发现的各种情况随时报告班哨长，并且根据班哨长的命令动作。\n\
    \n2. 步哨的换班，必须隐蔽静肃，并且将情况向接班的人交代清楚。\n\n   正副步哨员的换班，一般是每小时换班一次。每次以新副步哨员上班，原副步哨员升为正步哨，原来的正步哨下班。\n\
    \n   单人哨一般是两小时换班一次。三人哨的换班时间，按情况决定，一般是两小时以上，也可以只规定归队的时间而不换班。\n\n3. 步哨员注意事项：\n\n\
    \   步哨员位置的选择，要既便于观察，又便于隐蔽（夜间应当选在低处）。采取何种姿势，根据地形决定。已经选定，就不准随便离开位置和变换姿势，任何时候都不能吸烟。步哨员为了时刻准备战斗，枪不能离手，要装上子弹，关好保险，上好刺刀，准备好手榴弹。\n\
    \n   不断地观察哨长所指定的地区，并且照顾两侧的情况。\n\n   对认识的我军部队指挥员、侦察员、通信员，准其通过。对于其他任何人员，都应当命令他站住，放下枪。白天停止在步哨前\
    \ 50~60米处，夜间只要一发现，立即命令他站住。\n\n   对于被扣的人员，必须命令他面向敌方，然后请班哨长来处理。班哨长没有来以前，不准被扣人员离开位置，也不和他谈话，并且随时准备射击。\n\
    \n   对不听步哨命令者，如判断确系敌人，应当捕捉或射杀。\n\n4. 发现敌人的处置。\n\n   发现敌人进攻和各种征兆（烧火、灰尘、音响等），应当立即报告哨长，并且继续观察。对单个敌人，应当力求将其俘获，对集群的敌人，应当射击抵抗。\n\
    \n   报告联络的方法，用预先规定好的目标、音响的记号或口头报告；必要的时候以射击或投手榴弹报告。\n\n5. 除步哨外，还有了望哨、潜伏哨、联络哨。\n\
    \n   了望哨，又叫远方观察哨，担任三至十里以内情况的观察；按情况的需要，由一至三人组成。联络哨，是担任步哨与警戒部队之间，或者警戒部队与被警戒部队之间的联络；通常由一人担任。潜伏哨，是在重要方向为了发现敌人，由排哨派出独立执行任务的；通常由三人组成，指定一人为哨长。\n\
    \n   他们的动作要和步哨同。只是了望哨、潜伏哨不处理来往人员。\n\n### （二）步哨勤务动作\n\n1. 步哨的配置，通常是由班哨长（或排哨长）亲自率领到步哨位置，授予特别守则，步哨员随即复诵任务。有时步哨位置比较明显，哨长一时有别的工作，可以指示步哨员以概略位置和观察方向，步哨员在复诵后，可以自己选择隐蔽道路到达步哨位置。待哨长来时，向哨长报告所得到的新情况，并且接受特别守则。\n\
    \n   ![](img/b41346f815189f79888890b5225a828a_139_0.png)\n\n2. 到达步哨位置后，先隐蔽地观察附近地形，选择便于观察和隐蔽的位置；必要时需要和副步哨员交互的将观察位置稍加修理，并且加以伪装。正副步哨员的配置，白天以能口头和配号互相通知，夜间以能低声互相谈话为原则。有时为了便于观察，可以一人在树上，另一人在地上（图118）。\n\
    \n   观察要细致周到，正副步哨员不要同时看一个方向，可以一人注意前方，一人注意两侧和后方。\n\n   对敌人容易隐蔽接近的地点，或者是通向敌人的要道，尤其应该特别注意。\n\
    \n3. 对哨长交给的任务要确实记住，在执行任务的时候要认真负责，换班的时候要交代清楚。\n\n   问口令通常是先命令前边的人站住，问明番号，然后命令其中二人到步哨位置附近，用低声问口令，如果口令不对或者答不出来，就请班哨长来处理。\n\
    \n4. 步哨员碰到下列情况中的一种时，可以射击：\n   - ① 情况紧急，有使被警戒的部队可能陷于危险的时候；\n   - ② 自己要脱离危险，或是援助自己人脱离危险的时候；\n\
    \   - ③ 在战斗中，有人通过步哨线，不受步哨指示和检查的时候；\n   - ④ 在战斗中，有人接近步哨线问他三声不回答的时候；\n   - ⑤ 假装投降，而企图有其他行动或者逃跑的时候。\n\
    \n5. 发现敌情，应该及时以记号或者是由副步哨员回去向哨长报告，并且通知邻哨。这时步哨员不仅要注意发生情况的地方，而且对侧方、后方也应该严密注意，防止敌人钻隙。副步哨员报告完毕，应该迅速回到步哨位置。\n\
    \n   换班的时候如果发现敌人袭击，接班者应该协助原来的步哨共同抵抗，由原来的副步哨员回去报告。\n\n   夜间换班，通常由班哨长亲自带去。白天可由班哨长指示接班的步哨员自己去做换班。换班回来的步哨员，在返回哨所的时候，应该注意隐蔽身体。\n\
    \n## 三 观察\n\n### （一）观察勤务原则\n\n1. 情况是指挥员指挥作战的根据，观察是了解情况最直接的方法。在战场上进行不间断的观察，就是保证指挥员在战斗中对自己部队顺畅的指挥。因此，除了被指定的观察员外，每个战士在战斗中都有观察的职责。\n\
    \n2. 观察员分两种，一是被指定随指挥员行动作为指挥员的助手的，一是临时派出独立担任对远方观察的。\n\n3. 观察员应该注意观察如下事项：\n   -\
    \ ① 敌人的兵力、兵种、武器如何配置和运动；\n   - ② 本军各分队及友邻指挥员的动作；\n   - ③ 空军；坦克和毒气警报的信号。\n\n   观察的时候应该注意一切征兆，如路上的尘土飞扬，村寨中狗的狂叫，人畜奔跑，武器的闪光，射击的声音，飞机的出现，夜间的灯火，可疑的便衣人员等。从这些征兆中判断敌人的行动，兵力的多少，和距离的远近。要善于从武器、服装和运动序列的不同来辨别情况。\n\
    \n4. 对于一切重要的发现，无论是敌人的，友邻的，或者是自己各分队的，观察员都应尽快地报告指挥员。\n\n### （二）观察勤务动作\n\n观察员位置的选择：最好的观察所（位置），要能够观察到所指定的地带，便于报告，而且不容易被敌人发觉。\n\
    \n白天应该在高处，如树上、山顶、楼房等。但是要注意不要利用明显的物体和遮蔽天空的地方，因为利用一个孤立的大土堆不如利用有许多草丛和小树丛的地方更隐蔽。站在很高的没有隐蔽的山顶上，很容易被远处的敌人发现。\n\
    \n对于背景的明暗也要注意。如穿黄色或灰色的衣服站在白色物体前面，比站在黑色物体前面，目标要明显的多。\n\n夜间的位置、姿势，都应该低些，这样可以听得多、看得远，特别是对于遮蔽在天空的目标，更容易发现。伏在地面上，容易听到远处的声音，伏在石地、草地、禾苗地附近，可以听得更远一些；但是不应该靠近有声音的河边、风车、水磨以及有杂乱声音的地方。在刮大风的夜里，选择的位置要避开大树。\n\
    \n**隐蔽和伪装：**\n\n- (1) 要使自己同周围的颜色混同起来。例如，利用树丛或者草丛向敌人观察的时候，应该用伪装网，或者在帽子上、携\n"
