    # (二) 弹道


    什么是弹道：弹头跑出枪口后，一直到达目标所经过的这条路线，就叫做弹道。


    弹头在空气中是怎样飞行的？


    有人认为弹头出枪口后，是一直朝前飞的，其实不对，如果是那样，飞出枪口的弹头永远也不会落到地上来了。实际上弹头飞行的道路是弯曲的，画出一条抛物线（参看图39）。


    为什么弹头飞行的路线是弯的？因为弹头在飞行的时候受到两种力量的影响：一种是空气的阻力，一种是地心吸力。


    关于空气的阻力，道理很浅显。比如你骑自行车骑得很快的时候，虽然没有风，也感觉好象有一种风力阻挡前进。'
  - '[PAGE 58]


    ![](img/b41346f815189f79888890b5225a828a_58_0.png)


    气对弹头飞行的阻力，就使弹头越飞越没有力气，不得不慢慢地停下来。


    关于地心吸力，道理也很浅显。我们把任何东西往上丢，都要落下来，就是因为地心吸力把它往下拉的缘故。地球对弹头的吸引力，就使弹头在飞的时候，不得不慢慢向下降落。


    这两种力量的影响，就使弹头飞行的路线是弯曲的。


    所以当我们瞄准目标射击，弹头刚出枪口飞行的路线是偏高一些的。这样慢慢弯曲下来，刚好击中目标，这个弯曲的度数，在造枪的时候已经计算好了。我们射击的时候只要把表尺定对就行了。


