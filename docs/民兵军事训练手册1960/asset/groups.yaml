    # （五）小組的射撃指揮


    在进攻中，通常是在得到班长指示以后开始射击。 如果进至步枪有效射程内被敵火所阻，需要交互掩护前进，以火力支援友邻，或者发现有利的目标，小組也可以实行間断射击。


    射击目标的指示，通常是在没有开始射击前，組长即将目标、方向、位置及射击方法簡明告知战士。对于射击目标的选择，步、騎枪要选择最近的对我危害最大的目标，如正向我射击的敌人，或准备向我射击的敌机枪手、特等射手、炮手，以及指揮員、偵察員、通訊連絡員等。


    进攻中的射击方法，通常分为各放和齐放两种。 对于敌人的散兵，一般采用各放，即各个战士自己寻找射击目标（或者根据上級指示），自选瞄准点，自行射击。 指揮口令是："目标——某处敌人散兵——各放！"如果需要加快射击速度，可以指示"快放"。
    齐放是由組长指定射击目标，在统一口令下，同时射击，如发现敌人向我反冲击，或者敌人危害我前进，我只有以突然齐放，才能将其消灭或者给与很大的杀伤。 齐放口令是："目标——某处附近敌人，瞄准——放！"射击中如果目标隐匿，組长可以发"暂停"口令，如果
    目标消灭，则发"停放"的口令。


    小組在前进中，距敌較近，地形开闊，被敌稠密火网所阻，需要暫時停止或者进行射击制压敌人，则实行近迫作业。


    # （六）小組的冲击动作


    小組的冲击出发地，通常由上級具体指定。 有炮兵掩护时，一般距离敌人前沿200米左右，没有炮兵掩护时，一般在敌手榴弹投擲的距离外。 地点的选择，在地形上应当尽量求得隐蔽，便于进行冲击准备。'
  - '[PAGE 129]


    到达冲击出发地后，组长应该隐蔽地将战士稍做整顿，将班的冲击目标、道路、队形和冲击信号，简明告知，并且命令各战士迅速上刺刀、准备手榴弹和整顿装具。如果不占领冲击出发地，组长应该在运动中指示战士逐渐完成冲击准备。


    冲击发起后，组长应该以自己的英勇模范行动，率领战士坚决地向敌猛冲。开始队形较疏散，在冲击前进中，逐渐缩小间隔距离。冲击既已发起，应当不顾一切损害，在我火力支援掩护下，乘我炮火及手榴弹的爆炸烟幕，迅速、坚决、顽强的向前猛冲，并且以短兵火器歼灭敌人。'
