    在毒区内挖掘掩体的动作要领是：侧身卧在防毒垫上（枪先放在防毒垫上，然后可放在翻过的地上），用圆锹先翻除地表面一层土，向下风方向投出，注意不得将土扬起，以免沾染别人和自己；然后用没有沾染的土修补胸墙（图19）。在挖掘掩体的时候，应当注意不间断的监视敌人。


    ![](img/b41346f815189f79888890b5225a828a_33_0.png)


    必须记住，在任何情况下，都应该以坚决，勇敢的行动，来完成战斗任务。任何时候，都不得因为防护敌人原子、化学武器袭击而停止战斗。


