    标，就要特别注意仔细观察战场，很快发现目标，迅速测定距离，尽快的完成射击准备，把枪瞄向目标将要出现的地方，等目标一露头，立即修正瞄准射击。如果事先不知道目标在那里出现，可以把枪口指向目标可能出现的地区，等目标一出来，很快瞄准射击。在紧急的情况下，为了不让敌人跑掉，可以不用精确瞄准，而采用概略瞄准射击；但是时间来得及，还是应当在精确瞄准后再射击。


