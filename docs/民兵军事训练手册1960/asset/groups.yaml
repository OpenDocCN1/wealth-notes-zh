    ## (一) 地形、地物的識別\n\n什麼是地形地物？地形是指地面上高低起伏的形状，如山地、丘陵、平原等。地物是指地面上天然的（河流、沼澤、森林、沙漠和草原等）和人工的（居民點、建築物、道路等）固定物體。\n\
    \n### 地形地物對軍事行動的關係：\n\n地形地物的條件對軍事行動有著密切的關係。如進行攻防戰、行軍、宿營、觀察、射擊等等，都必須考慮到地形地物的影響。尤其是在戰鬥中，如果能很好的利用地形地物，可以以少胜多；取得戰鬥的勝利；如果不善于利用地形地物，則會增加傷亡，造成戰鬥中的困難。在現代戰爭中，對原子、化學武器突擊的防護，地形地物條件更有著重要的作用。因此，每個民兵都必須了解地形地物對軍事行動的關係，以便在不同的地形地物上正確地、靈活地行動，以達到歼滅敵人、保存自己的目的。\n\
    \n### 地形對戰鬥行動的影響：\n\n#### 1. 山地（參看图81）\n\n一般山地的優點是：有較高的山頂，便于觀察和組織火力，控制敵人的行動；山坡便于設置觀察所、陣地；山背後便于設置迫击炮陣地和掩蔽部。\n\
    \n缺点是：由于山地多岩石，容易受跳弹伤害，构筑工事也困难，但是，可以利用岩石构成坚固的坑道工事，在朝鲜上甘岭战斗中，我志愿军就是依托坑道工事粉碎了敌人进攻的。其次，山地道路少，山路狭窄、崎岖，军队行动不便，往往只能成一路纵队行进。夜间行动，容易失掉联络。重要的道路、山口，容易被敌火封锁和打埋伏，因此，必须加强侦察、警戒。\n\
    \n至于深山、密林、山谷等地，可以避免敌人空中和地面的观察，便于隐蔽活动和进行游击战。但是这也正是敌人空投特务的地区，应当特别注意。在这些地区，各种火器的效力常常受地形地物的限制；通信联络、补给运输亦比较困难。\n\
    \n#### 2. 丘陵地\n\n一般高度在200米以下，斜坡比山地小，而且多被开垦成梯田。丘陵地带对进攻和防御战斗都有利，便于构筑工事，便于部队机动，也可以充分发挥各种火器的威力。丘陵地内的深谷、雨裂地、河流等，是防坦克的天然障碍，对原子、化学武器的袭击也便于防护。\n\
    \n#### 3. 平坦地\n\n村落较多，道路稠密，展望良好，射界开阔，便于军队运动和发挥各种火器的威力。但是不易隐蔽。因此，在战斗中应当特别注意利用坟丘、土坎、道沟、弹坑等地物。\n\
    \n平坦地在不同的季节对军事行动的影响也不同，如夏季植物茂盛，容易隐蔽地接近敌人，但是观察和射击要受限制。\n\n### 地物对战斗行动的影响：\n\n-\
    \ 1. 居民地（村落）：有互相毗连的房屋、建筑物，不便于观察和射击，部队的机动亦受限制，是炮兵、空军轰炸的目标。坚固的城墙、围城河沟等，可以形成防坦克、防步兵的障碍物。地下室可以做掩蔽部。在居民地战斗的时候，应当利用门、窗、墙垣、缺口等，进行观察和射击。\n\
    - 2. 道路：铁路、公路和各种道路的桥梁，在战斗中对军队的运动、补给起着重要的作用，尤其是交通枢纽和重要桥梁更为重要，但是这也正是敌空军、炮兵轰炸的目标。因此，在这些地区的民兵，必须加强关于防空、护路、伪装和抢修工程等方面的教育。\n\
    - 3. 江河：一般的河流便于观察射击，较大的河流，是防御、战斗的天然障碍，可以用火力控制两岸和浅滩。\n\n由于天气、季节的变化，江河对战斗影响的程度亦不同。平时能通行的河流，到雨季、汛期就可能成为通行的障碍。一般在冬季影响小，夏季影响大。因此，在河流地带行动的时候，应当加强对河流的侦察。\n\
    \n- 4. 水网地：地面平坦，展望良好，射界开阔。有错综稠密的河流、湖泊、池塘、水田等。道路（特别是公路）较少，乡村的道路多在田埂或河堤上；交通不便，军队行动比较困难。工事大多只能用土构筑。另外，水网地带潮湿，应当特别注意武器、弹药的防潮。\n\
    - 5. 沼泽地：地面经常潮湿或部分被水淹没，有的沼泽地，步兵也不能通行，对部队的行动有限制。防御阵地前沿的沼泽地，是良好的障碍物。\n- 6. **森林地**：便于隐蔽，但是对观察、射击、运动等有很大限制，指挥和维持方向也比较困难。森林地区空气湿润，必须注意防潮。另外，森林地由于有茂密的枝叶遮盖，可以减少原子武器爆炸时候的伤害，但是容易引起严重的火灾。由于森林地空气流通较慢，也容易停留毒剂。因此，必须注意防火防毒。\n\
    - 7. **沙漠**：沙漠地形开阔，便于观察和射击，但是容易暴露目标。沙漠地区气候干燥，缺乏饮水和燃料，气温变化剧烈，多风沙，由于尘土飞扬，容易使武器发生故障。构筑工事比较容易，由于不坚固，容易倒塌，运动也比较困难。\n\
    - 8. **草原**：一般地形平坦开阔，除高草地外，都便于观察和射击。草原地内往往有很多沼泽地，影响军队运动。草原地带夏季多狂风暴雨。草原枯萎季节容易发生火灾。\n\
    \n## (二) 利用地形、地物\n\n为了在战斗中，突然迅速勇猛的歼灭敌人，必须很好的学会利用地形地物。利用地形、地物的目的是发扬火力，隐蔽身体。发扬火力是主要的，只有发扬火力才能达到消灭敌人保存自己的目的。但是为了发扬火力，有些地形不一定都能完全隐蔽身体，必要时的得利用。发扬火力和隐蔽身体是利用地形地物的两大原则。\n\
    \n由于目的不同，利用地形地物的一般原则是：\n\n- 以射击为目的，要视野广阔，便于观察，能发扬火力，依托确实。\n- 以隐蔽为目的，要掩蔽确实；能够避免敌炮火伤害，及敌人的地面和空中侦察。\n\
    - 以观察为目的, 要展望良好, 不容易被敌人发现。\n- 以进攻为目的, 要便于隐蔽地接近敌人, 能够发扬火力, 前进容易, 便于展开兵力和通信联络。\n\
    - 以防御为目的, 视界、射界都必须开阔, 便于伪装, 不致暴露目标, 阵地前面没有死角, 使敌难于接近。\n- 以警戒为目的, 要选择敌人必经的地方, 视界宽阔,\
    \ 便于射击, 有良好的隐蔽, 能避免敌人地面和空中的侦察。与我侧后方联络方便。\n\n### 利用地形、地物的方法\n\n在战斗中常常遇到各种不同的地形、地物,\
    \ 当然利用方法也就不同。以下谈谈最常遇到的地形、地物和利用它们的方法。\n\n- 1. 坟包、土堆: 遇有坟包、土堆时, 应很快地前进, 趴倒在坟包、土堆的右后方,\
    \ 并应由下而上的利用以避免暴露目标, 如果因为位置低妨碍观察、射击, 应向适于观察和射击的地方移动一下。\n\n因为装子弹、开闭枪机、扣扳机都用右手、右臂活动,\
    \ 瞄准也用右眼, 这样, 利用坟包的右侧, 动作是比较方便的, 同时又能隐蔽身体(图82)。\n\n![](img/b41346f815189f79888890b5225a828a_89_0.png)\n\
    \n- 2. 墙壁: 根据墙的高低, 采取适当的姿势。墙比自己高, 可挖枪眼或利用其他东西垫起来进行射击, 如果墙已破坏, 可利用其残缺部分作射击依托(图83)。\n\
    \n![](img/b41346f815189f79888890b5225a828a_89_1.png)\n\n- 3. 沟渠: 在战斗中常常遇到横一道竖一道大小不一样的沟渠，应根据沟的深浅，决定前进的姿势。沟比人的身体深，可以挺身前进，及膝深的沟应曲身前进。停止时，应该迅速选择沟沿的缺口，进行隐蔽的观察和射击（图84）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_0.png)\n\n- 4. 土坎、田埂：根据土坎的高低，应采取适当的姿势（立姿、跪姿或卧姿）来利用。但头不应高出土坎过多，只要可以用眼睛观察和瞄准就够了（图85）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_1.png)\n\n- 5. 河堤：遇有河堤时，根据情况可以利用在我方河沿上的堤，也可以利用在敌方河沿上的堤，但一定要利用向着我方的斜面。如果河的宽度不大，而敌方的河堤又比我方的高，最好是利用敌方河沿上的堤，这样，便于射击。利用河堤的方法与利用土坎相同（图86）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_2.png)\n\n- 6. 凹地：一般地说，凹地是较隐蔽的；如在凹地运动时，应根据凹下的程度灵活地采取姿势；在凹地奉命停止时，可迅速进到靠敌方一边的斜面（图87）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_3.png)\n\n![](img/b41346f815189f79888890b5225a828a_91_0.png)\n\
    \n- 7. 门窗：要利用门窗的左侧，左臂体托门窗框或门窗左侧的墙壁进行射击，这样，便于射击和隐蔽身体（图88）。\n\n- 8. 树木：应利用树木的右侧，左臂靠树干，作射击依托，既能使射击稳固，又能隐蔽身体。根据树干的粗细，采取不同的射击姿势。树干粗超过50厘米以上，能够遮蔽敌人的子弹，可以采取立射或跪射姿势，树干粗不能遮蔽敌人的子弹时，可利用树根采取卧射姿势（图89）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_91_1.png)\n\n- 9. 独立家屋：在独立家屋停止时，应迅速占领墙角，墙壁、屋顶等。但在独立家屋不能停留过久。停留时应保持隐蔽，因为独立家屋容易被敌人发现，遭到射击。所以独立家屋附近有地形可以利用时，也可以不去利用它（图90）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_91_2.png)\n\n- 10. 丛林：在丛林中停止的时候，应迅速地进到向敌人的那一边，不要停在我方边沿或丛林内。这样，既可以利用树木隐藏自己，又可以在停止时观察前进的道路和敌情。如果遇到稀疏的树林，也可以班或小组穿过，但必须和林边行进的队伍保持联系，免得迷失方向(图91)。\n\
    \n![](img/b41346f815189f79888890b5225a828a_92_0.png)\n\n地形是死的，而情况是变的，因此，对于地形、地物，一定要灵活地加以利用。\n\
    \n利用地形、地物应提注意的几件事：\n\n- 1. 不论利用什么地形、地物，都要避免敌人的观察和敌人火力的损害，应当随时观察敌人的行动。\n- 2. 石头、石碑及其附近的地方不可以利用，以免受崩弹和破片的杀伤。\n\
    - 3. 利用地形地物时不要挤在一起，以免暴露目标，遭受伤亡。\n- 4. 在利用地形地物时，还要注意防止敌人空中侦察。\n- 5. 不可妨碍左邻的射击和指挥员的指挥。\n\
    \n# 二 方位判定\n\n在我们熟悉的地方，辨别东南西北方向和各种物体的相互位置，是很容易的。但是在生疏而复杂的地形上，如果不善于判定方位，就会迷失方向，影响任务的完成，甚至有误入敌境的危险。因此，正确的判定方位，有着重要作用。\n\
    \n判定方位的方法很多，这里简要的介绍几种。各地民兵可以根据当地的情况，选择和创造最实用的方法。\n\n## (一) 按太阳判定方位\n\n早晨 6 点钟左右太阳在东方；\n\
    \n上午 9 点钟左右太阳在东南；\n\n中午 12 点钟左右太阳在南方；\n\n下午 3 点钟左右太阳在西南；\n\n下午 6 点钟左右太阳在西方。\n\n\
    因为季节不同，太阳出没的时间也不同，所以按照上述方法，只能在春秋两季概略地判定方位。\n\n## (二) 按太阳和钟表判定方位(图92)\n\n将钟表平放，以时针所指时数的半数的位置对向太阳，则“12”的方向就是正北方。(使用这个方法时，每日应以\
    \ 24 小时计算，如下午 1 时即为 13 时，余类推。)\n\n![](img/b41346f815189f79888890b5225a828a_93_0.png)\n\
    \n例如：上午 8 时，应以“ 4 ”对向太阳，如上图左；若是下午 2时（即14时），应以“7”对向太阳，如图92右。\n\n![](img/b41346f815189f79888890b5225a828a_94_0.png)\n\
    \n## （三）按指南针判定方位（图93）\n\n平放指南针，等磁针静止后，指针上涂有色漆或夜光的一端所指的方向就是北方。\n\n## （四）夜间，按北极星判定方位（图94）\n\
    \n北极星永远位于北方；是小熊星座中最亮的一颗星。要找到北极星，可以先找到大熊星座（俗称北斗星）。大熊星座有七颗很亮的星，形状象一把扫帚，我们设想将扫帚最外的两颗星连成一条直线，然后把这条假想的线，沿着勺口的方向再延长五倍，便能找到比北斗七星亮度稍差一点的北极星了。\n\
    \n在我国南部各省，有时看不见大熊星座，可以依靠仙后星座（图95）。（又称女帝星）来找北极星。仙后星座有五颗很亮的星，形状象“W”，它的缺口对着北极星，离开缺口约两倍的地方，便能找到北极星了。\n\
    \n![](img/b41346f815189f79888890b5225a828a_94_1.png)\n\n## （五）利用各种特征判定方位\n\n-\
    \ （1）树木的树皮朝北的比朝南的粗糙，裂纹多，深，背苔厚；南面的枝叶比北面的较密（白果树相反）。树桩的花纹（年轮），北面的紧密，南面的稀散（参看图95）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_95_0.png)\n\n- （2）背苔爱生长在冷湿背阳的树木、石头和地面上。\n\
    - （3）在沟、坑等凹地里和树林中空地里的积雪，北面比南面化的快；凸起的土堆、坟丘、建筑物等的积雪，南面比北面化的快。\n- （4）我国庙宇的门大多面朝南方。\n\
    - （5）我国北方春天多东风和东南风，夏天多南风，秋天多西北风和西风，冬天多北风。\n\n# 三 距離測量\n\n在战斗中射击的时候，必须知道目标的距离，才能正确地装定表尺，射击才会精确。所以我们不但要善于发现敌人，还要知道敌人距我们多远，这就要测量距离。\n\
    \n测量距离的方法很多，最简便的有目测、步测和声测等。\n\n## （一）目测\n\n就是用眼睛测定距离，这是基本的方法。目测的一般方法有两种：\n\n-\
    \ （1）根据印象深刻的地段以比较法测定距离；如自己对常用的实际距离（如100、200、400、800米等）有一个深刻的印象，目测的时候就用这个无形的尺子去比较；或者预先用其他方法测量一段距离，把它和需要测量的距离比较。这种方法比较简便，但是使用时应当注意眼睛的误差，因为近距离的地段容易显得长些，远距离的地段容易显得短些；从上向下观察，比从下向上观察的距离要显得远些。\n\
    - （2）根据目标的能见度和大小测定距离：例如一般人的视力（近视或远视的，可以根据自己的视力进行修正），对人在：\n  - 50米可以看出两眼如黑点；\n\
    \  - 100米可以看出人脸的模样、步、机枪零件；\n  - 200米可以看出头部和肩部的轮廓；\n  - 300-400米可以看出服装的颜色和步兵武器；\n\
    \  - 700-800米可以看出行走或跑远的动作。\n\n目测距离的时候，还应当注意：①较大的地物（森林、居民点等）比位于同一距离上的较小地物（灌木丛、小丘、石块）显得近些；②在同一距离上，反光较强的地物比反光较弱的地物显得近些；③颜色鲜明的地物，比颜色暗淡的地物显得近些；④地物在阴天、雨天、黄昏、拂晓以及起雾的时候，比在有太阳的晴天显得远些；⑤在开阔地、覆盖着积雪的地段、山区以及通过宽阔的水面时，观测的地物比真实位置显得近些；⑥从下向上观测，比由上向下观测显得近些。\n\
    \n## (二) 步测\n\n就是用自己走的步数来计算距离。一般人的步子，一单步为75厘米，一复步(即两个单步)为1.5米。步测的时候，只要记住由起点到目标所走的复步数，乘1.5或加复步数的一半，就得出距离多少米了。\n\
    \n步测的时候，步子的大小要一致，方向要正直。个别同志身材高大或较小，不合标准步度，可以用自己步度的实际长度来计算。\n\n## (三) 声测\n\n声音在空气中传播的速度，每秒钟约330米，即3秒钟传播约一公里，而光的速度和电一样，快得多。在战斗中，从看到枪炮射击的闪光起，到听见发射声止，计算中间所经过的时间，便可计算出距离。例如发现敌阵地闪光后经过3秒钟才听到枪炮声，则3×330≈990米，可知敌阵地距离我约一公里。计算时间时可以用数数的办法，即数1—2—3……，并且使每数一个数正好是一秒钟。\n\
    \n上面所说的几种测量距离的方法，都必须在平时多加演练，才能在战斗中运用得准确熟练。\n\n# 四、观察及指示目标\n\n在战场上，敌人是狡猾的，他们也会伪装得很好，也会尽量利用地形地进行隐蔽。观察及指示目标的目的，就在于及时发现敌情，了解地形，并且迅速明确的指示目标的方向。\n\
    \n位置，以便及时地采取措施和进行处置；顺利的完成战斗任务。\n\n## （一）观察的方法\n\n请参阅本书第134页的“观察”一节。\n\n## （二）指示目标的方法\n\
    \n指示目标，必须简单扼要，迅速、明确，态度从容果断，不要使被指示者感觉模糊、犹豫，以便迅速发现目标。方法如下：\n\n- 1. 直接指示法：对显而易见的目标，直接指出目标本身的特征，如：“正前方，敌空降特务！”\n\
    - 2. 间接指示法：如果目标附近物体复杂难以发现的时候，可以在显明物体附近，按照它与显明物体的关系位置指示，如：“目标：独立树左，50米，敌轻机枪！”\n\
    \n也可以用指幅间接指示目标，即将臂伸直，手指向上竖起，以一眼透视手指两侧，测得由显明物体至目标的指幅数指示。如：“目标：正前方小庙右三指幅，敌人散兵！”\n\
    \n- 3. 用瞄准线指示法：如果目标小、隐蔽、难以发现的时候，可以用这一方法指示。即将枪固定在一地物上，使瞄准线指向目标，然后让不知道目标所在的民兵来瞄准。\n\
    - 4. 用射击指示法：情况紧迫，来不及指示的时候，可以向目标射击，依照弹着点来指示目标。\n\n# 五 信号和暗号的使用\n\n在战斗中或执行勤务的时候，仅仅靠口令，传达命令进行指挥联络是不够的。使用信号、暗号的目的，就是用来补助战斗指挥和通信联络的不足，以达到指挥灵活，动作及时。\n\
    \n一般使用的信号、暗号，有以下几种：\n"
  mdcn: "\n新土等。\n\n## 2. 探針的制造和用法，見下图：\n\n簡易探査地雷用的短探針，主要在敵火下使用：\n\n![](img/b41346f815189f79888890b5225a828a_84_0.png)\n\
    \n立麥探査地雷用的長探針：\n\n![](img/b41346f815189f79888890b5225a828a_84_1.png)\n\n用探針探察地雷的情形\n\
    \n图80 · 探針的制造和使用方法\n\n## 3. 用手起出地雷的方法\n\n對触發地雷，起出的步驟如下：\n\n- （1）先仔細察看屬於哪一种裝置的地雷，如果判斷不清，可以在一個先挖小坑看清后再起；\n\
    - （2）用手輕輕除去四周伪装土；\n- （3）慢慢撥开伪装板（如是繩、線連粘，要剪斷或除去）；\n- （4）如果是踏、拉雷，先剪斷拉繩；\n- （5）插上保險片，取出引信。\n\
    \n對拉發地雷，起出的步驟如下：\n\n迅速剪斷繩線（張線過緊的，要防止敵人的松發砲雷），再慢慢取出。\n\n## 4. 不能起出或難起出的地雷，用炮兵射击或用手榴彈、炸藥包誘發之。\n\
    \n## 5. 如果發現地雷后当時不能排除，就应当用石灰、小旗等标出，以免后續部队踏上。\n\n# 战斗動作訓練\n\n# 一 地形、地物的識別與利用\n\n\
    ## (一) 地形、地物的識別\n\n什麼是地形地物？地形是指地面上高低起伏的形状，如山地、丘陵、平原等。地物是指地面上天然的（河流、沼澤、森林、沙漠和草原等）和人工的（居民點、建築物、道路等）固定物體。\n\
    \n### 地形地物對軍事行動的關係：\n\n地形地物的條件對軍事行動有著密切的關係。如進行攻防戰、行軍、宿營、觀察、射擊等等，都必須考慮到地形地物的影響。尤其是在戰鬥中，如果能很好的利用地形地物，可以以少胜多；取得戰鬥的勝利；如果不善于利用地形地物，則會增加傷亡，造成戰鬥中的困難。在現代戰爭中，對原子、化學武器突擊的防護，地形地物條件更有著重要的作用。因此，每個民兵都必須了解地形地物對軍事行動的關係，以便在不同的地形地物上正確地、靈活地行動，以達到歼滅敵人、保存自己的目的。\n\
    \n### 地形對戰鬥行動的影響：\n\n#### 1. 山地（參看图81）\n\n一般山地的優點是：有較高的山頂，便于觀察和組織火力，控制敵人的行動；山坡便于設置觀察所、陣地；山背後便于設置迫击炮陣地和掩蔽部。\n\
    \n缺点是：由于山地多岩石，容易受跳弹伤害，构筑工事也困难，但是，可以利用岩石构成坚固的坑道工事，在朝鲜上甘岭战斗中，我志愿军就是依托坑道工事粉碎了敌人进攻的。其次，山地道路少，山路狭窄、崎岖，军队行动不便，往往只能成一路纵队行进。夜间行动，容易失掉联络。重要的道路、山口，容易被敌火封锁和打埋伏，因此，必须加强侦察、警戒。\n\
    \n至于深山、密林、山谷等地，可以避免敌人空中和地面的观察，便于隐蔽活动和进行游击战。但是这也正是敌人空投特务的地区，应当特别注意。在这些地区，各种火器的效力常常受地形地物的限制；通信联络、补给运输亦比较困难。\n\
    \n#### 2. 丘陵地\n\n一般高度在200米以下，斜坡比山地小，而且多被开垦成梯田。丘陵地带对进攻和防御战斗都有利，便于构筑工事，便于部队机动，也可以充分发挥各种火器的威力。丘陵地内的深谷、雨裂地、河流等，是防坦克的天然障碍，对原子、化学武器的袭击也便于防护。\n\
    \n#### 3. 平坦地\n\n村落较多，道路稠密，展望良好，射界开阔，便于军队运动和发挥各种火器的威力。但是不易隐蔽。因此，在战斗中应当特别注意利用坟丘、土坎、道沟、弹坑等地物。\n\
    \n平坦地在不同的季节对军事行动的影响也不同，如夏季植物茂盛，容易隐蔽地接近敌人，但是观察和射击要受限制。\n\n### 地物对战斗行动的影响：\n\n-\
    \ 1. 居民地（村落）：有互相毗连的房屋、建筑物，不便于观察和射击，部队的机动亦受限制，是炮兵、空军轰炸的目标。坚固的城墙、围城河沟等，可以形成防坦克、防步兵的障碍物。地下室可以做掩蔽部。在居民地战斗的时候，应当利用门、窗、墙垣、缺口等，进行观察和射击。\n\
    - 2. 道路：铁路、公路和各种道路的桥梁，在战斗中对军队的运动、补给起着重要的作用，尤其是交通枢纽和重要桥梁更为重要，但是这也正是敌空军、炮兵轰炸的目标。因此，在这些地区的民兵，必须加强关于防空、护路、伪装和抢修工程等方面的教育。\n\
    - 3. 江河：一般的河流便于观察射击，较大的河流，是防御、战斗的天然障碍，可以用火力控制两岸和浅滩。\n\n由于天气、季节的变化，江河对战斗影响的程度亦不同。平时能通行的河流，到雨季、汛期就可能成为通行的障碍。一般在冬季影响小，夏季影响大。因此，在河流地带行动的时候，应当加强对河流的侦察。\n\
    \n- 4. 水网地：地面平坦，展望良好，射界开阔。有错综稠密的河流、湖泊、池塘、水田等。道路（特别是公路）较少，乡村的道路多在田埂或河堤上；交通不便，军队行动比较困难。工事大多只能用土构筑。另外，水网地带潮湿，应当特别注意武器、弹药的防潮。\n\
    - 5. 沼泽地：地面经常潮湿或部分被水淹没，有的沼泽地，步兵也不能通行，对部队的行动有限制。防御阵地前沿的沼泽地，是良好的障碍物。\n- 6. **森林地**：便于隐蔽，但是对观察、射击、运动等有很大限制，指挥和维持方向也比较困难。森林地区空气湿润，必须注意防潮。另外，森林地由于有茂密的枝叶遮盖，可以减少原子武器爆炸时候的伤害，但是容易引起严重的火灾。由于森林地空气流通较慢，也容易停留毒剂。因此，必须注意防火防毒。\n\
    - 7. **沙漠**：沙漠地形开阔，便于观察和射击，但是容易暴露目标。沙漠地区气候干燥，缺乏饮水和燃料，气温变化剧烈，多风沙，由于尘土飞扬，容易使武器发生故障。构筑工事比较容易，由于不坚固，容易倒塌，运动也比较困难。\n\
    - 8. **草原**：一般地形平坦开阔，除高草地外，都便于观察和射击。草原地内往往有很多沼泽地，影响军队运动。草原地带夏季多狂风暴雨。草原枯萎季节容易发生火灾。\n\
    \n## (二) 利用地形、地物\n\n为了在战斗中，突然迅速勇猛的歼灭敌人，必须很好的学会利用地形地物。利用地形、地物的目的是发扬火力，隐蔽身体。发扬火力是主要的，只有发扬火力才能达到消灭敌人保存自己的目的。但是为了发扬火力，有些地形不一定都能完全隐蔽身体，必要时的得利用。发扬火力和隐蔽身体是利用地形地物的两大原则。\n\
    \n由于目的不同，利用地形地物的一般原则是：\n\n- 以射击为目的，要视野广阔，便于观察，能发扬火力，依托确实。\n- 以隐蔽为目的，要掩蔽确实；能够避免敌炮火伤害，及敌人的地面和空中侦察。\n\
    - 以观察为目的, 要展望良好, 不容易被敌人发现。\n- 以进攻为目的, 要便于隐蔽地接近敌人, 能够发扬火力, 前进容易, 便于展开兵力和通信联络。\n\
    - 以防御为目的, 视界、射界都必须开阔, 便于伪装, 不致暴露目标, 阵地前面没有死角, 使敌难于接近。\n- 以警戒为目的, 要选择敌人必经的地方, 视界宽阔,\
    \ 便于射击, 有良好的隐蔽, 能避免敌人地面和空中的侦察。与我侧后方联络方便。\n\n### 利用地形、地物的方法\n\n在战斗中常常遇到各种不同的地形、地物,\
    \ 当然利用方法也就不同。以下谈谈最常遇到的地形、地物和利用它们的方法。\n\n- 1. 坟包、土堆: 遇有坟包、土堆时, 应很快地前进, 趴倒在坟包、土堆的右后方,\
    \ 并应由下而上的利用以避免暴露目标, 如果因为位置低妨碍观察、射击, 应向适于观察和射击的地方移动一下。\n\n因为装子弹、开闭枪机、扣扳机都用右手、右臂活动,\
    \ 瞄准也用右眼, 这样, 利用坟包的右侧, 动作是比较方便的, 同时又能隐蔽身体(图82)。\n\n![](img/b41346f815189f79888890b5225a828a_89_0.png)\n\
    \n- 2. 墙壁: 根据墙的高低, 采取适当的姿势。墙比自己高, 可挖枪眼或利用其他东西垫起来进行射击, 如果墙已破坏, 可利用其残缺部分作射击依托(图83)。\n\
    \n![](img/b41346f815189f79888890b5225a828a_89_1.png)\n\n- 3. 沟渠: 在战斗中常常遇到横一道竖一道大小不一样的沟渠，应根据沟的深浅，决定前进的姿势。沟比人的身体深，可以挺身前进，及膝深的沟应曲身前进。停止时，应该迅速选择沟沿的缺口，进行隐蔽的观察和射击（图84）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_0.png)\n\n- 4. 土坎、田埂：根据土坎的高低，应采取适当的姿势（立姿、跪姿或卧姿）来利用。但头不应高出土坎过多，只要可以用眼睛观察和瞄准就够了（图85）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_1.png)\n\n- 5. 河堤：遇有河堤时，根据情况可以利用在我方河沿上的堤，也可以利用在敌方河沿上的堤，但一定要利用向着我方的斜面。如果河的宽度不大，而敌方的河堤又比我方的高，最好是利用敌方河沿上的堤，这样，便于射击。利用河堤的方法与利用土坎相同（图86）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_2.png)\n\n- 6. 凹地：一般地说，凹地是较隐蔽的；如在凹地运动时，应根据凹下的程度灵活地采取姿势；在凹地奉命停止时，可迅速进到靠敌方一边的斜面（图87）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_90_3.png)\n\n![](img/b41346f815189f79888890b5225a828a_91_0.png)\n\
    \n- 7. 门窗：要利用门窗的左侧，左臂体托门窗框或门窗左侧的墙壁进行射击，这样，便于射击和隐蔽身体（图88）。\n\n- 8. 树木：应利用树木的右侧，左臂靠树干，作射击依托，既能使射击稳固，又能隐蔽身体。根据树干的粗细，采取不同的射击姿势。树干粗超过50厘米以上，能够遮蔽敌人的子弹，可以采取立射或跪射姿势，树干粗不能遮蔽敌人的子弹时，可利用树根采取卧射姿势（图89）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_91_1.png)\n\n- 9. 独立家屋：在独立家屋停止时，应迅速占领墙角，墙壁、屋顶等。但在独立家屋不能停留过久。停留时应保持隐蔽，因为独立家屋容易被敌人发现，遭到射击。所以独立家屋附近有地形可以利用时，也可以不去利用它（图90）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_91_2.png)\n\n- 10. 丛林：在丛林中停止的时候，应迅速地进到向敌人的那一边，不要停在我方边沿或丛林内。这样，既可以利用树木隐藏自己，又可以在停止时观察前进的道路和敌情。如果遇到稀疏的树林，也可以班或小组穿过，但必须和林边行进的队伍保持联系，免得迷失方向(图91)。\n\
    \n![](img/b41346f815189f79888890b5225a828a_92_0.png)\n\n地形是死的，而情况是变的，因此，对于地形、地物，一定要灵活地加以利用。\n\
    \n利用地形、地物应提注意的几件事：\n\n- 1. 不论利用什么地形、地物，都要避免敌人的观察和敌人火力的损害，应当随时观察敌人的行动。\n- 2. 石头、石碑及其附近的地方不可以利用，以免受崩弹和破片的杀伤。\n\
    - 3. 利用地形地物时不要挤在一起，以免暴露目标，遭受伤亡。\n- 4. 在利用地形地物时，还要注意防止敌人空中侦察。\n- 5. 不可妨碍左邻的射击和指挥员的指挥。\n\
    \n# 二 方位判定\n\n在我们熟悉的地方，辨别东南西北方向和各种物体的相互位置，是很容易的。但是在生疏而复杂的地形上，如果不善于判定方位，就会迷失方向，影响任务的完成，甚至有误入敌境的危险。因此，正确的判定方位，有着重要作用。\n\
    \n判定方位的方法很多，这里简要的介绍几种。各地民兵可以根据当地的情况，选择和创造最实用的方法。\n\n## (一) 按太阳判定方位\n\n早晨 6 点钟左右太阳在东方；\n\
    \n上午 9 点钟左右太阳在东南；\n\n中午 12 点钟左右太阳在南方；\n\n下午 3 点钟左右太阳在西南；\n\n下午 6 点钟左右太阳在西方。\n\n\
    因为季节不同，太阳出没的时间也不同，所以按照上述方法，只能在春秋两季概略地判定方位。\n\n## (二) 按太阳和钟表判定方位(图92)\n\n将钟表平放，以时针所指时数的半数的位置对向太阳，则“12”的方向就是正北方。(使用这个方法时，每日应以\
    \ 24 小时计算，如下午 1 时即为 13 时，余类推。)\n\n![](img/b41346f815189f79888890b5225a828a_93_0.png)\n\
    \n例如：上午 8 时，应以“ 4 ”对向太阳，如上图左；若是下午 2时（即14时），应以“7”对向太阳，如图92右。\n\n![](img/b41346f815189f79888890b5225a828a_94_0.png)\n\
    \n## （三）按指南针判定方位（图93）\n\n平放指南针，等磁针静止后，指针上涂有色漆或夜光的一端所指的方向就是北方。\n\n## （四）夜间，按北极星判定方位（图94）\n\
    \n北极星永远位于北方；是小熊星座中最亮的一颗星。要找到北极星，可以先找到大熊星座（俗称北斗星）。大熊星座有七颗很亮的星，形状象一把扫帚，我们设想将扫帚最外的两颗星连成一条直线，然后把这条假想的线，沿着勺口的方向再延长五倍，便能找到比北斗七星亮度稍差一点的北极星了。\n\
    \n在我国南部各省，有时看不见大熊星座，可以依靠仙后星座（图95）。（又称女帝星）来找北极星。仙后星座有五颗很亮的星，形状象“W”，它的缺口对着北极星，离开缺口约两倍的地方，便能找到北极星了。\n\
    \n![](img/b41346f815189f79888890b5225a828a_94_1.png)\n\n## （五）利用各种特征判定方位\n\n-\
    \ （1）树木的树皮朝北的比朝南的粗糙，裂纹多，深，背苔厚；南面的枝叶比北面的较密（白果树相反）。树桩的花纹（年轮），北面的紧密，南面的稀散（参看图95）。\n\
    \n![](img/b41346f815189f79888890b5225a828a_95_0.png)\n\n- （2）背苔爱生长在冷湿背阳的树木、石头和地面上。\n\
    - （3）在沟、坑等凹地里和树林中空地里的积雪，北面比南面化的快；凸起的土堆、坟丘、建筑物等的积雪，南面比北面化的快。\n- （4）我国庙宇的门大多面朝南方。\n\
    - （5）我国北方春天多东风和东南风，夏天多南风，秋天多西北风和西风，冬天多北风。\n\n# 三 距離測量\n\n在战斗中射击的时候，必须知道目标的距离，才能正确地装定表尺，射击才会精确。所以我们不但要善于发现敌人，还要知道敌人距我们多远，这就要测量距离。\n\
    \n测量距离的方法很多，最简便的有目测、步测和声测等。\n\n## （一）目测\n\n就是用眼睛测定距离，这是基本的方法。目测的一般方法有两种：\n\n-\
    \ （1）根据印象深刻的地段以比较法测定距离；如自己对常用的实际距离（如100、200、400、800米等）有一个深刻的印象，目测的时候就用这个无形的尺子去比较；或者预先用其他方法测量一段距离，把它和需要测量的距离比较。这种方法比较简便，但是使用时应当注意眼睛的误差，因为近距离的地段容易显得长些，远距离的地段容易显得短些；从上向下观察，比从下向上观察的距离要显得远些。\n\
    - （2）根据目标的能见度和大小测定距离：例如一般人的视力（近视或远视的，可以根据自己的视力进行修正），对人在：\n  - 50米可以看出两眼如黑点；\n\
    \  - 100米可以看出人脸的模样、步、机枪零件；\n  - 200米可以看出头部和肩部的轮廓；\n  - 300-400米可以看出服装的颜色和步兵武器；\n\
    \  - 700-800米可以看出行走或跑远的动作。\n\n目测距离的时候，还应当注意：①较大的地物（森林、居民点等）比位于同一距离上的较小地物（灌木丛、小丘、石块）显得近些；②在同一距离上，反光较强的地物比反光较弱的地物显得近些；③颜色鲜明的地物，比颜色暗淡的地物显得近些；④地物在阴天、雨天、黄昏、拂晓以及起雾的时候，比在有太阳的晴天显得远些；⑤在开阔地、覆盖着积雪的地段、山区以及通过宽阔的水面时，观测的地物比真实位置显得近些；⑥从下向上观测，比由上向下观测显得近些。\n\
    \n## (二) 步测\n\n就是用自己走的步数来计算距离。一般人的步子，一单步为75厘米，一复步(即两个单步)为1.5米。步测的时候，只要记住由起点到目标所走的复步数，乘1.5或加复步数的一半，就得出距离多少米了。\n\
    \n步测的时候，步子的大小要一致，方向要正直。个别同志身材高大或较小，不合标准步度，可以用自己步度的实际长度来计算。\n\n## (三) 声测\n\n声音在空气中传播的速度，每秒钟约330米，即3秒钟传播约一公里，而光的速度和电一样，快得多。在战斗中，从看到枪炮射击的闪光起，到听见发射声止，计算中间所经过的时间，便可计算出距离。例如发现敌阵地闪光后经过3秒钟才听到枪炮声，则3×330≈990米，可知敌阵地距离我约一公里。计算时间时可以用数数的办法，即数1—2—3……，并且使每数一个数正好是一秒钟。\n\
    \n上面所说的几种测量距离的方法，都必须在平时多加演练，才能在战斗中运用得准确熟练。\n\n# 四、观察及指示目标\n\n在战场上，敌人是狡猾的，他们也会伪装得很好，也会尽量利用地形地进行隐蔽。观察及指示目标的目的，就在于及时发现敌情，了解地形，并且迅速明确的指示目标的方向。\n\
    \n位置，以便及时地采取措施和进行处置；顺利的完成战斗任务。\n\n## （一）观察的方法\n\n请参阅本书第134页的“观察”一节。\n\n## （二）指示目标的方法\n\
    \n指示目标，必须简单扼要，迅速、明确，态度从容果断，不要使被指示者感觉模糊、犹豫，以便迅速发现目标。方法如下：\n\n- 1. 直接指示法：对显而易见的目标，直接指出目标本身的特征，如：“正前方，敌空降特务！”\n\
    - 2. 间接指示法：如果目标附近物体复杂难以发现的时候，可以在显明物体附近，按照它与显明物体的关系位置指示，如：“目标：独立树左，50米，敌轻机枪！”\n\
    \n也可以用指幅间接指示目标，即将臂伸直，手指向上竖起，以一眼透视手指两侧，测得由显明物体至目标的指幅数指示。如：“目标：正前方小庙右三指幅，敌人散兵！”\n\
    \n- 3. 用瞄准线指示法：如果目标小、隐蔽、难以发现的时候，可以用这一方法指示。即将枪固定在一地物上，使瞄准线指向目标，然后让不知道目标所在的民兵来瞄准。\n\
    - 4. 用射击指示法：情况紧迫，来不及指示的时候，可以向目标射击，依照弹着点来指示目标。\n\n# 五 信号和暗号的使用\n\n在战斗中或执行勤务的时候，仅仅靠口令，传达命令进行指挥联络是不够的。使用信号、暗号的目的，就是用来补助战斗指挥和通信联络的不足，以达到指挥灵活，动作及时。\n\
    \n一般使用的信号、暗号，有以下几种：\n"
