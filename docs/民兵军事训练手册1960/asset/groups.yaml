  - '[PAGE 21]


    # 原子武器的杀伤破坏作用


    原子武器爆炸后，有四种杀伤破坏因素：


    1. 冲击波：冲击波是原子爆炸时最主要的一种杀伤破坏因素。这是由于爆炸后形成的一股气流，急剧地向四周扩张，就好像一阵猛烈的飓风扫过大地。冲击波的威力大、速度快，在二秒钟内就可到达距爆炸地点1000米（一公里）以外的地方。它能吹坏500米内的坦克；700米内的火炮；1200米内的汽车；并能把房屋树木推倒。被冲击波推倒的房子、吹毁的石块等，对人的伤害也很大。不过，距离爆炸点愈远，冲击波的力量就愈小；冲击波的速度再快，也还要有段时间。所以我们可以抓紧这极短的几秒钟时间，采取适当办法避免冲击波的伤害。例如趴倒在地面，躲入坚固的房屋和物体内等（图4）。


    ![](img/b41346f815189f79888890b5225a828a_21_0.png)


    图3 冲击波推进的速度和防倒情况


    2. 光辐射：原子爆炸所形成的火球，比夏天太阳光的强度还大许多倍，这就是光辐射。由于它的光线极强，可以烧着或熔化各种物资，引起火灾；照射到暴露的皮肤上，就会灼伤皮肤。'
  - "[PAGE 22]\n\n肤；照到眼睛上，可以使双目暂时失明，等等。不过，光辐射的时间只有几分钟，也容易防护，任何能挡住光的东西，都可以防止光辐射的伤害。\n\
    \n3. 贯穿辐射：我们检查身体的时候，往往用 X 光来透视肺部。X 光是一种看不见的光线（也就是射线），这种射线穿透力很大，能穿过人的皮肤，把肺部显示出来。但是，使用\
    \ X 光透视身体的次数不能太多，每次照射的时间也不能太长，因为它能破坏人体内正常的组织作用；使人得一种放射线病，轻者发烧、头晕、恶心、全身无力，重者皮肤出血、毛发脱落。原子爆炸后的\
    \ 15 秒内，也有一种极强烈的射线，这就是贯穿辐射。它比 X 光的穿透力要强得多，人身受到大量贯穿辐射的照射，同样也会得放射线病。\n\n贯穿辐射的威力半径比冲击波、光辐射要小，而且各种物体都能减弱它的威力（物体越厚减弱越多）。因此，能躲过冲击波、光辐射的伤害，那么受贯穿辐射的伤害也就不会太大。\n\
    \n4. 放射性沾染：原子爆炸所产生的烟云和从地面扬起的灰尘，都带有放射性。这些物质随风飘游，降落到地面上、物体上、或者混在空气中和水中，这种现象叫做放射性沾染。沾染放射性的物质，也能够放射出看不见、嗅不出的伤害人的射线。人身体上沾染了放射性物质，或者由于没有戴防护用品，随着呼吸到人内部。也会得放射线病。皮肤上受了沾染还会引起溃烂、发炎，对于放射性沾染的防护，我们将在后面再谈。\n\
    \n# \n\n把含有放射性原子的混杂物製成液体或粉末，这就是放射性战剂。可以和毒剂混合，装在炸弹、炮弹、火箭、迫击\n\n![](img/b41346f815189f79888890b5225a828a_22_0.png)"
