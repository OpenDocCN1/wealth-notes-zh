    向目标正中间瞄准，一定要把瞄准点搬一搬家。这是对风进行修正射击的一般常用方法。方法是这样的：根据风向、风力计算，估计弹头可能偏右20厘米，在瞄准的时候，就要把瞄准点从目标中央往左移20厘米。这样，弹头飞出去的时候是偏了，可是在飞行时，风却把它送到目标正中去了。


    # 在阳光下怎样射击？


    太阳光照在很多东西上，会有反光。所以在太阳光下面瞄准，便会看到两个缺，甚至会看到两个准星。一定要记住，真正的缺和准星是黑色的，白色的是太阳光反射出来的光芒，误用了，就会打不中目标。


    # (五)对各种目标的射击方法


    # 对不动(固定)目标应当怎样射击？


    步枪基本射击练习用的靶子，战场上敌人的发射点等，都是不动目标，又叫固定目标。对不动目标射击的时候，应当根据：(1)目标距离；(2)天气对射击有什么影响，来确定应当装定多少表尺和瞄准点选在什么地方。在一般平地上，没有外在条件(风、雨)影响，对于比较小的单个目标射击的时候，距离在300米以上，可以装定实距离的表尺，瞄准目标中央进行射击；不到300米，可以装定表尺“3”，瞄准目标中央下沿。对较大的单个目标射击的时候，应当装定实距离的表尺分划，瞄准在目标中央。


    # 对隐显目标应当怎样射击？


    隐显目标就是一会显现、一会又隐避的目标，战场上的敌人，行动很隐避，露出头来看一看，又藏起来了，；出现得快，隐避得也快，暴露的时间短，这就是隐显目标。要消灭这种目


    62-'
