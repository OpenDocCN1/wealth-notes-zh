    刺杀訓練的要求，必須切合实战应用。在学习每一个细小动作的时候，都应该精神集中，两眼随时注意敌方，时刻准备对敌进行突刺、打击、防刺、反刺等动作。


    +   1.准备格斗。是与敌人进行白刃格斗的准备姿势。在听到“准备——格斗”的口令后，将刺刀指向前，左手由侧方握二道箍，右手握枪颈，同时左脚前出一歩，两腿微屈。上体微向前倾。体重平均落于两脚上。刺刀尖和左眼在一条线上。两眼注视敌方（图52）。


