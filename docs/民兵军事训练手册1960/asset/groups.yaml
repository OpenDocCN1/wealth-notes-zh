    ### (三) 地雷的埋毁


    1. 埋设地雷位置的选择：在战术上容易吸引敌人，如村巷、通道、阵地前死角、主要交通路附近、森林和敌人便于利用的地形地物，在技术上便于伪装及作业的地方，如草地、乱石地、坟堆、土堆、青苗地等。


    2. 必须严密伪装。现代战斗中使用新的地雷侦察器材，如果埋设的地雷伪装不好，就容易被排除，失去作用。因此，除注意伪装外，在使用方法上也应当多种多样，真真假假，迷惑敌人，才能收到良好效果。


    3. 埋设地雷需要与参编兵火力结合。


    4. 地雷需按规定要领和顺序去作，随时注意安全。


    5. 几种地雷的埋设方法


