    砲弹内使用，也可以用飞机来布满。它的伤害作用，和原子爆


    炸后产生的放射性污染一样。


    # ## （二）化学武器


    用毒剂（就是**人们常说的毒气**）制成的武器，叫化学武器。敌人使用毒剂的化学武器，有：化学炸弹、化学炮弹、化学地雷、毒剂手榴弹、毒烟罐、洒毒车和飞机布洒器等（图5）。


    ![](img/b41346f815189f79888890b5225a828a_23_0.png)


    毒剂施放后，呈气状、烟状、雾状和液滴状态散布在空气中、地面上、物体上或水中，人们呼吸了染毒的空气，吃了染毒的食物，或者皮肤上沾染了毒液，就会破坏人体内正常的组织作用，产生各种轻重不同的伤害：从个别器官的暂时刺激（眼睛流淚，打喷嚏）起，一直到全身中毒（呼吸困难、全身溃烂），严重的甚至死亡。


    # ### 毒剂的种类和它们的杀伤作用


    毒剂按照它保持杀伤作用的时间，分为暂时性毒剂和持久性毒剂：一般气状、烟状、雾状的毒剂，只能使空气染毒，染毒使用的时间只有儿分钟到几十分钟，是暂时性毒剂；液滴状的毒剂，除了能直接伤害人外，慢慢蒸发的气体还可以保持致


    18'
  - '[PAGE 24]


    小时到数天的伤害作用，通常叫它持久性毒剂。


    毒剂按照它对 人、畜的毒害作用，分为以下四类（参照下頁附表一）：


    +   1. 全身中毒性毒剂：呈气体扩散在空气中，有的呈液滴状洒布在地面或物体上。这类毒剂的毒性猛烈，能使人、畜神经和血液很快中毒，发生痉挛（抽筋），不省人事，严重的以至死亡。


    +   2. 靡烂性毒剂：多为持久性毒剂，呈液滴状洒布在地面上、物体上、饮食中或水中。它的液滴能渗透衣服，使皮肤发红，起水泡，破裂溃烂；能伤害眼睛；它的蒸气被吸入体内，或吃了染毒的食物和水，能伤害肠、胃、肺。


    +   3. 窒息性毒剂：多为暂时性毒剂，呈气体扩散在空气中。窒息就是透不过气来。这类毒剂主要伤 害人的肺部，引起肺水肿，使人呼吸困难，严重的以至死亡。


    +   4. 刺激性毒剂：为暂时性毒剂。呈烟状、雾状。这类毒剂包括催泪性和喷嚏性两种，主要是刺激人的眼睛和呼吸道，使人流泪、打喷嚏、咳嗽、流鼻涕、胸部阁痛甚至呕吐，难受得无法继缽战斗和执行任务，一般不会死亡。


