    ## 六 手榴弹教练


    ### (一)手榴弹的战斗性能和用途。


    手榴弹是近战的有利武器,特别是:构造简单,使用和携带都很方便,威力大,爆炸时产生巨大的响声和烟尘,因此,可以震馗敌人,掩护自己战斗。在抗日战争和解放战争中,手榴弹发挥了很大的作用,有“战士的炮兵”之称。在现代技术兵器发展下,仍具有特殊的价值。因此,民兵必须熟练地掌握这种兵器。


    手榴弹一般用于散兵壕、掩蔽部、交通壕、居民地、森林、山地战斗,以及在同格斗之前消灭和压制集团的和隐蔽物后的敌人;集束手榴弹可破坏敌人坦克和坚固工事。


    手榴弹的种类分为普通(攻、防)手榴弹和特种手榴弹(如防坦克手榴弹,发烟手榴弹,燃烧手榴弹等)。它的威力因种类不同也不一样,普通手榴弹的威力阅半径10米,投掷距离一般30-40米,投掷后3-5秒爆炸。


    ### (二)木柄手榴弹的一般构造。


    木柄手榴弹由弹柄、发火装置、弹体三部分组成。


    - 1. 弹柄,是为了便于投掷及携带、保护发火装置的安全及连接弹体。它包括二部分:木柄——便于投掷;保险盖——不使拉火绳外露及防御。

    - 2. 发火装置,能引起炸药爆炸。它的构造包括:拉火绳——拉火用,一端系在拉火环上,另一端涂有玻璃粉,使之与拉火管内的火帽摩擦发火;拉火管——内装火帽,下端连接导火索;导火索——拉火管燃烧后使火烛沿导火索引起雷管爆炸;其上端装于拉火管内,下端插入雷管内;雷管——内装爆炸粉，用以引起爆炸药燃烧。

    - 3. 弹体，是手榴弹的主体，内装炸药。


    ### (三) 使用、保管方法


    使用的时候，拧开保险盖以食指（或小指）取出拉火环，套入小指根，握弹柄对正目标投出。


    ![](img/b41346f815189f79888890b5225a828a_74_0.png)


    保管方法：放在空气流通的地方，免得受潮，特别是本柄容易吸水，防止太阳曝晒或火烤；携带时不要和武器碰撞；没有用以前严禁打开保险盖，并且注意不要使保险盖脱落；不要用手榴弹敲打物体。


    ### (四) 手榴弹投掷方法


    练习投弹的方法，可以多种多样，不要拘泥一种样式。左、右手投弹都可以。练习的时候，可以先分成几个动作练习，再综合练习，最后结合实战情况练习，达到各种姿势都能投的远，投得准。


    1. 原地立姿投掷 口令：“准备手榴弹”“目标××投”。


    听到投弹预备的口令后，将枪交于左手，枪托着地，枪刺靠左肩，左臂从枪前伸过左手握弹袋底，右手取出手榴弹交左手。


    ![](img/b41346f815189f79888890b5225a828a_74_1.png)


    右手撑开保险盖，以食指取出拉火环套入小指根握手榴弹柄端，弹体向上，曲小臂左手持枪成立正姿势。


    听到“目标××投”的口令后，右腿向后退一步屈膝，身体向右转动，将手榴弹向下成弧形摆动，迅速蹬直右腿，胸部转向目标，手过肩猛力向前挥投，投弹时体重移至左腿；投掷后右脚靠左脚，将枪换持右手恢复立正姿势（图61、62）。


    ![](img/b41346f815189f79888890b5225a828a_75_0.png)


    图62 立姿投掷


    2．跪姿投掷在矮墙后，跪射敌兵在坑内和沟渠内用跪姿投掷。口令：“准备战斗”“准备手榴弹”“目标××投”。


    听到“准备战斗”的口令后，迅速跑步到事先选择好的遮蔽物后（内），取跪姿（跪右腿）。


    听到“准备手榴弹”的口令后，将枪放在地下或胸墙上，取出手榴弹（同立姿）。


    听到“目标××投”的口令后，躯干挺起同时挥动手榴弹，身体后仰并向后转，手过肩将手榴弹投出，投时身体尽量向左腿倾斜，投出后取枪恢复原来姿势（图63）。


    3. 趴姿投掷在敌火力或不大的掩体内使用这种方法。口令同跪姿。


    听到“准备战斗”的口令后，迅速跑至准备好的卧射掩体内趴倒。


    ![](img/b41346f815189f79888890b5225a828a_76_0.png)


    。听到“准备手榴弹”的口令后，将枪放在身体右侧，取出手榴弹（同立姿）。


    ![](img/b41346f815189f79888890b5225a828a_76_1.png)


    听到“目标××投”的口令后，双手扶地撑起身体，将右腿微向后移，跪左腿同时挥臂，蹬直右腿，胸部转向目标，躯干前倾将手榴弹投出，投出后卧倒取枪（图64）。


    4. 在堑壕内投掷  口令同跪姿。


    ![](img/b41346f815189f79888890b5225a828a_76_2.png)


    “准备战斗”“准备手榴弹”同跪姿。投掷时左手支撑前壕壁，右腿尽量后伸，体重移在右脚上，两腿微屈，躯干后仰，将手榴弹尽量向后上方举，躯干猛力挺直将手榴弹投出；取枪恢复原来姿势（图65）。


    ## 七 地雷


    ### （一）地雷的战斗性能和用途


    地雷是防御武器，也是进攻武器。它可以用于各种战斗行动中，可以单独使用，亦可以结合其他障碍物大量使用。


    通常用于下列几种情况：


    - 1．阻止和杀伤敌空降和海岸登陆部队的有生力量和技术兵器；

    - 2．封锁或伏击敌人；

    - 3．掩护阵地重要目标；

    - 4．用作障碍，增强阵地的防御。


    在步兵和地兵火力掩护良好的地雷障碍物地区，不但能大量杀伤敌步兵，而且可以使敌坦克和步兵不易通过，甚至完全不易通过。因此，地雷尤其是土造地雷，在过去历次革命战争中都发挥了很大的威力。


    在现代战斗中，虽然新的技术兵器不断增加，但因地雷具有威力极大，构造简单，原料易找，制造容易，使用方便，容易学习等特点，所以仍是战斗中不可缺少的重要武器。随着科学进步，地雷的种类亦在增多，构造上有的更加复杂了。


    ### （二）地雷的种类和构造


    地雷按用途分为，防步兵地雷，防坦克地雷，防运输地雷和特种地雷等。其构造都是由雷壳、装药、引信三部分组成。


    发火方法不外以下几种：


    - 1．击针和拉火管发火，是利用弹……火管引燃起爆药而发火。可埋设成踏发和拉发;

    - 2.电气发火:是利用电气点火机或电池来发火。可埋设成瞬发、触发和自发;

    - 3.化学发火:是利用化学原料如硫酸等起变化而发火的。可埋设成踏发和自发;

    - 4.机械发火:是利用钟表等通过电流自行发火。


    大规模的埋雷和排雷,主要是由专业的工程兵负责,但战斗中往往是步兵先接触地雷,因此,广大民兵了解地雷知识是很必要的，现简单介绍几种于下。


    #### I. 防坦克(木壳)地雷


    防坦克地雷是用来摧毁敌坦克、汽车和其他技术兵器的。通常盖上受200-700公斤压力才能爆炸。这种地雷和所用引信构造，参看图66、67。


