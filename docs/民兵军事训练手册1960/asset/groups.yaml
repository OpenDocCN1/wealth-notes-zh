    # 三 距離測量


    在战斗中射击的时候，必须知道目标的距离，才能正确地装定表尺，射击才会精确。所以我们不但要善于发现敌人，还要知道敌人距我们多远，这就要测量距离。


    测量距离的方法很多，最简便的有目测、步测和声测等。


    （一）目测。就是用眼睛测定距离，这是基本的方法。目测的一般方法有两种：


    +   （1）根据印象深刻的地段以比较法测定距离；如自己对常用的实际距离（如100、200、400、800米等）有一个深刻的印象，目测的时候就用这个无形的尺子去比较；或者预先用其他方法测量一段距离，把它和需要测量的距离比较。
    这种方法比较简便，但是使用时应当注意眼睛的误差，因为近距离的地段容易显得长些，远距离的地段容易显得短些；从上向下观察，比从下向上观察的距离要显得远些。


    +   （2）根据目标的能见度和大小测定距离：例如一般人的视力（近视或远视的，可以根据自己的视力进行修正），对人在：

    * 50米可以看出两眼如黑点；

    * 100米可以看出人脸的模样、步、机枪零件；

    * 200米可以看出头部和肩部的轮廓；

    * 300-400米可以看出服装的颜色和步兵武器；

    * 700-800米可以看出行走或跑远的动作。


    目测距离的时候，还应当注意：①较大的地物（森林、居民点等）比位于同一距离上的较小地物（灌木丛、小丘、石块）显得近些；②在同一距离上，反光较强的地物比反光较弱的地物显得近些；③颜色鲜明的地物，比颜色暗淡的地物显得近些；'
  - '[PAGE 97]


    ④地物在阴天、雨天、黄昏、拂晓以及起雾的时候，比在有太阳的晴天显得远些；⑤在开阔地、覆盖着积雪的地段、山区以及通过宽阔的水面时，观测的地物比真实位置显得近些；⑥从下向上观测，比由上向下观测显得近些；⑦由下向上观测，比由上向下观测显得近些。


    (二)步测。就是用自己走的步数来计算距离。一般人的步子，一单步为75厘米，一复步(即两个单步)为1.5米。步测的时候，只要记住由起点到目标所走的复步数，乘1.5或加复步数的一半，就得出距离多少米了。


    步测的时候，步子的大小要一致，方向要正直。个别同志身材高大或较小，不合标准步度，可以用自己步度的实际长度来计算。


    (三)声测。声音在空气中传播的速度，每秒钟约330米，即3秒钟传播约一公里，而光的速度和电一样，快得多。在战斗中，从看到枪炮射击的闪光起，到听见发射声止，计算中间所经过的时间，便可计算出距离。例如发现敌阵地闪光后经过3秒钟才听到枪炮声，则3×330≈990米，可知敌阵地距离我约一公里。计算时间时可以用数数的办法，即数1—2—3……，并且使每数一个数正好是一秒钟。


    上面所说的几种测量距离的方法，都必须在平时多加演练，才能在战斗中运用得准确熟练。


    # 四、观察及指示目标


    在战场上，敌人是狡猾的，他们也会伪装得很好，也会尽量利用地形地进行隐蔽。观察及指示目标的目的，就在于及时发现敌情，了解地形，并且迅速明确的指示目标的方向。'
  - '[PAGE 98]


    位置，以便及时地采取措施和进行处置；顺利的完成战斗任务。


    （一）观察的方法。 请参阅本书第134页的“观察”一节。


    （二）指示目标的方法。 指示目标，必须简单扼要，迅速、明确，态度从容果断，不要使被指示者感觉模糊、犹豫，以便迅速发现目标。方法如下：


    +   1. 直接指示法：对显而易见的目标，直接指出目标本身的特征，如：“正前方，敌空降特务！”


    +   2. 间接指示法：如果目标附近物体复杂难以发现的时候，可以在显明物体附近，按照它与显明物体的关系位置指示，如：“目标：独立树左，50米，敌轻机枪！”


    也可以用指幅间接指示目标，即将臂伸直，手指向上竖起，以一眼透视手指两侧，测得由显明物体至目标的指幅数指示。 如：“目标：正前方小庙右三指幅，敌人散兵！”


    +   3. 用瞄准线指示法：如果目标小、隐蔽、难以发现的时候，可以用这一方法指示。即将枪固定在一地物上，使瞄准线指向目标，然后让不知道目标所在的民兵来瞄准。


    +   4. 用射击指示法：情况紧迫，来不及指示的时候，可以向目标射击，依照弹着点来指示目标。


