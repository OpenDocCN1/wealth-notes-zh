- pgno: 14
  md: '乐工具，那时候，我们巧合做一个保健品的项目。


    我们那时候，就有一些思路，通过快手，引流到微信来做流量。到后来，这种模式，就被大规模推行开。 再到后来，我发现，快手，已经不是单纯的短视频工具了，还有打赏，互动，卖货的功能。


    # 除了这些，我还发现很多思路：


    +   1, 快手做短视频 做免费流量是一种。 2, 快手 做网红打造是一种。 3, 利用快手做也可以做培训。 4, 利用快手还可以做快手相关服务，上热门，刷粉。
    5, 还可以出一本快手引流，变现的书籍。 6, 还可以成立一个短视频网红基地，专门打造国内很多想要出名的人。 .... 7, 还可以给其他企业做外包，做快手短视瓶的营销
    8, 可以尝试拿一个快手的代理商。 9, 不行咱们也可以搞一个平台出来。 10, 其他等。


    一个很简单的事情，通过不断的市调，我们就发现很多有意思的东西。把一个产业链，一个盈利模式的架构图，我们都可以完美的写出来。


    那么这个时候，我们就可以考虑从哪里入手来赚钱。这样就比较容易多了。


    但是，很多人，如果跟我们当初一样，只是撒了一眼，一看，这不就是一个 TM 短视频娱乐工具吗。那么这后面的的机会，就没有人可以抓住。


    这里面的思路，你也不可能看到。那么这类人，在去找其他项目，也很难赚到钱的。


    一个人认知的层次，局限了他的层次，下层认知的人，看不到上层认知的机会。 自然看懂的越少。 一个人的发展往往受局限，其实本质上是认知受限。


    就是：他不知道怎么搞更好了。 那么这个时候，我们不妨多认真市调，从全局，大范围的去市调。这样就能看的更远，更高，做的更大。


    很多人跟我讲：我是做桶装水的，我们本地都是这样做的，也没有什么好方法，好思路。


    其实：这种人已经给自己设置限制了。 过去我也是这样认为，因为我身边能接触，认识的人，就那么多，我早就知道他们怎么干的。要是有好方法，我早就去应用了。'
