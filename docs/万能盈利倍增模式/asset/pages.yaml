- pgno: 18
  md: '# 总体而言，为什么浑水做空的成功率如此之高？


    一方面，很多中国概念股本身就存在或多或少的道德风险。类似问题在A股市场可能习以为常、见怪不怪，但是在美国市场就存在着一套很成熟的制衡机制，就像生态系统一样优胜劣汰。作为“狙击者”，有漏洞存在，浑水才能狙击成功。若蝇不叮无缝的鸡蛋，就像索罗斯袭击的对象一定是财政、货币体制出现严重漏洞的国家，客观而言，这种行为反而促进了被攻击的国家的金融体系体制改革。无论是浑水，还是索罗斯，都是保持金融“生态系统”趋向均衡的关键因素。


    另一方面，浑水在攻击一家上市公司前做了大量研究，为猎杀做了充分的准备。浑水发表的质疑报告中篇幅最短的有21页，最长的达80页。做多和做空都需要做调研，但方法论截然不同，做多是“证实”，优点和缺点都要考量，权衡之下才能给出“买入”的评级；做空则是“证伪”，俗称“找茬”，只要找到企业的财务、经营造假证据，“硬伤”一经发现，即可成为做空的理由，类似于“一票否决制”。


    对于中美上市公司道德风险问题及证券市场监管体制，已有很多文章做过深刻研究，这里不再赘述。归纳总结浑水的报告之后，可反推出其整套调研体系，总体来看分为两个相互渗透的方式：查阅资料和实地调研，调查内容涉及到公司及关联方、供应商、客户、竞争对手、行业专家等各个方面。


    # 查阅资料


    查阅资料和实地调研结合是了解一个公司真实面貌必做的功课。尽管无从得知浑水是如何选择攻击对象的一一有可能是初步查阅资料和财务分析发现疑点并顺藤摸瓜，也有可能是有内部人提供线索，但在选定攻击对象后，浑水必对上市公司的各种公开资料做详细研读。这些资料包括招股说明书、年报、临时公告、官方网站、媒体报道等，时间跨度常常很大。比如在调查分众传媒时，浑水查阅了2005-2011年'
  merge: -1
  img_proc: true
- pgno: 19
  md: '这六年时间的并购重组事件，从中摘录了重要信息，包括并购时间、对象、金额等，并根据这些信息做了顺藤摸瓜式的延伸，进一步查阅了并购对象的官网、业务结构等。


    理论上讲，“信息元”都不会孤立存在，必然和别的节点有关联。对于造假的企业来说，要编制一个天衣无缝的谎言，需要将与之有关联的所有“信息元”全部疏通，对好“口供”，但这么做的成本非常高，所以造假的企业只会掩盖最明显的漏洞，心怀侥幸心理，无暇顾及其他漏洞。而延伸信息的搜索范围，就可以找到逻辑上可能存在矛盾的地方，为下一阶段的调研打下基础。比如泽水根据公开信息，层层挖掘出了分众传媒收购案中涉及的众多高层的關係图，为揭开分众传媒收购案例内幕提供了重要线索。


    # 调查关联方


    除了上市公司本身，泽水还非常重视对关联方的调查。关联方一般是掏空上市公司的重要推手。关联方包括大股东、实际控制人、兄弟公司等，还包括那些表面看似没有关联关系，但实际上听命于实际控制人的公司。泽水在查阅绿诺国际的资料时，发现上市公司
    2008 年和 2009 年所得税率应该为 15%，但实际纳税为零。经过进一步查证，发现上市公司仅为一个壳，所有资产和收入均在关联方的名下，上市公司利润仅为关联方“账面腾挪”过来，属于过账的“名义利润”，并发现实际控制人向上市公司“借”了
    320 万美元买豪宅，属于明令禁止的“掏空上市公司”的行为。


    # 公司实地调研


    对公司实地调研是取证的重要环节。泽水的调研工作非常细致，调研周期往往持续很久，比如对分众传媒的调研时间长达半年。调研的形式包括但不限于电话访谈、当面交流和实地观察。正所谓“耳听为虚，眼见为实”，实地调研的结果往往会大大超出预期。泽水一般会去上市公司办公地点与该高层访谈，询问公司的经营情况。泽水更重视的是观察工厂环境、机器设备、库存，与工人及工厂周边的居民交流，了解'
  merge: -1
  img_proc: true
- pgno: 20
  md: '公司的真实运营情况，甚至偷偷在厂区外观察进出厂区的车辆卸载情况，拍照取证。

    泽水将实际调研的所见所闻与公司发布的信息相比较，其中逻辑矛盾的地方，就是上市公司被攻击的软肋。


    比如在调查东方纸业时，泽水发现工厂破烂不堪，机器设备是上世纪 90 年代的旧设备，办公环境潮湿，不符合造纸厂的生产条件。发现库存基本是一堆废纸，惊呼：

    “如果这堆废纸值 490 万美元，那这个世界绝对比我想象的要富裕的多得多。”


    在调查中国高速频道时，泽水实地察看了 50 多辆公交车上终端广告播放情况，发现司机都喜欢播放自带的 DVD 节目，高速频道对终端控制力较弱。调查多元环球水务时，看到其中一个办公地点形同虚设，员工毫无工作状态，戏称之为“成人托管所”。


    # 调查供应商


    为了解公司真实经营情况，泽水多调研上市公司的供应商，印证上市公司资料的真实性。同时，泽水也会关注供应商的办公环境，供应商的产能、销量和销售价格等经营数据，并且十分关注供应商对上市公司的评价，以此作为与上市公司公开信息对比的基准，去评判供应商是否有实力去和被调查公司进行符合公开资料的商贸往来。泽水甚至假扮客户去给供应商打电话，了解情况。


    比如在调查东方纸业时，泽水发现所有供应商的产能之和都远小于东方纸业的采购量。调查� gain 汉林业时，则发现其供应商和客户竟然是同一家公司，公司干的是自买自卖、体内循环的把戏。调查中国高速频道时，发现上市公司声称自己拥有独有的硬件驱动系统，但是中国高速频道的供应商在阿里巴巴网站公开销售同样的产品，任何人都能轻易购得。


    除了传统意义上的供货商，泽水的调查对象还包括给上市公司提供审计和法律咨询服务的会计师和律师事务所等机构。如在调查多元环球水务时，泽水去会计师事务'
