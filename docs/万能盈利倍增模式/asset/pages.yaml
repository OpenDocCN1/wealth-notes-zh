- pgno: 28
  md: '# 【拆解同行 2.0 模板】


    我们继续分享拆解同行业项目和思维的第二种模板 2.0.


    1.0 是比较简单的思路。


    如果要去完全颠覆一个行业，是很难的，自主创新也很难，因为没有人做过，我们也不知道结果怎么样，那么做失败的成本就很高。


    所以我们还是利用拆解同行的思维，而不是一开始，就开始搞什么创新，独具一格。这才是最靠谱，最节省成本的办法。


    这样犯错误的概率就没有那么大。


    +   1, 先市调。 找到这些同行 。

    2, 分析同行业产品系统。

    3, 分析流量推广系统。

    4, 分析成交方案和系统。

    5, 看有没有设计什么裂变的方案。

    6, 杜杆系统 他们都采用了哪些捷径或资源。

    7, 模式 商业模式是怎么更快发展，盈利模式就是怎么搞到钱的。


    这个模式我们要重点提一下：我们一定要用纸+笔 给画出来，一个构思图。


    千万别用脑袋去想，去感觉。


    因为我发现：如果我们凭借直觉造出来的感觉，记忆力很弱，而且非常模糊，就是说，我们只是知道一个模糊大概的商业模式，其实很多细节，我们并不知道怎么做。


    但是当我们用纸笔，去写出来，画出来，设计出来的时候，你就能学到，感知到，这些同行的商业模式的思路。这点能明白吗？ 各位。


    ![](img/e4c54d03d15250bdb3a46029eaab2380_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '静悟：手写感悟很深

    我们哪，一定要养成手写的习惯，而千万不要去用脑思考，因为那样就很难有清晰的思路。


    8，招商 怎么让更多人参与进来一起搞。

    不管做任何生意，我们都离不开招商，招商的数量决定我们企业做的速度和规模。

    其实怎么去招商，很多行业有做的不错的，你都可以学习一下。


    9，团队 管理，股权。

    简单讲，他们怎么管理团队的，怎么运营的，怎么降低跳槽率，怎么让员工不断 pk，引爆业绩。

    如果我们要拆解同行的管理模式，股权模式，我们应该怎么做？


    如果我们去市调，是很难调查到的，除非采用一些非常规手段。

    你可以：通过一些技巧，给他们高管更高的工资承诺，你给他们 2 倍的工资，他们要面试，然后你问一下，套出来这些技巧就可以实现。然后连续套几十个高管，那么也可以实现。


    10，资本 他们公司靠什么发展，有没有风投，或其他等。


    这是我们拆解同行案例的 2.0 版本。


    记住：在我们拆解同行案例，或者其他行业优秀的案例时候，我们不用所有的都搞清楚了。

    再去优化或利用。


    如果我们在拆解的过程中，能找到一个节点：比如，一个同行业的招商做得很好，那么我们就把这块复制过来。马上利用，马上落地。


    而不是说，我非要把这些都研究透彻了，再去落地。


    那样的话，除非你打算做培训，出书籍，如果你不打算这样做，还是学一招用一招，落地一招。


    千万别非要等到，万事俱备，什么事情都满意了，通透了才去做。

    因为那将耗费你很多的时间和精力，先学一招，利用一招，让企业盈利，赚钱才是硬道理。


    那么在我们很多城市，几乎没有这样的广告：'
