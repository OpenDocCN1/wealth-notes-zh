- pgno: 36
  md: '很简单，其实大多数人，都看过我出版的书籍，感觉很有价值。这是价值贡献的一部分。然后你加了微信，感觉我分享和感悟，的确很有道理，就值得学习。


    所以你才报名了对不对。  简单理解：书籍也是价值培育的一种。分享也是价值。


    同样：有4家超市，同样做竞争，我让1家超市，他们开会员，进行做积分，还有鸡蛋，大米，以及一些常用的产品，成本价销售。


    结果这家生意，就比其他三家都好。就是说：人家为什么，要持续跟你买，一定要有自己的价值所在。就算真实情况下没有价值，也要让别人感觉有价值，感觉到位了，就容易买单。


    4，裂变分销系统。 他们有没有设计裂变机制，怎么设计的，有哪些常用的方法。5，他们做代理扶持，经销商扶持，员工培训扶持了吗。 是什么样的。6，服务系统。 他们是不是做了成交之外更好的服务。


    比如：海底捞，是卖火锅的一点没毛病，但是其实他还多给了你一样东西，就是极致的服务。但是你去其他火锅店，就不一定有这待遇。


    所以，就异常火爆。


    7，智能系统  比如：有没有使用爆粉软件，或者什么管理系统等。或者说，你一个生产设备是过去淘汰的老机器，我们搞一个新机器，你肯定没我们效率高。


    哪怕你产品，拓客做的再好，你武器没有我们好。我拿着枪，你徒手，你再有力气和功夫，我一枪就可以干死你。所以：很多时候，善用工具和平台。是非常重要的。


    8，内部管理系统。 他们怎么运营的，制度和机制是怎么设计的等。9，外部管理系统。 上下游供应链，是怎么对接，怎么合作等。10，股权系统 员工，合伙人，风投，以及其他。
    股权是怎么分配，权利怎么控制等。11，资本金融系统  用了哪些金融手法，金融手段，金融管理工具。12，系统化运营体系  他们用了哪些组合，哪些系统，哪些不一样的结构来提升核心竞争力。好的系统运营，是简单到自己可以复制，复杂到别人无法复制。'
