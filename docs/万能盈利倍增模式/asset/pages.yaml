    # 11, 圈子市场：协会，组织，机构。


    进一步升级，加入某某协会，商会，组织，机构，就是很多人加入这些圈子。


    目的有很多：


    +   1, 有很多找项目的人他们没项目。 所以愿意花钱进入圈子。\n2, 有很多有事业，但没人才和钱的，他也会愿意花钱进入圈子。\n3, 有很多有钱，但是他们没项目的人。
    他们更愿意花钱进入圈子。


    就是说，不管何时何地，那种领域，他都需要这个行业的资源，项目，人脉，人才，资金，对不对。


    那么我们巧合可以满足这些点。


    那我们就可以多出来一个赚钱的经营轨道。\n比如：有一家做保健品的，就是成人延时的产品。我就建议他搞了一个：保健品 xx 组织协会。


    很多人做这个生意虽然很久了，但他不知道有这么一个圈子，结果不少人就加入了进去。


    所以了解到的行业动态，资金，人脉，就很清晰。而对于我朋友成立的这个组织，肯定受益最大。但是你不懂这么玩的，肯定就给浪费掉了。'
