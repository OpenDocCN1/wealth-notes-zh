  md: '【九交贵人】1.事业贵人  2，人生解惑的贵人  3，志同道合带你上路的贵人....


    【十养生：】1,30 年前不养生，30 年后养医生！  只要身体出现问题，一切归零。懂了就懂了....  所以：从饮食，休息，运动，过度劳累，死磕，都要去做一定的定期反馈。


    【十一择业和婚姻】： 1，选错行业（重头再来/一无是处）  2，选错婚姻（后悔 10+ 年/疲惫不堪/不堪入目）


    【十二趋吉避凶：】1，选择势而不是逆势（顺势而为，不逆凶而上）。  2，人性本身就是趋利避害的动物。


    此时此刻，你可以着手改变落地这样几点：


    +   1，改名：名字要改为自己信仰的名字。


    +   2，改造自我形象：从语言，手势，外表做一个革命性的改变。 不妨去多去尝试。


    +   3，改变接触的人：捜集一下你身边的贵人，给他更多关注和时间。


    +   4，建立目标和使命：给自己定一个目标，通过预见卡，《通灵模式》里面的一些用法，快速行动落地目标。


    +   5，学习，深造，升级培训自己。（找一些资料，书籍，凡是能促使你进步的，买回来阅读，学习）


    +   6，早起，养成喝茶的习惯，保持早睡，早起，时常运动的习惯。


    一命二运三风水四积德五读书......，知识改变命运！！


    记住：所有一切命和运，都是可以通过知识来改变命运，所以，多抽出时间读书，多拜师是多么重要了。懂了就懂了....'
