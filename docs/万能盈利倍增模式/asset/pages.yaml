- pgno: 203
  md: '![](img/e4c54d03d15250bdb3a46029eaab2380_203_0.png)


    面试过程很简单。


    对方先是召开了一个集体说明会，很有诚意地介绍了培训机构开办的时间、雄厚的实力以及未来可以提供的保障。随后分头问了几个女孩一些简单的问题。


    除了两个觉得离家远主动放弃之外，其他几个人都顺利通过。


    培训机构还提供了实习机会，如果论文已经写完、学校没有别的事，可以先去实习，与正式员工一样同工同酬。


    小丽和另外一个女孩正好没事，简单收拾一下，就随着培训机构的人员一起驾车前往莆田。


    在路上，培训机构的老师们便慢慢和小丽聊开了。


    所谓培训机构就是为在酒吧上班的“小蜜蜂”（酒吧里陪客人喝酒的姑娘，靠客人喝酒的数量提成，也称作“酒吧气氛协调员”）提供形体和声乐训练，这个月薪只有 4000，但要是愿意每晚去做一会“小蜜蜂”，保证月薪
    1 万以上。


    （目前这种酒托的形式：在上海，北京，深圳，郑州，其实很多地方普遍尊在）'
