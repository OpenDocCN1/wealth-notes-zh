    4，除了这些产品，是不是也有很多人想要学理发。

    那么我们可以做一些简单的技术培训。


    5，我们还可以开直播，做快手，抖音的运营。


    员工闲暇时间没事干，可以拍一点段子，然后积累粉丝。可以在上面，继续带货，带学员，和带店铺加盟。


    因为我们把一个店能做到 100 多万的利润，一定有很多人也想要。 那么我们把这套系统输入到其他各个门店。其实，也是躺着赚钱的生意。


    6，你还可以出一本书《轻松开一家年赚 100 万》的书籍。


