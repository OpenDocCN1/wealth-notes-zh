- pgno: 21
  md: '所查阅了原版的审计报告，证实上市公司篡改了审计报告，把收入至少夸大了 100 倍。


    # 调研客户


    浑水尤其重视对客户的调研。调查方式亦包括查阅资料和实地调研，包括网络调查、电话询问，实地访谈等。浑水重点核实客户的实际采购量、采购价格以及客户对上市公司及其产品的评价。如浑水发现中国高速频道、绿诺国际宣称的部分客户关系根本不存在，而多元环球水务的客户（经销商）资料纯属子虚乌有，所谓的
    80 多个经销商的电话基本打不通，能打通的公司，也从未听说过多元环球水务。


    核对下游客户的实际采购量能较好地反映上市公司公布信息的真实性。以东方纸业为例，浑水通过电话沟通及客户官网披露的经营信息，逐一核对各个客户对东方纸业的实际采购量，最终判断出东方纸业虚增收入。虚增的方法其实很简单，即拟定假合同和开假发票，这也是国内上市公司造假的通用方法。


    客户对上市公司的评价亦是评判上市公司经营能力的重要指标。绿诺国际的客户对其评价恶劣，称之为业界一家小公司，其脱硫技术由一家科研单位提供，不算独有，更不算先进，而且脱硫效果差，运营成本高，其产品并非像其声称的那样前途一片光明。


    # 倾听竞争对手


    浑水很注重参考竞争对手的经营和财务情况，借以判断上市公司的价值，尤其愿意倾听竞争对手对上市公司的评价调查，这有助于了解整个行业的现状，不会局限于上市公司的一家之言。


    在调查东方纸业的时候，浑水把东方纸业的工厂照片与竞争对手晨鸣纸业、太阳纸业、玖龙纸业和华泰纸业等做了对比后发现：东方纸业只能算一个作坊。再对比东方纸业和竞争对手的销售价格和毛利率发现，东方纸业的毛利率水平处于一个不可能达到的高度，盈利水平与行业严重背离。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '在调查绿诺国际和中国高速频道时，它们都宣称在本行业里有某些竞争者——


    这些竞争者基本都是在行业内知名度很高，然而浑水去访谈竞争对手发现，这些竞争对手竟然都不知道他们的存在。


    # 请教行业专家


    在查阅资料和实地调研这两个阶段，浑水有一个必杀技——请教行业专家。正所谓“闻道有先后，术业有专攻”，请教行业内的专家有利于加深对行业的理解。该行业的特性、正常毛利率、某种型号的生产设备市场价格，从行业专家处得到的信息效率更快、可信度更高。如当年银广夏被调查一样，一般人难以断定其生产过程的真伪，而行内专家对此却熟稔于心。浑水在调查嘉汉林业时请教税务专家、调查东方纸业时请教机械专家、调查分众传媒时请教传媒专家、调查绿诺国际时请教脱硫技术专家、调查多元环球水务时请教过制造业专家、援引专家的言论，总是比自己的判断更有说服力，这也是浑水乐于请教专家的原因之一。


    # 重估公司价值


    在整个调研过程中，浑水常会根据实际调研的结果来评估公司的价值。如对东方纸业大致重估了存货的价值，并且拍摄工厂照片和 DV，请机械工程专家来评估机器设备的实际价值；还观察工厂门口车辆的数量和运载量来评估公司的实际业务量。


    浑水亦善于通过供应商、客户、竞争对手以及行业专家提供的信息来判断整个行业的情况，然后根据相关数据估算上市公司真实的业务情况。价值重估不可能做到十分准确，但是能大致计算出数量级，具有极强的参考意义。为了达到做空的目的，浑水在狙击上市公司的时候，不排除有恶意低估其资产价值的可能，但就调研方法而言，确有值得借鉴之处。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '浑水的调研方法说白了只是正常的尽职调查，在方法论上确实并无重大创新，他们极少运用复杂的估值模型去判断一家公司的价值；然而最简单的方法往往是最有效的方法，调研的收获远远大于办公室里的数据处理。在实施层面上，他们把工作做得很细致，偶尔也会使用些“投机取巧”的方法获取真实信息——比如假冒潜在客户骗取上市公司信任。


    这么多案例做下来，浑水基本总结了中国概念股造假的一些规律，包括设立壳公司、拟假合同、开假发票等，目的是虚增资产和利润，伺机掏空上市公司。这些都成为浑水关注的重点，也成为了他们取证的重要依据。由于浑水的调研体系全方位覆盖了被调查对象的情况，如果想彻底蒙骗过去，那得把所有涉及的方面都做系统的规划，这不仅包括不计其数的公开资料都口径一致，也得和所有客户、供应商都对好口供，还得把工商、税务、海关等政府部门圈进来。如此造假，成本极其高昂，绝对不比做个真实的公司去赚钱来得轻松。


    浑水市调思路，可以说是做到极致的典范。


    我们在挖掘同行的时候，以及市调各种我们所需要的信息的时候，我们一定要学习跟浑水这样的极致市调方法。


    这样我们方才可以保证更好的设计我们的盈利模式，找到真正能使我们业绩倍增的轨道。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 拆解同行业项目系统


    2，我们怎么破解，拆解，同行业的案例，到框架里面去。


    记住一句话：任何行业的同行，他能成为前 10-100 名，他一定有他独特的设计和模式。就是说，他能生存，肯定有很多值得我们学习的地方。要不然，他不可能还老老实实的活着。


    就凭借这点：我们就应该学会抄袭第一名，学习第一名这样一个思路。


    ![](img/e4c54d03d15250bdb3a46029eaab2380_24_0.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 【拆解同行 1.0 模板】


    最简单的拆解同行的模式模板 1.0:


    +   1, 产品系统 产品是啥。\n2, 流量系统 客户怎么来的。\n怎么推广的。\n3, 成交系统 盈利模式，怎么盈利的，怎么赚钱，收钱的。\n4, 裂变
    客户是怎么转介绍的。\n5, 杜杆 有没有其他资源，条件，或者工具什么的。


    这是我们拆解同行，1.0最基础的版本。 也是我们最容易看到，最容易复制的。


    在我们拆解同行的过程中，我们要学会一个一个去拆，拆清楚了，搞明白了，再去搞下一个个。


    而且那，我们不要抄普通的，但是我们可以看普通的缺点，我们要抄就抄优秀的。


    不懂就照抄，抄裳他们。


    这些模式，推广，引流，成交，裂变，因为这些都是他们当下行之有效的最好方法了。


    要是有更好方法，他们肯定也会做，那么我们也跟他们一起做。就行了。


    前期，先不要搞原创，先抄就完事了。


    抄第一名，我们就可能成为中高手，抄小白，你最后连小白都不如。


    ![](img/e4c54d03d15250bdb3a46029eaab2380_25_0.png)'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/e4c54d03d15250bdb3a46029eaab2380_26_0.png)


    去年10月份，我分享这个案例的时候，这个号他们只有10w粉丝，到现在已经有50w了。他们的模式也很简单：


    +   1, 高薪招募美女 身材，颜值好一些的。 任何基于工资+提成。\n2, 让拍摄师傅，专门拍摄几段，改装，改色的视频。\n3, 通过这些内容，发布快手，然后吸粉，获取关注度。\n4,
    引导别人加 VX(微信)XXX 在微信朋友圈，抛出来学习，创业成功的案例。


    本来他们就是一个4s店，只是搞改色的。\n后来他们用这个思路，快手引流，微信成交，传授技术：5800一个人，8800一个人，\n一年一个4s店，通过快手，教学员赚培训费，一年一个号，就能搞到200-300万不止。\n而自己开一个4s改装，改色，还没有赚100万。


    所以：这就是他们的模式。


    那么我们不管做任何行业，其实都可以从里面学到很多思路。\n可能说，不能完全，复制，但是很多节点知识都是可以学习的。


    比如：用美女效应 来积累粉丝。 其实所有行业都可以。 卖烧饼的，卖水果的，卖其他等等。 都可以。


    用来包装积累粉丝。


    前期：拍摄视频，你不知道怎么搞，那么就跟他们一样，先抄就是了。\n照抄，都不会，那么你还嫌麻烦，还做什么生意。'
