    我讲过：如果这个行业，能持续赚钱，把握概率较大，那么我们就可以采取原材料，或者赚后端的钱，就是我们不只是赚一份钱。

    这个时候，我们可以做大量的售后服务。

    但是如果一个行业：不确定性很高，70%以上不赚钱，那么最好还是只搞加盟，不做售后。'
