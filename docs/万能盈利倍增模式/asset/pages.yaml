  md: '这是第一种思路。


    但是你抄袭一个，你肯定成为不了行业第一的。

    抄袭第一，永远不可能成为第一，最多可能成为第二。


    这个时候，我们可以找更多优秀的同行，把我们的这个节点给优化了。

    你抄十个优秀的同行，把他们最好的技巧都拿过来，那么你就很容易成为行业第一。


    所以：我们拆解的思维也不复杂，最重要我们要多去用心落地，虽然慢，但收获极大。


    老板本人，虽然是商业模式设计者，但是我们必须要有这个思路，具体执行细节和方案，可以讲出来，让员工去落地。


    最简单的拆解同行的模式模板1.0：产品系统，推广引流系统，成交系统，裂变系统，杠杆系统。'
