- pgno: 208
  md: '自古至今其实都有这样的闭环玩法，我认为：如果一个企业想要有巨大的竞争力和有效的自动赚钱系统，我们就必须打造设计一个商业的闭环。从模式上取得最大化的收益比。


    古代贪腐制度：1500 两白银买一个 7 品职位——升任职位——从民众中捞取更多银子——（花费更多钱）买更高职位——从中卖官赚钱，捞取民众血汗赚钱。（一旦形成利益机制，就很容易打造一个强有力的自动赚钱系统）


    ![](img/e4c54d03d15250bdb3a46029eaab2380_208_0.png)


    同样：闭环在销售类型为主的公司进行使用。我们知道，销售类，尤其是北上广深，做贵金属，以及房产销售，企业管理培训做销售的是不是人员流动性特别高那？'
  merge: -1
  img_proc: true
- pgno: 209
  md: '所以公司就要求：必须穿公司的统一工装。 于是很多进来的新员工，都会咨询老员工的意见。（这个工作都是有管理层决定：指定从某个地方定制 ）


    ![](img/e4c54d03d15250bdb3a46029eaab2380_209_0.png)


    那么好了，一套 1000 多元的工装，去公司指定的地方定制，拿着优惠券就行了，然后就可以省不少钱。  一套西装也就变成了 400-500 元。  （其实那，每定制一套西装，他们就给公司返利
    150 元左右的费用。  一个月离职率如果 20 名 X150=3000 元。  公司或者管理层就通过闭环吃掉了。）


    我们看：


    +   1，如果员工定制西装，不去我们指定的公司，花费可能更高。（帮员工省钱，员工很高兴）'
