- pgno: 196
  md: '具体的落地方向为：


    # 1，增加成交率（回头率，追销）


    客户的回头率，追销。


    2，增加消费频率（充值，锁定，维护，续值，黏住）


    3，增加消费金额（激发欲望，引导需求，放大需求）


    4，增加客户转介绍率（让客户裂变，推荐，建立推荐机制）


    5，让客户成为我们的合伙人，代理商，分销者 。


    6，复购，购买其他更多产品。


    7，其他价值。


    客户能否给我们带来更多资源，智慧等。


    所以：我们就会发现，客户跟我们做生意，不是“一锤子买卖”。


    其实，90%的利润都在后端。


    所以；我们不要过度追求客单价，而是要不断延伸更多利润链条，让他成为你的终身客户，而且还帮你裂变客户，介绍资源，甚至进一步跟你合作，给你带来更多价值。这才是我们最应该考虑，思考的事情。


    客户数量 x 转化率 x 客户价值=营业额。 以上都是我们增加营业额的办法。和思路以及方向。


    我们还要想办法提升利润。'
