  md: '# 【20 年总结的一套：万能的盈利框架设计方案】


    ![](img/e4c54d03d15250bdb3a46029eaab2380_5_0.png)


    如果要学布局，我必须我们布局的校训：养身，立己，取势，明道，优术，合众，践行，与变化。


    这句校训，看似简单，有不简单，但凡能做到的，可以成为布局的基础学员了。 我们每个人：作为布局人的一份子，必须，把这句话记在心里，而且传递给儿子，孙子，以及后续的后代子孙们。


    这也是我为什么要写书，做一点分享的本质原因了。 了解到我们的校训，那么我们还要了解，我们的【布局导图】


    ![](img/e4c54d03d15250bdb3a46029eaab2380_5_1.png)


    从上到下：战略——资本——管理——系统化运营——资源整合——布局系统。 从左到右：产品链——流量链——成交链——裂变链——杠杆链。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '这一个布局导图，组成了，我们布局最基本的营销策划思路。


    不管你懂不懂，明白不明白，清楚不清楚，我希望各位都要把《卧龙营销布局导图》给记清楚，搞明白，最好刻在脑袋里。


    这是我个人，花费 600 多万学费，以及阅读几千份书籍，咬心沥血，不断总结，升级的一个布局导图。


    一个单纯的导图思路，花费了我 20 多年的心血和结晶。


    记住：不管免费模式，还是什么金融模式，股权模式，或者说，未来又搞出来一个什么思路。什么系统。那么他都是我们这导图的一个分支而已，仅此而已。


    不管这盈利，那盈利，什么盈利都没有用，他都可以被我纳入我们的这个布局导图里面，为我所用。


    所以：我们要学会使用这套框架，运用这套框架。


    我们这个框架看似简单，包括了多个层面的内容：


    道——法——术——势——器；


    思维层面：布局系统。

    势能层面：资源整合。

    管理层面：机制管理。

    策略层面：产品链，流量链，成交，裂变链的组合。


    就是说，我们这个框架，有道，有术，有势，有法等多方位来实现布局。


    所以：能实现这个框架的，目前全世界还没有一个人。所以：我希望各位同学，一定要记住这个框架，刻在脑袋里。


    然后我们可以一点点去优化，升级，布局。


    知道哪些该做，哪些不该做，该怎么选择，怎么落地等。'
  merge: -1
  img_proc: true
