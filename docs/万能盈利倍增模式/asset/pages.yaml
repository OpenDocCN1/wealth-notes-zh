  md: '同理心（Empathy），亦译为“设身处地理解”、“感情移入”、“神入”、“共感”、“共情”。泛指心理换位、将心比心。亦即设身处地地对他人的情绪和情感的认知性的觉知、把握与理解。


    # 2，“模拟成交”把它带入实现梦想的场景。


    就是从教育客户，说服，购买全过程的策划和优化。就是避开付费环节，直接带客户进入成交后的场景。


    比如：你推销一款产品，直接告诉客户这款产品的使用效果，使用场景，售后场景，那么这个过程就是带着客户，进入成交后的场景，给客户的感觉就是这款产品已经是自己的了，现在正在体验这款产品。


    把它最想要的效果，提前给他。


