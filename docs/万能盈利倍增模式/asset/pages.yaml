  md: '![](img/e4c54d03d15250bdb3a46029eaab2380_113_0.png)


    做房事硬不起来了，那么你吃了2粒子，就能杜绝尴尬，干上2个小时。

    那么这就能解决人家的痛点。

    所以：一直以来伟哥，在国内也受到很多人的欢迎。


    # 4，唯一性（垄断）


    简单理解，就是这件事，只有我们可以搞，其他人做不了。主要还是因为一些壁垒。


    +   1，技术壁垒 他们没有这个技术。

    2，成本壁垒 他们的成本比我们高很多。


    ![](img/e4c54d03d15250bdb3a46029eaab2380_113_1.png)


    过去我们国家劳动力非常便宜，廉价，所以日本，韩国，美国等企业，他们都会让中国代工，然后继续回国内销售。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '但是其他人可能就做不了。


    同样，现在许多国家随着中国劳动力的成本上升，现在很多人又选择了新的代工基地：非洲，印度等。


    因为在我们中国开工资是：3500 元以上甚至更高。  但是在非洲的人工成本，一个月才几百块钱。所以就节省了很多成本。


    你其他人，一时间很难去拼价格。


    +   3，门槛壁垒。\n4，许可壁垒。\n5，资源壁垒。


    比如：


    ![](img/e4c54d03d15250bdb3a46029eaab2380_114_0.png)


    英国一个商人，在一个地方发现了钻石矿，他就慢慢的进行开发，然后以少量的钻石出售市场。获取暴利，因为其他人没有这个先天的资源。你再有钱，你也买不到。


    只要形成了强有力的壁垒，那么就可以达到必须性，形成垄断。 价格就可以我们来定。


    # 5，必须性（刚需）


    人是铁，饭是钢，就是说人人离不开。必须购买的产品。


    比如：男人好色 女人爱美 小孩爱聪明 老人爱健康 企业要盈利 人人想赚钱。这是是不是都是必须要的刚需，而且这些产品，都可以很暴力。'
