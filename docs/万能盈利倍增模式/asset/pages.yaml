  md: '# 【如何策划推广产品品牌，给客户留下独特印象，卖点，并让产品更加容易动销，持续那。】


    # （1）请意见领袖代言（明星，大腕，大咖，网红，知名博主...）


    具备一定数量 100 万+以上粉丝基数，具备一定影响力，知名度，辐射力，公信力的一些人。（注意：不能选违反国家，或者有反人类倾向，或人品，都会对品牌传播造成不良影响。）


    爱屋及乌：你选择什么人代言，客户如果喜欢这个人，觉得这个人靠谱，潜意识也会认为产品也会靠谱。     如果你选择的人，人品出现问题了，立刻下架这个人代言，就是明智之举。


    比如：鹿晗代言推动欧舒丹中国大陆销售大涨 26.9%。  电商大涨 250%。  很显然，明星粉丝经济效应发挥了不少作用，让产品销量大大动销。


    同样：最近的省大师 APP，购物返利软件，有很多做培训的所谓大咖，推动这个项目，在一定范围内形成一定带动作 用，大大推动了省大师项目的推广。


    问题：明星代言动不动几十万，几百万，甚至上千万，我们小企业，小老板，怎么搞？  老孔。


    很简单，我们请不起明星，那么我们就数量级，比如：一家保健品公司，虽然请不起明星，但是我给他一个建议，我们就用数量级取胜，我们去找本地有些影响力的医生，为我们代言，同样，我们在每个城市找那么一个医生代言，这样，就有
    20-30 个小范围意见领袖，公信力人物为我们代言，效果也不比请明星差太多。


    那么实体店怎么做代言：很简单，如果我们开了一家理发店，你给别人剪头，如果发型漂亮的美女，或者帅哥，做的哪个发型，太漂亮了，让我们感到很舒服，我们就给他商量，一下，让他做我们的店铺代言人，并让他签名，然后挂到店里面，门口，或者发到朋友圈等。


    同样，还有人说，我们做的是小摊小贩，怎么搞？


    也很简单，你从网上，定制一个属于你们小摊小贩的小品牌衣服（取一个自己的名字，比如：小李煎饼!! 专心做煎饼!），通过帽子，衣服，以及我们小摊上面的位置，贴上我们的小品牌形象，都是可以的。


    因为显得专业，亲切，别人就很舒服，就 会考虑先到我们这买。


