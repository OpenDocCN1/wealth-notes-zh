- pgno: 15
  md: '但是真实情况是：不知道什么时候，什么时机，无意间竟然看到比我们这些人做的更好的一些人，人家思路就很好。 比如：桶装水+广告 桶装水+银行


    后来，我发现一个，我以为这有这招好用，但是后来进入更多圈子，我发现，还有第二个，第三个，第四个，第五个…..


    过去很多年，我一直被自己身边熟人，熟悉的行业的人，限限制死了。 永远自以为没有更好方法。


    实则是：自己把自己给欺骗了。

    其实好方法，一直都存在，太多太多了，只是我们没有去大规模，极致市调。


    你市调身边的熟悉的人，肯定都是一样的。


    但是你去省外，去国外，去香港，澳门，走一圈，去更多同行业，和不同行业或行业有点类似的，去市调时候，当我们站在行业生态，去市调时候，我们的心态，格局，就一下子给打开了。


    但是：你只是市调身边熟人，或者本城市的，你看到的只是生意。


    而不是去整个行业市调。 甚至跨行业市调。


    记住：思维打不开，其根本上，就是认知受限，那么这个时候，你就更应该多市调。


    天天闷家里喝酒，发愁，睡大觉，问已经熟悉的人和行业，等于没问，没做一样。


    李素荣：

    大多数人就是懒，喜欢天下掉馅饼，市调没有做到极致，有时候可能还是理解不透什么是极致。我也是一样经过了很长时间才能理解到...


    李素荣：

    老师刚才说的，我就想到马云去硅谷


    强调一下：市调不是简单的调查询问，而是持续不断的把市调做到极致。


    另外告诉大家一句话：宁愿市调十年，也不要轻易出手。 一旦出手，必将颠覆整个行业。 我天天都把市调，讲了很多遍，我发现很多人只是表面理解，真正用心去做的很少。


    但是能真正用心去做的，其实，他自己的收获，绝对空前的。'
