    \n比如：保健品行业。\n\n如果我们新出一款男人保健品，卖 10 块钱一瓶，你敢吃吗？\n有一家保健品公司，让我们策划过：过去这家保健品公司卖的是 198\
    \ 一瓶。\n\n他们的主要分类有 2 类：\n\n+   1, 老年人的保健品      治疗脑梗，高血压，降血压，血脂，以及身体条件的一些保健品。 \n\
