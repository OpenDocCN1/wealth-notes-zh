- pgno: 198
  md: '# 【被 80%的企业家忽略的金矿？】


    不管是潜在客户，新客户，老客户，其实客户本身都是有很多价值的，但是往往生活中大多数老板没有学习过营销，要么根本不知道怎么利用，要么就是根本不知道。 往往很难发挥客户的最大价值。


    在我们资源配置中：如何发挥每一个客户（潜在客户，新客户，老客户）最大价值那。


    一般常用的有 9 大策略和方法： 每一个都至少价值 1000 元。


    # （1）客户见证


    不管是文字，图片，语音，视频，我们都要想尽一切办法，做出更多见证。 （人性喜欢模仿：见证越多，驱动力成交越多。 不做的话，就白白扔了不少钱）


    有空就做见证，千万不要等着顾客主动给我们做见证（人性是懒惰的，就算你包子好吃，产品再好，人家也不会跟你主动做见证，毕竟没利益的事儿谁都不愿意干）。


    # （2）让客户进行分享传播。


    客户来体验了，我们送 5 个邀请卡。 然后给他讲：“有朋友来体验了，我们再送他 2 次体验卡。” （每个人身边有 150 个同类的人和朋友圈人脉） 这是一种双赢的自动传播策略（如果不用，基本上也浪费了）


    # （3）引导客户重复消费。


    客户来过第一次，是不是可能很难第二次就来。 比如：很多客户试了衣服，可能一下就跑了。 不可能说来 100 个，你 100 个成交。'
  merge: -1
  img_proc: true
- pgno: 199
  md: '第一种情况：客户来了，没消费就走了。 他有没有买东西需求，还有买其他东西的需求那。 很显然绝对有。


    第二种情况：新客户消费一次，第二次就走了。 （第一次一定要做好，最少差不多。 留一个好印象。 这样可以保证我们第二次，引导成交。 比如：免费体验，试吃，送赠品等，进行让客户回流）


    # （3）客户数据库思维


    一天不成交，2天，不行2个月，甚至1年可能会成交。 只要客户在我们数据库里：有备注意向的。 我们都可以持续追踪。 说不准客户哪天就需要了，然后就看到我们。
    就成交了。 （过去是电话，发短信，邮箱，现在是微信（朋友圈，群）和公众号）


    # （4）客户转介绍，让客户裂变


    给客户一些工具和方法，以及利益和诱惑，让他们主动给我们介绍客户进来，这样我们就毫不费力的借用了对方的信任，抓取了更多客户。


    （不然这招不用，老是自己去推广，是很累的，而且成本很高）


    # （5）把客户发展成，粉丝，推广者，员工，分公司


    让客户也加入我们的事业项目中，做一个加盟招商，最有效果。


    # （6）客户升级为会员，VIP


    普通客户——普通会员——铁卡会员——银卡会员——钻石会员——至尊会员；

    贵宾 VIP 卡。


    # （7）让客户加盟，代理商，渠道分销商。'
