  md: '# 深度揭秘：“莆田系”酒吧商业闭环比一个“莆田系”医院更赚钱的生意。


    我们知道 2016 年 “魏则西” 事件，将莆田系医院推上了风口浪尖，那时候人们就发现中国几乎 80%以上 的医院几乎都是莆田系兴办的。


    可能有人觉得医院是最赚钱的，今天我们看一个莆田系更赚钱的商业闭环玩法。


    真是令人震撼，匪夷所思。


    这种玩法，对我们做传统生意，还是线上生意的转型和模式升级，都有着巨大的学习，模仿，借鉴作用。


    那么莆田系的厉害，到底有多厉害？


    来一个故事：


    2018 年大学生，毕业人口高达 820 万，但是很多学生一毕业就面临失业。


    在这里面，就有那么一个女孩，是三本院校舞蹈系的毕业学生，进入大城市，那么多人同时 obdob 一个职位，连续面试多家教育培训机构，以及参加很多事业单位的招考，结果都不怎么好。


    要么是对方出的底薪很低，一个月四五千，在上海，北京，这样的大城市，根本养不活自己。要么就是嫌弃她学校不入流，专业不对口等。直到有一天，小丽，他踌躇无措时候，在
    58 同城上看到一个招聘：'
  merge: -1
  img_proc: true
