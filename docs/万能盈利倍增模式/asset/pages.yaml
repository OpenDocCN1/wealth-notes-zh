- pgno: 102
  md: '# 【产品的选择，决定了利润的层次】


    什么才是最“理想的产品”？


    重新认识产品后，我们说一下什么是理想产品？


    选择产品决定我们的利润方向。盈利方向。


    有些行业，即便你拼了老命，智慧在高，也很难做出很大出息。有些产品，再努力做，也很难有很好的回报。


    是选择暴力产品，还是微利产品？


    虽然每个行业都一定有有它自己的机遇和机会。


    举个例子：

    你选择定位了要做老师：基本上你这辈子是很難赚到大钱的。

    即便你足够努力，把学生都教育成为了清华大学的学生，那么也是很难赚到钱的。

    当然了，也不是没有机会。


    +   1, 你要么去做线上课程，服务全中国的学生。\n2, 要么开设直播，做网红老师。 也是可以赚钱的。\n3, 要么转行，跨界去做生意。 开学校。


    我们来看：你做老师，那是卖时间。 出售时间给学校。


    盈利就是:学校发给我们工资。


    而你做线上课程，那是，卖课程，靠学生付费赚钱。\n而你自己开学校，这是做培训行业赚钱。\n同样一个人，不同的盈利模式和轨道，那么结果就会千差万别。


    所以我们要找到一种最佳的产品模式：到底我们要卖什么。


    这非常关键。'
  merge: -1
  img_proc: true
- pgno: 103
  md: "“理想产品”模式，一般满足一下几点要求：\n\n+   1, 低成本。\n2, 高利润。\n3, 可持续（高频，多次，持续，买单）\n4, 唯一性（垄断）\n\
    5, 必须性（刚需）\n6, 可复制（自己容易复制，别人无法复制）\n7, 边际化成本低，趋近于零。\n8, 仓储，物流成本低，趋近于零。\n9, 现金流良好，账期短，甚至无账期。\
    \ 无坏账，最好能预收货款。\n10, 客户忠诚度高。 \n11, 具备自动购买力，不需要说服教育，客户自动想买。\n12, 具备传播力，能自动传播裂变，省去营销推广费用。\n\
    13, 售后服务简单，甚至根本不需要售后服务。\n14, 商品流通，资金周转率高。\n15, 能建立平台，实现自动运转，有平台生命力。\n16, 能否接触到高端圈子和更成功的人士。\n\
    \n需要说明的是，这样的理想产品，根本不存在。但是我们可以尽可能满足找到这些无限趋近理想产品。\n\n符合条件数量越多，说明它越值得去做的产品。"
  merge: -1
  img_proc: true
- pgno: 104
  md: '1，成本低 利润率高。


    ![](img/e4c54d03d15250bdb3a46029eaab2380_104_0.png)


    很简单理解，就是产品的成本很低，利润率很高。


    比如：我们老家镇上，在 10 年前，他们就开设了一家牙科，叫做宋氏牙科，十年前我牙疼，去他们那里看过，十几元的成本，我在他们那里修补了一个牙他们给我出了三个套餐：


    +   1，石膏牙 580 元。

    2，镀金牙 1099 元。

    3，金刚石牙 2999 元。


    他们这个牙科，成本不高，利润空间极大，结果十几年过去了，我发现很多店都倒闭了，还有很多店都有了很多竞争对手。而宋氏牙科，还是只有他们一家。他们生意也不是很好，但是每年的利润却很高。


    所以：我们找产品，就找一些低成本，高利润率的产品来做。这样会比较持续。


    比如：啤酒一瓶 0.4 元，专门供 KTV ，他们一瓶就卖了 10 元-20 元一瓶。

    其实利润也是很高的。


    2，高利润。 可以定高价，利润空间就越大。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/e4c54d03d15250bdb3a46029eaab2380_105_0.png)


    美容整形，的成本也很低，但是他们的定价就很高。


    一堆玻尿酸可能成本也 100 多元，售价就是 1000-5000 一针。 还有微整形，等，他们自己都可以定很高的价格。


    因为外界对这个行业不懂得，二来每个行业的整形参差不齐。


    这类行业的项目很多：


    丰胸，提臀，抽脂，V脸，微整形，填脂肪，瘦腿，美白，养肤，干细胞等。 多重项目项目整下来，至少也要 20 万-100 万，甚至更多。


    比国内做大型医生主刀还要赚几百倍的钱。 所以：这个行业就值得去做。'
