- pgno: 77
  md: '那么这个思维就是：找到关键核心节点。


    那么问题来了，我们学了这一招，我们搞清楚了，搞明白了


    我们就可以思考一个问题就是：我们要找的客户，谁手里已经拥有了这些客户，而且还不形成利益冲突那。


    那么这就是我们可以挖掘的关键节点。


    比如：如果我要做线下培训，我会做什么？ 我会如何做。


    很简单，一个思路：找关键核心节点。


    +   1，商会 给商会的所有会员，送一趟课程或者咨询案，以及书籍。\n2，代记账企业，财务管理企业 他们有大量的企业客户群，我送票给他们。\n或者书籍，咨询案都可以。\n3，我找同行业的培训圈，他们手里面有大量的客户群，我不赚前端的课程钱。\n4，去跟小商品协会，各种企业家圈子对接。


    那么这就很容易了。 我们完全不用自己去打电话，去搞销售，更不用招募很多人做电话销售。


    有项目，我们可以关键节点思维：去做业务。\n但是关键，我们啥项目都没有，我们变现个毛啊。


