- pgno: 200
  md: '很多人到处傻逼招商，却不知道招商最好的方法，就是对现有的客户群，进行招商。


    # （8）合伙人，发展成客户为股东。 融资。 锁定。


    比如：众筹，分红，让客户享受产品的时候，还能赚钱。 参与投资。


    # （9）客户终身价值


    客户除了买我们产品，成为我们股东之余，还有更多刚性需求：吃喝拉撒睡，穿住行，娱，玩，赚钱，梦想等。


    比如：我们给一家保健品公司提供了一个策略，就是针对买保健品的会员，提供黄金理财服务，结果有 20% 多的人，就进入了这个服务，然后又多赚了不少钱。


    任何一个客户进来，我们都有这 9 个价值，可以持续给我们造血，赚钱。 但是很多人都给忽略了，遗漏了，今天早上我特意抽空分享出来，各位一定把这几个点给足够重视起来。


    记住：千万不要等着客户主动消费，主动加盟，主动转介绍，主动升级 vip，主动成为合伙人，要知道绝大多数情况下，人都是被动，又是非常懒惰的。


    我们直接设计好这 9 套运营方案，直接呈现给顾客，让客户知道，你不单单可以享受产品，你还可以有这么多东西可以做，这样很多客户可能就主动咨询了，然后一下就把客户最大价值发挥了出来。


    这 9 个策略和方式，要设计成 9 个运营小系统方案，然后再组合成一个系统的方案，可能用到其中 3 个，5 个，也可能一次性用到。


    如果你想发挥每一个客户的终身最大价值，那么我们务必把这 9 个知识点利用起来。 不然就是白白浪费掉了。'
