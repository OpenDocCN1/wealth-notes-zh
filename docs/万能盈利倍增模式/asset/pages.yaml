  md: '制。


    那么为了更好的不让别人模仿，让别人无法模仿，那么我们就可以做系统组合的运营。


    好的系统运营，是简单到自己可以复制，复杂到别人无法复制。


    比如：如今西南航空是美国最大、全球前三的航空公司，并且是全球唯一一家从 1973 年到现在一直赚钱的航空公司。他成功的重要经验是基于「廉价」的运营配称。西南航空只提供经济舱飞行服务，它的机票价格大约和长途客车的票价相当。


    它只有美国国内的航班，不提供货运服务，只做客运；不提供转机服务只有二三线城市之间点对点飞行。机型的选择上，它只有波音 737，没有其他飞机。飞行员只会飞 737，机师只会修
    737。


    西南航空没有提前预订票价，不提供空中服务，不提供机上餐饮，只提供简单的花生和软饮。甚至连座位都是随意坐，就跟我们坐公交车一样。西南航空的票还不是纸质的，是个塑料卡片，可循环使用，降低成本。


    西南航空严控各种成本，包括开会不开灯，这是它的文化，只要你看得见地方就不开灯了。整个企业文化就是围绕节约来做，就什么事该做什么是事不该做大家都清楚。


    只要是增加成本的就不做，能降低成本的我就做。因为他们把机票的「廉价」做到了极致，所以用户也就不太在意其它。


    小企业做品牌同样是个系统工程，同样是个科学工程，既需要宏观的布局又需要微观的设计，以及细节化全面的运营体系和有效的资源配置。如果一旦掌握了卧龙营销打造品牌的方法论，无论面前的巨头有多大，都会有你的一席之地。


    系统化运营的关键：就是运营环节的积累。


    当一个事有 20 个环节的时候，就算有人来模仿，每个环节模仿 90%，0.9 的 20 次方是小于 0.2 的，也就是他基本上是学不会的。


    现在很多创业者担心被模仿，是因为他的运营体系太单薄。轻而易举就被模仿了。


    ![](img/e4c54d03d15250bdb3a46029eaab2380_38_0.png)'
