  md: '# 【战略规划系统】


    但是大多数情况下，可能连老板自己都不知道未来方向和趋势具体怎么走。


    战略，就是做选择，我们做生意会面临各种各样的选择，每一个细小的选择，最终都会影响我们最终的结果，那么我们怎么做到最大化的作对选择？


    那么对于战略规划：我们【卧龙布局系统】提供了很多模板和思路。


    第一个：就是我们的短小而精悍，价值百万以上的布局小模板。'
