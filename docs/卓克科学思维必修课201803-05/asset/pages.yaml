  md: '# 211 | 遗憾：康熙的最大爱好：科学


    211 | 遗憾：康熙的最大爱好...


    # ——► 概念20：遗憾 ◄——


    中国在明清两朝曾长期和西方科学保持接触，关系有时亲密、有时疏远。有人认为当时的中国没有发展出现代科学很“遗憾”，而实际上，只是必然，没有什么遗憾。


    上节课最后，我给大家留了一个问题，假如康熙皇帝喜欢科学，大力支持，西方兴起的科学可以在中国生根发芽吗？


    答案是：


    +   顶多增加了一些根发芽的可能性，但起不了决定作用。


    科学可以延续下去，需要两个方向的支持：


    +   一个，是自上而下的支持，这个方向提供了最初的权力合法性跟资金融；

    另一个，是自下而上的支持，这个方向提供了足够的人。


    # ——► 喜欢科学的康熙 ◄——


    那这节课，我们先说说科学在中国第一次产生的自上而下的支持。


