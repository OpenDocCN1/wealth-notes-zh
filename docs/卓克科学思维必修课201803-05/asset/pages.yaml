  md: '# 243 | 反省：什么时候需要假设上帝的存在？


    # ——► 概念24：反省 ◄——


    科学是有力的，但内部也有各种问题，这些问题往往还是科学家们自我反省时公之于众的，甚至有科学家会把这些问题当做课题来研究。这让科学看起来没有那么完美，但这正是科学不断自我否定与完善的过程。


    上节课最后我留了一个问题，就是：


    你觉得我们在什么时候才需要假设上帝的存在呢？


    这是一个很宽泛的话题，我也看到了不少精彩的留言。如果让我回答的话，我可能更愿意举一个实例来说名：


    在什么时候不需要假设上帝的存在？


    # ——► 狂妄的拉普拉斯 ◄——


    这件事发生在1805年，那一年法国科学院的院长拉普拉斯写完了宏篇巨作《天体力学》的第四卷，这前四卷用已非常成熟的数学工具，也就是微积分，准确地定量地分析了行星的运动，行星的形状、潮汐、三体运动，甚至还详细地讨论了木星跟四颗卫星的多体运动。


    可以说，这套《天体力学》已经完全全站在了100年前的牛顿那本《自然哲学的数学原理》的肩膀上了。


    拉普拉斯当时回答就是：


    陛下，我的理论不需要这个假设。


    这一幕经常会用在各种科学家的故事里，尤其是要表现作为一个刚正不阿的科学家，不畏皇权，不畏宗教势力的性格。


    # ——► 科学决定论 ◄——


    拉普拉斯以这个念头作为基础，后来又提出了“拉普拉斯妖”这个理论。


    这种说法站得住脚吗？


    反正在拉普拉斯说这话的时候，世界上没有任何的理论可以推翻它。拉普拉斯的这套说辞可以用3个字作为代表，就是“决定论”。


    # ——► 蝴蝶效应 ◄——


    那么在宏观领域，是不是可以成立呢？


    也不是的。


    有4个字可以代表决定论在宏观尺度下的崩溃，这4个字就是“蝴蝶效应”。


    它说的意义就是：


    初始条件下，微小的改变就导致整个系统在长时间后产生巨大的连锁反应，最终会导致这种现象，在初始端差之毫厘，在末端谬于千里。而且这种误差是无法预测，没办法修复的。'
