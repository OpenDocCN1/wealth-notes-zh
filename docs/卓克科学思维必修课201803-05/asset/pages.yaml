  md: '后续10几年，霍金又出版了一系列根据后来10几年宇宙学进展写成的时间简史姐妹篇《时间简史续编》《黑洞、婴儿宇宙及 其他》《果壳中的宇宙》，加起来也有上千万册的销量。


    他在晚年还参与了《辛普森一家》《星际迷航：下一代》的拍摄，客串了美剧《生活大爆炸》中的霍金，根据他的生平，还拍摄了两部电影——《万物理论》《霍金传》。


    除了这些传播力最大的电影电视剧，他参加的演讲更是 Sitz不计其数，他在轮椅上一直为科普贡献他所剩的时间。


    可以说，地球上不论什么国家，凡是中学毕业的人都听说过霍金。


    我想，以当代的社交媒体和娱乐产业的传播力，霍金应该是历史上科普成果最大的人。


    # |科学思维：情感和观点分开


    霍金科学成果的巅峰是怎么达到的呢？


    他其实是有能力把情感因素和理论证明剥离开的。


    他虽然反对贝根斯坦把热和数学结合在一起，但是他不会被这种情绪左右，他虽然已经花费了两年时间重复了贝根斯坦的计算过程，却没有从中找到错误，但他还是可以站在贝根斯坦的角度，先假设那个结论是正确的，以这个为基础，看看能不能推导出其他更有意思的结论。


    这种思考方式也只是伟大的科学家可以做到的。而出现在一般人身上的情况就是，只要观点上是对立的，这个观点就不会再有更深的讨论了。


    卓克


    最后，让我们一起缅怀这位伟大的科学家和科普人。'
