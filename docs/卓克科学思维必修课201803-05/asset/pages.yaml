  md: '# 230 | 平凡：被利益左右的科学体系


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_150_0.png)


    230 | 平凡：被利益左右的科...


    # ——► 概念22：平凡 ◄——


    在现代科学方面，中国用了150年的时间追上了西方500年的进展。所以当代的中国人难以避免对科技发展的速度有所高估，把科学当作无比伟大正确的事物。而实际上这是一种偏见，科学没有大家想象的那么完美。客观公正的评价科学，也是一种科学精神。


    前几节课我们着重说了一些人对科学的误读，过分高估了它，把它想象得过于伟大，导致出现各种认知错误。


    但是是不是说只要我们客观公正地对待它，科学就是很强大的呢？


    这个只能说大部分是这样的，这都源于科学在自我纠偏的能力上，相对而言。


    但这节课我要给你说说，科学在自我纠偏中有时候也会很低效，这种低效是来自于科学体系本身的，而不是外部。


    # ——► 冷核聚变 ◄——


    这个具体的例子就是冷核聚变。


    我们得先解释一下冷核聚变是什么，得先把这个“冷”字去掉，说说核聚变，这是人们在研究什么机制让太阳这么持久、这么炽烈地发光发热的时候发现的一种现象。


