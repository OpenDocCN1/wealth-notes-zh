    # ——► 本周课程复习 ◄——


    # 概念21：追赶


    1847年，三名中国学生赴美留学，迈出了中国追赶现代科学文明的第一步，他们之后促成了“留美幼童计划”。留美的幼童人到中年后又促成了“庚子赔款奖学金计划”。这些奖学金培养的人才几乎造就了中国现代科学所有学科分支的创立者，确定了现代科学在中国的位置。


    +   1. 观察历史大事件的时代背景，是把握历史真实影响的重要观察方法，再伟大的事件，也不过时代的限制。 2. 容闳虽然毕业于耶鲁大学，但1850年的耶鲁大学的关键词是保守和宗教，主要功能是培养牧师和传教士，与欧洲的现代大学有很大的差距。


    +   1. 凡是有法外之地的地方，特权的人跟当地的老百姓肯定是冲突对立的。 2. 发现细菌，是医学发展的分水岭，之前的医学，绝对大部分疾病是既不知道病因，也不知道治疗方法的。
    3. 天津教案的根源，一方面是宗教上的差异与特权带来的积怨，另一方面是医学上的差距引发的误解。 4. 天津教案能妥善迅速解决，一是曾国藩处理得当，二是普法战争让法国无暇顾及。这才让曾国藩有时间听
    Pirnia 的留美幼童计划，并与李鸿章一起奏稟朝廷。


    +   1. 中国第一批留学美国的人让中国走向现代化，让科学在中国扎下根。这批人是1872年-1875年间清政府公派去美国的120名年龄在10-15岁的孩子，他们被称为“留美幼童”。
    2. 现代科学，现代社会制度，始终没能出现在中国古代，不是个原因决定的，而是几乎所有的社会活动的每一个环节，都藏着让人想都想不到的巨大的阻力。


    +   1. 留美幼童的成才率高，关键因素在于他们得到了获取差异化信息的机会，与同时期的本土人才相比，他们掌握了巨大的信息优势，因此才大有所为。 2. 梁诚、唐国安、欧阳庚、唐绍仪，追回了部分“庚子赔款”，并用这笔钱重新以更大的规模恢复了“留美幼童计划”。


    # 答疑时间


    +   1. 自己找答案的好处，一是可以记得更牢固，二是在找不到答案而有准备地提问时，能够得到被提问者的重视。 2. 影响记忆效果最大的，是新的知识点与旧有的知识点的关联的强弱，寻找答案的试错过程，就是知识点被巩固的过程。所以，自己搜索答案的时间没有被浪费，而是有效地用在了记住这个新知识点上了。


    +   1. 用好搜索引擎，不仅是搜索网页，还有微信、微博、文库、学术、知乎、Quora、视频、论文库等形式的结果，就能得到绝大多数问题的答案。 2. 不要因为畏惧英文而失去找到正确答案的机会，除了可以利用在线翻译，通过视频、图像资料也可以跨过英文障碍。


