  md: '# 197 | 问答：干细胞治疗和美容靠谱吗？


    有同学问到，干细胞能不能治疗疾病，能不能美容？


    简单回答：


    也许可以，但离真正通过审核，推向市场还有很久的时间。


    当前号称干细胞疗法和美容的广告，99.9%是虚假或夸大的广告，我们不妄去臆测分之一的可能性。


    # —— ◆ 干细胞被热炒的逻辑 ◆ ——


    具体来说，干细胞这个词大概是从2007年之后在中国开始被热炒的，虽然不一定是因为那一年的诺贝尔奖颁给了干细胞相关的研究，但确实是有这种规律：


    每年的诺贝尔奖，尤其是生理学或医学奖颁布之后，马上国内就会出现一段由保健品跟骗子们售卖的炒作。


    # —— ◆ 干细胞临床试验 ◆ ——


    其实，直到2018年的今天，生物学家对干细胞是怎么分化的并没有形成系统的理论，所以干细胞的应用到现在几乎只在研究阶段。


    全世界批准的干细胞用于临床治疗的只有10个，3个在美国，3个在韩国，澳大利亚、比利时、加拿大、意大利各1个。这些治疗涉及到领域是角膜的疾病、骨性关节炎、肝癌、器官移植的抗宿主疾病。


    # —— ◆ 干细胞的定义 ◆ ——


