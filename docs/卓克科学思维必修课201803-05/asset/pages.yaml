  md: '所以，腓特烈一世在那个时候，可能时刻刻都有权利的危机感。于是就借巡游各地的机会，专门去了一趟博洛尼亚。


    法学院的学生们也是有备而来，向皇帝呈上了一份请愿书，大意就是希望能够支持、维护我们这些背井离乡学生的权益。


    你看，当地的教会各样给我们穿小鞋，我们在法学院中还好，但只要一走出法学院的大门，就像城里的那些下等公民一样，居无定所，打官司准输，您能不能给我们做主呢？


    这个请愿书正中腓特烈一世的下怀，求之不得呀。于是回去就颁布了一份特许状，名字叫做《完全居住法》，还对这些学者大加赞赏，赞扬他们追求真理。


    # 《完全居住法》规定：


    +   不许因为债务问题伤害和扣留学生，违者就按债务的4倍罚款，而且还授予法学院独立司法权，就是学生如果犯了官司的话，他是有权选择是由自己的教师来审理，还是由当地的主教来审理的。


    这可了不得，表面上看是为学生做主，实际上是皇帝安插在教会管辖地中的国中之国，可以不受教会的约束。


    就在这种权力斗争的大背景下，世界上第一所大学诞生了，它就是博洛尼亚大学。


