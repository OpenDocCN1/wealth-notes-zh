  md: '# 174 | 问答：怎么选到好的食用油？


    # ——▶ 今日内容看点 ◀——


    通过阅读今天的内容，你将会解答以下3个问题1答案：


    +   1. 不同食用油有什么区别？

    2. 初榨橄榄油要怎么吃？

    3. 选择食用油的原则是什么？


    有同学问，超市里油的品种特别多，价格差异也很大，有的一小瓶100多块钱，有的一大桶才70块钱，淘宝上看配料表也看不出个所以然，所以想问问各种食用油的区别？


    简单来说：

    它们之间的区别更多在于口味，而不在于营养价值和对健康的影响。


    各种食用油提供的几乎都是纯粹的脂肪酸，这点就有点像问煮花生、五香花生、炸花生区别在哪儿？对健康有什么影响？其实它们的区别，就是味道不同。


    # —— 纯度和烟点 ——


    但无论是哪种，只要榨出油来，油的主要成分就是脂肪酸，这个占比是99.5%以上的。


    # —— 初榨橄榄油 ——


    没有精炼提纯很多步骤，也不意味着不好，因为油里溶解的东西和杂质就是对应的农作物的一部分成分。


    # —— 三种脂肪酸 ——


    那么对于不是初榨的，那些精炼提纯后的油，它们有什么区别吗？


    也有 的，虽然它们99.5%都是脂肪酸，但是脂肪酸是有不同类型的，食用油中的脂肪酸有单不饱和脂肪酸、多不饱和脂肪酸和饱和脂肪酸。它们对身体的好处也是按照这个顺序，从好到还行到不好。


    我把常见的13种食用油在3项上的比例列出一个表：


    42 48 10

    54 36 10

    54 2 44

    31 48 21

    28 23 49

    35 15 50

    21 49 30

    16 54 30

    15 24 61

    15 73 12

    14 29 57

    11 19 70

    6 58 36


    顺着饱和脂肪酸这一列看下来，最低的油是：

    芝麻油、橄榄油、葵花籽油、玉米油、大豆油、菜籽油，这6种。'
