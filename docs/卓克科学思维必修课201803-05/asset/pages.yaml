  md: '# 227 | 问答：怎么给家人科普？


    227 | 问答：怎么给家人科普？


    怎么给家里人科普？


    这是我经常见到的这个问题，大多数同学遇到的困扰就是家里人不接受，更有甚者还跟家人吵了起来。


    那先简单回答：


    怎么给家里人科普，对我个人来说，方法就是只说具体的知识，不评价对方的观点，更不能评价人。


    但是，


    我们之前讲了很多科学史方面的内容，如果你都仔细听就会发现，土壤是一个非常重要的因素。


    一种思维方式，或者一种文化可以生根发芽，和所有有可能参与其中，或者已经参与其中，还有那些特别引起我们注意的极少数的作出了特殊贡献的人，都有关系。


    可是人们在讨论这种新思想、新文化的时候，往往只看到了那几个表现最突出的人。比如说我们经常会看这种问题，就是中国为什么不能出爱因斯坦呢？中国队为什么不能踢进世界杯呢？


    那同الص性问题也一样适用于“爸妈为什么还会相信传销保健品呢？”


    我们先说第一个方面，那就是个人方面。


    一个人对传销性质的保健品深信不疑，哪怕是有很好的被科普的机会，都没法改变想法的话，那这个问题已经不是科普知识和科学思维可以解决的了。


    如果把一个人全部的思维习惯，知识存量，跟世界观、价值观形成一个土壤的话，那么就是这个土壤来决定有哪些新的知识可以在上面稳定存在。


    这个道理尤其体现在咱们《科学思维课》第205节到第223节，不能否认，有这个残酷的事实，就是一部分人脑中的土壤，已经不可能再接受科学或者其他的思想了。


    大脑中的土壤，并不是随时可以推倒重来的。


    愿意把脑力用在复杂的知识上，愿意下棋，愿意猜谜语的人，他们的大脑处理这些任务的效率其实是很高的。


    这种脑跟没有良好思维习惯的脑，在神经元的连接方式上是不一样的。而绝大部分的神经元连接已经稳固了，也就决定了大脑的土壤是什么样的。


    所以在青少年时期之前，注重思维习惯的培养特别重要。


    人脑的神经元连接数有一个先快速削减，再缓慢增加的过程。


    快速削减期发生在6岁到12岁，在那几年里，很多不必要的多余的连接，受到基因的指导断开了，连接数大约会下降80%以上。


    这个修剪的过程是必不可少的，如果没有修剪，连接数量当然不会少，可是大概率说会出现各种精神问题，或者智力发育问题。


    那么什么东西在修剪之后还会保留下来呢？


    对一个孩子来说，大约就是那些最重要的，最常用的基础功能会留下来。


    所以在这个期间培养良好的思维习惯是一件事倍功半三次方的时段，因为后续，比如说从12岁到50岁，神经元连接的数量才会缓慢地增加，形成的也是你今后生活、工作中最需要用到的那些连接。


    现在得上也设有专门给青少年的版本，叫做少年得到，上面有很多课都能起到这个作用。除了跟学校教学有关的内容以外，甚至还有从社会学、政治学角度谈的公正课，这些都是构建一个多样性比较强的大脑所需要的素材。


    不过还是有些年纪很大的人，可以随时调整自己的观点，这个也是一种能力，一样也是从小养成的。甚至，随时调整观点的能力比认准了科学方法法还不放手更重要。


    我之后会开一个比较长的系列，叫做科学的自嘲。


    因为之前我们说了太多科学中高大上的精华，很容易让人听完之后误以为，科学是一个无比正确，光明伟大的学科。实际上这是一个错误观点，那些闪光只不过是因为我们总把最杰出的部分拿出来当例子讲。


    如果总的话，科学方法、科学理论可以完美解释的领域并不多，这些领域又大都集中在物理的四大力学上。这些力学衍生的工程学科造就了1900年之后生产力的突破跟技术上的优势。这些对我们的生活影响非常大，所以会让人感到科学无处不在。


    但其实，大多数人并不知道，很多领域都是没有优秀理论框架的，那些领域中的科学研究只是像集邮票一样，只是把素材收集、整理、归类。


    那了解了这些，我们就会知道，科学越是…机会多，机会多就代表着生命力强。


    所以实际当我给父母作科普的时候，土壤打基础这个过程早就在我们把科普知识说出口之前几十年就完成了。


    如果父母脑中的土壤本身就是多样性的，如果你讲的还是符合逻辑，证据坚实，那么他们自然会接受。不用施压，也不用逼迫，不用挑战价值观。


    如果不接受的话，那现实就是比较无奈的，我们个人再怎么努力，结局都已经是定数了。


    但是我们毕竟是一家人，为了这些伤感情也不划算，只要他们不真的往嘴里吃，往身体里注射，只是愿意说一说，或者转发转发，那我们也不用非要把这些行为纠正过来。


    那说完了个人的部分，再说社会的。


    科普的功能出现在学校和媒体的宣传中，学校教育是一个复杂的话题，大概率说，好学校这方面会好很多，比如像人大附小、师大附小，大部分老师都会要求博士学位。就算是在现在的博士含金量比不上上上世纪80年代那种千里挑一了。但相比来说，百里挑一还是可以的。


    有这么个数据，比如2017年，本科生录取总数是700万左右，而博士生录取总数是不到8万。虽然肯定是在这700万本科生里，今后几十年一定会有水平超过那些博士生的，但是概率上来，全是博士学位的小学老师的总体水平，还是要远远超过全都是本科生的小学老师的总体水平。


    他们曾经苦读过，知道好的学习方法跟优秀的知识是什么，会给学生比较好的引导。只不过能不能上这样的小学，又是一个特大的不确定因素。就是家里经济条件很好，也很难实现。除了能求一个好运，我想也只能是家长多花时间，帮孩子培养独立思考，自主选择的能力。


    虽然这么做，前期的花费时间很长，好像是耽误了父母工作的时段，耽误了挣钱，但是只要你一想到，当孩子18岁成年之后，这些能力可以支撑他独立选择今后所有的生活道路，做家长的不用再操心了，甚至有可能孩子主动拒绝你再给他掏钱上大学，他完全有能力自己负担学费的时候，你就会感到无比欣慰，前期正确的投入非常划算。


    媒体宣传中的科普内容，现在是越来越多了，如果以5年一个阶段来看，科普内容的进步非常明显。那些曾经伪科学跟反科学的内容，生存已经不如从前那么舒服了。这些现象代表着媒体中科普内容底线大幅提高。


    那科普内容的上限在最近10几年来变化也很大，在2000年初的时候，我们可以买到的科普书全都是翻译版的。


    但是最近几年，很多留学回国的科学家，甚至是大科学家，都有大量的优秀科普书出版。


    我们买这些书看，收获的更多不体现在具体的知识1、2、3上，而是体现在看内容的过程中，体会到别人是如何从证据导出结论这个过程，那个大科学家是怎么从假设生出否定的勇气来，这样过程也是帮助我们构建科学思维化的神经元连接的模式过程。'
