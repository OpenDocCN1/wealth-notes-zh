  md: '# 180 | 问答：面膜到底有什么用？


    答疑中被同学们提起最多的就是面膜到底能不能美容，这次我们就说说面膜的作用。


    简单说：


    现在生产的大部分面膜能起到保湿的作用，这个效果可以持续几个小时。


    # ——◈ 面膜的作用 ◈——


    具体地说，在中国使用的绝大部分的面膜都是贴片式的，这种面膜最早发明于1993年，大概在2000年进入到中国市场，现在每年大概是100亿到120亿人民币的销量，而且过去几年都是高速增长，年增长率都超过24%。20到50岁之间的中国女性在半年内使用过面膜的占比是95%，这些是中国整体数据。


    但欧洲却不是这样的，同样年龄段，过去半年使用过面膜的女性只占16%，美国就更少，只占7%。


    所以面膜这个东西有点像动漫，或者像整容文化似的，是一种中日韩引领的区域性消费热潮。


    女性敷面膜的终极诉求就是为了让脸好看一点，饱满一些，圆润一些，不要有褶皱。


    皮肤好坏有这么几个因素构成：


    +   第一，是皮肤有没有被感染的地方；

    第二，就是毛孔有没有被堵塞的地方；

    第三，是水分是否充足；

    第四，是脂分泌是不是合适；

    第五，是细胞的新陈代谢的情况。


    如果这五个因素全都维持良好，才有可能有吹弹可破的总体效果。


    但是，面膜只能部分地缓解第三跟第四个问题，其他几个问题都解决不了。


    # ——◈ 护肤品与皮肤 ◈——


    各国对护肤品的功能都有限制，这个限制的细节虽然有些差异，但总的原则就是：


    +   它不能是一种药品，否则就必须按药品的测试审批手续办理了，这一下就复杂就是贵了。


    如果有哪家宣传说自己的成分到达真皮层了，那这种东西只能在医疗监管不严格的地方出现，否则一定会被重罚款的。


    # ——◈ 表皮中的水分 ◈——


    我刚刚说过，面膜只能部分地起到补水分和调节皮脂的作用，这是因为，皮肤是不是有弹性是由整个皮肤决定的，这包含了表皮跟真皮，而且真皮在这里还起了绝大部分的作用。


    面膜只能影响到表皮，不能影响到真皮，所以我说只起部分作用。


    # ——◈ 面膜的全部能力 ◈——


    那么面膜补水的效果到底有多强呢？


    在2014年，中国消费者协会曾经委托中国检验检疫科学研究院化妆品技术中心对市售的26款面膜做过测试，主要从两方面来检测：


    +   第一个是安全性，就看它是不是偷加了激素类的物质，还有抗菌作用的防腐剂是不是添加了违禁的成分；

    第二个就是功效上的，功效只检测保湿这一个功能，这个也侧面说明了面膜并没有什么其他可以量化的功效。'
