    他父亲在斯отрудники得到了学士学位，之后又在芝加哥大学拿到数学博士学位，主管的方向是数论。


    等到他父亲回国的时候，杨振宁已经6岁了，第一次见到爸爸的时候，简直就是一个陌生成人，都有点害怕。


