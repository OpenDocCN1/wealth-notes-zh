    # ——◆ 少年得到发刊词 ◆——


    你好，我是卓克，欢迎你收听我的《科学思维课》。


    初次见面，我先抛出3个问题当作见面礼，请你和我一起感受一下，科学思维和普通思维的区别。


    > 你有没有想过，为什么硬币的边缘会有锯齿？


    这是大科学家牛顿发明的。牛顿曾经在英国皇家铸币局工作，他要解决英国假币泛滥这个难题。


    牛顿分析了假币的化学成分，发现绝大多数假币用的都不是劣质金属，而是跟真币一样足量的银和铜；后来，他又派警探缜密，发现原来制造假币的绝大部分金属是从真币外圈上剪下来
    的。


    于是，为了防止边缘被剪，牛顿主持铸造的新的硬币，边缘就刻上了锯齿跟花纹。


    你看，很多身边常见的事情，看起来好像是很简单的、理所当然的，其实并不简单，它的起源，是很值得深究的。有了科学思维，你不会被一件事情的表象蒙住眼睛，你会多问、多思考为什么。


    > 食人族真的存在吗？


    食人族这个词和奴隶贸易几乎是同时出现的，这可不是什么巧合。


    16世纪以后，欧洲很多书籍和报纸里都描述了大太平洋岛、南美附近小岛上有食人族。其实，这些小岛上的土著居民把带岛上抓人的欧洲殖民者也叫做“白皮肤的食人族”。因为被抓上船的土著人确实再也没回来过。


    那时的欧洲人愿意把所有奴役对象都称为食人族，这可以给他们的奴隶贸易在道德审判上松绑，所以食人族的说法就流行开来。


    你看，科学思维不光可以用在自然科学中，也可以用人类历史的研究。有了科学思维，你会对人类的文明进程、道德标准建立，有更客观、更深入的思考。


    > 你肯定听过“进化论”，“物种会往越来越复杂、越来越高级、越来越快、越来越强的方向进化”，这个对“进化论”观点的描述，是正确 的吗？


    这其实是对“进化论”的误读。


    比如240万年前，MYH16 这个基因突变，曾经让人类祖先的下颌骨肌肉变得弱鸡无力，他们咀嚼食物的能力下降了，按说这应该是一个典型的弱的特征，但在百万年中的后续影响还包括：给大脑释放了扩容的可能性，这是智力猛增的必要条件。


    正确的理解是，时间尺度拉长以后，环境在随机变化的同时筛选出了可以在对应环境下生存的物种，所以物种在进化中也是随机变化的。你可以设想一下，如果有一天，当地球环境变得对哺乳动物很致命的话，地球将会被微生物主宰。


    你看，时间刻度拉长到几百万年以上，连很多常识性的判断都不一定正确了。人类的经验积累最多能参考的时间跨度只有几千年而已，但幸好，我们有了科学思维。有计算机作为分析工具，有测量大数和收集可靠证据的方法，这样就有机会让我们超越生物个体的体验，超越历史的经验，以百千年为时间刻度，找到规律。


    其实，我们说的科学思维，就是科学家在搞科学研究时的一系列思考习惯。如今科技已经渗透进了我们生活中的每一个细节，科学家的思考习惯也不局限在科学研究中了。


    科学思维是我们每个人都应该掌握的思维方式，这些思维方式大多是违背天性的，但又会让我们 的思维更有力度。


    掌握了科学思维，在面对错综复杂的信息时，你可以快速分辨信息的真假优劣，你不仅不会被语言欺骗，还能判 断哪些信息更有价值。不管是在课堂上还是在生活中，科学思维都很
    有用。


    在这门课里，我会分4个模块：证据与起源、数学与模型、真理与谬误、科学与文化，帮你一步一步建立起科学思维。


    这4个模块的知识是层层推进的：


    +   1. 找到靠谱的证据，是科学思维的基础；

    2. 运用数学和模型的工具，可以进行演算和推论；

    3. 有了称手的工具，就 可以 分清楚什么是真理、什么是谬误；

    4. 最后还要 结合 运用，形成你自己的科学思维习惯。


    每节课后，我都会给你留1个发散性思考题和3道选择题。


    发散性思考题大都没有标准答案，你可以把你的思考放在评论区和大家讨论，你也可以在评论中看到其他同学的回答，看看同一个问题其他人的思考角度是什么样的。


    在每个模块的最后，还会有实战课。


    我会教你怎么运用科学思维去解决学习生活中遇到的实际问题。我还会对你提出一个挑战，请你动手去做一个主题研究的作业。


    好了，说了这么多，咱们今天就算是认识了，接下来的日子里，希望咱们能成为好朋友，一起讨论科学问题，探究问题背后的科学思维。


