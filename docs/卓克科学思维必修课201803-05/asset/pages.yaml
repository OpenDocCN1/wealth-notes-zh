  md: '# 213 | 遗憾：西方科学是怎么诞生的？


    # ——► 概念20：遗憾 ◄——


    中国在明清两朝曾长期和西方科学保持接触，关系有时亲密、有时疏远。有人认为当时的中国没有发展出现代科学是“遗憾”，而实际上，只是必然，没有什么遗憾。


    之前一系列的课，我们仔细讲了，自从16世纪，西方科学快速发展之后，跟中国明朝、清朝多次接触，但始终没有在中国生根发芽。


    大家可以了解到，一种新的文化，要在另一个地区稳定存在需要两个方向的支持。


    # ——► 科学的根基 ◄——


    那接下来，我要介绍一下欧洲科学是怎么诞生的。


    我们先说结论：


    科学的生产是数不清的因素和这些因素之间的影响叠加在一起涌现出来的。


    这个过程有点像混沌系统中呈现出某一状态的情况，虽然预先定亦无法说清什么是这个状态呈现出来的原因，但我还是可以肯定地说，绝对不是另几个因素才会导致这个状态出现。


    那我们来具体说科学的源头，它来自于古希腊多种哲学流派中，毕达哥拉斯和柏拉图的那么一一种。那一支思考问题的习惯是科学的根基。


    直到现在，这个根基还是可以清晰看到的，那就是：


    以数学为基础的严谨论证。


    你可能觉得，对数的运用不是自古有之吗？古印度、古中国一样也有啊。


    从道理上讲，是这样的，比如说种多大面积的地，收上来多少粮食，买卖的时候多少布匹换多少只羊，这些活动必然要求早期的类对数量有认识才行。


    如果落实在研究上的成果，就是发现了无理数。


    无理数这个名字说的就好，如果以当时的文明程度看，数学的实用之处就是用来帮助生产生活的，和真实生活相关的所有需求都可以用有理数表示出来。


    所以，类似怎么求出和一个圆面积相等的正方形的边长，或者一个正方形体积增加一倍之后，边长需要增加多少，或者是怎么把一个角度平均三等分这样的问题，只有在古希腊研究的数学中才会钻研地解决。


    其他文明中，作为实用的数学，就算遇到了类似的问题，比如说边长为1的正方形对角线是多少，只要求出个大概，1.414米就没有问题了。但是在柏拉图学园里要找出准确的表示方法，并且要证明这种方法是对的才行。


    # ——► 地理决定论 ◄——


    很巧的是在那300年的时间里，地球上处于北纬25度到35度范围里，人类文明都同时出现了突破，古希腊就是我们刚刚说的，中国出现了孔子、老子，印度出现了释迦牟尼。


    中国和印度一样有人开始深入思考，但这些思想都很严格的数学证明无关，它们都属于思辨式的哲学，都是结合着伦理道德的思考，缺乏证实的部分。


    同是古人，为什么出现了这样的差异呢？


    有一种说法更偏向于地理决定论解释的其中一部分原因。


    那就是，古希腊并不是一片完整连贯的国土，而是星罗棋布地分散在爱琴海周边的滨海城市和岛屿。生活在那里的人，本身就有很多的模式可选，做农民、做商人、做渔夫、做士兵，切换起来很方便，这也是古希腊城邦制的一个地理条件基础。


    那个时候希腊没有一个至高无上的皇权统治，要征服这些零零散散的地区，成本一定高得不可思议，所以城邦制就顺着地理形态出现了。在这种生活模式和制度下，人们的思想比较灵活。


    以航海和贸易为生的人也很多，这都增加了社会生活的皮多样性，也增加了大家对什么是规则的理解。规则建立的过程中，推理跟辩论就少不了成为日常的思考习惯。


    如果对比那个时候的中国跟印度就发现，在大河流域附近生活，一马平川的土地，那上面的社会形态相对就单一很多。


    # ——► 科学思考是奢侈的 ◄——


    设身处地想想，除了最近200年，人类历史上不直接为吃喝拉撒操心，而花大量的心思在纯理论推导跟数学计算的生活，其实属于极为奢侈的，这么生活很容易饿死，人都不在了，思想就谈不上传承下去了。


    按说这样的思考习惯和生活方式会被严酷的自然环境淘汰掉的，那古希腊为什么还有这样的思潮出现呢？


    其实跟他们的奴隶制是分不开的。


    现在我们说起古希腊，民主跟科学是最常被提っても的，有的时候会让人误以为那个时候的社会像一个天堂。


    其实，希腊城邦中占人口数量一半以上的都是奴隶，那些社会上层的学者之所以生活得很从容，可以自由地思考大自然的道理，是因为有奴隶的劳动作保证。


    所以，古希腊的科学家思考中也养成了轻视劳动，轻视生产力的习惯。他们过度依赖纯粹的理性思考，不存在什么压力迫使他们一定要把实用价值跟理性思考结合起来。


    从这一点看，要维持理性的科学思考习惯，需要的条件其实苛刻的。


    所以科学这种文化思想，在2000多年并不能待在唯典稳定不动的，而是像游击队一样，小股力量不断地转移阵地，哪里条件满足了就在哪里搭上一脚子。


    在罗马帝国把基督教奉为国教之前，它曾经在爱奥尼亚搬家到意大利的南部；

    200多年后又转移到雅典；

    之后又因为亚历山大帝的支持，集中在了亚历山大城。


    罗马帝国统治之后，贵族那祇注重奢华跟实用性的生活和基督教对人们精神的束缚都是不利于科学思想生长的，所以从公元300年之后的1200年时间里，科学思想又转移到了巴格达和阿拉伯的一些地区。


    这段时间，之前我们在课上提过，就是阿拉伯文明保留了科学的火种。


    就算是在文艺复兴之后，科学思想又回到了欧洲，在那400多年的时间里，也经历了4次的大转移。


    # ——► 科学壮大的条件 ◄——


    至于什么样的社会环境能让科学思想活下去，这是没有标准答案的。


    但有一点可以肯定，多样性是早期科学能生存下来的必要条件。


    比如17世纪，西方科学到了中国，如果北京、南京都容不下它，其实很大程度上已经说明，中国大部分地区也很难容下这种新文化。


    科学需要的这种苛刻的条件，不只体现在外部资源上，就算是再内部传播的过程中，一篇科学著作是只能依靠精确的文字记录才能传播下去的，其中层层递进的逻辑推理跟复杂的数学运算，靠口口相传是不可能的。


    早期的科学思想想存活下来很艰难，跟它脱离实际有很大关系。见不到眼前的利益，白白浪费时间精力，在生命史上都会马上被淘汰出局，所以科学之前存留，大多是依靠王室的赞助。


    真正的现代科学是从哥白尼、伽利略开始算的，和早期的科学相比，它发生了一个大转折。


    这个转折通俗地说，就是之后的科学家认为，可以用数学原理解释看到的一切运动现象。


    除了天文以外，更包括了可以解释炮弹的飞行，可以解释热量的散发，可以解释河水的流动，可以解释金属的锻造，等等等等。


    这一点，在古希腊的科学中是没有出现过的。也正是这个转变，让科学思想可以自己给自己造血，它不再是一个只消耗不产出的文化了。'
