  md: '钻心的疼痛出现了，本来应该是由内啡肽刺激多巴胺来缓解的，但是现在，内原性的跟外源性的内啡肽都没有了，所以这种钻心的疼痛就不会消失了，会一直保持着高强度的疼痛。


    而且情况还会比这个糟很多，因为这种疼痛不是发生在叫根手指上，而是发生在全身所有分布了神经的位置上，甚至包括内脏。


    如果一定要在现实中找一个例子，那就像是一个人浑身骨折了之后，还在不断地挪动身体，与此同时，正在经历分娩、阑尾炎跟牙神经痛。


    除了吗啡这一类毒品，常见的毒品还有可卡因、冰毒，它们都是通过不同方式劫持人脑的奖赏机制，比如正常情况下多巴胺会在分泌出来10几分钟之后被回收，那种幸福的感觉让人们浅尝辄止就好，但是：


    +   可卡因会抑制多巴胺的回收，让浓度不断地积累；

    冰毒是刺激更多的多巴胺释放。


    戒毒的药物也是利用这些原理设计出来的，会逐渐让神经摆脱被劫持的状态，所以在生理基础上戒毒并不难。


    难就难在生活模式上的依赖，在戒毒所工作的人，从他20年的工作经验介绍：


    +   凡是吸食了海洛因的人，就没有见过不复吸的，即便是那些已经10年没有复吸的人也没有正常地生活。


    因为他们在这10年里，几乎所有的注意力都花在了如何抵抗海洛因的诱惑上。


    像那些情侣中有一个出现吸毒，另一个要用生命来拯救另一半的感天动地的爱情故事，那也只是瞬间，最后的结果都是两个人一起进了戒毒所。


    因为海洛因已经不是现代社会的合法药品了，凡是可以拿到手的人，他的生活里一定存在那么一部分是不能公开说的内容，或者是不能公开的朋友。这些朋友只可能比他陷得更深。他能成天跟这样的人混在一起，他的家庭和工作也一定都存在某些巨大的阻力，把他从正常的路径上推得越来越远。等到化学物质的劫持出现之后，那更是雪上加霜。


    之后经过了700多天的戒毒，虽然生理上的毒瘾远了，但他们的生活模式离普通人也更远。生活中唯一一个可以通过努力就能获得成就感的活动只有吸毒，其他的活动获得成就感的门槛太高了。这就好像我们玩游戏，已经玩惯了作弊模式，那就很难再回到艰辛打怪的模式上了。


    # —— 今日内容小结 ——


    开头我们就说过，这节课并不是单纯地劝人们远离毒品，我们把毒瘾是怎么产生的说清楚了，你也能多少对其他活动产生的奖励有所了解。


    我们绝大多数人一辈子都不会碰毒品，但我们的人生成就系统还是千差万别的：


    +   有人是通过阅读跟写作得到快感；

    有人是通过挣钱消费获得的成就感；

    有人是通过玩网络游戏，升级换装备获得快感。


    有这样的规律，就是


    毒品从头到尾都是别人设计好的，你只要吸就可以了，那这样的收获甚至是有害的。


    游戏的付费、升级系统大部分也是已经设计好的，其实也算是对人脑奖励系统的一种弱绑架，害处不一定会有，但是益处也不大。


    像挣钱消费，可就不一定有什么一定之规了，否则人人都可是亿万富翁了。所以挣钱消费获得的成就感更有价值，但是它仍然收到了各种不合理规则的束缚。


    所以，相比之下，阅读跟写作获得的成就感价值要比前三种高得多得多。


    # —— 今日思考题 ——


    收获的路径各不同，那一个人怎么才能够把自己的行为模式调整到收获更高价值的道路上呢？怎么才能少受一些绑架呢？


