  md: '# 242 | 反省：面包抹了黄油那一面更容易着地？


    242 | 反省：面包抹了黄油那一...


    # ——► 概念24: 反省 ◄——


    科学是有力的，但内部也有各种问题，这些问题往往还是科学家们自我反思时公之于众的，甚至有科学家会把这些问题当做课题来研究。这让科学看上去没有那么完美，但这正是科学不断自我否定与完善的过程。


    上节课我留的问题是：


    你认为是什么动力让搞笑诺贝尔奖持续办了27年呢？


    这其实并不是一个可以凭空猜回答案的问题，它需要查一查才知道。


    最早是在1955年的时候，两个以色列的科学家，一个是物理学家，一个是病毒学家，创办了一份期刊，叫《不可复制的研究》，这个期刊并不是学术研究的风格，而是专门收集了一大堆抓眼球的研究趣闻，办了30多年，销量一直比较惨淡。


    # ——► 墨菲法则 ◄——


    那对于参加的科学家来说，他也是收获一种圈内的认可，大家认可你做了一件貌似好笑，但实际上发人深省的研究。


    发人深省都体现在哪呢？


    比如说1996年的搞笑诺贝尔奖，颁给了罗伯特·马修斯，这个人是英国阿斯顿大学的物理学教授，同时也是皇家天文学会会员和皇家统计协会会员。


    他当时研究的主 Snowball 是：

    抹了黄油的面包如果掉落的话，通常是抹了黄油的那一面着地，这个规律基本上体现了墨菲法则。


    听上去这个研究真是无厘头，但是罗伯特用科学方法，对面包抹了黄油之后怎么掉落作了分析。这个问题里的墨菲法则，其实对欧美人来说体会会很深，这种熟悉的感觉有点像咱聊脱口而出：

    俗话说得好，“祸不双至，福不单行”那种的感觉。


    # 墨菲法则说的是：


    如果一件事情可能出错，那一定会出错。


    这个法则对应西方的一句俗语，是从诗里说的，那句诗说的是：

    面包落地的时候，总是黄油的一面着地。


    # ——► 用物理公式去分析 ◄——


    罗伯特当时就质疑这个说法，他初步用数学方法分析了一下，一片面包大约35克，抹上去的黄油大约也只有4克，而且是薄薄的一层抹上去的，还有一些甚至会渗到面包里面。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_176_0.png)


    经过一系列的计算，罗伯特给出的结论甚至有一些开悟的味道。


    他是这么写的：

    由于宇宙中某些基本常数已经确定了，所有东西也注定会经历类似面包落在地上，黄油那面朝下的事情，也会经历墨菲定律。就算是有两种方法，能让抹黄油的那一面朝上的几率大一些，这两种方法也是通过计算找出的技巧，而上帝在这件事情里的影响远远小于这些技巧背后的物理规律。


    # ——► 什么是唯科学论？ ◄——


    那么我们看了这样的研究，应该如何评价这样...'
