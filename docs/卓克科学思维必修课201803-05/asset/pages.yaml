  md: '# 175 | 成瘾：网游对青少年大脑真的有害吗？


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_22_0.png)


    # ——► 概念16：成瘾 ◄——


    生物大脑中的奖赏机制制造了个快乐的行为模式和记忆，形成了兴奋与美好，当对这个快乐产生习惯性或依赖性，即为“成瘾”。如果化学物质对人的影响的了解，就会出现，主观意识能够把控制的疆域并不很大。


    网络游戏在2002年开始火爆的时候，不少年轻人深入其中，几年之后就出现了“网瘾”这个词，甚至有人用电击太阳穴跟手指头的方法治疗青少年的网瘾。


    但最近几年，又没人讨论了，因为网络游戏已经深入到每个人的生活里，如果整体人群中有1/3以上的人都喜欢玩网络的话，讨论网瘾的意义就不高了。


    因为总不能给几亿人都扣上一顶帽子，说大家都是网瘾患者吧？


    这一节课，我们从科学的角度谈谈网络游戏带来的网瘾，看看找到的生物证据是什么样的，也看看精神病学中网瘾跟其他的瘾有什么区别。这样有助于我们全面了解网络游戏给人们带来的副作用到底有多大。


    # ——► 吸毒不成瘾的人 ◄——


    首先，我们默认一个事实，就是网络游戏的成瘾性是低于海洛因、可卡因、病毒这些毒品的，否则全世界是不可能有合法运营的网游的。


    那我们再来看看海洛因跟冰毒的成瘾性有多严重，听说上节课的同学知道，海洛因因为是拜尔药业在1897年推向市场的，到了希特勒上台的1933年才被全面禁止，这中间卖了30多年，任何人都可以轻松地买到。


    所以，如果海洛因是一种用一两次就会劫持整个人的药物的话，那德国这个国家早就灭亡了。


    还有一些案例现在可以拿来研究，比如像二战期间，为了提升士兵的战斗力，不论是德军还是美军，都在给士兵发放“甲基苯丙胺”的药物，其实这种药今天叫冰毒。吃了它，士兵就能整夜地行军，不闭睡觉，不知道疲惫。


    这样普遍地使用，这说应该带来或严重了社会问题，但实际上，两国战后都是飞速发展。


    那个年代的药物管制不是很严格，所以数据并不完整。


    比较完整的，成建制的服用冰毒的统计，是美军在越战的时候留下来的记录。


    波兰的政治学者卢卡什·卡明斯基在《嗜药：药物与战争简史》里面评价说：


    > 越南战争是美国第一场真正的药物战争，美国国防部估计，1968年第一批派驻越南的美军有一半服用过毒品，1970年这个比例就已经上升到60%了，1973年美军撤军的时候，已经有70%的士兵服用过毒品。一个士兵的医疗包标配就是24片含可待因的止疼药跟6丸冰毒。


    那个时候美国政府给在越南执行侦察跟踪任务的士兵发放冰毒，虽然有一个量上的限制，就是8小时内不能使用超过20mg，但实际 上执行得根本不到位，因为剂量维持不变的时候，效果会逐渐地减弱。


    所以，后来几乎人人都在过量地使用，有些人一天的用量就达到了100mg。从1966年到1969年，美军一共使用了超过2亿片的神经类药物，它们大都是冰毒跟冰毒的衍生品。


    # ——► 老鼠乐园实验 ◄——


    1979年的时候，加拿大西蒙弗雷泽大学的心理学家设计了一套著名的实验，叫做老鼠乐园。


    有两群老鼠分别养在不同的场所里：


    +   a 场所特别狭窄，里面只有普通的饲料跟加了吗啡的水，我们管它叫做“笼子”；

    b 场所的面积是 a 场所的200倍，各种条件特别好，不但采光好，温度合适，还提供新鲜的食材，还有玩具可玩儿，甚至还设置了交配的隐秘空间。但是呢，提供 了两种，一种是普通的水，一种是含吗啡的水，我们把
    b 场所叫做“乐园”。


    然后就把4组一样大的老鼠放进去养。


    这些含有吗啡的水都是加了糖的，因为吗啡直接溶于水是特别苦的，最初老鼠根本不会喝，只有加了糖才会引诱它们喝。'
