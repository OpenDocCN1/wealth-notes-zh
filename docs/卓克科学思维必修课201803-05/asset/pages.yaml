    # ——▶ 本周课程复习 ◀——


    # 概念15：泡沫


    一项新的科研成果出现，总会引发很多人的热情，有些人是为了科学欢呼，有些人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    +   1. 不轻信任何结论，也不轻易地否定，是一种科学思维方式。如果我们一定要对某个论断表达态度，那我们先不急于说，而是先把陌生词汇查清楚，再看这个论断是否说得通。
    2. 科里奥利力，是一种假想力，是在旋转的运动体系中，物体在进行直线运动时因为转动产生的位移偏差。 3. 科里奥利力只有在类似洋流、气流、云层、大江大河的观察尺度上才能体现出来。


    +   1. 潜意识营销，从1957年爆发传播开始就是一个骗局，后续的各种变种潜意识营销手段也就都没什么价值。 2. 心理学已经更加科学化，优秀的心理学期刊，会要求论文中的结论至少要有4个或更多的重复性实验支撑。


    +   1. 因为科技的发达，大规模工业化生产出的产品，严格的标准和监管保证着产品的 一致性和可靠性，是值得信赖的。 2. 利用核辐射进行杀菌从1930年起就已经有了成熟的规范，主要用于传统杀菌手段效果不好的地方。而且相比传统的高温杀菌手段，它能更好地保证食物原本的风味。


    # 概念16：成瘾


    生物大脑中的奖励机制塑造了个体的行为模式和性格，形成了兴趣与爱好，当对这种奖励产生习惯性或依赖性，即为“成瘾”。加深“化学物质对人的影响”的了解，就会发现，主观意识能够把控的疆域并不是很大。


    +   1. 人的主观意愿、各种念头、欲望、喜好，很大程度上被身体中的化学物质所控制。 2. 多巴胺会加速神经元之间的沟通效率，在宏观上的感受就是“爽”。
    3. 多巴胺是一种“生物做对了某些事情”情况下的“奖励”。 4. 毒品刺激多巴胺的释放或者抑制它的回收，降低了生物获得奖励的门槛。 5. 以海洛因为例，想要获得持续性的奖励，就需要持续增加毒品摄入剂量，它破坏了奖励机制，一旦停止，就会导致全身的极端疼痛。


    # 答疑时间


    +   1. 痛风，是血液中的尿酸浓度过高，在关节处形成结晶引发的炎症反应。 2. 尿酸是人体在代谢嘌呤的产物，我们吃进来的食物只要含有嘌呤，含有遗传物质，就一定会产生嘌呤。
    3. 严格控制饮食，最多也只能降低15%的尿酸，因此，痛风患者需要配合药物，并锻炼身体、规律作息。 4. 痛风在当前的医学发达程度上，是不可治愈的，一切宣称可以根治痛风的人都是骗子。
    5. 高尿酸在几百万年前，是让人类活下来的一种救命的能力。


    +   1. 食用油的主要成分是脂肪酸，一般纯度在99.5%以上。 2. 食用油中的脂肪酸有三种：单不饱和脂肪酸、多不饱和脂肪酸、饱和脂肪酸。 3. 单不饱和脂肪酸会清除体内一些坏的胆固醇，而饱和脂肪酸会积累一些坏的胆固醇。
    4. 饱和脂肪含量低，同时单不饱和脂肪酸含量高，是特别好的选择，满足条件的是：菜籽油、芝麻油、橄榄油。 5. 饱和脂肪含量高的油：动物油、椰子油、棕榈油。


