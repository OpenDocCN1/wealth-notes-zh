  md: '之所以哥白尼、伽利略、开普勒、牛顿都参考这本书，是因为在这册里已经使用了比较成熟的三角学的知识来讨论宇宙中星体的位置。


    但就算是托勒密也不是自己开创的这一切，《至大论》这本书中，三角学的部分是源于更早的古希腊数学家梅内劳斯做出来的。


    在《至大论》这本书中，使用的星表一共是1022颗恒星，怎么标注的呢？


    就是用经纬度来标注位置，用星等来标注亮度，而这套方法也不是托勒密自己发明的，是比他早了300年的古希腊天文学家希帕克罗斯作出的规范。托勒密只是延续了这种方法，只是站在了那位科学家的肩膀上。


    # ——• 社会大背景条件 •——


    除了科学体系内的成果可以不用重复，还有就是整个社会大背景下给科学家提供的便利条件，让他们可以顺利地迈过很多凭个人是无法做到的事情。


    比如像牛顿，一辈子80多年，基本就没离开过林肯郡、剑桥和伦敦，他一辈子连大海都没有见过。


    尽管我们怎么形容他研究的孤独与艰深都不为过，但是他还是在研究中，和一个更庞大的全球化的网络接通，他能了解到当时的潮汐、水位，世界各地挂钟的长度，摆的周期，各个地方彗星的位置。而这些实测数据，就是支撑他发现万有引力的那些证据。


    这些信息要传到剑桥，只有通过贸易公司，还有世界各地的传教士，还有跟欧洲大陆的天文学家通信，才能得到。所以离开了英国的商业革命跟全球贸易网络，牛顿那本《自然哲学的数学原理》也还是出不来的。


    连这种纯数学的内容都强烈地依赖于社会大背景，那就更不要提达尔文《物种起源》那本书，那种必须依靠生物的证据才能写出来的内容了。


    说到这一步，我们甚至都找不到某一个科学家或者某个成果之所以诞生，到底是站在谁的肩膀上了，如果非要说，那可能站在了无数人的肩膀上，是站在了有积累特性的那种文明的肩膀上。


    # ——• 课程小结 •——


    所以听完这节课，我们多少要破除一些对科学家的个人崇拜。


    他们的伟大当然是超乎常人的，他们的苦行僧一样的研究，他们的自我否定，当然是令人惊讶。


    但我们了解到他的伟大中除了他个人的成分，更多的部分是历史上伟大的积累。


    像这种看世界的方法不光是可以用在某一个科学家身上，也可以用在诺贝尔奖这些科学的成就上。


    # ——• 课后思考题 •——


    在科学领域之外，也有很多的名 Sinaloa 明星、影星、歌星，那么对于他们的广为人知，或者就称为是成就吧，你是怎么看的呢？


    如果你有什么想法就留在评论中。


    # 划重点


    +   1. 不论什么时代的科学家，他们的成就都是在他们生活的那个时代已有的知识基础 Legge 出的突破得到的，每一位科学家，都站在巨人的肩膀上。 2.
    科学成果是可积累的，后辈科学家可以不用再重复前人的工作，同时，科学文化化的兴起，强烈依赖社会大背景提供的便利条件。


