  md: '这些观点曾经影响过欧美很多研究这个领域的人。在上世纪70年代之前，也可以说中国科学水平在文艺复兴之前是超过西方的，这个观点是没有太多反对声音的。


    但随着后来，这个研究领域参与的人越来越多，《中国科技史》虽然是鸿篇巨作，但学术界在这一点上的质疑也已经足够强大了，大到不再有人认可这样的评说。


    # ——► 客观评价 ◄——


    客观地说，作为科学的根，数学在中国古代也不是没有，但关键是古代中国人学数时，使用数字的目的不是为了了解数的性质，始终没有出现一批人用数学作严格的证明，这种思考课不在中国的传统文化里。


    中国古代，也不是不探究自然规律，但关键是，古代中国人在探究自然的过程中，不使用数学做工具。


    其实天文学是一个很好的把数与现实结合的切入点，但是古代中国最终也只是选择用阴阳五行，相生相克，互相变化的方式去理解星象，最终落脚点依然不是数学。


    所以，关于中国古代科学比较客观的评论，我们可以参考爱因斯坦在1953年写给斯威策的信。


    爱因斯坦是这么写的：


    西方科学的发展是以两个伟大成就为基础的，那就是希腊哲学家发明的形式逻辑体系，也即是指欧几里得几何，以及通过系统的实验，发现有可能找出因果关系，这是文艺复兴时出现的。在我看来，中国的
    Descartes 没有走上这两步，那是不用奇怪的，这些发现在中国如果全部做出来了，那倒会令人惊奇的。


    # ——► 今日内容小结 ◄——


    这一系列一共16节课，我们从大学科学学院是怎么诞生的，又兼取了明末期到清朝初期，中国文化第一次跟西方科学的接触，后来又梳理了西方科学的诞生，尤其是对比在同一时间里，东方、西方在科学上都做了什么，相信大家已经对科学的来历有了大致的了解。


    这节课最后，我想把笛卡尔关于科学思维的两句话重复一次：


    凡是我没有明确认识到的东西，我绝不把它当成真的接受。也就是说，要小心避免轻率的判断与先入之见，除了清楚分明地显现在我心里，使我无法怀疑的事情除外，不要多放一点东西在我的判断里。


    在任何情况下，都要尽可能全面地考察，尽量普遍地复写，做到确信无疑。


    # ——► 今日思考题 ◄——


    在2016年4月发布的中国公民科学素养基准中有这么一句话，知道阴阳五行、天人合一、格物致知等中国传统哲学思想观念，它们是中国古代朴素的唯物论和整体系统的方法论，并具有现实意义。你是怎么看待这句话的呢？


    如果你有什么想法就留在评论中。


    # 划重点


    +   1. 科学结论的得出，要经受最有力的质疑与最严格的考证，过程缓慢，但一旦成为“定论”，就极稳固，让后人可以在前人的基础上持续积累。\n2. 科学结论，会随着研究的深入有所调整，需要随时校实与订正。\n3.
    科学思想诞生于脱离实际的，用数和几何解释世界的迁移，除了古希腊文明，其他文明都没有出现。\n4. 李约瑟提出的“中国科学是在文艺复兴后被西方反超”观点，在学术界已经普遍不再认可，我们要避免被情感因素左右。


