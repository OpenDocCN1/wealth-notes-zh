    科学是有力的，但内部也有各种问题，这些问题往往还是科学家们自我反省时公之于众的，甚至有科学家会把这些问题当做课题来研究。这让科学看上去没有那么完美，但正是科学不断自我否定与完善的过程。


    上节课最后，我提出了一个问题：


    你认为物理学家可以在文史哲类的学术期刊里发表研究论文吗？


    这个答案是，可以，而且还有一出闹剧。


    这个闹剧，甚至还被许为了1996年的搞笑诺贝尔文学奖。


    # ——► 物理学家的恶作剧 ◄——


    两年前，他给文科类的期刊叫《社会文本》投了一篇稿子，其实现在是属于跨界，题目叫“跨越边界：走向量子引力的转换解释学”。


    这篇文章大概的意思是说：


    他梳理了20世纪末人们在思想中发生的一些转变，经过仔细研究，就觉得思想上的这些转变，如果从一个物理学家的角度上看去，有些转变跟量子理论，跟引力之前研究是吻合的。


    # ——► 科学不是什么？ ◄——


    索卡尔后来在《通用语》里是这样提供的，他说：这样一篇恶搞的文章，杂志社的编辑不仅没有意识到，反而还给予了很高的评价。


    这一 下好像形成了一个态势，一个物理学家把一群后现代主义的研究者挑落马下。


    # ——► 知识骗局 ◄——


    索卡尔这前后两篇文章影响巨大，后来他跟他的同事还出版了一本书，叫《知识骗局》，更加系统地梳理了法国现代思想家的言论中那些不靠谱的地方，这次更是把这些所谓的思想家捉得体无完肤。


    这本书的目的，就是要揭露法国现代思想家对科学概念跟专业术语的反复滥用。


    这种滥用体现在两点：


    +   - 第一，就是没有任何事先的说明，将科学概念从专业语境中完全剥离开来使用。\n- 第二，使用了科学专业词汇之后，对当前这个科学概念就再也不理了，列出的这个词纯粹就是为了向没有专业知识的读者罗列再罗列。'
