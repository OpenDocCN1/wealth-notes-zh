  md: '# 198 | 问答：充电宝的电为什么那么虚？


    有同学问，充电宝给手机充电，感觉电很虚，这是怎么回事呢？


    简单回答：


    这个大都是在测量环节出了问题。


    前面，我给大家仔细说过一个系列，国际单位制的由来，其中一个重要的观念就是测量的极限就是存在的极限。我们一个人可以时刻意识到测的是什么东西的话，那这个人其实就已经有很高的科学素养了。


    比如像电量很虚，它表现的是什么样呢？


    就是一个移动电源有5个 LED 灯来表示电量多少，那么自然，一个灯就代表20%的电量，用它充手机，结果1个小时之后，5个灯亮变成4个灯亮，于是我们就判断，还剩80%的电量，然后就继续给手机充电，结果后来又充了1个小时，充电宝就没电自动关机了。之后，我们就得出结论，这个电太虚了。


    其实并不是因为什么电虚，而是因为测量不准确。


    # —— ◆ 测准电量比较难 ◆ ——


    那么电量又是 frågor怎么测的呢？


    其实电量的剩余百分比的测量是一个比较难的事，因为你得知道，这个电池一共能容纳多少电量，然后还得知道，自从上次充满之后又放出了多少电量，剩下的才是剩余电量。


    第一个量就是电池一共能容纳多少，它竟然不是一个固定值。


    # —— ◆ 测量的价值 ◆ ——


    这个问题说得这么仔細，其实也是一个很好的例子。


    就是说一个东西如果可以测量，并且可以用单位表示出来，那我们才算真正知道这个东西的存在了，才有可能了解它。


    文学艺术这些咱暂且不提，我们把测量这个活动稍微拓展一下，就是跟每个人息息相关的：


    比如像血液中的酒精含量，它就影响着一个人是要拘留半天，还是扣12分，还是放行。'
