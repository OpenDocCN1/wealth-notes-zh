  md: '# 165 | 泡沫：牙膏真的能防蛀、美白、脱敏吗？


    # ——►概念15: 泡沫 ◄——


    一项新的科研成果出现，总会引发很多人的热情，有些人是为了科学欢呼，有些人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    技术含量高的行业容易出现泡沫，因为这里有很多可以忽悠人的点，比如最近两年的区块链。


    技术含量低的行业一样有泡沫，比如这一节课我们说的牙膏。


    可以说近30年来，这个行业在技术上没有什么是新的突破，但宣传中却是花样百出。


    牙膏的基本特点有坚固、美白、防蛀，高级一些的特点有防出血、脱敏。甚至说自己的牙膏不含氟。


    这些泡沫一样的宣传怎么识别？


    好像很难，因为每一个功能好像都是一项新出现的技术在背后提供的保障，那要都查明白，感觉好像是把牙膏行业的发展史都都了解得透彻才行啊。


    其实，要识别泡沫，大都是靠其它更为基础的知识来识别出来的。


    就拿牙膏来说，不管它怎么宣传，出现多么稀奇古怪的特点，我们只要知道这一条基础知识：


    +   只要是你发现牙齿出现了问题，几乎只能找牙医解决，没有其它更好的办法。

    所有偏方，自我治疗、牙线、牙膏、优化、清洁、美容的工具都没有用。


    具体来说，牙膏这些特点哪个是实打实有用的呢？


    其实只有一个：


    +   就是让牙齿坚固，它是通过含氟来实现的。


    # ——► 牙膏一定要含“氟” ◄——


    最早膏状的牙膏是随着工业革命出现的，那个时候用的材料是最常见的一种石头，叫碳酸钙。


    直到今天，碳酸钙还是牙膏的最主要的材料，它起到研磨的作用，牙膏靠着碳酸钙，可以把牙齿表面上的脏东西蹭下来。因为是膏状物，所以比古埃及以来一直用的粉状物更能在刷牙的时候附着在牙面上，所以刷牙的效果更好。


    这种只靠碳酸钙做成的牙膏大概卖了100年左右，到了1945年，世界上第一款含氟的牙膏上市了，佳洁士这款含氟的牙膏到现在依然非常畅销，当时牙膏里加氟化物是美国针对过去几十年来对蛀齿的研究，他们发现：


    +   氟化物跟牙面接触之后，氟离子会取代原来牙齿表面上的氢氧根离子，牙齿表面的成分会从磷灰石变成氟磷灰石。而氟磷灰石比人类牙齿表面本来的成分更耐磨，更耐腐蚀，从前能慢慢溶解牙齿表面的牙菌斑，现在也很消融掉用氟处理过的牙面了，所以加氟是有好处的。


    # ——► 牙膏的其他功效 ◄——


    我们来换个说说：


    首先是无氟牙膏，那这就属于是1945年之前的配方了，科技含量极低。


    美白效果呢？'
