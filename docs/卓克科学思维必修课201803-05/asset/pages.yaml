  md: '# 222 | 问答：怎么找到好答案？


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_132_0.png)


    222 | 问答：怎么找到好答案？


    上次答疑，我说的是怎么问问题，不要问那些搜索引擎中可以找到答案的问题，其实仅就这一条，已经可以消灭99%以上的问了。


    查不到的问题大都是这种类型的，就是问一个人关于某一个事件他自己的观点，尤其是主观上的判断。


    这些你也可以想倒，但搜索引擎里是找不到答案的，而这些问题一旦被真回答后，也是所有旁观者很爱听的。


    但那次答疑之后，还有很多人再问，说我是想搜，可是总搜不到答案。


    那这次答疑，我来讲讲怎么找到答案。


    # ——► 选择搜索引擎 ◄——


    对于搜不到答案这个苦恼来说，有好几个原因，比如最大的原因就是搜索引擎为了盈利，故意地更改结果。


    举例来说，我们在那个知名的搜索引擎里，如果搜很多公司的正式名称，你想访问他们的官网，结果列表里前几条竟然都是通过广告投放排上去的。而且这些广告的公司也会故意地伪装成你想要的那个公司的官网的样子，所有的样式都一样，来误导人，很多
    人就是这么掉进坑里的。


    可你说，那家搜索引擎的公司会对这种极为普遍的骗子做法一无所知吗？


    当然不会，他们当然知道，只是因为这么做虽然顶了作恶的骂名，但是从盈利的角度看，还是利益最大化的选择。


    面对这种情况，我们就只能换其他的搜索引擎，你可以试试搜狗，虽然大家都知道哪个才是最好 的，不过很多人是用不了的。


    那如果单从网页的搜索结果来说，必应的搜索是比较好的替代品。


    我们刚刚说的搜狗也值得一用，原因是它还提供了微信文章的搜索跟知乎帖子的搜索。


    如果我们把信息呈现的形式用形状来比喻的话：


    +   网页搜出来的信息，大都是 A4 纸的样子，扁片的；

    微信搜出来的就不一样，也许是礼品盒的样子；

    知乎上搜出来的结果，也许就是业态的。


    那同样一个关键词，你搜出来的信息外形都不一样，那么这种多样化的结果就能提供你全方面了解这个信息 的机会，而且还能在一个搜索引擎里实现，那当然是很好的了。


    # ——► 搜索引擎使用技巧 ◄——


    刚刚我谈过用用什么搜索引擎的问题，那下面我们仅就一个搜索引擎来说，也是有很多技巧可以注意的。


    现在大部分的搜索引擎不只是能搜 HTTP 类型的网页，至少还会有像新闻类的、问答类的、文库类的、视频类的等等。


    我知道，很少人注意选择这些搜索标签，但是这些标签实际上也在提供给我们不同形状的信息，只不过这时候的信息样式的差距不像我刚 刚说的那么巨大，这时候标签上的差距给人的感觉好像就是，大家虽然都是
    A4 纸的底子，但是有的是长形的，有的是圆形的，有的是三角形的，就是这个程度的区别了。


    如果你在搜索的时候框选一下这些子类，也能得到更全面的答案。


    比如说你关心癌症最近的进展情况，当你直接搜“癌症的最新进展”这7个关键字的时候，在搜索栏默认的情况下，几乎搜出来的东西全部都没有用。


    因为你想，就算是1999年做出来的癌症研究的突破，19年前发这个新闻的时候，也一样会用“最新进展”这4个字。所以你如果要在页面的选项中这么搜，搜出来的结果，1999年的新进展也有，2010年的新进展也有。


    可是要知道，2017年 CAR-T 免疫疗法是癌症治疗的一个大突破，还进入了一个新的领域。那现在看来，从免疫这一路继续往前走不远，人类就可以彻底地治愈90%以上的癌症了。所以用这种老旧的搜索方式找到的2016年以前的结果，对你来说都是毫无价值的。


    那正确的应该怎么做呢？


    就是你应该先选中“新闻”那一项，然后搜“癌症”两个字就够了，根本就不用加最新进展，因为它是按照新闻出现的顺序排序的。


    这样搜还有一个好处，因为在这个子里搜索是没有广告位的，搜索结果完全按照算法来排。如果留意的话，子类的标签还有“文库”和“学术”，用这些标签搜出来的结果相对更详细一些。


    不过以百度为例，实际上“页面”搜出来的结果本身就包含了大量文库的结果，所以你单独搜“文库”用处也不是很大。你如果真的想深入了解的话，不如干脆访问百度文库的主页面，在文库的搜索中专门去找。


    “学术”的那个标签本来应该做到更专业、更学术，但是比较可惜的是，结果往往比较糟。


    这个并不是因为搜索引擎做得不好，它也只是从学术期刊的数据库里抓，只要你曾做过研究，你就会感受到，中文的论文质量是很不好的。


    按照一般的搜索规律，10个结果列表的标题中，有一个可能是你要的，但是你至少要分出10几个你要的，才能从里面找出一个对你是有 些用处的。所以“学术”这个标签虽然有，但现阶段也只是做到功能上准备好了，具体的素材内容什么时候能准备好，这还要等待整个中国科学与文化的茁壮发展之后，学术搜索功能才会对我们有实质性的帮助。


    如果你在国外，或者自贸区之类的地方可以方便地上谷歌，谷歌的学术搜索就不存在这个问题。


    我是习惯在浏览器中装插件，然后用插件里的谷歌搜索直接搜，因为快捷键比较方便。虽然那个插件的界面比浏览器的窗口要小很多，但经常前几个自动显示出来的结果对我就已经很有用了。


    当然，如果在浏览器的页面中打开还有更多的信息，虽然很多的论文直接看不到原文，但是谷歌学术上总会提供好几个版本，大部分情况下我们也不用关心版权的問題，你就挨个翻，几乎至少有一个是可以看的。


    那你说我看不懂英文怎么办呢？


    那就先把摘要用翻译软件给翻一遍，然后对照章节的标题，找你最关心的关键词的那部分。往往你需要的那个知识点，也就是几百字的文字量，你本身就关心这个问题，你是不可能对这一段的英文100%完全陌生的。

    所以英语再差，只要有大学英语的水品，借着翻译软件，也总能看懂了。我们普通人就是可以用这种方法，从论文中找 到新知识。


    另外像微信、微博、优酷、知乎，或者知乎的那个原型 Quora，还有很多公开课的平台也都有搜索功能，因为那里的信息和网页中的结构和表达方式完全不同。所以一个问题你要在
    4、5个不同的平台都搜一搜，得到的收获就更多。


    这里我要尤其说一说视频，当你对一个过程始终不理解的时候，往往是因缺乏图像化的描述，尤其是动态的图像化描述。所以针对这个理解的盲区，我们也可以善用 YouTube，其实用有助于你理解的那幅动态图景，即便有一大段的英语，一般也不会阻碍你弄懂。


    可能有些人还是对英文敬而远之，其实有助于你理解的核心是那幅动态的场景，英语一般不会阻碍你弄懂。


    更有甚者，YouTube 在有些视频下提供了机器识别的字幕，这个字幕是相当准确的，嘣怕是有很重的口音都可以识别准确。这个时候针对于你非常关心、非得要弄懂的知识盲区来说，我想所有的客观条件都已经具备了，能不能弄懂，就看自己
    的努力了。


    我想对大多数人来说，把以上几个技巧都用上，并不需要额外地先学得什么高 级的能力，都是可以直接、立刻、马上提高搜索结果的质量的。


    希望这些回答能对你搜索问题的答案有所帮助。


    # ■ 划重点


    1.用好搜索引擎，不仅仅是搜索网页，还有微信、微博、文库、学术、知乎、Quora、视频、论文库等形式的结果，就能得到绝大多数问题的答案。

    3.不要因为畏惧英文而失去找到正确答案的机会，除了可以利用在线翻译，通过视频、图像资料也可以跨过英文障碍。'
