  md: '# 229 | 平凡：天文历法是为农耕服务的吗？


    229 | 平凡：天文历法是为农...


    # ——►概念22：平凡◄——


    在现代科学方面，中国用了150年的时间追上了西方500年的进展。所以当代的中国人难免对科技发展的速度有所高估，把科学当作无他伟大正确的事物。而实际上这是一种偏见，科学没有大家想象的那么完美。客观公正的评价科学，也是一种科学精神。


    这节课我们继续说一说人们出于情感因素，愿意把科学形象变得更加伟大跟正确的问题。


    这种情感很容易让我们盲目自信，比如我见到很多爱抬扛的人，根据接受不了人文方式的思考。


    同时，更有一部分人对科学是持反对态度的，他们常用的一个句子，就是：


    > 科学不能解释所有的东西。


    # ——►天文历法与农耕◄——


    我们从天文学的角度，说说这样的误读是怎么形成的。


    有一个很好的问题是：


    > 天文历法是为农业耕种服务的，但为什么明朝末年，像利玛窦、汤若望他们来到中国，他们跟中国人生活的纬度、经度都不一样，气候自然也不一样，他们给我们制定的历法为什么比我们自己的更适合农业耕种呢？


    这是一个好问题，其实现简单地回答：


    > 历法压根儿就不是为农业耕种服务的，所以它跟气候变化没有什么关系。


    古代的天文历法按不同的用途，内容的详细程度也不一样。


    最最简单的是就像现在的旧历那样，只有月跟日，复杂一些的就是在日期加上注释，比如民间最简单的就是黄历。黄历上都会写宜祭祀、宜作灶、宜纳财，忌开光、忌探病、忌安葬等等。


    但这些是老百姓用的，极为简单。皇帝用的那个就复杂多了，需要专门有一个部门来解读每天的黄历对应的各种事项应该怎么下判断。


    这种历法就不仅包括每天该做什么，还包括观测记录和天体运行规律的研究。


    中国古代历代王朝一共更新过90多次历法，明朝更新的最少。


    这个历法研究的主要对象就是太阳、月亮的方位，随着观察多了之后，还会加入金星、木星、水星、火星、土星，这五颗行星，加上刚才那两颗，古人管这7颗星叫做“七政”，它们就是7个掌管天象的物体。


    对天文历法的一个传统科学误读，就是它是否为农业耕种服务的。


    其实不用参考什么具体的历书，只要仔细想想农业是什么时候出现的，而文字又是什么时候出现的，再想想天文历法的出现又比文字晚了多久，就就能知道答案了。


    像农业在全世界各地都是大约在1万年前左右出现的，那是新仙女木事件之后。


    中国的文字大约出现在距今3600多年前，可是最早的历法出现在距今2600多年前。所以，如果历法专门是给农业服务的，那中间会有7500多年的时间，我们种地都没有时间上的指导，那就属于是胡乱种粮食的年代了，这是不可能的。所以，农业的发展是不依赖天文历法的。


    除此之外，还有几个理由，比如像历法中的七政，有六政，咋六政？月亮、金星、木星、水星、土星、火星，它们都对地球上植物的生长没有什么影响，植物的生长跟太阳有关。


    所以，就算<|message|>


    # ——►对科学的误读◄——


    其实这种情感因素催生出来的对科学的误读还有很多。


    比如说一提起早先欧洲天文学，好像除了哥白尼、伽利略、开普勒，就没有其他值得一提的天文学家了。实际上，当年来中国传教的汤若望、邓玉函这些人，在那会的天文学界也都是有一号的人物。


