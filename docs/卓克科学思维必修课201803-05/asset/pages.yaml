    复习+预告 | 科学家的自嘲


    # ——► 下周课程预告 ◄——


    # 关键词：科学家的自嘲


    《科学思维课》的同学，是认认真真对待科学的，很多人还从事科研工作，难免就会认为科学是非常严肃的。但是我们接下来的一个大系列，要讲“科学家的自嘲”，里面有很多看似不该是科学家做的事儿，但我相信，你一定能从中学到科学的思考方法。


    241 | 反省：976人共同获搞笑诺贝尔文学奖


    242 | 反省：面包抹了黄油那一面更容易着地？


    243 | 反省：什么时候需要假设上帝的存在？


    244 | 反省：一个物理学家挑衅一群文化学者


    # ——► 本周课程复习 ◄——


    # 概念23：宏观


    用宏观历史的角度了解人类史，不再纠结于某个事件或化石证据。而更多考虑气候、地理、人口总量、物种多样性等大背景条件，就可以更接近众文明之所以诞生或消亡的最初原因。科学作为一种文化，也可以从这个视角重新审视。


    +   1. 人类农业文明的出现，很大程度上是由地理条件和资源状况决定的，因为只有那些环境略微艰苦的环境，才存在适合作为农作物的植物。

    2. 农业生活包含两个部分，农作物的耕种与动物的饲养。

    3. 从全球范围看，东西走向上的气候变化远没有南北走向那么剧烈，大陆板块又是北多南少，这是人类农业文明集中在北纬30度附近的重要原因。


    +   1. 分子人类学是研究人类起源的学科，从线粒体中提取的 DNA，能够分析出母系的传承关系，从 Y 染色体中提取 DNA，能够分析出父系的传承关系。

    2. 人类文明早期，一个区域内的人类族群能否持续繁衍生息，掌握的技术越先进，基因被保留的概率就越大。

    3. 未来，在思维中兼持科学与民主，或者秉持比这两者还有竞争力的思想的那一部分人的基因会胜出，留下更多的后代。


    +   1. 在人口密度增加之后，只有在如何分配资源这个问题上进化出比较好的方法论，这样的族群才能活下来。

    2. 科学起源于一种小众文化，是指从古希腊众多学派跟思想中，毕达哥拉斯跟柏拉图那支传下来的，以数学为最重要的论证工具的思想。

    3. 16世纪之前，就算经验再丰富，总结出来的东西听着再神奇，那些从实际用途跟利益出发，总结归纳出来的东西都不是科学。


    # 概念24：反省


    科学是有力的，但内部也有各种问题，这些问题往往还是科学家们自我反省时公之于众的，甚至有科学家会把这些问题当做课题来研究。这让科学看上去没有那么完美，但这正是科学不断自我否定与完善的过程。


    +   1. 科研工作，往往让外行人觉得和自己没关系，但实际上，科学的研发方法和思考方式，是人类目前能掌握的最有效的认识世界与指导生活的方法论。

    2. 科学方法不仅在研究时用，生活中你感兴趣的任何话题，如果一定要问个为什么的时候，使用“测量+验证”的思考方式，都能得到很有参考价值的结果。


    # 答疑时间


    +   1. 塑料对海洋污染最严重的根源，在于它的化学结构极为稳定，物理尺寸可以缩小，但化学性质不变，不会被海水分解，也无法被海洋生物分解，永远不会成为生物圈的一部分。

    2. 塑料颗粒会自然地进入海洋生物的体内，进入整个海洋生态系统的食物链。而陌生的颗粒会引起生物体各种预想不到的免疫反应，有些还会导致激素的异常分泌。

    3. 用局部和统计的观点理解一个问题，才能把握事情的全貌。


    +   1. 6岁之前，人脑中的神经元连接是疯长式的，任何一个神经元都尽其所能地跟周围的神经元勾连在一起；6-12岁之间人脑中80%以上的神经元连接都要被修剪掉；12-20岁之间以较快的速度重新连接；20岁后缓慢增加。

    2. 对如何把握脑发育的关键时期培养孩子，建议就是让他们在青少年时期多接触新事物，把注意力花在美好的事物身上。

    3. 成年人重启大脑的高可塑性，得到的收益可能远小于付出的风险。


    卓克

