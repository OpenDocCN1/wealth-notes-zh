  md: '比如说巴黎国家图书馆收藏的一本第一版的《天体运行论》，在书中保留的笔记竟然是维萨留斯的。这个人可以作为是现代解剖学的开山祖师，一个医学界的人竟然也仔细关注过《天体运行论》，这是之前人们没有想到的。


    还有在佛罗伦佐意大利国家图书馆收藏的第二版《天体运行论》里，有伽利略看过的笔记。因为之前人们从伽利略的研究就猜测，他很可能没看过《天体运行论》，现在看来也猜错了。


    还有，在爱丁堡找到的有<|message|>布拉赫标注过笔记的《天体运行论》。


    # ─── 天体运行论在中国 ───


    在所有没有读过的《天体运行论》中，有两本值得一提，因为它们在1617年跟1618年前后脚来到了当时的中国，那是明朝的末年，万历年間。两本书，一个是第二版，一个是第三版，分别由两个传教士带进了中国。


