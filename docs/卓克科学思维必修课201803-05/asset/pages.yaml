  md: '这一点，在古希腊的科学中是从没有出现过的。也正是这个转变，让科学思想可以自己给自己造血，它不再是一个只消费不产出的文化了。


    在16世纪初发生这个转变的时候，当时世界上还同时出现了几个新的现象，也一起促进了科学的壮大。


    比如说古腾堡的印刷机，在这之前50年制造出来了。科学知识的传播成本大幅下降，而且相比从前传播手续来说，这次传播中的错误率大幅下降，这一点非常重要。因为你想，一本小说，如果你随机地从中挑出1%的文字，让它们变成乱码，那基本上不会影响任何人看着这本小说到底说了什么。但是
    Malone 科学著作，随便改动其中1%的字抄，这本书就几乎没法看懂了，到处都是说不通的谬误。


    另一个现象就是马丁·路德发动的宗教改革运动，让人们被束缚的思想松动了，而且这次思想的解放也有一样受益于古腾堡的印刷机，因为很多人第一次认识到，原来神父之前跟我们说的，跟《圣经》里写的不是一回事，你们是挂着羊头卖狗肉的。让人松动的还不止印刷机，远航探险中发现的大量新奇的东西，也对传统基督教定的社会观念是一种毁灭性的打击。


    所以你看，科学的这次转变应用到实际，促进了远航探险，而远航探险又反馈来打击了科学的敌人。


    # —— 今日内容小结 ——


    那听完这节课，我们能收获什么呢？


    就是科学的出现，是所有因素交织在一起的，在1500年的时间里，逐渐塑造出现代科学的样子。甚至可以说，欧洲的全部历史都影响着现代科学的出现。


    # —— 今日思考题 ——


    有一种说法是，文艺复兴是一个转折点，在这之前，中国的科学水平是最高的，转折点之后西方科学反超了东方，你觉得是这样吗？


    希望你把思考留在评论中。


    # 划重点


    +   1. 科学的诞生，是以数学为基础的严谨论证，目标是用数和几何图形解释自然规律。

    2. 因为与实际用途脱离，所以早期科学思想存活艰难，直到它为人们带来巨大利益的时候，科学思想才得以壮大。

    3. 科学就像混沌系统中涌现出的一种状态，是数不清的因素和这些因素之间的影响叠加在一起产生的，没有确定的因果关系。


