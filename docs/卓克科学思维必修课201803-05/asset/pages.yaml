  md: '# 190 | 严谨：测量里产生世界观


    # ——►概念18：严谨・——


    科学是从定量的概念发展出来的，衡量一个对象的多寡、大 小、或关键的动作就是测量。测量的对象是存在的边界，测量的准确就剪确“存在”最严谨的定义。


    # ——►上节思考题解答・——


    上次的课我留了一个问题，因为现在所有的物理量都可以用7个国际单位制中的基本单位通过换算法得到。那是不是说，这7个基本单位就是构建整个科学世界的物理量的基石呢？


    答案是：不是。


    因为通过之前几节课大家知道，标准化基本单位的工作，很多都是在18世纪19世纪才完成的，而物理量早在标准出现之前很早就都出现了。所以，这7个基本单位只是我们为了方便测量活动，方便能够标准化才定义下来的。


    定义它们的时候，并没有像古代人曾经出现过的那种一种逻辑，认为世界是由几种最最基础的元素组成的，比如像金、木、水、火、土构成的，然后不同的物质都是由多少多少的元素以不同的比例混合形成的，最终世界万物的道理都可以由这几种基础元素推导出来，并不是这样的思路。


    # ——►测量标准化的目的・——


    光是这么说，可能大家没有感觉，听着就好像是这7大基本单位，其实并没有什么基石的味道，只不过是好用而已。


    其实，就在这7个基本单位中，描述电流的安培就能把这个道理说得最透彻。


    比如说我在上学的时候，就有多次把跟电流相关的那个基本单位说成是电量，电量的单位叫库仑，我想你们当中可能有些人也是这样。


    那我们当初为什么会这么想呢？


    就是因为库仑是电荷的单位，那电量是什么意思呢？不就是电荷有多少嘛。而电荷的多少和电流的大小，都是存在一个最小的不容置疑，所以变化都只能以它的倍数增减，对应电量来说，这个最小单位就是一个电子或者一个质子所带的那么多的电量。


    所以，如果我们把电量当作基本单位，那岂不是能把单位制度构建得更基础吗？


    我们再来对比一下真正基本单位中跟电流相关的那个单位，叫安培。


    安培的定义是什么呢？


    它是单位时间里通过的电量。


    你看，如果我们从构建一个更为基本世界框架这个角度来看，安培肯定没有电量更基本呀，因为安培就是用电量除以一个已经标准化的时间来表示的，它多了一步。


    但是，我要说的这个道理就是：


    > 测量行为和把测量量标准化的行为，它的目的只是为了测得更准，只是为了让大家更统一，而没有一点要构建这个物理世界基石的目的。


    所以你就能知道，为什么我们要用安培了，因为在很长一段时间里，我们测量电流值远比测量电量的大小要准确得多。


    # ——►安培表・——


    安培作为基本的物理单位的时间比较晚，因为电磁学的时间出现比较晚，当时不要说是测一个电子携带的电量了，人就连原子、电子存不存在都不知道呢。


    所以，怎么能测量一个电子所带的电量呢？当初测量电量的仪器是什么呢？


    叫做验电器。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_56_0.png)


    现在沙中的物理实验课也会有，它上面是一个金属球，下面连着一个金属杆，然后这个金属杆穿过一个带橡皮塞的玻璃瓶。金属杆的最下端，也就是在这个玻璃瓶里还挂着两片非常薄的铝箔。


    如果这时候，你用一个带电体接触上面的金属球，这底下两片铝箔就会相互分开，形成一个张角。带的电越多，因为同性的电荷相互排斥，所以这两片铝箔形成的张角就越来越大。


    如果再用带相反的电荷去触碰这金属球，底下这两片铝箔张角又会逐渐减少。


    大致就是这么一个东西，它是可以测量电量的。


    我这么一说，你一听就知道，它一定是很粗糙的，甚至有时候不能测电量，它只能测带的是不是同种的电荷，或者说是电荷增加了，还是减少了。至于说增加了多少，减少了多少，那完全就谈不上精度了。


    最初的电磁学用到的仪器其实是电流表，能测电流就已经是电学作为一门可量化化学科的标志了。最早的电流表大约是法国物理学家安培在自己的研究中，为了测试能够定量化，自己发明出来一个仪器，测量电流用。1821年左右开始使用，所以后来的电流表也叫做安培表，电流的大小也用安培的名字。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_56_1.png)


    我找了一张那个时期的电流表，你可以看看，也就是在200年前，我们已经能把电流测到0.1A这个水平了，这个精度是远远超过对电量的直接测量的。


    # ——►安培的定义・——


    但是电流的单位，安培最初的定义特麻烦，最初是这么说，说：


    在真空中相距1米的两根无限长平行导线，通过相等的恒定电流，当每米导线上所受到的力是2×10^(-7) 牛的时候，每根导线上流过的电流，这个时候是1A。


    要明白这个道理，可能得上初中学了物理课才能知道。


    但咱们仅从单位的标准化这个程度看，这个定义就是介于纯逻辑跟依赖于实体物质之间的那种一种定义程度。因为，仅有这个无限长导线上测每米的受力，到这里已经不现实了，因为现实中就没有无限长的导线了。


    所以，根据这个定义，在1946年之前是一直没有实验室能够精确测量的。但是，


    实际上，科学界大概是从一九零几年开始，就已经使用了基本电荷作衡量的依据，因为在那个时候，量子力学的各种实验，还有它的理论都拓展了电学中的应用，也夯实了电学的微观基础。


    # ——►单位标准化的思路・——


    你看，如果从思维逆角角度，从最最基本的物理单位考虑，那当然是首选电量作为跟电相关的最基本的单位。


    但我们之所以能有电流安培作为基本单位这个想法，根源也不是我们的思维比实验更超前、更严谨，而是因为之前只能够测量电流，不能测准电量。


    甚至是在之后100多年里的时间，人们才发现了电子这种东西。而且后来发展了量子理论，知道了很多物理量原来是有最小'
