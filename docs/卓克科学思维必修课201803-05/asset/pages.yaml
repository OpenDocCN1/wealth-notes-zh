  md: '# 237 | 宏观：科学诞生前的技术大同小异


    # ——►概念23：宏观◄——


    用宏观历史的角度了解人类史，不再纠结于某个事件或化石证据。而更多考虑气候、地理、人口总量、物种多样性等大背景条件，就可以更接近众多元文明之所以诞生或消失的最初原因。科学作为一种文化，也可以从这个视角重新审视。


    上次我留了一个问题，就是当农业遍布全球之后，还会产生什么危机呢？


    其实还是资源危机。而且人类从出现到今天，资源危机总是出现在人口增长之后。


    现在全球人口快80亿人了，粮食基本够吃是因为技术发展，让单位田产出了足够多粮食。


    几千年前的危机之所以发生，是因为以那个时候的技术来看，人们已经把能种的都种了，还是不够吃，危机就这么产生了。


    那危机又是怎么样解决的呢？


    技术上的突破占了一半，而人与人之间的关系改善占了另外一半。


    因为光凭技术是解决不了危机的。


    其实文史哲、经济、法律、政治和科学技术是并重的，只不过因为在这些方面知识的普及比科技还要差。


    # ——•基因层面的思考•——


    我们从基因的方面看，人与人的关系，从狩猎采集到农耕的过渡，虽然到现在也只用了几千年，但仍然也可以从基因表达上看出差别了，那就是有一些冲动易怒的基因型，在当前社会发达的地区，要比欠发达地区的数量少。


    # ——•古人的技术•——


    我们再来看跟技术有关的发展，之前的课里我们曾经提到过，在1000年之前，世界各地的居民都对三方面的知识有所了解，一个是天文，一个是农业，一个是医学。


    这些知识只能算是对大量经验的分类和抽象，不能算作科学。


    这个小众思想直到16世纪才发生了一个大的转折，从此之后就可以用它来预测现实世界中各种物体的运动跟变化了。'
