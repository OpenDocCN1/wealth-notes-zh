  md: '# 特别内容｜哈勃空间望远镜升空28周年


    从1990年4月24日到2018年4月24日，哈勃望远镜已经在太空中服役长达28年了，它的诞生，开启了人类观测宇宙的辉煌时代。


    现在，SpaceX 正在大胆追逐移民火星的梦想，我们中国也有着雄心勃勃的太空计划，可以说，这些都如是基于哈勃望远镜的观测打下的基础。


    # 在天文史上，我们人类相继睁开了四只眼：


    +   - 第一只眼，是我们自己的肉眼，我们能清楚的，是目前所及的满天星斗。

    - 第二只眼，是1609年伽利略发明了人类历史上第一台天文望远镜，开辟了天文学的新时代。

    - 第三只眼，就是1990年上天的哈勃天文望远镜，我们可以看到宇宙的更深处，探索出宇宙的边界和年龄。

    - 第四只眼，是引力波探测器，它将让我们可以探索宇宙的起源。


    # —— 哈勃十件事 ——


    # 1. 哈勃望远镜的身世


    哈勃望远镜是 NASA “大型轨道天文台计划”的一部分，目标是在地球轨道部署4架天文望远镜，分别观测4个不同波段的电磁波信号，频率范围几乎覆盖了绝大部分电磁波频谱。


    1990年4月24日，第一颗上天的就是哈勃望远镜，它负责观测可见光波段。


    # 2. 哈勃另外的三个兄弟


    康普顿伽马射线望远镜，由亚特兰蒂斯号航天飞机运上天，它负责观测波长最小的伽马射线波段；

    钱德拉 X 射线望远镜，负责观测 X 射线波段；

    斯皮策空间望远镜，负责观测红外长波波段。


    # 3. 差点夭折的哈勃


    哈勃计划是1970年提出的，但直到1978年才得到拨款开始设计，计划1983年发射升空。


    因为造价昂贵，哈勃计划差点夭折，是天文学家、美国科学院的各种游行、游说、科普，最终才拿到了一般预算，NASA 只好拉欧洲航天局加入伙，让他们用6亿美元换了15%的观测时间。但哈勃还是不得不缩小规模，主镜面从直径3米缩小到2.4米。


    # 4. 艰难的制造


    哈勃的解析力是当时已有望远镜的10倍，技术规格极高，单单打磨镜片就把工程拖慢了3年。在1986年，挑战者号航天飞机爆炸，里根总统下令停止一切航天飞机飞行活动，哈勃又等了4年。


    # 5. 天生残疾的哈勃


    1990年4月24日，哈勃终于上天了，但马上就发现太阳能电池板打不开，照相机启动后发现焦距有问题，几天后导航系统和动力系统相继出现了故障。哈勃在当时几乎成为了“高科技太空垃圾”。


    # 6. NASA 背水一战


    NASA 背负着各方压力，开始了哈勃维修计划，发现原来是主镜片厚了2微米，解决办法就是给哈勃“戴眼镜”，眼镜全称叫“空间望远镜光轴补偿矫正光学”，简称 COSTAR。1993年12月2日，奋进号航天飞机带着7名宇航员成功对哈勃进行了维修，为此他们在地面接受了3年半的训练。


    # 7. 超期服役典范


    让人没想到的是，哈勃望远镜成了超期服役的典型，原计划是在2005年退役，但实际上到了今天依然不断产生重要发现。在20多年中，它经过了4次大修和升级，比如，1999年它用上了
    Intel 的486处理器。


    # 8. 知识补充：宇航版处理器


    2000年左右，已经有英特尔奔腾4处理器了，为啥哈勃还要用1989年的486处理器呢？

    实际上，宇航版 CPU 比商用版要精密复杂得多，属于国家级别的机密。因为它要在宇宙环境中工作，这是一个高辐射，温差极大的环境。最大温差300℃，而地面上最多只有70℃。超高能的宇宙射线还会<|message|>


    # 9. 哈勃的重大贡献


    +   - 通过拍摄超新星爆炸，证明了宇宙处于加速膨胀中。

    - 通过拍摄黑洞周围物质的运动，确认了每一个星系中心存在质量巨大的黑洞。

    - 通过确认哈勃常数，得到了宇宙的年龄。


    # 10. 哈勃的命运


    2009年，NASA 对已经超期服役的哈勃又作了最后一次维修，预计能正常服役到2014年底，而实际上到了今天，它还在上面兢兢业业地巡天呢。


