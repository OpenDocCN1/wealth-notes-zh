  md: "# 207 | 遗憾：科学与宗教的矛盾很尖锐吗？\n\n![](img/2a007d9b2edf272f0ffcba41cd9344f7_95_0.png)\n\
    \n# ——► 概念20：遗憾 ◄——\n\n中国在明清两朝曾长期和西方科学保持接触，关系有时亲密、有时疏远。有人认为当时的中国没有发展出现代科学就“遗憾”，而实际上，只是必然，没有什么遗憾。\n\
    \n上节课最后，我留了一个问题，宗教和科学什么时候会彻底地分离呢？\n\n这个问题本身就能帮助我们训练科学思维，也能帮助我们深入了解科学与宗教是不是存在尖锐的矛盾。\n\
    \n# ——► 科学与宗教的分离 ◄——\n\n首先，我们要弄清问题中关键词。比如说做什么叫做分离，那是指科学家放弃宗教信仰吗？或者说科学家跟宗教人士分开不同的地点办公吗？\n\
    \n那我们先来定义一下分离。\n分离就是，当我们不用宗教理论解释现实中可测的对象、而用科学方法去解释它们的时候，那么这就称之为，我们就做到了科学与宗教的分离。\n\
    \n现实中可测的对象多得不可数，当我们解释这众多对象的时候，采用越高于比例的是科学方法而不是宗教理论，两者分离就越彻底。\n\n# ——► 科学家与宗教信仰\
    \ ◄——\n\n宗教是在逐渐缩小解释世界范围的，我们举两个例子：\n\n比如之前，我们不是说过，1616年天主教会把《天体运行论》列为禁书了吗？\n\n\
    那这条禁书令是在219年之后，也就是1835年的时候被撤销了，这就是一个标志，也就是对太阳系内的恒星运行到底如何运行这件事，在这个对象上，人们普遍地不再用宗教理论去解释它们了，甚至连宗教人士都不这么解释了。\n\
    \n2010年5月22日，弗降堡大教堂重新为哥白尼举行了隆重的下葬仪式，主教发言说：\n    今天的葬礼具有象征意义，显现科学与宗教的和解，哥白尼为当地留下的遗产...全心投入；更重要的是他的科学天赋。\n\
