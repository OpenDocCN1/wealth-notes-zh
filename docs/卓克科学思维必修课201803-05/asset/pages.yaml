    科研成果对科学家来说是一种荣耀，也是最大的利益，因此，直到学术期刊的出现能解决研究成果的归属问题，科学家们才愿意公开。3. 研究一个什么东西，做实验去验证就好了，无需添加那些形而上学、道德、语法和修辞。


