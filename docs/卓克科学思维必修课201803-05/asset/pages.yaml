  md: "动物的区别就在于主观意愿上的差别。\n\n对动物而言，它们的精神世界的复杂程度远远不及人类，可以说，它们更倾向于生活在由各种激素跟化学物质催生出来杂的行为模式当中。所以当我们把某种能影响它们的化学物质注射进去的时候，它们就成了另外一副模样。等停掉之后，它们的行为又会恢复。所以在毒品疫苗上，动物的药效明显好于人类。\n\
    \n人类有更明确的主观意愿，更强烈意图，他不但能体验到化学物质带来的快感跟成就，还能为了追求这种好的感觉，宁愿在中间过程付出一一些代价，最终追逐到那种美好的感觉。\n\
    \n这样的过程，这样的代价有的是辛勤的劳作，有的是失恋后的沮丧，有些却是整个 人身体跟心理健康的代价。这些行为虽然有些是值得点赞的，有些是值得哀叹的，它们是我们之所以称之为人的那一部分。\n\
    \n# —— ◆ 今日思考题 ◆ ——\n\n如果今后科技高度发达了，已经可以精确地通过电来刺激相应的奖励区域，让人简单直接地感受到成功、喜悦跟快感，那这种技术算不算毒品呢？还是说我们最终会把它当作是一种技术进步，广泛地使用呢？\n\
    \n如果有想法就留在评论中。\n\n# ■ 划重点\n\n+   1. 毒品疫苗的原理，是用某种能被免疫系统识别出来的物质吸收血液中的毒品，然后等待免疫系统来清理排出体外。\
    \ \n2. 毒品疫苗在动物实验中取得了很好的效果，但在人体实验中很糟糕，根源是人有更明确的主观意愿，染上毒瘾，生理上的改变只是其中一条必要条件，更多的是在生活的方方面面都出了问题，毒品变成了获得快乐的唯一选择。\n\
    \n卓克\n\n我是卓克，咱们明天再见。"
