  md: '你看，现代医学中的止咳药，右美沙芬、苯丙哌林、盐酸那可汀、喷托维林。你看这些，没有一个是通过名字知道疗效的，这些就是安全的。


    为什么不要吃那些止咳药呢？


    主要就是因为里面普遍含有“可待因”跟“吗啡”这类已经被禁的成分。


    古代人可能在几百年的经验累积中，模模糊糊地发现，确实是吃了某种植物，又模模糊糊地觉得咳嗽强度减弱了，但是古代人对是不是真的有效，有效的话，具体是怎么起效的，还有吃这种药安不安全，是完全没有能力验证的。


    比如曾经就有很多次中国留学生出国念书，行李里带着10几瓶复方甘草片，然后就被以携带违禁药物为由遣返回国了，而且未来5年内是禁止入境的。而这些药，当初就是家长担心孩子咳嗽、喘，给他们预备的。实际上，家长根本就不知道，这些药本来就没效果，而且还不安全，在现代医学体系内早就禁止使用了。


    民间的偏方也有这样的情况，只不过民间不会涉及到广泛彫杂的稀有植物，所以都只是从日常吃的食物中归纳总结出一些似是而非的经验出来，这些经验有些有用，但又抓不到要领，大多数是没用的。


    否则，医学如此发达的今天，竟然有这些低垂的果实还没有被摘走，那也太小瞧最近100年来医学从业者的素质了。


    # ——◆ 注意适用范围 ◆——


    如果只是普通程度的咳嗽，可以把握得住，那最好还是不要吃药，因为咳嗽本身是一种自我保护机制。


    除此之外，还有更严重的问题：比如像连续咳嗽了超过三个星期，或者是咳嗽的时候带着血，伴有呕吐，还有发烧，或者感染了百日咳，那就是另外的问题了，这些不能耽误，也不是这期内容能解决的。


    咳嗽的声音确实挺烦人，有时候孩子感冒之后咳嗽，给父母带来严重的不安跟焦虑，为了缓解它，就盲目地乱给孩子喂药，甚至责骂孩子怎么这么不懂事。


    我想，多了解一些咳嗽的机制跟有效的处理办法，我们会对咳嗽的孩子多一份了解跟关照。


    好了，这次答疑就是这样。


    # 划重点


    +   1. 只要不影响正常生活就无需吃药治疗，比如已经咳到无法睡觉了，才需要吃现代止咳药，如果手头没有，含一块糖也能缓解。\n2. 儿童感冒痊愈之后的咳嗽，尽量不要服用药物，因为咳嗽是自我保护机制。\n3.
    给儿童止咳，可以用“硬的糖果”，因为糖会促使呼吸道形成保护膜，避免继续被细菌和病毒侵扰。


    卓克

    我是卓克，咱们明天再见。'
