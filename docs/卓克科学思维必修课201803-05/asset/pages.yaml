    +   1. 日常生活中发现牙齿出现问题，几乎只能找牙医解决，没有其它更好的办法，偏方、牙膏等自我治疗方法，都不可靠。 2. 牙膏的最大用处就是通过含有的“氟”让牙齿更坚固，美白和脱敏属于效果夸大，防止牙龈出血掩盖了牙周问题，不利于长期的口腔健康，“无氟”牙膏属于反科学。
    3. 面对日常生活中的那些夸大宣传，不一定需要特别深入的了解，我们只要知道几条基础知识，就能识别其中的泡沫。


