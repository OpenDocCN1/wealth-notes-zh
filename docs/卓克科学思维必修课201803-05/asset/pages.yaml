  md: '# 复习+预告 | 科学不伟大


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_147_0.png)


    # —— 本周课程复习 ——


    # 概念21：追赶


    1847年，三名中国学生赴美留学，迈出了中国追赶现代科学文明的第一步，他们之后促成了“留美幼童计划”。留美的幼童人到中年后又促成了“庚子赔款奖学金计划”。这些奖学金培养的人才几乎造就了中国现代科学所有学科分支的创立者，确立了现代科学在中国的位置。


    +   1. 现代社会，人们之间依然存在信息落差，根源是对信息的筛选能力的差异。 2. 科学思想在中国生根发芽，是各种因素的影响互相叠加带来的。 3. 如果把社会形态里民众可以选择的人生道路的多样性作为标志，更丰富等于更文明的话，只有更文明的社会，科学才能更发达。


    # 概念22：平凡


    在现代科学方面，中国用了150年的时间追上了西方500年的进展。所以当代的中国人难免对科技发展的速度有所高估，把科学当作无比伟大正确的事物。而实际上这是一种偏见，科学没有大家想象的那么完美。客观公正的评价科学，也是一种科学精神。


    +   1. 不论什么时代的科学家，他们的成就都是在他们生活的那个时代已有的知识基础上作出的突破得到的，每一位科学家，都站在巨人的肩膀上。 2. 科学成果是可积累的，后辈科学家可以不用再重复前人的工作，同时，科学文化的兴起，强烈依赖社会大背景提供的便利条件。


    +   1. 带着批判性思维平视科学，了解伟大科学家平凡的一面，而不是仰视与崇拜，这也是一种科学精神。 2. 过分认可科学的价值，过高评价科技人才，背后的实质，是一种盲目和一种对财富的贪婪。


    +   1. “四大发明”一词，来源于英国科学家李约瑟在1940年代对中国文化的研究，其中的火药和造纸术是真实的，但活字印刷在古中国几乎没人用，只能算半个，而指南是无法指南的。
    2. 科学的思考习惯，要对知识随时地核实与订正，而四大发明的说法，掺杂了太多情感因素，成了一种象征与符号，这是反科学思维的。


    # 答疑


    +   1. 思维习惯一旦养成，就很难改变，因为人在6-12岁，脑神经元的连接数量会削减约80%，然后再缓慢重新连接，形成生理基础。 2. 科学思维固然重要，但极端地走入唯科学论的方向，反而还是有害的。
    3. 科普的最终效果，是整个社会的文化土壤决定的，包括个人、学校、工作单位、媒体宣传等等。


    +   1. 研究意识的真正价值，在于它能用于临床治疗。 2. 通过对脑电图收集到的海量数据进行抽象，经过特殊算法，得到了“扰动复杂指数”，简称PCI，它很有希望继续发展成一个意识的量尺。
    3. 对于大脑，目前还没有系统化的科学理论，我们还有很长的路要走。


