  md: '# 170 | 泡沫：被过度神化的“潜意识”


    # ——► 概念15: 泡沫 ◄——


    一项新的科研成果出现，总会引发很多人 的热情，有些人是为了科学欢呼，有些人则 希望从中渔利，于是泡沫从中诞生。识别 出泡沫，不但有利于保护我们自己，也能 在识别的过程中进一步理解科学的本质。


    # ——► 佛洛伊德与潜意识 ◄——


    “潜意识”这个词，最早是从佛洛伊德的理 论中提出来的，佛洛伊德可以算是史上影 响力最大的心理学家。


    曾经的心理学一直采用思辨的方式推进， 通俗地说，就是一个人坐在家中思考一个 又一个的结论。是从佛洛伊德那个年代开 始，心理学的质性才完全摆脱了这个模 式，改成了主要依赖于做实验的模式。但
    那个时候的实验，大都也只是统计跟观察 人的行为，并没有更精确的测量方法。


    所以如果把那个时候的方法或者结论直接 拿过来放在八九十年后的今天用，就很 很难得到学术界的认可了。但放在佛洛伊德那 个年代，他的理论把心理学向科学方法拉 近了一大步，这个就是对佛洛伊德比较客
    观的评价。


    当年的佛洛伊德提出过很多理论，比如 说：


    +   - 人有生本能跟死本能；

    - 人有本我、自 我、超我；

    - 人格发展有口唇期、 肛门期、性器期、潜伏期、 两性期；

    - 人还有意识，前意识、潜意识。


    潜意识理论，后来被应用的范围非常广， 尤其是1950年代的美国。


    # ——► 潜意识广告营销策略 ◄——


    二战之后，美国各行各业都迅速地发展， 广告跟销售成了人们希望从事的行业，想 方设法诱惑人，把东西卖出去，所以行销 技巧，营销策略这些名词，也就是从那会 儿开始兴起的。


    当时一个咨询公司的市场研究员詹姆斯·维 卡里在看过佛洛伊德的书以后，就对潜意 识这个概念产生了不少灵感，于是就创造 出一套叫做潜意识广告的营销策略。如果 你去查这个关键词，还有不少综述性的论
    文在谈到营销策略的时候对这个方法大加 肯定。


    当时的一系列实验是这么做的：


    在1957年夏天，维卡里在新泽西州的利堡 市跟当地的电影院负责人协商好，做了一 个秘密实验，并且取得了巨大的成功。


    他认为，营销手段在这么多年，广告对消 费者的狂轰滥炸下已经失去作用了，每个人 心里就算是很需要，很想买，也会本能 地抗拒各种销售手段。


    为了攻破这道防线，他对电影院的片子作 了一些改动，在持续4个多月的时间里， 把热播的影片中加入一些跟影片没关系 的内容，这些内容多次穿插显现在整部片子 里，每次只是现一帧的画面，因为出现的时间非常短，观众甚至还没有看清这帧是什
    么，电影又继续了。


    这些画面当时都是一些吃爆米花，喝可乐 的画面，也有文字提示，提示大家是不是 饿了呀，‘吃点爆米花吧，喝点可乐吧。''


    维卡里就认为：


    +   - 因为观众都没有看清到底是什么，所以 自然在意识中不会生出抗拒的念头，那 同时这些没有被看清的内容已经进入了 所谓的潜意识，所以会对这些人的后续
    行为产生影响。


    经过4个月的实验，可乐的销量增长了 18%，爆米花的销量增加了57%。


    # ——► 不存在的实验 ◄——


    这种增长的效果是传统广告很难达到的， 一下就引起了商界，甚至是政界的震动。


    因为除了商品销售之外，选举是不是也能 通过这种方式增加选民对参选者的信任 呢？


    从那一年起，一些广告营销大师也加入了 政坛。这些内容甚至引起了中央情报局的 重视，他们在1958年1月18日的报告中还 写到：


    +   - 采用潜意识导入的方法，可以解除个体 对催眠术的抗拒，这种方法已经取得了 商业上的成功，也许通过显示“服从”或 者“删除”等暗示画面也能达到同样的效
    果。


    中央情报局后来在自己几年前资助过的一 部动画片《动物农庄》里加入了类似的暗 示闪现画面，希望看到观众在离场的时候 都去买爆米花的效果，但结果并没有什么 人看完了电影还要去买爆米花。


    这之后，还有其他媒体进行过尝试，加拿 大广播公司当时有一档收视率很高的脱口 秀节目叫《特写》，他们就尝试在节目播 出的时候闪现信息给观众，信息内容就是 邀请观众给电视台打电话参与节目，但是
    连续播了几期，闪现的内容重复出现了 400多次，仍然没有一个观众按照期望参 与电话讨论。


    在1958年年中，这个轰动性的营销方法就 开始受到越来越多的质疑了，最后为它盖 棺定论的是耶鲁大学的心理学专家亨利·林 克，他直接邀请维卡里到学校复现他的潜
    意识营销实验，在几种实验条件下的设计 中，都没有统计出人们的行为被影响的 效果，理论的提出者自己打了自己的脸。


    1958年的年底，纽约的霍夫斯特拉大学的 心理学专业的学生斯图尔特·罗杰斯去了维 卡里当初做实验的利堡市，找到了那家电 影院，结果一进到放映大厅就知道维卡里
    一定是在说谎，因为这个电影院非常小， 只能容纳二三十人，根本不是维卡里说的 那种“在4个月中潜意识营销的效果在几万 人的身上都表现出来”。接着这位同学又 找到了电影院的经理，结果经理说，这里
    根本就没做过这样的实验。


    又过了4年，维卡里终于扛不住了，他公 开承认自己当年欺骗了大家，他根本没做 过这样的实验。


    当年为什么这么说呢？


    就是因为自己的营销咨询业务每况愈下， 所以就杜撰了潜意识营销的理论，可是当 初他根本没想到，这套说法竟然有这么大 的影响力，所以之后就将错就错了。


    # ——► 潜意识理论的滥用 ◄——


    虽然后来维卡里在很多场合都反复承认这 一切都是谎言，但他自己辟谣的内容传播 广度远不如那些营销培训跟成功学的书， 甚至一些学术界的人也依然相信这个理论 是靠得住的。


    比 如说1985年12月23号，有两个年轻人 约好了自杀，他们平时一起吸毒，一起玩 儿，也都喜欢当年大红大紫的重金属乐队 狂大至往。


    悲剧发生之后，他们的父母认为，孩子之 所以自杀就是因为听了这个乐队的 《Better By You, Better Than Me》这首 歌。因为这首歌反复唱的一句“Better
    By You, Better Than Me”，最好由你来而不是 我来。家长就认为这是这一句话害了孩子自 杀。孩子的早亡对家长打击很大，所以他 们寻求一切可能的补偿，这个人们都可以
    理解。


    可是接下来，美 国心理学家威尔逊·凯作 作为潜意识方面的专家出庭作证，认为这首 歌在潜意识中确实引导了两位孩子走向自 杀，幸好，那个法官还保持着清醒，驳回
    了诉讼，宣布不受理此案。


    后来乐队的的 主唱讽刺地说：


    +   - 如果潜意识这玩意儿有这么大作用，我 们的歌词里加的 一定是让大家多买我们的 唱片吧，而不 pyt 会加什么自杀。


    这个典型的案件就可以反映当时社会上， 人们认为潜意识对人们行为的影响有多严重。


    除此之外，还有学术界成体系的理论也构 建在这个谎言之上。比如说1958年开始兴 起的睡眠学习理论，它就是基于1957年维 卡里的潜意识营销发展出来的。


