  md: '# 172 | 成瘾：一碰海洛因，终身都戒不了


    # —— 概念16：成瘾 ——


    生物大脑中的奖机机制塑造了个体的行为模式和性格，形成了兴趣与爱好，当对这种奖励产生习惯性或依赖性，即为“成瘾”。加深“化学物质对人的影响”的了解，就会发现，主观意识能够把控的疆域并不很大。


    这个系列我们说说成瘾这个主题，这些内容并不是单纯为了提醒人们远离毒品，而是要通过讲瘾的生成跟去除，让大家了解：


    一个人的主观意愿或者各种念头、欲望、喜好，它可不是全由一个人的主观判断做出来的，一个人的行为模式受到各种外源或者是内源性的激素跟化学物质的影响，远比我们想象中的要大，我们主观意愿可以把控的疆域并没有我们想象的那么坚固。


    如果知道了这一点，也许我们会更加珍惜自己已经训练出来的独立思考能力，对理智、客观、冷静的自己多一份自豪，更会非常不愿意让我们的这个精致到磨得很好的大脑被那些没有技术含量的毒品绑架，然后摧毁。


    # —— 毒品的历史 ——


    我们先来说说毒品的历史，其实早在4000年前，在两河流域就有种植罂粟的了。苏美尔人就提取里面的汁液喝下去，就会有愉快的感觉，而且很多病痛也由此消失。这种做法，一直延续到化学成为一门成熟的学科。


    德国药剂师在1804年，从罂粟中把让人快乐、减轻疼痛的单一的有效成分提取出来了，可以说到此为止，毒品才算首次出现。


    那个有效的成分就是“吗啡”。


    当时的人不知道这是有害的，所以很多镇痛的药里都有吗啡，尤其是在战场上，需要缓解肉体跟心灵上双重的伤痛的时候，来一支吗啡是最好的安慰。


    但实际上，减轻或者消除疼痛，只不过是通过掩盖病情实现的，那些病灶依然没有恢复。所以病人家属或者是医生，还是不认可它的治疗效果，而且与此同时还发现了使用吗啡会上瘾。


    所以，就开始有制药企业希望能研发出一种不成瘾，但是也能减轻病痛的化学成分。


    在1897年，拜尔药业推出了一款新药，它是通过把吗啡乙酰化得到的，最初的观察中没有发现成瘾，于是这款新药的宣传标语就是它是一种替代吗啡，而且不会上瘾的药，因为用过药之后，病人还会有强烈的成就感。


    所以，拜尔药业就依照这个感觉给药命名为“英雄”，Heroin，这个词也正是海洛因的音译。


    但实际上，开卖不久就发现它的成瘾性比吗啡还要大。从前那些吗啡都不能解决的人，现在就好像抓住了救命稻草一样，纷纷开始以各种消炎镇痛的名义去开海洛因。


    海洛因合法地卖了快30年才被禁，但制造方法跟原料并不难获取，所以也就成了后来全世界毒贩们的发财工具。


    这一类从罂粟里提取出来的毒品都叫做阿片类毒品。


    # —— 毒瘾的原理 ——


    在上世纪60年代，人们才对吗啡为什么会让人上瘾研究清楚。


    我们现在知道，每个细胞的膜都负责跟外界沟通，把需要的东西抓到细胞内部来，不需要的东西，即使跟细胞膜靠得再紧也不会突破膜到里面来。


    所以，具体让谁进，不让谁进，就是一种叫做受体的蛋白质来把控的，当我们深入到细胞这个尺寸的时候，我们应该把每一个蛋白质都看作是一个有特定任务的工人，在细胞膜上有成千上万个工人，它们又分成几百个不同的工种，分别负责识别外界的物质哪一些能进入，哪一些不行，每个细胞都是如此，神经细胞也不例外。


    神经细胞会伸出很多突触来，它们负责感知周边环境的刺激，顺便把有用的东西抓进来。大脑中的神经细胞叫做神经元，它们正常工作的时候也会释放跟吸收很多不同的物质。


    其中就有那么一种物质叫做“内啡肽”。


    这个名字里带了一个吗啡的啡字，可能有人就想，是不是也多少跟吗啡有点关系呀？


    确实是这样的，这种物质虽然跟吗啡在化学结构上没有太多相似之处，但它们却都能被神经突触上的蛋白质工人抓住，这种工人就叫做“阿片受体”。


    被抓住之后，脑垂体收到了信号，就会分泌一种大家都很熟悉的物质，叫做“多巴胺”。


    比如：


    +   - 当我们饿得不行的时候，吃到了一块巧克力；

    - 或者当我们完成了一项很巨的工作，领导奖励了我们5万块钱；

    - 或者当我们表白成功，心仪的对象亲了自己一下；

    - 或者是当我们儿孙满堂、欢声笑语的时候，脑垂体都会分泌多巴胺；


    总之，这是在动物在长期的进化中出现的一种奖励机制。不只是人，哺乳类动物都是这样的。


    甚至有时候，看起来一个在努力工作，玩命加班，想办法提升职位，或者是坚持长跑、写书法，做智力题，踢足球比赛，甚至还有可能身陷赌场的那些人，其实他们最大的根源就是一个，他们都在利用各种手段刺激脑垂体产生那么一点可怜的多巴胺奖励自己。


    所以从某种角度上说，我们都是这种化学奖励下的奴隶。


    # —— 戒毒之难 ——


    但是，生物在漫长的进化中形成的奖励机制不是那么简单的。


    比如一个刚毕业的大学生第一次通过努力工作月薪涨到了1万，那是一件让他多巴胺大量分泌的事情。但是1万的月薪发了半年之后，他就不会再分泌多巴胺了，只有月薪达到2万的时候才能刺激他再次分泌多巴胺。现实生活里，从1万到2万，这又需要一年的努力。


    使用毒品也是这样的：


    这次的剂量让一个人很爽，但是几次之后，这个剂量就不会让人有什么感觉了，必须加倍才可以，用不了多久，一个正常人的大脑就被海洛因给绑架了，3到4个小时就需要补充一次，如果不补充，就会出疼痛身处极端的疼痛。'
