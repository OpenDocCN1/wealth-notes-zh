  md: '# 231 | 平凡：科学圈内部的自我审查


    # ——► 概念22：平凡 ◄——


    在现代科学方面，中国用了150年的时间追上了西方500年的进展。所以当代的中国人难免对科技发展的速度有所高估，把科学当作无比伟大正确的事物。而实际上这是一种偏见，科学没有大家想象的那么完美。客观公正的评价科学，也是一种科学精神。


    上节课最后我留下了一个问题：


    有的时候，主流科学界在某些新技术适不适合普及的问题上，起码说在反对一方看来，既属于运动员，又是裁判。


    那么，是不是真的就没公正可言了呢？


    当然不会了，因为就算身为裁判，或者身为法官，也不是他们一言堂。在他们之上，还有更高一级的东西制约着他们，对裁判来说就是比赛规则，对法官来说就是法律。


    我们在测量的那一系列课里就介绍过，单位制标准化过程，其中追求的最重要的目标，就是尽量用一个逻辑化的概念给某一个单位定位，这样起码从概念上这个单位是不存在误差的。


    科学圈也是这样的，没有哪一个科学家可以超过那个独立存在的逻辑层面作判断。所以科学里是有公正的，最差的情况也就是有的时候会被巨大的利益拖慢节奏。


    # ——► 舍恩事件 ◄——


    这节课我要给你讲的，正是这样的公正是怎么实现的？


    科学家为了名誉或者经费造假的事情，我介绍过几次，比如像小保方晴子事件、韩春雨事件。我介绍的内容，主要是造没造假这个结论已经出来之后，科学圈是怎么处理的，从这个角度说的。从这些结果看，有的反应快，有的反应慢，有的处罚力度轻，有的处罚力度重，这其实体现的更是社会的公正与法制。


    但这次，我要说的是科学圈内部的自我审查是怎么起效的。


    我要说的事件就是“舍恩事件”。


    这是科学界迄今为止规模非常大的批量造假的一个丑闻，而且还发生在大家鼎鼎的贝尔实验室。涉及到《自然》《科学》《物理评论快报》这样的顶级期刊，主人公是德国物理学家舍恩。


    大致过程就是这样的：


    舍恩在1998年博士毕业之后，去了所有人IT跟半导体产业从业者最向往的贝尔实验室，从2001年到2005年这4年极高产，在水平比较高的期刊上就发表了80多篇论文，其中只统计《自然》跟《科学》这两个刊物，以第一作者身份发表的文章一共17篇。


    如果算上其他不知名的期刊，有人给他算过，在这4年里头，平均8天有一篇论文发表，而且涉及的领域还非常广，分子半导体、分子电子路、有机激光、高温超导、纳米材料等等。


    从所有的成就如果选一个成就最高的那就是2001年发表的“单分子场效应管的研究”。这么年轻，成果又这么棒，当时很多人都觉得这个人获得诺贝尔物理奖是迟早的事儿。


    这儿我先稍微介绍一下场效应管。


    普通人觉得根本就没听说过这是个东西，但实际上现在每个人手里头都拿着好几十亿个，因为就在你的手机 CPU 里，占比最多的结构就是场效应管。


    理想模式下，每一个小管就是一个小开关，它能允许电流通过或者不通过，这就像闸门开关一样，合上就有电流，抬起来就没有电流。


    不过，抬起闸门跟落下闸门，是需要专门的人或者机械臂来操作的，所以这种开闭的动作需要耗费能量很多。


    但是，场效应管的开关就非常节省能量，它有三个引脚，只需要在哪一个引脚给一个很小的电压信号，就足够让它控制大电流的通跟断了。比起那种机械式闸门的效率要高很多，这也是
    CPU 里的开关用场效应管做的原因，因为单位面积它发热小，就可以把更多的管子装进来，来提高算力。


    但怎么往里塞管子也是有极限的，这个极限就是以摩尔定律的规律存在的。


    尤其是当特征尺寸已经达到10纳米的时候，虽然这个闸门是关上了，但因为这闸门太薄了，还会有电流通过。


    比如何最近6年，英特尔一直在经历这种阵痛，往常来说英特尔是这样的，两到三年他们就会升级一次工艺，就把这个特征尺寸缩小。


    但是最近这一次，上一次是14纳米，这一次按说经过3年左右应该到10纳米了，可是实际上这两代工艺用了不是两三年，而是用了6年。


    直到今天，10纳米的工艺产品还没有准备好，据说要到2018年的年底才会批量上市。


    这里的根源，就是场效应管的尺寸实在是太小了，控制开关的那个闸门的宽度甚至只有10几个原子那么宽了。


    在这么小的尺寸下就会出现一种原来看不到的因素，叫量子效应，很多原本在宏观下显现的特性一下都消失了，所以在半导体产业一直有人在担心摩尔定律会失效的问题。


    这个问题在上世纪90年代就是半导体行业的研究重点，他们知道这个极限就是在特征尺寸大概缩到5到7纳米的时候就会触碰到。所以，为了让场效应管能够继续按照从前的原理去工作，就需要找新材料，替代原有的硅、锗、砷、镓这些三族的五族的化学元素。或者重新设计新的结构、新的工艺。


    而舍恩最出名的叫分子半导体，就是在这个大背景下做出来的，而且做出的结果让所有的科学家都吃惊了，因为他只用了一层分子就让这个层状结构表出来场效应管的电特性。而在2011年的时候，他的这个结果超过当时半导体行业批量生产的那种产品非常非常多，当时批量生产的产品最好的情况用到的工艺是500个分子的厚度，而他只用一层分子就够了。


    如果他的这个成果是真真实有效的，那么摩尔定律的极限会从5到7纳米降低到0.5纳米附近，所以，这不但科学意义重大，商业潜力更是巨大的。


    但是重点来了，科学圈内评价一个人的学术成果虽然是看出身的，比如说看有没有博士头衔，或者如果你在贝尔实验室，那对你来说就会有加分。


    但这些只不过是入门的门槛，其他科学家关注一个成果是不是可靠，剩下99%的精华都是放在挨个字抠你这论文的细节。


    比如说单分子场效应管的内容，在《自然》杂志发表之后，马上就有普林斯顿大学的科学家索恩提出了一个问题，他说：


    > 在第第一个实验中，不同温度下的实验结果eraus怎么是完全相同的呢？


    结果《自然》杂志收到了这个疑问就跟舍恩沟通，得到了舍恩的答复是当时粗心，导致这个图放错了，结果一张图放了两遍，这还说得通。


    但是马上又有康奈尔大学的教授麦克尤因就发现，还是这篇文章中，第三个实验中文字表述还是提到了一个引用，引用的舍恩自己在2001年在《科学》杂志上发表的一篇文章。


    可是被引用的《科学》杂志那篇 Ru 文 章里的实验跟当前这个实验是不一样的，文章不一样，实验不一样，测试图却是完全一致的，而且细对比这两篇文章中的测试图，又发现了第三张图，也是同根同源的，只不过是在曲线顶部稍稍做了一个形变。


    我就把刚刚说的这三张图做了一张 GIF，你可以对比一下它们的曲线。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_152_0.png)


    我们当然不用再懂曲线是什么意思，你只需要对比这曲线的形状就可以了，找到我这形状上面的相同点跟不同点，你就会发现它们是来源于同一张图。


    但是实际上，不同条件下用相同的材料做，结果都是不一样的，更何况这几个实验还是在条件都不一样的情况下，用不同的材料做的。


    那怎么可能有这么一致的图出现呢？


    接下来更多的舍恩到处拷贝图表的证据就被...'
