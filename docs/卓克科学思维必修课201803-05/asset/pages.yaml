  md: '# 208 | 遗憾：清朝是怎么对待西方科学的？


    # ——► 概总20：遗憾 ◄——


    中国在明清两朝曾长期和西方科学保持接触，关系有时亲密、有时疏远。有人认为当时的中国没有发展出现代科学就是“遗憾”，而实际上，只是必然，没有什么遗憾。


    # ——► 上节思考题解答 ◄——


    上节课最后，我给大家留了一个问题，就是如果科学家按学科来分类，你觉得哪个分支的大科学家最容易有对神的信仰，最容易相信永生的存在呢？


    这个答案是：数学家。


    为什么会这样呢？


    相信大家也能猜到，因为数学研究到院士的级别，已经不再是跟计算、金融各方面结合的应用数学了，而是纯粹的逻辑证明跟演算的过程，是一个跟现实世界几乎没有对应关系的数学世界。


    现实中的人和物自然就不在数学里，上帝或者其他的神也一样不在数学的世界里，有没有宗教信仰，对数学家的工作没有直接的影响。


    但从事物物理跟生物研究的大科学家中，一定会筛掉一些因为宗教信仰而无法在科学上前行的人。


    所以数学家更信仰神，更相信永生。


    当然，这个答案并不仅仅是从理论上猜的，实际上在那边研究中就有统计：


    对神有信仰，相信永生的数学家，分别是 14.3%信神，15.0%相信永生。


    # ——► 地下传教 ◄——


    那咱们说回上节课的话题，我们说到，科学与宗教表面上产生了冲突，但实际上，冲突的本质不是为了追求真理在观念上协调统一对，而是科学得到了其他人入侵，妨碍了其他人升官，妨碍了国家安全，等等等。


    # ——► 利益带来重用 ◄——


    这种地下传教的窘境维持的时间不久，因为下禁教令的万历皇帝在第二年，也就是1620年就死了。


