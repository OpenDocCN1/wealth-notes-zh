  md: '但是，因为两者之间的强弱差距太悬殊了，


    如果再作一个更形象的比喻，就相当于是否加拉大瀑布汹涌澎湃地轰击下来了，这个时候在瀑布旁边10几公里的小镇上吹过一阵风，而我们担心这阵风会改变周围空气的流动状态，从而改变了尼亚加拉大瀑布的流动方向。


    虽然理论上不能说一点影响都没有，只不过它的影响是完全可以忽略的，所以，雷雨天怎么使用手机都不会遭雷劈的，这个担忧是多余的，从手机诞生起，它就不是一个问题。


    # ——◆ 电网保护到位 ◆——


    而第二个问题，雷雨中要不要拔掉家里的电器插头呢？


    这个说法从前是有道理的，我们刚刚说过，有的雳雷包含的能量相当于100多升的汽油完全燃烧。


    那这么多能量瞬间爆发，都去哪儿了？


    大部分都去了大地。


    但是在城市附近出现的闪电，如果没有劈到地面上，而是半空击中了电网设施，就顺着电网游走。


    在几十年前，吃饱饭都是问题的年代，电网的保护措施很弱，与此同时，家里的用电器，输入侧也几乎没有设置什么保护电路，那这样，一大拨能量最终涌进了家用电器，导致工作电量过高，好多电器就损坏了。


    可是现在不一样了，现在的小区都很完善，入户的10千伏的变电站，那里边就已经设置了非常多的浪涌吸收元件，每个电器在交流电输入侧，也有完善的保护电路，这并不只是企业良心发现加上去的，而是国家在电网标准中，在产品的3C标准中强制要求加入的。


    所以，虽然不能说雷电绝对不会损坏城市中的家用电器，但现在这个问题已经保护到位了，不用再担心了。真要是能损坏的话，那这个雷一定是百年不遇的大雷，先把小区的变电站劈坏了，然后连同家里的用电器也损坏了，这种情况在全世界都是罕见的。


    # ——◆ 今日内容小结 ◆——


    那这节课，我们能得到什么科学思考习惯呢？


    就是在科研领域中有这么一个说法：


    低垂的果实已经没有了，不可能再有什么科学家只需要坐在家里花费很少的资金，就能得到一个震惊整个科学界的理论。任何细枝末节的技术领域都有人 夏得 很深很深。


