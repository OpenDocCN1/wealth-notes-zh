  md: '# 201 | 源头：300年前的科学很主流吗？


    201 | 源头：300年前的科学很...


    # ——● 概念19：源头 ●——


    大学是在社会需求的土壤上生长出来的，它是现代文明的源头。而一个国家强大的标志，是拥有一所世界闻名的科学院。我们需要从文化的角度，带着演化的思维去解读它们的价值。


    # ——● 崇古尚古的主流文化 ●——


    上节课最后，我留了一个思考题，就是结合400年前的背景，你能不能想象那个时候的科学家做各种的实验，或者得到结果之后会怎么想呢？


    其实这就涉及到当时的文化历史背景了。那个时候整个氛围是崇古尚古，外加上度械地信奉上帝。


    崇古尚古主要就是对古希腊巅峰时期的文化成果信奉为神明，比如十四世纪的时候，牛津大学有一条规定，说是：


    读学士和硕士学位的人，必须遵循亚里士多德的哲学，否则每一个出现的分歧观点都会处以5先令。


    如今的科学家都是讲究独立思考与符合实证精神，但这种特质在整个中世纪都是非常危险的。


    上帝在生活中就是更为基础的存在了，就算是听说非常怪异的事，人们也愿意相信世界上已经充满了奇迹跟奥秘，不论好坏，都是上帝一手创造出来的。


    比如说那会儿，如果有一个社会名流说，他得到了一根独角兽的角，那这种言论几乎是没有人不相信的。而且正因为是这位有名的看到的，所以大家更觉得这样的目击者增加了上帝的神奇跟无所不能。


    在那个社会，作为一个学者，最重要的研究是在图书馆跟博物馆观察、整理、做笔记，对已有的知识再吸收、再分类，而不是提出什么新的问题去研究。


    # ——● 小众的科学文化 ●——


    皇家科学院，包括它的前身隐形学院，在当时就是个小众文化，先锋文化。


    皇家学会的会徽上下面一行文字说的就是：


    嘴上说的都是不可信的。


    意大利的西兰托学院的口号就是：


    尝试，再尝试。


    可这些内容当时都属于是惊人之举。


    # ——● 知识的自由传播 ●——


    但是玻意耳如果只解读到了这一步，在当时还是不到位的，也是别人接受不了的，还得加上“救世主向我们保证，赋予比享受更幸福”这一条。


    # ——● 科研不需繁文缛节 ●——


    现在大学跟科学院的区别就在乎于，科学院教学方面的功能比较弱，但是在300多年前，科学院里的价值跟识别那会儿大学里的教育都是不一样的。'
