  md: '# 复习+预告 | 宏观历史


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_160_0.png)


    复习+预告 | 宏观历史


    —— 下周课程预告 ——


    # 关键词：宏观历史


    下周，我们要讲的内容是用宏观历史的角度看人类早期的命运。


    这命运主要由技术决定，而某些技术是否能在computer一个地方出现，又是地地理条件决定的。虽然地理决定论不能解释所有的事情，但用它解释最初的起步还是有充分道理的。


    宏观视角下，用大的时间范围和空间分布观察历史和科技的锥形，能让我们知道文明之所以出现或者消亡的原因。


    235 | 宏观：地理决定论


    236 | 宏观：族群的命运技术来裁决


    237 | 宏观：科学诞生之前的技术大同小异


    238 | 反省：关于青少年捏鼻子的研究


    —— 本周课程复习 ——


    # 概念22：平凡


    在现代科学方面，中国用了150年的时间追上了西方500年的进展。所以当代的中国人难免对科技发展的速度有所高估，把科学当作无比伟大正确的事物。而实际上这是一种偏见，科学没有大家想象的那么完美。客观公正的评价科学，也是一种科学精神。


    +   1. 历法在古代的功能，不管是在中国还是在欧洲，其实都是给人算命用的。 2. 对科学怀着宗教情感的人，总会想尽办法把科学的注事和那些现在看起来已经淘汰的东西划清界限，但这种情结本身就是不科学的。


    +   1. 科学随时都在自我否定、自我纠偏，但在面对巨大利益时，这种能力也会大大降低。 2. 相对于热核聚变动辄几十亿美元的投入，冷核聚变每次都是几百万美元的投入，而一旦成功就是超级暴富的机会，所以一直不乏投资者。


    +   1. 对科学问题来说，就是实验证据和从证据到结论的逻辑演化。证据是不随主观情感改变的事实，逻辑推演更是不随主观情感变化的。 2. 科学圈内部互相间的审查极为细致，一旦发现疑点，作者给不出合理的解释，不论是什么身份，都会遭遇驳斥。


    # 概念23：宏观


    用宏观历史的角度了解人类史，不再纠结于某个事件或化石证据。而更多考虑气候、地理、人口总量、物种多样性等大背景条件，就可以更接近众多文明之所以诞生或消亡的最初原因。科学作为一种文化，也可以从这个视角重新审视。


    +   1. 农业生活，指的是依靠“种植”和“饲养动物”过定居生活的方式。 2. 人类在狩猎采集时期的生活比早期的农业生活更为优越，但随着大型动物被捕杀殆尽，加上新仙女木事件导致大型动物加速减少，之后的升温又让农业制造食物的可能性增加，在诸多因素推动下，人类祖先进入了农业生活。
