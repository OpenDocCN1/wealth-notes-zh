    # ——◆ 磨牙怎么办？ ◆——


    那打呼噜的问题说完了，我们再说说磨牙的问题。


    其实为什么睡觉会磨牙，这个问题医学界都没有答案，是说不清的。所以你之前听说过的，说磨牙就是因为肚子里头有蛔虫，或者缺乏维生素，或者缺钙之类的说法，都是不准确的。


    磨牙一般是在孩子身上高发的，大概5个孩子里面就有1个睡觉是磨牙的，但是他们的磨牙习惯到了成年，全都会消失。所以既然不知道原因，而且它又自行缓解，对磨牙的处理手段到现在也就是治标不治本。


    治标指的是让人们精神放松下来，睡前不要有压力，别抽烟，别喝酒，定期看看牙医，大多数人也不用治疗。但是如果特别严重的话，比如说连牙齿都磨损了，那就得戴牙套保护了。它戴上牙套之后，仍然还会磨，但是它磨的就是牙套了，不是牙，所以危害小一些。


    磨牙、打呼噜，这是两个睡觉的时候常见的问题。打呼噜背后的问题更严重，也是影响很多都市生活的人精力、体力不足的问题，所以需要重视。


    磨牙看似简单，其实在医学界是没有确定原因的，其实这样没有确定原因的小问题还有很多呢，比如修地图舌的问题，就是舌头上出现了很多莫名其妙的花纹，或者是裂纹，嘴里头感觉也是怪怪的。其实这都在几天之后就能消失。这也一样是医学界找不着特定原因的症状。这些问题大都不太严重，有的会自行消失，所以相比其它重大的疾病就没有太多科学家深入地研究了。


    这样病因不明的病还有，比如像精神分裂症，有这样的一个规律，往往是病症的名称之前加了“特发性”，或者“隐源性”，加了这两个词都属于是病因不明的疾病。


    那从这个答疑，大家多少也能体会一下，科学可以给出明确解释的，只有一部分领域，很多领域是缺少系统化解释的。所以，


    好了，打呼噜跟磨牙的答疑就是这样。


