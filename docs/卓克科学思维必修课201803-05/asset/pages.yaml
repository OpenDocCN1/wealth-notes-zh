  md: '# 177 | 纪念霍金：伟大的科学家和科普人


    卓克


    物理学家霍金在2018年3月14日去世了，从其人随后在纪念他，今天我们这篇又会帮你梳理霍金一生在物理上到底做了什么，他的科学成就到底有多大。


    宇宙学是一个比较深的学科分支，大部分内容都是建立在数学结构之上的。所以其实想完全了解霍金的成果，需要比较雄厚的数学基础。


    # | 不录取我，我就把你证伪


    霍金最早的成果就是他的博士学位论文，这篇论文的前半部分推翻了同系教授霍伊尔的“稳恒态宇宙”的结论。


    “稳恒态宇宙”说的是宇宙整个历史都没有经历过剧烈波动，重要的参数，比如尺寸、温度，顶多是小幅地区性的波动，物质是在真空涨落下随机出现的。


