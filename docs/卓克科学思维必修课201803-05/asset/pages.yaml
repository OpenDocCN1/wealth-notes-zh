    # —— 今日内容小结 ——


    好，这节课我们学到的科学思维就是：


    不盲目地因为一个论断里包含了一个科学词汇而采信。


    如果我们一定要对这个论断表达一个认可或者是否定的态度，那我们先不急于说，我们先把陌生词汇查清楚，再看这个论断是不是说得通。


    如果说得通就采信，如果说不通就存疑。


    这种行事风格，做事的方法，在逻辑上并不复杂，它很好懂。难在很少有人会以这样的方式花费时间。而一个人心甘情愿地以这样的方式消费自己的时间，或者说是不是愿意用这样的方式耗费自己有限的生命，那是由他的价值观决定的。


    我们认为高价值的事情自然会首先做，把含金量低的事情往后放。


    那一个人为什么认为这样的事情更有价值呢？


    这就又是一个复杂的问题了，因为影响它的因素众多，其中家庭里的全气氛跟全社会的大气氛最重要。


    # —— 今日思考题 ——


    在你的生活中，有没有遇到过哪些包含了科学专业词汇的错误的常识呢？如果你想到了，就留在评论中。


    # 划重点


    +   1. 不轻信任何结论，也不轻易地否定，是一种科学思维方式。如果我们一定要对某个论断表达态度，那我们先不急于说，而是先把陌生词汇查清楚，再看这个论断是否说得通。\n2.
    科里奥利力，是一种假想力，是在旋转的运动体系中，物体在进行直线运动时因为转动产生的位移偏差。\n3. 科里奥利力只有在类似洋流、气流、云层、大江大河的观察尺度上才能体现出来。


