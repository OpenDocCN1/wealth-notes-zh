  md: '个洞，这个漩涡的方向是科里奥利力决定的吗？


    其实也不是，一个完全平静的水体里，它还是会有各种小的微扰，如果池底出现了一个漏洞，那具体这个漩涡是往哪个方向转，就是由那些你连肉眼都察觉不到的很小的微扰来决定的。一旦这个趋势形成之后，漩涡的方向也就确定了。


    所以，在地球上南北半球平静的水面下出现的漩涡是顺时针还是逆时针，都有可能。具体往哪个方向转，是由水中那些我们都察觉不到的因素造成的影响，那些因素的影响也依然比科里奥利力要更强。


    # 第三个延伸：


    就是科里奥利难道都是那些微弱到无以复加的地步的那些现象吗？


