  md: '子理论，知道了许多物理量原来是有最小单位的，这才导致了我们知道存在一个比电流更为基础的单位——电荷。


    因为它存在一个最小的不变量，近似于一个完全抽象化的逻辑概念，所以由这个概念定义出来的单位，这个单位产生的误差只能来源于测量，而不来源于概念定义的本身。


    就这种方式，用永恒不变量去定义基本单位的趋势，就是后来单位化标准的大思路了。


    在这个思路下，其余几个单位，比如：


    温度的开尔文就不再用水在特定温度下，冰点跟沸点之间的差距了，而是用一个叫做玻尔兹曼常数的不变量来定义。这个常数因为把分子的平均动能跟温度关联起来了，所以在之后应用的时候，尤其是在极低温跟极高温的时候，测量得就更准。


    摩尔这个基本单位形容物质的量，从前是用多少个碳12原子来定义的。在1971年，也就改为用阿伏加德罗常数来定义，它也脱离了具体的实物原子。而这个阿伏加德罗常数，它的单位本来就是“个”，所以摩尔纯粹就是一个已经定义好的数字，它也达到了无限的精确。


    # —— ◆ 今日内容小结 ◆ ——


    那这一系列课，我们能知道什么科学思维呢？


    那就是，


    相对于这种观点另外一种不同的观点就是：


    这个世界是什么样，或者说某某体系是怎么运转的，是可以通过思辨得到真知的。


    其实这么做是行不通的，咱们从这一系列物理单位标准化的过程也可以看出来，换句话说，是各种可量化的物理化学实验构建了世界观。


    没有这些实验，只有思辨式的空想，那就算定义出再多的新词跟它们之间的关联，我们也不会更接近那个更简洁、精确的基础。


    # —— ◆ 今日思考题 ◆ ——


    你认为这7大基本单位今后会不会改成8大单位呢？或者其中某一个变成了其它的单位呢？


    如果你想到了，就留在评论中。


    # 划重点


    +   1. 单位的标准化，使使用物理单位的时候更一致，测量的时候更准确。\n2. 基础单位，越是近似完全抽象化的概念，或是存在一个最小的不变量，那这个单位带来的误差，就越只能是来自测量手段，而不是单位本身。\n3.
    人类对世界能有更为深入的认知，是由可量化的实验和测量推进的。


    卓克

