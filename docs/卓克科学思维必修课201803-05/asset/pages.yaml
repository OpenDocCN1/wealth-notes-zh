    # —— ◇ 网瘾 ◇ ——


    说了这么多毒瘾的事，我们再来看看网瘾的调查。


    美国精神病学会在几年前已经把网络游戏视为是一种新的精神障碍了，关于它的诊断标准已经写入了第五版的《精神病诊断与统计手册》中。


    标准一共9条：


    +   1. 过度沉溺：沉迷于网络游戏（ znac 记先前的游戏活动，或预期玩下一个游戏；网络游戏成为日常生活中的主要活动）；

    2. 戒断：当网络游戏被停止后出现戒断症状（通常被描述为烦躁、焦虑或悲伤，但无药物戒断的躯体征）；

    3. 耐受：对网络游戏产生耐受性，需花费越来越多的时间参与网络游戏；

    4. 失控：对参与网络游戏难以自控；

    5. 失去其它兴趣：作为结果，除网络游戏之外，对先前的爱好和娱乐失去兴趣；

    6. 继续使用：尽管存在心理社会问题，但仍继续过度参与网络游戏；

    7. 误导他人：就参与网络游戏的程度欺骗家人、治疗师或他人；

    8. 作为逃避手段：通过网络游戏逃避或缓解负性心境（如无助感、内疚、焦虑）；

    9. 不惜失去机会：由于参与网络游戏，导致损害或失去重要的人际关系、工作、教育、职业机会。


    2016年的11月份，《美国精神病学杂志》刊登了一篇牛津大学采用这个标准做的调查，一共统计了7个国家18932个成年人，满足这9条中5条或者5条以上的人数占比是总数的2.3%，但这些人仍然不属于网瘾患者。


    是不是网瘾，除了满足这5个或者5个以上的条件外，还要出现显著的，只要不上网，不玩网游就非常痛苦的状况才算。


    但是统计下来，真正属于网瘾患者的是6.3%，这个比例是远远低于赌博行为造成的毒瘾、吸毒行为造成的毒瘾的。


    如果我们把这6.3%的网瘾少年挑出来，用功能性核磁共振的方法观察他们的大脑，是可以发现跟普通人不一致的生理的改变。


    比如说双侧纹状体体积显著减少，左前、左后扣带回皮层上的灰质体积明显减少。这些地方都是处理情绪的区域，如果这里受损，或者明显减少的人，在生活中的表现就是对情感的控制能力下降，缺乏耐心，容易冲动，难以集中注意力；


    还有研究观察到前额叶皮层显著减少的，这些皮层对认知功能起到最大作用，欠发达会让人变得反应迟钝，无力思考；


    再比如儿童时期长期玩网游，大脑中纹状体部分的多巴胺转运蛋白浓度明显降低，大脑只能习惯在网络游戏状态下分泌大量的多巴胺，一旦大脑习惯了这种模式，其他活动对这个少年的吸引力就大大下降了，他只能玩网游才能感觉快乐。


    这些是网瘾中已经找到的确凿的生理变化上的证据。


    其中最关键的就是最后一个，就是


    这个少年就好像是那些被困在笼子里的老鼠，也好像那些被困在越南雨林里的美军士兵，他们只能通过毒品获得快乐。


    # —— ◇ 今日内容小结 ◇ ——


    这节课我们要说的科学思想就是，每个人原本都是有很多自主选择的可能性的，这些可能性保证了我们的大脑不会被某种化学物质劫持，被某种生活方式劫持。哪怕那种化学物质是鸦片听闻的海洛因也是这样的。


    而我们在城市生活中看到的那些瘾君子极难戒毒成功，就是因为他们从大脑上的生理改变到生活模式上的选择已经深陷其中了，很难再脱出。他们的吸毒是全方位地深陷其中，而不仅仅是结交了一个坏朋友，或者某次好奇心导致的。


    所以，为了防止各种瘾对大脑的劫持，我们要提防的就是在少年儿童时期，不要被某种东西限制了行为模式，然后渐渐在生理上都发生了改变，进而整个人深陷其中。


    # —— ◇ 今日思考题 ◇ ——


    虚拟现实，也就是VR，今年已经不再是科技泡沫中到处被提起的词了，但它很可能已经在往更成熟的方向上走，假设几年后，虚拟现实已经可以90%以上模拟3D世界中的东西，你甚至可以看到任何想见的人，很容易让人全身心地投入，沉迷其中。


    那我们要不要提防这种虚无缥缈的娱乐技术呢？


    如果你有什么想说的，就留在评论中。


    # ■ 划重点


    +   1. 毒瘾的形成，除了生理因素外，环境因素可能影响更大。在越南战争中，有20%的美军染上了毒瘾，但回国后，其中只有1/15成了臭名昭著的瘾君子，而其他人在拥有了更多的生活选择之后摆脱了毒瘾。

    2. 网瘾少年在大脑上发生了生理改变，他们的神经元对多巴胺带来的兴奋进入了一种特定的模式，通过其他活动难以带来快乐。

    3. 每个人的生活，都是有很多可以自主选择的可能性的，这些选择能够避免大脑被化学物质劫持。


