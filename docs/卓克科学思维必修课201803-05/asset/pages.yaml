    有同学问，为什么家里宽带已经500兆了，还ರ是上网非常慢呢？不论是开网页还是下载都跟从前20兆没有什么区别。


    简单回答：


    这个问题大都发生在硬件上，可能需要重新买装备才能解决。


    响应总理的号召，现在宽带服务也都是提速降费，不少已经做到了500兆的服务。但因为没有 Rule上很多细节都没有调整，所以有些人花了500兆的钱，结果只享受到了几十兆的服务。


    # —— 选择运营商 ——


    首先就是选择运营商，中国现在的情况是，想要质量最好的服务就选一级运营商，其实现在两家，北方用户选联通，南方用户选电信。而且注意，运营商准确的名字就是中国联通跟中国电信，而不是其他二级运营商。


    比如像电信通、长城宽带、宽带通、歌华宽带、电力宽带等等，这些就是二级运营商。他们经常把自己代理的一级运营商的名字写得很大，有时候经验不丰富，搬家或者装修房的时候，选择宽带就容易看错。


    # —— 光纤接口 ——


    顺着信号的流向，接下来就是光纤入户了。


    # —— Wi-Fi 信号 ——


    那继继续着网络服务信号往下走，就要到 Wi-Fi 信号了。


