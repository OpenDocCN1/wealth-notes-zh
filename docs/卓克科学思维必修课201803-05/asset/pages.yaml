  md: '# 232 | 宏现：人类为什么进入农业生活？


    # ——► 概念23：宏现 ◄——


    用宏现历史的角度了解人类史，不再纠结于某个事件或化石证据。而更多考虑气候、地理、人口总量、物种多样性等大背景条件，就可更接近众多文明之所以诞生或消亡的最初始原因。科学作为一种文化，也可以从这个视角重新审视。


    之前一个系列我们讲了科学这种文化是怎么从古希腊众多学派里，柏拉图跟欧几里得那一支，一步一步传承到今天的。在那之前，全球各地都存在着各种形式的文 Fon跟技术。


    那接下来这个系列，我会给你讲讲从生物学的角度看这些文明又是怎么出现的。


    这部分内容涉及到的思维方式可以用“宏现历史”4个字来概括。


    我们之所以把宏现历史的思考方式放在后期讲，是因为我们已经在前期的课里仔细讲过那些细节了。


    # 这些细节包括：


    +   - 地球气候剧烈变化的系列；

    - 人类祖先走出非洲、走向世界的系列；

    - 复活节岛上的土著系列；

    - 进化论本身也在进化的系列。


    当前这个系列会把以上4个系列的结论串起来。


    # ——► 农业生活定义 ◄——


    今天是第一节，我们要从农业说起。


    关于人类是在什么时候出现了农业？


    这个问题在科学界几乎是不存在争议的，大家都认为是在1.1万到1.2万年前出现的，这种高度的统一，在人类学研究中还是比较罕见的。


    因为那时候世界上各地都居住着人类祖先，他们之间互相并不知道彼此的存在，但也竟然是在同一时间选择了农业生活方式。


    与之相对的就是那些争论不休的观点，比如像人类祖先到底是什么时候走出非洲的，这个就随着考古证据不断地增加，说法从5万年前到9万年前都有。


    可能很多人都觉得农业就是跟植物打交道的定居的生活方式，其实这个观点是错的。


    因为它少了动物的这方面，农业实际包括两大方面：


    +   - 一个是农作物的耕种；

    - 另一个是牲畜的饲养。


    在农业生活出现之前，人类祖先全部都是采用狩猎采集的生活模式。狩猎采集的生活持续的时间远比农业持续的时间更久，如果我们就按人类共同的祖先是9万年前走出非洲的话，人类是先度过了8万年时间的狩猎采集，之后才过了1万年的农业生活。


    可能还有人问，难道没有采用游牧生活方式的吗？


    其实是有，但是游牧的出现比农业还要晚很多，最早的游牧生活比如是2800年。


    知道了这些，我先问你一个问题，人类还会不会在今后的某一个时刻又回到从前狩猎采集的生活方式呢？


    这个问题是有 一个非常确定的答案的，我会在后面给你说。


    # ——► 新的历史观 ◄——


    30年前人们对于狩猎采集到农业这种转变是这么理解的，这种理解可能也是现在绝大多数人知识库里的。


    那就是：


    狩猎采集是一种辛苦的生活方式，整天衣不遮体、食不果腹、疲于奔命、勉强糊口。但是他们在长期艰苦生活 中逐渐积累经验、积累技术，发现有一些种子或者块茎埋在土里会自己长出更多的可以吃的东西来。也发现有一些野生动物是可以驯化的，于是就把它们圈养起来，之后就可以不用费力地长途跋涉追捕它们了。当他们熟练地掌握这些技术之后，人类的生活方式就从狩猎采集转换到农业了。


    这个说法大概就是这样。


    如果你也认同这种说法，那起码说明你在人类历史的大方向上 有认识的错误。这个结论从前当然是通过一些化石证据得到的，但更是由一种陈旧的历史观推导出来的。


    之所以说这种历史观是有问题的，就是因为它缺少进化论的思想，认为历史一定是往越来越先进、生产力越来越高的方向发展，其实实际情况并不是这样。


    最近几十年的考古发掘推翻了这样的历史观，主要是有这几个方面的证据：


    +   - 一个是从采集狩猎的部落制作的工具跟留下的遗迹可以看出，这些祖先对植物的特性、对动物的习性这些相关知识了解得非常丰富，很难想象他们竟然是应付不了种植跟饲养的时候要用到
    的知识。


    另外，他们制作的工具也不比农业生活中的工具落后，像哥贝克的遗迹中，那些祭祀用的器具肯定是要由一部份专门的手工业者打造的。


    所以，这些证据放在一起，很让人怀疑那些祖先是真的没有能力按农业方式生活，还是他们自己主动不去选择农业生活方式。


    # ——► 无法回头的农业生活 ◄——


    人类祖先一旦走上了农业生活方式，需要面对的任务比以前复杂多了，狩猎采集的时候主要就是武器的制造、动物的牵养，还有简单的帐篷搭建。'
