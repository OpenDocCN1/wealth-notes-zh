  md: '# 166 | 泡沫：太空中可以看见长城吗？


    # ——▶概念15: 泡沫◀——


    一项新的科研成果出现，总是会引发很多人的热情，有些人是为了科学欢呼，有些人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    在太空中可以看见长城吗？


    这个问题引发的一节课，可以让我们知道，怎么用量化的方法去消除泡沫。


    这节课里，我们说到的泡沫是什么呢？


    就是太空中可以看到长城这件事，不讲事实，随意夸大，最后成了某种自豪感下的泡沫，失去了价值。


    # ——▶太空中看不到长城◀——


    在2003年之前，很多文章谈到长城都会怀着民族情结提到这么一件事：


    > 说宇航员在太空中可以看到的人类建筑只有三个，长城就是其中一个。


    这样的文章还曾经进入过小学的语文课文，说的是一块长城的城砖在美国博物馆展出，很多大名鼎鼎的人物围观它：


    +   一个教授说，它的历史比美国历史长了10倍；

    一个男宇航员说，他曾经在太空中只见到了两个人类似工程，一个是荷兰的围海大坝，一个是长城；

    另外一个女宇航员还添油加醋地说，大坝没法跟2000年的长城比，因为它更具有历史感，而且长城是人类的骄傲。


    但是这件事，在2003年之后就很少被人提起了，因为在那一年的10月份，咱们国家第一代宇航员上天了，杨利伟在落地之后接受了白岩松的现场采访。


    白岩松第一个问题就是：


    > 你在太空看到长城了吗？


    杨利伟果断地回答：

    没有看到。


    # ——▶被忽略的细节◀——


    但到此，其实我们忽略了很多问题中的细节。


    在太空中可以看见长城吗？这个陈述中，什么是“太空”呢？什么又算“看见”呢？


    太空定义为地球大气层之外的空间，可是


    那从哪开始就算“太空”了呢？


    其实就连现在联合国和平利用外层空间委员会都认为，目前还没有一个确切跟持久的划分标准，但是各国都以人造卫星离地面最近的距离，就是100公里为线，把这个当作是太空的最低界限。'
