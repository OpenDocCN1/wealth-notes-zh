  md: '# 167 | 问答：感冒好了还咳嗽，怎么办？


    167 | 问答：感冒好了还咳...


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 咳嗽不是病，而且是一种保护机制？

    2. 为什么感冒后的咳嗽不能乱吃药？

    3. 如何正确处理儿童感冒后的咳嗽问题？


    有听众问，感冒已经好了很久，但是咳嗽却没停，已经10多天了，这个怎么办？


    # 简单回答：


    对成年人来说，如果不影响正常生活，不用特地吃什么药，但是如果已明显影响到睡眠了，可以吃现代医学中的一些止咳药，如果暂时手里头没有药，可以含一块糖。


    那下面，我来仔细说说咳嗽是怎么回事。


    # —— 咳嗽不是病 ——


    首先咳嗽不是病，它是身体的保护机制，每当呼吸系统的粘膜附着上了不该有的东西，比如说细菌、病毒，它们在感染粘膜的同时，也会引起免疫系统的警觉，对抗机制就是开始大量地分泌粘液。


    这种粘液在气管里就是痰，在鼻腔里就是鼻涕。


    # —— 不要乱吃药 ——


    一个人感冒的病程是7天左右，但是这并不意味着一定要在第7天的時候，细菌、病毒全都没有了，那只是因为它们的数量已经少到了不足以让人类发烧流鼻涕、浑身酸痛的地步，它们还会有少量寄生在呼吸道的粘膜上，所以：感冒之后还在咳嗽，就说明粘膜并没有完全修复，还有致病源在上面，身体还在不断地清除它们。


    所以，原则上，成年人止咳只需使用正规的现代医学的药物，儿童不要吃止咳药，不论什么情况下，都不要用带“复方”开头的药物，不要吃那些药品名称里就包含了疗效的药物。'
