  md: '这个理论说的是：


    潜意识一直存在，哪怕是人们熟睡之后，所以就可以利用人们睡觉的时间给他们灌输一些信息。


    最早的就有加州的监狱在罪犯睡觉的时候给他们播放一些心灵鸡汤的内容，几年后，监狱就说，这种特殊的劳教方式对一半以上的囚犯都起到了积极作用，比如有些罪犯一想起喝酒就反胃。


    上世纪60年代的苏联，在他们的原子能研究中心杜布纳镇也搞过睡眠学习，因为当时的苏联是一个集权国家，所以计划执行得非常彻底，从1967年12月份开始，科学院就要求这个村子里的每个人睡觉前，都要把收音机调到指定的频率收听节目，晚上10点半统一上床睡觉。先播15分钟轻音乐，之后就是一系列的英语课。


    经过一年的实验，科学院报告说：


    杜布纳镇的村民已经在睡眠中不知不觉地学会了1000多个英语单词，并且都已具备了进行简单英语对话的能力。


    美国跟欧洲也有很多商业机构从中渔利，贩卖学习课程跟睡眠学习资料。


    但是学术界针对这些理论做的研究却很难复现宣传中的效果，甚至还有实验是专门粉碎谣言的，他们是让受试者参加睡眠学习训练，受试者被告诉说，等他们入睡之后会放一些让他们变得更有进取心，更加自信的内容。等到这些参试者睡醒了之后，他们都表现出更具控制力，更具自我
    的性格跟行为。


    但实际上，他们在睡觉的时候，研究者给他们播放的是一些让人更谦卑，更忽视自己的内容。这些实验都是正经的临床实验，被试的人都是在脑电波呈现出明显的睡眠特征之后，宣讲的内容才开始播送的。所以这个实验反而证明了睡眠状态下可以接收到的知识量是零。而且这种粉碎谣言的实验一个接一个地可以复现出来。


    和睡眠学习理论有异曲同工之妙的还有莫扎特效应，简单说就是听 A 音乐家的音乐就会反应更快，听 B 音乐家的曲子，注意力就会更集中之类的结论。


    后续也有正经的心理学实验重复了这些实验，发现效果非常难体现，即便出现了也是非常微弱的。


    比如说听完之后，10几分钟内有效果，超过了这个时间段就没效果了。而且，听莫扎特音乐跟听犹大圣徒同时代的重金属乐队铁娘子的乐队产生效果是一样的。但是就算出现了效果，同样的实验也很有可能换一批文化背景的人听，效果又全都没有了。


    但是说这些为时已晚，更多的商业机构打着潜意识的幌子，贩卖变种的成功学跟训练课，这种风潮刮满了全球。


    # —— 今日内容小结 ——


    那这节课，我们得到的科学思维是什么呢？


    就是说一个结论 B 建立在前提 A 成立的基础上，那么 B 可靠与否，其实除了 B 自身之外，还由 A 是不是成立来决定。如果 A 从头到尾都是一个谎言，那
    B 就自动归入到错误那列。


    潜意识营销从1957年爆发传播开始就是一个骗局，后续的各种变种潜意识营销手段，还有诅心之论，听犹大圣徒会导致自杀，还有睡眠学习理论跟它的变种，莫扎特效应，它们都是建立在潜意识营销的基础上，所以一并都是没有什么价值的内容。


    如今我们能知道这些被过度神化的潜意识也是拜心理学这个学科更加科学化所赐，如今优秀的心理学期刊都会要求论文中至少要有4个或者更多的重复性实验，只做过一次实验就得出什么什么效应，然后就刊发的事情，在顶级心理学期刊上已经不会发生了。


    # —— 今日思考题 ——


    我们作为心理学的外行，怎么判断哪些心理学效应更加值得信赖呢？


    如果你想到了，就把答案留在评论中。


    划重点


    +   1. 潜意识营销，从1957年爆发传播开始就是一个骗局，后续的各种变种潜意识营销手段也就都没什么价值。

    2. 心理学已经更加科学化，优秀的心理学期刊，会要求论文中的结论至少要有4个或更多的重复性实验支撑。


    卓克

