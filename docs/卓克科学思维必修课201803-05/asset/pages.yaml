  md: '# 223 | 追赶：科学在中国生根发芽


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_135_0.png)


    # ——► 概论21：追赶 ◄——


    1847年，三名中国学生赴美留学，迈出了中国追赶现代科学文明的第一步，他们之后促成了“留美幼童计划”。留美的幼童人到中年后又促成了“庚子赔款奖学金计划”。这些奖学金培养的人才几乎造就了中国现代科学所有学科分支的创立者，确立了现代科学在中国的位置。


    # ——► 上节思考题解答 ◄——


    上节课最后我留了一个问题，因为整个社会进步了，现在的年轻人获取信息的门槛降低了，只要他们愿意，他们获得的信息跟一个大学教授是差不多的，不再是买得到书跟买不起书造成的
    criter.


    那么，他们在现在的信息落差是不是已经很小了呢？


    当然不是，他们之间依然存在着巨大的落差。这种落差的剧烈程度，不亚于当年留美幼童和大清朝科举制度下的年轻人之间的差距。


    这个关键就是“选择能力”造成的。


    如果作一个比喻，ロジ的落差就像有人一顿饭只有慢头咸菜可吃，而有的人可以吃上一桌酒席。但现在人每一顿都可以吃满汉全席，谁可以活得更好呢？还是说大家都活得很好呢？


    其实大家的差异是很大的，有人就是脂肪肝，有人就是身体健硕。是那些知道怎么吃的人活得最好。


    # ——► 清华学堂的诞生 ◄——


    那我们说回庚子赔款留学这个项目。


    时隔37年之后，依然还是留学美国，但是情况已经大 Autem 了，因为在这37年中，有人听説过留美幼童，所以他们去自费地效仿，留学已经不是一个非常稀罕的事了。第一届开放报名的时候，第一天就来人了1000多人，此后每届如此，再也没有出现过报名不够的情况。


    但是历史不是樊梦的，有一些问题依然存在连续性，那就是26年前导致留美幼童硬性地中断学业的那个问题，就是传统礼法。


    清政府外交部跟留美学部还在这个问题上起了争执：


    +   外交部坚决招收16岁以下的人才，因为他们很多人都是曾经的留美幼童；

    可是学部就要求招收30岁以上的学生，理由是这些人拥有比较过硬的国学素养，出夙之后不会白白浪费钱。


    争执的结果是两部互相拆台，外交部考试得第一名的人在学部里考试得零蛋。后来外交部也用同样的方式对待那些在学部中考考试高分的人。


    争来争去，最后还是解决了，两部一起专门建立了一个留美预备学校，在这里作专门的留学美国之前的准备。大一、大二的课程主要是依据美国大学的预科课程来备课的，优秀的人才在大三可以留学美国。


    当时清政府就把靠近西山的 一座皇家园林，叫皇家五团园给了学部，皇家五团园还有一个名字，叫清华园。改建为预备学校之后就定名为清华学堂，这个就是清华大学的前身了。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_135_1.png)


    清华学堂建成之后，校长选定唐国安，这个唐国安就是38年前第二批留美幼童中的30人之一，他也深度参与了庚子赔款退还的三年谈判，在管理学期间是尽心尽力。


    办学费用虽然是来自庚子赔款的退还，但在武昌起义的时候又遭到袁世凯的挪用，挪到军费里去了。为了解燃眉之急，唐国安去各地的银行贷款，最后硬是从袁世凯的手里把这笔钱给要回来了，才把当时已经关停的学校重新开办起来。武昌起义那年，北京大乱，他购买了一大批枪支弹药，增加学校的保安力量，保证学生上课生活的安全。


    可以说，没有唐国安，清华学堂早就要破产了。


    1920年的時候，唐国安去世已久了，当时英国的数学家、哲学家罗素来请清华，访问过后感叹道：


    > 这所学校的创办者简直是从美国直接搬来了一所大学啊。


    # ——► 科学思想生根发芽 ◄——


    从1909年起，32年里不间断地培养出一大批顶级人才，像北大的胡适，浙大的竺可桢，东南方大学的邹秉文，数学家陈省身，物理学家杨振宁、李政道、钱学森，语言学家赵元任，中国航天的严家淦，都是拿到庚子赔款奖学金出去留学的。


    在这个大背景下，没有拿到奖学金出国的，在清华毕业的人才更多，像侯德榜、邓稼先、钱伟长、梁思成。


    除此之外，还有文科类的专业，像吴晗、季羡林、钱钟书、曹禹。以至于这项庚子赔款退还的奖学金计划，不只让科学技术在之后成为中国主流的文化，文史哲方面的思想也撼动了整个中国的政体。


    1924年的時候，国内因为战乱，美国的第二笔退还给谁都觉得不安定，所以就成立了一个基金，这个基金在8年之后派上了用场，建立了国立北平图书馆新馆，也就是今天中国国家图书馆古籍馆的前身。


    梁诚关于退款怎么使用的建议，后来也为其他国家的庚子赔款的使用作了一个非常好的榜样，其他国家的退款大多也用在留学生或者是建学校上了。


    法国的赔款退还的最少，他们用这笔钱贴天津的望海楼天主堂重建了，其实是因为28年前普法战争开启了，法军不得不勿勿地撤走，所以后来法国一直都没有得及修这个教堂，剩下的钱也资助了几个中国学生去法国留学。


    英国的退款在山西建立了西学专齐，也就是今天山西大学的前身。日本和比利时当时的退款也都资助了一批学生去留学。


    甚至这样的资助模式成熟之后，也吸引了其他本来就對中国文化有兴趣的人，那么他们想把钱花到中国，怎么花呢？


    就是支持留学或者建学校。


    比如说美国的超级第一富豪洛克菲勒家族，他们就在庚子赔款奖学金第一批学生出国的那一年，洛克菲勒考察团来到了中国，最终决定要在北京按照约翰·霍普金斯大学那样，建立一座世界顶级的医学院跟配套的附属医院，协和就是在这个大背景下建立的。


    可以说，庚子赔款相当大一部分用在了培养留学生上，这个比例是大大夸张的，放在清政府或者民国政府正常运营一个国家的规制来说，财政上不可能在这么细分的领域花这么多的钱。但现在，通过一个特殊的形式达成了。


    自从庚子赔款留学计划开始施行之后，10年间的统计，一共有499名学生出国，80%就读的是理工科专业，还有20%的学生是读的文史哲、经济法律的专业，这些人也带动了其他形式的留学。


    有一些省级的公费，也有很多人家是自费的。1917年的统计，在读的留学生一共1170人，已经回国的有400多人。而且你看，这里自费的还明显多于公费的。


    我们后来所说的民国时期的大学者，甚至中国所有历史悠久的大学，学科分支的创立者都跟庚子赔款支持的留学生有关系。


    就拿中国的物理学发展来说，从无到有的第一人是叶企孙，他是清华学堂的第一届学生，后来庚子赔款留学美国，师从加州大学的布里奇曼，留学期间就测量出当时最准确的普朗克常量。


    回国之后，27岁创立了清华物理系，31岁创建了清华物理学院。


    > 学生王淼昌，是中国核物理的奠基人；'
