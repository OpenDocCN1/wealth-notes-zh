  md: '# 236｜宏观：族群的命运由技术裁决


    # ——► 概念23：宏观 ◄——


    用宏观历史的角度了解人类史，不要纠结于某个事件或化石证据。而更多考虑气候、地理、人口总量、物种多样性等大背景条件，就可以更接近众多文明之所以诞生或消亡的最原始因。科学作为一种文化，也可以从这个视角重新审视。


    这节课我们说说，文明的早期，技术对一个族群命运的裁决。


    本来我想用“影响”这两个字，但想了想，最终的后果，要不就是导致一个族群完全被取代了，要不就是导致完全被改变了，所以用“影响”这个词还是太弱，还是用“裁决”这个词更好。


    那你要问，介绍这一段历史知识有什么用呢？


    我想，可能就是用宏观历史的角度理解今天全球的格局。


    # ——► 分子人类学 ◄——


    我们首先要说的是分子人类学。


    我们可以利用化石中的 DNA 信息分析出人类祖先是怎样的顺序，走了哪些道，分布到世界各地的。


    这部分对应的具体知识，在咱们这个专栏第136节到141节课里有详细的描述。


    从宏观的历史看，在6万年前到4000年前这段时间里，欧洲、东亚东南亚和非洲，这三个区域都发生了一个基因族群取代另一个基因族群的大事件。


    我接下来要说的内容，就包含了许多这些族群的代号，都是用字母加数字说出来的，比如说R1群，或者O2a群、O2b群等等，你听着一定会感觉很陌生，完全没有什么代入感。


    但是，这是分子人类学界统一的称呼。


    它的规则大概是这样的：


    我们从线粒体中提取的 DNA 只能分析出母系这一半的传承关系。还可以从 Y染色体的 DNA 中提取出父系这一半的传承关系。


    现在这两种 DNA 的分析工作都进行得很顺利，都取得了很多成果。在这个学术领域，为了大家交流方便，统统都是用编号来称呼的。


    最粗古的就是一个字母，比如说 A族群、B族群、C族群，这第一字母是要大写的；


    在这个DNA的特征基础上继续表现出的差异是次一级的差异，那么次一级的族群就在这个字母后面加一个数字，比如像 A1群，A2群；


    如果在次一级的族群里又出现了分叉，那就在这个数字之后继续加字母，不过之后字母就全都是小写了。


    之后，只要有分叉，就继续在族群的编号后面加数字或者加字母，反正这个顺序是一个字母，一个数字，一个字母，一个数字，只有第一个字母是大写，剩下的字母都小写，就是这样的命名规范。


    所以其实按照这种分类法，现在分子人类学上，每一只发掘出来的化石，只要做了 DNA 的测序，它的族群的编号就都是固定的。


    现在在最最细化的，也就是编号最多的是 O3a2c1a1，就这一长串。也并不是每一个化石，发现的每一个族群都能测这么多，所以一具化石的族群编号是有长有短的。


    这些是基础知识，介绍完了。


    # ——► 欧洲地区的族群 ◄——


    我们来先说说欧洲。


    在3万年前，在欧洲生活的是 I1 和 I2 族群，他们是零零星星分布在整个欧洲的，东西南北都有。


    他们都是以狩猎采集为生的，变化发生在8000年前。


    当时生活在西亚的，已经有大量的农业族群了，他们属于哪些呢？


    就是 E、G、J、T，纷纷就从东往西进入了欧洲。


    我们就不用编号称呼他们了，我们就叫他们“西亚农民”。


    如果把西亚农民这次形容为一次入侵欧洲的话，那么其实这次入侵是很失败的，因为之后西亚农民和 I1、I2 长期生活在欧洲的这些族群，形成了一起生活的状态，没能对欧洲的狩猎采集民族形成生存威胁，反而还给他们带来了农业技术。


    但是带来技术，这些欧洲的原住民学习技术的效果是不一样的。


    I1 族群属于学艺不精，而生活在稍偏东一些的地区的 I2 族群，学得到比较到位。但是像阿尔卑斯山南部的这些族群，基本上一点都没有学会，因为这部分的地理太崎岖了，农业技术的传播也只在东西比较普及。到了欧洲的中部，欧洲的西部普及就很不到位了。


    所以，虽然种族上大家原都 I1、I2 的原住民，但是因为地理条件的限制，生活在中部，尤其是生活在西部欧洲的 I1 跟 I2 就属于是技术落后的族群了。


    这种落后的态势，起初并没有造成什么生死的影响，还是你种你的地，我捕我的猎。


    但是又过了1500年，这一次冲击来了，这次是亚洲北部迁徙来的 R1 族群。如果我们把这次迁徙也当作是一次入侵的话，这次就属于是来者不善了。


    # ——► 中国地区的族群 ◄——


    现在我们转头来看中国。


    最早从非洲走到亚洲的是 C、D 这两支，他们在6万多年前来到现在中国的土地上。


    当然，他们后来还往其它地方走，比如走到了澳洲也，或者是东南亚。这些我们先不提。'
