    那么我们再依据第二个原则，看看单不饱和脂肪酸谁最高，那划一下：


    猪油、花生油 芝麻油、橄榄油、菜籽油，这5种。


    那么两项同时满足的一共3种，就是橄榄油、芝麻油、菜籽油。


    菜籽油是这里价格最低的，也是最常见的经济作物产生的油。所以，


    就算我们完全不选择这3样，只要不是动物油，不是椰子油、棕榈油，其实在成分上的差距跟那些高价的油区别也不大。


    所以这个问题最终还是落在开始的回答上：


    油之间的区别更多是在于口味，而不是在于营养价值和对健康的影响，各种食用油提供的几乎都是纯的脂肪酸。


    食品商宣传的那些东西基本全都是噱头，只要根据我们个人的口味实际情况选择就不会出错了。


    好了，关于油这个问题就回答这么多。


    # 划重点


    +   1. 食用油的主要成分是脂肪酸，一般纯度在99.5%以上。\n2. 食用油中的脂肪酸有三种：单不饱和脂肪酸、多不饱和脂肪酸、饱和脂肪酸。\n3. 单不饱和脂肪酸会清除体内一些坏的胆固醇，而饱和脂肪酸会积累一些坏的胆固醇。\n4.
