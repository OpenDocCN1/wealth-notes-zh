- pgno: 162
  md: '# ——► 动物饲养的条件 ◄——


    说完农业里植物的耕种，再来看一看农业里动物的饲养，这一方面也出现了不均匀的特性，很少有大型动物可以被饲养。


    比如上节课我们就提到过，人类到达美洲1000年之后，体重40公斤以上的动物有80%迅速消失了，现在考古界管这个叫做第四次大灭绝，也就是处处于狩猎采集那个年代的人类祖先，就已经把大部分美洲大陆、澳洲大陆上的动物饲养的可能性给<|start|>灭绝了，这些动物永远都沒有机会了。


    世界上现存的一共有15种大型哺乳动物被驯化了。


    大型，指的是成年体重在40公斤以上的，而这15种里没有一个是源于澳洲的，只有一个是源于美洲的，就是羊驼。


    不过，驯化跟饲养是两个不同的概念，用于驯化的动物不一定全部用于农业饲养。


    # 什么动物能饲养？


    有很多条件，比如：


    +   - 吃得太多，可是产肉太少或者产奶太少，这是行不的；

    - 或者是，寿命太长也不好，因为它总长不大，浪费粮食；

    - 还有，有些动物需要的活动场地太大了，那也不行；

    - 或者是，有些动物脾气太Hor了，也不行。


    用这些条件一卡：


    所有的食肉类动物都被排除在外了，因为它们吃的肉比它们产的肉还要多；


    还有大象也是不能饲养的，因为它本来吃得就超多，而且要养10几年才成年，才能吃它的肉，这等不了；


    像斑马、驯鹿，这些也不行，把它们成群地关在拥挤的场地里，它们就开始互相伤害了，可是饲养场又没有条件设置一个10几平方公里的范围让它跑；


    像河马、犀牛也不行，脾气太大，对人太危险。


    最终筛选出来的，也就是猪、牛、羊、马这些动物。


    不过动物跟植物有一点不同，它可以活动，一个地方假如没有出现合适的饲养动物，并不会扼杀它农业这部分的进展。因为只要交通条件可以，猪、牛、羊、马是可以从周边引进来的，只要把它们引进来，耕种出来的植物就能饲养它们了。


    所以，农业发展的条件和农业发展的进程是被地理决定论所决定的。说农业，这就是地理决定论的典型例子。


    从全球范围来看，东西走向上气候变化的剧烈程度，远比不上南北走向气候变化的剧烈程度更大，所以如果农业开始扩张了，开始传播了，它是更容易在东西方向上延伸的。


    比如说集中在北纬30度附近，别看几大人类古文明，尤其是东方跟西方的古文明，并不知道对方的存在，但是都在北纬30度附近出现了农业。也正是因为陆地主要分布在北半球，所以南半球根本就谈不上最早出现农业这一点说。


    自从北半球出现农业之后，这种生活方式在东西方向上传播更容易一些。


    在南北方向上传播就困难多了，比如说北美假如出现了农业，这种生活方式是很难通过几代人的迁徙，跨越亚马逊的热带雨林，再进入南半球的南纬30度附近，很容易就在迁徙的过程中留在当地，换另外的生活方式了。


    # ——► 课程小结 ◄——


    这节课，我们得到的科学思维就是“地理决定论”。


    我们知道农业最早出现得不均匀，影响因素最大的就是地理条件。


    而农业就代表着新一代的文明形态，所以文明形态是有先有后的，这种优势与劣势，甚至一直影响到西班牙人对南美土著的迫害。


    可以这么说，1万年前的世界格局，还在影响着几百年前的全球的政治跟经济。


    # ——► 课后思考题 ◄——


    你觉得1万年前的世界格局对现在全球政治跟经济影响还大不大呢？


    如果你有想法，就请留在评论中。


    # 划重点


    +   1.人类农业文明的出现，很大程度上是由地理条件和资源状况决定的，因为只有那些环境略微艰苦的环境，才存在适合作为农作物的植物。

    2.农业生活包含两个部分，农作物的耕种与动物的饲养。

    3.从全球范围看，东西走向上的气候变化远没有南北走向那么剧烈，大陆板块又是北多南少，这是人类农业文明集中在北纬30度附近的重要原因。


    卓克

    我是卓克，我们下节课再见。


