  md: '3500戈瑞的照射。


    对食物消毒辐照的值设定是10000戈瑞，那差不多可以这么理解，如果我们用一种强光来照射食物，目的是杀死食物里的细菌，延长它的保质期，但是杀菌的同时因为光强太强了，也不可避免地产生了一些给食物加热的效果。


    食品行业的规定，大概就是加热的副作用不能让肉的温度提升超过3摄氏度。


    其实大家对比一下巴氏消毒法就知道，为什么辐照消毒对食物口感的影响小非常多，因为像巴氏消毒，它就要要求食物整体的温度达到60摄氏度到90摄氏度。


    现在全球采用辐照杀菌的国家有50多个，食品种类有500多种，我们国家是批准比较早的，涉及到的食品除了我刚刚说的泡椒凤爪、脱水蔬菜，还有大蒜、海米、小麦、水果、熟肉产品等等等等。这种技术从1980年起就已经有了成熟的规范，到今天已经是普遍使用了。


    其实用核辐射照射食品不只是用在消毒上，甚至连农业育种上也采用这个技术。


    现在很多缺乏科学知识的人抵制转基因农业，但是如果他们知道，在杂交育种的过程中，为了增加基因突变的速度，那些种子也是要进行核辐射照射的，这样做的效率能大幅提高，从前需要10年才能表现出的差异，在核辐射的照射下，几个月就能表现出来了，所以在转基因农业出现之前，杂交育种里是广泛采用核辐射照射种子的。


    # —— 今日内容小结 ——


    科技越发达，越凸显隔行如隔山，哪怕是普通人每天都能接触到的那些产品，它们是怎么制造出来的，说出来都有相当细致的工艺流程来保证生产效率。


    尤其是食品行业，这些东西都是吃进肚子里去的，1块5一袋的泡椒凤爪也用了核技术，我们不可能几十年如一日地了解每项新技术，哪怕只限于吃进肚子里的那些产品涉及到的技术，我们也是不能穷尽的。


    那我们只要了解：


    那些大规模工业化生产出来的食品，它只会比小作坊手工式生产出的食品受到更严格的监管，它们的一致性跟可靠性只会更高就足够了。


    涉及到的技术，即便听上去有些是挺让人担忧的，但那些担忧只是因为我们不了解那背后更多的知识而已。


    相信大企业、大品牌就会更轻松地融入现代社会，节省大量的时间跟金钱。


    # —— 今日思考题 ——


    你在日常生活中有没有听到过一些听上去有些恐怖的技术，但实际上应用已经是很安全的了？


    如果你想到了，就留在评论中，让其他同学也看看，是不是自己曾经担心过度了。


    # 划重点


