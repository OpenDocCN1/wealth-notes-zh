  md: '# 复习+预告｜西方科学与中国古代文化


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_104_0.png)


    # ——▶ 本周课程复习 ◀——


    # 概念20：遗憾


    中国在明清两朝曾长期和西方科学保持接触，关系有时亲密、有时疏远。有人认为当时的中国没有发展出现代科学很“遗憾”，而实际上，只是必然，没有什么遗憾。


    205｜遗憾：400年前的中国人与《天体运行论》


    +   1. 试图用数与几何描述世界规律的思想，是科学思想的初衷。 2. 现代科学起源于欧洲，是因为欧洲有巨大的科学人口数量，科学思想有足够的渗透率。这也是《天体运行论》只有在欧洲才能发挥推动人类文明作用的原因。


    206｜遗憾：明朝可以产生科学思想吗？


    +   1. 中国古代没能在科学进程上赶上欧洲的脚步，除了我们缺少量化的思维，缺少对形而上的崇拜之外，也跟我们的宗教信仰有关。 2. 宗教的敌人们不是科学，而是其他的宗教，因为早期科学本身就带有宗教的属性，所以就很难被有其他信仰的人接纳。


    207｜遗憾：科学与宗教的矛盾很尖锐吗？


    +   1. 科学与宗教分离的标志，就是我们不再使用宗教理论去解释那些现实中可测量的对象。 2. 哥白尼、伽利略等科学家并没有受到教会的迫害，布鲁诺则是因信仰反对基督教的宗教才被烧死的，实际上，不同宗教之间才存在尖锐矛盾。
    3. 科学是在宗教环境下诞生的，实际上，同时代的音乐、绘画、小説、戏剧，包括人的行为方式，都会被强有力的意识形态渗透。


    208｜遗憾：清朝是怎么对待西方科学的？


    +   1. 明末清初，西方科学曾数次得到政权的支持，原因是带来了足够多的利益。 2. 一种有竞争力的新文化融入到社会之后，会冲击旧有的利益集团，不论是官职还是金钱，既得利益者一定会尽最大的力量反对它。


    # 答疑时间


    209｜问答：冥想和冥修对身体有益吗？


    +   1. 学术界看待冥想对身体的影响，持一种谨慎、乐观的态度，但还没有稳固的结论。 2. 从感性角度分析：一个人不通过药物或者其他设备，能通过冥想完成自我约束、自我情绪管理，是有益处的。
    3. 社会上以“冥想”训练帮助人获得各种益处的机构，都要谨慎对待。


    210｜问答：WiFi网速的“木桶效应”


    在工程领域，处处都体现着“木桶效应”，拿宽带网速为例，从信号的源头到使用终端，如果想要保证足够快的信息流量，就必须做到在任何一个环节都不低于源头的流量才可以。


