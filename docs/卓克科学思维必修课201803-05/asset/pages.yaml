  md: '那你问，什么是显著的衡量标准呢？


    就是今后埋在地层中的这种物质，它的总量能不能达到5亿吨。


    这5亿吨是怎么来的呢？


    其实就是当前人类体重的总和。


    一种生物可以在地球上留下足够丰富的化石证据，只要能够做到广泛地分布在某一个地区就可以了。而人类已经远远超过这条线了，因为人类现在已经做到曾经以极高密度广泛分布在世界上任何角落。所以大概说，几亿年后，我们人类化石的总量肯定少不了。


    5亿吨，如果作为后辈挖掘化石的人可以轻松识别出我们的历史来的标准，那么塑料的情况是每年30亿吨，所以它轻轻松松达标。


    那么这样算来，其实大家也能想到，人类的痕迹远不止是人体化石跟塑料，还有混凝土。这种东西到现在为止，总产量已经超过5000亿吨了。除此之外，还有化石能源燃烧的各种副产品，像炭黑、二氧化碳、泄漏的甲烷等等等等。


    另外，还有一种数量虽然不多，但是比地球平均丰度高了10几万倍的各种稀薄的放射性物质，也是在今后可以被轻松识别出来的。


    全局观看问题大致就是这样，海洋垃圾的影响怎么样？


    往大了说，几亿年后，如果有智能生命体挖到我们人类世的化石层，也会把发现塑料的痕迹作为人类生存过的标志。


    我想，他们一定是极为困惑的，因为在这薄薄的一层里，一切物质的分布都变了天，跟紧挨着的上下来两层不止几种物质是有差异的，而是一切物质本该拥有的连续变化趋势在这一层都消失了。


    好像是曾经某一个魔鬼钻到过地下，特意插入了一层奇怪的物质，专门来迷惑那些几亿年后的高智能生命体一样。


    好了，我们感受了全局观的思维习惯，回答了海洋垃圾污染的情况。


    # 划重点


    +   1. 塑料对海洋污染最严重的原因，在于它的化学结构极为稳定，物理尺寸可以缩小，但化学性质不变，不会被海水分解，也无法被海洋生物分解，永远不会成为生物圈的一部分。
    2. 塑料颗粒会自然地进入海洋生物的体内，进入整个海洋生态系统Defaults的食物链。 而陌生的颗粒会引起生物体各种预想不到的免疫反应，有些还会导致激素的异常分泌。
    3. 用全局和统计的观点理解一个问题，才能把握事情的全貌。


