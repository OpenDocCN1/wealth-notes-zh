  md: '# 178 | 成瘾：大脑中植入电极治疗精神病靠谱吗？


    # ——► 概念15：成瘾 ◄——


    生物大脑中的奖 Grade机制塑造了个体的行为模式和性格，形成了兴趣与爱好，当对这种奖赏产生习惯性或依赖性，即为“成瘾”。加深“化学物质对人的影响”的了解，就会发现，主观意识能够把控的疆域并不很大。


    # ——► 上节思考题解答 ◄——


    昨天我们留的一个问题是，在大脑里植入电极，让人直接感受快乐，这算不算毒品呢？还是说在它出现了几十年后，价格降得足够低的时候，每个人都可以把它当作是一项新技术，新娱乐项目，广泛使用？


    在我看来，这个算是毒品，不论它是不是会影响身体健康，可以确定的是，它会导致一个人的行为模式高度的单一。


    # ——► 电极植入治疗 ◄——


    但今天，我们要讲的内容反而是在大脑里头植入电极，但它并不是有害的，因为它只用于治疗。


    治疗的手段是不是能批准，有一个大致的原则，就是评估不使用它跟使用它的时候，患者的收益是多是少呢？


    +   认知行为疗法、药物疗法、电击疗法。


    # ——► 电极植入手术 ◄——


    这个手术需要在患者的颅骨上钻2个洞，放入直径只有1毫米的电极，位置放准确特别关键，它是需要配合神经纤维束成像技术，也需要病人手术中一直保持清醒。因为一旦放置准确之后，电刺激立即生效，医生需要看到这种效果才能确定是否放置准确了。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_28_0.png)


    2003年，第一次实验性手术，当时那个中年妇女在医生按下了按钮几秒钟之后就突然说，我感觉突然一下心平气和了。医生当时听到这句话，感觉无比欣慰。'
