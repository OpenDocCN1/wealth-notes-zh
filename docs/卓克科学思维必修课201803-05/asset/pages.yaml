    # —— ◆ 本周课程复习 ◆ ——


    # 概念20：遗憾


    中国在明清两朝曾长期和西方科学保持接触，关系有时亲密、有时疏远。有人认为当时的中国没有发展出现代科学很“遗憾”，而实际上，只是必然，没有什么遗憾。


    +   1. 科学想要在一种文明中发展，一是需要自上而下的支持，获得权力合法性和资金；二是需要自下而上的支持，有足够研究科学的人。 2. 清朝康熙年间，因为康熙的极大喜爱，中国古代文化与西方科学达到了前所未有的融合。


    +   1. 中西方科学的发展，在自下而上这个方向上差距巨大，缺少足够的科学人口，也就不存在科学生长的土壤。在康熙去世之后，清朝自上而下的对西方科学的支持也消失了，西方科学也就更不可能融入中国了。
    2. 在科学还与天主教绑定在一起的时候，在其他宗教地区，科学是不可能生根发芽的。只有科学里几乎不再掺杂任何宗教内容的时候，世界其他地区才能够欣然地接纳。


    +   1. 科学的诞生，是以数学为基础的严谨论证，目标是用数和几何图形解释自然规律。 2. 因为与实际用途脱离，所以早期科学思想存活艰难，直到它为人们带来巨大利益的时候，科学思想才得以壮大。
    3. 科学就像混凝系统中涌现出的一种状态，是数不清的因素和这些因素之间的影响叠加在一起产生的，没有确定的因果关系。


    +   1. 科学结论的得出，要经受最为有力的质疑与最为严格的考证，过程缓慢，但一旦成为“定论”，就极为稳固，让后人可以在前人的基础上持续积累。 2. 科学结论，会随着研究的深入有所调整，需要随时核实与订正。
    3. 科学思想诞生于脱离实际的，用数和几何解释世界的逻辑，除了古希腊文明，其他文明都没出现。 4. 李约瑟提出的“中国科学是在文艺复兴后被西方反超”观点，在学术界已经普遍不再认可，我们要避免被情感因素左右。


    # 答疑时间


    +   1. 科技跟科学有一样的道理，就是成果是可积累的，后人总是能够站在巨人的肩膀上。把前人积累的成果充分地利用，再作出来一点点的突破，那就是超越。 2.
    中国芯片产业的出路，是融入全球科技的主流，遵守贸易规范，在我们基础薄弱的时候，自然就会被分到测试、封装这些环节。但等积累了足够多的经验，总会有机会往上提升的。


