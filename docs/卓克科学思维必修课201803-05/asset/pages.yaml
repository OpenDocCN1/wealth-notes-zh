  md: '路易十四本人对科学事业属于是一般热乎劲儿，当初财政大臣与其其他的官员和他分析利害，推着巴黎科学院，他也觉得这是一个很挞的主意，从此之后，批下来的经费就源源不断，但他也只是在科学院成立的那天，跟天文台成立的那天去过两次，之后一辈子，大部分时间都集中在战斗中，再也没有去过科学院了。


    但是幸运好，科学院的资金一直充裕。


    虽然现在世界上已经有了两个科学院，但它们运营起来的规模完全不是一个量级的。


    # —— 缺钱的英国科学院 ——


    英国皇家科学院属于是抱国王的大腿，可是地主家也没有余粮，最初当他要钱的时候他只有11英镑，只能写那么一封推荐信，让英国皇家科学院去其他有钱的大公爵儿子要钱。所以，英国皇家科学院长期以来的特点就是缺钱，运营费全靠会员费。


    所以成立的几十年的时间里，鱼龙混杂了不少不是科学家的人，尤其是各地的游医。


    我们想，那是1700年左右，这个时间点微生物被发现还差着100多年呢，所以那个年代，游医就算他亏医德，就算医术高明，就算他不是有意骗人的，他对人体是什么样的，对疾病是怎么产生的，这种了解是远远不及当时研究物理现象化学的科学家，所以当时英法虽然都有皇家科学院，但完全不是一个量级的。


