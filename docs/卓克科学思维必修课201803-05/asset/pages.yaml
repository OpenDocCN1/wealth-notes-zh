  md: '# 复习+预告 | 注意科学结论的适用范围


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_8_0.png)


    在后台的留言里，我经常看到有同学问，想知道我是怎么有这么宽的知识面的，而且在每一个具体的知识上又总能理解深刻，说想知道我的学习方法。


    说到掌握知识，看书绝对是最好的方法之一，所以，从这周的周末复习开始，以后只要遇到好书，我就会分享给你，希望能对你有所帮助。


    《师从天才：一个科学王朝的崛起》


    这本书是罗伯特·卡尼格尔的著作，书中有一句话吸引了我，是这么写的：


    > “诺贝尔奖得主 P.B. Medawar 在《对年轻科学家的忠告》的演讲中写道：任何科学家不论年纪多大，如果做 Gott重要发现，就必须研究重要的问题。但一个问题怎么才算重要，你遇上它时又怎么能识别出它，要找出以上问题的答案，从书里找是没用的，就算是直接把答案给你都没有，这个问题的答案经常是通过榜样，在不经意之间传递的，通过知名科学家与门徒多年密切共事，耳濡目染，通过晦暗讲出的题外话，咕咕嚷嚷的抱怨，通过一笑笑，通过激动时的惊叹，而使门徒心领神会。”


    因为我每天都在做内容，就越来越发现问出好问题难度是很大的。好的科学成果，当然有艰苦卓绝的研究过程，但都开始于一个好问题。


    比如“鱼为什么在脏水里，身体却可以保持干净？”这样的问题，想一想就感觉很深刻。


    而怎么找到这样的问题，其实大都依赖于科学圈里的人际关系，所以，这本把人文和科学融合在一起的《师从天才：一个科学王朝的崛起》是很吸引人的一本书，推荐给你。


    # —— 本周课程复习 ——


    # 概念15：泡沫


    一项新的科研成果出现，总会引发很多人的热情，有人是为了科学欢呼，有人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    +   1.一种药物，药效覆盖很多疑难杂症，号称可以治疗一些现代医学不能治愈的疾病，均是骗人的假药。 2.现代社会，信息越来越透明，科学越来越发达，监管起来就更方便、更高效，骗子的空间越来越少。
    3.在全球医药领域，异常严格的新药审批流程，以及上市后的持续监管，让FDA有着绝对权威的发言权。


    +   1.除了极少数的个别疾病，只有在一些医疗监管有问题的地方，才会使用放血疗法。 2.放血疗法在诸多古文明中都出现过，最早也算是一种进步，因为那时人类至少已经发现疾病跟人体有关，而不是因为厄运、诅咒和天谴。
    3.现代医学告别了面子、情感、经验，只讲“证据”，只有在可量化、可对照的现代科学的思想下，我们才能作出正确的判断。


    +   1.日常生活中发现牙齿出现问题，几乎只能找牙医解决，没有其它更好的办法，偏方、牙膏等自我治疗方法，都不可靠。 2.牙膏的最大用处就是通过含有的“氟”让牙齿更坚固，美白和脱敏属于效果夸大，防止牙龈出血掩盖了牙周问题，不利于长期的口腔健康，“无氟”牙膏属于反科学。
    3.面对日常生活中的那些夸大宣传，不一定需要特别深入的了解，我们只要知道几条基础知识，就能识别其中的泡沫。


    +   1.很多看似简单的问题背后，往往隐藏着复杂的概念和定义，如果无法定义清晰，就很难得出准确的答案。 2.太空的定义是地球大气层之外的空间，但大气层跟太空之间是没有明显边界的，因为大气层的浓度是渐变的，它是一个连续的过渡。
    3.人眼理论上能看到的东西，必须要满足人眼的最小分辨率，也就是一个物体发出或反射的光，至少落 sentimental 约在视网膜黄斑区上两个紧挨着的视锥细胞上。


