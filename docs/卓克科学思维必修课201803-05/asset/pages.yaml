  md: '# 221 | 问答：怎么问出好问题？


    221 | 问答：怎么问出好问题？


    经常有同学提的问题其实是专栏里刚讲过的，这些问题之所以能问出来，也说明提问的人并不是每节都听过。


    因为就算是《科学思维课》全都听过，去年的专栏《卓有板科研科技》也不一定都听过，听了也不一定都记得。就算是两个都记得，“得到”里还有那么多知识专栏，《每天听本书》《精品课》等，所以我们当然不能禁止别人对自己解释过的问题再提问。


    但有很多问题其实只要在得到 App 首页的搜索栏里找一下，就有很好的答案了，得到 App 这个功能在一年多之前可以说还是一个假设，因为它只实现功能，内容的积累量还不够多。


    但现在已经是非常全面了，因为每一个内容都是高质量的，所以最终搜索结果质量也非常高。如果再积累几年，我估计“得到”的搜索功能可以成为一个小百科全书了。


    # ——► 求知欲 ◄——


    确实只有很少的人对任何接触到的不太清楚的东西都要<|start|>一个明白白。


    # ——► 高质量问题的价值 ◄——


    当然，我们不是每个人都能达到这种程度的，这是需要天赋的。


    但我们至少应该做到对自己感兴趣的，对自己关心的问题，自己动手寻找答案，这是一个典型的科学思维习惯。


    > 一个你想弄明白的问题，如果可以在搜索引擎里找到明确的答案的话，那就不要去问别人，自己找。


    > 如果你问的这些问题实际上在我写的某本书里，都有详细的过程和我的想法。


    # ——► 自己找答案的好处 ◄——


    可能有人要问，这样先查后问，尽量提高质量的问题有什么好处呢？这岂不是浪费自己的时间吗？


    如果非要问好处的话，有这样几点。第一个，是关于这个问题跟它的答案，你会记得更牢靠。


    > 就是那第一次，这是怎么回事，我问问；然后就得到了结果，哦，我明白了。


    > 它不是什么？

    它不是什么？

    它还不是什么？


    那你真的以为看书比较浪费时间吗？'
