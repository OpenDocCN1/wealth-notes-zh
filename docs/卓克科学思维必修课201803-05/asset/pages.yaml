  md: '这个名字都不能直接写到下一行，因为致谢跟签名之间隔出的空白越多，就代表写信人跟收信人之间的地理距离越大。


    所以，晦涩给名人，甚至像伽利略、莱布尼茨这样的人给自己的皇家赞助人写信的时候，都要要有意地把致谢段落写到下一页纸的第一行，然后在这几乎是空白的一页的最下一侧签上自己的名字，这样中间就留足了空白，来说明自己的卑微，没有玷污收信人。


    这一封信里头，开头、结尾、怎么做得到格式正确、怎么能不重样地、文采华丽地把对方吹捧到位，这是非常关键的部分。


    但这些内容实际跟科学研究一点关系都没有，聊恰是地位相当的人，互相写信也要更加多这样没用的话。


    所以从1661年皇家科学院成立之后，以胡克为首，对这种风气发起了抨击，他们反对对格姆追求真理的一刹紧文绉绉，反对一切过度精致的点缀。


    起码，学会的成员之间写信讨论问题，必须是直截开头，就是：


    > 您好，关于独角兽的角磨成的粉是否能固住一只蚂蚁，我的观察是这样的……


    前面就不要加上那么一大堆没用的，结尾也不要恭维奉承的那一段。


    所以，虽然皇家科学院在那个年代的研究做的具体的实验，绝大部分放在现在看都是很荒诞的，但他们的突破相比上一代的人脑子里想的东西是大不一样的。


    英国皇家科学院在那个时候重新树立起一种新式的语言风格与交流环境，只讲干的，求新，只注重实验，鼓励科学家把自己的研究内容公开发表出来。


    但就在这样的思想习惯革新的大潮中，还是有极为保守的大科学家，比如说牛顿就是这样的。那这些内容我们放在下一节课说，下节课，我们来看看着名的牛顿与胡克之争。


    # —— 今日内容小结 ——


    这节课我们从文化历史角度能够得到什么科学上的思考呢？


    就是那些我们科学思维课里常说的，像求证、核实、存疑，不掺杂个人情感讨论问题，这些基本的思考习惯在300年前几乎是不存在的，甚至是那些大科学家，像胡克、玻意耳、托里拆利、莱布尼茨，甚至牛顿都是这样的。


    科学思维方式，是一点一点从利益冲突中演化出来的，科学圈外的人所见到的科学成果带来的实际利益很大，所以逐渐也接受了反天性的思考习惯，而科学圈内的人在追求更大的价值，比如那些终极理论，或者想搞清层层进进的为什么。


    科学思维是从科学家群体诞生的，但之后不止科研才会上用。


    # —— 今日思考题 ——


    在当时科学院搞的实验，绝大部分现在看来都很荒唐，那些内容是怎么被淘汰的，科学院是怎么完成自我优化的呢？


    如果你想到了，就把思考留在评论中。


