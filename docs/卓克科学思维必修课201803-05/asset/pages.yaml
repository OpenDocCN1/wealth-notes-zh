  md: '# 241 | 反省：搞笑诺贝尔奖


    241 | 反省：搞笑诺贝尔奖


    # ——► 概念24：反省 ◄——


    科学是有力的，但内部也有各种问题，这些问题往往还是科学家们自我反省时公之于众的，甚至有科学家会把这些问题当做课来研究。这让科学看起来好像没有那么完美，但这正是科学不断自我否定与完善的过程。


    # ——► 上节思考题解答 ◄——


    上节课最后我给大家留了一个思考题：


    你觉得主流科学家会怎么看待那些做另类的科学研究，获得搞笑诺贝尔科学奖的科学家呢？


    答案跟大家在评论里的留言是差不多的：


    主流科学家对搞笑诺贝尔奖大多是比较认同的，这种认同跟科学家之间互相拆台同行研究中的奇葩怪异产生的认同感是差不多。


    # ——► 搞笑诺贝尔奖 ◄——


    那这节课，我给你讲讲搞笑诺贝尔奖这个奖项的来历，也许会打破你脑中，科学总是那么厚重、严肃的印象。


    搞笑诺贝尔奖的英文是 “the Ignoble Nobel Prizes”，ignoble 是地位低下的意思，所以也可以理解成是不登大雅之堂的诺贝尔奖。


    中国的科学爱好者是从2009年之后才逐渐有人知道这个奖的，这个还要多亏果壳跟科学松鼠会的持续报道。实际上这个奖是从1991年就开始颁发的，到今年已经发了27次。一个没有奖金，也没有官方背景背书的奖项能运营这么长时间，确实是一件挺让人吃惊的事。


    如果你感兴趣，可以搜索关键词，看看这个颁奖仪式现象。大致是这样的，我可以给你形容一下。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_174_0.png)


    # ——► 科学家的自嘲 ◄——


