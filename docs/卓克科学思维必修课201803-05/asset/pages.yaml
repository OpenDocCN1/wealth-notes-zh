  md: '# 228 | 问答：什么是意识？


    228 | 问答：什么是意识？


    意识是什么？


    这是同学们经常问我的一个问题，因为在得到的专栏里，也有许多内容涉及到过意识，像潜意识，冥想的状态，心流，催眠等等。


    而我每次也都是含糊其辞地把意识通俗地解释成：


    你可以语言描述出来的东西。


    但其实这样的回答很令我满意，我也在找各种关于意识的科学定义。


    那么这次答疑，我给大家科学地回答一下，什么是意识。


    # ——► 寻找意识的价值 ◄——


    首先，寻找什么是意识，这个动机并不是为了满足好奇心，或者纯粹为了坐在家中猜一些思辨式的哲学。而是它有实际的作用，那就是为了临床治疗和更好地陪护病人。


    脑损伤的起因有很多，比如象外伤磕着了，或者脑部感染，血液中断的时间比较长的中风，或者酒精中毒，这些大脑损伤之后，其实医生很难知道到底对意识的损伤到了什么程度。


    # ——► 脑电图 ◄——


    但是，现在有了一种新的测量方式来测量意识，对大脑的测量最广泛的就是用脑电图。


