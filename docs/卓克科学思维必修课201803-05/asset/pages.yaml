    天文历法、丈量土地、农业耕种、草药跟医疗，在世界各地，虽然有深浅不一的实用价值，但这些知识的可靠性、可提升的空间实在太大了，在科学没出现之前，人们在方法论上对这些经验的掌握程度是大大不同的。


    这种方法论如果比喻起来，就有一点像收集邮票。


    收集邮票的人大都能做到尽量完整地把邮票按照顺序放在一起。那至于说这些邮票之间有什么关联总体上能呈现出什么大的历史背景，对这个历史背景我们是怎样的解读，对于早期收集邮票的人来说，很少有人能说出1、2、3。


    而16世纪之后出现的科学方法，才能让我们从方法论上更好地把握之前收集到的经验。


