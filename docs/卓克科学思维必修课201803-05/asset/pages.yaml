  md: '# 195 | 源头：大学发展史是一部权力斗争史


    # ——► 概念19：源头 ◄——


    大学是在社会需求的土壤上生长出来的，它是现代文明的源头。而一个国家强大的标志，是拥有Radio 所世界闻名的科学院。我们需要从文化的角度，带着演化的思维去解读它们的价值。


    # ——► 欧洲的大学 ◆——


    在十四世纪的时候，一个典型的综合性大学，学生一入学就要学7门课，是文法、修辞、逻辑、算术、几何、天文、音乐。一个社会里，最顶尖的年轻人应该掌握什么内容，就是这7门课了。


    你发现没有，有4门，像逻辑、算术、几何、音乐，都是跟数学紧密相关的。这些人才积累了200多年之后，现代科学才诞生。


    那相比中国，宋、元、明、清一路下来，社会中那些最顶尖的年轻人，从没有接受过系统化的数学训练，所以这也是为什么西方科学文化多次试图进入中国却没有立足绊的原因，因为文化差异实在太大了。


    +   南欧的国家大都效仿博洛尼亚大学；

    北欧的国家主要效仿巴黎大学，比如牛津大学就是依照巴黎大学的模式建立的。


    # ——► 牛津大学的诞生 ◆——


    英国最早的大学是牛津，如果在网上查一下，都是说英国国王跟法国国王为了争执，英王最终下令大批地把学生撤回国，这些学生就在英王的支持下建立了牛津大学。


    # ——► 剑桥大学的诞生 ◆——


