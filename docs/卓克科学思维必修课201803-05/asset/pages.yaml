    可以说他们学到的科学理论，跟200年前的中学生差别是不大的，那个时候的科学理论就是机械式的，就是决定论式的。


    而新的思想、新的世界观是用几率描述结果，用观测定义存在，用数学描述空间，就所有这些世界观上的重大变化，对他们来说就已经是完整错过了。


    但无论是决定论还是后来的量子力学，或者相对论，哪儿都没有上帝。


