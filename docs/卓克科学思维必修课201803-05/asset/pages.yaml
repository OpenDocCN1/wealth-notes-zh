  md: '# 239 | 问答：海洋中的垃圾污染到什么程度了？


    239 | 问答：海洋中的垃圾污染...


    有同学看了 BBC 的纪录片之后，就提问，海洋中的垃圾现在污染到什么程度了？


    我的回答是：


    这是一个好问题，因为我们可以用这次回答的机会，教大家一种理解问题的agul角，就 estimations 全局观。


    # ——► 严重的污染 ◄——


    我们先从传统的角度回答一下海洋的垃圾污染有多严重。


    带着全局观的角度回答，在人类活动密集的海域，比如说欧洲跟北美的海岸线，每平方公里的垃圾是10万件，其中1件就是指尺寸在2厘米以上的垃圾碎片。


    这大约是一个什么密度呢？


    就是平均每10米长，10米宽的水面就有一片垃圾碎片。这还只是统计的漂浮在水面的情况。如果统计海底的，还会成倍地增加，而且这些垃圾还在快速地增加，增速是每9年翻一番。


    这些可见的垃圾都是很难以分解的，所以长久以来被海水冲刷，慢慢地从大块变成小块。它们主要就是塑料制品、玻璃制品、渔网，和比较耐腐蚀的橡胶制品、金属制品，比如球鞋、球类等等。


    分布的比例是这样：


    塑料跟渔网占了垃圾总数的85%；

    剩下15%是玻璃、金属、纸、衣服、陶瓷。


    其中塑料占比是最大的，因为全球每年生产的聚乙烯是30亿吨，其中的千分之一，最终会以各种形式流入大海。


    # ——► 地质年代角度 ◄——


    但是，以上这些仍属于传统角度，我要说的更大的全局观是从时间上说的。


    具体来说，就是地质年代这个角度。'
