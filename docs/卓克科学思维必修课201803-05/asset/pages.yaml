  md: '# 169 | 泡沫：北半球的马桶冲水都逆时针流吗？


    # ——►概念15：泡沫◄——


    一项新的科研成果出现，总会引发很多人的热情，有些人是为科学欢呼，有些人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    有一些流传很广的说法，听上去挺科学，但是这种很科学的感觉，主要是凭借二个科学名词表现出来的，实际上结论是错的，这些说法可以算是错误的知识。


    有没有什么办法能识别出这些错误的知识呢？


    有，只要这个结论里出现了一个在我们知识体系以外的陌生概念，那就多问一句“这是什么，为什么？”。


    # ——►科里奥利力◄——


    举一个具体的例子：


    那就是北半球的马桶里的水冲水的时候都是逆时针流的，南半球的水流都是顺时针的。


    这个背后的原因就是存在一种“科里奥利力”。


    如果是第一次听说这个名词，科里奥利力，那第一印象就是，这个解释真专业。于是就倾向于相信了这个结论，其实这个说法是错的。


    # ——►假想力实验◄——


    那你跟我一起来想象一幅画面，我们假设处在北京的我向正南方看江西南昌的你，我看着你不顺眼，看你不爽，我瞄准了你，要用投石车扔过去一颗大石头，砸中你。当然，咱们这是假设，实际的投石车是扔不了那么远的。


    # ——►马桶中的旋涡◄——


    我们来算一下，马桶的半径有多大呢？


