- pgno: 181
  md: '这种滥用体现在两点：


    第一，就是没有任何事先的说明，将科学概念从专业语境中完全剥离出来使用。


    第二，使用了科学专业词汇之后，对当前这个科学概念就再也不理了，列出的这个词纯粹就是为了向没有专业知识的读者罗列再罗列。


    比如典型的表述就是这样的：


    我相信我已经证明了拓扑学与结构之间的紧密等价性，而哲学则保持了无限的存在，通过概念，给予潜在的物体以共性。此外，科学放弃了无限的可能，根据功能给予潜在的物体以基准。


    像这样一长串的表达，在具有科学思维习惯的人来看，纯粹就是没有信息含量的文化垃圾。


    在中国的这种情况也很多，只不过并没有发生在文化界，是各种保健商品，各种成功学的大师特别爱把科学名词拿来用。


    # ——► 课程小结 ◄——


    这节课，我们知道了...，其实这个思想应该运用在所有的研究领域。


    抛弃了这个，任何研究领域的成果最多只能积累一代人，很难显出站在巨人肩膀上的效果。


    可能有人听完今天的课，以为索卡尔这个人是在发动理工科攻击文史哲。


    其实正好相反，文史哲的学者反而应该...这才是...必须...只有...别...


    # ——► 课后思考题 ◄——


    你觉得一个文史哲的学者，可以在理工类的期刊上发表跨界的研究论文吗？


    如果你有什么思考，就留在评论中。


    划重点


    +   1. 科学文化，最重要的特征就是可验证，一个论断要立得住，就需要阐述各种原理，摆明各种实验数据，并经受住同行极为严苛的评判。 2. 文史哲的学科历史远比科学要久远，这些学科非常重要，只有剔除其中的糟粕，对认真做学问的学者才是公平的。


    卓克


    我是卓克，咱们下节课再见。


