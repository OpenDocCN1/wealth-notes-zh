    # ——— 杨振宁的童年教育 ———


    先要大致介绍一下杨振宁的家庭：


    他的父亲杨武之年轻的时候毕业于北平高等师范学堂，这里就是后来的北大师，毕业之后回到安徽教书，在1922年，杨振宁只有10个月大的时候，杨武之考上了安徽省的公费留学名额。


