    # —— 本周课程复习 ——


    # 概念19：源头


    大学是在社会需求的土壤上生长出来的，它是现代文明的源头。而一个国家强大的标志，是拥有一所世界闻名的科学院。我们需要从文化的角度，带着演化的思维去解读它们狐的值。


    193 | 源头：第一所大学是怎么诞生的？


    +   1. 古希腊时期，人类文明达到了一次巅峰，但因为基督教的兴起，造成了断崖式的跌落。但成果被伊斯兰国家系统地翻译成了阿拉伯文（阿拉伯翻译运动），文艺复兴运动前，西欧人又将其翻译回拉丁文（拉丁翻译运动），为后来的文艺复兴、科学革命，打下基础。
    2. 拉丁翻译运动中，负责翻译工作的法学院零散分布在欧洲各地，在意大利中北部最著名的一个法学院受到国王的庇护和支持，这就是世界上第一所大学-博洛尼亚大学诞生的背景。


    194 | 源头：大学是一座城邦的荣耀


    +   1. 教会组织了采用自上而下管理模式的大学，由校长、教师委员会主导，只讲教会高度认可的内容。 2. 教会为了跟皇帝竞争，给大学颁发职业资格性质的特許状，意外地促进了欧洲不同大学间的沟通。
    3. 皇帝与教会的博弈，给了大学生太多的特权，年轻无知学生时常闹事，引发了与市民的尖锐矛盾，长达200年。


    195 | 源头：大学发展史是一部权力斗争史


    +   1. 牛津大学的出现是一个渐变的过程，它不是凭空依赖一群学生和几条政令横空出世建立起来的。 2. 剑桥大学迅速崛起的历史文献已经丢失，因为在1261年，市民与拥有特权大学生发生了暴力冲突，图书馆被烧毁。
    3. 大学的发展史，就是一部权力斗争史，与教会斗、与政权斗、与市民斗。 4. 直到社会全面法治化，没有机构再凌驾于法律之上，大学也不再拥有特权的时候，大学才成为社会形态中一个强大、独立、难以动摇的机构。


    196 | 源头：科学院是怎么出现的？


    +   1. 科学史的故事一旦涉及到太多细节，尤其是有些故事为了体现科学家的伟大，就容易让人激动而产生过高的评价。 2. 了解科学史的方法，就是抓住重要的时间点，不论是什么事件，先把时间点看准，就能大致了解这个事情的影响范围和意义。


