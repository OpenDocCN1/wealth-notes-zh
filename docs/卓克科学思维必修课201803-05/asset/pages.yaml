  md: '# 171 | 泡沫：核辐射照射过的食物还能吃吗？


    171 | 泡沫：核辐射照射过...


    # ◄—— 概念15：泡沫 ◄——


    一项新的科研成果出现，总会引发很多人的热恼，有人是为科学欢呼，有人则是希望从中渔利，于是是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    被核辐射过的食物还能吃吗？


    这个问题听上去很自然地说，当然不能，因为核辐射肯定是要尽量避免的。但其实答案是，有些可以吃，甚至我们每个人都吃过几十上百次了。


    这节课，我们通过讲解这个知识点，告诉大家：


    现代社会中因为科技发达，当然很容易出现不少对我们来说是陌生的事物，但我们不必挨个地担心，只要它已经成为了工业体系中的一环，它就是值得信赖的。


    这种思考习惯能让我们更心安，也能给我们节省出大量的时间和金钱。


    # ◄—— 核辐射的危害 ◄——


    我们回到那个问题，核辐射不是有怀疑吗？


    没错，那些害处具体是这样产生的：


    化学元素表里，排名越靠后，就越有可能有放射性，这个放射性是因为质子跟中子并不能牢固地持续地粘在一起，于是有一些能量或者粒子就射出来了。射出的能量，如果打在生物体上会破坏那些分子的结构。


    如果只是一些蛋白质分子改变了结构倒也无所谓，因为错误的蛋白质出现之后，会被免疫系统清扫掉。


    但如果射在了 DNA 上，造成了断裂跟错位，虽然生物体也依然有修复的机制，或者是命令细胞死亡的程序，但是不知不觉的，如果总存在这样一股势力，不断地增加 DNA
    受损的次数，久而久之，有些就能逃过修复程序，逃过了免疫系统的 DNA 的错误就不会断地长出错误的蛋白质，最终就有可能形成癌症。


    # ◄—— 核辐射杀菌 ◄——


    但有的时候，我们的目的就是让生物死亡，因为导致食物变质腐败的就是各种细菌，如果杀菌做得好，之后再给密封好，像一锅肉汤，那就真的有可能10几年都不会坏。


    加热的方法是可以杀死微生物，核辐射的方法一样也可以杀死微生物，所以我们并不是在不经意间偶然地吃掉了核辐射之后的食物，而是在现代社会的食品工业中，本来就有很多食物是要经过核辐射的方式杀菌处理的。


    最常见的像泡椒凤爪，如果你仔细看过食品包装上的配料表，一定会看到四个字，叫“辐照”。还有像方便面里的蔬菜包，那里的脱水蔬菜就是通过核辐射杀菌的。你想，谁一年里头没吃过几包方便面呢。所以实际上，核辐射照过的食物我们不但都吃过，而且还吃过很多很多次。


    # ◄—— 辐照消毒原理 ◄——


    辐照消毒的方法从1980年起开始普及，使用的是钴60这种元素，它会放出 γ 射线，γ 射线其实通俗点说，就是比紫外线强几百倍的一种光线。


    世界卫生组织跟联合国粮农组织，还有国际原子能机构，在批准这项应用之前做过详细的研究，虽然理论上说不会产生什么特别的危害，但是这毕竟属于一种特殊的杀毒方法。


    +   用10000戈瑞以下的平均最大剂量加工任何食品，毒理学上不存在毒性问题；今后无须再对低于此剂量照射的各种食品进行毒性的试验。


    Gy（戈瑞），这个单位反映的是身体组织对辐射产生的热效应的吸收程度，也就是说，虽然辐射多种多样，但是我们希望把它用同一种效果来衡量，考虑到各种能量的形式最终都会转换成热，所以1戈瑞就是1焦耳热量被1公斤身体组织吸收之后的效果。'
