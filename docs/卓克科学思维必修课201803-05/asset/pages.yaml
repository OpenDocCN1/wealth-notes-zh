  md: '这个理论上当然是有可能，但那需要长城座落在一个颜色反差非常大的背景中。比如说四周全都是黑色，只有它发光，而且最好走势还要平稳一些，不要像海岸线那样弯弯曲曲的，否则比较难把长城从背景中挑出来。如果这两个条件都达到了，那么从太空看下去，长城就是一条亮线。


    在2004年的时候，欧洲航天局的卫星在600公里高度的轨道上给地球拍摄全景的高分辨率照片，其中中国的一段仔细辨认之后，他们认为一段弯弯曲曲的长城被发现了。这件事正好发生在杨利伟否认看到长城之后，也引起了非常多的中国科学家的关注。


    但是确认来确认去，最终北京测绘设计研究院用航拍地图跟1：10000的地图作了仔细的对照分析，最终就确认欧洲航天局宣称的“长城”只不过是一条公路而已。


    现实中的长城隐蔽在群山峻岭里，到处是残垣断壁，颜色也跟周围的大山融为一体，一条公路远比长城更好辨认。


    所以最终我们敲定：


    太空中我们看不到长城。


    那些宣扬太空中可以见到少数几个人造建筑的说法，都是不靠谱的泡沫。更有甚者，说在月球上都可以看到长城，那-ak-就更离谱了。


    # ——◆ 今日内容小结 ◆——


    从这节课，我们知道，泡沫可以在各种缘由中产生出来，金钱可以产生，虚荣心也可以产生。


    但是在太空上可以看到长城这个问题中，自从验证了之后，我们国家在相关环节上做得挺好的。杨利伟直言不讳，直接导致了人教版的语文课文的删改。之后一年，这方面的足迹都看不到长城了，我们的研究院也能够...提出了...以免...别人的说法。


    作出这些决定，对中国人来说需要更多一份客观跟理智的勇气，抛开情感跟虚荣心的泡沫，实事求是，这正体现了科学的思考习惯。保持这种习惯，就容易关注于货，剔除泡沫的部分。


    # ——◆ 今日思考题 ◆——


    你见过哪些披着科学外衣，实际是为了满足虚荣心的现象呢？那这个站不住脚的泡沫又是怎样被识破的呢？


    如果你想到了，就留在评论中。


    # 划重点


    +   1. 很多看似简单的问题背后，往往隐藏着复杂的概念和定义，如果无法定义清晰，就很难得出准确的答案。\n2. 太空的定义是地球大气层之外的空间，但大气层跟太空之间是没有明显边界的，因为大气层的浓度是渐变的，它是一个连续的过渡。\n3.
    人眼理论上能看到的东西，必须要满足人眼的最小分辨率，也就是一个物体发出或反射的光，至少能落在视网膜黄斑区上两个紧挨着的视锥细胞上。


    卓克


    我是卓克，咱们明天再见。'
