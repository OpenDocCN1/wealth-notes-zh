  md: '# 193 | 源头：第一所大学是怎么诞生的？


    # ——►概念19: 源头◄——


    大学是在社会需求的土壤上生长出来的，它是现代文明的源头。而一个国家强大的标志，是拥有一所世界闻名的科学院。我们需要从文化的角度，带着演化的思维去解读它们的价值。


    大学是怎么出现的？


    这个问题如果了解清楚，我们会从科学文化的角度感受到演化的规律，这种规律体现在一个新事物的诞生是自下而上出现的，是在一种刚需下才产生的。


    那种由某国国王一时兴起，哪怕是深思熟虑想出来的想法，就算是说出来再好听，如果没有刚需的存在，也会在资源不够的时候，自动地消亡殆尽。


    # ——►大学前身“法学院”◄——


    那么我们从世界上第一所大学——博洛尼亚大学说起。


    它是1088年成立的，但这个时候的博洛尼亚大学只是一个当地的法学研究院，只能算作是一所名副其实的大学的前身。


    那么这里为什么会有法学院呢？


    其实当时整个意大利不只博洛尼亚，像罗马、帕维亚、拉文纳、帕多瓦，各地都有法学研究院。


    这些法学院是培养法官的吗？


    是，也不是。


    负责培养各种行政人才，刚开始只是它们的一个附属功能，因为自从公元300多年之后，打官司办案都是在各地的教会里做的，很多当地的行政官员都有教皇的任命，而这些法学院大都是在十二世纪初才建立的。


    # ——►拉丁翻译运动◄——


    那既然所有的行政司法工作早就有在做了，怎么欧洲各地会出不少法学院呢？


    这就要说到一段不常被提起的历史了，那就是中世纪时候的翻译运动。


    当前咱们看，欧美文化绝对是占了领导地位，它们是怎么走上高峰的，甚至这个角度的研究非常多。


    比如说这一脉的文明水乎曾经不是直线上升的，它是在公元一世纪的时候达到过第一次巅峰，后来又从公元300年开始断崖式的衰落。


    衰落的原因跟基督教的兴起关系很大，那时候凡是不信基督教的异教徒都得死。这在1700年前是比较普遍的，因为那个时候的基督教不像现在这么温和。


    # ——►法学院的工作◄——


    翻译工作由谁做呢？


    就是当时的学者，其中跟文科类相关的内容，尤其是跟古罗马法典相关的内容就都在各地的法学院进行。


    # ——►权力斗争的棋子◄——


    我们说回博洛尼亚大学。


    因为对古罗马、古希腊的内容宣扬比较多，所以博洛尼亚法学院当时是不太受教会欢迎的，而教会这个系统，一直跟神圣罗马帝国的皇帝这套系统是存在激烈竞争的，就是到底谁说了算，谁可以收税，很多职位不需要我授权，这都属于权力之争。'
