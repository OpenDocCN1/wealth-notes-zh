  md: '# 214 | 遗憾：中国科学是先领先才落后的吗？


    # ——► 概念20：遗憾 ◄——


    中国在明清两朝曾长期和西方科学保持接触，关系有时亲密、有时疏远。有人认为当时的中国没有发展出现代科学即“遗憾”，而实际上，只是必然，没有什么遗憾。


    # ——► 上节思考题解答 ◄——


    上节课最后，我留了一个问题，就是有一种说法，说文艺复兴是一个转折点，在这之前，中国的科学水平是超过西方的，转折点过后，西方科学才反超了东方。


    是不是这样呢？


    听过前一系列的课，想必你已经有答案了，不是的。


    # ——► 科学思想 ◄——


    那我们来看看科学思想最主要的成分是什么。


    科学思想在那次转变之后，可以用笛卡尔在《谈谈方法》里的两句话来形容那种思维方式的精华。


    # ——► 中国文化的根基 ◄——


    而中国文化在最近2000年来，一直奉行的是儒家思想为上，儒家思想的代表孔子最想做的是复兴周礼。


    # ——► 李约瑟难题 ◄——


    可是这个假设，我们确实是经常听说的，而且它还是大有来头，这就是著名的科学史家李约瑟，这个观点就出自他的著作《中国科学技术史》里。


    最著名的李约瑟难题就是：


    尽管中国古代对人类科技发展作了很多重要的贡献，但为什么科学跟工业革命没有发生在近代中国呢？'
