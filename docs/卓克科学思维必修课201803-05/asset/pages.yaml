  md: '科学上的大背景是1850年代，世界科学中心正好在经历从法国到德国的转移，法国在这一前70多年时间里，学术界发生了比较大的变化，大批政府的要员的科学素养很高，不论是军事院校、医学院或者是工学学校，都特别重视科学教育。可以说，法国的科学文化就是在那70年里，从皇家走向的社会。


    但是，在法国之前的科学中心是哪个？


    我们也得提一句，那之前的中心是英国，开始的标志是牛顿奇年轻年。


    等到英国广泛地把蒸汽机使用在纺织业上的时候，才被法国取代了中心的位置。也就是说当清朝第一次有人出国留学的时候，蒸汽机时代已经是一个成熟得不能再成熟的工业了，甚至都要被下一拨的技术取代了。可是蒸汽机这个技术在当时中国基本是没有应用的。


    那么我刚才说的1850年代正好是经历了世界科学中心从法国切换到德国，这个标志是什么呢？


    就是德国教育体制大变革，大学的功能出现了一个90度的大转突，没有180度。在这次切换之前的大学都是博洛尼亚大学或者是巴黎大学的底子，这种大学它只能是勉强地完成给高等人才打知识基础的功能。


    如果统计一下，在1850年之前的重大科学成果，基本上都不是在大学里出现的，基本都是毕业之后在科学院里做出来的。而且，那些伟大的科学家在科学院做研究的时候，往往还感觉大学的课程是如此的僵化跟老旧。


    而就是从德国的洪堡大学建立之后，这种情况才转变的。


    # —— 今日思考题 ——


    这节课我给大家示范了，在科学发展的大背景下是怎么看一件事情的。


    那么为了把握一件事情，我们还能把什么作为一个大背景去看一个历史事件呢？


    如果你想到了，就把思考留在评论中。


    # 划重点


    +   1. 观察历史大事件的时代背景，是把握历史真实影响的重要观察方法，再伟大的事件，也超不过时代的限制。 2. 容闳虽然毕业于耶鲁大学，但1850年的耶鲁大学的关键词是保守和宗教，主要功能是培养教师和传教士，与欧洲的现代大学有很大的差距。


