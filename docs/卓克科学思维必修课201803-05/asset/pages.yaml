  md: '# 226 | 平凡：如何科学看待四大发明？


    # ——► 概念22：平凡 ◄——


    在现代科学方面，中国用了150年的时间追上了西方500年的进展。所以当代的中国人难免对科技发展的速度有所高估，把科学当作无<|message|>


    这节课我们说说一起提到中国科技，绕不过去的四大发明。


    这是一个知识应该随着地核实跟进订正的反例，它从提出之后就成了一种象征，一个符号。


    直到2000年之后才有具体的讨论，讨论结果就是：


    四大发明里，两个半可以成立，一个半只是传说。


    # ——► 四大发明的由来 ◄——


    四大发明指的是火药、指南针、造纸术、活字印刷术。这是李约瑟在二战的时候，在中国考察发表的观点。从1943年起，四大发明起码在国内是叫响了。


    # ——► 新四大发明 ◄——


    互联网出现之后，争议四起，极端反对四大发明的人甚至得出结论：


    这四个一个都站不...(略)


    # ——► 司南不指南 ◄——


    那我们先来说说那个一半站不住脚的。首先，就是中国古代的指南针，就是司南。


    # ——► 活字印刷 ◄——


    那么我们再来看看那半个，它是可以正常工作的，是活字印刷，但它是不能实用的，所以算它是个半个。'
