    # 划重点


    +   1. 痛风，是血液中的尿酸浓度过高，在关节处形成结晶引发的炎症反应。 2. 尿酸是人体在代谢嘌呤的产物，我们吃进去的食物只要含有细胞，含有遗传物质，就一定含有嘌呤。
