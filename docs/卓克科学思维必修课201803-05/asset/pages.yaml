  md: '# 216 | 问答：巧克力是如何风靡全球的？


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_119_0.png)


    216 | 问答：巧克力是如何风...


    # —— ◆ 特别通知 ◆ ——


    得到 App 想带给你更好的学习体验，即将发布让你能够自定义学习计划的新版本，帮助你提升学习效率。


    过几天开始，专栏最新文章的更新时间会统一改在每天的 0:00，到时候全站都会有相应的通知，为你详细讲解新版本的使用，谢谢你的理解。


    之前课里我们说到康熙对西方科学一直很感兴趣，很多西方的东西他都是中国第一个接触的人。有同学就想问，都有些什么？


    比如说莱布尼茨就送过他一个机械式的二进制计算器，到现在这个东西还保留在故宫博物馆里。


    那除了这么高大上的东西之外，还有巧克力，中国第一个吃过巧克力的就是他。


    那么这次答疑，我们就深挖巧克力的历史，跟康熙吃巧克力的故事。


    # —— ◆ 可可与可可碱 ◆ ——


    其实直到很晚，咱们中国人才知道，巧克力的原味是什么味，因为从非洲跟南美运过来的，运到食品公司的那些原料就已经是二次加工后的原料了。


    可可树只能长在潮湿闷热的赤道附近，这可可树大概有10米高，上面结的果实有橄榄球那么大，果壁非常非常厚。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_119_1.png)


    而且其实最早人们吃可可果主要是吃这个厚厚的果壁，这上面有果肉，这个才是最好吃的，酸酸甜甜的，非常有嚼头。


    用刀把这个果实切成两半，中央就像蒜瓣一样大小的种子，大概会有几十粒，外面都包裹着厚厚的粘粘的白色粒液，这个种子就是可可豆了。


    如果直接吃的话，跟吃苦杏仁的味道其实差不多，可以说是难以以下咽。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_119_2.png)


    但是有这么一个规律，种子里总是包含着这种植物今后最后萌发的时候所需要的营养物质，所以它是很营养的，很容易被其他动物当作食物，所以种子要尽量地保证自己在萌发成一株幼苗之前千万不要被别人吃掉，不要死掉，尽量地在保护自己。


    所以，很多种子都有硬壳包裹着，假如没有外壳保护，那一般来说都是有毒的。但对人类来说，总有办法搞定这些阻碍，吃到里面的营养物质。


    比如说可可豆，它就没有硬壳保护，所以它是有毒的，这毒素就是可可碱。


    这种物质对绝大部分的哺乳类动物都是致命的，比如现在有很多宠物饲养的小贴士里还专门提醒人，就不能让猫或狗狗吃巧克力，或者是含巧克力的饮料，也不能让它们接触，那就是因为这里头有可可碱。这种物质被哺乳类动物吃下去之后，会造成心跳过速，肌肉僵直，这都是影响神经系统的。


    但可惜的是，灵长类动物是可以代谢这种物质的，所以最早在赤道附近生存的人类祖先，等把可可的果肉都吃完之后，还强忍着苦味继续吃那里面的种子。


    假如我们能把可可豆里的苦味完全去掉的话，其实它的味道跟杏仁还是有点像的，因为它含油脂超过40%，是一个很好的能量来源。所以可可作为一种可食用的植物，在最初就是这种形态。


    # —— ◆ 风靡欧洲 ◆ ——


    在2011年的时候，人们发现了4000年前玛雅人最早食用可可的记录，不过可惜，那会儿的玛雅人只是吃可可果肉的，而且他们还把多余吃不掉的果肉给保存起来，用那个又酸又甜的果肉酿酒。


    欧洲人第一次知道可可豆的存在是1519年，那个时候科尔特斯船长就率领着西班牙舰队开到了中美洲，当时的目的是为了寻找黄金，那个时候是玛雅文明末期，阿兹特克人的时代。


    双方最初遇到的时候还是以礼相待，阿兹特克的国王就以贵宾的级别接待了科尔特斯船长，当时请他喝的饮料就是巧克力。


    但是后来事情，大家也都知道，双方是激烈拼杀，西班牙的军队在装备上精良，阿兹特克人是地热熟悉，而且精壮旺盛，西班牙士兵就发现，敌人士上战场之前，都要喝巧克力，但是和招待他们的时候喝的不一样，他们上战场之前喝的加了玉米粉、辣椒粉跟可可豆磨成的粉。


    当然最后，几百万的阿兹特克人就被枪炮跟瘟菌杀光了。


    这之后西班牙人就对可可豆印象深刻了，他们发现这些豆子就是可可果的种子，当地人一般这么处理：


    +   - 先把种子裹在树叶里发酵，变成黑褐色之后苦味会减少很多；

    - 然后就在太阳下暴晒，等完全晒干之后再磨成粉。


    据说阿兹特克最后一个国王，每天是不喝白开水的，全都喝这种饮料。


    后来殖民者从玛雅人的文字记录里可以看到，阿兹特克从前是专门在做宗教祭拜的时候，大家是集体喝巧克力的，巧克力这个发音就是阿兹特克语中“苦水”的意思。


    世界各地的人都有祭祀神灵的活动，几乎每个宗教崇拜的仪式都有服用草药的记录，主要目的就是让大家进入到另一种世界，进入到另一个精神状态，就会增加这些仪式的神秘感、使命感。在那个世界里一般都是神灵居住的世界。


    所以，阿兹特克人在祭祀的时候把巧克力是把它们当作一种致幻剂，一种兴奋剂使用的。


    而且可可豆当时在阿兹特克的部落里相当于现金，比如收税的时候就可以收取干的可可豆，这个东西保存的时间很久，在当时的自由市场里一个豆能换一个新鲜的梨，两个豆能换一个鸡蛋，30个豆可以换一只大兔子，50个豆可以换一个女奴隶，100个豆可以换一只大火鸡或一个男奴隶。这东西现金是非常方便的，容易携带还容易找零。


    当然有现金就有假钞，当时的犯罪记录里也有人是用黑色的泥巴再混上可可粉，搓成可可豆的样子，而且味道闻起来还很正，用它来冒充发酵干燥之后的可可豆。当时对这些造假币的惩罚就是腰斩。


    这批西班牙人最终把阿兹特克人全部消灭了，延续了几千年的玛雅文明就此灭亡。


    这些殖民者本意是想淘金的，金子虽然没挖到，但是他们发现，这些可可豆是堪比黄金的。


    先就给西班牙的国王带回一些可可粉，也顺便带了一些可可果。他们当时就计划，假如这些东西能在我们欧洲种就更好了，结果两者都没有如意。


    西班牙国王照信里的方法冲了一杯，用嘴一抿，好家伙，什么东西啊这么苦，根本就喝不惯。那些可可果的种子种下之后也活不了。


    可是国王不喜欢，其他皇室成员没那么快地放弃，有人就按照自己的喜好往里面加了点蜂蜜中和这个苦味，这一下就品尝到了可可的香味，尤其是当用热水冲的时候，这个香味马上就散开了，接着10几年的时间就流行开来。


    西班牙人就发现，这种东西只能生长在热带，所以在中美洲圈禁大量的奴隶种植可可，这一下造成了土地贫瘠跟严重的疟疾害，中美洲的可可树大面积地枯萎。


    西班牙人又凭借着自己拥有环游世界的力量，带着可可果去世界各地的殖民地都试种，结果在南美的委内瑞拉，东亚的菲律宾跟非洲的科特迪瓦，可可树扎下了根。


    到了现在，这几个地方已经成了全世界可可豆的最主要产区。


    这个饮料在之后就快速地风靡整个欧洲，西班牙在之后的几十年里就靠卖巧克力就赚了非常多的钱。


