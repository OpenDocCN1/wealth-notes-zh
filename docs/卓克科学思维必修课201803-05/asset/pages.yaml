  md: '就是这些“小钩子”，让新信息没有过快地被遗忘，而听书的过程中是没有这个过程的，你必须按照它的节奏走，中间不能停。


    所以，自己思考、探究、寻找答案时，你对大体将处理完，你就能更加深刻地记住它，如同你学了它。


    自己找问题的答案第二个好处，就是你在别人眼中，不再是一个能问出简单问题的人了。


    我们假设，当你的一个问题把百科全书式的人物问得都要查一查再说话，那你在百科全书式的人心中就比普通人份量要重。你经常问这种问题，他就不断地提高对你问题的重视程度，因为这里很可能就有让他感兴趣的内容。


    那这样高质量的问题是什么呢？


    我可以给大家举一个例子，当然这是科学上的，实际在商业中、人际关系里一样有的是好问题。


    这个科学问题是什么呢？


    就是：


    人类基因为什么如此少？


    这个问题别看只有10个字，但已经蕴含了非常丰富的前置知识点。


    比如说，既然都已经问出人类基因为什么如此之少了，那问问题的这个人，一定知道相当多种的基因的绝对数量是多少，而且还知道人类的基因数量在相当多物种的基因数量上的统计中，人类是算多的还是算少的呢？


    你看，这就是不少信息量吧？


    另外，只要这样问了，提问的人对基因的定义大概率也是认为：不能合成蛋白质的序列是不算基因的。


    对基因的概念学术界是有争议的，所以从他的提问，我们也可以看出他的大概前提。


    你看，仅仅10个字，其实背后已经对分子生物学最近10几年作了一个综述，然后才能提出来。


    假如一个人问出这样的问题，你说一个生物学教授会认为他是一个小白吗？


    所以，在很多场景下，不发问的人可能完全是在浪费时间的。问问题的人，会让人对你的评价：


    问问题的好处还有很多，但究其根源，其实都是因为思考带来的好处，尤其是那些基于事实跟证据的科学思考。


    # —— 今日思考题 ——


    假如杨振宁的那场演讲结束了，你想问杨振宁先生什么问题呢？


    如果你想到了，就留在评论中。


    # 划重点


    +   1. 自己找答案的好处，一是可以记得更牢固，二是在找不到答案而有准备地提问时，能够得到被提问者的重视。 2. 影响记忆效果最大的，是新的知识点与旧有的知识点的关联的强弱，寻找答案的试错过程，就是知识点被巩固的过程。所以，自己搜索答案的时间没有被浪费，而是有效地用在了记住这个新知识点上了。


