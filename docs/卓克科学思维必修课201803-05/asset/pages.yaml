    破除这种误解的同时，我们再往深了想想，这就说明宗教跟科学是协调统一，甚至宗教是科学之母吗？


    也不能这么说。


    因为在现代科学诞生之前的年代，天主教是当时文化中最为强大的力量，强有力的意识形态渗透到生活的方方面面，音乐、绘画、小说、戏剧，包括人的行为方式，等等等等。


