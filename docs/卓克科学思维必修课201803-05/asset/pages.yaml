    这个时候正确的处理办法就应该是把垃圾彻底清扫出去，把厨房的墙面、地面，用刷子、清洁剂彻底刷干净。


    但是有人却偷懒，买了两瓶空气清新剂，全喷了出去，然后在垃圾堆上盖了一层塑料布，眼不见心不烦，也闻不见臭味了。


