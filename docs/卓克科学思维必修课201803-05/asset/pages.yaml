  md: '# 191 | 问答：新的人体器官被发现了？


    有同学问，说这有个科学研究新闻，说是发现了一个新的人体器官，这是不是证明了经络的存在呢？


    简单回答：


    这只是科学研究中的一个细枝末节的发现，跟经络一点关系也没有。


    # ——♦ 问质网络 ♦——


    那我们先来简单回顾一下这是一个什么发现。


    这个是纽约大学医学院跟纽约大学隆格伍卫生中心做的研究，他们认为：


    人体组织里广泛分布着“间质网络”（interstitium），在皮肤下，在内脏间都有，间质里还有水分，而且水份的含量能占到人体总含水量的20%，所以间质这种东西很可能是超过皮肤，是人体最大的器官。


    间质这种器官实际上有一点像网格一样，每一个格子里都充满了液体。


    ![](img/2a007d9b2edf272f0ffcba41cd9344f7_58_0.png)


    上图是胆管管壁上的显微图。


    管壁之所以可以支撑起一个管道的样子，没有塌陷，就是因为有这样的结构支撑，这些支撑，我们叫它结缔组织。


    其中，


    许许多多间质综合在一起，形成了间质网络，胆管的管壁是这样，其实凡是起到了支撑结构的结缔组织，显微结构都是这样的。


    间质均匀地分布在身体各处，内脏与内脏之间也有。


    所以，这组科学家就认为，它是一种新的器官。


    他们的理由是，以前使用传统的显微镜观察浑组织的时侯，都是要切成薄片的，有的时候还需要染色，就是这些步骤会间质脱水死亡。从前的办法看到的间质都是失水之后完全塌陷的样子，于是就没有人认为这是一个独立的器官。


    而且这个研究里说：


    对间质的深入研究能帮我们了解癌细胞是怎么扩散的。因为癌细胞晚期的时侯，细胞会突破器官的边界，它就要首先跨越间质，所以间质形成网格，很可能就是癌细胞扩散的一个途径。


    # ——♦ 间质网络与经络无关 ♦——


    这个新闻发出之后，马上就有人说，这是中国古人早就发现的经络，终于被证实了。


    实际上，仅仅从描述中咱们就可以知道，间质的样子一定是那种二维的薄层，对皮肤来说，皮肤长什么样，那下面填充的间质大概也就是那个样，内脏还有内脏另外的填充。


    非要比喻的话，咱们可以用鸡蛋，就像剥开这个鸡蛋硬壳，在壳跟蛋白之间还有一层膜，这就是一层间质，然后继续往下，把蛋黄剥出来，蛋黄的表面也有.utils膜，间质一定是膜一样的东西，它就是以这样的形式存在于每个器官的支撑结构之中。


    可是经络不是这样，就算是 prayed古代那些语焉不详的描述中，也是线状、条状的，否则怎么可能有奇经八脉的说法呢。


    所以仅从这点看，它们根本就不是一个东西，连相似性都谈不上。


    # ——♦ 经络理论的来历 ♦——


    经脉是什么呢？


    血管全身分布的准确图，要到1700年之后才会出现。


    中国古代没有条件，也没有能力做到准确的探测。加上淋巴管的干扰，所以经络描述的东西就是那些主要的，肉眼可以分辨的比较清晰的大血管跟大淋巴管，再把那些阴阳五行的很多理论覆盖在其中，就形成了一套描述含糊的神神秘测的理论，就是经络理论。


    我们当然不能责怪古人，因为在经络理论形成的时候，全世界没有任何一个文明对血管的细节有准确的描述，全世界也没有任何证实的思想，也没有人有意识地约束自己没有答案也硬要凑出一个答案的冲动。


    这样的错误主要发生在后来，就是当科学出现之后，医学进展之后，那些落后的东西本该是拍哦历史的，可还是抱着不放。


    之后，我们有一个大系列是讲科学的来历，你听过之后也会知道，为什么有些人对这些落后的错误的内容抱着不放了，它的根源不在于思维，而在于经济利益。


    # ——♦ 科学界的态度 ♦——


    那我们再说说这个研究，因为我查到的所有中文媒体，都在喊发现了新的器官。


    但实际上，


    简单说，这是一个非主流的成果。


    具体来说：


    结缔组织里有间质，间质里面有液体支撑，形成稳固的结构，这件事恐怕很久以前，100年前，大家就都 mantle 了。


    大家也可以从道理上想一想，一个比心脏、肝脏还庞大的器官竟然到了2018年才被发现，之前竟然整个科学界都没人发现过，老天就这么眷顾这几位同仁嘛？


    所以，它的问题根源是出在什么才算是器官。


    不知道当你看过这样的标题——“科学家发现了人体新器官”，看见这个标题之后，你的脑子里会不会有意识地谈下来，仔细地过一遍，刚刚讲过1个小时，有没有你没懂的点？


    这个关键问题就是——什么算作器官？


    科学界对器官的定义就是：


    由不同的细胞跟组织构成的结构，用来完成特定功能的系统。


    你看这句话，本身就是一个定义含糊的句子，因为不论我们按什么标准分，我们总能把细胞与细胞区分开，总能给特定的组织找到它的功能点。


    所以这个研究的现状是，除了参与了这项研究的...医学界其他人对这个成果的态度大都是哑口无声。但是哑口无声属于此处无声胜有声，在我看来是一种强度较弱的反对。


    毕竟，这种充满液体的网格根本就不新鲜，不是什么新发现。就好像我在中国江的出海口发现了一块浅滩，结果我将，发现了一个人类从未发现过的新大陆板块，你说这能算吗？


    主流医学界不认为这种组织能算作一个新的器官，如果这个也能算新器官，那其中每一个网格也可以算作一个新器官呐。还有，像皮肤上的毛发，也... 如果这么算，那器官就无穷无尽了。


    # ——♦ 研究的真正价值 ♦——


    那这篇文章为什么还可以刊登呢？'
