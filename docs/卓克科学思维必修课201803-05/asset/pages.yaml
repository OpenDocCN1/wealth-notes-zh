  md: '# 181 | 谬误：全球变暖为什么不是谎言？


    # ——► 概念17：谬误 ◄——


    有些结论因为科学证据不再准确，有些观点在宣传中没一再夸大，抓住其中可以量化的部分进行验证，或者寻找归纳的一致性，就能识别出其中的谬误。


    全球变暖的理论经常遭到质疑，这节课我要用科学思维帮你分析，为什么全球变暖不是谎言，不是政治阴谋，也不是小众理论。


    这个科学思维的方式就是：


    评估结论的一致性。


    # ——► 对全球变暖的误解 ◄——


    全球变暖这个词，很多民众都误解了它，把它当作是下雪少了，或者是天气预报里的温度升高了。所以当他们一发现反例，就言之凿凿地怀疑起全球变暖。


    我查了一些数据给大家，各位同学可以感受一下，比如：


    +   2015年2月份，纽约遭遇了寒流，创下了63年以来最低的温度记录；

    2009年11月初，寒流刷新了中国7个省初次降雪的最早记录；

    2008年初，亚洲的寒流给伊拉克带来了120年以来的第一场雪，也给西伯利亚地区带来了130年不遇的强暴风雪；

    2006年1月份，捷克出现了66年以来最低的温度记录，莫斯科更是出现了80年以来最低的温度记录。


    除此之外，还有最近两年轻江以南的冬天，竟然也出现了下雪的天气。


    这些例子全不都说明全球变暖是谎言吗？


    其实这些都是通过局部的、短时间的，甚至只是体感得到的结论。他们并不知道，有些地方虽然是短时间里更冷，但是在全年，全世界范围还是更热的。


    # ——► 评估结论的一致性 ◄——


    那么更有力的质疑是这样一个逻辑，就是说：


    任何一个科学理论，在发展初期都存在一个特定的时段，那段时间里，只有极少数的科学家支持它，大部分人都不反对。那个科学理论需要证据不断地积累，最终才能被接纳。


    # ——► 科学结论的得出 ◄——


    那么依照这个科学思考的原则，我们来审视一下全球变暖是不是已经出现了多次的归纳总结呢？是不是得到了⼀致性很高的结论呢？


    这些研究其实来自很多个机构，时间从1991年到2013年，独立研究这个问题的机构，比如像美国科学院、美国物理协会、美国化学会、政府间气候变化委员会、美国地协、美国气象学会、美国科学促进会、美国医学会，涉及到科学家有好几万人。


    比如说2013年澳大利亚的科学家约翰·库克和他的同事就对分析了1991年到2011年，这20年间在权威期刊上发表的1144篇关于气候变化的论文，然后这篇综述研究就刊登在《环境科学通讯》上，他们统计到的结果是这样的：


    有97%的论文在研究之后的结论是全球变暖是由人类活动造成的，只有3%的论文认为不是由人类活动造成的。'
