  md: '# ——►康熙喝巧克力◄——


    在1705年的時候，罗马十一世教皇还让传教士多罗给中国的康熙皇帝带过去巧克力。


    康熙是属于历代皇帝中对西方文化最感兴趣的一个人，那天太监把供奉来的巧克力带来了，太监先喝完，验证它是安全的，之后就把供奉的巧克力带进宫里了，他就是按照说明冲泡的。


    康熙试喝，最初闻到了一股异香，但是看这个杯子里的浓汤是黑黑的，康熙抿了一口。虽说这里面已经放了糖，但是还是非常苦。大臣们跟太监都盯着皇帝的表情，看他又是皱眉又是咧嘴的就很担心。不过这康熙又抿了几口，眉头就舒展了，就感叹道，原来这样人每天喝的就是这玩意儿，哪有我们的龙井好喝呀，说完就哈哈大笑。


    康熙觉得这东西苦成这样，西方人还天天喝，其中必有道理，应该是可以治什么病吧。


    治什么病呢？


    写了一封信，让太监带给传教士问问。几天之后收到了回信，信里告诉康熙说，巧克力不是药，西方人喝巧克力跟东方人喝茶是一样的，一天喝两次，我们喝这个主要就是为了提神醒脑。


    康熙看了这封回信之后就明白了，小太监本以为这些巧克力粉就不喝了，结果那次进贡的巧克力，康熙之后几天全给喝了。


    # ——►“吃”的巧克力◄——


    在之后的200多年时间里，巧克力一直是一种饮料的状态。


    在1820年的時候，美国兴起了一股宗教信仰复兴的运动，整个社会反对金融业，反对奴隶制，反对吸烟，反对饮酒，提倡的是清教徒式的生活。


    原来经常逛夜店的人现在没的玩了，烟酒也没的卖了，但是卖酒的人也想办法活下去吧，那就换个其他东西卖吧，巧克力饮料就在那个时候成为全美国想找点乐子的人最喜欢喝的东西。


    而且它当时的形象是一种取代酒精饮料的健康饮料，喝完了之后人还特别精神。如果要是轻度的发烧感冒，喝完了之后还会一身轻。


    也正是因为巧克力饮料大行其道，才有了更多的商人琢磨着变化花样。


    在1847年的時候，约瑟夫·弗莱德找到了一种方法，能把巧克力给凝成块，也就是从那天开始，人们终于可以说“吃巧克力”了，因为在那之前都是喝。


    之后就往里加糖，加牛奶，这些工艺越来越多，巧克力几乎就是甜品必备的原料了。


    等到巧克力随着食品工业发展到今天这一步，也就很少人知道这种植物最初的味道是什么样了。


    好了，关于巧克力的历史就说这么多。


    # 划重点


    +   1.很多植物的种子都有硬壳包裹，如果没有，一般来说就是有毒的，因为种子富有营养，容易成为动物的食物。 2.可可豆含有可可碱，它会影响绝大部分哺乳动物的神经系统，造成心跳过速，肌肉僵直，甚至致命。但灵长类动物可以代谢可可碱。
    3.巧克力是阿兹特克语中“苦水”的意思，阿兹特克人在祭祀的时候吃巧克力是把它当作一种致幻剂，一种兴奋剂使用的。


