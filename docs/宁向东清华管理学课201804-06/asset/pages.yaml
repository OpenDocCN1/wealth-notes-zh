  md: '正如《原则》这本书讲到的，痛苦加反思=进步，遭遇的挫折，正常人都很痛苦，能否从痛苦中汲取力量，获得成长的关键就在于对这个人AQ是否比较高。最后，用王石给于褚健的评价：看一个人是否真正的伟大，不在于他处在巅峰时期是什么样子，而在于他从巅峰跌落到谷底之后的反弹。


    来自： 小朱先生


    刚刚出的这本书，在这本《反转力：经济不确定时代的新的想象方法》一书中，拉姆·查兰写道：“就算能够转弯为例， 你也无法知道即将出现的世界的形态和边界。 这些情况甚至可能远远超出我们的想象范围。
    我们能够确切知道的也是，这是一个杂乱无章的、正处于知识中的时代， 而且与变化如影随形的既有危险，也有机会。” 据说，《反转力》 查兰在书中给出了精调和反复高度可操作性指导，
    并道出案例研究，明确了说明了杜邦公司、汉臣公司 (Hanesbrands Inc.)、惠普罗(Vipro)公司和其它的公司采用查兰的技术所取得的成果。


    复盘老师本周讲的五种力： 1. 自我力：认清自我， 2. 全身之力： 2.造视野：看到全局、看清局部，3. 架之构力：最有力的看到与力， 4. 创造：选对的事，
    做对的人， 5.逆转力：不服输，不会去转掉。 这五种力， 层层递进，视角从内到外， 从树木到森林， 从宏观到微观， 俨然—语道破创业者、人生路。


    所以，我非常认同老师最后那句：“这五种力，绝不仅仅只是管理者的五种素质， 也是我认为最重要的五种人生力量。”


    作为一个持续创业者， 我更多的感触是： 即使老师清晰地指出上下这五种最需要的力量，作为一个人，也无法奢望悉数学会与拥有。骨子里的豪迈大气， 或心细如发， 或胆小如鼠之类的这种与生俱来的性格无从对错的，
