  md: '# 260讲：最后一课丨为你选一位伟大导师


    260讲：最后一课丨为你选一位伟大导师


    今天，欢迎你回到《宁向东的清华管理学课》。


    今天是你这一百订阅读的最后一讲。我 和 你 分 享 一 位 中 国 企 业 家 的 故 事，这 位 企 业 家 的 名 字 叫 卢 作 孚。过去100年，中国出现了无数
    的企 业 家，也 出 现了数 不 数 的 企 业 家。如 果 你 只 能 只 选 一 位 企 业 家，为 他 们 的 代 表，在 我 心 目 中，他 应 该
    是 一 选 的 那 一 位。而 且，在 我 的 日 志 中，他 不 仅 是 一 位 企 业 家，还 是 一 位 圣 人。


    # ### 1、卢作孚的管理之路


    卢作孚 原 的 很 多 人。会 让 我 如 此 之 敬 佩 ？你 知 道 吗？100 年 前 的 长 江 轮 运，是 中 国 主 要 的 交 通 线 之 一，却
    是 被 英 京 日 本 和 国 的 轮 船 主 引 控。长 江 沿 岸 上，都 是 它 的，它 本 也 都 是 它 招 揽 的。中 国 人 自 己 的 船，少
    得 可 怜，既 不 规 模，也 不 成 系 统。


    卢作 孚 在 这 些 条 况 下，创 办 了 民 生 实 业 公 司。创 办 公 司 的 那 一 年，是 1925 年，卢 作 孚 32 岁。生 逢 乱 世，卢
    作 孚 的 人 生 理 念 是：实 业 救 国。


    卢作 孚 从 一 只 小 轮 船 开 始，一 点 点 积 累、一 点 点 拓 充 司 长 交 上。卢 作 孚 非 常 出 世 看，将 同 民 生 轮 船 公
    司 长、依 依 不 落 的 管 理 理 念 引 到 到 民 生 轮 船 公 司 的 运 转 过 程 之 中。卢 作 孚 借 鉴 了 外 资 公 司 的 管
    理 经 验，开 始 引 入 了 “经 理 负 责 制”。


    这 一 点 很 值 得 说。外 资 公 司 由 于 对 中 国 人 路、经 营 等 多 方 面 不 熟 悉，语 言 也 多 有 障 碍，所 以 他 们 实
    行“分 包 制”的 管 理 方 式，有 类 似 于 承 包 者，包 含 包 点 的 特 点，就 是 享 有 报 效， 可 以 为 自 己 的 实 利 益 和
    报 效 目 的。他 们 肯 定 可 以 获 得 相 对 高 的 分 包 报 效，至 于 承 包 人 怎 么 去 经 营 船 队，几 乎 深 究 不 到 细
    节。


    于 是，外 资 轮 船 的 承 包 人，就 跟 廉 分 包、廉 展 现，最 至 连 用 的 船 都 是 别 人 的。能 用 一 样 的，绝 对 不 会 投
    资 于 属 于 你 自 己 的 成 本。人 这 样 做 的 结 果，就 是 工 作 效 率 和 服 务 质 量 都 无 法 得 到 保 障。


    针 对 这 种 局 面，卢作 孚 在 民 生 轮 船 公 司 采 取 了“经 理 负 责 制”，并 且 由 企 业 人 的 聘 期 均 收 归 公 司。财
    务 和 油 烧 管 理 都 集 中，技 术 业 务 由 总 经 理 统 一 负 责。这 是 管 理 变 革，也 是 企 业 不 该 在 我 们 在 前 面
    讲 过 的，西 方 同 时 代 的 那 些 管 理 先 觉。


    管 理 体 系 改 善 后，服 务 模 式 自 然 就 可 以 上 去 了。在 不 资 的 轮 船 上，华 人 虽 然 是 在 自 己 国 土 上 乘 船，但
    得 受 到 像 二 等 游 客 的 待 遇。民 生 轮 船 公 司 为 客 户 全 系 为 卢 作 孚。在 他 管 理 下，公 司 的 服 务 有 改 观，而
    且 华 人 也 享 有 自 己 的 尊 严。不 仅 有 说 起 来 很 像“优”的 尊 严，还 有 很 实 现 的 体 验、服 务，比 如 夏 天 在 长
    江 轮 上 洗 澡，等 等。


    你 可 以 的 细 节 多 多，我 只 想 参 观 参 观 卢 作 孚 如 长 对 待 这 段 大 史 的 态 度，你 也 应 该 参 观 卢 作 孚 长
    外 孙 杨 刚 刚 先 生 所 写 的《百 年 考 水：卢 作 孚 传》。


    到 了1937 年 抗 战 爆 发 之 前，民 生 公 司 已 经 拥 有 了46 艘 各 类 轮 船，总 排 水 量 2.4 万 吨。排 水 量，是 衡
    量 水 上 运 输 设 施 规 模 和 水 平 的 重 要 指 标。2.4 万 吨 看 什 么 概 念？就 是 可 以 纳 水 船 的 一 半。由 此 可
    见 民 生 轮 船 公 司 在 十 几 年 间 的 发 展 速 度 和 规 模。


