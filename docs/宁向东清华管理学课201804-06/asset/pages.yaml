  md: '# 留言精选


    老鱼

    老师好！“不走捷径，就是捷径。”“从绝望中，找到希望。”这两句话读了，就如同灌进我脑中多年的心里一直，我就想随身携着。


    凌晨困了两遍，今天早上读了一遍两遍，我希望大家能如同中学时代一样捧读这篇留言下来，作为你我不断人生啊同行手不里的内容，无奈多少不惊人，幸好你在千里地也一样可以悄悄的翻着。


    坚持而不放弃，只要方法对了。努力就不会白费！又想到了当初的名另一番话，《你的努力我看得见》，文字不一定有情感厚度，却依然能将我的激情点燃，成为鼓舞我前行的力量。


    追我心

    1.毕业五年了，对于宁老师的课才有感觉，这个时候读了急功近利、浮躁的我们。社会的潮流裹挟着我们向前，很多时候都不知道去自己真正想要的是什么。可以招人可怜，我们深知感受到今天90后、95后的“脆弱”，稍微一点压力就受不住的脆弱。


    2.以自己为例，自毕就自留就在一家公司，从实习生开始，逐步做到工程师、做班主管，也是在这个过程当中，带着小小的团队才开始学习如何管理，如何面试、培养新人。三年，自己走的路自己心里清楚，也曾为了软件一行代码的Bug纠结得产品问题，38度的高温坐在年底多个周末下午就去赶飞机，只为能一路上看到多不那么辛苦，对于个人的成长是，的确变得更强悍了，面对困难更加从容了。未来路径还很长，不忘初心，砥砺前行。


    子路求学

    读完老师对学生的寄语：不走捷径，就是捷径。从中找到希望，不轻感受爱或强者都是强者。成功要放弃者，竞争需要付出，需要一直的去付出，直到无能为力，大家都放弃了。我们去想变强了。又回到了自己的座位上。让感觉成为了自己成为了自己，帮助别人实现了他们。成功不是因为自已有所收获，而是在帮助到别人获得成就的时候，成功是对我们的奖赏。


    感谢互联网这个时代，感谢利用好这个工具的同学，在传统社会里，让一个没有名气的学生与十牛学校建立互学一个连接上感成为可能。古代孔子建立了三个工匠，让这成为可能。现在学生已经有16万了，这是一个不可靠的时代。


    Aaron

    老师，您好：

    如果老师是我最老师，我们愿意陪你共鑫学生。


    人生就是每个基本的商业模式，企业的商业模式是物与服务交换，个人的商业模式就是时间换换。


    老师的这两条人生简单的基本逻辑的志品质我们都具备，体会是：


    1.不走捷径，就是捷径


    记得我们工作，申请到公司实习，共就六个星期，我工作去易师傅外排车间，一共六个月，在这个月里面没有您有感悟，曾前观察、多问多问题，而未来办公室基本就没有东西好问了好呆过，不过这个六个月学到东西，在我后面10几年的工作一直用到。


    2. 从绝望中，找到希望

    在中心中目标情况下不轻不放弃；


    家张

    但是因为张永亮的意志品质，所以买了锤子手机当备用机，虽然锤子和苹果比还有技术差距，但是不妥协的有些果机的真的是很用心。当然这是不是给锤子手机做广告，我看到文章中罗大工是多给牛老师回信息，我还是被感动啊。有这种品级的道，没有理由不成功啊。顺带说一句，我也一直推荐客户，我们公司的副总裁，也是这种志气到极致，事事都有过程都两点三收地他要开的经历。经常出差的，即使在机场也要每天办公300个咖啡馆。


    Rinika

    多论去考，宁老师的内心语让我想到自己本大学的母亲，作为从农村走进来农村的穷孩子，没有资源不够聪明，正是因着着意力大一分走到现下，母亲的教育功不可没。


    不走捷径，就是捷径。我对从小干活就比别的孩子一开始觉得自已点，母亲告诉我慢没有关系，可以一点一点的来，但是不能因为图快就从学习“近道”（意思就是捷径）。于是，从学习到工作，即使别人告讦我有捷径可走，也因为从小习惯慢锤炼，也因应训练出自己的基本功。


    多吃点小粗粮

    今天考试完，受伤的阿赫瓦里，不容易放弃，一瘸一拐，坚持跑过全程的马拉松故事。对于高三的我们做出了极好的选择，也让我在看到想放弃，自己参加3000米全长我的场景。


    当时参加的人很多，自己挤在人群中，心里一动。信号枪一响，跟家大家都冲了出去，当时没感觉到什么，也没太想到，第一个人跑到，也不由生不出由主地快步，第1圈的时候，后面不太自由，快跑，无法跟上，只能眼睁睁看着后面的人陆续超过我。


    离离完全程还早着呢，这下不去是办法。对于有意识的放慢速度，慢慢调整，稍微好一些。


    在跑在最后两圈的时候，有部分人索性退出了比赛，自己体力也基本消耗殆尽，很想放弃。听觉广播说，已经有少部分人跑完全程，想想放弃。但这时，内心深处的声音在耳边“加油”，放弃，就全白跑了。最后两圈，喝了口气，我就行起来，证明“自已”！同时广播也传来了为我们继续在跑的大家加油的鼓励声音。


    于是有了坚持下去的劲头，跨开精神，迈开步子，向前的前冲。在跑圈两分钟多的加油声中，在加油的声音中，终于在最后的中冲刺，周围响成一片，自己也紧张了……


    虽然过去了15年了，但这一场景一直历历在目。每当自己遇到挑战，坎坷，快支撑不下去了的时候，这件事会鼓励着我，给自己继续坚持下去的动力，感谢当初的自己，感谢当年坚持、不放下！


    俞剑-发愿

    对自己的职业人员务员来说，这种意志力是很重要，不管你不可能做到我们最不想做到、想到，一定能做到！很少人不会做一点业绩完成目标的，最多能达成一些是自己没有标准的，没有多打的销售额，甚至没有多大的营业额。但你们要坚持，一定能够做到达到顾客，努力工作，越来，一定能够感染到别人。


    很多时候在这行业水米不高，团队动不行，想过放弃这个念头，但放弃坚持，坚持总归要又能坚持，永远坚持，在我们坚持中意义，只要坚持，不放弃，用自己的意志，最后一定能做成一件事，拥有自己的事业，坚持本身就是一种能力！


    太空飞船

    宁老师作为清华老师，一定知道青年血压对于一个人青年时代的重要性。我去中读高中，交过只有一中，但很多老师讲了三四年前近一些，后来听了一些，就虽然要看看得有一些，对于慢慢调整心态，接演思路，最后一个过过看直夜晚醒点。第二天上午最后一节下在课看基本写的，但那部日子的最易我有了基本效率最高的状态之上。最后领导看了我要本子，说写得很好，唯一的一个缺就是论文，是性的是最后拿下的青基了。


    BaoGary

    能感受宁老师对学生的关怀，和嘱咐，不知不觉一学就学到了，这只是一个人开始，感恩兴学中心学习一年。不走捷径，就是捷径。从绝望中，找到希望。这两句话对于一名创的我来说，太重要了，我认真消化老师的一段智慧。


    梓岁

    宁老师您好！跟随您学习了一百多节课，受益非浅。今年我的课途也会在不走捷径，就是捷径，让我想起十多年前刚念走对型，离开校园从社会工作重新再高起步的环境，我全身心在职业，离开校园的时候我过有专业职称，小时候爱哭的，我现工作，立志会职业职级和中级职称，一步一个脚印，有脚踏实地实现自己的职业会工作，奋斗多年了，非常感谢您给予我岗位作了二十多年，非常希望这份工。'
