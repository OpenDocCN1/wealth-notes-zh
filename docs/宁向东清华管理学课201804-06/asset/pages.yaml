    # 留言精选


    **汉东省省委书记沙瑞金**

    老师好，个人观察国企的激励文化更适合催生大国工匠，原因有3:1.从事一个岗位总是要积累丰富经验；2.有各种比赛、排名、评优机制；3.可以申请丰富的奖金，国家级别证书，有了证书后期薪酬会走高。私企量也有比赛要激励如西门子，非定，物质激励更少的可冷。


    **DAVID080911**

    不思善而患不均。我们还是受传统社会“大锅饭思想”的影响，在考虑分配的时候总是要考虑平均的问题。这样的社会做不到极致，也就不能激励大家做出超常人的努力。

    “重罚之下必有勇夫”。钱的激励作用是显而易见的。如果能看到高不可攀的回报，一定会有人去努力，去钻研，去获得那个高不可攀的结果。再加上如果社会推崇这种“工匠精神”，就一定会真正催生出一批工匠。'
