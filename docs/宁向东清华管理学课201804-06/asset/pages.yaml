  md: '当偏差超出可以接受的范围的时候，控制活动的后续环节就是要求改变。要么改变原来的目标，要么就是改变后续的行动。这里，特别要强调的是，人们本能上会存在一种自我辩护的倾向。很多人遇到事情，下意识的反应不是考虑自己的行动是不是合适、恰当，而是首先会考虑外部的原因，并进而去思考目标是不是确定得合适。


    这里面有一个好像悖论的东西。就是很多达成目标的时候，人倒是特别应该反思一下，是不是自己的目标定低了，是不是当时的竞争环境不够严酷，导致自己的目标并没有定得足够高。相反，在没有达成目标的时候，人们倒是首先想的是，是不是目标定高了，自己才没有完成计划，而不是首先想是不是自己的行动不够合适。


