  md: "![](img/17b87b436c90c966960c6a3171fa356b_5_0.png)\n\n# # 213讲：报酬结构丨观察业绩是关键\n\
    \n你好，欢迎回到《导向真的清华管理课》。\n\n前两天的课，我们都是从物质激励的数量上、水平上讨论报酬的作用，我们强调不能少给，必须要多给，只有多给，才能达到所谓的“激励效果”。今天，我把这个观念再往深了引一步，就是和激励总量的水平同样重要的，还有报酬的结构。如果报酬的结构不合理，多给报酬，很多时候还是达不到激励的效果。所以，讲激励，一是必须要考虑总量；二是需要考虑结构。\n\
    \n# ## 1.报酬的结构\n\n什么是报酬的结构？我们一般把报酬的结构分成基本薪酬和业绩薪酬这样两个部分。这个结构一定要尽可能合理。基本薪酬，基本上是为了保底，通常的做法是根据同业的水平来决定。比如说类似的行业、类似的职位，大家都拿多少钱，然后算出一个参考水平。接着可以根据每个职位的特点，对具体岗位相关人员的业绩要求和他付出努力的程度，决定他的基本薪酬比例。\n\
    \n有些人可以完全参照同业水平来拿报酬，比他的报酬100%都是参照同业水平确定的；而另外一些人，则可以50%，或者75%参照同业的水平，作为基本薪酬。而另外的部分，则是根据业绩来确定，按照业绩目标，以及他完成的情况来支付。后一个部分，由于和业绩的完成情况挂钩，所以，也叫“激励性报酬”。显然，今天我们讲激励性报酬的概念，比昨天更进了一步。\n\
    \n也许会问我，这个100%，或者50%、75%的比例是怎么定的？在报酬设计的时候，这个比例的确定主要取决于这样一些内容：\n\n+   1. 业绩和努力的关联程度；\
    \  \n2. 业绩的可观察性；  \n3. 管理水平；  \n4. 你对业绩的观察能力，等等。\n\n虽然影响因素比较多，但请你记得，核心就一点：你最后能不能观察到业绩，进而从你观察到的业绩水平推断出这个人的努力水平。\n\
    \n# ## 2.如何决定报酬结构的比例\n\n如果你能够很轻松地观察到业绩和努力，其实，你真的不需要多给，也不需要设置激励性报酬的部分。这个时候，报酬的结构就可以很简单，只给基本工资。比如，你请一个工人，负责给你打扫房间。如果你可以很容易地判断他的清洁工作质量，除了基本工资，你真的不需要额外给予什么激励性报酬。就算是在，那也是出于你的某种善意，而不是出于为了激励工人完成清洁任务。"
