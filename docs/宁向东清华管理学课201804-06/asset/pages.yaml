    # ## 2.固定性：变革的底层逻辑


    为什么那么多宏大变革，最后都以失败告终？因此这么多，无论是针对个人的，还是针对组织的，都能让变革本身产生巨大的不安全感是感受不安定。就像我们到一个陌生的环境中去旅行，连酒店房间这样一个让我们感到安全、获得一点点确的地方都没有，我们无论在都会感到不安。


