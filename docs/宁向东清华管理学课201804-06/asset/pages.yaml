  md: '法评价出、排序排出谁学得好，那又该怎么办呢？我经理和学生开玩笑说，在这种情况下，唯一解决问题的办法，就是把学生留校，或者学生办什么事情都让老师一块分享利益和分担损失，也就是说，通过把老师和学生的利益锁定在一起，老师虽然无法考核，但依然会尽力教书育人。这种利益锁定的方式，就是给予重要的人股份，使用股份作为激励手段。


    总结一下，长期激励性报酬的形式很多，但如果稍作归纳，可以分为期权类、排序类和股权类。而最后在实践中使用的形式，通常是各种方式的组合。


    # 课后思考


    排序激励这种激励方式除了可以应用在企 业的主要负责人身上，可不可以和标杆管理相结合，用在部门、团队，甚至是个人 的身上呢？


    # 划重点


    +   1. 长期激励性报酬在未来会越来越多样化，普及化，低门槛。

    2. 水平越高，激励进行步，报酬的增加越不能是线性的，增量必须要越来越大才行，因此可以采用排序激励的方法。

    3. 长期激励性报酬可以分为期权类、排序类和股权类，最后在实践中使用的形式，通常是各种方式的组合。


