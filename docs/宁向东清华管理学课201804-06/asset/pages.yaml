  md: '# # 241讲：解除抗拒｜变革的底层逻辑


    241讲：解除抗拒｜变革的底层...


    你好，欢迎来到向昱的菁华管理学课。


    从今天开始，我们用两周的时间来讨论信任与变革的话题。与原来的教学设计不同，我们的重心将比个人的转变与进步为主，同时兼顾企业整体转型变革。这几点，我们上节课就讲了，反正这门课我们可以无限解读。所有内容，我们可以利用未来课程提供的机制再细。那么一年，我给学生的这一通道理教学，就像是大白牛，清晰而简单。前几个月，我会有多大呢？回来我半年的学生，在得到，看来不记得年级里我带的第一年学生。你可能会说，今天不，你...觉得呢。


    我获得，现在对于你来说，听过一年的管理学知识，最重要的事情就是给自己制定一个改善计划，努力在学校的管理学知识有意识地融入工作中去。多年来，我一直把变革看作对于知识的最基本的分析，得到了一个知识点，掌握了一个理念，分析到了一个技巧，之后的关键是要给自己找到一个练习的机会。练习和使用，本质是在激发学习。所以你就把应到变革之中了，其实只靠这只有。这就是我说的：学校可以用。我强调，个人如此，组织也是一样。我强调：有经过历练，受到实践的检验，你真正开始掌握一门知识或一个技能，否则都是纸上谈兵。


    # ## 1.变革的不易


    改变并不简单，并不容易。三十几年前，美国有一位很有名的畅销书作家，也是一位曾经写过小说的著名作家，他讲了一个例子，印象比较深。这个例子给我留下了深刻的印象，现在我与你分享。


