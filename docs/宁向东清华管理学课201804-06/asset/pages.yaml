    2.卡普兰的平衡计分卡和战略地图等管理工具，有助于我们准确地衡量业绩，知道我们目前是不是在朝着预定方向前进，走了多远，离目标还差多远。

    3.管理者在接受偏差的时候，更重要的控制力，就是能够预判偏差会引发什么，会不会在下一个阶段超出可接受的范围。


