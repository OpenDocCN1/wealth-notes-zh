    # 留言精选


    **武汉秦涛**

    宁老师今天的课程特别有启发，管理是激励人的善意，如老师所说，类似给 生出一条命，这是需要管理者本身可以设计出 一套合理的规则去满足需求本身，最大限度达到激励人才和提升竞争力的目的。

    激励激励化：目前我所管理的餐饮行业，已经有服务员全员持股，核心岗位如厨师前厅经理等多为合伙人，因为这两个层级的人员对激励的诉求更加直接。

    激励排序：一种是和外部对标，还有一种是和内部对标，但是在绝对奖励额上，我经历过很多企业只奖励激励额，我是从梯队比例形式来激励，避免个人过于膨胀，类乎上这种某种程度上也损害了能实力出员工的积极性。

    激励的最终目的是保持人才的竞争优势，保持企业的竞争力，多元化，长期，以鼓励分享的趋势越来越成为共识，因为人才是稀缺资源。

    *04-13 07:06:55*


    **戚志光**

    我认为是排序激励可以应用在部门、团队乃至个人身上的。其实在生活中，大多数企业都会进行这样的排名。比如说你们公司要年底都会有各个部门完成业绩的百分排名来排序，若干部门要排出前三，前三会有相应的奖，后三名会受处罚，这就是一种排序激励的做法。

    这种做法能够刺激部门，特别是部门领导努力提高业绩，但和今天老师所讲的排序激励，还不太小区别。我认为这种排名有点弊端，第一是不利于企业部门之间的合作，别人成绩好了就会影响自己的排名，那么即便是有利于企业整体，公司自己即部门有什不利，那我也不会去做。第二是评价体系不容易做的公平，公司各部门职务不同，评价的标准也完全不
    一样，像人力和业务管理，每年的评估趋势都不一样，但大家就都放一起评，放在一起比较容易让人就感觉很不公平，影响员工的积极性。

    *04-13 06:57:05*


    **起方**

    排序激励这种激励方式除了可以应用在 企业的主要负责人身上，可以和标杆管理相结合，用在部门、团队，甚至是个人 的身上。

    而且这个时期KPI和OKR是最好的帮手。不过可能会产生的负面影响就是人们为了拿到更好的排序可能会把注意力从工作目标而转移。

