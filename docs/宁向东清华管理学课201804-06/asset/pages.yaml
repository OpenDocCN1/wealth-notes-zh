  md: '期权的授予，必须要经过股东大会决定，是公司最重要的决策之一。如果你将来的报酬里面涉及到期权，你必须要和公司的大股东和董事会讨论清楚如下 的细节：比如股票认购期权的授予条件；行权安排的节奏与数量；期权的变更与丧失；期权价格的确定与执行办法等等。通过详细研究每一个条款，来保护自己的工作价值。


    比如说，股票期权通常不是马上就可以行权，而是需要有一定的冻结期，英文叫 vesting period，只有在冻结期结束之后，才可以执行。再比如，大部分公司还规定持有者不能一次全部行权，每年只能执行一定比例的期权。这些内容，都是需要你一条一条和有关人员讨论协商的。


    # 课后思考


    今天的课后，请你思考一下：股票认购期权，在中国到底是不是一个激励的好办法呢？


    # 划重点


    +   1. 期权，实际上就是一种权利，是指在未来的某一个时期，用事先约定的某一个价格（这个价格可以是零），来购买一定数量的股票的权利。


    2. 期权背后的逻辑是：我越努力，我的长期性努力越多，公司的未来业绩就会越好，这些业绩体现在股价上，股东获得了收益，我个人也可以分享到公司成长的好处，获得回报。


    3. 期权的具体操作有很多形式。


