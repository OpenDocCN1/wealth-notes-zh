    2.  家乡里的东西，确定数和现实脱节，并不是许多人需要知道的，不接地气的也是真。但是多东西，你偏偏它、又不接触它，原因可在于这个阶层，目前不适应的东西。因为，你的发展。这个故事从另一个角度说，是你自己还需要进步。


