    # 留言精选


    **小米先生**


    两年，我给朋友家在建企业时，曾经列过企业六条“高压线”，分享给大家。


    今天老师提得正好，我写这些也是从网上搜集再结合自身情况整理而成，但事过境迁，如今已找不到了其最早出处，我只能在此特别声明：此六条并非我原创，并代表前东家和个人向原创致敬！


    公司绝不允许任何员工触碰的高压线是：


    +   1. 故意虚报账；

    2. 收受任何形式的回扣；

    3. 泄露公司商业秘密；

    4. 从事与公司有商业竞争的活动或项目；

    5. 违法乱纪行为；

    6. 打听或泄露薪资等保密敏感信息的行为。


    坦率的讲，除了第6条，其它的都能做到。对此，我也颇感困惑，请问老师，关于第6条是不是本身就致命的？是不是不应该成为红线？为什么？请老师斧正！


    作者 回复

    红线、越过去，就要付出惨重代价。


    **Hanskenong**


    在法国精英大学里，每个学生每学期缺课不能超过三次，且超过三次就必须被强制劝退，这是红线。


    这是一种让给学生上课，保证学生质量的一种手段。但是，一些学生因为身体原因或突发急情况，可能会有缺席。这时候学生可以找教务处说明原因，而如果学校认为有合理的理由，那么他可能会取消记录缺课次数。


    即使对成绩好的人，这是必须执行的，这对学困生来说，因为完成学业必须上学，缺少了与朋友互动的机会。精英培养就是精英，而不是学困生。精英就学去与人互动，与人交流，与人合作，这才是学校的真正目的。我认为，这个红线设立的有价值。


    **陈胜**


    老师你今天讲的管也是昨天课后思考的问题，我记得老师讲过，有一外企高管离职，在离职前的讲评里没有丝毫诋毁之言，这等于毁了一个人的前途，一开始我还不以为然，随着课程的深入，我越觉得这越，这确实是很重要的品质。


    前两天有要得到的同学加我，我拉进一个群，说是因为公开课的录音，只要付一个专家的费用，全都提供免费，听完后，我马上退群，我的看法跟老师一样，要尊重老师的知识版权，我不应该免费分享，同时坚决反对盗版。


    下面讲我印象之深刻所谓的事


    1. 合作伙伴对同事的工作上的事必须坦诚沟通，不能损害公司的利益来获取个人利益。

    2. 生意是平等互利共赢的，绝不能以损害、客户的利益，来获取企业的利益最大化、宁可不做生意也不能用偷蒙拐骗的手段经营。

    3. 诚实正直，遵纪守法。


    公司及个人都遵循一报还一报法则。


    以上留言由 作者 筛选显示'
