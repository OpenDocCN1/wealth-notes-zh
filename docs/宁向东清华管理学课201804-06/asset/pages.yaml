  md: '超常的报酬。但是，如果像售楼小姐这样，超常的业绩并不是来自自己的努力，更大程度上是来自于好运气。这个时候，就要考虑是否应该对报酬进行封顶。


    报酬封顶，是今天课程中的重要概念。设置报酬封顶制度，或者在报酬合同中写上类似的条款，是为了防止业绩因为突如其来的外在因素而呈现出巨大的波动，从而保证激励机制的有效性。对于很多时候的业绩水平，不仅要受到当事人的努力的影响，还受到环境因素的影响。而激励性报酬的设计，重点考虑的是当事人的努力，以及他能够控制的因素。对于那些不受控的因素所带来的业绩，其实是对于激励性报酬制度的一种扰动。考虑是不是要封顶，就是在考虑如何尽可能地减少扰动，保证激励制度的连续性和平稳性。


    # 课后思考


    我们这个社会的激励文化，是不是有助于催生“工匠精神”。


    # 划重点


    +   1.  水平越高，你要鼓励他再进步，就必须给予他超过一般水平的回报，要勇于拉大回报的差距。只有拉大回报上的差距，才会有人愿意在极致状态上，坚持努力。


    2.  设置报酬封顶制度，或者在报酬合同中写上类似的条款，是为了防止业绩因为突如其来的外在因素而呈现出巨大的波动，从而保证激励机制的有效性。


