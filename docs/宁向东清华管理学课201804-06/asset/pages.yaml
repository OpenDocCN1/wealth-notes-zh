    +   1. 开始的目标不要定一周就减多少，塑形效果如何，因为这些指标都是反映中长期的目标的结果的，不适宜作为初始。基础的目标是建立习惯、改变行为。固定每周的运动频率、时间长度；2.
    如果前期固定的计划能够持续一个月，就可以加入变化固定的，提高难度；3.加入体重、型指等指标观察，用来调整运动强度和频次；4.维持：5.再根据指标调整。以上是一个动态的目标变化过程。


