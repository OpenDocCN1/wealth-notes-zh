    \n前面，我们讲进了报酬包括基本薪酬和激励性报酬两个部分，这两个部分之间的比例，就是报酬的基本结构。接着，我们又讲解了激励性报酬可以细分为短中短期报酬和长期报酬。把这两个方法结合在一起，报酬的结构从大类上就可以分为三个部分：基本\
    \ 的薪酬，也就是相对固定的工资部分；短、中期的激励性报酬，也就是短期业绩挂钩奖金部分；以及长期业绩挂钩的激励性报酬。\n\n# 1.激励的组合比例\n\n\
    了解激励的有关知识，这三个部分的数量比例，它们背后什么含义，你必须非常知道的。这些知识，比如讲，薪酬支付结构，这三个部分的比例依次是 8：2：0，这是什么含义？我们知道，就是\
    \ 0 者，意味着什么？没有短期的报酬结构。\n\n一个普通打工者的报酬结构，他的工作性质相对比较好考察，甚至工作过程和工程状态都是比较容易监督的。所以，他的基本工资占的比例一般都比较小，奖金部分比较小，根本不需要他去跟长期业绩相关。管理上对于多这样一个报酬结构的人，管理上需要多下一个功夫，如果管理上失败，他们有可能出工不出力。\n\
    \n如果这个人的报酬结构不是8:2:0，而是5:5:0的有一个人长期激励性报酬，但是，收入的大头来源于工资，奖金部分比较少，收入结构就意味你拿的工资比例比较大，你的收入就来自于长期报酬部分，而你的报酬结构是平的，你拿的多不多，是年底那一样比较多。毫无疑问，你的组织对于你的业绩还是有着较高的期待的，只不过，你的工作对于组织的长期业绩影响不大。\n\
    \n那么，如果这个人的报酬是2:2:6，那这个意味着什么？仅以报酬来说，我们就可以推知什么？仅仅对于公司的未来非常重要，所以，在他的收入里面，过半的部分是长中短期业绩紧密联系在一起。如果是这个比例就确定，他是一旦实现了目标才会有钱，他完全有可能是在创业，或者是在一个高度依赖长线生存的行业中工作。\n\
    \n总之，考虑物质激励，考虑好报酬，除了总量非常重要，结构也极其重要。前面的课程里，我们已经讨论了业绩指标，你记了KPI，当这些内容确定了之后，你要好好对人、操好心，主要考虑的是一个的能力。\n\
