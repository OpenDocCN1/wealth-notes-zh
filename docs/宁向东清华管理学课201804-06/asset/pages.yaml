    # 留言精选


    佛祖门徒 0

    老师的复盘让我想起小平同志说过的一句话“好制度不一定让人变好，但坏制度一定让人变坏！”。在进行激励机制设计时，要基于“人性”这个最根本的逻辑，根据不同的人、不同的需求、人所处的不同阶段、不同岗位等方面综合进行考虑。首先，物质激励是最简单直接的，但要体现出好的效果，必须做到“数额到位、目标明确、评价公正”。然后，就要考虑物质激励怎么给的问题，这时就要结合公司对人才的能力和长远发展来进行考虑，通过薪酬组合拳，确保人才“招得来、留得住、干得好”。第三，基于人的需求是多层次的，所以激励也应该从物质和精神两个方面进行，在较好的满足了物质需求的基础上，辅以精神上的愉悦和满足，人才就会对组织和领导产生归属感。


