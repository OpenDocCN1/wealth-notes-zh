  md: '# 22讲｜晋升激励｜为什么有人愿意当小喽啰


    ![](img/17b87b436c90c966960c6a3171fa356b_26_0.png)


    你好，欢迎回到《宁向东的清华管理学课》。


    今天，我们讨论一个非常重要的激励方面——晋升。在下周的课程开始之前，请你想一想如下两个问题：


    +   1. 晋升的本质是什么？

    2. 为什么晋升可以成为一种重要的激励因素？


    我们今天的课，就从这两个问题说起。


    # 1.渴望晋升是本能


    我们以前讨论过马斯洛的层次需要理论，人首先要解决的是，衣食住行这些基本的生存需要。在我看来，对于这个绝大多数人，在没有钱的时候，情怀、理想、尊重、自我实现，这些东西都是奢侈品，都是短时鸡汤，并不会产生长期的自我激励。


    我认为，对于绝大多数人来说，他们第一要解决的，就是收入，就是挣更多的钱。


    当然，少数人的情况可以例外。不过，我这里要格外强调的是：我们在系统设计、寻求管理工作的解决方案和办法的时候，不能光管少数人的例子，而是应该更多地考虑大多数人的情况。针对多数人，是我思考制度问题和管理问题的一个方法论。


    不过，每一个人活着，我觉着就是一个例子，它会有贯穿在生命的一个阶段的一个情，一个语境中。这就如渴求“出人头地”的比较之心。即使人在最初为了基本温饱而努力的过程中，虽然终于尊重、名誉、自我实现这些相比比较强的东西的追求，并并不是与生俱来的。但是，获得需求，出人头地，并且由此获得更多的赚钱效率，却是很多人都在努力兼顾的。


    从某种意义上可以说，相互比较，人类的一种本能；出人头地，是一种本能，获得尊重也是一种本能。我过去读过一些中央集权帝国的文章，我查几位君主在位较长时间或老年的记录，他们告诉我们，即使在田园之中，等级制度都是一种客观的存在。只要有等级制度存在，人就有想爬子，出人头地的需求，就会有追求晋升的动力。


    # 2.芝加哥黑帮的晋升逻辑


    现在，我们回到今天课程开始之时所提的第二个问题：晋升的本质是什么？我觉得晋升的本质就是等级制度体系的人出人头地。而晋升之所以可以成为激励人的一种重要手段，就在于它类似于人类渴望尊重、渴望出人头地的天性。所以，在我可以得到一个推论：善于设计出有效的晋升阶梯，是建设有效激励机制的一个重要方面。


    ![](img/17b87b436c90c966960c6a3171fa356b_26_1.png)


    美国学者里维特曾经讲过一个毒贩的体制本和晋升逻辑的故事，给我很深的印象。在芝加哥的黑社会体系里，在最下面的小贩的黑板上，收入是最低的。


    每小时工资不到4美元，这些小毒贩甚至全住在家属的地板下，他们住在房间甚至是独立的房间。90年代，我在芝加哥呆过，我知道当时美国人的最低生活标准，很便宜，但是基层的小毒贩们连最低工资标准达不到。


    这是什么意思呢？就是这些小毒贩如果老老实实去干一份工，收入都会很不错。我现在还记得，我那一仗伤在法国，美国人，名叫安迪，我记得他刚才到美国，要倒班时，晚上睡在车中。这位安迪，是个无产阶级，租住在我同学的一间客房，我也没太住。他和我同学，我们俩人可以畅谈三天。OK了。他去毒贩工作只两天，三天当劳德费德，一天大约可以拿50美元到80美元左右，剩下的时间就可以完全自己支配。


    我曾经问过安迪，那你不就想赚一点钱养老吗？用今天的话说，你现在是月光族，你以后老了可怎么办，老想着？安迪用异样的眼神看我不信，仿佛看一个怪物。我想，在美国那样一个福利制度下，他大约从来也没想过这个问题。在美国，我的印象没有社会的小分子，在美国是我见过的最卑微的美国人：没有长远计划，过一天，算一天。


    然而，那些小毒贩竟然连安迪都不如，挣的钱比安迪小时工资的半年还多少，干着随时掉脑袋的贩毒生意，这究竟是为什么？


    里维特的研究揭开了这个秘密，因为晋升。因为小贩上升到一个台阶，他们的控制力就会增强，他们的收入就会大翻番。如果他们能够登上几条街道，光是收保护费，他们的收入就会飞速翻番，甚至会超过一个博士的毕业。研究人员如果不能做到一个片区的老大，他们的收入竟然可以增加到50万。里维特告诉我们，他所研究的那个大的分区里面，居然有MBA毕业，一个大型公司里面做到一定级别的管理人。这个研究真是让人大跌眼镜。


    不知道为什，我第一次读到里维特这个故事的时候，第一个想到的就是老北京。记得妈妈当年媒体上在报道多少人次，多少人考北京，北京又有多少去考青年。我当时就也想，知道这么多人往这个独木桥，绝大多数人都是什么。为什么小朋友还不太熟悉不想“往哪钻”？后来看到那些还成功的“这冰球，那冰球”一下来，我好像突然懂了，那就是晋升体系的力量。'
