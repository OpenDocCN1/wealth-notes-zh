    # 课后思考


    今天的课后，请你想一下身边的事，还有什么弱者对事情有掌控能力的例子。


    # 一划重点


    +   1. 控制的本质，就是要有机会、有能力调整种种“意外”的情况，经济学上叫做“剩余控制权”。

    2. 无论是控制人，还是控制事，最重要的是要设计出一个控制的闭环，而且要努力让这个控制的闭环可以通畅地运作，不能让其中任何一个环节失效，或者无法运作。

    3. 设计控制制度时，可以画一画控制的逻辑链条，看他们是不是存在着闭环，看看这个闭环，是不是稳定的。'
