  md: '# 227讲：控权先控人丨中国式控制


    你好，欢迎来到《宁向东的清华管理学课》。


    昨天，我们讲了控制体系的大逻辑，大框架。如果你细心，你会发现：今天讲的那一章控制系的使用那一套逻辑，是以控制需要为前提的。使用那一套逻辑，是以控制需要为前提的。在这个过程中，要有预先的、很清晰的、在这个基础上，我们才有事先设定出目标的能力。但很多情况下的局面太复杂，我们的认知能力和认知能量都有限，所以不可能有事先设定出一个清晰的目标或者行动路径。今天的课，我们就针对这种难言体系应发的事情，特


    # 1. 蒋介石与中国式控制


    先讲一个故事。过去，国民党军队有一位上将，名叫张发奎，这是在战争年代非常出名的一位军人，也是一位抗日名将。他在回忆录《我和蒋介石》这本书中记录了这样一件事，表面上看，这个故事涉及到蒋介石和孙元良将军的关系，但实际上背后就是蕴含我们今天讲的中国式控制的逻辑。


    我们知道，蒋介石起家的靠的是黄埔军校，特别是黄埔前几期学生中的那些“忠实粉”，捧起了蒋介石。如果你去看蒋介石的回忆录，会知道，张发奎，城是长官，叫总司令。城是官是官，打电话也好，根本不是高官，见面叫“长官”，打电话也好，根本就是叫好。我在下面给你画了一个小矩阵，你可以稍稍花点时间看一下、想一想。


    ![](img/17b87b436c90c966960c6a3171fa356b_37_0.png)


    与蒋介石有关的人，可以分为是学生的，以及不是学生的。不管是是不是蒋介石有师长的名分，在蒋介石心目中，有些人是有师长名分的，蒋是认可的，有些就不认账了。通过这样的分类方式，就可以把周围的人分成四个象限。最近的，就是他身边人确实不是学生，也没有什么私人交住，蒋在自己心目中自自也不把他们当作学生、亲信来看待，孙元良关系，遇到事情自然就是公事公办。


    近一点的，就是确实有师长的名分。但这个师长名分其实不重要，重要的是，蒋是不是在心里把他当作自己人。有些人确实


    多讲一句，人与人之间看关系，不仅仅要看表面上是不是老乡、朋友，更重要的还要看心理上是怎么看他的。否则，就会讲到心理，就会在处事上犯错误。这就是中国式的管理逻辑，由于这些东西不在此展开，但是，今天我想借这个机会提示你，这个东西其实对一个人的一生发展非常重要，你一定要格外注意。我以前有时翻阅历书，也是东翻西看了。参展了、借鉴了，就是很重要的东西。


    上一个模块复盘的时候，我总结了激励逻辑的六个字：把激励放在最后一个激励，把人性放在最后。有同学课后给我留言，讲他们对这个四字有同


    在我为蒋介石画的矩阵中，孙元良将军绝对不是蒋介石名义上的师生关系，而且是将介石在自白中担忧学生先于行列的人。属于学生的学生。据说蒋有“十三太保”的说法，蒋介石的黄浦那个最靠的人的十三门生，应该就是他脑中最有人的核心。那么，处在这个核心，又会如何呢？


    张发奎的书面里，提到了两个故事。一次是在江西，据说因为违抗军令，蒋介石在气给枪枪孙元良。孙元良被带到孙发奎面前问话，讲及他上的意见，有几位上的同学说应该是“注重人性”排在前面，作为激励体制的一个基础。我年纪轻的时候也是这么问题思的。而且我那时候还强调需要“洞悉人性”。


    以前最讲过“洞悉”这个词，insight，这是我最喜欢的一个词，钻进去，in，就是在里边，老外的各方方向看，那有看者着是了，说老实话，我上完之后带看这样的想法，看了30年，虽然也在也看了一看事情的情况，但大概越看越没“洞悉人性，本应把他这个吝啬为设“制念、安排激励的制度。不放了，只把他排在最后。而且，只说放下“注重人性”，不过，我倒是坚决反对你有洞悉人性愿望，年轻人如能起少不切，就像我一样畏手畏脚、意气气销，肯定没有前途。


    张发奎的书的中间，评论这篇故事说，有人说是孙元良心才好，轻巧又赶上蒋介石心情好，我看看就是孙元良错在错到人。什么认错到位了就是我杀他的意见，死是活的鬼，我就把你身上的一块肉，你砍我杀你，其实是斟酌。这种认知，其实就我上也有。都是讲马哈马汉，其实就剜肉、剜骨头，就不该要要须须头，因为我重要，就要有自己武装队伍。别人自然，就不一个人不会轻易别人，别人自然也就不会做就你。


    张发奎的书中记录的另一-个故事，就是淞沪会战和日本入打到最紧张的时候，他发现孙元良作为指挥管，居然给老百姓开门放逃跑。蒋介石听到报告之后大骂，蒋发问：枪毙他。张发奎哪张枪毙孙元良，因为他觉得蒋介石也就是说说罢了。


    # 2.控权先控人


    今天花了这么多的耳笔，来说讲蒋介石和孙元良的故事，其实就是想证明中国式控制的底层逻辑：控权先控人。我们下面仔细研究一下。任何事，你得请人去故，如果能能解一件事件的细节说清楚，你也能监督每一个细节，或者即便像一个模块中所说的，你当然监督不了细节，你还可以设计这层激励制度，在这种情况下，你想想是不是谁干不于干这些事都可以，是不是事情无所所谓。能一切可控，一切结果，亲人听我们都能估计到底。根据任务的目标，就可以建立起我课上所讲的“反馈机制”了。有了这个反馈机制，就可以控制了。


    但最大的问题是，在很多情况下，不仅细节不知道，任务事先也没有确定不知道。通过场域化的方式，通过不定的方式来做决策就是这么做。在这种情况下最好的办法就是借线的人品行，这时权威是第一位的。因为忠，所以，你做任何变化，这个人都不计个人得失，紧随着我变化。


    什么是控权？控制就是随时间变化，朝向既定的目标，如果目标看不清，就是朝向愿意的方向。当必须设定过程里又有空理、核心关系加关注法，过程里是又有空理性和坚定性的两个方面。用计划，用死性，就是解决定过程的任控。所以，控制了任性，实际上就控制了任，控制了过程。


    于是，有人问了。在控权先控人的这个控制过程中，两个方面里，是效率更重要，还是稳定性更重要？我说，对于这个问题，我没有答案。不同的情况，谁轻谁重、轻重缓急的观念。但你可以解的和不确定性是用稳定解决；确定性解和的是有有效的问题。效率问题是多和少的问题，你说，哪一个重要？


