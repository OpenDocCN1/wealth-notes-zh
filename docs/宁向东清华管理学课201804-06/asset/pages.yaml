  md: '期权等形式来落实报酬支付的递延性，是比较常见的。第一种，就是高科技公司。技术劳动，绝对是属于知识密集型劳动，劳动过程有很多隐蔽行动，作出决策的初衷和行动过程，是很难从外部加以监督的。这一类公司，为了牢固地捆绑住员工，一般是采用员工持股方式。在很多企业中，至少三分之一的员工，也就是那些核心技术人员，都拥有股权或期权，这就是一种递延报酬。


    第二种情况，就是美国绝大多数公司的高级管理人员，一般都会被授予公司的股权和期权，通过这种方式的递延支付让经理人自己约束自己。当然，对于经理人的报酬约束，条件也是非常苛刻的。很多时候，一本报酬合同，会像一本书那么厚。


    今天的课，核心内容就是一条：长期激励性报酬的本质在于它的递延性。对于当事人来说，被递延支付的报酬有点像一种实现业绩目标的保证金，为了获得这部分报酬，经理就要努力分配自己对于长期业绩的注意力和相应投入，以便实现收益的最大化。


    # ◆ 课后思考 ◆


    今天的课后，我想请你思考一下：如果给阿姨报酬，你每个月多给她500块钱，和年底给她6000块钱，激励效果会不会一样，为什么？


    # ■划重点


    > 对于当事人来说，被递延支付的报酬有点像一种实现业绩目标的保证金，为了获得这部分报酬，经理就要努力分配自己对于长期业绩的注意力和相应投入，以便实现收益的最大化。


