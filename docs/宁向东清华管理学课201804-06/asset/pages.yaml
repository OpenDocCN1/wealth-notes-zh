  md: '到双方利益的平衡点，让大家的利益追求的方向趋于一致化，就是好的激励方式。至于是不是选择给股权的方式，这倒不一定。最近几年，创业的人越来越多，一个非常重要的现象，就是大家都希望用股份来寻找到帮手。


    # ◆——课后思考——◆


    听了今天的课，我倒是希望你能从另外一个角度去想想，给股份是不是一个双刃剑？固然它有激励的作用，但实际上也有很多潜在的隐患。


    # ■ 划重点


    +   1.参与约束：一个人，如果踏踏实实地做一件事，他在这件事上的收益，一定要大于他的机会成本。

    2.激励相容：激励者和被激励的人之间，一定是共赢的，绝不能是一个人的赢，是以另外一个人的输为前提、为代价。

    3.不仅仅是入伙的时候，要满足参与约束，以后，时时刻刻都要满足参与约束。

    4.无论是什么样的方法，只要是有助于能够找到双方利益的平衡点，让大家的利益追求的方向趋于一致化，就是好的激励方式。


