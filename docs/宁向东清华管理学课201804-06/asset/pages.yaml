    显然，脸书所出现的情况就有可能属于上面情况的一种，或是几种。如果属于商业模式和盈利的需要，这就比较严重，已经超过了一般公司控制范畴的内容。如果属于扎克伯格作弊，则就是互联网公司内部控制问题的一个生动案例。


    总之，我觉得这个案件的深入调查非常有意义。美国人的调查结果也许来得迟，立法过程也许会比较缓慢。但我相信不管多慢，都会有助于改善中国的互联网环境。脸书事件，极有可能和安然事件一样会成为一个标志性的事件。


    说句题外话。中国是一个互联网大国，现在也有朝向互联网强国进军的趋势。但是，像脸书这样的情况，在我们的身边其实挺多的，只是我们在观念上还没有重视，隐私保护也相对不够健全。最近出现的所谓新零售，或者叫智慧零售，本质上都是用消费者的行为数据来做文章。而这里面一个极其重要的问题，就是该如何善用这些数据，保护我们每一个公民的权益。我认为我们在制度上还没有准备好。


