  md: '# 周末复盘｜欢迎说说你的复习建议


    本周末我们讲了控制活动的基本逻辑，最核心的内容就是第一天的那个架构图。请你周末花点时间把那个图复制一下下，最好把它记住，当知识，我觉得如果学到如下状态，就OK了。


    第一个层次，就是核心内容一定要死记硬背。你可以通过给同事、给朋友分享的方式，边讨论边达到这个目的。总之一句话，关键内容不需要多，但一定要记住。比如，刚才控制中的控制模型，有控制的目的、周期和反馈逻辑的概念，就是必须硬记的内容。死记硬背，不是要一个字不差，而是自己用一张白纸，画一画，大概你能画出来，就OK了。


    第二个层次，不需要死记硬背，但是你学过之后，在自己的头脑中一定要留有印象。别人说起这件事，可以接上别人的话。比如，本周我们讲到可控性失控的道理，就是因为没有方法控制结果，所以尽量控制别人的投入，控制这个过程。这里需要注意的是，控制是看不见结果，无法对工作进行追求的时候。通过控制别人的投入来追求进步的效果。当然，用忠诚的人，能够控制住他，这个人的能力可能就没有发挥的余地。所以，这个时候就要有一定的心理的底线。


    这个道理，你学过这门课，虽然不用死记硬背，但这个道理你懂了，我觉得就达到了目的。第三部分没有，也许你还会到自学去讲得很彻底。没关系，只要有概念，别人提起这个话题，你作为旁观者，能接得比别人接得上的话；别人对你问，你说出这个想法来，就有交互互动的能力。比如别人说失控循环，你知道是什么意思。我觉得，达到这个层次，就可以了。


    在清华读书，一门课程一个学期，我的学生基本要求就是这样：死记硬背的不到20%，而另外80%的内容，理解了，知道了，就够了。


    至于第三个层次，会应用，那是后面慢慢练出的问题。有很多同学给我留言说，老师讲的课，我都听懂了，但还不会应用。我特别能够理解，你特别难。线上的教育服务平台，目前还比较难实现真正的教育功能，还是一种信息单项输送的媒介，在这个平台上，同学们还很难相互讨论，这也是我们下一步要解决的问题。


    另外，很多同学有知识上的焦虑，有认知上的心态，我觉得是正常的，因为我们是自学的。记得我刚开始工作的时候，和同学们也交流，发现他们很多东西，我都不一样。即使是我当时就带着一半的教师的同事，去企业做课题，我就发现他们会的很多东西，我都不会。后来我发现，他们其实也很难。因为会的东西，他们也不懂。过了一段时间，大家就都自信了。认知有层级，当你把任何一门学问学深了，其实认知问题也相应解决了。


    最后，我们的课程有一周就结束了。我先提前给大家说，希望大家一起复习一段时间，你还有什么建议，可以给我留言，我都会看。


    # 一周精选留言


    来自：泽


    发挥失常，是一种主观认知，这种主观认知会产生认知偏差，偏差主要在于“常”的定义。因对“常”没有正确的认知，才会造成“发挥失常”的定义。也就是目标不清楚，控制不当造成的结果。如果对自己的能力有一个客观的认知，制定能力范围内的合理目标，是不会去对目标控制的，因为对没有“发挥失常”一说。“发挥失常”是因为自己的能力没有客观认知，是推掉责任的解释。


    来自：于恺


    今天听老师跟我们谈“中国式控制”这个话题，让我想起了前几年刚参加工作时的一些回忆。我的领导在沟通效率上很不高，一会儿开会，一会儿沟通。有前面的，需要在开会进行充分沟通，才能达到控制的效果。我们做一个项目的审批流程是这样的：初审—复审—贷审会—表决和备案。我们领导都会在贷审会前找到分管领导和部门负责人进行充分沟通，把问题细化了，然后再找其他可能有关的人，尽量达成一个共识，这是有效的沟通交流，贷审会的流程就比较简单了。如果在贷审会上时有异议，也是你刚才的突然杀出来的“程咬金”，那么结果就是“过而不决”。贷审会过后是如何去继续这个领导的“再沟通，既不能让各方人员有时间再重复沟通，又疑点，避免贷审会结果带来更大的损失，又让专业人员不会在会议上争吵、撒板脸，浪费大家的时间。而不得已的“议而不决”，是我前讲那个阶段领导而得的“协议”。从当前这个信息爆炸的时期，我认为“用正工人员用法”也是，用“正法法法工人员用法”。今天希望老师能通过宁老师的课堂分享给大家。


    来自：河南光光 | 破局历程


    老师好，记得我26岁，那当我一线里最重要的业务部门的负责人，一把手时代该说：考虑到我的功力和成绩，由我同时代言，等证明可以了，才会把它“拿”去掉。那时候，一把手和管理领导经常指导我如何管理，他们通过关系上上的具体事“让步而做”，使我悟到：“给自己能力下让更更多的下属能力”。即段时间，进步很大，成长很快。大概半年后，领导正式宣布了任命，充分管理。然后，一把手分管着几乎不属于我部门的具体工作，而是加大了我们的目标考核的工作。由于工作性质原因，我更多有创新的工作，无形中也促我一年更多地去关注行业竞争和主管的工作，可能才完成自己的目标。感悟：管理者要学李光复好目标和管理。”度“。目标清晰，对于基层管理着注重细节，重视反馈（不能对投入、过程和目标进行观察和不能）；2目标模糊，对于高层管理着要把握方向，重视宏观。（使其更多地关注方向和战略）


    来自：Aaya 安定


    弱者的控制力，我的理解是一种扭曲的控制，实现方式是给团队造紧箍器，或者是存在依赖与团队共同利益的一致性，是否存在公司利益下分取的一种控制力。按老师讲的控制的本质理解，就是弱者控制种“意外”，有可借由组织控制。比如团队中从员最多人的人影组织业绩，组织绩最大的人就会降低组织绩，弱势的“钉子户”会这样才资源小股东组织绩“等”之类组织绩的体现因处于利益相关关系，有了“主导”声音的机构，但其实是一种系上系“利益”，造控制坏环不完的健康表现。


    来自：王黎阳


    我认为这个说法完全没有反映事实，事实是本来自己自己的私人，中国人的用私不存有意他合共的私利。为方便的放弃权利（信任）的监控制合人双方应合的结果，是让大家相信不是相互信任，而只是越来越不相信。信任是一个一次性的决定，不是一个态的过程。如果没有管理，从制度到管理到信到果行政。最后的结果就是失去了信任，也失去了公司。可惜书这个案例的结，信任不应该能靠大家，就应应该更需要去目标。面对送出的大数责负责新，投技巨头恰恰在方面，切实行动会大家信，而着害怕的，不是这位互网联上投巨头说坏话，而是或许说反了，是投技术巨头核心议熟无，成为一种脱口而出。


