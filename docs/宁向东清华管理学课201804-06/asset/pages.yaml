  md: '# 234讲：指标控制I为什么要定红线


    234讲：指标控制I为什么要定


    你好，欢迎回到《宁向东的清华管理课》。


    在西蒙斯教授四种控制杠杆的体系中，指标控制是非常重要的一个部分。请注意，我不仅仅是非常重视，而且是非常关注，因为信号控制和边界控制，都是希望你做出正确的动作，无论人是主动的，还是被动的，都是激发人去去做动作，而动作的结果如何，这方面是检验动作和过程最终效果、最可说性的东西。


    # 1.指标控制的前提


    动作的结果，体现为业绩指标，实时的业绩指标，就像我在前面讲调节模型时的温度控制，第一要即时，第二要准确，即时效性和准确性出了问题，水温无论如何是调不好的。问题是在前面讲会计体系时，很认真，也都有数据，我们统计了出了经营结果，但分析都有问题，数据的最难的情况，就是经营活动的结果，是一个月之后才能公布，这就让管理者没有办法及时对市场情况做出反应，没有办法依赖数据进行有效的指挥。


    也正是因为这个缘故，最近二十年里，管理控制的信息化一直是企业界非常关注的，很多企业进入信息，引进SAP，包括过去很流行的Oracle系统，还有国内用友和软体等财务软件系统，都是为了加快指标和重要财务控制时间，提高针对这项决策的效率。但是，做出了这些投入，一定能做到结果吗？未必。为什么呢？因为下属会束手无策。


    下属束手无策，就会说管理层在最高级的指挥台上，看到的信息完全是不可靠甚至是假的，这些管理判断者不可接受的情况，因此，数据传到司令部，影响决策，指挥层跟根据数据指挥打大仗，不可能仅仅是靠错误。管理控制系统建设中，不仅要强调选择重要的、核心的指标，比如战略地和平均记分卡系统就是通过提高决策决策决策，我们的最佳目标的目的。同时，还要保证通过数据系统上反映出来的这些指标的数据，是真实的、准确的。所以，有建设有效的指标控制体系，一个前提性的任务，就是保证数据的真实性。


    # 2.让组织有红线意识


    那么，怎么才能形成指标都是真实的呢？核心就是靠对问题的正面处理，甚至让组织有红线意识。什么叫做红线？就是企业里绝对不可做的规定，犯了这条规定，不管你出不出现在问题，在这些家单位，你不仅仅会当时的，而且会面临人的一生。


    你现在花点时间想想，你现在的组织里面有什么红线？你有很强红线意识吗？我做过一点调查，对于当下的中国企业，很多从业者是没有的，这是事实，我们国家在体面上还属于发展的早期阶段，这个国家需要完善的东西还太多。


    宁向东


    最近，我的朋友那里面讨论的一个很有趣的话题，就是网络课程的盗版，甚至线下课程课里很多人录音，然后，拿到课程上去卖。


    199块钱一年的专栏课，很贵吗？其实，不算贵，但很多人就是想要去免费，甚至不付费的盗版，甚至我认识的有一些收人民币水平不错的学生，也在想，淘宝有卖盗版，要不要去承担连带责任。我觉得应该没有，但是，我还是给一个忠告的是管理者，都是出现了问题，朋友里有个人说他们部门跟盗版盗版里卖盗版，我觉得有人卖盗版不配在这条线上，盗版你都有点抬举了。一个做付费专栏，既然管理者还游离在盗版，一点红线意识都没有，这就是我们目前的现状。


    2001年我在哈佛商学院里受到的最大震撼之一，就是说每一个有意义的别人研究完成的时候，都会说明我的哪跟别人不同在哪里，都是说明哪跟别人不同的研究。比如卡普兰教授的平衡计分卡图示，很多老师自己的PPT里面，都会专门命名引用卡普兰的书，多少页，用一个圆圈画引号，就是版权的意思，表示：这里引用的内容，是当时感受到的就是差距。在尊重知识产权的环境下，大不愿意知道大家不分享出来，在咱们知识版权的环境下，大家只能把一些简单的东西拿出来，核心的东西，花了大力气创造出来的东西，不会拿出来。


    我们现在经常抱怨创新不足，其实，早期的创新现在是不可能从无到有完全获得足够的收益，就没办法去线去继续进行创新，大家就会知道破坏。但是，我们有这样的红线意识吗？显然没有。越过了红线会受到惩罚吗？也不会。这就是当下的现状。


    大环境如此，小环境组织也差不多到哪里。所以说，在你中间企业，十年前八年前也没有足够多的红线，没有必要的红线去，踩了红线也有事。其实，我在约上门工作，一件线所到管的事情，就是有的学生，或者希望，多少人是65到95年出生的，我希望能稍微影响他们，等你到了像我这个年纪，你的企业就应该有红线的企业经营状态，我今天讲的这些东西也是企业经营状态的状态。所以，今天的课，是为了将来准备的。


    # 3.红线在哪里？


    你也已经急不可耐了。卖了这么多亏字，红线到底在哪里？从基础的行为控制来说，红线往往先是“签证制”，也就是说，当外出做业务，花了多少钱，怎么花的，你要简单些，财务要按照规矩来记账，不能搞简单就要一为按照你的招牌，你招待了谁，几个人，用什么方式招待的，什么时间，所有这些内容在报销凭证上必须要清楚。


    在控制规范的企业里，绝不出现报几个报销凭证，上级领导一签字就报销的情况。一个员工，你代表企业去有做事，可能会给企业带来收益的东西去做事情，你企业带来利益。所以，必须是要知道如何控制住，控制或指报，就是靠这些凭证来做，通过些凭证的处理来看着事件不是符合公司的要求，是不是风险可控的范围内里面。


    在大型公司里面，每年都会例行性检查飞行检查，总部的合规检查人员、审计控制人员，或者其它管理部门的检查人员，会不断地在各个部门去巡查，试着发现体现在账面上的东西和记录实际发生的行动所产生的凭证是否不一样。只有可行性，才能完全部到要求的数据具有可靠性，总部决策者可以基于这些数据制定战略，指挥战斗。


    前几天清华大学，我和一位外所的朋友聊天，请他去总览人员和财务。朋友看财务人员一看就知道，就是知道触动了红线，比如，你报销的出租车费，对的费用在，比如，你举报的火车票，叫叫难费的费用是不对的。他一个电话打过去，就知道你人喝咖啡，而不是一间房。总之，那些人特别有经验，一般发数据就可以，就查开了，看不到身份是不是有开，所有员工知道公司的红线不是站在墙上的口号，那是真的制度，是真的红线。碰了红线，要弄死很大事情，于是，大家都不敢去开玩笑，大老板都不开玩笑，管理控制体系的信，就是真的，信息是真实的，公司花力气搞的指标才有用武之地，卡雷的那些形式技术性东西，公司投入人力去研究，才真的会改变管理，真的有好处。


    除了账证相符，财务上还有账实相符，就是账目上记载的，和实际上发生的，就不是一致，比如，你在账目上反映出来卖出去了，但是，仓库，记了收入。东实货，东西还在仓库里面，就是为了业绩。你就跟别人做配合，为了骗老板。等到出了问题，公司就会说，所以，销售人员一直保持，然后和账目一致，真相就会大白。


    除了账证相符、账实相符，还有一个原则，就是做到账账相符，就是不同的帐相关的账相互符合。也就是说，从实物、行动、数据最底层的各方各方面、各条线所反映的内容高度一致，指标控制系统才能成立，这是企业管理进行监控逻辑进行立。这是专业管理基础，进行控制的关键，请无论你怎么理解。


    # 课后思考


    今天的课后，如果要让你举一下你的组织应该加强的红线建设，你能列出几条。同'
