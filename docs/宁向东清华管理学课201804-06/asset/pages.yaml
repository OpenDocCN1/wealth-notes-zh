  md: '的水平，这是头等重要的，一定不能少于行业的平均水平，否则就会出现负向的淘汰。劣币驱逐良币，你就留不住优秀的人。


    当然，留住并不等于可以激励人，激励人还必须更给出比平均水平高一些的报酬，这就是激励性报酬的意思，但光是多给还没有用，还需要同时加强考核与淘汰，让失败成本变成一种特别现实的威胁，只有这样，才能形成真正的内在激励。


    复习：跟着电影学管理丨《利益风暴》


    # ◆— 课后思考 —◆


    请你思考这句话的含义：你顶多知道发生了什么，而不知道应该发生什么。


    # 划重点


    +   1. 效率工资：通过高报酬水平，也就是高于一般水平的安排，引发员工高质量工作的工资。

    2. 失败成本：给了高于市场水平的效率工资，员工还不努力付出，一旦被解雇，就没有办法挣到多出来的那部分工资。

    3. 如果只给市场上大家认为合理的价格，不会有激励效果。多给钱的同时，要注意有严格的考核和淘汰作为配套，有失败成本，效率工资的激励才有意义。


    ![](img/17b87b436c90c966960c6a3171fa356b_4_0.png)


    在福特之前，许多行业都采用了装配生产线，但都没有达到过福特的规模。福特按照泰勒的方式把汽车的生产分成独立的步骤，著名的T型车生产包括84个步骤，让单位生产时间缩短三分之二，在辉煌时期，福特的产量占全世界轿车总产量的一半。


    福特是科学管理的实践者，泰勒从任务入手，福特则从成本入手。


