    \n# 2.股票升值权\n\n我们昨天的课，重点讲了股票认购期权，这是长期激励性报酬的主要形式。但是，使用这种方式有多样的表现，比如说股票期权的结构，可以是股票，比如现金，也就是说，行权是要用钱的。如果当事人没有钱，那又该怎么办？一般来说，公司为了避免股票没有给到有钱人手中，或者拿不出那么多钱，会有一些相应的安排，比如由公司提供融资等等。\n\
    \n后来又有了这一大麻烦，还不如就给你的分量计算，直接给你现金。这就是我们后头出现了所谓的“现金升值权”，或者叫“股票升值权”，英文叫做stock appreciation\
    \ rights。“现金升值权”或者“股票升值权”与股票认购期权有着相似的激励效果，但是，对于当事人并不需要花钱去股票或者，只是对于股票的升值部分支付了多少钱。例如，股票价格从6.5元上涨到16.5元，当别人可以以公司支付给他每股10块钱的现金，用于在市场上市上通过购买股票获得这一收入。\n\
    \n我不知道你听到这种方式之后，你觉得这种方式是不是比股票认购期权更好。固然，这样看去，如果从鼓励性考虑，它的吸引力是，但是，长期细心思考，会发现这种安排与“股票认购期权”还是有很多差异。在用股票认购期权的情况下，行使了权利，股票是股票，但是还有需要付出买，还需要拿到手的现金，所以，还有后续的激励作用。\n\
    \n比如，行权者在行权之后，他手里还拿着股票，这时候还会激励他，因为股票上涨的时候，他的财富还是会增加的。也也就是说，认购期权是一种在行权之后还可以持续地获取期权红利。相反，如果当事人是现金，他很快会把股票就卖了，那这之后了，下一个信号，说明他对未来的公司成长没什么信心了。所以，我们一个人就看多少数量，留下了多少股票，就知道了他对于公司的未来的发展抱着什么样的态度。如果这个人不断减持已经行的股票，甚至把行权后的股票全部都卖掉，股东也许就会考虑更换他了。\n\
    \n这些都是如果选择现金升值权作为长期激励手段，不具备的功能。也就是说，现金选择权，使用起来相对比较简单，它涉及到实益的获取，也有防止股权被稀释的好处。但是，它的创意也是有限的。你听听这里，大的公司以实现，不同的激励方式，都是会适用条件的。凡事有一利，就会有一弊。\n\
    \n# 3.限制性股票\n\n比如，有些人，有些岗位，在某些条件下，必须要给予股权，而不是股票认购期权。比如说，大股东又怕拿不到无条件，因为他当管理者，或者拿了股权就离开了，或者不尽力，直接给了股权，就使这个很难收回。所以，股票要给，但是，你有权无限制，这个限制是给他的股东和股东权利不一样。因为你当管理者，拿股权的理由是要为股东管理好企业，所以要付一些限制他。这类股票就叫“限制性股票”。比如要求你必须在公司工作，你不工作了，那些股权也卖不得。"
