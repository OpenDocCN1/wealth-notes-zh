    这个实验说明了什么？它说明了惯性的力量，同时也说明了变革的不易。当伯顿认为，这种下意识反应几乎完全是无意识的。和变革目标意识的反抗与手完全无关。我们的思维已经高度适应了惯性模式，所以，你的东西会用它带来适应，在它会上意识的排挤指令，显然它不比我们在课堂上产生的排挤反应。


