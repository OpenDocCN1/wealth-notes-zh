    # 定量分析：钱的 RATE 和 PMT #43


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_50_0.png)


    在现实中，无论投资也好，还是一些理财产品或者保险产品也好，鬼点子的天才产品经理会设计出不明说费率的产品，比如只说投了多少钱，每年投多少，多少年后，可以得到多少钱。


    就算是业务员说了，也不算数，因为他们也仅是鹦鹉学舌，也不清楚到底是多少。这个时候 RATE 这个函数就至关重要了。


    如果看过我前几篇财务公式的文章，依葫芦画瓢即可。


    ## 一） RATE 函数：


    ### a) RATE 定义：


    RATE 函数基于等额分期付款的方式，返回某项投资或贷款的实际利率。


    ### b) RATE 函数


    ```

    RATE（nper, pmt, pv, fv, type, guess）

    ```


    - nper：付款期总数

    - pmt：各期应付的金额（年金）

    - pv：现值

    - fv：未来值

    - Type：各期付款时间是在期初，还是期末（1为期初；0为期末）。


    ### c) RATE 示例：


    举例 1）


    Nper：假如你存钱的期限为 12 年；


    Pmt：假如你每个月都存进去 500 元；


    Pv：假如你第一次一次性存了 3000 元；


    Fv：假如你想过了 12 年收到 300000 元（本金+利息）；


    Type: 0 或 1，表示你每次存钱的时间是期末还是期初，0 是期末，1 是期初，因为如果期末基本当期不算利息，所以是 0；


    | 序号 | 参数 | 数据 | 说明 |

    | :--- | :--- | :--- | :--- |

    | 2 | Nper | 144 | 存款期限12年 |

    | 3 | PMT | (500) | 每个月都存进去500元 |

    | 4 | PV | (3000) | 第一次一次性存了3000元 |

    | 5 | FV | 300000 | 过了12年后，收到的本息 |

    | 6 | Type | 0 | 各期的支付时间在期末 |

    | 9 | 1.58% | 月利率公式：=RATE (B2, B3, B4, B5, B6) | |

    | 10 | 20.72% | 年化利率公式：=(1+B9)^12-1 | |


    注意：


    上面截图中 B9 是月利率，年利率 = 月利率 * 12。但更准确的是：年利率 = (1 + 月利率) ^ 12 - 1。同时：rate 和 nper 单位应一致。例如，同样是月或年。在所有参数中，支出的款项，表示为负数“
    - ”，为现金流出；收入的款项，表示为正数“ + ”，为现金注入。上方的 (500) 和 (3000) 是因为数字前面加负号“ - ”，因为 excel 表格默认显示的原因，所以没有显示负号“
    - ”。特别注意：如有符号错误，计算结果也会出错。


    举例 2)


    投入 3000 元，之后每个月投入 0，存入 6 年，达到 3582.157 的收益，那么银行的利率至少为 3%；


    | 参数 | 数据 | 说明 |

    | :--- | :--- | :--- |

    | Nper | 6 | 存款期限6年 |

    | PMT | 0 | 每个月都存进去500元 |

    | PV | (3000) | 第一次一次性存了3000元 |

    | FV | 3582 | 过了6年后，收到的本息 |

    | Type | 0 | 各期的支付时间期末 |

    | 3.00% | 年利率公式：=RATE(B2,B3,B4,B5,B6) | |


    举例 3)


    某人 2018 年，受银行工作人员的忽悠，购买了一份定期保险，年缴费 2000 元，缴费期间 10 年，最后得到资金 22000 元。那么，年利率是多少？


    PMT = -2000，NPER = 10，PV = 0，FV = 22000。


    年利率 = RATE(10, -2000, 0, 22000, 1) = 1.73%


    银行工作人员，忽悠的水平确实不一般。如果早会用这个公式，就可以避免被忽悠了吧！


    举例 4)


    冲动的年轻人特别喜欢信用卡分期购买苹果电脑。假设购买电脑 6000 元，分 12 期归还，每期 500 元，收取手续费是消费金额的 7.2%（工商银行、中国银行的标准），那么对银行来说：


    PV = -6000 + 432（手续费） = -5568，即银行初期付给我 6000 元，接着收回手续费 6000 * 7.2% = 432 元，实际银行付出
    5568 元。


    PMT = 500（每月银行收入 500 元），NPER = 12，FV = 0，TYPE = 0。


    年利率 = RATE(12，500，-5568，0，0) * 12 = 14.02%


    > 不算不知道，一算吓一跳！比贷款利率还要高出好多，你还会用信用卡的分期还款吗？


    RATE 小结：


    RATE 函数可谓小巧简单, 对一些保险类品种, 此函数可以快速计算出自己的成本或收益。


    ## 二) 年金 PMT


    与大家平时生活最息息相关的非 PMT 函数莫属，比如你家的月供。


    a) 年金函数 PMT 定义：


    PMT 函数即年金函数，基于固定利率及等额分期付款方式，返回贷款的每期付款额。


    ### b) PMT 函数


    PMT（rate，nper，pv，fv，type）


    - rate——各期利率

    - nper——付款期总数

    - pv——现值，

    - fv——终值，缺省为 0

    - Type: 0 为期末，可缺省；1 为期初。


    ### c) PMT 示例：


    已知贷款的年利率(4.9%)，贷款年限(30 年)，贷款总金额(200 万)，现在分别计算年偿还金额、季度偿还金额、月偿还金额。


    =PMT (4.9%，30，2000000) 计算年偿还金额。


    =PMT (4.9%/4，30*4，2000000) 计算季偿还金额。


    =PMT (4.9%/12，30*12，2000000) 计算月偿还金额。(-10614.52)


    | 项目 | 公式 | 结果 |

    | :--- | :--- | :--- |

    | 年还款 | =PMT(4.9%, 30, 2000000) | ￥-128,623.58 |

    | 季度还款 | =PMT(4.9%/4, 30*4, 2000000) | ￥-31,900.55 |

    | 月还款 | =PMT(4.9%/12, 30*12, 2000000) | ￥-10,614.53 |


    So easy, 大家在度娘上找的每月还款工具中的更底一层, 就是这个函数。


    ## 三) 更多有用的财务函数: NPV, PPMT, IPMT


    朋友, 您自己来！


    ## 四) 科普小知识 (注 2)


    EXCEL 函数一共有 11 类, 分别是数据库函数、日期与时间函数、工程函数、财务函数、信息函数、逻辑函数、查询和引用函数、数学和三角函数、统计函数、文本函数以及用户自定义函数。


    ### 财务函数


    财务函数可以进行一般的财务计算, 如确定贷款的支付额、投资的未来值或净现值, 以及债券或息票的价值。财务函数中常见的参数：


    未来值(fv)：在所有付款发生后的投资或贷款的价值。


    期间数(nper)：投资的总支付期间数。


    付款(pmt)：对于一项投资或贷款的定期支付数额。


    现值(pv)：在投资期初的投资或贷款的价值。例如，贷款的现值为首借入的本金数额。


    利率(rate)：投资或贷款的利率或贴现率。


    类型(type)：付款期间内进行支付的间隔，如在月初或月末。


    (一笑加一笑， 2018 年 4 月 3 日 夜)


