    # 房产投资精算法 #40


    写在前面：按照进度，本应开始写公众号创建以来最为重要的主题之一：赚钱的具体投资品种。但最近群友提出的问题，让我隐隐担忧。还是先讲讲投资中的定量分析，几篇小文足矣。


    投资这种事情，如果不会定量分析，必定是跟着感觉在下押注。总是认为下一次会好，再给一次机会，就能赚钱。很多朋友在一个上百万/几百万的投资（这里指房产）上，竟然在买入之前从不做理论和数据上的分析，我很是愕然。更有言论只要涨就好，从不预测涨幅。这……
    谁又会为您的钱袋子负责呢？'
  - '[PAGE 14]


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_14_0.png)


    投资永远永远永远是非常严肃的问题。所有的盈亏一定是在投资前就已经反复推演，反复计算，反复确认过的。不可大意！不可大意！不可大意！无论你有千个拟或一万个理由看多或看空某项投资，一定要落实到真实的数据上。投资要讲理，赚钱的概率才会大。


    > 言归正传, 举个简单的例子: 假设投资一套 127.06 平的三室房屋, 单价 19807.69 元（含税费价格），初始首付现金（含税费）100 万，首付成本按
    7%计算；贷款 160 万，年基准利率 5.15%，利率打 9 折，投资期限 6 年。房租第 1 个月 4800/月，预计房租每年涨 5%；


    这是一个标准的普通百姓房产投资的例子，有多少朋友算过：6 年后的保本价是多少？每年涨百分之几可以保本（单利）？


    由于本篇是大纲，所以只讲框架，本文中使用的财务公式细节，如：PMT，FV，IRR。留在后面的小文中讲。同样，为使表述简单，只采用纯商业贷款，混合贷款方法类同。'
