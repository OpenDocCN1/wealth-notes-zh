  - '[PAGE 247]


    看房 200 套意味着，你对房子的理解与普通人完全不同了！


    第一目标 6N 意味着什么呢？意味着交易的整个环节，你不再紧张的看待买房子这个事儿了；意味着交易环境的各种坑，你也碰到过了；更意味着，你成为了普通人的反面，不再是靠死工资生活了，原来负债是值钱的！


    当然最最重要的是你理解了社会的运转方式了，你的思维与众人完全不同了！


    # 五）关于本套 16 本文集


    这 16 本欧神文集足以让你在理论上学到了楼市投资体系了，如若不能，你应该出去跑跑市场，最好可以先做几个小单。


    学习游泳最快的方法是：先找个水池，然后一个猛子扎进去。别把时间浪费在各种理论上，这一套足够了，足够了，足够了！


    做为楼市投资，已经有 8 本《欧神文集 楼市投资体系》的基本的理论了，基本上没有什么可补充的了。欧神已经把骨骼搭建好了，接下来，任何人也只能是填充血肉而已。


    要么往上一层，关注应用侧：比如一些实操及技巧，一些地域性操作；要么往下一层，那需要深厚的经济学功底了。'
