  md: "\n# 三) “金闪借”历史\n\n2018 年 4 月，南京、苏州最开始公积金提额的试点，分别是苏州的金闪借（原工银秒贷）和南京的金闪借。这是一款面向公积金缴纳客户提供的个性化、定制化贷款服务。只要您正常缴存公积金，就可以无担保、无抵押、纯信用定制个性化贷款服务。\n\
    \n后续，“金闪借”陆续推广到了广东（名字叫“税闪借”），由于深圳地区是计划单列市，税收不归广东，因此“税闪借”不包括深圳地区。对深圳库友来说，这确实有点儿尴尬！\n\
    \n# 四) “金闪借”支持的地区\n\n据不完全统计，目前支持的地区已经包括：\n\n北京、上海、南京、苏州、武汉，厦门、扬州、常州、兰州、潍坊、枣庄、日照、威海、德州、绵阳、成都、巴中、嘉兴、绍兴、台州、青岛、厦门、重庆、安顺、都匀、沧州、唐山、德阳、泸州、郑州等等。\n\
    \n名单一直在扩大，其他地区也在陆续开通。只要工行 APP 中能够看到“金闪借”，就可以成功操作。名单外的库友，表着急，你也可以试一下文中方法。或许有惊喜呢。\n\
    \n另外北京地区稍微麻烦，需要自带公积金流水，通过 e 分期来实现。\n\n> 注：上海已经在前文单独讲过，上面也有文章链接，此处不讲。\n\n# 五）北京提额操作方法\n\
    \n北京地区较为繁琐，需要通过 e 分期来提额。\n\n首先，带上自己的身份证、借记卡、信用卡、公积金流水、产证等，去柜台申请 e 分期。提交之后，会生成一张专用分期借记卡，并最少申请一笔\
    \ 10000 的 6 期分期。\n\n办理完成之后，跟业务员要一张“牡丹信用卡业务申请单”，填上信用卡卡号、原有额度、变更后额度，证明材料一起上交。主要是公积金流水，一定要上交。过三天，既可以收到提额短信。\n\
    \n最后，按照文中末尾“八）提额操作”中的步骤进行提额。\n\n# 六）广东地区（不含深圳）提额操作方法\n\n操作步骤：\n\n关注“广东税务”公众号。菜单栏选择：“微办税”->“个人办税”->“税银互动平台”->“信用贷产品展示”->“税闪借”->“我要授权”->“授权”->“现在贷款”。\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_106_0.png)\n\n公众号申请完成之后，在工行手机银行 APP\
    \ 上选择“本地服务”->“税闪借”\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_107_0.png)\n\n\
