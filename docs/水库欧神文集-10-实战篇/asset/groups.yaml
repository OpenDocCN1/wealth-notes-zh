  - '[PAGE 19]


    # 6 年保本计算：


    | 保本价 | 25235.96 元 | | 保本增长率 (单利) | 4.57% | |


    首付 (本息) = 首付 + 首付 6 年来的利息。


    现金支付 (本息) = 每月支出的现金+每月支出现金到第 6 年末的利息。


    总支出 (本息) = 以上 2 项加总。


    保本价 = 【总支出 (本息) + 第 6 年末还贷款】/ 房屋平米 (这里是 127.06)


    保本增长率 (单利) = (保本价 - 买入价/年) (这时是 6 年)


    d) 初步的投资结论：


    | 年均增长 (单利) | 现金收益 | | < 4.57 | 已事实上亏损 | | = 4.57 | 年化 7% 的理财 | | > 4.57 | 年化
    7% 理财+房屋增值部分 | |


    我们要心知肚名，哪怕每年平均只涨 4.57%，也就是 10 年涨 45.7% 是保本。对于普通百姓而言，也是非常划算的，相当于手里的每笔现金定期做了一笔复利
    7% 的理财。'
