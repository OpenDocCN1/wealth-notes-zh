    在前一篇文章《赚钱的紧箍咒 #20》中，我们明确了我们的投资准则：只在赚钱的品种上投资，再次提醒一下，务必戴牢这个“紧箍咒”！投资不是只讲某一次/某几次谁赚的更多，更要讲谁活的更久。


