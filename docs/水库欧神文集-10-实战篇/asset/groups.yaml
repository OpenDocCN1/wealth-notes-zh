    \ 1 万秒提额到 20 万 #9900》\n\n原理：就是工行利用你的公积金缴纳情况，来预备审批你的“金闪借”的额度。而工行信用卡额度与“金闪借”预审额度是绑定的。一切都是套路！\n\
