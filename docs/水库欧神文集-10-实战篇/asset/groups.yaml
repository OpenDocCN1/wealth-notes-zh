    # 日本房地产泡沫（一） #711\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_183_0.png)\n\n \
    \ 综观全球市场，我所知道的有3个地方曾经发生过房地产暴跌。一个是日本，一个是我国的香港，一个是芝加哥。理论部分后面写文章补回来，本文来说说日本。\n\n\
    \  在分析日本泡沫的研究中，大炮的研究方法我是比较认同的，这里写给大家。最后会写写我的见解，以飨库友。\n\n## 一）前言\n\n  日本1986—1991年发生房地产泡沫事件，最终房地产大泡沫轰然倒塌，随后房价步入漫长下跌之旅，日本经济陷入失落的二十年。一直到今日日本没有回来！\n\
    \n## 二）中国\n\n  中国房地产繁荣和迅猛发展始于1998年，自朱相全面启动住房货币化改革开始，开始进入房地产大牛市。\n\n  房价出现连续多年的增长，大约在15年前，也就是2003年，政府就已经开始了各种调控政策。泡沫言论就已经传遍街头巷尾。2003年！上海莘庄当时3000元/平可以买个不错的房子。\n\
    \n## 三）泡沫\n\n  专家在谈论泡沫，普通百姓在谈论泡沫。可什么是泡沫呢？比较滑稽的是，时至今日（2018年），经济学上也没有给出一个明确的“泡沫”含义。凡是张口闭口谈“泡沫”的专家学者，俺是通通鄙视的。因为他们统统在“装”。\n\
    \n  因为日本发生过房地产泡沫崩盘事件，所以中国媒体、专家、百姓，总是拿日本来说事儿，一晃就是15年。年年都说，百说不厌。总是提醒我们日本式泡沫破裂的严重后果。但日本当时泡沫是如何产生和如何破裂的，与中国的现状是否相似却从未给出明确的答案。\n\
    \n  资产的暴涨是否合理，是否有泡沫。呵呵，你就别乱猜了。99.999999%的写报道的人连定义都不清楚的。\n\n## 四）研究“泡沫”的2本书\n\n\
    \  实际上如果研究一下著名的“郁金香泡沫”，不过是一个笑话，不过看似疯狂罢了。如果大家真的想细细了解一下日本房地产泡沫真相，不妨看看，日本野口悠纪雄先生的专著《泡沫经济学》。\n\
    \n  媒体惯用恐吓的手段来吓唬普通百姓，聪慧的朋友可以看看2本书：日本著名学者野口悠纪雄的《泡沫经济学》，以及盖伯尔（Peter Caber）《天下第一泡沫》“The\
    \ Famous First Bubbles”。 （注1）\n\n  下面数据来自任大炮的研究（采集数据时间为2007年）：\n\n## 五）日本与中国的背景情况对比\n\
    \n  中国是否发生了日式房地产泡沫？可以对比一下日本和中国的情况：\n\n| 日本1986-1991年的特点 | 中国目前的现状 |\n| :--- |\
    \ :--- |\n| 1. 股票价格暴涨、金融成本降低 | 股票价格暴跌、基本丧失融资能力 |\n| 2. 金融放松、给不动产巨额融资 | 金融管理严格、开发信贷几无增加\
    \ |\n| 3. 土地私有并市场化、预期收益提高 | 土地国家垄断、政策性推动地价上涨 |\n| 4. 土地价格上涨、家庭收入增加 | 土地价格上涨、家庭支出增加\
    \ |\n| 5. 零付款土地抵押贷款增加 | 必须支付全部地价后抵押贷款 |\n| 6. 股票与土地升值增加了消费与需求 | 家庭自住性消费占主导地位 |\n\
    | 7. 投机行为提升了股票与土地的预期价格 | 必须支付首付的少量投资与投机行为 |\n| 8. 大量的非不动产企业与政府购买土地 | 土地购置与开发主要为不动产开发\
    \ |\n| 9. 税收制度扭曲了土地的保有与使用关系 | 税收有利于拥有多套住房 |\n| 10. 设备与房屋投资增加 | 实体经济因素促进全面投资增长\
    \ |\n| 11. 汇率波动币值上升 | 汇率僵硬、币值稳定 |\n| 12. 国际资本净流出 | 国际资金流入 |\n| 13. 利率降低 | 利率升高\
    \ |\n\n  中国与日本的极大差异，中国不会出现或者说各种可查的数据显示中国并不存在日本发生泡沫现象的前提。\n\n## 六）中国与日本经济对比的重大差异\n\
    \n| | 日本 | 中国 |\n| :--- | :--- | :--- |\n| 土地 | 由家庭向法人机构与政府部门转移 | 由国家垄断向法人机构和家庭转移\
    \ |\n| 交易过程 | 家庭收入增加、储蓄增加（储蓄变成信贷能力增加）、消费增加 | 政府收入增加、家庭支出增加、储蓄减少、消费减弱（个人信贷增加） |\n\
    | 目的 | 土地保有和土地投机、出租房屋增加（住宅产量增加） | 土地转换为生产原料、房屋向个人销售 |\n| 价格属性 | 市场价格 | 权力价格+垄断价格+市场价格\
    \ |\n| 资产价格 | 股票与土地暴涨（1986年股价与地价暴涨了3倍） | 股票暴跌、连续3年熊市 |\n| | 一般产品与服务价格稳定 | 土地暴涨、房价上升（2004年上升20%，2003年之前平均工业产品出厂价上涨、服务与能源价格上涨CPI价格指数从负增长变正向增长\
    \ |\n| 地价与租金 | 从与GDP平行变动突变为土地高于GDP 1倍-1.5倍，租金为0.25倍-0.5倍 | 增幅均低于GDP增幅（平均） |\n\
    | 金融背景（经济环境与政策） | 金融宽松、财政紧缩 | 金融紧缩、财政适度 |\n| | 股价上涨使权益融资加大 | 股市融资极低、自有资金为主 |\n\
    | | 土地抵押信贷、信贷购买土地 | 有价土地的抵押信贷《开发信贷的严格控制》 |\n| | 汇率升值、利率降低 | 汇率平稳、利率上升 |\n| | 准银行及信托大量金融支持\
    \ | 非银行融资能力极弱 |\n| | 个人消费信贷宽松 | 个人消费信贷严格 |\n| | 保有环节税低 | 无保有环节税 |\n| | 置换更新特别优惠措施（10年）\
    \ | 置换住宅加税（2年） |\n| | 交易环节税轻（让与征税）课税效果 | 交易环节税重（印花税、营业税、契税、所得税） |\n| | 继承税制有利于购置与保有土地\
    \ | 无继承税 |\n| 租务税 | 租务税率低 | 租务税率高 |\n| | 存款无利息税 | 存款有利息税 |\n| | 固定资产税1.4%（实际0.06%）\
    \ | 固定资产税（家庭住房免征） |\n| | 地价税（新增税种），有扣除（低税率0.3%） | 出让金预先交纳 |\n| | 农地征税（必须地化的农地）\
    \ | 农地征税无限制（征用） |\n| 资产变动的主要 | 股票（虚拟价格） | 土地（权力价格） |\n| 交易对象 | 土地（不完全市场价格） | 房屋（市场限量应价价格）\
    \ |\n\n## 七）日本国内生产总值（GDP）与股票、土地资源额的变动趋势\n\n单位：万亿日元\n"
  mdcn: "\n# 四）价格上涨\n\n  无数的天朝经济学专家学者说现代货币是有“锚”的，呵呵呵呵。要我说那个锚就叫做“心情”。心情好了少印点儿，心情不好就多印点儿。自1971年，美元脱离金本位后，谁见过这个“锚”？\n\
    \n  然后有人提出，不对！央行负债太高不行。呵呵，你被教育得很好。我给个答案：多高都行。\n\n  实际上货币供应，并非都是大家理解的现金，也可以是支票类提取的存款。\n\
    \n  以官方数据为准（假设是准确的），2003年5月与2018年5月的货币和准货币（也即M2）数据如下（注2）：\n\n| 日期 | 货币和准货币（M2）\
    \ | 增长率 |\n| :--- | :--- | :--- |\n| | （单位：万亿） | |\n| 2003年5月 | 19.9 | |\n| 2018年5月\
    \ | 174.3 | 875.88% |\n\n  有的朋友会说有的东西并没有上涨8倍。是的，这个8倍表示有的商品涨了16倍，有的涨了8倍，有的可能仅涨了1倍。但整体而言，必然是上涨。唯有2个意外：\n\
    - 这个商品被世人所抛弃，没有价值了。\n- 这个商品的生产率奇高。\n\n  凡是价格必然是边际价格，就意味着商品价格仅由流通中的部分货币决定的。如果把储蓄中的货币，哪怕只拿出来10%消费，那景象不要太美，天下大势，浩浩荡荡！\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_165_0.png)\n\n  大家想想2011年日本核泄漏时，所有的盐价如何瞬间爆发？再远一点儿2003年SARS时，那个小小的板蓝根之价。不多说了，咖啡御免。商品远远没有你想的那么多。\n\
    \n# 五）通货膨胀的特点\n\n  除了要牢记通货膨胀的概念，即通货膨胀就是：货币增加了。\n（注：本人实在不愿意在货币前面加个定语“过度的”或者“不恰当的”）\n\
    \n  还要记住通货膨胀有很多特点。\na) 货币增加。\n除了现金增加，还有信贷的增加。\nb) 货币增加预期。\n比如当年的4万亿，只要有这种预期，聪明的人就清楚1年以后的RMB购买力比现在要低。他们很快就会采取行动。至于是什么，多军笑而不语。砖本位？\n\
    c) 货币质量。\n自货币脱离金本位开始，纸币就已经没有什么质量可言了，也就是没有什么价值了，背后剩下的就是gun的力量。而在这纸币时代或者即将到来的数字货币时代，必然发生银行信用和货币的迅猛增长。至于其背后原理，这个说来话长，容有时间再讲。\n\
    \n  货币是几千年来人民自然的选择，其本身就是商品，无外乎流动性更好，所以大家愿意储藏。货币价值的变化与任何商品的价值变化是一样的，往往也是取决于人们的心理预期。就如人人关心的猪肉价格，不仅取决于目前猪的供应问题，也取决于成猪出栏的预期。\n\
    \n  所以多军吃通货膨胀这碗饭时，要**牢记通货膨胀的本质和特点**，不要被各种狡辩言论所干扰。科学这东西从不以人的意志为转移。\n\n  关于物价，在宏观经济学中，有一项著名的“货币流通速度公式”：QP\
    \ = MV\n+ Q：商品数\n+ P：价格\n+ M：货币数\n+ V：流转数\n\n  也可以这样写：商品价格 P = MV/Q。货币价格与商品价格是反向关系。\n\
    \n  所以人们经常说货币的价值不仅仅取决于货币的数量，还取决于货币的“流通速度”。公式中货币流通速度增快，物价则上涨快，也就是货币贬值了。貌似很有道理，但这通常是理工生的思维。\n\
    \n  我们进一步反问一下：这个货币“流动速度”怎么会加快呢？它无外乎是人们担心货币会贬值，用脚对货币投票，加速购买商品罢了。也就是说人们相信商品价格会上升，加速抛出手中的货币。这才是根本原因。也就是说货币“流动速度”增加是货币预期的后果之一。\n\
    \n  理工生喜欢用公式来看待人世间所有问题。而人文科学是一门推演科学，普通人常常缺乏逻辑推演的能力。\n\n# 六）对通货膨胀的几个误解\n\n  **误解1：通货膨胀由“商品的短缺”引起,不是由货币数量的增加引起。**\n\
    \n  商品价格的上涨：可能是货币增加引起，也可能是商品短缺引起，或者由两者共同引起。比如：今年的猪肉涨价了。可能是因为货币增加，也可能因为出栏猪减小。\n\
    \n  在普通百姓中，通货膨胀是由“商品的短缺”所引起的误解最深。而政府官员最喜欢以这个为借口打击奸商。\n\n  有的朋友喜欢以战争年代举例，事实上，即使在极端的战争年代，普遍的商品短缺也不会引起价格的普遍上涨。\n\
    \n  设想一下如果在战时，战时民用商品短缺。如果战争仅仅是通过税收，则用于军火炮弹的货币比例与从民用品挤占的那一部分货币相当。民用商品的短缺怎会让价格大幅上涨？通俗点讲：货币并没有增加，民用商品生产减少，其价格上涨。但是这种价格上涨是由于短缺引起的，并不是通货膨胀引起的。而真正的事实应该是：与此同时，因为用于民用品的货币会减少，所以价格不会上涨太多。\n\
    \n  **误解2：预算赤字引起了通货膨胀。**\n\n  如果政府出售债券而导致的预算赤字，也就是从其它处借来的钱，并不会发生通货膨胀。欠债还钱这种事，从不会引起通货膨胀。\n\
    \n  预算赤字，只有在货币供给增加时才具通货膨胀性质。话说即便预算盈余，但只要货币供应增加，才会通货膨胀。\n\n  任何情况下引起的价格螺旋式上涨，如果在之前，同时，或者很短时间后，没有新增的货币供应，这种现象都不会持续。\n\
    \n  如果人们的收入并没有增加，商品价格上涨无疑只会引起销量的下降。简而言之，我们的技能并没有增加太多，而所有人的工资却在大幅上涨，这通常是通货膨胀的后果。商品价格的普遍持续上涨，也是同理。\n\
    \n# 七）解决通货膨胀的办法\n\n  解铃还须系铃人，既然通货膨胀的原因是货币和信贷的增长，解决通货膨胀问题，方法很简单：停止增加货币和信贷。\n\n\
    \  说不容易。一般有下面几个原因：\n\n  **1）预算赤字。**\n  政府收入来源无外乎3种：税收、政府债券、印钞机。\n  税收：这种方法不会导致通货膨胀。可这种方法民众可以直接感受到，必然民怨沸腾。而同时会降低并且中断企业生产，这种方法天然具有约束性。\n\
    \  债券：这种方法不会导致通货膨胀。可欠债还钱，还有利息。现实地方债的结果是：连利息都还不起，更别想还本金了。最后都是展期再展期。\n  印钞机：任何人短时间内都感觉不到痛。无影无踪的解决了问题。哪怕物价上涨，也是很久以后的事情，老百姓也找不到真凶是谁。媒体报道个“奸商”，政府严惩不贷，大肆宣传一番，以解民怨。\n\
    \n  避免政府赤字，停止政府的巨大开支即可，但这需要小政府。可小政府意味着官员的权力变小，自己割自己的肉，谁有这个动力呢？\n\n  **2）利率。**\n\
    \  利率是市场对获取资金渴望程度的指示标。人为的规定低利率，便刺激了借贷的增加，从而导致了货币和信贷供应的增加。人为干预利率，是个无解的难题：要保持利率人为降低，就必须增加货币和信贷供应，否则利率必然提高。\n\
    \n  **3）金本位。**\n  政府之所以放弃金本位或者金银复本位，无外乎找个借口通货膨胀更容易罢了。金本位（或金银复本位）对信用的扩展有一个天然的限制。如果不回到这种本位上去，通货膨胀无可避免。\n\
    \n# 八）通货膨胀的未来\n\n  制度是人定的，一切皆在人心！通货膨胀的效果之一是造成财富和收入的再分配（注意不是增加）。\n\n  在通货膨胀的前期阶段（也就是还没有体现在大多数商品上涨时），部分先拿到新货币的人先受益，当然未拿到货币的人是受损的。受益的这部分人，当然希望维护通货膨胀。作为多军朋友，你心里是不是这么想的？！\n\
    \n  事实上，很多朋友虽然嘴上反对通货膨胀，但并不是真心的。很多朋友会认为增加自身收入的速度能够快于自己生活成本的增加，并最终成为获胜者。很多人想的是：“除了我的产品价格和收入之外，其他人的产品价格不要上涨，其他人的收入不要增加。”唉，普通百姓的智慧啊。\n\
    \n  当然最最虚伪的往往是政府，为了赢得民意，他们一边说坚决“反对通货膨胀”，而同时会加上一条保护“充分就业”，这一点，朋友们可以仔细观察每一次通货膨胀严重时期的政府官文。普通民众所不曾知晓的是：“任何充分就业政策的内容九成都是通货膨胀。”\n\
    \n  历史的经验告诉我们，通货膨胀必然以危机和萧条告终！但如果说萧条已经很糟糕了，比这更糟糕的是百姓错误的看法：萧条不是由之前的通货膨胀引起的，而是由资本主义“固有的缺陷”引起。资本主义还有个“固有缺陷”，这是什么玩意儿？\n\
    \n# 九）总结：\n\n  总而言之，通货膨胀就是：货币与银行信贷相对于商品数量的增加。\n\n  它的害处数不胜数：它使单位货币贬值；使人民的生活成本提高；它对全体人民征收相同的铸币税，穷人生活更加艰难；它使人们的储蓄价值大损，并打击人民储蓄的积极性；它打击节俭与勤劳；它使人民不再相信正义，它败坏公共与私人道德。\n\
    \n  政府（政客、官僚）操控了货币就等于配备了打开全国公民家门的钥匙，可以随时随地、随心所欲地使用通货膨胀盗窃公民的财产，而且永远不必担心被捉赃。人类社会的癌症，非通货膨胀莫属。说它是经济危机、大萧条乃至一切社会灾难的祸根，我也完全同意。\n\
    \n  时至今日，多印钱的形象词语如空气般消失。“通货膨胀”这个词被“价格上涨”所替代。形象的词语销声匿迹，无影无踪！你是智者吗？\n\n（一笑加一笑， 2018\
    \ 年 8 月 4 日）\n\n[注 1]：百度百科中的“通货膨胀”：\nhttps://baike.baidu.com/item/%E9%80%9A%E8%B4%A7%E8%86%A8%E8%83%80/152246?fr=aladdin\n\
    \n[注 2]：数据来源：中国人民银行。\nhttp://www.pbc.gov.cn/diaochatongjisi/116219/116319/index.html\n\
    \n# 人民教师 #623\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_174_0.png)\n\n## 一）前言\n\
    \n  近日上海行情冷淡，最近2个月，房产评估价格下降的更是厉害。老水库群里大家也提前进入了布局2019年的节奏。（注1）\n\n  昨天好友周博士在群里发了一张表格，记录着其父自工作以来的工资记录。引起一片小小的涟漪。这个数据弥足珍贵之处：真实、精确。\n\
    \n  周叔叔于1964年开始在苏北的一个县城工作，中学老师，2000年退休。54年里一共拿了薪水77万。\n\n  本公众号在“通货膨胀系列”篇里，大道理、小原理、实例基本都讲完了（除了首篇外，其它都是欧神早年的文章），但今天这份表格顿时引起我的兴趣。\n\
    \n  这个数据是宝贝啊！CCAV和RM日报会不小心“遗漏”一些数据。\n\n  先说一个令我们沮丧的结论：如果没有资产，在不远的将来，我们一辈子赚的钱，在孩子们看来就是个笑话。\n\
    \n## 二) 真实数据\n\n  在原始表格上，我添加了一个“涨幅”项。\n\n| 开始月份 | 终止月份 | 月工资 | 月数 | 总工资 | 累计工资\
    \ | 涨幅 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| | | | | | | |\n\
    \n（注2）\n\n  库友们仔细看。远的，可以发现93年9月和10月连续两次工资猛涨。124.5元到345.5元，次月又调到579元。短短2个月涨幅：3.65倍！\n\
    \n  当年人民银行还搞了个“保值储蓄”（注3），但你也别想的太多，保值从来不易。\n\n  近的，08年到11年的涨幅是多少呢？涨幅：84.65%。\n\n\
    \  我们以3年为一个周期做个工资图：\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_177_0.png)\n\n\
    \  哪怕当年3.65倍的涨幅，在漫长的岁月里，也仅藏在那个小角落里，那么的不起眼。\n\n  周叔叔这54年来工资一共涨了274倍，可他是富人了吗？（注4）\n\
    \n  通胀猛于虎！看到这份表格，我在想，有生之年，下一次将会是何时呢？\n\n## 三）方便面\n\n  日常生活中，2元的方便面价格，会持续好多年。在物价管理下，涨价并不容易。但仔细的朋友会发现，量小了，比如缩小一半。当其价格某一天涨到4元时，普通百姓的理解是涨了1倍。聪明的朋友知道，价格涨了整整3倍（量小一半，价格涨一倍）。\n\
    \n  真的多军从来分的清：名义价格 和 实际价格。\n\n  四个人在韩国吃个火锅2万韩元，在越南则需要70万越南盾。他们也是从1元开始的，20年后的中国呢？\n\
    \n## 四）价格上涨的状态\n\n  周叔叔的工资表格，就是真实的平均物价表格。我们可以清晰的看到，通货膨胀的最终效果（也就是价格上涨），表现的并不会跟M2那么的步调一致，但不可能永远被掩盖。\n\
    \n  通货膨胀亦如憋尿，憋一时可以，憋一世是万万做不到的。\n\n  到某一个时间点上，通货膨胀的效果会突然显现。这也是空军可以在绝大多数的时间里嘲笑多军，但在爆发的时刻，空军永无还手之力。\n\
    \n  嘲笑虽能让空军在绝大多数的时间里获得心理安慰，但成本是巨大的。每一个物价上涨战役后，都会出现一批新空军。毕竟老空军阵亡了。\n\n## 五）多军的忧虑\n\
    \n  时至今日（2018年11月），身边很多库友，特别是2016年加入的新库友，对6%的抵押成本感到重重压力，且悲观情绪严重，毕竟最近2年来一线城市表现令人沮丧。左算右算，肯定不划算。\n\
    \n  已有之事将来必有，易行之事将来必行，太阳底下无新事。在天朝，半个世纪的行事轨迹，不会嘎然而止。在通货膨胀这头猛虎面前，哪怕只有12%，或者降到10%，新库友也尽管可以安心。唯一的风险来源于对现金流的规划。\n\
    \n## 六）对策\n\n  一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……\n\n  欧神早给出了方法，我在这里复述一下：\n\
    - 1) **优质**负债。我们仅是储蓄到资产中。\n- 2) 孩子。当然您也要教育好。\n\n  很多朋友说自己还养不活自己，哪能养活的了孩子？我只给两个字：爱情。\n\
    \n（一笑加一笑，2018 年 11 月 18 日 晨）\n\n[注 1] 2013 年前加入水库的库友，并且线下有过多次交流。群主为心谷，即现任淘屋 CEO。\n\
    \n[注 2] 数据版权为周博士所有，如引用，请先获得其授权。\n\n[注 3] 保值储蓄参见百度百科：\nhttps://baike.baidu.com/item/%E4%BF%9D%E5%80%BC%E5%82%A8%E8%93%84/10896218?fr=aladdin\n\
    \n[注 4] 看过“水库思维”公众号通货膨胀系列文章的朋友知道，在整个通货膨胀过程中，教师是比较吃亏的。\n\n  熟悉我的朋友都知道，我关心的话题只有一个：一切与普通百姓赚钱有关的事儿~\n\
    \n  如果你感兴趣，加微信：150500211，群内交流。验证语：水库思维。\n\n  欧神懒得教的琐碎技能，都在这里。\n\n# 房地产铁打的泡沫\n\n\
    # 日本房地产泡沫（一） #711\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_183_0.png)\n\n \
    \ 综观全球市场，我所知道的有3个地方曾经发生过房地产暴跌。一个是日本，一个是我国的香港，一个是芝加哥。理论部分后面写文章补回来，本文来说说日本。\n\n\
    \  在分析日本泡沫的研究中，大炮的研究方法我是比较认同的，这里写给大家。最后会写写我的见解，以飨库友。\n\n## 一）前言\n\n  日本1986—1991年发生房地产泡沫事件，最终房地产大泡沫轰然倒塌，随后房价步入漫长下跌之旅，日本经济陷入失落的二十年。一直到今日日本没有回来！\n\
    \n## 二）中国\n\n  中国房地产繁荣和迅猛发展始于1998年，自朱相全面启动住房货币化改革开始，开始进入房地产大牛市。\n\n  房价出现连续多年的增长，大约在15年前，也就是2003年，政府就已经开始了各种调控政策。泡沫言论就已经传遍街头巷尾。2003年！上海莘庄当时3000元/平可以买个不错的房子。\n\
    \n## 三）泡沫\n\n  专家在谈论泡沫，普通百姓在谈论泡沫。可什么是泡沫呢？比较滑稽的是，时至今日（2018年），经济学上也没有给出一个明确的“泡沫”含义。凡是张口闭口谈“泡沫”的专家学者，俺是通通鄙视的。因为他们统统在“装”。\n\
    \n  因为日本发生过房地产泡沫崩盘事件，所以中国媒体、专家、百姓，总是拿日本来说事儿，一晃就是15年。年年都说，百说不厌。总是提醒我们日本式泡沫破裂的严重后果。但日本当时泡沫是如何产生和如何破裂的，与中国的现状是否相似却从未给出明确的答案。\n\
    \n  资产的暴涨是否合理，是否有泡沫。呵呵，你就别乱猜了。99.999999%的写报道的人连定义都不清楚的。\n\n## 四）研究“泡沫”的2本书\n\n\
    \  实际上如果研究一下著名的“郁金香泡沫”，不过是一个笑话，不过看似疯狂罢了。如果大家真的想细细了解一下日本房地产泡沫真相，不妨看看，日本野口悠纪雄先生的专著《泡沫经济学》。\n\
    \n  媒体惯用恐吓的手段来吓唬普通百姓，聪慧的朋友可以看看2本书：日本著名学者野口悠纪雄的《泡沫经济学》，以及盖伯尔（Peter Caber）《天下第一泡沫》“The\
    \ Famous First Bubbles”。 （注1）\n\n  下面数据来自任大炮的研究（采集数据时间为2007年）：\n\n## 五）日本与中国的背景情况对比\n\
    \n  中国是否发生了日式房地产泡沫？可以对比一下日本和中国的情况：\n\n| 日本1986-1991年的特点 | 中国目前的现状 |\n| :--- |\
    \ :--- |\n| 1. 股票价格暴涨、金融成本降低 | 股票价格暴跌、基本丧失融资能力 |\n| 2. 金融放松、给不动产巨额融资 | 金融管理严格、开发信贷几无增加\
    \ |\n| 3. 土地私有并市场化、预期收益提高 | 土地国家垄断、政策性推动地价上涨 |\n| 4. 土地价格上涨、家庭收入增加 | 土地价格上涨、家庭支出增加\
    \ |\n| 5. 零付款土地抵押贷款增加 | 必须支付全部地价后抵押贷款 |\n| 6. 股票与土地升值增加了消费与需求 | 家庭自住性消费占主导地位 |\n\
    | 7. 投机行为提升了股票与土地的预期价格 | 必须支付首付的少量投资与投机行为 |\n| 8. 大量的非不动产企业与政府购买土地 | 土地购置与开发主要为不动产开发\
    \ |\n| 9. 税收制度扭曲了土地的保有与使用关系 | 税收有利于拥有多套住房 |\n| 10. 设备与房屋投资增加 | 实体经济因素促进全面投资增长\
    \ |\n| 11. 汇率波动币值上升 | 汇率僵硬、币值稳定 |\n| 12. 国际资本净流出 | 国际资金流入 |\n| 13. 利率降低 | 利率升高\
    \ |\n\n  中国与日本的极大差异，中国不会出现或者说各种可查的数据显示中国并不存在日本发生泡沫现象的前提。\n\n## 六）中国与日本经济对比的重大差异\n\
    \n| | 日本 | 中国 |\n| :--- | :--- | :--- |\n| 土地 | 由家庭向法人机构与政府部门转移 | 由国家垄断向法人机构和家庭转移\
    \ |\n| 交易过程 | 家庭收入增加、储蓄增加（储蓄变成信贷能力增加）、消费增加 | 政府收入增加、家庭支出增加、储蓄减少、消费减弱（个人信贷增加） |\n\
    | 目的 | 土地保有和土地投机、出租房屋增加（住宅产量增加） | 土地转换为生产原料、房屋向个人销售 |\n| 价格属性 | 市场价格 | 权力价格+垄断价格+市场价格\
    \ |\n| 资产价格 | 股票与土地暴涨（1986年股价与地价暴涨了3倍） | 股票暴跌、连续3年熊市 |\n| | 一般产品与服务价格稳定 | 土地暴涨、房价上升（2004年上升20%，2003年之前平均工业产品出厂价上涨、服务与能源价格上涨CPI价格指数从负增长变正向增长\
    \ |\n| 地价与租金 | 从与GDP平行变动突变为土地高于GDP 1倍-1.5倍，租金为0.25倍-0.5倍 | 增幅均低于GDP增幅（平均） |\n\
    | 金融背景（经济环境与政策） | 金融宽松、财政紧缩 | 金融紧缩、财政适度 |\n| | 股价上涨使权益融资加大 | 股市融资极低、自有资金为主 |\n\
    | | 土地抵押信贷、信贷购买土地 | 有价土地的抵押信贷《开发信贷的严格控制》 |\n| | 汇率升值、利率降低 | 汇率平稳、利率上升 |\n| | 准银行及信托大量金融支持\
    \ | 非银行融资能力极弱 |\n| | 个人消费信贷宽松 | 个人消费信贷严格 |\n| | 保有环节税低 | 无保有环节税 |\n| | 置换更新特别优惠措施（10年）\
    \ | 置换住宅加税（2年） |\n| | 交易环节税轻（让与征税）课税效果 | 交易环节税重（印花税、营业税、契税、所得税） |\n| | 继承税制有利于购置与保有土地\
    \ | 无继承税 |\n| 租务税 | 租务税率低 | 租务税率高 |\n| | 存款无利息税 | 存款有利息税 |\n| | 固定资产税1.4%（实际0.06%）\
    \ | 固定资产税（家庭住房免征） |\n| | 地价税（新增税种），有扣除（低税率0.3%） | 出让金预先交纳 |\n| | 农地征税（必须地化的农地）\
    \ | 农地征税无限制（征用） |\n| 资产变动的主要 | 股票（虚拟价格） | 土地（权力价格） |\n| 交易对象 | 土地（不完全市场价格） | 房屋（市场限量应价价格）\
    \ |\n\n## 七）日本国内生产总值（GDP）与股票、土地资源额的变动趋势\n\n单位：万亿日元\n"
