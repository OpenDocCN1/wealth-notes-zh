    \ 20 万 #9900\n\n**注：目前此洞暂时性坍塌。凡事要赶早啊！**\n\n# 一）前言\n\n群友们知道，一笑身为老水库，会经常写一些干货文章给大家。其中不凡一些干货，其它水库组织中是收费的。\n\
    \n前文：**《上海市信用卡办卡员（靠谱） #9002》**，是经年累月，踩雷无数，才挑选出来的，佛度有缘人。\n\n今天来讲讲工行信用卡，这是水库圈内可以直接分期，就可以当作现金使用的信用卡。\n\
    \n本公众号中有一篇文章：**《工行信用卡分期精算 #6124》**（注 1），详细讲述了工行信用卡可以直接分期使用的原因。\n\n工商银行号称“宇宙行”，当然也被戏称“大妈行”。没有一张大妈卡，信用卡是不敢称你为入门的。时至今日，这种好卡，想办下来，那是不容易的。“大妈”们可都是火眼金睛，想办下来大额工行信用卡，那是千难万难的。\n\
    \n今天，一笑给大家讲讲工行信用卡从 **1 万秒提额到 20 万** 的方法（**干货**）。最近 3 天实测 20 人，仅 1 人未成功（此人公积金情况有问题）。\n\
    \n原理：就是工行利用你的公积金缴纳情况，来预备审批你的“金闪借”的额度，而工行信用卡额度与“金闪借”是绑定的。一切都是套路！\n\n# 二）上海操作方法：\n\
    \n上海地区的库友，在 APP 中看不到金闪借，必须亲自去网点（带上身份证（非必须）、信用卡及绑定手机）。\n\n1）找到工行的智能终端。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_123_0.png)\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_123_1.png)\n\n2) **先不要插入信用卡**，滑动界面到最右侧。点击：**分行特色**。\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_124_0.png)\n\n3) 按要求插入信用卡，输入密码。\n\n\
    ![](img/998d37a9a4955949ecbc2ff65f9f659f_124_1.png)\n\n4) 你将会看到如下“金闪借”界面，点击“公积金明细查询”\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_125_0.png)\n\n5) 如果出现不符合条件提示，则就没有机会了。否则勾选授权协议，点击“秒授信”。\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_126_0.png)\n\n6）手机号会自动填入，点击“获取验证码”，收到短信验证码后，填写验证码，点击“下一步”。\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_127_0.png)\n\n7）获得“金闪借”审批额度，哇 20 万！点击“滑动退卡”。\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_128_0.png)\n\n注：不要点击“融e借”或“e分期”。\n\n\
    # 三）提额操作\n\n登录“中国工商银行”手机银行。信用卡- > 选择此张信用卡- > 额度调整->修改额度（拖拽）- > 下一步- >，既可以将信用卡的固定额度提升至金闪借额度。\n\
