    # 《欧神文集》16本阅读顺序 #1000


    普通人赚大钱的渠道不多，房产算是一个（注 1）。所以我整理出这套欧神文集，供大家系统学习！


    为何我这么推荐欧神文集？可以先看下面这篇文章（推荐）：


    - 赚大钱 - 欧神文集，信则得永生 #1001


    欧神文集按时间划分为 2 个部分：一个是 2003 年至 2015 年，即风水库论坛公众号（以下简称公众号）成立之前 12 年的所有文章；另一个是公众号里的所有文章。


    而公众号里的所有文章则又分为 2 部分：一是楼市相关文章；另一个是思想相关文章（也即杂文篇）。


    全套欧神文集共 16 本，包含从 2003 年至公众号 2018.01.11 离婚事件的所有文章（文章个数、文章内容及文章图片均不偷工减料）。


