    # # 赚钱的紧箍咒 #20


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_296_0.png)


    # ## 赚钱的紧箍咒 #20


    注：只为申请原创。重发一次。再次提醒，本公众号只讲普通百姓赚钱逻辑的理论。高手勿进，不敢误您的宝贵时间。


    俗话说：人无横财不富，马无夜草不肥。


    本不想这么啰嗦，但怕有的朋友走火入魔，误入歧途。赚钱这事儿，说容易也容易，说难也难。思维上还是要上纲上线。今天就讲讲在理论上赚钱的紧箍咒。


    +   一）赚钱的基本原则。

    凡是容易进入的，门槛低的，难赚钱。比如股票，几千块钱就可以玩，赚大钱者廖廖；做保洁，保安，不需要太高的文化，但基本一眼忘穿：码农？不评论，被很多大神瞧不起的群体，前途光明……哈哈！


    +   二）普通百姓赚钱的紧箍咒。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_296_1.png)


    +   a） 赚权力、关系的钱。不是官二代，不是富二代，下辈子吧，过。'
