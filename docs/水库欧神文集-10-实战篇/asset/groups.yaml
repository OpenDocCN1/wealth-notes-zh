    # 三) 更多有用的财务函数: NPV, PPMT, IPMT


    朋友, 您自己来！


    # 四) 科普小知识 (注 2)


    EXCEL 函数一共有 11 类, 分别是数据库函数、日期与时间函数、工程函数、财务函数、信息函数、逻辑函数、查询和引用函数、数学和三角函数、统计函数、文本函数以及用户自定义函数。


    # 财务函数


    财务函数可以进行一般的财务计算, 如确定贷款的支付额、投资的未来值或净现值, 以及债券或息票的价值。财务函数中常见的参数：'
  - '[PAGE 57]


    未来值(fv)：在所有付款发生后的投资或贷款的价值。


    期间数(nper)：投资的总支付期间数。


    付款(pmt)：对于一项投资或贷款的定期支付数额。


    现值(pv)：在投资期初的投资或贷款的价值。例如，贷款的现值为首借入的本金数额。


    利率(rate)：投资或贷款的利率或贴现率。


