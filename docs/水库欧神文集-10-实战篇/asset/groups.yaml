    在这个 1%概率赚钱的情况下，怎么能一击必中呢？


    # 天天想着赚大钱的人，必然赚不到大钱。


    —— 一笑加一笑


    论信息获取时效，消息解读，数据分析，普通百姓与机构投资者竞争，无异于以卵击石。与年薪百万的机构经理比，普通百姓必然在各个方法无法企及。


    但世界是公平的，凡事无绝对！大有大的好处，也有大的烦恼。股市专治各种不服，总是有很小例外，也有很少见但经常出现的机会。我们一一分析。


    +   1）股市中每年都有一、两次抽风。


    基民是盲目的羔羊，每次股市抽风时，必然伴随的是大跌，基民大量赎回。基金公司手中金子般的品种，平时是无论如何也不舍得卖出的。此时这种品种下跌最少，面对无脑的基民的赎回，也只忍痛割爱，机构竞相出货，美人贱卖。普通百姓抱得美人归的时机就在此时。


    +   2）容不下大机构的股市品种。


    有一些股市品种，容不下机构的这种大象。这是普通百姓股市投资的第二个赢利点。小也是一种美！'
  - '[PAGE 147]


    3）其它。


    不讲了！赚钱的必定是偏门（无论股市还是现实）。


    > 注： 下一篇会讲各种股市中的品种。


    # 四）概率


    如果你在股市中找到了一种稳定盈利概率是 51%的投资方法，而一旦盈利，就是暴富。我也说你必定可以发大财！怎么发大财呢？


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_147_0.png)


    哈哈，粗粗来讲，就是一定要保证能下注 100 次，而保证没有赢利的 99 次中本金不要亏光。挣个钱真的是不容易！常用做法可以用：凯利公式。后面会讲。'
  - '[PAGE 148]


    # 五）亏钱


    本公众号的介绍是：“一切普通百姓赚钱有关的理论”。有群友提了一个问题：“教别人赚钱？你有多少钱？”。开公众号，建群，纯属偶然。别猜了，普普通通人。


    > 不要怕出错，不然你永远不会正确。--- 汤姆.威克


    如果亏钱的时候，还感觉到了苦味的话，说明你亏的时间不够久。2012年之前，我一共亏了A8.2（投资人的钱），自己创业及股市亏了A7+。一直到2012年，我才开始在投资路上跨对步伐。第一次相信犯进中举发疯是真事儿，是我可以在股市中一天赚很多钱，那天我浑身冷汗，人生第一次失眠。终于知道“风淡云清”这四个字，不是随随便便可以做到的。


    没有不曾失败的成功者，亦如开车时小磨小擦才不会出大事故。在一些投资路上我亏过钱，所以希望群友以我为鉴，即使走弯路，也不要太久太远！


    下一篇开始讲具体的品种。


    （一笑加一笑，2018年4月16日夜）'
