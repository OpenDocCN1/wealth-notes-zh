    ——给在股市中屡败屡战的朋友


    股市为什么总是亏钱？


    投一枚硬币，一共投 10,000 次，猜一下正反面对次数各是多少？5000:5000（不会差太多）。朋友您要是真无聊，可以陪孩子试验一下。


