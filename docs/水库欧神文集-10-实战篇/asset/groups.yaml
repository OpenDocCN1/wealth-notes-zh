    ## 定量分析：钱的 FV 和 PV #43


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_41_0.png)


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_41_1.png)


    定量分析：钱的 FV 和 PV #43


    如果从经济学讲货币，那需要从只有 1 个人的世界开始，层层逻辑推理，一到现在这个规模复杂的全球贸易及纸币膨胀的大时代。本文不是讨论金钱理论的，您也不必上纲上线。


    回到远古，即使你给别人哪怕 1 0000 0000 RMB，也逃脱不了被煮了吃的命运，What??? Yes。


    ### 一）钱


    现代纸币没有任何使用价值，对，擦屁股都会嫌它太硬，还那么擦不干净。但人人就是爱啊！我们就如小动物一样，孜孜不倦的存储，只不过我们希望攒很多很多很多的钱，但有多少人知道：其实我们的目的不是要有很多钱，而是想要钱背后所对应的商品和服务。就如我们要吃饭，目的也不是吃饭，而是解决饥饿问题。


    Sorry，比较尴尬的是，经过几千年的系统发展，绝大多数物品和服务是无法储藏，即使可以储藏，其成本也巨大无比。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_43_0.png)


    普通百姓知道钱变毛了，但是毛多少，怎么计算？这……


    ### 二）鸡蛋


    熟知今天的钱永远比明天的钱值钱（无论是通胀，还是紧缩），是你与普通之间华丽的分隔线。


    > —— 一笑加一笑


    小时候家里老母鸡下了个蛋，可卖 5 分钱，当然也可以趁父母不注意偷偷拿出去换 1 根甜甜的冰棍（至今回味无穷！）；20 年后，还是那么个横竖也看不出什么区别的鸡蛋，可卖
    1 块钱，刚好可以买 1 根甜甜的冰棍。


    如果 A = B，B = C，则 A = C。鸡蛋还是那个鸡蛋，冰棍还是那个冰棍，特么的 5 分钱怎么就等于 1 块钱了？


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_44_0.png)


    哦，原来是 20 年前的 5 分钱的购买力 = 现在 1 块钱的购买力。购买力要是能储存那就好了，比如储存 30 年吃的馒头购买力，存储 30 年教育的购买力，存储
    30 的看病购买力……想想都美！


    群友问，要不您说说紧缩？时间宝贵，这种逆趋势的事情，放到最后讲吧。


    ### 三) 时间


    本杰明·弗兰克说：钱生钱，并且所生之钱会生出更多的钱。这就是货币时间价值的本质。(别较真，资本是什么？说来话长。)


    不做理论上的分析，只需要记住今天的 1 块钱价格是大于明天 1 块钱的；同理，明天 1 块钱价格是小于今天 1 块钱的。时间越长，差距越大。


    钱还有价格？是的是的是的，比如 1 块钱的价格可以是一根冰棍，可以是一瓶农夫山泉矿泉水，可以是一小包块泡泡糖，也可以是一个橘子，还可以是……


    真正的价格来源于交易，那当前市面上标签纸的价格呢？但这个话题有些庞大，后面讲经济原理的时候，再来讲讲。


    ### 四）FV（未来值）


    #### a) FV 定义


    FV 是 Future Value 的缩写，这里我们可以称之为金钱的未来值。


    #### b) FV 函数


    ```text

    FV（rate，nper，pmt，pv，type）

    ```


    - rate：各期利率

    - nper：付款期总数

    - pmt：各期应付的金额（或得到的金额）

    - pv：金钱现值，缺省为0

    - Type：各期付款时间是在期初，还是期末（1为初期；0为期末）。


    注：pmt 简称年金，后面会单独讲与年金相关的知识。


    #### c) FV 示例一


    假设现在有 100 元，做一笔投资，15%利率，以后每年都不需要继续投钱，那这笔现在的 100 元未来值是多少呢？


    | 数据 | 说明 |

    |---|---|

    | 15% | 年化利率 |

    | 10 | 付款期总数 |

    | 0 | 各期应付金额 |

    | -100 | 现值 |

    | 1 | 各期的支付时间在期初（请参见上面的信息） |

    | =FV(A2, A3, A4, A5, A6) | 未来值 |


