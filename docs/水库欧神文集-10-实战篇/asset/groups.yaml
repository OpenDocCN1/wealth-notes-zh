    # 房地产铁打的泡沫'
  - '[PAGE 183]


    # 日本房地产泡沫（一） #711


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_183_0.png)


    日本房地产泡沫（一） #711


    综观全球市场，我所知道的有 3 个地方曾经发生过房地产暴跌。一个是日本，一个是我国的香港，一个是芝加哥。理论部分后面写文章补回来，本文来说说日本。


    在分析日本泡沫的研究中，大炮的研究方法我是比较认同的，这里写给大家。最后会写写我的见解，以飨库友。


    # 一）前言


    日本 1986—1991 年发生房地产泡沫事件，最终房地产大泡沫轰然倒塌，随后房价步入漫长下跌之旅，日本经济陷入失落的二十年。一直到今日日本没有回来！'
  - '[PAGE 184]


    # ## 二）中国


    中国房地产繁荣和迅猛发展始于 1998 年，自朱相全面启动住房货币化改革开始，开始进入房地产大牛市。


    房价出现连续多年的增长，大约在 15 年前，也就是 2003 年，政府就已经开始了各种调控政策。泡沫言论就已经传遍街头巷尾。2003 年！上海莘庄当时 3000
    元/平可以买个不错的房子。


    # ## 三）泡沫


    专家在谈论泡沫，普通百姓在谈论泡沫。可什么是泡沫呢？比较滑稽的是，时至今日（2018 年），经济学上也没有给出一个明确的“泡沫”含义。凡是张口闭口谈“泡沫”的专家学者，俺是通通鄙视的。因为他们统统在“装”。


    因为日本发生过房地产泡沫崩盘事件，所以中国媒体、专家、百姓，总是拿日本来说事儿，一晃就是 15 年。年年都说，百说不厌。总是提醒我们日本式泡沫破裂的严重后果。但日本当时泡沫是如何产生和如何破裂的，与中国的现状是否相似却从未给出明确的答案。


    资产的暴涨是否合理，是否有泡沫。呵呵，你就别乱猜了。99.999999% 的写报道的人连定义都不清楚的。


    # ## 四）研究“泡沫”的 2 本书


    实际上如果研究一下著名的“郁金香泡沫”，不过是一个笑话，不过看似疯狂罢'
  - '[PAGE 185]


    了。如果大家真的想细细了解一下日本房地产泡沫真相，不妨看看，日本野口悠纪雄先生的专著《泡沫经济学》。


    媒体惯用恐吓的手段来吓唬普通百姓，聪慧的朋友可以看看 2 本书：日本著名学者野口悠纪雄的《泡沫经济学》，以及盖伯尔（PeterCaber）《天下第一泡沫》“TheFamousFirstBubbles”。
    （注 1）


    下面数据来自任大炮的研究（采集数据时间为 2007 年）：


    # 五）日本与中国的背景情况对比


    中国是否发生了日式房地产泡沫？可以对比一下日本和中国的情况：'
