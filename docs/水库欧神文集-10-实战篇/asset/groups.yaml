    ## 七）结论


    空当接龙是非常非常消耗精力的一件事情，必须要认真负责。如果不是超级玩家，不建议玩到极致：额度利用率极致，刷卡日期极致。力量永远大于技巧，多核可以解决很多融资问题。


    当然如果你总是纠结细节，倒不如先玩几次，然后豁然开朗了。


