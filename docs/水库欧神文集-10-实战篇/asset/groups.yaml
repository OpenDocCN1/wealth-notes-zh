    ## 定量分析：内部收益率 IRR #41


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_24_0.png)


    看到上面图片，外加密密麻麻的符号，有没有被吓了一大跳的朋友？哈，不必紧张，本文只讲述内部收益率 IRR 函数怎么使用。


    IRR 的原理与 NPV 函数息息相关，这里不讨论。感兴趣其原理的朋友，自行度娘。


    对于绝大多数投资来说，四则运算（加、减、乘、除），足矣！但了解一些基本的财务公式，还是非常有必要的。


    成本之事，生死之事；收益之事，生死之事。均不可不察！


    yevon_ou 经常会说，拉一下 IRR，看一下成本（或收益）。很多新群友会私聊我：内部收益率 IRR，怎么拉？


    ## 我晕，就是不倒！


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_25_0.png)


    群友们，一对一服务，很贵的！索性，我就写一篇小文讲一下 IRR。


    ### 一）IRR 定义


    内部收益率 IRR 函数：它返回由数值代表的一组现金流（包含支出和收入）的内部收益率。这些现金流不必为均衡的，但作为年金，它们必须按固定的间隔产生，如按月或按年。内部收益率为投资的回收利率，其中包含定期支付（负值）和定期收入（正值）。


    大家看好定义：一定是固定间隔（按年或按月）；要有支出；要有收入。


    ### 二）IRR 语法


    格式：IRR(values, guess)


    功能：返回连续期间的现金流量的内含收益率。如果我们借钱，这个值越低越好；如果我们投资算收益，这个值越高越好。我们只关心 values 这个参数就行了。对 guess
    参数感兴趣的话，度娘吧。


    ### 三）IRR 普通示例


    如果您将下面示例的表格（不包含第 1 行）复制到空白 excel 工作表中头部，会易于理解该示例。


    可复制的数据如下：


