    \n# 赚钱的逻辑\n\n# 黑市拳王唐龙的启示 #50\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_137_0.png)\n\
    \n赚大钱 – 黑市拳王唐龙的启示 #50\n\n投资大师巴菲特的三原则：第一条，不要亏钱；第二条，不要亏钱；第三条，牢记前两条。知易行难。\n\n说说我在投资路上最害怕的事情是什么？有一个小故事，我比较喜欢。（注\
    \ 1）\n\n# 一）唐龙的故事（注 2）\n\n有一位传说中的中国人，在美国黑市拳赛场上风靡一时，他就是‘唐龙’，“唐龙”真名叫弗兰克陈，中国名字叫陈进生，出生在台湾新竹。尽管他喜欢叫自己“唐龙”，但拳手们都叫他“鲨鱼”，因为唐龙在拳击台上异常凶狠，经常在几个回合内击毙对手。唐龙在自己的格斗之路上走的非常顺利，他的战绩是97\
    \ 战 96 胜，其中 95 次击毙对手。\n\n按理说 97 战 96 胜，相当好的成绩了，胜率接近 99%，那唐龙的结局是什么呢？在连续胜利 96 场后，他在和被称为“推土机”的克里斯蒂保利的一战中，遭遇了致命的一次失败，而这次失败，让唐龙永远倒在了拳击台上，再也没有能力站起来。\n\
    \n大多数黑市拳中的顶尖高手，最终都是唐龙这样的结局，也就是前 N 场比赛中收获胜利、荣耀和巨额奖金后，在第 N+1 场比赛中最终倒在了赛场上。\n\n俗话说的好，被淹死的都是会游泳的，很多职业投资者，把每一次投资机会，都当成黑市拳选手的格斗比赛，他们胜利了\
    \ 1 次，2 次，5 次，10 次，20 次，有的时候是快速盈利，有的时候有惊无险，先浮亏再盈利，他们每一次都将杠杆做到极致，就好像不带任何防护措施的手们走向赛场一样，他们品尝着一次又一次的胜利，他们的收益率非常的美丽，他们的资产也不断的膨胀，一切都那么的美好，资本市场变成了他们的提款机。\n\
    \n但终于有一次他们遇到了麻烦，市场不按照他们预测的方向前进，由于没有防护措施，这一次失败给他们带来了致命的损失，有些人将前面的所有盈利全部亏光，还有些人因此背上了巨额的债务，甚至有人因此走向了监狱，或者不堪重负结束了自己的生命。\n\
    \n对于投资而言，首先要避免的就是“唐龙”式的结局，因为一次致命的失误，导致资金爆仓，这就需要选择合理的投资组合与合理的仓位。\n\n合格的投资者即使上赛场格斗，也要穿上足够厚的铠甲，只要对手有可能将自己置于死地，那么即使有再高的奖金，也要放弃比赛，只有这样，才能在长跑中坚持下来。\n\
    \n记住，永远不要和“唐龙”们比收益率，这会扰乱你的投资心态，当有一天你为了追求“唐龙”的高收益率而不带任何防护措施走向角斗场时，那么“唐龙”的结局就会在不远的将来静静的等你走来。\n\
    \n# 二）独立思考\n\n投资永远远是个人的事情！\n\n房产投资在 1000 万人口的大城市，目前看还算安全。如果还是想搏一下小城市的巨大涨幅，务必要关注流动性问题。不要只想着涨时的快乐，而忘记市场冷冻后的风险。\n\
    \n一笑加一笑（微信号：150500211）邀请您加入水库交流群。群内文集每月一更新……\n\n再次提醒一下，虽说专业的人专业的事儿，但不管大帅们说什么，一定要管好自己的袋子！这是一条准则，就如开车遇见红灯要停一样。或许闯红灯大多数时候是安全的，但还是存在唐龙式悲剧的危险。（注3）\n\
    \n一笑加一笑， 2018年5月2日)\n\n［注1］：本文主体转自daivd自由之路。\n\n［注2］：唐龙的详细介绍：\nhttps://baike.baidu.com/item/%E5%94%90%E9%BE%99/2183102?fr=aladdin\n\
    \n［注3］：有群友被骗，已有断供风险。\n"
