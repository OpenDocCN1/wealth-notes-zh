    \ 年第 2 季度中国货币政策执行报告》。\n\n## 三十）结论\n\n### 最核心的差别：\n\n- A) 日本土地从家庭向机构与政府转移的过程中是买方价格形成的增长，家庭的收入增加。\n\
    \  中国土地是从国家垄断向机构与家庭转移的过程中是卖方价格形成的增长。\n\n- B) 日本是宽松的金融政策与零首付的土地抵押信贷，以增加流动性为主。泡沫之后是政府与银行的坏账，企业和个人实际支付的自有资金风险极低。\n\
    \  中国是双紧的金融政策与企业用自有资金支付土地全款后的开发信贷和二至三成首付基础建筑物封顶之后的个贷政策，企业和个人以自有资金支付为前提和基础，无资本市场的支持。\n\
    \n- C) 日本的股票市场与土地市场的融资互补，既可以发股票购买土地，也可以利用土地增发股票，两者之间的价格相互推动增长。\n  中国的股票市场与土地市场隔离，能利用资本市场融资的地产公司不到企业总数的\
    \ 1%，地产上市公司的市场占有率不到 15%，股票市场的上涨可能分流地产市场的资金。\n\n- D) 日本是所有类型的土地与房屋价格均发生价格巨变 (重点在东京和大阪)。中国只有部分城市的部分类型房屋价格增长，尤其是大量中低价位的房价变化不大，二三线城市的住房价格变化不大。\n\
    \  > 一笑加一笑注：目前二三线城市，价格也已经大幅上涨。\n\n- E) 日本房地产增长中并非以住宅的自主需求为主，其非住宅类型的建筑所占比重远远大于中国，其城市化比重早已超过70%，房价增长与城市人口增长几乎无关。\n\
    \  中国房地产需求增长中以住宅的自住需求为主，全国用于出租的住宅总量约为存量的2%，住宅建筑占总建筑面积中的比重占70%，目前的城市化率仅为42%，房价的增长与城市户数增加和城市人口增长引发的供求矛盾相关紧密。\n\
    \n  如果基本经济背景与前提有重大差别，日本是不能当镜子的。\n  > 一笑加一笑注：最后的数据，是以2007年为基准，库友们自行统计，目前中国的城市化率真为57%\
    \ 左右。\n\n## 三十一）写在最后\n\n房产投资永远担心两件事情：\n\n- 1) 还会涨吗？\n- 2) 经济危机了怎么办？\n\n以史鉴今，任何一件事件肯定是由许许多多微观事物组成，房地产泡沫也不例外。不能因为暴涨我们就断言这是泡沫，更不能因为暴跌就说泡沫没有了。\n\
    \n泡沫有多种。中国大地这 16 年来，有一种泡沫比金刚钻还硬，那就是：房价泡沫。事实面前，您就说它泡沫，不讲逻辑，不讲道理。嗯，6 号床还有空位。\n\n\
    大炮这种分析问题的方法是我特别欣赏的：排除舆论，实事求是。今日天朝之状况与 2010 年的各项政策相比，有过之而无不及。泡沫，吓唬人的把戏罢了！\n\n(一笑加一笑，本文主体任大炮写于\
    \ 2007 年 1 月)\n\n[注 1]：《The Famous First Bubbles》\nhttps://detail.tmall.com/item.htm?spm=a230r.1.14.1.2dc22893h3kYGz&id=44036883873&cm_id=140105335569ed55e27b&abbucket=15\n\
    \n## 日本房地产泡沫（二） #702\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_202_0.png)\n\n\
    日本房地产泡沫（二） #702\n\n上一篇文章写了日本地产崩盘时的一些情，及与我国情况的对比。那本篇则重点谈谈我们天朝的情况。有一个词语叫“国噎废食”，我们会因为存在亿万分之一被噎死的可能性，就不吃饭了？\n\
    \n我们谈谈在天朝应该对待“楼市泡沫”的态度是什么？\n\n### 一）楼市泡沫专家\n\n中国的媒体和专家喜欢用一些虚幻的词给老百姓听，每个人貌似懂了，亦貌似有点儿模糊，用“泡沫”这个词来形容中国的房地产，特别容易引起共鸣。2005\
    \ 年，共鸣；2006 年共鸣；……2016 年共鸣；2017 年共鸣；今年，也就是 2018 年还是共鸣……可以想象的未来 NNNNNNN 年，还是共鸣……\n\
    \n在天朝，那么多专家并不专心研究楼市：由简入深的研究，一一分解楼市细节。而是愿意宣传“楼市泡沫”，这些“泡沫”专家除了恐吓无知的百姓外，实则一无用处。\n\
    \n每次房价稍微有些波动，专家们张口必读一定要防止我国走日本房产崩盘的老路。就是在这种恐吓中，中国房产经过了金灿灿的楼市黄金十年（注 1），为了博取眼球，这些专家即使每年被打脸，也还是轮番上阵，媒体自然乐于推波助澜。他们全方位无死角的想证明中国的房地产已经出现了泡沫，恨不得明天就要破裂崩盘的泡沫。邪恶！邪恶！邪恶！\n\
    \n就不懂得讲理么？！最终倒霉的是愚蠢又可怜的百姓。\n\n天下没有免费的午餐，天朝百姓，因为教育的原因，总想天上掉馅饼的好事儿：打土豪，分田地。可等你打完后，你会发现，你仍然不会有田地。时至今日，很多人还是不习惯市场经济，不习惯价格调动生产资源。总想着房产大跌，泡沫破裂，人人想着：“房价要是腰斩，我也再买一套”，“房价如果跌\
    \ 90%，我再买一套”。不讲逻辑，不讲道理，不分青红皂白，不切实际地攻击房价。总是认为房价的任何上涨，就是有“泡沫”。\n\n愚钝的人们从来不讲理！就不能放弃偏见想一想，那个曾经\
    \ 5 分钱一个的东北大板儿，现在可是 4 RMB，并且奶油还少了一大半，你为啥就不说这有泡沫呢？！\n\n### 二）媒体\n\n> 中国有名古话叫：揣着明白装糊涂。有一群人渣败类，总是能找到人类内心深处那最贪婪和最恐惧的地方。这些最聪明的人，知道真相，但可以颠倒黑白。\n\
    \n下面是：1989 年人民日报新闻评论的一段话影射了这种泡沫论：\n\n> “北京最近提供两万多平方米的住房，每平米 1600—1900 元。若买两居室，少说也要六万元。一名大学生从参加工作起就日日节衣缩食，每月存款\
    \ 50 元已是极致，100 年才能买上两居室”（人民日报 1989 年 2 月 20 日第 2 版）。\n\n三十年日月轮回，每隔几年，总是有人篡改一下数字，更改一下日期，然后用同样的方法、同样的论调、同样的百年之说来影射楼市的泡沫。可结果是什么呢？当年那些\
    \ 100 年才能买上 2 居室的大学生，短短几年就买起了房。几十年过去了，凡是当年没有被恐吓住的大学生，都拥有了住房财富。而这个神奇的泡沫当年没破，今天上涨了几十倍也没破。\n\
    \n时到现在，人民日报，CCAV，经济半小时，各类媒体还是这种论调，是无知愚蠢，还是 evil？可怜被吓破胆的普通百姓，一声叹息。\n\n### 三）价格上涨的基础\n\
    \n观察“泡沫”，我们可以考虑一些微观现象：\n\n- 1）中国的经济高速增长是否停了？\n  答：虽然减缓了，但依然是世界上增速最快的国家之一。\n\n\
    - 2）家庭分裂速度是否加速？\n  答：现在这个时代，小年轻都想与父母分开，自己拥有住房。而老人的寿命呢？变的越来越长。\n\n- 3）城市化率是否结束？\n\
    \  答：以发达国家的经验而言，中国还有很大的空间。\n\n- 4）收入水平的促使消费欲望上升、要求提高？\n  答：一到周末，大商场各个饭店门前排队长龙，新式体验馆层出不穷。\n\
    \n- 5）改善型需求是否增长？\n  答：以一线城市老破小之多，只要条件允许，改善性住房的需要就会井喷。强大购房基础。\n\n- 6）土地供给是市场化还是垄断供给？\n\
    \  答：依然是ZF垄断式供给，并且依然控制容积率。\n\n- 7）土地供给数量的严重短缺？\n  答：短缺。\n\n- 8）拍卖土地方式显现的价格影响；\n\
    \  答：虽然有限价。无利不起早，商人更聪明，吃一次亏，认了。会使明天的供应大幅减少。\n\n- 9）投资渠道的是否管制？\n  答：汇率管制，不说了。不管制，没有泡沫的有：股市，P2P，比特币。不过都崩了！除了房产还有什么呢？没崩的反而有泡沫？朋友，明明是价值被低估。醒醒，醒醒！\n\
    \n- 10）通胀预期的影响……\n  答：纸币甚至未来数字货币时代，想想财政饭的大锅，不言而喻。\n\n中国与日本最大的区别是：中国的管制之多，信贷杠杆是非常之低的。而中国的实体经济增长又是很快。\n\
    \n中国房产首付比例之高，是任何发生过泡沫国家和地区所不能比拟的。股市也在防火墙政策下，并没有给房地产提供巨额融资。\n\n房价虽然会有波动的，但其整体趋势则一定是上升的，每次上升时都用日本的泡沫来吓唬自己。那是对事实缺乏更改的分析。\n\
    \n### 四）日本与中国现状的对比\n\n| 序号 | 项目 | 日本1998—1999年 | 中国目前 |\n| :--- | :--- | :---\
    \ | :--- |\n| 1 | 国土 | 37.8万平方公里 | 960万平方公里 |\n| 2 | 人口（约） | 12112万人 | 133474万人\
    \ |\n| 3 | GDP总量 | 约48万亿人民币 | 33538.92亿人民币 |\n| 4 | 人均GDP | 约5.4万美元 | 4100美元 |\n\
    | 5 | 城市化率 | 70%以上的稳定期 | 45%的高速长期 |\n| 6 | 十年增长 averaged | GDP的5.0%（1991年为34.0%）\
    \ | GDP的3.0% |\n| 7 | 房价 | 0.7亿 | 7亿 |\n| 8 | 政府 | 不贴底、金融资本派 | 信贷较紧、财货资本较紧 |\n\
    | 9 | 货币 | 金融软化、不动产占据融资 | 货币量较大、但开发类信贷管理严格 |\n| 10 | 土地 | 私有开市场化 | 垄断、短缺、政策直接推动上涨\
    \ |\n| 11 | +税制 | 资本化、抵押信贷增加 | 投资内涵改变好，可以长期获取 |\n| 12 | 需求 | 股市与土地增值带动 | 房住、消费、人口等原因住性消费为主\
    \ |\n| 13 | 动机 | 投机为主导、豪打社率 | 政策与信贷刺激投资、首付提高 |\n| 14 | 土地结构 | 政府与企业为主的购买行为 | 政策金融的先进后推\
    \ |\n| 15 | 税收 | 政府支出+地、提高了储蓄与使用关系 | 购买土地带有，有对住房保 |\n| 16 | 汇率 | 高速上升周期 | 宽紧、谨、稳定\
    \ |\n| 17 | 资本 | 净流出 | 国际资本流入 |\n| 18 | 利率 | 利率下降通道、低利率 | 利率年可低向上升通道 |\n| 19 |\
    \ 市场 | 持续下来 | 严重供不足 |\n\n注：数据来自于大炮 2007 年，但时至今日，除具体数字外，其它情况基本相同。\n\n### 五）中国房价上涨细节\n\
    \n- a) 实体经济扎实增长\n- b) 金融杠杆不大\n- c) 居民收入在增长\n- d) 巨大的需求支撑\n  注：居住条件并不好。\n- e) 货币增发\n\
    \n中国房价主要矛盾是供不应求，目前在居住条件下，有强烈的改善需求。衣食住行，亘古不变，这是人类从古至今的基本需求！未来需求还会成倍增长。中国房地产没有泡沫。\n\
    \n### 六） 降房价\n\n既然已经知道了主要矛盾，根本不需要以任何名义（包括投机）来执行价格管制：限购，摇号，限贷，限售……。也是可以做到即使在通胀大背景下，也可以让涨幅大幅减小。\n\
    \n> 库友们，大道至简，紧盯降真实房价的方法：\n> 1) 增加土地的供给。扩大房屋的供给，放开容积率。\n> 2) 停止印钞。\n> 3) 减少需求。这是一条谬论：需求可以延迟，不可以被消灭。亦如憋尿一会儿没有问题，憋住\
    \ 24 小时要出大问题。\n\n如果价格上涨是务实的，那价格管制必然是徒劳的。否则全世界价格问题，都可以通过一纸政策解决。\n\n价格管制只会导致供给量的下降，供需矛盾更激化，更无法从根本上解决满足住房改善的需求。如果长远目标是解决城市化和扩大住房面积，那么只有一条路就是加大供给。\n\
    \n一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……\n\n### 七）日本房产泡沫的迷局\n\n我个人认为日本泡沫的主要原因是：\n\
    \n- 1）土地供应不受限制：1989 年日本修改了土地法，大量私人的土地可以涌入市场。建造高层住宅。供应没有卡死。\n- 2）杠杆用的太高。\n\n  注：前\
    \ 2 点在香港和芝加哥房地产崩盘时，都有这种现象。\n\n- 3）货币超发。这一点是存疑虑的，日本实际上也超发货币的。但并迄今 30 年，仍然没有走出来。\n\
    - 4）城市化基本完成。\n- 5）利率，汇率。对于国内而言，汇率不是问题，毕竟日本的樱桃非常贵的。利率呢？日本利率很便宜。所以这 2 点作用不大。\n\n\
    ### 八）结束语\n\n库友们最关心的是，中国房地产到底有没有泡沫？会不会在自己手里破？管制必然导致虚高，解除管制，全部市场化。必然会快速进入红海。然而，目前体制下，谁愿意为之前的错误买单呢？\n\
    \n还是上面的结论，库友们，大道至简，紧盯降真实房价的方法：\n\n1）增加土地的供给。扩大房屋的供给，放开容积率。\n2）停止印钞。\n\n（一笑加一笑，\
    \ 2018 年 9 月 6 日）\n\n[注 1]：见 欧神文集《楼市黄金十年》系列。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_210_0.png)\n\
