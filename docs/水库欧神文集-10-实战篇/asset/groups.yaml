    外面不常见的文章大概几十篇，我第一次看时，曾落泪良久！


    欧神在 2003 年，就根据经济学理论写出了《我们是怎么陷入贫穷》的原因，推断出未来 10 几年的房价物价上涨情况。在上海莘庄房价仅 2000 元时，已经判断出
    20 000 才是合理估价！


