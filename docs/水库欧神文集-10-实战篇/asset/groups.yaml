    \n### 赚钱的紧箍咒 #20\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_296_0.png)\n\n注：只为申请原创。重发一次。再次提醒，本公众号只讲普通百姓赚钱逻辑的理论。高手勿进，不敢误您的宝贵时间。\n\
    \n俗话说：人无横财不富，马无夜草不肥。\n\n本不想这么啰嗦，但怕有的朋友走火入魔，误入歧途。赚钱这事儿，说容易也容易，说难也难。思维上还是要上纲上线。今天就讲讲在理论上赚钱的紧箍咒。\n\
    \n- 一）赚钱的基本原则。\n    凡是容易进入的，门槛低的，难赚钱。比如股票，几千块钱就可以玩，赚大钱者廖廖；做保洁，保安，不需要太高的文化，但基本一眼忘穿：码农？不评论，被很多大神瞧不起的群体，前途光明……哈哈！\n\
    \n- 二）普通百姓赚钱的紧箍咒。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_296_1.png)\n\n \
    \   - a） 赚权力、关系的钱。不是官二代，不是富二代，下辈子吧，过。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_297_0.png)\n\
    \n    - b) 赚资源（如牌照）的钱。不是官二代，不是富二代，过。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_297_1.png)\n\
    \n    - c) 赚投机（如股票，期货，权证）的钱。没有内幕，过。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_297_2.png)\n\
    \n    有内幕的美女基金经理都被暴大亏！您还是绕道而行吧。\n\n    - d) 赚工资（体力+脑力）的钱。衣食无忧，全世界的人都都知道的方法，没必要讨论，\
    \ 过。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_297_3.png)\n\n    - e) 赚开公司的钱。10\
    \ 个创业公司 9 个赔，10%的赢率，您问问初中生，10%赢率高不？过。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_297_4.png)\n\
    \n    - f) 赚小店钱。退一步，开个人小超市呢。无差别人类劳动。过。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_297_5.png)\n\
    \n    - g） 赚有钱人的钱。咦？咦？咦？有钱人需要什么服务？相亲婚庆公司，月嫂钟点工屎布奶粉。咦！有道理。\n\n    - h) 赚“聪明”的钱。早教，英文钢琴芭蕾各种班，私立国际公办民校，出国培训课程。咦！有道理。\n\
    \n    - i) 赚“休闲健康”的钱。旅游，健身，桑拿，降三脂，壮阳。一定要正规的，知道伐！！！咦！有道理。\n\n    - j) 赚“搞不定”的钱，也就是赚麻烦的钱。马桶漏水，专家门诊，爹娘病床……，有道理，有道理。\n\
    \n    - k) 赚“发财投资”的钱。证券，房产，保险，等等。这个适合笔者，熟！不容易，但有技巧，后面细讲。\n\n    总结一句话，小孩子要聪明，老人要健康，女人要白瘦，男人要吃喝玩乐加时间长。\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_298_0.png)\n\n本公众号前半部分只讲理论，目标只有一个：在理论上找出赚钱的品种。简称赚钱圈，亦可称为赚钱紧箍咒。而后半部分只讲一个事情，怎么持久的稳定的赚钱，怎么形成自己的投资体系，啥？投资还需要体系？Bingo！没有投资体系的人就如车辆只有加油档，而没有刹车档，后果是不言自明。又如一个常在赌场混的赌徒，亏光钱是早晚的事情。\n\
    \n孙司空给唐僧画了个圈，只要师父不作天作地而跑出圈外，妖魔鬼怪也无可奈何。只见唐僧肉，无法下嘴吃！\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_299_0.png)\n\
    \n投资这事儿最怕不遵守规则，中国史上最牛的 10 大操盘手，只有花荣他老人家（不比我大几岁）还在，其它的不是死于不聪明，也不是死于技巧不高，而是死于忘记了纪律。\n\
    \n最近最流行的一句话是：楼市不一样。嗯，凡是不敬畏市场的人，也不适合看本人的公众号，出门左走金融街。敬畏市场，永远！\n\n我们只在赚多或赚少的圈里玩，不在赚钱或亏钱的圈里玩。是的，差别貌似很小，但我们赚钱的概率已经是\
    \ 100%，赚大钱的概率呢？看运气，时间长短而已，早晚会中。\n\n换句话说，我们只做那种做成了必定赚钱的事情，千难万难，我们也要做；不做那种做成了还不确定是否赚钱的事情，再容易也要绕道而行。\n\
    \n最后，告诉大家一个不幸的消息，笔者目前只对 k) 项略微熟悉，所以后面一切赚钱技巧都将围绕老 k) 进行展开。如果有朋友对其它几项赚钱业务或者可以补充赚钱业务，欢迎来稿。\n\
    \n对老 k) 项不感兴趣的朋友，对不住，你可以另觅高明了。\n\n![](img/998d37a9a4955949ecbc2ff65f9f659f_299_1.png)\n\
    \n赚钱的投资，源于正确的投资理念，赚钱方法才刚刚开始……\n\n(一笑加一笑，  2018 年 1 月 10 日夜)\n\n# 赚钱的体系（新） #30\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_300_0.png)\n\n写在前面：老婆大人说上一篇文章错别字太多。老婆大人在上，改后重发。知错就改还是好孩子，对伐！\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_300_1.png)\n\n有道是：常在河边走，哪能不湿鞋。\n\n\
    赚钱需要体系？很多朋友以为这是故弄玄虚。他们希望快快快，立刻、马上、现在就赚钱。实际上赚钱之道，就像一个武林高手，仅会各种招式是远远不够的，内功心法更为重要。连理论都没有耐心学习的朋友，我不认为你适合投资，毛手毛脚在投资中是第一大忌。\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_301_0.png)\n\n## 一）确定性\n\n赚钱的品种的选择决定了你可以赚钱，参见上文《赚钱的紧箍咒\
    \ #20》，此乃定性分析。投资路上，要在确定性极大的情况下，敢于全力一博，下大注。人生第一桶金，往往来自日积月累学习后，一击必中的那次。赚大钱永远是抓住那几次稀有的机会。在所有赚大钱的技巧中，确定性+下大注，名列第一。\n\
    \n## 二）守拙\n\n如何才能赚很多很多的钱？要持续的赚钱，积少成多。如何持续的赚钱？赚钱的事情持续做。见过太多的朋友在投资品种上选对了，但总是会“溜号”：赚点钱就收手的有之，赚点儿去投资亏损品种的更有之。在赚钱品种上的守拙，是赚钱的基本品质！\n\
    \n![](img/998d37a9a4955949ecbc2ff65f9f659f_301_1.png)\n\n有的朋友说，我守拙的品种，一直亏了10年。\n\
    \n为什么这么多朋友不能守拙？真正在市场上操作的朋友知道，市场就是人心。凡没有守拙的朋友，都是对自己投资的品种不了解，也不确信，换句话说理论不过关。\n\n\
    后面几篇文章很快会讲几个基本赚钱品种的理论，诸位稍安勿躁。\n\n## 三）定量计算\n\n如果一项投资不能定量的计算出大概时间的盈亏概率和幅度，这笔投资注定是感情用事的。\n\
    \n举个貌似欢乐的例子，假设投入100万，3年后极大概率将得到118万，极小概率只收回本金（这种再算是初级过关的投资者，普通大众往往会认为这是一笔保本的投资）。请问：这是一笔赚钱的投资吗？\n\
    \n很多朋友投入100万，即说不清可能赚多少钱？也说不清可能亏多少钱？更说不清多久可以终止投资？\n\n## 四）方向\n\n方向比努力重要！顺风顺水的赚钱固然开心，但如果某一天，开始亏钱了，怎么办？投资路上我们应时刻谨记：如果方向错了，停下来也是一种进步！\n\
    \n方向来源于客观。我D的“实事求是，实践是检验真理的唯一论理”，宣传了这么多年，很多朋友在投资中还是学不会。无论理论多么完美，也要尊重事实。\n\n就如2017年的上海楼市，大部分区域成交价明明下跌了10%，不承认，也于事无补！诚记是必须的，必须做的是马上检查之前上涨的所有条件是否改变了？\n\
    \n## 五）时间的玫瑰\n\n投资亏赚永远是在下注的那一刻决定，后面唯一可做的就是等待，持续的等待。投资是个长期的事情，时间是最最重要的变量之一。到了投资了断的时刻，如果之前的判断是合乎逻辑的，我们种下的是时间的玫瑰，反之酝酿的是时间的毒酒。\n\
    \n## 六）墨菲定律\n\n墨菲定律是一个朋友介绍给我的，我感觉非常有意思。主要讲的是下面四个观点：\n\n- 一、任何事都没有表面看起来那么简单；\n\
    - 二、所有的事都会比你预计的时间长；\n- 三、会出错的事总会出错；\n- 四、如果你担心某种情况发生，那么它就更有可能发生。\n\n赚钱一岗，也是逃不过这一定律。越害怕什么发生，必定会在某个时刻发生。\n\
    \n没有亏过钱的朋友直接下大下注，是投资大忌。投资过程中，哪怕有明师指点，学费也无可避免，只是尽可能不要伤及筋骨。\n\n总结一下，一个好的投资体系：\n\n\
    - 1) 找到好品种。这个决定了我们能不能赚钱；\n- 2) 守拙。保证我们安全持久的赚钱；\n- 3) 定量分析。永远可以计算出可能亏赚多少钱；\n- 4)\
    \ 认错机制。失误后将采取的补救方法。\n\n当然，首先你需要是一个讲纪律的人，否则何等名师，也雕琢不出一块朽木。\n\n很多朋友说，笑哥，您教我建立一个投资体系呗。噗，一口老血吐在屏幕上。投资是非常非常个人的事：每个人的秉性不同，风险偏好不同，承受能力不同，体系自然不同。但有一点是相同的：没有赚钱体系的人，在投资市场上活不长久。一个风浪来临，就有可能会陷入万劫不复的境地。\n\
    \n说个有趣的事儿，一个好的赚钱体系，在某个时段会非常稳定的亏钱。师傅领进门，修行在个人。有道是：磨刀不误砍柴工。想稳定长久的赚钱，先慢慢建立自己的赚钱体系！\n\
    \n下篇开始讲笔者熟悉的赚钱好品种……\n\n(一笑加一笑， 2018 年 1 月 16 日夜)\n\n熟悉我的朋友都知道，我关心的话题只有一个：一切与普通百姓赚钱有关的事儿~\n\
