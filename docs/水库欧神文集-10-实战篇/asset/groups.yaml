    | 花旗 | 按卡 | 无法修改 | 本期账单 | 50天 | 8自然日 |

    | 中信 | 按卡 | 半年一次 | 本期账单 | 60天 | 8自然日 |

    | 广发 | 按卡 | 800年费以上白金卡可修改 | 具体看入账时间 | 50天 | 8自然日-需申请 |

    | 邮储 | 按卡 | 一个自然年一次 | 本期账单 | 50天 | 第4自然日17点前 |

    | 光大 | 按卡 | 两个月一次 | 本期账单 | 50天 | 8自然日-需申请 |


    我们首先保证不同组的额度基本一致，然后根据这张表，优先安排不能调整账单的银行，再根据剩下的信用卡进行微调。


    ## 五）空当接龙的风险


    第一个风险就是额度降了怎么办？正常情况下不会发生，但如果想以此为长期融资手段，就需要知道刷卡姿势。这是另一个话题，此处不讲。（注1）


    第二个风险，法律上的风险。利用POS机，进行套现相关的行为，是违法行为，具体条款如下：


    ### (一)《关于妨害信用卡管理刑事案件具体应用法律若干问题的解释》


    第七条：违反国家规定，使用销售点终端机具(POS机)等方法，以虚构交易、虚开价格、现金退货等方式向信用卡持卡人直接支付现金，情节严重的，应当依据刑法第二百二十五条的规定，以非法经营罪定罪处罚。


    > 实施前款行为，数额在100万元以上的，或者造成金融机构资金20万元以上逾期未还的，或者造成金融机构经济损失10万元以上的，应当认定为刑法第二百二十五条规定的“情节严重”；数额在500万元以上的，或者造成金融机构资金100万元以上逾期未还的，或者造成金融机构经济损失50万元以上的，应当认定为刑法第二百二十五条规定的“情节特别严重”。


    持卡人以非法占有为目的，采用上述方式恶意透支，应当追究刑事责任的，依照刑法第一百九十六条的规定，以信用卡诈骗罪定罪处罚。


    从条款上看，分为两部分：


    1) 针对使用终端机具，给他人套现的，情节严重，属于非法经营罪。


    这一条，也是我们经常在新闻上看到的，由于套现被处罚的情况。不过大家可以仔细看，新闻中被处罚的人，他的数额是多少？你就会发现，都是上亿！！！！什么人才会套现上亿呢？答案就是：专门以此为生，以营利为目的，收取高额的手续费（一般1%~2%），帮助持卡人套现的人。


    同时，鉴别交易量的途径，主要是通过银联查询商户的交易量来确定。因此早期的玩家，会将购买的单商户 POS 机刷够 100W 时，就更换一个商户，来规避此条规则。随着
    POS 机平台的发展，出现了一机多商户的机具，非常容易规避这一条。


    所以聪明的玩家都不以盈利为目的为他人TX。


    2) 针对持卡人，**以非法占有为目的，恶意透支的**，以信用卡诈骗罪处罚。


    自己套现并且恶意透支的，也属于违法行为。老话说，欠债还钱，天经地义。所以一定要及时还款。你好，我好，大家好。


    字面上如此严厉，为什么 TX 的人还那么多呢？结论就是：这是一个多赢的游戏。


    对于银行来说，有钱赚。只要没有逾期，出现坏账，银行没有任何动力自断手脚。


    当然，每个银行的行事风格也都有所不同，交行、浦发都是属于风控比较严的银行。交行也因为风控，丧失了一大批的用户。


    对支付公司来说，有钱赚。所有才有惊为天人的一机多商户 P 机杰作。还有稳定不跳码的。嚓！


    对个人用户来说，有钱赚。薅羊毛不说，个人融资的渠道非常窄，这种灵活的廉价资金极为稀缺！！！


    参与各方都受益。所以呢，面上过得去就行了。见着红灯绕路走就是这个理儿。


    ## 六）空当接龙实例


    贴上一个简单的空当接龙实例：


