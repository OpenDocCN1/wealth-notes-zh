    ## 五) PV (现在值)


    ### a) PV 定义


    PV 是 Present Value 的缩写，这里我们可以称之为金钱的现在值。现值是现在和将来的一笔支付或支付流在今天的价值。这个值刚好与 FV 未来值相反方向。


    ### b) PV 函数


    PV (rate, nper, pmt, fv, type)


    - Rate: 各期利率

    - Nper: 付款期总数

    - Pmt: 各期应付的金额 (或可得到的金额)

    - Fv: 终值, 缺省为 0

    - Type: 各期付款时间是在期初, 还是期末 (1 为期初; 0 为期末)。


    注: pmt 简称年金, 后面会单独讲与年金相关的知识。


    ### c) 示例


    假如某人今天向你借 100 块，一借 10 年，答应到期还你 600 元。假设央行还是如上例一样每年印 15% 钞票，你借出这笔钱是否划算？


    注：假设没有信用违约等其它风险，不考虑机会成本。


    PV（15%，10，0，-600，0）= 148.31。相当于借款人在今天多付了（148-100）/100 = 48.1%，这笔借款非常划算。


    当然，如果其它条件不变，答应到期还你 300 元，则：


    未来的 300 元，相当于现在的 PV（15%，10，0，-300，0）= 74.16 元。


    显然借出这笔钱是非常亏的，亏了 1-(74.16/100) = 25.85%。


    现实中的投资，Pmt 参数往往不为 0，朋友自行度娘！


    ## 六）结束语


    未来的钱，现在的钱。投资前一定要区分的清清楚楚。看似赚钱的很多项目，仔细一算，可能是亏的！


