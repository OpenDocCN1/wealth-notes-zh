    ## 二）多军干货（非免费）


    ### 1）流水。


    很多库友对流水问题，总是理解的不透彻。2000字左右，纯干货，经常性更新以符合最新要求。


    获取方式：下面的微店。


    ### 2）企业经营范围。


    目前消费贷已经成为鸡肋，企业经营贷成为主流。凡事要趁早，多军要早早筹备。注册新公司，名称有什么讲究？企业经营范围是什么？


    获取方式：下面的微店。


    ### 3）房屋代持（合伙购房）协议，及咨询。


    很多朋友对房产代持和合伙购房的细节，总是了解的不系统，这里有一个实战模板。也可以语音咨询，时间一般为：1个小时。


    获取方式：下面的微店。


    ### 4) 《下一站，重庆》（下）隐版


    如果对重庆投资感兴趣的朋友，一定要看一下《下一站·重庆（下）》的完整版（含隐匿版）。很多朋友不知道当年欧老师投资重庆的逻辑是什么？仅仅1年半时间，回过头来看，恍若隔世。


    获取方式：下面的微店。


    ### 5) 欧神 vs 杨红旭演讲。


    每年的4月18日，欧神都会对楼市做一个预测，过去16年连续预测正确。这是胡猜呢，还是背后有其必然的逻辑？


    今年的4月18日，欧神与另一房产大V杨红旭同桌共谈楼市。这里有清晰的语音。


    获取方式：下面的微店。


    ### 6) 欧神文集电子版 PDF。


    欧神电子文集（公众号创立~至今），会经常性更新。


    注：下面的微店内获取。


    ### 7) 水库论坛邀请码。


    水库论坛采取邀请制，注册必须有邀请码。


    获取方式：下面的微店。


    ### 8) 多军离婚协议书。


    多军离婚，你懂的。但初次操作的朋友，还是要把握好技巧和细节的（含 54 大法）。2000 字左右。


    获取方式：下面的微店。


    ### 7) 学历。


    学历就是敲门砖。就业也好，落户积分也罢，必不可少。提供一个好的学历提升到大学的渠道（哪怕你现在是中学学历也可以），门槛低，不占用你工作的时间。


    详情联系微信：coco200306，验证语：学历提升。


