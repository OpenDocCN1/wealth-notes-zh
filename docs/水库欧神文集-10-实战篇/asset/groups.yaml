    # 信用卡申请十二张顺序（额度篇）#102


    前言：此篇文章讲述以额度为目标的信用卡申请顺序，感谢水库信用卡高手 leakege16。此篇文章是欧神小密圈 10 篇精华文章之一！


    俗话说：兵马未动，粮草先生。信用卡是多军必备之粮仓。利率低、随借随还、永续。很多朋友经常问办理信用卡的顺序是什么？


    ## 一）序言

    '
  mdcn: '

    我们先来说说信用卡的账单日。


    如果我们有一张卡是 1 号账单日，最长免息期 50 天。如下图：


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_68_0.png)


    这样就会有最长 50 天的免息期（2 月 22 日-3 月 20 日）。


    但是如果刷卡时间选的不好，就会只能享受到最短的免息期 20 天。如下图：


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_68_1.png)


    这样就只有 20 天的免息期（1 月 31 日-2 月 20 日）。


    这个就是信用卡空档接龙的基础，即信用卡有免息期。


    所谓的空档接龙，就是把这么短的免息期，想办法变成长期借贷。也就是所谓的短债长用。是不是很多耳熟？银行不就是拿取了储户的活期或者几个月的短期存款，给大家放 30
    年的按揭贷款的吗？


    ## 三）空档接龙的原则


    如果你急需 3 万元现金，但手头上并没有现金。而此时你有 3 张信用卡，每张卡的额度为 3 万，并且每张卡的账单日刚好相差 10 天（A 账单日：每月 1
    日；B 卡账单日：每月 11 日，C 卡账单日：每月 21 日）。


    怎么可以利用这 3 张信用卡，完成一个完美的接龙呢？为方便描述，假设信用卡的钱可以无损刷出来。如下图：


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_69_0.png)


    ### 第一轮：


    在 A 卡账单日后的第 2 天，即 2 号，A 卡刷出来 3 万，你拿去应急；


    在 B 卡账单日后的第 2 天，即 12 号，B 刷出来 3 万，还了 A 卡的 3 万；


    在 C 卡账单日后的第 2 天，即 22 号，C 刷出来 3 万，还了 B 卡的 3 万；


    以此类推，


    **第二轮：**


    在 A 卡账单日后的第 2 天，即 2 号，A 卡刷出来 3 万，还了 C 卡的 3 万；


    在 B 卡账单日后的第 2 天，即 12 号，B 刷出来 3 万，还了 A 卡的 3 万；


    在 C 卡账单日后的第 2 天，即 22 号，C 刷出来 3 万，还了 B 卡的 3 万；


    ......


    **第 N 轮：**


    ......


    细心的朋友们有没有发现，**第一笔刷的 3 万，被使用后，不用还了！**只要你一直这样操作的话。


    在实际的操作肯定没有这么理想：1) 账单日刚好相差 10 天；2) 每批卡的额度刚好相等。


    我们会遇到一些小麻烦，下面就说下会遇到的问题。


    ## 四）空档接龙的困难


    首先，卡的额度，不会是完全一样的。比如我们有10张信用卡，每张的额度如下：


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_71_0.png)


    如果我们按照平均额度来刷卡，即上图的绿线，那小额度的卡的额度是还不上额度高的卡的账单的。那如果想能循环使用，就必须按照最低额度1W（粉线）来刷卡，那大部分卡的额度都被浪费了。


