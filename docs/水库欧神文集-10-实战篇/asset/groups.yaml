    ### 四）银行的赚钱伎俩


    对于很多投资，特别是房产投资，必备的一个环节就是向银行融资（借钱）。 借钱时一定要警惕不要偷鸡不成反蚀把米！


    #### 1）砍头息


    砍头息指的是放款者借钱给借款者时，先从本金里面扣除一部分钱，但利息是按全款计算的。


    银行内部高手如云，为吸引借款者，会故意设计一些让百姓感觉便宜，但实则非常贵的品种，砍头息比较常见。


