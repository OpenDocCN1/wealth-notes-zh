    赚了不少钱啊，疯子，一般人学不来，心脏受不了！


    # 三）股市赚钱的品种


    > 凡是说低风险低收益，高风险高收益的，都是投资菜鸟。投资追求的永远是低风险，高收益。


    ---- 一笑加一笑


    通过上面对股市投资品种的基本分析，对普通百姓而言，“三道道”的品种并不多。


    在前一篇文章《赚钱的紧箍咒 #20》中，我们明确了我们的投资准则：只在赚钱的品种上投资，再次提醒一下，务必戴牢这个“紧箍咒”！投资不是只讲某一


