    \n常年跟着一笑的库友都知道，我给大家介绍的知识都是成体系的。\n\n### 二）工行大放水\n\n工商银行号称 “宇宙行”，当然也被戏称 “大妈行”。没有一张大妈卡，信用卡是不敢称为入门的。时至今日，这种好卡，想办下来，那是不容易的。“大妈”们可都是火眼金睛，想办下来大额工行信用卡，那是千难万难的。\n\
    \n但大妈行有一个好处，每年都会发一次超级大神经。总有那么几天，部分朋友可以在工行 APP 上从 5K 提额到 10 万至 30 万不等。当然有的朋友（如我），总是不被选中，一直感受不到皇恩浩荡。\n\
