    # 谈谈钱的还款方式 #44


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_58_0.png)


    ----本文是普及小知识


    群友办贷款的时候经常会遇到各种各样的贷款产品：房贷、抵押贷、信用贷、信用卡等等。在产品介绍时，又有不同的说法：等额本金、等额本息、等本等息、手续费，甚是眼花缭乱。


    一款贷款产品的真实利率到底是多少呢？欧老师以神来之笔，多年前就告诉我们：有些利率*2 才是真实利率。对于很多新朋友来说，理解的并不透彻，今天我就来谈谈各种还款方式。


    ## 一） 等额本金与等额本息


    等额本金和等额本息，是我们做房贷时经常遇到的还款方式，下面我们就来简单讲一下。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_59_0.png)


    从图上可以看到，等额本金的还款曲线，是一条递减的直线。而等额本息，是一条为固定值的直线，等额本金一开始要偿还的金额多，但是要付出的总的利息较少。


    等额本息一开始要偿还的金额少，但是要付出的总的利息较多。在欧老师的文章中（注 1），已经详细的解释过了在何种情况，等额本息都是最优的选择。


    至于有些朋友会说，等额本金偿还的利息更少啊，为什么不选等额本金呢？其实可以从另一个角度来解释这个问题：等额本息一开始偿还的金额少，那就相当于等额本金相比等额本息，在每个月都会做一次提前还款（还款金额=等额本金月还款额-等额本息月还款额），所以等额本金节省的利息，其实是由于提前还款造成的。


    同时，这两种还款方式的真实利率，也就是贷款的利率。


    ## 二) 先息后本


    先息后本的还款方式，是在信用贷中常见的还款方式。一般一年以下的信用贷经常采用这种还款方式。这种还款方式的还款曲线很简单，也是一条直线，但是在最后一期需要将本息同时归还，会存在比较大的针刺效应。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_60_0.png)


    当然解决方式也比较简单，只需要找个朋友，或者使用暂时闲置的资金，临时过桥一下，即可。


    ## 三) 信用卡分期


    信用卡分期是大家经常容易混淆利率的还款方式，当然有些朋友会说，直接*2即可，那为什么要*2，我们今天就来简单的说下。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_60_1.png)


    > 一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……


    首先我们来看下还款曲线，初看他的还款曲线跟等额本息的很相似，每期平均偿还本金以及分期的手续费，但是为什么有的人说需要*2 呢？


    我们首先普及一个概念，年化利率是怎么计算的？很多人可能会脱口而出：就是借你一年的钱，然后对应的付你一年的利息，就是年化利率呗，如果是就借了一个月，就对应的*12。那我们重新按照这个概念来画一个图：


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_61_0.png)


    秘密：我们可以看下最后一期。将信用卡分期跟房贷的等额本息放在一期，看出区别了吗？等额本息还款的利息是递减的，而分期的利息并不会减少，这里就引出了本文最重要的一个概念：利随本清。


    那利随本清是什么意思呢？其实就是说，按照剩余的本金，来计算当期的利息。


    在房贷的等额本金还款方式中，当前一期的本金归还之后，后一期的利息，是按照剩余的本金来计算的。


    在信用卡分期中，利息是按照全部借款金额来计算每期的手续费，但是我们的本金都在一直归还。如果我们分 12 期，那最后一期只使用了 1/12 的本金，但是还要按照全额的本金来计算手续费。


    简单的折算下，由于每期归还等额的本金，相当于我们只全额使用了一半的本金，那利息当然要*2 了，这就是*2 说法的由来。所以他的本质，并不是在一直归还本金，而是他没有利随本清。


    这也是为什么同样是相同金额归还本息，房贷得真实利率就不需要*2 的原因。


    当然，*2 只是个简单的折算，下面我们就讲下其中的两个小点：


    1. **免息期**


    由于信用卡分期也是采用信用卡的还款方式，那分期也是存在免息期的。所以如果我们分 3 期，实际我们的资金利用率大概在 4 个月左右，这样相当于无形中降低了利率。同理，我们分
    12 期，实际的使用时间大概在 13 个月，从这里可以看出，当然是分的越短越好。


    2. **截断**


    截断也是信用卡分期中常用的小技巧，截断的意思是说，我们分 12 期，但是在其中的某一期 的时候，我们向银行提出提前归还所有的本金，那会发生什么呢？


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_63_0.png)


    如果我们能在归还完第一期之后，立即申请归还所有的分期金额，如果能不付任何违约金的话，那分期手续费*12，即为真实利率，因为我们使用了一个月的本金，也付了一个月的本金相应的利息。所以，截断越早越好。


    当然，上面说的这只是理论。在实际中，能不付任何手续费就能提前归还的银行很少，甚至有些银行是要在第一期收取所有的手续费的，这种叫做“砍头息”。这种就需要根据实际情况来计算真实的利率。


    3. **其他类型的还款方式**


    其他还有各种各样的还款方式，比如，每个月归还 1%本金的，这里就不在赘述。


    ## 四） 结论


    宣传品上的利率到底是不是真实的利率？其实本质就四个字：利随本清。所有利随本清的，就是真实利率。


    那我们怎么能知道到底是不是利随本清呢？最可靠的方法，就是让贷款经理提供每一期的还款计划表，仔细的算下，利息是多少，本金是多少。


    具体怎么算，可以参照我的另一篇文章：《内部收益率 IRR #41》。


    （一笑加一笑，2018 年 4 月 11 日 深夜）


