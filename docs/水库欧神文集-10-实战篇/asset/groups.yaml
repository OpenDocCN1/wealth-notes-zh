    # 赚钱的逻辑（股市篇） #11


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_141_0.png)


    赚钱的逻辑（股市篇） #11


    ——给在股市中屡败屡战的朋友


    股市为什么总是亏钱？


    投一枚硬币，一共投 10,000 次，猜一下正反面对次数各是多少？5000:5000（不会差太多）。朋友您要是真无聊，可以陪孩子试验一下。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……


    股市中购买股票后，要么涨要么跌，不应该也是 50%:50% 吗？怎么会有股市定律：7输2平1负？


    股市中赚钱与否，在这一个问题上的认识是一道华丽丽的分割线。


    ## 一）油水


    中国的股民普遍是瞧不起赌民，道德上他们被舆论经常性赞扬。股市中传统分析手段不说，24 节气大法据说也有一大批拥趸。据说股民普遍认为股市的发动机是企业分红，您睃过上市公司年报吗？智商呀智商！


    小例子一：


    张三手里 1 万元，李四手里 1 万元。2 人随便找个地方打牌。最终：张三手里的钱 + 李四手里的钱是否 = 2 万元？


    小例子二：


    张三手里 1 万元，李四手里 1 万元。到隔壁的老王家打牌，老王每局抽红 10 元。最终：张三手里的钱 + 李四手里的钱是否 = 2 万元？


    股市中有一大批从事隔壁老王的机构：像佣金印花税不说。那庞大的 JZH，基金公司，股票发行机构……当然还要狠坐庄的，他可以抽老千，知名不具。


    他们是靠谁养活呢？你猜。


    大道至简，聪明的朋友肯定知道答案了：原来是隔壁老王导致 7 输 2 平 1 负的。


    ## 三) 胜率


    既然隔壁老王已然导致了 7 输 2 平 1 负的股市定律，股市中这盈者的 10% 中。普通百姓的胜率是多少呢？


    - 出老千机构：50%。（知名不具，自己猜）

    - 基金机构：30%。

    - 民间高手：10%。

    - 普通百姓：10%。


    通过内幕消息操作的还暂且不说。


    普通百姓在股市中赢利的概率是：10% * 10% = 1%。


    在各行各业，如果您能做到前 1%，即使是收破烂，都是个破烂王。如果在公司的话，至少是个老总级别的。


    所以绝大多数普通百姓可以做的是：见下图：


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_144_0.png)


    ## 三）美人儿


    窈窕淑女，君子好逑。如果你是个穷丑小子，你怎么样能追求到心中的女神呢？常规方法，就别妄想了。


    电影《遇见你真好》中阿虎是个非常丑，非常穷的小伙子。但他另辟蹊径，结局欢喜。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_145_0.png)


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_145_1.png)


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_145_2.png)


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_145_3.png)


    在这个 1% 概率赚钱的情况下，怎么能一击必中呢？


    ## 天天想着赚大钱的人，必然赚不到大钱。


    —— 一笑加一笑


    论信息获取时效，消息解读，数据分析，普通百姓与机构投资者竞争，无异于以卵击石。与年薪百万的机构经理比，普通百姓必然在各个方法无法企及。


    但世界是公平的，凡事无绝对！大有大的好处，也有大的烦恼。股市专治各种不服，总是有很小例外，也有很少见但经常出现的机会。我们一一分析。


    1. 股市中每年都有一、两次抽风。


    基民是盲目的羔羊，每次股市抽风时，必然伴随的是大跌，基民大量赎回。基金公司手中金子般的品种，平时是无论如何也不舍得卖出的。此时这种品种下跌最少，面对无脑的基民的赎回，也只忍痛割爱，机构竞相出货，美人贱卖。普通百姓抱得美人归的时机就在此时。


    2. 容不下大机构的股市品种。


    有一些股市品种，容不下机构的这种大象。这是普通百姓股市投资的第二个赢利点。小也是一种美！


    3. 其它。


    不讲了！赚钱的必定是偏门（无论股市还是现实）。


    > 注： 下一篇会讲各种股市中的品种。


    ## 四）概率


    如果你在股市中找到了一种稳定盈利概率是 51% 的投资方法，而一旦盈利，就是暴富。我也说你必定可以发大财！怎么发大财呢？


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_147_0.png)


    哈哈，粗粗来讲，就是一定要保证能下注 100 次，而保证没有赢利的 99 次中本金不要亏光。挣个钱真的是不容易！常用做法可以用：凯利公式。后面会讲。


    ## 五）亏钱


    本公众号的介绍是：“一切普通百姓赚钱有关的理论”。有群友提了一个问题：“教别人赚钱？你有多少钱？”。开公众号，建群，纯属偶然。别猜了，普普通通人。


    > 不要怕出错，不然你永远不会正确。--- 汤姆.威克


    如果亏钱的时候，还感觉到了苦味的话，说明你亏的时间不够久。2012 年之前，我一共亏了 A8.2（投资人的钱），自己创业及股市亏了 A7+。一直到 2012
    年，我才开始在投资路上跨对步伐。第一次相信犯进中举发疯是真事儿，是我可以在股市中一天赚很多钱，那天我浑身冷汗，人生第一次失眠。终于知道“风淡云清”这四个字，不是随随便便可以做到的。


    没有不曾失败的成功者，亦如开车时小磨小擦才不会出大事故。在一些投资路上我亏过钱，所以希望群友以我为鉴，即使走弯路，也不要太久太远！


    下一篇开始讲具体的品种。


    （一笑加一笑，2018 年 4 月 16 日夜）


    # 赚钱的小众品种 - 股市篇 #60


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_149_0.png)


    赚钱的小众品种 - 股市篇 #60


    > ------写给还在股市中亏钱的朋友！


    人在三种情况下最容易失去理智：宗教、爱情、股市。股市之魅力可见一斑！


    股市虽有谚语：七亏二平一赚。但如果没有几乎股票，茶余饭后、职场发展中都必定少了一些谈资。


    本公众号只讲小众的东西，**要赚钱！要赚钱！要赚钱！** IB 的规格自然要高。本文讲讲赚大钱亏小钱的小众品种理论分析！


    ## 一）基石


    1+1=2，是整个数学的基石，建立起了整座数学的摩天大厦；个人的行动公理（注 1），建立起了奥地利经济学的大厦；我把投资“三知道”这个小理论，设定为百姓投资的基石。我将尝试用“三知道”来构建普通百姓的赚钱理论公式。（注
    2）


    ## 二）三知道


    为什么很多人在投资市场上（楼市、股市或者其它市场）亏钱？因为你“不知道”。不知道后面会涨多少，不知道会跌多少，不知道这笔投资什么时候才能结束。


    下面我们就用这个“三知道”，来看看哪些品种在股市上，是可以大概率赚钱的？


    ## 三）“三知道”的股市应用


    凡一谈股市，只说股票者，都是股市菜鸟。无论他在股市中玩了多久，无论他战绩如何。


    笑。


    ## 我们先讲股市赚钱之道。


    很多朋友在证券市场上，企图分析后市的涨跌来决定是否割肉，然往往事与愿违，估计你会异常痛苦的。更加倒霉的是很可能你不斩仓它就一直跌，终于忍不住割肉了，正好就是最低价。买在高岗上，割肉在地板！


    痛苦的根源何在呢？那是因为你把投资最根本的东西搞错了。投资获利的第一要素是：防止自己情绪失控，等待对手情绪失控。


    情绪为什么会失控呢？因为你“不知道”。不知道后面涨多少，不知道跌多少，不知道这笔投资什么时候才能结束？


    大部分人亏钱，都是不知道“为何亏钱”。事后总结主要原因往往就是“控制不住自己的情绪”，但实际上是，由于投资思想的关系，控制不住情绪是必然的——因为本身就是你在蒙，三个知道没有一个是知道的。


    情绪怎么才能不失控呢？最好是“三知道”。知道能涨多少，知道会跌多少，知道投资的期限有多长。但实际上不用也不可能做到“三知道”，知道一个或两个就完全可以了。


    赚大钱源于大仓位，大仓位源于心中有底。心中有底则源于投资的“三知道”。


    ### a) 先看债券：


    - 1、投资期限：知道。只要你的资金使用期限与之差差不多就可以了，如果是短期资金投资长期债券恐怕就要情绪失控了。

    - 2、涨多少：知道。只要够你的希望收益率就行。

    - 3、跌多少：不知道。受基准利率影响，但只会浮亏。此外得公司不破产才行。


    ### b) 再看可转债：


    - 1、时间：知道。不一定是到期，和条款设计有关，后面文章详细讲。

    - 2、跌多少：知道。纯债券，但只是浮亏，而且是最坏结果。

    - 3、涨多少：知道。最少也是连本带息，而且是最少涨幅。


    （可转债的信用问题其实并不大，公司可以通过修正转股价而逃避债务。总不会宁可破产也不修正吧）


    ### c) 分离债正股


    - 1、时间：知道。权证到期，一翻俩瞪眼。

    - 2、跌多少：不知道。

    - 3、涨多少：不好说。不能保证一定上行权价。


    这就是为什么大家会觉得分离债正股比一般股票要好，其实不是真的好，而是你知道了“一个半”，情绪上比较稳定。


    ### d) 我们以前搞过的正股+沽权


    - 1、时间：知道。权证到期。

    - 2、跌多少：知道。溢价幅度。

    - 3、涨多少：不知道。蒙着多少算多少。


    ### e) 看看指数基金


    - 1、时间：知道大概。反正有牛有熊，熬三五年一般能出头。

    - 2、涨多少：知道大概。XXX 市盈率就高估了，大盘的市盈率相对稳定一些。

    - 3、跌多少：知道大概。XXX 市盈率就低估了，而且也不会退市什么的。


    投指数基金比股票情绪要好控制的多，最后说股票，你会发现属于“三不知”品种，纯粹就靠蒙！


    ### f) 封闭式基金


    封闭式基金类似于指数基金，在时间方面，你的资金的使用时限要和它的到期期限差不多，收益比指数基金高，否则你恐怕要忍受折价扩大的煎熬。但这个好品种目前被玩残了！


    ### g) A 类基金


    - 1、时间：知道。部分永续，部分有期限。

    - 2、涨多少：基本知道。

    - 3、跌多少：基本知道。参考债券年化收益。


    ### f) B类基金


    参见股票，可以理解为加了杠杆的股票。


    ### g) 股票


    1、时间：不知道。


    2、涨多少：不知道。技术分析？基本分析？是人们企图安慰自己发明的东西罢了。


    3、跌多少：不知道。而且相当恐怖，侬不好来个预亏，St，退市什么的，估计把你搞疯了为止。


    搞股票就一定不知道嘛，到也不是。一些投资人，他们采用的是“强制自己知道”，而且他们有三个特点：一是全部是长期投资，二是都是业余投资人，三是抗风险能力极强。


    说两个典型代表，一般人是学不来的：


    一个是小伙子，白领。十万积蓄全买了一只股票。


    1、涨多少：他说不到十倍就不卖。


    2、跌多少：他说大不了到零蛋。我有工作，有收入，不怕。


    3、时间：他说等多久都行。


    05 年入市的，买的有色，真的变成 100 万了，辞职当职业股民了，采用以上方法又买了另一只股票。最多到 300 万，现在 150 万。运气啊，还是运气！


    另一个是退休的局长，资金分成 30 份，买便宜的 ST，5 块以下的那种


    1、时间：他说大概一两年，要么重组成功，要么就退市了。


    2、跌多少：他说大不了退市，不要了。


    3、涨多少：他说最少五倍，一个顶四个，而且不会那么多退市的。


    赚了不少钱啊，疯子，一般人学不来，心脏受不了！


    ## 三）股市赚钱的品种


    > 凡是说低风险低收益，高风险高收益的，都是投资菜鸟。投资追求的永远是低风险，高收益。


