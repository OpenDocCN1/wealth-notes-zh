  - '[PAGE 81]


    个人观点：你能办理下来的信用卡额度，主要取决于你所在的城市，以及你个人的资产资质。外面所谓的信用卡办理秘籍，只是锦上添花！噱头！


    # 二）谎言


    经常有朋友会看到文章：普通人如何办理600W 信用贷；普通人如何办理300W信用卡。凡事怕较真：普通人所在地哪里？资质如何？有几套房产？是不是 15%+的利率？


    一二线大城市，有套较高净值资产办理 100W 信用卡，不是大问题。但单核 300 万，如果没有税费卡的话，咳咳。


    # 三）办卡渠道


    顺序：办卡业务员最优，网点柜台次之，网上申请最差。


    一般情况下，信用卡额度的审批权在信用卡中心，那如何的优化（注意是优化，不是造假）你的材料，就是业务员的作用了。


    你下卡，他才有业绩。白金卡还是普卡，他的业绩也不一样。他们会尽心尽力的帮你办理高等级高额度的卡。业绩呀业绩，奖金呀奖金！


    对于网点的人来说，你下卡与否，多少额度，与其业绩无关。所以好多朋友去网点申请，往往得到的答复是：网上申请就好了嘛……'
  - '[PAGE 82]


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_82_0.png)


    我们多军追求的是额度，额度，额度。务必强烈要求网点业务员，将所有的申请材料全部上交，不然就投诉他。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_82_1.png)


    最后说下网申。由于网申只需要填写个人信息，没有任何的辅助的资产材料，因此额度往往是最低的。除特殊情况，**不要网申！不要网申！不要网申！**


    # 四）提额


    第一次就申请大额，还是先申请再慢慢提额？提额是一件很慢、很靠谱、又很耗精力的事情。**最多也就只有10%~20%的银行可以通过养卡提额，这是现状！**


    最优策略：第一次就提供最多的资产证明材料，把最大额、最高等级的卡办理下来。这是当前申请信用卡的不二法则！'
  - '[PAGE 83]


    # 五）申请信用卡姿势


    申请姿势是有标准的流程的：带上所有能证明你有钱、收入稳定的材料（包括但不限于房产证、行驶证、收入证明、工资流水、大额存单、大额股票账户、税单、公积金等），然后按照四个批次，每次集中在一两天申请六七家银行。


    # 六）十二张卡信用卡申请顺序


    首先需要申明的是，不同的用卡需求，有不同的申请策略。


    对于羊毛党来说，交行白麒麟很棒：下卡容易，活动多。但他致命的缺点是风控很严，遍地 2000 党；因此对于中意图额的多军来说，这只是个鸡肋。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_83_0.png)


    下面的信用申请顺序，都是以最大额度为目的。


    1）第一批信用卡申请推荐银行'
  - '[PAGE 84]


    先办理这四家银行：光大银行，上海银行，招商银行，上海农商银行。这四家银行额度大，对征信查询次数和已有卡数极为敏感。


    第一家：光大银行。优点：相对额度较高（10W+），办理方便，且对查询次数敏感。


    第二家：上海银行。上海银行没有大的优点，除了额度较高。一般 8~10W是没问题的，风控不严，你懂的。


    第三家：招商银行。招行的额度很高，对卡数极为敏感。更难的是，招行是薅羊毛党大爱。其高端卡积分变现极易。


    第四家：上海农商银行。农商的卡可以方便的兑换航空里程。缺点：下卡难度很大！！！对自己的资质没有信心的朋友，就放弃吧！


    第一批材料申请完成后，大概在 1 周左右，这 4 家银行已经查询过你的征信，但还没有审批完成。因此你的征信上没有这 4 家银行卡片和额度信息。机会来了！此时抓紧集中申请对卡片数敏感的另一家银行：


    2）第二批信用卡申请推荐银行


