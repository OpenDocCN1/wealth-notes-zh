    股市中购买股票后，要么涨要么跌，不应该也是 50%:50% 吗？怎么会有股市定律：7输2平1负？


    股市中赚钱与否，在这一个问题上的认识是一道华丽丽的分割线。


    ## 一）油水


    中国的股民普遍是瞧不起赌民，道德上他们被舆论经常性赞扬。股市中传统分析手段不说，24 节气大法据说也有一大批拥趸。据说股民普遍认为股市的发动机是企业分红，您睃过上市公司年报吗？智商呀智商！


    小例子一：


    张三手里 1 万元，李四手里 1 万元。2 人随便找个地方打牌。最终：张三手里的钱 + 李四手里的钱是否 = 2 万元？


    小例子二：


    张三手里 1 万元，李四手里 1 万元。到隔壁的老王家打牌，老王每局抽红 10 元。最终：张三手里的钱 + 李四手里的钱是否 = 2 万元？


    股市中有一大批从事隔壁老王的机构：像佣金印花税不说。那庞大的 JZH，基金公司，股票发行机构……当然还要狠坐庄的，他可以抽老千，知名不具。


    他们是靠谁养活呢？你猜。


    大道至简，聪明的朋友肯定知道答案了：原来是隔壁老王导致 7 输 2 平 1 负的。


    ## 三) 胜率


    既然隔壁老王已然导致了 7 输 2 平 1 负的股市定律，股市中这盈者的 10% 中。普通百姓的胜率是多少呢？


    - 出老千机构：50%。（知名不具，自己猜）

    - 基金机构：30%。

    - 民间高手：10%。

    - 普通百姓：10%。


    通过内幕消息操作的还暂且不说。


    普通百姓在股市中赢利的概率是：10% * 10% = 1%。


    在各行各业，如果您能做到前 1%，即使是收破烂，都是个破烂王。如果在公司的话，至少是个老总级别的。


    所以绝大多数普通百姓可以做的是：见下图：


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_144_0.png)


    ## 三）美人儿


    窈窕淑女，君子好逑。如果你是个穷丑小子，你怎么样能追求到心中的女神呢？常规方法，就别妄想了。


    电影《遇见你真好》中阿虎是个非常丑，非常穷的小伙子。但他另辟蹊径，结局欢喜。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_145_0.png)


