    \n# 水库多军干货 #605\n\n### 一）前言\n\n水库多军朋友，特别是刚加入水库的朋友，一上来就要干货。但干货这种东西，没有人会主动给您的。很多干货，如果所有的人就知道了，洞会马上塌的。\n\
