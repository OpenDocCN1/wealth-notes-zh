    05 年入市的，买的有色，真的变成 100 万了，辞职当职业股民了，采用以上方法又买了另一只股票。最多到 300 万，现在 150 万。运气啊，还是运气！


    另一个是退休的局长，资金分成 30 份，买便宜的 ST，5 块以下的那种

