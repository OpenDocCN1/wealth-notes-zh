    如果亏钱的时候，还感觉到了苦味的话，说明你亏的时间不够久。2012 年之前，我一共亏了 A8.2（投资人的钱），自己创业及股市亏了 A7+。一直到 2012
    年，我才开始在投资路上跨对步伐。第一次相信犯进中举发疯是真事儿，是我可以在股市中一天赚很多钱，那天我浑身冷汗，人生第一次失眠。终于知道“风淡云清”这四个字，不是随随便便可以做到的。


    没有不曾失败的成功者，亦如开车时小磨小擦才不会出大事故。在一些投资路上我亏过钱，所以希望群友以我为鉴，即使走弯路，也不要太久太远！


