    # 三) “金闪借”历史


    2018 年 4 月，南京、苏州最开始公积金提额的试点，分别是苏州的金闪借（原工银秒贷）和 南京的金闪借。这是一款面向公积金缴纳客户提供的个性化、定制化贷款服务。只要您正常缴存公积金，就可以无担保、无抵押、纯信用定制个性化贷款服务。


    后续，“金闪借”陆续推广到了广东（名字叫“税闪借”），由于深圳地区是计划单列市，税收不归广东，因此“税闪借”不包括深圳地区。对深圳库友来说，这确实有点儿尴尬！


