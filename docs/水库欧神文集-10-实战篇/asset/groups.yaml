    # ## 一） 等额本金与等额本息


    等额本金和等额本息，是我们做房贷是经常遇到的还款方式，下面我们就来简单讲一下。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_59_0.png)


    从图上可以看到，等额本金的还款曲线，是一条递减的直线。而等额本息，是一条为固定值的直线，等额本金一开始要偿还的金额多，但是要付付总的利息较少。


    等额本息一开始要偿还的金额少，但是要付出的总的利息较多。在欧老师的文章中（注 1），已经详细的解释过了在何种情况，等额本息都是最忧的选择。


    至于有些朋友会说，等额本金偿还的利息更少啊，为什么不选等额本金呢？其实可以从另一个角度来解释这个问题：等额本息一开始偿还的金额少，那就相当于等额本金相比等额本息，在每个月都会做一次提前还款（还款金额=等额本金月还款额-等额本息月还款额），所以等额本金节省的利息，其实是由于提前还款造成的。'
  - '[PAGE 60]


    同时，这两种还款方式的真实利率，也就是贷款的利率。


    # 二) 先息后本


    先息后本的还款方式，是在信用贷中常见的还款方式。一般一年以下的信用贷经常采用这种还款方式。这种还款方式的还款曲线很简单，也是一条直线，但是在最后一期需要将本息同时归还，会存任比较大的针刺效应。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_60_0.png)


    当然解决方式也比较简单，只需要找个朋友，或者使用暂时闲置的资金，临时过桥以下，即可。


    # 三) 信用卡分期


    信用卡分期是大家经常容易混淆利率的还款方式，当然有些朋友会说，直接*2即可，那为什么要*2，我们今天就来简单的说下。


    ![](img/998d37a9a4955949ecbc2ff65f9f659f_60_1.png)


