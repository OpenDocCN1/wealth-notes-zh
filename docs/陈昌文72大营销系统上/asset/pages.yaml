  md: '人总是喜欢找借口，对我个人而言，我觉得我的时间就很多，大部分时间都被我浪费了，真正工作的没多少时间。我相信，任何人都是这样，其实，他们能挤出来时间，早起早睡，不可能没有时间。唯有日日渐，滴水穿石，从一而终，才能做好营销工作。客户、粉丝的头脑，需要日日渐润。慢慢的，他们就喜欢我们，就赞同我们，就离不开我们了。


