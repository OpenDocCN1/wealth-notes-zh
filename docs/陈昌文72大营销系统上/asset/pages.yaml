- pgno: 117
  md: '# 第九章

    陈昌文方法 72 大营销系统之广告尾巴系统


    > 产品是为广告服务的。——陈昌文'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 商业的本质就是卖广告


    商业的本质就是卖广告、产品、服务、人、视频、直播、微信朋友圈、微博、语音交流，一切都是为了广告服务。我们每天做价值，都是为了广告服务。


    孔子说，您读了那么多书，对内不能管理，对外不能外交，您读那么多书干啥？意思很简单，您必须要有实际的利益搞到手，没有实际的利益，您的一切都是错的。


    为什么我们很多人不赚钱，就是因为没搞清楚重点，广告才是重点，其他的都不是重点。我们折腾着释放价值，折腾着搞视频、直播、朋友圈，不就是为了卖广告？


    要搞清楚我们的目的，就是为了赚钱，而当我们不赚钱的时候，一切都是错的，商业活动的本质，就是让客户买单，当然是合理合法的买单。


    为了做好广告营销系统，我们专门开发了很多卖广告的方法，比如潜意识营销、媒婆营销、故事营销，都是为我们的品牌服务的，都是为了我们的付费环节服务的。我们要求每个人的视频里，都要有潜意识营销、媒婆营销、故事营销，我们要求每个人的直播、朋友圈、文案，都必须要有36广告尾巴循环系统。


    赚钱，是研究与释放广告的过程，您的广告有多远？广告本身就是内容。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 内容创业的本质是广告创业


    内容创业的本质是广告创业，只有广告才能卖服务。卖服务，才能赚钱，没有发广告，就没有收入。日白发广告，切记，一切文案、一切直播、视频、图片的最终目的是为了发广告，您要是每天不发几十个，上百个广告，您就不及格，创意性质的广告，故事性质的广告，是赚钱的根基。


    如果您赚钱的时候，您去看抖音等无聊的东西，就会导致您不赚钱。如果您每段文案，每个课程后面，都有很多广告，则您一定赚钱。比如：“加入我们高级群是要付费的，不差钱的来。”这就是一个隐形广告，广告可以隐形，也可以直接，建议大家直接上广告，比如：“高级群收费多少钱，很多老板在里面。”这就是直接广告。


    # 赚钱一定是广告、广告、还是广告


    一切内容是围绕广告，有价值，但必须插入广告，否则，没有广告洗脑，没人付费。这个是赚钱的核心要素，一切本质上是为了广告服务的。要是理解不了这个，非常惨。


    我们核心是玩广告的，没有广告，就没有收入。广告才是核心。不研究广告，不可能有收入。不做广告，不可能有收入，但是咄咄怪事，大家是不做广告的。所以我要开始天天吼36
    循环广告尾巴系统。'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   广告尾巴系统


    每个人都是循环这个，产品为广告服务，而不是广告为产品服务。任何内容，都是支撑 36 广告循环系统的，也就是说，无论是您的直播，还是文章、文案、视频、一切目的，最终是为了
    36 广告尾巴循环系统做服务的。


    也就是说广告才是核心，而其他的是为了丰富，支撑，营销广告的。如果本末倒置，抱歉，没有利润。很多人只是喜欢做内容，内容做到精益求精了，客户也不买单，广告就是一切，本质上，所有公司，就是广告公司。


    36 循环系统，主要是围绕广告进行循环，每天必须发出去 36 个广告尾巴系统。无论是直播发，还是朋友圈、QQ 空间，您都必须发，您不发广告，抱歉，您什么也没有。没人给您付费。


    # 成交一定要留尾巴，尾巴系统的打造


    任何人，在做好 36 循环系统的同时，必须打造自己的广告尾巴系统。尾巴系统包括您的真实姓名、您的支付宝、您的微信号、您的收费方式、您的服务内容。尾巴系统还要有免责声明（看免责声明系统）。


    时间，每天早上、中午、晚上，必须出现尾巴。


    尾巴系统，是在内部文章很优秀的情况下，才有用。成交尽量用长篇长文章。只有长篇文章非常有价值，客户读了，觉得您确实好，客户才会付费。文章的长度，保持在 800
    字左右。能多上图片与视频最好。包括，1、'
  merge: -1
  img_proc: true
- pgno: 121
  md: '付费理由。2、介绍业务。3、证明自己的服务，产品质量过硬。


    每篇文章，都必须带图片，可以是美女、自己的生活照片，以及风景照片。


    广告尾巴系统，是每天必须做 36 个循环，通过图片表达，或者通过文字表达。


    优秀的广告系统，是一个组合拳。


    +   a、自我介绍，您是干什么生意的，您多大，您有什么故事，您的创业，奋斗故事。


    +   b、为什么要购买产品或服务。比如我们老板社群，您加入社群的好处，有讲课，有老师指导做项目等等。


    +   c、如果广告尾巴里，有您的家人、女朋友、老婆、父母、孩子、朋友，或吃饭照片，您的尾巴成交流率会更高。


    +   d、如果您推广项目，那么广告尾巴里，有做项目的步骤，做社群的步骤，都是货真价实的释放，这种成交流率非常高。


    然后，您必须讲真话，每句话都是真的。


    广告尾巴系统，有条件的，一定要视频化、音频化，跟人交流，就打语音，打电话。


    真正的高手，是通过释放价值做广告，是通过组合拳做广告。真正的高手，每天必须有 30 分钟，在优化自己的广告。


    开公司，留公司名字，留地址，这种广告最厉害。做社群的，群里聊天图片，每天上传录音图片，都要进行传播，对群进行真实描述，比如群里有 1000 多人，有 300
    多人，有 700 多人，进行真实描述。总之，您卖什么，您就描述买什么，有什么具体的好处。'
