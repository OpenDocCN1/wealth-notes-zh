- pgno: 30
  md: '# ## 最厉害的营销是文化营销


    文化营销，是最厉害的营销，没有之一。我们搞儒家思想，主要是传播中国文化。其次，也能帮助我们成单。利益与公益，都做了。我们富贵，是理所当然的事情。


    我们必须紧紧团结在孔子旗下，团结在儒家思想的智慧之下，来做我们的业务。


    儒家思想的伟大，就是谈日常行用。做到早睡早起，努力工作，锻炼身体，这些日常行用做好了，您自然事业发达，家庭兴旺，和和美美。


    传统文化，可以变成商业模式；传统文化，可以用来带团队；传统文化，可以用来打广告，收费。


    我创办的老板社群的核心重点，就是儒家思想、传统文化。传统文化配合营销手段，这就厉害了。儒家道统，我们先宣传儒家道统，再结合营销。


    儒家思想+陈昌文方法，重点是儒家，然后顺手讲点营销，靠着大道就赚钱了。


    大道为公，大道，都在老祖宗那里。宣传老祖宗、宣传孔子、孟子，自然发达。老祖宗的东西，变化成我们老板社群的营销内容，自然发达。最好的，就是天天学中国传统文化，孔孟之道。现在有些思想，都没有中国传统文化先进。


    看古书，根本用不着成天去找西方的现代畅销书，畅销观念看。古书里都有，中国老祖宗才是最厉害的。


    ![](img/9610da2262e4e91954d340aa3b2c568a_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '**最厉害的文化结构是这样的，中国传统的道德文化+努力工作的文化+团队模式文化。** 也就是口中有德，手上有活，然后打造团队模式赚钱。这样，您就会立于不败之地，没人能攻击您，而且，您的队伍会越来越大。


    我的陈昌文方法文化原型，是儒家思想，用之则行，舍之则藏，您看懂了，就跟着想学，就跟着想学，不想跟着学，就算了。我们都不强求。我认为营销是要靠实力的，也就是产品好，服务好，然后才是广告技巧。


    想要发财，就是学习营销，就是不断地专研营销，任何老板，都非常有必要深入理解营销。营销就是文化，儒家思想就是营销的根基，然后学习广告学、心理学、社会学、传播学，这就是营销的内容。


    儒家思想是百分百可以让您们南面而王，成为圣人的思维模式，是可以安身立命，自利利他的思维模式。我以后主要工作，就是传播儒家思想，和大家一起做一个完整的人，一个具有完美德行、品格的人。财富只是枝叶，水到渠成。一定要结合儒家思想、传统文化。这道菜，太厉害。大家都喜欢吃。


    真正厉害的思想，是孔孟老庄。中国传统文化是天下间最厉害的智慧。我将严格学习中国传统文化，以儒家思想为根基，成为一个儒商。


    # 陈昌文创业方法建立在儒家思想之上


    儒家思想是我们社群的核心要义。我们社群讲的就是孔孟王道，阳明心学，然后讲营销，讲创业。佛法、道家思想都很重要，都是老祖宗的真


