  md: '比如：我的文章系统，可以用来讲课，可以用来做小尾巴赚钱，同时指挥我的社群群友赚钱。文章系统，只谈互联网营销，只谈赚钱。锁定老板这个概念。无论我写富人，还是写情感，都是锁定老板的，都是教大家做老板社群，我只教大家做老板社群，其他事情是不做的。而且只以文字的心思进行表达。


