- pgno: 52
  md: '选好一个环节，就一直弄。要锁定一个项目，锁定一个环节，无论天晴下雨，都不要有情绪。无论谁打击您，您都一直干。人只能从一而终。从一而终，师从一个老师，做一个项目，搞透彻一个环节。经常换老公的女人，能幸福，是小概率事件。男人也一样。


