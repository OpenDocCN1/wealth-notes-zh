- pgno: 23
  md: '我们三观不正，干啥都没前途。赚钱的营销手段，就是陈昌文方法，就行了。各位，每天要有一半以上的时间来正三观。三观必须正，价值观必须正。价值观正了，您才会开心，乐道，钱自然就来了。三观不正，是会倒霉的，也没有前途。三观不正，很多人就会软，就会瘫。


    我们老板社群，首先就要正三观，正价值观。


    价值观、三观是核心中的核心。然后再配合我们的营销方法，什么都有了。三观不正的人，别人就不喜欢听您讲话，会心生厌恶。三观正了，配合营销方法，您自然就越来越强大，三观，是核心啊，每个人都应该开始去正三观，去学习国学、儒家思想，且传播，然后再做营销。


