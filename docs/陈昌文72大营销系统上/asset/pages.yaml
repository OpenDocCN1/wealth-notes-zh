    谦虚低调，厉害的人多着呢，狂什么狂？见到牛人，老老实实听话、照做、执行。闭嘴多听，不要吹牛。吹牛吹多了，别人看不起您。


    别说话，干活，干点成绩，吹牛，别人听了又如何？您又不能致富。就是干活。


    要低调，低调，再低调，谦虚，谦虚，再谦虚。不要觉得自己牛。一旦人有傲气，则变成傻子了，遭别人讨厌。


    算计高手，是最愚蠢的行为，应该跟高手合作。跟高手合作，您才最 有前途。人必须谦虚，必须低调，必须务实。有些人说，这个时代，不需 要谦虚，这是乱讲。他们说，骄傲则机会多，这也是乱讲。谦虚，务实把'
