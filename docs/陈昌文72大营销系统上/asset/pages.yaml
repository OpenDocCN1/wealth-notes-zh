  md: '取势，从整个产业的高度来看产业链，知道自己的企业在哪里；


    明道，系统化打造企业的战略，明确自己提供的价值曲线；


    优术，在取势和明道的指导下开展运营营销造团队。


    陈昌文方法的构成，文化思想是儒家思想；行动纲领是 36 循环系统；营销思想是内部营销系统+外部营销系统；持久战思想，也就是我们做任何项目，都是打算从一而终，一辈子干这个；聚焦是我们的核心思想。当我们不赚钱的时候，往往都是因为我们去做了其他项目；永远是客户第一，我们制造的是客户需要的内容；要把服务做到极致，365
    天、十几位讲师不间断、全年无休的讲课，这是服务的核心；我们的流量，全部来自于儒家思想和陈昌文方法极致的内容。


    陈昌文方法是专业的营销系统，也就是您不会卖货，不会搞营销，就跟着我们学习营销。我们专业搞营销，卖营销，培训互联网营销，培训网络营销人。我们所有的东西，其目的，最终都是搞营销，营销培训，营销教学。


    我们做好营销的核心，是宣讲儒家思想。


    我们的每一个营销套路都来自于儒家思想，我们是搞传统文化+营销的。每个营销，都有步骤。


    我喜欢国学，一切通过国学解决问题。我建立了社群，一切通过社群解决问题。儒家思想与陈昌文方法结合，构建企业家思想。有思想，才有企业；无思想，则无企业。经营企业是经营思想的结果，营销策划是有技术的，做企业也是一门技术。


    我们老板社群里的人主要干啥？


    +   1、学习儒家思想。


    +   2、学习陈昌文方法。'
