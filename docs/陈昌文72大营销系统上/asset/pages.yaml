    打造自己的强者形象，会让自己的影响力增加。弱者都希望跟随强者，听从强者安排，这是人性的本能。高手从衣食住行，言谈举止之间都把自己打造或者模仿成强者形象。这个人的影响力就增加。


    **自信心是影响影响力的重要一环。**当您非常有自信心的时候，您的听众、跟随者，也会不知不觉的被您感染，觉得您说的就是这么回事，您的行为是对的，有一定道理的。一个领导，首先要修炼自己的自信心，才能修炼自己的影响力，您自己都不相信自己，您就没有影响力。


    # ## 社交能力是提升影响力的重要一环


    打造影响力的另一个套路是不断地混脸熟，您不断地出现在别人眼前，社交媒体里，如微博里，别人不得不记往您，看到您，您就具有了影响力。


    社交能力是提升影响力的重要一环，**人们在乎您跟谁在一起，人们认为相同的人才会在一起。物以类聚，人以群分。**所以，您想要有影响力，就最好要有社交能力，多社交一些影响力大的人。想要打造自己的影响力，首先要学会社交有影响力的高人，跟着高人混，则您就慢慢有影响力，近朱者赤，近墨者黑。'
