  md: '意从一而终。比如我们说讲聚焦系统，就是一辈子；做社群营销，就是一辈子；讲行动系统，就是一辈子；讲健身系统，就是一辈子；讲儒家思想，就是一辈子；没有多少人愿意一辈子干一件事。别说一辈子，就是一年，他们也受不了。这就是为什么很多人一事无成的原因。


    有些人不能做到从一而终，老是有自己的想法，老是不断地变化。故而，这样的人，没什么前途，收入极其不稳定。聚焦，从一而终，多么简单的词汇。但是，就是没几个人做得到。大家的心，都跟猴子一样千变万化。一会儿一个想法，故而，很难长时间高收入。


    一个人，锁定了关键词，一个社群，就是一辈子，永远也别换。跟了一个老师，也是一辈子，永远也别换。动来动去，换来换去，就是傻瓜。牛B的人，就是从一而终，聚焦到极致，干3年，啥都有了。


