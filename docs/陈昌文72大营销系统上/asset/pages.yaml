  md: '我以前有一个同事，也在当老板，经常约我到处走走，坐坐，后来我不怎么搭理他，不来往了。我这样做的原因，也是净化我的圈子，再后来，我赚得钱比他多多了。他也知道了。我们已经很长时间没联系了。


