  md: '几千块对您来讲，毫无意义，您就付费加入。否则，您千万不要加入我的创业课程群里。我这里不给客户承诺任何事情，您聪明，您就跟我来学。您自然会学到很多东西。否则，就别来，您想依靠我，拿我当拐棍，对不起，您不具备当老板的素质。我这里教您思维、方法、套路。您学不学得会，是您自己的事情，与我无关，理解不了这个，就别加入。


