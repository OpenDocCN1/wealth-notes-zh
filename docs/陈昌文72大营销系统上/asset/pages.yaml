- pgno: 131
  md: '进行一句话营销。所有图片必须是真实的，不可弄虚作假，切记切记，否则触犯法律。


    # 我当年是怎么做图片的？


    社群里有人加入，有人欢迎，有人发言，直接截图，手机电脑截图，直接就扔到朋友圈了。效果非常好。


    我应该是 3 年前，就建议大家专门找一个员工，专门搞图片。这个员工工资也就 4000 块，绝对划得来。不过，现在开始，我希望你们自己先做做。想要赚大钱的，必须打造自己的合法的、真实的图片营销系统。


    网络营销是建立在大量图片的基础上。我们每天都生产了非常多的内部图片。各位一定要把这些图片打上一句话营销系统。日日重复这个动作，要重视。我的话语体系，就能变成你们的物质基础。你们完全信任并执行，你们才能富贵。否则，你们很难学会营销。


    要做到日日截取图片，音频、视频，不断地释放。一日不可间断也。我们只有这样，才能在互联网上生存。生存的唯一法门，就是竭尽全力的拼命。这就是稻盛和夫的干法+活法。'
