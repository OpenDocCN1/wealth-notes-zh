    您不赚钱，说白了，是德行问题，哪里是能力问题。德行长一分，能力长十分，百分。赚钱是品格问题，德行问题，您做不到尊重老师，尊重老师，不是表面上的，而是彻底的爱护，彻底的臣服，彻底的听话。您心里有抵抗，表面上尊重，背地里骂骂，然后贪婪的把老师干的工作都抹杀掉，把功劳都戴在自己头上，您这样的人出去做直播，做视频，能做好？


    营销首先是个人品问题，营销首先是个德行问题，营销首先是个格局问题，营销首先是个格局问题。'
