- pgno: 32
  md: '骨血、好宝贝。


    人要努力赚钱，就要学习正人君子。李嘉诚之所以厉害，就是会做人。一切厉害的传播，全是中国文化、古代文化。所有火起来的人，全部都是这样。我们要传播中国文化、儒家思想，我们要让中国强大。这就是隐藏的使命感。


    我们宣传儒家思想，我们开万世太平，我们做好事。我们不断地积德，传道德，传播智慧。我们日日修德，日日精进。我们什么都有了。我们一直讲儒家思想，我们传播的是大功德，修的是大功德。以后，社会的能人志士，都会帮我们。这就是我们社群要干的。我们要疯狂的宣传儒家思想、国学思维，不断地传播王道思想。


    # 儒家思想系统


    **我喜欢儒家思想，是因为儒家思想是大智慧，超级宝库，比如服务好了客户，自然盈利，先做人，后做生意。**


    好的思想，都在老祖宗那里。我学得越多，经历得越多，就知道老祖宗对我们是真好。


    比如，做项目，慢就是快，慢慢来，慢慢熬，您就会很厉害。比如，用良知做生意，不要过分营销客户。您真对客户好，客户慢慢认识到您了，自然买单，且长期成为您的铁粉。所以，我们必须学习儒家思想经商之道。


    儒家思想主要是让我们修炼自己的性格，提升自己的修养的。年轻的时候，认为孔子说的这些没什么用。随着自己不断地跟人接触，经商，发现非常有用。我以前做生意，认为自己很聪明，总是跟客户吵架，认为客户蠢。虽然也能有收入，但磕磕碰碰，也给自己带了麻烦。学习了儒家思想过后，我对谁都尊重，对谁都礼貌，给客户气。然后我就发现，我的收入进一步提高，心情也好了，麻烦也远离我了。'
