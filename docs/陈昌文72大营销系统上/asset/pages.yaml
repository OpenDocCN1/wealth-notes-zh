- pgno: 270
  md: '见到高手少说话，多做事，多听话。多听高手说啥，然后跟着变现，赚钱即可，别太有自己的主见。


    我全靠高手带我，我的收入才不断地增长。我总是在高手面前多言，我要少说话。我要尽可能的听。别人误会我了，我也不发言，继续听。


