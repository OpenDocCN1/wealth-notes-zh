    您首先要尊师重道，而且要把这个挂在嘴上，在行动上，您自己都不做这个动作，您自己老师，都是当面一套，背后一套，贪天之功，据为己有，把老师的功劳完全抹杀，您自己的行为都出了问题，德行都出了问题，请问您怎么给粉丝做榜样呢？


