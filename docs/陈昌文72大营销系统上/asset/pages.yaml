- pgno: 151
  md: '# 赚钱的核心机密是什么？


    赚钱的核心机密是什么？非常非常简单，


    从术的角度来讲，就是复制、改编、优化，听话、照做、执行。


    从心法的角度来讲：虔诚、感恩、老实、尊师重道。


    这几点您要做到了，您不是神？不可能的。您必将是大师。


    赚钱靠的是什么？复制，复制，再复制，听话、照做、执行。按部就班，而不是投机取巧，而不是找捷径。跟着老师走最宽、最好走的路子，而不是另辟蹊径。人是不需要灵感的，也不需要创新，一切按老祖宗说的办，一切敬天法祖，一切按大师的思维模式搞。创新不过是工具的演变。比如，我们社群的内核不变，我的本质思想不变。我们就是传播儒家思想，陈昌文方法
    72 大营销系统，无论这个世界上的工具如何变，我们都不变。我绝对不自己创造东西，我就是述而不作，信而好古。我的一切，都是复制、改编、优化大师的东西，我不做自己的创造。


    你们要对世界宣传的，我们的儒家思想、陈昌文方法，都是述而不作，信而好古，我们不创新任何东西，只是整合老祖宗、历史上古今中外大师的精髓思想。我们不扯架子，凡是来跟我们学习的学员，也不过是正本清源而已。从思想到营销，我们只不过翻译成大白话给他们。我们是思想、营销界、企业家的终点站。仅此而已。'
