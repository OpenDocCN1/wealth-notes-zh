  md: '货化，不要哗众取宠。这样日复一日的传播，我们就一定更强大。


    日日不断，是每一个成功者必须理解的，也是儒家思想。滴水穿石，绳锯木断。卖油翁，都是这个道理。要想出神入化，就在一个点上日日不断地深挖。赚钱全靠“熬”字，不断地熬项目，项目自然来利润。不要心急，慢慢熬。任何一件事，做到极致，都是暴利。但是，大家都不会去做的。一个业务，到了极致，就是暴利。没几个人会去极致化，主要是极致太难了。对我来讲，也是很难啊。对所有人来讲，也是很难。说实话，这几年来，我连广告都懒得写了，我真是堕落了。所以，只有偏执狂才能生存，我愿意把业务做到极致，您就赚钱。您做不到到极致，您就不赚钱。


    一个人要做到严格要求自己。一个人要做到作息规律，一个人要做到聚焦一个环节。蛮难的。真的。大部分人都是知道规律，而不尊重规律。我何尝不是如此？我们这种人，就是一会儿能坚持，过几天，做不到了，我们又读书，又自责，又反省，又能坚持几天。不过，如此，成就不会很大，慢慢我们就老了，追不上青春的尾巴了。如此反复，也追不上成功人士的脚步。


