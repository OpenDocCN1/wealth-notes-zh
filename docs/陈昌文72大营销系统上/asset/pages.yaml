- pgno: 347
  md: '不过仅仅是社交有影响力的高人还不行，您还得拿出您的绝活与大家交换，您显得有专业价值，又能跟有影响力的人做朋友，则您的影响力与日俱增。


    您学习那些具有影响力的人的衣食住行，言谈举止，也会让您琢磨到影响力的一些秘密。有影响力的人在衣食住行上，言谈举止上都会体现出来权威感，而这些东西其实是可以模仿的，如果您也这样做，您就会慢慢发现，您也会有一些影响力，您跟着学，可能最后会把自己修炼成影响力大师。


    # 让自己对社会有价值


    您想要强大的影响力，在和平社会，不是让人怕您，而是让人喜欢您，这就是为什么很多明星具有影响力的核心。


    说相声的为什么有影响力？让人喜欢，让人乐。您越让粉丝喜欢，您的影响力就越大。


    锻炼自己的演讲能力是打造自己影响力的重要一环。如果您能演讲，能释放有价值的视频、音频在互联网上，而且持续不断，则您的影响力也会与日俱增。


    想要打造自己的影响力，首先想想，自己对社会有什么好处，有什么贡献，自己的一言一行能让别人获益，您就会有影响力，让人获益越大，您的影响力就越大，影响力的产生本质是一个输出价值的过程。'
