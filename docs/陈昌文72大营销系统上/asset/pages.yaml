- pgno: 83
  md: '这种思维模式，将让你的行为模式异常简单。当你的行为模式，思维模式都非常简单的时候，你就不会累。当你不累的时候，你的工作效率就会非常高。事情多了，自然杂乱无章，顾此失彼。送孩子上学，买菜，上班，上班也是非常复杂的，做的事情非常多。这样的人，不可能有前途。因为他没有办法做精，做透彻任何一件事。


    很多创业者，一开始上来，什么环节都要做，什么环节的钱都想赚了，所有环节都蜻蜓点水，没有一个环节做透彻了，然后又埋怨“我什么都做了，怎么还不赚钱？”岂不知，这就是你不赚钱的原因所在，就是你什么都做了。多，不一定“得”，反而会失去更多，就是把老本也赔进去了，自己的时间和精力也搭进去了。你只能选择一个环节中最重要的部分，其它的一律外包或合作。如此，则乾坤朗明。


    创业，是做更少、极少，唯一的一件事，当你找到这件事，你就容易了。生活与工作，都容易了。


    # 做一个简单到极致的人


