- pgno: 273
  md: '# 营销的核心是讲信用


    信用、声誉，是非常非常重要的。不仅仅要做到不违法犯罪，还要做到保持自己的良好声誉、信用。


    中国实体经济最要紧的就是诚信，对客户要有宗教般的虔诚。品牌的根本核心就是诚信，真诚。您要对客户的需求有宗教般的虔诚。诚信，只要您诚信，您就可以活下去。我们的经验说到底，就是一个诚信。


    真正厉害的人，是不骗客户的，是不乱搞的。因为，您乱搞，骗客户，会造成您只能玩得了的一次。即便是您特别聪明，您也只能玩几次。凡是真正的大公司，都是为客户服务的，都是认认真真的帮助客户的。只有这种认知，您的跟随者才会越来越多，您自然就能做大做强。牛人不是不要利润，而是知道，不能要了利润，而丢掉了客户的跟随。


    一个人有了道德素质，才会受到别人的尊重。一个人没了道德素质，无论穷富，都是灾难。


    儒家思想，就是讲信用，不要诈骗，欺骗客户，因为我们追求的是复购，是长期走下去。如果您欺骗客户，信用破产，客户还可能去告您。所以，对我们的产品，要仔仔细细的看，仔仔细细的理解，然后去推销，您就会变成赚钱高手。


    清清楚楚的叙述我们资源的价值，客户听明白了，客户自然买单。不要怕客户不买单，怕您自己叙述不清楚自己的价值。诚实正直，言行坦荡。我们一切都透明化，绝对不说一句欺骗人的话。这是保护我们自己。欺骗别人，本质上是坑害自己，这个可能没多少人理解吧。当您做的越来越大，'
  merge: -1
  img_proc: true
- pgno: 274
  md: '您如果还欺骗人，您迟早倒大霉。只有小人才无所忌惮。君子，都是戒慎恐惧。言行坦荡，绝对不弄虚作假，不獍琐。是什么，就说什么，实在不能说的，就沉默。


    不知道为什么有些人在网络上，做生意，不顾自己的信用。不顾自己的信用，碰到钉子了，这个人如果对您发起攻击，您会怎么办？您能怎么办？实锤您了，您怎么办？全网搁您，您就死定了。不讲信用，您没碰到厉害的人罢了。要是碰到厉害的人，您怎么办呢？


    其实，在网络上，堂堂正正的做服务，就可以赚到很多钱了。但有些人邪恶啊，非要通过骗术，陷阱来赚钱。沦陷，也是迟早的事。


    # # 德行决定财富多少


    信用必有德行。


    很多人不懂，素质、道德，才是赚钱的核心。有了这个，赚钱非常轻松，要多少，有多少。能力跟素质、道德比，其实可有可无。凡是能领悟这条的，就开始走进收入翻百倍的道路。


    一旦您开始修炼自己的素质，您的收入就会疯狂增长。只是，大多数人根基浅薄，盛不住财富。一点点财富，就开始溢出了。这几句话，都是金玉良言。


    有很多老板，有个几百万、几千万的，由于不谦虚，骄傲，乱投资，'
