- pgno: 29
  md: '上面的花开花谢。很多人不打根基，就想上面开花打谢，简直让人哭笑不得。


    有了德，财富自然随之而来，德大则财大，德小则财小。不义而富且贵，于我如浮云。李嘉诚喜欢这句话，我也喜欢这句话。至圣先师孔子，商业社会的成功人士李嘉诚，都推崇“德”。各位若要寻财富，不要浪求，都在《论语》里啊。


    儒家思想是一种道义，是一种做人做事的规矩。哪些事情该做，哪些事情不该做？您学习了儒家思想过后，就有一个准绳了。有些人见利忘义，为了自己的利益，罔顾公义，这样的人虽然一时得利，但迟早倒霉。小人呢？他不懂这个道理，所以，君子是没办法跟小人打交道的，只能远离。为什么？小人无所忌惮，他根本不知道他在作死，他根本不知道罔顾道义的后果。如果您跟小人在一起，亲近小人，则您就会引火烧身。所以，发现小人就要远离。


    # 一切事业，做人的根本，不过六个字：“亲贤臣，远小人”，则道在其中矣。


    各位，半部《论语》治天下。不仅仅要熟读《论语》，还应该作为家学传承，则您的家庭兴旺，事业发达。


    恭喜各位，您们能接触到儒家思想。


    我宣传儒家思想，传播中国文化的目的，是要我们整个民族兴旺，屹立于世界这个丛林。我不愿看到其他民族的文化碾压与伤害我们，所有传播中国文化的，都是以天下为己任，国家兴亡，匹夫有责。


    ![](img/9610da2262e4e91954d340aa3b2c568a_29_0.png)'
