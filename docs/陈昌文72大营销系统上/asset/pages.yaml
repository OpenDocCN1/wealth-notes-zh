    比如我们陈昌文老板社群，内部课程要讲好，讲到炉火纯青，目的很简单，讲透彻儒家思想，陈昌文方法 72 大营销系统，首先为我们自己已经有的学员做出巨大的贡献。对内部人有贡献，他们自然会去您的直播间，去看您的视频，去给您增加势能。您的视频、直播就会更火，更多的客户看到您的直播间案例反馈，视频下面的评论案例反馈，您的单子自然会越来越多。这就是一个近悦远来的过程。


