    有些人能自律几天，就放弃了。问他们为什么放弃？他们说，没什么变化，还不如和以前一样。别太心急，什么事情都有过程，生孩子还得十月怀胎呢。自律的人，一天看不出来，一个月也看不出来，3
    个月初见成效，一年呢？三年呢？十年呢？与那些不自律的人差距就拉开了。


    成功不是一朝一夕的事情。


    失败，也不是一朝一夕的事情。


    物有本末，事有终始，知所先后，则近道矣。


    大多数人是自律性太差，还不准别人说他，一说他，他就生气，就攻击您。富人，是自律性特别强的人。李嘉诚，每日 5 点 59 起床，一直都


