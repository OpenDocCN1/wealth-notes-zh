- pgno: 40
  md: '5 大锁定系统是成功模式非常非常重要的一环，就是锁定卖点过后，就不换了。不要觉得别人的卖点值钱，别人喊您，您就去干，您是非常愚蠢的。现在这个卖点看似不赚钱，但一直坚持，钱财自然就来了。要对自己的卖点有理想心，事业心，有信仰，这样才能走到最后。有志气的人，只有一个志向，没志气的人，他的志向非常多，而且不稳定，随时准备换。这些人都不是怎么聪明的人，积累好的东西，都丢了。


    我们要求的是让客户买单，我们只诉说我们的卖点，其他一切都是送的。用这个模式来做。当然我们送的东西也很有价值。比如，我们定位的就是企业家圈子，我们只做企业家的生意，对于付学费，无所谓的人来。这个要讲清楚，有言在先。麻烦，基本都是失败者带来的，成功者多是感恩、聪明、智慧的。


    所以，您要召唤谁，必须说清楚。


    您的每句话，都是对企业家有帮助的。


    真诚地讲课，做服务，帮助企业家。


    我们不讲废话，不搞笑，不哗众取宠，不讲反人类语言吸引非精准粉丝，我们只释放系列化的干货，也就是儒家思想，陈昌文方法 72 大营销系统。


    这样，我们相信真正的高手能看得懂。


    这就是锁定一个卖点。


    锁定一个卖点，就要锁定一套语言系统。卖点里面需要有语言系统。这个也相当重要。比如儒家思想是我们社群的核心文化，儒家思想就是一套语言系统，所有人，必须对陈昌文老板社群讲的儒家思想烂熟于心。


    那么，陈昌文方法 72 大营销系统，也是一套语言系统。无论讲师，还是来学习的老板们，也必须对陈昌文方法 72 大营销系统烂熟于心。然后是对应的召唤系统，比如，我们要召唤的就是年赚几百万，几千万的老板们。'
