  md: '# ## 感恩就能得到贵人帮助


    人毒辣了，高手就不跟您玩了。


    人不知道感恩了，高手就不会带您了。


    我的经验是，高手的智力比我高很多，如果我以为我能玩得动盘子，那是我在自欺欺人。


    最终我会失败，或者一夜回到解放前。


    人走到一定的时候，靠的是配合，小人物能牛 B，主要是感恩高手，跟着高手配合，牛 B 的人，总是能得到贵人帮助，主要是感恩，知道自己几斤几两。


    为什么很多人不翻身，主要是没有配合意识，没有感恩意识。什么都不懂，智力差，但是野心大，翅膀硬。这种人，毫无前途。


    为什么高手帮我？


    就是因为 我感恩、虔诚、老实，我要感恩、谦虚、低调，尊重高手。我蠢得很，我并没有什么特长，我就靠感恩，听话，老实活着，若是动歪脑筋，我就惨了。我就一事无成。


    少部分人能成功。大部分人一辈子不会成功。成功者，专注、聚焦，有耐力，懂感恩。不成功的人反着搞，您跟他说那么多干啥？还不如睡觉。


    **什么东西最值钱？高手的经验最值钱**。高手的经验，随随便便就能搞几百万，几千万。如果有高手在述说经验，或者用他的经验帮您，相当于送您钱。人生是一个寻找高手的过程。是一个配得起跟高手一起渔猎的修炼过程。


    ![](img/9610da2262e4e91954d340aa3b2c568a_263_0.png)'
