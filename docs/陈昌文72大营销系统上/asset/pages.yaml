  md: '# 第十章


    陈昌文方法72 大营销系统之图片系统


    > “无图无真相，有图才成交。”——陈昌文'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 创业者的图片系统为什么重要？


    任何人，真的想成交率变高，必须做图片营销系统。

    朋友圈，必须要有生活照、工作照片、工作笔记照片。

    朋友圈，必须要有-切与您生活，与您工作，与您业务相关的照片。

    每天必须摘够 36 张，如果没有图片，就没有说服力。

    没有说服力，就很难成交。


    无图无真相，移动互联网时代，大家希望在微信、QQ 空间里，看见您的图片。图片多了，才能增加信任感，客户才能下单。我要求每个做微信，QQ 空间，以及微博的人，每天上
    36 张图片。

    图片上一定要有一句话广告，也就是推销自己的产品或服务，价格以及付款方式。


    # 图片包含哪些内容？


    那么到底上些什么图片呢？

    生活图片，吃饭、游泳、健身、买衣服，带孩子，逛街，喝咖啡，随时随地都在扔图片。无图无真相，有图才成交。喝水，您的杯子、您的电脑、您的手机、您的床，您的工作环境、过路的地方，全部都是图片系统的一环，您看到的花草鱼虫，都是您的营销图片。


