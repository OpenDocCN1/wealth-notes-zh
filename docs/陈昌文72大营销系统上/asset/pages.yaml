    态度问题。很多人做营销的时候，本身就是一种推销的心态，总是想把东西推给别人，满脑子想的都是你快买，买，买，满脑子想的是钱，而不是真正的站在客户的角度想着，我这个东西能帮助你什么，你为什么需要它？


    没有人想被推销，你走在街上，很多时候，别人硬塞给你一种传单，你心里一定是厌烦的，这个在微信上也是一样的。


    更重要的是，当你有这种心态的时候，你一定是弱能量的，也就是所谓的低价值，因为你是被动的，主动权在别人手里。


