- pgno: 152
  md: '# ## 复制、改编、优化


    人的语言系统，面相，都来自于自己的起心动念。


    这人，有很多人是聪明人，但是心态不对，不理解虔诚、老实、感恩，尊师重道，理解不了服从，听话、照做、执行。理解不了复制、改编、优化。这人啊，就不好交流，也就是交流了也是白交流。


    真正的赚钱模式，就是复制、改编、优化模式。真正的赚钱模式是直接贩卖知识。贩卖知识，才能赚钱。


    人生并不需要学多少。要相信市场，相信自己。商人不过是搬运行，企业家呢，需要创新+营销。最大的利润点是创新，最好做的创新是微创新。不要搞颠覆式创新，周鸿祎说过，我们就搞微创新。做一个现实主义者，能用就行，能立刻变现就行。赚钱的核心，是立刻行动。拿着别人的东西来创新。


    复制。谁赚钱，复制谁，一切模式全面复制，复制广告，复制视频、直播、话术、朋友圈、音频。复制他的一切，动作、神态、穿着、逼格，全面复制，高大上的复制。


    改编。在复制的基础上，进行改编，改编成自己的话术、语言体系、风格，这样您就有了创新，别人就不告您了。改编的本质，就是想要区别于别人，但您智力不够，就不赚钱。真正的高手，述而不作，信而好古，懂得改编与杂交的技术。所以，真正的高手，是全面复制、杂交。


