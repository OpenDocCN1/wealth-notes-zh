- pgno: 297
  md: '# 万物皆有能量，有大有小，有正有负


    万物皆有能量，有大有小，有正有负。


    人当然也是有能量的。您当然也是 有能量的人，您跟负能量的人接触，负能量的人就会吸食您的能量。您跟正能量的人接触，正能量的人就会给予您能量。


    高手交往、交易，是相互给予力量。


    我们做生意，就是必须找到比自己能量高的人去服务，时刻提醒自己，必须给人鼓励，给人善意，给人温暖，有耐心的去服务人。


    愚蠢的人做生意，不看这个点，只管要钱，岂不知道，有些人不对，他的能量是负的，虽然他有銭，但是您要了他的钱过后，他会纠缠您，会传播您的负面，造谣您，您看似赚钱了，实际上，赚了很多负能量到您身上。


    在这个模式下，您其实是亏本了，属于严重亏损。拿自己的能量去换钱是非常非常划不来的。


    一个只会看钱的商人，不是一个合格的商人，甚至可以说道是一个失败的商人。一个真正聪明的商人会看背后的能量涌动。


    当我们做了一个正能量，一个善良的人，一个好人的生意的时候，我们的能量会被放大，同时我们的客户的能量也会放大，这是相互帮助的事情，双赢的事情，这才是我们应该的选择。


    所以，各位做生意的时候，首先要判断这个人是正能量，还是负能量。如果此人是负能量，我们就坚决不做他的生意。'
