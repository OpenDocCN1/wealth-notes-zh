- pgno: 223
  md: '# ## 从一而终


    跟一个人，就彻底的跟。无论对错，无论您现在理解不理解。别人牛B，就是牛B，老老实实跟随。老老实实听话、照做、执行。人啊，越老实，越有前途。盲目迷信，崇拜，选好了，就跟着。人生最讨厌的是一会儿怀疑，一会儿相信，到哪儿都没朋友，没事业。如果您自己觉得自己顶尖聪明，喜欢反水。您这种人，人见人恨，还搞个毛的事业。


    老天爷喜欢老实人，喜欢憨人。不信？您看看，很多成功的人，其实都是老实人。


    人必须从一而终，做一件事，做一个环节，做一个项目，日日不断地干。总是换老师，换项目，换人，您不疯，跟您的人也会疯掉。


    人总是要定位，定位精准，持续玩下去，才会有结果。我不过是理解了持续的力量而已。很多人，开始跟我们同行，走不了几个月，或者，几年，他就放弃了。我见过太多放弃的穷人，他们生活艰难。但当您告诉他，要从一而终，带着他一直在一个项目上拼杀，说这样，可以有成绩的时候。他们就开始骂您是骗子了。没办法，可怜之人，必有可恨之处。


    人只能从一而终。选好一个环节，就一直弄。大部分人都差不多，大部分项目都差不多。就看谁能坚持。一个项目有没有利润？是看您能不能长期做精，做透彻。不是您换项目快。行行出状元，您无能，您就认为项目无能。


    要锁定一个项目，锁定一个环节，无论天晴下雨，都不要有情绪。无论谁打击您，您都一直干。从一而终，师从一个老师，做一个项目，搞透彻一个环节。经常换老公的女人，能幸福，是小概率事件。没有多少人愿'
