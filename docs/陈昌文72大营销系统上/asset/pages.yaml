    人要的是简单，简单的一个卖点，唯一的一个卖点，可以卖一辈子，而且是合法的卖。人最怕的是到处换项目。换项目，就没有复利效应，没有积累，也不好做矩阵。而只做一件唯一的事情，比如，我们社群，只卖儒家思想，卖陈文方方法72大营销系统，陈昌文老板社群，就只卖这个东西，不贪图其他任何多余的东西。我们只搞干货，系列化，也就是我们是专门卖儒家思想，卖陈文方方法72大营销系统的。我们不哗众取宠，我们的一切语言系统，都是我们自己的，是我们自己的东西。我们不需要在外面去抄袭，改编别人的，我们自己的72大营销系统，以及儒家思想就够厉害了。


    能不能把我们自己的东西卖好？内求，而不是外求。我们足够强大，做好我们自己的事情。只为老板服务，这是唯一性。我们只服务我们的客户，我们只讲对我们客户有好处的事情。


    人的贫穷，大概都是贪婪，总是喜新厌旧，总是喜欢创新，总是以为其他项目更好。总是想换。自己拥有的已经很多了。自己这块资源耕耘好，就能产生很大的效益了。


