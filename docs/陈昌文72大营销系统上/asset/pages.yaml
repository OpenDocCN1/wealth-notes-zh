  md: '的。


    所谓：“善用兵者，求之于势，不责于人。”就是最高明的将领、将军，永远是取势。人力显得非常可笑。您若聪明，您就会发现，世间所有高手，不过都是取势尔。


    我其实已经告诉您势在哪里了。如果您还不明白，我就推荐您些书籍。中国人的文化基因、文化血液是什么？不过四书五经而已。不过各种传统书籍而已。不过诸子百家、儒佛道而已。这些东西，就是中国人的文化基因，融入到中国人的血液当中了。


    易中天品《三国》能火，于丹读《论语》会火。那么，易中天品《多麻辣星座》会火吗？于丹读《母牛瞧星球》会火吗？不会火的，或者说，很难火，为什么？因为，这些东西，没有历史原型，没有被传颂千年。


    真正的话术是什么？不过是历史故事、谚语、俗语、诗词歌赋、圣人言行。然后把这些融入到您自己身上，晒给别人看，就自动成交了。


    都不需要跟客户多说啥，就自动赚钱了。我的势是什么？ 儒家思想，《论语》而已。


    中国所有出名的歌曲，厉害的东西，大部分来自于古典文化。所有的演讲，所有的文案、文章，想要厉害，一定要穿插古典文化，或者有古典文化的影子。只有古典文化，才是文化母体，才是传播学的根基。


