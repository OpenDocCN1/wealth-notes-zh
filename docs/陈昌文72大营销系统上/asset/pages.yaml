- pgno: 348
  md: '收的徒弟多，影响力才会大，您的观念传播的越广，您的影响力越大。所以，您要不断地帮助人，不断地传播您的观念。只关心自己的人，不可能有大的影响力。您设计的商业模式是要辐射到更多的人，才会有巨大的影响力。


    影响力是一天天积累起来的，您每天都要发点图片、视频、文案，让人看到您的观点。如果您不发，则人们遗忘您，就没有什么影响力了。而且，发的东西最好是一个方向的，不要发很多方向的东西。聚焦才有影响力。日积月累，大家认识您了，认可您了，赞同了您的价值观，最后学习您的价值观，您就有了影响力。


    # 唯一性是打造影响力的核心


    唯一性是打造影响力的核心。只有唯一的东西大家才会珍惜，才会找您，所以，我们想要有不可替代的影响力，就要从唯一性方面下手，全面唯一化，只讲唯一性，不可复制性。如果别人能复制我们，要我们还有什么用？


    聚焦才有影响力。您只做一件事，做到极致，慢慢的大家都知道您是干这个的，也只有您干得好，您就具有了行业影响力，专业影响力，在这方面，您说了算，大家都听您的，您就把自己打造成一个有影响力的人了。


