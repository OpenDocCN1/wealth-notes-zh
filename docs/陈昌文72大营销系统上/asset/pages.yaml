- pgno: 228
  md: '人被淘汰了，说明他不适合这个社会，说明他懒惰。真正努力的人，不会被淘汰。


    日日不断必须跟 5 大锁定系统结合起来。锁定一个平台，一个卖点，一个团队，一群干，一个老师。日日弄，从一而终。其实这个世界上，做什么项目，都能做起来，什么卖点都能赚钱。不过就是看您会不会营销，有没有日日不断地精神。


    一个人没有执行力，就说明什么也不会。懂道理的真相是执行。也就是知行合一。否则，您看我写的日日不断营销系统也没意义，因为您不执行。


    您的任务是什么？把日日不断系统融入到自己的工作中。日日不断地重复一个卖点，且把日日不断营销系统融入血液。


    # # 事业是马拉松


    任何成功，都是日日不断，细水长流。事业是马拉松，不是短跑，短期的奔跑没什么了不起，长期保持一定速度的奔跑才了不起。营销也是如此。


    您必须日日更新 36 个朋友圈，以及 36 个广告尾巴循环系统。不要以为朋友圈没人看，始终有人去看。您必须日日坚持直播，内部、外部的坚持，不要因为任何事丢下，有时候，确实有困难，就少讲几分钟，但必须要讲。'
