- pgno: 115
  md: '记，但每天要写点有感悟的事，或对某事的感悟，偶尔发一张吃面条的照片可以，多发就有毛病了。内涵与气场相对欠缺的，多费点心做朋友圈是合适的。


    还有要专业化内容，体现您的专业度，比如用软文体现您是一个叫座的人；最后就是硬广，适当的硬广也是必须的，要不然别人不知道您卖啥，每天都要有硬广，长期坚持，别人才知道您是卖什么的。社交电商的核心，就是信任感，长期做。


    朋友圈怪异，朋友圈不高大上，头像怪异。这是你们很多人不赚钱的核心。


