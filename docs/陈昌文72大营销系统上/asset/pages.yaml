    我只搞圣人言论，传统文化言论。其他东西，我不想搞。我的主体思想，就是中国传统圣人言论，我把这些写成解释，做成视频、音频、文章，然后传播。


    **中国文化的精髓，在于您学了，马上能用，而且能解决问题。**何为解决问题？就是您照着儒家思想去做，您的生活、工作、家庭，都会变得越来越好。不信？您试一试，文化能给人魅力。


    《易经》中说：“人能弘道，非道弘人。”我当然不敢反驳。但是，当我们进入到古文的世界，我们照着念，照着读，我们的魅力就增加了几倍、几十倍。而我们去搞其他东西，比如现代歌曲、现代散文，是没有那么大的魅力的。'
