  md: '# 第二十一章


    陈昌文方法72大营销系统之尊重人系统


    > 尊重人，让您发家致富。——陈昌文'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# 尊重别人，其实是爱自己


    任何时候，都要尊重人。尊重人不是为了别人，而是为了自己。素质教育，是为了自己。您的素质越高，您自己受到的伤害就越少。大多数人以为，尊重人是对别人的愉悦，其实，是对自己有利啊。


    人性是需要您尊重他的，不要鞭打别人。而是尊重别人。


    夫子循循善诱之。


    一定要学会尊重人。对任何人，都使用尊称。也就是您，您好，祝福您，这种模式。对方哪怕是个白痴、坏蛋，也要对这种人有耐心，尊重。如果您境界高，还可以如佛祖一般的感化他。


    接受任何人的侮辱，骚扰，以及谩骂，以微笑面对一切。凡是跟我学的人，做生意的人，都要学会这一个系统。尊重人系统，是我新开发的系统。此系统，会让您们大道平坦，会让您们风调雨顺，会让您们一辈子安居乐业。


    不要战争，要有爱。这个爱，不是爱别人，而是爱自己。任何情况下，都要尊重人，哪怕是敌人。这样，尊重敌人，就是尊重自己。不尊重敌人，就是不尊重自己。一个人如果欺骗了我们，侮辱了我们，坑害了我们，我们依然尊重他。我们的时间是用来强大自己，而不是用来扯皮的。


    我们付出金钱、精力，只为了聚焦自己的业务，聚焦自己的粉丝，聚焦自己的环节，不断地出单。出单才能壮大我们，其他的事情，都没什么意义。


    我们用尊重人的词语、符号，武装自己，用来尊重每一个人。'
  merge: -1
  img_proc: true
- pgno: 238
  md: '# 如何与客户交流？


    +   1. 任何情况下，只讲正能量的话。

    2. 任何情况下，只讲好话。

    3. 不要辱骂人，不要批评人。

    4. 任何情况下，都尊重人，都用尊重别人的符号，比如：“您”。

    5. 不断地鼓励人，不断地帮助人，不要情绪化。

    6. 万不得已情绪化，也只帮人。只讲好话，尊重人。


    如果您尊重我这 6 条建议，您的路越走越宽。您会发大财。


    我以前做生意，天天在网络上骂人。经常辱骂客户，老是觉得客户愚蠢，老是觉得我聪明，我是对的，经常教育客户，树敌无数，很多人都想捣我。我现在做生意，见谁都是尊重、尊敬，客气客气，就算客户故意找我麻烦，我依然客气客气，对谁都特别尊敬。


    有一次，有一个客户来找我麻烦。对我辱骂，我依然客气客气，尊重他。结果，他自己不好意思了。连连给我道歉，语气也软下去了。


    在网络上，有人骂您，您不要不开心，话语犹如刀剑。您可以心随境转，也可以境随心转。我们修道，不就是我们修心转？所谓人定胜天，心外无物，就是这个道理。


    在外面呢，无论是网络上，还是线下，都不要乱讲话。这个时代，越来越猛了。乱讲话的后果，是您的声音被人到处宣传，您的照片被人到处宣传，您就毁灭了。


    做人只尊重人，只讲好话，只客气客气，别给自己造孽。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '永远尊重人，即便这个人是个垃圾，老是黑您，拆您的台，您也要尊重他。我为什么用“您”字？就是时时刻刻提醒我，我要尊重任何人。我为什么要修炼这个品质？是因为我吃过亏，上过当，还有的原因是误会，其实，很多人本来是跟您一伙的，您不尊重他，他就变成另一伙的了。


    所以，时时刻刻，都要尊重人。对任何人，都要尊重，对仇人、坏蛋、可恶的歹毒的人，都要尊重。无敌于天下的本质，就是无敌于人。我不与人结仇。任何人都是我的朋友与老师。


    在外面做人要低调，要尊重人，任何人都要尊重，莫要与人发生冲突。别讲道理。您有您的道理，他有他的道理。道理最后，就是比较量力。人啊，低调点好。多赚钱，做微项目，盯着自己的事业。


    对人客气。人不分三六九等，都要客客气气，对滴滴司机、餐厅服务员、公司保洁，都要礼貌恭敬。见谁，都尊重，都极度尊重，有耐心，这不是为了尊重别人，而是为了自己。


    此法为佛祖修炼法，为尊重人系统，用来行走在险恶的江湖。敬人者，人恒敬之。


    找我们麻烦，我们依然和颜悦色。他强由他强，清风拂山岗，他横由他横，明月照大江。不惹事，不激怒任何人。做好免责声明。谦虚、谨慎、极度低调。在这个基础上，做好自己的本分工作。


    ![](img/9610da2262e4e91954d340aa3b2c568a_239_0.png)


    # 和气生财


    和气生财，尊重人系统，绝对是非常犀利的为人处世，做生意的方法。'
  merge: -1
  img_proc: true
- pgno: 240
  md: '不要得罪任何人，对任何人都尊称。对任何人都有耐心，对任何人都帮助，对任何人都要礼貌，要表现在文字里，语音里，视频里，表现在行为上，语气里，以及标点符号里，以及表情里。


    尊重老师，尊重客户，尊重粉丝，会做人。做到让接触到我们的任何人，心服口服，则盈利容易啊。


    对任何人，我们都要尊重礼貌，不要说废话。有些大人物不喜欢开玩笑。**人与人之间，还是清如水的好。少说话，多干活。**


    只说让大家开心的话，只说好话，不说人坏话。无论别人如何侮辱您，逗您生气，糟蹋您，也尊重他。不要谩骂客户，任何人不得谩骂人。如果碰见恶心的、歹毒的、可恶的人，依旧尊重，但悄然离去。


    如果这个尊重人系统学不会。您就不配跟我学习，不配加入我的社群，不配跟我一起合作。您不配，您连尊重人系统都做不到。这系统做到了，必成大器。


    **如果您想大富大贵，必须修炼儒家思想，必须极度尊重人，必须谦虚到极致。** 否则，没前途的，真的，没什么前途的。就算您非常努力，非常拼命，也懂很多道理，有能力，有技巧，也只能小富，绝对没办法大富大贵。大富大贵的唯一出路，必须修炼好我上面说的几点。少一点，都毫无出路。


    我这个人，素质不够。有时候，心里不舒服，就容易得罪人。其实别人差，跟我没关系，我没必要指出来。对任何人，都是尊重，对任何人都说好话。别人想干啥，是别人的自由。我们就踏踏实实做好自己的事情就行了。


    做生意，真的是和气生财。这几个字吧，少有人能读懂，更少有人能践行。虽然，就是四个字：“和气生财”。


    尊 重 人 系 统'
  merge: -1
  img_proc: true
- pgno: 241
  md: '+   尊重人系统


    李嘉诚说“人情才是大学问，世情才是大学问。”人与人的关系、情绪、感情，别人为什么喜欢您？这些才是学问。其他的学问，跟这个比，差太远了。


    我觉得，每一个人只要学会尊重人，尊敬人，谦虚谨慎，就能过好这一生。我这段话，足够让很多人发家致富，我希望大家都这样做。


    尊重人，用尊称，谦虚谨慎。得人心，比赚钱更重要。活到一定年纪，我们才能明白，赚钱是一种修养，是素质问题。年轻的时候，以为努力就行了，不然。所以我开发了尊重人系统，见谁都尊重，极度谦虚，谨慎，对任何人使用尊称。如果您非常讨厌这个人，不说话即可，但一说话，一交流，还是必须尊重他。


    尊师重道，养成习惯。您可以先拿我当靶子练习，对不对？我教您，也帮您商业方面的老师，创业方面的老师，您先尝试着尊重我，进而尊重所有人。能尊重人，您就能多赚钱。


    和气生财，不是乱讲的。要爱自己的客户。传递正能量，价值观要正，传播儒家思想。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 第二十二章


    陈昌文方法72大营销系统之尊师重道系统


    发家秘籍就是尊师重道。——陈昌文'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # 一定要尊重强者


    **赚钱，不过是跟高手碰撞而已；赚钱，不过是跟着高手干活而已；赚钱，不过是跟着高手布局而已。**


    对人一定要尊重；对老师一定要尊重；一定要尊重强者。强者说什么，就是什么。要老老实实的跟随，这样才有前途。


    必须尊重老师，老师套路多，方法多；老师见识广，认识的牛人多。尊重老师，才能合作，才能学习，才能进步。不尊重老师，瞧不起老师，老师就不带我们玩了，不带我们玩，我们就一无所有了。


    **要深刻的认识到，我们的成功是靠老师。**


    **用师者王，用友者霸，用徒者亡。**


    这世界上，有些人是超级高手，一定要尊重超级高手。跟着超级高手学习，干活赚钱。


    国学，要求我们极度的尊师重道；国学，要求我们老老实实的做人；国学，要求我们做到感恩。做到这些的人，这辈子，都能过得好。


    尊师重道，是国学思维。您不尊重老师，不尊重别人，您碰到厉害的人，也学不会，您这一生也好不到哪里去。人要虔诚，要老实，要感恩，要跪着学，才能学会。


    但是大多数人都认为自己牛B，眼睛往天上盯着，轻浮傲慢，这样，学啥都学不会。


    这个世界上贵人、牛人很多，为什么没人帮您，您也啥都学不到？多反思反思自己的态度问题，您真的尊重老师吗？'
  merge: -1
  img_proc: true
- pgno: 244
  md: '有个哥们，拜了一个老师，付费很多，然后学了东西，就开始骂老师。结果那个老师有很多压箱底的功夫都没传给他。


    还有一个兄弟呢，人品好，态度好，做人到位，认为拜了老师，交学费是应该的，诚诚恳恳，听话，不怀疑，跟着老师学。结果，老师又帮他学会了更多的东西。


    做人，永远记住别人的恩情，忘记一切仇恨。有时候，仇恨是不存在的，是您自以为是，是一种假象。不要被负面人物忽悠，负面人物可恶，断人慧命。您认为这个世界是如何的，这个世界，就是如何的。


    跟不同的老师，就会学出来不同派系的本事。要对老师尊重，不要瞧不起老师，不要觉得老师没本事。


    我自己拜老师也是这样。不要觉得老师只有一点点本事，您没耐心，就学不到真本事。很多人跟老师学习，还得罪老师，还成为仇人，这是最愚蠢的行为。


    一般，您老老实实跟一个老师学习，诚恳，诚实，您都会学到非常多的东西。


    跟一个老师学，就老老实实跟着一个老师学。尊重老师，不要诋毁老师。老师教您的东西，会越来越多。做人要正直，有些人，做人恶毒。学了一点，就开始到处诋毁别人。这是不对的，还到处宣传老师是坏人，这就更可恶。


    我拜老师，就非常老实，我绝对不诋毁老师，就是诚心诚意的跟着老师学习，实践。我相信精诚所至，金石为开。我相信人品好，就会有未来。一个人道德素质是非常重要的。道德素质过关了，再谈赚钱。


    尊师重道，天地君亲师。


    网络上午 B 的人非常多，不要到处拜老师，拜一个午 B 老师，跟着'
  merge: -1
  img_proc: true
- pgno: 245
  md: '学一辈子，就行了。


    有道德标准的人，都是强者，一个有道德的人，就是人品好的人，就是素质高的人。这样的人，就是仁义礼智信，就是君子、大人，想弱都弱不了。


    凡是尊重道德的人，就是尊重规律的人，必定顶天立地。


    # 创业，一定要有老师


    想要创业，一定要拜老师，不然您会走很多弯路。您以为我在说服您付费？其实不是的。有付费意识的人比无付费意识的人聪明很多。


    我自己给老师的学费是十几万、十几万的分交。您以为我傻？扔那么多钱出去？其实不是的。我扔出去的钱，会加倍回来。


    有些人非常有实力，人家在帮您，您就老老实实的跟着别人做事，学习，可不要找事。可不要以为自己非常牛 B。认认真真，老老实实的干吧。只要您极度认真，您的机会就会非常多。


    我读书的时候，拜了很多老师，没什么用。他们自己都很穷，不过他们人很好。


    我混社会的时候，拜了一个老师，千万富翁。他直接教我赚钱，我虽然也付出了高昂的学费，而且是多次。但是我的收益明显增加了 很多。后来，我又拜了一个老师，付出了几
    万学费，非常大的一笔数字。他也是真心教我。我一直潜伏着跟他学习，没有告诉他，其实自己也能赚点小钱，对普通人来讲，也不少了。他从某种程度上，认为我就是一个屌丝，'
  merge: -1
  img_proc: true
- pgno: 246
  md: '我不在意别人的看法，我只想通过拜这个老师，学到真本事，我也不在意付出学费，因为我知道，会几百倍，几千倍的赚回来。因为，他确实有本事，也在耐心教导我一些经商、赚钱的心得。


    我这个人是非常谦虚，也非常尊重他的。于是，这个老师，教授了我很多他不愿意教别的弟子的东西。


    我这个人好像在哪里，都能得到老师的厚爱？为什么？不过是我非常尊重老师，也愿意给钱，发红包，也愿意听话而已。


    不过，我自己教的学员当中，就有些刺头了。对于这些不尊重我的刺头，我也是不愿意教他们真功夫的。有牛B的老师扶持，人生进步是非常快的。所以，在老师面前，一定要低调，一定要老实，一定要装好孙子。其实不是装孙子，而是一日为师，终身为父。


    老师、师父，给了我饭碗，真的，是我的再生父母。我的衣食住行，就是靠着老师的经验、项目，恩赐给我的。如果我还不打心底里尊重老师，我跟畜生有什么区别？


    # 尊师重道是国学中最重要的文化


    我能有今天，全靠我绝对尊重老师，贵人扶持我，我才有今天，我要一如既往的尊师重道，唯有尊师重道，我才能多赚钱，才能有未来，欺师灭祖，是不好的，我绝对不做奸诈小人。老师教会了我太多，我感恩老师。


    不虔诚，感恩，尊师重道，不老实的人，很难赚到钱，因为他会自以为是，他会觉得他聪明。有些人的性格，精神状态，注定他是贫穷者。'
  merge: -1
  img_proc: true
- pgno: 247
  md: '这里赚到钱的，不断地提升自己的收入的，全部是那种老老实实的人，全部是那种感恩，尊师重道，虔诚的老实人。基本无一例外。有些人特别聪明，但是，人性缺失，导致其起不来，看着都可惜。


    要感谢老师，尊师重道，尊重别人，有人提携我，我混到今天，我自己没什么大本事，就靠做人到位，如果哪天我做人不到位了，我就死翘翘了。


    尊师重道是国学中最重要的文化，我必须尊重我的老师，必须尊师重道。老师给了我太多的东西，我不能贪心，不能有其他心思。做人要有良心，要感恩，才能走得长远。欺师灭祖，是恶毒的。


    尊重老师，才有前途，不要怀疑老师，不要不信任老师，不要乱猜，乱整，猜想别人是小人。别人有别人的难处。人无千日好，花无百日红。老师教我的太多。任何时候，必须尊重，尊师重道，就是国学思维。欺师灭祖，就是小人思维。


    人一辈子，能跟一个牛B的好老师，都是祖坟冒青烟。


    老老实实尊师重道，老老老实尊重老师。老老实实跟老师混，老老老实听话、照做、执行，谦虚，低调，尊重人，仪式化，这才是高手，否则，这个人会倒霉，且无前途。


    一定要向已经将钱赚到手的人学习，而不是向那些口吐莲花，巧舌如簧的，但很穷的所谓的老师学习！


    赚钱的人，都是极度耐心，认认真真跟着一个老师死磕。认真分析，执行老师说了啥，然后不断地工作，工作，还是工作。如此，就有政绩。否则，就生活非常惨淡。


    人必须尊师重道，您才能学到东西，才能执行好。一个人没有尊师


    ![](img/9610da2262e4e91954d340aa3b2c568a_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '重道的精神，内心不谦虚，傲慢，学习是怀疑的，这个人，就什么也学不进去。什么也学不进去，就会认为世界上就他聪明，他就不会进步。用师者王，您必须尊师重道，谦虚，低调，然后努力工作。


    我必须极度尊重老师。不尊重老师的人没有出息，我全靠老师们扶持。没有老师，我就没有现在的一切。


    养成退散的思维，养成道德素质高的思维，养成尊重老师的思维，绝对尊重，才能获得财富，否则一无所有。


    比如，我的语录，做成视频、直播，也能赚很多钱。只是为什么没人这样去做？能放下身段、面子去赚钱的人，去尊重老师的人没几个。这就是大多数人没前途的原因。


    我在大学的时候，见一上海老头牛B，我就弯腰下去给他洗脚了。


    他带我看见了很多跟他一辈的牛人，见人就说，我是他孙子，他连自己的孙子都不带，就带我在外面逛，您们想想吧。这或许就是人与人的差距。您连这个都理解不了，哪里能理解，五世韩相之后的张良，愿意给黄石公捡鞋子，穿鞋子了，而且是跪着。多学学吧。


    **德行长一分，能力百倍。**


    **尊重老师不是表面上尊重，尊师重道是发自内心的。尊师重道，发自内心，体现在行为上，您一生顺利，否则，您这个营销，太难了。**


    有老师教育就是好。老师聪明，有经验，跟着老师混，学会了，就无敌了。然后，就厉害了。


    谦虚跟着老师混。老师思维无敌，团队好，经验好，就是要跟着老师混。老老实实跟着老师干活。老师比我厉害，比我思维聪明。老师社会关系厉害，团队厉害，跟着老师混，我就能吃肉。做人要谦虚，要学会喝汤。不说老师坏话，老师非常厉害。老师什么都懂，不能在老师面前骄傲。


    ![](img/9610da2262e4e91954d340aa3b2c568a_248_0.png)'
  merge: -1
  img_proc: true
- pgno: 249
  md: '老师非常好，老师道德素质高，老师赚钱厉害，老师有营销套路，老师无敌的，要跟着老师干。


    千万不要看不起老师。老师是赚钱高手，老师比我厉害，我不在老师面前装，我的收入、经历、财富都没老师高。老师的德行比我好。我要跟着老师混。不要骗老师。老师心里非常清楚，老师比我高明。老师身价比我高，比我会玩。我就是要跟着老师干。


    老师厉害，老师为什么厉害？老师做大项目，有精力，会管理团队，什么都懂。对国学，对人性，对营销都懂。碰到这样的老师，就好比跟着学，多沉默，别在老师面前装。


    老师帮了我很多，给予了我很多。我不应该小肚鸡肠，我不应该找事，我不应该拖后腿，我就是要跟老师好好干，好好混，尊重老师。老师走路多，有经验，我好不容易抓住一个老师。我要好好跟着混，跟着学。


    # 学习，首先是信服老师


    做人要尊重老师。连老师都不尊重，是个什么玩意？我觉得我就是蠢，全靠老师扶持我。老师不扶持我，我的收入就低。我没有办法提升自己的收入，我的收入全靠老师提升。所以我要老老实实的跟着老师混。


    要对老师尊重，要对强者尊重，要谦虚、低调、沉默，不要装。多想想别人的付出，不要小肚鸡肠，不要给高手、老师添堵，好好跟着老师学，跟着老师干，干出成绩。


    对比自己厉害的人要尊重。对比自己厉害的人不尊重是愚蠢的行为。'
  merge: -1
  img_proc: true
- pgno: 250
  md: '我的老师，就非常厉害，营销手段非常先进，思维模式深，比我有本事。我必须谦虚，谨慎的听他的话。不断地前进，不要飘了。别人对我好，我就飘，真是人性的弱点。我必须在行为上，语言上，心里里，都心服口服，听话、照做、执行。


    学习，首先是信服老师。您必须相信老师说的是对的，您才能努力学习，深入学习。您必须执行老师要求您要执行的东西，您若不信，您执行就难以到位。您必须坚持执行，如果您不是彻底信服，您干一会，就不愿意干了，您可能学懂，学到老师的精髓。


    如果您不愿息信服这个老师，您就别跟着学。现在很多人无知，没什么能力、本事，跟谁学，都怀疑。这样的人，毫无前途。您去找一个能让您信服的老师，好好学，您就有前途。动不动就怀疑，质疑，自以为聪明，实际上愚蠢透顶。


    要想成功，您绝对要相信老师，跟着老师学，而且只能跟一个老师，绝对不允许跟几个老师。因为每个老师的道不一样。而且，您不能换，一辈子学到死，就在这条道上。如果您不相信老师，您就别学，您去找您相信的学。不相信还要学，您就心神不定。如果您喜欢跳来跳去，就会变成跳梁小丑，一事无成。


    发家致富的秘密，就是尊师重道，跟着老师做，跟着老师学。找到一个牛人，他也愿意教您，您就好好上道，即可。但是，现代社会，很多人都是急性子。尊师重道，早就忘记了。我们也不跟这些人交流。我们只与君子交往，只与善良的人交往，不与恶人交往。我们做任何项目，都是免责声明，不是完全认可我们的，都不要搭理我们。


    这传统文化，您莫要反对。有个家伙，就不尊师重道，自己跑出去开了专场，混得咋样了？还天天辱骂老师。结果呢？成了整个互联网的辱骂'
  merge: -1
  img_proc: true
- pgno: 251
  md: '对象。这人啊，要知道自己几斤几两。莫要对着自己的老师，教会自己吃饭的家伙的人下刀子啊。


    # 做人，要学会跟随强者


    尊重人是一种修养，要好好的尊重人。尊重人的人，才会有前途。要修炼儒家思想，安身立命。要踏踏实实的大道至简，知行合一，而且要尊师重道。只有尊师重道的人有前途。对老师不尊重的人也没什么前途。这些系统，我们都要修炼，都要深入骨髓。我们的人生就会越来越好。


    高手都知道自己是蠢货，需要谦虚，谨慎跟着更厉害的人学习，跪着学习，不是装孙子，而是真孙子。低手、掉货，没什么能力的人，就是有骨气，就是觉得自己厉害，谁也看不起，不愿意学，您让他态度好点，那是不可能的。


    所以，谦虚比什么都重要，德行比什么都重要，儒家思想比什么都重要，先学做人，先修德，再说做事赚钱。不老老实实学习，不尊师重道，一上来就发脾气，连起码的尊师重道都做不到，还枉谈发展？


    只要别人比您聪明，您就听话、照做、执行。要想起自己多蠢，要找到牛人老老实实跟随趟，不要鄙视牛人。不要觉得自己付出的几个钱太多，实际上，您自己去摸索，几百万、几千万，不一定做得出来。别人带您，看似别人赚钱了。实际上，最赚的是您自己。这个尊师重道系统理解不了，这个人就没什么前途。很多人特别“二”，自己没本事，'
  merge: -1
