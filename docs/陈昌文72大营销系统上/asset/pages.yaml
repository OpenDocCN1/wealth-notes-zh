- pgno: 36
  md: '# 锁定系统，信仰是前提


    要做到锁定，要有信仰，有感恩之心。虔诚、老实，尊师重道才能做到。


    想做好锁定系统，要做好人。一个人没有信仰，一辈子理解不了锁定系统。有了信仰，才能理解什么是锁定系统。


    # 锁定系统是成就大事的基础


    一个人首先得理解，一条道走到黑，黑了走到亮才会成功。


    一个人在做事的时候，会怀疑人生，会觉得什么什么不好，然后就喜欢换。


    《易经》讲：“动辄得咎”，就是说我们选好了轨道、方向，不要乱动，动就会出问题。


    首先讲讲刘邦，刘邦开始立志建立新王朝，就一直立志，从来没有想过要投降。投降就是死，这就是一条道走到黑，黑了走到亮的系统。


    刘邦用人，萧何是他们县里的，后来当了丞相。


    樊哙是他们县里杀猪的。


    夏侯婴、曹参这些人，都是他们乡里的。


    卢绾这些人，都是刘邦的发小。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '朱元璋也是如此，李善长、徐达、常遇春，都是他的同乡。然后一起打江山，从来都是不离不弃的。一起奋斗，从来都没有谁投降过。一直都在一起，无论好与坏，大家都在一起。无论沟与坎，大家都在一起，都有一个共同的目标，一个共同的平台，相互辅助，目标锁定，人群锁定，老师锁定，平台锁定，同事锁定。


    当然，现代我们熟悉的互联网大佬也是如此，锁定了电商这个项目，一搞就是十几年。锁定了自己的同学、同事，就一直带着这些人。中间走偏了，曾经抛弃过自己的人，后来又拉回来了。一条道走到黑，黑了又走到亮，必须把这个项目给搞起来。


    锁定玩法，这个比较深了，就是锁定同事，锁定一群人。很多人会说，我这些人不行啊，怎么锁定？错误！稻盛和大也没说自己的同事不行。这些人慢慢培养，一直在这个道上走，迟早会成为专家，只是早晚的事情，大家的智力都差不多，就是不会差太远。所以，锁定一群人很重要。




    # 5 大锁定系统内容


    我们来讲讲 5 大锁定系统，历史上成功的人大多用了 5 大锁定系统。


    +   1、锁定一个平台，一个目的。


    比如，我们做一个项目，我们选好了一个平台，我们做一个社群。我们就一直干这个，绝对不换！不换平台，因为您换了平台，到其他平台上照样面对很多问题，照样有可能不爽，照样有人情世故，有江湖情仇。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '所谓衣不如新，人不如故。您还不如弄以前的平台，以前的目的，以

    前的项目。我们在一个平台上弄，无论是社群内部平台，还是外部平台，

    大家都熟门熟路，都已经磨合了很久了，继续下去，成功的几率就大。要

