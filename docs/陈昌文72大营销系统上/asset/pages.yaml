- pgno: 20
  md: '# 为什么要学习《论语》？


    《论语》是儒家思想的代表，孔子的很多思想体系都在里面。这种学问是走正道的学问。这是做人、做事的方法论，是道的方法论。


    我们谈道，大多数人都稀里糊涂，不知道说的是什幺，认为是玄之又玄的东西。《道德经》里就讲，这“道”没办法说清楚的，开口就不是道了。但儒家思想，孔子不是这样认为的，孔子给我们提出了一个可以按照做的规矩、日常行用。


    我按照这个方法来回商，来教学，来做人，我自己确实感觉到非常爽啊。比如，用之则行，舍之则藏。您认可我，就跟玩；不认可我，就算了。我不强求。比如做生意，我们都是站着做的，不是跪着求的。您觉得我好，完全认可了，我做好了免责声明，您别找我麻烦，我就做您的生意。否则，您给我业务，我也不接，我不想跟您发生关系。


    这是什幺？邦有道，则入，邦无道，则隐。


    您不是对我的人，我就不跟您发生任何关系。您不听指挥，我就不教您。《论语》可以打造自己的理想社会。至少我这个小社会是认可儒家思想的，我们在一起就非常开心。这个社会上有其他恶劣的东西，自然就被我们的价值观、世界观、人生观给过滤掉了。


    我们的合作者、客户在一起，都是很开心的，都是愉快的，都是有精神的，有思想的，非常快乐。这就是我每天都要讲《论语》，学习儒家思想的原因。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '我认为中国最好的思想，就是儒家思想。儒家讲究勤奋，讲究诚恳，讲究仁义。也就是我们永远是只做好事，对社会有益的事情，不做坏事。我们创业，我们对社会输出的内容，必须是对人有好处的。在抖音、喜马拉雅等自媒体上，不断地输出对创业者有好处的东西。


    # 儒家思想是王道思想


    儒家思想所谓的王道思想，就是正能量、正义思想。一切都是正能量的、阳谋，为天下人考虑。这样，就是得道多助，失道寡助。


    一个人思想不正，就算聪明有实力，吸引来的也是思想不正，聪明有实力的人。一旦哪个时候，一不小心，就被周围心术不正的人坑。


    所以，正能量其实是保护自己的，当然，也给所有人带去了光明。高手都是阳谋，都走堂堂正正的大道，这就是王道思想。如果您想彻底理解正能量、王道思想，一定要多读读《论语》。邪恶的人，有时候会觉得自己奸计得逞，但长期看来，一定倒霉。


    中国古代文化的伟大之处，就是大多数道理都是用来教人做君子的。这些东西，才是真正厉害的。获得人心，大多数人帮您，您自然就成功了。大多数人都反对您，您就失败了。您能获得高人的帮助，您就能快速成功。


    我不相信什么技巧，什么商业模式，什么套路。我只相信中国传统文化、儒家思想、王道思想。我严格按照儒家思想来做人的，做事，经营我的'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 儒家思想系统


    生意。我每天必须研读孔孟思想。我只追求最本质的生活、思想、原则。


    我追求根源性质的东西。也就是这个东西存在几千年了，我就尊重、执行。我不愿意执行那些似是非非，刚刚出来的什么新思想。我相信老祖宗，阅读孔孟。我的底层思想是儒家思想，外延的营销方法都是源自于儒家思想。


    陈昌文老板社群的每个人，都是儒家思想，都是王道思想。奉行近悦远来。要让每个人都学会陈昌文方法的每个系统，且通过这个系统赚钱。要让每个粉丝都高兴，提升每个粉丝的道德素质，让其自动传播，让其发自内心的愿意跟随我们学习儒家思想。


    这个是陈昌文方法的特色，也是品牌形象、品牌差异化。儒家思想是我们的道，是君子之学，在古代，是教王侯将相的，现代用来教老板。


    王道思想，是做好自己的小事。而不是成天心慌的去找其他事情、其他项目，去发财。王道思想，就是抓住一个项目，只有一个项目，盯着一个项目，把这个项目做到极致，什么都有了。只有儒家思想，才能让我们走得更远。因为王道思想，是顺应天道的。


    # 儒家思想正三观


    正三观，就是通过传统文化来正三观。儒家思想，就是用来正我们三观的。三观不正，谈赚钱，没什么意义。


    三观，就是我们中国的传统文化，有了这个，我们老板才会有前途。'
