- pgno: 147
  md: '听高手的话，感觉没面子。养成了贫穷的人的性格，习惯不自知，习惯性反驳高人，没执行力，不愿意干活，就懂错了，也不干。


    其实盈利很简单，只需要找到一个有实践能力的导师，听话、照做、执行就行了。只需要干这几件事。而不是自己在那里探索，或许瞎搞。


