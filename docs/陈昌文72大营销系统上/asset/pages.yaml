    6、人们不喜欢简单，因为简单就会怀疑人生，也会怀疑自己的智力。所以，人们很难听话、照做、执行，也很难明白什么是复制、改编、优化。更难理解跟随的力量。一个简单卖点，一直跟随，一直做即可。这样做，就会赚钱，但是太简单了。所以有些聪明人，会给自己加戏，变得不赚钱。


