  md: "# ## 广告的本质，是购买理由\n\n只要您找到了足够的购买理由，购买理由够有力，客户就会买单。所有高手，都是不断地广播购买理由给客户。\n\n**高手眼里，一切都是广告，有广告，才有一切，没有广告，就没有一切，高手眼里，内容就是广告。内容不好，什么都没有，只有内容，才是真相，才能生存，没有内容，怎么可能赚钱呢？好的内容，都是好的价值。尾巴系统如何做的？**\n\
    \n**尾巴系统，就是购买理由与价格的组成。**比如，我们做老板社群，您要不断地写，为什么要加入老板社群。您至少找出来 **100 个理由，我们为什么要加入社群。**大家如果觉得很难，一点点简单的工作都完不成，自然做不了成交。\n\
    \n**举例：购买理由？**\n\n+   1、加入我们老板社群，找到目标快。  \n2、加入我们老板社群，每天都能忙碌起来，有事情做。  \n3、加入我们老板社群，方向感明确，不再迷茫。\
    \  \n4、加入我们老板社群，就是加入高端圈子  \n……"
