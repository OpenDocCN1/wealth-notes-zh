  md: '现在市场上的营销，很多其实不是营销，是技巧，是欺诈的手段。我们不用这些。我们就是一切求真，用勤奋与诚恳来搞营销。您认可我了，直接付费，付费后不退费，这些理念，才是真正具有深入人心的营销理念。


    内部营销与外部营销有什么差别呢？


    外部吸粉，主要是差异化，差异化就会带来争议。一切营销的本质战争，都是差异化。就是我跟您有什么不一样。所有核心竞争力，来自于不一样的品牌。您们都可以去建立自己的品牌，建立自己与众不同的差异化，但是不要违法乱纪。讲述的永远是您跟别人有什么不同，这是吸粉策略。而内部营销系统就是展示自我、产品、服务的广告平台。


    另外，您还可以百度一下“成交”这个词，研究其百科，研究所有有关于成交的网站，研究所有平台年收入几千万，几个亿的公司、同行，他们的成交文案、视频、音频，形象打造是如何做的？然后，结合自己企业的实际情况进行改编。日日改编，改编了过后就成了您的成交文案了。重要的是每天都必须写成交心得，成交系统文案的修改方案，且把年收入几千万的公司的成交文案改编优化过后，原来的文案，新文案对比，保存。以便不断优化。


    # 做好朋友圈的功力


    您的朋友圈应该写什么？


    写您为客户提供了什么服务、案例、故事、方法、技巧。写干货，客'
  merge: -1
  img_proc: true
- pgno: 114
  md: '![](img/9610da2262e4e91954d340aa3b2c568a_114_0.png)


    户就付费，不写干货，客户不付费。做不到36循环，每天只发几条，客户的朋友圈加了几百人，甚至几千人，每个人都在发，您只发几条，客户根本发现不了您，只在直播，抖音上知道您，但在微信上找不到您，您就不可能赚钱。


    朋友圈图片要高上大，通过图片，能够认识到您是一个了不起的人，精神积极向上，有思想。您有很多案例背书，故事背书，人物背书，老师图片，文案的模式体现在朋友圈。


    做好朋友圈的功力，其实大于做直播，做流量的。一个能把朋友圈营销做到极致的人，其实，基本上是个营销大师，心理学大师，朋友圈要让人喜欢看，当故事，当小说去读，而不是仅仅有枯燥无味的短短几个广告。当您的朋友圈内容以图文、音频、视频模式展示，且丰富多彩的时候，粉丝会天天读，当小说读。则您插入广告，自然成交。


    朋友圈要有意思，有干货，有趣，有生活，要么扎心，要么有幽默的智慧。要么能让人看了直接赚钱。您的朋友圈能成为客户的信仰，他没事就来看看，则您出单就容易了。


    朋友圈做好了，一万人，一年搞500万+都没什么难度。朋友圈做不好，一个月搞几千块都搞不到。朋友圈，应该也是要搞内容创作的，世界上最复杂的事情，就是人人都会做，看似极其简单，好像小孩子都会做的事情。朋友圈就是如此。一个种田的老农民也能发朋友圈。关键是怎么发。


    朋友圈，要丰富，朋友圈的作用，是沉淀客户，客户沉淀的时间长了，也是能成交的。也有套路直接让其付费。


    一般朋友圈的内容占比分成，“3分生活，6分专业，1分硬广”。


    也就是生活化内容要有，这个主要是体现真实感；不一定天天写日'
