- pgno: 49
  md: '上班也是非常复杂的，做的事情非常多。这样的人，不可能有前途。因为他没有办法做精，做透彻任何一件事。


    很多创业者，一上来，就把自己当多面手，这等同于找死的节奏啊。非常危险。除非你的才能逆天，否则，一般你干不好所有的事情。创业，是做更少、极少，唯一的一件事，当你找到这件事，你就容易了。生活与工作，都容易了。


    # 高手，永远是在做简单的、重复的事情，重复到极致。


