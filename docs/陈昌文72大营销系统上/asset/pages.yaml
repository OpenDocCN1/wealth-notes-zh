  md: '![](img/9610da2262e4e91954d340aa3b2c568a_28_0.png)


    # 儒商赚钱之道是顺手而来


    己欲立而立人，己欲达而达人。


    我自己想赚钱，我就要帮成千上万的人赚钱；我自己搞网络营销、社群创业，我就要教会成千上万的人搞网络营销、社群创业；我想安身立命，我就要教会大家都安身立命；我想富贵，我就要教会大家都富贵。我把我知道的知识、方法论，都总结出来，传授给我的学员，我的社群成员。我有价值，我自然会赚钱。这就是儒家思想的核心。


    我要做的不是成交人，而是拒绝人。这是佛祖思想、儒家思想。人的心正了，财富自然就有了。儒家思想，就是讲这个的。


    我们带领的这个团队、这个社群，不谈利，首先谈道义，首先谈仁义。做人要知恩图报，要有良心，有责任，纯粹的商人没什么前途。只有讲道义的人，才能做大做强。而且，我们也只带有道义的人。钱是顺手就赚来的。钱从来不是目标，为客户解决问题才是目标；做好一个人，才是目标；修炼自己的灵魂，才是目标。


    # 儒家思想是先修道再求财


    儒家思想，教会我们先修道再求财，进德修业。先进德，再做事业。很多人把顺序搞反了，所以一身痛苦，遍体鳞伤。这“德”是根基，才有'
