- pgno: 275
  md: '导致自己亏本，甚至负债。这种人，想要爬起来，就要开始修炼品行。1、看得起人；2、谦虚谨慎；3、不乱投资；4、不乱借钱；5、不虚荣。


    为什么作为一个企业家，会不断地培养新人。实在是因为旧部下跟不上道德素质，其德行只能赚一点点财富而已。


    性格、人品、道德素质，决定了很大一部分财富地位，阶级地位。然后，才是能力、努力。能力、努力，甚至是机遇，这种东西，只是锦上添花，只是微小的助力。真正有意义的，就是道德素质，就是儒家思想。


    痛苦，源于不对等的交易。失败的交易，就是赔。高明的人，选择交易对象。与人交往，首先看人品、道德素质，然后才去思考利益，思考合作。若此人道德素质、人品不过关，其他一切都白说。无论贫穷与富有，好看与丑陋，只要道德素质不过关，就不应该继续交往。无论男女朋友，以及合作伙伴，以及客户，皆是如此。


    道德是最重要的。素质是最重要的。这个比努力工作，有什么技巧还重要。信用是建立在德行基础之上的。有德行，必有信用。


    我经过了很多年，经过了地狱模式赚钱，经过手段模式赚钱，才理解这个道理。一切贫穷，或者起来过后，又倒下去的人，归根结底，是其道德素质出了问题。积德是非常重要的，比财商还重要。


    只有高智慧的人才能理解，道德素质的重要性。道德素质，才能让我们走得更远。信用，才能让我们走得更远。没有素质、信用的人，走不远的。我们做错的事情，会加倍让我们偿还。我们做对的事情，也会加倍让我们得利。如果您不重视道德素质，您很难爬到最高处，即便是上去了，也会下来。有些人，不值得交往。先看是不是能交朋友，再说谈生意。这样，您的营销境界就高几个等级了。'
