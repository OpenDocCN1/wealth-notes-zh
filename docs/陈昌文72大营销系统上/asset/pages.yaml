  md: '# 二十三章


    陈昌文方法72大营销系统之好话系统


    说人好话难，所以富贵的少。——陈昌文'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# # 人说好话就能发财


    人说好话就能发财，人说恶言就会倒霉。说恶言容易，所以倒霉的人多。说好话难，所以富贵的人少。


    要讲好话，多说好话，这样您才厉害。要多帮助客户，帮助人，不要说人坏话。说人坏话，人就说您坏话，您就离心离德，没有必要，高手都是说人好话。


    多一些感恩，多一些好话。


    人际交往的精髓是什么？别人要什么？您给什么。如果您都搞不清楚别人要的，您还想交往别人，痴人说梦。


    要习惯性讲好听话，所有人都喜欢听话，那我们就讲好话。鬼谷子的意思是，你要利用每一个人的 人性。这人是什么心，你就用什么话去跟他对话就行了。


    不要太把能力看高了，能力强就目空一切，能力弱就低到尘埃，不必这样，中国是个人情社会，搞好关系比业务能力更重要。说你行，你就行，好多能力强的混得不一定比能力弱的好，想想为什么？不过就是会拉关系。


    其实，我在网络上讲课，就发现一个现象，你只要讲人好话，大家就喜欢你，就给你钱，你说真话，反而得罪人。有很多时候，大家都不需要听到真话，而只需听到听话的话。会讲顺耳的话的人，都是传播学大师，是高手，这样，您抖音也能做好了。'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 乱讲话，是要倒霉的


    不要在背后说人坏话，这个坏话一定会传到那人的耳朵里，背后要多说人好话，好话也一定会传到那人的耳朵里。我们在网络上讲课，一定要多讲人好话，一般情况下，我们就踏踏实实赚钱，踏踏实实做自己的业务，当然，我们要明白，我们一定要做正规项目，一定不要欺骗任何人，否则，就会倒霉。


    您善于说好听的话，领导喜欢，就提拔您；朋友喜欢，就推荐给您好工作，您就有更好地机会；女孩喜欢您，您就有更大概率找到老婆。所以，懂得说好话，这就是资源，可以换取您想要的一切。


    把自己培养成一个品好的人，然后把别人培养成人品好的人，只跟人品好的人交往，就是功德无量。讲话，只讲正面的话，帮助人的话，对人有益处的话，顺手，帮人赚钱。


    乱讲话，是要倒霉的。乱讲话，有人会找您麻烦，言语最容易伤人。所以，大家一定要习惯性好讲话，讲正能量的话，对任何人都尊重，谦虚，谨慎。不给人把柄，不给人伤害我们的机会，做好免责声明。


    我在网络做生意，不想得罪任何人，就算这个人很愚蠢，没事找事，我们也尽量好话讲给他听。不然我们有什么办法呢？人见多了，总是有人不上道。不上道的人，您如果跟他吵架，就是浪费时间，然后他就骂您，跟这样的人没什么好说的。没必要招惹他。


    要理解，人上一百，形形色色。忍一时风平浪静，退一步海阔天空。看开点，看淡点。


    我认识一个富豪，对谁都讲好话，和颜悦色。我开始不理解，觉得这'
  merge: -1
  img_proc: true
- pgno: 257
  md: '人啊，这样心累不？现在我明白了，不断地说人好话，和颜悦色，才会富啊。每个人都要谨言慎行，不要乱讲话，只讲正能量。只讲好话，不要碰敏感东西，不要找死。


    只讲人好话，只讲商业，只讲正能量。不碰敏感的东西。堂堂正正做人，正正经经经商。做好免责声明，别给自己找事。


    只讲正面的事情、案例。只宣传儒家思想，只讲正能量的东西，拒绝任何负能量的东西。只跟高手交往。保护自己。


    您永远在夸奖别人，永远在说别人好话。柔软语，赞叹语，多说好话，就是言布施。大家喜欢您了，您就发财。有些家伙，每句话都在得罪人，还想发财，这是不可能的。


    一个人，只要会不断地说好话，此人也会发财。这就叫做：“言布施”。切记，在外面只讲好话，不讲坏话。讲坏话，即便是玩笑话，也会结仇。结仇就不好了。一切只讲好话。这样，大家赚钱就会越来越多。否则，就倒霉了。


    网络上交际聊天，只讲人好话，不讲人坏话，不扫人面子。比如，我只讲儒家思想，孙子兵法，我只是不断地优化陈昌文方法，带着大家不断地赚钱。我们教人创业，做互联网营销，教人做社群。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 第二十四章


    陈昌文方法72大营销系统之感恩系统


    > 您感恩什么，什么就会增加。——陈昌文'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 只有感恩的人配得上财富


    保持感恩之心，我们所获得的，就是好的。我们不能获得的，就不应该是我们的。


    一定要感恩，只有感恩的人配得上财富，只有感恩老师的人，才会获得智慧。感恩老师，感恩他，是他给了我们财富，是他给了我们未来。是他帮助了我们成长，做人首先要有感恩之心，要尊师重道。


    如果一个人不感恩，这人啊，基本就是废物。


    您的收入低，是因为您配不上高收入，您有什么好抱怨的？


    但是，您收入高了，就必须感恩、虔诚、老实，您必须认为是别人的功劳。如此，您才能走得更远。


    过，是自己的，功，是别人的，此人就是国学思维，是高人。


    一个人必须感恩，必须尊师重道，必须对您拥有的，帮过您的人感恩。滴水之恩，当涌泉相报。


    +   您感恩什么，什么就会增加。

    您感恩您获得的财富，您的财富就会增加；

    您感恩客户，客户就会增加；

    您感恩粉丝，粉丝就会增加。


    当然，您觉得都是靠您自己的能力获得这一切的，抱歉，这一切都会离您而去。


    任何一个成功者、牛人，都是感谢这个世界的。


    一个人首先应该感恩父母，是父母给了我们生命。然后我们混社会，有些人教育我们做人，教育我们赚钱。这些人如同我们的再生父母，我们必须感恩。一个人只有感恩了，才会虔诚，会一辈子一起团结走下去。'
  merge: -1
  img_proc: true
- pgno: 260
  md: '没有感恩之心的人，做啥都觉得自己牛B，自己亏了，理解不了什么是团结就是力量，最后只能分道扬锤，合则力大，分则力小，被人消灭。所以，**只有感恩之心的人才能长期合作，团结下去。**


    有感恩之心的人，懂得合作，也能借助到团队的力量。无感恩之心的人，容易发生背叛，拆台事件，容易给所有人都造成损失。


    我本人是一个非常感谢老师、恩人的人。我走到今天，是因为太多的高人帮助我。我也在总结，为什么高人不断地帮助我，是因为我这个人特别感恩，我对老师的感恩是溢于言表的，我也不计较，别人帮了我，或者有了什么交易，就算我亏了几十万，上百万，我还是会觉得我赚了。也就是说，我始终不觉得自己亏了。这样，老师们就更愿意帮助我，结果我获得了更大的财富，以及人脉关系。


    您要感恩您的群友，您的粉丝，是他们加持了您，是他们跟您一起玩，他们的每一个动作，都在帮您做营销，给您做证明，给您做广告。不要嫉恨任何人，不要讨厌任何人，您讨厌他们，只能证明您心胸狭窄，只能证明您格局小，只能证明您没有智慧，不会利用他们。


    感恩支持您的每一个人。只有您不断地感恩的时候，您才能活在幸福之中，活在资源丰富的地方。如果您感恩，您就会到处都是宝藏，您挖都挖不完。


    相反，如果您仇恨大家，您就会发现每个人说的话，您都讨厌。每个人都在浪费时间。


    比如我们社群，其实，在我们社群，无论是讲课老师，还是每一个成员，他在这里，就是时时刻刻给您送钱，送图片，送广告，送素材，送人气的。只是您不理解，您被自己的愚蠢给蠢死了。


    多些感恩，然后您就会少很多奸诈，您的行为就会获得很多人的认可，您也不会有很多内耗，您慢慢会感觉到大家实际上，或明或暗都在支持您。'
  merge: -1
  img_proc: true
- pgno: 261
  md: '您的力量就越来强大了。


    您的世界冷漠、悲惨，实际上是因为您的思想不对。没人支持您，也是因为您的思想不对。


    当您真诚地去感恩我们社群的思想、营销方法，以及社群里的每个老师，成员的时候，您就会发观，我们这里是非常温暖的。


    您的内心世界，会完全映射到现实世界里。若是您贪婪，没有单子，没有利润，大概是您内心枯萎了。尝试着日日感恩，试一试，您就会发观事情越来越好转了。


    # 人生最大的“绝招”就是感恩


    感恩是一种传统，是只有好人，有良心的人，才具有的一种基因，若您实在没有感恩之心，我希望您呢，有点交易之心，也就是别人付出了这么多，您起码说声，谢谢。


    您也会得到成长，只是没有拥有感恩之心的人成长得快。


    因为老师帮我，我才能有今天，如果我瞎搞，无感恩之心，说明我是个傻瓜。如果我对老师不满，那一定是我自己错了。我绝对支持老师。资金、精神、思维模式全面支持老师。


    我最大的绝招，就是我老实、感恩、沉默，高手都愿意带我玩。这样，我的事业就能玩大。


    大富豪圈子，必须是配合思维，不要趾高气昂。一个盘子，其实非常'
  merge: -1
  img_proc: true
- pgno: 262
  md: '复杂，并不是一个人能搞定的，您能力再强，您也搞不定一个盘子，这个时候，要的是很多人干，相互都知道自己几斤几两，然后都为这个盘子出力。则每个在盘子里的人分到对应利润，大家过得越来越好。


    在穷人圈子，配合思维行不通，只会被吃得渣都不剩。


    但在富人圈子，没有配合思维，没有“别人牛B，自己跟随”的思维，则会回到解放前，被富人圈子抛弃。


    穷人要翻身，第一招是独立，独立于所有穷人圈子，当进入到了富人圈子的时候，开始的时候，会趾高气扬，觉得自己也能靠自己翻身了，谁也不求谁了。注意，这个时候，您是从穷人圈子爬出来的，您这个思想是对的，但是当您进入富人圈子的时候，马上要换成配合思维、感恩思维。要理解事业是复杂的，不是一个人能干全局的，您需要其他高手帮助，配合，甚至，您在这个盘子里，也只是一个配合者。


    进入富人圈子，反而要的不是独立，而是配合。若进入富人圈子，还用独龙思维，则一定被其他富人群龙战术干死。


    或者，独龙思维也就只能保持自己的小富。


    进入富人圈子，跟高手，要舍得吃亏，要配合，大家一起玩才能玩大。


    进入闭环模式，群狼战术模式，配合模式，知道自己几斤几两，千万不要在富贵圈子里面装。凡是大富豪，全部懂这个道理。


    你们见到的所有大富豪，在富豪圈子，全部是配合思维，大家一起相互扶持，最终做大做强。'
