- pgno: 139
  md: '+   学习如何做微信营销，


    学习如何用微信搞成交，


    学习如何做社群营销。


    ……


    这些，写几百条。


    连广告都写不好，你们就别在网上做生意了，只会给您自己带来麻烦。


    所以，我建议您们每个在网络上做社群营销的人，都去找律师。


    > 《德鲁克管理思想精要》：“没有一个专业人员可以保证他一定能为客户带来利益，能做的只是尽力而已，所以专业人员的首要责任是‘不明知有害而为之’。”


    不骗人。也是为什么我总说两句话：打水漂，也认就弄。


    我从来不给客户任何保证。需要我承诺的，我都不服务您。客户只有完全认可我，觉得钱给我了，打水漂也认，我才收这样的客户做培训，做服务，做咨询。如果对我有要求，那就是不理解我。


    我认真教您。但我不会承诺您什么。我就怕您跟我扯皮。这就是我们为什么不断地拒绝客户的原因。您让我承诺，我就不收您钱了。


    做生意是有风险的。


    您服务越好，越是给顾客承诺，您就会吸引到一些找事的人。比如我们办培训班，我们有的合作者给客户承诺多了，客户就会去告我们。所幸，您啥也别承诺。您就说，您有本事，您才来学习。我这里没有任何承诺，觉得跟我学习，付费值得，就来。您没什么本事，赚不了钱，喜欢怪老师的，您千万别来。


    我从来不喜欢改变谁的命运，我只跟强者沟通。所以，您是一个强者，'
