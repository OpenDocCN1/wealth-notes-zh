    儒家思想，首先是正人价值观。儒家思想极其社会价值，就是看我解读的儒家思想的人，也会变得非常有价值，成为一个好人，三观正的人。看我的陈昌文方法 72 大营销系统的人，也会成为一个优秀的营销专家，跟着我们做事的人，首先要理解我们的价值，才能做好。心正才能赚钱。


    人有家风，企业有企业风，社群有社群风。我们社群之风，就是传统文化、儒家思想、国学思维。我们只师从老祖宗文化，而且，本人会重点搞国学思维给大家。


    风，富人有富人风，穷人有穷人风。跟谁就吸收谁的风。国学思维天下无敌，谁能运用好国学思维，此人就能通神。我们社群，主要是国学思维、传统文化，随随便便驾驭一下陈昌文方法，也就枯叶飞花了。达到独孤九剑最高境界，无剑为剑，无敌于天下。


