  md: '# 镜像世界


    这个社会 上，什么人都 有，您是什 么人，您周围就是什么样的镜像世界。人与人之间，是有圈层，有智力限制的。社群，就是圈层的演化。


    当您接触的人越多，层面越高，您会 发现：思想和境界越高端、越有教养的人，大都相互支持，抱团发展，因为您好了，大家都好。思想和境界越低的人，越是喜欢诋毁、嫉妒、拆台、鄙视，因为我不好，我也不想让您好。


    所以，影响一个人的首要因素是境界及思维。和一群有同样格局和思维的人一起前行，才是最重要的。聪明人必定加入高端的圈层，跟思想境界高的人一起混，一起学习，一起合作。


    愚蠢的人，思想境界都在低端层面，然后成天吼着，人人平等，人人民主，人人一样，吼着您要尊重他，要给他面子。


    远离这些人。学习聪明人、思想境界高阶层的人的思维模式、行为模式，最后变成高阶层的人。


    不是一个层面的人来往，容易产生矛盾，友谊比较脆弱。发生危机，各自打着小九九，就分崩离析了。


    很多时候，您脱离不了社会底层，您喜欢的事情，大都是毫无价值的！比如喜欢玩，喜欢玩游戏，喜欢懒惰，喜欢看电视剧，喜欢闲逛，喜欢乱消费。什么事情，能让您暂时觉得安逸，您基本就会喜欢什么事情。


    而社会高层的人，奋斗的人，必然喜欢工作，喜欢节约，喜欢进步，喜欢搞36循环系统，都是逆人性的动作。


    所谓逆人性，就是听话、照做、执行，一直搞视频，一直搞音频，一直搞软文出单。不偷懒，奋斗、奋斗、还是奋斗。'
