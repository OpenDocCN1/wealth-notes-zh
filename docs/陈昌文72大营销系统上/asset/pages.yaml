  md: '的广告尾巴系统，这个人日赚几万都正常。日赚几千，都是轻轻松松的。


    所以，从现在开始，每个人都要修炼，十分钟释放一个广告。您们发广告的能力差，就不赚钱。要习惯性的讲广告，大家都应该是广告讲师，广告写手。您们的广告能力不强，这是您们不赚钱的核心。要一直发广告。不赚钱的核心，是广告做的不到位，其他工作猛做，但是从来不打广告，广告打的不好，于是不收单。


    # 同行能赚钱的秘密在哪里？


    同行能赚钱的秘密在哪里？


