- pgno: 39
  md: '就会成为神。比如，对于我们社群，就是卖儒家思想，陈昌文方法72大营销系统，这个东西卖到全世界，我们就能开启一个非常厉害的商学院。


    我们社群有很多卖点，当我们在社群里选好一个卖点的时候，就带着这一个卖点干一辈子，绝对不换卖点。任何一个卖点，都能让人发大财；任何一个卖点，爆破整个市场，都能赚不少钱。所以，必须锁定一个卖点，不要换，比如，我们社群就有人品牌训练营，老板社群，做讲师，传统企业转型等很多卖点，您只要锁定一个，一直宣传就行了。只是陈昌文老板社群这个平台不变。


    卖点要唯一，要小，小到您自己都怀疑人生。比如，我们就搞企业家圈子，然后，这个卖点，就是企业家圈子，进入的是陈昌文老板社群。那么我们的一切都是卖给企业家的，我们也就只讲“企业家”这个词了。


    儒家思想，陈昌文方法营销系统都是为企业家服务的，采取这个模式，不断地塑造价值。锁定卖点过后，就永远不要换，任何一个卖点，都能赚钱，而且能暴富。锁定了，比如，我们是卖儒家思想，陈昌文方法72大营销系统，卖给企业家的。我们就这样三番五次的重复讲，日日重复，重复到天地老，重复到我们自己觉得没得讲了，讲起来好像自己都烦了，还要重复。为什么？因为别人不知道，因为您的直播间买单的始终是新人和。


    人不需要卖两个以上的卖点。所有塑造价值的模块、矩阵，只为您的卖点服务。选定一个卖点，就是跟着老师们干一辈子，要谦虚，不要情绪化，不要换卖点，不要一会儿莫名其妙的发表一些奇怪的言论，又开始换卖点。


    只研究一个业务，一个细节，一个赢利点，只研究一个卖点，只实践一个卖点。只把一个卖点做透彻，就什么都有了。我们从早到晚，吃饭、睡觉，研究一个卖点，就是这个点，其他什么都做不了。越聚集，越好。打持久战，也就是我们找到了这个卖点，就一直干，永远的干。'
