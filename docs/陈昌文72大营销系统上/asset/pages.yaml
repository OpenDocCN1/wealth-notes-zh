  md: '作。我们只需要发射诚恳且真实的信号，他看上了，有缘分，就成交，无缘分，就大路朝天，各走一边。**诚恳到极致，自然有人找我们合作，自然自动出单，这就是儒商。**


    多读《论语》站着发财。**学习儒家思想，就是为了学习经商的道理。不懂经商的道理，不懂做人的道理，这个人就不能长久，生意就不可能做大。**


    只有愚蠢的人，才见钱眼开。只有愚蠢的人，才不懂我们做人要讲规矩。


