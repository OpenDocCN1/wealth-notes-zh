  md: '早年的时候，刚混社会，我认为营销，就是多讲，说服别人，让别人买单，让别人跟自己混。


    混了好多年，我慢慢学会了沉默，听别人讲话，高手说啥，就是啥。营销不再重要，选择跟高手合作，听话，才重要。


    我比较喜欢沉默，听别人说话，特别是听高手讲道理。我也不插嘴，我讲话，怕自己讲错。


    一来，我自己很多观念是错的。


    二来，我优柔寡断，并不是杀伐果断的人。


    三来，我并不聪明。


    当我碰见很聪明的人，有成就的人的时候，我就明显发现，别人的头脑比我智慧，更理智，更具有功夫。


    我做一个好人，好好沉默，听话即可，没必要发表我的意见，少说，多听，多沉默，安静。


    修炼感恩之心，不仅需要感恩老师，还要感恩直播间粉丝，感恩学员，感恩给您人气的每一个人，不要有怨恨心，抱怨大家，要极度感恩，您的人气就会旺盛，路就会平坦。


    创业要胸怀宽广，多感恩帮您的人，而不是索取，做人态度要好，别人给您的，您就感恩，不要觉得别人欠您的，这样，您才能真正的付出，做大，做强。


    一定要具备感恩之心。有人帮了您，您就要感恩，好好跟着别人混。这样，您才能长久。


    有些人智商高，能力强，您好好跟着混。做人不要有二心。为人谋而不忠乎？'
