- pgno: 33
  md: '以道驭术，儒家思想完全可以驾驭。


    儒家思想，就是专业的管理哲学，这是整个地球、人类文明最先进的管理哲学。但是，没多少人能听得懂，去研究。


    管理的最高要求，是提升所有人的道德。管理的本质是管理自己。


    儒家思想，几乎都是阳谋，不玩阴谋诡计。犹如做生意，我给您讲清楚了，您想跟我合作，就合作，不合作就算了。说明您跟我不是一路人，道不同不相为谋。玩阴谋诡计，能得暂时的利益，但也会反噬。


    儒商，就是用阳谋，站着做生意的人。


    玩阴谋诡计的人就算现在没跪着，时间到了，他们就会跪着。堂堂正正做人，正正经经经商，就是儒商。


    陈昌文方法是用儒家思想驾驭的，更进一步说，是用传统文化驾驭的，我只喜欢中国传统文化，我认为中国老祖宗天下无敌。我的一切东西，都是敬天法祖，我这人，只是述而不作，信而好古，我自己不搞创作，您们看到我东说西说的，讲课，其实，全部都是老祖宗的东西，我翻译成白话，理解了，讲给您们听而已。我根本不原创，只是糅合儒家思想、诸子百家，然后理解了，讲给您们听而已。


    这就是我们社群的整体框架。'
