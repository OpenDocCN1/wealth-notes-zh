  md: '我们赚钱的时候，要区分对方的人品、人格、礼貌程度。我仔细看 了暴雪公司，关于《魔兽世界》经典怀旧服的公告。我发现，凡是厉害 的企业，他们首先追求的是道德的完美，而不是金钱。


