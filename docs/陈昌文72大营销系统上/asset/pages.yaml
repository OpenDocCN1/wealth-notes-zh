- pgno: 48
  md: '# 创业是做更少的东西


    人生的成功，不在于您做了很多事情，这没什么骄傲的。而在于您做了一件小事，一件极小的，对很多人有帮助的事情，而您把这件事做好了。


    老干妈、可口可乐都是这个思维。其实，华为也是典型的利出一孔思维。


    秦朝能强大，也是这个思维，耕战思维，除了种田，就是打仗，没有其他事情做。封官晋爵，全靠打仗，所以，所有人都勇于杀敌，自然无强于天下。


    在我创办的老板社群里，总是不厌其烦地跟大家谈聚焦，做更少的东西。这正是赚钱的秘密所在。


    所谓大道至简，当你人生中只有一个词，比如创业。当你只有一个动作，比如写文章。或许，你为了写好文章，还要阅读。那么，你就是阅读+写作。你就不应该再有其他任何动作了。你靠着简单的东西，就能有一个非常明确的标签。比如，营销，或者教人营销，或者做老板社群。你的标签越简单，越聚焦，越唯一，别人越容易记住你。无论你做什么项目，你都会做起来。


    简单、专一、唯一！这种思维模式，将让你的行为模式非常简单。当你的行为模式，思维模式都非常简单的时候，你就不会累。当你不累的时候，你的工作效率就会非常高。


    你们去看贫穷的人，他们总是做的事情太多太多。事情多了，自然杂乱无章。送孩子上学，买菜，下班，做饭，聚餐，逛街，KTV，上班……，'
