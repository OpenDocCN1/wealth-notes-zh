    年轻的时候，都不知道存点软妹币。年纪大了，忽然我懂了，我要计划我的养老问题，以及很多直系血缘关系的各种问题。他们都需要软妹币……我这台机器，如果再不 自律，就等于破铜烂铁。那么，您难道不是吗？


    我们都想有彭于晏的身材，对不对？我们也想有李连杰的富有，还想拥有一个女神般的老婆。您羡慕别人的成功、富足。但是，您羡慕别人自律到自己虐待吗？别人炫耀豪宅、豪车、漂亮老婆，但是，您知道吗？这都是自虐的代价！


    财富，是自律者的伤疤。伤痕累累的人才是英雄。身上无伤的人，只能当普通人，您控制不了自己，就没法谈拥有。再苦再累，无论如何，我们都要自律。否则，我们就只能沦为社会下层，被其他基因碾压，然后当成别人的养料，最后变成残渣。'
