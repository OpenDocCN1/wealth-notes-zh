    **我们之所以要日日不断，也是为了让客户日日不断地来看我们，培养客户、粉丝跟我们交流的习惯。**


    一件事，要么不开始，开始了，就日日不断，三番五次改变、停顿，这件事就很难做好。人的一生，**也只需要坚持一件可以做一辈子的事情，然后日日不断地去弄。坚持好这件小事，您就会有成就**。


    我以前搞音频平台，每天一个，坚持3年，结果给我带来了数百万的收入。我就知道日日不断，滴水穿石的精神那么可怕。我们现在逼着所有人搞36循环系统，无论是搞抖音，还是音频，还是自媒体，学的也是滴水穿石的精神。


