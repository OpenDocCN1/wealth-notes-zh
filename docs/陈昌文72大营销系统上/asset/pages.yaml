  md: '就松散，放纵自己，这就是悲剧。别人在努力，我们也在努力，别人在放假，我们也在努力，这样我们才有资格过好生活，享受高利润。否则我们不配，别说什么放假了，只要干活，在互联网上就永远都有人给您付费。每一分钟，都是赚钱的机会。


