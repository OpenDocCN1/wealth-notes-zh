- pgno: 73
  md: '# 专注是我们唯一的出路


    极度专注、认真，是赚钱的唯一秘密，所有人，都要专心致志的赚钱。


    专注是我们唯一的出路。大家都必须在关键词这个概念上，不断地专注。只做自己最擅长的事情来吸粉，在核心渠道上，疯狂加码。垂直、细分化，是我们唯一的方法论。


    # 赚钱的核心是什么？


    +   1、 资源集中。


    +   2、 营销专注。


    也是我们所有的力量，都聚焦在一个关键词，一个项目，一个点上，不断地爆破。则，我们会获得长期大收益。任何一个方向，都可以赚到钱，只要您够专注。所谓道场，就是只管自己这个场，其他的无所谓了。一个人若心思不定，大概率，人生会迎来悲剧，自己嫁个男人，老想其他男人。做个项目，老想其他项目。营销一群人，老想其他人。这个人啊，就是超级
    miss 大废物了。


    只专注我们自己的事情，我们心里面就舒服，就感觉能做好。要是心里不专注，搞其他的了，出了很多其他套路，抱歉，我们就惨了。所以，我们必须聚焦、减法、专注、唯一、重复、36
    循环系统。


    大家根据这个来干，百分百枯木逢春，起死回生，我们一定会拥有我们想拥有的。我们套路太多，太复杂，把自己给搞迷茫，搞懵圈了。现在，我们开始追求唯一专注。


    只专注自己的业务，只专注自己的直播，只专注自己的事情，其他一概不专注。无聊的人，无聊的事情，无关的饭局，一概不搭理。回家种自'
