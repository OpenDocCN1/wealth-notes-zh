    24 式。答案是 3 年到 50 年。也就是有的人打了 3 年，有的人打了 50 年，故而，看起来行云流水，不动如山，如如不动。普通人没耐心，打两天就不打了，还认为自己牛
    B 得很。这就是普通人没什么成就的原因。


