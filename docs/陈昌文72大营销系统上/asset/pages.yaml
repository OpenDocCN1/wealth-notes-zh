  md: '带沟里。做人首先要价值观正，价值观正了，做事不后悔，做事不犯错误。不返工，不走废招，才是最高明的。急功近利，容易走废招。儒家思想，就是价值观正的思想，我们严格按照儒家思想来做人做事，就会拥有最高效率。


    我们只找价值观正的人，跟着我们一起学习儒商之道。我们收的人，也是价值观正的人，价值观正，赚钱容易，价值观邪，赚钱不容易。宣传正道，都是阳谋，阳谋取财，征服人心。


