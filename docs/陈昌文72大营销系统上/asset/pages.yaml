    # 打造强者形象，增加影响力


    打造影响力首先要亮成就，您有什么成就？您有什么值得骄傲的？您的粉丝在意什么？若您的一言一行都没什么出众的，您毫无成就，无论您怎么传播，您都不会有影响力。


    只有冠军，才有影响力，做什么都必须做到行业第一。行业第二，没人关注，即便是很厉害，慢慢也被人遗忘了。一个人想要有影响力，就一定要追求行业第一，追求冠军，做冠军，有影响力。做第二，就被遗忘。要立志做冠军，做行业第一，冠军的影响力非常巨大，人们几乎只能'
