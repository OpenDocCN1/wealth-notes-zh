    我能有今天，全靠老实，跟着老师路，踏踏实实的干，虔诚，听话、照做、执行，而不是自以为是。这世界上，有很多自作聪明的人，这些人，基本都毫无前途，他们想法多，自以为是，要么乱整，要么浪费时间，反正，他们干啥，都不大好。即便是干好，也是一瞬间的事情，过一段时间，他们又干不好了。


    认认真真摘单子，比如我们社群，很多老学员，都落下了。因为您们有自己的借口，有自己的见解，所以您们落下了。人落下，都是因为自作聪明。没办法，这是人的天性，太多人自作聪明，于是毫无前途，想想，您们一开始为什么很赚钱，后来不赚钱了？因为一开始的时候，您听我的，后来，您觉得您学会了，您聪明了，所以您就不赚钱了，您变得普通。再后来，又有一些新人，刚接触我，听话、照做、执行，收入在增长。不过，过上半年，这些新人又会觉得自己聪明，又开始自作聪明了。于是，新一轮的轮回开始。脱离轮回？从戒掉自己的自作聪明开始。


    石破天为什么那么厉害？也是听话，照做，执行而已。跟哪个师傅，都是如此，就是跟着干，就行了。跟郭靖一个性格。凡是侠之大者，皆是如此。那些聪明、奸诈、狡狯之人，看似聪明伶俐，实在是让人失望的多啊。奸诈狡猾，欺师灭祖之辈，就算聪明，也赚不了几个钱。


    听话、照做、执行，这种人少，结果却赚了有些人不敢想象的那么多钱。并不是他们有什么过人之处，只不过是做到了听话照做执行而已。'
