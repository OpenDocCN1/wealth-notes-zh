- pgno: 225
  md: '没前途的人，三心二意，做一会就跑，成天坑人。人啊，最难的就是持续做一件事，从一而终，利出一孔。大多数人，都心猿意马，喜欢换，换来换去，最后把自己换成就傻子了。


    真正的高手，都是从一而终，建立时间壁垒。也就是我在这个行业，这件事情上不断地钻研，成了专家。我花了三年，您也必须花三年。我花了十年，您也必须花十年，才能赶上我。真正的高手，不会总是换行业，换项目，换工作。而是把所有的时间都投入到一件事情上，把这件事做到极致，做到天下第一。自然什么都有了。


    不要去寻找机会，您手上的事情，做到极致了，就是最大的机会。敢问路在何方？路在脚下，路就在您的手上。远在天边近在眼前。


    有个小伙子，就是日日夜夜36循环系统，其他什么也不干。就是把这一件事做到极致了。其每日都在出单。我希望他再接再厉，不要骄傲。这几年，我见到太多的人骄傲，开始有点成绩，后来放弃了，或者干其他的去了。能从一而终的少啊。


    有些人一直盯着一个项目做，一个业务做。做好几年了。现在收入很不错。跟这个兄弟一起做业务的人，都不知道跑哪里去了。5年前，我带了一个小伙子，他能做到日收入几万，没能持续努力下去。如今，去打工了，这就是人生。不能持之以恒。


