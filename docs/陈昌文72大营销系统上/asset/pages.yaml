- pgno: 344
  md: '**信：您做的动作，别人才会尊重您。如此，您才会影响到别人。**


    要做大家都喜欢的 事情，比如，我天天讲创业的思想、思维方式，大家就喜欢，毕竟，这是帮大家赚钱、发家致富的东西。如果您让人非常讨厌，您也很难对别人施加您想要的影响力。


    借助互联网工具，让您的影响力快速的传达 利用同事、员工，迅速传播您的影响力。也就是您一个人，很难快速的传播您的影响力，您必须组织一个利益共同体，来传播您的影响力。有了影响力，做好了尾巴系统，自然就能赚钱。


    # 想要有影响力，一定要有自己的文化主张


    想要有影响力，一定要 有自己的文化主张，要自成一派，如诸子百家，每一派有厉害的理论、学说，就具有影响力。还有一种模式，就是直接师承一种价值主张，比如，您就一辈子宣传儒家思想，或者鬼谷子，您就会具备一定
    的影响力。**想要有影响力，一定要有明确的文化主张、价值主张，时间长了，您就会形成一种特有的影响力。**


    张仪、苏秦，舌辩群雄，王者之师，安天下几十年。庞涓、孙膑，干戈天下，创造了很多有趣的故事，如图魏救赵，田忌赛马。这几人都具有强大的影响力。于是他们的师父鬼谷子，当然也就有了影响力。


    一个人想有影响力，教会几个人去风云天下，这个老师父，自然就具有影响力。这也是一条打造影响力的路子。


    近代有一个人，就是这种模式，打造得自己很具有影响力，各种达官'
