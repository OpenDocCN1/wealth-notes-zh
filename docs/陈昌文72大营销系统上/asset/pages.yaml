  md: '# 执行力的打造分两个方面


    执行力的打造分两个方面，

    **其一，外部环境塑造。**

    **其二，内部心态塑造。**


    下面我就这两个方面交叉着跟大家谈谈，希望大家竭尽全力的听话、照做、执行。


    内部心态塑造。

    放大目标，比如我要搞到一千万粉丝，天天念经一样的讲，我要搞到一千万粉丝，一定要搞到。目标具体化，我要20个微信全部加满，这是第一步，然后是第二步，要50个微信全部加满。继续细化，我要做36循环系统，要参考同行，要改编同行。


    为了配合内部心态变化，外部环境塑造。

    办公桌子上，贴着自己的计划，对自己的要求。比如，我自己电脑下面一张纸条，上面就写了我要干啥的计划。大家也可以在自己的床头，自己的办公室，自己的厕所，所到之处，全部贴上自己想要干啥，必须要干啥。您没执行力，就是您忘记了您的目标。


    外部环境塑造，拒绝打扰您的人与事。比如，猪朋狗友，不能赚钱的人，朋友、亲戚，不来往。

    我以前有个阿姨，经常给我打电话，一打就是一小时，聊些没用的家长里短。后来我意识到这样下去，我不能赚钱。浪费太多时间。她再打电话来，我就问她"您结婚了吗？""您离婚了吗？""您是不是又养了一个儿子？"多次问候，过后，这个阿姨觉得我神经病，风言风语，就不再给我打电话了。'
