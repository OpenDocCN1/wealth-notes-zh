  md: '# 与高手交往，要低调、低调、再低调


    不听高手的话语，是人的一个弱点，当然，也就是人性的弱点。有高手带您玩，是您的福分。但是如何听高手讲话，怎么听，态度如何好？让高手满意您？这个是一门学问。而我的做法，就是多沉默，多听高手的表达。


    高手的思维模式，项目，是真能让您的收入暴增几倍的。您必须多听高手的语言、话语体系。您不听，按照以前自己的思维模式，则收入就上不去。


    要注意自己跟高手的关系，不要让高手讨厌您。战战兢兢，如临深渊，如履薄冰。要学会尊重高手，跟随高手，大家都是出来混口饭吃，有高手带您，是您修来的福分，而不是成天找事。


    人要做到低调、谦虚、谨慎。人要做到沉默、寡欲、少说话。人一定要做到听高手的话，高手带着您玩，您才拥有一些金钱。千万不要骄傲，不要觉得自己牛B。


    要清楚的认识到，我们的成就，全靠高手带我们玩。高手要是不带我们玩，我们必定一无所有。


    这个世界上，牛人太多了。您必须低调、低调、再低调。您必须跟着高手混，高手带着您，您就有前途。哪天把高手得罪了。高手不带您了，您就傻眼了。


    做人啊，一定要低调，要多为别人想想，别人也有付出。其实一个人的成就大多是别人帮您的，您自己有什么本事呢？如果太高调，不会说话，别人就不带您玩了。'
