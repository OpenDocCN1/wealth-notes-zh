    我绝对相信简单的力量。我相信一切成就是有方法论的，蛮干，只是浪费精力、时间，而且人会迷迷糊糊的，越来越倒霉。时间的使用，首先应该单纯，然后是大块大块的使用。碎片化自己的时间，是极其愚蠢的。完全让自己的生命没有价值了。当今互联网是碎片化的时代，那可以用来碎片化别人的人生，但绝对不能用来碎片化我的人生。我的人生，应该是高质量的，是精简，简单到极致的，是要在一个方面有所成绩的。比如，我要做好老板社群，带着更多的人创业，学习互联网营销。


