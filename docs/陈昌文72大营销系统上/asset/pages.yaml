- pgno: 50
  md: '# ## 聚焦系统的核心是只聚焦一个项目


    太阳光不聚焦，任何人都不怕，一旦聚焦，可以点燃森林。


    一个人的精力是有限的，让您同时照顾1000个婴儿，您是照顾不好的。但是照顾一个婴儿，您是能照顾好的。


    做项目也是这个道理。


    我们大多数老板做生意，不赚钱或者亏损，是不是因为为您做的工作太多了，您的项目太多了？做生意失败的老板可以反思一下。


    一个人不能做太多事，一旦您的工作相当多，您的环节也相当多，您的手上有两个甚至多个项目在做，那么您注定是不赚钱的。这个就是我们聚焦系统能为您解决的问题。


    只能做一个项目，而且项目要环节少，只做变现这个步骤，其他一切外包。这个模式，才能盈利。


    比如我们在互联网上有很多渠道可以搞到免费流量，我们也可以找到非常多的零成本项目，很多人喜欢这里搞一下，那里扑一下，看到这个项目赚钱去碰一下，那个也去沾一下，那么结局就是几个月甚至一年下来也没赚到钱。在线下也是一样的。


    真正的聚焦不光是在工作上，项目上，要创业成功必须聚焦到生活的方方面面，这个系统会帮助您除了吃饭、睡觉、锻炼身外，其它时间全部是做项目，全部是在做跟变现最有价值的工作。在三个月之内完全执行到位，就彻底改变你的命运。


    只聚焦一个业务，一个项目。大道至简，我始终相信单纯的力量。聚'
