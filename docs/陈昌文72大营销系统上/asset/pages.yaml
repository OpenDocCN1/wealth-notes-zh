    善为天下公，道理很简单，不要有自己的理解，您才是高手。比如，我让您每天去摘 36 个视频，6~12 个账号，每个账号 3~6 个视频，去传抖音，去搞原创，您就去，别跟我扯犊子；我让您去摘
