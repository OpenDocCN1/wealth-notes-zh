  md: '# 近悦远来，是王道思想


    我们把自己的工作做好了，自己赚钱了，就有很多人来学习，人家就来了。我们对待自己周围的同事、朋友、合伙人好了，我们发达了，其他人自然来跟我们做朋友、同事，甚至伴侣的问题也解决了。


    我们不用出去跑客户，我们也不用出去天天找人来给我们交钱。我们只要把内容做得足够好，足够有价值，人家自然给我们付费了。


    **近悦远来，是做生意的核心，是王道思想。**


