- pgno: 26
  md: '**儒者，一定要严格要求自己。从日常行用做起，从身边的小事做起。**而不是漫无边际的空想。早起早睡，锻炼身体；严格的尊师重道；严于律己，从一而终；竭尽全力的工作，争取过上好的生活，让自己的父母也过上好的生活，让自己的伴侣、孩子也过上好的生活；每句话都是真话，不弄虚作假。为一个儒者，您必须做到身体健康，没有毁伤。心理健康，不让父母担忧，保全身体。


    您做不到爱自己，善待自己，别说您孝敬父母，爱他人；就说，您是一个儒者。


    有儒家思想，有陈昌文方法，有道有术，再不成功，就是您控制自己的能力有问题了。我相信儒家思想，因为这是大道。用这个大道经营，指导自己的人生，自己应该可以过上好生活。


    我写了一篇《论语》，是做圣人的方法。对我内心是非常有震撼的。


    我也想做法圣人，虽不能至，心向往之。我如何能做到呢？


    聚焦，坚持，做减法。只做一个项目，老板社群。彻底执行这个理念，绝对执行，不再如同前面几年那样，只是嘴里说，行动却跟不上。我绝对相信这条真理，我也希望各位找到自己的真理去执行。各位都会有成就。


    # # 儒家思想讲究 “诚” 字


    儒家思想讲究一个“诚”字。您做人做事是不是足够诚恳？比如营销，其实没那么多花里胡哨的，您就老老实实说，您是卖啥的，您能做到什么服务。没必要欺骗顾客，非要成交这一单。


    有些人，有些客户，不属于我们，不需要弄虚作假让他强行跟我们合


