  md: '工作做好，聪明人自然懂您，您的机会会自然多。通过骄傲引来的关注，其实价值不大，此人也不长久。


    要老老实实给超级高手交学费，老老实实交，虔诚的学习，不要骄傲，不要吹牛。老实点，低调、谦虚，此人就有前途。我呢，就有这样的机会，我自己没把握。从现在开始，我必须把握这种机会。


