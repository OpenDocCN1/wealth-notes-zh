  md: '滴水穿石，然后再干一辈子，日日不断之功，干一辈子一个项目，这样的人总是会有成就的。


    # ## 赚钱靠一个“熬”字


    要相信自己每天不断地奋斗，努力工作，工作做到位了，就一定有效果。永不放弃的干话，专注、专心自己的工作。而不是想着没收入怎么办？而不是老是想着为什么不赚钱！有的人天天哀嚎，没有利润，他又不去做粉丝，又不去做直播，又不更新朋友圈，又不发广告，很多东西做的一塌糊涂，他还天天着急不赚钱。


