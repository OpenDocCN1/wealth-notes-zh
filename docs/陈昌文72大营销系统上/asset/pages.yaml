- pgno: 179
  md: '# ## 文章的本质是产品，是服务


    文章的本质是产品，是服务。比如我搞创业项目，那么也就是说我的文章，必须给别人带去金钱。我做社群营销是赚钱的，那么我的文章，就教人搞社群营销，也就是我的文章，直接带大家赚钱。


    文章写得文采飞扬，其实没什么鸟用。只有带着大家真正赚到现金，才算有用。我的写作目标，是教会大家生存、营销，生活得更好。中国很多人都想要个服务、产品。于是我写作的东西，大家都越来越喜欢。写作的目的，一定是给人利益，让人得到金钱。讲课，做语音，做视频也是这样。


    当然，你教别人生孩子也行，因为这是繁殖的需求。你教别人赚钱，也行，因为这是生存的需求。写作，是为了生存*繁殖，为最终目的的服务。你卖产品，你的文章就要写出产品能给客户带来的好处。所有人，都是为了让最终目的的服务。


    生存，就是搞营销，卖产品，卖服务。


    # ## 文章系统是用来成交的


    文章系统释放到各大平台，是用来成交的。也是可以把内容做成视频、音频，上传抖音、快手、喜马拉雅，去吸粉的。'
