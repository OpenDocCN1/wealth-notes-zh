  md: '# 序


    营销，必须有文化体系，与方法论。


    营销的文化体系，就是儒家思想。


    营销的方法论，是陈昌文方法。


    **儒家思想+陈昌文方法，这是陈昌文老板社群的结构学说，专业研究互联网营销，打造互联网品牌化自动成交系统。**


    陈昌文方法，是专业解决互联网营销问题的一套行动方案+解决方案。


    解决方案是解决出单问题，解决赚钱问题，解决内容问题，解决营销问题，解决粉丝问题，解决微信、QQ 免费声明赚钱的问题，解决品牌的问题。


    行动方案=36 循环系统。


    客户是衣食父母。永远为客户释放最有价值的信息、方法论。36 循环系统，不是为了自己，而是为了客户获取最先进的思维模式、营销方法、营销资讯，帮助客户赚钱，告诉客户怎么做，做什么最有前途。告诉客户去哪里做，提供客户不知道如何干的解决方案，是陈昌文方法的写作，创作方向。


    **然后我们确定价值观建设：客户第一。**


    **使命建设：让天下没有难创的业。**


    也就是我们老板社群里的老板，都是这个目的：让天下没有难创的业。陈昌文方法，是老板们的营销方法，只要拿着这套方法论，去执行，就能让老板们少走弯路，靠近成功。


    我没办法保证您绝对成功，但我确实给您的是经我实践成功后，可以让您少走弯路，少出错的方法论。


    **有理论指导的营销方法，与没理论指导的营销方法，是两码事。** 陈昌文方法，就是专门解决老板互联网营销中的问题。属于一个系统，这系统就是为社会提供互联网营销、社群营销解决方案的。'
