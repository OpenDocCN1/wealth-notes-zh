  md: '# 传播的核心是文化母体


    文化母体的核心是什么？是历史故事、俗语、谚语、诗词歌赋。


    为什么歌曲能流行？《我的将军啊》、《青花瓷》、《男人哭吧哭吧不是罪》，这些为什么会流行？有文化母体。李玉刚的《贵妃醉酒》为什么能流行？有文化母体。


    所谓文化母体，就是这种东西，在历史上、现实里，都是家喻户晓的。谚语、俗语、历史故事，是不容反驳的。这样，人就容易接受。您有没有见过一个人，经常反对谚语的？反对历史故事的？反对俗语的？要么他是神经病，要么他是白痴，要么他是哗众取宠。一般他们都不会去反对文化母体。


    真正的高手，都是取势，这也是李嘉诚先生最重要的一招。也是雷军先生40岁的时候悟到的。任何东西，都有势。


    所谓话术，不过是言语；所谓演讲，也不过是言语。言语、声音的势是什么？势就是千百年来，重复的东西。经常重复的东西，就形成了势。所以，高手取势，顺势而为。他的每一句语言，受到了秦皇汉武、唐宗宋祖，受到了伟人、诗人，乃至圣人的加持。


    所以，我写《论语》，我讲“天行健，君子以自强不息。”这种话，有人反对吗？没人反对！为什么不反对？非不为也，势而不能也。


    为什么《青花瓷》、《贵妃醉酒》这种歌曲如此流行？为歌手带去了非常多的财富、地位、名声？因为青花瓷，就是我们的文化母体。杨贵妃，则家喻户晓。醉酒，这种事，在故事里、历史里、现实里，都经常发生。这些东西，都是文化母体。为什么《男人哭吧哭吧不是罪》这么牛B？因为这能唤起男人的心声。这在帮男人释放压力，这首歌里的势能是相当大'
