- pgno: 342
  md: '# 第三十六章


    # 陈昌文方法72大营销系统之影响力营销系统


    创业的初级阶段是卖产品、服务；中级阶段是搞营销；高级阶段是搞品牌；更高阶的是搞影响力。


    ——陈昌文'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 影响力的建立，首先是信任


    想在互联网上厉害，一定要打造自己的影响力。有影响力的人，做社交，好做。做营销，也好做。这个时代，是靠影响力打天下的时代，当然，也只有聪明人，知道影响力的重要性，知道自己的互联网影响力就是真金白银的财富。


    你想要很多粉丝，首先要传递您的影响力。您想营销，首先要传递您的影响力。您没影响力，就没法赚钱。


    **影响力的建立，首先是信任，别人信任您，您才可以影响到别人。也就是您承诺给别人的要做到。**


    说谎的人是愚蠢的。说谎，会导致别人揭穿您的谎言，导致您没有信任度，没有影响力。您言出必行，让人看到您说话算数，您的影响力就会越来越大。反之，您出尔反尔，经常狡辩，您的影响力就会灰飞烟灭。所以信用对一个打造自己影响力的人来讲，是极其重要的，不要乱说话。


    **做一个有影响力的人，首先要做一个好人，做一个善良的人，这样，大家才会信任您，喜欢您。**所以，在社交媒体上，不可口出恶言，只引人向善，这样喜欢您的人才越来越多。当您的粉丝越多，您说的话都必须全部是正能量的。您的人品好，您为粉丝出谋划策，粉丝看了您的言论受益，则您具备粉丝影响力。反之，您人品差，不为粉丝着想，粉丝看了您的言论反而受害，则您不具备粉丝影响力。想要有粉丝影响力，您首先得为粉丝付出。


    **权威的建立，是建立在实力的基础上，真诚是实力的一部分，勤奋工作也是实力的一部分。您只有拿出实际的东西，您说的话，别人才相'
  merge: -1
