- pgno: 84
  md: '要写，就是一篇文章。我觉得，专心致志的写长篇文章，并不累，累的是随时随地的写碎片文章，写短篇文字，这就如永远在短跑，然后停下来，继续短跑。永远在启动，停下来，启动，停下来之间循环，这是最累的。


