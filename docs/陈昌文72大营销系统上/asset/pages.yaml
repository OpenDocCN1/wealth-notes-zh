    不需要那么多技巧，不需要那么多谋略，我们做事就是行王道，踏踏实实的干，释放干货，一切都全有了。


    如果我们照顾不好我们已经有的粉丝，已经有的客户，我们就会一无所有，有的人都会跑掉。如果我们照顾不好跟着我们的员工、同事、合伙人，这些人都会跑掉。如果我们连自己都照顾不好，我们就会一无所有。


    **近悦远来，把自己管理好，把已经有的事情做好。**也就是说向内求，儒家思想，总是向内求，而不是外求。


    现在很多企业，自己的事情都没做好，成天在外面宣传。打铁还需自身硬，自己没真本事，即便是给您个机会，您也做不起来。自己不会营销，即便是碰到好产品，也只有吃瘪。


    **近悦远来，意思就是要对身边人好**，这样，大家就支持您。近悦远来'
