  md: '我有一个学员，有时候收入非常高，有时候收入非常低。有天晚上，我问他为什么？他说，有其他事情耽误了。我总想这样说，年轻人，您应该只顾工作，其他事情，少做，用钱解决。几千块，就能让其他人给您做事，干活。不要耽误自己重要的时间，要聚焦自己的业务。这个如果不懂，就很难混好。


