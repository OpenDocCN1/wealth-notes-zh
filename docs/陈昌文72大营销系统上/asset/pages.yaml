    您每天都要早起早睡，锻炼身体，然后周而复始的工作，日日不断地干活。有些人的能力差，是在不断地锻炼过程中，才进步的。做一个项目，要永猛的干下去，要天天都去喊这件事，您才能提升自己。要永不放弃，不能说我今天干的多，明天不干了。也不能说我明天使劲干，今天不干了。要一直都在干。这样的人必定有成绩。


    生意当然是有波动，时好时坏的，您不能说，生意好了我就骄傲。生意差了，我就颓废，就难受。您只管一如既往地，日日不断地把工作做的越来越好。把视频做爆了，把粉丝做多了，把直播讲好了。系列化，干


