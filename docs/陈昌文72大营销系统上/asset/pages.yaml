- pgno: 133
  md: '# ## 一个高手行走于世，永不犯错


    一个高手行走于世，永不犯错，永远不让任何人抓到把柄，这是一个高手行走于世的准则，请尊重法律法规，请尊重那些虎视眈眈的妖魔鬼怪。


    免责声明，比什么都重要。切记，先说好，则后面不乱。否则，您就难受。


    **想要玩指数级模式，必须要搞清楚法律风险，必须要搞清楚人性风险；**这玩意，也不是一般人能玩的。


    **做人，做生意，一定要讲规矩。规矩比钱重要，也比生意重要。**不讲规矩，丢失的是信誉。规矩，保护自己，也保护客户。不讲规矩，一时得利，长久失败。


    所有网络营销高手，第一招，**只学免责声明**。如果做生意，违法律风险都不能避免，这个人就不用做生意了。这个人，就是给自己挖坑嘛。完全没必要。


    所以，我希望所有知道我的老板，都要研究我的免责声明系统，并且自己活学活用，学透彻，然后建立自己的免责声明系统，防止有小人找事。


    以下，我会以我们老板社群的免责声明系统为例，为大家讲解。各位老板参考，回去做自己企业的免责声明系统。'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 做生意的第一步，学会写免责声明


    任何人做生意的第一步，是学会写免责声明。


    不是什么人的钱都要赚。不要给自己惹麻烦，不要那么急躁，赚钱慢下来。很多人在网络上做生意，做项目，为了出单，胡乱承诺，这种做生意的思维是非常愚蠢的。


    自己心里是怎么想的，就非常坦诚的表达。比如知识付费、社群消费、培训消费，付费后不退款，这种信息，要传递给客户，以及任何潜在的客户。不要怕客户看了不爽，看了不爽的人，本身就不是我们想要的客户。客户付费，让其承担一切责任，比如学不会，学不懂，都是他们自己的事情，而不是我们的事情。这并不是说我们就不认真教学了。相反我们是非常认真教学的，这样写的目标，同样是过滤掉不理解网络培训消费，知识消费不退费的人。同样是为了过滤掉胡搅蛮缠，不讲道理的人。剩下的，就是那些理智、智慧，具有财富的人。这样的人，才是我们永恒的客户，我们能有幸服务好这些智慧、聪明、讲理，讲礼貌的人就万幸了，就非常忙，很累了，没必要为了赚钱，破坏原则，胡乱承诺。


    做生意，要有原则，客户跟我们做生意，必须完全按照我们的教学，我们的流程来。不按照我们的流程，不听我们的思想、知识、方法论，指手画脚的，我们根本不要这种客户。我们时间宝贵，也懒得争论。


    我们要的是什么样的客户？长期了解我们，对我们人品肯定，觉得付费跟我们学习是非常值得的，什么心态？就是把这钱给我们，就当把这钱扔水里了，也值得的人，才加入我们的社群。无这种心态的人，不适合付费加入我们，学习任何课程。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# 免责声明的核心是什么？


    免责声明的核心，就是出现任何问题，解释权在我们手上。我们永远对外是零承诺的。


    我们会尽力做好我们的服务，但不会给顾客任何决定性的承诺。


    为什么我们要这样做？


    就是避免有些恶意分子，故意找我们麻烦。所以，大家必须把免责声明，发给您自己的客户。**赚钱是小事，不要给自己找麻烦，才是大事。**


    比如，我们所有社群，都是自愿进群，都是被动成交，绝对不做主动成交。


    所有在网络上做生意的老板，都应该请律师给自己摘免责声明，请律师做合同，也发给您的客户。出现任何问题，第一时间找律师即可。


    **任何人，都要在朋友圈里更新免责声明。**


    **任何人，收人钱财之前，都必须是免责声明先行。**


    **任何人，做直播，都要讲免责声明。**


    您们必须是懂法律的高手。您们不要给自己惹麻烦。要让您客户没有任何办法找您麻烦。从法律上完全防止有人可以找您麻烦。


    希望您都成为年赚千万的高手，也希望您们一辈子平安，不要跟负能量的人接触，不要赚他们的钱。这个是每个做互联网创业的人必须讲到位的东西。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 免责声明写得越好，成交率越高。


    免责声明是可以赚大钱的。能把免责声明写仔細的人，成交率会提高几倍。因为，免责声明代表您的底牌，您的诚意，您的信用。


    免责声明是您过滤人以及赚钱的纲领性文件。免责声明写得越好，成交率越高。而且，负能量的人越不会成交。


    免责声明，首先保护自己。


    我有个学员，我让其做免责声明，他不做。


    我说，您做了免责声明，成交率会更高，信不信？


    他说，我负责了，别人就不加入了？还更高？赚钱，不都是多承诺吗？


    我说，错误。您承诺的少，把道理讲清楚，智慧、聪明的人认可您，这样，就会成交率高。而您不说清楚，老是承诺，没有免责声明，加入的都是些做白日梦的人。还喜欢找事，我们生意越做的越来越差。


    免责声明，实际上是智力门槛。


    而智力高的人，明白知识智慧这事，学不会是他們自己的事情，不是我们的事情，我们就是努力教，您认可这种模式，就来，否则，就别打扰了。


    我这个学员最终还是听了我的话，结果以前3天出一单，现在一天出好几单了。


    请各位做好免责声明，记住，不是什么人的钱都赚。免责声明做得好，出单更精准，大家都快乐，都愉快。如果你们只是为了赚钱，对不起，你们根本赚不了什么钱，因为您的免责声明没做好。


    其实免责声明是可以加速成交的，不要不敢做免责声明，这是成交'
  merge: -1
  img_proc: true
- pgno: 137
  md: '利器，是筛选器。


    我们现在在网络上做社群营销生意，培训生意，都是免责声明给客户看的，都是我们没有任何责任，付费后，不退费，讲清楚。


    前几年，我们有的兄弟觉得，这样干，会导致我们的成交率变低，收入变低。其实并没有啊，反而收入在增长，麻烦也几乎没了。因为每个人进群，学习，都有免责声明。也就是您喜欢找我们麻烦的，您干脆别来跟我们学习，我们懒得赚您的钱。您抱着把钱扔了的态度，来找我们学习。说白了，您肯定值，不会亏。但是，您必须抱着学不到东西，也认了的态度，我们才收您。否则，您留着急您的钱，我们价值观不一样，不交流得好。


    这就是儒家思想，谈得来，谈；谈不来，不谈。开始，就明白白白的讲清楚。收入下跌了吗？没有。一直在增长，成交率也在增长。


    所以，人越坦荡越好。价值观必须正直，必须讲真话，一句假话都不能说，也只交往讲真话的人，身边讲假话的人，全部清理掉。不行贿，严格遵照规则，凡是喜欢打破规则的人，一律不交往。不要有丝毫跟价值观不正的人交往的念头，丝毫也不行。正直，不欺骗，是根本。


    免责声明能提高成交率。写得越具体，越明白，成交率越高。做项目，要坦荡，找客户也要坦荡。坦荡不是让您陪客户聊天，而是通过朋友圈，通过广告尾部巴系统坦荡。越坦荡，越明白，成交率就越高。不仅仅是要求自己，还要求客户。客户看懂了自动买单。看不懂，我们也懒得搭理。就用这个态度去做。


    很多人不理解，为什么要做免责申明，这样搞，是不是成交率低了？


    错了，看似条件苛刻，实际上筛选到了精准客户，筛选到了了解我们的高智力客户。这才是最高明的。做生意要绝对聚焦，对客户也聚焦，经营精准优质客户，才能做得长远。什么客户都想抓，是自己给自己找麻烦。'
  merge: -1
  img_proc: true
- pgno: 138
  md: '每个人都必须写好免责声明，把一切法律风险降到最低，这是我们的生命。如今，在互联网上不做免责声明，不规避法律风险，进去，只是早晚的事。


    # 做社群营销，找的是学习理由，而不是承诺


    做社群营销，不是努力承诺，而是可以学到什么。不是承诺别人可以发财，财富自由等。不是承诺别人提高收入。前一种推销方式，吸引的是理智的、聪明的人。后一种推销方式，吸引的是好吃懒做的赌徒。


    在网络上做社群服务，就是学习服务，学习微商，学习创业，学习网络营销，都是以“学习”打头的，人们进来学习。我们也只收那些想学习的人。大家付的是学费，就是这个思维。我们是卖课程，卖知识。以文字、语音、视频，各种方式进行授课的社群。而有人的广告，却老是收进来想一夜暴富，进群坐着就发财的人。进群马上就能成为富豪，进群马上就能一天赚几万，几千。这样搞广告，收进来的，就是这种人。


    这种人到底是什么人？我是压根都不想接触的。我们收的，只是管理层，中小企业老板以上的人。我们根本就不想收那种没能力的人。这人能不能赚钱，完全是自身素质决定的。


    不是付费加入我们群，就直接可以暴富的。


    广告是这样写的：


    学习如何做微商，


    学习如何做朋友圈，'
