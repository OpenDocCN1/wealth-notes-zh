- pgno: 81
  md: '8、我有三宝，一曰慈，二曰俭，三曰不敢为天下。本质上也都是求简单的事情来做。简单了，自己脑袋就清晰了，然后什么事情都做好了。人简单了，就能处理好各种关系，处理好自己的业务。简单本身就是神。一个问题简单了，一件事简单了，您会做，大家都会做，大家都跟随，然后您就做大、做强了。


    # 网络营销，越简单越好


    网络营销，是越简单越好，简单到极致，简单到只有一件事。只有一件事，我们才能生存。否则，我们毫无出路。什么时候，您只有一件事了，您就会变成神。


    理解了我们的业务范围非常小，我们的产品简单，才能有未来，否则，没有未来。简单才是力量，简单才是未来，才是真理。我们是简单赚钱学派的，绝对不搞复杂的事情。所有人跟着我学习，也是只研究一个点，一个环节，其他环节，由社群里的其他人配合完成。


