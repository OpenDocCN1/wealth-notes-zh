  md: '在工作，或者锻炼身体。


    自律包括、1、不说废话；2、不交废人；3、不偷懒；4、肯学习，肯专研；5、严格的作息；6、日复一日辛苦劳作。


    不自律的人呢？干一会，就累了。连一周的自律都做不到。别说3个月，甚至3年了。我们想要出单，首先应该修炼自己的自律能力。


