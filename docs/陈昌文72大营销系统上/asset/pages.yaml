  md: '贵人，都去他那里找他，其门庭若市，却也不见真人，实在有趣，我是佩服得很呐。


    山雨欲来风满楼，黑云压城城欲摧。能吟诗作赋，句子优美，朗朗上口，能舌辩群雄，能骑马定乾坤者，必定是优秀人才，有影响力的人。也就是，此人，要么能文，要么能武，要么能文能武。要是啥都干不了，还想有影响力，此人是痴心妄想，白日做梦，想早地拔葱呢？人啊，没有影响力，就去打磨自己的才华，以及业绩。


