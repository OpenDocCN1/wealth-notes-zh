- pgno: 322
  md: '# # 什么是自由


    什么是自由？


    人生苦短，譬如朝露，去日苦多。您每一秒钟的放纵，都在积累真正的永久的痛苦。


    自律，看似痛苦，但实际上，时间长了，会带来正面的效益，会带来心理的爽快，会带来收入。


    放纵，带来的是一时的爽快，而心里更加纠结、痛苦。


    自律呢？带来的是身体不舒服，但是心里舒服。


    人生没有两头甜，您选吧。您要折磨自己的内心，您就放纵，被欲望侵蚀。您要解放自己的灵魂，您就自律。


    自律，任何人只要学会了这两个字，都可以取得成就。但我们总是拖延，说好了去健身，不去。我们总是不忌口，说好了，不要暴饮暴食，我们控制不住。我们说，我们要努力工作，但是我们欺骗自己而已。我们说了，我们要聚焦，做减法，要不一而终，做着，做着，又忘记了。


    人的自律，不过就是早起早睡，管住嘴迈开腿，锻炼身体，努力工作。一切成功者，都是平凡的、自律的人而已。就这么点事！一个人做不到自律，其他的，都是白说。


    能规律生活，能管住自己，只做正事的人，都天下无敌。其他人，都不怎么样。'
