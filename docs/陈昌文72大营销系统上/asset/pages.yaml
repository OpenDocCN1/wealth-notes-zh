- pgno: 148
  md: '听话、照做、执行。这种事情，谁能听得懂？只有张无忌啊，马云啊，任正非啊，彭蕾啊，这些角色听得懂。其他人？没几个人听得懂。只有郭靖这种大侠才听得懂。大部分人都是杨康，以为自己很聪明。


