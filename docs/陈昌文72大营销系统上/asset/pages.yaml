- pgno: 320
  md: '正能量的录音不断地洗脸自己。人的脑袋要反复洗，要用语言不断地洗，然后自己痛定思痛，不断地沉思，这样逼迫自己前进。然后，一定要搞力量训练+有氧运动+戒色。这三招做到了，您的精神状态就会好。然后努力做项目，这样，就能改变您的命运。色情是最快速让一个人变成废物的途径。


    一切失败，莫过于不能控制自己，任何一个人，只要愿意控制自己，都能有成就，大小不同而已。高手，不过是一直修炼控制自己的 能力。


