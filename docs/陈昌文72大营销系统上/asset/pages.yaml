    大多数人的动作是废动作，反动作，跟赚钱无关，浪费精力。对的事情一件没有做，光做了错误的事情。比如，陈昌文老板社群，现在就宣传好儒家思想+陈昌文方法72大营销系统，然后做系列化视频，这样就是最有前途的，但是好像很多人不会这样去做。


