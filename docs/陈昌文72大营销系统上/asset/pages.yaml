    任何一个项目，一个关键词，任何一个社群，只要持续一辈子锁定，就一定有前途。反正，只要您持续锁定一辈子一个关键词，一个项目，您就必有所成。只是大多数人非常慌张，干几天，几周，几个月就不干了。您问他，去干啥了？他也不知道他去干啥了。非常惊奇。


