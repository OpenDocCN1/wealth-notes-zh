- pgno: 227
  md: '# # 日日不断，滴水穿石


    日日不断，滴水穿石，从一而终，是统一的哲学关系。日日不断，必须跟着我们的5大锁定系统结合。5大锁定系统，是我们赚钱的灵魂。谁领悟，而且执行，这一辈子不可能混得差。


    做什么都要日日不断，不能说今天不想做了，也不能说今天的活干了，明天就不干了。在任何时候，任何情况，都是工作要紧，卖点要繁。锁定一个卖点，日日不断地卖，日日不断地营销。


    多多少少，您都要干，也就是无论遇到什么情况，您都必须付出努力。付出心血，日日不断地弄。人是要日日洗脸的，人必须日日纠正自己的错误，大多数人都不具备纠正自己错误的能力。


    日日不断地想办法营销一点人，想办法增加一点粉丝，想办法做更多的业绩，想办法爆粉+搞直播+朋友圈变现，日日更新。谁断了，道场就断了。道场断了，一辈子水都烧不到100度。


    我见过很多一直很努力的人，一辈子没什么成绩，重要的就是他们喜欢中断。所有的高手，自己的工作极度热爱，所有的高手，都是日日不断。逝者如斯夫不舍昼夜。


    某篮球巨星，只有在父亲去世的那天上午没有打篮球，下午又去打了。某作家，总是日日不断地写作。


    所有的高手，都是对工作极致的努力，无一例外。所有的神人，都是呕心沥血的工作，工作就是一切。生活、睡觉，都是为了工作。这样工作做好了，才拥有一切。


    无能的人会被淘汰，物竞天择，适者生存。没有什么好可怜的，一个'
