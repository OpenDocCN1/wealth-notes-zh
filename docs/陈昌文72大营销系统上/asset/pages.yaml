  md: '# 人要识抬举


    感恩。对于带着我玩的老板、企业家、学员、老师，我都要感恩。我本质是没什么本事的，全靠您们带着我。


    大多数人都是不识抬举的。我也不识抬举。有人抬举我，我就翘尾巴，一会就忘记了我们之间的社会地位差距。不过现在呢，由于我天写《论语》，自己也学会了谦虚、谨慎。不过还没学到骨子里去。什么时候，学到骨子里去了，我什么时候，才会大展宏图。


    遇到高人了，我就要耐心的跟随，耐心的听话，耐心的牺牲一点东西。人要是都懂感恩，识抬举。这人发展的应该多快啊。


    可惜，大部分人毫无感恩之心。索取无度，只想收获，不想付出。


    这就是大多数人无论如何蝇营狗苟，也是毫无意义的原因。


    我拜了一个恩师，我交了很多学费，我非常开心。我拜师的目的，并不是为了学到什么。我拜师的目的，不过是认认真真的跟着老师做事。我认为一切学习，不过是实践。


    我也带过很多学员。有的学员总是为难我，他们用各种问题来刁难我，他们希望问倒我，以此来证明我的无能。真是幼稚啊。


    跟老师学习，无非就是老师说咋干，您就咋干，不要跟一个小学生一样，以为自己还在读书呢。


    我们混社会了，做好内容，吸引到粉丝，出单才是王道。连这个都听不清楚，那么这个人基本也是无用的啊。'
