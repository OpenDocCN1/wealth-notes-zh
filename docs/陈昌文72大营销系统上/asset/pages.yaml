    # ## 儒家思想就是向内求


    行有不得反求诸己。事情，都是我的错，我要想办法解决，跟任何人没关系。这就是儒家思想。儒家思想就是凡事向内求。


    把自己那一个环节做好，那一个小点做好，做到极致，自然有人跟您合作，您就会活得越来越好。金钱是对您做好事情的奖励。


