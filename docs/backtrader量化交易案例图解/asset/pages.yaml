  md: "```\n# 创建一个自定义策略类 class\nclass TQSta001(bt.Strategy):\n\n    def log(self,\
    \ txt, dt=None):\n        # log 记录函数\n        dt = dt or self.datas[0].datetime.date(0)\n\
    \        print('%s, %s' % (dt.isoformat(), txt))\n\n    def __init__(self):\n\
    \        # 默认数据一般使用股票池当中下标为 0 的股票\n        # 通常使用收盘价作为主要分析数据字段\n        self.dataclose\
    \ = self.datas[0].close\n\n    def next(self):\n        # next 函数是最重要的交易(运算分析)函数\n\
    \        # 调用 log 函数, 输出 BT 回测过程当中\n        # 工作节点数据包 BAR, 对应的收盘价\n        self.log('close\
    \ 收盘价, %.2f' % self.dataclose[0])\n        #\n        # 使用经典的\"三连跌\"买入策略\n   \
    \     if self.dataclose[0] < self.dataclose[-1]:\n            # 当前收盘价格, 低于昨天(前一天,\
    \ [-1])\n            if self.dataclose[-1] < self.dataclose[-2]:\n           \
    \     # 昨天的收盘价格(前一天, [-1]), 低于前天(前两天, [-2])\n                # \"三连跌\"买入信号成立\n\
    \                # BUY, BUY, BUY!!!, 买! 买! 买! 使用默认参数交易: 数量、佣金等\n             \
    \   self.log('设置买单 BUY CREATE, %.2f' % self.dataclose[0])\n                self.buy()\n\
    ```"
