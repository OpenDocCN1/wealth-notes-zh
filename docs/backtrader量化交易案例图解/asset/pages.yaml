    其他还有订单执行情况查询函数，以及一些专业交易参数设置等。


    经济人内置的佣金信息函数，可以通过参数获取不同交易所的当前佣金信息。大多数交易软件的佣金模块都采用dict字段模式，方便k-v值的调用。


