- pgno: 90
  md: "```\nreturn\n\n# 检查订单 order 是否完成\n# 注意: 如果现金不足, 经纪人会拒绝订单 reject order\n# 可以修改相关参数,\
    \ 调整进行空头交易\nif order.status in [order.Completed]:\n    if order.isbuy():\n   \
    \     self.log('买单执行 BUY EXECUTED, 报价: %.2f' % order.executed.price)\n    elif\
    \ order.issell():\n        self.log('卖单执行 SELL EXECUTED,报价: %.2f' % order.executed.price)\n\
    \n    self.bar_executed = len(self)\n\nelif order.status in [order.Canceled, order.Margin,\
    \ order.Rejected]:\n    self.log('订单 Order: 取消 Canceled/保证金 Margin/拒绝 Rejected')\n\
    \n# 检查完成, 没有交易中订单 (pending order)\nself.order = None\n```\n\nnotify_order函数的主要功能是检查订单执行情况，如果前面设置的交易订单还未执行，那么在后面设置的交易订单默认不可执行，这样可以防止同一订单被重复执行。\n\
    \n在实盘操作中，会出现多个交易订单被同步设置的情况，这一问题可以通过调整量化软件的相关参数来解决。\n\nnotify_order函数比较专业，大家无须关注细节，直接调用案例模板即可。"
