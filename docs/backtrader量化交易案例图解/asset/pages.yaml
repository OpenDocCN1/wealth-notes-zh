- pgno: 103
  md: '# 6.2 交易佣金（Commission）


    在交易所进行买卖时会产生很多交易费用，例如股票的印花税、手续费等，这些交易费用又叫作交易佣金。目前对于交易佣金，全球没有统一标准，因为每个国家的法规政策不同，所以交易税费差别很大。


    此外，各个交易所交易佣金的计算方式也不同，有的交易所根据交易总额按比例收取，有的交易所设置最低佣金、最高佣金等。同一个交易所的交易佣金也会因为汇率变化、推广活动中的优惠政策等产生变化。


    与交易佣金相关的数据设置过程非常烦琐，BackTrader量化软件特意设置了一个独立的交易佣金子模块库，对这些数据进行了封装，大大简化了用户的编程和设置工作。用户只需要设置一个固定的佣金比例即可，交易佣金比通常是千分之一。


    如图6-3所示是交易佣金子模块内部属性分布图。'
