    因为本节案例的实际利润总额才几元，与最终资产总值相差太大，所以在进行对比测试时可以减去起始资金，而使用利润总额数据。


    下面看一看MA均线策略的优化过程。在案例中，默认的MA均线的时间周期参数是15天，对应的测试数据利润总额是7.05元。


