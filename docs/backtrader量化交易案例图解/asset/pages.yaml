- pgno: 260
  md: '# 11.1 量化回测分析流程


    从本章开始讲解BackTrader的实盘操作。前面章节讲过，一个完整的量化回测分析/交易流程可以分为四个步骤：


    +   - 第一步设置一个回测主函数。

    - 第二步设置量化回测参数。

    - 第三步调用量化回测程序，开始run运行量化回测分析。

    - 第四步回测数据分析，或者根据回测推荐结果进行交易。


    其中，第二步的量化回测参数的设置相对比较复杂，包括设置数据源、起始资金、回测数据、读取数据、添加数据，以及进行数据清洗等预处理工作，然后，添加策略和与策略相关的变量参数、策略分析参数。


    第三步的调用量化回测程序和第一步的设置回测主函数类似，都很简单，通常都只有一行代码。


    在BackTrader量化软件中有一个独立的Btrun子模块，其架构图如图11-1所示。Btrun子模块用于命令行模式运行量化程序。


    ![](img/1c2fa9d9dc5f4ecf1f6a4ce7faab4913_260_0.png)'
  merge: -1
  img_proc: true
- pgno: 261
  md: '在run量化回测运行完成后进入第四步，即回测数据分析，包括绘制量化分析图。


    所有的量化策略在进行回测数据分析时，最重要的指标就是ROI投资回报率。在实盘操作查看收益图时，大家最关心的也是ROI投资回报率。


    ROI指标重点在于检验策略模型的盈利性，如果ROI投资回报率为负数，或者低于市场的平均水平，那么该策略模型后续就不要再使用了，说明其稳定性和盈利性非常差。'
  merge: -1
  img_proc: true
