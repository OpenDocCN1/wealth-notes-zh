- pgno: 92
  md: "```\ndef next(self):\n    # next 函数是最重要的交易（运算分析）函数\n    # 调用 log 函数，输出 BT 回测过程当中，工作节点数据包\
    \ BAR， 对应的收盘价\n    self.log('收盘价 Close, %.2f' % self.dataclose[0])\n    #\n  \
    \  #\n    # 检查订单执行情况，默认每次只能执行一张 order 订单交易\n    # 可以修改相关参数进行调整\n    if self.order:\n\
    \        return\n    #\n    # 检查当前股票的仓位 position\n    if not self.position:\n\
    \        #\n        # 如果该股票仓位为 0，可以进行买入操作\n        # 这个仓位设置模式，也可以修改相关参数进行调整\n\
    \        #\n        # 使用经典的\"三连跌\"买入策略\n        if self.dataclose[0] < self.dataclose[-1]:\n\
    \            # 当前 close 价格，低于昨天（前一天，[-1]）\n            if self.dataclose[-1] <\
    \ self.dataclose[-2]:\n                # 昨天的 close 价格(前一天，[-1] ), 低于前天( 前两天，[-2]\
    \ )\n                # \"三连跌\"买入信号成立\n                # BUY, BUY, BUY!!!, 买！买！买！使用默认参数交易：数量、\n\
    \                self.log('设置买单 BUY CREATE, %.2f' % self.dataclose[0])\n     \
    \           # 采用 track 模式设置 order 订单, 回避第二张订单 2nd order\n                self.order\
    \ = self.buy()\n    else:\n        # 如果该股票仓位>0，则可以进行卖出操作\n        # 这个仓位设置模式，也可以修改相关参数，进行调整\n\
    \        # 此处使用经验参数：\n        #   前一个订单，执行完成 (bar_executed) 5 个交易日后\n```"
