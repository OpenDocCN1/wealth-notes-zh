- pgno: 113
  md: '由图6-6可以看出，经纪人模块主要子模块有：


    +   BrokerBase，经纪人基础类。


    +   MetarBase，经纪人元数据类。


    BackTrader量化软件的一个特点是使用了大量元数据类（Meta），方便进行扩充。


    BrokerBase经纪人基础类是所有代理人模块的基础，定义了主要的相关类函数。


    其中以“_”开头的函数是类内部函数，其他主要函数有以下几类。


    +   常规量化操作函数：next、stop、submit、start、cancel、init。


    +   数据设置函数：set_fundshares、set_fund_history、setcommission、set_fundmode、add_order_history、addcommissioninfo。


    +   数据获取函数：get_fundvalue、getposition、get_fundmode、getcash、getcommissioninfo、getvalue。


    +   其他类函数：sell、buy。


    在经纪人模块中，还有关于资金方面的函数，包括起始资金设置与查询：


    ```

    print(''\n#2,设置 BT 回测初始参数: 起始资金等'')

