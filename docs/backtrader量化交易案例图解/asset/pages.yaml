    所以笔者个人认为，人工操作是量化交易的最后一道防火墙。因为很多被计算机认为合理的策略，在进行人工操作时很容易就能发现问题所在。


    量化策略一定要通过长期的测试，以防止意外情况发生，量化程序中的海量数据计算、参数优化，都必须通过计算机进行，但最后的决策还是由人工操作的。


