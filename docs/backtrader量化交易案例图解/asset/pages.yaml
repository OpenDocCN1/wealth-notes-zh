  md: '# 前言


    BackTrader是源自欧洲的开源量化软件，也是目前金融行业应用最广的量化分析软件。BackTrader属于单机量化软件，支持“7×24”小时高强度的实盘工作模式。


    任何行业都存在技术更新迭代的问题，人们对于专业技能的升级应用，正是社会蓬勃发展的驱动力。在金融行业中，BackTrader无疑是从業者更好地预测、分析未来发展趋势的必需品。学好了BackTrader，就相当于在金融市场多了一套披荆斩棘的投资利器。


