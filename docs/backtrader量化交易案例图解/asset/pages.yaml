  md: '# 内容简介


    本书采用生动活泼的语言，从入门者的角度讲解BackTrader专业量化软件的使用方法和实盘操作技巧，同时结合国内股票市场、期货、外汇等实盘交易数据进行量化分析实例讲解，包括股票价格分析、量化策略编程、策略参数优化等。书中包含大量简单风趣的实际案例，内置专业模块结构图和相关程序源码，方便初学者入门学习，以使他们能快速掌握BackTrader的使用方法，为日常实盘操作奠定扎实的基础。'
