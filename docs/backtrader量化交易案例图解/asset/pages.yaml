    CSV格式的数据文件，在本质上是一个txt文本文件，便于查看和编辑。txt文本格式是很重要的属性，大部分用户往往会忽略这一点，而会基于容量等原因采用一些其他的非文本格式。


    采用非文本格式，看起来数据量会小一点，但在实际使用时，特别是在不同程序之间进行数据交换时，过程会非常复杂，有时甚至还需要


