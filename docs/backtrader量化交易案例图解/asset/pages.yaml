    df.sort_index(ascending=fgSort,inplace=True)  #True: 正序\n```\n\nBackTrader数据使用的是系统内部的格式，这个格式虽然也是OHLC格式，但与Pandas有所不同，即无法直接兼容。如果用户不看源代码，则很容易混乱，所以我们特意开发了这组数据读取函数：pools_get4fn。"
