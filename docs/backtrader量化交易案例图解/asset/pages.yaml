- pgno: 72
  md: "在以上策略程序代码中的log输出函数和init初始化函数都采用策略默认代码，不需要过多关注。\n\n买入策略编程的核心是sta001策略函数中的next节点策略执行函数。\n\
    \n本案例使用“三连跌”买入策略。\n\n```\ndef next(self):\n    # next 函数是最重要的交易（运算分析）函数\n    #\
    \ 调用 log 函数，输出 BT 回测过程当中\n    # 工作节点数据包 BAR，对应的收盘价\n    self.log('close 收盘价, %.2f'\
    \ % self.dataclose[0])\n    #\n    # 使用经典的\"三连跌\"买入策略\n    if self.dataclose[0]\
    \ < self.dataclose[-1]:\n        # 当前收盘价格，低于昨天（前一天，[-1]）\n        if self.dataclose[-1]\
    \ < self.dataclose[-2]:\n            # 昨天的收盘价格（前一天，[-1]），低于前天（前两天，[-2]）\n    \
    \        # \"三连跌\"买入信号成立\n            # BUY, BUY, BUY!!!, 买！买！买！使用默认参数交易：数量、佣金等\n\
    \            self.log('设置买单 BUY CREATE, %.2f' % self.dataclose[0])\n         \
    \   self.buy()\n```\n\n这是一个很简单的实盘策略，即股票价格连续下跌三天：今天价格比昨天价格低，昨天价格比前天价格低。价格连跌三天，就可以使用“三连跌”策略买进。\n\
    \n这种策略是一种经验型策略，交易逻辑是：价格已连续多日下跌的股票，再继续下跌的可能性很小，价格反弹的概率很大。\n\n虽然这是经典的实盘策略，不过在具体运用中还是需要进行测试的。因为市场不同、产品不同，使用策略就不同，实盘操作的差异会很大，在使用每一种策略时都要进行测试。"
