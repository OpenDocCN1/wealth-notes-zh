- pgno: 213
  md: '# 9.5 SQN指数


    SQN指数全称是System Quality Number，即系统质量指数，用来评估量化策略的优劣。


    在金融行业，一切都靠数字说话，因为在进行金融交易时，会产生大量的交易数据，仅由人工对这些交易数据进行分析肯定是不现实的，必须借助计算机进行辅助分析，所以大家都在寻找能够稳定盈利的量化投资策略。


    SQN指数的计算公式：


    SQN=root(n)×expectancy/stdev(R)


    （SQN=交易次数n的平方根×交易系统的期望值/期望值的标准差）


    其中，


    root（n）：一年交易次数n的平方根。


    expectancy：交易系统的期望值，以倍数（风险回报比）表示。


    stdev（R）：期望值的标准差。


    评测的交易总次数最多不能超过100，当然，交易次数也有下限，即不能少于30。当交易数量≥30时，SQN指数通常被认为是可靠的。


    SQN指数具有如下意义：


    +   • 交易次数越多，获利机会越大。

    • 风险回报比越大越好。

    • 风险回报比的标准差越小，交易结果越具有规律性，回撤越小。


    SQN指数公式很简单，要优化SQN指数也很简单：


    +   • 使交易次数和平均风险回报比的乘积尽可能大。

    • 使公式中的期望值标准差尽可能小。


    如图9-12所示是SQN指数子模块架构图。'
