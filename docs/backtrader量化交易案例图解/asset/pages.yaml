  md: "由图5-9可以看出，其主要相关的子模块库有： Analyzer、 Strategy、 Transactions等。\n\n下面看一看notify_order交易订单执行状态检查函数代码：\n\
    \n```\ndef notify_order(self, order):\n    if order.status in [order.Submitted,\
