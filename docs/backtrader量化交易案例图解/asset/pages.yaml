- pgno: 276
  md: "```\n# 检查当前股票的仓位 Position\n    if not self.position:\n        # .\n       \
    \ # 如果该股票仓位为 0，则可以进行 Buy 买入操作\n        .....\n    else:\n        # 如果该股票仓位>0，则可以进行\
    \ Sell 卖出操作\n```\n\n在执行买卖交易的时候，需要确认当前的 Position 数据，检查 Position，只有持有当前股票才可以进行卖出操作，如果没有持有当前股票就无须进行后续的操作，这也可以提高回测运行效率。\n\
    \n在 next 策略函数运行时，相关的数据源、指标参数都已经在 init 函数中设置完成了。\n\n在默认情况下，BackTrader 量化程序不支持空头交易，需要通过参数设置调整，必须持有股票才能卖出，即\
    \ position 函数必须处于非零状态，才能进入卖单操作，但买单没有限制。\n\n当 position 函数检查仓位数不为零时，系统自动运行，转到买入操作流程，进行买单操作。\n\
    \nBackTrader 的 Position 很灵活，用户可以自行设置，例如按持仓 100 手以上或者超过多少资金再进行卖出，也可以按当前持有现金的比例购买股票。"
