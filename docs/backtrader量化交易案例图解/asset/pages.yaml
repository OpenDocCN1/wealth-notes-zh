- pgno: 120
  md: 'Sizer子模块主要用于Broker经纪人及Strategy策略类。如图6-8所示是BackTrader量化软件中的Sizer子模块架构图。


    ![](img/1c2fa9d9dc5f4ecf1f6a4ce7faab4913_120_0.png)


    图6-8 Sizer子模块架构图


    Sizer类主要用于控制每次交易数额，默认交易数额是1手，也可以采用百分比参数，使用仓位比例，通常情况下，20%的仓位比例是比较稳妥的。


    在量化程序中交易数额通常都是等量模式，以便于管理和分析。如果采用动态交易数额，则很容易出现混乱。


    定量模式的缺点是Position（仓位控制）不好把握。Position是量化交易分析的重点，在通常情况下，仓位控制受交易者个人经验和习惯的影响最大。


    大部分量化交易策略并不强调过于细化的仓位管理，有些策略甚至是满仓操作，BackTrader量化软件默认是定量买入，全仓卖出。'
  merge: -1
  img_proc: true
