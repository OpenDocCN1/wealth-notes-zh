    - 第二步设置量化回测参数。

    - 第三步调用量化回测程序，开始run运行回测分析。

    - 第四步回测数据分析，或者根据回测推荐结果进行交易。

    - 运行程序，生成如图13-9所示的Signal信号交易模式结果图。


