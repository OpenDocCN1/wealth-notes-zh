    \ if tim9str=='' else dt.datetime.strptime(tim9str,'%Y-%m-%d')\n    #\n    df['openinterest']\
    \ = 0\n    #\n    data = bt.feeds.PandasData(dataname=df,fromdate=tim0,todate=tim9)\n\
