- pgno: 255
  md: '是一种傻瓜行为。”


    他说：“一个人无论如何能力超凡，如果生命不复存在，财富就是虚无；财富于人，是一个从无到有、从有到多再到无的过程，如果生命消亡，一切财富都将归于尘埃。”


    西施问：“现在是开讲关于财富的哲学吗？”


    鸥夷子皮：“我并不是要探讨财富的哲学意义，我是在提醒大家，人生有限，应追求有限的财富，通过学习，掌握财富的变化规律，学会在有限人生中利用适合的财富，而非追求无限的财富。”


    他接着说道：“每个人，都是一个微型经济体，都是财富的创造者——我这里所指的财富——不是宗教、精神、艺术意义上的精神财富，而是金钱。人的一生之中，存在着不同的阶段，每个阶段有不同的人生需求目标，每个阶段的金钱收入与支出变化有一定的规律性，这种人生中金钱收支情况不同的时期，我称之为人生财富的生命周期。”


