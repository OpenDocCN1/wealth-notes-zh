    他找来一张纸，在纸片上开始写公式：


    如果将年利率记为AR，月利率记为MR，日利率记为DR，按年的计息周期为t期，总利率为r，那么，对于这些不同计息周期的利率，传统计算方式就是：


    AR=12MR=365DR


    总的利息率：


    r=AR×t=12MR×t=365DR×t


    他说：“普通大众通常将计息方式理解为单利法，那么，总利率也就是各计息周期的利率与相应计息周期的总数算术相乘。”


    西施有点茫然：“难道不是这样的吗？”


    鸥夷子皮呵呵一笑：“与普通大众的传统看法大相径庭，在银行、典当行或放贷公司等金融行业中，除了对储户的利息支出是按单利法方式外，行业的惯例大都是按复利方式计息，例如，银行的房贷借款合同列明，以年利率为基准利率，根据情况上浮或下浮一定比例，作为实际贷款年利率，按月计息，按月还款；银行信用卡使用章程规定，持卡人如果在到期还款日前未全额还款，应支付透支款自银行记账日起至还款到账日的透支利息，日利率为万分之五，透支利息按月复利计收……”


    西施问道：“这种标明年利率为AR，但却按月或按日复利计息后的实际年利率，到底会和AR有多大差别？”


    鸥夷子皮又开始在纸上写公式：


    如果将AR记为名义年利率，将实际年利率记为EAR，将一年内的计息周期记为m，Rm是每个计息周期的利率，那么，根据复利的定义，可以得出以下计算公式：


    EAR=(1+Rm)m-1


