  md: '那么，真如江湖传言所说，是范蠢亲自经营商业投资而成为巨富大贾？老习我不才，虽天性愚钝，却喜钻牛角尖，对于范蠢放着高官不做而下海经商的理由是，担心被勾践加害之说一直困惑不解。老习我于是按照现代行为心理学的理论和方法，尝试对勾践进行心理分析和性格解剖。根据巴普洛夫的神经活动类型学说，勾践主要神经活动应属神经系统兴奋过程与抑制过程相互作用的强度、灵活性和平衡型三方面的强平衡而不灵活型。就是神经兴奋和抑制力量都强而平衡，但兴奋和抑制之间的交替不灵活；间或表现为抑制性，也就是神经的兴奋与抑制力量都弱；这类神经活动的气质是黏液质型伴随一定的抑郁型，对环境刺激的感受性强，对生命冲动的耐受性也强，具备这种气质的人一般体格高大魁梧，其性格类型为黏着性，其心理特征为：意志坚定、严格自律、精力充沛、情感不易外露和性格宽仁，而勾践的气质和性格完全符合这种特点：忍耐力超强，毅力超群，易于自制，虽然固执，但本性仁厚。


    我们从勾践最终处置夫差的态度上可以看到：其仁慈之心未泯。勾践对夫差苦大仇深，势不两立，人所共知，但当勾践围困夫差三年将要彻底击溃夫差之时，反而心慈手软，他感念夫差昔日对自己的不杀之恩，不忍击溃对手，准备放他一马，反而是在范蠢的坚决制止下，才发起了最后的冲锋；当夫差被活捉后，勾践甚为同情他，愿意无偿行政划拨一块土地给他，而不是采取“招拍挂”制度让他高价买地来进行房地产开发，勾践愿意给夫差丰厚的养老待遇，让他安度晚年。以勾践这种心态，对其不共戴天之死敌尚不忍心赶尽杀绝，怎么可能忍心对穷途末路时陪伴他、激励他、帮助他、对他忠心耿耿的良师益友加患难兄弟——范蠢动手？所以，范蠢出走是恐惧勾践会出手残害之说，是完全不合情理的，是牵强附会的，更是荒诞可笑的，勾践深知这一点，范蠢智商超凡，更清楚这一点。


