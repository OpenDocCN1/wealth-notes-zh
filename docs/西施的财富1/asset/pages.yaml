    2.  支付30%首期房款，杠杆为3.3倍，收益率是3.3倍。


    3.  支付50%首期房款，杠杆为2倍，收益率是2倍。


    鸭夷子皮说：“首期房款支付比例不同，杠杆不同。同样的房价涨幅，如果是全额付款，没有杠杆，那么，投资收益率就等于房价涨幅；如果有杠杆，杠杆不同，投资收益也就各有不同，杠杆会将房价涨幅放大数倍不等。”


