  md: '# 三、对房子估值


    房子的合理价值等于其年租金除以年利率。


    白圭说：“房价暴涨，确实让房地产产业上下游行业的各色人等，大都获得不同程度的暴利，但也加重了普通大众的生活负担。并且，炒房子让不务正业的人暴富，会让人不再专注于实业，只想炒房牟取暴利。”


    鸱夷子皮摇头：“房子既然是投资品种，能让人暴利，也会让人巨亏，完全视乎买房人对于房价的判断，以及是否能合理把握房子的价值，如同股票一样，如果以远远超出其合理价值以外的价格接手，就存在巨亏的可能。”


    西施问：“房价会如同股票般涨跌吗？人们不都是理性买房吗？”


    鸱夷子皮道：“人们在初始进行房地产投资时，大都要分析房子的投资价值。通常要考察房子的地段、环境，要了解户型、楼层，要结合房子的功能属性——住宅、商铺、写字楼、厂房等，以及付款方式，制订不同的投资方案。或长线投资，或短期转手买卖，或是‘炒楼花’——开盘时只交定金再转给他人的短炒。如果人们都是严格按此操作的话，房地产的'
  merge: -1
  img_proc: true
- pgno: 229
  md: '投资就应该是理性的。


    “但现实情况并非如此。随着房事的逐渐炽热，房价的涨速加快，房地产暴利的示范效应逐渐扩展开来，不计价格、不管价值，只求抢到房子的人越来越多，疯狂的人只求一房在手，别无所欲，根本不在乎价值几何，房子就意味着暴利，房子就意味着财富。如此一来，购房的人越疯狂，房价的上涨也越疯狂；房价上涨的越疯狂，让更多的人购房越疯狂，疯狂的人和疯狂的房价相互刺激，此刻，房子已不再是投资品种，而成为炒作工具，成为击鼓传花的道具。大众的抢购，只是为以更高的价格向下家转让，买房完全成为博傻游戏。”


    西施问：“既然房子很容易成为炒作工具，那么，到底应该怎样判断房子的合理价值？应该怎样给房子估值？”


    关于对房子的估值问题，鸱夷子皮给出以下分析：


    我们知道，房子每年会产生租金收入，按照财富管理的现金流理论，房子的价值 $ V_{1} $，就是其使用年限内的年租金和最终残值的现金流贴现。假定第 $ t
    $ 年的年租金收入为 $ R^{t} $，贴现率为 $ i $，其最后的最终残值为 $ a $，其最后使用年限为 $ n $，那么房子的价值 $ V $：


    ```

    $V=\sum_{t=1}^{n} \frac{R_{t}}{(1+i)^{t}}+\frac{a}{(1+i)^{n}}$

    ```


    根据这个公式，房子的价值是其实际使用年限内的年租金、按贴现率 $ i $ 进行贴现的年金数列，再加最后处置价残值的贴现值的总和。但房子的使用年限一般较长，长达数十年，甚至上百年，在漫长的时间里，受通货膨胀影响，房子的年租金会有很大幅度变动，难以精确确定，因此，这个公式无法准确计算房子的价值，只是一个理论性公式。在实际分析时，可以参照股票估值的市盈率公式，用下面这个简单公式来计算房子的价值：


    ```

    $V=R/i$

    ```


    按照此公式，房子的合理价值等于其年租金除以年利率。也就是说，在房子的价格不高于其合理价值的情况下，其租金收入，不应该少于同等


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_229_0.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: '金额的资金从银行所获取的利息收入。如果房价高过这个合理价值，与其买房子收租，还不如直接将资金存银行收取利息更简便，因此，房价超出这个合理价值的话，房子就失去投资的意义。


    鸥夷子皮讲完，西施说道：“按照这个公式，刚才所举案例中的100平方米的房子，年租金为3.3万元，如果按一年期定期存款利率为3.5%计算的话，其合理价值仅为3.3÷0.035=94.3万元，而其价格却达到了300万元，看来已经丧失投资价值，只能是炒作的道具。”


    鸥夷子皮点头认可，他说：“实际上，当资产泡沫化严重时，疯狂的投机者根本不会理会投资价值的高低，只会博取差价，不管价格多高，只要确定有傻瓜会以更高价格接手，就毫不犹豫抢购。买房，由投资成为击鼓传花的博傻游戏，只要鼓声不停，房子有下家接手，就会获利。在这种群体非理性疯狂炒房的热潮下，房价，永远没有最高，只有更高；房价，和投资价值无关，和群体心理相连。买房，是一种赤裸裸的炒作游戏，只看概念，只凭个人喜好。只要有稀缺的概念，只要能让人喜欢，只要能满足大众的收藏心理，不管价格多高，都有人敢接盘。只要是名人住过的别墅，只要是曾经的王府，不管是深藏在风景旖旎的深山，还是坐落于蔚蓝海岸的海边，都会被各色富豪以惊人天价延揽在怀。”


    西施说：“只涨不跌的房子很容易给人这种错觉——买房能保值，房子是最好的投资品种。但是，房子就真的的是能保值的最好投资品种？”


    猗顿笑着说：“二八韶华少女的美貌让人迷恋，也让为其动心的男人欲长相守而终生相伴，但青春少女总有年老色衰之时，只因美貌而心动，终归也会因美色不再而绝情。同样，上涨的房价，对买房人来说，就如少女一样迷人，可是，这世界上真有永恒的爱情吗？真有永远上涨的房价吗？不管你们信不信，我是不信的。相信房子会保值，就像相信姑娘越老越美一样幼稚而可笑。”


    鸥夷子皮说：“正如一棵树永远不可能一直高到天堂里，高度膨胀的资产泡泡，最终也会破裂。我们知道房价之所以长期上涨，是城市化、人'
  merge: -1
  img_proc: true
- pgno: 231
  md: '口红利、通货膨胀、收藏偏好和投资投机等因素的综合作用，如果这些因素消失，甚至转成相反的作用后，房价的走势就会大逆转。


    “我们前面讲过，房价会跟随经济增长的长期周期，呈现出总体上涨的趋势，但是，无论经济增长的周期多么漫长，有高潮，就会有衰退，随着生育高峰期出生人口的逐渐衰老，人口红利会消失，城市化进程也会消失，经济的增长会放缓，对房子的需求会减少，房子的供给反而在老龄化社会会大为增加，在这些因素的共同作用下，无论房价上涨得如何离谱，最终都要放低疯狂的牛头，掉头向下调整，到了那时，大众的心理又将转变为极度恐惧下跌，就会不择价格卖出，房价会在短期之内，回归投资价值。”


    鸭夷子皮继续说：“房价，或许在经济发展的某个阶段，会出现比较剧烈的涨幅，但如果按长期经济周期的时间计算复利的话，其年均涨幅并不会太高，或许都不一定能跑得过通胀。所以，在一个正常发展的经济体系中，房地产投资的收益率并不会很高；房地产投资，也不是人们首选的投资品种，所以，说房地产会保值，一定要给它一个期限，在某个时期，可能具有保值功能，但从长期来看，房地产并非只涨不跌的保值工具。”


