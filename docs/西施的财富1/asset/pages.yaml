  md: '# 四、论欲望：中国人的需求层次理论


    > 永忆江湖归白发，欲回天地入扁舟。——（唐）李商隐


    湖光秋月两相和，潭面无风镜未磨。不知何时，一轮明镜挂上夜空。太湖之上，秋月初上，一派空灵、缥缈、宁静、和谐的境界。


    西施在旁插话，打破僵局：“老范的意思是说，只有克制欲望，才能享受平和自由的生活吗？”


    范蠡说：“欲望是人的本能，是人对能满足自我身心需要物质的渴望，表现为诸如衣、食、住、行、性、尊重、认可、快乐、自信、幸福、自由等物质和精神的需求形式。人类为实现欲望而劳动，欲望是人类产生、发展和进步的根本动力，一切人类活动——无论是商业、政治、战争，还是文化、教育、宗教、艺术等，都是人类为满足欲望而驱动的结果。”


    范蠡对欲望展开论述：


    在经济学领域，将有能力满足的欲望称为需求。米国人马斯洛创立“马斯洛需求层次理论”，将需求分成七类，包括：生理需求、安全需求、归属与爱的需求、自尊需求、知的需求、美的需求和自我实现的需求'
  merge: -1
  img_proc: true
- pgno: 60
  md: '等，各层次需求具体为：


    +   生理需求：包括呼吸、水、食物、睡眠、生理平衡、分泌和性等。生理需求是维持人类生存及繁衍的最基本需求，也是推动人类劳动和工作的首要动力。


    +   安全需求：是指对安全、有秩序环境的需求，包括稳定的职业、生活的保障等。


    +   爱的需求：是指希望与他人建立情感关系的需求，如交朋友、对爱情的追求等。


    +   自尊需求：是指受到别人尊重的需求，例如让个人的能力和成就得到他人或者社会的承认或赞许等。


    +   认知需求：是指知识和理解方面的需求，例如：通过学习，掌握知识和技能等。


    +   审美需求：是指对美的需求。


    +   自我实现需求：是个人理想得以实现的全部需求，包括：道德、创造力、自觉性、问题解决能力、公正度等方面需求的满足。


    根据马斯洛的的解释，七层需求分为两类，较低四层为基本需求，较高三层为高级需求。只有低层需求被满足后，高一层的需求才会产生。基本需求是基于生理或心理上的欲望产生，通过外部条件的实现得以满足；高级需求则是主观欲望，必须通过内部因素才能满足，当个人经济、教育环境较好时，往往追求高层次的需求。


    范蠡说：“马斯洛的需求层次理论，是建立在西方的宗教文化基础上来解释人的欲望和需求的，我国几千年的东方国粹文化，显然完全迥异于西方文化，在中国式传统文化的长期熏陶下，国人的需求，相比马斯洛所定义的西方人的需求，应该差别很大。我将国人的需求层次进行了归纳，也分为七层，也包括高低两种层次，在低层次基本需求方面，国人和西方人是一样的，都有生理需求、安全需求和爱的需求，但在高级需求上，国人和西方人的需求就大相径庭了。”'
  merge: -1
  img_proc: true
- pgno: 61
  md: '范鹾将国人的七层需求层次归纳如下：


    +   1. 生理需求：包括空气、水、阳光、食物、性、衣服、住所这些维持人身生存和繁衍的需求。


    +   2. 安全需求：包括人身安全、健康保障、财产保障、工作职务保障、家庭安全等安全性需求。


    +   3. 爱的需求：对亲情、友情、爱情的需求。


    +   4. 享乐的需求：对食物、性、衣服、住所和其他物质的奢华需求。


    对物质的高级需求，不是为维持基本生理需要，而是为享乐，为刺激身体感觉器官的需要。对物质的享乐需求，包括：美食、名牌服饰、奢侈品、高档汽车、豪华住宅和美女等。


    +   5. 等级地位的需求：对等级地位的需求，体现为对权力的追求。权力是打开一切利益金门的万能钥匙，不同的等级地位具有不同的权力，所以，等级地位，没有最高，只有更高。对于权力需求者来说，不择手段向上爬，施展阴谋诡计，从而取得更高的等级地位，就是人生的终极需求。


    +   6. 被敬仰崇拜的需求：仁义礼智信，是中国文化在道德领域的标杆，是社会精英的高级精神需求。仁义礼智信，看似宣扬的是君臣父子朋友相互间的责任，从而使社会精英自愿赋予对他人的责任，但在本质上，强调的却是低等级地位者对高等级地位者的责任，规范的却是低等级地位者对高等级地位者敬仰崇拜的行为准则。仁义礼智信的道德观，并非追求相互平等的责任和尊重，而是高等级地位者为低等级地位者树立的一种礼仪标准。


    +   7. 青史留名的需求：国人自我实现的最高境界是名载史册，青史留名。活着，要被人当成神，被当世崇拜敬仰；死后，继续当神，被后世人敬仰崇拜。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/2c0d8ae8066e23466ace2db16d84ed63_62_0.png)


    范蠡说：“这七层需求中，较低三层需求是低层次的基本需求，是身体或心理上的需求，所有人都要满足生理需求、安全需求和爱的需求三个基本需求。一部分人在先富起来后，基本需求得以满足，有了追求享乐的需求、追求等级地位的需求，这两层需求是低等级地位者的高级需求。而最高两层的需求，是社会精英的高级需求，是高等级地位者在精神上的需求。”


    文种：“你这个本土化的需求层次理论有点意思。绝大多数普通大众整日忙碌，谋生不易，身心疲惫，因此，当基本需求得以满足后，享乐需求就成为高级的精神需求。”


