  md: '续时间不会长久，风光时间只不过‘各领风骚五八年’而已，如一些体育明星、娱乐明星等，虽然奖金、出场费和广告收入等收入惊人，但高收入的时间无非其名声斐然的几年。而各行各业中小企业主的收入，也难言能长久乐观，据统计，中小企业主平均寿命不到7年，大企业平均寿命不到40年，真正基业长青的企业，就像彩票大奖获得者一样稀罕，所以，中小企业主或大公司高管的收入，并不像大众想象的那样可以一直持续。这些收入看似很高，但持续时间并不长久的人士，其身家资产，可能并不一定像大家想得那么雄厚。”


    猗颂说：“有一些职业，看似收入并不顶尖，但却能长久持续，而且从业时间越久，收入越高，例如一些名医、名律师或者名会计师等专业人士，对这些人给的估值，应该不同于那些明星吧？”


    鸥夷子皮：“一个年收入1000万元但只能盈余100万元的明星，和一个年收入150万元但同样每年盈余100万元的专业人士，估值是一样的吗？我们下面就会计算不同种类人群的估值。”


    鸥夷子皮给出了对人估值的理论和公式：


    根据财富管理理论，资产的价值，是其每年现金流贴现的总和。对资产进行估值，最精准的方法，就是计算其每年现金流的贴现值，以及其最后清算价格的贴现值，加以汇总，求得其价值。对人进行估值，与此类似，也可以套用这种现金流贴现估值法。但对资产估值不同的是，人的收入产生时间是有限的，大部分人从22岁开始工作，到60岁退休，产生现金流的期限，最长也就38年，而工作开始的前几年，收入普遍较低，收支基本相抵，产生净盈余的时间，一般也就30年。


    假定估值时的贴现率为r，每年净盈余为ARi，按照现金流贴现法，可以对人的身家V列出以下计算公式：


    ```

    V = $\sum_{t=1}^{30} \frac{AR_{i}}{(1 + r)^{t}}$

    ```


    也就是说，人的身家V，实际上是一个由每年净盈余构成的为期30多'
