    鸥夷子皮接着讲：“理解了信用卡的计息方式，也就不难理解白毛女悲剧产生的根源。将年利率折算成月利率，甚至折成日利率，然后再按复利方式计算利息，这并不是简单的数学算术题，这种计息方式，称为‘驴打滚’或‘利滚利’，按这种方式计算的利息，时间越久，增长越惊人。如果对此一无所知，不懂得规避高利贷利息增长的时间风险，任由利息跟随时间复利增长，利息最终将成为债务人无法承受的沉重枷锁。”


    西施点头：“这种利息增长方式，确实太吓人了！”


    鸥夷子皮：“贷款行业按照这种复利方式计算利息的话，日息1分，并非是指月息30%或年息365%，而是月息34.8%或年息36.8倍，年息将是按单利方式计息的10倍多！月息30%，也并非指年息3.6倍，而是年息22倍，按复利计算的年息是按单利计算年息的6倍之多！如此，我们就不难理解杨白劳仅仅借贷100元，一年后的利息就能达本金的1377倍，所以，白毛女的悲剧，从杨白劳借款的那一刻起就已注定。”


