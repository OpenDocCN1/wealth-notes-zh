  md: '# ## 二、通货膨胀是把双刃剑


    通货膨胀会让财富流逝的准确含义应该是：通货膨胀，会让货币对内贬值，会让银行储蓄贬值，但是，这种贬值，实质上却是财富的一种转移。


    西施问道：“通货膨胀既然这么可恶，会让财富贬值，为什么国家不控制通货膨胀而任由其损害普通大众辛苦积累呢？”


    鸱夷子皮道：“通货膨胀会让财富流逝的准确含义应该是，通货膨胀会让货币对内贬值，会让银行储蓄贬值，但是，这种贬值，实质上却是财富的一种转移。通货膨胀是把双刃剑，让一部分人群财富受损的同时，会让另一部分人受益。”


    鸱夷子皮首先归纳出通货膨胀的受益群体：


    +   1. 政府，是通货膨胀的最大受益者。通货膨胀，是一个国家的纸币供应超过市场实际需求的结果，实质就是政府通过增发货币而增加收入，相当于政府的一种隐性税收，可以称之为“通货膨胀税”。政府增发货币，也就是凭空发行钞票，用来支付政府所购商品和服务，超量的货币供应使得货币贬值，民众财富的购买力受损，受损的部分财富，却转移为政


    财家教育自选图书'
