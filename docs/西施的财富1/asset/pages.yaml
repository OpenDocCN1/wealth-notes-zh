- pgno: 141
  md: '# 五、年金


    这种在一定时期内每期收付金额相等的现金流称为年金。


    鸥夷子皮继续讲道：“在日常经济生活中，经常会出现这样的现象——理财或投资行为分为多期、每一期现金流相等，例如，在利率不变的情况下按月向银行缴纳房屋贷款的还款、按月缴纳租金、按月缴纳社会养老保险金、按月或按年缴纳商业养老保险金、按月领取养老金等，这种在一定时期内每期收付金额相等的现金流称为年金，一般所指年金在期末收付，也被称为后付年金；在每期期初收付的年金则被称为先付年金，先付年金每期收付都在期初，相当于后付年金多一个计息期，可以通过增加一个计息期，将先付年金转为后付年金。进行投资决策时，经常要用到年金的现值和终值。”


    猪顿问：“应该如何计算年金的现值和终值呢？”


    鸥夷子皮：“我们并不需要分别计算每期的现值和终值，再去相加，而是可以利用公式，求得年金终值系数（FVIFA）和年金现值系数（PVIFA）。”'
  merge: -1
  img_proc: true
- pgno: 142
  md: '他列出了年金终值系数和年金现值系数的计算公式：


    $FVIFA = \sum_{i=1}^{t} (1+k)^i = \frac{(1+k)^t - 1}{k}$


    $PVIFA = \sum_{i=1}^{t} (1+k)^{-i} = \frac{1 - (1+k)^{-t}}{k}$


    他说：“公式中，k是年金贴现率，t为年金的计息期。根据公式，分别制作有年金终值系数表和年金现值系数表。附录中的表3是年金终值系数表，含义是每期1元的年金在不同期数和不同贴现率水平下的年金终值；附录中的表4是年金现值系数表，含义是每期1元的年金在不同期数和不同贴现率水平下的现值。利用表3和表4，在计算年金终值或现值时，只需找到既定贴现率水平和计息期数下对应的系数，再与相应的年金相乘，就能求得年金终值或现值。”'
  merge: -1
