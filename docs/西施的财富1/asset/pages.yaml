  md: '蒋顿：“房子和古董，收益性高，但流动性差，难以变现，风险也高；现金或货币式基金，流动性很强，风险很小，但收益也最差；股票和债券，随着收益的提高，风险也会增加。”


    鸥夷子皮：“理财和打高尔夫具有高度的相似性，理财的金融工具就像高尔夫球包里的不同球杆，各自作用完全不同。股票、债券、房地产、货币式基金、偏股型基金、黄金、期货和古董收藏等品种，在收益性、风险性和流动性方面，具有不同特征，理财功能各不相同；正如高尔夫球包中14只球杆的作用也各不相同，1号杆和7号杆的功能完全不同，挖起杆和推杆的用法也大相迥异。如果说，理财所追求的收益率，正如高尔夫所追求的距离性，理财所追求的安全性，正如高尔夫所追求的精准性，高尔夫球杆追求的距离越远，精准性越差；金融工具追求的收益性越高，安全性越差。”


    郑旦说：“老师真是个高尔夫高手，用高尔夫球杆类比理财工具，既形象又通俗。”


    鸥夷子皮说：“如果将理财工具比作财富球包中的几种球杆，那么，期货、期权等衍生品或其他保证金交易品种就像1号木杆，房地产投资就像3号木杆，收藏品艺术品就像5号木杆，这些金融品种追求的是收益性的高低，收益率越高，风险越大；股票、债券、偏股型基金、偏债型基金、黄金或其他贵金属等金融品种，就像几只不同型号的铁杆，追求的是收益性和安全性的平衡，安全性越强的，收益性越差；而现金或货币式基金就如果岭上用的推杆一样，是为了精准实现人生的需求，安全性最强，收益性最差。”


    鸥夷子皮说：“我来总结一下今天所讲的理财工具的特征吧。”


    他对常见的投资品种简单分析如下：


    +   1. 股票。股票是最常见的金融品种，是一种权益凭证，代表的是持有人对股份公司按相应股份享有的权益。上市公司的经营有好有坏，但经营良好的公司就要向股东派发红利，所以，股票具有收益性，是一种良好'
  merge: -1
  img_proc: true
- pgno: 296
  md: '的投资品种。成熟经济体系的股票收益率是所有投资品种中最高的，根据统计，长期持有价值股的年均复合收益率为9%。股票具有高收益高风险的特征，既能让人的收益以惊人的复利增长，也可能让人血本无归。对于巴菲特这类投资大师来说，股票是实现财富增长的最佳投资工具。但是，对于平庸的投资者来说，股票会让人噩梦连连。


    2. 债券。债券是一种债权凭证，代表的是持有人对发行人的债权权益。持有人投资给债券发行人，就享有按照约定得到利息收入、到期还本付息的权利。债券自身能带来利息收入，具有收益性，所以，债券也是一种常见的投资品种。债券的等级由专业机构进行评级分类，根据评级不同，风险和收益各不相同，等级越低，收益越高，风险越高。债券的风险主要来自，债券发行人无法偿付本金的违约风险、利率风险、通货膨胀风险等。债券的利息收入固定，收益稳定，是中老年人投资的良好理财工具，但通常难以抵御通货膨胀对其收益的侵蚀，难以充当中长期财富增长的工具。


    3. 基金。基金是一种天然的投资品种，基金契约约定，投资人将资金委托管理人管理，取得收益后就要向投资人分红派息，所以，基金本身具有收益性。根据约定不同，基金分为不同种类，根据是否公开发行，分为公募基金和私募基金；根据资金投向不同，分为私人股权基金、对冲基金和共同基金；根据行业不同，分为证券基金或房地产基金；根据投资对象不同，分为偏股型基金、债券型基金、平衡型基金和货币式基金等。基金是财富保值增值的良好配置工具，选对合适的基金，就可满足投资人不同人生财富生命周期的不同需求目标。


    4. 房地产。房地产能带来租金收入，自身具有收益性，是当然的投资品种。房地产投资是一种较长周期的投资，如果要进行长线投资，房地产就是资产配置的最佳品种。


    鸥夷子皮讲到这里，他说：“以上这四大类金融工具，是最常用的投资品种，应用得当的话，就能实现财富的稳定增长。”


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_296_0.png)'
  merge: -1
  img_proc: true
