  md: '# 六、论幸福：一船明月，一竿悠闲


    谁解乘舟寻范蠡，五湖烟水独忘机。——温庭筠（唐）


    湖上清风徐来，水波不兴。月亮不知何时已隐身山后。


    范蠡望着茫茫夜色，说道：“同样的世界，为什么同样经历的人会有不同的人生？人生之所以结果大不相同，在于我们做出了不同的选择。人生就像一场考试，每一个重要事件都是一道选择题，不同的考题根据对人生命运重要性的不同，而有不同的分值。当人生之路快到尽头之时，命运就是对人生考卷进行的打分，分值的高低是看人生选择题是否按照自我的内心感受进行了正确地选择。如果按自我的内心感受选择得越多，那么考卷的得分越高，越符合自我的意愿，人生越满足、越知足，人生的幸福指数也越高。”


    西施在旁边插话问道：“到底什么是幸福？”


    范蠡反问道：“那你觉得幸福是什么？”


    西施闭目想了一下，说：“我觉得幸福是一种感觉，一种心境，一种体验；幸福是一次微笑，一次感动，一次震撼；幸福的感觉如风，如日月光辉，如虚幻梦境，靠近可以感受得到，远离却不知如何挽留。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '“幸福是口渴时你倒水给我喝的感觉，是累了倚靠你的感觉，是我们刚才依偎在一起看日落的感觉，是带着孩子在草地上嬉戏奔跑的感觉，是梦想和你在一起而最终在一起的感觉，是老年之后携手散步的感觉……”西施说着，声音是兴奋的语调，夜色遮盖住了她泛红如桃花般的脸，而幸福的神情无可阻挡地向四周洋溢弥漫。


    范蠡也感染到了西施的幸福，他将西施搂将过来，轻轻拍了拍她的肩膀，对她的爱意表示认同，他说：“人们通常将快乐的感觉视为幸福，快乐是欲望得到满足、需求得以实现后，身体器官上的一种愉悦感；快乐之所以称为‘快’乐，是因为这种愉悦感来得快，去得也快，当需求被满足后，人们有了快乐，但这种快乐随着满足次数的增多而呈现边际递减效应，经常吃鲍鱼、喝拉菲的快乐恐怕要比第一次吃大餐的快乐弱很多；人们满足了一种需求又会有更高的欲望，物欲需求没有止境的话，终究会让欲望无法满足，就会痛苦，无法快乐。所以，追求物质享受、放纵欲望，虽然会带来短期的快乐和快感，却感觉不到幸福。快乐并不等同于幸福。”


    文种说：“我是这样理解的，幸福是一种长久持续的生活满足感和因满足而带来的长久持续的愉悦感。幸福本质上是一种知足感——对自己的生活现状感到知足；幸福和知足成正比，越容易对现状知足，越感觉幸福；幸福和欲望、需求等级成反比，物质欲望越强烈，需求等级越高，越不容易幸福。”


    范蠡点头称是：“老文说得对。欲望的满足只会带来短暂的快乐，但欲望的存在却更容易让人痛苦。动物只要不患疾病，食物充足，就会满足，就会幸福；人本该也如此，可是现实却不是这样。每个人看似都在为幸福而努力奋斗，可是幸福却像空气一样，看不见抓不住，总是难以把握。放眼望去，绝大部分的人都疲惫不堪，忙碌的身躯下隐藏着一颗不幸福的心，或焦虑、或紧张、或抑郁、或麻木。社会底层的人在为生计奔波，感觉幸福遥不可及，是有钱人的奢侈品；而上流社会的成功人士呢？同样感觉幸福遥不可及，他们酗酒、吸毒、纵欲和享乐，通过种种方式满足生理'
