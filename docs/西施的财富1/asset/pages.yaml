  md: '鵂夷子皮继续说道：“我已老矣。内心已经彻底丧失了追逐财富的热情，金钱于我是身外之物。但按照财富的规律，只有具备对金钱的渴望和热情，才会拥有源源不断的动力去增长财富。所以，我不适合去创造财富。而你正当年轻，有充足的精力和热情，从事投资理财，既可以当做生活娱乐的游戏，也可以成就一番事业。从明天开始，我就像个老猎狗一样，对你和道生进行专业投资理财培训，你和道生亲身去实践吧！”


