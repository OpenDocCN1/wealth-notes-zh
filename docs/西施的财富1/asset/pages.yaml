    西施问：“理财，是为了让生活更轻松？”


    鸥夷子皮：“我们讲过，人生在不同阶段，有不同的理财需求。理财，就是要通过适合的资产配置，实现这个需求，从而让财富满足人生各阶段的需求，从而让人自由和幸福。理财，很像打高尔夫球，不是要把球打多远，而是要把球打进果岭上的洞里的；果岭上的球洞，就像人生目标，是理财需要完成的需求。实际上，理财就是通过制定和实施资产配置规划，从而实现人生目标的一个过程。"”


    猗顿问：“应该如何理财？”


    鸥夷子皮：“首先，要将头脑用正确的财富理念武装起来。只有理念正确，才能拥有和守护财富；缺乏正确的财富理念，即使因某种运气而偶然获得巨额财富，最终也会守不住财富，任其流失殆尽；财富的流逝方式，不是被别人骗走，也不是被别人抢走，而可能是巨额亏损，或是被通货膨胀悄悄地、一点点地侵蚀。”


    “理财，要认清人生目的，不能被财富羁绊住心灵和头脑。应该放慢追逐财富追逐名利的脚步，多闻闻野外小草生长的气息，多看看孩子在草地上奔跑欢跳时绽放的笑容，多听听鸟儿在山谷中鸣叫的欢欣，多感触人生，让财富回归到给人带来快乐和自由的来源，让人生回归到快乐和幸福的来源，带给孩子和家人以幸福，这才是应该追求的财富目标。”


    鸥夷子皮分别讲解了理财的几个重要事项：


    +   1. 理财的目的，是满足各阶段的人生需求。例如，在年轻时期，大部分人的收入较低，积蓄较少，但年轻本身就是财富，此阶段应该从事激进的投资，敢于承担高风险去追逐高收益，即使失败，还有机会从头再来；如果这个阶段过于保守，过多考虑未来养老和医疗问题，为未来开支过早准备，将有限资金投资于债券、养老保险等品种上，重未来保障而轻发展，这种保守策略就像带锁链去跨栏，会错失很多机遇，是不可取的理财策略。'
