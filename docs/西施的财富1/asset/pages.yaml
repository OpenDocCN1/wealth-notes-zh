    +   3. 环境变化所导致 的政策调整可能性。大众普遍认为，只要按时缴纳社会保险，未来的养老问题政府必然会有考虑，养老会由社会承担的。人们看到当前的退休者依靠社会基本养老金维持着日常生活，想当然地认为，未来必然和当前一样，不太好但也不会太差。但是，人们或许没有意识到，未来的经济环境或许会有很多变化。在繁荣景气和人口红利的经济环境下，社会保险制度是当前这样子的；当未来人口红利消失、社会老龄化后，当前七八个工作人口对应一个退休者的情况，演变为两三个工作人口对应一个退休者的情况时，社会保险制度会不会出现重大调整呢？以后的事，谁又能肯定就如同当前呢？


