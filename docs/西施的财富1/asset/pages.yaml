  md: '金不是一种优质的投资品种吗？人们盛传——盛世藏古董，乱世藏金银，难道大众的传统看法又是错的吗？”


    鸥夷子皮：“所谓乱世藏金，是看重黄金的货币功能。黄金因其稀缺性，在几千年的人类历史中，一直充当一种天然的货币，人们自然也将黄金天然当成财富。进入现代社会后，纸币逐渐代替黄金的货币功能，在布
    林顿森林体系破产后，黄金彻底退出了货币的流通市场，但作为纸币的储 备，黄金在本质上仍是货币，黄金的价格涨跌，并非其本身的价值发生了 改变，而是和它直接挂钩的货币购买力发生了改变。”


    狗顿：“黄金和米元直接挂钩。老师的意思是，黄金的价格上涨，并 非黄金在增值，而是米元贬值了；黄金的价格下跌，也并非黄金贬值，而 是米元升值了。是这样的吗？”


    鸥夷子皮点头：“确实如此。近些年来，黄金价格出现了持续多年的 上涨行情，涨幅很大，甚至跑赢很多股票的涨幅，因此，黄金给人保值的 幻觉，人们纷纷投资黄金，期里暴利，再不济也能对财富保值。但是，实
    际上，黄金价格的上涨，是米国为了刺激经济，长期实行弱米元货币政策 的结果，当米元转强时，黄金的价格涨幅也就到头了，又可能转成长期的 下跌。根据历史经验来看，黄金的价格上涨并非一个长期持续的上涨，黄
    金并非投资品种，长期持有黄金的话，并不必然能带来高收益。历史上， 除非炒作，鲜见哪个投资大师投资黄金大获成功的例子。”


    鸥夷子皮继续说道：“至于说到盛世藏古董，恐怕更大程度上只是一 种热钱的炒作吧？按照国人的传统观念，收藏古玩或艺术品，高尚又风 雅，既能当传家宝遗传下去，惠及子孙；又能在缺钱时交易，谋取暴利。
    因此，大凡有钱有闲有才的社会高雅之士，大都好收藏这一口。收藏，给 大众的普遍印象就是，既能娱己，又可暴利。在收藏珍品交易时，其收益 率常常是高得吓人，动辄获利上百倍，因此，大众将收藏当做一件高档奢
    侈的行为，将古董、字画艺术品等当成优质的投资品种。在盛世年代，经 济富裕之时，大都喜好收藏，宁愿花大价钱，也要买稀罕宝贝，既可把玩'
  merge: -1
  img_proc: true
- pgno: 299
  md: '欣赏，更会大大升值。”


    西施说：“按你的观点，收藏品并非好的投资品种，而只是一个交易品种？”


    鵙夷子皮点头：“收藏品之所以会大幅升值的主要原因，并非因其价值提升，而是因为稀缺。收藏品大都数量稀少，甚至唯一，稀缺，就会导致供需严重失衡。众多买家为了得到心头所好，往往不计代价，只求拥有，从而容易人为哄抬出天价；另外，收藏品的交易，大都采取拍卖方式，这种交易制度更容易使得买家冲动，买家往社会情绪失控，因此，收藏品的拍卖交易，常常迭创天价。”


    猗顿说：“新闻媒体也经常这样报道，某个字画或古董的拍卖又创出天价，价格比几年前的某个价格又翻了多少倍。”


    鵙夷子皮：“人们常常误以为，收藏品的收益惊人，这其实只是一种错觉，正如人们只见贼吃肉，不见贼挨打一样。收藏品领域鱼龙混杂，赝品充斥，买到真品的概率极低，大都是赝品在流通。这个行业有一句话，十个里面八个骗，还有一个在学如何骗，由此可见假货的严重程度；此外，收藏领域炒作横行，炒家通过自买自卖，将默默无闻者炒成艺术大家，赝品的价格暴涨，整个行业都会受益，唯有买家、藏家在充当冤大头。即使收藏的是真品，也严重缺乏流动性，在急于变现时，根本不可能以市场价格成交，只有折扣很低，才能变现。”


    西施说：“明白了。收藏品并非一种良好的投资品种，与其将收藏品当成可以投资的金融工具，还不如仅仅当成一种高档而奢侈的爱好，还其以本来面目。对于普通大众来说，认清收藏品的真正功能，将其当成纯粹的收藏，而非投资工具，也减少很多上当受骗的可能。”


