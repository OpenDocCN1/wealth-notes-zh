- pgno: 29
  md: '身报国，承担起国家所交付的神圣而光荣的使命。


    越国花费三年时间，对西施进行全方位的培训，将她雕琢成了具有无穷女性魅力的绝色美女。既传授她诗词曲赋等文化知识和古琴书画等艺术技能、提升她的文艺修养，又教授她盗取情报等实用间谍技术；既培训她宫廷礼仪、塑造高贵典雅的贵族气质，又教导她狐媚迷惑男人之术、使其妖冶放荡如娼妓；重点培养她的歌舞才艺，使西施练成了世界上最早的独一无二的踢踏舞。经过三年刻苦训练，西施虽然没有获得大专文凭，却彻底退却了少女的青涩和村姑的拙朴，出落成一个清纯万分又仪态万千的绝世而独立的佳人，一笑一颦间，女性的柔情魅力就像水一样向四周无边无际地蔓延发散，让男人情不自禁地爱恋她喜欢她。


    勾践于是将她和一个叫郑旦的美女一起送给夫差，西施用踢踏舞踢开了夫差尘封已久的心扉，让同样只爱江山不爱美人的吴王为她丢了江山。西施这样表演歌舞：她脚穿木屐，腰系铜铃，在用数千个大缸上面铺设木板搭建的特制舞台上，随着悠扬的乐曲翩翩起舞，翩若惊鸿，宛若游龙，脚下木屐的踢踏声、腰间的铜铃声、手中的节拍声和耳朵的玉坠声宛若钢琴和管弦乐的和谐奏鸣：时而慷慨激昂，如万马奔腾，如洪水决堤，势不可当，又如英雄的意志永不停息；时而沉郁静寥，让人屏息聆听，压抑如死亡临近，低沉如哀鸣，好像给英雄送葬；踢踏声、铜铃声、节拍声和玉坠声如美妙的音符迸发，又似烟花在夜空中绽放，真是一波接着一波，一波未平一波又起，其音如怨如慕，如泣如诉，一曲终了，恰似降E大调第三交响曲一样仍余音袅袅，不绝如缕，让夫差如醉如痴，意犹未尽。


    夫差被西施的温柔妩媚和才艺迷惑得彻底神魂颠倒，春宵苦短日高起，从此君王不早朝。自此，这个钢铁君王，却变成一名纯情青年，一个爱情游戏中的傻子，整日只知与西施玩花赏月，鸣琴赋诗。


    西施回眸一笑百媚生；一回首，倾城；再回首，倾国。为博美人回眸，夫差大兴土木大搞基建，耗费巨资，举国之力，修建姑苏台和馆娃宫等豪宅，作为他和西施的爱巢。


