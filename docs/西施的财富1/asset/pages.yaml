  md: '# 六、算术收益率和几何收益率


    作为投资天才的巴菲特和索罗斯，其年均几何收益率一般也不过26%。


    鸣夷子皮继续讲理财ABC，他说：“进行投资理财时，不可避免要涉及投资收益率的计算和比较。在投资理财领域，通常是按年考核投资收益率，即考核年收益率，那么，不同金额的资本，经过不同时间期限，取得不同投资收益，孰优孰劣，应如何比较呢？”


    鸣夷子皮出了道简单的题目，让同学们回答。


    假定投资10000元于某个项目，10年后本利和为20000元，该投资收益率是多少呢？


    郑旦的算法是对每年的收益进行平均计算：10000元10年增值10000元，10年的收益平均到每年就是1000元，按10000元本金计算收益率为10%。


    鸣夷子皮说：“这种方式计算出来的投资收益率叫算术收益率，其含义是对每年的投资收益率进行算术平均。”


    他将算术平均收益率用公式表示为：'
  merge: -1
  img_proc: true
- pgno: 144
  md: '$\bar{k}=\frac{k_{1}+k_{2}+\cdots+k_{n}}{n}=\frac{1}{n}\sum_{i=1}^{n} k_{i}$


    其中， $k_{i}$ 是第 $i$ 期的投资收益率， $n$ 为总期数。


    鸥夷子皮说：“还有另一种计算方法，考虑了货币的时间价值原理，要通过指数运算求得。”


    对于同样上面的问题，鸥夷子皮将其解释为：10000元经过10年增长到20000元，平均年贴现率是多少？


    将这个年贴现率设定为 $x$ ，用公式计算如下：


    $1000(1+x)^{10}=20000$


    可求得： $x=7.2\%$ ，也就是说：年贴现率为 $7.2\%$ 。


    鸥夷子皮说：“用这种计算方式求得的投资收益率就叫几何平均收益率，几何收益率是根据货币的时间价值原理所得的复利增长率。”


    他给出了几何收益率的计算办法：将每年的系数 $(1+k_{i})$ 相乘，然后开 $n$ 次方，进行几何平均，用公式表示为：


    $\bar{k}=\sqrt[n]{(1+k_{1})(1+k_{2})\cdots(1+k_{n})}-1=[\prod_{i=1}^{n}(1+k_{i})]^{\frac{1}{n}}-1$


    白圭问道：“老师为什么要如此不厌其烦地讲解算术收益率和几何收益率的区别呢？难道收益率的算法不同，就会严重影响理财的收益率吗？”


    鸥夷子皮道：“算术收益率和几何收益率，这两种收益率看似只是算法不同，但本质却完全不同，是两种完全不同的结果。实际上，在考核投资收益率时，几何收益率才是唯一正确和有效的指标，只有几何收益率才能正确衡量投资业绩，算术收益率只会造成误解和迷惑。


    “在以上的举例中，算术平均收益率和几何平均收益率分别是 $10\%$ 与 $7.2\%$ ，相差 $2.8\%$ ，看似没有多大本质区别。如果再举另外一例，就能看出差别是何其之大了。例如，某基金的收益率第一年为
    $-50\%$ ，第二年为 $100\%$ ，如果计算算术收益率，就是 $(-50\%+100\%)\div 2=25\%$ ，收益率为 $25\%$ ，'
  merge: -1
  img_proc: true
