- pgno: 69
  md: '要成功得多，但这种成功早已背离他当初追求成功的初衷。他能给予家人富裕，却不一定能给予幸福；他能给予家人物质，却无法清楚妻儿的心理感受，给予她们精神的慰藉。当白领和家人团聚，共享家庭亲情之乐时，他要陪伴一群陌生的熟人觥筹交错，没有时间给予家人亲情；当夜晚白领和孩子玩乐游戏时，他趴在马桶边呕吐，没有精力给予孩子关怀；当白领陪伴妻子在旅游休闲时，他要应酬客户，只能让妻子一人孤独；当白领的工作压力过大时，可以辞职减压，而他的企业陷入生死存亡一线间之时，却无法一走了之，多大的压力都须承担。企业家看似过着光彩绚烂的生活，但在让家人享受富裕生活之时，也让家人失去了很多精神上的照顾和关怀，如果能给予综合评分的话，去掉一个最高分，去掉一个最低分，企业家普遍还不如生活稳定的白领幸福。"


    西施问：“国人梦想成功，崇尚成功，那么，到底什么是成功？”


    范蠡：“在不同的人看来，成功有不同的含义。商人们觉得钱可通鬼神，成功就是富可敌国；权势者觉得有权可以只手遮天，成功就是权力无边；文人们觉得文字可以打败时间，成功就是巨著等身，流芳百世，彪炳千古。可是，取得这样的成功又能如何？纵观天下大商巨贾，无人能传承三代。英雄豪杰沦为白骨，墟垄早被锄为田地，无花无酒，只有荒草；而曾经横扫天下不可一世的皇帝的陵墓，无论是始皇陵，还是十三陵，都只是一个供游人拍照的旅游点；文人的思想和文章就像个被任意打扮的小姑娘，可以肆意更改，只为符合今人的主观要求，文字无法打败时间，时间似历史荒野里的狂风，一切文字和事实犹如尘土一般，风过尘无，了无踪影。所谓成功，如梦幻泡影，如露亦如电，皆是浮云。”


