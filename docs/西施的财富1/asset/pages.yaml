- pgno: 232
  md: '# # 四、高通胀环境下的住房策略


    房子向左，生活向右。


    白圭问老师：“在高通货膨胀环境下，买房的话，房价却远远超过其投资价值，让人难以下手；但是不买房的话，居住问题又会出现现实问题。这种情况下，人们应如何应对？”


    鸥夷子皮说：“房子的本质，就是耐用消费品。在收入可以承受的前提下，如果为了追求人生的生活享受，就应将房子视为价格昂贵的生活奢侈品——购买而后消费，享受消费的乐趣。无论房价的泡泡有多大，生活总得继续，拥有房子的所有权而给人带来的安全感，是其他方式无法取代的，何况，在生活中，和房子捆绑在一起的子女教育问题、身份问题等现实问题，都是只有拥有了房子才能解决的。所以，为了生活，为了解决现实问题，无论房价的泡沫多么离谱，拥有一套自己的房子，成为大众的不二选择。”


    西施问：“那么，普通大众应选择购买多贵的房子才合适？”


    普通大众应该买多贵的房子？'
  merge: -1
  img_proc: true
- pgno: 233
  md: '鹏夷子皮的建议如下：


    首先，要看他的积蓄是否足够支付所选择房子的首期；其次，要看他每月偿还银行的还款金额占其收入的多大比例。普通大众买房，通常都是采用支付首期款，然后向银行抵押贷款，再在一定期限内按月还款的房屋抵押贷款方式。根据还款方式的不同，分为：


    +   1. 等额本息法。这种还款方式是指在还款期内，每月还款额固定，包括本金和利息，偿还同等数额的贷款。等额本息法每月还款金额固定，但在还款前期是本金少而利息多，在后期是本金增加而利息减少，复利累积下来，利息要比等额本金法多一些，看似要多付银行利息，但在高通货膨胀环境下，多借款晚还款是有利于债务人的，所以可采取这种还款方式。


    +   2. 等额本金法。这种还款方式是将本金每月等额偿还，然后根据剩余本金计算利息的还款方式。初期由于本金较多，支付的利息较多，从而使还款额在初期较多；随着还款时间越来越久，还款额会每月递减。等额本金法的好处是，总的利息支出会比等额本息法少，因此，对于不愿意承担债务负担的人来说，感觉利息负担更轻。


    每月偿还银行贷款的金额是判断应该买多贵房子的重要指标，房贷收入比是判断买房负担的最主要参考数据。一般来说，在支付首付后，偿还银行贷款的支出应占到家庭总收入
    40% 以下才可以考虑买房，控制在 30% 以下的话，偿债的负担就在合理范围内。所以，在进行买房决策时，要估算好偿还贷款能力，除掉每月必须偿还的银行贷款之外，还要有足够的剩余收入保障日常生活开支，不能让买房成为压力山大的经济负担。


    鹏夷子皮接着讲到：“在房价泡沫严重、远远超过其实际投资价值的经济环境下，对于年轻男女来说，如果不涉及子女教育问题的话，租房，就是最稳妥的应对之策。大部分人不愿租房的最大理由是，每月支付租金，最后什么都得不到；每月要是支付房屋贷款呢，最后会得到房子。这种看法，看似有道理，实际上是似是而非。当房价值被低估、投资房子的收益大于银行利率时，确实如此，租房不如买房；但当房价高企、租金收益率远低于银'
  merge: -1
  img_proc: true
