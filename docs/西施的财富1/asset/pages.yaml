  md: '浪费，它们就是财富锦囊的三大窟窿。其中，通货膨胀是一个国家货币政策的结果，是个人财富流逝最主要的外部因素；而税收则是一个国家的财政政策工具，是国家通过合法手段和民众分割财富，对于个人来说，也是财富流逝的一个重要的外部因素；而浪费，则是个人财富流逝的内在因素。”


