- pgno: 304
  md: '变成了摩托车，而当初出租车的基金经理却开上了宝马，还时不时开着游艇去出海。更糟糕的是，当稚嫩的应届硕士生经过多年亏损的磨炼，成长为投资高手、具备了为投资人理财的实际能力后，却纷纷离开公募基金，成立自己的私募基金公司，去为自己的事业奋斗了。众多的公募基金，更像是培养投资大鳄成熟的培训公司。”


    鸥夷子皮点头：“你说的没错。想要获取稳定的投资收益，有两种实现方式，一种是假手他人式，通过他人获取投资收益，这也就是我们所说的理财，通过不同品种的配置来实现收益，假手他人取得收益；另一种是亲自披挂上阵式，也就是自己直接进行投资。相比自己直接投资而言，理财的核心，就是选对品种，找对投资管理人。如果能找到类似于巴菲特、彼得林奇这样的投资管理人，那么，理财投资就是省心惬意的事儿；如果找不到这种顶级管理人，能找到王大伟、王亚伟这样的优秀管理人，投资也是愉悦的事儿。怕就怕碰到一些拿着投资人的钱学习投资的新基金经理。对大部分人而言，碰到平庸基金管理人的可能性或许更大，平庸也就罢了，最让人窝火的是投资管理人的委托代理机制方面存在缺陷，管理人存在道德风险，不重视投资人的盈利，只重视管理费收入，依靠管理费，管理人安枕无忧，却让投资人睡不着。所以，对于忙碌的人来说，理财，是一种财富管理的方式；对于一些有能力思考和研究的人来说，自己直接进行投资，是最优的财富管理学略。”


    西施问：“投资的核心，是追求5%~30%左右的年化收益率，如何投资，才能实现这种投资目标？”


    鸥夷子皮：“我们后面所讲的投资课程，就是解决这个问题的，也就是通过各种不同的投资方式，实现连续稳定的投资收益。”


    鸥夷子皮透露了实现稳定收益的两种方式：


    +   1. 投资。寻找高成长企业，买入其股票，长期持有，一直持有到其成长性放缓、稳定增长之时为止。因为高成长企业的利润会以复利形式增长，推动股价也以复利形式增长，所以，企业的高速成长就能带来财富的复利增'
  merge: -1
  img_proc: true
- pgno: 305
  md: '长。巴菲特投资可口可乐、美国运通等股票，采用的就是这种方式。


    2. 交易。通过寻找阶段性的交易品种，利用交易方式获取收益，每年在不同品种上取得稳定收益，每年的收益以复利形式增长，也能到达财富的复利增长。索罗斯、彼得林奇、保尔森等人就是通过交易方式取得了巨额财富。


    他说：“理财的核心是投资，理财的难点也是投资。投资是一门科学，有规律可循；投资也是一门艺术，需要发挥人的才华和创造力，投资大师的风格各有千秋。因此，投资需要系统学习，只有掌握投资的规律，才能享受到投资的乐趣，才能成为一名成功的投资者。”


    餐厅在缓慢旋转中。窗外，城市华灯璀璨；夜空，星光闪烁。良辰美景，和光明顶上的云鬓名流，相得益彰，让人陶醉。生活，看起来是那么的美好。西施忽闪忽闪地眨着大眼睛，满脸憧憬。她说：“我对未来充满了期待。我坚信一定能成为成功的投资英雄。”


    奇顿坏笑道：“不！是成功的投资英雄！”


    那么，西施到底如何取得投资上的成功？她通过何种投资技能成为财神？她为什么放着财神不当，却要当一名道姑？她的命运最终如何？欲知后事如何，请看《西施的财富II：陶朱之术》。'
