  md: '人的期望，而在于追求个人的成长、活出生命的意义以及享受幸福美好的人生。其核心是人生要保持一种积极的情绪，知足是和过去有关的积极情绪，而乐观则是和未来有关的积极情绪。


    积极心理学研究的领头羊包括美国的塞利格曼和本沙哈尔等。塞利格曼认为通往幸福的道路多种多样，只要合理规划，使其充满愉悦和喜悦，那么条条大路通幸福。他将短暂的愉悦和长期的喜悦加以区分。


    +   1. 短暂的愉悦包括源于外界刺激的短暂愉悦和内在的愉悦情感。源于外在刺激的短暂愉悦是感官上的愉悦，比如品尝美食或在冬天洗热水澡等。而一些情感如兴奋、欢喜、入迷或者陶醉等则是另一种高层次的短暂愉悦，比如听一场好听的音乐会、看一出好笑的电影等。愉悦是生物感官性上的满足。人的神经系统最初会对新奇事物发生兴奋反应，而当这些事情重复发生时，就会因刺激逐渐减退而适应习惯，兴奋性会越来越弱，因而愉悦的效果比较短暂。因此，沉溺于无爱的性行为、无节制购物或者吸毒等刺激性活动虽然会短期带来愉悦，却无法带来持久的幸福。


    +   2. 长期的喜悦是幸福的源泉。利用自身的优势，从事一些需要全身心投入的、富有挑战性但却能轻松控制、最终容易获胜的活动，能给人们带来长期的喜悦，比如从事下棋、游泳、画画、摄影、写作、跳舞、溜冰、爬山和攀岩等文娱体育运动，不但让人们全身心投入，激扬情绪，而且达到忘我、让时间停止的境界，从而产生心灵上的长期喜悦感。


    塞利格曼的研究结论是，不同种类的短期愉悦和来自内心充实的长期喜悦调和在一起构筑了人生的幸福。


    而本沙哈尔则认为幸福就是当前的愉悦加上未来的充实、有意义。他据此将人生分为以下四类。


    +   1. 忙碌奔波型：这类人物犠当前的享受和愉悦去追求未来的成就。他们相信，达成未来的目标比当前的愉悦更快乐。他们以最终是否成功、是否达成目标为导向，不重视过程中的乐趣，不关注成功过程中的体验和愉悦。他们将成功当成幸福，坚信目标实现后的放松和解脱就是幸福。他'
  merge: -1
  img_proc: true
- pgno: 79
  md: '们不停地从一个目标奔向另一个目标，一生都在忙碌奔波着。


    +   2. 享受主义型：这类人追求当前的愉悦，注重眼前的快乐，对未来的好坏漠不关心。他们的人生态度是——人生在世，及时行乐，今朝有酒今朝醉。他们只愿满足当前的欲望，而不去考虑未来。他们将努力等同于痛苦，将快感等同于幸福。


