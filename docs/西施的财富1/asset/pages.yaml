    他举了一个高利贷的案例：


    某企业主借高利贷，双方约定：本金1000万元，月息四分，为期三年，三年后还本付息，若按单利计算：月息四分，也即年息48%，三年利率总计为144%，三年利息总和是1440万元；但在最后结算时，债权人按复利计息：月息4%，为期36个月，利息总额为：
    $ 1000 \times (1 + 4 \%)^{36} = 4104 $ （万元），最后的利息总额与按单利计息的方式相差近3倍！


    白圭问道：“为什么债权人和债务人会在利息的计算方式上产生如此之大的歧义？到底是什么原因使得借债成为高利贷债务人的陷阱？”


    鸥夷子皮讲解起了借债：“债权人和债务人在发生借债行为时，一般要约定四个要素：本金、利率、期限和付息方式，如果对付息方式的理解出现歧义，套用不同计息周期，通过不同计息方法，就会导致利息差别巨大，从而让债务人产生噩梦。在前面我们所举的案例中，同样是月息四分，债权人将其理解为以月为计息周期，每月复利计息4%，债务人则将其理解为按年为计息周期，每年单利计息48%，正是这种理解上的歧义，才导致利息计算差别巨大。"


    西施疑惑不解：“看似同样的利率，仅仅因为计息周期的不同，就会导致如此巨大的利息差别？是什么原因造成的呢？”


    鸥夷子皮道：“在日常生活中，人们大都习惯于按年来计算利率或收


