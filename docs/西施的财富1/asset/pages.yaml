  md: '# ## 二、机会成本


    人生有机会成本，金钱也有机会成本。


    西施问：“什么是机会成本呢？”


    鸥夷子皮：“人们在进行一些重大决策时，可能会面临两种以上的机会，如果选择其中的一种机会，当然也就意味着放弃掉其他机会，也就是说，抓住当前机会时，就必须放弃其他机会可能带来的收益，而其他机会可能带来的潜在最大收益就构成选择当前机会的机会成本。”


    狗顿道：“机会成本，是不是可以通俗理解为，每个机会都伴随有其他机会的机会成本呢？”


    鸥夷子皮肯定了狗顿的提问：“未被选择的机会所带来的收益，就是选择当前机会的机会成本。人生有机会成本，金钱也有机会成本。”


    道生问：“什么是人生的机会成本？”


    鸥夷子皮：“人生的道路弯弯曲曲，向前延伸，其中有许许多多重大问题，必须进行选择。上什么大学？读什么专业？是继续读研还是首先工作？进入什么行业？是持续在一个行业干下去，还是不断跳槽、选择更满'
  merge: -1
  img_proc: true
- pgno: 133
  md: '意的行业？是先成家再立业还是先立业再成家？是娶一个美丽但不持家的女孩还是娶一个贤惠但姿色平平的老婆？人生的这些重大选择，就构成人生的十字路口，选择其中的一个方向，也就意味着必须放弃其他方向。在人生中，当选择你所选择的机会而放弃其他可选择的机会时，放弃掉的机会所能带来的收益，就成为所选机会的机会成本。


    “例如，你选择当公务员而非经商。几十年后，当你当上小吏、有机会贪污数百万元钱财而不犯事，于是你沾沾自喜地庆幸，庆幸当初的机会选择之对，或许上帝要冷笑，因为只有上帝才清楚。以你的能力，要是经商的话，早已拥有亿万身家。那么，对你来说，亿万资产就是当公务员的机会成本。当陈世美选择抛妻弃子当驸马时，他以为是机遇垂青，既当高官又当皇亲国戚，买的是双保险，但要命的是，他没摸清老婆的脾气，秦香莲像秋菊一样，比驴还犟，最终，他命丧铡刀之下，对陈世美来说，他当初的选择，机会成本太高，直接要了他的命。”


    西施说：“这能不能总结为，在人生中，机会越大，机会成本也就越高？”


    鹖夷子皮表示认可，他说：“机会成本，一个经济学名词，却蕴含着深刻的人生哲学。选择意味着放弃，得到意味着舍弃，机会意味着成本。人生命运变幻，悲喜莫测，就在于机会成本的度量无法顺意，可能选择了不该选择的，却放弃了不该放弃的。人生的意义，不仅包含当前所拥有的价值，还包含被放弃机会的机会成本，而这机会成本到底有多大，选择的当时无法自知，只有在放弃后、在时间的长期洗刷下，才能清楚其真实价值。”


    西施说：“到了那时，除了悔恨，只能悲哀，这就是人生。人生总是充满太多的无奈。”


    鹖夷子皮：“站在人生的十字路口，任何人都无法精确计算出人生的机会成本，不管是精明人，还是务实的人，所能做的，也就是选择其中的一条道路，将在这条路执着地走下去。人生，在不断地选择与沉浮中前行；人生，也因一个个十字路口的方向选择的不同，而呈现不同的命运；'
  merge: -1
