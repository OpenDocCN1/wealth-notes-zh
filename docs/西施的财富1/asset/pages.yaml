  md: '# 一、房子作为投资品种长期升值的特殊性


    通常，经济增长持续有多久，房价的上涨也会持续有多久。


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_220_0.png)


    鸱夷子皮认为，房子是一种投资品种，因为房子具有投资品种的所有特性：


    +   1. 收益性。房子可出租，租金就是其收益；房子增值后卖出也能获取收益。


    +   2. 流动性。房子可转让，可交易，具有投资品种的流动性。


    他说：“作为不动产，房子是一种特殊的投资品种。在经济增长时期，房子具有稳定增值的特征。通常，经济增长持续有多久，房价的上涨也会持续有多久。房子的这种特点，给人一种印象，投资房地产是最好的投资；房地产的投资收益最稳定；房价每年都会稳定增长10%左右，投资收益要远远高出银行储蓄和国债；房价只涨不跌，不像股票大涨大跌；房地产是跑赢通货膨胀的最好品种，等等。”


    西施问：“难道不是这样的吗？你的意思是关于房子的这些经验都不一定是正确的？”


    · 202 ·'
  merge: -1
  img_proc: true
- pgno: 221
  md: '鸥夷子皮道：“我随后分析这些经验之谈的谬误之处。现在，我先讲房子长期稳定升值的原因。”


    鸥夷子皮将房子长期升值的特点，归根于以下几点：


    +   1. 房子作为投资品种的价值发现。房子作为单价最高的大众投资品种，和经济景气度高度正相关。经济繁荣期，房价大都上涨；经济萧条期，房价大都回落。经济的增长，通常呈现周期性发展的规律，经济周期，又有不同的级别。一个长期周期，蕴含着几个短期和中期周期：短期周期会持续数年，中期周期会持续数十年，而长期经济周期可能会持续数十年。经济发展会出现这样一个阶段：在整个长期周期里，总体呈现上涨态势。长达数十年的经济长期上涨的周期里，各行业兴衰变幻会很大，但作为经济增长灵敏指标的长期利率却会总体走低，资产价格也会随着利率的长期走低而总体向上，房子作为资产的一种，同样会随着利率走低而走出长线上涨的牛市行情。房子不像股票那样在交易所集中交易，大众更看重房子的中长期价格趋势，房价的短期波动，难以引发人们的心理恐慌，从而导致房价比交易所挂牌交易的金融品种波动更小、收益更稳定。因此，房价的长期上涨，是国民经济长期增长的体现和价值发现。


    +   2. 房子作为财富象征的收藏偏好。亚洲人对房地产有特殊的心理偏好，普遍信奉有恒产者有恒心，将房子视为财富的象征，在心理上，房子，具有客观实在的厚重感，而这种充实感，是其他金融资产无法比拟的，所以，只要有能力，就愿意购买房子。在这种房子收藏偏好的心理作用下，随着经济的增长，大众收入的提高，对房子的购买需求会持续旺盛，房子的供给总是有限，需求却近乎无限，在经济繁荣期，房子总体供不应求，房价也长线持续上涨。


    +   3. 城市化的结果。随着国民经济持续发展，由农业为主的传统乡村社会，逐渐转向由工业和服务业为主的城市社会，导致农村人口向城市集中，城市人口的过度膨胀，使城市住房供不应求，房价的上涨也成为必然。


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: '+   4. 人口红利的结果。在一个中长期经济周期里，历经战争、自然灾害等天灾人祸，进入经济复苏期后，随着生活水平提高，出生率大幅上升，从而出现生育高峰，会涌现婴儿潮现象，随着这批婴儿长大成人、进入工作期，就会使整个国家的工作人口在总人口中占据较大比例，从而使整个社会抚养率较低，整个国家的经济出现高储蓄、高投资和高增长的良好局面，这就是经济增长的人口红利。人口红利导致社会消费旺盛，对房子的需求同样也会增加，从而带动房价上涨。


    +   5. 通货膨胀的影响。经济增长的过程，必然也是通货膨胀的过程，必然导致房价的长期上涨。


    +   6. 疯狂投机所致的资产泡沫。以上几种因素的合力，促使房价长期上涨。房价的持续上涨，又强化大众对房子作为投资工具只涨不跌的迷信，养成买房保值的固定思维，从而使整个社会疯狂买房，形成羊群效应，房价越涨，抢购就越厉害。房价实际包含更多的投机心理因素，是疯狂炒作的泡沫化的体现。'
