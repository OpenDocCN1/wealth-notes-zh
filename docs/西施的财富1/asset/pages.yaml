    鸥夷子皮叹了口气： “不管时间如何流逝，时代如何变迁，科技如何发展，国人有关财富的思想观念，仍然像司马迁总结的那样一成不变，创造财富的方式也类似，甚至还要糟糕得多。”


    鸥夷子皮将当前国人的创富方式，归纳为以下几种典型方式：


    +   1. 大部分人靠辛苦工作获取财富。国人的财富观大都来自父母老师，而父母老师的财富观又来自他们的父母老师，也就是说，上一代有什么样的财富观，下一辈就会有什么样的财富观，而几千年来国人对待财富的态度是，万般皆下品，唯有读书高；书中自有黄金屋——只有努力读书，逐步升迁，收入才能越来越高，这也成为绝大部分人积累财富的必然路径。靠读书取得高学历，获得高薪职位，然后辛勤工作，从而通过高收入来获取财富。高收入、好工作，是大部分读书人获取财富的最佳途径，在条件许可时，青年们沿着读名校的学士硕士博士的学历之路狂奔，在成为勇士烈士之前找到高薪职位；另一些人无钱读书，或不擅长读书考试拿高学历，但也通过学习专业技术谋求高收入岗位；这些年轻人富有朝气，怀揣追求财富的梦想，期望通过辛勤工作，过上自由富足的生活，但辛劳一生之后才懂得，辛勤工作并不必然会带来财富的积累。低收入者一生在为衣食操劳；中高收入者的收入也被花费殆尽，为了追求高质量的生活，其生活消费开支跟随收入的增长而水涨船高。


    +   2. 靠投机钻营谋取财富。工学不出头、高薪无法累积财富，这是人们创业、进行商业经营的主要原因。在残酷的市场竞争中，有人通过自我竞争力的提升争取生存和发展机会，通过日积月累赚取市场平均利润，获取财富；也有人靠投机钻营来谋取财富，他们或通过行贿，取得大量银行贷款后假破产，一走了之；或通过国有资产低买高卖实现财富转移；或通过对上市公司高价增发注入劣质资产、实现财富掠夺。在竞争环境下，有人通过以次充好，以伪劣产品配备精美包装和美妙广告的经营方式，疯狂暴敛财富。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '+   3. 靠垄断榨取财富。精英人物追逐权力，也善权谋，如投身商界，就会努力做大规模，追求垄断，通过规模效应，实现赢家通吃，获取高过一般市场竞争者的特权，从而形成垄断地位，榨取超额财富。商业精英们或进入产业链的上游行业，去形成对中下游行业的控制和垄断；或通过在中下游行业的竞争中胜出，成为老大，而获取占位优势，占据行业的垄断地位；或通过打通产业链，以低成本战胜其他竞争者获取垄断；或通过和政府联合，绑架政府利益，甚至通过贿赂相关官员，设置市场准入条件的门槛，而人为地造出垄断地位。


    +   4. 靠当官收受贿赂获取财富。千里当官只为财，是一些当权者的财富观，通过当官去敛财，也成为一些官员的重要创富途径。通过权力，为市场的正常经营行为设置障碍，在收取贿赂或者好处后再解除掉障碍，所谓先设租再寻租，就能轻松实现权钱交易，达到敛财目的。


    +   5. 靠炒获取巨额财富。国人有一些共同特点，例如，非常聪明，却非常相信谣言；凡事喜欢抢，从出生抢座位，到临终抢坟地，从头抢到尾；在大事上忍气吞声，在便宜上却斤斤计较；能通过关系办的事，绝不通过正常途径解决；计较的不是公平，而是自己不是受益者；动辄批判别人，却很少反思自己。在追求财富方面，国人的共同特征是不懂投资，却善于炒作各种货物。通过囤积居奇，先大量收购所要炒作物，将之收藏囤积起来，等到市场上这种商品的流通大为减少、成为稀缺商品、奇货可居之时，再以高价卖出，从而谋取暴利。


    鸥夷子皮说：“国人当前的财富观和创富方式，和上千年前的祖先完全类似，估计未来也不会有大的改变。财富的积累不是靠科技创新，而是靠垄断、靠压榨、靠炒作。”


    道生问：“为什么会这样呢？”


    鸥夷子皮凝重地回答道：“因为我国人更热衷于研究权谋，更喜好利用阴谋诡计发财，从没有人认真研究国家财富的规律。在我国，从没有出现过一门系统地讲述如何创造财富的学科，没有出现过类似《国富论》这'
  merge: -1
  img_proc: true
- pgno: 115
  md: '样研究国民财富性质和原因的经济学巨著，更没有出现过类似《道德情操论》这种讨论经济社会伦理道德和人类福利的巨著。《史记·货殖列传》仅限于为商人立传，已是一个让人惊愕的疯狂之举。”


    鸥夷子皮叹了口气，说：“国人在骨子里看重财富，却歧视商人，所以不可能出现专门研究财富的专门学科，更没有多少人知晓财富的秘密，学校更不会传授致富的思想。国人的财富观，基本来自父母的言传身教和自我的亲身感受，而父母的财富观又来自其父母。跟着一个财富盲，又怎么可能懂得财富的奥秘呢？所以，这也正是几千年来普通大众财富观相似的根本原因。”


    他停顿了一下，然后说：“和司马迁一样，人们普遍认为追求财富是本能，不用学习，是自然就会的事情，却不知，管理财富是一门学问，只有通过学习，才能掌握创富诀窍，了解财富奥秘，在机会来临时，才能准确把握，实现财富梦想。”


    鸥夷子皮继续讲道：“掌握了财富的奥秘，少量的资本也能积沙成塔，累计成巨额财富。如果不懂财富背后的秘密，即使祖先遗产富可敌国，也经不住几次经济起伏的变化，最终会败家破产，所谓富不过三代，其根本原因是祖先上一代只遗留了物质财富，却没有遗留财富的奥秘，所以，第三代完全不懂财富的秘密，大都只有破产的可能。”


    西施问：“什么是财富的秘密呢？”


    鸥夷子皮：“所谓财富的秘密，就是财富只有以复利的形式增长，才能得到爆发性的增长。学习财富的规律，就是学习如何通过控制风险实现财富的复利增长。通过学习，就会明白通货膨胀、浪费、税收和交易成本是财富增长的大敌；通过学习，就能回避财富流逝的根源，从而为财富的复利增长插上翅膀，让它飞得更快更远；通过学习财富的生命周期理论，就能明了人生的收入与支出，对人生财富进行科学的规划，就能让子女的教育和未来养老有坚实的保障；通过学习，掌握投资技巧，就能进行有效地资产配置，使财富持续稳定地复利增长。”


