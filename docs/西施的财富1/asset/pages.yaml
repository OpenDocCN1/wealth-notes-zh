  md: '行利率时，买房就不如租房。在房子的投资收益远低于银行利率的情况下，房子下跌的风险可能远大于房子升值所得到的收益。如果这时候选择租房的话，成本会更低，经济负担更小，对于工作变动较多、尚无孩子拖累的年轻男女来说，租房就是一种更为灵活机动的生活良策。”


