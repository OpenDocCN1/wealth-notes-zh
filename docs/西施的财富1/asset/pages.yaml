  md: '果不被用作消费，可以用作投资，投资收益就是对放弃消费乐趣的补偿。一笔钱，如果不被浪费，完全可以用来长期投资，假定投资稳健，按照货币的时间价值原理，投资将以复利形式增长，根据贴现率的不同，这笔钱未来的价值，将完全不同与被浪费时的价值！也就是说当前的浪费，是以损失未来潜在的昂贵价值为代价的！"


    西施问：“能不能用具体的数据，将当前的浪费，和未来某个时期，比如30年后的价值，进行直观比较？通过数据，让我们有一个深刻了解。了解当前浪费，历经30年时光穿梭后，将会达到一个多么严重的程度？”


    鸭夷子皮点头：“我们可以假定几种不同的消费行为，导致不同程度的浪费。假定被浪费的钱，存在两种不同的贴现率。一种是稳健投资的收益率，投资于国债、银行长期储蓄、货币型基金等，年均贴现率5%；另一种是较激进的投资收益率，投资于股票型基金，年均贴现率为10%。根据我们前面所学财富增长系数，我们知道历经30年之后，按照5%的贴现率计算，金钱将增长为原来价值的4.32倍；按照10%的贴现率计算，被浪费的金钱，将增长为原来价值的17.45倍！据此，我们就可以分别计算出被浪费的钱，在不同的贴现率下，在30年后的价值。”


    于是，鸭夷子皮对不同消费行为所浪费的钱、在不同贴现率水平下30年后的价值，进行了量化计算：


