- pgno: 39
  md: '范蠡并非是为躲避勾践的迫害，而是为了追求心目中的幸福人生，他知行合一，对幸福自由的生活有憧憬，就付诸行动。他辞职的真实目的正如他在辞职信中所述：为了童年的梦想，为了幸福的人生，为了心中的自由，他决定辞职。所以，不是范蠡太狡猾，而是世人心理复杂，不肯相信范蠡的人生追求就是简单自由的生活。


    老习我以为：范蠡一生学道用道，道家哲学思想是他人生价值观的核心，他的作为也是道法自然、顺势而为的，年轻时血气方刚，像所有年轻人一样渴望成功，故而要辅佐勾践、建功立业；但追求成功只是人生漫漫长河中一段华丽的乐章，并不是人生全部所在，当年过四十而不惑之后，他意识到人生要与天、地、人和谐，品尝成功的喜悦只是生活的点缀，人生更要顺其自然，顺应自己的内心感受，不受外界的诱惑，乐章简单自由人生之趣味。


