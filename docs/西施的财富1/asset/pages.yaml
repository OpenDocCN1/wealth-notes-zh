  md: '鸫夷子皮继续讲道：“对于普罗大众而言，所谓成功，无非就是金钱上的成功、财富上的成功，不为金钱所累，实现财务上的自由。致富，作为绝大多数年轻人的成功之梦，是人们努力奋斗的原动力，虽然，有少数人梦想成真而成功，但是，对绝大多数人而言，当年满60岁、行将退休时，大都要为未来的养老、医疗负担而发愁，无几人数奢望拥有亿万资产去安享晚年。”


    鸫倾感慨地说：“对于中产阶级来说，无论收入高低，生活就像个无底洞，总有无尽的支出要花费。生活的压力之大，如同背负着几座大山一般，人人都是亚历山大，前行起来，都是步履蹒跚。因此，尽管很多人年轻时对财富怀有梦想，但是，拥有亿万资产，却是一个让绝大多数人都感觉遥不可及的美梦。”


    鸫夷子皮笑着说：“年轻时得到10万元的可能性大吗？如果你有机会在25岁时获得10万元，你就有很大机会在年老退休时取得1亿元，成为亿万富翁。”


    鸫倾叫喝道：“这有点太夸张、太不可思议了吧？年轻人依靠父母的资助、朋友的借债或者一笔不大生意的成功，都可能会得到10万元，所以，在25岁时拥有10万元并不太困难，但是，在60岁时，要拥有1亿元这个天文数字般的财富，就太难实现了！毕竟，社会上的亿万富翁太少了！对于国人来说，人人都有成为亿万富翁的想法，因此，即便手中有数十万、数百万、数千万的资金，仍然寄希望于一夜暴富，幻想通过股市暴涨、娶个富婆、彩票致富。亿万富翁，人人梦想而不得，太难了！太难了！”鸫倾一边说，一边摇头。


    鸫夷子皮招呼大家在暖暖的草地上坐下来，说道：“坐拥亿万资产，确实有难度，但其难度，并非体现在一夜暴富的低概率上，而是体现在难以进行恒久的坚持、难以经历长时间的考验上。人们虽然忙忙碌碌为钱财，却很少有人去思考财富增长的规律，实际上，只要把握、遵循财富增长的规律，随着时间流逝、年纪增长，拥有亿万资产、成为亿万'
