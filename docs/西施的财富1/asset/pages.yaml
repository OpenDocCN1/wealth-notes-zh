- pgno: 274
  md: '鸥夷子皮讲到了保险问题。


    他说：“我们讲理财，就不能不提到保险。我们知道，投资是理财的核心，投资让财富增长。如果说投资就像法拉利，可以提升财富增长的度；那么，保险就像降落伞，在面临人生风险时，可以提高财务安全保。有了保险，当人生出现重大的经济风险时，就像有降落伞一样，一定程上可以实现软着陆的保障。”


    道生问：“人生能有什么风险？”


    鸥夷子皮道：“人的一生中，会出现意想不到的风险，有人意外身患重病，有人意外伤残，有人意外死亡等。为了减少意外风险所造成的重大经济损失，有聪明人发明了‘保险’这种金融工具。利用保险对风险进行管，就可以降低风险可能导致的重大损失，从对未来做出保障。”


    西施问：“什么是保险？”


    鸥夷子皮：“保险，是作为客户的投保人和作为保险人的保险公司之间，通过法律契约的形式，由保险公司通过精算设计产品、进行风险管理，投保人通过支付保险费用、保险公司通过收取保险费用和生产风险发生后的约定赔款的方式，将投保人的巨额损失转移给保险公司，从而由'
  merge: -1
  img_proc: true
- pgno: 275
  md: '保险公司对投保人指定的受益人或被保险人进行经济补偿的一种财务安排。”


    西施说：“这个解释有点绕口，听得不是太明白。”


    鸥夷子皮：“简单地说，保险是一种金融工具，它转移了投保人的风险。保险，通过将极少数遭遇意外的投保人的巨额损失，均摊给众多的其他投保人，实质上就是把损失分摊给其他具备相同风险可能性的投保人。因此，保险并不是减少风险，更不是减少风险所导致的损失，而是转移了风险。”


    鸥夷子皮说：“最初的保险产品，是只具备风险保障功能的意外险。意外险是消费型的保险产品，它只有在被保险人发生意外保险事故的情况下，才会发挥保障赔偿功能。如果保险期满，被保险人没有发生任何保险事故的话，意外险的保险功能就失效，投保人所缴纳的保险费用，就像消耗品一样，被完全消费掉。随着保险公司产品线的逐渐丰富，保险公司又开发出很多具备储蓄功能和投资功能的保险产品，例如，具有储蓄功能的保险产品，包括人寿养老保险、两全保险、教育金保险等，不仅具备基本的意外保障功能，还具备储蓄功能，也就是说，被保险人在保险期内不发生保险事故的话，受益人还可以从保险公司拿到一笔钱；还有的保险产品如投资连接险、万能寿险和分红险等，这些品种具有投资功能，可能还会取得投资收益。”


    郑旦说：“最近，有一个保险经纪人老来找我推销保险，说他销售的这个保险产品收益率很高，买这个保险是笔很好的投资。我差不多已经被他说服了，过两天就准备去签单。”


    鸥夷子皮：“保险产品种类繁多，法律条文复杂，但在保险营销人员的强力营销下，保险深度和保险密度都很高，普通大众无人没接受过保险推销，大部分人都购买过各类型的保险，但是，大部分人所购的保险，其实并非符合自己意愿和需求的保险产品。大部分人误解保险的功能，忽视保险的保障功能，却高估保险的储蓄功能和投资功能，将保险产品当成'
