- pgno: 246
  md: '# 二、几种养老安排


    如果不为未来打算，未来必然要继续辛劳，为口粮而劳累至死。


    白圭问：“当前的退休者可以依赖社会保险养老，为什么当前的年轻人就不能寄希望于社会保险养老呢？当前社保养老制度，对年轻人未来的养老，又有多大程度的保障呢？”


    荀颤：“基本的社会养老保险制度我有一些大致了解，我来讲讲吧。”


    荀颤讲起当前的社保养老制度：


    根据关于社会基本养老保险的相关规定，社会基本养老保险实行社会统筹与个人账户相结合的方式，由雇主和雇员共同缴纳基本养老保险费，雇主按企业雇员月均工资总额的20%缴纳基本养老保险费，记入基本养老保险统筹基金；雇员按月工资收入的8%缴纳基本养老保险费，记入雇员个人账户。退休时领取的社保养老金，由基础养老金和个人账户养老金两部分构成，也就是：


    社保养老金=基础养老金+个人账户养老金'
  merge: -1
  img_proc: true
- pgno: 247
  md: '其中：


    基础养老金=（上年度本地职工月平均工资+本人指数化月平均缴费工资）$\div 2 \times$ 缴费年限 $\times 1 \%$


    个人账户养老金 $=$ 雇员个人账户储存额 $\div 139$


    鸥夷子皮说：“假设这个社会基本养老保险制度一直维持，持续数十年，未作大的调整。我们就根据社会基本养老保险制度的相关规定，可以进行关于养老问题的数据分析。”


    鸥夷子皮对社会基本养老保险进行了数据分析：


    假定某人25岁开始工作，60岁退休，工作35年，缴纳社会保险35年。为方便计算，假定此人工作初始时的工资水平为当年社会平均工资，将此人月工资设为a；假定通货膨胀率维持在
    $4 \%$ 的温和水平，此人工资年增长率 $6 \%$，工资增长率大过通胀率，当届好工作好收入。


    那么，此人开始工作时，月缴纳基本养老保险费为 $0.08a$，年缴保险费为 $0.96a$，也就是说，每年个人养老账户缴纳的基本保险费相当于近一个月的工资收入。并且，此人在连续35年中，每年所缴纳的保险费构成一个比例系数为
    $1.06$ 的等比系列，35年的总和为：


    $\sum\limits_{i=0}^{34} 0.96(1+0.06)^{i} \cong 107a$


    也就是说，35年间，此人缴纳到个人账户的基本社会保险费总额为工作初始月工资的107倍；而按照 $4 \%$ 的通胀率水平，此人退休时的社会月平均工资将为 $3.95a$，是工作初始社会平均工资的近4倍。那么：


    此人退休时的基础养老金将为 $3.95a \times 35 \%$，也就是 $1.38a$；个人账户养老金将为 $107a \div 139$，也就是 $0.77a$；


    总的养老金则为： $2.15a$。


    这个数值，相当于退休时社会平均工资的 $0.54$ 倍，这种养老金与社会平均工资的比例，被称为退休金替代率，也就是说，此人的退休金替代率为 $0.54$。


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '鸥夷子皮说：“我们通过这个数据分析可以看出，一个人即使从工作开始就按社会平均工资缴纳基本养老保险，整个工作时期连续缴纳，从不间断，在4%的温和通货膨胀率水平下，退休时所能领取的养老金，也就仅仅相当于当时社会平均工资的0.54倍。退休金替代率太低，退休后的生活质量会受到严重影响。况且，这个4%的通胀率，是最温和的通胀，如果通胀再重点，退休金替代率将更低，退休后的生活更难以维持。因此，社会养老保险制度，最多提供一种最低生存水平的保障，却无法提供退休后维持正常生活所需的资金安排，如果想要提高养老的生活质量，就必须进行养老规划，寻求其他途径的养老模式，才能做足养老准备。”


    西施问：“还有其他的养老安排吗？”


    鸥夷子皮说：“购买商业养老保险，是一种最常用的养老规划安排。商业养老保险包括传统型养老险、分红型养老险、万能型养老险和投资连接险，收益各有不同，特点也各有不同。”


    他分析了商业养老保险不同险种之间的不同：


    +   1. 传统型养老险的预定利率是确定的，当前一般在2.4%左右。传统型养老险从何时开始领养老金，到时领多少钱，都在投保时可以明确选择和预知。


    +   2. 分红型养老险通常有保底的预定利率，但这个利率比传统养老险稍低，当前只有2.0%左右。分红险除了固定生存利益外，每年还有不确定的红利可得。但分红的不确定，也就意味着难以得到分红。


    +   3. 万能型寿险在扣除初始费用和成本后，保费进入个人投资账户，有保证的最低收益，当前在2%左右。除此之外，还有不确定的“额外收益”。


    +   4. 投资联结保险设置不同风险类型的账户，与不同的投资品种挂钩，不设保底收益，保险公司收取账户管理费，盈亏由客户全部自负，以投资为主，兼顾保障，由保险公司投资人员选择投资品种，不同账户之间可灵活转换，以适应资本市场的不同形势，有可能收益很高，但如果资本'
  merge: -1
  img_proc: true
- pgno: 249
  md: '市场波动大，损失也可能会很大。


    鸥夷子皮说：“养老保险安排，本质上是一种强制储蓄，强制个人在工作期间，要为未来的养老，做好资金安排。社会基本养老保险制度是以国家法律的形式，强制雇员和雇主每月扣缴收入的一定比例作为养老储蓄；相比之下，商业养老保险则是个人自愿交保险费给保险公司，为养老进行商业性的强制储蓄。但是，无论商业养老保险的种类多么多样，但无法解决同样一个问题——预期收益率太低。我们在讲解财富流逃的秘密时，已经讲过，通货膨胀会使保险公司的长期养老资金大幅贬值，从而使财富流逃，因此，在币值稳定的环境下，商业养老保险可以作为一种补充的养老准备；但在高通胀的环境下，商业养老的长期低收益率，恐怕难以满足未来养老的需要。”


    白圭说：“我知道还有另外一种养老规划，就是企业年金。”


    鸥夷子皮说：“企业年金，是由企业为员工建立个人年金账户，企业和个人每月按收入的一定比例共同缴费，由企业或第三方专业机构进行投资运作，账户的本金和投资收益在退休时可以取出，用做养老准备。企业年金通常是大企业给员工的一种福利，是大企业员工养老的一种补充，但不具有普遍性。”


    鸥夷子皮继续说：“在纸币条件下，通货膨胀不可避免，即便通货膨胀表现温和，仅为4%，时隔20年后，以货币形式表现的财富，也会贬值为当初购买力的44%；30年后，仅相当于最初购买力的29%。所以，无论是基本社保、商业养老保险，还是企业年金，投资收益都普遍低下，甚至低过银行名义利率，从长期来看，这些养老规划都不可避免地会大幅贬值，大众的养老规划也将陷入一种囚徒式困境。如果在年轻时抑制消费，而为未来积蓄，积蓄在未来会大幅缩水，未来养老前景不可知，晚年仍无法避免要为生存而退而不休；但是，如果不为未来打算，未来必然要继续辛劳，为口粮而劳累至死。”


    鸥夷子皮说：“或许，几十年后，当前的中产阶级面临养老困境时，'
