  md: '# 二、西施


    > 一顾倾人城，再顾倾人国。——（汉）李延年


    文种的伐吴九计中，最核心的一条是美人计。夫差不但国力强盛，军力强大，而且意志坚强，毅力坚定，具有永不言败的性格特质，只有在精神上挫败他，才能在战争中征服他。美人可以迷惑夫差的心智，使其沉溺于情色之中，才能精神萎靡不振，不再专心于事业；美人还可以作为越国间谍，通过夫差直接掌握吴国的核心机密。为了找寻到能胜任此艰巨任务的美女，勾践派人遍寻其国，终于发现绝世佳人西施。


    西施，史上四大美女之首，排名王昭君、貂蝉、杨玉环之前，天生丽质，禀赋绝伦。当她被越国特派员发现之时，娉娉袅袅十三余，豆蔻梢头二月初，其手如柔荑，肤如凝脂，领如蝤蛴，齿如瓠犀，螓首蛾眉，巧笑倩兮，美目盼兮，
    鸟见人松萝，鱼畏沉荷花，美得不可言传，仿佛天仙降临人间。


    这个名叫施夷光的年轻村姑是浣溪村洗衣厂的洗衣女工，越国特派员为其取艺名叫西施，对其进行政治思想工作和爱国主义教育，将勾践的耻辱上升为越国的国仇家恨，报仇雪恨，人人有责，西施自愿忍辱负重，以'
  merge: -1
