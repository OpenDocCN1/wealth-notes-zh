    西施问：“投资品种和交易品种有什么根本不同？如何区分？”


    鸣夷子皮：“根据金融品种的收益性、流动性和风险性的不同，投资品种和交易品种具有完全不同的特征。”


    道生问：“什么是收益性？”


    鸣夷子皮：“所谓收益性，就是金融品种即便不被交易、不被买卖，自身也能产生收益。投资品种具有收益性，而交易品种不具有收益性。投资品种和交易品种的区别，主要体现在收益性上，这正如母鸡和公鸡的区别，母鸡可以下蛋，鸡蛋代表收益，所以，母鸡有收益性，公鸡不具有收益性。”


    老师的通俗讲解逗乐了大家。旖顿问：“交易品种低买高卖后，不也能获取收益吗？”


    鸣夷子皮解释：“这种收益，来自金融品种的价格波动性。金融品种的价格会上下波动，这种价格的涨跌，就会产生交易机会，低买高卖的话，就会有收益，高买低卖的话，就会亏损。交易品种的收益，唯一来自价格波动所产生的价差获利，这种价差的获利，虽然也是一种收益，但并不是其自身所产生的。所以，交易品种并不具有自身收益性，其收益来自不断地买卖交易，牟取价差。”


    西施：“明白了。也就是说，所有的投资品种也是交易品种，但交易品种只能是交易品种，只能靠价格波动来获利。”


    鸣夷子皮称是。他继续说道：“所谓流动性，是指金融品种是否具有容易变现的特性，金融品种交易越容易，变现性越强，流动性也越强。所谓风险性，是指金融品种的价格会上下波动，既可能获利，又可能亏损。”


    他接着讲：“一般来说，金融品种的收益性越高，流动性会越差，风险性会越高；同样，流动性越强、风险性越小的金融品种，收益性则会越差。”'
