  md: '利息收入不足达到本金金额的情况下，就是净损失。债务人则会背上沉重的利息负担，在无力清偿时，抵押的财产会被剥夺，家庭生活也会受到严重影响。所以，高利贷，是一种疯狂而危险的游戏。


