    乌夷子皮开始进行数据分析：


    首先，大众退休后会存活多少年？


    根据当前相关数据：男性60岁退休，平均生存年龄为72岁；女性55岁退休，平均生存年龄为74岁，也就是说，当前男女退休后的生存年限分别是12年、19年；考虑到未来医疗科技的发展，人均寿命会再延长，并且，个体寿命不等于平均寿命，为了避免出现钱没了人还在的悲惨状况，以20年为合理生存年限来准备养老金是必需的。我们就以20年为退休后的合理生存年限，据此估算未来养老金的情况。


    我们假定，中产阶级人士在40岁左右时开始进行养老规划，设定开始养老规划的时点为T，那么，60岁退休的时点则为T20，我们以下估算中产阶级人士在退休之时的T20时点、应该为未来20年的退休养老总花费，做多少养老准备。


    其次，退休后应维持什么样的生活水平才合适？我们以当前生活水平为参照，设定两种不同的生活水平：


    +   1. 基本生活水平：以当前普通退休者的养老金水平为基准，作为维持最基本生活水平的标准。当前退休者的养老金标准大致为2000元/每月，2.4万/每年。


    +   2. 中等生活水平：以当前白领的日常生活费5000元/每月、6万/每年为基准，作为养老的中等生活水平标准。


    再次，根据通货膨胀率的不同，我们可以将未来的经济情况，分为以下三种：


