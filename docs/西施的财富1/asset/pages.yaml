  md: '第一道题，是海盗分金币的问题：


    5个海盗抢得100枚金币，讨论如何进行分配。他们商定的分配原则是：


    （1）抽签确定各人的分配顺序号码，分别为1，2，3，4，5号。


    （2）首先由抽到1号签的海盗提出分配方案，然后5人进行表决，如果方案得到超半数的人同意，就按照他的方案进行分配，否则，就将1号扔进大海喂鲨鱼。


    （3）如果1号被扔进大海，则由2号提出分配方案，然后4人进行表决，当且仅当超过半数的人同意时，才会按他的提案进行分配，否则也将被扔入大海。


    （4）依此类推。假定每一个海盗都很贪婪却绝顶聪明并且理性，他们都能够进行严密的逻辑推理，能理智判断自身的得失，也就是都想在能够保住性命的前提下得到最多的金币。


    假设这个分配原则是严肃的，也就是每一轮表决后的结果都能被严格执行，那么，抽到1号的海盗应如何提出分配方案，才能使自己既不被扔进海里，又能得到最多的金币呢？


    鸭夷子皮出完题，西施、郑旦和道生一同聚精会神地思考起来。苦思冥想之际，半个小时过去了。西施开口说：“我明白了。海盗分金币这个问题的答案应该是，1号海盗分给3号1枚金币，4号或5号2枚金币，自己独得97枚金币，按照海盗的抽签号，他的分配方案应该为（97，0，1，2，0）或（97，0，1，0，2）。”


    西施讲了她对几个海盗逻辑思路的分析：


    首先从5号海盗开始。因为5号排位最后，最安全，没有被扔下大海的风险，因此他的策略最为简单，前面所有人提出的分配方案他都会一概否决，也就是最好前面的人全被扔下海，他就可以独吞100枚金币。


