- pgno: 9
  md: '经济现象背后的本质，帮助大众树立正确的投资理念，掌握一定的投资技巧，以投资获取连续稳定的收益，从而少为钱财所累，处事更顺应自己的内心感受，人生也更真实、更自由。


    当今社会，大众在对子女进行教育时普遍热衷于学英语、音乐、美术等技能，对学习投资理财知识基本上无甚兴趣，将投资理财当做投机，或嗤之以鼻，或以为骗，视之为不值一学。这种思想观念之所以会盛行，固然是因为在传统教育中，从来未曾有过投资理财方面知识的传授，更主要的是因为普通大众的理财观大都来自父母师长的耳濡目染，大都不懂财富的秘密，普遍匮乏理财技能，基本靠出卖劳动力为生，“千金在手，不如一技傍身”的意识根深蒂固，下一代受上一代思想的长期熏陶，从而使得“重技术轻理财”的观念成为传统价值观而代代传承。殊不知，人生最重要的能力是生存能力——在不同的环境中适应并很好生活的能力。在当代社会，具备管理财富的能力，才能更好地适应生存环境，生活才会有品质。


    某些如洛克菲勒之流的商业奇才，天生具有理财的基因：“即使把我的衣服脱光，再放到杳无人烟的沙漠中，只要有一个商队经过，我又会成为百万富翁。”天生具有理财基因的人，天然地按照财富增长的规律行动，很容易就成为财富的集大成者。普通大众不具备这种理财天赋，但是，如果能通过投资理财的培训教育，使其通晓财富增长的秘密，掌握一定的投资技巧，也能把握环境变化的机遇，抓住投资机会，取得满足人生'
  merge: -1
  img_proc: true
- pgno: 10
  md: '自由的财富。


    当前社会，大众心态普遍浮躁，信仰普遍缺失，功利主义盛行，成功的定义也简单而功利化：凡是拥有巨额财富者，就是成功者；凡是拥有权力地位者，就是成功者。按照这种标准来评判成功者的话，成功者就像中彩票大奖的人一样，只是因为幸运。套用巴菲特得话来来说，成功者就是精子彩票的中奖者，因为出生于巨富世家或权贵世家的人，天然地会拥有巨富或权力，普通人奋斗一生而获得的财富或权力地位，或许远远比不上这些一出生就注定是富豪和权贵的幸运儿的零头，如果将成功仅仅定义为金钱和权力的话，也就意味着：普通大众奋斗一生所追逐的成功，甚至不如这些幸运精子投胎的成功；也就是说，如果你的一生只是追求财富的话，你的成就永远赶不上李嘉诚刚出生的孙子！对于追逐名利的人来说，这何尝不是个滑稽又可悲的讽刺！


    什么是成功？如何看待名利财富？每个人都有自己的感悟。本书阐述理财理念和投资知识的目的，并非教导大众为追逐成功去获取财富，而是期望大众能通过投资实现财务自由，从而注重真实的内心感受，过真实的生活。毕竟，世俗的成功是大部分人的选择，但也有相当一部分人不追逐这种成功，更注重逍遥自在的生活；或游历五湖，一船明月，一竿悠闲；或躺于老树之下，可读术，可叹茶，看夕阳西下，看黄叶飘零。无论如何，自由在而幸福的人生，是每个人的梦想，只有具备在不同环境中把握投资机会、管理财富的能力，才能少受俗物的束缚，才能相对享有自我'
  merge: -1
  img_proc: true
- pgno: 11
  md: '的尊严和自由。


    笔者在工作之余，尤好读书，在为中国文化博大精深震撼之余，也深感困惑：中国文化巨著浩瀚万千，却没有一部著作能像《国富论》一样系统地研究金钱和财富；同样，教育传承几千年，直到当前，在基础教育中，也从没有教导学生如何正确获得财富和正确应用金钱；相反，传统文化和教育在理财观上却扭曲和误导大众的价值观：一方面，传统文化不传授财富增长和传承的秘密，却教育大众羞谈钱财，普遍轻视商人和商业；另一方面，让大众在骨子里看重利益，只相信利益的永恒，视利益为一切。传统文化教育的结果，就是很少有人通过合理的投资方式获得财富，大都误入歧途：市井小民将工作当成赚钱方式和谋生手段；精英们一旦有了机会有了权力，就会以权力谋取利益，去获取财富；商人们为赚钱更是不择手段。实际上，财富的秘密只为少数人掌握，如果掌握财富的规律，用财富的思想武装头脑，就能通过正确的途径和合适的方式获得财富，从而少一点为金钱奔波的忙碌、无奈、痛苦、卑鄙甚至悲剧。


    本书既像投资理财的专著，又像历史小说；既有人生哲理的探讨，又有男女情感分析。实际上，这是一本套用历史故事，通过通俗风趣的故事情节来阐述理财真相和投资本质的专业投资书。或许文笔稍嫌稚嫩，故事情节不够跌宕起伏，但读者一定要相信，本书是作者多年投资经验教训的总结，是作者投资思想的精练，是值得借鉴的精华。


    当今社会，大部分中产阶级背负子女教育、住房、医疗问题等三座大'
