  md: '去过哪些地方？国人最喜八卦娱乐，尤以一个叫司马迁的人为胜，他坐牢闲来无事，将名人高官之隐私编撰成书，取名《史记》，用以骝稿费。据其考证：勾践长得极丑，嘴巴突出得像鸟，脖子长得像长颈鹿，范蠢认定这种面相之人心胸狭隘，妒贤嫉能，只能同甘苦而不能共安乐，权力地位稳定之后就会干“狡兔死，走狗烹”的事儿，功高盖主之人早晚被其灭掉，大名之下，难以久居，领导不满意了，与其让他动手，还不如主动辞职走人。所以，早辞职早脱身，是其明哲保身之最佳策略。


