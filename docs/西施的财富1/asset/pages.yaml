  md: '# 一、货币的时间价值原理


    金钱会随着时间流逝而逐渐流失去价值，明天的100元，比今天的100元要贬值一点。


    在理财领域，一个最重要、最基本的原理就是货币的时间价值原理。


    今天的100元和30年前的100元价值等同吗？金额看似相等，但在不同的时间阶段，本质上却是两笔完全不同价值的钱，因为它们的购买力完全不同。如何比较不同时期金钱的价值呢？这就要清楚货币的时间价值原理。


    货币的时间价值原理的含义是：


    今天的100元，比明天的100元更值钱；昨天的100元，比今天的100元更值钱。


    货币的时间价值原理，是财富管理领域的公理，其重要性不亚于数学上“两点之间直线最短”这个公理，是决定其他一切原理和规律的基础。正是因为货币的时间价值原理，使财富领域的一系列现象变得合情合理。存款要有利息收入，借贷要付出利息，投资要追求收益率等。而财富增长的本质、财富流失的秘密等财富规律也建立在这个原理的基础之上。'
