- pgno: 24
  md: '傻吃大便，不过都是装作疯子才吃的，而且吃的是畜生粪便，以勾践这种贵为君王的身份，以正常心态神态自若地吃仇敌的大便，几千年来恐怕仅此一人而已。


    勾践的机会来自夫差，夫差生了一场大病，久不见好，身体状况每况愈下。陪伴勾践一起做奴隶的越国智囊范蠡，通过远观对夫差望诊，判断夫差的病很快要好，于是，勾践去见吴王夫差。“我的主人，恭喜贺喜，您的龙体即将康复。”“何以见得？”“我有祖传绝技，可以尝大便而知病情，明病因，从而对症下药，诊冶疾病；今早您进恭后，我取了您的大便，进行品尝，故而判断您即将痊愈。”夫差听得恶心，仿佛自己吃了大便一样，快要吐了，他问道：“其质若何？其味若何？”勾践曰：“望得夫！这是英文，您不懂的。味道好极了！其色如普罗旺斯的麦草般光芒，其味如天山雪水般甘洌，带着阿尔卑斯山阳光的清新，还有一些苦味，那也是卑斯麦地区啤酒花的芬芳之苦，还略有酸味，就像第戎所产葡萄一样甜中带酸，这种酸苦之味，香兮麦兮，沁心脾兮，就是春夏之气交汇的美妙味道，是健康的征兆，通过细细品味这种滋味，我确信您即将康复。”夫差彻底吐了出来。


    不久，吴王夫差果然完全恢复健康。夫差心想：“肯吃大便之人，不是疯子，就是草包懦夫。勾践思路清晰，肯定不是疯子，看来，他是彻底臣服于我的懦夫。即便是一只丧家犬，也未必能如他这般卑贱地去吃大便，看来，勾践是比狗还忠实的奴仆，他会永远对我摇尾乞怜的。”就这样，勾践凭借一种非人间凡夫肉胎所有的疯狂意志，彻底征服了夫差，于是，夫差不顾智囊团总顾问伍子胥的坚决反对，决意让勾践回国，放虎归山。


    勾践又坐上了久违的王座。王座上的肉身依然是以前的勾践，但这个肉身的灵魂和精神却不复再是以前的勾践，以前的那个脾气暴躁、喜怒无常的勾践不见了，现在的越王勾践，成了钢铁战士和圣人的复合体。


    勾践是钢铁战士，他发愤图强，励精图治，日夜操劳，从不休息，眼睛困得实在睁不开，就用一种叫蔏薪的辣椒一样的植物泡水刺激眼睛以驱'
