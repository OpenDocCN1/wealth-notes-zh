  md: '# 五、猎狗的故事


    直接创造财富的不一定能分到财富，

    但转换一种思想，转换一种平台，财富就滚滚而来。


    西施说：“虫虫哥，我今天很开心，有你在我的背后支持我，做我的智囊顾问，我一定会成功的。对了，你刚才说什么老猎狗来着？”


    鸦夷子皮看到西施打了一个哈欠，说：“天已经很晚了，我们休息吧。老猎狗是一个故事，我以后讲给你听。”


    西施搂着鸦夷子皮坐在床边上，说道：“偏不！虫虫哥，自从生了孩子后，我已经很久没在睡觉前听你讲过鬼故事了，今晚你就给我讲一个嘛！”


    鸦夷子皮用手轻拂西施长发，说：“那我就讲讲猎狗的故事吧。”


    鸦夷子皮于是讲起了猎狗的故事：


    猎狗从小被狗爸爸教育要听猎人的话，要守纪律，要好好学习打猎的本领，否则抓不到猎物，会饿肚子。小猎狗是个好孩子，很听话，努力学习打猎本领，十年寒窗苦学，终于从猎狗管理学院MBA毕业，取得独立出'
