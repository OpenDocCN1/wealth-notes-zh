  md: '成为老猎狗，无法出去打猎，被猎人扫地出门。老猎狗冒充成功猎狗，出版发行《猎狗的打猎技巧》一书，讲述一生的打猎经历和技巧，生动而风趣，许多野狗参照此书学习打猎，甚至猎物都看此书寻找逃生方式，野狗们以高昂顾问费聘请老猎狗为顾问，为它们培训打猎技巧。后来，老猎狗陆续出版《如何成为出色的猎狗》《如何从一只普通猎狗成长为高管猎狗》《猎狗成功秘诀》和《成功猎狗500问》等书籍，成为猎狗打猎行业的名狗。它开展咨询业务，大搞培训，生意很是红火。老猎狗忙于商业应酬之余，也常于静夜反思。直接创造财富的不一定能分到财富，但转换一种思想，转换一个平台，财富就滚滚而来。或许，这就是人与人之间重大差别的根本原因？


    鸥夷子皮说：“西西，以后我就是这只老猎狗，教人打猎胜过自己打猎，可以分享打猎的成果，却不必承担打猎的痛苦和失败后果……”


    他忽然听到微微的鼾声，低头一看，西施已经靠着他睡熟了。他轻轻地将爱妻在床上放好，给她盖好被子，也和衣而眠。'
