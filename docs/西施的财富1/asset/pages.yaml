- pgno: 63
  md: '收入囊中，秘不示人，只为自乐，自誉为高人雅士；有人嗜好美女，美人多多益善，以阅尽天下春色为己任；有人花钱无数，寻仙访道，修心养生，只为长寿百年。


    范蠡说：“比享乐需求更高层级的需求，是对等级地位的需求。中国人崇尚权力，讲究等级地位，对等级高于己者甘愿做孙子装奴才，自卑、敬畏和甘受摆布；对等级低于己者则威风像大爷，自高自大、作威作福，粗暴侵犯其权利。正如鲁迅总结的这样，中国人是羊，同时也是凶兽，遇到比他们更凶的兽时便现羊样，遇到比他们更弱的羊时便现凶兽样。国人缺乏平等的意识和相互尊重的文化，更高的等级意味着更大的权力，等级的提升可以带来生理心理欲望的极大满足感，也让这些人有更大的动力去追逐更高的等级地位。”


    他继续说道：“最高两种需求是高等级地位社会精英的高级需求。儒家为这些精英人士在精神上树立了高标准——责任。通过赋予自我对他人的责任，使自我成为高尚之人，从而获取他人的敬仰和崇拜。这种责任通过仁义礼智信得以体现，而仁义礼智信这种儒家五常，通过几千年的文化道德传承，就成为中国人精神需求的模范标杆。”


    文种：“青史留名的需求是我等社会精英的精神追求。”


    范蠡：“与西方人的最高需求是自我实现的需求不同，国人的最高追求是青史留名，为了实现青史留名的需求，就会付出凡人所不能付出之牺牲，恰如老板勾践之卧薪尝胆。”


    范蠡举了一名青史留名精英的例子。


    他说：“有一极品社会精英，名曰曾国藩，修身齐家治国平天下，在海陆空各个领域，卓有建树，树立了一直被追赶、从未被超越的丰碑，被人称为立德立功立言三不朽、为师为将为相一完人，由凡人成功转型为青史留名的神人和圣人，也成为后世精英神往的偶像和楷模。曾国藩在修身养性、完善人格方面，确实严厉，他基本摒弃一切常人欲望，其对我残忍之程度，非圣人难以望其项背，恐怕只有勾践老板够资格和他PK。有一'
