  md: '子。他说：“《金融时报》这家国际媒体曾经针对高智商的基金经理举办过一个比赛，胜出者获得环球旅行的名额。比赛要求很简单，在0到100中间取一个整数，取值最接近所有参赛者平均取值三分之二的人，就是获胜者。”


