  md: '家大事全凭伯嚭处置。而西施一面缓歌曼舞凝丝竹，愉悦夫差，一面却将吴国的机密偷偷传递给越国。


    当夫差倾国而动、带领全国精锐部队去黄池召开联合国大会、以春秋霸主地位号令天下的时候，这个重大军事动向被西施悄悄报告给千里之外的勾践。勾践抓住了吴国空虚这个千载难逢的重大机会，突出奇兵，以千名囚犯训练而成的精兵，轻装简甲，奇袭吴国，攻破吴国京城姑苏城，杀死夫差之子，迫使夫差媾和，打赢了勾践屈辱为奴20多年来的第一仗，自此一举扭转了吴强越弱的局面。此后10年，勾践屡次攻打吴国都大获全胜，最终，姑苏城被勾践围困三年，城破而国灭，夫差也自杀身亡。


    夫差得到了爱情，丢掉了江山；勾践得到了江山，却吃到了大便，丢掉了人性。乾坤转换间，全因美女西施。得失之间，他们是否会后悔当初的取舍，后人无法得知。后人只看结果：胜者为王，勾践是笑傲天下的胜者，那就是成功者。


    西施不辱使命，完成了她的IMPOSSIBLE 任务。后来她去了哪儿？她离开吴国，避开媒体的闪光灯，远离纷杂喧嚣的名利场，去和她心爱的男人相聚相守了。做女人难，做名女人更难，无论有多坚强的意志，多变幻的手段，多出众的能力，却都有一颗脆弱的心，需要爱情的甘露滋润，即使名贯四海如西施者也不例外。夫差的爱情对象是西施，可西施的爱情对象并不是夫差，支撑西施——这个名女人忍辱负重、游戏人生近10年的强大动力，不是因为爱国，不是因为理想，更不是因为勾践，只是因为爱情——所有女人都看重的爱情，因为一个她愿意终生厮守的男人。为了爱情，为了满足她的男人实现远大抱负的心愿，她愿意赴汤蹈火，愿意完成任何艰巨任务。吴越争霸，夫差由强转弱而灭国，勾践由弱转强而称霸，两个著名男人奋斗一生追求的所谓成功，仅仅因为个弱女子对转念间迸发的爱情之执著而颠覆改变。


