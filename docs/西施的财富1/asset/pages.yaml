- pgno: 193
  md: '绚烂光芒时，这位追求完美型的妻子却发现房子是如此的陈旧，无法和漂亮家具融为一体，她于是又做出了装修房子的决策。


    这个勤劳的女人忙碌了半年，房子装修效果很好，让她很满意，当她即将开始自己设计的美好生活之时，中产阶级老公告诉她一个不好的消息——他失业了！他们再没有能力住这套房子，买家具和装修房子已经耗费全部家庭积蓄，为了节省开支，他们只能卖掉装修一新的房子，包括全新的家具。


    鸱夷子皮说：“为新沙发配新家具，为新家具配新房子，这样一步步走向破产，这个故事，听起来很荒诞，不过在现实生活中，以这种观念生活的人却比比皆是。有人为买名牌包而节衣缩食几个月；有人为参加一次上流社会晚宴而花光半年收入去购买奢侈品牌服装；有人为面子购买豪华汽车，凡此种种。为了腔调、品位、时尚，还有面子，中产阶级精英们将辛苦所得又大手大脚浪费掉，财富被以这样那样的方式挥霍一空。白领，成为名副其实的薪水‘白领’。”


    郑旦问：“作为一个女富婆，我就喜欢买名牌衣服、名牌包包和名牌化妆品，这些名牌，是我生活中必不可少的东西。我有很强的消费能力，难道奢侈的生活就是浪费吗？”


    鸱夷子皮：“所谓浪费，包括那些超出自己消费能力的花费，以及缺乏合理使用价值的不合理消费。富人一掷千金，买跑车、买游艇、买飞机，消费数额虽然很高，但相比其资产和收人，所占比重却很低，这种奢侈生活，在其消费能力内，符合他们的财富能力，算不上浪费。相反的，很多女白领，大量狂购衣服鞋帽，无论价格高低，如果大都被深藏于衣柜中，而不具有实际使用价值的话，就是浪费。”


