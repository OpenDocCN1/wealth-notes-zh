    鸥夷子皮：“人们创造财富的目的，本是为了让财富为我所用，让人们的生活轻松，让人生自由、幸福。但是，在追逐财富的过程中，人们大都迷失了方向。财富，就像蒙住眼睛的黑布，挡住了人们的视野，更禁锢了人们的思想；财富，像吊在毛驴嘴巴前的胡萝卜，永远看得见，却够不着，让人一直劳累，却停不下脚步。追逐财富，成为人生的终极目的，让人不知疲倦，不择手段，也不堪重负。”


    他继续说：“在这种蒙昧的财富心态下，一夜暴富，成为人们的理财理念，理财，就是要追求暴利。在这种错误理财观的指引下，无论是二三十岁的年轻人，还是五六十岁的中老年，无论本金是5万元，还是几亿，无论身家雄厚，还是经济窘迫亟待用钱之人，都在追求投资的暴利，年收益率百分之五十不算多，百分之二十只嫌少，人人为暴利而疯狂，人人因巨亏而痛苦。”


