- pgno: 7
  md: '谈到勾践，就不能不谈到个伟大的智者——范蠡。范蠡之伟大，不仅因其具有精准把握未来的神奇洞察力，也不仅因其曾经拥有至高无上的权力，更不仅因其富甲天下的财富，而是因其于权力和财富间进退自如、收放由我的心境，世上几无人能达的心境！


    当勾践成为夫差的囚徒时，范蠡对其忠心耿耿，陪伴他激励他，共同忍受囚犯的屈辱和劳苦的煎熬，是忠臣更是精神导师，如同持有一只低迷的成长股一般，坚定地支持他；在勾践处于弱势时，范蠡帮助他脱离困境、回到越国，辅助他、指导他实施具体的光复计划，如同投资中的高抛低吸一般，时机不成熟时坚决隐忍，在否极泰来形势转强后，坚决出兵，一举复仇；而当勾践转为强势股后，范蠡却毫不贪恋权力地位，如同抛售高位的优质股一般，坚决退出，急流勇退，偕同美女西施，退隐江湖。


    范蠡去了哪里？过的是什么样的生活？无人知晓，只有传说：哥早已在江湖，江湖上却都是哥的传说。人们纷纷传说：范蠡就是富甲天下的文财神，其于财富三取而三弃。太史公司马迁也给予他高度的评价：忠以为国，智以保身，商以致富。后人尊之为“陶朱公”，陶朱公就是财神的代名词，以至于当今人人知陶朱公，却不知陶朱公何许人也。


    “仙侣已乘小舟去，此地空余范蠡湖。富贵名禄不复恋，白云千载空悠悠。”范蠡放弃权力和财富的想法很让人费解，他泛舟五湖以后的生活很神秘，他经商致富的“陶朱之术”同样很神秘。为了解开这些疑点，本书从范蠡携爱侣西施离开越国开始，展开情节，对英雄美女的平凡生活进'
  merge: -1
  img_proc: true
- pgno: 8
  md: '行构想，试图追溯范蠡淡静从容生活的思想根源，同时，通过对范蠡和西施日常生活的刻画，试图剖析理财和投资的本质。


    范蠡的“陶朱之术”到底是一种什么样的技能？他到底有何别人无从知晓的致富秘籍？虽然江湖上都是陶朱公的财富传说，但却没有陶朱公亲自撰写的关于致富的文字记录流传下来。《范子计然》相传是范蠡所著，以对话的形式记录越国当时的政策，但流传下来的基本不是原版精华；民间流传的《陶朱公商训》一书，明显内容浅显，思想浅薄，应是古代商人假冒范蠡之名而成的民间商业谚语大成。


    为了探索“陶朱之术”的秘密，我斗胆在此天马行空、发挥想象，演绎了范蠡隐退江湖后从事投资理财的故事，通过西施跟随范蠡学习投资、最终成为首富的过程，来讲述投资理财的规律和本质：


    +   财富增长的奥秘是什么？


    +   财富是如何流逝的？


    +   人生财富的生命周期是什么？


    +   千万元不够养老是我骂的说法还是对未来的担忧？


    +   保险、房子等生活现象背后的财富机会？


    +   投资的本质？


    +   如何通过投资获取稳定的收益？


    +   如何管理财富？


    本书以小说形式，通俗风趣地讲述投资理财的理念和技能。通过探究'
  merge: -1
