    的钱，去挣那些不属于你、你也不需要的钱，这种行为简直太愚蠢了！他还说，用对你重要的东西，去冒险赢得对你并不重要的东西，简直是无可理喻的愚蠢行为，即使你成功和失败的比率是100比1。”


