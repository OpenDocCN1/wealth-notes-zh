  md: '府的“通货膨胀税”收入。


    2. 资产所有者。通货膨胀会导致商品物价的全面上涨，土地、房地产等不动产和企业股权等资产的价格也随之上涨。因此，不动产投资者、企业主和囤积货物的商人等资产所有者也是通货膨胀的受益者。


    3. 债务人。通货膨胀会导致负利率，从而使得货币形式的财富贬值，金钱随着时间逐渐缩水，当前借款在未来还款就会有利可图；通货膨胀率越高，负利率程度就越高；借债金额越大，借债时间越长，债务的收益性也就越高。所以，债务人是通货膨胀的受益者。


    4. 银行、保险等金融机构。金融机构吸收客户资金，在未来时点给付，客户的资金，在银行和保险公司的资产负债表上表现为债务，银行和保险公司实质上就是客户的债务人。通货膨胀让债务人受益，同样适用于金融机构，金融机构也是通货膨胀的受益者。


    西施感叹道：“通货膨胀原来有政府的利益呀！原来如此。”


    鹅夷子皮又罗列出了通货膨胀的受害者，也就是那些因通货膨胀而财富受损的人群，包括：


    1. 银行储户和保险公司客户。银行储户和保险公司客户在当期将资金交付给这些金融机构，在未来某个时点收回本金、取得利息或保险收益时，通货膨胀的存在，导致实际利率为负值，因而所取得资金的购买力会缩水，从而受到损失；储蓄或投保的时间越长，通货膨胀率就越高；名义利率越低，财富损失也就越大。


    2. 身处竞争行业的中产阶级。通货膨胀会导致人力成本上升，从而引发社会各行业工资水平进行不同程度的调整，但不同行业的工资调整幅度则差别很大。垄断行业具有转嫁成本的优势，可以较大幅度地提升工资水平来应对通货膨胀，而竞争行业的产品定价权受制于市场，成本转嫁能力较差，工资的提升水平大都无法和通货膨胀保持同步，往往滞后于通货膨胀的发生，提升幅度一般也低过通胀率水平。身处这些行业的中产阶级，虽然新薪收入的数额相对较高，但却难以保持与通胀率一样的增长幅'
