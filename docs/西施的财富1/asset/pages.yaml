    鸥夷子皮道：“普罗大众要掌握理财这门实用技能，只需学习一些实用操作技巧，无需学习复杂的理财投资理论知识，无需精通高深的数学，无需清楚方差和均方差的不同，无需了解阿尔法和贝塔的区别，无需懂得资本资产定价模型，无需牢记夏普公式，更无需掌握各种复杂的金融工具和数学模型，只需具备小学五年级以下的数学能力，懂得指数计算，懂得一点投资理财的基本知识，掌握几个不复杂的数学公式，就能在投资理财的道路上稳步前行。”


