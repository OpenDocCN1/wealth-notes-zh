    以下为白圭的计算过程：


    通过查询，在2.5%的年利率下，20年的年金终值系数为25.59，那么，白先生在35岁时每年缴费17200元，按2.5%的贴现率连续缴纳20年后，在其55岁时的终值价值就是44万元，继续按照2.5%的贴现率，对这个数值计算5年的复利终值，就是49.8万元，这个数字已经大大超过白先生60岁时从保险公司领到的40万元保额；49.8万元在扣除40万元后，剩余的9.8万元在以后10年继续按2.5%进行复利增值，白先生在70岁会就能得到12.54万元，加上之前的40万元，郭先生总计得到52.54万元，已经高过了70岁时从保险公司按低档红利所得的481546.8元；


    鸥夷子皮总结说：“根据白圭的计算，我们可以看到，如果我们将此保险产品的保障功能忽略不计的话，白先生仅仅按2.5%的复利增长方式所得的数额，已经不少于保险公司按低档水平给出的收益，这意味着白先生只要将缴纳的保费存银行，每年存取钱一次，将银行的单利通过这种操作，变成复利，就能取得大过保险产品的收益。”


    他接着说：“保险，因其法律条款的繁文缛节、收益精算的高深复杂，给普通大众一种神秘复杂的感觉。普通大众大都凭借一些琐碎的信息，想当然的判断，去认识保险，因而对保险存在种种误解。有人认为保险是骗人的，保险是用纸换钱——用一叠写着高深莫测法律条文的纸张去换取大众手中的金钱；有人对保险的投资收益期望过高，以为买够保险就可以保障人生的美好；也有人在认识到保险的预期效用与实际功能存在巨大差距后，就认为保险是骗人的玩意兒。实际上，这些都是大众对保险的误解。”


