- pgno: 134
  md: '人生，因机会成本而充满着不确定性。从这点来说，人生是一场游戏，一场不到结束不知输赢的游戏。对普罗大众而言，人生也是一场金钱游戏，一场有关金钱抉择的游戏。这就涉及金钱的机会成本。”


    道生问： “什么是金钱的机会成本呢？”


    鸽夷子皮： “你有100万元的金钱……”


    道生： “我木有这么钱……”


    鸽夷子皮：“假设你有100万元。这100万元，你可以消费掉，也可以用未投资。如果金钱被消费掉的话，就丧失了投资的机会。例如，你可以拿100万元买辆新款跑车，也可以将100万元储蓄起来，假如银行一年期储蓄利率为5%的话，一年后你就会有的105万元。”


    道生笑嘻嘻：“我当然会用来买跑车，谁稀罕多出5万元呀！100万元本来也买不了什么大好的跑车。”


    鸽夷子皮板起脸来训斥道生：“别打岔！好好听课！如果100万元被用来买跑车，买车的机会成本就是105万元。”


    西施问：“不是100万元吗？为什么机会成本会多出5万元呢？”


    鸽夷子皮解释道：“消费的机会成本，等于投资的本金加利润。如果100万元没被消费，而是储蓄起来，那么，就可以得到5万元的无风险收益。多出的这5万元就是当前放弃消费而会得到未来收益的补偿，这也是货币的时间价值原理在投资决策上的具体体现。所以，今天的100万元和一年后的100万元相比，是不等值的，因为今天的100万元，可以通过银行储蓄取得无风险收益，假设银行年利率为5%，今天的100万元在一年以后将等值于，100×（1+5%）=105万元；同理，按照5%的银行利率，一年后的105万元等值于当前的100万元。”


    他说：“货币的时间价值原理，是货币的机会成本的具体体现，是财富管理领域的基石，财富管理领域内所有投资分析公式和模型都是以此为基础的。”


    他再次重申了货币的时间价值原理的重要含义：'
