  md: '胀率，那么：


    ```

    $$1 + r = ( 1 + R ) ( 1 + i )$$

    ```


    ```

    $$R = r - i - R \cdot i$$

    ```


    $R \cdot i$ 数值微小，忽略不计，从而得出：


    ```

    $$R = r - i$$

    ```


    也就是说：实际利率等于名义利率减去通货膨胀率。


    鸥夷子皮道：“在理财投资应用中，要采用实际利率，而非名义利率来作为贴现率，才能正确进行关于复利的计算，从而不受误导。”


    他归纳了在几种不同的情况下，财富受通货膨胀率的不同影响：


    +   1. 当通货膨胀率小于名义利率时，实际利率为正，银行储蓄具有保值作用，以货币形式体现的财富会得以增值。


    +   2. 当通货膨胀率大于名义利率时，实际利率为负，银行储蓄不具有保值功能，以货币形式体现的财富会贬值，这种财富会逐渐流逝。


    +   3. 如果不进行投资，也就是名义利率为0，实际利率必然为负，等于通货膨胀率的负值，货币形式的财富，将会随着通货膨胀率的不同，从而会以不同程度复利的形式，慢慢流逝。


    西施问道：“当实际利率为负时，随着时间的长短，通货膨胀率的不同，财富究竟减少多少了呢？可以具体量化吗？”


    鸥夷子皮给出了通货膨胀率导致财富贬值的计算公式：


    ```

    $$F = A ( 1 + R )^{t}$$

    ```


    其中，$A$ 为本金，$R$ 为实际利率，是负值，$F$ 为经过 $t$ 年时间在 $R$ 的贴现率水平下资金 $A$ 的复利终值。


    鸥夷子皮说：“因为$R$为负值，所以，随着时间的推移，F的数值越来越小，终值和本金的比值——$F/A = (1 + R)^t$，我将这个比值称为贬值系数。”


