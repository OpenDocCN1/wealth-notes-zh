    鸥夷子皮给同学们讲了一个小故事：


    摩洛哥人好吃沙丁鱼，有一名具有商业天分的阿拉伯商人将千里之外的沙丁鱼制成罐头，运来摩洛哥，发了大财。沙丁鱼罐头在摩洛哥商人之间反复转手，反复被抬高价格，交易者都大小不等地赚了钱；慢慢的，商人们发现：将沙丁鱼罐头囤积起来，囤积时间越久，赚得越多，于是，摩洛哥人不再好吃沙丁鱼，而是更喜欢囤积沙丁鱼罐头，沙丁鱼罐头成了让工人赚钱的交易品种。


    某一日，阿拉伯商人的岳父从国外赶来探望女儿。他的女儿为了盛情招待父亲，决定用价格昂贵的沙丁鱼罐头款待父亲。她来到收藏室，打开一罐沙丁鱼罐头，发现里面竟然装满了沙子！她又打开了另一罐，里面同样装满的是沙子，她不敢相信自己的眼睛，于是，打开所有的沙丁鱼罐头，结果里面一样装满了沙子！她以为丈夫上了别人的当，愤怒地将这件事告诉他时，没想到，精明的阿拉伯商人狡黠地眨眨眼，告诉她：“我亲爱的夫人，你根本不知道，这些沙丁鱼罐头是用来交易的，不是用来吃的。”


