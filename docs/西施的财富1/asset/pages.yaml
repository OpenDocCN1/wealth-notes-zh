- pgno: 192
  md: '去揣测他人，表面上，相互间却极尽赞美之词；背地里，阴谋诡计则层出不穷。节俭和浪费，这两种完全冲突的行为，就是这种文化的集中反映。数千年来，战乱频仍，在漫长的历史长河中，食物、金钱等长期属于稀缺资源，人们在对待这些稀缺资源的行为上，所表现出来的节俭和浪费相矛盾、口是心非、言行不一，正是阴谋和虚伪为主导的文化淋漓尽致的反映。所谓‘勤俭节约光荣，奢侈浪费可耻’，要求他人具有节俭的美德，正是为了自己的浪费。所以，只要具备浪费的能力，即便是穷人，都可能会喝豆浆，买两份，倒一份。浪费，其实已经深入我们的骨髓。”


    鸥夷子皮讲道：“勤俭节约，只是国人身处贫穷环境时的遮羞布。国人崇尚富贵，挥霍、铺张和浪费是炫耀富贵的最好方式。所以，炫富文化是国人的真正文化，炫富心态是社会主流人群的真实心态，浪费是社会的通病。挥霍和浪费，甚至荒唐地成为促进经济、刺激消费、拉动内需的有效经济工具，勤俭节约，则成为穷困和低贱的代名词。”


    猗顿点头：“确实如此。”


    鸥夷子皮接着说道：“在这种怪诞的社会风气影响下，中产阶级们也随波逐流，大都丧失了独立思想，随社会大流而铺张浪费，追求奢华。中产阶级一面在感慨生活压力大，财富难以积累，卖力工作只为多赚点，另一方面，却又在大肆浪费。或许，大部分中产阶级的精英们，根本没有意识到铺张浪费，才是财富流逝的最重要原因！所以，命苦不要怨政府，自己不能聚财的根本原因，是来自个人自身的浪费！”


    郑旦插话说：“老师讲到浪费，我想起了一个小故事，比较夸张地描述不合理的浪费是如何步步扩大，直到最后成为中产阶级精英不堪承受的重负。”


