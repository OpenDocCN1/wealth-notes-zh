  md: '会大发感慨，虽然具有良好的教育，但年轻时要为谋生而辛勤工作，年老后却仍然要为谋生而辛勤工作，和民工并无任何本质不同，都要勤劳一生。看似生活水平在提高，但却是不劳动就不得食，手停口就停，生活，为什么会如此拧巴呢？


    遥想到中产阶级未来的凄凉晚景，鸱夷子皮不禁一声叹息。


    郑旦说：“中产阶级的养老问题，未必会如此惨淡吧？我去米国之前，一直以为米国人民生活在水深火热中，但长期居留后才知道，米国人民虽然储蓄率很低，但退休者的养老花费并不多，普通民众的养老金来源，除了政府的养老金制度，更主要是来源于一个401（K）计划。那么，什么是401（K）计划？我们可不可以借鉴这个401（K）计划呢？”


    鸱夷子皮点头，对这个问题表示认可，他说：“所谓401(K)计划，是米国雇主为雇员设立专门的401(K)个人账户，雇员每月从工资中拿出一定比例的资金存入该账户，大部分雇主也会按照一定比例往这一账户存入相应资金，雇主的缴费能获得税前扣除，雇员的缴费也能获得个人所得税税前扣除，这些计入雇员个人退休账户的资金，在雇员退休前，除非有重大原因，一般不得领取，只有当个人账户资金被取现或退休领取时，雇员才需缴税税款。因此，401(K)账户对雇员来说，具有税收递延的效果。


    “401（K）账户通过政府递延纳税、雇主和雇员共同出资，账户资金被投资于股票、基金、年金保险、债券、专项定期存款等金融产品，由雇员自主选择账户的投资方式，投资收益完全归属于401(K)账户，投资风险也由该账户承担。雇员退休后领取的养老金多少，既取决于缴费额的高低，也取决于投资收益的状况。”


    鸱夷子皮说：“401（K）账户，本质上是政府、雇主和雇佣共同出资，为解决雇员未来养老金缺口而设立的个人投资账户，政府通过抵押纳税的方式参与。这个养老制度，让米国民众在退休后大都安享晚年，虽然在个别时期内，因资本市场的大幅波动，造成了少部分人账户的严重缩水，但从长期来看，401（K）账户通过让个人账户参与投资，让每年的'
  merge: -1
  img_proc: true
- pgno: 251
  md: '定投以复利形式增长，从而基本解决了米国民众晚年的养老之忧。因此，米国的个人储蓄率看似很低，但其养老金资产却很高，高达其GDP比重的120%以上，类似这种依靠企业和个人设立的个人退休账户的资产，更是高达政府养老金的5倍以上，完全可以让米国人晚年无忧。”


    欧美子皮接着说道：“反观我们：储蓄率看似较米国高出很多，但我们缺乏米国人的个人退休养老账户，储蓄率虽高，除了大量的企业存款也个人的名义储蓄，实则隐含很大比重的个人养老积蓄，但这种不能被用作投资的储蓄，长期来看，存在着大幅贬值的风险；另外，90%以上民众的养老金，都依赖于政府社保，只有极少数人有商业保险或企业年金，自我设立个人退休账户的人，更是寥寥。无论是养老金结构还是规模，都不能提供足够的养老保障，中产阶级以后的养老生活，真是堪忧啊！"


    欧美子皮感慨地说：“如果缺乏强大完善的社会福利保障系统；如果缺乏币值稳定的金融体系，那么，穷人没有安全感，富人也同样没有安全感。当前积蓄的千万资产，看似有一定经济实力，但是，养老问题仍然会让这些千万富翁滑向穷人阶层这边。更何况，养老问题，并不仅仅是金钱问题，如果未来人口红利消失、人口老龄化严重，进入老年社会，退休老人比例过重，工作人群比重小，养老设施严重不足，养老医护人员严重不够，用血量加大而供血量不足，医疗费用昂贵，那么，未来真的是不堪想象啊！"


