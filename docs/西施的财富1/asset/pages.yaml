  md: '果腹需求以后，就会停下猎取食物的脚步，而羚羊、麋鹿等小动物也会在其身旁安然散步，大小动物们会沐浴于自然的阳光下，嬉戏玩乐，享受生活，这就是弱肉强食的大自然的原始生态。与此大相径庭的，是人类的欲壑难填。”


