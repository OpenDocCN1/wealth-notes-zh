  md: '西施问：“高利贷的利息如此之高，作为债权人，当然是一件美事，但债务人能承受得起这么高的利息吗？高利贷生意，不是一门能长期持续稳定经营下去的生意吧？”


    鸥夷子皮道：“你讲得一点没错，高利贷确实是一门不能持续稳定经营的生意。以月息五分为例，年息相当于79.6%，借债两年，利率高达222.5%；如果算三年的利率，将达到479%！试想，有什么行业的利润能达到这样——年收益率80%、两年2倍多的收益、三年5倍的收益率？如果债务人以月息五分以上的利率借贷，短期之内或许有清偿能力，如借贷为期半年，需偿还利息为34%，这个利率水平尚能被债务人有能力清偿，债权人也有很大概率收回本息，借贷双方各取所需，皆大欢喜。但是，如果借贷期为期一年以上，债务人将无法承担得起利息负担，他只有三条出路，放弃家庭逃跑，通过逃跑逃废债务；被告上法庭而坐牢；自杀，一了百了，走杨白劳的老路来逃废债务。债权人同样也会损失惨重，不但得不到利息收入，还要损失本金。”


    郑旦说：“高利贷业务原来对借贷双方都有很高的风险啊！”


    鸥夷子皮：“利息过高的高利贷，注定是无法持续连续稳定经营的生意。高利贷利率过高，债务人的借债期限过长，必将无法正常清偿债务，债权人的利益最终也会严重受损。大量的高利贷公司或者放贷者，处于高利贷链条的中游，既是一些债务人的债权人，又是一些普通民众的债务人，如果业务不能持续，下游债务人因无法承受高利息而逃跑，就会引起整个高利贷资金链条的断裂，链条中间的高利贷公司和放贷人不能收回资金，也会选择逃跑而逃废债务，最终的结果就是，那些图谋高利率的普通民众，将会丧失本金，为整个高利贷产业链的雪崩而埋单。”


    李大拿：“从长期看，高利贷损人又害己！”


    鸥夷子皮总结高利贷：“高利贷在初始之时，或许能让债权人收获高额利息收入，但最终债务人是无力负担如此高昂的复利利息的，高利贷的资金链最终会断，债权人如果没能及时退出，必将遭受损失，当初获得的'
