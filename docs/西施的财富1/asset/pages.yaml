- pgno: 100
  md: '去打猎的资格。


    猎狗将一只兔子赶出了窝，一直追赶，追了很久，却没有捉到。牧羊人讥笑猎狗说，你真是越大越迟钝，竟然跑不过一只小兔子！猎狗不服气，反驳他，你可不知道，我和兔子奔跑的目的完全不同！我仅仅为一餐饭而跑，他却是为性命而跑的！


    猎人知道后，为猎狗制订了严格的奖罚制度，规定猎狗抓到大猎物才有骨头吃，抓到小猎物或没有收获的话，就要受惩罚，饿肚子。猎人还采用了精神奖励法激励猎狗。如果猎狗表现优秀，则被授予“优秀猎狗”的名誉称号；如果猎狗成绩卓越，捕获猎物最多的话，则被授予“最能干猎狗终身成就奖”或者“英雄猎狗白金奖章”等不同的奖章，名载猎狗史册。猎人的管理制度很有效，猎狗早出晚归去打猎，捕获了很多猎物，给猎人赚了很多钱。


    猎狗自然也要娶妻生子，随着家庭成员增加，生活负担也加重。猎狗意识到，荣誉奖励不如物质收入提高更能满足现实状况，它从猎人那儿得到的骨头甚至不够全家吃饱肚子，更不用说让小猎狗吃到肉。猎狗去找猎人商量，我得到的骨头，相比我捕获的猎物，微不足道，难以满足家庭日益增长的物质需要，能否改革体制，采取分成制，多劳多得，从捕获的猎物里多分得一些肉？结果遭到猎人斥骂，狗东西！我好吃好喝养活你，你不知好歹，贪得无厌！于是，猎人将猎狗赶出家门。


    猎狗成了野狗，自己给自己打猎。它要和猎人的其他猎狗竞争，拼抢有限的猎物。猎狗为生存而拼抢，但猎人的猎狗有猎枪的垄断优势，所以，野狗偶尔会成功抢到丰盛的猎物，但大部分猎物基本被猎人的猎狗所垄断。随着冬天的到来，猎物减少，猎狗饿得头昏眼花，但猎人的猎狗却有旺季打猎积存的骨头吃。猎狗意识到个人的力量无法抗衡社会体制，于是又回到猎人那里，痛哭流涕，痛打自己嘴巴，向猎人道歉，请求猎人原谅，猎人重新收留了猎狗。


    猎狗又过起了只吃骨头的吃不饱饿不死的安稳日子。年复一年，慢慢'
