- pgno: 23
  md: '取夫差欢欣，从而寻求脱身机会。常人在这种状态下，早已精神分裂而疯掉；勾践作为王者，其意志和毅力迥乎常人，其坚忍程度非凡人所能想象，其忍受痛苦程度让凡人匪夷所思，其自我激励之所作所为更让人惊叹。虽说男人应该对自己狠一点，但像勾践这样自虐尤胜于酷吏虐待死囚却世所罕见，其疯狂自虐的程度，普通人早已精神分裂，但勾践没有疯掉，反而逐步爬升，最终摆脱困境，到达人生辉煌峰顶，成功实现他的梦想。


    勾践的精神分裂症或许是先天性的。当他继承越王之位后，展开对吴国的第一战，其作战方式就是精神病式的：两军对垒，即将决战，勾践却命令己方士兵叫喊着在阵前自杀，吴国士兵惊呆了，忘了自己是来砍人的，津津有味地看着越国士兵表演马戏，勾践忽然出兵，以少胜多，打败吴国军队，射死吴国老国王——夫差的老爸阖闾。


    夫差怒发冲冠，不为红颜，只为老爸。勾践有事业心，夫差同样不是省油的灯。在精心备战期间，夫差为了保持高昂的斗志，夜夜只在柴火房的干枯的树枝上休息片刻，而不再睡在王宫舒适的席梦思软床上；为了提醒自己不忘父仇，他让手下每天这样问候自己：“How
    are you, Sir?你小子忘了老爸怎么死的吧？”夫差就大声回答：“Fine, thank you。我从不敢忘记杀父之仇，我发誓一定会活捉勾践，将那小子挫骨扬灰！”


    吴国远强大于越国，吴越再一次对战，夫差一举活捉勾践，但越国施展强大的银弹攻势，收买了夫差最信任的下属伯嚭，伯嚭巧舌如簧，竟然让夫差鬼使神差地相信：以勾践为奴隶供己驱使虐待更爽，而非将他烧成灰。


    于是，勾践成了夫差的马夫。他死心塌地甘做奴隶，为夫差喂马、套马车、牵马，跪在地上让夫差踩着上下车，受尽屈辱，却毫无怨言；他每日冒着随时掉脑袋的风险全身心地伺候夫差，发自内心地对夫差臣服，但仍无法取得夫差信任；在巨大的生存压力和疯狂的复仇决心下，勾践做出了更疯狂的举动：品尝夫差的大便，取得夫差信任，彻底消除敌意。虽说有前人如孙膑、后人如明朝朱棣等枭雄帝王同样为躲避仇敌迫害而装疯卖


