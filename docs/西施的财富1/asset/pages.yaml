- pgno: 178
  md: '鸥夷子皮道：“通过以上两点结论，我们可以看出，实际上，货币供应量的增长率远远超过GNP总量的增长率，推动单位GNP增长所需的货币量增速很快，即便考虑货币流通速度降低的因素，当前的货币总量，也远远超过经济总量增长所需的实际货币数量。这种大幅度增加的货币总量，必然产生通货膨胀。”


    那么，通货膨胀应如何计量？鸥夷子皮又讲起通货膨胀率来。


    一般用通货膨胀率来表示通货膨胀的严重程度。通货膨胀率可以数量化显示物价平均水平的上升幅度，也就是货币购买力水平的下降程度。


    如果将当期的物价水平记为P1，将要比较的作为参照的基期物价水平记为P0，那么当期相比基期的通货膨胀率就是：


    通货膨胀率=当期物价水平P1-基期物价水平P0÷基期物价水平P0；


    求出的数值，用百分率表示，就是通货膨胀率。物价水平一般用价格指数的增长率表示，如消费者价格指数(CPI)、生产者价格指数（PPI）、零售物价指数（RPI）等。消费者价格是商品经流通各环节而形成的最终价格，最能全面反映商品流通对货币的需求量，因而，CPI是最能充分全面地反映通货膨胀率的价格指数，通常都用CPI来计算通货膨胀率。


    鸥夷子皮说：“在我刚才所举的例子中，32年间，齐国的GNP年均增长15.8%，M2年均却增长了23.4%，货币供应量的增长大大超过经济增长的实际需求，超出部分是7.6%，如果我们将问题简单化，忽略掉货币流通速度这个因素的话，那么，这个7.6%，就是32年的年均通货膨胀率。正是因为这个通货膨胀率的存在，使得货币贬值，使得以货币形式存在的财富逐年在流逝。”


    郑旦大叫起来：“7.6%的通货膨胀率！老大，这也太夸张了吧？！新闻媒体的报道所说的通胀率仅为4%，已经让民众感觉生活的压力之大，已经让人感觉极其严重了。你竟然算出的通胀率为7.6%，而且是32年年均通胀率！这也太让人吃惊，太动摇民心了吧？你可不要以危言耸听罪被抓走啊，老大！”'
