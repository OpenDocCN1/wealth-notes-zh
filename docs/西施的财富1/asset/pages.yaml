  md: '# 误解一：买了保险后就不会有风险


    有人不了解保险的转移风险、均摊损失和经济补偿的功能，将保险看做消除风险的方式，以为花钱买了保险后就不再会有风险。保险实质上是一种对风险进行经济补偿的财务安排，不是一种破财消灾的护身符。如果将保险当成花钱消灾的工具，不对作为家庭经济支柱的成年人购买保险、进行意外风险保障，只因过分宠爱孩子的原因，过多购买少儿险，那么，当意外的风险不幸发生之时，少儿险的经济补偿对于父母的作用并不大，反而是作为家庭支柱的大人出现意外后，如果缺乏保险的经济赔偿，更容易让家庭陷入财务困境。


    # 误解二：将保险当成投资产品


    有人不了解保险的保障功能，将保险当做一种储蓄或者投资产品。虽然确实有很多保险产品具有储蓄或者投资功能，但一般都要在剔除保险营销费用等经营费用和管理成本后，剩余的部分保险才会被用作投资，而这些经营费用和管理成本并不低廉，相比将资金直接储蓄或投资，保险产品用以投资的本金明显要大打折扣，将保险当成投资产品，期冀获取高的投资收益，是不明智的。


    # 误解三：认为保险的收益率很高


    大部分人不懂复利的威力，往往将保费支出和从保险公司取得的保险金进行直观比较，以为增长了好几倍，从而将保险当做高收益的投资产品，殊不知，几十年增长几倍，复合收益率不过百分之几而已。实际上，传统寿险在很长时间里，其真实收益率不过2.5%左右。如果对保险存在这种误解，对收益率的期望越高，最后失望也越大。


    # 误解四：将保险认同于完美保障


    有人以为购买了人寿养老保险后，未来养老就高枕无忧。实际上，在通胀环境下，养老保险的年限越长，保险的现金价值缩水越厉害。


    鸭爽子皮说： “保障的归保障，投资的归投资，只有清楚保险的功能，才能购买合适的保险产品。在稳定的经济环境下，保险公司的专业投'
