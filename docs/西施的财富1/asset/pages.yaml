    # 白毛女的悲剧：高利贷背后的计息问题


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_206_0.png)


    高利贷行业是冒险家的乐园：老实的债务人会最终因偿还不起利息而承受巨大损失；老实的债权人并不一定能获利，最终也会因资金链的断裂而承担本金损失。真正获利的，唯有那些狡猾而冒险的债务人，借债之后，就根本没打算偿还，随时准备逃跑；还有那些狡猾而冒险的债权人，吸收普通民众存款之后，随时准备卷款逃跑的放贷人。'
