  md: '当到了中年时期后，收入稳定，积蓄良好，但子女教育支出、偿还银行贷款支出等开支巨大，并且，未来的养老支出、医疗支出也成隐忧，必然要纳入考虑范围。这个阶段的理财规划，就既要考虑当前的教育支出、购房支出，还要考虑未来的医疗支出和养老支出，更要考虑防范人生意外导致的家庭风险。这个阶段的理财策略，既要考虑投资的收益性，又要谨慎应对人生的各项大额支出，难以承担较大风险，因此，投资策略要偏保守，要合理理财，做到攻守平衡。


    当进入老年时期后，子女长大成人，离家工作，房屋贷款大都偿还完毕，中年时代的各项负担减轻消除，人生的开支，基本就是养老支出：高昂的医疗费用、身体保健的支出、日常生活费用、一定的旅游、娱乐、休闲费用。这个阶段，依靠固定的养老金和积蓄，收入相对固定，开支却可能很大。特别是医疗开支，人生80%以上的医疗费用都在这个时期开支，所以，这阶段的理财策略就要保守，不宜追求投资增值，只求保证财富的保值。在年过50以后，如果还拿着全部身家博取暴利，投资股票或其他高风险品种，无异于在悬崖边溜旱冰，一旦失误就会造成悲惨的老年生活。


    2. 理财，是一种资产配置的过程。理财不等于买股票发财，也不等于买保险而万事大吉，更不等于买房子保值增值。理财，通过在人生的不同阶段、进行不同的资产配置，来满足人生各阶段的需求、实现人目的一种行为方式；理财，通过将财富在不同的资产如现金、储蓄、债券、股票、保险、房地产、信托等工具上，进行不同比例、不同期限的配置，从而获取收益，对冲经济风险。因此对当前和未来做好规划，让人生得到足够的经济保障。


    3. 理财，是消费、保障和投资协调统筹的一个过程。理财，既要考虑当前的消费支出，也要为未来的消费进行规划，未雨绸缪；理财，通过合理规划当前和未来的收支，进行金钱安排，让当前开支得以保证；通过投资，让未来支出也得到预先规划，从而降低漫长人生道路上的经济风险。


    4. 理财的核心，是投资。只有让财富得到连续稳定的增长，才能满足未来增长的消费需求，理财才真正实用而有意义。'
