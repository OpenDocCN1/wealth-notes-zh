    勾践靠着阳谋和阴谋双管齐下、美女和战士共同使用的打法，完成了由弱转强，而吴国由强转弱的根本改变。当勾践一声令下，举兵征伐吴国之时，吴国军队早已羸弱不堪，任凭宰割，夫差唯有自杀谢罪。


    勾践成功了，他实现了人生理想，成为了王中王，成为了春秋霸主，但勾践感觉自己并没得到什么，他并不快乐。勾践彻底空虚了，他又恢复'
