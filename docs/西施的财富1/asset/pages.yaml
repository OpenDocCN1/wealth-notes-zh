    鸥夷子皮点头说：“说到税收，税收是国家分享公众所创造国民财富的一种制度。税收的作用，可以保障国民基本社会福利，维持国家正常运作。税收，是国家财政收入的最重要部分，是国家的经济基础，也是国民的基本义务。”


    猗顿问：“既然如此，为什么老师要说税收是财富锦囊中造成财富流逝的三大方式之一呢？”


    鸥夷子皮：“税收，在本质上相当国家和公众直接分蛋糕，国家税收越高，相当于国家分割蛋糕的比例越大，那么，公众分得的蛋糕就越小，公众所得到的财富就越少。所以，从公众财富的角度来看，税收的合理与否，直接影响到公众的财富。”


    道生：“我又不开公司，税收高不高，关我毛事？”


    鸥夷子皮摇头：“你完全不了解税收。有人认为自己不开公司，税收与己无关；有人认为自己收入不高，无须交纳个人所得税，交税这事儿，与己无关，这其实完全是对税收的误解。税收，不仅包括个人所得税'
