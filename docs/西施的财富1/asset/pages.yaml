    # **财富锦囊的三大窟窿之三：税收**


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_199_1.png)


    富人们难以将财富代代传承的根本原因，就是因为大多数人完全不懂财富的规律，虽然因某种机缘巧合而暴富，但却不懂如何采取措施去保护财富，去抵御财富流逝，去增长财富，所以才形成了绝大部分人最终老来穷困的宿命轮回。'
