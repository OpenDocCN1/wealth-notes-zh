  md: '说，并非一件多么值得炫耀的成功。所以，20年后，40岁的人拥有4000万的身家，并非那么遥不可及，更不见得就一定是杰出的商业成功者，如果通货膨胀严重的话。”


    西施道：“那么，应该如何评估人的身家？”


    鸱夷子皮答道：“我们前面讲过，每个人都像是资产，会产生收入，也会有支出，收入扣除支出之后，如果还有盈余，这盈余就是财富的积累，正如物质资产也会带来财富一样。虽然，每个人产生财富的方式不同，有人向他人提供知识、劳务、技能等来产生财富，有人通过实业经营产生财富，还有人购买能带来收入的资产、靠资产的收益来产生财富，但从能创造收益的经济角度来看，人，这项经营性资产，相比房地产、债券、商铺、股权等资产来说，并无任何区别。既然资产可以估值，可以评估，那么，作为创造收益的人，同样也可以进行定价和估值。估值越高，我称之为价值越高，此类人，称之为高价值者；估值低者，价值也低，称之为低价值者。”


    郑旦说：“对人进行定价和估值？我头一次听说，太新鲜了。老师没准开创了一门新学科，或许在财富管理领域开创了新纪元。”


    鸱夷子皮说：“你别开玩笑人了。人，本身就由不同的价值，只是没人这么说而已。我现在只不过要通过数据分析，将不同人的价值显性化。”


    他接着说：“要对某个人进行估值，就要确定这个人的年收入扣除支出之后的盈余情况。高收入者，不一定就是高价值者；高价值者，只与人每年的盈余数额正相关，所以，每年盈余额或积蓄高的人，才有可能获得高的估值。”


    鸱夷子皮根据人的收入与支出情况，将所有人分为四类：


