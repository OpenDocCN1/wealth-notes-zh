  md: '道生困惑地问：“不少中产阶级人士，也明白投资是理财的核心，也投身到股市之中，但是，财富不但没有增长，反而亏损累累？复利增长的财富确实很诱人，可是，为什么现实中真正达成投资目标的人却不多见？”


