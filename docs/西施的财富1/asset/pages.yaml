    这次，白圭通过计算，很快得出：k=14.1%，也就是说，年均收益率为14.1%的话，10万元的资金经过35年的增值，就可以达到1000万元。


    郑旦感叹道：“百分之十几的收益率！这简直是任何一个普通股民都容易实现的收益率！”


    鸥夷子皮继续引导学生，他说：“有的年轻人，野心勃勃，拥有宏伟梦想，梦想富甲一方，像巴菲特、索罗斯一样成为大富翁。那么，这个梦想是痴人说梦吗？像这些老富豪一样，在70岁时拥有10亿元以上的资产，有可能吗？"


    同样，鸥夷子皮又出了第三道命题。


    **命题三：** 一个25岁的年轻人，当前的资本为10万元，他如果要在70岁时拥有10亿元资产，那么，他的年均投资收益率应该为多少？


    这次，道生抢着回答问题，他说：“这是求45年内增长1万倍的投资收益率问题，通过计算，可以得出k=22.7%！也就是说年均投资收益率达到22.7%的话，经过45年的增长，10万元就能增值1万倍，达到10亿元！天哪！多惊人的财富！”道生很是赞叹。


    鸥夷子皮说：“这个收益率，相比第一道命题的收益率，只增加不到1%，但是时间多了10年，收益就增长了10倍，70岁时就能达到10亿元。可见，收益稳定的话，时间就是财富。”


