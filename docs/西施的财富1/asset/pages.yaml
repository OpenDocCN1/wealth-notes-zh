  md: '# ## 二、房地产投资的杠杆效应


    同样房价上涨4倍，在杠杆分别为5、3.3和2倍的情况下，投资收益率就高达15、10和6.7倍，杠杆大大放大了投资收益！


    鸱夷子皮说：“房价的持续上涨，使得投资房地产获利可观，投资收益也高到惊人，房价或许涨了3倍、5倍，但房地产的投资收益可能高达10倍、20多倍！”


    道生惊奇地问：“房地产的投资收益怎么会有如此之高？”


    “秘密就在于房地产投资应用了杠杆。”


    道生追问：“什么是房地产投资的杠杆？”


    鸱夷子皮作出解释：


    买房子时，可采取银行贷款方式：先支付一定比例的首期房款，然后以房子作抵押，向银行贷款再支付剩余房款，然后在约定还款期限内按月偿还银行贷款。根据支付首期房款比例的不同，投资收益相对房价涨幅就具有了不同的杠杆：


    +   1. 如果支付20%的首期房款，杠杆是5倍。'
