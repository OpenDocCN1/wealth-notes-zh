  md: '好状况如同灰姑娘的水晶鞋一样，忽然消失之时，盲目乐观者将不仅仅是措手不及，更要遭受重挫。实际上，当经济迈入衰退期时，企业会因经营困难而破产倒闭，普通大众会遭遇裁员，工作者收入会降低，个人的财富会大幅缩水。当高收入状况遭受重大逆转时，日常的生活开支、房屋贷款、子女教育、医疗和养老等支出却是刚性的。所以，要对经济紧缩一定有思想和资金上的准备。


