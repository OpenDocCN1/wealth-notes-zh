  md: '# ## 三、如果通货膨胀，我们应该怎么办


    在高通胀时代，贷款，是贷款者的通行证；储蓄，是储蓄者的墓志铭。


    郑旦问：“如果发生严重通货膨胀的话，作为普通的中等阶级中的一员，该怎么办呢？”


    鸥夷子皮给出了应对通货膨胀的办法：


    +   1. 拓展投资渠道，提高资金投资收益。中等阶级们理财时，要降低资产组合中银行存款的比例，提高收益较高品质地占比，通过拓展投资渠道，相对提高投资收益。投资渠道包括，实业投资、购买理财产品、直接投资股票、借款给他人收取利息等。但这种方式的风险很高，对大部分中等阶级而言，本身不具备正确的投资思想和投资技能，盲目追求高收益的结果是大多亏损累累，不但跑不赢通胀，反而让本金遭受很大损失。


    +   2. 借债也是一种策略。通货膨胀惩罚节约者，奖赏借债者，所以，成为借债者，也不失为一种应对通货膨胀的消极策略。“无债务一身轻”的不负债策略，一直被国人视为传统美德而代代传承，中等阶级在进行购房买车等家庭大宗消费时，虽然大都采取按揭方式——向银行贷款，但只


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_187_0.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '+   3. 被动策略——维持现状，等待机会。通胀无牛市，通货膨胀严重，投资风险也大。在高通货膨胀率环境下，普通投资品种的收益大都难以弥补通胀的损失，为了跑赢通胀而仓促胡乱投资，投资亏损的可能性很大，损失会更大。所以，与其在高通胀的混乱经济环境中乱投资、遭受更大损失，还不如被动等待，去承受通货膨胀的侵蚀。等待，也是一种投资策略，虽然是一种无奈的消极策略，无法让人获利，但却能回避更大的损失。


    鸥夷子皮叹息道：“在高通胀时代，贷款，是贷款者的通行证；储蓄，是储蓄者的墓志铭。这个社会就是这么疯狂，高通胀让那些老实本分的储蓄者遭受损失，却让那些胆大妄为、大笔借债的胡作非为者大发其财。如果说，复利式的财富增长只有极个别人能实现，但复利式的财富损失却是每个人都在承担，这就是通货膨胀。在高通货膨胀率时代，任何投资都无济于事，除了炒作物质、囤积资产，理性的投资都无法抵抗高通胀。所以，学会放弃吧。”


    在结束这堂课之前，鸥夷子皮提了两个关于通货膨胀的问题：


    +   1. 当前的汽油价格，相比20年前，哪个时间段的油价更便宜？

