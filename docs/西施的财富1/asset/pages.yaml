  md: '# 内容提要


    范蠡，中国文财神的原型，辅助越王勾践灭掉强大的吴国后，功成名就，携美女西施，隐退江湖，泛舟五湖。


    英雄抱得美人归，就一定过的是香车别墅游艇的逍遥日子吗？事实并非如此。范蠡自甘为布衣平民，西施也遭遇到普通人的财务困境：生活花费、房子等金钱问题成为她的现实问题；正如当前所有的白领一样，西施也要承担教育、医疗和未来养老费用的经济压力。如何化解这些财务问题？范蠡以老师的身份，开始为西施讲解财富的规律：财富增长的秘密、财富流逝的途径、如何对人进行估值、如何进行财富管理……


    西施掌握了财富的密钥，如同阿里巴巴来到财富宝藏的门 口：芝麻开门……


    本系列书以历史上范蠡和西施的典故和有关传说为经，以现实生活中的理财和投资等专业知识为纬，分别讲述理财和投资的技巧和方法，在理财和投资的专业方面力求系统、深刻和通俗；在历史小说方面力求好看、风趣、可读性强，既是一本好看的投资理财专著，又是一本极有含量的小说。让读者在阅尽西施的爱恨情仇之余，也能学习陶朱公的投资技能！'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# 自序


    一个卧薪尝胆的典故，历史学家看到的是一个帝王为达目标不屈不挠终成春秋霸主的奋斗史，心理学家看到的是一个有压迫症和焦虑症的精神分裂症患者，保险业、传销业等行业的销售人员看到的是顽强奋斗的成功人士，中学老师看到的是一
    个绝佳的励志榜样，文艺女青年看到的是让人神往的浪漫爱情，中青年精英看到的是“庄周万物外，范蠡五湖间”的逍遥和自由，商人们看到的是祖师爷的致富秘籍，家庭主妇们看到的是一出情节跌宕起伏的好看的肥皂剧：有血腥有
    情色、有权力争斗有卧底反间，而我看到的则是一个可以传播投资理财理念 的绝佳故事。


    两千多年前中国春秋时期的吴越争霸时代，是一个英雄辈 出的时代，英雄们如群星闪耀，熠熠放光，时至今日，我们仍 能感受到其灿烂光辉：勾践之隐忍、夫差之痴情、伍子胥之忠
    烈，他们人生之精彩，让现代人唯有扼腕赞叹。英雄们或为理 想、或为权力，演绎出一场场情节曲折、高潮迭起的对抗和 较量，其精彩纷呈程度，堪比当今任何曲折离奇的电视肥皂
    剧。其中，勾践处弱而不放弃，最终以弱胜强，打败强大的夫 差，终成春秋五霸之一。勾践的成功传奇，也成为后世人身处 逆境时自勉励志的最佳典范。'
