- pgno: 138
  md: '# 四、终值和现值


    这种按照货币的时间价值原理，将每个计息周期的利息收入计入本金计算利息的方式，称之为复利。


    鸥夷子皮说：“贴现值又称为现值，与此相对应的未来某个时间点的等值金钱则被称为终值。”


    鸥夷子皮开始讲解现值和终值的计算公式：


    假设将当前的100元储蓄在银行，按照5%的利率，一年后的价值为105元，105元就是100元在5%的贴现率水平下一年期的终值（简称$FV$），反之，100元是105元在5%的贴现率水平下一年期的现值（简称$PV$）。如果用$k$表示贴现率，可以将一年期的现值和终值表示如下。


    ```

    $FV=PV \times(1+k)$

    ```


    ```

    $PV=FV \div(1+k)$

    ```


    以上举例是以一年和一个计息周期来计算现值和终值，理财和投资当然不仅限于一年或者一个计息周期，假定在银行有一笔100元的5年期存款，年利率为5%，5年到期，到期时银行进行结息，银行是这样计算利息'
  merge: -1
  img_proc: true
- pgno: 139
  md: '的， 100 × 5% × 5 = 25（元），银行最后所付利息是25元，银行这种将所有计息周期的利息计算按照统一的初始本金乘以利率和计息周期的计息方式称为单利。


    根据货币的时间价值原理，100元在5%的贴现率水平下的一年期终值为105元，而第一年末的终值将成为第二年初的现值，第二年末的终值将成为第三年末的现值，以此类推，每年末的终值既是年初现值在5%的贴现率
    的水平下的终值，同时又是下年初的现值，据此，可以将100元在5%的贴现率下5年期的终值FV计算如下。


    第一年 100 × 1.05 = 105（元）


    第二年 105 × 1.05 = 110.25（元）


    第三年 110.25 × 1.05 = 115.76（元）


    第四年 115.76 × 1.05 = 121.55（元）


    第五年 121.55 × 1.05 = 127.63（元）


    这种按照货币的时间价值原理，将每个计息周期的利息收入计入本金计算利息的方式，称之为复利。相比单利，复利的特点是，将每年的利息收入计入下年度的本金，以此来计算最终的利息收入。100元的5年期存款，
    5%的利率，按单利计算是125元，按复利计算是127.63元，多出的2.63元是对每年的利息收入再逐年计算利息的增加额。


    通过复利计算现值和终值，必须涉及计息期，计息期的单位可以为一 年，也可以为一月、一周，甚至一天，一般银行利率和贴现率以年为单位，所以计息期通常以年为单位。如果计息期数为t，贴现率为k，那么计息周期为多期的终值和现值可以用公式表示。


    FV = PV × (1+k)^t


    PV = FV ÷ (1+k)^t


    鸱夷子皮说：“这两个公式，是财富管理领域里最常用的公式，通过 现值和终值的转化计算，就可以对当前和未来的现金流进行统一比较，有 利于作出投资决策，你们一定要熟练掌握。复利终值计算公式中的(1+k)^t'
  merge: -1
  img_proc: true
