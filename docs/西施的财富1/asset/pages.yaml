    正如白天不懂夜的黑、母猪不懂孔雀开屏的美、为活着而背弃一切原则之人不懂为信念而甘愿赴死之人一样，为权力而奉献美人的勾践，永远无法理解竟然有人为美人而放弃权力，他只能一边嘟囔着：生命、自由、爱情、金钱、权力、地位，孰重孰轻？如何选择？选择的结果孰是孰非？这道人生的亘古难题，无人知道标准答案。林子大了什么鸟都有，这个多元的世界里，总有人做出如此的愚蠢行为，上帝都不会原谅这些傻瓜的。啊门！然后，很不情愿地在范蠡的辞职信上签字同意。


