    鹅夷子皮道：“高利贷盛行，是金融业不发达的体现。大众在银行融资渠道不畅，迫于生产生活上的资金需求，只好求助于当铺、担保公司、高利贷公司或放贷人，以高昂利息取得短期融资，以解燃眉之急。在正常经济环境下，高利贷不会成为借贷主流方式，只会是走投无路时的一种备用选择。但在通货膨胀高企的经济环境下，物价上涨幅度大，商人们囤积物资或者炒作商品，通过投机可以赚取暴利，资金越大，获利也越多，因而对资金需求也越旺盛；同时，通胀造成物价在各行业间上涨不平衡，物价上涨传导渠道不畅，容易造成生产和流通企业资金链断裂，为了应对经营困境，经营困难的企业对资金有需求饥渴；如果这些投机商和经营困难者无法从银行取得正常贷款，急需资金时只能向民间借贷；通货膨胀会使实际利率为负，资金富余者担心其财富被通胀稀释，高利贷的利息收入更具吸引力，从而也会产生贷款的资金供给。所以，在通货膨胀严重时，民间借贷的资金供需都会旺盛，民间高利贷生意会红火一段时期。”


    鹅夷子皮总结了高通胀经济环境下，民间高利贷的三个特点：


    +   1. 普遍参与性。不管是在经济发达地区，还是在经济落后地区，不管是达官贵人还是普通民众，不管是生产制造企业、商贸流通公司还是一般家庭，各地区、各行业、各色人等，都具有普遍参与高利贷的特点。


    +   2. 高利率性。实际贷款利率普遍高于银行贷款利率数倍、数十倍，甚至达数百倍。月息高达四分、五分，甚至高达八分、十分。


    +   3. 形成产业链。有的高利贷公司或高利贷者，以较高利率从普通民众手中大量融资，再以更高利率贷给其他高利贷公司或个人，经过多次中介传导，资金到达最终实际需求者手中时，利率会很高，中间不同等级的高利贷参与者形成了贷款产业链。'
