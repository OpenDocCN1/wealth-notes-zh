  md: '富翁的可能性在以几何级数增加。也就是说，年轻的亿万富翁确实要靠上帝的垂青，是一个低概率事件。而要成为一个年老的亿万富翁，拥有亿万资产，却只需依靠长久地坚持某些规则、某些财富增长的规律而已。事实上，在米国，大多数的千万富翁、亿万富翁，都是年过花甲的老人，这也证明了财富增长确实存在着某些规律，财富领域的成功人士，只不过是坚定地恪守这些财富的规律，财富就是其恪守规律的回报。"


    西施问：“财富的增长确实有规可循吗？"


    鸱夷子皮笑道：“我们小时候听故事，在那些传奇或演义中，总有一些老套的桥段，一些英雄豪杰在面临重大难题、走投无路之际，都会忽然想起牛人先知给他的锦囊，里面藏有解决难题的锦囊妙计，打开一看，一切难题都迎刃而解。如果，将财富的增长比作一个可以产生无尽财富的神奇锦囊，那么，财富增长的秘密，就如同锦囊中的神秘妙计一样。今天，我就用三个命题，引出财富锦囊的秘密。”


    鸱夷子皮的第一道命题是这样的。


    **命题一：** 一个25岁的年轻人，当前的资本为10万元，他如果要在60岁时拥有亿万资产，那么，他的年均投资收益率应该为多少？


    西施举手，抢先答道：“根据我们上节课所学的理财基本知识，这个命题实际上可以转化为这种意思。


    10万元的资金，经过35年的增长，要达到1亿元，年投资收益率应为多少？


    将年投资收益率设为k，可以列出下面的数学算式。


    ```

    10(1+k)35=10000

    ```


    “通过计算，可以求得k=21.8%，也就是说，如果能通过投资、实现年均21.8%的收益率的话，并且保证连续35年都能实现，那么，25岁时的10万元，经过35年的增值，在60岁时就会达到1亿元。”


    鸱夷子皮笑着说：“21.8%的收益率！很高吗？对于相当一部分的股民来说，这个收益率并不是一个难以达到的年收益率。为什么那么多人


