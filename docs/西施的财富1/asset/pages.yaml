    鸥夷子皮道：“巴菲特的计算，可以直观地看出税收交纳时间的不同，而对财富积累的巨大影响。同样的所得税率，同样的收益率，只是交税时间不同，一种是按年交税，另一种是递延交税——-直持有投资，到最后再一次性交税，仅仅是交税时间不同，却导致税收缴纳的数额和财富积累的数额都会产生惊人的差别——相差二三十倍！所以，巴菲特在数十年的投资生涯中，严格按照这种税收理论操作，从不分红，递延交税，从而使得公司股票价高达10多万米元，财富在数十年间获得惊人的增长，而当他分红时，向政府缴纳的税收也会比每年分红缴税的数额要高出数十倍。”


