  md: '郑旦疑惑地问：“现代生活中，人们也经常进行外汇交易、黄金买卖、期货交易和艺术品收藏，人们更愿意将这些玩意当成投资品种，对于股票、债券、基金和房地产反而敬而远之，老师为什么不讲这些品种呢？”


    鸥夷子皮：“货币储蓄在银行，可以带来利息收益，如果进行货币或外汇的交易，是为了赚钱息差，这种外汇交易就是投资，但对绝大部分来说，更看重瞬息万变的外汇汇率所带着的价差，这种外汇交易，完全追求的是交易机会，就不是投资品种，而是交易品种；至于黄金、期货或收藏品等，本身不带来收益，只能被买卖之时，才会因为价差产生增值，它们都是交易品种。”


    鸥夷子皮于是又分析起了几种交易品种：


    +   1. 货币或外汇。货币本身是最直接的金融资产，其收益性来自银行储蓄利息。另外，不同货币之间的外汇汇率会产生良好的交易机会，汇率变幻的频繁性使得外汇交易成为现代金融社会常见的交易方式。外汇保证金交易，既放大了货币交易的收益，也放大了交易的风险。


    +   2. 期货和其他保证金交易的品种。为了对冲未来某种商品或金融产品价格波动所带来的风险，有聪明人创造性发明了期货和其他保证金交易的品种，通过一种标准化设计的、采用保证金交易的合约来对冲未来价格变动的风险。这种期货合约或保证金交易合约，本身不会产生收益，本来是为了锁定现货市场的价格变动风险，但在金融市场上，众多的交易者更愿意承担风险去追求高收益，因此，期货是一种常见的交易品种，其收益来自合约价格的变动方向和交易者的交易方向是否符合。


    +   3. 黄金和其他贵金属。黄金或贵金属本身不能产生收益，不是投资品种，只是一种交易品种，其获利来自价格上涨。


    +   4. 收藏品艺术品。收藏品艺术品本身不具有收益性，其收益来自交易买卖的价差。


