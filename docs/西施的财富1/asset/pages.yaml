  md: '# 三、贴现率


    利率的调整，可谓牵一发而动全身，一定要合理地调控。


    鸭夷子皮继续启发大家：“今天的100元，相比一年后的108元，哪笔钱的价值更大呢?”


    骑顿：“这个不好比较吧？要看银行的储蓄利率是多少吧？”


    白圭问：“应该怎么比较不同数额的钱在不同时间点的价值呢？”


    鸭夷子皮说：“如果将100元储蓄在银行，银行年利率为5%的话，一年后本金收益和是105元；如果投资股票，年收益率为10%的话，一年后他的本金收益和是110元。根据收益率的不同，今天的100元在未来的价值也各有不同。”


    他说：“为了比较不同数额的金钱在不同时间点的价值，可以设定一个认可的收益率，根据货币的时间价值原理，将未来某个时间点的金钱，统一调整为当前的等值金钱，再进行比较，这个过程称为贴现，设定的收益率称为贴现率，而把在这个贴现率水平下、等值于未来某时间点金钱的当前数值称为贴现值。例如，未来一年的110元，在10%的贴现率下的贴现值是100'
  merge: -1
  img_proc: true
- pgno: 137
  md: '元；未来一年的105元，在5%的贴现率下的贴现值同样也是100元。\" 西施问：\"贴现率根据什么设定呢？\"


    鸥夷子皮：\"当金钱储蓄在银行时，银行会根据储蓄时间的长短给予不同的利率，如活期存款利率、一年期定期存款利率、五年定期存款利率等，一般期限越长，利率就越高；如果向银行贷款，银行就要收取贷款利率，贷款利率同样根据借贷时间的长短而不同，一般时间越短，年化贷款利率就越髙。储蓄作为最稳健保守的投资方式，其收益是无风险收益，因此，在理财和投资领域，通常以一年期定期存款利率作为贴现率。当然，在严格控制风险的前提下，投资股票、债券等可以提高收益率，有时也用这种较高的投资收益率作为贴现率来进行投资决策。\"


    鸥夷子皮继续讲道：\"利率，作为经济体系的核心指标，是宏观经济的温度计；利率，作为投资领域的贴现率，又直接影响着资产的价格，利率偏高或偏低，直接导致设定的贴现率偏高或偏低。利率设定偏低的话，资产的价格会暴涨，会出现资产泡沫；利率设定偏高的话，经济会紧缩，资产的价格会大跌，资产泡沫会被捅破。所以，利率的调整，可谓牵一发而动全身，一定要合理地调控。\"


