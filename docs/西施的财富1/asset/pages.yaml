- pgno: 64
  md: '个例子可以证明其是如此残酷压抑自我欲望的。曾先生年轻时，某晚看到同事有青春靓丽的小姐作陪，在高级俱乐部饮酒唱K，放纵享乐，作为血气方刚的正常男人，曾先生动了一丝常人欲望，但这一丝念头却让曾先生好似犯下严重罪行，让他罪恶感沉重，他狠斗色字一闪念，心灵深处闹革命，在日记里万分悔恨，千分内疚，百般自责，只恨不得挥刀自宫，以绝后患。”


    西施说：“抑制欲望，难道就没有欲望了吗？真是自欺欺人。”


    范蠡点头称是：“‘不想，不要’，不是没有欲望，而是有‘不’的欲望。清心才能寡欲，无欲则刚，才会无求，其实是另一种欲望。欲望满足是需求的实现，可以让人快乐。经济学上将欲望的满足程度称为效用，人越快乐，效用越高，随着低级需求被逐渐满足，人的快乐感会递减，效用也逐渐降低，当欲望被完全满足，人也不再快乐感，边际效用降为零，这就是所谓的边际效用递减原理。边际效用会递减的根本原因是人的欲望无穷无尽，当人有了更高级的欲望，却无法被满足之时，人就会焦虑忧愁，就会痛苦。”'
