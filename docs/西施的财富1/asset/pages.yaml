  md: '等。比赛开始了，齐王派出上等马出赛，田忌也派出上等马迎接挑战；同理，田忌的中等马对齐王的中等马，田忌的下等马对齐王的下等马，结果，齐王每个等级的马，都比田忌的马厉害，三场比赛下来，田忌三战皆负。田忌正在懊恼之际，他的高参孙膑来到了赛马场。孙膑告诉田忌，不用换马，按照他的方法，再赛一场，一定会取胜。


