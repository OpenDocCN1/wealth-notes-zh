  md: '和企业所得税等直接税，更包括增值税、消费税、营业税、关税等间接税，间接税名义上是企业缴纳，但其实却隐藏在商品或劳务价格中，所有商品的标价其实都是包含间接税的税内价格，所以，间接税是税负转嫁，实际上最后由消费者买单，大众每购买任何一件商品，都要交税。例如，花费100元购买一瓶化妆品，其中，除了14.53元的增值税外，还包含25.64元的消费税，还有4.02元的城建税，总共需要缴纳44.19元的间接税。”


    西施瞪大眼睛问：“我用一瓶化妆品，原来要缴纳这么高比例的税收？”


    鸭夷子皮：“在生活中，税收无处不在。早上起床的第一件事，是打开水龙头，洗脸之时，增值税的纳税行为就已经发生。用水洗脸，是自来水公司在销售水，水价里包含增值税，自来水公司需要向税务局交纳所得税和增值税，增值税表面虽然由自来水公司交纳，其实却由每一个消费者共同负担；乘地铁上班，地铁票价里包含着地铁公司要交纳的营业税和增值税，这也是地铁公司向乘车人收取后再交纳给税务局的间接税；同理，进商场购物，或者点煤气，烧水做饭，都要交税。也就是说所有的消费，只要是付费接受商品或劳务，就一定产生税收。”


    西施：“看来，税收确实弥漫到生活的每个角落了。”


