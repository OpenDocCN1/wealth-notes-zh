    他将人生的收入和支出来源做以下归纳：


    # **收入主要来自以下几方面：**


    +   1. 工作的工薪收入。

    2. 工作外的劳务所得。

    3. 投资经营企业所得。

    4. 房地产、股票等投资所得。

    5. 父母亲戚的遗产或者馈赠。


    # **支出主要分为以下几方面：**


    +   1. 维持家庭基本生存所需的花费，如日常的衣食住行费用。

    2. 维持生活舒适的支出，如买车、装修费用、娱乐休闲旅游费用。

    3. 奢侈生活支出，如购买奢侈品牌、艺术品等。

    4. 购买房屋的大额支出。

    5. 子女教育支出。

    6. 大额医疗支出。

    7. 养老支出。


    他说：“在人生财富生命周期的不同阶段，收入与支出的变化也呈现一定的周期性规律。”


