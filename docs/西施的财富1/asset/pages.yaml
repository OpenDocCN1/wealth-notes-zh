  md: '西施看下笑着说：“招生还要考试呀？看来，我不一定有资格成为鸭夷子皮大师的弟子呢！”


    鸭夷子皮说：“任何人经过一定的培训训练，都可以掌握一定的投资技巧，从而获得财富。但要成为一名卓越的投资大师，除了学习投资技能之外，更重要的是，还必须具备某些天赋的禀质，有一些天赋的性格特质，比如，独立思考的能力——在思想和行动上不轻易盲从他人，铁的纪律——严格按照自己的判断去行动，强大的逻辑思维能力——善于对他人的心理和行为进行推断分析判断等。这些性格禀质，看似要求不高，却是影响投资胜败的至关重要因素。投资是一门知易行难的技能，有些道理，说起来很简单，但绝大部分人无法知行合一，能按自己的思想去指导自己的行为。只有那些具备某些性格特质的人，其天性符合理财投资所要求的行为模式，更容易获得投资上的成功。”


    鸭夷子皮继续说：“对于那些不具备投资天赋的普通大众，如果通过投资培训，强化、塑造、定型一些性格特质，就能大大提高投资成功的概率。我这次招生，笔试的题目是考查学生是否具有强大的逻辑分析和心理分析能力，能否通过分析他人的心理和行为，进行逻辑推理和形势判断。面试的题目，主要是测试有关风险控制方面的性格特质的。”


    西施好奇地问：“什么题目？我能通过吗？”


    鸭夷子皮笑道：“那我先考你了。如果能在一个小时之内答对这两个问题，就是绝顶聪明之人，基本可以应聘任何国际顶尖公司的高薪职位，微软、谷歌、INTEL和高盛之类的公司再牛，也无法阻挡这类高智商火星星人的进入。”


    西施好奇了：“虫虫哥，快点出题吧！”


    鸭夷子皮正要说话，门口传来喧哗声，原来是范道生带着郑旦进来了。西施于是将鸭夷子皮要对她们进行投资理财培训的事情告诉郑旦，郑旦也很高兴，她在路上已经听说生说了招生的事儿。


    鸭夷子皮出题给她们。'
