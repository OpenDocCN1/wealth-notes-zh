    假定某人A，25岁开始投资，每月定期投资1000元，一直定投到35岁，之后不再投入资金，而是让这笔投入的本利一直复利增长，假定年收益率一直维持在10%，按照大众普遍采用的静态方式计算的话，A前后只投入了12万元，但是，经过35年的复利增长后，当他满60岁时，最初投入的12万元的本利将是：207万元，增长17倍！


    假定A的同龄朋友B，比A晚10年投资，35岁后才开始定投，每月同样定期投入1000元，年收益率同样为10%，如此定投10年，之后不再投入资金，而是让最初投入的12万元本利复利增长，经过25年的增长后，当B年满60岁退休时，本利和是：79.9万元。


    翁顿说：“A和B，投入的资金相同，投资收益率相同，仅仅是投资时间不同，投资时间多了10年，但收益却相差这么悬殊！”


