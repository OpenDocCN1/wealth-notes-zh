    文神问:“那你觉得到底怎么样才会幸福?”


    范蠡回答道:“我认为满足这三个条件——满足、希望和奋斗,幸福就会来敲你的车门。欲望如海妖塞壬的天籁歌声,让人心醉神迷,醉生梦死,迷失方向,而满足却能让人心境安宁,内心平静;希望让人精神焕发;奋斗能给人带来成功的愉悦。一个人如果满足现状,并且对未来怀有美好的希望,也在为实现希望而努力奋斗,幸福一定长伴他的左右。人在实现希望的奋斗过程中,会产生一种叫做‘高峰体验’的情感,这种情感让人具有一种欣喜若狂、如醉如痴同时和谐舒畅的感觉,这种情感就是幸福。"


    范蠡接着说:“一个人的幸福,会受到所处时代和环境的重要影响。生活在一个人人平等的环境或和平的年代,比生活在一个等级森严的环境或战火纷飞的年代不知道要幸福多少倍。但幸福更主要取决于个人的心境,同样的世界,可以是地狱,也可以是天堂,完全在于一个人怎么用不同的头脑去看待和作为。心中有景,处处花开;心中有爱,处处温情。如果心里总是悲观,那么眼中看到的就是那么多的灾害、丑恶、不公平和黑暗的事情发生在每一天,这些阴暗消极的东西会占据心灵,让人们连多活一天的勇气都要丧失掉。"


    范蠡停顿了一下,然后说:“人生确实很难,但是,如果心态积极的话,面对困境不放弃,通过学习改变思想,投资自己,等待机会,命运就会改变。机会要等待,但是在大机会出现前,要能认识到,要有能力抓住机会,才能把握机会。而在抓住机会前,可能碰到的都是大小不等的困难,如果没有积极的心态,怎么可能克服困难?更谈不上幸福。所以,幸福生活的核心,就是要保持良好的心态:积极、知足、乐观、友善、宽容。而一门发挥人类精神潜能、提升个人幸福感的学科——积极心理学,在对个人如何发展积极心态方面,进行了系统研究,卓有建树。"


    范蠡开始阐述积极心理学的研究成果:


