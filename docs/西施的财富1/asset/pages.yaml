  md: '除睡意。自从尝过大便以后，勾践一直口臭，每餐必吃苦胆，他的办公桌前悬挂苦胆，当身体疲惫厌倦工作想放弃之时，抬头见苦胆，就勾起吃大便的屈辱，马上就会精神抖擞，活力充沛。冬天办公时，勾践怀揣的不是暖炉而是冰块，脚冷就用冰水泡脚；夏天反而生起火炉。在常人看来都是凡夫肉胎无法忍受的精神病式的自虐行为，被勾践以钢铁般的意志用来自我激励，而且一做就是20年。


    20年的漫漫日子里，勾践同时又是一个圣人。他解散后宫庞大的老婆队伍，遣散众多嫔妃及其后勤保障人员，对美女避而远之，只留下王后一人；他解散宫廷管弦乐团，解散宫廷歌舞团，不再听悦耳的音乐，不再看曼丽的歌舞；他过起俭朴生活，亲自耕种，不肯多吃一口饭，不肯多吃一口肉，王后亲自织布做衣；从无一日去旅游休闲放松；他清心寡欲，过最简单的生活，而将节省的时间放在工作上，日勤于政，念念不忘复仇。


    勾践在自我消费上省吃俭用，但在招募人才、发展经济、壮大国力等国事上却出手阔绰。他以提供豪华住宅和上等衣食等高福利高待遇的方式全球招聘顶尖人才，委以重任。在国家管理方面，他采纳所聘专家建议，制定“十年生聚，十年教训”的二十年规划，利用20年时间发展经济，壮大GDP，提高国家综合国力；他规定十年不收税，让老百姓安心发展耕种、养蚕、织布等第一、第二产业，让民众尽快富裕起来，富民然后强国；为了繁衍人口，“多生全家光荣，少生全家可耻”成为越国基本国策，妇女们生一个两个简直都不好意思对人说自己生了孩子，生三个四个尚嫌少，生五个六个算正常，生七个八个就是英雄母亲，要发匾嘉奖。为了奖励生育，勾践规定：老男人严禁包二奶；妇女生育由公立医院接生，费用全免并奖励，生男奖酒一壶、狗一条；生女奖酒一壶、猪一头；一胎生两个，由政府供给衣食和奶粉；一胎生3个，保姆费也由政府出。在军事上，通过重赏严刑，教育士兵勇于听命、乐于立功、进取奖赏、退则刑罚，使士气旺盛。


