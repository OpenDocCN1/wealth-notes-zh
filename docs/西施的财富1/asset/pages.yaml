  md: '同学们都笑了起来。


    鸥夷子皮也微笑起来，他说：“我在后面会计算给你们看。按照7.6%的通胀率，30年后的货币贬值系数为0.093，这和我们以前根据物价水平估算的购买力水平缩水为32年前的1/10大致相当，所以，这个数据，并没有夸大，应该是靠近现实生活中的真实通货膨胀率水平的。”


    道生一副大梦刚觉醒的样子：“通货膨胀率到底是如何让财富消逝的呢？”


    鸥夷子皮继续介绍通货膨胀率：“假定，你准备在一年内买一套沙发，而当前沙发的价格是1万元，银行一年期存款利率为5%；如果你的购买决策是，当前不购买，将1万元储蓄在银行，一年以后再购买。你的如意算盘是，推迟一年享受新沙发，可以多得到500元的利息补偿。然而，不幸的是，这一年的通货膨胀率是5%，沙发涨价了，一年后的价格为10500元，也就是说，你得到的利息，被通货膨胀完全抵消。如果通货膨胀率为7.6%的话，沙发的价格将是10760元，利息已完全不够价格上涨，你还得多掏260元，才能将沙发搬回家。在这种存在通货膨胀的情况下，推迟消费的后果，就是看似得到利息收入，但物价的上涨却大过利息的收入，结果还要多花金钱，从而让财富的购买力价值逐渐下降，这就是通货膨胀让财富逐渐消逝的原理。”


    道生问：“为什么会这样呢？”


    鸥夷子皮：“我们之前一直在用银行利率作为贴现率来进行现值和终值计算，这个没有考虑通货膨胀影响的银行利率，就是名义利率，实际上，必须要考虑到通货膨胀率因素，将之剔除掉，才能得到真实的贴现率。剔除了通货膨胀率之后的贴现率才是实际利率，实际利率并不能通过银行公布而来，而是要通过对名义利率和通货膨胀率的计算，才能得出实际利率。”


    鸥夷子皮讲了实际利率的计算公式。


