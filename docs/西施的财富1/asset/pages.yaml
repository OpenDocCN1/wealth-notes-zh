- pgno: 65
  md: '# 五、论成功


    > 时不至，不可以强生；事不究，不可强成。


    明月凌空，数点疏星。晚风悠悠，拂面而来，带着幽幽的桂花香味，阵阵袭人，使人陶然欲醉。


    范蠢抬头，仰望了一下朗月星空，继续说道：“说到欲望，欲望给人带来痛苦，让人不幸，国人尤为能感受其中滋味。欲望无法实现会痛苦；欲望实现了，却发现不符合心理期望，也痛苦；放弃了本可以实现的欲望，却发现做了错误选择，更痛苦。其实，国人感觉不幸的原因在于内在个人欲望的无休止膨胀和外在经济、舆论环境压力的双重作用。而这两者的根源，却在于中国传承几千年的思想文化的教育，可以说，国人所受传统儒家思想的教育，正是造成痛苦和不幸的根本原因。”


    西施有点吃惊地问：“大叔，您的意思是知识使人痛苦，教育使人不幸？”


    范蠢答道：“国人自从幼年启蒙教育的开始，接受的都是千年传承的孔孟儒家思想教育，琅琅读书声中，三字经、弟子规被尚且懵懂的孩童反'
  merge: -1
  img_proc: true
- pgno: 66
  md: '+   西施的财富


    +   芝麻开门


    复诵读，在儿童的思想还是一张白纸之时，就在其潜意识中深深种植了‘仁义礼智信’思想的幼苗，在以后的正规教育中，儒家思想更是全面在头脑中茁壮成长，成为国人价值观的普遍指导思想。儒家思想体系为国人树立道德规范的标准——仁义礼智信；为国人树成功的标志——格物、致知、诚意、正心、修身、齐家、治国、平天下，以及对待成功的态度——穷则独善其身，达则兼济天下。儒家思想教育制度的本质，是构建了一个无穷等级并且等级秩序森严的奋斗目标，让人们去爬升，去竞争，去超越他人，去成功。”


    文种问：“为成功而奋斗，的确是我们自幼启蒙教育时期就牢记心间的基本信念，难道不对吗？”


    范蠡轻轻叹了口气：“国人强调教育要从娃娃抓起，不能输在起跑线上，自幼就被树立了为成功而奋斗的信念，人人以这种观念为天经地义的真理，殊不知，不幸和痛苦的种子就此被种植在孩子的心中，成为一生不幸的总根源。”


    西施：“为什么这么说呢？”


    范蠡：“因为国人心目中‘修身齐家治国平天下’的成功理想，必须通过残酷竞争才有可能实现。在狭隘逼仄通往成功的羊肠小道上，只有发足狂奔，超越无数人，甩脱无数对手，跨越无数等级的台阶，才有机会成为成功者，幼为田舍郎，老登天子堂。为了实现这种身份的巨大跨越，吃得苦中苦、方为人上人，是国人熟知的励志口头禅和自勉的思想武器。为了追求成功，首先要和同等级平台上的竞争者PK，几番奋战，对手倒下，艰难胜出，然后踩着失败者的身躯，留下血淋淋的脚印，摇摇晃晃上到更高一个等级的平台上，喘息未定，这个平台上的无数竞争者蜂拥而来，只能继续PK，再决胜负，如此反复。人生就成为一场场PK，PK胜出才能生存，PK的压力和残酷让人痛苦，PK失败更让人痛苦，而大部分人必然要成为失败者。少数成功者的成功大道，看似由鲜花铺就，但其身后，却是无数失败者倒下的身躯。成功者迈进上流社会的殿堂，也不可能一劳永'
  merge: -1
  img_proc: true
- pgno: 67
  md: '逸，黑夜的暗影中仍然潜伏着无数的对手准备挑战他，而那些PK失败的竞争者也不会甘心，随时可能会苏醒过来，冷不防会把在人生舞台上吹歌劲舞的成功者拉下马来。国人的心理是不患寡而患不均，只要有人强过自己，就会有竞争者出现。所以，成功者的心里，永远没有放松的时候，随时要拔剑四顾心茫然，准备应对不知从何方向而来的明枪暗箭。”


    范滃接着说：“只要处于竞争状态，无论成功者，还是失败者，心里都会极度紧张，充斥痛苦和不幸的感觉。竞争只会对个别的疯子、神人和斗争天才才带来乐趣，让他们觉得其乐无穷。与天斗，与人斗，对大部分常人来说，只会感受到不幸。儒家的教育制度看似指导国人去为成功而竞争，其实是架设了无数让绝大部分人永远无法逾越的、等级森严的权力天梯。这个天梯的尽头，是儒家制度为渴望成功者绘制的美好而虚幻的幻象，天梯之路由充斥着不幸和痛苦的陷阱铺就，里面躺满了无数追求成功者的血淋淋的尸体。”


    他继续讲道：“儒家思想体系里面的道德观，是另外一个让国人痛苦和不幸的重要根源。‘仁义礼智信’，看似树立了一个道德高尚的风范标准，但是几千年的中国史实中，能达到‘仁爱、忠义、礼和、睿智、诚信’境界的只有寥寥可数几个圣人，对大部分国人来讲，这个道德标准更像是口号，而不是一个可以普遍遵守的道德行为准则。有部分人正心修身，努力让自己的道德高尚起来，却发现圣人的境界可望而不可即。而越靠近这个道德标准，越要在社会人际关系中承担更多的责任，责任越强，越让人背负更多的压力，从而越痛苦。反观那些被主流社会鄙视的俗人庸人，不受道德约束，放纵欲望，及时享乐，反而比自命道德高尚之人要快乐。这种反差给了那些意欲遵守社会道德但意志不坚定者以刺激，使得越来越多的人逃离儒家思想的束缚，不做道德高尚之人，而愿成为享乐之俗人。所以，几千年儒家思想的道德宣教，并没有让我国成为了一个游弋着众多道德高尚圣人的理想国，礼崩乐坏反而成为常态，人以享乐为人生理想，最普世的道德，不是对他人的仁义礼智信，而是对子孙的仁爱


    财富教育直选用书'
  merge: -1
  img_proc: true
- pgno: 68
  md: '和关爱。无钱无权的农民的道德是为儿子盖房子娶媳妇，有产者的道德是将尽可能多的财产留给子孙，有权者的道德是将权力一代代顺利传承。"


    文种听着范蠡侃侃而谈，也若有所思，说道：“我们自幼就立下大志，要发奋读书，求取功名，但求闻达天下，功成名就，既能光宗耀祖，又能庇荫子孙。人生奋斗的过程的确充满了压力和残酷，击败竞争对手的成功也只能带来短期的快乐，很难有长期稳定的幸福愉悦，我一直在困惑，为什么地位权力的提升，并没有减轻我的精神压力，反而让我的精神负担更沉重？现在听君一席话，原来根源出在儒家思想的教育上，教育让人竞争，成为让我们不幸的源头。"


    范蠡望着已完全被黑夜笼罩的远山的暗影，说道：“是啊！国人梦想成功，最直接的理由是，成功可以给家人创造更好的经济环境，从而让家人过上更幸福的生活。可是，真的是成功了才能让家人幸福吗？一个所谓事业有成的企业家就一定比普通白领更幸福吗？我们设想一下：企业家有豪宅，有跑车，有社会地位，有足够的财力让妻妻娇儿过舒适幸福的富裕生活，为了维持这种生活状况，企业家可能要在早上孩子尚未睡醒之际，就要离家处理日常事务；晚上更是应酬不断，要陪政府官员打麻将，要陪客户吃饭，要陪大小领导在夜总会唱歌喝酒，到家时已是深夜，孩子也早已熟睡。日复一日，他的肝也喝坏了，血压也升高了，他绝大部分时间和精力都用在疲于奔命和应酬各种俗务上。或许他忙碌了一年的结果是——当年的利润尚能维持，富裕的生活仍能维持。但来年的生意会如何？来年的生活还能富裕吗？谁也不知道。只能来年再继续辛苦应酬、辛苦忙碌了。"


    西施说：“当今哪个人不是为了给家人一个富裕而幸福的生活而忙碌、而辛苦？”


    范蠡说：“只要踏上奔向成功的天梯，企业家就像一辆失控的高速列车，不到电力衰竭，就再也停不下来。他为了维持资产和生意，必须保持忙碌的惯性，从获得财富的角度来看，他无疑比所有辛苦打工谋生的白领'
