    鸥夷子皮讲起了通货膨胀。


    通货膨胀表现为在生活中商品和服务价格总体持续性上涨的现象，实质上是在纸币流通条件下，货币供应量大于货币实际需求量的一种货币现象，其本质则是货币所代表的购买力水平的下降，是货币在国内贬值的一种体现。


    货币作为财富的符号，交换的媒介，是购买力价值的代表，和一定的实物相对应。货币凭借着购买力价值，和相应的实物等价值交换，实现货'
