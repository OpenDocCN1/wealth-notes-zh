  md: '丽但不一定实用，而阴谋却像沉在海里的潜艇，随时会发射鱼雷，置人于死地。越国之所以最终打败吴国，阳谋固然重要，但勾践所采取的种种阴谋诡计才是杀伤力最厉害的。这些阴谋的具体措施，由一名叫文种的外聘顾问所提出，被称为“伐吴九计”，勾践采用其中的五条，便使吴国由强转弱，最终被越国所灭，这五条措施包括：


    +   1. 重财币以遗其君，多货贿以喜其臣。勾践经常送金银财宝给夫差，让夫差宠信他的忠诚，而不防备；同时，又将大量奇珍异宝、古董字画送给夫差宠信的伯嚭，伯嚭从而泄露大量的吴国机密。


    +   2. 贵籴粟粟以虚其国。勾践以越国遭受饥荒、人民需要救济为由，向夫差大量借取粮食，次年精选上等稻谷，经煮熟处理后偿还吴国，吴国见越国的稻谷颗粒饱满品种优良，就用作种子，结果来年颗粒无收，在吴国士兵饥肠辘辘之际，勾践大军兵临城下。


    +   3. 遗美女以惑其心、乱其谋。勾践视美女为红颜祸水，自己远避之，却遍访全国，寻得绝色美女西施和郑旦，送给夫差，让夫差沉迷于美色之间，于情欲中流连忘返，从此让夫差由一个眼中只有天下的英雄演变为要爱情不要江山的性情男人。


    +   4. 遗之巧工良材，使起宫室，以尽其财。勾践派人到深山之中，大量砍伐奇珍异树，然后雕上美丽花纹，献给夫差，夫差利用这些珍贵树木，大兴固定资产投资，大搞楼堂馆所建设，结果劳民伤财，民怨沸腾。


