  md: '山，让人压力山大；年轻一代背负新三座大山：养车子而成为车奴，养孩子而成为孩奴，追求高档奢侈物质的消费而成为物奴。这些新旧大山，让当代人疲惫不堪，烦不胜烦。究其原因，除了社会保障制度不足以外，欲望的无穷尽也是一大原因，当代人投资理财技能的严重匮乏，让人对财富的追求永无止境。本书针对中产阶级的种种现实经济问题，从理财和投資的角度，以科学合理的数据分析，给予深入剖析，揭示本质，给出解决之道，具有很强的现实指导意义。因此，本书适合所有中产阶级人士阅读。


    大凡历史上的英雄，有勇者无谋，有谋者无德，智勇双全者无度，有度者无仁，有仁者不能决断，爱决断者不能成事，性情完美的人未必有机遇，有机遇的人又未必有通透达观的人性，只有范蠡好像是上天格外垂青，人世间一切凡人渴望追求的荣耀他都能轻易得到。但笔者相信上苍是公平的，人生并不总是圆满的，所以在本书中，根据历史史实，加上作者的推测，给范蠡安排的结局很悲惨：妻子西施离他而去；一个儿子被处以极刑，一个儿子自杀，一个儿子纨绔无用。按照传统的看法，范蠡的晚年凄凉而不幸，因此，本书不适合老年人阅读。


