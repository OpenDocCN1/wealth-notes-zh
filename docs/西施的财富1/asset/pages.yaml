- pgno: 177
  md: '币作为交换媒介的功能。早期一般由金银等贵金属充当货币功能，贵金属的生产开发一般难度大，增长缓慢，所以货币的增长速度缓慢，其购买力价值相对恒定，在这种情况下通常难以出现通货膨胀。


    随着金本位的崩溃，当货币纸币化后，货币的信用靠国家信用来保证，货币的供应量也由国家根据经济发展情况决定并直接印刷。当货币数量的增长与实物数量的增长情况一致时，就不会出现通货膨胀。而当货币数量的增长速度大于实物数量的增长速度时，就会出现通货膨胀。


    影响货币供应量的因素多种多样，错综复杂。有一个著名的费雪公式，是关于如何计算货币供应量的。


    ```

    $MV=PT$

    ```


    在公式中，$M$是货币总量，$V$是货币流通速度，$P$是社会商品平均价格，$T$是社会总交易商品量。


    根据费雪公式，货币供应量由货币流通速度、社会总商品平均价格和交易的社会商品总量决定，但这三个参数是无法准确测量的宏观参数，所以货币供应量$M$无法准确计算，所谓让货币供应量的供给，和国家经济的增长速度相适应，只能是一种理想而已，在现实经济生活中注定是无法实现的。现实的情况是，大部分国家为了刺激经济增长，大都倾向于采取从松的货币政策，乐意加大货币供应量的供给，从而人为制造出温和的通货膨胀。


    鹅夷子皮为了论证其结论，以齐国的经济数据为例，举例说明。32年前，代表货币总量的M2为859亿元，当时的GNP总量为3645.2亿元；当前的货币总量M2为725851亿元，GNP总量为397983亿元。


    通过计算，可以得出以下结论：


    +   1. 32年间，GNP增长109倍，年均增长率为15.8%；而M2却增长了845倍，年均增长率为23.4%；


    +   2. 32年前，M2/GDP为0.24；当前，M2/GDP为1.82；也就是说，当前推动每单位GNP增长所需的货币量，是32年前的7.6倍！


    ![](img/2c0d8ae8066e23466ace2db16d84ed63_177_0.png)'
