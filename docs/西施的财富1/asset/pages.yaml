  md: '西施开口，打破了沉默：“米国人的401（K）账户，通过设立个人退休账户，来解决养老问题，其实质，就是通过投资，让资本增值，从而化解未来的资金压力，我们是否也可以通过投资来解决现实生活中的诸多问题？”


    鸣夷子皮点头称是，他说：“对于中产阶层而言，养老问题，其实是未来将背负于身的最大大山，只不过，这座大山，当前还隐藏在远处，若隐若现，尚未构成直接负担，中产阶层们还能以鸵鸟心态，视而不见，见而不虑，过一天算一天。但是，子女教育、住房、医疗问题，则是当前就背负于身的三座大山，让人压力山大；再加上新三座大山——养车子而成为车奴、养孩子而成为孩奴、追求高档奢侈物质的消费而成物奴，这些新旧大山，让当代人疲惫不已，烦不胜烦，却也只能无奈适应。无尽的经济压力，让大众以为，足够的财富才能解决这些经济问题，这也成为社会上上下下普遍追求财富、信奉金钱的主要动力。”


    鸣夷子皮话锋一转：“生活中的绝大多数压力，确实是来自经济方面的压力，追逐财富成为大众解决经济问题的唯一办法。但是，人生也有涯，而钱也无涯，以有涯随无涯，殆已，呆已。也就是说，人的生命有限，而财富无限，以有限的人生中去追求无限的财富，必然要失败，其'
