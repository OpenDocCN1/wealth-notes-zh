  md: '这天，郑旦听说鸥夷子皮的理财课程快要讲完了，就执意要请同学们出外吃饭，以示庆贺。


    郑旦请客的这家餐馆，位于全城最高大厦顶层，号称光明顶。大厦楼高100多层，在地面抬头张望光明顶，只见其高耸巍峨，只在云霄之间。众人坐上摩天电梯，电梯呼啸而上，瞬间到了顶层，大家的耳朵都有点鼓胀。


    师生们靠窗而坐。这是一家旋转餐厅，城中美景一览无疑，尽收眼底。众人在光明顶上四处张望，只见远处的梧桐山、莲花山、塘朗山等山，平时只能仰望，此刻也在脚下。西施感慨：“会当光明顶，一览众山小啊！”


    郑旦笑着说：“此光明顶，非彼光明顶，没有武林高手云集，但是，城中的商人富豪、财富新贵，却尤其喜欢在此吃饭，一些平时只能仰望的资本英雄、投资大师，也频频在此出没，所以，此光明顶，是投资高手的光明顶。”正说着，一个著名投资大鳄从他们身旁一闪而过。


    道生望着这个大牌基金经理的身影，用羡慕的语气说：“要成为理财领域的成功者，成为这样的顶级投资高手，真不知是何其之难啊！也不知'
  merge: -1
  img_proc: true
- pgno: 302
  md: '何时我才能达到这种境界呢？“


    鸮夷子皮道：“理财，确实很难，难的是很少有人能长期取得超过市场的收益。专业投资管理人员很多，号称投资高手的人不少，他们采用各种投资技能和投资策略，虽然有人短期收益确实很高，但是，能长期跑赢市场的人却寥寥无几，那些能稳定取得超出市场一点点收益的人，就是投资大师。”


    鸮夷子皮话锋一转：“但是，理财也可以很简单。如果能端正投资思想，摒弃跑赢市场、追求暴利的错误心态，致力于自我财富的稳定增长，那么，通过一定的专业学习，掌握理财投资的正确观念和技能，把握时机，在不同时间、通过不同理财工具、进行不同比例配置，当股市形势大好时，获取较高收益；当股市走势恶劣时，通过保守配置，将收益率要求降低，不亏本甚至亏少钱也能接受，通过好年景和差年景的不同搭配，将年复合收益率维持在5%~30%，通过长期的坚持，在历经10年、20年、30年的时间后，财富增值的复利威力自然就显现出来，财富自然会稳定增长到一个惊人的程度。”


    白圭说：“聪明人恐怕会看不上如此之低的收益率吧？聪明人追求的是大幅跑赢市场的高收益率。”


    鸮夷子皮感慨道：“这世界上有一条大河，叫聪明河，聪明河看似平静，却暗流汹涌。为什么叫聪明河呢？因为河里淹死的人都是聪明人。太多的聪明人，一会儿投机、一会儿弯道超车，投资收益越高越喜欢，看不上稳定收益的投资，总幻想短期暴富，殊不知，最终的结果大都是欲速则不达，最终遭受重大损失的不是愚蠢的人，而是这些聪明人。正如追逐暴利的淘金者大都梦断金矿，真正发财的人，却只有那些为淘金者提供服务的商人。投资更是如此，追逐暴利的往往得不到暴利，收益稳定的才是笑到最后的成功者。巴菲特的年均投资收益率也不过25%而已，但这个看似普通的收益率，却足以让他成为笑傲投资江湖的全球财富集大成者。实际上，在投资行业的光明顶上，那些追求短期暴利的所谓投资高手，大'
