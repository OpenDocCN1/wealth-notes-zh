  md: '年来的民心，赢得大众的普遍认可的？


    范蠡出生于楚国一个贫困的农民家庭。他的父母深深明白教育改变命运的道理，于是紧衣缩食，把他送去一省省一级的贵族学校读书，但范蠡在学校备受富家子弟歧视，无心读圣贤书，他听闻传奇故事中的主角如孙悟空、段誉、张无忌等人于深山老林相逢神异高人而得到神奇武功传授，于是常常旷课，而去学校旁边的大山游荡，寻访仙人。就像上帝需要他拯救未来的越国一样，竟然被他找到了神人奇士——一个叫计然的高人，计然大师倾囊传授他哲学、天文学、地理学、军事学、运筹学、博弈论、概率论、心理学、厚黑学、星座占卜学、成功学等一些只有贵族后代、高干子女才够资格上的总裁班高端培训课程。范蠡勤奋好学，学而不倦，十年苦学，已将老师的文韬武略了然于胸。


    范蠡学成归家后，为了找寻赏识他的伯乐，故意装疯弄傻。其佯狂倜傥，傲然不俗，愤世嫉俗，却又才华横溢，引起了市长文种的注意。文种和范蠡纵谈世界政坛风云动向，阔论富国强兵之道，畅想人生职业规划，深为范蠡的谋略胸怀和深邃远见所倾倒，市长对疯子的才华大为折服，两个人自此成为铁哥们。在得知越王勾践全球招聘的消息后，范蠡通过决策树理论和鬼谷子学说，预测出大事业在东南方向向他招手，于是相约文种放弃市长官位，一起投奔勾践。


    范蠡凭借其先知式的大智慧取得了勾践的绝对信任，也成为勾践终生的良师益友；他为越国规划了两个十年计划，称之为“十年生聚，十年教训”策略，帮助勾践成功实现了人生目标。


    范蠡是勾践的精神导师。当勾践身陷绝境、对前途绝望之际，范蠡教导他：天道循环，否极必定泰来；地道在于接受命运安排，隐忍待发；如果遵循天地之道而自然作为，挫败就是暂时的；处于弱势时，顺势而为，甘于示弱，等待时机，最终会转弱为强。勾践听从范蠡的安排，以平和的心态成为夫差的奴隶，范蠡也亲身陪同，共同为奴。当勾践品尝夫差的大便后又万分后悔，无法承受屈辱、精神快耍崩溃时，范蠡劝导他：冲动是'
