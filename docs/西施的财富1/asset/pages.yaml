    他继续畅谈税收：“增值税、消费税、营业税、关税等间接税，可达到国家总税收的60%以上。但因间接税具有可转嫁性，从而导致其具有隐蔽性。间接税是在每个交易环节中间接交税，大众甚至不知自己已为所购商品交过税，更不知自己为所购商品交过多少税。”


