    +   2. 追求名车和豪宅。不在乎价钱几何，只在乎一旦拥有，别无所求，只在乎人无我有。


    +   3. 富裕起来的大众在追求享乐方面是穷奢极欲，各有千秋。有人喜欢购买奢侈的物品，不贵不买；有人收藏珍稀字画、前朝古董，不择代价'
