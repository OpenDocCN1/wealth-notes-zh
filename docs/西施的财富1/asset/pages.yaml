    并非老习我哗众取宠，诸位客官听我细细道来：范蠡携西施游历五湖寄情山水时，已年近花甲，体质不比当年，不可能有时间精力耗费于日常商业经营和投资活动中，更何况其志趣在于山水之间，更不可能有心思进行枯燥乏味的商业运作；而西施当时三十出头，身体正当壮年，精力正当旺盛，额外从事商业投资对其精力正好排遣和发泄，因此，最初西施出于消耗旺盛精力打发时间之需而参与商业经营，随着其对投资的兴趣日渐浓厚，范蠡遂以投资教练的身份，传授西施理财投资的观念和技能，而西施也颇具投资禀赋，经过范蠡的点拨教导，财技惊人，大手笔投资各潜力领域，纵横开阖，终获巨大成功。世人所了解的范蠡之巨大商业成就，其实乃西施之成就，世人据此视范蠡为财神；正如范蠡辅助勾践成就大业、勾践终成春秋霸主一样，虽然是范蠡在指导，但实际却是西施在从事投资活


