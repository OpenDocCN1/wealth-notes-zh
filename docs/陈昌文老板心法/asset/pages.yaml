    儒家思想是用来正心的，陈昌文方法是一个应用性的营销系统，包括营销和情感，都可以用陈昌文方法来解决。所以我们社群贩卖的品牌，就是陈昌文的思想语录，这个是大大家要深刻认识的。一旦你认识到这个点，你讲课就会讲得很好，并且是高冷式的。


    你抽离了过后，就很好买单了。你不抽离，就很难买单。你把这'
