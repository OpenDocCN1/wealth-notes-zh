  md: '# 4.1 陈昌文老板社群四句口诀


    一个正常人，合于道的人，活在世界上是舒服、喜悦的，吃饭、睡觉、干活，都感觉到身体舒服。如果您感觉不到舒服，不会珍惜、享受您的生命，则，证明您不在道中，您这个人活得有问题。别着急，大多数人都有问题，能达到这个境界的是极少数人。不过也很容易，起居有常，饮食有节，自然就做到了。如果能锻炼身体，要不了几天，您就进入这个道。如果您能尊师重道，孝敬父母，友爱同学，那您就更厉害了。不过难。您想生活、身体、身心灵都爽吗？想的话，就按照这个做吧。大部分人一辈子也体会不到愉悦的活着。


    陈昌文老板社群四句口诀：早睡早起，锻炼身体，孝敬父母，尊师重道。


    早睡早起，锻炼身体，人才不会累；照顾好家庭，孝敬父母，您的力量才会强大。父母辛苦一辈子，操劳一辈子，对得起我们，我们'
  merge: -1
  img_proc: true
- pgno: 168
  md: '就要想办法对得起父母。我们应该多赚点钱，应该养好我们自己的父母；尊师重道，老师是我们的领路人，教我们安身立命之道，尊师重道是做人最起码的素养；然后，您要努力工作，否则就没有经济来源。如果您把屋子都打扫干净、整洁，什么都没有，只有工作，则您收入进步。否则，您收入低下。


    这几条都做到位了，您就是人中神仙。不要做让自己开心的事，要做让自己变得更优秀的事！


    不早起早睡，锻炼身体，照顾家庭，尊师重道，努力工作，就是智力低下。早起早睡做不到，一辈子都废了。一切妨碍我们早起早睡的人与事，都是我们的敌人。要彻底的做到早起早睡，按照天地规律生活。人会逆向合理化，小心那些违背规律的人。


