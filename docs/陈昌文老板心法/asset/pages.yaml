  md: '这个世界上大家都是人，有的 25 岁，有些人 25 岁相当于 300 岁，有些人 25 岁只有 8 岁。为什么有些人有 300 岁，因为他经历了很多，他学了很多，他头脑灵活，这就是我们要的人。如果我们要跟
    8 岁的孩子沟通，他虽然付了钱进来，我们要教他，他什么都不会，对不对？还要教他怎么样拿勺子，我们不教他，我们不教这种孩子。我们教这种富人几百个都教会了，而教这个“孩子”，你永远也教不会。能听明白吗？


    就像有几个人，他天天就知道玩，什么都不做，天天啃老。对吧？吃了睡，睡了吃。你本来一个月赚个二三十万，然后你跟他玩，然后你会觉得你赚的太多了，慢慢你也向他靠近。并且这个人他什么也不会，他会向你借钱，他说你赚了那么多钱，你借给我一点。对吧？所以你不要跟这种人玩。


    你们很多人为了赚钱，就非要去赚屎人的钱，把钱收了，把单给我，是吧？我看到你很可怜，我能怎么办？但是我把你往这方面教，我们有些人他非要去找有问题的人做生意。本质上是你的心性没有成长，你不仅赚不到钱，还会惹一身骚。你一辈子都赚不到钱，因为你没有气场。一个女人她为什么有吸引力？是因为他会拒绝很多男人，不是每个男人都可以跟她在一起。做客户也是这个样子。我们做生意也是这个样子的，我们只做老板的生意，你乖，我才教你。


    我们教的是大道，教的是帝王术，我们教的是好东西，你听话照'
  merge: -1
