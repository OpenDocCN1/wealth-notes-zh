  md: '情绪的人，都是神人。用智力去约束自己，尊重规则。比如，每天搞36个账号，发36个矩阵视频，每天传播给几万人。比如，努力赚钱，远离人渣，不听人渣的话。这些都是要用智力压制情绪的人才能做到。普通人，满足自己的惰性，变成废物。人穷了，就喜欢玩。但是一旦自己开始赚钱了，而且利润很高的时候，人就不喜欢玩了。人就喜欢做正事，人就喜欢去做业务，因为做业务有钱。而玩，则一无所有。人不做正事，就会搞邪事。


    不能控制自己行为的人，就不能控制自己的人生，最重要的是控制自己的思想。管不住自己的人，将失去一切。管理不好自己的人，没办法自律的人，将收获终生痛苦。习惯是非常恐怖的。强大到进入肌肉记忆，不再需要脑子，自动做出反应。小心您的每一个错误的思维模式、行为模式，因为一但形成习惯，您会不知不觉跌入生活的深渊。有可能，您一辈子都爬不起来，就是因为一个错误的习惯。比如看不该看的东西。所以佛说善护念。念头错误，带来心理错误，带来行为错误，带来生理错误，然后带来发挥出来的文字、演讲、生命错误，未来错误。所以，善护念是根本。


    减肥为什么很重要？男胖子、女胖子，大家都不喜欢的，真心喜欢不了。减肥对身体健康有好处的，所以要锻炼身体，去减肥。减肥，可以锻炼您的意志力。没意志力的人，一辈子干啥都不成。一般情况下，您不要相信一个控制不了自己体重的人。现代这个社会，很多穷'
