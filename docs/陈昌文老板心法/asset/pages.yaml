  md: '讲到这个人，皇帝打不赢，他去打，江山打下来了，他把江山交给皇帝。皇帝把他的兵权剥夺得，他就交给皇帝。皇帝要他去打仗，他又带几个人去打仗了，这个就是虞诚。所以说皇帝不搞他。有人去跟皇帝说，郭子仪要造反了，皇帝都不相信。你在造谣乱讲。所以他一辈子荣华富贵。


    还有一个叫王阳明。这个大家都知道，王阳明这个人他为什么厉害？王阳明平定了叛乱、造反，他有大功，有再造之功。但人家跟他讲，哎呀，你就把这个叛乱给平定了？皇帝干啥，人家皇帝来了，没得玩了。好了，他又把这个家伙放了，让皇帝再去打一遍。然后他辅佐这个皇帝把这个造反的王爷抓起来，能听得懂吗？兄弟们，他能虞诚到这个地步，所以他是圣人。你们好好听啊，你们听着听着，有些人就造反了，你们好好学一学，就是做人要做什么位置才算对。**真正的高手不考虑钱财，钱财要多少有多少**。


    阳明还有一个事情很有意思，他功劳比较大，又很牛B。然后就有很多人陷害他。那些太监都陷害他，说他坏话，然后皇帝就整他，宫里的人就整他。有人就去跟王阳明讲，你现在这么牛B，人家还整你，你不反抗反抗？王阳明说，让他搞，能搞走的就不是我的，剩下的就是我的。能听懂吗？他能搞走的就不是我的，剩下的就是我的，这就是虞诚啊，兄弟们、姐妹们，这就是虞诚，这是最厉害的功夫。不过你不是这种人呢，你听着这个你可能不舒服，你必须理解这个层面，'
