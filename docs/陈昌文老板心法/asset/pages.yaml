- pgno: 148
  md: '# 3.10 真正的价值，是满足人的本性


    人的痛苦，在于控制不了自己的人性的。您若控制不了自己的人性的，那么，就由能控制自己人性的人来控制您，您就会被消耗，您的生命能量就会被消耗，您的人性就会被人利用，结果就是您的资金以及生命的流逝。


    简单地说，我为什么在《陈昌文方法 72 大营销系统》里单独开发一个形象营销系统？因为人性如此，人们喜欢美女，喜欢珠光宝气，喜欢帅哥，喜欢成功。所以，您必须注意自己的形象。您注意自己的形象，粉丝就买单；您不注意自己的形象，粉丝就不买单。商业，不过就是研究人性，研究人的本能。


    高手，每句话、每个动作，都是针对人性去设计的。一切都必须是商业思维，一切都必须是现金思维。一切都必须变成商业，变成现金。变不成现金、商业，一切都是错误的。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '真正的价值，是满足人的本性。顺应人性的社交营销套路、赚钱套路，才是最厉害的。用人的本能进行营销，才能收割大量粉丝。很少有人能抵抗人的本能。游戏，就是顺应人性。您的业务，必须附着在人性本能之上。


    人喜欢真善美，我们就宣传真善美；


    人喜欢利润，我们就给大家做利润的方法。


    人需要什么？我们就挖掘什么，给予什么。一个人无论他怎么说，他只要不是顺着人性说话的，即便是对对方有好处，对方也不舒服。


    人性就是天道。只要您掌握人性，就一定可以达成自己的目标。只要您做满足人性的事情，则一定可以获取成功。


    社会上最暴利的是什么？社会上最暴利的是人心，我们太过急躁，是因为我们太穷。我们不穷了，我们赚钱就悠闲了，也能征服人心，钱反而更多了。


