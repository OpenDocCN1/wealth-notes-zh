- pgno: 29
  md: '有教好，你说你脑袋笨。这些都不是原因！你很讨厌这个环境，你想要离开这个环境，当然你还是生活在这个环境，这个环境本身是由你自己的头脑造成的。这就是儒家思想，就是本质上是你的头脑、你的内心世界创造了你的环境，和你周围的人。也就是说你的人际关系、你周围的人是你内心世界创造的。那么你的贫穷也是你自己创造的，就是我们的贫穷是我们自己创造的，我们的财富也是我们自己创造的。所以说你不要去讨厌你的爸妈很穷，没有给你财富；你也不要去讨厌你周围的环境，你要用你你自己的内心世界和你的头脑去创造富有的环境，而不是讨厌这个环境。


    那么接下来就又有一个问题，就是我讲的这种头脑糊涂的人，你要认识到火就是热的，冰就是冷的。你不要告诉我火在相对的情况下是冷的，冰在相对的情况下是热的，你说的有道理，对，但是没有意义。


    我们群里有些家伙脑子不清楚，一会儿说好人是坏人，一会儿说坏人是好人，一会儿说东边是对的，一会儿说西边是对的。亲贤臣远小人，是小人就是小人，是君子就是君子。你不要一会儿说小人也是君子，君子也是小人。让你亲贤臣，你就亲贤臣；让你远小人，你就远小人，你把**这个**搞清楚了。月亮就是月亮，太阳就是太阳，你不要一会告诉我月亮也是反射的太阳光，月亮也是太阳。


    脑子搞清楚一点，我跟你说的，就是泾渭分明的。我让你讲大师的东西，你就去讲，复制、改编、优化；听话、照做、执行。完事了。不要扯犊子！'
  merge: -1
  img_proc: true
- pgno: 30
  md: '线性思维是可怕的，什么叫线性思维？你就是太聪明了。理解吧？所以你们糊里糊涂的，你这一辈子很难，你自己把自己搞糊涂了，你太聪明了。一个事情本来很简单，被你们自己搞复杂了，是因为你太聪明，所以你怎么也做不好。


    我说要努力去搞流量，搞变现，搞直播，去赚钱，然后又有人跑来反驳我了，老大，不用搞很多视频，不用搞直播也可以赚钱，这就是你们的聪明之处。


    我们讲思想是不去辩论。你之所以喜欢辩论，是因为你的愚蠢，你不懂。所以我们《道德经》里面讲“善者不辩，辩者不善”。不要辩论。在《庄子》里面也讲了这个东西，庄子专门分开讲了这几个东西。我讲的你懂，我们不用辩论；我讲的你不撞，我们也不用辩论，能不能理解？懂了都不用辩论。然后如果找一个裁判来，庄子说的，这个裁判懂我的意思，裁判他有他的思想，裁判觉得谁对，他自然会赞同谁；裁判觉得谁不对，他就不赞同。裁判有裁判的思想，所以裁判也裁判不出来什么东西。这是《庄子》里面讲的，你们有空可以去翻《庄子》，这都是最伟大的思想家、哲学家讲出来的话。


    所以老子很简单，它归结为“善者不辩，辩者不善”。没什么好辩论的。立场就是这个样子，立场坚定，斗志强，爱憎分明不忘本，这是我们伟人的思想。很多人他不知道对错！不知道站到一个立场上'
  merge: -1
  img_proc: true
- pgno: 31
  md: '去，他没有立场。


    没有立场的人，这种脑袋一会儿过去，一会儿过来的，这种也不可靠。能不能听懂？这种人也不可靠，我建议你们不要跟这种人交往，能不能听的懂？他一会儿说这个对，一会儿说那个对。你千万不要把重要的事情托付给这种人。因为他自己很魔性，他会被说服。他一会儿听这个是对的，一会儿就那个是对的，这种人最不好搞了。


    所以我们一定要选好一个立场，你要坚定那个立场。


    在儒家思想当中还有一个很重要的概念，就是说你以前是这样认为的，你以后也要这样认为，这个叫找到真理了。如果你以前这样认为，你过几天又变了，你再过几天又变了，这个就不好搞了。但是孔子也讲过，“吾五十而知四十九年非。”他也讲过这个话，《论语》当中本身有很多相互矛盾的地方，而且孔夫子对每个人的讲法也不太一样，比如说他鼓励子路要慢一点，他又鼓励其他有一些学生要快一点。他鼓励冉求要快一点。这也是根据每个人的性格去讲的，因材施教。


    但是总而言之真理性的东西，这个世界上的大部分东西，它是明确的。我们就把这个世界上大部分明确的东西学好。


    选择从情绪上讨厌环境，讨厌别人是容易的，但是这没有什么意义，真正需要改变的只有你自己。我们每一个人都不愿意改变自己，就赚不到钱。肯定是不找自己的原因的，一定是找别人的原因，这是我们每个人的习惯。人际关系不好，人际关系的质量差，肯定也不找'
