- pgno: 21
  md: '有些人说，老师我看您搞这个，别人不付费。那是因为您不懂佛祖之道，那是您不懂香火钱。您就是这个能量等级。您不相信我这个事情，您也用不起来。您为什么用不起来？不听指挥，自以为是。能量等级低。我讲的这个能量等级高，是因为您的能量等级不够，您用不起来。您用了我这个道，您难受。对于各位都是这个样子，因为我这里有很多道，各位不同能量等级的人，都会用出来不同的变形。


    我每天释放出来的文字，还有我这个书上的东西，一本书摘透，您来把它讲透彻，把它释放透彻，这个钱就来了，就能养家糊口，安身立命。这是简单的路，您不走。这个就是能量等级的原因，就是您的能量等级不够了，所以说您做不到。就这么简单的事情，您做不到。您照着书读就能赚钱，您不愿意，您非要认为您自己厉害。包括免责声明，我让您怎么写，我给您讲明白了。我们这个群里没有服务，您就这样讲啊，您为什么要讲群里有服务呢？您为什么讲不出来这句话呢？也是因为您的能量等级不够。


    这里讲的还是一个道，坏人听了就不得了，好人听了那也不得了。所以传道这件事情是特别的可怕，因为圣人不死，大盗不止。有阴就有阳，道高一尺，魔高一丈。您只要讲过一个“道”，那么就会出来对应的“丈”，就会出来“一道十丈魔”，您讲一丈道，就会出来十丈魔。这个谁也治不了，所以尽量还是不讲道。'
