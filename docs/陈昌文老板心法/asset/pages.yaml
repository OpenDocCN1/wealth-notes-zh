  md: '谈、格局自然就出来了。阴寒之人，就是身体有毛病的人。他的父母家庭有毛病，父母没有能量，故而子女也没有能量。这子女就是阴寒的人，陌人与其相处就是有损于自己。而老板，需要是有格局之人，需要的是有太阳心态、有光芒的人。这跟阴暗小人是两种不同的人。


    一个家庭的病来自于遗传，也来自于家族的思想体系 生活习惯的传承。所以，父母有的病，心理、生理、精神健康状态，大多会延续到子女身上。各位，不仅仅是基因的传递，也不仅仅是文化的传承，是全方位的传承。所以，不行的父母培养出来的孩子，要小心了。他笑起来，跟他爸爸差不多；他笑起来，跟他妈妈差不多。他的脸庞跟他父母差不多。接下来，惊悚的事情来了。他的病，心理
