- pgno: 146
  md: '变成凡人，变成废物。


    要规定自己应该干啥，要干啥，而不是想瞎。您的时间在哪里，您的成就就在哪里。改变命运，从热爱您的工作开始，您必须喜欢上您的工作。唯有绝对喜欢工作，才能做好工作，才能发达。人生最怕的是没有能力。您必须喜欢上您的工作，否则您不会压倒性投入，您就不会成功。人生是需要不断地奋斗进取的，什么时候不想自律管理了，什么时候就开始堕落。每天进步一点点，而不是退步无所谓的自由散漫。人永远应该努力工作，努力奋斗，而不应该浪费时间。人的成功是通过不断地努力来实现的。


    人要靠自己，不要怪别人，不要怪罪任何人，那样心量就太小了。不要责怪谁，否则，您的命运就坎坷。人是靠赚钱，让自己立起来的，人是靠不断地出单，让自己有颜面的。互联网时代真有意思，真的是能力强、肯干的人，赚钱；没能力的人，被淘汰。这就是美丽的互联网时代。而企业里，就是领固定资，互联网则不一样，您有本事，您赚钱就行；您没本事，那就努力学习，去拼命，去听课，变成有本事的人。人是自己把自己弄死了，又自己把自己弄活了，全靠控制自己的问题。能坚决控制自己的，都是高手。


    一个厉害的角色，就是能控制自己心的角色。一个能控制自己心的人，才能控制自己的身体。每个人都可以获得非常大的成就。难的'
