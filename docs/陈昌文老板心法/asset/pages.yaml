- pgno: 19
  md: '才能赚大钱。


    玄学不是比哲学更厉害，而是有些人听起来觉得玄，但听得懂的人听起来一点都不玄。听不懂，就觉得有点玄。玄之又玄，众妙之门。


    # 1.4 价值观营销，吸引到的是对应能量等级的人


    什么是价值观营销？就是我们跟人交流的方式是这样的：我的价值观是这样、这样的，您认可吗？而且我们永远是这样的，才能获得价值观营销的复利效应（见《陈昌文方法 72
    大营销系统》关于价值观营销系统和复利营销系统的篇章）。儒家思想是价值观，营销方法也是价值观。就像乔布斯一样，他做“苹果”就是要与众不同，改变世界。您是追求的与众不同，改变世界，OK，您跟我是一伙的，您买“苹果”；您不是，OK，您不要买“苹果”。


    少则得，多则惑。您老是想把什么都说服了，多则惑。古人是真智慧啊，大家都能把这些东西搞明白，那真的是不得了。这个都是顺水推舟的大道，就是说赚钱是不需要费力的，不需要出力的。出力、'
  merge: -1
  img_proc: true
- pgno: 20
  md: '费力，他就不赚钱了。就是说您做的不对，您说服别人这件事情特别累， 您就赚不到钱，而且还会赔本。我的态度是，我不说服您的，您爱听 不听。


    这是君子之道，圣人之道。君子之交淡若水。小人之道路是去舔 别人，承诺别人，把别人糊弄进来。君子之道是平淡相交，好坏自己 承担。道义相交就是好坏自己承担，您不要跟我扯犊子，但是这个道
    还不够高，更高的是佛祖之道。什么叫佛祖之道？就是您来送我钱， 叫香火钱。您免费赠送我的，无偿赠送我的。


    这个就象商鞅去找秦孝公一样，传了他几个道，帝道、王道、霸 道、强道。这个秦孝公他听不懂啊，讲帝道我不听。什么叫帝道、王道、 霸道？滚。老子要当强盗。好，商鞅就给他上强道。商鞅这个人也是
    您要什么，我就给您上什么菜，反正老子的菜非常多。这个人是特别 的厉害。


    我们在外面讲课，是为了吸引同频的人，不是为了教谁，也不是 为了改变谁。这是最深刻的道家思想。我们收人是您爱我吗？您爱我， 才来；您不爱我，就不要来。人，往外面推，则人越推越多。反之，
    越拉越少。您真的优秀，就一定有很多人给您付费。我的书籍里面的 东西，您拿过来用就行了，您不优秀也没有关系，书籍优秀就行了。 这叫搬运系统，这叫照本宣科系统，这叫听话照做执行系统。'
  merge: -1
