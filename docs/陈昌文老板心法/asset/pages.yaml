- pgno: 32
  md: '自己的原因。都去骂这些人际关系，说关系网对应的这些人行，其实也是我们自己的原因。


    我们无能，我们自己非要去跟这些人交往，这导致我们的人际关系很差。就像我们有些人跑过来给我讲，他周围的人都是坏人，他周围的人不怎么样，其实也是你自己的原因，你交往到了这些人。你自己识人不明，这是你自己的问题。


    所以“君子之德风，小人之德草，草上之风必偃。”亲贤臣，远小人。我们自己向善，我们自己改变了，那么我们周围的人就改变了，我们的环境就改变了。所以一切事情都是自己的事情，答案都在你的内心深处。


    佛在灵山莫远求，灵山只在汝心头。


    人人有个灵山塔，好向灵山塔下修。


    佛家中有很多跟儒家思想是相通的。你要修，就是向你的内心去修，所以是修心。很多人觉得修心跟赚钱，跟你做事也没有关系。它关系大了，它大得不得了。你这个心修好了，你整个世界就变了。要多大有多大，它是根源的根源。就是修心，你的整个世界都会变化。你的事业也在你的心里面，在你的头脑里、你整个人的根基、你的环境、你的人际关系全部在你的心里，不在其他地方。所以莫要外求，向内求。


    我们有些人觉得赚不到钱，没有人给他钱。没有钱就是你自己没有去释放干货给高阶层的人，你没有讲好我们的营销系统，没有讲好'
