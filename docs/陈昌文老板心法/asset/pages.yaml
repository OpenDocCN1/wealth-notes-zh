- pgno: 103
  md: '做执行，你乖，你是\u003cfont color="#red"\>个好人，我们才教你。你不是个好人，你不乖，你坏心思特别多，你是一个贼眉鼠眼的坏蛋，我们不教你的，你拿着你的钱滚吧，我不跟你玩的。谁跟你玩？你不行，我们要传的是大道。赚钱，要不要赚？肯定要赚，但不是谁的钱都赚，那是其次的。\n\n首先是道义要行。我们在一起首先讲的是义气，讲的是道义，其次才是赚钱。我们肯定要赚钱，不赚钱我们要饿死的。但是并不是说我们为了赚钱就无底线，谁来，我们都给你服务，不是的。你想多了，我们不是抖音上很多其他的那种人，是钱就赚，你错了，不是的。


    所以你们把我这句话记住，这其实也不是我的话，是孔夫子的话，你们这一生就会少上当。你们被别人诓骗了，我告诉你们为什么会上当，为什么你们会投资损失？跟人接触损失？是因为你没有原则，理解吧？你没有原则，就会碰到小人，你就分辨不出来什么是小人，\n\n跟你说话都是“利诱之”。君子喻于义，小人喻于利。君子谈话首先是道义在前。孔夫子也讲过，富而可求也，虽执鞭之士，吾亦为之。你让我去当司机，御马我也愿意。这是孔夫子讲的话。孔夫子也要赚钱。你给我点肉吃，我就教你，对吧？但是君子是予以义的，你跟一个人接触，你发现这家伙满口都是利诱你，这个人就是坏人。那么\n\n\n如果你经常跟这种人在一起，他只谈论这个，你就会上当。他永远在想办法掏空你的钱包，而不是给你一些真正的精神上的启发。


    必也正名乎！名很重要，所以我们叫陈昌文老板社群、陈昌文老'
  merge: -1
