- pgno: 23
  md: '很多的金钱，他才能帮您办成。但是您们之间是没有什么交情的，居然去托付他，他可以帮您办了。在历史书上能看到这样的故事，被史官记载下来的。这是为什么？这是能量等级相同的人之间的交易，之间的交情。您的能量等级不够，您理解不了，您觉得这是假的，您觉得这个人怎么那么傻，付出那么多？人家能青史留名，您觉得是人家傻，还是您傻？


    # 1.5 看人，先看其能量


    看人，先看其能量。每个人的能量是恒定的，一般不会变化，有些人后天会修为一些变化。您我都是天生的，后天添进去的一些东西，它改变不了多少。就像您是一颗稗子，您长大就是稗子，只是您长得壮与长得不壮而已，就是天折不夭折而已。您的品性并不会变，您是一颗橘子树，您长大就是一颗橘子，您结不结果，开不开花，散不散枝，那是另一回事，那是后天所培养出来的东西。但是这个个性，是定了性的。这个是宇宙真相，这是能量真相，三岁看大，七岁看老，确实是这个样子的，这是真的。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '我们现代科学，现代社会培养的这个智慧，它把这些真理给覆盖了。爱情就是多巴胺。爱情是多巴胺吗？这个后天的科学，爱情不是多巴胺，这个才是真相。人有神交的。科学是科学，科学它是一个分支，它并不能诠释宇宙的真相。它只是一个分支，而且是一个有待验证的分支。它随时在推翻，它之所以是在推翻，就是因为它的认知不是全面的。那么我们现代科学和现代读物讲什么？是把大家统一到一个水平线上来。这种教育本质是有问题的。


    人们喜欢漂亮、帅气的人，这是因为人的天性、本能自然喜欢能量强的人而已。花要开得姹紫嫣红，需要能量。所以，美丽、帅气的人，本质是能量足的人。也有乱用能量的高能量之人，这些人当能量不乱用的时候，就会重新姹紫嫣红。


    也不是每个人都可以当领导的，并不是每个人都可以当头的。有些人必做跟随者，因为他的能量就是跟随者的能量，而有些人会做领导。能做领导人，都是能量强之人；小人物能量不够，就做小人物。若是也想做大人物，就会出问题，因为能量供给不上。


    这个世界人人都想成为马老师，又有几个人成为马老师了？为什么说有些人没有机遇？那是没有机遇吗？机遇多得很。比如，陈昌文老板社群，现在的能量和马老师创业的时候，我们的能量不比'
  merge: -1
  img_proc: true
- pgno: 25
  md: '他差，社群里聚集了这么多老板，如果您有本事，您就可以创造下一个马老师。但是您有没有这个本事？任何人在这里都可以成为富翁级别的人物，但是您不会成为这样的人，是因为您的能量，您不是这个能量等级的人。


    只有有其人必有其事，有其事必有其人，所以人要找到他的定位，就是您是什么人。这个是天道，不是人道。


    牛人一般情况下都是大脑袋，大脑袋就是能量足。后天供应不足，会导致身材矮小，但是其头脑依然会大，这种人先天足，后来也会发达，至少会长命。这里有个问题，就是脑袋小，后天供应足，则后天个子高，也可能会长得英俊、潇洒、漂亮。但这种人，就是空壳子、空皮袋，犹如好看的果皮，里面没有实物。这种人，容易骗到很多男女，但是终其一生，没有什么成就，属于中看不中用的人。其生出来的子女，一般也不行，另一方得补贴子女天水。


    选男人，选女人，选未来跟随者，都要选精气饱满的人。能认识到这个问题的人，都是高手，都属于能望气的人。一般人没这个能力，那就望形，也就是脑袋大是第一要素。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.6 知道的人，并不一定具有执行的能量


    我们知道很多真理，为什么很多人执行不起来？是因为不同的真理需要不同的能量等级，并不是说这个真理您知道了，您就会去执行。比如说，我们早上起来锻炼身体，这个也是需要能量的。一个人的能量强，他的阳刚之气强，那么他就能锻炼身体，而且越锻炼越强壮，他越锻炼越感觉爽。另外一个人，他天生肾虚、体弱，他早上根本就起不来，他不是这个能量等级的人，您让他去锻炼身体，他使劲跑使劲跑，跟别人学跑马拉松，其实对他的身体是有害的。跑着跑着，结果他可能就猝死了，就是他做了不对应能量等级的事。所以我们圣人讲的叫做万物各从其欲，这个是圣王之治的最高境界。圣王也会让坏人去干坏事，也会让好人去干好事。


    知道与做到，为什么是两码事？知道的人，并不一定具有执行的能量。所以，这种人知道了也没有什么意义，但是他们的阴气重，就会搞破坏。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '对于一些人来讲，读书也是没有意义的，为什么？因为执行不了，用不上，不会用。有一句话叫做百战归来再读书，这种人都是在对应等级能量上的，他有这个潜力。潜力也就是您终于找到了您和您的天性、天赋对应的事情做，您就有了这个潜力。


    所以，上等人都 是顺从文化、执行文化、行动力文化，听了就 去干了，他有能量执行，这个就是真相，等 等人是顺从、温和、服从。其实人类社会本质上是一个军事单位，我们都是军事单位的一部分，整个地球文明就是军事单位的斗争。如果军事
    文明不行，就被别人消灭了。从古至今，这个地球上有很多不行的文明、不行的军事 单位，就被消灭了。


    军队当中有一句话是这样讲的，领导跟 下面的将军讲：我让你去打仗，你就去打仗。 你不要问为什么要打仗。因为军人就是要服 从，你理解的也要去执行，不理解的在战斗
    中去理解，在执行中去理解。这就是上等人 文化，这是最根本的军事单位的文化。你必 须要顺从这个事情，在执行中去理解。这个 不需要你理解，你理不理解都要执行。


    能明白顺从文化的，赚钱就是很简单的一件事情。您之所以没走到这道上来，就是您自身能量跟这个不符合，您不走这个简单的道理，不能执行，没有能量执行，不能听话照做。大道至简，说的也是这个东西，它本来就很简单。这个道就是很简单的，很有力量的，是'
