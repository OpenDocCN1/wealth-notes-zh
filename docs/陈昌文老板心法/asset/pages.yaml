- pgno: 215
  md: '# ## 6.1 穷人的思维模式是打工，富人的思维模式是投资


    穷人和中产阶级为钱而工作，富人让钱为他们工作。


    穷人的思维模式，是为钱工作，为别人工作。穷人的工作模式是，为工资工作，为老板工作，为小钱工作，为短时间的钱工作。穷人的模式是打工，埋怨。穷人保守着自己的工作，天天盯着工资，只知道挣小钱，只知道存钱、花钱。穷人被失去金钱的恐惧，被情感牵引。穷人的情绪、感情左右了自己的人生。他们怕自己独立去做项目，于是他们只能获得一份工资。


    富人的思维模式是，让钱为自己工作，打造一个赚钱的系统，打造一个赚钱的项目。富人的工作模式是，为自己工作，为未来工作，让人跟着自己一起做项目，让钱为自己工作，给别人发钱，让别人为自己工作。富人以只能拿一份工资为耻辱，立定志向，必须自己做事业，绝对不拿工资，哪怕饿死。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '老板的贫穷是暂时的，打工族的贫穷是永久的。开公司不危险，只要有高人指点。打工反而是高危职业，经不住人生几次风浪的折腾。极少有人通过打工发家致富的。


    富人的模式是投资，然后是学习，然后是做项目。富人的模式是立刻行动，为自己的事业、项目行动。用钱制造产品、服务，然后用产品、服务，赚更多的钱，并且打造自己的团队。富人知道分析市场，分析项目，分析怎么才能做大做强。富人靠理智去投资，去获取回报。富人是通过投资，承担风险来赚钱。穷人总是不想投资，想要直接的回报。


    穷人浪费注意力，浪费时间。而富人，用金钱购买别人的注意力，购买别人的时间。购买的注意力、时间越多，富人就越富。而穷人就越穷。富人，打造的是自己的资产；穷人，打造的只是自己的工作。为什么富人努力工作？不过是为了打造自己的赚钱资产。而穷人努力工作，只是在奔波而已。


    只有不断地打造自己资产的人，才有资格财务自由。


    富人搞到原始积累过后，就会开始让钱为自己工作，雇佣更多的人为自己工作。穷人的思维模式是，为钱工作，用完了钱，又为钱工作，永远都在挣钱。穷人的思维模式是，我今天能赚多少钱。而富人的思维模式是，我们今天能留下多少钱。富人更关心留下来的钱。穷人更'
  merge: -1
  img_proc: true
- pgno: 217
  md: '关心数字大，愚弄自己，最后所剩的很有可能是负数和账单。


    我以前打工的时候，有个货车司机说，你看，我一个月 1.5 万工资，比很多大学生都牛 B 呢。但其实，他拿着工资，去打牌，去游戏厅赌博，一个月下来，月光。一年下来，3000
    块都拿不出来。而有的小伙伴，虽然一个月 8000 块，但每个月存 5000，一年下来能拿出来 6 万块。富人有存钱的意识，非常注重结果有钱。富人存钱是资本，以便为了投资让钱增值；穷人也存钱，穷人存钱是怕失去，然后会不断地贬值。穷人是现在有钱就行了，现在爽就行了。富人长远，穷人短视。


    穷人工作是为了赚点薪水。年纪大了，还在赚可怜的薪水。而富人呢，工作是为了学习以及提升自己的头脑，提升自己的管理能力，提升自己的营销能力。富人不为钱工作，而是为了获取更多赚钱知识而工作。如果这个工作可以让自己获取赚钱的技能，富人甚至愿意免费工作，或者倒贴钱去工作。但是，这种事情，穷人想都不会想，还会破口大骂。


    富人喜欢做销售，做宣传，做演讲，读书写作。穷人认为做营销、销售是丢脸的，是诈骗行为。穷人认为演讲是吹牛，读书无用。若是看到别人写文章，穷人就认为，您不就是会写点文章吗？有什么了不起的？


    不赚钱的人，总是在跟人闹事，生气。赚钱的人，不过是一直在搞流量，一直在聊天收单，一直在卖卖卖。赚钱的人不要面子，不赚'
  merge: -1
  img_proc: true
- pgno: 218
  md: '**钱的人习惯性有尊严。有尊严的，穷得叮当响；没面子的，富了。但是，那些有尊严的，瞧不起那些富了的。他们说，那些富了的人为富不仁。**


    穷富，是一种思维模式的区别。思维模式才是人与人之间的最大区别。不要为钱工作，哪怕无偿也比为钱工作要好，否则形成雇员的思维模式。


    # 6.2 穷人不喜欢学习，富人习惯性投资大脑


    许多人看起来很勤奋很努力，但是买不起车，买不起房，仍然生活在社会底层，这是为什么？不做 36 循环系统，不学习儒家思想，不学习陈昌文方法，不搞小视频，不搞直播，不搞喜马拉雅音频，不搞自媒体。


    富人的头脑与穷人的头脑是两种不一样的头脑，他们喜欢接触和愿意接受的信息也不一样。对于信息，有些主动排斥，有些主动吸收。


    穷人不喜欢用新工具，比如微信来了，抖音来了，喜马拉雅音频'
