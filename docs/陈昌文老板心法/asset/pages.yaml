- pgno: 210
  md: '做的跟聊天工具刚好一样大。其目的是为了避免系统检测风险提示，甚至举报。每一个步骤，看似平淡无奇，但都是有很多经验的。于是，这种高手，就日日几 、几万的进账，就是这么简单。


    高手的每一个动作，都是用来赚钱的。只有那些能提高地位、收入、权力的行为，才是有效的勤奋，才是有效的奋斗行为；不能收获上述结果的其他所有行为，都是无效行为。高手，不浪费自己的时间，也没有多余的动作。高手，随时随地洗脑自己干活，跟着能洗脑自己的人干活。洗脑非常
    要。不愿意被洗脑，是止步不前，愚蠢的表现。要让规律洗脑 己。比如，我知道36循环系统，一定会让人发财，那么，就让36循环系统洗脑自己。高手，没那么多废话，听懂了，就是干。因为，只有
    ，才会出成绩，才会赚钱。高手是不断地释放，收钱。低手是什么？是成天学习，吸收。蠢人喜欢用时间解决问题，等靠要，然而问题解决不了。


    高手只搞流量，只聊天收钱；孤独、聚焦。任何高手，都是孤家寡人。当然，团队也是跟着他们发财的。傻瓜总是一群群的，说些无聊的话。一个高手，即便是不赚钱，也在不断地奋斗。因为高手懂得，每一分钟都是积累。流量到了，聊天火候到了，小单子积累多了，大单子自然就有了，顺应规律，天下无敌。真正的高手是付出者，长期的付出，有方法的付出。只问耕耘，不问收获。这是真正的高手。'
