  md: '什么道德？就是道在身上行，就是道德。道没在身上行，就是无道无德。修之于身，其德乃真。如果一个人的德，也就是这个尊师重道，不能修到自己身上，这个德就真不了。真不了，就跟您无关。尊师重道，也就是个口号而已，没有意义了。


