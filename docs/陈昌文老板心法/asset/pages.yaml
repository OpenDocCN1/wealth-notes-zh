- pgno: 244
  md: '干自己喜欢的事情，然后把这件事用商业经营的手法链接，建立一个商业正向循环，这样就能做大，做好、做强、做一辈子。


    社交媒体时代、短视频时代，企业越做越小，一个人的销售力比一个公司、一个大公司都强大。个人品牌时代会到来。前面这些年，都是一些聪明人自己悟出了要搞个人品牌，靠着个人品牌赚到了很多钱。接下来的直播时代、短视频时代、社交媒体时代，将进入人都是个人品牌的时代。某几个网红，已经证明了这件事，这种模式成本低，利润高，以后，会有更多的企业家、创业者会采取这种低成本营销销售模式。


    不要觉得自己的条件差。任何人的条件都不差，无论您是生活在偏僻农村，还是富贵城市，只要您利用您周围的一切，认认真真地去对待，您都会获得不错的回馈。某网红在大山里，照样赚很多，这就是不怨天。任何一件小事做好了，都能彻底改变您的命运，您别以为机会少，机会其实很多。比如，您玩好了您的手机，或者玩好了视频，或者直播，甚至文字。奇怪吧？别说没机会，每个人都拥有太多的机会，只是您并没有沉下心来做好您力所能及的这件小事。


    任何人都有机会变成很厉害的人物，厨师可以，摄像师可以，种地也可以，写文章、做直播也可以。下学而上达，您得做好您手上的事情，上天才会给您更多的机会。您不愿意做好您手上的事情，您就'
  merge: -1
  img_proc: true
- pgno: 245
  md: '想走向人生巅峰，迎娶白富美，大概您是痴心妄想。不想做好现在手上的小事，则一辈子不会再有其他机会。


    努力提升自己的能力，钱就越来越多。不要担心自己穷，要去提升打造团队的能力、营销的能力、变现的能力。能力提升了，财富自然来了。没事了，闲着了，就去苦练自己的能力，演讲能力、写作能力、做视频的能力、哲学思辨能力，当然还有道德文章能力、尊师重道的能力、善良的能力。能力涨一分，名声会涨十分。这个世界上，没有多少真正下苦功夫提升自己能力的人，大多数人都在求虚名，所以，您若有务实提升自己能力的思想，您就会超过大多数人了。能力比吹牛重要，虚名不能让人成长，真正的修炼自己的能力才会成长。高手不断地修炼自己的能力，日日精进，实至名归，但也不是说不搞营销，不做流量了。要并驾齐驱，既修炼自己的能力，又疯狂搞流量。


    流量对应虚名，而能力对应变现，两手都要抓，两手都要硬，必须完成这个工作。


    功夫都在平时，平时下了苦功夫，有了真本事，遇到任何事情都不会慌张，包括什么经济危机，什么市场下跌，都无所谓得。平常下了苦功夫，余粮多着呢，几年不赚钱都无所谓，平常没有违法犯罪，也没人能找到您的漏洞，这才是企业家要修炼的。人这一生，确实选择大于努力，赛道不对，您再努力也就那样了。


    好在互联网时代，您可以大面积宣传，也许一个小点，别人看不'
  merge: -1
  img_proc: true
- pgno: 246
  md: '起的赛道，宣传下去，却可能有意想不到的收获。


    但人并非有才华，有能力就能成功，还必须有规划、有节奏、按规掂量自己能吃多大的饼。若是不懂这些道理，即便是有很大的才华，也可能翻船。


    何为千里马？能日日夜地去干，能按部就班地干，按自己的节奏、能力去干，锁定目标不放松地去干。这种人，即便是没有什么才华，也能走得很远，称其为千里马。人生是一个马拉松，您必须从一开始就明白，不到最后那一刻，就不能盖棺定论。猛一时不算猛，乱猛不算猛，一辈子拉长来看，您的成绩在哪里？这才是您要关注的，不谋全局者，不足以谋一域。


    # 7.2 道多了，就无道了。走一个道，才能悟道


    人这一辈子，选好了一个项目、一个人群，找到一群志同道合的人，就不要变了。一直干，干到天荒地老。使命不要变，手段、平台可以换。手段是灵活的，目标不要老是换。做流量的平台可以换。大'
  merge: -1
  img_proc: true
- pgno: 247
  md: '多数人不愿意从一而终，总是觉得还有更好的项目，还有更好的捷径，结果换来换去，浪费了时间。要多想想，怎么把手上的事情做好，这个最实在。


    何为战略家？不是研究未来做什么，而是研究现在做什么，才有未来。战略家，不是放弃现在，研究未来的人，而是把现在要做什么研究到极致的人。


    我碰见一个企业家，他就是喜欢做现在的事情，他说，现在的事情做好了，自然延伸出来未来的盈利模式。现在没做好的人，无论他如何研究未来，就算真被他碰上了，他也没有实力去做。


    人为什么喜欢换项目？因为人觉得现在我做不好，我换一个就能做好了，自己不愿意下苦功夫去死磕工作，不愿意把工作做到极致，总是想着别的地方更好。换一个新项目，又重复以上想法、动作。其实一个人的未来，是因为他现在的工作做好了，才有未来。这可以说是最快的道路。您在您熟悉的地方都干不好，凭什么换个不熟悉的地方，您就干好了？


    一个企业，只要锁定主业，锁定自己擅长的，就不缺流量，不缺转化。合作伙伴都熟悉，自然是有钱赚的。没有可能没希望，没有可能做不出来。最怕的就是您二心二意。


    我对陈昌文老板社群内部学员的要求就是，只要您坚持儒家思想，'
  merge: -1
  img_proc: true
- pgno: 248
  md: '+   1、做人踏踏实实；


    2、一句假话不讲；


    3、只认认真真地做项目；


    4、搞流量，搞转化；


    5、踏踏实实跟一个老师，从一而终；


    6、不骄傲、谦虚、低调，一直拼命干活。


    那么我们就是老干妈，我们就能给自己打下铁壁江山。我们就是华为，我们不需要上市，也不需要融资。在这里的人，都会发家致富，都会君临天下，而别人都不知道我们很厉害。这就是我们的哲学，我们衣锦蔽袍。什么意思？里面穿绫罗绸缎，外面套一件破烂袍子。


    营销哪里需要虚张声势？君子怕的就是名声太大，而没有实力。您们严格按照我这个价值观去干，富贵唾手可得。


    一个人的事情，只能有一件，不可以有几件。网络上，到处都是生意，到处都有生财之道。您必须理解利出一孔，力出一孔。如果您能找到 2 个以上的地方都生利，证明您根本不理解聚焦。您这个人活得累，收入也不会怎么高。高明的人，就是只有一件事，一个谋生的本事。人的金钱是建立在自己的能力、圈子、人脉上，不要去找机会，实际上从来没有机会。您有多大的资源、能力，这本身就是您全部的机会，这是向内求的根本。一个真正聪明的人，是不会去进入自己不懂的领域，或涉足多个项目。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '机会是要一直深入，才会抓到的。不深入，则抓不到机会。


    我们是商人。商人是什么？商人就是找到最好的东西，改编一下，扔出去。一门深入，长期熏修。制心一处，无事不办。商人，是用最小的利益、最小的风险，获取最大的利益，疯狂的提升效率，然后又不违规，出单最重要。做生意，成本要小到极致。然后，在一个点上，不断地深挖，不断地输出，不断地引流，不断地变现。这才是高明的生意。


    做好一件事、一个项目、一个点，别人再找您做什么，您就别做了。一辈子追求在一个点、一个项目、一群人、一个老师身上，走一个道。道多了，就无道了。走一个道，才能悟道。自己有一个项目了，就一直研究，深入自己的项目就行了，别成天找机会。重视短期利益，而不是长期利益，今天能干啥？活在当下最重要。能把现在的事情做好的人，才算高人，不要吹嘘未来，未来不可知。那些有未来的人，也不过是现在的事情做好了，做到极致了。锁定一个项目，不断地培养团队，就能赚钱。要彻底投入一个项目，要精气神、灵魂都投入进去，猛干，就能赚钱。如果您极度认真，就一定有利润，您会想到办法赚到很多钱的。


    君子忧道不忧贫。找到一个道，坚定地去做好，去实现。而不是成天抱怨、不爽。不跟无关的人、不在自己道上的人多说一句话、一'
  merge: -1
  img_proc: true
- pgno: 250
  md: '个字，不合作，只管实现自己的道。实现自己的道，则什么都有了。


    时间线拉长，其实我估计最多就是一年，您就开始飞黄腾达了。在这个互联网社会，只要您找到一个道，不断地营销、变现，您大概率都会超越很多人。


    只谋道，不谋利。在道中，就有利。不要跟蠢人讲什么利，也不要听蠢人的。自己懂道，有志向，去实现就行了。少跟社会上其他人交流，没什么意义，想想自己的道，去实现就行了，以免被引导偏了，变成了韭菜。


    走大道，走简单的道，圣人说什么，我们就干什么，别找秘密，别找秘籍，人一辈子做好小事就行了。要听圣人的言论，圣人说什么就是什么，别反驳，别多嘴。做好小事，认认真真地去干，您自然就成长、成就。为什么您不相信简单、直白的大道理呢？说白了，还是您太聪明了。每天不听圣人的言论，是罪过，每天不按照圣人说的去做，老是以为有个什么特殊的秘籍，走个什么捷径，走个什么小道就会成功，这是愚蠢至极。


    一心一意的做好自己的事情，什么都好了。认认真真搞自己的业务，认认真真卖自己的产品，认认真真优化自己现在的事情。搞聚焦系统，只做一件事，把一件事做透彻，什么都好了。只做一件事，才能做到精益求精、炉火纯青。做多了，什么都干不好。没有任何意义。在一个环节上下功夫，以工匠精神做好一个环节。不用找其他的机会，'
  merge: -1
  img_proc: true
- pgno: 251
  md: '现在的事情做好，就是大机会。


    人只应该关心自己的工作、自己的组织、自己的团队、自己的事情，做好自己的事情，才算高人。在自己的项目上，自己的组织里，抓住核心关键点，然后把这个核心关键点做到极致，不断地优化这个核心关键点，您就会一日千里。保护好自己，管理好自己，做好工作，就行了。不要去管别人的事情，做好自己手上的事情就行了。


    要集中精力工作，而且把工作当成一种修行，您的工作就能做好，然就有回报。当然高手是要不回报的，而只是日复一日的做好工作，因为工作本身就是幸福，就是回报。修行的本质，就是绝对唯一的追求一个信仰，修行修的就是专注力。专注在自己的工作上，自己现在这件事上。


    专注力可以随时随地的培养，这样您就进入心流状态，极度认真的 作，非常愉快。如果您不培养您的专注力，那么，您慢慢的就变成一个精神废物了。专注力，是一个成功者的基本素质，希望您从现在开始就培养自己的
    注力，进入心流状态。当您极度专注，进入心流状态的时候，您不想有成绩都难。（见《陈昌文方法72大营销系统》心流营销系统）


    竭尽全力地工作，您就会感到工作很轻松，比如，我专注于写文章，我就不怕一会儿还有很多事情，我会发现我能轻松地征服我的工作。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '人要集中精力去干，才能征服自己的工作，否则，就会怕工作。唯独有把工作做好了，做到极致了，超越所有同行了，成为行业领袖了，我们才能获得不可思议的回报。工作做不好的人，不配拥有美好的人生。


    老板要让所有人工作，工作，不断地工作，而且要集中精力的工作，只有这样，才能致富，这是领导者的责任。人可以去玩，但是工作的时候，务必高度集中精力。在当前社会形式下，我还是希望您集中精力做互联网赚钱。时间过的很快，我希望您拼命工作，珍惜时间，而不是荒废了。


    世界很大，但是那不属于您。属于您的，就是您的手能够摸到的地方，思维能够改变的地方。向内求，是王道思想。经营好您拥有的，您就会拥有天下；经营不好您拥有的，您拥有的就会失去，也发挥不出来效力。您去关心您没拥有的事情，纯粹是皇帝不急太监急。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# ### 7.3 一个会社群营销的人，

    一定可以改变自己的命运


    一个会社群营销的人，一定可以改变自己的命运。


    一个会社群营销的企业家，一定可以让企业在移动互联网时代、短视频时代获取成功。不会的，可能就享受不到社群营销的巨大红利了。其实很多企业，大型企业，有敏锐度的企业家，都应该实践社群营销，这个东西很厉害，可以打造网络品牌，营销。


    在一个流量渠道上不断地死磕视频、直播、朋友圈营销，这是现代互联网社会的营销，社群营销是当下最凶猛的营销，没有之一。


    社交媒体是用来包装自己个人品牌的。


    视频平台、直播平台，是用来矩阵传播自己个人品牌的，这就是 20 年的生意模式。


    互联网的生存之道，就是聚焦一个小项目，不断地做营销。当今企业的转型之路，就是社群营销、互联网营销，还有大多数人看不起'
  merge: -1
  img_proc: true
- pgno: 254
  md: '的某种营销。


    在垂直细分领域做到第一名，吸引很多被动流量，找到自己的优势。


    比如，我是社群营销专家，我做社群营销很牛 B，然后就卖这个社群营销给企业家就行了，然后成为这个行业的第一名就行了。


    比如，我专业做美女老板社群营销，专业做成功美女老板社群营销圈子，这个圈子非常小，但是深入专研，里面还是有一点点利润的。


    垂直细分第一名，才具有品牌效应，也是个休老板、普通老板在当今互联网时代崛起的重要打法之一。一个行业太成熟了，也就没什么利润了。要选择一个打击面广的领域，也就是各位老板都需要的一个点，然后这个点又没少
    数人去关注，您去做好，然后做好这个点，为这个社会做贡献，做到极致，您的收益就不会低，比如社群营销教学。


    任何一个项目里面都大有文章，就说社群营销这件事，您真的是细心研究，努力去做，一直去做这个环节，您名气就会越来越大，越来越具有品牌效应，赚到的钱会让令您自己大吃一惊。


    要深入，而不是浅尝辄止，其实，就一个差异化营销，您天天讲，天天做，您会发现其中的奥秘真是博犬精深，玄妙精微。从您的语言到服饰、首饰、行为、视频、直播，都可以搞差异化营销的，就这个东西，就可以开一堂课程，专门讲。然后获取大量经济利益。思想对了，赚钱就没那么难了。


    254'
  merge: -1
  img_proc: true
- pgno: 255
  md: '想拥有什么，您就踏踏实实地照着那个方向去做，然后，您就会拥有那些东西。不要急，一步步地去做，该来的，都会来。有些事情，您必须做，您若不做，后果会非常严重。比如，做网络营销，重要的就是精准粉丝，重要的就是垂直细分，而您不做这个，您逃避这个问题，那么您就没有收益，就会日日徒劳。每个老板都必须清楚，您必须在网络上做流量，必须做变现。不做这个动作，就会饿死。不做这个，只做其他无关紧要的事情，您就会一无所有，市场是检验真理的唯一标准。


    有个大咖说，产品比营销重要，这是外行人的讲法，产品只是营销的一部分，营销包括什么？ 1、产品。2、价格。3、促销。4、渠道。说产品比营销重要的人，属于对营销还没入门，对生意还没入门，犹如说手机上的屏幕比手机重要一样。


    营销是任何人都绕不开的话题，任何人都应该时时时刻刻学习营销，因为您必须有客户，有粉丝买单，才能支撑您的兴趣，您人生的方方面


    今互联网社会是短视频、直播的时代，我们每个人都要学习短视频、直播。然后学习社群营销，学习互联网的传播、裂变，我们应该就能活得不错。人，是学习的动物，并非生来怀有绝技。


    生来就什么都知道的人，知道什么事情该如何做的人，就是天才，'
  merge: -1
  img_proc: true
- pgno: 256
  md: '天生的人才，是觉悟者，是第一等人。学霸是通过不断地学习，什么都知道了。人生中的学霸，就是提前学习各种人生需要的学问知识，这种人当然是社会的佼佼者，能过得很好。困而学之，碰到困难了，知道学习，不断地解决问题，这种人，也能在社会上混得不错。最可怕的是什么人？就是碰到困难了，也不学习，拖着，混着，等着，这种人最可怕，一辈子都陷入一些困境，从来不去改变。倒霉的孩子，就是这种人。一辈子倒霉，从不学习，从不反思，小问题变成大问题，大问题拖成死问题，无可救药。


    找到厉害的人去学，而不是自己在那里冥思苦想。很多人一辈子过的很惨，就是不知道学习高人的思维模式、赚钱模式。其实只要您愿意学，1年、3年，您就改变您的命运了。这就是我们为什么要学习儒家思想，学习陈昌文方法72大营销系统的原因，为什么我们要学习社群营销的原因。因为这东西，确实可以改变命运。嗯，这段文字我也不打算删除了，算是自吹自擂。王婆卖瓜，自卖自夸嘛。


    进人一个社群，就要学习，而不是自己思考。很多人毛病很多，努力很长时间，也没有进步？为什么？愚而好自用，贱而好自专。只在自己的头脑里打转转。永远学不会听话、照做、执行。这样太难学会了，导致这些人很难进步。成功的东西就那么多，您不去学习？如果您没成绩，大概率就是在有成绩的地方，您也根本不学习有成绩的做法，导致您所有做法都是错误的，于是，您就不赚钱了。坚持只用'
  merge: -1
  img_proc: true
- pgno: 257
  md: '自己的头脑的后果，是您很长时间都没什么进步，而且可能终身都没什么进步。


    古圣先贤的讲法，可能颠覆很多人的想法，比如学习比思考重要，而且重要得多。学就行了。我在后面加上了几个字，叫做听话、照做、执行，为什么？就是您学了要去实践，要去干。其实在儒家思想、《论语》当中，学习本来就是一种实践，一种
    ，不是在书上学习，而是在实践中 赚钱中学习。希望大家能看懂我这段话，然后学习我们社群的精髓，赚钱思想，干活就行了。而不是成天在那里看不起内部讲师，看不起别人，认为自己高明。


    但愿那些努力了很多年的同志们，进入一个群体，要放弃自己的头脑，别天天瞎琢磨。把一个社群里的所有能赚钱的思想都学过去，然后听话 照做、执行。


    # 7.4 依托社群做个人品牌、群体品牌


    我是专业做老板圈子的，我们社群里有很多老板，身价很高的那'
  merge: -1
  img_proc: true
- pgno: 258
  md: '种。我喜欢跟这群人打交道。社群是做个人的品牌的好地方，然后全网布局视频、文案、图片、照片，这样就可以做起来自己的个人品牌。团队模式做个人的品牌当然更厉害。


    做个人的品牌的核心是，您要不断地释放您的专业形象、专业信息，比如，我就是专业做社群的，我做的社群其实已经很大，很有名气了，而且日日在传播。做社群，用很多讲师做，几个、几十个，上百个讲师慢慢传播。这样个人的品牌与社群发展都会越来越快。


    我建议企业家都要做个人的品牌，做社群，做讲师矩阵传播。这样，您以后做生意，谈项目，谈合作，都会很容易。我做个人的品牌的目的并不是为了我能赚多少钱，但是钱迟早会来的。


    企业家为什么要做个人的品牌呢？我觉得，以后是一个更靠个人的影响力、传播力、品牌力赚钱的时代。


    所有的明星、高手、网红、大商人，现在做个人的品牌的意识越来越强烈了。在某些视频平台，他们都开始入局，布置自己的账号。我建议有钱的企业家都要入局这个模式。品牌是底层逻辑，是流量的真正私域。您有了个人的品牌，这些流量会一直跟随，是进入人脑记忆的东西。这才是真正的财富。以前的企业家都是躲起来赚钱就行了，以后的企业家要把这些流量都集中在自己身上，然后通过视频、直播、文案，直接变现了。


    谁越早布局自己的个人的品牌，对谁就越有利。'
  merge: -1
  img_proc: true
- pgno: 259
  md: '管理者的目的，是动用所有人的智慧、力 去完成一件事。粉丝的力量、社群的力 ，就是动用所有人的智慧去完成一件事。这是这个时代的老板要做的事。管理者，绝对不是孤军奋战的人。一个人的力
    是有限的，群体智慧才能做大做强。这就是社群营销的优势。


    要谦虚谨慎，要知道运用群体的智慧 社群的智慧。聪明人很多，牛人很多。您以为您聪明吗？智者千虑必有一失，您不考虑大家的智慧，不利用所有人的智慧，您办事就不行。别瞧不起别人，愚者千虑必有一得，就算别人蠢，别人也会提供一些有价值的建议，何况别人也并非愚者。要利用所有人的智慧，就要谦虚，就要知道群体的力
    智慧很强大，这样，我们办事的成功可能性就大增了。


    我为什么要搞陈昌文方法之-活动营销、群体营销？就是让所有人参与到视频营销 直播营销当中来。作为一个管理者，互联网现代管理者，我们必须经营好社群，做好社群品牌优势，然后动用整个社群的力
    智慧，去维护、宣传品牌。这样，整个社群品牌越强大，影响力增加，利润就更能增加。我本人的一切目的，也都是为做社群品牌而努力，这样方便群里做项目的人更多的收单子。


    我们要做的，就是打造一个群体品牌、群体活动营销。搞蚂蚁战术、人海战术，多个视频、直播、讲师传播。我们是专业搞精准粉丝的，当然，做品牌影响力的时候，我们也可以搞搞泛粉丝。我要做的'
  merge: -1
  img_proc: true
- pgno: 260
  md: '是什么？我要做的就是传播国学、儒家思想、陈昌文方法、社群营销，打造老板社群，不断地升级定位企业家、老板这个群体。然后不断地通过人海战术、社群、短视频、直播、讲师去影响整个市场。这就是做社群的方法。您可以做出一个指数级的企业、组织。


    指数型组织的一个特征是要提出一个宏大的目标，极其宏大，比如，要把儒家思想传播给十亿人，这就是一个宏大的目标，然后边际成本要为零，或者趋近于零。成本大的生意，都不是好生意。人的一生，只应该有，且只有一个成功的事业，这样，顺心、舒服，还能做大做强。少则得，多则惑。而贩卖信息，是这个世界上最赚钱的生意。牛人务虚，平凡人务实。


    人一辈子，要为社会做点真正有用的事情，这样才有真正的名声传诸后世。如果没有做点真正有用的事情，即便是有名声，也是假的，过眼云烟，对社会没什么好处。不要弄虚名，而要做实事，这样才有真名。真正为社会做贡献，为人民做贡献的人才会有真名。真正的名气与沽名钓誉、巧设计谋来的名声是不一样的。人要真正去干实际的事情，对社会，对人民真正有意义，有帮助的事情。这样的名声传播开来才稳健、稳定、有益。您心态错了，努力的方向错了，为了名声而名声，只干名气的事情，而没实际的东西，可能您这辈子就白活了。


    一个君子，一定是要名气的。无名，则自己的观点、想法不能付'
  merge: -1
  img_proc: true
- pgno: 261
  md: '诸于世。名声、名利都是您的资源，都是您的法宝、公器，您需要这个东西。这样，您才能更好地为社会做贡献。那些说一点名声也不要的人，其实也是一无是处、没什么用的人。


    名气就是人气，就是财气，这个很重要。社群时代，做名气更加容易。


    # ## 7.5 事业的发展，很大程度上是格局问题，内生资源的利用问题


    事业的发展，很大程度上是格局问题、内生资源的利用问题。社会很美好，做不好找自己的问题。多支持、帮助我们的既有朋友。


    既有的资源利用好；既有的朋友们，给他们饭吃；组织内部的人，要让他们发财，则您的事业自然大了。教育他们对您有好处。一旦有几个人跟您混了，您还做不好自己的事业，就是自己缺德了，自己无能了。几个人就可以打天下，刘关张以及某人的十八罗汉都是这个意思。您身边有几个人，您就用几个人，团队很重要，团队的力量是无穷的，而个人的力量实在太有限了。想要做成大事，还是建议培养一'
  merge: -1
  img_proc: true
- pgno: 262
  md: '个身边的团队，毕竟可以替代您很多工作。但是最有效、高质量的工作，还得您亲自下手。


    格局问题，就是希望所有接触到自己的人好，能利用自己的资源发财；辐射更多的人，帮他们发财，赚钱，提升生命能量，就会对自己有好处。格局要大，要知道别人的付出。


    您必须考虑别人的成功，您必须考虑别人赚钱，您多为别人考虑，别人成功了，赚钱了，您也就成功、赚钱了。商业的目的是帮助别人，不是割韭菜，坑人。我们有些人的思维是割韭菜，坑人，这人心坏了，着实悲哀。


    用人的标准是这人能干事，能把事情办成，而不是自己喜欢，不喜欢。此人说得好，我们就采纳，即便他是我们的仇人，我们也采纳其意见。我们只管事情是对的，我们要的是把事情做对，而不是跟人闹情绪，不要憎恨您的仇人，那将影响您的判断力。


    一个人讲得好，拍马屁厉害，这个人没什么实际本事，我们也不用。不要只会照顾自己的耳朵好听，要照顾事情的发展，事情真能办好，耳朵不好听也行。一切以道义、真理为标准。一切以能办事为标准。李世民还不爽魏征呢，结果魏征给他出了很多好的建议。


    管理者是办事高手，一切目的是把事情办成，并非自己的好恶，这是微不足道、也不重要的。事情成了，管理者有了成就，有了成绩，有了回报，这才是最应该开心的。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '人才是组织发展的核心关键点，发动每个人为组织举荐优秀贤能的人才，为组织招兵买马。组织的管理者第一要务，就是不断地找到贤能的人才，吸引贤能的人才加入。


    管理者的任务，不仅仅是做业绩，做好自己的业绩，更重要的是要不断地为组织招兵买马，让优秀的人进入组织，为组织做事，提拔培养这些人。这些人看似跟您无关，其实当他们发展好了，您的势能就更大了。


    人才比什么都重要，要搞清楚什么是人才。有业绩，有德行，就是人才，缺一不可，要让人才在关键岗位上，做榜样，带着大家发财。必须论功行赏。必须按照规律办事，就是要有人才。没人才，什么也不是。不论功行赏，滥赏，滥罚，也是愚蠢的行为。每个人按贡献梯次排列。贡献是多方面的综合。


    清静无为，看清楚每个人的贡献，给出对应的赏赐，这就是天道。要不断地鼓励人才，培养人才，招聘人才，这样，组织才会发展，才会牛B，否则，我们就是找死。人才排列顺序错误，则相当于五脏六腑排列顺序错误，人大概要死，组织大概要瘫痪。


    要让优秀的人处于关键岗位，不优秀的人要摘下来，不能占着关键位置不出活，这是对组织的极大伤害。优秀的人，要当仁不让的处于这个关键岗位。所谓优秀，就是业绩好、道德好、人品好。组织里'
  merge: -1
  img_proc: true
- pgno: 264
  md: '优秀的人必须要靠前排列，当仁不让。您有能力、优秀，您必须在这个位置，这是天道，这样整个组织才会变好。


    榜样的力量是无穷的，大家要争做榜样，要把自己变成榜样。谁做得好，我们也要给谁更多的资源倾斜，让他做得更好。这就是组织管理的重中之重。要学会借力，要学会知道自己的能力边界。搞定自己能搞定的事情，自己搞不定的事情，不要强行出头。要理解团队的力量。大家一起干，才能赚大钱。要做这个动作。自己搞不定的事情，让能人去搞定，不要乱说话。知道的，就是知道；不知道的，就是不知道。


    管理者的主要工作，是容人，用人，知人善任。用好内生资源。


    每个人都有每个人的用处。有度量，才能用好人。没有度量，看谁都不顺眼，就用不好人了。组织发展，必须要很多人才齐心协力。


    君子是用来当领导的。气量狭小的人，不能在关键岗位上工作。只有有气量的牛人，才可以放到领导岗位。一般小人，就做点具体的小事就行了。


    运用计谋，收拢人心。想要收拢人心，是必须计谋的，必须有策略的，必须有利益的，什么也没有，想收拢人心，就是痴人说梦。


    老板的核心特征是识别人。要看对人，看准人。此人值钱不值钱？值多少？不要乱开价。有的人不值钱，毫不值钱，您给多了，就亏。有的人非常值钱，您给少了，就失去了。当然，真正的高手投资自己。'
  merge: -1
  img_proc: true
- pgno: 265
  md: '企业家、组织者，有的权利是不能分享出去的。最高、最重要的权利，必须由企业家、组织者本身去决定，否则，大权旁落，这个企业就要衰退了。有的事情，必须您自己做主，您要是不做主，这个企业就要死亡。不要以为什么都可以依靠别人，**最高权利的礼乐征伐，必须是您自己去完成。这不，某企业家这次就在上演大权旁落的笑话，**大家都在吃瓜呢。


    领导人的四层境界：


    第一层境界是搞营销，营销搞得定，就能赚钱生存。


    第二层境界是搞管理，要理解团队的力量是无穷的，团队大了，组织牛Ｂ了，自然赚钱多。


    第三层境界是调理自己的心性，自己的心性好了，一切都顺利了，管理营销自动行驶。


    第四层境界是调理跟随者的心性。达摩祖师调理二祖慧可，将心来，吾与汝安。这是最高境界的领导人，也就是安心培养领导人。若您周围有几个被您调理出来的慧可，则您大概基业万世长青。


    您在第几重境界上？'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# 7.6 领导力的核心标准，就是忠、信、敬


    忠，什么是忠，谈到这个字，我们不是要求别人忠诚我们，而是要求我们忠诚别人。忠诚上司、下属，成就他们，就是忠诚。何为成就他们？就是让他们身心健康，赚钱，安身立命。也就是人啊，一定要让别人过得好，就是忠诚。


    对人言语，要真正的忠诚，真正的帮人办事，提升人的道德境界、赚钱的能力。而不是有私心，故意误导别人，这种人，就坏透彻了。我们搞儒家思想、陈昌文方法72大营销系统，是毫无私心的，一切只为了帮助人提升道德素质，以及赚钱的能力。我们所有人，绝对不允许对人不忠诚，如有二心，则不开口，这叫言思忠。


    信，我们做人要讲信用，为什么？因为您骗别人，别人不信您了，您以后说啥都没用了，没人愿意跟一个谎话连篇的人合作。所以骗子的本质是愚蠢，断掉自己的福报。'
  merge: -1
  img_proc: true
- pgno: 267
  md: '敬，敬天爱人，要尊敬每一个人。孝敬父母，尊敬组织内部成员，尊敬外部客户。您不尊敬别人，别人就不尊敬您，弄的您很难堪，生意也做不好了。敬事，把事情做好。尊敬是一个人起码的修养，也应该修炼彻底，对人要有礼数，对事情要有敬意，才能彻底做好。领导力是要求自己敬，不是要求别人敬。您敬了，您周围的人就敬您，有样学样，组织就干好了。真心为客户着想，为跟随者着想，则业绩自然增长。


    要对人有好处，没好处，谁跟您干？所以，我们天天想的，都是我们的跟随者有什么好处，客户有什么好处。有好处，别人自然赴汤蹈火。没好处，算了吧。别自己骗自己了。别讲什么情感，没有情感啊，只有好处。情感也是好处的一部分而已。天下熙熙，皆为利来，天下攘攘，皆为利往。这或许是宇宙法则。不要一厢情愿。给人好处吧。


    要教育跟随者安身立命，教他们修心的本事，也就是学习儒家思想、国学的本事；然后教他们安身立命的本事，也就是学习陈昌文方法，学习营销，赚钱出单的本事。一手抓精神，一手抓物质，两手都要抓，两手都要硬。


    没有谁欠我们的，我们做不好事业，管理不好团队，是我们自己的德行不够。要理解自己缺德，这样，就能找出自己很多不足，不断地修正。对别人没要求，零要求，自己的智力就会得到提升，在社会中，就会获得进步。否则，您会倒退。无论何时，我们都应该尽可能'
  merge: -1
  img_proc: true
- pgno: 268
  md: '地修炼自己。如果您跟谁有矛盾，或者感觉事业要下滑了，这个时候，您只需要去修身，去调理自己的德行，抓住身边的小事干起来就行了。慢慢的，您会发现您的事业开始好转。


    有人辱骂您，不要去抱怨辱骂您的人，而是要高要求自己，修正自己的行为。如果您的思维还停留在有人谩骂您，您就受不了。或者改变了自己的主意，那么您还不是一个成年人，或者说，您的智力较低，在被人收智商税。一个高智力的人，只权衡利弊，比权衡力，而不是活在别人的嘴里。一般人的发言，都是愚蠢的，他们的发言只是满足自己的私欲而已。


    不赚钱，赚钱少，不要抱怨员工不给力，下属不给力，而要思考自己的策略、方向、定位等等是不是有问题。您要想的是如何分钱，如何驱动他们？甚至如何换掉他们，而不是抱怨。高手永远在想策略，调整策略，而不是抱怨。当然，我说的是实在不行，这个人实在不行才换掉。一般情况下，还是找自己的问题。走，是迫不得已的最后一计。所谓，36计走为上计。


    总之，问题百分百在自己身上，跟其他人无关。一旦您养成了这个习惯，您的进步就会神速了。一旦您养成了抱怨别人，找别人问题的习惯，抱歉，您不仅仅不会进步，连现在仅有的成果也会流逝。比如，您谈了一个女朋友，她天天坑您钱，也不爱您。您还跟她在一起，'
  merge: -1
  img_proc: true
- pgno: 269
  md: '追求她，本质是您自己眼光、判断力出了问题，您应该放弃。您自己脑残了，却怪另一个脑子不好使、家教不好的人，这是您的愚蠢。认为别人错了，抱怨别人的人都是蠢货。


    知错就改，善莫大焉。有了错误，一定要改，不要长时间不改，会对身体，对事业，对人际关系，造成巨大损失。很多错误，都是小错误导致的，都是因为容忍更小的错误，最后酿成大错，让我们不可收拾。能立刻改正自己错误的人，都是高人，都是圣贤。改了，就记住，以后争取不犯错。为什么说是争取？人有惯性，还会犯错的。犯错过后，继续改，总之，我们就是要不断地改正错误。


    有人指出您的错误，您不要暴跳如雷。对于组织内部，我们就是要指出错误，然后不断地改正。一个不上档次的人，我们根本没有精力去指出他的错误。我们指出错误的人，都是我们的关键人物，我们才有心情去跟他说道几句。所以，要珍惜说您错误的人。这样，我们整个组织才会更优秀。


    人生有逆境，要想想，自己为什么进入了逆境，哪里做错了？然后想想自己为什么以前在顺境，捡起来顺境的时候的做法，继续做，慢慢的又会进入顺境。人生不可能一帆风顺，要接受失败，然后在这个基础上，继续努力，不怨天不尤人，踏踏实实下苦功夫，一切都会好起来。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '我们要做的，就是要求自己变得优秀，找自己的问题，我们永不抱怨，不怪罪任何人。我们自己没钱，就是因为我们没做对事情。我们调整一下自己做的事情，永远要认为是自己的错误，这样人才会进步。己所不欲勿施于人，己欲立而立人，己欲达而达人。人要考虑到这个世界上有很多人，您人好了，您的团队就大了。对我个人来讲，我的网络团队非常之大，我能发掘出这些人的力量，全靠我还有点德行。德行好，能力强，发掘出的力量就多。否则，力量就很少。


    提升自己的德行，提升自己的能力，让所有人都奋斗，都赚钱。每天都要开内部会议，让更聪明的人奋斗、战斗。


    努力做好现在的事情，改变不了的接受、随缘。改变能改变的事情，好好做，不要对任何人不满意，不要抱怨、怨恨任何人，好好对待任何人。任何真心实意跟着我们结缘的人，好好对待。自己的小组织里的每个人都照顾好了，则您自然强大；自己的小组织里的人都照顾不好，成天想着攻击其他人，没有用的。变得强大不是去找外面的人过不去，也不是吞并谁，而是现在的组织、企业内部您有没有做好？您照顾好了您的铁杆跟随者，您的事业自然大了。根本不用到外面去跟谁争抢。而且外面的人也自然服气了。


    人要修的是文德。所谓文德，就是要让别人从道德上、从文化上服气您。道德、文化好了，让人服气了，别人自然跟随您，而不是武力、暴力征服别人。'
  merge: -1
  img_proc: true
- pgno: 271
  md: '多修德，团队自然就管理好了，组织业绩就起来了。没事就修德，有事就修德，修德就进业。玄妙吗？一点也不玄妙，等您有了经验，您就知道老祖宗说的真对，我现在只按老祖宗说的办。我的一切行为处事方式都按老祖宗说的办，我只学国学，用国学，传播国学，一切答案找老祖宗要，执行老祖宗的智慧、策略。则想要啥，都会来。


    无论是《道德经》《黄帝内经》，儒家思想，都是要求我们多观照自己，而不是成天关心别人，眼睛盯着别人身上的不是。只要盯着自己，安抚好了自己，修炼好了自己，则组织、天下就治理好了。从这个角度来讲，修齐治平，您才能理解。您也能理解，治大国若烹小鲜，是什么意思了，否则，您很难理解这几句话的真实威力。


    人生是有顺序的，有了仁德，性命自然无忧。要是没有仁德，即便是现在活得好好的，哪天可能就活不好了。天天读国学，修习儒家思想，即便是自己有些错误的思想、心思，慢慢的都会修正到正路上来。阅读国学，修习《论语》等书籍，是让人走向正道。人的坏心思多了，命运也就会变得越来越坏，在利益面前，人往往会选择破坏仁德。而天天修习国学、老祖宗的智慧，会让您心变好，不去干坏事，这样，您的命运就会越来越好。在这个时代，想要有一个好的个人品牌，您就必须要有仁德的标签。没有谁愿意跟一个没有仁德的人交流。大家都喜欢道德素质高的人，这就是各位的人设。


    但是在经商的时候，您觉得您支持别人，您有情有义，这可能只'
  merge: -1
  img_proc: true
- pgno: 272
  md: '会感动您自己，别人可不这样想。别人觉得就是个生意，他就是不断地诓骗您，赚您的钱而已。您讲仁义道德，他讲杀猪宰羊而已。所以，仁义道德这种事情，在实践的过程中，难度是极大的，我们需要不断地筛选真正的仁义道德的人跟我们合作，而不是见到一个人就仁义道德。不是多次博弈的，我们不参与。我们有能力的人，一开始就要掂量对方配不配，否则，往往都是坑，如果您交往了配不上您的人，大概率您要吃亏了。


    践行仁义道德，只讲仁义道德。在这个过程中也要学会保护自己，坚决不接触蠢人。学习儒家思想、正能量的思想，会导致人没有保护自己的意识。我们必须保护好自己。我们必须隔离一些不对的人。在对的人、懂道理的人之间，进行仁义道德宣传、教育与福泽。天天只想着做好事，积德行善，其他的别管。如果没事做，我们就去积德行善，可以直播，可以文案，可以发朋友圈，可以搞流量、变现，目的都是积德行善。一个人，只要行得正，坐得端，思想正，这个人就会拥有他该拥有的。


    中国传统文化经典，谁学懂了，去执行，就知道威力极其巨大。无论是管理，还是修身，还是养生，威力都是极其巨大的。《黄帝内经》《道德经》《论语》这些东西，不仅仅是管理学、经济学，也是兵法，更是养生学。


    我喜欢古文，而且我要多读国学，这对头脑清醒有很大帮助，远'
  merge: -1
  img_proc: true
- pgno: 273
  md: '远胜过现代很多看似厉害的书藉。不过现代有些书藉，理论确实也是业的，比如创业类的专业书籍对我影响也很大。有一定阅历的人，才能理解智力与知识的重要性。


    # 7.7 陈文昌内部讲话：一切精力都用来管理自己


    一切精力都用来管理自己。我们所有人的经历不是用来管理别人的，而是用来管理自己的。你周围的人根本不用去管理他。我刚做老板的时候，我是不明白的，我老是给他们开会，老是去培训他们。我现在才明白，这个是没有意义的，这是纯粹浪费自己的时间。送你们一句很厉害的话，叫做一切没有价值的人，你都不要跟他相处一秒钟。他有没有价值是他的事情，你有没有价值是你的事情。把这句话琢磨透彻，那么你就进步了。


    一个没有价值的人，不要跟他相处一秒钟。


    儒家思想的很多观点、价值观都是用来修正自己，反思自己，思考自己，管理自己的。儒家思想并不是让我们去管理别人，所以我们'
  merge: -1
  img_proc: true
- pgno: 274
  md: '讲修身、齐家、治国平天下。正心诚意，格物致知，先正自己的心，就能正自己的身。正心诚意，你只是天天说，不去做，没有意义。你不去搞营销，不去发广告，没有意义。你不搞流量，不搞变现，也不更朋友圈，也不跟客户聊天，谈论我们营销的是什么玩意儿，那这都是没有意义的。所以说首先心要正。


    你干什么的，你干什么业务的，你就去把它干好。你是不是诚意干这个项目的？什么叫格物？格物就是搞好这些道理，搞好你要做的具体的术。格物是一个落地的东西，你首先要落地，而不是飘在天上的。什么叫落地？我的广告图片发了没有？我跟客户有没有聊我们的业务？直播有没有聊我们的业务？视频有没有引导性的潜意识营销、媒婆营销聊我们的业务？就叫格物。


    你不做具体的事情就格不了物。你在格什么，我不知道你在格什么，你没有格物，你在浪费时间。


    格了物之后，你的那些知识才会变得有用。如果你不去实践，不去做这个具体的营销，不去产生实际的效果，你致不了知，当然你也修不了身。你都不知道你在干啥，你修什么身呢，修身首先是要知道你干啥。


    修身不是说我就要修身，道德仁义不是说我道德仁义。道德仁义和修身，本质上是你做事的过程当中干出来的，它是一种结果的体现，而不是一种玄谈。你读那么多书，你有什么用呢？因为读书不是'
  merge: -1
  img_proc: true
- pgno: 275
  md: '实践，实践才有用。你读了很多书，既不会管理，你也不会外交，那你纯粹是扯淡。


    你在我们群里学习儒家思想，学习陈昌文方法，你搞不到流量，每天都不出单子，那你纯粹就是扯淡。就是你既不诚意，也不正心。既不格物，也不致知，也没有修身。


    修身，它是一种结果，它是一种实际行动的体现，才叫修身。如果你没有实际行动的体现，就像我们追女朋友一样，我们要去追，这是一种实际行动的体现。你发了什么短信给这个女生？你跟这个女生说了什么？你是不是去请这个女生吃饭，看电影了？这是一种行动，而不是坐在凳子上意淫我要是跟这个女生在一起该多好，这叫意淫。听课，如果你不去行动，也是一种意淫。


    所以你们对照一下自己，你是不是流量做到微信里面了？是不是在做直播营销、视频营销？


    其身正，身正不正？身正就是我行动没行动。儒家思想只考虑自己行动，不要去管别人行动不行动。


    唐僧去西天取经，他没有说我也不会腾云驾雾啊，我没有盘缠啊，这么远啊，怎么去啊，我又没有白龙马。又没有孙悟空给他化缘啊，又没有沙和尚给他挑担啊，我怎么去啊。唐僧有没有这些人，他都能取到经；唐僧有没有孙悟空、猪八戒、白龙马、沙和尚，他都能取到经。


    唐僧要管自己，而不是说我没有这些人怎么办。你向前走，就会'
  merge: -1
  img_proc: true
- pgno: 276
  md: '有这些人。


    穷人认为我之所以没有抱负，是因为我没有第一桶金，他们天天谈论说我要是有一百万，我就能赚到一千万。我要是有一千万，我就能赚到一亿。他们以为他们缺的是第一桶金。并不是。他们并没有管理好自己，就是没有修身，没有智慧，没有行动，没有身体力行。一百万是你身体力行来的，并不是你有了一百万就能干啥，我告诉你，你有了一百万，你以为就会有一千万吗？如果你的理财能力有那么强，王健林都跟你混，王健林直接给你一百个亿，你搞吧，你给我搞一千个亿出来。


    所以网上那些概念，包括抖音里很多概念都是错的，那些都是穷人的意淫。他们以为有了一百万，就会有一千万。有些人以为有了一千万，就会有一个亿。我告诉你，不会的。你可能有了一百万会倒霉，你可能有了一千万会倒霉，并不是你会有一亿。你可能这一辈子就只能在一千万混，就只能在五百万左右混。


    其身正，不令而行，你要去向何方，这是你管好你自己。你周围的，你不要去管他。有几个原因我等会讲，为什么不用去管他啊。其身不正，虽令不从。你自己都做不好，你让别人去做，别人不会听你的，别人会鄙视你，嘲笑你。而且你本来就不应该去管别人，因为这个社会是分层级的，我们并不是看不起掏大粪的，但是我们去掏。城市，'
  merge: -1
  img_proc: true
- pgno: 277
  md: '它是需要掏大粪的。比如说像上海这种城市，下水道里面一定有人在掏大粪。但是你去掏，我不去。这个社会是有层级结构的人，上海这座城市，一定有人在卖菜，但你去卖，我不去卖。我不做这个生意。


    你有多优秀，你就对应在哪阶层，去跟对应的阶层的人混，去跟对应阶层的人说话。因为你选择了成为这个阶层的人，这个阶层的人也选择跟你沟通。那么为什么有些人混得很惨呢？也是因为不懂这个道理，有些人能力很强，但是他带来很多拖油瓶，这句话是你们很多人身上的毛病，但很多人一辈子都解决不了这个问题。人到了一定的阶层，他就是必须得换朋友，他就是必须得把以前的一些不好的东西给丢掉。但这个也是矛盾的，跟我前面讲的这个儒家思想。就是你发现这个家伙是个拖油瓶，你就把他去掉了。


    当然我们也讲了，人是要用旧人的。比如说我们尽可能用旧人，但是我们要发现无关的拖油瓶，我们一定把他搞掉。儒家思想是不会要求你拿着圣人的标准去量别人，而是观察自己，你自己做好了，你下的命令，别人才会听你的。所以榜样的力量是无穷的，案例的力量是无穷的。


    人是模仿的动物，在下位的模仿在上位的，低阶层模仿高阶层。你的目标是让别人模仿你，而不是去命令别人。要命令别人，首先命令自己，管理好自己，大家就跟着你做。'
  merge: -1
  img_proc: true
- pgno: 278
  md: '真正的高手，是把精力投射到自己身上。因为改变自己很容易，我要站起来就可以站起来，我要坐下就可以坐下，我要去睡觉就可以去睡觉，我要去干活就可以去干活。


    你想要去管别人是特别难的，别人是不会改变的，而且别人也不会听你的。每个人都有自己的价值观和想法。所以你会发现，你去改变别人，往往是徒劳无功，最后惹得一肚子气。如果你是当老板的，你天天给他们发工资，天天去教他们，最后你也是一肚子气。员工也会当你是傻子。


    做公司也是管理自己，这个员工他值多少钱，你就给他对应的多少工资，就完事了。你不要去教他，因为学习是他自己的事情。


    一个人自己不想学，我是不教的。这也是儒家思想。儒家思想教人是怎么教的？你自己不发奋图强，我是不帮你的，这是儒家思想的讲法。你自己不努力，我是不帮你的，你自己努力到极限了，你来找我，我才会帮你，这是儒家思想的教学方法。


    社会是分很多层级的，你有多优秀，你到了那个层面，跟对应的人交往，你的世界就变了。管理的本质是管理自己，不是管理别人，别人跟你无关，任何人都跟你无关。


    很多话都是矛盾的，既矛盾，也统一。你们要学会在我的课堂上去琢磨这些事情。你做好了，自然有对应的人来配合你。如果你管理不好自己，还想管理别人，别人不会信任你。即便是表面上服从，迫'
  merge: -1
  img_proc: true
- pgno: 279
  md: '于你给他发工资，迫于你成天在他面前唠叨，他可能表面上会顺从你，但实际上他内心也不会顺从。这句话叫做其身正，不令而行；其身不正，虽令不从。


    # 7.8 陈昌文内部讲话：变的东西都是枝叶，所以我们玩核心


    我们现在要做的是品牌营销，什么是品牌？“陈昌文”这三个字，这是我们社群的品牌。陈昌文老板社群和陈昌文方法是品牌，讲儒家思想是品牌。“陈昌文”跟我是没有关系的，就像蜘蛛侠跟蜘蛛侠的扮演者是没有关系的，它就是一个品牌。它是抽象的。这是我们大家
    的品牌，您去卖这个东西就行了。那么以后我会出很多图片和视频文案，包括书籍也是为了建立“陈昌文”品牌，这是我们的品牌形象。


    贩卖这个品牌，贩卖就是我们的工作。您要告诉粉丝，这就是我们的品牌。为什么要说它是一个品牌？为什么要去建立这个品牌？就是为了卖得好、卖得多、卖得值、卖得快，卖得有信任感。'
  merge: -1
