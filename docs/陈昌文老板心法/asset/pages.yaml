  md: '你才会真正开始赚到钱，你才会真正进入成功的模式。


    赚钱啊，成不成功，首先不是考虑的钱，就是考虑我跟你们说的这些东西。


    我们的讲师一定要天天讲做人，讲做人就讲我们这个六脉神剑，我们这几个关键词，感恩、老实、虔诚、尊师重道。这个美德要是学会了，我们的项目自然就做好了。项目做不好，是因为大家身上没有美德。君子黄中通理，正位居体，美在其中，而畅于四支，发于事业。内在的美德修到位了，你做事就不毛躁了。你自然该知道干啥了。内在的美德，这是我们社群每个人要去修的，也是我们讲师要多讲的。


    李嘉诚说他的大部分时间是在教他的子女、儿子做人，并不是教他的儿子经商。经商只是枝叶，会做人了，钱自然而来，人情才是大学问。人情，李嘉诚讲的人情，商业根本就不算啥，人情才是大学问。人情世故。


    人情，就是你会不会做人。你会做人，你就有人情；你不会做人，就没有人情。做买卖，卖人情才是高手。你们有没有把人情卖出去。（学员在线问：人好心，才会有财是吗？）是的，人善良，才有财运。所有不赚钱的人，都是不善之人。人善良就自然有慧根。所有收入低的人，都是不会做人，都是歹毒之人，你自然就没有财。


    西方有一句话叫做靠近上帝的人，才会有钱。越富有的人，越靠'
