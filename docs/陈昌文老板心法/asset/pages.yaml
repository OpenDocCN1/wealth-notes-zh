    天的就特别的惨！所以为什么要奋斗？因为没有人帮你奋斗。


    所以你必须得按时按量的去完成自己的工作，而且你必须强迫自己去工作，然后说我喜欢工作。人没有压力就轻飘飘的，所以要给自己找一些压力。然后这个工作计划是每个小时，或者每半个小时，不是一天工作计划，也不是一个月，也不是一年。凡事计划一天要干啥的人，基本上都是等拖拉的废物。你不会去干的。是不是？计划一周工作计划的人，基本上都是超级大废物了，你100%不干了。计划一'
