  md: '能赚钱的人，您教给他一些方法，有用。不能赚钱的人，您教了也没用。所有东西，搞清楚，做个明白人，远离人渣，这就是最基本的人生哲学。不过要领悟到这一层的人，难上加难。能活到这个层面的人，年收入至少过了500万，管理过百人以上的团队了。人能分得清楚什么是值钱的，什么是贱货，就差不多是一个合格的、理智的商人了。人能知道该与谁交往，该与谁断绝，差不多就快靠近君子了。宿命是人知道差距后，而不努力去改变。没有几个人会用他们的大脑。也没几个人愿意听话，他们都喜欢混日子。


