  md: '想要身福贵，需下死功夫。


    对于我们做营销来讲，我们是怎么干的？朋友圈、图片、广告视频、直播，天天去干。传播儒家思想、陈昌文方法。这玩意可以干一辈子，干到你的后代都可以干，一直干。


    儒家思想是讲究过程的，儒家思想里面讲追求结果是错误的，追求过程是对的，这也是佛学当中讲的君子是重因的，小人才重果，所以我们以后不要追求结果了，我们要追求每时每刻在干啥。不要结果导向了，不要结果思维了，结果是衡量我们成绩的东西，但它不是我们应该关注的。我们分每秒在干什么？过程干好了，自然有结果，以始为终。


