  md: '的离开。您想整死别人，别人就想整死您，您老是整别人，别人就不带您玩了。这是自然规律。最后，他周围就剩下跟他一样无能的人。越是厉害的人，越知道回报对他好的人。知恩图报，感恩，这是一个

