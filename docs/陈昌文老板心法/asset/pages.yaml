- pgno: 18
  md: '群里的正能量的东西就行了。


    **感恩、真诚、诚恳，也是需要一定能量等级的。您这个能量等级不够，您这颗心就顺不了，您这颗心就安静不下来。心跟心交，钱跟钱交。**您跟我交心？还是跟我交钱？跟我交易？还是跟我交谈？都是有讲究的，不一样的。比如，进陈吕文老板社群，不是我来服务您的，是您来服务社群的，您来为社群释放能量的。您是不是高人？您能不能加持社群？不是说到社群交费了，你们来服务我。我不服务您的。是您厉害，才有资格到我们这里来，跟一群高能量的人在一起相互加持，而不是我要服务您。


    您是佛，才到我们这里来，叫万佛朝宗。您是高人，才到我们群里来；您是牛人，才到我们这里来。不是说您是个能量极低的阴寒之人，我来服务您。我不与您链接的。


    您是什么角色？您是神，您就进到我们这个圈子里，我们神交；您是仙，您就进到我们这个圈子里，我们仙交；您是圣人，我们就圣交；您是君子，我们就君交；您是贤人，我们就贤交。您是阴人，您不要跟我们交，因为杂交过后品种不好，对吧？


    所以营销观念要讲明白，您这一辈子就会顺得不得了。您赚钱也顺，做事也顺，顺得不得了。您把这个用到谈情说爱当中，您交到的人都会特别的好。这个需要智慧，不要老是自我感动。拒绝某些人的钱，'
