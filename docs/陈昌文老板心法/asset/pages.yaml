- pgno: 41
  md: '成了自己都很讨厌又看不起的人。我们在不断地推翻自己，可惜我们老了。您必须理解，这社会是有歹毒的人。人们只教善良面，却不教人这世界上有歹毒的人。这坑害了很多，让很多人吃了大亏。这节课，社会不上，学校不教，父母也不教，这是最大的恶。不教人战，就送上战场，是为不仁。这社会，就是战场。我们不懂，所以我们损失，无论是人际关系，还是生意，都是因为我们不懂。我们不懂，就被社会猎杀，我们懂了，我们不想去猎杀别人，只求不亏。


    您坑过的，都是爱您的人，您爱过的，都是坑您的人。常人只知道明显的生死，岂能知道，这世界上，让人生死的方法有八万四千那么多？经历多了，您就会发现，很多人是不可靠的。特别是当您生活在社会底层的时候，您会发现，很多人是不可靠的。不要相信别人，只有当您的层次高点的时候，那个阶层的信用才是可靠的。从底层爬起来的孩于，最可怜的是什么？就是他们已经经历过了世界的恶，然后慢慢才能品味到世界的善。


    善良的人，应该防范这个世界，您无限制的对一个人好，这个人就不会把您当人看，就会侮辱您，就会骂您。您要保存您的爱，让他们去争取，他们就明白了，他们并没有那么值钱，他们其实根本就活不好。您不要无条件地帮助某些人。某些人，不值得帮。很多人没本事，还恶毒，他们靠着恶毒坑善良的人。善良的人要学习一些为人处世的规则，而且，不要去拯救那些人，放自己的血，没必要。自己的钱，'
  merge: -1
