  md: '自己没有承诺，你业绩有没有也无所谓，你这一辈子就什么都做不好了。这个是什么意思呢？**人的欲望比营销的能力更重要。营销能力很重要，但是人的欲望比营销能力更重要。强烈的欲望会让你干成很多事情，甚至你都不太需要学会营销，你有强烈的欲望，你一定要赚钱。一定要成交，一定要做好这件事情。那么这个东西比营销技巧更有用。营销的欲望，比营销的技巧更重要。**


    所以说这话再反过来讲一下，你这个人之所以不成功，实际上是因为你根本就不想成功，能理解吗？你赚不到钱，你很失败，不是说就是这个社会让你失败，而是你愿意接受，你无所谓，这个是失败的根源。你活在社会底层，或者你不满意的环境，你接受了。你接受有两种接受，一种还觉得蛮好的，就这样混。另一种就是说，假装我要改变，但实际上行为上是懒惰的。思想上假装自己想要努力，但实际上天天在休息。不要做这种人。


    马云有一次演讲，有一个记者问他，你们都知道这个故事，但是我还是要重复一下。有个记者问他，说马总你经历了这么多辛苦，这么拼搏，这么努力建立了阿里巴巴，你真是太厉害了，你真是太让我佩服了。创立阿里巴巴多辛苦多累，要多大的工作量，对不对？马云接过话筒笑了笑，回答他，我其实最佩服的是你。你这么穷，你什么都不能改变，几十年如一日，还愿意这样做，我挺佩服你的。马云说，熬那些很辛苦的日子一点都不难，因为我知道它会变好。我更佩服的是'
