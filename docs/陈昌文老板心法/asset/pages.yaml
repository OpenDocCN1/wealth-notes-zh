  md: '的事。时间应该用来社交，以及聊天，收单。钱，不过是每分每秒的时间换来的。要么您变现别人，要么别人变现您，要么把时间消费了，要么把时间换成钱。您的时间在干啥？痛苦
    发呆都毫无意义。您没有单子，您就去死磕，切记，您的人生，您自己负责，别哀嚎。比如，陈昌文老板社群里，有些人认 研，单子越来越多；有些人根本不把业务 回 ，结果越来越穷；有些人也不听课，什么都不懂，还想赚钱。一年过后，有些人年入几百万，甚至破千万。有些人，可是老太太过年，一年不如一年。


    不要依靠别人，师父领进门，靠自己专研就行了。要没有贪念，要自己研究，否则成本很大。其实，一个人习惯性碰到问题就问，然后问些很奇怪的问题，这些人，几句话我就知道他一辈子也别想赚钱，完全没有独立思考的能力，还是一个
    婴。做人，别像狗皮膏药一样，让人讨厌。做人，要自利利他。您去做自己的流量，赚自己的钱，不要去坑别人。但凡这个世界上成功的人，没有一个不是具有超常独立思考和思维能力的人。您对照下，就知道自己几斤几两了，莫怪他人，莫多怨气。自己不行，就是自己不行，与他人无关。除了刻苦专研，别无他法。这条路，任何人都别想逾越过去。越早行动，越好。否则，被动，难。'
