  md: '个事情抽离了过后，你就高冷了。这就是一个抽离开的品牌营销。找到感觉了？介绍营销是一个“介绍式”的营销，还有我们的品牌营销、媒婆营销和潜意识营销，它的力量是非常强大的。


    那么故事营销系统是怎么应用的呢？你们讲的小时候抓泥鳅，偷果子，这些故事都是没有价值的。


    故事营销系统。故事必须是结合我们的产品营销才有价值。故事也不是漫无目的的讲，每个故事都是有目标的，故事就是产品结构图，这个故事是不是我们要卖的产品结构图，这句话非常关键。我们的故事是一个一个的产品，我们的产品是什么？陈昌文老板社群、陈昌文老板读书会，其实是我们这个产品的结构图，你才能卖得好这个社群和读书会。你们要是学会了这样去讲故事，你不想赚钱都难。你们现在很多人的故事是乱讲，所以说这个内行看门道，外行看热闹，对吧，外行你怎么教，他都不懂。内行，你一说，他就知道该怎么做。


    有用的故事是什么。故事，是服务故事营销系统，就是说我们是做什么服务的，我们讲跟服务挂钩的故事。我们是做什么产品的，我们的产品是儒家思想、陈昌文七十二大营销系统，我们的产品是陈昌文老板社群。我们的产品是陈昌文老板读书会。我们还要讲我们社群故事营销系统，社群的故事，对吧，儒家思想的故事营销系统，陈昌文方法的故事营销系统，七十二大营销系统、恋爱宝典，我们讲的是这些故事。那么你的营销就会不胫而走，就会插上翅膀，就会如虎添翼。'
