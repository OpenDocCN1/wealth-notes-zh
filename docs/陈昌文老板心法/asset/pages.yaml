  md: '# ## 6.3 穷人用钱买没用的东西，富人用钱买资产


    越穷，消耗越大。越富，消耗越小。


    穷人用钱买没用的东西，消费了，就消费了，就没有了。富人的钱，是用来投资的，富人购买的是资产，资产产生现金流，是增值的。最重要的资产，是先进的思维模式。


    穷人喜欢买奢侈品，看了电视剧、电影，以买奢侈品为荣。奢侈品最大的消费者，就是这些无脑穷人。富人则不然，富人看这些喜欢买奢侈品的穷人，跟看白痴一样，不过继续洗脑他们，让他们的虚荣心大增，继续买这些毫无意义的奢侈品。富人头脑清醒，知道什么是应该买的，知道在什么时间点、资金应该投入到什么地方。到最后，实在是富得没办法了，不乱花，也不知道干啥了，乱花极少一部分资产去买点奢侈品。而穷人呢？从一开始，就把资金投入到虚荣心上面，把自己的未来都变成了奢侈品。一个小年轻，习惯性购买奢侈品，只能证明其智力低。现在有一群人，天天就知道旅游，大吃大喝，喜欢'
  merge: -1
  img_proc: true
- pgno: 223
  md: '享受，不知道工作、生产。说话冠冕堂皇的，以为自己多尊贵一样，这些人，年纪大了，一定会受到上天的惩罚。


    人有什么样的物质水平，就过什么样的生活。不要做坏事，不要过超越自己物质水平、经济能力的生活。


    穷人喜欢装富，穷大方，什么都要规格，需要面子。富人则不然，富人不该花的不花，甚至有点抠门。穷人认为奢侈品是好东西，几个月，甚至半年工资买一个包包。富人则不然，几百块的衣服都能穿，还蛮暖和。穷人虚荣，富人现实。穷人为莫名其妙的事情买单。富人，买的都是干货。富人节约，又努力工作。穷人铺张浪费，又喜欢浪费时间。智力与思维模式的差距，导致穷人越来越穷，富人越来越富。在穷人眼里，100
    块钱啥也干不了，他们只会计算 100 块钱能吃几顿饭。但在富人眼里，100 块钱可以变成 1000 块、10000 块，甚至更多。


    穷人根本搞不清楚，什么是资产，以为奢侈品、买的享受物品是资产。他们认为汽车这些东西，是他们的资产，他们的愚蠢让人崩溃。


    我有一个美女朋友，又想让她男朋友给她买保时捷。这种女人，以为买车是增加自己的资产，实际上，这种车，只会让她更穷，让她的男朋友更穷。这个女人，若是不靠这个保时捷赚钱，不能带来正向的现金流，此人就是可怕的负债。穷人挖空心思想增加负债，从而变得更穷。富人一心一意地增加自己的资产。穷人干现金流减少的事情，富人干现金流增加的事情。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '我本人也对标价高的东西没有一点兴趣。我知道 100 件中会有那么一两件配得上那个高价。但我是真没那个本事找出它们来。当然，对于我而言，也没那个必要去冒险，有的是物美价廉的好东西等着我们呢。价格是我们付出的，价值是我们得到的。我看重的是实际的价值，而不是炒作出来的价格。商业经营的本质，就是经营人们的语言系统。人们为这个语言系统而买单。


    需要提醒大家的是，勤俭节约绝对是美德，别被一些别有用心的人忽悠您提前消费。有一种穷人，相信花得多就赚得多，远离具有这种思想毒瘤的人。勤奋工作，节约，打造自己的资产，付费跟高手学习，才是最智慧的富人思维模式。别一听付费，就骂，这也是穷人的思维模式。


    穷人不知道什么交易对自己有利，也就是经常做些让自己贬值的交易。比如打游戏，看电影，喝酒，K 歌，本质上都是交易自己的时间、注意力、金钱。富人，每笔交易对自己都有利，比如，付费进入一些投资课程，学习一些先进的赚钱模式，读一本书，或者健身。每分每秒，都在做着交易。


    我接触过大手大脚花钱的人，那真是一个蠢人的行为模式。网络上充满了那种，我年轻，就是应该花钱，结婚了就好了一的言论。看着真叫人觉得惨不忍睹。当您彻底恶心这些贫穷思维言论、思维模式的'
