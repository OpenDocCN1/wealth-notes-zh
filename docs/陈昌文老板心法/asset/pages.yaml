- pgno: 22
  md: '价值观营销保证我们吸引到的是对应能量等级的人，就是这个人要正，要积极向上。有什么样的价值观，就会吸引到什么样的人，您坑蒙拐骗，您吸引到的都是具有坑蒙拐骗能量等级的人。您就会出事。下什么饵，钩什么鱼。比如，陈昌文老板读书会、陈昌文老板社群，也是价值观营销。您跟我们价值观是一样的吗？一样，您就来。我们讲儒家思想，您赞同吗？赞同，您就来；不赞同，不要来。这样召唤来的人就是对的人，这样召唤来的人全是大富大贵之人。相互加持，能量就越来越高，人生就会越来越美好。


    我们社群的个性要表述清楚。按照这个模式去做营销，它会自动传播。社群是有个性的，对人是有筛选的。人家没有见过这样的社群，因为一般的人都是见钱就收，我们不是见钱就收的。您不是见钱就收，才能收到更多的钱。您见钱就收，您收不到多少钱。这是真正的王道思想，是真正的用之则行，舍之则藏。柳下惠就是这样的人。我们也是这样的人。


    所以我们开口闭口只谈三观。营销的三观、儒家思想的三观、恋爱思想的三观。


    这个是不同能量等级的人讲话模式，能量等级低的人他理解不了什么叫一诺千金。理解不了用之则行，舍之则藏。古代有这样一些人，您托付给他一件事情，他要付出很大的代价，付出很多的时间，付出'
  merge: -1
