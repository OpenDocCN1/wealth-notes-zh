- pgno: 122
  md: '钱的重要性。一个人要经历一些人，才能理解什么是巧言令色。人是有内在，有外在的。不仅仅是外在，不要只看表面。劫过九重城关，我才明白，人是孤独的。靠自己，才是最牛B的。现在，我学会了只有自己，才靠谱。自己不靠谱，啥都不靠谱。赚钱最快的模式，不过是自己踏踏实实地活，然后与牛人合作分钱就完事了。现在这个社会，大家都在网络上搞粉丝，合作分钱了。还不会进入这个模式的人，已经落伍了。不识庐山真面目，只缘身在此山中。


    我们因为热情，学会了冷漠。冷漠其实是一种赚钱的方式，冷漠是理智行为，会让人更赚钱，且成本更低。而热情似火，往往伤人伤己，徒增烦恼，给自己增加难度，增加大家的交易成本。多愁善感，往往会让善良的人吃亏。商业上，很多大人物是蛮无情，且理智的，他们都是靠原则、规律做事，而不是盲目的热血。


