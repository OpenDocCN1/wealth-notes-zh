- pgno: 194
  md: '# 5.1 任何事，高手只为利益而奋斗


    如何才能成为牛 B 的人？成为成功的人？不要做没价值的事情。任何事，高手只为利益而奋斗。大多数人鄙视只为利益奋斗的人，于是，他们人生没了目标，玩游戏，看网页，变得越来越蠢。聪明人懂得一个道理，每时每刻，都是打造自己的自媒体账号，打造自己的团队，谈业务，不断地释放价值，粉丝越多，买单的人就越多。聪明人永远在搞营销。蠢人，浪费了自己的时间，然后堕落社会底层，还成天骂骂咧咧的。


    何为聪明人？聪明人都是时时刻刻在给自己干活。


    何为蠢人？蠢人就是他也知道他在干啥。


    聪明人，总是会不断地帮助他人，帮的人多了，别人就帮他。


    蠢人呢，总是在不断地得罪人，得罪的人多了，别人就联合起来搞他。所谓：“得道多助，失道寡助。”'
  merge: -1
  img_proc: true
- pgno: 195
  md: '高手追求的是卓越。也就是您真想赚钱，您追求的是卓越，您的时间要极限利用，然后，您就会收到复利效应。高手，永远在玩资源配置，自己有多少资源没关系，是看能整合多少资源，是看有多少资源可以被我们进行改编，进行贩卖。高手无需资源，但可以无中生生有很多资源。这就是我们
    36 循环系统的根基。


    高手，是避免失败，而不是追求成功。初级选手，才追求成功。巴菲特这种，《孙子兵法》这种思维模式，都是追求不败。以自己的不败，等待敌人的失败。从来主动追求成功。追求成功，就会有非常多疯狂的废动作，踏踏实实赚钱买房子的人，很多都比创业的人过得好。追求成功，是最大的陷阱。所谓，动辄得咎。


    什么样的人才时高手？解决大部分人想解决的问题的人，是高手；讲的东西是大家都想听的，是高手；写的东西是大家都想找的东西的人，是高手；大家喜闻乐见的东西，他天天谈，就是高手。所以，理解传播的核心要素，是大家喜乐见闻的东西的人，是高手。高手对一个人的看法很简单，谈一次，不行，就不再谈了。高手采取的是含弃策略，没有任何人值得珍惜，只珍惜对的人，这是高手的策略。


    高手，永远是学管理的。学了管理，带着一大帮人，才能赚大钱。高手，必须研究管理，互联网上人的管理、社群的管理、员工的管理、合作伙伴的管理。普通人，就研究一门技术，靠着一门技术发财就行'
  merge: -1
  img_proc: true
- pgno: 196
  md: '了。一门技术能让人小富，而管理能让人大富。最后，高手都一门心思的赚钱。金钱社会，赚钱才是最重要的。钱有了，啥都有了。当然，钱有了，就是生孩子最重要了。


    人与人的区别非常大。高手的思维非常牛B，我们要结交高人，然后听话照做执行。这就是我领悟到的无上道理。


    # ## 5.2 高手关心的是现金流入


    高手关心自己的现金如何扔出去，变成更多的现金回来。低手，则只是不断地保护自己的现金，不敢扔出去，不过是慢慢用，但是用着用着，就没了。富人喜欢一定要竭尽全力地让现金流进来。穷人则无所谓，每当月底，穷人发现现金枯竭，等着下一次工资，或者收入。穷人因为不在意自己的现金流入，也不会开发一些现金流入，所以只能终身贫穷。最怕的是，穷，又穷，又不愿意学习。丑，又丑，又有主见。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '高手不是太关心自己到底有多少虚幻的资产，而是关心自己的现金是不是进来了。


    什么是资产？能给自己带来现金收入的是资产。


    什么是负债？钱出去了，每个月都在出去，这个就是负债。只有能带来现金流的才是资产，否则皆是负债。绝对不允许自己长期负债。最高明的人，是能在几个月之内，把负债变成现金流入。


    高手懂得，无论多富有，也不要增加负债，也不要让一个人或者事情开始榨取现金流。一个聪明人，一定是让现金流增加的人。这是穷人与富人的本质区别。永远不要让一个人或者一件事，不断地把您的现金掏出去。您应该想办法，让这个人或者这个事，给您带来现金。这是财商教育的基本准则。比如，您有一个女朋友，天天都让您的现金流出，则，您的女朋友是您的负债。高明的人，会把女朋友变成资产。愚蠢的人，把女朋友变成负债。一个女人若只是攀比消费，而不能有流量、变现，这个女人是什么人？'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# 5.3 高手知道人世间什么最重要


    1、权力。拥有权力，则可升官发财。权力是很多人的追求。求权者，比求软妹币高明。


    2、软妹币。软妹币可以兑换一切，没错，可以兑换一切。不要告诉我，软妹币有些东西兑换不了，好像您没有软妹币可以兑换一样。软妹币唯一不可以兑换的，就是贫穷。


    3、美色、帅气。没错，人生最大的捷径，不过是打扮而已。任何人，只要找个造型师，天天打扮，这个人的人生就会开挂。这是任何人，都可以触摸到的秘籍。只是，您们太懒了不愿意做。


    人的基因是非常宝贵的财富，任何人都想跟基因好的人进行交配。基因资源、性资源，是生物本能的追求。所以，只要您打扮，您的人生就会开挂。您美，就有男人买单。您帅，会打扮，就有富婆、拆迁'
  merge: -1
  img_proc: true
- pgno: 199
  md: '妹买单。这比自己奋斗做事业来得更快，这是基因的兑换。只是，您别混娱乐圈，因为里面会打扮的基因太多了，竞争太激烈。所以，高明的人，只玩降维打击，对低维度的人进行智力屠杀。


    以上一切，都没有智力重要，都没有纵横捭阖，都没有资源整合厉害。权利 + 软妹币 + 美色，只是智力的果实，或者跟班。最高视角的人，是有智力的，可以运用一切。莫要与智力高的人为敌，给他们跪着，或者服务他们，是大家最好的选择。否则，您不知道您是怎么死的。


    # 5.4 高明的人换阶层


    所有的事情，都是升级圈子而已。


    什么人最有财富，我们就用什么人的思维模式来过日子。思维模式、思想，决定一切。思想 + 思维模式，最具有价值。大部分人不这个道理。真正的高手，是修炼内功，内功精深，然后拈花飞叶，皆可伤人。高手是不需要从底层往上爬的。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '犹如，小狗再努力，他也不会变成老虎。人类最牛 B 的地方在哪里？在于思想是可以换的，思维模式是可以换的。所以，有的人可以从乞丐变成帝王。人是可以鲤鱼跳龙门，小狗变老虎的。人的大脑皮层，太神奇了。人可以改天换地，靠的就是换思维模式，换思想。


    人的成功是靠思想的先进性。思想落后的人，人生落后。一个人要想爬得高，首先思想得高。大部分人以为自己思想高，然而现实会打脸，但是他们理解不了现实打的脸。脸肿了也觉得自己的思想境界高。我或许就是脸肿了的那个人。


    人与人之间区别之大，价值观区别之大，不可想象。为什么有些人穷？有些人富？人与人的思想、价值观不一样导致的。比如，我以前在一个公司做技术员，这工作就不能给我带来收益。后来我认为做业务员可以让我发财，我去实验了一把。我谈了几百万，甚至上千万的单子，结果，老板只给我百分之一，并且，还要年终发，还不一次发完，要等到第二年年终，才给我。目的就是要把我捆绑住，这还是一个行业内的龙头企业。我想，这么玩，老子还是穷啊。我就算再拼命，也是穷人一个。于是，我毅然放弃了谈的单子，放弃了以后会给我我的提成，自己干了。自己干啥呢？也不知道。反正，我就是领悟了，只能自己给自己干，才能富。


    下层人士在思想的牢笼里活着，上层人士知道思想、价值观是什么玩意，他们终于理解，这个东西，就是为自己服务的。一个人思想、'
  merge: -1
  img_proc: true
- pgno: 201
  md: '价值观正确了，赚钱就容易；思想、价值观错误，赚钱就难如登天啊。


    穷人思维与富人思维模式完全不一样。一般人到不了高层，一个人的社会阶层是由其意识形态、关系网决定的，他们很难到高层。他们心里就接受不了不同阶层的意识形态。如果一个富人的价值观和穷人的价值观一样，他的收入就跟穷人一样了，就惨了。如果一个穷人的价值观跟富人的价值观一样，这个穷人迟早变成富人。


    事实是，穷人有穷人的道理，如果您给他讲富人的道理，他是不接受的。同样，富人也有富人的道理。穷人讲的道理、行为，在富人眼里也非常讨厌的。这是两种完全不同的文化属性，水火不容。结局当然不一样。而穷人有穷人的思维、价值观，会想尽办法帮穷人说话，并且认为贫穷是对的，会证明富人说的话是错的。富人有富人的思维、价值观，会想尽办法帮富人说话，懒得跟穷人争论什么，大家不是一个频道上的。各忙各的，各走各的。


    高手，换脑换心。低手，碌碌无为，靠体力生存。


    思想就是秘籍，就是内功。大多数人，只学会外延的技术，而不知道小无相功的厉害之处。有什么样的思想，就是什么样阶层的人。阶层不同，收入不同。高明的人换阶层。蠢人呢？蠢人以为靠着努力、拼命，就能升官发财。阶层是怎么换的？是通过学习思想、套路换的。只要您的脑袋能运行高阶层的思维模式，您就可以迅速成为高阶层的人。真正的稀缺资源是思想，是智慧，是智力提升，而穷人不需要这些，'
  merge: -1
  img_proc: true
- pgno: 202
  md: '您没办法把这个东西卖给穷人，他们需要的是温饱。


    一个人的社会阶级信息虽然细微，但却可以永久保存在您的脸上。随着时间的推移，您的脸会永恒地反应和揭示您的经历。这些第一印象可以成为一种自我实现的预言。它们可能会影响您的反应和您所拥有的机会。


    # 5.5 高手懂得赚钱事小，规则最大


    儒家思想要求我们做人规规矩矩。很多人成天都想要打破规矩，打破规则。这些人看似聪明，实际上没什么大前途。现在很多电视剧电影，很多观念，也在讲打破规矩。其实，懂规矩，按规矩做事的人，长期以来获利最大。只是这个话太深刻，大多数人都无福，听不懂。


    儒家思想的礼，您也可以理解成一种规矩。您讲不讲规矩？什么应该做，什么不应该做，都是一种礼。胡作非为，当然就不是礼了。您对别人胡作非为，别人就会对您胡作非为，您的人生就下流了。大家都不愿意尊重规则，都以为规则错了，都以为社会错了。大家喜欢'
  merge: -1
  img_proc: true
- pgno: 203
  md: '反对规则。大家都不想努力，都想获得回报。这样的人，基本都是弱智，混得非常差的。


    这世界上最大的代价，就是忘记了原则；最恐怖的，就是不尊重原则、规律，人最悲恐的大概就是愚蠢。做人，首先要做一个讲规矩的人。您不讲规矩，谁敢跟您长期交往？合作？您不讲规矩，谁敢信任您？不讲规矩，看似短期占便宜，但长期来看，您其实是那个最愚蠢的人，您害了自己。


    愚蠢的人，他们理解不了世界的运行规则，总是按照自己一厢情愿的想法去理解这个世界，导致很大的熵增成本，而他们认为这个世界上没有这个成本。一切皆有成本，他们不想出这个成本，只想按照自己的理念去理解这个世界。


    陈昌文方法的每一个词语，都以大师模式为标准。每一个成交模式，都以帝道模式为标准。全部是以有据可查的大师词语与中国礼仪之邦的社交哲学做人做事。中国古代，就有很牛
    B 的合同模式，也就是礼仪模式。陈昌文老板读书会、陈昌文老板社群，就按照这个模式来做。


    社群的所有项目、所有讲师、所有产品，必须进入大师模式，严格按照国际最高标准要求。每一个点，都必须按照国际最高标准要求。陈昌文方法，完全按照大师的东西来编写，也就是全球最厉害'
  merge: -1
  img_proc: true
- pgno: 204
  md: '的大师的精髓，都在陈昌文方法里。儒家思想，是老祖宗最厉害的东西。做人，做事，都有了。这些东西，只卖给企业家、牛人。我们就要按照这个模式来经营。


    严格按照大师的模式走，而不是宵小之徒的建议。没什么能力的人说的话，他的思维也非常奇葩，您听了，您就会走得慢，甚至会掉坑。这些无能之辈、宵小之辈，他们的路子都是越走越窄，还来迷惑我们。


    陈昌文老板社群里有些人的秉性问题，属于下等人，属于阶层属性不够的人。这些人，我讲了什么是善，他也听不懂，他不理解为什么要按照规矩走。有人自己突破规矩的，这些人，就不应该跟着我们玩了。这些人，就可以走了。他为了贪财，就破坏规矩。这些人，都是宵小之辈，应该及早清理出去。宵小之徒，学会一点本领，就不应该跟我们整个大盘子玩。您吃您命中那点饭，我们走我们的大道。


    智力够、心性够的人，配得上我们思想、德行的人，才能跟着一起走。我们要的是修德之人，要的是规矩之人，而不是贪财、破坏我们规矩的人。人生最大的幸福，不是赚了多少钱，而是有了道德素质，比如有了儒家思想。所以，朝闻道，夕死可矣。人生最快乐的，不是您赚了谁的钱，而是您愿意放手，放弃一些人。


    我知道什么是大道，就算无人走，我就一人走。总是有人会发现我们。我们不需要赚钱，如果需要赚钱，则不是做大事的风格。做大事，不需要赚钱，因为您做的是大师、大事，则钱自然会来。尊重规则，'
  merge: -1
  img_proc: true
- pgno: 205
  md: '大家都赚得多；不尊重规则，大家就赚得少。


    一切都必须按照规矩去做，不要做没规矩的事情。尊重规矩，就没事。您突破规矩，您就不适合。如果几十岁的人了，连起码的东西还都不懂，说明您不懂阶层潜规则，则我就会清理您出局，您混到您对应的阶层去。社群只收企业家、老板。我们内部很多人素质不过关，这些人，要么听话提升，要么出局。灾难是人带来的。当一个人不断地说废话，说利诱的话，乱说话，其实就是对您大脑、智慧的伤害。


    学习原则，尊重原则，不要给蠢人说话的机会和权利。这样，我们走正道的人才能过得好些。人与人之间的交往原则是最重要、最需要注意坚持的。规则比金钱更加重要。赚钱事小，规则最大。只要尊重规则的人，什么都会有。


    # 5.6 不能持续的东西，都没有意义


    不能持续的东西，都没有意义。愿意长时间经营一项事业，才是'
  merge: -1
  img_proc: true
- pgno: 206
  md: '高人。很多人都会跌落的。他们不懂真理，他们反对真理，他们一会儿一出戏，所以，他们没什么前途。高手，都是不变，盯着一个项目一直干。真正的高手，项目唯一，利润唯一，人际关系唯一，就是工作关系。高手做事，往往直奔主题，种下因，得到果。如果现在什么都没有，那证明我们做错了，种错了，是蠢货。所以，我们要种好因。高手为什么会赚钱？竭尽全力地卖东西，搞营销，出单；竭尽全力地学习最先进的同行，碾压同行；付出的比普通人多，付出心血、努力。有个员工问郭台铭，凭什么您一年几十亿、几百亿，而我只有几千块？您这是剥削人。郭台铭说，我创业，卖了房子，借了很多钱，每天工作到深夜，一直努力，才有今天。而您，只来了一个人，还要每个月领工资，您付出了什么？高手之所以能赚钱，就是比普通人付出得多。


    嘴炮是不拼命的，只会喝瑟，说着玩。高手是干活，猛干。哪里有那么多废话，就是一直干 36 循环系统，超越同行，自然收入就超越了那些同行。凡是能赚钱的人，都如修行者。高手永远都在做业务，永不放弃，日日赚钱。低手，一会儿就放弃了，他们总是喜欢放弃。


    有钱，能闭嘴，专门做自己的事情，这样的人，才算是高手。高手，永远是营销，营销，还是营销，永远都在卖，卖，卖，所有的东西，都是辅助卖的。理解了这个，什么都好了，人生就好了。理解不了这个，您的人生灾难才刚刚开始。


    高人，不断地在营销，有收入就是高人。什么是弱者？就是不知'
  merge: -1
