  md: '于文，我们都学了很多东西，大家按照这个标准都是君子。语数外、理化生，历史政治吹牛，国家局势，你们都懂。每个人吹起来都是头头是道。什么台海局势，大家都明白，对不对？所以说按照孔夫子的标准，大家都是博学于文的人，吹牛，各位都是一等一的高手。跟爸妈吹牛，跟老婆吹牛，跟老公吹牛。各位做老板的都是吹牛的好手，这个叫博学于文。


    但是只有这个不行啊。约之以礼，你学的虽然多，但是你们都不讲规矩，不懂道理。什么叫规矩？什么叫道理？饭要一口一口的吃，路要一步一步的走，这个叫规矩，这叫道理。流量，要一个一个的拉；视频，要一个个的做；直播，要一场一场的弄。


    今天有个小姑娘，我不知道有没有来听课，她说2020年要搞几个亿的销售额。要搞几个亿的销售额，她说她不会招商，她说她要找人学习。找什么人学习呀？这都属于扯淡。是她已不愿意一步一步地去走，不愿意去练习。就成找人去学习，希望别人理解她。我们这个群里也有很多这样的人。什么都懂，不懂约之于礼，不愿意去做一些体的事情。不知道饭要一口一的吃。那么大家都不喜欢讲约之礼，是因为这个玩意几要下功夫的，下什么功夫？下笨功夫。大家不愿意下笨功夫，没有人愿意笨功夫，大家都懂道理，又聪明，一说起来还欢辩论，
    欢开辩论赛。这是我们人性的特长，喜欢小聪明、小动作，搞研究，搞捷径，然后碌碌无为。'
  merge: -1
