  md: '高手，是对别人零期望，而对自己有期望。高手不是要求别人要怎么样，而是要求自己要做什么。严于律己，宽以待人。人最可靠的不是别人，正是自己。真正背叛自己的人，其实也是自己。一个人只要控制好了自己，就控制好了世界。对于别人，首先是判断力，是选择的问题，而不是控制的问题。悲剧大多来自于您选错了人。喜剧大多来自于您选对了人。高明的人，靠良知做业务。当然，良知
    + 方法，更厉害。良知 + 方法 + 人性，更厉害。


    我对高手的定义，就是努力赚钱的人；我对高手的定义，就是努力工作的人。凡是不在这个基准线上的人，都是有问题的人。


    # 5.7 陈昌文内部讲话：商业的本质就是卖广告


    商业的本质就是卖广告。视频直播、微信朋友圈、微博、语音交流、电话交流，一切就是为了把我们的广告卖出去，跟客户交流的就是广告。我们讲价值的目标就是讲广告，让客户买单，这是你要完成的。商业的目的就是赚钱，不要扯瞎子。管理的目标是为了实现经济利益，'
  merge: -1
  img_proc: true
- pgno: 212
  md: '营销的目标也是为了实现经济利益。只是在这个过程当中，我们要提出高质量、高目标。高质量、高目标、好的心态，最终也是为了实现经济利益。


    你开个店，这个店不赚钱，你说你是情怀，或者怎么样，最终你负债破产，这是愚蠢的行为。你只要不赚钱，你这个店，我不管你开什么饭店、水果店、书店、设计公司，只要你这个东西不赚钱，几个月不赚钱，你看员工怎么看你？房东怎么看你？对吧？你又去刷信用卡，又去借钱，又找亲戚借钱，找朋友借钱，这都是扯淡。


    不要谈其他的，你只要没有赚到钱，广告没有卖出去，单子没有收回来，你的一切活动都是错误的。所以我们每天做很多价值，都是 为了卖广告。所以你搞直播，搞视频，你不搞滥营销，不搞介绍式营销、媒婆营销、故事营销，没有人买单，你今天白过了。


    所以我们是 为了广告营销系统而服务的，所以我们最重要的系统 叫什么系统？36 广告尾巴循环系统，叫广告营销系统。我们的聚焦 系统也是为它服务的，我们是 为广告服务的。客户买单了，我们为客
    户服务。但首先我们是 为广告服务的。


    史玉柱讲的，一把手基本上你要抓广告，把营销搞好。火车跑得快， 全靠车头带。营销搞不好的企业，营销搞不好的个人，这人基本上就 是扯淡。基本上至少百分之 90，你这个人算是扯淡了。还有
    10% 的 人他不用搞营销。但其实小至个人，大至国家领导人，他们都在出去'
  merge: -1
