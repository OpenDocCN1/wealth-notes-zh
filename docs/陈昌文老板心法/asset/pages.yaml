    # 2.2 害人之心不可有，防人之心不可无


    人生最大的掠夺，是对其智力以及身体的掠夺，接下来，才是金钱的掠夺。可惜，当我懂这些的时候，我已经不再是华发少年。头脑是最大的监狱，我们有很多框架，于是我们变成了现在这样，我们活'
