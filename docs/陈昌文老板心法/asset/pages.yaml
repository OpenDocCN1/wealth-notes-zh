  md: '还亏了钱。但是富人的想法是，我必须要继续折腾，赚回亏的钱。而穷人就会给自己洗脑，这个项目果然不行，当初不做就好了。实际上，要做成一件事，天时、地利、人和，缺一不可。富人也是做了
    n 个项目，最后跑出来几个成功的，但是就是这几个成功的，一下子就拉开与穷人的距离了。


    # ## 6.5 穷人情绪化，富人默默工作


    人与人之间的感情，总是有波动的，而真正的高手，不是靠感情活着的，而是靠理智、智慧活着的。该交往交往的，放弃该放弃的，绝对不情绪化。


    穷人习惯性愤怒，情绪化。而富人没有这些情绪，也少有愤怒，就是冷静地分析，觉得这个项目能赚钱，就投资；觉得学费交得值，就交学费学习。富人习惯性默默地工作，赚取利润。


    牛人是赚钱不赚钱，都在疯狂的搞。蠢人想一口吃个胖子，或者是不赚钱，就放弃了。牛人，尊重规律，终日乾乾；蠢人，总是以为'
  merge: -1
  img_proc: true
- pgno: 229
  md: '钱要求着他挣。越是穷的人，越喜欢找暴利项目，喜欢快速出单。他们没有耐心，故而没前途。越是富的人，越喜欢慢慢来，只要功夫做实在了，自然赚钱。越穷的人，越毛躁。您没办法跟他们交流，多说两句，他们就心情不好，开始骂人。穷人只顾眼前，现在、马上立刻不能赚钱，就放弃了。


    穷人目光短浅，更穷。富人目光长远，更富。


    任何事都是有规律的，要有耐心。按照规律办事，一步步的来，然后，什么都好了。不要那么急，按部就班地弄，什么都回来。那么急切干啥呢？每一件事做好，每一分钟利用好，自然有利润。您想想，您为什么没收人？您想想，您认真工作了吗？


    不要嚣张，也不要拔苗助长。什么事情都是有规律的，按部就班做好。要控制自己的欲望，要控制自己的言行，起居时间等，都要控制。然后一个方向坚持走下去，就会非常厉害。如果换套路，就不厉害了。事物的发展，有其内在的规律，我们不应该枉顾规律。


    穷人会违背规律，索取不应该要财富，富人想办法搞增量财富。您去问台湾年轻人，想成为谁？他们都说想成为郭台铭。其实，他们只想要郭台铭背后的钱，至于郭台铭做过什么，他们不关心。


    思维模式，决定一个人的言谈举止、行动力。言谈举止、行动力、虔诚度、感恩能力，爱粉丝的能力，决定这个人的结果。这个结果，就是有人出单，有人没出单。一个人不赚钱，他讲的一切都是错误的，'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 他的心思都是错误的。


    富人能吃苦耐劳，因为富人想的是，现在努力搞，后面有回报。不能吃 苦耐劳，不肯付出的人，也不可能变得富有。越富的人，您一说，他们就懂了， 他们感恩戴德。所以，我们做业务，更愿意锁定富人服务，大家都很智慧，执行力
    也强，也懂感恩。


    富人的语言系统，永远是积极向上的，想办法让自己变得越来越强壮。而穷 人的语言模式是消极的，与富人的思维模式是相反的。天道是，人若有善良的 愿望、言语，上天就会给您钱财；人若只有恶的愿望、言语，上天也会施给您灾
    殃。


    # 6.6 穷人逃避金钱问题，

    富人想办法解决金钱问题


    穷人觉得贫穷无所谓，即使是心里不舒服，也不管这个事情。而富人， 知道贫穷很恐怖，一定要想尽办法摆脱贫穷。


    穷人逃避金钱问题，而富人想办法解决金钱问题，学习金钱问题。长此以往， 穷人的金钱、理财能力越来越弱，越来越穷。而富人挣扎'
  merge: -1
  img_proc: true
- pgno: 231
  md: '着前进，理财能力越来越强，对金钱的认识越来越充分，就越来越富。


    富人成天想的是如何致富，如何赚钱。基本上，只想跟业务有关的事情。穷人脑子里想的可多了，就是跟赚钱无关。穷人贪多，习惯性做很多事情。富人只做一件事，把这一件事研究到极致，就不得不得了。


    富人总是想着改变自己的命运，主动做些什么，创造自己的人生，找到自己的项目、业务，去改变自己的命运。富人的思维模式是一定要赚到更多的钱，要获得金钱上的绝对胜利。穷人呢，一般选择接受贫穷，抱怨社会。穷人的思维模式是，只要有工资，能混下去就行了。


    比如我以前有一个员工，他就是想在公司里混工资，他工作做不好，我要开除他了。他还说，您就让我有一份工资吧，对您也没多大损失。他们的思维模式就是能混就混，而不是要取得金钱上的胜利。


    富人会为了自己变富而付出实际的行动。


    穷人只是想，想想就算了，经常想，永远在蓝图上、计划上。不干。穷人懒惰，您给他安排个任务，他3天都不能行动。没行动力，看电视，玩游戏积极，工作不积极。懒惰的人，不成交，就不想问题。比如，不成交，就是内部的图片营销系统没做好。成交，就是内部的营销系统、图片系统做得好（见《陈昌文方法72大营销系统》《陈昌文方法1000问》）。懒惰的穷人，不喜欢思考问题，不成交，就怪老师，怪别人，就选择放弃，选择谩骂。


    勤奋的富人，会思考，找到原因，立刻修改。富人看到一个机会，'
  merge: -1
  img_proc: true
- pgno: 232
  md: '就去干，去实践。看到问题，就想办法解决。


    # 6.7 富人是人抬人，穷人是人踩人


    索取太多，不愿意付出，是失败的直接原因。穷人喜欢索取，不断地索取，自己不付出什么，最终导致别人离开。老板、能富有的人，都是付出型人格。


    富人的思维模式是，获取自己应该获取的，靠自己的能力去获取。努力向上，给予别人财富。帮助别人，感恩帮助自己的人。穷人呢，喜欢占便宜，消极、贪玩，记不住别人帮助自己，感恩之心少。您帮助了穷人，穷人认为理所当然；您给了穷人钱财，穷人觉得无所谓，您就应该这样。


    您帮助了富人，富人懂得回报，富人懂得感恩。穷人一般不会帮助您，也不会感恩，他们的目标是消灭您，让您变得更穷，变得跟他们一样。


    为什么大部分人都是穷人？他们不懂相互配合。穷，还格局小，'
  merge: -1
  img_proc: true
- pgno: 233
  md: '欢自作主张，什么都听不进去。比如，陈昌文老板社群有些学员，他们赚钱的点太多，他们没有取舍，啥都想拿到手里。我建立老板群，建立读书会，也没办法拯救很多人。毕竟，贫穷其实是性格、胸怀格局上的问题。您想改变，就努力，尊师重道，听话照做执行。如果您已经在陈昌文老板读书会里，陈昌文老板社群里，您还是自作主张，不想改变，我能奈何。您喜欢走邪道，走您认为的捷径，谁能拦得住您。


    相反，富人懂得相互合作，懂得您帮了他，他就应该帮您。富人不断地教育人变成富人，大家一起工作，努力赚钱。富人习惯性群体作战， 习惯性加入富人社群合作， 习惯性付出，
    习惯性感恩。穷人总是一个人打游戏，一个人打工。一个人是很难战胜群体的。穷人习惯性单打独斗，富人习惯性合作。穷人永远是单打独斗的打工。富人的模式，则是找到优秀的人合作，一起建设致富的团队。富人是人抬人，穷人是人踩人。所以富人越来越富，穷人越来越穷，甚至穷得消失了。


    富人跟穷人在一起，面相、脸色都会越来越差。谈恋爱，工作，要找对应阶层的人。否则，您怎么倒霉的，都不知道。您能改变世界，您也改变不了人心人性。（见《陈昌文方法之恋爱宝典》生存价值和繁殖价值，货币筹码理论。）'
  merge: -1
  img_proc: true
- pgno: 234
  md: '# 6.8 穷人周围一般都是穷人， 富人周围一般都是富人


    穷人喜欢跟穷人呆在一起，并且他们会认为穷人跟富人都一样。富人则不然，他们知道，跟穷人呆久了，就会变穷。富人知道穷富圈子的价值。穷人没富过，不懂。


    穷人周围一般都是穷人。上穷人的学校，做穷人的运动，读穷人的书，形成穷人固有的思维模式。


    富人周围一般都是富人，做富人的运动，比如高尔夫，不到十岁，就带着他们打高尔夫，接触企业家，读管理类的书籍。形成富人固有的思维模式。


    富人赚到钱后，不会搞丢自己的钱，不会交往坏人，浪费自己的钱。穷人赚到钱后，经常搞丢自己的钱，乱花钱。富人与成功的、积极向上的、聪明的人交往。穷人与消极的、堕落的、懒惰的人交往。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '您的金钱来自于您的想法。


    我家有亲戚在上海帮饭店，然后他们就叫他们子女去帮饭店。他们也叫我去帮饭店，我还因为受这种思维模式的影响，去学了厨师，去做了切配，所幸，我放弃了这种生活。别告诉我什么做好厨师、切配也能发财。思维模式错了，路错了，赚钱很难。


    穷人变富为什么那么难？因为其思维模式是穷人思维模式，其讲话模式是穷人讲话模式，周围的人也都是穷人。富人一但碰到这样的人，基本都不说话，沉默，不交往，不教育。然后，穷人永远改变不了自己贫穷的思维，于是，穷人就只能继续穷下去，别无出路。只有少数低调、感恩、认干的穷人会得到富人的提点
    帮助而改变命运。


    # 6.9 面子与尊重


    人需要面子吗？


    越穷的人越需要面子，因为没有里子，怕人嘲笑，所以需要面子。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '越没文化的人，越要面子，因为您一说话，他就觉得伤害到他了，他还说你装。


    工作做得越差的人，越要面子，您还不能说他，一说，就暴脾气。工作做好的人，在做工作的过程中，受到了很多挫折，反而对面子不看重了。


    经历越少的人越要面子。经历多的人，大风大浪都见过了，不喜欢生气了，不喜欢那些虚头巴脑的东西了。越富有的人，越实在，曹操就不要面子，要里子。


    喜欢要面子，而吃亏的人，实际上是智力有问题，认知有问题，分不清楚好坏。越王勾践还吃屎呢，这能有面子？不过最后成了春秋五霸之一。聪明人，就是干活，做实在的事情，赚钱最重要，得到实惠最重要。生存最重要，繁殖最重要，至于面子，谁喜欢谁拿去吧。


    您是一个喜欢要面子的人呢？还是一个不要面子的人呢？


    # 尊重是什么？


    人其实不需要尊重的。别人尊重您，其实是一种自保，一种自我防护。尊重是对待玻璃心，对待穷人的武器。富人都知道，自己的实力才重要，您尊重我，我依然是一个穷人，这没什么意义。玻璃心强的人需要尊重，跟这样的人相处我们也累。最好的方式，就是不跟这样的人相处。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '首先，你必须赚钱，而且必须时时刻刻去发广告，搞内容，去赚钱，去变现。这个是你一定要记住的，并且时时刻刻都要去做的，否则你是赚不到钱的。


    第一句话，有些人学会了讲价值，有些人还没有学会。但是只要你不搞广告，你就没有收入。你要去向这个社会要钱，才会有收入。否则你是没有收入的。


    第二句话，非常重要，你讲的任何话必须是有价值的。我告诉你这句话每个人都听过，但是你听不懂，我也听不懂。我在没有任何收入的时候，我就知道了这句话，但是我也一直没有搞懂。现在各位在这里听课，你放心，你们没有多少人能听得懂这句话。这句话非常有深度，非常难以学会。你讲的每一句话必须要有价值，绝不讲废话，'
  merge: -1
  img_proc: true
- pgno: 238
  md: '不要用废话去填充粉丝的时间，填充自己的时间，宁愿重复有价值的话。你放心，你们听不懂。那就是这几句简单的话，你听不懂，你也做不到。你也搞不清楚什么是有价值的。当你搞清楚的时候，你其实已经开始赚钱了。当你讲的话有价值过后，别人会追着你给钱的。


    鸡汤和有价值的话是有本质区别的。讲鸡汤是没有意义的。当然鸡汤可以给普通人听。但是企业家、老板要听的是有价值的东西，我们讲营销，这个是有价值的。讲儒家思想，这个是有价值的。你要把这个东西卖给对应的人，你说的每一句话必须是大师讲过的。所以我一直在讲儒家思想、陈昌文方法，这里每一个系统，它都是有价值的。然后是大师的东西，这个叫价值。只要这句话没有价值，你就不要开口，不要原创，因为你创造不出来价值。所有的价值都在老祖宗那里，所有的价值都在大师那里，都记录在案，千万不要去原创。否则你又是嗯嗯啊啊说了半天没有任何用。


    曾子曰：“君子以文会友，以友辅仁。”什么意思？君子，厉害的人就是君子。什么叫小人？无能、德行差的人。德行差就代表无能。只有坏人才干蠢事，只有坏人才恶毒，所以厉害的人叫做君子。君子以文会友，什么叫文？就是有价值的经典、精华、诗书礼仪、诗书礼乐，这个叫文。这是什么意思？就是君子会友，君子聚会、娱乐等。跟人在一起聊天，做事讲的是诗书礼仪，讲的是经典、老祖宗的精华。以文会友，我们谈论的永远是这些东西，我们不谈论其他的东西，这'
  merge: -1
  img_proc: true
- pgno: 239
  md: '就叫价值。


    小人他喝酒、吃饭、喝啤酒、吃烧烤，他说的那些都没有用。他为了聚会而聚会，一帮人在一起，就像某人把我带到上海的某些夜场里面去，我一分钟也待不下去。北上广深应该都有这种夜场。我以前看电影，看电视，那里面有那些夜场，然后我自己也被某些人带进去，那里面那些男女在里面跳，那都是没什么意义的狂欢。


    你们看这个抖音里面，它很多其实是没有价值的内容。它就很难产生钱。那么这种没有价值的东西能产生什么？能产生多余的欲望。但是他很难赚到钱。就像我们讲直播，我们更朋友圈，我们发广告，没有人给我们付费。原因在哪里？原因就在于你说的没有价值。


    好了，那么接下来有一个很重要的东西，就是各位怎么赚钱？首先你们要把直播开起来，无论如何你们都要去做直播。昨天我们有个老师讲的一句话非常好，你怕做直播没关系，打开直播先坐在那里，先讲，然后慢慢开始讲儒家思想、陈昌方法这些营销系统，你先进入轨道。能讲课，尽量要讲课，能传播一点，尽量要去传播。你先去练习，当然我们希望本来就会的人来做这件事情。


    好了，后面这四个字叫以友辅仁。什么叫友？叫以文会的友才叫友。我们讲经典，讲营销，讲儒家思想，讲有用的东西，你听不懂，你就不是我的友。你不能参与讨论，我们就不友。我们就不跟你“会”。'
  merge: -1
  img_proc: true
- pgno: 240
  md: '你要让我去开个卡座跟你喝酒，我只能认为你脑子不好，你不是我的朋友。你整个人在那里说笑话，我是不听的。因为那个是没有意义的事情，你也不是我的友。我不听你那些东西。你弄张桌子喝酒，我不跟你玩的。所以先定义什么叫友，然后才能读懂后面这句话，叫以友辅仁。这个人，他讲的是经典，说的是老祖宗的东西，说的是大师的东西，他说的东西有价值，这个人才能辅仁。否则他辅不了仁，他自己都不仁，他辅什么仁？


    所以我们交往朋友，我们讲价值。别人来跟我们交朋友，他讲价值。讲不出来，我们不跟他交朋友。我们讲不出来，我们也交不到朋友。这种好人，这种朋友，他才能规劝我们走上善道。否则他规劝不了我们走上善道。这个是要明白的。


    所以我今天说的重点叫做什么？叫做你永远都要讲有价值的东西，没有价值的东西，你绝对不要去讲它。


    富人思维，本质是喜欢高效率的沟通，看我微博上面有四个字（我有三个微博：陈昌文 / 陈昌文老板社群 / 佛道君），叫做效率至上。真诚是高效率的生存竞争法则。穷人思维，喜欢把事情搞复杂，导致低效率，导致没有生存竞争力。其实，赚钱就是把那些低效率的人赶走，打造一个高效率的圈子，什么事情都是高效率，这就是高阶层，这是一个成本核算问题。穷人只知道自己穷，不知道自己的生活成本，以及各项核算成本都非常高。富人的富裕，本质是效率奇高。并非是'
  merge: -1
  img_proc: true
- pgno: 241
  md: '说有钱，而是思维能力、识别人的能力、看问题的深度，以及道德都是用来提高效率的。您跟穷人在一起说话、沟通的时候，您就会发现他们语言之间、逻辑之间，不断的把您导入低效率阶段。


    最可怕的低效率是负面思维，直接改轨道。您跟富人、牛人聊天的时候，您会发现，他们的语言、逻辑是把您导入高效率阶段，思想是积极的。穷人，主要是思维能力低下，其做人做事的效率低下，成本高。富人、牛人，主要是思维高效，道德能力高。道德的本质是高效率的社会沟通，也就是低成本的社会沟通。提高道德，就是降低成本。打造团队的核心是进一步提高传播效率，聚集高效率的人在一起。一群低效率的人在一起是没有意义的。拿着这个尺子去量您引以为傲、经常袒护的人，去思考吧。'
  merge: -1
