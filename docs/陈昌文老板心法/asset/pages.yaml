- pgno: 123
  md: '寒冷、悲伤。有了阅历的人，才能明白这句话：认识的人越多，我越来越喜欢孤独。我们的生活好了，乐观了，往往是由精神世界的悲伤带来的。


    我对人生的看法是，有含有得，一定要懂得放弃。人不应该有所求，而是放弃，向内求，这才是道。只有您放弃了没有放弃的东西，您才能获得您真正应该获得的。应该舍弃什么，应该获取什么。这个问题搞不清楚，这个人就没什幺前途。


    最后，改变过去是不可能的，您只能改变未来。努力，就是为了 让未来过得好一点。


    # 3.3 这是一个用结果衡量的世界


    成年人的世界，没有对错，只有实力。丛林法则，有本事就上，没本事就下。战斗都是靠实力取胜的，没有说是靠技巧取胜的。金钱，是检验结果的唯一铁证，而不是您的才华无处安放，或生不逢时的哀叹和借口。


    为了赚钱，我们付出绝对代价，拼命奔跑。金钱比大多数人的肉体、'
