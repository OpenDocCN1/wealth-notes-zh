  md: '近上帝；越穷的人，越靠近地狱。你们看看越穷的人是不是越靠近地狱，你们看看越富的人是不是越靠近上帝。


    可能这样讲，很多兄弟们听不懂啊，就是说很多兄弟姐妹们说，老子明明这么善良，这么好，没有钱，你在乱讲，你在攻击我。我没有攻击你，你穷就是因为你歹毒，不会做人，大家都有病，只是不知道自己有病，心病，精神病。恶人，你太恶了，不会做人，所以没有钱，你吸引不到财富。


