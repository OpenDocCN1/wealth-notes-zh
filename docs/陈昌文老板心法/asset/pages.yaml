- pgno: 128
  md: '人的人，不会发财。所以，本质上一切都是靠自己，只有靠自己最牛B。您真愿意投入，您就会变得异常强大；您不愿意投入，您就会变成一个笑话。更优秀的人，都在拼命工作，努力竞争。输了，心里就会不舒服；而赢了，心里就会爽一点，这就是人性。有些人不想参与激烈的竞争，就让资本家不要加班。您不想竞争，您懒惰就行了，别阻碍牛人拼命工作。任何人都是拼出来的。您不拼命，算了吧。


    人一定要务实，务实最有益的工作，不断地去干，别偷懒。您工作的内容哪里最有效果，您心里很清楚，只是您不下功夫而已，导致业绩荒废。可以这样说，业绩荒废的人都是不务实的人，犹如农民不去经营自己的地，不除草不施肥，不浇水，希望收获，不太可能。


    营销工作者要做的就是流 问题、变现问题，天天围绕这两个问题下苦功夫，用错力了，就抱歉了，会导致一无所有。您不去做流 百分百做流量；您不去塑造价值，联系客户谈变现的问题，百分百没有变现。您偷懒，业绩就偷懒，就是这么回事，大家都要养家糊口，还想有未来，那么，您就务实点，别混自己的日子。


    人生的成就，不过就是勤奋努力而已。努力做流 ，努力谈单子。您努力做流量，您努力做社交，您不断地聊天，就会成交。为什么要一直努力工作？因为除了您自己，其他人不会给您赚钱。您必须不断地拉流
    ，出单。人总是这样成熟的。自己对自己的流量负责，自己对自己的聊天负责，自己对自己的业绩负责。每天工作16个小时，'
