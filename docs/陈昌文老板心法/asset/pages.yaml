- pgno: 89
  md: '我精通社群营销，我知道怎么样从网上抓取。我有吃有喝，我有地方睡觉，我不需要你给我任何东西。我是这样一个人。我搞我自己的事情。


    这几年浪费了不少钱，为什么会浪费钱？就是因为交往了一些不该交往的人。男人、女人都有，以后我待人接物很简单，我掂量一下，你这个人值多少钱，我只会给对应的这个钱，我不会再跟你说那么多了，我搞我的事情，自然就能赚到钱。你之所以赚不到钱，是因为你懒惰，又愚蠢，愚昧无知。曾国藩说啊，一勤天下无难事。笨点可以，你至少勤奋一点。


    再有一点，合伙人、客户，必须是有钱人。比如说跟我合作的，凡是赚到钱的，能赚钱的，他本质上就是牛人，他本质上就是富人阶层。贫穷的人你是很难教会他的，他的头脑有思想、价值观的鸿沟。这个贫穷的人他已经在二三十年里，他的父母都传授了他这个脑回路。每个人的脑回路都在进行编码，你的脑子里编码的都是贫穷的价值观、贫穷的方法的思想。那么你的行为一定是贫穷的。在这种情况下，你很难赚到钱。我虽然在教你，我天天教你，我教你两年、三年也不启用，为什么不启用？因为我其实是在和你的爷爷、你的奶奶、你的爸爸妈妈、你这个贫穷的环境，二三十年的环境，我在跟你们几代人对抗，还在跟你的基因对抗。你又比较懒惰。我才带你多长时间，对吧，我带你一年、两年，我根本就没有办法对抗掉的。即便是我就住这个富的路上带，你还是要找穷的那条路。所以说合伙人必须是有钱人，客户必须是有钱人，必须是老板，你们一定要记住。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '感恩，这个特别重要，你必须有感恩之心，人不要有奶便是娘。目光长远，尊重规律。不虔诚，不老实，也没有感恩之心，这就叫欺师灭祖，所以就没有什么前途。


    母在一子寒，母去三子单。他为什么会说这种话，就是他的心真是颗好心，好心人才讲得出来这种话，好心人才会有智慧。心坏了，念头坏了，一肚子坏水，干啥都干不好，学些啥都学不好。人可以欺人，但欺不了天，真正的衣食父母是天啊，当然可能讲得有点高了，大家听起来有点玄。人可以欺人，你可以骗我，你可以骗观众，骗粉丝，可以骗老师，可以骗客户，骗同学，但是你骗不了天。所以举头三尺有神明，当然这也是我们的古话。你骗谁呢，你没有业绩，做人态度不好，很邪恶，没有感恩之心，随时准备造反。我教你这么多，你都没有感恩之心。我跟你讲明白一点，你听得进去，听；听不进去，算了，我也无所谓。


    比如说，你跟我合作，跟我赚钱，感恩，这是你应该做到的。当你在外面看到一个项目，或者其他人给你说了一个什么，你就跑了，你就属于有奶便是娘，你就是不知道什么叫感恩，不知道什么叫尊师重道。当然你可以走，你走了对我无所谓的，但是我就是给你讲这个道理。


    钱只是表面现象。所以从某种角度上来讲，我希望我们在一起玩一辈子。因为这也是大道，不是玩三天不玩了。人为财死，鸟为食亡。'
  merge: -1
  img_proc: true
- pgno: 91
  md: '这是对低级物种讲的。有精神，有道义，什么都会有。为什么马云带着十八罗汉能做那么大，开始是借员工的钱给他们发工资，这些人还没走，他手下这些人不是有奶便是娘的人，他才会成功。史玉柱为什么会东山再起？他手下有一个总裁，那个人跟了他几十年。


    要看看这个道义的问题，这玩意定下来了啊，你的心就定了，你的事情就能做好。这玩意要定不下来，你的心是飘的。一会儿这个项目好，一会儿那个人好，抱歉，你跟了别人玩过后，你一会儿又跟了其他人，抱歉啊，然后你又跑了，又跟了一个人玩。然后又是这个好，又是那个好，然后你终身就抱歉了。我希望大家能够理解这个东西，这也是师道，有师道也有徒弟的道。


    我觉得从小的时候我就明白了徒弟的道，我知道我会很好，而且我会越来越好。为什么？因为我懂得做人。我经常给你们讲的，我跟你们讲过很多次了，我给一个上海老头子洗脚，他以前是一个很厉害的工程师，我天天就给他洗脚，他孙子都不给他洗脚。所以他把带我出去，见那些很厉害的他以前的关系网、那些同事。他就说我是他孙子。他叫我孙子，我就叫他爷爷嘛。


    要尊重。给人洗脚不虔诚，你那双手是洗不好脚的，你内心里有反骨，比较奸诈，你洗了个脚，别人是看得出来的，别人是感受得到的。所以说先学做人，再学经商，学会做人了，不想赚钱，钱都会来，要多少有多少，他自然会吸引来。学不会做人，碌碌无为，你干啥都没用。'
  merge: -1
  img_proc: true
- pgno: 92
  md: '什么叫本？什么叫根本？做人就是本。不要把本搞没了，把本搞没了，钱这个玩意儿，它只是枝叶。你有本，枝叶自然繁华，没有这个根本性的东西，那你要想花开，想要叶茂，即便是真的花开叶茂了，他也很快会枯萎。


    这个虔诚 感恩 尊师重道 老实，这几个字啊，就是你们要好好琢磨的，要反复去琢磨的。你们不知道这些词语到底是什么意思。尊 ，你有没有尊重项目啊？客户，你有没有尊重客户？你三个月才去问一下那个客户，客户给你钱？客户给你个鬼。为什么王宝强能够崛起？
    宝强是习武的，少林寺出来的，那么多去少林 的人，为什么没有多少人出来？首先来讲，习武锻炼身体是一个很辛苦的活，你们有多少人能把自己的腹肌练出来，练八块腹肌，这是需要非常强大的意志力，才能练出了八块腹肌。真的要听话照做执行，你才练得出来。然后
    宝强逢年过节都去给冯小刚送礼，送什么，送小米，他应该是没有钱，对吧，送礼送大米，逢年过节就送。冯小刚说也有其他人给我送礼，送着送着就不送了，王宝强送了我好多年，还在送。所以我捧王宝强。王宝强他长得不帅，他能够崛起。


    送礼要没有回报之心，有了回报之心他就不送了。为什么其他人送着送着就不送了？有没有人能理解，为什么其他人送两次就不送了？他送两次，他发现那个冯小刚不回报他，他可能还会回去骂，信吧。这就是没有虔诚，这不是感恩，这是找事了。所以我们一般也不敢收人的礼。'
