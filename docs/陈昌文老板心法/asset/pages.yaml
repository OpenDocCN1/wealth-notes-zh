- pgno: 190
  md: '好的，你就一个人。这是根据各位自己的选择，我先告诉你就是这么回事。当你往前走一走，那么你就能明白这个就是真的。所以说，你去看这个电视剧，看那些电影，你觉得这些人怎么动不动就吃救心丸，吃心脏病药，吃安眠药之类的？那是你没有到那一个位置，所以你看这个电视剧，你觉得都是假的。其实他们有一些还是写实的，确实是这个样子。但是我告诉你，你通过锻炼身体，高强度锻炼能够抗压的。因为你的肌肉发达过后，他会让你的身体能够抗压，你的肺活量增加得非常大，那么你就不会气喘，不会哮喘。然后你经常让你的心脏处于高负荷的状态，工作压力来了，其实你就能够忍受得了。锻炼身体也可以增强你的意志力。同样锻炼身体，也可以让大家赚到更多的钱。这些东西都可以做成图片发到朋友圈。


    有价值的、积极的东西，全部是可以用来搞营销的。所以营销就是看你是够产出多少东西。产出的东西越多，你营销的就越猛。你不要想着你这个是精益求精的东西，你产生不了那么多经典，你不断低产出过后，你就会精益求精。任何不舍得下苦功的人，不舍得疯狂产出视频、直播、文案的，他都做不好营销，他做不好互联网营销。


    那么我刚刚做建材业务员的时候，我跑工地的时候，之前我也没有做过营销，我也不知道怎么做，但是我的业绩做得最好。几百个人中我的业绩都是第一名，而且是迅速做到第一名的。自从我成了第一名，别人都没有超过我。他们那些经理开着车也做不过我。因为很'
