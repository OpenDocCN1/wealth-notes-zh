- pgno: 104
  md: '板读书会。你是什么？你是陈昌文老板社群的讲师、陈昌文老板社群的助理、陈昌文老板社群的顾问、咨询顾问、培训顾问、营销顾问，这就是你的名。你跟我们社群联系起来，你也很正能量。我告诉你们，只有你很正的时候，你才能听得懂我这些话，你不正，你听不懂我这句话。


    我们社群跟你坦诚相待，你也一样。这样你的生意会做得更好，我们的生意也会做得更好，大家都能赚到钱。但是你不，因为你不是这种人，你怕我们社群蹭了你的热度，理解吧？你不愿意，你不愿意承认你是我们社群的，当然也借不到我们的力，你不在我们的矩阵之中。你是心怀鬼胎的，你其实蛮难的，我跟你讲。你放心，我们社群多你一个不多，少你一个不少，真是这个样子，而且我们会越做越好。你千万不要以为我们在蹭你的热度，所以你首先要给自己一个名头，听懂了的，向我这个方向去做的，他的收入都会越来越高，你放心就是这个样子。


    我们在市场上是有一定名声的，而且名声会越来越大。我们所接触的人必须是老板，我再跟你强调一下，你们的嘴巴里只能是老板和企业家，我们的客户必须是老板，不是老板绝对不跟他打交道，不收他的钱，一定要记住。这也是正名，你到底做谁的生意，你要讲清楚。如果做谁的生意你都模凌两可的，你就心怀鬼胎。如果你心怀鬼胎，你嘴巴说不对，其实人家都感觉不到你的真诚，人家觉得你就是个骗'
  merge: -1
