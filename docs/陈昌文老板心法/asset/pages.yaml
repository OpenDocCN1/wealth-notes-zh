    把自己的精神状态搞好。


    每个人都要把自己的精神状态搞好，你必须每天精力充沛，你精力不充沛，你工作很难做 好的，你就会发呆，要有业绩，承诺自己要达到什么目标，然后向着这个目标去奋斗，还要有惩罚机制，是吧？人是要给自己制定惩罚机制的，如果只是承诺，没有惩罚，其实也没有意义。


