- pgno: 209
  md: '做自己的事情，坚持真理。坚持生存得好，繁殖得好。那些习惯性反对这个思维的傻子，讲些不好听的话，高手根本不在意他们。比较愚蠢的人，喜欢跟人辩论，喜欢怪别人，总是觉得别人错了。高手，都是认为自己不对，自己蠢，然后以最快的速度行动，赚钱。


    在高手眼里，学历是没什么用的，学历是用来区别普通人的。英雄不问出处，高手只管聚焦自己的项目。人如果不能从一而终，则有成就的机会非常小。事业比人更可靠，项目比人更可靠，社交工具比人更可靠。人如果做不到聚焦、专注，这个人也不会有什么成就。


