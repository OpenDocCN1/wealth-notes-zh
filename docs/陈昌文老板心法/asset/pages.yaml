- pgno: 147
  md: '就是大部分人都控制不了自己。


    您必须每天不断地训练自己，控制自己的心。贵族与普通人的区别也在这里。贵族从小家教就开始训练他们，控制自己。而普通人没家教，放任自流，这个人完全控制不了自己，就变成了废物，或者变得碌碌无为。


    能控制住自己的，就是神。任何人，只要能控制自己，他就是一尊神。任何人，只要能控制自己的思想与行为，此人，就是圣人。此人就无所不能。为什么佛是佛？佛不过是能控制自己的心而已。任何凡夫俗子想要成就的唯一途径，就是修炼控制自己的程度而已。


    您能控制自己吗？您是被自己的欲望控制？还是控制自己的欲望，控制自己的思想、行为？决定着您过什么样的生活，您的收入如何。


    人最怕控制不了自己。然后就是修德的问题，人的身体、事业出了问题，大多都是没德，智力太差了，心智太差了，会导致出现严重的后果。'
