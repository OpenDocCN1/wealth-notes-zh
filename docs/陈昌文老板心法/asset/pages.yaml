  md: '你成天瞎扯淡，你也觉得你在讲故事，那跟赚钱没有关系啊。这就是为什么你们有些人天天直播，天天搞视频，也写朋友圈，你不赚钱。我的东西都是有套路的，都是有玩法的，都是有一个一个的逻辑在里面的。而你写的文章、你的直播和你的这个朋友圈没有逻辑，所以会导致你不好做。


    讲一个重要的事情叫，人只应该讲一件事。


    比如说我们社群是老板圈子，那么我们就永远重复这个。只讲一件事情，因为人多了，他是记不住的，但我们这里面包含了什么，你可以去阐述。但你讲的时候，只能讲一件事情，就是我们讲的一个卖点。比如说我是社群营销专家，对吧，你们要学社群营销的，你就应该到我们社群里来。我们是鼻祖，我们是王者，我们是
    No.1，讲一件事，绝对不要讲第二件事。要讲的少，反复讲一件事，也就是只有一个卖点，要越少越好，重复讲，重复讲这件事情，那么他就會来。你讲了两件、三件，他记不住，你讲多了，他就会觉得你是个骗子。你只讲一个，他就会信任你。这个特别重要。


