  md: '那么，陈昌文老板读书会、陈昌文老板社群也不是需要建立一个生意链接，而是要建立一个人格链接。若这个人不懂得尊重人，不懂得尊师重道，不懂得孝敬父母，则不要把他收到陈昌文老板读书会，也不要把他收到陈昌文老板社群。我们必须过滤掉人性、人心不行的低能量的人，这些人，是得天地之偏气所生，当您跟这样的人建立了链接，无论生意、合伙人、客户、朋友、婚恋关系，都只能证明您的愚蠢。愚蠢了，就不会开心，就会倒霉。相反，与高能量的人在一起，您就会开心一点。


    您讲出去的话，是召唤谁的？是给高能量的人听的？还是给低能量的人听的？您是不是镇得住这个场子？是不是真的收心了？是不是别人真的服您了？他不服，为什么要收他的钱呢？就像谈女朋友一样，您不喜欢我，我不跟您在一起的，您要为难我，我就不跟您玩了。男同胞能明白这个道理，您这一辈子都幸福。人的不幸是因为他追求了他不应该追求的。女同胞也是这个样子。


    您的不幸是因为您追求了不该追求的，收了不该收的人的钱，跟不应该在一起的人在一起了。本来大家都很幸福的，为什么您不幸福呢？能量等级对应了，您就不会去追求不该追求的东西，也不会感到很累，很费力。人其实是不需要出力的，出力的人他就不是高人了。比如，做陈昌文老板社群项目的，做读书会的，其实您做视频，做直播应该是很轻松的，您在我们社群里就搬运我书上的东西，搬运我们'
  merge: -1
