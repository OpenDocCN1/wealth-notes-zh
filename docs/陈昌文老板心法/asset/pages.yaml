- pgno: 145
  md: '人很胖，不注意自己的健康，而很多富人，却是身形很好的人。有例外，我不想谈，我只谈大多数情况。日本街道上很多的流浪汉都是胖子，他们吃肯德基、麦当劳穷人剩下的食物，毫无节制，对生活属于绝望状态，他们当中很多人都有糖尿病。


    一切富人，都是应该富的，因为他们付出的很多，他们自我控制力非常强，他们对生活都是满满的激情。从成功者嘴里，您是听不到抱怨的，他们永远想的是怎么把问题解决掉，怎么让状况变得更好。他们承认现实，面对现实，而不是逃避。一切穷人，也是应该穷的，他们索取的多，付出的少；抱怨的多，感恩的少。他们悲观，且习惯把责任都推给别人，推给老板，推给社会，推给国家。


    穷富，是恒久远的事情，也就是，您的祖辈也决定着您付出多少，是以基因这根线索来的，而不仅仅是您个人。


    人要想进步，就要克服这些人性，学习稻盛和夫，一直工作。人必须学习稻盛和夫，日日精进，否则不赚钱，还短命。一个能坚持天天健身的人，其实是生活情趣枯燥的人。一个工作能力强的人，基本只有工作。人啊，就是勤奋＋诚恳。有了这两样东西，就厉害了。懒惰的人，再聪明，都没什么用。不自律的人，会死的很快，人从方方面面都要自律。凡是长久厉害的人，都是自律的高手。曾国藩、李嘉诚都是这样。看他们的作息，看他们对生活的态度，他们对欲望的控制，都是极其自律的，只有自律的人会有成就。不自律的人，只能随波逐流，'
