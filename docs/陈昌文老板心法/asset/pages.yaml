- pgno: 207
  md: '道卖什么，卖几天就干别的去了。高手是不断地卖，傻瓜是不停地买。高手都是嗜取价值的人。高手就是卖，比如把儒家思想卖出去，把陈昌文方法72大营销系统卖出去，把书籍卖出去，把社群卖出去，总之，高手是卖的思维，是收钱的思维。做有意义的事情，而不是无意义的事情，招招要命，招招致命，才是高手。做不到招招致命，都不是牛人。脑残，做事情，往往不注重效果，被虚假迷惑。


    高手只想搞流量，搞图片变现。如果收入下跌，将一无所有。如果收入下跌，物质生活就会崩盘，精神生活也会没有了。高手关注的永远是不停地赚钱，不停地生存＋繁殖。所谓营销，不过是不停地卖东西，用更好的套路卖东西。大道至简，说的多了，没把别人搞晕，倒是把自己的企业搞垮了。


    高手只是弄广告，卖文化，卖服务，卖圈子，卖出去收钱，任何其他动作，都是多余的。傻屁成天做多余的、没用的动作。判定一个人是不是高手，就是看他的功夫是不是到位。所谓功夫到位，就是搞门面，搞流量，搞变现，锁定年入百万以上的合伙人，其他人不要。高手只谈搞流量，变现。蠢人，会说一些没用的东西。高手，都是闷声发大财，一直搞单宁，搞流量，搞社交，搞成交。研究人性、人心复购，利润随之而来，利润多得很。


    高手干三件事：1、琢磨人。2、琢磨事。3、琢磨钱。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '高手，不过是一直琢磨自己的工作、自己的业务而已；高手，不过是琢磨流量、变现，琢磨广告而已；高手，不过是勤奋工作而已；高手一个月 30 天，日日夜夜拉单亏。高手是做好视频爆粉，做好暴利关键词视频，做好直播，3
    6 广告循环系统，直接赚钱。高手是干，逝者如斯夫不舍昼夜，生生不息，天行健，君子以自强不息。傻屄总是找捷径，偷懒，成天做财富自由的春秋大梦，总想着不劳而获。


    真正的高手，就是信奉老生常谈，把老生常谈的事情做到极致，比如，努力工作，搞直播，搞视频，变现，更新朋友圈。真正的高手只有一招，并没有那么多招式。拉单亏，拉单亏，还是拉单亏，最后组团拉单亏。谁的单亏多，谁的利润高。必须时时刻刻拉流量，聊天，收钱。锁定同行客户，锁定所有类似客户，锁定所有富人，不断地谈判。


    高手，懒得向谁推销业务。就是不断地释放价值，介绍，介绍到极致，然后自然成单了。帮助人，帮助到极致，自然成单。高手是不与蠢人交往，认认真真死磕 36 循环系统的人。高手，就是日日付出有价值的内容。有了粉丝，做好转化，养家糊口的人。高手，是能守得住自己钱财的人。


    作死的人，并不知道自己再干啥。攻击别人，是最无聊的事情。高手，就是集中精力干活，做事业。事业好了，什么都有了。攻击别人，并不能让我们获取财富。高手，是不会被蠢人影响心情的。凡是被蠢人影响心情的，都要继续修炼。高手只追求真理，只追求多赚钱，'
