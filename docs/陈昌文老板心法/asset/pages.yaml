- pgno: 42
  md: '是用来优化自己的，不是给别人拿去挥霍的，这一点，大家切记、切记。保护好自己的金钱，让自己过得越来越好。一个愚蠢的人，一个地位不对等的人，给他们希望，就会产生恶，他们不需要希望，别给，他们要的是轮回。


    我们总是被教育得太善良，而没有攻击性，从而忘记了我们是猎物或者猎人。当我们忘记了我们是猎人的时候，我们就是猎物了，就是别人的盘中餐了。社会是残酷的、现实的，各种妖魔鬼怪，各种没有底线的人，到处都是。别只教大家当好宝宝。我知道，一个暴发富要保护自己的财富，是要懂这些道理的，要知道穷毒，要知道人毒，要学会钱财比大多数人都重要这个理念。年轻人不懂有些人是有毒的，年纪大了，就懂了，很多人有毒。我们把别人当人，种种迹象表明，别人不把我们当人。我们没有害别人的心，别人会害我们。害人之心不可有，防人之心不可无。现实永远比电视剧魔幻。书上与电视剧里，都写不出来这个社会的坏人多坏。一阴一阳之谓道。


    伪装的美好，并不一定是真正的美好。他可能是恶毒的收割机。这叫伪思明。无头脑的暴发富，终究逃不过那些天天研究人心人性的小收割机。小收割机们，专业收割暴发富，他们天天建立自己的群，不断地收割暴发富，于是，他们年纪轻轻，就可以拥有跑车、豪宅、体面，以及好的生活。


    有些人研究书，有些人研究赚钱，而有些人研究利用人心、人性、'
  merge: -1
  img_proc: true
- pgno: 43
  md: '美色、两性，进行收刑。青春就是他们的收刑武器，就是他们的镰刀。割吧，看能不能持续割下去；割吧，在青春在的时候，就割得五谷丰登。


    当我们脑袋里有了错误的思想、思维模式，我们有钱也会败掉。奢侈品，或乱买东西，本质也是被收刑。除非，您要用这些东西去收刑别人。我以前很反感收刑、割韭菜这些词语，当我见到了各式各样的镰刀，我才能理解，这就是社会常态，到处都是收刑机，或者联合收刑机


    其实这个世界上，不仅仅只有起码的金钱，还有很多灵魂性质的东西。您看那个人很可爱吗？那是一个毒。以后您就懂了。有些人的无耻是无底线的，别看或少看电视剧、电影，同理，也少看小说，真正的好东西，就是老祖宗的经典。


    电影、电视剧、小说看多了，您就会用这里面的东西去应对现实生活，比如开公司，做事业，恋爱，为人处世，这将让您损失惨重，错误的意淫教学，会改变人生。在农村的时候看多了，就以为大家都是汉白玉，但有些人的无耻是无底线的。当您试图对一个人好的时候，他就要您命了。以前您以为他是个人，后来，才知道他是个鬼。这个动物世界非常有意思。所以，各位，照顾好自己的钱包，未来最重要。其他人，就是交易思维，我给多少，您给多少，否则不交易。不然，您就要倒霉了。当您懂了有些人的无耻是无底线的，您也就知道您的生命可贵了。浪费了生命，才是最可耻的。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '不要盲目地去对一个人好，那等于自杀。您珍惜的东西，在有些人眼里，却一文不值，这就是真相。


    年轻暴发富，总是把那些不值钱的人看得很值钱。慢慢明白了，真正值钱的是手里的现金。而他们不值钱。这一刻，您就掌握了真理和钱。只有真正厉害的时候，您才掌握了宇宙真理，否则，钱就是纸张啊。


    老年富豪都很抠门，不是他们真的抠门，而是他们真的正确认识到了金钱的威力，年轻暴发富哪里懂这个道理。若是一个年轻暴发富就懂了，那么他就是牛人一个。


    穷人之间相互毒，也没关系，大家都穷。富人也不怕被毒，毕竟已经富了，而且有保护自己的意识了。最怕的是暴发富，富了，但是思想境界、头脑并未提升，于是，他被毒了，钱没了。人倒霉，是因为对人没有区分能力，这样就会损失很多钱，没有任何意义。要深刻理解到，人类社会就是动物世界，一不注意，生命就消失了，财富就消失了。世界并没有我们最初想象的那么美好，我们以为世界很美好，这是幻觉，世界上到处都是收割机。如果您的智力还低，则您的世界就是地狱。


    或许您错以为富人温柔，穷人凶狠，其实，有些穷人的凶狠比较昭彰，那是韭菜式的凶狠。有些富人的温柔比较隐秘，那是镰刀式的'
  merge: -1
  img_proc: true
- pgno: 45
  md: '隐秘书没钱的穷人，不会受到什么伤害，只是随大流而已。有些人，连伤害他的价值都没有。人在年轻的时候，总是狂妄，觉得自己很牛B。出去混社会过后，发现自己狗P不是。再想吃一口回头饭，又如何？连伤害他的价值都没有，连复仇的欲望都没有。不知道自己几斤几两，混了几年，就是老了几岁？还能卖一份额价钱？荒唐的思维拥有荒唐的人生。


    人好的，我们就对他越来越好；人坏的，我们就让他离开。很多人只会赚钱，而不会保护自己，接触不对的人，于是财富没办法累积，这些人还喜欢做圣母，简直是自取灭亡。有钱的穷人、暴发富糊涂一时，才会受到伤害，那是因为他们还不懂这个群体，被一抢而空，后来，他们学会了保护自己的财产，只是还没离开，再后来，他们离开了，也学会了保护财产。我不想伤害您，您也别坑我，公平交易就行了。我不想短命，也不想您短命，至于您作死，是您的事情。这就是良知。


    做生意的过程中，我只喜欢与大老板交易，是有历史客观原因的。我必须用非常势利的模式来经营人际关系网络。我们不是不懂爱，而是当我爱您的时候，您却砍伐我的生命之树。既然您要天理，那我就用天理对付您吧。我们都不过是年轻的一块肉，会老去，不值钱了，天理就来了。


    但愿您醒悟过来的时候，您还有钱，或者还年轻，或者还有赚钱的能力'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 2.3 巧言乱德，小不忍则乱大谋


    隐恶扬善，我认为这个观点有很大的问题，要让恶的也让入明白，善良的当然我们要学。否则，很多人不知道这个社会是丛林社会，有很多坏人，他就会上当。大多数人的财富，就是被那些恶人给诓骗了。要知道有些人恶，要知道有些人善。分得清楚善恶，这个人才过好人生。我觉得，现在的问题，就是讲恶的太少，导致很多人成了被人割的韭菜。


    有些人很会说话，巧言乱德，为达到目的，坑人也在所不惜。这种人，我们不要跟他们交流 说话。我们有时候善良，可能是为了帮助某些人，但某些人就借着您的善良，采取巧言乱德，进行糊弄您，给您造成损失。所以，不要跟喜欢把黑的说成白的，把坏的说成好的人交往。大家心里都有一杆秤，您糊弄谁呢？


    有些人为了目的，不择手段，为了自己的利益，愿意坑害别人的利益，这种人，往往能说会道，巧舌如簧。他们糊您的，是无关紧要的；'
  merge: -1
  img_proc: true
- pgno: 47
  md: '整您的是真正导致损失的，这就是巧言乱德之人。巧言乱德的人，不要交往。小不忍则乱大谋。这个忍，也不要忍那些巧舌如簧的人。


    巧言乱德，小不忍则乱大谋。巧言乱德，文过饰非，黑的说成白的，白的说成黑的。张仪苏秦，大概就是这等本事。这等本事，对自己是有好处，可以荣华富贵，拜将封侯。但是他的朋友，相信他的人，那些君王，有的丢了脑袋，有的割地赔款，可算是认识这种巧舌如簧的人倒了八辈子霉了。所以，我们见一个人，如果他巧舌如簧，喜欢乱说话，喜欢颠倒黑白，自认为自己聪明，就永远不要跟这种人交流交往了。能拉黑就拉黑，能不搭理就不搭理。


    不要人云亦云，别人都说这个人好，也可能是这个人善于欺名盗誉，并非真的他就是那么好。要考察事情的真相。管理者不考察事情的真相，下面的人就可能不断地欺骗您，误导您。不要那么容易被他人调动情绪，要懂得真相才是最重要的。不要那么容易动怒。现在互联网上，很多视频、文字、图片，都是为了煽动人，达到他们自己的目的。您被煽动了，只能证明您蠢。只跟正直的人交朋友，自己也要做个正直的人。不跟巧舌如簧、夸夸其谈、不说实话的人交朋友。


    没事，就去多赚钱，多搞自己的营销，赚钱养家，而不是被人煽动得跟无头苍蝇一样，到处吠吠。我们要专注自己的业务、自己的流量、自己的变现。我们不要去管网络上那些东拉西扯，搞帮派，搞斗争的'
  merge: -1
  img_proc: true
- pgno: 48
  md: '人的文字、视频、图文。见到这些人，直接拉黑就行了。不跟他们有过节，说话。


    有些人特别情绪化，没事就搞些莫名其妙的东西，在那里斗争，在那里搞破坏，在那里煽动人，有这功夫，不如写点文字，看点书，做点视频，自己去卖自己的商品，过好自己的生活。我是从来不参与网络上的各种帮派斗争的，我从来不参与网络上的各种意识形态斗争。老祖宗的思想够牛B了，我就解读解读，给有缘人、有钱人看就行了。


    社会上有很多人，成天设套整人，他们的良心大大的坏，别接触。我们只跟好人、牛人学习就行了。我以后也不跟谁搞什么金钱合作，完全没必要。我自己的事业发展好，就可以了。我这种人，本来就有自己的事业，所以，我没必要跟谁交往，搭理谁，我的时间很宝贵，就做自己的事情就行了。把儒家思想、陈昌文方法传播给十亿人，这个宏大的目标够我做的了，就不得了了。


    一切目的，都是为了把事情做好。事情做不好，一切都是假象。别人高兴不高兴，跟我关系不大。我不考虑任何人高兴不高兴，我只考虑事情做没做好。事情做不好，一切都是狗P。不听指挥、瞎干的，我们要剔除，别妨碍我们做大事业。


    坏人，我们把他们放远点，但是他们还是可以通过网络学习我们的文字、思想，提升他们的生活、人格。


    好人，我们放近点。听话的、乖的、好教育的，我们带在身边。'
  merge: -1
  img_proc: true
- pgno: 49
  md: '好人只跟好人玩，不要让坏人靠近。不要自己骗自己，这世界上，有些人是极坏的，您懂。只跟好人玩，只帮助好人，靠近好人。隔离一些人，您的人生才会幸福。不要帮助蠢人，没事多读谈农夫与蛇，东郭先生与狼。


    有教无类，我们尽可能福泽到所有人，如太阳一样，尽可能的照耀太阳系，但是我们也 不能伤害自己，否则我们自己就不能发光了，对不起跟着我们的虔诚的可爱的人。有些人确实不可教化，直接拉黑，隔离，不接触，否则，会让我们的生命蒙受损失。


    对财富的精准认识，对真理的绝对服从，才配说话，才配交朋友。凡是跟真理、财富不相关的，违背的事情，我们一律不说话，不交往。免得被坏人、糊涂人绕晕。我已经完全不顾任何人面子了。因为莫名其妙的以为别人好，会导致巨大的金钱、时间、精力损失。这是韭菜心理。我必须绝对实在，绝对尊重真理，只在真理中做事，不在真理中的事情，百分百不做。不听任何蠢人、闲杂人等的愚蠢说辞。人的心，本来就有明亮。不需要其他人来讲什么。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 2.4 做人最核心的是，远离烂人烂事


    对人性 的理解，对男女关系的理解，会让人进步非常大。有些人一辈子也不会做韭菜了，有些人还会做一辈子韭菜。思维错误，头颅里的电路图错误，系统运行错误，思维软件运行错误，都是活生生的一个头颅，有些人的头颅是负债，有些人的头颅是资产。有些失败是不可逆的，因为时间是不可逆的。大部分人理解不了这个，以为失败可以变成成功。一个人真失败了，就很难爬起来了。成功是从成功走向成功，而不是从失败走向成功。


    人的错误，人的失误，将会给自己带来莫大的痛苦。人的智力低下、犯错，结局都必须自己承担。一个小错误，是非常恐怖的，它会酿成大错，让您后悔莫及，没有任何办法。任何人，都会为自己的错误买单；任何人，错误过后，都会受到巨大的惩罚，没有任何人会例外。我们要做的，就是不犯错，或者少犯错。一个小错误，会变成极大的错误，一开始的错误，就会酿成严重的后果。永远不要犯错。永远不要犯小错。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '错误百分百是复利效应，会让您最后痛不欲生。


    错误是不可逆的，任何人犯错都会付出可怕的代价，我也如此，您也如此，没人逃得过。男人有男人的错，女人有女人的错。错了，自己承担就好，别叫疼。人是不应该犯错的，人没有任何机会犯错。人要做的，就是正确的，而且必须正确。自己错了，就立刻反思，以后绝不能不再犯。很多人都不愿意为自己的错误买单，这就是大多数人不会成长的原因。


    不要抱怨任何人给您带来的损失，不要抱怨任何人对不起您。任何人都对得起您，一切错误都是自己的眼光、判断力的问题，都是自己选择的问题。自己无智慧当然要负责任，没有谁为您承担结果，除了您自己。所以，不要怨恨任何人，好好做事。


    一切错误都是自己的，谁能深刻认识到这个问题，谁就是神。人的倒霉，基本是因为不能认清自己的形势。思维错误，会给自己带来巨大损失。犯错是特别可耻的，人生是不可逆的。犯错虽然可耻，但是我们要猛干，并且总结错误的原因，如果再犯错，就真的太可耻了。我们社群，我的书籍，就是纠正大家的思维，用老祖宗的正确思维服务大家。


    这世界，确实有非常多思维错误的人，他们还很喜理论。我早就不喜欢理论了，我知道社会是丛林法则，弱肉强食。比如，您给他讲，'
  merge: -1
  img_proc: true
- pgno: 52
  md: '女孩子在外面不要惹事，能躲就躲，这是生存法则。她看不懂，她来说，这是女孩子惹事了？这怎么是女孩子惹事呢？这些人，看似正义，实际上，是智力低下，不懂社会是丛林法则，弱肉强食，还活在幻想中，或者说理想中。一旦您判断出来那个人是个思维混乱的人，您就别争论，由他“奶头乐。”否则，您会把自己也搭进去。（《陈昌文方法
    72 大营销系统》里的圈层营销系统有详细的解读。）


    除此以外，人生中，最怕碰到吸血鬼、索取者。这些人，您付出了，他们都是认为理所当然的。他们还会编造一些话语说，您就是应该付出。


    但我对您好的前提是，我给了您软妹币，您要上钟，要服务好。年纪大了，没时间做单方面的付出了。那些做单方面付出的，都是智力不够。人生就是交易，别谈什么情啊、爱的。有空谈情说爱，还不如多爱爱自己的直系血缘关系。您爱您的父母吗？您是怎麼爱的？赚钱，做项目，首先对父母好，而不是对外人好。不是拿钱去给外人、陌生人，而是待自己的家人、父母好。


    选错人，选错事是人生最恐怖的事情。决策错误，后面无论干啥都是错的。这种领悟，不是年轻人、没有经历过的人能领悟到的。我以前听说选择大于努力，往往感到不可理解。现在跟很多人接触，经历过一些项目过后，才理解，就是这样的。一个人不行，您一开始就不要选择，不要犯错。让您失望的人？怎么可能只让您失望一次？江'
  merge: -1
  img_proc: true
- pgno: 53
  md: '山易改本性难移。从一开始，您就要选择正确。选人是一个最重要的功夫。


    跟谁交往，才是重中之重的哲学。只走正道，只立正命。一切邪恶的，邪念、邪人，思想混乱的人，皆不交往，不看，不想，不问。选择大于努力。方式比较重要。这个学问啊，太大了，没几个人能琢磨透彻，故而赚钱都痛苦。做人最核心的是，远离烂人烂事。


    没钱的人，我们就给他没钱的待遇；有钱的人，我们就给他有钱的待遇。人的实力、资金，就是其智力，也是其人品的体现。一般情况下，都是这样的。选错与您同行的伙伴，选错人，是一种悲剧。无论是恋爱，还是客户、合伙人都采取这个模式，这是天道。而您莫名其妙地对人好，一视同仁就等同于自杀。不懂人性，则到处都是天坑。懂了人性，才开始懂得保护自己。人与人之间，很是复杂。人生复杂了，就不交往。


    如果一个人，还需要多次沟通，就证明隔阂很深，就不需要沟通，浪费大家时间。人生简单了，单纯了，我们聊一聊，赚点钱，大家可以一起玩。我们现在都是采取这种模式来交流，来建立我们的陈昌文老板读书会、陈昌文老板社群。同时我们也不应该给人带去麻烦，只管做好自己的业务。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '人基本都是自己伤害自己。很多受伤的人，都是自己踏入了陷阱。开始是给别人设置陷阱，没想到别人不进去，最后自己待在陷阱里，受伤了。人的选择太重要。保护好自己的资产，保护自已脆弱的心灵，以及灵魂，这很重要。不要莫名其妙的去帮助人，不要莫名其妙的把自己的财产让给别人。


    有钱人，要学会保护好自己的钱财。刚有钱的时候，不太懂得钱其实很重要，老跟以前等级的人交往，结果就持续亏损。交往的本质，是要跟对等的人交往，否则不交往。谈客户也是如此，比如，我们就只做老板生意，搭建老板圈层，只做年赚几百万、几千万人的生意，否则宁愿放弃生意。


    # ### 2.5 做生意不筛选您的客户人群，就如同蒙着眼睛跑步一样危险


    能保护钱财的人的水平比能赚钱的人，高几个数量级。大多数人首先要经历过几次破财，才能明白保护钱财的思维更珍贵。打江山容易，守江山难。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '**更高水平的人，不做创业者的生意，而是做守业者的生意，**因为这些**人已经富有，钱更多，圈子更厉害。做他们的生意，也会赚得更多。不同圈子，不同定位，带来完全不同的客单价以及财富，选择百分百大于努力。如果您还不相信这句话，证明您的见识确实太少。**


    **做生意不筛选您的客户人群，就如同蒙着眼睛跑步一样危险。理解不了服务不同人群带来的收益不一样的人，这一辈子做生意就会命途多舛。**


    为值得服务的人服务，不要什么客户都要。有些客户非常浪费时间，是赔本生意，则不要做这种客户的生意，只服务优质客户。要挑选，一个人刚开始做生意的时候，什么人都接他生意，这是入门级选手，而且是愚蠢的。


    不同的客户带来的收益完全是不一样的，客户与客户的质量相差非常大。盯着优质客户，要有筛选机制。只召唤优质客户。我们不仅仅要求自己的服务很优秀，我们也要筛选优秀的客户跟我们合作。并非给您钱的都是好人，有些人是麻烦，而且是极大的麻烦。您服务他，他还会扯皮，举报您，无事生非，这是他们的性格决定的。您要做，就是甄别出来这种人，然后不要跟他们有金钱链接，并非什么人的钱都赚，切记。犹如恋爱、结婚，我们不仅仅要要求自己优秀，我们同样要筛选优秀的另一半，否则我们的人生将陷入灾难之中。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '人与人之间的思想差距、人格差距、秉性差距、智力差距是巨大的，是不可跨越的鸿沟，不要试图让所有人都理解您，您要找到的不过是同类，配得上您的同类。


    一个智慧的人，首先是从开始区分什么人可以接触，什么人不能接触开始。接触的人预示着您的命运，不是任何人都有资格做我们客户的。


    我们的客户也是我们的链接点，链接错了，我们就要倒霉；链接对了，我们就飞黄腾达。不要与不对的人接触，不要服务那些不值得我们服务的人。如果您对客户没有门槛要求，您就有很多垃圾客户、低端客户，这些人，会闹得您鸡犬不宁，不赚钱，反而会赔钱，还赔掉精神。即使这样也会碰到愚昧的蠢人，您别搭理他，别提醒他，以免跟他陷入辩论、扯皮中。不要跟愚蠢的人争论，真的没有什么好争论的，他喜欢怎么样，就怎么样。


    但如果您做高端客户，那么您就会越来越有钱，越来越顺心。做单子，只做大单子，利润高的单子，价格区分人群。人群这个东西选不对，您的人生就呵呵了。人与是有差距的，不要让人连累您。如果您不会筛选客户，不能做到高质量客户的生意，那么您这辈子，注定多灾多难。您是没有兴趣去服务低质量客户的，因为赚不到钱，风险还非常大。道德风险、闹事风险，都会非常大。高质量客户，赚得多，还顺心，您说咋选？'
  merge: -1
  img_proc: true
- pgno: 57
  md: '与先天德行具足、慧根具足的人交往，这样损耗最小。有些人会损耗您的人生，有些人会给您的人生带来些什么。努力并没有选择重要。服务那些高级一些的人，而不是去教会一些不会的人。


    只跟三观正的人合作，也只带三观正的人。三观正的人少，慢慢选，不要急。弄三观不正的人到团队，是团队的灾难。不要觉得自己特殊，可以出淤泥而不染，濯清涟而不妖。不要觉得自己不会被坏人、坏的价值观点影响。抱歉，您一定会被坏人影响。同理，您一定会被好人影响。所以，我们只靠近价值观正的好人，其他闲杂人等，一律拉黑。


    做事的艺术，没有选人的艺术高明。一个领导者，开始是学习做事入门，经历多了，就开始进入选人阶段。选人包括选自己的人，以及选择客户。任何人，情绪因素多了，选人没选好，都是他一辈子的灾难。而老板，应该是极端理智的。


    人，一定是有人欲的，而人欲是妨碍组织进步的根本。一些人的 人欲太强，导致整体平衡发展受到影响。一个人，一旦您不断地宠爱他，他就会骄傲，直到骄横跋扈而不自知。狂妄无知，猪油蒙了心，恃宠而骄。


    人多了，就会变成猜测的游戏。


    每个人，都在演绎自己想演绎的角色；


    每个人，都在唱自己想唱的悲欢离合；


    每个人都在情绪化自己，都在悲天悯人，都在怜物伤感。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '很多人以为自己是时运不济，是能力不行，智慧不够，其实只是价值观出了问题罢了。好的价值观为人生带来幸福，坏的价值观为人生寻来灾难。


    先讲价值观，再做营销，同意了，我们再深入交流；不同意，则我们不交流。不是什么人的钱都赚的，这个人对我们礼貌，懂道理，明事理，我们才赚，否则我们不赚他们的钱。很多人说，这样不是赚钱少了？不是，一点也不少，来的都是讲道理的客户，您服务起来成本低，沟通效率更高。同频很重要。其次，中国市场太大，一个小点、一小撮人群就能让您活得很舒服，若是您什么钱都想赚，您以为赚得多，其实不然，这其实是一个选择客户的问题，经商时间很长的人都未必明白选择客户很重要。


    儒家思想的价值观，是非常正的价值观，于人已都好。每个人应该学学，这是我们老祖宗的骨血，也是融入我们这个民族的文化。这是一个共同的标准。国学是修德的学问，也是改命的学问，如果您想过得更好，您必须学习国学，进入中国传统文化经典的宝库。中国老祖宗有很多经典、圣人经典，从心理生理、医学以及安身立命、立身处世、兼济天下方面都有述说。中国的国学经典是一个整体，一通百通的整體。


    学习了国学，儒家思想，您就知道人的一生，只应该与善良 性'
  merge: -1
  img_proc: true
- pgno: 59
  md: '格好、尊师重道的人接触。若此人性格不好，不善良，不尊师重道，则直接拉黑。不解释，不帮助，不辅助，不链接，不服务，不收费。好人应该受到奖赏，坏人应该受到惩罚，这是天理。不允许搞混乱这个价值体系。有些人会说话，能言善辩，天天想着糊弄别人，这种本质是坏的。无交往，无接触。把自己的业务做好就行了，没必要接触一些不应该接触的人。


    不要听愚昧的人发言、说话，不要给他们机会靠近您，否则您的命运将会受到他们的影响，这是真正的悲剧。您将破财，身体倒霉。人的身体也会影响人的心理。大多的灾难都是愚昧的人带来的。这是人生管理的重要一环。


    人生是隔离的艺术，也是靠近的艺术。隔离该隔离的人，靠近该靠近的人。隔离人要有勇气，靠近人要有虔诚之心。理解不了隔离一些人，靠近一些人的人，一生多坎坷，然后就算遂了。人的一生，只应该跟高手交往，远离那些霉运多的人。


    年轻的时候，我们玩游戏，都希望跟高手合作，后来我们经商的时候忘记了这句话，我们谈恋爱的的时候忘记了这句话。经历的更多些，毛掉了，发白了，身体衰弱了，我们忽然明白了，原来，生意、恋爱、合伙人，也应该找高手。


    他没有能力，没有智慧，愚昧无知，您不要去帮助他，更不要跟他'
  merge: -1
  img_proc: true
- pgno: 60
  md: '妻儿老小，您的事业就遭殃了，跟您混的组织内部的人因为您愚蠢的决策，人际交往而受到莫大的损失。


    人的一生，会遇到很多朋友，或明或暗，或好或坏，比的是看谁能早日摆脱那些德行有亏欠的人，而只跟那些道德素质过关的人在一起相互加持。一个人想坑别人，过了时间，别人就发现这人是个坑货，就不再合作了。一个人真正的帮助别人，才能结交到真正的朋友，才有真正爱您的人。


    社交电商时代、社群电商时代，贩卖的是精神，跟以前卖货的时代不一样了。我们的目的，是找到一群价值观相同的人，在一起快乐的过一生。若这个人的价值观跟我们不一样，我们就没有交流的必要，彼此浪费生命干啥？出卖原则与灵魂的人，就是丢人的。卖到好价钱，与卖不到好价钱，只要是出卖原则与灵魂，就是很丢人的事情。价值观绝对不允许乱。


    选择的智力，是大于努力的智力的。选择、决策的含金量比努力重要多了。选择不对，努力确实是白费。愚蠢的人不懂精神与思维的重要性，也理解不了高等圈层的知识。您若给他们讲，他们就要整您，不如直接拉黑。人与人之间的差距，并不是猴子与人，而是星际跳跃那么大的差距，每个人生活的世界都不一样，看似是一个世界罢了，不要与傻瓜交往，也不要回应愚蠢的人的谩骂，那不仅仅毫无意义，'
  merge: -1
  img_proc: true
- pgno: 61
  md: '还会引火烧身。


    自然界是很残酷的，没有温情，人类社会的有温情，这既是我们的羁绊，也是我们的美好。不过，总体规律来讲，我们还是是要尊重大自然的物竞天择、适者生存的策路。不要与低智力的人交往。他们根本意识不到他们的错误，还会拖延下水。


    一定要远离小人、坏人、恶人，不要想着去驾驭他们，修炼自己。您驾驭不了，犹如您跳进岩浆里找死。君子不立危墙之下，不跟小人做朋友，交朋友，不跟他们玩。


    我做社群，也不收小人、坏人、恶人，我怕跟这些人有什么关系。我们采取隔离、过滤的模式，不收小人、恶人。一个是价格过滤，一个是价值观过滤，一个是自愿申请书过滤，总体来说，效果越来越好。我们就定位到企业家这个群体、老板这个群体，这也是我们的品牌标签。


    如果您也是个小老板，您也可以采取我的模式去做自己行业的社群。做社群是一个长期工作，需要不断学习，里面有很多坑，您要做好心理准备，不断地踩坑，最后找到一种适合自己的方式。您也可以看看我是怎么做的，能学的，就学过去。


    能做好一个社群的人，必然是一个合格的老板，这需要修炼。能做好一个社群的人，并不是匆匆悠悠就能做好的，有难度。您得做好心理准备。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 2.6 人应该跟自己智力、能力差不多的人在一起


    在网络上，社会上，您要说您喜欢穷人，大家才会喜欢您。您要说您喜欢富人，大家就骂您，说您嫌弃爱富。每个人都说，我要帮助穷人，每个大佬都是这套说辞。但真相是，您只有帮助富人，有软妹币的人，您才会过得好，才能升官发财。因为您付出的劳动、智慧，他们才有能力支付您。所以，现在的套路是这样的：帮穷人说话，帮富人办事。您要好听话？他们就说给您听。但问题是，说给您好听的话不能发财。所以，落脚点，还是要帮富人办事。


    穷富是相对的，每一个人相对大富豪，都是穷人。每一个人相对非常穷的人，都是富人。别扯犊子，您年收入百万，就与年收入百万的人玩；年收入千万，就与年收入千万的人玩。这是合理的。别跟那些扯犊子的人玩。有些人不讲道理，他说他年收人数十万，您年收人数百万，跟年收人数亿的人比也是穷鬼嘛。别跟着这些人说什么，找准自己的定位，去做。别跟这种傻子吃闷亏。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '人应该跟自己智力、能力差不多的人在一起。差太远了，您做什么事情，他们就玻璃心。您觉得您吃亏了，他们就会觉得他们吃亏了。人越穷，越玻璃心。事情没有做，还天天要去安慰他们。无论是与人相处，还是结婚生子，都不应该找差距太大的人在一起。富人，不要跟穷人谈恋爱，这是天理。谁违背这个天理，谁就会倒霉。一个漂亮的穷人，如果嫁给了一个富人，这个富人花钱是想购买基因，而不是想购买思想。但穷人思想如同毒素一样，污染着富人的思想，水火不容，很难相处得好，相互看起来，都是那么讨厌。门当户对，还是要精神上、思想上的理解。否则，真的是痛苦。


    一个富人如果与一个穷人交往，大概率会被穷人算计，而且还会出现一种情况，就是这个穷人看起来非常有志气，喜欢鄙视富人，自尊心受到伤害。所以富人们应该是懒得与穷人交往，因为基本都是亏损。富人应该交往的，就是智力水平相当、积极向上、一个圈子里的人。


    人的财力要接近，才有交往的必要。还有一种情况，就是双方都懂得等价交换，都知道付出多少，回报多少。但是，这种情况下，只有高明的人才懂，大部分人不懂这个道理。


    我做互联网社群交往过很多人，带过很多人。与成千上万的人有过交集。数十万人，甚至上百万人，我们发生过间接的经济关系。有些孩子，无论您怎么扶他，都扶不起来。而有些人，只是默默的跟着做，'
  merge: -1
  img_proc: true
- pgno: 64
  md: '从来不需要我扶，他居然做得非常好，年收入数百万。慢慢的，我理解了什么是天命。确实，做事要看天命的。要知天命，而不是人力啊。高手一定是顺势而为。道家思想，不提倡凡人的努力。儒家思想，提倡凡人的努力。道家是自然界的大智慧，儒家是人间的大智慧，佛就笑呵呵，随便您怎么搞，我就笑。成败都是谈笑间，无所谓。


    # 2.7 人品问题、道德问题、格局问题，这个比营销技巧重要得多


    一个人要有明确的价值观，不要和稀泥，不要两面讨好，坚定不移地捍卫自己的价值观，宣传自己的价值观，对的就是对的，错的就是错的。这才是君子行为。


    只跟正人君子交朋友，只谈论道义、正义、圣贤言论，不扯犊子，不搞些莫名其妙的事情，不浪费自己的时间。玩自媒体也是这样，跟谁说话，找谁聊天，很重要，看到什么话题才参与？话题不对，绝对不参与；人不对，绝对不沟通。言必称圣贤，语必讲正义。这是一个正人君子要做的事情，您这样做，开始看似没什么变化，时间长了，'
  merge: -1
  img_proc: true
- pgno: 65
  md: '您就会慢慢地理解圣贤言论、行为，慢慢地您就变得优秀了。如果您遵循这个规则，您在互联网上，社交媒体上，也会变成一个牛人，迅速改变自己的命运。


    小心您交往的人，小心您参与讨论的话题，因为这会决定您的命运走向。人犯错，大多数都是因为交往的人错了，被其愚昧的坏朋友引导去干些没有意义的事情、坏事情，养成了习惯。思想与行为被坏朋友带偏了。好人不应该与坏人交往。也别试图去帮助坏人，感化他。您帮他的时候，他想着的是如何坑您的本金。对他来讲，这就是营销，是套路，您跟他说那么多干啥？一个人天生坏，您是改变不了他的，最好的办法就是离开，别交流。人跟人的差距非常大，这个是各位企业家、老板必须深刻认识到的。


    只办道义之中的事情，不是道义的事情不办。只办正能量的事情，绝对不弄虚作假。不为了自己的私利，破坏道义，也不为了同情弱小，害怕强大的势力就去办不道义的事情。一件事我们做不做，首先看道义不道义。


    做事要恳切、真诚，这样才能认识到事物的客观规律。真正老实地去探讨客观规律，不要带入个人情绪、个人利益，这个事情才能做好，做成。否则，会乱做，会出些坏主意，导致这个事情办得不那么顺利。


    所谓良知良能，其实每个人都有。一个人要想不上当，静下心来，'
  merge: -1
  img_proc: true
- pgno: 66
  md: '追随内心，而不是看别人说了啥，就跟着跑。一个人安静下来，再 看看别人说的，别人忽悠您的一切，您都能看得很明白。与人交往，首 先看人品，看德行，这些不过关，有能力，有事业，巧舌如簧，也变
    得没有意义了。您与人品差，德行差的人交往，您迟早被这些伪装的 人坑。


    人品问题、道德问题、格局问题，这个比营销技巧重要得多，人 品、道德是您的人设。您不能给人好处，就想宣传自己，这是愚蠢的。 要想宣传自己，首先想想，您能为粉丝带去什么。有些人是索取心态，
    注定人生艰难。吸引客户，做客户的时候，我们首先就是谈论道德、 儒家思想。先认可我们的道德、价值观了，我们再来谈营销、赚钱的 事情，方法的事情。不认可我们的道德、价值观，抱歉，您的钱，我
    们不赚。心正，心好，有道德，有价值观，比有钱重要得多。这就是 为什么我们要日日讲儒家思想，讲道德，讲价值观的原因。有了道德， 我们再谈财富，脱离道德谈财富，就是要流氓，愚蠢，这种人，我们
    不交往。


    我们讲话做事，必须在绝对的正气、正义之中。这才是大利所在， 然能做大做强。不要有任何宵小之徒的言论，也不能有任何私心。 说这句话的时候，我想起来稻盛和夫。


    大部分人是利益而奋斗的，少部分人为道义奋斗。所以，我们 要考虑道义与利益的结合，用这个方法来团结大家。不要对别人有过 高的道德要求，而是要对自己有过高的道德要求。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '我们要为整体利益考虑，要为有正气的人考虑，同时，我们要反思，要理解一切错误归根结底，都是自己的错误，要修正自己，而不是要求别人。只有真正具有公心的人、毫无私心的人，才能理解智慧，才能交往到真正的朋友。有私心，为自己的人，高手都会远离他。


    对待客户，应该只讲真话，不应该有半句假话，这样您的营销成本最低，不要怕丢掉客户，无所谓的。


    讲真话，人生没有负担；讲真话，就会召唤到对应喜欢真话的客户相互支持；


    讲说话，就会召唤到对应喜欢说话的客户相互谋害。


    讲真话，人生没有风险；


    讲假话，人生风险才大。讲假话，天天算计，也被人算计。


    讲真话，晚上睡觉也香。不用算计别人，人生的心理成本、头脑成本都变低；


    讲真话，朋友就越来越多；


    讲假话，朋友就越来越少，还会招来祸害。


    只讲真话、实话、直白的话，不要想着忽悠别人，往往把自己给忽悠了。不要想着骗别人，对谁都要泾渭分明，都要讲真话、实话。讲假话时间长了，会把自己骗了，最终损失最大的那个人是您自己。无论是在恋爱，还是在合作关系中，骗别人往往都让自己损失最大。在恋爱或者合作关系中，当您发现这个人是骗子过后，您就不应该继'
  merge: -1
  img_proc: true
- pgno: 68
  md: '续合作了。一旦您发现一个人是骗子了，就不要搭理他了。一个人能骗您一时，就会永远的进行欺骗。骗子很少有悔过自新的。每个人有每个人的性格，不要试图改变谁，我们只能选择对的人去交往。一个人说假话，会习惯性说假话，一个说假话的人没资格跟您一起喝茶、吃饭、聊天。


    讲真话是非常划得来的一件事，只是，很多人不懂这个简单的道理，很多时候，都是谎言酿成了更大的风险。同样，看一个人说话，先看其为了什么，说什么对其有利，基本上，人都是自己夸耀自己的，无可厚非。但我们要从客观上去看待一个人，不可仅仅被一个人的言论给骗了，做了亏本买卖。


    在这个直播营销时代，小视频营销时代，更需要讲真话、实话、有用的话，这样大家才喜欢听您讲话。如果您直播间没人气，没有聪明人、有钱人听，证明您讲的都是废话。


    如果您讲直播不赚钱，说明您这个人没什么价值。如果您说的东西有价值，则大家自然每天趴着听，等着听。如果您没什么人气，就证明您这个人没什么意义。您要反思的是如何让每句话就都有价值，对大家都有真实的帮助。这个话讲出去，是不是对大家有帮助，不是您说了算，而是客户切身体会说了算。原则上您心里也明白您说的是不是真有价值。


    在有些人讲话，就是忽悠，混时间，讲混账话，把大家的时间浪'
  merge: -1
  img_proc: true
- pgno: 69
  md: '费了，并没有什么有意味的。天夭东拉西扯，不切实际。这些人就没人气，也没人付费给他，他还以为客户不理解他呢。实际上，是因为他天夭说废话，不老实，不虔诚，不真心。


    说白了，做直播不赚钱的人都不是老实人，不是真心为客户着想的人。


    # ## 2.8 福德是一种资粮，是资本，也是粮食， 可以吃，可以翻身


    做人要善良。多做好事，多做善良的事情，什么都会有的。要极度善良，要感恩，要有德行，要努力。解决好问题，这样您才是一个好人。不要什么事都不做，什么事都做不好。为人多做好事，多做善事，面相就善良点。真对人有贡献，什么都会有；真对人心有贡献，什么都会有。每个老板，都要对您团队里的人心有贡献。心对了，什么都对了。积德行善，进德修业，什么都会好起来。


    相反，心里不舒服，喜欢抱怨，心里搞破坏，心念不对，语言系'
  merge: -1
  img_proc: true
- pgno: 70
  md: '统就不对，然后神情就不对，这人，就坏透彻了。有些人面相恶毒，心里恶毒，故而无财。骗子会碰到骗子，交往骗子，君子则会远离他们。所以做人要老实，积德行善，否则就是自己给自己找麻烦，找不痛快，人生就会很惨淡。如果您已经为人父母了，就更应该“勿以善小而不为，勿以恶小而为之”了。


    父母善良的人，孩子就会获得福报。孩子混社会，就会碰到贵人，就会获得财富，也会靠近贵人，也会靠近善人。相反，父母恶毒的人，歹毒的人，孩子很难获得福报。孩子混社会，就会碰到人渣，不会获得财富，也不会靠近贵人。贵人见恶毒之人的子孙后代，也不会帮忙。为什么？家教、习性的传递而已。您会发现一个现象，能富贵，能过得比普通人好的人，他们的父母都是善良的人，或者，他们父母当中，母亲较为善良，或者父亲较为善良。若是父母都是歹毒之人，子孙后代就命途多舛，想要改命，难度就很大，要靠自己积累福德了。福德是一种资粮，是资本，也是粮食，可以吃，可以翻身。


    更善良，更真实，是赚钱的唯—秘密。善良的人有智慧。越善良，越有前途。恶人，就算聪明，也没用，迟早倒霉。您是一个好人，您自然发达，什么都会来；您是一个睚龅的人，努力、聪明，也没用。


    刚入社会时，我们追求赚钱的方法；进入赚钱的状态时，我们觉得疯狂赚钱，变现最重要；现在，我们发现把事情做好，把人做好，'
  merge: -1
  img_proc: true
- pgno: 71
  md: '比赚钱更重要。所以慢慢的，老板们应该学做人，而不是赚钱了。会做人，钱到处都是；不会做人，最多也是赚点小钱、快钱。做人到位，什么都有了。做人不到位，什么都没有。一个人能不能赚钱，更多的还是靠本性善良与做人。大部分人没有做人的能力，也没有本性善良，说啥也听不明白，这种人最多昙花一现。


    一个真正善良的好人，他自然会有人气，他不需要努力，都会有很多人气。人有人气，是因为他首先是个人。是个人，就会有人气。匪气就有匪，人气就有人，仙气就有仙。您有什么气？紫气东来，就有了《道德经》。您是什么气？黑云压城城欲摧？山雨欲来风满楼？


    人的命运都是自己造成的。人的福报都是自己种下的。


    以前我想赚钱，现在我只想做人。我只想彻底的洗涤自己的心灵，教人向善。人无善念，无善根，此人就无慧根，此人就进入无明，也就什么都不是了。做好人，带好团队。养成一股正气，真人真心，正心诚意，苦练社群团队、讲师团队内功，我们社群要修炼的就是浩然正气。不要干坏事说假话，干坏事说假话就会倒霉。一切错误都是自己的，跟别人无关。一个人，做人不到位，或者搞破坏，就什么都不行了。人生方方面面主要学习的是做人，首先要人正，正心诚意。要赚钱，必须要做人，更要学习做人之道。两者都必须做到，做得稳稳当当，这是我们社群里每个老板的追求。如果每分钟、每秒钟，都做到了位，应该是有钱赚的。不会做人，这个人基本上什么都完了，没戏。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '做项目，做互联网，做视频，做直播，做广告，都是态度问题。态度好的人，啥都能干好；态度不好的人，干啥都干不好。先做人，后做事，听起来让很多人头大，但这就是真相，能降伏其心的人，做事才能做好。


    态度好，事情就做得好，对人就有礼貌。态度不好，做事毛躁，什么事情都是浅尝辄止，做一会儿就放弃了，这个人啥都不行。为什么说做事先做人？这人不会做，人的态度不端正，品行不端正，就会体现在做事上，这事情自然也就做不好了。做人态度好的，自然也能赚钱；做人态度不行的，一辈子也不行。态度不好，不愿意付出，只想获取，这种人基本啥都完了。


    不赚钱，就是不认真，态度有问题。其实大家都心知肚明。有些人不适合赚钱，有些人人品不行，一旦发现这样的人，我们就应该疏远他。做人出了问题，您将一无所有。人能成长，主要靠修养。一个人不赚钱、没流量的本质，是不会做人，所以，要进德修业。您有多虔诚，态度有多好，利润就有多高。您不会赚钱的本质，是您态度恶劣，不会做人，人生有病，心理有病。您要是圣贤心，收入自然暴涨。其实您做不好项目，只是您态度不好，不会做人，不谦虚。李嘉诚大部分时间教自己的孩子学做人，少部分、极少部分时间教他们经商。所以，我们读书会、社群也是如此，要赚钱，要经商，先学做人。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '会做人，就会赚钱。做人，就是每分每秒都没闲着，都在释放价值，帮助人，搞流量，聊天，收钱，每秒钟我们都没工夫休息。


    不赚钱，说白了还是智商问题、格局问题、做人问题。有人搞不懂，为什么要集中精力释放价值，帮助人，拉流量，聊天，收钱？有人理解不了，为什么要投入时间、精力、金钱，打造自己的门面？有人理解不了，为什么要跟大家合作，大家分工合作才能赚得多？有人智力低，他以为搞别人的破坏就能赚得多，他以为自己算计一点小九九，就能赚得多。这些人，本质是做人
    与智力都有问题。其实，啥也干不好。智力、合作、投资，都是阶层问题。不是这个阶层的人，听不懂，没办法。


    赚钱是做人的问题，人情世故的问题，懂这个，来钱快；不懂这个，没钱，还惹麻烦。会做人，自然会发财。很多人一辈子不明白这个道理。小胜靠智，大胜靠德，您多支持别人，别人就会支持您；您经常帮助人，也会有人帮助您，慢慢的，您就算现在非常差，也只是暂时的，以后注定会发大财。我就是靠这个安身立命的。其实，除了您自己，没人会帮您，帮别人的本质也是帮自己，本质上您只有靠自己。您不帮别人，别人凭什么帮您呢？


    赚钱，首先是人品、道德的问题，这个懂了，什么营销都是简单的了。提升道德素质，让人心安；不能提升道德素质，就算富贵，人也心不安。远离道德素质差的人，靠近道德素质好的人。一个能占据'
  merge: -1
  img_proc: true
- pgno: 74
  md: '道德高地的商人，才是真正厉害的商人。每个人都可以变成神一样的人物，但首先是道德高人。修身养性，好好工作，好好做人。人难的是修心，变成一个彻底的有道德的人。您周围没有能人帮您，并不是您没钱，也不是您不聪明，大概是您无德。修德才能聚人才。人的成长，最厉害的是提升道德素质、格局、素养。人呢，全靠平常积德，您不积德，别人就不语真，看着您倒霉。不是人家喜欢看您倒霉，是人知道帮了这样的人，得到的不是恩情，很可能是仇恨。


    一个人没有美德，即使聪明，也没什么意思了；


    一个人有了美德，即使没有聪明，但从此却有了慧根。这个才是核心。


    # 2.9 陈昌文内部讲话：人不行干啥都不行，人行干啥都行


    教人赚钱，很多人都不會赚钱。


    教人做人，很快就会赚钱了。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '会做人了，钱要多少有多少。做人到位了，态度端正，自然赚钱。这个东西比其他任何东西都重要。还有几个我们社群常用的关键词，叫虔诚、感恩、老实、尊师重道，这是我们陈昌文老板社群的讲师每天都要讲的。这个比教人赚钱更重要。


    态度端正。你不赚钱，是因为你不会做人，你态度不好。大家都在这里，其实大家都有病，一个是身体有病，一个是有心理有病，身心健康，故而赚不到钱。


    比如说有些兄弟说，老师我去拉流量，去发私信，两个微信号，两个微博号，发十分钟就发完了，我没事干了，老师我没事干了，别人不给我钱。这本质上是态度不好。其实每一秒钟他都是有价值的，你永远在找人，永远在主动加别人的微信，这是微博。抖音就是永远在做视频，永远在爆粉，永远在直播，永远在营销，永远在搞文案，永远在搞创作。你不要告诉我，你没事做了。


    凡是生意人都是忙忙碌碌的。司马迁对着这个大河啊，看到这个船走过来走过去，这个就叫生意人，叫天下熙熙皆为利来，天下攘攘皆为利往。我们是商人，我们就是为了利，商人绝对不是坐在那里闲着发呆，没事做了。要不断地干，生生不息。我们做微博的一些兄弟居然十分钟干完了一天要干的活，然后就等着收麦子，这是不可能的。你没干活，你懒惰，是你的态度问题。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '我以前跑业务，我十七天就签了一单五百多万的单子。我刚做业务的第十七天，我就签了一单五百多万的单子，因为我十七天内做了很多人几年的工作。我早上六点钟就去跑业务，跑到晚上十一点钟，有时候没有地铁，没有公交，我都不知道该怎么办，荒郊野外。我脚上永远都是血泡。我跑线下业务的时候，脚上永远都是血泡。我穿着运动鞋，但是脚上都是烂的，两只脚都是烂的，拿个矿泉水瓶，水喝完了，见到臭水沟里的水都想喝。


    我的态度好，我见过赚钱的人都是态度好，至少表面态度好，我不知道他内心怎么想的，但是也有很多人特别恶劣。我接触到的凡是能赚钱的人，比如我带出来的学员，他至少表面上对我很尊重，他内心里到底是怎么想的，我不知道。


    但是我也可以告诉大家，你忘记了虔诚、尊师重道、老实，你没有这个心，事情就做不到位。我跟你说的，你都不会去做，你就飘了。你没有这个心，你心不对，你就理解不了为什么要争分夺秒地干，你就理解不了为什么我们这么忙，而你的眼里没事做。所以傻子他总是没事做，没事做，生命就荒废了，就像农民一样，你种地，你天天没事做，这个地里就长草了。等到秋天人家都在收庄稼，你就只有羡慕忌妒恨、怀疑、谩骂、负面。因为你没有见过这种丰收的情况，因为你自己就是成天荒废时间，你觉得大家都在荒废时间，那是你做人有问题，你的态度有问题。所以说我们首先要学的是态度，态度决定一切。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '虔诫，什么叫虔诫？我给你说了，你就去干，让你争分夺秒，你就去干。这个叫虔诫，要不然你来学习啥？听啥？让你去打造形象，你就去打造。但你不打造，老师讲的归老师讲的，老子干不干归老子干不干。


    跟有些人讲话，有些人跟我聊天，我没有办法跟你聊。因为你就是个不虔诚、不老实的人，而且你的态度也不端正，你理解不了尊师重道。我也没有办法跟你讲道理，这是你做人不对，有问题，所以你赚不到钱的。


    还有一些人，他有一个问题就要来问我，有一个问题就要来问我，或者去问其他老师，一点不思考，这也是态度有问题的人。没有智商，你做出了出格的事情，就是因为你没有智商和态度有问题。没有智商的本质是态度有问题。


    佛法当中讲，智慧是由善良生起的，聪明是学得来的。只要这个人一心向善，他就会接触大道，因为大道就是向善的。所以说你不聪明没关系，你只要善，善良。这个善良很有意思，有些人，客户来了，客户怼他两句，他就开始跟客户对着骂，结果客户举报他，他微信也被封了。人家还到微博上去骂他，那你就倒霉了嘛。那就不赚钱，因为你不善良。那么什么叫善良，你去帮助他，你跟他交朋友，慢慢向他推销，是不是就出单了呢？


    人不行，干啥都不行；人行，干啥都行。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '你之所以不赚钱，做不好视频，拉不好流量，没有出单，没有聊好，就是你不行。你不行，你要想办法让你行，而不是怪罪项目难做，不是怪罪老师没有教好，不要伸手问别人要，这是起码的人格。要从自己的内心里去找问题。行有不得反求诸己。你伸手问别人要，别人给你了，你还是不够，只有你内心升起来。要靠自己，自己去把它搞懂，你自然有流量，自然有变现。所以说还是你的态度问题。做人出了问题，自然不赚钱。


    我们群里有几个小姑娘赚钱很厉害，态度就是特别好，真好。有个小姑娘，我本来起心是把他骂走的，没有骂走，态度比较好，所以她的赚钱速度也在提升。反思自己啊，吾日三省吾身，为人谋而不忠乎？与朋友交而不信乎？传不习乎？


    我们在一起做项目，什么叫忠？你这个家伙是不是一个背叛的性格，做着做着就要搞背叛的事情，那这个生意就做不长久，你跟谁做，也都做不好。与朋友交不信心？天天失信于人，你当然啥也干不好。传不习乎？我告诉你了，你就要去做到位，听话照做执行。这六个字、三个词语，也必须是足够虔诚和尊师重道，你才做得到。你不虔诚，你不尊师重道，你也没有感恩之心，我告诉你了，你执行不到位，而且我在跟你交流的过程当中，我也不敢强迫你去做，因为你会反感，因为你没有这颗心，所以你的这个功夫就下不到位，你自然赚不到钱。功夫下到位了，无论是我们的微博，还是我们的抖音，他都将给你带来相当高的收入，一点都不难。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '你反思是不是你做人出了问题了？你做人对了，流量自然来，也自然成交。永远不找借口，没有任何借口。你不要告诉我你有什么事情，你做不好流量，你做不好视频，你做不好变现，不存在的。有人能做得好，人家做得好，就谦虚向别人学习，去多给别人捧场，多说别人好话，就不要去黑别人。我们有些人有点小肚鸡肠，看到谁做得好了，就去攻击别人，就说别人不行。那你这个也是做人出了问题了。


    有个老板给我讲了几句话，特别有意思，他说一个人厉害了，你就要去团结他，而不要成为他的敌人。这也是做人的问题。因为我们很多人是看不得别人厉害。


    永不找借口。我们社群里老师教的方法，就是能赚钱的，有人实现了，并不是我们在这里瞎讲。有人实现了这个数据，你也听得懂，你没有做到位，百分之百是你的态度和做人出了问题。


    你什么都对了，别人是错的。你什么便宜都占到了，别人没有占到便宜。你聪明，你什么都做不出来。人笨一点，才能理解什么叫虔诚，什么叫尊重。人聪明了，就理解不了什么叫虔诚，什么叫尊重。


    我们群里有很多人之所以发展前途不是特别好，就是因为做人太聪明了，也太自私了，也不理解什么叫尊重。这个东西是一个永恒的难题。我自己也在反思我自己。我看到有些人的行为，包括他说的话，我也知道这个人的境界就在这里了，想有前途，蛮难的。人首先是境界和格局的提升，然后能力的提升才有意义，否则是没有意义的。你'
  merge: -1
  img_proc: true
- pgno: 80
  md: '学到什么，做什么项目，都没有意义。为什么无论什么项目都有人赚钱，有人亏本。连炒房子这种事情，几乎是稳赚不赔的事情，也有人亏本。


    有些钱，你就是该给别人的。有些经历和温暖，你就是该给别人的，不要老是想着都捞到自己包包里。一个人习惯性地算计有形的钱财，他就会丢失很多无形的东西，而无形的东西才是最贵的，才是真正的宝贝。所以我看到我们群里很多人丢失了真正的宝贝，蛮可惜的。其实一个人能不能成功，能不能赚钱，大概率就是这些无形的东西做到位了。无形的东西做到位了，有形的要多少有多少。


    要钱要得少，获得的就多；要钱要得多，获得的就少。这就是传统文化、国学。少则得，多则惑。要得多了，一是别人不给，二是别人伤了。悠慢慢要，就能要很多。所有大生意，都是慢慢要。所有小生意人，都是要绝了。


    国学要求谋全局，也就是追求全胜；而普通人的思维，只是一点点的胜利。国学要求人善良，合于大道；普通人的思维模式是有点利润就上。不是长期利益的利益，本质都不是利益。国学思维才是对的，其他一切都是错的。如果您蠢，就多学点国学。然后把这些卖出去换钱。切记，一切都是用来换钱的。每个点，都可以变成钱；每一招，都可以变成钱；每一个动作，都是用来赚钱的。这就是赚钱的核心哲学。聚焦一个项目，只彻底聚焦一个点，然后不断地死磕。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '永远找方法。这是我们的六脉神剑（注：陈昌文老板社群六脉神剑：1、永远不放弃；2、永远找方法；3、永远不找借口；4、永远积极向上，百折不挠；5、永远不要情绪化；6、人行干啥都行，人不
    行干啥都不行。），不会做流量，找方法；不会变现，不会塑造价值，找方法；不会直播，找方法；不会玩微博，不会用多个账号去加别人的微信，不会私信，不会关注拉微信，不会找富人，都去找方法。找
    方法，而不是抱怨；找方法，而不是情绪化。


    你只要找方法，你就会成长。但是你要能找到方法，首先是态度 端正。态度不端正，你是找不到方法的。不感恩，不虔诚，不老实， 不尊师重道，做人态度出了问题，你就没有流量。没有流量的人，全
    部是做人态度出了问题。


    勤勤恳恳地工作，这是所有人都应该做到的，这是基本的。就是 你成为一个人，活得像个人，有个人样，你一天到晚对待你的时间， 对待你的生命，你得有个人样。我不敢要求你们是个人，因为是个人
    这个太难了，太高了。你像个人，我就很满意了，你活得有个人样， 对吧，你像那么一回事。你每天勤勤恳恳的，像那么一回事。我就很 满意了，我觉得你也很满意了，你的父母也很满意了，这就是态度问题。


    大部分人都有心病，有身病，精神上有病，所以导致自己事业上 有病，事业做不起来。


    永远不要情绪化。我跟你讲的是对的，你就赶快去做，你不要敌'
  merge: -1
  img_proc: true
- pgno: 82
  md: '对我，也不要敌对其他老师，也不要敌对同学。不要敌对。认认真真去干活，赚到钱，自己开心，自己去抵御风险。我们群里有个小伙子的父亲生病了，要一百多万，拿不出来钱，能怎样？所以不要情绪化，兄弟姐妹们要去赚钱，永远积极向上，不能有任何负面思维。因为你的负面思维多了，你就泄气了，最终是你倒霉，你的家人倒霉。我们做抖音，做微博都是这个样子。


    百折不挠，什么叫百折不挠？碰到挫折了，不是马上就撂挑子，这是什么屑人？碰到挫折了，要越挫越勇，一直去干。这是一个创业者的基本素质。碰到挫折了，不是逃避，是解决问题，是找方法。为什么我们很多人是软蛋，一辈子都没有本事？就是碰到挫折了，不干了。


    情绪化，什么叫情绪化？这个项目不好。不是项目不好，是你不好。大家要搞清楚，你没赚到钱，不是项目不好，是你不好，是你心出了问题，是你人出了问题。你要么战胜挫折，要么被挫折挫败。


    然后永不放弃，为什么要永不放弃？他有几个原因，我讲一个，不讲多了。任何项目都差不多，你做这个不想做，又去做那个。做那个不想做，又去做另一个。你这是给自己找罪受，你永远都做不起来。成年人是不以自己喜好去决定自己的行为，而是以它的规律，最终做下去有复利效应。你就在这一行，能赚到钱，这是成年人的干法。这是我们陈昌文老板社群、老板读书会的六脉神剑。'
  merge: -1
  img_proc: true
- pgno: 83
  md: '阿里巴巳的六脉神剑和我们的六脉神剑，你都可以把它融合起来。

    好的，我们都要去学。


    客户第一。客户是衣食父母，你每天都要去照顾客户，每天都要去教客户。谁是你的客户？你的粉丝、你微信里的人就是你的客户，我们群里的人就是你的客户。你把这些人照顾好了，他会给你搞传播。所以我们有些老师，我希望你们的心胸开阔一点，你都把这些人照顾好了，你的钱是会非常多的。但是你们不愿意，因为你们觉得付出就亏了。我们的大群里面有几千人，你就在这里照顾他们。你直播间里有多少粉丝，你就去照顾他们，他们是你的衣食父母，你照顾好了，就有钱。


    传播的本质是你服务好现在的人，他们自然会传播。你的态度有问题，所以没有人捧你的场，所以你赚钱比较困难。


    那个兄弟，他需要一百多万去治病，谁给他的钱最多？他说是他以前照顾的人，照顾我们微博群里的人给他的钱多一点。他没照顾的人，人家就不给他钱。他自己说的。


    团队合作，我们社群就是一个团队，大家都是这个团队的一份子，是互相合作的。什么叫合作？不是你我不合作，就不跟我合作，而是你跟我合作、不跟我合作也得合作。这是伟人的思想，当然这也是中国传统文化的思想。这叫势必之。我造成了这个势，你合作也得合作，不合作也得合作，这是大道，你走也得走，不走也得走，这是最高境界的团队合作精神，大家共同去赚钱。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '比如说做抖音，你帮了有些人，有些人不认账，对吧，有些人不帮你，这是你自己的问题。因为你在帮他那一瞬间，你就可以截图，做成文案扔出去，他就帮你做了营销。你不要企图去帮助一个人，他会专门抽时间来回报你，这太难了。姐姐、妹妹、兄弟们，这太难了，人们不回报你是正常的。你们把我这句话记住，不要有所求。是你自己的问题，你要摘果子，你自己去摘。你自己没有摘到，是你没本事，而不是人家不给你果子。


    有些人在摸藤，有些人在摸瓜，有些人被藤缠脑子，有些人早已经把瓜摘回家吃了。我要不要摘瓜，是我说了算，是我要摘。我希望大家把我这句话听懂，这才是团队合作的精髓。听懂了，你就再也不会怪别人不回报你了。我从来不怪你们不回报我，因为你们回不回报都得回报。我有时候说你，那只是一个营销技巧而已。所以我也希望大家学会，这个才是团队合作。共享共担。共担风险，共同劳碌，共同享受果实。


    平凡人做平凡事,大家都很平凡,做好平凡的事。人们之所以平凡，是人们只想伟大。能甘于平凡，做好平凡的事，一直做，这个人就会伟大。什么叫伟大？平凡的事做到极致就是伟大。你把流量拉到极致，变现做到极致，一天搞个几万块钱，你慢慢就伟大了。不愿意做平凡的小事，只想做大事，那么你最终就是个凡夫俗子。


    拥抱变化，迎接变化。抖音一直在变，微博也在变，也在改规则。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '勇于创新, 我们不去谈它, 一创新会出问题。诚信, 这是我们要去谈的, 不要欺骗任何客户。我们都是用阳谋, 现在进我们群的都是填自愿申请书, 不要搞诈骗,
    不要做黑产。每个人要把它讲得明明白白, 他愿意跟我们玩就玩, 不愿意就算了。


    诚实正直, 言行坦荡, 是什么就说什么, 不要小肚鸡肠, 不要心里面藏一些小九九, 这是给自己找不自在。越坦荡越诚实, 我们越有前途。而且我们也只要这样的人加到我们的读书会和社群里来,
    不是这样的人, 不签字画押, 我们不要你。你给钱, 我们也不要, 我们要找对应的人。这是价值观驱动, 使命驱动, 不是这个价值观, 我们就不要他。


    激情、乐观、向上, 永不放弃。这个在我们的六脉神剑当中也有, 乐观向上。你永远是乐观的, 不要成天愁眉苦脸的, 谁喜欢你, 对吧, 不要成天哭哭啼啼的, 不要成天抱怨,
    传播负面信息。传播负面信息的都是傻子。要有激情, 三天的激情不值钱, 长久的激情才值钱。这也是马云讲的。你们做项目, 搞流量, 搞变现, 搞个三天就不想搞了,
    没有用的, 还不如不搞。要搞就持续搞, 持续有激情, 你才会赚到钱, 才会做好。


    是你干一行爱一行, 干一行, 干精一行, 干透一行。干视频, 干抖音, 把它干透; 干微博, 把它干透, 干透了都能赚钱。干不透, 干啥都干不透, 啥都不赚钱,
    干透了, 干啥都赚钱。卖辣椒酱也赚钱, 卖榨菜也赚钱, 卖辣条也赚钱。你没有干透, 不是卖榨菜不赚钱, 而'
  merge: -1
  img_proc: true
- pgno: 86
  md: '是你没有干涉；不是做抖音不赚钱，而是你没有干涉；不是开微博不赚钱，非常赚钱，非常非常赚钱。有些人就是赚得很多。有些人是一年都不赚钱，那么一年过去了，赔老本，亏了两万块，亏了饭钱，吃了两万块钱的饭钱，为什么？因为你没有干涉。


    敬业，你敬不敬业？你不敬业，业不敬你。专注专业，执着、精益求精。你的话术、你的直播、你的私信、你的广告，是不是精益求精的？你对时间的利用是不是争分夺秒？你们做项目如果让客户找你麻烦，那就是你做人有问题。这句话我也希望大家记下来，那就是你做人有问题。如果这个客户还能找你麻烦，就是你的做人有问题，态度有问题。赚钱是态度问题。


    那么我是怎么对待赚钱这个态度的？我本人是怎么做的？我为了要赚钱，我学到一个东西，听到一个东西，我就会记，我会拼命地去记。比如说，我听一个老师讲课，我觉得这个东西能赚到钱。好的，我的笔记本本都会写几个的，然后我在电脑上也也会记录很多，我能写烂几支笔，写坏几支笔，我真是自己把自己感动了。而且我告诉你，我知道我这个态度一定会赚到钱。就是我还没有学会怎么样赚钱之前，我的态度已经感动了我自己。我心里非常清楚，我一定会赚到钱。我就是这个样子的，我非常清楚，我一定会赚到钱，你们清楚吗？对不对？这个是我教会你们的。我听到了这个老师讲怎么样去赚钱，怎么样去搞，我就不断地记录，不断地写，不断地思考，而且我非常清楚我'
