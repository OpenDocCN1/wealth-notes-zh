- pgno: 28
  md: '您自己去把它搞复杂了。


    # 1.7 陈昌文内部讲话：火就是热的，冰就是冷的


    为什么有些人会上当？比如说她找个男人，这个男人在坑她。一会儿她又讲这个男人是个好人，她会反复的去为坏人找借口，这就是很多人上当的原因。


    这个人他被人坑了，本质上是他自己头脑糊涂的原因。有多少人能明白这个道理？你自己会说服自己跟坏人在一起，然后就会稀里糊涂的有很多成本。


    你跟脑子糊涂的人在一起，你就是没有办法搞。对吧？员工要开除，他说员工还有好处，把他留下来，怎么搞？对不对？这怎么搞？高手是有原则的，一句话叫做一次不忠，终身不用，其实就是这个原则。他是有原则的。你有原则，你周围的人都有原则，你才能活得好。


    你成天稀里糊涂的，你贫穷，你赚不到钱，你讨厌贫穷的环境，


    你去怪你爸妈，给你生的环境穷了，你说你条件差，你说这个老师没'
  merge: -1
