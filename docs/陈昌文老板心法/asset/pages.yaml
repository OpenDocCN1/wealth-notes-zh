- pgno: 213
  md: '谈项目，谈生意，搞推销，只是他们谈的是国与国的推销，国与国的营销和合作，但本质上他们也在为国家找出路，找饭吃，是不是？国家出去搞石油，搞粮食，搞能源，搞资源，搞码头，搞各种各样的制造业订单，你们以为在干什么？他也在签单子，他签不到单子也不行。


