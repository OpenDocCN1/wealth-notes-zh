  md: '产品与服务的本质就是购买理由。任何人都不知道自己要干啥，要买啥。您让他干，他就干；您让他买，他就买。这就是人类社会。每个人都在缘木求鱼，每个人都在盲从。任何人都是机械的。觉者是少数。一切都是条件反射。


    不同阶层，有不同阶层 的角度；


    不同阶层，使用的思维工具是不一样的；


    不同阶层，计算模式不一样。


    文青愚蠢，计算模式是玄学，是根据动物本能的。高手呢，头脑越来越精密，可以透过现象看本质，于是掌握了一些规律。


    规律是什么？不过是数学公式。任何人都是鸡对鸭讲。


    每个人的坐标都不一样；


    每个人的阶层都不一样；


    本质是智力阶层不一样。显现的是权利、金钱、暴力阶层不一样。人与人沟通为什么那么难？因为宇宙中任何一个点都不重复。没有一个点，可能理解另一个点。除非此人成佛，是一个全息概念，则可能理解所有点。


    每个人都在述说别人听不懂的真理。每个人都很委屈别人不明白自己。高手理解这个思维模型。于是，高手只管述说，别人听得懂，听不懂也没关系，只要您的声音够广阔，就能吸引到很多人来听，声'
  merge: -1
  img_proc: true
- pgno: 4
  md: '音本来就可以同质化一些人，反正他们的脑袋不装这个，就装那个。您给他们装进去就行了。装的越多，您就越牛 B。怎么装？如何装？这是一个技术问题，是一个宣传问题。解决这个问题，就能解决金钱权利、暴力，一切资源问题。


    赚钱，以前靠激情，现在靠布局，靠利润高的项目，靠布局人才加入运营体系。赢得战争的核心是什么？


    +   1、增加人数。


    +   2、学员的人数、社群的人数、客户的人数、合伙人的人数、粉丝的人数。


    +   3、所有人，只有一个目标，就是人数。


    只要解决了这个问题，一切都解决了。繁荣的本质是人口多。


    一切高等级的营销，都是使用别人的营销。


    一切问题的本质，都是智力低下。


    一切税收，都是智商税。


    陈昌文'
