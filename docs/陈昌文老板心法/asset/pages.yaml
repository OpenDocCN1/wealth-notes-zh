  md: '个月，今年要干啥？这些人都是懒惰者。而活在当下的意思，就是我这-个小时要干啥？我这半个小时、我这一分钟要干啥？所以你千万不要搞长线工作计划，那都是骗鬼的，你自己都不相信，你计划好了，你做不做你无所谓。所有拖延症患者一辈子注定没前途。只要你喜欢等拖拉，OK！你这个人就没前途！


    我见过很多人他们都不劳动的，他们只是吹牛，他们不干活，但是他们都想要钱，这种人太多了。你无论如何给他讲，他都不动，他不劳动，他千方百计的避免去劳动，避免实质性的劳动，不愿意做事，又想发财，懒惰。


    说白了，现在赚不到钱的人基本都是因为懒惰，特别是在我们群里的人，都听明白了，还赚不到钱的人，我只能用“懒惰”两个字来形容他。你笨，也是因为你懒惰；你不会，也是因为你懒惰。因为你不去干，所以你不会。很多事情都是较为简单的，它并没有那么复杂。


    这个时间太宝贵了，一不小心就没了，年纪都大了，对吧？青春的肉体已经变成了老腊肉，然后快要死了，大家也不劳动。我发现这个人能堕落到什么程度呢？就是要死了，他知道这样，不去干活，不去奋斗。没办法生存了，他也不劳动。这样的人是大有人在。说的是你吗？兄弟姐妹们，说的是你吗？我们这个群里也有大把这样的人，你都快要死了，你还是不知道劳动。男的女的都一样，我也见过很多妹子，长得漂亮的，长得丑的，长的帅的男人女人，我都见过这样的人。'
