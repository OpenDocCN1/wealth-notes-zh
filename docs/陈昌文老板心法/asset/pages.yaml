- pgno: 188
  md: '无事就一定生非，这也是我们古人讲的。因为人他总想找点事情干，但是他不干正事，他就会干邪事，叫饱暖思淫欲，饥寒起盗心，吃饱了穿暖了，就思淫欲。当然这个淫有很多个例子，打猎，玩游戏，这也属于淫。不干活，就想成天偷盗别人的成果，这也是饥寒起盗心。


    我有没有这个心思？我自己去想。就像我们群里有个哥们一样，他看我们群里富婆太多了，他就挨着去发信息，想让别人包养他。这就属于饥寒起盗心。自己劳动的，你才能长远。你通过其他手段弄到手的东西，你吃一口少一口，也搞不清楚什么时候就没了。


    这个劳动会带来什么？劳动会让你心情变好，心理压力变小，劳动也能升起智慧。


    我们说一下营销的问题，我讲过很多次，营销就是占用客户的时间，你需要大量的劳动才能占用客户的时间，你直播播5分钟就不播了，播10分钟就不播了。你占用不了客户的时间，时间就被其他人占用。谁占用客户的时间长度越多，谁的营销就搞得更好。


    我们有一个调查叫做什么？你结婚的对象就在你几条街道之内，因为只有这样的人跟你偶遇的几率大。占用你的时间的几率大，为什么异地恋一般都是以悲剧告终？因为你见不到他，他就会被别人占用时间。他今天思想很端正，明天思想很端正，时间长了，就不端正了。所以说要占用客户的时间，一切好的东西都来自于勤奋。工作的收入，你身体的健康、心理的健康都来自于勤奋。你要去运动，要出汗，你'
  merge: -1
  img_proc: true
- pgno: 189
  md: '的心情就会愉悦，抗压能力会增强。


    我昨天晚上就讲了，我现在的工作强度，如果我不健身的话，我会压垮自己的。而且我的心理压力特别大，我会扛不住。健身它对我来讲是一种延续生命的方式，不然我的心脏受不了的。整个人的精神压力太大了。健身它能让我的精神压力减小，心脏压力变小。整个人的灵魂状态要扛得起。所以健身可以救命，这个好的东西也来自于劳动。


    其实我不太希望你们爬到更高的位置，你们也可以去爬，你们有兴趣的可以去爬，但是我也告诉你，你位置越往上爬，你所辐射的人越多，要照顾的人越多，你的精神压力会变大，心脏的压力会变大。如果你的身体不够强壮的话，你的意志力不够坚定的话，那么你很快会白头发，会掉很多头发，然后你的心脏会受不了。你会感觉到心脏压力特别大，然后你也会感觉到精神压力特别大，整个人魂不守舍的。可能你们很多人都看不懂，就是说为什么有些高官，有些大企业家他们老是吃心脏病药，你们觉得这是怎么回事？这些人老是吃精神类、心脏病类药？怎么这些人老有心脏病？对，他就是有心脏病。因为他扛不住压力，或者说他常年在这个状态下他就会得病。


    所以说根据你们自己的爱好，你们想往上爬的，你们使劲往上爬。你们觉得能扛得住的，你愿意去搞的。你不想爬的，你觉得一个人蛮'
