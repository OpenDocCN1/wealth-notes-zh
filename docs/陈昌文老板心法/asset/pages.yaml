- pgno: 280
  md: '所以“陈昌文”这几个字就是强大的品牌。陈昌文老师讲了什么？在你的朋友圈、直播间、视频里更新，他自然会买单。这是一种介绍式和传播式的营销，它会非常厉害。有没有听懂？你不要体现你很牛掰，你牛掰就卖不出去单子。你要体现这个品牌牛掰，陈昌文讲的儒家思想牛掰，陈昌文方法72大营销系统牛掰。然后陈昌文先生在群里讲的，都是在外面讲的只言片语，都是边角料。你进到群里也是学边角料，能理解吗？边角料就足够厉害。


