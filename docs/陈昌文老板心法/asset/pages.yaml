  md: '论你多自责，他也赚不到钱，所以说自责是没有用的。难受，然后感觉到压力大，也是没有用的。所以稻盛和夫讲，工作才是最好的修炼。工作能净化自己的灵魂，你的灵魂很痛苦，就是因为你不行
    动。


