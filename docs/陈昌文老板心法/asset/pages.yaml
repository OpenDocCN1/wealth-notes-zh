- pgno: 87
  md: '怎么去做，一定能赚到钱，我心里非常平和的接受了这些信息，并且努力的让这些能赚到钱的信息去统治自己。然后计划好了，一定要去执行。


    我的第二个特征是什么？我盯着一个项目，我会一直干，一直干，一直干，我基本上不会放弃，我是这样一个人。我不会说，我干一干，又去打工了，我即便是去打工，我也只是挣碗饭吃，马上就又去继续捡起来干。我绝对不会放弃，我不会失去信心，我是这样一个人，我只走这条路，我一定要把它整好。我不会三心二意的，我不会一会儿这个想法，做还是不做？不会的。我会一直干，一直干。所以说我觉得我能干好。


    我的第三个特征，我是没日没夜地去思考这个问题。我真的是坐车也在想怎么样搞营销，怎么样搞点文案，怎么样去跟客户说，我是头挨着枕头也在想，上厕所也在想。坐在电脑旁边就干活，拿着手机就干活，吃饭也在琢磨，洗澡也在琢磨。我不是坐在电脑旁拿着手机琢磨，我认为这样的人都是在混日子。我是在走路、睡觉、洗澡、上厕所、吃饭、游泳，都在想。


    我游泳的时候就在给自己打气，我经常晚上会去游泳，我使劲游，为什么要使劲游泳，因为我要变成强者。我游泳，不会算我游了多少圈。我可能会游一个小时，游得精疲力竭了，我就回去了。在这个过程当中，我不会去数游了多少圈，我一直都在鼓励我自己，我要变得更强大。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '我一直都在想，我要怎么样去做团队，怎么样去做营销，怎么样去搞流量。我都在考虑这些问题，然后打开电脑就使劲敲，拿着手机就干活，我绝对不会抱着手机在发呆，浪费时间。我是这样一个人。


    我相信你们只要做到我说的，你们不可能没有钱，你们不可能每天没有收入。我认为任何一个人，只要他做到这几点，他都会有收入，他都会比打工的挣得多一点。这是谦虚的说法，打工的赚一万，你不可能只赚一万，打工的能挣三万，你不可能只赚三万。我们群里有人天天出几十单，但是你就出不了，这就是人和人之间的差别。


    我的第四个特征，有点灭绝人性了，你爱学不学。有些人说我这个人六亲不认，说我这个人灭绝人性，以前有人说我就像个机器一样。我是不是机器，我自己心里清楚，不要别人来讲。


    我确实不跟亲戚交往，这是事实。我告诉你们，我从小 的时候，我不认为亲戚给我带来了什么，他们并没有给我带来什么。我混社会的前几年还跟亲戚交往，后面就不交往了，没什么好交往的。你说的那些，我都不爱听；我说的，你也不爱听。我要干的，你不喜欢干。我也没有什么朋友，我这种人，一般人不喜欢跟我做朋友的，我也不愿意跟谁做朋友。因为跟别人做朋友总是我吃亏，我不跟他们接触，他们老是想坑我。跟他们在一起，我就会损失，我不跟他们说话。我也不想跟那些有钱人接触，我也不想要谁投资我的生意，我也不投资别人的生意。你也别找我干活，我不跟你干，对不对？我没有时间跟你们搞。我就搞我自己的事情。不要跟我说那些没用的。我懂互联网，'
  merge: -1
