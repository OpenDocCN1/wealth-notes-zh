  md: '一样。所以我们社群里其他人，跟你走的更近的人，他做的工作越多，他对你 的好处就越大。


    所以治理政治的两招，


    第一招叫自己要努力干活，


    第二招要激励别人努力干活，社会就会变得更美好。


    那么子路又去问了，请益。就是你再多说两招，你就说这么两句？你说两句话就把我打发 了？有没有其他更好的招式？叫做请益。


    这是我们很多人的毛病，我们很多人跟子路一样，对吧？总是想找一个绝招，总是想找一个牛 B 的套路，总是想走捷径。我跟你说了这样做，你不这样做。孔夫子已经告诉你了这两招，你还要问。有什
    么好问的呢？我们赚钱也是这个样子，我们做抖音，做直播也是这个样子，天天做视频，做直播， 更朋友圈，卖广告。自己带头弄，然后带几百人弄。那么你就会做得越来越好。你不用问有没有其
    他绝招，就是这个绝招，你不要再问了。


    圣人的道理都是很简单的，很直白的，每个人都听得噓，人人皆可 为圣人，人人皆可成佛。人都可以成为大富豪，他真的是这个样子的，只是你不愿意去做，这就要 命了。人人都是可以修身、齐家、治国平天下，但是大家都不愿意做。就这两句话，没有人学得
    会，说起来都是平平凡凡的事，做起来都是天难，地难。


    你们去执行圣人的先之，劳之。'
