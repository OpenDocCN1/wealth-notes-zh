- pgno: 33
  md: '我们的儒家思想。


    什么是干货？一定是大师和老祖宗的东西，是干货，而不是你在外面抄袭的那些宵小之徒的东西。那些东西不值钱，值钱的就是孔子的东西。值钱的就是我们陈 文方法讲的大师的东西，你一定要告诉那些老板、企业家，我们是大师的东西，不是我们创造的。我们只搞大师的东西、老祖宗的东西，这个是干货。会有懂的人来给钱的。那么这些干货就是会导致他知道这个人了，你还要来学。


    就是卖东西，要卖到什么境界？不是你不知道，而是你知道了还要来学。你为什么要加到这个群里？我讲的就是老生常谈，你必须天天用这个洗脑，你哪天忘记了这个，你就要倒霉。


    我不是卖你“不知道”，我是卖你“知道”。你知道什么？你知道我是跟孔子学的，我是跟大师学的。我不卖信息差，我卖信息不差。我卖你知道的东西，这才是最厉害的营销。


    我们找男人，找女人，找对象也是这样子，我不忽悠你，我不骗你，我告诉你我是什么样的人，你去到其他地方找信息差，我这里没有信息差。你们都懂，但是只有极度聪明的人才会加到我们社群里来。笨蛋，他不会来的，聪明的人知道要跟着我们持续洗脑，学的是大师的东西。


    你去讲我跟你说的这些话，才是最具有杀伤力的。


    比如说，神秘营销，包括黄金分割，随便你怎么讲，他都是黄金分割。这些东西，只要我们活着，它都是黄金分割；你死了，它也是'
