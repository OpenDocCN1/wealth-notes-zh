  md: '年计划，15个5年计划，这个是有的。


    但是你不要把你放那么大，因为你管的事情就是搞点视频，搞点直播，搞点流量，也还没有那么牛B。


    做计划，时间越长你就越无所谓。时间越短，你就没有办法骗自己。大家记住，骗别人，这种人比较可怕；骗自己 的人，是最可怕的。时间短了你就没法骗自己，你骗了你自己，你马上就知道结果了，你就会发现你是个骗子。时间
