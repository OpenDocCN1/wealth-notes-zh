  md: '给你们戴高帽子。感谢你们来听课，在忙之中抽出时间来听课，但实际上不是这个样子的。根据我的经验，每个人都有很多空闲时间，一个人说他再忙，他都有空闲时间，其实大家的时间利用效率非常低，否则的话你们的业绩已经很好了。其实你们并没有把时间用到工作上，这才是真相。所以不要说什么百忙之中了，你们是闲里偷忙，而不是忙里偷闲。


    一个人再忙，他都有很多闲暇的时间，这才是真相。你们根本没有努力工作，虽然我天天叫你们努力工作，你们根本没有努力工作。努力工作的话，这个人的成绩会很夸张的，就是你会把你自己吓着的。你们包括现在能赚到钱的一些兄弟姐妹们，他们本质上都是闲里偷忙，不是忙里偷闲，还有那些赚不到钱的，基本上都是闲着的，成天只是假装在忙。


    人是需要承诺的。我们来看看孔子的承诺。


    子曰：“苟有用我者，期月而已可也，三年有成。”


    孔子说假如谁给我机会，谁用我，期月而已，期月就是一年，一年叫做期月。一年就可以有成就了，一年就初见成效了，三年就可以有大的成功。这是孔子对他的政治能力的承诺。你用我吧，我能干的，我能干，就这些活。孔子他有什么经历我就不去展开了，因为时间有限。他在鲁国是得到过一次大司寇的职位，但是由于他比较激进，大刀阔斧的改革，所以被群臣给赶下来了，说白了就是排挤掉了。赶下来不'
