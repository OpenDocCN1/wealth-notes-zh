  img_proc: true
- pgno: 108
  md: '和闻者，这个人他在初期的时候，他并没有名气，也没有真功夫，但是你能不能判断他是一个达者？很多人就会认为在开始有名气，有金钱的人，他是达者，但却不知道这个人是一个闻者。所以孔夫子的境界是透过现象看本质，但是这个特别难了。所以我教给大家的境界是下面一层俗人理解的，这层境界叫做什么？叫做谁有钱，谁就是对的。其实是一个不法之法。就是我们没有办法学到孔夫子那一层最高境界，我们只好退而求其次。我们讲你有没有年入千万？加到我们社群里来。你年收入过亿了吗？和我对接。实际上这个肯定是错的，叫一刀切。但是我们是没有办法。


    我们知道穷人当中，收入不高的人当中，也有很多人以后会很厉害，这是必然现象。但是我们没有办法去筛选。孔子这个境界叫有教无类，什么人我都可以教。比较差的人我也可以教，但是从一开始他就能看得出来你是什么角色。所以孔夫子的境界是特别高远的，我们选择的是下一层这个境界，等到你们真的修到孔夫子的这一层境界了，你们的每一句话，对接的每一个人，都是精准狠了。那就真正的可以做到，山川大地
    牛鬼蛇神，他都可以成为你的朋友，可以成为你的伙伴，也可以成为你的徒弟，也可以成为你的老师，你就可以教学。所有的人就跟佛祖的境界一样的，用孔夫子的最高远的境界，但是我们做不到。所以我们退而求其次。


    最后几句话：'
  merge: -1
  img_proc: true
- pgno: 109
  md: '1、我们的内部一定要相互照顾，近悦远来。我们要对我们自己的人好，我们的爱是有等差的，这是儒家思想很重要的一个东西，是有等差的。我们不会爱所有人，我们要放生一些人，谁跟我们走的近，我们爱谁；谁乖，我们爱谁；谁听指挥，我们爱谁；谁说我们好话，谁给我们付费了，我们爱谁。


    2、对内，我们要尽可能的好，大家一定要这样去做。并且要把这个话传达给社会，传达给粉丝。这是不一样的，我们内部和外部是有区别的，这是儒家思想。我对你付费、没付费也是有区别的。


    3、绝对不能够天天去讨好那些没付费的，他们跟我们无关。但是我们要广告，所以说我们要让大家知道。


    4、然后讲我们社群的唯一性，这个叫近悦远来。也是修练内功。把我们内部的功夫修炼好，不要众生平等，不要一视同仁，不要弃物论。所以你们不懂这个儒释道的，不要在我这里乱讲，我们昨天就有人在群里乱讲，什么儒释道是一家，儒释道不是一家！他的观念完全不一样，学不懂的不要乱讲，不要听到社会上的人瞎讲。


    5、儒家是最适合应世的，最适合做组织的。它是一个积极的东西。道家和佛家是另一个思路，另一个套路，有些东西是不能学的，它里面有好东西，你驾驭不了，就会走火入魔。我们选择儒家思想作为我'
  merge: -1
  img_proc: true
- pgno: 110
  md: 们社群的文化，它是有原因的。我们没有选择道家，也没有选择佛家，如果我们天天讲道家思想和佛家思想，我们社区里会教出来一群鬼，会教出来一群是很扯淡的人，我们都不敢去宣传那种文化。但你可以学一学，这个没问题，它里面确实也有很多瑰宝，也有很多好东西，但是它伤人的东西也更多。道教和佛教是猛药。乱世当用猛药。儒家思想是王道思想，它可以当饭吃，这也是南怀瑾先生讲的。道家佛家，是你得了重病，才去学。
  merge: -1
  img_proc: true
- pgno: 111
  md: '# | 第三章 |

    老板心法之命运


    > 懂道理、思维的人愉快地过了一生，不懂的人悲惨地过了一生，然后就变成土了。——陈昌文'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# ## 3.1 所谓命运，就是您的心态


    社会上大多数人的思维都是错误的，都是变成平庸的思维，只有少数人的思维是正确的，那是强者的思维。社会上，只有少数人能混好，大部分人都混不好，就是因为思维错了，故而人际关系、人生、命运都错了。脑袋里装什么，人生就是什么。思维错误，度过的时光就是黑暗的。您的恋人
    合作伙伴都是黑暗的。头脑里面思维错误，就会倒大霉，错误的思想，导致生命衰竭。思维正确，一切才是对的。只有正确的思想，才配活得好，否则，一辈子就可能白干。


    所谓命运，就是您的心态。


    我们的心态、行为，是一个企业家的心态、行为，我们做讲师，也能变成企业家。我们的心态是扫马路的心态，我们做讲师的人，就变成扫马路的收入了。您想想，如果您是我们社群的内部
    外部讲师，您是用企业家心态在传播吗？您想想，您是一个宵小之徒，只为自己蝇头小利而索取吗？是这样，您大概没前途。各行各业的人，也是'
  merge: -1
  img_proc: true
- pgno: 113
  md: '一样。


    看起来是大家都过了一生。我们过了一生，他们也是过了一生，都会死亡，一切都会死亡，鸟会死亡，树木会死亡，人也会死亡，都会死亡。都会离开，没有谁能做谁的保证，这就是真相。但懂道理、思维的人愉快地过了一生，不懂的人悲惨地过了一生，然后就变成土了。人，因为其思想而有价值；人，也因为其思想变得一文不值。人更因为其思想，变成了自己的负债。可怜的人，拥有的自然是可怜的思想。我们都在头脑的牢笼里。一切损失，都是因为头脑思维出了问题。头脑思维出现了问题，好棋也会下成坏棋；好局面，到嘴的肉也会吐出来，还会给肉跪着，连羔羊都不如。


    在陈昌文老板社群，我常对学员说，大多数人相信的东西，都是错误的，您跟大多数人一样，就是平凡的人。我讲的是少数人的道理，如果您不喜欢，证明您是大多数人，在我的层面，我不喜欢您，您也可以不喜欢我。我也不跟您讨论，相互默默拉黑就好。地球上有几十亿人，只有少数人是富人，这是为什么？是什么导致少部分人富有，大多数人平庸的？您是要研究怎么做富人？还是研究怎么做穷人？


    所以陈昌文老板读书会、陈昌文老板社群，只对接少数人，只服务有素养、懂得尊师重道，肯付出的、爱我们的老板，我们本来就不是服务所有人的，这是我们读书会，以及老板社群的定位。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '本人并非嫌贫爱富，而是贫富的背后，包含着太多的东西，而不是金钱本身。


    # 3.2 成年人的世界，就是努力赚钱


    太多碌碌无为的人，他们天天忙着去死，但是他们以为他们忙着去生。每个女人，都在做梦，以为她是仙女下凡。每个男人，都自命不凡，以为他能改变世界。而我的想法非常简单，大家多爆粉，多赚钱，收点单子，别扯犊子。成年人的世界，就是努力赚钱。在男女关系、父母关系、兄弟关系中，在成年人的世界里，您要是没有赚钱能力，您不值钱。很抱歉，您属于输家。人这玩意几，没有钱，不赚钱，就是没价值。别人看您，也就
    您是个废物了。一个人没价值了，他说什么都没意义了。一个人没什么价值过后，您连伤害他的动力都没有。因为伤害一个人，本身也是要付出代价的，而这个代价不值得付出。您想变成一个废物吗？您想受到人的轻视吗？不赚钱就可以做到了。人心有时候特别奇葩，您认输了，您就真的输了。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '有钱，就是外挂世界；没钱，就是苦逼世界。


    +   * 年轻的时候，以为是志向；

    * 年纪大一点，以为是理想；

    * 年纪再大一点，哦，他们玩的是艺术；

    * 现如今，大家都是赚钱的人而已，大家都是为了利润而已。

    * 生活有什么意义？

    * 就是捞钱，变现，搞单子，繁殖。


    活在金钱社会，观点是有优劣的，观点思维就是财富。既是囚笼，也是武器。天地不仁以万物为刍狗，思维观点当然没有对错。一切都是毫无意义的，宇宙本身是无意义的。但是，我们不能这样活，毕竟，这是神仙话。


    努力赚钱，是一个聪明人必须要做的事情。成年人，必须有很多存款，应对一切危机。您成年了，有了家庭，要赡养父母，您必须有存款，必须有足够的钱去养好您的家庭，还必须有足够的钱应对危机。如果您没完成这个工作，那么，您就应该调整好自己，心无旁骛的工作赚钱。成年人也不应该再大手大脚的乱花钱，每一分钱，都有去处，都是心血的浇灌。乱花钱是愚蠢的行为。


    所以我们必须有钱，必须赚钱，有钱是人上人，没钱是人下人。人分三六九等，社会非常残酷。有人莺歌燕舞，有人垃圾桶里找食物，您怪谁呢？有人阳痿早泄，有人金枪不倒，这就是人生，这就是各位'
  merge: -1
  img_proc: true
- pgno: 116
  md: '的悲欢离合，这就是同样的青春，不一样的结局，不一样的体验。有些人特别有钱，而有些人，一辈子都不如别人的一个游戏，或者一时兴起。这就是差距。人人平等，就是个傻瓜逻辑。人的人格、人心、灵魂、学识，以及能力、贡献，全不平等。人与人之间的差距，何止千里、万里。永远是强者制定游戏规则，强大的，才能虐杀弱小的；强大的，也能保护弱小的。弱小的出去，只能被强大的虐杀，要么祈求别人行行好，下跪只是一种赢得爱怜的方式，很难赢，您不是勾践，他也不是夫差。人人都知道要当一个强者，您是否愿意付出强者的代价。


    这个世界变得越来越枯燥，就是流量、变现。而我们要干啥？不过是不断地搞流量，变现而已。我们努力了一辈子，却抵不过别人一支烟。然而，我们还在努力。为了生活得好一点，我们要放弃很多，游戏、娱乐、无用的人际关系。我们要规律性的生活，该起床，要起床；该锻炼身体，锻炼身体。然后，把所有精力投入到业务上面。我们所有人，要干的，就是做业务，做业务，还是做业务，让业务好起来。年纪大了，都是惊魂未定的，都是竭尽全力地奋斗。年纪大了，叫醒我的是责任，是我人生必须要完成的任务，我的责任没办法完成，这才是可怕的事情。所以我只想工作，其他什么事情，我都不想干。一个男人，没有业绩，是鬼神都不理的，是没人愿意搭理的。一个男人，没有成绩，是混不好的。大家都讨厌。年轻人的目标，就是赚钱，其他的别想。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '男人，抓到了事业，失去了爱情，爱情还会回来。如果抓到了爱情，失去了事业，爱情也会离开。当一个男人认识到要当一个强者，认识到责任，认识到钱的重要，并且有钱的时候，他就成熟了，他就算一个人了。否则，他只能算没长大的孩子，或者韭菜，被收割。愚昧无知，则不尊重规律，倒霉的孩子。生活规律、合伙人的规律、恋爱的规律，都有规律。不尊重规律，就会变成韭菜。那些不值钱的东西骗走了真金白银。这就是低级人的世界。高级人的世界，他们只搞粉丝，变现，爆粉，收单子，搞的是智慧，卖的也是智慧，而这个智慧，轻而易举就能碾压低级人的物质消费。


    一个强者的经济基础，不过就是用来挤压那些没有经济基础的人的一切资源、生存空间，这就是真相。有钱，有智慧，远离屌丝，能自己去摄取自己需要的社会资源，帐号上躺着几百万、几千万、几个亿，这样的人生，就是好的人生。注意，没有智慧，理解不了钱是什么玩意儿，摄取不到自己想要的资源，此人就是失败者。衡一个人的价值，就是身体是不是健康？家庭是不是和谐？赚钱多少？帐号上躺着多少真金白银？真正的高手，从来都是靠业绩、结果说话的。多赚钱，不做亏心事。


    人必须进入疯狂工作模式，疯狂赚钱。工作的时候，要极度认真，不放过每一个细节，把自己的才智都发挥出来。平常与人相处，能过'
  merge: -1
  img_proc: true
- pgno: 118
  md: '得去就行了，没必要针锋相对，也并非习惯性搞人身攻击，浪费时间和精力。真有本事的人，也没心思跟任何人针锋相对，大家都默默做自己的事，更不会在意别人的眼光。当我们特别在意别人的眼光、看法说法，就会限制我们的行动。一旦限制了我们的行动，白白的时间就浪费了。浪费了时间，回头看来，一无所获，我们就感到后悔、失望。从一开始，我们就不应该在意别人的眼光，而应该根据自己的客观事实去奋斗。一个真正有价值的人，从来不担心一个无能的人在想什么。没有智慧的人，最容易被这些烂人烂事牵扯精力、时间，甚至金钱。


    而真相是，谁能快点奋斗到很多钱，谁的人生就光明些。谁的财务状况差，谁的黑暗人生就长些。这就是为什么我们要不断地奋斗，因为我们很多人还在黑暗人生中。单子多了，您的命运就好些了。年轻的时候不努力，年纪大了，您想努力又有什么用？精力跟不上了，您就是个废物，朽木不可雕也。所以一切必须按客观规律办事。生命是宝贵的，努力行善，努力赚钱，行善积德，德先财后。有钱与没钱，玩的是两个世界。有钱人有充足的物质、精神供应；而没钱的，既没物质，也没精神供应，还会被吸取走躯体与生命。各位，搞流量、变现，否则您的宙宙时间就没什么快乐。


    时间是很宝贵的，我不太喜欢浪费时间。时间最最值钱。我喜欢独处，喜欢一个人品味自己生命的流逝。不太喜欢把我的生命给与别人，特别是无关的人。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '时间比钱重要得多，蠢货才会浪费时间。我们的生命很短暂，我们的宇宙要消亡了，我们得抓紧时间赚钱，享受生命，否则生命消逝了，您这个人的宇宙就没了。真正的商业大咖、大佬，他们很多人是浪费他人的宇宙而致富。而我们每个人的宇宙每时每刻都在消亡，我们得多赚点钱。我们要珍惜时间，而且必须用时间换成钱，没这个判断力的都会付出代价。永远要把时间换成钱，而不是荒废了自己的时间，什么都没有，只有年纪的增长，那就是傻子，是自杀行为。大家忘记了赚钱，就变成了废物。古代做流氓，可能还有些潇洒。现代做流氓，只有死路一条。现代社会，想要过得好，就是赚钱，死磕项目，每天搞几十单，几千、几万的进账。


    智力比金钱更重要，头脑比金钱更重要，德行比金钱更重要，搞清楚这个。大部分人不值钱，这是事实。普通人的感情、理论，更是如此，这是事实。有什么样的智力、头脑、德行，就有什么样的人生。智力大于金钱，金钱大于普通人的感情、情绪。在人际关系、人生中，必须按照这个规则行事。我们必须学习赚钱的人的思维模式，发言、发音，并向他们靠近。要知道不赚钱的一切发言、发音，思维模式全部是错误的，会导致您直接生活在最底层。下层思维的人，拥有了下层生活，总是给自己找麻烦，总是自己坑自己，明明很优秀，但是一旦拥有下层思维，这个人一辈子，犹如浆糊一样了。


    人无智慧，就怪别人。人有智慧，就知道自己不中庸，没有做到'
  merge: -1
  img_proc: true
- pgno: 120
  md: '恰到好处，是自己的智慧问题。命运在我们自己的手里，我们头脑昏聩，我们要修为，不要让邪恶之徒来左右我们的正道，否则，痛心疾首。昏聩的头脑，无思维，思想，导致一个人终身贫穷，与幸福无关了。世界就是个丛林社会，弱肉强食。弱肉强食，天之道。愚昧的头脑，让我变成一个彻底的傻瓜，让我没有拥有财富、金钱，以及良好的身体，在这个情况下，我们如何应对？我们要理智、自律，不跟社会上的傻瓜接触，以免被毒。我们现在要做的，就是爆粉、直播、赚钱，搞营销，收单子。然后保护自己的头脑，保护自己的身体，保护自己的思维模式。


    没有人会为您负责任，除了您自己。您自己要想想您应该干啥，做啥，然后按照规律去做。人应该管好自己，而不是去要求别人，是找到对应的人，配得上自己的人合作。


    不要讨好任何人，老老实实地靠自己的能力吃饭。这个世界没有任何捷径，不要想着走捷径，不要想着靠别人。要靠自己，理解了这个，您就不会求索，也不会碰见富人、有能力的人就摇尾乞怜，或者希望别人提携了，自己才是自己的贵人。


    想想自己怎么才能找到饭吃，不要觉得别人干涉了您，导致您没饭吃，有这种想法的人，对所有人都是灾难。管好您自己，做好您自己的事情。您没饭吃，永远是您自己的错误，而不是别人导致的。一个项目就在这里，您为什么做不好呢？这就是您自己的原因啊。不要去干涉别人的竞争，而要思考自己哪里没做好。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '您自己才是自己的贵人，您追随内心，什么都好了，不要浪费时间在其他人身上。专注自己的业务，其他的别管。否则，您的人生将变得毫无意义。没有人会关心您，在意您。您心疼别人，考虑别人，别人不会考虑您的，就是这么简单。只跟真正有恩于您的人交往，其他人，能拉黑，就拉黑，没什么意义。我个人，不喜欢跟人结交，也不会找任何关系，一切凭自己本事，一切靠自己资金循环，一切市场化解决，包括以后的各种家庭生活。这样，人就能活得真正的君子。心里无亏欠，也不招惹任何人。


    照顾自己，照顾自己的跟随者。搞清楚自己要的，不要的别管。不需要的人与事，都隔绝，按照这个模式行动。努力赚钱，别顾影自怜。赚钱去吧。爆粉，直播，收单子，钱才是真实的，除此之外，没有人会真正的关心您，包括您的家人。当然明白了这个，不妨碍您尊师重道，孝敬父母。


    我对工作的看法是，聚焦。聚焦一个环节，竭尽全力的人配合去赚钱；我对钱的看法是，存下来，节约，不要乱花；我对家人的看法是，照顾好。照顾好父母非常重要，有血缘关系的人非常重要。一个强者，就是明白了只有您照顾血缘关系的份，但愿您别被坑多了。我们都善良过，现在，我们不伸出屠刀，但是您也别妄想再让我对您善良。我们收起了屠刀，但对您理智了，也不算冷漠。


    一个人要经历一些事情，才能理解商业、人性、人际关系，以及'
  merge: -1
