  md: '# **2.1 人的最大差距，就是人性差距、人心差距**


    没有参照物，这个世界就没办法描述。太阳系运动，根据不同参照物，就有不同的轨迹。千人千面，千人千眼，千人千心。且不同时间段，人心都不一样。


    人的最大差距，就是人性差距、人心差距。有了这个差距，才有了阶层。老板要不断地研究人心、人性。对人性不理解的人，这一辈子会吃大亏。没有主见的人，这一辈子也会吃大亏。


    人性差的人，往往聪明、狡猾、鸡贼；


    人性好的人，往往愚笨、憨厚、老实、亏损。


    人性差的人，看起来赚，其实亏大了，一辈子亏；


    人性好的人，看似亏，往往赚大，长远赚。


    人性过关的人，算大钱，有前途；


    人性不过关的人，喜欢算小钱，没前途。


    小楼一夜听春雨，深巷明朝卖杏花。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '人性决定前途。人性不过关的，跟我一接触，我就知道这人没前途，就算聪明也没有用。因为其人心错误，什么都错了。


    赚钱是人性过关，自然赚钱；人性不过关，这是硬伤，没什么前途。知识，可以学，而人心、人性难。有些人，无论学啥都没用，因为人心错了。人的心坏了，是多么恐怖的一件事。这就导致人无论多努力，都没什么前途。发心出了问题，干啥都干不好。其他都可以包装，唯独发心包装不了。但行好事，莫问前程。诸恶莫作，众善奉行。


    做人先正心，心不正，干啥都没用。调不了心，就什么也不是。人心好，才能赚到更多的钱。我常说我们的素质越好，就越有前途，人心对了，不学都厉害。比如，很多人理解不了尊师重道，理解不了规则，到处搞破坏，这种人，属于鸟人。鸟人怎么赚钱呢？有人性就赚钱，没人性就不赚钱，赚钱不赚钱，靠规则，靠人心。能领悟钱不重要的人，才能领悟钱是怎么来的。财是德的奴隶。人到了
    一定的境界，能力就没什么意义了。有很多人不赚钱，来问我为什么？其实，是他们做人出了问题。这种问题，从德行，到品行，到私心上，总之，是人出了问题。


    人之视己，如见其肺肝然，每当我想起这句话，我都浑身冒冷汗。


    任何人，都没有办法欺骗别人。跟着愚蠢的人，会变得越来越愚蠢。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '如果您不赚钱，只能证明您是低智力、人性差。其实智力低并不可怕，可怕的是人性差。欺得了别人，欺不了自己的心。


    您是一个渣，您周围的人、都清楚；


    您是一个好人，您周围的人、都清楚。


    如果您是一个草包，您周围的人大概率都是草包；


    如果您是一个高手，您就能吸引高手。


    牛人注定是牛人，草包注定是草包。


    您的命运不好，是因为您周围的人、都清楚您是什么货色；


    您的命运很好，也是因为您周围的人、都知道您是什么角色。


    如果您对人不慷慨，别人对您也不慷慨，您就不会有高质量的关系。人有多少粉丝，有什么样的粉丝，有多少运气，多少前途，全部由您肺肝是什么决定的。自己是什么人，自己的跟随者就是什么人。所以，我们所有人唯一的目的，就是修炼自己。


    人是根本，财是细枝末节。心态错了，话错了，人生就错了。人与人之间的认知，犹如韩非子跟孔子的认知差距，犹如天上、地下，犹如火山、海洋的温度。朝菌不知晦朔，蟪蛄不知春秋。三观不同的人，可以闲聊，却不能交心，交心则友尽。同理，也不能谈情，谈情则反目情伤。人性是非常不可深究的。大家一定要关心自己接触的人，有些人，一接触，您就输了。您根本玩不过别人，您会亏死的。太多人只想占便宜，不想付出。这个世界上，有些人非常奇怪。他们只想着自己要什么，从来不想别人要什么。然后就想实现自己的愿望。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '刘邦乃牛人也，带着贩夫走卒打天下，这是超级高手，普通人做不到的。普通人只有与高手在一起，才可以做事业。


    我为什么要搞被动营销？要搞儒家思想＋免责声明营销？就是根本不想与任何人深入探讨什么。您看得懂，就来，看不懂，算了。


    营销是什么？不过是找到对的人。什么是对的人？感恩戴德之人，懂得平等交易的人。不是这等人不配儒家思想 陈昌文方法的教化，让我们也过不好，让其他的好人也过不好。所以，陈昌文老板读书会陈昌文老板社群要收的是老板
    高层次的人，而不是低能量 负能的人。您赚了低能量 负能量的人的钱财，相当于直接亏损，亏损生命能 ，亏损未来，亏损信心，亏损复利效应。


    人性是什么？好人就是好人，坏人就是坏人。


    家教差的人能力差，不能赚钱的人有缺陷，人格与行为 执行力道德的缺陷。


    人性是什么？就是您无分别地对所有人好，有些人就要搞死您，有些人本来是地狱众生，您为什么要跟他玩？他要把您变成地狱。做生意不筛选客户，就等于自杀。以前不理解，为什么瘟神也要孝敬。现在我理解了，瘟神就是拿来孝敬的，孝敬的目的是快速脱身，也就是送走瘟神，不跟他们玩。


    人性不可深究，一深入交往，档次不够，不是门当户对，就会被'
