    杰讨论的另一个概念是“边际净值/客户的终身价值”。


    很少有企业主做过这一重要分析，他们没有认识到它的重要性，大多数时候是不知道这个策略。这是一个强大的战略呀！分析客户的终身价值是检验你的公司业务的一种有效方式，这种方法绝对会让你感到惊讶。


    现在，让我们来看下“终身价值”是什么意思。简单来讲，终身价值就是一位客户从和你进行第一次交易到最后一次交易之间所花费的钱的总数量。假设实际的客户终身价值无法进行“最佳猜测”那就进行保守计算。保守计算就是一位普通客户在与你的公司进行交易期间为你带来的盈利数额。分析结果，看看你已经开发了多少后端，以及它的有效性如何。


    你一旦知道自己的盈利结果和盈利来源，紧接就能计算出争取一位新客户所要投资的数额。如果一位普通客户的终身价值取决于他第一次销售以后的销售，那你可能要谨慎小心地保持不赚不赔，或是在客户进行首次销售时不去过于计较盈亏，这样在之后的销售中你必定会获得利润。


    一旦你知道这些数据后，你就可以集中更多的精力在当前的客户，以前的客户，以及后端上，这样就可以大大增加你的利润。


    ### 终身价值是根据：


    - A、活跃客户的数量

    - B、客户的平均购买量

    - C、客户每年购买的频率


    杰还举例了，在“最糟糕”的情况下，你如何创造出利润的大幅增长。


    一位新客户：带来 200 美元的利润，每年消费 5 次，光顾公司整整三年，那么，其利润总和便是 3000 美元。


    销售团队：得到 10% 的佣金（300 美元）


    解决方案：通知销售团队，只要他们能够让客户完成第一笔交易，就能够提取 100% 的佣金（200 美元），这样的话，该业务还是能够赚到 2800 美元的利润。这样做不仅会使销售团队产生强大的动力，而且还能增加利润。


