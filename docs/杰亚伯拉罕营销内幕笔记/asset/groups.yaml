    ## 九、 电子商务的应用


    ![](img/5bb8d83a871eaf27152be19745107cea_113_0.png)


    对于网络和电子商务，杰拥有一些非常独特的哲学。他建议人们将网络作为自己当前与客户沟通系统的一个延伸。


    他举例说，电子邮件（还有微信）就是一种非常便宜、有效而又私人化的沟通工具。但是他也提到了，所有的沟通交流都应该是非常个性化的。他鼓励大家为自己的生意建立一个电子邮件列表。网站可以是非常有价值的，但是你必须要注意对其内容进行更新，要保证能够对你所提供的任何信息负责，要对你的生意和访问者都带来价值。他还劝大家，除非你的投资盈利了，否则不要在技术工具上投入太多。


    1、你目前在利用网络来提高你的业务吗？如果答案是肯定的，那么，你具体是怎样做的呢？是通过电子邮件吗？还是通过某个网站？


    2、通过利用网络，你获利了吗？如果没有获利，那么，是否有方法使你能够获利呢？


    3、杰认为，网络是进行调查研究了解和你的竞争对手的一种非常好的方式。你应该点击进入他们的网站，注意他们是如何定位自己的，他们使用什么样的标题，提供什么样的东西，等等。


    想一想，你自己是否做过这样的研究？如果做过，那么结果如何呢？如果没做过，那么请你研究至少两位你的竞争对手，并将调查结果写在下面的空白处。


    4、杰还建议一种方法：到亚马逊网站上研究你所在行业领域的各种书籍。这样做将会使你在文案及其它方面产生灵感。你曾经这样做过吗？如果还没有，那就赶紧上去看一看，并在下面提供的空白处记录下你的发现。


    ## 十、设定目标


    ![](img/5bb8d83a871eaf27152be19745107cea_117_0.png)


    杰表示，知道自己想要什么，想去哪里，设定目标是非常重要的。如果你目前的生意能够获利 10 万美元，而 你却想获利 100 万美元的话，那么，你为什么会有这样的目标呢？


    然后，杰说，你必须要从战略上一步一步地看着看应该如何实现自己的目标。让你客户每年购买的产品数量是目前的四倍，并且带来 5 个推荐，这样你就能离你的目标更接近了，而且不需要任何额外花费，因为你不需要雇用和支付更多的销售人员。


