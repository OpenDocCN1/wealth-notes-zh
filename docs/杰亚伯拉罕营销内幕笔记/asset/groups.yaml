    杰概括了几何式倍增与突破性进展的关键。他声称，如果你执行以下步骤的话，那么，在生意中产生几何式增长就会更加容易。


    - A. 始终坚持增加业务量的三种方法（增加客户数量，增加购买金额，增加购买频率）。

    - B. 不要在“跳木板”理论下经营你的生意，而是根据“帕台农神殿”理论使你的业务呈现几何式增长。就像之前讨论过的一样，要不断地在各个领域和多个方面发展多种策略，在你的企业中进行几何式的、整合的、系统性的发展。在营销、战略、创新以及经营生意的方式上，不断寻求突破性进展。要到你的行业之外去做这一点，研究其它成功企业所使用的方法，然后将它们整合应用到你自己的生意中。


