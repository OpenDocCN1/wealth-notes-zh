    \ ask@libingchi.com 免费咨询！\n\n再次感谢您的支持！\n\n![](img/5bb8d83a871eaf27152be19745107cea_1_0.png)\n\
    \n2014.02.16 于北京\n\n## 目录\n\n- 你需要知道的... / 2\n- 一、营销是一个过程，而不是一个结果 / 6\n- 二、让绩效最大化的科学与艺术\
