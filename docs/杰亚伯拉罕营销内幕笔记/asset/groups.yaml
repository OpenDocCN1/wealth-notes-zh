    的策略。也是我制定营销计划常使用的内部脚本。只要你拥有这个笔记，等于你拥有了杰的营销思维和策略精华。等于你节省了 10 多万元的上课费用，以及花上万元购买杰所有资料的费用。


    毫不夸张的说，这个笔记价值 100 万元也不为过，*你可以轻松的制定出你的营销方案*。就像我的 22800 元的《信手拈来，一夜之间改变你的广告》一样，你可以信手拈来、*轻松撰写出你的销售信和广告文案*。


    # 如何更好的来学习这些内容呢？


    为了使这些“内容”通俗易懂，便于理解，这花费了我很多心思。把那些复杂的内容都简单明了地呈现了出来，同时也是为了便于学习。难懂的字词和复杂的语句已经尽力避免使用了，这种做法对于你一开始的阅读学习绝对是有帮助的。


    要想从这份笔记中获得最大好处，那么，就需要你亲自动手，采取行动。


    首先，你可以通读一遍，大致了解整个框架。而不是去纠结某些细节以及你是否应该深层阅读它们，我建议你倒不如先有一个初步“感'
  - '[PAGE 5]


    “，去掌握这份笔记的整体内容。然后再细读，根据自己的企业状况来制定自己的营销方案。我在每个重要的策略后面都留有空白处，告诉你如何把这个策略运用到你自己的业务中。


    你可以把这份笔记打印出来，把阅读过程中遇到的疑问和意见看法标记下来，这样就能更快地找到需要解答的问题，它们会在你做好标记的指定章节中。此外，当你再次翻开笔记时你的重点标记将会变得很有价值，它们可以为你提供快速参考并帮助你进行全面回顾。


    阅读完一遍后，你有必要花几天的时间回顾一下你从中都读到了些什么，之后再返回去阅读一遍，在第二次的阅读中你需要把注意力放在标注的那些问题和想法上。你会发现再次阅读时第一次遇到的一些困惑已经有了答案。


    当然，如果你还是有疑问，那么你可以将问题寄给我（我的邮箱ask@libingchi.com），这是让我来帮你解答的绝好机会了。


    当你开始具体全面的学习时，重要的是要记住，一些章节对于你来说会是非常容易的，但也有一些章节读起来会很困难。并且你会发现每个人初步的理解水平都是不尽相同的。'
  - '[PAGE 6]


    还要记住一点，虽然尽可能地多学习多记忆东西很重要，但更加重要的是你得对讲到的信息有一个全面清晰地理解。当你想查找某个问题，或是进一步学习某个概念时，你得知道如何找到你想要看的那个章节。


    在你学习完本笔记的所有知识后，你应该制定一个营销计划。内容应包括你将做些什么，以及你的每个计划开始的时间。所有营销活动实施以后，你要试着估计它们需要经历多长时间才能给与你回报。将营销计划制定成日程表是一个很好的想法，这样你就能清楚地知道你的想法是如何作用于实际的营销活动的。


    同样，还可以通过制定日程表来记录核实你的追踪结果，清楚地了解每个营销方法的效果如何，也能检测出两种或两种以上的营销方法组使用时的获利情况。


    最初的营销计划必须是非常灵活的。当你发现你所做的事情获利颇丰时，你就会想再做一次，而那些被证实无利可图的事情就不会再去做。用不同颜色的笔标注好你期望的结果花了多长时间，这样就能一目了然地知道最终结果与你所期待的之间的差距。


    现在，让我们开始吧！'
  - '[PAGE 7]


    # ## 一、营销是一个过程，而不是一个结果


    ![](img/5bb8d83a871eaf27152be19745107cea_7_0.png)


    营销不是一蹴而就的，它是一个持续的过程。它不是简单的做广告或是通过销售信来销售。我们这里所说的营销是指通过使用各种不同的手段来进行销售。每种战略、战术和技巧都会促进销售，然而，如果组合使用各种策略的话效果就会成倍增加。每一个策略都会为同时使用的其它策略加强效果。


    如想达到预期目的，这需要付出一定努力，整个过程也就变成持续不'
  - '[PAGE 8]


    断地吸引新客户，促使客户每一次都进行更多消费，同时还要提高他们的购买次数。


    不要忘记使用一些小策略，当它们被利用在大一点的营销活动时，可以大大提高销售额以及利润。当很多东西作为一部分使用在营销活动中时，就会产生一种协同效应。每一种技巧都会从其它技巧中汲取有用的成分并为它们增添光彩。


    事实上，多种策略的组合使用，比分别使用各个策略要好得多。


    营销就是充分利用每次我们看到的机会、有计划地去接近客户和潜在客户；它是通过转介绍和他人的推荐、通过直邮和合营企业获得利益；只需通过客户的直接反应我们就能衡量结果。


    营销是一种测试，是一个学习的过程；它是同其它企业拥有者进行交谈、交流想法。所有这些做法会使我们的营销活动变得更为简单，并取得更大成功。我们的努力可以是“无限”的。


    假如你花 5000 元在一则广告或是销售信上，那么不管这个投入能否为你带来利润，你都将花掉 5000 元（不管你得到的订单是 50 个，100 个，还是 500
    个，你的花费都是一样的。）'
  - '[PAGE 9]


    针对一个“可控要素”进行测试，比较一下最后的销售结果，这能为你带来惊人的销量。


    如果你的销售额增加了 10%，或者是两倍，你的花费依然是 5000元。然而，广告正文的一个改变，可能会增加 500%的销售额。增加一个零风险的保证，可能会增加
    300%的销售额。标题的改变却能提高 2100%的销售。这才是真正的手段！


    我们完全有责任优化我们的业务。营销绝对是达到目标的最佳途径。不需任何花费的细微改变就可以大大提高营业额。


    尝试新方法和做些小的测试，会发现一些没有多大风险的赚钱方法。


    ![](img/5bb8d83a871eaf27152be19745107cea_9_0.png)'
  - '[PAGE 10]


    # 二、让绩效最大化的科学与艺术


    ![](img/5bb8d83a871eaf27152be19745107cea_10_0.png)


    营销是科学和部分艺术的结合体。重要的是要记住：营销没有真正的对错之分。所谓的对就是那些适合你的业务发展的就是对。


    通过继续完善你的营销，测试不同的因素，你终会找到帮助你成功的各种因素的最佳结合。例如停止使用固有标题，用一个新的标题来替代它，这并不是说旧标题不起作用，而是新的措辞会有更好的效果。


    或者，如果你做的平面广告没有收到预期效果，这并不意味着做平面广告是错误的——它只是这一次没有有效工作而已。至少它是一次很有价值的经验和测试。花时间从你的每次营销实践中学习经验，不管它们是不是成功的。'
  - '[PAGE 11]


    在营销和生意中取得成功的一个必要因素来自于对你的生意或者服务充满激情。当你热爱你所做的事情时，你就会取得更大的成功。


    你要为自己提供的东西感到兴奋，客户或潜在客户会很明显地感受到。你撰写和讲出的言语，都会给顾客们留下印象。你的能量也会以某种方式转移给你的客户和潜在客户，提高他们的兴趣。这将会为你带来更多的销售额。


    无论你的动机是什么都没有关系——赚钱，热爱个体经营或是支配自己的时间，你都必须对你的生意保持激情，用一种合适的态度来尝试将其最大化。


    杰•亚伯拉罕概括了五条需要掌握的主要原理，来让经营绩效获得最大化，并盈利。这五条主要的原理是：


    A、掌握其他行业非常普遍和高效的成功方法，可以使你成为本行业内一流的专家。


    B、所有的生意中都有隐藏的资产、机会和“被低估的可能性”。即使利用这些资产对他们而言很有价值，但是大部分企业主都从来不花费时间去研究一下如何最大效果地利用它们。隐藏的资产包括：当前'
  - '[PAGE 12]


    客户、过去客户、过去的广告、物质设备设施、效果没有达到最大化的活动、销售力量、使用的方法和技术、公司信誉、供应商、分销渠道等。注意提高这些层面，从而减少经营成本，这样就能提高绩效。


    **C、生意中分好坏两种杠杆作用。** 坏的杠杆作用通常发生在你根本就不知道自己进行了投资或者获得了什么的时候。而好的杠杆作用是指利用相同的精力、人力、物力、金钱和营销力量来创造更大的，更多的收益。


    **D、你的目标应该专注于业务的几何式增长**，策划那种能够增值和带来发展的活动。


    **E、为了获得成功，你必须在以下三方面取得突破性进展：**


    +   a) 营销

    b) 战略

    c) 创新


    杰解释了你要如何做才能通过这些原理创造成功。他指出，你要从现在开始，到你的行业之外去寻求突破。


    我们要借鉴其他行业的成功营销方法，把不同行业的方法，运用到你'
  - '[PAGE 13]


    自己的生意中，就可以与竞争者不同，吸引顾客，增加销量。


    +   1. 你目前的业务是什么，你觉得在哪些方面还没有将效果最大化？

    （公关，收购，维护客户，销售，营销，服务，文案，产品，等等。）


    +   2. 至少列出行业外的三种成功企业，研究其中的哪些策略和创新可以应用到你自己的企业中。


    +   1）'
  - '[PAGE 14]


    1)


    2)


    3)


    # 3. 在过去，你做的哪些可能束缚或限制了你：


    +   1) 客户


    +   2) 产品


    +   3) 服务'
  - '[PAGE 15]


    4) 购买的频率：


    5 ) 推荐


    杰讨论了你需要如何才能做到从局限于你自己行业的 “隧道式思维”转换成“漏斗式思维”，打开你的视野，去了解和接触其它的行业。


    他提醒，大部分人花费其一生时间在他们的生意里做相同的事情。而实践证明，如果你使用这些策略要比竞争对手们的策略至少好 10% 到 20%。


    4. 杰强调说，学会将当前的客户发展成推荐人，从而实现利益的最大化，这是很关键的。


    推荐是每家企业都应该使用的一种强大的营销策略。你可能已经有了很好的 “口碑宣传”，但是从未测量过宣传效果；可能有人给你打过'
  - '[PAGE 16]


    电话或是登门拜访过你，但你永远不知道（或者你根本就不想知道）他们怎么会来拜访你或者他们怎么会给你打电话。


    大多数公司为获得别人的推荐而采取了错误方式——他们乞求他人的推荐。这完全没必要。


    我建议给现有客户写封信，寄些小礼物给他们。如果有人陪同现有客户前来拜访，那么也给一起前来的潜在客户一些小礼物。选择赠送礼物有它的必要性。如果你衡量了一位客户的终身价值，那你就知道每一个新客户对你的公司一般会有多大的价值。


    建立一个正式的推荐系统，让你所有的客户都知道它的存在。充分利用这一强大的营销策略来发展你的业务。每位客户都可能会有符合你需求的很多朋友和熟人。


    **想想看，你是在利用当前的客户群来将推荐机会最大化的吗？如果不是的话，你可以利用下面的空白处，列出你目前可以用来当做推荐人的客户。**


    ![](img/5bb8d83a871eaf27152be19745107cea_16_0.png)'
  - '[PAGE 17]


    另外一个方法是最优化的技术，通过它将平常的产品转变为最高质量的产品。结合这一点，杰讨论了最佳绩效与生产效率之间是如何平衡的。他给出了一个商业房地产的例子。评估师会考虑到房地产的未来潜力。例如：如果要衡量一所房子的价值，他们会根据其最高和最佳的用途来评估它。


    5.  对于任何营销机会，你都要问问自己以下这些问题：“怎样才能最大化地利用这个机会？要花费多少钱？投入多少时间？需要多少人力？目前的资金状况如何？”在下面的空白处，至少列出上述问题中的三项。并且，除了现在的策略之外，还要写下一些进一步的优势，并超越你当前的策略。然后制定一个计划和期限，去实施每一项。'
  - '[PAGE 18]


    在这个步骤中，杰强调的一个非常重要的信息就是：你应该努力去发展业务的宽度和广度。即：参与多种不同的活动，将多种可以促进发展的要素都结合到一起，而不能只涉及某一单一特定的活动。


    例如：可以涉及 12 种活动，最后创造出一个系统来，让这 12 种不同的活动共同作用，产生最大的影响——在军队中，这叫做“力量乘数效应”。


    通过将各种各样的策略同时使用，你可以创造出一种组合的几何效果和更加有效的营销。你的目标是在多方面去打败你的竞争对手，要比他们想得多做得多，比如推销、推荐人等方面。他列举了当前通过借鉴其它行业的策略而取得成功的三家公司：'
