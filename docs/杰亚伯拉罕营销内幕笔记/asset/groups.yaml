    1）最初是什么让我开始自己的事业的？我的动机或者刺激因素是什么？我为什么要这样做？我的目标是什么？


    2）当我最初开始的时候，我的客户或业务是从哪里来的？例如：我曾经是不是召集了 100 位关键的商业人士，参加各种会议；或者向所有网络媒体寄送了产品发布会的邀请函？我是否在不经意间停止了这些最初使我成功的活动？我现在依旧投入与当初相同的精力吗？


    3）现在，我的客户为什么要从我这里购买？还是因为与之前相同的原因吗？我有没有变得骄傲自满？这个世界改变了吗？我应该回到最基础的那些东西吗？我目前正在做的事情是更好还是更坏了呢？


    4）过去吸引客户的主要方法是什么？我最开始使用的最关键的、用来建立我的“跳水板”理论的单一“支柱”是什么？


    5）我的营销或销售工作中的哪些因素为我带来了大部分销售或客户？它们中的大部分是来自于广告还是口碑？我是否由于没有花时间分析这一点而浪费了很多钱呢？


    6）我是否在不断地测试我的营销、销售活动以及各种方法的不同层面，以确保它们能够产生最高、最佳、最有利的收入和结果呢？如果答案是否定的，那么，我有没有到我的行业之外去看一看，去发现新的原理、过程和方法，从而借鉴和应用到我自己的生意中呢？


    7）在销售、网络和交易三个层面，我与客户之间的关系如何呢？我是通过电话接收订单，还是到外面直接销售呢？我是否每个季度都给我最好的客户打电话呢？我了解不活跃的客户都是哪些人吗？我是否已经给他们打电话，努力挽回他们了呢？我了解自己的销售人员吗？我有没有给自己满意的客户打电话，听取他们的想法，邀请他们共进午餐或晚餐呢？我有没有一直保持业务上的联络呢？


    8）如今，我的客户具体来自何处呢？他们的个人情况如何？都是做什么行业的？


    9）除了我的客户，还有谁会从我的成功中获益呢？他们的家人？我的员工？我的家庭？我的供应商？


    10）当我指出，自己的生意发展能够带动他们的生意，获得成功、安全、财富和快乐之后，我的供应商和生意伙伴中，有多少人会受激励，能够帮助我将生意发展得更好呢？如果他们愿意，我要采取什么行动才能实现这一点呢？


    11）当我为自己开发了一个新客户的时候，与此同时我还为谁也直接带来了一个新客户呢？当我获益的时候，谁还会因此获益呢？这样思考可以帮你打开思路，与大量其他人建立联系，从而帮助你不断发展自己的业务。


    12）描述一下，你自己的生意是什么。我销售什么？我怎样销售？我将它销售给谁？他们为什么要购买它？为什么购买它对于他们很重要？我能提供什么好处？


    13）我的经营理念是什么？利用杰的哲学作为一个模板，建立你自己最佳的、定制的、发自内心的、激情的、可信赖的系统，然后将其清楚地表达出来。然后好好想一想，它实际上到底意味着什么，并且好好感受一下，它到底是怎样的。这是一种非常好的互换思维。


    14）从我开始做生意以来，我做生意的方法、我所销售的产品或服务以及市场都发生了怎样的改变？


    15）我的销售力量如何？（每位员工、每个人、每个部门）他们都只专注于某一个领域吗？如果是这样的话，你就需要拓宽方法做出必要的改变。


    16）目前我的生意中所收到的最大的客户投诉或抱怨是什么？而我又是怎样成功地处理、解决和消除抱怨的呢？排在第二抱怨的是什么？了解你的客户是很重要的。他们的价值观是什么？他们觉得什么重要？他们有什么困扰？什么能够使高兴？对于什么他们想要更多？对于什么他们想要更少？你要怎样做才能使他们更满意？


