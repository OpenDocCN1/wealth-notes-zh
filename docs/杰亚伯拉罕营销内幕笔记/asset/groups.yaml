    # 五、“帕台农神庙”策略


    ![](img/5bb8d83a871eaf27152be19745107cea_62_0.png)


    如果你在营销中建立多根支柱，那么你的营销力量将会更高效。建立不止一种方法来吸引更多顾客、提高每笔交易的数额、提高购买频率，这些将会使你的销售额和利润大大提升。


    很多生意都只使用一种方法——他们把自己生意的整体成功全部只“赌”在那一根柱子上。然而，采用多种不同的技巧，将会使生意更好、更稳定。稳定的、增长的结果将会令你非常震惊！


    杰通过两种商业模式介绍了这个部分：


    A、跳木板理论：在这种模式中，你只有一种方法或者基本活动来获利，这样的活，你的收入完全只依赖以一种。


    **B、帕台农神庙理论**：在这种模式中，你拥有多种不同的支柱来建立生意和赚取收入。由于这种模式是通过不同的活动来建立生意的，所以它是宏伟的、强大的、稳定的、持续的以及健全的。而这种模式，就是你应该使用的商业模式。


