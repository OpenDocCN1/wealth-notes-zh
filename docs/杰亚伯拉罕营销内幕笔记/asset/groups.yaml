    7）在销售、网络和交易三个层面，我与客户之间的关系如何呢？我是通过电话接收订单，还是到外面直接销售呢？我是否每个季度都给我最好的客户打电话呢？我了解不活跃的客户都是哪些人吗？我是否已经给他们打电话，努力挽回他们了呢？我了解自己的销售人员吗？我有没有给自己满意的客户打电话，听取他们的想法，邀请他们共进午餐或晚餐呢？我有没有一直保持业务上的联络呢？


