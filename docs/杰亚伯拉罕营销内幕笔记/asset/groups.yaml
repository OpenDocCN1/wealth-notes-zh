    **13、杰列举的第四种可选择方案是“独特销售卖点”。**


    建立独特的销售卖点与你的公司业务有着必然影响。从根本上说，独特的销售卖点是 你能够给予给顾客的独一无二的东西，别人无法做到。独特的销售卖点可以是最多的选择，或者是最好的价格，或者是你有最好的保证等等。


    是什么使你的公司在所有的竞争中脱颖而出呢？客户和潜在客户能够在你那里发现什么独特之处呢？不要说是你的产品质量，或是你的服务，又或者是便捷性（因为这些都太过一般）。试着写一些与众不同的文字出来，然后将几段话压缩成一段话，再进一步缩减为一个句子，最后清晰地将它表达出来。


    想出一个强大的独特的销售卖点可能需要你花费一些时间，但它是值得你去努力的。独特的销售卖点会让你和你的每一位潜在客户、客户都清晰明了，他们会正确地做出判断，为什么要青睐你的公司。


    当你完成你的独特的销售卖点后，你要将它用在你的每一个广告，每一封销售信，和每一份宣传单里。换句话说，几乎在任何地方都可以使用它——在你的所有促销和其它印刷材料。


