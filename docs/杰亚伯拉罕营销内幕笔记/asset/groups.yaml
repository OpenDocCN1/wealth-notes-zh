    # 四、增加业务量最有效的三种方式


    ![](img/5bb8d83a871eaf27152be19745107cea_32_0.png)


    在众多拓展业务的方法中只有三种基本方式可以帮助你 :增加客户数量、增加每位客户的购买额, 和增加每位客户在你的公司的购买频率。


    大多数企业都试图增加客户的购买额，但是，到目前为止，你所看见的企业大部分都在使用那种低效率的方法。主要是因为他们没有别的'
  - '[PAGE 33]


    方式 ,再者由于他们长时间地使用一种方式 ,以至于成了他们的习惯。


    争取一位新客户的成本要比把东西再次卖给一位老客户的成本高 6 倍。好好思考一下，你会发现，把东西再次卖给你的现有客户和老客户是非常简单和容易的事情。


    但如果你的产品不属于那种可以重复购买的那种，那又怎样呢？


    在这种情况下，你可以尝试增加一些额外的附加产品。寻找并考虑什么产品能够与你的主要产品相关联。这个产品是否能为你的客户带来利益？他们会欣赏它吗？他们会购买它吗？


    如果你能找到一个产品，可以一次又一次重复地卖给客户，那就更好了。如果是这样，你就会发现额外的策略和技巧来为你增加销量。


    杰概括了可以用来增加业务量的三种方法，它们分别是：


    +   A、增加客户数量

    B、增加每一客户的购买金额

    C、增加购买频率（即：一定时间内重复购买的次数）'
  - '[PAGE 34]


    他建议人们将自己目前的客户最优化，并讨论一个称作“几何式倍增”的概念。他用下面的这个例子论证了这个概念：


    ABC 公司拥有 1000 位活跃客户。他们平均每人每年会购买 2 件售价 100 美元的商品。


    那么，这家公司的年收入即为：1000×100 美元×2=20 万美元


    如果你只是把这三方面（客户数量，购买金额，购买频率）都提高 10%的话，那么，你就会几何式增加销量。你的方程式就会是：1100×110 美元×2.2=26
    万 6200 美元。


    在每个方面都提高 10%之后的叠加几何效果就增加了 33%的收入。


    # 增加客户数量


    为了增加客户数量，杰建议你应该采取的三个步骤是：识别问题，评估分析，然后制定一个战略计划。对于如何增加客户，他给出了三个主要例子：


    # 例 1：流失率'
  - '[PAGE 35]


    当你曾经活跃的客户变得不活跃的时候，要创建一个计划使得那些客户中 50%的人活跃起来。这样的话，如果你拥有 1000 位客户，而其中 20%变得不活跃（200
    个人）的话，通过将其中 50%的人变活跃，你还是会失去 100 位客户。因此，你就要保持 10%的增长率（即保持 100 个人），这样就能保证你的客户总量维持在
    1100 人，从而就能抵消活跃客户变为不活跃客户的流失率了。


    # 例 2：咨询/顾问式销售


    站在客户的角度，为客户着想。当销售员联系客户的时候，他们在销售人员与客户之间创建一种更好的关系和氛围，这样会使客户数量增加 10%到 300%。


    # 例 3：设定目标


    你应该持续不断地、大量地以增加业务量和客户数量为目标。


    +   1、你当前的流失率是多少？考虑到上述例子中所提到的流失率，你要如何将其减少 50%呢？在下面的空白处，写出一个相应的策略：


