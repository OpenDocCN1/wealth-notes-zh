    # 增加购买频率


    我们知道，获得一个新客户的成本是老客户的六倍。要维护好老客户，他是成本最低，最容易再成交的对象，是能够持续给你带来利润的人。一旦你跟一个人做成了一笔交易，你就应该继续跟他做成下一笔，再下一笔。


    你要收集他们的资料，了解他们，特殊对待他们，与他们保持联系，把他们作为你的家庭成员的一份子。


    我们在这里谈论的是购买频率，也就是客户与你交易的次数。你要知道，你的客户从你这里购买过多少次产品了？假如你不知道，那么就找出来吧。假如你不知道目前的交易量，你又如何能知道你现在使用的策略有助于你增加交易次数呢？你又如何知道这些策略中，哪一个会起作用，哪一个不会起作用呢？


    下面是关于如何衡量你目前购买频率的建议：


    1. 假如你从客户数据库里挑选出一个具有代表性的样本，随机选择 50 个客户。或者挑选出以姓氏 M 开头的所有客户。然后列出 12 个月内这些客户从你这里购买产品的次数。也许有些人可能从你这里购买了一次，而另外一些人从你这里购买了
    20 次。没关系。把所有的购买次数累积起来。这样就得出了在这段时间内的总交易次数。然后再把这个总数除以总客户人数。然后你就得出了平均交易数，也就是购买频率。


    2. 你可以调查你的客户。利用以下类似的表格：


    交易数调查：


    开始日期：


    结束日期：


    调查日期：


    客户姓名：


    地址：


    交易数：


    3. 假如你已经有了包含客户详情及交易情况的数据表，利用这个数据表算出平均数。


    4. 假如你不属于上面的任何一种情况，那么就估算出一个数据，但要尽量精确。试着在接下来的一段时间里观察客户在你公司的购买情况，看看是否能估算出他们的购买周期。按照类型把你卖的库存划分——它是易消耗品还是昂贵的一次性商品？你是一眼就能辨别这些客户，还是通过名字辨别出来？你全部都可以辨认出来还是只能辨认出一部分？询问一下他们购买你产品的次数。他们会告诉你的。然后，把你不知道的这些分类。你认为有多少人只购买了一次？有多少人是经常购买的？这样可以缩小你的结果误差。


    当然，这个期限主要基于你经营的业务类型。假如你卖汽车，你的客户在每五年之内可能购买的平均次数为一次；但是如果卖易消耗品，平均购买次数就相对较高。在这种情况下，你可以根据三个星期的情况，推断出一年的数据。


    增加客户的购买频率的其中最重要的一个方法是：经常与客户保持联系——无论是通过电话、电子邮件、微信、信件还是亲自登门造访。


    还有一种方法就是：向客户提供后端产品。例如：如果你做的是家装业务的话，那么，你还可以提供地毯、地板、窗户清洁等产品或服务。


