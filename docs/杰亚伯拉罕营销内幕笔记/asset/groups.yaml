    8、杰列举的第一种可选择方案是是：“风险逆转”，即：提供 100% 的购买保证。对于客户而言，这样就没有任何风险了。


    在销售过程中，要么卖方或者买方要承担交易的风险。很多情况下，购买者承担着这个风险——或至少他是这样认为的。他们购买了商品——拥有了它——不管喜不喜欢，管不管用，是否耐用等。


    产品的致命缺陷如果被发现了：客户返还产品后你的公司应该退款，收回收出的产品，更换产品，或者通过别的方式来满足客户。但是大多数公司常常不加理会这种保证，这是一个严重的错误。


    退款保证不仅应该向客户提到，而且你要向顾客重点强调，并进行多次重申。


    如果你没有提供零风险保证，我建议你这 样去做，那样的话你的销量会大大提升。你或许担心别人会占你的便宜。的确，你的退货数量/产品更换次数会稍微增加，但是你的销量会戏剧性地增加。那么，退货数量和产品更换次数的稍许增加就变得无足轻重了。


    你也可以采取进一步的措施，你可以提供一个比无风险更好的保证。这种保证可以为你创造更多的销量和收入。比零风险更好的保证就是出售产品时附加赠品（赠品要有价值，与产品相匹配的最好），清楚地告诉你的客户或者潜在客户即使他返还产品，拿到了退款还是可以获得赠品。


    一种非常容易的零风险保证的赠品是信息产品，制作信息产品很简单，却有着很高的价值感。例如，一份报告的“标价”可能是 100 元，但却只需花 2 元打印。这是一种有效的手段！如果你采取了这一简单策略，那你的销量就会很容昜的飙升。


    #### 4 种风险逆转方式：


    - 全部退款的保证

    - 比退款更好的保证

    - 部分退款的保证

    - 先使用，后付款（先盈利，后付款）


    #### 逆转风险的 3 个方面：


    - A、全额退款再加奖励刺激。

    - B、情感风险逆转，即增加潜在客户对于所购商品的信心

    - C、风险逆转的步骤


    - 步骤 1：从现金角度来说，报告最广的证明或个案研究，即从你感到满意的客户或买家那里得到的可以衡量或量化的反馈是什么.

    - 步骤 2：如果你的客户或潜在客户保持现状，会受到什么惩罚

    - 步骤 3：你的竞争对手的最有力、最优越的保证是什么。

    - 步骤 4：要让别人选择你的企业并建立业务往来。你能保证满足的最低期望值是什么。

    - 步骤 5：你情愿给别人提供的最具体的最低保证是什么。


