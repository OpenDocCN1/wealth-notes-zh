    重要。从一开始就告诉读者你的产品或服务将如何使他们受益。


    **第二步：** 告诉读者，他或她为何应该感兴趣。不要假设读者想当然地知道原因。不要假设他或她自己能够看到其中的关联。你一定要为他们指出来。


    **第三步：** 告诉读者，为什么他或她应该相信你说的话，为什么你说的都是真的。要证明你说的内容。建立事实。在交流中提供权威性的证据，不断地、持续地、有力地证明，你所说的内容绝对属实，读者完全可以相信。用可信的证据支持有关利益的陈述。


    **第四步：** 通过案例、研究、推荐、引用或者其它任何合适的证据来证明，你说的都是真话。努力邀请某人同意赴约，或者到你的展位来。


    **第五步：** 将你的产品或者服务的全部利益逐条罗列和描述。人们购买的不是产品的特点，而是产品能够给他们带来的好处和优势。例如，一台电视每平方英寸拥有 900
    万像素。这对于客户而言根本就毫无意义。然而，如果你所强调的是，这台电视比大部分的电视都清楚五倍，拥有影院般的视觉效果，那么，你的销售策略就会更加有力得多。


    **第六步：** 告诉读者如何回应。通过直接营销，直接引导客户——告诉他们做什么，怎样做，为什么应该做，应该什么时候做，以及最终如何订购。


    当然，我们不能忘记：AIDA 公式


    - A=吸引注意；吸引读者的注意力（一个好的标题是非常有效的）。

    - I=激发兴趣；通过写文章、讲故事来加深读者的兴趣。

    - D=刺激欲望；提高顾客的欲望。

    - A=呼吁行动；促使顾客采取行动


    怀着激情写作，让你的文案动感十足。保持潜在顾客的兴趣。用你对利益的热情感染顾客。


    你写的广告是为了给某个人在某个时间读的，你寄出的每封销售信也是为了给某个人在某时看的，你也只能在某个时间给某一个人打电话。


    因为这些事实，在你撰写销售信时你应该想象自己面对的就是某一个个人，而不是一群人。直接和你的潜在客户交谈，让他觉得你只专注在他身上，除了他没有在意别人。说明一下他将得到的好处，大方坦白地告诉他，这一点很重要。向他展示你对他个人的关心，你很在意他的利益。


    无论是写广告还是销售信，都要尽量使用简单的词汇和短语。这样一来，你就可以使最高数量的潜在客户都能够阅读并且理解其中的内容。据说，你的文案应该写得连小学五年级水平的人都能看懂。你永远都不能让潜在客户感到你居高临下。相反，你要尽可能使用简单的、容易理解的词汇和短语，并且就像实际上跟潜在客户谈话那样撰写文章。


    还要把每个段落都写得简短些，让你的文章更加容易阅读。每个段落都应当不要超过 3 到 4 行的长度。你甚至可以有效地使用一句话，或者只是一个词语自成一役，来进行强调。


    随着网络的发展，虽然线下邮寄销售信受到很大的影响，但直接邮寄依然有效。当大家都在通过邮件，网站来销售产品的时候，如果你使用线下邮寄将会脱颖而出（线下邮寄名单很重要）。


    在线下的直邮包裹中，一封好的信件的基本组成是：


    ### A、信封


    策略 1：使之看起来像一封个性化的信件，用一张个性化的邮票，就像是某一个人邮寄的一样。


    策略 2：在信封上写一些足够吸引人的话题和语句，刺激接收者想要打开信封一探究竟。


    如果你不确定哪种策略最有效，那么，你一定要对你的受众进行——测试。测试是非常重要的。


    ### B、销售信：


    这封信一定要完美呈现，解决每一个问题，提前想到各种障碍并克服它们。它应该是最有效、最吸引人、最完整的展示。如果这对于你而言是一种挑战，那么，你可以将自己要陈述的内容录音，然后抄写录音内容，再对其进行编辑和修改，这样一来你通常就会发现，你最终撰写出来的销售信要比专业广告撰稿人写得还好。


    在我的营销通讯里有一个通用的销售信模板，你可以参考使用。网址：http://libingchi.com/detial.php?id=Njk=


    ### C、小册子：


    小册子只能作为一封好的销售信的附属品。它不能用作“销售工具”，而只能充当一封销售信的总结或者额外的装饰。在小册子中，总结的好处要多过特点。并且，它应该有一个有效的标题。


    ### D、便签摘要：


    所谓“便签摘要”，指的是用一个短小精悍的总结，将所提供的东西与效果的精华部分再重申一遍。注意，一定要站在读者的角度上去罗列各种好处和优势，要了解他们想要的是什么。


    ### E、反馈卡：


    这是一种回应卡或者订购表格，客户可以通过传真或者邮件对你的生意进行反馈，然后你的销售人员就能继续跟进了。它可以用来让人们实际致电或拜访，也可以用来预约、销售某种特定的产品或服务、提前预约一位专业销售员、发布新的宣传、跟进一个订单以确保客户仍然处于兴奋状态、消除之前购买时的不愉快、或者作为一种持续的、更新的沟通，与客户建立一种保证关系。


    ### F、标题：


    一则强有力的标题可以应用到一封信的开头、所有广告、电话的开场语、一条横幅或者某个大会上任何种类的公共展示、你的传真或电子邮件、微信的开场语或者商业名片上。


    ### 标题例子：


    “让人们喜欢你的秘诀”


