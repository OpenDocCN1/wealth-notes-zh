    ## 八、几何式倍增与突破的关键


    ![](img/5bb8d83a871eaf27152be19745107cea_100_0.png)


    通常情况下，客户不再像往常那样光顾和购买，就意味着他们变得不活跃了，而商家往往意识不到自己将要失去这些客户。


    重新激活不活跃的老客户就成了增加利润的策略之一。杰亚伯拉罕在给企业制定营销方案的时候，就经常使用这个策略。


    人们之所以不再活跃、停止购买，**主要有以下三种原因**：


    1、**在客户的生活中出现了别的事情，所以停止了与你的交易。**


    **比如：他们去度假了、生病了、搬家了或者出游了等等。**


    如果他们在一段时间内打破了之前的习惯，那么，他们就会慢慢地忘记与你进行交易。而补救这种情况的最简单的方法就是亲自与他们联系，或者打电话、写信、发微信或电子邮件等。


    要发自内心地、真诚地联系他们，让他们知道，你在关心他们，问问是不是你做了什么事情让他们失望了。


    要让他们知道，他们对你而言是很重要的，你不希望是你的问题而影响了你们之间的交易。如果你不小心做的一些事情冒犯了他们，或者令他们感到不满意了，那么，及时改正问题是非常重要的。


    这种方法对重新激活他们光顾你的生意起到非常积极的作用。通常情况下他们会对你更加忠诚。


    2、**客户在购买时体验不好**。


    你一定不能让这种情况变得更糟糕，这点非常重要。


    你可以像上述情况那样进行处理，最终一定要保证他们满意。即使那意味着要向他们提供福利、免费的商品或者重新提供一次服务——无论要付出什么样的代价，你都要努力使其满意。提供客户意想不到的优质服务。


    如果你一直遵循这种模式，那么，在你重新与客户建立关系的时候，通常成功率会达到50%。


    3、**客户不需要你的产品或服务。**


    你的产品或服务不再适合他们了。在这种情况下，不要放弃客户。这是向客户寻求推荐的绝佳机会。


    当你给他们打电话，或者亲自拜访他们，知道你的产品或者服务已经不再适合他们的时候，就要询问他们，你的服务是否让他们满意。


    如果他们表示满意，那么就请求他们推荐其他顾客给你。并答应他们，通过推荐，他们将会得到丰厚的回报。


    利用这些策略与客户联系的时候，就可以激活老客户，降低流失率，迅速增加利润。


    杰说，在与客户进行联系的时候，利用这些策略并减少流失率，可以使你的生意在每18个月内翻一倍。


