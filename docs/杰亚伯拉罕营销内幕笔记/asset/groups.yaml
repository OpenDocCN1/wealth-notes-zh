    # 六、“测试”策略


    ![](img/5bb8d83a871eaf27152be19745107cea_68_0.png)


    成为营销专家的方法之一就是使用测试策略。测试就是拿不同事物进行彼此间的比较对照，目的是为了找出能产生最好效果的那一个。


    测试内容一般包括标题、价格、保修期、条款和产品（销售对象）本身。在测试过程中必须依次测试各项内容。


    比如比较标题时只需变换标题即可（不能连同广告正文也替换掉），而当测试保修期时条款也不能随便变换。依次测试各项内容的好处就是你清楚地知道到底哪一个效果更好。经过测试，具有不错效果的措辞便可以保留下来，以它为标准，再拿它同别的用语比较对照，直到发现具有更佳效果的用语再替换原来的那一个。


    测试能大大降低你的风险。刚开始的时候先登小一点的广告，或者给少数人邮寄广告，不要在一开始就大肆做广告宣传，铺张地发放广告宣传资料。测试之后你可以直观地了解广告或是销售信的效果如何。不做测试的后果就是你永远不知道其实更好的措辞会为你带来比眼下更好的效果。


    不要掉进大多数其他企业使用的陷阱中。他们总是在广告里说：“我们来啦——关注我们——我们是最棒的。”大多数广告和宣传单都给这种印象，这类广告也是广告公司惯用的一种手法。


    你要从投入的广告中获取更多的东西，在广告里加入可以直接得到回应的语句。也就是使用直接营销策略（点击查看“李炳池直接营销导图”http://libingchi.com/detial.php?id=NjE=）直接要求潜在客户或是客户去做某件事——把优惠券拿到你的店里，索取一份免费的信息报告，或是邮件请求等。这样做将使你知道是哪个广告，哪封信件，或哪份传单促使客户做出回应的。


    这种关键的测试方法，将告诉你哪些方式是给你继续带来大量利润的。人们怎样才能知道哪种途径是最好的？


    “测试”策略是你将学习到的最重要的策略之一，因为它屡试不爽，可用于每个广告...每封销售信...每份传单...所有的一切！


    # 下面是几个需要测试的策略清单：


    **A、两个标题对比：**


    （标题，或者开场语，比如你的销售代表所表达的第一段话、一篇促销文案的第一行内容、或者展会中的横幅）。对于销售活动而言，这个开场语差不多能够产生 80% 的影响。你希望客户看到这个开场语之后，会认为这就是他们想要的利益或者最大的优势。例如，开场语：“如何将你的生产率提高三倍……”。


    **B、功能测试：**


    例如：对一种新产品的 1000 个模型进行试验，作为一种“全新的、革命性产品”，并与通用的产品进行对比。


    **C、改变价格和包装：**


    有的时候，提高或者降低产品价格会增加销售。可以尝试将产品价格从 17 美元提升至 19 美元，或者从 109 美元降低到 69 美元。或者改变产品或服务的包装，以更更加适合“高档市场”这种策略可能会令你大吃一惊，并且通常会产生三倍的效果。


    **D、保证：**


    提供一种风险保证，保证客户购买绝对没有风险。


    **E、号召行动：**


    通常情况下，如果销售人员比较胆小羞怯，会很容易失去交易的机会。


    你要提高员工的销售水平，要让销售人员学会“临门一脚”，促使人们采取行动。在直接营销文案中，就要使用行为动词，来号召顾客采取行动。


