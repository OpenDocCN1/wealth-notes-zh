    +   4. 假如你不属于上面的任何一种情况，那么就估算出一个数据，但要尽量精确。试着在接下来的一段时间里观察客户在你公司的购买情况，看看是否能估算出他们的购买周期。按照类型把你卖的库存划分——它是易消耗品还是昂贵的一次性商品？你是一眼就能辨别这些客户，还是通过名字辨别出来？你全部都可以辨认出来还是只能辨认出一部分？询问一下他们购买你产品的次数。他们会告诉你的。


    然后，把你不知道的这些分类。你认为有多少人只购买了一次？有多少人是经常购买的？这样可以缩小你的结果误差。


