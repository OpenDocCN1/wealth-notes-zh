    # 七、销售信的力量


    ![](img/5bb8d83a871eaf27152be19745107cea_87_0.png)


    直邮是争取现有客户、不活跃的客户和潜在客户的最有效方式之一。对于你收到的“垃圾邮件”你可能极度厌恶，但它确实能够起到作用，每年有亿万封邮件被寄出。


    虽然你可以邮寄宣传单、销售公告或者明信片，但是销售信却是直邮里真正“兢兢业业的贡献者”。作为直邮里的主要角色，在美国从 9.95 美元一本的书到价值 50000
    美元的研讨班（或是介于两者之间一切销售活动），销售信都可以作为一种销售手段。


    当需要传达冗长的内容时，准备做促销的公司总是选择邮寄销售信这一形式。使用销售信的话就不会受限于空间的大小。也许有人会质疑，没人愿意阅读长篇累牍的销售信，但这种想法并不对。实际上，销售信寄出后那些感兴趣的人会仔仔细细地阅读完。


    直邮是最有效的营销手段之一，只要锁定好对产品感兴趣的人群，确认他们是最符合你“描述”的理想顾客。你可以在自己的顾客和潜在客户名单里寻找理想人选或者寄到那些可能感兴趣的人那里。


    我们还可以利用销售信来让当前的客户购买更多东西、购买次数更加频繁。同样地，也可以把销售信寄给过去的、有希望购买的客户，使他们再次活跃起来。已经花在广告上的费用无法收回，但是你可以在新的活动上继续利用它们。不断地去追求最优化，就会自动地提高最终结果。


