    2、**在下面的空白处写下你打算实施的每个步骤，并且一定要记得给每个策略设定一个具体的期限。**


    3、在理想情况下，你的生意应该是赚钱的，并且为你所用的。它以最少的付出得到最大化的回报。它的组织结构都非常好，以至于你可以完全不管它，它自己就能轻松地卖出一个你所希望的价钱。


    你目前的组织结构达到这种状态了吗？在没有你的管理以及直接联系下，它能够持续运转吗？如果答案是否定的，那么你要怎样来改善它呢？请在下面的空白处写出你的策略。


