    ## 十一、充满活力的创业精神


    ![](img/5bb8d83a871eaf27152be19745107cea_121_0.png)


    哦，是的，创业精神确实是充满活力的，你就是很好的证明（或是希望成为那个很好的例证）。你反对为他人卖命的这种想法，你享受为自己打工的那种自我满足，迎接挑战是你的生活方式，你因所取得的成就而开心快乐，你也从失望挫折中取得收获。


    你不懈地追求以做到更好，你对很多东西都满怀憧憬——你渴望拥有自己的事业。你明白对金钱的追求是人的本质天性而不是恶习。同时你也清楚为自己做生意会有很多其它收获：内心的满足、他人的爱、投身自己真心喜欢的行业的那种渴望、为了事业的成功而担负的那种责任。


    你是精英中的一份子，是这样的群体中的一员：试图摆脱“根深蒂固”的想法，并不是一味地追求“安稳”。你不希望追求安稳——你希望凭借自己的资质能力和知识为自己提供安全感和内心的平和。你希望你的企业因为你而变得独树一帜，没有任何别的事情可以与拥有自己的企业相媲美。


