  img_proc: true
- pgno: 993
  md: '一个公司 10 万人，可能一个小业务就 100 人。

    你如果有 300 人，但是你全投这个业务。


    请注意，三倍就是一个数量级的差异。

    这样是完全可能打赢的。


    赢了之后，出去吹，就是斯巴达三百勇士赢了波斯。


    这就是集中优势兵力的含义。

    看到没有，永远都是以多打少，永远都是。


    以弱胜强，对于实力是有要求的。

    最低限度，你的整体放到一个局部，要能形成碾压级的优势。

    你得有 300 人，是吧？


    这是简化的模型。

    简化是为了便于理解，但是你要觉得实际情况这么简单，那就错了。

    关键是你的对手没有那么蠢。

    你玩游戏，连电脑 AI 都不会这么蠢。


    你需要在变化中把握住这种态势。

    至少三个因素非常重要：时机，地形，兵力调配。


    兵力的运用方面，古代迦太基的汉尼拔是高手，欧洲三大名将。

    以汉尼拔和罗马军团之间的坎尼会战为例。


    大家知道，罗马的步兵很强。

    汉尼拔就利用中军拖住罗马步兵，拉长罗马人的战线，骑兵两翼包抄。

    在兵力不如别人的情况下，包围分割敌人，形成局部以多打少的态势。'
