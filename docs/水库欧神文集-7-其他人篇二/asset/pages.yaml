  md: '# 郭威的心理战 #X104


    ![](img/ef1c5244d092b8b29b53a68870574480_895_0.png)


    # 郭威的心理战 #X104


    # 一、小皇帝的愤怒


    五代十国，五代梁唐晋汉周，总共只有五十三年，历史却是一团乱麻。在后周之前，皇帝换的很快，基本就是要么我锤死你，要么就是你锤死我。


    后晋的大将安重荣就说过：天子宁有种邪？兵强马壮者为之尔！真的吗？


    我们今天说的郭威就是一个异数。


    话说石敬瑭建立的后晋被北边的契丹灭亡后，中原出现了政治真空，并不是很起眼的刘知远乘机称帝，国号：汉。


    这就是历史上的后汉。'
  merge: -1
  img_proc: true
- pgno: 896
  md: '刘知远 在建立后汉之后，很快就死了，他的儿子 刘承祐 继位，只有十八岁。


    四大南戏《白兔记》讲的就是他家的故事，确切的说，他老婆 李太后 才是主角，也叫 风雪寒梅李三娘。


    戏曲是个苦尽甘来的大团圆结局，历史要血腥的多。


    ![](img/ef1c5244d092b8b29b53a68870574480_896_0.png)


    刘知远 死后，给刘承祐留下几个大臣辅佐，包括 杨邠 （枢密使）、 苏逢吉 （同中书门下平章事）、 史弘肇 （侍卫都指挥使）、 王章 （三司使）、 郭威 （枢密副使）等。其中枢密使就是管兵权的、同中书门下平章事就是宰相、侍卫都指挥使就是管中央禁军的、三司使是管财政的。


    杨邠 这人公事公办，经常压制外戚，得罪了不少人，而且说话比较直接。


    有次开会的时候，直接对 刘承祐 说，有我们这些老臣在就行了，陛下可以闭嘴了。


    苏逢吉 这人比较贪财，曾经为了夺别人的家产，制造过冤狱。


    史弘肇 是个大老粗，瞧不起知识分子，和 苏逢吉 关系很差，有次喝酒，怀疑 苏逢吉 讽刺他，要杀了 苏逢吉。


    但是这个人 和 郭威 关系很好，穿一条裤子。


    王章 这个人，虽然是管财政的，但是比较偏向武将。


    这些老臣，其实觉得皇帝年纪小，不太懂政治。


    当时， 郭威 已经被皇帝派到邺都抵抗契丹人，其实就是支开他。


    就在这个时候，大屠杀就发生了。'
