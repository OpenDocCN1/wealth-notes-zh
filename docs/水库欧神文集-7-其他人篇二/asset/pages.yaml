  md: '直接顺应这个事实，走出下一步棋就好了呀。


    ![](img/ef1c5244d092b8b29b53a68870574480_493_0.png)


    类似的桥段，不只发生在财报游戏中。


    最近我在看《璃子帝》。


    断断续续，睡觉之前看一点，起床之前看一点，吃饭时候看一点。


    看了两个月了，还没有看完。


    这部书的内容很好，尽管对我而言枯燥了一点。


    但它最大的特点，不是精妙的权谋，与详尽的分析。


    而是作者的写作方式。从蛛丝马迹中可以感受到，他是“边推边写”的。


    很多人写小说时，会先拟一个提纲，列出全书的主要事件。


    主角出世，落入深谷，绝地求生，爱人身亡，堕入魔道，飞升涅槃。然后在各章预埋伏笔。


    但是《璃子帝》谋篇布局，是先摆棋盘一样。陈述了大臣、太监、太后、外戚、宗室、军队、匈奴、流民、江湖人、望气者等等“势力”。


    像是玲珑棋局，先一子一子摆好在那里。'
