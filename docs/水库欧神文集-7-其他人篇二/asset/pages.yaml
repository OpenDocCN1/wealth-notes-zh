- pgno: 757
  md: '日常生活中，大部分人能让理智盖过情绪，不会把妒忌心表露出来。

    但如果拉长因果链条，到了所谓的公共事务领域，那就一样了。

    最近，学者张宏兵提到，大众的妒忌心经常被他人利用来获取权力。中外历史上那些枭雄，先是利用大众的妒忌心组织武力剥夺富人，但剥夺富人之后，变成官员群体过得相对好一点，于是又剥夺这个群体……

    最终，穷人受益了吗？没有！恰恰相反，穷人是受损最大的群体。这个，看看某邻国就知道了。

    只有市场经济，才是有利于穷人的。


    # 二


    经常会有一些朋友问我：“我也很支持市场经济，但市场经济造成的贫富差距扩大怎么解决？”


    我告诉他们：“市场经济最有利于穷人，市场经济也快速缩小贫富差距。”


    上面写的普通人活 150 岁、富豪活 500 岁，只是一个假设，通过这个假设来揭示妒忌心而已。


    真实世界中，市场经济会让普通人和富豪的寿命越来越接近。


    我以往写的一些例子，我看到，水库一些跟帖的朋友也知道。这里我再重复一下。


    假定马化腾一年收入 100 亿元，你一年收入 10 万元，那么，你们的差距是 10 万倍，你因此而愤愤不平，可以理解。


    但是，如果从个人消费的角度来理解呢？假定马化腾一年花 1000 万，你一年花 8 万，他只是你的 125 倍！他是几万员工的企业老板，他和你之间的这点消费差距，这值得你愤愤不平吗？


    马化腾的绝大部分钱，是在继续生产，是在帮助员工获得收入，是在帮助消费者降低成本。


    他的努力，快速拉近了穷人和富人之间的距离。


    30 年前，中国人对美好生活的想象，还是“楼上楼下，电灯电话”。那时候北京人家里装一个座机，要花 5000 元！可以买 5 平米北京的 房子。视频通话？即便在欧美，也要亿万富豪才能用得起。


    可是今天，普通的农村老太太，也能拿起手机，和在城里工作的子女视频一下。


    ![](img/ef1c5244d092b8b29b53a68870574480_757_0.png)'
