  md: '# 贾跃亭坑死罗永浩


    邓新华 水库论坛


    罗永浩因为负债而被限制消费。罗永浩在微博上说，向锤子的债权方、投资人，以及关心锤子科技命运的朋友们表示歉意，并表示将在未来的一段时间把债务全部还完。即便公司关掉，个人也会“卖艺”还债。


    另一边厢，负债更多的贾跃亭，申请个人破产。网易清流工作室报道，一家名为“上海懒赋资产管理有限公司”指出，在提出破产申请前，贾跃亭已利用空壳公司以及一些混淆视听的手段隐藏资产。


    ![](img/ef1c5244d092b8b29b53a68870574480_788_0.png)


    +   - 对比鲜明。当然应该给罗永浩造声赞。

    - 同时，这也是反思个人破产法的一个好案例。

    - 借此可以加深对市场的理解。


    这个周末，几个朋友聚餐。


    谈到通货膨胀。


    我问了一个问题：“为什么有些储蓄类的保险产品，回报比银行利息还低，却有那么多买？”


    算上通货膨胀，有些保险产品其实是负利率了。


    一个朋友回答：“收智商税嘛！有那么多人愿意交智商税，当然就卖得好。”


    我说：“错的。真正的原因是保险牌照管制。保险牌照管制只准有牌照的人收智商税。假如放开保险牌照管制，则竞争之下，收智商税的人也会被追提高利率。”'
  merge: -1
