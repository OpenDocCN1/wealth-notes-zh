  md: '得多。不明就里地把屎盘子往私有化头上扣——还是那句话，思想上的懒惰。


    顺便说下，引发本次智利动荡的“地铁票涨价”事件，背后地铁公司是国有企业。我看到这则信息时，不禁莞尔：幸好这家公司是国企，否则私营企业贪婪无耻引发社会动荡，岂非要再添一新例子？


    # 5


    智利政治动荡的主要原因是：左派思想在智利从来没过。这个国家将要迈进发达国家的行列，可是在思想市场上，依然左派当道。


    智利的自由市场，可以说是从天上掉下来的。皮诺切特推翻阿连德统治后，头两年，他实际上只忙于大开杀戒，巩固政权。1975年弗里德曼访问智利，经济改革才启动。


    当时哈耶克刚刚获得诺贝尔经济学奖，弗里德曼也是名满天下。一大批讲西班牙语在芝加哥接受经济学教育的年轻人被邀请回来，参与改革。智利没有做好改革的准备，一下就被推上历史的快车道。


    尤其是左派，他们还沉浸在阿连德之死的愤怒悲伤里，迅速面对军政府铁拳的一顿猛抽。数千人被杀，上万人逃亡，其他人战战兢兢。智利在军政府的刺刀之下，默默工作，不敢吱声。皮诺切特说了：在这个国家，没有我的命令，一片树叶子也不能动。


    毋庸讳言，在军政府统治下，智利人民也失去了许多自由。皮诺切特对街头集会深恶痛绝。除了阅兵和足球比赛，其他街头集会都可能遭遇水枪车驱散。军政府发布命令，要清除“狂热信仰的智利人”。好好赚钱就可以，没有真理标准的大讨论，也没有“姓资姓社”讨论。


    左派痛恨皮诺切特。他们没有认输，更没认错；他们只是认为，自己被独裁者压下去，有一机会还是要长出来。在智利这个市场经济国家，右派有历史原罪，左派思想堂而皇之。


    智利还走在市场经济道路上，很大程度上缘于制度惯性。无论左右政客，他们处理问题时面对各种选项，经常会采用市场的手段——当市场的有效曾居展示，就不会被无视。军队仍是这个国家的柱石，他们的存在具有震慑作用：在智利，文官政府不能玩得太火。


    但在普通民众和媒体舆论那里，右派没有市场。智利为何繁荣？很多人归结种种原因，有铜矿、有工业，有发达的水果业。他们却很难将这一切与市场制度联系在一起。左派主张向其他国家学习，引进一些看似美好，其实糟糕透项的制度。


    这一次智利动荡，皮涅拉总统被迫妥协，提出一些征收富人税、提高最低工资的措施。


    从某种程度讲，智利动荡和香港骚乱有相似处。它们受惠于自由市场，但在经济学普及上，做得太少。由于历史原因，两地左派都格外兴盛。年轻人出生在莺歌燕舞、花团锦簇的大丰盛世，习惯了经济增长与繁荣，却对背后机制一无所知，稍有风吹草动，就把矛头指向资本家和政府。他们总想着改天换地，创造新世界，殊不知，他们努力奔跑的前方是深渊。


    # 6


    最后回过头来说中国吧。中国在走上市场化道路前，有过漫长而痛苦的计划经济记忆。生活在计划经济的'
