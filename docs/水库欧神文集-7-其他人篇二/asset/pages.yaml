- pgno: 52
  md: '“啪，啪，啪，啪，啪”


    小鲤鱼们从此，便带着这个章，行走江湖。


    仓廪实而后知礼节，提高素质，其实已经是非常奢侈的愿望。


    对于大多数小鲤鱼来说，教育系统最根本的作用，是分流。


    以至高权威者龙王的名义，完成对小鲤鱼的分层认定。从此以后，鱼便有三六九等。


    对于龙王而言，考察的尺度，其实可以是任何内容。


    我喜欢跳高，就要求所有鲤鱼比拼跳龙门；我喜欢潜水，那就要求游得最深的鲤鱼获胜。


    但不论跳高还是游深，这个尺度掌握在我的手里，是最重要的。


    朕给你的，才是你的，朕不给你，你不能抢。'
