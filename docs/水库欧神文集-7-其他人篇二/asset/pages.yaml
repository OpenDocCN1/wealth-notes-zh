  md: '胡图族掌权的卢旺达政府，官方广播肆无忌惮地鼓吹杀人：“图西人是比利时殖民者的走狗，他们偷走了我们胡图人的土地，还鞭挞我们。现在那些图西族叛乱者，他们又回来了。他们是蟑螂，是杀人犯。卢旺达是我们胡图人的土地，我们人口占多数，他们是一小撮叛乱者，入侵者……”


    1994 年 4 月，卢旺达的胡图族总统和邻国乌隆迪的总统（同样是胡图族），在卢旺达首都基加利上空被击落。消息传出，官方广播号召胡图族出门杀人，把认识的每一个图西族杀死。现代社会惨绝人寰的一幕出现了，没有机枪和火炮，也没有毒气室，只用原始的砍刀和削尖的木棒，胡图族人在几个月时间内杀死了超过
    80 万人，其中大部分是图西族人，少部分胡图族人在混乱中被杀。


    ![](img/ef1c5244d092b8b29b53a68870574480_649_0.png)


    1994 年 7 月，卢旺达爱国阵线（以图西族为主）和乌干达军队攻入卢旺达首都基加利，推翻了胡图族掌握的卢旺达政府。这就是当代“卢旺达解放日”的由来。数百万胡图族人害怕报复，逃往邻国，造成了新一轮屠杀。大杀戮之后是大瘟疫，数千人死于流行疾病。


    # 和解与重建


    卢旺达大屠杀是现代社会匪夷所思的大悲剧。两个相貌相近，世代同居的兄弟民族，挥刀相向，带来了非常惨痛的后果。卢旺达爱国阵线成立新政府后，立刻取消本民族划分，身份证上不再标明“胡图族”、“图西族”等字样，只有卢旺达人。


    除此之外，卢旺达政府积极推动民族和解：政府不再追究殖民时代的个人责任，对大屠杀时期规模巨大的个人犯罪者，政府也不再追究，并且鼓励民众宽恕和解。这样做当然有争议，但如果彻底清查，卢旺达将陷于无休无止的纷争。


    对大屠杀的鼓动者和执行者，国际成立刑事法庭调查审判，数百名犯有反人类罪和种族灭绝罪的罪犯受到'
