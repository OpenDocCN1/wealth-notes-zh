  md: '皮诺切特与弗里德曼进行了45分钟的会谈


    在市场竞争领域，军政府卖掉国企，大量管制取消，简化办事程序；在劳工领域，实行自由工资制度，工会被取缔，工人直接和资本家谈判；在货币政策上，货币高度紧缩，汇率自由浮动。关税尽量降低，本国市场加入世界分工。


    传统智利没有自由市场的思想土壤。这套经济政策是移植而来，以弗里德曼为首的芝加哥经济学派中起了主要作用。也许皮诺切特此前不懂，一旦他听进去，执行起来就毫无迟疑。


    国有农场的土地被归还，国有企业被拍卖，大量所谓“公共品”私有化，学校和医院也不例外。成捆钞票被烧掉，银行重新实行自由利率制度，铜矿企业开始对外开发市场…军政府端着枪，逼着国家搞“改革开放”。谁要是敢捣乱，监狱和酷刑在等着他。


    今天很多智利人谴责“新自由主义”，说它生于不义，靠着独裁者强推才得以施行，这话说的倒没错。但要说到“新自由主义”失败，则是完完全全在胡扯。


    如果“新自由主义”本身是失败、有害、错误的政策，它的后果是什么？一定是像阿连德那样，带来经济崩溃和政治灾难。智利用多年来经济发展的成果，驳驳了这一点。


    1976 年智利经济增长启动，当年 GDP 增长率 3.5%。此后五年智利经济增长率分别为 9.9、8.2、8.3、7.9、6.2。通胀率更从 1973 年的
    863%下降到 10%以下。1982 年拉美爆发经济危机，智利最快恢复，很快又实现 7%以上增长。


    皮诺切特于 1990 年下台，此后智利偏左派连续执政，经济增长率滑落，但仍是拉美地区发展最快的国家。


    2018 年，智利人均 GDP 达到 1.6 万美元，一只脚迈进发达国家的门槛。近二十年的智利政府，无论偏左还是偏右，大体执行皮诺切特以来的经济国策。智利是经济自由度最高的国家之一（排名前二十），2010
    年加入发达国家俱乐部（经济合作组织）。


    如果说“新自由主义”是失败的，为何在实行四十多年，实现高速增长后，才被证明失败呢？这样能叫“新自由主义”失败？


    4、


    无论人们怎样咒骂，“新自由主义”的本质是市场化。1980 年代后，很多国家施行市场化政策，有的失败，有的成功，这可以从经济成果看出来。失败者通常伴有市场化之壳，官僚还起主导作用，经济增长因此缓慢；成功者亦不乏其例。中国国企改革开放，做得都比东欧国家好得多。


    智利经济改革做得也不错，有发展成果为证。这次智利动荡，凡一口咬定是“新自由主义”失败，都可划到入云亦云，不懂装懂的行列。真正值得讨论的问题是：在智利施行多年，成果斐然的市场经济制度，为何遭遇当下困境。上百万人上街抗议，总能说明一些问题。什么问题呢？


    很多人把原因归结到贫富分化。这个结论很可疑。智利不是极端贫富分化的国家—至少在美洲，它比墨西哥、巴拉圭、哥伦比亚、巴西这样的国家好得多。和拉美世界动辄百分之二三十的通胀率和失业率相比，智利的通胀率和失业率只有个位数，情况好得多。智利比索是拉丁美洲最坚挺的货币，居民无需为换汇而'
