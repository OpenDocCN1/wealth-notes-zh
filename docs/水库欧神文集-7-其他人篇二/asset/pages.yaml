- pgno: 947
  md: '# 四、处理意外和风险


    《怀斯曼生存手册》中说，生存的首要原则就是冒险。


    做生意，永远不会像大家想象的那样顺利。

    比如说这个加拿大小伙，用别针换别墅的租用权，理论上是可行的。


    但是中间的意外环节太多。


    总共经过了14次交换，任何一个环节崩掉，这个事情就进行不下去。

    创业，就是要靠自己把这些断裂的地方用胶水粘起来。


    ![](img/ef1c5244d092b8b29b53a68870574480_947_0.png)


    所以说，对于意外和风险把控，是成功的主要方面。

    事实上，就算是一个风变冰工程，每个工程出现的意外和风险都不一样。


    还是以《富豪谷底求翻身》为例。

    在这90天里面，葛伦做事情并不是一帆风顺的。


    第一次出现意外，就是葛伦因为长期住车里，生病了，结果花光了打工赚的钱，回到了100美元的原点。


    这个事情耽误了他很多时间。


    还有政策的风险。

    葛伦通过考察，其实最开始想开一家啤酒厂，咨询律师后，发现搞啤酒厂要牌照。光是牌照的申请至少要90天以上。

    对于这个意外，葛伦处理的还是比较漂亮的。

    他采用的方式，是通过开餐厅卖啤酒来替代，餐厅卖啤酒，是不需要牌照的。'
  merge: -1
