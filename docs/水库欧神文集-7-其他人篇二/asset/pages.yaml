- pgno: 659
  md: '效果。


    # 六


    小学生式的错误非止一个。


    比如，很多小学生都有过这样的疑问：“既然是印出来的，那为什么国家不多印些钱发给大家呢？这样不是大家都有钱了吗？”


    这只是小学生的错误吗？


    实际上，主流经济学家正是奉行这样的信条。他们经常呼吁印钱（降准、降息等）来缓解“钱荒”、融资难。


    “多印些钱不就解决资金紧张的问题了吗？”


    为什么这些错误会流行？


    从主流经济学家的角度来说——


    提高储蓄率需要条件。经济越自由，人们越愿意储蓄，因为获得未来收益的确定性更高，而这要求无为，没有干预者们的用武之地。而刺激消费是他们可以“有为”的。印钱缓解融资难同样如此。其他人不靠经济学吃饭，却还相信这些小学生的错误，那就只能说是懒得动脑子了。


    （邓新华，2019年7月23日）'
