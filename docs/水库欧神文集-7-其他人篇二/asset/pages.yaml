  md: '# 真正的恩师不教书 #X68


    原创：桃军师 水库论坛 10 月 26 日


    ![](img/ef1c5244d092b8b29b53a68870574480_272_0.png)


    # 真正的恩师不教书 #X68


    一）跑得太快


    #F2050《书到用时方恨烧》里提到：'
  merge: -1
  img_proc: true
- pgno: 273
  md: '因为教材已经落后于时代，且必将落后于时代，所以官办的教育，再也没有办法学到真正的知识了。


    只能学到 10%，剩下的 90%，全部都是“学徒制”。


    道理很简单，因为“教材超前于现实社会发展”，本来就是一个非常异常的现象。


    中国之所以能拿过苏联的教科书来用，而且奉为圭臬，是因为那时候中国实在落后苏联太多了。


    所以苏联的教科书，简直就是九阴真经，十全大补，实用操作手册，只要照书行事，就可以功力大涨。


    “后者者”想追“先者者”，有教科书的话，是很容易的事情。照着追就行了。


    但是问题来了，中国发展得太快，在过去 17 年里，GDP 整整增长了 9 倍，平均起来，差不多两年翻一倍。


    而且这还是在人均 GDP 远远落后，只有美国 16%的情况下完成的。有学者算过，如果中国人均 GDP 能达到美国的 50%，总 GDP 就能超过美国和欧盟的总和。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '结果就是，各个方面追得太快，科技人文也在飞速地进步，以至于人家的教科书拿过来，跟我们的教科书一比，发现基本知识已经差不多了，基础教育上甚至还要更胜一筹。


    你冲得太快，一抬头，突然发现身周空无一人。


    这时候，教育对你的作用就是0，因为你已经穷尽了教材上所有的知识，跑得比教材还要快，你的前方再也没有一个领跑者可以探路了。


    所以更高的知识，没有办法从公共渠道获取了，就只能去找那些拥有知识的人，虚心拜访请教，求他指点迷津。这就是“学徒制”的雏形。


    # 二）师承关系


    “学徒制”不仅在知识传承上有重要的意义。除此之外，还有更大的用途。


    韩愈讲“闻道有先后，术业有专攻”，所以人人皆可为师，这话只讲了一半。'
  merge: -1
  img_proc: true
- pgno: 275
  md: '另外一半没有讲出来的是，韩愈自己从来不教人知识，却成了许多素昧平生的书生的老师。他成为这些人的老师，却甚至不需要为人家“传道受业解惑”。


    为什么呢，因为“科举制度”。


    嫡母盖过亲娘


    座师取代恩师


    众所周知，中国的选才制度，在唐朝由举荐制转化为了科举制。原来是纯粹 的攀关系，“世胄蹑高位，英雄沉下僚”，现在出一套卷子给你做，让你有凭借知识翻身的机会。


    但是“科举制”的改革并不彻底，唐代科举依旧保留了大量举荐制的遗迹。


    具体来说，如今的高考一律是切掉名字，扫描批阅，但这其实是有宋以后的制度，所谓“糊名誊录”。在唐代，考生卷纸是不糊名的。'
  merge: -1
  img_proc: true
- pgno: 276
  md: '这带来了第一个影响，既然考官知道自己录取和不录的是谁，**那么间接相当于天下人都知道了这位考官对某举子的态度。倘若一个不小心，把白居易之类有才华的人刷了下去，那是要被知识分子团体戳脊梁骨的**。


    ![](img/ef1c5244d092b8b29b53a68870574480_276_0.png)


    所以主考官对于录取名单，总是非常地头疼。'
  merge: -1
  img_proc: true
- pgno: 277
  md: '怎么办，只能去找诗文科才能更高，鉴赏力更强，影响力更大的文坛大 v 一起商量，拟一个差不多的名单，然后等阅卷纸交上来，再综合考试成绩来判断。


    最后公布的进士，往往跟之前商议的结果，不会相差太多。这就是所谓“通榜”制度，那些提供参考意见的大 v，就是“通榜人”。


    明眼人都看得出，这就是变相的推荐制。


    既然录取与否取决于“平时名气”这种很玄的东西，那么当然不忌讳夹带一两个私人进去，只要有合适的理由解释就行了。


    毕竟大家都很优秀的时候，录取谁就是公说公有理，婆说婆有理的事情。你爱李白文采俊逸，但杜甫老成持重也很好啊。完全没有一个主观的好坏标准，主考官和“通榜人”的解释权，是非常非常大的。


    而且“世家大族”的子侄们，可能早就交游于这些权贵之家，素有才名声望，通榜人可能就是看着他们长大的。那录取这些“优秀有名的少年”，岂不更是在情理之中？'
  merge: -1
  img_proc: true
- pgno: 278
  md: '事情不止如此，开元二十九年十月，韦陟接任礼部侍郎之后，他觉得“一考定终身”，并不能体现考生的真实水平。


    所以他觉得，应该让考生把平时的代表性作品也一起交给考官，以供参阅，这样才不至于因为临场发挥的限制而错失人才。


    那么对考生而言，既要参考平时成绩，而且录取与否，通榜人和主考官的意见更为重要，那么还不如直接向这些达官贵人、文坛名人递上自己的作品，求他们推荐自己。


    所以“参考平时成绩”的思路，跟显名阅卷带来的“通榜”制度结合起来，便催生了向达官贵人“行卷”求推荐的现象，美其名曰“求知己”。


    白居易那个脍炙人口的“道得个语，居易易”，便发生在他向顾况行卷的时候。


    顾况一看白居易名字，就笑他“长安米价贵，你恐怕居住不易。”'
  merge: -1
  img_proc: true
- pgno: 279
  md: '结果读了白居易递上来的“野火烧不尽，春风吹又生”，当下就拍案叫好，“能写出这样的诗，居住在长安也容易啊！”


    遂大力推荐白居易，白居易声名大振，次年顺利考中进士。


    如此一来，举子得到录取，**当年的主考官无疑就是他们的恩人贵人**。


    所以后来逐渐产生了“**门生座主关系**”，所谓主持科举考试的礼部侍郎，就是新科进士的“座主”，即“南宫主文为座主，登第进士为门生”。


    成为老师，甚至不需要传道受业解惑。


    主考官和通榜人，只是有了拔擢的动作，选材的权力，他们就自然而然地成了所有人的老师。


    这种“师徒关系”最大的作用不只是传授知识，更是利益集团、人脉提携。


    新科进士春风得意，走马看花之时，只记得慧眼识珠的恩人，有谁还记得教他们识字断句，吟诗作赋的乡塾先生呢？'
  merge: -1
  img_proc: true
- pgno: 280
  md: '![](img/ef1c5244d092b8b29b53a68870574480_280_0.png)


    所以如果事情真的变成学徒制，则“师承关系”最大的意义，除了传授最多的知识，还在于你拜了一个最有力的码头。


    知识的获取，是很容易的，随着科技的发展会越来越容易，但是人脉和机会始终殊为难得。


    在拜师的同时，你走上江湖时面对的第一个敌我势力格局，也就从此确定了。'
