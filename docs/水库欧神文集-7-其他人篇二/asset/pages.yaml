  md: '说白了就是人是个好人，心直口快，但做什么事情都做不好。


    就这么个人，每天抱怨自己是千里马，可是没有伯乐。


    虽然古文运动，一洗骈丽之风，是文坛上赫赫有名了不起的大事。可是跟今年多打二斤粮食，又有什么关系。


