  md: '葛伦通过打零工，帮人打扫卫生，刷马桶，推销节日商品，都没有赚到这些钱。

    第一次飞跃，就是通过低卖高卖的交易。


    就是葛伦所说的，先找到卖家，再找相应的商品。

    其实他一开始就想这么干，不过钱实在少了，只有 100 美金，只能先打工。


    后来，他先找到需要轮胎的买家，然后根据买家需求去找符合要求的废弃轮胎。

    找到符合要求的轮胎后，赚到 1500 美金，这样总算是有个地方住了。


    中产白领对于卖自己，经验是丰富的。

    但是大多数情况下都是买家思维，而不是卖家思维。


    典型的思维就是自己有什么，就想卖给别人什么。

    自己喜欢什么，就以为别人都喜欢什么。


    ![](img/ef1c5244d092b8b29b53a68870574480_942_0.png)


    就像朋友圈晒娃一样。

    你自己觉得自己的娃怎么都好看，其实别人并不觉得，恨不得把你给拉黑了。


    所谓卖家思维，就是要找到别人喜欢什么，不是自己喜欢什么。


    具备卖家思维后，第一件要干的事情就是获得初始业务量。


    不是先把门面撑起来，而是先要有业务。

    一个公司或者一家店，只是一个壳而已，并不是真正的 内容。'
