  md: '韩愈： “千里马常有，伯乐不常有。”


    柳宗元：“以其境过清，不可久居。”


    苏轼写李白，入选最多：“小舟从此逝，江海寄余生。”“总为浮云能蔽日，长安不见使人愁。”


    教辅材料，标准答案，一律是：


    “高洁傲岸，突出诗人不慕名利，不畏权贵的风骨。”


    “皇帝昏庸，大臣奸邪。诗人报国无门，可怜白发生。”


    好事者甚至总结成“答题公式”，堆积上去，准保高分无虞。


    # 一、古代诗歌常见题材:


    +   - 山水田园诗（热爱自然、淡泊宁静、厌恶官场、恬淡闲适）

    - 边塞征战诗（环境苦寒、边塞风光、建功立业、报效国家、戍边乡愁、孤寂惆怅）

    - 咏物抒怀诗（不畏生死、崇高清白、情操高洁）

    - 咏史怀古诗（怀古伤今、怀才不遇、感叹兴衰）

    - 赠友送别诗（离愁别绪、依依不舍、劝勉祝福）

    - 羁旅思乡诗（羁旅之苦、思念亲人、客居凄凉、厌恶战争、怀才不遇）

    - 即事抒怀诗（忧国忧民、讴歌山河、仕途倭蹇）


    热血少年，很容易就愤懑，为什么总是“黄钟毁弃，瓦釜雷鸣，谗人高张，贤士无名”。


    直到后来真读了韩愈《谏迎佛骨表》，才知道，这“文起八代之衰”的大古文家，竟然给老板写：


    > “以前没有佛法的时节里，黄帝武丁，都活了一百来岁。”


    > “自从有了佛法，事佛越虔敬，老板越短命，亡国灭种。”


    > “如今老板你再去迎佛骨，就为了延年益寿。你觉得靠谱吗？”


    这么缺心眼，皇帝只把他贬到潮州，已经是大大的良心。后来还再度被起用。


    然而韩愈还是凄凄惨惨戚戚，哭了一通“云横秦岭家何在，雪拥蓝关马不前”。


    又比如《进学解》，韩愈大发牢骚。写自己“学得勤，说得多，文章奇妙，行动有修养”，却不受重用，“如今还能白吃白喝，真是要跪谢天恩呢”。


    旧唐书对韩愈的评价却是：“愈发言真率，无所畏避，操行修整，拙于世务。”'
