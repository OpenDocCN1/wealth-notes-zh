- pgno: 881
  md: '穷困潦倒呢？


    ![](img/ef1c5244d092b8b29b53a68870574480_881_0.png)


    当陈生和陆步轩接触之后，才发现自己大错特错了。

    当时，陆步轩单枪匹马，每天能卖 12-14 头猪，这还只是在长安县这个小地方。

    这是什么水平呢？

    陈生那个是大公司，有很多卖猪肉的档口，规模化经营，每个档口每天能卖多少呢？

    1.2 头。

    就是说，陆步轩每天卖掉的猪肉是陈生每个档口的十倍。

    这是什么？

    这是业界奇迹啊。

    我们知道，在一个传统行业，充分竞争的市场，战略只有三个：

    第一个是效率

    第二个是效率

    第三个还是效率。

    一个充分竞争的市场，是没有战略的，唯一的战略就是**经营效率**。

    这就是柳传志说的，在每个环节上“拧毛巾”，通过每个环节的优化，把利润拧出来。

    陆步轩就是找到了卖肉这一行效率的秘密。


