  md: '南宋之后的知识界，主流舆论也都认为王安石变法葬送了北宋。王安石赢得了“拗相公”的外号。在民间故事中，饱受新法之苦的老百姓，喂猪的时候，叫唤：“王安石，来吃。”微服的王安石听了，羞愧不已。在稗官野史中，宋徽宗的军事投机失败之后，蔡京被流放，但是一路上老百姓都不卖吃的东西给蔡京，蔡京病饿而死。


    究竟应该怎样理解“改革”？并不是所有改变都可以叫改革。中国改革的成功经验，其实已经揭示了，改革，应该专门用来指放权、尊重市场、让利于民。历史学者汪圣铎等人指出，像桑弘羊、王安石这一类人，不应该叫改革家。对他们更合适的称呼，是“财臣”、“聚敛之臣”。'
