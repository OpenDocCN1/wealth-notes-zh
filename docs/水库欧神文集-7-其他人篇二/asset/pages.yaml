    # 中危女子图鉴 #X83


    # 一） 折足雁


    每周交一篇稿子，其实是很痛苦的事情。


    每次被催稿，当夜一定失眠，睡不足六个小时……


    这一期有一个现象，令我颇感兴趣：


    郑秀文和洪欣，脚前脚后被出轨。


    但与抹茶事件全然不同，她们获得了绝大多数公众号的赞美与同情。


    写手们义愤填膺，挖出毕滢和黄心颖的丑照，对比事业有成的郑秀文，和颠倒众生的洪欣。


    然后异口同声说：


    > “张丹峰一定是直男癌瞎了，在洪欣面前自卑。”


    > “果然许志安分合几次，骨子里还是个渣男。”'
