  md: '一般来说，人没有被逼到一定的份上，是不会做出选择。


    ![](img/ef1c5244d092b8b29b53a68870574480_885_0.png)


    # 四、边缘地带的王者


    如果你只是想安安稳稳的过一生，没啥大的追求的话，进入一个大机构，处处谨小慎微，这不失为一种好的选择。


    但是，如果你想发财的话，就绝不能走这条路，而是要进入增量市场。所有的大机构，都是在存量市场的，增量市场都在边缘地带。


    其实，这不是个例，而是中国改革开放以来的一个趋势。


    中国改革的聪明之处，就是不改存量，只改增量，但是增量发展的很快，最终带动了经济整体向前走。


    中国经济的革命，其实是从边缘地带开始的，可以称为“边缘地带的革命”。安徽凤阳小岗村、深圳特区，这些都是边缘地带的革命。就是摸着石头过河，各种试错，一旦成功之后，再从政策上确立。


    比如快递行业的发展，也是这样的。一开始，都是围追堵截，被人瞧不起，等到快递行业发展起来，还是给他们颁发牌照的。现在中国快递业稳居世界第一，包裹发送量是美、日、欧等发达经济体的总和。


    这里面就诞生了不少边缘地带的王者。


    虽然不是所有人都能做到像快递业的巨头们那样。但是也有不少人做到了像未成名时期的陆兆轩和陈生这样。


