    # 医患矛盾加剧？管理解决不了算法问题 #W32


    邓新华


    前不久，北京民航总医院的杀医案震惊世人。对这事，我当然跟大家一样，谴责杀医的凶手。很多人呼吁，要加强管理，减少医患矛盾。


    南宁一家医院实行"先安检后看病"


    ![](img/ef1c5244d092b8b29b53a68870574480_845_1.png)


    ![](img/ef1c5244d092b8b29b53a68870574480_845_2.png)


    南宁市第二人民医院，病人、家属接受安保人员检查后才能进入医院。'
