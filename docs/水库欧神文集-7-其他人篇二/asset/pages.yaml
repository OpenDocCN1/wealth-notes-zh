  md: '我当年也被这段话打动，但不是因为这段话有多好。而是因为，第一次，在紫霞剑下，至尊宝是把这句话当成套路，骗过文艺青年紫霞。这一次，也可以看成用套路消解“永恒的爱情”。


    ![](img/ef1c5244d092b8b29b53a68870574480_805_0.png)


    第二次，在水帘洞，至尊宝完全可以换成另外的话说，但是他却选择重复那段套路，这一方面表示，只要内核是真诚的，浮夸的套路也可以表现出真诚。


    另一方面表示，在至尊宝第一次套路紫霞时，他其实已经对紫霞有一点动心，但那时候他忙忙追迫，自己也没有清楚意识到，“只是当时已惘然”。所以，这段套路才会留在他心底。


    第二次说，不但回头使得第一次的套路有了新的意味，而且，至尊宝对紫霞的感情，经过消解、重建，更加令人信服。


    这就是用套路的高手。


    ![](img/ef1c5244d092b8b29b53a68870574480_805_1.png)


    就这一期来看，“奇葩说”的套路，完全是对哲学青年各种迎合。号称是辩论节目，但选手们各种修改前提、各种不讲逻辑。


    大家比姿态、比价值。


    他们的做法，和文艺青年把“挑战命运的悲壮”套路给农妇的哭声，没有什么区别。


    套路下，看不到辩论的内核。'
