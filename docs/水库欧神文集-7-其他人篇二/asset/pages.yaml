  md: '# 从“无冕之王”到“公号之王”  #X55


    原创： 桃军师 水库线下 7 月 28 日


    ![](img/ef1c5244d092b8b29b53a68870574480_65_0.png)


    # 从“无冕之王”到“公号之王”  #X55


    +   1) 冰火迥异


    兽爷成了“公号之王”，这事估计他自己也没想到。


    《役苗之王》之前，我看过他几篇文章。役苗这篇，其实操作并不出格，也没什么新料，就是正常写法。只是如往常一样，扒清楚了事情的来龙去脉。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '文章之所以火爆到如此程度，很大程度上要归因于事情本身强烈的话题性，多个因素复合在一起，每一个不新奇但都极其现实。


    群众都爱吃瓜看戏，却不料一回头，发现自己才是戏中人。很少有人有这个心理建设，所以基本都要抓狂。


