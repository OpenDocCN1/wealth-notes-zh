  md: "> \"必须学习这些，提高素质，成为别样的人们。\"\n\n没去过日本的人，不少也人云亦云。\n\n就算有人指出成本之昂贵、人心之移易，他们也会坚持说，为了更高的目标，这都是值得的。\n\
