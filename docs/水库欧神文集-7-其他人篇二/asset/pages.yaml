  md: "以空间换时间，积小胜为大胜。  \n赢也好，输也好，就是不投降，死死拖住日本人。  \n我们国家地方大，日本人占领的越多，兵力就越分散。\n\n最后其实日本人只控制了铁路沿线，远离城市的地方，那是游击队的天下。\n\
    \n谁告诉你，战争胜利就是靠一步兵平推？  \n抱住别人，也是胜利。\n\n大家不知道吧，很多不平等条约是在抗战中废除的。  \n就是因为中国付出的巨大代价，各国才纷纷废除了与中国的很多不平等条约。\
    \  \n你要没贡献，别人为啥给你利益啊。\n\n很多人谈持久战，都忽略了一个，就是持久战之下的速决战。  \n\\#毛教员特意强调，战术上一定要速决。\\\
