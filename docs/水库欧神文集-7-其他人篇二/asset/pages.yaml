  img_proc: true
- pgno: 992
  md: '![](img/ef1c5244d092b8b29b53a68870574480_992_0.png)


    但是气人的是，教科书也不告诉你怎么以弱胜强？


    教科书只讲what，不讲why和how。


    历史上的这种著名的以少胜多的战例，如果仅仅是凭运气，那看了也没有多大的帮助。没有可复制性。


    咱们先别说实践，至少从理论上可以你得说得通的。理论上都说不过，那就别提实践了，肯定是一场灾难。


    那么事实上的真相是什么呢？


    +   - 真相就是从来就没有以少胜多，以弱胜强。

    - 从来都是以多打少。

    - 从来都是以强胜弱。

    - 从来都是以有备打无备。


    没有一例是以弱胜强的。


    # ## 二、化整体劣势为局部优势


    核心的思想非常简单，化整体劣势为局部优势。


    在获得局部优势的前提下，扩大局部优势为整体优势。


    小公司能不能打败大公司？可以。


    一个大公司，你别看这么多人，分到每个业务，其实就没那么多人了。'
