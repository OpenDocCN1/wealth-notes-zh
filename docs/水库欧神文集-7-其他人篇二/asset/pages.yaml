    更不要提微信公众号兴起以来，写手们孜孜不倦贡献了大量垃圾。


    今天宏观政策解读，明天风吹草动放水，后天奥迪汽车致癌。


    到处有人故弄玄虚，跳出来煽动焦虑。'
