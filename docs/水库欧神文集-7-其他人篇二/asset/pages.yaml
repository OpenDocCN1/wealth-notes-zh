- pgno: 658
  md: '现代人能够在消费上碾压古代人，正是因为现代人拥有的资本品碾压古代人。程序员可以用电脑、手机，可以坐飞机，几个小时从北京到达上海，清代，连皇帝都没有这些资本品。


    人们发展经济的目的，就两个：


    +   1、满足更多的欲望；

    2、以更低的成本满足欲望。


    消费占收入的比例降低，体现的就是满足欲望的成本降低了。

    这既是经济发展的结果，也推动经济更快发展。

    刺激消费才完全是反经济发展的。


    # 五


    我在媒体工作，经常报道各种财经论坛。

    常常听到学者们大谈中国储蓄率偏高、消费率偏低。“消费是经济增长的引擎”，要“提振消费”。

    他们认为美国消费率高是优点。实际上，美国的消费率常是干预的结果，这已经阻碍了美国的经济增速。

    有一次，我就听到柳传志向一个经济学者提问：“中国储蓄率这么高，你们经济学者有什么办法让老百姓放心消费？”而那个“经济学家”也一本正经地说了一系列提高消费率的办法。柳传志和下面几百个观众认真倾听。


    请问柳大师，人类为什么不登陆火星，甚至登陆木星？那里有无穷无尽的资源。

    答：没钱啊，造不起宇宙飞船。

    哦，你刚才不是说，居民储蓄率太高，要拿点出来造汉堡包？

    答：我不是这个意思啦。我真实的意思是，为什么联想电脑卖不动……

    不过，柳传志虽然犯了小学生式的错误，但毕竟经济学不是他的志业。

    那些专业的经济学者，也陷在小学生的错误里，就没有辩解的理由。

    我知道他们的书本上是这么写的，但是当听到这些论调，最初的时候，我还是会在心里说：“疯狂，真疯狂。”当然后来也慢慢适应了。

    人类已经造出了载人航天飞船，而在经济学界，却仍然是小学生的错误当道。

    物理、化学、生物……这些学科都有错误，但至少已经犯小学生的错误存身之处。

    巴斯夏 100 多年前就详细剖析“节俭悖论”的错误了。但主流经济学者比小学生更难说服。


    ![](img/ef1c5244d092b8b29b53a68870574480_658_0.png)


    更糟糕的是，主流经济学者并不仅仅是说说而已，这些东西会经过凯恩斯主义的包装，成为政策。

    物理学家、化学家们努力创新，造福人类，而经济学者用各种谬误去削弱物理学家、化学家们努力的'
