- pgno: 948
  md: '后面，本来想通过倒二手房，风变冰，赚 2.5 万美元。

    结果，搞房子到中间的时候，发现了霉菌。

    美国的房子，很多都是那种木头房子，如果长了霉菌，会严重影响人的健康。

    如果要清理霉菌，需要请专业人士，花很多钱。


    ![](img/ef1c5244d092b8b29b53a68870574480_948_0.png)


    但是没有办法，只能花钱，最后少赚了至少 5000 美金，不过足以支付参加肋排骨的物料成本。


    里面最悲惨的是，快要开业了，本来说好要租的店面，别人要自己经营，不租给他了。

    这个打击比较大，只能再找店面。


    ![](img/ef1c5244d092b8b29b53a68870574480_948_1.png)


    普通人要遭受这样的打击，早就不想干了。

    但是如果你想象这是一个生存冒险游戏的话，就没有任何沮丧了。

    比如说，你在野外，不能说三次都没捕到那条鱼，你就不干了吧？

    所以，为什么说求生金字塔的底部是意志力呢？


    在这种情况下，葛伦和他的团队依然没有放弃。'
