    # 二）砸掉，统统砸掉


    今天看欧大新文《*屏丝十九问*》，那张征婚图片，我昨天也看到了。


    作为女生，自然多停留了几眼。


    一是要看如今青年才俊的择偶需求，二是要反向看看青年才俊的大体水平。


    看到第三个问题，脑海里划过一念头，“此人没救了”，于是后面几个问题全部略过，默默滑屏了。'
