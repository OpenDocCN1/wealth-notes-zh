- pgno: 938
  md: '> 生存技巧犹如一个金字塔，塔的最底部是求生的愿望与勇气，塔的上一层是生存的知识与技巧，知识越丰富，生存的机会就越多。

    ----《怀斯曼生存手册》


    # 一、城市生存之道


    如果你要是问一个中产下岗或者退休了，想干点什么？

    多半的情况就是想开个店，比如说小超市，奶茶店、面包店、鲜花店、图文店。

    如果是房圈的，就想赚点现金流。

    这种情况下，往往想开个房屋中介，还有人想做贷款中介、法拍业务。


    最近这种问题太多了，所以单独写一篇。


    中产眼中就只有一条路，打工和开店，对于别的出路实在是想不出来了。

    有人会说，打工和开店，这不是两条路么？

    不要误会，指的是先打工赚钱，然后再开店将钱亏掉，促进了市场的繁荣。

    春蚕到死丝方尽，化作春泥更护花。


    通常的方式是这样的，先把一个大摊子支起来。

    一般都是自己特别想干某件事情，觉得自己有能力做，然后就开一家店面或者公司。

    大上办公楼租起来，CEO 自封起来，人招起来，威风八面，然后呢？

    然后挂了。


    中产对于开这些店，还充满了美好的想象。

    比如说开个面包房，就想着每天穿着干净的制服，闻着面包的香味，充满了小资情调。

    知乎提问：如何优雅的面包？

    她们丝毫没有考虑，面包卖不出去，库存是会堆成山，只能在哭声中倒掉。

    比如说开个花店，想起来，每天面朝小海，春暖花开。

    其实开干之后，发现每天要 4 点起床去进鲜花，晚了就鲜花就不是鲜花，而是蔫花了。


    店一旦开起来，就有了固定的开销，租金、水电、税费、人工等等。

    商业术语叫固定成本，每月的钱哗哗的往外流。


    +   * 那么你的客户在哪里？

    * 你家的东西和别人家的有什么不同？


    人总是要买东西的，那么别人为什么要买你的？

    这些问题从来没有考虑过，仿佛店开起来自然就能赚钱似的。

    这根本不是对创业本身感兴趣，而是对于创业后的成功感兴趣。


    在很多人的认识中，创业就是风险很高，但是一旦成功就可以赚大钱。

    你要去搜创业，一大把的经验，各种创业导师告诉你投资 1000 块，每年赚 1000 万。

    你再去《燃点》这样的纪录片，发现创业者大部分都过得灰头土脸，有几个到现在已经倒'
