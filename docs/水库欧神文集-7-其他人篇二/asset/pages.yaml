    # 三


    宽恕未成年人犯罪这样的观念，是怎么来的呢？


    网上有个案例，说的是，1999 年 4 越 14 日，日本山口县光市，刚满 18 岁一个月的福田孝行，乔装成水管工人，进入本村弥生的家中，试图强奸。强奸未遂，福田孝行杀害了本村弥生，还有她
    11 个月的婴儿夕夏。


    案件震惊了日本。很多人要求判福田孝行死刑。但由于日本对成年人的法律认定标准是年满 20 周岁，福田孝行很有可能免于死刑。所幸的是，在多方努力下，福田孝行最终还是被判了死刑（注：日本死刑的开始）'
