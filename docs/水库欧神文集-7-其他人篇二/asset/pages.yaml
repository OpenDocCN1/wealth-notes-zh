- pgno: 886
  md: '# 一个人，在任何一个行业，只要做到前 5%，都能获得很好的回报。


    在边缘地带，竞争没有那么激烈，胜出的机会非常大。陈生就直言不讳的说，他们就是和农民竞争。


    尽管陆步轩在北大演讲的时候，说给母校抹了黑，陈生也说他们是北大的丑角。这些只不过是他们面对社会偏见的一种谦辞而已。他们全部演讲并不是说这个意思，而是对他们的事业很骄傲和自豪。


    比如陆步轩，他之前的生活，是赚着不菲的收入，上午忙完之后，下午喝喝小酒，用他自己的话说，“过着自由自在牛仔般的生活。”


    即使陆步轩没有成名，依然可以潇洒的过完这一生。陆步轩曾经说，他最大的成功就是不成功。


    正是无数这样的人，一次次的改变了中国经济的面貌。


    大家肯定经常听到中国崩溃论这样的论调。一旦中国经济增长乏力，总有人不断唱衰，就是所谓中国崩溃论。中国崩溃论之所以一次次的破产，就是因为这些人根本就看不到中国的边缘地带。


    这种边缘地生长出来的新物种，极富生命力，极端顽强。最终，在人们完全没有想到的地方，完成了突围。


    比如说，2002 年，曾经有一篇热文，叫做《深圳，谁将你抛弃》，文中列举了深圳无数的问题，仿佛深圳马上就要完蛋似的。现在看来，文中设想的种种困境，都以一种出人意料的方式化解掉了。


    只要中国继续允许这种试错，中国的经济就会继续向前。希望这一次，也不会例外。


    # 五、结语


    存量市场，聪明能干的人非常多，长期激烈竞争下来，其实每个人都不怎么挣钱。如果胸怀大志，应该努力找到增量市场，而增量市场往往在边缘地带。


    边缘地带，竞争相对薄弱，只要在一个市场或者一个区域做到前 5%，就能获得较好的回报。实在做不到 5%，找到提升经营效率的诀窍，依然可以过上不错的生活。


    做一个边缘地带的王者，才是如今唯一的成功之道。


