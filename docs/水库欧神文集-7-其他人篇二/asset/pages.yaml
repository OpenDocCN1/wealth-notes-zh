- pgno: 997
  md: '具体在执行的时候，其实你更应该关注持久战之下的速决战。


    你一场仗打下来，有得赚，才能持久战啊。


    比如去年、今年上半年没有买深圳，就错过太好时机了。


    南京这几天，也出了相关的政策。


    按照这个形势，一些一强二线要是有个风吹草动的，说不定也要出政策。


    但是水啊，它总是要流动的。


    老有人问我，是应该买重庆，还是买深圳，上海等一线？


    其实从城市角度来说，关键是代差问题。


    要是有代差上的碾压，数量很难战胜质量。


    但是如果代差距离不大的话，数量完胜质量。


    一线和重庆，本来是有代差的，但是当前这个节点，代差被压制住了。


    这种情况，买重庆是一个比较好的时机。


    还记得我们上文说的施里芬计划中的动员时间差吧。


    你可以在一线被压制的时候，先在重庆取得决定性的胜利。


    其实前几年这么做的，都赚了不少了。


    从个人来说，你还要看看，你的整体劣势能能不能在重庆形成局部优势？


    做到这点，还真的不是很难。


    你 1-2 套的话，不用想这么多。


    布局重庆，一定要有足够的数量。


    我的习惯，就是一般在一个地方先买个 1-2 套，熟悉一下情况。


    然后，循序渐进。


    当条件合适的时候，集中调动弹药，高于普通人 6 倍的力量（6N），一举奠定格局。


    当然，我们的对手是通胀。


    这个搞法，经常被水库元老们嘲笑说是 all in。


    其实，这根本不是 all in，只是集中优势兵力形成局部优势。


    有些时机，千载难逢。


    每个人的情况都是不同的。


    你如果在一线城市，资源都快耗尽了，就需要走出去。'
