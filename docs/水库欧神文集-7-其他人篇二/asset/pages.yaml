- pgno: 988
  md: '当时西班牙南部其实已经完全被穆斯林占据，所以对于葡萄牙和西班牙来说，他们感觉到威胁就在眼前。亨利王子的行动是十字军运动的后续，亨利王子本身就是教皇任命骑士团头目。


    为什么十字军失败了，亨利王子却成功了呢？

    原因是显而易见的。


    +   耶路撒冷离西欧也太远了，攻下来，也守不住。

    北非则离葡萄牙的本土非常近，但是葡萄牙也是花了很大的力气才守住。


    葡萄牙人通过这个“核”学到了很多殖民的知识，航海知识则是通过雇佣意大利船长获得的（买第一套房学到很多房产知识）


    攻占休达港之后，葡萄牙人发现，和休达城相比，他们住的房子简直就像猪圈一样，穆斯林也太有钱了。亨利王子这个人比较有头脑，他更关注财富的来源，从战俘的口中得到了与非洲的贸易情报。


    最早，葡萄牙人的目的是一直沿着非洲海岸发现各种群岛，建立贸易点，最终一直到印度和东方其它国家，取代了阿拉伯人的贸易线路，大发其财。

    殖民贸易这套玩法，最早就是这么来的。

    西班牙、荷兰、英法都是后来居上者。


    最后，在新大陆、欧洲、非洲之间形成了一个稳定的“三角贸易”结构。

    这就是一种新模式。


    ![](img/ef1c5244d092b8b29b53a68870574480_988_0.png)


    先有的商业革命，再有的工业革命。

    在工业革命之前，这些国家就已经很赚钱了。


    明白北约为啥叫北大西洋公约组织了吧？

    这帮人是一伙的。

    不过，他们现在衰了。'
