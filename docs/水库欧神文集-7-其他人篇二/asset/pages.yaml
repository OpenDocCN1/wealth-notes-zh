- pgno: 520
  md: '的饮食习惯，跑起来不疾不徐的心境。


    仅这一条“不疾不徐，不骄不躁”的坚韧，就能把韩愈李白苏东坡这批情绪化文人，统统拍死在漳州边。


    等到王安石写《材论》，他写的则是，“为什么皇帝无才可用，因为你心态不对，因为你没有把人才放在最适当的位置上，因为你没有出题去辨别真正的人才”


    这已经进入帝王心术的范畴了。


    然而越是理智的拆解，就越是丧失了生命的活泼与情趣。情感上无法再打动读者。


    “拣尽寒枝不肯栖”，总比“天下之患，不患材之不众，患上之人不欲其众”动人心魄多了。


    写作之事，无不如此。灵感偶尔，是难得的令人惊艳的作品。


    可是灵感的火花，是无法量产的。


    一旦天才的创造变为谋生的手段，所有人都面临产出的困境。


    所以超写实主义画家查克·克洛斯的说法是，“灵感是业余者在用的，我们专业人士只是早上去上班而已。”


    设计师们总结的经验是，“打造一个技艺盔甲”，即使只有半小时，也能创作出一篇合适的作品。


    当到了这个时候，消费者还会沉迷于种种幻境。


    可是生产者已经清楚地知道，行文调动的情感，画作里击中人心的元素，是自己怎样总结、提炼、迎合市场的结果。


    如果你想要产，一定要有工业化的流程。


    将产生灵感的过程，用理智分析清楚，然后重复一千遍。


    灵性从此泯灭，你的思维从“一樽还解江月”的潇洒，变成枯燥无味的说理文。但是到这时，你才在这个世界上，能够真正稳定地存活下来。


    说句老实话，我越来越不喜欢写文章。因为我知道这是一份工作。


    我知道读者想要什么，也知道怎么给，起承转合如流水线，作品都是长得一样的罐头。


    所以我会抗拒。我宁愿人家说我文章烂，也想写点自己喜欢的，不是罐头的东西。


    但我也知道，哈尔滨有个小饭馆，女婿接了岳父的班。'
