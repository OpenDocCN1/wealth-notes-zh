  md: '服务业占比增多，将带动中国经济走向慢增长常态。


    # 沈明高：服务业占比上升 中国经济“慢”增长将成常态


    沈明高称，只要服务业占比上升快，GDP增速都会放缓。全球金融危机后，当服务业占GDP比重达到50%时，一般经济平均增速只有6%左右。


    中国经济是否出现这样的转型，这暂且不论。我们只说说，制造业向服务业转向，为什么增长就会放缓呢？


    一般的理由是，从资本投入产出看，服务业产出效率要低于制造业。制造业的特点是，只要资本投入，生产线一上去，产能从 0 放到无限大。制造业范围广泛，效率和产量提升的空间非常大。制造业对人力有很大需求，只要持续卷入人口，不断生产商品，就会出现财富爆炸。


    这些说法基本正确。但是一说到服务业，这套理论就出了问题。他们认为，服务业是一对一服务，高度依赖人的劳动。人的劳动很低效，每天要吃要睡，摄入能量基本恒定，产出服务差不多。人不是机器，物理移动慢，有七情六欲。人服人，再怎样提高效率，也实在有限。


    据说国际上有个通行标准，只要服务业占比超过 50%，经济增速就会慢下来。发达国家服务业不是都占经济 70%以上么？和中国这样制造业驱动的国家相比，他们增速自然较慢。等到中国完成工业化，服务业发展起来，经济增速自然会慢下来——类似说法，可以称作“服务业魔咒”吧。


    听起来很像那么回事吧？可惜的是，以上全错。我在前面其实已经给出答案。谁说服务业占主导，经济就不能快速发展？数字经济驱动下，服务业完全可以爆发性增长，甚至是指数级增长。


    数字化是信息化，大量服务业是依赖信息运行的。信息获取的成本，过去可能是无穷大，现在则是无穷小，这种转变带来的效率提升，非常惊人的。最典型的是通信、导航和网约车。过去没有微信，人们也交流信息，但频次密度要小得多，现在则是可视化、全天候；导航和网约车大大便利了出行，没有它们，许多出行根本不会发生。


    制造业最引以为傲的特点规模效应，体系一旦建立，生产越多产品，边际成本越低。而服务业在数字经济驱动下，其实有更大规模优势。还以网约车为例，几千人的团队制作一款软件，就能为几亿人精确调度，边际成本几乎为零。越多人使用，信息越丰富，效率就越高。


    当然，我在这里不是抬高服务业，脚踩制造业，而是想说明：后工业时代，服务业变得发达，经济增速并不必然下降。相反，服务业可能是效率最高、最有活力、增长最快的的领域。大量新技术以服务业为源头，并被用在制造业领域。过去几年国家大谈“互联网+”，就是希望服务业带动制造业发展。'
