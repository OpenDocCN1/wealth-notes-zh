  md: '# # 日本的死循环


    原创：邓新华


    ![](img/ef1c5244d092b8b29b53a68870574480_709_0.png)


    # ### 日本的死循环 #W14


    这篇又要骂日本了。


    经常有人跟我说：“骂美国、日本安全，你就老骂美国、日本。它们做得够好的了，为什么还骂它们？”


    首先，是美国、日本做错了，我才骂。


    其次，骂美国、日本，目的不是骂它们，而是贯彻一种分析问题的视角、方法。如果你理解了这种视角、方法，就知道，无论是哪个国家，学它们的做法都是错误的。


    骂日本之前，先讲一个故事。


    有一次，一个女媒体人在群里说：“赡养父母怎么了是子女的责任呢？那应该是社会的责任。”


    我马上问：“什么叫‘社会的责任’？‘社会的责任’不就是是除子女之外的其他青年人的责任吗？为什么要给你养老不是你自己的子女的责任，却是别人的子女的责任？”


    还要不要脸？'
  merge: -1
  img_proc: true
- pgno: 710
  md: '日本正是在这种心态下，陷入了死循环。


    —


    9月初，日本首相安倍晋三在视频上宣布，从10月开始，日本幼儿园和保育园（3-5岁间）的学费全免，政府埋单。


    ![](img/ef1c5244d092b8b29b53a68870574480_710_0.png)


    中国的媒体上一片羡慕之声。


    > “看看人家，连幼儿园都免费了呢。”


    这真的是好事吗？


    当然不是。


    免幼儿园学费，目的是提高日本的生育率。


    日本已经进入“超老龄化”社会，65岁以上的老人，占比将近30%。


    1947年，日本的出生率为4.54。'
