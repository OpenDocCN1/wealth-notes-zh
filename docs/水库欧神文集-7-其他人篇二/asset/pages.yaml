    在《三体Ⅱ：黑暗森林》中，实际上提出了这样一个问题，那就是如果面对外星人的入侵，我们地球应该采取什么样的社会形态来应对？


    小说给出的答案是，整个人类世界进入了一个极权政府的状态。文化上，政府开始管控。经济上，开始推行平均主义，最后干脆使用配给制，也就是命令式的计划经济。


    这样的政治体制和经济政策，带来的结果，那就是，三体人还没有入侵，人类社会自己先崩溃了。


    人类进入一个长达 50 年的黑暗时期，地球变成了地狱，世界人口从 83 亿降到了 35 亿，人口消失了一半多。


    50 年死了近 50 亿人，一年一个亿，平均下来一天就要死 27 万多人。


    就在人类一只脚已经踏进地狱，即将万劫不复的时候，2080 年左右爆发了第二次启蒙运动和第二次文艺复兴。


    这次人类喊出了一句金句：给岁月以文明，而不是给文明以岁月。


    就是说，与其为了远大的目标，苟且偷生的活着，还不如让人们自己决定，怎样活的更像一个人，更'
