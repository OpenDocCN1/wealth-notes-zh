    \n从搞房子的角度说，时机、地形、兵力三三大要素是什么？  \n\\#择时、选筹、杠杆。\\#\n\n有人讲，水库不是讲2N吗？  \n择时有那么重要吗？\
    \  \n当然了。\n\n所谓2N，其实是一个长期战略，是持久战。"
