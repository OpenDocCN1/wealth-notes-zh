- pgno: 647
  md: '这些说法当然是错误的。


    所谓经济质量高，是指资源得到有效配置。资源得到高效配置，经济增速就一定高。


    用奥派的话来说，经济质量高，那就意味着产权得到保护、高度尊重自愿交易。而高度尊重自愿交易，效率一定是大幅提高的。


    尽管奥派反对 GDP 统计，但客观上看，GDP 的增速也一定是高的。


    的确有低质量的高增速，但一定不会有高质量的低增速。


    美国、日本、欧洲，差不多前后脚进入经济低增速时代，当然不是因为“发到一定程度经济增速自然会下降”这样的“规律”，而是因为全球干预思潮的兴起。


    并且，经济最发达的美国，比日本、欧洲略晚进入低增速时代，而且美国增速至今还略高于日、欧，也说明“发到一定程度经济增速自然会下降”根本就不成立。真正的原因是，美国的干预思潮不及日、欧厉害。


    干预主义压制人类经济潜能的程度，超过大部分人的想象。


    # 五


    也有明智的经济学教授。


    谢侍诗教授说：很多人说发展经济很难，但其实发展经济是最容易的事。因为每个人都想发财，又不需要你去督促，你只要让他们自己去搞，经济增速肯定高得超乎你的想象。


    今天，资本品的丰裕程度远远超过过去，科技创新的涌现速度远远超过过去，要想经济进入低增速才是不容易的，需要人们付出相当程度的努力。


    （邓新华，2019 年 7 月 16 日）'
