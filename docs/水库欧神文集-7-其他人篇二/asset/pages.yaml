  md: '# 日本通往经济停滞的道路，由垃圾分类铺成 #W02


    邓新华


    ![](img/ef1c5244d092b8b29b53a68870574480_624_0.png)


    日本通往经济停滞的道路，由垃圾分类铺成 #W02


    先讲一个故事。这个故事我讲过多次。


    从前有个国王，有一次走在路上，被石子伤了脚。他大怒，命令把全国的道路上都铺上牛皮。


    有个大臣对他说：“你的目的不就是不被石子硌伤吗？那把你的脚裹上牛皮就可以了啊。”


    国王大悟。


    据说皮鞋就这样发明出来了。


    一


    有人去日本旅游，大夸日本人素质高，服务行业从业人员礼貌得令人惊讶。


    他说：日本的出租车司机，哪怕白发苍苍，都会绕过来给乘客鞠躬、开车门，然后再绕回去开车。


    对这个故事，我写了一篇文章。文章说：


    出租车司机每天需要鞠躬、开门多次，如果这么做不到金钱的回报，那么，就会有一部分人退出这个行业，转向不需要这么做的行业，比如制造业。由于供给减少，剩下的出租车司机价格就会提高。


    也就是说，出租车司机的鞠躬、开车门，必然会体现在车价里，是乘客付费购买的服务。即便出租车司机自己认为自己是免费付出的，实际上他也收费了，这是供求关系决定的，和他的主观意识无关。


    我说：你可以赞赏这样的服务，但是要意识到这是收了钱的。


    这本来是很简单的经济学道理，可是文章下面，一大堆人痛骂我庸俗，狭隘到不肯承认日本人素质高。


    “中国出租车司机也收了钱，会给乘客开门吗？不骂乘客就不错了。”


    中国的五星级酒店，门童也会礼貌地为客人开车门，对此，他们知道门童的付出一定是收了'
