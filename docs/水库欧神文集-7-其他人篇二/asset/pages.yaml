    \  \n正面战场中国溃败，但是八路抓住时机收复失地，发展一跃千里。  \n那交通线总共也没通几辆车，简直无法形容日本人战略上的愚蠢。\n\n中央红军到达陕北的时候，只剩下6000人，再加上其他方面的红军，只有几万人。\
    \  \n到1945年，日本人投降，八路已经是百万雄师，根据地人口9000多万。  \n通过收复失地，拥有了争雄天下的资本。\n\n就是说，形成局部的以多打少，从战略上是没问题。\
