    “一本书讲透腹黑帝王学，封建王朝的残酷生存智慧”


    这个认知的在于，“帝王心术”不是一本书，甚至没有能够通过成文的记载流传下来。


    更确切地说，它是一种“教育”。但最关键的技艺，并不是某种特定的补锅锯箭法，朝堂颉须术，甚至不是已有的学说流派。


    而是帝王认识事物的角度、方法、思维，与平民截然不同。这是一个根本上的思维问题，是脑回路决定了决策的结果，命运的高低。'
