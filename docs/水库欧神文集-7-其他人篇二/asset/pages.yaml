- pgno: 185
  md: '所以事实不是世界变得混乱，而是使用互联网产品的人越来越多，消息的更新比以前更细致和及时，由此带来了内容上的多元化。


    而用户基数的增加，必然伴随着去精英化的趋势，因为金字塔尖的人数毕竟是少数。做大市场的同时，伴随的是产品的下沉。


    国贸小白领知道抖音好玩，农村牌牌琦当然也想玩。西二旗码农知道开顺风车可以拉妹子，黑车司机当然也知道。


    除非设置一道显性或隐性的门槛，只允许某些特定用户进入，否则牌牌琦和滴滴司机的涌入，让抖音和滴滴失色，就是早晚的事实。


    > 参考文献： 《变态已显的抖音还能火多久》


    所以，如今连农妇团队都做到过“自媒体月薪 7 千”，“我大专毕业修机车”的回答也能在知乎混到上万赞。人人都知道微博梨视频可以爆料，儿子掉进水塔烫伤，老父亲立刻熟练地开通微博和公众号，发布大量描述和照片，把事情闹大。'
