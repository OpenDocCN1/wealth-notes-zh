  md: '“我们呢，历经千辛万苦，九九八十一难，终于帮您搞定。”


    “再难的事情我们也要去做，这是我们义不容辞的使命！”


    实则可能就是每天递一条烟，和有关部门的小弟混得熟稔。然后有了资料就交给人家，夹带进正常文件堆里，几近于无本生意。


    所谓“办理费用打折”，其实本来就没有费用。


    事情确实是很重要的，但是过程并没那么困难。


    例子未必真实成立，大家会意就好。


    反过来说，有些东西，效力上并没那么重要，但是做起来非常麻烦。


    比如税务代理，审计报告，讲起来只是帮助报税，却要把人家账目统统梳理一遍。


    这种东西，就一定要“按项目数量和工作内容收费”。


    “我们严格、合规地执行了XX 程序，包括 XX、XX 和 XX。为此，您需要支付 XXX”


    但不管是“绕难实易”，还是“绕易实难”，有一点是不变的：


    委托人作为一个“行外人”，并没有能力知道工作的具体内容。


    这就像动画片里经常出现的香肠机，左边把肥猪赶进去，右边香肠源源不断地涌出来。


    可是猪肉是怎么变成香肠的，你永远都看不到。


    ![](img/ef1c5244d092b8b29b53a68870574480_467_0.png)


    你也无从核实被委托人话语的真伪。往往是人家说什么，你就信什么。


    肥奔驰的，便颠倒提你起来也不好，煮你在锅里也没气。'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# 三) 萝卜大印


    赌博的时候，你押注下去，等待人家发牌给你。


    然后发牌机发了两张牌给你，你心跳如鼓地揭开。


    在这个过程中，你不知道发牌机怎么出千。所以等待发牌和下注的过程中，你也就无事可做，只好坐在那里吃水果。


    虽然有人可以通过此前的赌局记录，来猜测下一局的结果，但开发牌机的人不是你，下一张吐出来的牌，就不会受你的控制。


    > 当一件事情，它的过程对你完全是不透明、不开放的，你也丧失了影响结果的能力。


    ![](img/ef1c5244d092b8b29b53a68870574480_468_0.png)


    如果说“信息隔断”带来的是议价空间，那么“过程隔断”，意味着事件的控制权发生了改变。


    《獒子帝》里，韩獒子只身入匈奴大营谈判，与他争帝位的对手东海王想要趁机夺权，于是想办法抢了大印跑路。


    然而，当他把印章揣在身上，发号施令，他却发现，没有一个人响应……


    东海王非常纳闷：印在我身上，你们为什么不听我的？


    这段实在是非常好笑，作者在嘲讽东海王的脑筋单纯：他把权力的象征，当成了权力本身。


    北军只会服从于能够影响他们命运的人。


    韩獒子与匈奴单于谈判，可以影响战与和的结果；崇悦排兵布阵，可以影响战争的胜负。'
  merge: -1
  img_proc: true
- pgno: 469
  md: '可是这两件事情，东海王都插不进手。


    韩孺子是北军的名义将领，而他不是；柴悦是军队的实际控制者，他也没有这个才能。


    东海王，以这种方式被排除于军队的权力核心之外。


    他没有能力影响军队的未来，于是他对军队就没有足够的控制力。


    如果一个人无法插手中核心决策，人家都偷偷开会决定好了，最后丢一个结果“例行通知”你，那么你就是这场权力游戏的局外人。


    莫说拿印，拿一百个传国玉玺也没用。


    ![](img/ef1c5244d092b8b29b53a68870574480_469_0.png)


    “权力中枢”的意思，绝不是官职最大，或离皇帝最近。


    而是这个小团体能够决定的事情，数量最高，影响力最大。


    所以，发牌机也好，香肠机也罢；使用别人的渠道，最大的问题，就是你无法参与整个决策过程。


    把自己的脑袋挂在别人的裤腰带上，是一种怎样的体验。


    # 四）交易的艺术


    IT 部赚得盆满钵满，IT 总监满不在乎：


    “就是因为你不通 IT，所以每次我递账单，你只能买单。”


    老板背转身，点了一支雪茄，暗暗冷笑。


    “我知道你是黑箱。可是你用 2%的成本，理清了公司内部账目运作。”'
  merge: -1
  img_proc: true
- pgno: 470
  md: '“公司赚钱才是大头啊。”


    御膳房主管走后，大太监忍不住问：“皇上为何不惩治御膳房贪污之举？”


    皇帝望了他一眼：“御膳房办事尚属用心，野菜也炒得好吃。”


    “两相比较，捞油水并不重要，从我私房钱里支了便是。”


    大老板不懂 IT，皇帝不懂御膳房。


    如果不能了解一个行业的细节信息，不能参与到事情运作的重要环节之中，那么这个行业，对你来说就是“黑箱”。


    # 可是，你为什么要打破所有的黑箱呢？


    大老板从不关心谁吃了一二百元回扣，他只要算公司的总账。


    只要 IT 事业部对于公司的总利润，依旧有巨大的贡献，那么贪污的成本上下浮动，对大老板并不重要。


    皇帝不需要知道御膳房捞了多少油水。他对野菜的口味感到满意，并且觉得成本可以承受，那就 OK。其余的事情不重要。


    中介、代办、第三方服务行业，利润丰厚，黑幕众多。如上所述，全是风险。


    可是你给人家几千块茶水费，换来的是日后上百万涨幅。


    正所谓，只要项目依旧有性价比，你不需要关心苹果从山里运到餐桌上需要经过多少手。'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# 历史求诸野


    +   皇上吃野生老紫米，每日绝吃不了一斤，每日外交交御膳房饭局掌局者若干，局外人不能知道。掌局交掌案每日二十五斤。掌案、厨役头、大火烛、二火烛四个人五日一班，两火烛一班可分十斤米，掌案及厨役头每日分皇上吃剩者。此举米之一项，以例其余。


    例如，皇帝喜欢吃野生老紫米，撑死了他一天也吃不了1斤。但是，每日采购数至少要25斤。为什么？厨房炒菜、烧火的、洗碗的、扫地的，人人都是要分几斤嘛。其他食材，基本也是如此。


    Dt>0。只要这场交易对于你来说，依旧是创造价值的，那就足够了。


    是否需要更低的成本，那是你自己的决策，你可以在市场上多加挑选。


    而不是气忿忿地，“凭什们人家赚我的钱赚得这么轻松”


    很多人最在意、心里最难堪的，往往是人家赚了他的钱。他最得意的，是自己一分钱不花，而赚了人家的钱，占了人家的便宜。


    他们最喜欢与人比较、争斗、抢夺、表现自己，心思永远不放在自己的事情上。


    也不懂得与人合作分利，借助小利的付出，让别人帮助自己达成核心目的。


    这种人是欠有贵人运的。


    有了天大的好机会，都会第一时间跳出来，用下作的手段和令人费解的世界观，向所有人证明自己果就是个靠不住的人。


    黑箱有种种弊端，可是只要不动摇你交易的根本目的，小来小去的部分，就应当予以忽略。'
  merge: -1
  img_proc: true
- pgno: 472
  md: '完美主义是种病，不愿意丧失每一分钱就是穷。


    一个时时被别人赚钱的时代，才是真正地美好呀。


    生活的意义，就在于选择一个最大的箱子，然后把它变成黑箱。


    事情只能在你手中完成，别人都需要借助你的力量。但你为他们，提供了更高的价值。


    与此同时，你也去采购别人手中的“小箱子”。当一阵子“肥鹅”，却用人家的箱子撬动了更大的能量。


    做人要算大账，不要在两分钱手续费上打转转。


    做完一笔大单，你去吃名门骆家的黑叉烧。


    黑叉烧真的好吃，吃得人兴高采烈，这就够了。


    你何必去想，人家一块猪肉赚你多少钱。


    （司空军师祭酒桃，2019年5月4日）'
  merge: -1
  img_proc: true
- pgno: 473
  md: '# 皇帝不管御膳房 #X84


    桃军师


    ![](img/ef1c5244d092b8b29b53a68870574480_473_0.png)


    皇帝不管御膳房 #X84


    # 一）御膳房


    公司每年都要买一部新电脑，理由花样翻新。


    IT 部赚得盆满钵满，大老板气得咬牙切齿。


    有一天大老板对 IT 总监说：“如果我懂 IT，第一个把你炒掉。”


    IT 总监呢，却满不在乎。


    “就是因为你不懂 IT，所以每次我递账单，你只能买单。”


    皇帝批奏折，见臣下奏报，时惟初春令月，气淑风和。


    当地士绅纷纷“雪沫乳花浮午盏，蓼茸蒿笋试春盘”，以食用春盘野菜为风雅之事，一派融融盛世景象。


    龙心大悦，皇帝也想去尝鲜。遂令御膳房速办。


    野菜好吃，月末御膳房的开支却涨了一倍。皇帝再蠢，也知道野菜这东西长在郊外，两个人能挖一麻袋。


    御膳房的人却振振有词：'
  merge: -1
  img_proc: true
- pgno: 474
  md: '> “按先祖成例，挖野菜须有一百二十个环节，精挑细选方能入口。走一遍流程，就是这个价。”


    ![](img/ef1c5244d092b8b29b53a68870574480_474_0.png)


    帮忙与被帮忙，委托与受托，已经是人们日常生活的一部分。


    +   • 机器稀缺，只有委托“有门路”的人购买。


    +   • “黑科技”费心力打通关系，承揽你各种业务。


    +   • 皇帝要让御膳房帮忙挖野菜，大老板的 IT 业务需要请人来做。


    +   • 甚至两人合伙去外地做事，一人先去打探情况，编织最初的关系网。


    总而言之，你借用了人家的“门路”，委托别人办事，也许交给人家一点茶水费。


    这种情形里，大坑往往是最多的。


    # 二）黑箱


    不要温和地走进那个良夜，不要毫无防备地借用别人的门路。


    因为“借用门路”，很多时候，意味着你进入了一个“黑箱”。


    “黑箱”的第一个特点，是信息的差异性：


    *你既不知道黑箱的运作原理，也得不到运作过程的具体信息。*


    合起来就是，你无法必然预料黑箱的运作结果。


    当有一个人向你承诺，“我有门路，知道如何办事”，他一定不会告诉你他的门路是什么，'
  merge: -1
  img_proc: true
- pgno: 475
  md: '走了哪条关系，具体经过多少人手。


    御膳房不会告诉皇帝，野菜从郊外到餐桌，是快马加鞭精挑细选成本高昂，还是草草在路边挖两根回去交差。


    因为这是要价的根本。


    所有油水、空间、坑骗，都从中而生。


    所有便利、利益、效率，也从中而来。


    ![](img/ef1c5244d092b8b29b53a68870574480_475_0.png)


    世间事分两种：看起来很*多难*，和做起来有多难。


    看起来很*难*的事，有的做起来很简单。


    想求多少资源，就是老板一点头的事儿。


    可是看起来很*简单*的事情，也许做起来很难。


    虽然老板点点头，只需要几束肌肉牵引。可如果没有一个合理的理由，也许老板的脖子永远坚硬，永远不肯点头。


    说这些是什么意思呢，“被委托者”，一定会在“看起来很难”和“做起来很难”之间，两头取高，套取利差。


    如办证送签，走通关系，这种做起来便宜但影响很大的事情，就会“按难度、按效果收费”。


    办理者会不厌其烦地强调，“我们帮你做的事情，非常重要”。


    过程的难度，则被极尽夸大：'
