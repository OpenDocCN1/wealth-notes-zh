  md: '![](img/ef1c5244d092b8b29b53a68870574480_761_0.png)


    # 四


    也经常看到人说：“难道穷人就活该被市场淘汰么？”


    1978 年市场化改革以来，是穷人被淘汰的历史吗？相反，穷人是过得越来越好。市场不保证每一个穷人不被淘汰，但市场让更多的穷人摆脱待淘汰的命运。


    一方面，市场让财富大量涌现，穷人的生活成本越来越低，和富人的享用差距越来越小。另一方面，市场也让做慈善的成本越来越低，穷人获得市场自发慈善帮助的机会也越来越多。


    如果误以为市场做得不够好，而去干预市场，那么马上就会提高消费者的成本，穷人境遇变差，自发慈善也变得更为困难。


    历史上，没有一次市场化改革让穷人大规模死亡。每一次市场化改革，都是救穷人于水火。


    穷人的大规模死亡，都是劫富济贫、干预市场的“实验”造成的。那你为什么还要有“市场淘汰穷人”的无端恐慌呢？


    其实和人们的直观印象相反，市场不偏向淘汰穷人，而是偏向淘汰富人。市场化改革，稳步提高穷人群体的生活水平，无数的富人却因为经营不善而破产。眼见他起高楼，眼见他宴宾客，眼见他楼塌了。市场的“算法”对富人最是无情。在市场中，一旦企业家没能讨好消费者，那么消费者就会毫不犹豫地把他们从富人的行列中拽出来。当然，富人的总数量是上升的。因为，市场让更多的穷人有机会变成富人。


    所以，无论是从绝对福利的增加来看，还是从相对差距缩小来看，市场都是有利于穷人的。


    当你产生“市场扩大贫富差距”、“市场淘汰穷人”的错觉时，那需要理解长逻辑链条，理解真实世界，才能克服这个错觉。'
