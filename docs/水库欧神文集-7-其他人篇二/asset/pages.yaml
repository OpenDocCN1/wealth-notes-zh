  md: '人遗憾了。


    接下来说一说，比尔·盖茨呼吁国家对富人增税的问题。


    # 网易财经专访比尔·盖茨：我会把钱都捐出去 应向富人多征税


    网易财经 24天前 07:22


    ![](img/ef1c5244d092b8b29b53a68870574480_734_0.png)


    比尔·盖茨最近接受网易财经专访，再谈对富人增税


    美国超级富豪疾呼“向我开炮”已不鲜见，除了盖茨，还有巴菲特、扎克伯格和索罗斯，他们都支持对富人增税。他们呼吁给富人增税的同时也支持给穷人减税。穷人减税，富人加税，这是全世界的政治正确。


    在这里提前申明：我无意详细回答“富人不加税，难道穷人加税？”“穷人减税，富人不加税的话，财政从哪里出”这一类的反话。只简单说两句：对富人和穷人都减税，削减政府支出，很多财政问题会解决；减税减支带来经济发展，政府收入也不一定降低。


    限于篇幅有限，我只想回答一个更多人关心的问题：对富人加税，穷人是否能得好处。


    这也是比尔·盖茨在许许多多富豪主张增税的理由。不管是出于真诚还是表演，他们总是说：贫富差距太大，穷人生活太不容易，富人不需 要那么多钱，等等。


    理由看起来正当，结果却事与愿违。把超级富豪的钱拿走一部分，不会让穷人变得有钱——至少从长期来看是这样。想要理解这一点，就必须理解富豪的财富形式。


    一笑加一笑 (微信号：150500211) 邀您加入水库交流群。群内文章每月一更新……'
