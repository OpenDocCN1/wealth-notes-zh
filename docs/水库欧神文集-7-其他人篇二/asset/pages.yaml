- pgno: 15
  md: '规则的意义，正是通过反规则的存在，得以彰显。


    孤阴不生，独阳不长。


    # 3) 掀桌子


    反规则本身就是意义。


    跑马圈地的时代里没有豪门，我来了，我就是豪门。没有等级秩序，规则要重新建立。


    从无到有，白手起家，打地基，垒砖头，和水泥。三纲五常，仙鹤锦鸡孔雀。


    ![](img/ef1c5244d092b8b29b53a68870574480_15_0.png)


    官分九品。为什么各有官袍不同：一品仙鹤，二品锦鸡，三品孔雀，四品云雁，五品白鹇，六品鹭鸶，七品鸂鶒，八品黄鹂，九品鹌鹑。


    衣服上绣什么花花草草，本身并没有价值。但是封建王朝乱穿衣服可是要抓到杀头的。


    因为一品仙鹤，二品锦鸡，这其实是身份地位的象征。意味着等级。是全社会识别“高低尊贵”的标准。


    在《资治通鉴》的序言中，他是这样说的。


    司马光开篇第一句话：{2}


    “昔仲叔于奚有功于卫，辞邑而请繁缨，孔子以为不如多与之邑。惟名与器，不可以假人”


    意思就是说，当年于奚为卫国立了大功。卫王想要赏赐他。


    于奚说，“我不要赏赐。但请国王允许我使用贵族用的一种马铃”。


    司马光说，“哪怕王赏赐他再多的田地，可就是不能赏马铃使用资格”。


    惟名与器，不可以假人。


    为了这件事情，所以微臣才要写《资治通鉴》这本书呀。'
