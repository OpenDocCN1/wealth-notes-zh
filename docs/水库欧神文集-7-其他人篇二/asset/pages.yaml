- pgno: 949
  md: '在参加肋排节的时候，各种意外更是不断。

    由于生意火爆，产品库存不够，然后有人扛不住压力，要退出。

    然后中间还看着火了，要灭火。

    最后，还下起了暴雨。


    在别的摊位都已经关闭的情况下，葛伦和他的团队依然坚持，直到主办方说肋排节关闭。


    ![](img/ef1c5244d092b8b29b53a68870574480_949_0.png)


    意外和风险并不是坏事，你有的意外和风险，别人也有。

    所以意外和风险是帮你打垮竞争对手的主要武器。


    葛伦说，他的特点就是比竞争对手能忍受更多痛苦。

    谁能忍受更多痛苦，成功将就会找上门。


    # 五、结语


    创业，就是一个基于交易的生存冒险游戏。

    这里每一个字都很重要：交易、生存、冒险、游戏。


    游戏就是 Game，这个单词的另外一个翻译叫做：博弈。


    理解了这一点，你就知道，没有任何一种方法保证你创业一定成功。

    最多是增加你存活的概率。


    （挨踢牛魔王，2020 年 5 月 13 日晚）'
