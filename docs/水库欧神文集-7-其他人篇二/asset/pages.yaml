  md: '![](img/ef1c5244d092b8b29b53a68870574480_699_0.png)


    变绿的黄土高原


    有人会说了，这些地方变绿，是政府搞“退耕还林”的结果，和市场经济有什么关系？


    黄土高原变绿，主要是市场经济的功劳。


    由于市场经济的快速发展，无数人从黄土上迁徙出去，来到城里里工作，不再土里刨食。原来烧柴的人，到城市里以后，改成烧煤气。


    如果不是人口大规模搬迁到城市，根本就无法执行“退耕还林”。


    实际上，由于人口提高，即便政府不搞“退耕还林”，大自然也会“退耕还林”。


    黄河变清的第二个原因，是大量的挖沙船，把黄河里的沙子挖走，运到城市做建筑材料。黄河沙是天然水洗沙，是最好的建筑沙。


    有些地方，居然还以环保的名义限制挖沙，使得民营企业很难拿到挖沙许可。


    ![](img/ef1c5244d092b8b29b53a68870574480_699_1.png)'
