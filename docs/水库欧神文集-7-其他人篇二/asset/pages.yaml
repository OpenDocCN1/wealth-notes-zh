  md: '# 折断白领的翅膀 #X95


    ![](img/ef1c5244d092b8b29b53a68870574480_563_0.png)


    # 折断白领的翅膀 #X95


    一）凤后八阵图


    《刑不上爱凌斯坦 #X94》当中，有一些细节还没有讲透。我们可以从基础原理出发，做一些推演。


    比如，#X94 提到，与权力核心距离的远近，体现为信息密度的高低。一件任务从上至下，变得越来越具体的过程当中，它的“信息量”其实是依次衰减的。


    每一个老板，要想掌握主动权，需要学习的一门必要的技艺，是“信息阉割”。


    这对应的，是现代企业的“事业部”制度。


    与大多数现代企业不同，当一个新人，入职到 NHK 的某个摄制组，他是没有“固定职业”的。除了当组长以外，他什么都做。从制片人，到摄影，再到导演。既没有职业，也没有职位。当然，薪资并不高，愿意入职的，很大一部分是在用爱发电。网友评价说，这种安排可以培养出最优秀的人才，这也是低薪资所对应的回报。


    这种说法对，但是还不全面。


    这个安排最大的意义，其实是：刚入职的菜鸟小朋友，在 NHK，是不需要“刮地图”的。他轻而易举地获得了对“纪录片摄制”这件事的宏观认识。


    这件事情的重要性和严肃性，要远远超过对所谓职业能力的熏陶。


    “事业部”制度，是很害人的东西。这种害人，从大学的专业分流就开始了。为什么人要有“职业道路”这件事情？'
