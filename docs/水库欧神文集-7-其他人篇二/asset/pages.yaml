  md: '企业财务部老会计，对此是有很大的腾挪空间的。


    公式就是要素的集合。每一个数据，都可以通过不同的“计算方法”，留出讨论和变更的余地。


    每一次变动，都会直接影响到最终的成本利润结果！


    偏生这一切，还可以做得有理有据。


    众所周知，某运营商 CDMA 项目巨亏。


    但是财务人员可以把 CDMA 投资的“折旧年限”，从 5 年拉长到 25 年。让每一期计提折旧数额大幅减少，财报变得好看很多。


    只需要小字注明：“根据实际使用情况测算，CDMA 投资应分 25 年摊销”。


    遇上个把技术宅一点的，还可以给你出个测算报告。


    ![](img/ef1c5244d092b8b29b53a68870574480_491_0.png)


    财报确实是客观、公允、正确，每一个数字都做平，完美无瑕。


