  md: '答案很明显。奴隶们没有调转枪口就不错了。


    作者自然也意识到他加感叹号的这些语句，并不符合历史的事实，于是又引入了另外一个变量来自圆其说，那就是科技的进步。


    他说，「如果没有铁器的出现，那么封建社会是代替不了奴隶社会；如果没有机器的出现，资本主义也是代替不了封建社会。」


    至于为什么会有铁器出现？为什么会有机器的出现？对不起，没有解释，这就跟《三体》中的三体文明高度厉害一样，是给定的，是初始值。


    对此正确的经济学解释是，铁器的出现是人们正确认识了自然科学、工程技术的结果，机器的出现首先必定是资本的积累，虽然未必是资本主义。


    资本累积的意思是，首先要有人愿意省吃俭用，把本来能消费掉的东西存起来、攒起来，然后用来改进技术，提高生产力。


    只有在资本累积到一定程度，只有在高度的自由分工和市场协作之下，才能够拉长生产链条，才能完成现代工业化之下如此复杂的制造系统。


    哪一种社会更容易出现铁器，更容易出现机器，更容易出现资本的积累和技术的进步？


    显然，是自由更多的社会，而不是强制更多的社会。


    哪一种制度更容易出现能够抵御三体人入侵的科技和文明？'
