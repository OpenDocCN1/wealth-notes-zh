- pgno: 634
  md: '这并不奇怪，今天你到网上发起一个“是否支持从南极拉冰山”的投票，多数人都投票反对。虽然这个项目一旦成功，将带来巨大福利，并且不花他们一分钱。最常见的反对理由是，南极是全人类共同财富，怎么能私自去拉冰山？将冰山拉到南极以外地区，是否破坏生态平衡？比如说，冰山一路往北运输，造成局部海水降温，尤其到达目的地后，必将影响开普顿附近海洋环境。这些有没有考虑到呢？微博上，我就看到也有这样的声音：“把南极冰川拖回自己的国家，国际社会答应吗？南极的金鹅、海豹等动物答应吗？因为，它们的生存繁衍离不开冰川和寒冷的气候。”现在中国的舆论场，经常能看到这种打着环保大旗的愚蠢之见。南极冰山是迄今为止，几乎未被人类开发的自然资源。南极冰山数以万计，每年大量冰山自然崩塌，融化在南半球海洋里。人类拖个几座冰山回去，不产生任何不良影响——除非只允许冰山自然融化，而不允许人类作任何干预。很显然，这种只顾“自然生态”，不顾千万人福祉的见识，本质上是反人类。


    ![](img/ef1c5244d092b8b29b53a68870574480_634_0.png)


    非洲、大洋洲和南美洲，都是南极冰山的潜在受益者。人类征服自然的历史上，有无数失败的先驱，斯隆也许是其中之一（但愿他能成功）。很多人对他的不屑一顾，这让我想起19世纪铺设大西洋电缆的美国企业家塞勒斯.菲尔德。在菲尔德所处的时代，铺设跨越大西洋的电缆是不可思议的，而他历尽千辛万苦，终于成功，实现人类第一次跨过大洋的通话。菲尔德铺设电缆的过程中，乃至成功后一段时间，关于菲尔德是骗子的流言始终不绝。历史最终证明了菲尔德的伟大。尼古拉斯.斯隆会是骗子吗？我觉得不是。在宏伟工程面前，斯隆不读情怀，只读赚钱，这太不像骗子了。他更像一个疯狂的冒险家。他的“南极计划”也可能失败。这无损于这项探索的价值。


    斯隆也说，二十年或三十年之后，牵引冰山将是一件普通的事情。原本会融化在海中的冰山，将用于解决非洲、澳大利亚和南美洲的缺水问题。也正因如此，我无意嘲笑阿联酋富豪阿卜杜拉.阿尔谢希。不知他到南极运冰山的方案如何，我想，该不至于像人们嘲笑的那样荒诞。花费几亿美元，进行一次有价值的科学和商业探索，我乐于见到这位富豪出手。


    相比中东其他富豪斗豪走狗炫富，向各国输出意识形态的野心，这种挑战自然边界、开拓人类前沿，才是真正的英雄主义。


    新闻源：拖运南极洲冰山解决淡水危机——《商业周刊》


