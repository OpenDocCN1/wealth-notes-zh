  md: '作为写作者，要时刻关注读者的反馈。所以我会尽量多看一些留言，看得多了，

    就发现一点有意思的问题。


    比如前天，水库推送了#F1940，讲“哈耶普应该在清北面前自卑”。


    结果评论纷纷从培养机制、学术水平、国家实力等各个方面，驳斥这个观点。


    > “整个教育体制落后很多，宁愿去发达国家读三本，也不要国内的清北”


    我等了半天，始终没有等到我想要的回复，有点失望。


    因为纠结在“哈耶普和清北孰强”这件事情上，本来就不是这篇文章，正确的打开

