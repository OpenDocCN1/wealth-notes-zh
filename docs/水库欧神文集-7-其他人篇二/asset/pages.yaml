- pgno: 602
  md: '# 缅甸的小孩子最需要的不是慈善


    芸姨周五文章勿勿删除，讨了一篇青城子，贻给广告商


    ![](img/ef1c5244d092b8b29b53a68870574480_602_0.png)


    共享单车 ofo 拖着债务，欠着押金，然而没有人怀疑它的前途：这是一家濒死的企业，只须一纸诉讼，就可以拔掉氧气，宣告死亡。最近它又上新闻了，标题是“如果有一天
    ofo 死了，请把它埋在缅甸”。


    咦，ofo 死不死，关缅甸什么事呢？看完才明白，这是一个很暖的故事。大概也是 ofo 这家企业带给世界最后的好消息。


    33 岁的缅甸企业家迈克（Mike Than Tun Win）发现，当地儿童上学很辛苦，经常要走半小时一小时的路程。迈克想：如果孩子们有自行车，十几分钟回家，不就能省下很多时间？


    于是，迈克创办了“少走一点”（Less walk）的公益组织，到中国买自行车。当时 ofo 基本瘫痪，大量自行车废弃堆积，没人搬运调配，也没有人维修。几个
    ofo 自行车坟场堆积着几千辆车，任凭锈蚀，还得交租金。盗窃愈演愈烈，一些车子被卖作废铁，每辆十几块钱。


    ![](img/ef1c5244d092b8b29b53a68870574480_602_1.png)


    迈克在中国的共享单车坟场'
  merge: -1
  img_proc: true
- pgno: 603
  md: '迈克自掏腰包，以平均每辆 100 元人民币的价格，买下几千辆自行车。由于精心挑选，大部分子都很新，有些甚至刚出厂，包装还没拆开，就卖给这位缅甸人。迈克还到新加坡，向当地已经离场的共享单车
    Obike 买车。


    迈克一共买下五千辆自行车运到缅甸，连同其他企业家的捐赠，一共"筹"到了一万辆车。换掉车座、添加后座，运到缅甸市场，一个一个小学地投放。缅甸一共有 900 万学生，1/900
    杯水车薪的捐献，丝毫无损于这项活动的伟大。


    当我还是小孩子时，有一年父亲给我买了一辆自行车。我终于拥有属于自己的车子，不用再骑父亲那辆大"凤凰"，那高兴劲头，恨不得蹬上单车跑遍全村每一条小道。大部分缅甸孩子都没有自行车，不难想象，这些缅甸孩子们收到迈克的礼物时，该有多么兴奋。


    ![](img/ef1c5244d092b8b29b53a68870574480_603_0.png)


    获得单车满怀喜悦的缅甸孩子


    孩子的幸福是最甜蜜，最让人难以忘怀。迈克不仅自己捐车，还带动其他公司捐，他给这个贫穷国家带来的欢乐和幸福，值得人们反复的赞美。


    我们的话题仅限于此吗？当然不是，讨论和思考才刚刚开始。


    我在微博上看到有人说：ofo 有那么多单车能用，中国很多地方的孩子也需要，为什么要给千里之外的缅甸呢？ofo 刷完本国韭菜，连单车都不给留下，做得实在太差劲了吧。


    这话说得没道理。ofo 是有一堆能骑的单车，可是运营基本瘫痪了，无论是卖还是捐，都需要成本，麻烦也非常大。迈克入场了，以很低的价格一次性买走几千辆，是给 ofo
    纾困帮忙。也许有公益成分吧，终归还是一场生意。迈克不愧是成功的生意人，很擅长抄底。


    还有人算账，国内一辆全新 ofo 单车的成本价，也就 200 多块钱，还包括贴二维码、喷漆、配制锁领等环节。迈克在中国买车，每辆成本 100 元，要运输和改装，送到缅甸，每一辆车的成本达到
    230 元人民币，实际上一点都不算便宜。


    缅甸不需要 ofo 这种带技术的自行车，成本会低一些；生产单车又不需要复杂的技术，迈克为什么不在缅甸设厂生产呢？当地人工成本可非常便宜啊。


    这就是典型"天真无邪的发问"。且不说设立生产线的投入有多大，成本控制有多难，单车在缅甸搭建一条自行车的生产线，单车产业链的衔接，就难于登天。车辆生产出来，有没有消化的市场呢？全部白送不现实，要卖也几乎卖不动。缅甸
    70% 以上人口分布在全国各邦农村，人均 GDP 只有 1200 美元，当地实际的自行车市场，并没有那么大。'
