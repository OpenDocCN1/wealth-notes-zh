- pgno: 789
  md: '![](img/ef1c5244d092b8b29b53a68870574480_789_0.png)


    讲这件事，是想表明，理解经济规律的关键之一，是理解给定供求下，双方由竞争形成的动态均衡。可惜很多人都理解不了这一点。


    开放的保险行业，会使得利率动态均衡在较为有利于消费者的水平。


    （插段题外话。


    假设有一个家财 100 亿的富二代的傻子，有人虚构了一个金矿卖给他，这个人说：“我就卖你 10 亿元吧。”


    但如果傻子对所有骗子是开放的，所有骗子接近傻子的交易费用很低，那么马上就会有第二个骗子去跟傻子说：“我也有一个金矿，我只卖你 9 亿元好了。”


    另一个骗子：“我的金矿只卖你 8 亿元好了。”


    ……


    最后一个骗子：“我的金矿只卖你 1000 元好了。”


    “金矿”的价格最后是 1000 元。


    反正哪怕“卖”1000 元，也是赚的。


    骗子女竞争形成的均衡下，傻子最后肯定是吃亏的，但亏得不会太大。一辈子都亏不完。


    怕就怕傻子觉得自己挺聪明，只信任某几个骗子，那他的损失就大了。可能一个月就亏完了 100 亿。


    有些人老觉得医生会利用信息不对称坑他们的钱，因此反对医疗市场化。他们没有明白，如果担心这一点，那就恰恰应该医疗市场化，让更多医生自发竞争，而不是信任牌照管制。）


    二


    回到正题。


    实行个人破产制度，表面上看，是保护了债务人。


    限制债务人消费三年、五年，这期间收入全部还贷，然后前债一笔勾销。


    “给诚实的人重来一次的机会。”


    每个人都可能负债重重，因此，你很可能觉得这个规定真的保护了你。


    但这只是事情的一个方面。


    事情还有看不见的一面。


    当你想要挽救自己的事业，打算向别人借钱时，问题来了，别人不知道你是罗永浩还是贾跃亭。


    或者你本来是打算做罗永浩的，但未来在债务重压之下，你也可能变成贾跃亭。


    你完全可以像贾跃亭那样，申请破产，被限制消费个三年、五年，你就摆脱了这笔债务。


    别人可以信任你的人格吗？


    或者，不从人性的角度说，从利害的角度说，罗永浩和贾跃亭的不同在于，罗永浩对自己的信用评价更高，他觉得继续还贷换回的信用资产，是值得那些金钱的。


    可是，每个人的利害评价也是经常变化的。


    由于这一不确定性，一些潜在的债主会退出。'
