- pgno: 656
  md: '于是，猎人、农民有了条件去做更好的衣服，去山顶采一朵花讨好女人……更多的欲望得到满足。社会分工加深，有人专门生产猎具、农具，生产结构更加迂回，分工和迂回生产又加速经济发展，人们有更多收入去满足更多欲望。


    街上的小女孩手里拿的是什么？


    手机。


    手机能拿来干什么？王者荣耀，美图秀秀，淘宝购物……


    如果种田占去你 **90%** 的精力，你会想到 **1000** 年后，会有手机的发明么？


    需求会枯竭么？


    生产力越发达，企业的销路越大。


    有人说，如果人们的欲望就是有限呢？这当然是不可能的。


    不过，为了让一些人服气，可以先假定人们在一定时间内欲望不会扩大。


    即便欲望不扩大，人们仍然会努力用更低的成本来满足欲望。


    以吃馒头为例。


    在古代，一个农民要想让一家人每人每天吃上三个馒头，他必须胼手砥足，以牺牲健康为代价，在土里刨食。他的老婆必须用石磨磨面，他的孩子必须上山砍柴，一家才能吃得上馒头。


    三个馒头就是他们收入的绝大部分，他们已经没有多少收入用于其他方面，所以他们衣衫褴楼，气色暗沉，能活 **40** 岁就算高寿。


    ![](img/ef1c5244d092b8b29b53a68870574480_656_0.png)


    而在现代社会，无数人为农民生产农机、化肥、种子等资本品。


    农民借助资本品，可以轻松地产生产量粮食，三个馒头只占他收入的极小比例。


    他不再需要牺牲太多健康。


    老婆有时间化妆，孩子有时间读书。'
