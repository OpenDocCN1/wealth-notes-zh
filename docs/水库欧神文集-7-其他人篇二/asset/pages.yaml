  md: '# 谁更能抵御三体的进攻？


    张是之


    最近公号「天涯时事」有篇文章《西方自由资本主义，已经穷途末路！》，文章逻辑错的离谱，但丝毫不影响 10w+ 的阅读量。 如此糟糕和混乱的逻辑，原本不值一驳，但有读者希望谈谈对它的看法，那就不如写一写吧。


    # 一、从三体说起


    在刘慈欣的科幻小说《三体》中，三体星就在离太阳最近的恒星系里，距离只有 4.3 光年。


    就在这颗三体星中，存在着一个外星文明种群，三体人。


    三体人拥有着全面碾压人类的先进科技，比如反物质发动机、水滴、智子等等。


    三体人的文明虽然高度发达，但面对三颗恒星环绕，带来文明随时可能被毁灭的「三体问题」始终无解，最后只能向外太空移民。


    正如此时他们和地球上的人类建立起了联系，互相发现了彼此的存在，于是决定进军地球，企图把地球变成自己的殖民地。故事就此展开。


    科幻归科幻，故事归故事，但总体上还是要在逻辑上能说得过去，不能有硬伤。


    《三体》总体上有没有硬伤暂且不论，我比较好奇的是三体人高度发达的科技和文明是怎么取得的？'
