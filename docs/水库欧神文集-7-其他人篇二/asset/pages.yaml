    这些道理对于国家也是适用的。

    扩张太慢不行，别人会吃掉你。

    扩张太快，就会自己崩溃。

    好不容易维持平衡，中间还有九九八十一难。


    中华文明，牛就牛在，崩溃了很多次，经历了无数灾难，我们还在。

