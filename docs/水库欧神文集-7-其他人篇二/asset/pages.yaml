  md: '在凌老的脑海里，大概那就是文人的终极梦想。


    他不在世俗之中，整个世俗却在帝王的指挥下，按照他的意愿而运作。


    ![](img/ef1c5244d092b8b29b53a68870574480_393_0.png)


