- pgno: 964
  md: '通用性强，框架变化的可能性就低，因为任何一点改动，可能会导致全面的崩溃。


    但是在大约 20 亿年前，真核生物出现了。

    真核生物有细胞核，与细菌和古菌的结构完全不同。

    现在的研究表明，真核生物在地球上**只出现过一次**。

    当然，也有可能出现过多次，但是只有一支存活下来了。


    现在所有的动物、植物、真菌等都起源于同一个真核生物祖先 LECA(Last Eukaryotic Common Ancestor)


    如果把细菌和古菌的结构归为一类，真核生物就是另外一类。

    但是在这两类之间，**存在巨大的真空**，没有其它任何其它生物。

    看起来像是一个进化的断层。


    亚里士多德说：自然厌恶真空。

    如果中间有个生态位，为什么没有其它生物填满呢？


    比如说细菌想不想爬到这个生态位呢？

    当然想。

    为什么细菌经过了 40 亿年，也没有进化出真核生物那套系统呢？

    因为框架上的**鸿沟**。


    # ## 二、框架的问题


    细菌长期无法突破，一定是因为某种限制。

    生物学家们从 DNA 的方向苦苦寻找，找了 20 年，一无所获。

    旁边有高人跳出来说，笨蛋，是能量！


    从能量的角度，生物学家们终于取得了巨大突破，一直到生命起源，一条大路从此敞开。

    虽然细菌的各种机制非常精巧，将能量的利用发挥到了极致，但是再往上突破，确实千难万难。


    第一个方案，变大不可行。

    细菌长得更大，一变大就会分裂。（幂次定律：表面积 2 次方，体积 3 次方）

    （有极少数细菌长得很大，但是里面大部分是空的，机制上和普通细菌没什么不同。）


    第二个方案，细菌体内携带更多基因。'
