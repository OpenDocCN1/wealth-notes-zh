- pgno: 998
  md: '你如果在一线城市，买个房子很难难，那就是消耗战。


    +   不如留下一线城市的一些昂贵资源，先主攻重庆这样的地方。


    在重庆形成局部碾压性的优势之后，再到一线城市扩大优势。


    你在一三三线城市，省域还不如重庆，那重庆你要重点考虑了。


    当你在重庆获得了足够的仓位和一定的涨幅，可以去一线城市再杀个回马枪。


    就像当年八路从青纱帐里面走出来，横扫天下如卷席。


    # 四、结语


    以弱胜强，以少胜多，其具体路径，化整体劣势为局部优势。

    难点，就是这是一个很长的链条，你要小心翼翼，每个局部都要赢。

    为什么说治大国如烹小鲜？

    一不小心，就糊了啊。


    这注定是一条艰难的路，但是你至少还有路。


    （挨踢牛魔王，2020 年 7 月 26 日晚）'
