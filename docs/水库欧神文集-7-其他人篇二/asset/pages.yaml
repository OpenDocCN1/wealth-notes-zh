  img_proc: true
- pgno: 877
  md: '# 99%的人混的远不如北大屠夫#X103


    挨踢牛魔王 水库论坛

    英雄不必问行当，卖猪亦可成状元


    # 一、流落江湖的高考状元


    前几日，有个事情又火了起来，说是当年卖猪肉的北大才子又重抄旧业，拿起了杀猪刀。现在的年轻人可能对这个事情不是很了解，这个在 2003 年，那可是轰动全国的大新闻，引发了非常热烈的讨论。


    大意是说，昔日长安县的文科高考状元，堂堂北大高材生陆步轩，混的非常惨，竟然沦落到长安街头卖猪肉。

    北大状元和卖肉郎之间的错位，确实形成了强烈的反差，难怪当时公众的反应那么大。


    那么，陆先生是怎么走到这一步的呢？


    ![](img/ef1c5244d092b8b29b53a68870574480_877_0.png)


    陆步轩 1966 年出生于西安的一个农民家庭，母亲去世的早，家中有几个孩子全靠父亲一人养活，负担很重，生活极为不易。


    陆先生当年以西安市长安县（现长安区）文科高考第一名的成绩考入北京大学中文系，可谓鲤鱼跳龙门，似乎飞黄腾达指日可待。


    要知道，当年大学生的录取率只有 3%，国家也急缺人才，那个时候能考上北大，更是人中龙凤，无论如何也不会混到街头卖猪肉的地步。


    但是，从陆先生毕业开始，命运却急转直下。'
  merge: -1
  img_proc: true
- pgno: 878
  md: '从现在看来，陆先生的命运和他的选择有很大的关系，因为他的选择就是一路向下的，最关键的一个错误，就是从西安市到西安市下属的长安县（现长安区）。


    **我们现在都知道，选择大于努力，选择错了，通过努力是很难扳回来的。**


    小地方人际关系复杂，自有自己的规则，并不是仅靠才华取胜的。


    陆先生有知识分子的高清的一面，不肯低头，求告无门，自然混的不可能太好。


    自从陆先生从选择到长安县的那一刻开始，就没有拿到编制，然后被发配到企业。


    在企业里面，干的最多，拿的最少，连分房子也没有他的份，陆先生被迫下海。


    下海之后，陆先生干过化工涂料，装潢等等，由于经验不足，都不是很有成功。


    事事都不如意，到了后来，陆先生索性自暴自弃，每天打麻将麻醉自己，也与第一任妻子离婚了。


    多年之后，陆先生自己总结到：


    千事业到大都市，在那里，大家来自五湖四海，人事关系相对简单，机会多，发展空间大；


    混生活到小地方，这儿交通方便，房价不高，生活安逸。


    陆先生后来之所以选择街头卖肉，那也是被生活逼的没有办法了。


    本来陆先生每天就是打打麻将、看电视、睡觉、抽烟喝酒，整个人的精神已经垮掉了。


    但是，再不幸的人，也有一些幸运的瞬间。


    陆先生在离婚之后，经人介绍，认识了一位淳朴的农村姑娘。


    在陆先生与这位农村姑娘结婚后，婚后温馨而甜蜜，有了一子一女，需要养家，这个时候就顾不得知识分子的一些所谓的颜面了。


    最开始卖猪肉的时候，陆先生都是躲着熟人的。


    因为在他看来，卖猪肉是下九流，作为一个北大毕业生，人生潦倒如此，实在是颜面无存，没脸见人。


    但是，躲得过初一，躲不过十五，这事最终还是让乡党们知道了，别人奔走相告：“我看见北大学生了，混的没法子，杀猪卖肉了！”


    这话传到老父亲耳中，老父亲就找到他，父子两人相对无言，说不尽的凄凉。


    再后来，就让西安电视台知道了，报道出来，起初响应并不热烈，《华商报》后发先至，这一次在当地引起了很大的反响。


    接下来，CCTV，上海电视台，《解放日报》，《外滩晚报》，《南方周末》，《南方都市报》等几十家媒体跟进采访，终于成为轰动全国的新闻。


    后来，北大请陆步轩去讲演，陆先生一开口，就已经哽咽：“我给母校抹了黑”。


    还是有一种体制内的情结啊。'
  merge: -1
  img_proc: true
- pgno: 879
  md: '![](img/ef1c5244d092b8b29b53a68870574480_879_0.png)


    # ## 二、业界奇迹


    当年关于这件事情，各种观点比较多。


    有说读书无用论的，读个北大，还不是一样到街头卖肉？


    有说文凭不代表能力的，陆先生是高分低能，活该如此的。


    有说是人才浪费的，北大才子怎么去卖猪肉？


    有说北大才子，也能做一名普通的劳动者，不要文凭崇拜。


    我们要说的是，几乎所有的观点，都是完全错误的。


    因为所有的观点，无论是善意的，还是恶意的，都基于一点，就是陆先生混的非常惨。


    ![](img/ef1c5244d092b8b29b53a68870574480_879_1.png)'
  merge: -1
  img_proc: true
- pgno: 880
  md: '从体制内的角度说，陆先生混的确实不如意。

    但是，在卖猪肉这点上，就完全不同了。


    为什么大家认为他混的非常惨，其实是一个误会。

    当年，新闻记者去采访的时候，陆先生以为对方是收税的，当记者问他生意如何时，他说生意马马虎虎，混口饭吃而已。


    实际情况是怎么样的呢？

    当消息曝光以后，陆先生的北大同窗们，想着一起搭救他，结果一问收入，他比很多同窗都强多了。

    这是谁搭救谁啊？


    这里重点要说一个人，当年在这件事情上，一开始也是看错了的。

    这个人就是现在和陆先生合作的一个北大师兄，也是卖猪肉的，名叫陈生。


    陈生的家境也不是很好，但是在南方视野开阔，是主动拥抱市场经济的。

    陈生从北大毕业后，分配到广州市委办公厅做秘书，收入也不高。

    当时市场经济的地位尚不太明确，陈生因为写了一篇支持市场经济的文章，受到了批评，这个时候他就酝酿下海了。


    陈生就先摆地摊，每月能赚 30 多块，而当时他每月的工资才 80 多块。


    陈生发现市场经济确实可行，就下海了，先是与人口合作房地产开发，赚了上亿元。

    后来，陈生做苹果醋，生意也做的不错，就是养鹅遇到禽流感，亏了，就转行卖猪肉，生意做的很大。


    ![](img/ef1c5244d092b8b29b53a68870574480_880_0.png)


    陈生在知道这个新闻的时候，是**非常非常瞧不起陆步轩的**。


