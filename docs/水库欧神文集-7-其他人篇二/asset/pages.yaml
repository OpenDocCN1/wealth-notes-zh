    # 三）部编本教材


    县城小孩子，不仅仅是不用功。而且是一代比一代的不用功。但就算他们用功，他们的步伐，也要逐渐被这个时代抛弃了。


    目前的消息，历史教材逐渐更换为部编本。内容有较大改动。


    平心而论，目前的历史教育，动辄简答题，“简评西方近现代民主与中国古代民本思想的差别”然后答案是，“中国古代民本思想植根于小农经济，被专制主义中央集权制度所限制，是否重视民众，只取决于君主的个人好恶。西方近现代民本有制度保障，更为真实。”


    这种历史题，潜台词就是西式治渡更优，再推进一步，就是体质的变更。但是 由于众所周知的原因，我们现在就可以下结论，这种期待是永远不可能达成的。因此，这样的教材内容，也一定会走到尽头。


    春江水暖鸭先知，如果是政治嗅觉相对敏锐的老师，就立刻会知道未来的答题方向要如何改动。但是县城的师资，你能指望什么。脱离各大题方向的指导，学生只好死记硬背答案。从思想'
