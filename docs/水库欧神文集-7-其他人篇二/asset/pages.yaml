  md: '走了哪条关系，具体经过多少人手。


    御膳房不会告诉皇帝，野菜从郊外到餐桌，是快马加鞭精挑细选成本高昂，还是草草在路边挖两根回去交差。


    因为这是要价的根本。


    所有油水、空间、坑骗，都从中而生。


    所有便利、利益、效率，也从中而来。


    ![](img/ef1c5244d092b8b29b53a68870574480_466_0.png)


    世间事分两种：看起来很*，和做起来有多难。


    看起来很*的事，有的做起来很简单。


    想求多少资源，就是老板一点头的事儿。


    可是看起来很*的事情，也许做起来很*。


    虽然老板一点头，只需要几条肌肉牵引。可如果没有一个合理的理由，也许老板的脖子永远坚硬，永远不肯点头。


    说这些是什么意思呢，“被委托者”，一定会在“看起来很*”和“做起来很*”之间，两头取高，套取利差。


    如办证送签，走通关系，这种做法来便当但影响很大的事情，就会“按难度、按效果收费”。


    办理者会不厌其烦地强调，“我们帮你做的事情，非常重要”。


    过程的难度，则被极尽夸大：'
