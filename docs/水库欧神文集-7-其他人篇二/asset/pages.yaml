    # 房产无尽阵 #X105


    # 一、不同的游戏


    这个世界上，只有足够低幼的东西才能流行。


    十年前，有个休闲游戏挺火，国内国外，小学生、中学生、小白领都在玩。这就是**植物大战僵尸 1**（下称 PVZ），单电脑版。


    这个游戏，大部分人玩的那个，叫做“冒险模式”，无脑通关，给小白玩的。但是，游戏设计者可能为了尽量拉长产品的生命周期，还设计了一个模式，就是“生存模式”。


    这个“生存模式”里面有几个“无尽模式”。

    什么是“无尽模式”呢？

    就是你可以一直玩，没有尽头。


    在“冒险模式”里面，每一关都是新的一关，你可以重新布阵，最后通关。但是“无尽模式”里面，每一关，都是继承了前关卡的基础。这里的“怪”，就是僵尸，在50-100关左右，会变得非常非常强。这个就是官方劝退，意思就是咱们这是个休闲游戏，不要那么执着嘛。


    “无尽模式”怎么通关呢？

    当时，有些小朋友说，“无尽模式”根本不可能破20关，谁要是过了20关，我现场直播切


