- pgno: 813
  md: '![](img/ef1c5244d092b8b29b53a68870574480_813_0.png)


    # 一


    在知乎上，有一个帖子，叫“双非是原罪吗？”。


    提问者说：


    > “我是双非，我就是看到知乎上好多人嘲笑双非。似乎双非是原罪。高中没学好一辈子买单吗？985 大学那么好为什么有的里面的同学说起话来还那么偏执？上大学又是为了什么？”


    什么是“双非”？请注意，是“非”，不是“飞”。


    就是非 985、非 211 的大学。


    据 说 在 知 乎 上，大 学 毕 业 的 鄙视 高 中 毕 业 的，而 985、211 则 鄙 视 “双 非”。


    就连“双非”自己，很多人也自觉不如 985、211。


    如果仔细分析，985、211 毕业生们在什么领域最有优势？


    在科研领域，应该是 有优势。


    但在企业领域其实没什么优势。因为，没有任何学校能教企业家精神。


    985、211 毕业生们另外一个非常具有优势的领域，就是公务员。


    除了基层，官员队伍中，985、211 们从比例到地位，都远远好过“双非”。


    古代有些时候，会形成“非翰林不得当宰相”的惯例。


    据 说 宋 太 祖 赵 匡 胤 有 一 次 定 年 号，宰 相 赵 普 建 议 的 一 个 年 号，前 蜀 用 过，赵匡 胤 大 怒，用 毛 笔 在 赵 普
    额头上涂鸦，并说“宰相还是要用读书人”。赵普“半部论语治天下”，在高端读书人眼里，不算读书人。


    清代，文人非进士也当不了大臣。


    左宗棠举人出身，也能做到大学士、军机大臣、封疆大臣，算是异数。


    所以今天 985、211 们在公务员领域占优，有其规律。


    这种优势，进一步造成了很多人对 985、211 们的仰视。


