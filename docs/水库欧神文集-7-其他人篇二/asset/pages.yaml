- pgno: 891
  md: '后来，最神秘的大宗师在东大山之仗揭晓的时候，龙空评论区一片惊叹，但是回过头来看原文，处处都是伏笔。


    最神秘的大宗师原来就是庆国的皇帝，庆帝。


    主角练啊，练啊，还搞到真气爆体，损伤了经脉，始终就是一个很一般的九品高手。


    这个事情就奇怪了。


    主角手上有秘籍，还有人练成过，主角的天赋还不错，也非常勤奋，怎么就练不成呢？


    在四顾剑临死之前，主角见到了四顾剑，主角就请教了这个问题。


    四顾剑想了想，笑了，说这就不是正常的路子。


    主角要练成，就是要让真气震碎所有的经脉，才能突破极限。


    那么问题来了，经脉都碎了，那人不就死了吗？


    就是有一定的概率，人在经脉碎了情况下，不死。


    这个就要看运气了。


    如果运气好，万一不死，还要忍受无边的痛苦，具体的症状就是全身僵硬，不能动，不能说话，什么都看不见，陷入无边的黑夜，体内就像有无数小刀切割着五脏六腑。


    这需要非常坚强的意志挺过关口，否则即使活下来，也会成为废人。


    庆帝就是在年轻的时候，在一场大战中，突然就真气爆体，被敌军围困。


    要不是几个亲信将他抢回来，早挂了。


    主角想了想，这 TMD 就不是人练的东西，于是放弃了。


    毕竟，主角的名字叫范闲，是想做个富贵闲人，这种事情他要是做了，主角的性格就变了，


    这小说就没法写下去了。


    # 三、1 万小时刻意练习


    很多年前，有一本书叫《异类》的比较大爆，其实书中很多理论是当时学界研究的最新成果，不过这本书将这些成果写成了大家爱看的畅销书形式。


    其中就有一个 1 万小时刻意练习的理论。


    这个理论是说，如果你是 要在一个领域成为专家的话，需要 1 万小时的刻意练习。


    比如小提琴，你练 1 万个小时，就能成为专家。


    就算是打牌这种需要靠手气的娱乐，你勤加练习，后面虽然不能保证把把都赢，但是只要次数足够多，你还是可以成为一个普通人中的高手。


    那么问题来了，这个理论出现后，这个世界的大师级小提琴专家多了吗？'
  merge: -1
  img_proc: true
- pgno: 892
  md: '没有啊。


    还真有人按照这个理论去练习，最后，进步是进步了，也没有成为大师。


    其实，1 万小时的刻意练习，只能让你成为一个六品、七品高手，就是专业级选手，到达八品境界就已经是极限了。


    世界上，所有有迹可循的东西，都只能让你达到八品境界。


    任何一个你可以选择的领域，白手起家大概能达到净资产 A8. 3 左右，达不到这个，就说明你要么是路子没走对，要么你不够勤奋，要么你本身有问题。


    如果要达到九品境界，那除了勤奋之外，还是需要天赋的。


    那么，要成为大宗师，那最重要的就是运气。不要误会，不是那种去买彩票的运气，而是基于九品境界之上的运气。


    因为到达了九品之上，就没有路了，你的天赋也用完了，这个时候就需要一些运气，开创这世间没有的东西，成为大宗师。


    所以，为什么说九品高手和大宗师的境界是无限远？因为有些机会和运气是不可逆的。


    一旦错过，就再也不会出现，而大宗师已经将这些机会和运气转化为了实力。


    # 四、突破关口


    说到网文，长久以来，我就有个疑问。就是著名作家孔二狗有一本《赌球记》，这里里面值得我们关注的不是赌球的部分，而是关于房产的部分。


    孔二狗和 yevon_ou，两个人很早就是认识的。


    这个疑问就是，在那么早的年代，孔二狗就已经接触到房产相关的东西，他也没有靠房产发财，另外他写出来的，简直就没有一点对的地方。


    这就非常奇怪了。


    比如说，孔二狗就找人学习学习这些手法，如法炮制，当年也不会那么落魄，最起码，你写文章的时候，能把手法写对了啊。


    但是现实情况就是这样诡异。'
