- pgno: 14
  md: '规规矩矩唱歌跳舞投票下一位，为梦想而战，看三个人是极限，第四个人肯定腻了。春晚都不会连排四个歌舞节目。


    才艺表演不过是一种调剂，选手之间各种状况外的随机化学反应，才是重头戏语言类节目。


    那杨超越就是创造 101 的赵本山。


    看点其实是一种冲突。


    首先存在一个规则，其次有一个意外的状况，二者之间的冲突，造成戏剧性的张力。


    丹布朗的《天使与魔鬼》里，罗伯特兰登和女科学家维多利亚，需要在 24 小时内，在梵蒂冈找到一枚反物质捕集器。


    因为 24 小时之后，电量耗尽，里面的反物质，就会接触到物质。


    物质与反物质一旦相遇，就会发生‘湮灭’，以 e=mc2 的公式，释放出极大能量，让整个梵蒂冈原地爆炸。'
