    # 一）黄种人


    很多人可能早已习惯了“黄种人”的概念。中国人以土为厚德，土居中央为黄色，祖先是黄帝，母亲河是黄河，相比白人，东亚人皮肤也确实有点发黄。


    于是并不以为意，还觉得挺恰当。“黄种人，走在路上，天下知我不一样”


    但“黄种人”这个词，其实是欧洲人造造出来的。


    因为“黄”是相对“不黄”而言的。大家都长着黑头发黄皮肤的时候，黄皮肤不会作为一个特征被加以强调。'
