  md: '![](img/ef1c5244d092b8b29b53a68870574480_766_0.png)


    事实上毫无喜剧天分的亚瑟，执着在艺术道路上


    亚瑟常年生活压抑，事业受挫，不是资本主义在压迫，而是他的选择出了大问题。他被无谓的梦想折磨着，受尽艰辛，闷闷不乐。常年在生活失败里，越来越迷失，经常幻想自杀。


    事实上，他最好的选择是一份适合的工作，过好当下的日子，再重新寻找生活的意义。资本主义提供了选择的机会，只是亚瑟自己一条路走到黑。


    其次，亚瑟生活中不断被凌辱欺负，资本主义该背锅吗？事实上，资本主义的核心要义正是法治，法律不保护恶行。


    至少在电影中，法律对暴力犯罪的打击一视同仁，就连亚瑟在地铁遇到三个华尔街流氓，将他们杀害，也要被警察搜捕。


    警察发誓说将犯罪绳之于法，哥谭市头面人物托马斯·韦恩公开谴责罪犯，称这类人是不敢露真面目的“小丑”。在哥谭市主流社会，不存在有法不依、黑白颠倒的情形。


    亚瑟生活中遭遇的不幸，仅仅是底层人们艰难生活的一部分，和“社会不公”没什么关系。资本主义无法消灭犯罪，不代表它鼓励犯罪。


    将生活不幸和社会不公挂钩，进而找出大开杀戒的理由，是一种反社会人格。我们经常能看到某个举着屠刀杀向幼儿园的家伙，他们也举相同理由：我的生活都这么惨，都怪社会不公平，我死也要拉几个垫背的。


    放在平时，没人同情理解这样的浑蛋，但在电影中，很多人居然理解小丑，这显然是同情心泛滥。


    大概编剧也觉得，说亚瑟日常被欺辱就被变得邪恶，很难让人同情。于是亚瑟的生活不幸被加上一层更具体的原因。原来他和大资本家托马斯·韦恩有着说不清道不明的身世渊源。他被韦恩家族抛弃损害，其精神疾病也源于此。'
