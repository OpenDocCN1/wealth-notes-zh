    # 三）超新星


    但是旧期待的打破，又并不是坏事，因为期待未必就是合理的。


    昨天看了一条微博，奥卡姆剃刀吐槽说，现在烂事太多，非常影响心情，只能自我安慰，这些事情在生活里不会发生。


    @奥卡姆剃刀:微博上天天都有流氓、人渣、暴徒、老混蛋、泼妇、强奸犯的消息，看得非常来气，恨不得弄死他们，很影响心情。


