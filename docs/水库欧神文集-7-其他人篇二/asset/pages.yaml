  md: '李湘直播卖貂一件也没卖出去，开始卖时销量是26，直到结束了还是26件，商家估计要哭晕了，据说李湘五分钟报价80w。李湘还卖了黄瑜瑜dai言的奶粉，也只卖出了77罐。


