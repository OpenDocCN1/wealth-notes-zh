- pgno: 632
  md: '开普敦，他原本是海事专家，在美国一家名为 Resolve Marine（海事救援）的公司担任主管。这家公司总部位于佛罗里达，在全球范围内提供海事服务，业务包括海上巨轮的抢险救援、深海沉船的打捞拖运，海上油井的清污作业。除此之外，这家公司还提供北极破冰和拖拽冰山的服务。要知道，近几年欧美国家不断在发展规模巨大的破冰船，以期开辟出一条北极航线。北极航线少不得需要这样的海事公司。在这样的公司工作，斯隆自然就认识了一大批海洋学和冰川专家。过往的职业生涯，斯隆在全球各地冒险，如今他想利用专业能力为家乡效力。用斯隆接受媒体采访的说法说吧，“我的妻子以前早晚都要洗一次澡，她告诉我，最好做点什么来改变现状。”斯隆‘改变现状’的做法非常疯狂：到南极拖回一座冰山，为开普敦供水。如果这座冰山足够大，甚至可以供应三分之一的城市用水。斯隆将自己的计划命名为“南冰计划”（Southern
    Ice Project）。相比从南极拖运冰川到阿联酋，将冰山拖运到南非，听起来要靠谱一些。毕竟只按最短距离算，前者距离超过 8000 公里，而后者只有两千多公里。但是，距离之外的难度，其实没有太大差别。很多人脱口而出的问题，也是我一开始的疑问。在斯隆这里，这些细节都有答案，我们一个个来谈。第一个问题，冰山从哪里来？听起来外行，其实这个问题不简单。南极大陆周围有数以万计的冰山，据科学家估计，总量有
    22 万之多。这些冰山规模差异很大，有直径一两百米的小冰山，也有直径数公里、数十公里的大冰山。


    人类观测到的最大冰山，是 2000 年从罗斯冰架崩落的 B-15 冰山，面积超过 1 万平方公里，相当于天津那么大。这个庞然大物脱离南极大陆后，漫无目的漂流将近
    20 年，直到去年，还有“地球最大的冰山即将消失”的新闻。可想而知，冰山规模之大，寿命之长，超出很多人想象。冰山数量如此之多，规模差异如此之大，要拖运什么冰山呢？太大了拉不动，太小了不经济。综合各方面考虑，斯隆认为，长度一两公里、宽度
    500 多米，深度两三百米的冰山最合适。


    相对于南极规模巨大的冰山，这种冰山只能算小型，并且是特殊的“板型冰山”。冰山 90% 体积在水下，板型冰山能最大限度减少阻力。倘若是锥形冰山，吃水深度几公里，拉起来困难，也容易遭遇水底不测。板型冰山不易“侧翻”，这是它的一大优势。


    ![](img/ef1c5244d092b8b29b53a68870574480_632_0.png)


    结构稳定的板型冰山


    北极冰山多陡峙壮丽，南极冰山则大多扁平厚实，想找到合适的目标并不难。今天的海事技术非常发达，用卫星寻找冰山，用无人机测绘呈象，描绘冰山形状，这些都简单。斯隆前往南极考察时发现，一般每天都会发现三四座理想型冰山。选定冰山之后，如何拖运呢？通常的做法是，用特殊材料制成的绳索铺成网，像给冰山上皮带一样。“皮带”绑好后，冰山被系在相隔一两公里外的两艘巨型油轮，以每小时十公里速度航行。只要冰山漂流起来，阻力不会特别大，10
    万马力以上的大型油轮，就可以拉得动。两千公里航程，冰山要经受海浪考验，要面临解体风险，还要减少损耗。因此，“走得快一点”显得非常重要。除了绳网拉拽，可以给冰山装置浮标设施，以减少下沉阻力，或者安装动力装置，帮助冰山“开起来”。开普'
