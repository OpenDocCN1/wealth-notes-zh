  md: '所以，那些支持干预的“双非”们，遭到 985、211 们的鄙视，被 985、211 们操控，也有活该的成分。如果你是一个独立思考、尊重逻辑、尊重个人权利的人，别人又怎敢鄙视你？就算别人鄙视你，你又怎么会放在心上？


    # 四


    相信有人会说，官员有缺陷，难道企业家就没有缺陷？企业家也会操控人好不好！


    这是没有理解市场和干预的区别。


    市场，套用程序员的话来说，是消费者决定结果的“算法”。


    企业家预测消费者的需求，并组织资源来满足消费者的需求。


    如果他们预测得好，并且有能力提供性价比高的产品和服务，消费者就会用钱投票，购买他们的产品，使他们得到利润的奖励。


    而如果企业家预测失败，或者不如别的企业家那样给消费者好的享受，消费者就会果断地抛弃他们。


    一个错误的企业家，就算他在街头跪着求大家买他的产品，大家会买吗？


    任何一个企业家犯错，都是其他企业家获取利润的机会。很多时候，消费者也不知道企业家有没有犯错，甚至都不知道自己未来的需求什么、需求有多大，这些都要靠企业家来发现。


    例如，生产手机的企业家就是**通过纠正生产 BP 机的企业家的错误，来获取巨大的利润**。


    如果没有生产手机的企业家，那么，生产 **BP** 机的企业家就会一直盈利。但，在利润奖励的驱动下，BP 机企业家的错误，又怎么可能被手机企业家发现？


    在市场的动态改错下，消费者不用管企业家有什么缺陷，反正企业家不决定结果。最终的结果，是那些更能造福消费者的企业家胜出。


    而干预是相反的算法。


    干预者取代了消费者用钱投票，变成了他们自己来决定结果，这个结果注定不是消费者想要的，因为它没有动态改错的机制。官员们的无可避免的缺陷直接决定结果。


    ![](img/ef1c5244d092b8b29b53a68870574480_817_0.png)


    当年刘强东考人大，也是想当官


    太阳底下无新事。'
