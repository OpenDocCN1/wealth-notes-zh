- pgno: 332
  md: '![](img/ef1c5244d092b8b29b53a68870574480_332_0.png)


    游戏规则，自古就是如此。


    胜者的侠义，才能为世人和历史所承认。


    你说公道自在人心，那么如果有一天，圣火熄灭，再也没有人知道真相，又当如何是好呢。


    如果没有力量，就没有办法再保卫火种了。


    所以胡林翼送给晚年的曾国藩一副寿联：“以雷霆手段，显菩萨心肠”。


    拥有强大的肌肉，才能收放自如地展示出优美的姿态。有雷霆手段而不轻易动用，才能显示出菩萨的慈悲之心。


    没有力量背书的宽容，就是被美化的软弱。


    没有违背规则的能力时，遵守规则就毫无意义。


    就算把简历打穿，也不过是高级羔羊罢了。


    引而不发，手下留情，从来是最高贵的侠义。


    但是大侠背后，通常还背着一把鲜血淋淋的宝剑。


    明报之言，不是大义。


    没有核子，人民是连裤子也保不住的。


    （我是军师，大祭酒，2018 年 11 月 1 日 夜）


