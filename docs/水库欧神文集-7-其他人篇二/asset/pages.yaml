    不相信的话，还记得 “瞿欣欣” 案么？


    要不是变成新闻，大家肯定不知道这个群体的收入情况。


    著名的硅谷风险投资人 Paul Graham 博士曾经说过，互联网公司就像蚊子，唯一的竞争优势就是数量多，作为种族可以生存下来，作为个体九死一生。


    这个群体就是互联网上的蚊子。


    因为做这种小项目，最大的优势是，一旦做起来，就非常赚钱。


    但是最大问题，就是 “做不大，容易挂” 。


    做不大，主要受限于站长们的格局。


    如果市场空间不够大，没有大的增长，投资人是不感兴趣的。


    所以，这些人很难获得风险投资，也很难上市。


    不能上市，容易挂，那就买房吧，这个流派就形成了。


