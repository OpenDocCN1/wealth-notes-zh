    # 幸福的火狱 #X81


    # 一）维常之华


    最近一直在看 2008 年的大河剧《笃姬》。说来惭愧,虽然已经是很有名的作品,我却还是第一次观看这部剧。


    很久没有这样看一部剧了。历史的是与非之外,也从人与人之间的交往当中,得到很多感慨。


    笃姬从小是个令人头痛的女孩子,不喜欢女红而喜爱史书,女扮男装闯进学堂。'
