- pgno: 727
  md: '尽管我认为赵燕菁为土地财政所做的辩护是错误的，但我也不觉得土地财政就毫无可取之处。


    不管怎么说，它毕竟是增量。


    它把原来利用效率较低的土地，转到利用效率较高的用途上去。


    一家企业，买一块土地，财政部门获得收入，而企业也获得资产，双方都有财富的增加，没有一方减少财富。


    而税收，财政部门拿走 100 万，企业就减少 100 万。


    攻击土地财政的人，起码应该看到它增量的一面。哪怕是行政垄断下的增量，它也是增量。


    现在有一些学者，建议改变土地财政，希望地方财政不要再依靠卖地收入，而依靠税收。改变土地财政，当然挺好的，但我关注一点：怎么让增量涌现？


    如果像当年农村土地联产承包责任制那样，通过产权放松，让更多的土地使用权快速入市，而不再受土地财政的束缚，那当然是大好事。如果真的这样做了，中国经济可以再上一个台阶，重新恢复
    10%以上的经济增速也有可能。


    但如果没有释放土地增量的改革举措，而是仅仅用税收代替卖地收入，这会使得增量的入市进一步放缓。财富闲置，令人惋惜。


    不同的激励引向不同的行为。地方财政如果盯着存量来增加财政收入，那对于经济发展来说，并不是什么好事。


    可惜得很，大部分提出建议的学者，都没有主张加大增量入市的改革。


    他们还得觉得这是有利于老百姓的。


    增量入市放缓，真能帮助老百姓以更低的成本拥有资产吗？


    只会起到相反的效果。'
