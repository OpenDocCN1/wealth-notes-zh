  md: '“规则” 的 T-1, 是 “掌握正确权”。


    前几天有一条新闻, 麦当劳不再提供塑料吸管, 可能转为用甘蔗渣制作的可降解吸管。


    据说英国每年一次性吸管的消费量, 达到了 85 亿根, 可想而知, 对环境造成了怎样的浩劫。


