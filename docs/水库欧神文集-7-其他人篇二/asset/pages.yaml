- pgno: 12
  md: '大家看废柴，也一般都用看猴眼光，啧啧几声以获取围观优越感，至多不过一句“炒作嘛”。


    然而，“她这么废柴，怎么还有这么高的票”，这就意外了，不合常理。


    而人家要的，就是这个*活吃椰子虫*的效果。


    因为大家都觉得，高票就是观众喜欢。


    那杨超越这么废，明明应该被淘汰，怎么观众这么喜欢她，这么多人为她买单。


    # 丑陋的中国人，这届观众怎么了？


    反思，互喷，爆款文，剪片段。新人看热闹，雪球变成雪崩，*整个节目热度直线上升*。


    这种讨论的力量，比单单消费她的愚蠢，力道要大太多了。四两拨千斤，高手也感兴趣。


    关键是，到现在，没有人觉得节目组是在炒作。'
