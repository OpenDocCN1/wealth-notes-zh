- pgno: 802
  md: '她们的哭词是有套路的，翻来覆去只能发出简单的音节。例如在这里，“下塘”反复出现。尽管哭词有套路，但是她们的情感是真实的。我能感受她们那混杂着怨恨、无助和和悲怆的情感。我也为她们感到悲伤。现在农村还这样哭的人少了。据说有的地方还雇人哭灵。


    ![](img/ef1c5244d092b8b29b53a68870574480_802_0.png)


    《记录任公先生的一次演讲》这篇文章，讲到梁启超反复吟咏“公无渡河，公竟渡河！堕河而死，其奈公何！”


    这四句诗，有一个故事。


    古代有个白首狂夫，一大早披发提壶要渡河，他老婆追在后面阻止，没阻止得了，白首狂夫溺亡。他老婆唱“公无渡河，公竟渡河！堕河而死，其奈公何！”也投河而死。旁边摆渡的子高看到，回家向妻子丽玉讲了这件事，丽玉甚为悲伤，于是弹拔箜篌，成曲《箜篌引》。


    我那时候的高中教材没有这篇文章，但“公无渡河”这四句，我初中时就看到了。一看到，我就明白了这首诗的意思。因为，在长夜里，我已听过很多回。


    很多年后，在天涯社区看到有人解读《箜篌引》，说这首歌体现了白首狂夫探寻彼岸的悲壮精神。


    我大吃一惊：还能这样解读？


    我对文艺青年的套路有了更深的认识。


    他们很难去体会真实世界中个体的真情实感，对什么事情都喜欢上升到人类、悲壮这样的高度。


    后来我看到一个学钢琴的晚辈的高中课本上有这四句话，我还跟他讲了这件事。我说：表现悲壮的音乐家，有无数，但表现“公无渡河”那种复杂情感的音乐家，一个都没有。当然，古代有《箜篌引》，但它的曲子不是失传了吗。谁如果能真实地表达出农妇简单言辞中的怨恨与悲怆，那他就是音乐天才。


    最近我搜网上对“公无渡河”的解读。知乎上，不少人解读成“知其不可而为之”、“明知山有虎偏向虎山行”，勇气，悲壮，等等。错得一塌糊涂。'
