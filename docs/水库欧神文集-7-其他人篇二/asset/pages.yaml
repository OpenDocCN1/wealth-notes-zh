- pgno: 679
  md: '![](img/ef1c5244d092b8b29b53a68870574480_679_0.png)


    任泽平凭借 2014 年“5000 点不是梦”的“预测”，成为年薪超过 1500 万元的分析师。他的话应该重视。不是因为他说得对，实际上，他的观点错得离谱。


    而是因为他的话有可能形成风向。


    # 二


    这几年，经济学界的势力发生了一些有意思的变化。

    张维迎、许小年、陈志武等人的话变得少了。

    代而起而崛起的，是李迅雷、刘煜辉、麦超等，当然，还有任泽平。

    岁月偷换，人事偷换，经济形势也已偷换。

    区别是，前者更注重思想、洞察，后者则更注重宏观分析。

    有人说是好事。因为，分析师的崛起，说明人们更务实了。对资产配置有用的东西，人们才会关注。


    真的是这样吗？


    另一个值得一说的变化是，大概五六年前，如果有哪个分析师预测对了某一次降息或降准，他一定会反复拿出来说。

    “我 3 月份指出，5 月份会降准一次，5 月份果然降准了。”

    但是现在没有人再把准确预测降息、降准拿出来说了。

    因为，大部分分析师都能预测对。'
