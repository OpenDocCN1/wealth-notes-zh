  md: '颠位于南非西南海岸，这里有常年南向北的本格拉寒流。顺着洋流开船，冰山能走得快一些。从极地往北拉冰山，气温在升高，海水在变暖，如何控制损耗率？很多人关注这问题，我看到微博上有人说：从南极出发时还是冰山，运到只剩冰棍。类似的认识，显然缺乏宏观感。冰山损耗虽有，却没很多人想的那么大。南极附近的海水温度并不高，冰山大部分体积在几十上百米深水下，低温又稳定，不容易消耗。至于海面上的冰山，能有效反射阳光，其吸收热量的能力非常弱。倘若给这种“板型冰山”制作保温层或“遮阳伞”，更能大幅减少消耗。只要确定航程日期，哪怕路上烈日暴晒，暴雨侵袭，只要冰山规模够大，最终肯定不会拉着“冰棍”上岸。冰山损耗这种事，恰恰最好测定。据斯隆估计，从南极到南非，冰山路上损耗大概8%，这显然可以接受。最大的损耗其实不在路上，而在抵达终点。一座规模巨大的冰山，远到开普敦附近海域，如何将它运上岸，为民众所用呢？这确实在是难题。斯隆的构想是，先将驳船将机械设备运上冰山，控制坑道，加速冰山融化。冰山每日产生6000万升至1.5亿升冰水混合物，由集装船箱队运送。冰水混合物解冻后，就能进入市政管道系统，向市民供水。


    当冰山消融，体积只有原来的30%，就可能会分裂。这时候，受到海水污染的冰山碎块，会被打捞上岸，作为其他用途。千里迢迢运来冰山，当然要物尽其用。


    ![](img/ef1c5244d092b8b29b53a68870574480_633_0.png)


    纯净的南极冰山水，是非常优质的饮用水。


    从南极拉冰山到南非，听起来匪夷所思，了解细节之后，你还会觉得尼古拉斯·斯隆是《西虹市首富》里的神经病吗？至少我是认真读完他的方案，思考它的可行性，罗列各种风险。外行能够想到的困难，专业人士显然早就明白。他们不只在思考，更要制定解决方案。“南极计划”听起来很像那么回事，为什么现在只是纸面计划，还未付诸实践？有以下几方面原因。这个项目成本不低，斯隆明确表示要赚钱。成本考核，盈利预期，这些都要算清楚。南非旱灾持续多长时间，这项需求是否长期，这些都存在变数。我甚至想，如果斯隆的项目不着眼于市政供水，而是建立“南极冰水工厂”，面向全球市场（也包括向南非供应），会不会有更前途？从南极拉冰山，此前早有人提出，真正的构想细节，并付诸实践，还真是史无前例。技术方案提供，细节的执行，都需要摸索。到南极开工干活，每年适航时间只有短短几个月。一次出行需两艘大型油轮，各种工程设备，这些都需要精心的准备。不过只要有块钱，市场够广阔，有的是热衷于冒险的资金来支持。最大的阻力不是技术达不到，资金等不齐，而是许多人反对。这些反对形成了政府阻力。直到今天，这项计划仍搁在开普敦市政当局那里，等待审批，主流意见是反对。'
