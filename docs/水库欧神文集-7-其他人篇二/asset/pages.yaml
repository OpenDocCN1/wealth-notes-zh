    卢旺达的生产状态还十分落后


    查看卢旺达的经济数据，果不其然，非常差。卢旺达人均 GDP 800美元左右，在低水平的非洲国家（54国）那里，排名30开外，是全世界最不发达的国家。一个享有二十多年和平，抛弃种族和政治斗争，专心经济建设的国家，为何还是如此贫穷？


    一个原因是：卢旺达经济底子实在太差。1994年该国人均GDP不到200美元，图西族人先被捕杀怠尽，商业被完全摧毁；到图西族掌权，耕作农业的胡图族人又四散逃亡。当时卢旺达有500多万人口，近100万人死亡，两百多万人逃亡，全国为之一空。局势稳定后人口回流，政府想安置却苦于没钱，于是发动通胀，再次造成经济动荡。卢旺达真正谈经济发展，是到2000年以后。


    农业发展相对容易，工业恢复却很难。内战摧毁了全国90%以上电力设施，制造和维修的人才，已经找不到了。我们习惯了没有电的生活。没有电力，就不会有机器设备，发展工业和制造业无从谈起，哪里还有什么工业。经济发展缓慢，也就可以理解。


    2010年以后，中国电力工程企业大举援助卢旺达，这个国家才逐步恢复发电和用电。战争对经济创伤之深，由此可见。今天的卢旺达只有40%的地区覆盖电力，未来7年计划达到100%用电。当然，这离不开中国企业帮助。


    # 父爱主义的时代


    卢旺达工业化和城市化发展缓慢，大概也和这个国家发展思路有关。


    和平恢复后，卢旺达总统保罗-卡加梅选择了亚洲威权主义模式，对祖国进行父爱式治理。在首都基加利，军队把守街道，警察到处巡逻，南非式抢劫在这里完全看不见。人们不准随意扔垃圾，不准随意路边摆摊，摩的司机必须穿反光马甲、戴头盔，流浪乞讨的小孩和大会被关进收容所，卫生检查不达标的饭馆会被关掉。每月最后一个周六，卢旺达全民必须参加义务劳动。'
