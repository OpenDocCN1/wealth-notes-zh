  md: '![](img/ef1c5244d092b8b29b53a68870574480_724_0.png)


    # 1981 年的深圳，此地此前闲置了多少财富


    同样一块土地，计划经济下是闲置的，现在把它从闲置状态改为由流入市场使用，增量马上就出来了。外商、财政分享增量，大家都得到好处。


    深土地的做法后来被广泛地学习。1990 年代到 2000 年初，城市土地增量入市的盛况，今天的人们很难再看到了。


    北京某大学，把闲置土地拿出来，和一个企业合作，企业负责全资建办公楼，企业免费使用 20 年后，办公楼交还学校。


    某西北城市的出版社，把一块土地拿出来，开发商全资建住宅销售，出版社员工每人可以免费分一套大三居室，社领导可以分到一套别墅。


    ......


    如果没有那些年土地增量的急速入市，很难说今天的城市建设会是什么样子。


    当闲置土地变成财富，哪怕财政部门一分钱税都不收，也是合算的。


    为什么？


    因为土地由闲置状态变成财富，企业就能发展得更好，税基更大，即便税率下降，财政部门也能获得比过去更多的收入。


    领导对增量改革的洞察是非常透彻的。


    2013 年 1 月 5 日，总理说："当下，我们要多做增量改革，使改革顺利有力地推进，才能得到更多人的支持，形成更广泛共识。"'
