    # 《庆余年》中的宗师之境


    +   - 什么是大宗师


    最近，网络小说改变的《庆余年》正在热播，剧本是著名编剧王倦写的，估计后期魔改严重。老戏骨很多，比如庆帝就是陈道明演的。


    田雨老师，就是《夏洛特烦恼》里面演王老师的那位。


    ![](img/ef1c5244d092b8b29b53a68870574480_887_1.png)'
  merge: -1
  img_proc: true
- pgno: 888
  md: '在《庆余年》里面演王启年狼项版，贪财惧内，说起谎来面不改色。


    ![](img/ef1c5244d092b8b29b53a68870574480_888_0.png)


    然后，当场被拆穿。


    ![](img/ef1c5244d092b8b29b53a68870574480_888_1.png)


    德云杜郭麒麟演主角的弟弟范思辙，一个只喜欢赚钱的搞笑角色。


    这些应该会冲淡不少原著的暗黑色彩，这也是网剧和小说这两种受众的区别。


    原著，和《夏洛特烦秀》一样，本质还是屌丝穿越爽文。


    主角穿越过去，利用对现代知识的掌握，在这个阴谋一个接着一个阴谋的世界中，见招拆招，最后PK死了大BOSS。


    但是总体的设定，还是非常巧妙的，有些连当时的读者都骗了。'
  merge: -1
  img_proc: true
- pgno: 889
  md: '主角的母亲叫叶轻眉，也是一个现代人，主角出生后，主角的母亲就神秘的死掉了，其实整部小说就是基于叶轻眉的各种遗产展开，完全可以叫做《人人都爱叶轻眉》


    如果仅仅是爽文，就不可能成为网络小说中的“名著”了。

    有些事情，连主角到了最后也做不到，比如说成为大宗师。


    啥叫大宗师？

    不仅仅是武功高，而是突破了当时人类极限的几个人。


    《庆余年》中，武道的系统是这样的设定是这样的。


    最上面，是四个大宗师，老怪物，在民众中像神仙一样的人物。


    当时分为好几个国家，比如南庆、北齐、东夷城、还有周边的胡人。

    大宗师分别是东夷城的四顾剑，北齐国师苦荷，庆国有两个，一个是叶流云，还有一位在宫中的神秘人。

    大宗师下面，是非常少的九品高手，再下面就是八品、七品等等。


    《庆余年》的九品高手，已经是非常超然的存在。

    比如四顾剑的关门弟子王十三郎，苦荷的关门弟子海棠都是天才一样的人物。


    这些九品高手和主角其实是没有生死决斗，所以从这个角度看不出九品高手的实力。

    真正和主角进行生死决斗的，是一个九品箭手，庆国的大内统领燕小乙，天下唯一的九品箭手。


    ![](img/ef1c5244d092b8b29b53a68870574480_889_0.png)'
  merge: -1
  img_proc: true
- pgno: 890
  md: '九品高手有多强呢？


    既然是穿越文，少不了拿现代的东西到古代去，比如主角的母亲给主角留了一把重狙。


    九品箭手强大到，连重狙都很难干死。


    在在大东山一役中，主角手上上有一把重狙，但是依然被这个九品箭手追得狼狈不堪，四处躲藏，连瞄准的机会也没有。


    最后，主角是自己跳出来，正面对敌，冒着自已受一箭的风险，才用重狙将对方干死。


    这就是九品高手的实力。


    九品高手和大宗师的距离是什么样的呢？


    无限远。


    可能很多人觉得很奇怪，七品练一练，不就到八品了吗？


    那就九品都这么强了，再练一练，不就是大宗师了吗？


    我们受的教育和职场，总是让我们觉得，这个世界就是一级一级的。


    大学大一升大二，阿里 P7 升 P8.\n难道世界不应该是这样的吗？


    怎么会无限远？\n就是无限远。


    # 二、宗师之境


    在《庆余年》小说中，叶轻眉没有从神庙来到这个世界上之前，没有大宗师。\n叶轻眉将神庙的秘籍，其实就是几个方向的研究成果带到这个世界后，就出现了大宗师。


    粗看之下，好像大宗师的出现和叶轻眉带出来的神庙的秘籍有关。


    但是小说里面，大宗师顾颉说，他能成为大宗师和剑决无关，不是靠这些东西，是靠自己悟出来的。


    这个事情我们看看主角的经历就知道了。\n叶轻眉给自己的儿子留下了上下两本无名功诀。\n还有人告诉他，这个霸道真气，以前有一个人练成过。


    以前是谁练成了呢？\n就是皇宫里面的神秘人。


    四顾剑几次入宫行刺庆国的皇帝，都铩羽而归，皇宫里面的真气太强。


    当年连载的时候，作者连很多读者都骗了，都以为第四个大宗师是宫里的洪公公。'
