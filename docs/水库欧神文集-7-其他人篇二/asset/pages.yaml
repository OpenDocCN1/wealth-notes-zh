- pgno: 562
  md: '大夫之间的问题，是要开一个小会议，坐下来慢慢消化的。


    > “爱泼斯坦的萝莉小岛，最近风声有点紧，爱泼斯坦你最好检查一下，原有的媒体线是否失灵。跟大选方案要打好配合，不要出乱子。”


    > “目前的消息，有人可能要对策斯坦动手。需要沟通下法庭，看能否让罪名不成立。”


    上了“大夫”这一层级的人，会将国家机器看成工具来**摆弄**。


    而不是“爱泼斯坦毫不知情，突然被抓进监狱”。


    如果是因权力结构件失灵，导致他没能及时得到信息，说明权力斗争的优劣势，已经发生了变化。


    如果权力结构件没失灵，那么他就是一枚弃子。


    无论如何，当被国家机器捅了一刀那一瞬间，爱泼斯坦就已被踢出“大夫”的行列。


    得罪人，就只好得罪到底。一个掌握核心机密的“前大夫”，也多少知道是哪条线出了问题。如果不了结干净，鬼知道放出来之后会遭遇多少。


    尼古拉斯·塔塔吉利昂（Nicholas Tartaglione），这么意大利风格的名字，幕后黑手找人也不用点心。塔塔吉利昂不就是《教父》里纽约黑手党几大家族之一的姓氏吗！


    # 六）尾声


    静水流深。


    权力的运作，是一条巨大的游鱼。

    它在湖水深处，任意游动，但不会轻易露出踪迹。


    只有死鱼，才会白肚皮朝天，漂浮在水面之上。

    权力曝光之日，就是结构失灵之时。


    但大鱼要想游动，终究需要搅动湖水。

    看客唯一能做的，就是在水面之上，寻找大鱼搅起的水流涟漪。


    幸运的是，权力的涟漪，有时甚至是如此清晰。


    （司空军师祭酒桃，2019年8月21日）'
