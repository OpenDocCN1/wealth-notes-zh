  md: '![](img/ef1c5244d092b8b29b53a68870574480_330_0.png)


    是是非非，众说纷纭。咖啡不谈，闲话却还是可以讲几句的。

    有人觉得，金庸有御强扶弱，行侠仗义之风，在鸡蛋和高墙之中永远选择前者；但就连叙说此事的傅国涌也承认，“为了炒作报纸，提高发行量，向其他报纸有意寻衅打笔仗的行为并不鲜见。”

