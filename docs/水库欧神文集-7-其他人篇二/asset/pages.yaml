    川普甚至称美联储是美国经济的最大敌人


    美联储用货币调控经济的理论，整个就是错的。就像许小年说的，“宏观经济金融学就是伪科学”。


    利率由人们的“不耐”决定。


    什么是“不耐”呢？


    就是对于一个东西，你总是倾向于今天就享受它。


