  md: '# 寿司封神，日本封衰 #X89


    桃军师


    ![](img/ef1c5244d092b8b29b53a68870574480_522_0.png)


    哥哥最近写文少，因为我在钻研易筋经铁砂掌。


    当我看到，“武林弟子应该先学三年马步，挑二年水”忍不住哈哈大笑。芥末蘸在手 上。


    这段子，怎么这么眼熟呢………


    # 1）寿司之神


    这几年在国内，“寿司之神”这股风刮得颇猛。


    我第一次听说这片子，是很久之前，朋友约我出去吃火锅。


    他夹一块脑花报入口中，又喝一口西瓜汁，然后眯起眼睛感慨，这就是二郎所说的“旨味”。


    后来看了纪录片，所谓“职人精神”，整部片子对寿司这事，充斥着一股近于执拗的气息。


    卖鲔鱼的老板，每天去筑地市场看货，放话说：“只有一条鱼是最好吃的。”


    卖米的老板，挽着二郎的手说：“有的米是只有二郎可以煮。二郎说卖掉，我才可以卖给 别人。”


    卖虾的老板，一天只有三斤虾可以卖给二郎。'
