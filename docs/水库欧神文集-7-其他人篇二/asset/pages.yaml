  md: '![](img/ef1c5244d092b8b29b53a68870574480_566_0.png)


    # 二）职场博主


    微博上“职场博主”品类的画风，通常是：


    ——寡归号，我今年 XX 岁，家里三套房，父母 XX 单位小职员，211 某某冷门专业毕业。大学期间曾在 XX 实习，第一份工作去了 XX 公司，担任 XX
    职位，薪资若干。期间辞职考研，未果。考研失败后又去了 XX 公司。目前很迷茫，不知道如何是好。您看我怎样才能逆袭？

    ——针对你的情况，我的看法是......


    又或者：

    对于非 TOP5 毕业的普通人来说，理工科专业的金矿，存在于专业对口的商业类公司的销售型岗位中。千万别去当技术员。

    文科生只能进入没有专业门槛的、消费普通商品的网络营销岗位。

    财务金融法务类专业，找对口工作也行。其他专业不要找，对口工作只能保证你温饱，无法飞黄腾达。


    我在今年之前，是几乎从来不看这个品类的内容的。

    “世界上最好的开发商”，我很长一段时间里，有意让自己的大脑，对于“职场”这件事情，保持近似无知幼稚的状态。哪怕撞得头破血流，也不愿回头。

    一直到明 确了自己的现实需求，才认真关注了几个博主。


    而且，在此之前，甚至都没有意识到，自己“不关注职场博主”这件事情。


    确实，博主的技巧，是“职场老油条”总结出来的经验精华，颇有成效。

    但是，我总在想一件事情。


    # 为什么人非得去玩“职场游戏”。


