  md: '这么先进的自动售货机摆在山里，能赚到钱吗？我观察一会儿，机器成本固定，而购物者络绎不绝，看起来赚钱并不难。


    2、


    在中国旅游，经常有这样的感慨。四月份，我的妻子小婉到新疆，在边疆小城伊宁街头行走。一位维族老奶奶卖当地特产，肥硕的新疆大枣，小婉想买却没带零钱——这时，维族老奶奶怒急掏出一张硬纸片。一蓝一绿的两面二维码，早已渗透到中国各个角落，成了无声的语言。


    川西竹海这样的景区，中国大概有几个。过去景区的山顶都有小摊贩，他们高价卖水卖吃（当然，没什么错）。现在呢？居然面临电子时代的革命。背后是效率的提高。不需要人成天待在山上，重复简单的“收钱送货”的劳动。游客想买东西，自己花钱，不用看人脸色，也无须被加价，体验比以前好得多。


    自动售货机和刷脸支付普及，让许多原本没法实现的交易，成为可能。除了景区，还有许多无人的公路，偏僻的乡村。这是一个人口以亿计的巨大市场。货物像潺潺细水，渗入中国社会每个角落，让每个人出门都觉得舒适方便，生活美好。


    最近二十年，中国数字经济的发展还改变什么？最近我看到一条视频，讲中国近 20 年数字经济下的“时间减法”。


    乘坐火车，从现场排队买票到手机下单刷身份证进站，节约时间至少半小时；水、电生活缴费，过去要到营业厅排队花上大半天时间，现在只需几秒钟。最困难的公立医院，过去排队缴费打印单据的公立医院，也在普及自助。找一台机器，只需不到
    1 分钟，一切搞定……


    过去出门打车难，现在只需提前几分钟下单；快递当日到达，送餐直到家门；旅游出行，行程安排，酒店预订，手机上都能搞定。过去出门旅行，需要大量提前查询，也难免兜兜转转，现在基本都不存在。


    类似的事情在中国各文化领域，真是太多了。指数级的改善，每个人都能感受到。据说，由于数字经济普及，我们生活中有 200 件事情，如果在传统时代，好几天都做不完，现在累计只花
    10 分钟。比如停车场的交费，过去也许要等几分钟，现在无感支付只需 1 秒时间。


    3


    感受着真实生活，观察到细微变化，就能破除一些经济学家的谬见。


    2015 年中国经济增速下行压力，很多人讨论新常态。有人关注制度层面，主张减轻企业负担（靠谱）；也有说无需过分担心，中国经济规模已经很大，就像青春期的小孩子已经成年，增速自然放缓（胡说八道）。


    最让我印象深刻的是一种说法：中国经济结构和以往有很大不同，服务业比重上来了，增速放缓就是自然现象。持此观点的人，有花旗银行（中国）的首席经济学家，现在担任广发证券首席经济学家的沈明高。作为大腕机构首席，沈明高的观点流传颇广。


    沈明高说，中国经济增长动力分两类，一类是以制造业为代表的快变量，一类是以服务业为代表的慢变量。'
