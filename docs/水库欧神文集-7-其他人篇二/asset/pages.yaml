    这个理由完全不成立。


    我小时候，我的一个5岁的玩伴，在别人家的一堆柴旁，学大人烧火，结果把那堆柴烧光了。那是非常贫穷的年代。一堆柴是很大的事。


    这个伙伴被他父母狠狠打了一顿。当然，他父母还要赔别人一堆柴。


