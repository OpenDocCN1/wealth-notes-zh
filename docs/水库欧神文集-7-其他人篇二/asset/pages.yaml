  md: '中国的“县”，彼此之间很不均匀。


    在东北，西北，一个县或许就几万人口。


    但是“百强县”之首，昆山早已成为了一个城市。昆山下面任何一个镇，都堪比外省一个县。


    桃军师笔下的“县城状元”，当然不是指昆山市，江阴市，常熟市状元。


    而更接近于一个“镇”。


    《县城状元》评论发出之后，把桃军师逗哭了。


    小女孩又写了篇《蚌病成珠》^{[注]}，发泄情绪，不重要。


    她见识这个世界的时间还太短，心还太热。


    清华北大名义上，每年共招收 3800 名学生。


    但清北是“国之重器”，这 3800 个名额，并不是完全开放给平民的。


    众所周知，“国防科技大学”每年都有定向计划。“解放军”系统，向来也是清北生源大头。


    按照官方的说法，这 3800 个名额，要包括：保送，自主招生，「三位一体」综合评价，筑梦计划，贫困地区专项计划等多种渠道。


    最后留给“自主招生”，寒窗高考的呢。


    清北+博雅，2000 名左右。


    中国的县城，约 2000 个。'
