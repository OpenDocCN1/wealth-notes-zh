- pgno: 637
  md: '# “冰山狂人”尼古拉斯·斯隆


    2015年起，南非开始历时多年的旱季。水坝蓄水量不足，城市自来水厂无法正常供水。开普敦政府先是发布“节水令”，要求居民根据配额用水。然而收效甚微，于是政府从
    2018 年起发布“断水令”，全市上百万家庭水龙头被断水。人们想要用水，得手持瓶子和水桶到附近“取水点”排队取水。


    昔日美丽的开普敦，如今一片狼藉。公共绿植无人灌溉，私人泳池早已废弃，公共厕所的自动冲水装置，也被拆除。居民用水配额从一开始的每人每天 80 升，不断减少，最低降至每天
    25 升，不到两个饮水机桶装水的量。这些水要用于饮用、洗漱，甚至包括冲厕所。在开普敦，不要说淋澡泡浴缸，就连经常洗车也显得很奢侈。


    斯隆出身在开普敦，他原本是海事专家，在美国一家名为 Resolve Marine（海事救援）的公司担任主管。这家公司总部位于佛罗里达，在全球范围内提供海事服务，业务包括海上巨轮的抢险救援、深海沉船的打捞拖运，海上油井的清洁作业。


    除此之外，这家公司还提供北极破冰和拖拽冰山的服务。要知道，近几年欧美国家不断在发展规模巨大的破冰船，以期开辟出一条北极航线。北极航线少不得需要这样的海事公司。


    在这样的公司工作，斯隆很自然就认识了一大批海洋学和冰川专家。过往的职业生涯，斯隆在全球各地冒险，如今他想利用专业能力为家乡效力。用斯隆接受媒体采访的说法说吧，“我的妻子以前早晚都要洗一次澡，她告诉我，最好做点什么来改变现状。”


    斯隆“改变现状”的做法非常疯狂：到南极拖回一座冰山，为开普敦供水。如果这座冰山足够大，甚至可以供应三分之一的城市用水。斯隆将自己的计划命名为“南冰计划”（Southern
    Ice Project）。


    相比从南极拖运冰川到阿联酋，将冰川拖运到南非，听起来要靠谱一些。毕竟只按最近距离算，前者距离超过 8000 公里，而后者只有两千多公里。但是，距离之外的难度，其实没有太大差别。很多人脱口而出的问题，也是我一开始的疑问。在斯隆这里，这些细节都有答案，我们一个个来读。


    第一个问题，冰山从哪里来？听起来外行，其实这个问题不简单。


    南极大陆周围有数以万计的冰山，据科学家估计，总量有 22 万之多。这些冰山规模差异很大，有直径一两百米的小冰山，也有直径数公里、数十公里的大冰山。


    人类观测到的最大冰山，是 2000 年从罗斯冰架崩落的 B-15 冰山，面积超过 1 万平方公里，相当于天津那么大。这个庞然大物脱离南极大陆后，漫无目的地漂流将近
    20 年，直到去年，还有“地球最大的冰山即将消失”的新闻。可想而知，冰山规模之大，寿命之长，超出很多人想象。


    冰山数量如此之多，规模差异如此之大，要拖运什么冰山呢？太大了拉不动，太小了不经济。综合各方面考虑，斯隆认为，长度一两公里、宽度 500 多米，深度两三百米的冰山最合适。


    相对于南极规模巨大的冰山，这种冰山只能算小型，并且是特殊的“板型冰山”。冰山 90% 体积在水下，板型冰山能最大限度减少阻力。倘若是锥形冰山，吃水深度几公里，拉起来困难，也容易遭遇水底不测。板型冰山不易“翻船”，这是它的一大优势。'
