- pgno: 912
  md: '因为“农民起义”，就是要主动出击，流动作战，在流动中补充自己。一旦固守的话，非常容易被击破。可以建立根据地的，那是凤毛麟角。大部分“农民起义”战术素养非常低，更谈不上战略了。


    清朝乾隆晚期的李文成，号称“李自成”转世，攻下滑县等三个县之后，固守。开始的时候，清军的将领很慌，得到情报说李文成固守滑县，就知道他们是乌合之众，不足为患。


    > 札亲王爱新觉罗. 昭梿说：“贼初起时，余告当事者，即忧其四处奔突，难以追逐。后闻其据城固守，已知其无能为力”。


    后来，清军果然攻破城池，李文成自焚而死，其余家人阖门自缢。


    所以说，成为“流寇”才是第一步，有些人“流寇”都做不成就挂了。李自成至少比李文成们强太多了。


    至于说，从流寇再到建立根据地固守，那就是另外一个门槛了。李自成不是不想，实在是能力达不到啊。从流寇模式到建立根据地，要求太高了，大批的人“在断裂地带”挂掉。比如张献忠，不知道他有没有后悔进入四川？


    最后，能开启王朝模式，那才算是进入“无尽模式”。王朝模式，也是一个收敛稳定的模式。比如朱元璋做到了，那实在是运气好的过头了。


    这里面的认识差异是巨大的。


    说到房产，最开始，肯定是哪里可能会涨就买哪里，这就是流寇。只有专业的人，才会最终建立无尽阵，站稳脚跟，稳步发展壮大。无尽阵就是你的一个战略基地，玩的是战略、布局。


    这其中，转变的“断裂地带”是巨大的。你今天的困难，不就是前几年的战略、布局有问题吗？这里面的道理，没人告诉你，靠自己总结，那就不知是那年那月才能想出来了。


    就算你建立了无尽阵，也要谨小慎微，如履薄冰，稍微一个差错，也是极有可能破阵。


    从无尽阵的角度思考问题，很多结论就会有所不同。'
