  md: '滴滴是害怕再出事，公司扛不住——这一点滴滴从来没有否认过。但绝非为了—己之私。女性用户乘车的安全率，肯定会提高。上次停运之后，滴滴已发展到每天有几百万辆风车订单。如此巨大的体量，虽不能消弭所有风险，也是以降低恶性案件发生的可能性。


    只要个人足够理性，心态诚实，都可以承认：滴滴出台这项考虑是有依据的。


    夜间犯罪牵比白天高，这是全世界普遍的经验。司法统计显示，一半以上的车上犯罪发生在晚上8点后的夜间—-尽管夜间乘车人次远低于白天。每天使用滴滴的人群以数千万计，滴滴无法根本消灭风险。他们能做的，就是尽量降低风险。


    **最高法统计数据显示，故意伤害罪、交通肇事罪和强奸罪在网约车司机和传统出租车司机侵害乘客的犯罪中合计占比均超70%，此外对于网约车犯罪，司机临时起意的比例是61.11%，其中一半发生在夜间时段。**


    2018年9月20日，最高法中国司法大数据研究院发布了《网约车与传统出租车服务过程中犯罪情况》专题报告，通过统计2017年刑事一审审结案件，对比了网约车与传统出租车服务过程中犯罪的整体情况、对乘客实施犯罪案件的特征。


    **司法大数据专题报告显示：从网约车与传统出租车服务过程中犯罪的整体情况而言，2017年，全国各级人民法院一审审结的被告人为网约车司机且在提供服务过程中实施犯罪的案件量不足20件，网约车司机每万人案发布率为0.048，其中，77.78%案件的侵害对象为乘客。与之对比，被告人为出租车司机实施犯罪的案件量为170余件，每万人案发布率为0.627，其中，46.26%案件的侵害对象为乘客。**


    司法大数据显示，夜间犯罪高于白天；出租车司机犯罪牵高于网约车。


    口口声声说“不让女性深夜乘车，就能让犯罪消失吗”的说法，都是不讲逻辑，没有概率意识，也没想象力的人。他们只是在宣泄仇恨，希望滴滴赶紧倒闭——没错，滴滴倒闭，就不会有人因乘车滴滴顺风车出事。至于乘客出行实际上变得更危险，他们毫不在意。


    嗓子的目标就是喊，而不是解决问题。而滴滴要存活下去，就要解决问题。


    网约车体系里，顺风车不可或缺，需求量很大，但是司机的注册门槛又比较低，背景相对复杂，风险性比较高，这是无法改变到。尤其是女性乘客乘坐顺风车，风险系数陡然增高，这是客观的事实。


    **2018年青岛空姐肖明珠，就是夜里11点多乘坐顺风车出事的。(那些叫嚣清洛女孩是白天遇害，不让女性深夜乘车，解决不了问题的论调，还是纯粹的嗓子。)**


    再出一恶性案件，滴滴完全受不了。它所能做的，只能是降低风险，并向公众表明：滴滴已做出最大程度的努力，降低女性乘车风险。'
