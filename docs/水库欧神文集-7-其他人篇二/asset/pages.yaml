    不然你怎么会排掉工作就为了陪我过重要的节日

    从来不公开任何女友却愿意向大众公开介绍我

    一个这么威风的狮子 甚至愿意让朋友觉得你怕我（你说过怕是因为在乎和爱）

    你也为我做过很多很多浪漫的事

    对我的每一件事上心 有不开心的 难过的 都第一时间和我说

    交往这么多年还是会每天都打电话 手机不离手

    为我哭 也陪我笑

    （天啊！我写好你的这段话竟然快比写你坏的还要长）


    可是 一个这么爱我的人

    又怎么会做出这些呢…

    关键是 你都是哪儿来的时间呢？！！

    我每天和你半夜三四点才讲晚安

    难道你为了约p 都不睡觉的吗？！


    # 二）完美的恋人


    “如果不是我查你手机，我都不知道你跟这么多人在一起。”


    这句话很・重・要。


    它意味着：罗小猪同学其实很好地履行了作为一个伴侣的义务。知冷知热地陪伴周小姐，凌晨四点说晚安，甚至会因为她穿白色衣服去玩泼水而非常吃醋。


    如果周小姐不查手机，说得理想主义一点，也许她一辈子都无法发现，她的“完美恋人”，原来还有过出轨劈腿的事迹。这件事情，知与不知，根本对她现实的生活毫无影响。


    所以我想了很久，想不明白。如果我的米饭里有一粒沙，而我在不知情的情况下吃了下去。我也许一辈子都不知道我吃过一粒沙。

    那么我有没有吃到过沙，对我来说很重要吗？


    直到后来，突然想起《legal high》里有个“一夫多妻案”。

    女主角是当年活泼俏丽的赤名莉香。


    这位“赤名莉香”要求同时与三位男士结婚，但日本的现行法律无法满足这一点，所以她跑去找古美门打官司。

    如果说小猪那还只是多人运动，这个估计要叫做母系民族。


