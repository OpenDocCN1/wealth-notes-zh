- pgno: 674
  md: '年纪。偏见使这一类“直男发型”成不了主流。温和没脾气，人畜无害，这是现在日本对男性主流的审美。主流年轻人都倾向于打扮得慵懒随意。


    # 日本人的审美变迁


    看了日本十几年的“杀马特”，很多中国人以为，这就是日本人的文化。事实上并非如此。日本年轻人的主流形象是这样，只有短短不到二十年。在我们父辈那里，日本男子的形象一度是：刚强、硬朗、轮廓分别，最典型的是高仓健。


    ![](img/ef1c5244d092b8b29b53a68870574480_674_0.png)


    高仓健身高 1 米 8，身材魁梧，在日本人里算很高的了。他眉宇粗犷，轮廓清晰，不苟言笑，却让人觉得踏实靠谱。电影里，高仓健给人一种信念坚毅、敢于担当、积极勤奋的形象。他们自信却不傲慢，沉默却不消极，工作上勤奋，家庭里负责。只要他们行动起来，就会带动身边人积极乐观。这就是战后主流日本男人的画像。


    高仓健长得不算英气，却是八十年代中国女性的头号日本偶像。他是理想的丈夫和父亲，是值得信任的同事与伙伴。即便他们老去，也是社会中坚力量。高仓健晚年还和张艺谋合作拍摄了一部《千里走单骑》，饰演了一位想和儿子修好的父亲。


    战后的日本社会积极昂扬，欣赏不了弱鸡“小鲜肉”。他们的理想型明星，首先要有男子气。北野武比高仓健小十几岁，他也是昭和时代的电影明星，同样留短髭发，也是硬汉形象。高仓健是传统好男人，北野武则是恣意任性。北野武大多拍犯罪片，好人和坏人都演，阴谋诡计、暴力凶狠，敢作敢当，这些都是北野武刻意展示的。'
