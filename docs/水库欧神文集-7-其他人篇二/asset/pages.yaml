- pgno: 774
  md: '![](img/ef1c5244d092b8b29b53a68870574480_774_0.png)


    即便对于那些大规模滥杀无辜的恶徒，有些白左甚至为他们开脱说，不仅仅杀人者有责任，“社会”也有责任。要不是社会对杀人者缺乏关爱，他们怎么会去杀人呢？所以不应该判他们死刑。至于关爱杀人、伤人的未成年人，更是白左做同情心秀、做反思秀的上好题材。


