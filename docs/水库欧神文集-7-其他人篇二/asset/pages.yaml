    后来搞市场经济，人人吃饱饭，经济的高速增长。

    顺应经济规律是美德。


    # 四


    垃圾分类对日本损害最大的，还不是让家庭妇女无端多付出垃圾处理成本，而是对人心的损害。


    中部大学的武田邦彦教授称：垃圾分类只是政府发起的一场全民洗脑。

    武田邦彦教授只看到日本政府对日本人垃圾处理观念的洗脑。

    其实，更可怕的，是那种非要和经济规律、市场选择作对的执拗劲，通过垃圾分类，深入到日本人的日常。

    日常生活中就习惯了干预，大大影响了日本人对经济的反思能力。

    你唱环保高调，我唱福利高调，他唱保护弱小产业高调，人与人互害，因徒困境。

    即便有少数人还能正常思考，也难改大局。


    日本 1970 年代末开始搞垃圾分类，1980 年代经历了泡沫的繁荣，然后 1989 年泡沫破灭，进入“失去的 30 年”。

    这 30 年里，日本经济近乎停滞。1998 年，日本 GDP 增速为 0.9%；2008 年为 -0.1%；2018 年为 0.7%。


    ![](img/ef1c5244d092b8b29b53a68870574480_628_0.png)'
