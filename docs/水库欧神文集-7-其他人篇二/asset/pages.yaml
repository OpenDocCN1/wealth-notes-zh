- pgno: 769
  md: '# 四、真正的英雄主义


    很多人说：无论怎样你都没法否认，很多人就会遭遇不幸，被逼得走投无路，这才走上邪恶之路。你可以不宽恕他们的罪行，但他们走上这一条道路，难道没有值得同情的地方吗？


    自由主义者主张，每个人对自己的人生负责。生活中难免坎坷艰辛，很多人饱受屈辱艰难，但他们行走正道（不管是出于怯懦还是坚守道德吧），不迁怒，不谤过，努力做一个平凡的好人。对于他们的不幸，才真正值得同情。


    至于那些不敢直面现实，将个人不幸发泄于全社会的家伙，怎么配得上温情款款的关注呢？


    真正值得敬仰的，是那些遭遇生活不幸，还能负担个人责任，坚持做正确的事情的英雄，他们让这个残酷的世界变得美好一些。超级英雄系列就为我们树立了诸多例子。比如超人、蜘蛛侠，以及小丑的对立面：蝙蝠侠。


    ![](img/ef1c5244d092b8b29b53a68870574480_769_0.png)


    蝙蝠侠是决不与邪恶妥协的象征


    蝙蝠侠很小就目前父母被抢劫杀害，他没有消沉，而是将人生事业献给打击罪犯，守护城市。哥谭市越混乱，蝙蝠侠越坚定。他对正义的坚守从不动摇，正是有他存在（包括那位可敬的警察局长戈登），大混乱时代的哥谭市才没有瓦解。


    感谢《小丑》，为我们展示出一种纯粹的邪恶是如何产生。并且，这种邪恶是可以蔓延的。在电影结尾部分，一群像亚瑟一样的小丑们，发起对城市秩序的攻击。他们戴着面具，打砸抢烧。幸好，能挽救溺于跌倒的少年蝙蝠侠布鲁斯·韦恩，正注视着这一切。'
