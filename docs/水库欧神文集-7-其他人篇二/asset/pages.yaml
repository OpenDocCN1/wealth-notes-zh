  md: '都是因为泡沫破灭造成的吗？当然不是。


    日本通往经济停滞的道路上，铺着许多砖，垃圾分类的砖。


    泡沫破灭后，日本政府搞了 30 年凯恩斯主义来拯救经济，从来没有见效，但日本政府就是可以 30 年不改初心，换哪个政客当首相都差不多。


    老年人高福利使日本陷入低生育率、老龄化的死循环，日本也改不了。


    奇怪吗？不奇怪。


