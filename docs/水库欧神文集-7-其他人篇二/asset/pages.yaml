- pgno: 740
  md: '那些认为重要的东西不应该交给市场的人，老觉得市场派太理想化、太书呆子气。但其实，他们的观点才是书生谬论。


    像孙嘉淦这类懂得真实世界的人，很容易就能明白这个道理：市场才能缓解稀缺问题，所以，越是重要的东西，越应该交给市场。


    有些人，自己想不通真实世界的经济逻辑，却还攻击市场派“为利益群体代言”。

    幸好孙嘉淦是个著名的清官，要不然，恐怕他也会被告击“为私酒贩子代言”。


