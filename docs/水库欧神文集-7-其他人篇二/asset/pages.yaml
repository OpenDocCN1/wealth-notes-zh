    # 四


    一般人总觉得货币问题非常复杂。他们以为各央行的央员，依据常人难懂模型，朝乾夕惕，精密地用货币政策呵护着经济。虽然不知道那模型是什么，但想来一定是非常非常厉害的。幸好有他们，抚平了经济波动，使得老百姓避免了挨饿受冻的厄运。要是没有他们，这世界该怎么办？怎么办，办，办……


    以前的美国总统们，华尔街的投机家们，也在暗中影响着美联储的决策，但表面上，他们一起维持着美联储不明觉历的神话。川普呵斥美联储降息，有一个功劳，就是打破了美联储的神话。


    “别装了，谁还不知道你们美联储是怎么回事？！”“我选你鲍威尔当美联储主席，是让你干什么的，你心里没数吗？”“快为我的选举服务，快跪舔我。”


    如果格林斯潘对上川普，估计格林斯潘那云里雾里手执天书调控经济的高人形象也会瞬间破功。能惊醒多少人，就不知道了。'
