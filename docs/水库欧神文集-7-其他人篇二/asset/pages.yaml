  md: '这样“现金-房产-现金-房产”，整个闭环打通，才可以做到生生不息。不然按现在的流派打法，现金骨髓抽干之后，就难以为继。


    但是如今，大多数人只完成了“抽骨髓、囤物业”的第一步，却没有完成“把 200 万物业变成 200 万现金”的第二步。


