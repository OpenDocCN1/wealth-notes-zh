  img_proc: true
- pgno: 297
  md: '![](img/ef1c5244d092b8b29b53a68870574480_297_0.png)


    所以，一种做法是承认女性的生育价值比工作更重要；另外一种是否认女性的工作价值在生育中受到了损伤。


    两种解法通往两个极端，“只婚只育”，保留生育价值，去掉工作价值，和“不婚不育”，保留工作价值，去掉生育价值。


    可是，第一种提法被万人唾骂，第二种提法却人人赞扬。


