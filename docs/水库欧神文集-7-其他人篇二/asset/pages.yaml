- pgno: 741
  md: '要知道，最可能让你丧命的，不是医生赚你的钱，而是医疗资源的稀缺。更何況，只有市场化，才能真正降低医疗的价格，让你少花钱。


    中国又不是没搞过医疗大锅饭。


    过去的“单位”里的人，看病都可以报销，结果大家去医院开了高压锅、饮料之类，反正能报。医疗服务的稀缺问题没解决，倒解决了高压锅的稀缺问题。


    比医疗更重要的是粮食。


    中国的粮食问题怎么解决的？


    不是计划解决的，而是市场解决的。要不是农村土地体制、粮食体制的改革，中国人还不知道哪天才能吃饱饭。


    历史反复证明，最重要的东西的稀缺问题，始终都是市场解决的。但却有很大一批不懂真实世界的人，始终抱着“重要的东西不能交给市场”的书生谬见。


    # 五


    美国在干预医疗市场上的做法，为全世界树立了极坏的榜样。


    例如食品药品监督管理局(FDA)，管制食品、药品、医疗器械等的销售。没得到它的许可证明，药品就不能上市销售。


    表面上看起来，FDA 放行的药品，安全性都比较高地。


    但是，人们看不见的是，FDA 为了所谓的安全性，卡住了多少救命药，害死多少病人。


    官僚的逻辑，和市场的逻辑，是完全不一样的。


    对于 FDA 的官僚来说，只要他们放行的药没出现严重的副作用、不良反应，那就是他们的功劳。否则，他们就会受到指责。因此，他们本能地就要卡住新药。别人死不死，跟他们关系不大。


    但对于患者来说，患者需要的是活久一点，为此，可以忍受新药的副作用，可以冒风险。


    但是，“不准患者冒险”成了 FDA 的权力。


    在好莱坞电影《达拉斯买家俱乐部》里，FDA 的探员，千方百计维护 FDA 的管制的权力。而主角则千方百计突破药品管制，救自己，也救他人。


    这部电影是根据真实事件改编的。'
