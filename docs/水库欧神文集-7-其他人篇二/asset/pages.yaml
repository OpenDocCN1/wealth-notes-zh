    # 三）侠义之惑


    侠义式微，邪魔滋生。我们已经喝了太多的肥皂快乐水，需要有一些金庸式的清茶。

    正是这种侠义的信念，塑造了中国人共同的品格。金庸为中国⼈创造了新的精神家园，这是他至关伟⼤的地方。


    可是侠义精神，是非常容易被人利⽤的。

    拎壶冲和岳不群的故事，我们不是没有看过。恶⼈振臂⼀呼，群雄响应，你纵然千般委屈，也是百⼝莫辩。只要我占据了正确的高地，就可以煽动⼈心，“这样的大v就⼈人喊打”。


    这种时候，讨论对错没有任何意义。江南七怪死在桃花岛时，黄蓉被骂做妖女，连郭靖都不肯信她。

    黄蓉只能⽤⾃⼰的智谋，令柯镇恶亲耳听到事情的真相。

    如果最后郭黄没有战胜杨康欧阳克，那么日后的江湖传说里，黄蓉必定永世不得超⽣。


