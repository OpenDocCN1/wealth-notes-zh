  md: '# ## 01 央视批星巴克“成本论”成笑柄


    # 星巴克咖啡在中国“高价出售”


    央视与星巴克的冲突引来了众多人的围观，央视播出调查报道，采访并对比了北京、伦敦、纽约、孟买的星巴克同款拿铁咖啡的价格，发现北京最贵，定价27元，而印度孟买最便宜，只有人民币14元多。


    行业专家对星巴克的成本给出了一份清单，一杯售价25元的中杯美式咖啡，大约需要耗费20克咖啡豆以及一次性纸杯一个，按照目前市场较高品质的熟咖啡豆价格100元/千克计算，20克咖啡豆成本2元，一次性纸杯成本大约0.6元，这样一杯星巴克美式咖啡的物料成本也就2.6元。但其售价基本是原材料成本的10倍。


    但这份清单却忽略了一点，决定一件商品价格的并不只是其成本，更不只是原材料成本，还有品牌、供求关系等多种因素。


    现磨咖啡零售是毛利率很高的生意。这是星巴克中国2019年春季开始执行的价格表。主要口味的大杯售价基本在30元以上。据测算，一杯星巴克咖啡的成本不到5元钱（20克咖啡豆成本2元、牛奶2元、纸杯0.6元）。而运营成本（房租、人工、折旧等）摊到每杯约13.8元。


    | 饮料 | | | |

    | :---: | :---: | :---: | :---: |

    | **新春特饮** | 中 | 大 | 超 |

    | 福满栗香玛奇朵(热/冰/星冰乐) | 32 | 35 | 38 |

    | 加喜批花红茶拿铁(热/冰/冰) | 31 | 34 | 37 |


    文章太长，你来我往，懒得看完。蓝杯的事情，也没有很关心。


    只是觉得，所有吵得热火朝天的财经 TMT 媒体小编，都搞错了重点。


    > 谁告诉你，人家的财报一定是“客观、公允、正确地”反映了公司的实际经营状况的？


    小编只看财报结果，不知道做财报的过程。


    他们不知道，单单成本计算，就有“分步法、分类法、分批法”。


    计提折旧，有“年限平均法、工作量法、双倍余额递减法”。


    研发费用资本化，前期会计差错更正，自然更不必说。


    “固定资产原价减去预计净残值”，计提折旧的年限、固定资产原价、净残值率，都需要予以确定。'
