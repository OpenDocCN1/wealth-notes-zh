  md: '如果你是一个员工，你是不需要操心公司每天亏了多少钱，挣了多少钱的。

    你每天的规动动作，就是早晨九点上班，晚上六点下班，中午点个外卖，记得打卡和留好各种报销费用。

    然后遇到事情，拼命在领导面前刷存在感，争取能早日升职加薪，工资卡打多二千元人民币。

    公司挣钱，最多多发三个月奖金给你，亏钱基本也不会亏到你头上，也许报销严格些。如果压工资压到两个月以上，基本这个公司也离完蛋不远了。


    ![](img/ef1c5244d092b8b29b53a68870574480_588_0.png)


    作为“员工”，你活在玻璃茧房里，你的一切境遇，被“公司”这个大玻璃罩缓冲。公司的喜怒哀乐，你是局外人。


    那么是谁来承担这一切直接的冲击，是老板。

    老板的账户时时都在变动，每一刻公司业务的盈亏，最终都是老板在承受。

    挣钱的是老板，亏钱的也是老板。

    从没有债务人会要求公司的部门经理还钱。只有老板才会被限高！


    再重复一遍，被限高的，一定是老板。


    普通员工，那是连被限高的资格也没有的！


    # 三）分定故耳


    一兔走衢，万人逐之。一人获之，贪者悉止，分定故也。


    任何白领来到公司的第一课，绝不是“学习办公技能，提高办事能力”。

    他们的第一课，永远是“职场生存”。'
