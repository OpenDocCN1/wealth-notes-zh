    # 三


    **2002** 年 5 月，国土资源部发布第 **11** 号令，明确规定，包括商业、旅游、娱乐、商品住宅用地的经营性用地必须通过招拍挂方式出让。


    **2004** 年，国土资源部颁布第 **71** 令，规定 **2004** 年 8 月 **31** 号以后，所有经营性用地出让全部实行招拍挂制度。


    这就是当年开发商所称的“**831**”大限。


    土地增量入市的速度慢下来了。

    很难说这对财政就是有利的。尽管招拍挂表面上增加了财政收入，但由于财富增量变慢，税基扩大的速度也变慢，所以也不清楚，短期来看，财政是否真的因此而增收了。

    而长期来看，则可以确定，财政并没有受益。因为税基扩大是可以滚雪球的，但土地拍卖收入是一次性的。

    但毕竟，土地拍卖收入是明面上的、看得见的庞大收入，这笔收入，渐渐被称之为“土地财政”，并受到多方批评。例如，认为土地财政抬高了房价。


