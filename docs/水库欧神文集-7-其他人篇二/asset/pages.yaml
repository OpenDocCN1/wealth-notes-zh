  md: '# 江湖卖艺三不朽 #X70


    ![](img/ef1c5244d092b8b29b53a68870574480_303_0.png)


    # 江湖卖艺三不朽 #X70


    一）云卖艺


    好像很久以前就有一种说法，网络主播做的其实是云卖艺的行当。

    但卖艺的方式，其实远远不止于此。

    连阔如写《江湖丛谈》，开篇就说：


    江湖上有卖刀剪梳篦的，卖面药膏的，虫子药牙疼药眼药的，打把势卖艺的，说评书唱声的。


    但我怎么看，这江湖过了一百年，分明还是那个老样子嘛。


    所谓卖刀剪梳篦，无非生活用品。

    如今女孩子要出去逛街吃下午茶了，也要点开几个美妆博主种草个粉底，顺便听家居生活号的话，买罐香薰蜡烛回家。


    香面药膏虫子药牙疼药，都可划入排忧解难范畴。

    特别是人的钱一多，就要投资理财，不然眼看着仓库里金币银锭蒙尘，晚上就要像牙疼刀伤般睡不着觉，觉得浪费了时间，错过了财富。

    于是股市点金，房产囤砖，各路招数令人心头发痒，总想要试一试的嘛。

    这药用到创伤伤口上，说不定就伤痛立消，平复如初了呢？'
  merge: -1
  img_proc: true
- pgno: 304
  md: '可惜卖药的，总有一个缺点，就是为了招徕生意，将小伤说成大病痛来吓唬你。

    “七七四十九天之内必将伤口溃烂而死”，

    “房子终于开始吃人了”。

    所以隔壁市场监督管理局的见你欢天喜地出门去，哭天抹泪回家来，当然要心生好奇疑窦。

    这一问不打紧，隔壁吓唬人的药摊子，肯定就保不住了。


    原因很简单，卖的是假药，说的是谎话，这都可以睁一眼闭一眼，江湖上谁还不是为了一口饭吃。

    可你吓得人家寿材板子都做好了，为了圆死前 bucket List，半夜去撬隔壁美貌王寡妇的房门，闹得城里鸡犬不宁，这就过分了吧。

    不掀你的摊子，掀谁的？


    ![](img/ef1c5244d092b8b29b53a68870574480_304_0.png)


    摊子被掀了，药甸子的本钱都赔进去，眼见得这条路是走不通的了。

    那怎么办呢，所喜是个身姿轻盈的小姑娘，还学得一身好本事。遂取了个艺名“一地金”，到天桥打把势卖艺去来。


    “各位父老乡亲们，老少爷们儿们。今日我便为大家表演一个躺赢锦鲤神功！”

    一时间叫好声如雷，掌声像洪湖水一浪高过一浪。有钱的捧个钱场，没钱的也想沾沾喜气，顿时将一地金封为新神，就地顶礼膜拜起来。'
