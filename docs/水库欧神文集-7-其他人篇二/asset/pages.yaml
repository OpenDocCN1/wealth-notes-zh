- pgno: 9
  md: '你一个废柴，就只是脸蛋好看，唱功惨烈，跳舞跟不上节拍；早起排练节目觉得困，就当着镜头的面开始哭。回应质疑的方式是，“我跟你们说我不怕，我粉丝给我投的，我就坐这。”


    估计所有人都气结：你有什么资格坐在这。


    你你你，你就这么辜负 101 个少女的演艺圈之梦，一大堆坐在那里，浪费掉一个宝贵的名额。


    女士们尤其有忿忿的理由，“她哪里好看了！”


    “像这样只靠卖蠢，没有实力，不过是男权宠物，走不远的。”


    “喜欢杨超越的一定都是宅男。呵，直男的审美。”


    这个事情，我不想这么想。我也劝大家不要这么想。'
