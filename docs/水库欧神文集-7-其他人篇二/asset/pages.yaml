    # 四


    美国经济增速的降低，明明是无数人努力的结果，但，很多人却把它当成一个自然过程。


    这是因为，他们看到美国这样曾经蓬勃生长的国家，也转入了低速增长，用“经济发达到一定程度之后，增速自然 会下降”来解释，**最不需要思考**。


    我问一个经济学教授：“你为什么相信发达到一定程度，经济增速就会自然下落？什么理由让你相信，**1980 年代后**，美国恰好到了这样的 一个时刻？你又有什么理由相信，即便美国大幅减税、大力放松管制、不搞宽松货币，它的经济增速也不会回到高位？”


    经济学教授列举了一些“研究”，说，美国经济过了 **1980 年代**真的只能进入低增速。


    那些“研究”当然是不值一看的。


    尤其令人惊讶的是，无论是美国人，还是中国的旁观者，都很快就把 **3%**以下的增速当做美国经济该有的常态。


    一些人还解释说，美国的经济增速不高，但是经济质量很高。


    日本经济增速更低，但是日本经济的质量也很高。“人家日本人就是不想拼经济，因为他们更注重幸福感。”


