  md: '牟林翰和包丽的故事，不仅不断发生在男男女女之间，也经常发生在大众和干预者之间。干预下，消费者就是包丽。实际上，甚至可以说，多数情况下，是大众主动求操控，才会有干预的出现。


    只不过，包丽在过程中很痛苦，她是明知不妥而无法摆脱，而很多人却是衷心支持干预。


    而在市场中，多数情况下，消费者都不认识产品背后的企业家，更谈不上被操控思维、情感。少数情况下消费者被操控，也会有其他企业家来帮助消费者，以获得利润奖励。


    总之，在市场中，消费者很难做包丽。

    所以，具有独立精神的人，一定要支持市场。


