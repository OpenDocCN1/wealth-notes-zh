    想想，如果你面对范冰冰，你的“不耐”会有多高？


    如果你放到明天再享受，那一定是能获得某种补偿，你才愿意这样干。


    这种补偿就是利息。


    **越富裕，人的“不耐”越降低。市场化程度越高，“不耐”越降低。**因为市场化能给人带来确定性更高的回报，使得人们愿意把享受延迟。


    任何人借用未来的资源，都是因为有人忍受“不耐”，把储蓄的资源借给他用。


