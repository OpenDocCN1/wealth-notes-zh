  md: '更进一步，门格尔强调说，人类对因果关系认识的进步，才是分工产生的 T-1 层原因。


    分工是结果，文明进步是这个结果的结果。原因的原因是，我们对事物之间的因果关系有了正确的认识。


    分工促进生产力，这是一个经验事实，真正的原因不是分工，而是正确的分工。


