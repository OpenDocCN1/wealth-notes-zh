  md: '于是我也明白，为什么人们总是喜欢吃出轨瓜。


    婚姻契约本身的约束力，并不够强，装在婚姻这个筐里的东西，又太多。两个人的吃喝拉撒，金银珠宝，生老病死，柴米油盐，含饴弄孙，全都被囊括进这一方天地之中。


    时间久了，如骨中之骨，肉中之肉，想要撕分，是很难的事情。

    “打断骨头连着筋”，财产的分割，子女的抚养，夫妻新仇旧恨昔日情。

    你看“庆余年”的伤筋动骨就知道。


    ![](img/ef1c5244d092b8b29b53a68870574480_599_0.png)


    周小姐也很喜欢罗小猪，不然不会去翻他的手机。但总归她并不是离不开罗小猪，所以这一仗，她撕得很漂亮也很爽气。


    但大多数人，不是这样的。经济压力，舆论压力，子女抚养，老人赡养，令他们无法支付离婚再娶的高昂对价。

    社会风雨飘摇，不抱团而独活太难。

    所以“出轨偷腥”和“怒撕小三”，都是双方在不想失去婚姻关系的情况下，做出的利益最大化选择。

    既然自己做不到理想中潇洒，只好吃吃别人的瓜，最起码还能脑海里幻想痛殴那口子一顿，


