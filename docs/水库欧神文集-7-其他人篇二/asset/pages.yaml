- pgno: 597
  md: '![](img/ef1c5244d092b8b29b53a68870574480_597_0.png)


    “防微杜渐”，你无法给人性上保险闸。更重要的是，有否出轨记录，某种程度上也是一种“个人征信”。


    出轨与否，是你的个人选择，道德问题，难以评价。但是否知道“有过出轨记录”，这件事很重要。这涉及到我对你整个人的认知、判断，直接决定了我未来应当如何对待你。


    出轨是可以的，“隐瞒出轨”却会造成极大的信息缺失。我以极高的信用评级对你，但你却暗地里搞次贷组包含。如果一旦东窗事发，则我的损失，是无法弥补的。


    从这个角度上讲，“翻查手机”约等于“调查征信记录”。


    # 四）违约问题


    还有一个更重要的问题，是赤名莉香同学启示我的。


    古美门法庭问讯：“你会出轨吗？”赤名莉香愤慨地答：“我怎么会做出轨这样见不得人的事情！”


    一位同时嫁作三人妇的女士又义正辞严地表达自己的贞操观，喜剧效果是很强烈的。但是你细细想，这句话其实没毛病：


    # 出轨，和多偶，它是两回事情


    轨者常规也，出轨就是你的行为举止脱出了日常的轨道规则。这个日常规则，是由一夫一妻制固定的，而你在与对方结成为夫妇，领取婚姻的一纸契约时，你们双方对“一夫一妻”这个契约条款，都是认可的。所以“出轨”，本质上是一种违约行为。


