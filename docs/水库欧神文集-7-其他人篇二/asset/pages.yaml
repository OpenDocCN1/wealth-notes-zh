- pgno: 752
  md: '当然，即便当时没有哈耶克、弗里德曼、科斯等人影响中国人的市场经济观念，中国的改革也不是说就不能成功。


    因为，当时的改革策略非常的号。上面鼓励各地方、各部门、各领域大胆改革，“杀出一条血路”，不要受理论束缚。哪种做法效果好，就推广哪种做法。


    这其实是一种非常符合经济学道理的极高改革智慧。


    是一种让人们用脚投票的“算法”。


    推行市场最力的地区，珠三角、长三角，吸引了无数人口，崛起许多超级大城。


    其他地方自然知道它们哪些做对了，只能被动跟着学习那些对的做法，以留住财源。


    # 改革的关键，并不是说地方的官员就有多高明，而是让官员、百姓都在“算法”中动态地修正自己的行为。


    所以，即便没有哈耶克、弗里德曼、科斯等人的理论，中国的改革也会做得很好。中国也有优秀的经济学家，如张维迎、许小年、陈志武、周其仁等，说不定中国的学者也能发展出很厉害的市场经济学。


    但毕竟，哈耶克、弗里德曼、科斯等人的理论，加快了中国人的对市场的认识。人们对市场有信心，才能更笃定地让各地方、各部门去闯、去试。


    如果当时中国人学习西方经济学时，恰好遇上克鲁格曼


    ![](img/ef1c5244d092b8b29b53a68870574480_752_0.png)


    、斯蒂格利茨


    ![](img/ef1c5244d092b8b29b53a68870574480_752_1.png)


    之类的人流行，那么改革的难度一定会加大，中国的经济奇迹，恐怕要逊色上那么一点。'
