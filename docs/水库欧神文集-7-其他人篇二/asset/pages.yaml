  md: '# 人赚我钱，我赚我命 #W19


    原创： 邓新华 水库论坛


    ![](img/ef1c5244d092b8b29b53a68870574480_737_0.png)


    人赚我钱，我赚我命 #W19


    一


    前不久发生了一个非常无耻的事情。


    山西洪洞县一个脑梗患者，事先答应给北京医生 1 万元，北京医生去洪洞县给他开刀。结果患者这把给钱的场面拍成视频举报，医生受到处分。


    这个事情大家都知道，所以细节我就不多说了。


    除了少数脑残，大部分人都痛骂患者和家属丧尽天良。


    救你一命，不知感谢；赚你的钱，成了你的仇人，天下没这种道理。


    患者的行为，显然抬高了专家“飞刀走穴”的风险，让其他患者承担更高的成本。


    然而，尽管人们痛骂患者，却很少有人指出，那不准专家走穴的规定本身就是不合理的。


    七八年前，我作为媒体人参加央视的《对手》节目旁听，几个参加辩论的医疗行业的管理专家，抨击“北京的医生为了赚外快，周末坐几个小时车，去郑州、太原、保定等地方走穴开刀”。我是真的听不下去了。轮到旁听者发言的时候，我要过话筒，说，医生走穴是好事。你想想，医生去外地，一次可以做好几个人的手术，患者才花多少钱？'
  merge: -1
  img_proc: true
- pgno: 738
  md: '如果医生不去，这几个患者就得来北京排十天、一个多月的队，还要住招待所，家人还得陪着来，那要花多少钱？是一个人过去好，还是一群人过来好？


    这道理不是很简单吗？不准走穴的规定根本就是错的。


    可能我这番话在那个场合太惊世骇俗了，现场的观众对我侧目而视。


    专家无法从逻辑上反驳我，只能说些什么“有规定就得遵守”之类的无聊话语。后来我也没管这期节目有没有放我的话上去。我喜欢反驳专家的蠢话，现场过一下瘾就算了。没想到这么多年过去了，很多人还是关注个人道德，而不考虑那个规定是否合理。陈兴杰写了一篇文章为医生走穴说话，居然有人说：“违法的行为，被你颠倒了黑白。”


    现在这方面也在改革，医生“多点执业”在推进之中。我对“多点执业”没有详细的了解。方向上说，我希望医生执业越自由越好。


    当然，更大的问题是，医疗是否应该交给市场？经常看到有人跟帖：“你们太理想化了、太书呆子了！市场并不能解决一切问题。医疗太重要了，怎么能交给市场？”“如果连医疗这么重要的事情都交给市场，医院还不是想收多少钱就收多少，那老百姓还有活路吗？”


    # 二


    乾隆元年，内阁学士兼礼部侍郎方苞奏称，北五省（直隶、河南、陕西、山西、甘肃）每年因造烧酒而耗费大量粮食，老百姓喝醉了还打架，因此，应该禁止北五省造烧酒。这个方苞，就是二月河在《康熙大帝》、《雍正皇帝》中塑造的那位既懂权术又懂治国的“布衣宰相”。《狱中杂记》的作者。


    乾隆皇帝也没多想。直观上看，酿酒要用粮食，禁止酿酒不就节省了粮食吗？反正，烧酒并不是刚需，对吧？禁！


    其实方苞并不懂治国。


    有一个人提出了不同意见，他就是孙嘉淦。孙嘉淦认为，烧酒是市场需要，禁止就会使供给减少，供给减少价格就高，就会导致人们冒'
  merge: -1
  img_proc: true
- pgno: 739
  md: '险造私酒，执法成本将剧增；造烧酒用的是粗粮和一些杂类植物，禁止的话，可能反倒会导致人们用更多细粮去酿造黄酒，达不到节省粮食的目的……


    总之，孙嘉淦列了一堆理由。看他的奏疏，我感觉他是学了张五常经济学、奥派经济学穿越过去的。每一条理由，都非常符合经济学原理。


    乾隆三年底，孙嘉淦任直隶总督。他上奏说，前任李卫任内，接私酒案 364 起，案犯 1400 多人；他接任一个月，就又接到了 78 起，案犯 350 多人，这还没算府、厅、州、县没报上来的案件。这还是正犯的数量，受牵连的乡保邻甲、沿途店肆、负贩之属，还不知有多少。“一省如是，他省可知。”


    孙嘉淦的结论很简单：“本为民生计，而滋扰乃至此，则立法不可不慎也。”


    不是老百姓做错了，而是禁酒的圣旨错了。朝廷无事生非干预市场，才使得老百姓出现这么多“违法者”。


    孙嘉淦说：“禁酒原在灾年，现处丰年，不宜再禁。”


    意思就是说，灾年粮食严重短缺，禁酒还情有可原，现在丰年，禁什么酒呢！


    那时候乾隆皇帝还算懂点经济逻辑，他接受了孙嘉淦的意见。


    # 三


    谈医疗市场化，怎么突然岔到孙嘉淦的谏禁烧酒去了呢？


    孙嘉淦这个人，实在有点特别。


    过了几年，孙嘉淦对禁酒令的危害又有了更深刻的认识。


    他说：“臣前言酒禁宜于歉岁，不宜于丰年，犹属书生谬论。躬莅其事，乃知夺民之资财而狼藉之，毁民之肌肤而敲扑之，取民之生计而禁锢之。饥馑之馀，民无固志，失业既重，何事不为？歉岁之不可禁，乃更甚于丰稔。”


    简单翻译，就是说，以前我以为灾年禁酒是合理的，但丰年不应该禁酒。后来我深入真实世界，才发现，灾年阻止老百姓的生计为祸更大，灾年更加不可以禁酒。


    这段话，引申开来，就是：越是重要的东西，越应该交给市场。


    灾年粮食更重要，那就更应该交给市场。'
