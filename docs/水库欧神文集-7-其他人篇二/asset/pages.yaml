- pgno: 8
  md: '多年以后，杨超越又回想起那个割韭菜音被疯传的午后。


    她从没想过，自己抢在李笑来之前，做了同样的事情。


    前两天，创造 101 终于成团了。


    废柴杨超越最终排名第三，仅次于两位鹅选热门，被王思聪骂得一佛出世，二佛升天。


    ![](img/ef1c5244d092b8b29b53a68870574480_8_0.png)


    杨超越被骂的理由是，”侮辱了别人的努力，别人的汗水，别人的业务能力“。'
