  md: '企业由自己控制，盈亏自负，企业主可以采用任何适当的形式，进行管理。


    其次，员工有选择不选择 996 的自由，可以选择跳槽离开。

    如果因为找不到更好的下家而赖着不走，那要另当别论。


    而况，还有另一部分可以适应 996 的“奋斗逼”。如果强制取消 996，反而损害这部分人的权益。


    人家家里八口人等米下锅，人家每天工作如鱼得水涨经验，满满意乐成就感。

    你凭什么不让人家加班！


    列位看官读到这，估计都哼了一声：

    “桃李师无耻，话说道轻巧。整个行业都烂了，有什么可选？”


    ![](img/ef1c5244d092b8b29b53a68870574480_447_0.png)


    这时候就是有意思的部分：


    倘若市场未失灵，你何不成⽴一个 “955 互联⽹企业”，填补市场空缺。

    保证应者如云。所有不愿 996 的优秀⼈才，都将⼊你彀中。


    这就是市场自发的调节机制。

    你⽤不着赶尽杀绝 996，只要 955 有更⼤的利⾔，那么这块价值洼地，⼀定会被迅速填补。

    这样的企业，本⾜也是现实存在的，但被选择性地排除了。程序员⽌不挹行业现状讲得烂⼀点，如何蒙蔽嗑爪子的看客。


    还有⼀个更⼤的⾔题是，程序员付⼭的劳动，是否真的与⽬们的新薪⽬配。

    所谓“高⽉薪”，倘若建⽴在 996 基础上，那么拆解为⽉薪，恐怕就没那么乐观。

    换句话⽤，程序猿的⼯资，也许没看起来那么⾼，只是⼯作时长堆出来的。'
