- pgno: 858
  md: '歌曲之所以火，是 因为反应了很多年轻人的心声啊。


    年轻人，年复一年，就是想多赚点钱。


    大城市机会多， 大家都往大城市跑， 牺牲很多，连家乡话都快不记得了。


    这 歌里都唱了， 00 后的同学，你不会说方言 啊 。


    那么 出路在哪里？


    # 二） 出路


    其实这个问题，现在是个普遍情况。


    以前 也有不少朋友问 过， 总结下来， 大概是 这样的：


    我人穷脸丑，农村户口，现在考学到大城市奋斗，您觉得还有救吗？


    我在某城市打工，交完房租，就能吃泡面了，您觉得还有救吗？


    我是码农小贝，我女朋友被宋思明抢走了，您觉得我这种情况还有救吗？


    这是当我是情感博主，“妇科医生”了。


    不过， 答案是：有救。


    水库，还有一条极为隐蔽的相关科技树，就是草根泡面流。


    这个流派， 就是 有些 年轻人 租着 房， 吃着泡面， 流着 眼泪，长期默默无闻。


    突然 有一天， 就成功起飞了， 这就是所谓的“草根泡面流”了。


    一些草根和社会边缘人，靠这条科技树，居然获得了很大的成功。


    对于一个没有背景的普通人来说，有两项资产是 有机会 获得的。


    一个是房产， 这个大家都比较清楚了。


    还有一个就是网络资产，这个很多人就 很 不了解了。


    不要一说到网络资产，就 想到 那些 低级吹粉套路，那都不是玄门正宗。


    这也 是一条很大的科技树，涉及到奥派、MKT、广告学、用户需求、运营、流量逻辑等 等 ，'
