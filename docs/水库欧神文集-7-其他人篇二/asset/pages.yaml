    # 三）神棍的陷阱


    “界限感不明确”，便给解读留下了巨大的空间。 因为人很难感知到味觉的细微变化，所以旁观者的解读和暗示，便会在辨认味道的过程中， 发挥巨大的作用。


    刘闯喝了第一口，本来没觉得汤怎么样。结果傅师傅突然说“没有尾香”，这时候，刘闯才 惊觉，自己的汤，好像是少了点回味。


    雪花和牛 A 级 B 级，烧熟了吃起来本来没什么区别。但是“行家”跑过来说，“A 级脂肪分 布更均匀细腻”。于是你才会去细细分口感的区别。


    这时候，你就彻底落入了“美食神棍的陷阱”。


    在界限不敏感的事物里，解读者是可以立法的。 傅师傅说没有尾香，是这汤没余韵。


    > 但我也可以解释说，“汤有尾香，会影响下面菜品的口感。所以刻意把余香做淡。”


    朱自治喜欢头汤面口感清爽。 但我也可以解释说，“每天的最后一碗面，积聚了整天的精华。吃起来口感馥郁纯正，这就是尾汤面独特的风味。”'
