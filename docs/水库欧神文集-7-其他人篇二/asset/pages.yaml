  img_proc: true
- pgno: 994
  md: '![](img/ef1c5244d092b8b29b53a68870574480_994_0.png)


    这就是钳形战术。


    汉尼拔以 4 万劣势兵力，一举歼灭罗马 9 万主力。罗马执政官保罗斯和 80 多名罗马元老院成员阵亡，6-7 万罗马士兵被杀被俘。罗马几乎家家都有人死在当时或者后续的战役中，罗马震动，国本动摇。


    光是当时罗马上等人的金戒子，汉尼拔就收集了 200 多个。当汉尼拔将这些东西倾倒在迦太基元老院门前时，震惊了整个迦太基。


    所以，后面把那种完美的战役称为“坎尼再现”。


    再说时机。一战的时候，德军参谋部制定的施里芬计划，就深受坎尼会战的影响。结果德国人就掉沟里了。


    其实问题很简单，德国东线会与俄国开战，西线会 with 法国开战。如果法国和俄国同时开到德国边界，德国必败无疑。


    那么怎么打？'
