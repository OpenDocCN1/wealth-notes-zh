  md: '这个问题书中没有做具体的交代，只是说三体人的文明经历了近百两次的毁灭与新生，经过漫长的选择进化，三体人弃除了自己的懦弱情绪，变得冷静理智，社会的组织形态也变成了一个高度集权的专制社会。


