  md: '看着老罗从成立锤子科技，发布smartisan OS开始，一路走来，如此坎坷却从未放弃，哪怕硬件产能遇到严重问题三个月才收到T1，哪怕不得已做了圆形home键起死回生，哪怕为了维持锤子生存发布会上带了几个其它产品，哪怕最后被迫卖掉smartisan，卖掉坚果，卖掉锤子科技股权，老罗都没有申请破产，就是为了了一笔一笔还清债务，从去年到今年十个月还了三个亿，对比贾跃亭，老罗难道不值得被尊敬吗？如今因部分企业走了法律程序导致老罗上了老赖名单，老罗依然心态平和，十二月还有发布会，所做的一切都是为了还债，最后哪怕锤子科技没有了，坚果手机回不到它手里，我相信依然会有另一个品牌，搭载着smartisan卷土重来，大概是因为老罗说过，大不了再做款叫“卷土”的手机吧！@罗永浩
