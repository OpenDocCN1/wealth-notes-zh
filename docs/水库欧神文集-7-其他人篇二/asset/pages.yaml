  md: '暂时放下自由的问题不谈，我比较好奇，在他笔下的那些打起仗来不要命的奴隶们，他们打赢的目的是什么呢？是为了让主人更好地奴役自己吗？


    同样的问题，他说在封建社会权力基本都集中在帝王和大臣手中，可以强制人民上战场，所以一定会赢。


