    被辐射的大脑 #X69


    # 一) 辐射变异


    自从有了核电站，“核泄漏”就一直被视为灾难。


    1986 年，切尔诺贝利第 4 号机组在低功率工程试验中，发生了爆炸起火事故。'
  merge: -1
  img_proc: true
- pgno: 288
  md: '大量的放射性物质被排放到环境中，约 60 万人受到较高水平辐射。由辐射导致的肿瘤死亡率增加了约 4000 例，儿童的甲状腺癌发生率也显著升高。


    除了人体健康受到损害，核泄漏当地的物种，也会在不同程度上发生变异。


    日本福岛核电站事故四个星期之后，日本一位潜水摄影家键井靖章，潜入震区海水之中，拍摄了一组照片。


    其中最令人震惊的，是一条遭到辐射的海鲶鱼。海鲶鱼的身体变异成了蓝色，眼珠发黄，虽然还是鲶鱼，外表却已经截然不同了。


    ![](img/ef1c5244d092b8b29b53a68870574480_288_0.png)


    一笑加一笑 (微信号: 150500211) 邀您加入水库交流群。群内文集每月一更新……'
