- pgno: 645
  md: '# 三


    美国作为世界上最发达的国家，理应经济增速最高。相对美国的发达程度来说，10%以上的经济增速应该是最起码的预期。


    但是现实是，美国的经济增速很低。如前所说，美国 2018 年 GDP 增长为 2.9%，这还是 3 年来最高。


    作为第二号发达国家的日本，经济增速更低。日本 2018 年 GDP 增速只有 0.7%。


    无论美国，还是日本、欧洲，能把经济增速降到现在这个程度，不容易。


    # 它是无数人长期努力的结果。


    凯恩斯主义者努力刺激经济，福利主义者努力征税搞福利，环保主义者努力限制发展，大政府主义者努力压制州权……


    美国的国债已经突破 22.4 万亿美元，可见政府开支之庞大。


    索罗斯等 18 名超级富豪，还在《纽约时报》刊登致 2020 年总统候选人的联名公开信，呼吁民主共和两党的总统候选人支持对美国最富有的 1/1000 群体征收财富税。


    巴菲特更是多次呼吁给富人加税。


    民主党议员亚历山大·奥卡西奥-科特兹打着“绿色新政”的旗子，称希望美国在十年内停止排放温室气体。


    反垄断法、反就业歧视法、最低工资法、大学照顾少数族裔……


    最后的结果大家都看到了。


    远的不说，近的，1950 年代，美国 GDP 增速高位数是 8.7%。


    1960 年代，美国 GDP 增速高位数是 6.6%。


    1970 年，凯恩斯主义搞出滞胀，美国 GDP 增速高位数是 5.8%。


    1980 年代，里根革命，美国 GDP 增速高位数是 7.3%。


    而进入 1990 年代，美国 GDP 增速高位数是 4.7%。


    并且此后再也没有超过这个数。


    自 2008 年后，美国 GDP 增速再也没有达到过 3%。'
