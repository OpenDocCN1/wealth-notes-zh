  md: '《侵权责任法》的立法参与者梁慧星在总结工作时，自己说，“本法有些地方有极大的创造，本法对适应中国社会的国情来说，对适应现代社会的发展来说，都是有创造性的。”梁慧星还特别强调，“第
    87 条是中国侵权法对传统侵权法极大的创造性发展”。由此可见，这条法律属于中国特色。


    传统侵权法规定“过错”和“无过错”两种侵权责任，前者比如故意或过失伤人，要承担责任；所谓无过错，比如你饲养的动物突然发狂咬人，你当然没错，但这动物终归是你饲养，所以要承担责任。谈侵权责任，基本就这两类。“87
    条”创造出一种责任：无事家中坐，锅从天上来，你要为别人不负责任的行为买单。原因仅仅是，你和他个混蛋住在同一栋大楼里。这就是梁慧星所说的“创造性发展”。


    2011 年，一位成都小伙陈涛骑电瓶车从一栋商厦楼下经过，被一个从楼上扔下的马克杯砸中头部。虽然捡回一条命，他后来却患上创伤性癫痫等严重的后遗症。


    陈涛欠下十几万医疗费，采用“高空坠物连坐”起诉整栋商厦的业主。最终法院认定，其中 124 家商户无法证明自己无责，被判共同赔偿 152520 元，每户赔偿
    1230 元。


    这个案件中，受害人索赔不多，只有医药费 15 万元，并且承担者多数是商户。每户一千多元，给了就当算作捐款，不算很大的负担。但是，由法院判决支付，对 123
    家而言，确是实实实在在掏冤枉钱。


    # 二


    倘若在别的案件中，受害人索赔百万，承担者只有十几家或几家，每个家庭承担十几万甚至十几万，这种赔偿方式还能让人心平气吗？


    立法者显然没有考虑这样的问题。有一回，侵权法专家张新宝教授批评梁慧星，说这样的立法是“闭门家中坐，祸从天上来！”，用立法制造冤枉，很不公道。


    梁慧星回应：“我们的学者在从事法学研究的时候，在为国家的立法出谋划策的时候，一定不要考虑到个人的利益，你要考虑到社会正义。你说一个人在外面走，上面掉个烟灰缸把他砸死了，他的子女怎么办？他的父母怎么办？他作为家庭的主要劳动力被砸死了，情况多么悲惨，你为什么不考虑？你分担一下损失，这有什么问题？”


    显然，梁慧星所说的“社会正义”和“个人正义”（他的说法是个人利益）毫无关系。他只想劝你善良：人家都这么惨，你掏点钱算什么？不知梁慧星教授遇到乞丐打劫时，会是怎样的反应呢？也许吧，他会拱手把钱奉上，并一洒同情的眼泪。


    这一则法律要求大家不要就“个人利益”（个体正义）斤斤计较，实际上，法律并没有完全偏离正义的精神。“连坐”不是随便拉人，而是尽量寻找“可能的加害者”。隐含的意思还是“过错者承担”——只是过错者实在太难找，于是圈定一批人，不让他逃掉。


    # 三


    由此可见，所谓的“社会正义论”非常虚弱，底子还是要“个体正义”补强。'
