  md: '矿税入库的情形确实是有的，但明显话只说了一半。有学者考据，在派遣矿监税使的二十年里，矿税银其实并不全部解进内库，而是皇帝与宦官分成，比例甚至达到了 4:6，而且拿四成的是皇帝。


