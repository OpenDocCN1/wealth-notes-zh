    经历炼狱的卢旺达，终于实现和平。现在这个国家怎样呢？我没到过卢旺达，先从网上旅游者的日志说说吧。卢旺达地处赤道附近，但由于地形较高，气候颇为凉爽；当地山湖兼有、干湿季分明，热带草原上野生动物奔走，非常适宜旅游。到卢旺达旅游的中国人很多，对当地的自然风光赞美有加。


    ![](img/ef1c5244d092b8b29b53a68870574480_650_0.png)


    卢旺达全国多地建有大屠杀纪念馆，游客通常都会去。当然，最重视参观大屠杀纪念馆的主要还是欧美游客。长期以来，欧美国家一直自诩担当人类的道义，而在 1994 年那场大屠杀，欧美政府其实很早就知道，却因各种原因，没有及时出面干预，最终纵容了这场规模空前的屠杀。欧美游客到此参观，大多怀有复杂的情感。悲伤、震撼、内疚，也许都有吧。


    # 优美而贫穷的国家


    卢旺达每年有上百万游客。这个国家并不大，面积相当于北京加天津，人口一千多万人。对这样一个穷国来说，上百万游客算相当多了。外国游客们会来看大屠杀纪念馆，更多还是游览优美的自然风光。很多人理想中的非洲国家，质朴静谧，远离现代化的喧嚣，卢旺达就是这样。90%人口生活在农村，最大的产业是农业，大部分地区保留着前现代化的生活方式。'
