    二）行道迟迟


    笃姬自由奔放地长大，可她的世界并不能全部属于自己。


    岛津齐彬大人欲收她为养女，代价是她要离开故乡。


    笃妫犹豫不决，从小抚养她长大，视如己出的老女菊本当即自尽，为的是用自己的生命提醒她不许回头，把这件事情敲钉转角。


