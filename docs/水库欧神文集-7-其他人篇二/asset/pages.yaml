  md: '亚当·斯密在《国富论》中，不厌其烦地论证，市场分工如何提高效率，自由贸易如何带来互惠互利。


    他以制造别针为例，没有受过训练的人，无论再怎么努力，恐怕一天也造不出一枚。哪怕是熟练工，一天的制造量也绝不可能超过二十枚。


    但如果经过简单分工，把别针的制作分为十八个不同的任务。有人抽铁丝，有人拉直，有人截截，有个削尖线的一端，有人磨另一端，以便装上圆头，等等。


    这样一来，10 个工人每天每日起针 48000 枚，也就是平均下来一人可以制造 4800 枚。


    相较于没有分工之下，一人只能产一枚，这个效率起码提高了 4800 倍。如果再考虑到机器、工艺和流程的改进，这个效率还可以更高。


    斯密的观察细致入微，也很有说服力。但我们这里吹毛求疵地杠一下的话，还是可以多问一句：奴隶制之下也有分工，极权专制之下也可以有分工啊。这么讲？


    没错，这个杠并非真的吹毛求疵。斯密在这里只是通过观察给出了分工的好处，却没有说明人们为什么会进行分工。


    所以门格尔在他那本奥地利学派的开山之作《国民经济学原理》中指出，斯密的分工理论是错误的，分工并不是文明进步的原因。'
