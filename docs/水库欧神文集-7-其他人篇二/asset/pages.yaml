  md: '“高空坠物连坐”的立法目的，确实包括邻里监督和举报。假设一人知道真凶，他又不想被“连坐”，于是积极检举。此种立法意图按说没有问题，但在实践中，中国高楼住宅普遍邻里互不相识，监督形同虚设。


    “连坐法”还带来一种危险的倾向：警察、受害人追查凶手的积极性大大降低。


    2011 年，成都陈海被高空坠物砸伤后的第二天，家属立即找到物业公司，要求赔偿。物业公司显然不愿背这个锅，有法律规定，受害人很快就确立了“告整栋楼”的思路。


    高空抛物伤人，放在任何法律严肃的国家，都算得上刑事案件。然而在这里，案件很快走上民事赔偿的道路。警方没有刑事介入，更不要说积极地侦查破案。


    不管玻璃杯还是烟灰缸，或经常发案的啤酒饮料瓶，只要以刑事重视之，送到司法鉴定中心检验，不难确定上面的指纹和残留物。绘制抛物线轨迹，很容易就能确定抛物者的极小范围。再逐一筛选侦查，找出真凶其实是很大概率的事情。


    然而在国内，高空抛物只被视为民事赔偿案件，刑事程序几乎没有。反正只要一出事，最终会有高楼好邻居们出来兜底，谁会积极认真追查呢？2016 年至 2018 年，全国法院审结的高空抛物坠物民事案件
    1200 多件，其中一半造成受害人死亡。然而受理为刑事案件的，就只有 31 件。这显然极不正常。


    受害者也经常选择不报警。将责任推给整栋大楼，也许是他的优选策略。因为一旦查出真凶，很可能要面临“对方赔不起”的窘境。而许多户人家共同承担，赔偿反而好落实。因此，国内出现类似案件，受害人都倾向于把“受害者范围”划得很宽。把高额赔偿金平均到越多人头上，每一份都不会太多，受害者的利益会更有保障。


    既然受害人有兜底条件，寻找真凶的激励其实是非常低的。“高空坠物连坐”的本意是监督和举报，但由于责任分散和破案效率低下，结果变成了纵容。缺德鬼们潜意识里认为：即便出事，也有那么多人兜底，怕什么？现行法律下，此类新闻的结局都是：一群高楼好邻居，忍气吞声凑份子，稀里糊涂赔了款。这哪有什么警示意义？


    想想看，如果这类新闻普遍是另一套结局：肇事者被查出来，逮捕进监，牢底坐穿，赔偿赔到破产。我想，唯有这样的威慑和示警，才能使那些混蛋重视高楼安全，不随意往楼下扔东西，同时约束孩子不这样做。


    # 四


    综上，我对现行《侵权责任法》第 78 条有很大的意见。这则法律看似温情，却是通过牺牲无辜住户的权益，纵容高空抛物的罪犯。不幸的受害者，摇身一边，转而伤害其他无辜者——虽然其情可悯，其状可哀，但因一人之不幸，连带更多人受屈，怎么样都说过不去。立法想追求的“社会正义”，绝不该是这样。


    《侵权责任法》第 78 条是这部法律最有争议的条款之一。施行多年，争议一直没有停止。近年来国家进行民法典立法，侵权责任编也对这一条款进行了修改。《侵权责任法》属于比较新的民事法律，当年立法就寻求完备，现在却成了修法的焦点。


    据草案三审稿，该条文增加“经调查难以确定具体侵权人”的说法。由此可见，新立法者已经意识到原来法'
