- pgno: 564
  md: '是谁规定，一个人从事一门职业，就不能再从事另一门职业？


    ![](img/ef1c5244d092b8b29b53a68870574480_564_0.png)


    如果你从事“技术性”工种，你会发现，细碎的知识点博大精深，无穷无尽。但是当一个人还是一张白纸，高考刚刚拿到成绩单时，他填报志愿书，其实可以填报一百多个专业。


    他原本是什么都可以做的，既然他可以选择这一百个专业，就说明这一百个专业，他的能力事实上都可以cover。


    然而自从上大学选专业开始，一个人的人生之路，开始不断限缩。选了专业，就只关心专业领域内的内容。毕业了，就需要寻找“专业对口”的工作。等到进入特定的事业部，更是办公桌前一坐三十年，每天只关心自己职责范围内的任务。但是，原本你的人生，是去哪个事业部都可以的。甚至你的能力，可以周转于多个事业部之间。只是如果你想把一件事情做得越专业，你所要花费的时间精力就越多，于是其他事情，就都没有力气去关心。


    “事业部”不是天然产生的，它是人为划分的结果。其用意在于，每一个事业部，都只能拿到“碎片化”的信息。销售部门接触不到库存周转，产品研发不关心企业财务状况。打电话的中介，甚至连客户的号码都拿不到。'
