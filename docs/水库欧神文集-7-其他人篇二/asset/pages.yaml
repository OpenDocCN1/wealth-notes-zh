    不但没改，还变本加厉。


    反过来，如果哪天日本居然能取消垃圾分类了，那说明日本人真的走出来了。


    不再有那种和经济规律作对的执拗劲了。


    连这都改得掉，改掉凯恩斯主义也就不在话下。


    垃圾分类，国运攸关。


    目前的日本还看不到改的苗头。估计日本还得继续失去 40 年、50 年……


