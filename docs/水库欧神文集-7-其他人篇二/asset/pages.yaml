- pgno: 1004
  md: '周杰哭笑不得，说，那个人的外号就叫“舅舅”。


    周边的人哄堂大笑，说，我们都管他叫“舅舅”。


    简单的说，水库之所以被“封神”。


    就是把这方面的理论科学化，专业化了，不再是玄学。


    这里的“神”指的是专业的意思。


    这就是我们今天讲的第一个层次：专业。


    做事一定要专业，才能得到大家的认可。


    # 三、崩溃的极限点


    你要在一个领域内有所成就，而不是仅仅想赚点钱的话，光专业是不够的。


    还需要探索到极限。


    第二个层次是：极限点上的平衡。


    有人说2000-2015年，政策很宽松，所以很好搞。


    这个说法是错误的。


    确实有些年份比较宽松，但不全是。


    这个不是我们要讨论的重点。


    重点这里面隐含的意思：


    要是我出生在那个年代，我也是可以的。


    所以现在我不行，外部环境太恶劣了。


    真的吗？


    年轻人，总是觉得生错了时代，不知即便今年，机会也不少。


    但是有些道理你要是不懂的话，抓住了机会也无法做大。


    比如，就算政策很宽松，你很专业，你就可以一战封神吗？


    不可能。


    这里有一个巨大的陷阱，他们是肯定不知道的。


    很显然，她们从来没有操作过那种很高数量级的项目。


    这个陷阱是：


    > 即使你很强，放手让你扩张，你也一定会挂掉。


    以乾隆朝的大小金川之役为例。


    如图，大小金川就在这个红圈的地方。'
