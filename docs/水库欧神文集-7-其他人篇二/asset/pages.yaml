  md: '# 有钱了该怎么花？到南极拉回一座冰山 #W03


    菁城子


    ![](img/ef1c5244d092b8b29b53a68870574480_635_0.png)


    有钱了该怎么花？到南极拉回一座冰山 #W03


    你应该听过很多中东富豪的传说吧？比如说，一位小王子有7辆凯迪拉克和3架飞机，每周零花钱600万美元。买得着的豪宅、豪车、私人飞机，这些都不是事。他们炫富常常用一般人看不着的宠物，比如猎豹、狮子和猎隼。养一只两只不稀奇，有时会带十几只上飞机。


    最近，一则中东富豪的新闻，又在社交媒体引起一片转发。世界最富的国家阿联酋有一位富豪阿卜杜拉·阿尔谢希，他计划从南极拖延冰山到阿联酋，以解决当地水资源不足的问题。


    这个大胆的想法在喜剧电影《西虹市首富》中出现过。一位满脑子创业狂想的保安提出，想从北极拉一座冰山到阿拉善。急于洒钱的主多鱼投了，还追加投资——“给冰山提提速”。'
