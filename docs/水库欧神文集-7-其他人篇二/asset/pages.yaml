  md: '二


    我认识一个人，大专毕业，学过经济学。


    他对 985、211 们从来不仰视。


    多年前，他说过一段话，我至今印象深刻。


    他说：“为什么人们会相信对市场的干预呢？那些不是 985、211 毕业的人，相信干预倒还罢了，但奇怪的是，就连那些 985、211 毕业的学生们，也相信干预。他们明明很清楚，干预者无非是他们一个宿舍的同学，一步一步干到科长、处长、局长……他们对那些同学，难道还不了解吗？他们明明知道那些官员们都是些普通人，为什么却还相信官员们比市场更聪明？”


    ![](img/ef1c5244d092b8b29b53a68870574480_814_0.png)


    为什么，名校毕业生也相信，牟林翰们能明智地干预经济？


    包丽的北大学同学们，写了一篇痛批牟林翰的文章，但你要问她们中有多少人是比较彻底的市场派，估计答案并不会乐观。


    如果你旁听北大的经济学课程，你可能会对他们的提问水平感到惊讶。


    但相对来说，北大又好过哈佛大学。


    在哈佛大学名教授桑德斯的公开课视频上，那些回答问题的学生，其思考能力，也就是高中生的水平。甚至可能还不如高中生。


    经济学家张维迎说，干预不仅仅是官员的责任，同时也是教师的责任。现在高校教的经济学，就是那样的。很多学生毕业后去到经济管理部门后，会理直气壮地干预。他们会说：“我们这样做没错啊，书上就是这么说的啊。”


    985、211 毕业的人，相信他们宿舍的同学，能够明智地干预经济，是因为他们没多思考，简单地接受'
