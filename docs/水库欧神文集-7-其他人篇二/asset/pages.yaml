    他没有意识到的是，既然有了自由，那么人们有拒绝参战的自由，自然也就有主动参战、保卫家园的可能。


    一边是强制没有财产和自由的奴隶去参战，奋力保卫主人获胜之后，换回来的是继续被奴役。


    而另一边的人有财产和自由，敌人获胜则带来的结果是财产和自由的双重损失，他要保卫的就是自己的财产和自由。


