  md: '![](img/ef1c5244d092b8b29b53a68870574480_733_0.png)


    莫迪上台以后，印度经济继续向好，这个国家新建了数千万个简易厕所。


    再举个子说。长期以来，非洲饱受疟疾之苦，盖茨基金会发动制药巨头，购买了大量药品和蚊帐在非洲分发，拯救了数百万儿童的生命。这些做法诚然伟大，但是把时间轴拉长，你就会发现，并没真正地改善什么。


    一个儿童从某种疾病摆脱存活，还面临各种疾病威胁。假使他幸运成长，没当童子兵，仍不免于饥饿和动乱。非洲人口的平均寿命是四十多岁，财富水平低下。政治经济制度不变，大量财富倾注进去，它还是人类文明的黯淡之地。


    诚然，以人类整体为视角的生命观，太过冷酷。比尔·盖茨将大量财富用于慈善，拯救苍生，帮助弱者，非常伟大。但这距离它想达成的宏伟目标，却是越来越远。盖茨基金会可不只是想帮助几百万人——它是希望帮助更多人，并且能持续下去。慈善的模式注定这一切无法实现。


    “比尔及梅琳达·盖茨基金会”成立近二十年，捐款数百亿美元，基金规模仍非常大，是因为有源源不断的资金在注入。比尔·盖茨的股票在增值，这得益于微软公司的成长；巴菲特每年对基金会的定期捐款，这些钱来自他所属公司的商业活动。


    正是商业体系持续运转，才让慷慨的慈善捐款成为可能。没有慈善捐款，商业会运转，资本还会更多，比尔·盖茨帮助到的人也更多。


    2017 年比尔·盖茨接受高晓松采访时说，自己和妻子去世 20 年后，基金会将花完所有钱。盖茨的财富会怎样散到人间呢？我不太清楚，单从财富成长的角度讲，它所起的作用大概就到此为止。真是这样，就太让'
