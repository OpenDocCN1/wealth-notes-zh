    # 四）岂敢定居


    这个世界上，每个人对快乐和痛苦的感知，并不相同。


    有的人天生快乐，布衣蔬食而能不改其志。有的人没那么快乐，但是觉得日子这样下去， 也还可以接受。


    所以这些人不需要奋斗。他们只要按部就班地生活下去，就很好。


    他们固然不会成功，但也不<font color="#c8373d">需要成功</font>。


    光荣会带来快乐，但奋斗更会带来痛苦。而对于已经很快乐的人来说，更多的快乐是边 际效益递减的，更多的痛苦却很难被接受。


    需要奋斗的人，则又各有不同。


    对一些人而言，奋斗本身就是一种快乐。


    解难题是会上瘾的事情，一旦尝过成功带来的欣悦，那么就想一直成功下去。


    上周，b 站主播全都在肝《只狼》，宫崎英高的新作秉承了一贯的恶意。'
