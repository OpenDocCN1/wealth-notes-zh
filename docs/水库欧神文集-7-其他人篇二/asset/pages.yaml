  md: '编剧很恶趣味地让这个“母系氏族”家庭，几乎规避了一切可能的质疑：


    +   从个人素质上讲，赤名莉香是机关公务猿，相貌美丽，性格温柔，贤惠得体。


    +   从情感关系上讲，三位男士都互相知道对方的存在，而且完全接受。


    +   从家庭义务上讲，赤名莉香同志的时间分配非常公平：周一周四，周二周五，周三周六，各在一个家庭承担女主人的责任，周日则经常是三个家庭一同出游。她的精力过人，不会觉得疲惫，而且也完全胜任。


    我坐在电脑前面苦苦冥想：如果一位伴侣，她能够像赤名莉香那样尽到完整的家庭责任，她是否出轨多偶，都不影响家庭的完整与幸福。就像罗小撸那样的“完美恋人”。


    那么为什么还要在意，她有没有出轨呢？


    # 三）信用问题


    等闲变却故人心，却道故人心易变。


    后来我发现，我把事情想简单了。

    模型总是闪着理想的光辉，人性却总是黯淡暧昧，又蠢蠢欲动地试探他人的底线。

    现实生活中，是不会有一个“出轨的完美恋人”的。


    食髓知味，得寸进尺。既然一次不被发现，那为何不两次。短期可以被容忍，何妨不试试长期。今天私房钱交了外室还有余力，明日便想再养个孩子。


    **欲望无限膨胀，边界不断被侵蚀。**


    人的心理，对于早有预警的困难，往往并不恐惧。

    人们害怕的是，“晴天霹雳”，风平浪静的日子里，突然一个惊雷。

    岁月静好，正满心欢喜看着葱花，突然 LG 带着三个女朋友，六个孩子，回到家来和你摊牌闹分手。'
