  md: '# 找工作时单位普遍要求 35 岁以下，那 35 岁以上的人都干嘛去了？


    别笑，我一邻居45岁，以前在电厂给董事长开车，老领导退休，新领导找借口打发了他，他在家靠老婆养着，缺钱了就去干几天代驾。平时就接送老婆孩子。


    我辞职一年了，在家种花种菜养猫狗，靠老公活着。


    钱不够花，只好想办法挣钱，公司不要我这种专业知识尚可，但心眼太多的上年纪的人，怕不好管理，我又没背景当公司的吉祥物，只能自己想办法自己干了。


    以上都是实话。


    对于无限游戏中的每一场有限游戏，我们当然是要尽可能的赢，因为这样可以获得更大的生存空间。


    事实上，在大部人的一生中，能够在有限游戏中取胜，就不错了。


    但是，如果没有赢，也没有必要纠结，而是要关注在这个有限游戏中，你是否拿到了下一场有限游戏的入场券。


    这样你才能一直玩下去。


    一些人就想的很清楚。


    360 的总裁周鸿祎，当初去北大方正上班的时候，就是为了北京户口，另外获得行业经验，获得人脉等。


    每天去各种实验室问这个项目，问那个项目，非常讨嫌。


    人就没打算长期干，后来一再说，再不出来干，年纪就大了。


    《富豪谷底翻翻身》里面的葛兰，卖轮胎，倒二手车，卖二手房，就是为了开一家餐厅，那家餐厅才是他的无限游戏。


    当然，那是一个节目，自然有时长，但是现实中，那个餐厅目前还是开着的。


    有些人上班，就是为了买房子，就是用上班这个有限游戏获得买房这个无限游戏的入场券。


    只有玩无限游戏，你才可能成为一个真正的神级玩家。


    《文明》系列本质上是一个无限游戏，目的就是“发展就是为了更好的发展”。


    # 五、结语


    武汉这个地方，夏天非常热，冬天非常冷。


    武汉作家池莉曾经说过，热也好冷也好活着就好。


    在维持一个无限游戏的情况下，挑战其中每个有限游戏的神级难度，才是一个星辰大海般的旅程。


    （挨踢牛魔王，2020 年 4 月 26 日晚）


