  md: '# （四）真正的力量


    “界限”是客观的。


    甜就是甜，咸就是咸。手包可以用来装东西，钱包就只能装证件和钱。客观的东西，没有好坏之分。功能明确，彼此之间区分的边界清晰。


    “解读”却是主观的。


    任何人都可以把一件事物，朝着自己需要的方向解读过去。


    “解读”的本质，是把抽象的东西具象化。


    所以“先创造一个抽象的区别，再通过语言描述将这区别具体化，最后把这具体化的东西，标价卖出高价”，这就是 Marketing 的秘诀。


    在这其中，你的引导描述 marketing 含量越高，越有可能打出总价的暴击。所有奢侈品高附加值行业，基本都依赖此而存活。


    刘润的文章，处处 marketing。


    所谓“专业的力量”，就是给傅师傅打的一个软广。用细微的普通人难以辨别的差异，加上傅师傅的解读，凸显他的专业性。


    一道荤素高汤分开的宴席，值 10000 元钱。


    其中，荤高汤与素高汤的口味差距，只值 10 元钱。但是“教育你认识到荤高汤和素高汤的不同”，这件事情，却值 9990 元。


    刘润真正的力量，不是专业的力量。而是潜移默化之中，将无法辨认的滋味，通过“专业性的解读”，变得具象化。“无中生有”地卖出了高价。


    Marketing，才是刘润真正的力量。读者心满意足地吃下一肚子安利，却对这力量一无所知。'
