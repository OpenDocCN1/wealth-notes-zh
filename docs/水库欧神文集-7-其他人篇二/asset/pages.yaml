    公司招聘员工时，会有性别方面考虑。年轻女性体力不足，不方便长期加班和经常出差，再考虑到结婚生育对工作的影响，很多公司不倾向于招聘女性，这些很正常。


    但由于平权法律的规定，公司招聘不能明说，只能含糊其辞——虽然不明说，但在简历筛选和面试过程中，总有各种办法，只招想招的男性。这就能然增加女性应聘工作的成本。


