  md: '# 汉化卢旺达：能成为非洲新加坡么 #W05


    原创： 菁城子


    汉化卢旺达： 能成为非洲新加坡么 #W05


    今年 7 月 4 日是卢旺达解放 25 周年纪念日，该国在首都基加利举行盛大阅兵仪式。与往年不同，今年阅兵不再采用传统法国的队列仪式，而是采用中国军队的队列式。阅兵式有
    22 个方阵，1 个旗阵，2 个徒手方阵，19 个持枪方阵，一共 2000 多人，6 名中国教官三个月内操练完成。从操练到正式表演，所有口号都用中文。


    当卢旺达军队的阅兵方阵走过，其步伐整齐，军容威严，让人看到中国军队的影子。许多中国人感到分外欢喜。卢旺达，这个非洲小国家，很多人知道它还是因为 1994 年的那场屠杀。二十多年过去，这个国家发生什么变化？为什么这一次阅兵仪式，会有中国元素的存在呢？这些都很值得我们回顾。


    # 卢旺达大屠杀


    卢旺达的近代史非常倒霉，它的殖民母国是比利时，是全欧洲最恶劣的殖民者。比利时在非洲有两块殖民地，一块是刚果，另一块是卢旺达。比利时国王利奥波德二世极尽贪婪，对殖民地大肆压榨和掠夺，用酷刑和屠杀对付人民反抗。大量奴工被斩手断脚，黑人被屠杀和贩卖，单单刚果就损失了一千万人口。


    英法殖民者殖民非洲期，多少带来欧洲的财产权和法律制度，比利时人的礼物是杀戮和恐怖。除此之外，他们还在卢旺达播下了仇恨的种子。这正是今天我们要讲的主要内容。


    比利时殖民卢旺达时期，为便于统治，他们进行了种族识别和登记。来自北部的肤色较浅、身材较高、高鼻薄唇的黑人，登记为图西族。图西族有游牧和经商传统，加之殖民者认为他们相貌和白人更接近，于是委以重任，使他们获得治理权。胡图族从事农耕，肤色较深，身材矮胖，塌鼻厚唇，同时数量也更多，政治地位低下。


    事实上，无论图西族还是胡图族，仅凭相貌并无法识别。有的图西族皮肤也深，身材不高；胡图族也有高个子，皮肤浅的个人。外观上无法识别，以至于殖民地政府规定所有人必须携带身份证出门。相貌略有差异的两地人，变成了对立的民族。


    在胡图族看来，图西族享有政治特权，帮助欧洲人殖治理卢旺达，是“为虎作伥”。1960 年代初，非洲独立浪潮风起云涌。政治地位较高的图西族是独立运动主导者，为遏制独立运动，比利时殖民者反过来拉拢胡图族，借助它抗衡图西族。胡图族人数较多，最终取得国家领导地位，总统也由胡图族人担任。


    到这时候，两个民族的矛盾变得非常尖锐。尤其胡图族，他们对殖民时代的历史耿耿于怀，并担心当下的政治压迫招致未来报复。一些极端种族主义者磨刀霍霍，妄图大开杀戒，将图西族一举铲除。还是那句话，比利时人殖民非洲半个多世纪，没有带来多少文明的痕迹。非洲传统的灭绝式杀戮，在很多非洲人那里，并非不可想象。'
