  md: '![](img/ef1c5244d092b8b29b53a68870574480_465_0.png)


    帮忙与被帮忙，委托与受托，已经是人们日常生活的一部分。


    +   - 机器稀缺，只有委托“有门路”的人购买。


    +   - “黑科技”费心力打通关系，承揽你各种业务。


