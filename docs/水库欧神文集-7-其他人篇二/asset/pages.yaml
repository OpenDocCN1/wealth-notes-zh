  md: '# 相亲十九问


    主观题


    +   1. （背景调查）请详细描述每一段重大恋爱经历，包括起讫日期和分手原因。

    2. （折现因子）已知一户有永久产权的房子，你估价10mio USD。请给出同样房子但只拥有10年、50年、100年、500年、1000年产权你的估值（在产权期内房子由子女继承）。

    3. （医疗保健）昨晚聚会略有饮酒，今日身体颇感不适，医生开抗生素头孢。问如何处理？

    4. （日常饮食）体检尿酸过高有什么风险？家庭饮食应如何进行调整？如果是胆固醇偏高呢？

    5. （子女教育）简述威权型(authoritarian)和宽容型(permissive)教育方式在培养子女认知能力(cognitive skills)和非认知能力(non-cognitive)当中的运用。

    6. （关系处理）若夫妻吵架、婆媳不和，应如何


    此处不演绎偶插题，对女性的口味与定位，婚姻的意义和 bug。这些问题，不会有确定的答案，谈了也是引战。


    单单应付“青年才俊”这类人，就是极令人头疼的。


    他既然志得意满，提出了排版、措辞和内容都非常精致的“博雅问题”，那么首先说明，他足够自信。


    他自信自己的学识渊博，论证方法科学。且对于自己做的每一件事，都事先想好了逻辑和理由。


    你问他“为何用十九问来筛女友”，他可以洋洋洒洒给你千字长文，发表在知乎回答。


    这种“已经志得意满”的人，一般分两种，要么是天才，要么是大谬。


    但对于后者，你虽然很容易看出其中的谬误，却很难自证正确，也很难令他从自己的思维中跳出来。


    “简述威权型和宽容型教育方式在培养子女认知能力和非认知能力当中的运用”


    这里的问题，细究起来很多：


    +   - 威权型和宽容型并非对立'
