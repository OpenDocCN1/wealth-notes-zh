    事实上，最早推出马桶流量管制的并非奥巴马政府，而是共和党人自己。


    1992 年，老布什总统签署《能源政策法》，这部法律首次规定：住宅抽水马桶的单次冲水量，不得超过 1.6 加仑（约 6 升）。看起来这还算是正常数字。可是一旦紧箍戴上，头疼的日子就开始了。


