- pgno: 754
  md: '也是可以发展出民间自发治理的机制的，不需要干预。


    可以说，如果以 1990 年代中期为分水岭来看，“诺贝尔经济学奖”几乎是两个完全不同的奖项。


    与此相应地，欧美经济日益陷入困境。日本也是一样。


    自 2001 年起，美国实际 GDP 增速再也没有触达过 4%。


    “经济体发达到一定程度，经济增速就会自然降低”，人们用这种错误认知来解释美国经济的困境。实际上美国的经济增速下滑是因为观念的失败。


    幸运的是，“诺贝尔经济学奖”发生大转向的十几年里，中国人倒也没有受到太大的影响。


    哈耶克、科斯在中国经济学者心目中仍然具有崇高的地位。


    中国改革最重要的“算法”，并没有受到欧美白左复兴的影响。


    自 2001 年之后，中国 GDP 增速在 10%以上的年份，有 5 年！


    直到 2008 年全球金融危机。


    那之后发生的观念变化，这里就不多说了


    ![](img/ef1c5244d092b8b29b53a68870574480_754_0.png)


    但尽管如此，如前所述，我认为公众的市场经济观念仍然是值得乐观的。即便这一观念基础支撑不了 10%以上的增长，但支撑 8%的增长应该不会有太大问题。


    对于欧美而言，“诺贝尔经济学奖”不死，经济难有复兴希望。


    但对中国而言，完全可以走出一条不同于欧美的道路。祝中国好运。'
