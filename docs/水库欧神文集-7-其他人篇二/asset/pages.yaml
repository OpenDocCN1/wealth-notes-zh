- pgno: 900
  md: '这个时候王峻就派郭崇威去“保护”刘赟，局势稳定后将其诛杀。郭威后来逐步消灭刘家的势力，比如刘恂、徐州刘赟的残余力量，还有兖州的慕容彦超。


    这件事情奇怪的地方是，前面都已经进城了，刘承祐已经被杀，为什么郭威不直接当皇帝？还要搞这么一出，不怕夜长梦多吗？


    # 三、时机和心理问题


    有很多人为郭威是个军阀，和五代其它朝代一样，是军阀推翻了皇帝。实际上，郭威根本没有掌握军队，没有自己的班底。郭威对于军队的掌握，实际相当于一个职场中，上级对下级的这种控制力。


    郭威第一次进城的时候，实际打的是“清君侧”的口号，让军队以为，只是上京城找皇帝要个说法。


    当然，也给了军队一些甜头，比如滑州犒赏。


    同时也许诺了一些彩头，比如抢劫开封。


    这个彩头，是一个鱼饵，钓起了起码三条鱼。


    第一个，就是给了军队跟着造反的动力。


    第二个，军队一旦抢劫完了后，就已经与开封的一些官员结成了死仇。


    除非郭威当上皇帝，抢劫的军队就有秋后算账的可能，人人恐惧。


    第三个，非常隐秘，趁着抢劫，清洗了刘家在京城的外围。


    前两个很好理解，第三个问题，史书上没有明写。


    比如说皇帝刘承祐是怎么死的？


    有史科说，是他的近侍郭允明所杀。


    李太后也承认这种说法，其实这只是符合皇家利益的一种说法。


    说是郭允明谋逆，意思就是我们已经输了，不准备再反抗了，只求活下去。


    《通鉴》说是乱兵所杀，是比较符合实际的。


    “乱兵”不但杀了皇帝，而且进城杀了他们原来的主人。


    “乱兵”会杀掉他们的自己人吗？


    想想都不可能。


    那么他们就是杀的刘家的党羽和一些没有依靠的人。


    郭威第一次进城的时候，为什么不直接称帝呢？


    因为时机不成熟。


    有三个原因。


    第一，就是军队完全还没反应过来。


