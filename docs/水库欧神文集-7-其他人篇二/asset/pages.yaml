  md: '很多女权主义者脑海中，只有“男女平等”教条。他们会把一般社会规范对女性的照顾视为“歧视”。没错，在一些女权主义者那里，“女士优先”也是一种歧视，它体现出“男权的傲慢”，将女人视为玩物和弱者。


    “女士优先”源于中世纪骑士精神。彼时的骑士致力于追求爱情，以作舔狗为荣，没有一丝一毫的傲慢；而在近代欧洲的文艺圈，“女士优先”发扬光大，它和扶助老人爱护儿童相同，是贵族强者应有的德行，谈不上什么歧视。


    但许多女权主义者就是不服气。他们不承认男女有别，某些方面的“照顾女性”只是出于现实考虑。在“男女平等”的旗帜下，他们向许多男性占优的领域发起冲击，就连当兵打仗这样的事情，也要争个高低。


