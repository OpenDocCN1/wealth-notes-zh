- pgno: 869
  md: '时代巨变，楼市拐点已至，卖房的时代到来了。


    要学就学李莲英。


    你看，李莲英多聪明，1911年就死了，连死都死的这么及时，这么幸运。


    这部分人是铁杆的空军，逻辑混乱，纯粹就是过来搞笑的，不值得一驳。


    还有一部分人的观点比较有迷惑性。


    这些人是叶檀老师的粉丝, 坚持认为，城市化率已经接近 60% 了，一般来说城市化率到 70%-80% 左右，就結束了，所以后面没啥搞头了，水库看来也快凉了。


    这样说的人很多，因为这个观点简单粗暴，小学生都能看懂，非常适合传播。问题在于，适合传播的难道一定就是对的吗？


    比如前几日，叶檀老师给某地产站台的时候说，2018 年，我国的城市化率已经达到 59.58%，后面还有 20% 的增长空间，楼市至少还有十年时间。


    这种说法似乎是看好楼市的，商业站台，总不好意思说楼市要下跌了。


    如果我们仔细查看叶檀老师对于房价的判断，就能看到她的真实想法。


    叶檀老师在接受某杂志采访的时候，说：“楼市上有顶，下有低，刚需就应该出手，但是作为资产配置来说，手上大部分资产集中于房地产，显然不是什么好办法。现在进入后房地产时代了，在房地产上的配置应该降低到
    50%，甚至更低。”


    叶檀老师的观点总结出来就是：楼市区间震荡，上涨每年不会超过 10%，低，不能低于 10%。刚需该买房，手上资产全部是房地产的该卖房。


    这里面实际是两个问题：第一个问题是，中国的城市化到底还有多长时间？第二个问题是，城市化结束后房价会不会下跌？


    我们这里不讨论货币因素，主要谈实际购买力。因为你房子价格涨的再高，没有人买，也是没有任何意义的。


    楼市至少还有十年时间，这种说法到底是怎么来的呢？我们没有想到叶檀老师给出理论依据，从她的讲话来看，是从城市化率着手，大概是也是所谓数据分析流，类比其它国家再得出的结论。


    其实关于城市化，业界有一套系统的理论，从西方泊来的。


    # 二、城市化曲线


    对于城市化的研究，西方学者总结了一个纳瑟姆（Northam）曲线。据说大部分的西方国家的城市化都符合这条曲线的规律。这条曲线业界研究的非常多。'
  merge: -1
  img_proc: true
- pgno: 870
  md: '有人根据这个理论，将城市化的过程划分为三个阶段：


    第一个阶段是30%之前，是缓慢的准备阶段。


    第二个阶段是30%到70%，进入加速城市化的阶段。


    第三个阶段是70%以上，是成熟缓慢的阶段。


    ![](img/ef1c5244d092b8b29b53a68870574480_870_0.png)


    整个城市化的过程，会形成一条 S 型曲线，分别有**两个拐点**。


    2014 年 10 月 25 日，万科宣布地产黄金十年已过，进入白银时代。


    所谓楼市“黄金十年、白银十年”的说法就是以这两个拐点为依据的。


    在拐点的30%-50%之间，就是所谓黄金十年，50%-70%之间，就是所谓的白银十年，70%往后，是不是该叫青铜十年了？


    这是看圣斗士后总结出来的么？


    很多人就是听信了这句话，2014 年就没有买房，接下来的事情，大家都知道了。


    这里我们还可以按照这个理论粗略的计算**下一个拐点**的时间。


    2018 年末，我国常住人口城镇化率达到 **59.58%**，非常接近 60%了。


    当前城镇化的百分比是每年 **0.71%**，而且这个百分比一直是逐步放缓的。


    那么按照这个纳瑟姆（Northam）曲线计算，**从 60%到 70%，至少还有 14 年，取个整数大致是 2035 年**。


    这是一种粗略的算法，精确的计算方法，需要解一堆微分方程。


    这个就是所谓**楼市至少还有十年**这种说法的源头。


    这样看来，房子多的是应该卖房啊，城镇化率都已经 60%了，是该逃顶了。


    写到这里，连我都快信了。


    理论完整，论证严密，有图有表，未卜先知，刘伯温在世啊。


    非常可惜的是，这些对纳瑟姆（Northam）曲线的解读是**完全错误的**。


    主要有两点：


    +   1.  并不是所有的城市化曲线都是 S 曲线的，S 曲线只是其中一种。


    +   2.  所谓的拐点和每个阶段的描述是完全错误的。'
  merge: -1
  img_proc: true
- pgno: 871
  md: '我们先说第一点。


    需要指出的是，纳瑟姆（Norham）曲线的名字本身就是错误的，是中国学者翻译的时候讹的结果。

    没办法，先入为主，现在国内就只能这么叫了。

    其实这条曲线的本质是 Logistic 函数，这个方法很早就被联合国用来研究城市化了。


    这条曲线并不是总是 S 型的，S 型只是其中的一种情况。

    影响这条曲线的三个因素是：**人口的增长、城乡人口的替换，城乡人口的迁徙**。

    这三个因素发生不同的变化，就会有不同的城市化曲线。

    而这三个因素和一个国家的制度、经济等等有很大的关系。


    我们看几个例子。

    在有些国家，城市化曲线可能是一条**下降曲线**。

    比如下面这两个国家。


    ![](img/ef1c5244d092b8b29b53a68870574480_871_0.png)


    有些地方城市化的曲线是 J 型曲线，就是没有拐点，**一直城市化达到一个极限**。'
  merge: -1
  img_proc: true
- pgno: 872
  md: '![](img/ef1c5244d092b8b29b53a68870574480_872_0.png)


    图 1 两种类型的城市化水平变化曲线


    HK 的城市化过程完全就是 J 曲线的例子。


    ![](img/ef1c5244d092b8b29b53a68870574480_872_1.png)


    所以说，一个国家的城市化曲线和很多变量都有关系。

    **有什么样的制度，就有什么样的城市化曲线。**

    那么，凭什么就这么肯定说，中国的城市化就一定是一个 S 曲线呢？


    我们再说第二点。

    S 曲线中的各种拐点，就非常奇怪。

    因为城市化是经济发展的手段，也是经济发展的结果，如果经济好的话，人口慢慢迁移到城市，为什么会出现拐点呢？


    实际上，如果城市化与经济增长高度适应的话，就不存在所谓拐点问题，而是取决于经济的发展情况。

    在没有到达上限之前，只要经济持续发展，那么就应该是一条一直向上的曲线，就是上面提到的 J 型曲线，实际上，说“**厂" 字型**曲线更形象。

    城市化的速度肯定是越来越慢的，但是肯定不存在拐点问题，而是一条平滑的曲线。'
  merge: -1
  img_proc: true
- pgno: 873
  md: '就算城市化结束了，经济继续发展，那也没有什么可以担心的。自然会有新的聚集产生，那就是再城市化。比如美国城市化进程都 100 多年了，湾区房价最近几年不是一样上涨？


    # 三、西方式拐点的真实原因


    城市化是一个系统工程，单纯讲城市化没有意义。农村人口要向城市迁徙，改个户籍是不难的。比如，一纸命令，将所有农村人口全部改为城市人口，这不就是城市化 100%了吗？反例就是阿根廷，城市化水平
    92%，但是依然是一个经济不好，收入不高的国家。这种做法显然是没有任何意义的。


    另外，城市化水平并不是越高越好，也不是越快越好，必须要和经济的发展相适应。


    这样的城市化有什么用呢？这是典型的拉美式城市化陷阱。


    ![](img/ef1c5244d092b8b29b53a68870574480_873_0.png)


    所以，真正的难点在于，进城的人口在城市能不能找到养家糊口的工作。


    其实整个城市化的拐点只有一个，就是最高的那个极限。随着经济的发展，农业机械化程度的提高，当农村人口在农村大规模种地，收入已经不比城里差的时候，城市化就停止了。这个才是那个自然形成的最高上限。


    那么，西方国家形成这种 S 型曲线拐点的原因是什么呢？


    主要的原因，就是经济发展越来越慢了，城市无法继续吸纳人口了，生育率越来越低，城市的人口也没有内生增长。'
  merge: -1
  img_proc: true
- pgno: 874
  md: '经济越来越差，当然是西方制度的堕落。

    最主要体现在三个方面：**作、闹、懒**。


    前几日，在欧洲和一个开小店的华人老板聊天，一个小老板都看得很清楚。

    小老板直言不讳的说，欧洲为什么搞成这样，就是因为他们“作”。

    他给我举了个例子。


    他说，他们这群小老板，现金挺多，别的投资机会也不多，都挺想买第二套房，收收租金。

    只要有人愿意买房，这不就是创造工作岗位了吗？

    不光是建筑行业，还有家电、水、电、气、网，这些行业都是可以增加就业岗位，提升经济增长的。


    但是，你要是在这里买二套房，别人就查你的资金来源，收你的持有税，就搞的你很难受。

    这样，就没人敢在这里投资了，经济就越来越差。

    这不是“作”是什么？

    欧洲可谓是世界上各种监管最严的地方。


    再说“闹”

    前一段时间，你要是去加泰罗尼亚，满地的碎酒瓶，这种情况下，你说怎么搞经济？

    这个不展开，大家自己体会。


    ![](img/ef1c5244d092b8b29b53a68870574480_874_0.png)


    最后，说说“懒”

    欧洲有各种躺吃福利的人，一些工作的人也不存钱，也不买房，有点钱就去外面旅游消费花光了。

    奋斗，不存在的。

    连孩子都懒得生，生孩子养孩子多累啊，两个人到处玩多快乐。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文章每月一更新......'
  merge: -1
  img_proc: true
- pgno: 875
  md: '这种情况下，经济怎么可以增长呢？

    这就是所谓的拐点。

    所以，没有拐点，只有西方式的拐点。

    这就是**西方方式的城市化陷阱**。


    一句话总结：所谓的城市化曲线不是天生的，制度塑造了曲线。


    # 四、中国的巨大潜力


    毋庸置疑，改革开放 40 年，我国在城镇化方面取得了巨大成就。

    我国 1978-2012 年**城镇化率百分点与人均 GDP 对数**的相关系数高达 0.99，就是说城镇化与经济发展强相关，是非常良性的城镇化。


    这是一条稳步向上的曲线，后面依然巨大的潜力。


    ![](img/ef1c5244d092b8b29b53a68870574480_875_0.png)


    现在可以看见的，至少有两个方面的潜力。

    第一个，就是城镇化的质量问题。

    2018 年，城镇化率达到了接近 60%，但这是按照常住人口计算的，实际户籍人口只有 43.37%。

    也就是说，大家进城了，可能是务工或者上学，但是并没有落户，无法留下来。


    我们取下限的话，根据规划，大概是 2050 年，城镇化还有 30 年左右。

    从户籍人口每年 0.5%计算，取 75%的上限，**城镇化至少还有 60 年左右**。


    其实这个时间根本就不用去关心，前面已经说过，即便城镇化结束，如果经济发展的比较好，人口还会聚集，房子依然还是涨的。'
  merge: -1
  img_proc: true
- pgno: 876
  md: '所以，第二个就是，大城市聚集。


    大家一定有这样的体会，就是 60%的城镇化率与自己的实际感受不符。


    我们以一名 985 院校毕业的大学为例。

    总的来说，985 大学生群体的收入水平，还是高于平均水平的。

    目前，大学生本科占中国总人口的比例仅为 5%，我们要是按照 985 院校来算，比例就更低了。


    但是呢，大部分 985 大学毕业生，在大城市买房落户都是一件极为不容易的事情，要动用六个钱包。

    这么优秀的一群人，收入远高于平均水平，在城市化的过程中，怎么就落后这么多了？落到了\一个还不如 60%的人的地步？

    985 们拼命奋斗，刚刚在城里落户没多久，结果城市化都已快快结束了。

    看着就来气，是不是？


    这个问题出在哪里？

    看文件，要仔细啊。

    注意措辞。

    实际上，官方一直用的城镇化，不是城市化，更不是大城市化，一字之差，这里面有微妙的区别。

    城镇化的意思是，大部分人还是在城市落户的。


    比如说，你在黑龙江鹤岗 5 万块买一套房落户，那也是计算为城镇户口的。

    国家是支持你落户在城市的，而且且提出了发展目标，但是国家并没有保证你一定在大城市啊。

    但是我们知道，只有大城市，才有房地产啊。

    从目前来看，我国的大城市的聚集度是远远不够的。

    这些都是潜力所在。


    至于经济发展，人口生育率，希望不要落入拉美式陷阱和西方式的陷阱。


    # 五、给大家的建议


    我国城市化依然还有很长时间，绝不止有 20%的空间。

    如果用一天中的时间点来打比方的话，大概是上午 10 点钟左右，太阳刚刚有一些刺眼。

    我国的城市化与经济的高度适应的，后面还有潜力巨大的大城市化，还有多个中心城市会诞生。


    如果你在一线和强二线，依然还是可以买的。

    如果你已经落地在三四线城市，本地留一套自住房就够了，尽量去一线和强二线城市买房，因为说不好你的下一代依然会去大城市。

    最后，天佑中华！'
