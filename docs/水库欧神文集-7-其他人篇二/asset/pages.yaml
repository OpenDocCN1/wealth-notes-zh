- pgno: 981
  md: '水库关于这个话题，写了一篇诚意十足的文章《十年寒窗，值八千文》阅读量当然是华丽的扑街了，一群人都说看不懂。


    内部我们调侃 yevon_ou，都这么长时间了，怎么还不长记性呢？


    自媒体规律：


    +   * **功能性命能看懂的，10W+。**

    * **小学生能看懂的，5W+。**

    * **初中生能看懂的，3W+。**

    * **高中生能看懂的，非常干，要么就是沉淀，要么就是辱骂举报。**

    * **大学生能看懂的，你咋不去写论文呢？**


    你说，你怎么能提“熵”这个概念呢？

    这是初中水平才能看懂嘛，幸好没提“耗散结构”。


    水库粉丝还算水平高的。

    全网的情况更加堪忧，有些财经号阅读量很大，其实就是一个财经口水娱乐圈。

    重点是娱乐爽文，阅读量当然高了。


    真不是我非要和一些本科生说成是小学生，现实就是这种情况。

    大部分人也不是真的爱学习，当年就是被各种压力逼的。

    本来上学就没学多少东西，还是错的。


    等到不需要上学了，第一件事情就是忘掉这些痛苦的回忆。


    # **30 岁之后个个原形毕露：十年寒窗，一夜忘光。**


    大部分行业也不需要任何本科知识。

    比如说你要做一个码农，只要初中水平就行了，除非是非常特别的算法岗位。

    那为啥知名互联网公司还要招本科及以上呢？

    那是因为技术变化很快，公司指望本科水平的可以很快学会新东西。


    一个人上大学，获得的最重要技能当然是**自学能力**，没有之一。

    这点都没学会，你当然不能算合格，有学历也没有用。


    赚钱和读书是什么关系呢？

    不是说你拿了一个本科学历，就是本科，那是“准本科”。

    这个学历只是某些工种的一个面试资格，证明你有这个潜质。

    你需要在社会上的某个专业上，做到**前 4%**的水平，才是真本科。'
