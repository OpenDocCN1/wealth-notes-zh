- pgno: 1007
  md: '那就是要学会躲避“三灾利害”。


    哪三灾呢？


    雷灾、火灾、风灾；


    到了五百年后，天降雷灾打你。


    须要见性明心，预先躲避，躲得过，寿与天齐，躲不过，就此绝命。


    再五百年后，天降火灾烧你。


    这火不是天火，亦不是凡火，唤做阴火。


    自本身涌泉穴下烧起，直透泥垣宫，五脏成灰，四肢皆朽，把千年苦行，俱为虚幻。


    再五百年，又降风灾吹你。


    这风不是东南西北风，不是和薰金朔风，亦不是花柳松竹风，唤做飘风。


    自囫门中吹入六腑，过丹田，穿九窍，骨肉消疏，其身自解。


    所以都要躲过。


    为什么会有“三灾利害”呢？


    别人修行，要修行几千万年。


    你十几年就学会了，你不觉得有什么问题吗？


    所以菩提祖师就说：


    此乃非常之道，夺天地之造化，侵日月之玄机；


    丹成之后，鬼神难容。


    看到没有，你学会之后，鬼神都难容你。


    《西游记》虽然只是小说，但是这里形容的真是太好了。


    大家知道，码农还算工资高的，辛辛苦苦，干了一辈子，就一线城市1-2 套房。


    那你凭什么有那么多套房呢，赚那么多钱呢？


    你这是“夺天地之造化，侵日月之玄机”。'
