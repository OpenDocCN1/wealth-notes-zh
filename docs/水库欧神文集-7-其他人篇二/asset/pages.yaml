    撤销抱怨，反而滋生问题。这一次许多女权主义者表面获胜（注：女权主义者也包括许多无耻愚蠢的男性），实际上女性也是吃亏者。


    八点之前的傍晚，一直是下班高峰期。打车不方便，许多男性用户选择八点后才下班，这是事实上的错峰出行。这次闹完之后，滴滴将男性乘坐顺风车的时间缩短，迫使很多人提前下班。女性打车更难，为此要付更高费用。只因“男女平等”的虚名，毫无必要地承担成本。'
