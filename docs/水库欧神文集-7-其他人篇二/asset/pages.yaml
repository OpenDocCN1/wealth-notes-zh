    +   1) 笑郇生之陋


    湖州的“石钟山”，因为能发出大钟一样的声音，在赫赫有名的水经注上占有一席之地。


    酖道元觉得钟声的来源，是微风吹动波浪拍打石头。李渤和石钟山的小和尚，则觉得是因为这里的山石特殊，敲击时的声音更为响亮。


    但苏轼老伙计不信邪，他送儿子去饶州，途经湖州时，便决定来个山洞探险。


    两人夜里坐船去石钟山。月光之下，山石长成了恶鬼的模样。小舟穿行在黑暗的水面上，BGM则是不知名鸟类的叫声，听起来就像老人的咳嗽和大笑。


