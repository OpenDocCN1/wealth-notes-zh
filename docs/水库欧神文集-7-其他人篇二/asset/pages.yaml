  md: '并不怪公众号如此写，因她们确实无法理解内在逻辑。


    这个逻辑导向一个无法解释的疑惑：我这么优秀，为什么还没人爱我。


    郑秀文和洪欣，已经是世俗意义上的成功女性。


    +   - 郑秀文星途坦荡，早年便入围劲歌榜“最喜爱女歌手”奖项。


    +   - 唱而优则演，荧幕上同样是港女 icon，杜琪峰最爱的女仔之一。


    +   - 陷入抑郁症三年，又挣扎着自己走了出来。


    +   - 网友评价她舞台控场一流，粧粧件件都要强精心。减肥减到饿晕，一口白粥都不要喝。


    这样的女人，符合一切“优秀努力”的标准，却连一个面容普通事业庸俗，只能走苦情路线的“老鼠安”都留不住。


    演活港女的人，没脾气地选择了“且行且珍惜”，原谅出轨男。


