- pgno: 841
  md: '# 林毅夫真的错了吗？#W31


    前一段时间，林毅夫预测宏观经济的一张图刷屏。林的预言，被称为打脸现场。


    ![](img/ef1c5244d092b8b29b53a68870574480_841_0.png)


    但是，林毅夫真的错了吗？


    有一些朋友提出，经济学家本来就 不应该预测未来，因为未来的变数太多了，所以林毅夫错了。


    这个说法有道理。


    经济学只是解释局限条件下，人们怎么选择、给定选择将会得到什么结果，但对于未来局限条件的变化，用经济学的确是无法详细预测的。预测未来更应该是企业家的事。'
  merge: -1
  img_proc: true
- pgno: 842
  md: '但是仔细看林毅夫早先的预测，“未来 30 年中国 GDP 仍有望超 8%”、“未来中国还能以 8%速度再持续增长 20 年”，他其实指的是中国经济的增长潜力。


    林毅夫自己也曾多次澄清说，他指的是中国经济的潜力。


    中国经济增速潜力在 8%以上，这是高估吗？我认为一点都没有高估。相反，还低估了。


    实际上，中国经济增速重回 10%以上，并不是什么难事。


    就达美国，要达到增速 10%，也并不难，只要美国肯大幅减税，取消反垄断法反就业歧视法最低工资法、FDA、工会特权、金融管制、房地产税等等。


    我以前的文章已经说过了，经济体越发达，经济增速理应越高。美国自里根之后，经济增速一直低于 4%，并不是因为什么“体量大不容易增长”的规律，而是干预者多方努力的结果。


    这些年中国经济增速始终在 6%多，这能怪林毅夫预测不准吗？


    当然不能。


    只怕林毅夫心里也在哀叹：“这，真的是我自己打自己的脸吗？我明明是被局限条件的变化打脸。我也是受害者好吗！”


    不仅不能怪林毅夫，而且，从实际经济增速和林毅夫预测的背离，还可以检讨一下人们在经济观念上的问题。


    前些日子，高首席普文发表《知止不殆》的演讲，对中国经济的未来走势进行预测。他的预测是时代的忌讳，所以这里我就不引用他的预测了，没看过的朋友自己搜吧。


    很多人迷茫：“中国经济，究竟会怎样走？”


    年底了，谈谈林毅夫的预测，或许有助于大家理解中国经济。


    一


    对于林毅夫的很多观点，我都不认同。例如他的新结构经济学，我就不认同。


    尽管我认为林毅夫对中国经济的增长潜力并未低估，但是对于他的估算方法，我是不认同的。


    他们宏观经济学者估算未来增长，常用的方法是算需求。


    老年人的养老需求多少多少，能带来百分之几的增速。


    新生儿的需要多少多少，能带来百分之几的增速。


    教育需求多少多少，投资需求多少多少……


    他们不懂萨伊定律。


    萨伊定律，简单说就是“供给创造需求”。


    宏观学者常常误解萨伊定律，说它讲的是“生产出来的东西，自然有人买”。


    但实际上，萨伊定律的意思是，人们只有能供给，才能买得起别人的产品。


    需求的意思是，需要且买得起，如果买不起，那就只是需要，而不是需求。


    猎人只有能打到猎物，才能用这猎物买农夫的大米，才有对大米的需求。


    同样，农夫也只有能生产出大米，才能买得起铁匠的农具，才有对农具的需求。


    根据萨伊定律，宏观上看，要想需求增加，没有其他的路可走，只有市场环境持续向好，企业发展好，人们收入高，人们的需求才会越来越大。


    一旦市场环境发生变化，原来估算的需求，就会大打折扣。


    这是林毅夫没有预料到的一点。


    二


    最近，中国人民银行行长易纲发表题为《坚守币值稳定目标实施稳健货币政策》的文章。'
  merge: -1
  img_proc: true
- pgno: 843
  md: '文章中有一句这样的话：“保持币值稳定，并由此为经济增长营造适宜的货币环境，是货币政策的根本目标。”


    很多人不知道这句话的来头。


    1995 年，国务院副总理朱镕基还在兼任央行行长时，全国人大通过了《中华人民共和国中国人民银行法》。


    其中，第三条明确规定，“货币政策目标是保持货币币值的稳定，并以此促进经济增长。”


    也就是说，根据央行法，货币政策应该有且只有一个目标，那就是“保持货币币值的稳定”。


    易纲只是重申了央行法的规定，但这已经非常难得。


    要知道，太多人早已遗忘了央行法的这条规定。


    我看到易行长提起这句话，更有别样的感觉。


    因为早在 2014 年，看到很多人谈货币政策的 5 个目标、6 个目标，什么“稳就业”、“稳汇率”、“稳……”之类，我就不断写文章说，请记住央行法第三条。


    央行法第三条，和绝大部分法条都不一样。


    它不仅规定了应该怎么做，并且还指出了币值稳定和经济增长之间的因果关系——只要币值稳定，就能促进经济增长。


    当然，法条不能规定经济规律。只能说，第三条是揭示经济规律。


    而什么是“币值稳定”，也有含糊之处。例如，一分钱都不要加价，才是币值稳定呢，还是一篮子物品购买力不变是币值稳定？


    尽管有这个问题，但第三条的表述，大体上是对的。**哪怕依据“一篮子物品购买力不变”，也比所谓的“多目标平衡”强得多。**


    根据萨伊定律，需求只能由供给创造。


    宏观学者把多印钞票视为刺激需求的工具，但多印钞票并不能增加一分钱需求，因为它没有增加供给。它只是重新分配需求。


    这会导致错误的生产结构得不到清算，从而使得人们的需求不但不增加，还会普遍地下降，使得经济增速下行。


    这是林毅夫预料不到的另一点。


    现在易纲重申央行法第三条，观念上是改进。


    但是金融领域行政干预又成了问题，这个就不细说了。


    # 三


    前几天，全国政协经济委员会副主任刘世锦在一个论坛发表“用刺激性办法保 6，还是用改革的办法稳 5”的演讲。


    另一位经济学家马光远在朋友圈评论：“我不明白，什么时候，改革成了经济减速的代名词，而刺激成了经济加速的代表。为什么改革就不能加快速度？中国经济几次大的飞跃恰好是靠改革而不是刺激！把改革与经济放缓等同是错误的。我恰恰认为，明年如果真的让大家看到改革的希望，是可以保
    6 的！”


    马光远的观点，我非常赞同。


    我几年前就一再写文章，阐明同样的观点。


    中国经济持续 30 多年的高增速，难道是“保”出来的么？


    不是！是改革出来的。


    每一次市场化改革的飞跃，都紧跟着经济增速的高涨。


    宏观经济学者的另一种谬误，是把经济发展的质量和速度对立起来。'
  merge: -1
  img_proc: true
- pgno: 844
  md: '他们认为，经济增速高，经济质量就不好。所以他们常常说，要克制对经济高增速的追求，要追求高质量增长。


    甚至还有一些人认为，美国经济增速虽然低，但是质量更好。


    实际上，经济增速高，的确有可能质量不好。但如果经济质量好，那么经济增速一定是高的。


    什么是经济质量好？经济质量好，那就是说资源配置得更合理，效率高，浪费小，如此，增速又怎么会低？


    中国经济以前出现过比当前还要严峻得多的情况。


    例如 1990 年代，很多国企在市场大萧条的冲击下，靠财政拨款和贷款维持，当时有一个名词：输血经济。


    不少地方的企业想了一个点子，就是从农村招工，给解决县城户口，但是工人要交一笔钱，等于是花钱买县城户口和工人的身份。一个名额几千块钱，可以在县城买 20 多平米的房子了。这个生意火爆了一阵子，但大部分企业还是没有挽救过来。


    当时很多经济学家也觉得这经济形势实在时困难，不知道怎么解决。


    但是上面一方面让银行自负盈亏，停止给国企输血；另一方面授权地方大刀阔斧改革国企。


    很快就走出了困境，迎来高速增长。同时，中国经济的质量也越来越好。


    改革、增长、发展质量，从来就是三位一体的。


    像林毅夫这样资历的学者，亲历了中国经济的多次难关（但他存在较多的归因错误），所以，他对中国经济的增长潜力乐观，是很自然的事。


    世事不由他控制。怎能因为他曾说中国经济增长潜力在 8%以上，就对他冷嘲热讽呢？


    # 四


    中国经济的前景是否乐观？


    中国经济当然有非常值得乐观的基础，那就是很多普通人的观念，大方向上还是支持市场的。按照惯例，我只说乐观的方面。


    例如，尽管宏观学者们习惯于求助货币宽松的刺戟，但他们也并没有忘了市场化改革。


    像任泽平这样的经常呼吁货币调控的人，也会说：“市场自发出清证明了市场机制的伟大，要坚持市场化改革的方向。”


    易纲行长在《坚守币值稳定目标实施稳健货币政策》中说：


    “若因宽松货币政策而降低改革和调整的动力，反而会延误问题的解决。”


    “从世界历史上看，货币政策曾被用作追求经济增长的手段，甚至希望通过容忍高一点的通胀来换取更高一些的经济增长。但实践表明，这样的想法难以实现，甚至会出现 通胀的后果。”


    观点不错，但短期还得看市场化调整的力度。市场化调整得好，央行法第三条应该能得到很好的坚持。


    中国经济的长期，则要看人们的观念。只要多数人继续相信市场经济，中国经济长期来看就是乐观的。


