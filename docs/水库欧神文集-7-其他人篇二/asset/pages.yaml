  md: '# 纯粹的邪恶是什么样


    菁城市 水库论坛


    ![](img/ef1c5244d092b8b29b53a68870574480_763_0.png)


    本文聊聊 2019 年最热电影《小丑》，没有关键剧透。这部电影没有复杂的情节，真正吸引人的地方是演员出色的表演。正因如此，看完本文也基本不影响观影体验，读者大可放心阅读。


    # 一、反超级英雄


    自 1940 年代随着蝙蝠侠登陆漫画作品，小丑一次次被演绎，成为电影史上最著名的反派。《蝙蝠侠：黑暗骑士》中，希斯·莱杰饰演的小丑杀人不眨眼，极尽癫狂邪恶，令人不寒而栗。今年杰昆·菲尼克斯在电影《小丑》的表演，则被认为是创造了新经典。电影上映后，很多人说：杰昆·菲尼克斯预订了明年的奥斯卡影帝。


    《小丑》的剧情很简单：亚瑟·弗莱克是哥谭市落魄的社会底层，他的工作是扮成小丑在商店门口举着促销牌子。亚瑟患有精神疾病，要接受心理咨询和定期服药，服药使他常常不可自抑地大笑。由于这个疾病，他受到排挤和打压，生活苦闷。令人苦恼的是，亚瑟的梦想是当一名笑星，疾病使他注定无法成功。在经历一连串被侮辱与被损害后，亚瑟·弗莱克放弃幻想，成为真正的暴徒“小丑”。整个城市，亚瑟这样的人并不少，哥谭陷入火海。'
  merge: -1
  img_proc: true
- pgno: 764
  md: '![](img/ef1c5244d092b8b29b53a68870574480_764_0.png)


    我们都很熟悉“底层小子历奇遇，实现人生逆袭”的故事套路，这是超级英雄的通常版本。而在超级英雄对面，《小丑》第一次将“反超级英雄”作为主角，展示出世界的黑暗与残酷。挫折并不总是磨砻，它往往将人性导向黑暗。


    这样的故事太过瘾了。杰昆·菲尼克斯接小丑这样的角色，是他的幸运；很多观众也完成了心灵的洗礼——人性并不本恶，只因社会环境烂透，使好人沦落至疯狂。


    这种看法很普遍，只可惜，这样的观念包含毒素。对坏人滥施同情，是获取廉价道德感的捷径。


    # 二、小丑为何不幸


    电影《小丑》一开始，就展示出哥谭市（也就是纽约）的“不义”。


    这个城市的政府在削减福利，很多人失去工作。清洁工人罢工，城市里每天堆积超过一万吨垃圾。垃圾遍地，硕鼠滋生（大资本家的隐喻）。


    城市混乱而肮脏，与之相对应的是，亚瑟·弗莱克（也就是小丑），他可称得上混沌世界里的好人。


    亚瑟每天兢兢业业工作，乘公交车时，会逗小孩子开心，回家要照顾病床上的母亲。亚瑟习惯向他人展示微笑——他妈妈从小就教育他，要对他人保持微笑。


    亚瑟还养着一只猫（这暗示他将是资本家的克星），有一个希望他人获得快乐的职业梦想，看起来是多么善良的人。'
