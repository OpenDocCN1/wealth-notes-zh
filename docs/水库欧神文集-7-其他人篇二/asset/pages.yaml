- pgno: 909
  md: '这个模式，也是稳定“收敛”的，每年的消耗也是极小的。这样，这个模式才能一直持续下去。事实上，房产上也存在无尽阵，也是很有用的。


    有些人房产也可能比较多，也许是其它途径获得的资金购买了房产。比如说拆迁、办厂。虽然他们房子多，资产结构是非常差的，很可能是无尽阵。这下去，他们的资产回报率会越来越低，直到泯然众人矣。


    亚里士多德说：整体大于部分之和。同样价值的房子，玩房子和不玩房子的人有什么区别？资产包的质量不同。这里的质量不是单套的质量，而是整个资产包的质量，资产结构不同。玩房子的人，是有章法的，房子之间是有逻辑关系的，未来的潜力是无穷的。其中，房子的资产结构，是不是无尽阵，是一个重要的指标。


    所以，说来说去，大家玩的并不是同样一个游戏。虽然看起来都在玩PVZ，其实有质的不同。这样讨论起来，当然是鸡同鸭讲。


    比如，为什么要推重庆，上海不涨了吗？是因为雪城啊。上海当然还会涨。但是在上海，你要出第一个无尽阵，就比较难，成本高嘛。对于重庆来说，就简单得多。


    你要尽快出无尽阵，就需要一个比较长的雪城。


    同样，说到实操。就像玩游戏一样，你知道这个心法，但是在操作上不一定能达到这个水平。你能保证你几年前的买的玉米炮，现在真的能完成充能么？这个当然是需要极为精细的“选筹”。否则，这就不是“无尽模式”通关，而是无尽的痛苦。


    这个模式你也不能乱改，乱改是会破阵的。《射雕》里面，王重阳担心自己死了之后，全真七子无法克制其他四绝，费尽心力创建了一个天罡北斗阵。天罡北斗阵，搞的好的话，和五绝可以持平。如果布阵的人比较强，甚至可以超越五绝。'
