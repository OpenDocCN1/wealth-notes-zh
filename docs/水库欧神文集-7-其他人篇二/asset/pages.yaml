- pgno: 631
  md: '![](img/ef1c5244d092b8b29b53a68870574480_631_0.png)


    电影里的荒诞情节发生在现实，观众自然一笑。我看到这条新闻时，倒没觉得太荒诞。从南极拖运冰山到阿联酋，让人不可思议，无非是觉得：两地相隔甚远，八千多公里漫长距离，要跨过赤道和阿拉伯海，最终抵达中东地区，听起来难度好大。


    如果，拖运冰山的终点没那么远，而当地又刚好缺水，有没有可行性？上个月，正好有媒体报道，一位名叫尼古拉斯·斯隆（Nicholas Sloane）的南非人，正进行缜密计划。他打算从南极拖回一座冰山，卖给家乡的城市开普敦。


    ![](img/ef1c5244d092b8b29b53a68870574480_631_1.png)


    “冰山狂人”尼古拉斯·斯隆


    2015 年起，南非开始历时多年的干旱。水坝蓄水量不足，城市自来水厂无法正常供水。开普敦政府先是发布“节水令”，要求居民根据配额用水。然而收效甚微，于是政府从
    2018 年起发布“断水令”，全市上百万家庭水龙头被断水。人们想要用水，得手持瓶子和水桶到附近“取水点”排队取水。昔日美丽的开普敦，如今一片狼藉。公共绿植无人灌溉，私人泳池早已废弃，公共厕所的自动冲水装置，也被拆除。居民用水配额从一开始的每人每天
    80 升，不断减少，最低降至每天 25 升，不到两个饮水机桶装水的量。这些水要用于饮用、洗漱，甚至包括冲厕所。在开普敦，不要说潇洒泡浴缸，就连经常洗车也显得很奢侈。斯隆出身在'
  merge: -1
