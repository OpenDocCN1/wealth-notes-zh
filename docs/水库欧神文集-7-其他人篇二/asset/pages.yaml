  md: '# 中产的跃迁 #X110


    ![](img/ef1c5244d092b8b29b53a68870574480_973_0.png)


    # 中产的跃迁 $_{\text{#X110}}$


    > 今肃可迎操耳,如将军不可也。将军迎操,欲安所归?


    ——————《三国志》


    # 一、承担风险


    回顾一下，上一篇《财富的进化天阶》，我们讲的其实就是两个字：限制。


    你都搞不清楚限制是什么，又何谈去解开限制呢？


    大家都知道，老板肯定是比他的员工拿得多的。

    有人就讲了，你这是瞎说，有人打工做到打工皇帝，比绝大部分老板赚得都多。


    那么请问，打工皇帝是为谁打工呢？


    打工皇帝能力未必比老板差。

    孙悟空把活都干了，唐僧啥也不管。

    诸葛亮把活都干了，刘禅啥也不管。


    那么老板为什么比打工皇帝拿得多，凭什么，为什么？'
