    考试才是不公平 X54


    最近关于教育话题，连续地看见新闻。


    先是不准幼儿园“小学化”，对于提前教授汉语拼音、识字、计算、英语等小学课程内容的，**要坚决予以禁止**。


    然后是大报纸喊话，希望暑假不要补课，搞“抢跑式”教育。'
