    2013年，在男女平权运动推动下，美国军队提高女兵体能测试目标，向男性士兵看齐。并解除了女兵在一线作战的禁令。


    顺便说一下，许多女权主义者欣赏中东库尔德人，因为这个国家的女兵很有名。库尔德没有国家，一直在追求独立，为此大量女性扛枪上战场。这哪里值得赞美呢？！


