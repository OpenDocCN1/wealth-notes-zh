  md: '记者问岳父，女婿是哪天出师的。岳父答：“是他炒菜味道开始不变的那一天”。。


    从恣性到商业，是最艰难的一步。


    小到一篇文章，大到一个公众号。由灵感而诞生的作品，曾经凝聚着作者的心血，是亲手养大的一只小猪仔。


    然而，当你下定决心，将之商业化时，你就必须冷血到底，将这曾经的宝贝彻底当作工具。不再去想自己的心意，也不再去做猪仔的结局。


    你们之间的脐带，从这一刻开始慢慢撕裂。


    小猪仔养育的时候，好快乐。


    可是猪仔终究是猪仔。


    眼看雪花飘起来了，家里人，都在等着过年呢。


