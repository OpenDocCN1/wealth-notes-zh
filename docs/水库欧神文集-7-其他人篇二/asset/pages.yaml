  md: '婚姻的幸福，这也是典型的婚驴。


    我们要问的是：


    +   - 到底哪条法律阻止女人追求成功，追求独立了？（独立的自由）

    - 到底哪条法律强迫女人一定要结婚了？（不婚的自由）

    - 到底哪条法律要求女人一定要生孩子，把女人当所谓的“胎器”了？（不生的自由）

