- pgno: 184
  md: '与大多数人的直观感受相悖的是，虽然微博上恶性消息越来越多，但是日常生活中的治安，其实并没有发生大的变化，甚至是逐渐向好的。


    就如“摸象的盲人”那篇文章所说，其实正规出租车的恶性案件更多，只不过大家没有过多关注罢了。


    上世纪 90 年代末，沈阳有一系列非常出名的连环抢劫杀人案件，后来被统称为“3·8 串案”。因为他们最出名的案子，是在 1996 年 3 月 8 日妇女节当天做下的。


    那时候日常还用现金，作案团伙的四个人，在光天化日之下，持枪杀死提款车司机和保卫干部，抢走了沈阳第一饲料厂的 20 多万元工资，在当时是一笔巨款了。


    “3·8”团伙作案的方式，就是打出租车之后，用尼龙绳勒或枪击方式杀死司机，抢得出租车，再开着这辆车去抢钱。这样每次作案，至少要毁掉一个出租车司机。他们几年之内，就在沈阳作案
    40 多起，杀害 20 余人。


    如果是现在，如此恶性的案件，杀第一个出租车司机的时候，估计微博就炸了。但是当时信息不发达，所以即使是大事，也未必所有人都知道。'
