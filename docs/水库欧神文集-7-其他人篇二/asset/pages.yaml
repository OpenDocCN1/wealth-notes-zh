  md: '一件事情，你把它 “定性”。你就立于不败之地。

    其他的证据链，证人证物，都是技术细节了。

    在《奇葩说》这类娱乐节目中，更是等而下之。

    “电视综艺”连寻求真相，都不热衷。对于主持正义，毫无兴趣。他们需要的，仅仅是收视率，制造访问话题。


    《保护名画还是一只猫》，策略也十分简单。你只要念动魔法咒，对这个事件进行“定性”。如果你能够定性成为“活物 VS 死物”，一条生命 VS 俗钱，则自然无往不胜。诡辩界的白马。


    ![](img/ef1c5244d092b8b29b53a68870574480_801_0.png)


    如果你是奇葩说的观众，你需要关注的，并不是各自辩手的语气和文采，临场发挥和机智应变。而是看“战略”，谁能在战略上，一步步引导到“生命 VS 死物”，人文关怀和动物灭绝。内行是看门道的，能看透出牌的套路，才是诡辩的美学。


    邓新华十分厌恶李诞的 “套路”。认为他文过饰非，有藻华而无大义。通过诡辩带节奏的方法，即使赢得辩论，却对 “君子求真” 有益。若论真情实意，或许还不如嚎啕大哭的老妇：“你这个老不死的，你咋不听劝听呢……”


    SOWHAT，人家是个演员，至少流量上去了，知名度打开财源滚滚。

    本来就是综艺节目，认真你就输了。


    # 邓新华


    最近“奇葩说”的一期节目，脱口秀演员李诞的一段视频爆红。李诞在发言中批评很多知识分子总是想着牺牲这个拯救那个，这个观点我是赞同的。但，我朋友圈不少人说李诞的发言很经典，这是我不能同意的。在我看来，那是一段很糟糕的发言。


    # 一


    小时候，我经常目睹农村不幸的事件。

    例如，一个男人贪吃，冬天下塘摸螺蛳，溺亡了。他老婆痛哭：“要你莫下塘你要下塘，下塘浸死了，你何理果样蠢呢！我和崽女靠哪个呢！”

    那个时代，生活粗粝艰辛，农村妇女的语言世界也是一片荒芜。'
