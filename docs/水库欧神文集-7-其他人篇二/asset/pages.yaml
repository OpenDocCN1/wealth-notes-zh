    为了掩饰自己的窘迫，这部分人最喜欢使用的说辞是“专业性”。


    父母不说父母，要说“原生家庭”。


    学艺不精，就把司机开公交车跳江，说成“科里奥利加速度错觉”，再被打脸那是飞行员才会产生的错觉。


    > 发展到极致，就变成“月季医生”之流“科学神棍”。


