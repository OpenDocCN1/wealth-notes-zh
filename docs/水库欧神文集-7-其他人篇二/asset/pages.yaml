  img_proc: true
- pgno: 663
  md: '离成都市中心将近 30 公里的龙泉山，有一处长安生活垃圾填埋场。当地原来就有峡谷地缝。当地政府因利乘便，1993 年起开始建垃圾填埋场，用来容纳成都整个城市的垃圾量。一期工程占地
    800 多亩，当时预计足够填埋 25 年到 30 年，结果到 2009 年就说填满。建设二期工程，预期能用 20 年，结果只用 10 年，现在在建三期工程。一期到三期工程，占地面积总数近
    2000 亩。


    ![](img/ef1c5244d092b8b29b53a68870574480_663_0.png)


    从步伐紧迫的数字来看，听起来可真够危急。倘若你了解龙泉山规模之大，就不会有任何焦虑。龙泉山的生活垃圾填埋场还有扩建的空间。每次新建，都是以满足这个城市十几年甚至几十年的垃圾填埋需求——只要愿意的话。


    整个龙泉山麓，类似条件的山丘沟壑，还有很多。成都周边的山地丘陕，数不胜数，可填的沟壑谷地就更多。把目光扩展到周边市县，可开发的空闻资源可以说无数。成都全市面积超过
    2000 万亩，只需不到 0.01% 面积土地，就够填堆数十年的垃圾。


    用如此小的空间，就能解决巨大而长期的问题，这不是高效吗。土地资源生来就被人类利用，填埋垃圾当然也是一种利用方式。（况且这些土地没有完全荒废，它们变成森林和绿地。）没有这些土地容纳，垃圾势必填满我们生活的空间，需要我们花费巨大财力精力去处理。


    从这个角度讲，这些处于荒郊野岭的土地被人类重新利用，产生的价值非常高。当然，从这件事情，也可以看出城市化的高效率。如果不是在城市，上千万人口的农村人口，他们分开，各自处理垃圾，将占用多'
