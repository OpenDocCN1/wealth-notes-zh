- pgno: 525
  md: '吃寿司的速度是一个接一个，十五分钟之内顾客就会被成功塞饱。


    ![](img/ef1c5244d092b8b29b53a68870574480_525_0.png)


    这本都是些可有可无的讲究。厚蛋烧的火候大了一点，那就大了一点好了。


    但是谁没有按照这些“内行做法”，装模样摇头脑地宣称自己尝出了二郎寿司的美妙之处，立刻会被扣上“不懂鉴赏”的帽子。


    而最有意思的是，因为所有规矩都是“可有可无，若有若无”，非常玄学，你甚至根本吃不出这些因素，是怎样影响了寿司的风味。


    所以“鉴赏门槛”更高，被唬得一愣一愣的吃客们，绝不会自信认为，是寿司的味道有问题，而是会认真反思，这微妙的差别一定存在，只是自己没吃出来。


    # 3）众志成城


    “摸象的盲人”讲，中国传统武术的气功与内力，很多其实带有表演性的成分。所谓一掌毙命，则是用毒的结果。


    那么练成为什么如此讲究“师承门派”，总是要徒弟耗上几年，扎马步挑水呢？


    一方面，可以强化徒弟的服从性，筛选出最任劳任怨的人。


    另一方面，当徒弟最宝贵的青春，用来干了几年毫无意义的事情之后，他就付会了巨大的沉淀成本，从此没有退路。


    如果不弘扬本门派的“武林绝学”，他的人生就成了一个被坑被搞的大笑话。


    > “洗鱼十年，才能开始煎蛋。”


    > 煎蛋二百个，才得到师父一句表扬。


