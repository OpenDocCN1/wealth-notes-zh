  md: '在房产最火热的那几年，市场涌进来很多人，仿佛找到了发财的捷径。这些人当年有多狂热，现在就有多失落。


    这几年，其实房产方面发财的也很多，大道相同，不过方法各不相同。


    这几年突破的，有的人靠的是民宿，有的人靠的是海外，有的是辞职做房产相关的创业。别人就算把他的经历全部告诉你，你也未必能成功。


    就拿水库心法来说，有些人特别搞笑，研究了半天之后，长篇大论的说了很多条理由，意思就是，还是不认同。


    这玩意，还真就不是让人认同的东西。


    就像《庆余年》中的霸道真气一样，让你震碎经脉成为活死人才能突破关口。注意，只是有概率。


    你说你认同不认同？


    就算你勤奋，有天赋，有秘籍在手，但是你敢吗？


    正常人不会认同，所以只有少数人能发财。


    # 五、结语


    实力和运气是什么关系？


    在找到正确方向的前提下，如果按图索骥，大概也只能到达一个八品高手的境界，这一点，任何人都有这个条件，对，就是任何人。但是大部分人其实根本做不到，这里的要点是勤奋。


    这是你凭实力和练习能走到的最远的地方。


    一个人总是凭实力赢，是不是太辛苦了一点？


    如果要成为九品高手，那就需要结合自己的资源禀赋进行创新，这条路，只有你自己知道，这里的要点是票赋。


    如果要达到宗师之境，只能靠运气+心性。大家看到的所谓真正顶尖的房产高手，其实大多数也不过是九品而已。


    挨踢牛魔王，2019 年 12 月 29 日晚'
