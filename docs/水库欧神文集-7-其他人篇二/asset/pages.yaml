- pgno: 882
  md: '那么陆步轩是怎么做到每天卖出超过别人 10 倍的猪肉的呢？


    话说，陆步轩经过前面的一系列失败，卖猪肉的时候比较谨慎，先请了个内行的师傅，但是就是不赚钱，连这个师傅也不知道是为什么。他是无意间领悟了卖猪肉的诀窍，一旦开始赚钱，就一发不可收拾。


    在卖猪肉这行，要长期经营的话，最主要做的是回头客的生意。

    既然要做回头客的生意，那就要做好猪肉的品控，这个是基本功，只能看猪 200 头了。

    只有基本功，不能保证你赚钱，还得有绝活。

    这里面最大的一个因素是什么？

    就是刀手。


    由于回头客都是熟人，自然不好缺斤少两，这个时候就对一刀手的要求非常高了，切少了顾客不允许，切多了自己亏。


    利润就在刀手挥刀的瞬间。


    比如，一般卖肉都是这样的，客户要买 1.5 斤肉，刀手一刀下去，可能是 1.4 斤多，然后再切一小块添头，报 1.5 斤，但是实际可能是 1.5 斤多。


    刀法不精准，可能就多送给顾客或者变成边角料了。

    日积月累，那就是巨大的利润。


    每一个环节，都有类似这样的事情，比如骨头、大油、肉皮，这些下脚料都是利润，这些都依赖一个刀手的刀法是否精准。陆先生就是做到了顾客满意，自己又有利润，形成了“精准的刀法-良心牛肉-回头客”的良性循环。


    由于陆先生诚信经营，口碑很好，在当地的圈子里面本来就很有名气。

    他最开始的一个店被拆迁后，不少老主顾都找他，希望他重出江湖，说是没有他，就买不到放心肉了。


    陆先生的客户除了散客外，还有酒店、餐厅、单位大灶、部队后勤等大客户资源。


    有了这些回头客，大主顾，才能做到每天卖出比别人多 10 倍 的肉。


    陆步轩当然是一个好的刀手，而且是一名写书写的非常好的刀手。


    他成名之后，被安排到长安县写地方志，这次是有编制的，一写就是 12 年，每年写几十万字，这样练下来，功底深厚。

    他还是有一个体制内情节，这也是完成心愿，但是完全不赚钱。

    据媒体报道说，陆步轩卖猪肉，挣了 200 万以上，不知真假。

    这 12 年间，逐步将卖猪肉的钱都花完了。


    陈生就老是鼓励陆步轩出来一起干。

    陈生说，全国有几十万人写地方志，你怎么可能出头？'
