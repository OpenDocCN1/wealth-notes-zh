  md: '# 没那么糟糕 #W17


    ![](img/ef1c5244d092b8b29b53a68870574480_722_0.png)


    土地财政没那么糟糕 #W15


    参考阅读：《从来不存在“土地财政”》#82


    北宋王安石变法时，和司马光争论。


    王安石说，善于理财的人，不给老百姓增加赋税，也能增加财政收入。


    司马光说：“天地所生财货百物，不在民，则在官，彼设法争民，其害乃甚于加赋。”


    司马光的话，说对了一半。


    对的一半是，王安石变法确实是与民争利，确实比加税危害还大。


    错误的一半是，天地之财，也有可能既不在民，也不在官。在哪里呢？在虚荣中，在损耗中。


    如果把这部分财富挖掘出来，的确可以做到不加税还能增加财政收入，这就是所谓的“增量改革”。


    当然，王安石做的不是增量改革。


    倒是南宋的开国之君宋高宗赵构，很懂得增量改革。


    例如，北宋是不重视海贸的，关税极重。


    但到了南宋，赵构非常重视海贸。他降低了海贸的关税，保护海贸。'
