  md: '这听起来真是家庭仇、阶级恨，“黑化”情有可原。可是，小丑将私仇上升为公恨，进而滥杀无辜，这有什么可同情理解呢？


    # 三、为何善恶要分明


    早些年中国的新闻媒体报道犯罪事件，常深挖犯罪者身世背景。这些人大多有劳苦的出身，不幸的童年，常常被父亲殴打，被母亲抛弃，以至于变得冷酷无情。记者大概想探究犯罪的土壤，希望能给社会一些启发。


    但这一类报道往往饱含理解同情，引起读者愤怒：罪犯身世再凄惨，也改变不了罪恶本身。将他们写得那么可怜楚楚，是为他们洗白吗？有段时间微博上每逢出现类似报道，读者会去评论：我不关心他有什么故事！


    ![](img/ef1c5244d092b8b29b53a68870574480_767_0.png)


    而对显而易见的坏人，不要过度理解，不要试图同情。罪恶本身就是罪恶，不应当试图用其他情节掩饰，使人们产生同情理解之心。


    善恶的边界需要守护，否则，很多人会觉得：善恶互相交织，对错并不分明，美丑只是相对，世界一片混沌。


    在人类社会最需要守护的观念战场，不应当出现虚无主义。虚无主义否定人类存在的意义，否定对错是非的价值观。它觉得一切严肃东西都很可笑，人类社会制度非常荒诞，人与人之间勾心斗角尔虞我诈，没有什么真善美的东西。


    虚无主义是对世界的否定和绝望，自然也是犯罪的温床。'
