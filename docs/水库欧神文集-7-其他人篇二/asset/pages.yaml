  md: '# ## 如何毁掉清华美女 #W11


    ![](img/ef1c5244d092b8b29b53a68870574480_686_0.png)


    如何毁掉清华美女 #W11


    一


    以前我读书的时候，经常到清华大学的老乡那儿玩，清华的老乡也常常到我的学校玩。

    清华的老乡喜欢说：“你们学校美女真多。我们就惨了。清华自古无美女啊！”


    为什么？

    他说：“你想想看，美女受到的诱惑肯定多，谁能静下心来学习呢？不静下心来学习，能考得上清华？能学理工科？”那个时候的清华还没几个文科专业。

