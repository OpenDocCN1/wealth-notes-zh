  md: '![](img/ef1c5244d092b8b29b53a68870574480_782_0.png)


    但真实的阿连德是什么样？如果回到阿连德时代，智利将遇到什么？无需假想，历史早有演出。阿连德领导的政党“人民团结阵线”是拉美最激进的左翼政党——其上台形式温和，政策却非常暴烈。


    阿连德上台之后，就迫不及待地实行经济和社会改造。仅 1971 年就有上百万公顷土地被没收——有大型农场，也包括小地主和自耕农。在政府鼓励下，农民打着土改名义肆意侵占土地，地主被迫武装自卫，智利农村陷入混乱。


    智利三大铜矿公司原属美国公司所有，阿连德上台前，智利政府通过收购，已经拥有 51%的控股权。阿连德认为过于温和，于是强行收购全部外资——阿连德还提出，美国人赚得够多了，智利人民无需再付钱。此举无异于抢劫。


    和所有左派国家一样，阿连德也试图在这个山地穷国建立免费全民医保和教育体系。工资水平大幅提升，工人享有高福利，还可以随意罢工。仅仅第一年，工人薪水就上涨 50%。


    为维持高福利，阿连德政府需要印钞票。1971 年官方发布的通胀率是 22%，这显然低估了真实的通胀水平。物价管制无处不在，虽然名义物价不高，但什么也买不到。1973
    年，智利的名义通胀涨到 862%。


    稍有经济学常识的人都知道，阿连德施行的政策是灾难性的。1990 年代的南非、2000 年后的津巴布韦、2010 年后的委内瑞拉，他们都打着“人民的名义”施行这套经济政策。结果无一例外，全是经济崩溃。'
