    - 那么，什么是身份游戏呢？


    # 二、身份游戏与财富游戏


    +   - 身份游戏也叫地位游戏，就是你在一个社会等级中的排名。

    - 身份游戏非常古老，古老到人类还不存在的时候，就已经存在了。

    - 这种游戏的特点是，依据某种规则排名，然后根据排名分配利益。

    - 比如，谁排第一，谁排第二，谁排第三？

    - 排名越高，所得越多。


    有人上去，那总有一个人要下来，有一个赢家，总有一个输家。'
