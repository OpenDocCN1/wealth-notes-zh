- pgno: 927
  md: '他就拿这 1 万 4 千美元全部买了公司的股票。


    某一天，公司的 CEO 召集大家说，公司公开上市了，所有人都欢呼起来。

    查理有点不明所以，就问旁边的人，这个意味着什么？

    旁边的人说，you are rich.


    这家小型科技公司，就是谷歌公司，查理是谷歌的 52 号员工。

    查理原来投入的 1 万 4 千美金的，最后收获了 2600 万美元的回报。


    后来，查理就出来开了一个餐厅，完成自己的梦想。

    开业的时候，阵势很大，请的都是当地的精英人士过来品尝。

    这个餐厅后来在 2018 年倒闭了，因为成本大于收入。


    这就是谷歌行政总监的传奇故事。


    这些都是美国一部纪录片里面讲的真人真事，这样的稀奇古怪的暴富故事还有很多。

    比如继承遗产，中彩票了，炒垃圾股发财，发现了一把古董椅子等等。


    其中还有两个穷人情侣，穷得只能合租，约会的时候，唯一的娱乐就是花 8 美元到矿石公园挖土玩。

    结果，女的一铲子下去，挖到一颗 8.52 克拉的钻石。

    8.52 克拉的钻石是什么水平呢？

    刘嘉玲 12 克拉，章子怡 9.15 克拉，李嘉欣 8 克拉，李小璐 6 克拉。


    大概就是这种水平，但是裸钻价格就不会太高，大概 20 万美金。

    对于这对情侣来说，那也是暴富了。


    这一类的暴富，其实都有一个艰难的价值发现的过程。


    这些案例中，基本可以分为三个层次：

    大多数主人公得到的是 20-100 万美元这样的，那只能改善生活，问题不大。

    如果像谷歌厨师那样，得到的是 2600 万美元这样的，能维持住财富就不错了。

    如果说有人得到了一大笔财富，还能更进一步，非常少。


    比如说那个独立宣言的发现者，每天淘淘吉他，妻子开个小店，小富即安，这就很好。

    谷歌厨师想开个著名餐厅，就开不下去，9 年后以倒闭告终。

    他也许是一个好厨师，但不是一个好的经营者。


    据有人统计，70% 的大奖得主没有取得任何成就，通常在几年内就把奖金挥霍一空，44% 彩票大奖获得者会在短短 5 年内花光所有奖金。


    歌手、演员、球员等是重灾区。

    迈克尔·杰克逊去世时欠下 4 亿美元债务，传奇歌手惠特尼·休斯顿（WhitneyHouston）在 2012 年去世时欠下债 400 万美元。

    NBA 职业球员生涯结束后的 5 年里，5 个人当中有 3 个人会破产。'
