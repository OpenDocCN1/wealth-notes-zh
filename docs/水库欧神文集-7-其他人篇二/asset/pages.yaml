  md: '关于此事，我有一点不同的意见。


    我的意思是，我觉得，启蒙运动这东西，不太存在。


    就算在不管烂的时代，大多数人也没被真正启蒙。


    # 一）扮耳朵


    去年年初，水库推送过一篇《扮耳朵 #1650》。


    《扮耳朵 #1650》里描述了这么一群人：


    譬如说，你拉着他，连听十场“大空头”。


    杨红旭，郎咸平，大白的讲座。听着听着，他变得又愤填膺。


    挥舞手臂，铁杆死空。房价马上就要崩盘，腰斩膝斩跌到脚趾头。


    然后你，再把他拉回来。听十场“水库论坛”。


    他痴迷入迷，开口闭口“买买买”。一刀就半刀流。


    “构建以房贷为核心的资产包”“2N”“货到了就是赚到”。'
