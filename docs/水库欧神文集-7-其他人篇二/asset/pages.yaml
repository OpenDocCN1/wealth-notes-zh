  md: '郭威这个人，其实年轻的时候，就是一个“社会青年”，喜欢喝酒赌博。鲁提辖拳打镇关西的事情，其实就是以郭威为原型的。想想鲁提辖，就大概知道郭威年轻的时候是个什么样的人。


    当时，当兵的身上都有刺青，为了防止逃跑。郭威颈部也有，所以人称“郭雀儿”。郭威还用过这个来麻醉刘崇，说自己不想当皇帝，是真心想拥立刘赟的，自古岂有雕青天子？可见在当时的上策之中，社会地位之低。


    他并不是像朱温那种特别能打，然后打出了一片天下。他也不是像李克用那种，有一个自己的班底，然后占领了一个区域。虽然史上说，他父亲是一个刺史，但是早逝了。实际上，和李克用、刘知远相比，就是一个屌丝。他唯一的优势，就是对职场的明规则、潜规则、各方面的心理掌握的非常好。


    人们，都是喜欢看短期的。比如军队抢点钱什么的。但是郭威就通过这个，将其转变成了你帝的资本。军队还是那些军队，转了一圈回来，就变成他的军队了。真的太神奇了。


    人心是变化很快的，但是是一些利用当时的人心形成的既成事实却很难改变，有些事实有深远的影响，但是人们短期内往往想不到。


    如果是你遇到这种情况，这种微妙的差别你能想到，并且解决吗？


    如果按照郭威年轻时候的那种冲动做法，遇到这种事情，也可能当上皇帝，但是估计就不会有**出去再回来**这一招了。那么这种情况下，他和五代的其他皇帝就没什么不同。但是，这次他的选择很克制，得到的成果就很不同，而且当上皇帝之后，允许人民有私产，改革弊政，开启了终结五代的序幕。


    这样的见识很可能和一个女人有关。


    本来，郭威年轻的时候，身上的坏毛病不少，不治产业，整天瞎混，只看眼前。


    后来，他当兵后，在黄河渡口的旅店中，遇到一个等船过河的女人。这个女人，本来是后唐李存勖的嫔妃，李存勖在兵变中被杀后，遭散出宫。


    这个女人的父母本来觉得她这样的应该嫁给节度使，但是这个女人觉得郭威人不错，就非要嫁给他。这就是柴皇后，大族里出来，见过世面的女人。所以，应该是柴皇后给了郭威后来的转变，再加上常年混迹职场，修炼成了老狐狸。


