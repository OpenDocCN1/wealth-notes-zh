  md: '美国人看了电影，十分感动，但他们还是不同意取消 FDA。中美两国人民的思维，差不多。中国也有电影《我不是药神》。


    ![](img/ef1c5244d092b8b29b53a68870574480_742_0.png)


    《达拉斯买家俱部》男主角


    自己没生重病的时候，都觉得，没有青天大老爷 FDA，病患都会被被黑心的资本压榨、诱骗。黑心的资本难道会卖安全的真药给病患吗？他们眼里只有钱！


    待到自己成了病患，就知道，自己想获得尝试新药的机会，是多么难得。这世界，怎么不多一些资本开发新药呢？


    可惜得很，那个时候他们会发现，他们说的话，没生病的人不愿意听。


    美剧《波士顿法律》里，一个富翁患了绝症，花费巨资走后门，成为了一种新药的志愿试验者。而被挤掉试验资格的人，则起诉富翁，要求夺回当试验者的权利。他们都知道新药副
    用不明，但，有活命的机会，那点副作用算什么？


    是 FDA 管制了新药试验。如果没有 FDA 的管制，其实他们都可以当新药的试验者。假设这个 新药带来的存活的希望是 1%，那 FDA 就剥夺了无数病人 1%的希望。


    FDA 造的孽，可谓罄竹难书。


    经济学家弗里德曼在世时，就呼吁取消 FDA。


    但由于美国是很多人心目的“先进之邦”，FDA 失败的管制模式，反倒被很多国家当作先进做'
