- pgno: 944
  md: '比如说，你要开一家中介店，一定是先拉到单子，自己先做。

    等到单子比较多之后，足以支撑一家店面的固定成本，足够养活自己，再将店开起来。


    再比如说，你开一家面包店，那不能说你烤的面包好吃就够的。

    你就先拿个篮子，到社区先卖再说，等到买的人多了，回头客多了，再谈开店的事情。


    什么是资产？

    资产从生存的角度来说，就是能保证你能存活的时间。

    你能存活的时间越长，那么你的资产就越多。


    初始业务量，就是让你顶过最开始那段最艰难的时长的资产。

    一个中产，你又不是有风险投资在后面给你烧钱撑着。

    如果你初始业务量都没有，那连入场资格都没有。


    # 三、关键的是行业窍门


    生存的知识越多，技巧越多，那你活下来的概率就越大。

    比如说，你在野外，怎么找水？

    有很多种方法，比如你看到绿色植物，根系比较浅的，挖下去就有水。

    比如，有些哺乳动物离水源一般不会太远，你就跟着它们，就能找到水源。

    同样的，在城市中，生存技巧是很多的。

    中产经常只能想到的开店，就是因为生存技巧太贫乏了。

    其实城市的资源比野外资源要丰富得多。


    很多人对于自己的城市缺乏了解。

    这里重要的是政策、金融、资源，当然最重要的是人。


    先说政策。

    任何一项政策，都是一种利益分配的结果。

    比如说，以前上海有很多人有机会把曹杨的一居室老公房，贴几千块换成江桥的二居，很多人就舍不得那几千块，现在肠子都悔青了。

    上海出这个政策，不就是让本地人抓住时机快跑么？

    几年 996，都比不上这么一下子。


    金融，水库大量的篇幅都在讲金融，不赘述。


    再说资源。

    特川普说，关键是创造别人想要，但是却没有的东西。

    其实，这里是包括多维信息的。

    比如说，有人能找到那种别人能买到，但是却不是那种价格能买到的东西。'
  merge: -1
  img_proc: true
- pgno: 945
  md: '![](img/ef1c5244d092b8b29b53a68870574480_945_0.png)


    比如说，有人就是能找到那种很好吃的餐馆，比美团还厉害。这不是一种资源么？


    其实你要切入一个行业的话，**最重要的门槛，就是行业诀窍**。这里并不是说人、钱、物不重要。而是你没有掌握行业诀窍，所有的资源都无法整合，而且掉坑的几率很大。


    别人赚钱的业务，可能根本就不是你想象的那样。比如说，你以为别人是搞培训的，其实别人是通过培训获得大客户赚钱。比如说，你以为别人卖电脑给你，是靠CPU、主板赚钱，其实是机箱赚钱。'
