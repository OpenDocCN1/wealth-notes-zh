    # 二


    # 什么是漂亮？


    我曾经看到一篇公号文章说，统计上看，漂亮的人比不漂亮的人更健康。

    这篇文章也搞反因果了。实际上，是那些健康的特征让人感觉漂亮。

    例如，洁白的牙齿。

    因为白牙显得更健康、干净，所以，白牙对大多数人来说，意味着漂亮、性感。

    广告里，每一个明星都会露出一口白牙。

    明星刘涛说，她平时没法吃火锅，很难受。因为她为了美，做了一口烤瓷牙，据说花了300万。


    这一点，很难理解日本人。古代日本女人故意把牙齿涂黑，认为那是美。

    电影《罗生门》里，女主角涂得一口黑牙。看到那口黑牙，我对电影中两个男人争抢那个女人表示理解不能。

    其他的，例如健康的皮肤、匀称的身材等健康的特征，都代表着漂亮。


    ![](img/ef1c5244d092b8b29b53a68870574480_687_0.png)


    曹植《洛神赋》中说：“丹唇外朗，皓齿内鲜，明眸善睐，谣辅承权。”

