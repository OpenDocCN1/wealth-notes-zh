  md: '整个事情就是这样简单，和“性别歧视”毫无关系。大谈性别歧视的人，要么是不谙世事，蠢不可及；要么是心怀恶意，巴不得滴滴早日倒闭。


    滴滴不仅没做错，还要受到尊重：明知“差别对待”有争议，也要硬着头皮上，可见他们真的重视安全问题，容不得半点差错。非说哪里不妥，只能说他们低估了女权的汹涌，反智者的无耻。


    现在滴滴调整方案，男性夜间乘坐顺风车，也只限于 20 点以前。早先那些抗议者，展露得意：这才对嘛，本来就要男女平等…


