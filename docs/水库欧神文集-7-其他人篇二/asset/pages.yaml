- pgno: 756
  md: '![](img/ef1c5244d092b8b29b53a68870574480_756_0.png)


    妒忌心是一种可以理解的情绪。


    中国古人讲人的四大欲望，是酒色财气。其中的气，范围很广。包括任性使气，也包括荣誉心，还包括“我要过得比别人都好”。


    看到身边的朋友同事，发财升官，表面上恭贺，心底里一紧：“这家伙，真让人不舒服啊。”


    情绪是这样，但是如果从理智的角度来看，你周围的人过得好，你的机会也会变多，遇到危难也更容易得到帮助。虽然你在相对比较上落后了，但是你的绝对福利还是有增加。所以，应该为他人的发财高兴。


    ![](img/ef1c5244d092b8b29b53a68870574480_756_1.png)'
  merge: -1
