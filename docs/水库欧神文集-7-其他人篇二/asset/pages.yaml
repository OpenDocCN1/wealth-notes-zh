  md: '![](img/ef1c5244d092b8b29b53a68870574480_765_0.png)


    就是这样一个好人，处处受到侮辱和损害，他的“黑化”不值得同情或者赞扬吗？


    很可惜，这样的推导有很多问题。首先，亚瑟在生活中最大的痛苦，源于他职业梦想的失落。他的精神系统不正常，经常不可抑制地大笑。但他还想走上舞台，对着观众讲蹩脚的笑话。这当然不可能成功——至少在他治好病前。


    亚瑟不为所动，沉溺在梦想里，他的痛苦源于在追求本不属于他的东西。观众没义务迎合他的梦想，亚瑟徒然的努力和不断失败，只能使他觉得，世界辜负他的真诚。常年的自大（自命不凡，以为勤能补拙）和自卑（屡挫屡败，终年一事无成），只会积累仇恨。


    将个人梦想失落归结于资本主义的势利冷酷，显然毫无道理。资本主义从不承诺心想事成，相反它提醒人们要面对现实世界，自由选择，对自己负责。只有发挥特长，迎合消费者需求，才能创造财富，成就人生。


    而恰恰是左派仇视这套工作观念。左派不喜欢“服务他人”，他们认为这是人在现代社会的异化（老左派最钟情的词汇）。他们尊重梦想，鼓吹穷人也有“无限可能”，每个人应该做喜欢的事情。在市场经济中，结果可想而知，大多是孤芳自许，与世道格格不入。'
