  md: '完全不是什么邪恶斗倒正义。


    语文教材，却选用了大量的“公主病”内容。


    教学生，发牢骚的苏轼和缺心眼的韩愈，才是被陷害的忠良。你觉得对才是对，世界欺负你，那一定是世界的错。真是毒穿肠子。


    # 4）凛冬将至


    但如果只骂毒教育，这篇文章就落了俗套。


    虽然毒性剧烈，苏轼李白文采，也真的是华美动人。


    相较之下，王安石写的是“星河鹭起，画图难足”，意思是景色太美画图也画不出来。


    这句话相当于，公然在高考作文里写“太美无法描述，我词穷了”。


    这只能说明一件事：一流的文人，与一流的事业，很多时候，存在根本性的冲突。


    ![](img/ef1c5244d092b8b29b53a68870574480_519_0.png)


    韩愈是“文起八代之衰”的大家，世界观上却非常弱智，只会把自己比作千里马，大骂“我才高八斗，世界上不是没有千里马，是你们眼瞎了不认识我”。


    骑马打仗的岳飞便略胜一筹，懂得抛开情绪，对皇帝分析，良马之所以为良马，是因为良好'
