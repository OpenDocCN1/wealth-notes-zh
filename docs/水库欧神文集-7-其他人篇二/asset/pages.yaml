  md: '也是到江东发展，他担任会稽太守，“会稽山阴之兰亭”，今日的浙江绍兴。接下来，很不幸地，他遇上了怪力小霸王孙策。与华歆不同，王朗是硬扛了一波攻击，下场自然很惨。他被打得跑到了东治的海上，也就是今天的福州一带，又在海上继续被揍一顿，只好投降。只是孙策敬重他，没有杀他。但他却不肯为小霸王效力。后来王朗也被朝廷点名要人，由于战乱，道路不通，他从曲阿辗转走了将近一年才到任，相当于从江苏一点点爬到了河南。


    王朗是个通晓经籍的学问家，也有几分骨气。需要澄清的是，他是自己病死，并不是在阵前被诸葛亮丢丑骂死。当然，他也没有什么光辉的履历，一级一级升官上去，临走领个安慰奖，达成三公成就，也算功德圆满。


    ![](img/ef1c5244d092b8b29b53a68870574480_512_0.png)


    但是他最bug的一点，是他生了个儿子叫王肃。王肃又生了个女儿王元姬，王元姬嫁给司马昭，生下了司马炎和司马攸兄弟。这样一来，可是大大的了不得！王朗一下子就 从水货三公变成了真正外戚，当上了皇帝的曾外公。相传王朗曾言，“兴吾家者必此女也”，祖父看孙女，应该是准的。王家谱系，后来极尽荣华富贵。


    王元姬的弟弟，就是用熔糖和干饭擦浇馒头，与石崇斗富，被砸碎了珊瑚树 的 王恺。更重要的是，王肃因为是皇帝的外公，他对儒家六经的注解，被大力推广，成为了三国两晋南北朝时期的官方教材。盛极一时，“王学”盖过了昔年的“钟学”。


    从某种意义上讲，王朗才是最后的大赢家。他没有出卖良心，他没有跪着活过。最后却享晚辈之福，家族绵延，来了个身后名大翻盘。王朗不会写工务圆逆袭手册。他大概会做个朋友圈签名：“孩子不是手段，孩子就是目的。”


