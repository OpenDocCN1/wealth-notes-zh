- pgno: 773
  md: '本村弥生的丈夫本村洋在抗争的过程中，说过这么一段话：“在现今的刑事诉讼法中，就我所知道的范围之内，关于被害者家属权利的部分，什么都没有。不但没有权利这两个字，就连被害者家属可以做什么也完全没有提及。现状是这样的：国家独占了刑罰权，居于强势位置的国家裁决处于弱势地位的被告人，所以对于处于弱势地位的被告人，有着许多法规保障被告人的权利。可是在这样的体系之中，完全将受害者及其家属屏蔽在外。”


    这个案件、这段话的真实性，我没有考究。

    但是，“国家独占了刑罚权”确实是问题的关键。


    本来，被侵害者的权利复原是关键，执法机关应该遵照被侵害者或其权利继承人的意愿，来处分案子。

    但由于“国家独占了刑罚权”，个人的权利被不断收缴。


    例如在古代，皇帝为了体现自己的宽仁，有时候会大赦天下，这其实就是拿被害方的权利，做皇帝自己的人情。尤其是新皇登基的时候。

    当然，一般来说谋反不在被赦之列。

    拿别人的核心利益做人情是可以的，但不可拿自己的核心利益做人情。


    ![](img/ef1c5244d092b8b29b53a68870574480_773_0.png)


    # 四


    到了现代，白左横行。

    收缴来的个人权利，被他们用来满足自己的同情心。

    他们做得比皇帝还要过分。

    皇帝只是偶尔赦免，而白左干脆主张取消死刑。'
