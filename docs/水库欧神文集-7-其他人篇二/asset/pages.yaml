    # 三）互联网上的蚊子


    2000 年的左右的时候，其实对于身在其中的大部人来说，都会觉得和今天没有什么不同，也没有什么机会。


    那个时候，名校生要是进国企，起薪是多少呢？


    几百块。


    如果你进了 500 强外企，起薪是多少呢？


    2000 左右。


    只有 500 强中特别牛的外企才能开出 5000 左右的工资。


    那必须是名校 Top 5%，才能进去，这相当于古代的翰林院庶吉士。


    对于大多数人来说，房价和今天一样，依然是无法企及的。


    但是有这样一个群体，学历差、没钱、无背景，典型的三无人群。


    这样一群人，在那个时代，居然做出了一番事业。


    *有人 24 岁赚了几百万，28 岁就已经达到 A8 级别。*


    就算别人是 A8.1，名校生月薪 2000，需要不吃不喝 417 年才能赚到。


    这个逆袭群体，就是网站的草根站长们。


    恐怕大家对互联网领域有些误解。


    一提起来，就是高大上的乌镇饭局。


    其实在互联网领域，基本分为两个流派。


    一个流派是由资本投资后做大的。


    在各大媒体上，大家看到的基本都是资本流，中后期高举高打，*靠钱换流量*。


