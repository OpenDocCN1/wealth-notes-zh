  md: '# 没干坏事，也坐牢 #W12


    菁城子 水库论坛

    没干坏事，也坐牢 #W12


    ![](img/ef1c5244d092b8b29b53a68870574480_692_0.png)


    我们看过很多这样的城市新闻：一人从高楼底下经过，一个矿泉水瓶（或者别的什么东西）从天而降，直接把**人砸得头破血流，或是重伤，或是殒命**。高楼时代，类似的飞来横祸全国每年都有数百起。高空坠物已经是城市里仅次于交通肇事的第二大意外伤害源头。


    查找肇事者非常困难，于是有了一条很多人都知道的奇怪法律：高空抛物连坐法。


    侵权责任法第 78 条规定：从建筑物中抛掷物品或者从建筑物上坠落的物品造成他人损害，难以确定具体侵权人的，除能够证明自己不是侵权人的外，由可能加害的建筑物使用人给予补偿。


    换成大白话说：除非能证明不是自己扔的，否则所有可能伤人的楼上住户，都需要补偿。请注意，这里所说的说法不是赔偿，而是无责任的“补偿”。法律没有说你错了，但也得掏钱。


    我大学读法律时，老师谈到这个法条说，“高空抛物连坐法”属于大陆法系特有现象。大陆法系国家，集体主义观念较重。同住一栋高楼的邻居，是某种形式的共同体。一个人被这栋楼的住户加害，却查不出来，邻居理应承担道义上的责任。“高空抛物连坐法”的立法目的，是要使邻居们互相监督。无论法国还是德国的民法典，都有这样的规定。


    这种玄乎其玄的说法，听起来很有道理。然而到毕业之后，我才知道，我的民法老师真是信口开河。法国和德国的民法典都没有类似的规定。全世界有这法律的国家，数来数去，除了中国，只有南美国家智利。智利也属于大陆法系，但没有证据表明中国参考了智利的做法。'
