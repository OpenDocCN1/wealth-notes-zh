  md: '他们也会一错再错，使得他们自己的利益也受损，直到撞上南墙。


    从牟林翰和包丽的微信对话，可以看到，牟林翰并没有特别牛的手段。为了操控包丽，他也需要用到自杀来威胁，可谓浅而 low。很多事情他也绷不住。但可惜的是，包丽自己也缺乏独立思考的精神，才被那些明显的手段所操控。但牟林翰也撞上了南墙。


    ![](img/ef1c5244d092b8b29b53a68870574480_816_0.png)


    当然，有人说了，不要以为那么容易摆脱精神控制，你是不知道精神控制的可怕。如果你处在包丽的位置，你就一定比她做得好吗？


    这话说得有道理。我不是指责包丽。我只是说，为了自己的利益，应该努力多动一下脑子。


    ![](img/ef1c5244d092b8b29b53a68870574480_816_1.png)


    很多“双非”不愿意多动一下脑子，去理解经济逻辑。他们相信市场是有缺陷的，而坐在办公室里的官员却是没缺陷的。官员一定能准确地判断市场的缺陷，并弥补这些缺陷。他们相信一个个宏大叙事，在那些宏大叙事中，个体的权利被忽略。'
