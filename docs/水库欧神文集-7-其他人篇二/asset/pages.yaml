  md: '# 蚌病成珠 #X79


    原创：桃军师 水库论坛


    ![](img/ef1c5244d092b8b29b53a68870574480_411_0.png)


    # 蚌病成珠 #X79


    # 一）气愤难平


    《县城状元》#X78 发出来之后，遭受了很多很多很多很多的骂声。


    无非是桃军师狂妄自大，倨傲秀优越，以嘲讽县城状元为乐，人家优秀着呢。


    这般吃人血馒头，与咪蒙有何区别。


    老实说，文章已经写过二十八篇，评论区大概是什么状态，我也有思想准备。


    但是我毕竟不是一个可以对别人的看法无动于衷的人。


    睡了一觉还没有完全清醒，看着扑面而来的骂声，一时之间气愤难平，竟然有些词穷。


    我大致知道人们的情绪为何如此激动。'
