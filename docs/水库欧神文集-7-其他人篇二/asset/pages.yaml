  md: '及至接受了齐彬的使命，她便远离自己的父母亲友，渡过大海而去，嫁给了一个装疯卖傻，手无缚鸡之力的报废将军。


    虽然幸运地跟将军拥有了一段真正的爱情，很快却又又要经历丧夫之痛。而她原本可以嫁给健康的青梅竹马肝付尚五郎，在萨摩的父母身边做一辈子无忧无虑的公主。


    甚至她的父亲，也间接因她的离开而去世。病重之际，还请求夺走了自己女儿的齐彬，千万不要透露他的死讯，只为了让女儿安心向前。


    ![](img/ef1c5244d092b8b29b53a68870574480_438_0.png)


    笃姬对尚五郎忍痛说“萨摩的诸位就托付给您了”，立在船头发誓“这是我最后一次为了思念故乡而哭泣”，从此终其一生，再也没能回到生长的热土。


