  md: '"道家者流，盖出于史官"。


    按《汉书》的说法，道家学说中，凝聚着史官对历代王朝成败、存亡、祸福的记载与认识。


    而道教的核心教义，是“天地不仁，以万物为刍狗”。


    因为中国人相信，“天”会惩罚懒惰的黑人。在中国漫长的岁月里，文明和人口经历了数之不尽的竞争。每一季农稻，如果你不勤奋的话，你就没有收成。对于仅处于贫困线上的农民，哪怕仅仅是一季的歉收，便足以打垮你的积蓄。使得你的血脉线断种。


    中国人对于多元化是宽容的。任何人都有选择生活方式的自由。中国人懒得干涉别人。因为中国人知道“天”会管。有生就有死。“多元化”文化的背面，你有选择自己生活方式的自由。你必须承担你生活方式的后果。


    “天地不仁”，天地不会干涉人间正常的运作，你有选择任何生活方式的自由。


    但是“不干涉”是双重的，不干涉你的选择，那么也不会干涉结果。所有责任，必须自己承担。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '你选择打骂孩子，叫他杀鱼，或送她去读书，给她关爱温暖，那都是你自己的权利，自己的选择。


    但是时候一到，就必须<font color="#FF0000">种因得果</font>，收获甜蜜或苦涩的结局。


    所以不同于白左圣母心，我们要允许“末位淘汰制”。


    因为这个社会，本就客观存在着淘汰。如同多人赛跑，如果别人跑到你的前面，你就会落在别人的后面，你的绝对速度不变，相对的身位却落后了。


    所以一个经常被抱怨的话题是，中产很难维持住自己现有的阶层。事实也是如此，向上攀爬困难，但向下掉落的悬崖，永远是“我家大门常打开”。


    每个人都有返贫的风险，身后的“贫穷”，就像是张着血盆大口的老虎。人与人的区别，只在于与老虎的距离各不相问。


    所以你唯有跑得比身边人更快，才可以不被贫穷吃掉。


    作出什么选择，就必须承担什么代价。'
