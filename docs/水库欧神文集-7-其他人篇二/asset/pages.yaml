    # ## 掀桌杨超越，木匠李笑来 #X50


    人其实是一种很懒惰的动物。


    《炒楼业的忌讳》#192中有一条，就是不能休大假。这次因为特殊的原因，被强制休养了一个月。于是便不能复起。


    虽然空闲的时间多，可是懒洋洋地，爬不起来；暑假综合征啊，很多年没有这种感受了。


    因此小号的新更，逐渐变成了“枝弟们”的秀场。


    水库“内部资料馆”一些打磨中的文档。“桃军师”是另一个新人，大家看看水平如何。


    ------- yevon_ou


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……'
