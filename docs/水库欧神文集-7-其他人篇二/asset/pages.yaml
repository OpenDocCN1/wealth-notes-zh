    ![](img/ef1c5244d092b8b29b53a68870574480_629_2.png)


    中国人到日本旅游，一般都是准备了花钱的，不会计较价格，看到服务人员前后鞠躬，心情舒畅；自己也不用去分类垃圾，看到街头一片干净，心旷神怡。


