  md: '![](img/ef1c5244d092b8b29b53a68870574480_898_0.png)


    # 十世纪·九五〇年十一月 后汉帝刘承祐返回郭威


    听到郭成兵变的消息，开封这边已经有兖州的慕容彦超和老将侯益等人的军队聚集，其中慕容彦超和刘知远是同母异父，是刘家的人。


    老将侯益的想法就是在开封城等着，但是慕容彦超认为这个想法太懦弱，应该去澶州讨平郭成军。


    刘承祐认可了慕容彦超的想法，但是郭成军已经抢先进入了澶州。


    到了澶州，与王殷的军队合兵一处，这样郭成军就掌握了北方两个战区。


    等到郭成军达到滑州的时候，郭成听说开封已经聚集了不少军队，于是就再次说，不如奉皇帝的诏书，杀了自己。'
