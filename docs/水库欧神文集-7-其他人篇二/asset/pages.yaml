  img_proc: true
- pgno: 846
  md: '这也是多数人的常见反应。对什么事情，他们都以为加强管理就能缓解问题。


    我只能长叹：算法出了**问题**，靠管理是解决不了的。但**多数人完全不了解算法和管理的区别**。打个比方，假设有个城市，是BP 机生产强市，那当然会亏损。市长说：“企业亏损这么严重，我们要加强管理，提高效率，做好**BP机产业**。”


    可想而知地，管理越高效，亏损越多。


    ![](img/ef1c5244d092b8b29b53a68870574480_846_0.png)


    市场的算法下，手机必然淘汰BP 机。试图用管理去对抗算法，不会有**用**。


    唯有改变算法，让企业各自去根据市场和自己的比较优势调整方向，才能改变局面。


    在杀医案发生之前，一个视频流传甚广。视频中，带量采购的专家和药厂的人谈判，经过专家 5 次砍价，把价格从第一轮报价 5.62 元降到了 4.36 元。


    1月2日，国家卫健委印发通知，要求严查公立医院药品成本，适时进行价格管控。


    1月8日，浙江省医保局发文，定点零售药店销售集采平台药品，只能加价 15%，且最高只能加价 200 元。不过，病人自费的部分，可以超出限价。


    对这些政策，如果你问我支不支持，我当然支持。对于政策，我们都应该支持，对吧？


    但可以用经济学分析一下后果。


    不一定对。


    # 一


    # 为什么医保部门会出台这么多的管理政策？


    在民航总医院杀医案中，95 岁的老太太在急诊住了 20 天，无法转入住院部。一种流行的说法是，这是因为急诊和住院的医保报销水平不一样，而医院的医保报销额用完了，因此院方不肯让老太太转入住院部。


    有时候，有的病人想转入住院部而不可得，但不少的医院，却又出现了“挂床”的现象。


    所谓“挂床”，就是病人本来可以不住院的，也办理住院，因为住院的报销比例高。虽然办了住院，但却并不是真的在医院住，晚上仍然回自己家住。病床的费用，当然是医保报销。


    甚至有的人只是检查身体，也办理住院，只为能够报销检查费用。


    医院当然愿意配合病人“挂床”。在有的医院，正床占一半、“挂床”占一半，才能让医生的收入较高。


    无论是公立医院，还是民营医院，都存在“挂床”的现象。'
  merge: -1
  img_proc: true
- pgno: 847
  md: '![](img/ef1c5244d092b8b29b53a68870574480_847_0.png)


    医保局当然也知道“挂床”的存在。有的医保局严查“挂床”。听说在南方某市，医保局查出一张“挂床”，每天罚医院 500 元。


    可想而知的，除了“挂床”，还有无数的途径、手段，例如，小病大治，短病久养，等等，使得医保资金急速消耗。有的特权患者，甚至把医院当成了家，长久盘桓。


    很多人都知道，社保方面，老有所养越来越成疑，却还没有意识到，医保方面，老有所医也同样成疑了。


    面对医保金并不美妙的前景，医管部门自然要严格控费。诊疗费、药费，住院费，各个方面努力压缩。我不是说医管部门这么做不对，我怀疑的是，严格控制费用的结果，就会很美好吗？那可不一定。


    最可能的结果是，那些有关系的人继续浪费医疗资源、医保资金，而真正需要治疗的人，则面临医疗资源严重短缺的困境。


    例如，对药价的管制会造成药厂没有生产积极性，病人得不到急需的药品。包括带量采购，也会导致这样的情况出现。听说在上海的医院，一些药就买不到了。


    对于医生来说，赚钱没以前多了，干脆多休点假吧。医生的勤奋度下降，对病人来说自然不是好事。


    # 二


    市场和医保，是两种不同的算法。


    在市场的算法下，病人花的是自己口袋里的钱，当然就不可能用自己的钱去“挂床”，也不可能小病大治、短病久养。


    完全不需要任何人去监督、检查。


    而医保的算法是大锅饭算法，人们要从自己的工资里交医保金，使得这笔钱变成“大家的钱”；而到了看病的时候，由于花的是“大家的钱”，那当然是尽可能多花。


    于是，人们还得花钱额外设立医保金的管理部门，来管理医保资金，监督、检查医院，压缩费用。不知道这是何苦。'
