- pgno: 883
  md: '后来，陆步轩就出来，担任副董事长，据有人称，他已经身家过亿。他对此否认，谦虚的说：只是实现了简单的财务自由。


    陈生和他合作，有些人是说看中了陆步轩的名气，这个其实有些片面。陈生的企业开始做大的时候，也认识到刀手的重要性，从各超市挖了大量刀手，但是挖的多了也会引起别人的强烈的不满。陆步轩最重要的作用，其实是开办屠夫学校，编写教材，培养刀手，慕名而来的有
    70%都是大学生。


    试想，陆先生只需要将陈生这边的档口从每天卖 1.2 头猪，提升到每天卖 6-8 头，这都是巨大的进步。


    这方面他的确有优势，是写书的里面卖猪肉卖最好的，是卖猪肉里面写书写的最好的。这一次，他解开了心结，用他自己的话说，是“不以为耻，反以为荣”了。现在他很自信的说，在这一行，在全国他都是顶尖的，恢复了北大才子的那股心气。当他带了很多徒弟之后，徒弟们给他拍抖音上，一扒折扇论猪肉江湖，颇有宗师气度。


    ![](img/ef1c5244d092b8b29b53a68870574480_883_0.png)


    # 三、人生排位赛


    陆先生最开始的选择，其实也是很多 PSD 的选择。所谓 PSD, 即 poor:出生贫寒，smart:聪明能干，desire:渴望致富，Deep Desire
    to Get Rich。


    PSD 们虽然聪明能干，但是他们的亲戚朋友同学基本上都是同级别的，这样的生活环境，让他们极度缺乏视野，并不知道什么样的选择才是好的选择。什么叫缺乏视野？就是别的都看不见，只能看见那个最大最闪光的物体。


    一个人越是贫穷，就越是想追求所谓的稳定和面子，就这喜欢去大机构。'
  merge: -1
  img_proc: true
- pgno: 884
  md: '他们这样选择，一个方面是以为这样就能发财。

    另外一个方面就是想告诉大家，我在大机构供职，我出人头地了！


    PSD 也是很多大机构的招聘标准，因为只要给 PSD 们一个光鲜体面的身份，适当的薪水，这样的人干起活来不要命，可以忍受非人的工作条件。

    最开始的时候，钱给的其实不是很多，因为这帮家伙，以前也从来没见过钱啊。


    一个诱惑的声音响起来，少年们，这有稳定的薪水，良好的保障，还有尊严和面子。


    这条路通往何方呢？

    在云南，有一种养蛊的传说。

    就是将一群毒蛇放到容器中，不给吃的，让毒虫互相厮杀，毒性大的吃掉毒性小的，最后胜出的一只，就是所谓的“蛊”。


    这条路，就类似养蛊。

    生产者和生产者竞争，消费者和消费者竞争，生产者永远不与消费者竞争。

    老板和老板竞争，员工和员工竞争，老板永远不与员工竞争。

    既然大家都是一群聪明能干的人，这种竞争就尤其残酷。

    何况，有些大机构，有些人有关系和背景，这些聪明能干的人就更难出头了。


    一般来说，模式是这样的。

    在起步阶段会拿的非常少，后面薪水也在增长，有人能拿到比较高的收入，但是拿到这个收入的时间其实非常短。

    等到年纪大了，这份收入极有可能失去，或者进入常年不涨薪水的平台期。


    所以，归根结底，这是一条中产之路。

    为什么呢？

    因为这是一个完完全全的存量市场。


    陆先生在体制内失败的原因之一，就是没有编制的，他说他到现在也没搞清楚所谓指标和编制是什么东西？

    指标和编制，就是一个坑位啊。


    只有在有人让出一个坑位的情况下，才能给年轻人一个坑位。

    这是一场人生的排位赛，最终虽然也有胜出的，但是这是极少数，99%的人都是相对失败，混个中产，但是付出了极大的时间成本。


    这条路走下去，<span style=''color:red''>大多数人永远也不会获得生产资料，资本，也不会有自己的作品。</span>


    这是一个巨坑，只有极少数人能避开这个巨坑。

    因为这件事情说起来容易，做起来确是极为痛苦的，事关选择。

    选择就是不容易的。

    就像《长安十二时辰》中李泌给高力士写的一封信中说的那样，如果什么都很容易，那还叫什么选择？'
