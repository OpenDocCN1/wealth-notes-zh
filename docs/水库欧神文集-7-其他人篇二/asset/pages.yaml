  md: '![](img/ef1c5244d092b8b29b53a68870574480_193_0.png)


    但是在我们看来，“劣质父母”就是一个客观、准确的形容。


    父母如果不能提供资源助力，或因病痛等因素拖后腿，乃至无限制地向子女吸血，那么相比其他能托子女一把的父母而言，当然是“劣质的”。


    比如杀鱼弟的父母，无疑就是“劣质父母”，虽然他们很爱自己的孩子。#X59 《贫穷的逆流》中，王心仪的父母，在培养孩子上，可谓用心，但在经济条件下，相比于大多数人而言，当然也是劣质的。'
