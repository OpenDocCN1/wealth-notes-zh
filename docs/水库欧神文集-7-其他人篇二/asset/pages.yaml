  md: '贴吧讽刺耳机发烧友的段子，火电低音下潜好，水电高音清脆，应该拿来给这位神爷试试法想，盲测下，看看一样的三文鱼和大米，让我奶奶捏和他亲儿子捏，他能不能尝出来区别。他儿子更好笑，采访问他为啥女当不了寿司师傅呢，答曰因为女的来月经口味不稳定，从而会影响寿司口味。我可去你妈的吧，一家子传承最好的是表演技巧。真匠人没有他们父子这么能逼逼理论的。


