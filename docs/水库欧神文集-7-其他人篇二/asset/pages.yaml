- pgno: 925
  md: '迈克非常喜欢吉他，研究的也非常深入。\n但是因为没有钱，他就逛二手店和旧货市场淘吉他，经常一逛一个小时也不觉得累。\n最开始，迈克只是淘吉他，后来就发展到什么旧货都看看，主要是银器。\n如果能发现美国殖民时期穷人使用的银器，就能小赚一笔。


    这个爱好，他保持了30年，成为了旧货方面的专家。


    一天，他在逛二手店的时候，发现了一张羊皮纸，觉得印的很精美。\n于是，他就问这张羊皮纸多少钱？\n店员告诉他，2.48美元。


    ![](img/ef1c5244d092b8b29b53a68870574480_925_0.png)


    回来之后，迈克和妻子一起研究，但是资料非常少。\n经过艰难的研究，发现这张羊皮纸是美国的早期的《独立宣言》某种版本。\n这个明显并不是原版的《独立宣言》，而是一个叫威廉.斯通的人奉约翰.亚当斯（美国的国父之一）之命印的，一共只有200份，叫“斯通宣言”。


    如果证明这份宣言是真品的话，那么可能是极为罕见的文物。


    于是迈克到处找专家鉴定，由于他是小人物，屡次被人拒绝。\n迈克没有气馁，没日没夜的研究，并且不停的找人，终于找到了一个拍卖商。\n这个拍卖商给他引荐了一个文物中心的专家。\n专家仔细鉴定后，认为是“斯通宣言”的原件。


    拍卖商将这个原件拍卖后，卖出的价格是47万4千美金。


    迈克原本认为能卖10万美金就不错了，得到这个消息后，简直难以置信，和妻子像疯了一样，相拥而泣。\n其实普通美国人很穷的，别说接近50万美元，就是5万美元的意外之财，都得激动的哭出


