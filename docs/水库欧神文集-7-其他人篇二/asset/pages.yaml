  md: '父母月收入加起来七千块钱，是很常见的事情。农民家庭还会更少。


    于是，都不用等到工作买房，在大商场第一次看到 1899 元的新款球鞋，那就是大多数状元第一次崩溃的时刻。


    # 我一个月生活费，买不了一双鞋


    第二次崩溃的时刻，则是隔几天发现这双鞋穿在了室友的脚上……


    更令人难受的，是他们任何在一座城市，都找不到归属感。


    《飞驰人生》里出现了许多上海符号，沈腾炒饭摊望得见外滩自不必说，他第一次发车在天马 1246 号。


    没记错的话，韩寒初次比赛，就是在上海大众 333 车队开一辆 polo。


    上海本地人，应该可以看得到更多。


    韩寒对上海熟稔不说，他自己也是亭林人。


    那首“生是你的老百姓，死是你的小精灵”，是从《他的国》里的亭林镇镇歌移花接木过来的。


    虽然是郊区，那也是上海的郊区嘛。


    本来就距离不远，所以完全没有自贡人郭敬明的仰望情绪。


