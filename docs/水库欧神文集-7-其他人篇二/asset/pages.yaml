  md: '**对于医疗市场化，人们在想象中构建了很多“恶果”，**例如医院唯利是图乱收费，对病人毫不关心；药厂盲目定高价，并且质量不过关，等等。但那些“恶果”从来没有被现实所证实。有个例，但从来不是体系性的问题。


    现实总是证实，医疗市场化带来的结果总是更好。


    例如，印度的医疗相对比较低市场化，现在全球人都跑去印度看病，包括中国人，这不仅仅是因为印度对医药的知识产权保护比较松。像种牙，不幸涉及到仿真药的问题，印度也比中国便宜得多。


    中国种一颗牙需要好几万人民币，而印度只要 8000 元左右人民币。


    并且，印度不仅吸引高收入者，更是全球低收入者看病的天堂。谁说医疗市场化不利于穷人？


    ![](img/ef1c5244d092b8b29b53a68870574480_851_0.png)


    之前的文章我就说过，中国的医疗体系，有不少地方优于国外的医疗体系，**那恰恰是因为相对市场化的因素带来的**。例如，公立医院的科室可以追求自己的经济利益，而且对医生资质的管制也没有西方那么严格。


    尽管现实一再证实市场的算法也适用于医疗领域，但人们仍然抗拒医疗市场化。


    即便医患关系越来越紧张，但如果向人们建议：“要不，试试医疗市场化？”医生、病人，会齐声说：“**不行不行！** ”


    **想象中的“恶果”在吓唬着他们。**


    人们会一直徒劳地用管理来克服算法的缺陷，就像西西弗斯推着他的石头。


    上面的分析，不一定对。


    因为，曾经有一次，我和一个朋友聊天。


    那个朋友告诉我，我太死心眼儿了。


    “你老讲经济规律，但如果我们不认经济规律，那它还能有什么用？”


    是的，也许经济规律会改变呢？


    （邓新华，2020 年 1 月 10 日晚）'
