- pgno: 573
  md: '甚至讲课的老师不备课，可以不按教材讲，只因为他是副校长。遇到个别素质差的，怀孕了，喝酒了，和某个淘气包生气了，这节课直接就“不上了”。


    意思是，这节课原有的教学进度不进行。学生只能自己看书，老师挺着骄傲的肚子，就坐在门口通风处，斜眼睛瞪着学生。


    > “我看谁着急，谁吃亏”


    台下但凡对于高考重要性有点意识的学生，全部急火攻心，要晕倒过去的。


