    韩非子还在那里，洋洋得意写什么“季孙非鲁君也，以人臣之资，蚤禁于未形”，以为黑到了孔子。实际上，他连自己的智商也暴露了。


    这群人醉心于斗争，却没一个想过，分饭给百姓吃，原是一件好事。


    把一件好事，跟斗争扯上关系，本来就是大多数人最痛恨的蠢虫做法。


