  md: '听不懂，就一脸呆滞状看着老师。今天这节课心情好了，写写笔记，明天心情不好了，就抄别人的。

    遇到上进心强一点，但天资实在欠奉的，就每晚写题到半夜，笔记做了厚厚一叠，什么概念都背得下来，可是做题就是做不对。


    但在消费上，却又完全不落后。


    初中女孩子，过年压岁钱收了 4 千元，才两个月，在正常零花钱不减少的情况下，就全部花完。


    家里都是种地，年收入以万元计的农民，小孩子一个月的学费生活费，以县城生活水平，也要一两千元。吃零食买化妆品，毫不俭省。


    高中毕业，就去微整，全切双眼皮，玻尿酸捏鼻梁。

    大学考个三本，四年时间都用来吃麻辣烫和打王者荣耀，以及为微博“我的前任是奇葩”贡献热点素材。

    毕业了回乡。反正县城小，很多人都是互为同学。托老同学花二十万，打点孩子进银行，就算了却一件心头大事。等到结婚生子，一家人倒也其乐融融，一点不觉得这样的生活有什么不好。


    ![](img/ef1c5244d092b8b29b53a68870574480_574_0.png)


    有时候你想不出来，人为什么可以对自己的命运，表现得如此“漠不关心，随遇而安”。已经身处弱势，却对自己的弱势毫不知觉。


