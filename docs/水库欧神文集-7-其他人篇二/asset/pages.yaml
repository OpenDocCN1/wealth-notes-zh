  md: '**50 年都是新党（王安石——章惇——蔡京）掌握权力。**


    **所以，看时间线，是谁葬送了北宋，是一件非常明显的事。**


    # 二


    一种流行的说法是，王安石变法的设计是非常好的，但是下面的官员执行中走了样，才损害了老百姓的利益。


    这种说法是完全错误的。


    王安石变法的设计，仅有小部分可取之处，整体上非常糟糕，幸好下面的官员执行中走了样，要不然是害更大。


    旧党只是因循，而新党则是**控制狂魔**。王安石变法的整体设计，就是控制、干预、与民争利。什么生意，新党都想控制在官府手里。


    有一个段子说，有人向王安石献"奇计"，说抽梁山泊的水，可得耕田 800 里。


    好大喜功的王安石大喜，但也发愁一个问题：梁山泊的水抽到哪里去？


    史学家刘资父在旁边说：好解决。再在旁边挖个 800 里的泊装这些水就可以了。


    王安石尴尬一笑。


    今天的人读到这个段子，大概马上就能想到凯恩斯主义吧？


    北宋人的多个文集里记述了这个段子。此事不知是否为真，但这个段子很好地揭示了王安石思维中的*严重缺陷：他无法把事情的正反两方面综合起来思考*。王安石一辈子，都没有意识到自己的思维缺陷。


    例如，"新法"中的青苗法，是官府放贷。王安石以为，这能缓解老百姓的资金困境。


    他没有想一下，官府放贷的钱从哪里来？还不是向老百姓征税而来。把老百姓的钱收上来给老百姓放贷，和挖一个新的泊来装梁山泊的水有什么区别呢？与其如此，不如减税、放开民间金融，老百姓的资金困难自然会缓解。


    并且，官府增加了放贷事务，必然要增加人手，"冗官"问题只会加重。


    再加上，新党变法的目的是增加财政收入，在新法 KPI 考核下，地方官员只能强行向老百姓摊派高息贷款，这并不是地方官故意执行走样，而是上面强加的。'
