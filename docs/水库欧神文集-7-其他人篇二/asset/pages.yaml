- pgno: 706
  md: '这里诞生。巴尔的摩还是黑人平权运动最兴盛的地区。**1960 年代**，大量美国黑人在经济利益和政治优待双重吸引下，进入巴尔的摩，当地白人中产阶级撤离，巴尔的摩的人口结构就此改变。


    马里兰州是“深蓝”州，巴尔的摩则是民主党的“铁盘”。**1947 年起到 2015 年，这 68 年之间，民主党在巴尔的摩一共执政 64 年**。市长到议会成员再到校监，这个城市的领导者几乎全是黑人民主党。在美国，只要是民主党执政地区，政客们就会出台迎合底层，仇富扶贫的政策。这些政策足以把任何繁荣城市毁掉。巴尔的摩的历史也证明了这一点。


    **2015 年**，位于巴尔的摩市的约翰霍普金斯大学，两位经济学教授在《华尔街日报》发表文章称：“**1950 年至 1985 年间，巴尔的摩官员将财产税增加了
    21 倍**，此举引导相关好处落到获利的选举集团手中，而造成很多拥有房产的人士和企业家逃离，这些人绝大多数是共和党人。考虑到民主党人现在享受着八比一的选民登记优势，这是高明的政治手腕。”另有一项统计数据表明，巴尔的摩常年居于“美国税收最高的城市前十名”行列。


    高税收的同时是高福利。当地超过三分之一居民在领取食物券，超六成居民从政府手里领取不同形式的经济补贴。超过 **85%** 的儿童享受免费早餐和午餐。当地政府还为购房者提供
    1 万美元奖励和 5 年贷款优惠。


    在福利主义腐蚀下，巴尔的摩的黑人家庭几乎解体，当地非婚生率高达 **72%**，单亲家庭占六成以上。大量儿童不知道父亲是谁，低效的公立教育也只能看管一时，根本谈不上教育。这些人一到青少年阶段，就会成为城市罪犯的主力。


    巴尔的摩所在的马里兰州同样在出台坏政策，这些政策对摧毁城市具有公认的威力。最典型的例子是房租管制。


    房租管制降低了房主收益率，这迫使他们抛弃房产或放弃出租；即便出租，他们也缺乏改善房屋质量的意愿——因为房租收入太低，可能都不抵维修成本。租客住在破旧的房屋，更加不会珍惜。


    房租被管制，建新房的动力被抑制。城市住宅**不翻新新建**，社区就会破败，向往美好生活的人们就会搬离。一旦逃离开始，城市衰落就会加速。战后美国许多城市都实行房租管制，后来陆续取消。巴尔的摩则是房租管制最长的城市之一，**直到
    2018 年才废除**。


    马里兰州是**全美国最低工资水平最高**的州之一。就在不久之前，民主党占多数的马里兰州议会提出一项动议，马里兰州最低时薪将从现在的 10.1 美元，每年上涨近
    1 美元，到 2025 年达到 15 美元。一开始共和党州长否决了这一动议。州长认为，如此大幅上涨最低工资，小企业将会流失到邻近的弗吉尼亚州，因为当地最低时薪是
    7.5 美元。


    想不到，州议会以多数票推翻州长的否决。可以想见的是，未来几年马里兰州将迎来一批小企业的清洗。巴尔的摩市的收入水平只相当于马里兰州平均水平的六成，它将是最低工资制度的最大受害著。


    高税收、高福利、严管制，这些经济政策的后果可想而知。这个城市的人口数量从上世纪 60 年代的接近百万，到今天只剩 **60 余万**。话说回来，巴尔的摩的经济似乎一直没有崩坏，马里兰州的经济和财政状况，也还过得去。这又是为什么？很重要的原因是，马里兰州和巴尔的摩占了距离首都很近的便宜。'
