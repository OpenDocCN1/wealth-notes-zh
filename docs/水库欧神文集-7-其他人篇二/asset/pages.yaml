  md: '其实，大部分做咨询行业或者自媒体，最大的客户群，是玩“冒险模式”或“普通模式”的。

    说白了，就是“泥寇模式”。

    这里不存在贬义，而是一个历史阶段。


    没有几个人是想建立什么战略根据地的。

    这样，只要说说哪里可能涨，如何买房子就行了。


    因为没有需求。

    所以，没有人会手把手教你建立一个无尽阵。


    因为，真正要做到无尽模式，首先是自己的认知能上去，还要不停的更新。

    一年跟不上，可能就破阵了。


    这就要求就太高了。


    # 五、结语


    +   - 人类很早就发现了煤炭、石油，但是并不知道怎么用。

    - 当人类的认知进步后，才发现煤炭、石油的妙用。

