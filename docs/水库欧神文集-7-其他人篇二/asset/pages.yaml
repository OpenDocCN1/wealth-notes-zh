    ![](img/ef1c5244d092b8b29b53a68870574480_654_0.png)


    # 小学生当道 #W06


    yevon_ou: 我觉得谬误政策滥行的原因，呢，绝大多数读者，根本就不关心经济学。


    一


    前不久在地铁上，看到一个八九岁的小孩问：


    “妈妈，你希望所有人都有钱，还是希望有些人有钱，有些人没有钱？”


    他妈妈回答：“我当然希望所有人都有钱。”


    这个小孩说：“我希望有些人有钱，有些人没有钱。”


    我对他们的对话产生了兴趣，就问他：“你为什么希望有些人有钱，有些人没有钱？”


    这个孩子回答：“种田很辛苦。如果大家都钱，大家都用钱买米吃，就没人种田了，那大家都没有米吃了。”


    给你三分钟，你能否向这个小孩解释清楚，他的担心是没必要的？


    反正我当时快到站了，只有大约 3 分钟时间。


    我向小孩这样解释：


    “如果大家都有了钱，那么农民的米就能卖得贵一点，农民就能赚到更多钱。”


    “同时，大家都有了钱，大家也可以生产农具、化肥卖给农民，农民也买得起，这样，农民种田就更轻松了，而且还能生产更多粮食。”


    “所以，如果大家都有了钱，那么就只需要少数人当农民就可以了。你想，农民可以更轻松地赚更多钱，那就不用担心没人愿意当农民了，对吧？”'
  merge: -1
