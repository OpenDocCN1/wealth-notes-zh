    但是人活着不是服务于礼珠与规则。恰恰相反，真正正确的认知，是要懂得令礼法和规则，能为自己服务，成为自己的利刃。


    孔子死后成了万世师表，活着时却一生累累苦丧家之犬。


    BOSS 不肯用其人，而将他供在庙堂之上用他的法，就是因为，孔子构建了极其精巧有序的世界架构，却要求老板成为其中的一部分，为了他心中的理想而鞠躬尽瘁。


    孔子见到八佾舞于庭，要怒骂“是可忍孰不可忍”。哪一位 BOSS 会喜欢这样的人呢？


    这样的人，只能弃其人而用其法。


    老板真正需要的，是一位鸿儒，走出来悠悠说道：“虽然季氏是正卿，不可以用八佾。”


    “但是根据左传札记，上古典籍。当 BOSS 定信我们季氏，我们是一定要用八佾的。不然不足以彰显 BOSS 的排场与厚爱，那是丢了 BOSS 的脸面。”


    要有运用规则来解决问题的能力。


    规则这条绳索，是人搓出来的。聪明人拿去捆人，庸人则拿来把自己捆成猪蹄。


    所以，当下午看见堂哥的话，我笑倒在沙发上面。'
