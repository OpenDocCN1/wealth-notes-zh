    ![](img/ef1c5244d092b8b29b53a68870574480_785_0.png)


    也有人说，“新自由主义”太过分，学校和医院全私有化，让穷人怎么活？事实上，智利的医疗和教育水平在拉美属于前列。智利有数量众多的私立大学，公立大学从 1981
    年起开始收费——这让学生群体怨念丛生。拉美排名前十的著名大学，智利有三所大学上榜，这显示出智利的大学质量。智利医疗价格比邻国昂贵，质量也更高——智利的人均预期寿命达到
    80 岁，在拉美仅次于哥斯达黎加。


    私有化程度高，让很多人感觉不爽——凭什么读书看病要花钱？而观念健全的人会认识到，免费的公共服务也需要代价：私有化之下的服务质量要好得多。将社会矛盾引向市场化或私有化，是思想的懒惰。这不是正确的分析，而是宣传术。


    当然，我不是说智利经济没问题。智利作为后发国家，有很多要解决的问题，这很正常：智利在部分领域的私有化，确实有问题，但也不像很多人说的那样简单。比如说，智利经济的最大问题是养老金体系。


    当年皮诺切特没有取消养老金体系，而是设计出“智利模式”：企业不缴纳养老金，个人收入的 10% 强制缴纳进养老金账户。这些钱全部存进一个私人养老基金，由其投资运营，政府立法监督。


    “智利模式”的首要问题是：政府强制储蓄，让很多人产生“依赖政府养老”的心理。智利政府收取养老金时长和其他国家差不多，金额却少得多（企业不缴纳），居民想靠政府安心养老，其实做不到；为防止居民养老金损失，政府搞了一个大型养老基金，名为私人，其实是独家经营权，与国有差不多。没有竞争，投资运营自然缺乏动力，亏损很正常。


    其他国家的养老金模式，都是现收现付（即当代年轻人缴纳的养老金，直接给当代的老人；等年轻人老人，让下一代人养老）。这种养老金模式之下，即便入不敷出，也相当隐蔽；“智利模式”就实惠了，一个人缴了多少养老金，最后能取出多少来，一清二楚。


    嘲笑智利的养老问题，首先要弄明白：它的养老体系不是真正的私有化，只是披着私有化之名的国有化。它的问题很严重，但并不比其他国家更严重。智利的养老体系很透明，即便哪一天破产，清算起来要简单'
