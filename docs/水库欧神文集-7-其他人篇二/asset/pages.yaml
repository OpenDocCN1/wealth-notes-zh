    IT 部赚得盆满钵满，大老板气得咬牙切齿。


    有一天大老板对 IT 总监说：“如果我想懂 IT，第一个把你炒掉。”


    IT 总监呢，却满不在乎。


    > > “就是因为你不懂 IT，所以每次我递账单，你只能买单。”


    皇帝批奏折，见臣下奏报，时惟初春令月，气淑风和。


    当地士绅纷纷 “雪沫乳花浮午盏，蓼茸蒿笋试春盘”，以食用春盘野菜为风雅之事，一派融融盛世景象。


    龙心大悦，皇帝也想尝尝鲜。遂着御膳房速办。


