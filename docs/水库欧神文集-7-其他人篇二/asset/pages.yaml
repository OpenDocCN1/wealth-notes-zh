  md: '# 一） 心理创伤


    承蒙抬爱，我被拉到水库知识星球里来了。


    其实我来的时间晚，理应低调谦虚一点，但现在不知不觉，说话变得不够客气。


    也知道不对，但对人的感觉真的很爽。一个悲哀的事实是，就像越垃圾的食品越好吃，不对的事情通常都让人觉得很爽。


    我对我的人性感到绝望=。=


    前几天，有一位圈友向 OD 请教育儿经。OD 说该打的时候要打，让小孩子知道“边界”。


    但有一位圈友回复说：“打的方法，不是科学育儿。”


    网上查了下，打孩子的危害，数不胜数。


    打会让孩子安全感缺失，造成心理创伤，性格懦弱，人格缺失。


    乃至于，很多父母的打，不分青红皂白，导致逆反情绪。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '但这就对了。


    打的目的，就是要让你某种程度上，“安全感缺失，性格懦弱，产生心理创伤”。


    如果打完之后跟没事一样，就说明没打到位。


    被毫无来由、无法战胜的暴力所击溃，乃是你在这个世界上学会的第一重要之课。


    # 二）讲道理


    小孩子越大越不好管，因为他逐渐学会“讲道理”。


    你跟他说“这样做不对的”


    他可以反驳你十条，“边沁说这样 可以，哈耶克觉得那样 OK，孟德斯鸠驳斥过这个理论了”


    所以，“你说的规则不合理，以上全错”


    这种情况下，一般的结果，并不是对面认真听讲，心悦诚服。


    而是老父亲手持皮带，迎面而来，“叫你再顶嘴！”'
