  md: '你爬去 liba，爬去 x 帆，无数虎妈发出了叽里咕噜的声音。

    她们一边热烈地交换鸡娃的人生经验，一边小心翼翼地注意着自己的言辞。

    争取既能够最大限度上炫耀自己的牛娃，又不至于露出太多的精华，让人家如法炮制，变成自己的竞争对手。


    看她们此举，就能想到当年上学时，女同学通宵刷题之后说“我昨天一直在看电视”的样子。

    过了二十年，撒谎的口气还是毫无长进。


    一片寂静的水面下，暗流涌动，人人顶着黑眼圈强聊电视剧女主角。

    但一旦有石子投进湖中，涟漪就会扩散出巨大的形状。


    比如昨天，网上出现了一份“5 岁小朋友逆袭简历”。


    # 独特的性格：灵动自信，好奇敢拼，耐挫坚强，友善贴心


    ![](img/ef1c5244d092b8b29b53a68870574480_326_0.png)


