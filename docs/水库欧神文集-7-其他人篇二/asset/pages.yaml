- pgno: 744
  md: '如果市场化的因素更多，中国的病患将会花费更少的钱，却能享受到更好的医疗服务。


    北大李玲之类的"专家"，完全不懂真实世界。她们说，病人和医生信息不对称，所以病人一定会被骗钱。


    对这种没逻辑的话，不要信。


    医院和医院之间有竞争。病患被甲医院骗了，会被乙医院指出来。乙医院降低收费、做好服务，就会把病患抢过来，让甲医院破产。


    并且，人们还可以买医疗保险。保险公司可不会被医院骗。


    市场没有李玲那么糊涂。它有无数种办法解决信息不对称的问题。


    如果你觉得某种服务太重要了，那么，市场一定优先满足你的这一需求，并且是以最低的价格满足你的需求。


    市场不完美，但不失灵。


    不完美在于，某些个体确实可能被骗、受害。


    不失灵在于，市场已经让受害者最少。


    干预才失灵。


    FDA 表面上的确帮助了少数人（例如帮助部分人避免了副作用），但代价却是让更多人受损。


    真实世界里，不能追求完美，只能追求不失灵。当人们追求完美，那必然迎来干预的失灵。


    李玲之类，纯属书生谬见。


    其实大部分中国人谴责洪洞县的那个家伙，已经说明，人们潜意识里还是不敢完全放弃市场。


    只不过，他们仅仅停留在潜意识的阶段，没有系统地思考。


    如果他们能够多想一下真实世界的逻辑，他们也会同意：越是重要的东西，越应该交给市场。


    （邓新华，2019 年 10 月 14 日）'
