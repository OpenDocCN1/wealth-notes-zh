  md: "不知道现在的历史课本是怎么评价王安石变法的。但从网络上看，不少人跟我那时候一样，认为北宋灭亡是因为没有坚持王安石变法。\n\n 有很多认为，王安石思想观念太超前，不为时代所理解。他们认为，王安石的一些做法，很接近“现代金融理念”。经常看到有人说：**如果王安石的主张得到推行，那么宋朝必然辉煌而绚烂。**\n\
    \n几年前流行的穿越小说《新宋》，讲的就是一个现代人穿越到北宋王安石时代，借助超越时代的知识，比王安石变法更现代，折服了王安石等新党，开开心心改造宋朝。这书我没看完，但从它受欢迎的程度，看得出来王安石得到了很多人的同情。\n\
    \n然而，事实却是相反的，是王安石变法葬送了北宋。\n\n不是王安石变法停下来了，北宋才灭亡，而是北宋灭亡了，王安石变法才停下来。\n\n# 一\n\n北宋那个时候，问题很多。简单来说，就是三大冗：\"\
    冗官\"、“冗兵”、“冗费”。朝廷开支太大，捉襟见肘。老百姓负担沉重。\n\n其中，“冗兵”的造成，来自宋太祖赵匡胤的理念，把可能作乱的人招进军队养起来。结果军队越养越庞大，但战斗力却不行。\n\
    \n面对这种困局，该不该改革？当然应该改革。\n王安石就是在这个时候崛起。\n支持变法的人被称为“新党”，反对王安石变法的被称为“旧党”。\n从名字上看，“旧”嘛，一定是不肯承认现实、阻挠一切创新的，那还不是搞糟国家？\n\
    \n的确，旧党有守旧的一面，但守旧不一定就是错的。当他们反对的是更糟糕的“新意思”时，他们就是对的。\n经济学家张维迎就经常说，新的经济学思想，不一定就比旧的经济学思想更好。\n\
    \n北宋究竟是葬送在旧党手里，还是葬送在新党手里？\n先不论理念、政策，先简单地看一下北宋末期的年号时间线吧。\n\n治平四年（1067 年），宋神宗即位。第二年（1068\
    \ 年），改元熙宁，开始任用王安石变法。宋神宗对王安石的信任，是古今君臣罕见的。有人说两人如同一人。王安石在党争上特别执着，开大肆整人之前河，旧党全面失势。例如，王安石曾指使人诬告苏轼叛乱，这是要把苏轼往死里整。\n\
    \n熙宁七年（1074 年），王安石变法的弊端已经十分严重。一个小官郑侠画《流民图》，宋神宗见了，对变法有部分后悔，罢了王安石的宰相之位。"
