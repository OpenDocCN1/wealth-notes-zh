    # 年轻人该如何寻求突破？ #X111


    > 如果任何复杂器官不是从无数连续微小的突变而来，那么我的理论就崩溃了。

    ---达尔文


    一、硬币的正反面


    几代人的努力 VS 十年寒窗苦读，这个其实是老话题了，现在突然又火了。'
  merge: -1
