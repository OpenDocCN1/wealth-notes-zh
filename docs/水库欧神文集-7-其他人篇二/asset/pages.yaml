- pgno: 1009
  md: '# 平衡游戏出王者 #X114


    ![](img/ef1c5244d092b8b29b53a68870574480_1009_0.png)


    # 平衡游戏出王者 #X114


    一个游戏是很多有趣的选择的集合。— 席德·梅尔 (Sid Meier)


    # 一、年轻人的愤懑


    现在的年轻人，真的是非常焦虑。


    现在知乎上的气氛就是这样，只要谈国内，就是内卷，只要谈国外就是入关。


    有个读者和我说，我是90后，等我长大，京沪房价已经很高了。

    这个游戏我还没打，我就输了，非战之罪！


    现在再要去打，就要充钱，充很多很多钱。


    我还是充钱那个少年，没有一丝丝改变。

    英雄不能无敌，充钱才能无敌。

    游戏严重的不平衡。


    这种认识是错误的。'
  merge: -1
  img_proc: true
- pgno: 1010
  md: '因为这个说法把游戏的“平衡性”和“难度”混为一谈。平衡性是平衡性，难度是难度，这是两回事。


    其实稍微了解一点房产的历史，你就知道，对于上班族来说，每一年的房价都是很高的。


    谁都一样，没有一年首付是够的。


    每一年买房，都要挣扎，都要博弈，这样才发展出各种技巧。


    工资和房价稍微接近一点的，其实是 14 年，那么后面的事情你已经知道了。


    后浪们说初始资源太少，升职加薪困难，买不起房，人生陷入绝望。


    其实大部分前浪们何尝不是这样过来的？


    那么初始资源少，有没有可能成为人生赢家呢？


    除了《加速度的公平》这种抽象的原则，有没有一种模拟器可以模拟一下呢？


    自己行不行，性格有什么优缺点，一模拟就知道了，免得在现实中犯错误。


    我们知道，现代的战争，事先都可以进行战争模拟、推演。


    那个普通人根本接触不到，也用不起。


    万幸的是，这样的东西还真是存在，而且还相当普及。


    那就是策略游戏。


    只不过大部分仅仅把它当做游戏，而没有从战略战术上思考。


    策略游戏的特点是反馈时间很长。


    就是你在游戏中做的一个微小的选择，很长时间才反应出来。


    这很像人生中的选择。


    由于这个特点，现在早就不是主流游戏，因为现在的人缺乏耐心。


    但是这个群体有很多高级玩家。


    以《魔法门. 英雄无敌 3》为例，这是一款 20 多年前的游戏。


    游戏公司早已不维护，但是玩家们还在不停的更新。


    这个游戏当然有它的缺点，但是在战略战术上还是有可取之处的。


    这个游戏生动的阐述了初始资源不同造成的各种选择。


    初始资源和难度是强相关的。


    每个难度，电脑的初始资源加成不一样，AI 聪明程度不一样。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……'
