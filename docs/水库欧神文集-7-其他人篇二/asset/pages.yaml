    # ## 二）冒险


    冒险，到底是不是一件坏事。


    前几天看到一篇帖子，讲小两口 2016 年在杭州打算买房。


    交了 10 万定金，准备网签那一刻，作者感觉以自己的能力，是凑不够资金缺口了。


    于是打了退堂鼓，几乎已经决定不买。


    但是没想到，违约还要向中介支付 5 万元定金，否则房产证就要在人家手上“代为保管”。


    实在没办法，小两口还是预支工资，借款套现，想尽办法，凑够了剩下的 22 万。


    ![](img/ef1c5244d092b8b29b53a68870574480_501_0.png)


    但我的注意力，并不在于小夫妻品德如何。


    我只是在想，冒险，到底是不是一件坏事。'
