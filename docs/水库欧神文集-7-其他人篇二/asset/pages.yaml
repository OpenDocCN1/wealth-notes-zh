    # 更为精纯的能量 #X77


    （本篇其实是理财）


    # （一）脱产考证


    这几天在重新讨论一个问题：“一个有工作而急需用钱的人，是否应当花八个月时间和 2 万生活费脱产考证”


    不管是在校大学生还是已经工作的人，到现在绕不过的一个话题就是“考”。考证考研 考公务员。'
