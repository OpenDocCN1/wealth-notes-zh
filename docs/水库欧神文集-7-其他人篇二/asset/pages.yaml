    \n  不过我也不认为我的经济学水平比教授差。\n\n（邓新华，2019 年 7 月 9 日）\n\nyevon_ou：\n\n次条广告是赔的，被我贱搁延后好几期了，全\
    \ 5 多原谅\n\n![](img/ef1c5244d092b8b29b53a68870574480_630_0.png)\n\n# 有钱了该怎么花？到南极拉回一座冰山\
    \ #W03\n\n![](img/ef1c5244d092b8b29b53a68870574480_630_1.png)\n\n有钱了该怎么花？到南极拉回一座冰山\
    \ #W03\n\n你应该听过很多中东富豪的传说吧？比如说，一位小王子有 7 辆凯迪拉克和 3 架飞机，每周零花钱 600 万美元。买得着的豪宅、豪车、私人飞机，这些都不不是事。他们炫富常常用一般人看不着的宠物，比如猎豹、狮子和猎隼。养一两只只不稀奇，有时会带十几只上飞机。最近，一则中东富豪的新闻，又在社交媒体引起一片转发。世界最富的国家阿联酋有一位富豪阿卜杜拉·阿尔谢希，他计划从南极拖运冰山到阿联酋，以解决当地水资源不足的问题。这个大胆的想法在喜剧电影《西虹市首富》出现过。一位满脑子创业狂想的保安提出，想从北极拉一座冰山到阿拉善。急于洒钱王的多鱼投了，还追加投资——“给冰山提提速”。"
