- pgno: 899
  md: '这个时候众将已经不可能同意了。


    郭威用滑州的库存钱财犒赏军队，然后王峻传他的命令说，到了开封，可以抢劫十天。众军欢呼雀跃。


    刘承祐坚持要出开封城迎战，李太后苦劝，但是刘承祐不听。

    这是他的最后生机，因为一旦出城，君臣名分就撕破了，一旦失败，连一点缓冲也没有了。


    接下来，两军在开封城外的七里店附近相遇。


    实际上，没怎么打。

    只有慕容彦超的军队打了一下，不能胜利，整个大军就瓦解了。

    这说明，除了慕容彦超，其它的军队只是观望而已。


    慕容彦超逃走，侯益等人连夜去郭威营中表示要投降。

    皇帝也没能再回开封城，在城外赵村被杀。


    郭威进军城之后，大肆抢劫，但是后来被郭威制止了。


    郭威呢？

    依然尊敬李太后，拥立刘知远的养子刘赟称帝，并且让太师冯道去迎接他。


    ![](img/ef1c5244d092b8b29b53a68870574480_899_0.png)


    ![](img/ef1c5244d092b8b29b53a68870574480_899_1.png)


    接下来，朝廷突然收到军情急报，说是契丹人入侵。

    郭威奉太后的旨意，重新出郊都抵抗契丹人。

    结果在路上的时候，再次发生兵变，士兵将黄旗扯下来，批在郭威身上，拥立郭威成为皇帝。

    （很熟悉？）'
