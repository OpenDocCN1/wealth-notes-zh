- pgno: 735
  md: '比尔·盖茨这样的超级富豪，有几辈子都花不完的钱。他当然会有豪宅和私人飞机，但这些财富相对于他的总财富，比例非常低。富人生活再怎样奢侈，实际上他们消费只占财产的很小比例。（常见的现象反倒是，许多超级富豪的日常花销数额还不如一个普通的富人家）。超级富豪的财产绝大多数是社会资本的积累，主要形式就是公司股票。


    富豪持有公司股票，是以私人名持有资本，实际上从中获利的主要是劳动者。


    在市场经济中，劳动者依靠出售劳动获得收入，其收入高低依赖资本的丰富度。同样是洗碗工劳作一天，缅甸工人仅够糊口，而新加坡工人的收入却超过全世界多数白领。缅甸工人的工作也许更出色，但新加坡社会的资本丰富度，决定了后者能得更多的工资。


    此外，劳动者要购买商品，商品价格高低也依赖资本多寡。资本数量越多，意味着用于生产商品的资料品越多，产出量更多，商品价格就越低。在资本丰富的国家，穷人也能享受商品丰富的生活。


    假设现在富人被拿走一半财富，用于各种分配（也是很多人的隐秘渴望）。无论是填补财政窟窿，补足养老金不足，投入教育体系，还是基础设施建设，这笔钱的使用效率都不会太高。官僚不是企业家，在其体系下的资源分配，不追求利润，他们能把钱花清楚就很不容易，更不用说赚到钱。


    会有人从富人的增税获利，那只是少数的幸运儿：绝大多数人没有获得好处。长期来看，所有人的利益都受损。资本在消融，富豪的生活水平几乎不受影响——对他影响最大的，可能只是身价数字，财富榜的排名。


    对劳动者而言，他们的利益受损却是巨大的。全社会用于雇佣劳动者和生产商品的资料减少了，工资降低，物价提高，生活水平降低。


    这就是最正宗的市场经济学。理解这一点，是够破除世间一切对资本家的仇视。


    当然，很多人说：我们支持对富人增税主要是为“公平”，凭什么穷人税这么重，富人少交税？有钱难道不该多交税吗？事实是，这种朴素的“公平”观不会带来真正“公平的结果”。富人的税增加，受损最大的还是穷人，除非所有人一穷二白，一无所有。


    我常想，像比尔·盖茨这样绝顶聪明的人物，他们不懂其中道理吗？'
