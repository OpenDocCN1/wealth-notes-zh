    但是奇怪的是，尽管实践反复证明了市场的有效性，但在 1990 年代中期之后，西方的经济学思潮，却日益地抛弃市场观念。白左横扫欧美，凯恩斯主义再度占据上风。格林斯潘这样的财富毁灭者，却被看成救世主。


    芝加哥学派快速凋落殆尽，后继无人，哈耶克更是被严重边缘化。


    反映在“诺贝尔经济学奖”上，则是得奖理论日益没有创新，日益数学模型化。


    再也没有一个坚定维护市场经济的经济学家得奖。


    “诺贝尔经济学奖”评委会几次试图动摇‘理性人假设’，其实也是为干预张目。


    因为，在很多干预派看来，“理性人假设”不符合现实，这就说明市场会失灵，就需要干预。


    你吃药不够理性，所以需要 FDA 来管住药；你投资不够理性，所以需要严格管制金融……


    （注：划重点，划重点）


    得主中，奥斯特罗姆、威廉森算是偏市场的。他们指出，哪怕产权不明晰的公共领域，'
