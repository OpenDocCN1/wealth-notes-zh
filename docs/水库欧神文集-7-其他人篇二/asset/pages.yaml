  md: 'yevon\_ou 注：


    关于“理性人假设”的争论？哥哥仰天大笑，哈哈哈，什么是理性。


    你先把“理性”的定义说清楚了，否则只能是鸡同鸭讲。


    曾经有粉丝想要挑战哥哥的“AT>0”理论，试图证明，“交易并不总是好的”。


    他们举了一个例子。


    假设 A 时间，我花 5 元买了一个苹果。


    但是 B 时间，我不喜欢苹果了。懊恼得不得了。花 3 元又把苹果卖了


