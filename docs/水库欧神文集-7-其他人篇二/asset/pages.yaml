    # 县城状元 Ⅱ #X91


    上一期写《县城状元》，是今年年初的事情。倏忽之间，已经过去四五个月了。


    那时备战冲刺的学子，如今都成了收到录取通知书的准大学生了。自然又出了几个新状元。


    当然几家欢乐几家愁，这是难免的事情。天从不贪人之功，却也不因人有功，便格外网开一面。


    文章发出来之后的留言，不能说对我毫无宠动。第二篇旋即卡文，觉得话已尽 了，不知道跟这些人，还有什么好说的。


    欧大提议可以写写《县城状元 Ⅱ》，我一时自觉想不透，便搁置下来。


    这一搁便是小半年。


    写《杀死一只小猪仔》时，却意外发现了一件事实，可以与县城状元，勾连起来。


    不禁感慨，昔日之因，遂成今日之果。一切失败，都不是没有根由的。


    1) 谏迎佛骨表


    读书时最喜欢语文教材，语文教材最喜欢古诗文。


