  md: '见过两回盖茨，看过他不少演讲，不得不承认：比尔·盖茨可能真没想过，或者没想透。他是一个纯粹善良的人，对科学奥秘有着非常精深的研究。满足消费者需求，创造巨大财富，盖茨都是一把好手。可是，对人类的运行规律，他却低估了复杂性。这样的伟人不只一个——爱因斯坦就是计划经济的支持者。


    当然，也不是所有企业家都如此。2010 年，比尔·盖茨和巴菲特发起“捐赠誓言”时，当年的世界首富墨西哥电信大亨卡洛斯·斯利姆就拒绝响应。他嗤之以鼻说，这些钱必须用于向重要的社会工程放贷，必须由能够胜任这份工作的人支配，“（如果捐赠出去）‘没人能肯定这些钱会被合理使用。”


    ![](img/ef1c5244d092b8b29b53a68870574480_736_0.png)


    查理·芒格，比巴菲特更值得关注的思想者


    巴菲特的搭档查理·芒格，他也主张低税制，公开反对征收富人税。巴菲特是民主党的长期支持者，查理·芒格却属于共和党。


    美国最大的非上市公司是科氏工业，拥有者科赫兄弟位列顶级富豪行列，他们也常常呼吁减税，为此资助卡托研究所这样的右派学术组织。在财富创造领域他们不如比尔·盖茨，说到对思想世界的影响，他们才真正值得世人敬仰。


    批评那么多，最后还是祝愿比尔·盖茨健康长寿，这样他就有足够多时间修正思想错误，推动正确思想的传播，更好地改善世界。


    （蒋城子，2019 年 10 月 14 日丑）'
