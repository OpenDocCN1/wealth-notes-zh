- pgno: 623
  md: '因此，什么是“理性”?


    薛兆丰认为，理性就是这个人亏了 2 元钱。就是炒股亏了 2000 元。


    这是彻头彻尾的谬误。这是“一元价值论”。


    奥派开卷明义，“价值”是多元的，并不存在一元的价值论。


    同样一个苹果，随着时间，地点，配套设施，持有人的变化，其“价值”是截然不同的。因此才需要频繁交易。


    因此，并不存在“理性人”的说法，甚至不存在“理性”的说法。


    只有人是否在每时每刻，满足了自己“择优”的说法。


    (哪怕我在赌场亏了 2000 元，但我收获了三小时快乐)


    人时时刻刻面临选择，包括吃苹果还是吃梨，走路还是开车，蓝衬衫还是白衬衫。


    # 奥派认为，根本不存在“理性人”假设。只有“自由人”假设。


    当一个人选择煮鱼还是火锅时，只要他是“自由”的，没有受任何暴力胁迫，那么他的选择，就是“最优”的。


    至于“自由”的结果，是否符合传统意义上的“最优”，是否狭义的“理性”，这其实是得打一个问号的。


    我们有理由认为，很大一群蠢材在内耗，在好吃懒做的时候，的确不如有一个“明君”。用鞭子抽打他们，产生的 GDP 会更高一点。(丧失了快乐)


    但是从一个更大的范围讲，纯市场经济，因为其在发明，创新，淘汰垃圾方面，具有无可比拟的优越性。


    因此从长期看，“自由”依然比“明君”产生更大的生产力。


    这是另外一个话题，篇幅有限，写不下了。'
