  md: '![](img/ef1c5244d092b8b29b53a68870574480_675_0.png)


    来自《极恶非道 3》，日本银幕上的“老家伙”们


    2010 年后，北野武推出黑道电影《极恶非道》系列。一群七八十岁的老炮儿，还在混黑社会，年轻人看起来一定觉得可笑吧。有什么事情非要打打杀杀？有那闲功夫，还不如看个漫画打打游戏呢。现实生活同样如此，日本合法的黑社会组织山口组，已经呈现严重的老龄化。不要说工作，就连做坏事，日本年轻人也没有了血性。


    1980 年代末，可口可乐公司在日本拍了一组广告。这是昭和时代最辉煌的记录。我第一次看到这些广告片时，有些惊讶。因为它非常“洋气”，欧美范儿十足。广告里的日本男女，衣着光鲜，载歌载舞，活力十足。不只广告这样，当时日本社会呈现积极向上的气氛。顺便说一句，真是看腻了当下日式流行的剧情广告、神转折广告，这些广告大多无病呻吟，惺惺作态。


    可口可乐在日本的广告，值得一看。


    从视频也能看到，当年日本女性的流行审美，和今天也不一样。今天的日本女明星，主流审美是甜美婉约，娇俏性感。1990 年代以前，日本女星多为宽额头高鼻梁，长相温和大气，平易近人。她们皮肤干净却不化浓妆，打扮入时却不张扬华丽。无论作女友、妻子还是母亲，都很自然，有让人称道的美好。


    ![](img/ef1c5244d092b8b29b53a68870574480_675_1.png)


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……'
