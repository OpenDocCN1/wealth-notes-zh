    # 二）生命质量


    量在中国的基础教育里，你很少能得到关于“天赋”的观点。人们最喜欢强调的，是“勤能补拙”。“王侯将相，宁有种乎”，“君子曰：学不可以已”。


    曾国藩的故事更励志，有小偷去他家偷东西，想等他睡了再动手。


    结果曾国藩坐在那里，一段书翻来覆去，就是背不下来。


    最后梁上君子失去耐心，翻身下来，怒斥道：“连我都背会了，你还没会!”


    “勤能补拙”的意思是，努力能够改变现实，每个人的价值都应被重视。


    恕我直言，抱持这种观点的人，是毒教育的铅汞吃得久了，脑子自然发生萎缩。勤奋创造了价值，不等于勤奋创造了很多价值。廃宅青叶真司很努力，他绞尽脑汁，创造了逆光拍摄轨道的方法，郑重地命名为
    “barisaku”。


