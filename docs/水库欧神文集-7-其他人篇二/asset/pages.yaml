  md: '# 被分析师主导的世界 #W10


    ![](img/ef1c5244d092b8b29b53a68870574480_678_0.png)


    被分析师主导的世界 #W10


    —


    前几天，恒大集团首席经济学家任泽平发表一篇文章《全面解读 7 月经济金融数据——该降息了!》


    全文主旨十分清楚：“经济金融数据全面持续回落，物价通缩，该降息了！”


    任泽平说：“上半年和 6 月份数据出来以后，市场一片“经济企稳”“企稳回升”“超预期”的声音，作为一名从事了 20 年宏观经济形势分析的研究员，我感到深深的忧虑。


    “我们鲜明提出震撼市场的观点‘要充分估计当前经济金融形势的严峻性。’”


    一句话，“看我预测得多准！”


    那些预测不准的事，当然不会再提了。


    比如两年前，任泽平提出，“新周期”要来了，和许多人论战，坚定捍卫他的“预测”。


    直到今天，也没看到“新周期”的影子。


    分析师行业就是这样。有一次让人印象深刻的“预测”，就可以丰衣足食一辈子。至于那些错误的预测，常常会被粉丝忽略。'
