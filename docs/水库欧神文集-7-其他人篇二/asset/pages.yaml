  md: '# 996 挡不住屌丝时代 #X82


    ![](img/ef1c5244d092b8b29b53a68870574480_446_0.png)


    # 一）物极必反


    最近有程序员在 Github 搞了个开源项目，“工作 996，生病 ICU”。在互联网界引起轩然大波。


    马云刘强东情动地喊“996 是修来的福报，不搞 996 我对不起其他奋斗兄弟”，程序员则手握马主义，痛斥资本家。


    > 所以今天中国BAT这些公司能够996，我认为是我们这些人修来的福报。你去想一下没有工作的人，你去想一下公司明天可能要关门的人，你去想想下一个季度公司的Revenue在哪里都还不知道的人，你去想想你做了很多努力的程序根本没有人用的人……跟他们比，直到今天，我依然这么觉得，我很幸运，我没有后悔12x12，我从没有改变过自己这一点。


    按奥派的观点，事情自然是很好拆解的。


    首先，如果设劳动法不存在，企业主有提出 996 的权利。


    ![](img/ef1c5244d092b8b29b53a68870574480_446_1.png)'
