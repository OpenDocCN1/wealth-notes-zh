    # 三、第一个无尽阵


    如果你真的想在房产方面有所作为，要尽快出第一个无尽阵。


    这个应该作为你玩房子的第一个目标。


    出了无尽阵，你才跳出了拼消耗的模式。


    比如说，你实力有限，没有 2N，那每年能不能搞出 1N，0.5N 呢？

    就算你每年只有 0.5N 是从房产自动产出的，还有 1.5N 是要拼消耗的，那也是部分无尽了嘛。


    第一个无尽阵对你的人生意义重大。

    最大的意义，就是安全感。


    职场，实在是一个拼消耗的模式，不存在无尽模式，老了就是老了，就算是高管，最后收入一样缩水。


    有很多人问我，什么时候可以辞职？

    这里面的下限，就是当你出第一个无尽阵的时候。

    最差最差，你们家所有的消费都是从房产而来。

    这个时候，你还有什么可以担忧的呢？


    当然，如果你做到了 2N，那用一个流行词来说，就是“稳了”。


    其实，不存在真正的无尽，但是有那种有损耗的无尽。

    就像 PVZ 里面的 8 炮阵，你还是要不时的补种南瓜头的嘛 @dittojeff

    但是，你可以尽量延长你的资产回报率下跌的时间。

    这里面的区别，就是到 20 关和到 2000 关的区别。


    对于第一个无尽阵，我的建议并不是一上来，就是大面积低单价。

    返璞归真，一句话，关键的是有赚钱效应。


    比如说，你去玩 PVZ，并不是一上来就出几个玉米炮。

    因为，玉米炮充能时间太长，碍手碍脚，搞不好就破阵了。'
