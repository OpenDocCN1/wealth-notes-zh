- pgno: 412
  md: '县城状元是优秀的人，他们凭借自己的努力，一定程度上改变了命运。


    然而对他们的成就与困窘，**垃圾写手桃军师**竟然是如此地自负与刻薄。


    在我们心里，县城状元，已经是很优秀的人。


    你指指点点，又比他们强到哪里去呢？


    但这种解读，显然是与写作初衷偏离得太遥远了。


    气愤之下，我也不禁失态吐槽道：


    “难怪搞选举制的西方白左国家最后都完蛋了”


