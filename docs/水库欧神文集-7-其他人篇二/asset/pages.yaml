- pgno: 181
  md: '顺风车滴到的不是国贸衬衫男，而是外地无业猥琐黑司机，这是让所有的消费者发现，互联网公司美好的承诺原来无法实现。


    被构建出来的生活美学不过是假象，滴滴一下真的就只是打车而已。刮开自如墙墙面洁白的劣质乳胶漆，露出的是发霉脱落的旧墙坯。


    消费者通过互联网产品逃离当下，过上更好生活的期待与尝试，在这一刻粉身碎骨。


    所以人们的愤怒，不只是因为滴滴的错误，更是因为，滴滴辜负了他们寄托在互联网产品上的，对于美好生活的期待。


