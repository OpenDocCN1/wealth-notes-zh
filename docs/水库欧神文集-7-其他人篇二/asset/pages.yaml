  md: '急于摆脱贫困的中国人，急迫地学习西方理论时，恰好遇上的是哈耶克、弗里德曼、科斯等人流行。他们带着“诺贝尔经济学奖”得主的光环，让中国人学到了许多市场经济的纯正知识。


