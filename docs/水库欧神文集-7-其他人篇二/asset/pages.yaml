    日本全国 1.27 亿人产生的生活垃圾总量，2000 年达到峰值，为 5483 万吨。

    假设垃圾密度和水相当，峰值年的全部垃圾才 5483 万立方米。如果海里围栏深 100 米，只需要围 54.83 万平方米，也就是围 0.5483 平方公里就够了。

