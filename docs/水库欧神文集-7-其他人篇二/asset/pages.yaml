  md: '赵构说："市舶之利最厚，若措置得当，所得动以百万计。"


    关税占到南宋财政收入的十分之一。没有这笔钱，南宋未必能做到和金国长期对峙。而这笔钱，以前是没有的，是增量。


    对于老百姓来说，以前受到抑制的海贸生意，现在可以做了，老百姓也获得了增量。这确实做到了"不加赋而财用足"。


    而在宋高宗之前，海贸的利益既不在官，也不在民，而是被白白浪费掉了。


    # 二


    中国的堂场经济改隔，从农村土地联铲承包责任治开始。


    农村土地承包一年之后，农民就从忍饥挨饿，变成基本能吃饱了。


    这一年时间，并不是乡镇干部去帮农民开垦了新的田地，也不是他们去帮农民种田了。


    财政当然也受益了。原来领导要为粮票、菜篮子发愁，几年之后就不需要发愁了。


    土地还是还是那些土地，人力还是那些人力，只是，农民有了使用权、收益权，粮食马上就多出来了，这就是增量改革。


    而在这之前，土地所蕴含的巨大财富，处在闲置的状态，无论是老百姓还是财政部门，都没得到好处。


    一块土地，在多大程度上是财富、是值多少钱的财富，不仅仅取决于它的物理形态，还取决于它的产权状态。


    农村土地承包治改隔之后，城市里的土地增量入市也是风起云涌。


    深土川是走在前面的。


    > 学者赵燕菁举过一个例子。"深土川经济特驱从罗湖启动，规划建设一个 0.8 平方公里、后来扩到 1.1 平方公里的区。按当时造价至少需要 3 亿资金，郭嘉只给了
    3000 万贷款，其他必须自己解决。作为罗湖开发指挥布副指挥长的骆锦星，提出一平方米收取土地使用费 500 元，外商独资进行建设。合同签订后要交 50%，剩余的款项在卖楼花时全部交齐。后来租出去的
    5 块地，收回 5 亿多元。"'
