  md: '出来之后一高兴，就又告诉警察自己是“逃狱的白鸟由荣”，然后再次落网。


    如是者前后四次，震惊了整个日本社会。


    ![](img/ef1c5244d092b8b29b53a68870574480_500_0.png)


    直到最后一次入狱，监狱一反常态，为他提供了设施齐全的单人牢房，可以洗澡，还给摆放鲜花。


    感到自己被当做人看的白鸟，终于安心了。从此，他老老实实在监狱服刑 13 年，直至被当作“模范犯人”提前释放。


    这个故事给我触动最深的，不是白鸟一生的悲剧，而是他越狱的细节：


    +   ・第一次越狱时，用箍便桶上抠下来的铁丝连开三道门锁。


    +   ・第二次，每天找位置磨一点，在监狱的钢铁墙壁上，磨出了一块勉强可以落脚的地方。


    +   ・第三次，是用每天吃饭省下的酱汤抹在手铐脚镣的螺栓上，坚持了足足八个月后，酱汤的盐分将螺栓逐渐腐蚀，才把螺栓拔出。


    越狱故事，好像总是如此。


    《肖申克的救赎》，安迪花二十年，挖一条地道。


    《沉默的羔羊》，汉尼拔从钢笔上拆下金属笔管，每天磨一点，磨成一把能开手铐的钥匙，然后藏在口腔齿颊之间。'
