  md: '# 我会为恶少辩护么 #W23


    原创： 邓新华 水库论坛


    ![](img/ef1c5244d092b8b29b53a68870574480_770_0.png)


    # 我会为恶少辩护么#W23


    大连市 13 岁男孩蔡某某杀害 10 岁女孩琪琪案，由于蔡某某没有达到法定刑事责任年龄，警方宣布不追究蔡某某刑事责任。


    网上争吵一片。


    很多声音说，这个蔡某某身高 180 厘米，杀人手法残忍冷血，此前也多次跟踪、骚扰其他女性，哪里像小孩？


    更有很多人呼吁降低刑事免责年龄线。人们担心，以后越来越多的少年会肆无忌惮，更多的人会受害。


    但是也有反对的声音。例如，有人说，从数据上看，对青少年的刑事免责，并没有让青少年犯罪率上升，所以那些要求降低刑事免责年龄线的呼吁没有道理。如果让青少年承担刑事责任，那么，是不是也要同时承认他们有完全民事行为能力？他们不去上学，或处分自己的财产，监护人也不能管了？


    他们还说，“同态复仇”的心理是野蛮时代的残余，不适合文明的时代。


    这些正反两方面的声音，多是从“社会”的角度进行讨论，而遇害女孩及其亲属的权利，却被很多人忽略了。


    二


    人的权利，包括人身权和财产权。人身权和财产权适用同样的原则。


    人为什么要确立权利、定分止争？那是为了大家能分工合作、“自愿交易”。如果产权不清楚，一个东西说不清是你的还是我的，那就谈不上交易。如果你的身体说不清楚是属于你的，还'
  merge: -1
  img_proc: true
- pgno: 771
  md: '是属于领导的，你就不能自由当老板、医生、学者、打工者……


    经济学上看，一项行为是不是权利，应该从人的行为逻辑上进行推导。


    其中的一个原则，就是权利应该是人人平等的。请注意，这里说的是权利平等，而不是行使权利的能力平等，当然更不是财产数量平等。


    一个人侵犯了他人的权利，就理应对他人的权利进行复原。


    例如，你无意中烧了别人的房子，就应该负责把别人的房子重新建好，或赔钱。如果你是有


    意烧了别人的房子，那就除了复原房子，还要加上其他的惩罚，以弥补受害者的心理和其他


    方面遭受的损失。


    侵害者对他人权利进行复原，是最基本的要求。如果没有这一条，那么，等于是侵害者的


    权利高于受害者的权利。


    如果侵害者的权利高于受害者的权利，那么，在一定的局限条件下，人们就会争斗侵害者，


    这显然是不利于合作的。


    但是有些权利受损以后，无法复原。


    例如有些人被杀了，这就无法复原了；或者身体受到重伤，也无法复原。


    这个时候，侵害者就应该把自己相应的权利交给受害者，或受害者的权利继承人。


    杀了人，就应该把自己的生命处置权交给被杀者的权利继承人；重伤了他人，就应该把相应


    的身体处置权交给被重伤者。除此之外，还要有额外的赔偿。


    这不应该称之为“同态复仇”，而只是权利对等，不但一点都不野蛮，而且非常符合正义的原


    则。


    受害方获得侵害者同等的人身处置权，可以选择复仇，也可以选择宽恕。


    很多人津津乐道，在南京的一个杀人案中，一对德国夫妇，宽恕了杀害他们儿子的中国凶手


    的故事。这些人据此主张宽恕、取消死刑。


    但他们忘了，宽恕的前提是，那对德国夫妇理应继承儿子对凶手的生命处置权，这才谈得上


    宽恕。


    如果不是你的权利，你有什么资格宽恕？我宽恕李小璐，说得着吗？


    而选择复仇，也只是受害方处分自己的权利。


    个人权利是法律的根基。


    法，不是用来惩前毖后、减少犯罪的，而是用来保护个人权利的。


    保护了个人权利，则法律的警戒意义自然就体现出来了。


    个体的宽容和警戒之间，才能找到最佳的结合点。


    其他的一切“社会意义”，都在个人权利中。


    中国的法学者，很多人都不懂这个道理。


    在蔡某某杀害琪琪的个案中，如果不把蔡某某的生命处置权交给琪琪的权利继承人，那等于


    是在说，蔡某某的权利高于琪琪的权利。'
