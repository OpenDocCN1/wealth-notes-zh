- pgno: 129
  md: '在众多新闻里，有一条引起了一些关注：


    河北枣强一名女生，名叫王心仪。她今年以 707 分考入北大，兴奋激动之余，写了一篇非常好的文章《感谢贫穷》。


    却不料引起轩然大波，网上一面倒地批判“酸臭毒鸡汤”。


    “贫穷是不应该感谢的，贫穷应该消除”


    “贫穷毫无助益，只带来苦难和死亡”


    “更多的人，被阶层固化所限制”


    突如其来的批评令人意外，为什么这些人的怒点如此莫名其妙，又如火药桶一般，一个火星就突然爆炸。


    1) 杀鱼弟


    我高中学文科，理化生完全不懂，但是初中物理课本上，有一个方法叫“**控制变量法**”，我还记得。'
  merge: -1
  img_proc: true
- pgno: 130
  md: '"控制变量法"的意思，就是每次对照过程中，只允许有一个独立变量不同，由此  来看该变量对实验结果是否有影响。


    倘若用控制变量法来看，很多东西就会变得有趣。


    在王心仪的"感谢贫穷"被大报点评的同一个 8 月里，一位姓孟的 17 岁少年，兑  着冰红茶和白水，喝下了剧毒农药百草枯。


    这个少年曾经在 2010 年，因一张杀鱼时表情愤怒的照片走红网络，被戏称为"杀  鱼弟"。


    一看这名字就是陈年爆款，那时的红人名字都淳朴，不是兄弟就是姐妹。看着老  点的就"芙蓉姐姐""犀利哥"，小点的就"奶茶妹妹""杀鱼弟"。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/ef1c5244d092b8b29b53a68870574480_131_0.png)


    百草枯是剧毒农药，无色无味，喝下 15cc，便足以致死。所以国标强制规定，百草枯原药和制剂中，必须加入规定量的催吐剂、兰绿色警戒色和异味剂，以防止误服。


    正因为太难喝，“杀鱼弟”兑着饮料也要喝下去，他就是发自内心地想喝这瓶农药求死。'
  merge: -1
  img_proc: true
- pgno: 132
  md: '而促成他自杀的起因，是有人每天来买 100 多斤黑鱼，那几天黑鱼价格每斤降了 2 毛钱，杀鱼弟不知道，按原价卖给对方，结果起了争执，他被父母轮流凶了几句。


    每斤鱼 2 毛钱，按 100 斤算，就是 20 块钱，20 块钱买来一瓶百草枯，就是杀鱼弟的命价。


    把“杀鱼弟”和王心仪放在一起，你才能看出问题。


    因为两个人家庭条件相仿，一个从小帮家里杀鱼，一个时时要帮忙做农活，甚至连年龄也相似。


    这才符合“控制变量“的基本框架。


    而不是把王心仪、杀鱼弟和那位“知道伪楚的小学生”，放在结果的尺度上比较，然后得出一个“资源存在客观差异”的结论。


    因为杀鱼弟与伪楚小学生，资质不同，家庭条件也不同，实际上有两个变量不一致。


    这时如果把所有失败全部归因到“家境”这一个变量上，一定是 有问题的。


    ![](img/ef1c5244d092b8b29b53a68870574480_132_0.png)'
