- pgno: 768
  md: '小丑人就是虚无主义者。在经历严重挫折和纯真幻灭后，小丑变成了坏人，他想要毁灭哥谭和整个世界。很多反派总是抱着某种拯救世界的雄心抱负（比如灭霸想通过消灭一半人类来拯救地球；《王牌特工》里的瓦伦丁费尽心机，挑选人类精英），小丑的作恶动机则是：没有动机。毁灭本身就是动机。


    虚无主义的小丑，没有道德观念，没有信仰；他不关心任何人的生命，无论是哥谭的市民，还是他的同伙。这是一个彻底冷酷，没有行为准则，无法预测的家伙。蝙蝠侠那里，保护哥谭市民安全是非常崇高神圣的事情，而小丑决心让蝙蝠侠成为一个笑话。这也是小丑让观众不寒而栗的原因——他是一种纯粹的恶。


    ![](img/ef1c5244d092b8b29b53a68870574480_768_0.png)


    小丑亚瑟让所有失败者打着正义的旗号站了出来


    这个世界还有一些潜藏的小丑。他们因各种原因，遭遇生活的不幸，饱受暗噬心灵的折磨，随时想发泄对世界的不满。我们通常把这类人称作“仇视社会”“反社会人格”，他是我们这个社会的定时炸弹。


    2012 年，电影《蝙蝠侠：黑暗骑士崛起》在科罗拉多州一家影院上映时，一位名叫霍姆斯的年轻人穿着防弹衣，携带长枪短炮，对着观众扫射，造成 12 人死亡，70
    人受伤。25 岁的霍姆斯当时处于人生低谷，他博士辍学、女友告吹，还患有严重的精神疾病。霍姆斯作案前就写下想法：“恐怖主义不是我想传递的信息，我想要传递的信息是，没有什么信息。”


    往前的 2007 年和 1999 年，美国史上最严重的两起校园杀害事件：弗吉尼亚理工大学枪击案件和科伦拜中学校园枪击案，凶手都有着相同的人格特质。他们心灵灰暗，冷漠怨恨，毫无共情能力。


    科伦拜恩高中屠杀案凶手之一埃里克·哈里斯，他在大屠杀前一天写道，“有趣的是，当我以人类形态存在时，我知道我会死去。一切都些平凡琐碎。”


    最近几年，社会上发生多起“拿刀砍幼儿园小孩”“开车往人堆里撞”的反社会犯罪事件。询问他们的作案动机，经常会得到同一个答案：反正活着也没什么意思。在生活磨砺下，他们成了没有道德感和同理心的人形躯壳。


    黑化之后的小丑，事实上也是这种人。他以为自己这个社会罪恶的结果，事实上，他自己才是罪恶本身。对于小丑，我无论如何也不会有怜悯的情绪。'
