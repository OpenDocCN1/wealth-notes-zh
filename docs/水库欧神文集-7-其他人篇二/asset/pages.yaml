    这哥们开了自己的游戏公司，开始赚了很多钱，后来莫名其妙要和-一个游戏死磕。

    然后把公司搞垮了。


    他死磕的那个游戏，大家现在都知道，叫做“王者荣耀”。


    可以想到的结果，大败亏输。


    他讲，游戏的平衡性是个系统工程，你改一个数值，别的可能都有影响。

    那么这么多参数，改一个牵一发动全身。

    这里面当然有很多技巧，比如模块化等。


    但是，他认为游戏的平衡性从宏观来说关键就是两个字-“选择”。


    平衡性=选择多。


    比如说一个游戏，一个英雄天生就很强，那么大家都会选这个英雄。

    这就是减少了选择。


    在游戏进行到一定阶段，玩家只有一个选择或者没有选择，但是游戏却还没有结束，那么这个游戏就是不平衡的。


    所有的不平衡都缺乏选择和没有选择相关。


    随着游戏的进行，游戏的平衡性也在发生变化。


    职场就是一个前期平衡，后期不平衡的游戏。

    比如说，你很有才华，也很努力，你在前期还是会有提升的。'
  merge: -1
  img_proc: true
- pgno: 1014
  md: '但是到了后面，你可能升职很慢，但是你却没有选择了。

    你不可能和老板说，我500%努力，然后拿我同级同事的5倍收入。

    没有这种可能。


    你很想要结束这个游戏，但是因为前期投入太多，你都不敢结束。

    这就是典型的没有选择和缺乏选择。


    任何一个规则，如果增加了选择，那么就意味着平衡性增加了。


    任何一个规则，如果减少了选择，那么就意味着平衡性减少了。


    房产，如果让你买，那么就是一个平衡的游戏。

    你不买买得起，那是一个初始资源和难度的问题。

    在这种情况下，你可以通过练习来升级。


    但是如果让你买，那毫无疑问，游戏的平衡性受到的损害。


    这个和屌丝们想的正好相反，而且这种想法反而损害了屌丝的利息。


    从某种程度上说，这么多人买房房产的，是不是意味着其它的领域是不平衡的，是缺少选择的呢？


    从这个选择角度讲，计划经济、补贴等就是一个非常不平衡的游戏。

    市场经济才是一个平衡的游戏。


    同样的道理，你做一个选择，后面的选择到底是多了还是少了呢？

    如果是多了，就是一个好的选择，反之就是一个坏的选择。

    显然，变成富人，选择就更多了。


    就拿我那个朋友来说，现在从别的方面又做起来了。


    走投无路，无疑就是无数坏选择导致的极限。


    你做了多少错误选择，才会走投无路啊？


    三、资产的战略纵深


    那么我们找到了一个平衡游戏，现在谈谈难度的问题。


    你初始资源不多，为啥一上来非要打200%的难度呢？

    你可以循序渐进嘛。


    等你能力上来了，再玩200%的难度。'
  merge: -1
  img_proc: true
- pgno: 1015
  md: '这里涉及到一个地图难度的问题。


    在类似《英雄无敌 3》这样的游戏中，到底是大地图难，还是小地图难？

    大地图比较难，因为你的游戏时间是有限的，这也是一种资源。


    如果是大地图的话，电脑起始资源比你多，而且扩张很快，占领了很多城。

    你还在出最初级的兵，电脑 7 级兵都出来了，大天使打枪兵，一击必杀。


    但是现实世界不一样。

    现实世界任何人都会遇到“扩张的黑洞”。

    只要资产纵深足够大，总有别人没有占领的地方。


    所以，在现实世界中，要玩大地图。


    就是你玩的这个游戏，资产的一定要有战略纵深。

    资产的战略纵深和雪城不一样。


    京沪被人占了，那你可以琢磨一下其它强二线城市嘛。

    随着中国的发展，出现十个以上的超级城市的可能性很大。

    西部不可能一个都没有，京沪也不可能永远涨。


    这是从空间角度讲的资产纵深。


    我们再从升级的角度讲讲。


    举个例子。

    比如说房子，就是一个极具战略纵深的领域。

    房子，涉及地段、景观、装修、家具等等，这些都可以去做。

    别人做全国的市场，那你还可以做本地市场嘛。


    只要你有创意，你总能想到别人没有想到的各种新的玩法。

    就算写房产相关的文章，你一直写都写不完的。

    这就是纵深。


    那比如牙签，这个就没有多少战略纵深，就是低成本。

    而且这个领域比较小，一旦别人做起来了，你很难进去。

    你能想象你一直写牙签相关的文章，写个几年吗？


    当然，也有一些看似没有战略纵深的，被一些好的创意做起来的。

    比如杜蕾斯，好像啥热点都很蹭上。


    再比如说天眼查，就是查公司股权这些东西的。

    你说这些东西看起来好像很枯燥吧？'
