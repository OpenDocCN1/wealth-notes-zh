  md: '# 暴富这一件小事 #X106


    ![](img/ef1c5244d092b8b29b53a68870574480_924_0.png)


    # 暴富这一件小事


    > FBI Warning:本文将引起极度不适，请谨慎阅读。


    一、一夜暴富的感觉


    很多人都想一夜暴富。

    华山派令狐冲，几乎什么都没有做，世外高人教你秘籍，董事长千金爱上你。

    买了房，就要问几个月能涨？


    对于暴富这件事情，本人还真有点研究。

    事实上，除了中彩票之类的，大部分的暴富的人或多或少都做了点什么。

    你有这样的机会，也不一定抓得住。

    这里面其实还有一个分界点，过了这个分界点，你不一定能承受的起。

    我们先来看一个真实的例子。


    美国人迈克是一个舞台经理，吉他技师和吉他保管员，有25年的从业经历。

    这个工作说白了就是打杂，一天干12-14个小时，但是收入很低。

    由于有各种巡演，迈克经常半夜收到通知要出门，就是一个随时待命的工作。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文章每月一更新……'
  merge: -1
