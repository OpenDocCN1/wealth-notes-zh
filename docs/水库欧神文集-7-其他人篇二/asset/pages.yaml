- pgno: 657
  md: '![](img/ef1c5244d092b8b29b53a68870574480_657_0.png)


    是的，假定人类在吃的欲望上，始终只吃馒头，再无吃其他食品的欲望，人类也会追求把生产一个馒头的时间从 10 小时降低到 8 小时、5 小时、1 小时甚至 1
    分钟......


    把劳动强度从 100 降低到 80、40、20、2......


    人们的确不会从吃三个馒头变成吃三百个馒头，但是人们可以用更低的成本吃三个馒头。


    # 四


    根本就不必担心储蓄导致商品没有销路。因为，人们不仅可以为他人生产消费品，也可以为他人生产资本品。


    +   如果消费率是 10%，那么，人们就生产 10%的消费品、90%的资本品。


    +   如果消费率是 50%，那么，人们就生产 50%的消费品、50%的资本品。


    +   如果消费率是 90%，那么，人们就生产 90%的消费品、10%的资本品。


    消费率低，就多生产资本品，用来提高生产自动化、造飞机、修公路、搞科研......


    实际上，今天的中国，市场主要生产资本品，收入也主要用于购买资本品。


    2018 年全社会消费品零售总额才 38 万亿。


    而房子的销售额就近 15 万亿。


    当你默默存钱准备首付时，不要担心你存钱会导致企业的东西卖不出去。企业家会看到你有钱，会把资源转向生产建材，为你建房子。


    上一篇文章也说了，西二旗的程序员，只把收入的很小部分用于消费，大部分用于提高效率。


    无论消费比例是多少，都不会导致普遍的生产过剩、东西卖不出去。


    主流经济学家居然不明白这么简单的道理，你说这是不是小学生的错误？


    无论生产力如何爆发，都无须担心销路问题。


    相反，如果一个经济体销路不足，那恰恰是因为生产力不够发达。


    李迅雷说，还有 10 亿人没坐过飞机，5 亿人没用上马桶。


    这恰恰是因为那 10 亿人、5 亿人生产力没爆发。如果他们的生产力爆发，就能给航空公司、马桶厂开辟更多销路。


    现实中常看到普遍的“生产过剩”，那其实是干预所造成的生产错误，不是消费比例的锅。


    当然，我并不主张强制人们减少消费、增加储蓄来发展经济。因为强制储蓄会使得信号失真，资源配置低效。


    实际上，人们无须刻意节制消费欲望，随着经济的发展，消费率也会自然而然下降，储蓄率会自然而然上升。


    今天的人们把收入的 10%用于消费，清代的人们把收入的 90%用于消费，今天的人们也要比清代的人们消费的多得多。'
