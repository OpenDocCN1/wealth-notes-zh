- pgno: 849
  md: '抢”都累成鬼了，哪还有精力和心思看那东西？


    算法的改进，不但带来了农村的巨大变化，而且使城市快速发展起来，越来越多的人不再需要当农民，“双抢”也几乎绝迹。


    然而，尽管有过这样的历史，大部分人却仍然相信，在养老、医疗领域，大锅饭更能保障人们的养老、医疗。


    以前我写过一篇文章，讲怎样看待特权医疗。


    很多人一提起特权医疗，就愤慨。


    愤慨是正常的，但是接下来他们的要求是，扩大医保，让自己也能享受那样的医疗“保障”。哪怕比不上他们，能比现在在“保障”多一点也行。


    # 我的文章是说，千万不要扩大特权“保障”的范围。


    我完全能够理解，人们对此一定会更加愤慨：“凭什么！凭什么他们能享受 95 分的保障，我们却不能享受 60 分的医疗保障？你这不是维护特权吗？”


    他们没有有意识意识到，那个算法是必然导致医疗资源浪费的算法。扩大“保障”，就是让更多的人加入浪费的队伍。


    隔壁蠢眉目目的王叔叔，马上就会小病大治、短病久养，浪费你未来可能要用到的医疗资源，而且对你毫无愧疚，因为他完全意识不到他在损害你的利益。


    所以，如果你只是一个普通老百姓，扩大特权的范围，直到把你包括进去，这并不会使得你得益，反倒会更加损害你的利益。


    所以，无论你对特权医疗多么愤慨，你正确的努力方向是呼吁缩小范围，而不是呼吁扩大范围。哪怕继续忍受少数人享受 95 分的保障，也好过你要求 60 分的医疗保障。


    在不能避免的情况下，大锅饭一定是越小越好，而不是越大越好。


    就像吴恩的时代，队长、大队长开小灶，当然是不公平的，但如果全部队员都加入，小灶变大灶。


    # 那一定是更大的灾难。


    然而，这个道理，有几个人能想通？


    多数人的头脑是被“他都有 95 分的特权了，我要求 60 分的特权都有错吗？”的简单愤慨所控制。


    # 四


    人们的需求是多变的。


    市场是让消费者动态地决定结果的算法。


    只有按照这一算法，才可能得到消费者最满意的结果，医疗也不例外。


    除了改革医保大锅饭，还应该更多放开医疗准入，减少医疗资质管制。


    担心病人和医生信息不对称多花钱？医院之间会竞争，市场一定会出现第三方机构，来帮助你减少信息不对称。你担心的问题，市场上一定会有人来帮助你解决，来获得利润。利润即生产或节约下来的剩余，


