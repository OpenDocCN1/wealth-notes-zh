  md: '# 财富的进化天梯 #X109


    ![](img/ef1c5244d092b8b29b53a68870574480_961_0.png)


    引到永生，那门是窄的，路是小的，找着的人少


    —《马太福音》


    一、进化中的断层


    姑娘们找对象，丈母娘看女婿，喜欢从各种角度看对方的资产状况和发展潜力。


    但是人类极善于伪装，资产状况这种东西，从表面上很难分辨。


    资产就像生物一样，你以为是小龙虾是虾，其实根本就不是虾。


    ![](img/ef1c5244d092b8b29b53a68870574480_961_1.png)'
  merge: -1
  img_proc: true
- pgno: 962
  md: '所以，我们从生物学的角度谈谈这个问题。

    这个角度也确实能发现一些有意思的事情。

    因为财富极有可能像自然选择一样，挑选出合适的人。


    就你自身而言，到底什么阻止你突破？

    你要说外部环境，大家都有外部环境问题。

    天择对每个人来说都是一样的。


    ![](img/ef1c5244d092b8b29b53a68870574480_962_0.png)


    我们还是从内部原因讲。


    我尽量讲得通俗易懂，不去说什么嘌呤、嘧啶、化学渗透、质子梯度这些名词。


    现在的研究表明，所有的生物其实是分为三大域：细菌域、古菌域、真核生物。


    古菌是和细菌外表类似，其实是不同的生命，常常生活在极端环境。

    人类一度认为它是远古细菌，其实只是有点像而已。


    真核生物，粗略的说就是有细胞核的生物，包括所有植物、所有动物、所有真菌等复杂生物。

    人类就属于真核生物。


    这三大域都起源于一个共同的祖先露卡 LUCA（The Life Universal Common Ancestor）'
