- pgno: 209
  md: '十八世纪的瑞典植物学家林奈 Carl Linnaeus，开始用"luridus"来形容亚洲人种的肤色。


    这个形容词的意思是，是黄、淡黄、蜡黄、苍白、死一般的颜色，等等。反正不是什么好黄。


    林奈对这一点心知肚明，他曾表示植物呈现 luridus 颜色，就意味着悲伤和可疑。


    所以这不是一次普通的改动。林奈希望借助这个词，来暗示亚洲人病态和不健康。


    从此，亚洲人种的肤色就"成为了"黄色。


    参阅：《罗新：世上本无黄种人》


    那么，林奈为什么选择黄色？


    除了植物学，也许还有其他的理由。


    黄色在欧洲文化中一直是贬义居多，代表着不洁、病态、背叛与恐怖。'
