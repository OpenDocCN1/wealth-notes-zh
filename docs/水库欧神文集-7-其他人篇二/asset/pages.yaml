  md: '与出轨不同，多偶制是合同约定的内容问题。一个人可以选择一夫一妻制，也可以选择多偶制。只要他的几位伴侣事前了解条款并且同意，那么他们自愿达成的契约，（至少在他们之间）就是有效的。


    ![](img/ef1c5244d092b8b29b53a68870574480_598_0.png)


    ![](img/ef1c5244d092b8b29b53a68870574480_598_1.png)


    如果大家都同意多偶制/开放式婚姻，那么一个人选择多名伴侣，并不是违约行为。既不能以出轨与否来评价，也没必要纠结于贞洁烈妇式的道德观。


    “先明后不争”，只要说清楚了，各方都同意，遵守框架内行为，就是道德。违背已经约定的内容，无理撕毁合约，才是不道德。并不是简单以配偶的数量来决定。


    这是一个基本的概念区分，但却是很细致的。


