- pgno: 13
  md: '而且因为杨超越一直被批评，**整个节目组的声誉，没有受到"审丑""低俗""撕逼"的批评，顺利过关。**


    > "票是观众投的，我们节目组管不了啊。"


    # 2) 反物质


    把杨超越的票做高，还有一个好处。


    如果我喜欢孟美岐，李子璇，赖美云，那我肯定不想让杨超越出道。


    名额有限，她这么废柴，凭什么把我家电豆干挤下去！


    她不配待在这个舞台上！


    于是自家粉丝云集响应，赢粮而景从，疯狂拉票，为信念而战。


    别家一看，咦，小豆子爬上来了，那我家的赖美云岂不是要掉下去了！


    于是也开始拉票。


    票就是钱啊，金灿灿，银闪闪，红艳艳，绿油油的，钱啊。


    杨超越，就是条放进来的鲶鱼。'
