  md: '城市的孩子与农村的孩子，天资禀赋的差距，并没有想象中大。


    “县城状元”在这样的师资状态下，半自学读课本，自己研究做题，都可以考个985，完爆一列课上名师点拨，回家还能加餐的城市考生。


    但是后天教育的差距，比想象中更大。


    上海展览中心开展书展，挤满带娃的家长。小学女生白白净净，走在书架前，“这本故宫智造我要看。那本中国古代服饰科普我也想看，国家宝藏里提过的。”


