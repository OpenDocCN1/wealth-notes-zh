  md: '# 请让全世界比我富 #W21


    ![](img/ef1c5244d092b8b29b53a68870574480_755_0.png)


    请让全世界比我富 #W21


    一


    这两天，大家讨论市场经济与贫富差距的关系，热火朝天。我先讲一个事。


    有一次，在一个群里聊到长生不老的话题。一个朋友坚决反对人类探索长生的技术。


    他说：“现在贫富差距都这么大了，如果那些亿万富豪能够长生，那差距不是更大？那是不可接受的。”


    我问他：“给你两个方案，A、我们普通人可以活 80 岁，富豪可以活 85 岁；B、我们可以活 150 岁，富豪可以活 500 岁。你选哪个方案？”


    我肯定选 B。


    但是提出这两个方案之后，我在心里想了一下，对于 B 方案，我有没有抵触情绪？是的，而且还比较强烈。凭什么！凭什么富豪的寿命是我的三倍 以上？确实难以接受！


    但是理智告诉我，只要我能活 150 岁，那我的福利就比原来大幅增进，那么，我为什么不克制住妒忌心，好活得久一点呢？


    经验也告诉我，现实世界中的很多人，真的可能选 A 方案。“哼，我宁愿只活 80 岁，也不让你活 500 岁！”


    不过，我相信，如果他们愿意多想一想，也许会改变主意。'
