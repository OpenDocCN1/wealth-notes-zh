- pgno: 926
  md: '来。


    卖掉宣言之后，迈克的生活得到了极大的改善，能买得起自己喜欢的吉他了，经常逃吉他店，但也不是每把都买。


    他的妻子辞掉了朝九晚五的工作，开了一家童装店，叫“艾米的从前”，生意非常好。


    这是多么幸福的生活。


    再来看一个例子。


    查理. 艾尔斯是一名厨师，在上个世纪 90 年代的时候，在一家非常有钱的人家当私人厨师。


    但是主人家对他非常苛刻，经常责骂他，规矩也很多，比如做饭的时候不能用银制餐具，主人才能用银制餐具，还有工作的时不能接电话等等。


    这搞得他压力非常大，于是就想换个工作。


    正好，他女朋友的同事的老婆在一家**小型科技公司**上班，说那家小公司正在招厨师，就让他去试试。


    他去面试的时候，发现那家公司非常小，而且根本不象一家正规公司。


    办公室里面搞的象兄弟会一样，员工不是玩桌上足球，就是玩滑板。


    他的朋友跟他说，这样的公司随时都会倒闭。


    查理面试的时候还是认真的做好了饭菜，让员工试吃，并且把那个小厨房收拾的干干净净。


    然后，就回去等面试结果了。


    一天，他正在被主人家责骂的时候，面试结果下来了，他被录取了。


    由于他当私人厨师很不开心，他就马上辞职，去那家小公司上班了。


    去了之后，他发现那家公司发展得很快。


    有一天，有个财务分析师跑过来跟他说，公司现在正在认股，他是正式员工，有认股的权利。


    查理说，他没钱认股。


    财务分析师说，这个股一定要认，只能说这么多了。


    查理就跑去找他爸借钱。


    他爸说，当心，这个肯定是诈骗。


    ![](img/ef1c5244d092b8b29b53a68870574480_926_0.png)


    尽管是这么说，他爸还是借给他 1 万 4 千美元。'
