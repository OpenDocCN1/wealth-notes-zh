- pgno: 565
  md: '更为先进一点的中介系统，则是“自动拨号软件”。

    由电脑直接连上电话线，按照数据库内的电话号码，一条条拨过去。而作为中介新人，是看不到电话号码和楼牌号的。

    为什么，因为房源信息可能是一家门店最宝贵的资产。他不会轻易泄露给菜鸟员工。


    讲起来，个个都是“销售精英”“研发骨干”。但是你对企业的宏观运作，一无所知。你不知道，老板如何绞尽脑汁，延续现金流，腾挪注入研发部门；也不知道老板为什么每个月，要给销售部门下达特定的业务指标。


    每个人都只能专心致志，“把销售业绩再做高一点”，“设计再巧妙一点”，来获得上司的赏识，老板的认可。但精益求精的过程中，你距离真正的“通盘考虑”，已经越来越遥远。


    结果就是出现一个又一个“考司之神”，你可以发现，小白领对于“精进”这件事充满了热情。因为这符合他们的日常行为轨迹。

    一直到 35 岁，生命耗损殆尽，从此被踢出廉价劳动力序列。


    “事业部”，就是为了折断白领的翅膀而生。限制你得到的信息，不允许你掌握“通盘考虑”的能力。

    每个事业部只掌握自己的一小块地图，新人为了刮地图，常常碰得头破血流。甚至要等十数年后，才能有所发现。

    但是老板从一开始就是“开了天眼”的，他看着你们忙里忙外，指挥各个事业部，为了自己的目标而协作。这个目标，又被拆分为每一个事业部的具体任务，大多数人，都并不知道自己的任务，最后指向哪里。


    士兵能知道自己站在队列的前端或末尾，已经很难得了。就算是掌握左翼或右翼分兵的大将，也忙于照料各部的位置，和观察敌我双方的动态。


    只有指挥者，他站在地形的制高点，不进入战场，可以看到“风后八阵图”的全貌。'
