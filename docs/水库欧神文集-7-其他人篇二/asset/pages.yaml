- pgno: 571
  md: '了。根本不用费劲再查资料了。

    大量新鲜有趣的史实触手可得。如果碰上像卢克文和六神那样会编排的大笔杆子，每天查一条人名线，写得八卦一点，最起码够吃一年的素材了。


    人力有时而穷，AI 却有无限生命。

    我现在已经不怀疑，终有一天，大量基础性工作，甚至是稍有难度的低级减熵工作，都可由AI 完成。


    如果你的职责，是每天翻阅史料，查找人物之间的联系，这个工种的丧钟，此刻已经敲响。

    你拼死拼活，翻书到吐血，不如 AI 一秒整理得清楚明白。


    但是，AI 永远不具备“全局观”。

    当人物关系图被摆在屏幕上的那一瞬间，AI 的使命就已终结。

    AI 不知道图片上那个眼袋很大的老头到底怎样在赤壁横槊赋诗，也不知道阿道夫希特勒会见

    过爱德华七世的孙媳，这件事到底有什么历史意义。


    从宏观角度，分析和解读“意义”的权利，依旧牢牢掌握在人类手里。


    企业活动，历史事件，像是一团柔软的有机生命体。每个部分之间，都有联系和循环。

    掌握每一个部门运作的细节，也是一位成功领导者必备的素质。没有细节，就谈不上执行力。

    任何好的构思，都会被做槽做烂。


    但是，注重细节和沉迷细节，是两回事情。

    细节通往目的，但细节不是目的。


    隔开人类和AI，天子和诸侯，事业部和老板的那张玻璃天花板，就是你能否站在棋盘之外，

    以一个弈棋者的角度，看待这个世界的运作。


    而不是一头扎进“事业部”，扎进史料的海洋，把自己活成了一枚任人摆布的棋子。


    （司空元帅祭酒桃，2019 年 8 月 27 日）'
