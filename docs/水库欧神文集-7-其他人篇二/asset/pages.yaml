  md: '律带来的问题，希望新增“调查”的程序，督促物业和警方调查，减少住户委屈。


    这样的立法改动是好事，但远远不够。正确的做法是废除该条款，代之以对高楼抛物的严厉惩戒，甚至不惜入刑。这方面我们可以参考香港的例子。


    香港是高楼林立的城市，其《简易程序治罪条例》就规定，高楼抛物造成公众危险或损伤，即属于犯罪，可处罚款一万港币及监禁 6 个月。香港房屋署还成立侦查高空抛物的特别任务队，利用高科技手段破获多起案件。由于法律严明，香港的高空抛物现象大大少于内地。


    有人会说，如果真有人被高空抛物砸伤，闹出人命，查来查去，还是找不到凶手，那岂不是委屈到死？这样的事情肯定存在。正如这个世界上，总有人受到伤害却无处告诿，默默承受。这样的情景，确实让人心碎。越是这样，我们越要用正确方法来解决。


    会有开发商或物业以安全为名，给高层住宅安装摄像头；新闻媒体会关注惨案，于心不忍者可以捐款帮助。甚至 可以督促警察破案，将坏人绳之于法——唯独不应该通过冤枉好人，来解决问题。悲剧已经出现，法律实在不该再增添新的无辜者。


    （菁城子，2019 年 9 月 2 日）'
