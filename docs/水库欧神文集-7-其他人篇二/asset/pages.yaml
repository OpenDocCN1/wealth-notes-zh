  img_proc: true
- pgno: 893
  md: '而且，这样的人还不止一个人，这样的怀疑论者是非常多的。

    但是，我们又看到很多后辈获得了很大的成绩，超过了这些早期的怀疑论者。


    这说明什么？


    这说明这条路，根本就不是正常的路子，就TMD不是正常人练的东西。


    这几年，整体形势都不是很好。

    很多人在问，怎么突破关口？

    《庆余年》中庆帝也曾经这样问叶轻眉。

    叶轻眉回答说：我不知道。


    这也是多年以后，庆帝怨恨叶轻眉的地方。

    叶轻眉交给苦荷一本秘籍，苦荷就成为了一大宗师，创建了天一道。

    叶轻眉在东夷城碰到四顾剑，四顾剑就成为了一大宗师。


    ![](img/ef1c5244d092b8b29b53a68870574480_893_0.png)


    叶轻眉是庆帝的女人，庆帝这样问她，她居然说不知道。


    所以，庆帝认为叶轻眉是想用这个秘密拿捏他。


    其实叶轻眉说的才是真话，就是不知道。


    叶轻眉的从神庙里面偷出来的几本秘籍，只是神庙研究出来的几个方向。

    但是每个人都有每个人自己的路。

    比如四顾剑靠的是意念，苦荷靠的是天人合一。

    每个人突破关口的方法都不同。


    你走的是什么路，别人怎么知道？

    所以，孔二狗的路，就是网文，编剧等。'
