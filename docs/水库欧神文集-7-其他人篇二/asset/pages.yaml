    # 二、神的传说


    现在的年轻人，一开口就暴露出自己的无知。


    除了“恋爱脑”，更多人看问题都是“娱乐脑”。


    古代就是评书、演义，现在就是电视剧、电影、综艺，那都是“娱乐”。

    很多人思考的方式，完全按照电视剧和综艺的思路进行思考。

    你不会真的以为努尔哈赤是靠《三国演义》来打仗的吧？


    很多情况下，你以为你看到的是这样的。


    ![](img/ef1c5244d092b8b29b53a68870574480_1002_0.png)


    但是实际情况是这样的。'
