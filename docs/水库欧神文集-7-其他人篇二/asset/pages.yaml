    买房子也是这样，你想再攒攒首付钱，结果房价又涨了，首付又不够了。

    这就是一个“军备竞赛的循环”。


    总之，要胜出，特别特别的难。


    我们的教科书特别喜欢讲以少胜多，以弱胜强。

    官渡之战，历史上著名的以少胜多的战役。

    萨尔浒之战，历史上著名的以少胜多的战役。

    迦太基和罗马之间的坎尼会战，还是历史上著名的以少胜多的战役。

    这还有完没完？


    说得多了，搞的好像满世界都是以少胜多，以弱胜强。

    这也就造成了现在很多年轻人的气质。

    就是要逆袭，就是要卖典，连过程都不要，沙雕霸道总裁文流行。'
