  md: '文末，他得意洋洋地总结：“写这篇文章，是因为想叹息郦道元的简略，和嘲笑李渤的浅陋啊。”


    # 2) 孰能讥之乎


    苏轼钻石钟山的三十年前，王安石也写了一篇钻洞心得。


    由此可见，前现代的古人生活，实在是很无聊的。


    业余活动就那几项，大家都没有 xboxPS4 可以打。穷人忙着耕田劈柴喂肚子，闲人只好游山玩水，且热爱探寻奇山异水。


    有时候挺可怜那些山洞，落了个奇货可居的名声，整天被人打着火把在肠子里乱窜。


    真不知晚上会不会做噩梦，“嫂嫂，我在你肚子里呢！”


    王安石钻褒禅山洞，来得并不如苏轼成功。


    褒禅山洞太深，荆公一行五人，许久都没有走到尽头。当中有人疲惫，又担心时间久了，火把熄灭。其余人听了，也就跟着出来。


    但等到出来，王安石就后悔。觉得自己走的路比起真正的驴友，还不到十分之一，而且体力和剩余的火把耐久度，还可以支撑一阵子。


    这样随便跟随别人的意志，就走了出来，没有尽兴，实在是有些可惜的。


    但与苏轼不同，王安石没有嘲笑任何人。他也没有写知乎爆款文，而是写了一篇 EMBA 教材：


    成功的要素，不只是有远大的志向。要有充足的气力，要不跟从别人的主见。


    就算有了这些，还要有冥冥之中的“相”，即外界条件的帮助，甚至一点运气。


    当五十岁的苏轼还在得意洋洋地嘲笑前人的鄙陋，时年三十四岁的王安石已经开始辩证地看待成功：


    有了成功的意愿，不等于就可以成功。


    但是即使没有成功，尽力的人就可以获得无悔的安宁。'
