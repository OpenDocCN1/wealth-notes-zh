  md: '你玩“冒险模式”通关，只能说你对这个游戏一无所知。


    你玩“无尽模式”，泳池无尽是最简单的一个，玩到几百关，那才刚入门。


    其实并不是说你拿到了“无尽模式”的心法，你就一定能玩到几千关。

    “无尽”，只是理论上证明了“无尽”，你要是手残党，一样是不行的。

    在这里面，每一关，你都要非常小心，谨慎操作，才能稳定过关。

    一旦破阵，是很难救回来的。

    不信，大家可以试试。


    十年前的游戏，可以下载的地方很多。

    我不建议大家在这个游戏里面投入太多。

    因为这毕竟是一个休闲游戏，并不如 CIV II 之类的策略游戏有嚼头。


    我们真正要说的是房产。


    # 二、房产无尽模式


    就像 PVZ 里面那样，房产也是分“冒险模式”和“无尽模式”的。

    小白领，克勤克俭，一辈子买几套房，2000W 左右，您这是“冒险模式”通关了。


    为什么说是“冒险模式”？

    那是比“普通模式”和“堕落模式”是要强一点的。

    小白领，挣工薪，东买一套西买一套，资产全面集中在房产，没有章法。

    家里人就说，你这全买房，贷这么多款，万一房价跌了怎么办？

    万一哪天失业了怎办？

    万一实在是太多了。

    这就是所谓的“冒险模式”。


    > “冒险模式”就是拼消耗的。


    哪天小白领不再升职加薪，这个模式就止步不前了。

    其实呢，房产是有“无尽模式”的。

    对于“无尽模式”玩家看来，“冒险模式”这还没有入门。

    因为在 2000W 的通关，实在是没有什么痛苦的。


    什么是“无尽模式”通关？

    2N 通关，就是“无尽模式”通关。

    说起来，这个模式也简单。

    大面积低单价，不就是你的玉米炮么？

    你每年积累一定的玉米炮，每年都有以前的玉米大炮充能完成。

    那你每年不都是可以发射么？

    如此循环往复。'
