  md: '# # 发刊词 ｜ 为什么要面向未来培养孩子


    你好，我是诸葛越。欢迎来到《如何培养面向未来的孩子》。


    我是一个互联网行业的技术管理者。2006 年，从硅谷回到北京，现在在一家美国视频媒体公司 Hulu，担任全球副总裁，中国区研发中心总经理。


    同时，我是两个男孩子的妈妈。老大在英国剑桥读书，老二在上高中。


    我刚刚出版了一本分享教育心得的书，叫《魔鬼老大，天使老二》，这本书在得到有电子版。


    我是斯坦福大学的计算机博士，做过研究员、产品经理，在微软、雅虎等互联网公司带过技术团队，也做过创业公司 CEO。目前我的团队在做着非常前沿的技术，比如人工智能和机器学习、算法、大数据、视频理解等。


    同时，因为我的两个孩子，我对教育也有浓厚的兴趣，我写教育博客，也有自己的公众号《东西方教育》。


    我在儿童教育方面做了大量的阅读和研究，也常常给周围的朋友做教育咨询，关于他们孩子教育的选择。


    在这门课里，我会跟你分享，如何把职场力运用于家庭教育。为什么我想讲这么一个题目？首先是来源于观察到的中国父母的教育痛点。


    今天的中国父母，尤其是精英阶层，投入了大量时间精力在孩子教育上，这跟欧美国家的精英阶层非常接近。'
  merge: -1
  img_proc: true
- pgno: 2
  md: '这些年，不管是在硅谷工作的时候，还是回到北京工作，身边见到许许多多这样的家庭和孩子。妈妈在其中承担的工作，付出的时间很多。


    同时，今天的中国职场，又赶上了一个女性蓬勃成长的时代，越来越多聪明能干的女性，在工作中承担着越来越多重要的职责。即便是我这种传统上男性占绝对优势的计算机行业，也是如此。


    一个人的时间有限，一天就 24 小时，孩子的教育和自己的发展，看上去是一对矛盾，很多人觉得，顾得了这头，就顾不上那头。有很多女性朋友因此觉得非常疲劳和焦虑。


    毫不夸张地说，我这些年一手带大了自己的孩子，而且，我的孩子，一点都不比别的孩子好带。就像我自己新书的书名《魔鬼老大，天使老二》说的那样，我家老大，甚至比一般的孩子更难带。同时，在孩子成长的这十几年里，我的职业上升也一路并行，不但没有停滞、退步，反而一直不断爬升。


    我并不是女超人，我有自己的办法。


    相比于一般的妈妈，我对孩子的教育是有独特视角的。这个独特的视角来源于我对世界顶尖人才所在职场的理解，对未来世界所需要的技能的理解，以及对东西方教育的深度思考。


    而且，我也有不少实际操作案例，它们来自国际最新的教育理论，以及我自己的家中与孩子 20 年的斗争经验，我也用两个孩子进行过验证。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '我还不断从工作的角度，观察自己身处的高科技公司里，这些世界一流大学毕业的年轻人，我发现他们的过人之处，也留意到他们素质上的欠缺。


    这些给了我教育自己的孩子，一些特别的重要的启发。


    这堂课，我想把自己的观察、思考和实践都分享给你。


    这门课，希望能够帮到那些既想照顾好孩子，教育好孩子，又想在自己的职业道路上不断成长的职业女性。


    同时，这门课也很希望爸爸们能来听听。爸爸对孩子教育的参与非常必要，也非常重要。我也常常在公司做高管培训。我的职场经验，相信对很多爸爸也会有帮助。


    这堂精品课一共有七讲：


    第一讲，讲从一个公司管理者的角度说说，好公司会录用什么样的年轻人。给你一个养育孩子终局思维的视角。


    第二讲，我会分享我觉得教育孩子最重要的四件事。其中包括价值观的教育、时间管理、阅读和运动。这是家长最该花力气的地方。


    第三讲，说说几件教育孩子不必花太多精力的事。实际上，很多妈妈觉得自己疲劳不堪，主要是管得过多，而有些事情，你管得越多，反而对孩子的成长越没好处。


    第四讲，跟你分享如何从职场中借力，将工作方法运用到管理孩子中。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '第五讲，反过来，关注从教育孩子到自我的职业管理。


    从这两讲你就会看出来，职场奋斗跟孩子养育完全不是矛盾对立的事情，在各自系统中掌握的能力，可以运用于对方之中。


    第六讲，职场妈妈的时间管理。永远有100件、1000件家里的、公司的等着你去处理，怎么能给 自己的时间合理分配。


    第七讲，团队建设。妈妈想要不那么辛苦，一定不能大包大揽，而是要组织起一个队伍，不管是你的伴侣，家里的长辈，还是可以利用的社会资源，比如保姆阿姨等，还有跟你一样养育孩子的朋友，你都应该把他们调动起来，学会给自己减负。


    最后，我想跟所有跟我一样的家长分享一句话：孩子成长，我们成长。在孩子成长的过程中，其实我们能学到很多很多。


    # 1. 好公司会录用什么样的年轻人


    你可能觉得很奇怪，这不是一个亲子教育的课程吗？怎么一上来讲的是职场招聘？


    在我看来，这是教育的终局思维。


    我们养育孩子的最终目的是什么？


    不就是为了把他培养成独立的人吗？让孩子最终掌握独自谋生的能力，即使脱离了家庭和父母的庇护，也能成功地工作，幸福地生活。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 一、 教育的终局思维


    作为父母，你要的终极目标不是把孩子送进名校了事了，而是帮他走出校门以后，还能够杀出重围，让好公司、大公司愿意吸纳他成为新鲜血液，或者让他有能力创立自己的事业。


    多年以来，我一直在互联网行业工作。以前在硅谷工作，做过技术工作，后来也慢慢地转入管理。我现在负责公司在北京整个数百人的研发团队，我的主要职责其实就是招人、培养人。


    我的团队里面基本上都是非常顶尖的人才，这些年轻人，从中国甚至全球一流的大学毕业，基本上都是硕士和博士。他们主要是计算机或者是电子工程背景。


    这些专业非常火，他们的确是在引领世界的变化，就算从比较俗气的角度来讲，看看这些年轻人挣多少钱，你就知道这个专业有多火了。


    就拿校园招聘来说，从笔试到一轮轮的面试，我们公司的录取率，我算了一下，从最早投简历（当然投简历的已经是非常好的同学了），到最后进来的人，比例大概是1.6%左右。


    就是说，有几千人投简历，最后只招了几十个人。好公司的职业竞争，就是这么激烈。


    作为老板，我能看到的是，那些被录用的同学，有一些普遍的优点。但反过来，我也能看到，不管是录取的还是没有录取的同学的缺点。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '比如说有一个名校博士，每次我问他一个问题，他马上就能背一篇书给你。背的对不对呢？全是对的，但除了能把书上有的东西都回答给你以外，他似乎缺乏独立的、深入的思考。这个同学的背景其实非常符合招聘要求，但是我们一直犹豫要不要录用他。


    你看，即使你把孩子送进了名校，念了博士，书上教的东西他都会，公司会不会录用他，还是不确定。


    作为两个孩子的母亲，我很希望我的孩子将来，不管学什么专业，都会具有那些我看中的年轻人身上的一些优秀的特质。


    我也会反思，我不愿意录用的那些孩子，他们的短板到底是什么？我的孩子能不能避免。


    这门课，我就把我在职场和养育孩子这两件事上互动思考的成果，分享给你。


    我们今天的世界发展非常之快，具体体现在：其一是事情发生的速度越来越快，其二是资源的分配越来越不平均。


    # 1. 事情发生速度越来越快：


    +   • 现在我们手上的手机比几十年前登月用的电脑能力还要强；

    • 过去很难的技术，比如导航，现在已经是我们离不开的东西；

    • 过去，比如在工业革命时期，比如火车，要经历几十年几百年才会产生技术变革。但在现在，很炫的新科技，比如人脸识别、无人驾驶，很可能在五年、甚至两年内，就得以实现。


    信息技术让世界变化越来越快，这带来很多人对现代孩子教育的焦虑。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# 2. 资源分配越来越不平衡:


    你可能听说过“80 / 20”原理，即 20% 的大片赚了 80% 的票房，20%的人做 80% 的事，20% 的人挣 80% 的钱。其实现在这个世界很可能已经不是
    “80/20”了，它很可能是“90/10”，甚至是“1/99”。


    信息技术带来的变化是各种资源、人才的集中，使得上层、中层、下层分配不均匀。


    在这种情况下，我们需要给孩子什么样的技能集？这个技能集能够让他将来在某一天，拿到一个好的 offer。不管是一个公司的好的 offer，还是一个人生的好的
    offer。


    总体来说，我这些年，不管是招人还是管理人，算得上阅人无数。真正的好公司，总是愿意给优秀的年轻人机会。


    这样的年轻人，通常有扎实的基础知识，能够长时间地专注，对自己有合适的认识，对未来有规划，有比较好的表达能力、合作能力等。


    以前我们都把技能分成硬技能和软技能。硬技能比如说数理化，软技能比如说表达沟通能能力等，但在新的时代，那个分类有点相对简单，我们的孩子需要更加丰富的技能。


    # 二、面向未来的四类技能


    我总结了工作中需要的那些年轻人的优秀特质，把它概括成四类，这四类技能的关系，就像一棵树。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '形象地说，作为父母，要帮助孩子，长成这样一棵树。


    # # 每个孩子都是一颗树


    ![](img/ff61813f374d7d0d824daf898703641b_8_0.png)


    技能树示意图'
  merge: -1
  img_proc: true
- pgno: 9
  md: '这是一棵顶上有星星的圣诞树，树身分成上下两段。底下宽的那段，叫做基础技能，上面尖的那段，叫综合能力。树的树干为成长心态，而树顶上的星星，指的是身心健康。


    下面我会分别跟你说说这四种技能：


    # 1. 基础技能是什么呢？


    就是在学校里能够学到的那些技能，比如说识字解题，比如说历史地理，还包括写作表达，以及画画、音乐、体育等，这些，我把它们统统都归入基础技能。


    基础技能也可以很难很深，比如说微积分，比如说高等物理。


    基础技能非常重要。学校是一个学习基础技能的好地方，哪怕是大家有各种意见的中国应试教育，其实在教基础技能上，相对也还是比较好的。


    但一个人，仅有基础技能是不够的。


    # 2. 综合能力包括什么呢？


    比如说合作、创造、设计、审美，包括战略、项目管理等。这些技能，你听起来可能觉得比较高深，小孩子需要掌握这些吗？


    在我看来，一个人把多个基础技能合在一起，做成一件事情的能力，或者多人一起组成团队，把每个人不同的技能合在一起，做成一件事情，就是综合能力。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '一群大人在一起，我们造个火箭或者做一个无人驾驶汽车，是做成一件事。

    但小孩小的时候，他们照样应该有综合能力做成一件事。


    举一个例子，对于一年级的小朋友来说，学习用温度计测温度，把这个温度写下来，这叫基础技能，非常简单。但是，给一组小朋友一个任务，让他们用测量的方法，比较得出结论，学校周围到底什么位置温度最高，这就是一个需要用到综合能力的事情了。


    有的小孩负责测室外，有的小孩负责测室内，有的小孩负责测楼上楼下。


    过程中，有时孩子还会出错，有的孩子出门回来以后忘了他测了多少度了，或者他说的温度是80度、90度，不符合常识，还得有人做判断，重新去做。


    他们还要把这些温度列起来，最后总结，到底今天是里面暖和，还是外面更暖和。也许还需要画一张图，展示自己的测量结果。


    你看，这整个的过程，基础技能很简单，但是需要的综合能力很多，需要沟通、合作、发现差错，甚至包括审美和设计。


    很多家长有一个误区：基础技能在学校学，综合能力到公司里工作以后再学，或者长大以后再学。


    通过我刚才我举的例子，可以发现，综合能力从小到大，从幼儿园开始到小学、到中学，是可以跟基础技能一起，同时长大的。一开始做的也许是小事，到长大了才能驾驭大事。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '综合能力强的孩子，在未来后劲会特别足，也更容易在工作中脱颖而出。


    > 东方教育偏重基础技能，西方教育更注重综合能力。其实一个出色的孩子应该同时具备这两种能力。


    这棵树的树干，我叫它成长心态。


    以前一个人读了个博士，那个叫学历，有了学历，找一份工作，然后这辈子基本上就这样安心了，也不会有什么大变化了。


    但是现在，随时随地都有新的事情发生，新的信息出现，新的机会出现，旧的机会也会失掉。一个人如果读完大学以后，会的最多的东西就是大学的了，在这个形势下是不行的，成长心态就变得特别重要。


    # 3. 什么是成长心态？


    首先孩子要意识到，技能、知识不是死板的，人也不是死板的。新鲜的，我不懂的事物，可以慢慢去搞懂。


    人要有主动阅读的能力，不断学习新东西，要有批判性思维，知道自己有什么不足。有了这个不断成长的树干，这棵树才会长大，才不会死掉。


    # 4. 身心健康。


    基本的身心健康，生活快乐，它的重要程度，我想现在越来越多的父母都意识到了。但在这里我强调几个我也归为身心健康的能力和心态。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '许多人都知道哈佛大学著名的研究成果，最幸福的人，其实并不是最聪明或者是最有钱的，而是有最好亲密关系的人，能够帮助他人并感觉到自己价值的人，或者周围有很多朋友的人。所以同理心，是身更健康的一部分。


    另外，孩子在成长过程中，一定不会完全是一帆风顺的。所以，应对挫折的能力，也是身心健康的一部分。


    # 本讲小节


    我从自己多年在高科技公司担任管理工作，面对的真实职业处境出发，从好公司会录用什么样的年轻人这个角度，把一个孩子应该有的技能，比成了一棵圣诞树。


    树身是基础技能和综合能力，树干是成长心态，树顶上还有一颗叫做“身心健康”的星星。下一讲，我会以这个技能集为基础，跟你讲讲孩子教育中最重要的事。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 2. 教育孩子最重要的四件事


    作为一个职业女性，我的职业道路，跟两个孩子的成长完全是并行发展的。


    在孩子十几年的教育过程当中，一个母亲有成千上万的事情要做，可我也有自己发展的需求，一天就那么多时间，我就那么多精力，我得选择做什么，不做什么？


    第二讲，基于上一讲对孩子四类技能的认识，我来跟你分享，什么是家长无论如何都应该花时间和力气做的事，不能放弃的事。总共是四点。


    # 第一件事：价值观塑造


    价值观的塑造，是我们内心认同的东西，做人应该有的基本标准。比如在我们家，善待他人，简单生活，这些价值观非常重要。


    价值观这种东西看上去很大，但其实是需要你从日常生活的点点滴滴中教育和引导孩子。


    这里要注意的是，你传递给孩子的，基本上不是你嘴上怎么说，而是你真正认同什么，怎么做。如果你说一套做一套，很可能孩子也是价值观混乱的。


    # 第二件事：时间管理


    作为父母，也许孩子很小的时候，你还能帮他，但他长大了以后，很多功课你是不懂的，你也没有时间做，而且你也不应该帮他做。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '《如何培养面向未来的孩子》——诸葛越


    那么怎么样才能够让他把自己放到一个很好的轨道上，高效学习，高效做事，高效成长呢？最关键的一点，其实是时间管理。


    怎么教会孩子时间管理呢？有三个比较简单的方法：


    # 1. 让孩子看见自己的任务


    比如孩子有三门功课，那么你就把它写下来，可以写在一张很大的纸上，语文、数学，英语。然后每一门功课上，算一下大概要多长时间。不管是半小时，还是 **10**
    分钟，你把这个时间画出来，比如十分钟一格，半小时就画三格。


    时间是很抽象的东西，对小孩子来说，理解困难，你就帮他用具象的方式呈现出来。 <span style=''color:orange''>可以把时间长短画成大圈小圈，或者长条短条，让孩子看见他有多少工作。</span>


    如果孩子更小，还可以用一些好玩的方法，比如说贴纸、玩具之类的来表示任务。今天晚上有三个任务，做完了一个就可以拿掉一个，或者贴上一个，或者打个勾。


    你一定要用一种视觉的方式让孩子知道他有是多少事。这跟我们大人，在自己生活、工作当中列任务清单是一样的道理。


    # 2. 提前准备


    15'
  merge: -1
  img_proc: true
- pgno: 15
  md: '如果孩子到第二天早上要上学的时候才说，哎哟，还有 5 分钟了，我要带双球鞋，哎呀，还要带一双球袜，这个状态就忙活得不得了，我们的孩子常常就是这样。


    父母要帮他养成做任何事都要提前准备的习惯。最简单的训练可以从准备第二天的物品开始。


    在幼儿园阶段，家长当着孩子的面提前准备，逐步过渡到家长制定规则，让孩子来准备。


    比如每天睡觉前有一个任务，就是想想明天要带什么，提前把书包整理好，并且自己做。


    还可以让孩子帮忙计划简单的事情，比如春节全家出去玩，孩子参与到这次准备过程。包括去哪里玩，怎么买票，需要多长时间。孩子不需要做全部工作，但可以参与其中一部分。


    孩子长大后很可能会愿意为全家计划家庭假期，这些可以帮助他养成做事准备的习惯和技能。


    +   3. 简化和统一规则


    可以给孩子一本自己管理的日志，也可以用电脑，让孩子有意识地记录自己要做的事，要见的人，还要学会分类。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '这样的方法，越大会越有用。比如到了中学，孩子的世界会变得复杂很多。他们不仅要学各种各样的功课，功课的难度也有增加；他们有各种各样的考试；他们还有各种各样的课外活动。


    此时，孩子应该在统一集中的地方，能够简单清晰地看到自己各种各样不同的任务。有需要跟老师打交道的，有的是一个月以后的考试，但要提前准备等。


    如果有一个地方能够让孩子很好地做记录和分类，这样他就能有自己驾驭自己生活的感觉，之后再慢慢地学会自我管理。


    时间管理对孩子的基础技能和综合能力的发展都有非常大、非常好的作用。


    # 第三件事：阅读习惯


    一个人一生也就这么长，一个人就算一天到晚都很努力，他能见的人，能去的地方，能亲身经历的事情，也就是只有这么多。


    如果你希望自己孩子的世界变得很大，能跟经典相伴，与大师为友，纵观古今，遍览世界，唯一能够做到的，而且人人都能做到的，就是阅读。


    阅读与我讲的技能树点树干，就是成长心态也有关。一个人的成长心态，最主要的培养方法，就是阅读。


    帮孩子养成阅读习惯，我有三个建议：


    +   1. 孩子小的时候，睡前故事非常重要。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '每一个小孩都会享受在睡觉之前跟爸爸或者妈妈去好好地一起读一段书， 孩子小的时候可以读很简单的小书，不用每天都是新故事，反而要注重重 复阅读。


    其实很多孩子都喜欢重复的故事，尤其是睡前，他是在熟悉的故事里获得 安全感的。我们还可以跟孩子一起编故事，最好故事的主角就是小孩本身， 他出现在故事里时，会觉得特别有兴趣。


    睡前故事可以让孩子在很小的时候就对阅读产生亲切感，对他们长大后的 阅读习惯养成很有帮助。


    +   2. 让孩子一直有一本正在读的书。


    阅读就应该是一个生活习惯，每天都在做，没时间的时候读少一点，10 分 钟，15 分钟，有时间的时候坐下来好好地、完整地读一本书。


    我和我的两个孩子，都是随时在读书。你去问我们任何一个人，说你现在 在读什么，都可以第一时间给出一个答案。


    这样子的好处，是你并不把阅读看成是给孩子布置的任务，说 2018 年你 一定要读掉这 5 本别人推荐的书。


    他可以根据自己的节奏来读，只要一直坚持，你就会发现，日积月累，一 年下来，十年下来，他就会读了很多书。


    +   3. 不限制，不干涉。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '这一点父母往往很难做到。孩子想读什么就读什么，只要不是有害的内容，其实都没有关系的。不要像学校老师一样，说只有这几本是著名作家作的，你才去读。


    比如说我们老二，喜欢阅读是从读金庸开始的。我觉得这没有什么不好，最关键的是，他从阅读当中享受乐趣，觉得有意思，而且形成了阅读习惯，那么自然而然也会去读别的书了。


    # 第四件事：运动习惯


    并不是说每个孩子都要去做运动员，实际上大多数孩子也不会去做运动员，但每一个孩子必须要有一个到多个他喜欢，并且擅长的运动。


    小的时候，你可以带孩子多试验各种运动，踢球、打球、跑步、游泳都可以。到小学后半期，孩子基本就能决定下来自己喜欢什么，擅长什么。


    到中学以后，很多孩子都是非常忙的。但是所谓的忙，其实也就是一个优先级的问题。在我看来，运动的优先级是很高的。


    运动在孩子成长过程中好处非常多，不仅是对身体好，对大脑思维有促进，而且有利于一些非常优秀的品质培养，比如吃苦精神。


    现在家里条件都非常好，孩子没什么吃苦的机会，但在运动当中，如果想要赢，他会主动要求自己吃苦。


    还有，很多运动需要跟别人配合。在团队中，有时候你做得很好，但别人做得不好，也会输。在运动中，孩子会学会怎么接受失败。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '运动与“技能树”中的身心健康很有关系。


    # 本讲小结


    教育的事情千头万绪，但有四件事情，是父母一定要花力气，不能放手的。

    第一是价值观塑造，第二是时间管理，第三是阅读习惯，第四是运动习惯。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# # 3. 教育孩子不必花大力气的事


    这一讲，要说说教育孩子不必花太多精力的事。


    之所以要讨论这个话题，一来我是个职场妈妈，很多事情，我实在没那么多时间管。


    但更重要的是，从现代职场的要求，和我自己在孩子比较大之后，回过头做出的反思，再看自己放了手的那些事情，发现不管确实不但没有关系，而且，管多了反而会在孩子的成长中造成负面影响。


    所以，这一讲，我来说说父母不应该花太多精力的事情。包括陪孩子做作业，生活上无微不至的照顾，还有一些身教大于言传的事，以及一些被体系量化了的事，一共四类。


    # ## 一、陪孩子做作业


    有一阵朋友圈有个刷屏的新闻，说陪孩子写作业，妈妈陪点心梗住医院。上一天班累得精疲力竭，回家还要陪孩子做作业，已经成了很多职业女性沉重的负担，也造成了很多妈妈和孩子之间的矛盾。


    作业，当然各家不同，各个学校和老师的要求也是不同的。但是，总体来说，我建议不陪孩子做功课，或者少陪。作业是他的，是他应该学的事情。


    关于孩子的功课，我听到的来自老师最好的建议是：即使孩子错了，你也不要去改，否则老师就不知道他什么懂什么不懂。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '如果孩子每天交上去的，都是完美的作业，老师其实根本没办法了解到底是孩子懂了，还是家长懂了。


    但父母真的能放手的话，有个前提，就是你从小要灌输给孩子一个观念：学习是他的事，不是妈妈的事，妈妈有妈妈的职责，学习是他的职责。


    即便孩子有不懂的问题，你也不应该包办代替，你完全可以说，“这个问题我也不肯定，可以给你提两个建议，你可以想一想，但是我不负责，你也完全可以不听我的建议。”


    总之，作业的责任是孩子的，家长是不应该全权负责的。


    对于那些学校要求家长看作业的情况，我可以理解。但我们只负责孩子有没有完成作业，至于做得对不对，还是让孩子自己去负责。


    # 二、无微不至的照顾


    现在有些父母叫“直升机”父母，他们不断盘旋在孩子头上，不肯离去。说实话，在工作场合，我们也会很害怕遇到这样的员工和他们的父母。


    这种家长，在全职妈妈当中可能更多。但总体来说，尤其是独养孩子的妈妈，很容易变成“直升机”父母。


    女性容易过于焦虑，这个地方不能去，那个东西不能吃，学校里是不是受了委屈，你这里说话又不对了，你那里做事又做错了，这个做得很好，为什么老师不给他奖励等。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '你把精力都花在焦虑孩子上，哪里还有时间顾自己？


    更糟糕的是，这样的父母，等于是他们要想帮助孩子清除生活、学习上所有的障碍。但这种教育方法，恰恰效率非常低下，专门培养了一群没有能力的孩子。


    事无巨细，管得特别多的家庭，一般孩子缺乏主动性，长大也很少会有大出息。


    孩子原本是一张白纸，你如果帮他清除了所有的障碍，他就会认为世界理所应当是一马平川。小的时候遇到矛盾，父母帮他去解决，那到大学呢？到工作呢？如果没有别人帮他去解决的，他就可能会变成一个爱抱怨的人。


    所以，建议放手生活上的琐碎小事，只管大面上的，比如健康、品德。其余的事，我们要忍着不去管，只要不出什么大问题就可以了。


    # 三、可以身教的事


    教育孩子，有的是言传，有的是身教。


    有一大批事，比如怎么处理金钱、礼貌和朋友。其实小孩是不会听你怎么说的，你骂他多少句，或者说教育他多少都是没有用的。这类事，不用花力气教，你做好了，孩子自然就模仿了。


    比如，你如果花钱大手大脚，然后去限制孩子，哎呀，这个东西你要想一想，你要算一下，他是不会听的，他只会学习你。比如你对别人很有礼貌，他也会完全copy你。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '你交什么样的朋友，你在私下里对朋友是什么样的评价，这些事情孩子每天都睁大眼睛，竖着耳朵，在看在听。


    所以，有一大批的事情，根本不需要把它变成理论、买成书去教孩子。你只要自己做好了，孩子就会做好。你想让孩子怎么做，你自己怎么做就可以了。


    相反，你自己做不到，天天教育也不会成功，除非把孩子变成两面派。


    # 四、书本上严格量化的事


    你翻开一本育儿书，里面说，孩子在第 23 个月的时候，应该会“把一个小球向前踢”。如果你的孩子在第 24 个月的时候，还不会踢球，你是不是很紧张？


    如果他只能踢到大球，踢不到小球，那你怎么办？如果隔壁小明 20 个月就会踢球了，那你的孩子还有没有希望？


    今天的父母，常常很焦虑。尤其是独生子女的父母。因为没有别的比较和参照，只能看书上说的，或者看看隔壁家的孩子。


    我给你的建议是，不要去迷信那些很具体的标准，试着把那个标准放松，比如加、减六个月到一年。即便 24 个月不会，相信你的孩子在三岁时一定会踢一个球的。


    另外，如果你跳出来，在稍微远的时间距离上看，每个孩子真的都会长大的，不需要让他在 3 岁的时候会 5 岁的事，他该成长多快就成长多快。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '做父母的，能够享受跟孩子成长的过程就很好了。


    # 本讲小结


    在我们这个父母很多时候都很忙的时代，除了坚持做那些重要的事，我们更要学会放手。


    具体的作业尽量不用去管，生活琐事尽量少管。能身教的事，就不口头唠叨。


    更不用迷信育儿书上那些严格的标准，既不花太多时间让你的孩子跑赢标准，也不用担心他不达标。没有孩子长不大的。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# ## 4. 用工作方法培养孩子


    我在写《魔鬼老大，天使老二》这本书的时候，一直在思考，我这本书到底跟其他的亲子育儿书有什么不同。


    我希望它不是一般的妈妈书，不是一个完全以孩子为中心的妈妈写的书，也不是一个教育专家或者老师写的书。


    我学的是计算机专业，一直在从事互联网、新媒体等与先进的技术相关的工作。我周围的人也是如此，世俗称之为“精英”。


    可以说，我不是要把孩子培养好了变成“别人”，而是希望把他们培养成我们周围的人。


    正因为我本人在教育背景和职场上都走得比较远，我能够清晰地看到很多问题。在公司做了很多年的管理，发现在工作中学习到的一些方法和思考，完全可以应用到教育孩子上。


    这一讲我想分享三点：


    +   - 从长远的工作的角度看问题，学习到底是为了什么，然后怎么做；

    - 像公司里一样，保持持续的沟通；

    - 对孩子的尊重和授权。


    # ### 一、以始为终的学习目标


    其实我一直非常重视孩子的学习，认为孩子一定要学习好。但这个“好”，不是体育竞赛，不需要去争所谓的高分数、第一名。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '孩子如果自然考得很好，那是好事。但是学习和体育是不一样的，一个班100 个孩子，可以每个人都学懂了，学得很好，可以有 80 个学得很好，不用说一定要有人学得不坏。


    这是为什么呢？因为在工作当中看到，学习是为了让孩子获得我说的那个"技能树"上所有的技能，包括基础技能，包括上层的那些综合能力，也包括一些成长的技能。


    总体来说，我希望孩子通过在学校的学习，还有家里的各种学习，获得那些技能。这些技能，不管是到了工作当中，还是将来在生活当中，都是很有用的。


    怎么拥有这些能力呢？


    我讲一点学习方法。我把文科和理科分开。


    +   1. 文科确实是要靠积累的，学文就是要融会贯通。


    比如语言、人文、地理，学好的基本方法就是阅读、讨论、思考、练习，不断做。


    想要学好一段历史，除了了解这段历史，记住它以外，最好的办法是要大量了解这段历史前后的各种信息，了解不同的人对它的不同的看法。


    所以，学好文科不是一朝一夕的事，考试怎么样其实是没有太大关系的，是多年积累的结果。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '我给我的孩子学文科列的目标基本上就是实用，要能够写好文章，能够清晰地交流，能有自己的创意和思考。


    2. 但是偏理科的项目，比如说数学、物理、化学等，它们后面的概念，往往是以前面的概念为基础的。


    一个孩子三年级没有学懂的话，到了四年级，作业不会做，考试考不好，父母花很多时间帮他去重复，补四年级的课，也许分数能提高一点，但是这就像是一个没有打好地基的楼一样，往上越搭越重，孩子就被压垮了。


    所以，如果孩子学理科有一些小的问题的话，要看一下是不是前面有一些概念没有搞懂。


    有人专门建议，理科教学不要把孩子按年级、年龄来分，一定要学懂了一个概念再往后学，速度可以放慢，但一定要真正理解。


    总的来说，学习不是为了名次，而是为了真正懂得，是为了真正学好，在工作中使用。这就是从工作中学到的第一点，看到了学习的真正目的，你就会知道小孩应该推什么，不应该推什么。


    # 二、持续有效的沟通


    我在公司做一个管理者，每周会花半个小时到一个小时跟直接下属谈话。有时候会谈工作和项目，有时候也谈他遇到的问题，有时候谈他的成长，有时候会谈我对他的希望。这个安排哪怕是再下一级的员工也会有，可能是每个月，也可能是不定时的。'
  merge: -1
  img_proc: true
- pgno: 28
  md: '公司之所以要设定这种规则，是因为这些沟通非常有用。通过它，我能够比较深入地了解情况，对下属来说，能够有一些特定的时间或者渠道去提出问题，或者是汇报一些结果。


    但是回过头来想一想，很多父母对待自己家的孩子，反而沟通是严重不足的。


    小的时候，你觉得孩子小，什么也不懂，只是帮他们做很多事，做饭、做衣服等。等到他们大了以后，比如到了青少年阶段，他们可能很忙，或者玩电脑，宁可跟同学朋友聊天，也不一定理你。


    常常聊天是这样的，父母问，“学校怎么样啊？”孩子回答“很好”，然后就没有然后了。


    但你想想，你在公司里，跟老板，跟同事，跟下属都不是这么沟通的。你不可能你跟一个人说，“你怎么样？”他回答“很好”，就走了。


    要把工作场合定期沟通、保持交流的习愤，带回家，用在孩子身上。


    至于具体怎么做，孩子不同的年龄阶段，可以有不同的方式。


    +   1. 婴幼儿的时候，爸爸妈妈能做的最好的方式是陪伴，是和他们一起去看这个有趣的世界。要多跟婴幼儿说话，不厌其烦地解释看到的世界，哪怕你的孩子还不会说话。


    +   2. 学龄前的孩子，讲故事是很好的方式，你甚至可以跟孩子一起编故事，让他们做故事的主角。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '你不用怕编着编着就没话说了，我分享一个我们家的聊天诀窍，跟孩子做各种问答，比如"我们来讲十个圆的东西"，"一起来说十件鱼不会做的事情"，这样的题目没有标准答案，既有趣，又可以教孩子一些概念。这个游戏，我们家很多年都玩得乐此不疲。


    +   3. 孩子上了小学以后，应该保持睡前谈话的习惯，听孩子分享他一天的见闻。


    这么做，能帮孩子整理他一天当中的经历，发现那些重要的事，既能帮他解决问题，还能发展他的表达能力。


    +   4. 孩子到了中学后，很多家长和孩子的沟通变得不是很通畅。这个时候，更加要让沟通变成习惯。比如说可以固定时间，每天晚上找一个睡觉前的时间聊一聊，或者周末找个时间聊一聊。


    不要很刻意地一本正经地说，我们谈谈吧。我建议跟孩子一起做一些事情，比如说一起做饭，一起去买菜，一些日常的事情。你跟孩子一起做 事，你会发现做事的时候，会自然而然地谈到一些关于学校的事，朋友的事，别人的事，他正在形成的世界观和看法。


    +   5. 和大孩子的沟通一定要注意几个方面：


    +   * 多听少说，不要批评批判孩子的观点。


    这点是很多家长都做不到的，他们都是忙于把自己的观点加在孩子头上。


    +   * 不要有了问题才沟通。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '比如说学校学习不好，或者是跟别人有矛盾的时候再说，应该是在好的时候就随时沟通。很多时候大家就是讲一讲个人的生活，包括你自己的，你的工作，你遇到的问题也可以跟他聊一聊。养成这种习惯以后，当他真正遇到问题的时候，你自然而然就会了解了，就会这样做了。


    持续不断的沟通非常重要，沟通要一直做，要很自然地去。


    # 三、充分的尊重和授权


    我在公司带团队，有很多员工比我年轻很多，他可能比我懂得少。但是我还是会很尊重他，因为我知道，他是一个和我不一样的人，他有他自己看问题的角度和做事方法。


    但是我们在家里做父母，常常会认为孩子是自己的私有财产。虽然我们很爱孩子，很想保护他们，但是免不了就觉得他应该听我的，他应该跟我想的一样。


    其实你退一步想，跟年轻的同事一样，孩子也是一个独立的人，在他有能力的事情上，父母应该让他独立运作，给他授权，你只定大方向就好了。


    我家的老大其实小的时候蛮难管的，他很小就很有自己的想法，不爱听你的，尤其在细节上，你要去拦他，要阻止他做一件事，或者推他去做一件事，都是很难的。这个也造成了很多的矛盾冲突。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '但是从初中开始，我基本上就放手了。我定一些大的目标，比如学习要学好，体育锻炼要做，当然品德上不能有问题，大事情做好了，具体的东西我不管了。


    后来发现这种平等对待的方法，非常有助于这个孩子的发展。


    他很多事情都做得很好，很多事情他做的其实跟我想的不一样，他并没有去做我想让他做的事，但是他把他自己想做的事，同时也是很正确的事情，做得非常好。


    父母应该这样想象，我们跟孩子也像在公司里跟其他人一样，是一个团队，大家是有共同目标的。


    这个共同目标包括孩子的成长，也包括我们自己的成长，要全家一起做，但是大家能力不同，分工不同，孩子并不需要要跟大人想的完全一样。


    # 本讲小结


    在公司，尤其是管理做了这么多年，有一些工作方法，是可以拿来管教孩子的。第一，意识到学习最终的目的，真的不是为了考试，而是要孩子学懂，父母要做的是真正帮助他们学懂。


    第二，要跟孩子保持长期频繁的沟通，这是非常有必要的，也是有方法的。


    第三，要像尊重公司的同事一样去尊重孩子，帮助他们独立完成任务。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 5. 养育孩子反向提高职业能力


    这一讲，我会说说，这些年以来教育孩子，对我的职业生涯有什么帮助，相信我所经历和总结的内容，对别的职业女性也会有帮助。


    总体上，不管是女性自己，还是整个的工作环境，都有一个很大的误区：大家觉得因为时间就那么多，要么花在孩子身上，要么花在工作身上。


    所以孩子是分散大人的时间和精力的。尤其做了妈妈，就必须在孩子和工作之间，做出取舍。


    有些女性，做了妈妈之后，就重心转移，觉得要以家庭和孩子教育为主，工作上对自己的要求就放松了。而很多公司，不管是明里或者暗里，也觉得一旦生了孩子，女性的职业竞争力就会下降。


    但是，我想要说的是，很多人可能没意识到，养育、教育孩子的过程，对父母自身技能的提升，其实是一次难得的机会。


    # 一、情绪管理的提升


    首先，教育孩子让我们自己变得更成熟。


    养育孩子，其实是父母的一场自我修行。在没孩子之前，很多年轻人一帆风顺，所以也受不得委屈，没多少耐心，能把自己照顾好就不错了。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '但是有了一個小孩，我们就必须要负责。而且，小孩开始是不会讲道理的，我们必须要 有耐心。小孩在长大，我们既要爱他，又要给他纪律；既要给他安全，又要让他独立。


    小孩带来的一万件做不完的事情，也让我们做父母的人变得更加能干。这种情绪管理的能力带回办公室，让我们变得更加成熟，更加能承担工作当中的压力，开化误解，担当重任。


    # 二、学习方法和教育理论的更新


    观察和参与孩子的成长，是接触最新的学习方法和教育理念的直接机会。我就是 在观察我的孩子如何成长的过程中，总结出我在第一讲提到的“技能树”的。


    大多数做父母的人，离自己上小学、上中学已经过去了十几甚至二十年。这中间， 教育方法和教育理念一直在进步。离开学校，你不一定有机会系统接触到。而且，我们小时候
    虽然自己天天上学，但常常并不真正不懂得，人到底是怎么学习的。


    观察和参与到孩子的学习当中，就让我们有机会接触到最新的学习方法和教育理念。这些 新法新观念，对于父母自己的终身学习，也是很有价值的。


    我在自己的职业生涯当中，有一段时间要从做技术转向做产品。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '我并没有做产品的学习背景。幸好当时我的小孩有一门课，他当时上初中，这门课叫《Design and technology》--《设计和技术》，他们花一个学期的时间做一件事情。比如第一个学期就做了一个盒子，第二个学期做了一盏灯。


    开始的时候我也不是特别理解，为什么要花一个学期的时间，就做这么一件小东西。


    后来，我因为看了孩子是怎么做的，也看了他们的作业，又跟老师聊过后，我才发现，这其实就是一个缩小的产品流程。


    他们从选材开始，是木头的还是玻璃的，到制作，然后到营销，再到分析这个东西有什么用等，等于这就是一个完整的产品课。


    现在的学校，已经在用小孩能够理解的方式，教了他们一个产品从头到尾的设计生产过程。


    当时孩子学这门课的时候，我正好从做技术转到做产品，刚开始其实也不是很容易的。我就从孩子的课上吸取了很多有意思的角度。


    所以在培养我本人的上层技能，包括产品设计、从用户出发、沟通，包括合作方面，孩子的学习，给了很多启发。


    再举个例子，比如成长心态。因为孩子是从 small 到大，一天天成长，从不会到会，父母看孩子比较容易有成长心态，但轮到我们大人，反而容易死板。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '我们这行最近有很多的讨论，说通信行业比较成熟，没什么大发展 了，可能有些人就很恐慌，但是你其实可以转型互联网行业。这两个行业都是技术行业，很多方面也很接近，你为什么要把自己看死了，觉得换一个行业很难呢？


    你要是抱着一种成长心态，说我能学会，你就完全有能力转行热门专业。你要是有一种自我审视的方法，知道我原来没有这个基础，我需要在哪个方向努力，如何找到合适的方法，设置合适的计划，你就可以从一个旧的行业转到新的行业。


    这不就是我们一直想要教给孩子的成长心态和批判性思维吗？这些技能同样适合转工作类型，比如从技术转向产品，从产品转向管理等。


    我从教育孩子这边得到了不少的理论基础，加上和他们一样的开放心态，造就了我这些年丰富多彩的职业生涯，从技术、产品、管理到创业，一路做过来。


    # ## 三、团队协作的能力


    教孩子的技能或者想法，也可以用在公司员工身上。


    我现在是在北京，管一个纯技术的研发团队，有很多人都说这个地方很像学校。因为我们有各种各样帮助员工成长的计划。


    我的员工都有非常优秀的教育背景，是特别好的程序员，很聪明，世界一流。但是，他们也还是需要成长，包括对公司业务的理解和沟通，许多都'
  merge: -1
  img_proc: true
- pgno: 36
  md: '是我所归类的综合能力的培养。所以，我们这个研发中心设计了许多员工成长计划。


    +   * 初级员工：教他们有效开会，发邮件；

    * 资深员工：影响力，项目管理的培养；

    * 管理者：情景管理，战略思维等。


    在这些各种各样的员工成长计划里边，我起到了很大的作用。为什么我能够很系统地看出培养员工哪些技能呢？因为我用的是和教孩子同样的一颗“技能树”。


    # 本讲小结


    教育孩子，对一个人的职业生涯其实有非常大的帮助。你能变得更成熟，更有能力管控自己的情绪，也有机会接触到最新的学习方法和教育理论。这些可以用在自己身上，也可以用在员工身上。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# ## 6. 职场妈妈的时间管理


    你好，我是诸葛越，欢迎来到《如何培养面向未来的孩子》。


    一个职业女性，做了妈妈之后，会明显地感觉到时间不够用，因为在照顾养育孩子上花了大量时间，根本就多了一份近乎全职的工作。


    孩子要养好，自己的发展也不能耽误，怎么管理时间，就成了一个重要问题。


    我会跟你分享三个要点。首先是要事第一，抓住重点。其次是要大胆放弃，简化生活。第三点是要找到方法，优化方案。


    # ### 一、要事第一，抓住重点


    首先你要承认现实，在你有了孩子，又同时在工作的这些年内，可以说永远都有 100 件事情在等着你，你是不可能什么都做好，什么都有的。咱们得认清现实。


    在这个现实的基础上想一想，退后一步，什么是对你最重要的三件事，并且把它们排出顺序。


    比如对我自己来说，孩子小的时候，他们对我非常重要，工作对我也很重要，但是孩子大于工作。还有我觉得健康也很重要，那么它可能排在第三位。这三个就是我不愿意放弃，并且最重要的事，其他的事，就会次要一些。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '在想好了最重要的三件事之后，你在很多时候就可以不纠结了。这个原则，主要目的是解决冲突。


    举个例子，现在的学校都有家长会，频率还不低。要是家长会在晚上，你可能没问题，如果是在白天工作时间呢？


    我们前面说了，孩子很重要，优先级排在第一，那你就预先把这个时间留出来，这个时间段尽量不开会，不约人，如果错过什么重要的人或者会，第二天再把它补上。


    再比如说，工作跟朋友聚会冲突了怎么办？


    如果你的工作优先级排在朋友聚会前面，那就安心地放弃朋友聚会。不是说不完全社交，只是在冲突的时候迅速地做出决定。


    这么做的好处，是你早就想好了，不用每一次在冲突发生的时候都去做选择，只是尽量把排在后面的那个事情也做好就可以了。


    而且因为已经排好了，你可以不后悔，不纠结。比如，你不用自责说：家长会也没听到什么，今天还不如上班呢。


    所以，第一点要想好你的优先级，最重要的是哪几件事，它们是怎么排列的。


    # 二、大胆放弃，简化生活'
  merge: -1
  img_proc: true
- pgno: 39
  md: '先给你一个建议，老觉得时间不够用的人，你试试仔细记录下一周的每一天、每个小时你都在干什么。我相信，只要做这个记录，你就会发现，这当中有很多浪费掉的时间。


    比如你在刷朋友圈，你以为没有花多少时间，早上起床不过 10 分钟，路上又 10 分钟，然后下午和晚上又花了 20 分钟，东一点西一点，一天下来，可能一两个小时就没了。


    你也没意识到，哪怕只有半小时，累计一下，一个星期有多少，一个月又有多少呢？


    说到放弃，不是一件件让你盘算，那样又要浪费不少时间了。最简单的办法是，整体地放弃一类事情。


    比如拿我自己举个例子，我永远不去买打折的物品，不花时间到网上比价。这并不是说我就买贵的东西。我其实是买很简单的、必要的东西，只要是特别有必要用的，看看价格，如果我可以负担，就买；买不起，就不看了。


    如果把这类时间省下来，我相信很多的女性朋友其实都可以省下大量时间。


    再比如说，家里如果有阿姨，你也可以不做饭。甚至，如果家里没有电视，就可以省出很多时间来。真有特别想看的剧，偶尔上网去看一下就好了。


    当你发现你放掉一大类的事情的时候，时间就会多出很多来。


    当然，放掉了一整类的事情，也不用纠结。不用想，不看剧，我是不是就跟别人没话说了呀，女人是不是一定要做饭呀。想想前面的第一条，你已'
  merge: -1
  img_proc: true
- pgno: 40
  md: '经排了优先级，剩下不在优先级里边的，尽管你觉得这件事我好像应该做，其实是可以放掉的。


    放弃了一些事，会不会有遗憾？


    当然有。比如说我刚回国的时候，报名参加了一些行业协会。我们计算机行业里有很多行业协会，还有各个公司之间热爱技术的人的协会，其实那些都是很好的活动。但是后来我发现这类活动基本上都是安排在晚上或者周末，因为白天大家都在上班嘛，它跟我的孩子冲突了，我就放弃了所有这些行业协会的活动。


    是不是因此我的职业受到了影响呢？


    也许会，我可能就沒有认识一些人，可能有一些事情没有做到 100 分那么好。但是，它符合我的优先级。


    所谓放弃，是放弃一些其实你喜欢做，认为应该做的事。但一旦想清楚，就不要每次遇到这种事的时候，又要纠结。


    # ### 三、找到方法，优化方案


    有一些事情必须得花时间做，但你可以找到方法，做到优化，然后不断执行这个方法，让它更加熟练，更加优化。


    举一个例子，对于女性而言，美容、着装等，都有简化的办法。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '比如，你可以买比较多黑色和白色，容易搭配的衣服，买质量高的，减少数量。


    一条黑裤子，可以搭任何颜色，任何花色的衣服。一件白衬衫，任何场合都不会过时。再加上一两条百搭的围巾，就够了，每天花在搭配衣服上面的时间就会少很多，出门还都挺高档漂亮的。


    再比如出门要化个妆，花一个小时化妆，可能能画到 90 分；但是花 10 分钟时间，把粉底、眉毛、口红画了，其实就可以画到 80 分，这是我跟专门做美妆的朋友学来的。那你就对自己说，我就接受这个
    80 分的我，每天只花 10 分钟就好了。


    那些不想砍掉、不能砍掉的事，就要想办法优化方案，缩短时间。


    # 本讲小结


    时间管理是个大话题，关于花在孩子身上的时间，我在前面第二讲和第三讲说到的那些方法，原则跟这一讲其实是相通的。都是抓住几件最重要的事，勇敢放弃一类事，简化、优化一些不得不做的事。


    如果你能做到，你就会感觉到，虽然我确实还有 100 件事情要做，但是我知道我在做最重要的事情，我知道我没能做到 的那件事情是我主动放弃的，我知道我的生活还是在一个比较不错的，能够驾驭的状态。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 7. 组建团队，不要一人战斗


    在今天的公司文化里，非常强调团队协作，我们要面对的工作非常复杂，几乎没有什么人能完全独当一面。同样，回到家里，养孩子也是个复杂的系统工程，聪明的女性，要学会建立一个强有力的支持系统。


    通常，妈妈们，不管是职场妈妈还是全职妈妈，会理所当然地认为，教育孩子主要的职责是自己的。但即使你觉得自己负主要的职责，妈妈不是，也不应该是唯一的负责人。


    就像在公司里面，想要做成事，一定要一个团队来一起做一样。我们在家 里教育孩子，也需要利用一个团队。


    谁会是你的队友？


    我把他们分成三类：


    +   一类是孩子的爸爸和亲戚、长辈；

    第二类是一些可以花钱雇来的人，比如像保姆、小时工等等；

    第三类是邻居和朋友。


    # 一、依靠伴侣和亲人


    +   爸爸应该担负跟妈妈同样的责任和义务。


    每个妈妈都希望，家里能有一个好爸爸，非常喜欢带孩子，能够减轻妈妈 的很多负担。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '但是，通常爸爸们不是特别知道怎么做，而且他的做法可能跟妈妈也不太一样。比如爸爸带孩子，可能会比较粗，带着孩子出去跑、玩什么的，妈妈会比较细致一点，更在乎一些生活细节。


    好的策略是爸爸和妈妈分工，并不是说所有的事情都要一半一半，首先要让爸爸知道，他能做什么，需要做什么，职责应该是清楚的。


    比如说，你家里可以分配，周末有一天，由爸爸从头到尾来带孩子，或者分配接送孩子是他的事，或者晚上的睡前故事由爸爸讲等。具体每一家怎么分工，根据各自的情况而定。


    但爸爸其实应该在孩子教育当中起到非常大的作用。


    但妈妈们要记住，不能强求爸爸要跟我们的方法是一模一样的，这样才能让他有更多的动力，去跟孩子一起成长。


    +   2. 除了爸爸，还有长辈是可以帮忙的。


    在我们家，我们孩子，在 1 岁以后到 3 岁上幼儿园之前的这段时间，都是由我的妈妈，还有我的公公、婆婆一起来帮着带的，我非常感谢他们。我想，这对大多数的职业女性来说，都是非常强有力的支持。


    长辈的帮忙，让我们能心安理得地返回职场上班，孩子在家里也非常放心。


    而且，请长辈帮忙一起带孩子还有一个好处：孩子能够了解到，除了爸爸妈妈之外，还有其他的亲密关系。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '当然，长辈帮着带孩子，确实会有很多的矛盾，两代人带孩子的方式不一样嘛。一般来说，老辈人会比较宠爱孩子，年轻的父母更倾向于立规矩立得多一点。


    怎么处理这种矛盾呢？我有两个建议：


    第一点，摆正位置，明确第一负责人。


    带孩子这件事，第一负责人始终是父母，长辈是来帮忙的。


    这个位置摆正了，那就很明确，规矩应该是由爸爸妈妈树立的，遇到冲突的地方，要耐心地跟长辈谈谈，求得认同和支持。


    第二点，要心存感激，该让步就让步。


    两代人带孩子当然有一些矛盾，但多半也不是什么大事，比如说长辈要给孩子吃糖，在后面追着喂饭什么的，这个没有完全的对和错，它可能不符合你从书上看来的育儿理论。但是，一两次也不会有太大的问题。


    从正面来想，长辈帮你带孩子，减轻了多少的负担？不光是家务，而且是心灵上的安慰，你知道你的孩子是在很安全的地方成长。有了这个正面作用的肯定，一些小事上就可以稍微让一让。


    你希望长辈能理解你，同样的，你也要理解他们，这样关系就能处理得比较好。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '在孩子上幼儿园之前，0 到 3 岁这段时间，长辈的支持还是非常重要的。这也是很多女性可以重回职场的保证。


    但是多说一句，想要长辈帮着照顾孩子，请他们来住在你家里，是更好的选择。我比较反对把孩子完全交给长辈，长时间跟爸爸妈妈分离。这种方式，不光会造成长大以后跟父母的隔阂，也不利于你对孩子的教育。


    # ## 二、善用社会资源


    如果能用钱解决的一些事情，在经济条件允许的情况下，其实用钱解决问题挺好的。不管是保姆，还是钟点工，能够负担起一些帮忙接孩子、打扫卫生、做饭的工作，就能把你自已解放出来。


    杂事其实非常花时间、精力。能用钱解决，就能给你自已腾出手来，在职业上有更好的发展，或者把精力花在教育孩子上，花这个钱是非常值得的。


    不管是小时工还是保姆，对我们都有很大帮助，是团队的重要成员，我们对他们是充满感激和尊重的。平等尊重地对待他人，恰恰是我们培养孩子价值观的重要部分。


    # ## 三、借助友邻支持


    关于养孩子，有句英文，"It takes a village"，就是要有一个村子的人来养这个孩子。


    孩子不是完全只属于我们自己，属于家庭，他也属于社会。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '父母应该有意识在自己家附近，找到几家非常要好的朋友，孩子差不多大就行，也不一定非要同学，男孩儿、女孩儿都没有关系，但是至少能玩到一起。然后这几家就可以形成一个比较亲密的支持系统。


    比如你真的没有时间，晚上有个会，那么孩子就可以暂时放到别人家去，或者别人家有个大人过来，帮你照看一下。有时候，孩子放假，大人不放假，如果有的家长有空，就可以带着几家孩子一起出去玩。


    当然，你也要同样这么做，在别人需要的时候，你也伸手去帮别人。


    建立这种支持系统的好处，不光是可以减轻自己的负担，而且，现在的孩子，要么是独生子女，要么兄弟姐妹也就一个两个，通过这种方式，他就能跟其他孩子形成一个比同学更加亲密的关系，可以一起到人家吃吃饭什么的，是一件蛮好的事情。


    首先孩子们会很喜欢，其次他们也能看到不一样的家庭情况。比如说，你的孩子到朋友家，看到别人的妈妈对一件事情要求很严格，然后他就会反思，会想那个妈妈不一样。


    孩子不需要只接受一种正确观点，或者是说只接受你的这种观点，孩子也不应该只了解一种最优的生活方式——这是应该做的，其他都不应该做。哪怕其中观点有矛盾，能分辨出不同，孩子才能慢慢形成他们自己的判断力。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '所以，聪明的妈妈，不是把所有的责任都揽在自己身上，而是要学会调动爸爸的潜力，正确地依靠长辈，用钱解决一些问题，然后主动地给自己家建立起一个朋友邻居的支持系统。


    # ## 总结


    这门课分析了未来职场，需要孩子具备什么样的基本技能，如何抓大放小，如何有效管理时间，如何把管理孩子和自己的职业发展相结合，以及，如何利用其他人来分担职责。


    其实，这些东西不光对妈妈们有用，对爸爸们同样有用。不过，大多数中国家庭，承担孩子教育职责的，主要还是妈妈。


    回到女性自身，我们一定要做保持自我成长的女性。


    生孩子意味着生活复杂性的增加，一个孩子的到来，生活中的事可不是多了两三倍，而是十倍不止。不是每个人都能闯过这一关。


    我们需要处理更复杂的人际关系，不能全由着自己的性子。我们需要处理以前从未见过的场景，一刻也不能放松。我常常开玩笑说，妈妈是全家的总管，是世界上最能干的人。


    然而，交给你管很多的事情，并不代表着管理能力的增加。实际上，在职场妈妈里，不少人放弃了自我提升，借口养育孩子，降低在职业上对自己的要求，自我设限，自己选择做简单的工作，不再参与那些有挑战的工作。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '一些年过后，孩子是长大了，但妈妈可能会抱怨，公司里比她年轻很多的人做了她的领导，她甚至觉得是孩子拖累了自己，却很少反思这些年来，自己是否真正提升了技能和视野。


    从我自己的职业成长经历来看，不能因为繁忙，就对自己的提升掉以轻心。归根结底，这是一个意愿的问题。当你想做一件事，你自然会找到时间，找到方法。


    关于自我提升，再给你几个实际建议。这些是我多年来看到的女性在职场上最关键的技能需求：


    +   1. 要增强自己对行业的了解，多阅读，多交流，不要在知识上落伍；

    2. 要在做事方式上大胆一些，不要怕出错；

    3. 不要强求自己，但也不要怕在适当的时候担任领导职位。


    能够同时游刃于职场和家庭之间，从来就不是一件容易的事，但这是一件很有回报的事。


    真正强大的女性，会把养育孩子当做提升自我的机会，重建生活和工作的秩序。


    祝你坚强，祝你好运。'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 答疑一：孩子沉迷电子产品，家长怎么管？


    孩子的教育真的是很多用户关注的大问题，从课程上新以来，后台就收到了非常多的反馈和学习心得，还有很多用户听完课后，提出了自己苦恼来向我咨询。


    在整理了大家的问题后，我发现有些问题还挺有代表性的，所以我就想来开设这个课后答疑，再来解答一下大家养育孩子过程中遇到的问题。


    这是课程的第一次答疑，我想说说关于“在这个信息时代，孩子该如何使用电子产品？”这方面很多人问。我选择了提问中一个很具有代表性的，来做解答。


    有一位用户这样问：


    自己的小孩特别沉迷游戏和玩手机，请教老师有什么好办法呢？


    孩子沉迷电子产品是一个被问到非常多的问题，因为现在的小孩，从“小小孩”到“大小孩”都是经常容易花大量时间玩游戏，看视频，用手机和朋友聊天等，这些活动会花掉孩子大量的时间。家长们对这个问题很焦虑，不知怎么办才好。


    我的看法是这样子的：


    首先，我本身是做互联网产品的，所以非常了解大批互联网媒体和社交产品的目的，就是抓眼球，让用户呆在里面越久越好。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '而孩子因为还缺少自控能力，就自然成了这些电子产品最好的目标。目前所有相关的研究，也都把电子产品的过度使用负面地联系到孩子的学习成绩和健康。


    它会导致注意力不集中，缺乏社交能力，缺乏深度思考能力。这是真实存在的问题。


    所以我本人认为家长一定要控制孩子电子产品的使用。


    其次，我们生活在这个信息社会，把孩子隔绝于电子产品是不可能的。一方面他们的朋友都在用，这是他们社交的一部分；另一方面，他们确实也需要学会使用这些工具。


    不能把孩子和电子产品完全隔离开，但又要想办法去控制使用，那你该怎么做呢？


    我具体的建议是这样的：


    首先，先要明确一点，年纪较小的孩子和年纪大的孩子，你要区别对待。这里主要的孩子大小分界点是小毕业前后。


    # 一、年龄较小的孩子


    这个包括上小学之前的孩子和在上小学的孩子。这个年龄段的孩子，家长需要比较严格地控制电子产品的使用。包括：


    +   1. 不给他们属于他们的手机或者是 pad，用的时候需要找大人。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   2. 大人决定他们可以玩什么，不可以玩什么。


    孩子可以提建议，比如朋友们也在玩的游戏自己能不能玩，但是需要大人来判断可不可以帮他们安装；


    现在市面上有不少孩子可以边玩边学的益智游戏，建议家长先自己尝试一下，或者和别的家长交流，帮孩子挑选合适的游戏产品。


    +   3. 限制时间。比如明确规定每次只能玩半小时，时间一到就必须停止。给孩子讲简单的道理，比如，这是为了保护眼睛。


    我必须指出的一点是，在孩子不玩电子产品的时候，你就必须安排好孩子的其他业余活动。


    比如说你可以带孩子去户外玩耍，或者和他们玩玩具、读书、画画等等，这些活动不仅有助于帮助孩子养成好习惯，也还能增进亲子关系。


    其实不少让孩子玩电子产品的家长也是为了图省事，这样他们就不会来麻烦大人了。但是，我们如果同意玩电子产品的害处，做家长的就必须要做出努力，用其他好玩的方式来取代电子产品。


    # 二、年纪较大的孩子


    主要是指上了中学以后的孩子，对于他们，过于严格的控制是比较难的，因为孩子们往往对电子产品的了解在很多时候是超过父母的。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '有些父母来问我如何用技术手段阻挡一些不好的网站，或者防止他们看盗版的视频等，这些其实家长是很难做到的。因为现在孩子们的技术能力都很强，总是能看到他们想要看到的东西。另外，这个阶段的孩子确实需要上网：他们需要查资料，获取信息，做作业，跟别人交流。


    所以我建议从中学开始，你更应该教会孩子如何去有效地使用电子产品，使用网上的信息，并且有效地控制自己。


    具体的操作我再讲两个方面：控制时间和增强判断力。


    # **1. 控制时间**


    在控制时间方面，我们要教会他们如何自己有效地控制上网，玩游戏，看视频等的时间。


    比如说，我的孩子们也是很喜欢打游戏的。我给他们的规定是每天要先做完作业，先把学校的事情全部完成，然后剩下的时间就可以打游戏。


    他们清楚地懂得，这是他们既能学习好，又能玩到游戏，还不会和家长有冲突的最好方法，一段时间后养成习惯了，先做作业再玩游戏。


    另外，从健康角度，也建议他们每次打游戏或者上网时间不要太长，当中要运动或者休息。


    现在孩子的休息或者社交常常是通过游戏来完成的，就像我们小时候打牌、跳皮筋一样，这点我们要理解。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '所以有时候我也会建议，让他们列一个时间表，写上什么时候该做作业，什么时候可以玩游戏，把玩游戏当作休息。


    同时，我也很有兴趣地去了解一下他们玩的游戏，问他们是怎么玩的，为什么好玩，还有哪些朋友在玩。我们以低姿态地向他们学习，他们都会非常高兴地分享给我们。


    # 2. 增强判断力


    第二个方面非常重要，就是一定要教会他们学会有判断力，知道什么是有价值的信息，什么是垃圾无聊的信息。


    在“东西方教育”上，我专门写过一篇文章叫《如何培养孩子的信商？》。信，是信息的信。这和情商，智商一样，都是现代社会不可缺少的能力。


    现在每两天，世界上产生的信息，就和自有文明史以来到2003年，产生的全部信息一样多。在这个信息大爆炸的年代，信商，就是判断信息价值的智商。


    你要和孩子讨论什么时间花得有价钱，什么没有价值，如何主动寻找和吸取对自己有价值的信息，如何主动地屏蔽无聊信息。


    你要注意，这方面的教育不是一天两天能做到的，也不是光靠讲道理就能让孩子做到的。我建议，你可以做一些“实战分析”。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '比如，孩子花很多时间看视频或玩游戏之后，你可以和他们讨论一下，“你看的内容对你有什么帮助啊？”“是不是花了很多时间看重复的内容啊？”“这两个小时，如果出去打球，你会不会感觉精神好很多？”


    当我们看到一个演讲者能够引经据典的时候，我们可以引导孩子，如果你可以花多点时间读书，才能有高水平的评论和见解。经常用孩子实际生活来做例子和他们讨论，这样一步步地引导他们有正确的判断能力。


    我有一个朋友，在家里做了一个特别好的实验，就是全家四个人，做了四周的electronic fasting（这四周内全家不用电子产品），业余时间就看书，打牌，玩桌游，练跆拳道。


    四周后，家长和孩子都谈谈感悟，我们真正的错过了什么？得到了什么？有决心的家庭，可以试试。


    最后一点，就是其实我一直强调的言传身教。现在沉迷电子产品的不光是小孩，还有大人。


    大人可能看的内容不一样，看朋友圈，看视频，看吸引眼球的新闻，看所谓“震惊”的健康消息。但请审视一下自己：


    +   - 你在孩子面前花多少时间在看手机？

    - 有多少时间在看书？

    - 有多少时间在进行深度思考和交流？


    如果你每天自己花在电子产品上的时间很多，你就很难说服孩子少玩游戏、手机等。你自己的做法，对孩子会有非常大的影响。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '所以想要控制孩子对电子产品的沉迷，你得先控制自己在这方面花费的时间。


    小结：这次我主要回答了如何帮助孩子减少对手机、游戏的沉迷问题。


    这个问题要分年龄段管理，在你的孩子上小学之前，你要严格控制电子产品的使用，并多带他户外运动、阅读或者玩玩具：


    如果你的孩子已经到了上初中的年纪，你可以让他列出时间表来自己管理时间，并且与孩子多沟通，培养他自己的判断能力。但最重要的，还是要以身作则。


    # 答疑二：如何培养孩子的阅读习惯？


    在第二次答疑里，我选择了一个大家问得特别多的问题，是关于孩子阅读习惯的。


    有一位用户这样问：


    > 我现在的另一个主要困扰就是怎样引导孩子阅读。目前孩子对睡前阅读没兴趣，想请教一下您是如何在这方面引导孩子的？


    大家知道，我是非常倡导阅读的，我认为这个习惯，比学好任何其他具体的功课和技能都更为重要。


    在我看来，如果父母有一件事需要教给孩子，而且会令他们终身受益，那么这件事就是阅读。我在课程中就提到过，阅读习惯是父母一定要花大力气去做的事。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 阅读的重要性


    第一，给孩子养成良好的阅读习惯是培养孩子其他许多关键技能的基础。


    比较直接的，比如说孩子要写作和演讲，都需要很好的内容。内容从哪里来？孩子阅读多了，就可以信手拈来，引用读来的故事、格言、诗词，等等。


    从形式上，孩子看多了，会自然地模仿各种写作方式，比如新闻如何直指主题，小说如何制造悬念，对话怎么写，结尾怎么写，这些都不是能靠学习理论得来的。


    更加远一点，阅读也是学好其他学科包括理工科的基础。国内应试教育中，理工科还是解题偏多，而比较先进的国际教程，不少理工科的问题也是阅读理解、解题加上分析题目为什么这么解。


    这样培养出来的孩子，会解决实际的问题，也能跟别人讲清楚他的思路和过程。这个时候，阅读的技巧、速度和理解能力都是非常重要的了。


    第二，父母和老师能教给孩子的知识还是有限的。你如果希望孩子能与经典相伴、与大师为友，希望他们纵观古今、遍览世界，那这些只有爱阅读的人才能做到。


    可以说，长远来讲是否阅读、阅读什么，会影响孩子的视野和格局。


    第三，就是我们的孩子将来需要应对快速变化的世界，他们需要有自我学习能力。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '一个人如何自我学习？除了去寻找老师和课程，阅读，其实是用得最多也是最好的方式。


    # ## 如何引导孩子阅读？


    我不知道问上面这个问题的家长，你孩子有多大。既然问到睡前阅读，应该是孩子还比较小。


    +   *   教年龄较小的孩子阅读，我想强调三点：


    第一点，在阅读开始的时候，作为家长，你要先明确：学习知识不是目的，养成对阅读的喜爱、习惯才是目的。


    所以给孩子读书，从孩子很小的时候，一两岁就可以开始了。


    这个时间，给孩子挑选的书需要是很有意思的。等孩子稍微大一点，也可以由他们自己来挑选，哪怕就是图画书，或者是对话很少的书也行。这个时候，阅读就是讲故事。


    在讲故事的同时，你可以边讲边给孩子指出书上的文字，这么做可以让他们知道这个文字是可以读的，而且是和故事相关的。


    还有更有趣的方式，比如可以一起唱歌或者念儿歌，同时把内容和文字结合起来，我们的目的是让孩子觉得文字是很好玩的东西。


    第二点，非常重要的，在我的书里面也提到的，就是学龄前的不少孩子喜欢反复阅读，有时候一本书他们可以读好几个月，甚至半年都没有关系。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '> 所以，父母不需要去找很多的书，也不需要“每天一本新书”，孩子需要的是用同样的故事，来进行反复讲述。


    并且这个故事要是他们喜欢的题材，比如动物、恐龙、童话。这样每天读的时候，孩子们懂得了故事里的内容，会特别有参与感。


    第三点，就是大人在给孩子读书的过程中，可以停顿，留出空间让孩子们参与进来。


    你可以让孩子们加入进来回答些问题，比如说出故事中这个动物是什么名字啊，那个人说了一句什么话啊。你还可以把孩子加入这个故事，用他们来做故事的主角。


    在孩子小的时候，我们要让他把书看成是玩具，把阅读看作是在玩，让他们觉得这是舒适的过程，好玩的过程，有趣味的过程。


    +   孩子长大了以后，我对阅读也有两个建议：


    第一点，每天让孩子有阅读时间，哪怕二十分钟也行，贵在坚持。


    这个时间，可以安排在睡觉前，也可以安排在从学校刚回来，做功课之前。


    在周末，孩子的业余时间多一点，就可以安排固定的时间来阅读。


    现在的孩子有时候功课太多，或者要考试，那这种时候阅读时间又该如何安排呢？'
  merge: -1
  img_proc: true
- pgno: 59
  md: '其实，大多数孩子不是完全没有时间，而是不擅长时间管理。我们大人可以帮孩子每天规划时间。你给他列一个计划表，几点到几点做哪个功课，几点到几点休息，这样把阅读也安排进去。


    你如果不希望给孩子增加太多负担，可以一个星期中只有5天有阅读安排，如果阅读被安排在了周末，那时间可以比平时稍长一点。


    我们的目的是阅读是一件不断要做的事，是持续、坚持要做的事。


    第二点，尽量不要去限制他阅读的内容，要让他们什么都能读。小说、杂志、文艺、科幻、传记都是可以的。


    我们不需要让孩子“只读圣贤书”，因为那些比较经典的书，学校一般也会让孩子当做阅读资料来读。


    在家里的个人阅读时间，还是要按照孩子的兴趣来，这样他们是为了看内容而读，而不是为了“学习”而读。


    我的两个孩子，英文大部分都是读的流行小说，比如《哈利·波特》《权力的游戏》等等。中文就读武侠、三国、玄幻小说。


    偶尔我们也可以提一些建议，推荐一些优质的内容给孩子，比如名家的短篇、世界著名的演讲集等。但是孩子自己 going to 去主动地、持久地阅读，是我们培养的目的。


    孩子读书，很多会受朋友们的影响，他们会交流图书中读来的有趣的情节，做评论。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '所以，让孩子交爱读书的朋友，鼓励他和朋友们互相推荐读过的好书，让他们共同成长，这也是养成阅读习惯的一个好方法。


    最后，我又要提到，家长是孩子最好的榜样。


    我们做家长的，平时比较空闲的时候也可以多读书。有时候你还可以跟孩子分享一下自己读书的收获。你说的孩子不一定能全懂，但是没关系。


    比如，这两天我在读达·芬奇的传记，里面有些很有意思的小故事，是讲达·芬奇在年轻的时候，设计的很有想象空间的新型武器，这件事情我就可以分享给孩子听。


    这样孩子就知道，家长也在读书。有趣的话题可以从书里来，久而久之，孩子就会养成读书的好习惯了。


    小结：这次答疑主要讲了孩子不爱阅读，你该怎么办的的问题。


    在孩子还很小的时候，不需要很多书，但一定要选择有意思的故事，反复给孩子讲，并且鼓励孩子一起来讲，这会增加他的阅读兴趣；


    对于大点的孩子，你不需要过多限制阅读内容，但一定注意鼓励他们坚持阅读。


    最后，最重要的还是，家长要先以身作则，你的阅读习惯会影响孩子的行为。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 答疑三：如何培养孩子的运动习惯？


    这是本课程的第三次答疑。在这次答疑中，我选择了两位用户的提问，想主要谈谈关于孩子运动习惯的培养。


    先来看第一位用户的提问：


    > 对于精力过剩的恶魔儿子 / 女儿有什么可以分享的心得吗？


    我想先对问这个问题的家长说：如果你有一位精力过剩的恶魔儿子或女儿，祝贺你，这说明他们身体健康，好奇心强，兴趣广泛。


    但孩子精力太过旺盛，也会成为家长的苦恼。怎么对付他们过多的精力呢？


    你不希望孩子用过剩的精力捣乱，那就得帮他们找出一种好的方式来用掉这些精力，我认为最好的方式就是让孩子参加体育运动。


    # 一、运动的重要性


    你如果听了我的精品课，或者看过我的书，会知道我认为孩子应该用个性化教育，而不是强求统一。但是有几个大方向是所有家长都一定要关注的，其中之一就是培养孩子的运动习惯。


    运动是一件让孩子终身受益的事。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 二、运动的作用


    大家知道，在所谓西方的“精英教育”中，体育运动和体育精神，往往会被放到比学习更重要的地位。这是因为体育在孩子成长中有几个关键的作用。


    +   1. 运动可以增强孩子的体质，而健康对孩子一生的重要性。


    +   2. 大部分运动都是团队运动，它们能培养孩子的团队意识，让孩子知道配合、合作，学会赢，也学会输。


    +   3. 不少家长总问如何培养孩子的韧性。现在的孩子生活条件比过去好了太多，其实是没有太多吃苦的机会，而在体育上想要做到出类拔萃，是需要多年反复艰苦的训练。


    运动是一种孩子学习如何挑战自己、实现长远目标的方式，家长可以用运动来培养孩子的韧性。


    我们家不是体育之家，所以体育天赋是谈不上的。但我仍然希望我的孩子至少培养一个以上的体育特长，并且最好能达到参加校队的水平，原因就是为了培养他们的韧性。


    我家老大的体育特长是游泳，老二是踢足球。除了专项训练的那一种运动外，他们也会参加其他的运动项目。


    +   4. 在我的孩子身上，我还发现运动的另一个大优点，就是运动能帮助孩子社交。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '当他们去一个陌生的地方，比如夏令营、上大学，运动让他们很容易交上朋友。


    我上面说的运动的四大优点，就是我推荐提问的家长多鼓励孩子参加体育运动的原因。


    如何帮孩子选择他们喜欢的运动，并帮助他们坚持运动呢？其实这是一个被问得很多的问题。我选择一个用户的提问：


    > 我的孩子现在三岁，表现出来对足球有兴趣。我个人虽然不太想让他在这方面发展，但如果他喜欢，我准备等他四岁的时候送他去学。请问有没有好的建议，四岁男孩学些什么课外活动比较好呢？


    # ## 三、如何帮孩子选择运动？


    我先提一下，不少家长认为孩子搞运动是为了专业发展，这完全不是我讲的培养孩子运动专长。


    只有很少数的孩子将来需要从事体育工作，但是，每个孩子有条件的话，都需要有热爱的体育运动。


    在运动种类的选择上，家长还是应该多尊重孩子的意见。


    父母如果根据自己的喜好，或者别的孩子怎样就强迫自己的孩子学习某样体育，孩子学得可能很痛苦。然而，让孩子做自己喜欢的运动，他会特别享受，而且你要知道，一个人想去做真正喜欢的运动是别人挡都挡不住的。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '至于孩子到底对什么运动感兴趣、有才能，是要在不断尝试中发现的。孩子小的时候，比如上面问到四岁的孩子，一般看不出运动才能在哪里，这时候应该让他们做多种尝试。


    如同智力上的多种智能一样，每个孩子的体育才能也是不一样的。各个孩子在运动方面发展的速度也是不一样的。他们可以慢慢学，家长也要多鼓励、表扬，不用太着急。


    比如说，我家老大恺恺小时候曾尝试过多种体育活动，他长得高，本来以为他可以打篮球或者排球，但是他都不擅长。


    最后，他还是找到了一个符合他性格的运动，就是游泳。这是个人的、枯燥的运动，训练常常是两小时一直来回游，但这却是他最喜欢的。


    他参加校队，每周都要训练。在高中最忙的一年里，恺恺说游泳不仅帮助他提高竞争力，也是降低压力的最好方式。


    所以在孩子小的时候，关键是要鼓励他们尝试，享受运动的乐趣，同时培养基本的运动素质和身体技能。


    在孩子到了小学高年级的时候，往往会 对某项运动显现出更高的兴趣或者才能。这个时候，建议家长们观察一下 你孩子的喜好和特长，然后可以和孩子一起决定，在哪一两样运动上进行深度培养。


    我会建议帮孩子找个好的运动队或者教练，校内校外的都行，让他能有规律性地训练，比如每周两三次。这个时候，你要鼓励孩子不再轻言放弃。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 四、如何鼓励孩子坚持运动？


    到中学以后，不少公立学校的孩子功课加重，这也使很多孩子和家长直接放弃体育的时间。但我的观点是，在有条件的情况下，希望家长能够继续支持孩子的运动。


    孩子付出，家长也要付出。让我们拿出带孩子补课、学奥数的精神，在课外、周末的时间表里尽量安排固定的运动时间。


    但时间从哪里来呢？我有两点建议：


    第一点， 我们可以和孩子商量，为了在课后能有时间玩他们喜欢的运动，在学校就尽量把功课做好。这样学习、运动两头都不会耽误，可以一举两得。


    第二点， 我们帮助孩子减少看电视、打电游的时间，再把这些时间拿去运动。


    家长还要有意识地为孩子创造出更多的运动机会。比如现在不少学校里有运动队，在校外，还有各种运动集训营或者夏令营，家长都可以送孩子多去参与。


    有一个我有认识的家长，在孩子功课很紧的情况下还能争取保持孩子每小时的运动量，所以这件事是有可能执行的。


    总之，家长只要有让孩子多运动的意识，再朝这个方面努力，就会有好成果的。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '小结：这次答疑我主要讲了培养孩子运动习惯的问题。


    就像我在课程中讲到的，运动是家长一定要花时间的 事情，孩子小的时候，他们精力总是很旺盛，鼓励他多参加体育运动不仅能消耗多余的精力，还有助于培养孩子的团队合作能力和韧性。


    为孩子选择运动项目时，家长要多观察，并且要尊重孩子的喜好。


    最后家长要有意识地鼓励孩子坚持运动习惯，在功课紧张的时期，只要做好时间安排，就能学习、运动两不耽误。


    祝你的孩子身体健康，在运动中释放他们的天性。


    # 答疑四：如何引导内向的孩子自信社交？


    这次我想说说如何帮助性格内向的孩子自信地与他人交往。


    我在后台看到这样一个问题：


    我的孩子比较胆小，和熟悉的孩子可以一起玩，但对不熟悉的，他就会害怕。比如去游乐园，有两个或更多小孩靠近他就会紧张，他就找借口去玩别的。他正在玩的玩具，别的小朋友从他手里拿走他也不敢出声。我该通过什么方式来鼓励我的孩子？


    孩子比较内向，不愿意出头露面，不愿意和别的孩子争抢，是一个被问到 很多的问题。尤其，我的两个孩子也都是这种类型的。所以我来给你分享一下我的看法。


    现代社会崇尚领导力，从孩子就开始了。我们希望孩子在各方面出头，学习上争第一，体育上打败别人，再当班干部，一呼百应。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '但是我们的孩子如果不是这样，怎么办呢？这世界上就是有一半内向的孩子，也有百分之九十被领导的孩子？


    最近，我在“东西方教育”公众号上写了一篇文章叫“我的儿子是后卫”，讲我家老二骐骥，在踢足球的十几年里，别的孩子都争当前锋和边锋，而一开始就选择做后卫。


    在后面的很多年里，他一直都不是球队里最出风头的队员。然而到了高中，他成了球队的队长和“最优球员”。


    所以我想跟你说两个方面：


    # 一、要学会接纳孩子本来的样子


    回顾自己的历程，我们常常发现，现在处于关键领导位置的人，往往不是小时候冲在最前面的人，有太多的因素影响一个人的成长。


    在畅销书《从优秀到卓越》（ Good to Great ）中发表了对许多优秀 CEO 的研究，发现他们不是魅力无穷的预言者、演说家，他们的共性是谦逊、自我约束、勤奋、讲求效率；他们能够理解他人，并且有足够的耐心在一件事上反复操作。


    从内向和外向的性格来看，研究中发现公司的 CEO 正好一半是内向的，一半是外向的。他们有不同的领导方式，但是都可以做得很好。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '所以，我们首先要接纳自己的孩子，接受他们的性格，不认为胆子小或者内向是不好的性格。许多内向的人，都是有“定力”的，我们的孩子完全可以成为这样的人。


    # 二、从两方面帮助孩子


    家长想帮助孩子自信地与他人交往，不被别人欺负。那你得先清楚孩子怕和别人接触，或者不敢出头的原因，针对原因，你能够更有效地帮助到孩子。


    分析下来，主要是有两方面原因：第一，孩子不习惯独立处理问题，怕失败，第二，孩子不擅长交往和表达。


    # 1. 培养孩子独立处理问题的能力


    这两年流行一个词，叫“直升机父母”。这个词被用来形容那些整天在孩子的生活上空盘旋不休的家长。无论孩子是否需要他们，他们都很少让孩子远离自己的视线。


    这样的家长通常会在很多时候闯入孩子的生活，以防止孩子犯错或失败。


    提供过度保护的父母是想让孩子得到最好的一切，但是从长远来看，他们的做法弊大于利。


    被过度宠溺、控制的孩子，都会缺乏自尊，并且容易焦虑。所以想让孩子自信地与他人交往，家长要做的第一件事，就是要让孩子真正独立地去与其他孩子相处。即使出现矛盾，也让孩子自己去处理。


