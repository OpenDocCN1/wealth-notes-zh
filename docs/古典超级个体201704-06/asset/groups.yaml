    # 问答｜没有突出特长的人，如何打造个人品牌？ 31-4


    拉尔夫·纳德：以前接受的教育是不给人或团体贴标签，因为会导致对人认识的偏见。现在想让他人认识自己，最快的途径是在自己身上贴标签。古典老师怎么看待这种矛盾？


    古典


    过去的社会是熟人社会，人和人的联系是固定的，个人通过人际圈的成长来扩大自己的圈子。在这样的环境里，给一个人固定的标签，其实等于也给了自己固定的应对方模式，其实是障碍发展。


    比如说大学同学，在大学宿舍里可能是个邋遢鬼。但是你们十五年不见，再见面对方已经留洋回来了，也有了自己家庭。这个时候，再用曾经的标签来看待他，显然是不合适的。


    但今天的社会是陌生人社会——每个人都有超过150人（邓巴数）的链接，这个时候，不给人贴标签，等于是你认识了一堆面目模糊的“陌生人”。不给自己贴标签，对方很难记住你，注意力会被有标签的人吸引走，所以给自己和别人贴标签都是重要的识别方式。


    更好的方式也许是这样的。


    对于弱联系，先快速识别别人，给人贴标签。但不要用“502”胶水贴，用“即时贴”。当你意识到对方有新的变化，尽快换一张。当你接触更多，意识到对方有很多面，那就多贴几张。


    对于自己的熟人：孩子、夫妻、父母……千万不要标签化，反而要丰富化。让标签成为一张纸，成为一本书。这样你才会活在一个立体的关系里，体验到生活的方方面面。


    但是 一切都是从一个标签入手的，不是吗？


    肥羊kevinyu：觉得自己的各项能力很均衡，积极点看是综合能力强，消极点看就是没有突出的特长，这时该如何打造这种个人品牌呢？


    古典


    其实很多超体都有这样的疑问，我在这里统一回答一下。我就是一个普通人/平常的/没有特色的人……如何打造自己个人品牌？讲一个商业的案例。牙膏厂家常年面对一个问题——如何推陈出新。因为他们发现，消费者爱赶潮流。一个高露洁使用久了的人，就很容易试试看黑人牙膏。要留住用户最好的方式就是品牌内持续创新。但是牙膏这个玩意生产这么多年，生产配方已经很稳定了。怎么办？


    其实，更多的创新在品牌和概念层面——就像你今天看到的。不同牙膏的品牌品类，有些主打洁白、有些主打竹炭、有些主打防蛀牙。这些牙膏的成分都差不多，他们最大的区别是包装不同，以及提醒你功效的“提醒剂”不同——有淡淡薄荷味的是在提示你可以清新口气，有淡淡食盐味道的是在暗示你可以杀菌……区分这些牙膏的不是真正的功效，而是你被勾起的注意力。因此能满足消费者的各种需求。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_150_0.png)


    回到人的层面，一款普通牙膏就像是综合能力很强，但缺乏特长的人。所以你很难有意愿去购买。所以，你还是需要把大家的注意力聚焦到你身上最受欢迎的一个特色、优势或者需求上，先把自己推出去。


    比如，你的综合能力很强，但所在的组织里最缺乏的是沟通能力强的人，那你就要侧重于强调自己是个沟通高手；如果组织里稀缺的是执行力强的人，就强调自己执行力强。


    时间一长，更多沟通或执行的诉求也会找到你，钝感的机会变多，你也就成了名牌。


    王瑞涛94865355：我是一名高中数学教师，希望是解题高手，学习方法探索者，家庭教育行家，演讲高手。古典老师，觉得这样的个人品牌的方向合适吗？


    古典


    很佩服你这么多才多艺！不过你这些品牌都可以更好，因为好的品牌要满足核心客户的核心需求——这几个品牌纷纷指向了不同的客户群。


    - 解题高手——学生、家长；

    学习方法探索者——学生、家长、校长；

    家庭教育行家——家长（但是在家长群体心中，你真的能够成为家庭教育行家吗？尤其是在行家林立的时代？）；

    演讲高手——更广泛的人群。


    这么看来。你因为有4个品牌，所以在这4个品类里都出现很多竞争对手，可能每一个都会导致你因为不专业而败下来。所以还是聚焦1-2个更合适。


    最后，你的需求是什么呢？你希望成为好老师？希望成为家长心目中的家庭教育专家？希望成为大家眼中的意见领袖？不要想太远，想2年内的需求即可。


    当你梳理清楚自己的真实客户，和自己的需求。可能会找到一个看上去不那么厉害，但很好用的品牌：


    - 告诉学生——我不仅能帮你提分，还会教你更好的学习方法；

    告诉校长——我是一个能演讲的老师，学校需要时，可以随时去讲；

    告诉关注家庭教育的人——我本职工 作是老师，所以接触过很多孩子和家庭，我最有经验。


    # ——思考与践行——


    你现在的品牌标签有哪些？

    你都提供给了哪些客户哪些价值？

    今天是古典陪伴你成长的第217天，一起加速，成长为更好的自己。


