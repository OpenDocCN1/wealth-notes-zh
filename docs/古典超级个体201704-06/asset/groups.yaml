    ## 精华 | 运用故事思维，做自己人生的好导演

    28-5


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_0.png)


    28-5 精华 | 运用故事思维...


    ### 1. 故事，是一门被低估的学问。


    故事容易传播、容易记忆，而且更有影响力。


    美国总统竞选、商业路演、品牌宣传、项目发布、个人介绍，故事无处不在。逻辑思维让你成为一个清晰的人，而故事思维让你成为一个有影响力的人。


    ### 2. 像修图一样修改故事，一个故事有四个图层——情节、情感、细节、主题。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_1.png)


    故事思维就是用故事的元素把事情包装起来，把个人的情感融进去，让人产生代入感。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_2.png)


    ### 3. 七步成故事法——怎样设计一个好情节。


    目标、障碍、努力、挫败、意外、转弯、胜利。


    更加复杂的故事，可能是2-3条线的转折。比如说《霸王别姬》的主线是程蝶衣和段小楼的关系，但是还渗透着袁四爷、戏班子成员、菊仙等人的个体命运，最后又带出一个时代群像——这都是高级用法。


    重要的是，你也可以用更好的方式解读自己的人生状态。


    ### 4.故事里的英雄之旅——人类的冒险经历。


    走出舒适区，遇到更多朋友，改变世界。


    每个人的成长故事都是极其类似的，其实都是一个走出舒适圈，链接新圈子，然后经历磨难，最后升级回归初心的过程。


    故事即生活，故事是浓缩的生活，生活是真实的故事。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_3.png)


    故事是一种记回的方法，是一种有效的设计。有了这七步，讲故事、听故事、看电影都将变得不一样。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_4.png)


    ### 5.故事是你的自我形象。


    大家都学会用故事来做自我介绍了，这种方式可以用在很多地方。


    - 面试时讲一个故事，让大家马上记住你；

    - 发微信讲一个故事，让大家马上记得你；

    - 沟通的时候讲一个故事，让大家更加理解你。


    故事是自我形象的一部分。


    ### 6.创造“两难”和“悬念”是故事的主要动力。


    你希望自己好看，可以搭配服装，可以化妆。


    故事最好的妆容，就是两难和悬念。让主角一次次地陷入两难。我之前讲了一个公主和老虎的故事，里面是不是充满了悬念？


    悬念让你忍不住往下读，是阅读的重要动力——如果没有好的结局，大家会骂死你的。 “一千零一夜”就是这样的典型例子。


    怎么增加悬念呢？三大矛盾——人与人的矛盾、人与自然的矛盾、人与自我的矛盾。让故事深陷这些交织的矛盾中。


    ### 7.记住，你的人生也是一个故事。


    总有一天，你的生命会像电影一样一闪而过——你有过哪些梦想、面对过什么挑战、做了哪些努力、尝试到什么挫败、遇到哪些奇迹、有了什么转折、收获过什么礼物？


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_5.png)


    每个人都会暂时放下自我，进入到故事里，体验故事里的情节，然后带走一些感悟和启发重新回到生活。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_6.png)


