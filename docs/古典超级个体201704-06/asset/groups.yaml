    # 清明特辑：直面骄阳的三个礼物 24-1


    24-1 清明特辑：直面骄阳...


    清明节快乐！


    是不是听起来好怪？


    虽然清明有回家祭祖的习惯，但是死亡在个人感受和文化氛围里，都🎉是一个禁忌的话题。因为它让你不舒服。


    今天我要顶着这个不舒服，和你聊聊这个话题。


    # 我们为什么怕死？


    心理学家津巴多在《津巴多的时间心理学》把时间分为“过去”、“未来”和“超未来”。过去的过去了，未来是指从现在到死，而死后的时间是超未来。科学解决的是未来问题，宗教和哲学解决了超未来问题。


    我们对死亡的恐惧主要有三个：害怕死得痛苦、害怕死后的未知、害怕死后很多遗憾无法弥补。


    # 越怕，越糟糕


    我们越来越恐惧死亡，以至于我们不敢、不能、不好意思提这个事——死亡像房间里的一只大象——谁都知道他存在，就是没人敢提。


    # ——三个礼物——


    # 1. 想明白退出机制，你就踏实了


    > “这样想了好几年，最后事情终于弄明白了：一个人，出生了，这就不再是一个可以辩论的问题，而只是上帝交给他的一个事实；上帝在交给我们这件事实的时候，已经顺便保证了它的结果，所以死是一件不必急于求成的事，死是一个必然会降临的节日。这番想过之后我安心多了，眼前的一切不再那么可怕。”（史铁生《我与地坛》）


    # 2. 活在当下，珍惜身边的人


    +   1. 健康无价；

    2. 一切事物都有它的理由；

    3. 珍惜缘分，学会感恩和爱；

    4. 学会如何生活，活在当下；

    5. 经得住诱惑；

    6. 人人平等，善待每一个人；

    7. 我们的人生究竟为什么？


    # 3. 创造人生


    意识到生命短暂、脆弱又渺小。我们才更有紧迫感用好生命；有危机感保护好自己；有使命感做点大事。


    死都不怕了，还怕活吗？'
