    最后的结尾本来准备我来写的。但是这位李太初同学说得太好了，就用他的话来做结束超级个体的半年回顾：


    时间过半，这半年学到了很多知识概念，有很多已经变得有些模糊，但我不是很担心，因为我知道：只要体系框架搭建起来，缺失的细节，可以按需索引，或重温补回，或复盘强化。重要的是，我获得一个世界地图，它们是：


    +   - 我是谁？（价值观）

    - 我在哪？（视野）

    - 我要去哪？（目标）

    - 我怎么去？（路径）

    - 我怎么加速？（方法论、工具箱）

    - 我怎么强化体能？（精力管理、学习竞争力、输出竞争力）


    同时，在细节方面也有一些知识点，已经逐步培养成习惯，虽然深度还参次不齐。比如：结构思考力、技能萃取、复盘、独立思考、if...then式准备、断舍离等……


    还有一些知识，虽然不直接运用，但却时时影响着决策判断，比如：长板优先、自己是产品媒体运营三人中的哪种、刻意培养心流出现的次数、包容性思维、分辨一二三四手知识……也有一些虽然学了，但还需要持续践行才能看到结果的，比如：功利读书法、三件事、能力产品化……


    不管怎么说，超级个体威力巨大，尽管大部分还没发挥出来，却如一颗种子已经在心里生根发芽，只需要在行为上不熟练的尝试和打磨。如同，当知道春天要来，忍不住常望枝头。今天种下的种子，明天会发芽长大，直到自己也长出种子，将超级个体继续以时间和空间的维度延伸下去。


