    # 选择决定命运，什么决定选择？ 35-4


    35-4 选择决定命运，什么...


    +   1. 人按照对自己的觉察程度，可以分为三类：环境决定、性格决定、使命决定。

    2. 我们普通人的自我成长之路，就是从第一种人（环境决定）逐渐成长为第三种人（使命决定）的过程。


    讲了3天性格，性格越来越清晰的同时，有个问题可能越来越模糊——以前我相信性格决定命运。当我意识到，性格也是可塑的，能力是可增长的，价值观是缓慢改变的，世界是不确定的，那到底什么决定命运？


    今天，我们就来谈谈，什么是决定命运的主要因素。


    有一个说法恐怕大家都比较认同，那就是，选择决定命运。我们在一个关键路口的选择决定了命运。但问题是，什么决定了选择呢？这个问题非常大，我们今天仅从心理学、性格的角度说说看。


    人按照对自己的觉察和了解程度，分成三类——环境决定、性格决定、使命决定。


    # 决定命运的三类因素


    第一类，环境决定：他们完全活在自己的下意识、潜意识、基因和环境的设定里。


    弗洛伊德在很早的时候就发现，把一个人催眠，给他指令，拿着雨伞去另一个房间；然后在另一个房间把他唤醒，让他解释为什么你会拿着雨伞？（很明显，其实这是他潜意识的指令。）但是大部分人却都会解释成“我怕下雨”或者“我想试试看是不是雨伞好用”。


    他们每天做的所谓“自我判断”，也是大脑帮他们处理好，他们只是在解释。他们的选择标准是“感觉好不好”“是不是符合我下意识的设定”。而感受和下意识完全被基因和社会挟着，他们只是一个载体。


    他们对于自己的性格、倾向和需求一无所知，一旦外界评价和自己的内在倾向冲突，他们就很痛苦，同时也很无奈。很多酸爽的、小情小调的文学作品就在这个层次。


    对于这类人来说， lotus置疑，是环境决定了命运。


    第二类，个性决定：他们开始有“我”的意识、理解自己是独特的、是与众不同的，不再是 Nobody，而是 ME。


    他们通过大量的自我探索，理解自己的行为倾向、潜意识需求，发现自己的独特性。就好像这一周我们谈到的关于性格的各种解释一样。他们根据“什么是适合我的？”来做选择。


    他们会思考什么是适合我的风格、工作、形象、表达方式？他们会持续地探索性格、培养优势、满足需求、进入到让自己最自然而然的领域去。个性的主要目标就是“活出自我，找到适合的位置，把天赋发挥到极致、满足自己内心的渴望”。


    对于这类人来说，是性格决定命运。


    第三类，使命决定（从ME到WE）。他们意识到个体是会消亡的，需要有更久远，更有意义的东西流传和影响世界，那就是“改变身边人的生活”，这种超越个体的目标，称为使命。


    彼得·德鲁克年轻的时候随父亲拜访年老的经济学家熊彼得，他父亲问这位经济学大师：


    > "你现在还会想别人要怎么记得你吗？"

    "当然，这个问题对我很重要，现在我希望以后的人记得我是经济学的老师，一位很会教学生的老师。"


    德鲁克的父亲听到这个答案感到惊讶，熊彼得继续说：


    > "到我这个年纪，才慢慢体会到，只让被人记得你的理论著作，是远远不够的，除非其他人的生活因为你的行动而有所不同，这样才算是作为。"


    “让其他人的生活因你的行动而有所不同”是熊彼得赋予自己的使命。


    超越个体需求的目标，往往需要除了天赋以外的更多的特质和能力。这种选择需要打磨和优化自己的性格，发挥自己的优势，调整自己的劣势。如果实在做不好，就要打开心量邀请他人来合作，让别人用你不舒服的方式来工作，这也需要磨练。


    这过程非常痛苦，很多时候需要逆着自己的天性来，但是因为他们目标感足够强，价值观足够大，所以他们也愿意跨出这一步——不怕痛苦，就怕痛苦得没有价值。


    有人可能在吃穿上毫无所求，是个“环境人”，在玩乐上随心所欲，是个“个性人”；但是在自己真正看重的事情上，马上精光四射、认真死磕、差不得分毫，这 années就是“使命人”。


    这三类人，一种是环境决定命运、一种是个性决定命运、一种是使命决定命运。


    第一种人占了绝大部分；第二种人大概有20%，是活得自我自在的人；第三种人则属于人群中的少数。


    如果你要创业，你可能需要瞄准第一群人的大众市场；拉拢第二群人，他们一般是各个领域的意见领袖，而你要整合第三群人，与他们形成伙伴关系。


    自我探索的意义是什么呢？就是帮你从第一种人走向第二种人，理解了什么（What）对自己是重要的，如何（How）使用自己。但是一旦你完成这个过程，你就会发现比
    what 更重要的，是 so what。知道了自己的性格倾向，你到底是去适应，还是去改变？


    你出生在这个时代，被赋予这种天赋、遇到了自己独特的人生境遇，那么你到底要成为谁，为世界留下些什么呢？这种人生的意义感，不是随大流、也不是看个性、而是你自己给自己赋予的。


    从 Nobody 到 Me，最后再到 We ——自我成长之路，就是从第一种人到第三种人，逐渐扩大对自己命运把握能力的过程。


