    ## 许荣哲：关于签名书——我最爱的故事


    ![](img/25e88d373f85ee6d39d9f51899b4f484_119_1.png)


    我喜欢认真工作的人，尤其是那种带着“层次感”的认真工作。


    > 怪物史瑞克说：“泽葛是有层次的，妖怪也是。”


    我认识一个有“层次”的业务，他的 work 是天天载着不同的作家到各个学校演讲。大部分的业务是使命必达的“宅急便”（快递公司）司机，作家是不需冷藏的生鲜肉类。


    但也有小部分的业务是刚入行的小伙子，他们还没学会喜欢自己的工作，于是开口的第一句话便是：“当作家赚钱多吗？”积极一点的，还会追问我知不知道哪一行比较好看。


    心情好的时候，我会跟他开玩笑，当死人最好赚，我有个朋友在殡仪馆演死人，月入数十万。随后一路undige，他一直吵着要我的“死人”朋友名片。


    “好歹我也载过你一程，你就送我一程会死哦。”业务边开车边缠着我。


    所以很多时候，我与业务之间的关系就是没有关系，像我和林志玲一样。但有一回，我却被这个业务弄哭了。


    业务大哥是个单亲父亲，女儿整天托人照顾，虽然他天天载人，但却很少载女儿出门。


    那一阵子，我正在跑校园宣传新书，业务大哥特地掏钱买了几本我的书。


    “帮忙签个名！送我女儿的。”业务大哥请我在书上签名，并写上她女儿的名字。


    “你女儿几岁？”我本能地问。 “三岁。” “等等，三岁，还是十三岁？” “三岁。” “不会吧，这本书至少要国中以上才看得懂。”


    “是这样的，我正在进行一个秘密计划。我要收集所有我载过的作家的签名书，等我女儿上了国中之后，再把全部的签名书送给她，当作她的成年礼。”


    一个单亲父亲对女儿的用心瞬间让我红了眼眶。不止如此。


