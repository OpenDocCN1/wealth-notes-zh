    \n+ 一开始，小狮子辛巴跟父亲一起过着宁静的生活。\n有一天它的父亲被它的叔父害死了，辛巴踏上一段被放逐的旅程。\n它遇到了很多朋友，也遇到了敌人——它的叔父一直苦苦地追杀它。\n\
