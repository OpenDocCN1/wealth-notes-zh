    \ 问答 | 一上台演讲就紧张，怎么办？ 27-4\n\n时间之树：大多数情况下，我的演讲可能会有坡道、主题和甜点，但一登台，大脑往往一片空白，手发抖，语音发颤，无法清晰地表达自己准备好的内容，这种情况该如何克服呢？\n\
    \n古典\n\n很多人都有上台演讲的恐惧，美国《读者文摘》（ Reader’s Digest ）曾经做过一个调查，在美国人心中什么事最可怕？调查结果显示：死刑排在第二，上台演讲排在第一。\n\
    \n为什么人们如此害怕公开演讲？\n\n其实这是有生理原因的。想象一下演讲者的情况——在一个大的讲台上面，中间聚光灯打下来，你独自站在一群人的注视之下，手无寸铁，周围是沒有遮挡的空旷地带，这就跟我们老祖宗的某个场景一模一样。\n\
    \n假如你是一个原始人，在空旷的地方站着，手无寸铁，周围黑暗的小树林里还有一些眼睛盯着你，你是不是会下意识地感觉自己被包围了？所以 对于演讲的恐惧，我们是与生俱来的，是骨子里条件反射。\n\
    \n那高手们会不会恐惧呢？\n\n高手也会恐惧，很多演讲大师都公开承认说，他们非常怕演讲，只不过他们有很多具体的方法让自己的恐惧快速地划过去，所以在演讲时，第一个要诀就是，千万不要让自己“不要恐惧”，而是努力让自己快速地度过恐惧阶段。\n\
    \n下面为你提供5个方法，帮你度过这个阶段：\n\n# 1.上台前，做一件让自己放松的事\n\n比如，我有一个朋友，他特别喜欢听 I believe I can\
    \ fly ，所以每次上台前，他都会戴上耳机听这首歌，听很长一段时间。\n\n再比如说，你知道大音乐家帕瓦罗蒂（ Luciano Pavarotti ），他在歌剧开场之前，内心焦虑到甚至会在手里拿个小钉子，让自己感受痛苦，集中注意力——当他一上场，这种焦虑反而通过唱歌一下子释放出来了——这也是为什么他会拿个小手绢的原因，他得不断地给自己擦汗嘛。\n\
    \n![](img/25e88d373f85ee6d39d9f51899b4f484_93_0.png)\n\n再比如说，我在新东方做培训师的时候，认识一个老师，他每次上台前都会在裤兜里放两根粉笔，上台前，把手伸进兜里，把粉笔握成粉末后，上台就不那么紧张了——就是辛苦了洗裤子的媳妇。\n\
    \n另一个老师上场总是紧张，我每天就守在他教室门口，在他上课前，陪他做15个俯卧撑。因为紧张的运动会心跳加快，释放多巴胺，他很快就不紧张了。\n\n# 2.想象一个你最喜欢的情景\n\
    \n你也许知道一个公开的秘密——很多演讲家都有个“损招”，就是把下面的听众想象成光着身子的。\n\n你可以想象下，当你站在讲台上时，看到下面坐着的人都没穿衣服，而你衣冠楚楚，这时你演讲的自信心会不会增加很多？至少没有那么胆怯了。\n\
    \n当然，你也可以把观众想成猴子、黄瓜、天线宝宝，大家根据爱好自己发挥吧。\n\n# 3.找一双最能让你放松的眼睛\n\n大多数演讲者站在讲台上时，都会不自觉地关注自己的弱点或者劣势——这是人类的天性——比如说，你的嘴巴里有一个溃疡，你就会没事用舌头顶它一下。但越顶越严重，口腔愈合得也更慢。\n\
    \n其实演讲者讲话时，肯定是有人喜欢，有人一有人眼睛带着笑意，有人就会找机会批判。糟糕的演讲者，一上來就会盯着那些批判他的人，很紧张，不断地去用眼睛 Check\
    \ 一下那些人是不是真的喜欢，结果越看越糟糕。\n\n其实再糟糕的演讲都会有人喜欢，所以最好的方法是——你就盯着那几个喜欢你的人的眼睛看，他们会给你点头示意，时间一长你就有自信了，然后再把眼睛移到其它地方去。实在找不到的话，也可以提前请自己的朋友坐在台下配合你。\n\
    \n# 4.讲一个你最熟悉的“段子”\n\n准备一段你特别熟悉的东西，相声里面叫贯口，你也可以理解为段子。\n\n比如，一个特别有趣的、很熟练的自我介绍。在刚刚一上场，大脑肯定有将近一分钟时间是完全懵的，但不要紧，你可以熟练地下意识地把这段自我介绍给丢出来，等看到大家都哈哈大笑，你也就放鬆警惕了，没那么害怕了。\n\
    \n# 5.主动要求反馈\n\n最后一个方法是——“反控制”的心理机制。即主动地要求对方做点什么事。\n\n想象一下文章开头说的那个原始人，他在空旷的原野上，突然对着黑暗里的眼睛下了命令，比如说“起立”，这时所有的狮子、老虎都起立；他说“打滚”，这些动物又开始打滚，这时这个人是不是瞬间就放鬆了呢？\n\
