    # 精华 | 10个关键点：手把手教你学写作 26-5


    精华 | 10个关键点：手把手教...


    ## 1. 有3个理由，开始写作


    写作是自我存在的方式、写作是思维升级器，写作是影响力的源头。


    ## 2. 写作的3种功能


    第一种，罗曼蒂克式的纯然的自我表达，写出来的东西更像是日记、散文、感悟，文体以写爽为目标；


    第二种，文档式写作，比如会议记录、工作流程和笔记等；


    第三种，有传播力的写作，是一种观点和事实表达型写作。有人讲故事——虚构类的、有人讲道理，有人讲知识技术，“非虚构类”的。


    提笔先思考，功能是什么？


    倒不是让你一写就成，而是你天天写QQ空间文，却希望增粉，这也就白痴ificados了。


    ## 写作的3个好处


    ![](img/25e88d373f85ee6d39d9f51899b4f484_65_0.png)


    新手最好的进阶之路：尽快开始记录生活，提高自我观察和表达能力；在工作中大量使用文档型写作，提高思维深度。


    ## 3. 写作是认知的逆向工程


    如果认知是把线性的语言、变成二维的知识晶体、然后存到网络大脑里去。那么写作就是把网状的思考，做成树状结构，用线性语言表达。


    两个动作流程完全一致，只是步骤相反，这就是逆向工程。


    在阅读的时候，大脑通过来回扫描文字，大脑里升起一个知识晶体，作者帮助读者在大脑里完成了3D打印。


    所以写得好的人，肯定学得好，学得好的人，则不一定写得好。


    ## 4. 工具箱1：说5个问题，写出好文章


    - 最近有什么特别想分享的事？

    - 为什么这个观点你觉得有价值？

    - 如果知道了这个观点，有哪些概念是需要确认的？

    - 该如何去做呢？

    - 你的观点是什么？你为什么和我说这个？


    ## 5. 写作工具箱2：汉堡包模型


    观点和主题是肉

    逻辑框架是放置结构

    视觉、听觉、例子是蔬菜、奶酪

    情绪是调味料


    ## 5个问题写出好文章


    ![](img/25e88d373f85ee6d39d9f51899b4f484_65_1.png)


    给自己5个问题——即使不动笔，也能列出文章框架；再经过“唯唯达”的“三改”——精修出一篇好文。


    ## 6. 写作工具箱3：写作三改


    - 信，是否准确表达想表达的意思？

    - 达，能否传达？是否符合了读者的认知水平？

    - 雅，有没有更高级的表达？


    千万不要跳步，很多人为了一个字如何用来回绣结，却跳过了前面两步。雅的标准各自不同，但是信达是基础。


    ## 7. 写作工具箱4：类比和举例子


    为了降低认知难度，需要在大脑里帮助读者上演内心戏。


    类比是帮助他联想。


    结，却跳过了前面两步。雅的标准各自不同，但是信达是基础。


    ## 7. 写作工具箱4：类比和举例子


    为了降低认知难度，需要在大脑里帮助读者上演内心戏。


    类比是帮助他联想。


    ## 8. 写作诊所


    没东西可写——每个人都是独特的，“用心生活和思考，发现独特之处”


    写不下去——不要自我评价，“用写作来写作”


    不从大纲写——不求一气呵成，“大纲+卡片，天下全打通”


    缺乏主见——“固执的偏见都比平庸的和稀泥好。”


    情感泛滥——“太多被自己感动”、失去了对象感


    缺乏好品味——“简单、简洁是好品味”


    ## 写作是认知的逆向工程


    ![](img/25e88d373f85ee6d39d9f51899b4f484_66_0.png)


    好的写作就是帮助读者把一个线性语言，在脑子里形成一个树状的知识晶体，最后储存成为网状知识。


    ## 9. 写作需要天赋吗？


    的确有人更有写作天赋。


    但是写作本质是一系列技能——任何人都能通过刻意练习达到80分，有天赋可以冲100分。


    重要的是传播自己的观点。


    ## 10. 你需要写作吗？


    写作是一个非常优秀的心理、思维和影响力工具。但并不是唯一的一个。


    仔细盘点你要做的事情，然后把写作放在一个正确的位置。不要因为潮流而写作，不要因为变现而写作，不要因为我推荐写作而写作——因为你需要写作，而写作。


    因为——比是不是要学习写作更加重要的技能，是你多大程度在把控自己的生活。


