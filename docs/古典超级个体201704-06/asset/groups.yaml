    # 特约成长导师：阳志平


    阳志平老师属于少数站在“知识源头”的那类人。他是安人心智集团董事长，旗下包括爱贝睿、开智学堂等子公司，也是一位认知科学专家，还是作家和藏书数万的“老书虫”……读书洁博，见识幽微。朋友们都尊称“阳老”。


    阳老创办的开智学堂，聚集了100多位博士与数千终身学习者，出版开智文库系列专著。现在我们熟知的《重塑大脑，重塑人生》、《机器人叛乱》、《刻意练习》等认知科学经典，都是阳老引入中国的。


    2015年，阳老从认知科学的角度出发，创立全新学科——“认知写作学”。这门写作课价格不菲，且有200多本参考书、100多篇论文要读，还要写上数万字……被戏称为“花钱求虐”。但每次不到24小时就售罄，至今已开到第四期，仍然一席难求。上过课的学员说，这大概是这辈子花得最值的一次钱。


    阳老说，“为什么要写作？写作的意义正在于无用。一辈子，我们能够赚到的福利计算会足够多，有意义的事情总会不断抓住我们的注意力。然而，美好的写作并不教这个，也无需教这个。写作的此时此刻就是一切，就是快乐与记忆。”本周我们讲写作，当然要请阳老做大家的“特约成长导师”。


    说句题外话，直到这次因为要在专栏里介绍阳老，去查些资料，才猛然发现他居然是“80后”——1980年出生于湖南——和我还是老乡。所以，这里的“老”，不是外在的，而是由于学识护身带来的气度、格局的超越与老成。


    本周六，我们将推送阳志平老师专门为《超级个体》准备的精彩内容，敬请期待。'
