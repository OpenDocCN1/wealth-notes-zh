    ## 怎样和比自己厉害的人做朋友？ 30-2


    30-2 怎样和比自己厉害的...


    - 1. 想结交厉害的人，可是我没有什么能交换的价值？

    - 2. 总是麻烦那些牛人，会不会损耗我们之间的关系？


    美国杰出的商业哲学家金罗姆（Jim Rohn）曾经提出著名的“密友五次元原理论”——与你亲密交往的5个朋友，你的财富和智慧就是他们的平均值。


    雅虎的创始人提姆·桑德（Tim Sanders）也说过：“你的社交圈就是你的净值。”能交往到比自己厉害的人，肯定会让你升值。


    但你肯定有这样的困惑：厉害的人为什么和我做朋友？


    《影响力》一书里谈到一个“互惠原则”，人类有一种古老的行为习惯，总是倾向于用别人对待自己的方式对待别人。

    互惠原则在人类社会化的过程中变成一种深深植根于我们心目中的价值观，在社会中几乎无所不在。


    下面就是“如何让自己和厉害的人交上朋友”的三个法则：


    ### 1.第一个法则：品性能值


    ACCA特许公认会计师公会是全球著名的会计师团体，我有幸成为ACCA的智库成员，刚一入群就发现，智库里都是深交所、上交所领导、上市公司协会、商学院、四大等等的各种高管和投资人。但这个群的运营者Nicky是
    Ed? 是一个看上去普普通通，30岁，很爱笑的女孩子，在群里有很高的威信——她和所有这些厉害的人都不仅仅是工作关系，而是很好的朋友。


    我把这种能力总结为：品性能值。


    品：品格，一个自律，不给人添麻烦，尽量与人方便的人，即便无趣也不会让人拒绝，这才有交往的基础。有品还意味着不唯利是图，牛人的眼睛都是雪亮的，自私自利的话三二三次交往就露陷了，被人利用的感觉对“关系”是致命伤。


    性：个性和爱好，让自己有一个骨灰级的爱好，有趣的人最吸引人。她的爱好是听音乐会，她每年会保持听30-50场音乐会，在古典音乐领域是骨灰级票友。我另外一位好朋友则是深度旅行者，能够用伊斯兰语唱诵古兰经，能够告诉你纽约最好的餐厅菜单上的秘密。


    人有一个骨灰级的爱好，会在最专业的人面前也有一份怡然自得的气场，天然散发着吸引力。


    能：能力和能量。能量和价值，一起聊。


    值：这个值，指的是创造价值，而不是仅仅是交换价值。每个人能 量有限，你又能交换多少？但是每个人都有自己没有发现的需求，没有发现的朋友，你要做的是链接他们。


    我有个营销高手的朋友思路非常好，但他缺乏记录，我每次都要帮他整理，做 好记录发给他；

    有时两个朋友其实相互需要，帮忙链接；

    定期举办小聚会，邀请不同的人擦出火花也是创造价值的事。


    Nicky一次偶尔听到发改委的首席经济学家范剑平老师的分享，觉得非常好，她会一直留意范老师的发言，去听范老师在广州讲学的课，主动联系合适的出版社和分享的企业。范老师是美食家——每次到广州讲学，都会带他去品尝当地美食。


    做骨灰级兴趣拥有者，做小圈子的组织者，做资源的整合者、跟高手过招、与伟大同行。


    ### 2.第二个交往法则：主动麻烦别人


    这有点反常识，不应该是“没事不要麻烦别人”吗？在东方这种耻感文化强烈的国家，麻烦别人是很不道德事。但反过来想，比你厉害的人需要你的机会比较少，主动麻烦他反而是建立互惠关系的第一步。


    本杰明·富兰克林说，“如果你想交一个朋友，那就请他帮你一个忙”。他自己就是这样做的——在他的自传里，他提到：为了结识一个顽固的众议员，他主动问那个... 结果再次见面的时候，那个顽固的议员对他态度好了很多。


    和牛人来往也是。主动“麻烦”之余，也让你有了一个获得回报的机会，让你们之间可能成为互惠关系。


    当然，做这种事要注意三点：不要帮太大的忙，毕竟不熟。不要谈钱，很容易搞成交易。最重要的一——让帮忙成为快乐的体验。邀请别人在他自己擅长的领域帮忙——运用优势是件快乐的事。


    关系是聪明地麻烦出来的。


    ### 3.照亮法则


    想象一下，如果你是一盏不算亮的灯，你的光光并不会强烈到有人专门走来拜访，但是当他想去你要去的地方，他就会想起你来。


    《肖申克的救赎》里Andy持续写信给州长要求建一个图书馆，他明知州长不会马上拨款给他，但如果州长有钱了，一定不会忘记这个写了很多年的人。


    在我的邮箱里就有一位老师，他每过一段时间就会写邮件跟我汇报他的现状，把他听课的笔记发给我。我很少回他的邮件，但是心里一直都有他的一个位置，一旦有需求，就会去对接给他。用定位的话说，他占据了我的心智。


    持续地用你的专业照亮大牛。


    我们讲了很多认识大牛的法则。请记得最后一个法则——做一个尊重自己的人。我特别喜欢一个老朋友分享的一个他的原则——面对上司把自己当人，面对下属，把对方当人。


    你也是这样——面对牛人，让自己成为值得帮助的人。面对别人，你一定会是某个人某方面的贵人，多帮助他人。


    ### —— 今日回顾 ——


    和大牛交朋友的三个法则：做有用、有趣的潜力股；聪明地麻烦别人；照亮法则。


    ### —— 每日践行 ——


    你身边有哪些比你厉害，又是你想结交的人？不妨试着运用今天学习的三个法则，去认识他们吧。


    ### 搞定牛人3法则


    ![](img/25e88d373f85ee6d39d9f51899b4f484_139_0.png)


    人总是倾向于用别人对待自己的方式对待别人。互惠法则是一深刻植根于我们心目中的价值观。


    今天是古典陪伴你成长的第208天，一起加速，成长为更好的自己。


