    \n古典\n\n# 超体们：\n\n这周我请到安人心智集团董事长沙、 “认知写作学” 的开创者阳志平老师做大家的 “特约成长导师”。在武侠世界里，绝顶高手内力雄厚，能够做到\
    \ “拍花摘叶皆可伤人”。阳老就是这样的高手，本文讲的 “卡片” 则是花与叶——卡片虽小，背后却有伟大人物实践和深邃的认知科学理论作为支撑。本文不但小中见大，而且易于操作，读来特别有启发！强烈推荐。\n\
    \n![](img/25e88d373f85ee6d39d9f51899b4f484_70_1.png)\n\n无话可说、不知从何说起，是很多人写作的 “拦路虎”。现在我和你分享一种简单到马上就能用的方法——卡片。这是纳博科夫、钱钟书等超一流作家都曾践行的\
    \ “最小行动”；也是我和 “认知写作课” 的同学们反复实践的超级方法。在开智的世界中，一切皆可卡片。\n\n# —— 卡片 ——\n\n如果要评选一位二十世纪最伟大的作家，纳博科夫必然当选。他是那类作家中的作家，才华横溢，公认的文体大家。同样，如果要评选一位二十世纪最热爱卡片的作家，非纳博科夫莫属。\n\
    \n就是这样一位超一流作家，在一生中为数不多的几次采访里，毫不掩饰自己对卡片的偏爱：\n\n> BBC 电视台（1962）\nBBC：您怎样进行写作？您的创作方法是什么？\n\
