  - '[PAGE 103]


    两片木板，用烧红的铁棍把木板切割成球扣，在这样的环境下打球，看似很动志，但打一辈子也就这个水平。被专业教练教一天的孩子就可以秒杀打了几年的我……


    每次霸占舞台后，我都会向观众寻求反馈：您觉得我哪里可以表现得更好点。这个过程极其重要，因为演讲是讲给观众听的，观众的反馈就是最好的建议，而且观众往往还会提供一些新的观察视角，这让自我的反思变得更深刻了。


    除了向观众要点评外，我还经常自己录像，带回家去分析自己的问题。刚开始的时候真不适应，觉得全世界最恶心的声音就是视频中自己的声音、全世界最恶心的画面就是视频中自己的画面。但不管怎么别扭，都得忍着心里舒适区被挑战。


    回看时，我会从观众的视角去看，也是从3个维度评判：内容、声音和肢体语言。针对这三项，我会给自己打分，以及分析对应的提升点在哪里。例如，有一次演讲，我在内容上只打了5分，因为讲的内容跟观众关系不大，干货不够也不够有趣，看完后，马上修改演讲稿，找机会再讲一次，分数变成了9分。


    只要坚持被别人点评和自我点评，慢慢地，我们会臭不要脸地爱上视频中的自己。


    这就是量变到质变吧。


    # 赛


    霸占舞台的过程中，我不断升级挑战，其中一个BOSS级难关就是演讲比赛。因为参加比赛意味着一堆评委打分、意味着要排名、意味着晋级或被淘汰…这会倒逼我用100%的努力来准备一个自己最棒的演讲，如果晋级的话，我还会迭代之前的演讲，演讲质量不断升级，舞台越来越大，观众越来越多，评委越来越专业，对手越来越强，也意味着自己的演讲能力随之不断升级。


    大大小小的比赛我参加过很多次，其中一次是参加上海地方电视台的《今天我主持》比赛，评委是吴宗宪、倪萍和陈蓉，当时已经进了复赛，在决赛前，导演组想把我包装成富二代（我真不是），我没同意，然后，就没有然后了…即便如此，这个比赛依然对我的主持和演讲能力带来了极大的提升。


    就像做很多有挑战的事情一样，面对演讲比赛，我们会纠结要不要参加，记住一句话：当你纠结要不要做时，那就去做。每个人的成长，必然要经过心理不舒服的过程，天天舒服服在家躺着不会有任何进步。如果你想极速提高演讲能力，演讲比赛一定要参加，你一定不会后悔。


    “学、练、评、赛”，是我作为过来人，对如何从零开始提升演讲的实战总结，希望能帮助到超级个体的同学们。


