    # 李海峰：凡事必有4种解决方案 35-6


    ## 古典


    这周的成长导师，我邀请了著名的DISC研究者李海峰老师，他研究行为科学很多年，是多家公司的董事，特别懂得沟通。年前我们还以“超级个体”的名义在各地做了很多公益讲座，是我一个很好的朋友。


    我本来邀请他来写点东西，他说自己讲的比写的好，所以我说不如来录制一期音频，然后我们把它整理成文字，于是就有了今天的声音和文字。


    接下来听听海峰老师的分享——凡事都有四种解决方式。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_192_0.png)


    企业在招聘人才时，一般会用到2种测评工具：


    - 一种是评估类，判断你行还是不行，它的理论基础是心理学，依据是你的过去，他要解决的是你是准，比如MBTI。

    一种是评测类，认为你各种特质都有，但就是使用程度的不同。它的理论依据是组织行为学，面向的是你的未来，他要解决的问题是协助你成为准，比如今天要讲的DISC。


    说到DISC，不得不提一下它的创始人——美国著名心理学家威廉·摩顿·马斯顿，他研究人类行为多年，出版《常人之所以然》一书，创立了DISC理论。除此之外，最近电影院火的《神奇女侠》也是他的代表作，其中影片中的真言套索也是他发明的“测谎仪”的一个原型。


    DISC具体是什么，古典老师在本周三时有讲，它根据“关注人”和“关注事”，“快”和“慢”两个维度，可以分成目标明确的D特质、受欢迎的I特质、善解人意的S特质和思维缜密的C特质，如下图。你属于哪种类型？


    ![](img/25e88d373f85ee6d39d9f51899b4f484_192_1.png)


    你可能会选不出来，或者觉得不同情境下，四种特质都会出现。其实，DISC理论的前提假设有3个：


    - 1. 每个人身上都有DISC，只是比例不同。

    2. DISC四种特质，不是优点不是缺点，只是特质。

    3. DISC是可以调整和改变的。而且，这四种特质还可以被训练和掌握，需要的时候都能拿出来。


    ## 一、心情不好时，你有四种解决方案


    - 1. D特质：选择有挑战性的工作或者运动；

    2. I特质：选择参加朋友聚会或者Shopping；

    3. S特质：选择回归家庭给家人做顿饭；

    4. C特质：选择静静看书或者玩数独。


    ## 二、拖延时，你有四种解决方案


    - 1. I特质：调动想象能力和说服能力，激起自己做事的兴趣；

    2. D特质：必须得拿到结果，自己才舒服，要立即行动；

    3. C特质：分析究竟是哪个环节阻碍了行动，然后解决，程序开启；

    4. S特质：找朋友聊聊，给自己赋能，然后开始做。


