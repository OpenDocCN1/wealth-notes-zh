    今天是古典陪伴你成长的第 229 天，一起加速，成长为更好的自己。


    ## 写下你的人生选择题


    ## 为什么能力比你差的人，挣得却比你多？

    33-3


    33-3 为什么能力比你差的...


    我最近遇到个很困惑的事。我在一个公司就职就业做了3年，从基础员工做到HR经理。最近部门突然有一个新岗位，招进来一个比我能力、资历都差一截的人。发工资时，我才知道，她的收入比我还要高。我心里很不平衡，为什么能力比我低的人，收入却比我高？我想到辞职，但朋友说，这种事在别的公司同样会遇到。我很矛盾。


    - A. 离开。

    B. 不离开，继续观察情况。

    C. 先呆着，并着手找下家。


    ### 古典


    要做好这道选择题，我想讲一个生涯领域里一个很重要但经常被误解的话题——你的工资由什么决定？


    很多人会说——“提高能力，创造更高价值，收入自然就高了。”


    错。你的工资并不是由能力决定——而是由“职能价值”和“供求关系”共同决定的。


    同样两座房子，质量相同，但因为一个在北京的五道口，一个在北六环，房价可能就差出10倍。因为五道口的房子参与了五道口商圈的价值链条，有人住在这里可以在附近赚取高薪收入，有人可以利用客流做生意，有人可以享受附近的学区房。而在北六环也只有居住价值。


    李嘉诚说：什么决定房价？地段！地段！地段！


    因为房屋是使用品，所以它参与的价值链条共同决定了它的价格。所以同一个地段，质量越高的房子越贵。


    职业也是一样——你在公司价值链条中创造的职能价值，决定了你的工资上限，你的不可替代性，决定了你的工资和上限之间的关系。


    举个例子，金矿属于高利润行业，但是挖金矿的工人收入很低，因为他们可替代性很强。


    同样的道理，同一个咨询师，给企业家做咨询和给普通员工做咨询，所需要的时间和技能都一样，但是因为帮企业家做正确决定，可能影响千万的价值，而帮助员工做一个正确决策，也许只是影响他一个月的绩效。所以两者的咨询费也完全不同。


    ```

    高收入=高价值产出x不可替代性

    ```


    当你看懂了这个公式，我教你一招更高级的技能——卡位。


    卡位这个词语来自于篮球比赛。篮球比赛中，当球还在空中的时候，球员通过精确判断球的有效落点，抢先于对手占据有利位置，将对手阻挡在最佳位置以外，这就是卡位。如果对手硬抢的话，就可能被撞倒在地，或者被判犯规。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_167_0.png)


    公司和行业也有卡位现象。比如，一位老员工如果没有明显地失职，即使公司遇到了能力更优的后来者，鉴于其背后的磨合成本，公司一般也不会去更换员工。这时候，卡位的人就更安全。


    再比如，当消费者习惯使用某一个产品以后，他就会无意识地选择这个同一类型，因为要迁移到另一个产品上，因为适应的成本很大。所以一开始就占据卡位优势的产品、员工，一般都会发展得更好。


    当然，没卡上位也不代表没机会——因为在职业的赛场上，代表价值的“球”是随时移动的。如果你能够积极洞察组织的各种趋势，灵活调整自己的站位，你就能借着势头占据有利位置。


    再举个例子。


    互联网文案红人——李叫兽的成名文案是《你为什么会写自嗨型文案，X型与Y型文案的区别》，他先是证明了自己的文案能力，然后选择开文案写作班，虽然招生效果不错，但是到后期还是出现了问题。因为运用“科学营销”的能力教一个刚入门的文案小白写文案，周期太长，价值反馈不高。


    他后来转型给企业做咨询，从360开始给企业做文案设计和营销咨询。企业文案和营销的周期短，一个好的创意能为企业创造的收益也是巨大的。后来又加入百度，利用大数据做营销，进入一个更好的价值链条。


    李叫兽的转型故事就是“卡位”教科书——先证明能力，然后上场找好位置，接着提升能力，再找新的卡位。


    这个时代有很多“机会球”在空中飞，要积极卡位。这是眼光和能力的双重考验。


    在职业选择上，瞄准一个你可以上场的高价值区域，尽早进入，你未必一定需要跳槽与转行，比如，你可以从公司边缘部分开始，慢慢撬到公司核心区域，也是一个很不错的选择。


    ### 古典


    我的建议是：选择B


    开头提出问题的朋友面临的问题是，公司有一个新机会，本来自己应该是最早发现的，但缺乏卡位意识，所以被能力没那么好的人卡了位。眼力不如人，其实挺公平的。


    不过也不用泄气，世界很公平，当你看懂了背后的规律——高收入=高价值产出x不可替代性


    你会发现，机会球还是有很大的，快打起精神看准下一个吧！


    ## —— 知识众筹 ——


    ## 一条帮助职场新人少走弯路的建议


    6月是个毕业的季节，又将有几百万大学生面临一个重要的人生拐点——踏入崭新又陌生的职场生涯。


    在过去7个月的学习中，相信你一定摸索出了一些自己独特的职场理念和心法。


    现在，我正式邀请你，为这些职场新人提供一条你认为是最重要的建议，帮助他们走稳职场第一步。


    例如：


    - 面试简历最该准备的内容是什么？

    面对第一位上司最好的心态是怎样的？

    初入职场时，你踩过什么坑，告诫新人不要再踩？


    ## 收入的决定因素


    ![](img/25e88d373f85ee6d39d9f51899b4f484_167_1.png)


    收入=价值产出x不可替代性


    你在公司价值链条中创造的职能价值，决定了你的工资上限，你的不可替代性决定了你的工资和上限之间的关系。


    今天是古典陪你成长的第230天，一起加速，成长为更好的自己。


    ## 问答 | 运用 “沉船” 的智慧，解决转行的问题 33-4


    ![](img/25e88d373f85ee6d39d9f51899b4f484_168_0.png)


    33-4 问答 | 运用 “沉船” ...


    ![](img/25e88d373f85ee6d39d9f51899b4f484_168_1.png)


    古典


    今天是特别专题 “人生选择题” 的第四天，我在这里统一为大家解决一些比较有共性的问题。


    我是从事工业自动化领域销售的，“关系型”运营模式，除了两个财务人员就是我和伙伴作为销售组成了这个公司。这两年一直不瘟不火，中间投资几次也失败，还影响了目前业务的正常运转。


    问题一：我一直想进入编程教育培训行业，但对那个行业不了解，是不是进去之后必须从最基础的工作做起呢？


    问题二：或者是根本就不应该转行，继续 “拯救” 自己的原有业务？目前我服务的客户企业在走下坡路。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_168_2.png)


    古典


    你这个问题是生涯里经典的 “沉船问题”——假如在大海里，发现自己的船在缓缓地下沉——这个时候，到底是停下来来修船，还是跳入海中，游向下一条船？


    首先要看的，自己这条船窟窿到底有多大，能不能补。


    第二要看的，对面的另一条船是不是真的靠谱，是不是海市唇楼。


    第三要评价的，到底有没有这个体力，游过去。


    回到你的话题，工业自动化销售的靠关系营销近年来随着国有企业增长放缓、监管加严的确变得不好做，这船是有窟窿。


    投资几次失败，证明也许对于新的模式摸索还不够清晰，补窟窿的能力暂时还不够。此时，组织选择 “关停并转” 都是可能的。关闭、停止运营、合并并购、转方向。这就是补不补窟窿的问题。


    编程教育培训行业是一个竞争非常充分的行业，加上近年来网络教育，小地方地域优势也少了很多。所以如果没有很充分的竞争力，直接开始可能风险不比原来业务小。这就是对面的船靠不靠谱的问题。


    如果直接从基层进入，那就意味着有个2年左右的学习期，还不一定能学到真东西。因为你学习那家企业也未必太好。这就是你是否能有钱，有能力游过去的问题。


    综合我们本周一说的AB的Z打法。可以把修好船作为A计划，把编程培训行业做B计划，然后把当前公司维持不死做Z计划。先积极的思考、寻求拯救公司的可行性，花个半年时间研究软件培训领域，或者更多可能性。然后找到靠谱的人维持公司状况。


    带着这个觉悟，类似的切换问题，就变得简单了。


    毕业三年，一直在一线城市国有银行从事柜员工。


    然而我发现，自己和小孩子接触的时候不觉得累，特别愿意帮助他们成长。而且我觉得传统银行业已经开始走下坡路，早教行业会有更多机会。是应该朝着客户经理这种销售岗位方向做努力。还是应该斥舍离现在的工作，做早教培训行业。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_168_3.png)


    古典


    传统银行的确在缓缓下沉，如果一直待在柜台的确有危险，但是销售岗位却还是在水平面上。这个窟窿能补。


    早教这条船有机会，高级、高学历的早教老师是很缺的，但低级的早教老师的处境未必就很好。如果你好不容易游到早教行业，发现又要被替代，岂不是可惜？要想想核心竞争力。


    如果真的热爱早教，考取一些业内承认的资格证书或者学历，高姿态切入。所以，这你需要有积累游过去的体力、财力和时间。


    用客户经理做A计划，用早教做B计划，柜员暂且做个Z计划，但是要注意——Z计划估计5年之内就会慢慢消失啦！


    ## 总结一下：


    再遇到转行的问题，我们超级个体的小伙伴一定要记得问对方三个问题：


    - 1. 你这条船哪漏水？一定会沉没吗？

    - 2. 对面的船，会更好吗？是海市唇楼吗？

    - 3. 我到底有多少时间、精力能游到对面去？


    然后帮他制定一个ABZ计划。


    今天是古典陪伴你成长的第231天，一起加速，成长为更好的自己。


    ## 人生的选择题


    ## 对冲：如何控制生活中的事奉系确定性325033-5


    非本店铺购买，不更新


    对冲：对于重大的，不可控的东西，最好的方式，就是有一定的对冲，尤其是面对职业风险时。比如，你在一个夕阳行业读一个新兴领域的在职硕士，这就是一种职业风险对冲。


    我应该在上海再拼一下，还是回苏州工作？


    我即将从上交医学硕士毕业，我现在读研的专业是本领域顶尖的。家在苏州，如果回去工作生活条件和环境较好，可以照应到父母，爱人也想回苏州。如果去上海再拼一把，为了行业内的名声、地位，就要回上海读博，之后尽全力留在现在的医院，但是要面对一个不是特别确定的未来。


    上海的工作压力很大，我们做医生的除了要干临床还要承担科研任务，竞争很激烈，在非常长的时间内工资较低，房价、车的牌照，孩子念书都是要考虑的问题。


    古典


    ## 亲爱的宁涛：


    基于一个顾问的专业素养，我会特别客观地说，你要遵循自己价值观做选择！你这个人生阶段是更看重家庭和谐，还是更加看重事业机会？这取决于你的价值观。但是这样的短短一个问答，我又何尝能触及你的价值观呢？


    在没法长谈的情况下，不如直接给你我的建议。


    如果你是我的朋友、我的弟弟，我会建议你再冲一把，读完博士，努力留在上海医院。理由很简单——你现在还年轻，在上升期。如果你选择了上海读博，你随时能回去苏州；但是选择了苏州，也许回去上海的机会就少了。读博是更好的人生机会。


    李嘉诚做投资的时候，这样判断一个机会——如果你能从A到B，还能够随时从B回到A，那么这个投资是更好、更高概率获得高回报的投资。读博士，再奋斗几年就是能从A到B的那个选择。


    本质来说，这个思路就是对冲。对于不可控又重要的东西，对冲是个好选择。


    什么叫做对冲？著名财经分析师树泽，在公众号“树我直言”说过：同时购入两个同时跳跃的东西，就是对冲。植材铺卖药，死活都赚钱。


    对你来说，小城市安家，大城市奋斗也是一种对冲方式。


    今天是古典陪伴你成长的第 232 天，一起加速，成长为更好的自己。


    ## 揭晓 | 关于职场中 “我吃过的亏，你别再吃” 的建议 33-6


    ### 古典


    这周人生选择局，我们做了一期特别有意义的知识分享——请超级多个体里各行各业的高手，专门为刚进入职场的新人贡献他们的职场经验。下面截出来的每一个字都是来自时间的反饋，特别值钱。期待能解答职场新人的困惑，帮助你少走弯路。


    刚毕业的新生最好先去一线城市，全国大部分人才资金、极具发展前景的新兴行业都聚集在这些一线大城市。那里牛人多、机会多，成长速度更快。——小舍


    年轻人初出职场，选一个发达城市，比如说北上广，无论在资源、机会、文化氛围方面都会有所不一样。——Ameizeng


    大城市作为世界的中心，有无限可能，但也伴随着巨大压力；小城市的可能性较少，职业种类和文化都相对单一，但其纯度却大大提高，压力也比较小。不管大小城市，对于内心没有方向的人，去哪里都是逃离；对于内心有方向的人，走向哪里都是追寻。要追不要逃。——古典


    当不知道自己做什么时，尝试不同的职业多去体验，在体验中找到真爱。——小敏


    每天的工作切勿埋头苦干，做前多维度思考，做后总结经验教训，每件事情都可以有条理的完成，加班不代表努力。——飞


    暂时收起自己特立独行的做事风格和思维方式，先融入大环境，然后慢慢将自己的特质显露出来。尽可能练就出色的写作和沟通能力，这些能力在哪里都需要。——佛砺小马哥


    要高自尊，有原则，有底线，不在意功利得失；要聚焦事，把自己的工作做到极致，体现自己的发展潜力。如果可能，抢着做事。做每件事都能发现自己优势和不足，还能赚取收入，何乐不为？——u爸u爸


    理想的职业从来不是挑出来的，而是慢慢修出来的。找到一个工作之后，先安身下来，然后思考这个企业在行业的位置和价值，找到自己的发展目标，然后一步步调整位置和方向，这才是大概率的成功法门。——斌仔


    在职场上混，目的清晰，然后想方法和行动；做大概率会赢的事，不要管每件具体事的具体成功；表达是最重要的事，沟通是最重要的事，不断训练自己的影响力、复制能力；找不到态度，就回到真诚。——罗振宇


    吃亏当吃补，使劲干、努力干、拼命干，跳出舒适区，只要有机会，哪里需要去哪里，哪里困难上哪里。——OreficeZOE10


    要积极主动，做好交代的每一件事，比起少出错，更要不二错。——原小青


    建议好好琢磨下《三体》中的一句话：弱小和无知都不是生存的障碍，傲慢才是。——曹佳林


    不要企望找到能轻松成功的路径。天上不可能掉馅饼，即使有，也是毒馅饼。只有经历折磨换来的，才是自己的，否则那就是坑，是套路。出来混早晚要还的。——郭志远


    转换学习视角，不要停止学习的脚步。相对于在学校通过学习获取高分，在职场要通过学习解决问题和创造价值。——u爸u爸


    要有投资观念，一是投资自己，比如学习充电、买书；二是开源节流，做一些理财项，积累个人财富。——Ameizeng


    有复盘意识：老事情写文档，新事情做复盘。——Lynn


    轻松的工作对于职场新人来说，就是隐形的毒药，别毒害自己。——平心


    想经营企业一样经营自己，找到自己在 where，明确自己去 where，知道自己 why 去。——one


    送给新人八个字：“埋头做事，抬头看路”。如果只允许我送一个字，那就是希望你足够“傻”。——虞骏豪


    能力和竞争力不等同，如果觉得自己怀才不遇，多想想身边比自己等级高的人身上的优点，多点现实少点幻想，少说多做才能找到自己的核心优势。——刘博


    订阅《超级个体》，不解释。


    古典

    欢迎你把今天的建议清单，分享给初入职场的朋友，一起听听前辈的建议，少走一些弯路。


    今天是古典陪伴你成长的第 233 天，一起加速，成长为更好的自己。

