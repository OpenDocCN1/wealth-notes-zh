    刘润是中国最贵的商业顾问之一，润米咨询CEO，前微软公司的战略合作总监，担任海尔、百度、恒基、中远等众多大企业的战略顾问。每周末，他都会邀请一位著名公司的CEO或者负责人，担任他专栏的客座教授。


