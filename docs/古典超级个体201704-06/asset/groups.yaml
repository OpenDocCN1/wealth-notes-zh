    # 三招，帮你重建心理边界 36-3


    36-3 三招，帮你重建心理...


    - 1、心理边界的形成：是从我们幼年时期与重要的人之间的关系中形成的。

    2、修复心理边界的三个技巧：看破攻击、区分伤害、重建边界。


    我们用了2天时间谈心理边界和心理越位。今天谈谈，边界是如何形成，又该如何修复呢？


    先来说第一个问题。心理边界是怎么形成的？


    心理边界是你从小和重要的人的关系中形成的，其中最主要要有三个阶段。


    第一个阶段是0-3岁和妈妈的关系。5个月之前，你哭了，妈妈拍手；你饿了，妈妈就喂奶，这个阶段，你没有边界——你会认为自己和妈妈是一体的。比如，我们家的宝宝，妈妈抱着的时候，宝宝会打开我放在妈妈身上的手——他认为只有自己和妈妈是一体的。这就是“在一起”的第一阶段。


    第二个阶段是5-10个月后，你会发现外面还有个新奇的世界。开始把目光投向母亲之外的人和事，开始探索和尝试。这就会进入边界建立的练习期。这就是变得“不听话”的第二阶段。


    这个阶段有几种表现，比如：


    > “这是我的！”——这是归属意识的启蒙，玩具不让别人动，但却拿别人的东西，占为己有。因为你有了“我”、“我的”概念，所以就想表达能对自己的东西说了算。不理解的...说“你不能这么自私”。


    > “不要！”——这是练习语言的界限。此时，宝宝正努力把自己和不喜欢的事分开。如果小孩子此时体验到可以自由地对人家说“不”，成年后才有可能向不好的事说“不”。


    > “我生气啦！”——大哭、闹，这是练习情绪的界限。他是在试探“我是不可不可以不高兴”，“我不高兴别人会...”。家长的反应常常是“你再哭不要你了”，“你怎么那么不乖啊”。


    如果这些阶段过渡不好，你的边界感就会有问题——要么长大以后跟父母分不开，什么都需要依靠父母，要么就是边界变城墙，把自己困在小圈子里，长大成为一个很独的人。如果这些阶段过渡好了，你就能顺利的进入第三个阶段——“求助”。你会建立自己的边界，也知道这个边界的极限，你会说——“妈妈你帮我……吧”。


    就在这个瞬间，孩子和母亲的关系已经改变了，孩子有自我边界，也懂得向外开放，这是你第一次求助——未来在社会中一个人善于来事、求助、妥协，都从这里开始。


    很多人听完倒吸一口凉气——我被毁掉的童年啊！我们当然没法回到童年，责怪父母也是没意义的，他们当年也不懂——最好的方法是当自己的父母，“再养自己一次”。


    这就是我今天要讲的第二个问题，如何修复心理边界。下面教你三个重要的技巧：


    # 1、看破攻击


    心理学上有一个概念叫做“被动攻击”：个体会用消极、恶劣、间接、隐藏的方式发泄自己的情绪，以此来“攻击”令他不满意的人或事，也会冲击你的边界——心理攻击招数有很多，不过归纳起来还是“一哭二闹三上吊”。


    “一哭”，利用的是你的愧疚心。就像歌里唱的，“最爱你的人是我，你怎么舍得我难过？对你付出了这么多，你却没有感动过”。意思是，“我这么做为了谁？都是为了你！”“我这么惨了，还不因为你。”——炮弹打来了，我们知道躲；但是包上糖衣的炮弹打来，很多时候就心一软生吞下。“二闹”，利用的是你的羞耻心。撒泼打滚你忍不了了，于是息事宁人，退让求安。“三上吊”，利用的是你的恐惧。再不同意，你就要失去这段关系、这个人了。


    一个心理边界清晰的人，面对被动攻击，往往能看破、不说破。


    一个人活得不好，也许和你有一定关联，但是最大的责任还是他自己的，因为只有他能完全控制自己。所以只有自己能为自己的行为负责，为自己的情绪负责，而不是你来负责——如果连负责自己都不管理，你又如何能为他负责呢？


    # 2、区分伤害


    善良的人缺乏心理边界，因为他觉得这会让人痛苦，所以一味退让，往往情况会更糟。


    我们都学过《孔雀东南飞》。焦仲卿的母亲逼迫焦仲卿夫妇分离（阿母得闻之，槌床便大怒：“小子无所畏，何敢助妇言！吾已失恩义，会不相从许！”），虽然一时达到目的，但最终结果是焦仲卿、刘兰芝夫妇双双自杀。


    以往人们批判焦母说是万恶的封建专制，其实你抬头一看——今天社会类似的事情何其多！焦母其实是心理越位，但儿子焦仲卿的“心理边界”也模糊。他一味退让，不忍伤害母亲，结果是害了全家。


    “伤”和“害”是有区别的。就像拔牙会“伤”到我们，但却不会“害”我们；吃糖不会“伤”，但是吃多了却是一种“害”。明确界线，短期的确会有“伤”，会有不和谐的感觉，但是长期其实是清清爽爽的过程。从别扭扭扭地拒绝，到正正当地拒绝，本身也是一种修焉。你边界清晰了，周围人的边界也会清晰，是件利人利己的事。


    如果有些人因为你正当的划定界线离开你而去，就由他去吧！


    # 3、重建边界


    重建边界的关键，是“温柔地拒绝。”


    比如，你是“北漂”，电话中你爸妈又一次提出让你回老家来工作，你可以这样回答：我知道你们是为了我好（肯定对方动机）；但是，北京确实机会多，现在自己又在事业的上升期（说明现状）；这样好不好的，我先过两三年再说，一方面等待家乡的发展，另一方面也看北京的机会，如果好的话，也可以把你们接过来啊（替代方案）。


    这个过程也许结果不一定好，可能会引来一轮心理攻击，但是也应该保持温柔地拒绝，表明自己的边界。就和外交一样，要缔造边界，就要先从安全、信任的关系里的小事开始绷起，千万不要要先给...你关系紧张的大舅家打电话“喂，我们出来谈谈。”


    让自己从安全、信任的小事开始有技巧地拒绝，然后慢慢重新建立自己的边界。


    好了，总结一下我们今天学习的内容。


    我们的心理边界从幼年时期就开始逐渐建立，如果你因父母的疏忽和错误引导，没能在幼年建立清晰的心理边界，你现在有三个补救的办法：那就是识破攻击、区分伤害、重建边界。


    当你把这些方法慢慢放大，你会发现你慢慢成为一个身心如一的人——你可以清爽地拒绝别人，可以表现出真实的自己，你会体验强大的自信。这就是通过重建心理边界。实现“再养自己一次”的过程。


    重建心理边界是一个漫长的过程，并不是一篇文章就能解决问题的——需要时间，更需要练习、努力和调适。不过，与其在“为别人活”的状态里迷茫和焦虑，为什么不慢慢埋头努力找回自己？


    要知道，为别人活是一场永无宁日、毫无胜算的自我恐惧主义。


    ### —— 今日思考题 ——


    每个人都有过被“被动攻击”的时候，当时你是什么感受？今天你学到了重建心理边界的三招——你有什么新的观察吗？？

