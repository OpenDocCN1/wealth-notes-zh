    李海峰是个很有智慧的人，我常常能听到他关于沟通的洞见：“别人怎么对你，都是你教他的。”“凡事必有4种解决方案。”“懂比爱更重要”。在他参与的多个董事会里，他往往是其中的沟通协调者，我自己遇到大的沟通问题，也常常向他请教。如果你有任何关于性格挖掘、优势提升、和不同类型的人的沟通问题，请一定抓住这个机会，榨取他的智慧。


