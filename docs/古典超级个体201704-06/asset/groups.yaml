    # 峰终定律：设计好的高潮和结尾 27-3


    27-3 峰终定律：设计好的高潮...


    今天我们来谈谈，怎么给我们的演讲再加分——设计好开头结尾。


    演讲是听的逆向工程，所以我们先来讲一个心理学的重要的概念“峰终定律”（Peak-end rule）。


    ## —— ◆ 峰终定律 ◆ ——


    什么叫峰终定律？


    当你去判断一次旅行好不 好玩、一个party是有趣、一部电影是不是精彩，你并不会把它所有的瞬间各自评分，然后求得均值，你只会把最嗨的点和最后的感觉提出来，基于这两个点来评价。顶点和终点对于一个事情的体验最重要，这就是峰终定律。这当然是人脑的一个不那么理性的判断，但的确为我们打动听众提供了火力点。


    看电影

    比如说电影就是按照这样的方式做的，可能电影的过程非常无聊，但是这部电影只要有一个特别好的高潮，比如3D的大战镜头。大部分人都可以捏着鼻子看下去。如果最后还有彩蛋，你就觉得太有良心啦！看完一部一个半小时的电影不难，但你要听完一场演讲，那实在是太难了。


    吃大餐

    同样的道理，吃法国西餐也是按照这个方法来设定的：

    第一步，开胃小菜。就餐前会先端上来一盘开胃小菜，基本上是帮这个西餐定了个调子。

    第二步，上主菜。其实主菜就是让你体会高潮的峰值体验。

    第三步，上甜品。西餐最后会赠个小甜品，而且甜品往往非常好看。这其实就是让你对这顿饭留下一个好印象。


    我请人吃饭时，就有一个习惯——在吃到接近尾声时去买单。因为把买单作为吃饭结束动作是有点小尴尬的。吃饭最好的体验就是大家吃到兴起，关键时刻戛然而止，正好峰值和终值停留在同一个点上。不然大家聊到冷场，反而败兴。


    我后来发现有些聪明的商家也想明白了这个道理，所以一般他会在你买单后再送一个果盘，这个果盘其实就创造了一个终值效应。


    产品发布

    更加有趣的是在产品发布上，也是这样。你有没有听说过一本叫《重来》的书？这是一本一群作者写的书，这本书背后是一家叫37signals的公司，它们每发布一个新产品后的两周，都会再来一次重大产品更新，也就是说，它最初发布的那个产品并不是100%的版本，可能只是达到了80%-90%。


    这是很聪明的！

    他意识到一个产品推出来，只要满足一个关键点，获得峰值效应就可以。而在两周之后让用户免费获得一次非常棒的产品升级，就能获得终值效应。这样，用户对这个产品和公司的情感就会强烈很多。所以新产品的发布并不是一次达成的，对客户来说也不会觉得，我买完就...了。这样，他追加一个尾部体验，创造了两次特别好的高潮。


    我觉得很多人都看明白了这个事儿，比如说 Linkedin 创始人雷德·霍夫曼（Reid Hoffman）说：“如果你不为你发布的东西感到一点点尴尬，那说明你太晚了。”


    同样的道理，演讲也是这样。


    演讲时你不需要系统，也不需要面面俱到，你只需要在十几分钟的认知资源中，让别人记得一个关键点就是一个峰值，然后在结尾时获得一点小甜品。


    这个定律用得最聪明的就是乔布斯，他经常会在演讲最后面说“ One More Thing ”——“对了，还有一件事情”，然后从兜里掏出一个非常厉害的产品。


    ## —— ◆ 开头和结尾 ◆ ——


    理解了这个概念，我们就理解了如何设计开头和结尾。


    # 1.开头不要瞻谎虚


    在开头最容易犯的错误是乱谦虚——比如有一次我参加一个年会，董事长一上来就说：“今天来的路上，我还在想和大家说什么呢？我没有太准备好，今天随便说几句。”这也就是他的主场，没有人敢嘘——如果是客场，听众就嗤之以鼻了：“为什么不准备？我可是准备好了认真听你说话呢！”


    所以，你要用到好“开头三板斧”——最好能让人“哇一下、哈一下、嗯一下”。

    “哇一下”就是有个惊喜；

    “哈一下”是有个段子（一定要和主题相关，至少也和自己相关）；

    “嗯一下”说一两句让听众内心很认同，有共鸣的话。


    实在没有出彩的开头，至少可以开门见山——“今天我想说一件事，这件事对大伙的意义是……它分成下面三点……”。


    # 2. 糟糕的结尾


    “嗯，时间到了，所以就此结束吧。”


    共鸣的话。


    实在没有出彩的开头，至少可以开门见山——“今天我想说一件事，这件事对大家伙的意义是……它分成下面三点……” 。


    # 2. 糟糕的结尾


    “嗯，时间到了，所以就此结束吧。”


    这是糟糕结尾——首先显示出自己没控制好时间，也没提前设计，所以讲到哪算哪，其次还想暗示听众错过了后面要讲的精彩内容。


    “最后，我想感谢我优秀的团队成员，他们是……还要感谢我所在的机构、主办方……”


    先让自己的演讲变成值得骄傲的事吧！如果真要致敬，不如对观众表达。例如，“今天在场的都是非常棒的听众，希望你们能利用今天所学的方法，让自己的演讲更精彩！”


    “未来充满挑战与机遇，在场的每一个人心...中心只要有未来，都能有所作为。让我们一起梦想，改变世界。”


    假大空的升华一律不要。


    “我要用这段视频来结束我的演讲，它可以概括我今天讲的内容。”


    既然能概括，为啥不自己概括？再好的视频也是别人的。就好像你和谈恋爱的女孩表白一样，在最后关键时刻，你说我写了封信，让我同学来读给你听，他能表达我的爱。你觉得这个女孩会怎么想？


    演讲结尾也有三板斧——“重复、升华、指示”：


    # 重复


    重复你在开头提出的值值点——说好要带我们看有趣的世界，实现了吗？好导游会做一个旅行回顾。


    # 升华结尾


    柴静的《穹顶之下》大家都看过，其实我印象最深反而是她在央视的一个主题为《认识的人，了解的事》活动上的5分钟演讲。演讲的最后一段，就是升华；


    “一个国家是由一个个具体的人构成的，她由这些人创造，并且决定。只有一...（长引用）...我们才说我们有信心让明天更好。”


    好的升华，就好像《阿甘正传》里面的羽毛，从一个人手里飘起来，升高，升高，看到整个世界和未来。


    # 清晰地给指示


    TED演讲《怎样用纸巾擦手》，只有5分钟，但给了一个清晰的指示，至今我还印象深刻——方法只有2个词：抖（shake）、折（fold），洗好手后先抖动十几下，然后拿起一张纸巾折叠，这样就可以无死角地把你的手擦干。


    最后我也说个甜点吧——


    准备这篇内容时，我正在帮某著名民间女权主义者修改演讲稿，我也跟她提到了这个峰终定律。结果她翻了一个白眼说——峰终定律果然很好啊——同样的道理，你们男性在那件事上，总认为时间越久越好，其实重点是峰值和终点。


    所以，世界上的道理都是相通的。


    听懂的，你是智慧的；听不懂的，你是纯洁的——能听到这里，都是好好学习的人。


    ## —— 今日回顾 ——


    什么是峰终定律？你生活中间有哪些峰终定律的例子？


    开头的三板斧是什么？结尾的三板斧是什么？


    ## —— 每日践行 ——


    你工作和生活里，有哪些峰终定律的影子？你如何提高影响力，如何提升判断力？


    尝试在一次讲话中，使用开头、结尾三板斧，然后回来谈谈你的感受吧！


    ![](img/25e88d373f85ee6d39d9f51899b4f484_89_0.png)


    心理学家发现，体验的记忆由两个因素决定：高峰时（无论是正向还是负向的）与结束时的感受，这就是峰终定律。


    今天是古典陪伴你成长的第 188 天，一起加速，成长为更好的自己。


