    下周的话题，是我们几乎天天遇见的“老朋友”——情绪。如果一个人连自己的情绪都管理不好，又怎么去照顾别人呢？更不用说打造高质量的人际关系了——你永远给不出你没有的东西。


    单是“情绪内耗”就能让人心力交瘁：有些事想想就觉得“累”？有些人一见就心烦？担心、焦虑、烦躁……就像雇人在自己家里打了一架——负面情绪和对于负面情绪的克制，都消耗了你的“精力”，最终“家”也被砸个稀巴烂。


