    # 联机进化：扩大人脉圈，实现知识互联 30-3


    30-3 联机进化: 扩大人脉...


    +   1. 如何快速实现自我增值，打破人脉屏障？

    2. 如何成功跨界，扩大人脉圈？


    我们身边有很多人，希望迅速地提高自己，因为只有自己有价值，才能链接到更强的人。但是好像不容易学回来的东西很快就人人知道了，两周才想明白的事，讲出去只要几分钟。


    怎样让自己学得更快？


    我把这种人叫做单机版的学习者，他们总是希望提高到某方面的水平，才出去跟别人交互，其实联机交互才是学习的最快方式。


    我曾经在英语角看到这个现象——一群人在对话，另外一些人总是 only 在旁边观望，你问想进去吗？他说不，就看一下，口语好了才去。


    你问他那怎么才能好呢？他回答：多练啊！


    这就是单机版的死循环——口语只有通过交互速度才能更快，所以围观者永远无法入场。


    # 1. 模仿高手速度最快


    学习《超级个体》的你应该有这个感受——很多东西你一听就拍大腿，原来有套路，而你已经浪费了这么多时间，而且是重复浪费。其实你遇到的问题，早就有解，你只需要一个提问。


    脱不花在她的长文《传灯记》里，谈到“扑导师”的重要性。


    > “我在工作中扑过安利总经理郑李锦芬、扑过点子大王何阳、扑过台湾成功学大师尚致胜、白崇贤……没有任何人的背书和介绍，也没有支付过任何的费用，他们都是在某个机缘巧合之下被我拦住，专门花时间解答我的问题，辅导或者帮助我完成各种不靠谱的工作任务。


    我恍然大悟。觉得自己实在是一个运气极好的人，因为什么都不懂，也就不太在乎这个所谓的‘自我’，误打误撞找到了一个最取巧的学习方式：做一名精巧的复制者和模仿者，代入导师的角色，观想他们的行为和思维。”


    所以，复制和模仿是快速学习的捷径。


    # 2. 联机带来知识跨界


    李小龙是怎样快速跃升为一个武学奇才的？


    李小龙当年在大学里面主修的是戏剧，辅修心理学和哲学。业余时间开始教授中国功夫，吸引了很多好奇者。但是他持续在武术里增加哲学思辨。这种教学法吸引了很多其他门派的武术高手，他们开始交换招数。后来，李小龙将全部所学汇汇在武学哲学里，用电影表达出来，从功夫高手成为电影明星。


    所以，联机能带来大量的知识跨界，引发可能性。


    教你一个小技术：朋友圈其实有搜索功能，当你遇到什么难题的时候，搜索一下，能找到合适的朋友。我就是这样很顺利地搞定了出国游的事情——因为有人晒。


    # 3. 联机带来多维思考


    美国新罕布什尔州的菲利普斯埃克塞特学院（Phillips Exeter Academy）是美国顶尖的私立高中之一，被《经济学人》列为“美私立高中第一梯队”。这里面最著名的学生是扎克伯格、丹·布朗、小洛克菲勒。


    比这些学生更著名的，是这个学校享誉世界的教学法——哈克尼斯圆桌。这个名字来源于1930年美国石油大亨、爱德华·哈克尼斯（Edward Harkness）决定向学院捐款时提出了一个附加要求——学校必须制造并实践一种变革性教学法，以适应那种成绩不好、害羞或者想法比较特殊的学生。


    最后就有了 一种每个人都看到对方，每个人都必须发言的方式，而且每个人身份有编号——壁花、战士、恐者、公民。


    人的思维很容易陷入“隧道式思维”。只盯紧一个方向，忽略其他角度，再聪明也没用。圆桌学习恰恰解决了这个问题。


    想想一个电影镜头——一个小黑点迅速变大，啪的一声，射中你，原来是一根箭；沿着箭看过去，原来是一把弓，把镜头拉高俯瞰，原来是一个弓箭手阵营，有很多弓箭手。


    # 点-线-面-立体


    所以，击中你的那个点，背后其实有很复杂的系统。


    圆桌法就等于把你的思考拉到不同维度，很多事情自然就有解了。


    这种方式就是“私董会”的雏形，《基业长青》作者吉姆·柯林斯说，“每个人都需要自己的私人董事会”。那普通人该怎么组建自己的私董会？


    我推荐一个自己发明的方法叫做“思想夜宴”，请4位朋友，每个人再邀请一位，最好是不同领域的。上半场是精华共享：每个人分享自己8分钟的干货，然后自由搭配。下半场是问题讨论，每个人丢出一个问题，最后投票决定讨论其中一个。每次大概3小时。我自己经常举办“思想夜宴”，在几次畅通中，逐渐认识了很多优秀的人，也形成了自己的“头脑私董会”。


    在这个时代，联机让你学得更快、视野更广、思考更全面——人脉圈的重大作用，就是用知识互联。


    # —— 今日回顾 ——


    为什么说单机版学习是越学越累，而联机是更好的学习方式？


