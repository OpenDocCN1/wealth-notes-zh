    # 预告 | 什么是真正重要的人脉？ 29-7


    下周开始，我们将进入人脉管理学习周。我们会重点讨论下面几个问题：


    ## 1. 什么是真正重要的人脉？


    假如今天你遇到了一件能力范围以外的事，你会怎么解决？是自己闷头找方法，还是拿起电话找人帮忙？如果找人的话，你会找谁？如果那个人能够帮你，他为什么愿意帮你？


    我们每个人都需要很多朋友，但能帮到我们的朋友有多少？


    很多人为了有更多朋友，天天参加活动、合影、递名片、加微信，甚至还因为通讯录上有牛人的电话而自豪。可事实上，他们真的是你的人脉吗？什么才是真正的人脉？


    ## 2. 怎么才能搞定比你牛的人，甚至是大牛？


    有个法则说，如果你想知道这个人有多优秀，看看他最常接触的三个人的平均水平就可以了。


    为了提升自己，我们都希望能和大牛做朋友，但怎么才能认识大牛呢？面对大牛时，总感觉我有无数的事情可能求到他，但他好像没什么需要我帮忙的，这种情况我该怎么办？


    ## 3. 怎么通过人脉快速地学习、提升？


    生活中，我们总能看到有些人喜欢默默地憋大招，问他们为什么，他们说，只有我变得足够优秀了，才能链接到更强的人，进入更高的阶层。


    相反，还有一些人，他们也会努力学习，但能力到达某个层次后，就出去跟人互动，结交比他更优秀的人，然后带着信息再回来学习、提升，达到某个层次后再换好的圈子，如此循环，不断攀升。


    这是两种对待人脉的不同方式，那究竟如何利用人脉，才能帮助自己学得更快呢？你更适合哪一种呢？


    你先想想，我们下周聊。


