    31-1 一个品牌公式，更高职场身价


    前几天我一个朋友去买房付款，办贷款时才被通知，因为信用卡有几次没还，所以信用不好，不能批准贷款。犹豫了一周后，房价升高了10多万——他自己其实是个非常有信誉的人，只是没有管理好自己的信用值。


    其实个人品牌也是一样，很多很多人认为个人品牌是明星、大神的事，自己没有什么品牌——和信用一样，只要别人对你有认知，你就有个人品牌，只是大小、好坏的区别。


    一个人就是一家公司：如果说你的知识、技能，是你的“产品”；那么个人品牌就是你这家企业的品牌价值。很多人都有过出国逛商圈，买了一堆 MADE IN CHINA
    的东西的经历。这些产品在国内以极低的成本购买，加上品牌标签后，以十几倍的价格出售——因为背后的品牌价值。


    一个只有技能没有品牌的人，也会陷入只会生产的低水平劳动陷阱。美国学者彼得斯说过一句很著名的话，“21世纪的工作生存法则就是建立个人品牌。”


    # 个人品牌有什么好处？


    ## 1. 品牌提高溢价


    我们都知道褚橙，褚橙的确品相比一般的橙子好，但是也更贵。背后靠的是褚时健先生的人品和故事做担保。一个故事让橙子的品牌很快传播出去，省了很多广告费。


    同理，一个有个人品牌的策划师、咨询师的收费，一般是普通设计师的120%到150%


    ## 2. 品牌降低交易成本


    我们家的月嫂，我两个宝宝出生都是她陪护，她非常专业、负责——已经被我介绍了近10次，我的同事、合伙人、朋友家有了宝宝，都是找她。她成功地通过我，建立起了自己的个人品牌，我的朋友相信我的眼光，这让她的交易成本相当低，交易频次很高。


    她也是个特别感恩的人，会推掉别人家的机会，重新拿当年带我大女儿时的工资（那时她的工资已经很高了）继续带我的小女儿。这样的 人品，也会继续给她的品牌加分。


    ## 3. 品牌让你自由


    还有一个一般人不会告诉你的理由——个人品牌让你自由。我在前面专栏说过——自由有三种：不用得和特定的人合作的自由，不用为钱而做的自由，有能力做自己想做的事的自由。这三种自由，都需要个人品牌。


    # 什么是个人品牌？


    个人品牌其实就是“品质+名牌”


    ## 1.品质：品质又分为品和质


    品回答的是你生产什么？满足了什么需求？在哪条赛道？


    质说的是你在这一条赛道的排序如何？质量排第几？


    很多人选品是有问题的——比如说我朋友圈的一个人，宣称自己是“互联网里最懂摄影，摄影圈里最懂互联网”的人。貌似很厉害，其实并没有这条赛道——谁会去互联网选择摄影师呢？而摄影师要开网站，会去找到“互联网人”这种宽泛的定位吗？这种差异化竞争，只有差异，没有竞争。


    有了品，更重要的是质。你是不是能持续输出高质量的内容？


    郭德纲选择的赛道几乎是所有人都能选的——你看春晚上谁穿个褶子，长着嘴都能讲相声，但是他的品质一直保持很高的水准。我有一位朋友是粉丝，曾经追他三个月，全国到处听，发现他的相声是两周一迭代，基本不会重样。这很让人佩服。不是有过高品质，而是
    一直保持高品质。这种高品质背后是专业的能力和工匠精神。


    ## 2. 名牌


    这种品质在时间积累下会形成口碑，成为“名”。知道的人越多、出现的次数越多，你就会“名声大噪”。在你的名声中间，有些复杂难以传递，有些则简单清晰不断传播，名声就浓缩成了一个符号——这就是“牌”的出现。它是心智、视觉的符号。


    成龙刚去好莱坞拍电影的几场戏是哭着回来的。因为好莱坞认为这不叫功夫，他们对于李小龙的功夫印象太过深刻，觉得应该“啪啦”一下打死对方，怎么打这么久都还没打死对方呢？


    成龙 虽然有“名”但是没有“牌”，因为他被很多人知道，但是并不让人印象深刻，一直到成龙发明了自己的独特的标签——“好玩的打”，他用大量的好玩的、夸张式的动作，完全区
    分开了李小龙的简单利落的打击，成就了自己的名牌。甄子丹模仿了李小龙很久，名气很大，却未成牌——一直到《叶问》让“短打”成为他的标志。


    品-质-名-牌，这四步我慢慢讲来，是要强调——不要跳步。在没有搞清楚自己的品类和优势时，直接大面积做出“名”的事，可能会适得其反。


    历史上最糟糕的个人品牌，就是唐僧吧——他拥有全世界最糟糕的PR团队，作为一个要西天取经，经历无数妖魔鬼怪的弱和尚，传递最广的居然不是他法力高强，而是作为养生食品的品牌——“只要吃了唐僧肉，就能长生不老”。遇到这么多劫难，也是活该这一乱出名比不出名还糟糕。（开个玩笑）


    综合上面的内容，品质名牌可以简化成下面的公式：


    价值 X 人数 X 频次 = 名牌


    不妨在心里给自己做一道填空题——


    你“多少次很好地满足多少人什么价值”？


    这就是你的个人品牌。


