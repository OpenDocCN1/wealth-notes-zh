    这个时候，你需要了解击中人心内的5大元素，有了这些元素，平时有空积累，你的语言才有力度，才能把一个道理讲得生动有趣。


    # 五大元素


    # 1.主题金句


    名言金句，是被压缩过的信息。放在观点最后，往往有一种一锤定音的感觉。


    比如说乔布斯的 Stay Hungry Stay Foolish，你注意一下他下面的演讲稿，看看他是如何巧妙地把这句话偷偷念了三遍，植入你的脑海的：


    斯图尔特和他的同事们出了好几期《全球概览》，到最后办不下去时，他们出了最后一期。那是20世纪70年代中期，我也就可以是你你们现在的年纪。最后一期的封底上是一张清晨乡村间小路的照片，就是那种爱贪阴的人筏在那儿搭便车的斯种小路。照片下面写道：


    Stay Hungry Stay Foolish


    这是他们停刊前的告别辞。


    Stay Hungry Stay Foolish


    这也是我一直想做到的。眼下正值诸位大学毕业、开始新生活之际，我同样愿大家：


    Stay Hungry Stay Foolish


    （求知若渴、虚怀若愚）


    # 2.案例


    案例的选择有三个方向：自己的故事、熟悉领域的陌生面、全新的领域。


    比如说如果你要讲一个：“工作生活根本没法平衡，阶段性突破才是王道”的论点。那么你的案例可以是自己的故事；可以是罗列一堆工作中很优秀，但是也没有平衡的故事；也可以是一个全新的研究试验报告。


    # 3.数据


    数据的关键是可靠、有效和可视。好的数据往往会提出和支持看上去完全不可能的见解。比如说很多人都认为伟人都是“精力充沛，夜半三更搞研究”的夜猫子。这幅《纽约》杂志的数据图，就展示了伟人的作息时间表，一目了然——27位伟人都保持了8小时充足睡眠。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_83_0.png)


    # 4.比方


    比方有一个很牛的学名——叫做“隐喻”。


    你也许被新知的术语和框架搞蒙了，所以拿出另外一个你熟悉的模式给你看，告诉你——就是这么回事。


    比如说卓老板和万维钢都常用打比方——因为科学的世界太复杂了。比如他们在描述原子、原子核和电子的关系时，是这样打比方的：


    一个常温常压下的原子，原子核大约只是一个网球大小，剩下的空间都是电子运行的范围，这个范围大约和人民大会堂差不多，宏观物体之所以能维持一个外观，就是靠着外层电子在大计堂空间中形成的电荷力支撑。你手上的手机、书，每个原子都有巨大的压缩的潜能……


    白矮星就是发生了这样的压缩，人民大会堂的电子都挤到一块儿去了，每立方厘米的质量能达到1到10吨。而地球上最大的元素“铽”也不过22.5克。中子星更加厉害，大会堂消失，全部进入网球核，质量变成一亿吨每立方厘米了。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_83_1.png)


    是不是一下子脑子里就建立起大概念了？


    # 5.幽默


    幽默是一种很高水准的智力游戏。关于幽默的解释有太多了，大家都能意会，我就不多说了。


