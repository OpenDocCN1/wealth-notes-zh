    # 古典


    你不妨尝试下“卡片式写作”，这个是大作家纳博科夫的写作方式，他平时就用一些小卡片，想到什么就记录在卡片上，然后需要的时候把卡片全部掀出来，任意地拼接出新的灵感。


    我不止一次听到别人说卡片式写作，最让我印象深刻的就是《天使爱美丽》的导演让-皮埃尔·热内，他在创作这部电影时，要四处搜集故事，所以就弄了一个空鱼缸，每次想到一个关于小姑娘的故事，就写一行字，然后扔到空鱼缸里。等鱼缸填满了，他就开始拍这部电影了。


    所以如果你没时间写作不要紧，那就写一个两三百字的卡片，如果这个也写不下去，那就用一个电脑软件记录2到3个关键词。当这些关键字出现了十到二个的时候，写作自然就容易发生了。


    李太初: 写了得不到反馈——1. 得不到肯定。文章发到公号，能传播的也就身边的圈子，但貌似身边人都不怎么看文章，导致我的阅读量不超过200，挫败感很强；2.
    得不到指点。


    # 古典


    还是回到那个原点。


    第一，如果写作能让你了解自我，那么写到心安写到爽就是最重要的。


    第二，如果为了整理思绪，那么你写完以后觉得你的思维状态比以前更成熟了，这就是重要的。如果为了记录文档，那么当你两个月以后往往回看，能找到那个文档就是最重要的。


    第三，如果为了影响力，那么你的粉丝数和点赞数的确是最重要的，但是在我看来大部分人都达不到这种，所以如果你能写爽，能提高思维能力，我觉得已经非常好了。因为这两件事情是思想的催产婆，总有一天，它会帮你产生出真正重要的值得传播的观点。


    好了，讲了这么一大堆，我想有一个问题，你也许想问，但是也已经有答案了，就是——到底存不存在写作天赋这件事情？


    我在优势那一章（见第16周文，重点可看16-4）讲得很清楚。有些人的确会比你更有写作的天赋。但是这些纯靠天赋的写作者也干不过一个没什么天赋但刻意练习的人。


    每个人都能通过刻意练习学习好写作。最好的方式是——让自己学会写作这门技能，至少练到80分。如果你有天赋，就试着冲向100分。


