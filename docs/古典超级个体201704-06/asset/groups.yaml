    ## 精华 | 运用故事思维，做自己人生的好导演

    28-5


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_0.png)


    28-5 精华 | 运用故事思维...


    ### 1. 故事，是一门被低估的学问。


    故事容易传播、容易记忆，而且更有影响力。


    美国总统竞选、商业路演、品牌宣传、项目发布、个人介绍，故事无处不在。逻辑思维让你成为一个清晰的人，而故事思维让你成为一个有影响力的人。


    ### 2. 像修图一样修改故事，一个故事有四个图层——情节、情感、细节、主题。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_1.png)


    故事思维就是用故事的元素把事情包装起来，把个人的情感融进去，让人产生代入感。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_2.png)


    ### 3. 七步成故事法——怎样设计一个好情节。


    目标、障碍、努力、挫败、意外、转弯、胜利。


    更加复杂的故事，可能是2-3条线的转折。比如说《霸王别姬》的主线是程蝶衣和段小楼的关系，但是还渗透着袁四爷、戏班子成员、菊仙等人的个体命运，最后又带出一个时代群像——这都是高级用法。


    重要的是，你也可以用更好的方式解读自己的人生状态。


    ### 4.故事里的英雄之旅——人类的冒险经历。


    走出舒适区，遇到更多朋友，改变世界。


    每个人的成长故事都是极其类似的，其实都是一个走出舒适圈，链接新圈子，然后经历磨难，最后升级回归初心的过程。


    故事即生活，故事是浓缩的生活，生活是真实的故事。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_3.png)


    故事是一种记回的方法，是一种有效的设计。有了这七步，讲故事、听故事、看电影都将变得不一样。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_4.png)


    ### 5.故事是你的自我形象。


    大家都学会用故事来做自我介绍了，这种方式可以用在很多地方。


    - 面试时讲一个故事，让大家马上记住你；

    - 发微信讲一个故事，让大家马上记得你；

    - 沟通的时候讲一个故事，让大家更加理解你。


    故事是自我形象的一部分。


    ### 6.创造“两难”和“悬念”是故事的主要动力。


    你希望自己好看，可以搭配服装，可以化妆。


    故事最好的妆容，就是两难和悬念。让主角一次次地陷入两难。我之前讲了一个公主和老虎的故事，里面是不是充满了悬念？


    悬念让你忍不住往下读，是阅读的重要动力——如果没有好的结局，大家会骂死你的。 “一千零一夜”就是这样的典型例子。


    怎么增加悬念呢？三大矛盾——人与人的矛盾、人与自然的矛盾、人与自我的矛盾。让故事深陷这些交织的矛盾中。


    ### 7.记住，你的人生也是一个故事。


    总有一天，你的生命会像电影一样一闪而过——你有过哪些梦想、面对过什么挑战、做了哪些努力、尝试到什么挫败、遇到哪些奇迹、有了什么转折、收获过什么礼物？


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_5.png)


    每个人都会暂时放下自我，进入到故事里，体验故事里的情节，然后带走一些感悟和启发重新回到生活。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_6.png)


    ### 最后，推荐6本故事书，这些故事真的被大大低估了。


    1. 《小说课》作者：许岩哲 最简单有趣的讲故事书

    2. 《千面英雄》作者：坎贝尔 世界上的神话都是一个故事

    3. 《救猫咪》作者：[美]布莱克·斯奈德——全世界编剧入门书。

    4. 《故事》作者：[美]罗伯特·麦基——电影里如何讲故事。

    5. 《故事营销》作者：李光斗——用讲故事来营销。

    6. 《故事的疗愈力量》作者：周志建——用故事来疗愈的心理咨询师。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_7.png)


    ### PS：


    在周一的留言里，我们看到很多超级个体原创或推荐的好故事。


    明天许岩哲老师也会分享一个最让他感动的故事。让最会讲故事的人，都感动的故事会是什么样？明天告诉你。


    今天是古典陪伴你成长的第 197 天，一起加速，成长为更好的自己。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_118_8.png)


    ## 「超级个体」对话「最会讲故事的人」28-6


    ## 古典


    这周的成长导师，我为大家请来了“台湾最会讲故事”的许荣哲老师。其实我一直都很好奇，最会讲故事的人心中最爱的故事，究竟会是什么样。


    所以就去问了许老师，并代表超级个体问了他三个问题。他最爱的故事，以及对三个问题的解答，我自己很喜欢，推荐给你们。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_119_0.png)


    ## 许荣哲：关于签名书——我最爱的故事


    ![](img/25e88d373f85ee6d39d9f51899b4f484_119_1.png)


    我喜欢认真工作的人，尤其是那种带着“层次感”的认真工作。


    > 怪物史瑞克说：“泽葛是有层次的，妖怪也是。”


    我认识一个有“层次”的业务，他的 work 是天天载着不同的作家到各个学校演讲。大部分的业务是使命必达的“宅急便”（快递公司）司机，作家是不需冷藏的生鲜肉类。


    但也有小部分的业务是刚入行的小伙子，他们还没学会喜欢自己的工作，于是开口的第一句话便是：“当作家赚钱多吗？”积极一点的，还会追问我知不知道哪一行比较好看。


    心情好的时候，我会跟他开玩笑，当死人最好赚，我有个朋友在殡仪馆演死人，月入数十万。随后一路undige，他一直吵着要我的“死人”朋友名片。


    “好歹我也载过你一程，你就送我一程会死哦。”业务边开车边缠着我。


    所以很多时候，我与业务之间的关系就是没有关系，像我和林志玲一样。但有一回，我却被这个业务弄哭了。


    业务大哥是个单亲父亲，女儿整天托人照顾，虽然他天天载人，但却很少载女儿出门。


    那一阵子，我正在跑校园宣传新书，业务大哥特地掏钱买了几本我的书。


    “帮忙签个名！送我女儿的。”业务大哥请我在书上签名，并写上她女儿的名字。


    “你女儿几岁？”我本能地问。 “三岁。” “等等，三岁，还是十三岁？” “三岁。” “不会吧，这本书至少要国中以上才看得懂。”


    “是这样的，我正在进行一个秘密计划。我要收集所有我载过的作家的签名书，等我女儿上了国中之后，再把全部的签名书送给她，当作她的成年礼。”


    一个单亲父亲对女儿的用心瞬间让我红了眼眶。不止如此。


    ## 超级个体对话许荣哲：


    许老师，你为什么会喜欢这个故事？ 毕加索曾经说过这么一段话：“我的母亲告诉我：‘如果你去当兵，你会成为将军；如果你去当神父，你会成为教皇。’但我去画画，于是我成了毕加索。”


    ### —— 每日践行 ——


    正如许荣哲老师所说，只要顺着我们的内心去感受这个世界，其实每天都在发生打动我们的故事。


    动我们的故事。在我看着两个女儿一点点长大时，我也在记录了她们成长中的很多动人时刻。


    相信你身边肯定也有令你感动的人——陪你长大的父母、为你付出的伴侣、听你倒苦水的朋友、跑上10楼送外卖的小哥……


    从今天开始，我们一起去观察，去感受，去记录你身边的故事，让自己的生命值得一看。


    你身边有没有这样的瞬间？也欢迎分享给我们。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_120_0.png)


    今天是古典陪伴你成长的第 198 天，一起加速，成长为更好的自己。


