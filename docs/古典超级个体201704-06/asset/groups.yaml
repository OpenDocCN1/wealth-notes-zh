    ## 清单 | 每个来烦你的情绪，都意味着一次自我升级的机会 34-5


    34-5 清单 | 每个来烦你的...


    - 1. 情商（EQ）这个概念由美国心理学家丹尼尔·戈尔曼提出的，分为自我意识、自我管理、社会意识和人际关系管理四个部分。其实也提出了情商的发展逻辑——先对自己情绪有所察觉，然后才是有意识地管理；了解自己才会了解他人和社会，最后才是管理他人情绪。

    - 2. EQ的最高境界，是“内通外顺”。大部分人都是先关注外顺，结果内在就很燃烧——变成个讨好型人格。

    - 3. 情绪是一种保护自己的进化机制。情绪也是情感的另外一面，没有情绪，我们也就没有情感了。

    - 4. 情绪是一种能量，在没有得到回应之前，它会一直存在，这就是内耗的来源。就像个老朋友一样，情绪会一直和你叩叩，一直到你识别和回应它，情绪才会转为正面情感，推动你。

    - 5. 成熟的人懂得识别情绪的语言，然后回应情绪。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_179_0.png)


    - 6. 情绪爆炸是社交炸弹——常见的情绪爆发方式有三种：战斗（会恶化状况）；逃避（会憋出内伤）；发泄或回到痛苦情景（处理不好会受到二次伤害）。

    - 7. 情绪防卫术有三招：倒着或者跳着数数、自由书写、情绪零食。当然，最好的方式是不让自己进入情绪爆发状态。

    - 8. 长期保持好情绪，需要知道一个著名的情绪ABC理论——触发事件-信念-情绪结果。如果不能改变外界世界，至少可以调整自己的信念。

    - 9. 我们常常以为事件引发了情绪，其实是你内心的看法引发了情绪。改变信念，就改变了感受；改变感受，也就改变了内心世界。从这个角度来说，我们是活在自己的信念构成的世界里。这是幸福快乐的终极之道。

    - 10. 学会和情绪相处，读懂情绪，让情绪穿过你，而不是让情绪绕过你。不断做内心信念和真实世界的“自我检验”是一条自我迭代之路。这也就是说为什么说“烦恼即菩提”。


    最后，帮你复习下我们讲过情绪相关的内容。


    零秒思考：快速梳理，让情绪可视化（专栏文章：29-2）

    一个让你快速梳理自己情绪和思路的方法。


    ETA：脱困四问，能帮你一步步解决情绪问题（专栏文章：29-4）

    觉察情绪——处理情绪——下一步行动。


    情绪精力：管理情绪，提高精力（专栏文章：8-2、8-3）

    “精力金字塔”中，精力分为四个部分：体能、情感（情绪）、思维、意志，底层精力会影响上层的精力，如果情绪不佳，做判断也容易失误。所以管理好情绪，就是在管理好你的精力。


