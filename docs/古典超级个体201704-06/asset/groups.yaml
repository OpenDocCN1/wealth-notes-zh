    # 李欣频：你能不能拿出一个对得起此生的作品？31-6


    ![](img/25e88d373f85ee6d39d9f51899b4f484_152_0.png)


    古典


    这周的成长导师，我们邀请了彼岸界誉为“创意文案天后”的李欣频老师。大家也许知道台湾著名的诚品书店，欣频老师就是它的御用文案。


    至今她已经出了文案、个人成长的畅销书20多本。除此之外，她还有很多有趣的身份：旅行家、专栏作者、北大博士、讲师，像是一个闪闪发光的多面体——这样有趣的一个人，她的观点是：“我从来不运营个人品牌”。


    我和李欣频老师聊得很开心，也替大家问了很多有趣的问题。希望你能够像我一样，体会到她对于品牌、对于自我的全新洞见。


    全部对话整理成了2万多字，篇幅有限，我精选了其中的一部分：


    ![](img/25e88d373f85ee6d39d9f51899b4f484_152_1.png)


    ![](img/25e88d373f85ee6d39d9f51899b4f484_152_2.png)


    古典


    欣频老师，你自己的个人品牌相当成功，但很多同学托我提给你这个问题——我就是一个普普通通的人，如果想创造自己的一些影响力，第一步该从什么地方开始呢？


    “我就是一个普普通通的人”——这句话需要改一下设定，因为如果你以为自己只是普通的人，那他就不能做好自己喜欢的事情，或是找到自己独特的地方，很多东西是和你如何设定自己有关。


    最近台湾正在播《世纪天才·爱因斯坦》的影像，从影片里可以看到爱因斯坦遇到很多很多人遇到的挫折，比如人家不接受他的论文，或者觉得他没有价值。


    可是爱因斯坦看待的方式不一样，他不会把它当挫折，而是当做自己做的事情对方没看懂或者没看到，所以他会不断地继续发表持续性的论文。他的目的就是让他们看得到自己发现的正确的事情，他从头到尾没有怀疑过自己，更没有停止。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_152_3.png)


    古典


    那是说爱因斯坦最开始就设定“我就是个天才，我要让世界看到自己”吗？


    他从来不认为自己是天才，他只是觉得自己发现了一个特别的东西，希望更多人看到它。如果一开始就假定自己是天才，那么他在做事的时候，就会花费很多时间证明自己。


    因为当我们专注做一件事情时，你完全不会设定你是普通人还是天才。当你认真做一件事，这件事就是和你一起的。你不会在乎别人评价，因为你做事情本身的过程，就是回报。就像一朵花开的时候，它不在乎别人认为它是美还是丑，是玫瑰还是牡丹。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_152_4.png)


    古典


    就像一朵花怒放的样子？


    怒放也是人类自己的评价——“怒”是一种人类的情感，鲜花就自己舒展开来，不慢也不快。当你这样做事情的时候，事情本身可以代表我们的个人品牌，带着你自己的信息。这样的品牌你不需要去经营，就像梵高的《向日葵》，就算画上没有他的签名，也能代表他。当你能发出这样的光亮，人们会透过这些事情来找到你。


    最近我在看一些欧洲雕刻，即使上面没有雕刻人姓名，我也能想象出这个雕刻人的状态和它呈现的美感，以及完美的执行力。因为所有生命力都在这个雕刻里。


    我觉得完全不用去经营个人品牌，大家很多时候把重点搞错了，花在让多少人认识，了解自己上，花在穿什么衣服上。网络的确给了我们更多的舞台，但你在舞台上能拿出什么东西，才是重点的重心。就像过一个桥，重点是要去对岸，而不在桥上。如果只关注桥，怎么也到达不了那个地方。


    所以个人品牌的重点在于，你能不能拿出一个此生都觉得对得起自己的东西。'
