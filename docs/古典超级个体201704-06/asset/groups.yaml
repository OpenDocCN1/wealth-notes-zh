    # 为什么你应该马上开始写作？ 26-1


    26-1 为什么你应该马上开始写...


    在这个时代，很多人都在谈写作的重要性：有人说写作会成为未来不可少的一个交流和思考工具，有人说记录是一种态度，有人通过写作赚到了不少钱，圈了不少粉，于是大家一窝蜂跑去写作。但成长、交流、赚钱的方式也还有其他很多很多种。


    写作到底有什么好处？我们今天来谈一谈。


    ## 1.自我表达


    写作的第一个好处，正如《动物农庄》的作者乔治·奥威尔所说的四种动机的第一种——“自我表现的欲望”，其实就是强烈的自我表达的欲望。他甚至强调说，“一个严肃作家整来说也许比新闻记者更加有虚荣心和自我意识”，不强调这个强烈动机完全是自欺欺人。


    听上去很虚，其实很真实，因为人的自我存在感，是需要被验证，需要被看见的。


    建构主义心理学认为——当一个人把自己的内在写出来的时候，那么，他就在这个世界上——正是因为有了倾述这个动作，倾述者本人才确认了自己存在——正在自己的故事和文字里，你找到了自己。


    所以写作的第一个目标，其实不是为别人，而是为自己写。


    我一个朋友也跟我聊，觉得大学四年做了好多好多事，但在接下来的十二三年里，好象想不起来些什么。


    你是不是有这种感觉？


    这可能有两个原因：


    + 第一，人祥在那个时间段的经历是丰富的，他的人生标志性事件很多，而接下来的十多年，他做的事情大多重复；

    第二，跟大家每次聚会聊天有关系，这些故事一次一次地重复，一次一次地被强化，那些生命的阶段就被刻下印记，你一次次重回那些时刻，你的青春就以某种方式存在了段子里。


    我喜欢米兰昆德拉的一个洞见：人并不是突然死去的，而是慢慢死去的，因为我们活在自己的记忆中，而当这些记忆一点点消失，我们就在一点点死亡。但记忆是不可靠的，如果你不记录你的生活，你就在一点点死去。


    听过我第三届《做自己》论坛的人，都知道我有一个人生设计——希望让妈妈开始写自己的故事。在前段时间，妈妈真的交给我们关于一本回忆我的书。在座各位，你们都不可能记得你三岁之前的任何事情，如果真的有记忆，那也是你自己编的。


    你真的是那个小时候天天蹬被子的小男孩吗？你童年真的那么喜欢吃手指吗？你真的是因为电视台推迟播出《西游记》就哭了一下午吗？其实谁也不知道，这一切都存在了妈妈的记忆里，有一天，她又决定用文字的方式表达出来，你就会遇到你整个幼年时期。你的生命就向前延伸了3年，这就是写作的神奇力量。


    我建议每个人看完文章，也都留言。不是为我，也不是为上墙，而是为你自己，在“得到”App里，看到自己的足迹。


    纯然的自我表达，这就是写作的第一个意义。


    ## 2.升级思维的方式


    人类的语言很有趣，写作是把网状的思考，用树状的结构，用线性的方式表达出来。


    人类的语言是线性的，语言讲完就消散，所以你只需要在5秒钟内逻辑自洽。但写作不是，你这一行字可能跟前面五六行字就有逻辑上的冲突，你这一段内容可能就跟前面一段有重复。如果说语言是一维的，那么文字就是二维的。在文字上你有机会以一种二维的方式去观察你的思想，从而获得你思想的一个升级。


    这种升级，就好像我们（三维的人）在观察一个爬在苹果上绕圈的甲虫一样——甲虫觉得完全想不通的事情，在我们眼里觉得一目了然。


    为什么有人说，人人思想有深度了？那所谓的深度，就是当你在线性前进的时候，别人已经在树状文字思考了。


    ## 3.传播个人影响力的最好方式


    先看一幅图。


    横轴是时间轴，纵轴是信息达到的人数。


    + A是世界人口的增量，本质来说，是基因生物传播的速度。

    B是识字人数，是文字传播的速度。

    C是书籍传播的速度。

    D是电视机和收音机传播的速度。

    E是电话、电脑、互联网传播的速度。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_43_0.png)


    可以清晰地看到，如果说过去文字传播的速度是平缓的手动扶梯的话，互联网传播的速度简直就


    ![](img/25e88d373f85ee6d39d9f51899b4f484_44_0.png)


    可以清晰地看到，如果说过去文字传播的速度是平缓的手动扶梯的话，互联网传播的速度简直就是火箭般的直梯式——互联网只用了10多年，就覆盖了过去用4000年达到的覆盖面。而互联网上传播最快的，就是观点和文字——不是视频、不是声音，写作是最好的方式。


    写作是你的影响力传播最快的方式。


    写作也是最能放大影响力的——打一个比喻，《拆掉思维里的墙》近13万字，已经有300万销量，阅读完大概需要3-4小时。如果通过一场3小时的千人线下讲座的话，覆盖这么多人需要3000场，每年300场也需要10年。而我创作这本书大概只用了1个月的时间。写作也是影响力放大效应百倍的方式。


    我并不是第一个理解这个现象的人——这个世界上也许有很多很多比耶稣、佛陀、孔子伟大一百倍的演说家，但是只有他们三个收了会写字的弟子，各自写下了《圣经》、“如是我闻”开头的佛经、子曰的《论语》，他们的故事得以流传下来，让我们彼此隔着2000年相识。这都是写作的威力。


    ## 三种不同功能的写作


    不同的写作动机，也形成了三种不同的写作方式。


    第一种，为自我表达而写作的人，他们写出来的东西更加像是日记、散文，感悟，文体以写爽为目标，为了纯然的自我表达，也称之为“罗曼蒂克式的写作”。心理学大量利用这个种方式促成自我对话，比如说叙事里的“自由书写”，生涯里的“成就事件”。


    第二种，记录的写作，比如会议记录、工作流程和文档、信息笔记。叫做文格式的写作。每天的邮件、大量的公文、甚至微信聊天，都是这个类型的写作。这种写作方式目的是“忠实的、结构化地反映事实”。


    第三种，影响和传播的写作，是一种观点和事实表达型的写作——有一个很好的观点，很好的思想，引导别人去观看你看的世界，这种写作也被称为“经典的写作”方式。进一步细分，又可以分成“虚构类的”和“非虚构类的”。比如《哈利波特》明显是虚构类的，而《自控力》就是非虚构类的，大部分的观点文、社评也是非虚构类的。


    ## 初学写作之路


    区分三种写作的目的，也就绕开了初学写作最大的误区——用错文体。


    我有一个朋友，文笔和内容都极好，但是就是不增粉，邀请去看。发现他还在用“自我表达”的方式写“传递观点”的文章，这种写QQ空间的方式——个人感悟、情感、生活随想在我看来是邀请人家进你卧室——熟悉的人会进来，朋友会站在门口看看，而对陌生人却价值不大——这么忙的时代，谁还会通过慢慢了解一个人去了解自己要知道的一件事情呢？有什么观点，快摆放在橱窗吧。


    另一些人则用记录体的方式在写，三月干了什么事，看了哪些书单和电影……这适合来自我查阅，却很少被点击（重复原文的留言，我很少精选。）当然，反过来也是有问题的——让你写个会议记录，你夹带私活，饱含个人感悟和观点，就是说不明白事。总之，写作先想好功能，什么功能选什么方式。


    还有一群人则容易跳步，一上来就要“影响式的写作”——注册一个号，先坚持写100天——其实影响式的写作最考的是观点和见识，文采倒是其次——如果说影响力能通过写作传播，而浅薄传播得更快。


    所以，新手最好的进阶之路是：尽快开始记录自己的生活，提高自我观察和表达能力；在工作中大量使用记录和文档型写作，提高自己的思维深度。前两项动作，是思想储产婆，有一天你真的有思想不吐不快，很自然会开始影响式的写作。


