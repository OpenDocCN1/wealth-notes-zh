    几个月前我做了一个极为清晰的梦 (我通常是不记得自己的梦的)， 我梦见自己死后去了天堂。我往四周看了看，明白自己在那里了——绿色的田野，羊毛般的云彩，芬芳的空气，远远传来的令人迷醉的天乐。
    记录天使 (recording angel) 带着灿烂的笑容和我打招呼。 我惊讶地问道：“这里是天堂吗？” 记录天使回答说：“是的。” 我说 (醒来后回想时，我为自己的诚实而自豪):
    “那肯定搞错了，我不属于这里，我是无神论者。” “没有搞错，”记录天使回答说。 “但作为一个无神论者，我怎么可能符合资格？” 记录天使严肃地说：“是我们决定谁有资格，而不是你。”
    “明白了，”我说道。我向周围看了看，又想了片刻，然后问记录天使：“这里有打字机可以让我用吗？” 对我来说这个梦的意义是很明显的。我心目中的天堂是写作，我已经在天堂里生活了半个多世纪，而且我自始至终都知道这一点。


    阿西莫夫的梦想就是写作，他这一辈子写了480多本书，“一直梦想着自己能在工作中死去，脸埋在键盘上，鼻子夹在打字键中”。


