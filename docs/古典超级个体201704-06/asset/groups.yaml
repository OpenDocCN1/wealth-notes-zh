    # 精华 | 演讲九式—带你从入门到精通 27-5


    27-5 精华 | 演讲九式一带你从...


    # 1.演讲： 一门越来越重要的手艺


    演讲曾经是古代最重要的一种政治文化技能。随着带宽越来越高，语言这个古老的手艺，变得越来越重要。


    生活无处不演讲——正式的“演讲”虽然不是每个人每天都会遇到，但这种“演讲”技能可以应用到生活、工作 the 方方面面——凡是一对多的简单表达，本质上都是演讲。


    # 2.演讲：会“演”才会讲


    演讲更多是一种表达的艺术——“演”是重要的技能。


    演讲和书写最大的区别就是缺乏“进度条”，要把逻辑层次控制在一层、要加入更多指示词、也要给更多的讲解和更短的篇幅。


    没有一个演讲是因为太短而被吐槽的——而因为太长被吐槽的时常有！


    # 3.演讲的结构：坡道—观点—甜点


    好的演讲像一场去新奇世界的旅行，而你是导游。设计坡道-观点-甜点。


    通过一个坡道让大家进入状态，与大家建立关系。好的坡道需要回答两个问题——“要讲啥？和我有什么关系？”、“为什么是你讲？”。


    围绕一个强有力的观点来组织材料——可以有三个分论点，但只能有一个观点。


    甜点：不要再增加信息量，留下一个甜蜜的获得感或者启发。


    # 演讲的结构


    ![](img/25e88d373f85ee6d39d9f51899b4f484_97_0.png)


    开始用7秒内上坡道；内容设计要给主题提炼中心句，增加故事、论据和亮点；结尾处要给用户一个心理奖励。


    # 4.演讲的血肉：用五大元素填充演讲框架


    主题：名言金句，是被压缩过的信息量。放在观点最后，往往有一种一锤定音的感觉。


    案例：经典的案例，也可以是自己的经历。


    数据：可靠、有说服力的数据，可视化更好。


    比方：用熟悉的事物让你理解陌生模型。


    幽默：它是演讲的气口，能让大家的大脑迅速放松，吸氧。


    # 5.演讲的温度：调和理智与感性


    找到他们不能理解的部分，加“水”、打比方、幽默、总结名言金句。


    找到他们不确定的地方，加“干货”，增加数据、案例等。


    最后问他们，如果明天别人问你，这个演讲说什么，你会怎么转述？然后打磨主题句。


    # 演讲5大元素


    ![](img/25e88d373f85ee6d39d9f51899b4f484_97_1.png)


    一个演讲工匠，只有掌握了这五大元素，才能击中听者的内心，才能把一个道理讲得生动有趣。


    # 6.峰终定律


    一件事情的顶峰体验和的终点体验决定我们对一个事物的整体评价。


    演讲也是如此，创造高潮和创造好结尾很重要。


    # 7.演讲的包装：设计好的开头和结尾


    # 开头三板斧


    +   哇一下：带个惊喜。'
