    ## 自我管理第一原理：做更少却更好的事 25-1


    25-1 自我管理第一原理：...


    今天是第一天，我们先来说谈看自我管理和高效能的这个话题。


    为什么我们的效能不高？原因不是做事少了，而是太多了。大家都是24小时，怕的真的是优秀的人比你还努力，因为努力这个事情个体差异不会超过50%。但是人 happens
    之间价值差异会百倍，因为怕的是优秀的人做的事情比你高价值很多。


    互联网时代特征：永远在线、随时干扰、信息过多、思考过浅，但资源却变得更集中。


    ### 1.自我管理的第一要务是少做事，放弃目标


    【回顾内容：第五周1-2-3】


    所有权益症让我们关注存量，看不到增量。


    断舍离：断绝购买、舍弃不重要的、远离对物品的欲望


    用两个指标衡量：a.重要、合适吗？b.当下有帮助吗？然后践行，从纠结痛苦或者爽快中，体验这两个答案。


    断舍弃不重要的公众号、书、朋友圈。


    ### 2.三件事


    最简单的方法就是每天早起写最重要的三件事，然后晚上复盘。("三件事"工具，公众号：橙子成长联盟)


    三件事做好就很不容易因为是三个结果。结果就是思考事情最终具象化的客户价值。(上班、客户、开会、聊天、三级秘书)


    结果有三律：显性的、可交付的、能复制的。(内容产品的核心)


    做 LESS BUT BETTER 的事。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_17_0.png)


    ### 3.WOOP心理比对和“如果……那么”


    【回顾内容：第六周1-2-3】


    心理比对就是在大脑预演最好、最坏情景，然后判断。避免过度乐观的坏处，三分钟热度的坏处。


    执行意图就是“如果……那么”，本能反应——提前思考。(菲利普斯，如果回到家，我就……)


    ![](img/25e88d373f85ee6d39d9f51899b4f484_17_1.png)


    ### 4.碎片化时代的时间管理


    【回顾内容：第七周1-2-3】


    目标正确、结果清晰、策略可行。


    碎片化时间利用——加减乘除。


    念头收纳、三秒禅、番茄钟。


    最好地超越碎片，尽快提高职业的自由度，降低打扰。


    ### 5.精力管理


    【回顾内容：第八周1-2-3】


    互联网时代的工作，还需要思维、情绪、意识参与。


    提高精力——钟摆型、直线型；主动休息、仪式感、节奏感(每天、每周、每月)。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_17_2.png)


    ### 6.自我管理的多层论


    【回顾内容：第九周1-2-3】


    自我管理的金字塔——一个方法没法撼动整个自我。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_17_3.png)


    互联网时代自我管理的第一原理就是：


    少做事，做那些更少而更好的事，花很多时间筛选、思考、策划，然后集中时间、精力高效率的做好事情。宁愿不动，也不要蠢动，绝不捡钢镚儿。


