    # 玩：一种以赢为目标的高手心态 32-3


    1. 工作太繁忙，没心思去玩，怎么办？

    2. 怎么玩，才能玩得有价值？


    32-3 玩：一种以赢为目标...


    现代人常常处于焦虑状态中——上班焦虑，下班去玩也焦虑。


    所以难怪一谈到“游戏化”，很多人都拒绝——事情都做不完，搞什么游戏。或者如果你劝一个人“放松点”他会没由来地生气——我怎么放松？你是不知道我现在压力有多大，事情根本做不完。


    其实游戏和享乐是完全相同的，因为游戏有两种—— Play for win 和 Play for fun。享乐是以快乐为唯一目的，沉溺其中的确志丧。但高级的玩耍是一种以从容的态度更加高效的状态——我们说的玩家心态，显然是
    Play for win（玩世不恭，则说的是 Play for fun）我们称为 Playful 玩家心态——以Playful的心态进入，全力以赴的状态。


    为什么“玩”是一种面对压力和不确定性的最好的高手心态呢？


    ## 1. 玩着放松，但不放下期待


    放松，并不代表着放下期待。玩的状态反而会进一步提高表现。


    ## 2. 玩着面对失败


    ## 3. 把“有限游戏”玩成“无限游戏”


    ## ——今日得到——


    - 1. 游戏有两种—— Play for win 和 Play for fun，我们说的玩家心态，是 Play for win。

    - 2. 工作是一种“有限游戏”，而“事业”“家庭”则是无限游戏。

    - 3. 高手们面对焦虑和不确定性的最高境界，就是“在热爱的领域努力地玩”。


