    # Bruce


    文章是用编写的方式完成写作的，而不是突发灵感，一气呵成。


    一般来说，在我们的观念中，好的文章出现是这样一副场景。一名优秀的作家，在一个偶然的时机下受到启发，突发灵感，一瞬间，才思泉涌。他回到自己的书房，伴着灯光，洋洋洒洒数千甚至数万字的皇皇巨著一夜完成。但事实上，好的文章是先列出大纲和问题，然后寻资料，把所有的素材堆在一个文档里面，最后一个个问题和板块拼起来，是用编的方式在写作，是通过一个一个步骤完成的。写作的价值不言而喻。文章并不是憨出来的，而是根据积累的内容编写出来的。不要想象写作是一件高大上的事，其实这就是对我们生活学习的点滴记录。不要认为好文章是灵感的产物，积累和套路才是。


    因此，对待写作，不要认为我有灵感才开始写。而是要注重平时的积累。你积累的内容加上写作的套路共同促成好文章的生产。写作，要注意的是平时的积累。写作，不要想着灵感实现，一步登天，而要一步一步从眼下做起。


