    # 用视觉化笔记，成为记忆高手 29-1


    29-1 用视觉化笔记，成为...


    +   1. 会议记录、读书笔记写了一堆，但是感觉什么都没记住。

    2. 想为别人转述一本书的内容，却不知道从何说起。


    # ——一个问题——


    你是不是也遇到过这样的问题：


    开会、听课、听报告，听的时候灵感不断，处处有启发——笔记记了满满一页，结果别人问你听了什么，一句话都想不起来。


    两个领域的人坐在一起讲话——即使说的是同一句话，但常常是相互听不懂对方在说啥。有人喜欢从背景、起源开始讲，有人则需要听，你的重点是什么，观点是什么？两个人常常鸡同鸭讲。


    今天我们面对的信息都太多了——有没有一种通用语言，能够抓住事情的本质，并且可以很容易表达出去？向客户、团队和商业伙伴清楚地表达自己的观点？


    # ——一个概念——


    # 什么是视觉化思维？


    视觉化思维（Visual thinking），就是把思维用视觉的形式展现出来。视觉化思维的重点是思维，不是学画画、学艺术。


    牛人都是视觉化思维的高手。


    比如说，某手机公司出了一款目前市场上屏幕最大的手机。它的推荐语是——“屏幕有6.44英寸，比iPhone 6 Plus还要大……”说的是很清楚吧，每一个数字我都知道，就可是没概念，因为我没用过iPhone
    6 Plus，你说比它大，我也不知道到底有多大。


    对比一下，乔布斯在介绍iPod的时候是这么说的：“你们知道牛仔裤小口袋用来干嘛的？”然后从口袋里掏出了iPod。


    在发布MacBook air的时候他说：“它是如此的轻薄，可以装进办公室里每天用的信封口袋里”。然后从最常用的商务的文件夹里拿出一台MacBook air演示给大家看。大家就秒懂了。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_122_0.png)


    视觉比数字更加直观。


    # 为什么视觉化如此神奇？


    视觉神经科学领域的研究成果显示，人脑活动总量的近2/3都用于支持视觉功能。大约1/3的脑部神经元专门处理视觉信息，还有1/3的神经元同时处理视觉和其他感官信息，最后1/3的神经元处理剩下的各类信息。


    所以当你给人说概念、理念的时候，如果没能启动对方的视觉——你就只打动了这个人的三分之一。


    眼睛是一种思考器官。


