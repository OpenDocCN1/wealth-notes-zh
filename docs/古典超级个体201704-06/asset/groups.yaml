    # 4个游戏策略，专治工作没热情 32-2


    - 1. 如何让重复度高、枯燥乏味的工作变得有趣？

    - 2. 对待工作总是三分种热度，没有长性怎么办？


    32-2 4个游戏策略，专治...


    需要回复的邮件、需要快速出活的文档、需要反复修改的设计……每个人都有大量的重复、无趣还不得不做的工作。有没有可能把无聊和繁重的工作变得像游戏一样有趣？


    自古以来，人们就在用游戏化的方式在让繁重的劳动变得有趣——比如劳动号子。

    下面是一段在非洲加纳大学帅局收录的一段儿葩邮戳之歌，两个非洲兄弟分站在一个台子的两端，每个人手里拿着一个盖戳机，一个印泥盒子和一叠信件。吹着口哨，敲打出这个声音。这种夸张游戏，让这些重复工作组合变得有趣。


    # 游戏化生活的4个核心原则；


    《游戏改变世界》的作者未来学家泰格·尼尔格尔，他提出了游戏的4个核心：目标、规则、反馈、自愿。一个任务只要赋予了这4个要素，就会变成一种有趣的游戏体验。


    # 1. 澄清目标


    游戏的一个很重要的体验就是它通过无数的小任务与指示，让你永远清晰地知道下一步的目标。这是一个非常符合人类大脑认知习惯的设计，人的大脑是一个单线程的任务系统，没有办法同时处理多项的任务，在游戏中你要么在做任务a，要么在做任务b；目的也许是消除，也许也是高分；而越是魔性的游戏，目标越简单——比如说逃离神庙的“不要死”，天天爱消除就是“消除”。


    一个清晰的目标，让任务变得更加有趣。


    大家都看过《摔跤吧！爸爸》，其中饰演父亲的阿米尔·汗，他为了这部电影先是疯狂增重56斤拍老年版，又减重50斤演29岁的戏。这在电影界并不少见，最早的减肥先例是罗伯特·德尼罗，他在《愤怒的公牛》里为了扮演中年的拳击手，他增重了60磅（27.2公斤）。关于秘诀，他说过一句很经典的话，“为一个角色而减重是很简单的事。”


    普通人减肥也许会坚持几天，过几天又会对自己说：“还是工作更重要，今天太累了，休息会吧！” 或者 “其实也没必要这么瘦，不健康。”


    演员不一样，他们知道这个是清晰的目标，角色就是要这个体重，而且他们知道，如果愿意结束，以后还可以回到自己的生活。他们反而就更有效率——为了一个角色的核心目标。


    很多人的生活游戏念头太多，各角色交织在一起，所以他们永远效率不高，玩得不尽兴。


    # 2. 设定限制


    任何一款游戏，都有清晰的规则和“有趣的限制”。不仅赢，而且要遵守规则赢，游戏才好玩。比如“杀人游戏”的重要规则就是要“天黑请闭眼”，如果一个人不遵守这个规定，别说别人讨厌他，他自己也挺无趣的吧。


    物理学家霍金在写他的著作《时间简史》的时候被告知“因为是面对非专业读者，所以不要使用科学术语”，霍金于是给自己设定——“一本书里多一个数学公式，就 会减少一半的读者”。最后这本书只出现了一个公式就是E=mC²。


    有趣的限制正是创意之源——音乐家只有7个音符，却要创作出完全不同的音乐；英文作家只有26个字母，却要写出千变万化的故事。正是因有限制，所以才有创意，工作才变得好玩。


    提高限制会增加趣味性，比如缩短时间——过去2小时完成 的，有没有办法90分钟搞定？改变方式：过去用键盘写作，现在能否用语音+文字转换软件的方式来写作？增加规则：如果
    你比较容易以自我为中心，能不能试着看一整天不说“我”的游戏？


    # 3. 即时奖励


    很多人沉迷在游戏中的原因，是因为游戏有清晰的即时反馈。在游戏中，你每打一只怪，都会非常明确地获得100点的经验值，绝不落空——人类热爱即时反馈——很多App按照这个来设计，比如说朋友圈照片马上拍马上发，瞬间就有人点赞，感觉太好了。


    而真实的生活常常不是这样，当你开始一个任务的时候，往往不知道自己会收获什么，做得好也许需要月底绩效约谈，或者很久以后才知道。好的管理者懂得给予及时反馈，得到团队有著名的“节操币”奖励机制，同时间可以随时随地奖励那些表现好的人。就像好老师则懂得给孩子胸口及时贴一朵“小红花”。


    如果你没有这些环境设计，你需要给自己设计一个清晰可控的经验值“进度条”，用自己的明确性，抵御外界的不确定性。我的好朋友艾力也玩过这种“34枚时间金币法”，他把每半个小时作为一个时间金币，一旦觉得自己没有浪费，就给自己增加一个金币，看看一天能有多少财富。


    # 4. 自愿


    没有人会逼着我们玩游戏，你想退出，随时都可以。游戏的目标、规则和反馈系统，都建立在玩家是自愿玩游戏的基础上，这样才能保证玩家高度投入和退出自由。


    但是工作进度压身，不得不战，这就并非自愿而且没有退出。所以留出空间和余量很重要——焦虑之下很难游戏。


    如果今天起床，实在不想开始一个痛苦的工作，不妨开始游戏化你的工作——细化目标、提高奖励、设定规则——直到你愿意玩儿为止——而不是各种拖延，逼自己最后 一瞬间完成任务。


    # —— 今日得到 ——


    - 1. 游戏化是提高效率，增加乐趣的好方式。

    - 2. 目标、规则、反馈、自愿，掌握这四个原则的人可以把工作、生活游戏化。在热爱的领域努力地玩。


