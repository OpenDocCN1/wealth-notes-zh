    ## 古典


    超级个体的小伙伴们。我想给专栏做一次升级。


    过去很长一段时间，都在做生涯相关的咨询和顾问。我很热爱“生涯”这个领域——帮助人们对内挖掘潜能，对外发现可能，插件更加成功和成就感。但是由于时间实在太忙，很少面对社会咨询了。


    上周的“人生选择题”专题收到了意想不到的大家的关注——这让我想，为什么不尝试把这个专题变成一个固定的每周栏目，然后用文字的方式传播出去？这样即可每周通过解决一个人的问题，同时也让更多有类似困惑的人脱困，正是我生涯之道。


    看过《解忧杂货铺》这本小说吗？咱们“超级个体”也开一个。把你的困惑交给我，我每周给你一个关于生涯问题的专业解答。


    我在苹果公司的呼叫中心做2C的电话导购，不需要自己挖掘客户，我们是负责客户主动呼入的业务，所有资源都是公司的，没法积累自己的客户资源和行业资源，一直觉得毕业后的职业选择有所失误，虽然大公司里待遇很好，可是工作内容的可替代性太大了，所积累的能力和经验似乎对创业没啥帮助，内心一直想做个创业者，有过一次创业失败的经验，所以现在更倾向于选择创业型的公司，现在犹豫要不要离开大公司选择创业型的公司？


    ## 古典


    亲爱的做电话导购的Kevin：


    我答应我老婆生日送她最新的苹果手机——搞不好会在电话里碰到你。在这个之前，让我给你一些建议。


    你遇到的“稳定大公司还是创业小公司”的选择题。很多人都有和你一样的困惑——在成熟公司觉得无聊，在创业企业又担心没前途。


    从公司谈公司你已经听的太多，我转换一个视角——从进化论的角度谈谈成熟的大公司和创业型的小企业的区别。这其实是两种生物——复杂生物（大企业）和微生物（小企业），他们有完全不同的进化策略。


    《消失的微生物》一书中，生物学家马丁提出一个问题：如果把整个生物界的所有动植物的进化树都放在一个表盘上，基因越接近的生物越靠近，假设人类在8点钟方向，那么玉米在什么位置？


    答案是八点零一分。为什么两种差异这么大的生物，会这么靠近？因为表盘的其他地方，主要都是形形色色的微生物。这些微生物数量之大，种类之多，远远超乎你的想象。


    生物有类似人类这种几亿个细胞聚在一起，整体变成了一个大组织，互相协作的方式。也有几十亿个单细胞独立的生活着的方式。生物既可能像一个中国这种十多亿人的国家一样井然有序，也可能像古希腊的小城邦一样，各自独立。


    这两种进化策略同样有竞争力，但是完全不同。


    大公司就类似大国或者人体这样的组织，每个细胞都井然有序，但是不能跨界——只有很少的几种细胞会到处游走，血细胞、白细胞，其他细胞如果移动，就叫癌细胞转移了。大公司的每个工作流程都已经在千百个场景里应对过，个体的经验只是其中很少部分，你只要学习、遵守就好。大公司也会提供足够好的培训体系，你只要学习就好。


    小公司则完全不同。中国中小企业的平均寿命只有2.97年，注册一家公司只要几千块钱。小企业像简单的微生物，每个细胞都需要有很多功能，而且生死都迅速。单细胞生物，需要什么功能都有点，没事到处补位。而且很多靠你自学，没有谁有空教你，你只能靠自然选择进化——当然，一旦摸对路子——这种生物要是繁殖起来是指数型的，成长速度根本不是大型生物那种一胎生好几个的路子。


    大公司的系统越复杂，就越稳定，比如，发展到哺乳动物，甚至发展出了恒温这个功能。所以大公司的稳定性很好，安全性很好、你只需要做个好细胞、等待被温柔地新陈代谢，或者按照规则慢慢上升。


    小公司则新陈代谢非常高、极端不稳定，这里需要到处乱跑，四处补位的细胞，但也蕴藏着进化的可能。找对了进化路径，成长非常吓人。


    大公司稳定、规范、狭窄；小公司不确定、灵活、开阔。


    ## 选择稳定的复杂系统，还是敏捷的简单系统？


    第一，看自身个性。


    有人是公司一大了就待不住，需要分裂成小组组织才舒服。他就喜欢冒险、变化、挑战和多功能。有人是更加适合稳中求胜，喜欢有组织有规范的事。


    第二，看行业环境。


    在需要灵活的新兴行业，微生物好，在恒温的大领域，复杂系统好。所以新生领域都是小企业，而稳定的二三线城市更多的是稳定组织。在一个行业的市场前期，小机构有机 会，在中后期，中大型企业更好。


    第三，看人生发展阶段。


    有人是先在大企业获得技能、规范、眼界和人脉，然后分裂出来做自己的公司——比如刘润老师，吴军老师。有人是在创业型小企业中快速理解了重重问题，然后学会如何把企业做大或者进入大企业把握全局——比如说你看到的大部分白手创业的企业家。


    你也不妨思考一下，自己这个阶段，是缺能力，还是缺机会？


    总之，人比细胞强，因为人有的选择权。


    回到你的故事——你的这次选择没错。在创业失败以后，去大公司稳定一段休养生息是不错的，但你应该拿到大公司的更多好处——你应该有机会学习大公司整体的框架、流程、见识优秀的管理理念，有机会提高自己已在销售、沟通、理解客户的能力，在其中认识一些未来有机会合作，甚至追随的人——等拿到这些眼界、能力和资源时，你也已经一定获得了公司的认同。


    这个时候，你会有更多选择，你可以选择在苹果继续干，可以选择平行进入对标公司，也可以选择有自己的一番事业——否则现在即使出去创业，除了努力，还能凭借什么呢？


    在生涯中，“要不要走”的问题总是错的，一直直到你把它变成“要不要去”——除非有一天，真的有一个创业的机会和团队非常吸引你，让你觉得值得加入，同时你也有了这个团队看重的实力。


    在这一之前，先好好的吸收大公司的资源、能力、机会。让自己更加强大，不管去哪里都是好事。


    愿你有一天有一个说走就走的方向和实力。


