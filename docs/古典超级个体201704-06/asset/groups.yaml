    ## 1.生死观、人生观、价值观


    只有深刻理解了生死观、才可能有完整的人生观，然后才有坚定的价值观。很多人都是经历生死以后大彻大悟，王阳明的龙场悟道；楚霸王的背后一战都是如此，生活中你也常能听到有过死亡接触的人会重新认识自己。


    不了解生死观的价值观禁不起考验。


    ## 2.我们为什么有死亡禁忌


    个体和文化都有死亡禁忌，我们不敢去直接谈论，怕鬼是最直接的表现。


    其实这是我们死亡恐惧的投射，你我都怕死，原因主要有三种：生前受苦、死后所属、后悔当初。


    ## 3.死亡恐惧与死亡焦虑


    如果这些恐惧不处理，就会蔓延到生活中去，成为某种焦虑。这种焦虑会让我们活得不从容，成为死亡焦虑。


    怕死、怕老、过度溺爱或过度期待孩子……本质都是怕死。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_11_1.png)


    ## 直视骄阳的3个礼物


    意识到生命短暂、脆弱、渺小。我们更有紧迫感用好生命；有危机感保护好自己；有使命感做点大事。


    ## 4.最好面对的方式是：直视骄阳


    死亡如骄阳，虽然直接看刺眼，但是背过身去，就永远站在自己的阴影之中。


    所以，直视骄阳！


    ## 5.生前受苦可度：生前预嘱、安宁疗护、知情权


    生前预嘱是拿回自己的选择权，不要让自己亲人承担本来应该自己承担的责任。


    安宁疗护是一种让自己尊严离开的机会。简单来说——我们有不疼的权利。


    知情权更多是说给子女的，父母没有你们想的那么脆弱——何况，不知道其实比告知更加可怕。


    ## 6.后悔当初可度：向死而生


    避免后悔的最好方式，就是把现在当成最后一天来活，这就是向死而生——向死而生并不是向着某一个你设定的，“有一天我老了”这样的场景而生，而是向着“每天都是最后一天”的可能性而生。每天都不能重来，跟每天“一期一会”。


    有太多的评论讲述了生离死别，一次次的提醒你离开可能是一件很偶然，很规划外的事。所以，跟每天“一期一会”也许是个好心态。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_11_2.png)


    ## 如何尊严和安宁地离开？


    如果不幸患了重疾，一定要让当事人立个生前预嘱，有条件的可选择安宁疗护，把知情权和选择权交给当事人自己。


    ## 7.恐惧死后可度：繁衍、贡献、创造


    三种方式能让你超越死亡——繁衍、贡献和创造。


    生物方面的延续是繁衍、而个人价值方面的延续就是贡献和创造——做点有意义的


    ## 7.恐惧死后可度：繁衍、贡献、创造


    三种方式能让你超越死亡——繁衍、贡献和创造。


    生物方面的延续是繁衍，而个人价值方面的延续就是贡献和创造——做点有意义的事，做点超越小我的事，做点不同的事。


    ## 8.宗教信仰和存在主义


    我没有宗教信仰，所以我并不知道死后会去哪里。


    很多人提到宗教的作用，从心理学角度，信仰宗教的确有利于活得幸福，但是我喜欢存在主义的哲学观。当你真实有存在感，就并不怕死，还有点好奇啊！


    ## 9.对死亡say hello，然后say goodbye


    只有我们真正对死亡say hello，才有机会对它say goodbye。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_12_0.png)


    从现在开始创造你的生活，活出自己的价值，就像是生命最后一天一样。


