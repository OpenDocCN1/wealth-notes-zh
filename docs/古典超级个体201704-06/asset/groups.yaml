    ## 故事名片法：让自我介绍永生难忘 28-3


    28-3 故事名片法：让自我...


    ### —— 一个问题 ——


    从新生入学、求职面试，到商务谈判、项目路演……我们一辈子，都在不断地介绍自己。“自我介绍”本质上是一种自我推销，是为别人留出时间的广告窗口。大家因为喜欢你，所以愿意继续和你合作。


    可惜大部分人的自我介绍，都千篇一律——“我是XX，来自哪里……”——让人听过即忘。


    这周我们的主题是“故事”，你已经知道，比起道理、说明，我们的大脑更喜欢听故事。所以，今天和你分享“故事名片法”，教你用讲故事的方法更好地推销自己。


    ### —— 一个策略 ——


    前面我们已经学过故事的四大构成元素分别是：情节，情感，细节，主题。根据时间的长短，10秒、1分钟、3-5分钟，勾兑不同的元素，就能做出一篇精彩的“你的故事”。


    ## 一、10秒，给你的名字加“主题”


    如果只给你很短的时间，那么最简单的方法就是把你的名字拿出来，增加一个主题。


    看下边的例子：


    我是吴能，不是“无能之辈”，而是“无所不能”。


    ——利用“谐音”


    拆字联想是个很好的方式：


    我叫陈锋，陈道明的陈，谢霆锋的锋。这两个人不仅都是帅哥，而且骨子里都是很有担当的人。


    注意那些不讨巧的主题联想：


    陈百强的陈，雷锋的锋。他们两位都去世了。这就是一种不积极的联想。


    陈毅曾在抗战过程中的自我介绍：


    我叫陈毅。耳东陈，毅力的毅。刚才司仪称我为将军，不敢当。我现在还不是将军。但是叫我将军也可以，我是受全国老百姓的委托，去“将日本鬼子的军”，一直把它将死为止。


    10秒钟你能做的，就是增加一个主题了。


    台湾作家李敖：“五十年内和五百年内，中国人写白话文的前三名是：李敖、李敖、李敖。嘴巴上说我吹牛的人，心里都为我提供了牌位。”


    ——多年以前，李敖已经懂得重要的事情说三遍；更重要的是，他只用一句，职业、定位，以及狩狂的性格，就全都让你感受到了。


    这种方法需要你给自己名字找一个联想，但是记得要找到合适的主题。


    ## 二、1分钟，给你的经历加“细节”


    加入细节，让你的故事更加生动、可信。以下是相声大师马三立先生的自我介绍，特好。


    我叫马三立。三立，立起来，被人打倒；立起来，又被人打倒；最后，又立起来（但愿不要再被打倒）。我这个名字叫得不对；祸也因它，福也因它。


    我今年85岁，体重86斤。明年我86岁，体重85斤。


    我很瘦，但没有病。从小到大，从大到老，体重没有超过100斤。


    现在，我脚往后踢，可以踢到自己的屁股蛋子，还能做几个“下腰”。向前弯腰，还可以摸着自己的脚。头发黑白各一半。牙好，还能吃黄瓜、生胡萝卜，别的老头儿、老太太很羡慕我。


    我们终于赶上了好年头……没有三中全会，我肯定还在北坍口农村劳动。


    其实，种田并非坏事，只是我肩不能担，手不能提。生产队长说：马三立，拉车不行，割麦也不行，挖沟更不行。要不，你到场上去，帮帮妇女们干点什么，养养鸡什么的……惨咯，连个妇女也不如。


    也别说，有时候也有点用。生产队开个大会，人总到不齐。队长在喇叭上宣布：今晚开大会，会前，由马三立说一段单口相声。立马，人就齐了。


    - 1. “三立”，三次倒下又立起来，增加“主题”。

    - 2. 形象特征：“瘦”。瘦到什么程度呢？“今年85岁，体重86斤。明年我86岁，体重85斤”，“从小到大，从大到老，体重没有超过100斤”。“很瘦，但没有病”。对于健康到什么程度，又是一段细节说明。3.
    自己的工作：“拉车不行，割麦也不行，挖沟更不行”，但是“说一段单口相声，立马，人就齐了。”


    1分钟的时间，可以用细节法了。找到几个你想要突出的特质：“姓名、工作、职务、性格、爱好”，然后为每一个增加细节，变成一个好故事。


    ## 三、3分钟，运用四大元素，讲一个生动的故事


    如果时间允许，你可以在自己的介绍中加入情节、情感、细节、主题等故事元素，设计一个生动的故事。


    前段时间看奇葩大会，蜜芽创始人刘楠分享了一个她怎么获得徐小平老师投资的故事。那其实是一段非常精彩的自我介绍。


    刘楠拿到徐小平的手机号之后，精心编写了这样一条短信：


    徐老师您好，我是一名北大毕业生成，但现在在开淘宝店。我的销售额已经有三千万了，但是我非常不快乐。我听说您是青年的心灵导师，我是一个陷入困惑的青年，您有时间开导一下我吗？


    情节、细节：北大毕业VS开淘宝店，销售额三千万VS不快乐。——冲突强烈，反差巨大，充满悬念。


    情感：困惑，非常不快乐。


    主题：青年导师解决“失足”青年。


    果然，徐小平老师在收到短信两分钟后，立刻回了电话，之后便成为了刘楠的天使投资人！


    故事很值钱，对不对？


    我看看珠峰。蜂蜜已经开始到山顶了。

    讨论还在继续。有人展开一张地图，用笔说明自己的想法。

    我看看珠峰，蜂蜜已到小半个山峰了。

    过了一会，讨论还在继续，有人拉来了向导，想让他解释一下自己的思路是对的。

    又过了一会，我看看珠峰，蜂蜜已经到了大半个山峰。


    我站起来，对他们说，反正我今天要去那里，走几步，试试看。于是我背起背包，紧紧肩带，调好手杖，深吸一口气，推开厚厚的布门帘。一出门，一股新鲜的凉气扑面而来，好像带着体温的雪山拥抱了你一样。我精神一振。继续向前。


    大概3分钟以后，听到脚步声，向导跟了上来。

    大概5分钟以后，我回头，看到了从房间出发的第一个人。然后是第二个，第三个。等我再走到下一个坡往回望。所有的人都出了门，安静地排成一条长队，向我走过来。


    叽叽歪歪的声音没有了，在5000米的海拔，行动就够累的，也没有氧气讨论了吧。

    等到15分钟以后，我们重新成为一支队伍，快乐地走到一起。


    当天晚上，我们顺利到达大本营，住在蜂蜜流下来的那座山峰的底下。我们在房间里面烤火、玩、喝酒，那天正好是11月11日，光棍节。我们叼着最后留下来的4根牛肉干，照了照片。我们过了很累，但是很快乐的一天。


    回去以后，我的一个朋友做了一个决定，他离开他一直觉得安全的大外企，开办了一个自己一直很喜欢的潜水学校。

    一年以后，他给我发了在菲律宾海边的潜水学校的照片。

    我说祝贺啊！他说，先走几步，试试看。


    我是古典，不过我很现代。

    当没有人知道答案的时候，我总想，先走几步，试试看。


    > ——在这个故事里，我没说我的职业，但是听完之后，相信你会记住我的性格，或者说我是怎样一个人。更加有趣的是，在我讲完这个故事以后，那个僵局消失了，所有人都有了共识——对啊，先走几步试试看。


    借助自我介绍，我其实讲了一个隐喻故事——在故事里，每个人都会暂时放下自我，进入到故事里，体验故事里的情节，然后带着一些感悟和启发重新回到生活，生活的很多问题也就有了解了。这才是故事、小小说、电影的重要性——我们热爱故事，是因为他们解答了我们一个终极问题——面对这种情况，我该怎么办。


    所以，会讲故事的人，最有魅力。


    ### ——▸ 今日回顾 ◂——


    如果只有10秒钟，你希望给别人留下什么主题？

    如果1分钟呢？你希望给大家留下什么细节？

    如果是3分钟呢？你会展示你人生中的哪一段精彩故事？


    ### ——▸ 每日践行 ◂——


    听了那么多，你也用故事介绍一下你自己吧！

    欢迎在留言区，写下你的“故事名片”。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_115_0.png)


    每个人都会暂时放下自我，进入到故事里，体验故事里的情节，然后带着一些感悟和启发重新回到生活。


    古典


    ## 特约成长导师：许荣哲


    这两年有一套关于怎么讲故事的“武功秘籍”——《小说课》，在海峡两岸大卖十几万册，掀起故事狂潮。作者就是我的朋友、“台湾70后最会说故事的人”许荣哲先生。


    罗胖说他是“最适合中国人的故事入门教练”。


    在我看来，许荣哲老师是讲故事的顶级高手。他的《小说课》是我看过的华人世界里讲“写故事”讲得最精准的。


    许荣哲老师曾任杂志主编、出版社总编辑，现在是电影公司负责人。他总说，“相信自己是天才，比真的天才更重要”，“因为我们是天才，所以要更加努力”。每一年他受邀演讲的场次都超过300场。


    虽然特别忙，但这次还是被我拉来为大 家做这期“故事课”的成长导师——因为他是这个领域最合适的人选。


    今天是古典陪伴你成长的第195天，一起加速，成为更好的自己。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_115_1.png)


    ## 如何找到生活的精彩故事？ 28-4


    我觉得自己人生好像没有故事啊，我该怎么找到好的故事？


    关于如何找到自己生活的故事，多记录、多留心、多收集，已经很多人说过，不再赘述。


    我今天就说一个思路——找到你想讲的故事里最“两难”的一个时刻，然后从这一刻讲起——因为故事里最有趣的部分，就是悬念和对抗。


    拿林语堂写的《苏东坡传》为例，如果让你写一个文学家如苏东坡，你会怎么写？一般人肯定会写“某年某月哪里有一个人出生了，他是大文学家苏轼”。


    林语堂却从苏东坡去世5年后开始写：


    当时当权的文臣搞了一块碑，上面有所他的他们认为好臣的名字，这块碑立在了全国各地，还有两块立在了午门外。有某一天打雷劈开了一块，皇上以为动了天谴，赶紧要求全国敲掉这个石碑。但是没想到“好臣”文人不仅不高兴，反而偷偷地把碑文的碎片收藏回家留念——因为碑上第一个名字，就是苏东坡。


    那么苏东坡是个怎么样的人呢？


    ## 悬念的吸力


    下面我们体验下“悬念”和“转折”折磨人的能力——幽默小说家斯托克顿的《美女，还是老虎》，故事梗概如下：


    有一个天才过头的国王，定了一套奇特的刑罚。他命令下属建造一座巨大的竞技场，并在场中设两扇大门，门后分别藏着美女和老虎。如果百姓被怀疑有罪，就会带到竞技场，站在两扇门的前面，强迫他二选一。如果打开门是老虎，代表老天爷认为你有罪，处罚是被老虎吃掉；如果打开门是美女，代表老天爷认为你无罪，为了补偿你，美女是你的了，带着她远走高飞吧！


    ## 两难是人性的“试验场”


    ### ——【故事众筹】——


    ### ——每日践行——


    这周是故事专题——最好的练习方式就是说自己的故事，所以有同学就留言说自己跟超级个体的故事，比如有位超体就提到在结婚六周年的纪念日里，他们夫妻俩一起学习了《超级个体》。


    我相信专栏里这样的好故事，肯定不在少数。所以期待你们一起来聊聊——你跟《超级个体》或者跟我之间有没有发生什么故事？这个故事给你带来什么样的改变？


    今天是古典陪伴你成长的第 196 天，一起加速，成长为更好的自己。


