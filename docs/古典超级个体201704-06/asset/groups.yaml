    践行是改变的开始。


    如果你有践行的惊喜和成果，记得分享给我，你将作为超级个体的典范——“超级践行者”，出现在星球里。


    践行者”，出现在这里。


    如果你还没有开始践行，看看“超级践行者”的收获，也许你会开始踏出第一步。


    文：


    我比较喜欢读历史书，以前还学习老蒋“不读完手中一本书坚决不读下一本”的方法。于是，自己以往看过的书涉及面很窄，阅读效率也差。了解并践行功利读书法后，最多的时候三本书一起读也不会觉得困难，而且视野变宽了。再切换着主动休息，认知效率提高了。


    # 【推荐阅读：第21周快速学习主题】


    果大喵喵：


    以前我是好胜心太强了，恨不得同时做好几件事情：一边做饭一边听音频，一边看书一边吃饭，厕所的时候还背单词……但自己却越来越焦虑，而且非常累。自己还没有时间思考，脑子一直处于紧绷状态。践行了一段时间“精力管理”后，停掉了所有多线程的事情，改成每次只做一件事，并且做完都刻意让自己休息一下。实施的效果非常明显，精神头也越来越足，不需要那么多咖啡来提神。事情越做越少，脑子越来越活跃，体验到的幸福时刻也越来越多。


    # 【推荐阅读：第5周精力管理主题】


    今天是古典陪伴你成长的第 214 天，一起加速，成长为更好的自己。


    # 与其被人贴标签，不如为自己设计标签 31-2


    - 1. 什么样的人品牌最容易被别人记住？

    - 2. 如何设计自己在朋友圈里的标签？


    # —— 一个问题 ——


    你有没有这样的经历：在各种群里“勤奋”地打卡，各种话题都凑过去接上几句，但你依然是群里的小透明；线下各种聚会，你努力表现，但最后你还是被人称作“那个谁”。


    事实上不是你没有价值，而是价值太多不知道从何说起——你需要“削尖”你的价值，刺入别人的心智。


    这个时代注意力稀缺，每个人的大脑都像一块吸满水的海绵：只有挤掉已有的内容，才能吸收新的信息。麦肯锡有着名的电梯法则——假如在电梯里遇到老板，你能在30秒，也就是电梯上升的过程中说明白你在做什么吗？


    如果给你10秒的时间，你能说清楚自己是做什么的吗？


    这个时代，个人品牌实在太重要了，最好的切入点是传递极其简单有效的信息——把个人品牌浓缩成个人标签。


    > 定位理论创始人、全球最顶尖的营销战略家艾叶·里斯（Al Ries），在《品牌22律》中说：“品牌应当力争在消费者心智中占据一个词汇。”“收缩焦点，你的品牌会更强大。”


    我们把视线转向体育界——对比阿迪达斯和耐克这两个品牌，你觉得谁的辨识度高？很多人觉得是耐克——一个勾、一句Just Do It；而阿迪达斯，三小块组成一个标志、Impossible
    Is Nothing


    ![](img/25e88d373f85ee6d39d9f51899b4f484_146_0.png)


    但如果镜头给的是大远景转播，你的观点会完全改变——你会分辨出三道杠就是Adidas，而Nike却需要给个近景特写才能看到勾。阿迪在远景中更加清晰——让人们在很远的地方一眼能认出来——这就是“远景识别力”。


    在今天的信息海洋里，我们需要让自己的标签有这种远景识别力。


    当你在夜晚抬头看看星空——你看到无数的小白点。其实每一颗星星都是发着不同颜色的七彩光——蓝色的海洋、红色的岩石、黄色火焰——但是在远处的人看来，这些光线融合在一起，变成毫无特质的白色。还不如只发出一种颜色的红宝石球好识别。


    注意力稀缺的时代，有特色比五颜六色更容易识别。这就是远景识别力。


    # —— 一个策略 ——


    设计一个具有远景识别力的个人标签，让人过目不忘。下面是设计标签的三个建议：


    ## 1. 从满足需求开始


    很多书会教你——个人品牌第一步是思考自己是谁？有什么优势？


    这个思路是错误的。今天的竞争围绕需求展开——柯达就是定义自己是胶卷第一品牌，才错过了发展数码摄像机的机会，其实数码摄像和胶卷满足的都是同一个需求。没有放到用户坐标，你不知道自己是谁，也不知道自己的竞争对手是谁，所以优势也无从谈起。


    标签要从“谁能多好地满足谁的哪些需求”开始。如果你你的品牌里面，没有对象，没有需求，那就是一个伪品牌。


    除了满足对方需求，更重要的是也满足自身需求。


    昨天谈到了唐僧的松糕标签，但有一个好例子——：“及时雨”“孝义黑三郎”宋江。这些标签每个都是江湖人士的大爱。《水浒传》里频繁出现这样的情节：遇到险情，宋江亮出标签——大喊，“我宋江今日休矣！”马上有人跳出来——“莫非你就是山东及时雨宋公明？”然后纷纷便拜。


    ## 2. 简洁再简洁


    少就是多，只保留最重要的差异点，其他都删除。


    奥巴马的两次总统竞选的口号都只有一个单词：2008年竞选总统时用的是change——人民需要改变。2012年在连任竞选时，他又用了一个干净利落的词语forward摆脱了竞争对手的死缠烂打——说什么也没用，选民们，咱们继续前进吧。


    ## 3. 找到宣传伙伴


    名号定了，你自己说不要紧，关键是意见领袖怎么看。个体影响的人还是有限，关键是如何发动更多人帮你推动。


    诸葛亮26岁成为刘备的军师，而且人家没有工作经验——靠的就是个人品牌运营能力。你看着刘备没见到诸葛亮之前，被高频安利了标签“卧龙”多少次——


    先是庞德公封号为“卧龙”，然后是水镜先生司马徽对刘备说：识时务者在于卧龙。此间自有“伏龙、凤雏”，得一人可得天下……徐庶必定投靠曹操，又“回马荐诸葛”，还没见面，标签都放好了——这才为之后的三顾茅庐做好准备。


    如何在朋友圈、社交场合设计一个“满足需求、简单、好传播”的标签？下面三步能帮到你。


    # 第一步，企业标签


    如果你公司特别有名，你就使用：“企业+职位”的标签。


    比如：

    阿里巴巴运营总监XXX，

    腾讯产品经理XXX。


    不公司的公司或品牌，则可以使用业务标签。


    # 第二步，业务标签


    对于大多数人来说，业务是最容易与他人产生链接的，突出业务是最好的标签设计。


    “你是什么做的”，“你能为别人提供什么样的服务”，“你服务的特⾊是什么”……都可以标签中体现出来。


    李春雨——著名生活规划师，擅长职业转型

    秋叶——IP训练营创始人，打造知识网红

    徐小平——著名天使投资人


    # 第三步，能力标签


    如果你从事的是一个容易对别人产生帮助的职业，如律师、医生、媒体，或者很受关注的职业，如投资人，你可以凸显你的让人希望链接的服务能力。


    张羽——《只有医生知道》作者；北京协和医院妇产科医师。


    刘芳——《游戏力》课程引荐者；亲子教育专家。


    不过要注意差异化。譬如在一个医生群里，你说自己是医生就没戏。


    一个人可以有很多标签，在不同场合使用。


    公众演讲，我的标签是“生活规划师、《得到》专栏作者、百万畅销书《拆掉思维里的墙》的作者”；在我的专业领域，我的标签是“新精英创始人、生活规划师国家认证标准制定者”，而面对企业家，我的标签是“创业者、高管教练”。


    今天这个信息爆炸时代，创造一个有远景识别力的个人标签，然后用自己的能力为其背书——让标签差异巨大，印象深刻。


    # —— 今日回顾 ——


    为什么说，信息爆炸时代，远景识别力日益重要？


    # —— 今日回顾 ——


    为什么说，信息爆炸时代，远景识别力日益重要？


    为什么标签设计需要考虑需求、简单有差异，以及伙伴愿意传播？


