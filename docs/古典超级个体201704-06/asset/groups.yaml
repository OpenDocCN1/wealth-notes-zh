    # “视觉化”的快速入门技巧 29-6


    古典


    这周的成长导师，我为你们请来了“国内图像同传第一人”毛泡泡老师，听泡泡老师的名字，就很有“画面感”——冒。泡。泡。


    在本周前3天的嘉宾介绍里，我用“最会画声画的人”来形容她，但今天访谈完，我发现另一种形容更适合她——“思想雕塑家”，这是我们一起碰撞出来的，很好玩。具体怎么回事，看到最后你就明白了。


    下面来享受下泡泡老师在各种场景下的作品。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_0.png)


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_1.png)


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_2.png)


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_3.png)


    看到这，估计你会发出感叹——真overflow是画得太好了。我这种不会画画的，估计没戏了吧？


    我也跟你有一样的疑惑，所以跟泡泡老师进行了一场对话。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_4.png)


    古典


    泡泡，现在大部分人没有那么长时间去学习画画，看到你这么好的作品，有点望而生畏，怎么办？


    现在大家在网上看到我的作品，大多是大会上同传的图像，这种确实是需要多年的功夫积累，所以大家看到这，第一反应都是“哇，泡泡提炼总结的能力太强了，能在这么短的时间内，把讲师的全部精华都提炼出来。就像讲师后面，有一个特牛的摄影师在跟拍，他什么都不用比划，摄影师也能拍出好作品来。”


    但这里面有个误解——我们在现场亮相前，就已经做了很多的工作。最重点是我们会和讲者一起探讨：怎么把枯燥的理论打造成一个有情景感、画面感的故事。这将决定是否能把复杂的理论、概念简化，让大众理解、传播。


    所以我们图像同传的价值，除了现场的呈现，更多是在前期的咨询和打造上，当我们一起把这个产品打磨好了，才开始亮相。


    古典


    原来是这样，你们就像是“思想的雕塑家”，和讲者一起用视觉引导的方式把“思想”雕刻得更美、更动人。那么对于普通人来说，要想做自己思想的雕塑家，有没有什么小技术快速入门的呢？


    入门的话，是先要有视觉化思维，然后才是视觉化引导。


    以听课的场景为例：


    第一步是——放下所有的电子设备，拿起笔开始画。千万不要只是开着录音笔听老师说，或者拍下课件等回去再看。


    第二步是——认真听老师讲，比如老师讲到，“今天我要讲三点。”那你就可以先画三个框框出来，在框框上写123，然后再把每一个框里面的内容填进去。


    当我们学会给“信息归类”，就已经开始入门视觉化了。这是所有人都能做的。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_5.png)


    古典


    你刚才讲到听课做笔记，那么平时生活中还有什么样的场景会用到视觉化吗？


    平时用到最多的场景就是各种沟通中。


    比如我家装修时，因为没有请专门的设计师，很多时候需要跟装修师傅直接沟通：这里长一点、那里宽一点，虽然是本地人沟通，但大家没有同频的画面感，所以比较费时间。这时我干脆就拿一张纸，画个图形拍照给师傅，他就全懂了。


    除此之外，平时我还会画画自己的名片，跟学员互动、点评时，也用画图来沟通。下面是我在淘宝定制装卡片的包包时画的图形。很简单，只有几个线条，是不是你也可以？


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_6.png)


    古典


    这么看来，入门确实不难，动手就能画。估计这时有一半不会画画的超级个体都放下了忐忑，默默地拿起了笔。


    泡泡，如果你觉得不会画画没关系，那你觉得什么比较重要？


    初学者可以不用过度表达艺术化效果，但需要有“看见”的能力：看见轮廓，看见要点。


    比如画小猪和小猫，重点注意的是他们的轮廓和特色，比如画一个猪鼻子，就知道是猪。画一个猫胡子，就知道是猫。


    但实际情况是很多人虽然都能看见，但却视而不见，他只是在look，但并没有see，如同这张图。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_132_7.png)


    古典


    在这期视觉引导内容里，我们有不少用到户在讨论它和思维导图的关系，你能说说它们之间的区别吗？


    在我看来，思维导图是逻辑整理，信息分支、属性归类的方式，看起来像是树根一样的神经图；视觉引导的图是更加直观，一目了然的，看起来就像一个真实的图标照片一样。


    举个例子，你们就能理解了。思维导图像是用牛皮纸箱搬家，里面的物品归类了，


    是用牛皮纸箱搬家，里面的物品归类了，但是如果不贴标签是不知道盒子里面装的是什么。而视觉引导就像是用透明的收纳箱搬家一样，非常直观，不用贴标签都能看清楚里面的内容。让沟通更加的直观，透明和快速反应。


    古典


    你做了视觉引导师这么多年，有没有什么有趣的故事分享下？


    其实有发生很多故事，其中一个印象深刻的是跟“现代管理学之父”一彼得·德鲁克的女儿塞西莉的碰撞和互动。


    老太太已经60岁了，刚开始她还不太认同视觉引导，她说：我有80多页的ppt演讲稿，已经在全世界都讲过很多年了，没有什么问题。当时我知道常规的观点说服不了她，所以问了她一个问题：


    如果用一个画面来表现领导力，你觉得会是什么样？


    这时难住老太太了，她就开始思考怎么用画面来解释讲了这么多年的理论。于是我和她开始一起打磨，如何用一个故事来讲好“领导力”。后来，成功地现场呈现出来了。现在我和她已经是很好的忘年交了


    古典


    泡泡，今天的谈话就到这了。你还有什么话想对超级个体说的吗？


    最后，我特别想对大家说——


    很多人看到我画得好，以为是因为我从小会画画而成的。其实不是，真正影响我画画的是深入观察的能力。因为画画需要我学着观察物体的前后关系，空间感，而这些是每个人都必须要有的能力。


    我也看到过很多不会画画的人，也画出很多优秀的作品，比如《视觉会议》David、《餐巾纸的背后》Dan Roam，他们的画简单又正中要害。


    所以我觉得会画画的人并不等于画得好的人，因为很多画画的人，不一定能有很好的逻辑能力、聆听能力、提炼和总结信息的能力，有时画得好反而会是种负担，因为关注点不一样了。


    所以我特想鼓励大家，视觉引导更重要的还是思想的表达，而不是技巧的呈现。直接动手画吧！


    ![](img/25e88d373f85ee6d39d9f51899b4f484_133_0.png)


    # —— 每日践行 ——


    今天，泡泡老师为了让我们每个人都能动手画起来，特意留了一道题：


