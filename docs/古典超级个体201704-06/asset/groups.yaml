    鼠不能进入”。最后父亲在胜利前一天被 害，而孩子在早上醒来走出集中营，看到了 美军的大坦克。


    玩是一种面对逆境的态度。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_159_0.png)


    # 商界的超级大玩家


    维珍集团的创始人理查德·布兰森，这个 英国老顽童简直就是人生超级玩家。他积 极进入各个行业，但他不创新产品，只 创造商业模式。今天这一家英国最大的私营 企业有200多家公司，5万多雇员，业务
    几乎无所不在——从维珍唱片到维珍航 空、维珍铁路、维珍电信、维珍大卖场、 维珍婚纱、维珍影院、维珍金融服务、维 珍可乐……他说，“如果你愿意，可以一 生子用维珍的产品活下去”。


    每一次维珍品牌的延伸，都附送一场理查 德·布兰森带来的独特的show——维珍 航空刚面世，布兰森自愿剃掉腿毛，化身 空姐，登上飞机为乘客服务；再早前，维 珍航空宣布开通新航线时，布兰森身着一
    套传统的苏格兰红裙并主动态“裙底”！


    他的人生也是一场游戏。他曾在波斯湾战 争期间开着飞机直接进入巴格达接回人 质。1986年，他的“维珍大西洋挑战者 二号”以有史以来最快的速度穿越 ‎大西 洋，他还保有热气球飞行最远，水陆两栖
    车穿越英吉利海峡的各种世界纪录！


    BBC在2001年进行的一项民意调查中， 被评为最具启发性人物第二名，排名高于 耶稣。他的6人生格言就是“玩得漂亮”。


    玩是一种轻松驾驭事物的能力。


