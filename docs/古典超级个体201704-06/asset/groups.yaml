    # 那些打动我的“会玩儿的人”


    # 笑对逆境的父亲


    电影《美丽人生》里，善良的犹太人父亲 和孩子一起被送进了纳粹集中营。集中营 的痛苦不仅只是身体，还是心灵的。为了 不让孩子面对这个残酷的现实，父亲告诉 孩子，这是个大游戏，如果你能一直关
    ——你将会获得一个大坦克！


