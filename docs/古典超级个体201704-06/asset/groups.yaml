    # 写作是认知的逆向工程 26-3


    《超级个体》的目标为大家提供最实用的职业发展工具和个人成长方法，为了最大限度地贴近超级个体们的需求，我们需要了解你的想法和偏好。


    你的意见对我很重要，期待你的反馈。


    复制下面的网址，到浏览器打开填写（约占用3分钟）：


    https://jinshuju.net/f/hUz8UW


    前两天我们谈到了为什么写作，如何写作，今天我们谈谈写作的底层逻辑——主要是观点传播类的逻辑。


    你需要知道的一个概念就是，写作是表达的逆向工程。


    什么叫做逆向工程？二战时候德国人做了一个特好用的密码机英格玛，英国人图灵则最后破译了这个机器，还顺手发明了图灵机。图灵做的就是编码的逆向工程。又比如《三体》里三体人要攻占地球，而地球人找了3个人谋求战略性突破，他们做的就是进攻的逆向工程。


    两周前，大家认真地学习了人是如何记住东西的，那么你只要能够倒过来想这个事情，就明白你该怎么样写东西了——因为我们写东西不也就是方便别人输入并且记忆吗？


    所以，写作是表达的逆向工程。


    我在前面讲过一句很高级的话，我说写作就是把网状的思考，做成树状结构，用线性语言表达出来。那么，好的写作就是帮助读者把一个线性语言，在脑子里形成一个树状的知识晶体，最后储存成为网状知识。


    ## 1.优秀的结构


    好的写作就是认知的3D打印——你的笔一行行地扫描，最后在纸面上呈现一个立体知识晶体。曾经有人问我——你怎么读书这么快，2小时一本。我说，你看这本书，是一行行看，速读也即一页页看，但还是平面。我看这本书是凹凸不平的。有些段落高，有些段落低，有些词突显，有的就看不清。我先读完海拔5000米以上的...内容再细看。


    你猜结果怎么样？


    别人骂我装逼，走了。其实我特真诚，这都快是心法了好吗？他们只是无法理解……就像二维生物没法理解三维人。


    除了文章的主框架，好的文章还会通过排版形成认知辅助系统。


    - a. 文章会形成清晰的几个段落，当你看到第一段的时候，你也应该能猜到后面。

    - b. 隔段时间会有分段，让你大脑休息会，也告诉你这个句子结束了。

    - c. 重要的地方可以加粗加蓝。


    这样你在读的时候，从纸面上缓缓地升起来了一个立体知识晶体。细碎的信息被吸附上去，形成了一个有血有肉的框架——在文章最后面的时候，作者又重新把你拉到这张纸的顶端，让你看看整个文章中间呈现出来的框架结构。这个时候，整个二维记忆就在脑子里面，树状图，就立了起来。而凑近去看每一个细节，又觉得无比清晰，这样就完成了一篇好的文章架构。


    ## 2.类比和举例子


    我们先来看一段史蒂芬·平克的《写作风格的意识》The Sense of Style 的文字，我觉得这段文字表述得非常精巧。


    大爆炸理论于是诞生……可是科学家察到大爆炸理论受困于一个明显的理论缺陷。偏偏他就是漏掉了爆炸。爱因斯坦的方程式很了不起地描述了爆炸后不到一秒的顷刻间，宇宙怎样演化而来。但方程式一旦运用到宇宙初始一刻那种极端情况，就绰...不
    行了——就像你用1除以0，计算机显示“出错”。因此大爆炸理论对于什么力量造成了爆炸，并没有提供任何洞见。


    作为一个作者，你需要学会用两个视角看文字——一个是读者视角，一个是作者视角。观察自己看的时候的情绪体验——当我们的眼睛随着文字往下走的时候，听到一些概念。然后我们会问，这是什么鬼？


    但是作者告诉你用0除1的比方，你马上就理解了那种不可解。这就是类比。


    再比如说：


    就好像地球引力把一个往上抛的球上升的步伐拖慢下来，每个星系之间的引力的拖拽效应，也必然令太空的扩展减慢……（然而）所见的绝非步伐减慢。大约70亿年前，太空的扩张转换到快速排挡，自此一直在加速。这就好像把球轻轻上抛，一开始上升速度减慢，但接着却越来越快地向上飙。


    好的作者就有这个能力让认知难度降低——每当你问“什么鬼？”接下来马上就会有大量的，视觉语言和听觉语言会被塞到这个里面，等于在你内心上演了一场话剧。如果这些不是活生生的例子，而是一堆类似这样的鬼话，你就会觉得不知所云，读不下去，然后敷衍放弃。


    ## 3.观点、情绪和价值观


    还有一些作者会增加自己的个人情感和价值（比如列舒尔...）


    小贴“什么呢？”按个不向上说云们入里间，似乎觉得语言和听觉语言会被塞到这个里面，等于在你内心上演了一场话剧。如果这些不是活生生的例子，而是一堆类似这样的鬼话，你就会觉得不知所云，读不下去，然后敷衍放弃。


    ### 3. 观点、情结和价值说


    还有一些作者会增加自己的个人情感和价值（比如我讲知识晶体的一段，再比如说我的声音就和播音员的不一样，里面蕴藏情绪，是三维的），这会形成个人风格。最后再问自己一次“这些内容真的是值得一读的优秀的观点和想法”吗？这样就是一篇好文章。值得分享的内容、逻辑清晰的结构、激发视觉和听觉的语言描述、引发共鸣的情绪和价值观、以及背后作者的人格。


    我把这个四层结构叫做“写作汉堡包模型”：


    观点和主题是肉，逻辑框架是汉堡包的结构，增加蔬菜、奶酪层让你吃得不太干，这是视觉、听觉、语言。情绪是调料和番茄酱，背后是厨师的人格和手艺。


    理解了汉堡包模型。我们可以回顾下初学者的种种错误。


    ### 初学者易犯的错误：


    第一，不列大纲，直接往下写，写完也不调整，这就缺框架。


    好比做汉堡包拿什么放什么，不可能好吃——想想看，最后一层才是肉的汉堡包是多么糟糕。


    对于日记和记叙文，时间线也许是可以接受的线，但是对于其他问题，缺乏结构、或者结构失调是大问题。


    所以，列大纲，列大纲，列大纲。最后再调整一下比重，很重要。


    第二，过多地被自己感动。


    比如说，很多人会大量地去讲自己的一个故事，里面充斥着很多人物、细节；好的故事也有很多细节，区别是当这个故事拿给别人的时候，他们是否觉得稀松平常。这里有大量删减空间。


    比如我在清明节写的那篇文章，我的好朋友就说，你写的这么多理性和克制，而下面的留言很感性，真的很感人。


    其实我感性得要死，尤其当我写到外婆那一段。但这篇文章需要在一个两千字的篇幅里讲清楚要直面骄阳，外婆的故事再感人，也不足以说明这个大话题，只是为了说明不正视的“后悔”，所以它只获得了自己该有的篇幅。


    克制是美德，呈现出一种总体、均衡的美感。


    第三，缺乏好的“品味”。


    前段时间有人给我推荐一个时间管理系统，我看一眼就放下了，没戏。


    为什么？


    因为太复杂。这明显就是为太闲的人做的刷成就感的系统，而不是真正需要时间管理的人提高效率的系统——真的忙人没空填这么些表，也不会搁这么多闲事。


    由不忙的人做的时间管理系统，和不会学习的人写的观点文，一样不可信。


    如果文字也有品位，我的品位就是简单又简洁。


    我热爱这样的文字，痛恨那些布满含糊词的官样文章。例如那些大量出现“总而言之”“话说回来”“大概”“一般来说”这样的废话，或者是“单一性”“结构化”这样充满虚词的文章。弗洛伊德分析过语义背后的潜台词——这些含糊语背后说的是：“嗯~我也不确定”。


    比如说我要写：


    > “一般来说，我对于文章有过多的含糊词的认同度不高，当然，除非很多情况下的必要。”


    你会不会杀了我？简直没有观点，老大！如果你没有清晰的观点，那就去调查，如果没有调查和立场，那就不要说。这就是心智还停留在第二层级，相对主义的表现。


    理解了“认知的逆向工程”的说法，你才能真正理解好文章的结构、坏文章的标准，以及什么算是好文章的品味——能提高认知效率，形成知识晶体的简单而简洁的文字才是好文字。


    简单是因为你抓住了核心概念，简洁是因为你沿着核心逻辑走。


    这就是我对文字的品味。


    写作这种功能是我们人类大概在近100年才大面积普及的，我们的大脑习惯于听、看、说，并没有天生写作的能力，所以写作是一个需要后天学习的重要技能，没有天才。


    理解了写作是学习的一项工程，你就可以理解，为什么写得好的人肯定学得好。你也可以理解那些学得好，但是写不好的 人，恰恰是因为失去了他们没有接触知识之前的哪一份感受，所以呈现出一种，术语多多，自得其乐，但是别人却不明白所以的状况。


    你可以说这是知识的诅咒，但是这个诅咒，完全可以被练习所克服。


    ## —— 今日回顾 ——


    - 为什么说写作是认知的逆向工程？

    - 什么是大脑中的3D打印机？

    - 好文章的“汉堡包结构”有哪四层？

    - 为什么写作好的人都学得好，而反过来却未必呢？


    ## —— 每日践行 ——


    - 带着这个新认知你对写作有什么新感悟吗？

    - 有哪些经典的文章或者作家值得推荐呢？可以在留言区告诉我，欢迎你的分享。


