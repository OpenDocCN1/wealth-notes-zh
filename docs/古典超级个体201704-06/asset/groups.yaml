    # 精华 | 如何利用你的知识赚2次钱？ 29-5


    29-5 精华 | 如何利用你的...


    ## 笔记、思维、展示可视化


    ## 1.视觉的大脑


    我们拥有一个视觉大脑——70%的神经都和视觉相关，据神经科学研究，人脑活动总量的近2/3都用于支持视觉功能。所以眼睛也是一种思考器官。当我们沟通、讲话、表达、做笔记、写作、讲故事时，你一定要唤醒一个人的“画面感”。否则，你就只打动了三分之一的人。


    ## 2.视觉化思维


    视觉化思维，就是把思维用视觉的形式呈现出来。


    视觉化思维的重点是思维，不是好看；像不像没关系，相信你的大脑处理能力——能在大脑中还原。


    ## 3.笔记可视化


    A4纸，横放，从左到右使用。


    - 在笔记本顶部写标题和日期

    - 行首对齐，利多图、表等视觉工具

    - 商业会谈：“事实——解释——行动”的黄金三分法

    - 读书笔记：“观点——案例——行动”

    - 成长笔记：“事情——做法——收获”


    ## 4.工作笔记的原则


    - 结构化

    - 以问题为中心：以解决问题为核心“过标题筛选法”

    - 好奇倚车场：专找灵感或者不相关的有趣问题


    ![](img/25e88d373f85ee6d39d9f51899b4f484_130_0.png)


    人脑活动总量的近2/3都用于支持视觉功能。当你向别人传递观点时，要学会用视觉化思维调动对方的视觉功能。


    ## 难题可视化


    ## 5.解决复杂问题，你需要一个大内存


    人类大脑的工作内存和认知负荷都是有限的，我们只能同时处理3-5个认知单元。思考超过这个认知单元的复杂问题，需要我们一边聚焦一边发散，所以容易造成恶性循环，引发大脑“宕机”。解决这个内存不够的问题，就是把纸张当成大内存，让思维可视化。


    ## 6.零秒思考，让大脑内存释放


    - A4纸横放，左上角写标题

    - 写4-6行，每行大概15-20个字，结束后在右下角写日期

    - 不要在意逻辑、语法、字体，2分钟内完成

    - 每天用15-20分钟，坚持写够10页，类似一种手脑参与的动态冥想


    ## 7.零秒思考，让情绪困扰释放


    情绪困扰也是思考复杂问题的障碍。情绪倾向于让事情变成“非此即彼”“非黑即白”，情绪很大时，人只能调用2个甚至1个认知单元。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_130_1.png)


    ## 商业问题可视化


    ## 8.手绘在小型会议中更受欢迎


    即使电脑如此发达，还有很多人更倾向于手绘解决商业问题。现在亚马逊、苹果的内部会议中，翻PPT被禁止，大家更推崇白板文化。


    ## 9.六种图形呈现所有商业问题


    《餐巾纸的背面》的作者丹·罗姆认为，几乎所有的商务问题都可以归结为以下6个侧面，4W2H：


    1. Who 谁/什么--人、角色；

    2. How many 有多少--数量、频率、增长；

    3. When 什么时候--计划、顺序、进度；

    4. Where 在哪里--方向、趋势、站位、归属；

    5. How 如何做--方法论、要素、流程；

    6. Why 为什么--关于整个系统的展示。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_130_2.png)


    ## 10.学习认知更要学习表达


    在几天前，我听了一个大牛不知所谓的演讲。他的内容很不错，但是表达得很糟糕，观点缺少案例、PPT文字拥挤、演讲冗长而且不会讲故事——总的来说，很没有画面感。但是我内心很高兴，因为我能...


    冗长而且不会讲故事——总的来说，很没有画面感。但是我内心很高兴，因为我能看明白里面的干货。


    这意味着我有自带的“抓取信息-知识晶体-关联记忆”的能力，我认知就比别人快。


    而且我还会表达。这意味着我能通过把这些内容四化：“写作结构化、演讲口语化、故事情节化、图像视觉化”，教更多人学会。我的影响力就比别人高。


    这就是学习认知和学习表达的双重力量——让你更快地获得知识，也让你更快地传递知识。理解了这种一体两面——你会成为一个热爱阅读艰难内容，勤于思考的人，因为它们能帮你赚2次钱，收到2次智商税。


    今天是古典陪伴你成长的第 204 天，一起加速，成长为更好的自己。


