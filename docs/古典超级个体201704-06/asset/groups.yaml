    ## ——一个问题——


    你提交一份报告，上司意味深长地回复，“你再好好想想”。你叹一口气，感觉自己思考的确实不够深入，但怎么都想不出来更好的；


    工作临近最后后期限，你还没有完没了地收集信息，瞻前顾后；


    有些很重要的न्ह问题，一想到就头大——什么工作适合自己？考研还是上班？我们适不适合？


    很多人绞尽了脑汁，实际却原地踏步。思考的努力程度和思考的质量，并不成正比。很多有价值的创意、想法，反而会在反复思考中消磨殆尽。


    今天教你理解大脑工作的原理，利用可视化“深入思考”。


    ## ——一个观点——


    ## 解决复杂问题，你需要一个大内存。


    人类大脑的工作内存和认知负荷都是有限的，我们只能同时处理3-5个认知单元。当我们全力聚焦一个问题的时候，需要抑制其他脑区的运作。但是一个问题越复杂，需要推导的步骤、调用的知识块就越多。


    这就形成一个悖论——我们没法一边聚焦一边发散。这就是你苦思冥想，却还是不得其解的原因。如果这个恶性循环引发你的焦虑，那么大脑就容易过热“宕机”了。


    其实我们需要的是一个更大的思考内存。


    ## 1、视觉化思考调用更多脑区


    ## 2. 视觉化让思想清晰化


    ## ——一个策略——


    - 1. 一张A4纸横放，左上角写标题。

    - 2. 写4-6行，每行大概15-20个字，结束后再右下角写日期。

    - 3. 不要在意遣错、语法、字体，2分钟内完成。

    - 4. 每天用15-20分钟，坚持写够10页。


    为什么要2分钟完成？


    因为思考时长和思考质量不一定成正比。人的大脑的工作记忆，顶多存储大概6-8条信息，所以尽快导出出来，才有可能清空内存，进行下一步存储。这个导出的过程，2分钟足够了。很多人想了好久，只是回调用了已有的几个想法而已。所以，强迫自己2分钟内完成。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_124_0.png)


    比如你上班的时候，被领导批了一个狗血淋头。


    这时不妨开始零秒思考——写下主题：老子凭什么要被骂？或者你直接写—某某神经病，我凭什么要被骂？情绪也许能推动你走2-3行，等大脑内存清空，新的想法就会浮现出来：


    是我做的有问题，还是他对我有偏见？


    是我做得不好，还是他今天情绪不好？


    我为什么会这么愤怒？


    我要不要辞职？


    所以，如果你非常气愤、意志消沉，那就尝试写出来吧。


    每天晚上重新回顾一下思考的要点，用笔标出自己觉得重要的部分，如果实在没有时间，不妨在第二天早上看看昨天的思考，然后继续写下一篇。


    书写让思绪更发达，让情绪更宁静。今天开始，不妨尝试书写吧！


