    ## 理解“船锚模型”，释放个人潜能 35-1


    35-1 理解“船锚模型”，…


    昨天的预告里我们说到，在生活中，我经常会听到很多关于性格的说法：


    > “我天生内向！所以我一到公众场合就会非常害羞，经常说不出话来，更别提演讲了。”


    > “我俩处不好！不因为别的，就是性格不合！”


    > “不好意思迟到了一会儿，我们白羊座就是比较随意。”


    在这些人身上，性格好像真的决定了他们的能力和做事的方式。但我们也能看到完全不同的情况：


    很多伟大的演讲家比如丘吉尔、林肯，都是内向者。


    好的关系都是反复磨出来的，没有所谓的性格不合。


    守时是一种习惯，而习惯是后天养成的。


    # 到底性格多大程度决定我们的能力和成功？我会用一周的时间来剖析这个问题。


    今天我要帮你区分一些容易跟“性格”混淆的概念，其次给你介绍一个“船锚模型”帮你正确理解性格的作用，以及如何科学地塑造自己的性格。最后，我想谈谈看，性格真正决定的是什么？


    首先，讲讲经常混淆的一些词：


    当普通人在说性格的时候，其实他们在说一堆混淆的概念，我给你说说这些词的区别：气质、性格、行为习惯。


    ## 区分气质、性格、行为习惯


    + 1. 气质是最底层：一个人体行为心理中间稳定的、和先天相关的那些部分。


    气质往往和遗传有关，比如抑郁症、神经质、乐观都有明显的遗传因素。


    + 2. 性格是“对现实的态度和行为中的相对独特性而稳定的心理特征”。


    性格来源于气质和后天社会文化和教育。虽然没有气质稳定，但是比行为稳定。重大的人生经历和社会事件会改变一个人的性格，比如说经历过生死，性格一下子就开朗起来；或者脑部受创伤的人性情大变，但是性格大部分是独特又稳定的。


    + 3. 行为是一个人的行动，习惯是自动化的行动。


    有一些自动化的行为——比如有人一开会，腿就和通了电一样一直抖——这就是习惯；有人习惯于说话快、有人习惯于关注人多过事，这就是行为风格。其实我们经常说的技能，也是自动化的行动。比如别人是一开会抖腿，你是一听音乐就有规律地抖腿加扭腰，这就是舞蹈的技能。


    本期联合策划人胡云云老师，用一个“船锚模型”，为你说明了这个关系。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_183_0.png)


    如果把我们每个人比作一艘停留在海上的船。船锚就是我们的基因和气质——一旦锚定，不会移动。性格是链条，链接船和锚。性格和气质都在水下，我们能看到的只有船的移动，这就是可观察的行为习惯。大海的洋流，则是不同情境。


    # 行为倾向性：可塑性


    如果行为和气质相近，这时链条就比较放松，性格自然舒展。你也可以把注意力放在修船上，也就是改善行为上。如果行为和气质差得很远，链条就崩得很紧，你要花一分精力在控制链条上，产生内耗。所以，每个人都有一套天生的、自然而然的行为方式，这种状态下，效率最高。这就是行为倾向性。


    那么为什么我们还需要做性格以外的事情呢？因为海上的高价值区，有时候不一定在你的舒适范围内，这时候就不得绑紧链条去那些领域工作。这时，对性格的张力的控制就很重要。时间一长，链条会变长，性格就有所改变，这就是性格的另一个特性——可塑性。不过也不是无限度的可塑——如果行为实在离原有的气质和基因太远，搞不好就翻船或者断链子——精神崩溃、行为失调了。


    所以，基因和气质决定了你行动的原点，性格决定了你行动的范围，刻意练习决定你的能力水平。


    # 行为和性格不一定有关系


    船往哪里走，是洋流、船锚、链条共同作用的结果。如果你海上看一条船，想猜测他的海底船锚和链条在哪，你可能需要在不同的洋流之下观察好一阵子，才能隐约猜出船锚的中心。


    同样的道理，一个行为背后，有气质、性格、情境的共同作用，是非常复杂的结果。如果真的要测量一个人的性格，需要综合很多情境下的非刻意行为规律。所以所有那些“因为你……，所以你就是……样的人”的人的判断方法，都是伪科学。


    # 性格到底决定了什么？


    今天商业社会中大部分技能，都是人类在近300年发展出来的，没有谁有太多基因优势。除非在特别高水位的阶段，性格并不是主要限制因素，刻意练习才是。——只要认真学习都能60分，努力则能有80分，只有到80-95分才需要性格的配合。


    人总是对于“自我”保护得很好——做得好的，总觉得是后天努力；做不好的，往往就甩锅给性格、星座、八字……当时说的舒服，其实也就把自己限制住了。


    那么性格决定什么呢？性格决定的是能力练习的路径——内向者也偏向于提前准备，反复独自打磨；外向者喜欢边说边改，共同讨论。同样是销售，而小额销售则主要靠激情，需要外向热烈，一下子成交。百万、千万级的大型机构销售往往都是内向的，因为对于这种重要决策，往往需要大量思考、技术知识以及感觉销售的人要靠谱，内向人正好合适。


    如果下次，你身边有人说——我内向所以做不会演讲，你可以告诉他，你不是内向，你是害羞；你不是害羞，你只是缺练；你不是缺练，只是没找到适合自己的练习方式和拉伸自己的动力。


    今天我们谈到了船锚模型，气质、性格、行为、能力的关系；大部分技能，都能练到80分，别扣缺能即可归咎于性格不合。你要找到的是最适合自己性格的修炼方式。


