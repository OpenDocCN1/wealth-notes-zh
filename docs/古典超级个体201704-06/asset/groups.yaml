    # “玩家”，绝顶高手才能享有的尊称 32-4


    在讲游戏力主题的这一周里，毫不出意外地，我收到了很多超体们发来的困惑和质疑：


    - 1. 古典老师，我今天想来唱唱反调，生活中不是一直在强调什么克制懒惰、战胜拖延、抵制诱惑，玩游戏，它是一种浪费时间的事情，我们好不容易用各种习惯打败了他，现在我们又要重新去找回他，人生岂不是又回到了起点吗？

    - 2. 玩游戏特别特别容易上瘾，一旦上瘾的话，玩游戏的利也就变成了弊，比如我身边就有特别爱玩英雄联盟、斗地主的人，这个怎么破？

    - 3. 自从下载“得到”之后，感觉已经没有心思和时间玩游戏了，所以现在最困扰我的问题是：如何在游戏和工作，学习之间取得平衡，或者说我应该安排多少的时间在游戏上面比较合适？

    - 4. 古典老师，我之前了解到的是，人的状态大致可分为，舒适区，学习区，恐慌区三个区间，学习不是一项很轻松的事情，在舒适区是学习不到有用知识的。今天，您说要有一种玩的心态，是否和学习区有冲突呢？或者是从另外一个角度来理解这个事情呢？


    大部分人对于“玩”的误解，是把玩等同于游戏、斗地主。但我们本周讲的“玩”不是具体指某项活动，而只是一种状态。真正高效能的玩，是 Playful，而不是Play；是游戏化而不是游戏。玩家不是天天在玩，而是用玩儿的状态来做事。


    ## 玩，是大自然赋予的心理调节机制


    正是因为重复练习和研究探索都是非常痛苦的事，大自然才赋予了我们一个抵抗这种痛苦和焦虑的心理机制——“玩”。


    心流就是最好的证据之一（心流：在全身心投入某事的一种心理状态。人在处于这种情境时，往往不愿被打扰，抗拒中断），当你进入心流通道，体验到一种“忘记时间流逝、全然专注、灵感源源不断”的状态，你也就自然放下对于不确定的恐惧，获得最高绩效。


    ## 玩，是调整注意力分配的策略


    人的注意力带宽是有限的，如果你一方面要克制自己内心的冲突，一方面又要应对挑战区，等到内外受敌，很难达到高水平。更好的状态就是“playful”地去做一件事情，在一个高难度的区域用玩的心态，内松外紧是最好的竞技状态。


    当我们准备看一本又长又枯燥的书时，往往会先挑逗下自己玩的神经——试试看，一小时内能不能看完100页？能不能挑出10个金句？这些小游戏都会让我们特别享受，避开了读书本身的痛苦。


    霍金也是个这样的人。他常常就一些重要的学术问题和别人打赌，比如他跟物理学家索恩的三场赌局——


    - 第一次输了，他赔给索恩一年的《阁楼》杂志（这是什么杂志这种纯洁的人根本听不懂）；

    - 第二次输了，他又赔给人家一件写着“自然界没有裸奇点”的T恤；

    - 第三次又输了，赔给人家一本《宇宙百科全书》


    这种玩的心态背后是对学术的较真，输赢不是关键，找到真相才是目的。你在很多世界顶级的高手身上，都能找到这种“Playful”的状态，很多科技公司的CEO在接受采访时，都会反复提到高手身上的“大男孩”气质，本质上那就是一种玩儿的状态。


    如果你能在现实生活中这么“玩儿”，你肯定会是一个优秀又快乐的人。到那时，虚拟世界的游戏反而变得没那么有吸引力了——没空玩游戏，生活本身已经足够好玩。


    ## 那些打动我的“会玩儿的人”


    ### 笑对逆境的父亲


    电影《美丽人生》里，善良的犹太人父亲和孩子一起被送进了纳粹集中营。集中营的痛苦不仅只是身体，还是心灵的。为了不让孩子面对这个残酷的现实，父亲告诉孩子，这是个大游戏，如果你能一直关——你将会获得一个大坦克！


    在整个故事里，父亲用一种奇特般的游戏力让孩子相信了这个故事——当孩子问，为什么会有“犹太人和狗不能进入”？父亲说每个人都有自己的奇特喜好，有“不欢迎西班牙和马”，有“华人和袋鼠不能进入”。最后父亲在胜利前一天被害，而孩子在早上醒来走出集中营，看到了美军的大坦克。


    玩是一种面对逆境的态度。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_159_0.png)


    ### 商界的超级大玩家


    维珍集团的创始人理查德·布兰森，这个英国老顽童简直就是人生超级玩家。他积极进入各个行业，但他不创新产品，只创造商业模式。今天这一家英国最大的私营企业有200多家公司，5万多雇员，业务几乎无所不在——从维珍唱片到维珍航空、维珍铁路、维珍电信、维珍大卖场、维珍婚纱、维珍影院、维珍金融服务、维珍可乐……他说，“如果你愿意，可以一生都用维珍的产品活下去”。


    每一次维珍品牌的延伸，都附送一场理查德·布兰森带来的独特的show——维珍航空刚面世，布兰森自愿剃掉腿毛，化身空姐，登上飞机为乘客服务；再早前，维珍航空宣布开通新航线时，布兰森身着一套传统的苏格兰红裙并表演“裙底”！


    他的人生也是一场游戏。他曾在波斯湾战争期间开着飞机直接进入巴格达接回人质。1986年，他的“维珍大西洋挑战者二号”以有史以来最快的速度穿越大西洋，他还保有热气球飞行最远，水陆两栖车穿越英吉利海峡的各种世界纪录！


    BBC在2001年进行的一项民意调查中，被评为最具启发性人物第二名，排名高于耶稣。他的人生格言就是“玩得漂亮”。


    玩是一种轻松驾驭事物的能力。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_159_1.png)


    ### 玩转生活的相声演员


    著名相声演员于谦，大家都知道他是捧哏奇才，但很少有人知道他的爱好绝不止“抽烟、喝酒、烫头”——他是一流的大玩家，他会在林子里捕鸟驯养，会训鹰、养狗，在京郊有60亩的动物园，圈养了大大小小数千只动物，是中国骆驼的一流专家。如果你喜欢玩，推荐一本于谦写的书——《玩儿》。郭德纲给这本书的序言是：“他玩得比我自！”你可以看到于谦是怎么率命地玩儿的。看完这本书，你就能理解，他在舞台上那种大智若愚、大气随和的状态从哪里来。


    玩是一种淡定看人生的心态。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_159_2.png)


    所以，没空玩游戏——生活太好玩了。


