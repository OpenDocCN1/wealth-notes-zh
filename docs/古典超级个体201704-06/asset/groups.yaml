    # 如何找到生活的精彩故事？ 28-4


    我觉得自己人生好像没有故事啊，我该怎么找到好的故事？


    关于如何找到自己生活的故事，多记录、多留心、多收集，已经很多人说过，不再赘述。


    我今天就说一个思路——找到你想讲的故事里最“两难”的一个时刻，然后从这一刻讲起——因为故事里最有趣的部分，就是悬念和对抗。


    拿林语堂写的《苏东坡传》为例，如果让你写一个文学家如苏东坡，你会怎么写？一般人肯定会写“某年某月哪里有一个人出生了，他是大文学家苏轼”。


    林语堂却从苏东坡去世5年后开始写：


    当时当权的文臣搞了一块碑，上面有所他的他们认为好臣的名字，这块碑立在了全国各地，还有两块立在了午门外。有â—æ¬¬Ò»天打雷劈开了一块，皇上以为动了天谴，赶紧要求全国敲掉这个石碑。但是没想到“好臣”文人不仅不高兴，反而偷偷地把碑文的碎片收藏回家留念——因为碑上第一个名字，就是苏东坡。


    那么苏东坡是个怎么样的人呢？


