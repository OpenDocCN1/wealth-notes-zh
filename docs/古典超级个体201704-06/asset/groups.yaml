    # 与其被人贴标签，不如为自己设计标签 31-2


    +   1. 什么样的人品牌最容易被别人记住？

    2. 如何设计自己在朋友圈里的标签？


    # —— 一个问题 ——


    你有没有这样的经历：在各种群里“勤奋”地打卡，各种话题都凑过去接上几句，但你依然是群里的小透明；线下各种聚会，你努力表现，但最后你还是被人称作“那个谁”。


    事实上不是你没有价值，而是价值太多不知道从何说起——你需要“削尖”你的价值，刺入别人的心智。


    这个时代注意力稀缺，每个人的大脑都像一块吸满水的海绵：只有挤掉已有的内容，才能吸收新的信息。麦肯锡有着名的电梯法则——假如在电梯里遇到老板，你能在30秒，也就是电梯上升的过程中说明白你在做什么吗？


    如果给你10秒的时间，你能说清楚自己是做什么的吗？


    这个时代，个人品牌实在太大了，最好的切入点是传递极其简单有效的信息——把个人品牌浓缩成个人标签。


    > 定位理论创始人、全球最顶尖的营销战略家艾叶·里斯（Al Ries），在《品牌22律》中说：“品牌应当力争在消费者心智中占据一个词汇。”“收缩焦点，你的品牌会更强大。”


    我们把视线转向体育界——对比阿迪达斯和耐克这两个品牌，你觉得谁的辨识度高？很多人觉得是耐克——一个勾、一句Just Do It；而阿迪达斯，三小块组成一个标志、Impossible
    Is Nothing


    ![](img/25e88d373f85ee6d39d9f51899b4f484_146_0.png)


    但如果镜头给的是大远景转播，你的观点会完全改变——你会分辨出三道杠就是Adidas，而Nike却需要给个近景特写才能看到勾。阿迪在远景中更加清晰——让人们在很远的地方一眼能认出来——这就是“远景识别力”。


    在今天的信息海洋里，我们需要让自己的标签有这种远景识别力。


    当你在夜晚抬头看看星空——你看到无数的小白点。其实每一颗星星都是发着不同颜色的七彩光——蓝色的海洋、红色的岩石、黄色火焰——但是在远处的人看来，这些光线融合在一起，变成毫无特质的白色。还不如只发出一种颜色的红宝石球好识别。


    注意力稀缺的时代，有特色比五颜六色更容易识别。这就是远景识别力。


    # —— 一个策略 ——


    设计一个具有远景识别力的个人标签，让人过目不忘。下面是设计标签的三个建议：


    # 1. 从满足需求开始


    很多书会教你——个人品牌第一步是思考自己是谁？有什么优势？


    这个思路是错误的。今天的竞争围绕需求展开——柯达就是定义自己是胶卷第一品牌，才错过了发展数码摄像机的机会，其实数码摄像和胶卷满足的都是同一个需求。没有放到用户坐标，你不知道自己是谁，也不知道自己的竞争对手是谁，所以优势也无从谈起。


    标签要从“谁能多好地满足谁的哪些需求”开始。如果你你的品牌里面，没有对象，没有需求，那就是一个伪品牌。


    除了满足对方需求，更重要的是也满足自身需求。


    昨天谈到了唐僧的糖糕标签，但有一个好例子——：“及时雨”“孝义黑三郎”宋江。这些标签每个都是江湖人士的大爱。《水浒传》里频繁出现这样的情节：遇到险情，宋江亮出标签——大喊，“我宋江今日休矣！”马上有人跳出来——“莫非你就是山东及时雨宋公明？”然后纷纷便拜。


    # 2. 简洁再简洁


    少就是多，只保留最重要的差异点，其他都删除。


    奥巴马的两次总统竞选的口号都只有一个单词：2008年竞选总统时用的是change——人民需要改变。2012年在连任竞选时，他又用了一个干净利落的词语forward摆脱了竞争对手的死缠烂打——说什么也没用，选民们，咱们继续前进吧。


    # 3. 找到宣传伙伴


    名号定了，你自己说不要紧，关键是意见领袖怎么看。个体影响的人还是有限，关键是如何发动更多人帮你推动。


    诸葛亮26岁成为刘备的军师，而且人家没有工作经验——靠的就是个人品牌运营能力。你看着刘备没见到诸葛亮之前，被高频安利了标签“卧龙”多少次——


    先是庞德公封号为“卧龙”，然后是水镜先生司马徽对刘备说：识时务者在于卧龙。此间自有“伏龙、凤雏”，得一人可得天下……徐庶必瞒投靠曹操，又“回马荐诸葛”，还没见面，标签都放好了——这才为之后的三顾茅庐做好准备。


    如何在朋友圈、社交场合设计一个“满足需求、简单、好传播”的标签？下面三步能帮到你。


    # 第一步，企业标签


    如果你公司特别有名，你就使用：“企业+职位”的标签。


    比如：

    阿里巴巴运营总监XXX，

    腾讯产品经理XXX。


    不公司的公司或品牌，则可以使用业务标签。


    # 第二步，业务标签


    对于大多数人来说，业务是最容易与他人产生链接的，突出业务是最好的标签设计。


