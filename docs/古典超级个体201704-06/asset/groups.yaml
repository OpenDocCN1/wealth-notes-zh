    \n所以很多好的演讲者，在一开始时，就自会邀请大家说：“请大家帮我一个忙，一起做一个小游戏——请大家起立。”结果所有人都起立，这时他大脑就想，“原来我可以控制。”于是再请大家举起左手、右手，这样一来，也没那么紧张了。\n\
