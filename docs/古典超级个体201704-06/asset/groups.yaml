    # 所有人问古典 25-4


    知道《超级个体》满半年，罗胖、脱不花娘娘和各位专栏作者说要联合送份礼物，结果——我收到了一堆问题。


    用他们的话说，对想成为“超级个体”的读者而言，没什么比得干智慧服务他们更好的礼物了。对于这个逻辑，我服。


    篇幅实在有限，所以今天的问答里，我将先一一回复罗振宇、脱不花、刘润、薛兆丰、万维钢老师的提问，相信他们这些刁钻古怪的问题里，应该也能满足你的很多好奇。


    # 罗振宇（罗辑思维、得到App创始人）


    提问：做这个专栏不容易，个人成长这个话题没有成型的教科书，江湖经验也鱼龙混杂，你是如何整合与输出的？


    做这个专栏的确不容易，因为根本就没有一个学科叫做“个人成长”，这个学科的前端是心理学，后端则连着职业发展、投资和创业——毕竟，你要有显性输出，才知道自己成长了啊。这样一个横跨很多领域的知识体系，一下子拿出来讲，大家学不完，专栏定位也失去焦点。


    所以和薛兆丰老师和刘润老师不同，这个领域没有成型的知识地图来一个个讲，《超级个体》使用了一个完全不同的路径——放弃“知识地图”，改成“问题地图”。所谓问题地图就是，我们模拟——一个人从职场初赛选手，到能走到复赛的中高级选手，到底会遇到哪些问题和障碍？这些问题和障碍成为了超级个体的行动路径。


    # 脱不花（罗辑思维联合创始人兼CEO）


    提问：请描述一个在你心中最符合“超级个体”的具体的人。


    在200期的《罗辑思维》视频节目里，我给超级个体下了一个定义——“一专多能零缺陷”“超级抗逆能力”“人生超链接”。


    +   在一个领域精专，理解全价值链，能找到合作者；

    不做评价，疯狂试错，出问题敢认怂，马上调整；

    一旦看到人生超链接，投入专注，跃迁式提升；


    # 刘润（《5分钟商学院》主理人）


    提问：都老朋友了，我就来替大家问点狠的，现在的《超级个体》符合你最开始的设想吗？你觉得《超级个体》最大的缺点是什么？


    哈哈 感谢润总，不愧是顶级企业战略顾问，一针见血——我就喜欢回答这种犀利问题。


    # 薛兆丰（《薛兆丰的北大经济学课》主理人）


    提问：你说“超级个体”就是既强又美的人，“强”好理解，“美”你会怎么解释？


    首先，美是竞争力。


    职业发展的规律，和经济发展类似。强一旦到了某个阶段，边际效应就会递减。（斑门弄斧请见谅，前几天刚从您这里学的。）这个时候，美就成为一种新的竞争力。集中化到一定程度，多样化就会成为…'
  - '[PAGE 28]


    力。集中化到一定程度，多样化就会成为一种竞争力量。前几年我们一窝蜂盖Mall，盖一模一样的住宅，现在下一个热点是文化小镇。


    在一个消费升级的时代，美本身代表着机器所无法复制的复杂系统，是一种竞争力量。


    其次，美是幸福感。


    职业发展搞了半天，还是要回归到个体效用，个体价值判断。在职业中，个体效用什么时候最大？就在“发挥优势和天赋、收获个体价值、满足自我意义”的过程中。所以做你认为美的事，也是符合大自然设计原则——最节能的幸福感。


    最后，美是和谐。


    如果用强作为尺度，世界强者只有很少，越来越少。而用美作为尺度，每个人都有机会在自己世界里获取美。如果比赛谁声音大，只有一人赢，更好的方式是组建个交响乐团。


    美是和谐、美是民主。


    # 万维钢（《万维钢·精英日课》主理人）


    提问：你认为什么是真正聪明的年轻人？


    我深信这一代人真的是会活100岁，甚至有些人会用更加有趣的方式生活，所以请允许我单方面把“年轻人”理解为所有专栏用户吧——毕竟，我们这一群热爱学习的人，无论面对过去的历史，还是即将到来的巨变，都是年轻人。


    我认为真正聪明的人是无知、有趣、互联的。


    无知的人知道自己无知，所以持续学习。他理解和尊重科学精神，愿意质疑一切，也愿意在足够多的证据面前转换观点，他知道自己知道的其实不多，也愿意听其他领域专家的观点。


    有趣的人得特别好玩。他们有强烈的好奇心，有成熟又喜欢掺拔的心智、还有勇敢自嘲的幽默感。探索和理解世界的过程其实常常劳而无功，有趣是进化给予我们的路上的饼干。所以我认为，有趣是一种精神上的“少年感”。只要你还在有趣，你就没有停止发展，没有思想上的衰老。


    互联是聪明人最重要的领悟——个体的努力、天赋很难撼动社会阶层、逆转时代潮流。他们懂得利用社会和群体的力量给自己增加势能。就好像三体里面最厉害的打击，不是两个星球的攻击，而是动用自然伟力。


    他们有工匠精神，也不抗拒买房获利；他们有独立思想，但是也懂得借社会大流；他们有自我探索领域，也懂得进入知识源头的社群互相学习。


    这种聪明的时代年轻人，做点好事不矫情，做点小坏事也不窝心。他们知道极度的善良和极度的精明是一回事。


    我6月底去美国，到时候有空见见吧——你无疑是聪明的，我嘛，我们都是年轻人。哈哈


