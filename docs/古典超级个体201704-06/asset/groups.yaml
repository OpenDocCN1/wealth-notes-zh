    # 用DISC读懂人：如果想领导谁，就要服务谁

    35-3


    35-3 用DISC读懂人：如果...


    +   1. 沟通信噪比：“信噪比”是信号功率和噪音功率的比例。沟通信噪比是指，每个人都有自己的沟通频段，这个频段与每个人的行为风格相符。如果信号不在这个频段内，往往就是噪音。

    2. DISC行为风格：管理者的行为风格可以分成四种：快、慢；关注人、关注事。


    想象有这么一个霸道总裁。开会时，他提出了A方案，可是你有更好的B方案，提出出来，却被当众否定。你会有什么反应？


    主动的人想的是“怎么才能改变这个领导？”。被动的人想的是“好了，那以后你说A，我也不说B了，以后哪怕有想法，也不讲出来了”。


    改变领导的这个思路是没戏的，懊回去也很可惜，浪费了自己的思考时间，也断送了自我展示的机会。


    今天我要给你说一个沟通中最重要的概念“沟通信噪比”，然后告诉你正确影响人的4种方式，以及什么样的人能把性格力量发挥到极致？


    ## 什么是“沟通信噪比”


    信噪比（Signal-to-noise ratio，缩写为SNR或S/N）——信号功率和噪音功率的比例。


    我们调录音机的时候，如果波段没有调对，就会同时收到信号和噪音，听不清楚。这个时候发射功率越大，听起来噪音越大。


    信号就是对方能接受的方式，每个人都有自己的沟通频段，这种频段往往与他的行为风格相符。如果不在这个频段内，往往就是噪音。这就出现了沟通的悖论——你说话，其实对方听到的都是噪音；你以为对方没听见，增大功率，对方觉得噪音太大，干脆关闭了。


    比如，老头儿老太太吵架。在外人看来，老头儿吵翻天了，而且不近情理，老太太却会很平和地告诉你：“别管他，他就这样一人。”这句话的意思是，老太太已经自带了信息过滤器，能过滤老头儿的一切噪音。


    很多沟通中，彼此说了半天，信噪比非常低，谁都没有收到对方的信号。要影响一个人，就要先找到他的频段，主动调频到他的频段。


    如果这个上司注重逻辑，那么在汇报时，最好多用“因为……所以”，然后通过1、2、3的顺序分别出来，最后强调下这个方案的局限性，上司对你的印象一定加分。


    如果对方是视觉型而非听觉型的人，那就清晰地描述画面感，花更多时间做视觉导图和PPT，更能让对方快速get到点。


    每个沟通高手都是快速调频的发布机，“快速调频”的能力来自于对他人行为风格的敏锐感知能力。


    ## 常见的4种管理者风格


    管理者的行为风格可以分成：“快”和“慢”；“关注人”和“关注事”。


    节奏快的，喜欢说话尽快切入重点；节奏慢的，那你先说谈感受，聊聊风月；


    从关注点来说，如果对方关注人，你就跟他说清楚这个决定对他周围的人会产生什么影响……特别是他关心的人；如果对方关注事，就更多地跟他讲这个推论为什么是严谨的，为什么是客观的？为什么是有逻辑？


    一旦你了解到了人们的行为风格，在和人交流的时候，难度就会降低很多：你首先可以给人分类，找到相似之处，提前预测可能性。用对方喜欢的方式，影响他。


    美国心理学家威廉·莫尔顿·马斯顿博士（Dr. William Moulton Marston）根据2个维度，把行为风格分成了四类，发展出来一套管理行为风格理论和测评，叫做DISC。


    霸道总裁是D支配型，他喜欢A方案，更重要的是他说A的时候外向独断，不喜欢别人反对。好的沟通者会先说：“A方案非常好。”（你首先传递——“我懂你”），然后再说，“同时，从另一个角度是这样，B方案是……”（发挥影响力）当然，最后到底怎么做，您说了算。（我真的懂你）”


    你可以通过DISC先给别人调好频，降低了信噪比，才有可能加大沟通音量。


    也许最后领导还是会选A。但不管采纳与否，你都没有损失：你多提供一个信息、你多展示一次自己，你也多练给自己的调频能力——你有能力和机会更深层地影响更多人。


    沟通的时候，一定要记得：懂比爱更重要，先调整频段，再传递信息。


    ## 谁需要主动改变？


    也许有人要问——凭什么是我要变？而不是他要变？


    如果这份关系对你很重要，那么就需要你先调频；如果不重要，你需要找重要的人去影响他。


    沟通的本质，就是交换不同的信息，而不同的信息往往在不同频段的人那里——只要你希望影响更多人，就需要学会调频能力。


    性格有稳定性和可塑性，真正的超级个体是这样的：


    对自己，关注性格可塑性，在发挥优势的前提下，提高自己的掌控范围。对别人，关注性格稳定性，用别人喜欢的方式去影响他，降低自己沟通成本。你的掌控圈就会变大。最糟糕的尺则是你天天盯着自己的稳定性，却期待人家性格的可塑性，这样你的掌控圈就变小。


    这个和产品思维很像——对客户，把他们想象的越傻越好，越懒越好；对自己，思考地越深入越好。这样你的内在价值越来越高、你的交际界面越来越好，你就是一个高价值产品。


    精于心、简于型——超级个体是人群中的战斗机。


    今天我们提到了一个概念：“沟通信噪比”。理解了信噪比我们就知道，沟通的关键是快速调频。


    这两天我们理解了性格的概念，提到了MBTI的性格分类，DISC的行为风格分类，当这些概念越来越清晰，可能另外一些概念就会越来越模糊。到真是环境决定命运、性格决定命运，还是选择决定命运呢？


