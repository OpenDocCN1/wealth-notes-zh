    # 心理越位：获得健康人际关系的底层规则 36-2


    36-2 心理越位：获得健康...


    - 1. 心理越位：当心理边界不清晰，就容易越界，有时候是我们走出去，有时候是别人走进来。

    2. 健康的心理边界应该是清晰，有弹性的。


    昨天我们讲了，每个人都有自己的心理边界。但是当我们的边界不清晰，就容易越界，有时候是我们走出去，有时候是别人走进来——这种状况，我们就叫心理越位。


    越位最早是足球术语、在足球比赛里，一旦球员越位，进的球都不算。心理越位也是一样——如果你跨越了别人的边界，你的一片好心一点都不过好，自己还一肚子委屈。更加可怕的是，大部分人都意识不到自己的行为越位了，这又让误会越来越深。理解心理越位，是建立自信和健康关系中最重要、最底层的规则之一。


    下面给你介绍最常见的4种心理越位的情况。当你开始识别这些概念的瞬间，你就开始跳出误会，理解问题的本质。


    # 第一种，不尊重别人的边界，经常控制别人，主动出击型越位。


    有一位女孩，老公是销售主管，长得帅，业务还比较多，手下女同事又都年轻貌美。她很警惕，走到哪里见到哪里。每去一个地方，都要求对方发照片看看和谁在一起，还要发定位，随时知道对方在干嘛。每天都要翻自己老公的微信记录，看看是不是和女同事有问题。时间一长，老公烦恼一个问题。


    “我出不出轨，成本是一样的嘛！”终于有一天，再跟女同事倾诉苦闷的情结时，跟一个同事好了起来。


    不是同情这位男同学啊——问题出在心理越位，这是一种变现的控制，就好像手里的沙子一样，越使劲越握不住。很多管理者希望控制过度，时时刻刻予每一员做事——时间一长，有能力的人会走；没能力的人会更加焦虑，更加需要你来帮助。


    越位进入别人的边界，短期也许会让你获得掌控感，长期却是個双输的事。


    # 第二种，不尊重自己的边界，跨越自己的边界，导致完美主义。


    有心理边界的人有一个重要的特点，就是清晰地知道自己的局限性。但如果你的心理边界有一个洞，从内向外看，你则认为这个洞外面的空间都是自己的掌控区。事情“应该”是这样，别人“应该”这么想，而自己“应该”控制自己范围内的所有事，但实际上，你无法控制，又什么都做不来。这个时候，他就会产生一种强大的“无所不能的无能感”——觉得什么事情都应该“那样”，可是所有事情都不听话。


    完美主义就是把自己掌控区投射到所有外界的空间的典型症状，是过度自恋的表现——他们的生活充满“应该”的细节，偏偏自己的精力又无法顾及所有——就像把照片投射到墙上，并且认为墙应该发生改变，其实墙不会有什么变化——所以他们干脆什么都不做。


    他们构想了一切外界的“应该”，却自己就是做不出来，是不是“无所不能的无能”呢？


    # 第三种，因为心理边界不清，导致局面失控。


    我们时常能看到明星因为在社交媒体说错话被大家攻击，或者很多人在社交网站骂公司，被公司开除。当事人往往非要委屈——我只是在自己微博上、朋友圈说了句话，怎么了？


    这也是心理边界的原因——社交网络其实是个大广场，你认为在自己边界内，是自己的日记本，其实你的言论是在公众视线之内。如果要承受社交网络带来的好处，也就同时需要对这些言论负责。在社交网络时代，我们也许需要重新界定自己网络身份的真实边界。


    # 第四种，心理边界过于僵硬。


    但是不是我们就要死守边界，无比有原则呢？过于严格的边界也是麻烦事儿——叫做边界僵硬。


    以前有一个新闻：外企新来的实习生被吩咐去买盒饭。实习生鞠了回去——我来实习的，不是去买盒饭的。那么，实习包括做工作以外的事情吗？


    从心理边界的角度看，这些年轻的实习生是边界太僵硬了。老员工因为很熟悉，所以并不介意团队要求他们做做略微越界但是不算过分的事情——加班、开会、赶工时，有人帮忙买盒饭也是一种节省时间、提高效率的方式，所以在很多团队里属于可接受的模糊地带。但是实习生认为，工作内容就是他们写在纸上的那些。除此不愿意多做一小步，其实这也失去了更多的机会——因为公司里的传帮带也是边界模糊的，可以多教一点，也可以少教一点，他的僵硬导致别人的僵硬，可能最后吃亏的还是自己。


    边界僵硬，就是和别人分得足够清，以至于到了固执的地步。这种人听不进去别人的意见，过分坚持不必要的原则，拒绝一切人情世故。


    我有一个朋友，每次别人送他东西，他都会在淘宝上查完价格，然后一模一样的价格回送一个，送礼物的人发自好心，却总觉得被羞辱了。于是朋友越来越少。自己也没有谈过恋爱——亲密关系的核心，就是恰当的柔软的边界啊。


    # 总结一下今天的内容：


    今天我们讲了4种心理越位的情况，其实最好的方式是建立一个清晰，有弹性的心理边界。


    不妨把自己想象成一座房子，既有独立空间，也有待客的客厅，既不会完全关门不让人进来，也不会一上来就把人往卧室带；既耐得住寂寞，也有谈得来的朋友，既能帮助别人，也能接受人的帮助；既亲近，也独立。


    建立一个清晰、明确、健康的心理边界，专注自己能控制的，放手自己不能控制的，是心智成熟之路。


    ### —— 今日思考题 ——


    你有没有发现，往往越是亲近的人，越容易互相越位。今天学习了心理越位的概念，你有没有发现你身边的越位现象？欢迎你在留言区分享你的故事。


    如果心理边界出了问题，应该如何重建和修复？


    ![](img/25e88d373f85ee6d39d9f51899b4f484_196_0.png)


    防止心理越位：建立一个清晰、健康、有弹性的心理边界，专注自己能控制的，放手自己不能控制的，是心智成熟之路。


