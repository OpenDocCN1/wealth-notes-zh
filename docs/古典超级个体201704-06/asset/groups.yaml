    ## 阳志平：卡片，开始写作的最好方法 26-6


    ![](img/25e88d373f85ee6d39d9f51899b4f484_70_0.png)


    古典


    ## 超体们：


    这周我请到安人心智集团董事长沙、 “认知写作学” 的开创者阳志平老师做大家的 “特约成长导师”。在武侠世界里，绝顶高手内力雄厚，能够做到 “拍花摘叶皆可伤人”。阳老就是这样的高手，本文讲的
    “卡片” 则是花与叶——卡片虽小，背后却有伟大人物实践和深邃的认知科学理论作为支撑。本文不但小中见大，而且易于操作，读来特别有启发！强烈推荐。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_70_1.png)


    无话可说、不知从何说起，是很多人写作的 “拦路虎”。现在我和你分享一种简单到马上就能用的方法——卡片。这是纳博科夫、钱钟书等超一流作家都曾践行的 “最小行动”；也是我和
    “认知写作课” 的同学们反复实践的超级方法。在开智的世界中，一切皆可卡片。


    ### —— 卡片 ——


    如果要评选一位二十世纪最伟大的作家，纳博科夫必然当选。他是那类作家中的作家，才华横溢，公认的文体大家。同样，如果要评选一位二十世纪最热爱卡片的作家，非纳博科夫莫属。


    就是这样一位超一流作家，在一生中为数不多的几次采访里，毫不掩饰自己对卡片的偏爱：


    > BBC 电视台（1962）

    BBC：您怎样进行写作？您的创作方法是什么？

    纳博科夫：我现在发现索引卡片真的是进行写作的绝佳纸张，我并不从开头写起，一章接一章地写到结尾。我只是对画面上的空白进行填充，完成我脑海中相当清晰的拼图玩具，这儿取出一块，那儿取出
    quoi，拼出一角天空，再拼出山水景物，再拼出……我不知道，也许是喝得醉醺醺的猎手。


    不仅纳博科夫热爱卡片，钱钟书也是如此。


    与钱同时代的夏承焘，1948年在《天风阁学词日记》中写道：“阅钱钟书《谈艺录》，博文强识，殊堪爱佩。但疑其书乃积卡片而成，取证稠叠，无优游不迫之致。近人著书每多此病。”


    夏承焘批评钱钟书著作，积累卡片而成，这是不懂钱钟书治学取向与写作背后的认知科学原理。钱钟书善于从笔记小说、诗词中取证据与正典映照。他的笔记从来断断续续，不注重所谓思维体系，更注重鲜活证据，一生积累卡片或读书笔记近十万张。


    东海西海，心理 ；南学北学，道术未裂。《管锥编》作为二十世纪人文巅峰之作，也可以将其理解为从数万张卡片中精挑细选而成的目录书。今日世人只知钱钟书，当时瞧不上卡片写作的一代词宗夏承焘却已无人听闻，侧面验证了钱钟书的观点：体系会随时间而崩溃，鲜活证据却永存世间。


    ### —— 原理 ——


    纳博科夫们这类超一流作家为什么偏爱使用卡片来写作？卡片写作背后的认知科学原理是什么？我们主要从写作的基本流程来梳理：阅读、写作与修改。


    ### 首先，用卡片来组织阅读心得，能帮助你更好地记忆。


    这里，需要介绍认知科学的原理：必要难度。以

    前，人们的常识以为，记得越快学习效果越好（存储越容易，提取就会越快）。但是近年以来，最新实验发现了与常识相反的结论：存储与提取呈负相关。


    也就是说，存入记忆容易，提取出来会不容易；反之，如果你有些吃力地存入，那么，提取会更牢。比如，我们的常识是要在课堂上记笔记。但是，必要难度原理建议，别在课堂上记笔记，老师边讲边记笔记，你会听得太明白，写入太容易，但是大脑那块硬盘未来会不易提取出来。反之，如果我们略微增加一下写入难度，比如晚上回到宿舍或者第二天再写笔记，这样未来提取会更容易。也就是，你有些困难地存入，会记得更好并真正学会。


    钱钟书、纳博科夫这类超一流作家，无不是通过自我修炼，无意中掌握了必要难度原理，所以，他们往往不会当时写笔记，而是隔几个小时，再回去默读读书笔记或者写日记。


    ### 其次，用卡片来写作能够帮助你改善创意密度。


    这是善用大脑特点。一般作家是摊开一个长长的Word文档，纳博科夫眼前则是一堆小卡片。同样的心力，前者会将分失散到三千字上，后者集中在更少内容上，创意密度更大，所以纳博科夫的文章常常妙语连珠。


    作家拖稿，举世公认。如果作家启动写作的思路有“我要写一本书”与“我要写好一张卡片”。两者的认知负荷大不一样，后者更容易打破行为痼疾，避免写作拖延。


    ### 最后，基于卡片修改文章，能够改善你远距联想能力。


    当你将作家理解为建筑师，你就明白：为何每次盖房子，比起从水泥等粗活干起，直接用预制材料来搭房子会更快更稳。


    我们的大脑，一方面先天具备填空的模式处理能力，当看到一幅未完成的、缺了一条边的正方形，我们会试图补上；然而另一方面，创造性却


    能力。


    当你将作家理解为建筑师，你就明白：为何每次盖房子，比起从水泥等粗活干起，直接用预制材料来搭房子会更快更稳。


    我们的大脑，一方面先天具备粗糙的模式处理能力，当看到一幅未完成的、缺了一条边的正方形，我们会试图补上；然而另一方面，创作性却常在于远距联想能力。好作家应当创作前所未有的阅读体验。所以大脑的模式处理能力与创意需要的远距联想能力，构成了写作的基本矛盾。


    当纳博科夫修改稿件时，他会打乱不同卡片的顺序，来玩一个以卡片为基础的拼图游戏，而常人修改稿件时，还是在一个词汇、一个句子地修改。相对一般写作者来说，纳博科夫们从词汇到卡片，再一次，激发了远距联想能力的可能性。


    所有上述认知科学原理：必要难度、创意密度与远距联想能力，都反映了认知科学的一个基本原理：组块。什么是组块？在认知科学中，为了方便记忆，我们把一些需要记忆的东西加以分类或加工使其成为一个小的整体，就称之为组块。


    卡片就是相对传统写作的“词汇”、“段落”来说，更大、更便于记忆、更有意义的一个组块。对它来进行记忆、创作与修改，而非对最原始的词汇进行记忆、创作与修改，是超一流作家普遍掌握的写作秘笈。


    相对纳博科夫和钱钟书的时代，如今变化的是写作的外在条件。我们今天较少使用纸笔书写，但是卡片背后的认知科学原理没有变化。


    ### ——推荐——


    介绍几种卡片及其使用方法：


    ### 一、使用经典纸质卡片


    纳博科夫和钱钟书用的就是这种。你可以先从记听课或读书笔记开始练习：首先摒弃原来“抄书”以及用电脑记笔记的习惯；而是把专注力更多放在听上或读上，只记录少许线索或关键点。更多内容，可在6-12小时之后，通过回忆进行丰富，把它组织成自己的语言。


    比如，网上有一种叫做“Index Cards 索引卡”的卡片，大小比较合适，保存时间也较长。


    ### 二、用Notes来保存写作素材


    在移动互联网时代之前，很多写手都有一个自己的本子，用于记录一些心得；在移动互联网时代，这个本子被手机端上的各类笔记软件取代。我习惯使用的是Mac自带的Notes。你可以将素材、灵感与资料，保存到Notes里面。


    大量阅读、积累素材是写作的必经阶段。随着阅读量的提升，能够看见自己的成长。具体而言，你可以积累什么样的素材？观点、论据、作者联系观点与论据的巧妙方式、各类好的拟喻。


    ### 三、善用写作软件的卡片模式


    当我们正式写作时，可以采用Scrivener的卡片模式，这是一款松上春树等作家普遍喜欢的专业写作软件。遗憾的是，Scrivener是十年前的产物，不支持移动端，且不支持Markdown格式。


    因此，2015年10月开始，我与一群小伙伴自造了一个卡片软件：开智学堂APP。在开智世界中，一切皆卡片。它也许是历史上第一款将卡片用到极致的软件。在开智学堂APP中，你可以通过卡片的方式来学习；从开智学堂APP的3.1.35版本开始，同样，它也支持你在开智部落中创建自己的卡片。


    艺术无非是制作一种形式，将生命装在里面；作家无非是创作一个世界，用自己的规则来搭建。有些作家搭建世界时，习惯从一个又一个俗词开始；有些作家则习惯拼接一张又一张卡片。俗词是概念、套话、み话；卡片则是印象、情绪、生命。


