    # “好玩的事”与“重要的事”究竟那个重要？

    32-1


    - 1. 工作压力好大，感觉任何娱乐对我来说都是在浪费时间，如何破解这种焦虑？

    - 2. 为什么“会玩儿”的人总是人缘那么好？


    32-1 “好玩的事”与“重…


    我们平时日夜盼着放假，但真的给你几天假期，很多人会发现自己“玩无能”。下班后瘫在沙发上追剧，假期睡两天懒觉，看到别人发来的照片，觉得自己又白过了。


    其实每个人还是孩子的时候，都是玩的专家——和自己手指头都能玩一下午的人，随着逐渐长大，玩变成一件越来越奢侈、越来越充满负罪感的事。“作业都没有做完，还玩呢！”但是人生的作业实在是太多——所以越来越多的人出现“玩无能”的状态。


    一方面有负罪感，一方面实在不知道玩什么。


    《正念》这本书里提到，忙碌的时候，我们就会放弃一些事，把火力集中在“重要”的事情上，最先被放弃的往往是最能滋养身心的，比如运动、聚会。如果压力还在，我们就进一步放弃，生活圈进一步缩小……最后你进入到一堆工作漏洞的底部，身心俱疲。


    作者乔·卡巴金（Jon Kabat-Zinn）解释说，其实顺序正好相反，是更快乐才会更成功。快乐的工作者，业绩平均高出37%，生产力高出31%，创意高出300%，决策力高出19%。


    高手们不仅是人生赢家，同时还是人生玩家。“微信之父”张小龙是围棋、网球高手；小米的黎万强办过摄影作品展；特斯拉CEO马斯克特别喜欢玩《守望先锋》和《炉石传说》。据《科学》杂志2009年的报道，接受其调查的CEO、CFO及其他高管中，有61%的人每天都在工作休息时玩游戏。


    玩，是一件被我们严重低估的事。下面我分享三个理由，告诉你为什么开始学习玩是件重要的事。


    # 1.玩让你未来更加卓越（Excellence）


    进化心理学家一直对动物界的“玩”感到费解：生物进化的一个重要方向，就是为了“节能”；可是玩却是一件成本很高的事情：不仅消耗体力，还有受伤的风险。但是所有的动物都会玩，证明玩一定有巨大的进化优势，才会被保留下来。


    后来，他们发现动物不能玩的原因：游戏往往模仿成年的生存主题，玩是生存的预演。在非洲大草原上，作为捕食者，小狮子的主要游戏就是奔跑、跳跃，以及彼此追逐、撕咬——在玩耍的同时，学习如何捕杀猎物。幼年鹿和斑马的游戏则是跑和跳，获得速度和敏捷性，用来逃避狮子等食肉动物的捕杀。人类的少女这家家，男孩子打架，都是对于未来的社会角色做预演。很多企业家都有小时候“小打小闹”做买卖的经验，玩是一种典型的“生存预演”。越是高级的动物，玩越是一种刚需。人类甚至会在食物不足的情况下，也会玩。


    玩儿是生存预演，会让你未来越来越卓越。


    # 2. 玩让你成为社交高手（Experience）


    很多人没有意识到——英文中，玩和戏剧是同一个单词（Play）。戏剧是一种人们之间角色扮演的互动，而文学、电影则是一种间接的角色扮演，通过一种方式，进入别人的生命感受一下——文学和艺术都是重要的玩的方式。有多少人是在爱情电视剧里学会的恋爱？有多少人是在名人传记里上的人生第一课？


    我们在这类玩中体验到别人的内心情感、体验到不同世界的人、不同时代的人过的生活，玩让我们发展出“共情”的能力，这种能力是社交、管理、谈判的最重要的技能。


    玩是天然的关系润滑剂——生活中有个“坏男人”悖论——虽然女人明知道是不可靠的，但她们还总容易被“坏男人”吸引。因为动心的感觉，就是一件亲密加安全感交织的情绪。好男人太安全但不亲密，臭流氓光亲密不安全。而“坏男人”懂得在关键时候绕过你的安全防线，偶尔丢一两句特别亲密的话，在你还没有来得及反应的时侯，又重新回到安全防线。这种“调情”的能力，就是“玩”的能力。所有领域的社交高手、管理高手，都有一种把控对方情绪的能力——这些都是在大量的玩中体验而来。


    彼得·德鲁克看得很清楚——他研究了20世纪50年代大学的所有课程，发现对于培养管理者最重要的课程是两门：小说写作和诗歌鉴赏。小说写作培养对人性的洞察力，而诗歌则让人用有想象力的方式影响他人。


    # 3. 玩能打开人生可能性（Possibility）


    加拿大心理学家塞尔吉奥·佩里斯（Sergio Pellis）发现，玩对于发展大脑的好奇心和探索功能很有帮助。


    科学家对两组老鼠进行实验：一组幼年时期便开始玩耍；另一组则被禁止玩耍。成年后拿充满毒气的顶圈来吓唬它们。结果被禁止玩耍的老鼠逃跑后不再敢出现，躲在角落直到饿死；而另一群正常的老鼠，则在小心探索周遭，确认没有危险之后，再度现身。这个实验表明，一旦剥夺玩耍的权利，动物将失去探索能力。


    我们身边的现象就是“好学生的困境”。为什么很多传统教育的“好学生”，毕业后反而不如那些会玩的同学过得好。在玩耍中，我们一次次的尝试、越过边界、失败，慢慢找到了探险和冒险的边界。有这种能力的人，他的好奇心才不会致命——有好奇心也有探索力，会一次次地打开更多的人生可能性。


    想象一下硅谷的创业者，不管是乔布斯的车库文化，还是 Facebook 的试验性网站，他们的第一步都是一个不商业的试验品，是玩儿的产物，但是他们又能持续做成商业，不会让自己死掉。这都是小时候玩够了的状态。


    玩可以让人在未来的竞争中更加卓越（Excellence），更好地体验他人（Experience），以及探索更多可能（Possibility），简单说——玩能积累未来的经验值（EXP），会玩是未来的核心竞争力。


    玩有这么多好处，那么到底从何玩起呢？我 在本文的最后，给你做了一个“玩乐百宝箱”，推荐了好玩的App、一本书，以及一些有趣的方式。


    你不如从“惊喜电影”开始试着看：我们以往都是选好了电影，才去影院，这次不妨倒过来——先和朋友约好见面时间（比如晚7点），到影院之后碰到哪个电影就看哪个。这样一来，你可能可以看…


