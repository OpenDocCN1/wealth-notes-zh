    # 问答 | 没什么东西可写，怎么办？ 26-4


    今天为你解答这 5 个问题：


    左 * 左：最大的困扰就是没有什么可写。有时候想法一闪而过，等有很强的表达欲望时，却没有合适的词语能表达出自己内心所感，这种情况真的好无力。


    古典


    这个提问，可以说是本周的“问题之最”——从后台刷爆的留言来看，大多数人都有这个写作困扰，所以优先来回答这个问题。


    任何一个人只要用心去挖掘和观察，都一定有东西可写。因为写作的关键是要有自己的体验、感悟和观点。可能有观点会有一点难，但体验和感悟完全是基于你个人生活的。正因为你是一个与众不同的独立个体，全世界70多亿人，也找不到第二个和你一样的，所以你也一定能产生不一样的思想出来，只需要你——仔细地去体验。


    如果你实在觉得自己的体验和感悟不够好，不妨去看看别人的，先从别人的观点起步——可以写读后感、观后感，因为电影、书籍、文章都是别人生命的感悟和观点，看完后至少可以让你在观点层面有话说。


    除此之外，我还建议你去 创造一些与众不同的经历，体验一些与众不同的生活以及读一些一般人看不到的东西，比如说全世界人都在看《人民的名义》，那你又能写到什么地方去呢？你发现真正把《人民的名义》写得有力道的人，他平时就对自己的生活很有感悟，他只是从自己多年的观察角度出发去诠释了这部电视剧。


    所以，跟风的人的确写不出什么好内容，因为你的体验是一样的，思考也是一样的。要创造一些与众不同的体验，思考一些与众不同的观点，看一些大众不会看的书，这些都可以让你有东西可写。


    这三点加起来，任何人都会有东西可写。


    时间之树：写作时，最大的困扰是不知道写什么，写着写着就写不下去了，对自己写的东西不满意，无法把脑海中所思考的内容清晰、准确地输出成文字……


    古典


    很多时候，你以为写作是要全部想清楚才一点点铺陈出去的。其实不是，是需要把你的思绪慢慢地铺在一张纸上，让它们互相产生作用。


    你有没有看过《哈利·波特》，那里有一个“冥想盆”，邓布利多校长会从脑子里抽出一些思绪扔到盆里，然后慢慢显出一个形状，这其实就是一个典型的写作的隐喻。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_61_0.png)


    你可以把脑子里的想法铺陈在纸上，这些想法之间自然会出新东西。这些想法之间呈现什么关系，可以结合知识晶体（见文章22-2）那篇来学。还可以借鉴一个学员的践行做法——把10个专栏学到的知识和概念，找张白纸都写下来，然后用笔罗列、划线、搭建，就能有不少新东西可写了。


    还有，在写的时候千万不要持续的评价文字——这是一个特别糟糕的习惯，一旦开始自我评价，那今就很难写出来了。因为你内存有限，无法既从作者又从读者的观点去看，很多时候甚至不是读者，还想着从同行的角度去评价，那谁都做不好。


    写作就全心全意从一个表达者的角度去表达——不要跳到同行评价者和读者的角度去评价。


    吴见丰：写作真的是我现在最重要的事情吗？到底还有没有更重要的事情？我能不能把更多时间用在学习专业知识上，用在刻意练习提高我的专业能力上呢？


    古典


    这个问题问得非常好，仅仅因为你问了这个问题，我就应该给你一个大精进，送你一本签名书。


    为什么呢？因为你终于可以跳出问题来看问题，这就是功利读书法和功利写作法。


    我认为：并不一定每个人都要立马去写作。每个人在当下都有很多重要的事情，我在周一时讲到了写作的3个重要功能：1. 帮助自己认识自己；2. 帮助自己思维升级；3.
    帮助自己创造影响力。


    如果你在“认识自己”上有更好的方式，比如说你会跳舞、会分析、或者会用思维导图整理思绪，那么也不必写作。


    再比如你在“创造影响力”方面有更巧的方式，比如把一件事做好，那么完全没有必要非通过写作，谁说写作是扩大影响力最好和唯一途径？不一定。你看这个时代最NB的几个人，马云、雷军、张小龙都很小写作，马化腾更是从来都不写。


    他们都在用自己的时间和生命去打磨一个作品，但没必要非是写作这种方式，他们的影响力也一点不比别人小——做任何事情之前都需要跳出来思考一下——这个东西是潮流，还是我真的需要做？


