    # 董如峰：如何判断自己是不是“病态焦虑”？

    34-6


    古典


    这周成长导师，我邀请到了资深心理咨询师董如峰老师。董老师是情商高手，也是组织心理专家，十多年来，一直在个人心理健康管理、压力管理等领域耕耘细作。


    这周聊情绪，从大家的留言来看，我注意到焦虑这种情绪是最多的。所以超级个体的同学们就着这个话题，访谈了董老师。董老师说：焦虑不是坏事，它是来帮你解决问题.....下面是我与董老师的对谈，推荐给你。试试看，看完还焦虑吗？


    ![](img/25e88d373f85ee6d39d9f51899b4f484_180_0.png)


    古典


    这个时代，我们有太多让我们焦虑的事情了：知识学不完，焦虑；薪资不高，焦虑；年龄越来越大，焦虑；周围人关系不好，焦虑；甚至过个节日，都焦虑。这些焦虑，究其原因都是怎么产生的呢？


    焦虑是大脑一种对抗潜在性危机的积极行为，是一种自我保护机制，当我们某些需求没有满足时，大脑就会启动这个机制，表现出焦虑不安。


    例如，我们都有这三种需求：链接别人、影响别人、保持影响力的需求。


    当我们无法与别人保持有效关系时，会焦虑——孤独焦虑；

    当我们对别人、对社会没有价值，没有产生影响力时，也会焦虑——价值焦虑；

    当我们无法持久地保持我们的影响力时，也会焦虑——阶级焦虑。


    估计这些焦虑你或多或少都会有点，但也不用特别担心，因为孤独焦虑+价值焦虑+阶级焦虑合起来属于“存在性焦虑”，人人都会有，也无法彻底解决，或许只有宗教可以吧。


    但对于焦虑的认识还是有必要的。弗洛伊德把焦虑分成两种：“现实性焦虑”和“病态焦虑”。前者是指在现实中因遇到威胁或挑战引发的焦虑，比如明天要演讲、后天要见男朋友的父母，这种焦虑是动力，可以让我们集中精力，提高效率。


    但是一旦你过于焦虑了，就要觉察这背后在告诉我们什么信息了，可能是缺乏目标、或者能力不够，或者是太累了要放松等等。当现实中的威胁解除，焦虑也会随之消失，甚至一身轻松。


    但如果问题解决之后，你还焦虑，或者焦虑的情绪远远超过问题的严重程度，近而出现一些生理反应（心悸气短什么的）导致我们无法应对。这个就是病态焦虑，需要寻求专业人士的帮助了。


    古典


    董老师，我之前专栏讲“拖延症”时，提到大家对此有误解，其实拖延不是症。那么对于“焦虑”，有没有常被大众误解的地方？


    严格来说，焦虑并没有具体对象，只是一种内在的不安感。一旦有了具体的对象，我们就将其称为恐惧。反过来说恐惧一般都伴有焦虑，所以焦虑经常是一种伴发情绪。


    还有一种误解是，我们习惯用医生的视角而不是艺术家的视角去看待焦虑。在医生的视角里焦虑是病，至少是个问题。在艺术家的视角里，他们把焦虑当作一种跳动的美——当作在没有任何目标和方向感，以及任何可控因素时候的一种混沌态。他们认为焦虑在提醒我们活着的状态，提醒我们生命正充满了各种可能。


    我们没必要这么文艺和浪漫，但是我们至少应该知道焦虑给了我们一个信号，它在激发我们的动力。就算是我们焦虑得严重了，不能正常工作了，那么焦虑也是在提醒我们休息，避免受到更大的伤害。


    说白了——焦虑是我们解决问题的一种方式。它在提醒你有一个问题要解决：“报告主人，终于发现了一个问题，就是它，快来解决”。虽然这种方式是无意识下的选择，可能还会有更好的解决方式，但要相信在当下这就是最好的。


    古典


    焦虑是一种没有具体对象的恐惧，这个观点很有意思，那是不是有具体对象后，能减轻焦虑？


    是的，说白了焦虑就是一种没有具体指向的内在体验。当我们把这种内在体验和一个具体事物结合起来时，就有问题可想，有事情可做。


    所以缓解焦虑，比较有效的一个方法是设置一个小目标。把注意力转移到怎么实现目标上，分散焦虑。而且它还有一个伴随的好处是，我们可以在众多碎屑的工作和计划中，依据目标来做判断、选择——什么对我们是重要的、什么是不重要的。混乱让我们焦虑，而这种秩序感能让我们感到可控、安全和放松。


    古典


    我们超级个体的朋友很多也是有目标的，可就是因为完不成而焦虑。除了再设置个小目标，他还可以做些什么呢？


    经过上面对于焦虑的解释，估计大家都能想到适合自己的一些方法。虽然我们心理咨询师一般也会和大家分享各类方法。但不代表大家自己的办法不对或不好，最好的解决方法是在不断地体验、尝试中发现的。


    - （1）正确的认识焦虑：这是基础。“知己知彼，百战不殆”，一个让你困扰的东西，你得先明白它是长什么样子的，才会放下“对焦虑的焦虑”。我们要意识到焦虑是来帮你解决问题的，提醒它的主人要注意些什么了。你需要的就是识别焦虑背后的问题，解决它。

    （2）提升和自己目标相关的技能。多在和目标相关的领域深耕，会缓解我们的现实焦虑。当出现问题的时候，我们已经做到有备无患、有放矢了。

    （3）适当增加娱乐和放松的时间。就算我们准备得再完备，也难免有释放不掉的焦虑。严格来说焦虑不可能完全消失。所以我们要把工作和休息娱乐时间安排好，让身心都能放松。而且多度的紧张会引发焦虑，当焦虑到一定程度时，会影响我们的认知功能和情感功能，这时反而不能提高我们的效率，所以说会干的人一定会玩是有道理的。

    （4）调整自己一些非理性的认知。例如：非黑即白、灾难性的预期等等，大家可以看看这方面的书籍，推荐：《理性情绪疗法》。


    古典


    有时我们状态不好、感到很烦，但不一定是焦虑。有没有办法让我们更能看懂自己是什么情绪？


    首先我们先要意识到自己有情绪，这个对大家来讲不难。

    但是如果要清楚地说出自己现在处在什么情绪状态？这对很多朋友来说，就有些难度了。


    推荐方法前，先考虑“超级个体”的同学：一分钟之内，你能想到几个表达情绪的词？


    学：一分钟之内，你能想到几个表达情绪的词语？愤怒、开心、沮丧、焦虑……除了这几个答案，你还能说出更多吗？


    提心吊胆、牵肠挂肚、坐立不安、欣喜若狂、胸有成竹……还有吗？其实中国人不大善于表达情绪，是由于我们对情绪的变化把握不细。


    心理学认为，人对情绪的感知越敏锐，自控能力越强。如果你能够清晰地标定自己的情绪，你的情绪管理能力会提高30%。


    情绪也分级别，其实幸福可以分为低、中、高三等，激动也是。情不自禁、心潮澎湃、百感交集，这些都是激动的不同层次。对应不同的级别，我们可以形成自己的情绪卡片：把令人舒服的情绪词标黄，不舒服的标灰，中性的标蓝。平时多多对照，感受自己情绪的变化。


