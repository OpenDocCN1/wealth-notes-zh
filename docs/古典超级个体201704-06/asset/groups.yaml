    接下来就是“三改”。


    +   1. 一些用词错误，一些词不达意，一些段落太长或太短影响结构，这是第一改，改得是“信”——准确表达你的意思。

    2. 然后放一段时间，等自己脱离作者身份，回到读者角度来阅读；或者请别人读，给你意见，你又会发现很多文气不通，很多表达难易高低不一，很多东西你说得太多，其实没什么用；有一些则说得不够——这是第二改，改得是“达”——这些东西有没有能够传达？

    3. 给文章排版加粗、给一些词作润色，放大减少一些情绪点，甚至配个图片，这是第三改，改得是“雅”——有没有足够高雅地表达？


    “信达雅”是清末严复在《天演论》里提出的翻译标准，我把它作为我写文的修改三问。


    # —— 破解3个写作困境 ——


    不过我知道即使写到这，也还有人动不了笔。


    根据我的观察，大部分的障碍来自于小时候糟糕的写作训练——回想一下你过去的写作体验——首先你被分到一个极其无聊，明显是常识，或者搞不好你还不认同的理念，比如我小时候写到吐的“为什么雷锋精神不过时”，然后你被要求在课堂上写出来，没有翻书、查资料，而且你也不需要观点，因为明显有正确的观点，你只需要往上靠就好了。最后因为时间精力问题，你检查一遍，改掉几个错别字，但是不可能对于文章的整体结构有什么改变哎。


    这个糟糕的写作训练，造成了你今天所有的困惑——


    +   不知道写什么，觉得没什么值得写；

    写了又写不下去；

    好不容易写出来，觉得就是信息的堆砌，没有自己的特色。


    # 1.不知道写什么


    不知道写什么 是找不到特别想表述的观点和想法。其实一开始希望自己有什么惊世骇俗的想法很难，不妨找到好的观点，结合自己的体验转述出来。所以，不妨尝试从“最近学到的一个好观点”或者“最近看过的一本书、影评教我的……”开始动手。


    选择系列主题也是很好的方式，比如说“访谈100个有趣的人”，“拆解20个名人成功之路”，“讲20部豆瓣高分电影”都是很好的选题。


    记得，写你最有表达欲的东西。


    # 2.写不下去


    写不下去的一个主要原因在于很多人对于写作的想象是类似文学家式的“文章本天成，妙手偶得之”这种，稍一思考，落笔一气呵成。


    其实，很少有认知类、影响类的文章是这样写就的。专业的作者全部都是使用科研论文的写作方式——先列出大纲和分问题（5问），然后寻找资料，把所有的素材堆在一个文档里面，最后一个个问题和板块拼起来，是用编的方式在写作。


    更好的作者懂得平时积累卡片，关键时候直接拼上去。


    记得，不要希望一气呵成写文章，从编写开始。


    # 3.没有自己的观点


    80%的人写文只有知识点，却缺乏观点。要知道，在一个很多知识都能网上找到的时代，不仅需要你做知识的搬运工，我们更期待听听你自己的观点。所以在文章中清晰表达出你的观点非常重要。


    记得，从写文章角度，固执的偏见都比平庸的和稀泥好。


