    # 生涯顾问日 | 如何把笑声卖到一百万？ 35-5


    35-5 生涯顾问日 | 如何把...


    ## 古典


    超级个体的小时伙伴们。我想给专栏做一次升级，并且从上周开始，我们已经正式进入试运营阶段。具体的专栏更新方式可以查看文末的提示。


    最重要的是，每周五我都会找到一位超级个体的学员困惑，并且帮助学员解决这个问题。


    周五生涯顾问日——让思考联机，让发展跃迁。


    张春豹是《超级个体》的学员，非典型九零后，以前在企业担任销售管理的职位，一直在听《超级个体》的专栏，希望找到自我。前段时间网络视频《吐槽大会》爆火，他迷上了脱口秀，拿着自己打磨的段子，参加了北京最大的脱口秀俱乐部，反响还不错！


    恰逢内容创业热潮来临，他又开始思考，自己做脱口秀演员是不太可能了，但是有没有可能做一个关于幽默的产品，把笑声也卖到一百万？


    于是，他找到了我来咨询。


    下面是我给张春豹的具体建议，对你也有参考意义：


    很多人创业从一个好点子出发，开始跟很多人聊，这时大家都会给你一些零零碎碎的想法和建议。几周以后，你就会收集到一堆的奇思妙想——刚开始，这种说话大开脑洞非常有益，越到后面你会越茫——好像每个点都非常不错，但是每个点都好像离你很远。


    这种迷茫来自缺乏有效的思考路径：很多人的思考模式是混乱的——


    +   现在内容产品能赚钱，所以要做内容；

    做什么好呢？我觉得幽默很受欢迎啊，那就做幽默吧；

    怎么有优势？要多看书，多学习，多认识人；

    谁在和我竞争？哇，没有竞争耶！我发现了一片大蓝海！


    每天这种想法冒出来，兴奋极了。但是第二天有人又告诉你，你这个想法有漏洞，于是又掉入深渊。所有创业者都经历过这个阶段。


    创业之所以难，因为他必须同时满足有客户价值、有商业模式、有竞争力和有相对优势。缺少一个，这个模式都不能成立——这就像打开一个共享单车的密码。你必须四个数字一组同时按照顺序从左到右都对，才有可能打开。如果错了一个，或者顺序不对，这个锁就没法打开，事就做不顺。


    而别人的建议往往是他自己打开的共享单车的某一位置密码，这样的零散想法你收集得再多，也没法打开任何一个单车，因为你缺乏结构化的思考。其实创业者刚开始最缺乏的，不是建议，而是一个清晰的思考框架和一个简单的着力点。


    ## 项目成立的4个步骤


    我给他列出了一个项目成立的4个步骤：


    +   1. 客户价值：到底给谁提供了什么价值？

    2. 商业模式：这些价值怎么变现？

    3. 核心优势：如果做得通，有什么关键优势？

    4. 竞争力：谁会和你竞争？


    这四条有自己的内在逻辑——


    +   从价值出发，对客户有价值才做得出价值来，这叫客户价值；

    做得出价值才能变现，这是商业模式；

    只有有优势资源才能把模式落地，这叫核心优势；

    只有看到了真金白银才有人和你竞争，这就需要思考核心竞争力。


    咋一看上去，幽默好像挺有价值——可以帮忙小编提高点赞率啊、可以帮主播赚钱啊、可以帮你撩妹啊、可以帮销售卖东西啊、还能够表演啊、医生如果会幽默，会不会手术也更高效率？——帮助太多
    了，而且这些领域都没有人做！一想就兴奋——发现了一片巨大的蓝海！


    其实幽默只是一个“学科知识”，只有真正回归到场景上去，才会引发真正的需求——你问一个人，“你需要幽默吗？”他肯定说需要，但是你说给我五块钱我让你幽默，他就不愿意了。所以，付费是检验需求最好的动力。比如说帮忙小编提高点赞率，也许真的可以，但是小编愿意交费吗？你怎么知道哪一部分是你的功劳呢？这些需求都是伪需求。


    真正的客户价值需要回到场景去：


    +   想看幽默的表演——相声、脱口秀、开心麻花；

    幽默的文字——网络段子手、写手；

    幽默的微信公众 号——各种“段子来了”；

    幽默的视频——冷笑话；

    幽默的电影——周星驰。


    如果你轻松的认为自己遇到了一个蓝海，你最好思考一下，是不是自己没有看到“场景”这个限制条件？一旦回到场景，你发现哪儿是蓝海，分别是血红的红海，只是你原来忘记摘下偏光镜，看不到场景。


    仅仅培训一个人变得幽默，却不告诉他使用情形的内容产品，其实没有真正的价值——这就是大部分培训、内容产品看起来很有趣，一旦收费，人就走光的原因。你的价值仅限新鲜，并没有提供客户价值。


    业化的领域。


    查理芒格说，如果我知道自己会死在哪里，我就永远不去。创业也是一样，思想上躲过这些坑，至少你会提高50%的成功率。


    张春豹同学准备用幽默来为企业创造营销价值，如果有足够好的产品，他的脱口秀同学们会成为重大资源，而如果笑声营销可以切入，能延伸的领域有很多——笑声文案、幽默菜单、逗比指示牌……


    当然，这条路还有很多问题要解决，但是记得这四步，尤其要记得客户价值场景化，就会慢慢走通的。他未来的计划是准备带着自己的脱口秀去给很多企业提供欢乐，同时推广自己的服务。


    我想，有一天，他真的能把笑声卖到一百万。


    ## 生涯顾问日 | 让思考联机，让发展跃迁


    如果你有个人发展上的困惑，欢迎你向我发出求助讯号：


