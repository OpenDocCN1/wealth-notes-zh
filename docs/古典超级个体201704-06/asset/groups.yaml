    # 母亲节特辑｜女人28，生产、生活还是生娃？（加餐）


    ![](img/25e88d373f85ee6d39d9f51899b4f484_134_0.png)


    古典


    今天是母亲节，首先祝“超级个体”里所有的妈妈、准妈妈们节日快乐。


    另外，我要送给那些正犹豫着是否当个妈妈的育龄期女性一篇线上。


    这是我以前给一本杂志写的特稿，今天分享给你，希望你能有所收获。


    ## 女人28，生产、生活还是生娃？


    下午三点的寒冬，在北京一家咖啡馆窗边呆着，阳光从左上方斜照进来，很温暖。


    旁边有一群女子在聊天。


    “我就是要做好现在这份工作，然后出国读MBA，然后回国在投行做几年，最后就开个这样的咖啡厅。”——其中一个人眼中发光，发表着自己的梦想宣言。


    朋友们听了一片哗然——这样的生活有谁不向往？


    大概一分钟以后，有一个女子幽幽地吐槽，“那你到35岁之前都生不了孩子了。”


    ……


    人群安静了。过了几分钟，这个问题迅速变成了如何找个好男人，以及做女人真难之类的。又过了几分钟，问题又变成了“你知道吗？谁谁和谁谁好上了。”


    其实他们不知道，他们刚刚错过了一个重要的生活问题——“生 vs”是 一门讨论我们该如何过日子的学问。我是一个生活规划师，我正在电脑上敲出来的题目，与他们的梦想息息相关——女人二十八，生产、生活还是生娃？


    如果你是年龄在24-30之间的女性，我想你总会遇到这种困境：从进入职场到24岁，你刚刚摸到门路，知道自己要做什么。从25到28岁开始发力，事业小有成就，前面蕴藏着无限可能。同时你发现自己将近30，爸妈每天一个电话说，人生最后一桩心愿就是，趁身体给孩子。或者你的闺蜜则每天恐吓你说高龄产妇有多痛苦。


    ——继续职业发展？还是生个孩子？


    假设你选择结婚生子——你与相恋多年的男友结婚生子，在女伴羡慕的眼光中离开职场，当你的幸福妈妈。3年后你拖着微微发福的身材重回职场，才发现自己被当年一起入职的同事落下一大截，而当年那个跟你斗法的小妖精，也成为了你的上级。你气不气？


    另一个可能版本——那个你痛恨的，当年选择了抉择直上的小妖精。30岁正好是她职业的最后一段长跑。她咬牙又冲了5年，终于在安全生育的最后期限决定孕育一个孩子。于是，35岁的她在医院里成为最活跃的一坤，医生每天帮着计算流产的概率是多少——未来，还有经历更多大龄孕妇会遇到的麻烦，比如，很难恢复的身材，与孩子的代沟等等。而这一切才刚刚开始。


    又或者你喜欢那种绝代佳人的版本——在最好的年华里，做一个独立、智慧的女性走遍世界，激扬青春，经历生命的种种可能，却错过了生儿育女的年纪。在六七十岁的时候，孤零零一个人，在花园里翻着相片，看看邻居家嬉闹的孩子发呆。


    你喜欢哪一个版本？


    按照生活的观点，我们生命的发展方式有4个维度：高度、温度、宽度和深度。女人近30，生孩子的人选择了宽度，让自己人生角色更加丰富。选择工作的人选择了高度和深度，让自己的职场地位更高；而选择做丁克的人则选择了温度，过最自在的生活。


    你选择哪一个？


    根据“生活的总能量守恒”规律，你会发现，其实并没有最完美的那个选项——选了高度或深度，就必然降低宽度和温度，反之亦然。


    当你追求一样的时候，另外一样一定会减少。所以另一种选择的方式是，按照你最受不了的程度来，你最不能忍受的生活方式是什么——当年华老去，你最不能容忍的，到底是碌碌无为？还是孤苦伶仃？还是苍白无奇？毕竟我们很多时候不是不够爱一种生活，而是受不了他的反面。


    最后我想你也发现，生产、生活还是生娃并不是一个女性的决定，而是一个家庭的决定——你们的家庭希望先扩充哪个维度？你的另一半能够弥补哪个维度？我 enlight
    广大哥们儿，千万别手一挥说，“什么时候生孩子？你说了算！”其实生娃、养娃，包括孩子妈的职业发展，全与你相关。


    所以你要先选择自己最喜欢的选项，再选择自己最受不了的选项，两者的交集就是最适合你的选择——请注意，世上虽没有最完美的选择，但有最糟糕的选择，那就是不选择。


    其实这个话题还有很多可以探讨的，比如怀孕前后是否真的需要远离职场那么久？养大一个孩子是否真的需要传说中的300万（如果这个标准是真的，中国光按照出生率算GDP就能超美国）？再比如，产后妈妈适当地工作，是不是会更加利于孩子的成长？这也都是生活讨论的问题，不过我一介男子，既没有生产动机，也没有生产工具，这些理论显然是“站着说话不腰疼”，所以，还是留给专家们说去吧。


    重要的一点是，我想，每个人都能选择按照自己喜欢的方式来生活。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_134_1.png)


    # 预告 | 什么是真正重要的人脉？ 29-7


    下周开始，我们将进入人脉管理学习周。我们会重点讨论下面几个问题：


    ## 1. 什么是真正重要的人脉？


    假如今天你遇到了一件能力范围以外的事，你会怎么解决？是自己闷头找方法，还是拿起电话找人帮忙？如果找人的话，你会找谁？如果那个人能够帮你，他为什么愿意帮你？


    我们每个人都需要很多朋友，但能帮到我们的朋友有多少？


    很多人为了有更多朋友，天天参加活动、合影、递名片、加微信，甚至还因为通讯录上有牛人的电话而自豪。可事实上，他们真的是你的人脉吗？什么才是真正的人脉？


    ## 2. 怎么才能搞定比你牛的人，甚至是大牛？


    有个法则说，如果你想知道这个人有多优秀，看看他最常接触的三个人的平均水平就可以了。


    为了提升自己，我们都希望能和大牛做朋友，但怎么才能认识大牛呢？面对大牛时，总感觉我有无数的事情可能求到他，但他好像没什么需要我帮忙的，这种情况我该怎么办？


    ## 3. 怎么通过人脉快速地学习、提升？


    生活中，我们总能看到有些人喜欢默默地憋大招，问他们为什么，他们说，只有我变得足够优秀了，才能链接到更强的人，进入更高的阶层。


    相反，还有一些人，他们也会努力学习，但能力到达某个层次后，就出去跟人互动，结交比他更优秀的人，然后带着信息再回来学习、提升，达到某个层次后再换好的圈子，如此循环，不断攀升。


    这是两种对待人脉的不同方式，那究竟如何利用人脉，才能帮助自己学得更快呢？你更适合哪一种呢？


    你先想想，我们下周聊。


    古典


    特约成长导师预告：


    下周的成长导师，我们请来了隔壁订阅专栏《5分钟商学院》的主理人——刘润。


    刘润是中国最贵的商业顾问之一，润米咨询CEO，前微软公司的战略合作总监，担任海尔、百度、恒基、中远等众多大企业的战略顾问。每周末，他都会邀请一位著名公司的CEO或者负责人，担任他专栏的客座教授。


    很多人好奇刘润老师是怎么积累人脉的，他说，他从来不认为去论坛换名片就能成为人脉，真正的人脉不是能帮你的人，而是你能帮他的人。


    下一周我们请他来具体分享一下，他究竟是如何经营人脉的。


