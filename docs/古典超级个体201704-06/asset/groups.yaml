    # 心理边界：理解这个概念，你可以“掌控”一切 36-1


    36-1 心理边界：理解这个...


    +   1. 心理边界：指个人所创造的边界。通过这个边界，我们可以知道什么是合理的、安全和被允许的行为，以及当别人越界的时候，自己该如何回应。

    2. 正确地利用心理边界：放手不可控的部分，专注于可控的部分。


    上周我们讨论了情绪、性格、特质、优势，其实这几个关键词都应该在前面加一个“我 的”，但是“自我”到底是什么？如何定义自己和外界？这就需要你了解一个重要的概念，“心理边界”。这是心理学中一个头号元素。心理边界是一个容纳了所有心理元素的容器。在这个边界的外面是外部世界，里面的，就是自我。


    # 生活中的你，有没有遇到过以下几种情况？


    总是被要求做这样做那样，结果耽误了自己的事情。


    用自己的方式努力对别人好，但常常不被领情。


    为了迁就别人，常常放弃自己的想法。


    替别人操心、总是在想他“应该”这么做，“应该”那么做。


    特别在意别人的看法，在别人的评价中判断自己。


    如果你有上述困惑，你一定要了解一下自己的心理边界。东方人普遍对心理边界很不陌生。假如你回到家，发现有人闯进你家里，要把电视抢走，你的第一反应肯定是要把他赶出去；但当一个人指揮你做左做右或者恶语相加时，你却可能选择忍耐或顺从。你发现没有——我们对物理边界、经济边界非常敏感、但是对于“心理边界”非常模糊。


    心理边界也被称为“个人边界”，维基百科这样定义“个人边界”（Personal boundaries）是指个人所创造的边界，通过这个边界，我们可以知道什么是合理的安全和被允许的行为，以及当别人越界的时候，自己该如何回应。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_195_0.png)


    心理边界是为了区分在内世界和外界世界。通过心理边界，你可以知道什么是合理的安全和被允许行为，以及当别人越界时，你该如何回应。


    心理边界就好像围绕你的自我画的一个圈。心理边界最重要的目标不是区分自己和别人，而是区分在内世界和外界世界。在圈里的在内世界，每个问题都有解，可以掌控。在圈外的在外世界，问题都不一定可控。无论是个
    人发展、家庭、婚姻、政治、经济、文化，总有一部分在你的控制内，有一部分在你的控制范围外。区分这两者的，就是心理边界。


    比如说，你身材比较胖，而别人总嘲笑你的身材。胖是你可以通过逐渐控制的、如何面对这个嘲笑也是你可以控制的，但是别人嘲笑的行为是你没法控制的。如果你不喜欢被嘲笑，可以选择减肥，也可以选择离开这群人，这都是可控的。


    一个能掌控人生的人，一定要有 一个清晰、健康的心理边界，这样当你面对问题的时候，一切都会有解——知道什么能控制，什么不能控制，放手不能控制的，专注于能控制的部分。为什么说“一
    一切”都有解？因为放弃也是某种解决方案。所以，只要有边界，一切都有解。


    接下来我们看看心理边界出了问题会怎样。


    # 第一种情况，如果心理边界有了 一个洞，你就会“受苦” Suffering。


    宗教、哲学、心理学都在讨论受苦这个事件，每个流派都有不同的解释。但是有一个解释是共通的——受苦就是把情绪投射到你无法控制的事情之上。也就是投射在你的边界以外了。比如说，当你把情绪投射到别人的嘲笑上时，你就开始“受苦”了。


    如果你心理边界上就有了洞，谁都可以从 洞里走过来侵扰你，生活就开始失控，你就开始受苦。


    # 第二种情况，心理边界不清的人，也不易尊重别人的心理边界，往往会让他人很痛苦。


    总结一下今天的内容：


    心理边界是一个人的掌控圈、是一个人自我的边界、也是一个人自信的根源。如果你的边界有洞，要么自己痛苦，要么跟你相处的人痛苦。最终成为一个失控的人。


    在今天这个每个人都在讨论自我、讨论如何做自己的时代，先搞清楚自己的心理边界，修补自己边界上的洞，变得更加重要。


    当有人跨越了你的心理边界（心理越位），你应该怎么应对？


    # —— 今日思考题 ——


    你的自信常常在哪些领域流失？那是因为你把情绪投射到什么不可控的事情之上？


    在这件事情里，可控的边界在哪里？


    欢迎在留言区分享你的看法。


