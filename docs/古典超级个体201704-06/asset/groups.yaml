    \n神话学大师约瑟夫·坎贝尔在研究全世界各地的神话系统时，发现了被称为“英雄之旅”的故事原型：\n\n+ 有一个人，他过着宁静的生活；\n有一天，他踏上一段旅程，遇到朋友，也遇到敌人；\n\
