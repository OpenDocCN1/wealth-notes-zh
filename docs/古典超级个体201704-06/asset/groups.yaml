    # “玩家”，绝顶高手才能享有的尊称 32-4


    在讲游戏力主题的这一周里，毫不出意外 的，我收到了很多超体们发来的困惑和质 疑：


    +   1. 古典老师，我今天想来唱唱反调，生 活中不是一直在强调什么克制懒惰、战 胜拖延、抵制诱惑，玩游戏，它是一种 浪费时间的事情，我们好不容易用各种
    习惯打败了他，现在我们又要重新去找 回他，人生岂不是又回到了起点吗？


    +   2. 玩游戏特别特别容易上瘾，一旦上瘾 的话，玩游戏的利也就变成了弊，比如 我身边就有特别爱玩英雄联盟、斗地主 的人，这个怎么破？


    +   3. 自从下载“得到”之后，感觉已经没 有心 catast和时间玩游戏了，所以现在最困 扰我的问题是：如何在游戏和工作，学 习之间取得平衡，或者说我应该安排多
    少的时间在游戏上面比较合适？


    +   4. 古典老师，我之前了解到的是，人的 状态大致可分为，舒适区，学习区，恐 懈区三个区间，学习不是一项很轻松的 事情，在舒适区是学习不到有用知识 的。今天，您说要有一
    q种玩的心态，是 否和学习区有冲突呢？或者是从另外一 个角度来理解这个事情呢？


    大部分人对于“玩”的误解，是把玩等同 于于游戏、斗地主。但我们本周讲 的“玩”不是具体指某项活动，而只 是“一1种状态”。真正高效能的玩，是 Playful，而不是Play；是游戏化而不是游
    戏。玩家不是天天在玩，而是用玩儿的状 态来做事。


    # 玩，是大自然赋予的心理调节机制


    正是因为重复练习和研究探索都是非常痛 苦的事，大自然才赋予了我们一个抵抗这 种痛苦和焦虑的心理机制——“玩”。


    心流就是最好的证据之一（心流：在全 身心投入某事的一种心理状态。人在处 于这种情境时，往往不愿被打扰，抗拒中 断），当你进入心流通道，体验到一 种“忘记时间流逝、全然专注、灵感源源
    不断”的状态，你也就自然放下对于不确 定的恐惧，获得最高绩效。


    # 玩，是调整注意力分配的策略


    人的注意力带宽是有限的，如果你一方面 要克制自己内心的冲突，一方面又要应对 挑战区的uny，等到内外受敌，很难达到 高水平。更好的状态就是“playful”地去
    做一件事情，在一个高难度的区域用玩的 心态，内松外紧是最好的竞技状态。


    当我们准备看一本又长又枯燥的书时，往往 会先挑逗下自己玩的神经——试试看，一 小时内能不能看完100页？能不能挑出10 个金句？这些小游戏都会让我们特别享受，
    避开了读书本身的痛苦。


    霍金也是个这比。他常常就一些重要的学 术问题和别人打赌，比如他跟物理学家索 恩的三场赌局——


    +   第一次输了，他赔给索恩一年的《阁楼》 杂志（这是什么杂志这这种纯洁的人根本 听不懂）；


    +   第二次输了，他又赔给人家一件写着“自 然请灭裸奇点”的T恤；


    +   第三次又输了，陪给人家一本《极球百科 全书》


    这种玩的心态背后是对於学术的较真，输 赢不是关键，找到真相等是目的。你在很 多世界顶级的高手身上，都能找到这种“ Playful”的状态，很多科技公司的CEO
    在接受采访时，都会反复提到高手身上 的“大男孩”气质，本质上那就是一种玩 儿的状态。


