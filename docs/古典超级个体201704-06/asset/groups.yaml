    古典


    特约成长导师：毛泡泡


    这几年有一个非常有意思的职业越来越受年轻人欢迎，称为“视觉引导师”，通俗点说就是图像同声传译，把声音画出来。我的好朋友毛泡泡就是中国图像引导的先行者。全球从事这样小众职业的人不到300人，而她是目前全球能用3种语言图像同传，且出场费用最高的一位。


    毛泡泡在职业初期并非从事这一行，她是决心从事服装设计，但在26岁那年她被确诊患有阅读障碍症。心理医生对她说：“恭喜，上帝为你打开了另一扇窗。”于是她从这扇窗出发，向另一片天地走去。


    泡泡总说：“一定要把生命浪费在美好的事物上。”所以她带着画笔跑遍了全世界，去各地参会、游玩，还曾用画笔帮客栈画菜单，并因此获得免单。


    本周我邀请她带着画笔来到《超级个体》，做我们的成长导师。如果你有什么问题，在留言区告诉我，我替你转问。


    今天是古典陪伴你成长的第 201 天，一起加速，成长为更好的自己。


