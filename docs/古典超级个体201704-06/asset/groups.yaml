    # 特约成长导师：陆晓娅


    在策划这期“清明特别节目”的时候，我找到了我的心灵导师之一：陆晓娅老师做联合策划。


    陆老师自称“斜杠老年”——我很少见到像陆老师这样充满活力的老人。


    陆晓娅老师曾是中国青年报高级编辑、“青春热线”的创办者。退休后，她旅行，讲课，写书，做电台，创办服务留守儿童的公益组织“歌路营”，也是“北京生前预嘱推广协会”理事……整天忙得不亦乐乎。我们见面采访的时候，她正兴致勃勃地准备学英语，准备出国学习。


    所以，陆老师现在的身份是：心理人/教育人/读书人/写作人/公益人——很“斜杠”吧。


    2012年开始，陆老师在北京师范大学开设《影像中的生死学》公共选修课。她说：“直面人生中负向存在的人，才能真正体验到生命的美好，因为美好不是别人赐予的，而是在面对困难、挑战、丧失、孤独中体验和创造出来的。”


    这也是我们策划这期“清明特别节目”的诉求：通过直视生死，带着更清醒、丰富的视角重返生活。


    你可以通过她的个人新浪博客“陆晓娅的博客”或者《影像中的生死学》获得她的更多思想。


    # 如何尊严和安宁地离去？


    ![](img/25e88d373f85ee6d39d9f51899b4f484_5_0.png)


    因为尊重生命，尊重当事人一定要让当事人立个生前预嘱，把知情权和选择安宁疗护，把知情的选择权交给大家自己。


