    我个人有个准则，想做的事情，不违法不有违道德一定要去做。不要去依赖宗教告诉自己来生去做，也不要养一个孩子让ta去做。我所能把握的，就是眼前一分一秒组成的一生。


    “想死而生”的第一期罗辑思维视频，为我打开了如此一扇门，直至今天与古典老师和朋友们在此相会、讨论到直视骄阳的话题，真的十分感激、十分开心。


    ## 陆晓娅：“斜杠老年”的日常 24-6


    古典


    超体们：


    这周我请到我的心灵导师、《影像中的生死课》的作者陆晓娅做大家“特约成长导师”。不过，这次我没有请陆老师解答问题，而是向你推荐我个人特别喜欢的陆老师写于2016年年底的一篇文章。


    2016，陆老师写书，讲课，旅行，思考……紧锣密鼓，精彩纷呈。如果遮去文中那些明显提示年龄的信息，你很难想象这是一位年过六旬的老人的生活。

    而这正符合这周我们研读“生死”的目的——不是要征服死亡，而是为了提醒你过好此生，好好活。陆老师用“斜杠老年”的非典型老年生活，为我们做了一个特别好的表率。非常精彩！


    ![](img/25e88d373f85ee6d39d9f51899b4f484_13_0.png)


    每年的最后一天，我都会用文字来梳理人生的这一年，坚持30年有余，但从没想过用一个字来概括。


    这次参与“一个字概括自己的2016”这个游戏，我告诉自己说，还是信赖自己的潜意识吧，就用第一个跳出来的字。


    结果，蹦出来是个“实”字。


    ## 实


    把字儿写在纸上，一看，“头”上一个宝盖，欢喜！到了这个年龄，脑袋上还有宝贝，真是要感恩呢。


    “实”，最先联想到的是果实。2016年，真的有一颗果实呢，那就是写作、出版了我的第四本书《影像中的生死课》。

    这本书对于我有很特别的意义，因为写完它，我看着觉得自己的死亡焦虑减少了一大块——我爹60出头就去世了，他未完成的第四部书的书稿成了“遗物”。而我，终于活过了他的寿数，完成了自己的第四部书稿，可以告慰他的在天之灵，也可以告慰我自己。


    写这本书不仅是“完成”，还有“发现”。它让我重新发现了写作的乐趣——每天上午，打开电脑，在时光的流逝中，文字一点点排满一页文档，然后又是一页。文字落下之时，宁静踏实的感觉在心里渐渐升起。我知道了，即便将来走不动了，我还可以通过文字与这个世界联结。


    ## 廎


    “实”的繁体字是“實”，据说造字的本意是柜子里藏宝贝，说明很富有。在小篆中，那个宝盖头是长长的，拽拉下来把宝贝盖住的，发展到了隶书，宝盖头就缩上去了，下面那个“貫”的一横居然一左一右伸出了宝盖头，好像不希望自己变成个守财奴。嗯，这也像我。


    ## 實


    2016年，在热心人的张罗下，我做了五次“影像中的生死学教学工作坊”，参加的高校老师逾二百人。他们当中坚持完成三天学习的，都免费得到了我的全部教学资料。现在，开课者有之，申请开课者有之，结合自己学校学生的特点研发相似课程者有之。当我的宝贝不再仅仅属于我的时候，那“貝”字的两只脚一定会走得更远。


    ## 实


    再看草书的“实”，像不像一个戴着帽子、背着背包、甩着胳膊、大步行走的人呢？2016年，我先后和高一虹、郭军两位朋友游历中东欧。布拉格的烤猪肘、格但斯克的海鲜汤、维也纳的音乐会、弗罗茨瓦夫的小矮人，中世纪小城CK、塔林、托伦，都是极为美好的记忆。


    但我也无法忽视美丽大地上那些战争、屠杀、迫害痕迹，有时是特意去看，如特莱津和奥斯维辛；有时它们冷不丁出现在眼前，如格但斯克小旅舍中被纳粹屠杀者的铅牌、维尔纽斯咖啡馆外的犹太隔离区标志、克拉科夫犹太墓地上密集出现的相同的去世年份、华沙战场教堂地下室里的卡廷死难者遗物……


    我忽然感觉，我是一个不能对苦难转过头去的人，我的旅行也许就是不断地寻找与遨迥，追求人类文明演化中的种种迷团。是不是可以慢慢再写一本人文旅行笔记呢？


    2016，再见！2017，你好！


