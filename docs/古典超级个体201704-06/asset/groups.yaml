    # MBTI：性格分类工具


    今天给大家介绍一种世界上最流行的性格分类工具：MBTI


    MBTI是以瑞典心理学家荣格的理论为起点。荣格是心理学界响当当的元老级人物——他刚出道便成为弗洛伊德指定的精神分析流派的第二代传人，但是荣格渐行渐远，建立了自己的流派。今天我们常说的“情结”“原型”都是他提出的。


    荣格还首次提出了人脑的四大功能：感知、直觉、情感和逻辑判断。后来，在这个基础上，一对母女心理学家凯瑟（Katharine Cook Briggs）和伊莎贝尔（Isabel
    Briggs Myers）又增加了2个维度。最后变成了4个维度、每个维度2个倾向。如此一来，每个人的性格都能用4个代码表示，分成了16种人格。MBTI的MB就是对这对母女名字的缩写（Myer-Biggs）。


    MBTI理论比较庞大，我们今天先介绍两个维度，谈谈我们是如何使用能量的。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_186_0.png)


    # 如何区分内向和外向


    大部分人都误解了外向（Extrovert）和内向（Introvert）。


    外向和内向是被误解最多的性格倾向。外向并不是话痨，内向也不是羞涩。外向指从与外界接触中吸取能量，而内向指更多从自我接触中吸取能量。如果用电池来对比，外向型的人是太阳能的，吸收外界注意力充电；内向型的人是插座型的，自己独处的时候，插上插座，给自己充电。


