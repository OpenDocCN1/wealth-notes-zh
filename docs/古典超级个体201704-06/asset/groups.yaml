    比如，明星的传播期很短，很快就会消散；富翁和科学家停留的时间稍长一点；而一个原本默默无闻的农夫，可能由于他的老家变成了一个旅游景点，他的名字莫名其妙被安插进了一个传奇故事中，结果天天被人传颂。


    理查·道金斯在《自私的基因》中创造了一个词 “Meme” 弥母——对应基因（Gene）的造词——来形容文化、观念的传承。他认为 科学家和文化是思想的X和Y基因，通过大脑之间的传承和变异流传。


    人类到了这个阶段，肉体的进化早就接近停滞，但是心智的进化一直在发生。所以，通过文化基因的传承角度看，我们也能不朽。


    今天很多人用iPhone——这手机里面难道就没有发现电磁场的法拉第，没有发明iPhone的乔布斯的灵魂吗？今天你用独特的方式创造了价值——你不 necessarily
    是上市公司的老板、不必是诺贝尔奖得主，哪怕是一个独特的表达、一个巧妙的设计、一个智慧的看法、一个关键时刻的挺身而出——都可能成为某一种 “Meme”，带着你独特的文化基因，流传下去，就可以超越死亡。


    人是可以通过创造有价值的东西变得不朽的，要做值得留下来的东西。


    生命短暂、脆弱、渺小，如果看明白了这一切，我们自然也会理解三种超越死亡的方式——繁衍后代、贡献社会价值、以自己独特的方式过一生。


    最好的超越死亡的方式，就是把此生活成天堂。


    # 科幻小说家阿西莫夫曾经写过一个小故事，叫《死后的人生》——


    几个月前我做了一个极为清晰的梦 (我通常是不记得自己的梦的)， 我梦见自己死后去了天堂。我往四周看了看，明白自己在那里了——绿色的田野，羊毛般的云彩，芬芳的空气，远远传来的令人迷醉的天乐。
    记录天使 (recording angel) 带着灿烂的笑容和我打招呼。 我惊讶地问道：“这里是天堂吗？” 记录天使回答说：“是的。” 我说 (醒来后回想时，我为自己的诚实而自豪):
    “那肯定搞错了，我不属于这里，我是无神论者。” “没有搞错，”记录天使回答说。 “但作为一个无神论者，我怎么可能符合资格？” 记录天使严肃地说：“是我们决定谁有资格，而不是你。”
    “明白了，”我说道。我向周围看了看，又想了片刻，然后问记录天使：“这里有打字机可以让我用吗？” 对我来说这个梦的意义是很明显的。我心目中的天堂是写作，我已经在天堂里生活了半个多世纪，而且我自始至终都知道这一点。


    阿西莫夫的梦想就是写作，他这一辈子写了480多本书，“一直梦想着自己能在工作中死去，脸埋在键盘上，鼻子夹在打字键中”。


    直到他在世，他都一直活在天堂里。


    美国著名天文学家、科普作家卡尔·萨根在悼念阿西莫夫时说：“我们永远也无法知晓，究竟有多少第一线的科学家由于读了阿西莫夫的某一本书，某一篇文章，或某一个小故事而触发了灵感；也无法知晓有多少普通的公民因同样的原因而对科学事业寄予深情……''


    其实，我本人就是其中一个。


    写到最后，我把自己也写明白了，


    最好的超越死亡的方式，就是把此生活成天堂。


