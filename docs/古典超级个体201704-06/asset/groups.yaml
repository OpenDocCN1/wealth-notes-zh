    理查·道金斯在《自私的基因》中创造了一个词 “Meme” 弥母——对应基因（Gene）的造词——来形容文化、观念的传承。他认为 科学家和文化是思想的基因，通过大脑之间的传承和变异流传。


    人类到了这个阶段，肉体的进化早就接近停滞，但是心智的进化一直在发生。所以，通过文化基因的传承角度看，我们也能不朽。


    今天很多人用iPhone——这手机里面难道就没有发现电磁场的法拉第，没有发明iPhone的乔布斯的灵魂吗？今天你用独特的方式创造了价值——你不 necessarily
    是上市公司的老板、不必是诺贝尔奖得主，哪怕是一个独特的表达、一个巧妙的设计、一个智慧的看法、一个关键时刻的挺身而出——都可能成为某一种 “Meme”，带着你独特的文化基因，流传下去，就可以超越死亡。


