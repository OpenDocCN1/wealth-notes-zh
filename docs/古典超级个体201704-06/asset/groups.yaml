    # 7.演讲的包装：设计好的开头和结尾


    # 开头三板斧


    +   哽一下：带个惊喜。

    哈一下：有个段子。

    嗯一下：让听众说出有一两句内心有共鸣的话。


    实在没有出彩的开头，就用“开门见山法”——“今天我想说一件事，这件事对大家的意义是……它分成下面三点……”


    # 结尾三板斧


    +   重复：重复观点。

    升华：升华到更高的层面和世界，像《阿甘正传》里面的羽毛，从一个人手里飘起来，升高，升高，然后看到整个世界和未来。

    指示：给观众一个清晰的指令。


    ![](img/25e88d373f85ee6d39d9f51899b4f484_98_0.png)


    心理学家发现，体验的记忆由两个因素决定：高峰时（无论是正向还是负向的）与结束时的感觉，这就是峰终定律。


    # 8.战胜自己，超越恐惧


    恐惧人人都有，不要抵抗，关键是尽快度过。


    5种方法帮你越过恐惧：


    +   1. 想件轻松的事。

    2. 想象个喜欢的场景。

    3. 找肯定的眼神。

    4. 讲段子。

    5. 主动控制。


