    # 3. 七步成故事法——怎样设计一个好情节。


    目标、障碍、努力、挫败、意外、转弯、胜利。


    更加复杂的故事，可能是2-3条线的转折。比如说《霸王别姬》的主线是程蝶衣和段小楼的关系，但是还渗透着袁四爷、戏班子成员、菊仙等人的个体命运，最后又带出一个时代群像——这都是高级用法。


    重要的是，你也可以用更好的方式解读自己的人生状态。


    # 4.故事里的英雄之旅——人类的冒险经历。


    走出舒适区，遇到更多朋友，改变世界。


    每个人的成长故事都是极其类似的，其实都是一个走出舒适圈，链接新圈子，然后经历磨难，最后升级回归初心的过程。


    故事即生活，故事是浓缩的生活，生活是真实的故事。


