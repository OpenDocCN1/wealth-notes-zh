    来自 落落：虽然我还没有管理团队这方面的经验，但是我在宁老师今天这篇文章里面看到了，成本管理中，第一步老师说的理想团队其实就是标准成本，最后一栏的实际情况就是实际成本，往上调整的那个就是去除实际成本中分析出来的不合理成本，尽量向标准成本靠拢，然后根据我们自己制定的各项指标求出成本。


