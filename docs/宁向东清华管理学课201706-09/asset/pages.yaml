  md: '# 004讲:识别机会窗口 | 借势破局


    ![](img/e9c4ead90d162cb22377bd13386f3198_8_0.png)


    004讲:识别机会窗口 | 借...


    你好，欢迎来到《宁向东的清华管理学课》。


    前面讲破局的时候，不知道你有没有留意，之所以是“破局”而不是道，就是因为我们 有目标。其实每个人心中都都有一个目标，有 的目标小一点，近一点；有人的目标大
    一点，远一点。但是，无论大小、远近，很 多目标靠我自身的的力量是无法达到的。这 就是我今天要和分享的内容：要善于借势 破局，做到事半功倍。


    在管理学上，“势”叫做机会。中国人常 讲“顺势而为”，就是指要有效地利用和把 握“机会”。今天，我要和你分享3点内 容。


    +   1. 我们为什么必须要借势？


    2. 我们如何借势？


    3. 我们如何把握趋势？


    # 1、为什么必须学会借势


    首先，我要申明的是，我不否认努力，很多 人会借势和自身努力对立起来，但我个人 认为自身的努力属于资源准备，是必须要做 好的功课，跟借不借势没关系。有一句话叫
    做：没有人可以随便随便成功，这一点我同 意，没有人再同意了。但我要讲的是，同样的 资源，如果配合上不同的外部环境，也就是 不同的趋势，你是逆流而上，还是顺势而
    为，结果相差太远了。这一点，无需多说。


    早年我用功力的时候，曾经看过《新概念英 语》的一篇课文，现在分享给你。文章中有 的，信鹰编著太平船，会跟着一些 小的信天翁。信天翁编船飞行，有时飞就 是一小时，但你几乎看不到它们扇动一下
    翅膀。这是为什么呢？原来这些信天翁是借 助信鹰本体来乘风的，蓄着翔来飞越浩瀚 的太平洋。如果信天翁不懂得借势，它们 根本无法坚持那么长距离的飞行。


    文章给出了另外一个例子，鸥鸽鸟。鸽鸟，是完全靠着自己的肌肉，挥展着翅膀飞 行的，所以我们很难为飞行为距离。然而，有时人们可以看到行为飞行为飞行为飞行为 尽而撞在地上的鸥鸽鸟。为什么？就是因为鸽
    鸥鸟不懂得借势，所以飞才不远，飞得越飞 越太平常，越是飞出一片山林不容易。好像 有一个叫“一山一飞鸽”的说法，就是说这 鸽鸟只会夺在自己的一亩三分地上。


    这篇文章当时给了我很大震撼，也给了我很多 启示。这里面包含了人生和企业发展的一个 大道理，就是：为什么大家的出发点相似，但结局的差异竟如此之大。一个非常重
    要的原因，就是不同的公司、不同的企业家借 机或借势的能力是不同的。能做大事的人和企业 也会成功企业也不会只靠自己的蛮力，而都善于借助 外部的力量。


    # 2、如何借势


    下面，我和你分享的沃尔玛的案例，就是 一个“借势破局”的好案例，非常值得好好 研究。最近，社会经济变化和技术发展的速 度非常快，每一个人、每一家企业都需要做
    好顺应趋势的准备。


    在沃尔玛出现之前，美国的零售业已经形成 了一个很好的布局。当时对商业有一个基本共 识，第一家开折扣商店，必须要开在至少 有10万人规模的城镇，否则就没有办法保持
    价格的低廉，也就没有办法盈利。但是， 美国有10万人的城镇里，基本都开了像K- Mart之类的商店，竞争非常激烈。


    那么，这个时代的沃尔玛还有没有更多的发展机会呢？沃尔玛把眼光放向了更小的市 场，比如一两万人的市场。说形象一点， 就是在不县里竞争，而不下沉到镇一级的市 场。但镇里有一两万人的规模，多则只有五
    六万，少则才10万人。如果要一两万人的 镇级市场上开点，客户就会少很多，成本就 会更高，根本不可能盈利。但是，这个时候 沃尔玛看到了一个趋势，也就是一个机会，那就是卫星技术中应用。


    当时，沃尔玛已经能够在单独的一家店里使 用条形码技术来管理库存和物流了，这些都 是借势破局所必需的“正资源”，但是如果 没有办法把分散在各个店里的条形码系统联
    系起来，就没有办法即时采购。我们熟悉的一 句话，就是万事俱备，只欠东风。卫星技术 的应用，就是这一股东风。沃尔玛率先看到 了东风，也抓住了东风。


    ![](img/e9c4ead90d162cb22377bd13386f3198_8_1.png)


    于是沃尔玛对自己作了新定义：沃尔玛从 此去镇上开点，而不再是一个个分散的 “单店”，而是一个按区域组织的“商店 网”。也就是说，沃尔玛布局镇级市场的时 候，它不再用10万人对应一个独立商店角度
    看问题，而是把总数300万人的一个区域 看成是一个思考单位，这个区域现有100 个小镇，就布一个“由100家商店组成的零 售网络”。要是没有卫星技术的应用，这个
    “商店网”的概念也不可能成，因为你没法 让100家商店即时刻立，共享信息，统一 调度，你的成本就降不下来。而有了卫星 技术，你就可以用“商店网”的逻辑去开店，如果这个时候你保留住必须10万人
    才开店逻辑，你就没机会继续组织起网络。所以，沃尔玛及时改变自己的资源定义，像 信天翁一样抓住了“卫星技术”这个大气象，这就是借势破局。沃尔玛按照新思路成 局部之后，100家店对应300万，单店对应的人口也从10万人降到3万人。


    在新的“商店网”的概念下，沃尔玛还实现 了单店的盈利，这是为什么呢？因为占领 了镇一级的市场之后，总顾客规模一下子大了 很多，从上游供应商可以进行大规模的商品
    采购，和供应商谈判利势的增加，就大大降 低了采购成本，低价折扣的力度就可以更大。


    另外更重要的是，有了100家店，物流和仓 储网络就可以重新规划。原来的店铺比较少，距离远，运输效率常就比较低。现在店 多而少，物流和仓储网络就比较可以互相'
