    今天的课后，我请徐中博士列了一个书单，是关于领导力方面的经典。徐中博士是我的师弟，今年做了一件很了不起的事情，就是把领导力领域的经典重新整理了一下，有些是新翻译的，有些是重新翻译的。我强迫他必须优中选优，精选十本。结果他还是选了十几本，并且写了一个简要的介绍。我不建议你买这些书，但是，我把这个书单放在后面，你知道有这么一回事就行了。


