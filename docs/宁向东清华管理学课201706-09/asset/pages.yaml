  md: '# 周末复盘丨再看管理者、领导者、追随者


    你好，欢迎在周末来到《宁向东的清华管理学课》。


    这一周，我其实就和你分享了四件事：


    # 本周五的课


    1：权力、影响力和领导力的概念


    权力（Power）是一个古老的名词，古人的著作（组织或者制度）里就有。权力作为命令的权力就是制定规则。权力跟职位相关，但更是一种抽象的抽象权力。管理者没有权利，但是可以通过行使权力来控制他人的行为，领导、老板权力可以让他指挥管理员工有车辆、有权，在路上开车的时候，如果你不配合他的命令，他就会使用权力让你靠边停车，或者处罚你，你只能按照他的要求，这就是所谓的权力。


    1970年代，管理学家将权力明确分为五种类型，这是我们课程中经常讲到的专家权力、参照权力（魅力）、法定权力、奖赏权力和强制权力。这五种权力都能改变人的行为，但是，从专家权力、专业权力和参照权力不仅可以改变他人的行为，还能影响他的态度、价值观、信仰和行为，学者们将这一种统称为“影响”。


    领导力，一个人不能影响他人的行为，讲领导就无法离开“权力”的各个概念。所有领导力的研究都致力于改变人们的心理，领导力就是影响力，创造追随者。


    2：领导者和管理者的区别


    当一个人加入到组织中，当他在负责领导他人、完成一个组织目标的时候，他就是一个管理者。在管理者完成工作之后，他的价值就越来越小，业绩的评价和考核系统越细致，管理者的工作就越容易量化。


    ![](img/e9c4ead90d162cb22377bd13386f3198_72_0.png)


    3：如何创造追随者


    周五的课，是关于创造者的定义的一个表格。凯利等人对表格要求进行了细致的分析，在某种情况下，我们甚至认为，只有像一张照片，才称得上是“定义”的追随者这个概念。


    # 周末问答


    1：听完课，感觉我现在的领导不合格。


    宁向东


    管理者要超越自己，成为一个领导者，是有条件的。有人天生具有某种领袖气质，而另外的人则需要刻苦的训练。


    2：领导者的行为有什么共性和差异？'
