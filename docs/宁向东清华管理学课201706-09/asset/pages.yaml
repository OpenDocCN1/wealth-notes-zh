  md: '# 022讲：互惠合作丨离职员工的离职网


    你好，欢迎来到《宁向东的清华管理学课》。


    上一周，我们在讲80后和90后管理问题的课程时，提到了加班和离职关系的问题。关于这个问题，后台收到了大量的留言，几乎都是一样的。很显然，这些问题是比较现实的紧要课程。不管你喜欢听还是不喜欢，留言都反映了客观的存在。管理学的工作，不是抱怨的，不仅仅是揭示问题，更重要的是要解决现实。我会在后面的课程会陆续推出一些有对策性的解决策略。今天
    我们要和分享的是一个新的管理理念：互惠合作。希望由此帮你建立个一个有效处理离职网际的观念，把坏招转化为好事。


    # 1、“囚徒困境”的破局之道——互惠原则


    很多人 都知道一个著名的博弈，叫“囚徒困境”，说的是一对着名的作弊党，两个人被关押，虽然他们事先都约好了不打枪对方，但实际上由于政策是“先坦白，先放 假”，这个政策会导致他们去违背自己
    的约定，都会选择“招供”这个最优 的结果。现在，很多老师都教我们“囚徒 困境”举例子，但是，今天我要告诉你们一个新的认知，“囚徒困境”是立是有条件的，所以你不能直接相信它的结论。


    第一，“囚徒困境”的场景在学术上叫“静态博弈”。什么叫静态博弈呢？两个人玩“石头剪子布”，必须同时出拳，各一秒都有出招，就都是静态博弈。但世界上发生的很多事情，却不是静态的，有先后有。要有先有后，“囚徒困境”就不一定成立。


    第二，“囚徒困境”的假定博弈次数就是一次，因此因两人合作不会占优。如果两个人以后会有合作机会，他们的策略会发生改变，很可能他们会遵守诺言，所以“囚徒困境”给不像我们平时讲的那样简单，它很复杂。


    我今 天要重新和你分享的是，学者们的 研究表明，如果“囚徒困境”的情况可以 重复互动多次，结果就会完全不同。其 实真正复杂是一个“促进互惠原则”的例子。 管理者如果在这个问题上处理不好，
    可能会造成两个结局，最后的结果就是 双赢，双方都选择了类似于“检举对方” 的行动。


    我有个朋友有过一次辞职的经历，给我印象深刻。他在美国学习和工作了一段时间，有一肚子 的见识和想法，觉得回国以后应该可以施展一番，但，回国半年，没有找到领导和他谈谈话，领导们完全
    没把他的当 作一次辞职，而是忽视了自己要实现的念头。所以，这 半年间，他提出来辞职，领导很不高兴，半年间断 也不提走愉快。后来，本来有些散架的他，渐渐地，远离这家公司，和
    他原来的单位 进行斡旋，这就是典型的“囚徒困境”，因为本质上双方最后 都采取了“连朋友都不要 做”的不合作政策。那么，如果领导事先听 我说的话王永庆，是一个历练出了很局
    的人呢？情况就会不一样，会突破静态 的“囚徒困境”的后果。这里的 关键是辞职者 和领导者。


    我之所以 今天 要和你分享辞职处理 的艺术，就是希望帮助你 走出这个“囚徒困境”， 解决一 个问 题。“囚徒困境”是静态博弈。 而动态博弈 可以 看到未来的格局。所以，这种动态博弈，也是
    孙浩 一个会建 立自己的格局。但是，孙浩 坚会去扩展自己的格局，就是格局小。这里我 要 如果 讲佛学讲个广告，你管理学讲学，其实更重要的是要把他物的气质看得更透，这就是
    在扩展自己的格局。有了看着 事物的格局，你能够 从另外 的角度看待 人，看待人和企 业之间的 关系。本质上，人和人 之间的关系，就是一种互惠合作的 关系。


    互惠 原则，是社会 学中的一个重要原则。 社会学 理论认为，社会中所有成员之间的 关系，都是 某种形式的社会 交换，都会遵 循互惠原则。一个人的愿望在 一个组
    织中 就业，就 是因为 这个组织 有助 于实 现自己 某个阶段 的愿望。


    几年前，我读 一篇很重要的论文，里 面都有 直言：“一个 员工有感到他和所 在的组织存在着社会交换的时候，他 才会组织这一个组织的 组对 体系，提升 自己对组织的忠诚、
    雇员的对 组织的承 诺、员工提 高 业绩，并且帮助 组织中的其他成 员。否 则，就会选择离职，这就是 辞职的本 质。因 为离职是 让管理者 不爽，可 能 的职者本身
    满足 自己愿望 的一 个起 点。


    如果你 不能 够 讲清楚这个问题， 接 下来的 问题就 可能 是 在 一 个辞职上， 管理 者是 己 或者 这个组织 再 也不要 其他 系统 之间的 社 会
    交换关系， 而不 是 社会 交换 的一 个 时间 学 要 解决 的 问题， 下 面 我就 重 点 和 你 谈 谈 如 何管 理 辞职 的 问 题。


    # 2、留不住人，怎么办


