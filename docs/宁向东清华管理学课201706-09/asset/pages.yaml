  md: '定要勇于担责；但担责不是简单地揽下问题，那是悲剧式的担责，担责是指对结果负责，而且是不断获得好结果的过程。对勇于担责，领导者要敢于说了算，重大事项要敢于坚持原则，敢于拍板。而为了防止决策失误，要善于搜集信息，利用他人的智慧，要根据情况建立你能够承受住成本的顾问队伍。记得：硝烟是在千里之外，但决胜的真正舞台是在帷幄之中。


    组织碰到一个好的领导者，是一个福气；但凡事都有两面性。波峰之后，可能意味着是一个波谷。所以，组织中的领导，一定要注意储备合适的接班人。这是每一个领导者都必需要考虑的事情，也请替下面的领导岗位准备好备份。最后，请你牢记两句话：


