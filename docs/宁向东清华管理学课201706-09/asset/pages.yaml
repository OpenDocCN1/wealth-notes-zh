  md: '2. 在公司的支持下，由人力资源部门，或者在职员工发起建立与离职员工的交流平台。不过，需要注意的是：交流平台的本质是互惠合作。所以，公司一定要切实为离职的这些人员提供一些物质上的和精神上的收益，要有吸引力。比如可以邀请一部分有贡献的老员工经常返回公司参加庆典等活动，肯定他们在公司期间为公司带来的贡献。当然，公司也可以基于这个平台获得新的员工信息和市场信息，获得管理上的好做法。


    3. 时刻注意保持这一平台有一个好的的情绪状态，防止它成为瓦解公司队伍的一个通道。应该根据具体情况，设置防火墙，预防离职人员与现任员工之间建立起不利于公司发展的关系。应该选择认真负责的管理员。如果是使用微信平台，群主的选择一定要慎之又慎。


    总之，在未来可预见的的时间里，离职一定 会是一个普遍的现象。在这个工作中如何 管理离职人员，也构成了人力资源管理工作 一个新的课题。而在这个工作中，社会 交换理论中的“互惠原则”，是一个非常重要的思考基准。只有用这样的视角去想
    问题，才能够突破静态意义上的“囚徒困境”。所以“互惠原则”，是我们今天讲 课的重点，我请你记住。


