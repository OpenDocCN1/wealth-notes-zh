  md: '力；另一种是没有牵头人，全体共治。这两种团队模式在成员规模、运行机制上有很大不同，所以，团队领导模式也应该不同。这一点必须要再强调一下。在全体共治的模式下，人员数量（或者核心人员的数量）不宜过多。有人说5到7人比较合适。团队人员如果规模过大，组织效率遭遇的挑战就越大。相反，在有牵头人的团队中，人员可以适当多一点，不过要防止牵头人使用权力过多，不利于实现这种组织的初衷。


    +   3. 请记住，在团队型领导模式中，每一个人都有义务对其他人的问题负责，而不是简单地把它交给岗位意义上的牵头人。如果组织内部最后的结果是没人负责，牵头的人也负不了责，成员们在组织内部互相推诿，甚至三心二意、流动率居高不下，组织就没有稳定性。应该说，这就是团队型领导力没有建立起来的标志。在这种情况下，就要考虑退而求其次，选择其它的领导模式。


    总之，在未来的组织中，会存在越来越多的团队合作情况。所以，团队型领导力是非常重要的，特别是全体共治团队的领导力，如何建立，应该成为我们现在就关注的重点。


    # 宁向东


    最后我还想说，所有的合作，本质上都是资源互补，而资源如果没有了互补性，合作也就无法存在了，这也就是为什么在所有的企业组织中，合伙制企业的稳定性最差。这一点，我不展开说，但你一定要记得。


