    的 不 断 扩 大 ， 雷 夫 曼 发 现 ， 离 职 人 员 的 数 量 在 快 速 增 长 ， 在 领 英 服 务 的 企 业 上 ， 雷 夫 曼 发
    现 很 多 公 司 里 面 的 离 职 人 员 开 始 发 展 各 自 非 正 式 的 “ 同 事 网 ” 。 雷 夫 曼 觉 得 启 发 ， 在 2013
