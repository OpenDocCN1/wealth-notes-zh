  md: '的一顿饭，竟从晚上五点吃到后半夜。一年之后，重组顺利完成。


    事后回顾，这位企业家说，争取员工支持，比解决什么股权重组和银行债务豁免等问题重要得多，人是整个重组成功的关键。这里顺便说一句，这位企业家只有初中文凭，但是，他在商场上历练了二十几年，他洞悉人性，他深知人性在企业经营中的重要性。


    所以这一周后面的时间，我会集中精力和你分享人性的问题。不过，我要讲的人性，不是人性善或者人性恶的问题，那些问题只能增加你饭桌上辩论的谈资，我要和你分享的，是一些脑科学的最新研究结论，告诉你人是怎样认识世界的，人是怎样思考和判断的。我认为，你了解这些内容，也许更有助于强化你的管理能力。


    好，今天的课程就到这里。如果你还学有余力，请你阅读推荐读物——职场霸凌。这也许是一个你从来没听过的概念，职场霸凌也叫“工作场所欺负”。你知道吗？按照西方职场霸凌的定义，前面提到的推操，竟然还不算“工作场所欺负”，真是怪了事了。


    # 课后思考


    作业：请你想一个非正式组织影响工作效率的例子，试着解释中间的逻辑关系。


    # 推荐阅读


    # 职场霸凌


    国外的学术界对于“职场霸凌”，通过5个特征来定义：


    +   1. 被霸凌的人遭到了语言、身体等方面的消极行为，比如上面所说的“被推操”，当然还包括“语言暴力”，比如被当众羞辱、工作价值被贬低等等；


    +   2. 霸凌的行为不是偶然的，而是持续的。有海外学者给了一个标准，就是每周至少一次，持续6个月以上。学者们说的这一条很重要，因为它可以把职业霸凌和一次性冲突和偶然冲突区分开来；


    +   3. 被霸凌的人自认为力量弱且没有防备的能力，这一条是很有趣的、不仅仅包括上级对下级，有时在同级之间、仅仅对上级之间，也会存在霸凌行为；


    +   4. 这条最有趣，就是被霸凌的人一定要自己觉得是被霸凌了。不要忘了，在中国的职场社会里，有时被领导骂，不会被认为是一种侮辱，反而认为是与领导关系亲近的表现。'
