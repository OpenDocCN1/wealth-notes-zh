  md: '其实一点也不比他的前任差。有一个秘诀，就是韦尔奇从来不吝惜和下属谈话的时间。韦尔奇刚刚上任的时候，他往往通过公开场合的表现来判断一个下属行还是不行。过了一段时间，他发现自己的办法不行，他改为每一次就一个具体问题和下属深谈。他花了很多时间和下属进行个别谈话，讨论具体问题的解决方法，来判断下属的能力和培养的潜力。这样做，一方面让他自己对业务有了很深的了解，更为重要的是，他可以由此来发现合适的人，做到知人善任，适时放权。


    我们都知道，韦尔奇在GE任职二十年间创造了管理上的辉煌，大家对他个人佩服得不得了。但大家不知道的是，他能够成就这样的辉煌，不是因为他自己行，而是因为他会用人，他用的人行，他会授权，众人拾柴火焰高，不是他独角戏唱得好，是大家唱的合唱好。


    ![](img/e9c4ead90d162cb22377bd13386f3198_77_0.png)


    德鲁克在《管理的责任》这本书中特别强调，管理者首先要问的是，哪些事情是关乎企业成功和生存的当务之急的？这个当务之急是必须自己来做还是别人也可以做？如果交给别人做，可以做得一样好，甚至更好，那就应该把这个工作分派出去。德鲁克说，很多问题，不是管理者没有能力，也不是他不愿意去做，我们没看到他做，而是因为他觉得应该花精力做别人不能做的、更重要的事情。这件事情他能使，别人也能做，那不如把这件事交给别人做，这就是授权。授权之后还有一个秘诀，叫做“有所知，有所不知”。什么叫“有所知”呢？就是要知道哪些是最大的事情，要知道制度体系无法处理的例外事项。


    # ◆◆ 课后思考 ◆◆


    能力型领导人的第二个问题，就是担心失落，他之所以要频繁干预，就是要刷存在感。对于这个问题，该如何解决？这是今天课后的思考题。


    ![](img/e9c4ead90d162cb22377bd13386f3198_77_1.png)


