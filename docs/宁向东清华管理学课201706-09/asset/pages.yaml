  md: '# 周末复盘 | 组建有效团队的逻辑


    ![](img/e9c4ead90d162cb22377bd13386f3198_124_0.png)


    周末复盘 | 组建有效团队的...


    你好，欢迎在周末来到《宁向东的高管管理学课》。


    这一周，其实讲了一个概念：团队。基本逻辑也很简单，可以概括如下。


    首先，要先时刻记住目标。


    我们为什么要组建团队？因为一个人干不过来，一个人干不过来，找人帮忙，人人都向你投来，向你负责，这个叫群体。群体中的成员之间没有什么关联。如果你要实现的目标，需要较长时间的投入，成员间不仅需要对你负责，还要相互之间互动协作，就需要承担另一个团队。团队和群样的最大不同，就是成员之间有协同配合的关系，有共同目标。为了一个协同效应，我们的组织搞了很多团队建设的活动。但是，我推荐首先提醒留意的是：建立一个团队一定要集中到规划知道：你想干什么，团队的任务是什么，目标在哪里。


    周一的课中，我没有明确区分“组建团队”和“团队建设”这两个名词。今天特别强调一下，我这周一课里讲的，都是组建团队的内容，我通常理解的“团队建设”是下一周的内容。


    ![](img/e9c4ead90d162cb22377bd13386f3198_124_1.png)


    记述了目标，接下来的问题就是怎样搭建一个有效的团队。我周二和周三就分别讲了这个问题。


    周二讲的核心观点是“选择团队成员，是领导者最重要的工作”。我用谷歌选人的例子来分析，对于组建团队来说，选人有重要，我还讲了三种尽量要回避的：人性不健全、态度不认真和做事不职业的人。当然，有人再选一个人的能力，有比后面这两重厉害。懂度人，真莫太高。但是，不含容易。周五，如果你有时间，我推荐你看电影《悲情世界》，特别喜欢老左版的。以德报怨，不容易，这是我对中学里看小说《悲情世界》印象最深刻的东西。所以，我特别理解有些管理学者“换脑袋或换人”的说法。我当年靠常不靠尼尔森才给博尔的MBA毕业生，你毕业了不要进通用电气来，你们到华尔街，我们真正长大了，再来通用电气。所以，很多时候，有些人，惹不起，要学条躲得起。


    选了好的人，还要摆好位置，这就是周三的话题。领导背苹果一辅助型的人关系的问题。有头，苹果，飞网飞要的关系，其实，就是背背飞网飞组织管理，也有个高低排序。背苹果的人给背苹果的人，位置是存在的。你就算背飞网飞苹果里飞网飞高手工作。NBA总说通过。顶级球星是飞网飞下，所以，学会靠苹果飞网飞，是领导者的一个大本事。


    周三还讲到了一个要点：团队会遇到一些复杂的问题，需要结合性的有思维脑补能力和解决问题的能力。骨干型是要思考作用。骨干有能力把复杂问题拆解，之后交给只具有线性思维的人去做。会带领辅助人员工作，是骨干的标志。


    ![](img/e9c4ead90d162cb22377bd13386f3198_124_2.png)


    由于很多同学是从零起步，周四我提供了一个团队建设的极简工具，是一个逻辑图示，包含了团队进化内在内容在里面。这一个周末，我希望你也有时间，还可以再复一下。


    周五，我讲了一个要点：要把员工当作资产。我觉得，这是团队建设的一个基本原则。招人这件事，一定要前后义情，但是，一旦雇员员工进入公司之后，就应该真正把员工当作企业的资产去培养。


    ![](img/e9c4ead90d162cb22377bd13386f3198_124_3.png)


    下一周，我会讲一个重要的概念：心理契约。所有的员工在进入组织之后，都会在心中和该组织签订一个你看不见的“心理契约”。当签约中的核心款项无法被满足的时候，他们就会离职；当普遍条目没有被满足的时候，他们就会减少投入，有恨心。当然，人有感情倾向的，也需要严格的制度，该开除不合格员工的时候，不能手软。但是，只要资产就那一天，你要希望他成为企业资产就难了。还记得电影里讲的“社会交换”的概念吗？还记得《联盟》里面讲的离职人员的灰名单吗？


    好。这一周的内容，就复盘到这里，我们周一见。


    # ——一周留言精选——


    来自看起来像人：我觉得还是要人性的，不人不像机器，加大马力了就可运转得快。不过老师总是有人是有感情，并不仅仅比老师就只是说了一个方面，并不是说另一方面就不重要。另一方面在他在讲课中说过。


    来自陌桑桑：学习今天的课，听到了一些平常不认同的声音，正所谓学海无涯，首善争。我看到老师不是在给所有的管理者争一个“样板图”，而不是所谓的“普世价值观”或者定理、公式，不是数学里面的一加一必须等于二。老师就是错的，给了我们必须要于一个大于世界。我们看到了各种各样的可能性，也给读者提供了最多的管理思维，合适的，咱拿来就用；不合适的，咱通通不用。就像老师常讲的咱搞管理是系列教学，每个管理者所处的管理环境都不相同，所以，要把管理工作落实到本上，主要说，同时管理、因事制宜，因人制宜，这样，学习管理学才会“好风凭借力，送我上青云”。


    来自正静：下：团队建设，也许是对地方企业组织上，网飞也是一种模式，凡事讲究个“度”，网飞是因为高回报才能吸引，如果果其它的东西没有了，由于缺乏“人性化”和“关怀性”，它也会迅速衰退，甚至破产。人是有机性的，这没样，可以制度规定规范动作，也不变成枷锁。至于那种类型，同事也可以看的到他的性格以及发展阶段，如果是服务行业，对员工苛刻的话，又怎么可能望他心或至少表面上真心对待客户呢？


    来自Ange：课后阅读给我的感触很深。老金是个好榜样。1.老金做当个人情深，圆滑，又圆滑，2.老金做事积极主动，且态度超级认真。3.老金与同事相处融洽和睦，4老金自己管理专业，也愿意慷慨分享，5.老金处世事业小有成绩，也不忘当下的交情。老金是个值得交往的人，是我们学习的榜样。


    来自liuf：在我的科室里就有一个个性不健全+态度不认真做事不职业的“利己”。体制内医疗，不能随便搞人，领导也不舒服，这个“利己”在我俩任科手里就不合作，到我手里，他比我资格还要老，更是不会合作，连我部都发现在我俩科室都是不任之，但我仔细观察发现他体质不坏，室孝顺的，他母亲住院期间，我去看望老人，帮助家属家务，我发现他对家人有感情，希望科室帮活动发给他话儿去。科室里成立质控小组，也把他放为成员。一年来，他在慢慢改变，虽然个性还是不健全，但工作状态有明显的改善。


    来自冯清：称团队为“猪猪友”，对来自发热群说？团队在日常管理中确实存在猪队友的情况，很难要求所有的团队成员都具有高组织思维能力，有效解决复杂问题的能力。如果团队是顶端高手，也很难形成极佳的团队。团队需要根据人员，根据人员，有骨干。作为团队领导者，核心抓住骨干，骨干一定要具有机会思维，处理复杂问题的能力。然后为骨干调配团队成员，辅助人员完成任务。执行方，规范定时，保证人员完成任务，对于人员及目标，对于人员，要专业的帮助人员及目标的淘汰，对团队领导者来说，做好梯队建设，强化人才培养机制，把更多的线性思维的员工培养成具有机会思维的领工，功效无量。


