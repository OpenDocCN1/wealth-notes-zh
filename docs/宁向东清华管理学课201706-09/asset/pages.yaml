  md: '# 025讲：导论2.0｜一键了解模块核心知识，跟上不掉队


    你好，欢迎来到《宁向东的清华管理学课》。


    今天是整个模块的最后一讲，我们对前五周的内容做一个总复。


    # 1、“局”的概念


    前一周，我和你分享了“局”的概念。你还记得我当时关于“局”的定义吗？“局”就是你身边各种资源之间相互关联和相互作用的有关系。有时候，你只看想象，就与人际有了认知，你就会发现它处于一种资源关系之中。你也会发现资源关系中有关联，要服务于转化资源关系。比如，人是资源，你要领导一个团队，就要善于用人，帮帮大家朝着同一个目标前进。那么，如何会作为资源的人？从一个模块开始，我会讲领导力、团队和管理的一些基本方法，都带。一


    002讲：资源关系｜到底什么是“局”


    不过，对于一个领导者来说，用人也好、做事也好，要先有格局。格局有多大，就能认识到多的大天地，就能能够多大的局。所以，第五周，我很明确地先讨论了“格局”的概念。原来的课表设计，这个内容更靠后，但这个话题班上同学分享，和前面的破局形成一个呼应。这样前几周的课就形成了一个
    2.0版的导读。


    021讲：格局修炼｜当骨干前来辞职


    “局”是资源关系，“格”就是认识能力。格局的本质，在我看就是能够把资源关系的认识清楚，把事情看通。比如，人际之间是交易，它交集是什么？你要什么？对方要什么？交集在哪里？把这些关系看清楚了，自然就可以顺着事情本身的关键，这就是我们所谓的“格局”，“做人要想顺应天理”。为什么？就是因为顺应天理的人，有“格局”，让人信服。


    所以，这里我再强调一下，“格局”这个词，首先是一个动态概念，“格”是动词，“局”是一个名词，是宾语。它是强调认识资源的本质和相互之间的关系。可以讲，建功立业，首先就是认识资源，识局。当你有了真正的洞察，并且能够提炼出一个“格局”，“格局”这个道理就变成了一种状态，它表现为管理者的一种内在的状态，也就是我们所说的，这个人格局小，那个人格局大。所以我们努力要做到格局大。


    004讲：识机会窗口｜借势破局


    005讲：涟漪效应｜破了局


    # 2、如何修炼“大格局”


    第一，首先要了解自己，避免“灯下黑”，这是第三周的重点。


    +   - 011讲：MBTI测试｜认识自己是一切管理的前提

    - 012讲：人格特质｜你有却不自知的优势

    - 013讲：达克效应｜自负根基与倾家荡产

    - 008讲：阑下意识｜识别商场上的圈套

    - 009讲：冲动基因｜为什么会有人选择冒险


    第二，要学会了解他人，这是第四周的核心。不过，要真正做到了解自己、了解他人，换位思考，不容易。比如，我们有个同学留言，说到自己身处异地管理时的问题，我就建议他在异地办公管理时从当地老公民的角度去考虑问题。你想想，如果是老泰你带了孩子，你在中国会怎么处理？你希望孩子什么样，你希望孩子在哪里？她老人希望她的样子，一定是在家里面最好的，或者是极限，也可以做事情的最大的尺度。


    016讲：状态自愈｜管理他人的切入点


    第三，在了解自己、了解他人之外，管理者要想形成大的格局，还需要洞察人性。


    所以，我的课在第一个模块里面讲了很多关于人的本性、人的行为的条目。这里我述述本模块最后一周所讲的三条最重要的原则：


    +   1. 所有人之间的关系都是“社会交换”的关系，要懂得“互惠原则”。我是通过理解这个案例来说这个概念的，但是，这个概念不局限于于此，几乎所有的人际联系，说到底都是“社会交换”。

    2. 我强调了“公平感”的观念，公平感不是建立在你自己的利最大化的基础上的。我平常常说“公道自在人心”，这是很值得我们反复琢磨的一句话。

    3. 我强调了要注意发掘人的“进取心”，而不是片面地强调利己。以管理者为中心的“执行力”，和所谓的“幸福指数”。


    022讲：互惠合作｜离职员工的系关系网


    023讲：公平感｜领导者的内功


    024讲：管理基准｜幸福感？进取心？


    # 3、如何成为有格局的领导者


    当领导者有了格局，就会懂得注意观察、判断趋势。理性就是发展性作用，还记得到过线性管理？不会过理性是在人的基本上发挥作用，所以，我们需要充分了解人。人，是一个有机体，人不是机器，当信息不足的时候，当体内因素得不到判断的时候，就会出现重大失误，就会出现问题。理性化和感性化，管理者基本会出现。所以，管理自我和管理他人，一定要注意这一点，人不机器，人是生物，对自己，要注意控制精力，要通过休息调整状态。对他人也是一样，因为大家都不是机器。


    010讲：理性注入｜从根本上管理情绪


    014讲：情绪｜第一生产力


    019讲：窄化效应｜离职率居高不下


    015讲：认知能量 | 减少心力的流失


    领导者的理性，首先要体现为了解下属的需求和动机。因为所有人的行为都是建立在他们的动机基础上的。我向你介绍了马斯洛层次需求理论，也介绍了包括“保健因素”和“激励因素”的双因素理论，同时，我们做了
    80 或 90 后的管理工作，你是否应该对自己的需要和要求直接做一个分析，然后通过个会议或者渠道或者直接向这些 80 或 90 后的领导去分析，然后这些个内容的领导知不知道或者相应下的人作为领导者，你是否应该对下手的人做动作和意志想象着一个比较细致的分析和分析。之后很重要的一件事就是说管理者和上层管理者有人要把动物和需求是一下，这样才可能打造一个的团队、一个好的组织。


    017讲：愿望与能力 | 了解他人的两条线索


    018讲：双因素理论 | 如何管理 80 后，90 后


    上周我来广州由坐火车返回北京，后面的一位旅客几乎把所有的尾翼写了一路，我当时的真想帮我把课程推荐他听。他写的很多东西，其实就是他在动情层面的，他在动物层面上没有真正理解你，而是一面高高在上的姿态，完全生活在自己的世界里，下面伙伴只是是一个附庸物。你想，这怎么可能创造有效的工作关系？把工作任务放在一边，大家在工作上应该是平等的，他的姿势不是“要求”，而努力做到“帮助他千他自己想做的事”。


    006讲：人际关系理论 | 你真的知道推员工后某果吗？


    007讲：认知不协调 | 改变他人态度的秘诀


    其实，每一个领导人都应该意识到，所有人现在做的事情，都是自己职业发展中的一环，是他们自己人生中的一段路，否则的话，就是公司要动力给的，不会有个工作”工作进取心“。前面我们提到的”工作进取心“，这个话题，当我们强加给，管理者要设法找到合适的人，然后挖掘出他们独有的特长和禀赋，并且把他们这种禀赋争取发掘到极致。'
