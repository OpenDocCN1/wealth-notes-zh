  md: '3. 第三个字：仿。请记住，所有的经验学习都是从模仿开始的，而模仿的核心就是要基于前面你所总结出来他人的模板。很多模仿，最开始都是学不像的，因为毕竟还是人家的东西，所以，要有足够的细心和耐心，注意修正，注意调整。


    4. 第四个字：改。因为你遇到的问题一定具有你的特殊性，所以，你一定要注意结合自己的情况来不断修改经验模板，在别人的模板上增加一些你自己认为必要的因素，减少一些不必要的因素，使得这个经验变成你的东西，对你解决问题有帮助。


    5. 第五个字：善。当你看到你通过模仿他人的东西，来解决你的问题，取得了效果之后，其实你就进入到了一个更高的境界——完善的境界。因为完善的目标就是形成一个新的更加简化的适合你自己使用的经验模板。


    有一天，当你可以去跟人家交流，跟人家吹牛的时候，别人也会追问你相关的细节，这个模板就是你的管理功夫；有一天，你真的能够讲出一堆模板的时候，你就是少林寺门口的扫地僧。


    总结一下，五个字：问，想，仿，改，善。这是我个人总结的、关于经验学习的五字心经，现在分享给你，希望你能有帮助。


    # 3、给大家的建议


    最后，根据同学们前面的留言，我总结了四句话：


    ![](img/e9c4ead90d162cb22377bd13386f3198_47_0.png)


    宁向东


    第一， 没有理论和方法是过时的，所有的理论都有它可信、有参考价值的要素。我们要注意思考一个理论产生的背景、成立的前提条件，要利用那些有价值的要素。


    第二， 目前这个阶段没有理论和方法可以包治百病，解决所有的问题，所以我们遇到问题要学会拆解，然后用不同的招法去有针对性地解决问题。


    第三， 与理论学习相比，更重要的是你要对自己所面临的问题进行分解，找出解决问题的逻辑和路径，因为管理工作就是一连串的应用题。


    第四， 注意经验借鉴。经验借鉴是管理


