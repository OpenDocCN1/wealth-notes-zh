    # 徐中博士推荐的15部领导力著作


    2003年，徐中博士在清华大学经管学院开始从事高管教育培训，14年来在领导力与管理培训领域积累了大量的实践经验。


    2010年以来，徐中博士凭着对领导力研究与教育的热爱，师从多位国际领导力大师，与华章出版社、电子工业出版社、北大出版社、湛庐出版社等合作，策划、翻译、审校了26部领导力和管理领域的经典著作，包括享誉世界的领导力大师拉姆·查兰、沃伦·本尼斯、詹姆斯·库泽斯、巴里·波斯纳、马歇尔·戈德史密斯、约翰·科特、尼汀·诺瑞亚、伊莱恩·碧珂等，受到读者们的一致好评。其中，《领导力》《领导梯队》《领导力教练》等长期位居领导力书籍前茅。


