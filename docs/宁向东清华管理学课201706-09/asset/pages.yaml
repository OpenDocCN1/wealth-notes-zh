    # 宁向东


    中国 有很多 俗语， 其 实里面 都充满 了这种权 变思想 的智慧。 比 如 “看人 下菜碟” ， 再比 如 “顺 毛驴 不能用 㳌方法 ”， 都是 对权变思
    维的 形象 描述。以 前，我 听一位搞 拆迁的人 给我讲 他们弄 拆迁， 就是典 型的权 变操 作。对于 先同意 拆迁的人， 他 们给 一个 价格，起 到示范
    作用； 然后在 启动之 后，对于 绝大多 数的拆迁 户， 它们 又给 一 个价格， 重在 降低 拆迁成本； 而对 于那些 钉子 户， 他 们在进行 各个击
    破的 时候，条 件是被 其灵活 变通的。 这个例 子虽然 在商业伦 理上不是 很好， 但是 便于 你理解“权 变”这个 概念。


    # 课后思考


    今天 课后， 请 你考 虑一下： 作为 领导者，要形 成一个 相对稳 定的 领导风格， 争取 能够通过 自己的 领导行 为影响 到绝大 多数的下属。 但 如果下
    属的情 况特别 复杂， 在坐标 里分布 得特别散， 谁都 不挨谁， 领导者 该如何 变通 呢？


