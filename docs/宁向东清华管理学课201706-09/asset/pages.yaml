  md: "# 035讲：战略型领导 \n\n致敬早年的乔布斯\n\n你好，欢迎来到《宁向东的清华管理学课》。\n\n今天这堂课，在时间点上特别有意义。1997年7月底，也就是整整20年前的这个时候，苹果公司的董事会正式决定换届，把乔布斯选入了董事会。自此，乔布斯重新掌握苹果，一直到他2011年去世。乔布斯重新掌权之后的故事，太多人讲过。但我们今天的课，集中在早年的乔布斯身上，因为在我看来，那时的乔布斯，虽然经历少，但更值得尊敬。而早年的乔布斯，对你锻炼自己、参考价值更大。\n\
    \n今天的课程主题是，战略型领导，乔布斯一生的经历都告诉我们：他逐渐磨砺出来的，就是一种战略型领导能力，也就是由他为公司设定愿景，利用他的直觉为自己找到发展方向，去当地地把握机会，为组织赢得竞争能力。只不过，他的早年经历，我们不是很熟悉。\n\
    \n![](img/e9c4ead90d162cb22377bd13386f3198_82_0.png)\n\n# 1.复盘：乔布斯和苹果的早期发展\n\n\
    我们先讲乔布斯和苹果的早期发展这个复盘。乔布斯早年最有代表性的事情只有两件。关于这两段故事的细节，推荐你去读两本书：一本是伊萨克森所写的乔布斯自传《乔布斯》，但是一本，另一方面《成为乔布斯》，更简明扼要，因为这本书的作者为了《华尔街日报》和《财富》杂志报道乔布斯长达25年。\n\
    \n![](img/e9c4ead90d162cb22377bd13386f3198_82_1.png)\n\n乔布斯两段故事的第一段，是1976年乔布斯和沃兹尼亚克正式注册了苹果公司，生产出第一台真正意义上的个人电脑。回顾这段历史，你会发现乔布斯本人对攻坚技术既着迷又没有兴趣，也没有热情，但是，他非常看重有强大的技术带给普通大众后所产生的影响。乔布斯给自己的定位是他所导致的影响的消耗力，毫无疑问采取行动，把握机会，从战略层面上引领大家。而他也沃兹尼亚克的合作社也坚定了一个信念：只要和技术天才合作，没有什么是不可能的。\n\
    \n1995年，乔布斯曾经接受了一个访谈，原话影像部分长达70分钟。由于剪辑的原因，这段访谈的影像资料所有人认为在运输的路上丢失了。乔布斯很少接受采访，所以说2012年，当摄像卡在车库里发现了这台录像带的影像，长达16年的埋没，让这段录像的影像已经稀缺。这个时候，乔布斯离开人世已经整整一年了。因为版权的原因，我没有完整分享这一整份录像资料。今天的课后，我把一部分影像的原声和转录，放在推荐阅读的链接上，希望对你有所启发。\n\
    \n在这个访谈里，你可以看到乔布斯的真实想法。乔布斯说：我不在乎挖掘，我承认做得很平庸。但是，有太多事情，对我来说不重要，对我真正重要的只有一件事：就我是否去做了正确的事。后面的课，我会讲到，选择做正确的事，找到正确的方向，这是战略型领导的关键，也是建立战略型领导模式的基础。\n\
    \n# 2.找到第一流的人才\n\n在乔布斯的战略型领导模式中，牛人是个性关键词。乔布斯说，要做到正确的事，首先就要找第一流的人。乔布斯的这个观念，是很多人企业家导人的共识。很多优秀的领导人内在的，都是能够吸引到最优秀的团队。你还记得“飞飞公司”的人原则吗？\n\
    \n![](img/e9c4ead90d162cb22377bd13386f3198_82_2.png)\n\n链接：016讲：状态自断 | 管理他人的切入点\n\
    \n在这卷影像中，乔布斯说：我的成功，绝大部分是来自于找到真的有天才的人，不是第二流人才。不是第二流的人，而就是第一流人才。当你真正找优秀人才的时候，他们真正喜欢在一起工作，你不需要小心翼翼地呵护他们的自尊心，也不需要太宽大的胸怀，因为大家都知道，工作目标才是最重要的。大家都知道乔布斯爱骂人，但他和不同流动的是，对于这些第一流人才，乔布斯从来都是：“你做出来的东西是狗屁，而不是你这个人是狗屁”这部分内容，大家在今天的推荐阅读中都能听到。\n\
    \n乔布斯早年故事的第二段，是脱离苹果公司的既有业务盘子，独自带领一个50人的团队去开发“麦金塔”。这个时候，他的工作要点，依然是选择最优秀的天才。乔布斯不是一开始就想从苹果公司的各个项目组招人，把他优秀的事，而为了在整个宇宙掀起巨大浪潮。\n\
    \n1984年“麦金塔”正式发布了。虽然“麦金塔”的爆款也是可以留名版的，但这是人类历史上第一次以像留花一样的创造电子文化的电脑，用图标来滚操作，“麦金塔”第一次大幅简化了人类操作电脑的进程。\n\
    \n![](img/e9c4ead90d162cb22377bd13386f3198_82_3.png)\n\n到这里，你应该明白了，找到第一流的人，才能去大胆的投入工作之中，就一定会建构一个愿景，让他们看到他们正在做着改变历史的事情。这是乔布斯“战略型领导模式”的秘诀，你如果想要建立“战略型领导模式”，也应该参考这一点。\n\
    \n讲到这，也许会问：我还有一个小公司，离乔布斯相差十万八千里。但是，如果你看到今天1999年在你家里和“18罗汉”开会的故事，你也许会意识到，你的现状可能和马云在1999年时没有差别，都是一个产品、小公司。但你和乔布斯、和马云的区别，不在于公司的规模，也不在于行业，而是你们的认知、志向和愿景是不是有相似之处。假如你也能看到十年或二十年之后的发展局面，你具备成为战略型领导者的一个条件，你也不必考虑在战略型领导模式。所以，差别不在于你的现状，而在于你的未来，在于你是不是有超越眼光，这是建立战略型领导模式的关键。\n\
    \n# 3.让一流人才追随你的战略愿景\n\n乔布斯之所以被赶出苹果，根本上是和苹果公司自己的CEO斯卡利不和。在我看来，双方其实都没有错，只是他们的水火不容，都想让对方先死。很不幸的是，乔布斯的阴谋没有实现，被清洗出局。\n\
    \n斯卡利是职业经理人，他是一个标准的市场营销世家，其实他作为管理，他必须要让公司活下去，这他没有经营一支必须要服务于客户的概念。当时的经营困难也躲不开去，核心产品“麦金塔”的销量在直线下降，来自巨I\
    \ BM  产品 的 竞争也在越战越大。乔布斯直接管理着“麦金塔”部门也拿不出更好的解决方案。这一切都改变了斯卡利来力改变公司运营逻辑，改变双方的压力。在这种逻辑下，乔布斯的战略型领导模式就没有办法实行下去，所以他就把乔布斯赶出局。\n\
    \n而乔布斯并不想按照斯卡利的方向去行动。作为战略型领导者的他，是想将电脑底层从市场，不想为了现有客户进行简单"
