    +   1. 勾勒目标：领导者要想办法让团队成员，尤其是发生冲突的团队成员看到合作的前景，以及让冲突恶化下去的后果。领导者或许不能预估的是，当全体团队成员都清楚前景和后果，团队内部也许会发生在领导事先完全预料不到的积极结果。这就是成员的力量。\n\
