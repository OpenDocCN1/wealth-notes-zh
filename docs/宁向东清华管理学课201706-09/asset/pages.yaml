    种强大，以前的社会科学研究核心领域 的研究发现，我们人类最具的思维能 力，可能不是这些可以加工的能力，人类 智能更有可能是在这些地方上比其它 物种更强。我们人独一无二的优势可
    能是我们“类人”，计划未来、憧憬 未来，是人类更强大的能力。” 准确 地说，人类应被称为“期望人（homo prospicetous）”。


