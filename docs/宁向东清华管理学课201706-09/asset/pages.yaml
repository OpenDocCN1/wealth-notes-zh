    # ## 李向东


    这节课学的是商业模式创新，其中提到‘商业模式创新’是‘商业模式’与‘创新’的结合。商业模式是公司的‘DNA’，而商业模式创新是让公司获得新的‘DNA’。


    # ## 课后思考


    我们学习了五种不同行业，五种不同的商业模式。你思考一下，你的行业有哪些商业模式？


    # ## 推荐阅读


    1. 什么是A型人才？

    乔布斯：

    我之所以成功，很大程度上是因为我找到了真正有天赋的人。不是B级、C级人才，而是真正的A级人才。


