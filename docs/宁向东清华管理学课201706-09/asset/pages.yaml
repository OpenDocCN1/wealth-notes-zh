  md: '成某种愿景，所以需要一群人形成一个有效协作的组织。而这群人，必须要有一个领导者去引领，否则群龙无首。领导者完成这个任务的基础不仅仅来自于他的岗位所赋予他的权力，还来自于超越岗位权力的影响力。


    总之，领导力是一种影响力，我现在转送你一句话，是GE（美国通用电气公司）的前任CEO韦尔奇的一句名言：“当你成为领导者之前，自己的成长是成功；当你当了领导者之后，帮助他人成功，才是成功。”这句话我请你仔细地思考一下，很有味道。


    # ←— 课后思考 —→


    课后请你超题一下今天的推荐阅读，体会一下如何超越岗位影响他人，为明天的课做一个预习。


    # ←— 推荐阅读 —→


    +   1、领导者权利的5种类型：


    硬权力：


    1. 合法权力：基于领导者拥有的正式职位或头衔；人们接受领导者发出命令或指令行动的权力。


    2. 奖赏权力：基于领导者给予或撤销奖赏的能力；人们为了获得想要的奖赏而服从。


    3. 强制权力：基于领导者惩罚或建议惩罚的能力；人们服从命令从而免受惩罚。


    软权力：


    1. 专家权力：基于领导者的专业知识或技能；由于领导者的专业知识，人们信任并尊重他的决定。


    2. 参照权力：基于领导者的个人品质；人们钦佩并尊重领导者，愿意追随他，并且采纳他的观点。


    > 摘自《领导学》（理查德·L·达夫特著，电子工业出版社）


    2、领导者如何强化职权外魅力


    +   1）领导特质理论


    笔者以前就职于一家央企的工程管理部，公司主营业务是工程项目管理，X是该部门的总经理，他用了5年时间从一名普通的技术人员做到了部门总经理，而公司这个级别的职位一般人要用10年以上时间才能做到。X具有敏锐的眼光，总能不断地发现市场中的机会，为公司带来业务。同时，他善于发现影响组织绩效的关键因素并采取措施改进。X对人的判断也很准确，知人善任，决策果断，可以做到换位思考，经常身设处地为下属谋取发展的空间。这些品质赢得了下属对他的拥戴和信任。


    领导特质理论涉及的特质很多，领导者不可能具有所有领导特质。哪些特质是领导者必须具有的，要考虑情境因素、下属的需求和特点、组织的业务特点和氛围、文化及主流价值观等。一般来说，眼光独到、无私、执着、心胸宽广等可能是领导者最关键和最最重要的特质。眼光独到表现为具有敏锐的洞察力和前瞻性，无私才能赢得下属的爱戴，执着才能使其专注于事业，有广阔的胸怀才能容纳人和事，从而乐于授权、敢于负责、尊重他人、善于合作。


    2）领导行为理论


    从领导行为理论方面讲，X很关心工作任务的完成，会在每两周例会上安排好部门一周的工作，落实到人，要求员工按规定完成，力求取得最佳绩效。X不仅关心工作任务，也关心人。比如，在部门周会议上，当别的部门指责自己的下属时，他总是从自己下属的角度据理力争，为自己\
    n的下属争取正当的利益。但会后，他会找相关人员谈心，委婉地指出问题所在并指导其提升能力。他会为下属争取更多培训的机会，在下属有困难之时也会尽力帮助其解决。他曾帮助一名家在异地的下属解决孩子进幼儿园的问题，为一名下属生病的父亲找到当地最好的医生为其治病。


    领导行为理论既要求以任务为导向，员工完成各自工作，取得最佳绩效，也要求以人为本，信任与尊重员工，关心员工需要，积极为员工谋福利，做到关心任务与关心人的平衡。


    3）领导权变理论


    从领导权变理论方面来讲，领导者应针对不同 的下属、不同的情景，采取不同的策略。X曾帮助一名不适合做商务的女孩转到更适合她的事物部门工作，而为另一名业务能力比较强但不愿意填写各种表格的技术人员找来一个文员帮助填写各种表格，让技术人员专心做技术工作。


    可以说，X是一位魅力型的领导，真正做到了不基于职权影响下属。在部门，下属因为他的业务能力心生敬佩，因为他能不断成功而对其心悦诚服，因为他慷慨无私的帮助而心怀感激，因为在他的提拨下有进步的舞台而积极工作，因为有温馨和谐的工作氛围而心情愉快放手拼搏。X不会去做很具体的事宜，只是把握整个部门的绩效和发展，所有下属都处在努力地、心情愉快地、主动、创造性地工作，下属个人和群体的绩效极佳。大家对X的感觉是敬畏、佩服、喜欢、信任、信赖、信服。


    摘自：黄训《领导者如何强化职权外魅力》，《领导科学 2015年2月上》


