  md: '的问题，我是不推荐你一定要采用，因为解决了一种公平感之后，还会带来新的公平感问题。如果大家都来质疑你的评价标准，那有点搞不定了。而且，采用这种方式还会无情地加大人力资源部门的工作量。


    今天的课实际上给上周五的课提供了一个例证，就是所有的工作都是在复杂情境下的一个决策问题，我们必须得给出一个性的方案，才能最终达到目的。理论有没有用？一定有。但是，理论只有在对你所遇到的问题有实质性帮助的时候，才是一个对你有用的理论。所以，好的管理功夫，就是先要把问题深入解析，然后再去选择理论。如果没有理论可以帮你，就找到一个别人的最佳的参考做法，试着解决你的问题。


    总之，今天我给你分享了公平的概念，对一个组织，这是相当重要的，请一定要慢慢体会，后面我还会给你一个阅读资料，供你参考，目的只有一个：找到属于你自己的创造公平感的心态。


    # 课后思考


    找一个你身涉及到公平问题的事情，你先试着分析一下。如果是你要破的局，放在《水木学堂》中，和同学们讨论。


    # 推荐阅读


    # 一、下属公平感的类型及成因


    人们把组织公平感分为三类：分配公平感、程序公平感和互动公平感。


    +   1. 分配公平是指组织资源在员工之间的公平分配。美国著名心理学家亚当斯，于1965年提出了著名的“公平理论”。他认为，人们关注的不是自身得到的结果的绝对程度，而是关注结果是超过或低于对公平的理解，然后再去选择理论，如果没有理论可以帮你，就找到一个别人的最佳的参考做法，试着解决你的问题。


    +   1. 公平原则。公平就是员工对组织的贡献和所得到的回报应当是一致的。


    +   2. 平等规则。平等就是同样对待所有人。


    +   3. 需要原则。需要是指组织资源对员工公平感的建立具有重大影响，即员工越需要的东西，对他们的分配公平感越有影响。


    +   4. 权力原则。具有较高地位、权力和控制力的人应当获得较多的资源。


    +   5. 责任原则。比如：那些承担较大责任和风险的人，应当拿到较高的薪酬。


    +   2. 程序公平感关注的是用来分配组织资源的程序。因此，程序公平的实质是当事人被提选参与决策的范围和程度。利文撒尔1980年提出：如果一个程序被人们认为是公平的，它应当符合以下五大原则。一是公正性。分配在合同不同人员、不同时间、不同地点之间应当保持一致。二是无偏性。决策者的个人偏向应当尽量避免。三是精确性。程序应当做到精确识别。四是可纠正性。在错误发生时，可以通过申诉机制进行救济。五是合乎伦理性。决策的制定应当遵循主流的道德。第六点应当确保被决策影响的不同群体的利益都能被加以考虑。


    +   3. 互动公平，是公平理论的最新成果。它主要聚焦于程序在被执行的过程中人们所遭遇到的人际对待的质量，涉及决策中的社会或行为情景，而不单纯是结果或程序本身。根据近近年学者的研究，互动公平又包括人际公平和信息公平两个维度。人际公平反映的是管理者在执行程序或确定结果时，是否用真诚的方式来对待员工，是否考虑他们的自尊、是否以礼相待。人际公平的原则包括：一是上司是否以真诚的方式待你。二是上司是否可以尊重的方式对待你。三是上司是否以礼貌的方式待人。四是上司是否避免对你进行不恰当的评价。信息公平反映的则是为何这些程序被使用，有出现这种分配结果，有关的信息是否向员工进行了详细、合理的解释说明。


    > 摘自——洪光平“下属公平感的由来、类型及对策”，《领导科学 2016·6月下》


    # 二、公平感与员工工作行为


    北京大学张燕、解蕴慧、王沪以来自3家中国服务行业的247位员工为研究样本，他们发现，程序公平对任务绩效和组织内的互惠互助行为的影响通过心理安全感作为中介；分配公平对任务绩效和组织公平行为有直接作用，而不通过心理安全感中介。程序公平比分配公平更能促进员工的心理安全感，程序公平对人们的心理状态、态度、价值观等影响更显著。


    > 摘自——张燕、解蕴慧、王沪“组织公平感与员工工作行为：心理安全感的中介作用”，《北京大学学报（自然科学版）第51卷 第1期 2015年1月》


    # 三、公平感与报复行为


    中国人民大学徐世勇、欧阳侃以546名企业员工为研究对象，发现：


    +   1. 如果员工认为上司在领导公平方面做得不好（包括不尊重下属的感受，不能客观评价下属的工作等），他们会出现较多的主动性组织报复行为。


    +   2. 在领导水平较高的情况下，如果上司能够与下属公平地沟通的问题（如薪酬等），会进一步减少员工的组织报复行为。然而，在领导水平较低的情况下，提高信息公平但不平衡公平的组织报复行为。还会起到适得其反的作用。因此，当下属对上司的领导公平评价较低时，上司的“做”比“说”更容易改善下属对上司的看法，进而减少下属的组织报复行为。


    > 摘自——徐世勇、欧阳侃“基于参照认知理论视角的领导公平与信息公平对组织报复行为的影响研究”，《管理学报》'
