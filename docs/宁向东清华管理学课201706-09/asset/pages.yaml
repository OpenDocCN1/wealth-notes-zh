  md: '# # 周末复盘 | 把团队成员还原成生活中的普通人


    周末复盘 | 把团队成员还原...


    # — 一周复盘 —


    一周过得真快，又到周末，我们一起对本周的内容做个复盘。


    我们这一周的核心内容是团队建设。上一周讲的内容，是如何组建一个团队，第一天我就强调了一个观念：组建的目的，是为了让强者的人实现一个目标。所以，建设团队也不能忘记团队的目标是什么。


    本周给大家介绍的核心理念是四个共同体。第一种共同体，叫做业共同体。组织的大部分成员，加入的是一个职业共同体。在这个共同体状态下，员工上班就是为了工作而工作。领导不要让人家和你结成职业共同体。凭什么？所以，到什么山，唱什么歌；是什么人，说什么话。这是我的一贯主张，否则都是白费工夫。


    对于职业共同体的团队成员，就是给人家必要的尊重。该给人家工资给，及时给。中国古人讲，人心换人心，一两换半斤。你对人家好，绝大多数人是会感激的，要懂得形成社会交换的观念。我就讨厌员工工资拖欠的状态，张口就是，你凭什么？就是因为没给人家发工资吗？你是自己给人家发工资吗？人家难道不干活吗？


    管理的核心目的，是为了达成目标，所以，比职业共同体再高一个境界的，就是利益共同体，用利益去绑定一些关键的人。这是年终发奖金或者，考虑给员工多发一点钱，如果公司的长远未向好，大家可以通过骨干持股的方式，共享企业发展的成果。员工持股向骨干参与持股，大家都知道这是利益共同体。其实，年终奖和业绩挂钩也算是利益共同体的一种形式。很多人推选年奖，年终发了奖金就走，这就是利益标志的标志。


    事业共同体，比前两者再高一个层次。怎样结成事业共同体，周四的课中，我提到把事抽象分层，通过指标落实到更多的人头上。员工知道目己完成了目标，且能够懂得自已整天完成的目标，实质上是一个伟大的事业变革的基础，是满足了人的某种需要，改善了客户的生活质量，他就会有觉得这样做是有意义的，他的工作是有意义的，这个组织是有前途的，这样就容易把更多的人拉入事业共同体的境界。请注意，事业共同体和它的共同体是交互相通的。


    周二、周三的课，都是介绍了团队建设的一些具体方法。无论是背景分享，还是世界咖啡馆，都是让团队成员有交流、形成默契、达成合作的方法。类似的方法还有很多，但是，我们不能忘的有方法都是工具，都是为目的服务的。在现实生活的团队建设中，很多忽视目过的，注意到组织方向创新，却忽视目过的。有的时候，我们的团队建设更像福利，对现实中的工作效率提升，缺少帮助，这是一个误区。


    周五的课，讲到了团队的边界。大道理不用多讲，只要把我们每一个人都还原为生活中的普通人，我们就知道怎样去对待每一个团队成员。这一讲最重要的内容有两条：第一，就是要把团队中的核心成员的私事同工作划开，不要把，要留意那些双重角色的人，不要让他的人生角色过多地越位。要解决这些问题，我觉得核心是领导层面的，多换位思考，并且带头缩短工作时间段内的工作效率。


    古典老师这一周在讲职场中，我特意请他约 一篇文章做复盘未彩，我请约古的古典老师的一片心，我也谢谢他。


    周末回访：团队的九大角色，你在哪一个？


    古典的《超级个体》全年 专心为为你准备了150多个“个人成长”和“职业发展”相关的工具包，解决90%的职场人都会遇到的问题。


    别忘了，职场是个体和坏境。有些最有效的方法是建立更坏的，与些同事求教，不如请古典老师给你开个小组。


    今天是周末。我提个建议，大家减少一点工作 学习的事情，比如减少小时间，天塌不下来。去光顾你的家人，去关照一下你自己。


    祝大家周末愉快，我们周见。


    # — 一周留言精选 —


    张化彬：


    成为利益共同体的基础是你们有共同的短期利益；成为事业共同体的基础，是你们有共同的长期利益。总之一句，你们想到的是共同，而不是为自己。成为命运共同体的基础，是，你们有共同不能失去的东西。给你涨50%工资，你愿意干吗？这是利益共同体，给你降50%工资，另外你是做，拿500万收益，你愿意干吗？这是事业共同体，给你降50%工资，另外你将承担500万投资，如果做成败，拿500万收益，你愿意干吗？这是命运共同体。


    冰雨冷菜：


    四个共同体是基于彼此承担的责任和风险大小确定的，命运共同体事业共同体、利益共同体、职业共同体对应企业的合伙人中层及员工对应于一班员工。不同共同体激励建立不同的共同体。因此采用的团队激励方式也不同。一般员工和中下层员工，常采用的基层抓训练或者打饭、唱歌等传统的制度方法，很多是对于达成目标之后的奖励。中高层核心员工，常采用的是价值觉训、职业规划、股激励等。


    陈钦发：


    背景分享，可能不是一个万能的方法，但是一个值得尝试的好方法。有些个团，还没形成帮派，这么相处之间才可以安心。


    tongliu213：


    老师今天谈到心理契约，让我想到个问：那，就是人与人实际对方价值有相互情感。心理契约其实是一个心理的状态，人满下看着，下属不满意，其很大程度上是处于属于相信
    的满程度，也就是下属于比较之后的心理满足感。绝对值提升了，但人提升的更快，下属也会有心理的落差。心理契约提升点，但下属相信对别人提升得快，也许下属心理的信觉得要表面。所以，作为领导，不仅需要看到激励对敬值的增强，更要看到对敬信的变化。


    一个人发呆：


    我觉得最有沟通是发生在朋友之间的，朋友之间沟通，不会有一个人来判决是非的，大家都知道讲对方是一个劣事，并且周围的人都知道的，甚至认真的反应。从这一个角度，可以激发对方特别的想法和观点，最终大家都达成一致的，不同的沟通，则更多的是相反的情况。老板提出一个问题，大家围绕着这个论题讨论，若是没有按照领导的意愿往下走，会收到批评；这样的沟通结果，是得到一个老板想要的答案，而不是得到大家都真的经过思维碰撞后的答案！


    皮子：


    回想起去年11月，10号同事的妈妈因有成都加班没接11，同一个同事的妈妈和爸爸的哭来着。她的弟弟在成都，哭完，领导没有问没在问题，着急气气手足，给她妈妈。后来，11月领导考虑到，给她打电话。现在，在两种角色冲突时，领导的态度就体现出来。'
