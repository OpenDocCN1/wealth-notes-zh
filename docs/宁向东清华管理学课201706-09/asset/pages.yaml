  md: '# 015讲：正念·减少心力的流失


    015讲：正念·减少心力的流…


    你好，欢迎回到《宁向天的清华管理学课》。


    我先问你一个问题，你知道乔布斯为什么只穿一种黑色套头衫和牛仔裤吗？答案后面再告诉你，我们看到的是，当他在品... 答家，你下次再看到一些企业家在品发布会上也穿成乔布斯那样，一定会在心里笑疯了。


    # 1、认知吝啬：我们会本能地节省心力


    今天的课，我们从一个概念开始：认知能量。什么叫认知能量呢？就是当我们注意到一件事情时，对进行分析、判断、乃至记忆的时候，都是需要花费心力的。为了记住它、理解它、解释，就是“心力”。人的心力是有限的，所以我们无意识也会下意识地去节省心力。心理学里创造了一个词叫“认知吝啬”，就是用来描述这种节省。


    比如我们坐在汽车里旅行，很多时候眼睛看着窗外，但“凭感觉”判断车没有向动，那么，我们的“信息量”，我们... 不去注意这些变化，仿佛它们并不存在。这就是“认知吝啬”，或者叫“节省认知能量”。


    我们读书的时候，一道题怎么做，我们每个步骤肯定要想一想，但是，有的人用脑子去分析，有的人则... 来，思考时间就会... 转念去问同，这也可说是一种认知能量的节省。我要去解决一个目标，认可能量，或者说心力，比如解决一块...
    这是能或者蓄意量力而行，即投资你的一个重要的意义，就是在节省你的心力。也就是说，会从两个方面燃烧的：


    +   1. 就要把你的电池容量在原有的基础上尽可能增大。

    2. 也要知道，要想有得去学... 使用效率，让它的效用效率变得要高。


    当一块电池充满了，我们应该怎么更好地使用电池，更有效率地分配电量，其实是一门学问。人也一样，当你时刻有... 外信息都加入，也让你去关注，那么你的，就像电池一样很快把电耗光，就像我们说的，在最重要的事情上精力不够...
    必要的，要学会作这样的选择。


    我们很小的时候，老师和家长都教育我们应该养成好习惯，要有好的态度，认真，其实我们并没有按他们... 对待每一件小事。很多时候，我们事前要... “拍脑袋”。在很多事上，我们都有“差不多就好”的原则，为什么？说到人对...
    事情... 不花心力。但聪明人只把最重要的事... 不轻率，不急躁，不浪费心力，而那些不重要的小事，其实就比我们在本能地消耗心力进行过多的比较。


    # 2、乔布斯的黑色衣服


    了解了“心力”这个概念之后，我们再回到乔布斯衣服的问题上。乔布斯只穿一种黑色套头衫和牛仔裤，是因为他... 黑衣服，也不是... 为了让大家看到一个统一的形象。更重要的，是他认为，这样做可以最大程度地节省他的人力。


    乔布斯知道，人的心力是有限的。每一周... 就先去想什么，再想一想怎么，不... 路上经过，... 你的，... 工作岗位真正投入到工作的时候，你的心力也许...
    消耗多。乔布斯拒绝这种无谓的消耗，所以他不在衣服上... 上，而且是几乎在衣橱里... 衣橱，只能选择一件衣服。


    这里还有个故事，乔布斯之所以选择这种黑衣服，是因为他... 日本... 三石... 穿... 一件衣服。三石... 乔布斯... 他说... 人比较...
    翻译“一些”... 100件。当乔布斯看到这100件衣服以后，他说，“够了，可以穿一辈子了。”


    ![](img/e9c4ead90d162cb22377bd13386f3198_35_0.png)


    在这点上，他认为格... 乔布斯的直... 在... 每天... 衣服... 穿... 不... 每天... 还... 员工... 这样，希望员工把节省下来的心力都用在工作的上。


    那么，乔布斯... 这一套... 书... 乔布斯... 在回忆信... 说过... “在印度的村庄里... 个月... 我... 到... 世界... 当你...
