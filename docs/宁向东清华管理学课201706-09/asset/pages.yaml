    所以，需要反复地把个人化的洞察和经验与同事进行分享、交流。如果工作场所的情绪不够积极，大家在讨论中就易产生冲突，而这种冲突就可能带来负面的东西，会降低交流和讨论的效率。我的这位学生认为，对于研发性的组织，如果没有积极的情绪，那是一种消极情绪，而他的微笑就是希望传递出一种积极情绪，进而影响到整个组织。


    总结一下，今天的课主要讲了两点：


    +   1. 情绪会影响我们的决策，情绪本身就会参与决策。

    2. 情绪是第一生产力，管理者要善于控制情绪，使用情绪和传递情绪，这是管理学的价值所在。


    今天的课后有一个推荐阅读，你一定要看。这份阅读比较了马云和他在在在面对困境情绪上的不同。你可能很能感叹马云今天的成功，但你必须要了解马云在1999年“落难”时，内心所保有的积极情绪。马云正是通过让这种积极情绪来影响团队，才有了后来的阿里巴巴。


    # —— 课后思考 ——


    作业：阅读推荐阅读的文字材料，并深入思考今天讲过的内容。

    别忘了，你手上还有免费分享给20个人的权利，如果你发现现在需要积极情绪，马上把今天的课分享给他。


    # —— 推荐阅读 ——


    ![](img/e9c4ead90d162cb22377bd13386f3198_34_0.png)


    # 马云积极情绪表现：


    +   1、积极情绪类别：快乐


    我希望每一个员工都是笑眯眯的、竞争是一种快乐。

    创业不会给你带来幸福感，而会给你带来快乐，但快感的背后会带来很多痛苦，真正的幸福感是你知道自己在做什么，知道给别人做什么，你会逐渐从痛苦中找到那些快乐。

    来源：马云2005年在上海网商论坛上的讲话、《马云的人生哲学》


    +   2、积极情绪类别：激情


    短暂的激情是不值钱的，只有长久的激情才是赚钱的。

    创业不是为了赚钱，而是你喜歡它，你喜欢这个过程，你喜欢做这件事情，那是最大的激情。

    “马云是一个有理想的爱激情驱使的人”——刘世英

    “他说的话会让你振奋，没有希望的东西在他看来也充满生机，他能给身边的人生活的激情”——张红《海博英语翻译社合伙人》

    来源：马云2007年在《赢在中国》节目中的点评


    +   3、积极情绪类别：希望


    幸运的是，未来互联网产业会比较坚强并且充满希望，只要活着就有希望。

    马云是无法复制的，世界上不可能找出第二个马云，他是一个目标非常坚定而且非常自信的人——戴珊（阿里巴巴创业伙伴）

    来源：《马云管理日志》


    +   4、积极情绪类别：乐观


    创业者具有乐观精神才能走很远。

    永远积极乐观地看待未来。

    “当时的信心没有马云足……我没走在尽道上”阿里也巴芭送一死，其他人嘴上不说但心里都是这么想。只有马云乐观”——吴炯

    来源：2008年，马云在第二届APEC（亚太经合组织）工商咨询理事会亚太中小企业峰会上的讲话《感恩 坚持 改变》


    # 马云和创业伙伴情绪对比：


    事件1：1994年，海博英语翻译社入不敷出

    合伙人的消极情绪表现：创业的朋友中途退出——不抱希望。

    马云的积极情绪表现：于马内销售小件支持海博英语翻译社日常运营——希望、乐观。


    事件2：1995年12月，中国黄页刚成立几个月

    合伙人的消极情绪表现：宋卫星提出投资——对黄氏失去信心。

    马云的积极情绪表现：进入北京进行广告宣传，包括在《中国贸易报》、《人民日报》、《东方时空》等宣传页面——激情、希望。


    事件3：1999年，从北京辞职回杭州再次创业

    合伙人的消极情绪表现：当时……金健说：“大家眼睛是怎么睁开的呢”都是迷茫、空洞的”、“他说要做最大公司的，那个说法，我一点也没激动……我不太相信这个说法”——彭蕾

    马云的积极情绪表现：站在桌子上快速而疯狂地发表激情洋溢的演讲——激情。


    事件4：2000年互联网寒冬

    合伙人的消极情绪表现：Porter说：“公司里40个老外，只剩下5个了……心里很失望”。

    马云的积极情绪表现：“跪着也要活下去”、“我们一定会赢，我们一定会重新站起来，我们一定会取得这场战役的胜利”。


    > 资料来源：周小虎,秦凤.陈荣. 企业家创业认知的积极情绪理论[J]. 中国工业经济,2014,08:135-147.'
