    ### 環保人士：比特幣挖礦恐破壞環境


    CNNMoney 網站報導，部分專家表示，比特幣「挖礦」耗費大量能源，可能對環境帶來傷害。


    反對人士批評比特幣不過是一場「騙局」，並警告投資人須慎防泡沫破滅。而環保人士則更擔憂，比特幣恐將嚴重傷害全球對抗氣候變遷的努力。氣象學家霍特休斯（Eric
    Holthaus）表示：「比特幣拖累石化燃料過渡至再生能源的速度。」


    比特幣這類虛擬貨幣與美元、英鎊不同，並不受中央銀行管控，而是礦工在數據中心使用電腦挖礦取得，過程耗費大量電力。


    數位貨幣網站 Digiconomist 編纂的「比特幣能源消耗指數」顯示，比特幣挖礦每年約耗費 32 兆瓦的電力，足以供應約 300 萬戶美國家庭的用電。相比之下，信用卡公司
    Visa 每年處理數十億筆交易的消耗電量，約能供應 5 萬戶美國家庭的用電。


    更可怕的是，隨著比特幣不斷發展，礦工必須解決的數學題目難度增加，意味著挖礦過程將耗費更多能源。霍特休斯預測，若繼續維持現況，那比特幣耗電量在 2019 年中時將等同於全美用電量，而到了
    2020 年時，比特幣耗電量將與全球用電量一樣。


    此外，由於土地與電價便宜，大陸成爲比特幣挖礦重鎮，但當地許多煤炭發電廠產電效率低落、污染嚴重，令環保人士更加憂心。Digiconomist 指出，內蒙古地區一座比特幣礦場耗費的能源，相當於飛行一輛波音
    747 的電量。


    澳洲昆士蘭大學經濟學教授奎金（John Quiggin）表示：隨著芝加哥商品交易所（CME）和芝加哥選擇權交易所（CBOE）等機構計畫推出比特幣期貨，比特幣未來電力需求只會持續攀升，政府機關應盡快想出解決之道以保護環境。/2017/12/9*


