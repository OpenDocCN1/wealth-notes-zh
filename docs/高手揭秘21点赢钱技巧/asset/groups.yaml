    當你遇到困難的時候，生氣是不好的對策。我的方法是

    不斷的思考問題的根本，並且做一些其他事情。有些時候，

    我甚至花了好幾年的時間才看到答案，以黑洞和訊息遺失的

    例子來說，我花了 29 年才找到答案。——史蒂芬·霍金，英

