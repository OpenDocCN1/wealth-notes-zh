    Fitel 的主要經營策略在於，為各家投資公司打造出一套全球電訊網路系統，貝佐斯最早的工作任務只是排除電腦軟體程式錯誤；但很快一路晉升，掌管研發部門與客服部門。


    貝佐斯在 Fitel 任職約兩年，積極尋求擴展企業卻未能如願，決定跳槽，加入了後來被併入德意志銀行（Deutsche Bank）的金融機構信孚銀行（Bankers
