    第 21 條建議，則是由本書首先提出——：


    一般人的股市經驗太不豐富了！股市是個專吃散戶的市場！散戶買進股票之後，大多往自己預期的方向的相反走去，這就好像 引人入勝的故事神奇一般；在「孟喬森男爵（Baron
    Munchhausen）冒險」裡面的幾個有趣的故事——：


    - 在很冷很冷的聖彼得堡搭馬車，馬車夫吹起角笛，沒有發出任何聲音。車到了旅館，車夫將角笛掛在壁爐邊的牆上，角笛卻響了。喔，原來是剛剛的聲音凍僵了，遇熱才溶化發出來。

    - 同樣是冬天，到了下大雪的波蘭，把馬栓在雪地裡的木椿上就睡著了，第二天醒來發現自己在教堂前的廣場上，可是馬呢？馬怎麼不見了，被偷走了嗎？抬頭一看，馬趴在教堂的屋頂上，原來栓馬的木椿是被大雪埋起來的教堂屋頂十字架！

    - 去打獵，看見一隻美麗的鹿在前面，開槍才發現子彈用完了。不甘心眼睜睜看鹿跑掉，隨手拿了櫻桃的籽裝進槍膛裡，砰，射中了鹿的額頭，可是鹿還是大搖大擺地跑開了。兩年之後再去同一座森林裡打獵，碰到了一頭特別的鹿，花色美麗，而且額頭上多長了一根角，仔細一看，那不是第三隻角，是一棵小櫻桃樹。


    這些故事收錄在《孟喬森男爵在酒會中談到的水陸驚險旅行和出征冒險》的書裡；如果有人真的在酒會中碰到孟喬森男爵，一定會笑著罵他「吹牛」、「瞎扯」，可是卻又一定走不開腳步，一直停在他身邊想聽更多的「吹牛」、「瞎扯」。


    我認為：那是一種瘋狂的生活方式。無論在什麼情況下，這都可能是一個壞的主意。但是，如果你已經很富有了，這種情況是絕對不會發生的。——華倫·巴菲特（Warren
    Buffett）


