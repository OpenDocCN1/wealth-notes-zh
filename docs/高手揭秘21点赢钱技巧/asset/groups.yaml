    \n超過 36%的人如今選擇租屋，而金融風暴前的 2007 年底只有 31% 。\n\n大約有超過 230 萬家庭瀕臨無家可歸窘境，37 歲的萊賽蒂．杜爾特就是其中一員；她的丈夫三年前丟掉工作，因收入減少，他們全家大小搬離三房的房子，最後住進旅館。\n\
    \n一年前，他們搬入了兩房的公寓，月租約 1600 美元，是萊賽特每月工資的一半；他們家都使用預付費的手機，從不外出吃飯或度假，剩下的錢全都用在支付健保。\n\
