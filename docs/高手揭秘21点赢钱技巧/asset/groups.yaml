    <台積電>上市超過 23 年，市值從 748 億元攀增至近 5.72 兆元，翻了 76.3 倍，不僅穩居台股權值王，也躍升爲全球半導體巨擘。<台積電>賺錢一把罩，年年賺錢、配股配息，股價表現也沒讓人失望，若投資人從上市抱到現在，投報率高達
    89.6 倍，十分驚人。


