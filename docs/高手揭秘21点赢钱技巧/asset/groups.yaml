    ## 別管黃金了 包裝成投資產品的鑽石可能比黃金更能避險


    每當談到避險資產時，投資人想到的常是黃金或公債；如今新加坡有一家交易所——開始交易以信用卡包裝呈現的碎鑽，提供投資人避開全球風險的另一管道。


    黃金僅依據標準重量和純度的兩項標準即可交易；但鑽石則因切割、淨度、色澤和克拉的多重因素而有所變動；這使得鑽石更難以用投資的方式買賣交易。為了解決這個問題，新加坡鑽石投資交易所（SDiX）正推出一項「鑽石條」(Diamond
    Bullion) 的投資產品，或一組投資等級的拋光寶石，面額介於約 10 萬美元至 20 萬美元。


    SDiX 創辦人兼執行董事長范登伯（Alain Vandenborre）表示：「一顆鑽石和其他資產類是絕對零連動，不論是商品債券和股票。鑽石就是財富的儲蓄，是能避開波動的避險資產。」


    范登伯指出，上述產品是 Singapore Diamond Mint 公司發行，


    鑽石來源爲透過鑽石開採貿易公司戴比爾斯 (De Beers) 和俄羅斯埃羅莎集團 (Alrosa) 的批發市場，鑽石色澤和淨度都必須列於前五級內。


    不過，網站 PolishedPrices 的資料顯示，鑽石價格已從 2011 年高點下滑逾 30%，主要受到中國市場趨緩，以及年輕消費者在智慧手機和裝置上花費更多所致。黃金價格從當年高點回落的跌幅也差不多，因股市回升和全球經濟復甦。


    自稱爲全球唯一電子交易投資級鑽石的 SDiX，從去年 5 月至今的鑽石交易規模約 1.65 億美元。新加坡投資公司淡馬錫 (Temasek) 正透過旗下創投公司
    Vertex Venture 控股資助該交易所，擁有 20.75%的股份。／2017/10/10*


    ## 養老金怎麼存？ 諾貝爾獎得主理察.塞勒有3法則


    想要安心退休養老，究竟錢要怎麼安排最好？諾貝爾經濟學獎新科得主理察.塞勒 (Richard H. Thaler，1945~) 2017/10/9 表示，一般人的投資行爲太多「錯誤」出現，他提出儲蓄養老金的建議，包括個人應避免投資股市，同時做到「存滿
    401K」、「把錢放在費用低的目標期限基金 (Target Date Fund)」與「不要打開定期寄來的投資賺賠對帳單」三大原則。


    畢生研究行爲經濟學的塞勒說，人們投資錯誤的行爲，可以列出一大串；例如，「去貸了根本無力償還的貸款」、「去借了還不了的信用卡現金」、「把錢放在信用評級高的投資帳號，殊不知此金融產品已經被投資商收購」，上述行爲可說從頭錯到尾。


    塞勒說：很多人都認爲自己可在股市獲利，但「規模龐大的投資公司、股票企業，都無法戰勝股市，僅憑個人做出的股票


    買賣，如何有能力在股市保證獲利？」


    塞勒表示，大部分人所面臨儲存退休金的最大問題，就是「沒有做好足夠的功課」；他直言，「個人投資者不應買賣股票」，因爲「專業的機構都無法打敗股市，個人投資者憑什麼認爲自己能勝出？」塞勒說，要做好最佳的退休儲蓄準備，他認爲最基本且最重要的儲存养老金有三大原則——：


    - 「把 401K 每年規定的儲蓄上限存滿」；

    - 然後「把錢放在費用低的目標期限基金(Target Date Fund)」；

    - 此外「不要打開定期寄來的投資賺賠對帳單」；


    他表示，經濟學家認爲他們可解決問題，一般人也可以解決，但「事實不是如此」；塞勒舉例，很多人都對於要如何平衡收支，都感到困難，要他們「理解自己要怎麼樣正確投資，存到足夠的养老金」更不可能，因此這方面「人們需要幫助」。


    究竟要如何使經濟學落實到普羅大眾？塞勒表示，必須將經濟學理論加入「真人」(real people)的考慮，這樣不管對政策、對商業策略或投資大眾，都有好處。


    喜歡美食、收藏美酒的塞勒說，有大方校友承諾要送他很棒的酒，他非常期待；至於他曾幾次到訪的中國，塞勒提到，他很喜欢中國美食。／2017/10/10*


    ## 台灣也該思考的警訊：日中小企業 無人接棒而關門危機


    在 2017 年時，日本有 127 萬家左右的中小型企業，將可能因無人接棒而面臨關門的風險；目前日本有半數停業的公司便因爲這個理由而關門大吉，儘管這些公司仍有盈餘。但到了
    2025 年，


    逾六成中小企業可能年齡都由年屆 70 歲、甚至更年長的管理者經營，顯示這個危機只會更有增無減。


    有鑑於上述現象，日本政府正加緊避免這些公司全軍覆沒，因這種大規模歇業的現象，不僅會削弱日本產業的支柱，更可能導致日本獨有技術流失。


    東京商工研究機構的資料顯示，去年 2 萬 9,583 家日本中小企業暫時或永久歇業，遠遠高於 2007 年的約 2 萬 1,000 家。日本人口萎縮已使愈來愈多企業被迫關閉。


    東京墨田區一家 1924 年開業的皮下注射針製造商岡野工業，以獨有技術在全球享有盛名，但如今其高齡 84 歲的董事長岡野雅行卻對公司的未來感到悲觀。


    岡野雅行表示：「我想我大概兩年內就要把公司關了。」岡野雅行沉穩的語氣，顯示他已經對這現象了然於心。


    甚者，以耐用、不沾手著名、號稱粉筆中的「勞斯萊斯」的<羽衣牌>粉筆，兩年前也因後繼無人而被迫關閉，最終將粉筆製造設備移往南韓，當時這項消息據傳對常使用粉筆的全球數學學者是一大噩耗。


    日本經濟產業省內部統計資料顯示，若這現象持續下去，到 2025 年將導致約 650 萬個就業機會流失，國內生產毛額（GDP）也將損失 22 兆日圓。日本政府企圖在未來
    50 年左右祭出對策，以避免企業大規模歇業的窘境；政府計劃大幅改革這些領域，也將减轻中小企業面臨併購所帶來的稅負。日本商會專家和其他機構也正協助爲 800
    個企業案件尋找繼任者，未來五年每年可能成長至 2,000 件。／2017/10/10*


