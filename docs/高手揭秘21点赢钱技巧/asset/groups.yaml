    # MSCI最新調查 CEO薪資越高 績效不一定越好


    《華爾街日報》報導，美國許多大企業多年來支付執行長優渥薪酬，認為提高薪酬能激勵表現、提升股價，但最新研究指出，執行長薪酬高低與公司績效不必然相關。換句話說，薪水越高的執行長，績效表現不一定越好。


    投資研究機構 MSCI（明晟）針對美國 423 家企業進行調查，比較這些公司在 2006 年至 2015 年這 10 年來的股價報酬與執行長薪資間的關聯性。研究發現，兩者間並無太大關聯。10
    年來股價表現最差的_company_裡，不乏許多薪酬極高的執行長，反之亦然。


    MSCI 環境、社會與管理研究部門執行董事馬歇爾（Ric Marshall）表示：「執行長薪酬與公司績效間無法推論出任何模式。」


    新研究指出，若以 3 至 5 年來看，執行長薪資越高，公司績效確實會較好。但馬歇爾表示，一旦把時間拉長，2 者間的關聯便'
  - '[PAGE 103]


    會消失。


    馬歇爾表示：在這些企業當中，高達 6 至 7 成的公司採取每年發放股票選擇權的方式做為執行長薪水，選擇權期限通常為 3 年。


    而許多績效表現最佳與最差的公司支付的是中等薪水。不過，在支付最高薪酬的企業裡，績效最佳的較高，而支付最低薪酬的企業裡，績效最差的比例亦較高。而與其他公司相比，那些薪酬最高與績效最差的
    20%公司，每年平均多支付執行長 1 千萬美元的薪資。


    事實上，MSCI 去年亦曾做過類似研究，當時研究發現，公司績效與執行長薪酬間的關係相當微弱。/2017/10/7*


