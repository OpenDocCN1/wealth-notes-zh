    現處於一個不正常的雙向交易市場


    芝加哥選擇權交易所（Cboe）公司周日開始交易比特幣（bitcoin）交易時，據傳高盛公司（Goldman, Sachs）將替客戶辦理結算交易。


    <高盛>將扮演中介的角色，不會扮演市場做成型（market maker），也不會建立庫存，替客戶承辦的交易，也會視個案而定。


