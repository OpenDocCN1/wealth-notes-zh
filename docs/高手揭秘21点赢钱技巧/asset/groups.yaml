    # 忍者投資術都能贏


    # 6成外國人相信忍者存在 日本爆「忍者荒」


    歷史悠久的日本特殊職業「忍者」，近年來紛紛開出了職缺並積極招募人才！


    根據《NHK》報導，隨著訪日外國觀光客數量逐年增加，日本各地面臨了一波嚴重的「忍者荒」，而其背景原因是，竟然有高達 60%的外國人都相信：忍者確實依然存在，甚至有不少人訪日的旅遊目的，就是為了「拜訪忍者」！


    2015 年所成立的「日本忍者協會」，最近針對世界 10 個國家和地區，進行一份問卷調查，發現高達 98.7%的外國民眾有聽過忍者；而其中 60%的民眾居然相信，忍者還存在於現代日本，執行情報收集、刺殺等秘密任務。


    許多外國人非常熱愛忍者，甚至也有國外觀光客只為了「見忍者一面」特地跑來日本，到各地影城和忍者村觀看特技表演。如位於東京新宿的忍者表演設施，近年來吸引大批外國遊客遠道而來，人氣高到需要一個月前預訂，才能買到票；而北海道登別市的時代村的忍者秀，也在近
    10 年來入場人數成長了 4 倍，一年可達 30 萬人次。


    忍者的人氣那麼高，日本國內卻面臨著忍者人力缺乏的問題。由於外國觀光客受到電影、動漫的影響，普遍對忍者的特技持有很高的期待，但射出手裡劍等武打動作需要很高的技巧，其訓練過程非常辛苦，因此日本國內被認定為「及格」的忍者非常少數。


    在北海道時代村裡，目前能夠上場表演的忍者只有 8 個人，不僅需要一人演 2 個角色，有時候還得兼差調配音樂和燈光。然而，該時代村也開設了訓練教室，但要成爲能夠上台表演的忍者，至少需花半年以上的時間，不僅要學會使用
    10 種以上的武器，還得熟悉忍者相關的文化，因此近 5 年來只有 5 名學生成功結業。


    面對即將到來的 2020 年東京奧運，日本國內需要更多專業的忍者，爲了滿足外國人對忍者的期待，日本各地紛紛開設了忍者養成班，也有大學開課相關課程，正在訓練大量的年輕忍者。／
    2017/9/27*


    # 金融危機將滿10年 花旗要讓這項惡名昭彰產品復活


    2008 年因擔保債權憑證（CDO）遭受龐大損失而被迫申請紓困的花旗集團，如今卻又要積極兜售這個被電影「大賣空」喻爲原子彈、市場規模約 700 億美元的 CDO，而要讓
    CDO 起死回生的代言人，正是 35 歲的花旗董事 Jia Chen。其實不只花旗，華爾街如今也想搶占更大市場。


    過去兩年 Jia Chen 一直不斷会晤客戶，在業界會議上發言，儼然成爲 CDO 復活的代言人，目的就是要讓在這塊市場坐擁逾半數交易的花旗集團，確立主宰地位。


    CDO 爲一種複雜的衍生性金融商品，讓買家藉此對體質健全的美國企業進行高額的槓桿押注，但 CDO 曾在金融危機期間成爲眾矢之的，卻又在幾乎摧毀了金融體制後遁於無形。如今花旗表示，要用不同的做法捲土重來，這些交易將爲客戶量身打造，使其免受任何損失，同時讓渴求收益的買家有機會獲取
    20%或更高的報酬。


    和金融危機之前的規模相比，現今的市場規模很小，且很少人預期公司違約數會很快飆升，但隨著全球多年來利率處於極低水準，促使投資人轉向更高風險的商品，因此 CDO
    復活恐成爲信用市場邁向泡沫的最明顯跡象之一。


    華爾街的其他銀行從金融危機後一直規避 CDO 市場，如今卻企圖爭取更大的市占率。知情人士透露，法國巴黎銀行同樣活躍於 CDO 領域，其他銀行業者也急於跟進。


    在金融市場擁有 30 年資歷的老將、目前爲顧問公司負責人塔瓦科莉（Janet Tavakoli）則對此警告：「現在金融圈有一整個世代的年輕人士，完全不知道或忘記
    CDO 曾有的問題，就像衍生性金融商品可以拉起漲勢，也可加劇跌勢。」／2017/9/27*


    # 再試一次，你就有可能達到成功的彼岸！


    有一個年輕人到微軟公司應聘，而該公司並沒有刊登過招聘廣告；看到總經理的疑惑不解，年輕人用不太嫺熟的英語解釋說自己是碰巧路過這裡，就貿然進來了。總經理感覺很新鮮，破例讓他一試。面試的結果出人意料的年輕表現糟糕。他對總經理的解釋是事先沒有準備，總經理以爲他不過是找個託詞下台階，就隨口應道：「等你準備好了再來試吧」。


    一星期之後，年輕人再次走進微軟公司的大門，這次他依然沒有成功。但比起第一次，他的表現要好得多。而總經理給他的回答仍然同上上次一樣：「等你準備好了再來試。」就這樣，這個青年先後
    5 次踏進微軟公司的大門，最終被公司錄用，成爲公司的重點培養對象。


