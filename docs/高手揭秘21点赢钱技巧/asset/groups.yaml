    \n## 全球暖化 最嚴重六分之一生物將滅絕\n\n一項新的分析研究顯示，在最嚴重情況下，全球暖化將導致六分之一生物滅絕。康乃狄克大學生態學家厄班整合和分析\
    \ 131 份有關物種的研究報告，使用多種電腦模擬方法，得出全球物種平均的滅絕率將爲 7.9%；這一數據是所有物種、所有地區的平均值，而且建立在對未來人類溫室氣體排出量的預測假設之上。\n\
    \n這並不意味著所有生物都將滅絕，而是一些生物的数量將會產生不可逆轉的減少，直到逐漸消失。在所有地區中，歐洲和北美的物種滅絕速率最慢，分別爲 5%和 6%，而南美洲的情況最爲惡劣，物種的滅絕率將達\
    \ 23%。\n\n物種的滅絕率會隨著時間以及溫室氣體量而變化，目前的滅絕率處於只有 2.8%。\n\n如果氣溫上升攝氏二度，5.2%物種可能消失；如果上升攝氏三度，滅絕比率可能增至\
    \ 8.5%；最壞情況下，本世紀結束時上升攝氏 4.3 度，多達六分之一物種可能滅絕。\n\n全球變暖將會導致很多生物將棲息地轉移到離開北極更近的地方。但是有些生物，尤其是如美洲鼠兔\
    \ (pika) 這樣的山地生物將會無處可躲，最後由於無法逃離熱浪而滅絕。\n\n然而，厄班還表示，由人類所引起的動物棲息地流逝所導致物種滅絕比全球氣溫變暖導致的滅絕更爲嚴重。\n\
    \n物種大滅絕正在進行當中，在所有因爲自然而滅絕的物種當中，有 1000 個物種的滅絕是由於人類行爲導致的。厄班說：「我不知道能否把現在的時代稱爲大滅絕，但是我們的確在朝那個方向邁進。」/2015/5/2\n\
