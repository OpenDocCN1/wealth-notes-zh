    # 美國企業董事會…白人男性漸失寵


    《華爾街日報》報導，白人男性在美國大企業董事會的獨霸地位正逐漸流失。


    人力資源業者<史賓沙公司>分析 2017 年股東委託書發現，在標準普爾 500 指數成分股最新任命的 397 名獨立董事當中，女性和少數族裔佔了半數，這個比率是<史賓沙>自
    1998 年開始追蹤該數據以來最高。


    趨勢變化有一部分反映股東所施加的壓力。法人投資者正「不斷提出董事會多元化議題」，例如基金業者<道富環球投資管理>今年投票反對約 400 家公司的特定董事連任，理由是未能切實解決性別多元化問題。


    由於商業環境快速變遷，董事會逐漸認知到，有必要增加對影響公司存亡的新興領域有經驗的董事。


    <史賓沙>也發現董事會願意擴大拔擢來源。標普 500 成分股的新任董事有 45%欠缺公開上市公司董事會相關經驗，比率創下新高。分析顯示，這些董事會新手不到一半是女性。


    在尋找獨立董事時，公司向來偏好目前的執行長，他們通常都是白人男性。但較少企業主事者有時間在外兼任董事職務。


    儘管女性和非白人董事人數增多，但標普 500 董事會的女性比率僅微幅上升至 22%，高於原先的 21%。<史賓沙>歸因於董事會換血不夠快。／2017/11/4*


    # 經商要懂技巧，賺錢要靠手腕：比爾.蓋茲的11準則


    ## 第 1 條準則：適應生活

    生活是不公平的，要去適應它。


    命運掌握在自己的手裡。


    ## 第 2 條準則：成功是你的人格資本

    這世界並不會在意你的自尊。這世界指望你在自我感覺良好之前就要有所成就。


    成功是人生的最高境界；成功可以改變你的人格與尊嚴；自負是愚蠢的。


    ## 第 3 條準則：別希望不勞而獲

    高中剛畢業的你不會一年賺四萬美元的。你不會成為一個公司的副總裁，並且擁有一部裝有電話的汽車的，要等到你將這職位與汽車電話都賺到手。


    成功不會自動降臨的；成功來自積極的努力；要分解目標，循序漸進，堅持到底。


    ## 第 4 條準則：習慣律己

    如果你認為你的老師很嚴厲；等你有了老闆再這樣想。老闆可是沒有任期限制的。


    好習慣源於自我的培養。


    ## 第 5 條準則：不要忽視小事

    烙牛肉餅並未有損你的尊嚴。你的祖父對於烙牛肉餅可有不同的定義；他們稱它為機遇。


    平凡能成就大事業。


    ## 第 6 條準則：從錯誤中吸取教訓

    如果你陷入困境，那不是你父母的過錯；所以不要尖聲抱怨，要從中吸取教訓。


    ## 第 7 條準則：事事需要自己動手

    在你出生之前，你的父母並非像他們現在這樣乏味。他們變成今天這個樣子是因為這些年來，他們一直在為你付帳買單，替你洗衣服，聽你大談你是如何的酷。所以，如果你想消滅你父母那一輩子中的「寄生蟲」來拯救雨林的話，還是先去清除你房間衣櫃裡的蟲子吧。


    不要總靠別人活著，要憑藉著自己的力量前進的。


    ## 第 8 條準則：你往往只有一次機會

    你的學校也許已經不再區分優等生與劣等生；但生活卻仍在做出類似的區分。在某些學校已經廢除不及格了，只要你想找到正確的答案，學校就會給你無數的機會。這和現實生活之中的任何事情沒有一點相似之處。


    機遇是一種巨大的財富，機遇往往就那麼一次；也許你「沒有機會」，但可以創造的。


    ## 第 9 條準則：時間，在你的手中

    生活不分學期，你並沒有暑假可以休息，也沒有幾位雇主樂於幫你發現自我。自己找時間做吧，決不要把今天的事情拖到明天的。


    ## 第 10 條準則：做該做的事

    電視並不是真實的生活。在現實生活之中，人們實際上得離開咖啡店去做自己的工作。


    ## 第 11 條準則：善待身邊的所有的人

    善待乏味的人。有可能到頭來你會為一個乏味的人工作的。


    善待他人就是善待自己，要用讚揚代替批評，並且主動的適應對方。


