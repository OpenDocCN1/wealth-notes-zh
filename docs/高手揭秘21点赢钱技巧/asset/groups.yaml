    ## 【三８五７操作法】盛極而衰，市場熱絡之後漸漸冷卻


    ![](img/53179c30f7028b7317dce6a20859f6f6_110_0.png)


    「三８五７法」是統計研究全球股市波動的大發現：當股市上漲三個月後，未來三個月下跌機率有八成（80%）；當股價下跌五個月之後，未來五個月上漲的機率——雖然稍低一些，但也高達七成（70%）。這一套原則，可以套用在全球各個股市。三８五７波段操作法，適合處變不驚、守株待兔的耐心的投資人，確定性很高，輕鬆輕鬆的利用市場犯錯獲利。在時間的拿捏上，是可以稍帶一點彈性的。


    【三8五7操作法】資金湧進，游資與熱錢，引燃市場水溫


    ![](img/53179c30f7028b7317dce6a20859f6f6_111_0.png)


    證券市場在低迷數個月之後，漸漸升溫；一般是估五個月之久。如果加上之前驚驚跌的三個月，加起來就有八個月之多了。大盤在大家都充滿疑慮的狀況下，迅速的拉高——其實，這是資本家、作手、炒作集團、董監事、金主的造勢推升；逐漸升高的股價，引來媒體的報導，然後吸引來更多的散戶進場；市場人氣來了，成交量是低迷時的x2倍；到了頭部時，平均成交量是x3倍之多；「倒貨」的那一天的成交量是x5~10倍之多。


    ## 要讓事情有效改變 自己必須有效改變


    ### 要讓事情變的更好 自己必須變的更好


