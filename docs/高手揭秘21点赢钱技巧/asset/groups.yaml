    - 「專家」的話常常是錯的；因為，很多權威幾乎足不出户，信口開河；他們只是說說而已，自己並沒有做。

    - 只有認真、理性的思考，才能避免在投資中犯一些簡單低級的錯誤。

    - 投資絕不是無知者無畏的事，你對股票的這種籌碼愈瞭解就愈沒風險，你愈不理解的事當然就會覺得風險大。

