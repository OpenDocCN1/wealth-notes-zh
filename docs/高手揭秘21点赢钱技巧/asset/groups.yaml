    ## 使用公司年報的人賺錢


    最常使用公司年報的人，包括公司的大小股東、公司顧問與律師、貸款者、經理人員、員工與工會、政府與稅務人員等等。


    ### 公司股東


    公司股東，包括董監事的大股東與持有少量普通股的小股東——所謂的「散戶」（Individuals）就是。大部份的上市公司約有六、七成的股東，持股占總發行股票數量的不到
    10%。絕大部分的股份是掌握在大股東手中；這些大股東包括保險公司、信託與退休基金、投資銀行、或其它金融機構等等。


    大股東的人數占股東的總人數的一小部分而已；不過，公司卻得聽命於這些大股東所組成的董事會。


    股東擁有對公司的權益，他們常用年報來了解過去一年中，董事會如何管理股東的投資資本。大股東們通常掌握著更多的資訊與財務分析，他們通常都比小股東瞭解公司。一般說，股東最關心的是：股利與未來資金的成長。


    ### 公司顧問與律師


    企管公司顧問，必須審閱財報資料才能向公司進獻意見，提示營運所可能出現的風險。其它的公司顧問，也必須透過財務報表，進一步的診斷公司的營運。


    ### 貸款者與銀行


    提供公司長期融資的貸款者通常是銀行、或是其它的機構與個人，還包括以記帳方式供應貨品與提供服務的供應商。


    一般說，借錢給公司的這些人，都很想瞭解公司的財務狀況，以確保他們是否能收到帳款與利息。這些貸款者比較重視公司的創造利潤與現金流量的能力，另外，就是資產流通性、償付能力等等。


    ### 經理人員與管理階層


    經理人員與管理階層的跟財務報表之間，是個比較微妙的關係。經理人關心的是公司未來的業績與財務應變能力；過去的成就並非經理人關注的焦點。經理人要掌握的是最新而且正確的資訊。


    基本上，財務報表對他們來說，用處不大；不過，如果經理人員的獎金是依財報的數目計算時，他們或許會更有興趣些。


    企業經理人的經營風格（Manager Characteristics）也會影響到企業的持續經營的；因為企業的無形資產──像是商譽、品牌形象、企業文化，都反映了投資人對於經營團隊的看法。


    企業經理人的決策品質（Management Quality）也會直接的影響到該一企業的未來的獲利狀況，連帶波及到股價。不過，企業經理人經營企業的目標——到底是為股東謀取最大的福利？還是只為自己謀取福利領高薪——這一直是學術界研究「代理問題」（Agency
    Problems）的重點。


    ### 員工與工會


    理論上，員工與工會代表是使財報來協助他們評估公司支付薪資的能力；在台灣還可以做為年終獎金的計價還價的依據。


    不過，員工閱讀年報的能力，就像是外頭散戶投資人一樣，看不太懂；常常得透過專業人員的解說才行。


    ### 政府與稅務人員


    政府與稅務人員會運用年度報告與檢附的資料，進行國家統計分析。另外，個人與公司的賦稅，也是依年度報告中的會計盈餘明細課徵的。


    ### 一家公司的成功


    一家公司的成功——有沒有被市場快速認同，並不是很重要的；只要公司的內涵價值（intrinsic value），是以令人滿意的速度成長就好。事實上，較晚的認同是比較有利的，因為這樣可以給我們充份的機會——以較低的價格投資更多更好的標的。————華倫.巴菲特（Warren
    Buffett）


    很明顯的，巴菲特並不急於要求市場的認同他所相信的真理。


    ### 這顯然是中了圈套！


    到了最後，就會走到敏斯基（Hyman Minsky）所說的泡沫的最後階段：「恐慌拋售」(revulson)；然後，投資受傷慘重，以至於不再願意參與市場。


    經濟學家敏斯基（Hyman Minsky）著有《掌控動盪的經濟》（Stabilizing an Unstable Economy）中說：經過長時間的經濟快速成長、低通膨、低利率與總體經濟穩定，孕育著投資人的自滿心態，並且愈發勇於承擔風險。


    不過，金融穩定之後，必然導致接下來的不穩定。金融商品創新——證券化、未列於資產負債表外的融資，以及其他種種，再次證明歷史是不斷的重演。投資人就像每秒基所警告的，身處於不受規範的市場，卻持著过度的信心，這顯然是中了圈套！


    > Fashion fades, only style remains the same. ------ Coco Chanel


    流行會退潮，惟有風格長存。——法國時尚品牌香奈兒創辦人 香奈兒


