    \ 30%左右。」\n\n恩格爾係數是用食品支出總額佔個人消費支出總額的比重，來觀察一個國家人民生活及經濟發展。\n\n恩格爾係數越低的國家，也就越富裕。很長一段時間，大陸居民只求三餐溫飽，也因此恩格爾係數徘徊在\
    \ 50%上下，多數家庭的開銷大多集中在「吃」的上面。\n\n2016 年大陸居民恩格爾係數為 30.1%，比 2012 年下降 2.9 個百分點。而恩格爾係數處於\
    \ 20%至 30%之間，就是聯合國劃分的富足標準，大陸正在接近這個標準。過去 5 年來，這一指標穩步降低，無疑是一個巨大的進步。\n\n中國歷史的幾千年中，如何讓十幾億人口吃飽飯，一直是個重大課題。國家主席習近平更講過，解決大陸\
    \ 13 億人口吃飯問題，已經是對全世界最偉大的貢獻。20 世紀初還有很多人吃不飽，穿不暖；但從 1978 年改革開放，在近 40 年的奮力追趕，大陸不僅從大國邁向強國，人民生活水準，更已接近富足標準。\n\
    \n中國的居民消費，特別是城鎮居民消費，已經從溫飽型向享受型、發展型轉變。富裕起來的老百姓，越來越注重生活的品質和品味，近年來房地產、汽車、通信、旅遊業的火爆直接反映了這一部分。\n\
    \n大陸 GDP 已居世界第二，從 1978 年到 2016 年，大陸經濟年均增速超過了 9%。這期間，中國 GDP 翻了 20 倍、人均 GDP 翻了 14\
    \ 倍，伴隨大陸經濟持續強勁的增長，人們的收入和生活水平也越來越高。而在 1986 年，中國人均 GDP 只有 282 美元，2016 年，中國人均 GDP\
    \ 為 8123 美元，接近於 1970 年代末的美國、德國、法國和日本。\n\n日本 2016 年恩格爾係數約為 26%，近年有上升跡象；南韓 13.7%，這兩年持續下降中；美國則是在\
    \ 10%以下。／2017/10/14\n\n## 百貨公司的第2大業種——餐飲業即將超越化妝品\n\n近年百貨受到網店商務蓬勃發展與景氣不佳雙重衝擊，營收成長動能疲弱；業者透過引入知名或創意餐飲以吸引更多消費者，餐飲漸漸的變成爲百貨業的第\
    \ 2 大業種，甚至不久就會成爲最大營收來源；業者也坦言，必須要思考餐飲與零售的平衡點。\n\n目前在各主要百貨公司中，化妝品仍是營收比重最高的業種，佔比約\
    \ 20%，但餐飲卻由 3 年前不到 15%，目前平均約 17% 左右；每年成長幅度更是最高，擠下化妝品的狀況很快會發生。\n\n新光三越執行長副總吳昕陽就說，過去傳統百貨業對餐飲有低毛利、營收比重不能過高的迷思；但引進餐飲美食的最大效益是吸引人潮；集客效應——更已取代化妝品；但餐飲似乎也不能一直擴大，一旦營收比重達到\
    \ 20%，就必須停止再觀察。\n\n也有業者透露，餐飲的毛利很低，引入過多餐飲會侵蝕到公司獲利表現，去年的毛利已經少了 1%，餐飲變成業種龍頭，「不是好事但卻是會發生的事」，相信各業者都已經開始思考如何去取得餐飲與零售的平衡點。／2017/10/09\n\
    \n## 所有成就的起點 都是某一種欲望\n鹽水 汗水 淚水或海洋 也能治療一切\n\nThe starting point of all achievement\
    \ is desire. - Napoleon Hill\n\n所有成就的起點都是欲望。 ——美國 20 世紀作家 希爾（Napoleon Hill）\n\n\
    The cure for anything is salt water -- sweat, tears, or the sea. - Isak Dinesen\n\
    \n鹽水——汗水、淚水或海洋，能治療一切。 ——丹麥作家 丹尼森（Isak Dinesen）\n\n## 高槓桿操作，引來經濟風暴\n\n雙星多空套利\n\n\
    《經濟學人》(The Economist) 曾經說過：「在大部分時間，人們都沒有注意到信用 (credit) 是像血液一般，流過經濟體系的肺；但當信用停止從市場流向銀行、企業與消費者時；每個人就會都發現（肺部沒血液）了。」\n\
    \n企業不只是「大到不能倒」，有時也「大到無法救」；过度的高槓桿操作，就會引來五十年一遇的洪水；只是這些經濟風暴，竟然從五十年一遇，變成三年一遇而已。\n\n\
    2008 年來襲的金融海嘯，巴菲特看了也搖頭說：「這次真的是經濟上的珍珠港事件……，在我成年之後，我從來沒有看過人們像現在一樣，對經濟這般的恐懼。」\n\n\
    2008/10/2 日，股神巴菲特又說：「如果下週再沒有辦法解決，我可能就得回去送報紙了。」\n\n## 做股票應騎驢找馬\n\n美女比較會偷吃？德州大學奧斯汀分校的研究人員發現：重要雌激素「雌二醇（estradiol）」分泌旺盛的女性，不但魅力十足，同時也往往會一個接一個男人換；但這不代表她們會追求刺激的「一夜情」，反倒比較像「騎驢找馬」。\n\
    \n這一項刊登在英國皇家學會刊物《生物學通訊》的研究結果顯示：雌二醇高的女性，不但自我評價較高，旁人也會覺得她們更有魅力；另外，這些雌二醇高的女性更可能調情、親吻、或是和其他男人發生認真的劈腿戀情，也會更願意和其他男人約會。\n\
    \n研究負責人杜蘭特教授說，男人很難同時兼具財力與良好基因（帥氣）；因此選擇長期穩定的「飯票」、或選擇基因良好的短期性伴侶，女人往往只能擇一；但雌二醇高的女性對男性的標準更高、也更不願從一而終，如果身邊的男性不是太令人滿意，一旦條件更好的男性出現，她很可能就會開始跟他培養關係，最後甚至轉而求去。\n\
    \n她說這種模式比較像「投機性的連續單配偶制」：她們不是性上圖隨便的人，只是會用自己的好條件找到更好的男人。\n\n杜蘭特等人的研究方法是找來五十二位十七到三十歲之間的女性，先為她們測量兩次雌二醇濃度，然後要求她們為自己的魅力評分，最後再由不知情的兩男七女爲每個實驗對象評分。\n\
    \n做股票應騎驢找馬，不必死抱一支個股！很多股票都曾經是績優股！\n\n## 宙斯開懷驅離熊市\n\n> Come fill the South Sea goblet\
    \ full;  \n> The Gods shall of our stock take care;  \n> Europa pleased accepts\
    \ the bull,  \n> And Jove with joy puts off the bear.  \n> - Alexander Pope, inscription\
    \ on a punch bowl, 1720 (the year of the South Sea Bubble)\n\n快來將南海酒杯斟滿\n股票全交所神費心\n\
    歐羅巴欣喜接纳公牛\n宙斯開懷驅離熊。——亞歷山大·波普\n\n摘錄自雞尾酒果汁碗上刻印的文字，1720 年，南海泡沫事件的當年。\n\n「套利」(Arbitrage)\
    \ 就是無須負擔風險而獲利，因此也無資產淨暴露。在實務之中，是需要由套利者同時買進與賣出同樣的資產——應該說是兩筆價值相當的資產，然後賺取其中的差價。在金融市場還沒全球化之前，最常見的套利行爲就是在某個金融中心賣出某種貨幣，然後在另一地以較低的價格買進。\n\
    \n## 簡單原則造就巴菲特傳奇\n\n爲甚麼要研究巴菲特？巴菲特有甚麼密技，可應用在買房子的投資決策上？「簡單」來說，就是「簡單」，不必上山下海蒐集各種資訊，只要選擇符合自己生活機能、符合自己財力的房子，買下來好好住，就是購屋致富首要法則。\n\
    \n巴菲特投資策略簡單到令人難以置信：「買進好公司的股票，然後長期投資。」他的投資組合 (portfolio) 只有一個黃金法則：購買在任何經濟情勢下都有機會獲利的企業，他重視是獲利能力，而不是短線追逐景氣造成的價差，選定之後，長期持有。對他而言，這就是投機與投資的分野，也是他被稱爲「投資之神」、「股神」的原因。\n\
    \n巴菲特投資的原則是，只投資現在就已經獲利的公司，而不將希望寄託在「未來可能的轉機」上面。對於一般房地產投資人來說，這個原則更需要遵守，畢竟房子買下去，很可能要全家人都節衣縮食好一陣子，更是全家未來致富希望之所託；再白話一點說，我們可是賠不起的！\n\
    \n## 想像，這是種特質\n\n想像，這是種特質。沒有它，一個人既不能成為詩人，也不能成為哲學家、有機智的人、有理性的生物，也就不成其為人。——[法]狄德羅(1713-1784)，法國哲學家與百科全書的編纂者\n\
    \n沒有感情這個品質，任何筆調都不可能打動人的心。——[法]狄德羅(1713-1784)，法國哲學家與百科全書的編纂者\n\n隱藏的仇恨，比公開流露出來的仇恨更危險。——[法]狄德羅(1713-1784)，法國哲學家與百科全書的編纂者\n\
    \n## 【波谷（Wave trough）】\n\n![](img/53179c30f7028b7317dce6a20859f6f6_50_0.png)\n\
    \n波峰（Wave crest）是指「波」的在一個波長的範圍內，波幅的最大值，與之相對的最小值則被稱為波谷。\n\n橫波突起的最高點稱為波峰，陷下的最低點稱為波谷。\n\
    \n縱波最密集的部分稱為波峰，最稀疏的部分稱為波谷。\n\n在今天的順境之中所犯的錯誤決策 會造成明天的逆境！\n\n在今天的逆境之中所做的正確選擇 將開創明天的順境！\n\
    \n## 【守破離定四階之道】\n\n![](img/53179c30f7028b7317dce6a20859f6f6_51_0.png)\n\n第一階的「守」的跟隨階段，必須遵從老師教誨，認真練習基礎，達到熟練的境界。第二階是「破」的突破階段：匠人在基礎熟練後，試著突破原有規範，讓自己達到更高層次的進步。第三階是「離」的升離階段：在更高層次得到新的認識並總結，自創新招數，而另闢出新境界。第四階是「定」的階段，簡單的说，就是「定於一」；學者到了這時，技術與功法已經穩定。\n\
    \n## 策略的精髓 在於選擇做什麼 不做什麼 放棄與無所作為 也是一種很好的治療\n\n> 策略的精髓：選擇不做什麼。——哈佛商學院教授麥可．波特（Michael\
    \ E. Porter）\n> To do nothing is also a good remedy. - Hippocrates\n> 無所作為也是一種很好的治療。——古希臘名醫\
    \ 希波克拉底\n\n## 做假帳：把公司的獲利盈餘灌水\n\n印度第 4 大軟體技術服務外承包公司薩蒂揚（Satyam）2009/01/07 驚傳財務報造假事件。公司董事長拉于（Ramalinga\
    \ Raju）表示，過去幾年來，他把公司的獲利盈餘灌水，試圖美化公司業績，並保住自己的職務，現在由於一項收購交易取消，公司無法再掩蓋高達 10.4 億美元的會計缺口。此話一出，薩蒂揚股價單日大跌\
    \ 78%，連帶把大盤指數下拉 7.25%，成為 9,586 點。\n\n薩蒂揚驚爆作假帳是金融風暴後印度本土發生的第一件大型企業詐欺事件。拉于在坦承竄改財務報告後宣佈辭職，並表示「準備面對印度的司法及其後果」。\n\
    \n薩蒂揚總部設在印度大城海德拉巴，是印度孟買和美國紐約的上市公司，客戶橫跨世界 66 國，員工總計 5 萬 3000 人。該公司雖占印度股市權重不到 1%，但重要性如同台灣的晶圓代工，具產業指標性。\n\
    \n7日詐欺醜聞曝光後，不僅拖累印度股市，也令各國投資人嚴重懷疑印度企業財報的可信性。孟買 Kejriwal 投資研究服務公司創辦人克里瓦說：「這是印度黑暗的一天，也是軟體業者與企業治理的災難日，此事件重創了印度企業界。」\n\
    \n拉于做帳金額高達 10 億美元，為了填補營收差距，拉于把家人在公司超過 8% 的股權抵押給債權人，以便籌措資金。\n\n不過隨著國際金融風暴衝擊，薩蒂揚股價下跌，債權人也開始脫售手中的股票。\n\
    \n拉于在寫給董事會的信中提到，公司的財務報表充斥著「虛假的」資產和「不存在的現金」，不過其他董事對此一無所悉，他自己也未從中獲利。\n\n印度在開發中國家以公司管理能力良好著名，這也使國外前\
    \ 500 大公司願意授權印度公司使用機密的資料和系統。如今作假帳醜聞曝光之後，外界疑慮增加。印度證管會已在進行調查。／2009/01/08\n\n## 不要與大盤對賭\n\
    \n股價指數（Stock Index）的漲漲跌跌——\n\n- (1). 是一個國家經濟櫥窗的展示：\n- (2). 還是衡量股市投資報酬率高低的標準\n\
    - (3). 還是指數期貨與選擇權的參考標的。\n\n如果一年股價指數的報酬率是 30% 的話，那麼個人報酬率到了 20% 就不算什麼；投資人投資股市的長期目標——就是在打敗大盤指數（Beat\
    \ the Market）；或者是說戰勝市場大盤。也就是說，個人投資報酬率，長期目標是要打敗指數報酬率，而不是陶醉於個人報酬率有多高！\n\n二十世紀的投資大師華倫·巴菲特（Warren\
    \ Buffett），一向是以長期持有、理性投資、尋找被市場低估的價值股，來做為自身的投資理念而著稱。巴菲特旗下的基金波克夏公司（Berkshire Hathaway）也為投資人帶來穩定的報酬。不過。在當\
    \ 1990 年代晚期的網路概念股發燒猛漲之際，那斯達克（NasDAQ Composite Index）大幅上漲之際，像是 VA Linux 就曾經創下上市首日的單日最大漲幅\
    \ 698% 的紀錄；那時，有人曾問巴菲特——是否會投資網路概念股；巴菲特則是簡單的回答說：「網路概念股是什麼東西？我不懂。」\n\n因此，在許多網路概念股型科技基金——拜那斯達克指數上漲而創造出耀眼的投資報酬率之時，巴菲特所屬的公司波克夏公司的股價相對的是黯然失色的。特別是當那斯達克指數在\
    \ 2000 年初時達到最高峰時，也是波克夏公司股價最低迷的時候；不過，後來，網路概念股的泡沫開始破滅時，堅守價值投資法的巴菲特，就真正的彰顯出自身的價值來！\n\
    \n原來，幾曾何時，網路概念股在 2000 年三月到達 5100 點的高峰之後，一路下滑不振；到了 2001 年五月時……只剩下 2000 點左右。\n\n\
    你要進場買進股票嗎？我開門見山的勸你，——你最好是省省的好；但是，如果你忍不住一定要進場，我建議你採取本書提倡的「雙星多單操作」，也就是說，在進場時買進兩種股票，一種壓多頭上漲，一種押空頭下跌。\n\
    \n大家都想打敗大盤，賺取利潤，但成功的人少，得利的總是大戶；山不轉路轉，就看你想追求什麼！現在，你可能細思量——「一手抓多，一手抓空！」例如你買進「南亞」，但也同時放空「台化」；份量一樣。上漲時南亞先獲利了結，回檔時再處理「台化」。反過來說，如果市場大跌，就先讓「台化」補回獲利，等待反彈時再處理「南亞」。總之，有一種先獲利，另一種則可等待看看。\n\
    \n- 或者兩者靜觀其發展，伺機攫取最大的利益。\n- 中國人常說「雙星報喜」，這種新思維會為你帶來好兆頭的！\n- 人們很難看對市場的方向，利用雙星的多空押注，是一種好的習慣；不必研究，兩頭都押，再從中渾水摸魚就可以了！\n\
    \n到 2008 年為止，我還沒看過比「雙星多單操作」更平穩、有效、安全的操作法的！保持這種多單的出手，即使是在多單不明的格局之中，還是讓你的心情穩定；考慮清楚吧，這是一種值得堅持的好習慣的。\n\
