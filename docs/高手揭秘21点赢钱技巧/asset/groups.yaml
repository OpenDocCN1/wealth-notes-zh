    \ Emerson，1803~1882）\n\n# 人們可以爬到最高峰\n但他不能在那兒久住\n\n> Man can climb to the highest\
    \ summit, but he cannot dwell there long. ------ Bernard Shaw\n>\n> 人們可以爬到最高峰，但他不能在那兒久住。——蕭伯納\n\
    \n# 有錢人喜歡用名牌 但別花錢買罪受\n\n**調查：9成瓶裝水 遭塑膠污染 對人體危害程度有待商榷**\n\n美國非營利媒體組織 Orb Media\
    \ 公布一份新研究顯示，美、中、泰、印等全球 9 國的市售 11 種品牌瓶裝水，9 成含有塑膠微粒。但專家也客氣的指出：目前尚不清楚塑膠微粒污染對人體健康的危害程度。\n\
    \n此份研究，由紐約州立大學弗雷多尼爾學院微塑膠研究人員梅森主導進行，研究結果顯瓶裝水「普遍受到塑膠污染」。\n\n研究人員檢測來自全球 9 國 11 個品牌的\
    \ 259 瓶瓶裝水，這些國家包括巴西、大陸、印度、印尼、肯亞、黎巴嫩、墨西哥、泰國與美國。其中高達 93%的樣本遭檢出含有塑膠微粒，當中不乏知名品牌，像是\
    \ Aqua、Aquafina、Dasani、依雲 (Evian)、雀巢 Pure Life 與聖沛黎洛 (San Pellegrino) 等。\n\n驗出的塑膠微粒包括尼龍、聚對苯二甲酸乙二酯\
    \ (PET)，以及用於製造瓶盖的聚丙烯 (polypropylene)。\n\n> 梅森表示：「在此研究中，我們發現的塑膠微粒裡有 65%是塑膠碎片而非纖維。我認爲這些塑膠微粒大多來自於瓶子與瓶蓋本身，以及在裝瓶過程遭污染。」\n\
    \n其他遭塑膠污染的瓶裝水品牌，還包括 Bisleri、Epura、迪洛斯汀 (Gerolsteiner)、Minalba 與哇哈哈 (Wahaha)。\n\
    \n梅森表示，某些癌症、注意力不足過動症 (ADHD) 與自閉症案例增加，以及男性精蟲數量變少，可能都與塑膠污染有關。\n\n但專家指出，目前尚不清楚塑膠微粒污染對人體健康的危害程度。國際瓶裝水協會\
    \ (IBWA) 便批評此份報告「未經同儕審查、科學證據不足」。／2018/3/25\n\n# 汽車狂人：造汽車不過是四個輪子 加兩個沙發\n\n2018\
    \ 年，中國最大汽車製造商<吉利汽車>成爲賓士 (Benz) 母公司、德國最大汽車製造商戴姆勒 (Daimler) 的最大股東；雖然<吉利>收購外國知名車企已非首次，但成爲戴姆勒最大股東，還是不免令人好奇，<吉利>掌門人到底有何能耐。\n\
    \n<吉利汽車>董事長李書福，是大陸家喻戶曉的草根創業家代表；他最早是個開照相館的老闆，每次幫人照相約莫收 120 元人民幣 (下同)。後來他在 1986\
    \ 年成立浙江<吉利控股集團>，從生產電冰箱零組件起步；不到 10 年，他就累積大筆財富，進而擴展至汽車行業。\n\n剛進入汽車業的李書福，從模仿開始，鼻拆解豐田等外國車企生產的汽車，研究後再自行研發，生產出「車頭像賓士，車尾像寶馬\
    \ (BMW)」的汽車。\n\n此後，<吉利>在全球四處併購知名車企，除戴姆勒外，寶騰 (Proton)、沃爾沃 (VOLVO) 都是其戰利品；李書福還說，今年的併購腳步還會繼續。同時，<吉利>也收購海外汽車相關供應鏈企業，一步步擴展其汽車王國。\n\
    \n李書福曾說，「造汽車不過是四個輪子，加兩個沙發」，此等狂語讓他有了「汽車狂人」封號。\n\n如今，<吉利>成爲資產總值超過 2 千億元，員工總數逾 7\
    \ 萬人，還連續 6 年都進入世界 500 強的大型車企，也是唯一——個進入世界 500 強的中國民營車企。\n\n他本人則是從一個無名小卒變身成｛2018\
    \ 胡潤全球富豪榜｝中，中國汽車行業富豪榜的榜首。\n\n而「汽車狂人」現在有了新目標，他近期推出「藍色吉利行動」，計劃到 2020 年，新能源汽車銷量占<吉利>整體銷量\
    \ 90% 以上。其中，插電式混動與油電汽車銷量占比達 65%，純電動汽車銷量占 35%。在大陸致力環保政策，並大力推動新能源車的利好背景下，極力在新能源車領域上創造新王國。\n\
    \n而這個王國，李書福早開始布局。包括去年<吉利>新能源商用車基地在四川南充落成、稍早收購的英國倫敦電動出租汽車安斯蒂 (Ansty) 新工廠落成，新一代零排放、超低排放的倫敦出租車成功投產、VOLVO\
    \ 汽車也啓動電氣化戰略，成爲全球第一個明確提出傳統內燃機停產時間表的汽車企業。\n\n身爲大陸全國人大代表的李書福，還在今年「兩會」上，提交〈液態陽光經濟，推進甲醇汽車市場化〉報告，建議國家應該向推廣電動汽車一樣，重視有同樣效果的甲醇汽車與甲醇燃料。這也看得出李書福對於有關新能源汽車的一切，不只重視關注，還盡其所力落實。／2018/3/25\n\
    \n# 諾貝爾經濟學獎得主克魯曼：貿易戰駁火 贏家是中國\n\n諾貝爾經濟學獎得主克魯曼（Pual Krugman）2018/3/23 在《紐約時報》撰文指出，貿易戰是有害的，幾乎所有人都会蒙受經濟損失。如果有人在其中「贏了」的話，那將是那些因爲美國揮霍自己的聲譽，從而獲得地緣政治影響力的國家。這意味著，川普貿易戰的勝利者——將是中國。\n\
    \n克魯曼在文章中指出：幾週前美國總統川普在宣布對鋼鋁徵收關稅後宣稱，「貿易戰是好事，很容易贏。」實際上，貿易戰幾乎沒有好事的時候，而且根本不容易贏，「尤其是當你不知道自己在做什麼的時候」。\n\
    \n克魯曼指出，巨大的貿易赤字中，很大一部分是統計造成的錯覺。中國是大組裝者，中國出口很多產品，但實際上是把其他地方，尤其是韓國和日本生產的零部件組裝起來，典型的例子是iPhone，它是「中國製造」，但中國的勞動力和資本僅占最終價格的百分之幾。\n\
    \n克魯曼說，在美國對中國的貿易逆差中，很可能近半數是針對那些向中國出售零部件的國家的赤字，這意味著兩點：首先，美國對中國的貿易影響力比川普想像的要少很多；其次，與中國的貿易戰會激怒更廣泛的國家，其中一些是美國的親密盟友。／2018/3/25\n\
    \n# 暴君死了 他的統治就結束了\n烈士死了 他的統治才剛開始\n\nThe tyrant dies and his rule ends, the martyr\
    \ dies and his rule begins. ----- Soren Kierkegaard (1813 - 1855)\n\n暴君死了，他的統治就結束了；烈士死了，他的統治才剛開始。—\
    \ [丹] 齊克果\n\n# 最賺錢的執行長 CEO\n\n## <博通>陳福陽年收 1.03 億 居百大 CEO 之冠\n\n2017 年美國逾百大企業執行長，誰的收入最高？晶片大廠<博通>\
    \ (Broadcom) 的執行長陳福陽 (Hock Tan) 以全年薪資高達 1 億 300 萬元拔得頭籌。\n\n市場數據業者 MyLogIQ 提供的美股上市公司申報資料，分析史坦普\
    \ 500 指數成份股中的 133 家企業，在 2018 年 3 月 16 日為止的最新會計年度數據。\n\n這一項分析顯示，若以中位數統計來看，這 133\
    \ 家大企業執行長 2017 年薪酬達到 1160 萬元的歷史新高，超越 2016 年的 1120 萬元。\n\n美國經濟加速成長，股票市場也水漲船高，使得大企業領導人年薪同步攀高，這裡提到的年薪金額包括了底薪、獎金、股票與其他非現金類的福利等。\n\
    \n上逑 133 家大企業的執行長，其中半數的整體薪資至少年增9.9%，更有四分之一的執行長去年薪資躍升 25%，特別是工業界與科技業的大企業執行長。\n\n\
    以陳福陽爲例，2017 年度薪資達 1 億 300 萬元，足足是前一年度的四倍，其中約 9830 萬元是股票，480 萬元是底薪與獎金。\n\n其他名列 2017\
    \ 年高薪執行長的大企業領導人，還包括年薪7800 萬元的工業設備大廠 Johnson Controls 執行長摩利納洛利(Alex Molinaroli)，以及年薪近\
    \ 6600 萬元的陶氏化學(Dow Chemical)執行長利偉誠(Andrew Liveris)。\n\n現在利偉誠也是<陶氏化學>與杜邦公司(DuPont)合併後，新公司陶氏杜邦(DowDuPont)的執行董事長。然而，有人加薪也有人減薪，去年大企業執行長年薪縮水最多的是\
    \ IBM 的維珍尼亞.羅穆提(Virginia Rometty)，薪水年減 43%至 1860 萬元。\n\n美國企業界才有個最新出爐的極端案例。股票未上市的電動車大廠特斯拉(Tesla)，2018/3/21\
    \ 股東會通過以 10 年時間，給予執行長馬斯克(Elon Musk)價值超過 500 億元的股票選擇權方案。／2018/3/25\n\n## <華為>取消CEO輪值制\
    \ 任正非仍任公司執行長\n\n大陸通訊大廠<華為>董事會昨天完成換屆選舉，由董事梁華出任新一屆董事會董事長，原董事長孫亞芳辭任董事長也未進入董事會；公司創始人任正非依然擔任董事和公司執行長\
    \ (CEO)。\n\n<華爲>董事會本次換屆的最大變化，是取消輪值CEO制度，輪值董事長制度生效，繼續<華爲>的集體領導制。<華爲>官方未解釋這種變化的原因。\n\
    \n<華爲>董事長孫亞芳卸任後，將繼續在公司治理體系中發揮作用。<華爲>公司公關負責人表示，副董事長有四位，其中郭平、徐直軍、胡厚崑擔任輪值董事長。輪值董事長每半年輪換一次，由徐直軍擔任首任輪值董事長。\n\
    \n在<華爲>，董事長和輪值董事長在職責上究竟有何區別？據了解，董事長負責治理責任，包括對外負責公司公共關係及形象維護等，以及主持公司持股員工代表會運作；輪值董事長的職責是對內聚焦公司的管理，領導董事會常務委員會和董事會的工作等。\n\
    \n起始於2011年的<華爲>輪值CEO制度則已成爲歷史。輪值CEO即由三名副董事長輪流出任CEO，任期六個月。在輪值期間，輪值CEO是公司經營管理以及危機管理的最高責任人，對公司生存發展負責。\n\
    \n作爲創辦人，任正非和<華爲>是分不開的，外界一直認爲創辦人即一把手，擔任董事長職位，但實際上在改選前，董事長一直由孫亞芳擔任。在<華爲>新任領導層中，任正非也只擔任CEO，而不再是公司副董事長。\n\
    \n<華爲>財務長孟晚舟也成爲副董事長，任正非有意將女兒培養爲接班人。/2018/3/25\n\n# 禿鷹們等待熊出沒 就看誰撐得比較久\n\n# 我們必須相親相愛\
    \ 否則不如死亡\n\n———紀念英國詩人奧登誕辰100周年\n\n《葬禮藍調》／奧登（Wystan Hugh Auden，1907~1973），20世紀上半葉最有影響的英美詩人\n\
    \n停止所有的時鐘，切斷電話，\n給狗一塊濃汁的骨頭，讓他別叫\n啞了鋼琴，隨著低沉的鼓\n抬出靈柩，讓哀悼者前來。\n讓直升機在頭頂悲旋\n在天空狂草著資訊他已逝去，\n\
    把黑紗系在信鴿的白頸，\n讓交通員戴上黑色的手套。\n他曾經是我的東，我的西，我的南，我的北，\n我的工作日，我的休息日，\n我的正午，我的夜半，我的話語，我的歌吟，\n\
    我以為愛可以不朽：我錯了。\n不再需要星星，把每一顆都摘掉，\n把月亮包起，拆除太陽，\n傾瀉大海，掃除森林；\n因為什麼也不會，再有意味。\n\n這是奧登（Wystan\
    \ Hugh Auden，1907~1973）為他的愛人寫的詩。\n\n# 如果眾人對你心存猜忌 你仍能自信如常\n並認為他們的猜忌發難 還是算情有可原\n\
    \n# 英文詩《如果》----拉迪亞德·吉卜林\n\n芸芸眾生，誰不想成功，誰不想令世人矚目，詩人在詩中展示了成功背後，包含多少的辛酸，經歷多少的磨難，忍受多少的痛楚。如果人們能正視成功前的種種困難，勇於接受挑戰；失敗了，何畏懼，重頭再來。那樣，我們便成爲了一個頂天立地之人。這是獻給年輕人的詩！\n\
    \n【如果 —— 拉迪亞德·吉卜林】\n\n如果周圍的人毫無理性地向你發難，你仍能鎮定自若保持冷靜；\n如果眾人對你心存猜忌，你仍能自信如常並認為他們的猜忌情有可原；\n\
    如果你肯耐心等待不急不躁，\n或遭人誹謗卻不以牙還牙，\n或遭人憎恨卻不以惡報惡；\n既不裝腔作勢，亦不氣盛趾高；\n如果你有夢想，而又不為夢主宰；\n如果你有神思，而又不走火入魔；\n\
    如果你坦然面對勝利和災難，對虛渺的勝負榮辱胸懷曠蕩；\n如果你能忍受有這樣的無賴，歪曲你的口吐真言矇騙笨漢，\n或看著心血鑄就的事業崩潰，仍能忍辱負重腳踏實地重新攀登；\n\
    如果你敢把取得的一切勝利，為了更崇高的目標孤注一擲，\n面臨失去，決心從頭再來而絕口不提自己的損失；\n如果人們早已離你而去，你仍能堅守陣地奮力前驅，\n\
    身上已一無所有，唯存意志在高喊『頂住』；\n如果你跟平民交談而不變謙虛之態，\n亦或與王侯散步而不露諂媚之顏；\n如果敵友都無法對你造成傷害；\n如果衆人對你信賴有加卻不過分依賴；\n\
    如果你能惜時如金利用每一分鐘不可追回的光陰；\n那麼，你的修為就會如天地般博大，並擁有了屬於自己的世界，\n更重要的是：孩子，你成為了真正頂天立地之人！\n\
    \n# 【原文】\n\nIf------\nBy JosepH Ruyard Kipling\n\nIf you can keep your head when\
    \ all about you\nAre losing theirs and blaming it on you;\nIf you can trust yourself\
    \ when all men doubt you,\nBut make allowance for their doubting too;\nIf you\
    \ can wait and not be tired by waiting,\n"
  mdcn: "\n# 【守破離之道】有錢也難買到技術 很多人後來就沒進步了\n\n## 正向的守破離三段\n\n技術進步的境界\n\n為自己圈選做出選擇\n不然別人就幫你選了\n\
    \n- **（三）離的階段**\n  - 新的品味\n  - （合）\n- **（二）破的階段**\n  - 門派品味\n  - （反）\n- **（一）守的階段**\n\
    \  - 大眾的技術層次\n  - （正）\n\nWhat's past is prologue.\n凡是以過去，皆為序章。\n\n最初的是原初的階段，常常是行業裡的共同作法，很普通，但社會也有一定的接受度；這時自己可能還不夠熟練，還是屬於「守」的跟隨階段。後來，自己因為興趣，浸淫日久，心得日多，累積的特色愈來愈多，品味日益不同，這時其實已泡在第二階的「破」的突破階段。後來，匠人得心應手，應用有效，實踐也確實可行，受到好評，就進入穩定的「離」的脫離階段了。\n\
    \n對的方法 加上時間 就能逐漸累積財富\n\n# 【負面的守破離之道】是非主流，但也並非不入流。\n\n![](img/53179c30f7028b7317dce6a20859f6f6_199_0.png)\n\
    \n若是匠心不夠聰明，或是體驗不同，或是經驗不足，但又想有所進取，這時走的就像是一種旁門走道的路，而不被多數人所認同，歷史也不曾給過很高的評價；這個——我們稱之為「負面的守破離之道」；有的傳一傳，雖然也曾經稱孤道寡，但後來也式微了。這其中的癥結點，主要還是價值的問題；有價值的話，就能成為一種流派；沒價值，雖有若無。\n\
    \n# 學院憎恨天才 正像修道院的憎恨聖徒\n所有的偉人 都是從艱苦中脫穎而出的\n\n學院憎恨天才，正像修道院的憎恨聖徒。——艾默生 (Ralph Waldo\
    \ Emerson，1803~1882)\n\n所有的偉人都是從艱苦中脫穎而出的。——艾默生 (Ralph Waldo Emerson，1803~1882)\n\
    \n生活是一輛永無終點的公共車，當你買票上車後，很難說你會遇見什麼樣的旅伴。——艾默生 (Ralph Waldo Emerson，1803~1882)\n\n\
    兩個人交談，一個人可以洗耳恭聽。但是，三個人則無法互談這人世最嚴肅而應深究的事。——艾默生 (Ralph Waldo Emerson，1803~1882)\n\
    \n鞋匠會製作精美的鞋，那是因為除了鞋，他什麼也不會做的緣故。——艾默生 (Ralph Waldo Emerson，1803~1882)\n\n智慧的可靠標誌，就是能夠在平凡中發現奇蹟。——艾默生\
    \ (Ralph Waldo Emerson，1803~1882)\n\n# 快思結合慢想 走出丁字路口\n\n從諾貝爾經濟學獎得主卡尼曼 (D. Kahneman)\
    \ 對人類大腦運作方式的闡釋可知，為快速提升決策效率，決策者習於依賴反射性直覺思考系統的「快思」，而較少使用按部就班理性思考系統的「慢想」。\n\n# 犯下這幾種錯誤的決定\
    \ 也讓企業家感到後悔！\n\n世人大多崇拜有錢人，有錢人的地位比學者還要高，也比官員們高。不過，當人們常聽到很多企業家分享——他們人生的成功的經過時，也能設法從他們打拚崛起的過程中，體認到那一股衝勁與毅力！\n\
    \n但在這些光鮮亮麗的背後，所謂的企業家其實也有不爲人知的辛酸苦楚，並且在無形之中——丟失了一些牽絆；最常見的是長期處於壓力之下而失去了健康與長壽。\n\n\
    媒體《SmartIncome》曾訪問了一些成功企業家，再從這些人的分享中，統整出種種不同的遺憾，或許你在追求輝煌事業的同時，可別走再步上他們不高明的一著道路——：\n\
    \n- 1). 太急著實現自己的目標：\n  或許是要達到自己的績效目標、也或許是想要達成人生成就感，許多人會在年輕時期花費奉泰的光陰在奉獻工作，追求完美、不容許自己犯下半點錯誤；但這樣一味追求捷徑的結果，往往會因爲心急而達不到真正的目標。\n\
    \n- 2). 太保守、而不敢有所突破：\n  那些成功的執行長回憶道：在年輕時有時做的選擇，往往并不是有太積極的創舉；這可能因爲當時公司的風氣守舊或保守，也可能是害怕決策讓公司慘賠，而沒有太多的勇敢嘗試；回頭再來，如果有機會再冒一次險，他們會做不一樣的决定。\n\
    \n- 3). 疏忽了家庭關係：\n  有太多太多的企業家因為忙於工作，而忽略了與親屬、家人、孩子的相處時光，不管是頻繁的出差、或是早出晚歸，能跟孩子的互動是少之又少，這反而變成一種疏遠的情感，造成孩子走偏、叛逆。\n\
    \n  無論如何，工作絕對不會比家庭來得還重要，更不應該疏忽對孩子的陪伴。\n\n- 4). 只注重產品，而不是重視消費者的感受：\n  過分重視於產品的成效、商品——的能帶給社會大眾什麼樣的印象，常常是許多企業家在犯的詬病；不過，真正的服務，應該是以消費者為重心，以他們的角度來開發商品才是關鍵。\n\
    \n  養成傾聽的習慣，可彌補這方面的不足。\n\n- 5). 自以爲是，沒有注重企業文化：\n  「企業文化」其實是一個品牌成功與否的重要關鍵；但有些人可能不喜歡公司、看不慣公司的某些決策，而暗地裡說一些公司的不是。而真正的成功方式，是要對企業的理念與文化認同，才能做出正確的決定。\n\
    \n- 6). 没有找到一位導師：\n  人們在工作上進的過程中，通常可以尋覓到一位值得學習的對象；這不要覺得丟臉或害羞，主動請教與詢問，你會在職場學習到更多豐沛的知識。\n\
    \n- 7). 在工作投入私人感情：\n  有時候，「公私分明」還是非常重要的；當你在工作中投入了過多個人情感、擔憂某些決策可能會影響感情、信賴，那些其實都是多餘的，而且也會令人做出錯誤決定。\n\
    \n- 8). 聽不見別人意見或建議：\n  那些成功的企業家回憶說：年輕時總是對自己充滿自信、覺得自我的決定一定是最正確、並且理所當然的；他們往往都聽不見他人給的提點或分享；那種一意孤行的態度，或許可能曾經證明自己是對；但在更多的時候，只是在破壞同事間的合作關係，也讓人做事更顯僵化。\n\
    \n- 9). 從來沒有好好休息：\n  有太多太多忙於工作的企業家，幾乎是第一個到達公司，而且也是最晚一位離開崗位的；他們常常覺得睡眠是多餘的、能夠多處理一件工作才是最要緊的事，隨時掛心工作的結果，是長時間熬夜、應酬而產生的健康後遺症。\n\
    \n- 10). 沒有享受的時刻：\n  當人生賺到了一堆錢，卻從來沒有花用的時刻，而或是終於有時間可以運用，卻發現自己早已走不動時，那就是人生最遺憾的篇章之一了。\n\
    \n如果可以再做一次選擇，企業家們將決定更早放下工作，畢竟好好享受家庭的天倫之樂、生活的愉悅，才是這一生最幸福的事。/2017/4/15*\n\n> 耐性是天才必不可少的素質之一。——艾默生（Ralph\
    \ Waldo Emerson，1803~1882）\n>\n> 我們的地球給我們一個可愛的錯覺，這就是每一個人都站在世界之巔。——艾默生（Ralph Waldo\
    \ Emerson，1803~1882）\n\n# 人們可以爬到最高峰\n但他不能在那兒久住\n\n> Man can climb to the highest\
    \ summit, but he cannot dwell there long. ------ Bernard Shaw\n>\n> 人們可以爬到最高峰，但他不能在那兒久住。——蕭伯納\n\
    \n# 有錢人喜歡用名牌 但別花錢買罪受\n\n**調查：9成瓶裝水 遭塑膠污染 對人體危害程度有待商榷**\n\n美國非營利媒體組織 Orb Media\
    \ 公布一份新研究顯示，美、中、泰、印等全球 9 國的市售 11 種品牌瓶裝水，9 成含有塑膠微粒。但專家也客氣的指出：目前尚不清楚塑膠微粒污染對人體健康的危害程度。\n\
    \n此份研究，由紐約州立大學弗雷多尼爾學院微塑膠研究人員梅森主導進行，研究結果顯瓶裝水「普遍受到塑膠污染」。\n\n研究人員檢測來自全球 9 國 11 個品牌的\
    \ 259 瓶瓶裝水，這些國家包括巴西、大陸、印度、印尼、肯亞、黎巴嫩、墨西哥、泰國與美國。其中高達 93%的樣本遭檢出含有塑膠微粒，當中不乏知名品牌，像是\
    \ Aqua、Aquafina、Dasani、依雲 (Evian)、雀巢 Pure Life 與聖沛黎洛 (San Pellegrino) 等。\n\n驗出的塑膠微粒包括尼龍、聚對苯二甲酸乙二酯\
    \ (PET)，以及用於製造瓶盖的聚丙烯 (polypropylene)。\n\n> 梅森表示：「在此研究中，我們發現的塑膠微粒裡有 65%是塑膠碎片而非纖維。我認爲這些塑膠微粒大多來自於瓶子與瓶蓋本身，以及在裝瓶過程遭污染。」\n\
    \n其他遭塑膠污染的瓶裝水品牌，還包括 Bisleri、Epura、迪洛斯汀 (Gerolsteiner)、Minalba 與哇哈哈 (Wahaha)。\n\
    \n梅森表示，某些癌症、注意力不足過動症 (ADHD) 與自閉症案例增加，以及男性精蟲數量變少，可能都與塑膠污染有關。\n\n但專家指出，目前尚不清楚塑膠微粒污染對人體健康的危害程度。國際瓶裝水協會\
    \ (IBWA) 便批評此份報告「未經同儕審查、科學證據不足」。／2018/3/25\n\n# 汽車狂人：造汽車不過是四個輪子 加兩個沙發\n\n2018\
    \ 年，中國最大汽車製造商<吉利汽車>成爲賓士 (Benz) 母公司、德國最大汽車製造商戴姆勒 (Daimler) 的最大股東；雖然<吉利>收購外國知名車企已非首次，但成爲戴姆勒最大股東，還是不免令人好奇，<吉利>掌門人到底有何能耐。\n\
    \n<吉利汽車>董事長李書福，是大陸家喻戶曉的草根創業家代表；他最早是個開照相館的老闆，每次幫人照相約莫收 120 元人民幣 (下同)。後來他在 1986\
    \ 年成立浙江<吉利控股集團>，從生產電冰箱零組件起步；不到 10 年，他就累積大筆財富，進而擴展至汽車行業。\n\n剛進入汽車業的李書福，從模仿開始，鼻拆解豐田等外國車企生產的汽車，研究後再自行研發，生產出「車頭像賓士，車尾像寶馬\
    \ (BMW)」的汽車。\n\n此後，<吉利>在全球四處併購知名車企，除戴姆勒外，寶騰 (Proton)、沃爾沃 (VOLVO) 都是其戰利品；李書福還說，今年的併購腳步還會繼續。同時，<吉利>也收購海外汽車相關供應鏈企業，一步步擴展其汽車王國。\n\
    \n李書福曾說，「造汽車不過是四個輪子，加兩個沙發」，此等狂語讓他有了「汽車狂人」封號。\n\n如今，<吉利>成爲資產總值超過 2 千億元，員工總數逾 7\
    \ 萬人，還連續 6 年都進入世界 500 強的大型車企，也是唯一——個進入世界 500 強的中國民營車企。\n\n他本人則是從一個無名小卒變身成｛2018\
    \ 胡潤全球富豪榜｝中，中國汽車行業富豪榜的榜首。\n\n而「汽車狂人」現在有了新目標，他近期推出「藍色吉利行動」，計劃到 2020 年，新能源汽車銷量占<吉利>整體銷量\
    \ 90% 以上。其中，插電式混動與油電汽車銷量占比達 65%，純電動汽車銷量占 35%。在大陸致力環保政策，並大力推動新能源車的利好背景下，極力在新能源車領域上創造新王國。\n\
    \n而這個王國，李書福早開始布局。包括去年<吉利>新能源商用車基地在四川南充落成、稍早收購的英國倫敦電動出租汽車安斯蒂 (Ansty) 新工廠落成，新一代零排放、超低排放的倫敦出租車成功投產、VOLVO\
    \ 汽車也啓動電氣化戰略，成爲全球第一個明確提出傳統內燃機停產時間表的汽車企業。\n\n身爲大陸全國人大代表的李書福，還在今年「兩會」上，提交〈液態陽光經濟，推進甲醇汽車市場化〉報告，建議國家應該向推廣電動汽車一樣，重視有同樣效果的甲醇汽車與甲醇燃料。這也看得出李書福對於有關新能源汽車的一切，不只重視關注，還盡其所力落實。／2018/3/25\n\
    \n# 諾貝爾經濟學獎得主克魯曼：貿易戰駁火 贏家是中國\n\n諾貝爾經濟學獎得主克魯曼（Pual Krugman）2018/3/23 在《紐約時報》撰文指出，貿易戰是有害的，幾乎所有人都会蒙受經濟損失。如果有人在其中「贏了」的話，那將是那些因爲美國揮霍自己的聲譽，從而獲得地緣政治影響力的國家。這意味著，川普貿易戰的勝利者——將是中國。\n\
    \n克魯曼在文章中指出：幾週前美國總統川普在宣布對鋼鋁徵收關稅後宣稱，「貿易戰是好事，很容易贏。」實際上，貿易戰幾乎沒有好事的時候，而且根本不容易贏，「尤其是當你不知道自己在做什麼的時候」。\n\
    \n克魯曼指出，巨大的貿易赤字中，很大一部分是統計造成的錯覺。中國是大組裝者，中國出口很多產品，但實際上是把其他地方，尤其是韓國和日本生產的零部件組裝起來，典型的例子是iPhone，它是「中國製造」，但中國的勞動力和資本僅占最終價格的百分之幾。\n\
    \n克魯曼說，在美國對中國的貿易逆差中，很可能近半數是針對那些向中國出售零部件的國家的赤字，這意味著兩點：首先，美國對中國的貿易影響力比川普想像的要少很多；其次，與中國的貿易戰會激怒更廣泛的國家，其中一些是美國的親密盟友。／2018/3/25\n\
    \n# 暴君死了 他的統治就結束了\n烈士死了 他的統治才剛開始\n\nThe tyrant dies and his rule ends, the martyr\
    \ dies and his rule begins. ----- Soren Kierkegaard (1813 - 1855)\n\n暴君死了，他的統治就結束了；烈士死了，他的統治才剛開始。—\
    \ [丹] 齊克果\n\n# 最賺錢的執行長 CEO\n\n## <博通>陳福陽年收 1.03 億 居百大 CEO 之冠\n\n2017 年美國逾百大企業執行長，誰的收入最高？晶片大廠<博通>\
    \ (Broadcom) 的執行長陳福陽 (Hock Tan) 以全年薪資高達 1 億 300 萬元拔得頭籌。\n\n市場數據業者 MyLogIQ 提供的美股上市公司申報資料，分析史坦普\
    \ 500 指數成份股中的 133 家企業，在 2018 年 3 月 16 日為止的最新會計年度數據。\n\n這一項分析顯示，若以中位數統計來看，這 133\
    \ 家大企業執行長 2017 年薪酬達到 1160 萬元的歷史新高，超越 2016 年的 1120 萬元。\n\n美國經濟加速成長，股票市場也水漲船高，使得大企業領導人年薪同步攀高，這裡提到的年薪金額包括了底薪、獎金、股票與其他非現金類的福利等。\n\
    \n上逑 133 家大企業的執行長，其中半數的整體薪資至少年增9.9%，更有四分之一的執行長去年薪資躍升 25%，特別是工業界與科技業的大企業執行長。\n\n\
    以陳福陽爲例，2017 年度薪資達 1 億 300 萬元，足足是前一年度的四倍，其中約 9830 萬元是股票，480 萬元是底薪與獎金。\n\n其他名列 2017\
    \ 年高薪執行長的大企業領導人，還包括年薪7800 萬元的工業設備大廠 Johnson Controls 執行長摩利納洛利(Alex Molinaroli)，以及年薪近\
    \ 6600 萬元的陶氏化學(Dow Chemical)執行長利偉誠(Andrew Liveris)。\n\n現在利偉誠也是<陶氏化學>與杜邦公司(DuPont)合併後，新公司陶氏杜邦(DowDuPont)的執行董事長。然而，有人加薪也有人減薪，去年大企業執行長年薪縮水最多的是\
    \ IBM 的維珍尼亞.羅穆提(Virginia Rometty)，薪水年減 43%至 1860 萬元。\n\n美國企業界才有個最新出爐的極端案例。股票未上市的電動車大廠特斯拉(Tesla)，2018/3/21\
    \ 股東會通過以 10 年時間，給予執行長馬斯克(Elon Musk)價值超過 500 億元的股票選擇權方案。／2018/3/25\n\n## <華為>取消CEO輪值制\
    \ 任正非仍任公司執行長\n\n大陸通訊大廠<華為>董事會昨天完成換屆選舉，由董事梁華出任新一屆董事會董事長，原董事長孫亞芳辭任董事長也未進入董事會；公司創始人任正非依然擔任董事和公司執行長\
    \ (CEO)。\n\n<華爲>董事會本次換屆的最大變化，是取消輪值CEO制度，輪值董事長制度生效，繼續<華爲>的集體領導制。<華爲>官方未解釋這種變化的原因。\n\
    \n<華爲>董事長孫亞芳卸任後，將繼續在公司治理體系中發揮作用。<華爲>公司公關負責人表示，副董事長有四位，其中郭平、徐直軍、胡厚崑擔任輪值董事長。輪值董事長每半年輪換一次，由徐直軍擔任首任輪值董事長。\n\
    \n在<華爲>，董事長和輪值董事長在職責上究竟有何區別？據了解，董事長負責治理責任，包括對外負責公司公共關係及形象維護等，以及主持公司持股員工代表會運作；輪值董事長的職責是對內聚焦公司的管理，領導董事會常務委員會和董事會的工作等。\n\
    \n起始於2011年的<華爲>輪值CEO制度則已成爲歷史。輪值CEO即由三名副董事長輪流出任CEO，任期六個月。在輪值期間，輪值CEO是公司經營管理以及危機管理的最高責任人，對公司生存發展負責。\n\
    \n作爲創辦人，任正非和<華爲>是分不開的，外界一直認爲創辦人即一把手，擔任董事長職位，但實際上在改選前，董事長一直由孫亞芳擔任。在<華爲>新任領導層中，任正非也只擔任CEO，而不再是公司副董事長。\n\
    \n<華爲>財務長孟晚舟也成爲副董事長，任正非有意將女兒培養爲接班人。/2018/3/25\n\n# 禿鷹們等待熊出沒 就看誰撐得比較久\n\n# 我們必須相親相愛\
    \ 否則不如死亡\n\n———紀念英國詩人奧登誕辰100周年\n\n《葬禮藍調》／奧登（Wystan Hugh Auden，1907~1973），20世紀上半葉最有影響的英美詩人\n\
    \n停止所有的時鐘，切斷電話，\n給狗一塊濃汁的骨頭，讓他別叫\n啞了鋼琴，隨著低沉的鼓\n抬出靈柩，讓哀悼者前來。\n讓直升機在頭頂悲旋\n在天空狂草著資訊他已逝去，\n\
    把黑紗系在信鴿的白頸，\n讓交通員戴上黑色的手套。\n他曾經是我的東，我的西，我的南，我的北，\n我的工作日，我的休息日，\n我的正午，我的夜半，我的話語，我的歌吟，\n\
    我以為愛可以不朽：我錯了。\n不再需要星星，把每一顆都摘掉，\n把月亮包起，拆除太陽，\n傾瀉大海，掃除森林；\n因為什麼也不會，再有意味。\n\n這是奧登（Wystan\
    \ Hugh Auden，1907~1973）為他的愛人寫的詩。\n\n# 如果眾人對你心存猜忌 你仍能自信如常\n並認為他們的猜忌發難 還是算情有可原\n\
    \n# 英文詩《如果》----拉迪亞德·吉卜林\n\n芸芸眾生，誰不想成功，誰不想令世人矚目，詩人在詩中展示了成功背後，包含多少的辛酸，經歷多少的磨難，忍受多少的痛楚。如果人們能正視成功前的種種困難，勇於接受挑戰；失敗了，何畏懼，重頭再來。那樣，我們便成爲了一個頂天立地之人。這是獻給年輕人的詩！\n\
    \n【如果 —— 拉迪亞德·吉卜林】\n\n如果周圍的人毫無理性地向你發難，你仍能鎮定自若保持冷靜；\n如果眾人對你心存猜忌，你仍能自信如常並認為他們的猜忌情有可原；\n\
    如果你肯耐心等待不急不躁，\n或遭人誹謗卻不以牙還牙，\n或遭人憎恨卻不以惡報惡；\n既不裝腔作勢，亦不氣盛趾高；\n如果你有夢想，而又不為夢主宰；\n如果你有神思，而又不走火入魔；\n\
    如果你坦然面對勝利和災難，對虛渺的勝負榮辱胸懷曠蕩；\n如果你能忍受有這樣的無賴，歪曲你的口吐真言矇騙笨漢，\n或看著心血鑄就的事業崩潰，仍能忍辱負重腳踏實地重新攀登；\n\
    如果你敢把取得的一切勝利，為了更崇高的目標孤注一擲，\n面臨失去，決心從頭再來而絕口不提自己的損失；\n如果人們早已離你而去，你仍能堅守陣地奮力前驅，\n\
    身上已一無所有，唯存意志在高喊『頂住』；\n如果你跟平民交談而不變謙虛之態，\n亦或與王侯散步而不露諂媚之顏；\n如果敵友都無法對你造成傷害；\n如果衆人對你信賴有加卻不過分依賴；\n\
    如果你能惜時如金利用每一分鐘不可追回的光陰；\n那麼，你的修為就會如天地般博大，並擁有了屬於自己的世界，\n更重要的是：孩子，你成為了真正頂天立地之人！\n\
    \n# 【原文】\n\nIf------\nBy JosepH Ruyard Kipling\n\nIf you can keep your head when\
    \ all about you\nAre losing theirs and blaming it on you;\nIf you can trust yourself\
    \ when all men doubt you,\nBut make allowance for their doubting too;\nIf you\
    \ can wait and not be tired by waiting,\n"
