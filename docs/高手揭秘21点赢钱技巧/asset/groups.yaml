    ## 帝國衰敗的原因：見仁見智？只是在推銷西方人的看法


    哈濟生（Marshall G.S. Hodgson）著有《伊斯蘭文明：火藥帝國與現代伊斯蘭》(The Venture of Islam: The Gunpowder
    Empires and Modern Times)的內容講到：關於薩法維波斯帝國、帖木兒帝國與鄂圖曼土耳其帝國帶來的二次繁盛，以及二十世紀穆斯林對抗西方，獨立自決意識如何興起。


    歷史學家哈濟生總結十四至十八世紀薩法維、帖木兒、鄂圖曼三個回教文明帝國衰敗原因——：


    - 一、賴以爲生的物資竭盡；

    - 二、人民創造力衰竭及文化無法屹立於世；

    - 三、維持社會秩序的社會權力失靈。


    馬歇爾.哈濟生（Marshall G. S. Hodgson, 1922—1968）是美國歷史學家，曾任美國芝加哥大學社會思想委員會主席。專精於伊斯蘭研究，並於芝加哥大學教授相關學科。他所撰寫的《伊斯蘭文明》在
    1975 年才由友人彙整完成，出版後立即被視為該領域最具權威的經典之一，作者也因此被譽爲美國最具影響力的伊斯蘭史學家。


    哈濟生也於世界歷史領域耕耘不倦，曾撰寫多篇關於比較史學的短文，在 1993 年被<劍橋大學出版社>集結成冊，出版《世界歷史的再思考：歐洲、伊斯蘭及世界歷史研究文集》（Rethinking
    World History: Essays on Europe, Islam and World History）一書，哈濟生生前世界歷史的研究成果終爲世人所見。


