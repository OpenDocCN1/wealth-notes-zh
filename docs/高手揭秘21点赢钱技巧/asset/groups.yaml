    每次大跌都是大好機會，你可以挑選被股災風暴嚇走的投資人丟棄的廉價股票。


    投資與買賣，盡量簡單就是。


    有時得遠離市場，遠離群眾。


    第一條是要能不輸，第二條是記住第一條。


    好公司+便宜價格=買進。


    愈能不繁，就愈不凡。


    記住：慢即快，少即多。


    墜幕上那些人，又來洗腦和催眠了！媒體記者最喜歡為虎作倀。


    真理就是這麼簡單——逢低買進；但大家並不相信真理就是那麼簡單。


