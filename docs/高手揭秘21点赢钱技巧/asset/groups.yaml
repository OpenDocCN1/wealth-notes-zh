    ### <沃爾瑪>改名 加速去實體化


    全球最大零售商<沃爾瑪>宣布，明年 2 月 1 日起將更改其法定登記名稱，從「 Wal-Mart Stores 」更名爲「 Wal-Mart 」，刪除「 Stores
    」（商店）一字，象徵在亞馬遜等電商業者來勢洶洶之際，<沃爾瑪>正在「去實體化」，從純實體店面的經營模式轉型。


    <沃爾瑪>表示，此舉凸顯該公司愈來愈重視提供消費者不同方式的購物服務，不再只透過實體店面，也透過讓消費者在網路與行動裝置上下單，並透過物流業者取貨。2 月
    1 日是<沃爾瑪>會計年度的起算日。


    <沃爾瑪>執行長董明倫說：「無論是透過實體店面、網站、手機、聲控裝置，或未來任何新發明，我們顧客認識的<沃爾瑪>就只有一個。」董明倫已帶領沃爾瑪轉型爲電商巨人，如收購
    Jet.com 與 Bonobos 等網路零售商，並提供兩日免運，也聘請長春藤校友經營網路業務，與 Google 合作開發聲控購物。


    <沃爾瑪>已大規模投資線上事業，希望積極縮小與電商巨擘亞馬遜的差距。該公司線上銷售的商品品項比一年前增加三倍，同時大幅調整免運費的策略，也擴增讓消費者能順道到實體店面提領訂購的生鮮食品等服務，幫助<沃爾瑪>過去幾季的電商事業營收強勁增長。


    Consumer Edge 研究公司分析師席克表示，<沃爾瑪>此舉只是將消費者在實體和數位店面上看到的名子協調成一一致，畢竟<沃爾瑪>已經開始轉型一段時間。


    <沃爾瑪>1969 年 10 月的法定名稱是 Wal-Mart，但隔年 1 月改爲 Wal-Mart Stores，同年股票掛牌上市。不過，<沃爾瑪>從 2008
    年 6 月起，就一直在實體店面——使用現在的 Walmart 商標。/2017/12/8*


