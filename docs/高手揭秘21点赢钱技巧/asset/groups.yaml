    ## 保羅·蓋蒂向中東進軍


    二戰結束後，在戰爭中大發戰爭財的保羅·蓋蒂（Paul Getty，1892~1976）已經快 60 歲了，但卻雄心未減。他敏銳地感覺到未來的石油發展應該是中東，那裡將會是未來的世界油庫，而蓋蒂家族的前景也取決於中東。他要在中東開發石油，在美國的煉油廠提煉。但當時中東地區已被英國石油公司、荷蘭皇家殼牌石油公司、美孚石油公司等
    7 家大公司所控制，要想打進去很困難。


    沒有人會想到，保羅·蓋蒂最後看中了沙地阿拉伯和科威特之間一塊不毛之地，這是一個屬於兩國共管的中立區，是一大片沙漠。保羅·蓋蒂的石油地質學家駕著飛機從空中觀察地形地貌，斷定那下面埋藏著石油。經過談判，保羅·蓋蒂獲得了
    60 年石油開採特許權，但他必須滿足沙地阿拉伯提出的相當苛刻的條件，要冒極大的風險。美國石油工業界許多人公開指出，保羅·蓋蒂這樣做注定是要破產的，他們認為那裡根本不可能出油。


    保羅·蓋蒂卻很有信心，他敢於這樣做，是因為他認為在「沙特」開採石油成本低廉，著眼於石油價格上漲因素，他斷定那塊地從長遠來看是必定能賺大錢的。


    在 4 年中，保羅·蓋蒂先後投下了 4000 萬美元，但只產出少量劣質油。這種油很難提煉，幾乎沒有商業價值。石油工業界的預言似乎已經被驗證了，連保羅·蓋蒂本人也顯露出焦躁不安的情緒，畢竟他已經不再年輕了。


    然而，在經歷了 4 年之久的不斷挫折之後，成功意外地降臨了。1953 年 2 月 10 日，這片不被看好的土地上發現了含油砂層，接著就開始向外噴油。這一發現徹底扭轉了保羅·蓋蒂的命運，美國《幸福》雜誌稱這一發現是「偉大的、歷史性的」。高產油井被一口接一口地打了出來，一個月內，蓋蒂公司的股票從
    23.75 美元猛然上升到 47.75 美元，保羅·蓋蒂的財富又開始成倍地增加。


    根據石油地質學家們保守的估計：保羅·蓋蒂的中立區油田儲油量在 13 兆億桶以上。爲此，保羅·蓋蒂在各地建造和購買了煉油廠；從 1954 年起，保羅·蓋蒂開始營建他的超級油船隊，在洛杉磯、紐約，他以驚人的速度建起了價值超過
    4000 萬美元的新辦公樓。1957 年，保羅·蓋蒂的資產就已超過 10 億美元。這一年，《命運》雜誌列出美國最富有的人名單時，保羅·蓋蒂名列榜首。


