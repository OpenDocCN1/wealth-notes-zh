    馬歇爾.哈濟生（Marshall G. S. Hodgson, 1922—1968）是美國歷史學家，曾任美國芝加哥大學社會思想委員會主席。專精於伊斯蘭研究，並於芝加哥大學教授相關學科。他所撰寫的《伊斯蘭文明》在
    1975 年才由友人彙整完成，出版後立即被視為該領域最具權威的經典之一，作者也因此被譽爲美國最具影響力的伊斯蘭史學家。


    哈濟生也於世界歷史領域耕耘不倦，曾撰寫多篇關於比較史學的短文，在 1993 年被<劍橋大學出版社>集結成冊，出版《世界歷史的再思考：歐洲、伊斯蘭及世界歷史研究文集》（Rethinking
