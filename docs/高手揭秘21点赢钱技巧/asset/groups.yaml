    ## 南韓10大財閥營業利潤 又翻上一倍


    ### 壓縮中小企業生存空間 造成創業不振


    在三星電子（Samsung Electronics）與 SK 海力士（SK Hynix）晶片業務蓬勃發展的帶動下，韓國前 10 大上市財閥今年前 3 季的利潤合計增加近
    1 倍，創下歷年同期新高。


    根據韓國市調機構「<財閥網>」（Chaebol.com）數據顯示，韓國前 10 大財閥今年前 3 季營業利潤合計達到 62.5 兆韓元（台幣 1.7 兆元），較去年同期暴增
    95%。其中三星電子與 SK 海力士 2 家公司在 10 大財閥的利潤占比，從去年的 30% 攀升至逾 50%，顯示晶片大廠對於韓國企業發展的重要性與日俱增。


    在韓國半導體業「超級循環」的帶動下，三星電子與 SK 海力士業績表現亮眼。由於 DRAM 晶片是新一代行動裝置與伺服器的必備零件，而全球對於 DRAM 晶片需求強勁導致供給緊俏。


    這一最新數據亦顯示，隨著全球貿易逐漸復甦，令韓國出口導向型的經濟前景可期，韓國企業界瀰漫著一股樂觀情緒。


    <財閥網>預估，韓國 10 大財閥今年全年營業利潤可望達到 80 兆韓元，較去年全年的 44.5 兆韓元暴增逾 80%。


    但部分分析師指出：韓國經濟過度依賴半導體產業是一大隱憂。 <財閥網>主管鄭淳燮（Chung Sun-sup，音譯）表示：「由於大陸晶片供給逐漸增加，加上韓國半導體產業因應外部衝擊的能力較弱，因此晶片價格未來可能會下降。」


    鄭淳燮亦表示：韓元轉強同樣不利於韓國出口經濟發展。自今年 1 月以來，韓元兌美元已升值近 9%。


    相對於半導體業呈現一片欣欣向榮，韓國汽車業則陷入衰退。 <財閥網>數據顯示，韓國汽車大廠現代汽車（Hyundai Motor）今年前 3 季營業利潤較去年同期衰退逾
    20%。


