    ## 台積電上市23年 投報率高達89.6倍


    <台積電>成立於 1987 年，今年邁入第 30 年。創立之初，就是首創專業晶圓製造業務，專門爲晶片廠製造晶片，成爲全球首家晶圓代工廠。


    <台積電>上市超過 23 年，市值從 748 億元攀增至近 5.72 兆元，翻了 76.3 倍，不僅穩居台股權值王，也躍升爲全球半導體巨擘。<台積電>賺錢一把罩，年年賺錢、配股配息，股價表現也沒讓人失望，若投資人從上市抱到現在，投報率高達
    89.6 倍，十分驚人。


    <台積電>成立於 1987 年，由張忠謀擔任董事長一職，今年邁入第 30 年。7 年後，公司在 1994 年 9 月 5 日上市，開盤及收盤都是 96 元；有趣的是，台積電掛牌首周的單日成交量竟都不到
    5 張，很難讓人聯想到當時的<台積電>，日後竟會變成穩居台股市值第一的權值王。


    <台積電>近 23 年，股本從 78 億元膨脹到目前的 2,593 億元，總市值也從 748.8 億元攀升至近 5.72 兆元，公司規模及股價大幅提升。換句話說，如果在台積電掛牌首日買進的投資人，只要長抱到昨日爲止，包含「股子股孫」在內，整體投資報酬率竟然高達
    89.6 倍。


    爲了因應半導體產業的高資本支出需求，並兼顧股東、員工權益，<台積電>早期以配發股票股利爲主，曾連續 18 年配股，股本不斷增加下，也讓<台積電>在 1997
    年首次登上台股市值冠軍寶座。


    近年來，隨著公司營運現金變多及獲利提升，<台積電>股利政策自 2009 年轉變以配息居多，去年度每股現金股利達 7 元新高，連續配息期間長達 14 年。


    對於台積未來展望，台新投顧副總黃文清認爲，<台積電>已把未來 3～5 年先進製程布局完成，現階段依然維持領先地位，與競爭者皆有一定程度的差距，除了手機晶片需求是目前主要營收來源之外，物聯網、AI、車用等長期趨勢應用，<台積電>可望都是主要受惠者，看好未來還有很大的成長空間。


    而外資持有台積股票占比持續提高，在 2004 年 8 月首度超過 5 成，目前已達到近 8 成水準，去年光是現金股利，外資就領走了 1,455 億元。有市場人士嘆息，<台積電>成立
    30 年來，爲台灣經濟與半導體產業貢獻良多，只可惜在資本市場中，大部分的成長果實都被外資拿走了，令人感到相當可惜。／2017/10/3*


