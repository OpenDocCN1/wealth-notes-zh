    \n### 星巴克（Starbucks）咖啡\n\n星巴克（Starbucks）咖啡連鎖店在 1971 年在美國西雅圖的派克地市場（Seattle's Place\
    \ Market）開設第一家店，距今已有數十年，2002 年的年營業額是 33 億美元。星巴克改變了美國人的牛飲咖啡的習慣。前總統柯林頓常是以星巴克咖啡豆餽贈國外貴賓；這星巴克被看成是美國當代文化的不可或缺的象徵。\n\
    \n星巴克取名得自海曼．梅爾維爾（Herman Melville）的名著《白鯨記》（Moby Dick）中的角色——那冷靜又愛喝咖啡的大副星巴克，它的商標是取材於十六世紀的斯堪地那維亞的雙人魚的木雕圖案。\n\
    \n星巴克的歷史又可分成兩個階段；在 1987 年之前的星巴克，\n\n是由三位創業夥伴所設立的；不過到了 1984 年有一位創辦人堅持舉債購併另一家聞名的「畢茲咖啡」後，因爲債務負擔太重，財務發生了問題，於是在\
    \ 1987 年由現任董事長霍華德·蕭茲（Howard Schultz）入主，大力推動轉型，並且在 1992 年六月 26 日在那斯達克掛牌；在十年之間，由當年分店數的\
    \ 165 家，總市值 2.7 億，成長到分店數的 5688 家，總市值也成長了 28 倍，達 79.6 億美元，這時已經是一家相當令人敬佩的企業了！\n\n\
    ### 攻擊可以得分\n\n霍華德·蕭茲在接掌星巴克之後，將星巴克由一家財務有問題的企業，經營到全美最大的咖啡連鎖事業。依他個人的看法是，有很多的老闆善於創業，卻拙於治理日益龐大的公司，他引用一句美式足球的諺語說：「攻擊可以得分，防守可以贏得比賽！」——這就成爲治理企業的理念了！\n\
    \n霍華德·蕭茲謹記星巴克的三位創辦者的教訓，在追求擴張的同時，也在財務上做好同樣的準備，這讓星巴克一路走來，成長得十分扎實，沒有什麼雜音。\n\n投資人必須謹記在心的是，市場有多頭與空頭的分別，在多頭時的進攻容易得分，在空頭時則必須防守才能贏得比賽！在金融市場上的投資與投機（speculation），都必須對於霍華德·蕭茲存有三分的敬意。\n\
    \n「攻擊可以得分，防守可以贏得比賽」的這句話，也很適用於證券市場之中，不過，筆者將它更加的中文化為——「攻擊可以得分，防守可以獲勝」！\n\n### 2008\
    \ 搶救星巴克\n\n星巴克（Starbucks）咖啡 2007 年股價暴跌 45%，2007/11 月間美國的連鎖店更是創店 36 年來顧客人數首見負成長。創辦人霍華德.蕭茲決定請執行長唐納德走人，自己重新掌舵，宣佈放慢在美國增設新分店的腳步，關閉業績不佳的分店，加快拓展海外市場；更重要的是，重新和顧客博感情。\n\
    \n不過，《華爾街日報》（*The Wall Street Journal*） 2008/1/7 在頭版大幅報導，速食業龍頭麥當勞將增設咖啡吧，出售專人沖泡的星巴克式義大利式咖啡，這是麥當勞\
    \ 30 年來最大一次新增「食譜」，兩雄火併更白熱。\n\n麥當勞計畫在全美近 1 萬 4,000 間速食店增賣卡布奇諾（cappuccino）、拿鐵（latte）、摩卡（mochas）、Frappe（類似星巴克的\
    \ Frappuccino），預期年度銷售額增加 10 億美元，占年營收 216 億美元的 5%。\n\n麥當勞自認加賣義式咖啡最大優勢，在於便利及價格低，顧客在點了漢堡後，順道再來杯好咖啡，賣點不錯；但漢堡速食本是省時省事，速戰速決；義式咖啡則重品味與情調，兩者是否搭調，對麥當勞是一大挑戰。華爾街並不預期星巴克顧客會被麥當勞大量搶走。\n\
    \n霍華德.蕭茲在會促安排的視訊會議中表示，星巴克的問題有部分是因 2007 年經濟不好、牛奶漲價，但自身管理問題也難辭其咎，包括業務擴充過快。2007 年星巴克光在美國開\
    \ 2600 家新分店，以致投資超過成長曲線，讓星巴克淪於「官僚」文化，服務品質也需改進。\n\n霍華德.蕭茲說：既然是自己製造的問題，就一定能解決。這\n\
    \n家全球最大咖啡連鎖店近來受到不景氣和對手瓜分市場影響，還因為原料成本上升，去年兩度漲價。去年底股價重挫，資產市值縮水爲 30 億美元。\n\n## 美國研究：O型血的人較不怕空污\n\
    \n美國有一份研究指出，處在空氣汙染的環境中，不同血型的人罹患心臟疾病的機率竟然有著密切關聯！\n\n空氣汙染竟對 A 型血、B 型血或 AB 型血的人來說，有著更大的風險！美國心臟協會(AHA)的最新研究指出，在空氣汙染的環境中，O\
    \ 型血的人比 A 型血、B 型血或 AB 型血的人罹患心臟疾病的機率還低。\n\n研究顯示，當細懸浮微粒(PM2.5)每增加 10 微克時，A 型、B 型或\
    \ AB 型血的人，罹患心臟疾病的風險會增加 25%；但 O 型血的人罹患心臟疾病的風險增加約 10% 左右，相較其他血型的人來說較低。\n\n對此，研究指出這是因為\
    \ A 型血、B 型血或 AB 型血血的人，在血液中有較多的凝血組織，所以罹患心臟疾病的風險相對就比較高。一名臨床流行病學與心臟研究博士 Benjamin\
    \ Horne 表示，「非 O 型血的人，心臟疾病發作和空氣汙染之間的關聯並沒有那麼可怕，不過這是一件非常值得注意的事。」/2017/12/1*\n\n>\
