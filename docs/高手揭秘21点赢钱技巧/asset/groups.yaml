    線上影片串流服務業者<網飛>（Netflix）周四宣布在美國調漲月費，以便支撐龐大影片內容開銷，繼續投資製作更多原創影集及電影，抵擋 Hulu、亞馬遜及蘋果等衆多對手夾擊。


    周四消息公布後投資人依舊看好<網飛>後市，認爲<網飛>即便漲價也不至於流失用戶，激勵<網飛>股價在周四收盤大漲 5.4% 至 194.39 美元，創下歷史新高，周五早盤續漲至
    195.34 美元。


    截至周四爲止，訂閱<網飛>標準方案的美國新用戶月費調漲 1 美元至 10.99 美元，高級方案月費也調漲 2 美元至 13.99 美元，只有基本方案月費維持在
    7.99 美元不變。標準方案用戶能同時在 2 台裝置上串流<網飛>影片，而高級方案用戶能同時在 4 台裝置上串流影片。


    <網飛>表示，美國 5,000 萬名現有用戶將在未來幾個月內陸續改用新價格。


    <網飛>先前曾表示明年將投入 70 億美元左右的預算製作影片內容，再加上近年線上影片串流服務市場對手激增，因此這回漲價早在外界預料之中。


    <網飛>近期推出的《王冠》（The Crown）及《怪奇物語》（Stranger Things）等原創影集好評不斷，但對手 Hulu 的原創影集《侍女的故事》（The
    Handmaid''s Tale）卻贏得今年艾美獎最佳劇情類影集的殊榮，創下線上串流影片界首例。亞馬遜及蘋果也宣布明年擴大投資製作原創影片。


    除了眾家線上影片串流業者之外，傳統電視台也相繼推出線上影片串流服務，例如 CBS 電視台的 All Access 線上影片服務。迪士尼也宣布自 2019 年起推出迪士尼品牌線上影片串流服務，就連
    Sling TV 及 YouTube TV 等網路電視也加入戰局，令<網飛>備感壓力。


    <網飛>爲了加緊腳步充實影片陣容，不僅重金挖角多位好萊塢知名製作人，還在近日投資 5,000 萬至 1 億美元買下漫畫出版商 Millarworld，成爲<網飛>史上第一筆購併案。／2017/10/7


    ## 產品隨時推陳創新 就不必代言人与廣告


    ### 經營缺少創新 只好請代言人与花錢廣告


    - 投資，只需要小學水準。

    - 反智人士最常說的話：世上有一半的書，是笨人寫給笨人看的。不論身心，閱讀有益！

    - 心存投機的人到證券市場的投機，本質上還是實業的投資。

    - 如果你一時找不到合適的投資品種，就等待吧！等待——是價值投資的精髓！

    - 機會永遠存在，你要有這個耐心，把資金放在那裡，等著大機會的出現。絕大部分的人是做不到這一點的。

    - 活著才是第一順位的。投資的精髓是複利，只要保住本金，然後每年都有一個穩定的收益，哪怕回報很低，多少年後也是相當驚人的。

    - 不是每個人都能在股市中賺錢的，除了專業水準較高的投資人之外，千萬不要把自己的全部家當押在股市上。

    - 耐心的等待，一直等到你看到，或者發現，或者碰到，或者通過研究發掘到——你覺得穩如探囊取物的東西，這時你唯一要做的事情，就是進場把錢撿起來。

    - 投機像山嶽一樣古老，人心總是蛇吞象。


    在證券市場裡，應該把『人棄我取，人取我予』做為一種最基本思維方式來運用，在別人貪婪時謹慎一些，在別人恐懼時大膽一些。


    買入靠信心，持有靠耐心，賣出靠決心。


    只有在低檔時持股，最後才能賺大錢。


    企業價值決定股票長期價格。要想在研究股票時保持平常心，必須要有一套對股票價格高低的判斷標準，即使使用的是一些簡單的判斷標準也沒關係，重要的是你一定要擁有。


    不要急躁地預測市場。判斷股價到達什麼水準，比預測多久才會到達某種水準容易，準確預測短期走勢的機率很難超過 60%，如果你每次都去嘗試，不僅會損失金錢，更會不斷損害你的信心。


    每次大跌都是大好機會，你可以挑選被股災風暴嚇走的投資人丟棄的廉價股票。


    投資與買賣，盡量簡單就是。


    有時得遠離市場，遠離群眾。


    第一條是要能不輸，第二條是記住第一條。


    好公司+便宜價格=買進。


    愈能不繁，就愈不凡。


    記住：慢即快，少即多。


    墜幕上那些人，又來洗腦和催眠了！媒體記者最喜歡為虎作倀。


    真理就是這麼簡單——逢低買進；但大家並不相信真理就是那麼簡單。


    - 當市場處於非理性瘋狂上漲之時，離大跌就不遠了。

    - 「專家」的話常常是錯的；因為，很多權威幾乎足不出户，信口開河；他們只是說說而已，自己並沒有做。

    - 只有認真、理性的思考，才能避免在投資中犯一些簡單低級的錯誤。

    - 投資絕不是無知者無畏的事，你對股票的這種籌碼愈瞭解就愈沒風險，你愈不理解的事當然就會覺得風險大。

    - 我們不去訓練企業經營管理者，而是去發現優秀的經營管理者。

    - 貪婪和恐懼永遠是困擾投資人的最大的敵人，市場什麼時候做頭到頂，什麼時候可以觸底抄底，這永遠是困擾投資人最大問題。

    - 根據華爾街股市百年經驗，賠平賺的比例是 5:3:2。

    - 股票籌碼不是任何時候都可以買賣。寧可錯過，也不要做錯。

    - 一時在股市上賺點錢並不難，難的是長期在股市賺錢，難的是當你永遠離開股市的時候賺了許多錢。常在河邊走，就是不濕鞋，應該成為我們努力的方向。一時慢就是一世快！

    - 證券籌碼史短暫的三四百年相對於人類的歷史長河只是一剎那間而已，人類在此期間進化之緩慢，幾乎等於感覺不到的停滯。證券市場，一直不過是貪婪與恐懼的混合物。以前如此，現在如此，看得見的將來也是如此。


    - 真正的價值投資，是知易行難。

    - 賺得清清楚楚的與賺得稀裡糊塗的，從短期來看幾乎有相同的外形：就是「賺錢了」。

    - 長線投資完全不需要太頻繁、太勤快的操作。根據一两天的漲跌來判斷下一步如何應對，那是短線投機客的事。從這一點意義上來說，愈勤勞效果反而愈差。

    - 睡得著覺的就是投資，睡不著覺的就是籌碼。

    - 短線操作，機不可失，並且賺得更多，因為股市永遠有資訊不對稱的時候，提供了很多賺快錢的機會。但是笨人感覺，真正能夠持續地、有效地保持增長，還是價值投資這條路。


    ## 一個企業：有沒有價值？


    面對著證券市場上的風雲變幻，很多投資人都會手足無措、感到力不從心。在這種情況下，投資人想要在投資之中獲利，唯一的辦法就是要對於企業的價值進行徹底的分析，然後針對企業內涵價值的具體情況，做出最終的投資決定，這樣就可以確保自己的能避免損失而獲得成功。————華倫．巴菲特（Warren
    Buffett）


    一個企業：有沒有價值？你必須是市場投資老手，才能回答的！


    ## 【三８五７操作法】盛極而衰，市場熱絡之後漸漸冷卻


    ![](img/53179c30f7028b7317dce6a20859f6f6_110_0.png)


    「三８五７法」是統計研究全球股市波動的大發現：當股市上漲三個月後，未來三個月下跌機率有八成（80%）；當股價下跌五個月之後，未來五個月上漲的機率——雖然稍低一些，但也高達七成（70%）。這一套原則，可以套用在全球各個股市。三８五７波段操作法，適合處變不驚、守株待兔的耐心的投資人，確定性很高，輕鬆輕鬆的利用市場犯錯獲利。在時間的拿捏上，是可以稍帶一點彈性的。


    【三8五7操作法】資金湧進，游資與熱錢，引燃市場水溫


    ![](img/53179c30f7028b7317dce6a20859f6f6_111_0.png)


    證券市場在低迷數個月之後，漸漸升溫；一般是估五個月之久。如果加上之前驚驚跌的三個月，加起來就有八個月之多了。大盤在大家都充滿疑慮的狀況下，迅速的拉高——其實，這是資本家、作手、炒作集團、董監事、金主的造勢推升；逐漸升高的股價，引來媒體的報導，然後吸引來更多的散戶進場；市場人氣來了，成交量是低迷時的x2倍；到了頭部時，平均成交量是x3倍之多；「倒貨」的那一天的成交量是x5~10倍之多。


    ## 要讓事情有效改變 自己必須有效改變


    ### 要讓事情變的更好 自己必須變的更好


    - 股民拜大鱷資神；籌碼大鱷索羅斯被大家奉若神明，但每隔幾年他就有傷元氣的時候。

    - 投機真的不敢說仗仗都贏，以投機的方法是很難持續幾十年複利成長的。不像價值投資，一方面可以輕鬆愉快地工作生活，一方面財富還在不斷積累。

    - 我們只能在大危機時找到便宜的好股票買進，然後就可以放心去周遊世界，做自已喜歡的事情。我們公司高管每年都有一兩個月的時間在外旅遊度假，原因很簡單，投資是一項智慧的行為，而不是一種負擔。

    - 買了輕易不賣，賣了輕易不買；看准了才動，看不准就認錯！

    - 波段操作（swing trading）好股太難找，少之又少。

    - 少關注其他人同期在做什麼，只評價自己幹的是不是理智正確的事。

    - 一個真正長期會上升的股票，往往在其他股票上漲時它不漲。

    - 投資，是個人的合國力；其實，也是對一些最基本的人生道理的認識。


    - 大眾之中的大部分的人，是從來沒有向價值投資靠攏的趨勢。

    - 做任何一個投資，先不要考慮贏，先要考慮會不會輸；能不能退場？

    - 在便宜的時候買進一個好公司，然後長期持有。

    - 很多人也知道應該怎麼賺錢，但他們就是覺得那個太慢，總想投機一下賺一大把，之後再來做價值投資。

    - 實際上真正的好股票是群眾送給你的，資訊很公開的。

    - 董監事最能堅持和等待。

    - 在浮躁的市場中，如果你在低位買進了好股票，就應該像做實業投資一樣堅定持有。

    - 那些日日打開電腦注視著漲漲跌跌行情的眼睛，流露出的眼神就是澳門賭場賭徒的眼神。

    - 市場正在毫不枯燥地重複它的過去，舊戲再度上演，新手變成演員，這也是我們賴以預測的基礎。

    - 根據笨人的經驗：市場一直愚不可及，因為投資人常常會忘了過去。

    - 不刻意去預測市場，而是在價值投資的基礎之上對市場作出必要的判斷。

    - 捕捉到好的賣出時機，永遠比買入時機難——最高點相  常長時間內只有一個。

    - 不做買入決定、而持有現金等待；那在熊市與牛市都很难——等待是價值投資的精髓！買入後就再也輕易不動與持現金等待一樣難。


    - 知道一定有股災發生容易，知道什麼時候發生股災較難。

    - 用現金買入股票似乎最容易；容易的結果——就是容易輸錢！苦無出手段，感覺最好。

    - 賣掉一支差勁的股票，同時又能立即買進一支好股票難！同時做兩個正確的決定難。

    - 賣掉一支好股票，立即又買進另一支更好的股票更難；判斷兩個好股票哪個更好更難。

    - 賣掉差勁的股票後，持有現金長時間等待最難；知錯就徹底改正最難。

    - 做出賣掉過分高估的好股票，等待其下跌的決定難；認定是好股就容易沉溺過度，好股票有時候會太貴了。

    - 看大盤難，不看大盤也難！我們將預測大勢當益智遊戲對待。

    - 要在股市裡長期賺錢，遠比想像得的容易，也比實際的難上加難。

    - 笨人總是看價格；其實，價格總是圍繞價值波動。

    - 真正的市場價格不是被高估就是被低估，即使已經到了預先的估值價格，實際上高於價值的那部分價格至少還有成倍的上漲空間。

    - 股票永遠不是高估就是低估，市場可能會提前透露這支公司未來 10 年的增長。


    - 市場膨脹時如果太過理智，就賺不到大錢；但市場過度膨脹時不冷靜，又可能搶高價被套。

    - 股市從某一瞬間講——都是永遠不合理，股市從長期平均下來才合理！

    - 即使在像華爾街這樣的成熟市場，1999年也因为偏好網路股而給出了很高的溢價，虧損的網路公司的股票也可以漲到幾十美元，這導致納斯達克指數從 1000 多點很快冲到
    5000 點，之後又很快從 5000 多點跌回 1000 多點。

    - 投資首先要判斷所投資的股票——所屬的行業，在自己的國度裡是處在上升週期還是下降週期，是朝陽還是夕陽？

    - 選擇股票，首先要判斷公司是處於哪個階段，不在好的行業階段，再優秀的企業家去經營也沒有用。

    - 投資人除了關注企業壟斷是否存在、是否正在形成的過程中，還要時刻關注這個壟斷是否會被打破。一旦行業壟斷被打破，原有壟斷企業會輸得很慘。

    - 機會總是偏愛有準備的人，只有他們才能在第一時間做出反應。


