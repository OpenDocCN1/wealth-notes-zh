    \n研究報告指出，鳥蛋的形狀各異，有橢圓形、尖形和球形等，似乎與各種鳥類的飛行能力有關。\n\n相關研究報告昨天刊登在美國《科學》雜誌（Science）上，這是針對鳥蛋形狀成因進行最廣泛研究，而這個謎團困惑了科學家數百年之久。\n\
    \n美國普林斯頓大學（Princeton）生物學家、報告主要執筆人之一史托達德（Mary Caswell Stoddard）說：「與典型的假設相較下，我們發現，飛行也許會影響到鳥蛋的形狀。擅長飛行的鳥往往會生下形狀不對稱或橢圓形的蛋。」\n\
    \n研究的另 1 項發現在於，使大自然的鳥蛋形狀多元的原因在鳥蛋的彈性內膜，而不是硬外殼。\n\n重點是，最具有空氣動力優點的鳥類，往往會產下長形或尖形的蛋。\n\
    \n另 1 名報告執筆人、倫敦帝國學院（Imperial College London）的托比亞斯（Joseph Tobias）說：「各種鳥類的蛋大小和形狀各異，並非只是隨機現象，而是有生態方面的原因，尤其與每一鳥種能強有力、且方便飛行到何種程度的天賦有關。」／2017/6/24*\n\
    \n## 美國員工最愛的50位執行長 只有3位是女性\n\n美國求職網站 Glassdoor 訪問企業員工，選出 2017 年最受歡迎的 50 位執行長，其中只有\
    \ 3 位是女性：租車公司 Enterprise Holding 執行長尼科爾森、速食品牌 In-N-Out Burger 執行長史耐德以及德勤會計師事務所執行長恩格波特。\n\
    \n非營利機構 Catalyst 的報告顯示，標普 500 指數的美國 500 家上市公司中，只有 23 家企業由女性擔任執行長，比率是 4.6%。除了女性執行長的數量本來就比較少之外，還有一個更深層的原因：與男人相比，成功的女人較不受人喜愛。\n\
    \n根據麥肯錫和網站 Lean In 的報告，女人比男人更常要求升職或加薪，但獲得採納的機率遠低於男人。這些爲自己發聲的女人，被認爲「太有攻擊性」或「嚇人」的比率，比男人多出\
    \ 30%。\n\n<臉書>營運長桑柏格表示：「我們都認爲女性應該更懂得合作，更願意將個人欲望放在團隊之後。所以當一個女人想要爲自己發聲，我們就會不喜歡她。女人每一天都要在看起來聰明、自信和表現溫暖、討人喜歡這些特質間拉扯。」／2017/6/23*\n\
