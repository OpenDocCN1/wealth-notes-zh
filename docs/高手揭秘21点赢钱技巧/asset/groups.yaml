    鑽石來源爲透過鑽石開採貿易公司戴比爾斯 (De Beers) 和俄羅斯埃羅莎集團 (Alrosa) 的批發市場，鑽石色澤和淨度都必須列於前五級內。


    不過，網站 PolishedPrices 的資料顯示，鑽石價格已從 2011 年高點下滑逾 30%，主要受到中國市場趨緩，以及年輕消費者在智慧手機和裝置上花費更多所致。黃金價格從當年高點回落的跌幅也差不多，因股市回升和全球經濟復甦。


