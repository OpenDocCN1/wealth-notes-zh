    ### 下雪天過節氣氛較濃…刺激購買欲


    權威氣象預報機構 AccuWeather 於 2017/12/6 表示，美國今年 11 月到 12 月的年底購物旺季業績，可能比全美零售協會（NRF）估計值高出
    40 億美元，部分原因是美國某些地區出現低溫和降雪，過節氣氛較濃，刺激消費者對季節性商品的購買欲。


    AccuWeather 預估，包含網路和實體門市，消費者今年年底購物旺季將花掉 6,833 億美元，比去年同期多 4.2%或 275 億美元，高於 NRF
    原本預估的增加 236 億至 262 億美元。


    根據 AccuWeather，美國多數地區氣溫雖高於正常水準，導致購物季開跑至今業績平平，但某些地區可能出現「低於正常水準」的溫度、刺激買氣，讓購物季業績大進補。美國東北部從波士頓到里奇蒙，這幾周就可能下雪。


    另外，Adobe Analytics 公司表示，11 月 1 日到 12 月 5 日期間，美國消費者的網購消費額累計達 651.5 億美元，較一年前增加 14.7%。其中，用智慧手機購物蔚為潮流，今年電商有
    22%營收來自手機端用戶。亞馬遜透露，今年感恩節來自行動端用戶的訂單數量，比去年同一天激增 50%。／2017/12/8*


