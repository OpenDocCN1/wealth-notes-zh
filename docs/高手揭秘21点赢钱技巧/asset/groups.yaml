    ## Tempus的新十大金律


    羅伯特·科爾（Robert Cole）是英國《泰晤士報》（The Times）的投資專欄 Tempus 的主筆；他的投資操盤理念的精華是 ——：


    - 一）. 以多取勝與逆勢先行

    - 二）. 最重要的是價值、價值、價值

    - 三）. 人氣旺不旺之旅

    - 四）. 必須有階段性的調整

    - 五）. 為了資金，必須尋找避風港

    - 六）. 物有所值

    - 七）. 媒體消息聞道有先後？

    - 八）. 要保持安全的距離

    - 九）. 是否有特殊的誘因存在？

    - 十）. 必須要破除成見


