    diligence）的一環。」


    美國銀行和花旗集團都尚未準備提供結算服務，<高盛>已搶先一步。<高盛>執行長貝蘭克梵上個月曾表示：<高盛>需要一套比特幣的策略，他不認為此數位貨幣是保值的工具。貝蘭克梵日前接受彭博電視訪問時還說，考量比特幣的波動性，他覺得<高盛>並不交易比特幣的急迫性。


