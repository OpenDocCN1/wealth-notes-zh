    \ 對人類大腦運作方式的闡釋可知，為快速提升決策效率，決策者習於依賴反射性直覺思考系統的「快思」，而較少使用按部就班理性思考系統的「慢想」。\n\n# 犯下這幾種錯誤的決定\
    \ 也讓企業家感到後悔！\n\n世人大多崇拜有錢人，有錢人的地位比學者還要高，也比官員們高。不過，當人們常聽到很多企業家分享——他們人生的成功的經過時，也能設法從他們打拚崛起的過程中，體認到那一股衝勁與毅力！\n\
    \n但在這些光鮮亮麗的背後，所謂的企業家其實也有不爲人知的辛酸苦楚，並且在無形之中——丟失了一些牽絆；最常見的是長期處於壓力之下而失去了健康與長壽。\n\n\
    媒體《SmartIncome》曾訪問了一些成功企業家，再從這些人的分享中，統整出種種不同的遺憾，或許你在追求輝煌事業的同時，可別走再步上他們不高明的一著道路——：\n\
    \n- 1). 太急著實現自己的目標：\n  或許是要達到自己的績效目標、也或許是想要達成人生成就感，許多人會在年輕時期花費奉泰的光陰在奉獻工作，追求完美、不容許自己犯下半點錯誤；但這樣一味追求捷徑的結果，往往會因爲心急而達不到真正的目標。\n\
    \n- 2). 太保守、而不敢有所突破：\n  那些成功的執行長回憶道：在年輕時有時做的選擇，往往并不是有太積極的創舉；這可能因爲當時公司的風氣守舊或保守，也可能是害怕決策讓公司慘賠，而沒有太多的勇敢嘗試；回頭再來，如果有機會再冒一次險，他們會做不一樣的决定。\n\
    \n- 3). 疏忽了家庭關係：\n  有太多太多的企業家因為忙於工作，而忽略了與親屬、家人、孩子的相處時光，不管是頻繁的出差、或是早出晚歸，能跟孩子的互動是少之又少，這反而變成一種疏遠的情感，造成孩子走偏、叛逆。\n\
    \n  無論如何，工作絕對不會比家庭來得還重要，更不應該疏忽對孩子的陪伴。\n\n- 4). 只注重產品，而不是重視消費者的感受：\n  過分重視於產品的成效、商品——的能帶給社會大眾什麼樣的印象，常常是許多企業家在犯的詬病；不過，真正的服務，應該是以消費者為重心，以他們的角度來開發商品才是關鍵。\n\
    \n  養成傾聽的習慣，可彌補這方面的不足。\n\n- 5). 自以爲是，沒有注重企業文化：\n  「企業文化」其實是一個品牌成功與否的重要關鍵；但有些人可能不喜歡公司、看不慣公司的某些決策，而暗地裡說一些公司的不是。而真正的成功方式，是要對企業的理念與文化認同，才能做出正確的決定。\n\
    \n- 6). 没有找到一位導師：\n  人們在工作上進的過程中，通常可以尋覓到一位值得學習的對象；這不要覺得丟臉或害羞，主動請教與詢問，你會在職場學習到更多豐沛的知識。\n\
    \n- 7). 在工作投入私人感情：\n  有時候，「公私分明」還是非常重要的；當你在工作中投入了過多個人情感、擔憂某些決策可能會影響感情、信賴，那些其實都是多餘的，而且也會令人做出錯誤決定。\n\
    \n- 8). 聽不見別人意見或建議：\n  那些成功的企業家回憶說：年輕時總是對自己充滿自信、覺得自我的決定一定是最正確、並且理所當然的；他們往往都聽不見他人給的提點或分享；那種一意孤行的態度，或許可能曾經證明自己是對；但在更多的時候，只是在破壞同事間的合作關係，也讓人做事更顯僵化。\n\
    \n- 9). 從來沒有好好休息：\n  有太多太多忙於工作的企業家，幾乎是第一個到達公司，而且也是最晚一位離開崗位的；他們常常覺得睡眠是多餘的、能夠多處理一件工作才是最要緊的事，隨時掛心工作的結果，是長時間熬夜、應酬而產生的健康後遺症。\n\
    \n- 10). 沒有享受的時刻：\n  當人生賺到了一堆錢，卻從來沒有花用的時刻，而或是終於有時間可以運用，卻發現自己早已走不動時，那就是人生最遺憾的篇章之一了。\n\
    \n如果可以再做一次選擇，企業家們將決定更早放下工作，畢竟好好享受家庭的天倫之樂、生活的愉悅，才是這一生最幸福的事。/2017/4/15*\n\n> 耐性是天才必不可少的素質之一。——艾默生（Ralph\
