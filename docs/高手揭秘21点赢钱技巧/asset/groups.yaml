    - 根據華爾街股市百年經驗，賠平賺的比例是 5:3:2。

    - 股票籌碼不是任何時候都可以買賣。寧可錯過，也不要做錯。

    - 一時在股市上賺點錢並不難，難的是長期在股市賺錢，難的是當你永遠離開股市的時候賺了許多錢。常在河邊走，就是不濕鞋，應該成為我們努力的方向。一時慢就是一世快！

