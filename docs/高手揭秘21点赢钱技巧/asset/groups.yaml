    \ 泰戈爾\n\n## 老水手見證股市的無常\n\n在人類的行爲世界裡，有一種類似「無動機的惡念」（Motiveless malediction）的東西---那是一種毫無來由的突發邪惡，也是講不出道理的憎恨怨毒。就小的角度來說，它只是惡意的傲慢、官僚習性、或是敵對式的歹念與挑剔的開始：就大的格局來說，那是一種邪惡、仇恨、設計陷害，以及嚴重災難的根源。\n\
    \n在浪漫主義大詩人裡，推柯立芝（Samuel T. Coleridge，1772-1834）的神學與哲學的造詣都很深刻；他寫過許多經典長詩，也都碰觸到了「無動機的惡念」的這個課題，其中又以長達六百多行的《古舟子吟》（The\
    \ Rime of the Ancient Mariner，1798）最堪稱爲代表。\n\n原來，《古舟子吟》這首詩在講一個水手的旅遊故事。他們的船出發向南，在赤道時遇到狂風，被吹到千裡之遙的水域；那是個上帝也遺棄的冰洋。就在束手待斃之際，突然有隻象徵吉兆的信天翁到來，整船的人遂得慶生還。\n\
    \n信天翁也留在船上與水手們為伴！\n\n但有一個水手卻毫無來由的用十字弓把信天翁射死。\n\n最先幾天並沒任何事情發生，其他水手也不以爲意，甚至還認爲殺得好。但是，接下來，天譴災難陸續的發生了，其他水手把信天翁的屍體圍在他的脖子上，作爲他罪惡的標記。但這並不能阻止厄運的一再降臨，最後全船的人都死光了！只有那一個水手獨存活下來！他在懺悔裡得救，逢人——就述說他所經歷的故事。這首詩，就是在他有次對參加婚宴的青年——所講述的自己的經歷。他是劫後餘生之人，也是災難的最後見證。\n\
    \n柯立芝的這首詩，有許多不同觀點的詮釋；其中的一種，就是根據基督——摩尼教的「善惡二元論」，認爲初始只是「無動機的惡念」——\n\n- 那個水手把吉祥鳥「信天翁」射死，他有任何理由嗎？沒有。\n\
    - 水手他可以從殺死信天翁裡得到任何利益嗎？也沒有。\n\n看來，惡念——在剎那間毫無來由的出現，它是一切邪惡的終極本質；它的來去無蹤，難以理解，無法壓抑遏止。惡念只會造成自己和別人的重大災難。那個老水手揹負著災難的悔恨，用他的餘生流浪各地，講述著這個故事。那是他的贖罪修行，詩裡曰：\n\
    \n此後，在不確定的時刻，\n\n那巨大的痛苦，又重新開始煎熬：\n\n除非，我將那恐怖至極的故事被講說出來，\n\n否則，我的內心將永不停止的燃燒。\n\n\
    而老水手這種罪惡與災難的故事，除了對他自己永遠的煎熬外，聽了這故事的人則是：\n\n他離去，有如受到了至大的驚嚇，\n\n並產生一種絕望的感受：\n\n成了一個更悲哀，但也更智慧的人，\n\
    \n在第二天日清晨醒來之後。\n\n柯立芝的這首詩，用字遣詞擅於強調對比及統一；當人們聽了那個罪惡的可怕故事，就成了「更悲哀但也更智慧的人」。人類的智慧往往必須以邪惡的災難做基礎；只有愈絕望、愈悲哀，似乎才愈有智慧，這樣，智慧的代價也未免太大了吧！／2008/12/25\n\
    \n這個《古舟子吟》的水手的經歷，其實就是一個股市散戶的經歷！散戶與水手都要面對許多的突如其來的無常！他們無心的犯上一點錯誤，結果是慘重的代價！可是事非經過不知難，千金難買早知道！\n\
    \n我們建議散戶考慮「雙星多空操作」，不管市場走向何方，你都能保有一半的贏面！除非放空已經被禁止了！\n\n## 忙著按兵不動，才賺\n\n一般在工作受到監督的人，都本能地知道這一點，就是在——當我們看上去無所做爲時，會感到不安！不過，不管員工的動\n"
