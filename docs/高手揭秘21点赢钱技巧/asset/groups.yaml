    沒有人會想到，保羅·蓋蒂最後看中了沙地阿拉伯和科威特之間一塊不毛之地，這是一個屬於兩國共管的中立區，是一大片沙漠。保羅·蓋蒂的石油地質學家駕著飛機從空中觀察地形地貌，斷定那下面埋藏著石油。經過談判，保羅·蓋蒂獲得了
    60 年石油開採特許權，但他必須滿足沙地阿拉伯提出的相當苛刻的條件，要冒極大的風險。美國石油工業界許多人公開指出，保羅·蓋蒂這樣做注定是要破產的，他們認為那裡根本不可能出油。


    保羅·蓋蒂卻很有信心，他敢於這樣做，是因為他認為在「沙特」開採石油成本低廉，著眼於石油價格上漲因素，他斷定那塊地從長遠來看是必定能賺大錢的。


