    # 華爾街的墓園充滿著那些對得太早的人


    - ◎我們唯一的成功是利潤。

    - ◎假使你怕走上邊緣，那你就會失去。

    - ◎我們不可能發現海洋，除非我們有勇氣失去海岸線。

    - ◎當我們有供需天律的知識時，並且知道推論出供給我們所有慾望的一般定律時；那麼，我們就不必恐懼與憂慮。所以，追求真理、天律、找到它，就放心了。

    - ◎不穩的市場，通常不會上漲。

    - ◎有老手說他已：「研究並改進我的方法已經有四十年了，我仍在學習，並希望未來有更大的發現。」

    - ◎當井枯了，我們就知道水的價值了。


    上圖中最矮胖的是鐘形曲線，最瘦高的是柯西曲線；另一個曲線是介於兩者之間的曲線，用來推測「中型股」的波動。小型股是超漲超跌的，比較適用柯西曲線來理解與預測。


    十九世紀法國數學家柯西（Augustin-Louis Cauchy, 1789-1857）的理論是：弓箭手站在一堵左右無限延伸的牆壁前，牆上有一個箭靶；蒙眼弓箭手朝各個方向隨意射擊；當然他在大多數時候並未命中目標；但相當接近箭靶中心；只有少數會分佈在離


    ![](img/53179c30f7028b7317dce6a20859f6f6_6_0.png)


    箭靶很遠的牆上。


    柯西在學生時代，有個綽號叫「苦瓜」，爲他平常像一顆苦瓜一樣，靜靜地不說話，如果說了什麼，也很簡短；常常讓人摸不著頭緒，和他這種人溝通，是很痛苦的。柯西的身邊沒有朋友，只有一群妒嫉他聰明的人。當時法國正在流行社會哲學，柯西工作之餘常看的書，卻是拉格朗日(Joseph
    Louis Lagrance，1736-1813)的數學書，與靈修書籍《效法基督》，這使他贏得另一個外號「腦筋劈哩啪啦叫的人」，意即神經病。


    柯西的母親聽到了傳言，就寫信問他實情。柯西回信道：「如果基督教會變成精神病人，那瘋人院早就被哲學家充滿了。親愛的母親，您的孩子像原野上的風車，數學和信仰就是他的雙翼一樣，當風吹來的時候，風車就會平衡地旋轉，產生幫助別人的動力。」1816
    年，柯西回到巴黎，擔任母校的數學教授，柯西自己寫道：「我像是找到自己河道的鮭魚一般地興奮。」不久他就結婚，幸福的婚姻生活，有助於他與別人溝通的能力。


    數學大師伯努利曾說過：「只有數學能夠探討「無窮」，而「無窮」正是上帝的屬性之一」。物理、化學、生物都是有限之內的學科，「無窮」才能代表永遠測不透的極限。「無窮」的觀念令哲學家瘋狂、讓神學家嘆息，使許多人深感懼怕。柯西卻把「無窮」應用來釐定更精確的數學含義，他把數學的微分看或是「無窮小時的變化」，把積分表示爲「無窮多個無窮小之和」。


    柯西用「無窮」重新定義微積分，至今仍爲每一本微積分課本的開宗明義篇。1821 年，柯西的名聲遠播。遠自柏林、馬德裡、聖彼得堡的學生，都來到他的教室裡上課。


