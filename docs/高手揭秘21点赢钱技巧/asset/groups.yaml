    ## MSCI最新調查 CEO薪資越高 績效不一定越好


    《華爾街日報》報導，美國許多大企業多年來支付執行長優渥薪酬，認為提高薪酬能激勵表現、提升股價，但最新研究指出，執行長薪酬高低與公司績效不必然相關。換句話說，薪水越高的執行長，績效表現不一定越好。


    投資研究機構 MSCI（明晟）針對美國 423 家企業進行調查，比較這些公司在 2006 年至 2015 年這 10 年來的股價報酬與執行長薪資間的關聯性。研究發現，兩者間並無太大關聯。10
    年來股價表現最差的企業裡，不乏許多薪酬極高的執行長，反之亦然。


    MSCI 環境、社會與管理研究部門執行董事馬歇爾（Ric Marshall）表示：「執行長薪酬與公司績效間無法推論出任何模式。」


    新研究指出，若以 3 至 5 年來看，執行長薪資越高，公司績效確實會較好。但馬歇爾表示，一旦把時間拉長，2 者間的關聯便會消失。


    馬歇爾表示：在這些企業當中，高達 6 至 7 成的公司採取每年發放股票選擇權的方式做為執行長薪水，選擇權期限通常為 3 年。


    而許多績效表現最佳與最差的公司支付的是中等薪水。不過，在支付最高薪酬的企業裡，績效最佳的較高，而支付最低薪酬的企業裡，績效最差的比例亦較高。而與其他公司相比，那些薪酬最高與績效最差的
    20%公司，每年平均多支付執行長 1 千萬美元的薪資。


    事實上，MSCI 去年亦曾做過類似研究，當時研究發現，公司績效與執行長薪酬間的關係相當微弱。/2017/10/7


    ## <甲骨文>創辦人薪酬 遭砍半


    《金融時報》報導，軟體大廠<甲骨文>（Oracle）共同創辦人艾利森（Larry Ellison）多年來穩坐美國企業領袖年薪排行榜前幾名，但最近在股東不斷抗議下，<甲骨文>決定將他未來
    5 年的薪酬砍半，獎金則視公司營運績效表現而定。


    按照新辦法，<甲骨文>預估，艾利森未來 5 年將獲得價值約 1.037 億美元的認股選擇權，相當於每年 2,070 萬美元，較先前減少 47%，換算下來，他的整體薪酬約大砍一半。艾利森過去僅象徵性領
    1 美元年薪，但<甲骨文>每年皆發給他股票選擇權。


    此外，若公司未來 5 年的業績與股價未達目標，艾利森也可能喪失額外獎金。而這些安排同樣適用於共同執行長赫德（Mark Hurd）與凱茲（Safra Catz）。


    <甲骨文>大砍艾利森薪水，對於該公司的最大法人股東而言無疑是一大勝利。多年來，<甲骨文>的股東對於公司高層主管領取高薪一直相當反感。<甲骨文>在提交給監管部門的文件中指出，主管薪資問題一直是股東最大不滿，但在經過調整後，股東對此有「正面回應」。


    加州聖塔克拉拉大學應用倫理研究中心主管韓森（Kirk Hanson）表示：「過去幾年來，<甲骨文>3 位主管的薪酬實在是太高了。」而他也表示，<甲骨文>這項薪酬調整的成效還有待日後觀察。


    2012 年，當時兼任執行長的爱利森年薪高達 9,460 萬美元，在美國企業執行長裡頭排名第一。而過去 10 年來，他的薪資收入加總約 6.5 億美元。


    不僅如此，根據富比世（Forbes）雜誌統計，艾利森擁有<甲骨文>約 28%股權，目前市價約 572 億美元，令他躍升為全球第 5 大富豪。


    德拉瓦大學財金系教授艾爾森（Charles Elson）表示，雖然艾利森財富增長最大來源來自於股價上漲，但<甲骨文>仍給予艾利森極爲豐厚的股票選擇權，這才是股東最不滿意的原因。／2017/10/7


