    - 機會永遠存在，你要有這個耐心，把資金放在那裡，等著大機會的出現。絕大部分的人是做不到這一點的。

    - 活著才是第一順位的。投資的精髓是複利，只要保住本金，然後每年都有一個穩定的收益，哪怕回報很低，多少年後也是相當驚人的。

    - 不是每個人都能在股市中賺錢的，除了專業水準較高的投資人之外，千萬不要把自己的全部家當押在股市上。

    - 耐心的等待，一直等到你看到，或者發現，或者碰到，或者通過研究發掘到——你覺得穩如探囊取物的東西，這時你唯一要做的事情，就是進場把錢撿起來。

    - 投機像山嶽一樣古老，人心總是蛇吞象。


