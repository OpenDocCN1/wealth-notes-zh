    ## 保羅·蓋蒂的浪漫又隨興的生活


    在是一個傳奇企業家的同時，保羅·蓋蒂（Paul Getty，1892~1976）也是一個花天公子，不負責任的父親，自私吝嗇的人。


    保羅·蓋蒂結過 5 次婚，其餘的外遇更是不計其數；他最小的兒子 6 歲時需要開刀，儘管保羅·蓋蒂聲稱這是他最喜歡的孩子；但還是漠不關心，抱怨醫療費用很貴，繼續在歐洲尋歡作樂；最終的結果，是這一個孩子死去了；或許是對這個父親不負責任的報復，無論是他的孩子還是孫子，沒有幾個人是生活幸福的。


    - 確定所謂安全的投資真的安全。


    ## 保羅·蓋蒂家族的悲劇


    1970 年代保羅·蓋蒂（Paul Getty，1892~1976）家族的悲劇更是震驚世界——：


    - 他的兒媳服用過多海洛因而死亡；

    - 另一個兒子自殺；

    - 孫子遭到綁架被殘害；而當孫子被綁架的時候，他還心疼自己的錢不願拿出贖金，最終在收到了孫子的一個耳朵和一束頭髮後屈服了。


    ## 保羅·蓋蒂的一毛不拔


    保羅·蓋蒂（Paul Getty，1892~1976）儘管擁有家財萬貫，但他個人生活常有守財奴式的節儉癖好，例如，他在倫敦的一座公寓樓裡，為了節省電話費，撤掉了樓內所有的外線電話，只是在
    一樓大廳裡安裝了一部投幣電話。還裝上鎖，因為他多次抱怨家 裡的工人偷打電話。


    他的許多朋友在他的家裡吃完飯後才發現，必須投幣才能借 用他家的電話。關於他吝嗇的例子舉不勝舉，他每次去吃飯只付 自己的一份，買別人的飯店卻還要對方發電報，來節省下電報
    錢。跟女朋友吃飯卻不願意付錢，他聲稱要給他的 100 個情人留 下遺產，於是他就不斷地修改他的遺囑，多達 25 次。


    而在他死後，許多與他有關的女人只感到失望和憤怒，她們 認為保羅·蓋蒂欺騙了她們每一個人，遺囑裡的錢根本就不多，有 的甚至少到帶有侮辱性。甚至於在他死後，做悼念儀式的牧師的
    錢也沒有兌現，這個儀式等於是免費的了。保羅·蓋蒂也因此獲得 了「世界上最富有的吝嗇鬼」的稱號。


