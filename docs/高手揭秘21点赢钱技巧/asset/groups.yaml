    全拜<亞馬遜>股票連續上漲之賜，53 歲的貝佐斯（Jeff Bezos）身價在 2017/7/27 一度高達 905 億美元，超越微軟（Microsoft）創辦人蓋茲（Bill
    Gates）的 900 億美元，一步登上全球首富地位。但隨著〈亞馬遜〉股價下跌，貝佐斯在同天之內又把寶座讓回蓋茲。


    <亞馬遜>網站堪稱當今零售龍頭老大，在電子商業叱吒風雲；但回顧貝佐斯的年輕時期，卻是充滿轉折波動，20 多歲的他也曾與許多同齡年輕人一樣，花很多時間尋找適合自己的工作，摸索著未來的發展方向。


    就讀普林斯頓大學（Princeton University）時，貝佐斯在物理課上覺悟到，自己根本跟不上其他的優秀同學，因此毅然決定轉系，改為主修電腦科學。《連線雜誌》（Wired）在
    1999 年的一篇人物特寫中寫道，貝佐斯在學生時期便已經立定志向，有朝一日要創業當老闆。


    大學畢業之後，貝佐斯曾有機會進入知名企業或機構服務，包括英特爾（Intel）、貝爾實驗室（Bell Labs）、安盛諮詢（Andersen Consulting）；不過，他卻選擇加入處於草創階段的
    Fitel 電子通訊公司。


    Fitel 的主要經營策略在於，為各家投資公司打造出一套全球電訊網路系統，貝佐斯最早的工作任務只是排除電腦軟體程式錯誤；但很快一路晉升，掌管研發部門與客服部門。


    貝佐斯在 Fitel 任職約兩年，積極尋求擴展企業卻未能如願，決定跳槽，加入了後來被併入德意志銀行（Deutsche Bank）的金融機構信孚銀行（Bankers
    Trust）。


    換了新工作之後，貝佐斯同樣官運亨通，迅速升任副總裁。不過，服務約兩年之後，他又對這份工作感到厭倦，轉而加入了華爾街對沖基金投資公司 DE Shaw & Co,
    在短短 4 年的時間裡, 成爲了這一家公司的副總裁。


    在 1990 年代當時的大環境底下, 網路正值萌芽階段, 貝佐斯在 DE Shaw & Co 主管的業務領域, 便是研究網路市場的各種新興商機。


    《財經內幕》(Business Insider) 雜誌報導, 貝佐斯經過統計分析, 擬出一份可以在網絡上銷售的 20 項熱門商品清單, 其中又以賣書的成功機會最高,
    可惜這項提案沒能獲得高層主管支持, 因緣際會之下, 促成了他自立門戶的念頭。


    貝佐斯傳記《什麼都能賣: 貝佐斯如何締造亞馬遜傳奇》( The Everything Store: Jeff Bezos and the Age of Amazon
    ) 書中, 貝佐斯接受作家史東 (Brad Stone) 訪問回憶創業心情時說道:「我知道當我活到 80 歲的時候, 不會去回想爲何在 1994 年環境最糟糕的時刻,
    會決定放棄豐厚的華爾街員工獎金。」


    他說:「當你活到 80 歲的時候, 這些事情不再是你會煩惱的。」


    對於押寶網絡的決定, 貝佐斯在傳記中表示, 當時深深體會到, 如果錯過那一波的可能爲日後帶來革命性演進的網絡發展, 自己將會非常後悔,「當我這麼想的時候,
    要做決定就很容易了。」


    1994 年 7 月 5 日, 總部位於西雅圖的<亞馬遜網站>在貝佐斯創立下誕生。23 年之後,<亞馬遜>已成爲富可敵國的銷售巨擘。


