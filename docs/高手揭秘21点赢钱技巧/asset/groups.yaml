    德國默克家族 2009/01/06 發表聲明證實，家族成員億萬富豪默克（Adolf Merckle）因不堪沈重債務負荷，選擇自我了斷，享年 74 歲。


    德國世界報報導，警方 5 日在斯圖加東南方的 Blaubeuren，發現一名男子遭火車撞死。報導原引述匿名警員說法，指這名男子是億萬富翁默克，警方已排除他殺的可能。


    默克在富比世雜誌全球富豪榜上排名第 94，財富淨值 92 億美元。默克去年因錯判福斯汽車股價及股市走勢，導致損失慘重，必須向銀行緊急求援，以應付巨變。他所掌控的投資公司正與銀行團簽署協議，取得過渡性融資。VEM
    去年 12 月底表示，默克已和 30 多家放款機構達成協議，會給他更多時間還債。


    默克家族的企業王國，年營收約達 300 億歐元，除擁有德國最大學名藥製造商 <樂多大藥廠>（Ratiopharm）和藥品批發商菲尼克斯（Phoenix）外，還是德國最大水泥廠
    <海德堡水泥>（HeidelbergCement）的大股東。默克身亡的消息傳出後，海德堡水泥股價 6 日一度暴跌 13%。 / 2009/01/07


    德國億萬富豪默克（Adolf Merckle）驚傳自殺，徒留許多不解和遺憾。金融海嘯或許是他走上絕路的原因，但外界對他因「豪賭」而輸掉一切的批判，可能是他無法承受的重。


    多年來，德國媒體和政治人物多指責美國和英國私募基金業者，他們慣用的金錢遊戲手法，深深殘害德國社會。默克去年底放空福斯汽車股票失利，加上金融風暴讓他其他的投資大失血，導致這位去年排名全球第
    94、身價近 70 億歐元的大富豪，也得向銀行和地方政府求援，更成了輿論最好的「活教材」。


    但默克說，就是這種冒險犯難的精神，才讓他得以建立起這麼龐大的事業，創造這麼多就業機會。在商場上，默克一向是愈挫愈勇。


    默克透過控股公司 VEM 掌握的關係企業，包括歐洲最大藥品批發商 Phenix 和德國最大水泥廠海德堡水泥等公司，年營收達 350 億歐元。


    但默克去年自認看準汽車業衰退的趨勢，而放空福斯汽車，沒想到福斯股價逆勢大漲，導致默克大虧。他還拿股票抵押，向銀行團聯貸，海德堡水泥股價又大跌，造成銀行團急於抽銀根。


    面對如此困境，默克 11 月曾向家鄉所在地巴登-符騰堡當局求援，但遭拒。過去兩個月來，默克一直在和 40 家左右銀行談判，希望能取到貸款，保住 VEM。他一度以要宣告破產來威脅銀行。


