    Empires and Modern Times)的內容講到：關於薩法維波斯帝國、帖木兒帝國與鄂圖曼土耳其帝國帶來的二次繁盛，以及二十世紀穆斯林對抗西方，獨立自決意識如何興起。


    歷史學家哈濟生總結十四至十八世紀薩法維、帖木兒、鄂圖曼三個回教文明帝國衰敗原因——：


