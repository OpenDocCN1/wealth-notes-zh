    \ 年以來增加 26% ，達到 1125 萬人。\n\n2010 年底以來，美國房租上漲速度比平均時薪的上漲速度快了不止一倍；進行分析的「企業社區夥伴組織」副總裁安琪拉．博伊德說：「這意味著租客很容易入不敷出，他們每天都在掙扎，到底要買點東西，還是把錢省下來繳房租。」\n\
