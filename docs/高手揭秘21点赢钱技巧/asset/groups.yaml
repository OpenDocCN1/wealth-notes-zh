    # 美國研究：O型血的人較不怕空汗


    美國有一份研究指出，處在空氣汙染的環境中，不同血型的人罹患心臟疾病的機率竟然有著密切關聯！


    空氣汙染竟對 A 型血、B 型血或 AB 型血的人來說，有著更大的風險！美國心臟協會(AHA)的最新研究指出，在空氣汙染的環境中，O 型血的人比 A 型血、B
    型血或 AB 型血的人罹患心臟疾病的機率還低。


    研究顯示，當細懸浮微粒(PM2.5)每增加 10 微克時，A 型、B 型或 AB 型血的人，罹患心臟疾病的風險會增加 25%；但 O 型血的人罹患心臟疾病的風險增加約
    10% 左右，相較其他血型的人來說較低。


    對此，研究指出這是因為 A 型血、B 型血或 AB 型血血的人，在血液中有較多的凝血組織，所以罹患心臟疾病的風險相對就比較高。一名臨床流行病學與心臟研究博士
    Benjamin Horne 表示，「非 O 型血的人，心臟疾病發作和空氣汙染之間的關聯並沒有那麼可怕，不過這是一件非常值得注意的事。」/2017/12/1*


