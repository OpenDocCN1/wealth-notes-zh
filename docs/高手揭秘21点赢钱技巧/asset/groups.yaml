    # 不擇手段後 執政者如此取得選舉的成功

    這種成功對國家而言 很可能是一種失敗


    熊彼特說：「執政者如此取得選舉的成功，這種成功對國家而言很可能是一種失敗。」


    經濟學家約瑟夫·熊彼特（Joseph Alois Schumpeter，或譯為熊彼德，1883~1950）說：「民主國家的總理如果成為一位全神貫注於不要摔下馬的騎士，他就難以有一趟美好的旅程；又或者像一個只關切軍隊是否聽命於他的將軍，豈能考慮整個戰略？」


    民主政治并意味着人民真正在統治，民主政治的意思只能是：人民有接受或拒絕將要來統治他們的人的機會。民主政治就是政治家的統治。——約瑟夫·熊彼特（Joseph
    Alois Schumpeter，或譯為熊彼德，1883~1950）《資本主義、社會主義和民主》


    # 醫生說只剩5年可活 婦人花光養老金享樂 結果竟是誤診


    英國有一位民眾 2016 年就醫時發現罹患失智症，且只剩 5 年可活；於是，她便決定好好善待自己，一口氣花光新台幣 40 多萬的積蓄，安排豪華旅遊行程，沒想到事後——醫生卻說「誤診」，她其實是罹患焦慮和憂鬱症，並非無藥可醫，但花出去的錢已經收不回來了。'
  - '[PAGE 3]


    現年 62 歲的傑姬迪布 (Jackie Dibb) 於 2016 年 11 月接獲醫院報告通知罹患失智症，只剩 5 年可活，她便掏出一萬英鎊 (約新台幣
    416,800 元) 養老金，規劃新台幣 6 萬多元的奢華旅遊行程，還花新台幣 16 萬元將浴室裝修成無障礙空間，也送了數千英鎊的現金給家人。


    傑姬表示，她甚至已經慎重地和 12 歲的孫女做死亡道別，沒想到一年後才接獲是誤診，傑姬其實是患上嚴重的焦慮和憂鬱症，並非無藥可醫。最新斷層掃描還顯示，傑姬的大腦沒有異常，她從未罹患失智症。


    「老實說，我們覺得很尷尬，」傑姬的丈夫說：「我們早就互相做了死亡道別，這讓我們壓力很大。」傑姬的丈夫補充，他們還帶上全家人一起去土耳其等地觀光，買了許多奢侈品，只是想要在還能享受時盡情玩樂。


    英國《每日郵報》報導，傑姬 2016 年感到身體不適後就醫，醫生原先認為是中風，經過電腦斷層掃描又診斷為失智症，當年 11 月 21 日就收到醫師正式報告並開始服藥，但一年後再次檢查，卻發現她毫無罹患失智症的跡象。


    今年的診斷則指出，傑姬實際罹患的疾病是焦慮和憂鬱症，由於她的記憶及情緒變化造成「假性失智」的症狀出現，醫院也寄信向傑姬道歉。


    傑姬的丈夫形容這是一場「真實的恐怖故事」，不過他也表明並不會起訴醫院，除了不想花錢興訟外，傑姬的丈夫認為醫院這幾年來待夫妻倆敬如上賓，沒有上法院針鋒相對的必要，如果起訴政府以領取國賠，又恐排擠他人醫療資源。／2018/2/23'
  - '[PAGE 4]


    # 她一句話 讓Snapchat市值暴跌383億元


    實境秀女星凱莉.詹娜（Kylie Jenner）在<推特>表示，不再使用照片分享應用程式 Snapchat，造成該公司股價 22 日爆量大跌超過 6%，縮水多達
    13 億美元(台幣 383 億元)。


    她先推文說：「有人再也不用 Snapchat 了嗎？還是只有我這樣…喔，這太讓人難過了。」


    她雖然大約 10 分鐘後補上一句：「不過，我還是愛你 snap……」，傷害已經無法挽回。Snapchat 跌到 17.51 美元，接近上市價 17 美元。


    剛生了一個女兒的 Kylie Jenner 在社群媒體有許多追隨者，尤其是推特和 IG。她的推特追隨者多達 2450 萬人，不再用 Snapchat 的第一則推文被轉推
    5 萬次。


    Snapchat 最近改版，反應欠佳，又被 Kylie Jenner 的發言重擊。/2018/2/23


    # <貝萊德>投資 也要仿效巴菲特收購企業


    全球最大資產管理集團<貝萊德>（BlackRock）尋求募資逾 100 億美元，以供收購企業少數股權之用。這將是<貝萊德>首度嘗試這種直接投資的策略，顯然有意仿效「股神」巴菲特所執掌的波克夏公司的做法。


    知情人士表示，<貝萊德>正向主權財富基金、退休基金和其他大型投資人募資，準備推出稱為「<貝萊德>長期私募資本」（BlackRock Long-Term Private
    Capital）的投資工具，目的是用於進行規模 5 億美元至 20 億美元的投資案。'
  - '[PAGE 5]


    這個新工具聚焦投資「長期主題」，包括全球人口結構分歧、新興市場中產階級成長、千禧世代支出型態改變等，是<貝萊德>強調另類投資計畫的一環。舉例來說，可能買進某家族企業的少數股權，並且長期抱牢，與巴菲特旗下波克夏公司採取的投資策略類似，不同點是<貝萊德>投資工具傾向不買下整家企業。


    但是，此舉將使<貝萊德>成爲華爾街大型私募基金公司的潛在對手，例如凱雷集團（Carlyle）和阿波羅全球管理公司。對<貝萊德>執行長芬克來說，走這種投資路線，也將槓上他的老東家百仕通集團。芬克
    1988 年共同創立<貝萊德>時，當時只是百仕通旗下的一個部門，1994 年從百仕通分割出去、獨立門戶，乘著指數型基金興起的潮流事業日滋壯大，如今旗下管理逾
    6 兆美元的資產。／2018/2/9


    # 華爾街的墓園充滿著那些對得太早的人


    +   ◎我們唯一的成功是利潤。


    +   ◎假使你怕走上邊緣，那你就會失去。


    +   ◎我們不可能發現海洋，除非我們有勇氣失去海岸線。


    +   ◎當我們有供需天律的知識時，並且知道推論出供給我們所有慾望的一般定律時；那麼，我們就不必恐懼與憂慮。所以，追求真理、天律、找到它，就放心了。


    +   ◎不穩的市場，通常不會上漲。


    +   ◎有老手說他已：「研究並改進我的方法已經有四十年了，我仍在學習，並希望未來有更大的發現。」


    +   ◎當井枯了，我們就知道水的價值了。'
  - '[PAGE 6]


    上圖中最矮胖的是鐘形曲線，最瘦高的是柯西曲線；另一個曲線是介於兩者之間的曲線，用來推測「中型股」的波動。小型股是超漲超跌的，比較適用柯西曲線來理解與預測。


    十九世紀法國數學家柯西（Augustin-Louis Cauchy, 1789-1857）的理論是：弓箭手站在一堵左右無限延伸的牆壁前，牆上有一個箭靶；蒙眼弓箭手朝各個方向隨意射擊；當然他在大多數時候並未命中目標；但相當接近箭靶中心；只有少數會分佈在離


    ![](img/53179c30f7028b7317dce6a20859f6f6_6_0.png)'
  - '[PAGE 7]


    箭靶很遠的牆上。


    柯西在學生時代，有個綽號叫「苦瓜」，爲他平常像一顆苦瓜一樣，靜靜地不說話，如果說了什麼，也很簡短；常常讓人摸不著頭緒，和他這種人溝通，是很痛苦的。柯西的身邊沒有朋友，只有一群妒嫉他聰明的人。當時法國正在流行社會哲學，柯西工作之餘常看的書，卻是拉格朗日(Joseph
    Louis Lagrance，1736-1813)的數學書，與靈修書籍《效法基督》，這使他贏得另一個外號「腦筋劈哩啪啦叫的人」，意即神經病。


    柯西的母親聽到了傳言，就寫信問他實情。柯西回信道：「如果基督教會變成精神病人，那瘋人院早就被哲學家充滿了。親愛的母親，您的孩子像原野上的風車，數學和信仰就是他的雙翼一樣，當風吹來的時候，風車就會平衡地旋轉，產生幫助別人的動力。」1816
    年，柯西回到巴黎，擔任母校的數學教授，柯西自己寫道：「我像是找到自己河道的鮭魚一般地興奮。」不久他就結婚，幸福的婚姻生活，有助於他與別人溝通的能力。


    數學大師伯努利曾說過：「只有數學能夠探討「無窮」，而「無窮」正是上帝的屬性之一」。物理、化學、生物都是有限之內的學科，「無窮」才能代表永遠測不透的極限。「無窮」的觀念令哲學家瘋狂、讓神學家嘆息，使許多人深感懼怕。柯西卻把「無窮」應用來釐定更精確的數學含義，他把數學的微分看或是「無窮小時的變化」，把積分表示爲「無窮多個無窮小之和」。


    柯西用「無窮」重新定義微積分，至今仍爲每一本微積分課本的開宗明義篇。1821 年，柯西的名聲遠播。遠自柏林、馬德裡、聖彼得堡的學生，都來到他的教室裡上課。'
  - '[PAGE 8]


    > 如果上帝賦予我財富和美貌

    我會讓你無法離開我的......


    你以為我貧窮、相貌平平就沒有感情嗎？我向你發誓，如果上帝賦予我財富和美貌，我會讓你無法離開我的，就像我現在無法離開你一樣。雖然上帝沒有這麼做，可我們在精神上依然是平等的。——夏洛蒂·勃朗特夏洛蒂·勃朗特（Charlotte
    Brontë，1816~1855）《簡·愛》（Jane Eyre）


    # 高手揭密21點贏錢技巧


    面對人生中最嚴重的經濟危機，正確的理財決策十分重要。展望 2009 年——美國《商業周刊》根據理財專家的意見，針對個人理財提出 20 點建議——：


    (1).勿預測未來：維吉尼亞州「資產豐收集團」的費米．蕭特說：「我們正遭逢空前的與複雜的挑戰；自以為能預測未來的人根本是妄想。」


    # 比特幣四大隱憂 投資人當心


    比特幣在 2017 的年度，狂飆超過 1,000%，許多懷疑論者幾乎已把比特幣和泡沫劃上等號。彭博資訊歸納並預測比特幣泡沫破滅的幾種可能「死法」，包括——：因分叉導致過度碎片化、監管'
  - '[PAGE 9]


    機關加強打擊及遭駭客入侵等。


    +   1. 開發者對於如何進一步提升比特幣網絡的意見不一致，導致比特幣開始「分岔」；不同版本的比特幣開始從最初的本體分離，但過度破碎可能成為比特幣的致命傷。


    +   2. 由於比特幣曾被用爲購買非法材料或資本外逃的工具：各地主管機關也特別關注這類資產，比特幣遭打擊的陰影也如影隨形。除了美國等國，南韓已承諾將加強監管虛擬貨幣，印尼央行更直接宣布禁止國內使用虛擬貨幣。


    +   3. 東京比特幣交易所 Mt. Gox 在 2011 年被駭客攻擊後，比特幣持有者就得隨時擔心可能遭駭。Mt. Gox 被駭及破產後，比特幣價格重挫。


    +   4. 隨著芝加哥商品交易所、芝加哥選擇權交易所等計劃推出比特幣衍生性商品，市場也可能開始對比特幣進行更多雙向押注，被「賣空」的風險提高，賣壓大舉出籠的機率隨之增加。／
    2017/12/9*


    # 這位 27 歲的 Snapchat 創辦人史皮格年薪 186 億


    年僅 27 歲的知名的快照社群軟體 Snapchat 創辦人兼執行長史皮格（Evan Spiegel），可能成爲去年美國最高薪的管理層之一。史皮格在 2017
    年總薪酬高達 6.38 億美元（約新臺幣 186 億元），遠遠超過蘋果執行長庫克。


    根據 Snap 周四提交的年度報告，3 月在 IPO 結束後，向史皮格授予 3%已發行股票，價值約 6.37 億美元，另外，史皮格也得到 100 多萬美元的額外補償，涉及醫療和人壽保險的保費、法律費用'
  - '[PAGE 10]


    和 50 多萬美元的個人保險福利。


    追蹤高階主管薪酬的研究公司 Equilar 指出，史皮格的薪酬比其他科技業高出一大截，遠遠超過庫克接替賈伯斯出任<蘋果>執行長當時的獎酬，庫克持有的股票當時價值
    3.76 億美元（十年分批授予）。「這樣鉅額的獎酬很少見」，Equilar 表示，如果 2017 年還有比這個更高的薪酬，將令人驚訝。／2018/2/23


    其實，Snapchat 是一款由史丹佛大學學生開發的圖片分享軟體應用。利用該應用程式，用戶可以拍照、錄製影片、寫文字和圖畫，並發送到自己在該應用上的好友列表。這些照片及影片被稱為「快照」（"Snaps"）。用戶在向好友發送「快照」時，可以設定一個限制好友訪問「快照」的時間（截止
    2017 年 7 月，用戶可選擇的時限是 1 秒至 10 秒之間，或無限），在這之後，這些「快照」會徹底的從好友的設備上和 snapchat 上的伺服器刪除。


    目前，在中國大陸無法訪問 Snapchat；中國政府並未直接封鎖，但由於 Snapchat 的後台伺服器大多由 google 提供，而谷歌大多數伺服器在中國大陸被封鎖，所以
    Snapchat 受到波及。


    (2).手邊要保有足夠的現金：即使不擔心工作不保，留一筆預備金可讓你安心，起碼不必急用時賣掉投資商品。


    # 挪威主權基金 首度投資亞洲房市


    挪威主權財富基金 2017/12/7 宣布，已簽約收購日本東京 5 件不動產的 70%股權，將出資 927.5 億日圓，這是該全球最大主權財富基金首度對亞洲房地產出手，希望未來能在東京擴大投資。'
  - '[PAGE 11]


    挪威主權基金花相當於 8 億美元資金投資的東京不動產，其中 3 件位在澀谷區的購物商圈，另 2 件則座落於表參道的高檔地段，整個投資組合的估值達 1,325
    億日圓。


    這 5 件不動產其餘的 30% 股權，由挪威主權基金的合作夥伴東急不動產公司（Tokyu Land Corporation）取得。


    規模逾 1 兆美元的挪威主權基金，老早就喊出要投資亞洲的不動產，選點名了東京與新加坡爲首要目標，但礙於當地求售的物件未在合理價位，遲至今日才出手。


    管理主權基金的挪威央行房地產管理公司（Norges Bank Real Estate Management）執行長卡雷維格（Karsten Kallevig）告訴路透：「我們放眼亞洲，特別是東京已有多年。」


    談到與東急不動產聯手投資東京房市，卡雷維格表示：「我希望我們能加強合作，我認爲東急是優質夥伴，我們都樂見有更積極的作爲，只是現在仍需要找寻符合彼此投資策略的機會。」


    挪威主權基金保將挪威的油氣收益，投資海外的股債及不動產。今年第 3 季結束時，不動產占挪威主權基金總資產價值的 2.7%，該基金的長期目標是將這方面占比拉高至
    7%。


    挪威主權基金瞄準全球 10 座大城高級地段的辦公大樓和零售業不動產，像巴黎香榭麗舍大道（Champs-Elysees）或倫敦攝政街（Regent Street）上的物業，都是其物色收購的目標。


    此外，在企業供應鏈上扮演重要角色的物流中心，亦引起挪威主權基金收購興趣。/2017/12/9*


    # (3).跨國投資：完全放棄國際市場是不智的，像中國'
  - '[PAGE 12]


    等若干經濟體，最近雖然也受重創，但從長期經濟基本面（fundamentals）來看仍比美國佳。


    # 比特幣期貨上市的前夕... 駭客盜取近 7,800 萬美元


    全球首檔比特幣期貨即將在 2017/12/9 週日上市交易前夕，爆發駭客竊取比特幣事件。位於斯洛維尼亞的比特幣挖礦公司 NiceHash 近日遭駭客入侵，盜走價值逾
    7,000 萬美元的比特幣。


    NiceHash 創辦人兼執行長科博爾（Marko Kobal）稍早在臉書上傳一段 6 分鐘短片，內容說明公司內部系統在美東時間週二晚間 6 點左右遭到駭客入侵，且駭客成功在
    2 小時內從線上帳戶盜走 4,700 枚比特幣，迫使 NiceHash 挖礦平台停擺超過 24 小時。


