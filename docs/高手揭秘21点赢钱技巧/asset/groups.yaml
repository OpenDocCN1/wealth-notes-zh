    新任執行長一定會碰到許多的廢柴式批判；最好的回應就是：


    - 1) 若很重要，須舉證否認並立即回應，以免暈染效應。

    - 2) 若只是雞毛蒜皮的吹毛求疵，則完全不必理會。就像時裝大師香奈爾的對付魯蛇挑釁的名言：「我沒時間討厭你！」


    嘉柏麗·香奈兒（Gabrielle Bonheur Chanel）(1883~1971)，是法國先鋒時裝設計師，著名法國女性時裝店香奈兒（Chanel）品牌的創始人。


    香奈兒的第一家商店於 1910 年在巴黎康朋街（Rue Cambon）21 號開張了，接著於 1913 年在多維爾開了一家流行女裝商店，於 1915 年開了一家女式時裝屋。接著，她於
    1918 年將坎朋大街的總店搬到 31 號。


    1921 年，香奈兒發明了香奈兒五號（Chanel No.5）香水，這款香水面向全球銷售，筆直的瓶身和同時代其它的香水瓶設計有很大不同。「五」據說是可可的幸運號碼，而這個號碼最後被命名為香水的名字是因為這是第五次嘗試。


    1924 年，皮埃爾·沃特海姆在香水業務上成為她的合伙人。沃特海姆擁有百分之七十的股份，香奈兒得到了百分之十的股份，另外百分之二十的股份由她朋友巴德擁有。香奈兒五號成為可可的一件煩心事，因為她儘管獲得巨大成功，卻從裡面收穫很小。今天沃特海姆家族繼續控制了香水公司。瑪麗蓮·夢露在
    1950 年代宣布香奈兒五號是她最愛的香水。


    據統計，每 30 秒鐘就有一瓶香奈兒五號售出。因為沒有太在意香水的銷售，在專利方面和沃特姆家族打了很久的官司，正所謂不打不相識，她後來也和沃特姆家族的人成為了好朋友。後來也是在水特姆家族的幫助下得以復出。


    香奈兒套裝於 1923 年推出，是及膝的短裙和裁剪考究的外套組成的優雅套裝，通常選用黑色羊毛面料，金色的鈕扣，在搭配時配以大顆珍珠項鍊。香奈兒的經典小黑裙也十分流行，簡單大方的設計，多功能的用途使它同時適用於白天和晚上，轉換的關鍵是飾品的搭配。儘管保守的黑裙在香奈兒之前就有，然而她設計的小黑裙兼顧了時尚和舒適。1923
    年，她在《巴莎》（Harper''s Bazaar）雜誌上發表評論：「簡單就是所有真正的優雅的基調。香奈兒的設計永遠保持簡單和舒適的風格。」


    二次大戰期間，她與一位納粹官員漢斯·岡瑟·馮丁克拉格相識；他把從猶太人沒收來、並儲存在瑞士銀行的銀錢拿出來，讓香奈兒做一筆資金開設廠房，但後來卻倒閉了。她於
    1939 年與其相愛的納粹官員移居瑞士，並同時關閉所有位於巴黎的店舖。


    但她還是無法忍受著由男性設計師掌管的時裝界，再次將女性置於豐胸腰鑾之中，於是她於 1954 年重返法國後召回她的工作團隊，香奈兒重新開業，她選擇同年的 2
    月 5 日來舉辦首場時裝表演在康朋街的總店裏，她悄悄地坐在旋轉玻璃樓梯上看著模特兒在一片沉寂中走秀。後來美國《Life》雜誌在不久後的報道中寫道：「 71
    歲高齡的嘉柏麗·香奈兒所呈現的，與其說是一種潮流，不如說是一種革命。」戰爭過後，她認為這不是講究衣著的時候，因此等待經濟復甦時期才大力推展業務。


    根據英國《每日電訊報》 2011 年 8 月 16 日報導，美國記者哈爾·沃恩在其《與敵共眠：可可·香奈兒的秘密戰爭》一書中認為香奈兒是一名強烈的反猶太主義者，其身份為納粹德國反間諜機構
    Abwehr 的特工，其特工編號為 F-7124，特工代號為 Westminster (威斯敏斯特)；在二戰期間曾在柏林和馬德里為納粹德國執行過任務；由於她戰前就認識的好友——前任英國首相邱吉爾的干預，戰後嘉柏麗·香奈兒得以逃脫逮捕與審判。


    <香奈兒公司>隨即發布了聲明；在聲明中沒有明確否認香奈兒是納粹特工的說法，不過暗示這本書不夠縝密；聲明還為香奈兒進行了這樣的辯護——如果香奈兒是反猶太主義者，那麼她不會有眾多猶太人密友或者事業夥伴；例如羅斯柴爾德家族，攝影家
    Irving Penn，著名法國作家 Joseph Kessel 等等。


    她一生未婚，私生活多姿多彩，在愛汀訥·巴爾森之後，她又相繼和藝術家保羅·艾里伯，威斯敏斯特公爵，流亡法國的帝俄宗室狄密琴大公，英國運動員博伊·卡佩爾傳出戀情。


    她有 30 多年時間，是以巴黎的巴黎里茲酒店 (Hôtel Ritz) 為家，包括納粹占領巴黎時期。在那段時期，她與德國官員漢斯·岡瑟·馮丁克拉格交往密切，漢斯安排她繼續留在旅店裏。她在康朋街擁有一套公寓，在羅克布倫
    (Roquebrune) 小鎮有一套別墅。


    1971 年 1 月 10 日，她在巴黎里茲酒店的客房中心臟病發去世，去世後安葬於瑞士洛桑；在她的墓碑上雕刻著五個石頭獅子的頭。


