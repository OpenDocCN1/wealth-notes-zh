    ## 1929 年大蕭條之後的野心


    30 年代，美國經濟出現了大蕭條，股票市場崩潰。當大多數投資家和商人紛紛退縮和躲避的時候，保羅·蓋蒂（Paul Getty，1892~1976）卻選擇彎道超車，逆流而上，斷定這是他施展才華、創建一個大型石油綜合企業的良機。


    當時許多石油公司的股價，已跌到相當於原來幾分之一的價格，而股票的持有者們仍繼續拋售。保羅·蓋蒂看中了加州的兩家石油公司，它們是《墨西哥海濱聯合石油公司》和《太平洋西方石油公司》，這兩家公司在凱特爾曼汕油田擁有寶貴的地皮。特別是《太平洋西方石油公司》每股價值
    3 美元，但市場價僅售 0.4 美元。但他的母親薩拉反對購買股票，保羅·蓋蒂就繞開母親，設法說服公司的董事們，用貸款購買了 300 萬美元股票。


    但市場嚴重衰退股價甚至下跌到 0.09 美元，當時股價的下跌讓保羅的壓力十分沉重，在這段期間，保羅的膽量和毅力得到了前所未有的考驗，爲此，他不得不放棄了《海濱聯合石油公司》，專心對付《太平洋西方石油》。他曾這樣說：「如果這次失敗，我將身無分文，一無所有了。」而為了完全控制《太平洋西方石油公司》的股份，到
    1931 年，他用完了自己的全部存款。


    終於，掌握大量資金的母親鬆開了緊緊掌握在手中的資金，給兒子以援助，幫助保羅渡過了難關。這時，《海濱石油公司》已經被當時的石油巨頭——《美孚》所控制！面對巨頭的挑戰，保羅表現出他極大的勇氣和持久的耐力。他的表現讓整個世界都為之震驚！


    起初，和《美孚》交手了幾個回合的保羅總是處於劣勢的一方，但他毫不氣餒，等待著機會到來。1934 年，美國總統羅斯福要對全國最有權勢的家財財產進行審查，而作為《美孚》的最大股東——洛克菲勒必須坦白他的所有股份，為了免去高額遺產稅，洛克菲勒決定出賣一部分股份。保羅沒有放過這個機會，通過朋友，他得到了洛克菲勒在海濱
    10% 的股份。


    這只是開始，在後來的 10 多年裡，保羅·蓋蒂又不斷地擴大他的股權，到 50 年代初，《海濱聯合石油公司》的董事會裡除一人之外，其他的董事都是在保羅·蓋蒂的股份下產生的，這也就是說，保羅·蓋蒂那時已經完全控制了這家公司。


