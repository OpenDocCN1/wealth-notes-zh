    \n- **（三）離的階段**\n  - 新的品味\n  - （合）\n- **（二）破的階段**\n  - 門派品味\n  - （反）\n- **（一）守的階段**\n\
    \  - 大眾的技術層次\n  - （正）\n\nWhat's past is prologue.\n凡是以過去，皆為序章。\n\n最初的是原初的階段，常常是行業裡的共同作法，很普通，但社會也有一定的接受度；這時自己可能還不夠熟練，還是屬於「守」的跟隨階段。後來，自己因為興趣，浸淫日久，心得日多，累積的特色愈來愈多，品味日益不同，這時其實已泡在第二階的「破」的突破階段。後來，匠人得心應手，應用有效，實踐也確實可行，受到好評，就進入穩定的「離」的脫離階段了。\n\
