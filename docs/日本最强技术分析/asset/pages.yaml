- pgno: 140
  md: '# 從通道的寬度、傾斜和收縮判斷行市的趨勢與力道。


    在這個單元將會介紹知名的趨勢分析工具「布林通道」。布林通道由移動平均線和標準差構成，藉由表示移動平均線的線和位於上下，表示市價變動幅度的線（通道）進行投資判斷。


    「價格大半收在這個通道（帶子）裡」，是應用統計學的指標。


    在布林通道，通常是在K線圖上畫出5條線。線條由上至下為+2σ（sigma）、+1σ、移動平均線、-1σ、-2σ。藉由這5條線構成的通道幅度、傾斜與收縮判斷行市的趨勢與強弱。此外還有加上±3σ，以7條線構成的例子。


    前提是，股價收在布林通道±1σ的範圍內的機率約68.3%、收在±2σ的範圍內的機率約95.4%、收在±3σ的範圍內的機率約99.7%。


    超過正負2個標準差的股價是異常值。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '例如，車子的道路上行駛的車道是固定的。打瞌睡蛇行或逆向等是會上新聞的問題，大部分的駕駛都會留意安全駕駛，行駛在固定幅度的車道內。


    股價也一樣。平時是在一定程度的幅度（通道內）反覆上下波動，即使超出也遲早會回到原本的通道內。


    如同前述，股價收在±2σ的範圍內的機率約95·4%，因此超過就是相當罕見的情形，是某種異常值。如果比喻成駕駛車輛，便是打瞌睡開車等超出車道的情況。這種駕駛行為絕對不行。大幅超出車道，只有下高速公路的時候。


    POINT'
  merge: -1
  img_proc: true
- pgno: 142
  md: '股價收在±1σ的機率約68・3%、

    ±2σ約95・4%、±3σ約99・7%。


    +   - 布林通道的算式


    +   1. 標準差的算式


    標準差=√(n天內的收盤價-n天內的平均值)的平方的總和÷n天


    +   2. 布林通道的算式


    ±1σ=n天的移動平均±n天的標準差

    ±2σ=n天的移動平均±n天的標準差×2

    ±3σ=n天的移動平均±n天的標準差×3


    +   - 關於價格收在通道內的機率


    | 收在布林通道的 ±1σ的範圍內的機率 | 約 68.3% |

    | 收在布林通道的 ±2σ的範圍內的機率 | 約 95.4% |

    | 收在布林通道的 ±3σ的範圍內的機率 | 約 99.7% |


    雖然算式如同上圖，不過不用想得很困難，當然也不必計算。現在網路證券的資訊工具就能輕易顯示。如果有在意的公司股票，只須輸入四位數的公司股票代碼就能看到資訊。


    要使用多久期間的移動平均的數值，雖然依照短期買賣或中長期投資等投資態度而有所不同，不過假如'
  merge: -1
  img_proc: true
- pgno: 143
  md: '是日K，如5天或25天等，盡量是較多投資者看的數值比較好。數值設定也是利用資訊工具選擇，或是只須輸入即可。瞬間就會顯示在電腦或手機畫面上。


    和其他振盪型或趨勢型的技術分析不同，布林通道也能活用於「順勢交易」和「逆勢交易」。它是十分方便的技術分析，因此有非常多投資者活用。那麼，接下來解說實際的用法和重點。


    # 搭上行市趨勢的順勢交易型。


    首先解說我最信賴的，一種叫做「波動突破」的順勢交易型的用法。代表性的例子是，在脫離穩定行市的時機買賣的手法。布林通道在行市的動作貧乏時通道的幅度會變窄，行市的動作激烈時通道的幅度會變寬。


    通道的幅度變窄時要注意市價變動，收盤價超出±2σ後，就老實地跟隨趨勢進場。此外，通道幅度狹窄的時期愈長，之後突破時的市價變動就愈大。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# ○布林通道（順勢交易型）


    ![](img/300d6743e3871fdc0ea17875b15acce5_144_0.png)


    在順勢交易型的波動突破，股價以收盤價穿過±2σ時，換言之，出現異常值時要跳上去，因此或許感覺和之前的解說略微不同。


    然而，判斷的時機終究是布林通道的通道幅度收縮、變窄時。股價在這種局面穿過±2σ，可以估計接下來行市會增長勢頭，通道幅度變寬。


    雖然上圖是波動突破的例子，不過通道收聚後從穿過+2σ開始通道幅度變寬，可知股價沿著+2σ的線條持續上升。結算的時機是，股價以收盤價低於+2σ時，或通道開始收聚時。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# POINT


    股價持續穩定，通道幅度變窄就要注意。

    以收盤價穿過±2σ時順勢交易進場。


    活用趨勢通道，鎖定趨勢發生時的一時下跌。


    前述的波動突破，是快速掌握行市的轉換點，搭上上升或下降趨勢的投資手法。這股趨勢持續時，股價會在移動平均線與±2σ線，或是±1σ線和±2σ線之間反覆上下波動，並往趨勢方向移動。


    K線沿著±2σ的線條並排的狀態叫做「趨勢通道」。趨勢通道出現時，就鎖定一時下跌進場。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 布林通道


    趨勢通道

    趨勢通道出現時（上升趨勢中）觸及移動平均線時就判斷買進。


    ![](img/300d6743e3871fdc0ea17875b15acce5_146_0.png)


    上圖是趨勢通道中股價的市價變動。布林通道的通道幅度變窄，股價以收盤價穿過+2σ後上升趨勢開始。


    然後，沿著+2σ的線條K線並排的趨勢通道出現，上升趨勢持續下去。在上升過程中，股價一時下跌，觸及中心線移動平均線。這裡就是一時下跌的買進點。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# POINT


    在沿著+2σK線並排的趨勢通道，挑出一時下跌等，等待趨勢回歸。


    在區間市場鎖定過度上升與下跌逆勢交易。


    最後介紹在布林通道的區間市場的逆勢交易。這裡的思考方式，要變成在開頭的漫畫中介紹的車輛行駛。複習一下，股價收在通道內的機率如同下述：


    +   - 收在布林通道的±1σ的範圍內的機率→約68・3%


    +   - 收在布林通道的±2σ的範圍內的機率→約95・4%'
  merge: -1
  img_proc: true
- pgno: 148
  md: '+   ・ 收在布林通道的 $\pm 3\sigma$ 的範圍內的機率 $\rightarrow$ 約 $99.7\%$


    換言之，突破 $\pm 2\sigma$ 是非常罕見的例子，也是異常事態。抓住這個時機逆勢交易進場，等待股價回到正常值。雖然在外觀也是非常簡單明瞭的逆勢交易手法，不過必須注意「一定要在股價持續穩定的區間市場活用」。因為正如在波動突破和趨勢通道解說的，在股價的方向（趨勢）明確的局面中，穿過
    $\pm 2\sigma$ 的例子並不罕見。


    如果顯示到機率 $99.7\%$ 的正負 3 個標準差，準確性就會提高。


    作為區間市場時的逆勢投資活用之際，把從 $+1\sigma$ 到 $+2\sigma$ 分別想成低價支撐線（支撐線）和高價阻力線（壓力線），股價從 $-1\sigma$
    跌到 $-2\sigma$ 就是買進點，從 $+1\sigma$ 漲到 $+2\sigma$ 就判斷為賣出點。在技術分析的工具等一般顯示到 $+2\sigma$，不過顯示到機率約
    $99.7\%$ 的 $\pm 3\sigma$，到達 $+3\sigma$ 逆勢交易的話，準確性就會更加提高。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '當然，因為±3σ的出現率很低，所以很難出現買賣的信號。因此，在-2σ試探買進，股價繼續下跌觸及-3σ時決定逢低買進攤平成本，這種想法也是可行的。


    # POINT


    在股價持續穩定的區間市場逆勢交易活用。觸及±2σ後逆勢交易進場。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# ○布林通道（逆勢交易型）


    移動平均線幾乎呈水平狀態，觸及±2σ時就判斷為買賣時機。


    ![](img/300d6743e3871fdc0ea17875b15acce5_150_0.png)


    上圖是逆勢交易手法的參考例子。布林通道收縮，進入行情穩定。並且，因為觸及作為下值抵抗線發揮功能的-2σ，所以判斷買進。之後股價轉為上升，因為這次觸及作為上值抵抗線發揮功能的+2σ，所以在此獲利了結處算出售。


    在獲利了結的同時，結算時機也是根據信用交易「賣空」（信用出售）的機會。賣空是利用股價下跌瞄準收益的投資手法。像這樣在區間市場，輪流站在買賣的位置來回瞄準盈利也行。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '提案者自己否定在逆勢交易活用。


    附帶一提，布林通道是美國人約翰·布林（John A・Bollinger）先生所設計的技術分析。到目 前為止他來過日本好幾次，我也曾經和他一起 吃過飯。他是十分親切，有紳士風度的人。


    布林先生對於自己提案的布林通道的活用，說：「在逆勢交易不應該使用。」在逆勢交易的用法，因 為觸及高價阻力線和低價支撐線的±2σ，雖然在 外觀上也很單純，不過有時也會出現許多騙線。
    即使在區間市場貫徹活用，行市也會從穩定情況 上下大幅變動，這也能夠預想得到。


    股票與外匯，或者波動率（價格變動率）高的加 密資產比特幣等，有時候果斷撤退也很重要。別 想要一攫千金，和行市長期打交道，留意長期 的資產運用吧！'
  merge: -1
  img_proc: true
