- pgno: 120
  md: '經由技術分析掌握趨勢的轉折點。


    人生有各種「轉折點」。如轉學、改行或結婚等，每個人的轉折點都不同。部長與太太的例子中，因為調職使得兩人的內心距離一口氣接近，所以能清楚得知調職正是人生的轉折點。


    有時自己不會察覺到轉折點，得靠朋友或同事指出。自己之所以無法察覺，是因為轉折點沒有可辨別的明確指標。常常事後回顧過去時，才會察覺：


    「喔，那裡就是轉折點啊。」


    不過，關於股價的市價變動，利用技術分析可以掌握轉折點的訊號。此外，這個訊號不會因人而異。對於利用技術分析的人來說，是能夠掌握共通的轉折點（依照技術分析的觀點、用法會使成為轉折點的點改變。）'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   ○用 2 條線描繪的 MACD


    ![](img/300d6743e3871fdc0ea17875b15acce5_121_0.png)


    在技術分析，有許多敏感地掌握股價趨勢轉折點，推測買賣時機的「趨勢型技術指標」。在Part 2 說明的K線分析對於找出趨勢轉折點也有幫助，而移動平均線（在Part
    5 介紹）、布林通道（Part 7）或一目均衡表（Part 8）等趨勢型指標是找出股價趨勢轉折點的 analyze 手法。


    另一方面，技術分析也存在著許多稱為「振盪型」的指標。所謂振盪是指鐘擺或振動的意思。在技術分析，這是判斷「超賣」、「超買」的指標（在Part 9 將會介紹RSI與隨機指標等振盪型指標）。在這個單元介紹的「MACD」，雖然以趨勢型為主，但也'
  merge: -1
  img_proc: true
- pgno: 122
  md: '是兼具振盪型要素的優秀技術指標。請務必掌握，提高交易的精確度吧！


    敏感地反映最近的市價變動。


    那麼，接下來解說MACD的用法。MACD是「Moving Average Convergence Divergence」的簡稱。翻譯過來就是「平滑異同移動平均線」。由K線圖上描繪的移動平均線的分析發展而成，在技術分析中也獲得許多投資者支持。比SMA（簡單移動平均線）分析的精確度更加提升，在趨勢形成時能發揮極大的力量。


    # 算式'
  merge: -1
  img_proc: true
- pgno: 123
  md: '短期EMA（指數平滑移動平均線）一長期

    EMA = MACD線

    MACD本身的EMA = MACD信號線


    MACD是由「MACD線」和「MACD信號線」這兩條線所形成。分別用這個算式算出，連接起來變成圖表。並非SMA，使用EMA才是重點。比起單純的移動平均線，把重點放在最近的市價變動，所以特色是容易對市價變動作出反應。在MACD，藉由根據EMA的兩條線的移動方式（兩線的方向與間隔的擴大及縮小、交叉等）看清趨勢。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# O 藉由 MACD 看清買賣時機


    ![](img/300d6743e3871fdc0ea17875b15acce5_124_0.png)


    在黃金交叉時買進，MACD 線向上突破零點時跟進買進。


    在死亡交叉時賣出，MACD 線向下跌破零點時跟進賣出。


    形成移動平均線的期間，如果是日K圖，基本上短期EMA設定為12天、長期EMA為26天、MACD信號線為9天。假如想更加提高分析的精確度，則必須根據公司股票或市場的動向調整期間，不過這比較適合技術分析的高手。首先設定成12、26、9的期間即可。


    根據MACD找出買賣訊號的方法非常簡單。在零點下方MACD線由下往上穿過MACD信號線，所謂的「黃金交叉」出現時就是買進點。相反地在零點上'
  merge: -1
  img_proc: true
- pgno: 125
  md: '方，MACD線由上往下穿過MACD信號線的「死亡交叉」出現時就是賣出點。


    此外，MACD線和MACD信號線交叉的角度愈大，就能看成愈強烈的趨勢轉換信號。光是記住MACD的黃金交叉和死亡交叉，也能相當提高買賣時機的精确度。如果常常搞錯買賣的時機，就先從參考這兩種交叉開始吧！


    # POINT


    MACD就像是移動平均線（MA）的「表哥」。在零點下方的「黃金交叉」出現就是購買的時機！'
  merge: -1
  img_proc: true
- pgno: 126
  md: '直方圖的零點十分重要。


    在MACD，除了MACD線和MACD信號線這兩條線，還有表示兩條線的差（乖離）的「直方圖」。雖然主要是以條狀圖標示，但可以更仔細地掌握兩條線的動作。


    那麼從直方圖到底能得知什麼呢？因為直方圖是兩條線的差，所以兩條線交叉的點（＝直方圖的零點）會出現黃金交叉或死亡交叉。這裡就是最初的買進點。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 藉由直方圖看到的東西


    ![](img/300d6743e3871fdc0ea17875b15acce5_127_0.png)


    另一個，如果MACD線超過直方圖的零點，就能判斷上升趨勢為真，所以這裡就是跟進買進的點（參照此圖）。死亡交叉出現時，這裡就是最初的賣出點，然後低於零點時就是跟進賣出的點。MACD的零點，由下往上穿過就是上升趨勢強烈，如果由上往下穿過則能判斷下降趨勢強烈，所以需要留意。


    另外直方圖的「大底（bottom out）」，換言之直方圖的圖表從下降轉為上升的點，由於會比MACD的黃金交叉先形成，所以是最早出現的買進訊號。但是，光憑直方圖作為趨勢轉換的訊號太弱，因此只憑這點就決定買賣的時機太過冒險。最好能掌握趨勢轉'
  merge: -1
  img_proc: true
- pgno: 128
  md: '換的預兆，如暗示MACD上的黃金交叉、死亡交叉出現的現象。


    > **POINT**


    如果MACD線超過「零點」，

    就跟進買進加強攻勢！


    股價與指標往反方向移動的「背離」。


    再稍微深入思考MACD。MACD是以移動平均線為基本的技術指標，因此基本上如果股價上升，MACD的兩條線也會有上升的傾向。不過，有時'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'MACD和股價的動作會是反方向。如「明明股價上漲，MACD的兩條線卻下降」，或者「明明股價下跌，MACD的兩條線卻上升」的情況。在表示趨勢方向的振盪型技術指標，指標相對於股價往反方向移動就叫做「背離」。


    在MACD背離發生時，就能判斷「眼前的股價上漲了，不過上升趨勢接近結束」。另一方面，明明眼前的股價下跌卻發生MACD上升的背離時，可以想成「下降趨勢接近結束」，是股價反轉的訊號。可以想成買進的機會接近（參照下圖）。


    ○ MACD 的背離


    ![](img/300d6743e3871fdc0ea17875b15acce5_129_0.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_129_1.png)


    MACD 信號線


    0 點


    MACD 線'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 黃金交叉比移動平均線更快出現！


    接著來看K線圖上描繪的SMA和MACD變動。正如本單元一開始說明的，MACD在移動平均線中也是以EMA為基本，所以會根據最近的市價變動敏感地反應。這意味著比起SMA，MACD的買賣信號較早出現。


    上圖的走勢圖中，在MACD上黃金交叉、死亡交叉比K線圖上描繪的移動平均線還要早出現。若能把這個現象善加活用於交易，就能更精確地掌握買賣的時機。比起僅憑簡單移動平均線判斷買賣時機，可以搶先買進，或是在損失擴大前賣出。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# ○ 買賣信號比移動平均線更早出現


    ![](img/300d6743e3871fdc0ea17875b15acce5_131_0.png)


    比SMA的黃金交叉、死亡交叉，利用EMA的MACD在較早的時機出現買賣訊號。


    在K線圖上的SMA，由於黃金交叉和死亡交叉出現較晚，所以利潤無法如想像中提高。但是，在訊號比較早出現的MACD，這也有可能變成「騙線」。


    所謂騙線是指即使根據技術分析出現買賣訊號，之後的股價卻與訊號指示的方向反向移動。不只MACD，對於所有的技術指標都可說是如此。


    雖然深入研究一種技術指標是好事，不過過於相信單一一種指標有可能導致重大失敗。把MACD的黃金交叉（死亡交叉）當成第一買賣點，移動平均線的黃金交叉（死亡交叉）當成第二買賣點進行交易或許比較好。'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# POINT


    MACD的黃金交叉、死亡交叉比移動平均線更早出現買賣訊號。考慮騙線留心交易吧！


    找出對該公司股票而言，最好的技術指標。


    MACD在市價變動出現清楚的趨勢時，是精確度很高的分析手法。因此獲得許多投資者支持，但它也有弱點。那就是股價以一定的價格範圍上下波動，處於區間市場或三角形態等狀況下有效度就會下降。因為MACD對於看清趨勢很有效，所以趨勢減弱，或是平穩趨勢時，就不太能發揮它的長處。


    但是，這種情況只要搭配對區間市場較強的其他技術指標即可。若是MACD，與振盪型技術指標（判'
  merge: -1
  img_proc: true
- pgno: 133
  md: '斷股價超賣、超買的指標）RSI搭配的契合度比較好。關於RSI將在Part 9詳細敘述，因此建議一併確認。


    無論哪種技術指標都一樣，依照公司股票揭示適當買賣時機的指標將會改變。有時候某個公司股票MACD上的訊號揭示了最佳買賣時機，而有的時候某個公司股票使用其他技術指標比較好。


    另外，明明以前某種技術指標完全適用，經過一段時間後卻有可能不再如此。要解決這種問題，得確認多種技術指標。並且，不妨調查每种公司股票在哪種技術分析的有效度比較高。


    也許這些作業的確很麻煩，不過這也是為了自己的投資。在網路證券等提供的資訊工具，很多可以從K線圖跳到多種技術走勢圖，因此熟悉後就能在短時間內確認。


    占卜有占星術或塔羅牌占卜、姓名判斷、手相或面相等許多種類。還有解夢或動物占卜等類型。雖然我對占卜不是很熟悉，不過每種占卜都有各自的長處與特色，無法斷言哪一種最準。依照占卜時機或想占卜的內容也會有所變化。'
  merge: -1
  img_proc: true
- pgno: 134
  md: '技術指標也有類似的一面，無法斷定哪種技術指標是最好的。但可以透過比較目前為止的股價變動和多種技術指標看清。「這個公司股票MACD的訊號和買賣時機完全重疊呢！」建議像這樣判斷。


    > **POINT**


    依照行市的情況、公司股票和投資時機，

    看清哪種技術分析最好非常重要！'
  merge: -1
  img_proc: true
