- pgno: 196
  md: '絕對要掌握的振盪型指標是RSI和隨機指標，因此在此省去其他振盪型指標的細節，不過每一種都各有優劣。雖說是理所當然的，但完美的技術指標並不存在（要是有那種東西，大家都能靠股票賺大錢了）。


    前面多次指出，根據行市的狀態與個別公司股票，適當的技術指標將有所改變。這裡舉出的指標都不用深入思考。分別留意確認2到3個趨勢型、振盪型就行了。


