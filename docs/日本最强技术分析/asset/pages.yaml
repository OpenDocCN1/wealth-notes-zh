    掌握基本，活用K線。


    開頭的漫畫中，未咲作了享受旅行的夢，在內心的晴雨表數值「50」起床。之後工作上犯錯被部長吶責，內心的晴雨表數值暴跌到「20」。然後，在女生聚會度過開心的下班後時光，心情興奮，內心的晴雨表數值暴漲到「100」，就寝前興奮的心情也因收看Youtube平靜下來，在內心的晴雨表數值「80」就寢。'
