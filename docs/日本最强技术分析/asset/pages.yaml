- pgno: 167
  md: '# 一目均衡表的3個基本活用法。


    接著，來具體地檢視一目均衡表的基本活用法。「基準線和轉折線」、「先行帶A與B」、「延遲帶」與K線的位置關係正是基本重點。


    # ◇用基準線和轉折線的活用法


    過去26天的最高價與最低價的平均連接起來的基準線，表示行市中期的方向。基本上和移動平均線是同樣的用法。另外，藉由與特色是表示行市短期方向的轉折線搭配，就能推測買賣的時機。


    +   ① 如果基準線朝上就是上升趨勢，朝下就是下降趨勢。


    +   ② 假如K線在基準線上方就是強勁市場，在下方則能判斷為疲弱市場。


    +   ③ 在基準線朝上的狀態，轉折線由下往上穿過基準線的黃金交叉叫做「好轉」，是買進訊號。反之'
  merge: -1
  img_proc: true
- pgno: 168
  md: '在基準線朝下的狀態，轉折線由上往下穿過基準線的死亡交叉叫做「逆轉」，是賣出訊號。


    # ◆利用先行帶A與B的活用法的關鍵是雲帶


    使用導出基準線的基準值與導出轉折線的轉折值相加後除以2的數值等，未來行情的日子，分別被不同的先行帶A與先行帶B包夾的範圍，就稱為「雲帶」。藉由雲帶和K線的位置關係，就能確認行市的強弱狀態。


    具體而言有下列4種模式：


    +   ① 如果K線在雲帶上方就是強勁市場，如果在下方就判斷為疲弱市場。


    +   ② 假如雲帶在K線上方，雲帶會發揮高價阻力帶的作用。假如雲帶在K線下方，雲帶會發揮低價支撐帶的作用。


    +   ③ K線由下往上突破雲帶時變成上升信號，變成「好轉」。相反地，K線由上往下跌破雲帶時變成下'
  merge: -1
  img_proc: true
- pgno: 169
  md: '跌信號，便是「逆轉」。這是作為行市轉折點的重點。雲帶正如阻力帶之名，厚的時候突破需要時間，薄的時候因為阻力弱，所以容易上下突破，也容易轉折。


    +   ④ 2條先行帶交叉的點稱為「雲帶扭曲」等。這個「雲帶扭曲」極有可能是行市的轉折點（趨勢轉換，或者加速局面）「變化日」。


    另外，要是K線位於雲帶上方，雲帶就會發揮支撐帶的作用；K線若是跌破雲帶下方，就會看到抑制返回的阻力帶。另一方面，K線位於雲帶中間時，行市的方向也可說處於模糊的狀態。


    # ◆延遲帶的活用法


    雖然延遲帶很單純，卻是推測買賣時機的寶貴判斷材料。延遲帶由下往上突破K線會變成「好轉」的強勁市場，是買進的訊號。相反地，延遲帶由上往下穿過K線會轉為「逆轉」的疲弱市場，被視為賣出訊號。除此之外，與K線糾纏的動作持續時，就能掌握行情穩定（區間市場）。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '複數線條互相纏繞，看起來複雜的一目均衡表，

    各個線條都具有簡單明瞭的特色。


    # POINT


    比起其他技術指標，或許大家會覺得非常困難，

    不過先記住3個活用法吧！


    三役好轉與三役逆轉是強烈的買賣訊號。


    然後，從基準線、轉折線、雲帶、延遲帶、K線

    各自的位置關係，特定的3個條件湊齊後，有時會成'
  merge: -1
  img_proc: true
- pgno: 171
  md: '立非常強烈的買進訊號或賣出訊號。


    在一日均衡表，強烈的買進訊號就是「三役好轉」，強烈的賣出訊號稱為「三役逆轉」，是一日均衡表最具代表性的買賣訊號。


    但是，比起轉折線由下往上穿過基準線的黃金交叉，或延遲帶由下往上突破K線的「好轉」，「三役好轉」容易是較慢的訊號，這點要記住。


    首先，三役好轉的3個條件如下所述：


    +   。「**轉折線大於基準線**」......轉折線向上穿過基準線。

    。「**K線大於雲帶**」......K線向上穿過雲帶。

    。「**延遲帶大於K線**」......延遲帶向上穿過K線。


    另一方面，三役逆轉的3個條件如下所述：


    +   。「**轉折線小於基準線**」......轉折線向下穿過基準線。

    。「**K線小於雲帶**」......K線向下穿過雲帶。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '+   。「延遲帶小於K線」……延遲帶向下穿過K線。順帶一提，三役逆轉有時也用「三役暗轉」來表達。


    ○ 三役好轉


    下述的3個條件湊齊（圖中的☆的時間點）後，會變成非常強勁的買勢。


    +   ○ 轉折線＞基準線

    ○ K線＞雲帶

    ○ 延遲帶＞K線


    ![](img/300d6743e3871fdc0ea17875b15acce5_172_0.png)


    ○ 三役逆轉


    ![](img/300d6743e3871fdc0ea17875b15acce5_172_1.png)


    下述的3個條件湊齊（圖中的☆的時間點）後，會變成非常強勁的賣勢。


    +   ○ 轉折線＜基準線

    ○ K線＜雲帶

    ○ 延遲帶＜K線'
  merge: -1
  img_proc: true
- pgno: 173
  md: '被視為強烈買賣訊號的三役好轉與三役逆轉，由於出現條件嚴苛，所以不會頻繁地看到。此外，要找到它們出現也很麻煩。不要放棄，耐心地盯著一目均衡表吧！


    首先，掌握一目均衡表的3個活用法和雲帶的特徵正是活用的捷徑。以上看起來複雜的一目均衡表也有一定的模式，只要掌握訣竅便是無比的行市判斷材料。另外，它的特徵適合日K圖的短期趨勢分析，一目均衡表不只股票，在外匯也被廣泛使用。


    > **POINT**


    一目均衡表如同字面意思，一眼就能看清行市的方向，是受到投資者廣泛支持的技術指標。'
