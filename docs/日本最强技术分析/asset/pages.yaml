- pgno: 2
  md: '# 前言


    正在寫這本書的2021年2月，美股更新史上最高值，日經平均股價也更新了泡沫崩潰後最高值。此外，代表性的加密資產（虛擬貨幣）比特幣也連日不斷更新史上最高值。我所屬的摩乃科斯證券也有新客戶陸續投入美股、日股或加密資產CFD（差價合約）等。


    然而，這些市場也有許多專業投資者，個人投資者為了獲勝，絕對需要某種程度的知識與技巧。這時最可靠的，正是「技術分析（走勢分析）」。由於我自己目前在網路證券工作，能投資的金融商品和買賣時機受到限制，不過過去我曾在沒有任何知識的情況下購買日股，多次吃了苦頭。


    2000年的IT泡沫崩潰時，當時公司的前輩T推薦我購買日股，那是我第一投資股票。我不經意地看著股市走勢圖，因為下跌所以以為是機會，而購買了一千股日立製作所，卻是地獄的開始。


    就像看準我購買似的，日立製作所以驚人的氣勢開始下跌。我沒有勇氣止損，咬手指頭看著它好幾天暴跌。在意隔天的市場，陷入睡眠不足也是在'
  merge: -1
  img_proc: true
- pgno: 3
  md: '這個時期。因為也有其他想買的公司股票，雖然購買了，但那張公司股票也不斷下跌。起初是打算中長期投資，不過不久之後我變更投資風格，變成從幾天到數週的波段交易。而後買賣更加升級，變成開始一天就結束的日內交易。然而，不管經過多久都沒有賺取利潤。


    雖然不經意地看著走勢圖，不過當時的我，僅憑負擔能力等自己的感覺進行交易。有一天，雖然我放棄之前的損失，但仍當成最後的機會，我學習了走勢和技術分析。因為是自己的錢，所以我傾注了與學校學習無法比較的熱情。


    雖然速度緩慢，但是買賣的時機開始吻合，勝率也變高了。之後，我搭上大幅的上升趨勢，收回過去的損失，收支轉為大幅的盈餘。


    例如在股票投資，有「技術分析」和「基本（經濟基礎的主要因素）分析」這兩種分析手法。不過，根據企業的發展與業績等的基本分析，實在比不過證券公司的分析師等專家。


    另一方面，在活用走勢圖的技術分析中，我們個人投資者能獲得和股市專家相同的資訊，而且現在能藉由網路證券提供的資訊工具輕易地進行技術'
  merge: -1
  img_proc: true
- pgno: 4
  md: '分析。並且，幹練的分析師迅速獲得的資訊會如何影響股價等，也全都會反映在過去的走勢圖，這正是技術分析的觀點。


    許多投資者目前為止在股票或**FX**（外匯保證金交易）等有過痛苦的經驗。此外，有許多人正打算從現在開始挑戰投資。知不知道技術分析，肯定會產生極大的差異。沒有必要想得很困難。起初學會至少需要的幾個模式，慢慢地擴大分析的廣度即可。


    此外，將各種技術分析應用在一家公司股票驗證，就能掌握公司股票的特性，以及哪種技術分析會剛好適用等。


    如果學會本書介紹的技術指標和走勢圖形，無論是日股或美股，外匯或加密資產，對於所有交易商品的投資應該都會有幫助。並且這些技術指標和走勢圖形，有時也會無意中適用於生活的一部分。在本書為了讓大家掌握印象，在各**Part**的開頭都加入漫畫。


    了解技術指標和走勢圖形，目標成為獲勝的投資者、不會輸的投資者吧!!'
  merge: -1
  img_proc: true
