  md: '> 有句股市箴言是

    「返回半價就是返回全價」。


    # 技術分析非常深奧。或許還會有新發現！


    在活用費波那契數列和黃金比例的技術分析，除了費波那契回調，還有從時間軸用費波那契數列計算行市變動的「費波那契時間周期」；和從某個價格畫出趨勢線，跌破那條線後，接著用費波那契數列預測反轉點的「費波那契扇形線」；利用圓弧的「費波那契弧形線」等。


    有興趣的人不妨進一步研究看看。依照公司股票不同，比起基本的費波那契回調，或許會發現股價直接反應的情形。


    至此介紹了各種技術分析，不過除此之外還有許多分析手法，全新的分析手法也會陸續發表。技術分析非常深奧，我自己也還在進行研究。假如你發現了全新的技術分析，到時候請偷偷地告訴我吧！'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 後記


    # 「戰勝市場的投資者都知道」


    在本書介紹了具代表性的技術分析（走勢分析）。每種技術分析用來預測股價方向或趨勢轉折點時都非常可靠。在使用各種技術指標的過程中，應該會遇見喜歡的指標。不過它們各有優劣，或許也會碰上「騙線」。因此，正如本書也有提到，實際投資時建議並用多種技術指標。


    此外，例如藉由日K圖進行交易時也是，首先顯示月K、週K圖，掌握是否為長期的趨勢之後再進行投資判斷，便能做出準確性更高的交易。


    其中也有人否定技術分析：「技術分析只是結果論吧？」不過，觀察過去的傾向進行買賣的投資者非常多也是事實。


    因此，了解占多數的投資者的傾向十分重要。在本書的Part 1也有寫到，因為股價的變動是由人氣投票決定，所以若能採取和其他大多數投資者相同的投資行動，搭上浪尖，就會有好結果。而且，多數投資者所有的投資行動會顯現在走勢圖上。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '例如，其他投資者加強賣出的態度，光靠基本分析無法察覺這個態度，也會出現只有自己衝去買的情形。那不得不說是可能擴大損失的行為。


    有句有名的股市箴言：「人行之路別有路，千株萬花滿山開」。這句話的意思是，只採取和別人同樣的投資行動就無法賺大錢，有時必須做出與眾不同的行動才會賺大錢。這在某方面來說你以為射中靶心了，不過只憑想法或直覺等採取不同的行動，勝率就會下降許多。基本上，利用技術分析感受他人的行動與傾向非常重要。


    順帶一提，我最信賴的是在Part 6介紹的MACD。尤其活用於尋找買進時機。不過，依賴MACD購買的公司股票藉由MACD的訊號想要賣出時，由於賣出的訊號會較晚出現，所以無論如何利潤往往會減少。更想鎖定價格範圍時，關於結算時機利用RSI等振盪型指標也是一個方法。


    # 基本分析交給專家'
  merge: -1
  img_proc: true
- pgno: 209
  md: '實際挑選公司股票時，還是應該確認企業實績與宏觀經濟指標等基本面。就算在技術分析出現了買進訊號，如果因為企業業績惡化等導致公司倒閉，股票就會下市。股價也會一路跌到1日圓。這麼一來，好不容易使用技術分析也會白費工夫。


    不過，正如在「前言」也有寫到，關於基本分析，專門每天研究、分析的證券公司的分析師等人是專家中的專家。這些分析師分析的企業實績等資訊，對投資者會以「報告」、「研討會」的形式公開。


    雖然個人投資者自己也能分析，不過假如沒時間分析，只須參考分析師每天鑽研後所寫的報告等即可。若能藉此發現前途有望的公司股票，就活用目前為止介紹的技術分析，尋找買進時機和出售時機。


    # 自己的情緒會阻礙特意使用的技術分析


    最後提一下精神層面的事。投資時，盡量減少損失，創造最大利潤的「損小利大」的想法非常重要'
  merge: -1
  img_proc: true
- pgno: 210
  md: '要。然而，許多投資者出現損失時，往往猶豫是否該停損。


    另一方面，出現利潤時，會想要儘早結算確保利潤。結果，多次累積的一點利潤因為一次重大損失就告吹了。在所謂「努力多時一夕消失」的現象中，人一扯上錢就無法做出合理的判斷。


    獲頒諾貝爾經濟學獎的行動經濟學家丹尼爾・康納曼（Daniel Kahneman）先生和共同研究者阿摩司・特沃斯基（Amos Tversky）先生，在1979年提倡「展望理論」這個學說。


    所謂展望，是預測或期待的意思，依照預測或期待的損失、利潤或機率，將人們一般容易採取何種行動化為模組。在傳統的經濟學，前期是人們必定會採取具有經濟合理性的行動，不過實際上並非如此。


    例如，假使有下列2個選項，你會選哪一個？


    +   ① 現在馬上得到10萬日圓。


    ② 雖然有80%的機率能得到15萬日圓，卻有20%的機率什麼也得不到。'
  merge: -1
  img_proc: true
- pgno: 211
  md: '這種情況下，許多人傾向於選擇①。那麼，如果是下列選項會是如何呢？


    ③ 現在馬上支付10萬日圓。


    ④ 雖然有80%的機率得支付15萬日圓，卻有20%的機率不用支付。


    如果是這些選項，許多人傾向於選擇④。

    然而，以期持值思考時，在最初的選項①和②，①的期待值是10萬日圓（10萬日圓×100%），②的期待值是12萬日圓（15萬日圓×80%），選擇②比較有經濟合理性。


    另一方面，在第2個問題，③的期待值是—10萬日圓（—10萬日圓×100%），④是—12萬日圓（—15萬日圓×80%），選擇③比較有利。


    這套用在股票投資，在最初的選項「明明還有上升的餘地，卻早早進行獲利了結」，在下個選項「明明下跌的可能性還很大，卻不進行停損，持續持有」。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '在此我想表達的是，明朋應該按照技術分析忠實地進行買賣，自己的情緒與毫無根據的期待卻來阻撓，往往採取與本來應採取的行動相反的行動。充分理解這個部分，運用技術分析，在行市取得最後勝利吧！


    我為了推廣技術分析的有效性，對於個人投資者持續進行啟蒙活動。結果收到不少反饋：「多虧技術分析，投資的成果增加了。」這些成功經驗，對我來說是值得高興的事。


    技術分析不只日股，受到全球矚目的美股、外匯、加密資產、股價指數期貨或商品期貨等，能應用於所有的交易商品。


    執筆本書之際，我自己也再一次面對技術分析，多虧如此得以重新感受到技術分析的重要性。各位投資者在閱讀本書後若能提升投資表現，我也會感到非常高興。但願大家都能提高勝率。


    2021年2月吉日 福島理'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 日本最強技術分析


    # 1張圖看出漲跌訊號、1分鐘看懂質量分析


