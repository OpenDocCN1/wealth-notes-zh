- pgno: 180
  md: '# 湯和行情都是適溫最好？


    人有各種喜好。有的男性像和流一樣喜歡豐滿一點的女性，也有女性喜歡瘦削的男性。話雖如此，要是過胖或過瘦，這個人的健康會令人感到擔心。任何事都不要太過度，以長遠的眼光來看，體重適中或許比較好。


    關於行市和股價也一樣。有個行市用語是「金髮姑娘市場」（＝適溫市場）。這是指行市處於不會過熱，然而也不會太冷的適度狀態。這種狀態對股票市場和投資者來說都不算愉快吧？


    順帶一提，這個「金髮姑娘市場」用語的由來是，童話《三隻熊》裡登場的金髮姑娘從熱湯、適溫的湯、冷湯之中選了適溫的湯的故事。果然容易下嚥的適溫的湯比較令人滿意呢。


    # 判斷超賣、超買的操作指標。


    在這個單元要介紹「RSI」這個操作指標。這是「Relative Strength Index」的簡稱，中文叫做「相對'
  merge: -1
  img_proc: true
- pgno: 181
  md: '強弱指標」。某一段期間內的行市變動，判斷相對的「超買」或「超賣」，是振盪型技術指標的代表。這是創造出眾多技術指標的技術分析先生，美國的威爾德（J．W．Wilder）在1970年代後半設計出來的。


    算出RSI的算式如下所述，不過不必特別去記。只要能理解超買、超賣，或是兩者皆非即可。


    # 算式


    +   ① $RS = (N天的收盤價上昇幅度的平均) \div (N天的收盤價下跌幅度的平均)$


    +   ② $RSI = 100 - \{100 \div (RS + 1)\}$


    設計出RSI的威爾德，認為如果是日K基準，一定期間（N日）的設定以14天最適合，不過有時也會…'
  merge: -1
  img_proc: true
- pgno: 182
  md: '設定為9天、22天、42天、52天。若是週K基準，則是9週或13週。


    不過，這個期間並非絕對的正確答案。因為若是RSI能發揮最大效果的期間，那就可說是正確的。但是，研究期間適合技術分析的中級者或高手。在網路證券的交易工具等能看到的RSI，很多的最初設定為14天與14週，直接使用也沒問題。


    ![](img/300d6743e3871fdc0ea17875b15acce5_182_0.png)


    # POINT


    RSI是確認行市的超買、超賣的振盪型指標的代表！'
  merge: -1
  img_proc: true
- pgno: 183
  md: '逆勢交易投資的指標。


    RSI會在0%到100%之間變化。愈接近0%，行市愈疲弱，反之愈接近100%，就能判斷行市愈強勁。看法非常簡單，進入超買狀態就是賣出點，反之進入超賣狀態就是買進點。RSI是採取與眼前市價變動狀態相反的投資行動的指標，換句話說就是「逆勢交易」的指標。


    ○RSI的看法


    ![](img/300d6743e3871fdc0ea17875b15acce5_183_0.png)


    基本上，RSI超過70%行市便是處於過熱狀態（超買），低於30%便判斷為冷卻狀態（超賣）。但是，股價的漲停價格和跌停價格連續的行市突然變動'
  merge: -1
  img_proc: true
- pgno: 184
  md: '等時候，經常把80%以上視為超買線，20%以下判斷為超賣線。


    另外，即使超過80%股價仍持續上升，或者低於20%股價仍然下跌，變成所謂「騙線」的例子也不少。


    # 背離出現是投資機會！


    在RSI超過80%，明明股價判斷為過熱狀態，實際的股價卻持續上升……這也是實際在行市常見的例子。在Part 6「MACD」的篇幅也有提到，這種時候活用技術指標和股價反方向移動的現象「背離」非常有效。雖然背離的發生頻率較低，卻反而會是強烈的訊號。


    下圖中，在K線圖上一度打開窗口（間隔）股價上升時，RSI達到80%呢。RSI上的賣出訊號出現。然而，之後股價也持續上升。另一方面，明明股價更新最高價，但由於上升力道減弱，RSI本身開始逐漸下降。這就是RSI上的背離現象。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '○ RSI 的背離


    ![](img/300d6743e3871fdc0ea17875b15acce5_185_0.png)


    K 線圖更新最近最高價。另一方面，RSI 未更新最高價，由於背離（逆行現象）發生，所以能判斷賣出。


    由於這個現象發生後極有可能轉為下跌，所以可以判斷賣出。當然，反過來在看清行市下跌時的大底的點也很有效。背離出現將是之前的趨勢轉換的有力訊號。


    較強的趨勢發生時，

    會出現騙線正是弱點。'
  merge: -1
  img_proc: true
- pgno: 186
  md: '不過RSI也有弱點。就是RSI的股價變動平穩，或是在一定區間內變化時的準確性很高，但另一方面，上下出現強烈趨勢後準確性會降低。這種情況，即使在RSI上出現買賣的訊號，趨勢的力度仍未停止，有時會變成繼續上升或持續下降的「騙線」。


    為了避免騙線造成的判斷錯誤，該怎麼做才好呢？就是同時確認彌補RSI的弱點的技術指標。推薦在Part 6介紹的MACD。


    RSI與MACD的契合度非常好，並用可以彌補彼此的弱點。那是因為相對於RSI對箱型行情很強，在突然的趨勢發生時很弱；MACD在趨勢發生時的分析很優秀，在箱型行情則是有效度會下降的指標。


    箱型行情時用RSI，強烈趨勢發生時活用MACD看清買賣時機，由於在任何行市時都能活用高度有效的買賣訊號，所以交易的廣度擴大。


    > POINT'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'RSI上的背離出現是投資機會！

    用MACD彌補弱點交易的廣度就會擴大。


    # 注意2個指標上的訊號同時發生！


    RSI和MACD並用，不只能互相彌補彼此的弱點。剛才介紹了箱型行情時用RSI，趨勢發生時活用MACD的方法，不過有時這2個指標上會同時出現買進訊號。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# RSI和MACD的搭配


    ![](img/300d6743e3871fdc0ea17875b15acce5_188_0.png)


    在上圖，RSI和MACD兩者幾乎同時出現買進訊號呢。即使一個指標的有效低，如果趨勢型的技術指標和振盪型的技術指標幾乎同時出現買進訊號，果然準確性會一口氣上升。


    在上圖也是幾乎在同一時機買進訊號出現後，股價會脫離下降趨勢，大幅上升。雖然在這張走勢圖上並未說明，不過股價急劇上漲後，會進入停滯行情。


    RSI超過80%線時，股價的上升趨勢會停滯。在MACD進入停滯行情後，經過相當長的時間會出現死亡交叉。MACD本身也會逐漸行情看跌，不過實際上下降趨勢並未發生。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '由於是在相當狹窄的區間內的市價變動，所以在RSI也不會出現有效的賣出訊號，在這2個技術指標，不能應變之後的停滯行情。


    在這種情形，不必勉強買賣。正如「休息也是操作」這句股市箴言，不交易攔著也是一步棋子。在技術分析的買賣中，不必憑模糊的訊號交易。只要在明確的買進、賣出訊號出現時交易即可。


    # POINT


    在RSI和MACD上訊號同時出現準確性會提升！


    明確的訊號沒有出現時「休息也是操作」。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '變成買賣訊號的隨機指標。


    在此介紹和RSI不同的另一個振盪型技術指標。

    「隨機指標」和RSI同樣是判斷行市超買、超賣的指標，是在1950年代由美國的喬治·萊恩（George Lane）設計出來的。和RSI並列，是受到許多投資者支持的技術指標，有時也稱為「KD指標」。


    隨機指標有用「%K」和「%D」這2條線描繪的「快速隨機指標」，和使用這些的移動平均的

    「Slow%K（%D）」和「Slow%D」這2條線描繪的

    「慢速隨機指標」。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# ○ 慢速隨機指標


    ![](img/300d6743e3871fdc0ea17875b15acce5_191_0.png)


    RSI 在 20% 以下，「Slow% K」由下往上穿過「Slow% D」的黃金交叉出現是買進的訊號。


    RSI 80% 以上是超買區。「Slow% K」和「Slow% D」的死亡交叉出現是賣出訊號。


    快速隨機指標正如其名，對行市的變動敏感地反應，而且買賣訊號頻繁出現。雖說適合短期投資，不過騙線很多正是其缺點。


    慢速隨機指標果然正如其名比較慢，因而比起快速隨機指標買賣訊號出現的頻率減少。但是，騙線也因而減少。雖然慢速隨機指標是為了彌補快速隨機指標的缺點而設計的，但最近運用慢速隨機指標的情形也變多了。在此將解說慢速隨機指標的用法。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 黃金交叉、死亡交叉出現！


    隨機指標也和RSI相同，用百分比表示，依照這個標準判斷「超買」和「超賣」。隨機指標的2條線如果在80%以上就是超買，假如低於20%就判斷為超賣。


    和RSI的不同之處是，相對於RSI是1條線，隨機指標則是用2條線描繪。悟性強的人或許察覺到了，2條線就表示，線條會有交叉的點。Slow％K線由下往上穿過Slow％D線的黃金交叉時就是買進點，Slow％K線由上往下穿過Slow％D線的死亡交叉時就是賣出點。


    ![](img/300d6743e3871fdc0ea17875b15acce5_192_0.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: '隨機指標一般使用慢速。


    黃金交叉、死亡交叉出現就是買賣的訊號。


    # 建議並用多個技術指標。


    隨機指標2條線的黃金交叉和死亡交叉會成為買賣點出現，比起RSI特色是會出現許多買賣訊號。因此買賣訊號的「騙線」也很多正是缺點。比RSI更進一步地，行市的趨勢往一個方向大幅傾斜時，有時即使大幅超過80%股價仍會繼續上升，或是即使低於20%也會繼續下跌。


    要避開騙線，得同時確認其他技術指標。隨機指標也和RSI一樣，雖然和趨勢型技術指標MACD並用很有效，不過除此之外，和Part 7介紹的布林通道，或Part
    8介紹的一日均衡表並用也很有效。此外，也可以和同樣是振盪型的RSI並用。'
  merge: -1
  img_proc: true
- pgno: 194
  md: '順帶一提，關於同樣是振盪型技術指標的隨機指標和RSI何者「好用」很難判斷。這是因為根據行市的狀態或公司股票，何者更有效將有所改變。在Part 6也敘述過，比較兩種指標，確認該公司股票何者會出現更適當的買賣時機的訊號才是重點。假如進行超短期交易，出現更多買賣訊號的隨機指標可說比較適合。


    # 完美的技術指標並不存在！


    除了RSI和隨機指標，振盪型技術指標還有下面所介紹的心理線、RCI（順位相關指數）、均線乖離率等。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 心理線


    ![](img/300d6743e3871fdc0ea17875b15acce5_195_0.png)


    # RCI（順位相關指數）


    ![](img/300d6743e3871fdc0ea17875b15acce5_195_1.png)


    在日 K 圖標示 25 日移動平均線，在下段標示 25 日均線乖離率。在負數圈的乖離率在 -16% 左右反轉，判斷這附近為買進。另外，在正數圈的乖離率在 13%
    左右回落，判斷這附近為賣出。


    # 均線乖離率


