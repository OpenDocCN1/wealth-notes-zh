- pgno: 109
  md: '「葛蘭碧八大法則」在股價的技術分析是使用移動平均線，最有名、最基本的技巧。相當於日本的高度經濟成長期的1960年代，美國華爾街的通信社記者，同時也是知名交易圖表專家的約瑟夫·葛蘭碧（Joseph
    E·Granville）先生構思，他整理了根據移動平均線和股價位置關係的買賣重點。在股票市場的世界，這是最普及活用移動平均線的技術分析。


    「葛蘭碧八大法則」注意移動平均線和股價的乖離方式與方向，是判斷股價未來行情的股票投資理論，特色是具有表示4個買進訊號和4個賣出訊號的8種模式。


    +   買進訊號有：


    +   ①移動平均線在一定程度的期間下降後變得平穩，或者稍微轉為上升基調的狀態，股價由下往上穿過移動平均線時。


    +   ②股價向下突破處於上升趨勢的移動平均線後，再度轉為上升時。


    +   ③雖然股價往移動平均線上方大幅乖離後下跌，不過沒有跌到移動平均線，再度上升時。'
  merge: -1
  img_proc: true
- pgno: 110
  md: '④股價在下跌基調的移動平均線下方，從移動平均線大幅往下方乖離時（期待自律反彈）。


    賣出訊號有：


    ⑤ 移動平均線在一定程度的期間上升後變得平穩，或者稍微轉為下跌基調的狀態，股價由上往下穿過移動平均線時。


    ⑥ 股價向上突破處於下降趨勢的移動平均線後，再度轉為下跌時。


    ⑦ 雖然股價往移動平均線下方大幅乖離後上升，不過沒有到達移動平均線，再度下跌時。


    ⑧ 股價在上升基調的移動平均線上方，從移動平均線大幅往上方乖離時（可能回跌）。


    因為是最普及的買賣技巧的法則，所以一定要記住。


    ![](img/300d6743e3871fdc0ea17875b15acce5_110_0.png)'
