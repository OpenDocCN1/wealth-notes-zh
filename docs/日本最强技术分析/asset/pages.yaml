- pgno: 38
  md: '或許大家感到意外，其實K線是在日本江戶時代誕生，起源於日本的傳統表示方法，這是日本原創！目前在海外也廣泛地使用。江戶時代的日本，糧食的期貨行市領先世界誕生發展，K線在這種背景下誕生。這是日本的先人創造出來的圖表，因此請自豪地活用吧。


    行市由買方和賣方各自接觸完成交易（買賣），並且形成各種形狀的K線。而K線有基本的形狀。就是「陽線」、「陰線」、「十字線」。


