- pgno: 112
  md: '# 葛蘭碧八大法則 8 個買賣重點


    # 買進訊號


    1. 移動平均線在有一定程度的期間下降後變得平穩，或者稍微轉為上升基調的狀態，股價由下往上穿過移動平均線時。


    3. 股價向下突破處於上升趨勢的移動平均線後，再度上升時。


    ![](img/300d6743e3871fdc0ea17875b15acce5_112_0.png)


    2. 雖然股價往移動平均線大幅正向乖離後下跌，不過沒有跌到移動平均線，再度上升時。


    4. 股價在下跌基調的移動平均線下方，大幅乖離時（可期待自律反彈）。


    # 賣出訊號


    8. 股價在上升基調的移動平均線上方，從移動平均線大幅乖離時（可能回跌）。


    6. 股價向上突破下降趨勢的移動平均線後，再度下跌時。


    ![](img/300d6743e3871fdc0ea17875b15acce5_112_1.png)


    7. 雖然股價往移動平均線下方大幅乖離後上升，不過沒有到達移動平均線，再度下跌時。


    5. 移動平均線在有一定程度的期間上升後變得平穩，或者稍微轉為下跌基調的狀態，股價由上往下穿過移動平均線時。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 藉由移動平均線加強行市預測力。


    技術分析中移動平均線和乖離率，在預測股價的趨勢轉換和高點與低點、買賣時機的基準時，會是強大的工具。不過，每天的成交額少、股價的變動率（波動率）大的公司股票在移動平均線也經常出現騙線，所以有時不適合套用。


    即便如此，如果學會活用移動平均線的方法，預測股市走勢圖和行市發展的能力將會顯著提升。自己製作K線圖、自己計算移動平均線的時代已經過去了。網路證券擁有的多功能走勢圖等工具，能輕易顯示技術指標的方便功能非常充實。活用這些工具，開始判斷行市的訓練時，移動平均線將是基礎。


    ![](img/300d6743e3871fdc0ea17875b15acce5_113_0.png)'
