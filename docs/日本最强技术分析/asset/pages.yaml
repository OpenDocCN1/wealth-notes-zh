- pgno: 107
  md: '![](img/300d6743e3871fdc0ea17875b15acce5_107_0.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_107_1.png)


    黄金交叉是指短期移動平均線（5日線、13週線）由下往上穿過中期、長期移動平均線（25日線、26週線）的場面。


    由於能看到最近的价格傾向轉為向上，所以一般被視為買進訊號，暗示行市趨勢進入上升局面。


    相比之下，死亡交叉是指短期移動平均線（5日線、13週線）由上往下穿過中期、長期移動平均線（25日線、26週線）的場面。


    死亡交叉被視為賣出訊號，暗示著進入行市的下跌局面。在海外叫做「Death Cross」。通常在短期移'
