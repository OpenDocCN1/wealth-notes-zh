- pgno: 157
  md: '# 日本製造的一目均衡表。


    「一目均衡表」這個名稱很獨特，有種復古的感覺呢。一目均衡表即使名稱古老，在技術分析卻擁有高知名度，受到廣泛活用。


    一目均衡表的理論完成於昭和時代初期。東京新聞的前身都新聞，有一位筆名為一目山人的幹部，和許多工作人員耗費數年歲月完成了這個行市分析手法。在日本國內的個人投資者之間也頗受歡迎，歐美也出版了一目均衡表的解說書，它也是受到許多基金經理人支持的技術手法。一目均衡表是因為行市能一目了然才如此命名。


    在技術指標之中，K線、移動平均線、布林通道等是以時間及時間順序作為分析要素，一目均衡表也納入這個群組。它以時間論、波動論、值幅觀測論（也叫做水準論）所構成，從作為段落的價格變化發生的日期計算特定的基本數值等日數，這是能預測將來變化日期的技術分析。


    這個觀點認為「行市在買方與賣方的均衡崩潰時會大幅變動」，根據的理論是「買賣勢力其中一方若能掌握優勢，就能一眼得知行市變動」。'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 3大要點的重要理論（時間論、波動論、值幅觀測論）。


    在具體說明一目均衡表之前，將簡單提一下時間論、波動論、值幅觀測論。


    一目均衡表中的時間論，是關於「基本數值」的觀點。


    在一目均衡表中，以9、17、26這3個為基本數值。時間論的特色是以這些基本數值為基礎，思考目前的狀態和在哪個時間會發生變化。例如，假設分析的日期是第25天，隔天第26天，可以想成容易發生趨勢轉換或趨勢強烈持續等的時機。


    波動論是根據價格變動所發生的波形和模式來分析行市。有3種基本波動，分別可以替換成英文字母的形狀。'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# ○ 一目均衡表的3種基本波動


    ![](img/300d6743e3871fdc0ea17875b15acce5_159_0.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_159_1.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_159_2.png)


    ① 只有上升、只有下跌的單向通行的線條是「I波動」


    ② 上升後下跌、下跌後上升，分別視為一組的「V波動」


    ③ 上升下跌再上升、下跌上升再下跌，分別為一組的「N波動」


    其中N波動是由I波動與V波動連續形成，上升的股價遲早會畫出N波動。下跌的股價畫出的N波動也一樣。這個N波動若未完成，上升局面與下跌局面便難以到來的想法將會成立。'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# POINT


    所有的波動都總括為**N波動**。


    可以想成**行情是以N字移動**。


    值幅觀測論（水準論）被用於預測股價的目標值時。代表性的型態有**4個計算值**，最受歡迎的是**V計算值**。


    描繪上升後轉為下跌趨向反彈的N波動時，從最初上升的最高點下降達到底價為止的下跌幅度翻倍上升，作為在反彈局面目標值的計算值。在股票市場經常聽到的「加倍奉還」，適用於這個V計算值。


    除了V計算值，還有用「N計算值」、「E計算值」、「NT計算值」預測目標值的計算值。全都以波動的「山頂」與「谷底」為起點。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# ○一目均衡表的値幅観測論 4 種型態


    ![](img/300d6743e3871fdc0ea17875b15acce5_161_0.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_161_1.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_161_2.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_161_3.png)


    一目均衡表要藉由 5 條線和 K 線分析。


    如此以時間論、波動論、值幅觀測論這 3 個理論為基本所構成的一目均衡表，基本的 5 條線是基準線、轉折線、2 條先行帶（先行帶 A、先行帶 B）、延遲線，在走勢分析會在這裡加上實線（股價
    K 線）。


    另外，被先行帶 A 和先行帶 B 這 2 條包圍的範圍叫做「雲帶」。雲帶被視為支撐帶和阻力帶，同時也是'
  merge: -1
  img_proc: true
- pgno: 162
  md: '一目均衡表的特徵。一目均衡表以這5條線和雲帶，

    以及K線描繪成一張走勢圖。


    # O 5 條線和雲帶與 K 線


    ![](img/300d6743e3871fdc0ea17875b15acce5_162_0.png)


    先來學習這5條線（line）分別具備的特色吧！


    「基準線」是由包含當日的過去26天的最高價與

    最低價相加後除以2算出的數值所形成。數值26是一

    目均衡表的基本數值，幾乎固定使用。過去26天的最

    高價與最低價的平均連起來的線，表示行市中期的方

    向。


    轉折線是過去9天的最高價與最低價相加後除以2

    的數值連接起來。數值9也和26同樣是一目均衡表的

    基本數值。表示行市的短期方向。'
  merge: -1
  img_proc: true
- pgno: 163
  md: '然後先行帶表示現在的市價變動會對將來帶來何種影響，使用先行帶A和先行帶B這2條線來表示。藉由不同的基本數值，先行帶A和先行帶B分別表示短中期趨勢和長期趨勢，能以這2條線掌握。


    +   ○ 一日均衡表的 5 條線的算式


    +   基準線 (包含當日的過去 26 天的最高價 + 最低價) ÷ 2


    +   轉折線 (包含當日的過去 9 天的最高價 + 最低價) ÷ 2


    +   先行帶A (轉折值 + 基準值) ÷ 2 預先顯示 26 天


    +   先行帶B (包含當日的過去 52 天的最高價 + 最低價) ÷ 2 預先顯示 26 天


    +   延遲帶 當日的收盤價延遲顯示 26 天


    先行帶A是導出基準線的基準值與導出轉折線的轉折值相加後除以2的數值，預先顯示26天的未來。也就是基準線與轉折線的平均值顯示26天後。另一方面先行帶B是，包含當日的過去52天的最高價與最低價相加後除以2的數值預先顯示26天。


    最後的「延遲線」（也稱為延遲帶）是，當日的收盤價延遲記在26天前畫出線條。當日的價格要與26天前的價格比較。延遲線在一日均衡表中也被視為最重要的要素。'
  merge: -1
  img_proc: true
- pgno: 164
  md: '一目均衡表藉由這些「基準線」、「轉折線」、「先行帶A」、「先行帶B」、「延遲帶」等5條線，和26與9等基本數值所成立。並且，基準線和轉折線分別暗示中期與短期的方向，至於2條先行帶在推測趨勢時發揮了重要的作用。


    ![](img/300d6743e3871fdc0ea17875b15acce5_164_0.png)


    # 一目均衡表的特徵「雲帶」是什麼？'
  merge: -1
  img_proc: true
- pgno: 165
  md: '一目均衡表的5條線之中被先行帶A和先行帶B包圍的範圍「雲帶」，它的存在也是一目均衡表的特色。這個雲帶是「阻力帶」、「支撐帶」。從雲帶的厚度、包夾雲帶的K線的位置等，可以測出行市的強弱。


    在開頭的漫畫中，上司部長、未咲與和流3人一起搭乘飛機前往札幌出差。偏巧天氣作怪，起飛後的飛機闖進雨雲中飛機內部搖晃，和流忍不住說「好可怕」並且眼眶泛淚。這時部長對和流說：「看到穿過雲層之後的景色，想必你會嚇一跳喔。」從穿過雲層的飛機窗口展開美麗的景色，和流突然態度一變，說自己「情緒飽滿」。


    換言之股價也是，表示向上突破阻力帶的雲帶後移動會變輕盈。一目均衡表是利用「雲帶」的交易，可以判斷向上突破雲帶時買進，向下突破雲帶時就賣出。'
  merge: -1
  img_proc: true
