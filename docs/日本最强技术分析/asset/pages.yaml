- pgno: 56
  md: '# 幸與不幸，總是輪流造訪。


    有個故事成語是「夫禍之與福兮，何異糾纏」。意思是禍（＝不幸）與福（＝幸福）就像纏繞製作 的繩索般輪流來訪。「塞翁失馬焉知非福」這個故事 成語也幾乎是相同意思呢。


    「人生有起有落」，有好的時候，也有不好的時 候。不只人生，關於日常生活、工作、身體狀況、心 理狀況或運氣等也可謂相同。事物必定有「波浪」。 有一天這樣短時間的波浪，也有一個月、一年、或者
    五年、十年這種長時間的波浪。一邊重複小波浪和 大波浪，一邊上升或下降。經濟和股票房市也有許多這 種波浪（＝週期），可活用於分析和投資。


    縱使人生走上坡，處於所向無敵的狀態，要是太 過得意忘形犯了一點錯誤，或是發生倒霉的事就會 感到沮喪，大家有過這種經驗嗎？人生在走上坡時也 能碰到小小的下跌波浪。其實，在股價也會發生同樣
    的情形。


    股價絕對不會完全不下跌，持續上漲，或是反過 來完全沒有反彈，持續下跌。此外，當然也不會完全'
  merge: -1
  img_proc: true
- pgno: 57
  md: '沒有起伏，持續維持同樣的價格。縱使長期來看大幅上升或下降，期間也會反覆上下波動。


    「趨勢線」是藉由掌握這樣上下波動的傾向，理解股價上升、下降的趨勢，活用於交易的技術分析方法之一。在這個單元，將會介紹根據趨勢線的技術分析方法。


    # 在技術分析的世界，超重要的「趨勢線」。


    不只技術分析的高手，就連幾乎不在意技術分析的投資者也會無意中盯著看，趨勢線就是如此重要的技術分析。它可以分成三種類型：畫出股價上下的波浪逐漸上升的「上升趨勢」，和同樣畫出上下的波浪逐漸下跌的「下降趨勢」，以及雖然上下波動卻在一定的線條內持續市價變動的「平穩趨勢」。


    在開頭的漫畫中提到的未咲的伙食費，花得較少時是一天800日圓、870日圓、890日圓，慢慢地增加。不僅如此，花得較多時是一天1200日圓、1250日圓、1270日圓，也是逐漸提高，整體而言伙食費逐日增加。換言之，這種情況下伙食費是「上升趨勢」'
  merge: -1
  img_proc: true
- pgno: 58
  md: '（對於想要設法控制支出的未咲來說，伙食費處於上升趨勢不是一件好事）。


    ![](img/300d6743e3871fdc0ea17875b15acce5_58_0.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_58_1.png)


    那麼，首先來檢視上升趨勢中的趨勢線。在上升趨勢畫出的上下波動的最高價部分（以未咲的伙食費來說就是 1,200日圓、1,250日圓、1,270日圓），用一條線連接起來就叫做「高價壓力線（壓力線）」，這是從暫時價格上升再度轉為下降的基準。在上升趨勢，上漲的波浪接近高價壓力線，或者在接觸時，股價傾向於容易回落。因此，上升到高價壓力線附近時可視為賣出的時機。


    那麼，首先來檢視上升趨勢中的趨勢線。在上升趨勢畫出的上下波動的最低價的部分（以未咲的伙食費來說就是800日圓、870日圓、890日圓），用一條線連接起來就叫做「低價支撐線（支撐線）」，這是從暫時價格下降再度轉為上升的基準。在上升趨勢，下跌的波浪接近低價支撐線，或者在接觸時，股價傾向於容易反彈。因此，下跌到低價支撐線附近時可視為買進的時機。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '○ 上升趨勢


    ![](img/300d6743e3871fdc0ea17875b15acce5_59_0.png)


    順帶一提，搭上上升趨勢買進叫做「順勢交易」。低價支撐線在推測順勢投資的買進時機時非常有效。


    上升趨勢中如果股價低於低價支撐線，就是趨勢轉換的預兆。會變成暗示上升趨勢結束的最初的訊號。


    如果用人生來比喻，工作順利，私生活也是，明明結婚等喜事臨門，卻因為生病或受傷等，齒輪開始往不好的方向轉動……大概像這種感覺吧。這種時候不要冒險，靜觀其變才是明智之舉。


    股票投資也是同理。持有的公司股票股價低於低價支撐線時，開始研究暫且拋售股票或許比較好。當然，光憑低價支撐線並不能完全掌握股價的趨勢。由此身體狀況（股價）突然恢復，回到原本上升趨勢的例子也是有的。它終究只是一個訊號。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# POINT


    在順勢投資注意連接上升中的最低價的低價支撐線！


    股價下跌接近這條線時，可判斷為買進的時機。


    # 藉由「高價阻力線」看清趨勢轉換。


    接下來，介紹下降趨勢時的例子。即使下降趨勢，除了極少部分，股價還是會畫出上下波動並且下跌。相對於上升趨勢時的低價支撐線，是連接一定期間市價變動的最低價所畫成，下降趨勢中的趨勢線是連接波浪高的部分——最高價所畫成。這稱為「高價阻力線（壓力線）」。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '在下降趨勢，即使股價一時反彈，到達高價阻力線後即有可能再度價格下降。另一方面，向上突破這條線持續反彈時，和低價支撐線的情形同樣是趨勢轉換的一個訊號。


    還有一種，雖然股價的趨勢形成波浪，概括地說卻是維持平穩的「平穩趨勢」。波浪高的部分和低的部分分別連接，市價變動維持在範圍內的狀態，也被稱為「箱型行情」、「區間市場」、「行情穩定」。在平穩趨勢，連接波浪高的部分的線是高價阻力線，連接波浪低的部分的線形成低價支撐線，向上突破（向下突破）這條線，果然也是轉為上升（下降）趨勢的訊號。


    ![](img/300d6743e3871fdc0ea17875b15acce5_61_0.png)


    ![](img/300d6743e3871fdc0ea17875b15acce5_61_1.png)'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# POINT


    下降趨勢中要確認連接最高價的高價阻力線！

    如果向上突破這裡，就有可能轉為上升趨勢。


    上升？下降？轉向某一方的「三角形態」。


    最後，要介紹應用平穩趨勢的趨勢線。它稱為「三角形態」，在股市走勢圖上經常出現。在日常生活中，好事和壞事也會輪流發生，有時會搞不懂到底是幸運還是倒霉。三角形態的情況和這個很相似。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# ○ 三角形態


    ![](img/300d6743e3871fdc0ea17875b15acce5_63_0.png)


    來看看實際的走勢圖。在以線條表示的部分股價持續著平穩的動向，不過上下波動漸漸變小，形狀變成三角形。這個狀態就是三角形態。在三角形態的狀態，愈接近三角形的尖端，便有愈容易發生趨勢轉換的傾向。


    在這個狀態，還不曉得會變成上升或下降哪個趨勢。股價極有可能向上突破連接最高價的高價阻力線，變成上升趨勢；或是向下突破連接最低價的低價支撐線，變成下降趨勢。


    三角形態不僅是整體行市頻繁地小幅度波動時常見的形態，也是比較簡單明瞭的趨勢轉換的訊號，因此請一定要記住。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '任何人都能輕易看出、畫出趨勢線。


    低價支撐線、高價阻力線和三角形態是許多投資者注意的趨勢轉換的分歧點。注意這個分歧點的投資者愈多，根據分歧點採取投資行動的投資者愈會增加，結果股價的市價變動愈容易依此變動。如果走勢圖能畫出鮮明的趨勢線，趨勢轉換的訊號也會因此提升有效度。


    如果能看到K線圖，任何人都能根據趨勢線進行分析。現在有許多工具能在實際的股市走勢圖上畫趨勢線，而且只要畫幾條線就好，因此作業上也不困難。要看清賣出、買進的時機時，建議嘗試自己畫線。


    > POINT'
  merge: -1
  img_proc: true
- pgno: 65
