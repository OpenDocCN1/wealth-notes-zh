- pgno: 220
  md: '# ◆ 股票投資，最重要的是心緒管理 ◆


    在投資股票的過程中，你會發現，心理狀態的管理是最重要的。認為買賣技巧最重要的人，往往是還沒有真正做過股票的人。現在想要學會買賣技巧，其實可說是隨處可得。由於社群網路蓬勃發展，在這個時代，我們能夠輕易掌握各種交易手法。但是在進行交易的過程中，你將真正了解到：比買賣技巧更重要的東西，就是心緒管理。


    有時候我們明知當下狀況不符合原則，卻還是會盲目買進，或是因為情緒動搖，而錯過了該出場的時機，於是淪落到被套牢的結果。這些都是包括在心緒管理的領域。


    我透過學習來解決心緒上的障礙。失敗的時候會更加認真的分析失敗時的線圖模式。通常，如果在投資中賠錢，人的情緒就會變得急躁，精神產生動搖，這時往往都會試著聽取別人的意見，或者是嘗試花錢來獲得推薦的明牌股票。但是這些最終都無濟於事，所以最終只能由本人多加學習。


    當你累積了各種有關股票的技巧和知識後，理性便能戰勝威脅，讓自己更有機會在瞬間做出最佳判斷。所以，我失敗時學習更加刻苦，而最需要注意的瞬間反而是在買賣順遂的時候。如前所述，在股票面前，總要保持一顆謹慎謙遜的心。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 持續與他人交流


    前面我們提到關於心緒管理的部分。一個人進行股票投資，總是

    非常孤獨和寂寞。如果不和同事或朋友談論股票，建議可在社群網路

    中活動。在我建立的社群裡，做股票的人也經常聚集在聊天室，單純

    的進行交談。當有人能夠提供指導，也有人會提供慰藉。透過不斷

    的交流，讓自己不被孤立的姿態非常重要。此外，能夠獲取多種資訊

    的管道也非常重要。我也一直努力讓自己不被孤立，致力於把自己的

    想法與人分享。


    我希望大家能夠健康而穩定地持續買賣股票。這本書中涉及的

    全部內容都是關於降低風險的實戰買賣方法。大部分人會被貪慾牽著

    鼻子走。然而，股市是充滿各種情緒的地方，如果不能控制住個人貪

    慾，任何人都無一例外的可能會失敗離場。


    在股市中失敗的程度，每個人各不相同，有的人可能賠進了一半

    的家產，有的人甚至是把退休金通通賠上了。股市就是如此可怕的地

    方。但可以肯定的是，股市也是有準備、有訓練的人能夠得以生存的

    地方。


    我希望透過這本書，讓進行股票投資的各位能夠變得更加堅強，

    領悟和學習正確的買賣方向。想要在市面上已經充斥著大量股票書籍

    的情況下出版新書，這讓我反覆思考，這本書中究竟應該包含哪些內

    容，才能真正幫助讀者。希望本書的內容，能夠讓大家認可我反覆思'
