  md: '# ◇ 從線圖中看出主力何在 ◇


    能夠左右線圖走勢的是主力，也就是股市中的巨額資金。如果對走勢圖有一點概念，就會不時看到「長期被鎖在箱子裡的股票突然暴漲又迅速暴跌」的現象，會造成這種現象的就是巨額資金的進出。股市中存在足以掌控運轉市場的勢力，這些勢力在製造個股漲跌的同時，目的也是賺取報酬。他們為了獲得想要的報酬所需要的過程，會表現


