- pgno: 181
  md: '當大多數人不感興趣的時候，就是指幾乎沒有人願意買入這檔股票。如果突然有人買進，那就是之前所說的，想透過製造暴漲來獲取報酬的主力，或是價值投資者這兩種。


    由於人們不關心，這類股票的變動性也很少，一天中股價急劇變動的可能性相當小，因為成交量少。如果不急功近利的話，可以買進這類股票。實際上喜歡這種底部線型的人還真不少，如果要買這類股票，最好利用波動性較弱的特點，趁股價低的時候提前買入吧。


    # ◆ 長期持平的股票，要睜大眼睛注意 ◆


    股價長期橫盤盤整，意味着經過兩～三年左右的時間，在沒有特定方向的情況下持續持平流動。像這樣股價持平的線圖，由於變動性較少，上班族也可以輕鬆的抓住時間進行買賣。


    股價持平的走勢流動意味著什麼？代表賣主與買主的攻防並不激烈，大部分後市大幅上漲的股票，在這樣的橫步期間可以積蓄力量。


    以下三個圖表都是在二、三年期間橫步盤整的股票。只有擁有這樣的盤整時間，後續走勢才可能蓄積能量後向上升。所以，身爲上班族，不必拘泥於波動性高的股票，卻苦於無法及時應對，而是應該放眼長遠，抓住前述的這類股票，進行長期投資。'
