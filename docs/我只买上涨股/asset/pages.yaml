  md: '![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_110_0.png)


    # 主力的訊號①

    走弱現象


    在主力結束收購後，股價正式上漲之前，我們來討論有關動向的問題。這像是像我這樣長期研究線圖的股民，基本上都知道的共同理論，希望各位也能好好學習。


    ◆ 上漲前，股價會先退一步 ◆


    股票在大漲之前，一定要經歷一個回檔整理的過程，這意味著盤勢即將下跌。股價下跌的理由可以理解為：持有大量股票的主力，為了低價買進，而故意拉低股價。


    一旦股價下跌，散戶們就會陷入恐懼心理，看到股價差不多了，預期再次下跌之前就會表現出急於拋售的傾向。這樣偏離支撐線往下'
  merge: -1
  img_proc: true
- pgno: 111
  md: '走，叫做股價走弱現象。對主力而言，透過這種股價走弱現象可以輕鬆收購股票。


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_111_0.png)


    # 股價上漲前出現走弱現象的線圖


    從以上線圖可以看出，在盤勢上漲之前跌破了支撐線。在這裡藍色的線條顯示為支撐線，短暫的暴跌之後，股價就不停的上漲，由此可以推斷，這是主力們試圖趕在股價上漲之前，趕走持有該股散戶的戰略。即使不從主力的角度來看，股價在上升之前發生走弱現象的情況也屢見'
