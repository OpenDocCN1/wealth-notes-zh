  md: '# 為甚麼會有在股市可以輕鬆賺錢的錯覺？


    生活在資本主義時代，大家感觸最深的一件事應該就是不容易賺到別人的錢。若問「有沒有容易賺錢的方法？」，周圍聽到的人可能會把你看作是傻子，嗤之以鼻吧。我也一樣，若聽到那種話也會有類似的反應，但在這裡我想問一個問題：各位認為在股市裡可以輕鬆賺到錢嗎？


    遺憾的是，的確有不少人認為在股市裡賺錢很容易。我從長期經營股票社群網站的經驗中發現，實際上很多人在股市交易經驗尚不到一年，手中資本卻已投入 50%以上。在對股市還沒有充足知識的情況下，以那樣的比例進行投資，風險實在是太高了。


    當然每個投資者都有各自的原因，有人覺得如果以較少的資金進場，即使獲得報酬也不會賺太多；有人則是當股市出現意料之外的跌幅時，很容易衝動產生趁機加碼的心理而追加投資；也有人為了降低買進金額，而探尋各種小道消息。如果你也和他们具有同樣的觀點，可能也會認為那些都是合理的判斷。


    # 投資股市先想到的不是獲利，而是虧損


    但是那些人忽略了一點，是什麼呢？就是「經驗」。就像剛開始踏入社會的新鮮人一樣，那些在股市沒有什麼投資經驗的初學者，很'
  merge: -1
  img_proc: true
