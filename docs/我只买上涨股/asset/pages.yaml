  md: '![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_207_0.png)


    # 朝向右上方的線圖


    向右上長上升的個股，至少已經持續上漲達六個月以上，具有一年內大幅上漲的特點。買進這樣的個股時，每當股價下跌時就買進，但並不是一下子投入一大筆錢大量買進，而是慢慢分批買進，管理比重。


    右上線圖是因持續進場的買進趨勢而形成的。線圖持續往右上方走，代表公司正穩定成長，表示沒有任何問題。每當價格下降時，買進這些公司的股票，便能降低買進單價，藉此獲得成本效益，不僅能培養出對買賣股票的信心，也能體會到股票整體走勢的原理。'
