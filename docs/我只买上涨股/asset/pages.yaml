- pgno: 213
  md: '如果反覆進行這樣的訓練，了解公司的性格後再看線圖，對分析會有很大的幫助。這時有需要注意的地方。在股市中，由於利多因素，經常會發生特定公司股價上漲的現象，這時候一定要確認線圖，分清這家公司是因為利多消息帶動股價大幅度上升，還是主力介入實現套利的區間。不管有多少利多消息，如果股價不能突破前高點，那麼股價很有可能直接跌停。


