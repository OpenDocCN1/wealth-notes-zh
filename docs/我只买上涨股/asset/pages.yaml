  md: '# 迅速確認必要的財務報表


    像這樣，公司的營收影響也會出現在線圖上，因此交易小型股時需要確認財務報表。但是，正如前面所說，沒有必要具體的一一檢視全部內容。只要檢查幾個必要項目，並避開經營惡化的公司就行了。


    那麼，下面就讓我們簡短介紹一下確認財務報表的方法。


    首先登錄入口網站naver所營運的「naver金融」。在搜尋欄中可以搜尋個股的名稱（編按：臺灣也有多家入口網站，提供股票相關資訊查詢，例如：奇摩股市或財報狗）。


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_168_0.png)


    搜尋自己想投資的公司，就會發現naver提供的相關公司資訊'
