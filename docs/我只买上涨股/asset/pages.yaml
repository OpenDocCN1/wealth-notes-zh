  md: '從以上三張線圖可以看出，當日K線貼近粉紅色的五日線之後，股價小幅上漲。像這樣在K線貼近五日線時買進，並在股價上漲的時機拋售獲利的技術，就是五日線買賣戰略。


    五日線買賣戰略從多種角度被廣泛應用為買進技術。究其原因，是因為開始搭上涨勢的個股在維持強勢趨勢的情況下，經常會在貼近五日線時，線圖立即出現明顯變動。


    在五日線上方大幅上揚的線圖存在很高的暴跌風險，相反的，貼近五日線移動的線圖，下跌率較低，相對來說比較穩定。重點在於股價突破壓力線後，攻占貼近五日線的線圖。那麼，在實戰中使用，一起來看看吧。


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_138_0.png)'
