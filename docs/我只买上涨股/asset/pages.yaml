  md: '礎，就能創造出很多屬於自己的買賣技巧。


    # ①漲停板買賣法


    這是利用股價達到漲停板之後產生的巨大變動性操作的手法，屬於短線買賣技法。漲停只有在強勁的利多因素刺激之下才會發生，一旦出現漲停板，很多投資人都會關注該個股，分析漲停的原因。一般來說，如果出現漲停的原因是併購、FDA
    的許可、政府發布政策支持等對公司方面的利多消息，那麼第二天股價繼續強勢上升的情況相當多。


    在前面的線圖中可以看到漲停發生之後，股價強勢上升，並持續兩天，出現飆升 20% 的狀況。


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_70_0.png)


    在漲停之後股價強勢上漲 20% 的線圖


    第 3 部 解讀主力股走勢圖，練就紮實的基本分析功力 091'
  merge: -1
  img_proc: true
- pgno: 71
  md: '像這樣伴隨強勢上漲達到漲停板之前，進場買進並獲得報酬的方法，投資人稱為「漲停板買進法」。簡單的說就是在股價幅度上限前買進，即在股價上漲至 30% 之前的
    28~29% 之間買進。。


    但是，如果出現買進後漲停板可能鬆動的跡象，則必須立即賣出。當然，要抓住這個時機並不容易。在達到漲停板之前買進，也是剎那間的時機之爭，因為在漲停板停止交易後，隨著拋售勢力的出現，漲停板被解除，再度重新開始交易，這時對再次漲停的期待心理就會減弱，拋售量也會大量湧現。


    這個方法具有快速報酬的期待值，卻也同時存在著巨大風險。漲停板結束後，甚至瞬間暴跌超過 10% 以上，這時你要承擔損失，並立即拋售。


    # ② 跌停板買進法


    這是與漲停板買進的反向技法。所謂跌停，以韓國股市來說就是指股價下跌至最低跌幅 -30%。跌停板買進法是預期在強勁的利多消息刺激下，股價有望繼續上行；在跌停板中，則是期待儘管是放出利空消息，但次日仍會出現股價上漲的情況。


    > 依韓國證券期貨交易所2015年規定，股價漲跌幅不得超過前一交易日收盤價之上下30%。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '這種現象如何解釋？其實很難準確說明。但可以肯定的是，股市就是個會打破常理的地方。我將跌停板買進法解釋為一種利用假跌破的技法，主力大戶們為了擺脫個人散戶，很可能會故意動搖當下的股票，製造出跌停板，是一種假跌破。


    也就是說，這個跌停是人為造成的，我們可以預期在短時日內股價會再次上漲。瞄準這一點，趁機買進以待後續上漲行情獲利，就是跌停板買進法。


    從下面線圖中所圈起來的部分可以看出，在跌停板出現之後，盤勢出現強勁反彈。此時，在跌停板買進股票的投資人，在之後短暫暴


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_72_0.png)'
