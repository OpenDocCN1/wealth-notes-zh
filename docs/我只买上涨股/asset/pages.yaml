  md: '# 看懂走勢圖，就能學會投資


    在對走勢圖進行分析之前，你是否懷疑自己、沒有自信？或者有「我做得到嗎？」的疑問？那麼我要先問大家，自己是是否認真想過，有沒有意志去做這件事？因為根據我的經驗，持續努力緊盯股票走勢圖的人當中，沒有不會投資股票的人。後續在第三部，我們會學習分析走勢圖的基本概念；在第四部中，學習如何掌握主力股獲利的核心模式，相信誰都能成為股市高手。


    # 做好虧損的覺悟，並用心學習


    不管是分析主力股或走勢圖，會讓人感到困難的原因還有一個，就是主力大戶們會為了阻止其他人獲取利益，而進行妨礙。他們會故意破壞走勢，讓走勢暴跌，蒙受損失，這種過程中，新手投資人通常很難撐下去，對分析走勢圖感到很迷茫，甚至會失去信心。以我的經驗能告訴大家的是，股票是「投資」，而不是「存款」，也就是必須要有會損失的覺悟。所以當遭遇損失時不需要氣餒，重要的是：要檢視造成損失的原因並修正，記取教訓以捲土重來。


    因為主力掌握著大量資金，等於掌握了主導權，但無論如何都是人在做事，模式並非無跡可循。遭遇損失也是一種學習，將自己所買賣的走勢圖做為經驗，並持續挑戰，會找出反覆出現的市場特性，最'
  merge: -1
  img_proc: true
