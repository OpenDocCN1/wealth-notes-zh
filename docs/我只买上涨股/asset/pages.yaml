  md: '![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_118_0.png)


    # 主力的訊號②

    收斂均線


    ◇ 關注減少的時候，是買進的最佳時機 ◇


    投資有著「不可能讓所有人都獲得報酬」的絕對規律。如果將該原理帶入線圖中，在所有人都買進的時候，我也跟著買進的話，失敗的機率會相當高。因為在大家都買進的時候，股價已經上漲了很多，接下來就是實現差價的拋售放量，股價下跌的機率更高。這像是自然規律一樣，投資人很難違背。


    那麼，能夠獲得報酬的投資時期是什麼時候？正是投資人的關注大減的時候。這個時期可以透過觀察線圖上的均線。是否出現收斂現象


    均線是指在五日、十日、二十日等一定期間內，按照股價走勢計算的均值，透過這個可以判斷走勢預測後續。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '來確認，簡稱為均線收斂。


    均線收斂是指各均線趨向集中的時候，一般五日線、十日線，

    二十日線、六十日線都可以利用。長期均線（例如一百二十日 均線）

    較少使用，在確認均線收斂時，不妨看五日到六十日均線即可。


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_119_0.png)


    # ## 均線相互疊加收斂'
  merge: -1
