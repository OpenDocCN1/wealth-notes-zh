- pgno: 76
  md: '突破買進則是相反的概念，是趁股票突破壓力線往上升時進行買賣的方式，通常股價在通過壓力線後，會帶來強勁的上升。利用這個原理進行買賣就是突破買賣。


    下面線圖上顯示的粉紅色線條是壓力線。突破買進手法是指從突破這條線的時點開始進行買進。


