    # ◇ STEP 2. 仔細觀察準備購入股票的企業基本面 ◇


    做為新手，要抱著學習的心態，在買進每個標的的同時，要了解相關企業做了哪些工作。在進行基本財務分析的同時，一定要確認想要收購的公司是什麼樣的公司，在市場上的競爭力如何。'
