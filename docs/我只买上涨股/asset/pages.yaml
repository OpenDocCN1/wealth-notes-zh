  md: '# ◇要確認成交量才能把握明確的買進時機◇


    不能因為均線收斂後就無條件買進，必須先仔細觀察成交量，雖然均線收斂了，如果成交量大，股票交易活躍的話，可能很難打破均衡。相反的，如果成交量低於平時，則可以視為適當的買進時機。


    下面看一下線圖，圈起來的部分可以發現五、十、二十、六十日均線已經全部收斂。同時從相關時期的成交量來看，近四個月以內的成交量中，成交量最低的時段與均線的收斂保持一致。這個時間點就


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_123_0.png)


    均線在收斂的同時，尋找成交量較低的時機'
