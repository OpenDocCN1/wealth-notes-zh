  md: '![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_210_0.png)


    # 報酬自動跟進，wazowski 的四階段買賣攻略


    首先向讀到這裡的讀者表示感谢。這本書結束前，我想簡單總結一下前面提到的股票投資買賣技巧。衝破險惡的主力股投資叢林，來到這個位置的各位，最後就是給您的小地圖。休息一段時間後想要找回感覺的話，就再讀讀這部分吧，相信會有很大的幫助。


    # ◇ STEP 1. 以布林通道與六十日線掌握市場走勢 ◇


    大家如果要買股票，就有必要確認目前市場的的局面。例如，在大量資金撤離之時，由於所有股票價格都在下跌，此時就沒有必要強行買賣，導致承擔風險。


    使用布林通道比較容易確認市場局面。請打開 KOSDAQ 日線線圖'
  merge: -1
  img_proc: true
- pgno: 211
  md: '![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_211_0.png)


    可以看到接近下限後暴漲的走勢


    中的布林通道指標，確認目前股價是否處在下限或上限的位置。


    正如前面所說，當日 K 線圖達到上限時，就會出現暴跌，觸及下

    限後，則可以看到急漲格局，由此可預測市場反彈區間。


    透過六十日線也可以把握大勢。六十日並不短，必須要有買盤或

    賣盤持續流入，才能讓六十日線的走勢形成明顯趨勢。'
