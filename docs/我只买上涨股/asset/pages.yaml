  md: '而，只要遵守我所告知的基準，就可以避免在主力倒貨時捲入，造成巨大損失的危險。


    # ◇從線圖和成交量中，找出買進時機◇


    其次，如果想在主力達到目標報酬率之前買進，要先懂得區分主力的媒介。收購是指一點一點的買進股票，如前面所說，由於主力是從收購階段以後開始，以股價上升 300%
    為目標，不先確認現在是否正在收購階段，就貿然把錢投在該個股上是不行的。那麼，該如何才能先看出主力正在收購呢？有兩種方法：


    +   ①長期橫向發展的走勢圖


    主力們為了掌握股價行情，會長期進行數量收購工作，以確保持有該公司的大部分股票。我們可以觀察，在線圖上維持一定價格並持續一年以上橫盤發展的股票，正是主力聚集所在。長期橫盤後大幅上漲
    300% 以上的個股，大部分都會先經歷一段長期的盤整區間（參考 104 頁）。


    +   ②爆發性的成交量


    時間拖得再長，也無法充分收購股票，這時主力會用各種方法嘗試大量收購，使得成交量爆發。什麼消息都沒有的股票，如果突然成'
