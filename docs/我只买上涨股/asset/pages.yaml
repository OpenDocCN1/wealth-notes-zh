    就像這些線圖所表示的一樣，先確認好前高點，再觀察是否有力突破，這點非常重要。一般情況下，突破壓力線的同時更新最高價時，買進勢頭強勁是基本。之後要關注線圖的動向，並貼在五日線進行交易。有的不貼五日線就直接上漲，有的連貼五日線都沒有就直接暴跌。因此，建議投資者親眼確認K線是否至少踩在五日線上。


