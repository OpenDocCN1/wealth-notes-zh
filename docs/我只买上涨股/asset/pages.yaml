  md: '# ◇ 突破缺口的當日走勢圖攻略 ◇


    突破缺口是指今日開盤價較前一交易日收盤大幅上揚。因為看起來間距大了，所以稱為放火（換個說法的話就是上升）。如果股價漲到前高點後出現這樣的巨大間距，那麼該股就有必要立即買進。


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_134_0.png)


    高點後產生缺口出現急漲


    第4部 將負報酬轉為正報酬的主力股實戰攻略 (135)'
  merge: -1
  img_proc: true
- pgno: 135
  md: '![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_135_0.png)


    # 看得見缺口的線圖範例


    一般來說，如果股票當天的開盤價格高於前一天的收盤價，代表該股具有利多因素。如果沒有利多消息，可以認為強大的買進勢頭介入其中。如果在此基礎上，股價又是突破前高點並出現缺口，就更有意義了。


    這類個股，不妨在股市開盤的上午立即買進。當然，最好是在股價還沒有走高，也就是在剛剛突破壓力線時，上午九點到九點十分之間買進比較合適。'
