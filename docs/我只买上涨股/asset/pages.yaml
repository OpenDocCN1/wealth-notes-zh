  md: '時候實在無需硬逼自己冒著風險或壓力進行股票買賣。


    # ◇ 不懂股市怎麼辦？先從模擬投資開始 ◇


    正如前面提到的，我剛開始投資股票時，並未投入很多資金，因為當時我對自己的判斷還不夠有信心，必須先承認自己對股市的認識還不夠。


    於是我親自去找了一位在股市中獲利很多的高手，他已經擁有一套屬於自己的交易系統，觀察他的模式並聆聽他的經驗分享，讓我意識到「必須有一套屬於自己的交易系統才能賺錢」，於便是先以「建立適合自己的交易系統」為目標。


    我決定從模擬投資開始，在實力經過充分的驗證之後，再慢慢增加現金比重。模擬投資是指用虛擬貨幣買賣實際市場中的股票，藉此觀察成果，流程和實戰投資系統是一樣的，差別在於錢是假的。想進行模擬投資，只要透過往來的證券公司申請即可，我在原本開立證券帳戶的KIWOOM
    證券公司申請，申請方法並不難，非常推薦各位能先親身體驗模擬投資（編號：在臺灣，許多平臺也提供相同的服務，例如CMoney 平臺的股市大富翁）。'
