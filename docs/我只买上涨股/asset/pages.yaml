- pgno: 66
  md: '# ◆ 供需原理是報酬的根源 ◆


    我要告訴大家的並不是什麼分析法，只是提醒大家供需的原理而已。只要清楚了解這個供需原理，就可以縮短研究股票的時間。相反的，如果不知道供需原理的話，只是累積許多雜亂的知識，實力卻未增強。我實際接觸過的股票高手中，沒有一個不把成交量當重點，甚至有些透過股票成為坐擁幾十億資產的高手，也指出分析走勢圖的首要基準就是供需。


    這就再次強調供需原理的重要性，如果要補充的話，把 K 線理論和成交量放在一起分析也很重要。萬一只知道 K 線理論，而不分析成交量的話，分析 K 線圖時的失敗機率就會增加。光只是花費心思努力研究
    K 線的意義，事實上是無法提高分析走勢圖的能力，如此一來，進行供需分析時也不會有成果。基礎實力的建立沒有捷徑，就是努力學習。'
  merge: -1
  img_proc: true
