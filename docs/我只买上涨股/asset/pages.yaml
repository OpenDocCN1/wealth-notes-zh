- pgno: 85
  md: '像上面的線圖一樣，在被壓制後下跌，然後股價觸頂，又再繼續上升的情況也時常發生。透過布林通道，雖然可以幫助我們掌握買賣的時機，但只靠單一指標還是很難完全掌握線圖所具有的變動性。


    這個意思就是說不能把布林通道當成絕對指標，但是如果研究過很多線圖，以「輔助」角色來說，布林通道仍然相當有幫助，能讓我們一眼就能掌握股票走勢圖的大致狀況。


    # ◆ 指標的作用，在於「輔助」線圖 ◆


    我們在這裡需要思考一下「輔助指標」的意義。輔助指標顧名思義就是「輔助」用的指標，在決定進行交易時不是主導的角色，而是輔助的功能，為什麼呢？如果要分析線圖就得一個一個找出
    K 線所代表的意義，而輔助指標的功能則是在於顯示宏觀層面的波動。


    我從來沒見過只靠輔助指標而成功的股市投資高手，也許有那樣的人，但根據我的經驗，對應每一根 K 線分析是股票買賣的基本，過於依賴顯示綜合價格的輔助指標，在進行較細部的選擇時難免容易出現錯誤。如果要使用輔助指標提高交易成功率，必須與細部的
    K 線分析一同併行。


    因為無法一一說明所有的輔助指標，在這裡我們只看布林通道，其他輔助指標與布林通道有很多類似的地方。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# ◆ 輔助指標，有助於確認動量 ◆


    輔助指標具有可以一眼就看出目前線圖上強勢和弱勢動量的功能，投資人若能親自分析運用會很有幫助。同時每個輔助指標都有各自的基本設置，可以依照自己的需求調整運用。


    要注意的是輔助指標是以後續性來解釋線圖，在第四部中，可以從多種觀點來思考運用輔助指標的線圖分析法。


    單一線點不具有後續性，但與輔助指標結合的型態足以預測盤勢。希望各位在看線圖時，能努力訓練自己達到可以發現相同模式的能力。越是有能力詳細觀察各種線圖，就能越快建立自信面對股市的挑戰。'
