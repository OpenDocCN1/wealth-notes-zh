  md: '了解這些概念，在買賣股票時便能保持鎮定，情緒就不會大起大落。主力們製造股價下跌現象的目的，是為收購股票，並給散戶投資人製造恐懼心理。要想克服這種恐懼，需要耐心等待和冷靜分析。


    一般在市價總額低於二千億元的小型公司中，經常出現這種被推測為主力介入的股價下跌現象和暴漲。而績優股的個股上漲現象很可能是「真的」，值得關注，了解這些基本概念，對股票買賣會有很大的幫助。'
