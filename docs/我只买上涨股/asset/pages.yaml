  md: '在下面的線圖中，上下兩條線包覆著 K 線的就是布林通道，以中間中心線為基準，上面是紅色、下面是藍色。在圈起來的部分，可以看到布林通道的間隔變窄。間隔變窄後，股價波動性增大，可以看到後續上下兩條線擴大，走勢飄移。


