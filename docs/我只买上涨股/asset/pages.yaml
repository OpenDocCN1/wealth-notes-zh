    ◇ 輔助指標可以幫助了解先行指標 ◇


    這次我們來談談線圖的輔助指標。一般而言，投資者常用的輔助指標像是籌碼分布圖、MACD（指數平滑異同均線）、一目均衡表、布林通道（Bollinger Bands）、隨機指標（Stochastic）、包絡線指標（Envelope）、RSI
    指標（相對強弱指標）等。


    我也是參考那些輔助指標來買賣股票，不過有人被輔助指標的魅力所吸引，只研究輔助指標，首先我要強調，完美的輔助指標不存在，因為從輔助指標來看線圖很難找到先行的訊息。當然這是我的個人意見。


