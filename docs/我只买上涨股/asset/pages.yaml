  md: '票的過程中，慢慢領悟。那麼要如何判斷市場是好是壞呢？我是看著KOSDAQ 來判斷的。


    # ◆ 為什麼要看 KOSDAQ？ ◆


    為什麼在 KOSPI 和 KOSDAQ 中，我們選擇分析 KOSDAQ（編按：韓國的創業板市場）呢？之前我們講述過的買賣技巧，是適用於二萬元以下的小型股的技術。比起
    KOSPI（編按：稱為韓國綜合市場指數，是韓國交易所的股票指數），這些技巧更適用於 KOSDAQ 市場的走勢，所以只要是二萬元以下的股票，最好分析一下 KOSDAQ
    線圖。那麼接下來就藉由 KOSDAQ 線圖，介紹幾種預測和分析市場趨勢的方法。


    # ◆ 以五日線與十日線的排列掌握大盤上漲行情 ◆


    下面我們以 KOSDAQ 日 K 線圖為基準進行分析。首先有一個方法，以五日線和十日線為基準進行分析，K 線位於五日線之上，意味著短線買進信心較強，接著在十日線上方站穩，則是買進心理具有持續性。


    右頁上端的線圖中，從圖圈顯示部分來看，日 K 線站上五日線和十日線。這種情況下，迎來短期上漲行情的可能性較大。


