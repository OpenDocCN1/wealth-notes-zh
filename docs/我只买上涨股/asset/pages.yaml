  md: '部拋售。這種投資者的心態是共通的，在線圖上，由於賣盤強勢，股價不容易上漲。那麼我們來看一下被視為往右上上漲的線圖（見左頁圖）。


    這個線圖看似趨勢傾向下滑，但從大趨勢看，價格是緩緩往上攀升，高於過去股票的價格，因此我們可以知道，這是往右上方向慢慢的移動的走勢圖，圈起來的部分可以看到均線收斂之後，股價有較明顯的往上上升。


    下圖是另一個走勢圖，越往右邊股價越高，是典型的右上型線圖。圈起來的部分顯示，在均線收斂後，出現大量買進成交量，我們可以


