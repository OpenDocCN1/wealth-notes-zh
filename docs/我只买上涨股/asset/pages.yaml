    # ◇財務報表只是輔助，重點仍應放在線圖分析◇


    就這樣簡單的看看財務報表，便可以避免買進不利因素導致股價暴跌的標的，投資於穩定的公司。歸根究柢，公司股價的上漲與其說是營收，不如說是營收增長的預期值，因此，簡單查看財務報表，關注相關公司的主題或題材也會有很大幫助，畢竟股價取決於心理。


    我認為，因為把重點放在線圖分析上，所以尋找被低估的線圖是更重要的。想要做好股票，就必須擺脫單純的思考，並分析在股價上漲中，發揮決定性作用的是什麼。我認為主力的動向才是發揮作用的因素，財務狀況只是參考而已，投資人還是應該將注意力集中於線圖。'
