  md: '起來，賣出勢頭就會強烈下壓，妨礙股價上漲。


    # ◆ 買盤與賣盤的角力 ◆


    在這裡稍作停頓，我先說明「賣盤起作用」的意思。股票買賣是投資者之間買賣的行為。投資者高價買進股票後，如果股價下跌，就會蒙受損失。像這樣蒙受損失的人增多的話，股價就不會上升。因為蒙受損失的人會拋售手中的股票。


    這時如果股價稍有上漲，他們就會為了減少損失而部分拋售或全


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_125_0.png)


    線圖右側可看到，自均線收斂後呈上升趨勢'
