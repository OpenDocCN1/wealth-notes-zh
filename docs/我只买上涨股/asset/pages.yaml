  md: "多都是尚未正確認識股市的殘酷現實前，就投入過多資金，最後有十之八九因賠本而黯然退場。\n\n  也有很多人即使知道現實殘酷，卻堅決相信那種情況不會發生在自己身上。這種錯誤的自信就像催眠一樣，不管旁人說得再多也聽不進去。\n\
    \n  沒錯，股市是如此的讓人著迷、可以輕易收服人心的神奇地方。但我們還是要認清，如果在統計和邏輯上我能夠輕易就賺到錢，那麼別人也同樣很容易就能獲得報酬。\n\
    \n  正如前面提到的，大部分投資者是在遭遇慘敗之後黯然離開股市，所以我認為在投資之前，應該先建立損失會大於獲利的心理建設，這才是比較理性、正確的態度。而且有了這樣的想法，就會慎重思考自己要投入多少比重的資金。\n\
    \n  儘管這種程序和思維方式是合理、正確的，但實際上依照這樣的判斷來進行買賣的人卻少之又少。在股票面前，人就像賭博一樣變得無限感性和衝動，在缺乏經驗和知識的情況下進行股票投資，就是一個殘酷賭注。\n\
    \n# ◇看懂線圖，就能持續從股市中獲利◇\n\n  大概在十年前，有個認識的朋友透過向其他投資人推薦投資標的，从中獲取報酬。還記得當時他對我說：「只要好好學習炒股，等你退"
  merge: -1
  img_proc: true
- pgno: 18
  md: '休後就能用一根手指賺錢。 」


    那句話至今還留在我的腦海裡，我也認為他的話是對的。只要資本主義市場存在，股市就會持續運作。即使世上一切都變了，股票的本質也不會變，對參與者沒有限制。人在上了年紀之後，勢必會從社會運作的主力成員中逐漸退出，在退休之後，我認為能夠持續獲得報酬的地方就是股市。


    當然，學習和熟悉股票的過程並不容易，不過，一旦對買賣模式達到某種程度的理解，並體現買賣的成敗後，股票就會成為你一生的好朋友。我花了五年時間才學會了現在的技巧，也許有人覺得時間好像不算長，但我比別人多了數倍努力，在整個股市、個股、線圖分析等各方面累積很多經驗。


    現在我在自己經營的股票社群網站中，也不時與大家分享訊息，其中很多人長期關注、並實際運用我所分享的方法進行投資，達到穩定的報酬。當然他們之所以能夠獲得報酬，除了從我這裡獲得資訊之外，最重要的是持續不間斷的學習，分析線圖及走勢，建立一套屬於自己的系統。


    我當然也會選擇報酬高的標的，希望得到高額的投資報酬率。如果我在股票市場中失敗了，今天就沒有資格在這裡告訴大家投資股市的心法，也沒有資格勸大家入場投資了吧？


    根據我的經驗，股市的各種線圖上肯定有答案，懂得研究並掌握線圖走勢的人，一定會有收穫。這就是我推薦大家投資股票的原因之


