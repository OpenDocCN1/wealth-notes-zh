- pgno: 113
  md: '持股不能賣。買進和賣出的量相似，才能維持盤整，以達成後續股價暴漲的目的。


    大資金離場，股價應該會下跌吧？此時，只有再買進市場中的股票，維持股價，才能在日後上漲時獲得更大的報酬。但主力們也會面臨資金壓力，不能繼續買進下跌的股票，因為這一點，如果想要使股價上漲，所有投資人都必須加在一起，不要隨意拋售股票。


    但如果沒有公司強有力的利多因素，要維持那種現象幾乎是不可能的，因此，主力們會刻意推動，為了穩定股價，還會買進被拋售的股票。雖然無法提供或找到正確的根據，但從情況上看，為了股價大幅上漲，中間不能有資金流出，需要穩定的主力大戶。因此股價下跌現象可以理解成是為了進行大量收購的先行步驟。那麼，要如何做才能真正攻克這種股價走弱的現象呢？


    # ◇ 股價走弱是真是假？觀察後續上漲速度就知道 ◇


    股價下跌現象可能是真的，也有可能是假的。真正的走弱現象是指在沒有主力介入的情況下，公司面臨不利因素或企業對投資人不再有吸引力，於是反覆拋售導致股價下跌。股票通常會一直持續下跌，所以沒買到好的個股，就會有遭受重大損失的危機。


    要區分股價下跌的真假，最好的方法就是觀察股價在走弱現象之後的表現。一般情況下，有主力介入的個股在走弱現象之後，股價很'
  merge: -1
  img_proc: true
- pgno: 114
  md: '快就會回穩。為了股價上漲，最終還是必須按照之前的價格買進，有主力介入的股票，最大特徵就是股價恢復速度比較快。


    ![](img/3dbf1f51314c3a19c9ed5613c1cf2e23_114_0.png)


