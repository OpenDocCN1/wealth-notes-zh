  md: '這種時期被稱為「多頭」，這時 KOSDAQ 指數不會打破五日線和十日線的黃金交叉，繼續保持穩定，大幅上漲。


    從前面線圖的圈標部分來看，在五日線和十日線形成黃金交叉後，可以確認股價大幅上漲。請記住，透過以上所說的簡單排列（黃金交叉），衡量市場的上漲局面後進行買賣。


    # ◇ 若六十日線的角度往右上，則走勢上漲 ◇


    這次我們來了解一下透過六十日線來掌握多頭行情的方法。六十日線被歸類為長期均線，對長時間觀察買進及賣出趨勢有很大的幫助。一般認為六十日線的角度是右上向的話，市場趨勢會上升。反之，如果是往右下方走，則說明行情已經進入下跌階段。


    六十日線可以當成是「是否要長期持有個股」，或者是「判斷是否需要早點出場離開」的好指標。只要善用六十日線，即使不立即決定買進或賣出，也可有效判斷個股目前是否處在適合長期持有的時期。做為參考用的
    KOSDAQ 市場，雖然受對外動向的影響較大，但並非是資本規模小的市場，所以應該認為，不存在著所有資金會在短期流出的情況。正因為這種特性，市場趨勢才能維持某種方向的持續性。


    但是，當資金流出或進入時，氣氛會變得非常活躍，一旦出現傾斜，就會朝著開始變動的方向移動。'
