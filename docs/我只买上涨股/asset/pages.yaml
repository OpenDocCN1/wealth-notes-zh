  md: '這次箭頭表示的位置更具體。先用紅色箭頭確認支撐線位置，之後再用藍色箭頭表示的位置進場即可。不僅是我，其他投資者也會這樣確認支撐線後買入，因為在支撐線附近買進，股價比較容易上漲。


