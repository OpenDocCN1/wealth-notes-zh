    # ◇ 如何迅速找出自己偏好的購買標的？ ◇


    想要快速找到自己喜歡的標的？例如，想收購只屬於 KOSPI 的股票，或者只想投資每股價格在五萬元以上的績優股，這時可以使用各證券公司系統支援的條件檢索引擎即可。


    每個證券公司都支持條件檢索引擎，甚至為初學者們特別提供更好懂的條件檢索引擎。所以不要因為困難而盲目放棄，請透過電話或留言板來諮詢，要求製作必要的條件檢索引擎。畢竟大家支付給證券公司的手續費，也包括對這些部分的支援。'
