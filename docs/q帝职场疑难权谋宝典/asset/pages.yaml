    学了很多权谋知识，然后明白了很多阴暗的手段，觉得人生处处是坑，对人与人之间的信任度愈加降低。人越来越孤僻。防备所有人，其实这就是从一个极端到另一个极端。亲信和多疑是一样的，都不会让你走向成功。人生路上不可能没有坑，所以不能因为坑，我们就不出门。人不能信任人，就不能结党，不能结党，就不会有成就，我们身边大部分人还都是普通人，所以，无需把所有人都想像成坏人，想像成高手。自己裹足不前，因噎废食。


