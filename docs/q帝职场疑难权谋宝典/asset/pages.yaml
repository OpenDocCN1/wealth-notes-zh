    # 在老同学手下打工，该如何调整关系？


    【困惑】老大我刚报了你的 vip 班，因为疫情失业，接受老同学的邀请加入他的公司，但是总感觉彼此的关系，不像以前那样顺畅了，初学权谋，知道要调整自己，但是不知道如何下手，希望老大解惑！


    【解析】这个问题很经典，同学关系变化成职场关系，这之间必然有个彼此适应的过程。主要是要做到下面三点调整：'
