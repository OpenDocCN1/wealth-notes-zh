  md: '你给了工资，难道人家就不要更多？如果给了更多，你觉得你能管得住别人？你下达的命令，他都会无条件的执行？如果对你不认可，和你拍桌子，你要不要开除他？如果你开除他，他会不会给你带来更大的破坏性，如果不开除，你做老板天天受气？你派下属出去搞采购，他自己私下搞回扣怎么办？不需要监督？他有了威望和能力以及资本，出去单干怎么办？其实这么幼稚的问题本来无须回复，但是很多基层员工也会这么想，你给我钱就行了，跟我谈什么文化？但凡这么想的，对组织、对资源、对方向都一无所知的底层螺丝钉，永远没有晋升的机会。只不过是这个问题比较奇葩，自己不是员工而是翻身做了小老板，位置变了，但是思维却没有变化，这样的组织，不出一年，就会被现实啪啪打脸。


    # 谈谈俞敏洪的二次创业！


    【困惑】老大，能讲解下新东方老总俞敏洪转行做直播电商，被经济日报批评的事情吗？特别想听下权谋角度的分析？


    【解析】安排。在 VIP 群里讲了两次课了，这次专门写篇文章给大家，因为这个具备创业典型的样板意义。


    俞敏洪的创业经历被拍成电影《中国式合伙人》，成了他事业的巅峰时期的标志，买了他几本传记看了之后，就没再关注，直到他在抖音上公然挑起两性之争的时候，我敏感的感觉到，他的事业进入了危机阶段，因为这种极端的言论，其实就是旨在吸引眼球用的，为什么一个上市公司的老大，需要这样博眼球出位，原因必然是流量的缺失，需要深度的营销，煽动舆论。如果事业在巅峰期，恐怕没时间，也不敢这样做，因为很可能造成舆论危机，导致股价下挫。我还在讲课的时候，专门分析了这件事情。


    果不其然，两年后的今天，俞敏洪在教培行业的整体衰败下，把八万套桌椅捐赠之后，直接转型到直播卖农产品了。我也在讲课的时候直接说，他'
