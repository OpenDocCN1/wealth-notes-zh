- pgno: 198
  md: '没提拔的动力。


    # 三、解决方法


    只有我们知道了问题所在，才能够去针对性的解决问题，有三种方案：


    # 1、转换门庭


    如果问题出在，领导亲戚这里。那么，就不要一棵树上吊死，忘了这个关系，积极的寻求新的靠山，转换门庭，尽可能的得到其他领导的提拔和重用。一个不能用的领导，就没有必要存在幻想了。


    # 2、提升素质


    如果问题出在自己这里，工作能力有限，经常需要有人擦屁股。或是人品有问题，反对的人多，这时候，就要积极地提升自己的做人做事的能力，让自己的水平能够使领导放心。


    # 3、加强利益


    如果领导对自己也不反感，自己混的也不差，那么问题就出在领导关系这里。因为每个人都是利益的个体，不会把权力平白无故的给别人，即使亲戚也不行，所以这就需要多送礼多走动。


    经过上述的分析，相信题主，或是有类似经历的朋友，都能够对比分析这类条件对号入座。只要能够对号入座，知道问题所在，就能够找到破解的答案。


    # 职场玩斗争，不怕死的快？——底层不懂斗争的三大原因！


    【困惑】后台留言：“职场还玩斗争，不怕死的快？”


    【解析】不少人看到权谋家写的职场斗争问题，都会发出这样的质疑和讽刺，其实我们很理解，有这样想法的人，一只只会啃草的肥羊，怎么知道狼吃肉的快乐呢？对斗争的冷嘲热讽，恰恰让他们沦为了食物链的最底层，他们之所以，不理解和排斥斗争，主要是这三点原因：'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# 1、阶层原因


    作为社会最底层，骨子里是惧怕斗争的，因为没有任何资源、没有任何能量、面对社会而来的压力，除了接受就是逃避，凡是斗争的人，大概率会被灭掉。所以古训里才留下了，“出头的楔子先烂，枪打出头鸟”之类的名言警句。这种为了自保的权宜之计，让最底层获得了一定的安全，但是长时间这种价值观的熏陶，让他们把手段当成了目的，变的不JT斗争，不敢出头。


    # 2、意识原因


    因为长达近两千年的儒家教育，“孔融让梨”的从小灌输，让大家对资源没有获取意识，保护意识。很多人，以为自己不得罪人，不争取利益，就能够独善其身，其实你的优秀本身可能就挡着别人的道，你不斗争，别人也会主动找你斗争。而且很多时候，你拥有了资源，却没有保护资源的意识，很快就会被人设陷阱，给掠夺走。有资源而不懂斗争，基本上就是待宰的肥猪。


    # 3、手段原因


    有些人明显的知道自己被人暗算了，被人排挤了，被人夺取了利益，但是除了心里不满，认为别人是小人之外，只能用不“不和小人计较”“清者自清”“恶有恶报”这样的话来安慰自己，因为从来没有学习和训练过，斗争的手段、斗争的策略和斗争的时机。不懂得如何争取维护自己的利益，有效的反击敌人，只能眼睁睁看着“小人得志”，自身怀才不遇，抱怨社会的不公平。


    所以很多人不懂斗争，骨子里就会惧怕斗争，认为，只有谦让才是美德，而斗争都是小人。而社会的真相，永远都是，资源稀缺，越往上，越是僧多粥少，通过自己对资源的增值，远没有掠夺来的快。因此，那些排斥斗争，不懂斗争，不善于斗争的人，都是社会的失败者，成为底层的哀嚎者！'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 和顶头上司撕破脸了，怎么反击？


    【困惑】老师，顶头上司一直针对我，这次再也气不过，和他当场争吵了起来，事后他扬言要报复我，我该如何的反击？


    【解析】这位同学，你先消消气，这个问题，如果我站在你的立场迎合你，和你一起骂几句上司，你肯定会很开心，但是这于事无补，因为，你找到我，肯定不是为了，发泄倾诉，而是为了找到解决方案，找到解决方案之前，我必须给你头上先来一盆凉水，让你清醒下，先扪心自问，“你凭啥？”


    1、你有什么筹码？


    我们就假想，现在就可以报复他，先分析下，我们拿什么工具报复他。你直接敢拿刀子捅他嘛，你肯定不敢，也会认为没有必要，自己没有必要犯罪啊。对的，我们违法的工具用不了，我们只能用合法的。我们合法的手段有什么？你的位置比他高？还是你的权力比他大？你的资源比他多？你的靠山比他硬？还是同事愿意为你出头？还是你的工作能力比他强？还是老板看重你？恩，你一样都不具备，除了你的脾气比他还大之外，毫无筹码，你想翻盘，凭什么？就凭自己心里不舒服？


    2、为什么这样子？


    看到了吗，你基本上没有解决问题的能力，权谋最讲究的就是，如果解决不了问题，那么就避免问题的发生。既然我们控制不住局面，那么就不让这样坏的局面发生，让一切都解决在萌芽状态。这就要问自己，702就和领导产生矛盾了呢？其实无非是三点，首先不懂权力心思，不能换位思考，不知道领导喜欢什么样的人，不能做到迎合。其次，个人能力不行，对自己的认知不清晰，不能看清楚自己在职场的位置，脾气要和能力相匹配的。最后个人修为不够，情商低，个人意识浓厚。职场谁让着你？


    3、为什么怎么办？'
