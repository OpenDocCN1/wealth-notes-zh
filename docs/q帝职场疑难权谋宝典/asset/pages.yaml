  md: '资源到能力，从势力到手腕，从组织到能量，作为上级对下级的胜算都是占比最高的，即使鱼死网破，作为下级，除了自己的情绪发泄之外，毫无实际利益。即使真的舍得一身剐要把皇帝拉下马，这也只是，损人不利己，为别人做嫁衣而已。


    # 2、克上最重要的是时机


    是不是说就没有任何可能扳倒上级呢，非也，只是说概率比较低而已。别说上级，就是推翻皇帝都不是新鲜事，何况上级？这里面其实，最重要的不是手段，而是时机，为了扳倒能量大、层级高、背景硬的人，我们就必须等，一直等到这些对上级有利的因素消失，等待他犯错，等待他得罪上级，等待他<|start|>怒众人，所以，我们在上司势力没有任何衰减的时候，千万不能动手，否则以卵击石。


    # 3、克上只能是输送弹药


    我们就这么傻傻的等，错了，我们从来都是积极地防御，而不是消极的，不断的收集领导的把柄，过错，不断的引导他得罪更多的人，不断的增强自己的能量。时机出现时，我们千万不能出面和领导对着干，一定要为别人输送弹药，这是克上唯一的权谋手段，其它的都不行，原因就是，一旦自己克上，即使赢了，其它的更高的领导，对犯上的，违背权力秩序的人，内心是很忌惮的。


    所以，我们之所以很少提及克上，就是因为这个需要等待时机，而且手段只能是为别人输送弹药，这个就不是普通人能够做到的。大家记住这样一个结论，明着挑战权力秩序的事情，下级不能做，这是官场大忌。上司之所以能被打倒，只有五种情况，他的上级讨厌，靠山倒了，派系斗争，自己犯罪，触犯众怒。因此，我们只能为这五种可能来临时，背后提供弹药，这是唯一的策略！'
