- pgno: 140
  md: '远的大于你在职场的委屈。职记住，职场不是德云社，没人为你的快乐负责！


    # 不爱喝酒怎么混职场？


    【困惑】q帝，最近新闻看到一篇新员工不喝领导敬酒被打耳光，事后那个领导被上级处分并且罚款了，现实中有些人就是不爱喝酒，这种事您怎么看？


    【解析】不仅仅很多人不爱喝酒，其实更多人，还不爱上班呢？还不愿意租房房子呢？哪有怎么样？无论是生活还是生存，在这个社会上想过的 needed，还要的舒服，没人管你爱不爱做，而是你要不要做，该不该做。因为，没有人能随随便便成功，每个成功的背后并不是风光，而是肮脏。


    你要好好想一想，喝酒和职场前途哪个重要。如果你觉得宁愿辞职，也要坚持不喝酒，只能敬你是一条汉子。你愿为自己的一己之私，不愿意肩负整个家庭的责任。家里的房贷，孩子的奶粉，父母的生活，都不及你不爱喝酒，这一个，个人喜好。


    但是我们如果真的心里有理想，身上有责任，想让自己爱的和爱自己的人，过上好的生活，那就必须忍辱负重，强颜欢笑，为了快速的获得领导的好感和信任，必须不断的调整自己，适应环境，只有这样，才能快速的积累，摆脱底层，当你自己成了领导了，你爱喝就喝，不喝，就不喝。那是你的权力，你有资格享受一切。而所享受的一切，都是曾经的痛苦换来的。哪个人的成功不是以损害自己的健康为代价的，长期的焦虑，饮食的不规律，到处的奔波，哪个比喝酒轻松？


    其实职场喝酒，尤其是上级，让下级喝酒，这背后所考验的并不是酒量，而是顺从。会不会喝酒，并不是重要的事情，重要的是听话。如果你日常都做的很听话，很顺从，还需要通过酒桌来测试吗？之所以采用酒桌这种'
