  md: '# 别想着回老家了，资源积累才是人生要义！


    【困惑】老大，因为深圳的房价太高，只能租房度日。我准备在攒着钱，等够了，在老家买套房子，以后回乡养老！这样的想法对吗？


    【解析】表面上这样做正确无比，其实这是一个非常错误的观念，主要原因有三点：


    # 1、资源的积累问题


    现在人与人之间比拼的，已经不是个人之间的努力和奋斗了，而是一代代人的持续努力。通俗点说，已经不是短跑的比赛，拼天赋和素质，而是漫长的接力赛，你的父辈给你交棒的时候晚了，你后续很难能够迎头赶上。而你如果本来在深圳努力跑了
    20 年，该给儿子交棒了，你却回去从零开始了。回到家乡依靠自己的那点退休金坐吃山空吗？通货膨胀能让你的积累持续生活几年？


    # 2、代际的亲密问题


    你一辈子不在深圳买房，孩子的读书怎么办？如果在老家读书，自己在大城市打拼，一年回家几次，孩子尽管是亲生的，但是彼此之间的感情基本是空白，也不能把自己的人生经验完全的传递给孩子，相当于让他完全散养，人生经验无法传递，孩子面对人生，还要自己去摸坑发展。如果跟随在深圳，倒是你回老家去了，他还要不要留下，如果留下，你的晚年又靠谁来照顾？


    # 3、地域的差别问题


    “故乡容不下肉身，他乡容不下灵魂！”这是很多打工者的心声，其实这是个伪命题，现在物流和信息的高速流动，对于地域的限制已经非常的小了，再小的县城都有亿万富翁，只是你能不能获取持续的资源的积累问题了。在小地方有资源，活得依然很滋润，在大城市，没有资源，依然会很'
  merge: -1
  img_proc: true
- pgno: 238
  md: '艰辛。资源在哪里，就在哪里奋斗。哪里都没有资源，就在大城市扎根，再苦也不回来。


    在哪里都是从零开始的话，就要抱着不回头的决心，在大城市，痛苦的积累，在一个地方持续的积累，在一个领域持续的积累，一代代人持续不断的积累。只要咬定青山不放松，不用太久，就能够实现自己的理想，买不起大房子就先买小的，买不起小的，就租最差的，尽快的识别资源，贴近资源，积累资源，转化资源，最大限度的把资金聚集到自己的手里，早日买房，安定下来，别再想着回去了。


    # 喜欢占小便宜的人，能不能提到领导岗位？


    【困惑】老大，我是小老板，手下几十号人，现在有个项目，要推进，有一个爱占小便宜的人，很积极，尽管有能力，但是我内心却不想用他，但是，其他人，都不怎么感兴趣，我该怎么办？


    【解析】其实小公司都是如此，没有太强的平台吸引力，自然就不能够吸引到能力和素质都强的完美人才，能来的，都是歪瓜裂枣，将就着用的人，这也是小公司的人才现状，短时间基本上无法改变。如何驾驭有缺点的人才，基本上成了做小老板的入门课，通常而言，有三大原则：


    +   1、优先度


    首先做老板，要明白自己的组织是来干嘛的，现阶段的任务是什么。尤其是小老板，主要的目的还是赚钱，是推动公司的发展，能为公司主动创造价值的人，才是公司要重用的人，至于道德水准，个人素质，都不是优先考虑的。如果只把关注点放在缺点上，对组织的伤害上，基本来说，公司不会发展。等公司发达了，有了更多的接近完美的人才，再逐步的替换。当下，先完成阶段性任务。


    +   2、接纳度'
  merge: -1
  img_proc: true
- pgno: 239
  md: '对于品行不好的人，是不是我们就能放手使用了呢，也不尽然。因为毕竟公司是个组织，还需要照顾到组织其他成员的认知。很多时候，“民意”还是很关键的，这个涉及团队整体的风气和积极性，以及权力导向的问题。所以，一定程度上还是要照顾到大家对这个缺点人才的接纳度。这个可以通过老板挂名项目组一把手，实际让缺点员工主持工作，来平衡民意，或者是舆论。


    # 3、忠诚度


    当然了，所有的缺点都可以有，各种小毛病都可以有，但是，唯一不能缺少的就是忠诚度，忠诚度表现为和老板的配合度。这段尽管放在最后一点，其实在大多数领导心里是排在第一位的。因为其他的缺点都可以通过手段平衡，或是未来后续监督，或是监控，但是唯独忠诚度这个点是无法纠正的。所以，一个组织，谁能忠诚的达成组织目标，就优先提拔他到领导岗位上来。


    最后，需要说明的是，在组织面临生存危机的时候，忠诚度放在第一，避免有人落井下石，卖友投敌，背后捅刀子。但是如果组织面临的是发展问题的话，这时候，把忠诚度放在第三位，也是可以的。只要缺点可控，就能够使用。所以，作为老板认清楚自己的组织所在的阶段，人才的项目推进能力，以及缺点的控制程度，把握好这些，就能够明白该如何使用有缺点的人了。


    # 初入职场如何锤炼自己的领导力？


    【困惑】老师，我是职场小白，看了咱们这么多的权谋文章，想问个入门幼稚的问题，你别生气，我也想成为领导，我该如何提升自己的这方面的领导能力，我该从何下手？'
  merge: -1
  img_proc: true
- pgno: 240
  md: '【解析】之前写过太多的如何攀爬的文章，对自身的领导力的提升的确涉及较少，想成为一个领导者，必须在这三方面下手提升能力：


    # 1、提升判断决策的能力


    作为领导，主要工作就是做决策，这可以说是领导的核心竞争所在。因为这里面涉及未知的准确判断和必须承担以此带来的风险，看似简单的拍板，其实需要太多的智慧。所以，刚入职场，要学会强者代入，出现问题了，自己在内心想想，领导会如何决策，他会如何做。然后对比领导真实的处理方法，自己的方案寻找差距，如果领导决策出现问题，自己总结教训。总结不出来，就主动查找相应的书籍，或是请教管理高人，来寻找方案，长期训练，就能快速形成领导决策型思维。


    # 2、协调处理关系的能力


    自己做出决策之后，明确了组织的方向，这时候，就必须落实目标或是处理内外矛盾。落实目标和处理内外矛盾主要的策略就是处理好人际关系，因为，落实目标，就要把各类不同性格、不同能力、不同背景的人组织起来，形成合力。这个形成合力的过程，就要学会和各类人打交道。把不同人为了目标组织起来之后，这些不同类人之间的合作，肯定有矛盾，这时候，作为领导者，还要不断的处理内部的矛盾，减少内部的消耗和摩擦。这就需要集合人性的优点，排除人性的矛盾。


    # 3、精通全面业务的能力


    作为普通人，都是不断的提升自己在某个技术上的能力，而不是通盘的能力。而作为领导者，不仅仅熟悉具体的工作知识，还要熟悉前端的知识，还要熟悉后方的知识，这就意味着，从产品到营销，从进材料到商品合格，从行政事务到商业谈判，从技术研发到售后服务，从内部招聘到政商关系，都要不断的学习这些知识，懂得越多，越能够建立起大局观，越能够弥补自己的缺陷，因为领导都是通才，全才，而不是专才，专才永远都不会走向一把手的领导岗位。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '最后，作为不懂得职场规律的打工人，会把精通业务能力放在第一位，然后按照自己的喜好去处理人际关系，不在其位不谋其政，不提前学习权力和管理。等熬到领导岗位了，再去思考如何决策管理的问题。这看似有道理，其实这是差的职场规划，因为，你不熟悉领导的决策风格，就很难体现布局，就很难提前准备自己的工作，来适应领导的需求，不能为领导的决策精准配合，怎么可能被快速提拔呢，而自己只和臭味相投的人交往，怎么可能不被攻击，背后设绊子呢？因此，作为有心想成为领导的人，一定要从上述三个方面，不断的加强自己的价值提升。只有这样，才能快速的走向领导岗位。


    # 我被领导利用了，我要不要搞他？


    【困惑】老师，我被领导利用了，被他的虚假暗示所骗，我为他做了很多事，今天公布的人事任命却不是我，我要不要到处说他是骗子？


    【解析】息怒这位兄弟，你的心情我能理解，但是我还是劝你，先不要冲动。因为你的冲动，非但不能解决问题，反而会让你失去更多，你应该吸取教训，我们现在从权谋角度做一下分析，让你理解权谋家是怎么计算这件事情的：


    1、为什么不能声张


    原因很简单，声张不但不能挽回现在的局面，反而可能失去潜在的补偿机会。尽管这种被领导利用的屡见不鲜，但是一般而言，高明的领导不会把事情做绝，肆意的利用下属，却不给补偿，或者安抚，以后就没有人为他服务了。所以，先忍住情绪，说不定他内心有亏欠感，会从其他角度对你偿还的。


    2、为什么不能施压'
  merge: -1
  img_proc: true
- pgno: 242
  md: '因为你的到处声张行为，会被领导理解为是施压，因为施压的情况，大概 率的适得其反，背后的权力心思是，施压是破坏领导名誉，而名誉又关系 到领导权威，触及到领导权威，这是领导最不能容忍的，领导最大的可能
    做 法是怀恨在心，找机会伺机报复，不但无法得到补偿，还会被划归对手 之列。


    # 3、为什么不能诉苦


    你如果到处给同事诉苦，到处嘻嘻别人利用了，非但得不到同情，反而沦 为笑柄，大家会幸灾乐祸的到处传播你的暸蠢，会认为你是罪有应得，过 分<|start|>ati
    也得不到的惩罚，这样你不但不会得到同情，还会使自己暴露于种种 猜测和非法之中。权衡利弊，还是尽可能的让自己先忍下来。


    那我们该怎么做呢？如果你只有一次利用价值，使用之后被抛弃，太正常 了，只能忍住之后，不断的增加自己的筹码，你的价值越大，领导就越不 能忽视你，他就会想办法调动你的积极性。当他再次需要你来解决新问题
    时，就会偿还之前的债务了。吸取经验教训，不要为所谓的暗示所迷惑， 因为你拿不出什么确实有效的证据当做把柄。以后尽可能避免这种情况出 现，不在同一个地方跌倒两次。


    # 遇见这三类人，权谋家也只能回避，无法竞争！


    【困惑】老师，因为在公司竞争失败，辗转找到咱们“权谋智慧”公众号， 感觉发现了新天地，以前自己太幼稚了。自己太单纯，以为凭借自己的努 力和业绩就能升职，后来发现输给了对方的送礼上，这事情我做不出来，
    但是我又怕类似的情况出现，老师，如何不送礼，能够赢得竞争？有方法 吗？'
  merge: -1
  img_proc: true
- pgno: 243
  md: '【解析】其实，领导能够收礼还是最简单的事情，因为，就是钱和价值观的事，权谋不仅仅是进攻，回避也是重要策略！如果遇到另外三种情况，权谋家也是直接放弃竞争，必须回避的：


    # 1、献媚的“裙带关系”竞争者


    裙带关系一直是职场无法回避的问题，裙带式安插，裙带式提拔，尽管有回避制度，交叉式安排基本上屡见不鲜。如果领导为了照顾关系，尤其是还想利用这种关系，巩固自己地位的时候，你与这样的人竞争，基本没有胜算，所以遇见有裙带关系还会献媚的，最佳的策略就是回避！


    # 2、强势的“资源丰厚”竞争者


    进入职场，大家其实并不是一个起点上，展开竞争，有些人并不是表面的那种只会干活，而是拥有深厚的资源，比如强大的社会人脉，通达的运作能力，这样的人，有时候尽管毫无贡献，但是关键时候，能够为领导带来巨大的便利，与这样的人竞争，基本上可赢的维度太少。


    # 3、异性的“卖弄风骚”竞争者


    性的话题，在职场，古今中外都是无法绕过去的话题，如果领导喜欢美女，而你的形象并不出众，出于自己的嫉妒和愤恨的心理，非要来个你死我活的竞争，其实这是再愚蠢不过的事情了。而且当拥有容貌优势的异性，还善于利用性方面的力量来竞争，你能做的就是退出。


    权谋是一种算法，依照价值观的方向，资源的支持，时机的把握，来决定进退的学问。类似于这种，领导贪财，而你的价值观又不允许你这样做，你只能放弃，而放弃也是权谋手段之一，因为权谋不仅仅是进攻，回避同时也是方法之一。所以，以你的性格，要么换自己的价值观，要么换领导，只能二选一。'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 感觉很多事情无法控制，这个正常吗？


    【困惑】老大跟随你，学习多年，忽然感觉到很多事情，其实根本无法控制，这是正常现象吗？


    【解析】权谋和任何的知识与技能一样，只能在自己的领域内解决问题，超出领域范围，也是无能为力。就好比，我们做出了各种妥协，但是依然无法组织美国对我们的贸易战。我们为了他们的疫情，做出了各种付出，依然无法缓解西方对我们的敌意。有时候，国家这么大的资源和力量都无法做到全面控制，何况是个个人呢。我们作为权谋家追求的不是控制一切，而是明白当下局面，做出利益最大化的选择。为什么会感觉到无法控制呢？原因有三点：


    # 1、资源问题


    首先就是资源问题，我们知道投资买房是大概率稳赚不赔的，但是我们没有钱，只能无能为力，我们知道芯片被西方卡脖子，但是我们却没有足够的资源，短时间研发出来。所以，知道是一回事，能够有足够的资源支撑是另外一回事，巧妇难为无米之炊。


    # 2、时机问题


    有种子、有化肥、有土地、有水源、有高明的农夫，我们能不能种出小麦的呢，第一眼，看到这样的选项觉得是可以的，但是如果时机不对，比如外部的环境是大雪纷飞，做事情，势必事倍功半。花费大量的努力和心思，未必有好的结果。用大棚种粮食，绝对亏死。


    # 3、信息问题


    信息的收集是个大的学问，不同的渠道，不同的传递对象，传递的时机，都可能对信息的真实性产生误差。既有主观原因，也有客观原因。主观是因为自己的分析判断能力、接受能力、当时的心情等，都可能有影响。客'
  merge: -1
  img_proc: true
- pgno: 245
  md: '观就是传递信息，无法全部无缝复制，错误的信息或是信息不足，无法控制。


    # 4、文化问题


    不同文化之间的差异很大，可以说基本上达到了生殖隔离的程度。你认为好的东西，别人可能很讨厌，你认为很坏的东西，人家却视若甘霖。所以，因为文化差异很大，我们站在自己的角度去做的事情，别人未必喜欢。比如我们送口罩给印度，却被认为是外交宣传，找谁说理去呢？


    # 5、执行问题


    任何事情最终是要落地的，这就是需要执行，而在执行的过程中，不可能 soát封闭的空间，做道题那么简单，而是要牵扯到方方面面的人，而这些人背后的变量太多，今天和你称兄道弟，明天因为你的对手背后中伤，可能立马翻脸成为仇人。所以，执行中的利益变量更是无法把控的。


    所以，我们面对很多事情，无能为力很正常，我们要不断地提升自己的能力能量，让自己更大概率的接近自己的目标，而不是消极放弃，只有这样，我们才能够大概率的过得更好。这也就是我们传统老话说的，尽人事，听天命。时来天地皆同力，运去英雄不自由。很多事，问心无愧就行了。


    # 新领导一开始和我称兄道弟，现在忽然间冷落了，什么情况？


    【困惑】老师，我有件事，心理很不舒服，尽管看咱们的权谋智慧公众号这么久，可现在还是看不透，我领导是什么样的人，请指点。事情是这样的：年初时候我们来了一个新领导，他对我特别谦虚和蔼，很多事情都向我询问，我自己有什么错，他也表现出温和和大度，而且很多决策行为也会在实施之前征求我的意见，渐渐的我们俩无所不谈，可是近来领导的态度完全变了样，不再单独和我相处，不再向我咨询各种公司的问题，更不'
  merge: -1
  img_proc: true
- pgno: 246
  md: '会和我有什么往来，还有一次当众指责我的不是，他像变了个人似的。这到底什么情况？


    【解析】没什么不明白的，“教会徒弟，饿死师父”而已，你对领导而言，失去了利用价值。其实，这就是新领导上位，开展工作的常用手法，很多

    人没做过领导，不知道罢了：


    +   1、通过私人感情，迅速熟悉情况。


    一个领导走马上任一个新的岗位，眼前一抹黑，必须迅速的熟悉工作，这时候，最快速的办法，不是听取报告，而是和一个情感细腻的员工，建立私交，快速的就能熟悉组织的核心关键，内部派系，人事关系，以往事情，而你就是领导熟悉新岗位的垫脚石。


    +   2、故意交往冷落，树立领导权威。


    通过几个月的时间，领导迅速的掌握了组织的各种信息，这时候，你的使命就完成了。他就必须端起架子，拿出领导的样子。领导不是你的朋友，他现在必须通过冷落你，传递信号，你们之间的蜜月期结束了，他回归到了领导的身份，必须剔除感情，树立权威。


    +   3、当众敲打批评，调整上下关系。


    但是领导通过冷落，让你明白自己的身份是下属，而不是朋友，但是你却没有及时的调整自己的心理和行为。还是想和以前样，所以，领导必须当众找机会，对你进行敲打。暗示你，你们之间就是最为普通的上下级关系，提醒你，明白自己的身份和职位。


    基本上成熟的领导，都是这样快速的熟悉工作，开展工作的。明白了这样的套路，也就不要有什么不舒服了，毕竟你们之间有过交往，面对权谋型的领导，你现在恪守自己的身份就行了，接下来，保持缄默，最忌讳用朋友的身份去质问，你就当是一场好梦。不然，你还可能被过河拆桥。'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 没有升迁机会怎么办？


    【困惑】老师，我和上级搞的关系也很好，自己能力也比较强，但是上级和我年龄相仿，也很年轻和有能力，我一直找不到升迁的机会，很郁闷，怎么办？


    【解析】一个萝卜一个坑，很多职场都是如此，没有职位的空缺，想升迁就只能熬着，拼时间精力，这本身也是一种没办法的办法。但是从权谋角度来说，也不是完全无解，通常都是从三个方面下手的：


    # 1、让上司走人


    自己想升迁，必须让上司空出位置。这里通常有两种方法，一个是通过不断的努力为他塑造政绩，让他升迁，自己随之顶替这个位置。另外一个方法，就是通过不断的假装友好的接近他，获得信任，这样能够掌握到他的核心秘密，一旦有了核心秘密，就有可能找机会绊倒他，让他灰溜溜走人。当然，这些材料，最好的方法是通过第三方抛出，这样自己不会引火烧身。


    # 2、调取新岗位


    如果位置比较少，上升机会比较少，上司可能挪动的机会为零，这时候，就必须把目光放眼全局，看看本单位，哪个位置自己有可能获得，这里也有两个方法，第一个就是在既有的岗位下手，看看哪个自己能够攻下来，及时的调整自己的主攻方向和专业方向。第二个方法，就是自己学习新技术，不断的积累新的资源，争取上级设置新的部门，有了新的部门，自己调任后自然升迁。


    # 3、自己跳槽走


    如果自己搬不走上司，本单位其他岗位也没有什么机会，升迁无望，这个时候，就要在学会本单位的所有知识和技能之后，果断跳槽了。因为我们'
  merge: -1
  img_proc: true
- pgno: 248
  md: '的职场生涯和时间是有限的，自己掌握了足够的知识和技能之后，就要果断的跳槽到领导岗位。宁可低薪水，也要先把级别升上去。跳槽当然也有两种方法，一个是往上走，自己不具备太强的复合素质，就找大平台。往下走，如果有复合能力，就找创业公司。

    不过最简单有效的方法，就是让领导走人，自己接替他的位置，最近又不少朋友爆出，他们偷偷的，替自己的上司，往猎头那里投简历，有了巨大的诱惑力，有人把上司挖走，也归类于第一种办法。不过如果不是国有的或是事业的单位，我们就能不能浪费太多的时间，如果一旦一两年内无法完成升迁，那么就必须想办法，调动，不然年龄过线了，以后机会会越来越少，要未雨绸缪！


    # 做领导，被下属误解是一种常态！因为这背后有五大原因！


    【困惑】Q哥，学了咱们的权谋有两年时间了，最近也升职成了领导，但是并没有想象的快乐，反而多了很多烦恼，原本关系好的同事，变成了下属之后，对我都不像之前那么友好了。一开始我还找机会做下解释，后来发现也没有什么效果，这究竟是怎么回事？


    【解析】其实，作为领导，被下属误解，是一种常态。因为阶段变了，你不再是他们其中的一员。正所谓圈子不同不必强融，也就是这个意思。职场不是来交朋友的，你成了管理层，就要学会和同僚交往，形成新的圈子。不过这里我还是要给你说明，为什么做领导会被下属误解，因为这背后有五大原因：


    +   1、利益期待不被支持


    作为领导和下属的利益，是不完全一致的，下属只考虑自身利益就行了，而作为领导需要考虑的利益就相应的比较复杂，要维护好方方面面，这就'
  merge: -1
  img_proc: true
- pgno: 249
  md: '不可能，对下属的利益完全支持，因为下属的利益期待没有被满足，自然就会内心不舒服，从而对领导不满。


    # 2、被人戴上有色眼镜


    很多人天然的对领导有恐惧感，不愿意主动接近，如果不是领导喊，没有人愿意主动去领导办公室汇报工作。但是对领导本人的信息，又十分的好奇，所以，各种八卦信息，就会填充这个空间。于是，关于领导的各种新闻，满天飞。导致了，大家对领导的误解。


    # 3、个人情绪好恶影响


    因为人都不完全理性的，很容易情绪化。对领导的各种言行，稍微触碰到自身的既得利益，就会立即不满，而这种不满，作为底层的人恰恰不会掩饰，会立即有情绪或是背后传播，更有甚者当场发脾气反击，让领导无法下台，所以，情绪化的属下，让领导压力巨大。


    # 4、对领导的完美期待


    很多人在学校课本里，社会的宣传里，别人的嘴巴里，对领导有个完美化，理想化的期待，觉得他们就不该是普通人，但是现实中的领导，和自己的认知相反，有着这样那样的毛病，这样那样的缺点，很多时候，觉得还不如自己，想法有落差，就会领导看不起，从而不满。


    # 5、价值维度差距很大


    员工和管理层有着天然的思维鸿沟，那就是巨大的价值观差异，管理者和被管理者，思考的角度方向，都不一样，因为员工只考虑单一维度的东西，做好自己的本质工作即可，但是作为领导需要考虑更多维度的东西，比如升职，作为员工能力强就行，而领导还要考虑忠诚度、入职时间等。


    所以，因为上述的五大原因，领导被误解，基本上是正常现象，所以，也就不要纠结了，学好权谋，做好权力该做的事情，不断的寻找靠山，提拔媚系，打击对手，为自己谋取更多的利益就够了，别天天想着求取员工的认同和理解，这基本上就是走错了方向。《道德经》里说“受国之垢，是'
  merge: -1
  img_proc: true
- pgno: 250
  md: '谓社稷主；受国不祥，是为天下王。”意思是说，做领导都是委屈里长大的。


    # 权谋家都是喜怒不形于色吗？


    【困惑】老师，权谋家是不是都是喜怒不形于色？都是不表达情绪？


    【解析】权谋家对情绪的观点只有一个，那就是控制情绪，而不被情绪所控制。下面 detailed 分析下：


    # 1、低级是被情绪控制


    越是底层，越是动物性极强，完全利用自身情绪来指导行动的人，高兴了就笑，悲伤了就哭，不舒服了就发脾气。这很容易让高人控制，因为一个人的情绪密码一旦被人掌控，就很容易被人点击开关，进而自觉不自觉地被人驾驭。所以，一个无法控制自己情绪的人，都会被人看透和利用。


    # 2、中级是修饰情绪化


    有些人因为情绪外漏被人看透，内心被人一览无余，于是吃亏多了，就不敢有所表露。这就进入了第二个阶段，那就是修饰自己的情绪，不再随意的发笑，也不敢随意的发脾气，处处小心甚微。这样的人，通常被认为是
    有城府，但是有城府的人，会让人感到危险，进而拥有防备心，被人排斥。


    # 3、高级善于利用情绪


    如何让自己看起来像个正常人，又不自我暴露？权谋家不会任由情绪化表达自己，而是把表情、姿态、动作、语言在智力结构下做出表演，这是情景的需要，不带有任何的个人信息。权谋家所有的情绪都没有个人色彩，没有内心特征，只体现的是权谋计算，而不是真实的自己。


    所以权谋家并不是喜怒不形于色，而是善于表演，让你看到的形象，只是想让你看到的形象，而不是真实的形象。所有权谋家都是影帝，而不是面无表情扑克脸。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 给老板提意见，要看到背后的问题所在，还要有可操作性！


    【困惑】老师，我刚入职场，当初老板面试时，问我一个问题：假如单位有干部存在“多干多错，少干少错，不干无错”的心态，该如何给领导提建议，改变这状况。我从制度建设、员工激励、风气改变等多个方面论述，老板很开心，于是我顺利入职。现在办公室就是这种懒惰的风气，我本来准备按照面试时的回答写意见书的，但是偶然的机会找到了咱们的“权谋智慧”公众号，我现在迷茫了，我该不该提建议，请老师指点。


    【解析】老板问这个问题，说明他已经意识到这确实是个问题，想通过引入新人，来打破这种风气。你能想到的套路，基本上老板都知道。你要知道的是，这种局面的形成绝非一朝一夕，几个建议就能改变的。职场面试和职场现实不是一个东西，面试只需考虑方案即可，而现实职场需要考虑操作性。


    # 1、这些不干活的人和老板的关系


    表面上很多人是员工和老板，是上下级关系，但是这背后，你不知道这些人都是什么背景，和老板是什么关系，有些人可能就是领导的亲戚，领导个人的性格又不是很强势，所以，这些亲戚类的都有恃无恐。而还有些人背后有强大的社会关系，老板需要他们背后的资源，这些资源性的人，也动不了。还有一些个元老型的人，技术落后，老板用他们也不仅仅为了干活，还是让他们作为心腹监督。


    # 2、这些不干活的人为什么没处罚


    当我们知道亲戚类、资源类、心腹类的这些不干活的员工，你也就知道这些人为什么没有处罚。而这些没有处罚的人，带动了组织风气的变坏，对其他类型的员工也形成了示范效应，最终大家都人浮于事，都没有人干活了。不处罚，大家还都能心平气和按部就班的干点活，但是一旦处罚，人'
  merge: -1
  img_proc: true
- pgno: 252
  md: '心不满，立即就会鸡飞狗跳，都摞挑子，组织立即就停顿了，做老板的只能睁一只眼闭一只眼。


    # 3、开除敲打这些人的难点在哪里


    经过我们上述的分析，我们能够看出来，不是领导不知道敲打的方法，而是怕投鼠忌器。所以，你面试时候的方案，基本上没有可操作性。敲打或是开除这些人，重整风气，其实和这些人无关，和老板自身的修为有关。如果减少公司的亲戚，就能够一碗水端平，对有资源的员工，从雇佣关系变成合作关系，从发工资到高提成的转变。心腹老员工改变工作性质，直接监察，而不是让他兼职私下报告。


    只有明白这背后的一系列的东西你才能明白要不要提建议。所以，你说的浅了，得罪这些有势力的员工，自己不好混。你说的深了，得罪老板，你让他敢于得罪人，多发钱，这怎么可能。你作为新员工，自己努力干活就行了，老板不是要你提建议的，而是让你担起任务的。别认为面试这个问题，就是想让你跳出来提建议，其实是让你踏实的干活，不同流合污。


    # 无法胜任，领导安排的任务，怎么回复？


    【困惑】面对领导安排的任务，确实无法完成和胜任的时候我该如何答复？


    【解析】这类问题，看似简单，其实很复杂，背后没有相应的背景资料，孤零零的看待这句话，意义不大。因为这背后和领导的关系是心腹关系，还是普通关系，还是敌对关系；具体不能完成任务，本质原因是资源不够，还是个人水平有限，还是畏惧风险？自己同事之间的关系如何，是不是会有人从中作梗，是不是有潜在的竞争对手添油加醋，是不是未来可能有提拔机会等等这背后各种原因，都会影响到复杂的无法完成任务时候的话术。不过这里咱们不复杂化展开，就把这个界定在，普通的领导关系，普'
  merge: -1
  img_proc: true
- pgno: 253
  md: '通的同事关系，普通的个人能力。这样平淡的职场环境，我们该如何回复呢？


    # 1、首先要明白领导心思


    领导下达命令，即使陷阱任务和栽培镀金任务，基本上都讨厌下属各种理由推三堵四的不接受任务，这是阻碍了权力的畅通性。所以，面对领导下达的任务，当众拒绝或是各种理由推脱，让领导觉得自己的权力无效，说了不算，接下来会给这样的员工最负面的评价。


    # 2、要立即汇报工作计划


    不能不接受任务，而自己确实能力做不到，这时候，就必须首先接受任务，迎合领导的权力，其次就需要 measurements，在做事上，列出计划，来表明自己确实不是故意不接受任务，而是真的无能为力，这时候，就要立即拿出计划，需要什么样的资源支持，需要抽调什么人协助，需要多长时间等，列出计划。


    # 3、多多汇报展示很努力


    如果面对这样的计划，领导批准了，自己就能成为项目领导者，协调资源，调动人才，能够完成目标任务。这样即使能力不行，也能够完成领导意图，如果领导不同意计划，而是让你独立完成，那就天天汇报，先做能做的，对于自己能力不足的部分，列出具体的原因。


    其实就是要表现出，你不是不听话，而是真不行。让领导认为你能力有限，而不是对抗权力，这样目的就达到了。知道这个核心的点，就明白该如何的说了：谢谢领导的信任，能把这个任务安排给我，自知个人能力有限，可能无法胜任工作，但是我会努力的尽最大能力落实您的指示。后续我会拿出具体计划给您审核，具体的操作，能力不足的部分，希望得到您的帮助，能让我顺利的完成任务。'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# 开国皇帝不是都要除功臣吗，而为什么有的却没有除掉呢？


    《困惑》老师，读历史，知道作为开国皇帝为了避免骄兵悍将的后期篡权，之后都初步的除掉了，但是读的历史多了，又发现不是那么回事，有的皇帝就没有杀戮大臣，这背后到底什么原理啊之所以这么问，就是我也是创业的老板，我就想知道，这群人，我以后究竟该如何处理他们。请老师解惑？


    《解析》除不除功臣的确是个很经典的组织问题，我们今天掰开了，揉碎了给大家分析清楚：


    # 一、历史上被认为是除掉功臣的真相


    # 1、勾践杀掉文种


    乌尽弓藏就是从文种这里出来的，勾践之所以杀掉文种，不是因为文种是功臣，而是文种见识过越王勾践的最狼狈的样子，知道他种种的不堪往事。勾践看到文种，不仅仅无法忘掉往事，也无法在他面前树立高大上的权威。勾践出于对权力的威严的维护，只能杀掉文种。


    # 2、刘邦杀异姓王


    刘邦只杀了几个异姓王，对于自己当初一起从丰沛走出来的老伙计，一个没杀。这些异姓王除了韩信之外，都是当年带资入股的。他们对刘邦团队的认可，也只是迫于当时的军事威胁，而不是真心地归顺。所以外部稳定之后，这些手握重兵，构成潜在威胁的人物，就提上了被解决的日程。


    # 3、朱元璋杀蓝玉


    其实历史上没有真实的火烧庆功楼，一大部分的功臣是被朱元璋的长寿熬死的。因为朱元璋作为皇帝 30 年，活到近 70 岁，这些功臣都活过他。至于杀了蓝玉和胡惟庸，主要原因是集权，自己的太子朱标死后，朱元璋想把权力给朱允炆这个孙子，怕他镇不住，提前挖了地雷。'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 二、三个皇帝背后不除掉功臣的理由


    # 1、刘秀的功臣是加盟的


    大家常说的就是刘秀没有杀功臣，大家都关系挺好，其实刘秀的江山，并不是真实一刀刀的打出来的，而是各地大军阀推选出的共主，王莽因为要从世家大族手里收回土地，大家都急了，所以，推荐了维护大地主利益的刘秀。这些各地军阀和刘秀是合作关系，并不是实质上的君臣关系。


    # 2、李世民是明确上下级


    其实杀功臣的目的，主要就是内部的集权。尽管打下了江山，但是一般开国领袖都是为了胜利，各种妥协，导致内部的权力分散，和平到来之后，就需要从外部的军事斗争变成内部的集权斗争。而李世民没有这个问题，一开始李唐就是大贵族的成熟组织，带领的就是已经明确上下级的团队，无须内部集权。


    # 3、赵匡胤是没有除外患


    赵匡胤的杯酒释兵权可以说是千古经典，直接告诉功臣，自己怕他们也黄袍加身，为什么他没有把这些“义社十兄弟”给杀了呢。主要是北方还没有完全的和平，幽云十六州还在大辽手里，没有北方屏障，这些骁兵悍将还有用，如果都杀了，军队还要打仗，谁还会卖命呢？


    # 三、面对创业伙伴该如何处理的计算


    # 1、员工心态


    有些员工一起创业过来的，尽管没有股份，但是以功臣自居，认为公司有自己的一份，老板的钱都是自己赚来的，对老板没大没小，居功自傲。没有转变心态，这让老板很不爽，时不时的违规，也给其他员工带来错误的示范效应。这些心态不正，定位不清的人，必须除掉。


    # 2、员工素质


    因为创业初期，很多老板手里没有太多的资金和资源，个人也没有名气，不能够招聘到优秀的员工，随着创业完成资本积累，这些早期的老员工的素质就跟不上组织的发展了，需要引进新员工，让这些跟不上的让出位置'
  merge: -1
  img_proc: true
- pgno: 256
  md: '来。这些能力掉队的，素质不高的，也让他们走人了。


    # 3、员工威胁


    每个组织完成资本积累的时候都是血淋淋的，没有谁不违规操作。可以说，老员工知道很多公司内幕，公司完成资本积累，就必须让这些人都离开，不然等公司做大了，这些人拿出来威胁，到那个时候，公司的损失更大。或者他们有资源，知道弱点所在，自己直接拉出去对着干，当竞争对手了。所以，作为一个老板，如果一个员工心态很正，知道自己是打工的，明确自己的心态，尊重权力，尊重制度，能够不断的提升自己的能力，能够适应公司的发展，还能够忠心耿耿，没有野心，口风比较严，这些人，就无需除掉。如果一开始，自己手里就是成熟的业务，有充足的资金，没有什么创业元老，过來就是打工，也就没有什么是功臣，也就没有杀功臣之说了。


    # 权谋是一种算法，并不是一个结论！穷人究竟要不要冒险？


    【困惑】昨天的文章中写到，作为底层要勇于冒险，才能突破阶层；而作为高层要保守主义，才能守住位置。有朋友留言说，你之前文章不是写到，底层试错成本高，要保守；而高层资本雄厚，可以承受风险，多次试错！这是不是自相矛盾？


    【解析】其实这两句话都对，因为适用的场景不同，配合原文的上下文能够理解清楚，不过我觉得，有必要专门详细的分析下底层要不要冒险，以及该如何的冒险：


    +   1、底层是分为两种


    处在社会结构最下部的称之为底层，但是底层却不都是穷人，底层分为思维的底层和经济的底层。一种是穷在经济上，一种是穷在思维上。比如现在努力还债的罗永浩，账面上没有资产只有负债，他是经济的底层，但却不是思维的底层。而大多数的穷人，是首先穷在思维上，进而体现在经济'
  merge: -1
  img_proc: true
- pgno: 257
  md: '上。所以，那些思维成熟的人，早晚会匹配相应的财富。而思维贫乏的人，即使有机遇赚到了钱，最后还是归零。


    # 2、盲目自信和胆小


    思维底层的恰恰有一种盲目的自信，根本原因就是，知识、视野和能力都限制了他的见识，井底之蛙会形成盲目的自信。所以这类创业人要谨慎，不然出门掉坑里，因为资本有限，一次可能就爬不起来了。而只是经济底层的人，因为思维能力比较强，凡事考虑的多，恰恰限制了行动，但是处处小心谨慎，恰恰无法迈出头一步，自己就永远打个嘴炮，搞的什么都懂，就是过不好这一生。


    # 3、高层冒险的缘由


    而高层的人呢，是指思维很强，经济过硬。这类人，在没有外部环境发生突变的时候，最好的方式就是保守主义，维护现有秩序不变就能够保住自己的位置。自己如果主动破坏稳定，折腾，只能是大概率的失去财富。但是如果外部环境发生了巨变，这时候，就不能被动了，需要开始试错，探索新的东西。而如果此时还是保守主义，维护既得利益，那就是逆潮流而动，最后走向危险。


    写到这里大家也就明白了，什么叫做具体问题具体分析，因为权谋的本质，并不是给大家提供一种结果，而是提供一种算法。通过把外部的条件带入我们的权谋公式，结果很可能大相径庭，甚至自相矛盾，但是这都是对的。所以，正如疑问中的不同结果，在不同的场景下，都对，也就理所应当了！记住，我们学习权谋不是为了记忆结果，而是要不断的磨练思维熟悉算法！那么穷人究竟要不要冒险呢？上面的分析也就很清楚了，如果思维和经济情况都贫乏的情况下，不要冒险创业，不然到处都是坑，一次就会爬不起来，这时候，就要保守主义。多和高人学习，识别资源，夺取资源。等能力、人脉、思维都上去了，这时候，就要敢于冒险创业，不然，前怕狼后怕虎，永远都觉得自己不成熟，走不出头一步，也就一辈子碌碌无为了。所以，穷人要不要冒险，就看他思维是不是贫乏，这个内在的决定条件。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '当然，外部的机遇推动时，遇见有人帮你一把，命运把你推向前台，要敢于跟随高人，迎合时代，边干边学。


    # 单位来了一个胡求整的领导咋办？


    【困惑】单位来了一个胡求整的领导咋办？


    【解析】问题很简单，但是极具代表性，因为很多人都会认为自己领导是个混蛋，不懂业务瞎指挥！我们详细分析下这其中的权谋逻辑：


    # 1、个人水平认知问题


    每个能走向领导岗位的人，都有自己的门路。有的是个人能力，有的是权力关系，再有的就是社会能量。所以作为下属，对领导的能力要准确认知，还有就是，不能理解这个领导的到任，是主要推动哪个方面，是稳定，是营销，是纪律，是产品，还是文化？对领导不理解，只从自己的角度作为出发点，就会出现认知的偏差，对领导有负面评价。这就需要自己提高通盘的政治能力，才能够认知到位。


    # 2、故意针对你的问题


    再一个，为什么在你面前领导会有这个表现，主要原因就是领导觉得你就配接受这个形象。这背后，就是领导到任之前，前任已经和这个领导做了交接，对你有一个负面的评价，让新领导先入为主了。对你不耐烦、有情绪、有态度，这也就导致你不断看到的，是一个处处让你觉得不舒服的领导。再或者就是暗中带有新任务来的，这个新任务就是想办法让你自己走人。让你觉得不舒服，主动退出。


    # 3、训练嫡系队伍问题


    可能有人会问，难道就没有真的不懂的领导上位吗，这个必须有。但是你想一下，为什么上级领导派这样一个胡乱整的人过来做领导？上级领导不怕出事受牵连？不怕把整个摊子搞乱了？明知道他不行还要让他上位？'
  merge: -1
  img_proc: true
- pgno: 259
  md: '其实，领导有自己的考虑，组织里忠诚是第一位的，管理能力是可以后续培养的。一个新领导上位，有一个适应的过程，培养自己的嫡系，是需要磨砺的，需要给时间锻炼的。


    所以，认知到上述问题，就明白自己该怎么做了，面对这样的领导，你一个员工能怎样？对他消极抵抗？还是冷嘲热讽？还是指指点点？恐怕均非良策。要努力发现这个领导特殊的资源或是能力，然后积极地配合他的工作，最终是取得领导的信任获取他的资源，这才是你要做的。权谋家能够在任何环境发现资源、依附资源、驾驭资源、转化资源，遇见什么样的领导，都不影响我们对他资源的发现和驾驭。至于对他们混乱的管理，以及如何评价，和我们没有关系，这是上级领导的事情。明白自己的主线，才能超脱管理与被管理的结构，从而走向更宽广的职场资源之路！


    # 你以为成功是勤奋，其实你是没见识过真正的成功逻辑！


    【困惑】先看一段网友后台给我的留言：李靖地位高是因为贡献大，开疆大，而不是什么投机取巧，至于说勤奋成功，曾国藩说天下古今之庸人，皆以一‘惰’字致败，看看世上碌碌无为之人有几个勤快的？


    【解析】这个观点基本上代表了很多人的普遍观点，那就是成功是努力得到的！其实这个观点对也不对，对的是，对底层完全正确，但是对中高层很荒谬。


    我们先说说这个思维背后的三大逻辑错误：


    +   1、倒果为因


    那么多将领为什么他贡献大？为什么他开疆多？其实这背后就是领导放心授权，所以才给他这么多机会，给他那么多优秀将领做下属，有了好的机会和队伍，才有了后来李靖建功立业的基础。没有这个，你所有的努力，都无从谈起。而领导给的机会，就是李靖精通权谋争取的信任。'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 2、以偏概全


    曾国藩说懒惰让人失败，却没有说勤奋会让人成功。而且就曾国藩本人，也不是因为勤奋这个单一因素而成功的。我们不能看曾国藩说什么，而是看他做了什么，他主要还是抱上了穆章阿的大腿，进而得到了道光帝的赏识。后来又主动和穆章阿划清界限，才逃过了慈禧的清算。


    # 3、非黑即白


    投机取巧成功怎么了？没有什么不好。只要合理合法的达成目的，手段是可以自由选择的。手段本身没有什么道德性，这和一把刀一样，关键是怎么用。而有些人，在纠结手段的时候，自缚手脚，失去了应有的机会，这个和底层只认知血汗钱才最干净的思维是一样的。


    我们接下来说说真正的成功逻辑：


    # 1、底层需要努力


    为了达到自己的目的地，没有任何资源、人脉，只能通过自己锻炼身体，依靠自己的双腿，日以继夜的赶路。不努力，去改变自己唯一能够改变的变量，还能怎样？


    # 2、中层需要借力


    君子生非异也，善假于物也。中层也需要达到自己的目标，但是依靠自己腿脚赶路就效率低很多了，于是借助各种工具，去实现自己的目的，比如做汽车、高铁、飞机。


    # 3、高层需要愿力


    高层想达成目的，就不是借助物力了，因为物力最终是有限的。到了高层就要借助人心，来让别人帮助实现自己的目标。这个愿力就是发自内心的追逐梦想的力量，给与梦想，驾驭人心。


    所以普通人认知往往以偏概全，井底之见。要知道，成功对每个层次是不一样的，自身的层次达到一定程度之后，到了瓶颈就该更换底层逻辑了。自己身体再怎么好，都跑不过汽车。而高层直接是让你给他开车，睡一觉就到目的地了，无须汗流浃背的赶路和小心翼翼的开车，每个层次的逻辑'
  merge: -1
  img_proc: true
- pgno: 261
  md: '是不一样的。因此，底层幻想皇帝用金锄头，就是这个原因，他们不知道上层的成功逻辑。


    # 高考完填报志愿，选报什么专业？


    【困惑】Q帝老师，看您的朋友圈和文章也挺久的了，作为您的粉丝，请教一下，你说今年高三考生在填报志愿时，学什么专业比较符合未来的社会发展趋势呀？


    【解析】高考分数公布之后，我的电话也几乎被打爆了，不少人信任我，希望我能为他们的孩子做一下指点。现在就借着这个朋友的问题，详细说下如何选自己的专业。


    1、首先选择和亲人资源接近的专业


    上大学，不是为了上学而上学，是为了更好的获取生存的机会和资源而上学。所以说，看看身边的亲人都有什么资源，在大学学的专业接近，这样，走出校门之后，就会有自己人在事业上带路，能够减少很多自己摸索的时间。比如，家里有医生，或是律师，自己最好还是选择一样的专业。家里是说评书的最好选择历史专业，这样走出来就能够快速融入社会，高起点获取资源。


    2、其次选择实战专业技术类的专业


    很多人说，我们就是普通的打工家庭，家里什么资源都没有，亲人里一个有本事的都没有，都利用不上。这时候，什么资源都没有的，就需要实战型技能，走出校门就能赚钱。那就学习土木工程、计算机等等，看似热门竞争激烈的行业，其实找工作还是很简单的。工资高不高，立即就业就行。学习那种看似高大上的万金油的，营销啊、管理啊、外贸啊，出门就失业。


    3、最后选择和自己爱好接近的专业'
  merge: -1
  img_proc: true
- pgno: 262
  md: '还有朋友说，孩子脾气很倔，不喜欢什么实用性的专业，还有没有推荐。这个就看自己爱好吧，自己有什么爱好，就学什么专业，毕竟学校出来的就业基本上也都专业不对口，大学好好的能够轻松的玩四年，爱好也是好事，毕竟自媒体这么发达，任何爱好都能聚集起来不少人，能够利用自己的爱好实现自己的创业梦。即使不行，大学四年过得也不会太痛苦，有了业余时间，说不定能够考研二次选择。


    我们权谋角度看待选专业，不看社会趋势，不看热门，只看资源，自己能接近什么资源就学习什么专业，没有资源就学习立即能够实战的专业，出门就能为企业创造效益。最后就是利用爱好，给自己积累资源或是获取足够的时间，去发现自己的资源方向。写到现在明白了吗，有资源就利用现有资源，没有资源就考虑能够立即变现的专业，去打工，有条件可以选择爱好的，积累创业方向。不过，现在社会内卷化严重，家里都有相应的资源，多少而已，还是从这个角度入手，才是最有用的方向。


    # 如何求人办事？背后的策略就这三条！


    【困惑】不求人办事，即使求人家，人家也未必答应，该如何办？


    【解析】资源都是被人所掌握的，想获取资源，最简单的方式就是取得拥有资源人的信任。所以，求人办事可以说，是人生的重要课题。每个人首先就要打通自己的价值观，依靠自己的努力不是不行，只不过是概率比较低。不过今天我们具体要说，如何的求人办事。求人的手段和过程其实并不难，核心的是要理解《鬼谷子》这段话“以下求小，以高求大。由此言之，无所不出，无所不入，无所不可。可以说人，可以说家，可以说国，可以说天下。”


    +   1、以下求小'
  merge: -1
  img_proc: true
- pgno: 263
  md: '下就是弯下腰，让自己用服务的态度，来求取小的利益。说白了，就是拍马送礼，献媚呕痔。很多人求人就是受不了如此，自己放不下架子。其实只要说话好听点，或是提供情绪价值，有资源的人，是愿意给自己的走狗一点残羹剩饭的，用《红楼梦》里刘姥姥说的，有钱人拔一根汗毛都比普通人腰都粗。刘姥姥去了越贾府，巧言令色的一番表演，被打发了
    20 两银子的小钱，但对农民却是一年的收成。


    另外，如果站在领导角度，来看这句话，就是自己屈尊，对下属关心，会让下属感动的要死的。吴起亲自为士兵吸取脓血，就是这样的举动，让小人物卖命的。


    # 2、以高求大


    小的利益是能够通过跪舔得到的，但是大的利益是不能的，你必须有自己的价值交换，必须通过自己的高价值来获取别人的大的利益。这就要求我们不断的加强自己的能力和素质，让别人认为自己是潜力股，或是有极大的回报能力，这样有资源的人都愿意合作。但是很多人，以为送送礼就获取更高的位置，这个基本上不现实，高层不缺你这点钱，缺的是忠诚又有人，很多人用错了手段。


    当然我们作为领导，想让下属做大事，做大的牺牲，这时候，就要用“高”来诱惑，这就是封官许愿，因为利益难以驱动一个人做大事，必须用高尚的情怀，或是高的荣誉，位置才行。


    # 3、逐步升级


    求人的本事，和其他的事情一样，要逐步的升级，先从周围的人做起。然后拓展到家或是小组，，然后是国家，大的组织，最后是天下。连借 500 元的能力都没有，就别想着，别人一下子给你拿出
    50 万的投资，让你花着了。这都是一步步的获取信任，不断的升级，不断的提升自己的求人本领，自身价值，获得周围人的认可，一步步的做起来的。让人逐步的愿意帮你小事，到愿意以命相许，慢慢来。'
  merge: -1
  img_proc: true
- pgno: 264
  md: '这个对领导而言，对待下属，也是如此，不可能一下子就托付重任，都是从小的任务，不断的考察，不断的训练；不断的积累下属的认同和忠诚，一步步的让他愿意牺牲追随。


    所以，我们知道了这背后的秘诀，就能像鬼谷子说的这样“由此言之，无所不出，无所不入，无所不可。”道理其实就这么简单，关键是在于自己明白背后原理的实操。


    # 提意见受到表扬，为什么领导却不落实我的方案？


    【困惑】老师，我给领导写了一份报告，提了不少意见，领导很开心，当场表扬了我。但是后续，没有任何落实的迹象，报告被束之高阁了，这是什么情况？


    【解析】这种表明决案太常见了，主要原因还是你太年轻。领导表扬你，但是不落实，有很多种什么情况，我们分类说一下：


    +   一、你的意见对


    +   1、时机不成熟


    你的方案不错，但是很多问题解决起来是需要时机的，时机不成熟的时候，还是缓一缓。一个组织千头万绪，很多问题，都是带病生存，不可能面面俱到，需要重点解决突出问题。所以，方案对，但是并不是到了立即要执行的地步。


    +   2、落实有难度


    很多问题暴露出来，也需要解决，但是解决问题不是下达几个指示的问题，而是需要准备或是调度相应资源的问题，而领导手里此时并不具备相应的资源。所以，就只能暂时放下来，提意见很简单，但是落实不是一朝一夕的。


    +   3、权力不集中'
