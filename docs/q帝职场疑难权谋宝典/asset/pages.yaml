  md: '巧妇难为无米之炊，任凭你厨艺再高，没有食材和工具，照样什么也做不出来。即使你懂的谋略权谋再多，再到位，没有资源，其实都无济于事。历史上那么多的谋士都没有独立创业，缺的不是智慧，而是可以调度的资源，即使都懂权谋，大家还要细细的拼资源，拼消耗。


    # 5、执行落地


    每个好的计谋，最终是要落地的。而执行团队的执行意志和效率非常的重要，愚者千虑，必有一得。只要肯用心去想，都能得到好主意，但是不是想出来，就立即有结果了，还是需要有人执行的，执行的过程中，这个执行落地的，可能人才等各种原因变得走样，而导致南辕北辙。


    所以，基于上述的五点原因，我们能看出来，即使人人都学习权谋，也不会没用，因为通过权谋对这些外在的东西依赖度特别高，而不是懂几条简单的技巧，就能立即成功的，所以，别人都学了，自己恰恰更要好好学，不然，彼此之间差距就是非常巨大，更加难以取胜。


    # 下属给领导送礼，领导不会反感吗，不会向上举报吗？


    【困惑】下属给领导送礼，领导不会反感吗，不会向上举报吗？


    【解析】很多没有跑过关系的都会有这个担心，尤其是看了电视看到各种失败被打击的案例，更是不敢出手。这说明国家的警示已经起到作用，这都是好公民！但是，我们从权谋角度来看，就不是这个样子了：


    一、领导对下属送礼的态度有三种


    # 1、深恶痛绝


    尽管社会风气如此，“千里去做官，只为吃喝穿。”但是总有一些个人，不在乎物质，宁愿清贫，不买车买房，不为孩子考虑，也要保持理想主义；还有一些人，性格懦弱，胆子很小，有贼心没贼胆，不敢伸手，瞻前顾后；当然还有一些人，背景雄厚，不缺钱，自然看不上。'
