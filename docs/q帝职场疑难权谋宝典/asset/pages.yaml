- pgno: 299
  md: '# 1、主动远离


    首先是距离切割，保持一定的距离，减少交往的频率，工作的联系等，就能淡出大家的视线，这时候自己最好的方法是生病、出差或是调走。保持低调，这样，能蒙混过关。


