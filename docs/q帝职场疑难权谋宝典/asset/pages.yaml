- pgno: 224
  md: '做为权谋家，任何时候都不会挑战公众底线，再阴暗的算计都会披上道德外衣，表现出自己的光明正大，善良友爱、公平正义等。如果一个人把内心的这种计算全部公布开来，就好像脱光衣服站在大众之前一样，表面上自认是一种真实，其实是挑战了大众的接纳底线，这样会被所有人所抛弃。这不是一个智者所为，经常的表现为“满口的仁义道德，一肚子的男盗女娼。”


    # 2、想一套：弱肉强食，适者生存


    别管别人怎么说，或是自己怎么说，权谋家都不受干扰，都有一套自己内心的强者规则。让别人信的东西自己不一定信，教育别人做的事自己不一定做。让别人遵守规则，权谋家却不一定遵守规则，让别人学雷锋做好事，权谋家却不一定这样搞。权谋家想的和别人不一样，他尊重的是真实的社会规律，不断的抛开普通人的道德观念和底层价值观束缚，自始至终信奉，想着丛林规则。


    # 3、做一套：非利不动，非危不战


    说了一套，想了一套，但如何落地呢？如何融入我们的日常生活呢，那就是要坚持，“非利勿动，非危不战。”做任何事情之前，都要考虑考虑这个事，能给自己带来什么样的利益。如果你没有利益就不要出手，比如，街头扶个老人该不该做？另外没事不要因为情绪而和别人发生矛盾，即使利益受损也不能公开撕破脸，只有到了不得不出手的时候，才能公开对抗。所以说作为权谋家，从来不是单一形象对外，而是上中下各种策略，面对不同的人，用不同的手法。只有这些底层人才会非此即彼，非黑即白，单一化草履虫思维。所以如果简单的认为表面一套背后一套，那只能说明还是小人做法。权谋家早就在三维世界了，社会道德、自然道德和做人道德，是不一样的。分清楚环境，就能纵横捭阖了。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 前领导挖我过去，我要不要跳槽！


    【困惑】老师，我前领导对我很好，现在他到了新公司做部门负责人，想挖我过去，我不知道该如何选择？


    【解析】这个问题说来简单，谁给的工资高，就跟谁，但是这背后之所以纠结，就是过去之后，干不长，自己就会进退失据。所以，我们考虑自己要不要追随老领导，必须考虑下面三大方面：


    一、领导方面


    1、他与领导的关系


    我们要不要跟随老领导，就要看这个靠山是不是牢固，还要看他的权力位置是不是稳定，老领导的和他自己的上级关系好，这样做我们的靠山，才会可靠。


    2、他对公司重要性


    如果只会玩弄权力，这个风险就太大了，毕竟公司还是盈利机构，他不仅仅要在人际关系上稳定，还要看他对整个组织的重要性，这样的抗风险能力就会很强。


    3、他对你的需求度


    他能力和权力都很稳定，这时就要看这个领导对你的重视程度，是让你过来加强自身权力，还是需要你的专业能力，还是你们之间的关系好，还是三者兼有。关系度深，才不会被抛弃。


    二、个人方面


    1、个人能力


    考虑自己的能力，换个新的环境是不是能够快速适应，如果无法适应新的工作岗位，还不是跳槽的好。换个地方不匹配能力，就会过的很累，而不仅仅考虑领导的面子。'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 2、个人成长


    跳槽首要的还是要考虑自己的成长，在这里是个普通员工，换个地方依然是个普通员工，跳槽就没有意义，要不断的考虑自己的成长空间，人生价值的提升是自己考虑的核心。


    # 3、个人收获


    除了能力、价值的提升之外，我们还要考虑薪酬的问题，毕竟，大家无论去哪里都是要的钱，只有实打实的薪资收入才最重要，因为老领导不是老板，千万不能相信承诺。


    # 三、风险方面


    # 1、领导品行


    领导的品行很重要，现在很需要你，会对你很好，但是他可能不会考虑你的利益，他有了新的利益，可能就会自己离职或是跳槽，留下你一个，他不为你负责，你接下来就会很困难。


    # 2、工作环境


    新环境，还有个融入度的问题，可能看着很美好，到了那里之后，无法适应新组织的环境，比如高强度的竞争，或是高强度的stens工作压力，要提前知道工作氛围。否则，自己就会进退两难。


    # 3、失业承担


    最怕的就是领导离职，自己因为被老领导挖过来，属于天然的派系属性，领导离开自己可能也就要离开了，接下来的失业，老领导可不会负责，自己要考虑后路的问题。


    最后要说的是，一个阴谋，很多公司裁员都很困难，故意暗中设置一个项目公司，表面是老领导出去创业，抛出去橄榄枝，其实就是老公司甩包袱。一旦签订离职协议，很可能无法入职新公司，或是入职新公司，也会因为公司倒闭，而进入失业状态。老东家，无形之中完成裁员。'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# 我们该如何的扩大视野，让自己看问题有高度，有深度，有广度？


    【困惑】老大，我也想扩大视野，无从下手啊。如何提升自己的眼界，请指教！


    【解析】很多人读书看文章，都总会觉得看问题，看不懂，看不深，看不透，想提升自己却又无从下手，其实扩大视野，权谋家主要是从三方面下手！


    # 1、转换阶层视角——提升高度


    每个知识背后其实都是有立场的，如果无法识别知识背后的动机，就很难做到开卷有益。这些知识动机的背后是需要阶层的视角才能看透彻，因为阶层都是向下兼容的。比如，你站在山顶可以俯瞰一切，而站在山脚下，抬头看山顶却是云山雾罩的。我们扩大视野，第一步就是要知道，管理阶级的想法。一旦我们了解权力
    splash 的心思，其实就是站在了阶层的高处。


    # 2、积累多方知识——挖掘深度


    你没见过的东西，或是你难得一见的东西，你很难短时间明白这背后的原理。这就需要我们不断的扩大阅读面，多方面的积累知识。当我们有了一定的知识储备，就能识别现象背后的各种原理，深度自然就增加了。比如，很多人道听途说，认为送礼就能办事，自己去送礼领导却不收，这就是没有深度，不知道送礼的背后是利益联盟。知道背后的东西，才能投其所好。


    # 3、广为搜集信息——扩大广度


    想准确知道一件事情，其实并不容易，因为这就像“罗生门”一样，事情发生了，不同人，有不同的看法，不同的信息，这就对我们识别真相带来了极大的困难。所以，我们了解任何一件事情，都需要最大范围的占有信息资料，这就可以避免一叶障目不见泰山。比如，我们想了解一个项目，这就需要事无巨细的了解到各个环节，只有这样才能够，更加准确的把握项目。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '经过上述的分析，题主应该能够明白，想扩大自己的视野，首先就是学习统治阶级的心思和思维，其次大量阅读让自己有巨大的知识储备，最后用心搜集全面的信息，自然自己的视野就能有高度，有深度，有广度。


    # 教小孩子权谋是不是太小了，不合适？


    【困惑】老师，看了你对小孩子讲权谋故事的文章，觉得是不是太早了，会把孩子教坏，是不是等大了再教？先让孩子学点儒家的东西打打底，这样就不会走弯路了吧？


    【解析】人的脑子是不种庄稼就长草，你不把正确的事情教给孩子，他就会被错误的东西所占领。权谋并不是坏的东西之所以认为权谋阴暗，还是因为自身底层教育遗毒的问题。传统的教育有三大缺陷，一旦错误灌输，以后纠正起来就很难，所以对于孩子的教育，必须一开始就不能走错：


    +   1、如何谋取利益


    《论语·里仁》子曰：“君子喻于义，小人喻于利。”《后汉书·韦彪传》：“安贫乐道；恬于进趣；三辅诸儒莫不慕仰之。”从小被儒家灌输，追求利益的都是小人，都是坏人，不追求利益，才能得到别人的敬仰。所以，小孩子脑子里从小就植入了错误的信息，就是面对自己的利益不懂如何正确的谋取方法，羞于谈钱。真正走向社会之后，谈加薪都不好意思开口。非但如此，我们还从小背《三字经》：“融四岁，能让梨。”不去争取自己的利益，反而要谦让，压抑自己的需求。所以，权谋教育，第一步就要弥补这个缺陷，就必须告知孩子，我们能够有策略去谋取自己的利益，而且还不会被人嘲笑。可以披上道德外衣，为大家谋利益，把自己的利益夹带其中，而不是傻傻的被动等待。


    +   2、如何除掉对手'
  merge: -1
  img_proc: true
- pgno: 229
  md: '《孟子·梁惠王上篇》中，梁惠王诉说自己“东败于齐，长子死焉；西丧地于秦七百里；南辱于楚”的屈辱，请教孟子如何雪耻。孟子回答说：“地方百里而可以王。王如施仁政于民，省刑罚，薄税敛，深耕易耨。壮者以暇日修其孝悌忠信，入以事其父兄，出以事其长上，可使制梃以拊秦楚之坚甲利兵矣。彼夺其民时，使不得耕耨以养其父母，父母冻饿，兄弟妻子离散。彼陷溺其民，王往而征之，夫谁与王敌？故曰：仁者无敌。王请勿疑！”儒家讲究的是“国君好仁，天下无敌焉。”这就意味着，面对竞争对手，只是提升自己的道德，来让别人心服口服，而没有任何的除掉对手的手段，基本被动挨打。权谋家讲究的是提前发现潜敌，把所有的对手解决在萌芽之中，不排除用栽赃陷害的手段。


    # 3、如何借助权势


    《孟子·梁惠王下篇》：齐宣王问曰：“汤放桀，武王伐纣，有诸？”孟子对曰：“于传有之。”曰：“臣就其君，可乎？”曰：“贼仁者谓之贼，贼义者谓之残，残贼之人，谓之一夫。闻诛一夫纣矣，未闻诛君也”《孟子·尽心下》孟子曰：“民为贵，社稷次之，君为轻。是故得乎丘民而为天子，得乎天子为诸侯，得乎诸侯为大夫。诸侯危社稷，则变置。柄牲既成，粢盛既洁，祭祀以时，然而旱干水溢，则变置社稷。”脑子里都是民贵君轻的思想，不好的领导就是独夫民贼，除掉是可以的。这让很多人自认为领导不好，就可以拍桌子反对。另外儒家要么是君臣父子的等级，老老实实的遵守秩序，不敢跨越一步，要么是直接反对，走在两个极端，而权谋家讲究如何的借助权势为自己所用。

    所以，经过上述的分析，我们就能够看出来，如果不在小时候就灌输权谋思想，如何争取自己的利益。如何除掉竞争对手，如何借助权势，基本上走向社会就是弱鸡，而弱鸡的底层思维逻辑一旦形成，就很难改变，走向社会就成了韭菜。所以，权谋教育不是让人变坏，恰恰是学会维护自己的合理合法利益。因此，我们教育孩子没有早晚的问题，是要不走弯路的问题。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 学了权谋用不出来，如何训练临场反应！


    【困惑】自己总感觉自己学的权谋用不出来，我该如何训练临场反应？


    【解析】所有的临场反应，都是熟能生巧，超强积累之后的，瞬间爆发。没有一个技巧，学了之后立即能够左右逢源，权谋家对临场反应的训练都是依照如下的三个原则的：


    # 1、超强的案例储备


    阳光下没有什么新鲜事，你认为很新鲜的东西，其实历史上早就出现过，别人早就研究过，而且已经有了标准的答案，我们日常就应该看各种各样的与我们相关的案例，做出超强的储备，当面临事情出现在我们面前时，里面就可以找到相应的案例，并与之采用同样的处理手法。


    # 2、长期的经验感觉


    但是实际上，条件不同、环境不同、阶段不同、人的不同，有可能找不到100%相似的案例，拿来直接套用，这个时候就要用到自己长期的经验感觉来判断这件事该如何去做。因为无非是事情的规律和人性，想明白这些东西。自然可以按照常规化的套路，分类进行处理即可，也就能够游刃有余。


    # 3、严格的原则坚持


    还有很多决策是从来没有遇见过，面对未知的一些新东西，这个时候就不能守旧，参考原有的东西了。没有任何参考，也没有任何经验，这情况下，我们只能依靠自己故有的原则，保护住自己的命门，设定好自己的利益底线，以及自己能够承担的风险程度。把握这三大原则，就能够具体决策了。只要我们经过上述的三种训练就不会没有临场反应，而且会越来越成熟，因为毕竟我们遇见的新东西还是最少的，99%的事情处理，还是按部就班。'
  merge: -1
  img_proc: true
