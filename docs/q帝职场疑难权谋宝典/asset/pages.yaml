- pgno: 29
  md: '# 权谋是否有烂大街的一天！


    【困惑】老大，最近上网，发现自从你 2016 年开始权谋教学培训之后，公开讨论权谋的文章似乎变得越来越多了，权谋是否有烂大街的一天呢？求指点。


    【解析】很多朋友把权谋当成职场的武林秘籍，想暗地里偷偷的学习，自己不传播，也不喜欢太多的人知道这个学问，别人知道的越多，就会感觉权谋会失去作用。其实大可不必有此担心。权谋文章没有多也没有少，也永远不会烂大街，原因有三个：


    +   1、心理学感觉效应


    这种现象就是心理学中所说的“视网膜效应”，当我们自己拥有一件东西或一项特征时，我们就会比平常人更会注意到别人是否跟我们一样具备这种特征。比如一个人怀孕了，更容易发现其她孕妇，所以这个心理学原理又称之为“孕妇效应”。当你自己关注权谋之后，内心也会不断地注意到那些权谋类的文章，所以就会发现，这类文章越来越多了，其实只是自己的心理感觉而已。


    +   2、个人价值观排斥


    从小我们的学校教育大多从知识入手，而自身的价值观，大多数源自家庭。每个人从小都会被教育要诚实，要帮助弱者，吃亏是福，无商不奸，富人的钱都来路不正，有权的人勾心斗角都不幸福等等。这些价值观，在我们走向社会之后，就会成为我们的行动的潜意识。对权谋讲究的，兵不厌诈、以患为利、心狠手辣、溜须拍马、送礼等，这些东西无法接受，知道的也很反感厌恶，认为
    carnivore?, 认为是小人学问。


    +   3、主流舆论的控制'
  merge: -1
  img_proc: true
- pgno: 30
  md: '自古以来，主流的舆论就是为了维护社会稳定和既得利益群体。让大家当顺民，而不是鼓励大家为了权力，无所不用其极，使用那种翻手为云覆手为雨的诈术，更是不能走向前台让普通的大众受到熏陶。所以这类权谋文章，永远都不会被主流的媒体所鼓励，更不可能宣传到烂大街的程度。权谋研究，永远都是小众的学问，永远都会走不上台面，不是可以公开学术研究的知识。


    权谋网研究认为，权谋极强的价值观属性，让很多人嗤之以鼻。但是权力的原理，谁在这个权力位置，都必须遵守这个规律。权谋永远不会烂大街，是社会少数精英掌握的学问。


    # 如何快速的了解组织和领导！


    【困惑】权谋网老师您好，可以请教您一个问题吗？就是到了一个新的环境中，该如何迅速了解这个组织以及如何迅速了解领导？


    【解析】知己知彼百战百胜，进入一个新环境了解组织和领导的确是一件非常重要的事情，不过职场里充满着尔虞我诈，我们很难通过语言交流去获取有效的信息，因为这里面充满着空话、套话、假话。但是如何的去快速的了解组织和领导呢，这就需要我们去自己观察、推理和判断。每个职场的环境都不一样，所以，这个没有简单的权谋公式可以套用，没有捷径可走，不过还是有一些个简单的技巧：


    一、了解领导的技巧


    +   1、首先要了解领导的工作模式。


    他的工作模式是什么，是民主的，还是独裁的；是需要汇报过程的，还是汇报结果的；是需要独立工作的，还是需要不断请示的；是喜欢开会的，还是喜欢单独沟通的。这些都需要通过自己的观察，去熟悉领导的工作方法，然后自己去配合。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 2、其次要了解领导的权力模式。


    所谓的权力模式，就是领导是如何使用权力的，如何授权、集权、和用权的。一个领导身边围绕什么类型的人，这是我们观察领导权力模式最简单的技巧。看看领导在使用什么样的人作为自己的日常授权人，明白这些人，自己就知道该如何努力，才能得到授权了。


    # 3、最后是领导自己的个人爱好。


    每个人都有自己的特殊的爱好，不了解领导的特殊爱好，你就很可能三观不和，跟领导走不到一起，比如，领导爱喝酒抽烟，而你却滴酒不沾，讨厌抽烟，那么很难走到一起。如果领导喜欢简洁凝练，你却喜欢花枝招展，也难共同相处。


    # 二、如何了解这个组织


    # 1、了解组织的文化和氛围


    一个组织是平等的合作关系，还是勾心斗角的权谋氛围，这个是首要必须了解的，这是在职场必须要了解的大战略方向。了解起来很简单，求助一下就知道了。氛围冷不冷漠，就看他们对新人的热情程度。也可以观察有人犯错的时候，大家的态度。


    # 2、了解人与人之间的关系


    职场的重大脉络就是人与人之间的关系，说的大一点就是职场的派系。谁和谁走的近、谁和谁话多、谁和谁私下有交往、谁和谁下班一起走、谁和谁有特殊的关系等等，这些都要用心的观察和了解，只有知道人与人之间的深度关系，才能明白不同的利益所在。


    # 3、了解谁愿意主动帮自己


    人不是孤立的，走进职场，必然就有人对你有好感，这时候，就要在一开始紧紧抓住对你有好感的人，迅速的建立关系。如果真的没有人对你有好感，这时候，就要抓住自己最近的同事或是最新的领导建立关系，这样能够通过他们的交往和交流迅速获得职场的一切，找到带自己的人比什么都重要。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '经过上述的分析，我们能看出来，在职场没有快速的事情，有的只是仔细的观察，用心的判断，通过自己的社交技巧，和权谋技巧来快速的融入这个组织，把自己转变成和他们一样的人，这样才能立足，千万不要表现出另类和对抗，不然因为根基不稳，很快就会被淘汰。


    # 职场刚来的新人被老员工欺负怎么办？


    【困惑】老师，职场刚来的新人，被老员工欺负怎么办？


    【解析】问这个问题朋友，肯定期待一个，能够立即改变被动地位的绝招。而事实上，这个是不存在的。你只能忍着，等待时间把自己变成职场老员工。可能听到这个答案，作为职场新人的内心是极端的不舒服，就这水平还叫权谋高手？没错，这恰恰就是权谋高手的能力所在，权谋手段不是追求新、奇、怪，而是在客观计算之后得到的最佳的答案。


    既然给出了忍的答案，我们就接下来说下这背后的计算过程：


    +   1、如果采用反击的策略。


    面对老员工的欺负，任何人内心都极度不爽，就想反击，可以如果采用反击策略，就不能只看情绪，而是要看自身的资源、能力、看对方的实力。因为刚来职场，能力没有得到组织认可，能够调动的资源有限，而且不知道老员工的实力，不能做到知己知彼，如何能打赢这场职场斗争？


    +   2、没实力反击就该忍着。


    《孙子兵法》有云：“主不可以怒而兴师，将不可以愠而致战。合于利而动，不合于利而止。怒可以复喜，愠可以复悦。亡国不可以复存，死者不可以复生。”这段话说的很明白，不能因为自己的情绪而随意反击，而是深刻的计算，合利而动。因为作为职场新人，输不起，丢了工作，得不偿失。


    +   3、解决问题就是好答案。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '“老子就是咽不下去这口气，就这么白白的让别人欺负？年轻人的血性何在？”怎么说呢？职场就是这么个状态，等你熬过去，成了老员工，你自己也会认为，欺负新员工，再正常不过了。这是必然的过程，和感冒一样，唯一的良药，就是多喝白开水。忍，是没实力的时候唯一的策略。如果这个老员工深深的伤害到你，也不要气馁，把气埋在心里，毕竟中国有句老话，君子报仇十年不晚，快速的融入这个组织，让自己不可或缺，不断地私下搜集这个老员工的把柄和错误，联合和他有矛盾的人，在适当的时机，一击必杀。想赢，先问问自己的实力，而不是凭借心里的怒气。


    # 为什么老板不会主动给员工加薪？


    【困惑】权谋网老师，为什么在职场，作为员工不主动要求加薪，老板就一直不涨工资？


    【解析】通常而言，大的、正规的公司，组织都有自己的晋升加薪的流程。一切不需要员工自己考虑，按部就班就行了。但是 90%都是中小公司，没有这样的流程，大多都是岗位工资制度。也就是说，这个岗位就这个价，除非，你升职，换岗。不然不会主动给你加薪。其实如果站在老板的角度，就能够很清楚，为什么你在原有岗位不会主动加薪。


    +   1、不关注员工工资是不是该调了。


    老板每天要考虑的事情很多，可以说，每天都在为他自己的利益到处奔波，为内部的管理费尽心思。根本就没有时间和精力去思考下面的员工是不是该涨工资了。既然没这个精力去考虑这个事，自然也就不会主动加薪。


    +   2、作为员工不提加薪会认为合理。


    在老板眼里，作为员工，你不主动提出加薪，说明你对工资目前是没有意见的，毕竟岗位工资有个市场价的问题，基本上没有太大的差别。在老板'
  merge: -1
  img_proc: true
- pgno: 34
  md: '眼里，这是个基本合理的工作价格。所以，既然符合市场价，员工自己都不说，老板也就不会主动调整工资。


    3、只要不主动提能少发就少发钱。


    岗位工资体现的是劳动力的市场价格，但是具体到某个人，因为贡献不同，自然会有差别。老板有时候心里也有数，某些人的确应该加工资了，但是你员工不提，他能省几个月就省几个月，毕竟钱无论多少，老板都不想多给别人。


    即使员工提出加薪，不过作为老板更多的是调整奖金和补贴，这样能可进可退，而直接调整岗位工资，这样上去就下不来了，激励效果也会很差。也就是说，很大层面，即使你要求加薪，他也是从奖金和补贴下手，而不是调整基本工资。


    # 权谋学了好久，用不出来是什么原因？


    【困惑】很多人困惑，学了好久的权谋，晦涩术一般，感觉不错，也很有道理，但是就是用不出来？这是怎么回事？


    【解析】其实想把权谋的效果最大化的发挥出来，需要这三大条件：


    1、积累资源


    很多人刚读三国的时候，就会有这样的疑问，像诸葛亮这样的高智藓人物，为什么不创业，非要给别人打工呢？没错，任何人都不想打工，但是，想做老板是需要有原始资本的。没资源拿什么开始？任何人想实现自己的理想，都必须依托于资源。就是使用计谋，也需要间谍、武器、粮草等资源。


    2、等待时机


    有资源就一定能立即成功吗？司马懿告诉你，需要等待机会。司马懿，从被曹操逼着出山，到发动高平陵政变，这中间时间过去了半个世纪。一个斗败诸葛亮，手握兵权的人，也不能不在机会面前俯首。而袁世凯就是个'
  merge: -1
  img_proc: true
- pgno: 35
  md: '反例，在错误的时机称帝，从而导致失败。时机，就是外部条件完全具备。


    # 3、转变心态


    自保手段：随大流，不冒险，不出众，胜败未卜时袖手旁观，大局已定时一拥而上。防范手段：防口，防怒，防微，防得意，防功高震主，防结怨等。隐藏手段，不表态，不露心，不露情，不倾诉，等等。而使用这些手段不在于能力，而在于心态。心态不转变，这些基本招法就用不出来。


    所以，权谋不是一个人一蹴而就、立竿见影的工具，而是一个不断的完善积累，不断地等待条件成熟，不断地修正自己的价值观心态的过程，这样使用权谋的时候，才能最大程度的发挥效果。


    # 和领导当众大吵之后如何修复关系？


    【困惑】Q帝老师，我因为实在受不了欺负，和领导大吵了一架，和他算是结下了死仇。原来他虽然是主要负责人，但影响不了我的命运，可是最近机构改革，情况发生了变化，这下子就非常麻烦了，我想修复，可是当众大吵，真是很难再修复，他也很没面子，救救我吧！


    【解析】这是个非常典型的职场问题，权谋网详细分析，解答如下：


    # 一、题主犯了两个错误


    # 1、当众对抗权力


    为什么会被领导欺负到受不了，根本原因是什么？大多是不听指示，恃才傲物，自以为是，领导才会不断地给小鞋穿，但是这还是私底下的手段斗争。矛盾公开化之后，彼此都没有退路。这样恶劣的示范效应，会让领导丧失权威，作为权力拥有者必然会报复。


    # 2、办事只顾眼前


    凡事留一线，日后好见面，很多人冲动做事，不计后果，往往只顾眼前的痛快，忘记了日后的尴尬局面。表面是机构改革，这个反目的领导成了顶'
  merge: -1
  img_proc: true
- pgno: 36
  md: '头上司，其实背后，何尝不是人家操作的结果，就是要调整为你的上司，可能就是为了报复而来。


    # 二、解决问题的思路


    # 1、修复关系几乎为零


    如何的修复关系？其实这基本是不可能的，权力心思都是揉不进沙子的。有不少朋友说，要找到新的靠山，这样就可能找到制衡点避免被收拾，其实这是个想当然的思路。一个当众和领导对骂的下属，是对权力毫无顾忌的人，没有领导敢做这样人的靠山，谁也不想给自己找麻烦。


    # 2、继续对抗会边缘化


    最好的策略就是辞职，不过如果是事业、行政单位或是国企，走不了的话，只能公开矛盾，继续对抗下去，这样领导为避免投鼠忌器，或是本着，新鞋不踩狗屎的思维，领导会采用边缘化，给予冷板凳的策略，这样，题主就可以避免进一步被打击。


    # 三、残局处理的权谋原理


    # 1、从寻求利益到避免损失


    职场上策是和领导搞好关系，获取超额利益。但是如果无法和领导建立正常的关系，就需要寻求中策，那就是尽可能的避免进一步的损失。不行的话，就使用下策，那就是鱼死网破。你不让我好过，我也让你难受，我走，你也别留下。


    # 2、从主动操作到静等机会


    人面对困难，或是危机，往往惊慌失措，盲目操作，其实最佳的方案，就是让自己冷静下来，一来看对方如何出招，自己后发制人，减少失误。二来，等待机会，风水轮流转，说不定，对手有自己的敌人，需要帮手，自己就会有新的利用价值，从而翻身。


    所以，给题主的建议是，争取中策，让他不敢继续的和你斗下去，然后等待机会，投靠到他敌对阵营里去，否则，鱼死网破之后，那 Shot考虑辞职吧，不是任何问题都有答案的！'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 为什么我犯了很多职场错误，依然很好？


    【困惑】权谋网 Q 帝老师，看了你写的文章，说和领导拍桌子争吵，基本没有和解的可能，而我，就多次和领导争吵，还是好好地，身边其他朋友和领导叫板，被提拔的也有，这是什么情况？


    【解析】没错，的确如此，很多人犯了职场致命的错误，也没怎么样，原因有下面三点：


    # 1、不可或缺


    韩信要求刘邦封假齐王的时候，这样的要挟，刘邦非但没有拒绝，而且还升官，成了真齐王。这站在韩信角度，去想，你看，我犯了职场错误，不但没被收拾，还升官了，你这个权谋策略是错的。呵呵。真的嘛？当你不可或缺的时候，人家必须容忍你。但是没用之后，大家都知道韩信的结局。


    # 2、领导无能


    不是所有领导都是通过自己的权谋斗争上位的，偶然机会，或是贵人扶植上位的人，位子不是自己努力得来的，就缺乏权谋和领导力的历练，外加性格软弱，对如何当领导不熟悉。无法用正确的方法去驾驭一个组织，很容易做出错误的决定，包容对自己对抗的人，这对领导自身权威伤害很大。


    # 3、背后有人


    有个段子是这么说的，“有个学生当众顶撞老师，让老师下不了台，老师最后还天天表扬他，为什么？因为这个学生的老爸是副校长，”没错，背后有靠山，谁都可以为所欲为。我们不能只看表面的，对抗行为，还要看到这背后错综复杂的关系。人家可以，你没背景对抗就不行。


    权谋讲究的是持术不持信，把主动权拿到自己手里之后，去追求大概率事件。像那种，两块钱就能够赚到 500 万的人，社会上也多的很，不过这'
  merge: -1
  img_proc: true
- pgno: 38
  md: '样中彩票的事情，不是我们该追求的。我们只有做正确的事情，才能更大层面的成功，而不是随意做事情，等待权力的宽容！


    # 如何处理打自己小报告的人！


    【困惑】遇到一个喜欢打小报告的人，他和我平级，偏偏领导非常信任他，如何处理？


    【解析】这是个非常常见的职场问题，说大不大，说小不小。说大不大，是因为，领导不会因为小报告而有什么大的动作。说小不小，是这样的事，天天让自己恶心。不过，权谋家通常的策略就是：以其人之道，还置其身！他做小人你何必做君子，而自困手脚？通常而言三大招数：


    +   1、上策，取得领导信任

    为什么领导会相信别人对你的小报告呢？这说明，你和领导之间沟通有隔阂，你的言行领导并不太清楚，你缺乏主动请示汇报的工作，导致领导对你缺乏信任，从而让小人有机可乘。面对小人，只有通过自己取得领导的信任，才能避免被人家钻了空子，取得信任后会从根源解决问题。


    +   2、中策，注意自身言行

    一个人如果慎言慎行，不被别人找到机会，抓到把柄，就算任何人凭空捏造，来打小报告，最终都会不攻自破。但是如果自己屁股不干净，会给别人留下揪刀的机会。明朝的海瑞，所有人都反感他，但是都拿他没办法，谁让人家找不到任何瑕疵？不给对手可乘之机，这是中策。


    +   3、下策，收集对手把柄

    但是大家都是普通人，谁不犯个错误呢？被人家抓住小辫揪着不放怎么办？ 这时候我们就要通过各种方式来取得情报，把这个小人的把柄留在手里，这样就能够震慑小人，不敢轻举妄动，毕竟谁都不想鱼死网破，抓住小人的把柄，能够给自己留出反击的空间，这个是下策。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '当然很多人会说，我们可以给小人的其他对手，输送炮弹，挑动别人和小人来斗，自己来个渔翁得利，其实有这样权谋思想水平的人，早就是领导心腹，还会遇见这种进献谄言的低级小人么？恐怕即使有小人，也是和自己一伙的。因为权谋家都知道，宁愿得罪君子不得罪小人。


    # 看不惯，该不该告密！


    【困惑】老师，我想请教个事，我单位是国资下属企业，最高领导是董事长，总经理和下面一个部门经理是多年情人，对外一直说是朋友。最近两个人一起注册了个公司，利用现有单位的资源。
    这事我应该告诉董事长还是装不知道。 我的级别较低，说了对我也没什么好处，只是这两个人我也确实一直看不惯而已。


    【解析】权谋家一直都把《孙子兵法》里的“非利勿动，非危不战。”当成自己行动的信条，究其原因就是，没好处不行动，不到最坏处不斗争，其实题主就违反了权谋家的上述信条。这个社会看不惯的事情太多了，我们只关心我们自己的利害！


    +   1、说了没好处，做了有坏处。


    题主作为基层比较低的员工，即使总经理和他的情人下去，自己也不会获得好处。因为不可能直接顶替总经理的位置，或是部门经理的位置，再或者是多发奖金。而且直接的坏处却有两个，一个是如果这两个人一下子扳不倒，就会遭到打击报复。即使扳倒，自己以后的顶头上司，也会对告密的人没有什么好感，领导都怕自己身边有这样一个告密的人。


    +   2、董事长未必不知道这件事。


    仔细想一下，你这个基层员工都知道，他们的竞争对手，或是上级领导会不知道？其实很多时候，时机不到，大家都会睁一只眼闭一只眼，很可能，董事长自己也不干净，因为是国企，总经理背后有靠山，也说不定。所以，'
  merge: -1
  img_proc: true
- pgno: 40
  md: '并不是你把所知道的信息交出去，董事长就会有所行动。所以，知道很多信息不要背负很大的道德压力，兴许，别人早就知道了。


    # 3、在眼里看到的并非是真相。


    很多时候，我们个人看问题会带有情绪，一旦讨厌一个人，就会认为他这也不行那也不行。但是一旦喜欢一个人，就会认为怎么都是好的，职场上这个情况尤其严重。带有主观的判断，而不是基于证据，就会出现大问题，第一比如说情人关系，这个很大层面找不到证据，你按在床上了？第二，利用公司资源自己开公司，利用了什么资源，利用了多少，证据呢？恐怕都是无法用证据坐实的！


    所以，自己没有铁的证据，又无法知道董事长是不是知道情况，还没有任何好处。你说这个事能做吗？经过上述的分析，权谋网给题主一个建议，就是少管闲事，多操心自己价值的提升。让自己过得更加幸福快乐，这不仅仅是为自己，还是为家庭做出努力！


    # 对抗不是目的，权谋是用来寻求利益最大化的。


    【困惑】我一个好闺蜜，在单位里突然被调去养老部门，她不甘心就给领导送了钱，领导拿了钱也没办事，她被逼辞职了，交辞职信的时候领导也没提还钱，她后来找亲戚自己去要的。辞职后单位里对她各种抹黑，她受不了想收拾下那个领导。该怎么办？


    【解析】在职场混的不好，被人给冷板凳，穿小鞋，愤而辞职，心存报复的人，不在少数。都在权谋网的后台询问如何收拾领导，其实大家都陷入了一个误区，权谋就是对抗的工具，其实权谋是跪舔还是对抗都不是目的，而是手段，目的都是自己利益最大化。而很多都是为了图自己痛快而做出非理性决策，比如这个求助的题主就犯了三大错误：'
  merge: -1
  img_proc: true
- pgno: 41
  md: '首先、如果一开始送礼，你会被调到养老部门吗？说是忽然怎么可能呢？很多人都是喜欢临时抱佛脚，而不懂得未雨绸缪。一开始就搞好各种关系，也就不会被调到养老部门。所有认为的突然，其实就是长期上下级矛盾积累的结果，而对自身的错误一无所知。

    其次、你给了钱，只是避免继续受打击，而不是说能给你调回去，自己受不了辞职怨谁呢？养老部门，其实只是领导的一个处罚的手段，你暂时的送礼，人家收下了，让领导觉得你点头认错了，不再继续追究打击，人家惩罚起到了作用。如果过段时间继续讨好，而不是怒而辞职，说不定就有机会。

    最后、走了就走了，还去要钱，人家会不抹黑？有什么受不了的，一路犯错。打击报复只会在错误的路上越走越远，既然不在那边做了，各种抹黑，又有多大影响呢？很多人不是理性控制自己的行为，而是情绪，觉得丢了面子，钱白花了。继续报复下去，自己的收益为零，而成本急剧放大。

    权谋网给这个朋友的建议，就是劝她好好的放下这个包袱，该干嘛干嘛吧。权谋不是用来对抗的，是用来计算利益最大化的。自己都已经辞职了，就重新开始，轻装上阵，总结经验教训，避免未来重蹈覆辙，如果当时不辞职的时候，对抗一下，弄得大家都不舒服，还可能被领导的对手当成武器来用，还有被利用的价值，尚可一战。现在辞职了，说什么都没用了，完全没有实力和利用价值。


    # 能者多劳——其实这些垃圾任务会毁了你！


    【困惑】权谋网老师好。请教您一下，单位的人总是在分配工作时说，你干的快，又干的好，那这个也干一下，所以，手里的东西很多，最烦的是都是同一时期要出来结果。最近很崩溃，提起裤子找不着腰的感觉。而且薪水也是感觉不配套，太低。我该怎么办？希望老师及时解惑。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '《解析》可以说，很多职场新人好人都有这个困惑。为什么最忙的是我，而好处却没多给。不是说好的“能者多劳，多劳多得”吗？我们从权谋角度来分析下，就知道这段话有多么的谬误了。


    # 1、接受的是垃圾任务


    职场的工作分很多种，但是基本就是三大分类，有利益和无利益，有困难和无困难，出成绩和没成绩。有利益、很容易、出成绩的话，人家挤着干，这个大家都在争，基本上，让领导主动安排来的工作，都是那些没好处、易出错、没成绩的工作。所以，一个人的精力有限，如果把时间浪费在垃圾任务上，是不会有啥好处和前途的。在职场不是，不加选择的去做工作，而是要学会自己选择工作，选择那些有油水，没风险，还能出成绩的事。不懂得选择，就会陷入有苦劳无功劳的境况。


    # 2、领导只把你当黄牛


    不少人想，“我做这么多的工作，为领导分忧解难，我会被重视的”，其实这个想法很幼稚。首先好处不可能，你干的越多，越是容易出错，还想多要钱？功过相抵，不批评你就不错了。其次提拔不可能，这里就你一个人在干活，把你提拔上去了，工作谁做？越是干活多的，越不可能升职，只是不断的画饼安慰你，哄一天是一天。最后就是好人缘不可能，你做的工作不是替别人做的，是领导安排的，别人不感恩。只有别人求助你，让你帮忙，你才有人情积累，自己接受的活，谁帮你？谁感恩？


    # 3、我们该如何的应对


    在这里我们要承认，这样的员工不会被开除，裁员的时候也不会。但是我们要知道，职场不是傻干、苦干、蛮干、就行<br>的，干活要讲究策略。第一，要控制干活节奏，要做到张弛有度。不要做的太快，这样会让领导认为你闲着，不能太慢，说明你没能力。第二，要学会主动争取工作，不要被动安排。学会把有好处的工作争取过来，时间被占满，自然就没有垃圾工作被安排了。三，要学会施恩，而不是主动揽活。可以跟领导这么说“我手里的工作很多，你先把事情安排给别的同事，我争取时间帮他做。”'
  merge: -1
  img_proc: true
- pgno: 43
  md: '经过上述权谋网的分析，我们能够看出来，职场其实每天都有干不完的活，如果不加选择，不会拒绝，不懂得处理工作中的人际关系，自己活越干越累，而且越没有前途，直到自己怨气满腹，弄得之前好印象也没有了，得不偿失，劳而无功。


    # 合作的时候如何判断一个人的品？


    【困惑】权谋网老师好，跟一个人合作的时候，如何判断一个人的品？


    【解析】一个人想成功就一定要与别人合作，但是合作中如何保护自己是个很大的学问。不过通常而言有下面三种方法：


    +   1、了解他之前的人品


    一个人成年之后，如果没有大的变故或是利益诱惑，基本上人品是恒定的。因为人生观、价值观和世界观形成之后，没有外部的强烈刺激，很难直接改变，所以我们只要熟悉一个人的过往的历史，熟悉他的背景，就能够做出一个八九不离十的判断。


    +   2、通过交往中的测试


    不过，通过历史了解一个人，对于普通人而言是可行的，但是很多骗子恰恰就是利用了这个人性的漏洞，因为很多都是通过伪造、伪装，来制造一个让人可信的经历和背景或是行为。所以我们就要学会采用各种测试的手段，来撕破这种伪装。恋爱中，很多女孩子就是善于使用废物测试，来考察男人的价值。


    +   3、持术不持信的底线


    当然测试不是万能的，对于骨灰级的权谋老鸟，你的测试，他早就知道标准答案。比如胡雪岩去钱庄打工，扫地时，捡到掌柜故意丢的铜钱，立即上交。这种雕虫小技，是不能测出胡雪岩这类老江湖的。所以后期才有了，收大钱，不交公，而资助王有龄。按道理，老板就不该让他自己去收钱。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '胡雪岩的老板如果坚持持术不持信的话，让两个人一起去，但是这样就增加了不信任的成本，彼此猜忌也很难有良好的合作。而不断地测试，让人觉得你缺乏合作的诚意，让别人不舒服。通过调查背景，也会因为信息问题而产生虚假判断。


    所以我们通过分析能够看出来，任何一种方法都不是完美的，都是有缺陷的，所以，这时候权谋网就建议，要根据合作的重要程度来选用单一或是综合的方法。小事合作，一种方法即可。大事合作，必须三合一。不然，吃亏的就是自己。


    # 不修炼权谋价值观会走火入魔！


    【困惑】您好，可以帮我解惑么，关注您 2 年了，您说的很对，现实是如此，可是我现在感觉都要被权谋吞噬了，心中认为别人的真善美越来越少，凡事都是计算过的，如何才能坚持自己的一点真善美，是否自己坚持的真善美是软肋呢，谢谢！


    【解析】题主的矛盾，其实是分为三大方面的，权谋网详细分析如下：


    1、手段问题。

    学习权谋和追求真善美并不矛盾，权谋并不是我们的目标而是手段，用来实现目标的手段。即使西方如来，也不是只靠念经来普渡世人的。对于不听话的孙悟空，如来没有念经劝善，而是直接玩手段压在了五行山下。通过惩罚到绝望之后，放出来赎罪。唐僧利用感恩之心，还骗他带上紧箍咒，然后改造成自己的信徒。手段不重要，重要的是劝善初心。


    2、价值观问题。

    一头绵羊无论如何都理解不了，狼为什么不能去好好地吃草，而每天去吃羊，干这样血腥的事情。即使理解狼是为了生存不得不如此，作为羊也无法接受这样的手段，所以会觉得被权谋吞噬了。人与人之间最为重大的差'
  merge: -1
  img_proc: true
- pgno: 45
  md: '别也是如此，有的人靠剥削夺价值为生，有的靠生产创造为生。如果不改变自己的价值观，而学习手段，就好比手机安卓系统安装苹果系统插件，必然出现乱码。


    # 3、游戏规则问题。


    这个社会到底是什么样的游戏规则？是合作共赢还是弱肉强食？看看动物世界就会很明白，越是食草动物，越是一群一群的，个体生存能力太差，弱者必然要联合，但是大家都还知道一句话，一山难容二虎。真正的作为食物链的顶端的食肉动物，都是弱肉强食。如果一个人在底层还是多与人为善，团结大多数，让自己快速崛起，等成了领导层，也就必须改变，遵守弱肉强食规则。


    所以说，题主，如果不能认识到手段的中立性、价值观的驱动性以及阶级规则的不同性，就不可能真的明白权谋。也就会内心矛盾，走火入魔。因此，给出的建议就是，抓紧改变自己的价值观，够熟练的操控权谋，才能让自己进入食物链的顶层，才能过的幸福，才能真的有机会追求和实现真善美！


    # 面试你如何看待加班？这么回答最完美！


    【困惑】面试你如何看待加班？


    【解析】现在几乎所有的老板都想让员工多干活，少要钱，所以在招聘面试的时候，都会提到加班的问题，其实任何人心里都会骂，“多给钱，加班不是问题，不给钱，还要加班，这是剥削。”但是口头不能这么说，毕竟，找个工作不容易，领导考察的也是一个人的工作态度，现在权谋网汇总各路高手的回答，并点评如下：'
  merge: -1
  img_proc: true
- pgno: 46
  md: '1、标准版：如果工作需要，我可以加班。因为我刚毕业（或孩子大，或一个人等），时间和精力也比较充裕，可以全身心的投入工作。同时，我也会提高工作效率，尽可能减少不必要的加班。

    这可以说是回答面试官的最基础的版本，愿意加班，不谈条件，同时避免因个人原因导致加班。


    2、主动版：我认为每一件工作都有固定时限，为了不影响进度，不需要等主管开口，自己最清楚是否有加班的必要，但是我会最大限度地避免这类加班的发生，因为这是没有效率的表现。同时，我也想强调一点，作为一名员工，对公司要求的加班或是临时机动的项目我会全力配合做好。

    这个积极主动版的加班回复，一般老板都会很高兴。完全的自动自发，展现以工作为中心的工作观。


    3、条件版：如果真是非完成不可的工作，那我就会加班。我认为，休假日也不一定就该不闻不问地休息。连休假日都需要加班的话，说明所从事的工作一定是相当充实只要是有意义的工作，与其昏昏然地享受休假，不如高高兴兴地来加班。

    这其实是潜在告诉领导，只要非完成不可的，有意义的才会考虑加班。不接受随意加班，通常如果这个公司正规的话，会接受这样的员工，如果有加班文化的话，基本上就不考虑了。


    4、鸡贼版：加班但以后可以得到调休，所以，我觉得不会有什么问题。个人的时间固然重要，但由于工作需要，当然也会出现不得不在休假日上班的情况。我觉得只要是自己分内的工作，就算加些班也不会有人抱怨的。

    这个回复展现出的是作为一种小聪明，调休可以加班，份内的可以加班，这个回复关键看岗位的匹配度，如果是互联网公司，文化类、营销类就行，劳务类老板就不会考虑了。


    5、政论版：对于加班，首先有班可以加说明我所在的工作单位蒸蒸日上，处在发展并迅速提升的阶段，身处这样一个单位我对未来感到一片光明。年轻的我，正是学知识学能力并积累工作阅历的时候，压力和加班虽然有'
  merge: -1
  img_proc: true
- pgno: 47
  md: '可能让我感到身心疲惫，但是，它们却是淬炼我的火炉，只有锱光养晦，才能百炼成钢！


    这就是官场老油子的话术方式，对单位的吹捧，完全不表达自己的真实内心，不过如果是行政办公类的，会喜欢这类人才，如果是技术类的会觉得这样的人会比较浮漂。


    自己加班是能力问题，安排加班是态度问题，除了标准版的四平八稳，让领导考察不出什么来之外。其余的回答，都表达了个人的素质倾向，这个不能说有错，关键是看岗位匹配度。比如应聘办公室主任，政论版的就非常好。应聘业务员，设计师，鸡贼版的就很合适。总之，具体岗位具体分析，既能体现自己加班的态度，又能展示自己的岗位匹配。这就是完美答案的标准！


    # 如何的以弱胜强，斗败权力！


    【困惑】感觉所有的权谋术都是讲如何顺从权力、依附权力、利用权力，在权力面前无能为力，只能任其摆布。面对强权如果退无可退，让无可让的时候，如何进行反击，如何制衡权力、监督权力、斗败权力，以弱胜强，这可能是一个更有价值，更值得思考的问题。


    【解析】很多年前，在研究权谋术之前，我也有这样的想法，为什么不去限制权力，把权力关进笼子，但是多年的实践、观察和思考，最终得出结论，这就是强者的学问。


    +   1、没有什么以弱胜强，强者恒强才是大概率事件。


    历史上之所以推崇以弱胜强，就是因为极少，十个手指头都能数完那些著名战例，而以强胜弱数不胜数。作为权谋家，从来就不会去追求，诸如守株待兔以及对手忽然暴毙，这样的小概率事件。只有依附于权力、资源，才能大概率的翻身，而对抗赢面很小的事情，都是赌，比如买彩票。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '另外，所谓的以弱胜强，也是_FAILED 在局部战场形成了绝对的优势。历史上尽管赤壁之战，刘备孙权合兵击败了曹操。但是这也只是延缓了统一之路，最终还是北方统一了南方。如果不是官渡之战后，袁绍忽然暴毙，即使曹操赢了一次，也是无法支撑后面的战斗。


    最后，所说的弱也是同一层次的弱，而不是不同层次的弱。比如淝水之战，前秦的苻坚和南方的东晋，这是同一阶层的主体，都是独立的国家，而不是内部下层和上层的斗争。这个犹如职场，小公司可能通过局部优势打败大公司，但是员工在内部很难斗赢老板。没事不要命动刀子，这种谈不上权谋。


    # 2、权力关进笼子之后，核心是谁来管理这笼子。


    监督权力、制衡权力，这个是平级的监督，或是更上级的监督。因为这不仅仅是个监督制衡的问题，而是别人为什么让你监督，让你制衡的问题。你只能比他更有权力，更有实力，更有谋略，而不是相反。


    把权力关进笼子，什么样的权力进笼子，这个谁来管理这个笼子。管理笼子本身又是一个权力，这个权力如何监管？权力会给自己头上加紧箍咒？之所以很多人希望限制权力，就是自己没有权力，等自己好不容易获得权力之后，你会抛弃好处？限制权力？其实你痛恨的不是权力，而是自己没有权力。


    # 3、斗败权力需要的是自己拥有更大的权力和能量。


    我们回到这个核心问题，我们如何斗败权力，凡事首先要问自己凭什么？用什么斗败权力？很多人说，忍无可忍，无需再忍，老子不要命了，鱼死网破。你斗败的不是权力，而是某个人而已。


    历史上，刘邦，朱元璋不都是农民出身吗？还是有翻身希望的，没错，这个前提是，刘邦首先依附项梁后来依附楚王雄心，灭秦之后，还不得不夹着尾巴讨好项羽。而朱元璋，也不是自己白手起家，而是成了红巾军领袖郭子兴的女婿，才有了后来的机会。'
  merge: -1
  img_proc: true
- pgno: 49
  md: '他们不顺从权力、依附权力、利用权力，怎么可能在后期斗败其他权力？之所以能够打败其他权力，是自己更加懂得权谋，拥有更多的权力，才能打败权力。


    所以，只能是真心臣服于权力，赢取权力的信任，获取更大的资源，从而快速的崛起。如果自己处于弱势地位，就想着可以和权力斗一下，只能是自取其辱。


    # 刚成为部门一把手，就被副职告黑状，该如何反击？


    【困惑】权谋网老师，刚上任部门一把手，上级领导就告知，被副职告了黑状，该如何反击？


    【解析】这的确是一个经典的职场问题，咱们从身份和手段两大层面分析。一、正副职之间的矛盾，由来已久。


    +   1、正职身份有两个途径，一个是外调过来，原有副职就地转正的梦想破灭，心里不满，觉得是这个新人占了自己的位置，副职会利用自己的原有优势，来给新领导设置障碍，消极执行，故意利用工作不成熟，而设绊子，打黑枪。


    +   2、如果是原地提拔的正职，副职心理会更加不满，因为这之前，大家都是在竞争这个一把手的职位，但是这个副职明显是斗争失败者。所以，既然是斗争失败，自然心里不服外加不满，就整天盯着正职的错误，企图证明不用自己的正确性，以及给正职制造麻烦。


    +   3、不过，还有第三种特殊情况，那就是正职是原有单位的，副职是新调来的。这种情况，一般副职人生地不熟，又是副职，通常都要夹着尾巴做人。但是忽然间来了之后，就到处兴风作浪，这样的特殊正副职斗争情况，其实这是上级对这个一把手不满，故意派人来掺沙子的。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 二、这是从身份上说，正副职天然的矛盾，我们从权谋角度来看这个求助问题，那就是正职从上级领导处得知副职在告黑状。其实这个也是分三种情况的：


    # 1、副职表达作用


    副职通常有两个使命，一个从工作上是配合正职工作，一个是从权力上制衡正职。所以，一个副职向上级告黑状，就是在上级领导面前展示自己的监督制衡作用，这是向上级领导效忠的一个方法。如果只是单纯的表达不满，这样的人，不是具合格的副职，上级领导也不会看得起这样的人。


    所以，如果是展示制衡作用，效忠上级，作为正职积极打击报复，是得不到上级的支持的。如果只是表达不满，这个也无需重视，他自损身价，领导自然明白。


    # 2、领导故意挑拨


    不过上述的说法是建立在告黑状真实的角度而言的，但是职场上风云诡异，不可能把听到的东西都当成真实的，不管是不是自己的上级告知。有可能这就是上级领导为了故意刺激正职，让他和副职产生矛盾，只有挑拨正副职的矛盾，这个上级领导自身的权力才会安全，下级单位才不会铁板一块。


    如果是领导故意挑拨正副职之间的矛盾，去直接贴上去，气愤的搞斗争，上级领导会很开心，这毕竟是他所期望的，但是这对自己未来集中权力，搞好工作，会增加很大难度。


    # 3、领导敲打手段


    还有半真半假的可能，上级领导召见副职，让他汇报正职的当下工作情况。副职没有告黑状的意思，但是上级领导却想借机，给正职一个敲打。作为成熟的权力上级避免尴尬，自然不肯让自己聚集和这个正职的矛盾，毕竟未来还需要很多工作配合，让正职误以为是副职打小报告。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '所以，这种情况下，通常就是领导对这个正职表达工作上的不满，不过是借其他人之口说出来而已。为避免彼此之间的尴尬的手段，作为正职默默的改进工作即可。


    所以，经过上述权谋网的分析，会发现，情况真假难辨，如果贸然的打击副职，会让自己未来的工作难以开展，尤其是自己刚刚上任，还立足未稳的情况，还不是斗争的阶段，而是忍住自己的脾气，打好基础，稳定权力的阶段。所以，综合各种情况，给题主的建议就是，不要明面上和副职搞矛盾，要利用好陷阱任务，给他小鞋穿，让他知道厉害，还无话可说。当然也可以积极的搜集副职的把柄给领导反映，借领导敲打副职。不过最佳的方式，是挑动副职和别人的矛盾，自身利用好权力制衡的手段，来稳定自己权力，打击副职。


    # 领导不懂权谋怎么办？


    【困惑】我从前在一个地方上班，对主管交给的任何工作都无条件执行，哪怕既辛苦又不赚钱的，也毫无怨言，可越是这样，那些别人不愿意做的苦活累活越是给我做，偶尔给我一点好做的工作我也表现的很高兴，很知足，但无论如何，还吃力不讨好，挨骂受气看脸色是家常便饭，反而是对刺头一点，会要滑会给他使坏的人更好，更客气，待遇更好，至少都比对我好的多，请问这又是什么权利心思呢？大约不在乎欺软怕硬，欺善怕恶吧。从前在一个厂里也有类似的经历，主管对敢顶嘴的反而更和气点，对我这样听话服从的动不动就骂。


    【解析】这个问题很典型，领导不懂权谋，自己做的一切不被认可。该怎么办？其实这种情况基本上都是在最底层的管理中出现，中高层很少。我们深度分析下这个问题：


    +   1、不是哪个人都自动会权谋术的。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '很多人当上领导，并不是因为都懂权谋，而是各种机缘成为了主管，有的是通过技术，有的是通过亲戚关系，有的是其他人都走了留下这个资格老 的，再或者上级领导暂时提拔他上来，让他背黑锅。各种原因成了底层领
    导，正因为他们的晋升不是源自自己对权力心思的精通，所以也就不知道 怎么做领导。这些领导在基层最为常见，等走上中高层，资源斗争复杂， 留下来的都是人精了。


    # 2、如果不懂，就要利用他的漏洞。


    我们处处讨好他，他视而不见，反而愈加的当成软柿子来捏，这样努力讨 好没有得到任何好处，正常人也不会继续这样做下去。而那些没事敢顶嘴 的，到处偷懒的，这些小领导不敢招惹，反倒没事干，出入职场轻松混日
    子。这些人的示范效应所带来的，就是原本听话的都不听话了，他的管 理难题越来越混乱。这样不成熟的领导，到处负面激励，最终让管理失败， 这样的领导只能在底层，再也上不去。


    # 3、权谋是顺势而变，非拘泥一处。


    既然底层领导不懂权谋，不知道如何维护自己的权力利益，我们所学的权 谋是不是就用不上了呢？非也！权谋不是一成不变的，而是顺势而为。如 果懂权谋，他需要建立自己的媚系力量，那么我们就通过努力执行告密等
    手段获取他的信任。而如果不懂权谋，欺软怕硬，那么我们就挑拨别人跟 他对这干，最终让他管理更混乱，我们进一步取而代之，既然他不懂做领 导把他打下去就行了。


    所以，我们在职场，并不是只有跪舔这一招来获取利益。而是什么好用， 用什么。既然他对刺头更加客气，对偷奸要滑的更加欣赏，有这样的榜样， 为什么不去学习，而拘泥于固有的手段不变呢？既然他不懂权谋，不懂领
    导之道，为什么不故意挑拨其他人制造矛盾，让他管理更加混乱，我们取 而代之呢？所以，权谋的核心就是权变的谋略。权变就是不择手段，什么 手段好用，用什么！'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 如何摆脱职场老黄牛的尴尬角色！


    【困惑】请教一下q帝，新到一个单位，处处听领导的话，结果就是给安排的工作越来越多，怕拒绝他等于拒绝了权力，最后成为了老黄牛，快干不下去了，该怎么应对这样的问题？


    【解析】乖乖听话，老实干活，却一步步变成老黄牛，活越干越多，而职场收入和地位却没有任何的变化，排除领导不懂权力科学这个因素，职场老黄牛其实犯了如下三个错误：


    # 1、单一价值


    如果只是干本职工作的话，领导眼里，你这是应该的，给你工作了嘛。但职场想加薪，就必须晋升，而晋升的前提不仅仅是本质工作做好，而是要权力工作做得好。在维护权力层面让领导认可，比如，告密，成为领导耳目，及时汇报团队的情况；比如，不怕得罪人，敢于和领导对抗的人做斗争，维护领导权威；比如，积极响应领导号召，拥护领导决定；再比如学会溜须拍马，投其所好，礼上往来，让领导精神愉悦，等等。如果只是在职场做出一个单一的价值，很难让领导另眼相看。


    # 2、不会表演


    一个人在职场默默的工作，如果不会表演和邀功，所做的工作也就进不到领导的视野，其实也就等于没有干。比如，你工作做得很快，自己的工作很快做完了，你在那里闲着，领导自然认为你在偷懒，必然给你安排更多的工作，如果你多汇报，让他知道你的工作难度，没有难度也要找到难度，自然领导认为你没闲着，也不会给你增加新的工作量。再一个，自己做的工作，如果不积极的向领导邀功，也就无法获得领导的认可。很多人认为，领导会主动知道的，不好意思，领导很忙，你不说，没空想到你。


    # 3、糊涂执行'
