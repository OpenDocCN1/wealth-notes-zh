  md: '# 成功的人不可能事门门一百？！


    【困惑】老大看了你昨天的文章，俞敏洪能把新东方做的那么大，能管理的那么好，不懂权谋能成功？这个是不是有点矛盾？


    【解析】在教学群也讨论了，不过问的人太多，整理成文章。还有人给我留言，你还没有俞敏洪成功，你凭什么指点别人？此言差矣，赛道不同，他英语搞的好，不代表就会全手工制作紫砂壶吧，那么紫砂壶的大师没有俞敏洪有钱，就不成功？同样，在权谋赛道，俞敏洪也没有权谋网专业。闻道有先后，术业有专攻。如果你非要抬杠，文章可以略过。即使千古第一帝王刘邦，也不是一个人扛起的大汉王朝。废话不多说，发表观点如下：


    # 1、战略和战术是两码事


    新东方的崛起来源于改革开放的历史机遇，时代的推动，恰好，俞敏洪就站在这个风口，如果不是俞敏洪，也会有李敏洪，王敏洪。有了这个历史机遇，接下来就是战术的问题了，这就意味着，他搞英语的培训不是自己的战略选择，而是他本身就是英语出来了，正好站在了风口，这就是小米总裁雷军说的，站在风口的猪。如果有风，猪都能飞起来，但是风过去了，猪还是猪。之前的战略方向是历史的机遇，所以，无形中他对战略的决断性就没有过成功的经验。所以，能够管好新东方不代表就有把握航向的能力。


    # 2、成功的经验有局限性


    俞敏洪在之前他的书里面，写了很多对政府政策有矛盾的故事，他在内心是远离政治政策的。究其原因是，杀人放火金腰带，一个小人物想崛起，必须要打破固有的利益格局，在那个时代，必须打破政策限制，这就必须对政策政府玩躲猫猫，远离政治，才能不受不良政府人员的盘剥。但是这些成功经验已经过时了，因为新东方的体量规模现在太大了，而且已经是'
