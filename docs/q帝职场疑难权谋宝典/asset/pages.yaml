  md: '# 没有背景关系，如何寻找官场靠山？


    【困惑】老师，官场重要的是靠山，不然提拔缓慢，没有任何背景关系的人，该如何寻找？


    【解析】靠山是个无法回避的问题，拥有巨大的政治资源，自然事半功倍。但是我们没有任何背景关系的人如何的寻找自己的靠山呢，历史上有三种策略，最为有效。不过每个都不容易，这个需要心机、时机和危机的三重加持。


    1、婚姻


    这可以说是普通人最能走的捷径，无论是《人民的名义》里面的侯亮平或是祁同伟都是通过婚姻改变自己的人生命运的。通过自己的努力，表现出的优秀，让上级领导看出你的才华和潜力，自然愿意为其婚姻牵线搭桥，毕竟谁家都想通过联姻把优秀的人才纳入自己的体系内。这个有志于体制内的奋斗者，不要仅凭感情来选择婚姻，一定要带有政治目的，这样的人生道路会顺利很多，古代榜下捉婿也是这么回事。


    2、冷灶


    当别人位高权重，炙手可热的时候，怎么可能轮得到你靠近？即使有机会接近，也会被他身边的权力分食者所嫉妒，立即就会把你当成潜敌打击，所以，想找靠山，就要学会烧冷灶。提前发现那些未来可能会崛起的大人物，这些人的主要特征就是具备一切，有资源，有能力，就是缺乏机遇，这时候就要果断交往，提前巴结，就能未来在别人得道的时候，一同鸡犬升天，比如胡雪岩投资王有龄。


    3、投诚


    先说个极端的案例，三国张绣，第一次投降，杀了曹操的儿子曹昂和侄子曹安民。但是当曹操和袁绍在官渡对抗阶段的时候，张绣再此投降，曹操'
  merge: -1
  img_proc: true
- pgno: 332
  md: '却以礼相待，不再提私仇的事情。曹操还说，是你的到来，成就了我的事业让我展示了胸怀。这就是张绣投靠了最大的靠山，为自己的队伍找到了归属。其实这背后的本质，就是在领导危机的时候，自己主动给他情报，果断卖命站队，会让靠山收为小弟。


    婚姻主要是心机，冷灶主要是时机，投诚主要是危机。心机就是手段，时机就是机会，危机就是事件。把握好时机，在关键的时候，展示出自己的手段，这就是寻找靠山的天时地利人和。这背后，就是把微弱的和政治资源链接的机会，做大做强。如果一个人，婚姻只看重感情，不广结善缘，不敢为危机中的领导出头，怎么可能有崛起的机会呢？当然其他手段还有，不过就不是无资源无背景的人能用的了。


    # 下属克上的唯一策略和五种时机！


