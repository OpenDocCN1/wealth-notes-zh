  md: '异性之间的欣赏，还或者是性骚扰的试探，如何区分是喜欢，还是骚扰呢，这就需要看他是不是故意有一些肢体的接触啊，性暗示啊，或是说一些个荤段子啊，如果是，那就是潜在的试探，这时候，就要果断拒绝，领导你这样，让我很不舒服。


