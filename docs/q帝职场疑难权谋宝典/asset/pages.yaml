  md: '每个高端人脉，都是一个活生生的人，都有自己的私下爱好，这时候，就需要在他喜欢的爱好中做到足够优秀，通过爱好找到交集，完成交际。比 如高端人脉喜欢钓鱼，这时候就需要利用钓鱼的机会接近。如果高端人脉
    喜欢打桥牌，这时候就需要通过打牌认识。再比如围棋，书法等。


    # 5、服务接近论


    伊尹就是通过给商汤做厨师的机会，进入领导视野，逐步的成为灭夏的第一功臣。西汉初年的石奋就是通过给刘邦做服务员，把自己的子孙都送进朝廷做了高官，自己也成为了万石君。历史上通过给领导做太监，做丫鬟最终获取主子的权力成为人上人的，更是屡见不鲜。


