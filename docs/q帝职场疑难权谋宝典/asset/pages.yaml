  md: '培训界的头部企业，现在的二次创业完全和之前不一样，此时，就必须学会理解政策，拥抱政治，只有这样才能利用新的历史趋势，而不是相反。


    # 3、没有人可以门门满分


    俞敏洪的成功是有目共睹的，但是这不意味着任何行业，任何领域他都是满分。从教育行业，跨入到农村电商直播带货的赛道。这是個全新的领域，农业是个民生行业，完全不存在暴利可言，攫取的利润是非常微薄的，水太浅，不足以养活新东方这样的大鳄。中国
    8 亿农民，想着赛道很大，其实不是，多少钱都是毛毛雨，很多互联网公司，之前有投资农业，养猪的，都是雷声大雨点小，基本上销声匿迹。转化原有资源利用原有经验，在自己的优势领域保持自己的地位才是第一位的。


    之前俞敏洪和马云还有个辩论，俞敏洪说，只要教育在，新东方就在。马云反驳说，教育在，但是新东方未必在，一语成谶。俞总不应该反思自己的豪言壮语嘛，现在教育还在，为什么你新东方不在了，是你自己放弃了自己的教育初衷。


    还有要补充的是，很多人骂经济日报的记者，说没资格点评俞敏洪，说一个没创过业的人，点评创业的人，其实这就是不懂政治。我们看看百度百科对经济日报的介绍“《经济日报》是
    1984 年经济日报社出版的报刊，是经济日报社主管的日报报刊，是国务院主办的中央直属党报，是党中央、国务院指导全国经济工作的重要舆论阵地，是全国经济类报刊中权威性、公信力最强的报纸。”这就意味着，批评俞敏洪的声音不仅仅是记者本人，而是整个报纸编辑团队的态度，一定程度代表国家态度，作为国家的经第一经济报，能随便点评一个人？所以，老俞还自己出来反驳，而不是反省，这本身就是心有怨气的态度。当然，俞敏洪是有钱，几辈子也花不完，只能说明之前他做对了，但是这不代表现在做的就是对的。'
