    权谋网：不要和底层争论，没有结果不说，还坏了心情，我们有那点时间不如刷刷抖音看看美女，或者睡一会。有些人一辈子就是贱命，我们无需好为人师，他们这些人愚蠢下去，才是对他们最好的惩罚。


