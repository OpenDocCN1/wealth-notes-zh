    物。只不过，耀眼天才论，彩票运气论，不是我们这些普通人能靠修行得到的。


    # 过节送礼被退回了，该怎么办？


    【困惑】Q 帝老师，春节前送的礼，刚上班领导发消息给我，让我领回去。我该怎么办？


    【解析】过节送礼和求人办事不一样，那就直接领回去吧，不然更尴尬。送礼尽管是成人世界的社交语言，但是，你还要明白，送礼不是为了建立感情的，而是为了加强感情的。送礼拒收，情况很复杂，但是常见的理由有三种：


    +   1、不信任，怕举报出事'
