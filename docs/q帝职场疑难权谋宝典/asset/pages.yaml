  md: '理吧。”第二条就是，“你能力强，多锻炼。”第三条就是“你要大度一点。”这三句话，能够堵他的嘴死死的，最终出内伤！


    # 深度解析一仆二主的职场难题，两个领导同时下达矛盾指示怎么办？


    【困惑】老师，2017 年有一道国考题，是这样的“你单位的正局长和副局长关系不和，一天上班后，正局长让你送文件，但是副局长找你，让你陪他一起办事，你该怎么办？”给出的参考答案是“我会找自己的顶头上司汇报，说明情况，如果领导安排我给正局长送文件，我会找到副局长说明情况，让我的同事代劳我去陪同副局长，如果安排我陪同副局长，我会给正局长汇报，陪副局长在我的工作范围之内，说的同事可以代为完成送文件的任务。”这个答案总感觉和咱们说的不一样，请老师明示。


    【解析】考试和现实是不一样的，这道题考察的目的有三个，首先是考生的应变能力，面对突发情况的思路；其次是，考察考生的沟通能力，如何去组织语言缓解矛盾；最后就是考察内心的阴暗值，看看是不是让社会不良规则所影响。明白了这道题的考察原则，我们就能深入的分析，这背后的逻辑，找到真实的答案和实际操作中的权谋手腕！


    # 一、参考答案三大错误


    # 1、汇报是在踢皮球


    直接给顶头上司汇报，听他的安排，上司傻啊，你的难题，领导会直接接过来变成自己的烫手山芋？你不去得罪人，他去得罪人，这个现实中基本不会出现，因为你即使汇报了，上级领导也会告诉你，“你看着办吧。”因为在职场下级想把难题踢皮球给上级，基本属于政治幼稚。


    # 2、不可能安排同事


    自己安排同事去替自己完成任务，你以为同事都是来官场学雷锋的吗？你没有权力直接安排同事替自己工作，也没有谁会替你去做事揽责任。现实中，同事立即就会给你软钉子“我今天也有任务，帮不了你”因为大家不'
  merge: -1
  img_proc: true
- pgno: 375
  md: '仅仅不会帮你，还都会看你的笑话，领导重视你，就要你出丑。


    # 3、替领导做出决定


    给局长汇报，让同事代替自己工作，能够出色的完成。你这是在教领导做事吗？局里有几个人，领导不清楚？谁有什么能力，有什么背景，有什么性格，领导会不清楚？需要你去安排谁去工作吗，领导最讨厌的就是下属按照自己的想法去安排任务，这是在侵犯领导的选择权。


    # 二、高分答案这样设计


    # 1、按照组织秩序


    在职场最重要的是不是自己怎么想，而是要明确组织的伦理秩序，那就是组织里谁说了算。很明显，组织里作为一把手统领全局，权力不应该受到任何干扰，任何时候，组织的原则就是下级服从上级，即使是副局长也要在伦理上服从一把手。所以，不管有任何干扰，按照组织秩序，听一把手安排。


    # 2、区分事情缓急


    事情有轻重缓急，比如送文件这个事情，就相当于事务性工作。就可以和被送的对象，电话沟通，看能不能推迟到下午，或是明天，毕竟政府的事情，时效都不会太过于紧张。陪同领导办事，这是一件大事。在官场陪同工作永远都比事务性工作重要的多。变不了工作事项，就试着调整时间。


    # 3、明确领导风格


    不是每个领导的风格都一样的，有的领导性格比较急躁，有些领导性格比较民主温和。有的领导好沟通，有的领导霸道，这就要区别不同的领导风格，要试着和好沟通的领导试着协调，看能不能这个事情换个时间再做，或者可不可以由其他人代劳，目的表达自己对领导的尊重和诚恳。


    # 三、权谋高手实际手段


    # 1、谁势力大，跟随谁


    其实这背后，大家都看出来了，真实的职场，这种场景就是个让你选边站队的考察。在职场最怕的就是谁都想不得罪，结果是，谁都不当成自己人，'
  merge: -1
  img_proc: true
- pgno: 376
  md: '最终成为风箱里的老鼠，受夹板气。职场不是谁位置高，谁就势力大，而是要看谁的背景大，支持的人多。必须押宝，选大的这才是核心。


    # 2、谁水平高，听从谁


    势力大，背景强的就一定能赢吗，这个可说不定，因为硬件的因素永远比不上软件，都是领导正副职这样的对抗，基本上就是一种僵持状态，而这种必须势力不相上下状态，能够最终胜出的决定因素就变成了软件，那就是谁的权谋水平高，斗争经验丰富。条件同等下，权谋决定成败。


    # 3、谁最年轻，接近谁


    可能还有人会想，背景一样，权谋一样，属于既生瑜何生亮的状态怎么办，那就来看看谁最年轻，谁身体好，毕竟职场是个长跑，决定性的东西，也不在以这一次两次的职场小事。跟随年轻的身体好的，毕竟未来大家的时间很多，年轻的领导，才有更多的可能和未来。


    # 四、我什么都不清楚呢


    # 1、资源大


    老师，那我刚到一个地方，你说的这些因素我都不清楚呢？那就选资源大的。做哪个事情能给自己带来好处，就优先选哪个。比如陪同领导办事，这个明显就比送什么文件有资源，在陪同的过程中，做好服务工作，很快就能够和领导拉近关系，有了和领导的关系，就能走向职场快车道。


    # 2、伤害小


    但是如果送文件，和陪同领导都有资源呢。不能够两利，相权取其重。那就两害相权，取其轻。看看谁对我们在官场的伤害值大，我们就选择听谁的。不然，我们还等不到明天，今天的坎就过不去。县官不如现管，毕竟好汉不吃眼前亏。过去之后，其他的关系再慢慢修复。


    # 3、关系近


    那么如果上述所有的因素都不清楚呢，无法做出分析和判断，这时候就要依照个人好恶选择了，看看哪个领导和自己关系近，平时对自己照顾，平时对自己关怀，说话好听，或是行事风格友好，因为这样照顾你的人，以'
  merge: -1
  img_proc: true
- pgno: 377
  md: '后更大概率会走的更近。两个关系远的以后大概率难以接近。


    # 五、背后什么职场启示


    # 1、必须选边站队


    职场最忌讳的就是多方讨好，试图谁都不得罪，采用中立的位置，这样没有任何人，把你当成自己人，一旦没有人把你当成自己人，就成了孤家寡人。好事轮不上，背锅有选项。那些想渔翁得利的，是势力平级人之间挑动别人斗，自己中立，不要搞错背景。


    # 2、没人主动帮你


    职场不要试图求人帮你来度过难关，因为这个基本上不现实，职场不是家庭，不是同学，而是利益的集体，大家都在为自己的利益最大化而努力，没人会因为你有难题而主动伸出援助之手，而如果有，那么一定是另有目的，所以，职场有难题，尽可能的不求助同事，会被人暗算而不知。


    # 3、提高个人价值


    官场啊，如果真的没有办法摆脱这种尴尬的被动局面，就要不断的提升自己的价值，有价值的人，永远都会立于不败之地，毕竟组织总是需要有人干活的。一两次的非关键性的事情，并不会带来致命的伤害，毕竟职场拼的是利益，找到利益点，以后总能有机会缓和关系的。


    经过上述的分析，咱們回到这道题上，比较恰当的答案应该是：作为下属，正副职之间的不和，不应该作为自身工作的干扰因素，（回避阴暗值）作为下属就是无条件接受上级的
    工作安排，（表明自己听话，不再给领导找麻烦）我会立即和送达材料的单位沟通，争取换个时间，先陪同副局办事，因为在自己的业务范围内，更能够帮助局里展开工作，（应变能力）组织利益最大化，是我们的工作原则（强调组织秩序大局观）。'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# 职场困惑：吃回扣的正确套路！


    【困惑】老板交给我一个采购任务，能够自由决定这笔费用的花销，我该如何的谋取利益？


    【解析】这是个如何吃回扣的问题，也是职场的经典问题之一。因为做好了，自己能够赚的盆满钵满，做不好，吞下去就会消化不良。正确的吃回扣主要还是分为三步：


    # 1、测试安全度


    采购的背后有多少的利益，领导大概是知道的。如果是领导心腹，因为信任得到这个项目，这是领导的变相施恩，水至清则无鱼，让谁做不是做？毕竟肉烂在锅里。只要能够完成任务，你自己能拿多少，就看你自己的本事。但是特殊情况下，却不是如此。那就是领导并不是很信任，通过采购这个事情来做测试，通过测试，可能下一步进入快车道，也可能是陷阱任务，等着你吃下去，然后被抓住把柄。所以，我们一定要先测试自己的采购项目的安全度。看看领导是不是和被采购的公司有相关的联系，或是背后有人盯着。测试项目安全度之后，才敢自己下手去分割一部门利益。没有这个，最好老老实实的透明采购。


    # 2、设置防火墙


    从自己的手里掌控的资金，神不知鬼不觉的拿一部分出来，这个最忌讳的是直接下手。贪污挪用，可以说这个最容易让人抓住把柄。所以，如何安全的没有后遗症的把钱拿出来，这就需要多周转几次，明面上让别人赚到钱，私下让他通过其他渠道回转过来。这就是我们通常意义上说的洗钱，只要多洗几次，就很难直接追踪到，最好都是现金交易，第三方代为收款。避免金融转账路径的清晰可见。只有设置自身和资金的防火墙，才能够把钱安全的放在自己的口袋里，不然，自己吃下去的利益，短时间没有问题，'
  merge: -1
  img_proc: true
- pgno: 379
  md: '难免会事后其他原因东窗事发，但是如果多洗几次，交易的过程复杂化，就很难追踪到了，自然就安全的消化掉了。


    # 3、平衡利益方


    通过了第一步安全度的测试，能够安全的吃下去；通过了防火墙的设置，也能够顺利的消化掉，那么是不是这笔钱就能完全的属于自己了，高枕无忧了呢？并不是如此，其实周围的人都会嫉妒眼红你，尽管他们拿不到什么证据，但是不怕贼偷，就怕贼惦记，他们都在虎视眈眈的等着你犯错。没有吃回扣的错，也会有其他错，最终自己会失去这个位置，从而丧失了未来继续吃的资格。所以，我们就必须从自己的利益里面，拿出一部分对利益相关人员进行安抚。过年过节送点礼物，或是自己没事请他们吃吃饭，或是直接给他们塞塞红包，只有这样的不吃独食，才能让大家皆大欢喜，自己也能长久的吃下去。


    所以，吃回扣，必须掌握上述的三大要点，要能够知道什么项目的回扣能吃，什么项目的回扣不能吃。不是自己控盘的菜，千万不要随随便便的乱伸筷子。知道了安全的能吃，这之后就判断自己能最大限度的能吃下去多少，能够顺利的消化掉。有了各种消化手段的加持，能够顺利的占有这些财富，但是我们还要跳出自身，站在更大的格局之下，把自己的利益再分配出去，能够保证自己不是吃一顿就被踢出局，而是要能够持续不断的吃下去。因此，我们只有掌握好，上述的三步，就能够把回扣吃的好好的，从此进入收入的快车道。毕竟我们在职场获取领导的信任，目的就是接近资源，目的就是找到资源转化这一天。'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# 第一次受贿大概率被抓，因为没有三大角度打磨！


    【困惑】VIP 群里谈论孙俪的职场电视剧《理想之城》，谈到女主苏筱第一任男朋友的父亲，做开发区主任，第一次受贿就被上司发现，上司上次念他是初犯，让他把钱退了，免了职务。有朋友问到，别
    人为什么受贿多年没啥事情，有的人第一次收钱就出问题了呢。


    【解析】很多人都有这个困惑，这个和说谎一样，自己觉得没有任何问题，自己也反复把话术给思考的完美，但是 一说出去，立即就被人看出来了，其实这个原因很简单，不仅仅是谎言本身，第一次说谎，神色慌张，言辞闪烁，不敢正视，外部的神情出卖了自己。因为第一次说谎的人，心理不能完全适应。明白这个，接下来也就方便看懂了。


    我们再看看受贿第一次为什么最容易发现呢？原因有三个：


    # 1、收钱没经验


    首先，不是 什么钱都能收的，越是有权的人，越是不会贸然的收钱，尤其是大钱，都是一步步的培养自己的赇系做成的。没有经过测试，没有长时间的合作，没有知根知底的把柄把握，怎么可能贸然的收这个人的钱呢？这些人过河拆桥怎么办？其次，自己能独吞吗，任何时候都要打造好利益链条，只有这样自己拿到手，才不会被人嫉妒，才能安全的消化掉。最后是，后遗症排除问题，收了钱自然要办事，这个事情会不会有雷，比如质量问题等，一旦引爆就会牵连出来。


    # 2、领导在设局


    很多时候，官场职场不仅仅是金钱关系，其实还有权力关系，你做上这个肥差的位置，但你不是我的人，我就会想办法把你除掉，最好的方法就是引诱你犯错，让你自己出局。比如《理想之城》这里面的上司很可能就是'
  merge: -1
  img_proc: true
- pgno: 381
  md: '故意让人行贿，最后拿掉他。为了避免目标狗急跳墙，所以低调处理，目标自己被人抓了把柄，自然无话可说，而上司让人送出的钱，自然也收回来了，也没有牵扯到行贿的人。这里面，上司有恩，目标不闲事出局，行贿方没损失，上司成功拔掉非嫡系。


    # 3、对抗没意志


    如果没有人设局，真的受贿了呢？这里面，就要考虑是怎么被发现的。一定要找到症结所在，是行贿者的竞争对手举报的，还是上司审查发现的？是自己做事不干净，还是对方故意诈自己？面对审查，是不是被人掌握了铁证，还是只是吓唬下，看看自己的心理素质？这个可以说都需要把事情考虑清楚做干净，不然收了钱，惶惶不可终日，心惊胆战，被人稍微质疑一下，就心虚的不行，怎么可能不被发现呢，还没拿出证据，自己就主动交代了，这样怎么可能受贿不被查处呢？


    所以说，受贿这件事情，如果没有从小礼物建立信任关系，没有和上司同僚打造成利益共同体，没有消灭证据和后遗症的能力，再加上自己的心理素质不过关，对行贿者和自己的竞争对手没有警觉，上去就直接拿大钱，这就必然出问题，而且是大概率的出问题。


    # 合伙做生意必须抓住五张牌，不然你还是打工仔！


    【困惑】我和一个朋友出来创业，他占 50% 的股份跑业务，我占 50%，主要是搞生产。但是现在过年了，只给我 5 万块，说是大量的账要不回来，要回来的钱大多请客送礼了，合作三年，我觉得我被耍了，我找他几次，都不搭理我，毫无办法，请问老师怎么办？


    【解析】合伙做生意，很多人对股权和控制权一无所知，就盲目的平分合作起来，埋下了更多的隐患。现在市面上大量的关于合伙的书籍，都只讲到了一个合伙协议的股权分配问题，其实除此之外，还有更多的东西，不'
  merge: -1
  img_proc: true
- pgno: 382
  md: '知道如下的五大方面，没有一张牌控制在手里，就无法真的成为合伙人，最终会被踢出局。

    1、人事控制

    很多人做生意的初期，为了省钱会让大量的亲戚朋友进入公司，但是每个合伙人引进的人员多少不一，岗位不一，这就导致了，某一个合伙人的势力会非常的强大，对整个组织有极强的号召力，这样的话语权，不是股份能够解决的。

    2、财务把控

    初创公司不可能有明确的财务制度，还会有大量的隐形公关费用，利润的分配方式，发展资金的提取，有的人想变现，有的人想继续投资，有的利用漏洞贪污，有的把持账目和现金，基本上不控制财务，也就失去了权力。

    3、业务关系

    初创公司，可以说业务是命脉，通过公司集体的钱，大量的公关费用，撬取相应的资源，但是有的合伙人，把业务牢牢的控制在私人手里。故意制造应收账目，自己吃回扣，或是利用业务关系走私单，不断的掏空公司变成自己的。

    4、生产配方

    后方搞生产的一定要有自己的绝活在手里，千万不能因为自己成为合伙人了，认为公司是自己的了，就痛快的把秘方贡献出来。当别人一旦掌握相应的技术，你的合伙人价值就大打折扣，人家很可能接管之后，就踢你出局。

    5、违规把柄

    最后的这个是杀招，也就是说，自己的利益无法渠道得到保证，这时候就要具备掀桌子的能力。也就意味着，鱼死网破的魄力。只要拥有相应人员的把柄，就能够具备这样的手段，这样就会让他们内心忌惮和恐惧。

    很多人看到这里会很绝望，我上述的什么都没有，还掏钱入伙了怎么办？那你还是打工的，只是名义上的合伙人而已。手里什么牌都没有，不能应'
  merge: -1
  img_proc: true
- pgno: 383
  md: '对合伙人之间的算计，基本上手无寸铁怎么翻盘？真的被动的话，就别气愤，偷偷的把上面的五张牌慢慢的抓到手里，不然你在别人撕破脸的时候，束手无策。


    # 什么样的领导值得效忠？


    【困惑】我给领导做了很多的事情，都被他冷血无情的忽视了。老大，什么样的领导才值得我们效忠啊？


    【解析】不是每个领导都值得我们追随的，一个好的领导，不在于好的人品，好的道德，优秀的能力，而是具备下面的三大特征：


    +   1、有极好的官运


    效忠一个领导，首先这个领导不能是一条破船，因为刚上船说不定，就一起沉没了。其次这个领导要有 一定的权谋运作能力，这样能得到他领导的信赖，有更大的提拔机会，追随这样的领导能够水涨船高。最后就是个人素质高，竞争能力强的领导更容易胜出。


    +   2、有提拔的权力


    不是他在领导的位置就有给与下属利益的能力和权力，这个不仅仅是自身位置的影响，还有个人权力的大小，组织的流程规定，以及相关的条件制约。如果你效忠的领导没有提拔你的权力，没有能力给你利益和保护，追随这样的人，他就是想帮助你，都有心无力。


    +   3、理解下属付出


    有些领导是冷血的，他对下属的付出视而不见，或是认为是理所当然，无法理解下属的付出，都当成自己的垫脚石，这样的领导不懂得价值交换，不懂得赡系建设，不懂得示范效应，这样的领导也没有必要去效忠他，因为这样的人不值得我们去付出，这种人也做不大。


    之所以是这三个条件都具备的人，我们才值得去效忠，去追随，核心的意'
  merge: -1
  img_proc: true
