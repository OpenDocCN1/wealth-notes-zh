- pgno: 77
  md: '# 3、我们怎样可以做到像太祖一样阳谋取胜？


    很多人对权谋有很深的误解，好像权谋就是阴谋，阳谋就很伟大一样，其实无论是阴谋还是阳谋，都是权谋的手段，关于办事，尽可能地采用阳谋，大家便于执行。而关于权力，尽可能地采用阴谋，便于减少阻力。不同的事情，需要不同的手段，怎么有利怎么来，不能把手段当成目的，阳谋也并不伟大，阴谋也并不卑鄙。权谋网通常都是把权谋当成牌技来做比喻，如果你手里两个王，四个二，基本上可以明牌来打，但是如果手里的好牌不多，明牌就是找死。好牌多，不需要太多技巧。


    其实对于我们现实而言，作为有钱有资源的人需要学习权谋，因为你不学习权谋，就无法知道别人有什么手段搞你，自己就会没有能力看守手里的财富，很快就会成为别人眼里的猎物，东哥一个简单的仙人跳就让他痛不欲生了。如果你没有资源，那就更加该学习权谋了，你没有资源，还没有智慧，那你凭啥崛起？就凭喝酒时候不吃花生米，喝晕之后的意淫吗？所以，权谋，可以说，是让我们看透了规律，明白了人性，熟悉办事的技巧，只有权谋才能加快我们成功的概率。


    # 你没有资格选择领导，只能适应领导


    【困惑】前几天写了一篇关于唐德宗的文章，有网友留言说“司马光对唐德宗的评价：识度暗浅，资性猜愞，亲信多非其人，举措不由其道，赋敛烦重，果于诛杀，故关外之寇未平而京城之
    (): 先起，于是困辱于兴元.... 对这种昏君有啥好说的？ ”


    【解析】感觉好有道理的样子，昏君有啥好研究的，其实这就大错特错了。


    # 1、没有完美的领导


    可以说每个领导都有不同的经历、学历、经验，实力有大有小，能力有强有弱，所以，每个人在管理的时候，就会有这样那样的偏好，不可能有完'
