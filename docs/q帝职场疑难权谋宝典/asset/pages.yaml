  md: '# 看懂权谋必须跨越三大鸿沟！


    【困惑】看各种历史资料，如何才能像您一样的看的这么深入呢？总感觉浮在表面，摸不到门径！能指点下吗？


    【解析】同样的历史资料不同的人怎么会看到不一样的风景呢？举一个简单的例子，同样是站在丛林里，羊首先寻找的是草，而狼却在看有没有羊。不同的食物链位置，看到不一样的风景。这个例子的背后是三大权谋鸿沟障碍，如果克服了，就能够突飞猛进：


    # 1、阶级鸿沟


    古代的识字率不足百分之五，而能够留下作品的都是精英中的精英，这些书籍背后都是带着明显的阶级的。比如道德经，这本本来就是写给统治阶级看的。让其水利万物而不争，更多的让利于民，能够获得长久的统治。而不是给那些底层人看的，这些人本来就什么都没有，如果不去争，更是一无所有。尽管现在识字率突破了
    95%，但是普通人，脑子里还是带有出身基层的观点。一头羊无法理解狼是怎么想的，无法知道吃肉的快乐。所以，很多 人无法突破自己的阶层视野，只能在自己的思维条件下打转。比如同样是看岳飞传，很多人会为岳飞感叹，痛骂秦桧。但是权谋家却看到，岳飞处处都在触犯权力禁忌。不同的视角，带来的对历史材料的不同把握。


    # 2、资源鸿沟


    为什么穷人喜欢积蓄，喜欢节衣缩食，喜欢日结的工资，究其原因就是自身的缺乏的资源现实，无法让其有更加长远的眼光。因为这月的房贷、车贷、奶粉钱、水电费、穿衣吃饭，到处都是钱，怎么有胆量去花钱冒险，怎么有闲钱学习投资啊。底层思维非常的单一，所以对于获取生存资源的能力非常的单一，除了工作其他的毫无所知，只能单纯的利用自己的脑力、体力去换取生存的资源。这就好比，羊想活着，就只能吃草。但是狼想活'
  merge: -1
  img_proc: true
- pgno: 204
  md: '着，除了吃羊，还可以吃猪，还可以吃牛，狼有着更多的资源渠道。而一旦一个人拥有了权谋思维之后，就犹如开了天眼一般，能够发现资源、接近资源、熟悉资源、控制资源、拥有资源。一旦有了资源的思维，也就放大了自己的生存渠道。


    # 3、道德鸿沟


    因为两千年的封建专制的传统，罢黜百家，独尊儒术的纲常教育，可以说统治者对底层的等级洗脑工作是不遗余力的。所以大家无形中就被这种道德思想所禁锢，做任何事情，都放不开，自我设限。时刻的都是以道德要求规范自己的行为，而不是获取利益和权力为自己的行为的目标。而且传统教育都把追求利益定义为小人，把舍己为人，当成君子之风，束缚人行为的就是道德鸿沟的存在。因此，作为狼而言，吃肉的时候，基本不会考虑到残忍和血腥，而且会享受猎杀的快乐。但是呢，作为羊，却想，为什么就不能安安静静的吃草呢？做狼不累吗？有报应。羊有着自己温顺的性格，和各种内心的束缚，以为自己不去抢别人的利益，做好自己的就行了，狼就不会吃自己，是不是很好笑？


    其实很多人读书，都是在印证自己的偏见，强化自己的错误认知，而不是，不断的提升自己的价值，弥补思维的漏洞。只有我们从阶级权力的角度，从资源掠夺的角度，从放弃所有内心束缚的角度，我们才能够完完全全，彻彻底底的看到权谋，看懂权谋，看透权谋，从而布局自己的人生。


    # 职场的核心是构建利益联盟，而不是亲密关系！


    【困惑】老师，我刚报班进群学习，有个问题一直困扰着我，我是个小领导，对下属也都很好，给他们很多好处和帮助，但是他们都很疏远我，原因是什么呢？'
  merge: -1
  img_proc: true
- pgno: 205
  md: '【解析】你做领导是有误区的,很多人把学校交朋友的那一套带进了职场,试图做一个好人,然后以德服人,自认为下属这样就会听话,立即干劲十足,发誓追随。其实,这怎么可能呢?下属对权力有天生的敬畏感,并不想和领导交朋友,而且他们和领导交往心理压力也比较大。在职场大家构建的是利益联盟,而不是亲近关系。谈的是利益,而不是感情。如何合理的给与下属利益,做好了,就能让他们心甘情愿的追随,绝对执行,这就够了,至于是不是亲近,这个并不重要。在职场,好领导都精通利益输出,这在权谋上有个专门的术语,叫做施恩术,主要是把握这几点:


    # 1、知遇之恩


    每个人都想做一番事业,实现自己的人生抱负,但是却都自认为怀才不遇,尤其是一直在谷底的年轻人,稍微给他们一些个机会,就会让他们感恩戴德。但是这里大家要注意的是,一定要破格才行,或让他知道本来没有机会,是你这个领导主动为他争取的,这才会感恩。而不是他自己觉得,这都是他凭自己的本事争取来的。

    看个袁世凯收服段祺瑞的故事:段祺瑞一生都对袁世凯感恩戴德,忠心耿耿,这源于袁世凯的知遇之恩。据称,袁世凯在创办新军时,相继成立了三个协(旅),在选任协统时,他宣布采用考试的办法,每次只取一人。第一次,王士珍考取。第二次,冯国璋考取。从柏林深造回国的段祺瑞自认为学识不凡,却连续两次没有考取。第三次考试前,他十分紧张,担心再考不上就要屈居人下,心中十分不快。一天晚上,正当段祺瑞闷闷不乐地坐着发呆时,忽然传令官来找他,说是袁世凯叫他去,段祺瑞不敢怠慢,立即前往帅府晋见袁世凯。袁世凯东拉西扯,说了些不着边际的话。临走,袁世凯塞给段祺瑞一张纸条,段祺瑞心中纳闷,又不敢当面拆开看。急忙回到家中,打开一看,不觉大喜,原来是这次考试的试题。段祺瑞连夜准备,考试结果出来,果然高中第一名,当了第三协的协统。这故事还有后话,后来,段祺瑞、冯国璋和王士珍都成了北洋军阀政府的要人。段祺瑞谈起当年袁世凯帮他渡过难关的事,仍感恩不尽,谁知冯国璋、王士珍听'
  merge: -1
  img_proc: true
- pgno: 206
  md: '了，不觉大笑，原来王、冯二人考试时也得到过袁世凯给的纸条，段祺瑞这才恍然大悟。


    # 2、法外开恩


    很多人什么都不缺，如何收服呢，这时候就要等他出错误的机会，或是找机会引诱他出错，只有这样，按照规定必须处罚他，但是做领导的你偷偷的让他过关，这时候，作为落水之人的救命稻草，他自然就会心悦诚服的被感动。如果凡事都公事公办，那么没有人会感恩，利用好下属错误，也是收服人的机会。

    我们看个历史上《说苑·复恩》里知名的“绝缨之会”故事：周定王二年（公元前 605 年），楚庄王经过艰苦作战，平定了叛乱之后，大摆酒宴，招待群臣，欢庆胜利，名曰“太平宴”。正当君臣喝得尽兴时，庄王把自己的宠姬许姬叫出来给群臣敬酒。突然吹来一阵大风，把大厅上的蜡烛都吹灭了，顿时全场漆黑一片。这时有一员武将因垂涎许姬的美色，加之趁着酒兴，
    degenerate去摸了许姬一把。许姬大惊，左手奋力挣脱后，右手顺势扯下了那人帽子上的系缨。许姬将缨握在手中，连忙告诉庄王说：“刚才敬酒时，有人乘烛灭欲有不轨，现在我把他帽子的系缨抓了下来，大王快命人点蜡烛，看看是哪个胆大包天的家伙干的。”谁知庄王沉思片刻，却让人暂缓点蜡烛，然后对众人说道：“今天大家都喝得这么高兴，我看还是都放松放松吧，干脆把头盔帽子什么的都摘下来，那样喝得更痛快些。”

    蜡烛点上以后，酒宴重新开始，庄王照样谈笑风生，始终没有追查那个冒犯宠姬的人。许姬对此感到非常惊讶，席后，许姬埋怨庄王不为她出气。庄王笑着说，人主群臣尽情欢乐，现在有人酒后失礼有情可原，如果为了这件事诛杀功臣，将会使爱国将士感到心寒，民不会再为楚国尽力，许姬不由的赞叹楚王想得周到。七年之后，周定王十年（公元前
