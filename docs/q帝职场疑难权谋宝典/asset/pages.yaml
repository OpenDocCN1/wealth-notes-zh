  md: '维才能得到足够的锻炼。邓艾少年时出去玩就不断的磨练思维，这里可以驻兵，那里可以囤粮食，这边可以防御，所以到了真的统兵的时候，直接就能上手，我们学习权术也是如此。只要不断学习权谋理论和权谋案例，不断用这个权术工具去分析，就能够短时间内小有所成。


    # 权术初学者必须知道的：权谋实操中的五个困惑！


    【困惑】老师，我学了权谋总不自觉分析各种事情，觉得太累，这是什么情况？


    【解析】新手基本上会有常见的五大困惑：


    1、陷入琐碎：对外部反应过度分析


    老大这个动作，代表什么啊，领导这个行为是不是对我有意见呢，是不是有多少种可能呢，今天对我笑了，昨天还没有，是不是有好的信号，今天单独找我是不是拉拢的意思？等等吧，每天一大堆求分析的。我只想说，你想多了，兄弟。领导不都是权谋家，不是哪個动作都有具体的含义的，越往上权谋分析就越有效。而我们在职场，只要大的方向不错，就能崛起，过多的权谋分析，会让你陷入琐碎，权谋是助力，但不是一切。琐碎的分析，和不分析一样，都是权术不纯熟的表现。


    2、陷入犯罪：混淆手段和犯罪区别


    权谋诚然有很多搞自己人的手段，权谋网提炼的这个词叫做，坑熟杀弱。但是很多人却把割韭菜和坑熟杀弱就认为是权谋实操了，这就混淆了，权力手段和经济犯罪的界限。研究权术，不是研究诈骗，很多朋友，不把心思放在权力规律的把握和修练提升上，而是走向了歧途。网络传销、红包诈骗、虚构圈钱，不一而足，权谋是把刀，如果用来做恶的话，要么被砍，去医院，要么被告，进法院。正常的使用就能够升职加薪了，何必用在邪'
