- pgno: 269
  md: '一条，你已经被冷落，占有两条基本上还有挽回的余地，如果占三条以上，开除就是时间问题了。


    # 一、工作接管


    1、让你建立制度，让你的工作详细建档。


    程序员都知道，写代码的时候，最讨厌注释，但是老板都要求必须写，因为这样在你离职的时候，接替的人，就会立即能够上手工作。为了避免开除之后，出现工作真空，所以，领导会呡着你，以完善制度为名，把你的工作详细记录下来，这基本上就是开除的第一步动作。


    2、找几个人做你的副手，熟悉你的工作。


    有些事情，不是通过制度或是文字能够记录上来的，比如很多业务的往来，涉及到外围的人际关系，这就需要有人直接对接和接手。所以做老板的想开除你，就必须以为你减轻工作为名，让你腾出更多的精力思考或是坐办公室，其实这就是让你逐步的交出外部的业务关系。


    # 二、权力架空


    3、去找别人，去讨论你的业务或是工作。


    领导动了要开除你的心思，除了工作之外，就是要逐步的收回给你的权力，逐步的架空。不然你胁众闹事，集体对抗，领导就会很难办，所以，领导会越过你直接和你的手下讨论工作。一来找到新的接替的人，二来，逐步的瓦解你建立的心腹关系，逐步的孤立你的影响。


    4、莫名其妙的，安排你出差，或是出国。


    领导会忽然间觉得你工作辛苦，需要休假放松，给你公款学习或是旅游的机会。这其实就是调虎离山的手段，因为有了这个手段，能够平稳的交接，把离职的影响力降到最低。伊利集团开除牛根生的时候，就是让他去大学学习，回来就没了职位，不过幸亏他能量大，后来创办的蒙牛。


    # 三、公开冷落


    5、不让你参加例行会议，或不让你发言。


    要开除一个中层领导，必须逐步的传递出信号，来削减相应的势力，让大'
  merge: -1
  img_proc: true
- pgno: 270
  md: '家有个心理接受的过程。这就是公开的冷落，不让你参加例行的会议，或是参加会议不让你发言，即使发言，基本上级领导也不闻不问，为的就是给大众传递出冷落的信号，释放上级意图。


    # 6、直接召集你手下人开会，不让你出席。


    等下面的人看懂了领导意思，私下有了站队，或是领导觉得大家心里能够接受，局面能够控制，这时候领导就直接召集你的手下来开会，不让你出席相应的会议了，领导没有说什么，但是这种应该出席的会议不出席，其实就是想让大家公开的表态，为下一步开除打基础。


    # 四、待遇变化


    # 7、应有的奖励，却没有获得任何的表示。


    领导通过上述三大工作，熟悉了你的工作，接管了你的关系，清理了你的势力，这时候，领导就会着手逼着你自己辞职了。于是该奖励的没有任何的奖励，不断的压缩你的收入，这时候，你逐步的就坐不住了，心里不满，这就是职场冷暴力，你受不了你走，受得了就接受低工资。


    # 8、犯小工作失误，却遭到领导大的处罚。


    有些人遭受职场冷暴力，心里受气，一气之下自己就走了，但是如果有些还不识抬举的，不明形势，这时候，领导就会逼着你走，比如平时的一些个小毛病，嘻嘻哈哈的就过了，但是这时候，领导就不会给你面子，而是当众批评你小题大做。让你自己越来越不舒服，逼着你自己走。


    当然，我们上述的写的東西，也要反过来学习，那就是自己做领导了，也不要立即开除人，而是逐步的接管之后，让他自己走，尽量减少离职带来的不良影响。一点点的让他自己没有了重要性和影响力，最终孤立起来，众叛亲离，从而不得不走。职场的学问就是正反双方都要互相学习并且防范的！'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 面对下属的建议，领导会从六大维度考虑！


    【困惑】老师，我精心的调研很久，给公司提了一个好的建议，但是领导直接拒绝了，很伤心，为什么他对这么好的方案置之不理呢？


    【解析】很多人进入职场，都有给领导提意见的冲动，认为需要改进的地方比较多，自己的方案一出手，就能够获得好评，自己升职加薪也就不是梦了，其实这是学生思维，任何组织都没有完美的，都是带病生存。你需要思考的是，为什么会有这种现象，领导为什么不知道，为什么不改进呢？


    因为这背后有三大原因，包括六个维度：


    # 1、改动必然触及领导私人利益


    任何的改变，领导首先考虑的不是组织问题，而是个人利益的问题。新的方案背后的利益要变动，领导个人有什么好处？需要新的执行人，他的心腹能不能完成，如果他自己人无法完成新任务，要启用别人，做领导的还能不能控制住局面？利益问题，权力稳定问题都是领导要首先考虑的。


    # 2、改变原有的方法会遭到抵制


    即使对领导的个人利益或是权力稳定没有影响，但是改变，需要让下面的利益变动，必然有的人，利益增加，有的人利益减少，或是增加了麻烦，这就会遭到利益受影响团体的抵制，从而让原本稳定的和谐的局面出现混乱，这个方法就会被搁浅。所以，领导还要考虑团结和执行的问题。


    # 3、改革既定的运作状态成本高


    组织团结和团队执行的问题即使没有，领导还会接着考虑第三个问题，那就是成本问题。这个成本不仅仅是钱，还包括时间、精力等。另外一方面，如果失败，会给领导带来威望的损失，管理遭到质疑。因此领导想推进一个新的方案，就必须考虑成本问题和损失代价的问题。'
  merge: -1
  img_proc: true
- pgno: 272
  md: '明白了么，一个方案的推进，领导需要考虑这六个维度：个人利益问题、权力稳定问题、组织团结问题、团队执行问题、成本的问题、代价的问题，而你只考虑了一个方案的单一价值问题。最后需要说明的是，即使你的方案通过了，高明的领导也不会表扬你，而是会无视你，打击你，不然你就窃取了他的威望。这背后的原理是，你颠倒了上下级关系，你在指挥领导做事，他觉得没有面子，不能让你出风头。


    # 如何挑动下属内斗，有什么具体手法吗？


    【困惑】老师，购买了咱们的权谋书籍，也明白了，想自己权力安全，就必须挑动下级内斗，我也试过狗争术，扔出利益让大家斗，但是现在的年轻都躺平，没有竞争欲望，物质的刺激并不明显啊，还有什么刺激下属内斗的具体手法吗？


    【解析】你对内斗的理解只处于表面，并没有触及到本质，内斗的本质就是让其矛盾冲突。这个矛盾冲突其实不仅仅是物质，而是人性！这背后主要是基于人性有三大权谋手段：


    +   1、利用身份


    利用鄙视链来刺激身份矛盾，比如大学毕业和底层一步步上来的两个人，必然的矛盾；利用阶层转化刺激身份矛盾，把一个下级直接提拔上来，比原有上司位置略高，这两个人必然都不爽彼此；利用男女性别刺激身份矛盾，利用女人的小心谨慎，来约束男性的粗放大胆。


    +   2、利用恩怨


    有人的地方就有江湖，因为恩怨就是江湖。出生不同、经历不同、视野不同、能力不同、性格不同、做事风格不同、对权力的态度不同、对于发展的认知不同，都会有利益冲突，做领导的，学会挑拨离间，要适度放大他们之间的矛盾，寻找恩怨，放大恩怨，利用恩怨。'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 3、利用竞争


    任何组织的资源都是稀缺的，狗争术，不仅仅是物质利益，尤其是公司权力、行业地位、旅游福利、留学培训、家属安排，这都是最稀缺的东西，要善于挑选能力相同的人，激发他们的好胜之心，让他们为了夺取稀缺资源而斗争。但是，这个前提是选择或是能够刺激有好胜心的人，而那些躺平的就只能使用上述的其他手段。


    权谋家讲究，怎么好用怎么来，分析不同的员工结构和员工心理，选择合适的手段，来挑动内斗，上述的原理大家是要深刻理解的，比如利用鄙视链，不仅仅是大学生和没学历的实干的，还要领导不学无术的亲戚和有能力的员工之间的矛盾，元老派和新兴势力的矛盾，等等。要学会原理，而不是仅仅利用结论，这样才能够把权谋玩出高境界来！


    # 在领导身边如何做好保密工作？


    【困惑】老师，跟着你学了一年多的时间，现在爬到了总裁助理的位置，老总着重交代我的就一句话，要求我“守口如瓶”，我在咱们的课程里没有找到类似的知识点，能给我说下，哪些方面要着重保守秘密吗？


    【解析】能爬到总裁助理的位置，说明你对权谋的理解是到位的，通过了领导的各种考验。领导要求你做到的是守口如瓶，这说明，他也是很懂权谋。因为，保密是作为贴身助理的第一天则。主要原因就是助理这个位置知道太多领导的隐私和秘密，要守住的其实就是下面三个方面：


    +   1、领导对人事关系的态度和意见要保密


    一个组织最为敏感的就是人事关系，领导对某个人的态度和意见，对某个人看法和说法，很大可能就能影响到一个人的职业生涯，所以组织里很多人无所不用其极的手段，来打探信息，试图提前预判相关的走向，所以作为领导身边的人，必须对此保守秘密，不然会让领导陷入麻烦之中。当'
  merge: -1
  img_proc: true
- pgno: 274
  md: '然，很多助理会借机把人事调整暗示给自己的人，从而构建自己的人脉关系，打击异己。


    # 2、领导工作计划以及失误和缺陷要保密


    对于工作安排，领导不开口，就必须永远保持沉默。自己密切接触而感知到的领导的工作计划，一定不能泄密，不然提前公开，会有重重的阻力，不要认为工作的事情不需要保密，这是错误的。因为推进工作，如何展开，这个很需要技术。领导工作中的失误和缺陷，更不能暴露，不然有人利用这个搞攻击，领导有污点，自己也会受到牵连。不能让领导有麻烦，他不开心，自己做助理，工作就不会顺利。


    # 3、领导个人家庭婚姻生活和隐私要保密


    拿破仑说过，仇人眼里无伟人。意思就是说，任何高人在贴身侍从眼里都成不了英雄。领导的个人隐私，包括夫妻关系、子女关系、个人感情、私人交往、个人爱好等，都只能看在眼里，却不能说在嘴上。尤其是现在，哪个领导没有点个人爱好，尤其是和异性的关系，即使知道了，也要学会替领导打掩护，此外，做助理的不能有任何的道德洁癖，不然很快就会被领导猜忌和排斥。


    所以，做助理的，任何时候想做好保密，都要记住三个原则，首先是不断的提升自己的自控力，经得起各种考验。其次是少管闲事，不要主动给自己掏事。第三要学会模棱两可模糊的表达方式。这样就能够保守好秘密，做好自己的助理工作，最后，祝你在新的岗位上，大展宏图。


    # 做领导要不要承认错误？只有这三种情况下才行！


    【困惑】老师，从小就接受教育，要勇于承认错误，但是这几次我主动承认错误之后，上司认为我无能，很多下属背后指指点点，逐步的都不听话了，自己没有威信可言，我迷茫了，难道真就要甩锅，这才能做好领导吗？'
  merge: -1
