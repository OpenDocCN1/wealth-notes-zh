- pgno: 177
  md: '个拿来就能用的书，那我们如何的去学习呢？如何的让自己快速的提升呢？


    # 1、研究职场权力环境


    可以说知己知彼，百战不殆。不仅仅是用在军事上，在职场上同样重要，权谋网不断的强调，一定要做好信息的搜集，完成自己对权力环境的大数据认知。尤其是能够决定自己命运的领导，要事无巨细的观察和搜集信息，比如去他的办公室汇报，要观察他抽的什么烟，喝的什么茶，桌子上放的什么文件或是书籍，他的东西衣服，在哪里做的头发，平时讲话爱用什么词，近期的关注点在哪里？只有自己无限的熟悉自己的权力环境，才能从容有余。自己一抹黑的无头苍蝇一样，怎么成功？这些信息没有人写在书里，没书去告诉你，领导吃饭爱不爱吃辣椒，爱吃什么牌子的辣椒，吃多少辣椒。


    # 2、提升自己专业能力


    现在无论是在体制内，还是在社会上，人员的流动性都比较大，没有人能够在一个岗位上混一辈子。所以专业能力的要求也就越来越强，永远能够让自己获得安全感的，就是不断的加强自己的个人能力，这是谁也带不走的。不要把自己的精力放在和同事鸡毛蒜皮的勾心斗角上，在职场，要维护表面上的和谐关系，不要把喜怒表现在脸上。太多的人被身边的人所影响，和烂人缠斗，浪费自己的时间和生命，无论是做人还是做事，一定要抓住主要矛盾，不断的提升自己的能力放在最重要位置。这样做到无可或缺，才能地位稳定。抽时间为未来可能用的知识进行积累，这样能够从容不迫！


    # 3、带着问题读书切磋


    职场的问题，其实基本上没有特殊性，大多你遇见的难题，别人都遇见过，而且中国几千年的历史记录，阳光下没有什么新鲜事。所以，我们带着问题看书，看看他们这些高人都是面对同样的难题，他们是如何决策的，如何布局资源的，如何厉害计算的。再一个要多认识高人，多咨询，多听课，'
  merge: -1
