- pgno: 268
  md: '但是到了组织的中层，思考分析能力比重就加大了，因为他们主要解决未知问题和意外问题，底层按照相关的流程按部就班就行了。而忠诚必须解决实际操作中的意外和未知问题，这些问题能够让中层的人，牢牢成为组织的核心力量。优秀的中层思考者，既有不可替代性，还要训练人际沟通，才能进阶。


    # 3、职场高层需要协调沟通能力


    而高层是完全的食利阶层，不需要做任何的具体劳动，但是他们主要就是沟通协调能力，因为一个组织不仅仅是物质的还有人际关系的，每个人的价值观不同、想法不同、认知不同、层次不同，这就需要把各种内部的、外部的、犟肘的关系玩抻顺才能发挥最高的效率，有极强的专业能力才能有效沟通。


    所以，我们看到，每个阶层依赖的核心力量不同。很多人底层以为自己懂得操作技术，就能够进阶了，这是错误的，没有创造力，只能按部就班，没有不可替代性，也就不会升职。而中层有了不可替代性之后，很多时候处理不好人际关系，也就升迁无望。但是如果一个人只有人际沟通能力，不具备专业能力，很容易被人架空蒙蔽，早晚也是衰败，逐步的进阶，一层层的训练，才是立足职场最好的策略。


    # 这八种情况，是老板要开除你的前兆，其中冷暴力最狠。


    【困惑】老板要开除员工，有什么征兆吗，感觉自己被冷落了，是不是没开除的前兆呢？


    【解析】你说的这个状况，只能是大概率的有这种可能。因为还需要其他因素对比参看！


    其实万事都有征兆，熟悉事情的征兆就能提前做出预判，在职场被开除，可以说不是一朝一夕，上级会有很多表现，下面有八种情况，可以说占有'
