  md: '所以，作为普通人，先别急着排斥权谋，先向鲁迅先生学学权谋，只有精通了，才谈得上用不用的问题。如果连懂都不懂，就盲目排斥和批判，就让人感觉到太过于幼稚了。


    # 阻碍我们学习权谋的五大障碍，是我们突破阶层的巨大鸿沟！


    【困惑】我想改变自己，从哪里突破？


    【解析】学习权谋是个反人性的过程，因为这是少有人走的路，毕竟社会的精英永远是少数，既然是少数掌握的智慧，作为普通人就有着无法逾越的鸿沟，所以，只有认识到，学习权谋的这五大障碍，才能有针对性的改变自己：


    +   1、原有生活的惯性


    人都不愿意走出自己的舒适区，对自己不熟悉的环境或是思维生活方式，都会内心的排斥，所以，很多人延续父辈的所有的思想观念、生活习惯、收入方式，也就走了和父辈一样的老路。原有的行为，就会得到既有的结果，所以，学习权谋第一个巨大的障碍就是自己的原有生活的习惯、思维的方式必须打破，要以权谋家为榜样，模仿他们的思维方式！


    +   2、长期的弱者带入


    你是什么样的思考方式你就是什么样的人，你把自己带入到领导层、管理人员、统治者的角度去思考相应的行为，很快就能够知道权力心思，而如果不断的弱者带入，感到自己的委屈，不断的寻求对权力的对抗，不断的抱怨，不断的发泄情绪，把精力都用在自己的弱者维护上，这样怎么会花时间提升自己的价值呢，内心仇官仇富，又怎么能够向他们学习呢？对抗上层就是最大的提升障碍之一。


    +   3、个人圈子的封闭'
