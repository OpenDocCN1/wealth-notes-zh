- pgno: 178
  md: '这样能够弥补自己的思维盲点，能够让自己快速的认知到自己的不足。这里最后要提醒朋友们的是，很多人并不是要搞什么历史研究或是职场研究，其实并不需要读太多的书，因为读书越多越焦虑，只有自己带着问题，反复读《资治通鉴》其实就够了。然后就是多多的积累自己身边的资源，这个最有用。


    所以说啊，我们真的混好职场，不是读几本书就能解决一切问题的。读书只能让你学习思考，而不是能立即就用，不想自己搜集信息，不想自己思考判断，不想自己试着决策，就想找到立即拿来就用的答案，这本身就是学生主义，懒惰的思想，这种懒惰，不会有任何的未来！


    # 在领导眼里是不是告密的都是小人？


    【困惑】老师，你在微信公众号 “权谋智慧” 写文章说过，告密是职场获取信任的捷径，但是现在人都讨厌小人，告密之后在领导眼里不就是小人了，怎么还是捷径呢？想不明白！请解惑！


    【解析】告密和任何的权谋技术一样，是个技术活，不可能，不经过学习和训练，直接就能够拿上战场，和别人短兵相接的。如何告密而且不被当成小人呢？主要要了解下面三点：


    +   1、告密内容


    “来说是非者，都是是非人。”大家都看不惯那些背后嚼舌根的人，觉得就是阴暗地沟的老鼠。告密的内容有许多种，在这里不详细展开，需要指出的是，涉及领导的隐私传播的，不能告密。不然你知道领导有情人，你也是死。唯一的告密内容，就是涉及到领导的权力安全，他的位置受到了威胁。至于组织内的经济财务问题，风险极大，很可能领导本人暗中参与，你的告密，恰恰因为知道太多，而被除掉。


    +   2、一击必杀'
  merge: -1
  img_proc: true
- pgno: 179
  md: '告密不能不痛不痒，或者领导认为时机不对，为了顾及相关的利益，无法立即下手。那么，这对告密者是最为尴尬的。因为，隔墙有耳，世界上没有不透风的墙，自己的告密举动，很快就会传播开来，一旦传播开，被告密的人，会直接反扑，或是领导为了先稳住告密者，怕打草惊蛇，向被告密人，表达信任，而直接把告密人交出去。这就意味着，不能够一击必杀的情况下，告密者可能成为斗争的牺牲品。


    # 3、巨大利益


    告密不能为了告密而告密，或是为了表达忠诚而告密，一些个鸡毛蒜皮的小事情，就没有必要麻烦领导了，比如，有些人偷偷拿了公司几包复印纸、虚构了报销发票等等。而是为了领导的个人巨大利益，或是为了自己的巨大利益，或是为了自己潜在的巨大利益，而最关键的就是为了自己的巨大利益，比如扳倒竞争对手，比如推卸重大责任，这时候，是值得冒险一做的，这还在乎是不是小人不小人呢？


    所以为了自己的巨大利益，还会在乎别人说成小人？为了领导的巨大利益，帮他摆脱其潜在的风险，他会认为你这举动是小人？所以，只要掌握好告密的事项，告密的时机，以及告密的动机，也就不会有什么告密就会被当成小人的困惑了。但凡有困惑的，就是对告密本身的认知错误，认为就是背后的搬弄是非，家长里短，这难免就会走入思维的困境。记住，告密既然是捷径，必然高操作，高风险，高收益！


    # 在职场结党和派系有什么区分吗？


    【困惑】老大，你之前讲过，在职场加入派系，才不会成为职场最弱的那个，后来权术文章中有写到，一定不能够让领导知道你在结党？这不矛盾吗？结党和派系有区分吗？'
  merge: -1
  img_proc: true
- pgno: 180
  md: '【解析】拉帮结派，党同伐异，有人的地方就有江湖，说的就是这个意思。尽管我们看到很多影视剧或是小说里，什么都不参与、无欲无求的人最终上位，但是这个在真实历史上的概率微乎其微，因为只有一种情况，无派系的人能够上位。那就是上级为了平衡各方势力，不得不找个中立的出来。但是这样中立的人在位置上，也只是平衡工具，而没有实际权力。

    权力不是一个人说了算的，而是通过自己的铁杆支持者，把自己的权力触角伸到所有地方，来贯彻自己的意志。而如果没有一群自己的铁杆，如何的贯彻意志？作为领导，建立派系。作为下属要加入派系，拥有自己的政治立场，这才会让自己强大起来。用鸡汤文，常说的话，一滴水只有把自己融入大海，才不会干涸。所以每个领导都想寻求自己忠诚的支持者，不断的发展自己的势力。

    你只能加入领导的派系，但是如果你私下结党，自己搞联合，领导绝对是非常忌讳的，因为，一旦下属联合起来私下结党，这必然就会成为势力，而且势力形成之后，一旦利益产生冲突，就会向领导叫板，领导的权力就会削弱。所以，说到这里，大家就明白了，以领导为核心的圈子就叫做派系，摆脱领导形成的圈子就叫做结党。很多时候，一个组织是有着两种性质的。

    比如，你们几个下属围绕自己的中层领导所形成小圈子，内部利益共享，和其他的部门斗争，这就叫做派系。但是这在最高层眼里，就是结党。因为最高领导，都希望所有人都围绕他转，以他为核心。核心之外都该是一盘散沙，这样最高核心才能安全。

    所以聪明人，都会坚定地、公开的支持自己的派系头领，维护派系势力，就会维护自己的力量。但是毕竟自己下级和上级之间有着天然的利益矛盾，很多时候并不一致，所以这时候还是要私下偷偷的形成自己的小圈子，互通有无，互相帮助，这样才能让自己的职场有了双保险。不过，很多时候，不是你想加入派系就加入的，要经过领导多次考察才会带入小圈子的，'
  merge: -1
  img_proc: true
- pgno: 181
  md: '而且，自己也不是想结党，就能结党，人家为什么和你合作联合？这都需要自己展示出极强的实力和忠诚才行。

    权谋是有立场的，是什么阶段说什么时候，什么位置说什么时候的，自己在下位就要偷偷的结党，搞权力依附。自己在上位，就要破党散众，挑拨孤臣。所以说，这一切不矛盾，而是看你是矛还是盾！明白了自己的定位，也就明白了自己该做什么！


    # 为什么职场权谋研究，大多是窝里横？


    【困惑】老师，为什么职场权谋都是窝里横，就不能一致对外？


    【解析】很多人看权谋网的文章，就会有这种困惑，就不能讲一下大国纵横？天天搞内斗有意思？其实哪个男人年少时，不是蒙情万丈，不是指点江山？但是，成熟之后就会明白，天天关注国际局势并不能快速的提升自己的收入，别谈什么国际视野，目前除了五百强高管，基本上国际视野等于扯淡。我们99%都是普通人，我们没有多大的能力去创造出巨大的价值，只能关注自己的一亩三分地，这不是格局低，这是现实。不在其位不谋其政，做好我们的当下，这才是最实际的智慧。而这种智慧，相当一大部份是需要内斗完成的。原因有三个：


    +   1、资源有限，存量竞争


    历史上稳定的时期，远远大于战争时期。企业的创业阶段的时间，也远远少于企业稳步发展的时间。这背后的核心就是增量竞争阶段，和存量竞争阶段。外部矛盾一旦结束，就会立即转入内部矛盾，也就是内部竞争的阶段。因为资源有限，不可能无限的拓展，增加。所以长时间的存量竞争，内部斗争就成了所有资源分配的主流。犹如历代王朝，一两代开国之后，随后就会进入几百年的内斗时期，此时的外部小的斗争，都会转化成内部斗争的筹码。资源有限，就必然竞争激烈。'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 2、权力集中，党同伐异


    因为是存量竞争阶段，蛋糕就这么大，人也就这么多，谁都想多吃多占，那么按照什么规则分配，谁占有的多，谁占有的少呢？这里面有两个问题，首先是谁说了算，其次，如何保证说了算？既然知道问题所在，也就知道答案了，想说了算，就必须权力集中，权力集中，就必然党同伐异，排除异己。只有消灭一切的异议声音，才能维护自己的权力。因为有了权力才能自己说了算，谁不听话，才能立即消除他，才能保证自己的利益落实，所以内斗是分配必然的前提条件。


    # 3、熟悉对手，手段残酷


    资源有限，为了分配，必然内斗，而内斗的手段就和外部斗争有很大的不同。内斗手段特别多，也特别的丰富，原因有三个：首先内斗不能转变kcal内耗，个人利益和组织利益兼顾，不然自己的内斗就会被外部的渔翁得利。其次可以有潜规则，但是不能违背明规则，组织内部可以作弊，但是不能不参加考试。一个组织没有共同认可的规则，也就失去了存在的意义。最后，不择手段的打倒对手，还要公开表现为自己的正义性。不仅仅是权力的剥夺，还要名誉上打倒，让自己，师出有名。


    所以，经过上述的分析，我们就能够看出来，资源有限，存量竞争是常态，为了对存量资源的竞争中，占有分配优势，必须让自己拥有权力，让自己多得的利益得到保护，而为了谋权，必然就会排除异己，残酷竞争。维护利益平衡，维护规则稳定，维护权力正确，在三维护的权力内斗规则下，表现得特别隐蔽，特别残酷，特别丰富。这也就是为什么权谋对于内斗的研究远比外斗多得多的原因。因为外斗就一个规则，胜者为王，成功者不受指责。实力碾压，简单直接。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 权力思维如何训练？——从三大视角入手！


    【困惑】老大，刚报了你的权术培训班，你不断强调的权力思维训练是怎么一回事？


    【解析】权谋的学习和普通学校的教育不一样。学校里的学习方法是，记忆和归纳。而权谋的学习是思维和推理。我们不做任何的知识记忆，而是不断的交流熏陶。通过交流熏陶，不断的形成新的思维方式。这权谋的思维方式，从三大视角入手：


    # 1、阶层视角


    所谓权谋，第一位的就是权力思维，要知道权力心思所在。一旦我们熟悉了权力的独特逻辑和思维方式，操作手法，伴君如伴虎，就不再难了，毕竟深知虎性自然就能够顺利驾驭。但是，权力心思极端的反人性，作为统治阶级的思考方式，自然和我们这芸芸众生的被统治阶级的大脑是不一样的。这个不一样的地方需要不断的熏陶，才能一点点的灌输进去，这不是看几篇文章的事情，而是不360的的不断的扫荡盲点。


    # 2、规律视角


    权力心思是一门统治的学问，上层的人，自然不可能让下面的人知道这些智慧。不然多了竞争者，自己想掠夺资源就不那么便捷了，于是就利用自己的宣传优势、资源优势、权力优势，不断的误导普通人，从而蒙蔽他们的思维和双眼，让他们不能够从真正的客观规律的视角，来处理问题，而是从自己的道德啊，情感啊，情绪啊，来处理问题。比如大的利益都是斗争来的，但是你却被教育成孔融让梨。


    # 3、未来视角


    自古以来，夜观天象学习预测都是被禁止的，为什么呢，因为未来学，是皇家最隐秘的学问，这不是巫术的问题，这背后是对未来预测的事情，凡'
  merge: -1
  img_proc: true
- pgno: 184
  md: '是能够对未来洞穿的知识和技巧都是被禁止的，因为权力安全的秘密也就在这里。普通人从来都是现在看未来，而权谋是从未来看现在。比如，公司有个对你很友好的同事，他能力很强，对你帮助很多。现在看是好朋友，但是从权谋来看，他未来就是威胁。


    权谋思维就是集中在上述的三大视角之上，从权力思维入手，更加懂得他们的心思，能够让上位者更加喜欢我们，从而给予资源和帮助。抛开一切不符合客观规律的干扰，遵从事情的规律，为了目标的实现而权力依附，不被道德情感所约束。最后就是积极地除掉潜在的对手，结交潜在的资源，把所有的问题解决在萌芽之中。只有这样，自己的路才会越走越顺，越来越宽！


    # 做领导的如何分配手里的利益！


    【困惑】刚做领导，每次分配利益，都有很多人不满意，自己很受气，老师，我刚入群，没有来得及听之前的课，权谋方面有什么策略吗？


    【解析】做领导手里握有大量的资源和利益，这是个双刃剑，做的好了，让自己左右逢源，做不好，就会处处受气，各方都不满意。为什么呢？我们详细看看实际操作中的方案：


    一、错误的方案


    1、按劳分配


    普通人的观念，就是谁干的多，谁得到的多，所以很多人口里，都是这句，“没有功劳，还有苦劳，没有苦劳，还有疲劳。”这样的分配，会劣币驱逐良币，有功劳的人，人家得不到利益，心理不舒服，最终都会不干活，人浮于事，出工不出力。


    2、功大多分


    既然按劳分配，优秀的人才不会脱颖而出。那就功劳分配，但是整个组织，'
  merge: -1
  img_proc: true
- pgno: 185
  md: '大多数都是普通人，少数精英天天得到更多，下面的普通人就会怨声载道，大多数人，长时

    间得不到利益，自然就会磨洋工，摆挑子，所以，少数精英撑死，大多数普通人饿死，绝对不行。


    # 3、民主投票


    好吧，那就民主投票。谁的票高，谁分的多，这样大多数就没意见了吧。看起来公平的方案，其实效果更差，因为真正干活的人，哪有时间用于交际，而且尤其是高技术的，性子都比较直，会得罪很多人。这样有能力的人，还可能被嫉妒，更大层面落选。


    # 二、政治的方案


    # 1、利益均沾


    通常的领导，面对利益分配，都会首选这个利益均沾的方案，中国人的习性就是“不患寡，就患不均。”多多少少，大家都要分点。有功的人，拿点。有苦劳的人，也拿点。人缘好，呼声高的也拿点。自己人也分点，有背景，可能闲事的，也要安抚点。


    # 2、轮流坐庄


    但是有些利益，无法大家这样来分怎么办？那就轮流坐庄，反正利益一直有，大家排坐坐，分果果。轮着来就行了，这次是你，下次是他。都不要抢，轮着来，不行就抽签轮着来。这就像，流动的小红旗一样，大家每个人都挂几天，心里都舒服。


    # 3、按资排辈


    有些利益不能轮着怎么办？比如说职位，那 Slice 等等。大家按照进来的资历，都说不出来什么，нализ，这样，很多年轻人，能够有媳妇熟成婆的机会。而大家因为熟着就能够上位，这样的组织也能够取得长时间的稳定，反面促进了忠诚度。


    # 三、权谋的方案


    # 1、优亲厚友


    上述的分案，是解决了领导不置身利益旋涡的问题，但是却无法解决权力'
  merge: -1
  img_proc: true
- pgno: 186
  md: '的问题。毕竟有权力不为自己谋取利，自己还当官干什么。所以更多的领导，更多的是利用上述明规则，来优亲厚友，谁对自己有利就照顾谁：自己的人，人气旺，就搞投票；自己人功劳大，就按功劳分；自己人辈分大，就按资排辈；自己人刚进来，啥都没有，就利益均沾；怎么对自己人有利，就玩什么方案。


    # 2、利益交换


    关键很多时候，没有自己人，或是看不出谁是自己人，或是不需要自己人，怎么办？那就利益交换，我把手里的利益给你，你给我什么好处？我提拔你，我有什么好处。这次大额的奖金给你，我做领导的暗中能分多少？这个出国的名额给你，你要给我什么礼物？同样的利益在手里，做领导的就看谁出的价码高，就会把这个利益给谁。所以，利益交换成了领导最优选的方案。


    # 3、暗箱操作


    很多人会想，这么搞，组织不乌烟瘴气吗？其实很多时候，大的利益都是不公开的。等大家都知道了，都已经是既得利益了，高手都善于暗中操作。放出肥肉大家还不抢？还不各显其能？所以，干脆，有肥肉领导就自己暗中笑纳了，还给你们分？这就是常说的，大事开小会，小事开大会，重要的事情，不开会。为什么这样？原因就是，分配利益参与的人越少越好，最好暗箱。


    所以，做领导的首先要分析自己手里有什么利益和资源，然后善于把自己的利益和资源分配好，这样自己的权力就会越来越大，好处就会越来越多，而下面的人又无话可说。这样，做官，做领导也算算是到位的。大家要细细品味，不然就会如题主一样，焦头烂额。'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# 玩弄权术，路不会越来越窄，而是恰恰相反！


    【困惑】老师，现在是以能骗到别人为荣的时代，但是别人不傻，只会让骗一次，以后收割会越来越难，玩成死局即使后期是真实的，也不会选择相信，路越走越窄，你怎么看？


    【解析】很多人认为玩权术的人，路会越来越窄，众叛亲离，其实这是误解了权术的效用：


    +   1、开放的大环境，更多的迁回纵横空间


    以前是小农社会，自给自足，而且，限制流动迁徙，很多人一辈子就固定在自己的土地上，圈子非常的小，一旦名誉受损，处处抬不起头，依靠道德就能够管理好社会底层。但是随着经济的发达，流动性的增大，一个地方名誉受损，只要不违法，换个环境，照样重新开始。所以越是发达的社会，越不可能使用道德约束，而是通过法律约束。但是很多人的思维还在用道德约束的传统观念，来看待现代人，只能是，不断的被坑，不断吃哑巴亏。


    +   2、没有权谋家，会对一个人反复的欺骗


    你坑人家一次，人家以后还会被你骗？呵呵，权谋家不是傻子，不可能对一个人反复的收割，这样能不被报复？你觉得三国时期，益州的刘璋如果人生重来，会给刘备第二次进川的机会吗？一次就收割到位了，刘备还会花精力继续对刘璋收割吗？刘璋早就什么都没有了。其实权谋家都是如此，对于韭菜，讲究一击必杀，一次就收割干净了，不想，也没兴趣继续收割了，目标已经没有价值。所以，那些认为权谋家会路越走越窄的，是没有考虑权谋家实力强大后有更多选择！


    +   3、权谋家依靠的是自身势力，而非情感'
  merge: -1
  img_proc: true
- pgno: 188
  md: '即使你以后讲真话了，也没有人信了。其实，这个想法很幼稚。首先，权谋家分阶段，一开始什么都没有的时候，只能靠语言忽悠，情感忽悠，但是后期，有实力了，自然直接就用资金说话了，他已经不需要用虚无的东西取信于人。兔死狗烹，你奈我何？其次，权谋家依靠的是实力，而不是感情，有实力洗白后，身边从来不缺乏追随者，有很多想与狼共舞的人。最后，权谋家没兴趣去向自己曾经收割过的人，讲什么真话，求取什么认同，这种自取其辱的做法，是个人都不会做。

    所以，很多 see 看待权谋家，用小农意识的视角，感觉韭菜有反复被收割的价值，而且还会良心发现求取弱者的认同，这都是假想，意淫出来的。因为权谋家，有更加广阔的纵横空间，有更加多的收割选择，有更强实力洗白手段，这样的强者，路只会越来越宽，而不是相反！


    # 如何快速管理那些有能力或有背景，而且不听话的下属？


    【困惑】老师，手下有几个业务能力强的人，不服管教，弄得其他人都不听话，该如何控制局面？


    【解析】越是有能力，有才华的下属，脾气越大，原因是：技术自信，目中无人；难以提拔，心里有气。作为管理者，如何驾驭这类又臭又硬的人，是非常费工夫的。等待机会，给他们设套，最终抓住把柄，让他们屈服，这个诸葛亮利用华容道征服关羽的策略，尽管能够从根本上解决问题，但是时间长，变数多，机会少。尽管套路有效，但是考虑成本的问题，管理者基本不采用。通常大家采用的就是短平快的“杀鸡儆猴”策略。即敲打了他们，又维护了这类人敏感的自尊，让他们有所收敛。


    +   1、选择弱鸡


    我们通常接受的西方管理教育，认为，谁触碰规则，谁就受到惩罚，抓个典型，就能够以儆效尤，给大家做出震慑，但是在职场，整齐划一的管理'
  merge: -1
  img_proc: true
- pgno: 189
  md: '手腕并不合适中国土壤。因为这样做的话，没有考虑到触犯规则人的背景、能力和自尊。以规则的刚性，不留情面的管理，只能让管理者和这些被管理者尖锐的对立。没有被留面子的能人，接下来，处处磨洋工，揍挑子，不配合，会让管理者陷入无人可用的尴尬境地。所以，高明的管理者都是杀弱鸡，捡最软的柿子捏。那些没能力，没背景的，只要抓住他们的把柄，就一下子要使用出雷霆手段。千万找对人，不然意气用事，被鸡啄瞎了眼就玩崩了。


    # 2、足够震慑


    如果你把一只鸡，偷偷的杀了，猴子没看见，不仅仅仅让弱鸡认为你欺软怕硬，心中不满会和猴子走的更近，而且也会让那些猴子认为你，胆小怕事，不过如此，未来更加嚣张。所以，通常而言，杀鸡之前，要吸引到足够的关注，把所有的猴子喊过来，让他们旁听列席，或是参与处理，或是亲自执行。这样做能够一箭三雕，首先，能够在他们参与的过程中，受到警示教育；其次，让他们和被杀的弱鸡形成对立，让弱鸡不满，你们猴子都做不到，凭什么管我？最后，无形中分裂了猴子和鸡的关系，未来他们无法联合，就会被逐步的把猴子给孤立起来。然后，不断的寻找猴子中的弱鸡，循环这个步骤。


    # 3、善后安抚


    在三十六计里有指桑骂槐的计谋和这个类似，但是和这里说的杀鸡做猴是有很大区别的。首先，杀的鸡不是领导的自己人，却有错误的人，就是为了让他做牺牲品，但是骂的桑，很多时候是自己人，或是没有错的人，目的就是让槐听的。其次，程度不一样，杀鸡手段特别狠，不容情面，对猴子产生震慑，而骂桑，程度就比较低了，让槐树受气，无从反驳。最后，也是最重要的，就是关于善后，杀鸡要做猴，让他自己觉悟，还要做出的安抚，以免他们兔死狐悲的潜在反扑，但是指桑骂槐，就没有善后的这个做法，因为程度低，也就不会有连锁反应。所以，整体上，杀鸡做猴考虑的变量更多。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '经过上述的分析，我们能看到，我们管理那些有能力，有背景的人，更多的不是直接交锋，这样会让管理者陷入尴尬，而是寡敲侧击的，照顾这类人的能量和自尊，让他们自我觉悟。为什么中国管理必须用权谋，而西方很少使用，就是，文化土壤不一样，人家无须照顾面子。中国是，要维护面子，又要让他听话，这个很难。


    # 为什么不懂权谋，还对抗权力的，也有成功的？


    【困惑】老师，看了身边以及很多人的故事，他们不懂权谋，很多也违背了你说的权力规律，但是他们也上位了啊？那些上司领导也不拿他们，怎么样啊？这是什么原因？


    【解析】是啊，我们经常看到有人看了权谋文章之后，抬杠，我就是敢跟领导对着干，而且还做出成绩了，三年时间搞他下马。每次，我看到这些的言论，都嗤之以鼻，这类人，就好比，偶然买一次彩票，中了几千块钱，然后就自己觉得摸到了成功之道，到处宣传，貌似花了两块钱就找到了规律一样，这种井底之蛙的浅薄，用一个低概率的事情给大家传道，工作干什么，两块钱就解决了，这种人，其实不是蠢就是坏！为什么有不学权谋还能上位，或是成功事情呢，主要有三点：


    +   1、低概率的幸运儿


    这个社会所有规律都是大概率情况的总结，而不是百分百的确定，包括人类基因，大概率的传承中，还有低概率的变异。任何事情都有例外，但是这个例外，并不是通则。这个社会有很多幸运儿，他们的成功之路并不可以复制。遵守权力规律，是大概率的职场成功学。比如唐朝的名将哥舒翰，40岁之前喝酒泡妞，因为被首都派出所的所长所欺负，后来，发愤图强，转身就成了大将军。这种事情，除了肯德基老老爷能70岁创业成功之外，没有谁有这样的幸运了，我们权谋家追求的是大概率事件。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 2、上级是权力白痴


    权谋是一门学问，没有人能够天生的精通权力规律。很多人，因为幸运，比如，和领导的关系，再或是自己父辈资源交换，再或是临危受命，很幸运的走向领导岗位，但是这样的人，并不是说自己爬上了位置，就自然而然的精通权力规律。所以，对下属毫无驾驭能力，面对下属的各种对抗权力，挑战自己权威的时候，因为手段问题、心态问题、认知问题等等，导致对下级错误的处理，让违背权力规律的人，有了一定的生存空间。很多人不断的犯错误，而能够活得很滋润，就是上级是权力白痴。


    # 3、内外环境的加持


    每个组织都有创业阶段、竞争阶段和残局阶段，尤其是开始的创业阶段，很多老板或是领导，第一次做领导，受到西方的民主思想影响，或是自己之前打工的思维影响，对员工一开始都是称兄道弟，对各种不良的现象容忍度比较高，喜欢用钱或是感情来解决问题。在外部竞争阶段，因为外部的生存的压力，必须启用有能力的人，来做出成绩，做出业绩，不得不容忍这类人的各种不服。在残局阶段，大家都各自自保，都在考虑自己的后路，谁还去得罪人啊，你违背权力规则，也没人去搭理了。


    因此基于上述三个原因，很多人就混的很滋润，或是成功的对抗了领导，再或者自己还会暂时的走向领导岗位，但是这个不说明什么，因为，权力斗争和任何的斗争一样。在绝对实力、环境大势和上天垂青面前，什么手段都没用，都是螳臂当车。但是我们作为普通人，没有绝对实力和足够的运气，还是老老实实的修炼自己的权谋能力。如果，因为偶尔捡到一只撞死的兔子，就天天认为守株待兔就能成功，岂不是痴人说梦？'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 为什么奖罚分明这么难以做到呢？


    【困惑】老师，所有的管理书籍都在强调奖罚分明，排除了那些出于个人私利，无功行赏，小功大赏；为了泄私愤，而无过处罚、小过大罚的情况，为什么很多好领导也做不到奖罚分明啊？这究竟是什么原因？


    【解析】人不是执行规则的机器，所以除了个人恩怨之外，影响奖罚的主要是人性的三大错误认知：


    +   1、不良印象，纠缠旧账


    人与人的第一印象真的是非常重要，心理学上说的“首因效应”就是如此。因为先入为主，所以形成刻板的认知。尤其是领导，对下属的接触时间很少，而且精力也不会用在不喜欢的人身上，基本上都是选择性忽视。既然都进不到领导的视野范围，也就不存在奖罚。即使做了对的事情，也会被之前的旧账所影响。三国时期，甘宁做过ungu贼，后来尽管多次为黄祖立下大功，但是总是视而不见，最终甘宁被逼反，导致黄祖兵败身亡，做领导的都无法避免自己对人的喜好和偏见。


    +   2、一时之怒，情绪难控


    上面说的是没有和领导建立正常的沟通关系的，即使有功劳也会视而不见。但是错误的时候，却又是另外一种景象了，因为领导对下属缺乏了解和包容，没有信任和认同，所以看到其犯了错误的时候，就会情绪难以控制，立即就会暴怒，受到暴怒的情绪影响，就会做出加大处罚的决定。唐朝时期，武卫大将军权善才误砍了昭陵（李世民坟墓）的柏树，唐高宗，大怒之下，认为权善才让自己不孝，必须要杀了他。后来经过狄仁杰的苦苦哀求和辩护，才让权善才免于一死。


    +   3、标准错误，误判行为'
  merge: -1
  img_proc: true
- pgno: 193
  md: '是对还是错呢，很多时候，因为大家所处的位置不同、思维能力不同、综合认知不同，上下级之间就会出现做事的判断差异，很多不听从领导指挥的行为，都会被认为错误。尽管事实上领导是错误的，但是下级辩论之后，被迫执行，即使，执行的结果是你按照领导的指示行为，失败了，领导同样会认为你是消极怠工，故意失败，而不是领导认为他自己错了。比如唐朝安史之乱，名将哥舒翰镇守潼关，是攻是守，唐玄宗和哥舒翰的判断并不一致。最终哥舒翰被迫出征，却身败名裂。


    经过上述的分析，我们能看出来，奖罚的确是个很难的事情，不仅仅是克服自己的私利，更重要的是摆脱自己固有的偏见，控制自己的情绪，提升自己的决策水平。而这三点，基本上都是人性的固有缺点、弱点和盲点，因此，想做好奖罚，真的是太难的一件事情。


    # 人的思维有三层，普通人只能够对感知到的才能理解！


    【困惑】近日因为冷链不断的出现冠状病毒阳性，于是网络上，大量的反对声音，下面这一段留言，点赞量很高，极具代表性：“不进口冷链能死，还是不吃进口冷冻食品能疯？非要一遍一遍的以身试险？”老大你怎么看？


    【解析】其实很多人都像是单细胞的草履虫一样，思维简单，能接触或是感觉到的事务，才能认知，凡是，需要逻辑和抽象的东西，就茫然无措，其实不仅仅是冷链，进口产品的背后其实是有三重内涵的，普通人只看到的第一层：


    +   1、欲望需求——感知思维


    普通人只能看到，吃冷冻食品这个层面，因为这是最为直观能够感觉到的。社会的进步，就是针对每个人不同的需求，随着经济的发达能够得到个性的满足。说的简单点，吃萝卜白菜，也饿不死，但是为什么还要吃牛羊肉'
