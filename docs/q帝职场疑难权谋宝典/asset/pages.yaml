  md: '有个段子说的，你身边是什么人，你就是什么人，厨师的圈子都是厨师，律师的圈子都是律师，农民工的圈子都是农民工，基本上，大家的收入、思维、生活都差不多。所以，如果一个人想改变自己，就必须走出去，结识新的圈子，认识新的人，交往新的关系，而且自己的关系要不断的精简淘汰，升级换代，只有这样，自己的人生才会逐步的提升，而不是原地踏步！


    # 4、风险承受的能力


    很多的社会经验不会是凭空学会的，要么是自己的父辈已经走过的路，能给我们指点，避免各种陷阱，而大多数家里人，都认为只要供应上学了，毕业就该自己混了，家里人基本无法给出具体的人生建议，最多的是，如果你累了，就回家吧，妈妈给你做好吃的。如果我们自己去摸索，我们就需要花费大量的精力和财力。所以面对失败的风险，很多人就不敢尝试，也就导致故步自封，不敢改变。


    # 5、沟通能力的缺乏


    其实有个现象，越是底层的人，词汇量越是匮乏，不善言辞，感觉很木讷。前几年有个“蓝瘦香菇”的段子就是这个现象的最好解释。一个底层的孩子，因为失恋，生活困难，录制了一段视频，翻来覆去就“难受想哭”什么都说不出来，越是底层的人，越是不会交际，都把时间精力用在了干事情，天天埋头钻研具体的事情，而不是研究人，不会和人沟通，如何能够爬上去呢？


    所以，上述的五大障碍，牢牢的困死我们的当下状态，让我们基本上接触不到权谋，接触到权谋，也不相信权谋，相信权谋，也不会使用权谋，使用权谋，又不想改变自己的价值观念，最终让自己痛苦不已，原地踏步。因此，我们如果意识到自己这些不足，就能够让自己沉下心，好好的学习权谋书籍，听权谋课程，最终让自己不断的改变，从而彻底的摆脱底层的束缚！'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# 斗争失败，残局下，如何翻盘？


    【困惑】我和另一个外行的同事外派负责一个外地项目，前期筹备工作主要是我在负责推进，这也是我本职专长，另一个外行的同事很少参与工作，而他利用机会给总部领导送礼，且背后诬告我与项目公司领导走得近，为此总部领导借题发挥批我一顿，晋升他为分公司部门负责人，并把工作主导权由他负责，在日后工作中对我发号施令，形成外行指挥内行局面，我该如何改变当前被动的局面，获得工作中的主导权？


    【解析】冰冻三尺，非一日之寒。在你最优势的时候，都被人打的落花流水，然而，目前想在处于劣势局面下，通过技巧翻盘，基本上没有可能。权谋只能治病，不能救命。不过还有一线希望，我们先分析问题所在，进而才能找到方向所在：


    # 一、你与别人能力上的差距


    +   1、你把人家当同事，别人把你当成敌人


    你的权谋认知，基本和别人是云泥之别。因为稍微有点权谋思维的都会知道，这种项目前期做完之后，必然后期有权力之争。这就意味着，合作只是暂时的，而斗争却是必然的结局。你在努力工作的时候，别人已经提前开始下手，你还在把人家当同事，一起合作的时候，人家已经准备背后捅刀子了。


    +   2、你关注项目推进，别人关注领导关系


    一个人的时间、精力和资金都是有限的，用在哪里，在哪里必然会有超出一般的回报。你努力去工作的时候，会在工作上出成果。而人家把自己的精力时间和钱花在领导身上，自然而然和领导之间的关系就会更加亲密。所以，在领导眼里，会认为和别人沟通更加的顺畅，更加的方便，而不是和你。'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# 3、你关注工作主导，别 人关注发号施令


    到现在这个阶段了，你关注的还是人家外行领导内行，自己要获取工作中的主导权。而人家关注的是发号施令，人家对权力一直牢牢掌控，这就是差距，你一直关注的就是做事，而人家一直关注的就是权力，这么有权力意识的人，能够让你轻松地翻盘吗？想想就知道翻盘的难度了！


    # 二、你与别人操作上的差距


    # 1、为什么能力不强，却和你一起做项目？


    人家为什么能力不强，还会被派来和你一起做项目啊，目的就是利用他来监控你。你想啊，你工作能力又强，如果还让你做一把手，这对上级领导是个很可怕的事情。因为，你有能力，还有权力，再有威望，这个项目公司就成独立王国了，上级可能要失控，所以不可能让你成为一把手。


    # 2、为什么人家送礼，你知道却无动于衷？


    人家没有超强的技术能力，自然就把心思放在和领导关系的构建上。而且在职场最核心的因素不是工作能力，而是和领导的关系，想在职场混的好，就必须抓住这个权力主线。而你本來具备很强的优势，但是却自动放弃与领导的汇报和沟通，从而让
    人家通过汇报窃取了工作果实，太可惜。


    # 3、为什么人家诬告，你却毫无反击之力？


    人家知道你有专业能力，于是在不断的搜集你和项目公司勾结的证据，成功的让你在上级眼里成了吃里扒外的形象。而你在面对别人攻击的时候，毫无反击能力，缺乏有效的打击手段，除了内心骂别人是小人之外，没有任何的手段。这就是只会工作，不会斗争的人，是无法保护自己的。


    # 三、具体翻盘你需要做什么


    # 1、构建上层关系


    一个人想在职场混的好，首先就是要构建自己权力关系，即使做出工作业绩，也是为了加强和权力的关系。如果不能和领导搞好关系，即使通过手段把这个竞争对手挤走了，自己也不会占有这个位置，领导还会空降一个人过来。领导不仅仅是要业绩，更要自己的组织掌控力。'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 2、不要表面对抗


    你从内心认为别人是外行领导内行，又认为别人送礼，以及对你攻击，以你的性格，绝对会在工作上和别人产生冲突和矛盾，所以才会有要回主动权的想法。但是你的对抗情绪会不自觉之间的传递出去，让你的对手对你深度设防，一旦对你设防，你就无法出其不意，攻其不备，低成本的打到他。


    # 3、择机埋下地雷


    获得领导的信任，不和对手对抗，要麻痹他，这样才能够趁他不注意，在工作中不知不觉的，埋下雷，然后引导你的对手去踩雷。一旦雷引爆了，你就趁机落井下石，扩大化他的错误，让事情无法挽回，接着你就要动用所有的关系，让这个错误广泛传播，从而逼他走人，这样自己才能收拾残局，火线上位。


    一个人的被动局面，都不是一朝一夕形成的，有个人的权谋意识问题，有对竞争对手毫无认知的问题，有对工作毫无清晰方向的问题，还有时机的问题，资源的问题，等等。到了残局了，第一步还是先反思自己的错误，别一味的指责，还要找到自己要改正的地方，最后要砸盘玩法。


    # 如何扳倒顶头上司，秘诀在于三大准备！


    【困惑】老大，怎么扳倒顶头上司？讨厌死他了！不堪折磨，望指教！


    【解析】权力影响力，很大层面源自合法伤害权，所以，没有人喜欢被人管着，几乎所有下级，对权力拥有者都充满着反感，内心想打倒他，或是取而代之，这种心理太正常不过了。尽管权谋网一直强调的是依附权力，获取资源，不断的提升自己，但是并不是说，我们就不能扳倒上级。尽管很难，但是还是有方法的！


    # 1、心理的准备'
  merge: -1
