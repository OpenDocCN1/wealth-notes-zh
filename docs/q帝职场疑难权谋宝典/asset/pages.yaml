- pgno: 387
  md: '情况，下一步该如何推动是好，是去学校门口堵他，还是直接去家里送礼表明态度。还是再找副秘书长作为中间人推动合适呢，（Z 书记和副秘书长应该是一直有职场互利互助的关系）今年遇到老大是我人生中的贵人，求老大指教具体手段和话术。


    权谋网：你这事干的比较急躁，酒桌上的话你不能全信，只能私下再找个机会单独请客，让秘书长喊出来私下沟通沟通如何往前推进，听他的安排，而你呢，却主动跑过去。打乱了人家的部署，人家可能欣赏你，但还没有到，现在立即给你解决这个程度。政府调动需要机会和借口，你这一直往前推进，属于强人所难。到处都是摄像头，手段极不成熟。你该给他说带了几盒好茶叶，在下面车上，我一会儿怎么给你？上面的事儿你犯了三个错误，不会送礼疏通人际关系，不理解权力运作的心思，办事过于急躁。你如果再去堵门的话，关系基本烂掉了，没人敢用你。另外：调动人的事儿可能签个字就过去吗？拿你的钱办不成怎么办？等有了眉目了，自然有你表示的机会。没有运作空间和机会，人家不会给你打这个招呼，但是你这搞得太急躁了，刚想和你谈恋爱表示个好感，你马上想和人家结婚上床生孩子，谁都怕。现在再通过秘书长缓和缓和关系，过两天请吃饭，拉拉感情等待时机，有机会了人家自然会调动你，你要听从安排，别再盲动了。


    # 5、机会多寡，也是选择时候的重要筹码


    学员：老大，您好，您的忠实学生，请教您一个问题：现在有一个从新疆电信到北京的电信集团的机会，我们家在新疆，收入 29 万。到北京收入 58 万，但租房 8
    万。新疆到北京收入共计提升 21 万。我普通学校研究生学历 35 岁，媳妇专科学历 33 岁，女儿 3 岁。我们在北京没有户口，也没有房子。深圳乌鲁木齐各有一套房贷，月供
    2.15 万。如果看 5 年后，请问您觉得这个选择值得吗？老大，您高瞻远瞩，是我的精神领袖，请您帮我看看。


    权谋网：选择不是看现在，而是看未来，什么都一样的情况下，机会多寡'
