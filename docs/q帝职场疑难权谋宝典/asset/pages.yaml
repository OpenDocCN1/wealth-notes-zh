  md: '# 职场中新员工总是被老员工压着干不起来怎么办？


    【困惑】我是应届生,刚实习不久,我发现带我的老员工总是处处压着我不让我学太多东西,也不知道是因为怕我学太多适应不来还是怕我做不好什么的，很多事情她都自己动手不让我碰，有的其实是我份内的她也做了。但是主管却总是说我做事不积极总是依赖别人,这种情况我该怎么办？


    【解析】这个问题是很多新人所面临的最常见的问题。


    为什么会出现这种情况，我把背后的真相告诉你，你就明白了。


    # 1、职场没有老师只有同事。


    很多人初到职场，就觉得老员工有义务教自己怎么做，其实这是错误的，大家在职场不是学校，这里除了老板都是员工，大家都是打工的，没有任何人有教别人的义务，大家都是通过完成自己的工作拿到薪水的，所以你希望别人教你东西，做你的老师，基本上没人去做这个出力没工钱的事情。大家都是平等的同事关系，越早明白越好。即使有东西想教你，也不是因为工作关系，而是你私下对他比较好，人家在私情的条件下带你。


    # 2、工作范围就是势力范围。


    很多事情不让你碰，人家做的很对。因为工作范围很大层面就是自己的势力范围，自己的势力范围轻易的让你学会，他岂不是自己的领土被入侵？如果这个警觉度都没有，直接教会你，他坐什么工作，他没工作，或是很快被你排挤出去，他还有什么价值，你现在其实就是他潜在的竞争对手，人家怎么能够不堤防你。你该自己主动的去做一些事情而不是等待别人的安排。在职场没有人能够没利益的情况下帮助你，你只有自己奋斗，才能做成职场达人。


    # 3、面对主管应该主动沟通。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '领导误会你，本源不是老员工的问题，也不是领导的问题，而是你自身和领导沟通不畅的问题，你没有把自己的工作情况主动汇报，别人只能通过其他渠道了解你，所以所有的误解源于沟通不畅。职场不是学校，没有人主动去发现你，而是需要你积极的和领导沟通才能被发现。所以早请示晚汇报，这是必须的工作，假清高，只能让你的职场之路越走越窄。


    所以职场新人，一般都会面对职场思维转化的间题，尽早的把自己从学生的思维，职业化起来，越早转换越早适应这个社会。


    # 两个领导对布置给你的工作有分歧该如何处理


    【困惑】本人在销售部，领导两位：销售部长 A，销售总监 B。


    +   1、部长 A 业绩突出，跟总经理有亲戚，是楼主的直接领导，楼主的工作是协助部长 A，负责某区域，收入多少基本上部长说了算；

    2、总监 B 资历老，职务上比 A 高半级。


    部长 A 接管市场后，销售额突飞猛进，背景比较强硬，跟总监 B 有利益冲突，两个人明争暗斗。但是楼主作为基层业务员，日子就苦逼了。比如说：部长 A 让发货，楼主拿着发货单找总监签字，总监
    B 不给签（部长发货是有些违背跟客户合同的），然后部长 A 说不用管 B，直接发货！！那么问题来了：1、我如果按照流程，请示总监，总监 B 会马上找部长 A，部长
    A 会怪我多事（之前有过一次这样的经历）认为我跟他不一路，我早晚完蛋；2、我如果听部长 A 的，不请示总监 B 直接发货，总监 B 分分钟也能整死我。该怎么抉择？


    每天都在面临着这种问题，左右为难，每天不是被这个领导骂就是被那个领导骂，请教该怎么办？


