  md: '可以找到更优秀的，只不过在招聘的时候工资单多填几百块钱而已，人才常常认为自己就是对的，从做事的角度去指挥别人，就让同事很反感，同时觉得你说的都对，但我心里不舒服。所以这种人到处得罪人，不被人喜欢，也就不足为怪了。


