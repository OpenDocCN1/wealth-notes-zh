  img_proc: true
- pgno: 134
  md: '# 1、身份调整：从平等地位，到上下分明


    之前的朋友关系或是同学关系，这都是平等的关係，大家不需要顾及身份的问题，但是到了职场，老同学成了上级，这就必须在内心里认可这段上下级关係，而不要内心觉得不舒服，觉得怎么老同学这样，成了领导就翻脸不认人了。其实这不是领导同学的错，而是你自己没有认清楚的身份和位阶。只有知道自己的应有的位置，也就没有那么多的怨气，从而能够迎合权力。


    # 2、关系调整：从感情基础，到利益同盟


    共同的学习，长时间的相处，同学之间打下了深厚的感情基础。但是一旦处于职场环境，这个基础就变了，变成了共同的利益。只有利益一致才能够有更紧密的关系。而如果依仗着彼此的感情，不断的做出有损于利益的事情，很快这个同学关系也就走到了尽头。所以，要立即调整自己和这个老同学的关系，大家不再是感情为基础了，而是利益。必须维护利益，而不是感情。


    # 3、语言调整：从无所不谈，到有所顾忌


    因为彼此之间知根知底，很多陈年往事，都会在不经意间提起，如果是辉煌的事情尚可，但是很多时候自觉不自觉的，会提起老同学的青葱岁月，之后会成为职场的八卦，还有人故意吹嘘知道老同学的隐私，来展示和老同学的亲密，这恰恰就犯了忌讳。所以说，同学之间的那些玩笑，以后都不能开了，要学会有选择的说话，而不是口无遮拦，到处散播领导隐私。经过上述的分析，我们如果能够照着做，就能够快速的适应新的职场。其实这不仅仅是在老同学之间，去亲戚那里面打工，也是要按照这样的套路，只有这样，才能够更加亲密，而不是逐步的互相埋怨，直到互相撕逼！'
