  md: '“怕拒绝领导等于拒绝了权力”，没错，任何阻碍执行的人，都会被领导视为异己。但是执行有执行的艺术，在执行的过程中，要学会攫取资源，比如获取更多的授权，获取更多的资源支持，获取更多的公司信息，增进和各部门的来往，要主动争取优势的任务，主动推荐让自己心里不舒服的人做垃圾工作，当自己成了不可或缺的人之后，就具备了谈判的筹码，就需要不断的艺术的索取利益，争取奖金和休假，而不是，自己每天干些垃圾工作，还以为很辛苦，领导会另眼相看。


    作为职场老黄牛，想改变自己悲惨的命运，就需要积极主动的维护领导的权力，成为他可以依靠的力量，然后可以积极主动地争取优势任务，不断地通过汇报表演，让领导认可自己的努力和能力，最后就是在执行的过程中，不断地寻找漏洞夹带自己的私货，获取资源和财富，只有这样的人，在领导眼里才是最好的人才，而不是自认为自己默默努力会被认可。能干，会干，还要巧干，而不是傻干。权谋网一直强调，以技术立足，以权谋求发展，就是如此，老实干活不抬头看天，只是立足，不被开除而已。


    # 刚大学毕业走入职场，该如何工作？


    【困惑】老师你好，我是刚毕业的大学生，即将走向职场，之前一直在关注咱们的“权谋智慧”的微信公众号，感觉职场很阴暗，不知道自己该如何去工作，该以什么为主线？


    【解析】职场很阴暗，这是你的错觉，因为职场不阴暗，当然也不光明，而是犹如太极图一样，你中有我，我中有你，互相竞争，同时又互相和谐，这种共存共生的局面。作为职场新人，主要是从下面三大方面入手：


    +   1、适应本职工作


    快速的完成从一个学生到职场人的转变，这个首要的就是做好本职工作，快速的适应工作岗位的要求，没有工作能力这个基础，是不会被人重视的。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '任何时候都要首先提升自己的价值，这是职场立足、交换、升迁的重要筹码。如何快速的适应本质工作，大家都想到了，向老员工或是领导请教，没错，但是职场不是学校，没有任何一个人有义务教你，并不是你喊一句老师，别人就会倾囊相授，职场是利益交换的场所，想索取别人的价值，就要做好交换，没有人天生有义务帮你。从本质而言，教会你，别人还有留在职场的价值吗？所以，要学会给带自己的老员工输送利益，同时努力观察，偷师学艺。在没有掌握职场的工作本领之前，所有的其他都是次要的。努力做到不可替代，有绝活在手。


    # 2、建立权力关系


    小时候在父母的权威下长大，学校里在老师的权威下成长，所以在内心里，都有一个权威的存在，大家除了听话之外，内心对权威都充满着恐惧感，所以，走向职场之后，没有特殊情况，不会主动走进领导，见了面能够躲开，就躲开，能不汇报就不汇报，觉得领导有义务发现自己，关注自己。其实这是个巨大的错误观念，老师和家长关注你，这本身就是义务，是工作，但是职场，领导没时间和功夫关注你，人家都在关注自己的利益。想在职场搞好工作，就必须建立和领导的沟通关系。打破自己的恐惧感，早请示，晚汇报，主动让领导知道你在做什么，了解你的能力，这样才能够进入到领导视野，会给你倾斜更多的机会。也需要投其所好建立更多的私下关系，才能工作的更好。


    # 3、关注竞争对手


    当完成了工作能力的不可替代性，和领导建立了良好的权力关系之后，我们这时候，才能够关注到自己的竞争对手，因为此时你才有资格和别人竞争。没有前面的两个条件，你连竞争的资格都没有。不少稍微学点权谋的朋友，通常会本末倒置，认为职场就是拼杀，除掉所有潜敌，自己自然上位，这其实是痴人说梦，因为职场的流动性太大了，人太多，根本除不完。另外没有工作能力，领导怕你出错，给人家带来麻烦。再一个，没有良好的权力关系，任你能力超强，人家也不会信任重用。工作能力和权力关系'
  merge: -1
  img_proc: true
- pgno: 56
  md: '到位，这才能获得竞争的资格。这时候权谋就会上升为主要的工作，那就是如何的保证自己的优势地位，不被其他人所模仿，所追赶，所超越。此 时除掉任何可能的对手，这才是自己走向高位的手法。

    说一个大家容易理解的比喻，职场的关系犹如后宫争宠，工作能力就是你的身材相貌气质谈吐，没有这个基本前提，后面都不用说，根本就没机会别人正眼一看。其次是建立权力关系，后宫的漂亮女人一堆，如何的进入领导视野建立关系，这就需要洞悉权力心思，收买领导身边的人，获取领导情报，投其所好，做到了这一步，也只是后宫佳丽三千人的其中之一。想让领导独宠一个，这时候，就要利用各种机会和手段除掉潜敌了。如果没有前面的两条，即使你把后宫的都打倒了，恐怕领导也不会让你上床服侍。所以，作为职场的新人，首要的不是参与阴暗的职场斗争，而是按照上述的顺序来，一步步的实现自己理想，职场不是你想象中的美好，更不是想象中的阴暗，而是遵循特殊的权谋规律，才能走向成功！


    # 刚当成部门经理，第一次做一把手，主要做什么工作？


    【困惑】权谋网老师，我通过学习权术，终于赢得领导信任，调离到另外一个部门，上位成为一把手，除了权谋手段，我日常该如何展开工作？


    【解析】一把手和二把手或是下级，看似差了一格半格，其实有天渊之别，做一把手主要就要脱离具体事务，通过别人来完成工作，不再事事亲躬。很多人都会想到就是抓战略、抓人事、抓财务啊，那是老板的事情，我们作为部门一把手，主要是做如下的三大工作：


    1、订立游戏规则


    上位就是首先订立游戏规则，这是自己的权力的体现，哪些事情需要请示，哪些事情奖励，哪些事情处罚，哪些事情需要签字，一上来就要做这样一'
  merge: -1
  img_proc: true
- pgno: 57
  md: '个规定，或是约定，这样下一步工作期间，下属就有了明确的行为规范，自己就能够在规则中维护自己的权威。


    # 2、分配手中资源


    人员是固定的，各自的工作几乎也是明确的，作为部门经理的人事财务权力有限，但是自己有安排工作和任务的权力，这背后就是分配手里资源的过程。自己能够通过手里的资源的倾斜，来表达自己的态度，配合自己的给资源，不配合自己的冷板凳。


    # 3、平衡系统利益


    做领导主要是带领所有的人往前走，去实现自己的组织目标，这就不能太过于偏废，要适时适度的平衡各人利益。奖励老员工，要顾及到新员工，奖励有功劳的，也顾及到有苦劳的，处罚自己不喜欢的，也要拉个其他人垫背的，这样不会显示自己有针对性，才能团结大多数。


    上述的三点就是作为一个部门经理日常工作的主要方面，只有这样做，才能够抓大放小，才能够完美的执行上级领导的指示，才能够让自己轻松控制而不失去权力。这个主线把握住了，作为部门一把手，工作就没啥大的问题了。


    # 刚入职场从哪个方面入手揣摩领导？


    【困惑】老师，我刚大学毕业，看了咱们权谋网的很多文章，知道揣摩领导心思才能快速融入组织，该从那几个方面下手揣摩呢？


    【解析】权谋网一直强调，对于领导要尽可能的搜集所有的信息，对其建立起大数据，这样就能在行为习惯中找到未来的蛛丝马迹，便于迎合和布局。但是初入职场，就要删繁就简，先抓住如下几个方面：


    +   1、他的领导风格和决策方式是什么样的？'
  merge: -1
  img_proc: true
- pgno: 58
  md: '首要的就是判断出领导的风格，是严肃的，还是活淡的，是独裁的还是民主的，喜欢有工作能力的下属，还是喜欢善于交际的下属，通过这些信息，我们能够迅速的调整个人的风格战略上适应他。


    # 2、他会提出哪些类型的问题？


    他经常会提出什么类型的问题，事关他现在的关注的方向，这也是近期的工作方向，他是在关注业务发展，还是在关注团队建设，还是关注流程梳理，这样我们就能和领导思维同步。


    # 3、他的提问是为了验证自己的结论，还是在弥补思维漏洞？


    这个问题就牵扯到和领导的互动模式，有些领导提出自己的目标之后，你只能为其完善，思考如何实现他的目标。如果你提出不同的意见，他会非常反感。有些就是希望有人指出不同，避免失误。


    # 4、对于大家提出的意见，领导会有什么样的反应？


    领导对这种意见的反应，目的就是测试出，领导对权力的维护程度，或是对权谋的精通程度。因为提出意见，领导不加改变的接受并采纳，说明他对权力不敏感。


    # 5、做决策时，领导喜欢个别谈话还是集体讨论？


    为什么还是决策问题，因为领导就是权力行使，就是决策，下属就是执行，这里目的是看领导决策时小圈子完成了的，还是集体完成的，为自己接近权力，影响决策，调整方向。


    # 6、留意线索，看他周围的人什么方式和他交往的？


    人与人之间的交往，很复杂，不过对领导而言就简单许多了，主要看他和下属的交往是只限于工作交往，还是私下来往频繁，再或是只和熟悉爱好一样的人来往，这指导我们如何接近他。


    # 7、哪些人对他影响最大？


    他会听谁的意见，自己家人，公司经营，还是上级领导，还是他的好友？明白谁会对他产生重大影响，就能够摸到他决策的主线。比如有些是孝子，母亲对他的影响很大，这个就可以侧面进攻。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 8、他通过什么渠道了解团队信息的？


    每个领导都要建立起信息渠道，有的通过监控观察，有的听取小报告，有的私下谈话，等等，一定要摸清楚，领导是如何了解信息的，我们就能够利用这个渠道正确的传递信息。


    # 9、他是怎么上位的？


    每个人上位，几乎都是不一样的，有的是通过技术，有的是通过熬资历，有的是通过裙带关系，有的是通过溜须拍马，有的是行贿送礼，明白这个，和他做的一样，就能产生亲近感。


    # 10、他是如何应对失败的？


    失败问题不仅仅是领导承受挫折的态度问题，而是他处理的方式，是自己承担责任，还是不断地追责，还是找人背黑锅，这样我们就能够知道，我们要不要冒险，该如何冒险了。


    洋洋洒洒的写了十条，看似很乱，其实整体就三点，那就是他如何决策，如何交往，如何面对结果。最重要的就是他如何决策的，这个是揣摩的战略方向，一切的基点都是从这里展开的，我们所有的行为都是为了迎合或者是影响决策，知道这一点就知道该怎么下手做了。


    # 请客吃饭并不是结党，利益联盟才是！


    【困惑】小人利交，其利人助也！身在基层如何结党？没资源去构建利益圈。恳请权谋网指点一下基层如何构建团体。以前就认为请吃喝，发现根本不管用，嘴巴一抹后不认识都有可能。怎么办？


    【解析】结党一直是职场大问题，自然也会有很多困惑，这个问题很普遍，所以写文章回复，希望能够解开大家的困惑。


    # 1、阶段问题'
