- pgno: 373
  md: '# 如何打击不听话的下属？


    【困惑】老师，我报了咱们的权谋班，学了一年多，也成为了一个小领导，但是有个人，总说我坏话，诬陷我是拍马屁送礼上位的，我开除不了他，也不能降低他的工资，我该如何收拾他，有什么手段吗？


    【解析】体制内最常见这种现象，总有些嫉贤妒能的人，认为他们自己该上位，从而看不起别人，在背后诋毁。我们权谋家在无法采用强力手段的时候，都是通过下面三种权谋方式来实现打击不听话下属的：


    # 1、上策，使用陷阱任务


    想收拾他，就是一个找错误的过程。可以设局，挖坑，让他出现重大的工作失误，给组织带来重大损失；找到他的道德败坏的点，在人格上抹黑他，让他抬不起头；让他主动违法，引诱酒驾的有之，引诱受贿的有之，美人计的有之。让他犯错，抓到把柄直接上纲上线，就能够名正言顺的打击。


    # 2、中策，安排弱项工作


    引诱犯错，尽管能够有最大的效果，但也很難找到时机。这时候，就要利用好自己的权力，在分管的内容上，在权力的范围内，按照他的弱点来安排工作，哪壶不开提哪壶的意思，越是腿瘫越是拿棍敲。你不擅长写作，就让你写稿子，你不想出差，就让你天天出去跑，让他痛不欲生。


    # 3、下策，挑拨对手斗争


    还有很多时候，工作内容就那么多，这时候，就要利用人性的弱点，不断的挑拨离间，栽赃陷害，让他和别人产生矛盾，或是通过自己栽培的嫡系，让他主动跳出来和目标斗，天天让他鸡飞狗跳的心里不舒服，而自己作为领导还拉偏架，这就能让他天天不痛快，还说不出什么。


    所以，掌握上述方法，就能够对不听话的下属，天天穿小鞋，最后不得不听话臣服，自己还能让他无话可说。第一条，就是“我们还是按规定来处'
  merge: -1
