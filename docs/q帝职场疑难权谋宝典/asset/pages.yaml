  md: '到人干的事，困难的事。问问，怎么区别，哪些事是值得干的，干的领导事后会感恩？而不是干完了，就完了。


    【解析】这个求助，很经典，自己看似被领导重视，其实好处没有。这背后原理很深刻：


    # 1、领导把你当夜壶


    领导重用你不是因为他喜欢你，而是不得不Fortune你，所以用的时候你还有点价值，过后就忘了，好处是不会给你的。你在他眼里就是个工具，用完就扔一边了，这就是我们常说的剥削。在他眼里，给你工资，这就是你分内的事情，你该做的，仅此而已。


    # 2、不回报就不追随


    职场就是个利益交换的场所，只有实打实的利益才是我们工作的目的，至于口惠而实不至的事情，我们为领导做一次，做两次，做 定试探，如果没有回报，没有给相应的利益，这个时候，就不用太用心了，至于他能不能找到人干事，自己不要操心。不回报就找机会，偷懒做自己的事情。


    # 3、良臣要择木而栖


    题主最后说的，什么事情能干，什么事情能有回报。简单的说，如果是你份内的事情，这个没有回报很正常，人家给你工资就是职责所在。做领导的私事，或是维护他权力 的事情，这才能有回报，不过这不是重点，重点是要选对人，一个愿意对支持他工作的人感恩的领导，才是我们要追随的。想得到领导的重视，其实最为重要的是和领导构建非工作的感情信任关系，这样才能摆脱公事公办的印象，成为他私人圈子里的人，从而能够替他做更多私人的事情，这样两个人才能构建更加深刻的利益同盟，否则，干再多的事情，也只是职务所在，简单的职场工作关系而已。'
  merge: -1
