- pgno: 88
  md: '当你自己成了别人眼中的专业人士，有了一定的价值基础，这就需要我们开展交换活动。很多人，社交凭爱好、凭感觉、凭感情，具体的说就是，以感性为圆心，他和自己是不是有共同的话题，是不是有很多的共同点？都在寻找和自己相似的人。这样的社交只能让自己免除孤独，却不能给自己带来利益。而真正的社交高手，从来不考虑情感因素，而是考虑利益因素，这个人有什么资源，有什么背景，有什么能力。只有和这类人交往，交换自己的资源，才是有
    效的社交。


    # 3、利益交换是社交本质


    有了自身的价值基础，和不断的形成有效社交，那么如何的具体交往呢？多讲笑话？会喝酒？滔滔不绝？错了，而是不断的利益交换，人际关系是在使用中加深和巩固的，用的多，才能创造出更多的价值，要学会对待现金资本一样，把运作手段使用在人际关系资本中，关系是麻烦出来的，交集越多，感情就越深厚。而很多普通人，把人脉关系的交往随性而为，随遇而安，有事，不想麻烦别人，原本亲密的关系，几年不联络，也慢慢的淡化了，这就是用进废退的原理。


    很多人会想，麻烦别人，求助别人，别人不搭理怎么办？红包开路，赞美殿后。先从一个小问题建立起友好的关系，然后说出这段感恩戴德的话，你身边的贵人会越来越多 “您太厉害了，不是您，我都不知道该怎么办。我有瓶好酒，晚上出来消灭它吧。”如果别人不愿意出来怎么办？说明你价值低，那ἐ把酒给人家送过去。只要坚持，不断提升自己的价值，精准的社交链接，不断的价值交换，人生的社交之路，会越走越宽！'
