    # 如何学习权术？怎么学习权术？


    【困惑】很多朋友在权谋网询问，如何学习权术，怎么学习权术？


    【解析】学习权术是个系统的工程，不过方向还是有的，今天读毛主席的文章，给了我很大的灵感，就是三个方面。


    +   1、学习权术理论。


    任何的学习都是从学习理论开始的，而权术的理论知识，有四大块，一个是先秦诸子，尤其是法家的韩非子的权谋智慧必须渗入血液。一块是权谋高手的著作，比如《权谋残卷》、《罗织经》、《宦经》等。一块就是现在的学习研究的著作《权力定律》《权谋教科书》，最后是兵法的东西。因为权谋对付的是内部的敌人，兵法对付的是外在的敌人，很多可以借鉴。


    +   2、学习权术案例。


    《资治通鉴》和《史记》这两本书是必须要掌握的，有精力的话，三国志、汉书、后汉书，都是需要学习的。因为学了足够多的权术案例，脑子里才有足够的智慧储备，面对错综复杂的局面时候，才能找到类似的案例做参考，才能轻车熟路游刃有余。可以说，读历史是一个权术家的基本功，天天都要练习的基本功。毛主席手不释卷的通读了二十四史和读了17遍的资治通鉴，就是这个目的。


    +   3、学习权术分析。


    学习权术的目的就是使用，使用不可能天天的去实践权术，而是把权术当成分析的工具。分析新的历史案例，分析当下的热点，分析身边的人和事。分析能力就是把我们的权谋智慧用在生活中，有了足够的分析，我们的思'
