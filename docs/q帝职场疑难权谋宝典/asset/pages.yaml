- pgno: 104
  md: '领导并不会因为你收了他几百元的红包，而心里不爽，这本身就是微不足道的事情，并不会破坏上级的关系，两个人的关系，其实是个长期经营的事情，一两件不伤及领导权力、颜面、利益的情况下，并不会让领导怀恨在心，关键在于日常经营。收了红包，日后看态度，补救是可行的！


    # 3、和领导关系要主动投其所好


    其实走到这一步，领导给红包，就说明了一个问题，领导对你的客气，这本身就是一种不太正常的上下级关系，彼此不亲密，他随便指使你有心理障碍，而你不知道领导是不是爱占小便宜，这就是缺乏上下级关系的熟悉度。搞好上下级关系，不是被动带东西，其实早就该投其所好，打造亲密无间了。


    所以，我们该如何回复呢，其实不难，“领导您太客气了，这就是个举手之劳，本来不该要钱的，但是怕你下次有事不找我帮忙了，我这次就恭敬不如从命了。”这句话，表明了自己的态度和心理，让领导不那么觉得你不懂事。切记，这不是大事，核心还是日后对领导的态度和关系经营！


    # 职场斗争的失败者，只能夹着尾巴做人！


    【困惑】老大，我有个案例，我前领导以前是单位的副总，但是在升职时被竞争对手在老板面前告黑状，后来这告状的成了总经理，他还在群众中间肆意抹黑我前领导。但是，我前领导因为要照顾年迈的老母亲，还不想换工作，但是大家从上到下排挤他，该怎么办？是不是别人的看法不理睬，有什么高招治下恶人或是趋炎附势的小人？


    【解析】一个人权谋水平不高，升职失败，业务能力有限，无法立即转身离开，斗争失败后，场面必然会很尴尬，这个题主的职场情景非常典型，主要体现在三个方面：


    # 1、职场的升职竞争是你死我活'
