  md: '做直播电商不合适，他的老部下罗永浩适合直播带货，而俞敏洪却不适合。因为新东方的体量太大了，摆地摊的方式不能满足新东方的转型需求，以及农产品是个极端成熟，微利行业，并不适合他赚快钱等。我还讲了很多，第二天，经济日报写的《新东方不应照搬李佳琦》的文章基本上和我的观点完全一致，不过俞敏洪直接驳斥经济日报的观点。尽管他曾经是个成功的企业家，现在也是财务自由，但是他却不知道自己如何成功的，又是如何失败的。


    他的成功源自，国家进入世贸组织，国门打开，急需大量的人才出国学习，于是顺应了国家的大趋势。但是在 2018 年 10 月 8 日，中国教育报发表《治理校外培训机构要有必胜的信念》一文，作为稍微有政治敏感度的人，就能够感知到国家的决心。三年的时间，俞敏洪充耳不闻，丧失转型和收缩的历史机遇，现在却通过捐赠桌椅和退费的残局，获得了同情。真正的高人是未雨绸缪，而非痛苦离场，这充分说明了俞敏洪缺乏政治敏感性。


    国家双减教育政策之后，就是提倡职业教育，而作为标杆意义的新东方却不涉足这个行业，这就是经济日报的立论，尽管记者没有创业过，但是政治敏感度和大局意识是高于俞敏洪的。经济日报的观点其实就是国家的观点，其实对于二次创业，俞敏洪要做的不是反驳，而是注意到国家的信号，主要是三点：


    +   1、迎合趋势，才能获得国家政策倾斜。


    新东方暗合了国家的政策方向才成就了大的事业，而国家现在的国策就是提倡职业教育，调整中国人才结构的重大举措。国家希望作为标杆企业出来做历史的担当，这样做，国家会有更多的政策倾斜，资金扶植，这就相当于坐上了快车道。创业投资，都很辛苦，但是辛苦和辛苦不同，有些项目国家扶植，能够提升极大的效率。而有些传统行业国家不会给予太多的杠杠，真的就是辛苦钱。迎合政策，才能进入快车道，这就是为什么很多'
  merge: -1
  img_proc: true
- pgno: 328
  md: '企业家都喜欢看新闻联播，因为要知道国家政策，就知道了资源的分配方向。


    # 2、要利用好原有资源，才能事半功倍。


    新东方的经验完全在教育行业，和直播带货的电商完全的不搭界。原有的资源基本上用不上，即使有些英语老师转型喊麦，这能够有多大的优势呢，而且还是农产品，英语喊麦国外，也不现实，检验检疫运输保鲜的成本太高。而如果继续职业教育，无非是找老师研发课程，继续招生事情。而且还可以利用原有的英语老师，翻译国外的职业培训的课程资料，实现完美的对接，继续发挥其优势。自身的教育经验也能够继续高效的发挥出来，而完全的跨行，就是放弃原有的优势，走向陌生领域，要交学费的。


    # 3、圈地中原，才能刺激资本想象力。


    都知道河南是高考最难的地方，而未来中考分流，会让更多的学子走向职业化教育。一个多亿的人口优势，土地的优势，都能够适合俞敏洪自己想的，建立一个类似于斯坦福这样的大学。相信中原大地任何一级政府都愿意给他土地，帮助他筹建这样的职业大学，而且这样的故事能够在资本市场刺激更大的想象力，能够圈到地，能够圈到钱不说，还能够实现自己的理想，能够符合国家政策，能够给乡村培养出更多的职业化人才。可以请薇娅或是李佳琪来讲课，培养更多电商人才，而不是自己去直播竞争啊。这对我们的创业人的启示是什么啊，就是三点，首先是，我们要分析国家的政策，看看国家的资源分配的方向，才能够让自己的创业资金有更大更多的杠杆，能够快速的裂变发展。其次是，分析自己的既有资源，在原有的资源下不断的积累和发展转化。隔行如隔山，任何的换行，都要交大量的学费，因为任何的行业都内卷的严重，都是一大堆的企业。人家深耕多年，你凭啥和别人竞争？最后就是，不仅仅要考虑自己，还要考虑平台本身的吸引力，吸引更多的资本，更多的人才支持，这样才能做大做强，而不是为了一些个微薄的利润，人才谁来？要利用政策优势，而不是远离政治，不然做不大！'
  merge: -1
