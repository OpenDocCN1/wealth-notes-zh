  md: '# 隐忍才能更好的反击


    【困惑】我有一个问题想向 Q 帝请教：我是刚来二个月监理员，带我的那个监理员他让我晚上去看施工方晚上有没有偷工减料，我偷偷观察后果然偷工减料了，然后他就拿着把柄去问施工方要好处去了，要到好处回来就没我啥事了，等于过河拆桥，卸磨杀驴了，也许把我那份也给独吞了。这事就我和他和施工方知道，其他人不知道。我要匿名或者告密给总监或业主，他肯定知道是我。我该怎样阴他呢？


    【解析】你刚来两个月，你在他的心里也就是个青瓜蛋子，他觉得没有必要和你分享利益。因为你对他毫无威胁的能力，不仅如此，如果你匿名举报，你也没有什么实际的证据。即使有证据，以他的人脉依然能够大事化小，他转身反击，吃亏的还是你。


    所以我给你的应对策略如下：


    +   1、时间方面，此时并不是你最佳的反击时间。


    你现在刚来两个月，你的根基人脉经验都是零，你要做的不是为了眼前的一点小利益而去反击。如果此时去反击，你基本上没有任何的战斗力，以他多年的经验和人脉能量，很容易就能够抹去。领导就算知道他有这样的行为，也不一定就马上给他颜色，背后错综复杂的人际关系，想动一个人太难，说不定还有可能出卖你，而换取其他利益。所以，在你去阴一个人的时候，首先要考虑你的时机。要么不动，动的话就要有绝对的自信搞定。


    +   2、策略方面，你现在要做的就是隐忍。


    权谋家面对弱势的局面时最重要的就是隐忍，只有隐忍才能获取信任。有信任，你才能掌握更多对手的弱点。他不给你好处，你恰恰不能表现出一 biscuits点的反感，而是要对他更好，只当没发生过这件事。获取他的信任，他就会交给你更多的任务或是更多的合作，你想啊，他这样的人，有第一次'
  merge: -1
  img_proc: true
- pgno: 12
  md: '就会有第二次，还会有很多人，当他越是信任你，你介入他的行为就会越深，这时候你就能够更加多的掌握他。所以隐忍起来，去获得他的信任，为未来下手打下准备。


    # 3、手段方面，直接反击并不是最佳策略。


    直接反击正如你所言，他绝对会猜到是你，所以你直接反击并不是最佳的手段，你可以利用多方复杂的矛盾关系来搞掉他。不一定非在这个点上反击，搜集其他的证据，其他方面搞他，他就不知道了。或是借刀杀人，让别人来实名做等等。我们去阴一个人的时候最好不要自己亲自上阵，永远都不要把自己放在对抗者地位，让别人做，或是鼓动别人来做。


    所以综合上面说的，我希望你能忘掉这次不愉快，更加深度的和这个人合作。然后搜集更加多的有说服力的材料，找对时机和用好手段，争取一击而定。希望我的回答能够帮助你。


    # 工作中被人欺负怎么办，如何争取利益！


    【困惑】q哥，请教：在人群中自己是应该活跃气氛，还是少说少做？？？被人欺负了，是应该奋起反击，还是忍气吞声？看到利益了，是应该奋力争取，还是谦让给他人？


    【解析】这个问题之所以公开用文章的形式回复，是因为这个对于职场的新人，极具代表性。


    +   1、自己是不是需要负责群体气氛的问题。


    职场中，群体中自己如何行动，是偏于静还是偏于动。这个不是看这个群体，而是看领导。领导喜欢什么样的员工，这个主要看领导的性格。如果领导喜欢和下面的员工打成一片，那么你最好活跃点，这样能够让领导觉得你很会来事，和他类似，利于表现自己，便于提拔。如果领导是一个喜欢静的人，那么你太过于活跃，他会认为你华而不实，如果是多疑的领导，'
  merge: -1
  img_proc: true
- pgno: 13
  md: '你越是和下面的同事活跃，他越是觉得你在拉人在收服民心。如果你不能判断领导的性格，最好不要妄动，观察下互动的时候领导的爱好偏向，让别人试错，比自己去冒风险要好。


    # 2、被人欺负该反击还是该忍气吞声的问题。


    被人欺负不是反击或是忍气吞声的回应方式的问题，首先你要考虑的是你为什么会被欺负，其次你该如何评估你的实力，最后才是如何回应。

    为什么被人欺负，是因为你触动了别人的利益，还是你被群体排斥，是个案偶然发生还是经常被人欺负，这就是考虑你是不是在职场没有同盟，或是被领导看不上，别人在墙倒众人推。如果是个案，无所谓，唯耻必报的人，不会走很远，要学会原谅俗人，如果是经常性的，你就要找到同盟军，联合其他被欺负的人扳到他。如果你不具备扳倒别人的能力，那最好不要轻举妄动，最好忍气吞声，聚集自己的实力，寻找机会，以图一击必中。


    # 3、看到利益是争取还是谦让的问题。


    任何单位都是利益的集合体，每天都会面对利益的争取。争取自己的利益是手段，谦让利益还是为了长久得到利益的手段。其实不存在争取还是让的问题，而是如何争取的问题。

    学会争取利益，是职场的必修课。你要明白的第一个问题是，你的利益是谁给的。人家为什么要让出这个利益，你为了得到这个利益你要付出什么样的代价，你得到这个利益会不会损害别人的利益。所以在争取利益的时候你首先要考虑你的对手，你有没有实力去争。如果有实力去争，你需要付出什么代价。付出代价后，你能不能和给你利益的领导关系更加亲密。明白了这些，你也就明白了利益的问题是看对手，有能力就争，没能力干掉对手，就让。

    综合上述说的，我想对这个职场求助的朋友说，我们去思考问题不能只去考虑结果，而是要考虑的是，我们该如何的思考问题的来源，明白了问题的本身，那么答案就好办了。'
  merge: -1
  img_proc: true
