  md: '是德不配位，会退回原有的位置。


    # 107、学权谋戾气发重


    学员：老大感觉你讲权谋斗争（进攻）比较多，有醍醐灌顶的感觉，自保（防守）少点，感觉身上有戾气，求指点！


    权谋网：首先那是价值观不到位，权谋讲究“非危不战，非利勿动。”天天斗争并不是权谋的常态，而是我们保证自己的资源，自己的算力，求取一刀致命，不是频繁操作。其次，阶段认知不到位，在你资源稀缺的时候，只能通过不断的进攻来获取资源，而到了自己拥有资源的时候才能转变到防守阶段，求稳。江山都没打下来就去考虑防守，坐江山的问题就太远了。最后，手段的问题，权谋家不讲究被动防守，主要是到了那个时候，就一定是残局了，真正的高手是把敌人解决在萌芽之中，或是直接有威胁可能的时候就当成潜敌解决了，哪还有防守。在职场防守基本是个伪命题，大家都是要抱大腿找靠山，有了这些又没有人敢动手。


    # 108、不断加强和领导的熟悉感


    学员：我现在的问题是，大领导的位置对我太高，如果我直接买点礼品去他家会不会唐突，还是我白天在工作时找理由接触他一下，然后晚上再去他家里拜访，不知道老大对于我这种情况能否给点建议或者意见。


    权谋网：现在人都很看重自己的隐私，不要随随便便跑到人家家里去，会让人反感，先找机会多汇报几次工作，或者求教一些东西，增加熟悉感，让大领导明白你是什么样的人，直接去买东西或者去拜访属于下下策。


    # 109、有些处罚就是做做样子


    学员：老大请教一个问题，领导是公司副总，开会时说，干部犯错误要处罚100元，但是会下领导在处罚单却没有签字，我要怎么做才可以维护领导，还是这件事就不了了之？


    权谋网：礼不下庶人，刑不上大夫。领导这样其实是对下属干部的一种震慑，也就是敲打敲打，只要不太过分，就会睁一只眼闭一只眼过去，如果太过分了就会拿出来处罚，所以大面积大概率这件事不了了之。但是对于'
