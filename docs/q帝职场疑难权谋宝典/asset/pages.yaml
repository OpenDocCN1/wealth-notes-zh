  md: '# 我是女生，大领导来我们办公室，喜欢拿我开玩笑，怎么办？


    【困惑】老师，我去年毕业，入职在一家互联网公司工作，身边基本上都是男同事，大领导来我们办公室，喜欢拿我开玩笑，我很尴尬，回应也不是，不回应也不是，领导到底是什么意思，我该怎么办？


    【解析】大领导和一个女生开玩笑，这个事情很复杂，有三种可能，第一，有可能想用你来活跃下办公室严肃的气氛；第二，是他个人随和的性格；第三是想引起你的注意潜在的性骚扰试探。不过，到底什么情况，需要从三个维度分析：


    1、私下见你是不是还是开玩笑


    如果领导在公开场合拿你开玩笑，在私下的场合，比如说电梯里遇见，或者下班恰好走在一起，看领导是不是还是开玩笑，如果他私下不开玩笑，只能说明，公开场合的玩笑是个活跃气氛的手段，展示他平易近人的管理风格，这种玩笑就是一种活跃气氛的权术手段。这种情况下，领导开玩笑，就不要扭扭捏捏，配合下领导，一同活跃气氛，会赢得领导的认可。


    2、平时是不是和其他人开玩笑


    但是如果私下也是喜欢开玩笑呢，这是不是就是领导的个人性格呢，关于性格的判断，这就需要再加一个条件呢，那就是观察他是不是和其他的人都开玩笑，还是只和你开玩笑。如果和其他人都是如此，说明领导的性格，就是这样的人，这个性格下，拿你开玩笑，你就无须配合他的逗比情绪，自己微微一笑，不回应就行了，无须表现出尴尬，不用为这个玩笑注入能量。


    3、开玩笑是不是会涉及性暗示


    如果领导无论公开或是私下都喜欢和我开玩笑，但是和其他人不开玩笑呢，这就说明，领导对你有好感，这种好感，可能是工作上的认可，或是'
  merge: -1
