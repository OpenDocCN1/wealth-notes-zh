  md: '# 进入职场大平台，该如何选择具体岗位？


    【困惑】老大，看你的几本书和文章开窍了，跑关系进入大平台，领导打招呼，让我自己选择岗位，现在有迷茫了，有什么原则指点吗？


    【解析】进入大平台的确实会丰富，可供选择的岗位也确实比较多。通常而言，有三个原则：


    +   1、容易贴近资源的


    一个组织的资源分配是不平衡，也不平均的，有些岗位，掌握着组织的链接点，核心点，能够结交更多的社会关系，能够接触核心的信息，能够调配各种利益，这样的岗位自然是首选。因为这类工作，能让自己的身份地位以及资源会逐步的增加，为自己未来的发展打下更大的空间。


    +   2、能够立功出彩的


    不过容易贴近资源的，你看到了，别⼈也看到了，这是竞争最为激烈的地方，这时候就很难在初期贴上去，如果自己有能力不怕吃苦，这时候，最稳定，也是最有保证的，就是进入能够快速出成绩的地方，通过自己的技术能力，在一个容易出成果的地方工作，即使跟班，也能分一杯羹。


    +   3、领导最为关心的


    当然了，做出成绩，快速出彩，在成功的部门用水涨船高的方式如果感觉升职太慢怎么办，这时就需要拿出有点风险的手段兵行险棋了。因为每个阶段领导都有他关注的急点、难点、重点。这时候要主动学会揣摩领导的心思，然后自己努力研究帮助领导解决问题，这就能快速赢得领导的重用。所以，要么是关注组织的重要部分，要么是关注工作的重要部分，要么是关注到领导权力的重要部分，这样由易到难的策略，我们主要把握这样的原则，就能知道我们该选择什么岗位，即使有一定岗位的，也能够知道，努力调入到什么样的岗位，能够让自己快速进步：获取组织重要资源的，'
  merge: -1
  img_proc: true
- pgno: 338
  md: '能够出来创业，获取工作成果的能够得到高薪，获取领导权力信任的能够快速晋升。


    # 权谋家的权力分配原则！


    【困惑】老大，一直搞不明白领导都是按什么原则来分配权力的，和看的管理学的书都感觉对不上号？


    【解析】大部分管理学的内容都是没有私心，理想化的状态下的产物，在现实中，权力的规则一直都是隐而不宣的，因为以维护个人为出发点的东西，一旦说出去立即就会被人当成小人。因此，只看管理学，基本上是学不会管理的。那么真实的权力分配规则到底是什么呢，权谋家都是按照这三个原则和顺序来分配的：


    1、亲近原则


    亲近原则，也称为圈子原则，一是亲，二是近。没错，作为领导分配权力，第一原则和顺序就是分配给自己的最亲最近的关系，血缘关系、姻亲关系、师徒关系等，因为这样的关系才能保证自己的利益的整体安全和持续发展。每个领导都在不断的编织自己的关系网，然后不断的持续不断的给网络里的人注入权力能量，所以，我们想在领导那里获得权力，就必须进入视野，混进圈子。


    2、平衡原则


    权力的亲近原则本质讲究的是权力的安全性，但是，权力也有自己做大做强的膨胀欲望。这时候就需要通过利益平衡，只有利益平衡才能可持续获取利益，权力才能继续的做大做强。所以，只要能够给权力带来利益，就能够合作，就能够得到权力分配。这里面包含两个方面，一个是利益增加，另外一个是避免利益减损。有些山头势力大，消灭不了，这就需去分配权力照顾，和平共生。'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# 3、红专原则


    权力的安全性，扩张性，之后最重要的就是畅通性。那就是权力需要彻底的，无损耗快速的贯彻自己的意志，这时候就需要又红又专的有素质的人才。这些人因为能够有能力不打折扣的完成权力交办的事情，所以，在做事的时候，不得不授权这类有素质的人。这就意味着，如果你挤不进核心圈，又没有可交换的权力利益，这时候唯一能够做的是提高自己的办事能力来维护权力。


    那些教科书上的，按照工作、责任、能力所谓的分配，其实都没有考虑权力的心思，只围绕办事而言的。事实上，你不是自己人，就不会给你办事的机会，不然你立功了，有威望了，引发权力格局变化了，这对于领导而言是失控的，一旦权力失控，自己的位置就会不保，那么为什么领导还会让这种事情发生呢？所以，权力首先考虑的是自身的安全、扩张、畅通，最后才会去考虑事情让谁来执行。所以，现实状态下，权谋家分配权力就是按照上述三原则进行的。


    # 你对靠本事吃饭，可能有误解！


    【困惑】我今天辞职了，被一个小人排挤，一个朋友介绍我看这个“权谋智慧”的微信公众号，竟然还有人专门研究这个，难道人不能靠本事吃饭，非得玩手段？


    【解析】你朋友能介绍你来，也是机缘。呵呵，你可能对靠本事吃饭，有点误解：


    +   1、能力角度：有本事不仅仅是做事，还有做人。


    有本事，不仅仅是自己能够处理事情，而且包含着人际关系的处理的能力。马克思说过，人是社会关系的总和。一个是社会关系，一个是总和。关系处理不了，其实做事就不会做好，因为现在所有的事情，都是协作完成的。'
  merge: -1
