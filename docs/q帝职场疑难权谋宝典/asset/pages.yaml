- pgno: 16
  md: '1、你现在无法获得 A 对你的信任，而 B 又认为你是 A 嫡系，这是你问题的根源。


    任何人也不能完全的信任你，A 认为你不听话，不把你当成嫡系，而 B 又看不到你投诚，把你当成 A 的嫡系，认为你是他的代表，批评你就是打击 A。所以，你夹在中间，受夹板气。


