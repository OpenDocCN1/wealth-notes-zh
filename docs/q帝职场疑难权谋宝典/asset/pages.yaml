    权谋网：没有小角色，只有小演员。这个需要自己研究，每个人的位置、资源不同，转化自己的资源方式也不一样，首先要分析自身资源所在，以及可以调动的资源，最后去挖掘变现的渠道。


    # 116、不要和底层争论，不要好为人师


