- pgno: 276
  md: '# 为什么要否定前任领导，如何否认前任领导！


    【困惑】老师，通过学习咱们的权谋课程，我很快成为了领导，但是目前有个事情很郁闷，就是上一任领导太优秀，现在这些下属，动不动就拿我的不足做比较，弄得我很被动，建立不起名声，我该怎么办？请指教。


    【解析】是啊，如何面对前任的问题，一直都是职场的核心问题，大家都知道的就是“新官不理旧账”，但是不清楚的是，如何处理和前任的关系。这背后更多的是权谋计算，所以常见的职场书籍很难谈到。尤其是前任太优秀，就更加需要手段来清理原有的影响力。


    # 1、为什么要否定前任？


    如果前任是灰溜溜的离开的，留下烂摊子，这时候没有人会怀念前任，现任拨乱反正即可，最难处理的载是前任工作的很到位，尤其是奉新民主决策，假公济私发福利，或是带领大家做出成绩的，这样的领导，会让下属深度怀念，不断的对比现任，这样现任领导就很难开展工作。必须消除前一任的影响力，才能让自己的领导权力不活在别人的阴影之下。打击是争夺威望，树立影响力的必要手段。


    # 2、如何的去否定前任？


    否定前任，通常都是从三大方面下手的，首先是，立规矩，改变原有的规矩，制定新的规章制度。其次，动工作，是对原有科室以及工作安排，合并或是调整范围。最后是，毁政绩，对之前领导的工作错误，小题大做，不断放大。一套组合拳下来，基本上就能够消除前任留下的东西了。不过这里要注意的是，如果前任是提升了，对现任还有持续的伤害力，这时候，就需要特别的谨慎。


    # 3、否定前任的切入点？'
  merge: -1
  img_proc: true
- pgno: 277
  md: '如何利用这三大手段清理前任，不同的人有不同的切入点。关键看，前任离任的去向。如果是高升的，自然保持不变，按部就班最好，只调整纪律，不动人事和政绩。如果前任是平移到其他部门，这时候，调整纪律和人事，不攻击政绩。如果前任是跳槽、离职，这时候三管齐下，全面开火。但是如果现任领导是最高领导的心腹，或是靠山，这个就无所顾忌，尽快的拿出自己的成绩。经过上面的分析，题主应该先分析自己的实力，然后看看前任的具体情况，制定不同的策略。上面说的三个方面，其实也是流程。先树立规矩，不听话的就能够处理掉。接着，调整工作合并业务，能够让听话的获得好处，相当于提拔了自己的人。最后，自己的人上位后，清理前任政绩，也就没有那么多的提意见的人了。做领导基本没有提拔人的权力，只有调整工作范围，体现手段，这是核心，切记！


    # 企业本来就是赚钱的组织，为什么却一直强调理想而不是谈钱？


    【困惑】老大，听咱们的权谋课有一段时间了，我是个小老板，一直有个困惑，企业本来就是赚钱的组织，为什么你却一直强调理想而不是和员工谈钱？这个和西方的管理理论大相径庭，不是应该高额的物质刺激和最终的给予股份吗？


    【解析】你这个理解有点非此即彼了，我没有说不谈钱，出来打工，不谈钱谁陪你玩？而是说，不能把钱放置在第一位，要让大家觉得，赚钱只是实现理想道路上的副产品，一个组织是要有非物质理想的。为什么如此操作，主要原因有三点：


    +   1、形成组织凝聚力


    如果一个组织都是为了利益，没有一点的理想，那么上行下效，都是唯利是图，那这组织就没有任何的稳定性和凝聚力，因为人才自然是价高者得。如果外界过来挖人，自然这些自己培养出来的人才就没有任何的忠诚度和'
  merge: -1
  img_proc: true
- pgno: 278
  md: '心理负担，作为老板，你除非给出更高的价格，否则就会走人，而这些人都是自己培养出来的，就会形成恶性循环，自己培养，自己不断的给更高的工资，那么企业的利润何在，凝聚力何在？


    # 2、抛弃超短视行为


    如果一个组织只为钱的话，就会失去坚定的航向，失去了战略定力。因为，所有的抉择，必须是有理想作为指引的，不然就会只看到眼前的利益，短时间搞到更多的钱，就会变成整体的有意识。对于客户关系就会过度开发，或是使用欺骗手段拿到订单，至于未来服务和售后如何，不管。这样的组织短时间是轰轰烈烈，但是基本上很快就会走偏，丧失了未来。那么很多盲目多元化的公司，不都是如此？


    # 3、抵御外部强风险


    任何的组织都不会是一帆风顺，都会遭遇来自行业周期、同行竞争、自身失误、产业升级、源头变动、灾害事故、政策变动等等各种原因，而迎来风险。在风险来临的时候，这些有理想的人才会一起抵御风险，因为他们有理想有方向，能看到光明。而不是大难来临各自飞。如果都是因为钱，只为钱的人聚在一起，自然没有任何抵御风险的能力和信心，任何一个风吹草动，立刻就树倒猢狲散了。


    所以我们作为老板，作为一个组织的老大，不能只谈理想，不给钱，大家都要养家糊口，短时间可以，长时间，离心离德。如果只谈钱，不谈理想，就会有上述的问题。所以，我们做老大，要学会把理想排在第一，然后给予适度的物质刺激，只有这样，才能够建立起一个有理想的组织，拥有几千的凝聚力，不断的坚定的走在正确的道路上，不惧任何的风雨，实现自己的人生价值。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 作为老板，是如何收拾有影响力的下属的？


    【困惑】老师，我曾经重金挖过来一个有名气的技术员工，谁知道天天和我唱反调，但是他威望太高，我直接开除，又有忌讳，怕影响其他人。我该怎么办？


    【解析】阳光下没有新鲜事，看看曹操是如何除掉孔融的，这个布局，希望能够给你启发：


    孔融是东汉末年的大名士，因为和曹操的政见不和，不断的得罪曹操。几次让曹操当众无法下台，于是曹操对孔融动了杀心。不过对于曹操而言，杀孔融却不是一件容易的事情，因为孔融的名气真的是太大了，稍有不慎，就会对自己的政治形象带来巨大的负面影响。如何杀掉他，又和自己无关，这就太费脑子了。不过对于权谋家的曹操，最终还是设计出来了完美除掉孔融的手腕，分为下面五步：


    +   1、孤立孔融


    没有人是完美的，任何人在聚光灯下都不会没有毛病，尤其是喜欢喝酒的孔融，所以很容易就找了个借口，免了孔融的职位，让他没有了公务，就失去了一定的舆论影响力，切断了他和其他官员的日常联系。而且释放出冷落的信号，让聪明人都孤立孔融，切断了孔融的社会操作能力。


    +   2、找人弹劾


    孤立孔融之后，曹操通过私下的封官许愿的方式，策动郗虑出面弹劾孔融。郗虑是最好的刀，因为郗虑是孔融的老部下，而且之前还和孔融关系很好，所以，有孔融自己的人，出来捅刀子，基本上就变成了窝里斗，这就让所有的外人无法说什么，让孔融开始陷入负面的舆论旋涡。


    +   3、出面劝解'
  merge: -1
  img_proc: true
- pgno: 280
  md: '如果作为普通的领导，这时候，直接就顺水推舟，找借口杀了孔融了，但是如果这样做，大家都会认为是曹操借刀杀人，曹操的动机就会很明显。所以作为高手，曹操并没有急于求成，反而劝解郗虑和孔融和解，展示自己的政治度量，也迷惑了大家，认为攻击孔融不是曹操的意思。


    # 4、陷阱职位


    曹操在闲置孔融一年多之后，再次任命孔融为太中大夫，入朝为官。这个操作，基本上迷惑了大众，认为曹操对孔融没有恶意，但是孔融的这个太中大夫的职位正好隶属光禄勋来管辖，而此时的光禄勋恰恰就是他的老部下，郗虑本人，于是郗虑也毫不手软直接为孔融准备了五大罪状。


    # 5、不在现场


    曹操杀了孔融不算成功，杀的时候，不被溅一身血才是本事。在杀人的时间上，选择了自己不在许昌的时候，建安十三年7月，曹操帅军南征讨伐荆州，8月孔融被杀，而曹操此时在军中，自己有不在场的证明，没人会想到是曹操杀了孔融，曹操表现出完全不知情的样子。


    但是就没有明白人吗？《资治通鉴》第65卷记载，等到孔融被杀后，许都没有人敢去收葬孔融的尸体。脂习前去抠着孔融的尸体，哭着说：“孔文举弃我而去，我为什么还活着！”曹操逮捕脂习，打算处死，接着又把他赦免了。脂习这个举动让曹操很恶心，抓了他，是给大众一个态度，这样不懂权力心思的人，不处罚怎么行，但是最终放了脂习，原因也是怕受人误解，认为自己和孔融有牵连。在三国志里，陈寿也没有认为是曹操下的毒手，而是把责任归咎给了他自己的狂妄，杀人不见血的才是高人。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 权谋家决策的三个出发点！


    【困惑】老师，我刚成为部门一把手，自己之前从来没有独立决策过，忽然让我拍板，感觉无所适从，咱们权谋家有什么具体的原则吗？


    【解析】这个问题问的好，我们的人生决策需要长远化、全局化、务实化，但是如果在职场做事，就不是这个了，而是有自己独特的三个出发点：


    # 1、创造晋升资本是首要原则


    科学性、有效性并不是权谋家决策的重点，而是选择最亮眼，最好看，最出彩的，把方案的直观外化和亮点作为重要决策原则。因为我们做为一把手的目標，就是不断的利用手里的权力为自己打造政绩工程，拥有拿得出手的功劳，获取快速晋升的资本，这才是我们做官的第一目的。


    # 2、巩固个人权威是重点目标


    除了打造政绩为第一决策出发点之外，第二原则就是，选择能够让自己的权力更加重要，或是能够让自己占据有利位置、能够扩大自己管理范围的方案。这样做的目的就是，通过不断的决策能够让权力更加的集中在自己手里，形成一言堂，能够展示出自己的管理权威和个人威望。


    # 3、塑造优质形象是决策终点


    如果方案不能够实现政绩，或是加强权威，属于日常事务，这时候，权谋家就会在这样的情况下极其爱惜自己的羽毛，这就意味着，毫不承担责任。一切求稳妥、求安全、求便利，需要刻意回避和筛选掉有风险的信息和潜在的意外。自己没有错误，这是当官自保的的要义。


    经过权谋网上面论述，我们就会明白权谋家决策的方向：规避风险，不断的加强权力，获取更高进阶的资本，这就是原则。如果不这样做的后果，其实也就很清楚了，那就是劳而无功，大家看不到你的政绩。开会没有权'
  merge: -1
  img_proc: true
- pgno: 282
  md: '威，很多工作落实不了，属于管理无能，最后就是可能决策有风险出来背锅，仕途到头。


    # 为什么在职场想混的好，就必须喝酒？


    【困惑】老师，我最讨厌应酬了，觉得酒特别的难喝，职场喝酒这套，对95后没有用了吧？


    【解析】当初80后也是这么认为的，现在没谁这样说了，职场没得喝，也会回家自己喝。酒不仅仅是一种酒精饮料，还是职场的社交工具。真正嗜酒如命的有，但是不多，职场人天天的推杯换盏，其实主要而言，喝酒主要有三大目的：


    1、测试服从度


    喝酒可以说，喝多了很难受，常有舍命陪君子的话，所以一个人愿不愿意能够做到自我伤害，而服从领导，这在职场可以说一直都是首要的测试目的。你喝下酒了，这就是听话的表现，如果你各种理由抗拒不喝，很难相信你在工作中会绝对服从。所以，喝的是酒，其实展示的是服从！


    2、识别成熟度


    去哪里喝酒，喝什么档次的酒，由谁来陪酒，酒后有什么节目，可以说一系列的动作，都能够看出一个人的社交成熟度，一个人的社交成熟，就是知道人情世故，关系往来，自我定位。通过成熟度的识别，知道一个人对权力的尊重程度。一个人的社交度越成熟，成功概率越大。


    3、降低认知度


    人与人之间的交往，不都是熟人交往，因为一个人想取得更大的成功，就必须和更多的陌生人产生链接。而能够快速的和陌生人建立链接，就需要一个能够降低理性防御的交往方式，而一起喝酒，最能够活跃气氛，降低认知程度，从而有感情上的链接，让陌生人熟悉起来。'
  merge: -1
  img_proc: true
- pgno: 283
  md: '所以，喝一次酒，就能知道一个人是不是具备成熟的交往能力，是不是能快速的拓展人际关系，能不能尊重权力。酒局，你认为是酒，而领导认为是局。这个不存在年龄的问题，只是很多年轻人不懂，等中年了，也就没人再给机会了。你可以不喝，那就别怪别人不重用你。不要认为自己靠本事吃饭，没有通过上述的三大测试，没有人给你吃饭的机会。果真不能喝酒，这种人，其实都是借口。给你一套房，你喝不喝？别觉得不可思议，职场上的人，如果不是爸妈支持，谁的房子，不是一场场酒局喝出来的？


    # 政治就是请客吃饭！


    【困惑】老大，你说的“革命不是请客吃饭，但是政治是请客吃饭”这个该如何理解啊，求解惑！


    【解析】革命不是请客吃饭，是抢饭碗，而搞政治却是分蛋糕，也就是如何的请客吃饭的问题。这个要从三个方面理解：


    1、分清楚要请客的对象


    谁是我们的敌人，谁是我们的朋友，这是请客之前首先明白的问题。不该来的，来了，这顿饭吃的不开心，还可能被人掀桌子；该来的，没来，这顿饭吃的就没意思，没价值，还会被人埋怨闹事。所以，要分清楚有多少利益团体，哪些利益团体是可以拉拢的，哪些是需要严肃打击的，把可能联合的团体都邀请过来一起吃饭，加强互信，加强合作，把支持自己的人搞的多多的。


    2、桌子上该留几个座位


    每个利益团体的背后势力有大有小，不可能都坐在主要位置，也不是都需 要派多个人来，所以，这时候就需要对各个利益群体，作出势力的分析，然后，给与不同的座位、位置，这样才能把各个势力拉拢在一起，让大家'
  merge: -1
  img_proc: true
- pgno: 284
  md: '能够按照自己的实力说话。每个人都能对自己的位置和地位有明确的认知，这次吃饭就有了基础，大家就能够边吃边聊，达成一定共识。


    # 3、哪些菜是可以上桌吃


    我们好不容易搞到的利益，为什么我们自己不都吃了，而是要分给那些不同利益的人来吃？他们做什麼贡献了？搞政治是不能够吃独食的，因为你自己关着门吃，不给其他人分一杯羹，别人的饭碗不稳，或是吃不饱，是要闹事的，尽管不是有大风浪，但是总到处点火，自己吃饭也不会有好的心情。所以，要分着吃，但是有些好吃的，还是要自己独享的。


    那些关键的利益，关键的位置和资源，是不会端出来大家一起吃的，对于那些敌对势力，一定要敲了他们的饭碗，吃不饱，也就没有闹事的力量了。所以，搞政治，从请客吃饭这里理解，也就明白了。其实这个意思就是说，谁有资格来吃饭，来几个人吃饭，坐在什么位置上吃饭，吃些什么饭，能够吃多少饭。谁不能来吃饭，还要不要让他们在外面吃到饭，这个饭就是政治利益，这就是政治就是请客吃饭的意思。


    # 一个和我对着干的下属，我该如何的收拾他？


    【困惑】老师，我通过学习咱们的权谋课程，走捷径顺利晋升，但是有个同事，自认为有能力，这个位置该是他的，我被提拔之后，对我特别的不服气，处处对着干，我该如何的收拾他，又不显得心胸狭窄？求指导。


    【解析】职场上这种不服气很常见，他不去反思自己怎么会晋升失败，而是认为你揣了他的桃子，这种不学权谋的人反思都找不对方向。这种人，其实越是有能力，越是认为自己该晋升，领导越是不会让他升职，因为他内心会认为这一切都是自己努力得到的，不是领导的恩惠。当然，这背后也有的领导让你们内斗，他从而把握平衡，故意设置的可能，我们不探讨这个本源问题了，权谋网说下该如何解决这样的，不听话的下属：'
  merge: -1
  img_proc: true
- pgno: 285
  md: '# 1、以检查为名义，给他弄小鞋穿


    作为领导最隐蔽的操纵控制手段，就是打着工作安排的名义，来行使自己的权力。这样自己不显得官僚主义，也让下属无话可说。利用工作检查的名义，不断的鸡蛋里挑骨头，吹毛求疵，当众放大他的错误，让他难堪，不用担心找不到错，谁还没个打盹的时候呢？他越是有能力，我越是挑毛病。


    # 2、卡住核心资源，处处设置障碍


    不过，就是不犯错怎么办？等不到他犯错怎么办？我们就要把眼光放在全局上，利用业务链，来对他掣肘。把人力、物力、财力、信息等各种资源牢牢的控制在自己或自己人手里，对他的工作不配合，不支持，比如报销、申请物资等等，让他处处感到压抑和无形束缚，无法或难于完成任务。


    # 3、利用人性弱点，挑拨合作矛盾


    可有些时候，他不需要资源支持，或是自己暂时无法把控资源时怎么继续呢？这就需要利用人性的弱点，来针对性的设置，工作能力强的基本上属于心高气傲和完美主义。所以，让他与粗心懒散的人一起合作，让他和有背景的职场皇亲国戚合作，激将法让他挑战高难度项目，逼他、累死他。基本上，通过上述的三大套路，就能让他无法自由呼吸，还说不出话。做上述工作的时候，一定要和颜悦色，一定要展示出自己的大度，当众表达自己只是为了工作，没有私人利益。他只能把气憋到心里，至于说这样的人是不是会报复，其实如果有暴力倾向的人，日常是可以识别出来的，遇见这样的人，深度采用第三种策略，恶人自有恶人磨，调来另外一个这样的人，和他斗。恶人多了，恰恰好管。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 领导使用阴暗手段对付自己，该如何破局？


    【困惑】领导对下属，使用这些阴暗的权谋手段，该如何破局？


    【解析】每当写领导权谋手段的时候，立即就会有很多人弱者带入，形成三大派，权谋网现在逐一的分析下：


    1、对抗派，信不信我会打残他。


    首先，计算能力差，这种动不动就使用暴力解决的人，从来就没想过这是法制社会？尽管这些恶心暴力案件并不鲜见于网络新闻，但是这样的人，为了 一份工作，舍其妻子，不报父母之养育恩，自己走向极端，这样混乱的思维，自己觉得值不值？其次，判断能力差，另外动不动就说起义的那些人，看看社会环境，这是乱世？给你揭竿起义的机会？别人会和你一起？最后，防范能力差，你能给人家使用暴力，人家不会报复？这手段是你家专属？你的妻儿老小，就安全了？


    2、报应派，领导生儿子没屁眼。


    有不少人，举出历史上诸多的案例，谁谁没有好下场。这样想的人，也有三大错误。首先，以偏概全，把历史上的个例当成普遍性，使用手段成功的，活得滋润的更多，不懂权谋的被人搞死的也不少。第二，错误归因，人谁没有三次六难？和权谋手段没有任何的因果关系，即使有，使用手段被搞下来的，也是技不如人，遇见权谋手段更高的人了。第三，虚假期待。即使这样的人被报复，什么时候报复，由谁来报复，怎么报复？报复的程度如何，对曾经的失败者也于事无补。


    3、躺平派，人干嘛活得这么累。


    很多人看到权术手段，都会有这样的感慨，天天的人与人之间的算计，是不是太累了。难道人不能开开心心的自由玩耍？一个工作而已，划得来刀光剑影？这样的人，其实还没有经历过生活暴击，还对生存的残酷性怀有'
  merge: -1
  img_proc: true
- pgno: 287
  md: '幻想。一个组织里的资源就这么多，位置就这么多，机会就这么多，只要还有稀缺，就一定有竞争，有竞争，就一定有人用手段，而失败者会失去这一切。当你不去争取，失去升职加薪等诸多前途时，拿什么买房买车，结婚生子，给父母更体面的生活？

    难道就没有答案了吗。当然不是，面对领导的手段，作为底层唯一能做的就是改变对权谋的立场。使用如下三种权术手段，首先，提升自己的能力，让自己成为唯一稀缺人才，让他不能下手。熟悉领导能够使用的一切对付自己的套路，能够提前预防和避免。其次，熟悉权力心思，进入更高领导的视野，赢得更高领导的认可，从而获取比这个领导更好的位置，逆风翻盘。最后，比领导更阴暗，更加隐忍，成为他的心腹，就能够，有机会搜集他的黑材料，等待背后捅刀子的时机，从而一击必杀。


    # 权谋是赚钱的底层逻辑！


    【困惑】吃饭时，和扇丝谈论阿富汗局势，还没有直接谈钱合适，扇丝不信！学权谋不能搞到钱，没有用。


    【解析】对牛弹琴是你的错，还是牛的错？权谋最基本的见人说人话，见鬼说鬼话都不懂，门都没入，就说没用？扇丝是用来收割的，不是建圈子一起吹牛的。权谋对赚钱有没有用？其实在天朝，就是政治经济学，只有懂政治才能懂经济，才能搞到钱。我们群里谈论阿富汗局势的时候，就直接说了新疆交建的股票。当时买入的都赚了一波了，这就是利用局势投资的策略。


    为什么学习权谋是赚钱的底层逻辑呢？因为赚钱只有三条路：


    +   1、职场加薪


    一个前台的收入怎么都不会比部门经理高，所以想加薪就必须升职。而升职的核心逻辑就是知道权力心思，这样能够让领导信任并不断提拔，这背'
  merge: -1
  img_proc: true
- pgno: 288
  md: '后就是我们的权谋逻辑，精通了权谋的手腕，很快就能够谋取更多的机会，快速升职，从而提升赚钱。学好权谋，是最适合普通人职场搞钱的门路。


    # 2、投资变现


    投资刚才说了阿富汗概念股票了，现在以房地产为例子，都不知道国家背后的逻辑，如何了解宏观经济？要不要买房子，在什么时间点买入房子，买入什么样的房子，利用什么样的资金杠杆买房子，这些问题搞不清，就

    会认为房价会跌，一次次错过上车的机会，错过了财富的快车道。


    # 3、自己创业


    很多人会说，自己创业做老板，搞什么权谋？自己创业做老板，恰恰最需要的就是权谋知识，如何的利用关系获取业务，如何的团结自己的团队，如何的避免背叛，华为、阿里巴巴、包括娱乐圈的德云社，哪个团队没有背叛，不懂权谋背后被人插刀子，如果不是自身有了积累，早就不挂了。

    所以，在天朝，不懂政治，就不懂经济，就做不大。不懂权谋就不知道权力逻辑，就不知道政治的算法，就无法看清楚未来，看清楚趋势，就无法赚到钱。如果有其他的原因，比如运气，赚到的钱，最终还是会因为认知的局限而最终失去。因此，权谋是赚钱的核心逻辑。学好权谋，钱就是附带！


    # 如何安全没有后遗症的批评和自我批评？


    【困惑】最害怕过民主生活会，批评和自我批评，自己说领导多了，怕有后遗症，说自己，说多了怕以后是把柄。老师有策略吗，不是那种，领导你天天加班，不懂得照顾身体这种。


    【解析】阳光下没有新鲜事，你的问题也是别人的问题，多看历史总有答案，经过总结，给大家提供这个万能模板：


    +   一、批评领导话术


    +   1、（权力方面）为照顾各方面的利益，顾虑多'
  merge: -1
