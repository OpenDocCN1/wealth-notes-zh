  md: '辑，才能够真正的理解，想创造业绩，必须领导给机会给支持；领导给你机会支持，前提是，你服务好领导，让他满意，成为他的人。那些只懂得埋头苦干，不懂关系的人，只能是沉浮不定，用后即甩。


    # 认为领导水平一般，其实是一种错觉！


    【困惑】老大，你常说，让顺从和服务好领导，但是新来的经理水平太低了，我对他不服，怎么办？


    【解析】大多数人认为自己的领导不如自己，其实这是一种错觉，主要有三点原因：


    1、认为领导专业能力不行。


    很多人请教领导，工作上几个专业问题，就发现他不怎么熟悉，于是从内心看不起领导，这种情况最常见，其实领导主要的作用就是搞管理，打造团队，利用团队优势提升办事效率，而不是自己搞专业。领导的工作是管理，而不是具体办事，不要把自己的专业具体工作，带入到领导的工作中去。所以说，职场中，外行管理内行很常见，因为人家管理是内行，做领导就是人家的工作。


    2、认为领导处理事情不好。


    很多时候，自己做了很多工作，领导都看不到，反而发现没干啥事的同事受到不断的表扬和晋升。于是认为领导管理能力欠缺，处理事情不公。其实工作不是你做了一两件出彩的事情，就要给予表示，这是你正常的工作，领导要看的是你整体的表现，包括你的人际关系、你的服从程度、个人性格等等多种因素，如果换成你在管理的位置，你未必有他做的好，每个人处理问题都是有各种制约。


    3、认为领导人品性格不佳。'
