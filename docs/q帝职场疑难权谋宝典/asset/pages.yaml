  md: '越来越铁，交集越来越多，利益越来越丰富，所以，看完上述的内容，题主就该知道了自己的方向，只要有项目思维，才能够做大，做强关系，这 是利用关系最好的方法。其实，刘姥姥讲了雪地抽柴的故事，引起了贾宝
    玉的兴趣，准备修建破庙，如果这不是刘姥姥随口胡诌的事情，这个项目 就能够成为刘姥姥持续不断的项目，利用香火收入。馒头庵的净虚，其实 也应该让贾府牵线其他大的家族，对馒头庵扩建，整体运作馒头庵项目，
    也能够整体获得全方位的利润共享。而贾芸完美的关系运作，思维决定格 局，利用关系，就这么点门道！


    # 职场人必须进行三大能力的训练！


    【困惑】老大，我刚大学毕业，即将走向职场，对咱 们权谋网常说的“以 技术立身，以权谋求发展”不是特别理解，我该如何加强自己的新阶段的 训练，而走向成功呢？


    【解析】职场是一个交易的地方，但是交易的内容每个阶段是不一样的。 我们需要不断的训练我们不同阶段的专业能力，而我们权谋主要是让你用 来识别阶段，提升交易能力的。“以技术立身，以权谋求发展”，技术是
    你的交易商品，而权谋是你的交易能力。并不是有商品，就必然卖高价。 也不是有商品，就一定是别人的需求。这个浅显的道理懂了，才能明白这 段话的精髓。


    +   1、职场底层需要专业技术能力


    金字塔结构下的组织必须有大量的劳动者，无论是体力还是脑力。这些人 专心于物质上，不断的进行价值增加。只有更多的人创造价值，才能维持 食利阶层。所以，想在底层做的好，受到重视，必须有极强的专业技术能
    力，也就是创造价值的能力。价值创造力高，思考力强才能进阶到下一层。


    +   2、职场中层需要思考分析能力'
