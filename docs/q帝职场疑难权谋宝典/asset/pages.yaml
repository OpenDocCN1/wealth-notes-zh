    HR 部门，顶级人才都是有猎头公司直接挖人。直接高薪吸纳最顶尖的人才，还有空去发觉人才？这个成本有多高？经过上述的分析，我们能够看出来，只有资源，没有权谋的人，就是一头待宰的肥猪。没有资源，只有权谋的人，也只能留着口水，临渊羡鱼。读历史，就怕一知半解，还认为无所不知，再说了，聂食其依靠的不仅仅是自己的智慧，恰恰是帮助刘邦拿到了最大的资源，攻克了当时最大的粮食基地，敖仓。而张良帮助进入关中，是判断出守将是商人的儿子，拿出重金才行贿过关。没有刘邦拿出的重金，任凭你智慧再高明，也不会有什么结果。所以，强者必然恒强。之所以强者变弱，就是因为丧失了对资源的控制力。这才是衰败的关键，秦二世，被架空，秦朝贵族被清理，这才是秦朝失控的崩盘的主要原因！


    # 看不惯职场上的尔虞我诈怎么办？


    【困惑】老师，我看不惯职场上那些拍马屁，打小报告，阿谀逢迎，媚贤妒能，尔虞我诈的这些现象怎么办？现在又和领导闹翻，已经换了多家公司，是不是还要辞职，迷茫了。


    【解析】没事，你还年轻，继续辞职，等你到了 30 岁，同龄人都升职加薪了，你还在底层跳来跳去，到那时候，你就会明白，社会不会主动适应你，而是要你来适应社会的。别认为我说话难听，你所谓的坚持和抗争，对这个社会毫无意义。不会游泳，换个泳池，你还是不会！因为你要考虑下面三点：'
