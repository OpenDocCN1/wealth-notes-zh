- pgno: 300
  md: '们日常交往的基本功，那就是因为面子、利益、礼貌等隐藏自己的目的，说话讲究包装和技巧。通常而言，最常通用的就三种方法：


    # 1、感情法兑圈子


    这种是用得最多的，比如是你朋友借钱，很难开口，他会云山雾ourd有一搭没一搭的和你谈之前的感情，讲你们之间的种种过往和故事，成功的唤醒你们之间的革命友谊。最终临终要走了，说能不能借点钱，现在手头有点紧，刚刚还称兄道弟的你，很难直接拒绝。如果拒绝，之前所有的感情话就会被人认为是虚伪。所以这就是兑感情圈子的谈话技巧，拉感情，然后才暴露自己索取的目的。


    # 2、背景法兑圈子


    直接拒绝别人借钱，可以说，很难直接说出口，但是自己真没钱或关系也没有到那一步，这时候，就要使用背景法来兑圈子。意思就是说，要先讲讲自己的故事，故事里有自己现在的状态和困境。让听到的人，能够明白故事里的暗示，彼此都有台阶可以下。比如，兄弟你要是不急用的话就等等，最近出了点事情，我也是到处借钱，目前也是无米下锅，缓过来，我第一时间抽调给你。


    # 3、故事法兑圈子


    钱是借出去了，要账总是难以启齿，不过总是要开口的。权谋网上有个段子，就采用了这种技巧，兄弟你看看天上的云，蓝不蓝？是不是和你借我钱的那天天气一样呢？云也是这么白。这种讲故事的技巧，看似说的是Hay一件无关的故事，但是其实就是在直接提醒对方，我们之间的故事。这样的话，彼此都不尴尬，都有台阶可下。当然也可以讲一个历史故事，朋友的故事，都可以。


    陈毅元帅有个故事，全面应用了上述三大原理。他的老丈人去上海投靠他，他无法安排。于是在好吃好喝好招待之后，利用感情法，和老丈人建立感情链接，避免被误解，然后讲了自己现在的工作和生活，自己的工作纪律，背景法暗示自己的安排人员的困难。最后，问老丈人，共产党好，还是国'
  merge: -1
  img_proc: true
- pgno: 301
  md: '民党好，老丈人自然说是共产党好，不任人唯亲，不欺负百姓。陈毅立即接过话题讲了党史故事，某些人特权作风被处理。老丈人最终明白，于是几天之后，主动回老家。所以说，我们如果直接拒绝，直接索要，都会引起尴尬。所以兜圈子的技巧，大家都要深刻的理解下。


    # 权谋家的用人标准和一般人想的不一样！


    【困惑】老大，权谋家是不是权谋剧《走向共和》里，李鸿章说的，用人就是任人唯亲啊？


    【解析】很多人就在纠结，任人唯亲还是任人唯贤的黑白对立的思维方式里。其实权谋家有自己的用人原则，而且是有先后顺序的三大标准：


    +   1、利益关系


    权谋家首先想到的不是亲贤关系，而是利益关系，提拔、使用这个人，看看能不能给自己带来利益，首先是能不能带来权力利益，其次是经济利益，最后是情绪利益。权力利益是能不能让自己的权力提升或是巩固，情绪利益就是能不能让自己精神或是肉体愉悦，利益合作关系才是最稳定的关系。


    +   2、裙带关系


    其实任人唯亲的亲是分为两类人的，一个是亲人，一个是亲信。没有利益合作这种最稳定的关系可选择时，就选择自己的亲人，毕竟有血缘关系的人，大概率是能够和自己共进退的，一荣俱荣，一损俱损。毕竟这种身份的标签很难改变，能够大概率的不会在使用时，伤害到自己的实质地位。


    +   3、依附关系


    不是所有的单位组织里都会有血缘关系，最常见的就是依附关系。每个领导身边都会围绕一群献媚或是献忠或是献身的人。这时候，权谋家就需要使用和自己依附程度最深的人，那就是自己越级提拔起来，除去权谋家本'
  merge: -1
  img_proc: true
- pgno: 302
  md: '人，没有任何依靠，别人都因为嫉妒或是利益冲突而孤立的人，这样最听话。


    所以，权谋家用人其实就是上述的三种方法，这三种方法核心就是能够最稳定。但是最后需要说明的是，权谋的合作提拔并不是一成不变的，如果利益变化了，亲戚有怨气了，依附程度变弱了，这时候要果断的采取措施，重新按照上述原则再次选人！时移世易，顺势而为，这才是权谋之道！


    # 如何的研究话术？


    【困惑】老师，学权谋有一段时间了，很多道理都知道，但是不明白如何说话，有技巧吗？


    【解析】我们基本上都是通过经典历史案例来研究权谋思路的，具体到现实，的确需要研究话术落地，这个需要我们看电视剧，小说或是日常观摩高手交流来研究话术的。我们通常分析一段话术，基本上都是从四个方面下手研究，然后逐步的成为潜意识，最终谋篇布局，而不是只记忆一些个惯例的。


    +   1、信息传播者


    说话，不就是要自己说吗？其实不是。权谋家想传递一个信息，并不是非要自己说，有时候，需要有意无意的泄露给第三者，由他代自己传递给目标。这样的潜在传递，能够增加信息的真实性。所以，精心的选择传播者，由谁出来传递，是我们话术研究的第一个问题。传播者的身份，对目标是有很大影响的。甚至，有时候传播者都不一定是人。比如利用目标的宠物，让他吸引目标注意到某些信息等。


    +   2、信息接收者


    我们很多时候要说给目标听，试图影响到他的判断和决策。但是，我们不能从自己出发去设计话术，而是要从目标出发来设计话术，主要原因是，'
  merge: -1
  img_proc: true
- pgno: 303
  md: '信息传递的过程中，接受者的信息处理能力，接受能力，都会出现信息衰减，所以我们权谋家设计话术的时候，就必须照顾到他的接受能力，要按照他的理解能力，行为方式来传递。比如有些人喜欢静下来看文字，有些人喜欢听汇报，有些喜欢听故事，各有侧重。


    # 3、信息的内容


    传递的内容，很多人想的就是说什么，能够表达清楚自己的意图。其实，权谋家研究的是能够让目标相信。是要能让目标相信自己说的，这个无论是真实的，还是虚拟的，还是虚假的，这就不重要了，只要能够达到自己的目的，这就行了。很多时候，我们讲真话并不能达到目标，有时候故意前言不搭后语，出现自我矛盾，让目标陷入沉思，自己去探索真相。还有时候，不传递内容，只传递情绪，比如恐吓。


    # 4、信息的媒介


    传递的媒介，有正式的，有非正式的，有直接的，有间接的。比如美国有个关于金融骗子的电影，直接伪造了一份报纸，该报纸上对自己的资产进行了吹嘘性的报道，把该报纸投放到目标能够拿到的地方，从而无形中影响目标，进一步接近，从而完成了诈骗。有的通过第三方故意在目标前面交谈，吸引目标倾听，从而改变一定的认知：有的通过写书，或目标爱听的广播，植入影响，等等各种手段。


    所以我们研究一段成功的话术，看看由谁来传播的，目标接受的方式和内容是什么，以及什么渠道传播的。只有从这四个方面下手，我们才能够看清楚一段话术的真相和背后的逻辑。'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# 一个人想崛起，必须通过这三关！


    【困惑】老大，知道了咱们的权谋价值观，还是做不到怎么办？


    【解析】其实，看几篇文章就想改变，哪有那么容易？到能不能做到，还有漫长的路。这里面有三大难关，通过了才有可能成功，不通过绝对不会成功：


    # 1、认知关


    一个底层的价值观逻辑，满脑子错误、混乱的想法，受到各路媒体宣传的洗脑，想找到对的认知，真的太难了。因为你自觉不自觉的会被别人带到坑里。所以，一个人想突破自己的认知，推倒思维的墙，太难了，这就必须真正的去相信好的老师，坚定的走下去。这个世界的真相，残酷而直接。如果咱在自己的角度去思考对错，其实你的立场、你的认知、你的价值观，就决定你不会判断对。


    # 2、人性关


    有了好的知识和认知就能够立即改变了吗？并非如此，人都知道减肥戒烟好，但是为什么很少人能做到。都知道读完二十四史能够让自己博学，为什么读几页就犯困呢？知道什么，到做到什么其实是个反人性的过程，一个人想成功，就必须对抗自己的人性里的弱点：放纵、贪婪、懒惰等。对抗自己的人性是最难的，没有人在身边约束，直接就会放松、放纵、放弃。过不了自己的关，也就原地踏步。


    # 3、环境关


    有个段子说的占有好处，你想让孩子超越你，你就不能事事都管着他。都管着，和你一样，怎么超越你？你如果是对的，那么你不早成功了？一个成功摆脱底层的人，大多背井离乡，远离了固有的环境束缚。不然，你即使都是对的，你抗的住老婆孩子，父母朋友的错误认知吗？你做每一件事都要和'
  merge: -1
  img_proc: true
- pgno: 305
  md: '他们的错误，争吵和对抗吗？所以，能不能摆脱底层错误环境的情感束缚，让自己冷血下来，很难。


    所以，一个人筑信权谋，到克服人性，最终摆脱环境的束缚，这三大关，是一个人成功的内功，有了这些，可以说具备了成功的内在条件，这个还需要配合外部的时机、资源和手腕。知道了这些，也就明白了真正的成功路径！


    # 向领导提要求必须知道这三个关键点！


    【困惑】老师，我就在国庆节向领导提出了不想值班的要求，今天上班了，之前很好的关系，发现对我冷淡了！什么原因啊？


    【解析】每次放假值班，对领导都是头疼的事情，很难安排下去，每个人都会有各种特殊情况请假，而领导只能安排自己的心腹先值班后调休，这样，能够顺利的解决权力难题，而你却和别的人一样，不给领导解决问题。所以，你在领导的心目中，也就不再重要了。其实很多时候我们向领导提要求，需要知道如下三个关键点，不懂这些，关系很快就会走向反面：


    1、上级满足你所提出要求的承担能力是如何？

    很多人不知道领导的工作难处，不知道领导的权力范围，盲目的提出要求，让领导陷入尴尬，满足你吧，自己不舒服，不满足吧，还要顾忌你的面子和心理。很多和领导关系近的，不知道这个界限，逐步的让领导冷落下来，自己还不知道什么情况。


    2、领导对你的要求认识程度和重视程度如何？

    还有就是你认为重要的事情，但是在领导眼里，并不重要，不值得一提；或是领导目前忙于其他的事情焦头烂额，无暇顾及你的需要，这时候，你向领导提要求，就是给领导添乱。关键时候，不替领导分忧，反而添乱，领导会认为你没眼色，能喜欢你？'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# 3、领导对你的了解程度和关系亲密程度如何？


    还有就是，你提要求之前，你衡量下自己在领导眼里的分量和位置，他需不需要去满足你的要求，不满足你的要求，你会给他什么样的伤害或是利益损失？所以要让领导真实的了解你的需要，为了维护关系不能不顾忌你的需要，没有这个基础不要盲目提要求。


    经过上述的分析，其实题主接下来就知道问题出现在那里了，关键时候不替领导分忧，却给领导增加麻烦，这样的下属，还有什么培养价值？冷淡就是很正常的操做了。作为下属，一定要主动考虑领导难处在哪，满足权力需求，才能有所作为。很多人会问，难道我们就不要休假，必须主动值班？这个就看你心里什么最重要了，是家人，还是工作，如果是家人，就别太在意职场升迁的事情，人嘛，最重要的是开心，饿的时候家里人下一碗面，够了，就别想什么自行车了。


    # 中层领导许诺的猫腻——谈谈窃恩术！


    【困惑】我这边刚做了几个大项目，分管领导说已给老板说，让老板给我提级，据说老板也同意了，可分管领导又给我说，让我给老板说：听说老板想给我提级，您说遇到这种情况，我该如何给老板说呢？


    【解析】这是个典型的问题，看似是个话术问题，其实是个中层的权谋思想的猫腻问题：


    # 一、中层领导是给老板说过


    +   1、中层领导很懂权谋。知道你做了大的项目，未来压抑不住，你是要被提拔的。所以把这个功劳揽在自己身上，说是他推荐你的，让你未来感恩。 2、因为真的推荐，让你提级别，老板把级别给你升级了，你不会感恩老板而是会感恩分管领导。这个在老板眼里，因为他推荐，奖罚权被窃取，懂权谋的老板会很反感他。所以，他让你自己去说。'
  merge: -1
  img_proc: true
- pgno: 307
  md: '3、你自己去说，如果是说上级推荐的，这个会让老板误以为你们之间有利益关系，属于结党，不会提拔你。所以你的分管领导不想让你提及他，只是让你使用“听说”开头。


    # 二、中层领导没给领导说过


    1、分管领导听说老板要给你提级，所以先给你透露了消息，让你误以为是他推荐的，其实是老板的想法，所以不想让你透漏。


    2、分管领导没有听老板说过，只是他想施恩拉拢你。如果老板提你，你会认为这是分管领导的推荐，如果老板没有提你，你会抱怨老板，更加感恩分管领导的栽培。


    3、更加阴暗的说，分管领导，看着你做大了，可能威胁到他的位置，让你主动向老板用道听途说的借口提要求，这会让老板反感。原理是，朕给你的，你必须要，但是不给你，不能伸手。


    所以，无论什么情况，你主动找老板说这个事情，提拔了，你感恩领导；不提拔，被讨厌，还是在分管领导的打击你的火力之内。因此，这不是个话术的问题。如果非要说的话，就说，老板通过这次事情，我深刻的明白，我还有更多的进步空间，我想多做点工作，能不能压压担子，多分管的点事务？这样说，不显得威胁，又展示了奋进，还给领导留下施恩的活动空间。


    # 逃避责任和用于担当如何平衡？工作是分为三大类的！


    【困惑】老大，讲课的时候，你说过，不会逃避责任，就会被掉进陷阱；不敢勇于担当，就不会被重用提拔。面对工作，还是不能理解运用这段话，请解惑！


    【解析】如何在担当和避坑之间取得平衡呢？主要要注意如下三点：


    1、首先区分工作的性质'
  merge: -1
  img_proc: true
- pgno: 308
  md: '工作其实是要分很多种的，并不是简单的上班完成规定动作。有事务性工作，有权力性工作，有竞争性的工作。只有我们深刻的认知工作性质，才能有的放矢。事务性工作是为组织完成的，权力性工作是为领导完成的，而竞争性工作是为自己完成的。如果胡子眉毛一把抓，是要出问题的。


    # 2、其次看看相关的影响


    事务性工作是为组织完成的，那么这个就会有规定，奖罚分明，能出错的事情，尽量自己要学会避开。规则的刚性，很难有伸缩的空间。而权力性工作，是为领导完成的，这个就要不避艰难，成不成，领导都会知道你坚决拥护他的态度。竞争或是斗争的工作，自己无论难易，都必须全力以赴。


    # 3、最后选择利益最大化


    为什么涉及到竞争的工作，必须全力以赴啊，因为这个涉及自己基本盘，也就是自己的饭碗，如果不能打掉明的或是暗的对手，自己就会被出局，这是不惜代价的。权力工作主要是对领导的拥护，这个主要是态度，态度比结果重要，而事务性工作，这个就是能推就推，能简单就简单，拿工资而已。


    所以，我们只要把三大类工作区分好了，就能有选择地做工作。很多人把权力型工作当成了事务性工作，避重就轻，让领导认为没担当。把竞争性工作当成事务性工作，计算得失，失去基本盘。权力性工作可以牺牲自己的利益，勇于担当。事务性工作，必须跳出可能的坑。记住这些就基本上知道了，哪些事情该做，该如何做，该投入多少了。


    # 在领导眼里只有两类错误是可以原谅的！


    【困惑】老大，咨询您两个问题，1、我们领导对于我们工作上技能知识缺陷而造成工作失误反而能包容，但对于粗心大意造成的小错误反而发火，这领导怎么想的？2、以前看本职场类书上说领导对于他看中想培养'
  merge: -1
  img_proc: true
- pgno: 309
  md: '的下属会包容错误，证明你在领导心里还是有一定位置，谁不犯错呢，不犯错怎么能让下属进步呢。但又有说法说领导批评你是器重你，培养你，感觉矛盾。这两个问题您怎么看的？我思维混乱了，麻烦老大指教！万分感谢！


    # 【解析】


    这两个问题，其实是一个问题，那就是错误Pretty分类处理。在职场，错误有很多种，作为领导面对不同的错误，会有不同的反应。之前我们只从大的方面分为了权力性错误、工作性错误以及道德性错误。对于工作性错误没有细分，今天我们针对工作性的错误给大家借此机会总结一下：


    # 一、从成本角度


    # 1、学费型错误


    这就是题主说的，工作技能缺陷造成的失误。因为个人能力不足，在工作上造成了失误，只要总结经验，记住教训，下次可以避免，这是一个人成熟过程中必须要交的学费。一个组织必然要承担人才培养的成本，所以这样的错误，领导会包容。


    # 2、浪费型错误


    题主说，因为粗心大意反而发火，这就是浪费型的错误。这些不是组织发展必须承担的成本，而是必须纠正的错误。这种错误如果得不到纠正，就会让员工肆无忌惮，未来会带来更大的损失，而这些损失，对组织成长没有任何的帮助，只有阻力。


    # 二、从发展角度


    # 1、探索型错误


    工作不都是按部就班，而是会出现很多未知的领域，这个需要探索才能完成，而探索未知，必然会出现失误、错误，这个领导必须鼓励支持，因为如果打击这类探索型的错误，会让组织陷入未来没有开拓性人才，就会逐步的故步自封，保守落后，创新性工作要保护和鼓励。


    # 2、效率型错误


    在发展的过程中，除了事务本身的未知之外，还有关系模糊，比如人性的'
  merge: -1
  img_proc: true
- pgno: 310
  md: '矛盾、认知的矛盾、利益的矛盾，这些矛盾会对组织的探索工作出现极大的内耗，互相扯皮，推诿，有好处都上，有风险都推，这样降低效率的错误，出现一个打击一个，领导做出决定了，就要全力以赴的达成指示。


    # 三、从关系角度


    # 1、对内的错误


    关于领导是包容还是打击下属的错误，除了上述的信息之外，领导主要考虑的关系影响。如果是自己培养的人，自然会护犊子，不然，有点错误就公开批评，容易给外围的人口实，所以，尽量的对自己人不公开批评，这样有助于人才的成长，以及维护自身权力的稳定。


    # 2、对外的错误


    但是如果这个错误太大了，领导已经无法保护，这时候，领导第一时间就要批评，这时领导自己就不会受到下属错误的牵连，只有领导不受到牵连，未来才有可能继续给你资源帮助你，器重你。如果领导还是毫无原则的保护，就让外围认为铁板一块，会加大外围打击力度，都无法翻身了。


    所以我们在职场工作的时候，一定要分清楚自身错误的性质、成本和相关影响力。只有明确了错误的类型，才能知道领导什么样的反应才是正确的。作为领导也需要根据不同的错误而分类不同的处理。经过上述的分析，我们能够发现，只有那些组织探索型的，个人学费型的这两个错误能被包容和原谅，其余的必须批评和打击。


    # 只有三种情况才会提拔优秀人才


    【困惑】老师，领导为什么都喜欢用平庸之辈，做领导的就驾驭不了优秀人才？


    【解析】为什么领导都不喜欢提拔优秀的人呢，一来怕被取而代之，二来人才大多主意很大，会不服从管理，最后就是，提拔认为是自己该得的，'
  merge: -1
  img_proc: true
- pgno: 311
  md: '不会感恩。所以，基本上，领导都想提拔平庸的，这样的人都听话，感恩，也不会小看领导。但是万事都有例外，只有三种情况，领导是要使用人才的：

    1、困难阶段

    来俊臣说过，“乱使用能，平则去患。”无论是组织困难，还是工作困难，平庸人才解决不了问题的时候，如果无法外包处理，这时候为了应对危机，必须启用人才，因为“皮之不存，毛将焉附？”大是大非面前，必须启用人才，等过去困难期，给个虚职后还是会限制或是闲置起来的。

    2、风险任务

    有风险的工作任务，需要有人去承担起来，这时候，就需要启用人才，不过这个启用很可能会让这类人崛起，为了避免利用风险崛起，让自己平庸的嫡系和人才一起工作，干一段离开，如果未来有风险，自然由这个人才承担，如果没有风险，立即让平庸嫡系出来摘桃子，因为参与了，要分功。

    3、道德有亏

    人才越是优秀，越是缺点和优点同样明显，这时候，作为领导想使用他，就必须抓住他的道德把柄，只有如此，才能让他老老实实的听话，随时能让他老老实实。只有在他道德层面做文章，才能让他没有威望，才能让他感恩戴德，或是内心恐惧，羞愧等。比如关羽通过华容道，被诸葛亮搞定。所以，想驾驭优秀人才，只能是这三种情况，不然，如果贸然使用人才，自己只能是养了个白眼狼。你越是用他，他越是觉得你这个领导不如他，无能，人才野心就会膨胀，进而想取而代之。所以，别怕阴暗，老老实实的把握好这三点，就能够使用优秀人才！'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# 职场如何经营人际关系！


    【困惑】老大，我想问下职场人际关系怎么经营，太强怕被人阴，太弱又会被欺负，不出业绩被领导干，太出业绩，领导也防备，周围的人嫉妒。


    【解析】看似都是两难问题，无法解决，其实是思维走进死胡同，需要换个维度来思考问题。


    # 1、人际关系经营的问题


    很多人把学校的关系交往模式带入到了职场，觉得要帮助同学，维护好同学关系，毕竟日常和老师来往的少。其实在职场并不是如此，职场的核心关系是和领导的关系，本质是和权力的关系，只要把这个关系处理的好了，其他同事懂人情世故的，会主动巴结你。不懂得权力关系的，背后诋毁你的，直接可以无视。所以，职场人际关系的经营，主要是经营权力关系。权力越大，关系越好。如果只是重点维护和同事之间的关系，不但浪费精力，还浪费时间和财力，得不偿失。


    # 2、人的强弱处理的问题


    人的强不仅仅是工作能力强，更重要的是要势力强。工作能力强就会被人诋毁，因为大家都嫉贤妒能，不希望别人显得比自己聪明。而且工作能力强，很可能会被他提挎，挤压了别人的升迁机会。所以，大家都会对工作能力强的人，不舒服。这不是真的强，真的强在职场是势力强。自己能够团结大多数人，然后对那些诋毁自己的，或是和自己不一派的，直接攻击和斗争，职场上，工作能力强，永远都不是斗争能力强的对手。所以，在职场要做的是善于斗争的权谋强者，而不是只会做工作。


    # 3、关于工作业绩的问题


    很多人有个核心的问题，就是工作业绩是归自己的，其实大错特错。如果你把业绩都归功自己，就会有题主说的毛病，没业绩，会被裁员。有业绩'
  merge: -1
  img_proc: true
- pgno: 313
  md: '会被领导防备，同事嫉妒。其实权谋家对于业绩早就有戒条“有功归上，有过自担。”早请示晚汇报，把功劳建立在领导的亲切关怀和直接指挥之下，领导自然不会防备。如果自己独立完成任务，也不要高高在上，要把其归结为，同事的协作，把奖金请大家聚餐一顿，自然不会有人嫉妒。领导认可你的业绩，才是真的有效的业绩。


    所以，我们一定要明白职场的真相：经营好职场的权力关系，就抓住了主要矛盾；职场所谓的强大，不是工作能力的强而是人际关系的拉拢和斗争水平强。而业绩的目的就是帮助领导提升价值，只有建立在这个框架下的业绩才有意义。如果自己把功劳都拦在自己身上，相当于利益上吃独食，怎么可能不被人防备和妒忌呢？所以明白了上述的核心，也就不存在两难的问题了。


    # 如何服务领导？这三大方面是精髓！


    【困惑】老大，通过学习权谋，了解领导心思，终于有机会给领导提包，做助理了，但是伺候人的事情，还不知道如何下手，有方向吗？急求！


    【解析】很多职场人，认为只有做具体事务性的工作才认为能够体现出价值，其实，最考验人的就是对领导的服务工作，这个工作远比其他工作都难，而且收获巨大，一旦赢得领导的认可，后续就会有更大的权力，更大的平台和机会。服务领导，察言观色是基本功，总体都是从这三方面下手的！


    +   1、主动


    主动是服务的第一要义。眼里要有活，不能等指挥，等安排，要主动的站在领导的角度去思考问题，如何的能把自己的工作做到领导前面。领导没想的，你想到了；领导想到了，你已经开始完善方案了；领导思考执行了，你已经开始着手落实了。不用一个眼神，才能领会，而是提前做好了一切。'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# 2、全面


    服务领导不要问工作范围，因为领导所有的事情都是工作，这些东西并不仅仅是关于工作的内容，只要你出现在领导身边，所有的一些，都应该积极的参与其中，当然涉及领导隐私的事情，自己要把握好度，和自己的口风。其实随着深度的信任，领导对你开放的领域就会越宽广，让你参与的越深。


    # 3、细致


    服务工作不是做了，就行了，而是要不断的在细节上下功夫。比如说看到领导口渴了，主动倒水，这是服务基本功，但是如果知道领导的口味，泡好领导最爱的茶，这就是很好，但是如果把茶水最佳的温度最佳时刻端上来，这就是优秀。服务人，有三重境界，让领导满意，让领导惊喜，让领导感动。


    所以，我们只要把握上述的三大原则，就能把领导的服务做好，这不是某些人眼里的巴结人、奴仆，而是体现出，一个人的用心程度、细致程度和忠诚程度。所以领导对服务好的人，更加青睐其工作能力，在更加的信任关系下，会更加重用，这在职场会走向更高的位置。


    # 服务领导的事请过时了吗？不服务领导永远没机会！


    【困惑】服务领导的事情过时了，不干出成绩能被提拔吗？


    【解析】我们从小上学，学习科学文化知识，但是没有一门课程是教授人际关系的，恰恰中国又是个人情的社会。当普通人不断的对办事干活用心研究的时候，那些高人早就洞悉人性，当普通人还在抑郁不得志的时候，人家高人已经利用关系进入了快车道，气人不？愤怒不？埋怨社会，抱怨不公？这有用吗？这背后是什么职场逻辑？总有人认为服务领导过时了，'
  merge: -1
  img_proc: true
- pgno: 315
  md: '干出成绩才能被提拔，其实这就是不了解人性，不懂关系的集中体现，因为普通人无法理解下面三个权谋逻辑：


    # 1、没有服务，领导就不会熟悉你的能力


    为什么很多人空有才华，却没有人知道？为什么到处都是怀才不遇？就是因为，不善于处理和领导的关系：平时不主动接近领导，内心有一种尴尬的恐惧感存在，不是nud，就是不好意思，或是尴尬不知道说什么，普通人大多这种状态，作为领导天天很多工作，哪有心思去了解一个下属的细腻内心？因为精力有限，所以领导只能对身边围绕的人才会熟悉起来。只有不断的出现在领导视野，才能熟悉你。


    # 2、不熟悉能力，领导就不会给展示机会


    组织内的日常工作不出彩，都是一些个按部就班的事情，能有多少创造性？作为下属靠什么展示自己的才华，展示自己全面的能力？没错，只有有机会才可能展示自己。那么机会怎么来？领导会把重要工作，冒险交给一个不熟悉的人？只能通过服务领导的过程中，领导才能逐步的熟悉你的性格、态度、能力、忠诚等各种要素，有了这些，领导才会在机会出现的时候，第一个想到，让你站出来。


    # 3、没有展示机会，永远都创造不出业绩


    有了好的机会，第一个想起你，这就是服务领导的重要意义所在，因为有了这个才能让你，真正的展示自己的能力，实实在在的创造出业绩。而且，只有在领导的支持下才能创造业绩，原因是，领导点将让你去做，你就和领导无形中捆绑在了一起，如果你不行，领导会很没面子，所以就会很大力度的支持你。如果和领导关系一般，不是领导点将，而是自己努力干活，领导为什么要全力支持你？

    你只有成为领导的人，你创造的业绩，领导才不会嫉妒，因为你的成绩就是他的成就。但是如果你自己不在领导的直接安排下，独立创造业绩，还认为和领导无关，不懂得有功归上，没领导没关系，还可能成果大了取而代之，领导为什么要重视你，而不是打击你呢？只有明白了上述的职场逻'
