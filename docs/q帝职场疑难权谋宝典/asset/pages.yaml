  md: '# 为什么你看了那么多文章还是学不好权谋？


    【困惑】说句实话，关注这么久，越来越迷惑。从上帝视角分析无数可能，但是你自己身在其中，能想到那么多？如果啥事都这样分析，根本寸步难行了。不知文主在生活工作中是否能做到这样极致分析？


    【解析】昨天“权谋智慧”公众号，题主的这条留言，没想到大家关注度很高。这说明代表了大家的一种集体的困惑和情绪，这需要写一篇文章深度分析下：


    +   1、看文章多了，为什么会困惑？


    很多人看文章，都是站在自己的角度看文章，每个人的阅历和理解能力有限，你只能看到，你能看到的东西，举个简单的例子，如果你是厨师，你走过一条大街，你只会关注饭店有多少，都是做什么菜的。而不会去看看有多少服装店，有多少手机店。看权谋文章也是如此，你基本上，看不到你未知的东西，这就是背后的价值观。为什么权谋看文章是一个方面，培训是另一个方面，核心的就是，必须进行价值观改造，用古代的说法就是，修炼内功，没有内功，自然会走火入魔，越来越混乱。我们权谋网开展培训以来，2000多人接受洗礼，从未出现这种困惑的情况。


    +   2、为什么要不同角度分析问题？


    为什么要从不同的角度来分析问题，这就是科学研究的方法，那就是穷尽各种路径，知道一个事情所有的发展可能，选择最大概率的去做，这个基本上就能最大程度的保证成功，这就好比，我们去北京，就必须要知道从自己的出发点，有几条路，能够选择，最短的路是什么，我们能够使用的交通工具是什么，然后依靠自己的实际情况，去选择交通工具和路径。有些人，可以选择坐飞机，为什么还有人坐高铁呢？原因就是各自口袋里'
  merge: -1
  img_proc: true
- pgno: 102
  md: '的钱不同，而不是眼里只有大巴车才能到达目的地。权谋的目的不是去记忆一大堆的知识，而是训练思维，让自己拥有分析问题解决问题的能力。


    # 3、身在其中要不要去想这么多？


    不识庐山真面目，只缘身在此山中，每个人在现实中要不要都去想这么多，这个和三大原因有关，和自己的知识有关系、和自己的情报有关系和自己的资源有关系。首先说知识，一个人没有知识，有些专业的工作干不下来，各种管理难题没见过，就是坐下来想，也是瞎想。因为你没见过的东西，怎么去想？再者每个人都不是完全的情报状态，只能依靠见过的可能性进行推理，来弥补各种不足。只能把各种可能都找出来，然后不断的通过新出现的情报验证。最后就是和资源有关，自己想布局一个美人计，感觉不错，但是美人哪里来？她为什么要听你的？这都需要积累，而不是坐等。


    # 4、啥事都分析会不会寸步难行？


    所有进入我培训班的人，我都一再告诫大家，我们学习权谋是用来做大事，不是为了单位一袋苹果的福利绞尽脑汁的，不是为了邻居家的恶狗，每天想着怎么打它的問題。每个人的精力都是有限的，一旦把自己的心思用在小事上，就自然没有精力做大事。而且整天在小事情上，不断你的算计，就是再蠢的人，也会认为你是個斤斤计较的人，这样天天频繁操作的人，大家会都防着他，都被人提防了，还谈何机会。我们权谋研究讲究一击必杀，简单的例子就是刘备，只有树立了讲仁义的形象，最后一次，才能够坑到刘璋。所以，不是啥事都处处分析，我们权谋家只会，非危不战，非利不动。


    # 5、我能不能在生活中极致分析？


    具体到我个人，我在生活中从来不做这样的极致分析，生活是用来享受的，没有利益的地方，算来算去，浪费自己的精力？把自己的顶级智慧用在家长里短，吃 сутки穿衣上，这不是高射炮打蚊子？别说是权谋家，就是普通人，也不会这么浪费自己的智慧。但是在工作上那就不一样了，因为'
