  md: '态下。


    # 101、如何切入一个新行业？


    学员：我想请教一下老师，去做工程项目，应该怎样了解工程项目，读些什么书？我 traject 零基础的打算自己做，应该怎样做会好一点，请指教。


    权谋网：先买相关专业的基本教材，说一下名词和流程，然后在网上找相关的群或者是论坛进入行业内部，最后到现场找几个前辈请人家吃饭请教。


    # 102、创业还是打工？


    学员：老师，我是该选择创业还是选择打工呢？


    权谋网：这个问题很经典，每个人是该创业还是该打工，到了一定阶段，都会面临这种抉择。但是大家要明白，无论是创业还是打工，都是对自身资源的转化方式，我们不要纠结于手段，而要考虑到本质。我们当下的能力和条件下，所拥有的资源是打工变现合适还是创业变现合适？因为无论打工还是创业，本质都是围绕着资源变现展开的，发现资源、控制资源和变现资源，找到更合适的变现方式。比如，如果你只会单一技能，你还是好好打工。如果你认识一个市委书记，那你最好还是出来创业。


    # 103、做好证据、记录，避免背黑锅


    学员：遇见一个事情，请教老大，之前有一个大项目，领导安排他的情人做，时间和资源都投入很多，领导给老板承诺了一定办成，还写了军令状，但是现在项目操作过程中，遇到很大问题，极有可能烂尾，在事前未通气的情况下，今天忽然通知，让我的科室加入项目组，我以科室任务已满负荷拒绝，但依然强行要求我加入，就类似于抓壮丁的感觉，我高度怀疑这是甩锅和陷阱任务请教老大我该怎样才能不撕破脸，又不用背锅？


    权谋网：这个事儿最好的方法是进入之前做一下清算和交接，如果不能清算，就记录介入之后的工作以及工作量，这样做到有据可查。与此同时，在工作过程中收集对方的错误证据，以免到时候发生扯皮，能够随时拿出强有力的反击。这事千万不要越级汇报会把事情复杂化扩大化，除非你能'
