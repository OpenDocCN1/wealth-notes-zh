  md: '# 领导让我把看家技术教给别人怎么办？


    【困惑】过完年刚上班，领导就带来一个新人，让我把技术教给他，这是领导的亲戚，不教不行，教了更不行，我该怎么办？请Q帝救我！


    【解析】这是个常见的左右为难的职场例子，教给他，自己就有了可替代性，未来的饭碗不保；不教给他，自己就会得罪人，未来很难立足。权谋家从来不在开头，做不做这个层面纠结，顺从权力是第一位的，我们都是在操作的过程中消化。通常职场高手都是这么打组合拳；


    +   1、缓慢化


    说个相声都是三年学徒两年效力，三年学徒都是从打扫卫生喂狗开始。跟着学中医也是先抄方子来个三年五年再说。啥意思啊，就是说，以磨性子或是练习基本功为借口，缓慢教学过程。这个招法就是慢慢教，无限放大，拉长，没几个人有耐性。多让他干打下手活，自己笨学不会，我们有什么办法。


    +   2、障眼法


    商业大剧《大染坊》里就有这样的段子，主角陈六子，不得不教竞争对手如何的染布，所有的东西都教了，在核心的环节，偷偷做了手脚，对手不知道，以为自己学会了，自己一搞就失败了。我们被迫教别人东西的时候，对于核心的东西，就应该藏着掖着，这样他永远都摸不到门道，让他以为不熟练导致。


    +   3、提升术


    上面讲述的办法基本上能够应付了，但是现在技术上是没有什么秘密的，只要别人肯钻研，终究是能够学会的，此时老板找人过来学，其实内心是对你的不信任，这时候，本质还是要不断的提升自己的技术能力，或是管理能力，忠诚能力，提升综合素质，让自己真的无可替代，才是最安全的。'
  merge: -1
  img_proc: true
- pgno: 360
  md: '通过上述的分析，题主应该也能够知道自己该怎么做了。在态度上一定要积极，而不是故意表达不满，因为越是积极，上述的套路使用起来就越好用。如果你态度差，领导就知道你不肯教，你这就是对抗，那新人就会认为你故意为难，而不满。笑着把他引导到坑里，还要感谢我们才是王道！


    # 权谋的三条岔路，搞不好就走偏了！


    【困惑】老大你能说下权谋和阴谋以及阴谋论的区别吗？一直搞不清楚！【解析】用谋，讲究的就是“出其不意，攻其不备。”一旦公开，就会被人防备，加大自身的投入成本和面临不确定的风险，所以计谋通常都是以阴谋的方式出现，就是不方便公开。但计谋是包括阳谋的，比如毛主席的论持久战，以及推恩令，都是阳谋，敌人知道也是无可奈何。权谋讲究怎么有效怎么来，不考虑阴阳，只考虑成本收益和风险代价。至于阴谋论，可以说，是权谋的仑路。而这个岔路其实有三条：


    # 1、阴谋论


    阴谋论不是权谋，这类人通常看不得光明，总觉得任何事情的背后都是有一只无形的手在操控。一切都是牛人策划的结果。所以都在不断的虚构一个全能的王出现。这种人只是出去猎奇的思维，而不是真正的权谋，不是基于事实的客观研究。只要够离奇，够神秘，就够吸引眼球，仅此而已！


    # 2、大旗党


    你说，国家是不是在下一盘很大的棋：我们国足故意输给越南，因为，我们国家的崛起，引起了周边国家的恐慌，用国足失败，让他们对我们国家不再警觉，让他们有一种虚假的自信。这大旗党，和阴谋论恰恰相反，认为所有的自卑的事情，都能找到一个自我安慰的牛逼解释，挽尊而已。


    # 3、钢盆族'
  merge: -1
  img_proc: true
- pgno: 361
  md: '本来想说是杠啸族，杠精和喷子，但是因为用的是拼音，出现的是钢盆，也就将错就错了。这些人，无论你做什么，都要拿着放大镜找杠点，喷点，因为这样发现了细节，就因为自己找到了真相，就以为找到了别人不知道的点，就展示了自己的优越感。这种钢盆族，其实就是虚假优越感而已。这三条岔路，要么是吸引眼球，要么是推诿无能，要么是盲目优越，这都是无法准确的基于事实来研究问题解决问题。我们权谋就是尽可能的找到真实地信息，明白关键的问题，寻找有效的手段，无论真相多么残酷，不去粉饰，无论问题多么艰难，不去回避，无论手段如何无耻，不去放弃。权谋完全的就是摆脱任何的主观束缚和谬误，专注的实事求是，一切从实际出发的！


    # 从学生到职场必须树立三大意识！


    【困惑】老大，我刚考入体制内，总觉得处处碰壁，像无头苍蝇一样，郁闷的很，总不得法，又感觉权谋博大精深，一时不知如何下手，有什么快速入门的策略吗？


    【解析】之前讲过多次了，今天再详细说说，从学生到职场，有一条很大的鸿沟，因为从思维到游戏规则都要重塑，所以原有学校的一套已经完全无法适用，我们想快速权谋入门，就必须有三大意识：


    # 1、靠山意识


    我们上学时候的老师都是随机安排的，没有任何的选择权，只能被动的随波逐流，顶多看流行的几本书接触到外部的东西，但是我们走向职场就大大的不同了，我们必须有靠山意识，必须自己主动寻找到能够带领我们进步的人。不是哪个领导都能称为老师的，都是打工的，凭什么把本事交给你，凭什么你做得好，就推荐提拔你，因此，我们就必须主动的寻找那些真的有能力，愿意带着我们的人。如何找到这样的人，这就需要我们积极'
  merge: -1
  img_proc: true
- pgno: 362
  md: '主动的，给人家送礼利益交换，给人家当小弟提供服务，给人家当女婿深度融合。


    # 2、资源意识


    学校里的课程都需要学习，而且是自己学习的东西越多越好，但是我们走向职场之后就不同了，我们不是来学习的，我们是来赚钱的，我们的能力和精力都有限，必须把自己有限的时间投入到回报更大的地方。职场那些回报大的地方自然就是资源丰厚的地方，千万不要抱着多学东西，多历练，多付出的地方，这就需要我们准确的分析判断哪些地方资源更多，更能让我们获得人脉，获得领导重视，获得权力，做事不要凭感情，想当然，哪些人值得交往，哪些事值得做，都要考虑有没有更多的利益，有靠山就是为了资源。


    # 3、竞争意识


    好部门，好工作，好位置，能轮到我？没错，越是资源丰富，利益集中的地方，越是竞争激烈。我们在学校同学之间，都是互相帮助，即使不帮助，也不会互相伤害。但是职场就不同了，大家表面都是同事，天天在一起，表面和谐，其实利益到来的时候，立即就会明争暗斗，从朋友到敌人无缝对接，你平时给同事说的隐私，转身就变成了被攻击的工具，你私下对领导对工作的牢骚，立即就众人皆知，所以我们一定要有竞争意识，不断加强自己的本领，赢得领导的重视和支持，管住自己的嘴，收集同事的把柄，以备不时之需。


    经过上述的分析我们能够看出来，有了主动寻找靠山的意识，就有了正确的道路，有了支持，自己就不会再孤独，而是融入到组织里，犹如一滴水融入了大海，不会在干涸和无助。有了靠山，我们就有可能接近资源，让自己能够快速的进行积累，无论是能力还是关系，都能高效的聚集。当然，我们吃肉的时候，一定呀避免被人抢走，这就需要自己对竞争对手，明的或是暗的，再或者是未来可能对手，都要保持足够警觉，有了上述的三大意识，就能够有了明确的奋斗方向了。'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# 如何权谋手腕除掉潜敌！简单的围棋作战原理就能搞定！


    【困惑】老大，看了很多你的权谋文章，知道了除掉潜敌的必要性，但是具体什么手段能够神不知鬼不觉啊？脑子里没方向，能指点下吗？


    【解析】既然是潜敌，也就说明此时的利益对立尚不明显，的确更需要非直接性的手段来实现目的。权谋高手通常都擅长围棋，围棋中潜敌情况就是，当对手形成大模样，还没有形成实地之前，我们必须实施侵消的打入手段。本质就是通过深度的布局计算最终让对手处处被动。通常是三招齐发，灭敌无形。


    # 1、通过分断手法，孤立潜敌


    围棋中，把对方棋形分割成两块的棋，称为分断。职场中也是如此，潜敌很优秀，这时候我们就要私下里联合其他人，不断的孤立他。各种途径释放出他的不良信息，或是让人嫉妒，或是让人愤怒，通过不断的暗中谣言，栽赃陷害，让他和周围所有的关系都处理不好，没有了良好的职场关系，被排挤，大多数自己就走了。越是有能力的人，交际能力一般都差，还很孤傲，通常分断手法，最为有效。


    # 2、通过靠压手段，压缩潜敌


    下围棋，紧挨着对方的棋子下一子，叫作“靠”。紧挨着对方棋子的上一路下子，把对方棋子压制在低位的下法叫做“压”。如果这个人的人缘特别好，也不是孤傲，我们又不擅长离间手段，这时候就需要通过贴身近战的靠压手段。只有靠近他，接近他，才能获得更多的毛病和隐私，通过压缩限制他，让他没有更多的发挥的空间和时间。处处被掣肘，处处有绊闹，这样的人，自然难以有机会出头。


    # 3、通过搜根手段，掏空潜敌'
  merge: -1
  img_proc: true
- pgno: 364
  md: '围棋术语：搜根就是夺取对方根据地，使其不能就地成活。没隐私，无法挟肘。这时候，我们必须消除掉他赖以生存的根基。我们必须使用各种方法让他离开自己的根据地。上策是自己提高能力完全超过潜敌的核心能力，他技术好，你比他更好，他忠诚，你比他更听话。中策是，调虎离山，让他去做不擅长的事情，鼓励他，给领导推荐他做不擅长的。下策就是，不断的搞破坏，让他的核心能力几次失败。


    职场和围棋本质是一样的，在一开始的布局阶段，并不会引发战斗，但是随着彼此的做大做强，发展的空间就会有限，职场的资源就会有限，战斗的打响就是个必然的阶段，只是时间问题。资源有限，位置有限，时机有限，所以，早做准备的人，都能占得先机，赢得先手，从而让潜在对手被消灭于无形，自己能够笑傲职场，占领在不败之地。上述的手段全盘操作，基本上无懈可击。


    # 权谋死活题——我被暗算了，该如何的反击！


    【困惑】我在职场就遭受到了你说的，被人孤立的情况，我该如何的反击？


    【解析】每次写完职场权谋手段的文章，都会有一大堆的留言，询问如何反击，其实作为初学者，首先要做到的就是不要弱者带入和左右互搏。把自己当成受害者，不断的谩骂，这不会让你进步；不考虑变成强者，精进手段，反而寻求反击之策，也是残局玩法，或是陷入没有立场的左右互搏。不过，在这里还是要给大家提供反击方案，便于爬出泥潭，我还是以围棋的术语，来让大家更加清晰：


    +   1、布局阶段：确定实地和厚味


    围棋最讲究布局，一开始就要明确哪些是自己能够确定的地盘，哪些是能够通过努力可能会争取过来的。现实职场也是如此，想反击别人，我们就要坐下来分析自己的势力和形势，自己能利用的资源和关系，能够拿出来'
  merge: -1
  img_proc: true
- pgno: 365
  md: '的工具和手段，确定哪些是能直接利用的人或事，哪些是能够努力争取的资源和条件。


    # 2、中盘阶段：明确侵消或治孤


    通过分析完自身，这时候就要接着分析对手，通过对比同样的条件，我们就能有个整体的预判，能不能赢得对手，我们的胜算是多少，通过这些计算对比，我们要确定自己所要接下来采用的方案，是进攻还是防守。自己通过努力能够最大可能的调动有利因素，能赢就斗，不能赢就忍着避免扩大损失。


    # 3、官子阶段：计算死活和先手


    有了上述的战略判断，我们才能够去设计反击策略，如果不加分析，不确定战略，就盲目的说手段，就好比敲山震虎，你连根棍子都没有，拿什么敲，没实力没后手，敲到老虎发怒，自己能不能跑得掉？所以，我们要反击，就要计算对手的死活，能不能吃掉，我们吃不掉能不能有主动权。所以啊，如果有人不知道你什么条件，什么阶段，什么资源，什么能力，什么对手的情况下就盲目的出主意，给手段，这不是帮助你，而是骗你，害你，把你推向深渊。因此，只有自己通过上述的步骤详细的分析自我，然后不断的积累我们的权谋定式，才能有机会一击必杀，获得职场成功！


    # 很多人用鲁迅的话攻击权术，其实真的错了！


    【困惑】“搞鬼有术，也有效，然而有限，所以，以此成大事者，古来无有。”你怎么看？


    【解析】这段话来自鲁迅的《南腔北调集》里的《掏鬼心传》，经常有人引用鲁迅的话来讽刺攻击权谋，表面上感觉很有道理，其实大错特错，且不说，这篇文章里“掏鬼”指这种小动作，并不是权谋，即使是权术，这'
  merge: -1
  img_proc: true
- pgno: 366
  md: '个也是有问题的。成大事者，刘邦就是一个，朱元璋也是一个，曹操，刘裕多了，走向历史巅峰的开国皇帝哪个权谋水平低？


    # 1、有效


    其实权谋这个东西，有效就行，我们做什么事情就是要找到有效的方法，至于能有多大的效果，这个并不是过多要考虑的问题，三分天注定，七分靠打拼，我们做好自己的对的事情，至于什么结果，听天由命。所有的权谋家，都明白成王败寇，都坦然接受任何结果。


    # 2、有限


    权术和任何的技术一样，都有自己的局限性，没谁把权术当成包治百病的灵丹妙药。权谋家从来都认为怎么有效怎么来，洗脑儒家有效，就按儒家的来，暴力有效，就按暴力的来，拘泥于一种手段，这本身就是狭隘的理解了权术。有时候该做好人就得做好人，因为阶段变了，逆取之后就该顺守。


    # 2、成大事者，古来未有


    很多人都认为自己要成就大事，其实，社会上 99% 注定就是个普通人，过着平凡的日子，全款买套大房子，有个漂亮的妻子，聪明的儿子，健康 的父母，自己没事喝喝小酒，这就够了。所以，只要在职场用点小手段，保持自己的位置，就行了，40
    多岁还要和年轻人拼能力？


    其实鲁迅是非常精通权谋的人，因为人家一开始就是地主阶级，对此有家学，很精通，这篇《掏鬼心传》里这样写道“治国平天下之法，在告诉大家以有法，而不可明白切实的说出何法来。因为一说出，即有言，一有言，便可与行相对照，所以不如示之以不测。不测的威棱使人萎伤，不测的妙法使人希望。”看到了吗，这就是鲁迅熟悉领导的权术，说话含糊，就要让你揣摩，不然，一说出去，就收不回来，所以必须让捉摸不透。深不可测，让人望而生畏，让人看到希望。'
