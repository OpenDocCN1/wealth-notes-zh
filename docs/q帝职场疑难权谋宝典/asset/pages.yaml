  md: '所以，我们面对领导的当众画饼，积极地配合鼓掌，积极地表态支持，这就够了，至于，我们是不是要去追随，这个还是依照上面的三个理念来衡量下。最后，抛开虚幻、私下承诺、利益互换，这才是职场最本质的核心。大家切记，别被人一些个虚拟的东西忽悠了！


    # 关于职场上下级信任的悖论解析——权力的信任是动态博弈！


    【困惑】q哥，权谋家持术不持信，那就是说权谋家根本不会彻底信任手下，但是手下的第一要务又是获得领导信任，这不就是个根本无法得到的结果嘛？


    【解析】你陷入了左右互搏，结果静态，以及对信任的边界认知不清的思维误区，现在详细解析下：


    +   1、信任是分为三大部分


    职场上下级关系的信任，其实包含着三部分的内容：首先是能力认同，上级对一个人的办事能力的信任，认为他在所执行任务的范围内，能够独立解决问题，比如刘邦内心深处并不是信任韩信这个人，但是会相信他的军事能力。其次是，感情共鸣，每个人都有自己的情感需求，自然在某个人面前就会特别的放松，比如刘邦就喜欢为自己的服务石奋。最后是，权力安全，这就是忠诚，任何时候都能够维护领导的权力稳定，刘邦，随时把不能打仗，不会服务，但是能忠心的马夫夏侯婴带在身边。


    +   2、不持信不代表不相信


    一方面，因为上级对下级的信任分为三种，作为领导，也就不会把所有的信任都加在一个人身上。所以很多人不断的努力，也只能获得领导的一部分信任或是一种信任。作为下属，不断的努力，也只是无限接近而已，不可能完全信任。另外一方面，持术不持信不是不相信，而是-functions
    depends-不依赖。所谓不依赖，就是不能因为信任，而让自己丧失主动权。因为韩非子在讲“持'
