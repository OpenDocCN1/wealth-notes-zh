  md: '权谋就是要在规则、人情和自保之间找到平衡。任何一根筋的做法，都无法解决。多学点权谋，到哪里都有用！


    # 为什么 35 岁之后，人与人之间的差距会越来越大！


    【困惑】30 岁之前我们的差距都不大，不管是收入也好，地位也好，但是一旦到了 35 岁，人与人之间差距越来越大，甚至拉到 10 倍 20 倍，这究竟是为什么？看了很多观点，众说纷纭，第一次给权谋网留言，希望能够解惑！


    【解析】这的确是目前特别火的话题，为什么学校出来之后，大家看着都差不多，但是十年之后，天差地别？主要原因是三点：


    +   1、起点不一样


    从学校走向社会，表面是一样的，都是从零开始，其实不是，从出生的那一刻起，每个人都拥有了不同的社会资源。不同的家庭，带给孩子的起点是不一样的。最简单的，人家家里可以拿出钱给买房，而你只能租房房子。拿出工资的三分之一租房房子，手里钱积攒不起来，而人家积攒起来，可以继续买房。再比如，人家父母有经验，人生道路上不犯错，有你的父母妥受的社会底层，尽管他们很爱你，但是着实拿不出指导意见，让你自己拼，这个人生试错的成本又很大。这些一步步的积累起来，10
    年后差距很大。


    +   2、方向不一样


    人生的道路很多条，都有成功的没错，但是成长空间、成长效率、成长机会都不尽相同。比如人家当年加入了最有想象力，发展最快的互联网行业，而你进入了传统的国企，人家的公司上市了，而你在国企按资排辈，想提拔还远着呢，这就是行业的选择不同。还有就是，人家早年干培训和房地产都赚钱了，而你却在
    2021 年才入行，一个夕阳产业怎么可能有空间？'
  merge: -1
  img_proc: true
- pgno: 354
  md: '来个最简单的例子，1910年，净身进宫做太监，和加入军队，能是一个效果吗？所以，没有选择一个高效率大前途的行业，自然慢了下来。


    # 3、积累不一样


    有句话说的%&quot好，你看一本书，和别人没什么差别，但是你读完一千本书，差距就出来了。人生很多情况下也是如此，别人在一个单位干上十年，一步步的淘汰掉对手，自己走向了高管的位置，而你十年时间换了十几个公司，哪个公司都是坶坶的底层，工资收入怎么可能一样呢，人家早$从工资收入转化到了资源收入，而你还是靠体力赚钱，人家的各种关系的积累，而你什么都没有。还有人家不断的在一个行业积累，而是你换了很多个行业，都是从零开始，所以这之间的差距怎么可能一样呢？


    所以，看着大家表面上走出校门都一样，但是如果一个人，在高起点，而且有正确的指导，在高效的道路上不断的积累，十年时间就会快速的把距离拉开。但是真相是，我们大多数，都是那点工资，没有家里人的支持，基本都是毫无积蓄的月光族，又没有好的老师或是家人指点，不断的走错路弯路，浪费了金钱和时间，又不会处理人际关系，不会斗争，得不到提拔，不断的跳槽，没有任何积累，坶坶的职场跳蚤，所以，当你十年后转身看身边的其他朋友，你已经一步慢，步步慢了！


    # 职场的三大意识，决定人生未来！


    【困惑】Q帝老师看咱们的权谋网，一直强调权谋价值观，快过年了，想回家给我混的  不好的妹妹说说，我一直摸不到门径，能够指点下吗？


    【解析】给自己的妹妹讲权谋，最好的还是从具体的事情入手，提供解决方法，不断的得到验证，才能继续听你的，潜移默化中完成价值观的灌输。如果直接说权谋价值观，基本上会起到反作用，遭到反抗，如同鸡对鸭讲，'
  merge: -1
  img_proc: true
- pgno: 355
  md: '最终会搞的都不愉快。但是你这么说了，我给你说下权谋价值观是建立在三大意识之上：


    # 1、权力意识


    职场最重要的是不是做什么工作，而是领导，是不是给资源、给支持、给平台。有了这些才能够实现自己的理想抱负，而自己工作的目的就是获得领导的信任和信赖，不断的给予更多的资源和支持。所以在职场想做的好，首先就是权力意识，明白领导有什么喜好，如何获得信任，有了这些，才能够明白方向。


    # 2、资源意识


    公司或是上司为了自己的发展和稳定，不断的把资源交到我们手里，这时候，我们就要利用手里所掌握的这些东西想办法转化为自己的。这并不是我们说的贪污受贿，当然这也是一种，主要的就是通过手里的资源交换人脉，交换自己的权力，交换自己的其他资源，这样才是职场发展的核心逻辑。


    # 3、斗争意识


    谁不想手里掌控的各种物质资源，权力资源，源源不断的转化成自己的？关键是别人都静静的看着你去赢取领导的信任，不说你的坏话？看着你不断的转化资源，没有人给你捣鬼？其实组织里的资源非常有限，都想不断的往上攀爬，所以斗争意识必须有，不会天上掉馅饼。不然，有馅饼也拿不住，吃不下。


    所以，在职场上，最需要的就是树立这三大意识，这三大意识给搞明白了，也就基本上能入门，知道自己正确的方向了。不断的研究和顺从权力，接近和攫取资源，打击竞争对手，维护自己的成功，这些就是权谋价值观的底层逻辑。'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 如何结识高端人脉？


    【困惑】Q帝，有些行业特别需要关系的？请问如何认识行业的高人或者说如何从零开始建立人脉，谢谢！


    【解析】资源类的行业最需要关系，技术或是天赋类不是很需要。认识高端人脉一直是咱们微信公众号“权谋智慧”的热度话题，今天把历史上权谋家崛起的人脉经验，完全汇总后，给大家分享下：


    # 1、逐步升级论


    很少有人可以一步登天的认识高端人脉，而是首先要通过自己的价值提升，不断的更换圈子，一步步的接近高端人脉。大部分人的路径，就是自己做事业，一步步的做大做强的过程中，不断的升级换代认识更多的人，一开始即使认识高端人脉，自己价值不够，没有互动的利益基础，也是没有作用的。


    # 2、潜在投资论


    高端人脉都有自己的圈子，外人很难打进去，人家早就形成了利益联盟，如果不是小圈子有人脉缺口，基本上也不会补充新人进来。这时候就要提前抱着潜在的投资眼光提前结交未崛起的高端人脉。比如吕不韦投资秦朝质子，子楚，让其成为庄襄王。还有清末巨商胡雪岩投资未来的大员王有龄。


    # 3、利益交换论


    逐步的升级等不起，潜在投资没机会，是不是就完全没有可能了呢，其实也不是，那就是巨额利益交换论。李园通过春申君把自己的妹妹送给楚王，最终李园外甥成了楚幽王。送美女，送国宝，送大额现金，最终换取高端人脉的认可和信任。这就需要把自己所有的全部押上去。


    # 4、爱好互动论'
  merge: -1
  img_proc: true
