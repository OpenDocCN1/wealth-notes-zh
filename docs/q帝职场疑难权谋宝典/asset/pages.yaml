- pgno: 386
  md: '说话，我该怎么给她说，说服这个问题？媳妇脾气有点倔，呃…


    权谋网：不和垃圾人计较，这是对的。因为浪费自己的时间和精力最终得不偿失，底层思维的人，计算能力比较差，看不到全局，只看到眼前的小利，所以基本上都是小事精明，大事欠缺。但是你对自己媳妇的处理上，有问题，首先要带领自己的家人同步成长，要在平时不断的灌输权谋的价值观；其次，要学会说服技巧，准确的表达你的观点，你的价值观到位，但是权谋技巧欠缺；最后，就是要学会哄媳妇，不要争辩，买点好吃的，说几句好听的，这事就过去了。


    # 4、跑关系的事情，不能操之过急


    学员：事情经过，上个周日，在副秘书长组织的一次半私密的家宴上，遇到本地一所职院的 Z 书记（正职）。在大家交谈一些工作的时候，可能我说看的比较多。Z 书记突然提出：我是否愿意调到职院工作，他们现在缺人手。接下来上周二带着我的各种证书和资质材料冒雨直接去
    Z 书记办公室，不巧书记出去开会。周三电话约书记，说想给领导汇报一下思想，这次见到书记，把我的各种获奖证书和资质证书拿给他看，并简单介绍了一下学习，工作履历和现状。Z
    书记让我给他提交一份简历，并让我加他微信给他发电子版。他当我面给人事部门负责人打电话：人事部门负责人说是跨系统调动或人才引进不好办，需要上市里“编委会”讨论确定。我表态能认识
    Z 书记就是碰到贵人一样，这事只要有一线希望愿意尽最大努力，拜托领导费心帮忙。我去的时候顺便带了一盒高档茶叶给他，书记说办公区都是摄像头，坚决让我又拿走了。


    我的情况：今年 3 月份进群跟着老大学习至今，思维方式如醍醐灌顶。原有价值观受到极大震动。我在本市一个小型事业单位工作，纯技术出身，没有大背景，工作近 20
    年，任中层 10 年，几乎年年都是先进和优秀，高级职称。专业工作经验丰富，以前只知道埋头干活。40 出头，机会不多了，我很想调到个大平台工作。


    第一次带了茶叶和一箱五粮液，原本打算加深关系，再送重金。但是目前'
