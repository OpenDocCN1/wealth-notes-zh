  md: '刘邦吗？


    权谋网：为什么有资源的人会和没有资源的人交朋友，其实这里上层分为三类人，有钱的、有权的、有美色的，但是聪明人本身是一种智慧资源，它包含下面三点，能够提高资源配置的效率；能够伪装自己的资源，让别人不知道它有多少资源；能够对别人的资源有多强的伤害能力。


    # 114、领导让我把握全局是什么意思啊？


    学员：我是搞技术的，刚刚提拔到领导岗位，老板让我把握全局，可我不是一把手啊，这是什么意思啊？


    权谋网：之所以给你这样的提醒是因为你是搞技术的，怕你不活跃，眼光局限，不能把握全局，因为一个人想要管理，不能只搞技术，要学会搞政治，也就是对你一个提醒，不能一根筋。把握全局不一定非得是一把手，才可以把握全局，而是一个人要进行多维度思考，多角度衡量，多利益平衡。


    # 115、没有小角色，只有小演员


