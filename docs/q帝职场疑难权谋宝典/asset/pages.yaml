- pgno: 61
  md: '到位而已。比如有人说，身边如果有溜须拍马，阴险的小人，我绝对不会被他骗。其实你想想，人家脸上写着字，表明人家是小人？你的段位不高看不出来而已。大多时候，人家给你卖了，你还帮人家数钱。作为最底层就是要学好权谋手段，不断的往上爬，等做到了中层，才有资格谈结党的问题。


    # 成功靠的是真金白银，而不是所谓的权谋，错在哪？


    【困惑】害怕权谋变成类似武术，吹的神乎其神，一上场被人打得鼻青脸肿，首先你还是得有资源，人家听你的被你管是因为怕你开除吗？不对，是因为你给的工资高。所以才听你的，你的所谓“权谋”才有用武之地。跟你混，图的是有肉肉吃。这才是根本。垓下之战刘邦和项羽决战，关键时候韩信，彭越都不来，项伯让项羽给他们加大封地，项羽不听，刘邦听从留侯的话给那些异姓王包括韩信大规模封赏，从而战胜项羽。这是靠的真金白银，而不是什么“权谋”。


    【解析】一个网友在权谋网后台留言，这问题极具代表性，我们详细的分析下，其中错误的思想。


    +   1、权谋并不是和资源对立的。


    《晋书·鲁褒传》：“军无财，士不来；军无赏，士不往。”没错，任何人追随都是为了利益而来，不给足够的利益，或是给的慢了，下面的人都会离心离德。但是人都是贪婪的动物，所谓欲壑难填就是如此，你永远满足不了他的胃口。比如韩信，刘邦把他从逃兵一步到位提拔大将军，这是多么强的知遇之恩，但是他却在决战的关键时期以此为筹码要挟刘邦。作为最高统帅，资源就这么多，让所有人都有肉吃，怎么可能，都给了韩信，彭越，那么萧何、曹参、黥布怎么办，跟随自己的几十万将士怎么办？没有资源不行，但是只有资源也不行，权谋就是最高效率利用资源的技术。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 2、给与超额利益是权宜之计


    留侯张良出谋划策，让刘邦在垓下决战前夕给了彭越和韩信超额的利益承诺，这本身就是权谋的体现，而不是真正的想给予他们真实的利益，只是权宜之计。也就是给了他们一个虚拟的诱饵，让他们为自己完成当下的任务，之后的事情之后再说。历史事实也是如此，彭越和韩信都为这次索取的利益而付出沉重的代价，承诺的东西都没有成为现实。刘邦作为最为权谋的政治家，他明白，那些没有到手的利益随便分，反正不是自己的，但是到手之后，是不是要分，必须自己说了算。没有一个人能够持续当然的不断吃肉，有用的时候可以，没用的时候，卸磨杀驴是常态。


    # 3、只要利益不会真正被信任


    如果一个下属的忠诚，建立在上级给的利益之上，有肉吃才会听话，那么权谋家也会当然的认为，这样的人没肉吃，一定就会翻脸。所以，任何下属内心只有利益交换思想的，一旦年老，知识退化，能力不足，都会立即清理，领导需要的不仅仅是能力，更是忠诚。当然权谋家内心都是“持术不持信”为信条的，权谋家会通过切断他们的后路。让他们不得不听话，以及通过制衡，他们如果不听话，也不会给自身带来多少损失。其实这个社会很多人都自以为有才能，可以靠本事吃饭，即使名牌大学的毕业生，在社会上也是大把的人，没有谁不可替代。


    质问者认为刘邦是依靠真金白银而不是权谋打败了项羽，这个只能说是没有读过《史记》就更别提《汉书》这些真实的史实了，为义帝发丧，直接从道德舆论层次，把项羽定位小人，直接占领了政治制高点，这不是权谋这是什麽，没这个如何凝聚天下人心？刘邦占领咸阳城，自己却屯军坳上，照着质疑网友的角度，就该直接分了秦宫财富，这样大家才有战斗力，就能直接打败项羽了。而不用苟且偷生般，费尽心思吃什麽鸿门宴了。


    再说个例子汉书原文【沛公之从洛阳南出轘，良引兵从沛公，下韩十余城，击杨熊军。沛公乃令韩王成留守阳翟，与良俱南，攻下宛，西入武关。沛公欲以二万人击秦崤关下军，良曰：“秦兵尚强，未可轻。臣闻其将屠者'
  merge: -1
  img_proc: true
- pgno: 63
  md: '子，贾竖易动以利。愿沛公且留壁，使人先行，为五万人具食，益张旗帜诸山上，为疑兵，令郦食其持重宝啀秦将。”秦将果欲连和俱西袭咸阳，沛公欲听之。良曰：“此独其将欲叛，士卒恐不从，不从必危，不如因其解(懈)击之，”沛公乃引兵击秦军，大破之。逐北至蓝田，再战，秦兵竟败。遂至咸阳，秦王子婴降沛公。】本来这个守关的将领已经被资源砸晕，被收买了，但是，张良依旧用权谋，直接斩尽杀绝。

    总之，没有资源不行，只有资源也不行，需要通过权谋手段加持把资源最大化、均衡化、高效化。如果学了权谋被人打得满地找牙，这不是权谋的问题，是学艺不精！


    # 领导的超常规热情，下属该怎么办？


    【困惑】老师好，请问在单位，如果一把手领导对我不错，直接要求我去做些事情，并没有通知中间的分管领导，请问我是否要答应他？另外本人也遇到比较纠结的问题，比如说一把手要让我去开会，但是很显然，我的级别达不到会议的要求人员层级，在这种情况下，我是否应该去开会？会上应该进行一系列的表态？不表态吧，其他参会人员会有意见，表态了吧好像级别又不够。另外回头我是和分管领导汇报，还是和一把手的领导汇报呢？我知道越级肯定是不太好，但是我不能抹一把手的面子，但是我也要考虑回头这一把手领导万一拍拍屁股走了，那我和分管领导关系那就闹僵了。请指点，我应该怎么操作？谢谢。


    【解析】乍一看，这是个最常见的“一仆二主”的职场案例，求助者不知道在自己顶头上司和一把手之间该听谁的。这个一仆二主，一把手越级指挥之后，作为下属，其实通用做法是，立即接受一把手的决策安排，然后立即向顶头上司请示执行方案，但是这个案例有特殊性，那就是不仅仅是越级指挥的问题，还参与本不该参与的会议，这个问题就很复杂了。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 1、越级参加会议


    一把手安排下属参与本不该自身级别的会议，先不说一把手是不是违背组织规定，我们作为下属，必须第一时间接受命令，去参会，组织内，下级接受上级的任务安排，这是天则。但是如果没有特殊交代，或者会上明确指明要你表态，则不必表态。不表态，别人不会有什么意见，本来就是列席的，没资格表态，如果领导当场询问，这属于临时性授权，这时可以说出自己内心的想法。如果，自作主张的表态，恰恰让人反感，别人内心会说“你是啥人，轮得到你？”


    # 2、领导意图分析


    领导让下级越级参加会议，这是好还是坏呢，不一定，但是有 一点是可以肯定的，那就是求助者的顶头上司是不被一把手所信任的。一把手，对于这个不信任的中层，故意越级指挥，不让参会，用来架空下属这个顶头上司，让求助者和顶头上司形成制衡或者是斗争，以达到离间下属内部队伍的目的。领导要么把这个求助者当枪使，用他让其顶头上司不舒服；要么是真的觉得这个求助者能力和才华都很给力，准备先吹风，让大家都确认这是心腹，随后提拔；要么两种心思兼有之。


    # 3、该如何去应对


    面对领导不特定的心思，我们该如何做呢，求助者的心理是，哪天不知道一把手就走了，自己和顶头上司闹僵了不好做人。职场很多时候并没有两全其美的事情，老好人是没有前途的，这时候只能“两权相害，取其轻。”一个未来可能有麻烦，一个是当下立即就会有麻烦。说不定，现在紧跟一把手，还有可能得到提拔，或是升迁。如果一把手没有栽培的意思，把你当枪使用，你不做，也不可能得到顶头上司的重用，还不如做出选择，说不定和一把手的关系弄假成真呢？


    其实，问题没有那么复杂，关键就是我们从小被教育不得罪人，想做个都不得罪的老好人。其实职场很多时候，无法暖昧，不能过多的考虑别人的利益，因为利益就这么多，你不得罪这个，就会得罪那个，永远不可能平'
  merge: -1
  img_proc: true
- pgno: 65
  md: '衡。只能把自己利益最大化放在第一位，跟着谁对自己最有利，如何做能够让自己更有机会，更有前途，就跟着谁。不过大多数时候，谁都不想得罪，恰恰得罪了所有的人，让自己两面不讨好，最后混的一塌糊涂。


    # 副职的三大作用——权谋家都是这么玩副职的！


    【困惑】老师，我负责某驻外工作，我那有一个副职岗位，原本是用来激励属下的，我也推荐了属下，因为这边的vi工作实在离不开这位属下，但决定权在领导，领导准备提拔一个与我们有矛盾的人到岗位上，而且那个人不过来，就是占掉这个位置。有没有什么好办法让领导改变决定？


    【解析】可以说，你的这个领导权谋手腕很高，知道原理之后，就知道，没办法破解了。


    1、副职的三大用作


    一个权谋高手能够把这个副职用到极致，因为他知道充分发挥这个副职的作用。权谋家一般有三种玩法：首先，就是副职的激励作用，悬空这个副职，让下属都看到希望，能够调动所有下属的积极性，这可以说是最大的利益诱饵。其次，副职的制衡作用，利用一个和正职不和有矛盾的人，这样领导才不会被架空，下级才不会铁板一块。最后就是副职的枷锁作用，能让领导进退自如。


    2、领导的背后意图


    什么是枷锁作用？为什么，那个有矛盾的人不过来，却占用了这个位置？核心的意思就是，好比是套在正职头上的紧箍咒。如果正职听话做的好，那么这个有矛盾的人永远也不会过来，让正职自由的发挥，不受限制。但是如果正职不听话，或者是受到猜忌，那么这个有矛盾的副职立即就会走马上任，用来削减正职的权力。所以，这个副职遥领这个职位，可以说是领导的权谋妙笔所在。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 3、如何去适应局面


    驻外的实际工作中，离不开一个有能力的下属，而且也有正职推荐了。但是领导为什么不批准呢，因为是驻外工作，如果批准了你的推荐，很明显，这是正职的缨系，这个副职上位之后，只是能够发挥工作作用，但是对上级领导而言，其实是失去了权力的控制。如何应对这个局面呢，其实本质还是，这个正职并没有得到上级领导的充分信任，一切都在观察中。写到这里，其实答案就出来了。如何应对这个局面呢？那就是你先忘记这个副职的问题，充分赢得上级领导的信任和授权，这样领导才会放弃利用悬空副职掺沙子的准备，才会换掉遥领职位的副职。所以说，做好自己的信任工作才是根本，至于那个能干的下属，我们已经做了推荐，这就够了，反正决策权不在我们的手里，让他知道你已经尽力了，就够了。


    # 关于工作的真相——不断的提升自己的身价！


    【困惑】老师“员工角度是，你给我多少钱，我干多少活，而老板的角度是，你干多少活，我给你多少钱。”这样的话对吗？


    【解析】持有这个观点的双方，都陷于了二元对立的状态，其实，真正的职场高手是分工作情况处理的。


    能够让自身增值的工作，要抢着干，不管给多少钱，因为没有人能够在一个单位工作一辈子，所谓的工资都是一时的，而自己的身价是永恒的，不断地提升自己的身价，之后走到哪里，任何单位，人家看重的是你的身价，不是你曾经拿了多少钱。


    而那些以牺牲自己的身体健康，或是无价值的重复性劳动，尽可能的远离，如果不能远离，也要想办法减少，不管你给多少钱，没人给你保证一辈子，给到了中年之后，忽然间单位倒闭，或是下岗分流，不得不再次找工作，你会做什么？比如前一段那个新闻，一个公路收费员，除了收费，一无所'
  merge: -1
  img_proc: true
- pgno: 67
  md: '长，忽然间下岗了，三十多岁，人生陷入了绝望。哭诉着让政府给保障，这事怨了别人？你早干啥了？


    关于工作，业务上的工作，分有价值和无价值。权力服务的工作，有维护性工作和背锅性工作。有价值，维护性的事情要主动做，多做，但是对于那些无价值的，背锅性质的，尽可能的避免做。所以说，不能分清楚具体情况的，就盲目的给多少钱干多少事，未免太过于片面和狭隘。


    其实工作的真相，不仅仅是干活拿工资这么简单，他本身承载了五大方面的东西，提升自身价值，攫取有利资源，学习管理教训，发现行业机会，构建人脉关系。只有从这些方面不断的关注，才能不断的走向突破。为了工资而工作，不是为了提升自己价值为中心而工作的人，这辈子是没有身价的。


    # 如何面对公司的“皇亲国戚”？


    【困惑】老师，我一直在外企工作，现在在一家民营企业做人力资源，我一直认为公司，既然有规定就一定按照规定来，对于那些嚣张的，无所事事的“关系户”考核时，都认定为不合格，没想到，却被上司批评，我很委屈，按规定办事有什么错？现在这些有背景的员工处处为难我，我该怎么办？


    【解析】任何组织的企业都无法避免组织力的裙带关系，这些皇亲国戚，一定程度上能够对老板的决策产生影响，你要记住，你是来协助领导工作的，而不是给他找麻烦的。你全部考核不合格，他们会直接找老板对话，这其实，无形中给老板带来很多的压力。很多人做不到对这些人巴结，套近乎，但是和这些组织内的关系户交往，一定要记住这三大基本原则：


    +   1、不情感排斥'
  merge: -1
  img_proc: true
- pgno: 68
  md: '这些关系户，都不是靠真本事进来的，而是老板亲戚，经理朋友等各种关系进来的，而且在组织里很是嚣张，对各种制度也不遵守，所以很多人都从内心里厌恶和反感这种人。而这种情绪的排斥，就很容易外在表现出来，比如言语上的嘲讽和刺激。要记住，越是这样没本事的人，内心就是敏感，你内心厌恶他们，他们就会利用关系这个渠道，说你的坏话，这对未来的职场会形成极大的阻力。不管内心你是什么状态，你都无法改变社会的现实，要隐藏自己的内心，不情感排斥，才能减轻阻力。


    # 2、不利益冲突


    职场就是个利益交换的地方，利益的稀缺性，也就导致了冲突性，题主就是内心的厌恶，从而利用手里的考核权力对这些皇亲国戚进行了打击，这一下子就产生了极大的冲突。而作为一个刚来三个月的员工，无疑是蚂蚁撼大树，你没有老板的支持，没有不可或缺的能力，没有背后的势力帮助，你有什么能力挑战关系阶层？仅凭对规定的遵守？冲突解决靠的是实力而不是规定，切记自不量力。千万不要和这些人冲突，尤其是正面冲突，更不能整体冲突，因为这些“规定”不会主动站出来帮你。


    # 3、不过密交往


    有些人又走向了另外一个极端，就是不排斥反而和这些人交往过密，自觉不自觉的就会染上和这些关系户一样的恶习，不提升工作能力，不遵守组织规定，看不起其他员工，这是个很错误的心思，因为领导内心里其实并不认可关系户的行为，只是碍于情面，不能处罚，但是，你不是关系户，而这样做，领导就会把怨气撒到你身上，拿来杀鸡做猴。人家有背景的依然好好的，而你却要走人。可能你内心会很不满，为什么不处理他们而处理我？凭什么，就凭你没关系，怎么了，有错吗？


    所以，我们在职场，一定适应这样的环境，因为你走到哪里，都无力改变无能关系户的嚣张，你自己开公司，也不可能废黜这个现象，人都有抹不开的人情关系。所以，要坚守上述的原则，这样就能够在职场混的开，记住，没关系的人就要靠本事，有关系的，不靠本事，这个无可厚非。'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 企业中层的三大权谋标准姿势！


    【困惑】老师，企业中层领导半数以上都是阿谀奉承，并且嫉贤妒能，还喜欢打小报告，我该怎么办？


    【解析】这个问题很经典，解决不了价值观，就解决不了你的根本问题。因为视角不同看到的东西就不一样，羊的眼里都是草料，而狼的眼里都是猎物。在基层眼里一大堆的令人不耻的行为其实都是作为中层的标准姿势：


    # 1、阿谀奉承


    作为中层必须阿谀奉承，这是最为基本的价值观。中层的权力缘何而来？来自于上层的授权，而上层会选择谁授权？给那些整天跟自己拍桌子，唱反调的？还是那些顺从听话的？这个不言自明，除了那些有受虐狂且不想搞好组织的，都会选择那些阿谀奉承的中层。通过自己的努力好不容易爬上高层，为的就是自己在组织中所能享受到的优越感。


    # 2、嫉贤妒能


    嫉贤妒能，作为中层，不敢说百分百，因为毕竟有白痴，现实中百分之九十九的都会这样做。因为中层的位置就那么多，你贤能，还不嫉妒你，这不等于给自己制造掘墓人？任何人也不会给自己培养竞争对手。作为中层也是打工的，把你扶植起来，让中层领导被挤下去回家？


    # 3、打小报告


