- pgno: 201
  md: '凭实力、凭关系、凭能力，你都不行，所以，我们必须一开始就把问题解决在萌芽状态下，精通领导心思，不做违背权力规律的事情，提升自己的能力和价值，让自己在职场拥有更多的话语权，收敛自己的情绪，减少冲动，避免矛盾激化。当然说这些，对你来说可能很烦躁，我都这个局面了，你就和我谈谈如何挽回的事情吧，接下来夹着尾巴做人吧，不行换个部门，或是换个工作，重新开始，远比纠正当下的错误方便的多。其实啊，如果不加强我说得这三点，换个泳池你还是不会游泳的。最后了，还是想给你说个策略的，毕竟残局有残局的玩法，下下策也是计策。既然撕破脸了，就公开化矛盾，公开化矛盾，上司就无法通过阴暗的手段来对付你。进谗陷害，挑拨离间，大家也都不信他了。而你这个时候，就要严格要求自己，绝对不能再犯错误，被人抓住把柄，那就万劫不复了，让他暗地里没办法，明着里没方法。这样自己暗中不断的搜集上司的错误，不断的整理他的黑材料，没有谁屁股干净，先不败而后求胜，自己不出错，死死的盯着他，总是有机会的。你好好想想！


    # 刚刚大学毕业，遇见困难，别急于跳槽，先干上三年！


    【困惑】老师，我毕业几个月了，几个工作都不满意，不是工资低，就是老板不好，再有就是同事坏人多，对我的困难一点忙都不帮，我又辞职了。马上就快春节了，不想回家，感觉很迷茫，能给我指点下未来吗？


    【解析】你的迷茫很带有普遍性，你还没有从一个学生到一个职场人的转变。因为职场没有人是以自我为中心，让周围的人和环境来适应自己的。要学会，让自己为了钱，为了事业，不断的调整自身来适应社会。我建议你无论如何，找个工作，老老实实做上三年，原因有三点：


    首先，不明白位置。


    刚刚大学毕业，不能够客观的认识自己在社会上的位置，不明白自己的身'
  merge: -1
  img_proc: true
- pgno: 202
  md: '份。看不起任何人，认为自己有无限可能，怎么 3 年后也会身价百万，有车有房，而实际上三个月，打回原形。你认为自己能够赚到钱，其实知识、学历在职场并不是最重要的，最重要的是关系和资源。很多人自己在职场怀才不遇，不被重视，核心的就是没有客观认知自己：你不值钱，所以你没钱。

    其次，不明白技术。

    大学学的东西，都不具备技术细节，很多大学生眼高手低，自认为自己的知识储备很够，能胜任工作，其实每个项目全盘操作起来都很复杂，都有不传之秘。不能够踏踏实实的跟完一个项目，熟悉流程，不能够在工作中遇见过各种情况，并具备处理经验，就不可能经验丰富，游刃有余。不断的在底层岗位跳来跳去，浅尝辄止，就没有机会在未来，转化阶层，担任领导，赚到大钱。

    最后，不明白人心。

    有人的地方就有江湖，不同背景、不同素质、不同性别、不同性格、不同的利益的人，在一起工作，又不是来交朋友，又不能不合作，怎么可能会没有矛盾？一个不善于交往，不善于为了自己目标去团结各类人，逃避是解决不了问题的，因为哪里都一样。一个地方待上几年，就会强迫自己适应人际关系，强迫自己调整自己去想办法，避免通过跳槽来解决人际矛盾，强迫自己人际成熟。

    所以，我建议你，先找一个地方磨练技术，权当带薪上学，把组织里的技术细节、通盘操作、运营策略、营销手段、管理技巧，花个三年都学会了，如果待遇和位置都没有变化的话，就跳槽换个工作。记住跳槽是为了提升自己的价值认可，而不是逃避矛盾。整天自以为是，动不动跳槽的人，三年之后，还是无法独立担当项目，这样的人，怎么可能会有前途呢。'
