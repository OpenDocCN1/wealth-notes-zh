- pgno: 86
  md: '# 为什么你越是优秀，越是不被领导待见？


    【困惑】被领导嫌弃聪明，嫌弃认识领导多怎么办？领导非常敏感，怎么破？


    【解析】很多人自以为自己聪明，能干，恰恰在职场混的不如意，然后就认为领导嫉贤妒能，自己怀才不遇，其实这都是小聪明，因为权谋界有个基本原理：但凡不被驾驭的能人都是威胁！


    1、为什么会被嫌弃聪明？


    没有领导不喜欢有能力的下属，做领导最大的责任就是让下属干活，但是为什么很多人表现出能力之后，往往遭受领导的打击呢？原因就是，没有取得领导的信任和授权，自己盲目的表现自己。一个不在领导控制范围之内的优秀人才，自然就是最大的威胁，对于威胁岂能不打击？


    2、认识领导多为何也错？


    很多人认为自己多交朋友，擅长社交是个优秀的品质，其实职场恰恰是大忌。尤其是和很多领导认识，非但不能在关键时候得到帮助，恰恰会被领导认为，这是个有野心的人。一个有野心的人，自然会被自己的顶头上司讨厌，尽管可能没有野心，也不能排除打小报告的嫌疑。


    3、破解之道究竟是什么？


    作为下属，必须首先获取领导信任和授权，在领导的完全掌控之下的优秀，才是被认可的能力。这就需要我们早请示、晚汇报，让领导知道所有运作执行的细节。这样的能力，才能被放心，才华才能被认可。职场社交，最好的办法就是正常的工作交往，任何私下的联络，就会被无限猜忌。


    很多人会问，老师，这个和你之前说的不一样啊，不是让我们不断的提升个人能力，和不断的寻找背景靠山吗。不表现自己能力，和不交往领导怎么办？这其实是两个问题，干嘛，做事非得大张旗鼓，众人皆知？做事时，'
  merge: -1
  img_proc: true
- pgno: 87
  md: '偷偷的搞破坏，等都做不成，自己可以“试着”力挽狂澜，救大家于水火，功大莫过于救主。社交时，秘密的单线交往，越是隐蔽越好，尽可能的在职场之外，而不是在职场之内搞的沸沸扬扬。搞权谋既要明白自己的阻力在哪，又要找到破解之道，所以别再盲目的表现聪明了。


    # 不会应酬，不会交朋友，不会聊天怎么办？


    【困惑】老师，我不会应酬，不会交朋友，不会聊天，怎么入手解决？【解析】不少朋友都有社交上的困惑，总是羡慕别人能够呼朋唤友，口吐莲花，成为人群的焦点，其实，这都是表象，真正的高人大多深居简出，每次社交都极具目的性。如果自己有价值，那么自然会成为别人追逐的对象。试想一下，鼎盛时期的马云如果出席一个场合，他需要主动找话题缓解尴尬吗，需要主动去找人交朋友吗？恐怕，他坐在那里，一大群人围着献媚，核心原因就是价值。越是有资源的人，越是有价值。权谋网说过“整合外部的资源才是这个世界的游戏规则。”
    不同的人对这样的游戏规则，有不同的认识、不同的态度和不同的利用水平，而这一切决定未来你所能达到的高度。所以所有的社交问题都是表象，技巧是解决不了根本性问题的，这需要从价值资源入手，才能真正的成为社交高手。


    1、提升自己的社交价值


    有三大类型社交价值：权贵型、专业型和潜力型。我们为了成为别人的人脉，就必须打造自己的专业形象。所以社交的基础起步，就是我们必须给别人带来价值，成为他们生活中的顾问，比如医生、律师、理财师、房地产咨询、人生规划、情感心理等。每个人的朋友圈，都希望有这样的朋友，能够随时找到，解决自己的困惑。如果你现在不是专业人事，那就表现出自己成为专业人士的潜力，行走在这样的专业路上。


    2、找到要交换资源的人'
