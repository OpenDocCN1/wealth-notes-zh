  md: '# 我们能不能靠阳谋取胜？


    【困惑】每看你一篇新文章都令我眼前一亮，虽然最近送礼物哄女友花了不少钱，又刚被抄牌，还是马上入手一本《权谋通览》，想问，在这个基本无私隐，这么透明的社会，仅靠权谋就能获胜了吗？如果被对手知道心里的想法，怎么办？我们怎样可以做到像太祖一样阳谋取胜？


    【解析】首先感谢，你在经济困难的状态下购买我写的《权谋通览》，这本书会物超所值的。对于你的问题，极具代表性，公开写文章回复，希望对大家都有帮助：


    +   1、 在这个基本无私隐，这么透明的社会，仅靠权谋就能获胜了吗？


    任何的成功都是条件适合、内部努力、外部支持的结果，没有人是以单一因素获胜的。如果有，不是傻子，就是骗子。就好比打仗，仅仅依靠纯熟的兵法，是赢不了战争的，还需要各种资源的支持，甚至天气都是重要元素，比如唐朝包括郭子仪，李光弼在内的，九大节度使，围攻邠城的安庆绪，和过来救援的史思明的部队交战，本来胜利在握，但是忽然间飞沙走石的暴风，让九大军区司令的队伍立即溃散逃亡，失败而归，史思明取得全面的胜利。成功需要很多因素，但是失败的话，一个因素就够了。


    +   2、 如果被对手知道心里的想法，怎么办？


    纵横术名著《鬼谷子》早就告诫我们“圣人之道阴！”因此，所有政治家都有一个共同的特点就是“有城府”，意思就是让别人无法窥视到内心。如何不让别人窥视到内心的想法，不仅仅采用韬晦之计，隐藏自己，还需要疑兵之计，让对手理解混乱。《孙子兵法》诡道就是经典的隐藏术：“能而示之不能，用而示之不用，近而示之远，远而示之近。”但是如果让对方知道了内心的想法，如果你势力弱小，直接就会遭到打击，然而如果你实力过强，知道了内心又如何，我就想欺负你。'
