- pgno: 334
  md: '# 权谋中的强者思维是指什么？


    【困惑】老大，权谋中的强者思维具体是指什么？


    【解析】权谋的学习和其他的知识学习，完全不一样，其他的学习是个记忆知识、熟练技能的体系，而权谋的学习是个思维训练、价值观重塑的体系。这个不是看多少文章，或是读多少书的问题，而是要重塑整个思考逻辑，调整三观的问题。有句诗词最能体现这个观点“坑灰未冷山东乱，刘项原来不读书。”秦始皇焚书坑儒想阻止强者，但是他不清楚，刘邦项羽原来是不读书的。其实这就揭示了，强者思维和读书无关，是他们从小被训练的结果，强者思维具体指什么？


    # 1、权力思维


    90%的人从来不曾拥有过权力，就好比没吃过苹果，即使见过再多，也不会知道什么味道，一切都只能凭借想象，而很大层面都是错的。即使很多人有幸成为家长，拥有管理老婆孩子的权力，最终也是搞的一塌糊涂，一地鸡毛。如何谋取权力，如何集中权力，如何行使权力，如何巩固权力，没有经过训练，就会一头雾水，即使偶尔的机会成为领导，也会最终在管理上焦头烂额，行为上捉襟见肘。


    # 2、上层思维


    社会自从走进了阶级社会一来，就一直分为统治者和被统治者，管理者与被管理者，上层和下层。所谓的上层思维，就是居高临下，所形成的整体思维，长远思维，深度思维。因为上层拥有更多资源智慧和人脉，能够整体多维度的思考问题。而底层从未看到过全局，无法完成自我定位，没有资源支撑到长远，接触的智慧信息缺乏，不能够思考的更深。底层的短视行为，浅薄行为，单一行为，会步步的做错。


    # 3、掠夺思维'
  merge: -1
  img_proc: true
- pgno: 335
  md: '所谓的掠夺思维就是站在食物链的最顶端，不从事生产，只从事再分配。通过合法的、非法的、光明的、阴暗的、和平的、残忍的等各种手段，把别人生产出来的物质产品拿来分配。从小就会被训练成温顺的性格，凡事都想自己动手，不需要别人帮助，自己努力生产，拿别人的内心都不踏实，因为奉献不争已经融入骨髓。极端点，饥荒了，努力积攒粮食的和努力磨刀的，哪个能度过难关？


    权力思维，上层思维，掠夺思维，这些东西，可以说作为从小底层弱者没管理过任何事情的人，想转变自己的阶层，想过上好的生活，想认清楚这个世界的逻辑，只是通过读书，而不是通过训练，直接灌输进去真相，这怎么可能？所以权谋的学习，必须通过熏陶，通过训练，才能完成底层逻辑的架构。这个就是我们权谋培训班的价值所在，有了这个看书才能知道背后的逻辑。


    # 底层人的最致命的三大漏洞，人生命运被锁死！


    【困惑】老师，买了咱们的权谋书，为什么你说村里地主的后代更容易崛起？据我观察，很多人都是从农村出来，大学毕业都一个起跑线，的确后来差别那么大？究竟差在哪里？能解惑吗？


    【解析】其实这是个经典的问题，今天咱不说权谋价值观，这个底层逻辑的问题，直接说表现出来的行为，其实普通人最致命的三大漏洞让他牢牢锁死在低层！


    +   1、没有成功经验指导


    底层之所以是底层，主要原因是在整个人生的过程中一定是做错了很多事情，脑子里所积累的多大是错误的思维观念，以及不正确的经验。所以，在崛起的过程中，父辈无法提供关键有效的指导，自身又因为年轻，没有阅历，身边环境又没有贵人高人出现，自然就会凭借着错误的观念，或是'
  merge: -1
  img_proc: true
- pgno: 336
  md: '想当然的选择，从而自己去探索方向，自然会不断的犯错误，而这些错误，人生的坑，有时候一个就爬不出来了。即使爬出来也会被扒层皮，没有正确的指导，单凭自己去拼，成本会无限的大。


    # 2、没有正确资源积累


    父辈在人生道路上缺乏正确的经验，自身无法有资源积累，一穷二白的现状传给自己的孩子，让他自己奋斗，很多人说，父辈能把我们养大，就已经让他们筋疲力尽，我们应该感恩而不是埋怨。道理是这样，背后其实是资源的一次次清零。因为没有在一个领域积累，就无法在一个行业赚到钱，进而到处跳槽，都处于底层，因为底层的工作对体力脑力消耗大，身体不健康，晚年都会生大病花钱，又因为欲望和收入不对等，很快陷入债务泥潭，没有资源的积累，自然没有任何的投资能力，代代循环。


    # 3、不懂处理人际关系


    越是穷人，越是喜欢单打独斗，人际交往关系能力缺乏，不善言辞。这个主要是三个原因，一来是长时间在低层，每天面对的都是对物的研究，或是体力劳动，对人无法交往，没有经验。二是，两千年来小农意识，自给自足，不善于和外人交换资源，交换利益，没有意识去和人交往。第三，因为不懂，因为没意识，自然人际关系比较差，进而加剧了人际关系的恐惧，和厌恶，自己处处碰壁之后，逐步的佛系起来，逃避起来，不能有效的反思。没有人际关系，就无法盘活信息和资源。


    尽管人际关系写在最后，其实这个最重要，因为一个人能不能成大事，主要就是人际关系的经验，这样就能得到贵人的支持，朋友的信息，自身奋斗就可以减轻很多阻力。举个最简单的例子，人缘好，自然能够得到朋友的帮助，比如借钱，能够高杠杆的发展自己的事业，有朋友提供相应的建议，这样就能够不断的减少经验试错的过程，进而积累起相应的资源，自己就能够越来越强大，进而改变阶层。所以，正确的人生经验，不断的资源积累，人际关系的纯熟，就是崛起的关键因素，而这三点又恰恰是底层被锁死三大致命漏洞，大家去观察下成功者失败者，其实都是如此。'
