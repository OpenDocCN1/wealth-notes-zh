  md: '# 1、这种状况，有没有改变的可能性？


    天下乌鸦一般黑，这种现象，尤其是中小型公司，非常的普遍。不要被自己所看到的什么媒体宣传的公司所迷惑，什么谷歌的随意上下班，可以和领导争执啊：什么华为，干好自己工作，就有很高的年薪啊；什么阿里巴巴，都用江湖名号称兄道弟啊；其实啊，你如果没有去美国的能力，没有去大公司的学历，就一个普通人，就别做梦了，“生来就是为了改变世界”，喊这个口号的除了乔布斯，你没资格。你就是普通人，就要知道自己能选的就是这样的普通公司，就要适应普通公司的各种毛病和规则。


    # 2、如果不能改变，有没有适应可能？


    你的起点不高，没有足够和公司谈判的能力，自身能力资源有限的情况下，到哪里，都不会有人真正的看得起，别太把自己当回事，真有本事拿个诺贝尔奖，那才叫有能力，全球的学术机构，都会惯着你的臭脾气。很遗憾的是，你需要这份工作，你这样的人，人力市场上大把都是。公司随时都能够找到和你一样的人。所以，当你无法让别人适应你的时候，你只能适应别人。而且，这些东西并不是你想象的那么不堪，这就是一套社会的游戏规则，想在社会混的好，就得参与到这个游戏中来。


