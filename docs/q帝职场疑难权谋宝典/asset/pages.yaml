- pgno: 341
  md: '# 成功的人，并非都有成功的经验给下一代！


    【困惑】老师你常说，家学传承，为什么还有富不过三代，君子之泽五世而斩？


    【解析】这个问题看似矛盾对立，其实是不了解这背后的规律，因为这背后有三大问题：


    +   1、成功不仅是经验


    一个人成功有时代的原因，有运气的原因，还有自身经验的原因。这个就需要我们通过大量的实践、阅读、反思、提炼出真正有效的经验。但是因为很多人的偶然的因素占多数，无法准确认知自己的成功所在，所以，也就不存在正确经验传承的问题。举个简单的例子，电梯里几个人，一个做俯卧升，一个跑着步，一个站着不动，都上了顶层，但是每个人反思却不一样，其实最本质的就是上了电梯。比如格力铁娘子，真正牛的不是什么核心科技，营销技术，而是房地产大发展带来的机遇。如果不能剔除运气和时代的原因，而提炼有效的经验，就无法做到传承。风口上飞起的猪，风过了，也就该掉下来了。


    +   2、衰败的原因很多


    另外一个家族的失败的原因也有很多，比如天灾人祸，几十年的积累，可能一次大火或是大病可能就结束了，后代需要很多年才能再爬起来。比如斗争失败，小的成功积累就行了，但是做大了，仅凭积累就不够了，这就需要应对周围的竞争，或是外部的高人猎杀，稍有错误，或是信息不足，可能就是一着不慎，满盘皆输。在比如人丁不旺，不注重子女的生养，偌大的家业没有继承人，或是继承人和自己没有血缘关系，也就逐步的消失。还有积累的经验没有更新，坐吃老本。比如当年考科举的本事，后来科举'
  merge: -1
  img_proc: true
- pgno: 342
  md: '取消了，就必须及时更换新的方向。最后就是后代的放纵和叛逆，不重视上一代的经验和智慧。


    # 3、教育训练本身难


    能够提炼出真正TAG有价值的经验，准确的总结出失败的教训，这只是家族智慧的第一步，然后就是教育的训练，因为教育本身是个大学问，不是你会，你就能教会别人；不是你成功，你就有能力带领别人成功。每个人的个性、起点、眼界都不一样，这就不能一概而论的教育，需要针对性的训练，才能把自己的经验，有效的传递给下一代。必须知道经验的根基，知道未来的方向，知道问题的核心点。我们都熟悉的红楼梦，贾家的始祖是军功起家的，但是却要求贾宝玉考功名，就是没有有效的传递经验，而考功名，也没有请名师，而是自己家的贾代儒来教学，他自己都没有中举，怎么去教别人？贾家能不败？经过上述的分析，题主这个困惑其实就很清楚了，不能笼统的认为，有那么多的家族兴衰，有时代的变迁，经验积累没有任何意义，其实这就是没有有效的寻找到成功的底层代码，只有寻找到真正的底层代码，并加以训练，这才是有教案承。而有效的成功的底层代码，其实就是如何处在食物链顶端的智慧，包括如何爬到食物链的顶端，如何维护自己的位置，如何轻松的吃到肉，这些才是真正的智慧。把这些智慧做好对下一点的训练，大概率的才能保证传承。作为古代的最牛逼的皇帝康熙也是多生几个孩子优中选优。因此知道上述的三大方面，也就明白了，君子之泽五世而斩的内涵！'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 权谋初学者长犯的三大错误，和围棋一模一样的


    【困惑】老大，古代谋士都喜欢下围棋，这背后有什么相同之处吗？


    【解析】巧了，今天看到武宫正树九段写的书，关于围棋初学者长犯的三大错误，看完颇有感触，和权谋一模一样，现在对比解析：


    # 1、子的方向凌乱


    很多人没有学过权谋，就会对人生想当然，觉得有无限的可能，其实在现有的条件和阶段以及资源的情况下，可选择的路径非常小。但是有些人却不以为然，盲目行动，到了三十多岁还没有找到自己一生要奋斗的方向。一个人尽可能早的找到自己这辈子要努力的方向，就可以做出高积累，否则，就
    celebrated 一事无成。前几天有朋友咨询我，他的朋友 50 多岁了，向他借钱开拓新项目，我说，你不用借钱给他了，50 多岁了，没有方向，还在开新项目，还借钱，不管什么理由，成功的可能性都不大。没几个成为齐白石或是肯德基老大爷，权谋家做大概率的事情，那就是越早找到自己努力的方向越好。


    # 2、拘泥于局部


    武宫正树对这个写了三点，“只顾进攻，忘记全局”“过分靠近坚实的子是贪婪的下法”“拘泥于局部，妒人成空”这个在权谋上体现的其实更加明显，首先是，我们不能单一维度的思考问题，而是要考虑到方方面面，协调多种条件
    的才是高手，底层恰恰非黑即白，非此即彼，思维单一。其次，在别人的优势领域自己就不用冒险了，避实击虚才是正途，别幻想着，非要硬碰硬才是水平，本质这是傻。最后就是，不能见不得别人的好，而是把精力放在自己身上，不断的提升自己，不断的寻求自己的主动权，如果把精力都用在别人身上，就会随波追流，我们就很难把握自己的人生主线。'
  merge: -1
  img_proc: true
- pgno: 344
  md: '# 3、对定式不求甚解


    人生各种事情都是有套路的，普通人是没有套路，而初学者是拘泥于套路。没有套路就会各种盲动，通过自己的资源试错，成本巨大。如果拘泥于套路，就会不顾及客观情况，呆板的套用公式，进而形成刻舟求剑。我们真正的权谋高手，其实不仅看套路的表面，还要深入到套路的外部环境，所在阶段，动用资源，对手情况，综合的研判。所以，如果不了解这些就盲目的套用公式，就会出现，有时好用，有时不好用的情况，有时灵有时不灵的结果。我们研究权谋，必须深刻的了解套路背后的原理，以及其背后运作的机制。只有这样，才能发挥出最大的效果，避免走错路，走弯路。我们通过上述的分析，必须吸取教训，要尽可能早的找到自己奋斗的方向，做出正向积累，然后一定不能只局限于局部，而放弃全局。有个案例：一个女子曾经问男朋友如何一块钱让两个人坐公交车，这男子求助我，我说还是思考如何不坐公交车，而不是把自己的精力放在一块钱怎么让两个人坐公交车上，我们的智慧是用来干大事的，要学会升维解决问题。最后就是了解权谋背后的原理，而不是盲目的外在模仿，其实这背后一切都是人性，懂得人性的根本，就懂得权谋。


    # 在职场斗争是常态，凡是逃避的都是底层人！


    【困惑】接触咱们的 “权谋智慧” 公众号有一段时间了，也看了您写的几本书，大多数讲权力心思和内部斗争的，不明白为什么人与人之间就不能和平相处呢？

    【解析】我们强调 “技术立身，权谋发展”，但是技术的重要性，从小就被家长学校灌输；也不是权谋研究范围，所以就不再赘述，因此导致你认为我们不在乎这个，这是一种误解。职场的核心关系就是权力关系，这个'
  merge: -1
  img_proc: true
- pgno: 345
  md: '必然是重大的研究部分，不过今天我们重点说说，为什么要大量的讲内部斗争，因为这也是职场的重大主题，主要原因是：


    # 1、利益越大，竞争越激烈


    任何组织的资源都是有限的，而且越往上走，越是僧多粥少。有多大的利益，就有多大的黑幕。位置只有一个，自己不斗争，去排除掉竞争对手，争取领导信任，就单单坐着等，天上掉馅饼的概率有多大呢？如果没有任何的努力，位置就到手了，只能说明这是个排雷的工作，吃到嘴里，胃也很难消化的了。而那些认为可以和平相处的，都是没有利益冲突，无稀缺资源的。底层普工，的确没斗争的必要。


    # 2、矛盾重重，和谐非常态


    任何人之间，外形都差不太多，但是身份、背景、能力、经历、相貌都不相同，和谐共处基本上可能性不大。你优秀，别人嫉妒你；你普通，大家看不起你。这除了人性，主要还有三大权谋原因：首先是政治权力问题，每个人都要有自己的派系和山头，没有私人矛盾，也必然斗争。其次是能力水平问题，你技不如人，又想进步，不玩手段？最后是，思想价值观问题，认知分歧，看法自然不能一致。


    # 3、权力稳定，必鼓励内斗


    权力为了自己的稳定，也必然鼓励下属的内斗，因为这些下面的人，如果不互相斗争，而是团结和谐起来，就必然和领导斗争，因为上下级的矛盾是天然的，下属越是联合，领导的权力越是不稳定，所以，任何稍微懂得权谋的领导都必然挑动下属之间的矛盾。所以很多时候，你越是想和别人联合，人家越是认为你有目的，在领导眼里越是犯忌的结党行为，因此，斗或是不斗，都不由得你去做出选择。


    经过上述的分析，我们能看到，因为谋取更高更多利益的问题，因为属性的天然矛盾问题，因为职场的权力结构需求的问题，都必然有各种剧烈复杂的矛盾，而且是不可以调和的矛盾，所以斗争是一种常态，如果无视斗争，或是不善于斗争，或是不想斗争，都是错误的，最终都会受到现实的'
  merge: -1
  img_proc: true
- pgno: 346
  md: '教训，树欲静而风不止，很多时候就是如此，人在江湖身不由己，既然无法逃避，为什么不积极学习斗争呢？


    # 成为领导心腹之前，要通过三大测试！


    【困惑】老大，自己刚创业做老板，手下有几个小伙子还不错，但是总觉得知人知面不知心，怕真的当成心腹，成了心腹之患，该如何培养心腹呢？


    【解析】心腹不是培养出来的，是筛选出来的。一旦你去培养的话，告知标准，就很难得到真实的情况了，所以，必须暗中筛选，通过筛选心腹就是三大套路！


    # 1、忠诚测试


    忠诚测试的核心意义，就是没有自己的是非对错观，是以领导的利益、立场、是非为自己的拥护方向的。新三国里曹植评价曹操的贴身侍卫许褚时，说了这样一句话，核心的揭示了忠诚的具体表现：父亲（曹操）让许褚杀他自己的父母，都不会手软。现实中，我们做领导的，让手下喝一杯酒，他都以各种理由推脱的人，不难判断在出现和领导利益不一致时候，他们必然选择自己利益，那就是背叛。这样的
    人，骨子里只有自己的利益，自己的是非，所以也就不难理解，他们通不过立场测试。


    # 2、透明测试


    无论做的对错，但是不能隐瞒，一旦隐瞒，你就让领导无法信任，因为不知道你还有多少事情隐瞒着，既然处处对领导设防，那就是不能重用。 晓清首富胡雪岩做跑腿伙计，打扫卫生时，发现几枚铜钱，没人看见，但是立即上缴，而受到了领导的提拔，胡雪岩其实并不知道，领导故意扔的铜钱为了考验他。韩非子的控臣七术就有“挟知而问”。就是领导把已经知道的事情，故意来问，看看你是不是说实话，只有处处透明，方能取得信任。比如收了回扣，汇报了，领导可能不要，不说，恰恰以后没机会了。'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 3、无理测试


    做领导的很多东西不能明说，也不方便解释，这就需要下属理解要执行，不理解也要执行。再一个，领导都不是完美的，都有自己的情绪，这时候更加需要下属的理解和支持。所以对于心腹必须提前做好无理测试。比如故意让他做不情愿的事情，或是无端的发脾气，看他是不是有怨言，有怨气，如果有，那就通不过测试，韩非子的“疑诏诡使”本质就是这个意思，让下属莫名其妙的做事，还不给任何的理由和解释，看他是不是调整自己。比如明知道手下晚上约会，故意中途喊回来办一点小事。

    很多人会问，第一点是不是也是韩非子的观点呢，没错，这就是“倒言反事”，故意搞些认知不同的事情，让你做出选择。大家可能不理解这个，但是有个词一说，大家就明白了“指鹿为马”就看你，不问对错的情况下如何选择立场。经过上述的分析，大家都能看出来，作为心腹下属，就是任何时候没有自己的意志，全面维护领导利益。无论对错，全程透明，早请示晚汇报。无论领导什么样的指示，无论怎样，都坚决贯彻。只有这样的下手，才是领导想要的心腹。做到很难吗？其实这不是权谋家的要求，任何领导都是这样的想法，西汉贾谊《治安策》：“令海内之势如身之使臂，臂之使指，莫不制从。”大意是说，治理国家要做到像身体支配手臂，手臂支配手指那样。这不就是咱们上面说的意义？


    # 年底了，你必须知道送礼的三个思路！


    【困惑】老大，学习咱们的权谋半年了，明白了红包开道的要义，就是价值交换，不白嫖的思维，的确让人际关系更加融洽了，但是作为刚毕业没太久的职场新人，也想在年底送送礼，运作下，或是去女朋友家，互动下，但是没有太多的经济支撑，该如何送礼？'
  merge: -1
  img_proc: true
- pgno: 348
  md: '【解析】礼尚往来，一直都是中国传统文化的精髓，送礼文化，表达的是尊重，是付出，是亲密。在送礼时，其实就是依照这些核心点展开的：


    # 1、用贵


    人与人之间的尊重，尤其是职场的尊重，是有特别的意义的，那就是对方通过送礼物的价值，确认他在你心目中的分量的。所以，职场一直以茅台，中华烟等高端消费品为硬通货的。这些大家都知道的价格，就知道你真的把他看的很重，你是用贵重的礼物表达尊重。这种手法，往往来的直接有效。而且越是自己亲近的人越是有效，普通关系的人恰恰不敢收，但是许多人，恰恰弄反，给熟人送的轻。


    # 2、用心


    但不是每个人，都能够有足够的钱的，没有钱，怎么办，那就是用心，千里送鹅毛，礼轻情意重。比如追女孩子送不起生日礼物的，可以用 1000 只自己手工折叠的幸运星或是千纸鹤，也往往能够打动女孩子。因为体现出了自己的用心。送领导也是，送出自己老爸珍藏多年的老酒，这就是对领导的用心。尽管这些酒只是普通品牌，但是背后就是把自己最珍藏的拿出来，这就是心意。


    # 3、用术


    没钱，还不想廉价，还能让对方感受到价值的分量，这就需要送礼的时候动脑子了。可能很多人误解为，用术就是用骗，买个假的 LV 包，弄个莫桑钻糊弄，购买假的茅台，这个风险很大，一旦被发现，前功尽弃，适得其反。真的术是擦边球，比如，和酒厂关系好，搞一些内部的特供，非卖品。这些品质高，而且还没有市场价的酒，还能够规避检查，这样的操作才是好的礼物。


    用贵，其实就是内心的尊重，拿出最好的；用心，是付出自己的精力心思，拿出真诚；用术，就是分享自己的亲密，把自己关系搞到的特权，拿出来分享。其实真正的权谋家，都是选择用术。比如过年送给老丈人，贵酒不'
  merge: -1
  img_proc: true
- pgno: 349
  md: '舍得，普通酒没面子，这就是需要采用特供，私酿什么的，简单直接有效。很多商家也调高了扫码价，其实也是在手段上回应这种送礼的面子问题。


    # 求人办事，送礼时说什么？五大套路来了！


    【困惑】老师，求人办事，不知道怎么说，有什么思路没有，指点下？


    【解析】求人办事的说辞，的确是个不大不小的问题，说大，几句话说不好，可能就失去了最好的机会。说小，是因为，送礼本质是礼，不是说辞。通常而言，我们常用五大套路：


    1、借口给家人的


    为了缓解目标收东西的面子压力，应该说，这个不用客气，我这是给孩子买的，或是给老人买的，和你没关系，就是不办事，我过来也要给他们顺手带点东西，这是我的心意。因为每个人收礼，直接收，会让人感觉没见过大世面一样。用给第三方的话术，就让彼此不尴尬。


    2、借口朋友送的


    红楼梦里，贾芸向王熙凤送礼的时候，就用的这个借口。大致是，朋友做药店的，外地发展了，送了一些冰片给我，我也用不了这些高档的东西，这些孝敬你最好。这样高档的冰片，就在送礼的过程中，变成了人情的往来，没有成本，让目标也不会觉得太贵重，不敢收。


    3、借口弥补损失


    你给我办事，都已经费心了，还能让你破费吗，这些你都先拿着，以后不够，我再给。这样的话，已经潜在预设是目标办事一定有损失，这些钱是为了弥补损失的，不是为了让目标盈利的，所以也就不推辞了，这样目标是以避免损失的借口，把这些礼给收了。


    4、借口帮忙保管'
  merge: -1
  img_proc: true
- pgno: 350
  md: '《蜗居》里朱思明给海藻送手机时，就说，正好有朋友出了款新手机，你帮忙测试下，看看有什么问题反馈下，就是帮朋友了。这样做，让收礼的人，觉得自己没有白用手机，的确是在帮朋友的忙，自己顺便捡了一个小便宜。还有，我这副名画，放在我那里也不安全，我觉得由你保管最好。


    # 5、借口帮忙转手


    我这不是给你送的，我知道这也不是你一个人的事，你也要托关系找人，这些你就替我送出去。这个不是弥补损失的借口，而是这个不是给你的，让你给别人的。目标是个转手的人，这样收礼的人，就没有任何压力的收下了。至于转不转手谁知道呢？这背后是把压力转移给不确定第三方。


    尽管上述五个借口，其实万变不离其宗，就是不能让手下的人有压力。直接收，觉得有感情压力，不近人情一样。直接收，还有面子压力，好像我对这些东西多渴求一样。直接收，觉得有贵重压力，这个这么贵，你是不是要的更多啊，这时候，要么是朋友给的，要么是帮朋友忙。知道上述的套路，基本上直接套用就行了。


    # 有三种冷灶不能烧，会引火烧身！


    【困惑】老大，烧冷灶是权力投机回报最高的方式，但是有个疑惑，什么样的冷灶能烧？有什么特征么？


    【解析】这个问题问的好，能够烧的冷灶太多了，各式各样的都有，不方便限定，但是不能烧的只有三种，我们把不能的排除掉，自然就知道，什么样的冷灶能烧了。这三种不能烧的冷灶是：


    # 1、没有个人能力


    职场的一切的基础是个人工作能力，如果一个人不学无术，没有任何处理问题的能力，或者是没有独特的能力，那么未来被权力启用的可能性就很小，一个随时可以替代的人，一个没有超强工作能力的人，怎么可能...'
  merge: -1
  img_proc: true
- pgno: 351
  md: '起，即使有机会，也只是昙花一现。所以，烧冷灶一定要看到这个人的独特价值。


    # 2、不懂权力规律


    有能力的人很多，但是懂权力的人很少，大多数，对领导缺乏效忠能力，盲目表态、错误站队、无法贯彻领导意图等；对于下级缺乏领导能力，作风粗暴，独断专行，常惹得众怒，对平级的缺乏斗争能力，被人暗算无法解决，被人架空孤立无援等。不懂权力规律，这样的人，就不会掌控权力。


    # 3、个人私德有亏


    试想，一个人把精力放在女人身上，欲望越来越大，就会花费巨大的精力，哪有心思用在自己前途上啊。在天朝政治里，对手之间最厉害的攻击手段，就是说对方有生活作风问题，一旦名声被搞臭，领导本事再大也是无力回天。道德和政治上有污点，基本上就意味着政治生命的结束。


    写到这里忽然想到韩信，在韩信成为齐王之后，蒯通说服他称帝，被韩信拒绝了，大多数人都认为韩信如果称帝会三分天下，不会有汉朝了，其实不然，即使韩信称帝，第二个项羽而已，精通军事专业能力，却对权力规律一无所知。一个不懂权谋的人，即使有机会坐上位置，也是坐不稳的。项羽不是没有成为霸王，而是不通权力规律，坐不稳，历史给了机会，还是下来了。蒯通想烧韩信这个最大的冷灶，结果自己的命差点填进去，主要原因就是，一个不懂权力规律的人，烧之无用，反而引火烧身。


    # 给西安医院的保安支一招——如何破解规则和人性的矛盾！


    【困惑】老大，能说说西安医院保安的事吗，保安该如何自保？


    【解析】我们主张不弱者带入，但是这个案例的确值得一说。


    西安一个老人心绞痛求医，因为疫情管控未能及时收治导致病危，在病危通知书下达后，保安因为核酸证明原因阻止家属进入病房，最终导致家属'
  merge: -1
  img_proc: true
- pgno: 352
  md: '没能看到父亲最后一面。这其中保安对家属说，你不要道德绑架，我也是按照规定，家属说，我爸爸病危，我怎么就道德绑架了。还有孕妇被保安同样以核酸，过期阻止孕妇求医，导致流产，医院领导和卫健委领导受到处分。


    保安很委屈，为了上级的规定，不能破格，而让家属没有见到亲人最后一面，终身遗憾，如果违背规定自己就会被处分。但是保安的僵化执行，反而给所在的医院带来了极大的负面效果。以后追责的话，保安依然会被处理。


    这个保安，执行规则，就会被家属指责，最终给医院带来恶果。不执行规则，自己失职，还是会被处理，如果真的扩大化疫情防控，丢饭碗都可能，怎么做都是错。我们当然都同情这个病人家属，但是如果我们是这个保安，或是我们的家人是这个保安，如何能够左右逢源呢？


    我们先看个故事，柏林墙守卫案：


    1991 年 9 月，举世瞩目的柏林墙守卫案开庭宣判，东德士兵亨里奇因开枪击杀欲翻过柏林墙逃跑的青年克里斯，被判处三年半徒刑。亨里奇的律师辩称：亨里奇只是执行命令的人，没有选择的权利，错不在他。而法官却说：作为一个有良知的人，他有把枪口抬高一厘米的权利。


    通过这个故事我们可以看到，从道德角度而言，保安应该用良知让病人家属见到父亲最后一面，让孕妇进去治疗。他有义务守卫规则，但是更需要良知把枪口抬高一厘米。但是如何抬高这一厘米呢？权谋家其实是有策略的，那就是苦肉计。


    私下和病患家属沟通，让自己同事录像，唱一个双簧，故意义正言辞的拒绝病人家属，家属撤滤直接殴打保安，保安直接倒地，家属“强行进入”，保安不缠斗家属，转身去跟自己上级领导处诉苦回报。为病患进入争取时间。这样，一来，解决了病患就医，二来，自己没有违背规则。三来，即使以后疫情出事，也是家属承担责任。完美破解。'
