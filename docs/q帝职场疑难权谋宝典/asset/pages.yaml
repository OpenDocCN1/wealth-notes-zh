    人际关系的能力，通过自己的规则熟悉，来为自己争取更多财富的。所以，自己的感受不重要，自己的心情不重要，周围的环境不重用，重要的是，你能不能利用公司的平台、资源、关系、规则、环境，来实现自己的财富增值，如果能，那就好好的走下去，其他的都不重要。能搞到钱，才是重点。


    所以，作为年轻人，容易丧失自己的目标，不知道自己去公司干啥去的，一个不开心就要跳槽，就要走人，人生毫无积累，逐步的，女朋友要你买房，父母让你出看病钱，孩子上学要交学费，这些没钱带来的烦恼，会远'
