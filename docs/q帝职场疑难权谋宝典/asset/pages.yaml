- pgno: 266
  md: '【解析】巧了，前几天在咱们的权谋教学群刚刚讲过《红楼梦》刘姥姥进荣国府的关系运作。你的情况就和乡下人刘姥姥一样，想利用荣国府的大总管王熙凤的关系，实现资源转化。其实关系资源的开发有三种境界，很多人只停留在第一种！


    # 1、直接关系资源变现


    刘姥姥直接找到王熙凤这个关系，第一次，诉苦，打秋风，让王熙凤可怜她，打发她，给了她 20 两，相当于农民一年的收成。第二次，送新鲜蔬菜，扮丑提供情绪价值，直接在荣国府变现近
    200 两，这是很多人利用关系的初级方法，那就是直接关系变现。利用道德绑架，利用情绪互动，让自己的亲戚关系，不得不其出手，把自己的资源拿出一部分给穷人。很多人直接借钱不还，就是关系变现的最原始低级手段。


    # 2、利用关系中介利益


    直接变现资源，是不可持续的，让人讨厌的，毕竞谁都不情愿把自己的资源给别人。聪明人，就会利用关系做中介。红楼梦里，第十五回的老尼姑净虚就是这么玩的，利用王熙凤手里的权力，运作了一个案件，从中渔利不少。大家只看到了王熙凤从中受贿
    3000 两，但是都忽视了净虚的白手捞了不少好处，没有个 500 两，都没人信。很多人都是利用运作事情，做权力关系中介，帮助人跑事，赚钱不少。


    # 3、打通关系项目运作


