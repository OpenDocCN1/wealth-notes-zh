- pgno: 141
  md: '形式，其实就是对新人一个考察而已，领导没有足够的时间去观察下属，只能在细节上，来以小见大。所以，所谓的酒局，其实就是考试。不会喝酒，可以做好服务，端茶倒水，总会吧。

    咱俩回到这个新闻，作为下属，揪出来，不喝酒，挨耳光，应该是他自己隐瞒了东西，没有领导会脾气差到这种程度，应该是不会喝酒，而且当众挑衅领导权威，领导无法下台，在酒精的刺激下，失去了涵养，出手打了他，随后便被揪了出来，这种领导，其实没有必要这样对待新人，大多数职场领导，都会直接略过这种人，接下来打入冷宫即可。但凡直接和下属冲突，就是自身权谋修为不够。

    作为职场新人，在私下聚会的场合把场面弄得如此尴尬，而且自身还被挨打，挨打之后气愤不过，再揪出来，这只能说明自身社交无能，职场圆融不够，其实金融圈比较窄，尽管打码，这个银行圈的头条新闻，在自媒体这么发达的情况下，谁人不知？以后哪个领导会喊这样的下属喝酒？被整体聚会的圈子排斥，谁还会帮他，提拔他？这背后不是他不会喝酒，而是办事缺乏圆滑，性格太直不适合提拔。

    所以啊，大家不能只看到自己会不会喝酒，要看到领导的用意，看的是你的服从度，如果自己不会喝酒，那就日常跪舔服从，酒桌做好服务工作。而那些处理不好喝酒不喝酒事情，搞的局面一度失控的年轻人，组织不会重用这样的人，不是因为你不会喝酒，而是看你不会变通和圆滑，一根筋而且不听话的人，上级领导不敢提拔，这样的人意识特别独立，自认为对的事情和领导干起来，怎么办？这才是喝酒不喝酒的真相。明白这背后的职场原理，就知道了如何应对，不喝酒，就做好服务！'
  merge: -1
