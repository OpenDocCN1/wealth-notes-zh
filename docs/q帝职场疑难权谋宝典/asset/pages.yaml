    宋朝秦桧考验孙近的时候，就讽刺并看不起他，让他辞职。孙近二话没说，直接辞职，相当听话，后来秦桧直接提拔，孙近成了副宰相。


    +   2、有可能给你设置陷阱任务陷害你。


