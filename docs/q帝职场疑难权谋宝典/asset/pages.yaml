- pgno: 372
  md: '鹰立如睡，虎行似病。越是讨厌上级，越是不能表现出来。一旦表现出对上级的厌恶感，在当下权力结构中，上下级之间，实力不对等，很容易被上级直接打击，或是上级积极的防备，这就很难对上级下手了。兵法最讲究的就是出其不意，攻其不备。想扳倒上级，就要伪顺，不断的赢取他的信任，因为能够捅到要害的，都是站在背后的自己人，很多高人都是隐忍多年！


    # 2、证据的准备


    赢取上级的信任，才能够得到确实有效的证据。这些证据，主要是这几个方面，首先就是顶头上司的权力错误，不是每个人都精通权谋，引导上司对抗他的上级，借上级的 app
    手，收拾他。其次，是搜集工作上的错误和把柄，这种黑材料，要事无巨细的搜集。提供给他的对手，让他的竞争对手，当成攻击的弹药。最后是，搜集其个人品德作风上的问题，借助大众让舆论整倒他。


    # 3、时机的准备


    扳倒上级，时机最为重要，要讲究一击必杀，因为这种对抗只有一次机会，一旦失败，万劫不复。所以，最讲究，趁你病，要你命。老虎还有打盹的时候，所以不是每个人都是完美无缺，要积极地搜集各种关于职场矛盾的信息，察言观色，领导讨厌你的上级的时候，把各种权力对抗的资料，送过去。跟竞争对手互相内斗的关键时候，倒戈。利用隐私，搞臭他，让他自动离职。


    尽管扳倒上级是个小概率事件，但是如果不得不得做的时候，通过上述的三大准备，就能够实现自己的想法。韬晦隐忍，搜集材料，一击必杀！扳倒上级不是问题。其实当你真的做好头一步，通过伪顺，骗取了上司的信任，自己尝到了依附权力的甜头之后，也就没有想扳倒顶头上级的想法了！'
  merge: -1
