  md: '可以说，保持洁身自傲，可能还没有做出成绩，就先被身边的风言风语给淹没了。捕风捉影的为你传播很多八卦。所以，必须参加。


    # 2、同事交往问题


    很多人都会和题主一样有这样的顾虑，参加他们的圈子，自己该如何做呢？那就是多听少说。尽可能的不发表任何观点，只对那些传播者表示夸赞即可，时不时的为大家买买水，请吃个麻辣烫什么的，这样大家不会觉得你冷漠，又不会卷入他们太多，被他们抓住是非的把柄。所以，和他们交往做好服务工作，夸赞行为即可，管住自己的嘴，从行为上亲近。


    # 3、个人人设问题


    “同事突然问我，咱们公司内部同事之间是不是有小帮派呢？”这是个非常有陷阱的话，他采用了先发制人的方式，看看你是不是八卦，而且他还能够置身事外。我们在职场的初期，一定不能够表现出圆滑世故，要有傻白甜的人设，让别人知道你的单纯，从而不设防。这样才能够维护自己利益的时候，他们没有警觉，这时候是要反问他就行了：怎么才算是有小帮派呢，我完全不懂，能教我嘛？


    所以，经过上述的分析，我们要明白，职场的政治要熟悉，但是要有技巧的参与，这些同事之间的交往，主要的核心点就是不要让他们成为阻力，其余的我们的精力还是放在研究领导身上，和权力的关系这才是主要矛盾。明白了职场的主要矛盾和次要矛盾，就知道该如何做了。


    # 如何的深刻的察言观色！


    【困惑】老师，有时很多人会言不由衷，心口不一，或者截然相反，如何深入深刻的察言观色，洞悉他人的心意？


    【解析】先讲一个我学中医的故事：看了很多医医书，尤其是号脉，这个技术觉得非常神秘，三根手指一搭，立即就能够对病情，说出个所以然来，'
