- pgno: 421
  md: '确认一下子扳倒你的顶头上司，不然，最好通过上面说的，工作清晰化的手段来解决。


    # 104、一定要记住饭局的目的


    学员：领导的一个饭局，领导带去的朋友，我一说话他就打压我，说我说的

    不对，反击，怕不给领导面子，不反击，又不舒服，怎么对付他？


    权谋网：任何时候不要呈口舌之争，你要明确你来这场饭局的目的\是什么，不是为了填饱肚子，也不是为了和人争执，而是增加和领导的感情和信任。酒桌上做好服务工作，顺便吹捧吹捧他那个朋友，你说的很对，几句马屁的事，何必好为人师，且自己搞的不开心呢？


    # 105、资源转化必须听资源方说话


    学员：老大，学生请教你一个问题，我这边，通过近期跑关系可以搭上市城管局副局长的关系，他是我一个叔叔的战友，也是我们老乡，我现在手头也有一个广告公司，但是不知道怎么进行资源连接，利用他的权利关系来变现，望老大指点迷津。


    权谋网：职位不代表权力，而权力也不能完全涵盖所掌控的资源。所以首先要和这个副局长坐下来吃顿饭，以他为主，看看他手里有什么样的资源能够变现，自己设置实体来配合权力变现。或者是你自己经营公司，看看什么地方是需要他来疏通，然后让他帮忙来配合，这是以你为主，这不叫资源变现，这叫办事方便。


    # 106、性格如何完善


    学员：老大，我一直有一个终极问题，那就是性格如何完善，我从小是个老实巴交的孩子，各种机遇，现在是基层部门的负责人，性格使然，不强势，不会斗争，很苦恼，有时又觉得自己矫情，去干工作就是了，但还是失意落寞的时间多，希望老大指点。


    权谋网：这恰恰不是一个终极问题，这是一个初级问题，初级问题就是，你这个绵羊的价值观需要长期的熏陶改变。为什么是初级问题啊？因为你的价值观不解决，走不远，也走不到终点。即使偶然的机会走到终点，也'
