  md: '还有一部分人，认为领导对下属偏心，并且在大领导面前一种小人嘴脸。内心充满着厌恶，认为这就是小人，从人品上否定了领导之后，就带上了有色眼镜，你认为领导行不行，其实并不重要，主要是看上级领导对他是不是认可。如果上级领导认可，说明工作到位。因为职场不是道德审判所，对道德考量的并不多，而主要是权力的考验，这才是最重要的内容。

