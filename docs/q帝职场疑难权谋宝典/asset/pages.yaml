    # 如何形成权术思维方式？


    【困惑】很多人问我，我们看了你那么多的权术文章，以及看了很多历史权谋故事，为什么自己就看不出里面的深刻谋略内涵呢？


    【解析】其实这个涉及到一个思维方式的问题，我们如果学会了权术思维的方式，那么就能够快速的用这样的眼光就看待权术问题。


