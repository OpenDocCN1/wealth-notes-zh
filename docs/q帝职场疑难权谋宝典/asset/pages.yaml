    +   2、 自律和勤奋不是唯一


    针对底层，题主开出的药方是自律和勤奋，这就是克服自身生物的劣根性。举出的例子也只是其中一种现象，那就是通过改变自己的人性，通过努力和勤奋，最终学会医 като技能，有好的生活，有一定的身份。但是把这个作为唯一，就以偏概全，对于医生职称的收入差就否认了关系的重要性，这'
