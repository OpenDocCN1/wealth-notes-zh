  md: '# 无职无权为什么还要学习权术？


    【困惑】Q帝，我们刚大学毕业走向职场，没有权力，也没有什么人脉，学习权术是不是很遥远？我们学习权术有用么？


    【解析】其实不但这个东西大为有用，而且必须要求学，你知道的越早，对自己的未来职业道路就越有用。权术其实就是中国式心理学、中国式管理学、中国式关系学以及中国式领导学的集大成。


    我们学习权术的作用？


    1、解构权力


    通过对权术的学习，知道权力运作的每个细节，知道权力的原理和方式，以及领导每个动作背后的含义。解构了权力，让你在职场就能够，很顺利的明白老板想要什么，痛恨什么，奖励什么，会把什么样的人作为自己的心腹，懂得这些，你的行为才不会盲目，才能够知己知彼的把握自己行动。


    2、接近权力


    当你洞悉了权力这个东西之后，你就要学会接近获得权力的技术。通过媚上术早请示、晚汇报以及各种拍马等各类技巧获得领导好感，充分的信任，获得代理权，再通过构陷术等除掉你的潜在对手，让你稳稳的获得权力，有了这个你在职场才算是能够立足。


    3、运用权力


    有了权力，就要学会统御，管理自己的手下，通过他们来获取自己的台阶和进步。防止小人，运用能力，把自己的权力做出合理的分割，自己才能够体会到领导的快乐，既能够通过别人做事，而自己又能够轻松自在。不会权力技术，自己累死，下面的人，还不服从管理，自己成了手下的勤务兵。


    所以我们无职无权的原因是因为不懂权力这东西，当你真的懂得权力这个'
