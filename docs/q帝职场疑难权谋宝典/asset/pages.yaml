    20 万字，事无巨细的大数据研究，一旦我们熟悉了领导的行为模式，我们就能够采用手段驾驭他。欺软怕硬的领导，我们就要学会拍桌子，争取自己的利益。对鞭打快牛不给草的领导，学会软钉子，揍挑子。意思就是，只要争取自己利益的途中，一定要把握下面三个原则：怎么有效怎么来，风险怎么小怎么来，速度怎么快怎么来。现在对这个兄弟的的问题做下解答：


    1、为什么很少提及克上


