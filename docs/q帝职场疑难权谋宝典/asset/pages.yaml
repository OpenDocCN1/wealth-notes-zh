    【解析】近期努力和成功的话题，不仅仅培训群里一讲再讲，在公众号多次回复，但还是有人不理解，正好通过这个朋友的留言，回复下：


    1、概率问题


    任何时代都有人通过自己的努力上位的，这个毋庸置疑。但是想靠努力上位，需要扪心自问三个问题，同样是努力，你的能力有没有人家强？别不承认，人与人之间天赋有差别。你有没有人家起步早？别不承认，人家从父辈就开始努力了。你有没有别人努力的多？别不承认，你的自律能力真的有这么强？你还真的没有那些有成就的人更努力。


    2、效率问题


    同样努力，还有投入产出的效率问题。你让姚明这个篮球明星去踢足球，再怎么努力都不会有大成绩，这是个人天赋影响努力的问题。别人都去研究修汽车了，你还在继承祖上手艺修钢笔，你再努力，也不会有成就。这是方向趋势影响努力的问题。你努力跑业务，而人家亲戚几个电话，就拿下业务，这是背景资源影响努力的问题。所以单纯的努力，回报效率不高。


