  md: '是看利益是不是足够大。太子逼宫，搞死老皇帝的事情并不鲜见。真正的高手都没时间思考这种小概率事件，而是不断的追求大概率，做成功率最高的事情。


    # 2、左右互搏


    权谋是讲究立场的，这个论点，站在懂得权谋的基础上，认为有必要学，都需要学，然后自己就立即对立起来，说社会该如何。这不是有病？如果你认为社会风气不需要权谋，那么你不会学，如果你认为自己有用，那么就自己好好学。而不是一边吃着糖醋里脊，一边为猪伤心。这不是人格分裂，就是思维混乱。其实底层之所以是底层，就是立场混乱，没有自己的人生主线，一会儿这样，一会儿那样，混乱不堪。比如说，要不断的破坏党散众，让下属互相斗争制衡。马上就有人跳出来说，你不是说，我们做下属的要不断的结党把领导架空吗？这种抬杠的人，不明白屁股该坐在哪。


    # 3、道德高点


    都学权谋社会就乱了，落脚点就是社会混乱，类似的论点还有，都上大学了，谁来送外卖？都升官了，谁来干活。都到大城市买房了，谁在村里种地？诸如此类。那就是自己站在社会道德制高点，来批判别人。因为这个世界，底层屑丝，除了用道德制高点来满足自己破落的人生，解释自己因为选择高尚，进而没钱，为自己寻求心理安慰而已，否则，你让这些人怎么活下去？道德制高点，成了这类人最后的遮羞布。把一切都放在道德的对立面，拥有了道德，就能够_cached?的气指使漫骂所有的事情，因为我高尚。其实，如果不明白道德只是行为包装，就永远不会得到自己想要的。


    所以，别看这句话很简单，但是思维逻辑是非常经典的。一个Events想有成就，就找好自己的立场，然后寻找大概率的进阶路径，最终得到自己想要的。而不是在极端调价的假设下，找到说服自己放弃的理由，在左右互搏中，让自己迷茫不敢进一步行动，在道德制高点下，让自己有了盲目坚持的底气。因此，要成就事业，就必须放弃上述三大底层局限思维。'
  merge: -1
