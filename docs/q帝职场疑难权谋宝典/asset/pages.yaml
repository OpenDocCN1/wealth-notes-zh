  md: '当然，如果你没有背景，没有资源，没有关系，没有天赋，没有指导，你唯一能够做的是努力，这时候，你没有选择，你只能选择努力，但是，要记住的是，没得选，和不想选，是两码事。如果别人都在利用工具资源，而你不用，你凭什么和别人在一个赛道上比拼呢？即使真的有天赋，有运气，真的靠努力成功的，这么低的概率下，你觉得那个人是你吗？最后，我想说的是，对于什么都没有的普通人，想胜出游戏，作弊才是最现实的手段。而权谋就是利用社会规则的漏洞，作弊的技巧。


    # 想白手起家，必须知道，权谋家的三不设理论！


    【困惑】权谋家的信条是 “无羁无耻” 这个价值观该如何具体理解？


    【解析】权谋家一直遵从的就是 “无内无外，无羁无耻” 的信条，也就是，不设任何的内部感情，外部条件的限制。这也是白手起家高手的绝密心法，很多朋友无法理解这条权谋价值观的具体运用，现在简述如下：


    +   1、不设限：不受资源的限制

    普通人最常见的思维观念，就是有多少钱办多少事。思维里面都是从自己手里的资源为基点出发，其实权谋家是不受自身资源的限制的，没有钱就看能不能怂恿别人投资入股，没有钱就看能不能除销货源，没有钱能不能借各种债务杠杆。权谋家都是盘活资源的高手，都不在乎自己手里有多少资源，而在于能够借助多少资源支持，不为我所有，只为我所用。


    +   2、不设线：不受规则的限制

    很多人办事之前，脑子里都是各种假想的问题，这样做不行，那样做不行，到处都是隐形的，显性的规则限制，做点事，畏首畏尾。各种的意识里的红线让自己寸步难行。一个如果只在规则之内，那么就不会有大的作为，所以，只有不断的突破自己意识里的规则限制，才能够有可能做大做强。比如开企业，一上来就完全正规化，基本上撑不过三年。'
  merge: -1
