- pgno: 18
  md: '# 1、对利益集团的识别。


    伟人说过“党外无党，帝王思想，党内无派，千奇百怪。”很明确的指出，山头，结党，这是社会常态，每个都在自己的利益集团内，维护自己利益集团的整体利益。你思考任何问题的时候，就要首先区分，识别形形色色人群背后的利益联盟。只有这样才能准确的摸清楚自己要联合什么利益，要斗争什么敌人，伟人还说过“谁是我们的朋友，谁是我们的敌人，这是革命的首要问题。”有些人看似柔弱，但是背后的靠山很硬。红楼梦里门子拿出的护身符，就是告诫贾雨村要搞明白背后的利益版块，不让自己死都不知道怎么死的。


    # 2、对利益关系的调整。


    明白了利益集团，那么就要相应的调整自己的立场观点或是关系。这个出发点是利益，而不是自己的道德、感情或是诚信什么的，出发点就是调整利益关系，而不是感情关系，或是道德关系。很多人都觉得权谋家冷酷就是因为权术家的出发点不是感情，而是利益，所以大家觉得权术家很冷酷。刘邦要求项羽烹煮自己老爸的时候分一杯羹，刘备几次抛弃妻子在逃亡的路上，为什么，都是源于此。


    # 3、随利益变动而变动。


    很多人看待问题都容易简单化，一成不变，好人就是好人，坏人就是坏人，于是被小人暗算，被欺骗，觉得权谋家都是反复无常的小人，昨天还在打仗，今天便又握手言欢。比如三国，昨天孙吴还称臣与曹魏，今天就反目成仇，大兵压境。昨天孙吴还打败刘备，刘备身死白帝，今天又和诸葛亮联合合作。原因就是利益关系变了，相应的都应该变，一切都要以利益关系变化为变化。


    大家看完这三点想必就能理解，权谋家的冷酷、无常、攀附，对他们的无法理解的行为也就能找到这个主线而清晰的看到他们每个行为背后的意义，这就是政治思维、权术思维、权谋思维的方式。'
