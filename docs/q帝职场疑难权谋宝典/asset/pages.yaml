  md: '# 普通人有没有必要学习权谋？


    【困惑】不少人有这个疑问，权谋研究的就是帝王将相的学问，和普通人离得很远，是不是普通人没有学习的必要，等坐到那个位置自然就会了？


    【解析】这种认识是存在重大误区的，作为普通人只有深度的学习权谋，才能变的不普通。


    # 1、学习权力心思


    古人一直讲“办事不由东，累死也无功。”这就是说，自己做什么事情之前，必须知道领导想什么，只有投其所好，才能够做出成就，被领导重用和欣赏，而权力的心思，就是权谋学习的核心部分。只有精通权力心思，才能够做出正确的事情，才能够快速脱颖而出。


    # 2、明白办事套路


    可以这么说，作为领导者大多数时候并不需要处理具体的、常规的事务，而主要工作就是协调各种关系，解决矛盾难题，处理突发的意外，这就需要心里有处理各种事情的套路。如果不明白这些办事套路，这个领导位置是坐不稳的，这不是坐了权力交椅，这是坐在了火山口，谋的核心就是套路。


    # 3、懂得人性优劣


    人的本性就是趋利避害，而管理就是深度利用人的这个本性，普通的管理学都是从正面激励的，这个是有边际递减效应的，物质的激励和诱惑，总是有一定限度，但是权谋手法更加全面，利用人的恐惧感、复仇心、被胁迫，让人更容易被操控，权谋就是全面研究人性的操控力。


    所以，人之所以普通，就是不知道领导想要什么，自己办事无能，对人性世故缺乏了解，所以也就困顿在原有的条件和层次下，只有熟悉了上述三大内容，才能够快速的调动资源，处理难题，迎合领导，才能够快速的转'
