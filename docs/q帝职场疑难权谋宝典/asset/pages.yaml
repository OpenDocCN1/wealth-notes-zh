- pgno: 132
  md: '# 2、若即若离


    不过社会上，大多数还是这类，若即若离的人，因为大部分都是普通人，都缺钱，有权力在手，谁不想改善自己的生活，但是大家都怕不安全的钱。因为这类钱，自己拿在手里烫手，吃下去可能消化不了。所以大家对于陌生人送钱，基本上都是拒之门外的，都是通过熟人。


    # 3、来者不拒


    还有极小的一部分人，快退休了，或是预感出事了，或是自己要调走了，还是要跑路了，就会出现非常短期的敛财行为，所有的人送礼都来者不拒，什么承诺反正也兑现不了，反而大包大揽，对于这样的人，一定要警觉，因为接下来很快就会出事，送礼的人还会<|message|>被牵连。


