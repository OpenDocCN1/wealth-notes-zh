- pgno: 290
  md: '# 领导什么都不缺，怎么送礼？


    【困惑】老师，领导什么都不缺，怎么送礼？


    【解析】又快到中秋节了，送礼就是这个时期的主题。送什么永远都是大问题。是啊，领导什么都不缺。难住了吧？其实送礼主要目的不是人家缺不缺，因为领导不是让你来扶贫的，这本身就是个方向错误。不知送啥，就直接送硬通货：


    1、什么是送礼硬通货


    为什么茅台酒的价格居高不下，而且一瓶难求？为什么高档的中华烟随处可见？又为什么高档的茶具茶叶，频频拍卖到高价？烟酒茶，其实就是送礼的硬通货。因为，这是所有人都有需求，无论男女领导，都需要。女人也要往上送，也要给自己的家人、朋友送。


    2、硬通货是社交利器


    为什么不是化妆品、衣服、金银首饰、家具、加油卡？因为这些东西都极具个人爱好的属性，没有长时间的研究不能投其所好，而且，太过于贵重的东西，留下来的后遗症也比较多，收的话，有一定的压力。而烟酒茶就不同了，转身就能送给别人，流动性快。


    3、消耗品没有人嫌多


    人家有茅台，五粮液，但是并不会拒绝多几箱，因为这个不是随时就能买到的消费品。而且多几箱，留下来有些年份，社交的时候，更加有面子。所以，对于这些高档的消耗品，消耗很大，需要不断的补充，没有人嫌多，而且是多多益善，还没压力。


    所以，不知道送什么就送硬通货。至于你求人办事，直接现金，这不是送礼的问题了，这是交易。交易就涉及到安全性、对等性、需求性等。还有'
  merge: -1
  img_proc: true
- pgno: 291
  md: '就是人家收不收，如何收？这又是另外一个问题。所以，别考虑人家缺不缺，而是考虑人家用不用！这才是正确的方向！


    # 永远不要沙里淘金！


    【困惑】老师，抽时间讲讲圣经里的权谋吧？感觉很有内容！


    【解析】不少人说，老大，天天研究资治通鉴，太枯燥了，写写论语里的权谋吧，讲讲圣经里的权谋吧，说说毛选里的权谋吧，谈谈拿破仑的权谋吧。诚然，这些地方都有智慧，也都值得我们去学习，但是我却主张，初学者，先别贪多，专注于把资治通鉴读几遍，再去看其他的书，通鉴没有研究透之前，其他的都是浪费时间！原因有三点：


    # 1、权谋浓度


    这些其他的书籍，有权谋的味道，但是浓度太低了，犹如沙里淘金。看几十万字，还没有几点有用的东西，都是老生常谈的东西。而资治通鉴，因为是古文，可以说，每一页都会有大量的权谋内容。这是其他的书籍所不能比拟的。我们的时间有限，必须用到最有效率的事情上来。


    # 2、权谋密码


    外国的书籍里的权谋故事，可以说有用，但是直接拿到中国来，可能就会水土不服，关键原因是文化背景不一样。大家在传递和接受信号的时候，理解和体会是不一样的。中国有自己特殊的思维惯例，只有看中国的权谋密码，在传递中，才能明辨意义，信息的衰减才是最少的，比如说要不要给面子。


    # 3、权谋套路


    其他的书籍套路是不全面的，但是资治通鉴的 300 万字的规模，把长达 1362 年的权谋套路全面的汇编出来，这可以说就是最全的案例库，这是'
  merge: -1
  img_proc: true
- pgno: 292
  md: '任何书籍所无法超越的。只有翻来覆去的把这套书多读几遍，体会完这里的智慧，才能拿出时间看其他书，不然就是舍本逐末，缘木求鱼。

    所以，当你没有看资治通鉴一遍以上的，就不要再看其他的东西了，否则就是忽视珍宝而追求垃圾。我们不是说垃圾里没有宝贝，而是这种出现的概率太低了，我们权谋家要做大概率的事情。垃圾里找宝贝，时间上、精力上、效率上都不划算，所以少在其他书里找权谋！


    # 授权的监控，做老板的权谋必修课！


    【困惑】老大，我报班学习权谋有几年，自己出来做老板，有点感觉了，有个问题还是很不理解；望指教，授权的问题，是监控过程，还是监控结果，还是结果和过程都监控呢？自己也看了很多书，搞不明白，希望能够能解惑！


    【解析】外围的管理书籍，都把精力放在了工作项目的完成上，所以才有了结果啊、过程啊这之间的争议，其实权谋家从来都是把权力本身放在第一位的，把权力把握好了，其余的也就迎刃而解了。权谋家从三大方面监控授权：


    +   1、 用权范围是否明确


    授权，围绕的是权力，但是很多人却把精力放在了事情的结果或是过程之上，而忽视了权力本身。首先我们要监控的就是给了他多少权力，哪些权力是必要的，哪些是不必要的，哪些是该给没给，哪些是他自己扩张出来的。这对于授权本身的范围要逐步的明确和适应做事，而不是做事和权力错配。最重要的是防止权力不够，或是自行越权，让其在合适的范围内运作。


    +   2、 用权方法是否科学'
  merge: -1
  img_proc: true
- pgno: 293
  md: '不是每个人在位置上就会做领导的，权力有自己的使用方法和规律。我们作为上级领导，要考察他会不会使用自己的权力。有些人不懂用权力，而是采用简单粗暴的命令，这就可能会引起反感，而有些犯错的事情，该处罚的，却不正确使用权力，免于处罚或是处罚过重，要么形成错误的示范效应，要么让大家丧失了积极性，最主要的就是检查权力的贯彻标准化。


    # 3、用权方向是够正确


    权力在手，不是谁都用来做工作的，不少人是用权力来谋取私利。比如，人事权力，本来是让其更好的利用人事的合理安排形成合力完成工作的，但是很多人却把人事权力变成了拉帮结派，消除异己的工具，本来财务审批是为了高效的利用资金，但是最终却成了中饱私囊，吃拿卡要的手段。所以，作为老板，要检查的是他们用权的方向，方向对了，事情就不会错。所以经过上述的分析，我们能够看出来，我们做老板的只需在围绕权力展开检查，这才是对授权的正确监控方式。而不是围绕做事本身来检查，这就舍本逐末了。


    # 权谋无法隔空开药方！


    【困惑】q帝，国足怎么才能变强，权谋有方法吗？比如您是足协主席？


    【解析】这朋友想听下我的策略，然后看看是不是有高见，但是我却对这类问题没有丝毫的兴趣。不在其位不谋政，没时间和精力浪费在没用的地方，因为这不是无能，而是不能，原因有三：


    # 1、每个人的资源不同


    位置不代表权力，权力同样有自己的限制。每个人调动的资源的能力不一样，占有的信息不一样，自己的判断决策能力也不一样。所以，无法知道一个位置上的领导的兵力所在，没有情报信息，直接就出谋划策，这个基本上就是痴人说梦，让人贻笑大方。自己兵都不熟悉，敢直接谋划打仗？'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 2、外489限制条件不同


    表面是国足的问题，这背后可能还包括足球教育的问题，足球受众的问题，运作能力的问题，国家支持的问题，运作机制的问题，这不是一个足球主席所能搞定的。选秀、教育、宣传、投资等诸多领域，是一个牵一发儿动全身的事情，这些限制条件该如何突破，不是一个领域的谋划问题。


    # 3、问题关键不知所在


    任何问题的解决，是需要对症下药的，每个人的体质不同，病情不同，所以使用的药方就不同，一个外围的人基本上不知道球队的核心症状所在，怎么就盲目的开药，说如何变强呢？想针对性的提意见，就必须对其全面了解，才能找到问题的症结所在，才能够提出具体的意见。


    因此，直接没有这些数据支撑，而直接谋划，这是蠢的表现，因为浪费自己的时间和精力也没有什么时机价值。所以，不是无能，而是不能。不是自己谋划不行，而是不具备条件，不能谋划。


    # 人性本善还是本恶？权谋家是评估而非评价！


    【困惑】人性是本善还是本恶呢？权谋的角度怎么看人性？


    【解析】儒家的确对这个问题争论不休，是善？是恶？还是无善无恶？其实这个对于权谋家，对于人性是在直接跳出道德层面来分析的，原因有三点：


    # 1、道德是有阶级性的


    评价一个人的善恶好坏，这个标准从何而来？大多数人认为，这是人类的共同的心理天赋，其实不是，这基本上来自家庭的熏陶，教育的灌输，自己的经历。而这无论是家庭，教育还是经历，都明显带有阶级性。你在底层所接触的东西和在高层接触的东西是不一样的。比如，你认为羊是善的，而狼是恶的。为什么就因为羊吃草，狼吃肉？每个人都在自己的食物链上'
  merge: -1
  img_proc: true
- pgno: 295
  md: '求生存有什么错？这个社会并没有统一的善恶标准，每个人都潜意识在自己的立场上去评价别人。


    # 2、人性是不断变化的


    人不是一成不变的，昨天认为的好人，可以转眼间就爆雷变成了坏人。你自己觉得这个人不错，改天伤害到你，立即就对他有了负面评价。究其原因其实有两个方面的原因，一个是自己利益的变化，一个是认知的变化。所以利益的变化，就是如果没有利益来往可能会更加客观的评价判断。但是如果有利益往来就很难做出客观公正，而不被自己的主观所影响。所谓的认知变化，那就是自己的能力，能不能识别对方的真假。如果你被伪装所欺骗，自然做出错误评价。


    # 3、权谋的目的是利用


    有朋友说，没有善也没有恶，人性是自私。其实这个没有错，不过也陷入了和儒家一样的维度，非此即彼。权谋家并不会简单的去评价这个人是不是善或恶或自私，而是评价他对自己能不能用，该如何用。权谋家对于人的核心法则就是用人如器，这个人是什么人，有什么优点、缺点、能力、不足。该在什么地方什么角度什么时间来加以使用。在使用的过程中，如何的避免负面的东西让自己失控，这才是权谋家对于人性的认知，善人有善人的用法，恶人有恶人的用法。


    所以，我们权谋家不是评价人，而是评估人。评价是给出了一个结论，而评估是给出了一个算法。评价的结论是终点，而评估的算法是起点，评估的目的是为了全方位的了解，最终加以利用。而且这个算法是动态的，不是一劳永逸的，而是随着条件的变化而不断的调整评估，这就是权谋家对人性的认知。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# 我发现上级做损害公司的事情，要不要举报？


    【困惑】老师，我发现我上级在做损害公司的事情，我要不要举报他！


    【解析】很欣赏你的正义感，但是这个世界不仅仅靠正义感来推动，更多的是要学会斗争的艺术，依靠权谋手腕来推动，因为这样既能够实现正义，又能够保护自己，还能够实现自己的利益。


    通常而言，举报会有如下的后果：


    1、不被领导发现，悄无声息的


    写个匿名信，直接举报。这样事情，即使扳倒了上司，自己也不会有任何的好处。但是这封举报信，能够被处理，说明有人拿这个事情作为工具，来实现自己的利益目的。作为举报人，自身没有利益，其实无形中成了别人斗争的工具，完全是为别人做嫁衣，这对权谋家而言，违背了非利不动的信条。有这个精力，不如好好去加强自己的价值建设，而不是把时间花费在为潜在利益者提供弹药。


    2、被领导发现，自身完全暴露


    但是如果未能成功扳倒上级，这时候，他就会对可疑人员进行排查。作为举报人，很大层面会暴露。因为凡是举报的都是知情人，而知情人，不可能会有共同利益的参与。这个排查范围很小，没有共同利益，而且还可能接触内情的人，没几个，再加上之前的關係，稍微来个测试，就能锁定目标。所以，自己的举报很快就会被落实查实，即使没有具体证据，作为举报人，也在猜忌之列，而受到诛连。


    3、为什么不能，直接实名举报


    匿名信要么替人做嫁衣，要么被人穿小鞋。自己有风险，且没有利益，所以权谋家不为也。实名举报就更不行了，那是公然决裂。作为下级很难有资源打赢，即使打赢，新来的上司也会心有忌惮这样的下属，接下来，新'
  merge: -1
  img_proc: true
- pgno: 297
  md: '上司也会处处防备。当然，更不可能公然举报之后，自己上位代替原有上司。这个组织就相当于鼓励这样的斗争之风，不利于组织整体利益，因为这是给领导直接找麻烦。


    那该怎么做呢？如果为了自己的利益，那就必须做到一击必杀，等整体对上司有意见，需要证据，或是自己需要站队。这时候把上司的违法信息举报出来，如果不是，只是为了实现正义，那就用自己讨厌的人的名义，直接实名举报。让他们之间狗咬狗，他们谁输，自己都会很开心。


    # 领导和下级之间是有五大鸿沟的！


    【困惑】老师，听了咱们的课，我也很快成了小领导，但是之前和同事友好的关系，忽然就没了，大家都躲着我，为什么是这种情况，我也没有得罪他们，希望老师解惑！


    【解析】领导大多孤家寡人，原因不仅仅是普通人的嫉贤妒能，这背后是五大鸿沟的：


    +   1、下属把上级理想化


    很多人受到电视剧或是自己读的书，对领导想当然和理想化，认为领导都应该是完美的，有理想的，其实现实中绝大多数都是普通人，下级对领导的错误和不足不能容忍。对领导的作风，办事都比较苛刻，时间久了，自然心里不满。


    +   2、认知水平距离很大


    作为下级和上级之间，因为立场问题、视野问题、利益问题、专业能力问题以及人际关系处理问题，都有着巨大的差异，所以，对事物的认知也就差距越来越大，逐步的就没有了什么共同的语言。这样的认知背景之下，距离被拉大。


    +   3、个人好恶主观原因'
  merge: -1
  img_proc: true
- pgno: 298
  md: '有些人的思维成单线型，非此即彼，不能容忍别人与自己不同，所有的事情都是以自己的个人情绪或是喜好为出发点，这样对领导的某些话或是行为就会因为不合自己胃口而反感。自然不能客观上理解领导的工作，进而产生疏远。


    # 4、被其他人带了节奏


    还有的人本来对领导并无什么恶感，但是受到其他人的影响或者心理暗示，带着有色眼睛看人，也便逐渐产生了不好的看法，并发展成一定的成见，这样领导的一言一行都会被过滤产生了变形。这类随波逐流的人，不乏其人。


    # 5、私人利益没有满足


    还有的下属是因为自己某些要求或者利益，没有得到领导的满足，因而心理产生不满，觉得不公平或者怀恨在心，这样也会引发对上级的 dissatisfaction，从而影响自己思维客观性和公正性。领导和下属的利益有着明显的对立性，这类最多。


    所以说，因为上述的五大鸿沟，领导和下属之间基本上无法解决，所以也就没有交往的基础，逐步的也就无话可说，形如陌路。不过我建议你，既然升迁了，就不要和这些下级纠结了，抓紧形成自己新的圈子，让自己和其他部门的同僚建立起联盟关系，这才是当下的任务。


    # 如何与有危险的领导做政治切割！


    【困惑】老大，我发现我的领导，被他的上级冷落了，我该如何做好切割？


    【解析】这是个好问题，树倒猢狲散，这是人生常态，不可能看着船沉而不离开。毕竟君子不立于危墙之下。不过切割的确实是一个很难操作的，毕竟这需要知道危险程度，以及之前的捆绑深度。不过从手段本身而言，不过是三种手段：'
  merge: -1
