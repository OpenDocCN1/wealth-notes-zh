    的，不是想听你再说一个更黄的段子。”利用这个原理，回应一个更大的玩笑，只要你不尴尬，尴尬的就是领导他了。不过这个有可能会冒犯权威，非到万不得已，禁用。


    # 组织需要人才？别逗了，组织需要螺丝钉！


    【困惑】老大，总感觉公司大领导对人才都不重视，而且优秀的人用一段就不再用了。这背后本质什么原因呢？


    【解析】组织对于人才重不重视，主要是看阶段，如果组织初创和外部竞争压力比较大时，那么领导会对人才重视，但是如果一旦组织外部没有对手，内部也进入了长期稳定阶段，人才的确实就不重要了。这背后主要是三个原因：


    +   1、组织稳定的需要


    一个组织想做大做强必然法制化、流程化、标准化，这就无形中压制了人才的自由发挥，基本没有创造的空间，坚决按照既有的安排直接执行就行了。而优秀的人才，会有自己的想法，就会不断的想突破设定，所以，一个稳定的组织，必然需要的是坚决执行的螺丝钉，而不是优秀的创新人才。


    +   2、组织安全的需要


    一个组织一旦重视优秀人才，那么就会把各种精力和资源集中在某个人身上，而人性的欲望基本没有终点，短时间的激励，最终会让人才聚集更大'
