    # 底层崛起必须突破的三道关卡！


    【困惑】老大，我出身普通家庭，内向自卑，不敢说话，偶然的机会看了你的权谋文章，我也想突破自己，需要从哪里下手？


    【解析】底层想崛起必须从价值观下手，通过权谋培训天天洗脑，整体的学习权谋算法，不断的围绕资源展开自己所有的行为。但从行为而言，如果想崛起，底层突破三道关卡就行了：


    # 1、人性洞悉


    其实越是底层的家庭，越是具有社交恐惧症，对人性不熟悉，长大之后，把精力都花在对学业和工作上，忽视了对别人心理的理解和控制。而这些对付人的工作，基本上对于底层而言是个难以逾越的障碍。内心讨厌人际关系，要么不善于表达，失去很多机会；要么动不动掏心掏肺，被人多次坑；所以，作为底层想崛起，要突破的第一道关就是要洞悉人性，不断的'
  merge: -1
  img_proc: true
- pgno: 318
  md: '对人性的熟悉，只有这样，才能有机会发挥自己的才华，不然，即使空有一身本事，没人看的见，只能是怀才不遇。


    # 2、利益交换


    因为来自底层的家庭，所有的价值观和思维逻辑基本上就是建立在资源贫瘠的基础之上的，要么是对钱看的很重，到处扣扣索索，不敢花钱，小气的不行；要么大手大脚，对金钱缺乏基础的认知，缺乏驾驭财务的能力最终陷入债务泥潭；要么不在乎金钱，只看重感情，到处被人借钱，最终一无所有。这些本质其实就是缺乏对利益交换的认知，该拿出自己的钱交换价值的时候，不敢出手；明知没有利益却到处借给别人钱，而不知道让别人付出和交换，过不了利益的交换观，积累不起任何资源。


    # 3、资源掠夺


    从小就会被灌输，血汗钱是最干净的，所有的钱必须要本本分分靠努力才是正途，对于不劳而获内心充满着鄙夷。那些宁愿亏欠自己的家人，也要兑现员工工资濒临破产的老板，内心还觉得自己高大上的很。其实这个社会真相和底层想的不一样，真正的大钱，就是不劳而获，就是利用人性欲望的漏洞，就是游走在法律的边缘，就是对别人资源的无情榨取，只有这样才能聚集起大的财富，如果只是依靠自己的踏实、努力、勤奋，基本上靠运气得来的钱，都会凭自己的实力还回去。


    所以，我们底层想崛起，就要改变自己的认知。我经常在权谋 VIP 群里讲，走向社会之后，你基本上不会有价值提升，出身确定、学历确定、起点确定、资源确定、能力确定，你都多大的概率价值提升呢？所谓的提升也只不过是工作经验和收入的积累而已。而真正能改变命运的就是不断的围绕资源积累，而不是价值提升展开的，只有找到对资源积累的路，才有可能实现收入模式的改变，进而转化阶层。社会的真相是，底层靠努力创造价值，高层靠手腕掠夺价值，好听点就是拥有资源分配权！'
