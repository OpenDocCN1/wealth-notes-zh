- pgno: 418
  md: '# 94、任何地方的竞争都很惨烈


    学员：我去小地方工作，会不会因为资源不丰富而竞争惨烈，大地方会好一点呢？


    权谋网：选择工作，首先，选择有关系背景的地方；其次，选择大城市；再次，选择有资源的小地方；又次，选择朋友多的地方；最后选择离家近的地方。按照这上述的次序选择工作，至于竞争惨烈，哪里竞争都很惨烈，想摆脱竞争基本不可能。


    # 95、先提升级别再转换岗位


    学员：有个晋升的岗位，但是要做的事我不喜欢，我该怎么选择？


    权谋网：要把岗位级别和工作内容分开，先提升自己的位置、级别，获得一定身份之后再谋求转换岗位。很多事不可能一步到位，尤其是升级这件事儿，远远大于工作内容。因为升级不好搞，而调整工作范围，这个很容易操作。


    # 96、你拿什么去拒绝？


    学员：爸妈给我介绍了一份工作，我很不喜欢，我该怎么拒绝他们？


    权谋网：重点不在于如何拒绝父母介绍的工作，而是你拿什么拒绝父母介绍的工作。拒绝的背后是对决定权的争夺，拒绝不仅仅要有理有据，而是要有更好的选择。你不具备任何资源和优势和选择，你凭什么争夺决定权呢？


    # 97、谈谈缘分的本质


    学员：师傅说，师徒之间是需要缘分的，说的云里雾里的，究竟什么是缘分呢？


    权谋网：有能力，听话，忠诚，能给师父带来利益，又能够维护好师父的利益，这就是缘分。说没有缘分，而拒绝你，其实是在照顾你的自尊，如果直接说，你的利益不够，他会降低在你心里的道德形象。这就好比，一个女子拒绝你，都是说，我对你没感觉，你会觉得很遗憾。但是如果把内心的话说出来，说你长得丑，你没钱，你会内心觉得这个女人势力，心'
  merge: -1
  img_proc: true
- pgno: 419
  md: '存不满，所以女人要维护好自己在你心里的形象，又想拒绝你，只能说没有缘分，没有感觉，仅此而已。


    # 98、对于不上道的新人如何带？


    学员：我是一个老员工，上级安排一个新进来的员工跟我学习，每天不断的索取我的知识，还理所当然，我不想教会了他，最终我被开除，老师我该怎么办？


    权谋网：对于这种不发红包，不上道的，要学会指挥他干活，当成劳工用，给他讲这样 3 点：第一，我也是这么过来的，别人也是这么教我的，必须得先干活；第二，这个方法经过验证，是成功有效的；第三就是别问那么多，就按我说的做法。


    # 99、同情弱者，该如何的说服？


    学员：我昨天看到，一个家长他女儿回到家里跟他说，班里有一个男生成绩总是倒数第一，天天被老师批评，他女儿说很同情他，然后他很欣慰的说，女儿是一个善良的人，当时我听了觉得好傻逼。


    权谋网：的确很少，关于差生的事儿应该这样去说服女儿，第一你为什么要同情他？你和他关系好，还是他曾经帮助过你，他对你有什么用途？第二，一个人学习差，是因为智商不行，还是家庭环境不行？还是自己努力不够，你和她是同一类人吗？以后还会相见吗？第三、每个组织都有差生，每个社会都有弱者，你是不是应该把自己的精力放在更优秀的人身上？这背后其实是三条原理。首先，自己的利益计算；其次，从他身上能够吸取什么经验教训和借鉴；最后，我们的精力有限，要花在哪里。


    # 100、死局是无法翻盘的


    学员：在建筑单位工作了 7 年，现在项目要做完了，老板通过各种考核指标来逼我们大家主动离职，这种残局如何玩？


    权谋网：这不是残局，这是死局。人做任何事都要未雨绸缪，而不是到最后了，试图通过一招两式翻盘。这去 7 年，早就应该爬上去，让自己成为无法或缺的人，而不是 7
    年时间过去了，还被人家放在一个可有可无的状况。'
