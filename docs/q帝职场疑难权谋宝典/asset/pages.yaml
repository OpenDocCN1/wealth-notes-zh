  md: '脉等也在这里，现在有个机会，可以调到县级市内和更上一级的地级市内去，请问选择地级市还是我所在的县级市？跪求解答。


    权谋网：在资源和平台发生冲突的时候，这个时候以年龄为区分点，如果年轻，有成长潜力，平台第一位。而如果自己年龄大了，成长空间有限，还是以资源为主。年轻人要追求成长，年长的人要追求转化。


    # 85、很多见不得光的知识，要反向学习


    学员：你有没有讲过，如何回避受贿风险的权谋，这个很精彩！


    权谋网：没有，如果这个讲出来，就成了传授犯罪方法罪，这个是要坐牢的，权谋家不会玩这种有风险的事情，不过，你可以购买检察院系统出版的贪污受贿案件的侦办案例书籍，反向学习。社会很多阴暗的学问，都会受到打击的，但是有需求就有土壤，真的想学习，就要善于反向学习，从对手那里学习，从失败的案例中学习。


    # 86、没有阴谋阳谋，只有代价计算！


    学员：老大我觉得能用阳谋，尽量别用阴谋，阴谋被识破的反作用，有点担心自己招架不住。


    权谋网：权谋里面并没有阴谋和阳谋的区分，手手段也不分好坏，只有代价的计算，成本和收益的预估，你所谓的阴谋被识破也只是说代价和收益的问题。真正的权谋家，是通过算力找到最佳的代价和收益的平衡点，从而使用的手段。


    # 87、选择资源所在地


    学员：老师，我大学毕业了是留在大城市还是回家乡呢？能给点建议吗？


    权谋网：选择什么样的城市让自己奋斗，这的确是个大问题。因为现在任何地方奋斗比拼的都不是自己一代人的积累。如果只幻想通过自己一个人的奋斗想在一个地方立足，那真的是难如登天。搞不好还成为接盘侠、沦落为社会的最低层。所以说如果你在县城有资源就回自己的县城发展，借助更大的平台做出更多的积累和转化，等你有了足够的实力，可以再带着资源走向大城市，如果你一无所有，到哪里都是底层，那还是留在大城市'
