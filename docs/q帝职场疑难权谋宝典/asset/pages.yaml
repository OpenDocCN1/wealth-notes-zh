    权谋网：理解领导谈话的确是职场的基本功，主要是我们从三方面下手，首先是理解领导谈话的时机和背景，为什么在这个节点来谈这个话题。其次是要关注到领导谈话关于这三个方面，利益的变动，人事的变动、方向的变动。最后是要搞明白这次会议是务实还是务虚，要搞清楚这些会议是要坚决执行，还是做做样子。


    # 75、沟通感情的时候千万别谈利益


    学员：老大，周三听的权谋价值观的课，关于送礼的片段，今天就学以致用了，给医院的一把手送了一盒茶叶，里面放了两张购物卡，领导欣然接受，因为我 Botafogo
    是一个学校毕业的，聊了半个多小时上学的事，但是没有谈业务的事，几次想谈业务上的事，忍住没说我这样做合适吗？谢谢你。


    权谋网：送礼有利益交换性送礼，有感情互动式送礼。你这在感情互动的时候，忽然去谈利益，会让人家很不舒服，会有很大的压力，这是一种很短视的送礼行为。通过小礼物把感情培养好了，关键时候在大利益面前谈交易，人家才会信任你，才有可能收下。这才是正常的送礼模式。


    # 76、吹牛之后要慢慢改变对方的预期


    学员：老大，我在婚恋网站上填写了虚假的信息，把自己吹的高大上，后来吸引了一个女孩子，上完床之后，我告诉他我没有车房，然后她说我骗她，和我分手了，我该怎么办？我真的很喜欢她。有没有挽回的机会呢？


    权谋网：吹牛之后不要让女孩子和你回到现实，这需要软着陆，而不是断崖式的改变，让她的希望落空。虚拟价值吸引到女孩子，然后呢，就要引导女孩子不断对你投资付出，有了这个基础，她有很大的沉没成本，再降低预期，就能够接受现状，接着给予本身的更美好的希望，就能够实现回'
  merge: -1
  img_proc: true
- pgno: 412
  md: '归现实。毕竟女人可以抄底买股票，但是呢，她希望这是价值投资，未来翻倍的增长。你说是不是？最终还需要你继续努力获取真正的高价值，这才是维护关系的核心基础。


    # 77、不是所有的关系都有用


    学员：老大，请教个问题，我有个亲戚，前天晚上和他喝酒。是分配的学区房，是区级副处，那天晚上他喝的很高兴，但已经退休，他儿子也没安排进体制内，这个要不要加强联系？


    权谋网：一个连自己儿子都帮不上忙的人，这些人也没什么用处，何况还是退休的。现在官场是人走茶凉，有权不用，过期作废。如果想利用这种影响力，关键时候拿钱通融通融就行了，不用日常维系。


    # 78、不明白自己的价值，也就没有了位置


    学员：我上司是 03 年进入公司的，前期和总经理不和，总经理让我制衡他，我 15 年毕业进公司的，水平和能力还是无法和上司抗衡，自己也在努力顶了几个阶段，也得到了一些利益，现在我上司很顺从总经理。目前总经理，也明显对我态度变了，业务越来越大，我确实没有能力全盘接受，不过我也没有和上司搞对抗。但是我夹在中间很为难，最近总经理对我不满意，经常性批评我。现在我该怎么办？


    权谋网：人在职场一定要明白自己的位置和定位，你的作用就是制衡你的上司，所以说一旦上司顺从了老总，你的作用也就没有了，反而是因为你懂得太多，也会引起领导对你的猜忌。破解之道就是我们经常说的“玩愈自重”。很多军阀剿匪出力不出工，目的也就在这里。因为对手在，你的价值才在。


    # 79、增加自己的价值，任何时候起步都不晚


    学员：老大，我 35 岁才考上公务员，晚不晚啊？


    权谋网：在官场年龄的确是个宝，进步空间可能有限，但是这个并不晚，因为在自己人生积累的道路上，什么时候开始，都不晚。原因有两个，公务员本身也是个职业，在自己满意的岗位上工作，人生也能获得人脉关系'
  merge: -1
  img_proc: true
- pgno: 413
  md: '和愉悦度，另外一种原因就是能够积累自己的官场经验，给下一代树立更好的榜样，提升更高的平台。


    # 80、和二把手争权就是孤立和抓把柄的过程


    学员：老大你好，我在一个乡里面任党委书记，面临被二把手夺权的局面，主要原因是，他是本地人，政府各个部门都有他的亲戚，有时觉得工作很吃力，想请老大指点一下。


    权谋网：这种情况下通常有三种手段，那就是掺沙子、挖墙角和甩石头。所谓的掺沙子，就是把自己的人安排到他的手下，对他进行髻肘和制衡。挖墙脚的意思，就是说，把他的人不断的分化瓦解，不断的孤立他，让他成为光杆司令。甩石头，就是让他做困难的工作，做好了，不断的消耗他的人际资源，做不好，能够抓住把柄，敲打他。


    # 81、不要在领导情绪差的时候，往枪口上撞


    学员：同事和领导发生矛盾之后，过了一会儿领导过来指导我的工作，是工作上的细节，说了一句话，我觉得，这句话有点乱指挥，然后我向她解释了一句，他就发飙了，为什么会出现这种情况？


    权谋网：领导也是普通人，她和别人发生矛盾之后，情绪会很差，而此时你对抗，会让她把坏情绪也发泄到你的身上，所以说当领导脾气差的时候，千万不要往枪口上撞。没有完全理性的领导，学会洞察领导的情绪，这是揣摩领导的基本功！


    # 82、如何防止下属拉出去单干？


    学员：我是個小老板，没有多少技术秘密，很多人学会之后都拉出去单干了，真弄得我很崩溃，老师有什么解决的办法没有？


    权谋网：这种情况很正常啊，这就是我们常说的背叛问题。通常而言，有三种方式来解决拉出去单干的问题，首先呢，不让他接触全局，让他成为螺丝钉，看不到整个组织的全貌，他也就无法单独独立出去。其次是在组织上对他进行制衡，让他无法形成自身的凝聚力，光杆司令自己出去也不会形成什么气候。最后是鼓励消费，让他没有机会攒不出钱来拉出去单干，'
