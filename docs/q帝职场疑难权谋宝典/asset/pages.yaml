- pgno: 423
  md: '基层员工就必须雷厉风行，果断处罚，这样才能树立权威。而对于直接下属，立威并不是最重要的目的，目的是得到下属的拥护，所以很多时候会采用法外开恩的方式来换取拥护。


    # 110，按照职场惯例来安排自己的行为


    学员：老大，我最近住院，科室的领导和同事给红包看望，是否应该收，我想着收了又要请吃饭，可是最近又没有这个精力，请老大指点一下。


    权谋网：红包应该收了，然后请大家吃饭，这一场一往，就叫做人情。单位通常是有先例的，看看别人怎么做，你怎么做就行了，不要搞特殊。


    # 111、有些局只能配合，无法破解


    学员：上级领导故意挑拨下属关系，以巩固自己的地位，下属该怎么破局？


    权谋网：这个领导非常懂权谋，这是非常正确的权力操作。作为下属，只能配合上级，演好自己的角色。明朝嘉靖皇帝挑拨严嵩斗夏言，严嵩不听话，这让嘉靖很恼火，给了严嵩很多小鞋穿。后来，嘉靖干脆把夏言踢走，让严嵩代替夏言的位置，之后又把夏言叫过来，让夏言来斗严嵩。这就是权力心思，你不斗都不行，不斗更难受。


    # 112、不要另类，看看成功者怎么做


    学员：我在政府机关工作，不是领导，没有上升空间，但工作能力很强，基本上什么业务都会，领导安排的工作越来越多，同事总会说这个不会那个不会，反而很轻松怎么办？


    权谋网：鞭打快牛，领导不会给你更多的好处，这就是在利用你。别人就是你的榜样，面对这样不懂权谋的领导，不懂得拉动赂系下属的人，就不必给他献媚。权谋家不都跪舔权力，而是怎么获得利益怎么来，对于那些欺软怕硬的无能领导，何必客气？


    # 113、有资源的人为什么愿意和智者交换？


    学员：我发现一个有意思的问题，我们知道有资源的人容易受到没有资源、层次低，但是价值观到位者的跪舔，后者依附前者跨越阶层，那么问题来了，这个有资源的人算是识人不明吗？算是被人围猎吗？陈平算是围猎了'
