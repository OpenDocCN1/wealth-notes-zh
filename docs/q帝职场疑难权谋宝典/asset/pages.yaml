- pgno: 173
  md: '任何组织面对外部环境的变化，资源的争夺，各种意外，作为领导的都是必须站出来承担起责任，这是当然的职务要求，但是每个人的精力和能力有限，如果有员工能够主动站出来，能够快速的替领导解决难题，做领导的对这类救火的员工是十分青睐有加的。


    # 3、带来私人利益的员工


    不是每个上司都是股东，或是老板，组织的发展对他的利益分配并不是同步增加的。所以，他们也有自己的利益需求，尤其是手握资源的人，自己得不到好处，更是眼红，他们谋取权力为了什么，还不是自己的私人利益？因此，那些能够私下给他们好处的人，自然受到重视。


    # 4、听话懂事顺手的员工


    我们内心看不起告密的小人，不能维护领导的权力安全；我们也没有特别突出的能力，能够解决组织的难题；我们不愿意送礼，求人不舒服；无法从多方面维护领导的利益，我们如何混好职场？也不是没有机会，比如做个听话懂事的下属，嘴甜一点；领导觉得舒服，还是有一点机会的。


    # 5、踏踏实实干活的员工


    在职场怕的就是，这么自以为踏踏实实干活的员工，自以为做好本职工作，上司自然就会主动给自己升职加薪。其实领导每天都很忙，对于这种不出彩的，而且走路基本躲着领导的下属，基本上视若无物，进不了视野，也就无所谓的喜欢或是不喜欢，提拔或是不提拔。


    所以，这些自以为踏实努力的员工，其实在上司眼里就是排在最后的。因此，我们知道了在领导内心的员工价值排序，也就知道在领导心里的位置了，大家也就能对号入座了。别再傻傻的盲目干活了，“办事不由东，累死也无功。”讲的就是这个道理！'
  merge: -1
