  md: '的能量，这样无形中人才就有了叫板组织的势力，而一旦发生利益冲突，理念差异，或稍有危机，这种对组织依赖度不高的人，就会离开，导致组织分裂。


    # 3、组织效率的需要


    任何组织都是带病生存，都有这样那样的問題，不可能立即解决，而且及时解决了，随着各种环境的变化，各种问题都会层出不穷。而人才拥有极强的个人意识，会不断的提出问题或是试图改变现状，无形中对既有的规定产生对抗，从而出现内耗，降低了组织的效率，增加了公司的成本。


    所以，作为大领导，尽可能的让组织不依赖于任何人，能够原封不动的执行上级意志，追求效率的同时必然会牺牲公平，所以，这也是组织发展的必然阶段。只有一个能够按部就班的组织，才是一个能够成为百年老店的组织。所以，组织不重视人才，基本上都是企业做大后的必然趋势。


    # 权谋家讲胸怀是权力计算的结果，而不是道德的要求！


    【困惑】老师，我一直有个困惑，无法解决，所以报班进来，请开示。权谋家都是睚眦必报的一群人，为什么却都不断的展示胸怀，这是不是人格分裂和矛盾呢？


    【解析】权谋家所有看似矛盾的行为背后，其实都有着统一的权力逻辑，那就是无论做什么都是围绕着权力的谋取、扩张和巩固，而睚眦必报和展示胸怀都是同样的目的。睚眦必报，大家都很清楚，权力眼里容不下沙子，有一点的权力对抗的人，都要当成反骨除掉，避免养虎为患。但是大家对于胸怀，是从个人品德方面来说的，其实这背后同样是权力的计算：


    # 1、共主的形象


    权谋家想做大自己的权力，就不能只建立在一个派系，或是一个利益集团之上，而是利用既有的力量，征服、驯化其他的力量。而不同的利益集团'
  merge: -1
  img_proc: true
- pgno: 234
  md: '之间必然有着不可调和的冲突，想维持各个利益集团都听你的，这就需要展示胸怀，包容各种利益需求，还可能有一定程度对自己嫡系力量的利益侵害。为了维护利益平衡，不能不展示胸怀，这种胸怀就是共主的形象需要。


    # 2、利益的同盟


    因为意识形态，或是利益需求，和别人产生矛盾很正常，但是必要的时候，就必须放下既往的纠葛，来抵抗共同的敌人，如果没有这种和敌人握手言和的胸怀，这其实就是削弱自己能够团结的力量。比如日本全面侵华的战争发动之后，国内的各个派系之间多年的混战关系，必须停止，共同抵御外辱，内部矛盾必须让位给外部矛盾，如果此时还是不可调和，就是自掘坟墓。


    # 3、决策的需要


    作为领导最大的权力体现就是画圈决策，看似简单的一个拍板的行为，其实融合着智慧、勇气、经验和担当，但是这个决策的前提是，必须有足够多的方案，才有可能找到最优解。而如果作为领导人，没有胸怀，听不进去其他人的意见，不能容纳各种声音，就会以偏概全，或是选择性忽视，这样的决策选择，就会有带来极大的错误，从而让自己崩盘，决策必须要兼听才明。


    所以，我们看似胸怀是一个人的道德品质，其实这背后都是自己角度的权力计算，为了能够获取更多人的支持，扩张权力；为了能够团结更多的人，保护权力；为了能够正确的决策，正确使用权力。所以，看似矛盾的背后，都是权力的计算，胸怀和消除权力隐患的睢睨必报本质是一样的。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 为什么学习权谋需要熏陶，核心原因是价值观排序！


    【困惑】老师，刚进咱们的培训群，为什么你一再强调，权谋的学习，需要价值观的熏陶呢？


    【解析】可以说熏陶是古代人文教育的一个重要学习方法，随着现在学校以科学技术的学习为中心之后，熏陶的方法就退出了舞台。但是，想在人文上有突破，就必须熏陶，很多人学习权谋多年，一直摸不到门径，就是没有经过熏陶，把自己的学习重点放在了技巧的学习上，而忽视了思维本身的训练。因为这背后是价值观排序的问题：


    +   1、价值观念


    每个人都有不同的需求，于是追求的方向就会不一样，比如情感需求、道德要求、法律规定、物质满足。每个人为了维护自身的需求，往往会把这种观点传递给周围的人。父母自然是对孩子强调孝道的，这样他们自己的生活会很幸福。统治者要求的是勇于奉献，忠心爱国，安贫乐道的，这样你才不会用心钻营，谋取私利，就能够敢于贫困，为国家做贡献。女权主义，会给你传递，你想找女朋友，就要对女人好，这样才能打动女人。不同的利益群体都会输出自己的价值观，从而对一个人产生影响。


    +   2、价值排序


    我们被各种商家、女人、领导、宗教等各种人进行价值观干扰，一会儿是享乐主义，一会儿是低欲望，一会儿爱国热情高涨，一会儿又献媚女人，自己究竟该如何处理不同的价值观念？权谋家有自己的认知，那就是价值观的排序，利益>法律>道德>感情。这个价值排序并不是说让大家违法，是在把法律当成计算利益追求过程中的成本。比如为了救人，红灯也就闯了，不就是扣分罚款嘛。但是很多普通人价值观混乱，有的底层价值观不混乱，但是恰恰顺序与权谋家完全相反。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 3、价值稳固


    知道权谋家这样一个价值排序，就能顺利运用了嘛？排除自己多少年来的价值认知和环境干扰是一件很难的事情，这就需要一个特定的环境，然后不断的灌输。这样做能排除干扰，反复的价值确认。而这个过程就是熏陶的过程，从选择忽视，到冲突对抗，到将信将疑，再到简单认同，再到完全接受，最终形成潜意识的过程。这个过程因人而异、因时而异、因境而异。所以说，没有这样一个熏陶，就会纠结到底借不借钱给一个和你不长联系的朋友。而一旦价值排序形成，给或不给，自己内心都不纠结。


    为什么一旦价值观形成就会不纠结呢，你觉得这个朋友有价值，或是能够满足自己情感价值，那就借给他，就不用担心他还不还的问题。而如果担心他不还钱，自己的生活会变差，那就
    Variables not used... 那就不借，没有必要价值观混乱而纠结。那くり'
