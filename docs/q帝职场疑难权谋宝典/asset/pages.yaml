  md: '的字）也；爱我者，慰庭也。”原来，袁世凯听说阮忠枢花钱纳妾时，便想，既然事有着落，何不做个顺水人情。于是一边假意阻止；一边却派人为小玉赎身，安排人为他们买房屋、筹备婚礼。一切妥帖之后，才引他前往。阮忠枢为报答袁氏恩情，当倒袁呼声此起彼伏时，不仅竭力维护袁氏声誉，甚至还代为受过。


    经过上述的分析，你要明白，输出利益，完成施恩，是需要从上述的三大方面入手的。这三个故事好好品味下，基本能够解决团队内的收服人心的问题。


    # 我表扬下属，被人当众抬杠怎么办？


    【困惑】老师，我刚被提拔成办公室主任，有个刚进来没多久的大学生，公开发表了几遍文章，我当众表扬了他，让大家向他学习。这时候就有人跳出来给我抬杠，“水平不能用文章来定，文章的好坏不能用发表多少来定，发表的多，也不一定质量高，可能文字垃圾居多，有些人一辈子就发表几篇文章，但是影响力很大，难道水平低吗？”我被这突如其来的抬杠，弄得措手不及，后来争吵起来，搞得不欢而散。我现在还弄不明白，到底怎么了，请老师解惑！


    【解析】只看管理书籍的话，觉得做领导很简单，不就是抓住奖罚二柄，有好的，就当众表扬，激励人才继续做下去，同时也树立榜样，让其他人学习，鞭策他们。其实管理哪有那么简单，因为你犯了三个错误：


    +   1、当众表扬年轻人，你忽视了其他的嫉妒心


    同一个部门，大家的水平基本都差不多，干的工作也相同。所以，按资排辈基本上是职场的惯例。但是你现在因为成绩，忽然表扬一个年轻人，还号召让这些老员工向新员工学习，这一下就刺激了这个老员工群体，让其他人内心很不舒服也很没有面子。所以当众抬杠，也就理所当然了。'
