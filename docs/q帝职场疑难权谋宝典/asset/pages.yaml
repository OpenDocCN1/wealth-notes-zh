    # 2、小额试探


    到底领导是猫要吃鱼，还是狗要啃骨头，还是羊要吃草，这就需要先做出小额的试探。小额的试探，一来是基于感情，不会让领导有压力，数额小，不会有问题，看收不收，看彼此之间的信任度，所以，什么事情，都是从小恩小惠开始的，送礼，上去就整大的，谁知道你是不是陷阱？


    # 3、重金交易


    很多时候，和领导关系好，觉得送礼没有必要，还会存在一种错觉，领导什么都有，不需要自己的东西。自己送他也不一定看的上，这绝对是个错误的观念。你送真茅台看他拈不拈？任何的感情只是个上车的机会，至于能不能达成目标，还要买票的。不懂这个，人家即使帮你一下，也没下次。


