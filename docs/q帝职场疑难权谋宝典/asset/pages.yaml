- pgno: 388
  md: '也是重要的筹码。很明显，新疆的未来的商业机会远远少于北京。不仅仅为当下考虑，还为自己的孩子未来发展机会考虑。


    # 6、要找缝隙跻身到上层阶级


    学员：老师你讲过，只要社会稳定 100 年，就会阶层固化，现在就出现了这种趋势，我们如何打破阶层固化？


    权谋网：我们个人没能力，也没机遇到打破阶层固化，这个使命太大了，我们能够做的是，利用权谋智慧，发现突破阶层的缝隙，让自己跻身上层。我们不是去改变社会，而是我们明白真相之后，去适应和利用社会。


    # 7、钱的多少和阶层无关


    学员：是不是赚钱多，就是跻身到社会上层了？


    权谋网：阶层和钱的多少无关，和收入模式有关。上海一个卖鸡蛋灌饼的有几套房，一个拆迁户有几套房收租，同样有几套房，但是卖鸡蛋灌饼的收入模式就是底层，而拆迁户收租就是剥削层，核心看是不是收割。最简单的例子就是，区分狼和羊，主要看，是吃肉还是吃草！明白了吗？


    # 8、读书主要是训练思维寻找规律，而不是记忆知识


    学员：老师，你看了这么多书，你都记得住吗？


    权谋网：我们权谋家看书不是为了记忆知识，而是为了在书中吸取教训、寻找规律、磨练思维，主要的目的提升自己的智慧，而不是去记忆知识，记忆知识是应试教育的遗毒。


    # 9、别把读书当成任务，要成为生活方式：


    学员：老大，请教你每天读书这么多，然后读书计划是怎么安排的，打'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# 破计划后又是怎么样调整的？


    权谋网：读书思考是一种生活方式，有时间随手拿起书就读，如果去列成计划，就是当成任务了，当成任务就会抗拒，进而不断的计划被打破。让读书和看电视一样，自然而然，不需要计划，没事了就打开电视，到处看看。现在生活都是碎片化，很多时候拿不出大块的时间，去学习，很多人一看没有大块时间，就不做了。而实际上十几分钟看上几页书，日积月累，体量也会很巨大。读书不在于多少，而在于每天不断的增加。


    # 10、人与人之间的差距主要是思维逻辑


    学员：老大，考上名牌大学的高考生，暑期在工地搬砖，你怎么看？


    权谋网：人与人之间的差别主要是思维逻辑，而不是智商。很多底层家庭能够想到的赚钱方式，就是通过体力交换。从权谋角度来说，摆地摊都比干体力强，因为商业模式高于体力模式。很多人会抬杠，干体力能够磨练意志，其实人生，能够磨练意志的机会多了，年轻人，最为主要的还是要把精力放在价值提升上，不断的转变收入模式，而不是做一些个简单的体力的交换。因为体力交换，无法为未来的人生积累经验复利。


    # 11、权谋家不需要情感倾诉


    学员：请教老大一个问题：作为一个男人找什么样的人作为知己比较好？倾诉心中苦闷、心灵安稳和得到帮助？熟悉的老同学感觉太熟没啥建设性，关系很好的同事听了老大的课越来越害怕了，没啥交集的网友？感觉红颜知己是不是比男的喝酒啥的更好？


    权谋网：权谋家不需要情感的倾诉，每天都在忙着提升自己的价值，思考如何赚钱，哪有精力和时间搞什么情感倾诉啊。底层人需要情感，高层人需要利益。明白了资源和规律，能够静心的等到时机，何来苦闷？期待别'
  merge: -1
  img_proc: true
- pgno: 390
  md: '人的帮助，这本身就是弱者思维，不断的提升自己才是王道。


    # 12、权谋是思维的训练，而不是知识的积累


    学员：一直有个困惑，想请 Q 帝大大释疑。权谋理论好像很容易懂，就算有不懂的东西经人一指点瞬间就能明白，不像高数，编程这些需要学很久。可实际情况却是真正能把权谋用得很好的人很少。这是什么原因？


    权谋网：权谋不是一个个知识点，而是思考的方式。学习的过程也不是记忆知识，而是训练思维。之所以一看就懂，自己搞就不会。就是因为，没有经过思维训练。事情千变万化，所以知识点是没有规律的，但是这背后的思维方式是有规律的。只有掌握了这背后的思维方式，才能真正的用好，这叫做知其然；知其所以然。


    # 13、不要滥发自己的同情心


    学员：老师，看着大山里的孩子很痛苦，你会捐助他们吗？


    权谋网：不要随随便便的去可怜别人，大山里的孩子没有你想的那么不堪，貌似别人不住在大城市，就过得很痛苦一样。其实，没有对比就没有伤害，大山里的孩子，身边的收入水平都差不多，没有见过好的，就不知道现在的苦，他们在大山里，每天其实也都是快乐的。只是很多人走出大山之后，看到了外面世界的繁华，就不愿意再回来，这是真的，每个阶层都有每个阶层的快乐。


    # 14、性格缺陷无法改变，要学会伪装


    学员：性格有缺陷，能够通过学习权谋补救吗？


    权谋网：补救不可能，要学会伪装。权谋是准确认知既有条件，利用规律的学问。而人性都有自身的优点和缺陷，基本上江山易改本性难移，补救'
