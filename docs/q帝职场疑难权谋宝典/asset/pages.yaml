  md: '# 管理的核心是发钱，而不是什么权谋？


    【困惑】我刚创业做老板，公司一切都很好。我觉得对员工只需要发工资到位就行了，对于你说的价值观的认同和筛选问题不敢苟同。管理而言，除了钱都是虚的，权谋过时了。


    【解析】刚打工有点积累，翻身做老板吧？有句话说得好，我曾年轻过，但你未曾老过，勿谓言之不预。你手下应该不会超过十个人，而且创业不会超过一年，所以会这么浅薄的认为。你所谓的除了钱都是虚的，其实犯了三大错误：


    +   1、钱解决不了组织内耗


    每个人对自身价值的认知和老板的认知是不同的。你无法准确的评定一个人的能力，然后做到薪金匹配，而且让所有人都内心认同。这时候，员工内心即使拿到钱心里也不舒服。比如为什么他做这么少工作，和我拿一样的工资？为什么年终奖给的这么少？为什么升迁的是他不是我？如果干多干少都一样，我干嘛干这么多？如果按照提成，优质客户凭什么分配给他？


    +   2、钱解决不了无限欲望


    每个人的欲望是无止境的，一开始 3000 的工资可以满足，但是后期呢，5000 也不够。那么你是不是能够把工资无限的涨下去？一旦工资停止涨幅，你拿什么激励别人？如果就想通过金钱激励，那么你的公司利润又是多少，自己开公司就是为了发工资做慈善？如果你的项目回款有延迟，或是行业有周期，你又有什麽理由，让大家和你一起度过危机？拿什麽让大家积极贡献？


    +   3、钱解决不了权力危机'
