  md: '术不持信”的时候还说了“信人则治于人”，因此持术不持信，不是不信任，而是紧抓主动权，让自己不被动，有第二套方案或是替代人。


    # 3、不是每个人都懂权谋


    为什么说是题主左右互搏呢，主要是基本不存在，上下级都在完全透明的权谋博弈环境。首先，不是每个上级都精通权谋，对下属多疑到全部不信任的角度，也不存在一个下级完全的致力于迎合领导信任。其次，每个人所占有的信息不同，很多人都有伪装，尤其是下属的大智若愚，而且上级完全不信任人，也不能够自己把所有事情都做了，还是需要授权别人去做。也就是说，必须拿出信任，只是比例多少问题。最后，权力大小动态变化问题，外部危机，下属能力权力大，外部稳定，自然领导权力大。


    经过上述的分析，我们能够看出来，领导不可能完全相信一个人，只是在某个时间段，在某个方面，喜欢某个人，不存在所有时间，所有方面，只喜欢一个人，这样会让领导丧失主动权。所以作为下级，尽最大努力获取最大比例的领导认可就行了。而且这个比例是动态的，不断的调整和变化的。所以不是上下级之间没有结果，而是一个不断调整和变化的信任结果。


    # 读什么书，才能让自己迅速在职场崛起？


    【困惑】老师，能不能推荐几本书，看完就能够在职场迅速能用，能够立即崛起那种书？


    【解析】很遗憾，市面上不会存在这种书，首先，即使高人写书，也不会把所有细节写出来，没有细节指导，也就不可能拿来就能用。其次，真的写出细节，恰恰会陷入琐碎，让读者抓不到重点，每个人面临的具体的人，具体的环境是不一样的，需要具体事情具体分析。最后，每个人的具体情况也不一样，起点不一样，社交圈不一样，背景不一样，所以基本没有一'
