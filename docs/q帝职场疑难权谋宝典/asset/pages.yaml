- pgno: 142
  md: '# 该如何提高整合资源的能力？其实，权谋家讲究的是资源转化！


    【困惑】老大，我跟随你学了权谋之后，对资源有了新的认知，我日常对接很多部门，该如何的有效整合自己身边的资源？请指点！


    【解析】资源，一直都是权谋的核心话题，今天详细分析下：


    # 一、资源整合


    首先，有效资源是个问题。


    所谓人脉，所谓资源，不是你拿几张名片，混个脸熟就是你的资源你的关系了。举一个极端点的例子，你是一个送外卖的，给很多公司的领导送过餐，都彼此熟悉而且还有私人电话。但这些领导干部并不是快递员的资源，一个快递员也无法去整合相应的资源。一个房地产的开发员，对接城管、城建、电力等诸多部门，很多时候，能坐在酒桌上，称兄道弟，但是这同样不是资源。很多情况下，脱离平台，立即毫无资源。


    其次，整合能力是个问题。


    很多人被各种鸡汤文章洗脑了，以为自己认识诸多关系，稍加联络，就能够整合资源，为己所用，随后就能空手起家了。其实这就是虚幻的，人家有资源的人，是脑子比你差？还是能量比你小？用你来整合资源？人家就不会做资源的联络和交换工作？


    最后，控制能力是个问题。


    即使这些有资源的人被你的牵线，联系在了一起，你又凭什么能够控制住这些人，如果这些人不被控制，你又如何的应对？作为中间人，一旦把所有人联络在一起，而自己不能够掌控核心环节，立即就会出局。一个自身没有独特可控资源的人，也没有资格整合资源。


    所以啊，自己没有什么独特可以交换的核心资源，没有独立操刀商业运作技能，没有对可能出现的风险的控制能力，贸然的谈整合，基本上是痴人'
  merge: -1
  img_proc: true
- pgno: 143
  md: '说梦。


    我们权谋家，基本上不会谈论资源整合，而是要追求资源转化，因为资源转化才是一切的运作秘密。


    # 二、资源转化


    1、我们要识别有效资源。


    很多人对资源有错误的认知，认为当官的亲戚就是资源，或是认为别人有钱就是资源，其实，资源识别是个很难的工作，因为，我们必须熟悉资源的定义：能够被拿来交换利益的东西，才叫做资源。你认识当官的亲戚，他的行政权力会让你交换利益吗？人家的钱能够让你借到吗？那些不能被你支配的，就不是你的资源。而且还有很多骗子，你什么好处没得到，反而被他的虚假资源，骗走了利益。


    2、我们要获取资源信任。


    很多人会问，我们认识的当官的，有钱的，如何他们能够为我们所用呢？就要取得资源拥有者的信任，人家觉得你有能力能够帮助其获得更大、更多、更安全的收益。我们不断的展示我们的能力，表达自己的忠诚，我们才能取得权力的信任；我们只有展示不可替代的技术，拥有更深厚的交情，我们才能够获取资本的信任。只有取得资源的信任，才有具有转化资源的可能。


    3、我们成为资源代言人。


    当我们取得资源的信任，基本上就成为了资源的代言人，这其实就是一个依附资源的过程，这也就是我们权谋网经常说的，你只要有资格拿到肉，你才能够摸油！所谓秘书是二号首长，其实就是这个意思，自己没有权力，但是他是权力的代言人，自然其他人不能不尊重。秘书也可以狐假虎威的通过影响权力意图，而为己所用。银行信贷部领导，不就是成为国家资源的代言人，而赚的盆满钵满？


    经过上面的分析，我们要记住，不要玩什么资源整合，而是要玩资源转化，这才是社会规律背后的核心。但凡玩整合的，最后都崩盘了。资源对接、'
  merge: -1
  img_proc: true
- pgno: 144
  md: '关系处理、理念融合、推进节奏、股权安排、利益分配、风险管控等等，一处出现问题，就前功尽弃了。但是自己资源转化，就简单多了，只要取得资源信任，那么，找到安全的对象，立即获取收益！


    # 同事求助要不要帮忙？必须知道这三大原则！


    【困惑】老大，在单位天天有人找我帮忙，不胜其烦，都快影响本质工作了，我该怎么办？


    【解析】职场老好人就是这种结局，做了很多别人的工作，自己累得要死，一次不帮忙，前功尽弃。前年的火爆的电影《芳华》里面的刘峰就是到处帮忙的好人，把自己的去军校学习的资格都让了，最终在社会底层，了此残生。我们该如何的在职场帮忙呢？要掌握好下面三大原则：


    # 1、只帮有价值和回报的人


    在职场大家要知道，没有做好事的道德要求，只有利益交换。帮助人不能出于个人的素质和好心，而是要考虑帮助对象的价值和回报。如果这人未来是个潜力股，或是有很大利用价值，必须帮，因为此时的帮忙就是一种投资，还有一些人没有价值，但是懂得感恩，有回报，这也是我们值得帮助的人。


    # 2、举手之劳也要设置难度


    对那些不懂感恩，不断索取的人，直接就过滤掉了，不然自己就会不断的被他们索取，最终成为烂好人，但是对于那些帮助的人，即使是举手之劳，我们也要给他一种，自己很有难度的感觉，只有这样，才能让别人更加珍惜和尊重。来的太容易的东西，没人会欠你人情。


    # 3、不要次次满足一步到位


    帮忙的过程不能够一次性到位，最好分几次，这样多增加接触，有利于培养感情，而且，让他能够知道你办事的努力程度，天天替他操心。这样通'
  merge: -1
  img_proc: true
- pgno: 145
  md: '过互相帮忙的办事，就变成了人与人之间的亲密交往，自己的人脉就会很大程度推展。不能次次满足，也是为了避免成为别人眼里的听话工具。经过上述的分析，我们能看出来，我们帮忙不是为了助人为乐，而是要利用帮助变成投资机会，变成人脉拓展机会，变成施恩的机会，不懂得帮助背后的深层次意义，就会很快沦为职场上，别人随叫随到的小弟，成为大家的公共用品，反而失去了自己的职场地位和价值。


    # 没学历，没背景该如何找工作，完成人生逆袭？


    【困惑】老师，我是农村出来打工的，没学历没背景，偶然的机会看到你的权谋文章，很受益，但我在工厂流水线，又用不上，我想改变人生命运，请老师指一条明路！


    【解析】这个问题很经典，这不是你一个人的问题，权谋解析之前，先给你说一个故事，中国知名相声演员岳云鹏，学历低，没能力，在一家饭店做服务员，端盘子，但是因为机缘巧合认识贵人，后来介绍到德云社，在郭德纲那里学相声，现在多次登录春晚，大红大紫，我想说的是，如果岳云鹏，在流水线工厂，面对的都是机器零件和周围的工人，他身边出现贵人的概率有多少？能崛起吗？咱不否认努力天份的前提下，这背后的原理是什么呢，那就是认识的人越多，自己对人性越是熟悉，人生的变量就越多，自己改变命运的机会就越大，一个没有文凭和背景的人一定要做和人打交道的工作。


    +   1、人都恐惧和人打交道的


    我们从小上学接触的就是身边的人，很少有机会和陌生人打交道，而且学校的课程设置，都是科学文化知识，没有关于人性的东西，尤其是灌输了肉食者鄙、不食嗟来之食、周扒皮等等的文章，让我们从小就有对抗权威的意识，走向社会之后，就不愿意屈膝去为别人服务，不愿意降低尊严去'
  merge: -1
  img_proc: true
- pgno: 146
  md: '讨好别人。觉得这样自尊心会受到伤害，所以走向社会，不懂人性，不会服务，自然就不想做待人接物的工作，宁愿自己去工厂，去干体力活，这样让自己过得踏实，有安全感。但是这样的面对机器或是零件的工作，打交道的人少，自己作为普通流水线的工具人，基本上没有扭转命运的机会，人生只会越走越低，因为青春不再了，体力不再了，机器可以替代了，没有任何的对比优势。


    # 2、起点低，跑业务做服务


    没有学习没有背景，就必须做这些看似很难，其实很容易的工作，那就是跑业务或是做服务。因为形形色色的人，不同的背景和脾性，不同的利益和喜好，永远不可能机器化，标准化，只能通过具体的接触和沟通，才能获得人与人之间的链接。而这个链接，只要做好了就自然能够赢得资源拥有者的信任和重用，这样随着时间的积累，对人性的熟悉，对人脉的积累，对资源的把控，最终都会让自己一步步的走向成功，比如一个服务员，做好了，很可能就会成为大堂经理，从大堂经理一步步的可能就会成为店长，从自己做店长优秀了，很快就会得到股份，或是被挖走一起创业。这个真的不是虚构的假想，海底捞里面都出了多少个低学历的百万富翁和店长，大家就清楚了。


    # 3、认识的人越多资源越多


    我们再反观在工厂的流水线，天天累成狗，回到寝室就睡了，身边接触的人层次都不高，也没有什么专业和资源的积累，随着年龄的增大，体力的消失，逐步的就淘汰了。即使是腾讯那些程序员，35岁没有进入领导岗位的也都面临着清理和淘汰。因为技术的可替代性太强，消耗的精力也大。而针对人的工作，时间越久，彼此就越熟悉，关系就越好，大家的信任度就越高，沟通成本就会极大的降低，维护起来就容易，大家的资源互换，就会自动不断的增强。饭店大堂经理，可以给人添菜，提前安排好位置等等，权力社会关系很快就能够通过饭店的平台拓展开来。你在流水线，做的再'
  merge: -1
  img_proc: true
- pgno: 147
  md: '好，顶多提个线长，很难有继续成长的空间。所以，大家一定要寻找一个有积累和成长空间的工作。


    很多人不知道人生的积累和成长空间这原理，所以都是做的重复的，一次性的工作，不断迭代的工作，多少年过去了，手里除了到手的工资，没有任何的人脉，没有任何的资源，没有任何的提升空间。所以，建议大家，要好好学习权谋，精通人性，起点最低的人群，从业务和服务开始，走向自己的人生坦途！


    # 领导向下属借钱怎么办？


    【困惑】老师，领导买房缺钱，向我借怎么办？


    【解析】上级借下属的钱，是个经典的职场问题，值得我们深入的分析下：


    +   1、有能力的领导不会借下属的钱


    作为一个组织的领导，首先从资源上说，因为层次的存在，能够获取工资之外的各种资源，所以，财力远远比下属要强。其次从权力上说，如果借下属的钱，在下属面前丧失了神秘感、权威感，基本上以后管理下属很难。最后是交情上说，一般人都是先借自己的朋友，关系好的，而不是在职场上借工作关系下属的。所以，真正优秀的领导基本上不会借下属的钱。因为借钱的领导，要么是自己不会混，要么是社会关系缺乏，要么是不懂管理，无论哪种，迟早倒台，这样的领导都不能跟随。


    +   2、领导借钱的话只有这三种情况


    但是为什么我们会遇见，那些借下属钱的领导呢？通常有三种情况：第一，个人没有底线，这样的人，根本不会顾及自己的领导形象，因为自己的不良恶习，身边人已经知道具体情况，借不出钱，只能病急乱投医。第二，企图圈钱诈骗的，因为民营企业，即使是领导，做了几年了，也有可能辞职走人，换城市，走之前，通过借钱，变现一波。你哪里找他？第三，就'
  merge: -1
  img_proc: true
- pgno: 148
  md: '是变相索贿的，因为知道你偷偷的变现了资源，他通过借钱敲竹杠，基本上没有打算还的，说是借，其实就是为索贿掩护。


    # 3、我们什么情况都不能借给他钱


    所以说，我们面对领导的借钱，什么情况下都不能借给他，无论，他说自己多么的有实力，名义多么的正当，期限多么的短，暗示的好处有多少，或是潜在什么威胁，我们都不能借他，因为我们来职场就是来赚钱的，如果没有赚到钱，反而赔钱，不是傻就是蠢。那么我们该如何拒绝呢，当然就是我们最常见的套路，哭穷法，我们房贷车贷，老妈老婆生病，弱势法。钱都被老婆管着，家里人怕自己出去鬼混，领导借钱的借口早就用过了；其实借口大家都能想到，关键是价值观要到位，就是不借。


    当然，还有更加隐蔽的套路，很多人难以识破，那就是小的民营企业，老板向员工融资，直接借员工的钱，承诺给股份，或是承诺高息，这个教训也{BBOX}不少，这是变相的吸收公共存款罪，我们千万不能被这种暴利诱惑而做出错误的行为。不要认为组织大，不会跑路，因为你不知道，这背后，大组织到底有多少债务，到底是不是资不抵债，所以，在借钱这件事情上，不能想当然。通过上述的分析，我们在职场一定要记住，我们工作是为了获取财富的，而不是过来扶贫的，不管是谁，啥借口，都不借！


    # 和领导关系已经无法修复，该如何谋取自己的利益！


    【困惑】老师，之前没有看权谋网的文章，不懂得职场的权力原理，和领导闹翻，因为是国有单位，彼此关系已经很难缓和，也无法离开，已经无法使用讨好的手段了，还有其他的招法维护自己利益吗？


    【解析】知道权谋规律，能够调整自己的行为，快速进入领导视野，赢得领导信任，获取组织资源，这是常规流程，这并不是说，就没有残局玩法，'
  merge: -1
  img_proc: true
- pgno: 149
  md: '毕竟，鱼死网破或是让其投鼠忌器还是有套路的。通常而言，这种无法修复的上下级关系中，能够用的策略就只有三种：


    # 1、死缠烂打


    每个领导的精力都有限，而且能不能管好下面的人，也是其个人领导力的水平体现，如果天天对领导死缠烂打，不断的消耗他的时间，他的精力，他的好心情，他在上级眼里的印象，他就会避之不及，最终不能忍受折磨，而妥协，给与一定的利益安抚，让他自己少麻烦。


    # 2、死猪不怕开水烫


    反正关系已经无法挽回，不管领导的决策正确不正确，只要让自己不爽，就怼他，而且一定要拉出这种死猪不怕开水烫的架势，不惜鱼死网破，当众质疑领导给自己穿小鞋，是故意借机整自己，到处告状，说他有私心，任人唯亲，打击报复手下员工，领导会丧失继续打击的权力优势。


    # 3、煽风点火带头挑刺


    任何的领导都不是完美的，谁都不是永远正确，谁的屁股都不干净，但凡管理，就会得罪人，而且不可能只得罪自己，所以，要善于抓住领导的错误和漏洞，不断的煽风点火，不断的鼓动民意，让自己成为仗义执言的形象，不断的让领导在位置上坐不稳。这样做，领导他就怕了，就会妥协。上述的战术并不是常规套路，不过在目前的情况下只能如此，这和中医用药是一样的，凡是猛药，就必然有很大的后遗症，或是副作用，那就是这样做下来，就成为了职场的顶级“刺头”，哪个人都讨厌，所以不到万不得已，还是少用，慎用！'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 女人权谋——为什么电视里都是傻白甜取得成功啊？


    【困惑】老师，我是女生，大学刚毕业进入职场，接触到你的权谋网，看了很多文章，觉得很有道理，职场就是需要算计，但是为什么我看了那么多的电视剧，都是那些傻白甜最后成功，最后嫁入豪门，或是被各种帅哥富二代追逐，而那些处处算计的下场都不好呢？老师，我迷茫很久了，能解惑吗？


    【解析】初入社会的小女生的经典问题，我们从几个角度分析下到底背后的逻辑是什么？


    # 1、女人是电视剧消费者


    男人看看新闻、看看足球、玩玩游戏、看看美女，哪有时间看那些 possível歪歪的电视剧呢，而女人却不同，没事的时候就拿着手机追剧，一部部的看，女人是电视剧的最大消费者，电视剧作为一种商品，必然迎合客户。所以，让那些不用费劲心思的普通女人走向巅峰，也是白日梦的一种。


    # 2、鼓励善良是政治正确


    任何的公众产品，都必须考虑到政治导向，政治正确，尤其是这种电视剧的大众传媒，审核更是严格，如果让玩手段的女人都幸福无比，这就是错误的政治观点，非但审核不通过，大众也会认为这是价值观的错误，社会上怎么可能让玩心计的女人，脱颖而出呢？坏人就该被打倒，善良必胜。


    # 3、男人喜欢单纯的女生


    职场的男人和学校不同，职场是个利益交换，复杂斗争的地方。男人睁开眼就是刀光剑影，明枪暗箭，时时刻刻的保持警觉，神经紧绷，感觉很累，如果忽然间看到一个单纯的，清澈见底的女人，自然会忽然间很放松，很安全，有一种远离都市喧嚣的感觉，会积极的给女人帮助。


    # 4、示弱激发男人保护欲'
  merge: -1
  img_proc: true
- pgno: 151
  md: '男人在职场上获得成就感很难，生活处处累成狗，基本上体现不出自己的价值。而一个处处有点单纯的小女生，像一个受 kallas小白兔一样的，扯着衣角，怯生生的看着男人，此时，男人的保护欲，就立即被激发出来，男人感觉自己被需要，自己的价值，立即就得到了体现，傻白甜就是这种职场弱者。


    # 5、男人把幼稚当成真爱


    男人都想，她是喜欢我的钱呢，还是喜欢我的人呢，那些精致到骨头里的女人，开口要车要房，去高档餐厅吃饭，让男人压力很大，不是不是大家喝不起15元的奶茶，而是觉得这样的女人并不是生活的最佳伴侣，有时，尽管职场可能不会有恋情，但是男人会对邻家女孩有一种配偶幻想，因为相处很放松。


    # 6、鹬蚌相争而渔翁得利


    因为傻白甜基本上，让人感觉有一种不设防的状态，也没有争取利益的心机，而是那些有心机的女人互相视为竞争对手，互相攻击，为了一个位置大打出手，对于领导而言，任何一方上位，都会让另外一方被动，从而失去职场的平衡，所以，让没有背景的傻白甜上位，能够协调冲突关系。


    # 7、傻白甜懂得权力规律


    很多女人自己的专业能力不行，到处有错误，教几遍都学不会，这样的女人是累赘，是麻烦，男人都不喜欢。这不是傻，这是蠢。女人自己的身材不行，穿着无品，这不是白，这是丑。而且有些女人说话很冲，到处的讽刺挖苦，这就不是甜。处处和领导对着干，这种人只能被淘汰。


    所以说，尽管傻白甜有成功的，而且概率很高，毫无心机，白壁无瑕，因为这类女人基本上是社会极品。但是真相是，职场上，这些傻白甜，都是装出来的绿茶，他们精通男人心理，做出迎合男人的这种白莲花，让男人误以为是傻白甜，这才是真正的心机。并不是表面上的剑拔弩张才是权谋，利用好女人优势，这种也是！因为权谋从来不在乎手段，只在乎是不是有效，能够达成目标，就是好手段！'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 玩权谋是不是天天要算计别人啊？


    【困惑】学权谋天天算计别人，不累吗？做人就不能轻松点？


    【解析】社会的丛林法则，弱肉强食，谁都想轻松点，但是，树欲静而风不止啊。社会上如果不算计别人，就会被别人算计。如果你是追求吃了睡，睡了吃的生活，那么就要知道猪的命运就是人家的一道菜！其实权谋家很在乎自己的精力和算力，从来不频繁操作，讲究非危不战，非利不动，主要是坚持下面三点：


    1、用力关键人物


    社会上的资源是被少数人所掌握的，而职场能够决定我们命运的没几个人，因此，不用天天照顾好所有人的情绪，只要致力于三五个人就行了，有关键领导的支持，职场有了靠山和保护伞，就是一路坦途。所以，我们日常的精力就是用来研究领导，不断构建对他的大数据，其他身边的小人物就不用浪费时间了。二八定律永远都是最正确的，别试图贪所有的利益和关系。


    2、用力关键阶段


    作家柳青的在《创业史》写到：“人生的道路虽然漫长，但要紧处常常只有几步，特别是当人年轻的时候。没有一个人的生活道路是笔直的，没有岔道的，有些岔道口譬如政治上的岔道口、个人生活上的岔道口，你走错一步，可以影响人生的一个时期，也可以影响一生。”权谋家也是如此，不会平均用力，而是在升职加薪的核心时期，积极运动，除掉对手，坚固盟友等。


    3、用力关键事情


    职场上可以说，烂事一堆，大部分工作都是没功劳，不出彩的事情，就是你天天加班到深夜，也不会有什么大的收获和机会，但是我们用力职场最'
  merge: -1
  img_proc: true
- pgno: 153
  md: '需要的地方，最核心的事情，解决核心问题，展示独特才华，这样就能够获得领导的重视和青睐，就能够获得同事的尊重和支持。所以，想在职场混的好，就要争取到核心的事情，至于无所谓的小事情上，真的不必要浪费精力。


    权谋家的时间和精力很宝贵，日常主要用于自己的价值提升，在这个快速变化的和浮躁的社会，只有自身的价值提升才是屹立职场的法宝，天天把精力用在算计别人身上，而忽视自己的价值，早晚赢了战术，输了战略。所以，权谋家并不是天天的算计别人，而是天天的抓住价值提升这个主要矛盾，不断的让自己更加值钱，但是也不忽视用力关键地方！


    # 什么时候结党最合适？针对不同的上司有不同的做法！


    【困惑】小卒子一个的时候，就在下面结党，形成一定势力的时候，被上级招安，招安后就和原来的党羽切割，是这样吗？


    【解析】这样的理解是完全错误的，小卒子的时候，为什么要和你结党？你能给别人什么好处和价值？等形成势力被招安，招安的不是你本人，而是这背后的势力，而你切割之后，你在上级眼里还有什么用途和价值呢？很多人脑子里有结党和切割的概念，但是，没有系统学习的话，就会似是而非，导致根本性错误。我们下面详细分析什么时候结党最合适？


    +   1、面对普通型领导


    面对普通的领导，在最初级的阶段要依附，就是通过自己的专业能力，个人忠诚，投其所好，能够获得上级领导的好感，获取一定的资源。逐步的提升自己在职场的位置。到达中层之后，基本上脱离一线的工作，这时候就需要结党，形成自己的势力。通过自己的权力和资源，培养自己的嫡系和力量。自己的势力越是强大，指挥越是顺畅，职场的地位就越稳定，自己的安全系数就越高。而到了高层之后，因为，位置少，资源多，斗争激'
  merge: -1
  img_proc: true
- pgno: 154
  md: '烈，屁股下面都是盯着自己的人，所以这时候，斗争就是主题。要不断的清理掉潜在的竞争者，这样自己就能牢牢的坐在位置上。


    # 2、面对权谋型领导


    我们在职场不都是遇见好的领导，很多上司是通过各种手段和关系上位之后，对其他人都充满着不安全感和猜忌，所以在这类权谋型的领导下面工作就要采用另外的策略。初级就是韬晦，在自己还没有站稳的时候，最好不要展示自己的才华，不然领导会认为你有可能对他形成威胁，有可能会被提前除掉。而到达中层之后，就看到身边的中层都是各个笑面虎，一脸的道德正气，满肚子的男盗女娼，这时候最重要的是和光同尘，和周围的表现一样，才能够不被排除掉，边缘化。而到了高层，领导就怕你有伤害力，这时候就要学会交把柄，最高领导才能够感觉到安全，才能放心。


    # 3、什么时候结党呢


    通过上述的分析，我们看出来，什么时候结党，就是在权谋意识不强的领导手下工作，自己做中层，就需要不断的借用公权力，公共资源为自己结党营私，施舍私恩。不断的构建自己的利益联盟，逐步的架空上级领导，这是自己的权谋进阶之路。但是如果自己面对的是权谋型领导，领导最讨厌的就是下面的人联合在一起。权谋型领导最喜欢的就是孤臣，所有人都必须围绕在他的身边，不私下和任何人来往，有什么消息和动向，都第一时间汇报，不善作主张。也会在任何时候都坚决支持上级的决定，无论这个决定是对谁，自己就是领导的嫡系，这就是最大的结党。


    所以，我们究竟是不是要构建自己的势力，关键是看上级的权谋水平，他水平高，自己就老老实实的听话，他水平低，就要假公济私的构建势力，架空并驾驭他。所以，我们在职场要看情况的选择。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 如何指挥老爷兵，三招管理没有战斗力的团队！


    【困惑】老师，我在国企，通过学习咱们的权谋课程，自己很快，就被原地提拔成部门领导，但是问题来了，很多老员工并不认可我，而且，很多 人有各种背景关系，指挥不动，我觉得，得到这个位置，不仅仅没有感受到权力的乐趣，反而坐在了火山口，做不出业绩，我该怎么办？


    【解析】指挥老爷兵，一直都是管理难题，开除不了，又无法决定工资待遇，只能通过工作安排来获取一定的权力。但是这个又会遭到消极抵抗，很多初级管理者，都非常的头疼。不过也不是没办法，通常而言，都是采用这三招开展工作：


    # 1、指挥没背景的


    任何时候，最有效的管理，就是拧软柿子捏。国企单位，并不是所有人都有背景关系，摸清楚每个人的来历背景之后，对于那些没有后台撑腰的，必须严厉使用，有怨气他也只能憋着。有人干着活，其他人按部就班，基本工作就能完成。


    # 2、搞定没脾气的


    很遗憾，很多时候，都是领导的七大姑八大姨，安排进来的都或多或少的有关系，这时候，就需要找到性格比较好的，没有多大脾气的，说白了，越是老实的、不懂得反抗的，我们越是要多用，“鞭打快牛”就是这个背景下产生的，谁干的多，就累死他。


    # 3、敲打没朋友的


    职场老黄牛也不多见了，尤其是现在的 95 后，个性十足，这时候一定要找到那些职场孤立的，如果没有孤立的就挑拨他们之间有矛盾；这样就会孤立一个人，然后就能够获得权力指挥他，因为他的孤立，必须和领导一起，或者指挥他的时候，没人替他推脱。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '这上面的三点是层层推进的关系，不过呢，在这种结构环境下，指挥好下属，并不是我们的核心目标和战略方向，这些人只要不是自己的阻力就行，核心的还是抓紧往上爬，至于业绩的担心，大可不必，因为只要和上级关系好了，出成绩的工作就会给你，即使没有，也会安排你摘桃子。所以，任何时候，往上爬才是战略核心，管理好下属，按部就班，差不多就行了。


    # 领导更喜欢人才还是奴才？站在领导角度说透此事！


    【困惑】老师，我刚刚接触到你的权谋智慧微信公众号，好boldsymbol{像}一下子发现了新大陆，和平时见到的东西都不一样，有个初级的困惑希望得到解答，做领导的究竟更喜欢人才还是奴才？


    【解析】这的确是个入门级的问题，首先指出你的思维错误，社会现象是非黑即白，而是错综复杂，人才和奴才并不对立存在，好人坏人也不是一成不变。具体到你的这个问题，要分三个层面来看：


    +   1、首先看组织阶段


    一个组织从设立，到做大做强，到最终破产消失，是一个必然的过程，每个阶段都有每个阶段不同的需要和任务，也就需要不同的人来实现。这就是我们权谋网常说的两句话，“乱世用能，平则去患”“兔死狗烹，鸟尽弓藏”。组织刚设立，更多的是面对生存危机，所以人才至关重要，而一旦没有了生存危机，御下的内部权力危机就成了重要任务，这时奴才最重要。


    +   2、其次看领导能力


    所有的领导并不都是依靠能力上位，或者不能永远保持高水平能力，随着时间的推移，新技术的开发，很多领导自然就能力不足，如果领导能力强大，能够驾驭整体局面，拥有核心能力和技术，自然不怕下属拉出去单干，'
  merge: -1
  img_proc: true
- pgno: 157
  md: '自然对人才青睐有加。但是如果自身能力不足，对人才就会有所忌讳，怕顶替了自己，于是就会更加喜欢奴才，这样能长久的保持权力和安全感。


    # 3、最后看具体事情


    一个组织的日常的事情主要分为两大块，一个是业务层面，一个是组织层面。业务层面，包括产品开发、市场拓展、售后服务等等，这些都需要人才用心去做。没有人才的积极主动，就不会有好的效果。但是如果是组织层面的事情，人事安排，权力控制，关系协调，这时候，奴才就会发挥极大的作用。所以，一个高明的领导，是人才和奴才都使用，而不是单一人才结构。


    但是我们权谋网不断强调的就是，不断的加强自己的业务能力，成为人才，而且通过对权谋的学习和修养，能深谙权力的规律和领导的心思，能够让领导知道这样的人才使用起来安全，比如唐朝，郭子仪“权倾天下而朝不忌，功盖一代而主不疑”，不仅仅有能力，而且用起来还很安全，这才是我们要追求的人物和榜样。所以任何时候不要非此即彼，才能做的更好，爬的更高！


    # 学习权谋核心目的不是打击报复而是提升阶层！


    【困惑】过去有个人得罪过我，我现在想报复，却发现没有招，不能明着对干，学习了这么久，拿不出一个报复方案和步骤，请老师帮帮我！


    【解析】这种报复思想，本质就是个错误的人生战略。让自己每一天的精力纠缠于烂人烂事，就会妨碍对自己人生目标的追求，久而久之，依然会在底层苦苦挣扎。只要你还在底层，每天遇见的这种坏人的概率就不会低，天天和老鼠作战，即便赢了，也不过是一只猫，和丛林之王得老虎，还有十万八千里的距离！我们对自己的人生要有清晰的自我认识：


    1、认清楚自己的前进方向'
  merge: -1
  img_proc: true
- pgno: 158
  md: '一个人一定要明白自己的人生方向，知道自己要去哪里，就目前世俗而言，就是赚更多的钱，爬上更高的位置，获得更多的幸福，但是我们前进的道路上，不仅仅是天有不测风云和路上坎坷荆棘，更多的是路边的诱惑以及烂人的纠缠，很多人没有被困难打倒，却被路边的诱惑和纠缠而浪费了赶路的时间，从而忘记了自己要去的路。报复烂人，和烂人纠缠就是在模糊人生方向，你报复的不是别人，是耗费了自己的青春。所以，任何时候，除非万不得已，必须轻装上阵，每天为目标努力！


    # 2、认清楚自己的竞争对手


    权谋家和别人竞争，使用各种手段，并不是为了发泄情绪，而是为了收割资源，赢取关系，争取先机，寻求利益，排除妨碍。所以慎重的选择自己的对手，准确的选择自己的对手，什么时机选择斗争，达到什么斗争的级别，以及自己愿意付出什么样的代价，都在考虑之列。而不是盲目的，随着自己的性子，就开始打击报复，或者别人稍微对自己有点动作，自己的自尊心就敏感的受到挑战，永远要记住，权谋家的这句话，非危不战，非利勿动。不到万不得已，不出手，没利益的事情，不干！


    # 3、认清楚自己的阶层所在


    这是不是说，我们就逆来顺受？成为职场的软蛋？这当然是错误的认识，这个就是从一个极端走向另外一个极端的思维方式。我们不是被动等待，而是不断的提升自己的阶层。只有摆脱了社会的最低层，遇见烂人坏人的机会就少很多了。比如，如何报复楼上天天跳舞制造噪音的邻居？不是打击报复，那样自己也会坐牢，最好的还是搬到别墅区，哪还有楼上邻居的事？坐公交如何避免被报复社会的司机带入河里？最好的答案，是不做公交车。所以，不断的提升自己，才是人生王道！


    其实只要我们不断的提升自己的阶层和势力，这些小人就不敢跳出来，每个人都要计算自己的成本和收益，尤其是小人，自己的小算盘打的更加精准，他们欺负人的成本一旦上升，自然就会有所顾忌。而自己一旦有了能量，一个暗示，就有小弟下手了，还会脏了自己的手？君子报仇，十年不'
  merge: -1
  img_proc: true
- pgno: 159
  md: '晚，等有了权力了，这都是小事，不过真的到了那个时候，就更加不会把这些人看在眼里了。韩信就是历史上最优秀的代表，人家如果和欺负自己烂人决斗，必然被抓被杀，那是匹夫之勇，还能成为大将军？成为大将军之后，能够行使报复了，韩信早已不把这些人放在眼里，忘记了跨下之辱了！


    # 外行领导内行，做下属的该如何应对？


    【困惑】老师，新来的领导完全不懂技术，处处为难我，对我的工作指手画脚，我该如何应对？


    【解析】这是外行领导内行的经典职场问题，如果不从权谋角度去理解，很难搞清楚这内部的原理。


    1、为什么上级领导派一个外行来指挥？

    作为更高的领导自然很明白派来的人工作能力，业务水平。但是为什么还是派这个外行来，而不是找个技术干部呢？因为有三种可能的情况，首先是，加强权力控制，专业性太强，形成了封闭的部门，领导需要掺沙子，来打破权力的失控。其次，为了清理某个人，一个外行领导内行，自然会横挑鼻子竖挑眼，这样会让很多人不适应，自动离开，把组织意图变成个人恩怨。最后就是，心腹过来镀金，作为领导要培养的接班人，过來轮岗，熟悉公司内部事务，熟悉基本情况之后，很快就走了。


    2、为什么不懂技术的领导要指手画脚？


    一个外行的到一个专业部门做一把手，为什么会顾气指使，到处指手画脚呢？原因有三个：第一，展示自己的权威，自己没有专业的威望，必然要加强权力上的控制，通过处处插手，让自己在组织里有存在感。第二，通过不断的指手画脚，处处掣肘，就不会被下面懂专业的人给架空，让他们不能随意的肆意欺负他。第三，一个专业部门，如果作为不懂技术的干部，'
  merge: -1
  img_proc: true
- pgno: 160
  md: '这也是工作的方式一种，不然给上级传递出的感觉，就是傀儡一个，毫无作为，哪个组织也不会养闲人，这样的领导必须这样做。


    # 3、作为下属如何工作才是最好的选择？


    作为专业能力强的下属，被一个不懂的人处处掣肘，自然心里不舒服，工作起来也不方便。但是我们如果懂得上述的权力原理，就能够从容应对了。首先，解决权力顺从，既然最高领导需要加强权力对这个部门的控制，这时候，就不能通过技术或是专业要挟领导，坚持己见，更多的是早请示晚汇报，让领导有控制感。其次，接地气的工作汇报，把专业技术讲明白，别让领导觉得你故意用专业欺负他，让他没面子。最后，赢取信任后更多展示，这类干部很快就走，自己可能以后会被提拔上来。


    经过上述的分析，看透这一切，就能找到症结所在，就能完全的配合新领导，其实这恰恰是个机会，如果心平气和的配合外行领导的工作，给他把工作讲明白，让他有控制感，很快就会依为心腹。一旦成为心腹，获得信任之后，会有更大的专业展示空间。所以，要心平气和的配合而不是对抗，这才是面对外行领导的方法，别心里不服，别人能做领导绝对有你值得学习的地方，不是吗？


    # 掌握领导的人性开关，就能开启他的情绪暗门，最终完成权力窃取！


    【困惑】老师，昨天领导和我说话之后，转身轻咳了一下，这代表什么意思啊？


    【解析】很多人学习权谋，最初期就会犯这个毛病，变得疑神疑鬼，草木皆兵。没学习权谋的时候，对权力不敏感，反应迟钝，学了权谋之后，觉得什么行为都能够无限解读出各种味道，其实这又是走了另外一个极端。我们真正的对待领导的行为主要有三点：


    +   1、抓大放小，不违背权力规律即可'
  merge: -1
  img_proc: true
- pgno: 161
  md: '学习权谋的初级阶段，不可能立即能够洞察领导的所有行为背后的含义，这时候我们就需要做好自己，先保证自己不犯错，再去追求如何做的最好。先不败而后求胜，毕竟领导也不可能无尽度的恶意解读下属的行为，或是小肚鸡肠到揉不进一点点的沙子。所以，只要我们不违背核心的权力规律即可。不犯原则性错误，就永远有机会。不被上级讨厌，就完成了职场立足的第一步。


    # 2、完成拼图，抓住领导的核心指标


    但是如果我们只满足于自己的不犯错，那么只是保住了工作而已。但是随着对权术的学习加深，我们就需要完成对领导的深度研究。俗话说，“办事不由东，累死也无功。”领导喜欢什么，讨厌什么，鼓励什么，追求什么，这些核心的指标都需要全面的掌握，这些领导的人性的喜好一旦明确，就好比我们熟悉了道路上的红绿灯，或是指示牌，就能顺利的行使在职场的大道上。


    # 3、提取规律，打造对领导的驾驭术


    我们熟悉领导的喜好数据，只是完成了适应职场环境而已，但是我们学习权谋不仅仅是为了适应，而是为了适应之后驾驭职场环境，当我们深度熟悉了领导的人性喜好之后，就好比掌握了领导的人性开关，我们能通过自己的语言行为，或是利用同事的语言行为，顺利的开启或是关闭领导的人性开关，这时候，其实就完成了对领导的驾驭，能够让他随着自己发出的信号而完成规定动作。


    对领导的驾驭可能很抽象，举个简单的例子，秦二世，最讨厌自己休息和寻欢的时候被人打扰。而赵高就故意引导丞相李斯这个时候来汇报工作，几次之后，秦二世，异常暴怒，赵高趁机进献谗言，为最后李斯的死，埋下伏笔。赵高就是掌握了秦二世的情绪开关，完成了对秦二世的驾驭，从而把秦二世的权力暗中窃取到手。所以我们在职场只要遵从上述的三步，就能游刃有余！'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 职场老黄牛怎么破局？


    【困惑】老师你好，公司领导觉得我做事认真，什么事情都交给我做，我该如何破局？


    【解析】这个问题很典型，每个积极的年轻人，都可能会遇见这个问题，我们是真的被重视，还是被利用，这个需要我们首先分清楚：


    # 1、首先看领导是不是给予相应利益


    在职场，我们是来赚钱的，为了获得更多生存机会，在上班时间，尽最大的可能获取更多的利益。所以，领导安排更多的工作，这个不太重要，核心是领导是不是给予更多的利益补偿。工资、待遇、晋升、机会，资源等，如果只让马儿跑，不让马吃草，这就是典型的在榨取你的剩余价值，这不是培养你，重视你，这是在把你当成职场老黄牛。所以，不能看领导嘴上说什么，而看他怎么回报！


    # 2、其次看具体工作能不能提升价值


    当然很多时候，我们不能太局限于回报，这样会让自己变得目光短浅和唯利是图，我们如果没有回报的情况下，要不要做更多的工作呢，这就要看工作的具体性质，如果这个工作具有挑战性，能不断的让自己从中学到东西，不断的增加自己的阅历和经验，这时候，工作本身获得的提升就是回报，而如果只是事务性的工作，只是在不断的重复还可能出现问题，这时候是要远离垃圾任务。


    # 3、最后看个人是不是适应工作强度


    但是这也不是说，我们只要精力旺盛，就可以无限度的工作，我们一定要有自己的主线，不断的提升自己的专业技能，让我们在未来的职场获得更多的机会和影响力。如果什么都干，到最后，成了职场万金油，什么都不精通，变得可有可无，这就得不偿失，要学会拒绝一定的工作，适当的放'
  merge: -1
  img_proc: true
- pgno: 163
  md: '慢自己的工作节奏，就不会越干越多，就能拿出精力让自己更多的思考和陪伴家人，毕竟工作不是人生全部。


    所以，我们一定要明确工作的作用，才能不迷失方向，工作就是为了利益，为了晋升，为了增加竞争力，为了获取领导信任，为了自己未来的路越走越宽，而不是为了工作而工作，或者走向了相反的路。所以，只要记住上述的三点，在职场工作起来就不会迷茫，也就学会了拒绝和选择！


    # 有能力有威望，但是不听话的下属如何处理？


    【困惑】老师，有个下属能力很强，威望也很高，但是不听话，我该如何处理？


    【解析】基本上asu有能力的人都有脾气，很难管理，如何驾驭这样的人，的确不是领导人包容他，所能简单处理的，因为不懂或是不屑于懂权力心思，所以这样的人，通常，要么怀才不遇，要么一路坎坷。


    作为领导对于这样的人通常是不能够开除的，原因有三点，一是，因为很多工作还需要这样的人去完成；第二，还可能引发连锁反应，让整体团队离心离德，更可能跑到对手阵营；第三，是显得自己小肚鸡肠缺乏管理智慧。所以通常领导对于这样的人，都有三大套路：


    1、限制


    对于这样有能力，而且不听话的下属，一定要限制他的工作范围，不能够让他有建功立业出成绩的机会，而且要限制他带团队或是接触更多人群，因为这样有能力的人，很快能做出成绩，获得威望，这接下来就很难处理，所以一开始就不应该给他自由发展的机会。


    2、闲职


    很多时候，通过限制，他们这类人 don''t 一定听话，还可能被人误解为，压制人才，所以这时候，就需要把他明升暗降，调到闲职上来，给他顾问的位'
  merge: -1
  img_proc: true
- pgno: 164
  md: '置、救火员的位置、或是分管后勤的位置，等等吧，让他远离发挥优势的位置，原理就是，龙游浅滩遭虾戏，哪壶不开提哪壶。


    # 3、闲置


    如果在闲职的位置上还是不安分，想做出成绩，或是伸手过长，这时候，就必须彻底的闲置起来，既然不归我所用，那我就不幽。直接冷冻，边缘化，让他坐冷板凳，一切安排都和他无关，让他成为最无用的人，逐步的让他无所事事，反正也就浪费一个工资，但是他浪费了人生。


    所以经过上述三大套路，基本上，这个人才就能够收服，如果还是不上道，要么他自己走人了，要么人生浪费了，所以，基本上，对于开除不了的人才，领导人通过这三大招，基本上就把人才给打废了。反过来说，人才的话，还是多学点权力心思，不然只能是个沉浮的人生，像夜壶一样，被用完就收起来了。


    # 老板用金钱激励下属，是最差的手段！


    【困惑】老师，我跟着你初学权谋，有个问题一直不明白，做领导就必须阴狠嘛？对员工多发点工资和关爱，员工不是更有归属感，更有战斗力吗？


    【解析】阴狠和友善都是手段，权谋家并不是单一的手段来管理组织的。任何的单一手段会被人所预测，从而被人在必经之路上设陷阱。你有这样的疑问很正常，我们分析下你就明白了：


    # 1、弱者带入，不去学习权力为什么这么做


    一看到老板或是上司的手段，立即就自行带入员工或是受害者的角度，爆发情绪，为什么大多数人，潜意识都会这么做呢？因为大家从来就没有站在权力角度或是管理阶层来思考过问题，就是个底层的思维逻辑和脑袋，拥有这样的弱者价值观，并且不自知。一个不具备权力思维的人，能爬的'
  merge: -1
  img_proc: true
- pgno: 165
  md: '上去？这就好比，自己是一只羊，眼里只能看到青草和狼的凶狠，从来就没想过，如何不做羊。


    # 2、物质激励，只对最底层和最初期时有用


    很多人有引用马云的话，员工的离开，要么是钱没给够，要么是心受委屈了，觉得好老板都会是这个样子。但是很多人还忽略了，马云的另外一句 话，那就是每年向社会输出
    1000 名十年以上的员工。为什么呢，就是这 些十年以上的人，金钱激励已经不起作用，而且更高价码对公司而言不值 得。有车有房了，再多的钱，也不会卖命。没有老板只用金钱去不断激励，
    因为，人的胃口和能力并不同步发展。


    # 3、系统稳定，基本上所有人才都是螺丝钉


    一个组织做大了，系统化了，其实就是一个去依赖人才的过程。公司发展 早期，人才决定生死，后期所有人都成了螺丝钉，那么不愿意做螺丝钉的 人，都必须除掉。所以人才别把自己看的太重要，尤其是在大平台，你的
    去留并不影响，组织的发展。如果一个组织，因为一两个人 才的变动，而 受到影响，只能说，老板的权谋没有到位，核心的技术自己没有掌握，组 织架构失败。


    # 4、职场跳槽，不能忍受委屈的只能是弱者


    很多人说，看不惯你们这些人，老子直接走人。没问题，现在人才流动这 么快，的确如此，但是考虑过两个问题吗？首先，现在的市场环境下，每 年大学毕业生那么多，工作好找吗？下个月的房贷和孩子奶粉钱怎么办？
    好工作都等着你？你有那么抢手？真的那么抢手，老板上司会这么对付 你？早就供养起来了。第二，新到一个公司，核心资源会立即给你？展示 能力也是个过程。换个公司没内斗？


    # 5、不懂权力，到任何地方都不会得到认可


    权谋网常说的，你不会游泳，你换个泳池，还是要溺水的。天下乌鸦一般 黑，哪里都不会没有竞争，哪里都不会莺歌燕舞。其实那些，试图找到一 个钱多事少离家近的工作，老板天天哄着，凡事争取你的意见，民主决策，'
  merge: -1
  img_proc: true
- pgno: 166
  md: '都是潜意识里把自己当成巨婴，这不是找老板，这是想把老板上司当成爹妈，天天照顾你生活，还要照顾你的情绪。这样的人，还以为自己很潮流，这都是被毒鸡汤害了。


    所以，经过上述的分析，我们能看出来，没有老板会把你当孩子照顾，你就是赚钱的工具，老实听话，还能分一杯羹。不听话，老板忍不了，就开除了。没有人对老板而言是不可或缺的。你去人才市场看看，多少人比你强，而且还不要太多工资。所以，即使你真的遇见好的老板，不干活还发钱多，这样的公司，竞争力何在，这样养出的是猪而不是狼，很快就关门大吉了，你最终还是要继续找工作。


    # 向老板提意见如何把握边界？


    【困惑】老板一般比较强势，有自己的想法，但是我想表达自己的意见，如何控制这个度？


    【解析】向领导表达自己的意见是个高收益、高风险的事情，因为乱表达，会带来权力反感，不表达，会错过机会。如何把握这个度呢，这就需要遵循下面三个原则：


    +   1、意见价值度


    很多人提意见，都是站在自己角度，把自己的想法和观点倾泻而出，毫不顾忌听者的感受，给人的感觉就是自私自利，想为自己争取利益和空间，让听的人，越听越不舒服。而实际上，给领导提意见，最重要的就是要给老板带来价值，解决困难、提醒风险、透漏信息、增加机会等等，没有人会拒绝有价值的意见。而这个意见必须是以老板的利益为出发点的，切记。


    +   2、领导耐受度


    提意见，必然会触及固有的观念，既得利益，多方关系，这就会让领导有个接受的过程，不可能一蹴而就，这就需要建立在对领导的研究之上，领'
  merge: -1
  img_proc: true
- pgno: 167
  md: '导对意见的接受程度、个人的文化程度、权力胸怀、背后利益纠葛、权力的稳定程度等等全面的了解，只有了解领导的信息越多，越能设计出针对性的方案，是一揽子计划，还是分步骤推进？是书面报告，还是口头汇报？切不可，猫不吃辣椒，硬往嘴里塞！


    # 3、两人关系度


    无论是职场还是社会，最忌讳的就是交浅言深，所以，提意见一定要看两个人的关系程度。如果关系好，即使意见一般，他也会认为你一片赤诚；如果关系很差，即使意见再好，他也会认为，你提意见就是在找茬闹事。关系一般，又不得不提意见的时候，最重要的是要把意见限定在自己的工作范围之内，自己权力范围之内，自己的专业能力之内，否则，都会被无限的解读和被猜忌。


    经过上述的分析，题主应该能够明白，既然领导是个强势的人，也就意味着很难接受下属的意见，如果不能建立在全面的研究之上，而必须突发性的提意见的话，那就掌握好谈话的时机，用当下发生的事情，引申开来，投石问路。一旦看到领导脸色不悦，或是情绪变化，一定要适可而止，点到为止，很多时候不是话术能解决问题的，是建立在关系、价值和时机上面的。


    # 官话、套话大家都不信，有什么用——打官腔背后的秘密！


    【困惑】老师，看了你写的很多职场话术，都是官话、套话，但是不解决问题啊，下属听到这些话，内心不是依然不舒服吗？


    【解析】官话、套话都是在长期的职场博弈中，形成的语言套路。这些话术都是职场前辈的血泪积累的结果，这些话术主要不是为了解决下属问题的，是为了自己权力安全的，这个最大的本质，大家一定要明确。官话、套话的主要作用有三个：'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 1、不去激发矛盾


    时代变了，年轻人接受平等教育，无视权威，衣食无忧，面对权力，不会忍气吞声，而且自媒体的高度发达，领导的一句话，可能就会火上浇油，被下属录音录像，传到网上，鱼死网破，尽管这些年轻人未来会受到更大的社会惩罚，但是作为领导没有必要为他陪葬啊。所以，讲官话，能够不激发矛盾，让下面的抓不住把柄，找不到攻击的漏洞。让下属拳头打在棉花包上，全身有力，无处使。


    # 2、推卸自身责任


    权力包含着利益，也包含着责任，而且很多时候，更多的表现的是责任，这时候，就要把话说得滴水不透，把自己的责任推卸的一干二净。不能让下属认为自己说了算，都是自己的主意，这样会把他的火力给吸引过来，要让他们明白，自己作为领导，已经完全的尽职尽力，已经完全的公开透明，至于为什么会出现这种情况，这个可能是集体的责任，可能是大众的误解，再或者意外，反正和自己无关。


    # 3、掩饰权力意志


    权力的很多意图，不可能直接说明，尤其是行使处罚的时候，更多的要考虑下属的自尊和接受能力，所以，很少就事论事，这个事情你犯错了，我不会找你毛病，而是通过其他的途径来收拾你，让你摸不到门道，不知道自己具体怎么了。这就需要，领导通过官话套话，来掩饰自己的意图。本来作为老员工应该提拔，但是领导会说，上级要求积极发展年轻人，你很棒但是不合条件，下次一定考虑。


    所以大家看明白了，官话、套话并不是为了解决下属问题的，而是回避问题的。官场真正解决问题的不是如何说，而是怎么做，为官之道就是如此，很多初任职位的人，没有城府，试图直言胸意，或是耍官威，最终都是会被下属嗤之以鼻，或是强硬对抗的，而权谋高手都是使用太极话术，让自己永远被对手抓不住把柄，立于不败之地。作为下属，可能会继续不满，但是你找不到攻击的点！'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 离职要不要给老总提提意见？


    【困惑】Q 老师，在一个企业做了三年多辞职了，离开之前想给企业老总钉钉上单独发条信息表达部门人员工作存在的问题和改进方法，本班组是后勤仓储班组，自己出发点是好的，一直思考要不要这么做，妥否？请老师指点迷津！


    【解析】可能很多即将离职的人，都有一大堆的心里话想说，而且更多的是不满，不过，会把自己的不满，包装成组织应当要改进的建议，表达出来。其实站在权谋角度毫无意义：


    # 1、对老总而言，你的话等于放屁


    洋洋洒洒写上几千字，你以为老总会看？首先，一个残酷的事实是，一个底层员工的生存或工作状态，基本不在老总的考虑之列。老总每天考虑的是把握战略方向，控制中层干部，攫取外部资源。老总没工夫看基层的唉叽。其次，作为最普通的员工，基本上位置局限、能力的局限、视野的局限，能够看到的东西有限，所以提出的意见也基本没有参考性。最后，即使真的底层员工能够提出点东西来，作为老总也清楚的很，一个企业能够有多少东西啊，那些存在的问题，他清楚的很。


    # 2、对自己而言，耗费精力没利益


    对于老总而言，没工夫看，没必要看，没兴趣看。所以，即使写出东西来，也是石沉大海。这对自己而言，是不是有好处呢，其实也没什么意义。首先，没有职业性，为什么遇见那么多的问题，当初不把自己想法和思考提出来呢？其次，没留好印象，走了还要把盖子揭开，让留下的人，不痛快不舒服，大家不会对你有好的印象，当下留一线，日后好见面。最后就是浪费时间，自己费精力写出的东西，不能给自己带来好处，老总不会额外发奖金或是提拔，有这时间，不如看看相声，抽支烟。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 3、对职场而言，带病生存是常态


    其实任何组织都是带病生存，哪个组织其实都是一地鸡毛。原因有三点：第一，组织是动态的，不断的出现各种状况，而这些状况都不可能有标准答案，也不可能都能够一次就做对，也就会有各种矛盾，毛病。第二，权力是刚性的，现在大家受到西方平等教育的多年熏陶，走向职场之后，却是等级分明的权力金字塔，必然对人自由度和表达是一种压抑，必然积累很多不满。最后领导是有喜好的，每个人都有自己的个人喜好，有喜好也就有偏见，自然不会一视同仁，分配不公，利益对立。


    经过上述的分析，我们能够看出来，离职的话，就分手，不出恶言，也无须什么建议，相忘于江湖即可。任何的言辞，都会让自己表现的十分幼稚，所以，离职，最重要的是，好好反思自己的成败得失，未来积极改进，能够在下一个赛道上取得好成绩，其他的，过去，就过去了！


    【附录】caobiying 网友留言：离职了还提建议意见，就是个幼稚的愤青！以为“众人皆醉我独醒”，其实“众人皆醒惟你蠢”。具体说一下这个案例，公司仓储部门存在问题，从本部门、到其它部门、到老板，都知道。为什么没解决呢？1.作为本部门内，有时候就是要让这些问题存在，这工作才会看起来很繁忙，才需要这么多人手，（表面忙其实在打混）这就是养寇自重。2.对于其它部门，仓库很混乱流程不规范，其它部门在领取、退换、借还及入仓物资时，就会更方便（可以乱来），有问题也容易蒙混过来，工作效率更高了。（你乱了我吃肉）这就是存在即是合理。3.对于高层及老板，他们关注的是全局，订单及每天产量是重点。仓库只是个辅助部门，只是配合生产出货的，再怎么乱，这物资也是在厂里，只要没流失到厂外，就没损失。所以对于你提的建议意见：老板根本不觉得是问题，其它部门也会找各种理由不配合，本部门也会反对，因为流程完善了，工作理顺了，就不需要那么多人在这打混啦。你看你，啥问题都没解决，啥好处都没得到，就是把所以人都得罪了！'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 想快速干出一番业绩，必须要求领导派出心腹监军！


    【困惑】老师，我刚跳槽到一家公司任部门经理，想做出点成绩，证明自己，但是老板派来的一个十几年的老员工，他没多大能力，还处处掣肘，向老板汇报几次了，没效果，请问如何能够除掉这个老员工？


    【解析】初任领导都想实现自己的抱负，干一番事业，但是空有一腔热血是没用的，凡事要讲究技巧和策略。首先要搞明白一个问题，一个十几年的老员工，没多大能力，为什么还能够掣肘你？其实他就是老板派过来的监军，人家没能力，还能待在职场这么久，必然是忠诚度获得老板的认可。所以，你现在的目的不是除掉监军的问题，是你没有完全取得权力信任的问题。想在别人手下做出一番成绩，必须遵从下面的三大步骤：


    1、解决权力信任问题


    任何地方想出成绩，第一步就是获得领导的信任。因为刚刚初任领导，完全就想做出一番事业，老板是很恐惧的，没有信任，就出成绩，拉出去单干怎么办，以后凭借成绩叫板怎么办？所以，有领导的信任，才会有领导的支持，有了领导的支持，才能获得更多的权限，才能做出更多更大的成绩。


    2、取得权力集中问题


    新人做领导，下属不服啊，你凭啥安排我们，你有什么能力和成绩？所以，最佳的集权方案，不是杀人立威，而是请求监军。主动申请，让领导派最信任的人过来监管。这样自己能够赢得权力的认同，也能和心腹建立很好的合作关系，更能利用他的权力影响力，完成自己狐假虎威的管理。


    3、做出成绩归功问题


    刚任领导不做出成绩，会被认为无能，但是如果做出成绩，不懂得归功与人，自己就会成为众矢之的，无形中就会得罪很多人。所以，请求监军之'
  merge: -1
  img_proc: true
- pgno: 172
  md: '后，把功劳归功监军，他本身没能力，这样就不会嫉妒，就能达成更深的同盟，自己未来会得到更多的权力。没有监军就归功做下属，接下来会更卖力。


    为什么归功别人，而不是自己独揽呢，因为这刚上位的领导，这次业绩，其实是个测试，主要测试三大问题：权力安全、个人能力、关系协调。所以，想做出成绩，一定要请监军过来，下属会很忌惮监军而听话，老板会因为监军而放心，监军会因为有成绩而不会说你坏话。即使出现问题，有监军做陪绑，他也会为自己辩解。所以，请心腹做监军，是快速立足职场干出事业的核心秘密。


    # 为什么好好干活的提拔最慢，因为你不知道领导的员工价值排序！


    【困惑】老师，为什么在职场好好干活的，恰恰提拔最慢，而那些溜须拍马，背后告密，送礼的人提拔最快的，领导都是怎么想的？


    【解析】兄弟，你错误的把学校学会的规则，放在了职场上，用错了地方。在学校，学生的成绩好，老师的奖金就很高，你是老师的产品。而职场上，你业绩好，上级不一定就会有好处，你只是他的下级而已。所以，任何时候，你的成绩只有和上级挂钩，对他有好处，他才会认可你。很多朋友，不懂得有功归上，还认为领导抢了自己的功劳，人家怎么会真心的帮助你，让你出成绩？所以，一定要知道领导的内心对员工的价值排序：


    +   1、维护权力安全的员工


    做领导的核心利益是什么，那就是权力安全，因为有了权力，对领导而言就拥有了资源，也就拥有了一切。所以对于威胁自己权力的，一概不会手软。任何时候，维护领导权力安全的，都会被领导当成最核心的下属，功大莫过于救主。所以对于权力安全告密的人，领导莫不重赏。


    +   2、解决当下难题的员工'
