  md: '在升迁的时候，被人家告了黑状，而且还被人家成功的截胡，这看起来是别人的阴暗无比，其实本质是对职场的资源竞争缺乏认知。一个人通过技术能够走向管理岗位，但没有权谋水平，不会走的更远。因为越往上走，资源越多，竞争越大，大家必然你死我活的斗争。在竞争早期，就必须提前分析谁是最强的对手，他有什么竞争优势，自己如何能够扳倒他。没有这种意识，基本上都会是失败者。公平竞争的永远都是形式，背后的套路才是核心，不懂权谋失败很正常。


    # 2、胜利者必然会继续打击政敌


    很多人都会有和题主一样的，这种想法，就是已经失败了，没有必要继续被抹黑吧，毕竟结果已经出来了。这种用道德角度来思考职场，显然是一种政治幼稚。因为别人通过手段上位，留着曾经的政敌在手下工作，必然如坐针毡，如果不能清除隐患，说不定就会死灰复燃，所以，胜利者都是必须继续打击，这样才能铲草除根，一劳永逸。没有人愿意给失败者蹈疚的机会，让他有可能二次崛起，因为这样的对手一旦翻身，会加倍报复。所以，胜利者必然继续打击失败者，直到逼他走。


    # 3、打击失败者是群众政治正确


    作为一个失败者，从上到下都排挤他，这是再正常不过了，因为，作为下面的员工，谁和失败者走得近，谁就是和现在的总经理作对，所以，大家必须和失败者划清界限，才能向总经理表达忠心。替领导打击政敌和反对者，这就是政治正确。作为失败者，也没有必要感觉到世态炎凉，认为这都是趋炎附势的小人，大家都是同事，利益所在，谁给好处，听谁的。如果他们作为小人物，去结交失败的人，必然也会被视为总经理的反对者，而遭到同样的打击，他们没必要陪葬。

    所以，失败了，走不了就夹着尾巴做人，不要寻思着报复了。等过去难关换个工作，趁着现在落寞的时候，多多的学点权谋，以免以后重蹈覆辙。结局有很多，有死局，有残局。而题主这个就是死局，面对死局认命就行了，做好反思，这才是重点，而不是无谓的报复。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 如何看待职场中的“一朝天子一朝臣”？


    【困惑】自己干的好好的，为什么换了领导，自己就不受待见，一朝天子一朝臣，真的是陋俗，老师你怎么看？


    【解析】这是个经典的职场问题，很多人不理解，是站在自己的角度，业务的角度，但是领导却站在权力的角度、安全的角度、稳定的角度来看待这个问题。


    1、权力的角度


    权力并不是位置，而是势力的代表。作为新的领导，必须有自己权力的支持者、追随者。而那些在原有位置上的人，属于既得利益者，新领导对他们没有恩，很难得到他们的忠心和认同。所以，新领导必须提拔失意派，这样才能把这些人打造成自己的利益联盟。接下来，才好控制和管理。


    2、安全的角度


    权力身上聚集着巨大的利益，而这些利益是每个人都想争取的。看着在位置上的领导风光无限，而实际上相当于坐在火山口，如果不把那些不真心认可自己的人换掉，很可能，在自己有困难、有错误或是不注意的时候，被人设绊子、搞难题、背后捅刀子，做领导的必须提前解决隐患。


    3、稳定的角度


    一个组织如何才能稳定，而不是一潭死水，就是要有适当的流动性，有些人上了位置之后，就很难下来。这对于下位的人而言，就没有了动力，没了希望，在组织内也就是混日子了。但是如果换了领导，失意派提拔上来，形成流动，这样那些没有被提拔的人会慫着劲聚集力量，等待机会。

    所以，一朝天子一朝臣，稳定了领导的权力基础和位置安全，也给僵化的组织带来更多的流动性。这样从组织角度和领导角度，都有好处。因此，'
  merge: -1
  img_proc: true
- pgno: 107
  md: '我们如果知道有这样的权力规律，就必须第一时间学会转换门厅，效忠新的领导，这样兴许还有新的机会。如果静观其变，基本没戏。


    # 想努力改变自己，为什么没多久就迷茫了？


    【困惑】老师，我想努力改变自己，给自己一个交代，但是为什么就迷茫了？您每天研究权谋是怎么坚持下去的？您迷茫过吗？求教！


    【解析】其实这个情况很普遍，任何人做事情，坚持一段时间之后都会产生困惑，自我怀疑。忽然不知道为什么来到这里，未来要走向哪里？这么坚持下去有什么意义？其实主要是三个原因自己没有搞清楚：


    1、总看不到回报


    人生路，开始出发的时候，都会有个宏大的目标，但是任何一个宏大的目标都不可能短时间实现。走了很久总看不到回报，尝不到甜头，总是泪水和汗水，这时候就会怀疑这个目标到底能不能实现，还要多久实现，可能自己怎么努力都实现不了，不如索性不干，如果不干，之前的付出就白费了，所以，第一种的迷茫就是对未来丧失了信心。其实有一个大致的方向即可，然后自己设置一个短时间的或是阶段性目标，实现之后给自己一个小小的奖励，让自己的内心感觉到，自己一直在接近目标，一步步的在实现的过程中。比如说，实现一个小目标之后给自己加个鸡腿。我给自己设置的目标就不大，坚持每天一篇يص文章，如果真的有事情，耽误了就第二天补上。完成每天的任务，就奖励自己刷刷抖音，听听音乐。如果一周都坚持下来了，就在周末找朋友喝一杯。不给自己太远的目标，就不会迷茫。


    2、因为人的惰性


    我们大多数都是普通人，都有自己的七情六欲，都会好逸恶劳，没有谁天生自律，不然也就不会有什么修行和外在的规矩了。因为趋利避害的人性，坚持一段时间之后，都会从生理和心理上自我松懈和倦怠。没有谁能完全'
  merge: -1
  img_proc: true
- pgno: 108
  md: '掌控自己的人性，所以这种人性中的弱点是第二种迷茫情况。如何克服我们生理心理这些人性上的惰性，消灭自己三分钟的热度？很多专家提供很多方案。不过大多都在想给自己设置最后期限啊，处罚啊，越是这样，越是让自己痛苦，越是痛苦，越是会让我们破罐破摔。其实，明白这是人性的一部分，就没有必要太过于对抗，有时好好休息一下，让自己没有负罪感，也不是坏事。要学会适当的放松，和自己妥协。我个人克服惰性的方法就是，养成习惯。到了这个时间点了，就要坐下来看书写文章。无论能否写出来，或是看不看得进去，都坐下来，哪怕装装样子。


    # 3、缺乏内在动力


    有了自己阶段性的目标，有了能够装装样子的过程，接来下，就要解决第三种迷茫了，那就是自己动力问题了，可以说坚持一个目标，会消耗自己大量的能量。如果缺乏内心的动力，很快就走不动了，就像汽车没有油一样。不少女孩子说要找个有上进心、有责任感的男人做伴侣，就是说的这个意思，一个有内心动力不断追求美好生活的人。其实动力都不是来源于奖励都是来自于痛苦，源自伴侣的压力，源自父母的期待，源自自己的出人头地的愿望。这些虚无的道德、责任和希望的压力都不会成为持久的动力。真正的动力，在于自己的投资和环境。比如那些花钱报咱们的权谋班，花了钱，不学就亏了，自然就有动力有了。看看群里其他人都在学习，有这种学习的氛围和环境，自己会受到感染，而不断的前进。所以大家要找到那些愿意和你一起奋斗的人互相激励，一群人能走的更远。


    所以，经过上述我们对产生迷茫的三大原因作出分析，并指出了相应的答案，大家自然就能够对号入座，只有搞清楚了真正的原因，才能让自己不再迷茫。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 开会拍马屁的艺术——权谋不是小聪明，是综合计算的结果！


    【困惑】老师，在网上看到一条职场经验，受到很多人追捧，但是总觉的有点问题，却说不上来，请指点“领导做报告，中途举手打断，说自己觉得这段太好了，没太听明白，请领导再说一下，自己记录一下。”


    【解析】权谋不是小聪明，而是综合计算的结果。这个段子貌似合理，但这是意淫出的虚假职场，表面拍马屁很到位，其实这里面有三个问题。


    首先，领导作报告，你直接打断，无论什么理由，这本身都是让领导讨厌的。任何人讲话，都很少照着稿件来念，都是自己按照主题随机演讲，忽然举手，一来会打断领导的思路，第二会延长既定的会议时间，最后可能领导无法立即忆刚说了什么，会很尴尬。


    其次，你有权力？你让领导再说一遍，领导就给你再说一遍？究竟你是领导，还是他是领导。如果领导按你的意图再说一遍，他什么面子？如果不按照你说的，直接拒绝你，又打击了你的积极性，所以，这时候举手打断领导讲话，自以为是的侵犯了领导的权力，而且还让领导左右为难。


    最后，你是什么职位和身份？你这么当众拍领导的马屁，这么赤裸裸，你想过你顶头上司的感受吗？你想过其他同事的感受吗？如果自己和讲话的领导之间还有领导层，那么拍马屁的举动就是越级，如果和讲话领导之间就是上下级，这个举动，就是得罪同事，当众树敌。


    所以，这个看似聪明的职场段子，其实漏洞百出。我们开会的时候如何不动声色的拍领导马屁呢？开会不是觉得领导说的精彩了，让他再说一遍记录下来。而是一开始开会就该拿个会议记录本，领导在上面讲，自己就要在下面记录，对于领导讲的好的时候，一定要时不时的在记录的空档和领导目光对视，投射
    niewa 的崇拜的眼神，频频点头。如果领导自己讲话觉得精彩，提高嗓门并停顿的时候，要学会鼓掌。和古代看戏一样，何时鼓掌，'
  merge: -1
  img_proc: true
- pgno: 110
  md: '何时叫好，如何和领导互动，这是一门专门的艺术。权谋技巧不仅仅是只从自己出发的雕虫小技，而是要顾及场合、、领导心理、同事竞争等诸多因素。


    # 一个人优秀成长的过程就是被孤立的过程！


    【困惑】老大好，我在处室里，通过巴结领导，领导有些事情，愿意交给我去办。但是这就引起了其他同事的关注，她们开始有意无意的联合起来孤立我。我不知道如果巴结领导，发展壮大，被别人围剿，应该怎么做？我老感觉，处室里有一些人，暗地里老是引导大家把我当靶子，我老是大家集体打击的对象，这样的情况，应该怎么应对？请老大百忙之中给我一点指点和开示，谢谢老大。


    【解析】这种现象在职场非常常见，一个人变得优秀必然会鹤立鸡群，优秀的人和普通人的价值观和工作态度，差距会越来越大。其实不用担心被孤立，未来的你，需要的不是弱者的联合，而是强者的支持。被当成靶子？一万个鸡蛋也打不败一块石头！面对具体的现实，要做出三方面的调整：


    +   1、心态上


    木秀于林风必摧之，人都是这样，看到别人比自己优秀，有前途，自然在心理上嫉妒，语言上冷嘲热讽，行为上排斥孤立，这都是正常的，因为一个人越是优秀，越不需要朋友，他们哪有时间和一群底层谈感情，优秀的人需要的是合作伙伴，把精力都用在自己的能力提升和资源拓展上。记住只有弱者才需要朋友，牛羊才需要群居。


    +   2、权力上


    巴结领导是一门艺术，要讲究策略，手段和形式都要研究。能私下巴结，就绝不公开。能够暗中讨好，就不明着献媚。为什么这么做呢，因为很多领导对权力规律不熟悉，受到学校教材影响，认为巴结讨好的都是小人，'
  merge: -1
  img_proc: true
- pgno: 111
  md: '内心会反感和排斥，所以，我们要明白领导，了无痕迹的迎合，在同事面前又要注意掩饰，把握好平衡，才能游刃有余。


    # 3、手段上


    权谋主要就是权力和谋略两大部分，服务好权力的同时，还必须在手段上能够解决这些针对自己的人。首先要区分哪些是跟风的，哪些是敌对的。其次，对于那些真正敌对的同事，要不断的收集他的错误、把柄和与其他人的矛盾。最后，要利用自己和权力关系亲近的机会，煽风点火，挑拨离间，让这些人穿小鞋吃苦头，要学会借势收拾这些不听话的人。职场就是这样，大家都反抗强者，但是又不得不屈服。底层资源有限，自然的形成了人踩人的心理习惯，所以，只有不断的提升自身价值和权力的关系，才能快速的摆脱底层，只要自己拥有了权力，那些背后嫉妒、反对的声音就自然消失了。一个强者是不需要情感慰藉的，他需要的是资源合作，自己有压力，也是需要自己独自扛过去的。做好自己，真正强大了，所有关系就都顺了。


    # 如何对付不听话的下属？


    【困惑】老师，我刚做领导，有几个下属不听指挥，该如何处理不听话的下属？


    【解析】对付那些不听话的下属，这可以说是做领导的第一关，只有过了这一关，才算是真正的领导。历史上很多管理专家都对这个问题研究过，把不听话的下属分成很多类，有才华类、有背景类、丧失前景类、无知无畏类等等，并设计了不同的方案，其实权谋家对付这类不听话的人，没有那么复杂。如果不能直接开除、降薪，这些硬性手段，只能有如下三种权术手段：


    +   1、上策边缘化'
  merge: -1
  img_proc: true
- pgno: 112
  md: '为什么上策是边缘化呢，因为凡是能够成为刺头的，并不是一天两天了，而且自己刚上位，权力不集中，成绩没出来，关系不稳定，就贸然的对这类刺头开展斗争，这时候其实就选错了自己的战略方向，刚上位，首要任务是稳定自己的地位。对这些刺头，只要不是特别过分，直接无视即可。总有人上来投靠自己，先提拔失意派，或是投诚派，先让自己做起来再说，这是固权的根本。


    # 2、中策挑矛盾


    但是如果总有些刺头，非得跳出来找事，这时候，我们就不能够再忍着了，必须出手。但是做领导最忌讳自己下场做运动员，最佳的状态就是做裁判。只有挑动刺头员工和别人的矛盾，下属间有矛盾了，领导的作用就出来了。这叫做借刀杀人，给刺头树敌。比如安排工作的时候，让另一个人监督管理这个不听话下属。这个不听话的下属，自然也不会听这个人的监督，他们之间必然产生矛盾。


    # 3、下策抓把柄


    如果在职场这样的刺头，谁都不敢惹，能量大的很，怎么办？可以说诸葛亮就遇见了这样的难题，诸葛亮刚做军师，就遇见了强势且不听话的关羽，于是利用关羽人性的弱点，设计了华容道这个计谋，事前让关羽主动立下军令状不会放过曹操，从而接下来关羽违背了承诺，诸葛亮抓住了他的把柄，让他老实听话。任何人都有把柄，这个需要耐心的找，或是挖坑引诱他跳，总能抓住。至于很多人说，那种穿小鞋啊，工作刁难啊，这个实属下下策。这是直接计划自己和刺头的矛盾，而且这种非理性的人，会做出什么举动很难说，我们做领导，尤其是新任领导，最佳策略就是先回避矛盾，或是挑动他与别人的矛盾，而不是自己跳下去和他打。切记。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# 一篇说透，让刚毕业的大学生不再迷茫！


    【困惑】老师，我刚毕业感觉到了生活的残忍，扑面而来的就是各种选择和压力，留在上学的城市？回到家乡？还是去北上广，考编制还是创业。去大公司还是去小公司？听从家里的安排还是追求自己的梦想，很迷茫？


    【解析】每一年 的毕业季，对于即将迈入社会的大学生来说，都是人生中最为迷茫的阶段，一系列的选择都决定着未来的命运走向，很多人的家长不知道，自己不清楚，道听途说，被人忽悠，就贸然的做出决定，最终导致遗憾。是听从家里的安排还是追求梦想？梦想是个奢侈品，要扪心自问，你拿什么追求，就凭你一腔热血？下个月交不上房租，立即就得回老家！除非你父母为你打造好一切，先拿一大笔钱让你练手，这个另当别论。99%
    普通人，一个人走向社会，首先要面临的就是如何独立的生存，一切的选择都应该从这个原点出发。


    # 1、考编制还是去创业？


    年轻人刚走向社会，除了的手里的文凭和过剩的精力之外，基本上没有任何资源。而且刚走向社会之后，首要解决的就是自己的房子，婚姻还有孩子，还有各种同学朋友要送礼。所以，一开始有一个稳定的工作，比什么都重要。能够考上编制，尽可能的去考编制。这样找女朋友结婚，这个有编制的身份，是能够获得丈母娘的好感的，而且自己能够快速的稳定下来，借助单位的优势来打造自己的关系网。如果自己有创业梦想，可以通过业余时间不断的积累资源，积累社会的经验，有个十年左右，就能够出来创业，大概率的提升创业成功率。而如果一开始就拿着家里的钱，自己没有什么社会经验，就贸然的创业，直接和社会上那些老江湖，大资本，直接比拼，人家可不会心慈手软，说不定就直接让人割了韭菜。创业的成功率很低，这时候别说实现梦想了，2
    年看不到希望，女朋友都跑了。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 2、去大公司还是小公司？


    去大公司还是小公司，这个貌似你可以选择一样？那些大公司，都是校园直聘的，即使不是校园招聘，大公司也是要求名校出身。大平台能进去，当然比什么都好，毕竟这样能让自己稳定下来，大公司有正规的各种待遇和晋升空间。尽管大公司的政治环境复杂，高手如云，但是混一口饭吃，还是难度不大的，如果再精通权谋，实现快速进阶也是不难实现的。但是大公司的机会比较少，80%的芸芸众生是要到不正规的中小公司的，这样的公司，人少，老板压榨厉害，主要看能力，为公司实现利润的能力，而且如果不是三年以上的公司，基本上，随时都有倒闭的可能，最好不要加入那些只会喊口号的初创公司，除非老板有既有的资源转化，不然，只能到市场上Say拼刺刀的话，基本上，废了。这类初创公司，也不可能开得了高工资，大多数都是忽悠年轻人，用看不见的理想、股份和头衔来留住人。


    # 3、回家乡，还是去大城市？


    回家乡还是去大城市？这个很多年轻人，在媒体上是接触不到真实的社会 的。不要认为小城市就会把大学生当成香饽饽，那是以前，现在哪里人才都过剩，没有关系介绍，基本上回来就只能自己开店，因为小地方可供选择的机会不多，进单位，没关系，基本上面试就下去了。如果你回到家乡自己有各种政商资源，还是尽可能的回来，人生做事，千万不要从零开始，一定要站在别人的肩膀上，其实现在互联网时代，在哪里都能赚到全国人的钱。而如果自己就是农村出来，除了没有交养老保险的父母，家里什么都没有，这样的话，还是去大城市吧，反正都是从零开始，不如找个资源、机会多的地方。不过还是建议回到自己的省会城市，离家里近，父母老了，有个特殊情况能及时的赶回来。现在省会城市的房价还不是太高，还能够努力买得起房子，如果去北上广，大概率买不起房子，父母老了怎么办？所以，作为过来人，给这些学弟学妹们，说一句，先生存，后梦想。能去大公司，就别被初创公司忽悠了。以北上广现在的房价，可能年轻人要两代人，才能拼杀进去了。要考虑几个因素：自身的资源、父母的身体、以'
  merge: -1
  img_proc: true
- pgno: 115
  md: '及生存的成本、失败的风险。明白了这些，再听听家里人的意见，就基本上能够做出正确的选择了。


    # 曾仕强老师为什么说“领导不会提拔守规矩的下属”？


    【困惑】老师你好，前一段时间看了曾仕强老师的一段讲座，他说做领导的不会提拔守规矩的下属，没有说原因，只是简单解释，守规矩的下属不会变通，而不会变通的人无法做领导。查遍曾老师中国式管理的所有书籍，也没有找到如何才是变通，在哪里变通。这背后究竟是什么原因？请权谋网
    Q 帝老师解惑。


    【解析】曾仕强老师是中国式管理的创始人，所说的中国式管理，其实内核就是权谋管理，只不过，公开传播，不能讲得太透，从权谋角度而言，守规矩的人的确只适合做底层，如果想提拔上来做中层，必须知道如下三点变通：


    +   1、明白领导嘴上说的和心里想的不一致


    自古以来中国人都是“满嘴的仁义道德，一肚子的男盗女娼”，嘴上说的和心里想的并不一致。尤其是领导，表面上都是高大上，其实内心对自己的利益非常的计较。比如，领导开会时候说，大家可以对组织和领导的工作可提出批评意见，畅所欲言。如果你真的守规矩，提出一大堆的批评意见，尽管领导会议上会表现出虚怀若谷，胸怀大度，但是会后不会太久，就会把这种人调离开。一个只懂原则，不懂领导内心，不会变通的人，不会被提拔上来，即使提拔上来，很快也会下去。


    +   2、明白领导个人利益和组织利益不一致


    组织的利益和领导个人的利益，很多时候并不一致。尤其是上级领导也是打工仔的时候，组织利益和领导个人利益冲突的时候就特别的多，特别的明显。比如领导安排下属做一点私事，但是如果员工守规矩，公事公办，'
  merge: -1
  img_proc: true
- pgno: 116
  md: '必须按原则办，这时候，领导嘴上不说，但是内心绝对会狠狠的记上一笔，这种公事公办的人，领导怎么可能会提拔？你遵守规矩维护组织的利益，你和领导对着干？领导怎么可能会提拔你？所以，对于那些守规矩的人，不会兼顾领导利益的人，不会被提拔。


    # 3、明白中层管理的利益和底层并不一致


    很多人 在底层被提拔上来，自己没有及时的转变身份立即把自己的心态调整成管理层，而是依旧带着底层的心态和思维来展开工作，不认为自己是管理层的一部分，而是成了底层利益的代言人。处处拿着劳动法和领导层其他人意见冲突，比如说加班，坚持要求加班费，维护员工利益。其实这就是死板不知变通，高手都是在底层和中层做出协调和兼顾。而如果死板的执行法律条文，那么工作就无法开展。前一段华为的人力资源部胡玲就是维护底层三万多开发的工程师兄弟，而被迫辞职的。

    组织关系就是如此，越是往上走，越是要善于处理上述的不一致，而这些不一致，很多时候，是需要变通和兼顾的，只维护组织利益，会让领导反感，只维护领导利益，很可能会走向犯罪，如何在各种错综复杂的利益和阶层间的平衡，这个不是坚持规则就能完成的，这需要变通和智慧，所以曾仕强老师说，守规矩的人只适合做底层，经过权谋网的分析，我们明白，只有在这三大关系的处理上，做好变通，才能够做好一个中层，才能够被提拔上来！


    # 讨好领导，要自然而然，最忌刻意的硬来！


    【困惑】老大，我们单位中午有一个固定的外卖，疫情期间，只给送到大门口，一开始大家都订，处长副处长会让处里一个非事业编帮她带回来，有时候也会叫我，我也做得比较积极。后来大家就都不订这个外卖了，只有两位处长坚持在订。有段时间，不管我订不订这个外卖，我都去帮两'
  merge: -1
  img_proc: true
- pgno: 117
  md: '位处长取回来。我呢，中午实际上是不在单位休息的，给领导取饭肯定要再回来一趟。这样，大家其实都看得到我的这个举动。今天，我给两位处长领饭送回来的时候，副处长就说，以后你没有订饭的话，不用单独再跑一趟了。我自己的感觉是，其实挺尴尬的，因为这种行为，大家都看在眼里，背后肯定会zeni论我溜须拍马、媚上之类的，而且，我感觉我这种媚上，也太明显了，没有做到咱们群里说的韬晦。但是，另一方面，我觉得这是给领导办私事，感觉应该对我是個好事。我不知道应该怎么看待这个问题好。还有就是，我不清楚领导的真实心思，是愿意有个领饭的，还是觉得私下里大家议论纷纷，觉得显得自己比较官僚，不喜欢我再去拿饭了。或者是觉得不想欠我这种可有可无的人情。老大，您能跟我说说吗？


    【解析】我们讨好领导最怕的就是太刻意，会引发众人的不适感，和背后的指指点点，让领导有压力，让自己也背负巨大压力。讨好领导要懂得三点：


    首先呢，和领导这种接触机会不需要太刻意，你隔三差五订餐吃，并不一定非得是每顿都不吃，专门去送，这样太刻意。讨好领导要自然而然，有机会利用机会，没有机会创造机会，最忌讳霸王硬上弓，为了讨好而讨好。其次，你太刻意做这些事，让领导会形成很大的压力，做这件事回报你还是不回报你，回报你这件事太小，不回报你又觉得你在付出。还有一个就是你说的，领导为了这件小事，搞的很官僚，让领导形象受损，也不是好事。


    最后就是吃相要好，讨好的事不在于这种小事儿，方方面面。抓住主要矛盾，为领导服务尽可能的多，但是并不是要事无巨细，面面俱到，这个不仅仅是精力的問題，重要的还有舆论的问题，所以，要为领导最核心利益的地方努力。


    最后，要指出的是，你对韬晦有错误的认知，韬晦，是在弱小的时候，不表现出自己能力和野心，避免过早的暴露，成为别人眼里的潜敌，被除掉。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '韬晦不是不做任何工作，完全的不展现，作为弱者，如果什么都不表现，怎么能够脱颖而出。有强大的敌人，才需要韬晦。


    # 搞技术的升职做管理该如何下手？


    【困惑】老师，我是程序员，因为常看咱们的公众号，赢得了领导的信任，最近提拔成项目组长，但是自己从来没有管理过团队，自己搞的很累，看过几本管理的书，全然摸不到头绪，该如何做？


    【解析】从面对程序到面对人，这确实是一个人的巨大转变，技术部门管理本身不难，分解任务，抓住进度，等等。这里面主要的是要做好三个转变：


    +   1、从研究事物到琢磨人心


    对于事物的研究通常都是确定的，而对人心的研究，就会短时间摸不到头脑，变量太多，伪装太甚，很多时候看到的都是假象。所以，这个就要不断的琢磨人，人的利益、恐惧、希望、能力以及他的弱点、把柄、性格、背景等因素下手。只有对人建立全面的大数据，才能够轻松驾驭。因为管理和打仗一样，知己知彼，方能百战百胜。


    +   2、从完美主义到缺陷包容


    搞技术是不允许犯错的，基本上技术人员都是性格上的完美主义，但是管理却不能这么做，因为没有完美的人，每个人都有自己不同的特点，这时候，我们就要允许别人犯错，对他们非主要的缺陷予以宽容。很多技术员提升的管理，看别人做工作不认真，直接就接替过去自己做了，这样搞的自己很累，员工倒是闲着，信不过下属，做管理也就解脱不了自己。


    +   3、从称兄道弟到明确等级


    很多人从小到大，大家跟别人相处的模式就是同学模式，到了公司就是同事模式，这些关系都是建立在个人好恶以及性格的平等的基础之上的。但'
  merge: -1
  img_proc: true
- pgno: 119
  md: '是成为管理之后，就要逐步的适应上下级的互动模式，如果依然和下属保持感情链接，这样一来很难树立起权威，没有权威，就无法有效的管理；二来，管理的时候掺杂感情，会丧失客观，所以，要学会调整身份。当官很多时候是黑脸，华竟，很多任务的分配和执行，不可能照顾到所有人的利益和情绪，很多没有当领导的人，都幻想着什么依靠威信，以理服人，这基本上会让自己搞的里外不是人，谁的利益都照顾不到，惹得怨声载道。最简单的做法就是谁听话，给谁好处。而不是谁不听话，表现出惹不起。不然，听话的没好处，而不听话的都清闲，这领导基本上废了。


    # 关系经营是个长期工作，依赖两瓶茅台是解决不了问题的！


    【困惑】老大，听了你的课程，懂得了想升迁是要跑关系的，我们公司下个月有个新项目，我想找领导活动下，看看能不能得到这个项目主管的问题，你看送两瓶茅台合适吗？


    【解析】兄弟，两瓶茅台，先姑且不说能不能买的到的问题，就是有货，正品 5000 多元，你拿两瓶茅台就想换取项目主管？难免太过于幼稚，运作关系要明白三大关键点：


    1、对价问题


    项目主管这样的关键位置，有多少人争夺？这里面能够有多少的潜在利益？5000 元换一个位置，是不是对价合适？很多人会问，一个位置是长期利益，怎么算对价？对的，没法算，所以大家搞关系都是在平时，在平时顺从权力心思，加强彼此的感情信任，有了感情都好办。跑关系，若没有平时的感情关系，就必须要支付巨大的对价。


    2、能力问题


    中国和西方不一样，西方是个个人负责制度，而中国是连带关系制度，谁提拔重用的人，这背后就会被人天然的认为是一个派系的，如果提拔的人，'
  merge: -1
  img_proc: true
- pgno: 120
  md: '工作能力有限，或是不能够顺利的完成任务，不仅仅自身会被否认和追责，更重要的是，提拔他的领导，会被认为识人无术，领导能力这个问题，会被竞争对手拿来做文章。所以，领导不仅看自己有没有好处，还要看这个下属，能不能胜任职位。


    # 3、安全问题


    你一个平时离领导十万八千里，除了工作一点其他的联系都没有，忽然间提着茅台酒就送过去，领导敢收？没有人不喜欢利益，但是都怕带刺的鱼钩。贸然的收礼物，人家害怕你设局举报呢。尤其是平时没关系，这时候送过来，一看就是有明确的目的，此时收了，如果运作不成，会不会报复？如果运作成，会不会口风不严，到处散播？领导收礼物，没有一个信任的试探过程，基本不会收。


    所以，权谋网一直都提倡对领导要有 20 万字的具体研究，然后投其所好，不断的培养信任关系，功夫在平时，这才是正道。而如果仅仅在升迁出现职位的时候，提两瓶酒过去，基本上会被拒之门外。更有甚者，还可能借此把你推出去，打成错误典型。其实职场的真相是，当机会出现时，其实早就内定了，外围知道信息时，基本上只是走个过场了。关系构建，功夫在平时！


    # 工作越优秀，越得不到升职加薪原因何在，鞭打快牛该如何破解？


    【困惑】老师，最近工作的心力交瘁，不知该如何摆脱这种困境。我的职位是部门主管，手上的项目要么是自己研发带头做起来的，要么就是老板直接派发的。最近一年里手上的项目很多，还是并行走的那种，每天加班加点完成。做都做不完了，老板还会时不时加项目工作给我做。有向老板反映说工作量太大，但老板说现在也只有你能做，别人又做不了(每次都是这句话。我是该高兴还是悲伤！)做两三个项目，我基本没什么问题。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '但同时 5、6 个，我的小心脏就很奔溃了。工资也不高，太累了，感觉都干不动了。有时想辞职，又有些不甘心，也很舍不得。怎么办？


    【解析】题主的求助，这是一个经典的“鞭打快牛”的管理学问题。什么是鞭打快牛？先看看这个寓言故事：一位农夫有一头水牛和一头黄牛。农夫拉着两头牛犁田，他先给黄牛套上犁枷，但黄牛任凭他怎么啖喝就是不走，折腾半天没犁了几路田。无奈之下，农夫换上水牛，水牛不用啖喝就主动拉着犁往前走，但农夫还是不断地鞭打水牛。水牛很是不解，就停下来问：“主人，我已经尽心尽力地帮你拉犁了，怎么还老是打我？”农夫说：“黄牛不拉，只有你拉，不打得你跑快些，什么时候才能犁完田？少废话，快走！”说罢又是一鞭。多次挨鞭子的水牛想：自己跑得越快，犁的田越多，被鞭打的机会就越多，而黄牛却在旁边悠哉游哉地吃草，真不公平！最终，它挣脱犁枷跑了。


    破解鞭打快牛的现象，我们必须从本质上下手分析，才能够知道答案。


    # 1、牛


    如果你是牛，你就无法摆脱干活的命运。很多人和题主一样，每天的精力都在做事、做项目上，如何的提升自己的权力和收入反而不是很用心，对升迁很佛系，以为自己工作做好了，就会自动升职加薪，而实际上恰恰相反，自己一定被锁定在做事的层面，无法摆脱，而且工作越干越多。所以，破解自己身心俱疲的状态就要转变思路，不断的提升自己的位置，摆脱具体的事务。彻底摆脱牛的身份，这才行。


    # 2、快


    干得越快，干得越好，自然任务会越来越多，做老板的不会让你闲着，毕竟开的是工资，购买的是劳动时间。谁都想在单位时间内，让员工创造更多的利润。所以，接受工作的时候，要学会控制工作的节奏，把任务控制在让老板认为你时间已经占满，而实际你自己能够空出大把时间的状态。职场要学会表演，不要快，而要让领导觉得你的时间已经被占满。且工作越是优秀，老板越是不会让其他人替你做。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 3、鞭打


    为什么面对快牛，做老板的不是去激励，给与升职加薪，而是不断的鞭打呢？你工作这么好，你升职了，谁来接替你做这个工作，别人无法替代你啊，所以不能升职。加薪呢，更不行了，超出这个职位的工资太多，直接影响上司的心情，以及同事的心情，会搞乱公司薪酬制度。对于优秀的员工，还有更加阴暗的权力心思，给你权力，你又这么优秀，还有高工资的积累，你拉出去单干怎么办？只能敲打。


    明白了产生问题的根本原因之后，我们就会明白，题主的问题所在了，具体的该怎么破解呢，只能以退为进，暂时请病假，让领导不得不把任务分解出去，由别人担任，这时候自己再回来，只做重要的事情。如果领导不分解，依然如此，就换个工作吧。有些领导就是周扒皮，天天搞半夜鸡叫，谁也没办法。但是还没有出现鞭打快牛的职场人，尽量要展示自己的管理能力，协调大家做事，给组织带来利益。因为领导知道，管理能力强，只有给更高的权力，才能带来更大的利益，所以会不断的升职。而如果只表现自己的个人工作能力，这就会被工作锁定，没人替代，只能原地不动。不然你走了谁干活？


    # 初创企业的老板正确的挖人步骤！


    【困惑】老大，您好，有个事情想请教下您，我现在在做创业做教育培训机构初期，想请一位亲戚来帮我，他之前做保险，在省里也小有名气，因为身体原因退休了好几年，现在想重新工作，我和周另外一家公司都邀请他。听说他纠结的好几天睡不着觉，昨天晚上我应该操之过急了，主动发消息去问他，被他告知觉得我这里不适合他。我反思我应该是犯了逼人二选一的错误，我在想现在正确的做法，是不是应该有事没事就去拜访他，'
  merge: -1
  img_proc: true
- pgno: 123
  md: '慢慢的让他参与进我这里的事物，时间久了他就愿意过来了。老大您看我这样的思路对吗？


    【解析】二十一世纪最贵的就是人才，做企业，尤其是创业初期，那些带有资源的人才，可以说更加的求之不得，不是摆个招聘桌，或是几个电话能搞定的。给多的钱，初创企业拿不出，所以更多的是除了一定的待遇之外，还要让人才感到情感尊重和看到前景。作为初创老板，挖人通常而言，是三大步骤：

    1、先要上门请教

    那些带有资源和经验的人才，身上必然有我们要学的太多东西，如果直接让人家过来工作，人家不一定看的上小平台，或是不看好前景。这时候作为初创公司的老板，就要先提礼物上门，请教问题，让人才得到一定程度的尊重，这样能够在最初期建立一定的情感链接。

    2、接着聘为顾问

    和这种重量级人才建立起情感链接之后，就要试着让人才兼职做顾问，因为这种人才，不愿意屈尊在一家小公司打工，但是如果作为顾问，做个兼职，不用按时打卡上下班，进一步让人才，进行工作接触。所以，力邀人才做自己的顾问，能够让他们参与进来，看到利益和前景。

    3、最后邀请加盟

    在不断的工作中，有了尊重的情感链接，让他参与进来看到了发展和前途，这时候，再力邀他们加盟，成为高管或是副总。这样人才就能够顺利的接受邀请，参与公司的日常事务。这些重量级人才的加入会紧紧带来资源和经验，还有他们的名气和人脉，初创企业的事业必然兴起。

    所以，我们作为创业初期的老板，一定要把挖人作为自己的工作重点，只有找到本地区的顶级人才，才能够很快的转化他们的资源站住脚。避免相应的错误，加速自身的成长。而如果作为老板们随随便便的在人才市场找几个人，必然盲人骑瞎马，夜半临深池，成功概率极低，非常的危险。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 和实权领导关系不错，如何转化资源？


    【困惑】老师，听了你的课，知道资源是第一位的，我现在一个远房的表亲是大企业的实权领导，我该如何利用这段关系？


    【解析】走向社会之后，大家都会明白，能力不是第一位的，资源才是。拥有资源就能够转化为自己想要的东西。所以，围绕资源，开展行动，是权谋家的日常活动。但是我们转化资源的第一步，接近资源。明知道我们有关系在那里放着，却不知道如何下手，通常而言都是三种策略：


    +   1、高级阶段，利益同盟


    每个拥有资源的人，都不像我们想象的那样，冰清玉洁，不食人间烟火。基本上都是满口的仁义道德，一肚子的男盗女娼。不过，这些资源拥有者，身边围绕着大量的依附食利群体，外围的很难挤进来。挤不进来的人，基本上不会得到任何转化资源的机会。所以权谋家通常采用一切手段，来获取资源的信任，让他觉得，利益大，很安全，这样才能深度的合作。很多时候，这种深度合作的关系，都不是简单的短时间公关能够达到的。基本上都是一起成长起来的，互相知根知底的人。比如胡雪岩，并不是王有龄当上大官才认识的，而是在王有龄是普通人的时候，胡雪岩就提前投资经营关系了。


    +   2、中级阶段，牵线搭桥


    实权领导所拥有的权力和资源，很多时候，并不是一个职位所能定位的。这时候，我们就要深刻研究，这个领导到底有多少权力能随意支配，有多少资源能够单独驾驭，有多少人脉能够轻松调动。明白了这些，我们作为资源依附者，就能够知道我们和实权关系能够合作到什么程度。这时候，我们因为无法在核心层，只能做些权力揽客的生意。替那些需要权力审批，资源倾斜和人脉疏通的人，提供帮助。让需要代跑关系的人，出费用。这'
  merge: -1
  img_proc: true
- pgno: 125
  md: '就是我们作为权力中介，牵线搭桥，从中获取差价，或是代办各种手续，获取利益。这种可以说社会上最常见，医院代为挂号的黄牛，就是这种关系的常态化。


    # 3、初级阶段，狐假虎威


    很多人的确认识领导，也有一定关系，但是这些关系走动非常的弱，基本上也办不成什么事情，可能因为不够感情信任，可能因为没钱投资关系，也可能人品、能力不被资源拥有者认可，无论什么原因，实权领导并不为其所用，这样的人，在最早期的時候，通常采用狐假虎威的策略，对外宣传自己和领导关系多么的铁，走动多么的近。这样就能够骗取到一些个急病乱投医的需要运作关系的人。以前都是骗吃骗喝，现在也能够拿到不少的信息费。主动成为运作关系需要的人的间谍和跑腿的这类人，运作关系，基本上不能够影响权力利益，只能赚取信息费，比如打扫卫生的阿姨汇报领导行踪的运作。


    上述的高级、中级、初级其实就是关系的远近，高级的就是在核心区，中级的就是在周边区，初级的就是外围区，这里面衡量的标准就是权力信任的深度和广度。我们明白了这些，就能选择我们运作关系的手段了，作为题主，自己需要衡量自己和权力所在的阶段，然后做出相应的行动就行了。


    # “主人翁意识”和“不在其位不谋其政”冲突吗？


    【困惑】老师，公司宣传主人翁意识，又在强调不在其位不谋其政，这个思想在管理中冲突吗？具体该怎么操作。


    【解析】管理思想和手段从来都不是从一而终的，都是随着外部条件，内部的结构而不断变化的。管理界经常说的那句话，如果你是只锤子，眼里就会有钉子。所以，我们真正搞管理就是不用一种管理思想去套，而是要学会具体问题具体分析。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '而主人公意识和不在其位不谋其政冲突吗？这个不是简单的冲突或是不冲突，不是简单黑白对错来衡量的。要分为三种情况：


    # 1、组织阶段问题：创业阶段和守成阶段


    一个组织在创业阶段，人少业务多，分工不明确，工作量不好衡量，每个人都要承担大量的工作，而且是谁有空，就直接顶上去，所以说，这个阶段没有位置不位置的问题，只能强调主人翁意识，来调动大家的能量。但是到了守成阶段，每个人都有自己固定的工作，就不能互相插手了，不然之后出现问题，权责不清，无法追责，不能行使有效的管理，只能强调，不在其位，不谋其政。


    # 2、业务角色问题：个人职务和相关工作


    每个人都有自己的个人职务，负责具体的某一块业务。通常而言，工作手册，只有岗位描述，因为谁也不能够细化所有具体的工作，这就需要强调主人翁意识，在自己的业务范围之内，拥有大量的自主权和自由裁量权，这些模糊的地方只有发挥主人翁意识才能做的好。而其余的相关工作，这时候就不能自由插手了，有问题，也要往上汇报，有共同上级处理解决，而不是自己随意插手，破坏规矩。


    # 3、权力边界问题：个人权力和组织秩序


    组织除了业务工作体系之外，主要还有权力指挥体系。一个人在自己的权力范围之内可以发挥自己的能动性，但是其他的事情，就不能插手，因为组织有自己的权力体系和组织伦理。超越自己的管辖范围，除了不能随意插手之外，也不能够随意发表自己的个人意见，更不能公开支持某人行为，这都是越权行为，所以必须强调不在其位不谋其政，不能滥用权力，这是组织权力稳定的需要。


    所以经过上述的分析，我们能够看出来，在自己的业务权力范围之内，以及组织临时需要，这就必须发挥主人翁意思，没有这样意识的人，在领导眼里是个冷漠的，没有积极性的员工。但是在业务之外，有可能担责，或是不顾别人的权力边界的情况下，就必须执行，不在其位不谋其政，不然，'
  merge: -1
  img_proc: true
- pgno: 127
  md: '在领导眼里，就是越权，不懂规矩的制造混乱的员工。所以，明确上述的三大观点就行了，如果真的记不住，那就记住一句话简单的话，干活的时候，发挥主人翁意识，多干。行使权力的时候，保持不在其位不谋其政，少做。


    # 送礼这个事，别⼈可以不要，但你不能不给！


    【困惑】老大，请教您一个问题，一个同学找我办事，需要我们单位其他科室的领导签字，这个字不好签。办成后，他给我一千元，这个钱我没有要。现在很纠结以后遇到类似事件该如何处理。感谢老大，望老大不吝赐教。


    【解析】这个表面看起来很简单的问题，其实并不简单，因为送礼是个大学问！


    1、成人的世界，是建立在感情基础上的价值交换


    为什么他能够找到你办成事，首先就是基于当年的同学之情，然后你乐意帮忙。如果没有这份情谊，任何人都懒得出手。但是如果只是基于通过感情，那么走不远。因为你这边也不是举手之劳，你找其他科室领导签字，用的也是感情。别人会继续让你透支这份感情吗？所以，以后你还会多次使用别人，单凭自己的感情是解决不了的，那就得出钱，你不让办事的人出，你自己掏腰包？成人的世界，是建立在感情之上的物质交换。没有物质交换，感情也不会稳定。


    2、送礼这个事，别⼈可以不要，但你不能不给


    很多小格局的人，认为事情办成了，送不送主动权就在自己手里了。看着别人客气，象征性质的推脱下，自己就顺坡下驴了，以为可以少花点钱，其实这是一种短视。礼物这事情，别⼈可以不要，但是你不能不给。如果接下来还会求到人家，你永远用感情去索取吗？这次人家帮你，下次人家看你不上路，还会帮助你吗？如果你以后不会求到人家，但是成年人的圈'
  merge: -1
  img_proc: true
- pgno: 128
  md: '子其实都不大，你确定其他场合不会有交集吗？除非，别人以后很快，还有用到的地方，否则必须给。


    # 3、给别人送礼，一定要给一个无法拒绝的理由


    中国人因为面子问题，不好意思直接把感情利益化。当你送礼的时候，必然别人会拒绝，这时候就必须给人家一个无法拒绝的理由。“咱俩这么多年的关系，我知道你不会要，这也不是给你的，你拿去请别人吃饭吧，你这次不收，是为了帮我，我很感谢。但是，可能接下来，还会找别人办事，到时候可能就难办了，是同学的话，请人家吃饭的事一定要帮我？”这样的一套话术说出去，就没有人会拒绝。这样会维护了彼此的感情，也没有了利益交换的铜臭味。


    基于题主的难题，其实很简单，这个人没给钱，就这么走了，说明不上路，以后找其他理由拒绝就行了，因为这类没有社交价值的人，社会能力也不会大到哪里去，以后也没有什么价值，所以，这类人逐步的冷淡下来就行了。人的时间精力有限，要用在那些有价值的人身上去。


    # 权谋家都是坏人吗？其实恰恰相反！


    【困惑】老师，学权谋，最终就是让自己变成一个坏人，可以这样理解吗？

    【解析】你对权谋的理解，还处于看动画片阶段的幼儿园水平。恰恰相反，学习权谋不仅仅不会成为坏人，反而最终成为至真至善之人。这背后并不是道德的原因，而是深刻的利益算计的结果：


    # 1、诚信


    很多人为了自己的利益各种谎言，一时半会可以，这都是小聪明，但是最终纸包不住火。尤其是在互联网自媒体时代，自己伪造各种简历头衔，吹牛很容易就被人给挖出来，这就构成了诈骗，游走违法犯罪的边缘。要想真正的做成大事，就必须尽可能地减少污点。用真我来吸引人，会让自己'
  merge: -1
  img_proc: true
- pgno: 129
  md: '最放松，最自在。权谋家最喜欢的还是《富爸爸穷爸爸》作者的那句话，“我没有撒谎，但是我也没告诉你真相。”


    # 2、谦虚


    大家都有这种感觉，越是大人物，越是谦虚低调。因为他们都懂得，不知道哪块云彩会下雨，搞不好一个鄙夷的眼神，可能就触动了一个人的玻璃心，这种小人命不值钱，非要在你落单的时候来个鱼死网破，岂不是，阴沟里翻船？所以处处都要表现出谦虚低调，只有这样做，才能够少树敌，减少人生事业上可能出现的阻力。即使真的想搞谁，也要表面谦虚，让他不知道谁下的手，找不到报复的目标。


    # 3、善良


    权谋家都是大奸大诈之徒？其实这是最大的误解。权谋家讲究“非利勿动，非危不战”，意思就是说，没利益的时候不妄动，不到危险的时候不挑明对着干。有了这个原则，自然就不会到处用权谋，去炫技。国之利器，岂可轻示与人？既然不常用权谋，自然处处就会表现出自己的善良。不过这种善良并不是做什么烂好人，没事扶个老人，这是蠢，不是善！善是让自己无损失的前提下，让别人过得好！


    经过上述的分析，其实我们就能够看到，这里有老子说的“大智若愚”的影子。底层的行为和高层的行为可能是同样的做法，但是这两个层次，完全使用不是一个计算公式。底层是逻辑混乱，依靠道德压力去指导自己的行为，而高层是深刻的利益算计，依靠对规律的把握，最终去指导行为。所以尽管都是表现出诚信、谦虚和善良，但是目的和手法却大不相同！'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 人人都学习权谋，是不是就没用了？权术不是简单的一招半式！


    【困惑】老师，现在处处都有职场权谋的文章，以后泛滥了，都会的话，是不是就没有用了？


    【解析】随着权谋的越来越普及，知道的越来越多，很多朋友都有这个担心，其实大可不用担心。因为权谋这门学问极具价值观属性，很多底层的人，看到之后只会骂，而且自学的话容易断章取义，倒果为因，还容易走偏。权谋其实和兵法一样，大家都学习孙子兵法，为什么战场上，还有胜败呢？因为权谋本身不是，有用没用的问题，而是怎么用的问题：


    # 1、信息对称


    所有的谋略，情报都是第一位的，没有情报，权谋家就是瞎子，是瞎子。所有的权谋无不观察、积累、收买、刺探等等各种手腕，全面掌控对手的信息，拥有正确的信息，才能做出准确的判断。如果情报错误，一切胜利都无缘谈起，在足够矛盾纷乱信息中找到核心是权术能力。


    # 2、阶段分析


    任何事务的发展，都有自己的规律，都有自己的发生、发展的战略节点。对于这个战略节点的判断，就是阶段的分析，是该团结的阶段，还是该斗争的阶段，是该逆取的阶段，还是顺守的阶段，是该对内严格管理的阶段，还是拿大一致对外”的阶段？判断不清楚阶段，就拿不出准确的手段。


    # 3、强弱判断


    很多人会想，谁强谁弱还不清楚吗？其实，如果体量相差悬殊的时候，差不多都能判断，绝对实力下，也用不到什么权谋，不过尽管如此，历史上以少胜多的事情，还时常发生。尤其是势力均衡时，这就需要不仅仅是整体的实力，而是局部战场的整体形势变化的精准把握。


    # 4、资源调动'
