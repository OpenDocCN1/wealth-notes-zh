    费点功夫，找到他家里的地址，或是他老婆工作的地方，然后写匿名信，告诉他老公出轨或是性骚扰的行为，来个釜底抽薪，让他媳妇给他施加压力，媳妇管的严，自然就会把自己的行为收敛很多。利用好他的后方的力量来挟肋，是个很不错的方法。


    # 三、从不能，到不敢，再到不愿的方法


    # 1、散播小道消息


    权谋讲究反其道而行之，所以这类方法，大多是险招，慎用。那就是主动的把领导对你的骚扰私下散播出去，这样就会在单位风言风语的传播开来，无形中的舆论，还是会传播到他的耳朵里的，他就会考虑到自己的公众形象及威信，从而有所收敛。


    # 2、索取高级价码


    你不是想骚扰么，你吃豆腐可以，我要求加薪，我要求升职，我要求干轻松的工作，不断地提出各种索取的要求，上司一看，好家伙，这不是个善茬啊，索取无度，还不能占多到多少便宜，自然而然的认为你是个物质化'
  merge: -1
  img_proc: true
- pgno: 26
  md: '的女人，从而厌恶远离。


    # 3、公开恃宠而骄


    你不是暖味么，可以啊，毕竞从骚扰到真的发生关系，还有很长一段路要走，不断地用他的名誉，在职场内，恃宠而骄，显然二领导的这个身份，让他处处的尴尬，觉得你不好驾驭，从而对你产生冷淡，不愿意让你借助发挥。


    这上面的三招是兵行险棋，不到无路可走，慎用，后遗症大。


    上述九种方法从让他不能骚扰，到不敢骚扰到不愿意骚扰，全面的破解了职场的骚扰的应对方法，这些方案可以单独适用，也可以综合适用打组合拳。主要的思想就是让上司自己主动放弃，而不是你采用对抗，辞职，忍气吞声这样的自我意识的方案。


    # 权谋家该是如何的一种心态！


    【困惑】Q哥，无欲则刚讲的是一种心态，是要排除欲望杂念对待事情。唯利是图也是一种心态就是凡事将就利益以利益为主，这样容易被人驾驭，这两种心态都对但是相互矛盾？


    【解析】很多人都是单一思维，但是这个世界是复杂的，变化的。看似矛盾的东西，其实都是只看到了表象。无欲则刚和唯利是图其实并不矛盾，就好比，筷子和勺子并不矛盾一样，一个用来夹菜，一个用来喝汤。尽管能够互换，但是还是各司其职最为合适。现在详细分析下这其中的缘故：


    # 1、内外有别


    心态上必须是唯利是图，权谋网上常说，玩权谋，必须“非利勿动，非得勿用。”说的就是获得利益是我们的唯一行为指向。这是权谋家自己内心的规则，但是如果你内心想什么都表达出来，那就是毫无城府。所以对外'
  merge: -1
  img_proc: true
- pgno: 27
  md: '要显示自己无欲无求，如果显示出唯利是图，恰恰无利可图，内心想法和外在表现不同。


    # 2、前后有序


    每个事情，都有自己发生、发展的规律，一个权谋家，想上位，就必须一开始展示的无欲无求，这样才能得到大家的支持，但是权力到手之后，就需要变得唯利是图。秦国王鹬出征楚国的时候，在路上不断地向秦始皇要钱，要地，这就是表现的贪婪，唯利是图，是为了不让怀疑，自污籥晦。


    # 3、上下有反


    任何组织都是有阶层的，在下位时候，就要锱铢必较，唯利是图，因为本身资源少，就要不择手段的狙击财富，这就是西方常说的资本的原始积累，但是到了不再需要钱的时候，就要去实现自己的理想和抱负，钱就成了工具，这时候，就需要抛开物质利益，无欲则刚，坚持自己的理想。


    不过很多人恰恰都做反了，在下位的时候谈理想，而饿肚子。与别人说话的时候毫无心机，被人利用，在初始阶段就谈利益，让团队毫无理想和凝聚力。成功的人少，原因就是，走了大多数人走的路，反者道之动，只有和普通人不一样，你才能够成功。


    # 权谋家如何看待 “多行不义必自毙”？


    【困惑】Q 帝您好，学习您的 “权谋智慧” 公众号很长时间了，受到了许多启发。现实很残酷，迫使人不得不学习权术以自卫。但有一事想请教，您遐读史书，对照历史，“多行不义必自毙”
    这句话，是否契合人事的发展规律？是或否，对我们的人生和职场有何指导意义？请大帝开示，拜伏，不胜感激。'
  merge: -1
