- pgno: 78
  md: '美的管理，只有不断地调整和适应。因此，每个人在职场都不会遇见完美的领导，大家都会对领导的某个具体的事情心存不满。


    # 2、你无法选择领导


    自己跟着一个不完美，或是有这样那样缺点的领导，我们没有办法，因为领导不是你安排的，我们没有更换领导的能力。很多人说会，我辞职换个领导还不容易，下个领导依然你无法选择，你只能接受或者不接受，不接受你就离职，如此循环，别说美国，华为，进去也是一样。


    # 3、需深入研究领导


    我们遇见唐德宗这样的毛病一堆，还是昏庸的领导怎么办？跳槽绝对不是最好的办法，何况在古代没有跳槽之说，除非干和不干。我们如果必须在这样的领导下干活呢？那就要好好的研究领导的爱好、习性、工作模式、管理模式、权力模式、生活模式等等，不断的适应，投其所好。


    有句话说的 تل، 物竞天择，适者生存。没有你无法改变环境，你只能适应环境，你才能生存，同样，你无法选择领导，你只能研究透他的方方面面，你才能适应领导，才能够让自己的职场生涯更好的发展。要做到无论什么样的领导，自己都能够应对自如，而不是遇见困难就逃避。一个领导你都研究不清楚，你还谈什么能力。一个人你都了解不到他的需求，你还谈做
    什么大事！


    # 跪舔不是目的，投其所好才是！


    【困惑】Q帝，有一事请教，我最近刚调到公司生产管理部，办公室里面有俩副部长，一位年长对我很是用心教我写材料以及生活中各种礼貌细节，另一位年轻一点的「29岁」因为近几年不要命的干，得到了提拔，我每天都给俩领导端茶倒水，扫地抹桌，周五的时候，这个年轻的副部说，咱俩来是干活的，以后大家都是同事，不要这样自残身份伺候别人，努力'
  merge: -1
  img_proc: true
- pgno: 79
  md: '做好自己的工作就行，别的都没用，Q帝，屋里有俩领导，我感觉年长的领导喜欢我这样做，而年轻的不喜欢我这样做，我该咋做？才能保持自己不被领导厌恶！


    【解析】我们一直讲究对权力心思的顺从，这样能够避免伤害，还能够取得领导的信任，从而不断的得到重用，其核心是投其所好。但是很多人对此有了误解，这个求助就有极强的代表性：


    # 1、每个领导的喜好不一样


    尽管大家都人模人样的，其实每个人都脾性不同，有的是像狗一样的领导，他们喜欢吃骨头，有像猫一样的领导，他们喜欢吃鱼。给猫喂骨头，自己花心思不少，但是效果并不好。我们的目的就是研究透领导，对其了如指掌，然后投其所好，这样他们才会喜欢。领导喜欢能干的下属，自己就表现出能干；他喜欢溜须拍马，就表现出吹捧；喜欢收礼的，我们就积极的跑送。


    # 2、不是每个人都会做领导


    每个领导上位的途径不应，尤其是底层通过工作成绩上来的领导，因为没有经过系统的学习，和在管理层的时间比较短，对权力这个学问并不了解，不会享受权力带来的快乐，在别人为其积极服务的时候，做出了错误的指引。如果正如这个年轻的干部说的，大家都是同事，那么办公室的卫生怎么搞？大家排班，你亲自下手？什么事情都自己做，做领导还有啥乐趣？


    # 3、位置高不一定水平就高


    权力关系中重要的就是讲究忠诚，而忠诚最大的体现就是对领导的言听计从和全方位的付出。如果作为一个领导不引导下属这样做，自己以后就是孤家寡人。别人通过努力就行了，那么人家通过工作努力升迁，对你这个领导会感恩？再一个，如果领导不给机会，不把肥差交给自己，怎么出成绩？所以，很多人机缘巧合的升上去，但是再往上走，几乎可能性就不大了。'
  merge: -1
  img_proc: true
- pgno: 80
  md: '所以，题主的困惑，就是没能够区别对待不同的领导，其实既要积极的工作，也要努力的投其所好。这就是我们权谋网常说的“以技术立身，以权谋求发展。”对老领导表示顺从，对新领导展现努力。职场尽量减少阻力，寻求更大的靠山，争取更大的进步。跪舔，是大概率的权谋技术，但是具体情况要具体分析，只有投其所好，才能达到目的。


    # 领导嫉贤妒能，处处打击我，该怎么办？


    【困惑】权谋网老师，我也知道韬晦很重要，但是自己是名牌大学毕业，就是很优秀，无法低调，上级领导嫉贤妒能，处处打击我，该怎么办？


    【解析】不少人在职场会犯低级错误，认为职场就是学校，自己表现的越好，越耀眼，领导就像老师一样，下属越优秀，就会越喜欢，其实真相恰恰相反，你越是优秀，上级领导就越是感到威胁，职场位置就这么多，利益就这么大，你优秀被最高领导看到，提拔了，他的位置就危险了。所以，一个稍微懂点权谋的领导，都会打击这个表现优秀的下属，因为你是他的掘墓人啊。


    所以刚到一个新单位，最佳的策略就是做人要低调，不能表现的太过于锋芒毕露，这样就不会在没有根基的时候，提前被陷害打击。没有自己构建起来的关系联盟之前，出了问题，连一个帮你说话的人都没有，韬晦就是新人的保护色。


    但是情况总有例外，就好比题主，自己名校出身，能力极强，而顶头上司的权力敏感度也很强，他可能普通学校出身，他可能能力不突出，只是机遇被提拔上来的，所以，对这样的下属，内心有着不安全感，于是就处处排挤打压，这样的人，离开了，他自己的位置也就安全了。


    很多人会问，难道上级领导看不出来吗？这不是武大郎开店，劣币驱逐良币嘛？其实这公司不是这个小上司的，是老板们的，老板不知道下面到底'
  merge: -1
  img_proc: true
- pgno: 81
  md: '什么情况，即使有，小主管也能够找到借口：“年轻人心气奇高，只有通过困难任务，不断的打磨才能有大用。”看到了吗，给你困难任务，处处刁难，还会美其名曰，磨练。


    我们优秀还是我们的错了，该如何破局呢？其实大家要了解一个权力心理，任何领导都喜欢优秀的人才，但是不喜欢那些，自己控制不住的人才。你优秀，不归我控制，就对我就是最大的隐患。但是你能够听话，忠诚，你的优秀能为我所用，我自然希望，你越有能力越好。


    明白了这一点，我们就能够明白，领导嫌贤妒能该怎么办了，那就是早请示，晚汇报，维护领导权威，不当众顶撞，有功归上。不要怕领导抢自己的风头和功劳，事情是谁做的，大家都明白，等自己势力加强了，有了靠山了，可以找机会扳倒他，这是另外一个阶段的事情了。


    但是还有一种情况，两个人已经水火不容，或是就是副手，来了就是准备接替领导的位置的人。如何办呢？那就要寻找靠山，或是让自己的靠山给自己支持，不断的拉拢组织内的失意派，构建自己的势力，要勇于斗争。权谋家从来就是把问题解决在萌芽状态，这样的成本最低，效果最好。但是如果无法在萌芽状态解决，大家利益对立，这时候，最佳的策略还是不要公开撕破脸，能够私下斗争，就私下斗争，能够延缓斗争，就延缓斗争。


    但是大家已经成了明着的对手，政敌了，那就没有退路，拿出鱼死网破的气势，让对手有所忌惮，这才是王道，如果不敢斗争，就会被人当软柿子捏。你不敢斗，那些背后帮你的人都不想帮你。只有直接亮剑，大家觉得你还有当枪使的价值，才没有人会抛弃你。


    所以说，题主，要根据具体的阶段来选用具体的方案，俗话说的好，我们不惹事，但是，我们不怕事。上级领导真的对我们公开处处刁难，这时候就要积极地找他的失误或是把柄，或是栽赃，或是告密，使用各种手段，把他扳倒，反正不受待见，可能要走，不如干一票再走。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 权谋不适合咨询，没有具体细致的升职操作步骤！


    【困惑】老师，我是基层的公务员，可以提供具体细致的升职操作步骤吗？【解析】职场不是仪器，不可能，按照步骤一步步的操作就行了，权力这门学问，是艺术，而不是技术。主要原因就三点：


    +   1、每个人的起点资源不同


    世界上没有完全相同的两片树叶，自然就没有两个相同的人，每个人自出生开始，就走向了完全不同的路，父母的人脉关系，财富积累，智慧传承都不一样，走向社会，就会差别很大。如果父母有很强的人脉关系，刚走向官场就有人照顾，自然很快就能够出成绩，被重视。如果家里有财富支撑，自己奋斗也就不那么急功近利。有家里的智慧传承，在职场就会极大的减少犯错的概率。如果你不是名牌出身，官场没有背景，家里没有钱，长得不漂亮，不懂得职场规则，怎么可能有详细的升职步骤呢？你的起点可能是山脚，而有的人起步就坐上了登山缆车。怎么可能有统一的套路？


    +   2、每个人的外部环境不同


    每个人所处的外部环境可以说差别很大，事业初期百废待兴，人才稀缺，有点能力，很快就能够脱颖而出。但是等事业稳定下来之后，所有的位置都被占领，各种程序流程化，再想出成绩，就相当的困难了，攻城掠地的时代结束，就成了内部斗争的阶段了。内部斗争看的就不是能力，而是权谋。这是组织阶段问题，还有领导个人问题，遇见注意细节的女性领导，和遇见干事业出来的直男领导是不一样的，你是靓妹或是丑女，这个对年轻的男性领导又有不同的意味。不同的领导，不同的权力环境，所需要的策略也不一样。再一个就是身边的同事，如果大家水平都一样，那么也能相安无事，但是如果有些人权谋水平较高，提前布局斗争，你想升迁能不能打掉对手，很关键。'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 3、每个人的权谋水平不同


    再一个，每个人的个人修为不同，有的人个人能力十分强大，正好是组织需要的，那么重要性就会毋庸置疑，很快就能独当一面。但是很多岗位并不是需要太强太突出的能力，这个就不是竞争优势了。在官场尤其需要权谋智慧，能够快速的识别对手，识别盟友，能够得到各种信息，比如想扳倒对手，能够搜集到对手的把柄，想采用离间计，知道他和别人之间的矛盾，想投其所好，就需要知道领导的全部信息。而且这些职场的信息，矛盾，都是瞬息万变的。这就需要个人在短时间内，凭借自己多年的权谋思维的训练，按照基本原理，迅速的做出回应，因为可能一句话有错误，关键时候表错态，职场生涯就结束了。


    所以，职场并没有一个详细的升迁步骤，也不是通过咨询能够做到的。而是需要不断的学习，通过权谋思维的不断训练，才能够抓住机会，完成自己人生的裂变。


    # 巴结领导不被搭理怎么办？


    【困惑】我在工厂是个小职员，我尽心的巴结我们的领导，但他看不起我。视我为黄口小儿怎么破！


    【解析】初学权谋的人大多会遇见这个问题，巴结领导不被搭理。很多人一开始对领导不屑一顾，处处被打击，等到学了权谋之后，改变了价值观，认为自己低头巴结，就一定会被重视，其实真的是想的太简单了，你巴结凭什么人家就要接受呢？


    +   一、这里面的问题主要有三个：


    +   1、留下不良印象


    领导问新来的助理，明天的日程安排好了吗？助理回答道“嗯”；领导怒了，说“面对领导的问话，要么说好的，要么说嗯嗯，而不是一个嗯，记'
  merge: -1
  img_proc: true
- pgno: 84
  md: '住。”助理回答道“哦”。好了，就这么一个简单的对话，一个助理的形象完全就毁了，可以说没有下次机会了，没谁一直有义务教你。


    # 2、不能投其所好


    一个技术过硬的理科干部，面对整天给他端茶倒水的下级说，你干这些有什么用，想被我重视，就好好把工作做好，你是来干活的，不是来干勤杂工的。听到了吗，这就是不给狗喂骨头而给它吃鱼的结果，不能够投其所好，做什么都是错。他喜欢什么，就给他什么，不是你自认为他喜欢什么。


    # 3、位阶差别太大


    “我主动给老板开了几次车门了，领导都不正眼看我一眼。怎么破？”领导身边这样的人，一堆一堆的，领导会因为你开个车门，就对你另眼相看？这个想的是不是太幼稚了。两个人位阶相差太大，你没有相应的对等能力，别人是不会给你资源倾斜的，开几次车门，就想弄个经理干干？


    # 二、解决问题的方案也有三个


    # 1、加强自身能力


    在职场，任何时候都要“以技术立身，以权谋求发展。”一个人，工作能力有限，处处犯错误，天天基本工作都毛病一堆，哪个领导敢用这样的下属，做他的领导好处没有，天天要给他擦屁股？领导提拔下属，重要的是给他带来便利，而不是带来麻烦。


    # 2、研究领导需求


    每个领导的性格、爱好、工作方式都不一样，有的领导自己是211大学出来，就喜欢重点大学毕业的下属，有的刚上位，就想做出点成绩，有的在追求女下属，有的在为自己的父母求医问药，所以每个领导都有此时的需要，只有我们摸到了他的需求，能够提供帮助，自然刮目相看。


    # 3、果断更换方向


    如果领导就喜欢名牌大学毕业的，城市出身的，善于人际交往的，而你恰恰是农村出来的，普通院校毕业，只会埋头苦干的。那么，就要果断更换方向了，换个部门，换个领导，或者干脆换个单位。很多时候我们需要改'
  merge: -1
  img_proc: true
