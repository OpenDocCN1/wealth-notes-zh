    200 两，只拿出 50 两干活，150 两落入自己腰包，接下来，明年还有烟火灯烛的工程，更是大大 的肥差。王熙凤有了回扣，贾芸自己有了事业，双赢。


    同样是王熙凤的关系资源，三个人，做出了三种不同的玩法，思维方式不一样，境界就不一样。最好的就是利用关系进行项目运作，这样 的关系会'
