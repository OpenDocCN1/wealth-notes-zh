  md: '# 3、不设现：不受时空的限制


    比如说买房，很多人认为自己就在自己身边熟悉的地方来买，其实真正的高手，不局限在眼前，而是放眼全国，哪个地方房子的增值效率最快，就投资哪里，这是突破空间的限制。买房不考虑当先多少钱，高不高，而是考虑未来是不是能够升值，是不是翻倍，这是不为当下的时间所限制。这里只是拿房子举个例子，不买房的或是买房不赚钱的，很多都是自己被时间和空间所限制。


