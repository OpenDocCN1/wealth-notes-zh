- pgno: 98
  md: '后来正式拜师之后，我问师父，如何才能提高自己把脉的水平，他说，把脉这是最末端的技术，因为中医讲究的是望、闻、问、切。切脉是最后的，其实通过他的气色，通过他本人的病情描述，以及针对性的询问，几乎上就能判断是怎么回事了，切脉很大层面就是走走过场。让你感觉是他诊脉查出来的，不是病人告诉他的，不然怎么显示专业能力呢，诊脉重要但是不是你想的那么重要。听过师父的话，我也释然了。后来，研究权谋，不少朋友问我如何提高察言观色的能力，其实这个和中医判断病情是一样的，因为察言观色是最末端的，前面还有三个技术：


    # 1、收买间谍


    君臣一日百战，职场的上下级关系，其实就是敌对关系，必须知己知彼，方能百战不殆，所以必须把所有的行为都建立在准确的情报之上。比如春节前，不少人给我留言，想给领导送礼，不知道送什么。权谋又不是算卦的，你作为下级都不知道，我远在千里之外能够知道？你最该问的不是我，而是领导身边的亲戚朋友，司机秘书。我都不认识啊，怎么问？对啊，那还不多找机会收买，用钱、用小恩小惠、用拍马屁、用感情，各种手段结识领导身边的人，来获取准确的情报？历史上哪个丞相不是权谋高人？但是都会和宫里的娘娘和太监搞好关系，获取情报啊。


    # 2、搞大数据


    如果，我是说如果，找不到间谍呢？这就要做个痛苦复杂的工作，那就是事无巨细的搜集关于领导的大数据，之前多次强调，对领导写20万字的研究调研报告，没有调查就没有发言权嘛。这个调查不设目标，而是事无巨细，方方面面，这样能找出规律。比如，和领导一起吃饭，每次他爱点什么菜，这一桌菜他动筷子吃得最多的是哪个。了解了这个，我们下次点菜的时候，就知道领导爱吃什么，能够投其所好。比如领导爱抽烟，爱抽什么烟，频率是多少，购买烟的渠道是什么？爱喝茶还是爱喝咖啡，什么茶，什么咖啡。他目前在关注什么，在看什么书？必须研究透，比他自己更了解他才行。'
  merge: -1
  img_proc: true
