  md: '# 原汁原味 100 问——权谋家的处世智慧！


    1、权谋并非圆滑奸诈，而是顺应规律


    学员：群里有没有开始很老实本分，最后变得奸诈圆滑的？以前觉得奸诈圆滑不好，现在觉得是神技，可惜思维固化，不好修炼啊。


    权谋网：权谋没有善恶，这就是个实现自己目标的工具，你在思维里认为权谋是奸诈圆滑，说明你还没有入门。权谋是顺应规律的学问，顺应权力规律、顺应人性的规律、顺应自然的规律、顺应商业的规律等等。之所以会把权谋手段定性为奸诈圆滑，其实就是价值观不匹配的结果，就好比，一只羊，听说狼饿了一定要吃羊，心里就极端的不舒服，认为狼太残忍，吃草不鲜美么？但是，权谋是吃肉的学问，不是吃草！


    2、看重未来资源和成长，而不是眼前收益


    学员：老大 我托关系想进一家央企，只要证件齐全，问题不大。昨晚饭局上，中间人提到，会有一个面试，问我的薪酬是多少。这第一下很重要，提到了基本等于定死。他的建议是想报高后降，我不是很放心，您看怎么说。


    权谋网：打听下同岗位的平均薪金，这是最安全的策略。打工最看重的是平台，核心是资源和成长性。不要太在乎眼前的基本收益，到时候直接通过权谋手段往上爬，升任领导岗位，自然什么都不是问题。


    3、权谋家对内，对外都要有 đệ平和的心


    学员：老大，自己经常在群里熏陶 我不与垃圾人计较 昨天和媳妇开至高速路口，因为媳妇开车一些倒车问题与前面车辆发生一些口角矛盾，我直接提议让她离开 没有再说什么，媳妇下车与人争吵，说别人骂她了，我推着她让她快速离开，她不依不饶，我期间一直求和处理，最终吵了几句离开，回来路上，媳妇一直说我没钢性，没有和她一起对抗，回来一直不'
  merge: -1
