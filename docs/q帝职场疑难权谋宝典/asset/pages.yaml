  md: '奋斗比较合适。


    # 88、别惧怕组织内都是皇亲国戚


    学员：老师我观察组织内提拔的都是皇亲国戚，我啥也没有，跑关系特别难该怎么办？


    权谋网：这个现象的确普遍存在，但是你要明白，也不全部如此，因为领导做很多黑活，很多隐私的事，不愿意让自己的亲戚知道太多，而很多亲戚也仗着自己和领导的关系，不愿意跪舔，不愿意输送更多的利益，这也就给其他人留下了机会。我们没有铁硬关系的，只能是“以技术立身，以权谋求发展”，好好的打造自己的可利用价值，然后让领导用着顺手、用的放心，这也能够被领导真正的信任，进入他的心腹圈子。


    # 89、被统治阶级面对压榨只能顺从！


    学员：老大，我们领导是个小心眼的人，今年突然大变，每个小问题都罚钱，加工作量，不让我们下班，有何良策？


    权谋网：一头猪的命运是确定的，所以无论什么手段，都只能延缓上餐桌的时间而已，除非它不做猪。被管理者面对权力高压，除了顺从，并无他法，只能依靠自己平时的积累，抓紧把自己变成管理人员，这才是从根本上解决问题的方法。


    # 90、要主动地揣摩领导需求


    学员：为什么领导都不会给下属明说自己的需要呢？


    权谋网：首先，任何领导都不可能公然说出自己的需求，一个公开自己内心的需要的人，会成为被别人猎杀的弱鸡，把需要写在脸上，立刻就会被人挖坑设陷阱。其次，即使没有陷阱，把需求公开之后，大家都看到了领导的需要，无法参与其中的，会背后破坏。最后，很多隐私的需求不可能公开，领导筛选的不仅仅是送东西的人，而是能够主动的人。被动索要，谁知道是不是真心？会不会改天反手一个举报呢？


    # 91、问问自己，别人凭什么帮你？


    学员：请教一个关系走动的问题，就是我想进国企，我表姐在公司里面，'
