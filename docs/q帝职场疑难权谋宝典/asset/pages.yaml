- pgno: 8
  md: '首选是关于自己的价值提升，自己的价值提升后一切都不是问题。不过如果工资很高，即使没价值，即使不开心，还是可以作为留下的理由的，毕竟我们还有的是业余时间。


    所以我们判断是不是需要离开的时候，就看我们在这里是不是能够得到价值提升，如果没有就看看自己开心不开心，如果前两个条件都没有，就看看能不能赚到钱，如果三个条件一个都不具备，那么，我劝你尽早离开。果断，魄力，没这些，一个人不会成功。


    这三个标准其实就是职场或是创业要不要离开的判断器。


    # 如何处理老板的犯错误亲戚


    【困惑】Q哥，你好！我是一个公司的领班我管生产，而我主管的小舅子管技术但归我管，现在碍于他是领导亲戚有时候他上班睡觉玩手机我说他感觉不服管，本想睁只眼闭只眼，时间久了我怕手下的人也会学他的样，现在我想让他不要和我一个班，我应该是当面跟我主管说还是暗地收集他的证据匿名举报，还是跟他拉近关系结党，望Q哥指点，谢谢！


    【解析】权谋网从权谋角度的思考回复：


    +   1、玩手机这样的证据，就是举报了，老板也是睁只眼闭只眼。毕竟不触动原则的事情，老板要衡量和自己老婆之间的关系，所以这样的材料就是搜集了也不会有啥具体的效果。


    +   2、拉关系结党，这个是必要的，因为你这个领班和管技术可以说在工作上几乎是平级的，只是在权力上不平级而已。对于这样的工作平级的人，你就不能动用权力去强制。既然无法强制，就需要拉为同盟，这样对自己的管理有好处。


    +   3、你的问题还是如何管理他玩手机睡觉的问题，直接处理并不合适，可以采用杀鸡儆猴的办法。先找这个小舅子商量下制定一个禁止工作期间玩'
