  md: '之前她问过我奶奶，问我有没有大专文凭<|message|>有的话可以把我弄进去，但我没有，后面这事儿也没有提，当时我还没有进群，不知道这些，想着有一个班上就行了，进国企干嘛，但现在可以通过其他途径把我弄进去，因为我们现在不在一个城市，距离也比较远，给红包他肯定不会收，送东西又不知道送啥，不知道如何推进一下关系，还请大神指教，我们平时也很少交流，除了有一层亲戚关系以外，感觉就像陌生人一样，而且自己也不善言辞。


    权谋网：这个事啊，基本不用想了。你们之间没有很深的亲情，距离比较远，没有强有力的关系推进；又没有巨大的利益交换；大专文凭都没有，在他们眼里，你也不是一个可栽培的人才。没关系、没财力没能力，凭什么帮你？当然了，这个事也不能绝对，先走动走动，先加强感情再说，看看人家身边有什么资源，增加一些亲密度，不一定非得去打工啊，机会都是在接触中发现的。


    # 92、学历低只是个借口


    学员：我姑姑说我学历低，其他的没说啥，让我有事给她打电话，我都不知道该怎么做？


    权谋网：有事打电话，很明显，人家不会主动帮你，学历低也只是个借口。如果你是他亲儿子，没有学历他就袖手旁观了吗？所以说呀，权谋最大的作用就是趋势判断，这种关系目前可以放弃了。


    # 93、初学权谋容易浮躁


    学员：我现在走到路上，看到公司的每个人都会去想，他有什么关系，有什么资源，背景靠山是谁，但是对我人生毫无改变，没有作用，找不到资源转化的点。


    权谋网：初学权谋，之所以容易浮躁，主要原因是有了这种权谋的意识，但是缺乏眼光，缺乏手段，缺乏资源。这就需要我们长时间的积累和等待，就像司马懿这种高人，资源条件不具备时，也是需要几十年的等待才能真正的翘盘。'
  merge: -1
