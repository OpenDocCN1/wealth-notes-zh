- pgno: 89
  md: '# 领导让造假怎么办？


    【困惑】直接领导（小组长）要求数据造假，但是部门领导不知道，数据很容易被查出来，要服从吗？


    【解析】所有的职场人可能都会遇见这个问题，会计专业的更多，不过这类事情，做不做，都没有具体的标准，更没有都不得罪的超级技巧，这就是个决策问题。主要是考虑下面三大原则，来衡量做不做。


    # 1、风险和收益的问题


    一堆狗屎怎么做好吃？答案是，不吃，因为怎么都不好吃。但是为什么有人能够吃下去呢，那就是一个亿放在旁边，吃下去钱都归你。用网友的话来说，信不信能吃到你破产？没错，造假就是这堆狗屎。要不要吃，核心的就是自己有什么收益。不给好处就让给你造假，我傻啊。不造假，你给我穿小鞋，总比造假被发现的压力更小，两害相权取其轻。回复起来也很简单：造假可以啊，我有什么好处？


    # 2、信任和恩遇的问题


    很多时候，我们不能只在意眼前的利益，还需要做长远的考虑。如果领导之前对你有提拔之恩、知遇之恩、教育之恩、保护之恩，这就需要投桃报李，关键时候必须果断的替领导造假掩饰，这样彼此的关系才会越来越紧密，才能越来越是自己人，这时候是个维护靠山，展示忠诚的过程，很可能就是领导忠诚考察的手段。通过一起犯错，会捆绑的更加紧密，回复起来也不难：老大你的事，就是我的事。


    # 3、把柄和背锅的问题


    关系一般，领导权力很大，可以直接开除那种，这就需要暂时的忍让，需要使用权谋技巧为自己准备撤退的路线，在办事的过程中，一定要留下各种证据，“这样不好吧”“如果发现怎么办”“具体我该怎么做”不断诱'
  merge: -1
  img_proc: true
- pgno: 90
  md: '导他，给自己留下证据，一来，这是控制上级的把柄，说不定关键时候能够用的上，二来，是为自己避免背黑锅。回复起来，也不麻烦，录好音：我是你下属，具体怎么做，都听你的！


    通过上述的分析，我们能够看出来，不存在一个巧妙的拒绝。因为，拒绝就是决裂，无论如何自认为巧妙都是徒劳的。所以不如直接说，我胆子小，不做，但我会给你保密，简单直白。干净利落！所以，很多时候的事情，都是要具体问题具体分析的，把握好机会，又要规避风险！


    # 现在 40 岁了学权谋晚吗？


    【困惑】老师，刚接触权谋，感觉很实用，但是我现在马上就要 40 岁了，学权谋晚吗？


    【解析】孔子说，朝闻道夕死可矣，通俗点的意思就是活到老，学到老。不过这样的励志的话，不是咱们权谋人的风格，学权谋什么时候都不晚，主要是权谋对我们有用，有价值：


    1、对职场有用


    之所以有 40 岁学权谋晚不晚的疑问，主要是觉得自己在职场已经定型，就是学了权谋也不会有大的改变，于是有了自暴自弃的想法，认为学了这个晚了，用不上了。其实权谋不仅仅用在进取上，还能用在偷懒上，既然职场定型，晋级不能，但是可以通过各种手段让自己在职场过得舒服，争取更多的时间，为自己搞副业，搞爱好，或是让自己能够有更多的休息，搞好身体。权谋就是实现自己利益的工具，明白自己的利益、资源和位置所在，并使用手段实现是基本功。


    2、对自己有用


    按照平均寿命至少 80 岁，40 岁的人生可以说只是走了一半而已。未来的道路依然需要更多的智慧来处理各种问题。首先，是活得明白，学习权谋'
  merge: -1
  img_proc: true
- pgno: 91
  md: '能够看透社会和人性的规则，知道什么事情能做，什么事情不能做，不再做无谓的努力。其次，活得自由，面对各种问题，都有了 3 种以上的方案，不再把思维局限在非此即彼的痛苦决策中。最后，就是活得开心，之前被人欺负，自己只能生闷气，但是学习权谋之后，打不过你，背后给你设绊子还是没问题的，和你斗着玩，很快乐。


    # 3、对孩子有用


    40 岁，按照正常的话，孩子十几岁，正好是人生发展的最关键的青春期，作为一个家长，参与孩子的成长过程才是最为重要的事情，因为培养好了，孩子是自己的福气。培养不好，孩子是自己的债务。自己做不了富一代，也要努力做富一代的父亲。自己学好权谋，就能够把自己人生的经验系统化，把之前犯的错误，摸到的坑都能够变成经验告诉自己的孩子，让他避免重蹈覆辙，减少人生探索的成本。所以，自己
    40 岁如果没有成功，恰恰需要为了孩子来学习权谋。


    经过上述的分析，我们能够看出来，40 岁学习权谋并不晚，只要开始就永远不晚。如果你不学习，10 年后，你不还是依然走向 50 岁的老年？学了不一定有所改变，但是不学，一定没有人生的意外精彩，每天让自己进步一点点，40
    岁之前，都在为别人而活着，如果有机会，40 岁之后为自己而活，学点权谋为自己想要的生活，做下最后的努力。 forty 不惑，就是意味着，自己知道了人生的斤两，没有了不切合实际的念头，被社会打磨的更加现实，权谋能够让你站在更真实的起点，重新开始！'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 能力普通的人如何职场崛起？


    【困惑】Q帝老师，我有幸关注了咱们权谋智慧的公众号，学了很多东西，感觉人生又有希望了，我普通大专毕业，没有什么特长，工作能力一般，而且远离家乡，没有什么背景人脉能够利用，如何能够在职场快速崛起？谢谢了！


    【解析】你能够客观的认识自己，这已经远远的比那些好高骛远的人强太多。尽管权谋网一直强调，以技术立身，以权谋求发展，但是很多人就是资质平庸，无法在技术上有所作为，或者本身工作没有任何的挑战性，没有技术含量，该如何的发展呢？这个问题很普遍，毕竞精英永远是少数，不过权谋就是解决难题的：


    1、首先我们要明白，职场升迁其实存在两条途径，一个是技术路线，一个是权术路线。


    技术路线，就是服务组织。让组织无法离开我们，让自己变得无法替代，就能够立足职场，地位无法动摇，毕竞，任何组织都需要干活的人，都需要为组织增值资源的人。


    权术路线，就是服务领导。为了领导个人而做出我们的努力，提高自己的服务本领，关注领导权力安全和生活状态，成为领导的亲密伙伴，让领导用的顺手，离不开。


    2、其次，权术路线，我们在理论上又分为黑色路线和桃色路线。


    黑色路线，就是普通人眼里的小人路线，核心能力就是小报告干黑活。为了领导的权力安全提供自己的努力，为领导提供情报，打击异己，维护权威。'
  merge: -1
  img_proc: true
- pgno: 93
  md: '桃色路线，就是普通人眼里的情人路线，核心的就是让领导享受人生。最简单的就是异性之间，利用自己的色相，陪领导上床或是暧昧获取资源。同性之间，替领导安排类似生活活动。


    3、最后，黑色路线，又分为两个角色，狗腿子和枪杆子


    狗腿子，看了先别恶心，相当于忠实家仆，只忠心领导，维护他的利益。领导是需要忠诚手下，无条件执行自己的指示，言听计从。为领导看家护院，各种情报第一时间反应给领导。这个前提是必须精深的揣摩领导，对他的心理了如指掌。


    枪杆子，为领导当枪使，相当于贴身护卫，做领导谁不得罪人呢，毕竟很多人不满领导的时不时的要闹事拍桌子，这时候为了领导的利益挺身而出 “你算老几，你什么资格跟领导这么说话？”不要怕背黑锅，因为前提是你想做枪杆子，必须找对好主子。


    经过上述的分析，这个题主应该能够明白自己没有能力，没有背景，该如何的去混好自己的职场了。走权力路线，别有心理压力。因为你没有技术能力，就需要表演功力。上班就是演戏，让自己做个合格的演员，演好职场角色，狗腿子角色怎么了，很多大牌演员都演过。没有小角色，只有小演员。下班了，脱掉戏服，依然是人生的赢家！


    # 学习权谋的心理演变过程！


    【困惑】老师，我跟随咱们权谋智慧微信公众号，学权谋有三个月了，现在感觉身边的人都是精于算计的，好怕！我不敢给你公开留言，感觉我们领导可能也在这里学？


    【解析】学习权谋和学习其他任何的知识有所不同，这个和我们日常的学问是有极大差别的，因为这个触及到价值观和涉及到人性，所以，每个人学习权谋都有个心理的过程。主要是分为三个阶段：'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 1、敏感阶段


    一开始学习权谋，就如开了天眼，能够看透背后的利益流动和人性的阴暗，忽然间觉得，自己一无所知，找不到应对的方法。开始焦虑，开始恐惧，开始浮躁，这时候就是一个敏感的阶段，处处都想分析背后的规律，领导当面一个眼神，都要分析好久，领导到底想表达什么。其实社会没有你一开始想的那么光明，学了权谋也没有你想的那么阴暗，你身边没有几个精通权谋，别自己吓自己。


    # 2、骄傲阶段


    通常学习权谋一两年之后的朋友，权力观念和权术手段都会有一个大的提升，身边人的那些心理心思，很快就能够看明白，周围的一切都会洞若观火，清晰可见，觉得自己智慧碾压他们，内心就会鄙视身边的
    人，而这些底层的人，认为他们都是白狗、韭菜、蠢猪。这样的人很快就会孤立在人群中，自然而然的被周围人排斥，被认为阴暗，自己也越来越不愿意和周围的人来往。


    # 3、无视阶段


    其实真正的高手是被褐怀玉，和光同尘的，和周围的人没有什么区别，在没有利益冲突的时候，主动迎合他们，小人物有小人的用途，即使有利益冲突，自己也会放弃频繁操作，把精力放在自己的价值提升上，资源攫取上，人脉构建上，没有精力消耗在无聊的人和事情上。更重要的是明白自己想去哪里，想要什么，通过什么手段才能得到，这时候身边各种声音不是没有了，而是无视了，眼里只有目标。


    所以，题主现在只是在一个敏感阶段，踏踏实实的一步一个脚印的学过来，提升的不仅仅是知识和职场的自由，更是人生的修为。学习权谋的唯一标准就是让自己过得越来越自由，越来越开心，而不是相反，如果让你越来越焦虑，越来越孤立，那绝对是走偏了！'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 不懂游戏规则就等着抑郁吧，每个阶层拼的不一样？


    【困惑】我朋友在医院药房工作，药房里大多数是领导家属或者关系户，都已形成了一个利益集团（与医药代表等），朋友自己想融进圈子，但人家觉得他没关系没资源不愿带他玩，把他当成外人，时时刻刻像防贼一样，表面上对我朋友客客气气，一转身又指指点点、风言风语，搞的我朋友在药房里很难受。朋友想打破这种困局，不知该怎么办？
    而且，想调到其他部门，但由于专业限制，又调不走，只能在药房那个环境呆着，感觉很压抑。人家都不带他玩，背后还各种说他不合群不正常等等，给我朋友带来了很大的困扰，都有点抑郁症症状了。肯请老师指点，如何化解？


    【解析】不管你承认不承认，这个社会是分阶层的，如果不懂相应的游戏规则或是用错了阶段，那么人生如果没有出局，就必然会坎坷不断：


    +   1、底层拼的是能力和忠诚


    无论是社会还是职场，只要是在底层，就意味着，什么资源都没有，如何在社会上生存，就必须用自己的能力和忠诚去立足，以为能力能够为组织带来利益，而忠诚能够为权力带来利益，只有这样才能够被留下，可以说不懂得这些，就基本上没有什么前途，只能拿点基本工资活着。


    +   2、中层拼的是利益和圈子


    而走到中层，手里握有一定的资源，但是这些资源都不足以让自己能够安身立命，这时候，大家就会交换彼此的资源，让自己越做越大，这就需要构建自己的圈子不断的用利益交往，来加深自己的圈子稳定程度，大家不再相信什么忠诚和能力，大家就只相信小圈子的信任和利益的联盟。


    +   3、高层拼的是血缘和血腥


    没错，高层要么是生出来的，要么是自己杀出来的，简单的就是要么血缘，要么血腥。当然，对于杀出来的，咱们不能做狭义的解释，一将功成万骨'
  merge: -1
  img_proc: true
- pgno: 96
  md: '枯，一个企业老板的崛起是很多人的破产堆积出来的。所以，高层的资源不是交换过来的，是拿过来的，不过是从谁手里拿过来，什么方式拿过来而已。


    很明显，题主的朋友在药房是最底层，人家都已经形成了自己的小圈子和利益联盟，没有人愿意随随便便吸收一个底层进来分配自己的利益。如果想爬到中层的圈子，就必须拿出自己利益去交换。但是我给这个朋友解释后，他给我来了段奇葩的回复，他说“感谢老师指点！还想打扰老师一下：在没有利益的前提下，他如何改变人人都背后说他的困扰，他感觉药房其他人都在有意排挤他，现在都有点抑郁症。”我告诉他，“不想交换利益的情况下，就吃点抗抑郁的药吧。”看到了吗，这就是一毛不拔的底层，不懂中层的游戏规则，还想不出局，怎么可能。


    # 任何时候不谈论职场政治，要有傻白甜的人设！


    【困惑】仰慕您许久了，最近遇到一个问题，我有同事突然问我，咱们公司内部同事之间是不是有小帮派呢？这个问题我该如何处理呢？还有就是我们因为是事业单位，时间比较多，中午吃完饭几个人老发起邀请出去溜溜，说白了就是出去交流单位信息。我之前一般都参加，我以后是否尽量少参加呢？麻烦老师帮忙分析一下，非常感谢，学生感激不尽！


    【解析】每个职场人，除了工作本身之外，都要面临职场政治这个问题。这个无法逃避，只能坦然面对，涉入的深了，让人认为圆滑世故，涉入的浅了，让周围人排除在外，这个必须有个度。题主就问出了职场的三个基本政治问题：


    +   1、职场帮派问题


    职场会因为各种爱好和利益而形成各种各样的圈子，从饭后出去溜溜这个细节，题主应该是女人。而男人有时会在一起经常抽烟，而形成一个圈子。'
