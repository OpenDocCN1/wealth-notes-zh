  md: '# 34、应酬是捷径，但不是必经之路！


    学员：老师好，我不愿意上酒桌去拉关系吃吃喝喝，喝多了自己难受不说，言行举止自己都看自己像个傻逼。我更愿意多点时间认真工作，搞点东西出来，怎么破？


    权谋网：每个人都要选对自己的优势领域去实现自己的理想，不擅长的话，不仅仅自己难受，还不会有成就。应酬是你的弱项，那就让自己专心的搞研究弄出点成绩，让自己不可或缺，毕竟任何组织还是需要办事的人。再一个，你要记住应酬的本质，是人际关系的沟通和信任。而这个沟通和信任并不一定都要通过喝酒来实现，可以喝茶啊，可以过节走动啊，可以日常的亲密往来啊，汇报工作啊。所以，你要不断扩大自己的优势所在，然后搞好沟通关系就行了。不会喝酒不代表就不和人沟通，拒人千里之外啊。


