- pgno: 195
  md: '# 大家都学权谋，是不是权谋就没有效果了？


    【困惑】老师，现在都在研究权谋，大家都学了权谋，是不是，就没有什么效果了？


    【解析】你这是孕妇效应，并没有很多人去研究权谋，只是你关注了，才觉得大家都在关注，而且，很多人的价值观不到位，关注也是黑粉，为了抬杠和谩骂。即使，真的大家都在学权谋，也不是没用，因为权谋的具体运用，也不仅仅和权谋手段有关，拼的还有下面五点因素：


    # 1、信息不对称


    权谋的设计，首先都是建立在信息正确的基础之上的。所以历朝历代的权谋家无不对信息情报极度渴求，即使没有情报，也会把人往最坏处想，毕竟自己多想点，总没有坏处。所以，每个人的情报来源不一样，真实性不一样，干扰不一样，对信息的处理也就不一样，决策也就会有差别。


    # 2、操作有失误


    即使老司机，开车还有意外出事的时候，所以，即使一个人精通权谋，在自己操作的时候，要涉及很多的因素和个人的精力，稍有不慎，就会出现失误，而且越是高层，比拼的恰恰就是谁的失误更少，老虎还有打盹的时候，何况我们的普通人。操作失误，也会导致结果的天差地别。


    # 3、资源有约束


    每个人所处的位置和环境不同，所拥有的资源就不同。每个人资源起点不一样，所有的计谋就要受到资源的约束。比如，没有美人，你看见老色鬼，也拿不出美人计啊？和别人没有深度的信任关系，船都找不到，怎么借船出海啊？我也想打草惊蛇，但是拿什么药，防止被蛇咬呢？


    # 4、人员有背叛'
  merge: -1
  img_proc: true
- pgno: 196
  md: '亲贤臣远小人，说的没错，但是谁的脑门上刻着小人两个字呢？你如何去识别小人？而且很多人都是扮猪吃虎，伪装的都非常到位，不到最后你有可能不知道谁是卧底。而且随着时间和利益的变化，一开始是好人的，很可能黑化，走向自己的反面，这都是权谋操作中的变数！


    # 5、时机有变化


    时来天地皆同力，运去英雄不自由。用现在流行的一句话来说，就是“只有时代的马云，没有马云的时代”每个人都是历史机遇的产物。尤其是权谋家布局，最讲究的就是顺势而为，如果没有大的趋势，也不可能仅仅凭借手段逆天而行。司马懿等了曹家三代人，才找到翻盘的机会。


    经过上面的分析，我们能够看到，为什么大家都懂权谋，也不会失去效果，因为真正的权谋不仅仅是手段，还有诸多的因素，还有就是个人权谋计算能力的修养，不断的提升自己的思维格局和计算能力，所以，权谋是一种修行，不能只指望对手不会，而降维打击，这是偷懒模式！


    # 和领导是亲戚关系，但是多年不被重用是什么情况？


    【困惑】我是一个公司员工，亲戚是公司的领导，但我的关系单位人都清楚，我上班六七年了，一直得不到重用，这使我一筹莫展，不知如何是好？我想要利用关系尽快升迁或者能够接触到他的关系，不知应该怎样去做，期望老大不吝赐教，让我解决心中疑惑。


    【解析】在职场，很多人，为没有关系无靠山，而挠头，但是更头疼的就是，有关系，恰恰用不上，还可能起到反作用的。权谋网给大家分析下，这背后具体什么情况：


    +   一、领导层面


    作为领导，手下有自己的亲戚，而不提拔重用，站在领导层面有三种可能：首先，不懂权力。不知任人唯亲，打造利益联盟的好处。对亲戚和其他'
  merge: -1
  img_proc: true
- pgno: 197
  md: '人，一视同仁。所以这类领导干部很多时候没有自己的嫡系和亲信，只看能力，不看远近，基本上就是个光杆司令。受到传统教育，个人清廉的技术干部居多。


    其次，洁名钓誉。有些人精通权力，但是为了传递自己的政治形象，或是为了杜绝别人的悠悠之口，就会故意不提拔自己的亲戚。尤其是会故意拿自己关系最近的人，来作为自己的政治垫脚石，这类人就是自己靠关系上位的伪君子比较多。


    最后，有意避嫌。这种人就是大多数的领导的心思，如果大家不知道和下属的亲戚关系，自己偷偷的安排一下是可以的。但是如果这个关系大家都知道了，自己就不好意思主动为自己的亲戚谋福利。即使本来应该争取的，也都怕别人说自己搞关系，而放弃提拔自己人。


    # 二、个人层面


    但是，我们知道，如果站在下属的角度，也是有三种情况不被提拔：


    # 1、个人能力差


    领导提拔一个下属，所有人都会看在眼里，记在心里。尤其是提拔自己的亲戚，就更怕出问题了。被提拔的人能力有限，就会很直接的影响到领导的个人威信。所以，如果亲戚下属的能力有限，容易出错，大概率给自己招惹麻烦，不如不用。


    # 2、人品有问题


    有些人，会仗着领导的关系，狐假虎威，天天说自己和领导有关系。搞的周围人关系都很紧张，这时候，如果提拔起来，会有极大的阻力，也会极大的损伤领导的威望，为了这样一个亲戚，作为领导要得罪很多人，没有那个必要。


    # 3、关系很一般


    亲戚关系，只是血缘关系，而且很多时候，也只限于过年过节，或是各种婚丧嫁娶的时候才会走动，平时并没有太多的利益往外。自认为和领导是亲戚，但是疏于走动，也没有给领导有什么实际的利益关系，所以，人家'
  merge: -1
