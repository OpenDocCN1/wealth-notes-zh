  img_proc: true
- pgno: 9
  md: '手机或是睡觉的制度，找一个玩手机的人，当着这个管技术的面批评这个违规的人。


    先找他商量是让他觉得你并不是针对他，而是针对这种现象，让他为以后的行为有一致性。二来相当于警告。如果不行就当众批评一个，要么真的找个这样的人，要么来个苦肉计，杀鸡儆猴。如果还是不改，就可以让手下的人指桑骂槐了，让他和员工之间产生矛盾，你来控制矛盾。


    做什么事情，不要自己和别人产生对抗，要学会转化矛盾，利用映射。


    # 如何应对强势的领导？


    【困惑】办公室新来一位总监，属于高层领导。我的职位是不上不下类型，现在每天和她两个人在一间办公室，领导很强势，要求我这，要求我那。生活细节也管，我还不能商量，确实弄得我很生气。感觉她对自己高要求，对别人也高要求。工作上高要求可以理解，但个人的习惯也要限制，就觉得过头了。晚上她加班，我还得陪，上班还得比她早。我的东西她可以随意侵占，但是她的能力方面初步观察，是挺优秀的，毕竟有经验，但是人品确实不敢恭维。帮忙出出主意，应该怎么和她相处呢？我这离职述闪的心都有了。


    【解析】下面从职场权谋分析角度给予的解答，思考谋略或是应对策略，首先就要站在对方的角度考虑问题，分清楚问题的来源或是形成的原因，我们才能真正找到应对的策略，如果只是从自己的角度走的话，就会出现迷失。


    +   一、首先站在这个新总监的位置来思考、分析为什么她会有这样的行为。


    +   1、发现人才。刚刚空降到一个新的位置，对办公室整体的情况都不了解，只能通过试探，来发现能为自己使用的人才，所以通过各种事情的要求，看他们完成的效果，来测试，发现人才。


    +   2、展示权威。新领导如果到一个地方不能很强势，尤其是女人，会被下'
  merge: -1
