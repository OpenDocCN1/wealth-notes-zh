- pgno: 174
  md: '# 新领导给我们画饼怎么办？


    【困惑】老师，新来的领导给我们画饼，我们该如何应对？


    【解析】任何的新领导上位，都会给下属展开未来美好前景图，因为这样的廉价诱饵，最容易吸引下级的奋斗，以为自己做了领导期望的事情，就能赢得领导认可和未来，其实，但凡有这样想法的，都是还没有被残酷现实洗礼的人。面对画饼，我们需要明白三个事实：


    1、画饼是虚拟诱饵，真正的利益是私下承诺。

    一个组织利益是有限的，不可能平均分配，所以，作为领导抛出一个未来的虚拟廉价诱饵，一个看到，却吃不到的胡萝卜，就能够驱动一部分理想主义者前进，谁还真的用真金白银呢？而真正的好领导，都是切切实实的当下利益承诺，看得见的好处，才是最真的关爱！锦衣玉食远比甜言蜜语来的有安全感！


    2、不是领导给多少好处，而是领导有啥好处。

    很多人一辈子都无法扭转一个概念，以为领导对自己好，自己就能够得到足够的利益。其实真实世界的游戏规则是：你对领导好，领导才会让你得到足够的利益。因为，你只有给领导提供价值了，和他的利益保持一致，他为了自己获得更多的价值，才会给你更多的价值，而不是其他。


    3、很多时候不能听领导说什么，而看怎么做。

    有句话说的好，大事开小会，小事开大会，重要的事情不开会。这背后的本质就是，领导说什么，跟谁说，什么条件说，都是基于自己的利益最大化来的，所以，虽然是公开的画饼，他也就没有太当回事。这就好比菩提老祖白天当众训斥悟空一样，半夜后院教授真经，这才是真爱，说什么重要吗？'
  merge: -1
  img_proc: true
