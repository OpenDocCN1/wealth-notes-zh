- pgno: 358
  md: '对送礼人没有安全感，情况几乎占到 70%。平时单位很少来往，向领导汇报工作都很少，彼此都不是很熟悉，贸然的就送东西，这个无论是钱还是其他，领导是绝对不敢收的，对你不熟悉，不了解，就收东西，谁知道你什么目的？或者是，在单位你表现的很无能，不合群，收你的礼，被举报风险太大。


    # 2、礼物小，不想欠人情


    很多人自以为送的很贵重，或是自己觉得不错，其实，在领导眼里，就是另一种情况了。别人都是茅台和五粮液，而你送两瓶 500 元左右的酒就觉得很大方了，但是领导还是认为你小气。没有必要为了你这点东西，欠你的人情，还有就是，你身上可能的麻烦事，相对于这点东西而言，不值得他接受。


    # 3、身子正，讨厌潜规则


    还有就是很多年轻的领导干部，对仕途还有很高的期待，严格要求自己，不想被下属的礼物所“绑架”，或是因為小礼物而失去了未来，所以拒收。还有就是没有被社会的灰色文化所侵染，自身家底比较厚，不需要这些东西，领导的需求缺口没有被打开。还有就是刚来单位没摸清情况，不敢贸然行动。


    综合来说，就是你的礼物太小，没有打开领导的需求缺口，而且领导怕你给他带来麻烦，所以直接拒收。这时候，你只能把礼物领回来。直接说“我没有其他意思，就是对你的关照感谢，我下不为例。”伸手不打笑脸人，领导并不会因为你送礼记恨你。接下来，不断的通过工作和领导建立信任，不断的研究领导需求，投其所好，送礼不能只局限在东西上，核心还是解决需求。'
