    +   3、有可能想离间你和其他人的关系。


    觉得你和要执行的任务的目标对象铁板一块，需要通过这个离间你们之间的关系，下面一盘散沙便于他的管理。


    +   4、先用再杀当垫脚石。


    武则天利用周兴来俊臣等酷吏来做黑活，迫害功臣，最后过河拆桥，这些'
