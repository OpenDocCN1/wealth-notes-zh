  md: '# 3、找人试探


    我们既找不到间谍，又没有时间去建立大数据，我们又需要短时间突破，必须立即了解领导的看法，这该怎么做？那就采用火力侦查的方式，煽动别人直接去试探领导，得出结论之后，自己调整自己的策略。《资治通鉴》第
    18 卷记载公孙弘这样一个故事：公孙弘曾经和公卿商定某一问题的处置意见，到了武帝面前，他却完全背弃了原来的约定，而迎合武帝的心意。汲黯当即在朝廷上批评公孙弘说：“齐人大多欺诈而不忠诚老实；他开始和我们一道商定此条建议，现在却全都背弃了，这是不忠！”武帝责问公孙弘，公孙弘谢罪说：“了解我的人，认为我忠；不了解我的人，认为我不忠。”武帝认为他说得对，武帝身边的亲信经常诋毁公孙弘，武帝对他却更加优待。

    如果上述三大步骤都不能消除信息不对称，唯一的办法就是利用“同心理”，看看权力心思是什么，男人的心思是什么，这个阶段的心思是什么，平时的个人风格是什么，这些建立在主观上的，而且是很容易变的东西之上。但依靠这个察言观色并不准确，但是聊胜于无，这样不一定做得对，但不会犯大的错误。所以，大家不要迷信察言观色，而是要踏踏实实的搞情报，没有准确的情报，就搞不定对手。不管这个对手是你的领导，还是你的女朋友。


    # 好处没有，该怎么办？要努力构建和领导的私人关系！


    【困惑】遇到困难事，繁琐事，棘手事，领导想到我，我要么做得好，平安度过，要么去顶锅。但是事后没有奖励，没有回报。有好处跟我没关系。时间长了，觉得领导安排给我的是垃圾任务。心有抵触。时间长了，觉得领导是贪功，推诿过错的人，不值得替领导解决工作上棘手的事，他找不'
