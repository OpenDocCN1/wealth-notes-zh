- pgno: 60
  md: '“小人利交，其利人助也！”这句话出自权谋宝典《荣枯鉴》原话是“君子不党，其祸无援也。小人利交，其利人助也！”我们首要该看明白这本书的作者是冯道，冯道是五代时期历任十朝元老的官场不倒翁。在帝国的构架中，他就是中高层。他总结的就是自己做为中高层的经验，而不是底层的经验。事实上也是如此，结党的问题是中高层，拥有一定权力的人的行为，而不是底层打工者或是一点权力没有人的活动。说白了，底层没有结党的资格。


    # 2、目的问题


    首先要明白为什么要结党，那就是打造共同的利益联盟；要么是有大的利益，自身力量不足，无法单独谋取，需要利益相关人一起行动；要么是有共同的敌人，为了减少自己的成本和损失，一起对外的努力。大家利益一致，共存共荣，所以当有难的时候，自然有人站出来帮助你，因为帮你就是帮他自己。而不是请客吃饭，给别人好处，有难了，不再给好处了，谁帮你？权谋高手结党的目的是利益联盟，互相有需求，而不是请客吃饭，你给别人好处，以为别人会帮你。


    # 3、手段问题


    作为底层，哪有什么资源构建自己的利益圈啊，就更别提用手段构建自己的团体了。作为底层能够做大的就是依靠自己的能力，依靠自己的忠诚，快速的获取上级的认可和信任，抓紧时间改变自己的底层位置，进入管理层，这才是作为底层最为重要的任务。至于同样是和自己一样底层人的，哪有功夫请他们吃饭啊。职场不是交朋友来的，是谋取利益的地方。要把自己的精力和钱花在能够提升自己的价值，帮助自己成长的人身上。服务好自己领导，这样才能迅速的升职加薪。


    之所以很多人容易产生困惑，对各种说法之间的矛盾不能理解，很多时候，都是因为，不明白作者写的文章所占的立场，出发点，以及解决什么问题，所以也就容易引用错误。再一个，还有理论和实践的匹配问题，很多人自己的亲身经历和理论不一样，觉得理论错了，其实大部分都是自己理解不'
