  md: '职位的提升，权力的谋取，都不是一朝一夕的事情，而且，机会也不是天天都有的，这就必须保持敏锐度，不断的分析各种可能，为自己可能的争权夺利做好布局，必须分析到极致。这就是孙子兵法说的，兵者国之大事，诡道也，多算胜，少算不胜。大家拼的就是极致分析，你还想偷懒？


    所以，题主的这个问题，看似简单，其实这背后就是价值观的混乱，知识上的匮乏，以及懒惰心理，导致了自己做不到，就质疑别人也做不到，庄子秋水篇就是写的这中现象“井蛙不可以语于海者，拘于虚也；夏虫不可以语于冰者，笃于时也；曲士不可以语于道者，束于教也。”所以，这不是非要在最后做广告，而是告诉大家，自己学到一个瓶颈之后，就需要报个班，找人突破，不然一直会迷茫下去。


    # 给领导 Resize? 给领导帮忙带特产，领导发红包收不收？


    【困惑】老师，顶头上司让我给他带点村里的土特产，我拿给他了，他给我发微信红包，也就一二百块的东西，我收不收，该如何回复？


    【解析】给领导帮忙，领导发的红包收不收，这个问题很常见，也很普遍，这个典型问题，主要的顾虑就是自己讨好领导都没机会，收了，多不好意思，我们分析下这个问题：


    +   1、领导不愿意在小事上欠人情


    除去底层那些占小便宜的小人物，几乎上都不会在小事情上欠人情，这样一来毁了自己的名誉，二来，数额太少，非常的划不来。所以，领导几乎不会在小事情上占便宜，欠人情，所以，领导发的红包，收下并不是大问题。红包是客气，还是真给，稳妥起见，还是看领导日常是不是爱占小便宜的人。


    +   2、彼此的关系不是取决一件事'
