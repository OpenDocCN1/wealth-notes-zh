- pgno: 265
  md: '还有一种情况，就是领导的权力不集中，也就是心有余而力不足，只能睁一只眼闭一只眼。比如说，很多老员工人浮于事的问题。提出出来，也不能立即执行，领导对这些有能力的人，一时半会也拿不出什么办法，只能听之任之。


    # 二、你的意见错


    +   1、保护你的积极性


    你可能对组织不了解，提出的意见很幼稚，领导不能打消你的积极性，所以对你的动机做出了表扬，但是内心并不认可你的方案。


    +   2、不想让你有情绪


    你的问题触动了他的利益，如果直接跟你说出来，你会有情绪，或是认为他心胸狭窄，可能有情绪，所以对你表面安抚，不想激起你的负面情绪。


    +   3、不想让你知真相


    你的问题涉及到一定的黑幕，而你却不知道其中的内情，领导又不方便给你解释，所以只能在表面上认可你，这样避免让你知道太多。


    当然了，还有可能有一定的政治斗争因素，他认为你在替人出头，背后有派系问题、动机问题、利益分配问题等。领导不方便当场有负面的表态，也会如此操作。所以很多问题我们需要具体问题具体分析，抛开政治斗争因素，任何意见的落实，都需要时机、资源和相应的权力，缺一不可，这是提意见和落实的核心。


    # 该如何利用关系？关系开发的三重境界！


    【困惑】老师，我父母都是农民，但是有个远房的亲戚是个上市公司的副总，以前觉得遥不可及，现在学了一点权谋，发现可以利用一下，该如何利用这个资源！'
