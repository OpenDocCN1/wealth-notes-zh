  img_proc: true
- pgno: 209
  md: '# 2、刚刚成功取得主任位置，但是并没有权威


    之所以，你表扬别人，下面会有人当众抬杠，其主要原因，不仅仅是年轻人的问题，重要的还是，你只是取得了位置，还没有树立起自己的权威。如果你是原地提拔，大家一开始是同事，现在你上位，大家不舒服。或是你空降过来，大家认为你不熟悉内部事务。不管什么情况，是你没有加强自己的权力。


    # 3、自己和抬杠的下属争吵，失去了挑拨机会


    做领导的最怕就是自己放弃裁判员的位置，而下场自己和队员踢球。自己和抬杠的员工争吵起来，这本身就是一个不懂权力制衡原理的行为。其实当发生这个局面时，不要陷入自我辩解，而是要调转枪口，立即对这个年轻人说，“你看看他对你有很大的意见，好吧，这个暂时不提。”这样就成功引发了下属的矛盾。


    其实还有其他的应对策略，比如说，扯虎皮做大旗，这是上级领导的意思，你有意见找上级领导提。再比如，人格攻击，动机质疑。你是不是因为自己没有当上主任而心存不满？真的想表扬一个人，就要走程序，借助集体的决议，自己私下运作施恩，这才是职场表扬一个人，拉拢一个人的真谛。黑幕操作，就是质疑，也没能力公开抬杠。


    # 为什么历史上同样的计谋，会出现截然相反的结果？


    【困惑】老师，认识你之前，也读了很多历史类，计谋类的书籍，有个问题一直想不通，为什么同样的计谋，会有不同的结果，有时候会完全相反，这里面的不稳定性，本质原因究竟是什么，请解惑！


    【解析】权谋并不是一种知识，而是一种思维方式，并没有一成不变的套路，所谓的“运用之妙，存乎于心。”其实说的就是，用权谋的思维方式'
  merge: -1
  img_proc: true
- pgno: 210
  md: '来解决问题，而不是用套路解决问题。因为套路是死的，而思路是活的。为什么，这些套路用起来，会出现不稳定性呢，因为下面三个原因：


    # 1、不同的阶段


    事情的阶段不一样策略也就不一样，比如，对待一个孩子，钱权色是没有什么作用的，不如一块糖，一个玩具来的好用。对待一个刚走出社会的年轻人，和经历过社会摧残的中年人所采用的策略也是不一样的。年轻人朝气蓬勃，理想、未来都能够吸引到他，而中年人，更加现实，少一分都不行。当然这是指人，还有事情在萌芽的阶段，很容易就能解决。但是后期复杂了，就耗费精力了。所以上工治未病，智者见于未萌，都是对阶段的强调。


    # 2、不同的环境


    外部的环境变化了，而计谋就要随之变化，不然就是刻舟求剑。比如说，在用人方面，《罗织经》说过“乱世用能，平则去患。”外部环境混乱的时候，我们要使用有能力的人才，唯才是举。但是一旦和平时代到来，有能力不听话就是一种威胁，这时候就要使用忠心的人。再比如，有共同敌人
    的话，即使之前有矛盾，也要立即合作。如果没共同敌人，即使是好朋友，此时也会因为利益的内卷化，而开始互相内斗。环境变了，一切都变了。


    # 3、不同的资源


    每个人手里的资源多寡也决定了计谋的不同，一个没有任何资源的人，睁开眼都是为了稻梁谋，哪还有精力去投资自己，哪有精力读书培训？这时候不做一条狗，去依附贵人，被人家施舍，还能怎样？但是如果自己资源丰厚，人脉广泛，能力强大，还不出去创业，等着人家逐步的视为眼中钉，肉中刺的时候，才被动出去创业吗？你想当狗，人家也会当成狼来防着。再比如做事，想投其所好，他就喜欢喝茅台，你买不起，只能望洋兴叹。所以，我们看别人的计谋成功，没有看到他的阶段、环境和资源，而盲目的套用静止的招法，自然不可能有一样的结果。这就好比同样的公式，但'
  merge: -1
  img_proc: true
- pgno: 211
  md: '是带入的不是一样的数字，结果能一样吗。就是同样的公式，同样的数字，有些人也因为自己的能力不行，而算错结果，考低分。所以，明白了上述的三点，就明白了为什么计谋会有极强的的不稳定性了。


    # 下属背叛，都是会选择在这三个时期！


    【困惑】老师，我想创业，但是发现，创业团队，都有内部撕逼的黑幕，再优秀的组织都有人员出走，为什么？这背后有什么原理？


    【解析】可以说任何一个组织的创建者，都会遇见核心层或骨干层的背叛或是叛逃，“另立门户”的灰暗时光。通常而言，都会集中出现在这三个时期，想创业的朋友，或是已经创业的朋友，都必须知道：


    +   1、组织创建期，资本原始积累之后


    组织创建时期，组织就是草台班子，没有完善的制度，大家为了自己的理想，也都没有什么怨言，身兼数职，同吃同住，同甘共苦。但是就在第一桶金到账那一刻，这个组织成员之间的矛盾陡然加大。因为没有建立起一个合理利益分配的机制，在面对巨大利益的分配时，大家就开始互相争功，互相不满，都认为自己付出很多，却得到很少，于是，最终优秀的人才拉出去单干。这可以说是对组织伤害最大的，因为这群人熟悉组织的一切，他们知道组织创建的一切秘密和手法，出去之后，就会同业竞争，而且，组织刚活下来，就会元气大伤。所以，创业无一例外，老板都会被下属这样上一课，人最痛的就是被自己人背后捅刀子。


    +   2、组织发展期，组织遭遇至暗时刻


    一个组织创建时期，只要老老实实做业务，转化已有的资源，基本上都能够立足，但是一旦完成基本积累，在市场上撕开了缺口，有了一块属于自己的底盘之后，就会遭遇来自于组织外部的危机。因为你组织的发展，必然触动外部原有的市场格局，就会触动别人的利益。俗话说，断人财路犹'
  merge: -1
  img_proc: true
- pgno: 212
  md: '如杀人父母，所以，外部的同行就会不择手段的围剿新兴企业。同行的竞争，可以说无所不用其极，会产品出问题，会组织监管，会各种谣言，一时之间，风雨飘摇，组织遇见第一次重大违纪，基本上看不见希望，这时候，外患之下必然内忧，内部能人，离心四起。组织分裂，出走。这时候的创业家，基本上腹背受敌，彻夜难眠。


    # 3、组织成熟期，没有建立权力制衡


    度过了外部危机，牢牢的站住脚之后，基本上，就会进入成熟期，组织活下来了。这时候，表面上没有了任何的问题。作为创业者，觉得终于能停下来，享受自己创业的成果了，多年的辛苦需要好好的享受来弥补。但是殊不知，怡怡这时候，暗流涌动。因为创业老板不懂权谋，对权力的放松，可能是心理上的不在意，可能是能力上有欠缺，或是管理上有漏洞。让有能力的核心层，决策层，逐步的接管了组织的大权，一步步的扩张自己的势力，最终架空了创业家，于是在一次大的成功机会出现之后，下面的阴谋家，凝聚了人心，占有了资源，就会带领团队逼宫，不同意就让组织亏损，逼宫不能就挟势出去另立门户了。


    为什么很多人会看到“兔死狗烹”会看到“杯酒释兵权”会看到“火烧庆功楼”，就是因为，创业权谋家知道，自己如果不解决这些有能力的不坚定分子，或是有威胁能力的人，或是没有共同价值观的人，最好用完之后就抛弃，不然等出现问题，为时已晚，可以说凡是创业对自己手下于心不忍的，都经历过上述的痛彻心扉，即使时隔多年，依然难以释怀。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 跑关系，其实就这点门道！


    【困惑】老大，听了咱们权谋课也觉得关系很重要，自己也不认识谁，也没有多少钱，该如何下手啊？


    【解析】走出校园之后，跑关系可以说是社会基本功。但是很多人对如何跑关系却是一头雾水：有人认为很简单，不就是请客送礼吗？其实很多人真正实战了，就知道最难的是送不出去。有人认为很复杂，觉得自己没有那么多钱，也不认识各种关系，无从下手，这都是错的。其实跑关系说来说去就是下面三点：


    1、熟悉自身资源，很多认为资源就是钱，其实这样就禁锢了自己的思维，资源就是可供自己拿出来交换的所有东西。比如美色，比如服务，比如特殊技能，再比如忠心。例如红楼梦里穷人刘姥姥，除了带土特产让有钱人换换口味，尝尝新鲜，后来是利用自己的粗俗扮丑逗大家开心，赢得了巨大的赏赐。


    2、梳理各种关系，不是每个人天生都有一大群关系，也不是谁都有一群强有力的社会关系，等着要帮助你。中国现在阶层并没有固化，谁身边大大小小都认识各种社会有能量的人，只是说和这种有能量的人关系的远近而已，要把所有有能量有关系的人全部罗列出来。不是按照个人喜好，而是按照社会能量要进行梳理。


    3、寻找利益交集不要试图在关系上一步登天，要学会一点一点的往上爬，只要别人比你能量高一点，就可以借助这个关系作为平台，交往更高层次的人。不要在乎自己的面子，而是要追求更多的交集，利用各种机会产生交集。只有产生交集，然后寻找利益结合点，就能够把这段关系给加深拓展开来，为我所用。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '最后要强调的是，跑关系，关键是投其所好，找到对方的利益需求点，没有钱就多提供其他价值，比如情绪价值、情报价值等。不要认为有点关系就可以无限度的索取，只是大家进门的这么一个机会，该花钱时不能手软。关系是需要更新换代的，关系也是需要按照远近重要性，选择连接频率的。


    # 我们如何以正确的姿势冒险？


    【困惑】权谋家是不是都是保守主义者，不敢冒险？


    【解析】权谋家并非保守主义，只是在决策的时候，对可行性做概率评估，选择大概率事件。特殊情况下，选择大概率，外在表现为冒险而已。权谋家主要在三大方面选择冒险：


    +   1、方向上：有大量成功案例的事件上


    如何做出战略选择，那就是选择大概率事件，看看之前有没有成功者，如果有，抛开一切干扰，学习成功者，尽管要承担一定的风险，但是只要坚持下去，就能够成功。举个例子，唐朝的官场高人裴矩，在隋炀帝时期，他知道谁给隋炀帝提意见，谁死。所以，人家不去做这件事情，因为做了就是冒险。但是到了，唐太宗时期，因为已经有很多成功的案例，所以，裴矩就积极的给唐太宗提意见，这就不是冒险了。如果盲目的凭借自己的感觉去提意见或是不提意见，都是冒险。


    +   2、时机上：束手无策只有唯一方案时


    俗话说，狗急跳墙。兔子急了还咬人。换个角度想，就是在最危机的时候，即使概率再低的事情，也要搏一把，总比束手无策，要强很多。其实此时，即使百分之一的低概率事件，对于当时的局面而言，也是唯一能选择的了。这百分之一的他们即使赶到目的地，也是死，而直接造反也是死，反正都是死，此时造反就成了活下来的高概率事件了。即使造反本身的成功率很低，这就是说的特殊情况。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# 3、资源上：有大量资源能够承受失败


    敢玩风险投资的人，尤其是天使轮投资的人，背后都有雄厚的大资本。因为他们可以在投资方向上赌赛道，把这个赛道上的产品都押注，有一个赢了就能够赚回所有的本钱了。所以，不怕失败的时候，能够承受失败的时候，就能够做出冒险的探索。比如说创业，很多人认为没钱才去创业，其实这样恰恰一次冒险就亏光本钱，越是穷人，越要谨慎手里的钱。只有有了丰富的积累了，亏得起了，这时候创业其实才是最好的。但是很多人搞反了。有资源了，恰恰不想创业了。

    经过上述的分析，我们能看到，权谋家即使选择了低概率事件，依然不是冒险，而是理性的选择。如果没有正确的方向支撑，仅凭自己的感觉，完全的把结果交给运气，那就是冒险。权谋家不怕失败，怕的是不在正确的方向上积累经验。只要方向上对，所有的冒险其实就是交学费，都在为未来的成功减轻阻力。另外要说明的是，如果上述的三大内容产生冲突时，按照上面的顺序优先考虑。比如，自己失业找不到工作，唯一的路就是自己摆地摊创业，但是呢，却没有失败的资本。这时候，还是要创业的，因为你已经没的选了。


    # 其他的知识都是教你往前走，只有权谋是让你往上爬！


    【困惑】学习权谋，是为了一肚子的阴谋诡计？还是为了识别防备骗子？看了老师很多文章，迷茫了。


    【解析】其实这理解是很片面的，真正的权谋学习主要是如下的三大作用！


    +   1、识别资源


    我们从小的学习，一直都是围绕着成绩展开的，很多人不知不觉的成为做题家。认为做题才是人生提升的重要手段，殊不知，走向社会之后，重要的不是做题，而是识别资源；哪里有资源，我们如何接近资源，如何的驾'
  merge: -1
  img_proc: true
- pgno: 216
  md: '驭资源，如何的转化资源。而在天朝，权力是最大的资源，而权力被具体的某个人所拥有。所以，我们就要识别哪些关系资源可以利用，哪些无效的社交可以放弃。学习权谋第一步，就是要学会识别资源所在，而不是用自己的感情，去盲目的浪费自己的时间和精力。


    # 2、拓展手段


    很多人脑子里，从小被训练成非黑即白，非此即彼的思想，这都是多年做题的教育遗毒，主要是，只有一个标准答案，只会在既有的条件下做出选择和判断，对于各种问题都是选择高大上的角度来论述。也就导致了思维的僵化和简单化，这走向社会是非常有害的。学习权谋，就要知道，达成目的路很多，没有标准答案，只有更合适当下条件的答案。没有人给你所有的答案让你选，而是你自己要先尽可能找到更多的答案，提高选择范围。最后是不要盲目高大上，要具体实用。


    # 3、提升阶层


    市面上几乎上所有的学问，都是让你往前走的，而唯独只有权谋学问是让你往上爬的。无论是自己努力干活，或是投资赚钱，都是让自己的生活越来越好，积累越来越多；但是大家都忽略了一个事实，在天朝，这都是战术级别的胜利，可能一两次失败，也就退回到老路上去。而权谋却从战略上解决问题，那就是直接提升自己的阶层，一旦自己的社会阶层提升上去之后，圈子变了，规则变了，资源变了，一切都换了一个世界，站在食物链的顶层，自然就没有生存问题。


    上述的可能大家不太理解，我举个简单的例子大家就明白了，就好比一头羊，从下训练就是如何奔跑和寻找到好的水草，这的确能够提升羊的生存能力和幸福指数，但是终极的改变，是通过训练把自己变成狼，自然就会避免被吃掉的命运，和能够看到更多的资源，因为食物不仅仅食草，而是各类的小动物。所以，权谋就是让你变成狼的学问，而不是让你做一头好羊。只有变成了狼，即使再弱的狼，也不会有像羊一样吃草的命运。所以，这就是权谋学习的目的。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 如何提升自己的思维深度？


    【困惑】老师，我就是你常说的思考起来一根筋，非黑即白那种，也想改变自己，不知如何下手，困扰我太久了，能解答下吗？


    【解析】如何让自己的思考维度复杂起来，的确是有门道的。通常我们权谋家思考都是从这三个层面来进行，加深自己的思维深度的。


    # 1、事件的阶段


    一个事件不是一成不变的，而是分为不同阶段的，而不同阶段之间，即使所面临同样的事情，也会有截然相反的手段。比如刚到职场，就要学会韬晦，还没有取得别人的好感和信任之前，就盲目的展示自己的能力，自然会让别人当成敌人和竞争对手来对待。而如果和周围的人已经和谐了关系，还依然的韬晦，而不是主动的展示自己，被人认定为平庸，那就彻底的没有崛起的机会。再比如，自己没有权力的时候可以和周围的人都搞好关系，但是有权力之后，就要利用好权力的刚性，而不是做老好人等。


    # 2、事务的性质


    事情千变万化，不过在性质上区分还是很简单的，比如，因为很多时候做人做事都是一体的，很多人区分不出轻重，所以就会很迷茫步步出错。比如说具体到职场，就是权力控制问题，还是具体工作问题。直白点，就是做人的问题，还是做事的问题。近日，越级报警的老师，事后被开除。本质就是没有搞清楚事情的性质。她心里只有被猥亵的儿童，要追究犯罪的问题。但是越过校长去报警，而不是让校长去报警，这就是让校长承担了工作不细致、有失误、被追责的情况，校长自然给她穿小鞋。


    # 3、事情的对象


    至于事情里所涉及的对象，大家最好理解了，最为直观的就是男人女人不同、职场小白和老油条不同、有权力的和没权力的不同。但是在职场，只'
  merge: -1
  img_proc: true
- pgno: 218
  md: '有一个区分，那就是对内还是对外的问题，也就是对敌人还是对友人的问题。先通过利益和感情链条的梳理、区分出敌友关系，然后呢，就要合纵连横，把自己的人搞的多多的，把敌人搞的少少的，一段时间只搞掉一个敌人，逐步的扩大自己的实力，只有这样，在职场才能够清晰的进阶。能一步步的把敌人消灭在萌芽之中，谋取更多的权利和利益。

    所以，我们进行思考的时候，就要从这三个层面来不断的细化和思考，这样就能够让自己的思维有动态的、阶层的、多面的考虑，这样不断的训练和深入，就能够快速的让自己的思考方式，有突飞猛进的进步。先分清楚阶段，再搞清楚性质，最后具体到人，这样的步骤下来，就能够理性，如果相反就
    manual 。先思考人，就容易感情用事，而感情用事，就会混乱事情的性质，继而判断错了阶段。最终让自己的思考走了弯路，表面看似考虑的很多，其实都是无用功。这一点切记。


    # 告密是职场捷径，前提是必须知道这五大要点，不然都是坑！


    【困惑】老师，听了咱们的权谋课，知道告密是职场升迁捷径，我发现顶头上司吃回扣，我想给大领导告密，你觉得可行吗？


    【解析】告密上司或是出卖朋友是个高风险、高收益、技术含量极高的权谋手段，搞不好，会被倒打一耙，得不偿失。告密前必须知道下面五大要点：


    +   1、权力安全


    告密的核心内容必须是权力安全的内容，只有这样才能排除掉自身危险。如果你告密贪污受贿，有可能是他是领导的黑手套。你告密之后，因为你知道的太多，可能会被灭口。如果你告密隐私内幕，可能揭盖子，让领导陷入困境。如果你告密强者，领导怕引火烧身，会先收拾你，避免打草惊蛇。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 2、一 步到位


    即使是权力安全的告密内容，也要有足够的量级。不能做到一击必杀，一下子扳倒对手，很快就会泄密，很快就会被人知道，自己就会得到反击，即使不会被报复，也会成为众人眼里的告密小人，最终失去了在圈子里的形象，被别人排斥和孤立。所以，不能一下子击垮，不要出手。


    # 3、巨大利益


    我们不能为了自身愤怒的情绪，为了告密而告密，为了出卖而出卖，更不能因为自身的道德感，正义感去做出举动。而是一定要有巨大的利益，因为只有巨大的利益，才能让我们去冒这么大的风险。不考虑自己的巨大收益，如果只是普通的收益，我们也无须通过告密这种手段完成。


    # 4、领导权谋


    玩权谋，就怕自以为是的想当然。你觉得告密可能获得领导的信任，但是领导却不一定都懂权谋，你一来告密，立即就从道德上认为你是小人，会从骨子里讨厌你，非但你得不到好处，还会受到鄙夷。所以，不能干，给狗嘴里塞鱼骨头的事。领导不懂权谋的，道德感强的，不能告密。


    # 5、绝地反击


    当然了上述说的都是常规手腕，如果自己被人逼到死角，这时候，就要拼死一搏的时候，那也就不用顾忌什么了，来个鱼死网破，只要你手里有他的材料，就要到处告密，到处出卖。因为兔子急了还咬人呢。所以，最后的时刻，要学会舍得一身剐，敢把皇帝拉下马。


    经过上述的分析，题主应该能够自己得出结论，那就是你告密你上司的经济问题，你根本不知道他是不是大领导的黑手套，互相勾兑；是不是现在还对老板有大用，开除不了；是不是老板已经知道，睁一只眼闭一只眼；是不是故意让他吃回扣，给他挖坑。所以，你还是多考虑下，要不要告密。'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 关于人脉的三大真相，从此再不迷茫！


    【困惑】老师，我知道关系的重要性，但是我和那些价值比我高的人交往起来压力很大，觉得我在讨好他们，而且我低价值的情况下，认识再多的人也是无效人脉，人家不会帮助我的。内心很矛盾，该怎么办？


    【解析】你的这个矛盾心理代表大多数人；因为越是底层的人，自尊心越是强，越是怕别人看不起自己，想保持一份平等、独立的尊严。所以，越是层级低的人，交往的圈子越是狭窄，只想待在自己的舒适区。但是一个真正想崛起的人，就必须知道这三大
    مطالعه真相，明白了这背后的原理，自然就能走在正确的道路上。


    # 1、价值依附


    认识高价值的人，都是想着价值索取，想从别人身上得到点什么。因为他们脑子里只有索取，但是索取，基本上是得不到什么的，高价值的人凭什么去扶贫？稍微懂点人情世故的会进行价值交换，学会了溜须拍马，给别人情绪价值；请客送礼，给别人物质价值。但是很多人不想骄纵别人，说不出讨好的话，手里没钱，无法请客送礼。这时候，就需要学到第三招，那就是价值依附。通过自己的努力，为高价值的人办事。做他们不愿做的事，不能做的事，没时间做的事。通过自己的付出，依附在高价值的人身边，从而分一杯羹。那么如何依附呢，那就是让人家用着放心，有能力，且忠心。


    # 2、榜样学习


    其实，天天想着从别人身上捞取价值的，胸怀和眼光以及格局都小了。我们和高价值的人来往，不能只局限于人家的物质价值，而是更加看重别人的精神价值。我们和别人交往只盯住物质价值，就是只想获取眼前的“鱼”，我们更重要的是要转变自己位阶和身份，谋取未来的“渔”。所以重点是'
  merge: -1
  img_proc: true
- pgno: 221
  md: '学习别人的成功经验：一方面是思维方式，我们之所以在底层，是拥有了很多错误的观念，我们必须通过比比看看，成功人哪里和我们不一样，我们要对比改进差距。另一方面是获利手段，真正的成功者人家的获利手段，和书本上绝对是不一样的，看看别人是如何的资源转化的，通过这样我们就能精准的模仿。


    # 3、圈层隔离


    很多人看了观点可能会立即跳出来杠一下，我不想依附别人，我自己创业不行吗？别人的成功经验，也已经过时了，不符合时代了，学起来没用。其实，人脉最重要的是不是物质或是精神本身，而是圈子。人是社会动物，我们更加看重的是我们交往的圈子和身份位置。有句话说的''好，‘再穷也要站在富人堆里’主要的目的不是为自己贴金，而是‘谈笑有鸿儒，往来无白丁’，让自己不受底层错误思想的影响，因为人的思维很容易受到同化，犹如种地，不长庄稼就长草。只有和正确的圈子交往，才能获得更多的信息、视野，而不是每天被这个超市打折，那个地方猪肉便宜，被这些无聊的信息所浪费时间。


    所以，对于题主而言，人家不会帮助你，没人扶贫，你换个角度想想，如何能够为别人提供点什么交换呢？即使交换不了，我们在别人身边默默的学习人家的言谈举止，做事方法，不一样能够获益匪浅？即使学不到东西，混个圈子，难道不比天天和一群屌丝吹牛骂街更好吗？即使个人现在用不到了，学会正确的观念和手段，让自己的孩子从小走在正确的道路上，岂不是赢在起跑线上，避免了重蹈覆辙吗？所以，明白了人脉的三个真相，自然能够持续不断的提升自己。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 只有达到了这五点，才算是转换了阶层！


    【困惑】你说的人脉是往上走，我想搞明白的是，什么是阶级？从打工仔通过国考，考入公务员，算是一种阶级的变化吗？


    【解析】除了通过身份地位状况以外，还必须通过经济、价值观、理想、生活方式的自我认同才能完成阶级变化。所以，转化了公务员身份，如果单一的因素的话，只是换了个老板，并不能完成阶级变化。我们详细说说阶层转变，这背后的五大支撑因素：


    1、身份地位


    身份地位，其实就是最核心的阶级指标，因为这个社会是依照权力角度来划分的。是管理者还是被管理者，这可以说是最为显著的标志，说白了，你是自己独立完成工作，还是依靠别人完成工作。通过别人来完成工作，而不是依靠自己来实现目标，权力就是身份的转化指标，我们在职场第一步就是要完成自己从个人工作到管理层的转变。


    2、经济来源


    所谓的经济，其实就是生存资源，阶层是用收入来源来区分阶级的。为什么是来源而不是多寡呢，因为很多人收入很高，但是都是用自己所有的东西来交换别人的资源，这样就会受困于自己的资源数量。而统治阶层他们的并不是依靠自己本身所拥有的交换，而是依靠对别人资源的控制和占有，来完成自己的收入的，通过掠夺、欺骗、垄断等方式的收入。


    3、价值观念


    不过呢，有些人做到领导层有了身份地位，也完成了自己对剩余价值的占有而有财务自由，但是这些人内心的价值观念并没有从底层转换过来，这些历史机遇带来的东西，其实很快就会因为自己价值观不到位，德不配位，'
  merge: -1
  img_proc: true
- pgno: 223
  md: '而逐步的退回到原有的位置和阶层。阶层中的价值观念，这背后就是对这个社会规律的正确理解和把握。依靠的不是运气，而是方法。


    # 4、理想追求


    阶层并不是一劳永逸的，越往上走，越是僧多粥少，阶层内部斗争也是愈加激烈，可以说，不进则退，因为有人要把你挤下去的。衣食无忧之后，人与人之间的不同追求，也决定了阶层的自身淘汰核心因素。很多新兴的贵族，满足于自己的物质需求，满足于异性欲望的释放，这样的人性追求，不久就会被人围捕淘汰，因为高层是把权力斗争当成乐趣的。


    # 5、生活方式


    是不是幻想上层都是喝着咖啡、玩着马术、谈个钢琴、打个高尔夫、看个芭蕾什么的？其实，人家的生活方式很简单，大多数都是天天看报告报表、天天研究人、天天寻找资源、天天玩斗争，很多人难以理解，其实看看食物链的高端就明白了，他们要不断的磨砺自己的尖牙利爪，不然自己的这身肥肉，很快就成了别人的盘中餐。所谓的高尔夫、酒会，其实都是在生意社交，不是娱乐。


    所以，如果只是通过一个工作的变化，考上公务员，而转换阶层；或是通过彩票，有了一大笔钱就转化阶层；再或者通过会打高尔夫而转化阶层，还或者通过开辆豪车就转变身份的人，其实最终都会回到底层，因为这只是其中一个因素而已。只有完成上述五大指标，才算是阶层转变。


    # 权谋家是不是表面一套，背后一套？


    【困惑】老师权谋家都是特别虚伪的一群人，是不是表面一套，背后一套？

    【解析】错了，权谋家不是两套，而是三套：说一套，想一套，做一套。


    # 1、说一套：公平正义，保护弱小'
  merge: -1
