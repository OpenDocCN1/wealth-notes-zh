- pgno: 393
  md: '打报告，要人，把你调走。不然，基本无解。


    # 21、如何反击强势的同事？


    学员：麻烦问下，我性格比较内向，属于做事多话少的人，然后我处室的一个同事经常代替我的领导给我安排活，或者领导安排的我和他合作的活，他要求先给领导看，然后再让我给他。我们主要从事文字工作。我该怎么反击啊？


    权谋网：以其人之道，还治其身！


    # 22、领导让自己做违规的事情怎么办？


    学员：领导要你做事，这事你知道是错的，但是要求你做，没出问题皆大欢喜，出问题就要你背锅，请问老师，遇到这样事情怎么办？


    权谋网：不违法的事情留下证据，通过录音、截屏等方式把领导的指示留下，便于日后推卸责任。如果违法的事情不能做，打工是求财的，不是为了坐牢的。


    # 23、要求做假账怎么办？


    学员：老师，打扰一下，我是公司财务，公司老板要我做两套账，我该不该做？做了后果可能会被税务查到隐瞒实际收入。


    权谋网：真账本，自己做个备份，关键时候拿出来，也是护身符！


    # 24、欲戴皇冠，必承其重。


    学员：老师，因为长得漂亮，身边人都很嫉妒我，背后风言风语，冷言冷语。我该怎么办？


    权谋网：自古红颜多薄命，越是漂亮的女人身边的麻烦事就越多。这就是事物本身的两面性，就好比越是聪明的人，苦恼越多，就是这个原因。漂亮的代价，就是身边男人的骚扰，女人的嫉妒，因为容貌身材无法隐藏，习惯就好了。我们享受美丽的赞美，就要承受大家的诋毁。


    # 25、自己该展示才华，还是该韬晦？


    学员：老师，你好，学习你的权谋已经快两年多了，看了很多文章，作为职场新人，到底是要展示自己的才华，还是要隐藏自己？'
  merge: -1
  img_proc: true
- pgno: 394
  md: '权谋网：这该展示自己的才华，还是该隐藏自己，主要还是看领导的胸怀，如果他嫉贤妒能，这之后，你还是隐藏点比较好，不然提前就被他赶出局了。如果领导需要有能力的人，你却毫无表现，关键时候顶不上去，也会被认为无能，打入冷宫。所以，核心不是自己的属性，而是领导或是权力，具体需要什么样的下属。因此，我们在职场最为重要的还是研究好领导的喜好和需要，这是调整自己的核心方向！


    # 26、我们要不要看外国的权谋书？


    学员：老师我又来了，我想咨询一下。《资治通鉴》要看，二十四史也要看，古今中外的书都要看，左传也要看，读书认真思考多多益善。那外国书有必要看吗？我感觉外国历史是不是不太适合中国国情呢？


    权谋网：你说的没错，外国的人文环境、历史沿革、思维方法和我们农业社会，历史延续的天朝是不一样的，这样的借鉴意义很有限，而我们自己的权谋书籍汗牛充栋，博大精深，研究自己的事情精力尚且感到不足，哪有时间去研究其他啊，当然了，如果想和外国人交往，或是自己国内的书籍差不多了，想更多拓展，也是可以的！


    # 27、中国的权谋在外国适用么？


    学员：老师，中国的权谋在外国适应么？


