- pgno: 391
  md: '性格缺陷基本上不可能完成。只是知道自己是什么样的性格，善加利用，更大程度的去避免自己的性格被人利用，学会伪装即可。


    # 15、职场是以自己利益为出发点的


    学员：领导说什么都要听吗？她不愿意得罪人，让我们去得罪。


    权谋网：领导的话，都听，都不听，都是错误的，而是要学会伪顺，表面上要极度顺从，因为没有人，喜欢不听话的下属。但是如果都去执行，很快就会被领导给当枪使。尤其是这种得罪人的事情，不能干，除非背后有领导的巨大利益回报。职场都是以自己的利益为出发点的，对自己有坏处，没利益的事情，永远不要干！


    # 16、远离没价值的人


    学员：能不能向您请教一下，每个环境下，都会有一个个性强势，嚣张跋扈的人，您认为如何与这种嚣张跋扈的人相处最佳?望有时间能回复一下，谢谢。


    权谋网：如果飞扬跋扈的人，对我们有极高的价值，这时要学会委屈自己；如果这个飞扬跋扈的人，毫无价值，让他滚！权谋家都是看人下菜，不从道德和性格去看人，而是从利用价值下手。


    # 17、展示价值，投其所好


    学员：新领导来了，如何沟通能够快速获得认可？


    权谋网：没有人愿意和烂人交往，被人认可的前提是价值。而沟通的本质就是在于深刻揣摩、把握领导意图的前提下，投其所好。所以，想快速获得新领导的认可，就要展示价值，全面搜集领导情报，积极地投其所好。'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# 18、扩大权力网要么往上发展，要么往下！


    学员：老大，我单位合并到另一个单位了，我从原来弱势单位正职变成如今的副职，依然管原来那一块，我算不算失去资源了？我怎样才能让自己在新岗位有优势啊？


    权谋网：一个人想拓展自己的权力，只有两条路，要么往上发展，和上级搞好关系，不断的提升自己的职位或是权利范围，要么不断的往下发展，把自己的部下驯化好，团结起来，铁板一块，指哪打哪。


    # 19、别因为有车祸，而不敢开车上路！


    学员：最近想要进辅警，看了很多老大的文章，是老粉丝了。害怕被领导当替罪羊，不知道要不要去考辅警，害怕。别到后来工作不成，还要吃方便面。请老大指教。


    权谋网：任何事情都有风险，考虑做不做的出发点是，风险和收益的比例。只要利益足够大，我们就可以冒险，就要花代价寻找解决Jen的方法，不能因为惧怕风险而停止不前。不能因为路上有车祸，就不敢开车上路了，这是典型的因噎废食。


    # 20、一朝天子一朝臣，改朝换代，旧臣无奈


    学员：A原来是我们部门的正处，挺喜欢我，后来她调离了，B才上去。后来我发现B不喜欢我，所以我申请去A领导的部门，找了B两回了，她都不同意。老师，有没有办法，让B同意？我实在不想在这呆了，太闹心。老师，领导老针对我，可我发现领导也没有黑材料整不了她，而且我换部门也不给我换。以上问题有解吗？


    权谋网：一朝天子一朝臣，前朝旧臣，自然不受待见，尤其可能之前还有积怨的。B刚上位，你就走，这是当众打脸，人家自然不会轻易的放过你！你对他的不满，把你放走了，你岂不是更大可能会报复？留着你，你就会有所忌惮。唯一的办法，就是找到，对你好的A领导，直接给他的上级'
  merge: -1
