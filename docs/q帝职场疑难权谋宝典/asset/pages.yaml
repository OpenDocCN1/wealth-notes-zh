    AB 之间的第三方。你谁的人都不是的话，你是大家的敌人，你没有好果子吃。


    3、我推荐你选择 A，成为你的靠山。


    因为他是你的直系领导，且工作能力强，还有就是领导亲戚，成为他的嫡系对你非常有好处。至于 B 对你的刁难，如果你成为 A 的人，自然会有 A 来保护你，不然，你如果被打击了，他不保护的话，他不但自己被
    B 敲打剪除羽翼，还有可能其他人不会归顺他了。成为 A 的嫡系，会非常简单，坚决执行他维护他就行了。职责所在，未来所在。


