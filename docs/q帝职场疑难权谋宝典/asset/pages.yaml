    additives, 不用当成整体来看待，没有特殊感情。


    # 3、断臂求生


    有时候捆绑过深无法换船的时候，这就依赖于平时的证据积累，这些对老领导不利的证据，关键时候拿出来进行交换，就能够保住自己一命，尽管之后不被信任，但是不会被牵连。


    但是如果已经完全融为一体，自己标签太过于严重，无法切割时候，这只能和老领导连为一体，共同进退，老领导毕竟还是有点资源，说不定还能一搏。所以，能够切割抓紧切割，无法切割就不要徘徊，就怕切割不净，又对老领导无法交代，进退失据。


    # 说话如何兜圈子的三大高深技巧！


    【困惑】老大，我说话太直，不知不觉得罪很多人，该如何说话兜圈子，有技巧吗？


    【解析】这个问题很典型，太多的人认为，自己有什么说什么，是一种真诚的表现，其实往往不讲究的技巧的真话，是最伤人的。所以很多人说话惹人，基本上就是从小在母亲的唠叨，父亲的沉默寡言的传统家庭里成长起来的孩子，缺乏语言技巧的观摩、学习和训练。而绕圈子可以说是我们'
  merge: -1
