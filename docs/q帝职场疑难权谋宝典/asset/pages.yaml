    +   3、人生际遇把握


    尽管人的机遇是不均等的，但是更有一句话说的 συμμε，机遇是给有准备的人的。这个在权谋意义上来说，就是做好日常工作，打造和领导的关系，进入领导的视野，磨练自己的技术，除掉潜敌。机会出现时，领导能够想到你，你又能完成任务，又没有和你抢，这才叫做把握机会。'
