    # 3、滴水之恩


    做领导的不仅仅是关注下属的事业，对于家庭的困难也要给予积极的关注，人都有困难的时候，一旦主动的替下属着想，解决生活问题，这样的雪中送碳，能够让下属愿意肝脑涂地的卖命。如果你不解决他的实际困难，很可能，他就会被人收买，直接对你背叛了。所以，关注员工后方，是领导必修课。

    我们再看个袁世凯的段子：在常人眼里，阮忠枢充其量也就是个高级点的幕僚，袁氏集团内有他不多，没他不少，但袁世凯却肯在他身上花费心思。公子哥出身的阮忠枢家产不菲，花钱似流水，加之人又风流，日渐成为风月场的常客。有一次柳巷寻欢，他和一位名叫小玉的风尘女子惺惺相惜，动了真情。小玉以身相许，要求他给自己赎身，阮忠枢满口答应。阮忠枢认为，到了他这一阶层，有点“花心”，本是寻常事，只要交了赎银就完事，没人会管。偏偏阮忠枢多了个心眼，心想：如果自己连这点“小事”都向袁世凯报告，他非但不会阻拦，还会认可自己的忠心。没承想还没等阮忠枢报告完毕，袁世凯就打断他，面色阴沉地说道：“胡闹，像这种有损声誉，上不得台面的事，你怎么能做呢？”阮忠枢看到袁世凯动了气，立刻表示以后和小玉断绝关系，不再往来。阮忠枢敢当袁世凯的面实话实说，除了表达忠心，也是有所凭待。因为袁世凯最宠幸的嫔太太沈氏就出身于花街柳巷，结果一句“胡闹”，断绝了他的思念。袁世凯看透了他的心思，提出带他去天津散散心，到了天津让他随自己先拜访一位朋友。汽车直接开进一座装饰富丽的庭院，当发现堂上红烛高照，桌上酒宴丰盛时，阮忠枢愣住了。只听管事尖着嗓子，大喊一声：“新姑爷到了。”随后由另一间房中搀扶出一位俏丽佳人，阮忠枢仔细一看正是小玉。袁世凯这才解释说：“每日忙忙碌碌脱不开身，今日才为你安排洞房花烛，迟了，迟了。”阮忠枢感激涕零，千言万语汇成一句话：“知我者，慰庭（袁世凯'
  merge: -1
