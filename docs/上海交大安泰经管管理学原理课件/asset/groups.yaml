    \ | 控制的类型与过程 |\n|  | 第14章 | 组织创新与变革 |\n\n## 教材\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_2_0.png)\n\
    \n《管理学》，编写组，高等教育出版社，2019年1月\n\n## 参考教材\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_3_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_3_1.png)\n\n- 《管理学——原理与方法》（第7版），周三多、陈传明、刘子馨、贾良定编著，2020年3月，复旦大学出版社。\n\
    - 《管理学》（第9版），[美] W. 格里芬（Ricky W. Griffin），2008年4月，中国市场出版社。\n\n## 考核方式\n\n- 课堂参与（含考勤和课堂讨论参与）10%\n\
    - 团队作业（选择一个专题研讨与演讲）20%\n- 课后作业 20%\n- 期末考试（针对课程学习内容的全面测验）50%\n\n## 第1章 管理学导论\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_5_0.png)\n\n### 第一节 管理的内涵与本质\n\n不同组织的活动形式和内容虽千姿百态，对其管理也呈现出不同特征，但**决策、组织、领导、控制以及创新**通常是其基本内涵，包括上述主要内容的管理工作的本质是对参与组织活动的不同对象进行**协调**。\n\
    \n### 一、组织与管理\n\n### （一）组织的概念\n\n| 动词 | 名词 |\n|---|---|\n| • “组织”是管理的一种职能，甚至是管理的代名词。<br>•\
    \ 为了使每个人都能以适当的方式提供目标活动所需要的贡献，首先需要进行劳动分工，然后需要对他们的分工劳动进行协调。 | • “组织”是指一群人的一种相对稳定的集合。<br>•\
    \ 组织是指一群人为了实现某个共同目标而结合起来协同行动的集合体。 |\n\n### 什么是组织？\n\n> 组织是以结构化和协作形式共同工作来实现一系列目标的群体。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_8_0.png)\n\n**表1.1 组织利用资源的例子**\n\n\
    | 组织 | 人力资源 | 财务资源 | 物质资源 | 信息资源 |\n|---|---|---|---|---|\n| 皇家荷兰壳牌石油 | 公司经理、钻井平台工人\
    \ | 利润、股东的投资 | 炼油厂、办公楼 | 销售预测、OPEC公告 |\n| 州立大学 | 教师、行政人员 | 校友捐款、政府拨款 | 计算机、校园设施\
    \ | 研究报告、政府出版物 |\n| 纽约市 | 警察、市政人员 | 税收收入、政府拨款 | 卫生设备、市政建筑 | 经济预测、犯罪统计 |\n| 杂货店\
    \ | 职员、簿记员 | 利润、所有人的投资 | 房产、展架 | 供应商价格目录、竞争对手的报纸广告 |\n\n### 一、组织与管理\n\n### （三）企业——一种特殊的社会经济组织\n\
    \n- 企业是指那些根据市场反映的社会需要来组织和安排某种商品（包括物质产品或非物质的服务）的生产和交换的社会经济单位。\n- 企业的生产活动包括：\n \
    \ - 企业生产经营的基本工作\n  - 企业产品的生产制造过程\n  - 借助特定渠道把特定产品利用特定方式转移到需要这种产品的特定消费者手中\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_11_0.png)\n\
    \n企业是在下述背景下进行上述活动的：\n\n1. 资源稀缺\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_12_0.png)\n\
    \n2. 内部活动成果需要到外部实现\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_12_1.png)\n\n3.\
    \ 产品是生产者联合劳动的成果\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_12_2.png)\n\n### 二、管理的内涵\n\
    \n### （一）管理的概念\n\n何谓管理？不同的研究者就有着各种各样的见解：\n\n- 管理就是管人；\n- 管理就是决策；\n- 管理就是研究系统运行的规律，据此设计系统运行的规则并不断调整；\n\
    - 管理就是实行计划、组织、指挥、协调和控制的过程……\n\n综上，管理就是为了有效地实现组织目标，由管理者利用相关知识、技术和方法对组织活动进行决策、组织、领导、控制并不断创新的过程。\n\
    \n### 二、管理的内涵\n\n### （二）管理的基本特征\n\n- 管理的目的是有效地实现组织预定的目标。\n- 管理的主体是具有专门知识、利用专门技术和方法来进行专门活动的管理者。\n\
    - 管理的客体是组织活动及其参与要素。\n- 管理是一个包括多阶段、多项工作的综合过程：决策、组织、领导、控制、创新……\n\n### 二、管理的内涵\n\n\
    ### （三）管理工作的内容\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_15_0.png)\n\n### 管理过程\n\
    \n- 规划与决策\n  - 设定组织目标和决定如何最有效地实现这些目标\n- 组织\n  - 决定如何对活动和资源进行组合\n- 领导\n  - 激励组织中的成员\n\
    - 控制\n  - 对活动进行监督和评估\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_16_0.png)\n\n\
    ### 管理者\n\n管理者的责任是将上述各种不同的资源加以组合和协调以实现组织的目标。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_18_0.png)\n\
    \n### 不同层次、不同职能的管理者\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_19_0.png)\n\n\
    ### 不同层次的管理者\n\n- 高层管理者\n  - 人数相对较少，负责组织的全面管理\n- 中层管理者\n  - 管理层中人数最多的一个群体，主要负责执行高层经理制定的政策和计划，监督和协调基层管理者的活动。\n\
    - 基层管理者\n  - 负责监督和协调进行实际操作的员工的工作\n\n### 不同职能的管理者\n\n- 营销经理\n- 财务经理\n- 运营经理\n-\
    \ 人力资源经理\n- 行政经理\n- 其他类型的经理\n\n### 基本的管理角色与技能\n\n不论处于哪个层次，也不论其位于哪个职能部门，管理者要想成功都必须扮演特定的角色和展示特定的技能：\n\
    \n- 完成某些特定的工作\n- 满足组织的特定需求，承担特定的责任\n\n**表 1.2 10 种基本的管理角色**\n\n| 类别 | 角色 | 典型活动\
    \ |\n|---|---|---|\n| 人际关系 | 精神领袖、领导者、联系人 | 参加新工厂落成剪彩，鼓励员工提高生产率，协调两个项目组的活动 |\n\
    | 信息 | 跟踪者、传播者、发言人 | 审读产业报告，对产业发展了然于心，发布新的组织行动的信息，发言讨论增长计划 |\n| 决策 | 企业家、扰动处理者、资源分配者、谈判者\
    \ | 提出创新的观念，解决下属部门间的冲突，审查和修改预算，同关键供应商或工会达成协议 |\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_23_0.png)\n\
    \nHenry Mintzberg\n\n### 管理技能\n\n除了扮演各种角色，管理者还需要具备许多特定的技能。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_24_0.png)\n\
    \n### 技术技能\n\n- 完成或理解组织所进行的特定工作的能力；\n- 技术技能对于基层经理最为重要。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_25_0.png)\n\
    \n### 人际关系技能\n\n- 沟通、理解和激励个人和群体的能力\n- 必须处理好以下关系：\n  - 下属\n  - 同级管理人员\n  - 上级\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_26_0.png)\n"
