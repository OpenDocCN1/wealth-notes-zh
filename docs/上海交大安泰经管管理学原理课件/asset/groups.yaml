    \n- 互动的群体和团队\n  - 被赋予决策职能的现存的群体或团队群体或团队，可以进行内部讨论、争议并就最佳方案达成一致。\n\n- 德尔菲小组\n  -\
    \ 群体决策的一种，由一组专家独立做出判断。然后再将他们的意见加以结合，实际上是取平均值。\n\n- 名义群体\n  - 成员被召集在一起，一种结构化技术，用于激发创造性、创新和观念。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_126_0.png)\n\n## 群体和团队决策的优势和劣势\n\n\
    - 优势\n  - 更多的信息和知识\n  - 获得更多的方案\n  - 最后决策更可能得到接受\n  - 加强决策的沟通\n  - 更高质量的决策\n\n\
    - 劣势\n  - 过程比个体决策更长，成本更高\n  - 可能导致妥协的决策\n  - 个体可能主导群体\n  - 出现群体思维现象\n\n## 群体思维\n\
    \n指群体和团队内妥协和和谐的愿望压倒了做出最好决策的目标时出现的现象。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_128_0.png)\n\
    \n## 二、决策与计划\n\n### （一）决策与计划\n\n- 决策与计划工作往往相互渗透、紧密联系并交织在一起。\n- 决策为计划的任务安排提供了依据，计划则为决策所选择的活动和活动方案的落实提供了实施保证。计划工作中的目标确定、任务分配、时间安排、资源配置、行动方案选择等都是不同层次的决策工作。其中目标的确定是最高层次的决策，而其他的则是常规性的决策。\n\
    \n## 二、决策与计划\n\n### （二）计划的过程\n\n筹划\n\n分析\n\n综合与交流\n\n活动\n\n## 三、决策的功能与任务\n\n###\
    \ （一）决策的功能\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_131_0.png)\n\n决策能够为组织确立明确的方向。管理是为了实现某一目标而协调不同成员行为的活动，对管理目标的决策可以为管理活动指明方向。\n\
    \n决策可以激发组织成员的积极性。有效的决策，可以激发成员的工作热情、干劲，通过决策方案的确定，达到激励人奋斗的作用。\n\n## 三、决策的功能与任务\n\
    \n### （二）决策的任务\n\n决策的任务是让组织灵活适应外部环境的变化。有效的决策系统能帮助管理者预测和确定环境变化，并对由此带来的机会和威胁做出反应。\n\
    \n决策的任务还包括调整和优化组织管理体系。企业复杂的业务需要复杂的决策系统来保证有效的管理。\n\n## 第二节 决策的类型与特征\n\n一、决策的分类\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_133_0.png)\n\n## 决策的环境\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_134_0.png)\n\
    \n## 程序化决策与非程序化决策\n\n| 特点 | 程序化决策 | 非程序化决策 |\n|---|---|---|\n| 问题类型 | 结构良好的 |\
    \ 结构不良的 |\n| 管理层级 | 较低层级 | 较高层级 |\n| 频率 | 反复性的、常规的 | 新型的、不同寻常的 |\n| 信息 | 易于获得的\
    \ | 模糊的和不全面的 |\n| 目标 | 清晰的、具体的 | 含混的 |\n| 解决问题的时框架 | 短期 | 相对长期的 |\n| 解决问题依赖于 |\
    \ 程序、规则、政策 | 主观判断、创造力 |\n\n## 第二节 决策的类型与特征\n\n## 一、决策的特征\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_137_0.png)\n\
    \n目标性\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_137_1.png)\n\n创造性\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_137_2.png)\n\
    \n可行性\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_137_3.png)\n\n整体性\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_137_4.png)\n\
    \n动态性\n\n## 第三节 决策过程与影响因素\n\n## 一、决策过程模型\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_138_0.png)\n\
    \n## 决策过程\n\n### （一）识别问题\n\n- 找出现状与预期结果的偏离。管理者所面临的问题是多方面的，有危机型问题、非危机型问题、机会型问题。\n\
    - 识别问题是决策过程的开始，以后各个阶段的活动都将围绕所识别的问题展开。如果识别问题不当，所做出的决策将无助于解决真正的问题，因而将直接影响决策效果。\n\
    \n## 决策过程\n\n### （二）诊断原因\n\n识别问题不是目的，关键还要根据各种现象诊断出问题产生的原因，这样才能考虑采取什么措施，选择哪种行动方案。可以通过尝试性地询问来发掘问题的原因。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_140_0.png)\n\n## 决策过程\n\n### （三）确定目标\n\
    \n找到问题及其原因之后，应该分析问题的各个构成要素，明确各构成要素的相互关系并确定重点，以找到本次决策所要达到的目的，即确定目标。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_141_0.png)\n"
