    - 小批生产：（4+3+2）÷3=3.0（万元）\n\n故最优方案为中批生产\n\n## 第4章 环境分析与理性决策\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_155_0.png)\n\
    \n### 第一节 组织的内外环境要素\n\n组织活动是在一定环境中进行的，组织活动方向的选择以及过程的展开都要充分考虑到既定环境的特点。环境的复杂与动态特点以及人的认知与行动能力的局限性决定了组织决策的理性与正确程度会受到一定的限制。\n\
    \n本章旨在通过对环境结构及其要素的讨论，分析理性决策的要求与限制，探讨提高决策理性以及正确程度的方法。\n\n### 一、环境分类\n\n环境是由众多因素交错而成的整体，管理学研究中有许多不同的分类方法。这里采用较常见的一种分类，即把环境分成三大层次或三个大类，即一般或宏观环境、具体或微观环境以及组织内部环境。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_157_0.png)\n\n#### 组织及其环境\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_158_0.png)\n\
    \n#### （一）一般或宏观环境\n\n任何时期对所有组织均能产生影响的外部环境因素。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_1.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_2.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_3.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_4.png)\n\
    \n#### 一般外部环境\n\n- **经济因素**：组织所在的经济系统的总体健康程度和有效性。\n- **技术因素**：一般环境中的技术因素指的是将资源转化为产品或服务的方法。\n\
    - **社会文化环境**：包括组织所在社会的顾客、习俗、价值和人口因素。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_160_0.png)\n\
    \n#### 更多的环境因素\n\n- 政治法律环境指的是政府对商业的管制和企业和政府的关系。\n- 国际环境指的是组织参与其他国家的商业或受其他国家商业的影响。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_161_0.png)\n\n#### 组织的内部环境\n\n- 企业的所有者是对企业拥有法律上的财产权利的人。\n\
    - 公司董事会是由股东选举出来的负有监督管理者、保证企业按符合股东利益最大化要求经营的治理实体。\n- 组织中的雇员也是内部环境的主要要素\n- 内部环境的最后一部分是组织的物质环境和人们所做的工作。\n\
    \n#### （四）环境各层次间的关系\n\n一般环境的改变对组织的影响往往是通过具体环境对组织产生作用力表现出来的。在组织管理中，一般环境和具体环境是相对的。\n\
    \n一般环境和具体环境还可以相互转化。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_166_0.png)\n\n\
