    # 一、组织与管理


    # （三）企业——一种特殊的社会经济组织


    +   - 企业是指那些根据市场反映的社会需要来组织和安排某种商品（包括物质产品或非物质的服务）的生产和交换的社会经济单位。

    +   - 企业的生产活动包括：


    企业生产经营的基本工作


    企业产品的生产制造过程。


    借助特定渠道把特定产品利用特定方式转移到需要这种产品的特定消费者手中


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_11_0.png)'
  - '[PAGE 12]


    # 企业是在下述背景下进行上述活动的：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_12_0.png)


    1. 资源稀缺


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_12_1.png)


    2. 内部活动成果

    需要到外部实现


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_12_2.png)


    3. 产品是生产者

    联合劳动的成果'
  - '[PAGE 13]


    # 二、管理的内涵


    # （一）管理的概念


    ➤ 何谓管理？不同的研究者就有着各种各样的见解：


    +   • 管理就是管人；

    +   • 管理就是决策；

    +   • 管理就是研究系统运行的规律，据此设计系统运行的规则并不断调整；

    +   • 管理就是实行计划、组织、指挥、协调和控制的过程……


    ➤ 综上，管理就是为了有效地实现组织目标，由管理者利用相关知识、技术和方法对组织活动进行决策、组织、领导、控制并不断创新的过程。'
  - '[PAGE 14]


    # 二、管理内涵


    # （二）管理的基本特征


    +   > 管理的目的是有效地实现组织预定的目标。


    +   > 管理的主体是具有专门知识、利用专门技术和方法来进行专门活动的管理者。


    +   > 管理的客体是组织活动及其参与要素。


    +   > 管理是一个包括多阶段、多项工作的综合过程：决策、组织、领导、控制、创新……'
  - '[PAGE 15]


    # 二、管理内涵


    （三）管理工作的内容


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_15_0.png)'
  - '[PAGE 16]


    # 管理过程


    +   > 规划与决策

    +     - 设定组织目标和决定如何最有效地实现这些目标

    +   > 组织

    +     - 决定如何对活动和资源进行组合

    +   > 领导

    +     - 激励组织中的成员

    +   > 控制

    +     - 对活动进行监督和评估


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_16_0.png)'
  - '[PAGE 17]


    <!-- no content -->'
  - '[PAGE 18]


    # 管理者


    管理者的责任是将上述各种不同的资源加以组合和协调以实现组织的目标。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_18_0.png)'
  - '[PAGE 19]


    # 不同层次、不同职能的管理者


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_19_0.png)'
  - '[PAGE 20]


    # 不同层次的管理者


    +   > 高层管理者

    +     - 人数相对较少，负责组织的全面管理

    +   > 中层管理者

    +     - 管理层中人数最多一个群体，主要负责执行高层经理制定的政策和计划，监督和协调基层管理者的活动。

    +   > 基层管理者

    +     - 负责监督和协调进行实际操作的员工的工作'
  - '[PAGE 21]


    # 不同职能的管理者


    营销经理


    财务经理


    运营经理


    人力资源经理


    行政经理


    其他类型的经理'
  - '[PAGE 22]


    # 基本的管理角色与技能


    ➢ 不论处于哪个层次，也不论其位于哪个职能部门，管理者要想成功都必须扮演特定的角色和展示特定的技能：


    +   - 完成某些特定的工作

    +   - 满足组织的特定需求承担特定的责任'
  - '[PAGE 23]


    # 表 1.2


    # 10 种基本的管理角色


    | 类别 | 角色 | 典型活动 |

    |---|---|---|

    | 人际关系 | 精神领袖，领导者，联系人 | 参加新工厂落成剪彩，鼓励员工提高生产率，协调两个项目组的活动 |

    | 信息 | 跟踪者，传播者，发言人 | 审读产业报告，对产业发展了然于心，发布新的组织行动的信息，发言讨论增长计划 |

    | 决策 | 企业家，扰动处理者，资源分配者，谈判者 | 提出创新的观念，解决下属部门间的冲突，审查和修改预算，同关键供应商或工会达成协议 |


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_23_0.png)


    Henry Mintzberg'
  - '[PAGE 24]


    # 管理技能


    除了扮演各种角色，管理者还需要具备许多特定的技能


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_24_0.png)'
  - '[PAGE 25]


    # 技术技能


    +   > 完成或理解组织所进行的特定工作的能力；

    +   > 技术技能对于基层经理最为重要。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_25_0.png)'
  - '[PAGE 26]


    # 人际关系技能


    +   - 沟通、理解和激励个人和群体的能力

    +   - 必须处理好以下关系：

    +     - 下属

    +     - 同级管理人员

    +     - 上级


