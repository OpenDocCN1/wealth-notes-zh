  mdcn: "\n\n## 决策过程\n\n### （四）制定备选方案\n\n明确了解决问题要达到的目标后，决策者要找出约束条件下的多个可行方案，并对每个行动方案的潜在结果进行预测。\n\
    \n在多数情况下，它要求决策者在一定的时间和成本约束下，对相关的组织内外环境进行调查，收集与问题有关的、有助于形成行动方案的信息进行分析。同时，决策者应当注意避免因主观偏好接受第一个找到的可行方案而中止该阶段的继续进行。在这一阶段中，创新因素的运用是最重要的，应注意与创新方法的适度结合。\n\
    \n### （五）评价、选择方案\n\n- 是否可行？\n- 是否能够满意解决问题？\n- 后续影响如何？\n\n### （六）实施和监督\n\n一项科学的决策很有可能由于实施方面的问题而无法获得预期成果，甚至导致失败。从这个意义上说，实施决策比评价、选择行动方案更重要。决策工作不仅仅是制定并选择最满意的方案，而且必须将其转化为实际行动，并制定出能够衡量其进展状况的监测指标。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_144_0.png)\n\n## 二、决策的影响因素\n\n### 环境\n\
    \n- 环境变化往往是导致企业进行变革决策的一个最直接的原因\n\n### 组织的历史\n\n- 决策通常不是在一张白纸上描绘组织的未来蓝图，而是在一定程度上对组织先前的活动进行调整。\n\
    \n### 决策者的特点\n\n- 决策者的个人特点对组织未来行动方案的选择有着至关重要的影响\n\n### 组织文化\n\n- 人们对待组织变化或变革的态度，在根本上取决于组织文化的特点，取决于组织文化所创造的价值观念和行为准则\n\
    \n## 三、决策的准则\n\n### （一）提高决策效率和效果的准则\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_146_0.png)\n\
    \n提高决策效率和效果\n\n### （二）不确定性情境下决策方案选择准则\n\n- 乐观准则\n  - 估计每个方案的最好结果\n  - 选择结果最好的行动方案\n\
    - 悲观准则\n  - 估计每个方案的最坏结果\n  - 在最坏结果中选最优\n- 等概率准则\n  - 认为方案的可能结果发生的概率相同\n  - 选择期望值最大的方案\n\
    - 最小后悔准则\n  - 先构造出一个机会损失矩阵\n  - 从机会损失矩阵的每一行中选出最大的机会损失\n  - 再从选出的机会损失中选择最小的机会损失\n\
    \n### 风险型决策方法\n\n各种状态下的收益值（万元）\n\n| 方案 | 畅销（概率 0.30） | 中等销路（概率 0.50） | 滞销（概率 0.20）\
    \ |\n| --- | --- | --- | --- |\n| 大批生产 | 21 | 12 | 9 |\n| 中批生产 | 17 | 15 | 11\
    \ |\n| 小批生产 | 4 | 3 | 2 |\n\n目标为收益最大化，故以中批生产方案为最优\n\n#### 决策树法\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_149_0.png)\n\
    \n#### （1）最大最小收益值法（小中取大）\n\n悲观主义准则、保守主义准则\n\n各种状态下的收益值（万元）\n\n| 方案 | 畅销 | 中等销路\
    \ | 滞销 | 最小收益值（万元） |\n| --- | --- | --- | --- | --- |\n| 大批生产 | 21 | 12 | 9 |\
    \ 9 |\n| 中批生产 | 17 | 15 | 11 | 11 |\n| 小批生产 | 4 | 3 | 2 | 2 |\n\n在最小收益值中选最大的（为11），因此中批生产为最优方案\n\
    \n#### （2）最大最大值法（大中取大）\n\n乐观主义准则\n\n各种状态下的收益值（万元）\n\n| 方案 | 畅销 | 中等销路 | 滞销 | 最大收益值（万元）\
    \ |\n| --- | --- | --- | --- | --- |\n| 大批生产 | 21 | 12 | 9 | 21 |\n| 中批生产 | 17\
    \ | 15 | 11 | 17 |\n| 小批生产 | 4 | 3 | 2 | 4 |\n\n最大最大值\n\n#### （3）最小最大后悔值准则\n\n\
    各种状态下的收益值及后悔值（万元）\n\n| 方案 | 畅销收益值 | 畅销后悔值 | 中等收益值 | 中等后悔值 | 滞销收益值 | 滞销后悔值 | 最大后悔值（万元）\
    \ |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 大批生产 | 21 | 0 | 12 |\
    \ 3 | 9 | 2 | 3 |\n| 中批生产 | 17 | 4 | 15 | 0 | 11 | 0 | 4 |\n| 小批生产 | 4 | 17 |\
    \ 3 | 12 | 2 | 0 | 17 |\n\n最小最大后悔值\n\n最大的最小后悔值为3，故最优方案为大批生产\n\n#### （4）等可能性准则\n\
    \n假设各种状态发生的可能性一样，求各种方案的期望值\n\n- 大批生产：（21+12+9）÷3=14.0（万元）\n- 中批生产：（17+15+11）÷3=14.3（万元）\n\
    - 小批生产：（4+3+2）÷3=3.0（万元）\n\n故最优方案为中批生产\n\n## 第4章 环境分析与理性决策\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_155_0.png)\n\
    \n### 第一节 组织的内外环境要素\n\n组织活动是在一定环境中进行的，组织活动方向的选择以及过程的展开都要充分考虑到既定环境的特点。环境的复杂与动态特点以及人的认知与行动能力的局限性决定了组织决策的理性与正确程度会受到一定的限制。\n\
    \n本章旨在通过对环境结构及其要素的讨论，分析理性决策的要求与限制，探讨提高决策理性以及正确程度的方法。\n\n### 一、环境分类\n\n环境是由众多因素交错而成的整体，管理学研究中有许多不同的分类方法。这里采用较常见的一种分类，即把环境分成三大层次或三个大类，即一般或宏观环境、具体或微观环境以及组织内部环境。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_157_0.png)\n\n#### 组织及其环境\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_158_0.png)\n\
    \n#### （一）一般或宏观环境\n\n任何时期对所有组织均能产生影响的外部环境因素。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_1.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_2.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_3.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_159_4.png)\n\
    \n#### 一般外部环境\n\n- **经济因素**：组织所在的经济系统的总体健康程度和有效性。\n- **技术因素**：一般环境中的技术因素指的是将资源转化为产品或服务的方法。\n\
    - **社会文化环境**：包括组织所在社会的顾客、习俗、价值和人口因素。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_160_0.png)\n\
    \n#### 更多的环境因素\n\n- 政治法律环境指的是政府对商业的管制和企业和政府的关系。\n- 国际环境指的是组织参与其他国家的商业或受其他国家商业的影响。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_161_0.png)\n\n#### 组织的内部环境\n\n- 企业的所有者是对企业拥有法律上的财产权利的人。\n\
    - 公司董事会是由股东选举出来的负有监督管理者、保证企业按符合股东利益最大化要求经营的治理实体。\n- 组织中的雇员也是内部环境的主要要素\n- 内部环境的最后一部分是组织的物质环境和人们所做的工作。\n\
    \n#### （四）环境各层次间的关系\n\n一般环境的改变对组织的影响往往是通过具体环境对组织产生作用力表现出来的。在组织管理中，一般环境和具体环境是相对的。\n\
    \n一般环境和具体环境还可以相互转化。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_166_0.png)\n\n\
    ### 二、环境分析的常用方法\n\n#### （一）一般环境分析方法——PEST\n\nPEST分析，就是指从政治与法律环境（P）、经济环境（E）、社会与文化环境（S）、技术环境（T）四个方面来探察、认识影响组织发展的重要因素。\n\
    \n| 主要方面 | 主要内容 |\n| --- | --- |\n| 人口 | 人口的地理分布、就业水平、收入水平、年龄、文化差别等 |\n| 经济 |\
    \ 增长率、政府收支、外贸收支及汇率、利率、通货膨胀率等 |\n| 政策与法律 | 环境保护、社会保障、反不正当竞争法以及国家的产业政策 |\n| 社会与文化\
    \ | 公民的环保意识、消费文化、就业观念、工作观念等 |\n| 科学技术 | 高新技术、工艺技术和基础研究的突破性进展 |\n\n"
