    \ 对各种接收信息的邮件和联系进行处理（如阅读期刊，现场视察） |\n| 传播者 | 把从企业以外的人以及其他下属那里收到的信息传播给组织的成员；有些是有关事实的信息，有些涉及对组织有影响的各种人的不同价值观点的解释和综合\
