    ## 从两个维度描述组织的特性


    差异化：


    - 组织划分下级单位的程度


    整体化：


    - 下级单位间必须协作工作的程度


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_291_0.png)


    ## 伍德沃德发现：


    - > 技术类型和相应的公司结构之间存在着明显的相关关系；

    - > 组织的绩效与技术和结构之间的“适应度”密切相关。

    - > 伍德沃德得出的结论：组织的结构因技术而变化。成功的企业是那些能根据技术的要求而采取合适的结构安排的企业。


    | 生产技术 | 单件生产 | 大量生产 | 连续生产 |

    |---|---|---|---|

    | 结构特征 | 低度的纵向分化<br>低度的横向分化<br>低度的正规化 | 中度的纵向分化<br>高度的横向分化<br>高度的正规化 | 高度的纵向分化<br>低度的横向分化<br>低度的正规化
    |

    | 最有效的结构 | 有机式 | 机械式 | 有机式 |


    ## 二、组织设计的影响因素


    ## （四）规模


    大型组织和小型组织在组织结构上的区别主要表现在以下四个方面：


    规范程度不同


    组织规章条例越多，组织规范性越高


    集权程度不同


    大小组织都可能高度集权，但大型组织往往通过授权的形式将决策权分散下去。


    复杂程度不同


    层级越多，管理幅度越大，组织复杂性越高


    人员结构不同


    “帕金森定律”：工作总在增长以占满分配给他的时间


    ## 二、组织设计的影响因素


    ## （五）发展阶段


    1950年，鲍尔丁提出“组织生命周期”概念。组织存在生命周期，每个发展阶段具有不同特征，同时面临着不同风险，需要调整战略以适应发展的需要，并适时调整组织结构。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_296_0.png)


    ## 三、组织设计的原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_0.png)


    目标一致原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_1.png)


    分工与协作原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_2.png)


    有效管理幅度原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_3.png)


    权责对等原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_4.png)


    柔性经济原则


    ## 二、机械式组织与有机式组织


    ➢ 英国学者伯恩斯·斯托克认为，机械式组织和有机式组织是一系列组织类型中的两个极端，而大多数组织介于二者之间。


    ## 机械式组织


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_299_0.png)


    - 一种稳定的、僵硬的结构形式

    - 追求稳定运行中的效率


    ## 有机式组织


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_299_1.png)


    - 一种松散、灵活的具有高度适应性的结构形式

    - 追求动态适应中的创新


    ## 二者特征比较：


    | 机械式组织 | 有机式组织 |

    |---|---|

    | 基于职能的高度专门化 | 基于知识与经验的专门化 |

    | 僵化的职务与权限 | 柔性的职务与权限 |

    | 基于职位的权力 | 基于专业知识的权力 |

    | 信息向高层集中 | 信息的分散与共享 |

    | 垂直的指挥与信息传递 | 水平的沟通与信息传递 |

    | 对组织的忠诚和对上级的服从 | 对工作和技术的忠诚 |

    | 强调企业固有知识 | 强调吸收外部智慧 |


    '
