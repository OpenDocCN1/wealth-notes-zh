  - '[PAGE 467]


    # 2. 豪斯的路径—目标领导理论


    ➢ 豪斯认为领导者可以根据情境的不同改变自己的领导风格，领导者在选择领导行为时主要考虑两类情境因素：下属的特征和环境的因素。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_467_0.png)'
  - '[PAGE 468]


    # 2. 豪斯的路径—目标领导理论


    # 指示型


    让下属知道他们被期望做什

    么，安排和协调工作，提供具体的指导，明确政策、规则和程序。


    # 支持型


    显示对下属的关心，创造一个友好的和心理上支持的工作环境。


    # 参与型


    遇到问题时咨询下属的意见，决策时将下属的意见和建议考虑在内。


    # 成就导向型


    设定具有挑战性的目标，寻求改进，强调卓越的绩效，并对下属能够达到高标准的绩效显示信心。'
  - "[PAGE 469]\n\n# 2. 豪斯的路径—目标领导理论\n\n# ➢ 八个命题：\n\n+   1. 当下属的任务结构含糊不清时，领导者路径—目标明确的指示型行为将提高下属的满意度。\n\
    +   \n+   2. 当下属的任务结构明确清晰时，领导者路径—目标明确的指示型行为将会令下属不满，并被视为过度控制而遭到抵制，因此起不到激励作用。\n\
    +   \n+   3. 下属自认为与任务相关的能力越高时，领导者路径—目标明确的指示型行为越不受到欢迎。\n+   \n+   4. 当参与决策的下属个人特征较强（如高度内控型、高度独立型等），而任务结构含糊不清时，参与型领导行为更令下属满意。"
  - '[PAGE 470]


    # 2. 豪斯的路径—目标领导理论


    八个命题：


    +   5. 当下属具有中度或高度的成就动机时，成就取向型领导者行为最具激励作用。

    +   6. 当工作群体成员具有任务相关的知识和经验时，由他们之间相互协调不确定性的工作将有利于群体目标的实现。

    +   7. 当下属的任务或工作环境是危险、单调、紧张或令人沮丧的，支持型领导者行为可以通过提高领导者一下属关系和自信心、减轻压力和焦虑、补偿工作中不愉快的方面等方法增加下属的努力和满意程度。

    +   8. 当下属的任务是多种多样和相互依赖的，组织中的团队规范没有很好的发展，严密监管和路径—目标明确的指示型行为将会提高满意度和绩效。'
