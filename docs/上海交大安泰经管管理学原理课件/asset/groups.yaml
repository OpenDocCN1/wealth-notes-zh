    # 2. 领导权力的来源


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_438_0.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_438_1.png)


    职位权力：与领导者的职位相关的，其在组织中的职位赋予了他们奖赏、惩罚和指挥下属的权力。


    个人权力：与职位无关，而与领导者个人的魅力或专业知识有关。'
  - '[PAGE 439]


    # 2. 领导权力的来源


    **奖赏权力**：奖赏的力量随着下属认为领导可以给予奖励或去除负面影响而增强。


    **强制权力**：这是一种惩罚的权力。假如下属工作无法达到要求，将会被领导处罚。


    **法定权力**：特定职位和角色被法定的、公认的正式权力。文化价值观、接受社会结构和合法化的任命是法定权力的三种基础。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_439_0.png)


    **参照权力**：来源于个人的特征，包括行为方式、魅力、经历、背景等。


    **专家权力**：产生于个人的专业知识或技能。'
  - '[PAGE 440]


