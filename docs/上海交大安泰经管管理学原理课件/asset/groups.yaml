    | 类型 | 研究重点 | 回答问题 | 主要内容 |

    |---|---|---|---|

    | 行为基础理论 | 人的需要 | “以什么为基础（根据），什么才能激发人的积极性” | 需要层次理论、双因素理论、成就需要理论 |

    | 过程激励理论 | 行为的发生机制 | “如何由需要引起动机，由动机推动行为，并由行为导向目标” | 包括公平理论、期望理论、目标设置理论 |

    | 行为强化理论 | 对行为的修正和固化 | “怎样使积极行为得到巩固，使消极行为得以转化” | 强化理论 |


    ### 1. 行为基础理论


    #### 1.1 需要层次理论——亚伯拉罕·马斯洛


    > 人类需要从低到高可分为五种。

    >

    > 其中生理需要、安全需要和社交需要都属于低层次的需要，通过外部条件就可以满足；尊重需要和自我实现需要是高层次的需要，是通过内部因素才能满足的。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_492_0.png)


    #### 马斯洛需要层次论


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_493_0.png)


    #### 需要层次理论


    - 人的需要有一个从低层次向高层次发展的过程。

    - 任何一种需要并不由于高一层次需要的出现而消失，各层次需要之间是相互依赖并以重叠波浪形式演进的。

    - 未满足的需要才具有激励作用。


    #### ERG理论


    将马斯洛的需要层次论压缩为三个可能相互重叠的层次：


    - E——Existence（生存），对食物、水、衣服、住所及稳定和安全的生存环境的基本需要；

    - R——Relatedness（关系），对好的人际关系、想法和感情的共享以及双向交流的需要；

    - G——Growth（成长），对自我发展、创造性和有成果的工作的需要。


    #### 1.2 双因素理论——赫茨伯格


    - 使人们感到不满意的因素往往都是属于工作环境或外界因素方面的，被称为保健因素。

    - 使人们感到满意的因素往往都是属于工作本身或工作内容方面的，被称为激励因素。

    - 保健因素只能消除不满意，激励因素才是调动人们积极性的关键。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_497_0.png)


    **局限性：**


    - 调查样本数量明显不够，而且对象是工程师、会计师等专业人士，缺乏普遍性。

    - 实际上满意与工作绩效无直接相关性，人在不满意时也会因其他原因达到高绩效；

    - 实际上保健因素与激励因素不是绝对的，而是相互联系并可以相互转化的。


    #### 1.3 成就需要理论——戴维·麦克利兰


    - 人的高层次需要有三种，分别为成就需要、权力需要和亲和需要。

    - 成就需要：争取成功，希望做得最好的需要。

    - 权力需要：影响或控制他人且不受他人控制的需要。

    - 亲和需要：建立友好、亲密的人际关系的需要。


    #### 个体的人类需要


    - 成就需要：比过去更有效地完成工作或任务的愿望。

    - 亲和需要：对人类同伴和接受的需要。

    - 权力需要：影响群体和控制环境的愿望。


    - 成就需要不是天生的，更多的是环境、教育、实践综合作用的结果。

    - 成就需要是一种更内化的需要，是导致国家、企业取得高绩效的主要动力。


    ①推动了管理者积极致力于培训个体的成就需要；“工作本身应具有挑战性”“组织应该为个体发展提供机遇”等激励措施在组织管理中很有应用价值；

    ②对成就需要与工作绩效的关系进行了十分有说服力的推断。


    忽视了满足个体低层次需要的意义。


    ### 2. 过程激励理论


    #### 2.1 公平理论——约翰·亚当斯


    - 人们对报酬是否满意是一个社会比较过程，满意的程度不仅取决于绝对报酬，更取决于相对报酬。

    - 人们对相对报酬的比较体现在横向比较和纵向比较两个方面。


    相对报酬 = O/I = 报酬（工资、奖金、津贴、晋升、表扬等） / 贡献（知识、经验、技能、资历、努力等）


    横向比较是人们将自己的相对报酬与他人的相对报酬进行比较。


    纵向比较是人们将自己当前的相对报酬与自己过去的相对报酬进行比较。


    横向比较：OP/IP vs OC/IC


    - OP——对自己所获报酬的感觉

    - IP——对自己所做投入的感觉

    - OC——对他人所获报酬的感觉

    - IC——对他人所做投入的感觉


    纵向比较：OP/IP vs OH/IH


    - OP——对自己所获报酬的感觉

    - IP——对自己所做投入的感觉

    - OH——对自己过去报酬的感觉

    - IH——对自己过去投入的感觉


    - 相对报酬比较的结果会使人们产生公平感或不公平感。不公平感会造成人们心理紧张和不平衡感。


    | 情况 | 行为 |

    |---|---|

    | OP/IP < OC/IC | 通过减少投入或设法增加报酬来改变自己的相对报酬；通过让他人多付出或设法减少其所得来改变他人的相对报酬；更换比较对象，“比上不足，比下有余”，获得主观上的公平感；自我解释，自我安慰；发牢骚，泄怨气，造成人际矛盾；离开现有岗位，另谋职业。
    |

    | OP/IP > OC/IC | 通过增加投入改变自己的相对报酬；设法让他人增加报酬以改变其相对报酬。 |

    | OP/IP < OH/IH | 通过减少投入来改变自己的相对报酬。 |

    | OP/IP > OH/IH | 不会因为自己多拿了报酬而主动增加投入。 |


    公平感是一种主观心理感受，是人们公平需要得到满足的一种直接心理体验。制约公平感的因素主要有两个方面：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_505_0.png)


    **贡献：**提出了相对报酬的概念。


    **启示：**利用公平感来调动员工的积极性是一种重要的激励手段；强调了管理者的管理行为必须遵循公正原则，以积极引导员工形成正确的公平感。


    **局限性：**


    - 不完全信息往往使社会比较脱离客观实际；主观评价易使社会比较失去客观标准；“投入”和“产出”形式的多样性使得社会比较难以进行。


    #### 2.2 期望理论——维克托·弗鲁姆


    期望理论认为激励的效果取决于两个因素：


    - 结果的价值

    - 达成结果的可能性


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_507_0.png)


    人们在预期他们的行动会给个人带来既定的成果且该成果对个人具有吸引力时，才会被激励起来去做某些事情以达到组织设置的目标。


    ```

    M = V × E

    ```


    - M：motivation，激励力

    - V：value，效价

    - E：expectancy，期望值


    - 第一种结果：M（低）=V（低）×E（低）

    - 第二种结果：M（低）=V（低）×E（高）

    - 第三种结果：M（低）=V（高）×E（低）

    - 第四种结果：M（高）=V（高）×E（高）


    激励的过程要处理好三方面的关系：


    1. **努力与绩效的关系**：如果人们主观认为通过自身努力达成预期目标的概率较高，就会产生行为的信心。

    2. **绩效与奖励的关系**：如果人们认为取得绩效后能获得合理的奖励，就会产生行为的热情。

    3. **奖励与满足需要的关系**：采用同一种奖励办法能满足的需要程度不同，能激发出工作动力也就不同。


    #### 2.3 目标设置理论——爱德温·洛克


    - 基本观点：目标本身就具有激励作用，目标能把人的需要转变为动机，使人们的行为朝着一定的方向努力，并将自己的行为结果与既定的目标相对照，及时进行调整和修正，从而实现目标。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_510_0.png)

