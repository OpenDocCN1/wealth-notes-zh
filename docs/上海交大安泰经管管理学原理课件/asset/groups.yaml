    ## 第5章 决策的实施与调整


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_203_0.png)


    ### 第一节 实施决策的计划制定


    **一、计划的本质与特征**


    计划是关于组织未来的蓝图，是对组织在未来一段时间内的目标和实现目标途径的策划与安排。一般地，人们从动词和名词两种意义上使用着“计划”一词。


    | 词性 | 含义 |

    |---|---|

    | 动词 | ● 计划（planning）是指对各种组织目标的分析、制定和调整以及对组织实现这些目标的各种可行方案的设计等一系列相关联的行为、行动或活动。
    |

    | 名词 | ● 计划（plans）就是指上述计划行动的结果，包括组织使命和目标的说明以及组织所选择的战略活动在未来不同时空的展开。 |


    **二、计划的类型与作用**


    **（一）计划的类型**


    1. 根据计划对企业经营范围影响程度和影响时间长短的不同，计划可以分为：


    - 战略规划（计划）是为实现战略目标而制定的指导资源配置、优先次序和行动步骤决定的规划；

    - 战术规划（计划）用于实现战术目标，它规定如何实施战略规划中的某一部分；

    - 作业规划（计划）关注如何实施战术规划以达成作业目标。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_205_0.png)


    2. 根据计划跨越的时间间隔长短，计划可以划分为：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_206_0.png)


    | 类型 | 说明 |

    |---|---|

    | 长期计划 | 5年以上的计划。主要是方向性和长远性的计划 |

    | 中期计划 | 1年以上到5年以内的计划。根据长期计划制定，比长期计划要详细、具体 |

    | 短期计划 | 1年及以内的计划。比中期计划更加详细、具体 |


    3. 按照所涉及活动的内容，计划可以分成：


    综合平衡法


    - 综合计划：涉及组织内部的许多部门和许多方面的活动，是一种总体性的计划

    - 专业计划：涉及组织内部某个方面或某些方面的活动计划

    - 项目计划：是组织针对某个特定课题所制定的计划

