  md: "\n## 四、巩固完善\n\n- 建立规章制度\n  - 原因：要使每一位成员从一开始就自觉地、主动地按照组织文化和组织精神的标准去行动比较困难。\n\
    - 领导者率先垂范\n  - 原因：领导者自身的模范行为具有一种感召力和导向性，对广大组织成员会产生强大的示范效应。\n- 领导者必须与组织发展方向保持言行一致，不仅活跃在组织中，而且要经常谈及组织的愿景，并日复一日地去践行。\n\
    \n## 第一节 领导的内涵与特征\n\n- 1. 领导与管理\n- 2. 领导权力的来源\n- 3. 领导三要素\n\n### 什么是领导？\n\n赫塞和布兰查德认为，领导是一个在特定情境中，通过影响个体或群体的行为来努力实现目标的过程。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_420_0.png)\n\n### 领导的性质\n\n领导是运用非强迫性影响塑造群体或组织目标，激励导向目标实现的行为，并且协助群体和组织文化的形成。\n\
    \n领导者的行为\n- 视野与指导\n- 联络员工\n- 鼓舞和激励\n- 制造变革\n\n共同行为\n\n管理者的行为\n- 规划与预算\n- 组织与人员配置\n\
    - 控制\n- 可预见性和秩序\n\n### 1、领导和管理\n\n|  | 领导 | 管理 |\n|---|---|---|\n| 职能范围不同 |  |\
    \ 管理除了领导职能，还包含了计划、组织等职能 |\n| 权力来源不同 | 领导权力来自组织赋予 | 管理权力建立在合法的组织结构基础上 |\n| 主要功能不同\
    \ | 领导能够在一定程度上实现变革 | 管理使组织高效地运转 |\n| 目标制定过程 | 领导注重宏观目标的战略 | 管理参与计划和预算过程，确定目标、安排详细步骤\
    \ |\n| 人力资源配备 | 领导通过愿景、鼓舞和激励向前进 | 管理组织、安排人员，根据需要培训专业化的人才 |\n| 计划执行方式 | 领导倾向于迎接挑战，完成任务\
    \ | 管理保证计划执行，协调和控制解决问题 |\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_422_0.png)\n\
    \n### 领导的本质\n\n- **领导的含义**\n  - 领导是一种影响力，是对人们施加影响的艺术或过程，从而使人们情愿地、真心地为实现组织或群体的目标而努力\n\
    - **三个要点：**\n  - 领导的本质——影响力；\n  - 领导是一个过程；\n  - 领导的目的在于使人们真心实意地为实现组织或群体的目标而努力\n\
    \n### 不同管理层次的管理职能\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_424_0.png)\n\n###\
    \ 领导工作\n\n- 指导、影响下属努力工作以实现组织目标的过程。\n- 实质：影响力\n- 领导工作的三要素：\n\n领导工作 = f（领导者，被领导者，环境）\n\
    \n### 领导的本质\n\n- **领导的职能**\n  - 处理与人的关系（做人的工作）；\n  - 处理与事的关系；\n  - 处理与时间的关系\n\
    - **领导的作用**\n  - 实现组织目标；\n  - 满足组织成员的需要\n\n### 领导与管理的区别\n\n- 领导是管理的一个方面，属于管理活动的范畴；\n\
    - 除了领导，管理还包括其他内容，如计划、组织、控制；\n- 领导从根本上来讲是一种影响力，是一种追随关系，使下属自觉地为实现组织目标而努力；\n- 管理是建立在合法的职权基础上对下属行为的指挥过程，下属必须服从管理者的命令，但不一定尽力；\n\
    - 管理者是组织中有一定职位并负有责任的人。\n\n### 管理者要成为领导者\n\n- 提高管理者下达的命令的有效性（命令并不总是得到执行）；\n- 在管理活动中，管理者在下达命令之前，必须采取适当的手段，使自己成为领导者，才能实现其管理目标。\n\
    \n### 领导和管理关系的归纳\n\n- 从管理者和领导者的关系来看，管理者是由组织任命产生的，其产生方式是自上而下的；而领导者则是由于群体中的某些成员的认同和追随而产生的，其产生方式是自下而上的。管理者不一定能够成为领导者，领导者也不一定是管理者；有效的管理者必须是领导者；\n\
    - 管理的对象是组织中的所有资源，而领导的对象仅仅是组织中的部分成员；\n- 管理行为追求的是提高整个组织的运行效率，而领导行为追求的是追随关系；\n- 管理者的领导行为是其管理行为的一种表现形式，是管理工作中的一个环节。\n\
    \n### 关于领导的几种认识：\n\n- 领导是一种职能，即管理者应当承担的一种责任；\n- 领导是一种管理行为；\n- 领导是一种影响力，即存在于领导者与被领导者之间的一种关系。\n\
    \n### 领导现象和领导行为\n\n- 领导现象——通过外部观察看到的领导活动；\n- 领导行为——从一个领导者的角度认为哪些工作属于领导活动，这种领导活动称为领导行为。\n\
    \n### “领导现象”的几层含义\n\n- 一个群体中存在领导现象，即存在追随关系；\n  - 思想观念上的追随；\n  - 行为上的追随；\n  - 盲目模仿的追随\n\
    - 在同一个群体中，不同追随者对领导者的追随程度不同；\n- 在同一个群体中，可能存在着多个领导者；\n- 领导现象形成的原因多种多样\n\n### 领导行为\n\
    \n- 领导行为是指这样一种现象，即群体中的某个人采用一定的方法，试图使其个人成为其他成员在某些方面的追随对象。\n\n### 特点：\n\n- 领导行为是群体中的个人行为，其目的是在其个人和其他人之间建立起追随关系；\n\
    - 一个人在群体中获得领导地位，可以采取各种不同的方法，而这些不同方法的有效性，除与方法本身有关外，还受各种其他因素的制约；\n- 任何一种领导行为，都不可能导致其他人对其行为的全面追随，追随关系只能存在于某些方面；\n\
    - 领导行为并不总是有效的。领导行为仅仅是个人行为，而这种行为能否达到其预期目的，要受各种因素的制约。\n\n### 领导现象与领导行为的关系\n\n- 在任何群体中，一般都存在领导现象；\n\
    - 有效的领导行为可以导致领导现象的产生，而无效的领导行为则不可能导致领导现象的产生；\n- 领导现象不一定是领导行为的产物\n\n### 2. 领导权力的来源\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_438_0.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_438_1.png)\n\
    \n职位权力：与领导者的职位相关的，其在组织中的职位赋予了他们奖赏、惩罚和指挥下属的权力。\n\n个人权力：与职位无关，而与领导者个人的魅力或专业知识有关。\n\
    \n**奖赏权力**：奖赏的力量随着下属认为领导可以给予奖励或去除负面影响而增强。\n\n**强制权力**：这是一种惩罚的权力。假如下属工作无法达到要求，将会被领导处罚。\n\
    \n**法定权力**：特定职位和角色被法定的、公认的正式权力。文化价值观、接受社会结构和合法化的任命是法定权力的三种基础。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_439_0.png)\n\
    \n**参照权力**：来源于个人的特征，包括行为方式、魅力、经历、背景等。\n\n**专家权力**：产生于个人的专业知识或技能。\n\n### 权力的来源\n\
    \n权力是影响他人行为的能力\n\n### 领导者权力的来源\n\n- 合法权力\n- 强制权力\n- 奖励权力\n- 专家权力\n- 参照权力\n\n###\
    \ 3. 领导三要素\n\n- 领导=f（领导者，被领导者，情境）\n- 领导者是这一行为的主体，也是权威和影响力产生的主要来源；对领导者研究主要集中于领导者的个人特质和行为特征。\n\
    - 被领导者是这一行为的客体，他们也会对领导行为的效果产生影响，因为权威真正的确立在于被领导者的接受程度，因此被领导者的特征决定了实施何种领导行为最为有效。\n\
    - 领导行为还应随着组织情境的变化而调整：既包括任务结构、职位权力、工作特征等组织内部环境，也包括社会文化等组织外部环境。\n\n### 1. 领导者特质理论\n\
    \n- 托马斯·卡莱尔（起源）\n\n“伟大人物”假设；历史是由非凡领导的力量形成的，成功的领导基于领导者个人特质\n\n- 拉尔夫·斯托格迪尔\n\n可靠性、社交性、主动性、坚持、自信、警觉、合作性、适应性。\n\
    \n- 理查德·曼恩\n\n调整能力、外向性、支配性、阳刚性、保守主义。\n\n- 马克·赫根\n\n精力充沛、随和、责任感和情绪稳定性。\n\n伯纳德·巴斯将领导特质分为不同的类型，主要有生理特性、个性以及社会特性。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_444_0.png)\n"
