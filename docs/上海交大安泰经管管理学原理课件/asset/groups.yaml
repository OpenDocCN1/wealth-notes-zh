    - 除中心人员外，组织成员的平均满意程度较低；\n- 此网络形态适用于管理人员工作任务十分繁重，需要有人选择信息、提供决策依据、节省时间而不要对组织实行有效控制的情况，但易导致信息曲解或失真，影响组织成员的士气，阻碍组织提高工作效率。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_534_0.png)\n\n## 环式沟通\n\n- 环式沟通形态可以看成是链式形态的一个封闭式控制结构，表示组织各部门或成员之间依次联络和沟通，其中每一个都可同时与两侧的部门或个人沟通信息；\n\
    - 在此网络中，组织的集中化程度和领导者的预测程度都较低，信息流动的通道不多，组织成员具有比较一致的满意度，组织的士气高昂。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_535_0.png)\n\
    \n## 全通道式沟通\n\n- 也称星式沟通，是开放式的网络形态，其中每个成员之间都有一定联系，彼此了解；\n- 此网络中组织的集中化程度及主管领导的预测程度均很低；\n\
    - 由于沟通渠道很多，组织成员的平均满意程度高且差异小，所以士气高昂，合作气氛浓厚，这对于解决问題、增强组织合作精神、提高士气均有很大作用；\n- 但是，这种网络的沟通形态渠道太多，易造成混乱，且又费时，会影响工作效率。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_536_0.png)\n\n## 非正式沟通网络\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_537_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_537_1.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_537_2.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_537_3.png)\n\n## 正式沟通渠道\n\n正式沟通渠道：正式沟通渠道是通过组织正式结构或层级系统运行，由组织内部明确的规章制度所规定的渠道进行的信息传递与交流。\n\
    \n| 类型 | 含义 | 作用 |\n|---|---|---|\n| 下行沟通 | 信息由组织中的较高层级向较低层级流动的过程。 | 传统组织内最主要的沟通渠道。\
    \ |\n| 上行沟通 | 信息由组织中较低层级向较高层级流动的过程。 | 使管理者能够了解员工的想法与需要，了解员工的工作状况。 |\n| 平行沟通 |\
    \ 信息在组织同层级之间的流动，既包括同层级的人员也包括同层级的部门。 | 减少层级之间的辗转，节约时间，提高工作效率，有利于相互间的协调与配合。 |\n\n\
    ## 跨层级与跨职能的沟通\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_539_0.png)\n\n## 下行沟通\n\
    \n- 下行沟通（向下沟通渠道）： 管理者通过向下沟通的方式传送各种指令及政策给组织的下层\n- 其中的信息一般包括：\n- 1）有关工作的指示。\n- 2）工作内容的描述。\n\
    - 3）员工应该遵循的政策、程序、规章等。\n- 4）有关员工绩效的反馈。\n- 5）希望员工自愿参加的各种活动。\n\n## 上行沟通（向上沟通渠道）\n\
    \n- 向上沟通渠道主要是指团体成员和基层管理人员通过一定的渠道与管理决策层所进行的信息交流\n- 它有两种表达形式：\n- 一是层层传递，即依据一定的组织原则和组织程序逐级向上反映。\n\
    - 二是越级反映。\n\n## 与上司的上司沟通——越级沟通\n\n- 目的：取得间接上司对你建议的认同；避免直接上司给你“穿小鞋”。\n- 需要考虑的问题：\n\
    - 间接上司与直接上司的背景；\n- 直接上司不愿接受你的建议的原因；\n- 直接上司与间接上司的关系；\n- 直接上司对越级反映问题的态度及处理艺术\n\n\
    ## 横向沟通（水平沟通渠道）\n\n- 水平沟通渠道指的是在组织系统中层次相当的个人及团体之间所进行的信息传递和交流。\n- 横向沟通可以采取正式沟通的形式，也可以采取非正式沟通的形式。\n\
    \n## 斜向沟通（交叉沟通渠道）\n\n是指信息在处于不同组织层次的没有直接隶属关系的人员或单位间的沟通。横向沟通和斜向沟通往往具有业务协调的作用。\n\n\
    ## 第二节 沟通障碍及其克服\n\n- 有效沟通的标准\n- 影响有效沟通的因素\n- 克服沟通障碍\n\n### 1. 有效沟通的标准\n\n有效沟通的标准\n\
    \n保证沟通的“量”\n\n有效沟通要保证传达足够的信息量。\n\n保证沟通的“质”\n\n沟通不仅仅是信息的传递，更重要的是信息需要被准确地表述和理解。\n\
    \n保证沟通的“时”\n\n沟通的有效性很大程度上依赖于信息的及时性。\n\n## 沟通的障碍\n\n- 有效的沟通不仅是信息的传递，更是对信息的完整、准确的理解。\n\
    - 信息传递失真：由于各种因素的影响，信息传递过程中存在失真现象。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_546_0.png)\n\
    \n信息传递失真模型\n\n### 2. 影响有效沟通的因素\n\n#### 人际障碍\n\n- 情绪\n- 选择性知觉\n- 信息过滤\n- 信息过载\n\
    \n#### 组织障碍\n\n- 组织结构不合理\n- 组织氛围不和谐\n\n#### 文化障碍\n\n- 文化相似性有助于成功的沟通，文化的差异会铸造人际沟通的障碍。\n\
    - 不同文化的差异通过自我意识、语言、穿着、饮食、时间意识、价值观、信仰、思维方式等方面表现出来。\n- 一般来说，西方社会比较注重个人发展及成就，权力距离较小，因此他们的沟通方式比较直接；\n\
    - 东方社会比较重视团队和谐，权力距离较大，在工作时，人们不希望过分突出自己，更不愿意和同事或上级发生任何明显的冲突。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_547_0.png)\n\
    \n## 常见障碍\n\n- 人为障碍：信息过滤（报喜不报忧，与管理层次及组织文化有关），有选择地接收，情绪，沟通技巧（方式）。\n- 技术障碍：绕道沟通（不合作现象），不完全沟通（编码不当、信息不全），强调不足（必要性与重要性），信息量大，前提假设不清。\n\
    - 组织障碍：地位与职权，不良人际关系，部门竞争，层次多地域散。\n\n## 沟通的障碍\n\n- 个体障碍\n  - 冲突的或不一致的信号\n  - 在相关主题方面的信誉\n\
    \  - 不愿意沟通\n  - 缺乏良好的倾听习惯\n  - 先入为主\n- 组织障碍\n  - 语义分歧\n  - 地位或权力差异\n  - 不同的知觉\n\
    \  - 噪声\n  - 过载\n  - 语言差异\n\n"
