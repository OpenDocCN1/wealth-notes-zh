    # 第三节 决策方法


    # 一、决策背景研究方法


    # (一) 决策背景的性质分析


    决策背景具有不稳定性，并对决策工作产生复杂的影响，给决策者认知、适应和改变环境带来困难。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_185_0.png)'
  - '[PAGE 186]


    # 一、决策背景研究方法


    # （二）决策背景的不确定性模型


    ➤ 在决策背景的各种性质和特点中，核心是环境中蕴含的高度不确定性。


    | 环境复杂程度 | 稳定（静态） | 不稳定（动态） |

    |---|---|---|

    | 复杂 | （Ⅱ）低—中程度不确定性<br>1. 大量的外部环境要素，而且要素不相似<br>2. 要素维持不变或缓慢变化 | （Ⅳ）高不确定性<br>1.
    大量外部环境要素，而且要素不相似<br>2. 要素常常变化且不可预测 |

    | 简单 | （Ⅰ）低不确定性<br>1. 外部环境要素少，而且要素相似<br>2. 要素维持相同或缓慢变化 | （Ⅲ）高—中程度不确定性<br>1. 少量外部环境要素，而且要素相似<br>2.
