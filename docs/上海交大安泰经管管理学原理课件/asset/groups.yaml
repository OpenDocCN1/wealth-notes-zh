    \n## 第二节 激励方法\n\n## 2、成果激励\n\n2、2精神激励\n\n含义：满足员工在精神方面的需求，有别于物质激励的无形激励。\n\n| 形式\
    \ | 含义 | 事例 |\n|---|---|---|\n| 情感激励 | 以管理者与员工之间感情联系为手段的激励方式。 | 思想沟通、排忧解难、慰问家访、交往娱乐、批评帮助、共同劳动、民主协商。\
