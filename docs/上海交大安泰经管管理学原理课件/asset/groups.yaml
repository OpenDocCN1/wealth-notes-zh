    # 二、组织文化的特征


    组织文化首先具有独特性、长期性和可塑性特征。除此之外，还有以下特征：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_395_0.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_395_1.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_395_2.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_395_3.png)'
  - '[PAGE 396]


    # 组织文化的主要特征


    +   > 独特性——每个组织都有其独特的组织文化，这是由不同的国家和民族、不同的地域、不同的时代背景以及不同的行业特点所形成的；


    +   > 稳定性——组织文化是组织在长期的发展中逐渐积累而成的，具有较强的稳定性，不会因组织结构的改变、战略的转移或产品与服务的调整而变化。一个组织中，精神文化又比物质文化具有更多的稳定性；


    +   > 综合性——组织文化由价值观、行为规范等一系列内容构成一个系统，各要素之间相互依存，相互联系。


    +   > 发展性——组织文化随着历史的积累、社会的前进、环境的变迁以及组织变革逐步演进和发展。强势、健康的文化有助于组织适应外部环境和变革，而弱势不健康的文化则可能导致组织的不良发展。'
