    # 一、控制的内涵


    +   - 控制（controlling）是指对组织内部的管理活动及其效果进行衡量和矫正，以确保组织的目标以及为此而拟定的计划得以实现。

    +   - 监督各项活动，以保证他们按计划进行并纠正各种重要偏差的过程。

    +   - 控制的内涵：

    +     - A 目的性

    +     - B 整体性

    +     - C 通过监督和纠偏来实现

    +     - D 是一个过程'
