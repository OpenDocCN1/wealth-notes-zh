    \n## 三、科层组织研究\n\n### （一）理想的科层组织体系\n\n科层组织或科层制度，通常亦被译为官僚组织、官僚政治，是一种通过公职或职位，而不是通过世袭或个人魅力来进行管理的理想的组织制度。\n\
    \n科层组织是依照下述规则来建立和组织运行的：\n\n- 作为正式职责分配日常活动；\n- 授权，并且由官员能加以控制的某种强制手段来严格地加以限制；\n\
