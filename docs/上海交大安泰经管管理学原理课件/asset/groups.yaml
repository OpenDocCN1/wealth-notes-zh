    ![](img/fb58d24fa7baa8c67e846e92bd02df61_531_4.png)'
  - '[PAGE 532]


    # 链式沟通


    +   ➢ 链式沟通是一个平行网络，其中处于两端的人只能与内侧的一个成员联系，居中的人则可分别与两人沟通信息；

    +   ➢ 在一个组织系统中，它相当于一个纵向沟通网络；

    +   ➢ 在这个网络中，信息层层传递、筛选，容易失真，每个人接收的信息差异很大，平均满意程度有较大差距；

    +   ➢ 此外，这种网络还表示组织中主管人员与下级部属之间存在若干管理者，属于控制型结构。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_532_0.png)'
  - '[PAGE 533]


    # 轮式沟通


    +   > 轮式沟通也属于控制型沟通网络形态；

    +   > 其中只有一个成员是各种信息的汇集点与传递中心；

    +   > 在组织中，这种网络表示一个主管领导直接管理几个部门的权威控制系统；

    +   > 此网络集中化程度高，解决问题的速度快；

    +   > 但沟通的渠道少，组织成员的满意程度低，士气可能低落；

    +   > 轮式网络是加强组织控制、争时间抢速度的一个有效方式。如果组织接受紧急攻关任务，又要求进行严密控制，则可采用这种网络。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_533_0.png)'
  - '[PAGE 534]


    # Y式沟通


    +   > Y式沟通是一个纵向沟通网络，其中只有一个部门或成员居于沟通的中心，成为沟通媒介；

    +   > 在组织中，这一网络形态相当于从参谋、咨询机构到组织领导，再到下级管理人员或一般成员之间的纵向关系；

    +   > 这种网络集中化程度高，解决问题速度快，组织中领导人员预测程度较高；

    +   > 除中心人员外，组织成员的平均满意程度较低；

    +   > 此网络形态适用于管理人员工作任务十分繁重，需要有人选择信息、提供决策依据、节省时间而不要对组织实行有效控制的情况，但易导致信息曲解或失真，影响组织成员的士气，阻碍组织提高工作效率。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_534_0.png)'
  - '[PAGE 535]


    # 环式沟通


    +   > 环式沟通形态可以看成是链式形态的一个封闭式控制结构，表示组织各部门或成员之间依次联络和沟通，其中每一个都可同时与两侧的部门或个人沟通信息；

    +   > 在此网络中，组织的集中化程度和领导者的预测程度都较低，信息流动的通道不多，组织成员具有比较一致的满意度，组织的士气高昂。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_535_0.png)'
  - '[PAGE 536]


    # 全通道式沟通


    +   > 也称星式沟通，是开放式的网络形态，其中每个成员之间都有一定联系，彼此了解；

    +   > 此网络中组织的集中化程度及主管领导的预测程度均很低；

    +   > 由于沟通渠道很多，组织成员的平均满意程度高且差异小，所以士气高昂，合作气氛浓厚，这对于解决问題、增强组织合作精神、提高士气均有很大作用；

    +   > 但是，这种网络的沟通形态渠道太多，易造成混乱，且又费时，会影响工作效率。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_536_0.png)'
  - '[PAGE 537]


    # 非正式沟通网络


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_537_0.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_537_1.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_537_2.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_537_3.png)'
  - '[PAGE 538]


    # 正式沟通渠道


    正式沟通渠道：正式沟通渠道是通过组织正式结构或层级系统运行，由组织内部明确的规章制度所规定的渠道进行的信息传递与交流。


    | 类型 | 含义 | 作用 |

    |---|---|---|

    | 下行沟通 | 信息由组织中的较高层级向较低层级流动的过程。 | 传统组织内最主要的沟通渠道。 |

    | 上行沟通 | 信息由组织中较低层级向较高层级流动的过程。 | 使管理者能够了解员工的想法与需要，了解员工的工作状况。 |

