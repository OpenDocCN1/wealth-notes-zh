    ## 人力资源管理的背景


    +   > 什么是人力资源管理？

    +   - HRM是组织吸引、开发和保持一支有效的员工队伍的活动


    +   > 为什么人力资源管理很重要？

    +   - 组织职能的重要组成部分之一

    +     - 甄选、培训和测评员工

    +   - 一个重要的战略工具

    +     - 人力资源管理帮助组织建立持续的竞争优势

    +   - 提升企业价值

    +     - “高绩效工作实务”能同时带来个人绩效和组织绩效的提升


