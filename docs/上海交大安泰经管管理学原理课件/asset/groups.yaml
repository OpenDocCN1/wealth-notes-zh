    # 五种冲突处理策略


    | 策略 | 特征 |

    | --- | --- |

    | 竞争策略 | 为了满足自己的利益而无视他人的利益，是一种“我赢你输”的策略；很难使对方心悦诚服，并非解决冲突的好方法。 |

    | 合作策略 | 尽可能满足双方利益，代表了冲突解决中的双赢局面。合作是通过彼此公开而具诚意的沟通，来了解彼此双方的差异所在，并努力找出可能的双赢方案，以使双方都获得最大的可能利益，但前提是必须先建立互信的基础。
    |

    | 回避策略 | 既不合作又不坚持己见，既不满足自己利益又不满足对方利益的冲突解决策略；长期使用效果不佳。 |

    | 迁就策略 | 当事人为了满足他人的需求，而抑制了自己的需求。 |

    | 妥协策略 | 当冲突双方势均力敌，希望对复杂的问题取得暂时的解决办法，或者时间紧迫需采取权宜之计时。 |'
  md: "\n## 企业内常见的沟通障碍有哪些？\n\n- 正式沟通渠道（会议、文书）不畅\n- 员工沟通的心态与观念不正确\n- 企业文化中没有鼓励沟通的内容\n\
    - 员工缺乏一些企业中常用的沟通技巧\n\n## 存在沟通障碍的几个方面\n\n- 信息发送方面的障碍；\n- 信息传递中的障碍；\n- 信息接收方面的障碍；\n\
    - 信息方面的障碍；\n- 其他方面的障碍\n\n## 3. 克服沟通障碍\n\n- A. **学会倾听**：倾听是一种积极的、主动的、有意识的思考。斯蒂芬·罗宾斯等人指出，积极倾听要做到以下步骤：\n\
    \  - 目光接触\n  - 展现赞许性的点头和恰当的面部表情\n  - 避免分心的举动或表示厌倦的动作\n  - 提问\n  - 用自己的语言复述\n \
    \ - 避免打断讲话者\n  - 不要说得太多\n  - 顺利转换倾听者与讲话者的角色\n- B. **重视反馈**：信息接收者给信息发送者一个信息，告知信息已收到，以及理解信息的程度。反馈既可以是言语的，也可以是非言语的。\n\
    - C. **克服认知差异**：信息发送者应该使信息清晰明了。尽力了解沟通对象的背景，使用信息接收者容易理解的方式选择用词和组织信息。\n- D. **抑制情绪化反应**：最简单的方法是暂停沟通直到完全恢复平静。管理者应该尽力预期员工的情绪化反应，并做好准备加以处理。同时关注自己情绪的变化，以及这种变化如何影响他人。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_552_0.png)\n\n- **提高个人沟通技巧**：\n  -\
    \ 注意倾听；\n  - 选择正确渠道；\n  - 从对方立场思考；\n  - 进行多方交流；\n- **改善组织沟通的条件**：\n  - 营造开放的气氛；\n\
    \  - 开发拓宽沟通渠道；\n  - 调整组织结构\n\n## 有效的和无效的倾听技术\n\n### 有效的倾听技术\n\n- 主动、专注\n- 注意\n\
    - 提问\n- 开放\n- 吸收信息\n\n### 无效的倾听技术\n\n- 被动、回避\n- 注意分散\n- 不提问\n- 先入之见\n- 忽视信息\n\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_555_0.png)\n\n## 第三节 冲突及其管理\n\n- 1. 冲突的概念及特征\n\
    - 2. 冲突的原因与类型\n- 3. 冲突观念的变迁\n- 4. 冲突管理\n\n### 1. 冲突的概念及特征\n\n> 冲突是相互作用的主体之间存在的不相容的行为或目标。\n\
    \n> 冲突的特征：\n\n- 客观性：冲突是客观存在的、不可避免的社会现象，是组织的本质特征之一。\n- 主观知觉性：冲突是指导致某种抵触或对立的可感知的差异。\n\
    - 二重性：冲突对于组织、群体或个人既具有建设性、有益性，有产生积极影响的可能，又具有破坏性、有害性，有产生消极影响的可能性。\n\n#### 冲突的影响\n\
    \n| 影响方面 | 积极影响 | 消极影响 |\n| --- | --- | --- |\n| 对成员心理的影响 | 使坚强者从幻觉中清醒，从陶醉中震惊，从不能战胜对方中看到自己弱点所在，发愤图强\
    \ | 带来损害，引起紧张、焦虑，使人消沉、痛苦，增加人际敌意 |\n| 对人际关系的影响 | 使人加强对对方的注意，一旦发现对方的力量、智慧等令人敬畏的品质，就会增强相互间的吸引力，团体间的冲突促进团体成员一致对外，弱化内部冲突，增强凝聚力\
    \ | 导致人与人之间的排斥、对立、威胁、攻击，使组织涣散，削弱凝聚力 |\n| 对工作动机的影响 | 使成员发现与对方之间不平衡及竞争、优胜、取得平衡的工作动机，振奋创新精神，发挥创造力\
    \ | 使成员情绪消沉，心不在焉，不愿服从与之相冲突的领导的指挥，不愿与有冲突的同事配合，破坏团结愉快气氛，减弱工作动机 |\n| 对工作协调的影响 | 使人注意到以前没有注意到的不协调，发现对方的存在价值和需要，采取有利于各方的政策加以协调，使有利于组织的各项工作得以开展\
    \ | 导致人与人之间、团体与团体之间的互不配合、互相封锁、互相拆台，破坏组织的协调统一和工作效率 |\n| 对组织绩效的影响 | 反映出认识的不正确、方案的不完善，要求全面地考虑问题，使决策更为周密\
    \ | 互相扯皮，互相攻击，转移对工作的注意力，政出多门，互不同意，降低决策和工作效率，互争人、财、物，造成资源积压、浪费 |\n| 对组织生存、发展的影响\
    \ | 冲突本身是利益分配不平衡的表现，它迫使人们通过互相妥协让步和相互制约监督调节利益关系，使各方面在可能的条件下均得到满足，维持内部的相对平衡，使组织在新的基础上得到发展\
    \ | 冲突达到一定的程度后，双方互不关心对方的整体利益，有可能使组织在内乱中濒临解体 |\n\n#### 冲突的特征：程度性\n\n| 情境 | A |\
    \ B | C |\n| --- | --- | --- | --- |\n| 冲突水平 | 低 | 适度 | 高 |\n| 冲突类型 | 破坏性冲突 |\
    \ 建设性冲突 | 破坏性冲突 |\n| 组织内部特征 | 冷漠、迟钝、对变化反应慢、缺乏新观念 | 生命力强、自我批评、有创造性 | 分裂、混乱、不合作\
    \ |\n| 组织绩效 | 低 | 高 | 低 |\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_560_0.png)\n\
    \n### 2. 冲突的原因与类型\n\n冲突的原因：\n\n- 个人差异：每个人的成长经历、家庭背景、文化水平等不同，造成个体价值观、性格特征、能力、思维方式等方面存在差异。\n\
    - 沟通差异：语义理解的困难、信息交流不充分、沟通渠道中的噪声等因素都构成了沟通障碍，并成为冲突的潜在条件。\n- 结构差异：来自组织结构本身的设计不良，而造成整合困难，最后导致冲突：专业化、任务互依性、资源稀缺、目标差异、权力分配、职责模糊等。\n\
    \n#### 冲突的类型——根据冲突发生的层次划分\n\n- **个体内冲突**：冲突发生在个体内部。它一般发生于个体面临多种难以做出的选择，此时会表现得犹豫不决，茫然不知所措。一般表现为三种类型：接近—接近型冲突、回避—回避型冲突、接近—回避型冲突。\n\
    - **人际冲突**：发生在两个或者多个人之间的冲突。许多个体差异都会导致人际冲突，如个性、价值观、目标、态度、知觉等。\n- **群体间冲突**：冲突发生在群体、团队或者部门之间。目标上的差异、对稀缺资源的竞争等原因都可能引发群体间冲突。\n\
    - **组织间冲突**：发生在两个或者多个组织之间的冲突；企业竞争就是一种组织间冲突。组织还会因为与供应商、顾客、政府机构等之间的相互依存关系而发生冲突。\n\
    \n#### 建设性冲突与破坏性冲突\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_564_0.png)\n\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_564_1.png)\n\n**建设性冲突**：对组织有积极影响的冲突。\n\
    \n表现：\n- 冲突双方都关心共同目标的实现和现有问题的解决；\n- 双方愿意了解彼此的观点，并以争论问题为中心；\n- 双方信息交流不断增加。\n\n\
    **破坏性冲突**：对组织有消极影响的冲突。\n\n表现：\n- 冲突双方极为关注自己的观点是否取胜；\n- 双方不愿听取对方意见，而是千方百计陈述自己的理由，抢占上风，人身攻击的现象时常发生；\n\
    - 双方互相交换意见的情况不断减少。\n\n#### 冲突的类型——根据冲突产生的原因来划分\n\n- **目标冲突**：由于冲突主体内部或冲突主体之间存在不一致或不相容的结果追求所引发的冲突。\n\
    - **认知冲突**：由于冲突主体内部或冲突主体之间存在不一致的看法、想法和思想而导致的冲突。\n- **情感冲突**：由于冲突主体内部或冲突主体之间情感上的不一致而引发的冲突。\n\
    - **程序冲突**：由于冲突主体内部或冲突主体之间存在不一致或不相容的优先事件选择与过程顺序安排而产生的冲突。\n\n### 3. 冲突观念的变迁\n\n\
    - 传统观念（19世纪末到20世纪40年代）\n- 人际关系观念（20世纪40年代末至70年代）\n- 相互作用观念（20世纪80年代以后）\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_566_0.png)\n\
    \n### 4. 冲突管理\n\n#### 4.1 冲突的抑制\n\n托马斯定义了冲突行为的二维空间，并组合成五种冲突处理策略。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_567_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_567_1.png)\n\n#### 五种冲突处理策略\n\n| 策略\
    \ | 特征 |\n| --- | --- |\n| 竞争策略 | 为了满足自己的利益而无视他人的利益，是一种“我赢你输”的策略；很难使对方心悦诚服，并非解决冲突的好方法。\
    \ |\n| 合作策略 | 尽可能满足双方利益，代表了冲突解决中的双赢局面。合作是通过彼此公开而具诚意的沟通，来了解彼此双方的差异所在，并努力找出可能的双赢方案，以使双方都获得最大的可能利益，但前提是必须先建立互信的基础。\
    \ |\n| 回避策略 | 既不合作又不坚持己见，既不满足自己利益又不满足对方利益的冲突解决策略；长期使用效果不佳。 |\n| 迁就策略 | 当事人为了满足他人的需求，而抑制了自己的需求。\
    \ |\n| 妥协策略 | 当冲突双方势均力敌，希望对复杂的问题取得暂时的解决办法，或者时间紧迫需采取权宜之计时。 |\n"
