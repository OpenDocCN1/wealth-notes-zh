    # 组织目标


    目标对于组织的效率是非常关键的，有许多用途。组织可以拥有几个不同的目标，但每个目标都要管理好。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_211_0.png)


    # 目标的种类


    - > 使命：关于组织基本目的的陈述。

    - > 战略目标：由组织最高层经理制定和为最高经理设定的目标。它们所关注的是宽泛、普遍的问题。

    - > 战术目标：由中层经理制定和为中层经理设定的目标。他们的重点是如何采取必要的作业行动实现战略目标。

    - > 作业目标：由低层经理制定和为低层经理设定的目标。它们关心的是同战术目标相关的短期目标。


    # 西湖大学的使命与愿景


    - > 西湖大学的使命是致力于前沿基础科学研究和博士研究生的培养，成为推动尖端基础科研成果的转化应用转型及促进基础科研与企业合作的桥梁，并将继续在交叉学科应用、尖端科技转化方面做出大胆的探索、尝试及创新。

    - > 西湖大学的的愿景是成为中国第一所民办的的综合性、世界一流的大学，创造影响世界、造福人类的科学知识和技术发展，培养具有创新精神和创新能力的高层次人才，成为支撑、推动中国未来发展的源动力。


