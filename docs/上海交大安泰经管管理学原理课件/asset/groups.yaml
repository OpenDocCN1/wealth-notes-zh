  md: "\n## 财务控制\n\n### （1）偿债能力比率：\n\n偿债能力是指组织应付应偿债务的能力。组织必须具备足够的应付能力，但又不可留有过多的闲置资金，以免造成资金的浪费。常用的偿债能力比率有：\n\
    \n偿债能力比率\n\n流动比率=流动资产/流动负债\n\n速动比率=速动资产/流动负债\n\n资产负债比率=负债总额/资产总额\n\n### （2）盈利能力比率：\n\
    \n盈利能力比率是一个组织的获利性指标，它反映了组织的盈利能力和经营业绩。盈利能力比率是重要而常用的控制指标。常用的盈利能力比率有：\n\n盈利能力比率\n\
    \n总资产收益率=某个经营时期的利润总额/该期占用的全部资产\n\n销售利润率=销售净利润/销售总额\n\n## 市场控制\n\n市场控制的层次：\n\n\
    公司层\n\n在公司层次上，市场控制通常用于规范独立的事业（业务）部门，每个事业（业务）部门都是利润中心，企业高层管理人员一般使用盈亏指标对事业（业务）部门进行绩效评估。\n\
    \n部门层\n\n部门层次的市场控制表现为公司内部交易。\n转移定价就是企业运用市场机制调整内部交易的一种方法。\n\n个人层\n\n个人层次上的市场控制常常表现为激励制度和工资制度。\n\
    \n## 层级控制、市场控制与团体控制\n\n### 三、团体控制\n\n- ● 团体控制（clan control）是指将个体融入团体之中，将个人的价值观与组织的价值观和目标相统一，通过团体的共同行为范式来实现组织成员的自我约束和自我控制。\n\
    \n团队控制的动因：\n\n- ◆ 主要来自于组织成员和工作性质的变化、控制环境的变化、雇佣关系的变化。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_621_0.png)\n\
    \n## 团体控制\n\n团体控制的实施：\n\n组织文化是团体控制的基础。有效的团体控制需要：\n\n团体控制的实施\n\n构建创新的组织文化\n\n创建响应顾客需求的文化\n\
    \n创建良好的职场精神\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_622_0.png)\n\n## 第五节 质量控制方法\n\
    \n### 一、工作质量与过程控制\n\n- 1、产品质量和工作质量\n\n● 质量分为产品质量和工作质量，产品质量代表着企业经营的结果，工作质量意味着企业对经营成果产出过程的控制。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_623_0.png)\n\n### 2、质量管理的发展\n\n质量管理是指确定质量方针、目标和职责，并通过质量体系中的质量策划、质量控制、质量保证和质量改进来实现管理职能的全部活动。\n\
    \n20c 20-30d\n质量检验管理阶段\n\n20c 40-50d\n统计质量控制阶段\n\n20c 60-70d\n全面质量管理阶段\n\n20c\
    \ 80d至今\n质量管理国际化阶段\n\n### 3、过程控制优化\n\n- > 过程控制不仅是对产品提供全过程的管理，而且包括各方面业务过程的协调。\n\
    - > 从根本上进行过程控制优化的方法被称为业务流程再造，就是从顾客的需要出发，重新整合企业资源，形成跨越职能部门边界、直达客户的横向的业务流程体系，达到更好、更省、更快的目的。\n\
    - > 过程控制优化的基本方法是根据价值原则不断对业务流程体系进行系统化改造。\n\n## 第五节　质量控制方法\n\n### 二、全面质量管理方法\n\n\
    - • 根据国际标准化组织（ISO 8402：1994）的界定，全面质量管理（total quality management，TQM）是指“一个组织以质量为中心，以全员参与为基础，目的在于通过让顾客满意和本组织所有者、员工、供方、合作伙伴或社会等相关者受益而达到长期成功的一种管理途径”。\n\
    - • 全面质量管理的基本要求是“三全一多”，即全过程的质量管理、全员的质量管理、全组织的质量管理和多方法的质量管理。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_626_0.png)\n\
    \n## 第五节　质量控制方法\n\n### 三、六西格码管理方法\n\n- • 六西格码管理（6σ）是一种建立在统计标准基础上、被设计用来减少瑕疵率以帮助降低成本、节省时间和提高顾客满意度的质量控制方法。\n\
    - • 宗旨：消除无增值活动，缩短生产周期，提高客户的满意度。\n- • 指导思想：重视从组织整体的角度，站在顾客的立场上考虑问题，采用科学的方法，在组织经营的所有领域追求无缺陷的质量，最大限度地减少组织的经营成本，提高竞争力。\n\
    - • 作用：六西格玛管理将组织的注意力同时集中在顾客和组织两个方面，有利于降低成本和产品缺陷率，有利于缩短生产周期，有利于提高市场占有率和投资回报率，有利于提高顾客满意度。\n\
    \n## 第六节 管理控制的信息技术\n\n### 信息与信息技术\n\n信息是经过加工处理后对组织管理的决策和目标实现有参考价值的数据。信息技术是对信息进行采集、传输、存储、加工、表达和应用的各种技术的总称，主要包括计算机技术、通信技术和传感技术。\n\
    \n- 企业\n  - 供应链管理信息化（SCM）；\n  - 生产过程信息化，如物料需求计划（MRP）\n  - 营销与服务信息化，如客户关系管理（CRM）等\n\
    \  - 管理过程信息化，如管理信息系统（MIS）、企业资源计划（ERP）等\n\n- 政府\n  - 政府间的电子政务（G2G）\n  - 政府对企业的电子政务（G2B）\n\
    \  - 政府对公民的电子政务（G2C）\n\n## 作为信息处理者的管理者\n\n信息数据\n\n管理者\n一些信息被存储进来以备日后使用\n一些信息相互结合起来形成新信息\n\
    \n一些信息立即得到应用\n\n一些信息被丢弃\n\n一些信息被传给了其他人\n\n## 信息技术在管理控制中的作用\n\n信息技术的作用\n\n提升管理信息的处理速度与质量\n\
    \n丰富了管理控制的方法手段\n\n改善了管理控制的效果\n"
