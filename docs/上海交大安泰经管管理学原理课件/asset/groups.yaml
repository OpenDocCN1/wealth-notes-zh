    # 财务控制


    # （1）偿债能力比率：


    偿债能力是指组织应付应偿债务的能力。组织必须具备足够的应付能力，但又不可留有过多的闲置资金，以免造成资金的浪费。常用的偿债能力比率有：


    偿债能力比率


    流动比率=流动资产/流动负债


    速动比率=速动资产/流动负债


    资产负债比率=负债总额/资产总额'
  - '[PAGE 617]


    # 财务控制


    # （2）盈利能力比率：


    盈利能力比率是一个组织的获利性指标，它反映了组织的盈利能力和经营业绩。盈利能力比率是重要而常用的控制指标。常用的盈利能力比率有：


    盈利能力比率


    总资产收益率=某个经营时期的利润总额/该期占用的全部资产


    销售利润率=销售净利润/销售总额'
