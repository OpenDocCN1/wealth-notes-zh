    ## （二）计划编制的方法

    # 1. 滚动计划法


    - • 含义：努力保证长期、中期、短期计划相互衔接的一种方法。

    - • 基本思想：“近具体、远概略”。

    - • 根据计划在具体实施过程中发现的差异和问题，不断分析原因，并结合对内外环境情况的分析，予以修改和调整。在计划的实施过程中将远期计划逐渐予以具体化，使之成为可实施的计划，进而把长期计划与短期计划，甚至与具体的执行计划有机地结合起来。


