    # 建设性冲突与破坏性冲突


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_564_0.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_564_1.png)


    建设性冲突：对组织有积极影响的冲突。

    表现：冲突双方都关心共同目标的实现和现有问题的解决；

    双方愿意了解彼此的观点，并以争论问题为中心；

    双方信息交流不断增加。


    破坏性冲突：对组织有消极影响的冲突。

    表现：冲突双方极为关注自己的观点是否取胜；

    双方不愿听取对方意见，而是千方百计陈述自己的理由，抢占上风，人身攻击的现象时常发生；

    双方互相交换意见的情况不断减少。'
  - '[PAGE 565]


    # 2. 冲突的原因与类型


    冲突的类型——根据冲突产生的原因来划分


    # 目标冲突


    由于冲突主体内部或冲突主体之间存在不一致或不相容的结果追求所引发的冲突。


    # 认知冲突


    由于冲突主体内部或冲突主体之间存在不一致的看法、想法和思想而导致的冲突。


    # 情感冲突


    由于冲突主体内部或冲突主体之间情感上的不一致而引发的冲突。


    # 程序冲突


    由于冲突主体内部或冲突主体之间存在不一致或不相容的优先事件选择一过程顺序安排而产生的冲突。'
