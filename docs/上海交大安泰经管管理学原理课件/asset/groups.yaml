    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_308_0.png)\n\n## 宽跨度组织（扁平结构）\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_309_0.png)\n\
    \n管理跨度窄小，管理层次就多；管理跨度宽大，管理层次就少\n\n## 四、组织结构的演变趋势\n\n### （二）柔性化\n\n- 概念：通过设置协调岗位、临时委员会或工作团队的形式加强组织内部的横向联系、增强组织机动性的一种趋势。\n\
    - 方式：充分发挥非正式组织的作用；加强横向沟通。\n\n| 情况 | 横向沟通措施 |\n|---|---|\n| 特定直线部门之间需要频繁联系 | 联络官\
    \ |\n| 为了解决直线部门间的共同问题 | 临时委员会 |\n| 从组织层面解决横向合作问题 | 协调人员 |\n\n## 四、组织结构的演变趋势\n\n\
    ### （三）无边界化\n\n在构建组织结构时，不是按照某种预先设定的结构来限定组织的横向、纵向和外部边界，而是力求打破和取消组织边界，以保持组织的灵活性和有效运营。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_311_0.png)\n\n## （四）虚拟化\n\n- 1. 电子商务组织的虚拟化：通过信息和资源整合创造巨大的价值；形成一个以网络为载体的创业生态系统。\n\
    - 2. 动态网络虚拟组织：以项目为中心，通过与其他组织建立研发、生产制造、营销、售后服务等业务合同网，有效发挥核心业务专长的核心型组织形式。\n- 3.\
    \ 市场链将市场经济中的利益调节机制引入企业内部，在集团宏观调控下，把企业内部的业务关系由原来的单纯行政关系转变成平等的买卖关系、服务关系和契约关系，把订单转变成一系列内部的市场订单，形成以订单为中心、上下工序和岗位间相互咬合、自行调节运行的市场链（SST）。\n\
    \n## 网络型组织结构\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_313_0.png)\n\n## 网络型组织结构\n\
    \n- 网络结构的优点：对于新技术、时尚或者来自海外的低成本竞争具有更大的适应性和应变能力。\n- 网络结构的缺点：管理者将大部分时间花在协调和控制外部关系上。\n\
    - 网络结构适用的企业：玩具和服装制造企业等。这些企业需要相当大的灵活性以及对时尚的变化作出迅速的反应。\n\n## 第三节 组织整合\n\n组织结构确定后，如何解决以下问题：\n\
    \n如何在正式组织中发挥非正式组织的作用，消除其消极影响？\n\n如何处理组织中同时存在的两种不同类型的管理者——直线和参谋的关系？\n\n组织层级内、层级之间如何进行协调？\n\
    \n组织整合\n\n## 一、正式组织与非正式组织的整合\n\n### （一）正式组织\n\n两个或两个以上的人民围绕一个共同目标并经过有意识的、处于系统关系的物的要素、人的要素和社会要素组成的有机整体。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_316_0.png)\n\n## 一、正式组织与非正式组织的整合\n\n\
    ### （二）非正式组织\n\n独立于正式组织目标之外，以人际关系和谐为导向，以非理性为行为逻辑，受潜在的不成文规定约束的个体组成的集合体。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_317_0.png)\n\
    \n## 一、正式组织与非正式组织的整合\n\n正式组织和非正式组织的区别：\n\n| | 正式组织 | 非正式组织 |\n|---|---|---|\n\
    | 目标不同 | 存在明确的目标，以目标为导向开展活动，更加重视活动为组织带来的效益。 | 并不存在明确稳定的共同目标，追求的是和谐的人际关系和成员的归属感、满足感。\
    \ |\n| 行为逻辑不同 | 要求成员按照组织人格行事，通过非人格化的规章制度约束成员的行为。 | 尊重参与者的个人人格，通过与组织目标无关的约定俗成的规则限制其行为，参与者的行为受情感支配。\
    \ |\n| 结合紧密程度不同 | 严格的管理层级和岗位职责。 | 不存在明确的结构和层级，信息传递的通道完全是开放的、发散的。 |\n| 权威来源不同 |\
    \ 领导者的权威更多地来自职位性因素。 | 并没有稳定的领导者，权威来自参与者的非职位性因素。 |\n| 联系 | 非正式组织在正式组织之间或依附于正式组织成立；非正式组织对正式组织的活动产生影响。\
    \ | 非正式组织在正式组织之间或依附于正式组织成立；非正式组织对正式组织的活动产生影响。 |\n\n## 一、正式组织与非正式组织的整合\n\n### （三）非正式组织与正式组织的整合\n\
    \n重视非正式组织的作用\n\n- 满足组织成员的需要\n- 促进组织内部沟通\n- 增加组织成员间的默契，增强凝聚力\n- 有利于组织活动的有序开展\n\n\
    减少非正式组织的消极影响\n\n- 提高决策参与性，避免目标冲突\n- 加强沟通与信息共享，避免小道消息蔓延\n- 对非正式组织进行正确引导\n- 鼓励各级管理者参与非正式组织的活动，树立权威\n\
    - 营造有利于整合的组织文化和氛围\n\n## 二、层级整合\n\n### （一）管理幅度设计\n\n- 部门化：将若干职位组合在一起的依据和方式。\n-\
    \ 五种通用的部门化方式：\n  - 职能部门化：依据所履行的职能来组合工作。\n  - 产品部门化：产品或服务的要求组合工作。\n  - 地区部门化：按照地理区域进行工作的组合。\n\
    \  - 过程部门化：按照工作或业务流程来组合工作\n  - 顾客部门化：根据目标顾客的不同利益需求来组合工作\n\n## 二、层级整合\n\n### （一）管理幅度设计\n\
    \n- 当组织规模一定的时候，管理幅度与管理层级成反比例关系\n- 影响因素：工作能力；工作内容和性质；工作条件与环境；成员的差异性。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_321_0.png)\n\
    \n图 6-7 管理幅度与组织层级之间的关系\n"
