    # 2. 豪斯的路径—目标领导理论


    +   > 基本观点：领导者的工作是提供必要的帮助与指导，激励下属达到他们的目标。

    +   > 两个重要命题：

    +   > - 领导者的行为是否被下属接受和令下属满意，取决于在多大程度上下属将其视为即时满足来源或是将来带来满足的工具。

    +   > - 领导者的行为是否有激励作用，取决于在多大程度上这种行为使得下属需求的满足依赖于有效的工作绩效，以及这种行为为下属取得有效的工作绩效提供必要的辅导、指导、支持和奖励。'
