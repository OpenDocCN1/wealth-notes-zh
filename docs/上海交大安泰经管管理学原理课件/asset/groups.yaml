    \n## 常见的控制关键点\n\n- 人力资源\n  - 主要考虑员工人数、工资成本、缺勤与迟到、员工申诉以及工作表现等；\n- 经营状况\n  - 侧重于供应物资、存货盘存、生产进度表、生产标准、成本标准、产品及业务质量等；\n\
    - 财务状况\n  - 侧重于获取资本、资本结构、年度总收入、总支出，以及现金管理等。\n\n## 控制标准的确定方法\n\n- 统计计算法\n- 经验估计法\n\
    - 工程方法\n\n## 控制标准的基本要求\n\n- 简明性\n- 适用性\n- 一致性\n- 可行性\n- 可操作性\n- 相对稳定性\n- 前瞻性\n\
    \n## 控制标准的类型\n\n定性标准：主要是有关服务质量、组织形象等方面的，一般难以定量化。\n\n定量标准：便于度量和比较，是控制标准的主要表现形式。如时间标准，生产率标准，消耗标准，质量标准，品质标准。\n\
    \n## 常见的关键控制点的标准分类\n\n- 实物标准（非货币）——操作层，运用于资源消耗等方面\n- 费用标准——操作层\n- 资本标准——如投资报酬率\n\
