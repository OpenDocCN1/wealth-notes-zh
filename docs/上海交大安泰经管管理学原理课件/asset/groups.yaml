  md: "\n## 岗位要求和工作岗位设计\n\n工作分析（岗位分析）——Job Analysis:\nAn assessment that defines jobs\
    \ and the behaviors necessary to perform them.\n\n### 需回答的问题\n\n- 应当做些什么？\n- 什么时间做？\n\
    - 在哪里做？\n- 为什么做？\n- 由谁来做？\n- 他（她）必须了解什么才能做？\n- 他（她）必须具备哪些基本技能才能做好它？\n\n### 收集职务分析的信息的方法\n\
    \n- 面谈\n- 问卷\n- 直接观察（现场、录像等）\n- 工作日志分析\n- 技术方法\n\n### 得到两份文件\n\n- 工作描述（Job description）：根据上述职务分析编写，主要陈述工作目的、工作内容、技术要求、岗位责任、工作环境以及与其他工作岗位的关系等。\n\
    - 工作规范（Job specification）：陈述担当某项具体职务的人必须具备的资格，其中包括：技能要求、教育程度、工作经历等，用于指导招聘和挑选应征者。\n\
    \n### 工作分析（岗位分析）的作用\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_348_0.png)\n\n\
    - 职务分析\n- 工作描述与工作规范书\n- 人力资源计划\n- 人员招聘、选拔与录用\n- 人员绩效考核\n- 人员报酬\n- 人员培训与开发\n\n\
    ### 职务分析的作用\n\n- 有助于人力资源管理规划科学化\n- 有助于招聘、选拔和录用合格人才\n- 有助于人员绩效考核工作的实施\n- 有助于实现公平合理的报酬\n\
    - 有助于设计有效的人员培训与开发的方案\n\n### 三、人员配备的原则\n\n- 任人唯贤原则\n- 程序化、规范化原则\n- 因事择人、因材器使原则\n\
    - 量才使用、用人所长原则\n- 动态平衡原则\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_350_0.png)\n\
    \n## 第二节 人员选聘\n\n### 一、人员的来源\n\n**（一）组织内部人员**\n\n组织内成员晋升、职位调动和工作轮换等。内部选聘的最大优点是能提高组织选聘的效益。\n\
    \n**（二）组织外部人员**\n\n外部选聘是管理者通过对组织人事资料的检索，查明和确认在职人员中确实无人能够胜任和填补职位空缺时，从社会中选聘人员。\n\
    \n**组织外部人员来源**\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_352_0.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_352_1.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_352_2.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_352_3.png)\n\
    \n**外聘的优缺点**\n\n**优点**\n\n- 能给组织带来新观念、新思想、新技术和新方法\n- 能较客观地评价组织工作，洞察存在的问题\n- 外聘费用通常比培训一个内部成员要便宜\n\
    - 使用灵活\n\n**缺点**\n\n- 可能挫伤内部成员的工作积极性\n- 需要较长调整时间来适应组织环境和工作\n- 外聘管理人员可能照搬老经验来管理新组织，而忽视了调整自身来适应该组织\n\
    \n### 二、人员选聘的标准\n\n**（一）人员技能与岗位职责相匹配**\n\n这就需要进行工作分析，明确岗位职责，把选聘职位的工作内容、特点与对人员的技能要求等编制成职位说明书，让应聘者知道岗位的任职条件。选聘人员的技能与组织岗位相匹配，是人员选聘的基本标准。\n\
    \n**（二）人员个性与岗位特点相匹配**\n\n选聘前一定要清楚把新聘人员放在哪个位置，该岗位对人员个性等有哪些要求，还要考虑新聘人员的职业取向以及可能的升迁位置等，这样选聘来的人员才能“对号入座”，发挥自身的价值。\n\
    \n**（三）人员价值观与组织价值观相匹配**\n\n价值观支配个体行为。组织成员对组织忠诚度的高低与其对组织价值观的认同度有密切关系。所以，应当向应聘人员开诚布公地讲明本组织的优劣势、提倡什么和反对什么、组织文化的特点等，让应聘者权衡选择。这样组织虽然有可能失去一些优秀人员，但更能增加成员的稳定性。\n\
    \n### 三、人员选聘的途径与方法\n\n**（一）组织内部选聘的途径与方法**\n\n- 当组织内某一岗位空缺时，首先应考虑从现有成员中调剂解决，或是在组织内按照有关标准考评提拔。\n\
    - 如果组织内部管理制度有效，组织成员的工作作风良好，组织不想改变目前的状况，就可以用内部选聘的方式。\n\n**优点**\n\n- 可以提供激励因素和培养组织成员的忠诚度\n\
    - 省时、省力、省资金\n- 人与事的更好结合\n\n**缺点**\n\n- 不利于引入新思想\n- 人际关系复杂，人际矛盾加剧，导致经营思想保守、墨守成规等\n\
    - 产生不公正现象和庇护关系\n\n**1. 组织内部人员的提升**\n\n提升内部成员是填补组织内部空缺的最好办法。不仅可以将有管理才能的成员放在更合适的位置上，更重要的是对组织成员的工作积极性能产生激励作用。\n\
    \n要使内部提升计划取得成功，必须做好以下几项工作：\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_357_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_358_0.png)\n\n**2. 组织内部职位的调动**\n\n\
    组织将组织成员从原来的岗位调往同一层次的空缺岗位去工作。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_359_0.png)\n\
    \n**（二）组织外部人员招聘**\n\n**1. 外部招聘的途径**\n\n- 职业介绍机构与人才交流市场\n  \n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_361_0.png)\n\
    \n- 猎头公司\n  \n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_361_1.png)\n\n- 校园选聘\n\
    \  \n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_361_2.png)\n\n- 公开招聘\n  \n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_361_3.png)\n\
    \n**2. 外部招聘的方式**\n\n- （1）招聘广告：利用报纸、杂志、电视和电台发布招聘信息。\n- （2）网上招聘：通过计算机网络向公众发布招聘信息。能快速及时地传递信息；传播面也极为广泛（可以波及国外）。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_363_0.png)\n\n**3. 外部招聘的程序**\n\n**准备筹划阶段**\n\
    \n确定招聘计划和招聘组织；拟定招聘方案；确定区域、范围和报名时间等；报批并办理有关手续\n\n**宣传报名阶段**\n\n- 发布招聘信息并宣传\n- 受理报名\n\
    \n**全面考评阶段**\n\n- 初试\n- 笔试\n- 面试\n- 体检\n\n### 四、人员录用\n\n**（一）人员录用的方式及注意事项**\n\n\
    人员录用是依据选拔的结果做出录用决策并进行安置的活动，其中关键的内容是做好录用决策。\n\n| 录用方式 |\n| --- |\n| 多重淘汰式 |\n|\
    \ 补偿式 |\n| 结合法 |\n\n**人员录用决策的注意事项**\n\n- 尽量使用全面衡量的方法\n- 减少做出决策的人员，提高决策效率\n- 不能求全责备，录用人员的时候分清主要问题和主要方面\n\
    \n**（二）人员录用流程**\n\n**录用准备**\n\n- 制定计划、发布信息\n\n**录用甄选**\n\n- 筛选简历、组织考评\n\n**录用实施**\n\
    \n- 择优录用、办理手续\n\n**录用评估**\n\n- 总结评价、经验归档\n\n## 第三节 人事考评\n\n### 一、人事考评的功能与要素\n\n\
    **（一）人事考评的功能**\n\n- 实现组织绩效目标的有力工具\n- 有助于形成激励机制\n- 是促进组织成员共同协调发展的反馈机制\n\n### 绩效考评的内容与作用\n\
    \n内容：考“德”、“能”、“勤”、“绩”\n\n作用：\n\n- 为确定员工报酬提供依据（贡献与报酬对等原则）\n- 为人事调整提供依据\n- 为实施奖惩提供依据\n\
    - 为员工培训提供依据\n- 促进员工自我成长\n"
