    # 组织文化


    是一个组织由其价值观、信念、仪式、符号、处事方式等组成的其特有的文化形象。


    +   - 组织文化是指组织中的成员共有的价值体系（组织的个性）；

    +   - 优秀的组织文化将自动告诉员工什么是对的，什么不对，他们应当怎样做。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_387_0.png)'
