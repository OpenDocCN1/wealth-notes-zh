    \n有效的沟通不仅包括信息的传递，还包括信息的被理解。\n\n## 沟通的意义\n\n- ➢ 沟通从来都是管理者工作的一部分。\n  \n- ➢ 管理者所做的**每件事**中都包含着沟通：\n\
    \  - 管理者没有信息就不能决策，而信息只能通过沟通得到；\n  - 一旦作出决策，又要进行沟通，否则将没有人知道已经作出决策。\n  \n- ➢ 最好的想法、最有创见的建议、最优秀的计划，不通过沟通都无法实施。\n\
    \n## 正确理解沟通\n\n- 沟通(Communication)——是由一个人向另一个人传递信息的过程；\n- 沟通包含着意思的传递；\n- 如果信息或想法没有被传送到，则意味着沟通没有发生；\n\
    - 要使沟通成功，意思不仅需要被传递，还要被理解；\n- 沟通——意思的传递与理解；\n- 完美的沟通——经过传递之后被接受者感知到的信息与发送者发出的信息完全一致；\n\
    - 有效的沟通：使收到的信息同发出的信息尽可能一致的过程\n\n## 第一节 沟通与沟通类型\n\n2. 沟通的过程\n\n任何沟通必须具备三个基本条件：\n\
    \n- 两个或两个以上的主题；\n- 一定的沟通客体，即信息情报等；\n- 传递信息情报的载体，如文件等。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_527_0.png)\n\
    \n## 第一节 沟通与沟通类型\n\n## 2. 沟通的过程\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_528_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_528_1.png)\n\n## 第一节 沟通与沟通类型\n\n##\
    \ 3. 沟通类型与渠道\n\n## 3.2 正式沟通与非正式沟通\n\n## 正式沟通\n\n含义：通过组织明文规定的渠道进行的信息传递与交流。\n\n\
    优点：其沟通效果较好、约束力较强、易于保密。一般重要的信息会采用这种沟通方式。\n\n缺点：由于正式沟通依靠组织系统层层传递，沟通速度比较慢，而且显得较为刻板。\n\
    \n## 非正式沟通\n\n含义：正式沟通渠道以外进行的信息传递和交流。\n\n优点：沟通方便，内容广泛，方式灵活，沟通速度快，可传播一些不便正式沟通的信息；能提供一些正式沟通中难以获得的信息。\n\
    \n缺点：比较难控制，传递的信息往往不确定性高，容易传播流言蜚语而混淆视听。\n"
  mdcn: "\n\n## 目标对人们努力程度的影响取决于四个方面\n\n## 目标明确性\n\n具体的目标要优于空泛的目标。\n\n第1部分\n\n## 目标难易性\n\
    \n有一定难度的目标比唾手可得的目标要好。\n\n第2部分\n\n## 目标责任清晰度\n\n责任清晰的目标比责任不明的目标好。\n\n第3部分\n\n##\
    \ 目标接受度\n\n人们接受的目标将提高其实现目标过程中的自觉性与主动性。\n\n第4部分\n\n## 3. 行为强化理论——斯金纳\n\n基本观点：人们出于某种动机，会采取一定的行为作用于环境；当这种行为的后果对人们有利时，这种行为就会在以后重复出现；反之，当这种行为的结果对人们不利时，这种行为就会减少或消失。\n\
    \n强化，在本质上讲是对某一行为的肯定或否定的结果，其在一定程度上会决定该行为在今后是否重复发生。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_512_0.png)\n\
    \n## 3. 行为强化理论——斯金纳\n\n强化的分类：\n\n- 依据强化的目的\n  - 正强化：通过出现积极的、令人愉快的结果而使某种行为得到加强；\n\
    \  - 负强化：预先告知某种不符合要求的行为或不良绩效可能引起的后果，引导职工按要求行事，回避令人不愉快的处境；\n  - 惩罚：对令人不快或不希望的行为给予处罚，以减少或削弱该行为；\n\
    \  - 自然消退：通过不提供个人所期望的结果来减少某行为的发生。\n\n| 行为对象时机 | 令人愉快或希望的事件 | 令人不快或不希望的事件 |\n|---|---|---|\n\
    | 事件的出现 | 正强化（行为变得更加可能发生） | 惩罚（行为变得更不可能发生） |\n| 事件的取消 | 自然消退（行为变得不可能发生） | 负强化（行为变得更加可能发生）\
    \ |\n\n## 3. 行为强化理论——斯金纳\n\n- ➢ 强化的分类：\n  - 依据强化的目的\n    - 依据强化的方式\n\n| 类型 | 说明\
    \ |\n|---|---|\n| 连续强化 | 对每个行为都给予强化。 |\n| 间断强化 | 并非对所有行为都进行强化：固定比率的强化、可变比率的强化、固定时间间隔的强化、可变时间间隔的强化等。\
    \ |\n\n## 表 16.1\n\n## 强化理论的要素\n\n| 强化类型 |  |\n|---|---|\n| 1. 积极强化。通过提供希望的结果强化行为。\
    \ | 3. 惩罚。运用消极结果或不愉快的结果减少不希望行为的方法。 |\n| 2. 逃避。通过逃避不希望的行为强化行为。 | 4. 消退。通过忽视而减少不希望的行为。\
    \ |\n| 实施强化的计划 |  |\n| 1. 固定间隔。在固定的时间间隔实施强化，不论行为是否发生。 | 3. 固定比例。在固定数量的行为出现后实施强化，不考虑时间期限。\
    \ |\n| 2. 可变间隔。在不同的时间间隔实施强化。 | 4. 可变比例。在不同数量的行为发生后实施强化。 |\n\n## 3. 行为强化理论——斯金纳\n\
    \n- ➢ 应用强化的原则\n  \n  - 要按照强化对象的不同需要采取不同的强化措施。\n  - 对所期望取得的工作业绩应予以明确的规定和表述。\n \
    \ - 对工作业绩予以及时的反馈，即通过某种形式和途径，及时将工作结果告诉行动者。\n\n- ➢ 理论局限\n  \n  - 过于强调对人的行为的限制和控制，而忽视了人的内在心理过程和状态；忽略人的因素和主观能动性对环境的反作用。\n\
    \n## 第三节 激励方法\n\n## 工作激励\n\n通过合理设计与适当分配工作任务来激发员工内在的工作热情。\n\n方法1\n\n## 成果激励\n\n\
    在正确评估员工工作产出的基础上给员工合理的奖励，以保证员工工作行为的良性循环。\n\n方法2\n\n## 综合激励\n\n除工作激励、成果激励以外的其他辅助性激励方法。\n\
    \n方法3\n\n## 第三节 激励方法\n\n## 1、工作激励\n\n## 1.1工作扩大法\n\n- 通过扩大岗位工作的范围、增加工作岗位的职责，消除员工因从事单调乏味工作而产生的枯燥厌倦情绪，从而提高员工的劳动效率。\n\
