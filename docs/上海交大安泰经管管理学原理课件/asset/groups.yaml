    # 4.冲突管理


    # 4.1 冲突的抑制


    托马斯以定义了冲突行为的二维空间，并组合成五种冲突处理策略。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_567_0.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_567_1.png)'
