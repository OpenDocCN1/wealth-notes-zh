    # 层级控制、市场控制与团体控制


    # 三、团体控制


    +   ● 团体控制（clan control）是指将个体融入团体之中，将个人的价值观与组织的价值观和目标相统一，通过团体的共同行为范式来实现组织成员的自我约束和自我控制。


    团队控制的动因：


    +   ◆ 主要来自于组织成员和工作性质的变化、控制环境的变化、雇佣关系的变化。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_621_0.png)'
  - '[PAGE 622]


    # 团体控制


    团体控制的实施：


    组织文化是团体控制的基础。有效的团体控制需要：


    团体控制的实施


    构建创新的组织文化


