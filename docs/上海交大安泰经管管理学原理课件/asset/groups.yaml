    # 4. 甘特图


    一般而言，甘特图上与每项工作对应的横道表示该工作所需要的时间，横道上实体部分表示工作的实际完成情况，空白的部分表示没有进行的工作。这样，可以在任何时点上检查工作的实际进展情况。将项目工作层层分解，最终落实到甘特图上，项目的计划便具有了很强的可操作性。


