    ![](img/fb58d24fa7baa8c67e846e92bd02df61_283_0.png)


    ## 组织设计的性质


    - > 组织设计是组织的结构要素以及整个组织结构要素间关系的总和。

    - > 组织类型取决于它所提供的产品或服务，特定的组织结构是为了满足顾客的需求。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_284_0.png)


    ## 二、组织设计的影响因素


    ➢ 情境因素决定了在具体环境下何者为最佳组织设计


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_285_0.png)


    ## 二、组织设计的影响因素


    ## （一）环境


    管理活动是在一定的环境下进行的，可以分为一般环境和任务环境。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_286_0.png)


    ## 稳定的和不稳定的环境


    - > 机械型组织

    - 机械式组织（Mechanistic organization,也称官僚行政组织）

    - 机械式组织是综合使用传统组织设计原则的产物。是一种僵硬的、稳定的组织。员工的工作是标准化的。

    - 机械式组织的特点为：严格的层级关系、固定的职责、高度复杂化、高度正规化和高度集权化、正式的沟通渠道，人性和人的判断被减少到最低限度。


    - > 有机型组织

    - 有机式组织（Organic organization,也称适应性组织）

    - 有机式组织是一种松散、灵活的具有高度适应性的组织。在有机组织中，员工的工作不是标准化的，大多是职业化的。

    - 有机式组织的特点：纵向和横向的合作、不断调整的职责、低复杂化、低正规化、非正式的沟通渠道、分权的决策。


    ## 二、组织设计的影响因素


    ## （二）战略


    美国史学家钱德勒认为，战略发展有四个不同的阶段，都应有与之相适应的组织结构。成功企业的组织结构是与其战略相适应的。


    - 数量扩大阶段

    - 地区开拓阶段

    - 纵向联合开拓阶段

    - 产品多样化阶段


    - 只需要少量职能部门就能解决问题

    - 需要建立职能部门对分布在不同地区的业务进行有机整合

    - 建立与纵向联合开拓阶段相适应的组织结构

    - 重新考虑资源分配、部门划分、新老业务之间的协调等问题


    ## 组织设计与战略


    组织可以实行多种公司层战略：


    - 单一产品战略

    - 多元化战略


    战略选择影响组织设计


    业务层战略

    防卫者

    前瞻者

    分析者


    基本的竞争战略

    差异化

    总成本领先

    集中


    ## 业务层战略


    ➢ 业务层战略既影响业务单位的设计也影响组织整体设计。


    ➢ 业务层战略对组织设计的影响？


    - 组织应当是集权的还是分权的？

    - 积极的营销战略往往需要设立独立的部门，例如广告部、直销部和促销部

    - 产品战略可能要求制造过程分布在不同地区

    - 人力资源战略可能要求一定程度的分权


    ## 从两个维度描述组织的特性


    差异化：


    - 组织划分下级单位的程度


    整体化：


    - 下级单位间必须协作工作的程度


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_291_0.png)


    ## 伍德沃德发现：


    - > 技术类型和相应的公司结构之间存在着明显的相关关系；

    - > 组织的绩效与技术和结构之间的“适应度”密切相关。

    - > 伍德沃德得出的结论：组织的结构因技术而变化。成功的企业是那些能根据技术的要求而采取合适的结构安排的企业。


    | 生产技术 | 单件生产 | 大量生产 | 连续生产 |

    |---|---|---|---|

    | 结构特征 | 低度的纵向分化<br>低度的横向分化<br>低度的正规化 | 中度的纵向分化<br>高度的横向分化<br>高度的正规化 | 高度的纵向分化<br>低度的横向分化<br>低度的正规化
    |

    | 最有效的结构 | 有机式 | 机械式 | 有机式 |


    ## 二、组织设计的影响因素


    ## （四）规模


    大型组织和小型组织在组织结构上的区别主要表现在以下四个方面：


    规范程度不同


    组织规章条例越多，组织规范性越高


    集权程度不同


    大小组织都可能高度集权，但大型组织往往通过授权的形式将决策权分散下去。


    复杂程度不同


    层级越多，管理幅度越大，组织复杂性越高


    人员结构不同


    “帕金森定律”：工作总在增长以占满分配给他的时间


    ## 二、组织设计的影响因素


    ## （五）发展阶段


    1950年，鲍尔丁提出“组织生命周期”概念。组织存在生命周期，每个发展阶段具有不同特征，同时面临着不同风险，需要调整战略以适应发展的需要，并适时调整组织结构。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_296_0.png)


    ## 三、组织设计的原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_0.png)


    目标一致原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_1.png)


    分工与协作原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_2.png)


    有效管理幅度原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_3.png)


    权责对等原则


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_297_4.png)


    柔性经济原则


    ## 二、机械式组织与有机式组织


    ➢ 英国学者伯恩斯·斯托克认为，机械式组织和有机式组织是一系列组织类型中的两个极端，而大多数组织介于二者之间。


    ## 机械式组织


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_299_0.png)


    - 一种稳定的、僵硬的结构形式

    - 追求稳定运行中的效率


    ## 有机式组织


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_299_1.png)


    - 一种松散、灵活的具有高度适应性的结构形式

    - 追求动态适应中的创新


    ## 二者特征比较：


    | 机械式组织 | 有机式组织 |

    |---|---|

    | 基于职能的高度专门化 | 基于知识与经验的专门化 |

    | 僵化的职务与权限 | 柔性的职务与权限 |

    | 基于职位的权力 | 基于专业知识的权力 |

    | 信息向高层集中 | 信息的分散与共享 |

    | 垂直的指挥与信息传递 | 水平的沟通与信息传递 |

    | 对组织的忠诚和对上级的服从 | 对工作和技术的忠诚 |

    | 强调企业固有知识 | 强调吸收外部智慧 |

