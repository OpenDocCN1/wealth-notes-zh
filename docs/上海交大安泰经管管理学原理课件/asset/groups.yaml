    # 什么是领导？


    赫塞和布兰查德认为，领导是一个在特定情境中，通过影响个体或群体的行为来努力实现目标的过程。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_420_0.png)'
  - '[PAGE 421]


    # 领导的性质


    领导是运用非强迫性影响塑造群体或组织目标，激励导向目标实现的行为，并且协助群体和组织文化的形成。


    领导者的行为

    • 视野与指导

    • 联络员工

    • 鼓舞和激励

    • 制造变革


    共同行为


    管理者的行为

    • 规划与预算

    • 组织与人员配置

    • 控制

    • 可预见性和秩序'
  - '[PAGE 422]


    # 1、领导和管理


    | 领导 | 管理 |

    |---|---|

    | 职能范围不同 | 管理除了领导职能，还包含了计划、组织等职能 |

    | 权力来源不同 | 领导权力来自组织赋予；管理权力建立在合法的组织结构基础上 |

    | 主要功能不同 | 领导能够在一定程度上实现变革；管理使组织高效地运转 |

    | 目标制定过程 | 领导注重宏观目标的战略；管理参与计划和预算过程，确定目标、安排详细步骤 |

    | 人力资源配备 | 领导通过愿景、鼓舞和激励向前进；管理组织、安排人员，根据需要培训专业化的人才 |

    | 计划执行方式 | 领导倾向于迎接挑战，完成任务；管理保证计划执行，协调和控制解决问题 |


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_422_0.png)'
