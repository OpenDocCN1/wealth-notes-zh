    # 3. 领导者角色理论——亨利·明茨伯格


    +   > 主要观点：管理者需要在不同的角色间进行转换。

    +   > 角色是指属于一定职责或地位的一套有条理的行为。

    +   > 明茨伯格认为，10种角色形成一个结合起来的整体，管理者是一个投入—产出的系统，权威和地位产生人际关系方面的角色，这方面的角色导致投入（信息），而这又导致产出（信息和决策）。任何一种角色的缺失都可能使得其他角色无法完整实现。

    +   > 领导者的角色是10种角色中最显著的一种角色，也是管理者权力最明显的表现。'
