    ## 高大结构和扁平结构


    +   > 扁平的结构可以带来更高的员工士气和生产力；

    +   > 高大的结构更加昂贵，导致经理人数增加。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_322_0.png)


    ## 高大组织和扁平组织


    高大的组织


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_323_0.png)


    扁平的组织


