    +   - **可比性**：决策追踪与调整的指标应具有普遍的意义，使评价结果能够实现纵向比较和不同评价对象间的横向比较。

    +   - **可操作性**：在满足决策评价目的的前提下，应结合具体绩效评价实际情况，使评价指标体系概念清晰、表达方式简单易懂、数据易于收集。


    ➢ 只有将这二者有机结合，才能设计出客观可行的评价标准，从而引导决策追踪与调整的方向。'
