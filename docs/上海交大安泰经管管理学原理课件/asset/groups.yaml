    ## 三、预算管理

    ### （一）预算管理的内涵

    - 预算管理是一种计划思想的体现

    - 预算管理是预测方法的运用

    - 预算管理是一种控制手段


    ### （二）预算管理的类型

    1. 按预算的内容，预算可分为经营预算管理、投资预算管理 和财务预算管理


    #### 经营预算管理

    - 企业对日常发生的各项基本活动预算的管理。


    #### 投资预算管理

    - 对企业的固定资产的购置、扩建、改造、更新等，在可行性研究的基础上，进行预算编制和管理。


    #### 财务预算管理

    - 企业对计划期内反映有关预计现金收支、经营成果和财务状况的预算的管理。


    2. 按预算控制的力度，预算可以分为刚性预算管理和弹性预算管理


    #### 刚性预算管理

    - 没有变动余地的预算，执行人在执行中无活动余地。

    - 不利于发挥执行人的积极性和不适应环境变化。

    - 刚性预算只能在重点项目上采用。


    #### 弹性预算管理

    - 预算指标有一定的调整余地，执行人可灵活地执行的预算。

    - 控制力度稍弱，但有较强的环境适应性，能较好地适应控制的要求。

    - 在预算控制中弹性预算比较常见。


    ### （三）预算的方法——零基预算

    基本思想是：在每个预算年度开始时，把所有还在继续开展的活动都看作从零开始的，预算也就以零为基础，由预算人员在从头开始的思想指导下，重新安排各项活动及各个部门的资源分配和收支。需要考虑：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_246_0.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_246_1.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_246_2.png)


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_246_3.png)


    ### （三）预算的方法——零基预算法

    与传统预算管理相比较，零基预算的优点是预算比较科学，有利于资金分配和控制支出；其存在的缺点是预算编制的工作量大，费用高。零基预算的本质是一种控制思想。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_247_0.png)


    ## 第三节 决策追踪与调整

    ## 一、决策追踪与调整的内涵

    - 决策追踪与调整，是决策者在初始决策的基础上对已从事活动的方向、目标、方针及方案的追踪和重新调整的过程。在决策研究中，确定选择与判断的底层过程主要有两种研究范式可供使用，即结构化建模和过程追踪。


    #### 结构化建模

    - 将所呈现信息与决策者最终的选择或判断联系起来，以形成具有特定结构和参数的逻辑模型，从而推断所选取的方案。


    #### 过程追踪

    - 决策是在初始决策的基础上，对已从事活动的方向、目标、方针及方案，进行追踪并不断重新调整，对预期目标能否最终得以实现影响重大。


    ➤ 决策的补充和修正是指在决策执行过程中，由于决策本身的特点和决策环境的变化，决策者必须对决策执行情况不断检查，并根据反馈信息，找出偏差，实施相应的控制，不断修正、完善决策——“扬弃”。


    **表5-2 决策追踪与调整的各种情况**


    | 决策 | 状态：客观情况重大变化 | 状态：主观情况重大变化 | 状态：主客观情况基本不变 |

    |---|---|---|---|

    | 原决策正确 | 决策追踪与调整 | 决策追踪与调整 | 决策实施 |

    | 原决策错误 | 决策追踪与调整 | 决策追踪与调整 | 决策追踪与调整 |


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_249_0.png)


    ## 二、决策追踪与调整的原则

    ### （二）相对性与系统性相结合的原则

    - 绝对指标不能完全有效地反映决策实施的真实水平，有可能掩盖决策的真实情况。而相对指标即比率指标，则克服了绝对指标的这些缺陷。

    - 因此，在设置决策评判标准体系和选取个体指标时，要根据各指标对实现评价目标的重要程度，同时考虑各类指标在评价指标体系中的合理构成，来达到评价指标既能突出重点，又能保持相对的均衡统一，实现系统的最优化的目标。


    ### （三）指挥与授权相结合的原则

    决策者要注意以下几点：

    - 明确授权的目的和权限范围

    - 职、权、责、利相当

    - 正确选择受权者

    - 加强监督控制，建立反馈机制


    ### （四）可比性与可操作性相结合的原则

    - **可比性**：决策追踪与调整的指标应具有普遍的意义，使评价结果能够实现纵向比较和不同评价对象间的横向比较。

    - **可操作性**：在满足决策评价目的的前提下，应结合具体绩效评价实际情况，使评价指标体系概念清晰、表达方式简单易懂、数据易于收集。


    ➢ 只有将这二者有机结合，才能设计出客观可行的评价标准，从而引导决策追踪与调整的方向。


    ### （五）任务与关系相结合的原则

    - 在坚持决策客观标准的前提下，要注意克服内部人员的不安心里状态对追踪决策的消极影响，让不同层次的内部人员了解不同程度的情况，参与追踪决策，以使他们消除心理上的不安。同时，注意决策追踪与调整制度的规范性，运用科学的沟通方式，消除心理效应的消极影响。


