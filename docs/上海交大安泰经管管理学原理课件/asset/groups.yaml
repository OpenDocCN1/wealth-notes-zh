    ## 第7章 组织设计


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_281_0.png)


    上海交通大学安泰经济与管理学院

    Antai College of Economics & Management, SJTU


    ## 第一节 组织设计的任务与影响因素


    ## 一、组织设计的任务


    组织设计的任务是设计清晰的组织结构，规划各部门的职能和权限，确定组织中职能职权、参谋职权、直线职权的活动范围，最终编制职务说明书。因此，组织设计包括两方面的内容：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_282_0.png)


    ## 静态—组织结构设计


    - 职能设计

    - 部门设计

    - 层级设计


    ## 动态—组织运行制度设计


    - 沟通系统设计

    - 管理规范设计

    - 激励设计


    ## 第一节 组织设计的任务与影响因素


