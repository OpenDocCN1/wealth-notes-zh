  - '[PAGE 167]


    # 二、环境分析的常用方法


    # （一）一般环境分析方法——PEST


    ➤ PEST分析，就是指从政治与法律环境（P）、经济环境（E）、社会与文化环境（S）、技术环境（T）四个方面来探察、认识影响组织发展的重要因素。


    | 主要方面 | 主要内容 |

    |---|---|

    | 人口 | 人口的地理分布、就业水平、收入水平、年龄、文化差别等 |

    | 经济 | 增长率、政府收支、外贸收支及汇率、利率、通货膨胀率等 |

    | 政策与法律 | 环境保护、社会保障、反不正当竞争法以及国家的产业政策 |

    | 社会与文化 | 公民的环保意识、消费文化、就业观念、工作观念等 |

    | 科学技术 | 高新技术、工艺技术和基础研究的突破性进展 |'
  md: "\n## 决策过程\n\n### （四）制定备选方案\n\n明确了解决问题要达到的目标后，决策者要找出约束条件下的多个可行方案，并对每个行动方案的潜在结果进行预测。\n\
    \n在多数情况下，它要求决策者在一定的时间和成本约束下，对相关的组织内外环境进行调查，收集与问题有关的、有助于形成行动方案的信息进行分析。同时，决策者应当注意避免因主观偏好接受第一个找到的可行方案而中止该阶段的继续进行。在这一阶段中，创新因素的运用是最重要的，应注意与创新方法的适度结合。\n\
    \n### （五）评价、选择方案\n\n- 是否可行？\n- 是否能够满意解决问题？\n- 后续影响如何？\n\n### （六）实施和监督\n\n一项科学的决策很有可能由于实施方面的问题而无法获得预期成果，甚至导致失败。从这个意义上说，实施决策比评价、选择行动方案更重要。决策工作不仅仅是制定并选择最满意的方案，而且必须将其转化为实际行动，并制定出能够衡量其进展状况的监测指标。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_144_0.png)\n\n## 二、决策的影响因素\n\n### 环境\n\
    \n- 环境变化往往是导致企业进行变革决策的一个最直接的原因\n\n### 组织的历史\n\n- 决策通常不是在一张白纸上描绘组织的未来蓝图，而是在一定程度上对组织先前的活动进行调整。\n\
    \n### 决策者的特点\n\n- 决策者的个人特点对组织未来行动方案的选择有着至关重要的影响\n\n### 组织文化\n\n- 人们对待组织变化或变革的态度，在根本上取决于组织文化的特点，取决于组织文化所创造的价值观念和行为准则\n\
    \n## 三、决策的准则\n\n### （一）提高决策效率和效果的准则\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_146_0.png)\n\
    \n提高决策效率和效果\n\n### （二）不确定性情境下决策方案选择准则\n\n- 乐观准则\n  - 估计每个方案的最好结果\n  - 选择结果最好的行动方案\n\
    - 悲观准则\n  - 估计每个方案的最坏结果\n  - 在最坏结果中选最优\n- 等概率准则\n  - 认为方案的可能结果发生的概率相同\n  - 选择期望值最大的方案\n\
    - 最小后悔准则\n  - 先构造出一个机会损失矩阵\n  - 从机会损失矩阵的每一行中选出最大的机会损失\n  - 再从选出的机会损失中选择最小的机会损失\n\
    \n### 风险型决策方法\n\n各种状态下的收益值（万元）\n\n| 方案 | 畅销（概率 0.30） | 中等销路（概率 0.50） | 滞销（概率 0.20）\
    \ |\n| --- | --- | --- | --- |\n| 大批生产 | 21 | 12 | 9 |\n| 中批生产 | 17 | 15 | 11\
    \ |\n| 小批生产 | 4 | 3 | 2 |\n\n目标为收益最大化，故以中批生产方案为最优\n\n#### 决策树法\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_149_0.png)\n\
    \n#### （1）最大最小收益值法（小中取大）\n\n悲观主义准则、保守主义准则\n\n各种状态下的收益值（万元）\n\n| 方案 | 畅销 | 中等销路\
