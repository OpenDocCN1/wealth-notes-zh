    # 滚动计划法的优点


    - > 适合于组织中的各种计划的编制与修订；

    - > 使计划的预计时间缩短，提高了计划的准确性；

    - > 使长期、中期、短期计划更好地结合在一起；

    - > 使计划更富有弹性，更能适应环境的变化


