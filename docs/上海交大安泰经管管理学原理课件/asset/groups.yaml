    - 行政管理理论更适用于稳定的、简单的组织，而今天的许多组织却是变化的和复杂的。\n\n## 一般管理研究\n\n### （一）经营与管理\n\n- 技术职能（活动）——设计制造\n\
    - 商业职能（活动）——进行采购、销售、交换\n- 财务职能（活动）——确定资金来源及使用计划\n- 安全职能（活动）——员工劳动安全及设备使用　　安全\n\
    - 管理职能（活动）——计划、组织、指挥、协调、控制\n- 会计职能（活动）——编制财产目录、进行成本统计\n\n## 企业经营六方面的职能（活动）\n\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_78_0.png)\n\n## 一般管理研究\n\n### （二）管理原则\n\
    \n- 1. 劳动分工\n- 2. 权力和责任\n- 3. 纪律\n- 4. 统一指挥\n- 5. 统一领导\n- 6. 个人利益服从整体利益\n- 7.\
    \ 人员的报酬\n- 8. 集中\n- 9. 等级制度\n- 10. 秩序\n- 11. 公平\n- 12. 人员稳定\n- 13. 首创精神\n- 14.\
    \ 人员的团结\n\n## 一般管理研究\n\n### （三）管理要素\n\n法约尔认为，管理活动包括计划、组织、指挥、协调和控制五个方面的内容。\n\n\
    | 计划 | 组织 | 领导 | 控制 | 达到 |\n|---|---|---|---|---|\n| 定义目标， 制定战略 开发计划以 协调活动 | 决定需要做\
    \ 什么，怎么 做，谁去做 | 指导和激励 所有的群体 和个人，解 决冲突 | 监控活动以 确保它们按 时完成 | 实现组织 宣布的目标 |\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_80_0.png)\n\
    \n## 三、科层组织研究\n\n### （一）理想的科层组织体系\n\n科层组织或科层制度，通常亦被译为官僚组织、官僚政治，是一种通过公职或职位，而不是通过世袭或个人魅力来进行管理的理想的组织制度。\n\
    \n科层组织是依照下述规则来建立和组织运行的：\n\n- 作为正式职责分配日常活动；\n- 授权，并且由官员能加以控制的某种强制手段来严格地加以限制；\n\
    - 对于正常而继续地履行职责来行使相应的权力的方法有所规定：只有按一般规定符合条件的人才被雇用。\n\n## 科层组织研究\n\n### （二）权力的类型\n\
    \n韦伯认为，为社会所接受的合法的权力有三种类型：\n\n### 传统型权力\n\n- 建立在对于习惯和古老传统的神圣不可侵犯性要求之上。\n- 这是一种由族长或部落首领来行使的权力。\n\
    \n### 个人魅力型权力\n\n- 是建立在对某个英雄人物或某个具有神赋天授品质的人的个人崇拜基础之上的权力。\n- 个人魅力型的权力不能作为政治统治的稳固制度的基础。\n\
    \n### 法理型权力\n\n- 这是一种对由法律确定的职位或地位的权力的服从。\n- 韦伯认为，只有法理型权力才能成为科层组织的基础\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_82_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_82_1.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_82_2.png)\n\
    \n## 表 2.1\n\n## 古典管理理论\n\n|  |  |\n|---|---|\n| 概要 | 古典管理理论开拓了两个方向的研究。科学管理专注于组织内的雇员，研究如何提高其生产率。科学管理的主要先驱人物是泰勒、吉尔布雷斯夫妇、甘特和爱默生。行政管理专注于整个组织，研究提高组织效率和效能的方法。行政管理理论的代表性理论家有法约尔、厄威克、韦伯和巴纳德。\
    \ |\n| 贡献 | 为后来的组织理论的发展打下了基础。 确立了直到今天仍然有效的重要的管理过程、职能和技能。 强调管理是科学研究的有效对象。 |\n|\
    \ 局限 | 适用于静态和稳定的组织，难以应用于今天变化的和复杂的组织。 所提出的普遍准则往往并不适用于所有的组织。 尽管某些作者(例如吉尔布雷斯夫人和巴纳德)注意到人的因素，但古典理论总体上是将雇员看成工具而不是资源。\
    \ |\n\n## 第二节 现代管理流派\n\n- > 第二次世界大战以后，特别是20世纪60年代以后，环境对企业的影响越来越重要。然而，古典管理理论的研究范围主要限于企业内部。\n\
    - > 为了解决理论不适应实践发展的问题，许多研究者就企业如何在变化的环境中经营进行了许多方面的探索，在此基础上形成了一系列不同的理论观点和流派。——“管理理论的丛林”。\n\
    \n## 一、人际关系运动\n\n- > 行为管理理论关注个体态度和行为和群体过程，认识到工作场所行为过程的重要性。\n- > 人际关系运动是霍桑实验的结果，主张工人行为主要取决于工作场所的社会环境，其中包括社会条件、群体行为模式和人际互动。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_85_0.png)\n\n## 照明实验\n\n- > 当时关于生产效率的理论占统治地位的是劳动医学的观点，认为影响工人生产效率的是疲劳和单调感等，于是当时的实验假设便是“提高照明度有助于减少疲劳，使生产效率提高”。\n\
    - > 可是经过两年多实验发现，照明度的改变对生产效率并无影响。具体结果是：当实验组照明度增大时，实验组和控制组都增产；当实验组照明度减弱时，两组依然都增产，甚至实验组的照明度减至0.06烛光时，其产量亦无明显下降；直至照明减至如月光一般、实在看不清时，产量才急剧降下来。\n\
    - > 研究人员面对此结果感到茫然，失去了信心。从1927年起，以梅奥教授为首的一批哈佛大学心理学工作者将实验工作接管下来，继续进行。\n\n## 福利实验\n\
    \n- > 实验目的：查明福利待遇的变换与生产效率的关系。\n- > 但经过两年多的实验发现，不管福利待遇如何改变（包括工资支付办法的改变、优惠措施的增减、休息时间的增减等），都不影响产量的持续上升，甚至工人自己对生产效率提高的原因也说不清楚。\n\
    - > 进一步的分析发现，导致生产效率上升的主要原因如下：\n- > 1、参加实验的光荣感；\n- > 2、成员间良好的相互关系。\n\n## 访谈实验\n\
    \n- > 研究者在工厂中开始了访谈计划，要工人就管理当局的规划和政策、工头的态度和工作条件等问题作出回答。但这种规定好的访谈计划在进行过程中却大出意料之外，工人想就工作提纲以外的事情进行交谈，工人认为重要的事情并不是公司或调查者认为意义重大的那些事；\n\
    - > 访谈者了解到这一点，及时把访谈计划改为事先不规定内容，每次访谈的平均时间从三十分钟延长到1-1.5个小时，多听少说，详细记录工人的不满和意见；\n\
    - > 访谈计划持续了两年多。工人的产量大幅提高。\n- > 工人们长期以来对工厂的各项管理制度和方法存在许多不满，无处发泄，访谈计划的实行恰恰为他们提供了发泄机会。发泄过后心情舒畅，士气提高，使产量得到提高。\n\
    \n## 群体实验\n\n- 梅奥等人选择14名工人在单独的房间里工作，实行特殊的计件工资制度。设想工人会更加努力来获取更多的报酬；\n- 结果，产量只保持在中等水平，每个工人的日产量平均都差不多，而且工人并不如实地报告产量；\n\
    - 原来，这个班组为了维护群体利益，自发地形成了一些规范：谁也不能干的太多，突出自己；谁也不能干的太少，影响全组的产量；\n- 并且约法三章：不准向管理当局告密；\n\
    - 进一步调查发现，工人担心产量提高，管理当局会改变现行奖励制度，或裁减人员，使部分工人失业，或者会使干得慢的伙伴受到惩罚；\n- 这一试验表明，为了维护班组内部的团结，可以放弃物质利益的引诱；\n\
    - 由此提出“非正式群体”的概念，认为在正式的组织中存在着自发形成的非正式群体，这种群体有自己的特殊的行为规范，对人的行为起着调节和控制作用。同时，加强了内部的协作关系。\n\
    \n## 霍桑实验结论\n\n- 1、工人是社会人，不是经济人，即工人除了物质需要外，还有社会心理方面的需求，否定了当时科学管理学派认为金钱是刺激工人积极性的唯一动力的说法；\n\
    - 2、企业中存在非正式的组织，对生产率有重大影响；\n- 3、生产率主要取决于工人的工作态度以及他和周围人的关系。梅奥认为提高生产率的主要途径是提高工人的满足度，即工人对社会因素、人际关系的满足程度。如果满足度高，工作的积极性、主动性和协作精神就高，生产率就高。\n\
    \n## X理论和Y理论\n\n由美国心理学家道格拉斯·麦格雷戈（Douglas McGregor）1960年在 其所著《企业中人的方面》一书中提出来的，提出了有关人性的\
    \ 两种截然不同的观点：一种是基本上消极的X理论(Theory x)；另一 种是基本上积极的Y理论(Theory Y)。\n\n"
