    # 1. 领导者特质理论


    +   托马斯·卡莱尔（起源）


    “伟大人物”假设；历史是由非凡领导的力量形成的，成功的领导基于领导者个人特质


    +   拉尔夫·斯托格迪尔


    可靠性、社交性、主动性、坚持、自信、警觉、合作性、适应性。


    +   查德·曼恩


    调整能力、外向性、支配性、阳刚性、保守主义。


    +   马克·赫根


    精力充沛、随和、责任感和情绪稳定性。


    伯纳德·巴斯

    将领导特质分为

    不同的类型，

    主要有生理特性

    、个性以及社会

