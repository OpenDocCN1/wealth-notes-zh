  - '[PAGE 594]


    # 一、确定标准


    ➢ 标准（standard），就是评定绩效的尺度，是用来衡量组织中的各项工作或行为符合组织要求的程度的标尺。通过将实际工作情况与标准相比较，管理者无需亲历工作就可以了解工作的进展情况。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_594_0.png)'
  - '[PAGE 595]


    # 确定标准的过程


    # 1、选择控制对象——“控制什么”


    基于资源等的限制，需要重点控制那些对实现组织目标成果有重大影响的因素。


    # 2、选择关键控制点


    在正确评估员工工作产出的基础上给员工合理的奖励，以保证员工工作行为的良性循环。


    # 3、确定控制标准——控制标准的确定的方法


    除工作激励、成果激励以外的其他辅助性激励方法。'
  - '[PAGE 596]


    # 选择关键控制点


    对关键控制点的选择，一般应统筹考虑这样几个方面的因素：


    +   - 影响整个工作运行过程的重要操作与事项

    +   - 能在重大损失出现之前显示出差异的事项

    +   - 若干能反映组织主要绩效水平的时间与空间分布均衡的控制点


    良好的控制来源于关键控制点的正确选择，因而这种选择或决策的能力也就成为判断管理者控制工作水平的一个重要标准。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_596_0.png)'
  - '[PAGE 597]


    # 常见的控制关键点


    +   > 人力资源

    +     - 主要考虑员工人数、工资成本、缺勤与迟到、员工申诉以及工作表现等；

    +   > 经营状况

    +     - 侧重于供应物资、存货盘存、生产进度表、生产标准、成本标准、产品及业务质量等；

    +   > 财务状况

    +     - 侧重于获取资本、资本结构、年度总收入、总支出，以及现金管理等。'
  - '[PAGE 598]


    # 控制标准的确定方法


    +   统计计算法

    +   经验估计法

    +   工程方法


    # 控制标准的基本要求


    +   简明性

    +   适用性

    +   一致性

    +   可行性

    +   可操作性

    +   相对稳定性

    +   前瞻性'
  - '[PAGE 599]


    # 控制标准的类型


    定性标准：主要是有关服务质量、组织形象等方面的，一般难以定量化。


    定量标准：便于度量和比较，是控制标准的主要表现形式。如时间标准，生产率标准，消耗标准，质量标准，品质标准。'
  - '[PAGE 600]


    # 常见的关键控制点的标准分类


    +   - 实物标准（非货币）——操作层，运用于资源消耗等方面

    +   - 费用标准——操作层

    +   - 资本标准——如投资报酬率

    +   - 收益标准——如销售一件产品的收入等

    +   - 计划标准——如计划的完成时间、可执行程度等

    +   - 无形标准——难以用实物或货币衡量，如员工的忠诚度、一项公关活动计划的受欢迎程度等

    +   - 指标标准——以可以考核的数量或质量目标作为标准'
  - '[PAGE 601]


    # 二、衡量绩效


    制定控制标准是为了衡量实际业绩，取得控制对象的相关信息，把实际工作情况和标准进行比较，据此对实际工作做出评估。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_601_0.png)'
  - '[PAGE 602]


    # 衡量绩效


    # 1. 衡量的主体：


    工作者本人，还是同一层级的其他人员，抑或是上级主管人员或职能部门的人员？


    # 2. 衡量的项目：


    需要衡量的是实际工作中与已制定的标准相对应的要素。


    # 3.衡量的方法：


    管理者可通过亲自观察、利用报表和报告、抽样调查等几种方法来获得实际工作绩效方面的资料和信息。


    # 4.衡量的频度：


    对不同的衡量项目，衡量的频度可能不一样。有效控制要求确定适宜的衡量频度。'
  - '[PAGE 603]


    # 第三节 控制的过程


    # 三、分析与纠偏


    对实际工作加以衡量后，下一步就应该将衡量结果与标准进行对比。实际绩效可能高于、低于或等于目标要求，只有将实际绩效与标准相比较，才能确定两者之间有无偏差。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_603_0.png)'
  - '[PAGE 604]


    # 三、分析与纠偏


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_604_0.png)


    如果偏差在允许的范围之内，工作可以继续，但也要分析偏差产生的原因，以改善工作，避免偏差的扩大。


    如果没有偏差，在认定标准水平合适的情况下，可以将其作为成功经验予以分析总结并用于指导今后的或其他方面的工作。


    如果偏差较大并超出了允许范围，就应深入分析偏差产生的原因，并采取矫正措施。'
  - '[PAGE 605]


    # 分析与纠偏


    # （一）分析偏差：


    组织首先需要对偏差的性质进行分析和确认，以抓住问题的实质和重点。另外，还要对造成偏差的原因进行深入分析，切忌“头痛医头，脚痛医脚”，以找出偏差的真正原因，为对症下药制定纠偏措施提供保证。


    造成偏差的原因


    计划指标/工作标准制定不科学


    脱离实际，本身存在偏差


    外部环境中发生了意外变化


    导致实际业绩偏离预期，出现偏差


    组织内部因素的变化


    如工作方法不当、组织不力、领导无方等，导致业绩偏离预期。'
  - '[PAGE 606]


    # 第三节 控制的过程


    （二）实施纠偏：


    +   > 从管理的角度而言，在发现组织活动出现偏差后，只有采取了必要的纠偏行动，控制才是有效的。在深入分析并找出偏差产生的原因后，组织就应该有针对性地采取措施，对偏差进行处理和矫正。


    +   > 根据前述的导致偏差的原因，组织的纠偏措施可以从如下方面进行：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_606_0.png)'
  - '[PAGE 607]


    <!-- no content -->'
  - '[PAGE 608]


    # 实施纠偏


    2. 改善工作


    如果计划和标准没有问题，偏差是因为工作本身造成的，管理者就应该采取措施来纠正行动，以改善工作绩效。


    例如，如果偏差是因为员工能力不足或积极性不高造成的，那么就需要对员工进行教育培训、岗位调整或改进管理者的领导方式、提高领导艺术来进行矫正。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_608_0.png)'
  - '[PAGE 609]


    # 实施纠偏


    组织中出现的某些问题，可能属于迅速、直接影响组织正常活动的急性问题，多数应立即采取行动，实施应急纠偏措施。


    纠偏措施


    应急纠偏措施


    能够立即将出现问题的工作矫正到正确轨道上的措施


    彻底纠偏措施


    能够从根本上解决问题的措施'
  - '[PAGE 610]


    # 实施纠偏


    分析偏差产生的原因


    采取纠偏行动


    时间、资金等限制


    现实中，许多管理者往往以没有时间为借口或不愿变革而不采取彻底纠偏措施，仅仅满足于不断的救火式应急纠偏行动。事实证明，作为一个有效的管理者，对偏差进行认真的分析，并花一些时间以永久性地纠正这些偏差是非常有益的。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_610_0.png)'
  - '[PAGE 611]


    <!-- no content -->'
  - '[PAGE 612]


    # 层级控制、市场控制与团体控制


    # 一、层级控制


    +   - 层级控制（bureaucratic mechanism）亦译为“官僚控制”、“科层控制”，是指利用正式的章程、规则、政策、标准、科层权力、书面文件和其他科层机制来规范组织内部部门和成员的行为并评估绩效；

    +   - 层级控制是多数中型和大型组织最基本的控制方式；

    +   - 常见的层级控制方法有预算控制、审计控制和财务控制。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_612_0.png)'
  - '[PAGE 613]


    # 层级控制


    # 1、预算控制：


    预算控制就是根据预算规定的收入与支出标准来检查和监督各个部门的生产经营活动，以保证各种活动或各个部门在充分达成既定目标、实现利润的过程中对经营资源进行有效利用，从而使成本费用支出受到严格有效的约束。作为一种控制手段，预算控制是通过编制和执行预算来进行的。


    预算控制的局限性


    只能控制可计量的业务活动


    编制预算时常参照上期项目和标准


    组织外部环境的不

    断变化'
  - '[PAGE 614]


    # 层级控制


    # 2、审计控制：


    审计控制是指对反映组织资金运动过程及其结果的会计记录及财务报表进行审核、鉴定，以判断其真实性和公允性，从而起到控制的作用。审计是一项较独立的经济监控活动。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_614_0.png)


    外部审计：由组织外部的机构（如会计师事务所）选派审计人员对组织财务报表及其反映的财务状况进行独立的检查和评估。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_614_1.png)


    内部审计：由组织内部的机构或由财务部门的专职人员独立进行的，其目的是为组织内部控制提供一种手段，以检查和评价各项控制的有效性。'
  - '[PAGE 615]


    # 层级控制


    3、财务控制：


    +   - 财务控制是指对企业的资金投入及收益过程和结果进行衡量与校正，以确保企业目标以及为达到此目标所制定的财务计划得以实现。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_615_0.png)'
  md: "\n## 一、确定标准\n\n➢ 标准（standard），就是评定绩效的尺度，是用来衡量组织中的各项工作或行为符合组织要求的程度的标尺。通过将实际工作情况与标准相比较，管理者无需亲历工作就可以了解工作的进展情况。\n\
