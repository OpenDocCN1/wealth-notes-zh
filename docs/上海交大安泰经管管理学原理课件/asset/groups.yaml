    \ 建设性冲突 | 破坏性冲突 |\n| 组织内部特征 | 冷漠、迟钝、对变化反应慢、缺乏新观念 | 生命力强、自我批评、有创造性 | 分裂、混乱、不合作\
    \ |\n| 组织绩效 | 低 | 高 | 低 |\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_560_0.png)\n\
    \n### 2. 冲突的原因与类型\n\n冲突的原因：\n\n- 个人差异：每个人的成长经历、家庭背景、文化水平等不同，造成个体价值观、性格特征、能力、思维方式等方面存在差异。\n\
    - 沟通差异：语义理解的困难、信息交流不充分、沟通渠道中的噪声等因素都构成了沟通障碍，并成为冲突的潜在条件。\n- 结构差异：来自组织结构本身的设计不良，而造成整合困难，最后导致冲突：专业化、任务互依性、资源稀缺、目标差异、权力分配、职责模糊等。\n\
    \n#### 冲突的类型——根据冲突发生的层次划分\n\n- **个体内冲突**：冲突发生在个体内部。它一般发生于个体面临多种难以做出的选择，此时会表现得犹豫不决，茫然不知所措。一般表现为三种类型：接近—接近型冲突、回避—回避型冲突、接近—回避型冲突。\n\
    - **人际冲突**：发生在两个或者多个人之间的冲突。许多个体差异都会导致人际冲突，如个性、价值观、目标、态度、知觉等。\n- **群体间冲突**：冲突发生在群体、团队或者部门之间。目标上的差异、对稀缺资源的竞争等原因都可能引发群体间冲突。\n\
    - **组织间冲突**：发生在两个或者多个组织之间的冲突；企业竞争就是一种组织间冲突。组织还会因为与供应商、顾客、政府机构等之间的相互依存关系而发生冲突。\n\
    \n#### 建设性冲突与破坏性冲突\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_564_0.png)\n\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_564_1.png)\n\n**建设性冲突**：对组织有积极影响的冲突。\n\
    \n表现：\n- 冲突双方都关心共同目标的实现和现有问题的解决；\n- 双方愿意了解彼此的观点，并以争论问题为中心；\n- 双方信息交流不断增加。\n\n\
    **破坏性冲突**：对组织有消极影响的冲突。\n\n表现：\n- 冲突双方极为关注自己的观点是否取胜；\n- 双方不愿听取对方意见，而是千方百计陈述自己的理由，抢占上风，人身攻击的现象时常发生；\n\
    - 双方互相交换意见的情况不断减少。\n\n#### 冲突的类型——根据冲突产生的原因来划分\n\n- **目标冲突**：由于冲突主体内部或冲突主体之间存在不一致或不相容的结果追求所引发的冲突。\n\
    - **认知冲突**：由于冲突主体内部或冲突主体之间存在不一致的看法、想法和思想而导致的冲突。\n- **情感冲突**：由于冲突主体内部或冲突主体之间情感上的不一致而引发的冲突。\n\
    - **程序冲突**：由于冲突主体内部或冲突主体之间存在不一致或不相容的优先事件选择与过程顺序安排而产生的冲突。\n\n### 3. 冲突观念的变迁\n\n\
    - 传统观念（19世纪末到20世纪40年代）\n- 人际关系观念（20世纪40年代末至70年代）\n- 相互作用观念（20世纪80年代以后）\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_566_0.png)\n\
    \n### 4. 冲突管理\n\n#### 4.1 冲突的抑制\n\n托马斯定义了冲突行为的二维空间，并组合成五种冲突处理策略。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_567_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_567_1.png)\n\n#### 五种冲突处理策略\n\n| 策略\
    \ | 特征 |\n| --- | --- |\n| 竞争策略 | 为了满足自己的利益而无视他人的利益，是一种“我赢你输”的策略；很难使对方心悦诚服，并非解决冲突的好方法。\
    \ |\n| 合作策略 | 尽可能满足双方利益，代表了冲突解决中的双赢局面。合作是通过彼此公开而具诚意的沟通，来了解彼此双方的差异所在，并努力找出可能的双赢方案，以使双方都获得最大的可能利益，但前提是必须先建立互信的基础。\
    \ |\n| 回避策略 | 既不合作又不坚持己见，既不满足自己利益又不满足对方利益的冲突解决策略；长期使用效果不佳。 |\n| 迁就策略 | 当事人为了满足他人的需求，而抑制了自己的需求。\
    \ |\n| 妥协策略 | 当冲突双方势均力敌，希望对复杂的问题取得暂时的解决办法，或者时间紧迫需采取权宜之计时。 |\n\n"
