    # 期望理论


    +   > 弗鲁姆的期望理论，别称“效价-手段-期望理论”，是北美著名心理学家和行为科学家维克托·弗鲁姆（Victor H. Vroom）于1964年在《工作与激励》中提出来的激励理论。

    +   > 人都是抱着某种希望去做某种事情的，人们只有预计到他们的行动有助于达到某一种目标时，才会被激励起来去做该事情，以其最终达到目标


    激发动力 = 效用价值 × 期望概率


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_97_0.png)'
  - '[PAGE 98]


    # 公平理论


    +   公平理论又称社会比较理论，由美国心理学家约翰·斯塔希·亚当斯（John Stacey Adams）于1965年提出；


    +   该理论的基本要点是：人的工作积极性不仅与个人实际报酬多少有关，而且与人们对报酬的分配是否感到公平更为密切；


    +   人们总会自觉或不自觉地将自己付出的劳动代价及其所得到的报酬与他人进行比较，并对公平与否做出判断；


    +   公平感直接影响职工的工作动机和行为。因此，从某种意义来讲，动机的激发过程实际上是人与人进行比较，做出公平与否的判断，并据以指导行为的过程。'
