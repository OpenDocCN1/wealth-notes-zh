    # 一、组织文化的概念与分类


    # （一）组织文化的概念


    # 2. 组织文化的含义


    +   > 组织文化指的是一个组织在长期实践活动中形成的具有本组织特征的文化现象，是组织中的全体成员共同接受和共同遵循的价值观、思维方式、心理预期、行为准则、团队归属感以及工作作风等群体意识的总称。

    +   > 组织文化是一组价值观、信仰、行为、习惯和态度，它帮助组织成员理解组织的立场、行为方式和组织所关心的问题。

    +   > 文化决定着组织的“感觉”。

    +   > 组织文化的起点往往是组织创立者。'
