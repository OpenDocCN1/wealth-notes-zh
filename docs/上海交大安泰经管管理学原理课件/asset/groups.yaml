    \n- 搬运生铁试验：摸索出工人的日合理工作量，从而为实行定额管理奠定了基础；\n- 铲具试验：探索出铁锹多大铲物效率最高，从而为实行工具标准化奠定了基础；\n\
    - 金属切削试验：前后共花了26年的时间，15万美元的费用，写出了3万多份试验报告，仅形成的切屑就达80万磅，最后，取得了有关车床、刨床、钻床、铣床在车速、进刀、材料等方面的丰富资料，为制定各种机床进行高速切削和精密加工的操作规程提供了科学依据。\n\
    - 这些实验将他的科学管理思想理论深深地扎根在科学实验的基础上，使之成为一门真正的科学。\n\n### 科学管理研究\n\n#### （一）改进工作方法，并根据工作的要求挑选和培训工人\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_70_0.png)\n\n铁铲实验\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_70_1.png)\n\
    \n操作→动作→动素\n\n改进操作方法\n\n作业环境与作业条件的标准化\n\n根据工作要求，挑选和培训工人\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_70_2.png)\n\
    \n招聘与培训\n\n#### （二）改进分配方法，实行差别计件工资制\n\n在计算工资时，采取不同的工资率，未完成定额的按低工资率付给，完成并超过定额的按高工资率付给。由于完成并超过定额能以较高的标准得到报酬，工人愿意提供更多数量的劳动。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_71_0.png)\n\n#### （三）改进生产组织，加强企业管理\n\
    \n- 设置计划部门，把计划和执行职能分开\n- 实行职能工长制\n- 例外管理\n\n### 泰勒制主要内容\n\n- (1) 管理的根本目的在于提高效率；\n\
    - (2) 制定工作定额；\n- (3) 选择最好的工人；\n- (4) 实施标准化管理；\n- (5) 实施刺激性的付酬制度；\n- (6) 强调雇主与工人合作的“精神革命”；\n\
    - (7) 主张计划职能与执行职能分开；\n- (8) 实行职能工长制；\n- (9) 管理控制上实行例外原则。\n\n### 列宁对泰勒制的评价\n\n\
    1918年4月，列宁在《苏维埃政权的当前任务》（收入中译本《列宁选集》第三卷）一文中说，“资本主义在这方面的最新成就泰罗制，同资本主义其他一切进步的东西一样，既是资产阶级剥削的最巧妙的残酷手段，又包含一系列的最丰富的科学成就，它分析劳动中的机械动作，省去多余的笨拙的动作，制定最适当的工作方法，实行最完善的计算和监督方法等等……应该在俄国组织对泰罗制的研究和传授，有系统地试行这种制度并使之适用。”\n"
  mdcn: "\n\n## 二、信息化\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_55_0.png)\n\n- 企业信息化管理：\n\
    \  - 企业资源计划（ERP）、客户关系管理（CRM）、供应链管理（SCM）、办公自动化系统（OAS）、云平台、大数据……\n\n## 三、市场化\n\n\
    - 现代企业制度：\n  - 产权关系明晰；\n  - 企业以其全部法人财产依法自主经营，自负盈亏；\n  - 出资者按投入企业的资本额享有所有者的权益；\n\
    \  - 企业按照市场需求组织生产经营；\n  - 建立科学的企业领导体制和组织管理制度。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_56_0.png)\n\
    \n## 管理学原理\n\n### 第2章 管理理论的发展\n\n### 传统的和当代的管理问题与挑战\n\n- 理论和历史对管理学的重要意义\n  - 理论是组织知识和提供行动蓝图的概念框架\n\
    \  - 理解管理的历史发展可以掌握传统的由来，避免他人已经犯过的错误\n\n### 人的正确思想是从哪里来的？\n\n人的正确思想是从哪里来的？是从天上掉下来的吗？不是。是自己头脑里固有的吗？不是。人的正确思想，只能从社会实践中来，只能从社会的生产斗争、阶级斗争和科学实验这三项实践中来。人们的社会存在，决定人们的思想。\n\
    \n人们在社会实践中从事各项斗争，有了丰富的经验，有成功的，有失败的。无数客观外界的现象通过人的眼、耳、鼻、舌、身这五个官能反映到自己的头脑中来，开始是感性认识。这种感性认识的材料积累多了，就会产生一个飞跃，变成了理性认识，这就是思想。\n\
    \n这是一个认识过程。这是整个认识过程的第一个阶段，即由客观物质到主观精神的阶段，由存在到思想的阶段。\n\n这时候的精神、思想（包括理论、政策、计划、办法）是否正确地反映了客观外界的规律，还是没有证明的，还不能确定是否正确，然后又有认识过程的第二个阶段，即由精神到物质的阶段，由思想到存在的阶段，这就是把第一个阶段得到的认识放到社会实践中去，看这些理论、政策、计划、办法等等是否能得到预期的成功。\n\
    \n### 管理活动的历史可以上溯数千年\n\n3000B.C. 2500B.C. 2000B.C. 1500B.C. 1000B.C. 500B.C. A.D.500\
    \ A.D.1000 A.D.1500\n\n| 代号 | 文明 | 管理贡献 |\n| --- | --- | --- |\n| A | 苏美尔人 | 书面的统治规则和规定\
    \ |\n| B | 埃及人 | 在建造金字塔时运用管理的方法 |\n| C | 巴比伦人 | 在统治中运用了复杂的法律和政策 |\n| D | 希腊人 |\
    \ 在城邦间实行不同的统治体系 |\n| E | 罗马人 | 运用组织化结构进行沟通和控制 |\n| F | 中国人 | 建立复杂的政府组织结构 |\n|\
    \ G | 威尼斯人 | 运用组织设计和规划来控制海洋 |\n\n### 丁谓建宫\n\n- 祥符中，禁中火。时丁晋公主营复宫室，患取土远，公乃令凿通衢取土，不日皆成巨堑。乃决汴水入堑中，引诸道竹木排筏及船运杂材，尽自堑中入至宫门。事毕，却以斥弃瓦砾灰尘壤实于堑中，复为街衢。一举而三役济，计省费以亿万计。\n\
    - 宋真宗大中祥符年间，宫中着火。当时丁谓主持重建宫室。重建皇宫需要烧砖，被取土很远所困扰。丁谓于是命令从大街取土，没几天就成了大渠。于是挖通汴河水进入渠中，各地水运的资材，都通过汴河和大渠运至宫门口。重建工作完成后，用工程废弃的瓦砾回填入渠中，水渠又变成了街道。做了一件事情而完成了三个任务，省下的费用要用亿万来计算。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_61_0.png)\n\n### 主要管理理论的发展\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_62_0.png)\n\
    \n### 第一节 古典管理理论\n\n- 管理理论是随着工厂制度和工厂管理实践的发展，在19世纪末20世纪初开始系统形成的。这个时期的管理理论通常被称为古典管理理论，主要研究问题涉及科学管理、一般管理以及科层组织。\n\
    - 其主要标志是泰勒的《科学管理原理》和法约尔的《工业管理与一般管理》。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_63_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_63_1.png)\n\n### 三种传统的管理理论之古典管理理论\n\
    \n- 在20世纪初，来自许多管理者和理论家们的初步思考和著作同当时大型企业的兴起和演变以及由此而来的管理实践相结合；\n- 这一理论实际上包括两个不同的分支：科学管理和行政管理。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_64_0.png)\n\n### 一、科学管理研究\n\n- 科学管理是20世纪初在西方工业国家影响最大、推广最普遍的一种管理理论，也被称作泰勒制（Taylorism）。\n\
    - 泰勒制的产生和迅速发展有着非常深刻的历史背景。\n\n一方面，随着社会生产力的发展和企业数量的增加与规模的扩大，企业管理逐渐要求从传统的经验管理走向科学管理。\n\
    \n另一方面，资本对劳动的控制从不完全到完全也要求改进企业管理的方法。\n\n### 古典管理理论之科学管理\n\n- 探索提高单个工人绩效的方法。\n-\
    \ 泰勒是这一理论的领军人物。他相信管理者只要遵循他的指导就可以提高工人的工作效率。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_66_0.png)\n\
    \n### 科学管理的步骤\n\n- 对工作的每一部分进行科学分析来取代经验方法\n- 用科学方法选拔员工，培训他们按步骤1的方法完成工作\n- 对员工进行指导，确保他们按规定的方法完成工作\n\
    - 继续进行工作设计，但是这次是由工人自己来做\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_67_0.png)\n\
    \n泰勒认为，当时企业的劳动生产率普遍低下，工人每天的实际产量只为他们劳动能力的1/3，而造成这种状况的原因主要有三个方面。要提高劳动生产率，增加企业盈利，必须从三个方面做文章。\n\
    \n- 劳动使用不当，包括工作分配不合理和劳动方法不正确\n  - → 改进工作方法，并根据工作的要求挑选和培训工人\n- 由于薪酬和工人本性等原因，工人不愿干或不愿多干\n\
