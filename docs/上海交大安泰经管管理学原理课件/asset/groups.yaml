  md: "\n## 二、组织文化的特征\n\n组织文化首先具有独特性、长期性和可塑性特征。除此之外，还有以下特征：\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_395_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_395_1.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_395_2.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_395_3.png)\n\n### 组织文化的主要特征\n\n- 独特性——每个组织都有其独特的组织文化，这是由不同的国家和民族、不同的地域、不同的时代背景以及不同的行业特点所形成的；\n\
    - 稳定性——组织文化是组织在长期的发展中逐渐积累而成的，具有较强的稳定性，不会因组织结构的改变、战略的转移或产品与服务的调整而变化。一个组织中，精神文化又比物质文化具有更多的稳定性；\n\
    - 综合性——组织文化由价值观、行为规范等一系列内容构成一个系统，各要素之间相互依存，相互联系。\n- 发展性——组织文化随着历史的积累、社会的前进、环境的变迁以及组织变革逐步演进和发展。强势、健康的文化有助于组织适应外部环境和变革，而弱势不健康的文化则可能导致组织的不良发展。\n\
    \n## 三、组织文化的影响因素\n\n### （一）外部因素\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_397_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_397_1.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_397_2.png)\n\
    \n### （二）内部因素\n\n领导者素质\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_398_0.png)\n\
    \n组织成员的素质\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_398_1.png)\n\n组织发展的不同阶段\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_398_2.png)\n\n## 第二节 组织文化的构成与功能\n\n\
    ### 一、组织文化的构成\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_399_0.png)\n\n### 组织文化的结构\n\
    \n精神层——主要是指组织的领导和成员共同信守的基本信念、价值标准、职业道德和精神风貌。精神层是组织文化的核心和灵魂。\n\n它包括六个方面：\n\n- （1）组织目标；\n\
    - （2）组织哲学；\n- （3）组织精神；\n- （4）组织风气；\n- （5）组织道德；\n- （6）组织宗旨\n\n- 制度层。是组织文化的中间层次，主要是对组织和成员的行为产生规范性、约束性影响的部分，它集中体现了组织文化的物质层和精神层对成员和组织行为的要求，规定了组织成员在共同的活动中应当遵守的行为准则；\n\
    \  它主要包括三个方面：\n  - （1）一般制度。指组织中存在的一些带普遍意义的工作制度和管理制度，以及各种责任制度。\n  - （2）特殊制度。主要是指组织的非程序化制度。与一般制度相比，特殊制度更能反映一个组织的管理特点和文化特点。\n\
    \  - （3）组织风俗。是组织长期相沿、约定俗成的典礼、仪式、行为、习惯、节日、活动等。\n\n- **物质层。** 是组织文化的表层部分，它是组织创造的物质文化，是形成组织文化精神层和制度层的条件。\n\
    \  **它主要包括这几个方面：**\n  - 1. 组织名称、标志、标准字、标准色。\n  - 2. 组织外观，如自然环境、建筑风格、办公室等场所的设计和布置方式、绿化美化情况、环境的治理等。\n\
    \  - 3. 工作的性质、特点等。\n  - 4. 特属性、创造性的内容。\n  - 5. 徽、旗、歌、服、花。\n  - 6. 组织的文化体育生活设施。\n\
    \  - 7. 组织造型和纪念性建筑。\n  - 8. 组织纪念品。\n  - 9. 组织的文化传播网络，如自办的报刊、有线广播、闭路电视、计算机网络、宣传栏（宣传册）、广告牌、招贴画等。\n\
    \n### 交大校徽的变迁\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_403_0.png)\n\n## 二、组织文化的功能\n\
    \n### （一）导向功能\n\n- 以一种适应性文化引导着组织整体和每一个组织成员的价值取向及行为取向，使之符合组织所确定的目标。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_406_0.png)\n\
    \n### （二）凝聚功能\n\n- 组织文化能够以各种微妙的方式沟通组织成员的思想感情，融合人们的理想、信念和情操，培养和激发其群体意识。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_407_0.png)\n\
    \n### （三）激励功能和约束功能\n\n- 激励功能：通过组织文化的塑造和内在引导，每个组织成员能够从内心深处产生为组织宁愿付出一切的奉献精神，从而最大限度地激发工作的积极性、主动性和创造性。\n\
    - 约束功能：潜在于组织中的文化氛围、群体行为准则和道德规范等，形成一种软约束，对每一个组织成员的思想、心理和行为都具有很强的约束和规范作用。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_408_0.png)\n\
    \n### （四）辐射功能\n\n- 组织文化一旦形成较固定的模式，不仅会在组织内发挥作用，对本组织成员产生影响，而且会通过各种渠道向社会辐射，对社会产生影响。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_409_0.png)\n\n### （五）调适功能\n\n组织文化可以帮助新加入组织的成员尽快适应组织，使自己的个人价值观更好地与组织需要相匹配。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_410_0.png)\n\n## 三、组织文化的反功能\n\n###\
    \ （一）变革的障碍\n\n- 组织文化作为一种软约束，相对于硬约束的规章制度，更加深入人心，更易于形成思维定式。在组织环境处于动态变化的情况下，当组织的共同价值观与进一步提高组织效率的要求不相符合时，组织文化就可能成为一种束缚。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_411_0.png)\n\n### （三）并购的障碍\n\n- 并购初期考虑的主要因素：融资的优势，或产品线的协同性。现在更倾向于考虑组织文化的兼容性。\n\
    - 国内外实践证明，组织并购成功与否，在很大程度上取决于两个组织之间的文化能否有效融合。\n\n## 第三节 组织文化塑造\n\n- 组织文化塑造，是指组织有意识地发扬其积极、优良的文化，摒弃其消极、劣性的文化的过程。\n\
    - 主要动机：通过确立组织宗旨和组织精神，构筑组织文化的灵魂；\n- 通过确定组织文化的导向，利用组织共同的价值取向引导组织成员的行为，使之更好地符合组织与社会的要求。\n\
    \n许多许多的历史才可以培养一点点传统，\n许多许多的传统才可以培养一点点文化。\n可观文化是多年的习惯，要养成习惯不是简单的事情。\n\n### 一、选择价值观\n\
    \n怎样才能选择正确的组织价值观呢？\n\n- 组织价值观要体现组织的宗旨和发展战略与方向\n- 组织价值观要与组织文化各要素之间相互协调\n- 组织价值观要得到组织成员和社会的认可与接受\n\
    \n### 二、强化认同\n\n在选择并确立了组织价值观和组织文化模式后，应采取有效的方式进行强化，具体作法包括：\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_416_0.png)\n\
    \n广泛宣传\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_416_1.png)\n\n培养和树立典型\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_416_2.png)\n\
    \n加强培训和教育\n\n### 三、提炼定格\n\n成熟的组织价值观和组织文化模式的形成不是一蹴而就的，必须经过精心分析、全面归纳和精炼定格。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_417_0.png)\n\
    \n**精心分析**\n\n详细分析和比较组织成员对组织文化实际认同的结果与原来所做的方案之间的差距；找出可吸收的有关专家和组织成员的合理意见与建议\n\n\
    **全面归纳**\n\n摒弃那些落后的、不为组织成员所认可的组织文化内容和形式，而对那些进步的、卓有成效的、组织成员普遍接受的则予以保留\n\n**精炼定格**\n\
    \n对经过科学论证和实践检验的组织精神、组织价值观、组织伦理与行为，予以条理化、完善化和格式化，并从理论上和文字上进行加工处理，用精炼的语言表达出来\n"
