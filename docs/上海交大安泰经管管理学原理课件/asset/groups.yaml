    # 管理者要成为领导者


    +   > 提高管理者下达的命令的有效性（命令并不总是得到执行）；

    +   > 在管理活动中，管理者在下达命令之前，必须采取适当的手段，使自己成为领导者，才能实现其管理目标。'
