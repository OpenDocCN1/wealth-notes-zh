    - 很多研究发现中国组织越来越多地运用参与式领导的管理方式，其原因之一是在中国文化背景下参与式领导行为的作用机制与西方不同，主要以心理授权为中介影响员工满意度和组织承诺，从而提高组织管理的绩效。\n\
    \n## 第11章 员工激励\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_473_0.png)\n\n上海交通大学安泰经济与管理学院\n\
    Antai College of Economics & Management, SJTU\n\n### 第一节 激励基础\n\n- 人的行为过程及特点\n\
    - 人性假设及其发展\n- 激励机理\n\n激励是组织诱发个体产生满足某种需要的动机进而促使个体行为与组织目标趋同的管理过程。\n\n为何激励：委托——代理理论\n\
    \n关键问题：“激励什么”；“如何激励”。\n\n### 激励的本质\n\n> 在任一工作日中，雇员都可以选择尽心尽力地工作，或勉强适度工作以免申斥，或者尽可能少工作。\n\
    \n> 什么是激励？\n\n- 激励是引导人们做出特定行为的力量组合。\n\n> 命令与执行——命令能否得到有效执行？\n\n> 管理者下达命令给执行者，执行者是否执行，如何执行？执行者要作出决策\n\
    > - 二次决策\n\n> 决策要有判断依据；\n\n> 为了使执行者作出有利于组织目标实现的选择——应进行激励\n\n### 激励在工作环境中的重要性\n\
    \n个体的绩效通常由三项因素决定：\n\n- 激励（愿意完成工作）；\n- 能力（有能力完成工作）；\n- 工作环境（有资源用于完成工作）\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_476_0.png)\n\
    \n### 激励至少应该包括三个方面的因素：\n\n- 人们的行为是由什么激发并赋予活力的；\n- 是什么因素把人们正被激活的行为引导到一定方向上去的；\n\
    - 这些行为如何能矫正、保持和延续，以及这种行为正在进行时，行为主体和客体的主观反应。\n\n## 1. 人的行为过程及特点\n\n### 1.1 行为的界定\n\
    \n> 行为是人类在环境影响下一切外在反应的统称。\n\n- 构成要素：行为主体、行为客体、行为环境、行为手段和行为结果。\n- 分类：动机性行为与非动机性行为。\n\
    \n> 动机性行为的三大特征：\n\n- 具有一定的目的性、方向性及预见性；\n- 与一定的客体相联系，作用于一定的对象，其结果与行为的动机、目的有一定的内在联系；\n\
    - 会受到环境的影响，是人的内在因素和外在因素相互作用的函数。\n\n### 1.2 动机性行为的过程\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_479_0.png)\n\
    \n### 1.3 动机性行为的特点\n\n- 自发性\n- 目的性\n- 持续性\n- 可塑性\n- 因果性\n\n### 激励过程模型\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_481_0.png)\n\
    \n### 激励在工作环境中的重要性\n\n个体的绩效通常由三项因素决定：\n\n- 激励（愿意完成工作）\n- 能力（有能力完成工作）\n- 工作环境（有资源用于完成工作）\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_482_0.png)\n\n## 2. 人性假设及其发展\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_483_0.png)\n\
    \n- X理论\n- Y理论\n- 超Y理论\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_483_1.png)\n\
    \n### 2.1 经济人假设（X理论）\n\n- 人是以追求个人利益最大化为目的并积极从事经济活动的主体，具有四个特点：\n  - 人必然是自利的，且不是孤立的；\n\
    \  - 人总是凭借所处环境判断自身的利益，努力使用各种手段，追求自身利益的最大化；\n  - 人唯一目的是追求私人的利益，但最终会增加社会的公共利益。但是，这一过程需要有良好健全的法制和规则作为保证；\n\
    \  - 人追逐私利的手段和内容会随着社会发展而发生变化，但其自利的本性不变。\n- 麦格雷戈提出的X理论对经济人假设做出了更详细的解释。\n\n### 传统方法\n\
    \n> 经济收入可以用来激励所有的人；\n> 工作的报酬比工作的性质更重要；\n> 只要有足够的报酬，人们可以从事任何一种工作。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_485_0.png)\n\
    \n### 2.2 社会人假设\n\n- 基本观点：人不仅具有经济性的需求更具有社会性的需求，因此人与人之间的关系和组织的归属感比经济报酬更能激励人的行为。\n\
    - 劳动者是由社会需求而引起工作的动机，并且通过与同事的关系而获得认同感。\n- 劳动者只能从工作上的社会关系寻求工作的意义。\n- 劳动者对同事们的社会影响力，比对管理者所给予的经济诱因控制更为重视。\n\
    - 劳动者工作效率随着上司能满足他们社会需求的程度而改变。\n\n### 人际关系理论\n\n- 雇员希望感到自己有用和重要\n- 雇员具有强烈的社会需要\n\
    - 这些是比金钱更加重要的激励吗？\n\n●YES!\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_487_0.png)\n\
    \n### 2.3 自我实现人假设（Y理论）\n\n- 观点：人类需要的最高层次是自我实现——马斯洛\n- 麦格雷戈在自我实现人假设的基础上提出了Y理论。\n\
    \n| |\n| --- |\n| 大多数人都是勤奋的，只要环境允许，人是乐于工作的； |\n| 人在执行任务的过程中能够自我指导和自我控制； |\n| 在正常情况下，大多数人不仅会接受任务，而且会主动寻求责任，逃避责任、缺乏抱负以及强调安全感通常是经验的结果，而不是人的本性；\
    \ |\n| 大多数人都具有相当程度的想象力、智谋和创造力，在不为外界因素所指使和控制的情况下，可以得到正常发挥； |\n| 人体之中蕴藏着极大的潜力，但在现代工业条件下，一般人只能发挥少部分潜力；\
    \ |\n| 员工个人自我实现倾向与组织所要求的行为之间并无冲突。 |\n\n"
