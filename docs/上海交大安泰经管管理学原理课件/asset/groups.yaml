    - 5. 角色扮演法\n◆ 让受训者在培训教师设计的工作情境中扮演某个角色，其他学员与培训教师在学员表演后做适当的点评。信息传递多向化，反馈效果好、实践性强、费用低。多用于人际关系能力的训练。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_382_0.png)\n\n## 三、人员培训的方法\n### （二）培训的方法\n\
    - 6. 互动小组法\n◆让学员通过培训活动中的亲身体验增强处理人际关系的能力。此法主要适用于管理人员实践训练与沟通训练。其优点是可明显提高人际关系与沟通的能力，但其效果在很大程度上依赖于培训教师的水平。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_383_0.png)\n\n## 三、人员培训的方法\n### （二）培训的方法\n\
    ### 7. 师徒传承法\n◆ 由一个在年龄上或经验上资深的人员，支持一位资历较浅者进行个人发展或生涯发展的方式。师傅的角色包含了教练、顾问以及支持者。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_384_0.png)\n\n## 第9章 组织文化\n![](img/fb58d24fa7baa8c67e846e92bd02df61_385_0.png)\n\
    \n## 组织文化\n是一个组织由其价值观、信念、仪式、符号、处事方式等组成的其特有的文化形象。\n\n- 组织文化是指组织中的成员共有的价值体系（组织的个性）；\n\
    - 优秀的组织文化将自动告诉员工什么是对的，什么不对，他们应当怎样做。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_387_0.png)\n\
    \n## 一、组织文化的概念与分类\n### （一）组织文化的概念\n### 2. 组织文化的含义\n- > 组织文化指的是一个组织在长期实践活动中形成的具有本组织特征的文化现象，是组织中的全体成员共同接受和共同遵循的价值观、思维方式、心理预期、行为准则、团队归属感以及工作作风等群体意识的总称。\n\
    - > 组织文化是一组价值观、信仰、行为、习惯和态度，它帮助组织成员理解组织的立场、行为方式和组织所关心的问题。\n- > 文化决定着组织的“感觉”。\n\
    - > 组织文化的起点往往是组织创立者。\n\n## 一、组织文化的概念与分类\n### （二）组织文化的分类\n### 1. 按组织文化的内在特征分类——杰弗里·桑南菲尔德\n\
    \n| 类型 | 特点 | 举例 |\n|---|---|---|\n| 学院型组织文化 | 喜欢雇用年轻的大学毕业生，并为他们提供大量的专门培训和指导；为那些想全面掌握一种新工作的人而准备。\
    \ | IBM、可口可乐、宝洁。 |\n| 俱乐部型组织文化 | 非常重视适应、忠诚和承诺；资历是关键因素，年龄和经验至关重要；致力于把管理人员培养成通才。\
    \ | 政府机构、军队、贝尔公司。 |\n| 棒球队型组织文化 | 鼓励冒险、革新和发明创造；会给予工作出色的组织成员以巨额奖励和较大的自由度。 | 会计、法律、投资银行、咨询、广告、软件开发、生物研究。\
    \ |\n| 堡垒型组织文化 | 着眼于组织生存；虽然工作安全保障不足，但对于喜欢流动性和挑战性的人则具有一定的吸引力。 | 大型零售店、林业产品公司、天然气探测公司。\
    \ |\n\n## 一、组织文化的概念与分类\n### （二）组织文化的分类\n2. 按组织文化对组织成员的影响力分类——约翰·科特、詹姆斯·赫斯科特\n\n\
    ### 强力型组织文化\n提供了必要的组织机构和管理机制；组织成员方向明确、步调一致，有共同的价值观和行为方式，愿意为组织工作或献身。\n\n### 策略合理型组织文化\n\
    只有当组织文化适应于组织环境时，这种文化才是好的、有效的文化。\n\n### 灵活适应型组织文化\n提倡信心和信赖感、不畏风险、注重行为方式等，组织成员之间相互支持，勇于发现问题、解决问题。\n\
    \n## 一、组织文化的概念与分类\n### （二）组织文化的分类\n3. 按组织文化所覆盖的范围分类\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_392_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_392_1.png)\n"
  mdcn: "\n\n## 一、人事考评的功能与要素\n### （二）人事考评的要素\n- 考评要素就是从哪些方面去考核和评价一个人。确定考核要素之后再完善人事考评指标体系。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_369_0.png)\n\n## 什么是绩效评估？\n- 绩效评估是对员工工作情况的正式评估。\n\
    - 判断方法包括排名和评级技术，是测量绩效最常用的方法\n  - 排名是在员工间进行直接比较，然后从好到差进行排序\n  - 评级不是在员工之间进行评比，而是将员工同一种固定的标准进行对比。评级的标准是评级表。\n\
    \n## 二、人事考评的方法\n- 1. 实测法\n- 2. 成绩记录法\n- 3. 书面考试法\n- 4. 直观评估法\n- 5. 情景模拟法\n- 6.\
    \ 民主测评法\n- 7. 因素评分法\n\n## 三、人事考评的工作程序\n确定考核目标\n\n评选先进、员工晋级、提薪、奖励\n\n制定考核标准\n\n\
    行为标准、绩效标准、任职资格标准\n\n衡量岗位工作、收集岗位信息\n\n考勤纪录、工作日记、生产报表、主管备忘录、现场观察纪录、立功纪录、事故报告\n\n\
    做出综合评价\n\n分析评价是一个“定性——定量——定性”的过程\n\n考评结果反馈和备案\n\n## 考评中的常见问题及解决途径\n### ➤ 问题\n\
    - 缺乏明确的考评标准\n- 居中倾向\n- 近期性误差\n- 严格与宽松现象\n- 光环效应（晕轮效应）\n- 考评缺乏反馈制度\n- 考评结果不加运用\n\
    \n### ➤ 解决途径\n- 尽可能采用客观公正的考评标尺；\n- 选用正确的考评方法；\n- 培训考评人员；\n- 加强考评结果的反馈；\n- 确立有效的监督与控制机制；\n\
    - 360度反馈\n\n## 第四节 人员的培训与发展\n## 一、人员培训的功能\n● 有效的人员培训，是提升组织综合能力的过程，对组织的发展有重要的作用。\n\
    \n- 能提高组织成员的综合素质\n- 有利于组织文化的建设\n- 可以提升组织能力\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_375_0.png)\n\
    \n## 二、人员培训的任务\n为组织战略的实施准备人力资源\n\n加强知识管理和组织文化建设\n\n帮助组织成员成长\n\n创造良好的组织环境\n\n##\
    \ 三、人员培训的方法\n### （一）培训分类\n### 岗前培训\n- 新成员到职培训\n- 调职人员岗前培训\n\n### 在职培训\n- 目的在于提高其工作效率，以更好地协调组织的运作及发展\n\
    \n### 专题培训\n- 根据发展需要或者部门根据岗位需要，组织人员进行某一主题的培训工作\n\n## 三、人员培训的方法\n### （二）培训的方法\n\
    - 1. 讲授法\n  - 运用方便，便于培训者控制整个过程。但单向信息传递，反馈效果差。\n  - 常被用于一些理念性知识的培训。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_378_0.png)\n\
    \n## 三、人员培训的方法\n### （二）培训的方法\n### 2. 视听技术法\n运用视觉与听觉的感知方式，直观鲜明；但学员的反馈与实践较差，且制作和购买的成本高，内容易过时。它多用于介绍组织概况、传授技能等方面的培训，也可用于概念性知识的培训。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_379_0.png)\n\n## 三、人员培训的方法\n### （二）培训的方法\n\
    ### 3. 讨论法\n按照费用与操作的复杂程度又可分成研讨会与一般小组讨论两种方式。两种方式的比较如下：\n\n| 方式 | 特点 | 优点 | 缺点 |\n\
    |---|---|---|---|\n| 研讨会 | 以专题演讲为主，中途或会后允许学员与演讲者进行交流沟通。 | 信息可以多向传递，与讲授法相比反馈效果较好。\
    \ | 费用较高。 |\n| 一般小组讨论 | 信息交流时方式为多向传递 | 学员的参与度高，费用较低。 | 对培训教师的要求较高，多用于巩固知识，训练学员分析、解决问题的能力与人际交往能力。\
    \ |\n\n## 三、人员培训的方法\n### （二）培训的方法\n### 4. 案例研讨法\n◆通过向培训对象提供相关的背景资料，让其寻找合适的解决方法。使用费用低，反馈效果好。可以训练学员分析、解决问题的能力，多用于知识类的培训。但需要的时间较长，与问题相关的资料有时可能不甚明了，影响分析的结果。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_381_0.png)\n\n## 三、人员培训的方法\n### （二）培训的方法\n\
    - 5. 角色扮演法\n◆ 让受训者在培训教师设计的工作情境中扮演某个角色，其他学员与培训教师在学员表演后做适当的点评。信息传递多向化，反馈效果好、实践性强、费用低。多用于人际关系能力的训练。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_382_0.png)\n\n## 三、人员培训的方法\n### （二）培训的方法\n\
    - 6. 互动小组法\n◆让学员通过培训活动中的亲身体验增强处理人际关系的能力。此法主要适用于管理人员实践训练与沟通训练。其优点是可明显提高人际关系与沟通的能力，但其效果在很大程度上依赖于培训教师的水平。\n\
