  - "[PAGE 54]\n\n# 一、全球化\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_54_0.png)\n\n\
    > “全球化管理者主要关心的是在不同文化之间的人员和思想的互动，而不是关注于在管理者的祖国中原来的特定领导方式的效果和对来自不同国家或地区的管理员的管理方式的比较。”\n\
    > \n> ——南希·阿德勒"
  md: "\n## 二、管理内涵\n\n### 1. 决策\n\n- 决策是组织在未来众多的行动可能中选择一个比较合理的方案。\n- 管理者首先要研究组织活动的内外背景。\n\
    - 详细分析为了实现决策目标，需要采取哪些具体的行动，这些行动对组织的各个部门和环节在未来各个时期的工作提出了哪些具体的要求。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_28_0.png)\n\
    \n### 管理者的工作是：\n\n- **规划：**\n  - 除非进行长期规划，否则无法有效工作\n- **一天工作的规划：**\n  - 要做什么，为什么要做？\n\
    \  - 什么时间完成？如何完成？\n  - 谁来完成工作？\n  - 在哪里完成这项工作？\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_29_0.png)\n\
    \n### 2. 组织\n\n- 职务设计\n  - 分析需要设置哪些岗位\n- 机构设计\n  - 将不同岗位加以组合形成不同的部门\n- 结构设计\n\
    \  - 规定不同部门在活动过程中的相互关系\n- 人岗匹配\n  - 将适当的人员安置在组织结构的适当岗位\n- 发布工作指令\n  - 指挥人员，并提供必要的物质和信息条件\n\
    - 组织结构的调整和变革\n  - 适时调整组织结构\n\n### 管理者必须承担组织工作\n\n- 如果完成工作计划需要一个以上的员工\n- 就需要做组织的工作\n\
    - 必须组建团队\n- 仔细地规定每项工作的具体要求\n- 明确授权和责任\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_31_0.png)\n\
    \n### 3. 领导\n\n领导是指利用组织赋予的权力和自身的能力去指挥和影响下属为实现组织目标而努力工作的管理活动过程。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_32_0.png)\n\
    \n### 管理者的领导工作\n\n### 什么是领导？\n\n- 带领组织成员共同工作促进组织利益的一组过程。\n- 重要也最富挑战性的管理活动。\n\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_33_0.png)\n\n### 4. 控制\n\n控制是为了保证组织系统按预定要求运行而进行的一系列工作，包括根据预先制定的标准检查和监督各部门、各环节的工作，判断工作结果与目标要求是否相符。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_34_0.png)\n\n### 管理者的控制工作\n\n### 什么是控制？\n\
    \n- 检查工作完成情况以及决定下一步必须进行哪些工作\n- 管理者必须掌握员工的表现。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_35_0.png)\n\
    \n### 5. 创新\n\n组织内部的不断变化要求组织内部的活动技术与方法不断变革，组织活动与人的安排不断优化，甚至组织活动的方向、内容与形式选择也需要不断地进行调整。这些变革、优化和调整是通过管理的创新职能来实现的。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_36_0.png)\n\n### 管理工作性质\n\n在管理者的工作中充满了各种：\n\
    \n- 不确定性\n- 变化\n- 中断\n- 零散的活动\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_37_0.png)\n\
    \n### 效率和效能\n\n**有效率**：聪明地利用资源和实现成本效益\n\nAnd\n\n**有效能**：制定正确的决策并成功地予以实施\n\n##\
    \ 三、管理的本质\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_39_0.png)\n\n管理是对人或对人的行为的管理\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_39_1.png)\n\n管理的本质是对人的行为进行协调\n\n###\
    \ 管理的科学性与艺术性\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_40_0.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_40_1.png)\n\
    \n管理的艺术在于沟通的技巧和真诚。\n\n### 管理的自然属性和社会属性\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_40_2.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_40_3.png)\n\n## 第二节 管理的基本原理与方法\n\n\
    在组织和协调群体活动的过程中，管理者必须依据人本、系统、效益及适度等基本原理，利用理性分析和直觉判断等基本方法，借助权力和文化等基本工具。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_41_0.png)\n\
    \n### 一、管理的基本原理\n\n**系统原理**\n\n系统是指由若干相互依存、相互作用的要素或子系统组合而成的具有特定功能的有机整体。根据不同的标准，系统可以分成不同类型。\n\
    \n**系统分类**\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_44_0.png)\n\n**系统原理**\n\
    \n- 人造、开放、动态的社会经济组织系统虽然存在多种形式，但一般来说具有以下共同特征：\n  - 整体性\n  - 相关性\n  - 有序性\n  - 与外部环境的互动性。\n\
    - 根据系统论的观点，我们在组织管理活动时应注意以下几个方面：\n  - 管理活动所要处理的每一个问题都是系统中的问题\n  - 管理必须有层次观点\n \
    \ - 管理工作必须有开放观点\n\n**效益原理**\n\n效益是指组织目标的实现与实现组织目标所付代价之间的一种比例关系。追求组织活动的效益就是尽量以较少的资源消耗去实现组织的既定目标。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_46_0.png)\n\n**适度原理**\n\n管理活动中存在许多相互矛盾的选择，必须在两个极端之间找到最恰当的点，进行适度管理，实现适度组合。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_47_0.png)\n\n### 二、管理的基本方法\n\n抽象地看，这些方法或者以理性分析为基础，或者以直觉判断为依据。\n\
    \n理性分析 + 直觉判断 = 管理的基本方法\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_48_0.png)\n\
    \n### 管理方法多种多样：\n\n### 三、管理的基本工具\n\n**（一）权力**\n\n- 权力本是政治学研究的一个基本概念，它描述的是组织中的相关个体在一定时期内相对稳定的一种关系。\n\
    \n  把权力的实质理解为命令与服从，则权力关系是单向的。\n\n  把权力的实质理解为影响力，则权力关系必然是双向的。\n\n- 不完全平等的权力地位是权力关系的基本特征。\n\
    - 权力关系中相对权力地位或相对影响力不一样的原因是行为主体拥有的权力资源不同：专门知识或技能；经验和能力；个人品质；奖励或惩罚他人的可能性。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_51_0.png)\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_51_1.png)\n\n**（二）组织文化**\n\n- 组织文化的核心是组织成员普遍认同、共同接受的价值观念以及由这种价值观念所决定的行为准则。\n\
    - 组织文化一旦形成，对组织成员的行为影响就会是持续的、普遍的，而且是低成本的。\n- 作为一种低成本的管理工具，文化发挥作用是无意识的。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_52_0.png)\n\
    \n## 第三节 管理活动的时代背景\n\n管理活动与时代背景密切相关，是一个历史范畴，既反映时代背景，又是一定时代背景下的产物。\n\n全球化和信息化是当今世界的两大重要特征。作为新兴的经济大国，中国20世纪70年代末开始改革开放，引入市场机制，市场化因此逐渐成为中国经济生活的主旋律。\n\
    \n### 一、全球化\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_54_0.png)\n\n> “全球化管理者主要关心的是在不同文化之间的人员和思想的互动，而不是关注于在管理者的祖国中原来的特定领导方式的效果和对来自不同国家或地区的管理者的管理方式的比较。”\n\
    >\n> ——南希·阿德勒\n"
