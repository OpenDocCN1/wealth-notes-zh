  md: "\n## 二、环境分析的常用方法\n\n### （二）具体环境分析方法——波特五力模型\n\n- 潜在进入者，是指从进入障碍的角度来进行潜在竞争者分析\n\
    \n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_169_0.png)\n\n  进入障碍：行业外部的企业进入这一领域时必须付出的，而行业内企业无须再付出的一笔损失。\n\
    \n- 替代产品，即识别替代威胁\n\n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_170_0.png)\n\n\
    \  ![](img/fb58d24fa7baa8c67e846e92bd02df61_170_1.png)\n\n  短期看，一种产品的价格和性能都受到替代产品的限定；长期看，一种产品或行业的兴起有可能导致另一种产品或行业的消失。\n\
    \n- 买方和卖方议价实力，即分析买方和卖方掌控交易价格的能力\n\n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_171_0.png)\n\
    \n  交易双方在交易过程中总希望争得对自己有利的价格，而价格的变化使一方获得超额收益的同时，直接导致另一方的损失。\n\n- 行业竞争者，即对现有竞争对手的分析\n\
    \n  ![](img/fb58d24fa7baa8c67e846e92bd02df61_172_0.png)\n\n  对行业内部要分析主要竞争者的基本情况、对本企业构成威胁的原因以及分析竞争对手的发展动向。\n\
    \n### （三）内部环境综合分析方法——SWOT分析法\n\nSWOT 分析是最常用的内部环境综合分析方法，是由哈佛大学的安德鲁斯等人提出的一种分析方法。\n\
    \nSWOT ANALYSIS\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_173_0.png)\n\n###\
    \ （四）针对环境变化的分析方法——情境分析法\n\n➤ 在环境分析中，一种或一组情况也可被称为一个脚本；在组织各项决策中，一个脚本就是一个决策方案。显然，方案脚本以环境脚本为基础，即先形成环境脚本，再根据环境脚本形成决策的方案脚本。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_174_0.png)\n\n定量建模\n选择和调整不同的参数从而产生不同的脚本。\n\
    借助计算机进行模拟运算，分析人员对每一个脚本的合理性和发生概率做出评估。\n\n通过人的思维、判断、识别重要的环境因素，分析它们之间的关系。\n基于人的思考，可以关注和识别因素的范围十分宽广。\n\
    \n### 环境变化，复杂性和不确定性\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_175_0.png)\n\n\
    ## 第二节 理性决策与非理性决策\n\n古典的决策模式\n\n当面对决策要求时，管理者们应当……\n\n掌握全部信息，消除不确定性，逻辑和理性地评估决策环境的各个方面\n\
    \n……做出组织利益最大化的决策\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_176_0.png)\n\n###\
    \ 一、理性决策\n\n### （一）理性决策的理论基础\n\n- 理性决策通常也被称为科学决策，它假设管理者在决策时运用理性和逻辑，决策的目标是组织利益最大化。\n\
    \n- 在古典决策理论的基础上，西蒙等人提出以“令人满意的”准则代替“最优化”准则作为决策的准则完善了这一理论。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_177_0.png)\n\
    \n### 二、行为决策\n\n### （一）决策中的行为基础\n\n从是否参与决策出发，西蒙和马奇两位学者按照人的假设对管理理论作了分类：\n\n- **机械人模式（经济人模式）**\n\
    \  - 把组织成员看作进行一定作业的生产工具——机械，他们只能被动地接受命令、进行作业，在解决问题时并不发挥什么作用。\n\n- **动机人模式**\n\
    \  - 组织成员不是机械而是人，是为了满足个人的要求、动机和目的而劳动的。成员为实现组织目的而进行合作的动机是劳动生产率最重要的决定因素。行为科学管理理论属于这种模式。\n\
    \n决策者把学习、记忆、习惯等心理学因素作为决策的行为基础。\n\n**学习**\n\n根据过去的经验，采取试验的方法，通过知识的传递和理论的推断，对特定的选择将产生的结果做出估计\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_180_0.png)\n\n**记忆**\n\n把为解决一个问题而收集的情报以及从这些情报得出的结论储存起来，以便在发生同类问题时用来做出新的决策\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_180_1.png)\n\n**习惯**\n\n是帮助符合目的的行动方式持续下去的重要途径，具有“从有意识地进行选择的范围内排除情况反复”的作用\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_180_2.png)\n\n### 决策中的行为方面\n\n- 管理模式：\n\
    \  - 一种决策模式，认为管理者：\n    - 用于决策的信息是不充分和不完备的\n    - 受到“有限理性”的约束\n    - 在决策时以“满意”为追求\n\
    \n当面对决策要求时，管理者们应当……\n\n利用不充分和不完备的信息，有限理性的约束，以“满意”为追求\n\n……决策可能符合也可能不符合组织的利益\n\n\
    ### 决策的影响因素\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_182_0.png)\n\n- 有限理性：认为决策者受到价值观、无意识反省、技能和习惯的限制\n\
    - “满意”的标准：决策者不会穷尽所有可能的方案再从中选择最佳者，相反，决策者倾向于在寻找到符合最起码标准的方案之后就停止搜索\n- 联合：是为了实现共同目标的个人和团体的非正式联盟\n\
    - 直觉：直觉是对事物的一种内在的信念，不需要经过有意识的思考。\n- 承诺升级：在特定的情况下，决策者做出一个决定并且过分执著于这一决定，即使已经证明是错误的也认识不到\n\
    - 风险倾向：决策中的风险倾向是指决策者愿意参与赌博的程度。\n\n### 四、价值理性与工具理性的对立\n\n理性在决策中究竟发挥何等程度的作用？\n\n\
    目的理性\n\n价值理性\n\n情感理性\n\n工具理性\n\nVS\n\n价值理性\n\n## 第三节 决策方法\n\n### 一、决策背景研究方法\n\n\
    ### （一）决策背景的性质分析\n\n决策背景具有不稳定性，并对决策工作产生复杂的影响，给决策者认知、适应和改变环境带来困难。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_185_0.png)\n\
    \n### （二）决策背景的不确定性模型\n\n➤ 在决策背景的各种性质和特点中，核心是环境中蕴含的高度不确定性。\n\n| 环境复杂程度 | 稳定（静态）\
    \ | 不稳定（动态） |\n|---|---|---|\n| 复杂 | （Ⅱ）低—中程度不确定性<br>1. 大量的外部环境要素，而且要素不相似<br>2.\
    \ 要素维持不变或缓慢变化 | （Ⅳ）高不确定性<br>1. 大量外部环境要素，而且要素不相似<br>2. 要素常常变化且不可预测 |\n| 简单 | （Ⅰ）低不确定性<br>1.\
    \ 外部环境要素少，而且要素相似<br>2. 要素维持相同或缓慢变化 | （Ⅲ）高—中程度不确定性<br>1. 少量外部环境要素，而且要素相似<br>2.\
    \ 要素常常变化且不可预测 |\n\n环境变化的程度\n\n资料来源：饶美蛟、刘忠明主编：《管理学新论》，商务印书馆（香港）有限公司1996年版，第25页。\n\
    \n### （三）决策背景的分析步骤\n\n1. 明确决策主题\n2. 提出假设\n3. 收集资料\n4. 整理资料\n5. 趋势预测和评估\n\n###\
    \ 二、活动方案生成与评价方法\n\n### （一）活动方案生成方法\n\n**1. 5W2H法**\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_188_0.png)\n\
    \n**2. 头脑风暴法**\n\n- 请一定数量的专家，对预测对象的未来发展趋势及状况做出判断。\n\n- 通过面对面的信息交流，引起思维共振，产生组合效应，进行创造性思维，在较短的时间内取得较明显的成果。\n\
    \n- 专家的人选和对会议的精心组织至关重要。一般地说，专家小组规模以10～15人为宜，会议时间以40～60分钟为佳。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_189_0.png)\n"
