    ## 影响管理幅度的因素


    +   ➤ 主管和下属的能力

    +   ➤ 下属的物理分布

    +   ➤ 经理工作中非监督性工作的多少

    +   ➤ 工作中互动的要求

    +   ➤ 程序标准化的程度

    +   ➤ 管理任务的相似性

    +   ➤ 新问题出现的频率

    +   ➤ 经理和下属的偏好


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_324_0.png)


    ## 二、层级整合


    ### （二）组织设计中的集权与分权


    +   - 最高权力者无法完成所有决策 → 分权（程序化决策）


    ## 直线职权


    管理者直接领导下属工作的权力。


    ## 参谋职权


    组织中的参谋人员拥有的某些特定的权力。


    ## 职能职权


    管理者将部分职权授予其他个人或职能部门。


    ## 二、层级整合


    ### （二）组织设计中的集权与分权


    |  | 集权 | 分权 |

    |---|---|---|

    | 定义 | 决策权集中在组织高层的一种权力系统 | 决策权分散在组织各部门的权力系统 |

    | 优势 | 容易协调 | 参与性强，有利于增强归属感、认同感。 |

    | 问题 | 决策所需时间增加，影响决策的效率和质量；影响下属部门管理者归属感和认同感。 | 协调困难。 |


    ## 二、层级整合


    （二）组织设计中的集权与分权


    +   影响分权的因素包括：

    +   - 组织规模：组织规模越大，越需要分权决策

    +   - 政策的统一性：政策统一可以使用集权的方式进行层级整合

    +   - 成员自我管理能力：知识经济时代，学习型组织分权程度较高

    +   - 组织的可控性：下级能够正常履行职责，同时上级对下级的管理不致失控

    +   - 组织的发展阶段：不同阶段需要及时调整


    ## 二、层级整合


    ### （三）组织设计中的授权问题


    影响授权有效性的因素主要包括：


    +   - 授权内容：过多，影响管理者权威；过少，不利于下属积极性发挥，不能减轻管理者的负担。

    +   - 信息的共享程度：为接受方决策提供支撑。

    +   - 授权者的主观态度：权力观、授权意愿、责任心等。

    +   - 接受方的条件：与授权内容相关的知识、能力、经验和责任心等。

    +   - 隐含的奖励：物质+精神层面。


    ## 二、层级整合


    ### （三）组织设计中的授权问题


    +   - 授权的原则：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_331_0.png)


    授权的目的是什么？期望达到什么效果？


    鼓励并激励下属 有利于人才的培养


    上级要给予充分信任 但信任也不等于放任


    ## 三、直线与参谋的整合


    ### （一）直线与参谋的关系


    +   • 直线管理人员与参谋人员之间的联系：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_333_0.png)


    都是组织的管理者，共同为组织目标服务。


    参谋为直线管理者提供咨询、建议与审查等方面的专业服务。


    都是为了克服管理人员的局限性而设置的。直线部门——管理幅度的限制；参谋——弥补直线管理人员专业知识和精力方面的局限性。


    直线和参谋的角色可以转换


    ## 三、直线与参谋的整合


    ### （一）直线与参谋的关系


    +   - 直线管理人员与参谋人员之间的区别：


    |  | 直线管理者 | 参谋人员 |

    |---|---|---|

    | 职权性质不同 | 拥有直线职权 | 拥有参谋职权，依附于某一个直线部门 |

    | 设置方式不同 | 按组织层级自上而下逐级设置 | 按照专业需求设置 |

    | 在决策中的角色不同 | 与其岗位相适应的决策权 | 建议权 |

    | 考核标准和待遇不同 | 取决于所在组织层级、职位和绩效 | 由所提供的建议、服务的价值决定 |

    | 所承担的责任不同 | 做出决策并对决策的结果负责 | 不承担决策结果的责任 |


    ## 三、直线与参谋的整合


    ### （二）直线与参谋产生矛盾的原因


    +   • 直线管理人员与参谋人员之间产生矛盾的原因不外乎：


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_335_0.png)


    ## 三、直线与参谋的整合


    ### （二）直线与参谋的整合方法


    +   1. 慎重对待参谋的设置

    +      ◆ 提高直线管理者的综合能力，适当控制参谋的规模

    +      ◆ 重视参谋对工作的适应性

    +      ◆ 重视参谋的来源。参谋可能来自组织内部，也可能来自组织外部


    +   2. 明确职责关系

    +      ◆ 明确各自的职责关系。

    +      ◆ 完善直线管理者与参谋的沟通机制


    +   3. 授予参谋必要的职能职权

    +      ◆ 为了有利于参谋发挥作用，克服直线管理者非理性因素的影响，组织可以在必要时授予参谋部分职能权力。


