    ## 二、活动方案生成与评价方法


    ### （一）活动方案生成方法


    **3. 德尔菲法**


    德尔菲法依靠专家背靠背地发表意见，各抒己见，管理小组对专家们的意见进行统计处理和信息反馈，经过几轮循环，使分散的意见逐步统一，最后达到较高的预测精度。该法的不足之处是时间较长，费用较高。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_190_0.png)


    **4. 强迫联系法**


    将无关的观点和目标之间建立关系是这种方法的基础。一个目标是固定的，其他的目标则可完全随机地或从名单上进行选择，参加者要找出尽可能多的方法将固定目标和随机选择的目标联系起来。联系的强迫性会导致许多新的方法产生。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_191_0.png)


    ### （二）活动方案评价方法


    **1. 定量评价方法与定性评价方法**


    定量指标较为具体、直观，通常可用货币金额、产销数量、完成比率、完成阶段等来表示。定量指标有很多优点，如可以制定明确的评价标准，衡量实际绩效时也可以计算出该指标的实际值，而且通过量化的表述，使评价结果给人以直接、清晰的印象。


    然而，不是所有反映方案水平因素都能够量化。这就要求对这些因素设计定性指标予以反映。评价指标的选择既要包括定量指标，又要包括定性指标，遵循定量指标与定性指标相结合的原则。


    **2. 财务评价方法与非财务评价方法**


    传统的财务评价，多注重可用货币单位计量的财务指标。但在很多情况下非财务指标越来越重要。如在评价企业运营方案时，产品质量、技术进步、生产效率、市场占有率等指标，对最终的选择是否全面、准确也非常关键。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_193_0.png)


    **3. 动态评价方法与静态评价方法**


    - 决策评价指标体系在指标的内涵、指标的数量、体系的构成等方面均应有相对的稳定性。

    - 随着企业经营环境的变化，决策评价体系也应做相应的变更。因此，绩效评价体系还具有明显的动态性特征。


    ![](img/fb58d24fa7baa8c67e846e92bd02df61_194_0.png)


