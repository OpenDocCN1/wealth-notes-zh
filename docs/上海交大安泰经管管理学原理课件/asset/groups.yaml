    # 领导和管理关系的归纳


    +   > 从管理者和领导者的关系来看，管理者是由组织任命产生的，其产生方式是自上而下的；而领导者则是由于群体中的某些成员的认同和追随而产生的，其产生方式是自下而上的。管理者不一定能够成为领导者，领导者也不一定是管理者；有效的管理者必须是领导者；

    +   > 管理的对象是组织中的所有资源，而领导的对象仅仅是组织中的部分成员；

    +   > 管理行为追求的是提高整个组织的运行效率，而领导行为追求的是追随关系；

    +   > 管理者的领导行为是其管理行为的一种表现形式，是管理工作中的一个环节。'
