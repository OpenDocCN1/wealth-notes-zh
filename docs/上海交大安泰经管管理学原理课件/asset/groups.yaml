    # 3. 领导三要素


    +   > 领导=f（领导者，被领导者，情境）

    +   > 领导者是这一行为的主体，也是权威和影响力产生的主要来源；对领导者研究主要集中于领导者的个人特质和行为特征。

    +   > 被领导者是这一行为的客体，他们也会对领导行为的效果产生影响，因为权威真正的确立在于被领导者的接受程度，因此被领导者的特征决定了实施何种领导行为最为有效。

    +   > 领导行为还应随着组织情境的变化而调整：既包括任务结构、职位权力、工作特征等组织内部环境，也包括社会文化等组织外部环境。'
