  md: "\n## X理论以下面四种假设为基础：\n\n- 员工天生不喜欢工作，只要可能，他们就会逃避工作；\n- 由于员工不喜欢工作，因此必须采取强制措施或惩罚办法，迫使他们实现组织目标；\n\
    - 员工只要有可能就会逃避责任，安于现状；\n- 大多数员工喜欢安逸，没有雄心壮志。\n\n## Y理论以下面四种假设为基础：\n\n- 员工视工作如休息、娱乐一般自然；\n\
    - 如果员工对某些工作作出承诺，他们会进行自我指导和自我控制，以完成任务；\n- 一般而言，每个人不仅能够承担责任，而且会主动寻求承担责任；\n- 绝大多数人都具备作出正确决策的能力，而不仅仅是管理者才具备这一能力。\n\
    \n## 需要层次理论\n\n- 美国心理学家亚伯拉罕·哈罗德·马斯洛于1943年提出\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_95_0.png)\n\
    \n| 层次 | 需求 |\n| --- | --- |\n| 第一层 | 生理的需要 |\n| 第二层 | 安全的需要 |\n| 第三层 | 社交的需要\
    \ |\n| 第四层 | 尊重的需要 |\n| 第五层 | 自我实现的需要 |\n\n## 双因素理论\n\n美国心理学家弗雷德里克·赫茨伯格（Frederick\
    \ Herzberg）1959年提出\n\n- 保健因素：企业的政策、监督、与上下左右的关系、工资、工作安全、个人生活、工作条件、地位\n- 激励因素：工作上的成就感、受到重视、提升、工作本身的性质、个人发展的可能性、责任\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_96_0.png)\n\n## 期望理论\n\n- 弗鲁姆的期望理论，别称“效价-手段-期望理论”，是北美著名心理学家和行为科学家维克托·弗鲁姆（Victor\
    \ H. Vroom）于1964年在《工作与激励》中提出来的激励理论。\n- 人都是抱着某种希望去做某种事情的，人们只有预计到他们的行动有助于达到某一种目标时，才会被激励起来去做该事情，以期最终达到目标。\n\
    \n激发动力 = 效用价值 × 期望概率\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_97_0.png)\n\n\
    ## 公平理论\n\n- 公平理论又称社会比较理论，由美国心理学家约翰·斯塔希·亚当斯（John Stacey Adams）于1965年提出；\n- 该理论的基本要点是：人的工作积极性不仅与个人实际报酬多少有关，而且与人们对报酬的分配是否感到公平更为密切；\n\
    - 人们总会自觉或不自觉地将自己付出的劳动代价及其所得到的报酬与他人进行比较，并对公平与否做出判断；\n- 公平感直接影响职工的工作动机和行为。因此，从某种意义来讲，动机的激发过程实际上是人与人进行比较，做出公平与否的判断，并据以指导行为的过程。\n\
    \n## 二、管理思想的系统与权变研究\n\n### （一）管理思想的系统观——巴纳德\n\n- 巴纳德认为，应该把企业组织及其成员的相互关系看成一种协作的社会系统。巴纳德被后人称为社会系统学派的创始人。\n\
    - 在1938年出版的《经理人员的职能》这本书中，巴纳德研究了系统的特征及构成要素，并分析了经理人员的任务和作用。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_99_0.png)\n\
    \n### 管理思维的系统观\n\n### 组织是一个协作系统\n\n组织是两个或两个以上的人有意识协调活动和力量的系统。\n\n### 协作系统的三个基本要素\n\
    \n- （1）协作的意愿。\n- （2）共同的目标。\n- （3）信息的沟通\n\n### 经理人员的职能\n\n- （1）建立和维持一个信息系统。\n-\
    \ （2）从不同的组织成员那里获得必要的服务。\n- （3）规定组织的共同目标，并用各个部门的具体目标加以阐明\n\n### 组织的系统理论\n\n- **系统：**\
    \ 是一组内在相关的执行整体功能的要素。\n- **系统的类型：**\n  - 开放系统是同环境相互作用的系统\n  - 封闭系统是同环境之间没有相互作用的系统。\n\
    \  - 子系统：位于更大系统之中的系统\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_101_0.png)\n\n\
    ### （二）管理思维的权变观\n\n根据权变学派的观点，管理技术与方法同环境因素之间存在一种函数关系，企业管理要随环境的变化而变化。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_102_0.png)\n\
    \n### 权变理论\n\n- 通用的理论试图发现管理组织的“最佳方法”。\n- 权变理论认为，通用的理论不适用于具体的组织，因为每个组织都是独特的。\n\n\
    ## 三、管理本质的决策与协调研究\n\n管理的本质究竟是什么？\n\n用人？\n\n组织活动？\n\n分工？\n\n信息？\n\n决策与协调是关于管理本质的两种代表性认识\n\
    \n### 管理本质的决策研究\n\n### 2. 决策过程\n\n- 情报活动\n- 设计活动\n- 抉择活动\n- 审查活动\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_106_0.png)\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_106_1.png)\n![](img/fb58d24fa7baa8c67e846e92bd02df61_106_2.png)\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_106_3.png)\n\n### 3. 决策的准则\n\n西蒙认为，由于决策者在认识能力上和时间、经费及情报来源上的限制，不可能具备这些前提，不可能做出“完全合理”或“最优”的决策，只能做出“足够好的”或“令人满意的”决策。\n\
    \n### 4. 组织活动的类型\n\n- 例行活动：一些重复出现的工作。可以进行程序化决策：建立一定的决策程序，每当出现这类工作或问题时，就利用既定的程序来解决，而不需重新研究。\n\
    - 非例行活动：不重复出现，如新产品的开发、生产规模的扩大、品种结构的调整、工资制度的改变等。需要进行非程序化决策。\n\n### （二）管理本质的协调研究\n\
    \n明茨伯格认为，组织管理的基本问题是分工和协调，组织结构的实质是人们在组织内进行劳动分工和协调的方式的总和。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_109_0.png)\n\
    \n### 1. 组织的协调机制\n\n明茨伯格指出，不论企业采用的具体协调方法有多少种，都可以归纳为六种基本的机制。这六种协调机制在时间上相继出现，在空间上也可能同时并存。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_110_0.png)\n\n### 2. 组织的基本构成部分\n\n\
    ![](img/fb58d24fa7baa8c67e846e92bd02df61_111_0.png)\n\n### 3. 组织的基本结构形态\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_112_0.png)\n\
    \n## 四、管理分析的技术与方法研究——管理科学学派\n\n### 管理分析的技术与方法研究\n\n在管理科学学派看来，管理就是制定和运用数学模型与程序的系统，即通过对企业的生产、采购、人事、财务、库存等职能间相互关系的分析，然后用数学符号和公式来表示计划、组织、控制等合乎逻辑的程序，求出最优的解答，以达到企业的目标。作为一个学派，它主要与将定量方法运用于管理活动的研究有关，所以通常也被称为管理的数量学派或运筹学派。\n\
    \n### 定量分析的管理理论\n\n管理科学 + 运营管理：\n\n- 管理科学主要关注数学模型的建立。\n- 运营管理帮助企业更有效率或更有效能地提供产品和服务，用于解决范围极其广泛的问题。\n\
    \n**表 2.4 定量分析管理理论**\n\n|  |  |\n| --- | --- |\n| 概要 | 定量分析管理理论关注于将数学模型和程序应用于管理情境。管理科学研究开发数学模型支持决策和问题解决。运营管理关注将管理科学更加直接地应用于组织管理。为了向经理们提供信息，企业需要开发管理信息系统。\
    \ |\n| 贡献 | 开发了复杂的定量分析技术帮助决策。模型的应用提高了人们对复杂组织程序和情境的理解。在规划和控制程序中非常有用。 |\n| 局限 |\
    \ 不能充分解释或预测组织中人们的行为。数学的复杂性可能掩盖其他重要的管理技能。模型的假设是不现实的或无法实现的。 |\n\n### 管理科学在研究组织活动的管理时的假设前提\n\
    \n（1）组织成员是经济人\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_115_0.png)\n\n（2）组织是一个追求经济效益的系统\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_115_1.png)\n\n（3）组织是由作为操作者的人同物质技术设备所组成的人机系统\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_115_2.png)\n\n（4）组织是一个决策网络\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_115_3.png)\n"
