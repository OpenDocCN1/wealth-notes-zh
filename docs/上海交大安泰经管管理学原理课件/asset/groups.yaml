    \n- 搬运生铁试验：摸索出工人的日合理工作量，从而为实行定额管理奠定了基础；\n- 铲具试验：探索出铁锹多大铲物效率最高，从而为实行工具标准化奠定了基础；\n\
    - 金属切削试验：前后共花了26年的时间，15万美元的费用，写出了3万多份试验报告，仅形成的切屑就达80万磅，最后，取得了有关车床、刨床、钻床、铣床在车速、进刀、材料等方面的丰富资料，为制定各种机床进行高速切削和精密加工的操作规程提供了科学依据。\n\
    - 这些实验将他的科学管理思想理论深深地扎根在科学实验的基础上，使之成为一门真正的科学。\n\n### 科学管理研究\n\n#### （一）改进工作方法，并根据工作的要求挑选和培训工人\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_70_0.png)\n\n铁铲实验\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_70_1.png)\n\
    \n操作→动作→动素\n\n改进操作方法\n\n作业环境与作业条件的标准化\n\n根据工作要求，挑选和培训工人\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_70_2.png)\n\
    \n招聘与培训\n\n#### （二）改进分配方法，实行差别计件工资制\n\n在计算工资时，采取不同的工资率，未完成定额的按低工资率付给，完成并超过定额的按高工资率付给。由于完成并超过定额能以较高的标准得到报酬，工人愿意提供更多数量的劳动。\n\
