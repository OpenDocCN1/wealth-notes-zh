    # 第一节 实施决策的计划制定


    # 一、计划的本质与特征


    ● 计划是关于组织未来的蓝图，是对组织在未来一段时间内的目标和实现目标途径的策划与安排。一般地，人们从动词和名词两种意义上使用着“计划”一词。


    | 动词 |

    |------|

    | ● 计划（planning）是指对各种组织目标的分析、制定和调整以及对组织实现这些目标的各种可行方案的设计等一系列相关联的行为、行动或活动。 |


    | 名词 |

    |------|

    | ● 计划（plans）就是指上述计划行动的结果，包括组织使命和目标的说明以及组织所选择的战略活动在未来不同时空的展开。 |'
  - '[PAGE 205]


