  mdcn: "\n\n## 1．领导者特质理论\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_445_0.png)\n\
    \n### 基于五大人格特质理论的测量\n\n在绝大多数情况下外向性、情绪稳定性、经验开放性和责任感都对领导有影响，而其中外向性更是在不同研究设置中都对领导有着一致的影响。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_445_1.png)\n\n### 基于对领导力过程的关注\n\n六个关键特质：内在驱动力、领导动机、诚实与正直、自信、认知能力，以及工作相关知识。\n\
    \n## 2. 领导者行为理论\n\n### 2.1 独裁与民主\n\n库尔特·勒温的领导作风理论\n\n在实际工作中，要么独裁、要么民主的极端领导风格并不多见，大多数是介于两者之间的。\n\
    \n- 放任型：权力来源于信赖，给下属充分自由\n- 独裁型：权力来源于职位，集权\n- 民主型：权力来源于群体，授权\n\n### 坦南鲍姆和施米特领导连续统一体\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_447_0.png)\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_448_0.png)\n\
    \n### 2.2 俄亥俄州立大学的研究\n\n- 定规维度：领导者确定和构建自己和下属的角色，以实现组织的目标。\n- 关心维度：领导者信任和尊重下属，期望与下属建立温暖、和谐的人际关系。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_449_0.png)\n\n“双高”模式一定是最好的吗？\n\n###\
    \ 2.3 密歇根州立大学的研究\n\n- 以生产为中心：关心工作的技术、日程的安排和任务的完成，员工是达到目标的手段。以生产为中心的领导行为无论在生产率还是在员工满意度方面都是低效的。\n\
    - 以员工为中心：关注下属面临问题的人性化方面，同时着力建设具有高绩效目标的有效工作群体。以员工为中心的领导行为带来高产出。\n\n### 2.4 管理方格理论\n\
    \n布莱克和莫顿认为（9，9）方格的领导方式是最有效的，既能够提高员工满意度，又能够带来高的生产效率。\n\n图中纵轴为对人的关心（低→高），横轴为对生产的关心（低→高）。\n\
    \n| 坐标 | 领导风格 | 描述 |\n| --- | --- | --- |\n| 1,9 | 乡村俱乐部管理 | 注意让员工建立满意的关系，营造愉快友好的组织气氛\
    \ |\n| 9,9 | 团队型管理 | 工作成就来自员工的奉献，组织与员工利益一致、互相依存，从而导致信任和尊重的关系 |\n| 1,1 | 贫困型管理\
    \ | 为保持组织成员地位而以最少的努力去完成应做的工作 |\n| 9,1 | 任务型管理 | 安排工作任务，采用使人的因素干扰最小的方法来提高工作效率 |\n\
    | 5,5 | 中间型管理 | 兼顾必须完成的工作和维持员工的士气来使适当的组织成绩成为可能 |\n\n## 3. 团队领导理论\n\n- 兴起的时间：20世纪80年代\n\
    - 标志：“高阶理论”——唐纳德·汉布里克、菲莉丝·梅森\n- 主要观点：\n  - 高层管理人员在进行决策和采取行动时会受到其自身所具有的经验、性格和价值观等个性化因素的影响。\n\
    \  - 了解整个高层管理团队的特征有助于更好地预测组织绩效。\n  - 运用人口统计学变量并不能精确代表管理人员的认知和价值观。\n- 发展：对团队行动一致性的研究\n\
    \n## 第三节 领导与被领导者\n\n1. 情境领导模型—保罗·赫塞、肯尼斯·布兰查德\n2. 领导—成员交换理论\n3. 领导者角色理论——亨利·明茨伯格\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_455_0.png)\n\n### 1. 情境领导模型\n\n- 提出者：保罗·赫塞、肯尼斯·布兰查德\n\
    - 主要观点：有效领导和无效领导的差异并不是领导者的行为本身，而是领导者行为和实施情境的匹配。\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_456_0.png)\n\
    \n| 下属成熟度 | 对应特征 | 领导方式 |\n| --- | --- | --- |\n| R1 | 成熟度低。既不愿意，也没有能力承担分配的工作任务。\
