    \ |\n\n## 4. 冲突管理\n\n### 4.2 冲突的激发\n\n- 将冲突合法化：管理者应当将鼓励冲突的信息传递给员工，并且采取支持性行动，以使冲突在组织中有其合法地位。\n\
    - 适度引入外部的新鲜血液，刺激组织内部的竞争氛围。\n- 管理者也可以通过组织结构的安排来激发冲突。\n  - 企业进行变革的总体趋势是扩大管理幅度、减少管理层次、广泛引入工作团队，实现组织结构的扁平化、网络化、虚拟化。\n\
    \  - 新型组织结构讲究平等、重视沟通，能够有效提高组织的建设性冲突水平，进而提升企业绩效。\n\n## 第13章 控制\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_571_0.png)\n\
    \n上海交通大学安泰经济与管理学院\nAntai College of Economics & Management, SJTU\n\n### 第一节 控制的内涵与原则\n\
    \n- 1. 控制的内涵\n- 2. 控制的系统\n- 3. 控制的原则\n\n### 一、控制的内涵\n\n- 控制（controlling）是指对组织内部的管理活动及其效果进行衡量和矫正，以确保组织的目标以及为此而拟定的计划得以实现。\n\
    - 监督各项活动，以保证它们按计划进行并纠正各种重要偏差的过程。\n- 控制的内涵：\n  - A 目的性\n  - B 整体性\n  - C 通过监督和纠偏来实现\n\
    \  - D 是一个过程\n\n### 为什么管理者需要控制？\n\n> 每一位管理者都需要进行控制（都有控制职能）。\n> 控制是组织行为的规则，它可以使某些影响绩效的因素被维持在可以接受的范围内。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_574_0.png)\n\n### 控制为何重要？\n\n作为管理职能环节中最后一环：\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_575_0.png)\n\n### 控制的目的\n\n- 适应环境变化\n\
    - 限制错误的积累\n- 控制对企业的帮助\n- 应对组织复杂性\n- 最小化成本\n\n### 二、控制的系统\n\n控制的系统由控制主体、控制客体、控制目标以及控制的手段与工具体系四大部分构成。\n\
    \n1. 控制主体\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_577_0.png)\n\n- 高层控制主体\n\
    - 中层控制主体\n- 低层控制主体\n\n2. 控制客体\n\n- 控制客体就是评价的对象范围。具体控制对象就是控制的最终指向物，包括财产、交易和信息三大类。\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_578_0.png)\n\n3. 控制目标\n\n有效控制系统多倾向于具有一些共同的特性，尽管这些特性在不同情况下的重要性并不相同。一般来讲，有效控制要达到以下目标：\n\
    \n- 确保组织目标的有效实现\n- 经济且有效地利用组织资源\n- 确保信息的质量\n\n4. 控制的手段与工具体系\n\n- 控制的手段：\n  - 控制的机构由组织中不同的控制层次和各个不同性质的专业控制部门组成\n\
    \  - 控制的工具主要是凭以获取信息的计算机和网络等\n  - 控制的运作制度是指控制的任务与职责、控制的程序与规则等\n\n### 控制系统\n\n-\
    \ 控制目标体系：是指进行控制活动所要达到的所有目标；\n- 控制主体：是执行控制活动的各级管理者及其所属的各职能部门；\n- 控制的对象：是组织的整个活动；\n\
    - 控制的方法和手段：即为达到有效的控制，所采用的各种科学方法和手段\n\n### 三、控制的原则\n\n- 有效标准原则\n- 控制关键点原则\n- 控制趋势原则\n\
    - 直接控制原则\n- 例外原则\n\n现实中，选择关键点除了要有丰富的经验、敏锐的洞察力和决策能力外，还可以借助有关的方法。\n\n### 有效控制系统的特征\n\
    \n- 准确性：一个提供不准确信息的控制系统将会导致管理层在应该采取行动时而没有采取行动，或根本没有出现问题时而采取行动；\n- 适时性：最好的信息，如果是过时了，也将是毫无用处的。因此，一个有效的控制系统必须是能够提供及时的信息；\n\
    - 经济性：任何控制系统的运行都会产生成本，因此，从经济的角度看，控制系统必须是合理的；\n- 灵活性：控制系统必须具有足够的灵活性以适应各种不利的变化；\n\
    - 通俗性：一个不容易理解的控制系统是没有价值的。因为一个不容易理解的控制系统会导致不必要的错误；\n- 标准合理性：控制的标准必须是合理的而且能够达到的；\n\
    - 战略高度：管理层应该控制那些对组织行为有战略性影响的因素；\n- 强调例外：由于管理层不可能控制所有的活动，因此他们的控制手段应该顾及到例外情况的发生；\n\
    - 多重标准：由于多重标准比单一标准更难以把握，因此它可以防止工作中出现的做表面文章的现象，并且能减少狭隘的工作方式；\n- 纠正行动：一个有效的控制系统不仅可以指出一个显著偏差的发生，而且可以建议如何纠正这种偏差，即在指出问题的同时给出解决问题的方法。\n\
    \n### 第二节 控制的类型\n\n### 控制进程\n\n- 前馈控制\n- 现场控制\n- 反馈控制\n\n### 控制职能\n\n- 战略控制\n\
    - 财务控制\n- 文化控制\n- 营销控制\n\n### 控制内容\n\n- 制度控制\n- 风险防范控制\n- 预算控制\n- 激励控制\n- 绩效考评控制\n\
    \n### 一、控制进程分类\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_586_0.png)\n\n### 运营控制的类型\n\
    \n- 反馈\n- 投入\n- 生产\n- 产出\n- 事前控制：关注进入组织系统的投入\n- 事中控制：关注投入如何被转化为产出\n- 事后控制：关注组织系统的产出\n\
    \n### 反馈控制\n\n![](img/fb58d24fa7baa8c67e846e92bd02df61_588_0.png)\n\n### 前馈控制\n\
    \n![](img/fb58d24fa7baa8c67e846e92bd02df61_589_0.png)\n\n### 二、控制职能分类\n\n| 战略控制\
    \ | 财务控制 | 营销控制 |\n| --- | --- | --- |\n| • 企业战略管理者和一些参与战略实施的管理者，依据战略既定目标和行动方案，对战略的实施状况进行全面评价、发现偏差并进行纠正的活动。\
    \ | • 传统的财务控制衡量标准有比率分析（流动性比率、杠杆比率、活动性比率、收益率等）和预算分析（投资预算、现金预算、收益预算和资产负债预算等）。<br>•\
    \ 除了传统的财务工具，管理者还使用经济附加值和市场附加值等工具。 | • 是企业用于跟踪营销活动过程的每一个环节，确保能够按照计划目标运行而实施的一套完整的工作程序。主要包括年度计划控制、盈利控制、效率控制以及战略控制。\
    \ |\n\n### 战略控制\n\n- 企业战略管理者和一些参与战略实施的管理者，依据战略既定目标和行动方案，对战略的实施状况进行全面评价、发现偏差并进行纠正的活动。\n\
    \n### 财务控制\n\n- 传统的财务控制衡量标准有比率分析（流动性比率、杠杆比率、活动性比率、收益率等）和预算分析（投资预算、现金预算、收益预算和资产负债预算等）。\n\
    - 除了传统的财务工具，管理者还使用经济附加值和市场附加值等工具。\n\n### 营销控制\n\n- 是企业用于跟踪营销活动过程的每一个环节，确保能够按照计划目标运行而实施的一套完整的工作程序。主要包括年度计划控制、盈利控制、效率控制以及战略控制。\n\
    \n### 控制的领域\n\n- 物质资源控制——库存控制、质量控制等；\n- 人力资源控制——人员选择与安置、培训与提高、绩效评估与薪酬等；\n- 信息资源控制——销售与营销预测、环境分析等；\n\
    - 财务资源控制——债务控制、应收账款控制等。\n\n### 三、控制内容分类\n\n控制\n\n- 制度控制：一般包括制度的制定、执行和考核。\n- 风险防范控制：一般应包括风险的预警与辨识、风险的评估以及风险的预防。\n\
    - 预算控制：通过量化标准使管理者及员工明确自身目标，实现企业总体目标与个人目标紧密衔接。\n- 激励控制：通过激励调动管理者及员工的积极性和创造性。\n\
    - 绩效控制：包括考评指标和考评程序的制定、考评方法的选择、考评结果的分析和纠正偏差与奖励措施等关键环节。\n"
  mdcn: "\n\n### 五种冲突处理策略\n\n| 策略 | 最适合使用的情况 |\n| --- | --- |\n| 竞争策略 | 当需要采取不受欢迎的措施迅速解决重大问题，或他人的支持对你解决问题不十分重要时。\
    \ |\n| 合作策略 | 当时间压力很小，各方均非常希望双赢的局面出现，或问题特别重要、不可妥协时。 |\n| 回避策略 | 当冲突较小，情绪过激难以平静，或武断的行为所带来的潜在破坏会超过冲突解决后所获得的利益时。\
