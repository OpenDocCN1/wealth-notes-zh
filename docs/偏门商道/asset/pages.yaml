- pgno: 101
  md: '# 在上世纪90年代初期，阎东升所做的也并不全是养殖项目。


    那时他曾看过日本著名企业家松下幸之助的一本书，书中倡导多元化经营。当时，中国的市场经济尚未成熟，几乎凡是生意都好做，市场竞争还是低层次的，并不激烈！，因此大部分商人、企业家都在多元化经营的大潮中兴奋地冲浪。阎东升自然也不例外。其实就在做“黄金屋读书社”那一年，他曾生产过一种能治疗痔疮的“神奇香烟”。当初阎东升发现这个项目，是看了《哈尔滨日报》上的一条新闻。


    新闻上说，哈尔滨一家名为“长城药物烟草研究所”的单位，研究出了一项专利技术，就是利用烟草添加相关专利药物，达到吸烟治疗痔疮的效果。此项专利的持有人就是研究所的所长，他将此专利产品命名为“长城痔烟灵”。阎东升看后眼前一亮，马上跑去找这位所长。所长40多岁的年纪，出生于中医世家，研究此专利技术已很长时间。他说，抽烟治疗痔疮，一般人听了都会觉得很神奇，甚至认为匪夷所思，抽烟与痔疮，可谓“风马牛不相及”。其实，中医有这样的理论，“肺与大肠相表里”，依据这一理论，通过抽烟，将混合在烟丝里的药物成分连同烟雾吸到肺部，进'
  merge: -1
  img_proc: true
- pgno: 102
  md: '人血液循环等机能，作用到大肠，然后达到治疗痔疮的效果。对这项疗效极好的专利，所长曾以此跟哈尔滨卷烟厂商谈过合作的事，但由于国家不允许个人参股到卷烟企业中，合作没有谈成。


    阎东升得知事情的来龙去脉后，倒有了自己的想法。他对所长说，国家不允许私人开烟厂，与烟厂合作的事你就不要再去费力气了，我们不如另辟蹊径，以开门诊的形式静悄悄地做，全省、全国布点，才有可能做大做成功，虽然达不到与卷烟厂合作的规模，但一年挣个几千万不在话下。阎东升的话让所长将信将疑，接着，阎东升又把自己这一路来的商业经历简要地讲了讲，打消对方的顾虑。一席谈，所长对眼前这位小年轻颇有刮目相看之感，尽管他还不知道阎东升居然就是个百万富翁。事实上，当时能有几百万资金实力的人，也并不那么容易找得出来。跟研究所的所长谈成了合作的协议，阎东升在黑龙江市场给他打了十几个点，把黑龙江的代理签了下来。


    阎东升将此项目交由曾成功策划了“黄金屋读书社”的王忠志来操作。说起来也颇有意思，就在阎东升准备做“长城痔烟灵”的时候，当时山东有一个叫“荣昌肛泰”的项目，其专利人也找到他商谈合作事宜，可不知为什么，阎东升还是看好“长城痔烟灵”，没做“荣昌肛泰”。如今“荣昌肛泰”市场卖得很火，“贴肚脐，治痔疮”的广告语可谓妇孺皆知。这是题外话了，透过这么一段小插曲，倒可以看到当时年轻的阎东升在商界已不是个默默无闻的角色。广告营销是阎东升的强项，拿到项目后就通过黑龙江广播电台大做宣传，覆盖东三省。“长城痔烟灵”一面市，果不其然深受欢迎，这种由作坊卷制的产品虽不如大厂那样制作精良，可治疗效果十分明显，一时间也赢得了好口碑。


    小小的治痔疮香烟，短短的时间就让阎东升挣了100多万。如果这个项目能一直做下去，它所带来的利润和影响力，也许足以让今天的阎东升成为医药或保健品行业的风云人物。就在这种能治痔疮的神奇香烟在市场'
