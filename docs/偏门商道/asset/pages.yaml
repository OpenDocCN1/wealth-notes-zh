  md: '年前日军炸弹哗爆炸》报道，文中称双城市周家镇农民在拆除日军遗留的旧炸弹时，炸弹突然发生爆炸，当场造成一死两伤的惨剧。他在震惊之余经查阅资料，发现“8·29爆炸案”已是周家镇第45起日军遗留武器伤人事件。


