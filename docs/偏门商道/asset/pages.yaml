  img_proc: true
- pgno: 113
  md: '原来，“步步高”曾是杭州某鞋厂使用过的商标，后鞋厂倒闭，商标也就“闲”着了，很长时间并不受人关注。就在阎东升的“步步高”鞋卖得风生水起的时候，北京一位“高人”到杭州该鞋厂花了10万元钱买走了“步步高”的商标权，而阎东升当时也想到了商标权的事，遗憾的是他派手下到鞋厂的时候已经晚了几天。


    “步步高”商标权就此旁落他人手里。


    要想这买回这一商标，对方开价200万。当时阎东升公司的董事会不接受这个价格，认为对方此举无异于讹诈。


    想想这还是在1994年，当时人们哪有今天的商标和品牌意识？200万买个商标，无疑天价，很难有人愿意接受。假如对方开个二三十万的价，估计阎东升就认了。


    拒绝商标持有者开价的结果，就只能是生产出来的鞋子不能再叫“步步高”了。他们思来想去，另换了“三好贝力克”的商标。


    谁知这样一来，产品销售一落千丈，才做了两年的项目竟从此“黄”了，后来再也没干起来。


    说起来，“步步高”鞋项目的好景不长，深深切切地给阎东升和他的合作伙伴们上了一堂商标和品牌意识的课。


    有意思的是，当时天津有一位原来经销“步步高”鞋的商人果断地改用了“比你高”商标，结果成功地延续了原“步步高”鞋销售旺盛的势头，生意越做越大，狠赚了一笔。


    说起来，“比你高”的创意其实就来自原“步步高”鞋的广告词——“穿上步步高，就是比你高”，从这也可看出这位天津经销商的聪明和品牌意识：贴“比你高”商标的鞋，会让消费者看上去觉得还跟原来“步步高”鞋有着某种紧密的关联性，有亲缘感；而“三好贝力克”的名称不仅让人读起来拗口，而且完全斩断了与原“步步高”鞋的品牌关联，在创意上的确大有欠缺。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '据说天津邸位经销商在增高鞋这个项目上挣了上亿的利润，也许是尝到了做“足下文章”的甜头，他如今所做的“千子莲”足底按摩保健项目，依然是跟足下有关，门店开遍了大江南北各大中城市。


    有人很替邱东升感到惋惜，如果他那个增高鞋项目能顺利地做下去，完全可以做成一个产业，“步步高”商标的意涵很好，而且朗朗上口，大家耳熟能详，这三个字完全可以成为中国青少年用品系列中鞋类产品的一个响亮品牌。


    不讳，“步步高”鞋项目的中途夭折，还有另一个最重要的原因——那就是邱东升此间操作的一个养殖项目出事了，他又一次因为偏门行当的牵绊而被迫躲进了深山里。


    在肩顾不暇的情况下，再好的项目也只能放弃了。'
