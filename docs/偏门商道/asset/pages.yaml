    至今为止，林尚沃还从未依靠过官府，也绝不知特权与照拂为何物，事实上他的确对处理这样的事情茫然无措。

    朴钟一马上回答他：“蜂蜜自然是越甜越好，因为蜂蜜越甜，蚂蚁就会越快为您穿线疏珠。”

    林尚沃又问：“要甜到什么程度才行？”

    “大哥，”朴钟一对林尚沃说道，“朴准源大人是权倾一时的重臣，他的丧礼上会有来自全国八道的各方豪士，八道的官员和首富们会成群结队地涌去。何况，朴大人的公子朴宗庆大人现为谒政府使，步其父之后坐掌握着天下权柄。不光是八道的守令与幕僚们会献上各地的特产，而且还会有各种堆为大观的蜂蜜从全国各地被送到京城。照我看来，如果不是远远超出别人的数目是不可能打动朴宗庆大人的心的。”

    “那么具体该多少才成？”林尚沃又问道。

