  md: '小就是那种非常慷慨的人，尽管那辆摩托车在当时算是很昂贵的私人财产，但他仍然让兄弟们轮流骑着它，疾驰在哈尔滨的街头，带着喜悦和满足，他们分享着创业成功后的快乐，这些年纪在
