  md: '了。这实际上已是一种价值观的取向和人生境界的追求。


    阮东升身边的人对这样一些发生在他身上的细节都不会陌生：每次外

    出吃完饭，剩余的饭菜无论多少肯定要打包回来吃，而拿根牙签总是习惯

    折成两段来用，甚至餐纸也会撕成两半再擦拭。在家里吃饭，如有稻生米

    掉地上，肯定会捡起来吹吹就吃掉。


    这样的行为举止对认可者而说，是一种美德，而对一些觉得不以为然

    的人来说，也许就成一种奢冗了。


    阮东升当年的老朋友都不会忘记这么一次令人捧腹、也令人深思的

    “排骨事件”。


    那是上世纪八十年代末的旧事了。那时候阮东升正领着兄弟们做着一

    个比较大的项目，大家都比较辛苦，所以也不时地请手下的兄弟们到饭馆

    去吃饭，改善改善伙食。有一次，大家正吃着，邻桌有两个人吃到一半不

    知怎么的就离桌走了。阮东升看到那两人的桌面还有大半盘的糖醋排骨没

    吃剩下了，也许觉得挺心疼的，说了句“太浪费了”，于是就起身自自然

    然地把邻桌的那半盘排骨，端到了自己兄弟们这桌来。


    谁知过了两分钟，邻桌离开的那两个人竟然又回来了，他们一屁股坐

    到椅子上，两眼定睛一看，发现原来桌面上的糖醋排骨居然不翼而飞了，

    于是边四处张望边惊呼：“我们的排骨怎么没了？”此情形之下，阮东升倒

    也不尴尬，站起来对那两人说：“排骨我们吃了，以为你俩走了，觉得剩

    下挺可惜的。我再给你们上一份吧。”于是，他又叫服务员给邻桌这两位

    重新点了一份一模一样的糖醋排骨。这过程，阮东升倒是大大方方的，一

    切都是那么坦然。


    那两人吃一半的排骨虽然被别人给端走了，但又来了一份新的，倒也

    没有什么可说的，只是边吃边不时扭头瞪一瞪阮东升，也许满腹狐疑：

    “这小子看起来也不是没有钱，怎么还会端走别人剩下的菜呀？”而阮东升

    这桌的兄弟一个个当然觉得挺可乐的，等邻桌那两人吃完饭离开，大家直'
