- pgno: 247
  md: '金正喜日后彻底接受文人画风，正是得益于良师翁方纲。受翁方纲的熏陶，金正喜终生致力于追求有文气的画即文人画，就像他在写隶书时一样，以笔墨之美为菁华，让自己的心意在古朴、简洁的笔势中自然流漓。


    金正喜尤其擅长画兰。他经常把画兰比作写隶书，强调一个人的心里必须没有虚假和粉饰。金正喜最厌恶伪善，因此他经常借曾子“十目所视，十手所指，其严乎”的话对别人说：


    “画兰，哪怕你只是在一枝花茎、一个花叶上有自欺的心理，你就不可能得到一张完美的画。所以，画兰绝不能有自欺之心。”


    金正喜和自己的导师翁方纲第一次见面时，就于顷刻间明白了一个真理。于是，他便成了翁方纲入门弟子。而且金正喜回国两年后，翁方纲还亲自致信于他，认定他是继承自己法统的正法弟子，并亲自写了一道匾额，为金正喜取号为“诗庵”。从此，金正喜开始使用良师亲自为他取的“诗庵”之号，尤其是在画兰以及画那些文人画风的画时特别喜欢用这个号，以彰良师之意。从这里可以看出，得遇翁方纲对于金正喜有着非同寻常的意义，使金正喜
    Nürnberg'
