  md: '对自己，是一份总结和自省，是一种商业良知的回归；对别人，或许可以当作一个借镜。


    阮东升涉足过很多商业领域，比如洗涤、酒类、餐饮、保健品、汽车、贸易等等，对他而言，利润低于两百万的，市场空间不大的项目，他是不会去做的。对于致富项目、尤其是特种养殖这样的商业领域，由于他有着丰富的操作经验，因而对一个项目的前瞻、判断都有过人的眼光，比如这个项目能否做大、能有多大的利润、能做多少年，他都能事先一一分析出来，十分精确。多年的实战，练就了他的这种视野、思维和判断力。很多时候，他对某个项目预先判断得出的结果，至少要到两三年后印证了，手下的人才能看出来，这样独到的判断力，常常令他周边的人折服不已。从这点，也着实看出阮东升的精明和商业天赋。


    阮东升是个不喜欢常外出旅行的人，他的视野来自于他对大量最新信息的广泛收集和吸纳上，而这就必须得借助媒体。


    曾有一位叫李铁军大学生当年到阮东升的公司应聘，面试的时候阮东升随便问了他一句“平时都有些什么爱好”，李铁军随口说了两样，“听收音机、看报纸。”没想到就这么一说，却让阮东升听了甚为高兴，他随即微笑着说：“有这两个爱好就够了，我就是靠这两样发的家。”


    阮东升所说的确是实情，从这也可以看出，在阮东升的心目中，媒体和信息占据的是何等重要的地位。当然，那个大学生后来被聘用了，并安置在重要的部门。


    事实上，阮东升是一个真正了解并懂得利用媒体的商人，在每一个项目的运作中，无不是做到了与媒体之间的双向互动。收音机、报纸这两样，他不光认真听和看，而且也将自己的信息在这两个平台上发布，让更多的受众成为自己潜在的客户。也正是由于阮东升十分重视各类商业信息的收集、筛选，以及在项目运作过程中有针对性的、高强度的媒体广告投放，所以在这样一个双向的媒体互动中创造了商'
  merge: -1
  img_proc: true
- pgno: 141
  md: '业奇迹、赢取了原始积累的财富，也就不足为怪了。


    说到“阡氏战法”，就不得不讲究阡东升常拿在手里的一件“独门兵器”——收音机。说它是“独门兵器”，一是因为在如今的电子信息时代，看电视、上网的人此比皆是，可专门听收音机的人好像不多见了；二是收音机又是阡东升长久以来的商战法宝，堪称一件称手的“兵器”，而且这么一件“兵器”在他手里早已是运用得出神入化，令人叹为观止。


    对于收音机，阡东升不仅有一份特殊的情结，而且也有着自己的独到体会和见解。他认为与其他 Koch 的媒体平台相比，广播有不少不可比拟的优势：广播不受时间地域的限制，只要身上带有一台收音机，就随时随地可以收听新闻，而报纸新闻传送需要时间，电视也要坐在电视机前才看得到，收音机随时打开就能收听到新闻；广播的信息传递速度之快，可以做到与新闻事件同步，假如你开着车，可了解到那条道路堵车，这一条报纸、电视、互联网都无法做到，只有电台有这个能力；广播的互动性好，只要有一部电话或者手机，你就可以参与电台的节目，而且可能立即传送出来，让大家听到；广播是唯一不用眼而用耳接收的媒体平台，可以一边劳动一边听，一边开车一边听，一边炒菜一边听，可以说，听广播可以不影响工作，其他的媒体就不行，非要专一看不可。所以因为广播有着这些优越性，早些年曾有人预言，收听电台广播的人会越来越少，事实却恰好相反，收听的人越来越多了。如今电视机越来越大，收音机却越来越小，阡东升笑称“越是小东西，都是生命力最强的。”


    少年时期的阡东升作为科技小爱好者，就自己动手制作过简易的小半导体，从商后一直以来更是养成一个习惯，那就是随身带着一个小收音机，还有一个小本儿和一支笔，小本儿上记录着从中央人民广播电台到全国各省电台的波段，以及经济新闻类节目的播出时间。


    这一听一记之下，小收音机里可有大乾坤。


    阡东升不仅能迅速地掌握各种经济信息动态，听到一些好的项目或者'
  merge: -1
  img_proc: true
- pgno: 142
  md: '是有价值的信息，他就会用笔记下来，而且对节目中播放的广告，他相对于常人而言更是能听出一种“含金量”。


    阮东升毕业是做致富项目起家的，因此他对那些致富项目类广告性质的讲座十分熟悉。他会细细地听有关讲座所推销产品的价格、市场，听了一段时间就能得出自己的结论、判断，并分析这些时段的内容适不适合相应的人群、广告投放是否有效、这一类型的产品卖得好不好等等。有时候他甚至会派人去调查，从而验证自己的判断到底是不是正确。


    很多时候他是在听自己企业所发布的广告，并从广告中判断各地公司的营销进展和业务状况。


    他对广告信息的这种准确的判断力，是靠长期的积累。他认为广告有很多种模式，一个项目或一种产品，刚开始的时候应该怎么上，应该持续多久，都有一定的规律可循。比如说一个药品的广告，刚开始上的时候由权威人士或专家搞讲座，介绍功效、产品功能，这叫权威影响阶段。这一阶段大概在两个月左右，看你能不能持续下来，能持续下来，说明你还在运作，肯定还赚不到钱；什么时候该上市场的


