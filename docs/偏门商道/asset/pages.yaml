  md: '个小年轻，哪来的这么多钱？一问之下，阮东升不敢说是做洗衣粉的，想了想只能说是做化工原料的。邻居都知道老阮家发财了，但不知道挣了多少钱，几万？十几万？一时间，街坊邻居都在饶有兴致地猜测着。当然，最高兴的自然还是阮东升的父母，这个从小不听话的儿子，现在终于为家里争了口气。


