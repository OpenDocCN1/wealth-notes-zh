  md: '北京商人们发起的联合抵制运动是林尚沃人生中第一次危机。中国商人的联合抵制，把林尚沃推上了生死抉择的歧路。林尚沃一连几天彻夜不眠，冥思苦想却难出良策。


    他只有两种选择，要么按照中国商人们的愿望降低公告价格，要么带着人参原样返回朝鲜。但这两种做法都是林尚沃所不能接受的。


    也就在这时，林尚沃的脑海里忽然回想起朴钟一的一句话：


    “这次，如若我们不能凭借自己的力量冲破难关，那就来定了！”


    最后这句话，一股脑地在回响着，攫动着林尚沃的心。


    “死定了，死定了，死定了......”


    朴钟一这句话为什么像毒刺一样钉在脑际不肯离去，连林尚沃自己也不明白。


    死定了，我们死定了。


    在度过了几个不眠之夜后，林尚沃的脑海里突然响起一个炸雷般的声音。那是秋月庵的石栄大师的喊叫声。在林尚沃就要离开秋月庵下山还俗之际，石栄大师曾对林尚沃说过这样的话：“......你这一生，将遭遇三次大的危机。每次危机来临，你都要设法克服它，否则，你就会在一朝一夕之间招来灭门之祸。”


    # 置之死地而后生


    当时，林尚沃曾问大师：“怎样做才能摆脱这些危机呢？”


    听了林尚沃的问话，石栄沉默良久，突然要林尚沃为他研墨，然后提笔在纸上写了一个大大的“死”字。


    写过字，当时石栄又问林尚沃：


    “知道这是什么字吗？”


    “知道的。”


    “那么，这是个什么字？”'
