- pgno: 155
  md: '1993 年。


    自从宋志才 “单干” 之后，与阮东升就踌躇不断，开始阮东升也百思不得其解，等发现了宋志才的所为后，极为惊诧，但一切为时已晚。尽管多次约他面谈，谓这样做太危险了，炒股哪能永远都包赚不赔的？并劝告他赶紧收手，做好善后。此时的宋志才哪里听得进去，于是阮东升果断地与宋志才进行了
    “切割”，从此不再有法律上的任何关系。


    一年后，宋志才果然出事了。这时候股市下跌，宋志才挪用资金去做的买卖又亏了本，大家按约要拿利息和分红的时候，宋志才哪里还拿得出钱。发觉苗头不对的群众开始嚷嚷着要宋志才退还他们的本金，1994
    年的一天，宋志才突然 “人间蒸发”，携款潜逃，不知所终。


    此事在哈尔滨引起轩然大波，影响甚为恶劣，在哈市的股民中几乎没有人不知道此事的。公安部门随后对他全力追缉，但至今仍未抓到人。有传言说他跑到意大利去了，中国方面要引渡他，他居然申请了
    “政治避难”，当了难民茍延残喘。


    当年的那些受害者来自社会各阶层，直到宋志才东窗事发出逃后，他们才知道自己的发财梦彻底破灭了。当这些上当者回过神儿，发觉自己被坑惨了的时候，他们又是上访又是游行，很是折腾了一番，但这又能怎么样呢？最终还是不了了之。其实如果当初不是贪图高额回报，不顾风险地参与集资，又何尝会上当受骗？当损失难以挽回再怨天尤人已经于事无补，毫无意义了。


    此后的阮东升对股票兴味索然，再没涉足股市。


    不过提起当年的股票热，倒是有不少值得让人玩味的地方。第一代股民发财的的确很多，但到今天大多已经销声匿迹了。第一代股民的金融专业知识显然是很不足够的，大部分人是跟风而为。少部分赚了钱的转行开公司做实业成功发展或保留了部分资产过安逸生活的有一些个案，但绝大多数人都是先一夜暴富，然后渐渐的把钱赔光用光，现在和普通人没有多'
  merge: -1
