  md: '1 807 年，也就是年仅 11 岁就登上王位的纯祖即位第七个年头的九月。


    林尚沃与朴钟一急急匆匆赶往京城汉阳。

    当时，林尚沃年方 29 岁。

    林尚沃与朴钟一风风火火地急赴汉阳，是因为当时炙手可热的权臣朴准源刚刚以 68 岁之龄作古。

    朴准源，朝鲜王朝后期的文臣、大学者，自幼通六艺，诸百家，女儿成为定祖的夫人后进入当时的权势中心。

    第三个女儿被选为正祖的嫡<|start|>in after... 妹嫡后，朴准源一跃龙门，仕途畅通，飞黄腾达，扶摇直上。后妹嫡生元子，朴准源成为太子的外祖父，并因辛苦护产而擢升通政大夫，经常滞留宫掖，保护元子，为太子之辅。

    1801 年，外孙纯祖终于承大统登王位，朴准源被垂帘听政的贞顺王后重用，历任户曹、刑曹、工曹三曹判书，任禁卫大将，掌三营兵权长达几年人年之久，权倾一时，成为权势的核心。

    在今天的驺州，仍保留着歌颂其业绩的神道碑。据传神道碑的碑文是


    # 第十六章 天下第一商'
