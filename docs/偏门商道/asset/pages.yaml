- pgno: 229
  md: '第三天中国商人们来到同仁堂门前看到那里张贴出来的公告价等时，忽然齐刷刷地愣住了。他们简直要怀疑自己的眼睛是不是看错了，因为那告示上写着：

    “人参一斤，银40两。”

    中国商人们瞪目结舌，张大的嘴惊得再也合拢不起来。

    过去的人参价格都是一斤25两银子，而眼前这价格简直是贵得离谱。纵然是人参歉收，缺货走俏，到目前为止也从未出现过一斤超出30两的情况，这几乎已经成为长期的惯例。但现在，这长期的惯例竟然被打破了。他们堂而皇之地贴出了每斤40两的公告价。即便每斤要价30两，也算得上几百年来的最高价了，可眼前居然一次要价40，难怪中国商人们会目瞪口呆。

    中国商人与来自朝鲜的人参王林尚泳开始暗中较劲。

    其实，这次林尚泳一次要到每斤40两的天价，乃是事先谋划好的。因为迄今为止，来自朝鲜的人参通常都是以相对较低的价格成交的，尤其是相对于中国巨大的需求量相比。

    人参交易主要是由译官们经手的，而每斤25两的人参交易价格始于


    # 第十七章 暴风前夜'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 偏门

    商道


    17世纪，这样算起来，在近二百年的漫长岁月里，人参的交易价格是一成不变的。其中的原因很简单：人参交易一向大都是由译官和湾商们经营的，而他们的经营规模通常又都是少量、零散的，因而朝鲜商人们不具备足够的组织力量在价格上统一口径，即使有几个商人合起伙来试图提高价格，也因为每个人本钱微薄，压根没有余力同中国商人们打长期消耗战而告败。于是，来自朝鲜的客商们只能打掉牙齿肚里吞，乖乖接受这二百多年来老的行情。


    但现在情形有所不同了。由于朝廷宣布实行人参交易权，几乎所有的人参都已被林尚沃垄断。个别的私下贸易成为非法，所有的人参贸易权都已归到林尚沃手下。人参交易窗口的一元化，使人参贸易自身的组织力量得到了加强，并在价格上获得了竞争
    flank。


    林尚沃觉得，打破长期惯例的绝佳机会业已来临。尤其是，他对因去年人参歉收北京一带已了无存货的情况了如指掌。


    机会终于来临。林尚沃觉得，现在正是孤注一掷的绝好时机。这次林尚沃一次贩来足足5000斤上佳人参，正是经过了周密的盘算，要先发制人占领有利地形，同中国商人们决一雌雄。


    “人参一斤，银40两。”


    从这个意义讲，同仁堂前贴出的高得超出想像的价格公告，当然也就是林尚沃向中国商人们发出的宣战书。


    宣布开战的布告。


    林尚沃的宣战书，意味着一场以命相搏的彻底拼斗，也就是说，作为一个商人，要么就此消亡，要么藉此成为一个天字号商人。这个宣战书，立即在北京的药材商中引起轩然大波。一直到1809年岁末，没有一个中国商人造访林仲一投宿的客栈去买人参。


    这是前所未有的事情。


    通常，大部分的人参都是在贴出公告价后两三天内悉数销完。林尚沃'
