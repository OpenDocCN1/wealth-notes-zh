  md: '人也有义务照付，难道不是这样吗？


    林尚浑最后具体开出数目的那张银票，面额是一万两。白银万两，这并不是什么小数目，但还是被朴钟一口否决。朴钟一还对他说：


    “要得到更大的商权，就得借重更大的权势的力量。而要借重更大的权势的力量，就得有谁也没有尝过的蜂蜜。”


    # 空白银票的秘密


    那天夜里，林尚浑辗转反侧，思索再三，终于做出一项重大决定。


    空白银票。


    他决定开一张空白银票，那是一种出票人给予收票人的完全任意权利。金额、给银地点、期限，一切都可由接受这张银票的人自己任意决定。从这种意义上讲，林尚浑大概能算得上我国商人中出具空白银票的第一人。


    收到空白银票的人，可以随意在上面填写自己想要的金额，他可以填上区区一两，也可以填上千万两。不管他开出多大的数目，林尚浑都有义务如数给付。


    当时，林尚浑觉得，除此之外别无选择。


    “假如我开千两，就有千两的回报；开万两，有万两的回报。不管我开出一个什么数目，只要我写得出，就能够得到相应的回报。这样做，终不过是一笔交易。但如果我献上一张没有数目的空白银票，我就能够得到对方的真心，这就不再是交易，而是友情。”


    林尚浑的想法果然奏效。朴宗庆这位天下第一权臣，正是被这张空白银票打动了心。


    一张空白银票，赤裸裸地表现着一个人的无边欲望，也终于打动了这位天下第一权臣的心。


    “是什么缘故让你给我开出这样一张空白银票？”'
