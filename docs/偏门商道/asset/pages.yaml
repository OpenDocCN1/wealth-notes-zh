- pgno: 240
  md: '朴钟一马上还回去同仁堂找王造时。和朴钟一一样，王造时也大吃一惊，一副惊疑不定的表情，但最后还是决定照林尚浑的决定去办。


    听说同仁堂中药店前换上新的布告牌，中国药材商们激动得欢呼雀跃。通过这placed空前的团结，他们形成了强大的抵制联盟，他们非常自信地认为，他们终于掀倒了朝鲜参王林尚浑。


    赢了。


    中国商人们欢呼起来。


    终于赢了林尚浑。不但赢了，而且挫了林尚浑的自尊心，从今往后人参的价格就可以由中国商人们任意操纵了。


    中国商人们三三两两地走上了前门大街。正是过年时节，街上到处在燃放爆竹。他们不约而同地来到同仁堂前。


    但那一瞬间，他们却再一次惊呆了！的确，以前的告示牌已被取掉，又挂上了一个新的告示牌。但那新的告示是这样写的：


    “人参一斤银45两”


    人参的价格非但没有降回原来的25两，反而又涨了5两，从40两升到了45两。一斤40两的公告价格本就是几百年来前所未有的天价，可现在，这天价之上又添了5两。


    “鬼子！”


    人群中不知是谁和着唾沫吐出了这样一句话。“鬼子”，是对像鬼一样肮脏的人的谩骂。马上，又有谁“呸”了一声骂道：


    “偷儿！”


    “偷儿”，指盗贼，是对偷窃他人财物的卑劣的盗贼的骂语。


    他们一个个唾沫飞溅地大骂着，骂过后再次商定坚决把这个朝鲜人参贩子林尚浑赶出北京商界，做完这个决定后，他们就离开了那里。


    但真正的当事人林尚浑却稳如泰山，不为所动。他已从石崇大师留给他的“死”字里摸到了收拾乱局的秘方，因而决心既定，天下太平。贴出'
