- pgno: 138
  md: '个行业、太了解这个市场了。

    能让作为普通商人的阮东升十多年来畅游其间、进出自如的商海领域就是致富项目（其中最重要的是特种养殖项目）。发轫于上世纪八十年代的全民创业致富热潮，其实至今也热度未减，人们对财富的渴求，催生出一个极具中国特色的商业领域，那就是庞大而多姿多彩的致富项目市场。上世纪八十年代和九十年代可谓是致富项目发展最迅猛的年代，各种报刊、广播、电视等媒体上充斥着大量的致富项目广告，几乎是无孔不入，深刻地影响着人们的生活，也影响着社会经济。很多人也许还记得，当时像《故事会》等这些畅销的大众读物，都登有大量的此类信息，有需求才会有市场，于是可以想象，投身于这些致富项目以求发家致富的芸芸众生何止成千上万？只是，很多
    Show都在做那些项目，很多项目人们都在做，可是做得明白、做得大的又有几个？


    阮东升无疑就是那少数几个能做明白、能做大的人的当中的一个。

    从阮东升曾操作的几个致富项目可以看出， 自己在项目中追求的利润点不在整个行业环节的中间和末端，而是在前端，也惟有在前端，才能迅速并高回报地获取最大的利润。

    在致富项目这一类别的“偏门”生意中，惟有这样的打法，才能立足于江湖。


    比如在那几个特种养殖项目中，他必先在广告中渲染甚至是夸大该项目的市场潜力和前景，然后大量地高价放种，并同时许诺高价回收。他这套带着“偏门”色彩的营销手段在“实战”中可谓屡试不爽，每次皆得心应手，很短时间内即可获得巨额利润，无论是规模还是效益，在同行中全国几乎无人能望其项背。


    其实，如此的营销手法今天看来几乎是等同于传销，传销的“产品”就是那几种动物，参与其中的人们关注的已非这些特种养殖动物的最终实际市场价值，能诱惑他们的是短时间内能得到的财富，于是无可避免地最'
