  md: '4 晚会”上高票当选为 2003 年度“法治人物”，中央电视台 2003 年度“感动中国”候选人，央视国际 2003 年度“十大印象人物”，中国法院网和人民网
    2003 年度“十大法制人物”，人民网 2003 年度“十大新闻人物”，团中央和中国青年杂志社 2003 年度“中国青年特别贡献奖”候选人，上海东方卫视 2003
    年度“东方封面人物”，司法部和中华全国律师协会及法制日报社 2003 年度“十大律师新闻人物”，等等。


    对日索赔之路艰辛漫长，苏向祥义无反顾。大量的调查取证工作耗时费力，他当时不得不因此放弃了其他的业务代理，跨国诉讼的花费很大，而这笔费用只能自己承担。受害者家境贫困，苏向祥不仅收取没有代理费，还要支付相关调查费用，其中最大的开销是受害者到日本出庭的费用。尽管苏向祥注意节约每一分钱，但在侵华日军遗留化学武器诉讼案上他还是付出了
    30 多万的经费。


    一位没有收入的律师，他的经费从哪来？为他的正义之举提供支持和帮助的又是什么人？


    这个人就是阮京升。


    在媒体面前，苏向祥一直没有说出过阮京升的名字，因为阮京升曾郑重地叮嘱过他，“不要提我的名字，你所从事的是很有意义的事情，要坚持下去。”


    事实上，苏向祥曾是阮京升企业里的一名员工，他走上律师职业的道路以及后来的对日诉讼，都得到了阮京升的大力支持和资助。而阮京升当时不愿苏向祥提到自己的名字，主要的考虑还是自己是做偏门生意的，怕说出去会损害苏向祥的形象。


    尽管知道阮京升不愿张扬，可苏向祥在一次接受采访时还是很深情地说起了那个在背后支持他的人。他说，“有一个很好的朋友，他对我的对日诉讼帮助最大。很多费用是他承担的。他真心实意地帮助我。他认为我投入进去了，如果要撤出，会给中国人丢脸。他知道我第二天要去日本没'
