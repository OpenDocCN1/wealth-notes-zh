  md: '姓氏。


    朴宗庆似乎觉出了众人的怀疑心理，又问：


    “你说那两个人中有一个姓李倒还说得过去，可说另一个姓海就让人不敢相信了，天下究竟有没有这个海姓？”


    “小人所说的姓氏指的不是这样的李姓和海姓。”


    “那么是……”


    “待小人写给大人来看。”


    当时的风俗，厢房里通常是备有文房四宝的，因为聚集在这里的大都是些精于书画的文人墨客。


    林尚崴浓墨砚蘸，提笔写下了两个大字。这两个字是：利害。


    写完这两个字，林尚崴又解释道：“我所说的两个人的姓氏，是一个姓‘利’，而另一个姓‘害’的意思。”


    朴宗庆听了，忽然提起烟袋在桌子上敲着，粗豪地哈哈大笑起来：“你再详细解释解释，让我听个明白，也让这里所有的客人听个明白。”


    林尚崴接着说道：“每天出入崇礼门的人，不管其数目是 3000 还是 7000，就算一天超过一万，对于大人来说，这众多的人只有两个，一个是有利的人，一个是有害的人。而那种既无利又无害的人，当然就是毫无用处、于大人全不相干的人。所以就只有‘利’和‘害’这两个人。”


    朴宗庆微一抬手，指了指聚集在厢房里的客人们，又问：“这么说，来到这厢房里的人不论一天有多少，最终也只有两个人啍？”


    “是的，大人。”林尚崴回答得非常干脆，“就算是大人府上每天有几百名来客，最终也只有两个人，一个是有利的人，一个是有害的人。”


    林尚崴的话听在聚集在厢房里的人们的耳朵里不啻平地里一声惊雷。朴宗庆大人的府上就算每天有几百名来客，最终也只有有利的和有害的这两个人。林尚崴的话切中要害，一语道破了天机。'
