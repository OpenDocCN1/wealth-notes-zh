- pgno: 110
  md: '生意？


    于是，阎东升的这位朋友就以200万元的价格，独自签下了东三省的代理资格。


    阎东升知道此事后十分生气，他马上拨打了这位朋友的电话和传呼机，可怎么都联系不上，阎东升急了。


    这时阎东升手下有人出主意，说咱们去砸他的店，看他出不出来见我们。


    于是两车人带上木棒去到了这位朋友位于沈阳的一间店面，进去后就是一通乱砸。砸之前对里面的人说，你们都跺下，我们与你们无冤无仇，我们只砸东西，不伤人，也

    不抢钱。


    砸完了沈阳店，两车人马又赶赴长春，准备砸对方的另一家店。还没到一半路，这位朋友终于给阎东升打来电话。


    人露头就好办了。赔偿了门店玻璃的损失，并道了歉，然后开始谈判。


    谈判由阎东升和这位朋友都熟悉的省广播电台广告科一位科长作中间人，一番调解，最后达成协议：“必清神鞋”项目大家一起做，该朋友占40%的份额，阎东升和弟弟各占30%，项目由郑文滨操盘。


    “必清神鞋”代理刚启动时并不顺利，鞋子没人买，眼看项目就要面临报废了。这时，郑文滨的经营才能显露出来了。


    投放在报纸、电台的广告和软文，逐渐产生出效果。在市区各大药店以及中医学院附近所租赁的柜台，来买鞋子的人多了起来，后来也出现了和山东济南一样的排队场景。


    尽管“必清神鞋”的进货价不低，每双100多元，但卖得也不便宜。因此该项目两年多下来，总共就有1000多万的进账，三方每人也都分到了三四百万。


    “必清神鞋” 的大卖，让阎东升看到了以药物和磁疗为概念的保健产'
  merge: -1
  img_proc: true
- pgno: 111
  md: '品其可观的市场前景。


    通过药物和磁石，对足底穴位的作用与渗透，以达到疏通经络、促进身体内循环的功效，如此的概念和宣传，就使造价低廉的“必清神鞋”在市场上卖了个好价钱。


    做好“足底文章”，借助保健产品正大行其道的旺盛势头，应该还能把市场做大。


    阮东升突然间来了灵感。


    于是他有了何不以药物和磁疗的原理，来打开青少年、尤其是学生群体鞋类市场的这一想法。


    实际上，产品的设计并不困难，将“必清神鞋”原理及结构，直接“挪”过来一用就是了；难的倒是市场的营销策略该如何制订，以及如何给产品起个能叫得响的好名字。


    在很多时候，所谓的商品营销，无非炒作概念、灌输观念罢了。


    阮东升为自己的产品想出了一个绝佳的名字——“步步高”。


    “步步高”鞋，顾名思义就是一种针对青少年身体发育、促进增高而设计的鞋类产品。


    鞋子委托著名的“鞋都”福建晋江的鞋厂加工生产，产品的外型、款式也由厂家负责设计。


    而在广告宣传上，则一改阮东升偏好的电台渠道，而是主打电视和城市晚报，毕竞“步步高”鞋的销售对象主要是城市家庭的小孩。


    项目主要是覆盖东三省，其他省市也放出去一些代理。在销售上就是租百货大楼和一些大商场的柜台，每个柜台月租几千元。产品生产费用这块，则前后支付了数百万元。


    每个月十几二十万的广告投放，使得产品刚摆上柜台，就被抢购一空，销路奇好，甚至厂家的生产都跟不上销售的速度，以至于许多商场柜台的产品一度脱销供不上货。'
