  md: '笑了一阵，他突然又执正衣冠，在金正喜面前连磕三个响头。

    “您这是干什么，大人？”

    金正喜惊慌不迭地去阻止，林尚沃却不想停下来：

    “生员大人给了我教海，从此您就是我的师尊。”

    金正喜慌忙与林尚沃对拜：

    “您这究竟是为了什么？”

    “生员大人海我以摆脱困境的办法，对我来讲，您就是我的救命恩人。我因为您的教海而得以摆脱死境，又怎能不屈膝三拜，略尽弟子之礼呢？”

    林尚沃终于明白了石栄大师写给自己的那个“死”字所隐藏的含义。


    # “天价”人参震四方


    第二天早晨，林尚沃单独叫来了朴钟一，对他说：“昨天夜里，我想了整整一个通宵，决定把人参价格调一调，你把这个交给王造时，让他发布这个新价格。”


    说着，林尚沃把一张新写的纸递给朴钟一。朴钟一接过来看了看林尚沃的眼色，小心翼翼地问：“您是说您接受了那帮人的要求吗？”


    朴钟一不能理解林尚沃的态度。中国商人们要求林尚沃将“人参一斤银40两”的公告价格降到原来的每斤20两到25两的水平上。


    “你只管好好按我的话去做就行了。这是经过很长时间的深思熟虑才做出的决定。既然我已经定了，你们就照办吧。”


    林尚沃态度很坚决。朴钟一再也不能说什么，拿着那张纸就出了客馆。一出客馆，朴钟一马上看了看写在纸上的最终公告价格。看了一眼，大吃一惊。他简直怀疑是自己看错了，又看了第二次、第三次。但耶的确不是梦。朴钟一想回去找自己的东家林尚沃，脚步却不能向回转。因为他想起了那异乎寻常的果断声背：


    “既然我定了，你们就照办吧。”'
