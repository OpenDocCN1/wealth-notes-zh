  md: '岁的阮东升，所表现出的这种情怀，常让他的兄弟们感佩不已，如果说他身上有某种特有的人格魅力，也许正体现于此。也正因为如此，在他的周围能聚集起许多乡人，形成一种合力，大家齐心协力地共同创业，也推动着他的事业向前发展。对于阮东升而言，不管是谁愿意跟自己一起干事业，同甘苦共患难，那是来者不拒，乡乡益善。阮东升似乎天生就有一种“老大”的气质，照顾和庇护身边的兄弟对他来说是一种本分。于是乎，他如今朋友、兄弟盛门，有的干脆就自称为“东哥”的门客，平日管吃管住乐得逍遥，可一有什么事情只要用得上自己，全听“东哥”的一声招呼。


    所以有人说，在阮东升最困难的时候，仍然会有许多人愿意支持他，哪怕没有一分钱报酬，也愿为他打拼干事业。


    阮东升这种与他的年龄不相衬的成熟的气质，还表现在他对人的宽容上。他常说的一句话是，“容天下人，做天下事”。这种宽容，也是他人格魅力的一种体现。比如有些借做项目之名，骗取他的资金的人，事后只要回来说清楚情况，表示了悔过，他仍会继续任用。有一些他的左臂右膀式的得力干将，想独自出来创业，他也会支持，当最后赔得精光想重新回来，阮东升依然十分欢迎，就像什么事也没发生过一样。于是，他手下就有许多人是几进几出公司的，但后来就再也没有离开。对他而言，只会看一个人的优点，而不会去看一个人的缺点和不足，而当把一个人的优点挖掘出来，加以培养，并用到事业上，那就会成为企业的一名人才，发挥很大的作用。也正因为如此，他才会对所有员工都关心备至，对于那些开拓市场有功的兄弟，他会为他们购置很好的商品房，而他自己却住在简陋不堪的房子里；公司最好的车，他会分配让各公司的经理去开，并说那是工作需要，而他自己却一直开那些较旧的车；公司的员工结婚，他会送去洗衣机、电脑冰箱，甚至还会卖去新衣服。对员工下属的这种大方、豪爽，按阮东升的解释叫“钱散人聚，钱聚人散”。


    他极少批评别人，却是个非常愿意做自我批评自我检讨的人。有一'
