  img_proc: true
- pgno: 33
  md: '段的年代，对于阎东升后来投身商海创业无疑具有一种先天优势，因此他的创富行为总比别人占尽先机。这样的“超前”意识和“敢为人先”的勇气，除了给阎东升以巨大的成功与财富之外，有时也不免带给他难以预料的挫折与困扰。


    阎东升笔一次骑着个自行车来到《黑龙江科技报社》的广告科要求登广告时，心里颇有些忐忑不安。阎东升记得在那间陈旧的办公室里，与他谈人生第一笔业务的是一个戴眼睛的老头，对方以为他是要登些遗失声明或寻人启事之类的东西，没想到眼前的这个小青年却从口袋里掏出一张皱巴巴的纸，说要登一则致富信息广告。


    “是你自己要登的？”老头接过那张写着广告内容的纸看了看，抬眼问道。


    “是的。要收多少费用？”阎东升小心地问了一句。


    老头看了阎东升好一会儿，才开始接手办理这个业务，并拿出广告价目表跟阎东升讲了广告版面尺寸和单价。阎东升毕竟还从未接触过这些东西，搞不清楚那些广告术语的概念，只是指着自己带来的报纸上的一则广告说：“就登一个这么大的，先登一期。”


    “你这个属于商业信息广告，每期120元。”老头对阎东升说。


    这一期广告就花去了阎东升3个月的工资，对此他早有思想准备：广告费要是“打了水漂”就全当交学费，以后生活费自己省着点花就是了。什么事情如果不去试一试，怎么知道能不能做？


    . 回想起来，这一次的广告业务，竟然是阎东升后来事业的一个开端，也是一次不可或缺的有益尝试。正是通过此后的一次次“试水”，他开始了解了广告这潭“水”的深浅，得到了广告与商业营销之间关系的感性直观认知。


    不知道是不是因为少年时期的叛逆和荦撞，让他早早地就吃尽了苦头，于是上帝对他格外“开恩”，在他创业的道路上为他打开了一扇通往'
  merge: -1
  img_proc: true
- pgno: 34
  md: '成功之门。


    交了钱没几天，阮东升就在《黑龙江科技报》上看到自己的那则广告登出来了。


    随后的一个多星期里，他天天盼着来信，可都没有声息，是不是自己所登的广告没有效果？正这样疑虑着，一天上午，在邮递员送来的一大堆报刊信件中，有一个信封上写着自己的名字，他连忙撕开信封，里面的信纸上写着要求订两本加工信息的小册子，还夹着20元钱。


    手里拿着这封信，阮东升心里是好一阵狂喜。不过他并没有让这种情绪蔓延开，而是很快冷静下来：自己当初的想法证明是可行的，只要有一封来信，就说明这次尝试获得了成功，这条路子可以走下去，现在需要考虑的是下一步该怎么办。


    阮东升把那位客户所需要的信息资料从自己的剪贴本上的“资料库”中摘录下来复印好，给对方寄了过去。第一笔业务就这样宣告完成。


    阮东升在报纸上所刊登的广告，实际是将自己所搜集并打算出售转让的信息资料汇编成一份总目录，读者对其中感兴趣的内容可来信向他索取，而每本小册子统一收费10元钱。阮东升所有的这些资料信息内容的获得几乎都是免费的，那是他从单位成堆的过期报刊中筛选收集整理出来的。有人来信索要资料，他就复印好按对方的地址寄过去，而每封信的邮资则不不过8分钱。总的来说，他的这项业务成本很低，利润不少。


    此后，他的来信每天都在增加，从一、两封，到七、八封，十几封。阮东升很快就收回了广告费的成本，利润随着每天的来信在增加。


    第一次的来信持续了几个月，后来就日渐稀少了。广告效应的一个周期结束，得考虑追加广告投资了。阮东升再次来到那家报社的广告科，这回办业务他就老练多了，可谓底气十足。他增加了不少信息目录，扩大了广告版面面积，每一期都打广告。当然，广告费用也因此增加了，每个月都在一、两千元，对那张报纸来说当时算是个广告大客户了。'
