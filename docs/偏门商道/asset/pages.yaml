  md: '富之门的按我按钮。


    过往的经验令阮东升作出了这样的判断——此项目还会有广阔的市场前景。


    洗衣粉的配方还是 10 年前的那些化工原料，他只是对买回来的设备进行了仿制并改造，并跟身边的幕僚重新策划营销方案。


    对于这个成熟的项目，阮东升将它交给了自己落难的时候仍跟在身边的一个本家兄弟去做总经理，也是作为一种回报。


    此时阮东升已从“醇中醇”中挣到了钱，于是“清中洁”在广告上得以强力推出。


    那一年，在中央人民广播电台以及许多省份的电台节目中，都在播放这样一条致富技术项目广告：“专利产品——绿色无磷环保洗衣粉，一人操作轻而易举，加盟一户，致富一户……”、“没有文化
    3 ~ 5 小时就可学会”、“十天就能收回成本！”


    “清中洁”公司既不生产洗衣粉产品，也不销售洗衣粉产品，只负责专利技术转让和技术培训，也就是采取了风靡一时的“特许经营、联盟办厂”的模式。加盟户只需花 3800
    多元钱就能得到洗衣粉生产技术，加盟后，取得联盟分厂资格便可得到公司提供的“销售授权书”、“商标使用书”、“生产授权书”以及一台加工设备和“清中洁”产品的包装袋，公司承诺对每位加盟者实行技术跟踪上门服务。


    公司这样给加盟户们算了一笔帐：每生产一袋 400 克“清中洁”成品洗衣粉，成本为 0.84 元，一包装袋 0.2 元，不算人工一袋 400 克


    格洗衣粉成本价为 1.04 元，市场零售价按 1.7 元算，每袋可赚 0.66 元


    “清中洁”项目适合家庭作坊式加工生产，产品销往广大的农村地区。项目一经传播而广，就吸引了大量的个体经营户，加盟者众多。'
