- pgno: 183
  md: '# 40岁前的阮东升，可以说是完全靠致富项目起家的。


    致富项目是市场经济条件下出现的一种商业类别，不知道在国外是否存在，在经济正处于起飞阶段的中国，致富项目这种商业门类是随着国家的经济转型而发展起来的，不同的经济发展阶段呈现出不同的特点，直到今天仍然方兴未艾，一派繁荣，而且涵盖的范围越来越广。


    与一般的商业形式所不同的是，致富项目“出售”的不仅仅是商品，而是一种致富的机会与可能。所以说致富项目的“购买者”并不是为了消费，而是生产和发展，也就是为了致富。作为发展中国家的中国，盼望发家、梦想致富的普通老百姓数以亿计，于是就不难理解致富项目为什么在中国如此有市场、如此有生命力。


    在一般人眼里也许并不起眼、甚至被视为“小儿科”的致富项目，缘何在阮东升手里能变成角逐市场的利器、瞬间给他带来巨大的财富？他又缘何将自己这种的盈利模式归为“偏门”？


    要回答这些问题，我们不妨对致富项目的不同操作方式作一番剖析，从而窥其中的“奥秘”。'
  merge: -1
  img_proc: true
- pgno: 184
  md: '致富项目也有优劣之分，同样也有“正”和“偏”之别。

    为了便于理解，将复杂的问题简单化，我们不妨举个例子。

    比如说一个打火机，值一块钱，有人在做致富项目推广时说值三块钱，然后向客户们许诺，如果在他那里买原材料、并学会相关技术回去组装，他将“按三块钱回收”。注意，这个时候项目就已经开始做“偏”了。

    客户一看有利可图，愿意以比市场实际价值高出两倍的价格买回原材料并学习生产技术。大部分的致富项目的操作者就是在这一环节得到了可观的“利润”，大赚一笔。在这里，客户愿意高价购买原材料，看中的就是操作者“按三块钱回收”的承诺。

    客户回家组装出产品，然后要操作者按合同回收，起先操作者为了让更多的人信服从而成为客户购买他的原材料，肯定会如约回收，那些客户尝到“甜头”后通常会追加投资购买原材料。看到组装打火机有赚头，一定会有更多的人成为客户。

    由于卖出去的原材料的价格高于实际的市场价格，项目操作者回收的打火机是肯定不可能卖出去的。在回收的打火机没有实际市场的这一前提下，操作者的所有到手的“利润”其实是虚的，因为如果履行合同回收客户的产品，那么这到手的“利润”不仅全部会返还客户的口袋，最终甚至还要赔钱。于是这整个过程实际上是毫无意义的。

    到这个时候，项目操作者要留住“利润”，就只有三种办法：一、是毁约，拒绝回收；二、是让客户再以相同的方式去“发展”新的客户，高价卖出原材料，然后“击鼓传花”般无休止地“传”下去，这种模式实际上已经演变为传销，传销道具就是那个打火机；三、是拖延，巧“打时间差”，以时间换资金，并以暂时拥有的资金去开发新项目赢利。

    毁约拒绝回收，肯定是最省事的做法，一走了之，突然携钱款来个“人间蒸发”，但这也是“死”得最快的一种做法。

    做成传销，也是违法行为，最终恐怕也会凶多吉少。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '采取拖延的“战术”几乎是唯一行得通的，当然也是难度最大的。这就是该行业中所谓的“售后”阶段。


    在“售后”阶段，随着客户的增多，回收大量客户的产品必然会成为一个难以绕过的难关。通常的办法是对于回收产品能拖就拖，软硬兼施，磨破嘴皮，奉陪到底，让客户拖得筋疲力尽，知难而退，直到再也不愿为这几个钱折腾为止。这个时候客户自己打了退堂鼓最好，要不然操作者就会压低价格，少付钱给客户，这时候大多数客户都会抱着“得回一点是一点，好过什么都拿不到”的心理，极不情愿，却又无可奈何地接受了操作者的最终条件。这种方式是最讲“技术含量”的，要达到目的完全看各个操作者“各显神通”了。不过这也是一着险棋，因为很多事情是无法掌控的，形势不会完全按操作者的期望发展，比如一些客户采取极端行为，闹事、暴力、上访游行，甚至自残自杀，这势必会把结局弄得一发不可收拾。


    项目操作者将能够“截留”下来的资金，用以新的项目的投资，以期“钱生钱”，获得真正属于自己的利润，无疑是所有这些方式中最具善意的，但同时也是最具风险的。这个时候如果所做的新项目失败亏本，那后果就严重了，资金链提前断掉，很多潜伏着问题将一一爆发。有时，操作者还会找同样性质的致富项目来做，那将会是个恶性循环，拿后面的钱来填前面的“窟窿”，以时间换金钱，那
    программист必须得不断地找新项目来做，不能停下来，一停下来，资金链条就会断，钱就会成问题。对于将致富项目做“偏”了的操作者来说，这种恶性循环就像一个“魔咒”，挥之不去。


    有圈内人这样描述——做致富项目其实心里特不安稳，老觉得挣来的钱不是自己的，而是别人的，老觉得欠别人的钱，于是老想拿这笔钱再搞其他项目翻本，挣到真正属于自己的钱。这是一个真实的心态。


    阮东升如今对自己过往事业屡屡受挫、多次出现大起大落的原因，有了深刻的反思。他已意识到是自己所选择的项目决定了失败的必然性，在'
  merge: -1
  img_proc: true
- pgno: 186
  md: '选择行业的方向上不做大的调整，不彻底改变更张，那么，这样的失败必然还会如“魔咒”般相伴，难以跳出大起大落的怪圈，这不是一种宿命，而是经济规律的惩罚。


    一直以来，顾东升思考的正是如何破解这样的“魔咒”，寻找更新、更光明的未来。


    裕子狐狸项目之后，郑文滨曾劝告顾东升说，以后干事业，千万别再干什么需要回收的买卖了，不要再出现有关回收的问题。当时顾东升点头认可，深以为然。


    在顾东升所操作的致富项目中，倒有两个做得很好、又不需回收产品的项目，那就是“洁中洁”和“醇中醇”。


    “洁中洁”是卖技术，卖设备，不再卖化工原料，一套设备加上配方，一共是3800多元。后还卖洗洁精配方。产品在各农村的小商店出售，销路不错。


    “醇中醇”从1995年做到1999年，这些纯粮食酒口感不错，农民的小酒坊生意红火。但市场总有饱和的时候，不可能全国家家户户都开酒坊，于是，项目转让给了别人。顾东升后来常后悔，这么好的项目应该继续干下去，如果在酒的制作工艺和品牌推广上，再使把劲儿，前景会非常好。


    “洁中洁”、“醇中醇”那几年在全国的中低端市场拥有一席之地，广大农村地区的居民用不起、也舍不得多花钱买品牌货，因为品牌货靠的是巨额广告投入树立品牌形象，自然使产品的成本和价格跟着抬升。“洁中洁”、“醇中醇”的产品正好满足了低收入群体这部分老百姓的需求，填补了这一块市场的空白。


    当年，做“洁中洁”、“醇中醇”的客户肯定有赚有赔，在众多的加盟客户中，产品质量好的，赚钱就多；质量差的，自然就赚得少甚至赔钱。而赚个几十万、上百万的加盟客户有很多，使得许多农民和城市下岗'
  merge: -1
  img_proc: true
- pgno: 187
  md: '工人从中获益，实实在在地走上了致富之路。


    尽管这两个项目取得了不俗的成绩，但从长远来看，长期从事致富项目，也令阮东升的思路受到束缚，无法脱离“偏门”的思维模式，即“以小搏大”、“短平快”的诱惑，从而影响了企业的发展战略和健康成长，以致起起落落，麻烦不断。


    “洁中洁”就是这样的例子。


    “洁中洁”的销售量在洗衣粉行业一度排名全国第一，可惜的是这样一个项目，阮东升没把它当成产品去做，而是以致富项目的模式去操作，出售的是技术、原料和设备，各地的客户加盟后回去自己贴牌生产，做终端销售。这样的做法之弊端是，对客户生产出来的产品公司无法进行质量监控，结果品质良莠不齐，造成不良影响，也导致“洁中洁”的品牌没有任何价值可言。而同时期做洗衣粉产品的“雕牌”、“立白”，如今早已成为全国知名品牌。


    按致富项目操作，还是做品牌，看似一念之差，其实天壤之别。


    当然，真正有大气魄、大抱负的商人，哪怕是操作致富项目，眼光也不会紧盯着那些不可靠的利润，他需要的仅仅是一份原始积累，而这或许就能成为自己登上下一个巅峰所必要的台阶。


    阮东升显然就是这样的商人。


    致富项目有这样一个特点，除了 一部分是加工范畴之外，其余的大都属农业的种养范畴，这也是阮东升和他的伙伴们曾长期涉足的领域。


    农业种养的致富项目中，有一个专有名词，叫特养。所谓特养，其实就是特种经济动物养殖，作为一项新兴的产业，特养业在全国各地热潮一浪高过一浪，众多的特种养殖场（户）更是如雨后春笋般兴起。特种经济动物因为有特殊用途，养殖成本高，产品利润也高，特养业对农民来说，的确是一条可以尝试的致富门路。


    从上世纪 80 年代兴起的肉鸽、鸽鹅、珍珠鸡、山鸡、鹌鹑、野鸭、'
  merge: -1
  img_proc: true
- pgno: 188
  md: '鳗鱼、虾、蟹、珍珠，到90年代兴起的海狸鼠、甲鱼、蛇鸟等品种养殖，特养业经历了从种苗阶段到商品生产阶段，并由此产生了一个该行业的特有现象——“炒种”。


    客观地讲，任何一项养殖业都需要“炒”作，适当地炒作不但没有害反而会促进该行业的发展，使之能更快地被广大养殖户接受。对一些新特的养殖品种，更是需要必要的“炒种”来烘托刺激市场，达到一定的热。度，这有利于该品种的市场推广。


    当年，阮东升凭借着自己过人的经济头脑，和敏锐的信息捕捉能力，就是靠“炒种”，在致富项目这一领域“呼风唤雨”，似乎轻而易举地给自己聚集起惊人的财富，尽管这些财富后来又瞬间消失。


    “炒种”赚钱获利，在商言商，按经济学来说本无可厚非，“炒种”是一个再正常不过经济现象。但任何事情都要有个度，当“炒种”的火候太过了的时候，很多行业弊端和社会问题于是便不可避免地爆发出来了。这其中的教训让人警醒，更是必须要吸取的。


    在疯狂的“炒种”风潮下，养殖户们充满浮躁，热衷于“炒”、“倒”，却疏于养，到最后，该经济动物的市场需求点在什么地方？前途在什么地方？市场需求有多大？这些就根本没有人去考虑了。于是，养殖户不去想如何改善基本养殖条件，市场上真正的养殖大户少之又少，甚至连有些繁育场都难见成规模的品种。在这一“引种——炒种——倒种“而形成的怪圈中，很少人认为自己是笨人，大都希望能从别人身上赚一把，但结果往往是偷鸡不成蚀把米。人Graf似乎已经忘了，只有立足于养，并从规模中求效益，才是致富的上策。


    于是，许多特种养殖“神话”都成了接力棒似的“炒种”游戏，就像传销一样，圈子里的人没有不知道是一场骗局的，但是谁也不戳破，只想着把接力棒传给下一层，把自己的钱掏到手就完事。结果，特养的气泡越吹越大，最终受到损害的是处于最外围、最底层的那群人，而整个行业'
  merge: -1
  img_proc: true
- pgno: 189
  md: '也必然元气大伤。


    事实上，在那些年靠特种养殖致富的，除少数几名“敢吃螃蟹”的养殖户外，大多是那些有“翻云覆雨”能力的“炒种”者。以至于一波又一波的特种养殖热过后，这个行业几乎也没有“热”出个什么结果来，无非是贼“炒”了一阵就不了了之，赚钱的总是那些炒卖种苗者，而买种苗的往往赔个底儿朝天。


    如今，媒体上有关特种养殖的广告越来越多，好像只要干上特种养殖，人很快就富得不得了。实际上，特种养殖风险很大，不吃透相关细节盲目投资，结果只能是十投九亏。因此，作为养殖户，必须保持头脑清醒，克服一夜暴富心理，还要有必要的市场意识，方方面面都细致考察，须知任何东西都是“多了是草，少了是宝”的道理，切忌一哄而上，以至价格暴跌烂市，让自己的血汗钱打了水漂。


    其实，也唯有农业的种养项目有 可能培育出大市场、发展成大产业，其通常的途径就是从出售种苗开始的。


    “短视”的商人只会卖力地“包装”“吹嘘”自己的项目，只图尽快把种苗高价卖出去，而根本无心去做下游市场的开拓，消化上游的农户的产品，当然，这样出事是迟早的，也是必然的。这也几乎是许多涉农致富项目最终都会出现的通病，或说是难以医治的顽疾。


    一般的种植、养殖企业的确是靠高价卖种挣钱和集资，想诈骗的是挣到钱后不管引种户，溜之大吉；而想做事业的则是筹集到资金后，投入一部分建加工厂搞加工、做市场，另一部分用来回收引种户种出来的产品，搞滚动发展。后一种项目操作者往往需要从当初出售种苗所获的利润中，拿出一部分甚至是很大一部分来开发经营该产品的市场，真正地打开农产品的销路，形成长期稳定的产、供、销体系。不过，这需要大量的资金和足够的耐心来进行市场的开发与培育，也许并不会一帆风顺，甚至要承担巨大的风险。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '所以说，要判断某个致富项目是否正当，就看他是否先做市场，看他盯着的是哪一块的利润，是上游的还是下游的。如果在操作项目之前就有意识、有步骤地开发和培育该产品的下游市场，那么这还应该是个正当的项目，而在项目操作过程中的出现某些有争议的做法，充其量只能算是一
    些方法上的偏差。

    如果说在以前法律法规还不那么健全的时候，做这些项目可以通过各种手段给客户“设套”——比如说打出类似“投资一千，月入一万”、“投资5000，年赚10万”这样的广告用语——以牟取暴利还有可能的谎，如今，情况就大不一样了。要操作致富项目，就必须先做好市场，铺垫好市场的渠道，再来进行上游产品、项目的推广，现在许多地方的“公司＋基地＋农户”的规范化做法就是如此。规范的致富项目完全可以做到农户和公司的双赢。

    事实上，司法部门的介人，媒体和舆论的跟进，使得老百姓更加成熟和谨慎，防范心理更强，加上全社会就业渠道的增多、投资经营的选择面更广，国家法律法规的日益完善，过去那种以实际上做不到的“高价回收”许诺来企图吸引客户并从中牟取暴利的可能性已经微乎其微。除非你的致富项目拥有独门的技术秘方，此外还得有广阔的市场需求，如此来吸引加盟者还有可能。现在致富项目通常合理的做法是，不许诺回收（尤其是高价回收），而以合理的利润作加盟费，进行招商做连锁经营，共同面向市场，做到共赢。这样的做法利润虽来得不那么大、那么快，但扎实、稳定，有可持续发展的未来。

    然而，人们也应该清楚地看到，只要法律法规的制约还有缺失，职能部门的监管还有遗漏，而人们还有企图“一夜暴富”的心理，那么，这一“偏门”行当就还没有到销声匿迹的时候。如今，在各种媒体上，大量的“致富信息”、“创业商机”广告铺天盖地，名目繁多，令人目眩。我们并不是一概否定这些信息的真实性和有效性，不能一竹筷打倒一船人，'
  merge: -1
  img_proc: true
- pgno: 191
  md: '但那里面究竟有多少是可以相信的，又有多少是一个个提前掘好的陷阱，真的需要那些急于创富的人们擦亮眼睛，多些理性去甄别、去选择。


    但愿每一个正走在创业之路上的 人，都顺利地能到达财富的彼岸，这也是蜕变之后的阮东升出  版这本书的目的和意义所在。


    无论怎么说，阮东升堪称当今中国操作致富项目的“集大成者”，运作过的致富项目数以百计，他的过人之处在于，他能准确地判断出每一个项目的市场前景和应有的收益，在实施操作后，他几乎能做到利润和规模的最大化，甚至是某种极限。于是，在普通人看来毫不起眼的一些有关种养的致富小项目，他却能做成辐射全国、有着巨大影响力的“超级项目”，从而轰动一时，变成自己手上的一棵庞大的摇钱树。


    在中国“致富项目”这一商业领域，阮东升是名副其实的“王者”。他所运作过的项目，无论是规模、影响，还是获利能力，至今都无人能及。的确，阮东升是这个行业的标志性人物，经历了中国改革开放后“致富项目”从出现、发展，到兴盛、衰落的全过程，几乎是与这个行业一荣具荣、一损具损，有过创业之初的光彩，也品尝过退落荣衰，一直到仙人掌项目牵连的牢狱之灾，在他身上，几乎浓缩了这个行业的所有“元素”。


    其实，所谓致富项目，如果以循规蹈矩的寻常方式去经营运作，永远都不可能有太大的利润空间，成“大气候”，而“偏门”之所以成其为“偏门”，一切的题中之意尽在那个“偏”字上。行“正”，就落于平常生意，多有限制，竞争激烈，难获大利；而走“偏”，往往就能避开制约，巧钻空子，直击要害，收到“剑走偏锋”之妙用，以至在获利上游刃有余，对滚滚财富，手到擒来。所以，阮东升曾笑言，如果说做“偏门”，我也算是全国第一。


    如果避开意识形态上的“是非观”不谈，我们来客观地探究“偏门”行当的特点，会发现大凡做“偏门”的人，尤其是能把“偏门”生意做得很大的人，个性之中必定有一些常人所不具备的特质，这点在阮东升身'
