- pgno: 249
  md: '朴钟一怀里：“不用那么过于害怕。穷则变，变则通，天无绝人之路嘛。”


    朴钟一简直无法理解林尚沃的态度。可不理解也没办法，他只好去青楼找女人，聊以打发时间。


    送走朴钟一，林尚沃又随金正喜出了门。他负责为金正喜要拜访的学者准备礼物，而那礼物就是人参。中国学者们对人参也早有所闻，所以金正喜作为礼品带去的人参非常受他们欢迎。


    拜访过翁方纲，金正喜下一个拜访对象是北京名气最大的学者阎元。当时，阎元虽然刚刚47岁，却已是名满京城的学者、政治家、书法家和文学家。


    阎元，字伯元，号云台，作为政治家曾遍任朝中要职并升至两广总督，但他更是一位大思想家，门下学者辈出，成为振兴学术的先驱。


    翁方纲与阎元，是金正喜终有所成的两大根源，因此，金正喜常以“翁阎”来对他人称呼自己的两位导师。


    # 导师指点受益非浅


    很久以后，被发配到济州岛的金正喜追忆两位导师，用一句话道出了两位导师的差别：“翁方纲老师常说‘我喜欢古代经典’，而阎元老师常称‘我不喜欢人云亦云，拾人牙慧’。两位老师的话，正是我一生的写照。但我为什么会成为孤岛蛤翁，仿佛元丰的罪人？”


    在这段附于自画像上的文字中，金正喜把发配济州的自己比作中国宋朝元丰三年蒙贬的诗人苏东坡，而自叹身世。从中可以看出，翁方纲和阎元对金正喜的精神世界带来两种巨大影响，其一是自称“我喜欢古代经典”的训古精神，另一个是声称“我不喜欢人云亦云拾人牙慧”的批判精神。


    “喜欢古代经典”的翁方纲，使金正喜潜心“考证学”，竭力效法杜甫、苏东坡的正统诗道精神。当时，翁方纲正在探索一些考证学的方法，'
  merge: -1
  img_proc: true
- pgno: 250
  md: '企图从古文献中找到切实的证据，以实证的方式从事研究。


    而“不喜欢人云亦云拾人牙慧”的阮元，又在正统的考证学中引入了实学思想。继清朝的宋学之后，阮元力倡经世济民，他所提出的“实事求是”对金正喜的思想起过决定性的影响。


    实事求是，以事实为依据探求其理或其相，这就是阮元大力提倡的经世济民方法。


    如果说翁方纲是一个效法古典的理想主义者，那么阮元就是一个立足于实际的现实主义者。


    金正喜前去拜访阮元的时候，阮元正在和弟子们一道开办一所名叫“泰和双碑之墩”的书院。阮元在中国全境到处开有书院。在广东开有学海堂，在浙江亦有诂经精舍。


    他正在和学者们一起编纂一本书，这本书的名字叫做《经籍纂诂》。


    正巧返回京城北京逗留的阮元，非常高兴地接待了前来拜访的金正喜。当时，他正和严霖、朱鹤年、洪占锺等几十位弟子在一起，待金正喜行完三拜大礼，便问：


    “你看到那株兰了吗？”


    阮元的手指着书院旁边栽培的一株兰花。那兰花也是一株春兰，和翁方纲书院里那株一模一样。


    “看到了。”


    “经常听人说你的笔下功夫乃天下之逸品，你不妨把这兰画来看看。”


    这场面和拜访翁方纲时毫无二致。金正喜拜访翁方纲时，翁方纲的第一句话也是要金正喜画兰。


    金正喜开始提笔画兰。严冬腊月时节，春兰尚未开花，但金正喜刚刚从翁方纲那里得到指点，知道画兰就要有花，有花就要有香，于是便毫不犹豫地为兰画上了花朵。


    既然是重心意胜技巧的文人画风，当然应当画得有花有香。'
