  md: 这些学员如今从“红墈”已走向全国各地，在各个领域中从事着各种行业。他们中的选择自己创业，目前大多都已有所成就；有的选择到企业去，做一名职业经理人，不仅称职胜任，能独挡一面，而且在各方面都有很好的口碑。据说，当年的这些“红墈”学员中，许多人已经是百万富翁、千万富翁，有的甚至已有过亿资产。其实，无论人生处于何种境遇，对于他们而言，“红墈”的这一段难忘经历，都将成为他们一生中最其宝贵的财富。
