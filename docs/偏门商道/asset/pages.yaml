- pgno: 137
  md: '挫折没能击跨阮东升，尽娶外表看起来他是那么羸弱的一个人。

    了解他的人会毫不怀疑他身体上有异于常人的品质，那就是坚韧。他总有一股永不服输的劲头，沉默寡言背后，内心却是钢铁般顽强。


    有一次意外受伤，身上     寸长的伤口需要缝合，他居然跟医生说不用打麻药，陪同他到医院去的人看着医生一针一线地缝着血肉模糊的伤口，在一旁心惊肉跳，而他却咬着牙没吭一声。


    其实，如果不是有着坚强的毅力和顽强的生命力，一个曾被医生断言只有几年生命的病人，是不可能健康地活到今天的。


    就如同他生命力和健康的峰回路转，从危殆到安然、旺盛，1997年之后的阮东升，低迷的事业也迎来了转机和光明。他靠借来的5万块钱打了个翻身仗，第一年就挣了几百万，此后几年间更是拥有了上亿的
    каждая。这祥“神话”般的命运大逆转，依仗的除了永不言败的内心坚韧，更重要的是他在致富项目这个\领域，多年的磨练已经形成了一套非常成熟“战术”，我们不妨将它称为“阮氏战术”，因为它带有太浓厚的阮东升的个人色彩。


    就是在事业最低谷的时候，阮东升仍非常有信心能东山再起，这样的信心从何而来？其实就从他的经验和自信上来，因为他实在是太了解这'
