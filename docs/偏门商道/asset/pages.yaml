- pgno: 242
  md: '善赋诗，善饮酒。常称景仰中国，于东国无可相与之士子，方今随使臣而来，愿交天下名士，效古人为情谊而赴死之风范。”


    此篇文章更让金正喜名声鹤起的是当时的另一件逸闻。


    据说，当时观象监每年也随使臣的队伍前往北京，他们的任务是从中国取走时宪历。自古以来，我国就取中国之历法作自己的标准历。随着天主教的传播和西洋文化的东渐，清朝已经开始采用亚当·绍尔（中文名字为汤若望）的时宪历，我国自然也就取时宪历为用。因为这个缘故，观象监每年都要派使臣随冬至使前往北京，从中国的钦天监处接受新的时宪历，这已成为惯例。可是，金正喜在翻阅新接收的时宪历时发现每月第二个节气的顺序错了。观象监的书记们不敢自专，遂拿到北京的钦天监要求矫正，中国的天文学者们直到这时才发现了自己的错误，并叹息道：


    > “如此上通天象下通地理之人，如何会出于东国?!”


    来自海东的青年金正喜纠正了钦天监的时宪历的错误。这个传闻很快就在北京的学者们中间传开了。于是，他们纷纷图谋想亲见金正喜。


    # 北京城中拜访巨儒


    金正喜首先拜访的是翁方纲。因为，翁方纲不但是北京的头号巨儒，而且是北京学者中的最年长者。


    翁方纲，顺天府大兴人，字正三，号覃溪，当时最大的思想家，在北京开办了一座叫做“石墨书楼”的书院，亲自教授全国各地慕名而来的门徒。


    金正喜与林尚沃一道前去拜访翁方纲，是在新年过后的第二天。因为金正喜对中国语非常生疏，自然也就需要精通汉语的林尚沃相陪，而且林尚沃作为一名富贾大商，还会经常为他备妥送给拜访对象的礼品。


    金正喜去拜访翁方纲时，翁方纲正在琢精会神地做着什么事情。他虽然已是78岁的苍耄老者，但童颜鹤发，眼睛上连眼镜都没有戴。'
