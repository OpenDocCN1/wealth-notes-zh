- pgno: 221
  md: '了一些问题有可能引起彼此间的误会，为了开释、订正，就有了派遣特使的必要。


    特使队伍的规模大都大于作为定期使节的冬至使队伍，而且，由于所担负使命的重大性，陈奏使的官阶是冬至使远不能望其项背的。但因为不是定期使节，陈奏使这种差事是没有什么人愿意担任的，官员们纷纷借故躲开，避之犹恐不及。


    这次前往北京的陈奏使也非例外。那年的《承政院日记》甚至记载着这样的内容：


    “拟派北京的陈奏使，已经有五人称病推托，希望别人能够代之远行。视重要的使节之行直同儿戏，为有国以来所未见。先后有沈相奎、郭尚佑、李根横、洪义信、金鲁音等上书请免，一一削职为民，最终钦定绥官金鲁敬出使中国。”


    金鲁敬系朝鲜王朝后期文臣，早年曾经常作为冬至使兼谢恩副使出使北京。他还是一位声名素著的文章名家，从现存的《新罗敬顺王碑》即可窥其文采之一斑。但其最知名之处，乃是因为他的儿子金正喜。金正喜，号秋史，是李氏朝鲜时期无人能出其左右的大文豪。金鲁敬的文章底蕴，遗传给了他的儿子金正喜。而金正喜通过早年随出使队伍频访北京的父亲金鲁敬接触了实学，这为他在学问的道路上开阔眼界提供了良好的契机。


    也就在这个时候，年方 24 岁的秋史金正喜成为父亲金鲁敬出使清朝的队伍中的一名随员。林尚沃也随着这支特使的队伍一道起程前往北京。当时，林尚沃已经是当时最大的巨贾富商。他借助于通过第一权臣朴宗庆拿到的人参交易权垄断了人参贸易，一跃而为名列第一的贸易大王。但这都不算什么。林尚沃此次随出使的队伍前往北京，最大的收获乃是与秋史金正喜的邂逅相遇。他们之间命运般的相遇就是这样开始的。那年，金正喜是一位年方
    24 岁的青年，而林尚沃比金正喜年长七岁，是一位 30 刚刚出头的壮年人。两人虽然年龄上有着七岁的差异，却因为一道随使节队伍'
