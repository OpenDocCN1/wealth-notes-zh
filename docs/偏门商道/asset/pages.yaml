  md: '# 君子喻于义


    这些人都是来追逐名利的，要么是想捞取一官半职，要么是想挣些蝇头小利。所以，他们看上去是在对朴宗庆大加颂扬、奉承，骨子里想的却是要捞走一些利益。


    书生重名，商人重利。文人如果贪图利益，当然就是要沽名钓誉；商人贪求利益，就是与权力野合形成商权，从中获利。听了林尚渫的话，朴宗庆抬起一只手，指着厢房里所有的人们说道：“原来这里汇集的人对我来说不是有利的便是有害的！”


    朴宗庆这话当然是以开玩笑的口吻说出来的，但在厢房里那些心有不端的人们听来，却足以感到胆寒。


    “那么，”朴宗庆抬眼看着林尚渫，又问，“对我来讲，什么样的人是有利的，什么样的人是有害的？”


    “有利的人有三种，有害的人也有三种。”


    “请道其详。什么样的人对我是有利的？”


    “小人这就禀告大人。”林尚渫开口说，“有利的人有三种，第一种是正直的人，第二种是诚实的人，第三种是博学多识的人。”


    “那么，”朴宗庆以手抚须问道，“对我有害的又是什么样的人呢？”


    “对大人有害的人同样也有三种，第一种是阿谀奉承不够正直的人，第二种是狡诈无信的人，第三种是没有真知灼见只会油嘴滑舌的人。”


    林尚渫所回答的内容，出自孔子的《论语》。


    孔子在《论语》季氏篇中说：“益者三友，损者三友。友直，友谅，友多闻，益矣；友便辟，友善柔，友便佞，损矣。”


    中国有句俗话叫做“近朱者赤，近墨者黑”，对于孔子这段教人注意“益友损友”的话，似乎无人不知。但林尚渫的回答，却像给厢房的客人 们头上泼了一盆冷水，引起一阵沉默。是朴宗庆打破了这种沉默。


    “哈哈……”一阵突然爆发的豪爽大笑，令人们魂飞胆丧地抬头望着'
