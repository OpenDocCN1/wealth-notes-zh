- pgno: 251
  md: '金正喜笔下的春兰绰烂多姿，美如仙子，一旁观看金正喜作画的林尚沃看得如痴如醉，心驰魂夺。等金正喜画完，阮元走过来，看了看金正喜的画作，说道：

    “本来是没有花的，你为什么画上了花？”

    金正喜慌了。

    “我的眼里是看不到花的，你的眼怎么能够看到花呢？本来没有的东西你却骗自己说有，这无非是一种虚伪。一句话，你不是在画兰，而是在虚构一幅假兰给人看。”

    一句话，顿显两位老师各执一端的观点。但两位老师这截然不同的观点，最终却成为金正喜的成就之源。翁方纲强调心意之花，成就了金正喜的艺术；而阮元强调实存之花，成就了金正喜的思想。

    一见面就将金正喜批评了一番的阮元，随后提笔在纸上写下了四个字。金正喜看着阮元写的是“实事求是”。这句话正是阮元思想的核心，也是金正喜思想的精髓。

    就这样，金正喜从两位导师身上接受了两个极端的影响。翁方纲传授给金正喜的是“文字香与书卷气”，也就是主张“一篇美丽的文章自有其趣，一本有内容的书自有其气”的思想，是“重心意”胜“重技巧”的师道。阮元传授给金正喜的则是“实事求是”思想，这种思想彰显一种批判精神，主张与其崇尚空洞的理论、囿于虚浮的学风，不如“从实际存在的事物中寻求正确的道理并付诸实践”。

    金正喜的秋史体是在其晚年流放济州岛的九年期间终其大成的。当时，他曾为自己画了一幅肖像，并在肖像的旁边自题一段文字：

    “是我亦我，非我亦我。是我亦可，非我亦可。是非之间，无以为我。

    帝殊重重，谁能执相于大摩尼中，呵呵呵。”

    金正喜在虚无的心意之花与现实中的实存之花间苦苦寻觅真正之花，终于创造了别具一格的秋史体。由此，金正喜不但是翁方纲的正法弟子'
  merge: -1
  img_proc: true
- pgno: 252
  md: '子，同时也成为阮元的首座弟子，而且阮元送给金正喜一个“海东第一通儒”的美称。海东即朝鲜，这个美称自然就是盛赞金正喜乃“朝鲜第一通儒”。而“通儒”一词，自古以来就是指那些穷通世间万事、有知有行的儒学家。对于老师阮元赠给自己的这一美称，胸中充满自信的金正喜毫不推辞，慨然笑纳。被誉为“海东第一通儒”的金正喜，为报答老师阮元的垂青，返回朝鲜后开始自号“阮堂”。“阮”自然是老师阮元之阮，再附以“堂”字，遂成“阮堂”，从这个名号不难看出，金正喜正是以继承阮元思想的衣钵弟子自居的。翁方纲赠以“诗痴”之号，而金正喜为感谢阮元的导师之谊又自号“阮堂”，使用这两个字号，说明他时时刻刻不寂忘却翁、阮两位老师的大恩。


    逗留北京这短短的月余时间，不仅使金正喜看到了一个新学问的世界，而且使他初具一个大思想家、大艺术家的风范。


    在金正喜在探究学问的道路上大开眼界的同时，林尚沃又是怎样作为商人冲开一条商路的呢？他是如何运用石崇大师留给他的那个“死”的秘密器，击垮北京商人向朝鲜商人发出的第一次联合抵制的？他不但击垮了北京商人们的联合抵制，而且由此起死回生，成为朝鲜王朝最大的贸易王，使危机化作机遇，那么，林尚沃的商道又是什么？


    # “焚身供佛”烧人参


    阮元为即将启程回国的弟子金正喜设宴饯别的第二天，也就是2月2日，正是林尚沃与北京商人之间的商战终于迎来生死一搏的决战之日。


    那天早晨，天一放亮林尚沃就命令手下的朴钟一等人做好准备，打点回国。下人们马备鞍、货人包，马上开始了行动。因为再过一天就是2月3日，就是陈奏使金鲁敬率领的出使队伍离开北京回国的日子。


    北京商人们虽然没有一个人露面，但私下里，他们一直在派人探听着林尚沃的一举一动。他们已经接到线报，称包括林尚沃在内的出使队伍明'
  merge: -1
  img_proc: true
- pgno: 253
  md: '天就要离开北京。那么，他那五千多斤人参会怎么处理？难道会像来时那样原封不动地装上马车运回朝鲜？


    林尚沃的人参，如果不能在北京出手，到其他任何地方都是卖不掉的。这一点，北京商人们当然心知肚明。他们放出密探，监视着林尚沃的一举一动。


    等做好回国的一切准备，朴钟一察颜观色地问林尚沃：

    “大哥，您打算怎么办？”

    “什么怎么办？”明明知道朴钟一在说什么，林尚沃却佯装不知。

    “人参呐，我说的是我们带来的五千多斤人参呀。”

    “哦，原来是说这个。”林尚沃拍了拍膝盖，好像直到现在才想起这档子事，“人参还原封不动地放着，看我都忘得一干二净了。”


    朴钟一看’a看林尚沃，想确定一下对方的精神是否还属正常，然后又问：

    “怎么办才好呢？难道要让他们把那一摞摞的人参再装回马车？”

    “人参既然运来了，当然不能原封不动地再运回去。”

    “那该怎么办？”

    “既然运来了，就放在北京吧。”


    朴钟一感到不可思议：

    “放在这里？没一个人来买，一斤也没卖出去……”

    “我说，”林尚沃对朴钟一的回答根本不加理睬，“让他们把人参都堆到院子里去。”


    朴钟一投宿的会同馆院子里，整整齐齐地堆起了五千多斤人参。见人参堆好，林尚沃又命令道：

    “在院里堆一堆篱笆。”“堆篱笆？”朴钟一满脸疑色。

    “叫你干你就干，问什么问？”林尚沃的脸上挂上了怒气。一般的事，林尚沃是不动声色的。但此时林尚沃的脸上还显现出一种毅然决然的意'
  merge: -1
  img_proc: true
- pgno: 254
  md: '志。按照林尚沃的吩咐，院子里又堆起了一堆劈柴。


    “现在该做什么？”堆好劈柴，另外一个下人问林尚沃。“给劈柴点上火。”


    直到这时，朴钟一才明白林尚沃要做什么。他看了看林尚沃的脸色，见林尚沃仍是一副不可动摇的神态，便既不敢搭话，又不敢参言。他只能像林尚沃一样，默默地注视着这一切。按照林尚沃的吩咐，下人们在劈柴上点起了火。火遇干柴，立即升腾起熊熊火焰。北京最有名的客店前院大白天忽然点起劈柴，浓烟滚滚，火焰冲天。这场玩火的游戏可不是时候，马上引得人们云团般涌了过来。劈柴点着了，大火猛烈地燃烧起来，下人们又问林尚沃：


    “劈柴堆已经点着了，下面该做什么？”林尚沃脱口而出：“把人参扔到火里去！”


    “您说什么？”下人几乎不敢相信自己的耳朵，“您说把人参怎么着？”


    “我让你们把人参扔到火里烧掉。”


    下人迟疑了。这时，一直在一旁沉默不语的朴钟一大声喊道：


    “你们耳朵难道聋了不成？吩咐你们怎么做你们就怎么做，哪来那么多废话！大人是让你们把人参扔到火里烧掉。”朴钟一一马当先，抱起一拥人参扔进了火里。熊熊火焰开始吞噬被扔进去的人参。随即，人参也燃烧起来，和着呛人的烟气散发出人参特有的芳香。既然有人开了头，下人们也只好抱起一拥拥的人参朝火里扔去。前来观看的看客们顿时愣住了。等他们得知朝鲜商人往火里扔的不是别的什么而正
    bild是人参的时候，他们个个都呆若木鸡。北京商人们派出的密探，夹杂在这些看客中。他们都是北京商人的猜客，一直在严密注视着林尚沃的一举一动。见到林尚沃这么做，他们连忙跑到自己的主人那里，把这里发生的一切一五一十地报告给药材商们。


    “朝鲜商人点起大火，正在烧人参呢！”'
