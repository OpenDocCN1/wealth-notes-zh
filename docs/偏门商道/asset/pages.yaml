  md: '人在专为各国使节准备的客馆卸下了行装。


    在来访的外国使节们下榻的客馆里，供奉着一个刻有“阙”字 familiare wood plaque，叫做“阙牌”，是皇帝的象征。使臣们要对着这个阙牌行跪礼，禀告自己已平安到达北京，并开始在北京的正式外交活动，这叫“望阙礼”。不但初履北京之地和最终离开北京之时要举行，而且在北京逗留期间每个月的初一和十五都要举行这种仪式，由使臣带领所有的随员向阙牌行礼，仿佛那就是真正的皇上。


    作为出使队伍的一员，朴尚瀷自然要下榻客馆，而朴钟一每次来北京总是投宿前门大街的小客店。朴钟一耆到这里，不但是因为与林尚瀷交易的老主顾们大都聚居在这一带，一个更主要的原因是，同仁堂老板王造时也住在这里。由于林尚瀷与张美岭的关系，每次林尚瀷到北京，王造时都会到现场帮忙交易。


    自从通过张美岭结识林尚瀷后，王造时就做起了林尚瀷实质上的“伙计”。伙计这种制度，为当时中国商人所独有。在当时的中国商界，老板通常不会出头露面。他们一般都会按照清朝流行的做法，花钱去买官清名，表面上是官员的身份。用钱买官的制度被称为“捐纳制”。而生意，实际是由这些被称作“伙计”的代理人来负责的。伙计，说起来就是一种包揽金钱出纳的会计业务与管理事务的职业经理。由于有这些相当于现在职业经理的伙计出面，中国的商业圈子益发富有组织性和体系性，因而也就更具有竞争力。


    从这种意义上讲，同仁堂的老板王造时就是在北京当地替林尚瀷出面的代理人（即伙计）。同时也可以说王造时是帮林尚瀷做贸易并从林尚瀷那里获得一定佣金的贸易经纪人。这时的林尚瀷已是名满北京。林尚瀷带来的红参质量最佳，而其手头的货量别人也望尘莫及，加之北京的人参非常紧俏，林尚瀷的人参在同中国商人交易时经常处于非常有利的地位。尤其是，去年人参歉收，整个北京已经货源告罄。'
