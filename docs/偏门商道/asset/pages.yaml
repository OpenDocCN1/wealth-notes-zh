- pgno: 245
  md: "代 309 种书碑，是不会有秋史体诞生的。\n\n金正喜前去拜访翁方纲时，翁方纲正在沐浴斋戒，肃服正冠，以金笔抄录佛经。从新年那一天到正月三十，翁方纲要每天抄录一章佛经，布施给附近的寺庙。当时，翁方纲正在抄录《般若心经》。他每抄一个字，都要向书院里供奉着的佛像三拜致敬，这情景使金正喜感铭至深。\n\
    \n在今天的北京，有一座寺庙叫做法源寺，据说当年就曾接受过翁方纲以金笔亲手誊录的佛经，而且至今仍作为镇刹之宝珍藏着。\n\n巨儒翁方纲对金正喜也有所耳闻，他一眼就看出了金正喜不同凡响。他问金正喜：\n\
    \n“你看到这里的兰花了吗？”\n\n在正以金笔抄录佛经的翁方纲身旁，养着一株兰花，是一株春兰。\n\n“看到了。”\n\n“那你就来画画这兰吧。”\n\n\
    春兰，金正喜是很熟悉的。这种兰，比其他种类的兰开花要早，故而也被称为“报春花”。但当时正值严冬雪寒之际，春兰尚未开花。听了翁方纲的吩咐，金正喜马上挥毫熟路地画起来。林尚沃坐在一旁看金正喜画兰，心里暗自惊羡不已。随着金正喜的笔在白纸上一笔笔地点画，那兰也一点点茂盛地成长起来，转眼间一株生机勃勃的春兰\t\
    hash然纸上。\n\n金正喜作完画，放下笔，翁方纲走过来看了看，问道：“你画的兰为什么不开花？”\n\n金正喜笑着回答：“开花？现在是严冬腊月，离开花还早呢！”\n\
    \n“我的眼里明明看到了花，为什么你的眼里就看不到？你是只会画兰，不会看兰啊！看来，你是一个看不到面前东西的瞎子。”\n\n“那我就 Clan 来画上花。”\n\
    \n金正喜再次提笔在手。对翁方纲的话，他百思不得其解。那春兰分明只有一些茂盛的枝叶，根本没有开什么花。虽说春兰开花早，毕竟还没到。"
