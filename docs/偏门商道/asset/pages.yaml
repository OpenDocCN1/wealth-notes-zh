  md: '阮东升也是个非常喜欢学习、极有上进心的人。每年光是订阅订刊的费用就达3万多元以上，只要有时间，他每天常看的报纸不下十种，杂志也有5份以上。比如全国性的和各省市的综合性报纸，或是各个行业报刊，尤其是那些商务类的专业报刊，如《中国经营报》、《时代营销》、《销售与市场》、《商界》等都是必看的。他深知自己文化程度不高，因此更是格外地注重在学习中完善和提高自己。有时他在对下面公司的巡视中，看到哪个年轻员工无所事事地在电脑上玩游戏打牌消磨时间，他会不无严肃地责怪道：“你这么年轻，应该为自己的前途着想，怎么能这么荒废时光，对自己不负责呢。”


    对一个刚过40岁的人来说，其实还正值青年时期，阮东升身上具备的这么多好的品质，委实不容易。这也许跟他的经历不无关系。他一生经过多次创业，在创业的过程中接触过社会的三教九流，与形形色色的人打交道，可谓阅人无数，所以不仅能洞悉人情世故，而且更学会了如何与人相处，这正可谓“事事洞明皆学问，人情练达皆文章。”在事业上，他到达过峰顶也经历过低谷，很多时候是屡败屡战，跌倒了再重新爬起，而这又让他有了比一般人更大的承受能力和更丰富的人生阅历，对此他曾不无感慨地说过：“我这一生交了很多学费。”


    其实，对阮东升而言，无论是“富豪”还是“草根”，也许都不算是最真实、最贴切的“身份识别标签”。当然他不缺钱，然而更喜欢的是踏踏实实地做事。做大做强一个企业，于他，与其说是为了赚钱，倒不如说是怀着一份对事业的执着，一种对人生价值的追求。


    生命在这一过程中，也收获到了真实和快乐。


    阮东升是个什么样的商人呢？就像著名的布道家约翰·卫斯理（John welsley）所说的“拼命地挣钱，拼命地省钱，拼命地捐钱”那样的人吗？其实又不尽然。如果按照西方有关清教徒的描述，倒与阮东升身上的某些特质“相映成趣”。在一篇题为《像清教徒一样省钱》的文章中有这样的'
