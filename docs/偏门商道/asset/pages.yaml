- pgno: 237
  md: '儒生们通常要走的道路是考完小科再入成均馆科读，然后应文科试，文科中试后再去做官，所以，金正喜只是一介儒生，一个维儿而已，但“生员”这个称呼却是对书生的敬称。林尚沃虽然年长七岁，毕竟只是一介商人，照常理是不需要使用敬称的，但金正喜对他却礼敬有加，径直以“大人”相称。两人开始推杯换盏地喝起来。那年，北京的冬天冷得刺骨，而客地恰逢新年，无论是身体还是心情都自有一种寒意，林尚沃带来的酒就成了两人聊破寂寥的佳物。


    等酒喝到稍带醉意，林尚沃开口道：

    “金生员，我有件事情要向你请教呢。”

    “您要问什么？”

    “有人登上了百尺竿头，既不能上，也不能下，处于只有奄奄地等死的境地。”


    百尺竿头。长达百尺的竹竿的尽头，意指非常凶险、窘迫的处境，林尚沃是在借这个谐辞来描述自己所处的危急境况。


    “那么，那个人该怎样做才能从百尺竿头上下得地来？”

    “百尺竿头是下不来的。”金正喜脱口而出。

    “那该怎么办？人在百尺竿头上，上不得，下不得，动不得，在竿头上怎样才能求生？”


    “纵然是百尺竿头，也不是没有求生的办法。”

    “这办法是什么？”林尚沃精神为之一振，高声问道。

    “中国古时候有位禅师叫石霜和尚。这位大师教给了人们从百尺竿头活下来的办法。”金正喜拿起随身携带的毛笔，在纸上奋笔疾书，一挥而就。那运笔的气势、笔下倾泻而出的遒劲的字迹，林尚沃以前只是有所耳闻，眼前看来，果然是各笔中之各笔：

    “百尺竿头坐底人，虽然得人未为真。”

    挥毫写罢，金正喜说道：“这句话是说，即便是坐在百尺竿头上的人，'
