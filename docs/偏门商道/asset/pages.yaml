    # 令人瞪目的银票


    “到我们入虎穴抓老虎的时候了。”朴钟一愁眉林尚沃。行前，他又悄悄地问林尚沃：“现在蚂蚁已经有了，蜂蜜您打算怎么办？”

    林尚沃对朴钟一的话马上心领神会。这蜂蜜当然是指送给朴宗庆的赠仪。

