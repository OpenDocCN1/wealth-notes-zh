  md: '疏。那位备边使所上的条陈名字叫做“参包绝日”。


    备边使是主管国家防务的衙门，经常派人到边关点验边塞的戒备情况。这些被派去检查的人回来后所汇报的内容，重点却是有关于人参商人的问题。


    迄今为止，人参主要是由来往中国的缅甸和湾商来买卖的，因而有不少人私自越境，边防也就自然变得形同虚设，而国家也减少了大量的税收。有鉴于此，备边使在上疏中建议：“以律令设交易权，使权出于朝廷而开贸易之路，行财货之管制。”


    于是朝廷决定，将全国的人参流通网缩小到五个，由朝廷控制，让众多想做人参买卖的人们通过这五个窗口进行人参出口，而朝廷则通过这五个窗口及时、准确地收取税金。


    那天晚上，林尚沃从朴宗庆这位天下第一权臣那里拿到了人参交易权。


    这是林尚沃一生中惟唯一的一次权钱交易，但因为他并没有在空白银票上填写具体的贿赂金额，也就没有沾染上黑色幕后交易的污点。在这一点上，天下第一权臣朴宗庆也毫无二致。朴宗庆虽然把人参交易权许给了林尚沃，但并非以交易的方式，而是作为对林尚沃猜中自己所出的谜语履行自己本已做出的承诺来实现的。两个人之间，保持了一种不远不近、若即若离的关系。


    但无论如何，从此朴宗庆就成了林尚沃的后台人物，而林尚沃也像他在献给朴宗庆的空白银票上写下的“赤心”二字一样，终其一生对朴宗庆信义不改。林尚沃曾对朴宗庆说过自己姓“义”，正是这个“义”字，使朴宗庆在许久之后从林尚沃身上得到了命运性的回报。后来，在洪景来之乱发生后，朴宗庆立即成为口诛笔伐的众矢之的。这时，他还受到了大司宪赵得永的弹劾。弹劾的内容是这样的：


    “朴宗庆以帝之姻亲作威作福，淫乱不堪，惟知贪贿，以一己之私恣'
