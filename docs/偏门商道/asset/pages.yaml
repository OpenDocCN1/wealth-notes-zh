- pgno: 161
  md: '生事业如日中天的时候，阮东升做了一件几乎令所有人都大感意外的事——创办一所培养商业人才的学校。

    这所学校有个气度不凡的名字，叫“红埔商界军校”。

    投资办学，为公司进行人才培养和储备，这是多少企业家、老板没有想到，或者说想到却做不到的事，而阮东升似乎是重举着锄，没有瞻前顾后，就像他做项目一样，设想一旦形成，马上付诸实施。

    当时，“金王”集团光是全国各个的分公司就有300多家，各级营销人员达四五千人，主营业务是“洁中洁”、“醇中醇”等这几大块，此外还涉及中草药、食品、机械等200多个项目。由于覆盖全国的项目营销网络迅速扩张，公司规模随即急剧膨胀，人力资源的使用上已经开始捉襟见肘，面临无人可用的境地。

    公司人事部的一位工作人员回忆，在1999年末至2000年初这一阶段，他亲自参与招聘进来的员工就有2000多人；可这还无法满足集团公司对人力资源的需求，人事部四处设点进行招聘，在哈尔滨市所有能招得到人的地方都去了，以至于最后招聘点上再也见不到一张生面孔，因为，能招的人都给招光了。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '有的大项目摊子铺得很大，发展又快，人员缺得厉害。公司一位负责人不无鄙愉地回忆说，那时候只要有人，哪怕大街上随便拽个人来，问你像不像，认不认识钱，会不会数钱，只要你有个小学毕业就行，完了立即录用，往上安排，根本来不及进行必要的前期培训。正因为如此，阮东升在一次员工大会上曾焦急地说：“我现在需要人需要到什么程度，十七八岁的小孩子我都已经提上来做一个省的经理。”事实上，当时在对一些人员委以重任时，徜徉只需和人事部的负责人谈，如果谈得不错，发现此人思维、口才等方面都可以，就送董事长阮东升那里相处个三两天，直接观察了解一番，如果合格就直接送到各省的分公司去做副总经理了。


    形势逼人。如此权宜、应急性质的人员使用现状，必然会给企业带来隐患和损害，如人员不稳定、经营出现偏差等等。


    开办一所人才培训学校这样的想法，阮东升是由来已久。在当今市场经济的社会环境下，专业化、系统化地培养出一批有职业素养，有事业心的商业人才，哪怕最后不能为己所用，为其他企业所用，对整个社会而言也是件好事。一群商业英才，就是一支能有效整合资源，为社会创造价值和财富的有生力量，从这点上来看，对社会也是一种贡献，是有积极意义的。


    这这再一次证明了阮东升的远见和抱负。


    如果说阮东升是“红蜻商界军校”的创办者和后台老板，那么一个叫顾继鹏的年轻人，就可称得上是“红蜻”的“灵魂”。


    阮东升创办“红蜻”的实力和底气，就是因为有顾继鹏这样一位企业里的英才。


    顾继鹏是阮东升的秘书长，并担任金王集团的行政主管和人事部主任。他不但行事严谨理性，而且口才极好。尤为难得的是，他除了熟悉法律，懂得经营管理之外，平素还喜研读儒家学说和道释典籍，对中国传统文化颇有心得，这在他后来编写的“红蜻”教材内容中，都不难发现其中'
  merge: -1
  img_proc: true
- pgno: 163
  md: '亦古亦今、中外兼容之处。


    2000 年 5 月，阎东升向顶继鹏提出了办一个商业人员培训班的设想，问“能不能干？”顶继鹏想了想，回答说，“能干。”阎东升又问，“需要多少钱？”顶继鹏说，“有多少席办多少的事。”


    就这么简单的几句对话，却很有分量。其实在办学这件事情上，两人极有默契。阎东升决定放手让顶继鹏去做这件事。


    那一年还没到 30 岁顶继鹏在金王集团里虽资历不深，却深得阎东升的赏识与信任，这点尤为重要，因为在企业里创办一所商业培训学校完全是一个全新的课题，谁也没有经验，无论办好了还是办砸了，都很难预料。只有获得充分的授权与支持，才能让人减少顾虑，全力以赴。


    顶继鹏是幸运的，因为他所进行的是一个极有价值的尝试。尽管当时企业高层也有不同的声音，但他还是义无返顾，欣然领命。对年轻的顶继鹏来说，不乏干一番事业的激情，更有一种“士为知己者死”的知遇之心。


    说起来，“红埔”是一个早在 1996 年就成立的专门从事家政等业务的服务性实体，那时候，家政还是个非常前卫的概念，也是个有很好市场前景的行业。当时是阎东升的一位幕僚请来叶茂中做的策划，并从叶那裡得到了包括“红埔”（“红埔”的“埔”字，在这里是取“仆人”的“仆”字的谐音，以体现家政行业的特点。）这一名称在内的整个
    CI 设计方案。


    不过，“红埔”一词，在历史上很真有出处。1931 年 10 月，朱德、毛泽东在宁都县小布方面军总部，专门与红八军军长何长工和红五军军长邓萍等谈了创办中国工农红军学校的事项。


    毛泽东说：北伐时期，国民党有个“黄埔”，我们现在要办一个“红埔”，你们看怎么样？


    毛泽东的一句话，促成了后来中国工农红军学校的建立。从 1931 年秋至 1933 年秋，共办了 6 期，培训了上万名军政干部。中国工农红军学校'
  merge: -1
  img_proc: true
- pgno: 164
  md: '就是红军大学的前身。


    “黄埔”、“红埔”，毛泽东仅谐的语言，形象的比喻，既鲜明又通俗易懂，既说明了两个阵营的不同之处，又说出了办学校的重要性。


    叶茂中的这一策划案用了“红埔”两字，不知是无意的巧合还是有意的借鉴，当然这些都不重要，重要的是“红埔”两字颇有冲击力，让人过目难忘，记得住，这就足够了。


    以家政服务为主营业务的“红埔”成立后，经营状况差强人意，几近关闭的边缘。受命创办商校的顾继鹏慧眼独具，他敏锐地一眼“埔”中了“红埔”这块“招牌”。他觉得拿“红埔”这个牌子做家政真是太可惜了，如果用到即将开办的商校上却是十分贴合，寓意恰当，似乎正是早早就为这所商校做准备的一样，一切都那么“浑然天成”。


    于是顾继鹏将“红埔”的名称和CI做了一番“拿来主义”，用作商校的正式名称。这当中他灵光一闪，有了一个极富创意的细节上的改动：将原来“红埔”标识图案上的装饰性拼音字母“hongpu”，更改为英文单词“Hope”（中文“希望”的意思）。这堪称“画龙点睛”式的神来之笔——小小的改动，在立意上更上一层楼，给“红埔”赋予了培养人才、浇灌希望的意涵，整个意义得到了升华。更为令人叫绝的是，顾继鹏还给“红埔”这所未来商校的校名拟出了这么一副对子：“昔有黄埔沙场名将，今有红埔商界奇兵”。短短十六个字，将“红埔”商校的性质，和历史上声名赫赫的“黄埔军校”作了巧妙的对比，不但引人暇思，而且无形中以一种“捆绑式宣传”的手法，悄然给“红埔”商校拔高了一个格。


    1924年6月成立的中国国民党陆军军官学校，是孙中山领导的中国国民党在中国共产党和苏联帮助下创办的一所培养革命军队干部的新型陆军军官学校，因校址始设于广州黄埔长洲岛，故又通称“黄埔军校”。“黄埔军校”是国共合作的产物，是中华民族以武力反抗帝国主义侵略和封建势力压迫的体现。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '“黄埔军校”提倡亲爱精诚、团结合作、卫国爱民、不怕牺牲的黄埔精神，为中国革命作出了巨大贡献。从这里走出的毕业生却将星熠熠，许多黄埔师生成为国共两党政府的栋梁。


    作为一所私营企业创办的商校，当然希望培训出来的经理人或员工不但对该企业能有一个较为深入的了解，而且在与企业领导者的相处中能增进彼此的情感交流，将来对企业有一定的忠诚度。


    顾继鹏把即将成立的“红埔”定义为“商界军校”还不仅仅有以上因素，在更为具体的操作方面，他的设想是商校将实行军事化管理，从严治校，让受训者不但能学到有关实用的商业企业运作技能技巧，而且还能在体能和品质上得到一番锻炼磨练，以增强毅力意志，从而在往后的商海实战中能经受住风浪。所有这些，我们都可以
    cannon 在后来的“红埔”教材和培训内容上得以看到。


    受命之初，顾继鹏在阮东升的鼓励和支持下，投入到紧张的筹备工作当中。落实校舍、置办学员服装、解决生活设施问题等等，一切都是重头开始，一切都得张罗，事无巨细，琐碎繁杂。不得已之下顾继鹏找来了两位副手协助，让他们去操持事务上的具体事宜，而他还有更重要的工作——那就是准备教材。这是一切工作的重中之重。


    顾继鹏准备了将近4个月的时间，所形成的教材内容除了将他平常学习、思考而积累起来的人生感悟和价值观作为一条主线外，他还搜集了许多商务、市场营销、财务制度、公司管理等方面的书籍资料作为参考，其实，对商业人员进行户外拓展训练，顾继鹏所做的尝试当时在黑龙江省还是开先河之举，如今，拓展训练在全国已是普及开了，哈尔滨市目前很有名气的拓展训练师宫铭，就是顾继鹏后来“红埔”三期的学员。'
  merge: -1
  img_proc: true
- pgno: 166
  md: '2000年9月13日，“红埔商界军校”第一期培训班正式开班授课，30名学员满怀兴奋地来到位于哈尔滨市江北“龙江第一村”的一处风景优美、静谧的小院，这里原为“金王”集团的总部，如今已腾空，并粉刷布置一新，作为校舍供师生们使用。


    学员们着装整齐，精神抖擞地开始了也许在他们一生中都将留下难忘印象的学习生活。


    阮东升在开学典礼上对学员们讲了话，他勉励大家要珍惜这一次难得的学习机会，努力提高自己，要每日精进，不要荒废了宝贵的时间，要学有所成，为自己和家人争气。“无论干什么，都要干得最好，这就是我们企业的精神，也是我送给你们的希望和祝愿。”


    第一课是在大家齐声高呼“红埔”誓词开始的——“光大红埔，开创辉煌！”在学员们的案头，早已摆放好他们的教材。这些教材，几乎所有的学员至今都还保留着，这不但能给自己一份珍贵的回忆，而且不时拿出来翻阅，还可以很好地激励自己。


    每个学校都有每个学校的校训。“红埔商界军校”的校训是一篇《红埔箴言》。这篇以励志、劝勉为主题的“箴言”，行文激昂向上，催人奋进，其文言的体例更是令人耳目一新。


    # 红埔箴言


    当今时事，非立志无以成己，非笃学无以广才。志贵恒毅，学贵专精。性格懦弱无刚是谓大患，心思散漫无主是谓大忧；心无所守，技无所长的是谓大贫，怠惰身心，颓废心死是谓大困。忧患日累，贫困相随，如此为本。而彼患命运多寒，怨天尤人之属，下流矣！


    守恒固智，勤恒为慧，知耻为勇，善处为略。无智慧、无勇略，则无寸土可以立足，无片瓦可以遮身，无斗粟可以裹腹，无匹布可以饰己。且父母之寄望，家小之殷情，此时此境，若志不强毅，意不慷慨，徒碌碌滞'
