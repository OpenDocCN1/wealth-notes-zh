- pgno: 20
  md: '就这样，阮东升来到了方正县的乡下上学。说是上学，其实也沒上几天课，他可不愿整天在教室里呆着，几乎是一有机会就跑到野外去走走看看。农村学校的条件不比城里，规矩沒那么多，再加上离开了父母的管束，对阮东升而言，更是彻底的“解放”了。他在田野上看农民劳作，在小河边、树林里与大自然亲近，这里虽然沒有城市里的热闹楼房街巷、热闹的车流人群，但这里的土地能让人感受到勃勃的生机，这里的人们是那样的纯朴善良，就连这里的空气都比城市里的更清新更透明。阮东升一下就喜欢上了这里，他发现农村有着与城市不一样的乐趣。


    在乡下老家，阮东升的爷爷成了他农村生活的老师，他觉得，相比父母的严厉，爷爷似乎对他更慈爱，跟他说话更有耐心更有<|start|>发性。在爷爷那里，阮东升听到了春播秋收的知识，听到了大地山林的奥秘，也听到了一个个发生在这里土地上惊心动魄的抗日故事。在乡下的那些日子，他对一切都充满好奇，更重要的是培养出了他在艰苦条件下独立生活和生存的能力，在这里，他甚至开始学会思考长大以后要做些什么有意义的事情。看来少不经事的顽皮和莽撞，要跟他告别了。


    单纯宁静的农村生活，让一个毛躁不安分的孩子终于能慢慢地静下心来。回想起来，那番经历几乎成了他在青少年时期感觉到最美好的一段时光。


    在方正老家呆了几个月后，乡下突然传出爆发传染疾病的消息，情急之下，父母匆匆将儿子接了回去。回到哈尔滨没多久，父母狠狠心又把他送到了两百多公里外的乡下亲戚那儿。在上个世纪七十年代末，那时候的农村别说上学条件，就是生活条件也可见而知，父母当时只是想，有个去处能让他老老实实呆着不去闯祸就行。


    这一次的回乡“锻炼”，阮东升可是遭了大罪。母亲三个多月后赶过去看，发现他又黑又瘦，头发老长，全身因为虱子、毒虫的叮咬而肿起一个个脓疮，一抓挠就引起溃烂，到处是脓血。母亲抱着儿子的头心疼得哭'
  merge: -1
  img_proc: true
- pgno: 21
  md: '了起來。在這情形之下不回家是不行了，身上的脹疙瘩得趕緊治呀，母親馬上領着兒子回到了哈爾濱。

    一段時間後，兒子的身體恢復好了，父母也不忍心再把他送回鄉下去。在哈爾濱無學可上，那就在家呆着吧。也許真的是離開父母到農村生活這段經歷的影響，阮東升的性情發生了改變，他明顯地安靜了。兒子的變化當父母開始都覺得有些不習慣，他們既吃驚也暗暗地有些寬慰。

    安靜下來的阮東升，個性中那些積極的因素和與眾不同的特質也逐漸顯露了出來。他喜钻研、愛琢磨，手頭有些什麼東西總是要撥弄一下，直到理出頭緒為止。不去上學了，整日呆在家裏，他的注意力開始盯在
    Lorem 为数不多的电器上。他不知道從哪弄來的工具，將家裏的這些寶貝東西一一拆開，將裏面的構造分解清楚，看個明白，然後再將每個零件按原樣重新組裝回來。有<|message|>一天父母回家看到兒子將家中的收錄機“大卸八塊”，電路板元件螺絲什麼的擺了一桌面，心疼的不得了。那時候，收錄機算是家裏的貴重電器，拆壞了可怎麼辦，剛想責備，轉念一想，他一個人在家裏安安靜靜的，有這鉆研勁兒總是好事，可不能為此責怪他呀。其實，父母這種理解和寬容無疑是最可貴的心態，後來阮東升在創業時期的種種嘗試，無論成功與否，都獲得了來自父母的默默支持和鼓勵，這種愛，成了他在人生道路上愈挫愈勇、不断前进的動力。

    鐘表電器都拆了個遍後，阮東升探究的興趣又聚集到了鎖頭上。一次，他在一本雜誌上看到了一種開鎖的基本原理和技巧，那時候恰好家裏有一把壞的大掛鎖，阮東升把它拆開後，研究了半天，搞不清楚的地方甚至跑到街上去請教修鎖的師傅。這麼一來二去，弄了一個多星期，細心加上倔性，竟讓他給搞鼓成功了。父母別提多高興，不是壹個掛鎖值多少錢，而是兒子的轉變讓他們喜從心生。

    阮東升一不留神成了街道上的修鎖小行家，於是他跟破鎖可就“較上勁”了。他從同學、鄰居家裏收集了一大堆破鎖，承諾人家可以修好一當'
  merge: -1
  img_proc: true
- pgno: 22
  md: '然是免费的。那时候的人可不像现在那么有“经济意识”。


    阮东升没日没夜地在家里捣鼓这堆破锁，不到一个月，居然给修好了一大半，大家少不了给他~通夸赞。父母看在眼里，嘴上不说心里却十分欣慰，孩子的精力和智力终于有了正当的释放渠道，懂得去做有价值的事情，做家长的总算可以放心了。


    谁想到，没让父母省心多久，阮东升又出事了，这事坏就坏在了“锁”上。


    会修锁，肯定就了解锁的构造，了解锁的构造，开锁就易如反掌了，尤其是那些最简单的自行车弹簧锁。


    从乡下回城后，阮东升原来的那些小哥儿们又陆续来找他一起玩。大家都知道他会开锁，于是便径想他露两手给大家开开眼。经不住众人这么一说，阮东升答应了。


    起初他也只是想在哥儿们面前“小试身手”就算了。只两下子，一辆别人放在屋外的自行车的弹簧锁“咔”地应声打开，几个哥儿们发出一片惊呼。他毕竟是“老大”，在兄弟们崇拜的目光中总得表示点什么，于是鬼使神差的，他居然忘了车子不是自己的，拍了拍自行车的车座很“大度”地对兄弟们说，你们拿去骑吧。


    只有一辆自行车，这么多小哥儿们也不够骑啊。于是判决短短几天时间，阮东升在小哥儿们期待和惊慌的眼神中接连开了20多辆自行车的锁，让别人的自行车成了自己小哥儿们的坐骑。他们每天骑着这些“战利品”到处瞎逛，好不快乐。这些自行车他们从未想过要拿去“销赃”贩售，更不骑回家，而是每天玩够了，就集中放到一处僻静的地方，下回大家聚在一起再推出去骑。这是典型的上世纪70年代末80年代初小青年的做法，“作案”动机很单纯，就是为了玩，那时候的社会风气不像今天的这般复杂。


    儿子所做的一切，父母自然都还被蒙在鼓里。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '那个年代，自行车是一个家庭中最为昂贵的财产之一，一个街区短时间内一连丢了20多辆，这还了得？根据众多失主的报案，公安局民警可是全力以赴去侦查。没用多久，作案者抓到了，民警开始还不敢相信自己的眼睛，原以为一连“弄”了20多辆自行车的一定是个“老贼”，没想到是眼前这个还有些稚气的毡头小子。


    阮东升的父母又一次接到了派出所的电话，脑袋是嗡的一下几近空白。那个时候少年犯罪还不是太多，尽管你“弄”走了别人的自行车不准家藏，也不拿去卖，而是给伙伴们骑，可这已经不属“恶作剧”，性质不一样了，再怎么说也是20多辆自行车的失窃案，不是被民警教育几句放人就完事了。虽然那些自行车都追回了，全部完璧归赵，甚至连自行车锁都没有损坏，可阮东升还是被送教养所劳教了两年。现在看来这样的处罚显然是有些过重得不可思议，不过发生在那个年代却是合理的。命运给了阮东升人生一个难以忘怀的教训。


    劳教，劳教，就是要在劳动中接受改造。进了教养所，可就不是闲着玩的了，那就是要你去吃苦，疏浚河床、开挖沟渠等等，全是重体力劳动，有时一个22磅重的大锤，一alm就是好几个小时。说是教养院，其实很不规范，这里既有还不太懂事的少年，也有上了年纪的老惯犯。上千名劳教人员老老少少分成几个组，每天都是集体出工劳动。


    在教养院这样复杂的环境里，一方面看，阮东升通过那些老劳教人员，倒能学会不少社会知识和生活经验；要是往消极的一面看，在这种地方呆的时间长了，也很容易学坏。


    有些老惯犯就是因为盗窃被“折”进来的；闲着没事，就教这些小孩耍棍“绝活”。按江湖规矩，小孩子们都得称这些老惯犯们“大哥”，“大哥”叫干什么就干什么，大家无论是在吃饭还是在干活，就按“大哥”的吩咐进行“练习”，也就是互相偷。自天劳动收工后回到监舍，没有电视看，也没人管，大家要么胡吹乱侃，说各自的“能耐”，要么就练习耍棍。'
