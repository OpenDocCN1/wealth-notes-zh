- pgno: 224
  md: '字，但据传，一向与金鲁敬不睦的蔡济恭惊叹于那书法之老到酣畅，居然特意来到金府，对金鲁敬说道：

    “大门上挂的立春榜是谁写下的？请让我见上一见，以慰慕怀。”

    听了蔡济恭的话，金鲁敬欣然答应，马上让人把写字人叫了来。谁知来人竟然是只有七岁的金正喜。见了这尚在童稚的少年，蔡济恭犹自不敢相信：

    “难道写那字的真的就是这样一个孩童？”

    当他获知写字人的的确确是眼前这个七岁少年金正喜后，蔡济恭预言道：

    “这孩子，将来必会作为一代书法名家名播四海！但他会因书法而命运多舛，所以最好还是干脆不要让他拿笔。倘若他能够以文章而邀世道之宠，必有大贵。”

    很久很久以后，蔡济恭的预言果然应验不爽。秋史金正喜以其书法闻名遐迩，但其晚年却极其悲惨。

    对于青年金正喜而言，林尚洙是一种非常特别的存在。

    因为，金正喜根本不懂中国语，只能靠笔谈与中国人交流，而要开口说话必须借助林尚洙的翻译。据记载，金鲁敬一行 1809 年（乙巳年）10 月 28 日离开汉阳，12
    月抵达北京，在北京逗留两个月左右，于翌年 2 月初复从北京出发，1810 年（庚戌年）3 月 17 日回到朝鲜。这是一次漫漫长征，从起程到返回足足用了 5
    个月的时间。

    金正喜和林尚洙心中都有一团渴望的烈火在燃烧。金正喜渴望着到北京发现一个广阔的新天地汲取新学问，而林尚洙则梦想着打开一个广阔的新商界，在那里与中国商人们展开生死相搏的商业大战。尽管目标有所不同，但金正喜与林尚洙一个要追求书道，一个要追求商道，都是要求达到“道”的境界，从这个角度讲，这次远赴北京正是一次求道之行。

    使臣的队伍从 10 月 28 日起程，当年 12 月 22 日终于抵达北京。一行'
