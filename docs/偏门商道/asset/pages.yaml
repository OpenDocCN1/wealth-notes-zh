- pgno: 241
  md: '了更高的公告价后，林尚沃压根就不再理会买卖的事儿。他向朴钟一和几个跟随自己的下人撒出大把大把的银子，让他们去喝酒，去解闷，痛痛快快地去玩一通，自己则和金正喜双双遛起了北京城。


    当时，北京有着两位巨儒，一位是翁方纲，一位是阮元。他们两位是中国清朝知识界的精神领袖


    秋史金正喜受过朴齐家的北学思想熏陶，但他的成就却是缘自清朝代表性的实学家翁方纲与阮元。金正喜师从翁方纲，学经学、书画、金石学，尤其是随精于篆、隶、楷、行诸体的翁方纲精研书法，创造了独特的、金正喜特有的秋史体书法。而阮元是当时中国考证学派的泰斗，中国代表性的思想家，作为一个大学者，他博于经史，在金石学方面也有着极深的造诣。


    秋史在北京逗留的时间不过是短短40天。据记载，金正喜10月28日随父亲金鲁敬为陈奏使的出使队伍起程，12月22日抵达北京，次年即1810年2月1日，阮元率弟子朱鹤年、洪占銮、金勇、李林松、刘华东为即将离开北京的金正喜设宴饯别。从这个记录来看，金正喜在北京逗留并同这些巨儒交游的时间不过月余而已。但就在这一个多月的短暂交游中，金正喜大开眼界，而且声名大振。


    梅花的怒放并不需要太久的时日。只要到了春季，有和煦春风的吹拂和温暖阳光的照射，它就会在一瞬间突然开放。从这一意义讲，如果金正喜是一束梅花，那么翁方纲和阮元就是这束梅花的春风和暖阳。


    金正喜的才华，因为导师朴齐家在北京的数度盘桓早已在北京的学者间广为传扬。因而，他们对随出使队伍前来的金正喜已耳熟能详。据记载，当时的少壮派学者曹汇曾这样描述金正喜：


    > “东国有金正喜先生，号秋史，年方24岁，慨然有行四方之志。曾有诗云‘慨思四海结知己，寻觅同心愿为死，但闻天涯多名士，对酒当歌笑不已’，以此足见其大家气象。据称，其独标高于世，不为现实所羁绊，'
  merge: -1
