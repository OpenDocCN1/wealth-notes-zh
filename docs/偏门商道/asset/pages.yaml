  md: '时令，莲花骨朵也还没长出。可翁方纲非说他看到了花。于是，金正喜开 始想像着为兰添上花。平时，金正喜经常画春兰，这时候提笔作画，可谓 绰轻就熟。先画上花茎，再画花朵，最后又画上花萼。林尚
    泱屏佳呼吸， 看着金正喜行云流水，运笔如飞。霎那间，原本枝叶茂盛的春兰怒放起朵 朵鲜花。金正喜刚画完，翁方纲走过来，凝神看了看，说道：“花终于开 出来了嘛。”


    说着，翁方纲拿起金正喜所画的春兰图，一边做深呼吸，一边嗅着春 兰的气味：


    “可是，你画的这花，没什么香气吗！”


    金正喜困惑地望着翁方纲。


    “看来，你会画兰却没见过花，会画花却没闻到过花的香气。”翁方纲 指指自己金笔抄录的《般若心经》，“如果我现在只是在一字一字地抄录佛 经，那我就只不过是在做瞎写写的事情。但我并不是在抄字，我是在揣
    摩它的真意。同样的道理，如果你是模仿摹兰的样子，你就只不过是一个 模仿别人画作的画工，而实际上，你既然要画兰，就得画到开花，既然开 了花就要有香气。没有香气的兰花只不过是一棵死兰，是不能称得上清
    兰的。”


    听了这话，金正喜恍然大悟。


    # 领略京城大师风范


    作为一个思想家，翁方纲当时非常注重修炼正道。譬如诗道，即以杜 甫、苏东坡为正统，只有到了他们那种境界，方能称得上修成了正道。翁 方纲主张，诗道的价值在于文字香与书卷气。


    “文字香”与“书卷气”，这就是翁方纲所追求的最高理想。换言之， 他认为诗道的极致便是一篇美丽的文章自有其趣，一本有内容的书自有 其气。'
