- pgno: 226
  md: '# 偏门

    商道


    就在这个时候，朝鲜的人参贸易大王林尚渫带着 5000 斤上好的人参随着陈奏使的队伍来到北京。这一消息经由王造时的一纸通文，马上传向北京所有的药材商们。药材商们立即涌向朴钟一投宿的小客店。这些药材商也大都是些作为代理人前来谈价的伙计，老板则另有其人。


    因而，林尚渫自然也不会出面，实际来操作买卖的是朴钟一和王造时。


    药材商们可以先看林尚渫带来的红参货样。这群长期与人参打交道的商人，只消一眼就本能地感觉到，林尚渫这次带来的人参是上品中的上品，也就是极品。他们都急切地想知道，这极品的人参究竟会开出一个什么样的价钱。


    当时，与中国人做交易，并不是一对一去单个做，而是买卖双方的代表经过激烈的讨价还价最终定出一个公告价，以一揽子交易的方式进行的，觉得那价格不合适的人就不参加这笔交易，而到别人那里去成交。


    “究竟带来了多少人参？”


    “价钱是一斤多少？”


    中国商人们已经禁不住心中的揣测，不住地向朴钟一和王造时间这问那。'
