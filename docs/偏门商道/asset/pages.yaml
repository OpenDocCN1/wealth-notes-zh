  md: '出行而萌发了特别的友情。


    林尚沃已经有过十几次远赴北京的经历，是出使队伍不可或缺的中国通。他不但是任何人都精通中国话，而且深谙中国人的心理，每一次有使节出使北京，都要到林尚沃这里来求援。林尚沃当然没有理由回绝这种求援，因为随出使的队伍到北京做人参买卖，既能保障人身安全，又可以借助官方贸易而非私人贸易的形式在交易中获取更为丰厚的利润。


    林尚沃知道，较之冬至使，陈奏使一行会受到大清朝廷更为隆重的接待，所以这次他带的人参比平时都要多得多，在马车上装了 5000 斤人参，登上了远赴北京的漫漫路途。当然，是和朴钟一——道。


    林尚沃与朴钟一被一个梦想激励着。


    如果这次出行能够把买卖做成功，不但能够得到难以想象的巨额利润，甚至可以控制中国的人参市场。这绝对是一个绝好的机会。


    和中国人做生意的人，经常会陷入一种在浆糊里刷浆糊式的糊里糊涂、不知所适的状态。但这次却不同。


    林尚沃手头的人参之多已是史无前例，而且拥有了独家销售的最佳机遇，处在惟一的制高点上，足以同中国人展开激烈的商战并获取胜利。


    金正喜本是金鲁敬之子，但刚一呱呱落地，便被过继到了金鲁敬那没有子嗣的兄长府上。过继，当然就是作为养子为他家传宗接代。因而金正喜有两个父亲，一个是给了他生命的生父，一个是养育他成人的养父。


    金正喜自幼聪明过人，六岁起即能诵诗作画。当时第一大学者朴齐家看了金正喜的书画册子，当即预言金正喜将以学与艺扬名海内，并表示“吾将教而成之”。


    果然，待金正喜长到 15 岁那年，朴齐家亲自收之为门人，开始耳提面命，亲自为教。朴齐家，金正喜之师，朝鲜王朝后期实学家，尽管学问造诲与才艺卓尔不群，但身为侧室庶出之子，终身压抑，难申其志。后来，受益于正祖为安抚庶子长期积压的不满而颁布的政策，他得以供职于'
