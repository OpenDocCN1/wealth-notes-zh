- pgno: 107
  md: '# 如


    果说做“长城痔烟灵”的时候，阎东升还是多元化经营的想法使然，那么，他后来涉足的一种青少年鞋类产品的生产和营销，则完全可以说是开始了全新的实业尝试。


    这一次尝试，离最后的成功几乎仅一步之遥。


    上世纪90年代初，中国兴起了一股持续多年的保健品热，任何一种被赋予某种新概念的保健品一上市，就肯定能得到大家的热烈追捧，国人似乎对自己的身体和保健问题忽然间格外重视起来。


    “505神功元气袋”是那个时期保健品最具代表性的“产业符号”。


    那个时期几乎所有的保健品种类，阎东升都代理过，只不过相比做“放种、回收”的偏门行当而言，保健品代理挣到的那些小钱，实在无足挂齿。


    直到后来阎东升自己发明并推出了一种叫做“步步高”鞋的、专门针对青少年身体增高而设计的鞋类产品。


    “步步高”鞋创造了1000多万的利润，也差点能让阎东升实现从做偏


    # 第九章 实业尝试'
  merge: -1
  img_proc: true
- pgno: 108
  md: '门到成为实业家的事业转型。


    “步步高”鞋的创意就来自他所代理过的那一系列保健品。


    气功、磁疗和药物，这三样是当时那些保健品所打出的共同概念。除了“505 神功元气袋”之外，阎东升还代理过一种叫“气功掌”的产品。90 年代席卷中国的气功热，让这些产品应运而生。


    所谓“气功掌”其实就是一个刮痧器，产品外形像一只手掌，里面装填着小磁块和药末。阎东升是个很善于动脑子钻研的人，行动力极强，而且行事不喜欢按常规“出牌”。


    阎东升哪会甘愿简单代理“气功掌”，产品销路好，他就想到了仿造。这方面他是有经验的，《本草纲目》加上专业机构的检验报告，就像他仿出了阎民的“长城烤烟灵”。


    今天中国的知识产权保护还没能做到尽善尽美，何况十多年前？其实，“气功掌”也完全不是什么“高科技”产品，阎东升只要愿意，很快就可以仿造出与别人一模一样的“气功掌”。


    阎氏“气功掌”造出来了，投放市场销路不错。尽管这个项目也没挣到什么大钱，不过让阎东升有了生产保健品的“技术思维”。


    阎东升曾读过一本关于日本索尼企业的书，书名叫《索尼成功之路》，书上说，在日本电子行业，松下的老大，索尼是老二，上世纪 60 年代松下就斥巨资搞电子产品的研发，这时候的索尼就采取一种“跟踪策略”，把松下的新产品进行解剖、研究，并经过改进、升级，由此花非常小的成本，总能紧跟松下的步伐，力保日本电子行业排行第二的地位。


    “索尼成功之路”给了阎东升走“仿造之路”以启示和理由。


    不过有时候连“仿造之路”都不走，而是直接找到该产品的专利发明人和生产厂家，直抄对方商家的后路。


    “清脑助学器”也是一个以磁疗和药物为概念的保健产品，当时在学生市场行情很好。后由于代理权属之争，阎东升的公司被逐出市场。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '他一气之下，找到“清脑助学器”的专利人和生产厂家，要求开足马力生产出一万个一模一样的产品。从厂家直接出来的产品，价格当然要比从商家处进货低得多，这一万个低价“清脑助学器”一出笼，就把原来的市场冲击得七零八落，商家叫苦不迭。


    把“清脑助学器”的商家治得够 {#} 够后，阮东升并没有就此善罢甘休，就像大闹天宫的孙悟空，他后来又找到该商家在广告营销上的一处“破绽”——曾邀请中央电视台著名播音员X做产品宣传。因为众所周知，中央电视台此前已有规定，台里的播音员主持人是不允许做广告的。于是派人到国家广电部“告发”，此事经过查实，据说X还受到了处分。


    就这样，人们预计市场价值可以做到几个亿的“清脑助学器”产品，经阮东升这一通搅和，后匆匆退出市场了。


    后来阮东升发明的“步步高”鞋，让他直接产生借鉴效应的是 一种叫“必清神鞋”的产品。


    “必清神鞋”这个项目，最早是郑文滨和阮航在山东济南看到的。


    当时郑文滨和阮航正在山东做着一个养殖项目，一天，偶然在济南的一条大街上看见一商贩外有人排长队买东西。都什么年代了，有啥东西居然排长队才买得到？看样子肯定是不错买卖。


    偶然挤进去一看，原来是卖鞋的。


    消息传回阮东升那里，经过详细了解，发现这种叫“必清神鞋”的产品市场销路极好，而且目前营销还仅局限于山东本地。于是，他决定和弟弟以及郑文滨一起做。


    项目代理谈得很顺利，不料此时发生了一个挺有意思的插曲。


    阮东升的一位老朋友此时也得知了“必清神鞋”的事情，他同样对此项目大感兴趣，想独自把代理签下来。于是，他耍了一个小手段：谈代理的时候对项目的专利人及开发人说了阮东升的坏话——“此人是黑社会的，不能跟这种人合作”。对方一听自然十分惊讶，哪能跟黑社会的人做'
  merge: -1
