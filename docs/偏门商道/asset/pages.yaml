- pgno: 259
  md: '阮东升并不认可对他用“富豪”这样的具有某种“身份识别”性质的词汇，这不仅是因为“富豪”一词在当今中国社会，公众还无法赋予它一种完全正面、积极的附着色彩，而且，以阮东升的抱负，目前他的资产远没达到他自己所界定的“富豪”这一级别的标准。


    事实上，以阮东升的人生态度以及财富观，他的生活方式、行为模式，与一般人心目中的“富豪”可谓是大相径庭，截然不同。


    这是一种十分鲜明的反差。


    曾经有一个小伙子经人介绍，到阮东升那里去应聘做保健医生。在此之前，他曾多次给一些企业集团的总裁或董事长做过健康保健工作，因此对这些“成功人士”的生活习惯和环境是比较熟悉的。


    然而当他第一次来到阮东升的居所兼办公室时，简直是吃惊不小，甚至有些怀疑这到底是不是真的一个大公司的董事长，因为眼前所见的一切，与他以往所见过的那些“有钱人”考究、甚至是奢华的家居、办公环境相比较，真是显得太寒
    empleado了：几乎没有任何装饰的房间，陈旧的家具摆设。更要命的是，这里似乎永远都是乱哄哄的，电话铃声此起彼伏，各式各样的人进进出出，汇报、指示、交谈，忙得不亦乐乎。这可不是个想象'
  merge: -1
  img_proc: true
- pgno: 260
  md: '中“有钱人”生活的那种舒适环境，而且，如此的环境之下又怎么能给人安静地做保健护理呢？眼前的这位董事长衣着随随便便的，发型普普通通，一看就知道是个疏于打理自己的人，完全没有一副董事长的派头。


    小伙子当天就想走掉了，后来还是介绍他来的那位朋友劝他先别急着走，不妨跟这位年轻的董事长相处一段时间，到阴时再做决定不迟。


    结果，这位小伙子后来就一直呆下来了，因为在阎东升身边，他有了一种全新的感受。


    了解阎东升的人，会把他看作一位“很另类的商人”。他从不讲究吃，也不讲究穿，不嗜烟酒，不近女色。由于身体的原因，他在饮食上有忌口，所以日常所选择的都是些最平常最简单的食品。酒更是一滴不沾，如有必须得参加的应酬宴请，他都是以茶代酒。事实上，他平常也极少应酬。


    生长在城市的他，却喜欢住在宁静自然的乡村，但毕竟要做事业离不开城市，所以他的居住地大都选在市区边缘那种类似农村郊区的环境，租一处村居院落，那里既是他的住所，同时也是公司的总部。在阎东升的概念中，家就是办公室，办公室就是家。他睡眠不好，喜欢清静，城市的喧嚣会令他无法成眠。然而他的头脑却难得清静，他几乎每时每刻都在考虑项目的进展，谋划公司的未来，每天都和身边的幕僚开会讨论，谈思路、想点子、出主意，往往一次就到后半夜。一位了解阎东升的某企业老总曾这样说，我从未见过像阎东升这样的商人，生活上的需求从不考虑，可每天除了工作还是工作，几乎每分每秒，全部身心都投人到事业上。也许真的没有他干不成的事，这样的人，也永远不会被对手打败。


    其实，无论是顺境逆境，正处于事业的顶峰还是谷底，对阎东升而言都没有什么两样，因为他的生活方式和生活态度丝毫不 变，依然如一。


    这样的俭朴、简单的生活放到普通百姓身上，当然是再平常不过的，但要是摊一个企业资产上亿元的富商身上，就绝非一个“节俭”所能概括'
