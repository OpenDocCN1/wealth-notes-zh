- pgno: 248
  md: '通过金正喜，林尚沃彻底领悟了石崇大师留给自己的“死”字的涵义，也就再也不必为北京商人们的联合抵制而操心，每天只是专心陪同金正喜一道走访北京的学者们。见东家这种态度，朴钟一心急如焚。他一有空就来找林尚沃，可林尚沃却经常杳无踪迹。


    朴钟一清楚地知道，北京商界的气氛已经变得颇不寻常，大有凶险，因此，他整天提心吊胆，火急火燎。北京商人们已是群情汹涌，照这样下去，他们作为商人而破产自然难免，恐怕要活着离开北京也很成问题。


    好不容易才找到林尚沃，朴钟一问：

    “这些天，您究竟在做什么？”费了好多周折才得以见面，却发现林尚沃的态度居然非常安适、泰然，朴钟一备感不可思议，“怎么找都找不到您，连打个照面都这么难。”

    “我们这不就打了照面吗？你看，我们这不是很好吗？”

    “大哥，”朴钟一抓住林尚沃的手，“您这究竟是想怎样？到离开北京只剩10天的时间了，难道您不知道再过10天我们就得离开北京了吗？”

    “我当然知道。”林尚沃微微一笑。

    “可是，您知道现在北京商界正在发生什么事情吗？”

    “不……不晓得。”

    “大哥刚重新出了告示，北京商人们就来，可人家看过后都吐着唾沫骂您‘鬼子’呢！”

    “鬼子？我不是鬼子，他们才是鬼子。”林尚沃笑着说道。

    “您以为就这些吗，他们还骂您是‘偷儿’。”

    可是，林尚沃却丝毫不为所动。莞尔一笑，他对朴钟一说：“你回去，莫担心。痛痛快快去喝酒吧，再找个中国女人乐上一乐。”

    知道朴钟一嗜好女色，林尚沃便拍拍他的肩膀，然后又说：“他们马上就会回到他们曾经破口大骂的那个地方，口口声声‘大人大人’地叫着求我们宽恕的，这个时刻就要到了。”说着，林尚沃又掏出一把零钱掷到'
