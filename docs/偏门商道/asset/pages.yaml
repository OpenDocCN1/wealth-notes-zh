    商道


    在一般人眼里也看不起眼、甚至被视为“小儿科”的致富项目，缘何在陀尔夫里能变成疯狂市场的利润、瞬间给他带来巨大的财富？他又缘何将自己这种的盈利模式归为“偏门？。'
