- pgno: 223
  md: '奎章阁，尽情披览那里的藏书，学问大增。尤其是，自从有机会来往于朝鲜王朝与大清朝之间后，他成为一名实学派的先觉者，撰写了《北学议》，在书中宣传实学思想，主张“要打破身份差别，鼓励工商，使国家富强，百姓生活水平得到提高，当务之急乃接受清朝先进文化”。


    金正喜自 15 岁那年起开始师从朴齐家，接受他的思想熏陶。正如朴齐家所发之弘愿，在他的教导下，金正喜终有大成。朴齐家一生中曾四次到过北京，他的实学思想即是萌发于在北京所学到的知识，并逐步发展成为一个思想体系。


    作为朴齐家的弟子，金正喜也一直渴望着能够像自己的导师那样，远赴北京，体验并学习那里的新学问。


    尤其是，四年前，作为导师的朴齐家受人诬告而遭到流放，并于 1805 年悲惨地结束了自己的一生。此后，金正喜的胸中一直燃烧着一股火热的激情，发誓要沿着老师的路走下去，到北京去继承《北学议》之遗业。


    对于金正喜，林尚沃当然也有所耳闻。终生经商的林尚沃，对于大学者金正喜，有一种由衷的尊敬。虽然论年龄金正喜比自己要小七岁，只能算是一个小老弟，却是林尚沃内心尊敬的惟一书生。


    # 蓄势待发的商战


    关于生具异禀、被称为神童的金正喜的传闻，林尚沃耳熟能详。


    朴齐家看过年仅六岁的金正喜的书画后拍岸叫好、赞不绝口的事情，曾在京城被传得沸沸扬扬。但让金正喜更为出名的是文章大家、朝鲜王朝名臣蔡济恭。早年曾被英祖盛赞为“真肤无私之臣下，汝（正祖）耿耿之忠臣”的老宰相蔡济恭，有一天从金家的门前经过，看到大门上挂着一幅字：


    “立春大吉”


    这是一种为迎春而挂到门前的立春帖。尽管那只是四个寻常可见的'
