- pgno: 103
  md: '上正卖得火暴的时候，忽然之间节外生枝。“长城痔烟灵”的畅销，让局外的“有心人”算计上了，看到这一项目有利可图，一个香港商人找到了“长城药物烟草研究所”，花大价钱从所长这个专利人那里硬把阡东升给“挤”了下来，然后与哈尔滨卷烟厂进行合作，由烟厂生产这种添加了中药成分的卷烟，产品更名为“松花牌痔烟灵”。


    这一事故让阡东升徒唤奈何。因为当时的社会环境以及契约意识的局限性使然，合作协议被迫终止了也没有想到要诉诸法律。这之后发生的一切，倒很能体现出阡东升性格中的另一面——擅长钻研、永不服输，以及不按常规律出牌。话说合作协议被终止后，阡东升的卷烟作坊因研究所方面断了专利药物的供给，而不得不停止了生产。这时候的阡东升没有打上门去，反倒是来到了新华书店，花了几百块钱买回了《本草纲目》一共四本，然后抱回家闭门研究。此外，阡东升还委托省里的医药检验机构对剩余的药烟产品进行分析化验，以检验确定其中所含的药物成分。除了少量药物在制作卷烟时被烤焦了，以至化学分子结构发生变异而无法分析出来外，原药烟产品中的大部分药物成分都检验出来了。


    这厢在做药物成分检测，这厢阡东升也在《本草纲目》中寻找治疗痔疮的草本药方。经过好一番研究“破解”，终于确定了阡氏“痔烟灵”的药物类别和成分组合。于是，继续采购回烟丝、烟纸，并配上阡氏药方，“长城痔烟灵”又可以大量生产了。这么一生产，就是整整半年多，直到专利人和烟厂方面进行了干预。“松花牌痔烟灵”同样也没有存在多长时间，产品没卖多久，也终于在市场上“蒸发”了。


    故事很有戏剧性。面市没多久的“松花牌痔烟灵”，再次遭人.mapper，“挖墙角”的人又出现了。据说，研究所有所长经不住诱惑，又一次将港商给“挤”掉，“另起炉灶”跟别人合作另搞一产品，结果那港商一怒之下告到了政府那里去。这可是影响投资环境的恶性事件了，加上产品有违反香烟企业有关规定之嫌，政府有关部门于是介入此事。再好的产品也经不'
  merge: -1
  img_proc: true
- pgno: 104
  md: '起这么再三折腾呀，“痔烟灵”这一产品无疾而终，至今都没再生产。专利拥有者“长城药物烟草研究所”的所长遭此打击，长期抑郁，以至精神都出了问题。这一结局，的确令人唏嘘。无论如何，“痔烟灵”确是一个好产品，阮东升一直不愿就此放弃。


    为此，他将目光投向了当时刚建省不久的海南岛。海南作为新兴的特区，是不是在卷烟企业的体制方面稍微松动一些？为了让“痔烟灵”能重新找到正规企业合作伙伴，使这一产品不至于就此终了，阮东升让弟弟阮航和母亲，由郑文滨陪同着，一道前往海南考察，寻找机会。三人在海南住了半年时间，事情最终没有办成。如果说海南之行还有什么收获的话，那就是郑文滨。


    在海南期间，郑文滨结识了一位医药行业的实业家，对方力邀郑加盟。于是郑文滨利用在阮东升那里学到的广告投放及策划营销手法，勤奋加上精明，将一种治疗心脏病中药的市场销售，创下了8000多万的利润，从而在业界一举成名。退出了阮东升的企业后，郑文滨确立了自己专门从事商业销售代理的事业发展方向，后来，在黑龙江博得了“销售大鳄”的美名。相对于阮东升的起伏跌宕、坎坷波折，专职从事规范商业活动的郑文滨直至今天各方面都十分平顺。这其中，行业选择对一个商人的重要性，不言而喻。


    从某种意义上说，阮东升可谓是郑文滨商业人门的领路人，郑文滨更是商业操作中威力巨大的“阮氏战法”的借鉴者和受益者。


    尽管离开了阮东升企业独闯江湖，但郑文滨一直是阮东升最要好的朋友，他曾多次劝说阮东升及早放弃偏门的行当和思维模式，不过，这样的劝说阮东升听得进去，已经是好几年后的事情了。'
