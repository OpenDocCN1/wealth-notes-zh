- pgno: 175
  md: '作用，带领学员们完成每天的5公里越野跑和其他的户外拓展训练。


    尽管很多拓展训练的内容是以游戏的形式来进行 的，如信任背摔、“万里长城永不倒”、“阴阳扣”等等，但一些项目还是十分考验人的自信心和意志力，必须要有吃苦耐劳精神和团队意识才能完成。


    每天5公里的越野跑就极为消耗体力，要有很好的耐力方能坚持下来。身着迷彩服的学员们高唱着《红埔之歌》——“红埔的队员亲如兄弟，理想把我们召唤在一起。你追求卓越，他渴望崛起，我们合力奋战到底。自强不息！自强的人们团结在一起，把我们建成一个钢铁集体，嘿！钢铁集体！”
    每个人都咬着牙穿行在原野上，不顾脚上长满血泡，互相之间鼓励着，跑在前面的帮助落在后面的，直到大家一起到达终点。也正是因此这种训练，使学员们在磨练中体会到团队的力量和集体荣誉感，并由此结成一种牢固的友谊，这种友谊让他们从原来的彼此陌生而变为熟悉亲密，从而凝结成像战友情般的情感，这种情感，大家即使走出“红埔”后仍十分珍视。


    “红埔”在培训中还引入了“魔鬼训练法”，当然这些项目的内容与日本人大江白内城创立的“魔鬼训练”相比，从时间长短到强度大小都是不可比拟的，但其目的却是一致的，那就是要让人学会具备克服艰难，勇于挑战极限的勇气。


    日本“魔鬼训练”中的“吠野狼”训练，最终使受训者大冬天可以赤身坐在雪地里；夏天的“瀑布神”训练，让受训者在瀑布边接受太阳暴晒。由于条件关系，无法进行“吠野狼”训练，“红埔”的教官就选酷暑天和学员们一起在操场上静坐，接受烈日的暴晒，谁也不许动一动。


    当然最严酷的还是两天一百公里的急行军训练，锻炼磨砺学员们体能、毅力和品质，行军过程中有时烈日当空、酷热难耐，有时是风雨交加、电闪雷鸣，几乎每个学员的脚下都起了血泡，而且极度疲惫，但每个人都坚持下来了。“红埔”的理念是，商场如战场，一个人如没有过硬的'
  merge: -1
  img_proc: true
- pgno: 176
  md: '身体素质和意志品性，很难在竞争残酷的现实商战中能坚持到最后而不轻易放弃，并最终获得成功。


    每一次训练科目的完成，尽管都精疲力竭，但学员们心里却充满了喜悦和自豪，大家会发现，其实只要不断发掘，身势的潜力是不可估量的。


    “红埔”有一项训练内容是驾驶，那也是唯一由阮东升董事长亲自主持主讲的课程。尽管阮东升对车辆非常熟悉，驾驶技术也很好，但这显然不是他情愿在繁忙的商务中抽出宝贵的时间来教学员们开车的全部理由。


    也许一般人是闻所未闻，阮东升给学员们学习驾驶用的竟然是两辆奔驰轿车，其中一辆就是他自己最喜欢的黄色奔驰 SLK型小跑车。练习场边一些观看的群众有时也会咋嘴咋，世界上哪有人用这么好的车来做教练车的？


    绝大部分学员都没开过车，这么昂贵的名车更是逢碰都没碰过，更别说能亲自上去驾驶了。许多人第一次坐进奔驰的驾驶室操作都好不紧张， Track手足无措。阮东升却是十分地耐心，逐一给他们讲解原理，手把手地教他们操作，然后就坐在副驾驶室的位置陪这些学员在练习场上绕圈。由于学员们不熟悉车况，做“教练”的还得万分小心，提防他们一不小心撞上电线杆或冲上台阶。每期三四十名学员，得陪着他们每人绕好几圈，还真不是个轻松活。有时在夏天的烈日下一折腾就是一个下午，这对身体情况本来就不是太好的阮东升而言，得遭多大罪就只有他自己知道了。


    当然，用奔驰轿车给学员们练习驾驶，并不是为了让他能考回驾照，“红埔”每期的所有培训时间只有一个多月，学员们学习的科目和内容都很多，而学开奔驰，对学员们来说最重要的是收获一种驾驶的感受，当然不光是驾驶世界名车的感受，还有对经过努力、事业有成后自我价值实现的一种期待。


    而阮东升的想法就简单得多，他心底里只是希望学员们在多年以后还能记得，自己第一次学开车是“东哥”教的，并因此留下一份美好的回忆。'
  merge: -1
