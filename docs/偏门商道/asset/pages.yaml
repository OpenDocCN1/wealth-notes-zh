- pgno: 244
  md: '写的是‘天下太平’四个字。那时，先生已是78岁高龄，所刻文字小如蚂脚，先生却ồi眼镜也没有戴，真是件教人惊异的事情。”


    与翁方纲的初次见面时这令人吃惊不已的场景，记载于金正喜一篇叫做《古人书法论》的文章里。翁方纲在芝麻粒上镌刻“天下太平”四字，是一种与佛教颇有渊源的行动。他虽是一时巨儒，却醉心于佛。佛教《维摩诘所说经》说“以须弥之高广内芥子中，无所增减”，而翁方纲正是用自己的行动向人们示范这句语的涵义。


    佛教认为须弥山位于世界的中心，而关于。“以须弥之高广内芥子中，无所增减”，有一个著名的传说故事。


    唐朝学者李渤酷爱读书，因其涉猎书籍逾万，人称“李万卷”。有一天，他问智常大师：

    “大师，《维摩经》说‘须弥入芥子中’，可是那么大的一个山怎么会容在一个小小的芥菜籽里呢？”

    ‘智常大师马上回答他：

    “李渤呀，人们不是称你为李万卷么？那么，你又是如何将那万册书卷放进你那小小的脑袋里去的？”


    初次见面就看到老师翁方纲在芝麻粒上镌刻“天下太平”四字的秋史金正喜感触良多。从这些感触中，诞生了金正喜被称为“秋史体”的独特书法。集汉隶之长，他创造出独树一帜的秋史体。后来，有人问金正喜：“先生是怎样创出秋史体这种独特的笔法的？”


    金正喜则答道：“如果不是胸中有万卷书、腕下有三百碑，这是无论如何也做不到的。”看到老师翁方纲在只有芥菜籽大小的芝麻粒上镌刻“天下太平”四字的情景，金正喜联想到中国唐朝李勃读书破万卷被称为“李万卷”的故事，从而彻底感悟到，如果自己不能做到胸有万卷书，是不可能达到“须弥山存于芥菜籽”的境界的。正如金正喜自己所言，如果不是读了万卷书在胸，如果不是曾反复练习《汉隶字原》中收录的中国汉'
