- pgno: 79
  md: '说到这里，不能不提到一部名叫《公关小姐》的电视连续剧。许多人也许还记得，这部电视连续剧当年播出的时候是万人空巷，轰动一时。


    由萨仁高娃等主演的这部 22 集带有浓郁“广味”的主旋律电视剧，是大陆最早的反映改革开放、反映公关行业的电视连续剧，据说也是最早反映女性和女性群体生活的电视连续剧。《公关小姐》1989
    年在全国播出后，也许连电视剧的所有主创人员都意想不到后来会产生这样一个效果：一部戏让一个行业开创出一个时代。《公关小姐》仿佛是一剂“催产素”，各地纷纷仿效，纷纷上马，各类公关机构如雨后春笋般蓬勃生长，不少城市相继成立了公关协会，企业成立了公关部，一时间，大江南北“公关”成了最时髦的词汇，《公关小姐》则几乎成为了相关行业的“教科书”。


    伴随着张咪演唱的那首主题歌《寻梦》，“是梦啊不是梦，那秦时的明月那汉时的风，是梦不是梦，望断了关山万千重，望断了关山万千重……。”全国人民都在电视机前随着剧情的起伏跌宕，接受着公关的“启蒙”。那些年，电视剧的导演和剧中的演员更是频频被邀请参加全国各个城市的公关比赛，担任嘉宾或评委。


    有人说，《公关小姐》至今依然是中国大陆公关课上经典案例。而在许多年以后，《中国公关大事记》是这样评价的，“这是我国首次将公关职业形象搬上荧幕，该剧在全国播放后，影响传递到千家万户，使公共关系为亿万中国人民所知晓。”


    那时候的社会渴望富足，希望改革，人们被每天都在层出不穷的各种新事物翻搅得激动不已，以至眼花缭乱，应接不暇。


    当时阮东升的北光公司上上下下对唐迎滨有关成立公关公司的提议，没有太多的反对意见，尽管谁也没有操作过，没有任何经验可循，甚至那个时候也没有谁能真正理解和认识公关的真正内涵，要知道，中国内地第一个公共关系民间团体——广东公共关系俱乐部是在
    1986 年 1 月成立的，而中国公共关系协会 1987 年 6 月也才在北京成立，公共关系在中国刚刚得'
  merge: -1
  img_proc: true
- pgno: 80
  md: '到了正式确认和接受。但缺乏经验显然并不能妨碍这群年轻人干劲十足，激动人心的尝试。这件事情做好了，前景谁又能预料呢。


    他们的初步设想是，招50名公关小姐和50名公关先生，经过培训后给各大企业、公司做礼仪小姐、先生，或者广告模特，总之就给客户一种形象宣传上的服务。那个时候在中国可还没有夜总会这些东西，无论是公关小姐还是公关先生，在业务设想上都是很正的，没有人会想到其他的方面。


    当然，如今公关已发展成为一种智力产业，公关服务开始系统化、立体化，诸如客户整体形象的定位、策划、传播实施等等，横跨广告、CI、营销等领域。但那时候的公关更多还是形象宣传、社会关系勾兑这些业务，不过，就是这种“笑脸相迎”式低层次公关，在当时中国的企业界、商界仍是普遍缺乏的。阮东升觉得成立公关公司的方案可行，于是拨出资金，放手给唐迎凌等人去操作这个事情。


    公关公司成立那天，鞭炮齐鸣、锣鼓喧天，因为“北光公司”毕竟是一个“红帽”公司，如今又开展了新兴业务，南岗区工业局的领导都来出席公司的成立仪式，表示一种关怀和支持。整个公司成立仪式很是隆重、热闹。


    与此同时，在《哈尔滨晚报》上登出的一方小小的广告的广告，居然也引起了人们巨大的关注。这则只有火柴盒大小的广告上没有任何的花式设计，只是简单地写上“北光公关公司成立，并招聘有志从事公关工作的男女青年各50名”这样的内容。然而，谁也没想到这则小小的广告，带来的直接效应竟然是3000多人前来公司报名！报名现场可谓是人山人海，摩肩接踵。


    也许真的是公关小姐、公关先生，这两个名词太新颖、太有吸引力了，公关的职业似乎是意味着一种时尚、高雅、现代的生活方式，哪能不让众多的男女青年着迷呢？说起报名时的盛况，公司当时一位负责接待工'
