- pgno: 45
  md: '和 母亲一起开办服装培训学校之前的阮东升，曾自己做过许多创业的尝试。


    离开单位后，他最先做的事情是赶紧到邮局订了好几份最有实用价值的报纸，因为离开收发室，损失最大的倒不是丢了一份工作，而是失去了一个巨大的“信息资源库”。对阮东升来说，报刊上来自各地的大量的最新创业致富信息，是支持他创业的无穷无尽的“宝藏”，一旦没有了这些信息来源，人就如同瞎子一样没有了方向和判断力。对信息的重视程度，是阮东升异于常人之处，当然更是他的一个过人之处，因为这能使他在后来的创业过程中，比别人站得更高，拥有更开阔的视野。


    事实上，阮东升在辞职之初寻找创业项目的过程并不顺利，经验不足，对市场把握不准，因此一些项目真正操作起来结果往往事与愿违，屡屡受挫。而阮东升比别人多了一份韧劲，不怕失败，跌倒了重新站起来，向着目标继续前行。


    创业之初的阮东升到底曾做过多少个致富小项目，也许连他自己都记'
  merge: -1
  img_proc: true
- pgno: 46
  md: '不清了。他尝试过很多个养殖项目，甚至还加工过儿童玩具、工艺品，不过，说道种蘑菇，他的心底一定会泛起对往事的回忆，带着一些苦涩的味道。


    在当今人们的餐桌上、食谱里都不难见到食用菌，且不说品种多样的食用菌所含的丰富的营养元素，单说这种绿色食品烹煮时的鲜美味道，已经足以让人喜爱有加，成为市场上的抢手货。不过在20年前，当食用菌摆在菜市场上的里，尤其是北方城市的市场上了，能够接受它的人还极少。也许在人们的思维中，蘑菇只是山野里生长出的“土特产”，极少有人吃到过，而没有养成烹煮食用的习惯。所以当阮东升曾经满心欢喜地将经过千辛万苦才培植出来的食用菌带到市场上叫卖的时候，那种无人问津的惨况，让他第一次尝到了市场的无情和残酷。我们可以设想一下，如果不是时空“错位”，阮东升将后来广受欢迎的食用菌推向市场的时间提早了十几年，那么，他肯定会取得成功，说中国会因此多了一位“食用菌专业户”或者“蘑菇大王”。


    现实生活当然是不会存在假设的，也许，上天是想在阮东升取得事业成功之前再给他一些考验和磨砺。


    阮东升是看到了一个食用菌种厂登在报纸上的广告后，动了搞食用菌培植的念头的。那家工厂位于哈尔滨郊外，阮东升交了两百多块钱的技术转让费后，每天骑着自行车赶40多里地去学习食用菌栽培技术，其中的辛苦自不必说。


    学到了技术，就开始自己实践操作了。买菌种得掏钱，10块钱一碗，而培育食用菌还需要使用大量的宽口玻璃罐头瓶，为了节省手头已经不多的资金，阮东升没有在菌种厂花钱买现成的罐头瓶，宁可辛苦一些自己到处去搜集。


    在搜集玻璃罐头瓶上，他动了脑筋。当时，北方市场上水果品种很少，亲朋好友们去探望生病住院的病人，都喜欢拎上几瓶水果罐头送去，'
  merge: -1
  img_proc: true
- pgno: 47
  md: '那就是最得体、最上档次的礼物了。因此，在各大医院的住院部，一定会有许多别人吃完罐头剩下的空玻璃瓶子。于是，阮东升每天骑车往返于各大医院的住院病房之间，向病房里的护士买，一、两分钱一个，有时好心的护士还会多送几个给他；看到墙角边有别人丢弃的，就捡几个。就这样造买带捡，阮东升花了几个月的时间才攒足了必需的
    2000 多只空玻璃瓶子。


    在那段日子里，阮东升异于城市同龄人的超常忍耐和吃苦的品性就 kors 露出来了。由于自己钱不多，又没有了工作，而家里经济也并不宽裕，为了创业，他每天中午都舍不得花钱买吃的，饿了就啃从家里带来的冷馒头对付过去，而满城市地东奔西跑搜集罐头瓶子可不是件轻松的活。跑了一天将收集到的瓶子装成两个麻袋，然后在自行车的后架上绑上一根木条，把两个沉重的麻袋栓在木条的两端固定好后，便在傍晚的余晖中吃力地骑着车回家。日复一日的辛苦拼命，加上营养不良，几乎弄垮了阮东升本来就单薄的身体，给健康带来了巨大的隐患，阮东升为早年创业的艰苦付出了巨大的代价。


    有了玻璃瓶子后，阮东升又买回大量的麦麸、稻壳作食用菌的培植基。这些培植基需要消毒，怎么办？阮东升就用家里唯一的一个小高压锅来对麦麸、稻壳进行高温蒸煮。就这样一锅一锅的蒸煮完后，才装进宽口玻璃瓶中，最后就是细心地撒种。全部工序完成后，在阮家的楼顶天台上，就整整齐齐地摆放了
    2000 多个培育食用菌的玻璃瓶子，蔚为壮观。


    本来就不是十分宽敞的家成了食用菌培育场，看到儿子这么折腾，阮东升的父母表现出了一种难得的宽容和支持。无论儿子能够成功与否，毕竟他这是在用全部的心力为自己打造未来。父母无言的爱，就是支撑着阮东升勇敢地走下去的源源不断的动力。


    食用菌的生长，需要条件颇为苛刻，温度最好是摄氏 20 度左右的恒温环境，而且到出蘑菇的时候需要早上冷晚上热，一冷一热的刺激，蘑菇'
  merge: -1
  img_proc: true
- pgno: 48
  md: '才容易长出来。


    希望，焦虑，忐忑不安……日子在等待中一天天过去。在第29天的时候，终于在菌堆上看到白色的蘑菇头一个个地拱出来，鲜嫩鲜嫩的，充满着生命力。经过了多少辛苦，食用菌终于培育成功，阮东升别提有多高兴，他悬着的心终于放了下来，觉得自己的一番劳碌和付出总算没有白费，那份欣喜，极像少年时期亲自动手做出了仆航模，充满着自豪。


    蘑菇在一天天长大，阮东升把大个的小心翼翼地采下来，先是自家尝个鲜，素炒蘑菇，吃起来很是鲜香，口感挺好，于是他对能在市场上卖个好价钱，充满信心。


    蘑菇又长出一茬，阮东升采下装到一个竹筐里，满满一筐足有三、四十斤。在菜市场里没有摊位，阮东升只能在菜市场边缘的空地上摆卖自己的那一筐蘑菇，站累了蹲下，蹲累了站起来，可无论怎么吆喝叫卖，市场上买菜的人一个个从面前走过，偶而有问价钱的，一听三块钱一斤，人家干脆扭头就走。到后来，想免费送给人家品尝，都没人愿意，有的人甚至还说：“这东西古里古怪的，谁敢吃啊！”


    阮东升很沮丧，真的很沮丧。天色渐渐晚下来了，塑料袋子里的蘑菇已失去了光鲜和水分，显得那么干瘪发蔫。


    这是他创业的第一次受挫，市场似乎在无情地嘲弄一个初涉商海的新手。自己辛辛苦苦培育的蘑菇还在一茬茬地长出来，却无人问津，心血白费了，还耗费了自己本不充裕的资金。阮东升记不得当天自己是怎么骑车回到家的，只记得一路上刮着好大的风，他的身上感到阵阵寒意，好冷啊！


    那一年，也许是过于辛苦劳累，几乎很少生病的阮东升病倒了，在住院期间，检查结果是患上乙肝和严重的胃病。


    创业的代价太大了，还没有收获到成功就透支了健康，阮东升有些茫然，明天的出路到底在何方？'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 第四章 | “第一桶金”

    The First Pot of Gold'
  merge: -1
  img_proc: true
- pgno: 50
  md: 在那个大写的 1987 年，聂东升的“沈永香货专”一直书写了将近一年才进入了尾声。按照今天时髦的说法，他在这一年捡到了人生的“第一桶金”，迅速实现了原始的资本积累。对于他而言，也从完成了自己社会角色的选择和自身取向的认定。
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 1 1987 年对阎东升来说是很有特殊意义的一年。


    那一年，幸运之神向他展露了微笑。尝过了许多创业受挫的苦涩滋味后，阎东升终于抓住了 个机遇，敏捷地纵身一跃，稳稳地坐上了开往成功的财富列车。


    在阎东升的记忆里，那一定是激情四溢、充满豪情的一年。一切都是那样的风生水起，周围的一切都在发生变化，有时连自己也想象不到。


    不过，在获得成功之前，上苍仍不忘记给他足够的“考验”。


    离开单位的收发室后，阎东升至少尝试了几十种致富项目，不但无一成功，还折进去所有的老本，那时候几乎是身无分文了。


    这种情形下，他还是如常地到处寻找项目，不轻言放弃。一次，他看上了一个聚乙烯塑料发泡技术，也就是制作海绵的工艺。当时有一个原籍哈尔滨的澳大利亚华人回国投资创业，厂子就设在哈尔滨市郊。这位后来阎东升得知他的名字叫王克强的海绵老板，对外出售的就是设备和技术，每套设备三到五万元钱不等，买了设备就附送塑料发泡技术，制造海绵。


    别说三五万，那时候的阎东升一番折腾下来，恐怕连三五百块都拿不'
  merge: -1
  img_proc: true
- pgno: 52
  md: '出来。十分看好这个项目，很想能买下设备，可是又没有钱，怎么办？


    这个时候，阮东升居然想出了这样一个“办法”——那是典型的“阮民风格”，说起来还真的有些哑人听闻：他竟然想到要“制造”一场交通事故，让厂长的车子把他撞伤，然后既不报警也不追究责任，只要厂长能给他一套制造海绵的机器。


    他已经知道那个王老板开的是一辆丰田海狮面包车，于是就跟弟弟阮航商量这事。弟弟一听哥哥这主意，惊得眼睛瞪得老大，连连说你简直是疯了。


    阮东升没办法，只好跟弟弟讲了一个他在 Codes—上看到的故事：


    上世纪60年代，战后的日本百废待兴，全社会弥漫着一祁不顾一切、奋发创业的氛围。


    那时候日本的啤酒在世界上毫无名气，因为技术工艺落后，口感平平，口碑也不行。而当时世界上最好的啤酒是丹麦产的，丹麦啤酒酿造历史悠久，工艺十分先进，同时技术也是保密的，根本不可能让亚洲人，或者日本人学去。如果要进行技术转让谈判，又需要巨额的资金，这也是刚战败的日本无法支付得起的。


    于是，日本的一家啤酒厂的年轻企业家开始苦苦思考，该怎样才能将丹麦的啤酒酿造技术学到手。


    这位企业家想出了一个主意，他来到了丹麦，在那家啤酒公司 blow-进行了一番了解后，便装扮成一个流浪者，天天在该啤酒公司的大门外徘徊守着。一天，公司老板那辆奔驰轿车驶出了大门，这个日本人突然从旁边闪了过来，迎上去，只听到“砰”的一声，日本人被车子撞个正着，腿也折了，倒在地上动弹不得。丹麦老板下车一看，吓了一跳，忙将伤者送到医院去。


    日本人的腿渐渐好了，丹麦老板问他有什么要求，日本人说，我是个'
  merge: -1
  img_proc: true
- pgno: 53
  md: '背井离乡的人，在这里无亲无故，只求能有一份工作糊口就行了，哪怕是看大门。


    于是日本人就得到了他的第一份工作，那就是在啤酒公司看大门。他一干就是三年，员工上下班进进出出的，都跟他非常熟了。到了第四年，他的工作环境就一点点地进入了啤酒酿造车间。因为有了便利的条件，那一年里，这位日本人把车间里的所有东西都学会了。


    不久后，日本人忽然神秘“消失”了。


    他回到了自己的国家，开始大展拳脚，将从丹麦学到的技术全部运用到自己的企业中。经过几年的奋斗，他终于把企业做成了日本最大的啤酒生产厂。这家啤酒厂，就是日本著名的朝日啤酒公司。


    阮东升的弟弟听了这个故事后，不吭声了，他一时找不到理由去反驳哥哥，只能忐忑不安地跟着哥哥，学着那个日本人的样子，来到海绵厂的门外蹲守。


    就这样，“鬼迷心窍”的阮东升在那个厂子的门口蹲了几天，试图在拐角处冷不防迎上去，然后造成车祸。可是那个时候马路上车子少，不堵车，海绵厂老板的面包车每回都是快速驶过，绝尘而去，想追都追不上，而阮东升又不能迎面直直朝车头撞去，这样别人一看就知道其中“有诈”。海绵厂老板没给阮东升任何机会。


    阮东升在“遗憾”中只能另找项目。


    于是又是不断地翻找报纸，细细地斟酌上面的每一条信息。这时，一条洗衣粉制作的信息引起了他的兴趣。他觉得这样的项目也挺好的，不亚于制造海绵那个。


    今天看来，阮东升居然为了由于以为一台设备、一个项目，竟愿付出如此大的代价，简直是匪夷所思。最后所幸是他后来又看上了别的项目，否则不可想象今日瘸着一条腿的阮东升会是个什么样子。当时阮东升的疯狂想法，'
  merge: -1
  img_proc: true
- pgno: 54
  md: '现在听来会有几分荒唐甚至荒诞的味道，不过也可让人从中体察到，阮东升当时欲寻找一次成功的心情是多么的急切。


    说到洗衣粉这个项目，就不得不说到一个名叫任力伟，只比阮东升大五岁的年轻人，他当时是一个国营工厂的一个小干部，手头负责的正是那个洗衣粉项目。


    阮东升看了广告后，找到了任力伟，跟他详细地谈了这个项目。谈着谈着，两个年纪相仿的年轻人简直是一见如故，一下子就熟悉了。不知怎么地，阮东升一不小心说起了那个海绵项目，还说了自己想“制造车祸”的举动。任力伟一听，先是大骇，继而十分感动，有些佩服阮东升这股子劲头。


    他想了想，看着阮东升这样说：“用缺这套设备生产出来的东西，你是挣不着钱的，因为这种洗衣粉质量不是很好，跟正规大厂家的产品还是没得比。你要想挣钱，就必须得跟我一样，卖洗衣粉的制作设备和制作技术，而不要卖产品。”


    阮东升听了点了点头。


    任力伟的项目虽然是专利技术，但实质上原理很简单，技术含量很低 basically就是一台安装了小马达的小型搅拌机，然后将十二烷基磺酸钠、硅酸钠、铁酸钠、元明粉等几种化工原料进行混合搅拌。


    由于市场日趋饱和，竞争激烈，到1987年的时候，阮母开办的服装培训班生源日渐减少，逢原先培训班的学员毕业后都出去办培训学校了。于是，阮东升便利用服装培训班的原有场地，另办了一个“中山农民致富技校”，专做洗衣粉项目。


    在整个八十年代，经济的复苏凸现了全社会的商品匮乏，尤其是轻工日化产品的严重短缺。在那时候百货大楼里的商品都是凭票供应。许多产品供不应求，彩电、风扇这类商品甚至脱销。国家此时正在努力调整产业结构，以适应国民经济的需求，而另一边是庞大的市场正亟待各种产品的'
  merge: -1
  img_proc: true
- pgno: 55
  md: '有效填补，这就形成了一个巨大的商机，谁手头上有产品，就意味着谁就能够赚到钱。


    1987 年春，阎东升和弟弟，以及在服装培训班结识的朋友杨洪春、徐向东等人开始忙碌了起来。


    这项洗衣粉制作技术和设备转让项目所带来的商机，使阎东升获得了意想不到的成功，更赚取了商业生涯的第一桶金。


    当然，取得这样的成功并非是以简单复制的方式再进行技术转让，阎东生之所以能把不起眼的洗衣粉技术转让，做成让自己通向财富之门的出色营销行为，自有其取胜的“独门法宝”。


    这个“独门法宝”就是有效和强有力的广告宣传推广，而这也正是他此后屡试不爽并运用娴熟的“营销利器”所在。


    这一切其实，都得益于阎东升在单位收发室时的经历。


