- pgno: 232
  md: '王造时的话并没有到此为止。


    “如果说他们订下了联合抵制的盟约，那么他们究竟有什么样的企图？”朴钟一急三火四地问，“究竟他们想干什么？”


    “商人们的要求很简单，”王造时的答复异常简洁，“商人们要求林大人降价到以前的水平。”沉默，死一般的沉默。沉默片刻，林尚沃开口道：“倘若我拒绝这个要求的话……。”王造时马上回答：“那就难说了。大概林大人会在北京会连一斤人参也卖不出去的，最终只好把带来的5000斤人参原封不动地运回朝鲜。”


    王造时转告的实在是一个沉重的消息。


    这几乎就是一个要求无条件投降的单方通告。不是通过价格谈判重新协调公告价格，而是直接单方面要求接受原价，这里面的意思很明显，就是要林尚沃跪起自端首称臣，倘若林尚沃回绝这个条件，他们就会停止一切交易迫使林尚沃把带来的人参原路运回。这就意味着林尚沃将破产倒闭，被永远赶出北京商界。而这一旦成为事实，林尚沃从此在北京商界就会再无立足之地。


    # 孤立无援的巨大危机


    “我说王大人，”意识到事情的紧迫性，朴钟一拍着王造时的肩膀说道，“我们不是还可以靠王大人出面去说服他们嘛！王大人和我们不一样，您是中国人，您可以去见那些同样是中国人的商人们，敞开胸襟去劝说他们，让他们回心转意嘛！”


    朴钟一说的是实话。王造时乃是北京头号中药店的掌柜，在药材商中算是最有影响的头面人物，如果他能够出面说项，肯定可以让很多商人改变念头。


    但说到底，王造时也不过是一介伙计，表面看上去他是同仁堂的东家，实际上同仁堂真正的东家是张美龄的丈夫、光禄大夫周炳成。'
