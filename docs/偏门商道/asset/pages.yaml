    “怎么？这么快就忘了？我不是曾经出过一道谜语，让人猜每天出入崇礼门的人有多少吗？我还说过，谁猜到了这个谜语，我必有重赏？”


    “是的。”


    “猜中谜语的只有你一个人，我不是得按照我许下的诺言给你施赏吗？”


    “谢大人赏赐。”


    朴宗庆问：“说说看，你想得到什么样的彩头？”


    朴宗庆也看穿了林尚沃的心理。如果说林尚沃是一匹名马，那么识得这匹名马的朴宗庆也总是一员名将。透过那张空白银票，他已经洞察了林尚沃那颗卓尔不凡的心。


    林尚沃这才对朴宗庆开了口，坦率地告诉朴宗庆，过去人参买卖是自由的，可从现在开始朝廷就要公布实施交易权制度，让少数几个个人垄断人参交易，而自己如果能拿到这个交易权当再好不过了。


    人参交易权。


    朝廷开始实施这种人参交易权制度，是缘于正祖宋年一位备边使的'
