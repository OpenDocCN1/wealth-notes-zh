- pgno: 15
  md: '# 四季清补滋润汤


    # 主要食材


    +   - 汤料: 淮山、芡实、杞子、红枣、虫草花、党参、莲子、无花果和百合。


    +   - 适合搭配的主食材: 鸡、排骨和龙骨等。


    ![](img/187b0b54a38901ca49e3150cdfc1703e_15_0.png)


    # 做法步骤


    +   1. 将主食材清洗干净，并斩大件。


    +   2. 将主食材焯水，期间撇去浮沫，焯水完毕后捞出洗净，并把所有汤料都洗干净备用；


    +   3. 锅里加入适量清水，放入生姜和鸡块，大火烧开后转小火煲2个小时；


    +   4. 最后加入少许盐调味即可。


    # 营养价值及适合人群


    +   - 营养价值: 此汤能清心润肺和滋养肌肤，有清凉散热和滋补的功效。


    +   - 适合人群: 老少咸宜。'
