- pgno: 9
  md: '# 花旗参乌鸡汤


    # 主要食材


    +   汤料：西洋参、淮山、红枣和生姜。


    +   适合搭配的主食材：乌鸡、鸡、鸽子和猪心等。


    # 做法步骤


    +   1、花旗参切片，淮山削皮洗净，滚刀切块；


    +   2、主食材斩大件，加姜片放水里煮开后，捞出冲洗干净；


    +   3、将焯水以后的主食材和所有材料放进汤锅里，加入8碗清水；


    +   4、大火煮开后，继续煮15分钟，然后转慢火煲1.5个小时，放盐调味即可。


    ![](img/187b0b54a38901ca49e3150cdfc1703e_9_0.png)


    # 营养价值及适合人群


    +   营养价值：此汤有清热、解毒和补心益气的功效，多喝花旗参乌鸡汤可以达到降火、解酒清热和提神开胃的目的。


    +   适合人群：老少皆宜，尤其适合上火的人群。'
