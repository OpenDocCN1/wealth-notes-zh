- pgno: 17
  md: '# 五指毛桃茯苓汤


    # 主要食材


    +   汤料：五指毛桃、淮山、茯苓、杞子和蜜枣。


    +   适合搭配的主食材：鸭子、鸡、鸡爪、猪蹄和龙骨等。


    # 做法步骤


    +   1、将主食材清洗干净，斩成大件并焯水洗净；


    +   2、将五指毛桃、淮山、茯苓、杞子和蜜枣洗干净；


    +   3、锅里加适量清水，放入生姜，加入主食材和所有汤料，大火烧开后捞出浮沫，转小火煲2个小时；


    +   4、最后加入少许盐调味即可。


    ![](img/187b0b54a38901ca49e3150cdfc1703e_17_0.png)


    # 营养价值及适合人群


    +   营养价值：此汤有清肝降火、舒筋活络、止咳化痰、解毒消暑、益气生津、祛湿化滞和安神养颜的功效。


    +   适合人群：老少皆宜，尤其适合皮肤容易干燥的人群。'
