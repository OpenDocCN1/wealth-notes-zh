- pgno: 13
  md: '# # 清润双雪汤


    # ## 主要食材


    +   - 汤料：雪耳、雪梨干、无花果、海底椰、玉竹、百合和蜜枣。

    - 适合搭配的主食材：瘦肉。


    # ## 做法步骤


    +   1. 用温水泡发银耳1-2个小时，如果用凉水则需要3-4个小时；

    2. 将瘦肉焯水，并把所有食材洗净备用；

    3. 锅里加适量的清水，把食材全部放进去，大火烧开，后转小火煲40分钟左右；

    4. 最后加入少许盐调味即可。


    ![](img/187b0b54a38901ca49e3150cdfc1703e_13_0.png)


    # ## 营养价值及适合人群


    +   - 营养价值：此汤味道清甜滋润，美容养颜，清热降火，健脾开胃。

    - 适合人群：适合容易上火和口干舌燥的人群。'
