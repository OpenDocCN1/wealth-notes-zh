- pgno: 7
  md: '# 花胶响螺肉红枣汤


    **主要食材**


    +   ■ 汤料：花胶、响螺片、红枣、玉竹、枸杞、淮山、党参和蜜枣。

    ■ 适合搭配的主食材：猪大骨、猪蹄、鸡和鸽仔等。


    **做法步骤**


    +   1、将花胶、响螺肉提前浸泡2-5小时，淮山、玉竹和党参浸泡20分钟；

    2、水煮沸后加入主食材和姜片，再煮3-5分钟后捞水洗净；

    3、将所有食材洗净，把所有洗净后的食材（枸杞除外）和主食材一起入锅，大火煮沸后改文火煲1.5-2小时；

    4、起锅前5分钟加入枸杞和盐调味即可。


    ![](img/187b0b54a38901ca49e3150cdfc1703e_7_0.png)


    **营养价值及适合人群**


    +   ■ 营养价值：滋阴养胃，补而不燥，花胶含丰富的胶原蛋白，是美容养颜之佳品，将红枣、百合和玉竹等食材配上猪骨头或鸡，既能养颜，又能滋补。

    ■ 适合人群：老少皆宜，尤其适合孕产女调理身体。'
