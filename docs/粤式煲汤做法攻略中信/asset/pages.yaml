- pgno: 3
  md: '# 粤式煲汤简介


    # 概述


    +   粤式煲汤口味清淡，追求食材的天然本味，制作工序精细，需文火慢炖，且十分讲究食材搭配与养生食疗的功效。


    +   粤式煲汤目前的品种已超过200种，理论上所有食材都可以做成煲汤，因此其品种还在不断增加。粤式煲汤烹饪技艺代表性汤品包括七星剑花汤、花胶响螺肉红枣汤、花旗参乌鸡汤等。


    +   粤式煲汤的主要技巧包括:


    +   1、使用砂锅或者陶锅，它们的内循环性比较好，可以让食材更好的入味，还能够保证汤汁的口感。


    +   2、煲汤前鸡、鸭、排骨等主食材肉类，一定要焯水。


    +   3、水要一次性加足，小火慢炖时候不能加水，中途加水会让肉质遇冷收缩，破坏肉和汤的口感。


    +   4、不用放过多的香料、调味料和味精，放2片姜就足够了，能够让汤品尝起来更原汁原味。


    +   5、盐要等汤快煲好了再放，这样能够保持汤的香味。


    ![](img/187b0b54a38901ca49e3150cdfc1703e_3_0.png)'
