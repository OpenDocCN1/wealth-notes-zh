- pgno: 5
  md: '# # 七星剑花汤


    # ## 主要食材


    +   汤料：七星剑花、无花果、百合、陈皮、蜜枣和胡萝卜。


    +   适合搭配的主食材：鸡、瘦肉、排骨和猪大骨等。


    ![](img/187b0b54a38901ca49e3150cdfc1703e_5_0.png)


    # ## 做法步骤


    +   将七星剑花洗净，用水泡软，胡萝卜去皮并用滚刀切成大块；


    +   将主食材冷水下锅，加姜片一起煮开焯水，撇去浮沫后洗净；


    +   将无花果、百合、陈皮和蜜枣洗干净，把所有材料放入炖锅中用大火煮开，转小火煲1.5-2小时；


    +   煲好时加入适量的食盐调味即可出锅。


    # ## 营养价值及适合人群


    +   营养价值：用七星剑花煲出来的汤香甜绵滑，具有清心润肺、清暑解热、除痰止咳、滋补养颜的作用，有助于预防和辅助治疗动脉硬化、心血管疾病、肺结核、支气管炎、颈淋巴结结核、腮腺炎等。


    +   适合人群：老少皆宜，咳嗽和吸烟的人群可以多喝。'
  merge: -1
