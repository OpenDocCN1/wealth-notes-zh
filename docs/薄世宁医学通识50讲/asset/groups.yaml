  - '[PAGE 290]


    比如，**1946** 年的获奖项目是，发现用 X 射线辐射的方法，能够让细胞突变、死亡，这就是基础研究。在它的基础上，发展出了癌症的放射性治疗，简称放疗。放疗就是一项治疗肿瘤的临床项目。


    再比如，**1971** 年的获奖项目是，发现激素的作用原理，这也是基础研究。在它的基础上不断深入发展，才有了今天乳腺癌的内分泌治疗，更年期雌激素补充，前列腺癌的激素治疗等等这些临床项目。


    还有 **2008** 年的获奖项目是，艾滋病病毒的发现，这也是基础研究。找到了病毒，人类才有了后来的逆转录酶抑制剂（NRTI），以及高效抗逆转录病毒治疗的方法。今天的艾滋病病人在强效的抗病毒药物作用下，预期寿命已经接近正常人了。


    这就是医学发展的第二大特点：基础研究始终是医学研究的热点。


    # 医学研究越微观，越治本


    纵观 100 年的诺贝尔奖的获奖项目，我认为 **1962** 年是个时间节点。


    在这一年，诺贝尔生理学或医学奖颁发给了发现 DNA 双螺旋结构的科学家。虽然，当时获奖人之一詹姆斯·沃森（James Dewey Watson）后来因为发表种族歧视言论，受到了严厉批判，但他的获奖研究还是很靠谱的。


    DNA 结构的发现，给医学研究从宏观到微观带来了可能。


    近 20 年，75%的诺贝尔生理学或医学奖，颁给了基因和分子层面的微观研究。


    比如，人体生物钟的分子机制，证实只有顺应生物节律，别熬夜，才能保持健康的体魄。


    再比如，染色体和端粒的研究，证实人类的寿命极限是“写”在染色体上的。


    所有这些微观的研究，都为宏观的认知生命和疾病带来了基础。


    讲到这里，我和你分享一个令人激动的病例。'
  - '[PAGE 291]


    急性淋巴细胞性白血病是儿童白血病的一种常见类型。在以前，治疗主要靠化疗。


    尽管化疗很痛苦，但是仍然有 15%-20%的病例效果不好，会复发。


    美国女孩儿艾米丽·怀特海德（Emily Whitehead），就是这样一个反复化疗失败的例子。


    到了疾病后期，她已经走投无路了。


    这个时候，一种叫做 CAR-T 的免疫疗法出现了。


    咱们在前面的课程里说过，CAR-T 的原理就是把病人杀肿瘤的 T 细胞抽出来，在体外进行修饰，加上一个专门寻找癌细胞的“GPS”，然后，把这些加了“导航”的细胞扩增，再回输到艾米丽体内，让它们攻击癌细胞。


    生命垂危的艾米丽，在宾夕法尼亚大学（University of Pennsylvania）医院接受了试验性 CAR-T 治疗。这是全球第一例接受试验性 CAR-T
    疗法的儿童患者。


    治疗一周后，艾米丽从昏迷中醒来。奇迹出现了，她的白血病细胞消失了，至今没有复发。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_291_0.png)


    艾米丽接受 CAR-T 治疗


    前、治疗后 1 年、2 年、3 年、4 年的照片


    为什么要讲这个病例呢？


    CAR-T 治疗是由一系列微观研究促成的。包括癌症基因的研究、免疫细胞的研究、细胞表面受体的研究，以及免疫细胞如何识别癌细胞，这些都是微观研究。


    在今天，宏观的可以救命的 CAR-T 治疗，正是百年来无数微观研究的成果。'
