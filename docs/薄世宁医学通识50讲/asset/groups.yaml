    # 06｜疾病是人类进化的遗产


    2019-3-4


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    从这一讲开始，咱们说说病是怎么回事。


    你知道人类到今天可以得多少种病吗？


    到目前为止，世界卫生组织（WHO）一共收录了 26000 多条疾病的名称。


    也就是说，目前人类已知的疾病有 26000 多种，肯定还有很多未知的病不在这个疾病清单里。


    假如每天用 10 分钟讲一个病，那也要讲 26000 天，也就是 70 年都讲不完。


    所以，医学通识课讲的不是某种病的具体发病机制，而是从原理层面帮你建立对疾病的整体认知。理解了原理，也就理解了疾病。


    当你站在高处，看山脉看水系就能掌握全局了。


    这节课就回答一个问题：我们为什么会生病？


    我的答案是：疾病是人类进化的遗产。


    人类是大自然进化的产物，从地球上出现第一个真核细胞开始，大约用了上亿年的时间，一路演化，人类才成为今天的样子。


    所以，咱们的身体里处处保留着进化的痕迹，而进化却并没有帮我们消除疾病。


    比如，眼睛是这个世界上最精密的光学系统，但是它可以有 820 多种疾病。


    再比如，人这一辈子心脏可以扑通扑通地跳 25 亿~30 亿次，把血液精准地打给每个细胞。

    '
  mdcn: '

    卡特的医生立刻给他做了手术，并且开始放疗。但是，即便是这样积极的治疗，卡特这种情况依然生机渺茫。


    为什么呢？


    狡猾的癌细胞，可以逃过人体免疫细胞的监视。


    免疫细胞就是一种强大的自我修复，如果癌细胞可以逃过，那么说明这个时候自我修复垮了。


    如果不能够恢复这种自我修复，病人再怎么手术、放疗，效果都不好。


    这个病例之所以传奇，是由于卡特的医生给他用了一种药物，PD-1 抑制剂。


    简单点说，这个药就是让卡特身体内的免疫细胞，重新恢复识别和杀伤癌细胞的能力。


    也就是说，让病人重新恢复自我修复。


    4 个月后奇迹出现了，卡特总统的病灶全部消失，而且到今天都没有复发。


    2018 年 10 月 1 日，诺贝尔生理学或医学奖颁给了两位免疫学家，他们通过重新激发癌症患者免疫细胞的能力，来对抗癌症。


    从此，人类有了一个全新的癌症治疗方法。


    我认为，这个诺贝尔生理学或医学奖，与其说颁发给了癌症的免疫治疗，不如说颁给了咱们人体伟大的自我修复能力。


    ## 总结


    ### 划重点


    - 人体具有强大的自我修复能力。

    - 自我修复缺失，医疗也无能为力。

    - 医疗的作用是为自我修复提供时间，创造条件。


    ## 思考题


    有病的时候，咳嗽、呕吐都是为了自我修复，你还能想到哪些表现，也体现了身体的自我修复呢？


    ## 下节预告


    毫无疑问，今天的医疗越来越强大，但是人们也从来没有像今天这样，对医疗这么不满。


