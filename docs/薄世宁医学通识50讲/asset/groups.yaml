    ## 梁启超“被切错的肾”


    1924 年，梁启超尿血。他工作太忙了，一直拖到 1926 年才到北京协和医院看病。


    当时的协和医院是美国洛克菲勒基金会在华投资，按照约翰·霍普金斯模式建立的医院。无论在当时还是今天，北京协和医院都是医院中的翘楚。


    梁启超来看病，医生立刻给他做了当时最先进的 X 光检查。检查果然发现了问题。在梁启超的肾上有一个直径 2-3 厘米的肿块，不过膀胱和尿道都没事。


    尿血加上肾上的肿块，那考虑什么呢？肾癌。


    1926 年 3 月 16 日，梁启超上了手术台，做了肾切除手术。主刀医生是当时外科“一把刀”，院长刘瑞恒博士。手术非常顺利。


    但是，切下来的肾做病理却发现，这个肿块是良性的，它不是癌。是良性切了也不要紧，只要尿血好了也行。但是做完手术后，梁启超还是尿血。


    直到今天，网络上仍然有对这个病例的争论。有人说，协和医院割错了肾，把好肾切了，留下了坏肾。这是医疗事故，是医生玩忽职守，草菅人命。


    那么真相到底是什么呢？


    我认为，对于这个病例调查最客观的人，是三联书店原总编辑李昕。他查阅了大量的历史文献和资料，包括协和医院公布的病例，梁启超本人写的《我的病与协和医院》的声明，还有梁启超的弟弟、儿子的文章，他还专门咨询了泌尿外科的专家。


    结论是：协和医院并没有切错肾。当时 X 光发现右肾问题，手术切除的也是右肾，压根儿就不存在切错了一说。只是这个肿瘤是良性的，不是尿血的原因。所以，客观上仍然给梁启超造成了损害。


    但是无论真相如何，已经不重要了。重要的是，它让我们知道无论多牛的人、多牛的医院，治病就有可能带来损害。


    这就是咱们今天要讲的医源性损害。它的定义是：由于医疗人员的言谈、操作行为不慎以及医疗相关操作的副作用，而造成患者生理或心理上的损伤。


    ### 第一类医源性损害：医疗事故


    医源性损害这个词是外来词，直接的意思来自于医疗一方的损害。这就导致了很多人望文生义，把各种事情混在一起。接下来，我分析一下这个定义。


    首先在这个定义里，医源性损害的原因只说了医疗人员，这不全面。


    有个英剧叫《报社》（Press），其中有个情节，揭露了英国一家医院在短期内死亡率突然上升的事。经过调查发现，原来是医院为了节省预算，雇用了廉价的清洁公司。清洁人员消毒不到位引起病人感染和死亡率上升。


    你看，只要是在医院，不论是不是医疗人员，凡是和医疗过程有关的人，包括清洁人员，甚至电梯司机、护工、陪护，都有可能给病人带来损害。


    其次，这个定义太笼统，没有区分开医源性损害的常见原因。这样也就无助于避免医源性损害，还会引起大家对医疗的误解。


    还回到梁启超案。首先，我们假设医生确实疏忽，把好肾给切了。那这是医疗事故。


    医疗事故是第一类医源性损害，最容易出现在手术或者操作环节。它又分为技术事故和责任事故。


    技术事故是医务人员的技术水平不高，诊疗经验不足，并没有主观故意违反操作规程。


    责任事故，就是医生个人的责任心问题了。比如切错了肾，比如把纱布留在病人肚子里，再比如没有遵守操作制度引起的传染病等。


    如果是医疗事故，病人就有获得赔偿的权利，严重的医疗责任事故，还会追究当事医生的刑事责任。


    那怎么避免医疗事故和差错呢？


    在今天的医疗事故中，大多数情况下，是因为技术上的缺陷而导致的问题。不论是个人技术问题还是责任心问题，个人出问题，一定能找到系统原因和漏洞。所以，用流程和制度可以很大程度上避免个人差错，降低风险。


    比如，在以前医生开药用手写。先别说医生的天书普通人看不懂，就连抓药的人也容易看错。万一小数点看错 1 位，就等于剂量错了 10 倍。现在开药必须用 HIS
    系统（Hospital Information System），电脑会自动审核。如果人为开错了药，就根本通不过系统，也就发不出来药，就是闭着眼也开不错。这也是用制度避免个人错误。


    再比如，以前配药都是护士在病房操作。在忙乱的情况下由于个人疏忽可能配错药，或者无菌操作不严格造成液体污染，给病人带来伤害。


    今天，很多大医院开展了 PIVAS（Pharmacy Intravenous Admixture Services），也叫静脉用药配置中心。


    ![静脉用药配置中心](img/4caf3257bac3bf3ff8bd0728c9b28448_171_0.png)


    对于一些特殊药物比如抗生素、营养液、化疗药等等，按照规范的流程，集中管理集中配置，专门的人干专门的事。这也是用制度和流程，降低事故和差错的典范之作。


    讲到这里，咱们也就了解了第一类医源性损害——医疗事故。通过制度、流程，这一类损害可以大大降低。


    但是，第二类医源性损害就更难避免了。


    ### 第二类医源性损害：医疗局限性的代价


    其实，梁启超案即便在今天，有尿血、肾上有肿瘤，今天的医生仍然可能把这个良性的瘤子当成癌症。


    为什么？


    我专门咨询了泌尿外科的同事。首先，肾上的良性肿瘤本来就少。其次，不做手术，单凭影像学资料很难区分。


    有些情况能判断是良性，比如血管瘤、肾脏血管平滑肌脂肪瘤等。但是，多数肾脏的良性肿瘤和癌症很难通过影像区分。在今天，这个手术恐怕还是在所难免。


    所以，这个病例不是事故。但是不可否认，它仍然是医源性损害。因为这个手术给病人造成了伤害，它属于医疗局限性的代价。这是第二类医源性损害。


    你一定记得 2005 年春晚，那个震撼了数亿观众的舞蹈：千手观音。除了舞姿优美，震撼观众的另一个原因是，这 21 个舞蹈演员全部都是聋哑人。


    我想说的是，这 21 个演员里，有 18 个是因为药物导致的耳聋。这也是医源性损害。她们小时候因为发烧，医生给她们使用链霉素、庆大霉素这一类被称为氨基糖苷类的药物，因为药物副作用导致耳聋。


    今天这些药已经很少用了，但在 20-30 年以前，这些都是常用的抗生素。


    为什么把副作用这么大的药用在病人身上呢？


    首先，在当时这些药很常用，效果也好，可以治病，可以救命。而且，当时的医生也不知道这些药有这么大的副作用。当然最关键的，是今天才知道了一种这种“一针致聋”的原因。


    原来，这些孩子都携带一种基因的突变。这类人群用氨基糖苷类抗生素就容易耳聋，这是小概率事件。


    客观地说，这显然是由于医疗局限性造成的。每个时代的医疗都有着认知局限，这种认知局限就会给病人带来损害。它发生的比例远远大于医疗事故，要通过整体认知水平的提高来降低。


    比如在 19 世纪，人们根本不知道有细菌的存在，也就没有“消毒”的概念。当时欧洲最大的医院——维也纳总医院，产妇死亡率高达 10% 以上。


    后来，一位医生经过调查发现，医务人员的手导致了交叉感染。只要做到用含氯的消毒液洗手，死亡率就减少到没有洗手之前的 1/6 左右。这是通过医学整体认知水平提高，降低医源性损害的典型实例。


    再比如，千手观音病例的主要问题，不仅是由于药物的不良反应，而且更重要的是这些受到伤害的病人携带了某种基因突变。


    整体认知的提高以及精准医疗的发展，让医学可以做到在用药之前，对一些易感人群进行基因筛查。如果携带这种基因突变，就避免使用这一类药物。这也是通过整体认知水平的提高，降低医源性损害的例子。


    还有梁启超案。在 1926 年，医学很难鉴别良性恶性，到今天依然难鉴别。但是未来，我相信医学一定可以找到更好的方法，不用手术就可以更准确地判断瘤子是良性或者恶性。那个时候再回头看今天，同样是通过提高整体认知降低损害的典范。


    治疗是一把双刃剑，医生在努力，如果你也了解这种损害的特点，那咱们可以一起努力。


    **划重点**


    - 医源性损害分为两种：医疗事故和医疗局限性的代价。

    - 通过制度可以减少事故的发生。

    - 更多的医源性损害是医疗局限性的代价，要通过整体认知水平提高来降低。


