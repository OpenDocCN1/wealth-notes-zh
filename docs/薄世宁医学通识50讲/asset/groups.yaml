    ## 划重点


    - 1. 正确认识死亡可以让人实现有尊严的死亡。

    - 2. 自己的成长、社会的支持、医学的温情是让死亡质量提高的解决方案。

    - 3. 善终的含义包括 6 个层面，缓和医疗和生前预嘱是目前做到善终的有益尝试。


