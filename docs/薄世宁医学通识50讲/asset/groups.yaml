    ## 29 ｜X 射线：最小干预获取信息的新起点


    2019-3-27


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    医学面临的一个困境就是如何在活体上获取信息。信息越准确，也就越接近疾病的真相。


    通常情况下，不可能直接打开人体。所以，医生必须想方设法，尽量小地干预病人的生理状态，来获取信息。


    但是多数时候，获取信息需要付出代价。


    比如，要想了解肝脏、肾脏功能，了解血里面白细胞数目是多少，就需要抽血化验。这些化验数据是获取的信息，病人失去少量血液就是付出的代价。


    医学永远有一个矛盾，就是在尽量不干预生理过程的条件下，找到获得准确信息与付出代价之间的平衡点。


    就是在不断地解决和减小这个矛盾的过程中，医学得到了深化和进步。


    而真正让这个矛盾大大降低的一个关键技术，就是这节课要讲的 X 射线。


    X 射线第一次让医生能够不用手术，不用打开人体，就能在活人身上获取身体内部的信息。这是用最小的干预获取信息的开始。


    ### 活体下的生命"摄影"


    1895 年，德国物理学家伦琴在一个黑暗的实验室里发现了 X 射线。很快，X 射线就被用于医学检查，在全世界迅速推广。


    X 射线检查的工作原理，就是利用 X 射线对不同密度和厚度的组织不同的穿透力，然后投射到一张可以显影的胶片上，医生利用阴影的密度来判断病变。


    曾经在很长一段时间里，X 射线检查是临床最主要的检查手段之一。


    后来，在 X 射线的基础上，人们利用计算机技术逐层扫描，又发展出我们今天熟悉的 CT。


    CT 全称电子计算机断层扫描 (Computed Tomography)。无论多么高大上的 CT 设备，也无论扫描的影像多么清晰，它的基础原理还是 X 射线的原理。


    X 射线让医生在没有创伤的情况下，获得疾病真相。它大大缩小了获取精确信息和付出代价之间的矛盾。


    X 射线的出现，是医学进步重大的里程碑之一。


    这就是关于 X 射线的第一个层面：它的工作原理是 X 射线对于不同组织的穿透力，反映出来的影像信息。


    它是用最小干预去获取内部信息的开始。


    ### X 射线初期是“拿着生命摄影”


    X 射线检查虽然没有肉眼可见的创伤，但是并不等于没有损伤。


    X 射线虽然无色、无味，肉眼看不到，但它却是以能量的形式进入人体，这种能量物质就会和人体组织发生相互作用。


    这种相互作用表现出来，可以被我们捕获来获得信息。


    在这个理念的指导下，人类又开发出超声检查和核磁共振。超声检查利用的是超声波遇到人体组织后，对反射信号的接收、处理，以获得体内器官的图象。这也是利用相互作用来获取活体信息。


    核磁共振，是利用了人体组织的氢质子在场下的变化来形成图像，反映组织内部的情况。这还是利用相互作用来获取活体信息。


    但是，X 射线的能量和人体组织相互作用的同时，也带来了伤害。


    如果照射剂量过大，X 射线的能量就会引起基因突变，让细胞变性、死亡甚至引发癌变。


    短期内大量暴露于 X 射线之下，还会引起死亡。


    但是，发现 X 射线的初期，人们对于这种危害却一无所知。让我说，X 射线是为生命“摄影”，但是初期的医生，却是“拿着生命在摄影”。


    1895 年，X 射线被发现几周之内，就快速用在医学上和民用上。


    很多医生开始用 X 射线为病人寻找病变，发现骨折，甚至寻找进入人体的异物。


    X 射线在民间也有广泛应用，甚至售鞋的商店里，都有 X 光试鞋机。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_225_0.png)


    结婚拍婚纱照，选美拍美人照，除了普通照片，还可以拍一组 X 光骨骼片。显示人体内部的美，也成了当时有钱人的一种时尚。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_226_0.png)


    但是很快，这种不经防护，不考虑照射剂量的检查手段，就给人类带来了灾难。


    你肯定能想到，受伤最大的一定是第一批用 X 射线给病人看病的医生。因为病人用 X 射线，也就一次半次，但是医生却是天天接触 X 射线。


    很多医生的手臂得了癌症，不得不截肢。但是截肢后，仍然难以逃脱死亡的结局。


    有记载，某一年放射学学会举办会议，端上来的烤鸡医生们都很少吃。


    为啥呢？


    不是因为烤鸡不香，而是很多医生因为癌变被截掉了双手，动不了餐具。


    在发现 X 射线的故乡德国，有一座 X 射线纪念碑，就是为了纪念 X 射线发明初期殉职的医生和技师，一共 350 人。


    甚至，有个博物馆里面还有件特殊的展品，就是一只截下来的手。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_227_0.png)


    > 被 X 射线损伤的手部截肢


    手的主人就是一位著名的医生，他用这只截下来的手向后人警示：任何技术带来进步的同时，一定会让人类付出代价。


    只有让 X 射线对人体的干预降到最小，才能让它的作用发挥到最大。


    ### 让最小干预发挥最大作用


    1925 年，也就是距离伦琴发现 X 射线 30 年后，第一届国际放射学大会首次提出 X 射线的防护问题。


    到了 1928 年，第二届放射学大会制定出了 X 射线操作规范。用规范和制度来保证医生和病人的安全。


    放射设备越来越先进，防护理念和措施也越来越规范。因此，为了获取信息所必须付出的代价，也越来越小。


    今天的放射设备，在有效控制放射剂量和规范应用下，已经非常安全了。比如用于检查心肺疾病的胸部 X 光片，以及用于肺癌筛查的低剂量肺部 CT 检查。


    很多人仍然会有疑问：不论怎么说，这也要“吃线”啊，它安全吗？


    我来解释一下。


    要知道，咱们生活的环境本来就存在辐射，我们把这种辐射叫做天然本底辐射。它指的是宇宙射线和自然界中天然放射性核素发出的射线。


    也就是说，即使不做 X 射线检查，我们每天照样接受辐射。


    在今天，X 射线的照射剂量越来越小。


    就拿天然本底辐射对比，拍一张普通的胸部 X 光片，病人接受的放射剂量大约相当于 3 天的本底辐射。


    做一次低剂量肺部 CT，放射剂量大约相当于 150 天的天然本底辐射。这种剂量比普通肺部 CT 照射剂量减少近 90%，对于肺癌筛查，是非常安全和行之有效的手段。


    用接受一点放射的代价，获取了更精准的信息。


    这种低剂量肺部 CT，虽然不如普通肺部 CT 清晰，但它依然可以清晰地辨别直径小于 5 毫米的病灶。


    1993 年，有一项大样本国际早期肺癌行动计划。这项计划对 3 万人进行筛查，结果筛查出 484 例肺癌，85% 为早期。经过手术切除后，10 年生存率高达
    92%。


    这就是关于 X 射线的第二个层面：能量控制。用最小干预进一步缩小了获取信息和付出代价之间的矛盾，让 X 射线技术得到了广泛应用。


    ### 精准干预能量实现治疗作用


    那么，X 射线是不是仅仅用于信息采集呢？


    不是。


    如果让 X 射线的能量精准干预，作用于病变组织，它还具有治疗作用。这就是关于 X 射线的第三个层面。


    刚才提到，X 射线照射会以能量的形式，和人体组织相互作用。那么，如果把能量精准投递，集中可控能量，这些技术又成为了有效的治疗技术。


    比如，把 X 射线能量精准投递，就形成了癌症的放射治疗。


    早在 1899 年，也就是发现 X 射线 4 年之后，就有了第 1 例用 X 射线照射，皮肤癌得到缓解的案例报道。


    放射治疗设备发展到今天，又出现了射波刀、速锋刀、质子刀等等。


    放疗的效果和精确性，可能远远超过了咱们的想象。但是它们的原理，都是让射线能量精准干预疾病组织，让它们相互作用，让癌细胞死亡。


    在今天，放疗科医生不仅可以根据肿瘤的形状、部位、性质来制定放射剂量，甚至能干预位置会发生移动的肿瘤。


    比如肺癌的时候，肺癌组织会随着呼吸活动。现在的放疗设备可以应用 3D、4D 图像精准跟踪，既可以有效杀伤肿瘤，又减少了对正常肺组织的损害。


    再比如，把超声波的能量汇聚起来精准干预，又发展出了超声波碎石，可以精准打击肾脏里的结石。还有超声波洗牙等等。


    除了放射治疗，在医学的很多领域用 X 射线精准干预，都获得了巨大的突破。


    比如，在 X 射线透视的基础上，给血管里打造影剂，也就是不透过 X 射线的液体物质，就可以显现血管形态。医生们就可以在 X 射线 下，给狭窄的血管做介入手术，这就是咱们熟悉的心脏支架手术。


    其实，X 射线带给咱们的不仅是临床检查和治疗的突破。


    粗略统计，有十几项诺贝尔奖都与 X 射线技术直接或间接相关。


    包括利用 X 射线晶体衍射原理，拍摄染色体双螺旋结构。还有，应用 X 射线技术测定青霉素、胰岛素，以及很多重要蛋白质的分子结构等等。


    X 射线用最小干预获取疾病信息，又用精准干预，成了治疗疾病和推动医学发展的利器。


    ## 划重点


    - 医学永远面临一个矛盾：活体信息采集与付出代价之间的矛盾。

    - X 射线大大缩小这个矛盾，它是用最小干预获取信息的新起点。

    - 只有让 X 射线对人体干预最小，才能让 X 射线技术广泛应用。精准干预 X 射线的能量，又带来疾病治疗的新手段。


    ## 下节预告


    为什么抗生素的杀菌效果那么好？如何科学使用抗生素？下一讲，我们讲讲抗生素。


    ## 30 | 抗生素：物种竞争关系的巧妙利用


    2019-3-28


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    先请你看看下面这幅漫画。


    漫画里，两个远古人坐在山洞里讨论人生。他俩说：


    > “有个事儿好像不大对劲。”


    > “有啥不对劲儿呢？”


    > “咱们的空气是干净的，咱们喝的水是纯净水，咱们锻炼也足够，咱们的食物都是有机和野生的。为啥却没人能活过 30 岁呢？”


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_231_0.png)


    > "Something''s just not right—our air is clean, our water is pure, we all get
    plenty of exercise, everything we eat is organic and free-range, and yet nobody
    lives past thirty."


    你想过这个问题没有呢？


    为什么远古人活得这么“绿色”，却活不过30岁？


    咱们和雾霾斗，和压力斗，和农药斗，但是咱们的平均预期寿命已经接近80岁了。


    让我说，今天人类的寿命大大延长，其中一项重要的原因，就是巧妙地利用了物种竞争。


    这节课请你记住这四个字——物种竞争。


    ### 利用物种竞争治疗感染


    从古至今，咱们一直笼罩在致病微生物的威胁之下。


    在古代，甚至不经意间破皮都有可能要了命。致病微生物想侵入人体获取营养，这就是物种之间的竞争。


    更严重的是烈性传染病，比如鼠疫。


    鼠疫也叫黑死病。引起鼠疫的就是种毒力和传染性都很强的细菌——鼠疫杆菌。


    1347年欧洲爆发鼠疫，夺走了2500万人的生命，占到当时欧洲总人口的1/3。在意大利的佛罗伦萨，80%的人在这场鼠疫中丧命。


    有作家曾经写到：


    上帝对人类的残忍到了极点。


    很多人上午刚把亲人的尸体拉去焚烧，到了晚上，自己的尸体又要被别人拖走烧掉，就这么惨。


    这次鼠疫过后，欧洲人口用了大约150年才恢复。


    鼠疫和很多细菌感染性疾病，比如肺结核、淋病、细菌性肺炎等，这些病告诉咱们：很多毒力很强的细菌，单纯依靠人体免疫，对抗不了。


    这种状况一直持续到一个药的发现——青霉素。


    关于青霉素，你肯定了解不少。


    比如，1928 年英国的弗莱明博士（Alexander Fleming）在实验室发霉的培养基中，偶然发现了青霉素。


    再比如，弗洛里（Howard Walter Florey）和钱恩（Ernst Chain）完成了青霉素的提纯，并促成了青霉素的量产。


    青霉素的发明，让这三位科学家分享 1945 年的诺贝尔生理学或医学奖。


    还有，盟军诺曼底登陆，不仅准备了无数的枪支弹药，还准备了 10 万支青霉素。二战中青霉素挽救了无数伤员。


    那么，一支小小的青霉素，为什么可以救这么多命呢？


    研究表明，以青霉素为代表的 β-内酰胺类抗生素，作用机制就是干扰了细菌细胞壁的合成。


    我们熟悉的头孢，就是 β-内酰胺类抗生素。


    要知道，咱们人体的细胞是没有细胞壁的，所以青霉素杀细菌效果好，同时对人体细胞伤害很小。这是药理学家的解释。


    我再带你再深想一层。


    再回到 90 多年前，弗莱明博士偶然发现青霉素的现场，这里面有个细节。弗莱明发现，在长了霉菌的培养基周围，没有细菌生长。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_234_0.png)


    霉菌（白色）周围没有细菌


    为什么真菌周围不长细菌呢？一定是真菌分泌的什么东西，抑制或者杀死了细菌。


    为什么真菌要和细菌过不去呢？


    对，这又是另一种物种竞争关系。


    咱们人体内，不仅有细菌，还有真菌。在数以百万年的演化过程中，人、细菌、真菌形成了一种既相互依存，又相互竞争的关系。


    平时大家和谐共处，这是共生，但是在抵抗力低，或者人体某个部位有了破损，或者遇到毒力强的致病微生物侵入人体的时候，三者就成了你死我活的竞争关系。


    既然在严重感染的状态下，人体的免疫力很难清除细菌。那么，用真菌分泌的物质，也就是青霉素，就可以杀死细菌。


    人体是真菌生存的环境，所以，这种真菌分泌的物质，一定不能对人有太大伤害，否则一起玩完谁也得不到好处。因此，青霉素对细菌杀伤效果好，但是对人的伤害却很小。


    青霉素就是第一个抗生素。


    “抗生”的意思，就是一种微生物对另外一种微生物的生长繁殖有抑制或者杀灭作用。一种微生物分泌的，可以抑制或者杀死对方的物质，就是抗生素。


    所以，用青霉素治疗细菌感染，就是用真菌分泌的物质去杀死细菌，这是巧妙地利用了物种之间天然的竞争关系。


    这就是青霉素的工作原理，是理解的物种竞争关系的第一个层面：利用物种竞争治疗感染。


    ### 过度使用抗生素带来的问题


    青霉素的出现带来了一个抗生素时代。


    人类又研发或者合成了其他种类的抗生素，作用原理也不再只是干扰细胞壁的合成。比如，有的是影响细菌蛋白的合成，有的是阻碍细菌DNA的合成。


    抗生素的出现，给人类对抗细菌提供了一把利器。


    以前很多治不了的病，今天能治了。比如细菌性肺炎、细菌性尿路感染等等。


    那么，人类有了抗生素，是不是就“无敌”了呢？


    我们今天担心的所谓抗生素的耐药，以及二重感染等问题，从抗生素发现的那一天，就埋下了种子。


    在细菌感染的时候，用抗生素是为了治病，为了救命。


    不容忽视的是，抗生素是把物种天然的竞争关系，人为拿出来利用。


    长期使用的话，对抗生素敏感的细菌就杀光了，这时候，另一些不敏感的细菌就会过度繁殖，细菌也会演化出适应抗生素环境的生存方式。这就是耐药。


    这部分细菌会把耐药 的遗传物质，通过接触传递给周围的细菌，也通过繁殖传递给它的后代。


    人类研发一种新型抗生素，要用数年甚至十几年。但是，细菌只需几个小时就能完成一次进化和迭代。


    所以，再强、再新的抗生素，也不可能杀光所有的细菌。杀不掉的细菌终将耐药。这就是细菌对抗生素的耐药现象。


    除了耐药问题，大量应用抗生素，还会打破肠道内细菌的内共生关系。关于内共生，在前面的课程《第 10 讲 内共生：认知疾病的新角度》里讲过，这里就不多说了。


    打破内共生就会引起菌群紊乱。我举个极端的例子。


    在医院，因为严重感染性疾病，需要大量使用抗生素的病人，会出现顽固的腹泻。就是因为抗生素打破了原本的菌群平衡，导致菌群紊乱。


    这种腹泻很难治，那怎么办呢？


    既然是抗生素破坏了物种的平衡，那最好的办法就是恢复平衡。


    有一种办法，就是把健康人的粪便提取液，也就是健康人的肠道细菌，打到病人的肠道里，很多病人的腹泻就能止住。


    大量广谱抗生素应用，还会带来真菌感染。


    为什么呢？


    我们利用物种竞争，利用真菌分泌的物质杀死了细菌，谁最高兴呢？


    当然是真菌了。


    真菌过度生长，也会带来真菌感染。大量使用广谱抗生素的病人就会出现深部真菌感染，这类感染就更难治了。


    我再举个日常生活中的例子。


    很多女生受到广告误导，动不动就用含有杀菌剂的洗液冲洗阴道。阴道本身就是一个充满细菌的环境，用洗液就破坏了阴道本身的菌群平衡，反而会引起真菌感染。


    很多阴道炎，尤其是真菌性阴道炎都与阴道的微生态失调有关。


    这是关于物种竞争的第二个层面：过度利用抗生素，会带来细菌耐药、菌群紊乱，继发真菌感染。


    ### 科学使用抗生素的三条建议


    到底该不该用抗生素呢？有了感染，“死扛着”是不是就更安全呢？


    这种态度肯定不对。作为医生，我给你三条使用抗生素的建议：


    - 第一，在医生的指导下规范应用，抗生素是好药，不会带来多大的副作用。


    所以，在严重感染的时候一定要用抗生素，不要排斥。而且要早用，按疗程用。


    - 第二，任何感染都不能单纯地“杀”，除了应用抗生素之外，应该鼓励人体的自我防御。


    我在前面课程里讲过，比如发烧、咳嗽、腹泻，这些都是人体清除细菌的自我防御机制，如果不是过度反应，尽量不要压制。


    比如，把痰咳出来，就是身体的一种自我防御。很多病情严重的病人没办法自主咳痰，这样就很危险。


    所以在医院，对于严重的肺炎病人，医生和护士时刻都在鼓励病人咳痰。咳不出来的，医生还会用气管镜吸痰，这些都是 在激励人体本来的自我防御机制。


    危重病人能否战胜疾病的一个重要指标，就是看他是否恢复了有效的咳嗽能力。


    - 第三，少备抗生素。


    家里的小药箱，可以备退烧药、感冒药、平时吃的慢性病用药，但是我认为不要准备太多的抗生素。


    别自己滥用抗生素。关于抗生素用不用，怎么用，还是应该咨询医生，根据处方购买和治疗。


    ## 划重点


    - 青霉素的发现虽然是偶然，但它是巧妙地利用了物种之间的竞争关系。

    - 过度使用抗生素会导致细菌耐药、菌群紊乱、真菌感染。

    - 正确对待抗生素的态度：感染性疾病必须在医生指导下用药，同时鼓励人体的自我防御机制。


