    ## 29 ｜X 射线：最小干预获取信息的新起点


    2019-3-27


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    医学面临的一个困境就是如何在活体上获取信息。信息越准确，也就越接近疾病的真相。


    通常情况下，不可能直接打开人体。所以，医生必须想方设法，尽量小地干预病人的生理状态，来获取信息。


    但是多数时候，获取信息需要付出代价。


    比如，要想了解肝脏、肾脏功能，了解血里面白细胞数目是多少，就需要抽血化验。这些化验数据是获取的信息，病人失去少量血液就是付出的代价。


    医学永远有一个矛盾，就是在尽量不干预生理过程的条件下，找到获得准确信息与付出代价之间的平衡点。


    就是在不断地解决和减小这个矛盾的过程中，医学得到了深化和进步。


    而真正让这个矛盾大大降低的一个关键技术，就是这节课要讲的 X 射线。


    X 射线第一次让医生能够不用手术，不用打开人体，就能在活人身上获取身体内部的信息。这是用最小的干预获取信息的开始。


    ### 活体下的生命"摄影"


    1895 年，德国物理学家伦琴在一个黑暗的实验室里发现了 X 射线。很快，X 射线就被用于医学检查，在全世界迅速推广。


    X 射线检查的工作原理，就是利用 X 射线对不同密度和厚度的组织不同的穿透力，然后投射到一张可以显影的胶片上，医生利用阴影的密度来判断病变。


    曾经在很长一段时间里，X 射线检查是临床最主要的检查手段之一。


    后来，在 X 射线的基础上，人们利用计算机技术逐层扫描，又发展出我们今天熟悉的 CT。


    CT 全称电子计算机断层扫描 (Computed Tomography)。无论多么高大上的 CT 设备，也无论扫描的影像多么清晰，它的基础原理还是 X 射线的原理。


    X 射线让医生在没有创伤的情况下，获得疾病真相。它大大缩小了获取精确信息和付出代价之间的矛盾。


    X 射线的出现，是医学进步重大的里程碑之一。


    这就是关于 X 射线的第一个层面：它的工作原理是 X 射线对于不同组织的穿透力，反映出来的影像信息。


    它是用最小干预去获取内部信息的开始。


    ### X 射线初期是“拿着生命摄影”


    X 射线检查虽然没有肉眼可见的创伤，但是并不等于没有损伤。


    X 射线虽然无色、无味，肉眼看不到，但它却是以能量的形式进入人体，这种能量物质就会和人体组织发生相互作用。


    这种相互作用表现出来，可以被我们捕获来获得信息。


    在这个理念的指导下，人类又开发出超声检查和核磁共振。超声检查利用的是超声波遇到人体组织后，对反射信号的接收、处理，以获得体内器官的图象。这也是利用相互作用来获取活体信息。


    核磁共振，是利用了人体组织的氢质子在场下的变化来形成图像，反映组织内部的情况。这还是利用相互作用来获取活体信息。


    但是，X 射线的能量和人体组织相互作用的同时，也带来了伤害。


    如果照射剂量过大，X 射线的能量就会引起基因突变，让细胞变性、死亡甚至引发癌变。


    短期内大量暴露于 X 射线之下，还会引起死亡。


    但是，发现 X 射线的初期，人们对于这种危害却一无所知。让我说，X 射线是为生命“摄影”，但是初期的医生，却是“拿着生命在摄影”。


    1895 年，X 射线被发现几周之内，就快速用在医学上和民用上。


    很多医生开始用 X 射线为病人寻找病变，发现骨折，甚至寻找进入人体的异物。


    X 射线在民间也有广泛应用，甚至售鞋的商店里，都有 X 光试鞋机。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_225_0.png)


    结婚拍婚纱照，选美拍美人照，除了普通照片，还可以拍一组 X 光骨骼片。显示人体内部的美，也成了当时有钱人的一种时尚。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_226_0.png)


    但是很快，这种不经防护，不考虑照射剂量的检查手段，就给人类带来了灾难。


    你肯定能想到，受伤最大的一定是第一批用 X 射线给病人看病的医生。因为病人用 X 射线，也就一次半次，但是医生却是天天接触 X 射线。


    很多医生的手臂得了癌症，不得不截肢。但是截肢后，仍然难以逃脱死亡的结局。


    有记载，某一年放射学学会举办会议，端上来的烤鸡医生们都很少吃。


    为啥呢？


    不是因为烤鸡不香，而是很多医生因为癌变被截掉了双手，动不了餐具。


    在发现 X 射线的故乡德国，有一座 X 射线纪念碑，就是为了纪念 X 射线发明初期殉职的医生和技师，一共 350 人。


    甚至，有个博物馆里面还有件特殊的展品，就是一只截下来的手。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_227_0.png)


    > 被 X 射线损伤的手部截肢


    手的主人就是一位著名的医生，他用这只截下来的手向后人警示：任何技术带来进步的同时，一定会让人类付出代价。


    只有让 X 射线对人体的干预降到最小，才能让它的作用发挥到最大。


    ### 让最小干预发挥最大作用


    1925 年，也就是距离伦琴发现 X 射线 30 年后，第一届国际放射学大会首次提出 X 射线的防护问题。


    到了 1928 年，第二届放射学大会制定出了 X 射线操作规范。用规范和制度来保证医生和病人的安全。


    放射设备越来越先进，防护理念和措施也越来越规范。因此，为了获取信息所必须付出的代价，也越来越小。


    今天的放射设备，在有效控制放射剂量和规范应用下，已经非常安全了。比如用于检查心肺疾病的胸部 X 光片，以及用于肺癌筛查的低剂量肺部 CT 检查。


    很多人仍然会有疑问：不论怎么说，这也要“吃线”啊，它安全吗？


    我来解释一下。


    要知道，咱们生活的环境本来就存在辐射，我们把这种辐射叫做天然本底辐射。它指的是宇宙射线和自然界中天然放射性核素发出的射线。


    也就是说，即使不做 X 射线检查，我们每天照样接受辐射。


    在今天，X 射线的照射剂量越来越小。


    就拿天然本底辐射对比，拍一张普通的胸部 X 光片，病人接受的放射剂量大约相当于 3 天的本底辐射。


    做一次低剂量肺部 CT，放射剂量大约相当于 150 天的天然本底辐射。这种剂量比普通肺部 CT 照射剂量减少近 90%，对于肺癌筛查，是非常安全和行之有效的手段。


    用接受一点放射的代价，获取了更精准的信息。


    这种低剂量肺部 CT，虽然不如普通肺部 CT 清晰，但它依然可以清晰地辨别直径小于 5 毫米的病灶。


    1993 年，有一项大样本国际早期肺癌行动计划。这项计划对 3 万人进行筛查，结果筛查出 484 例肺癌，85% 为早期。经过手术切除后，10 年生存率高达
    92%。


    这就是关于 X 射线的第二个层面：能量控制。用最小干预进一步缩小了获取信息和付出代价之间的矛盾，让 X 射线技术得到了广泛应用。


    ### 精准干预能量实现治疗作用


    那么，X 射线是不是仅仅用于信息采集呢？


    不是。


    如果让 X 射线的能量精准干预，作用于病变组织，它还具有治疗作用。这就是关于 X 射线的第三个层面。


    刚才提到，X 射线照射会以能量的形式，和人体组织相互作用。那么，如果把能量精准投递，集中可控能量，这些技术又成为了有效的治疗技术。


    比如，把 X 射线能量精准投递，就形成了癌症的放射治疗。


    早在 1899 年，也就是发现 X 射线 4 年之后，就有了第 1 例用 X 射线照射，皮肤癌得到缓解的案例报道。


    放射治疗设备发展到今天，又出现了射波刀、速锋刀、质子刀等等。


    放疗的效果和精确性，可能远远超过了咱们的想象。但是它们的原理，都是让射线能量精准干预疾病组织，让它们相互作用，让癌细胞死亡。


    在今天，放疗科医生不仅可以根据肿瘤的形状、部位、性质来制定放射剂量，甚至能干预位置会发生移动的肿瘤。


    比如肺癌的时候，肺癌组织会随着呼吸活动。现在的放疗设备可以应用 3D、4D 图像精准跟踪，既可以有效杀伤肿瘤，又减少了对正常肺组织的损害。


    再比如，把超声波的能量汇聚起来精准干预，又发展出了超声波碎石，可以精准打击肾脏里的结石。还有超声波洗牙等等。


    除了放射治疗，在医学的很多领域用 X 射线精准干预，都获得了巨大的突破。


    比如，在 X 射线透视的基础上，给血管里打造影剂，也就是不透过 X 射线的液体物质，就可以显现血管形态。医生们就可以在 X 射线 下，给狭窄的血管做介入手术，这就是咱们熟悉的心脏支架手术。


    其实，X 射线带给咱们的不仅是临床检查和治疗的突破。


    粗略统计，有十几项诺贝尔奖都与 X 射线技术直接或间接相关。


    包括利用 X 射线晶体衍射原理，拍摄染色体双螺旋结构。还有，应用 X 射线技术测定青霉素、胰岛素，以及很多重要蛋白质的分子结构等等。


    X 射线用最小干预获取疾病信息，又用精准干预，成了治疗疾病和推动医学发展的利器。


    ## 划重点


    - 医学永远面临一个矛盾：活体信息采集与付出代价之间的矛盾。

    - X 射线大大缩小这个矛盾，它是用最小干预获取信息的新起点。

    - 只有让 X 射线对人体干预最小，才能让 X 射线技术广泛应用。精准干预 X 射线的能量，又带来疾病治疗的新手段。


