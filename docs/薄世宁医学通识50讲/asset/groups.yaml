    未必。


    再回到塞医生这个病例。1850 年，塞医生在集体会议上宣布他的发现。但是，他等来的不是欢呼，而是攻击。


    他写了文章却一直不被发表。后来，好不容易发表了，也并没有在医学界引起大家的关注。再后来塞医生丢了工作，出现抑郁，因为精神失常被送进了精神病院。再后来，他被精神病院的保安用棍棒打死，享年
    47 岁。


    你可能会认为，这是自我纠错、自我揭短，从而受到了保守势力的攻击。但是我却不完全这么认为。


    只有提高整体认知，才是纠正无知之错的根本。


    在以前，关于传染病，人们要么认为是四体液不平衡，是人体内部出问题了。要么认为是“瘴气”或者是外层空间出问题了。这两种学说带来的认知，显然不能演化出有效的方法。


    1543 年，意大利帕多瓦大学的维萨里（Andreas Vesalius）发表《人体的构造》（De humani corporis fabrica），标志着现代解剖学诞生；


    1761 年，意大利解剖学家莫尔加尼（Giovanni Battista Morgagni）发表《病灶与病因》（De Sedibus et Causis Morborum
    per Anatomen Indagatis），建立了病理解剖学；


    后来，人类有了显微镜，在放大 400 倍之后看到了细菌轮廓，放大到 1000 倍以后看到了清晰的细菌形态；


    再后来，巴斯德（Louis Pasteur）和李斯特（Joseph Lister）奠定了微生物理论，证明了细菌可以传染疾病，严格的消毒和防护制度，可以有效避免交叉感染。


    只有整体认知提高，才是解决无知之错的终极方案。一旦无知之错被发现、被纠正，那么必将带来一个巨大的突破。'
