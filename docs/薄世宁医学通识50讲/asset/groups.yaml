    # 18 | 癌的生成机制: 同归于尽的疯狂跑车


    2019-03-16


    你好, 欢迎来到《医学通识 50 讲》, 我是薄世宁。


    这节课开始进入新的一章。


    在这一章, 咱们讲讲虽然常见, 但是经常容易被误解, 需要你重新认知的疾病。


    今天这节课, 从人类的“第一杀手”——癌症讲起。


    你可能会认为癌症是突然的灾难, 但是癌症的发生却是一个漫长的过程, 是在六大环节上出了问题。


    我认为论述癌症特点最经典的, 是 2011 年美国的罗伯特·温伯格院士 (Robert Allan Weinberg) 发表在《细胞》(Cell) 杂志上的一篇文章。


    迄今为止, 这篇文章已经被引用上万次, 被认为是最受欢迎的癌症综述第一名。全世界所有研究癌症的人, 没有一个没读过这篇文章。


    但是原文 29 页, 专业词汇也太多。我就以这篇文章作基础, 帮你捋清癌症发生发展的六大环节。


    听完这节课, 你就可以掌握癌症发病的核心原理, 对癌症有一个完整的认知了。


    你觉得癌细胞像什么? 我觉得它是一辆“疯狂的跑车”。


    为什么说疯狂呢? 它不按常理、没有规律、不听指挥, 就像疯了一样。


    为什么说是跑车呢? 它跑得快、油耗大, 一旦出事, 损害巨大。


    “癌症跑车”这个词, 我认为是对癌细胞最贴切的比喻。'
  - '[PAGE 140]


    # 第一个环节：错误的图纸和订单


    我们知道汽车制造需要正确的图纸和订单，根据图纸加工，根据订单决定加工数量。


    图纸决定造成什么样，订单决定造多少。


    但是，癌细胞从这最开始就错了。


    先是图纸错了，具体到细胞上也就是基因错了。正常的基因突变成癌基因了，按照这个图纸怎么能生产出好汽车呢？


    我们把癌基因这张图纸生产出来的汽车，叫做“癌症跑车”。


    偶尔有一辆“癌症跑车”出厂不可怕，怕就怕数量太多。


    正常细胞生长分裂需要生长信号，同时还有抑制信号防止过度生长。


    癌细胞一个最大的特点就是生长信号多，而且对抑制信号不敏感。所以，癌细胞长得快，不停地长。


    这就好像是生产车间乱套了，自己伪造了生产信号和订单。同时，对于调度发出的停工信号置若罔闻。


    所以，按照这种错误的图纸，源源不断地生产出了大量的“癌症跑车”。


    这就是癌症的第一个环节。


    汽车生产出来以后，下一个环节一定是自检，否则不合格的汽车就会流入市场。


    # 第二个环节：失效的自检体系


    通常，对于不合格的劣质汽车，常用做法是进行销毁，免得让车出去害人。


    具体到人体，人体每天都会产生不合格的细胞。'
  - '[PAGE 141]


    因此，人体有一种细胞凋亡机制，目的是让这些不合格细胞自我销毁。


    就像花朵到了一定时候就该凋谢一样，细胞的凋亡就是细胞的程序性死亡，它是人体防止细胞癌变的一种主要机制。


    但是现在，这个机制失灵了。


    指挥细胞进行凋亡，也就是让细胞自杀物质是抑癌基因（tumor suppressor genes），顾名思义，就是抑制癌症的基因。它指挥细胞赶紧自杀，别害人。著名的
    P53 就是一种抑癌基因。


    如果抑癌基因发生突变了，那么这些本来应该自杀的细胞就会赖着不死。


    这就好比是，虽然检测到了癌症跑车不合格，却没有能力让它自我销毁，这辆害人的汽车该上路了，这个自检体系失效了。


    # 第三个环节：灵活的能量供应


    其实，上了路也不要紧，这种疯狂跑车跑得快、油耗大，需要随时加油。所以，如果路上没有加油站，车跑不了太远就得熄火。


    对于细胞来说，血管就是加油站。


    正常情况下，一个细胞和它最近的毛细血管的距离不能超过 100 微米，也就是 0.1 毫米。太远了营养够不着，相当于汽车没油了，必须得在附近找个加油站，否则就得熄火。


    但是，癌细胞特别灵活。


    癌症的时候，促进血管形成的信号增多，而抑制血管形成的信号减少。这样，就有持续的新生血管形成，源源不断地给肿瘤组织供血。


    这就好比是，"癌症跑车"上路，既然找不到固定的加油站，那么就自带移动的加油枪，随时供应燃料，保证疯狂奔跑。'
  - '[PAGE 142]


    所以在临床上，多数恶性肿瘤通常都是血流丰富。医生们甚至用这个特点区分良性和恶性。


    “癌症跑车”不仅能随时加油，而且它的燃料利用系统也比正常汽车厉害。


    癌细胞不论在有氧还是无氧环境下，都可以迅速产生能量，供应自身的能量需求。


    有了油，又有灵活的能量供应机制，这辆跑车彻底疯了，谁也不服了。这就是第三个环节：灵活的能量供应。


    这个时候，按照癌基因图纸生产出来的疯狂跑车，躲过了自我销毁，还自带加油枪，似乎是无敌了。


    第四个环节：迟钝的警察


    你可能会问，不是还有警察吗？


    没错，正常情况下人体的免疫细胞就是警察，它们会主动寻找和攻击癌细胞。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_142_0.png)


    电子显微镜下拍摄的T细胞（红）攻击癌细胞（绿）


    但是警察这一关，癌细胞居然也闯过去了。'
  - '[PAGE 143]


    它会伪造一张"假身份证"，躲过警察的检查设备，顺利闯关，逃过警察的盘查和杀伤。这种机制叫做免疫逃逸。


    在狡猾的癌细胞面前，咱们人体免疫这个警察迟钝了。这就是癌症发病的第四个环节：迟钝的警察。


    # 第五个环节：篡改的里程


    其实，即使"癌症跑车"侥幸闯关迷惑了警察，也并不是那么可怕。因为每个汽车跑到一定里程，也该报废了。就像正常细胞分裂是有限度的。


    **2009** 年，这个机制的发现获得了诺贝尔医学奖，这就是染色体末端都有端粒。


    每次细胞分裂，端粒就缩短一部分。正常细胞分裂**50** 次左右，端粒也就消耗光了。没有了端粒，细胞只能死。


    所以，每个细胞的分裂极限就相当于里程报废。


    但是癌细胞不同，它的细胞里有种酶，可以不断地补充端粒的长度，保证癌细胞可以无限次分裂。


    还用汽车比喻。正常情况下每一个汽车都有报废里程，端粒就好比是里程，等损耗到一定程度端粒就消失了，那这个汽车就必须强制报废。


    但是，"癌症跑车"会不断地篡改里程，也就是不断地延长端粒长度，这样就巧妙地避免了报废。这就是癌症的第五个环节：篡改的里程。


    # 第六个环节：错乱的导航


    你能想象吗？一辆不合格的坏车，躲过了自检，骗过了警察，带着无限供给的燃料上路，还篡改了报废期限。


    但这还不是最可怕的。这辆疯狂的跑车，导航系统还是错乱的。'
  - '[PAGE 144]


    咱们平常开车的时候，不认路没关系，因为有导航。


    正常细胞就是按照导航，循规蹈矩，不会乱长。所以，胃里的细胞永远也不会长到鼻子上去。


    但是癌细胞不同，他们能在组织内部和组织间灵活移动，也就是癌症容易发生侵袭和转移的原因。


    好比是癌症跑车拥有了错乱的导航系统，它让汽车不走寻常路。在离开路的地方疯狂奔跑，横冲直撞，撞上墙还撞死人。


    而且这条路本身就是一条不归路，它的终点是带着人体同归于尽，驶向灭亡。


    这就是“癌症跑车”的最后一个环节：错乱的导航。


    到这里，咱们就讲完了癌症发病的六个关键环节。


    你掌握了这六大环节，就能很容易地理解现在所有关于癌症的治疗了。因为，所有这些治疗都是基于这 6 大环节。


    比如，外科手术就好比端掉了汽车加工厂。


    比如，癌症的靶向药多数都是针对错误的图纸，根据基因突变类型，选择靶向治疗药物。不仅效果好，而且副作用小。


    比如，癌症的免疫治疗药物 PD-1 抑制剂，就是恢复警察的敏感性和战斗力，让警察擦亮眼睛，认出癌症跑车。


    再比如，血管内皮生长因子抑制剂，就是针对癌症组织血管丰富的特点，抑制血管生长，也就抑制了肿瘤的生长。


    这些治疗在咱们的课程里都会涉及到。'
  - '[PAGE 145]


    但是有一点你必须知道，所有治疗的前提，都是基于医学对于这六大环节的认知越来越清晰。


    # 划重点


    +   1. 癌症就像一辆“疯狂跑车”，它有六个环节：（1）图纸错误。癌基因造出了癌细胞；

    （2）自检体系失效。癌细胞赖着不死；（3）癌细胞有丰富的血管和独特的能量利用系

    统；（4）免疫逃逸，癌细胞躲过了警察；（5）篡改里程，拒绝报废；（6）导航错乱

    同归于尽。2. 癌症的所有治疗，都是针对这 6 个环节。


    # 思考题


    如果你面临着这么一辆失控的“跑车”，你还有什么方法阻止它吗？


    欢迎发到留言区，咱们一起互动。


    # 下节预告


    下一讲，我们继续学习癌症。导致癌症最大的高危因素是什么？是污染吗？是压力太大

    吗？


    感谢清华大学细胞研究所所长张明徽博士，在本课素材上提供的无私帮助。'
  - '[PAGE 146]


    # 19 ｜ 癌症：时间的老朋友


    2019-3-17


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    上节课，咱们说了癌症发生发展的六个环节，癌细胞就像一辆疯狂跑车，带着人体同归于尽。


    这节课说说导致癌症的危险因素。


    说实话，以前没这么多癌症，咱们小时候很少听说谁得了癌症。


    但是今天，似乎只要是说谁得了大病，那很可能就是癌症，可能你也有同样的感觉。


    根据统计中国每天有 1 万以上的人确诊癌症，平均每分钟就有 7 人。大的综合性医院的多数科室的多数床位，收治的都是癌症病人。


    为什么癌症突然这么多了呢？


    你可能会说是环境污染、食品安全、工作压力、生活方式等等。


    对，这些都是问题。但这些都不是癌症发病最主要的危险因素。


    美国杜克大学李治中博士一直坚持做癌症科普，他说得非常好。


    他说，如果把全世界国家按照癌症发病率排队，癌症发病率最高的都是环境非常好的欧美国家，中国连前几十名都挤不进去。


    你现在还会认为环境是主要问题吗？


    那么，到底什么才是癌症发病最大的危险因素呢？


    接下来，咱们就从近几年引起学术界广泛关注的一个研究讲起。'
  - '[PAGE 147]


    # 癌症最大的危险因素是随机错误


    在上节课，我讲到了癌症最底层的原因就是“图纸”错了，这个错误的“图纸”就是基因突变。癌症必须先有基因突变，这点是共识。


    2017 年《科学》（Science）杂志发表了一篇研究。他们对常见的 32 种癌症的基因突变，进行了危险因素的分析。


    结果出人意料，癌症基因突变最大的危险因素不是环境也不是遗传，而是随机错误。


    听到这，是不是彻底颠覆了你的常识呢？


    这篇研究结果一出，在学术界就引起了巨大的争论。下面，我来解读一下这个研究结果。


    这个研究认为，引起癌症基因突变的因素中，最主要原因是染色体复制过程中发生的随机错误，这个因素占到了 66%。而环境因素和遗传因素，加起来也只占 34%。


    没想到吧？


    咱们原以为没有癌症家族史，不抽烟、不喝酒、不熬夜、不泡吧、不吃污染的食物、不着急不生气，就可以远离癌症。


    现在看来，这些因素和癌症有关系，但是却没你想的那么大。真正的风险是随机错误。


    比如骨癌的基因突变：随机错误占了 99.5%，遗传占 0.5%，与环境因素完全无关。


    再比如，这几年国内高发的甲状腺癌，随机错误占 98%，遗传占 1.5%，环境因素仅占微不足道的 0.5%。有人说碘盐引起了甲状腺癌，是不对的。


    还有非何杰金氏淋巴瘤、脑部肿瘤、前列腺癌、睾丸癌，这些癌症的基因突变中，随机因素都占到了 95%以上。


    什么意思呢？'
  - '[PAGE 148]


    即便我们没有环境污染，没有不良嗜好，生活方式非常健康，这几种癌症还是有很大可能性发生。


    甚至有人说，癌症的基因突变就像“上帝掷色子”，是运气不好。你听起来是不是有种凉飕飕的宿命论的感觉呢？


    下面，咱们就来看看这个随机错误是怎么来的？


    # 癌症是人类长寿的必然代价


    你一定还记得，在前面的课里咱们说过，细胞分裂是人体的一种自我修复机制，是多细胞生物生存的基础。就是细胞分裂带来了随机错误。


    这是怎么回事呢？


    首先，细胞分裂需要染色体先进行复制，然后把遗传信息平均分配到两个新细胞里。


    但是这个工作量太大了，人的基因组有31.6 亿个碱基对，每次分裂这 31.6 亿个碱基对都要复制一次。工作量太大就难免出错，出错了就是随机错误。


    每次细胞分裂都会带来随机错误。随着这些错误不断累积，犯的错就会越来越多，就有可能发生在关键点上变成癌基因。


    这种随机错误，就是细胞分裂的产物。


    所以，细胞分裂次数越多，癌基因发生的几率也就越大。


    细胞的每一次分裂都带来了基因突变，每次突变都有变成癌基因的机会。这个几率虽然极低，但并不是零。


    从这个角度来看，我们生命中的每个时刻都处在患癌的风险中，生命就是一种癌前状态。


    年龄越大，细胞分裂次数也就越多，癌症发生风险也越来越高。'
  - '[PAGE 149]


    数据显示，40 岁以上的人患癌症的风险呈指数倍增长。如果人的寿命达到 85 岁，累计癌症发生风险高达 36%。


    最近，《科学》（Science）杂志上的一篇研究指出，中年人食管的上皮细胞，尽管在显微镜下看起来形态和正常细胞一模一样，但是进行基因分析发现，已经有一半以上的细胞都发生了和癌症相关的基因突变。


    所以，年龄才是引起癌症最大的风险因素。


    咱们再回到最开始提的问题：为什么这些年，癌症突然就多了？


    主要原因并不是因为环境污染，也不是因为食物和工作压力大。而是我们的生活条件好了，医疗条件好了，人的寿命延长了。


    细胞分裂次数多了，基因的随机错误也就越来越多。累积下来，最终带来了癌症的基因突变，所以癌症高发了。


    在过去的 100 年里，人类的平均寿命增长了 30 岁。发达国家人均寿命更长，所以癌症的发生率更高。


    只要活得足够长，每个人都会得癌症。癌症是长寿必须付出的代价。


    癌症就像时间的老朋友，如果咱们越来越长寿，那么这个老朋友说不定哪天就会登门造访了。


    要想不得癌症，只有一个办法，那就是早死。


    # 对待癌症的三条建议


    那么，应该怎么科学理解生命和癌症的关系呢？


    我从医生的角度给你三条建议，咱们尽量让这个老朋友离得远点，尽量晚点来，能不来最好，真来了，也不怕。'
  - '[PAGE 150]


    第一条建议是，去除致癌因素，改变生活方式，仍然可以很大程度下降患癌风险。


    尽管癌症基因突变的最大危险因素是年龄，但是咱们也不能就这样等着。基因突变只是癌症发生的一个环节。


    即使基因突变，也未必发生癌症，人体还有强大的免疫系统。保护免疫系统，减少慢性感染，仍然可以预防大约 40% 左右的癌症。


    降低患癌风险的科建议包括：


    戒烟、戒酒、减肥、多运动、多吃全谷物食品、蔬菜、水果、豆类，少吃糖、少吃红肉（比如猪肉、牛肉、羊肉），这是改变生活方式。


    避免乙肝病毒、丙肝病毒、幽门螺旋杆菌、HPV 病毒感染。已经感染了，要治疗或者定期复查。


    第二条建议是，定期进行疾病筛查。早期发现，早期治疗，具有很大的价值和意义。


    不是每个人都有癌症，但是每个人一定有癌症之前的病变。


    发现这些早期问题，及时治疗，就可以避免这些良性的病变进一步发展成为恶性的癌症。


    举个例子，美国明尼苏达大学癌症检查中心，对 45 岁以上无症状的普通人每年做一次乙状结肠镜检查，见到腺瘤就切除。


    我解释一下，腺瘤就是一种癌前病变，长期发展就可以变成癌症。这样做的结果，就是结肠癌、直肠癌发病率比预期的减少了 85%。


    所以，超过一定年龄之后定期进行科学的筛查，是发达国家总结出来的可行的癌症预防方法。


    筛查的目的在于早点发现这个“不怀好意”的老朋友，还没等它“使坏”的时候，就赶紧把它请走，免得它又带很多“品行不良”的老朋友上门，到时候还得大动干戈。'
  md: "\n所以，控制流行病也不总是把明确病因当做前提，只要把公共卫生做好，很多病都可以预防。\n\n## 公共卫生的效益非即时显现\n\n政府和公共卫生学者通过多个角度推行公共卫生。\n\
    \n比如宣传刷牙、戒烟、洗手、垃圾分类、不随地吐痰、饮用水加氯消毒、在公共场合放置避孕套发放机。\n\n这些看似很普通的举措，其实都是公共卫生的内容。\n\n\
    虽然做了这么多，公共卫生的效益有的可以立刻让你感受到，有的可能要几年或者几十年后才显示出来。\n\n比如刷牙。\n\n可能我们小时候都不爱刷牙。父母就会说，不刷牙同学会说你口臭，还会长龋齿，会得牙周炎，以后老了就没牙了。\n\
    \n但是，刷牙这个事并不简单，口腔卫生是公共卫生工作的一个主要内容。\n\n最初主张全民刷牙的是蒋介石的“新生活运动”。\n\n根据最新研究显示，口腔健康与心血管疾病、糖尿病、肝病等多种疾病有关，尤其是心血管疾病。\n\
    \n每天多刷一次牙，心血管疾病的风险可以降低 9%。定期看牙医并且进行专业牙齿清洁的人，心血管疾病的风险降低 14%。保持口腔清洁，还有利于预防老年痴呆症。\n\
    \n所以，现在认真刷牙，不仅是为了口腔清洁和不得牙病，而且在几十年后还能带来更大效益，只是当下没有感受到而已。\n\n有的效益可能咱们一辈子也感受不到。比如公共卫生已经消灭的很多烈性疾病，我们大多是从历史书上知道的，包括天花。\n\
    \n这就是公共卫生的第一个特点：效益非即时显现。\n\n## 群体利益和个体风险权衡的结果\n\n比如打疫苗。\n\n极个别人会出现疫苗的不良反应，但是不可能因为这些极少见的个体反应，整个人群就停止打疫苗。\n\
    \n疫苗保护人群依靠的是群体免疫效应。\n\n大家都打疫苗，才会起到最大保护效益，只有部分人打则会失效。\n\n比如麻疹疫苗，只有在接种率达到 90%以上的时候，才会对大家集体保护。\n\
    \n当然，随着科学技术不断突破，群体利益会越来越大，同时个体风险会越来越小。\n\n## 人类性价比最高的健康工程\n\n治病的代价远远大于预防。\n\n\
    比如碘缺乏会引起地方性甲状腺肿，也就是“大脖子病”，还会引发儿童呆小症、智力发育缺陷等。\n\n从 1995 年开始，咱们国家推行含碘盐，这就是一项重要的公共卫生政策。\n\
    \n可能有人说，我就不吃，自己得病我不怕。\n\n如果每个人都这么想，整体代价就太大了。\n\n得病可能会让家庭失去劳动力，进而陷入贫困。对社会而言，得病的人多会消耗大量的医疗资源，很多更严重的病可能会因为缺乏医疗资源而耽误救治，社会将损失生产力。\n\
    \n疾病预防，永远是性价比最高的举措。\n\n公共卫生领域还是谣言最多的领域。因为短期内看不到效益，所以，谣言也就有了立足的空间。\n\n还拿含碘盐来说，有人认为补碘补得这些年甲状腺癌高发了。\n\
    \n那么，事实呢？\n\n我可以告诉你，并不是甲状腺癌高发了，而是检测手段灵敏了，也就是发现的多。\n\n补碘和甲状腺癌并没有明确的相关性。\n\n中国 75%\
    \ 的地区属于缺碘地区，一旦停止含碘盐，就会重蹈印度的覆辙。\n\n印度就曾经停止推行含碘盐，导致碘缺乏病又重新出现，国家不得不恢复食盐加碘。这是前车之鉴。\n\
    \n公共卫生的效益，有的咱们已经看到了，有的可能要等到几十年后才能看到，有的可能咱们这辈子永远也看不到。\n\n最后，我想请你记住这几组数字：\n\n- 1979\
    \ 年，人类消灭天花。它是第一个在世上绝迹的人类传染病；\n- 2010 年，全世界基本实现使用改良过的饮用水源；\n- 2001 年-2013 年，全球艾滋病病毒感染新发病例减少了\
    \ 38%；\n- 2016 年，全球小儿麻痹症病例只剩 37 例，相比 1988 年的 35 万例，减少了 99%。\n\n## 划重点\n\n1. 公共卫生利用公共管理机制，保证最大多数人的利益。\n\
    2. 建立公共卫生体系，付出过血的代价。\n3. 公共卫生三个特点：效益非即时显现，群体利益和个体风险的权衡，性价比最高。\n\n## 思考题\n\n你还知道有哪些公共卫生举措，改变了咱们的生活？\n\
    \n欢迎发到留言区，一起交流。\n\n## 下节预告\n\n下节课，咱们会进入新的一章，说说那些需要被重新认知的病。\n\n# 18 | 癌的生成机制: 同归于尽的疯狂跑车\n\
    \n2019-03-16\n\n你好, 欢迎来到《医学通识 50 讲》, 我是薄世宁。\n\n这节课开始进入新的一章。\n\n在这一章, 咱们讲讲虽然常见,\
    \ 但是经常容易被误解, 需要你重新认知的疾病。\n\n今天这节课, 从人类的“第一杀手”——癌症讲起。\n\n你可能会认为癌症是突然的灾难, 但是癌症的发生却是一个漫长的过程,\
    \ 是在六大环节上出了问题。\n\n我认为论述癌症特点最经典的, 是 2011 年美国的罗伯特·温伯格院士 (Robert Allan Weinberg)\
    \ 发表在《细胞》(Cell) 杂志上的一篇文章。\n\n迄今为止, 这篇文章已经被引用上万次, 被认为是最受欢迎的癌症综述第一名。全世界所有研究癌症的人,\
    \ 没有一个没读过这篇文章。\n\n但是原文 29 页, 专业词汇也太多。我就以这篇文章作基础, 帮你捋清癌症发生发展的六大环节。\n\n听完这节课, 你就可以掌握癌症发病的核心原理,\
    \ 对癌症有一个完整的认知了。\n\n你觉得癌细胞像什么? 我觉得它是一辆“疯狂的跑车”。\n\n为什么说疯狂呢? 它不按常理、没有规律、不听指挥, 就像疯了一样。\n\
    \n为什么说是跑车呢? 它跑得快、油耗大, 一旦出事, 损害巨大。\n\n“癌症跑车”这个词, 我认为是对癌细胞最贴切的比喻。\n\n## 第一个环节：错误的图纸和订单\n\
    \n我们知道汽车制造需要正确的图纸和订单，根据图纸加工，根据订单决定加工数量。\n\n图纸决定造成什么样，订单决定造多少。\n\n但是，癌细胞从这最开始就错了。\n\
    \n先是图纸错了，具体到细胞上也就是基因错了。正常的基因突变成癌基因了，按照这个图纸怎么能生产出好汽车呢？\n\n我们把癌基因这张图纸生产出来的汽车，叫做“癌症跑车”。\n\
    \n偶尔有一辆“癌症跑车”出厂不可怕，怕就怕数量太多。\n\n正常细胞生长分裂需要生长信号，同时还有抑制信号防止过度生长。\n\n癌细胞一个最大的特点就是生长信号多，而且对抑制信号不敏感。所以，癌细胞长得快，不停地长。\n\
    \n这就好像是生产车间乱套了，自己伪造了生产信号和订单。同时，对于调度发出的停工信号置若罔闻。\n\n所以，按照这种错误的图纸，源源不断地生产出了大量的“癌症跑车”。\n\
    \n这就是癌症的第一个环节。\n\n汽车生产出来以后，下一个环节一定是自检，否则不合格的汽车就会流入市场。\n\n## 第二个环节：失效的自检体系\n\n\
    通常，对于不合格的劣质汽车，常用做法是进行销毁，免得让车出去害人。\n\n具体到人体，人体每天都会产生不合格的细胞。\n\n因此，人体有一种细胞凋亡机制，目的是让这些不合格细胞自我销毁。\n\
    \n就像花朵到了一定时候就该凋谢一样，细胞的凋亡就是细胞的程序性死亡，它是人体防止细胞癌变的一种主要机制。\n\n但是现在，这个机制失灵了。\n\n指挥细胞进行凋亡，也就是让细胞自杀物质是抑癌基因（tumor\
    \ suppressor genes），顾名思义，就是抑制癌症的基因。它指挥细胞赶紧自杀，别害人。著名的 P53 就是一种抑癌基因。\n\n如果抑癌基因发生突变了，那么这些本来应该自杀的细胞就会赖着不死。\n\
    \n这就好比是，虽然检测到了癌症跑车不合格，却没有能力让它自我销毁，这辆害人的汽车该上路了，这个自检体系失效了。\n\n## 第三个环节：灵活的能量供应\n\
    \n其实，上了路也不要紧，这种疯狂跑车跑得快、油耗大，需要随时加油。所以，如果路上没有加油站，车跑不了太远就得熄火。\n\n对于细胞来说，血管就是加油站。\n\
    \n正常情况下，一个细胞和它最近的毛细血管的距离不能超过 100 微米，也就是 0.1 毫米。太远了营养够不着，相当于汽车没油了，必须得在附近找个加油站，否则就得熄火。\n\
    \n但是，癌细胞特别灵活。\n\n癌症的时候，促进血管形成的信号增多，而抑制血管形成的信号减少。这样，就有持续的新生血管形成，源源不断地给肿瘤组织供血。\n\
    \n这就好比是，\"癌症跑车\"上路，既然找不到固定的加油站，那么就自带移动的加油枪，随时供应燃料，保证疯狂奔跑。\n\n所以在临床上，多数恶性肿瘤通常都是血流丰富。医生们甚至用这个特点区分良性和恶性。\n\
    \n“癌症跑车”不仅能随时加油，而且它的燃料利用系统也比正常汽车厉害。\n\n癌细胞不论在有氧还是无氧环境下，都可以迅速产生能量，供应自身的能量需求。\n\n\
    有了油，又有灵活的能量供应机制，这辆跑车彻底疯了，谁也不服了。这就是第三个环节：灵活的能量供应。\n\n这个时候，按照癌基因图纸生产出来的疯狂跑车，躲过了自我销毁，还自带加油枪，似乎是无敌了。\n\
    \n## 第四个环节：迟钝的警察\n\n你可能会问，不是还有警察吗？\n\n没错，正常情况下人体的免疫细胞就是警察，它们会主动寻找和攻击癌细胞。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_142_0.png)\n\
    \n电子显微镜下拍摄的T细胞（红）攻击癌细胞（绿）\n\n但是警察这一关，癌细胞居然也闯过去了。\n\n它会伪造一张\"假身份证\"，躲过警察的检查设备，顺利闯关，逃过警察的盘查和杀伤。这种机制叫做免疫逃逸。\n\
    \n在狡猾的癌细胞面前，咱们人体免疫这个警察迟钝了。这就是癌症发病的第四个环节：迟钝的警察。\n\n## 第五个环节：篡改的里程\n\n其实，即使\"癌症跑车\"\
    侥幸闯关迷惑了警察，也并不是那么可怕。因为每个汽车跑到一定里程，也该报废了。就像正常细胞分裂是有限度的。\n\n2009 年，这个机制的发现获得了诺贝尔医学奖，这就是染色体末端都有端粒。\n\
    \n每次细胞分裂，端粒就缩短一部分。正常细胞分裂 50 次左右，端粒也就消耗光了。没有了端粒，细胞只能死。\n\n所以，每个细胞的分裂极限就相当于里程报废。\n\
    \n但是癌细胞不同，它的细胞里有种酶，可以不断地补充端粒的长度，保证癌细胞可以无限次分裂。\n\n还用汽车比喻。正常情况下每一个汽车都有报废里程，端粒就好比是里程，等损耗到一定程度端粒就消失了，那这个汽车就必须强制报废。\n\
    \n但是，\"癌症跑车\"会不断地篡改里程，也就是不断地延长端粒长度，这样就巧妙地避免了报废。这就是癌症的第五个环节：篡改的里程。\n\n## 第六个环节：错乱的导航\n\
    \n你能想象吗？一辆不合格的坏车，躲过了自检，骗过了警察，带着无限供给的燃料上路，还篡改了报废期限。\n\n但这还不是最可怕的。这辆疯狂的跑车，导航系统还是错乱的。\n\
    \n咱们平常开车的时候，不认路没关系，因为有导航。\n\n正常细胞就是按照导航，循规蹈矩，不会乱长。所以，胃里的细胞永远也不会长到鼻子上去。\n\n但是癌细胞不同，他们能在组织内部和组织间灵活移动，也就是癌症容易发生侵袭和转移的原因。\n\
    \n好比是癌症跑车拥有了错乱的导航系统，它让汽车不走寻常路。在离开路的地方疯狂奔跑，横冲直撞，撞上墙还撞死人。\n\n而且这条路本身就是一条不归路，它的终点是带着人体同归于尽，驶向灭亡。\n\
    \n这就是“癌症跑车”的最后一个环节：错乱的导航。\n\n到这里，咱们就讲完了癌症发病的六个关键环节。\n\n你掌握了这六大环节，就能很容易地理解现在所有关于癌症的治疗了。因为，所有这些治疗都是基于这\
    \ 6 大环节。\n\n比如，外科手术就好比端掉了汽车加工厂。\n\n比如，癌症的靶向药多数都是针对错误的图纸，根据基因突变类型，选择靶向治疗药物。不仅效果好，而且副作用小。\n\
    \n比如，癌症的免疫治疗药物 PD-1 抑制剂，就是恢复警察的敏感性和战斗力，让警察擦亮眼睛，认出癌症跑车。\n\n再比如，血管内皮生长因子抑制剂，就是针对癌症组织血管丰富的特点，抑制血管生长，也就抑制了肿瘤的生长。\n\
    \n这些治疗在咱们的课程里都会涉及到。\n\n但是有一点你必须知道，所有治疗的前提，都是基于医学对于这六大环节的认知越来越清晰。\n\n## 划重点\n\n\
    1. 癌症就像一辆“疯狂跑车”，它有六个环节：\n   - （1）图纸错误。癌基因造出了癌细胞；\n   - （2）自检体系失效。癌细胞赖着不死；\n  \
    \ - （3）癌细胞有丰富的血管和独特的能量利用系统；\n   - （4）免疫逃逸，癌细胞躲过了警察；\n   - （5）篡改里程，拒绝报废；\n   -\
    \ （6）导航错乱，同归于尽。\n2. 癌症的所有治疗，都是针对这 6 个环节。\n\n## 思考题\n\n如果你面临着这么一辆失控的“跑车”，你还有什么方法阻止它吗？\n\
    \n欢迎发到留言区，咱们一起互动。\n\n## 下节预告\n\n下一讲，我们继续学习癌症。导致癌症最大的高危因素是什么？是污染吗？是压力太大吗？\n\n感谢清华大学细胞研究所所长张明徽博士，在本课素材上提供的无私帮助。\n\
    \n# 19 ｜ 癌症：时间的老朋友\n\n2019-3-17\n\n你好，欢迎来到《医学通识 50 讲》，我是薄世宁。\n\n上节课，咱们说了癌症发生发展的六个环节，癌细胞就像一辆疯狂跑车，带着人体同归于尽。\n\
    \n这节课说说导致癌症的危险因素。\n\n说实话，以前没这么多癌症，咱们小时候很少听说谁得了癌症。\n\n但是今天，似乎只要是说谁得了大病，那很可能就是癌症，可能你也有同样的感觉。\n\
    \n根据统计中国每天有 1 万以上的人确诊癌症，平均每分钟就有 7 人。大的综合性医院的多数科室的多数床位，收治的都是癌症病人。\n\n为什么癌症突然这么多了呢？\n\
    \n你可能会说是环境污染、食品安全、工作压力、生活方式等等。\n\n对，这些都是问题。但这些都不是癌症发病最主要的危险因素。\n\n美国杜克大学李治中博士一直坚持做癌症科普，他说得非常好。\n\
    \n他说，如果把全世界国家按照癌症发病率排队，癌症发病率最高的都是环境非常好的欧美国家，中国连前几十名都挤不进去。\n\n你现在还会认为环境是主要问题吗？\n\
    \n那么，到底什么才是癌症发病最大的危险因素呢？\n\n接下来，咱们就从近几年引起学术界广泛关注的一个研究讲起。\n\n## 癌症最大的危险因素是随机错误\n\
    \n在上节课，我讲到了癌症最底层的原因就是“图纸”错了，这个错误的“图纸”就是基因突变。癌症必须先有基因突变，这点是共识。\n\n2017 年《科学》（Science）杂志发表了一篇研究。他们对常见的\
    \ 32 种癌症的基因突变，进行了危险因素的分析。\n\n结果出人意料，癌症基因突变最大的危险因素不是环境也不是遗传，而是随机错误。\n\n听到这，是不是彻底颠覆了你的常识呢？\n\
    \n这篇研究结果一出，在学术界就引起了巨大的争论。下面，我来解读一下这个研究结果。\n\n这个研究认为，引起癌症基因突变的因素中，最主要原因是染色体复制过程中发生的随机错误，这个因素占到了\
    \ 66%。而环境因素和遗传因素，加起来也只占 34%。\n\n没想到吧？\n\n咱们原以为没有癌症家族史，不抽烟、不喝酒、不熬夜、不泡吧、不吃污染的食物、不着急不生气，就可以远离癌症。\n\
    \n现在看来，这些因素和癌症有关系，但是却没你想的那么大。真正的风险是随机错误。\n\n比如骨癌的基因突变：随机错误占了 99.5%，遗传占 0.5%，与环境因素完全无关。\n\
    \n再比如，这几年国内高发的甲状腺癌，随机错误占 98%，遗传占 1.5%，环境因素仅占微不足道的 0.5%。有人说碘盐引起了甲状腺癌，是不对的。\n\n\
    还有非何杰金氏淋巴瘤、脑部肿瘤、前列腺癌、睾丸癌，这些癌症的基因突变中，随机因素都占到了 95%以上。\n\n什么意思呢？\n\n即便我们没有环境污染，没有不良嗜好，生活方式非常健康，这几种癌症还是有很大可能性发生。\n\
    \n甚至有人说，癌症的基因突变就像“上帝掷色子”，是运气不好。你听起来是不是有种凉飕飕的宿命论的感觉呢？\n\n下面，咱们就来看看这个随机错误是怎么来的？\n\
    \n## 癌症是人类长寿的必然代价\n\n你一定还记得，在前面的课里咱们说过，细胞分裂是人体的一种自我修复机制，是多细胞生物生存的基础。就是细胞分裂带来了随机错误。\n\
    \n这是怎么回事呢？\n\n首先，细胞分裂需要染色体先进行复制，然后把遗传信息平均分配到两个新细胞里。\n\n但是这个工作量太大了，人的基因组有31.6 亿个碱基对，每次分裂这\
    \ 31.6 亿个碱基对都要复制一次。工作量太大就难免出错，出错了就是随机错误。\n\n每次细胞分裂都会带来随机错误。随着这些错误不断累积，犯的错就会越来越多，就有可能发生在关键点上变成癌基因。\n\
    \n这种随机错误，就是细胞分裂的产物。\n\n所以，细胞分裂次数越多，癌基因发生的几率也就越大。\n\n细胞的每一次分裂都带来了基因突变，每次突变都有变成癌基因的机会。这个几率虽然极低，但并不是零。\n\
    \n从这个角度来看，我们生命中的每个时刻都处在患癌的风险中，生命就是一种癌前状态。\n\n年龄越大，细胞分裂次数也就越多，癌症发生风险也越来越高。\n\n\
    数据显示，40 岁以上的人患癌症的风险呈指数倍增长。如果人的寿命达到 85 岁，累计癌症发生风险高达 36%。\n\n最近，《科学》（Science）杂志上的一篇研究指出，中年人食管的上皮细胞，尽管在显微镜下看起来形态和正常细胞一模一样，但是进行基因分析发现，已经有一半以上的细胞都发生了和癌症相关的基因突变。\n\
    \n所以，年龄才是引起癌症最大的风险因素。\n\n咱们再回到最开始提的问题：为什么这些年，癌症突然就多了？\n\n主要原因并不是因为环境污染，也不是因为食物和工作压力大。而是我们的生活条件好了，医疗条件好了，人的寿命延长了。\n\
    \n细胞分裂次数多了，基因的随机错误也就越来越多。累积下来，最终带来了癌症的基因突变，所以癌症高发了。\n\n在过去的 100 年里，人类的平均寿命增长了\
    \ 30 岁。发达国家人均寿命更长，所以癌症的发生率更高。\n\n只要活得足够长，每个人都会得癌症。癌症是长寿必须付出的代价。\n\n癌症就像时间的老朋友，如果咱们越来越长寿，那么这个老朋友说不定哪天就会登门造访了。\n\
    \n要想不得癌症，只有一个办法，那就是早死。\n\n## 对待癌症的三条建议\n\n那么，应该怎么科学理解生命和癌症的关系呢？\n\n我从医生的角度给你三条建议，咱们尽量让这个老朋友离得远点，尽量晚点来，能不来最好，真来了，也不怕。\n\
    \n第一条建议是，去除致癌因素，改变生活方式，仍然可以很大程度下降患癌风险。\n\n尽管癌症基因突变的最大危险因素是年龄，但是咱们也不能就这样等着。基因突变只是癌症发生的一个环节。\n\
    \n即使基因突变，也未必发生癌症，人体还有强大的免疫系统。保护免疫系统，减少慢性感染，仍然可以预防大约 40% 左右的癌症。\n\n降低患癌风险的科建议包括：\n\
    \n- 戒烟、戒酒、减肥、多运动、多吃全谷物食品、蔬菜、水果、豆类，少吃糖、少吃红肉（比如猪肉、牛肉、羊肉），这是改变生活方式。\n- 避免乙肝病毒、丙肝病毒、幽门螺旋杆菌、HPV\
    \ 病毒感染。已经感染了，要治疗或者定期复查。\n\n第二条建议是，定期进行疾病筛查。早期发现，早期治疗，具有很大的价值和意义。\n\n不是每个人都有癌症，但是每个人一定有癌症之前的病变。\n\
    \n发现这些早期问题，及时治疗，就可以避免这些良性的病变进一步发展成为恶性的癌症。\n\n举个例子，美国明尼苏达大学癌症检查中心，对 45 岁以上无症状的普通人每年做一次乙状结肠镜检查，见到腺瘤就切除。\n\
    \n我解释一下，腺瘤就是一种癌前病变，长期发展就可以变成癌症。这样做的结果，就是结肠癌、直肠癌发病率比预期的减少了 85%。\n\n所以，超过一定年龄之后定期进行科学的筛查，是发达国家总结出来的可行的癌症预防方法。\n\
    \n筛查的目的在于早点发现这个“不怀好意”的老朋友，还没等它“使坏”的时候，就赶紧把它请走，免得它又带很多“品行不良”的老朋友上门，到时候还得大动干戈。\n"
  mdcn: "\n所以，控制流行病也不总是把明确病因当做前提，只要把公共卫生做好，很多病都可以预防。\n\n## 公共卫生的效益非即时显现\n\n政府和公共卫生学者通过多个角度推行公共卫生。\n\
    \n比如宣传刷牙、戒烟、洗手、垃圾分类、不随地吐痰、饮用水加氯消毒、在公共场合放置避孕套发放机。\n\n这些看似很普通的举措，其实都是公共卫生的内容。\n\n\
    虽然做了这么多，公共卫生的效益有的可以立刻让你感受到，有的可能要几年或者几十年后才显示出来。\n\n比如刷牙。\n\n可能我们小时候都不爱刷牙。父母就会说，不刷牙同学会说你口臭，还会长龋齿，会得牙周炎，以后老了就没牙了。\n\
    \n但是，刷牙这个事并不简单，口腔卫生是公共卫生工作的一个主要内容。\n\n最初主张全民刷牙的是蒋介石的“新生活运动”。\n\n根据最新研究显示，口腔健康与心血管疾病、糖尿病、肝病等多种疾病有关，尤其是心血管疾病。\n\
    \n每天多刷一次牙，心血管疾病的风险可以降低 9%。定期看牙医并且进行专业牙齿清洁的人，心血管疾病的风险降低 14%。保持口腔清洁，还有利于预防老年痴呆症。\n\
    \n所以，现在认真刷牙，不仅是为了口腔清洁和不得牙病，而且在几十年后还能带来更大效益，只是当下没有感受到而已。\n\n有的效益可能咱们一辈子也感受不到。比如公共卫生已经消灭的很多烈性疾病，我们大多是从历史书上知道的，包括天花。\n\
    \n这就是公共卫生的第一个特点：效益非即时显现。\n\n## 群体利益和个体风险权衡的结果\n\n比如打疫苗。\n\n极个别人会出现疫苗的不良反应，但是不可能因为这些极少见的个体反应，整个人群就停止打疫苗。\n\
    \n疫苗保护人群依靠的是群体免疫效应。\n\n大家都打疫苗，才会起到最大保护效益，只有部分人打则会失效。\n\n比如麻疹疫苗，只有在接种率达到 90%以上的时候，才会对大家集体保护。\n\
    \n当然，随着科学技术不断突破，群体利益会越来越大，同时个体风险会越来越小。\n\n## 人类性价比最高的健康工程\n\n治病的代价远远大于预防。\n\n\
    比如碘缺乏会引起地方性甲状腺肿，也就是“大脖子病”，还会引发儿童呆小症、智力发育缺陷等。\n\n从 1995 年开始，咱们国家推行含碘盐，这就是一项重要的公共卫生政策。\n\
    \n可能有人说，我就不吃，自己得病我不怕。\n\n如果每个人都这么想，整体代价就太大了。\n\n得病可能会让家庭失去劳动力，进而陷入贫困。对社会而言，得病的人多会消耗大量的医疗资源，很多更严重的病可能会因为缺乏医疗资源而耽误救治，社会将损失生产力。\n\
    \n疾病预防，永远是性价比最高的举措。\n\n公共卫生领域还是谣言最多的领域。因为短期内看不到效益，所以，谣言也就有了立足的空间。\n\n还拿含碘盐来说，有人认为补碘补得这些年甲状腺癌高发了。\n\
    \n那么，事实呢？\n\n我可以告诉你，并不是甲状腺癌高发了，而是检测手段灵敏了，也就是发现的多。\n\n补碘和甲状腺癌并没有明确的相关性。\n\n中国 75%\
    \ 的地区属于缺碘地区，一旦停止含碘盐，就会重蹈印度的覆辙。\n\n印度就曾经停止推行含碘盐，导致碘缺乏病又重新出现，国家不得不恢复食盐加碘。这是前车之鉴。\n\
    \n公共卫生的效益，有的咱们已经看到了，有的可能要等到几十年后才能看到，有的可能咱们这辈子永远也看不到。\n\n最后，我想请你记住这几组数字：\n\n- 1979\
    \ 年，人类消灭天花。它是第一个在世上绝迹的人类传染病；\n- 2010 年，全世界基本实现使用改良过的饮用水源；\n- 2001 年-2013 年，全球艾滋病病毒感染新发病例减少了\
    \ 38%；\n- 2016 年，全球小儿麻痹症病例只剩 37 例，相比 1988 年的 35 万例，减少了 99%。\n\n## 划重点\n\n1. 公共卫生利用公共管理机制，保证最大多数人的利益。\n\
    2. 建立公共卫生体系，付出过血的代价。\n3. 公共卫生三个特点：效益非即时显现，群体利益和个体风险的权衡，性价比最高。\n\n## 思考题\n\n你还知道有哪些公共卫生举措，改变了咱们的生活？\n\
    \n欢迎发到留言区，一起交流。\n\n## 下节预告\n\n下节课，咱们会进入新的一章，说说那些需要被重新认知的病。\n\n# 18 | 癌的生成机制: 同归于尽的疯狂跑车\n\
    \n2019-03-16\n\n你好, 欢迎来到《医学通识 50 讲》, 我是薄世宁。\n\n这节课开始进入新的一章。\n\n在这一章, 咱们讲讲虽然常见,\
    \ 但是经常容易被误解, 需要你重新认知的疾病。\n\n今天这节课, 从人类的“第一杀手”——癌症讲起。\n\n你可能会认为癌症是突然的灾难, 但是癌症的发生却是一个漫长的过程,\
    \ 是在六大环节上出了问题。\n\n我认为论述癌症特点最经典的, 是 2011 年美国的罗伯特·温伯格院士 (Robert Allan Weinberg)\
    \ 发表在《细胞》(Cell) 杂志上的一篇文章。\n\n迄今为止, 这篇文章已经被引用上万次, 被认为是最受欢迎的癌症综述第一名。全世界所有研究癌症的人,\
    \ 没有一个没读过这篇文章。\n\n但是原文 29 页, 专业词汇也太多。我就以这篇文章作基础, 帮你捋清癌症发生发展的六大环节。\n\n听完这节课, 你就可以掌握癌症发病的核心原理,\
    \ 对癌症有一个完整的认知了。\n\n你觉得癌细胞像什么? 我觉得它是一辆“疯狂的跑车”。\n\n为什么说疯狂呢? 它不按常理、没有规律、不听指挥, 就像疯了一样。\n\
    \n为什么说是跑车呢? 它跑得快、油耗大, 一旦出事, 损害巨大。\n\n“癌症跑车”这个词, 我认为是对癌细胞最贴切的比喻。\n\n## 第一个环节：错误的图纸和订单\n\
    \n我们知道汽车制造需要正确的图纸和订单，根据图纸加工，根据订单决定加工数量。\n\n图纸决定造成什么样，订单决定造多少。\n\n但是，癌细胞从这最开始就错了。\n\
    \n先是图纸错了，具体到细胞上也就是基因错了。正常的基因突变成癌基因了，按照这个图纸怎么能生产出好汽车呢？\n\n我们把癌基因这张图纸生产出来的汽车，叫做“癌症跑车”。\n\
    \n偶尔有一辆“癌症跑车”出厂不可怕，怕就怕数量太多。\n\n正常细胞生长分裂需要生长信号，同时还有抑制信号防止过度生长。\n\n癌细胞一个最大的特点就是生长信号多，而且对抑制信号不敏感。所以，癌细胞长得快，不停地长。\n\
    \n这就好像是生产车间乱套了，自己伪造了生产信号和订单。同时，对于调度发出的停工信号置若罔闻。\n\n所以，按照这种错误的图纸，源源不断地生产出了大量的“癌症跑车”。\n\
    \n这就是癌症的第一个环节。\n\n汽车生产出来以后，下一个环节一定是自检，否则不合格的汽车就会流入市场。\n\n## 第二个环节：失效的自检体系\n\n\
    通常，对于不合格的劣质汽车，常用做法是进行销毁，免得让车出去害人。\n\n具体到人体，人体每天都会产生不合格的细胞。\n\n因此，人体有一种细胞凋亡机制，目的是让这些不合格细胞自我销毁。\n\
    \n就像花朵到了一定时候就该凋谢一样，细胞的凋亡就是细胞的程序性死亡，它是人体防止细胞癌变的一种主要机制。\n\n但是现在，这个机制失灵了。\n\n指挥细胞进行凋亡，也就是让细胞自杀物质是抑癌基因（tumor\
    \ suppressor genes），顾名思义，就是抑制癌症的基因。它指挥细胞赶紧自杀，别害人。著名的 P53 就是一种抑癌基因。\n\n如果抑癌基因发生突变了，那么这些本来应该自杀的细胞就会赖着不死。\n\
    \n这就好比是，虽然检测到了癌症跑车不合格，却没有能力让它自我销毁，这辆害人的汽车该上路了，这个自检体系失效了。\n\n## 第三个环节：灵活的能量供应\n\
    \n其实，上了路也不要紧，这种疯狂跑车跑得快、油耗大，需要随时加油。所以，如果路上没有加油站，车跑不了太远就得熄火。\n\n对于细胞来说，血管就是加油站。\n\
    \n正常情况下，一个细胞和它最近的毛细血管的距离不能超过 100 微米，也就是 0.1 毫米。太远了营养够不着，相当于汽车没油了，必须得在附近找个加油站，否则就得熄火。\n\
    \n但是，癌细胞特别灵活。\n\n癌症的时候，促进血管形成的信号增多，而抑制血管形成的信号减少。这样，就有持续的新生血管形成，源源不断地给肿瘤组织供血。\n\
    \n这就好比是，\"癌症跑车\"上路，既然找不到固定的加油站，那么就自带移动的加油枪，随时供应燃料，保证疯狂奔跑。\n\n所以在临床上，多数恶性肿瘤通常都是血流丰富。医生们甚至用这个特点区分良性和恶性。\n\
    \n“癌症跑车”不仅能随时加油，而且它的燃料利用系统也比正常汽车厉害。\n\n癌细胞不论在有氧还是无氧环境下，都可以迅速产生能量，供应自身的能量需求。\n\n\
    有了油，又有灵活的能量供应机制，这辆跑车彻底疯了，谁也不服了。这就是第三个环节：灵活的能量供应。\n\n这个时候，按照癌基因图纸生产出来的疯狂跑车，躲过了自我销毁，还自带加油枪，似乎是无敌了。\n\
    \n## 第四个环节：迟钝的警察\n\n你可能会问，不是还有警察吗？\n\n没错，正常情况下人体的免疫细胞就是警察，它们会主动寻找和攻击癌细胞。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_142_0.png)\n\
    \n电子显微镜下拍摄的T细胞（红）攻击癌细胞（绿）\n\n但是警察这一关，癌细胞居然也闯过去了。\n\n它会伪造一张\"假身份证\"，躲过警察的检查设备，顺利闯关，逃过警察的盘查和杀伤。这种机制叫做免疫逃逸。\n\
    \n在狡猾的癌细胞面前，咱们人体免疫这个警察迟钝了。这就是癌症发病的第四个环节：迟钝的警察。\n\n## 第五个环节：篡改的里程\n\n其实，即使\"癌症跑车\"\
    侥幸闯关迷惑了警察，也并不是那么可怕。因为每个汽车跑到一定里程，也该报废了。就像正常细胞分裂是有限度的。\n\n2009 年，这个机制的发现获得了诺贝尔医学奖，这就是染色体末端都有端粒。\n\
    \n每次细胞分裂，端粒就缩短一部分。正常细胞分裂 50 次左右，端粒也就消耗光了。没有了端粒，细胞只能死。\n\n所以，每个细胞的分裂极限就相当于里程报废。\n\
    \n但是癌细胞不同，它的细胞里有种酶，可以不断地补充端粒的长度，保证癌细胞可以无限次分裂。\n\n还用汽车比喻。正常情况下每一个汽车都有报废里程，端粒就好比是里程，等损耗到一定程度端粒就消失了，那这个汽车就必须强制报废。\n\
    \n但是，\"癌症跑车\"会不断地篡改里程，也就是不断地延长端粒长度，这样就巧妙地避免了报废。这就是癌症的第五个环节：篡改的里程。\n\n## 第六个环节：错乱的导航\n\
    \n你能想象吗？一辆不合格的坏车，躲过了自检，骗过了警察，带着无限供给的燃料上路，还篡改了报废期限。\n\n但这还不是最可怕的。这辆疯狂的跑车，导航系统还是错乱的。\n\
    \n咱们平常开车的时候，不认路没关系，因为有导航。\n\n正常细胞就是按照导航，循规蹈矩，不会乱长。所以，胃里的细胞永远也不会长到鼻子上去。\n\n但是癌细胞不同，他们能在组织内部和组织间灵活移动，也就是癌症容易发生侵袭和转移的原因。\n\
    \n好比是癌症跑车拥有了错乱的导航系统，它让汽车不走寻常路。在离开路的地方疯狂奔跑，横冲直撞，撞上墙还撞死人。\n\n而且这条路本身就是一条不归路，它的终点是带着人体同归于尽，驶向灭亡。\n\
    \n这就是“癌症跑车”的最后一个环节：错乱的导航。\n\n到这里，咱们就讲完了癌症发病的六个关键环节。\n\n你掌握了这六大环节，就能很容易地理解现在所有关于癌症的治疗了。因为，所有这些治疗都是基于这\
    \ 6 大环节。\n\n比如，外科手术就好比端掉了汽车加工厂。\n\n比如，癌症的靶向药多数都是针对错误的图纸，根据基因突变类型，选择靶向治疗药物。不仅效果好，而且副作用小。\n\
    \n比如，癌症的免疫治疗药物 PD-1 抑制剂，就是恢复警察的敏感性和战斗力，让警察擦亮眼睛，认出癌症跑车。\n\n再比如，血管内皮生长因子抑制剂，就是针对癌症组织血管丰富的特点，抑制血管生长，也就抑制了肿瘤的生长。\n\
    \n这些治疗在咱们的课程里都会涉及到。\n\n但是有一点你必须知道，所有治疗的前提，都是基于医学对于这六大环节的认知越来越清晰。\n\n## 划重点\n\n\
    1. 癌症就像一辆“疯狂跑车”，它有六个环节：\n   - （1）图纸错误。癌基因造出了癌细胞；\n   - （2）自检体系失效。癌细胞赖着不死；\n  \
    \ - （3）癌细胞有丰富的血管和独特的能量利用系统；\n   - （4）免疫逃逸，癌细胞躲过了警察；\n   - （5）篡改里程，拒绝报废；\n   -\
    \ （6）导航错乱，同归于尽。\n2. 癌症的所有治疗，都是针对这 6 个环节。\n\n## 思考题\n\n如果你面临着这么一辆失控的“跑车”，你还有什么方法阻止它吗？\n\
    \n欢迎发到留言区，咱们一起互动。\n\n## 下节预告\n\n下一讲，我们继续学习癌症。导致癌症最大的高危因素是什么？是污染吗？是压力太大吗？\n\n感谢清华大学细胞研究所所长张明徽博士，在本课素材上提供的无私帮助。\n\
    \n# 19 ｜ 癌症：时间的老朋友\n\n2019-3-17\n\n你好，欢迎来到《医学通识 50 讲》，我是薄世宁。\n\n上节课，咱们说了癌症发生发展的六个环节，癌细胞就像一辆疯狂跑车，带着人体同归于尽。\n\
    \n这节课说说导致癌症的危险因素。\n\n说实话，以前没这么多癌症，咱们小时候很少听说谁得了癌症。\n\n但是今天，似乎只要是说谁得了大病，那很可能就是癌症，可能你也有同样的感觉。\n\
    \n根据统计中国每天有 1 万以上的人确诊癌症，平均每分钟就有 7 人。大的综合性医院的多数科室的多数床位，收治的都是癌症病人。\n\n为什么癌症突然这么多了呢？\n\
    \n你可能会说是环境污染、食品安全、工作压力、生活方式等等。\n\n对，这些都是问题。但这些都不是癌症发病最主要的危险因素。\n\n美国杜克大学李治中博士一直坚持做癌症科普，他说得非常好。\n\
    \n他说，如果把全世界国家按照癌症发病率排队，癌症发病率最高的都是环境非常好的欧美国家，中国连前几十名都挤不进去。\n\n你现在还会认为环境是主要问题吗？\n\
    \n那么，到底什么才是癌症发病最大的危险因素呢？\n\n接下来，咱们就从近几年引起学术界广泛关注的一个研究讲起。\n\n## 癌症最大的危险因素是随机错误\n\
    \n在上节课，我讲到了癌症最底层的原因就是“图纸”错了，这个错误的“图纸”就是基因突变。癌症必须先有基因突变，这点是共识。\n\n2017 年《科学》（Science）杂志发表了一篇研究。他们对常见的\
    \ 32 种癌症的基因突变，进行了危险因素的分析。\n\n结果出人意料，癌症基因突变最大的危险因素不是环境也不是遗传，而是随机错误。\n\n听到这，是不是彻底颠覆了你的常识呢？\n\
    \n这篇研究结果一出，在学术界就引起了巨大的争论。下面，我来解读一下这个研究结果。\n\n这个研究认为，引起癌症基因突变的因素中，最主要原因是染色体复制过程中发生的随机错误，这个因素占到了\
    \ 66%。而环境因素和遗传因素，加起来也只占 34%。\n\n没想到吧？\n\n咱们原以为没有癌症家族史，不抽烟、不喝酒、不熬夜、不泡吧、不吃污染的食物、不着急不生气，就可以远离癌症。\n\
    \n现在看来，这些因素和癌症有关系，但是却没你想的那么大。真正的风险是随机错误。\n\n比如骨癌的基因突变：随机错误占了 99.5%，遗传占 0.5%，与环境因素完全无关。\n\
    \n再比如，这几年国内高发的甲状腺癌，随机错误占 98%，遗传占 1.5%，环境因素仅占微不足道的 0.5%。有人说碘盐引起了甲状腺癌，是不对的。\n\n\
    还有非何杰金氏淋巴瘤、脑部肿瘤、前列腺癌、睾丸癌，这些癌症的基因突变中，随机因素都占到了 95%以上。\n\n什么意思呢？\n\n即便我们没有环境污染，没有不良嗜好，生活方式非常健康，这几种癌症还是有很大可能性发生。\n\
    \n甚至有人说，癌症的基因突变就像“上帝掷色子”，是运气不好。你听起来是不是有种凉飕飕的宿命论的感觉呢？\n\n下面，咱们就来看看这个随机错误是怎么来的？\n\
    \n## 癌症是人类长寿的必然代价\n\n你一定还记得，在前面的课里咱们说过，细胞分裂是人体的一种自我修复机制，是多细胞生物生存的基础。就是细胞分裂带来了随机错误。\n\
    \n这是怎么回事呢？\n\n首先，细胞分裂需要染色体先进行复制，然后把遗传信息平均分配到两个新细胞里。\n\n但是这个工作量太大了，人的基因组有31.6 亿个碱基对，每次分裂这\
    \ 31.6 亿个碱基对都要复制一次。工作量太大就难免出错，出错了就是随机错误。\n\n每次细胞分裂都会带来随机错误。随着这些错误不断累积，犯的错就会越来越多，就有可能发生在关键点上变成癌基因。\n\
    \n这种随机错误，就是细胞分裂的产物。\n\n所以，细胞分裂次数越多，癌基因发生的几率也就越大。\n\n细胞的每一次分裂都带来了基因突变，每次突变都有变成癌基因的机会。这个几率虽然极低，但并不是零。\n\
    \n从这个角度来看，我们生命中的每个时刻都处在患癌的风险中，生命就是一种癌前状态。\n\n年龄越大，细胞分裂次数也就越多，癌症发生风险也越来越高。\n\n\
    数据显示，40 岁以上的人患癌症的风险呈指数倍增长。如果人的寿命达到 85 岁，累计癌症发生风险高达 36%。\n\n最近，《科学》（Science）杂志上的一篇研究指出，中年人食管的上皮细胞，尽管在显微镜下看起来形态和正常细胞一模一样，但是进行基因分析发现，已经有一半以上的细胞都发生了和癌症相关的基因突变。\n\
    \n所以，年龄才是引起癌症最大的风险因素。\n\n咱们再回到最开始提的问题：为什么这些年，癌症突然就多了？\n\n主要原因并不是因为环境污染，也不是因为食物和工作压力大。而是我们的生活条件好了，医疗条件好了，人的寿命延长了。\n\
    \n细胞分裂次数多了，基因的随机错误也就越来越多。累积下来，最终带来了癌症的基因突变，所以癌症高发了。\n\n在过去的 100 年里，人类的平均寿命增长了\
    \ 30 岁。发达国家人均寿命更长，所以癌症的发生率更高。\n\n只要活得足够长，每个人都会得癌症。癌症是长寿必须付出的代价。\n\n癌症就像时间的老朋友，如果咱们越来越长寿，那么这个老朋友说不定哪天就会登门造访了。\n\
    \n要想不得癌症，只有一个办法，那就是早死。\n\n## 对待癌症的三条建议\n\n那么，应该怎么科学理解生命和癌症的关系呢？\n\n我从医生的角度给你三条建议，咱们尽量让这个老朋友离得远点，尽量晚点来，能不来最好，真来了，也不怕。\n\
    \n第一条建议是，去除致癌因素，改变生活方式，仍然可以很大程度下降患癌风险。\n\n尽管癌症基因突变的最大危险因素是年龄，但是咱们也不能就这样等着。基因突变只是癌症发生的一个环节。\n\
    \n即使基因突变，也未必发生癌症，人体还有强大的免疫系统。保护免疫系统，减少慢性感染，仍然可以预防大约 40% 左右的癌症。\n\n降低患癌风险的科建议包括：\n\
    \n- 戒烟、戒酒、减肥、多运动、多吃全谷物食品、蔬菜、水果、豆类，少吃糖、少吃红肉（比如猪肉、牛肉、羊肉），这是改变生活方式。\n- 避免乙肝病毒、丙肝病毒、幽门螺旋杆菌、HPV\
    \ 病毒感染。已经感染了，要治疗或者定期复查。\n\n第二条建议是，定期进行疾病筛查。早期发现，早期治疗，具有很大的价值和意义。\n\n不是每个人都有癌症，但是每个人一定有癌症之前的病变。\n\
    \n发现这些早期问题，及时治疗，就可以避免这些良性的病变进一步发展成为恶性的癌症。\n\n举个例子，美国明尼苏达大学癌症检查中心，对 45 岁以上无症状的普通人每年做一次乙状结肠镜检查，见到腺瘤就切除。\n\
    \n我解释一下，腺瘤就是一种癌前病变，长期发展就可以变成癌症。这样做的结果，就是结肠癌、直肠癌发病率比预期的减少了 85%。\n\n所以，超过一定年龄之后定期进行科学的筛查，是发达国家总结出来的可行的癌症预防方法。\n\
    \n筛查的目的在于早点发现这个“不怀好意”的老朋友，还没等它“使坏”的时候，就赶紧把它请走，免得它又带很多“品行不良”的老朋友上门，到时候还得大动干戈。\n"
