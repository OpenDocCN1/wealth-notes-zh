    在同学聚会的时候，我说起这个病例，我很郁闷。


    这个时候，另外一个同学就说，“别想了，赶紧喝，喝完你的病人就醒了”。


    听了这句话，我拔腿就往医院跑。


    到医院，我就问病人的妻子，他平时喝不喝酒？


    他妻子说，喝，而且每天喝一斤。


    显然病人酗酒这个细节，在之前被我忽视了。


    我猜想，病人昏迷会不会是一种酒精戒断症状呢？酗酒的人突然断了酒，严重的就有可能昏迷。


    我突然就有一个想法：为了救命，能不能试着给病人胃管里打点酒呢？


    别的医生都说，你疯了，酒不是药，这不符合常规。要是打了酒病人还不醒，会给自己惹麻烦，同行也会笑话。


    但我坚信自己的判断，当时的老主任也支持，他说，“为了救命可以试，有问题我担着”。


    结果打了酒，当天这个病人就醒了。


    这个病例是想告诉你：


    **医学所有的常规都必须优先保障活着，在特殊情况下，为了活着，常规可以打破。**


    但是，打破常规也未必一定能保证能有好的结果。


    因为，医学面临的一个现实就是不确定。


    每个病人都是不同的个体，治疗的反应因人而异，结果也不同。'
  - '[PAGE 11]


    尤其是疑难病例，有时候做了，可能结果未必好；但是不做，病人就一点希望都没了。


    为了保障让病人活着，医生必须在各种不确定面前，突破各种障碍，有时甚至是禁区。


    在几十年前，心脏外科就面临着一个难题，就是没办法把心脏里的血引出来，这样就不可能打开心脏做手术。


    心脏，就是生命禁区。


    所以在当时，得了先天性心脏病，很多孩子就只能等死。


    到了 1954 年，有个美国医生认为，不能眼睁睁看着这些孩子死。


    这个医生叫李拉海（Lillehei），他是美国明尼苏达大学医学院的心脏外科医生。


    他设计了一种大胆的手术方案。


    有多大胆呢？


    给孩子做手术的时候，让他的父亲躺在边上，把孩子的血管和父亲的血管连在一起。


    这样，孩子心脏里的血就能引出来，流到父亲体内，用父亲的肺给血液加上氧，再打回孩子的身体。


    这样医生就可以手术了，孩子就有了生的可能。但是你有没有想过，这么做，手术的风险也从一条命增加到了两条命。


    李拉海医生不做，没人会说什么。但是一旦失败，父子俩人的命都没了，而且李拉海的职业生涯也会到此结束。


    如果你是医生，你做还是不做？


    当然得做嘛！'
  - '[PAGE 12]


    生命第一，先救命。这个原则指导医生必须突破各种不确定，让病人活着。


    后来，这台手术成功了，父子二人都安全度过了手术。虽然手术之后孩子还是死于肺炎，但是这种手术成了当时唯一能救命的方式。


    随后一年，李拉海继续用这个方法，给40多名年龄不满2岁的婴儿做了心脏修补手术，共32名成功。


    所有这一切，都是为了两个字：活着。


    # 生命第一，为人找回尊严


    除了活着，生命第一还必须保障让每个活着的人，能有尊严地活着。


    很多病，会让人失去尊严。


    比如先天性聋哑，这类病人听不到声音，也就永远学不会说话，尽管社会给他们提供各种各样的帮助，但这都不是最根本的解决办法。


    比如，癌症晚期的病人最怕的不是死亡，而是疼痛，疼痛的折磨比死都可怕。


    有的病人痛不欲生，甚至抑郁自杀。这个时候，再多的安慰都不能让病人挽回尊严。


    再比如，因为意外失去肢体的病人，可能要爬着移动身体。他虽然活着，但是尊严在哪里呢？


    还有，精神分裂症的病人，在没有药的年代只能被关在精神病院里。狂躁的病人只能被捆起来，严重的病例也只能打开大脑用手术刀破坏脑组织，人从此变成一具行尸走肉。


    那你说，他们的尊严又在哪里？


    生命第一，不仅要保证人活着，同样必须为人找回尊严。'
  - '[PAGE 13]


    人工耳蜗可以把声音转成电信号，然后再用这种电极和病人的听神经连接在一起，这样，先天性聋哑的孩子就可以听到声音了。


    人工耳蜗之所以神奇，就是它的信号传导到大脑之后，产生的声音和正常人听到的一模一样。


    这样，孩子就能学会说话，而且他的语言也和正常人一模一样。


    人工耳蜗让这些先天性聋哑的孩子有了尊严。


    晚期癌痛，医生们就用药物或者手术，让病人不那么疼。不疼这个事，可不是咱们没病的人想得那么简单。


    让病人在不疼中，有尊严地走完生命的最后时光，对于他们来说，比多活几天更重要。


    肢体残缺的病人可以安装假肢，重新恢复功能；精神分裂症的病人，已经了了有效的抗精神病药物，很多病人不仅完全控制了症状，而且还可以像正常人一样回归社会，回归家庭。


    生命第一，让肢体残缺的病人重新恢复功能，让遭受痛苦的人活得有尊严，这是它的第二个层面。


    # 生命第一，支持生命的意义


    是不是能活着，还能有尊严地活着，就够了呢？


    不是，人是社会中的人，每个生命都在追求自己独特的意义。


    为了生命更有质量，为了实现自己的价值，他们并没有选择医生认为的最有利的方案。


    生命第一的第三个层面，就是支持人实现生命的意义。'
  - '[PAGE 14]


    比如，如果不截肢病人可能会丢掉生命，但是有些病人坚持保腿，他认为有腿比活着更有意义。怎么办？


    再比如，一个乳腺癌的女性坚持要怀孕，怀孕就可能会加重她的病情，缩短她的生命。但在她看来，能有个后代就是她生命的全部意义。那么，医生要不要帮助她实现自己的愿望？


    还有，一个重要工作岗位上的科研人员患了癌症，但是他不能做手术，因为做手术会耽误重要的工作，工作就是他活着的意义，所以他坚持几个月后再说。医生怎么办？


    这些问题，我也请你想一想。


    生命第一，必须支持生命的意义。


    如果反复告知病人保腿可能会丧失生命，病人依然要保腿，那么医生必须在这个条件下，想尽一切办法。


    比如立刻开始血液净化，过滤血里面的毒素，切开大腿，反复清除它的坏死组织，严密观察，随时和病人交换意见，直到最后一刻。


    对想要怀孕生孩子的乳腺癌病人，医生应该尽量用对孩子干扰最小的医疗措施，去控制她的乳腺癌，一旦时机到来，立刻开展下一步治疗。


    对于不愿放弃工作而拖延手术的病人，医生要想法制定先化疗或者放疗的方案，尽全部可能延缓他的癌症进展，一旦工作结束，立刻手术。


    给所有的生命以希望，或许这个生命是残缺的，或许这个过程是打破常规的，或许这个结果是不确定的。


    但是，生命第一永远是医学存在的终极理由。


    划重点'
  - '[PAGE 15]


    +   1. 医学保障不了人类物种的延续。 2. 医学存在的终极理由是生命第一。 3. 生命第一包括三个层面的涵义：活着、尊严、意义。


    # 下节预告


    下节课进入医学的第二大基础共识。有了医学，似乎攻克一个一个的病，就成了时间问题，那么人类能不能彻底消灭疾病呢？'
  - '[PAGE 16]


    # 02 | 疾病与人终生相伴


    2019-2-28


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    上节课，咱们学习了医学的第一大基础共识，医学存在的终极理由是生命第一。


    今天这节课，咱们就来聊聊“病”。


    对于疾病，不同的人会有不同的理解。我曾经做过这样一个调查：什么是病？你怎么看待病？


    答案五花八门。我总结了一下，大概可以分成两类：


    第一类，把病和感觉联系在一起。认为舒服就是没病，不舒服就是病了。


    第二类，把健康和疾病对立起来。认为健康就是没病，病就是不健康。


    你肯定曾经或者一直也是这么认为的。


    但是，这两种观点都是片面的。感觉不能和有没有病划等号，健康和疾病也没法分得那么开。


    用一句话就是说，我们的生命注定离不开疾病，疾病是生命的一种常态。


    这就是今天要讲的——疾病与人终生相伴。


    # 病和感觉没有必然联系


    在理解这个共识之前，有必要先了解刚才那两种对于疾病的观点为什么都是片面的。


    第一种观点，把病和感觉联系在一起。'
  - '[PAGE 17]


    确实，很多很多人是先有了不舒服的感觉，然后去医院检查，医生告诉你生病了。


    所以，很多人把不舒服和生病对等，也是可以理解的。


    但是，现在医学检查手段越来越高级。你会发现，很多病根本没症状，是去医院检查以后才发现的。


    也就是说，在没感觉的时候，可能已经病了。


    《科学》杂志发表了一项研究，它说肺癌可以在体内潜伏 20 多年，然后突然转变为侵袭性的癌症，开始攻击你的身体了。这个时候，肺癌会迅速恶化。


    那么肺癌潜伏的这 20 多年，身体没有任何不舒服的感觉，是没病吗？


    实际上，几乎多数癌症都经历了一个漫长的没有症状的过程。


    科学家推测，在 90 岁以上去世的人当中，如果能够给他们进行尸体解剖，很可能多数人体内都有癌症或者癌前病变，只是生前没有感觉而已。


    所以，感觉良好并不代表就没病。同样，感觉不舒服了，也未必是有病。


    比如怀孕早期，孕妇会出现剧烈的恶心、呕吐、倦怠、乏力，也都不是病。


    不舒服和疾病根本没有必然联系。


    # 健康和疾病可以共存


    咱们再来说说，人们对于疾病的第二个常见的错误观念，把健康与疾病对立起来，认为健康是没病，病是不健康。


    这个观点，不光大部分普通人赞同，甚至连世界卫生组织给健康下的定义，也是这么说的。


    这个定义认为，健康不仅是没病，而且是生理、心理和社会适应三个方面的完美状态。'
  - '[PAGE 18]


    但是对于这个定义，很多医生包括我自己在内，并不完全认可。


    为什么呢？如果按照这个定义：健康是没病，那这个世界上就不存在健康的人了。


    在我看来，没有疾病的绝对健康，是一种永远都不可能实现的乌托邦。疾病和健康之间，没有一条清晰的界限。


    举个例子，我们每个人从出生开始，得冠心病的风险就在不断增加。


    婴儿一出生，血管就开始逐渐地老化，到了成年，血管壁上开始出现斑块，血管会慢慢硬化变窄。


    这个时候是健康吗？肯定是健康的。算是病吗？也算，血管壁上出现斑块，能不是病吗？


    这就是一种健康和疾病共存的状态。


    当血管继续狭窄，超过 70%、80%，甚至 90%的时候，人就开始出现心绞痛的症状了。这个时候，不光是病了，而且必须得看医生。


    我认为健康包括两个方面：


    第一，健康是可以包容疾病的；


    第二，健康并不是排斥疾病，健康是可以生病，又能让疾病康复。


    所以，疾病和健康之间并不存在一个绝对的界限，二者是可以共存的。


    疾病的本源是进化的不完美


    你可能会问：为什么疾病会与人共存，甚至要终生相伴？


    疾病，其实就是生命的另外一种常态。


    因为人类的进化并不完美。这些不完美，就是导致疾病伴随终生的原因。'
  - '[PAGE 19]


    进化不完美，体现在三个方面：


    首先，我们的基因是不完美的。


    在我看来，几乎所有的疾病都和基因有关系。


    比如癌基因，在我们出生以前，这个坏东西就已经潜伏在我们的基因组里，等待时机，等待被激活。


    除了癌症，各种遗传病、慢性病，都跟基因有关。


    这种包含我们生命巨大遗传信息的最底层的东西，都是不完美的。


    其次，人体设计也是不完美的。


    比如，我们的胃可以分泌胃酸，杀灭几乎所有的细菌，甚至铁块进了胃都可以被腐蚀掉。


    但是，这么强悍的器官却斗不过小小的幽门螺旋杆菌。这种细菌让我们得胃炎、胃溃疡，甚至得胃癌的几率明显增加。


    再比如，我们人体的免疫系统可以攻击病毒、细菌、癌细胞，但是这么精密的自我保护体系，有时候却会误伤自己。


    这样就会产生自身免疫病，比如红斑狼疮、类风湿性关节炎等等。


    再比如，男性睾丸这么重要的设备，却几乎没有任何防护地“挂着”，这样就很容易受到撞击和伤害。


    可以说，几乎人体的每个器官都有不完美的地方。


    基因不完美，人体设计也不完美，够悲催了吧。


    但是，还有第三个不完美，人类与环境适应的不完美。'
  - '[PAGE 20]


    人类进化的速度永远赶不上环境变化的速度，一个重要的结果就是带来了病。


    咱们这副身体最适合沙漠里那种穷日子，饱一顿，饿一顿。


    突然有钱了吃饱了，不用奔跑了，这也就带来了很多代谢类疾病，比如糖尿病、高血压、高血脂、高尿酸。


    我们没办法消除这些不完美，这也就注定了疾病与人终生相伴。


    # 疾病也有价值


    听到这你可能会挺悲观：人一辈子都摆脱不了疾病这个坏东西了吗？


    但是我要说，疾病也并不永远都是灾难，它也有价值。


    举个例子：


    孟加拉国曾经是霍乱高发地区。15 岁以下的孩子，几乎一半以上的人都感染过霍乱。


    你可能知道，霍乱是一种消化道烈性传染病，感染之后人会腹泻，严重的几个小时就可能死亡。


    但你知道吗，现在的孟加拉国，尽管仍然会有人感染霍乱，但是有的人症状却很轻，有的甚至根本就没症状。


    这是怎么回事？


    科学家经过研究发现，这类感染了霍乱，但是症状却很轻微的人，在他们的基因里有 **305** 个 DNA 片段发生了改变。


    就是这些发生改变的基因，增强了他们对霍乱的抵抗能力。


    所以，疾病可以成为进化的动力，帮助整个物种的繁衍。'
  - '[PAGE 21]


    你肯定会觉得，尽管这样自己也不愿意得病，健康比啥都好，至于几千年几万年以后的子孙就顾不上


    那我可要告诉你，没有昨天的病，就没有咱们今天的健康。


    比如，我们的身体经常被病毒感染，感冒就是一种最常见的病毒感染。


    感冒病毒会不断地刺激我们的免疫系统，免疫系统也因为这种刺激，变得越来越强大，就可以抵御更严重的疾病了。


    应该说，孩子每次感冒都能让他的免疫系统变强一次。


    有一种最新的学说，叫做“卫生假说”。


    它认为，孩子的成长环境别太干净，应该多接触细菌和宠物，增加和微生物接触的机会。


    这样的孩子成年以后，免疫系统反而更强大，反而更不容易过敏。


    医生甚至利用疾病来预防疾病。


    比如打疫苗，打完可能会有些轻微的反应，比如发烧、倦怠、乏力。


    很多人把它理解成疫苗的副作用。其实，这就是让你生一场小病，用这个“生小病”的办法，产生免疫力来预防大病。


    这些内容，在以后的课程里都会讲到，这里就不多说了。


    所以，疾病尤其是小病，也不一定都是坏事。


    当然，目前这类研究主要还是集中在微生物感染领域。


    至于其他疾病是不是对人类也有价值，或者曾经有过价值，目前还缺乏可靠的证据，我们期待有更多的研究来证明。'
  - '[PAGE 22]


    # 划重点


    1. 疾病和感觉没有必然联系。 2. 疾病和健康之间，没有清晰的界限，疾病和健康是可以共存的。 3. 疾病也有价值，疾病可以刺激人体免疫，可以成为进化的动力，推动整个物种进化。


    # 思考题


    你还知道哪些疾病，是因为进化不完美导致的？


    # 下节预告


    既然疾病与人终生相伴，那治疗的本质是什么呢？下一讲，我们进入医学的第三个共识。'
  - '[PAGE 23]


    # 03｜医疗的本质是支持生命自我修复


    2019-2-28


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    上一讲，咱们说到了疾病与人终生相伴，每个人都难免生病。


    今天，咱们就来说说医疗的本质。


    说起医疗，你知道每天有多少外地病人进京看病吗？


    有个官方数字，每天至少有 70 多万。这么算下来，每年就是两个多亿。


    这些人风餐露宿，整宿守在医院门口，就为了一张专家号。


    你能想象病人排了一宿的队之后，见到医生是什么感觉吗？就像见了神一样。


    这种感觉，是人在疾病状态下，很容易产生的本能感觉。


    在中国，病人治好了病经常会给医生送一面锦旗，上面写着“医德高尚，妙手回春”。在他们眼里，这些治好病的医生也是“神”。


    那么，医生真的是神吗？病是怎么治好的？医疗的本质又是什么呢？


    美国医生萨斯（Thomas Szasz）说过：


    在宗教强盛而科学无力的从前，人们误将神的力量当作医疗；在科学强大而宗教弱势的今天，人们又误将医疗当成神力。


    这句话说出了人们看待医疗的两个极端：在以前，找神看病；在今天，把医疗想成无所不能。


    很多人就想当然地认为，得了病，就应该把自己全部交给医生。'
  - '[PAGE 24]


    进医院就像进修理厂，医生用药或者手术刀修修补补，然后再把好端端的身体还给我。


    这个观点，听起来似乎很有道理，因为很多病确实是被治好的。


    但我要告诉你的是，真正治好病的，是病人自己。所有的医疗行为，只是起到支持的作用。


    这就是今天我要讲的——医疗的本质是支持生命自我修复。


    我要强调一下，这个共识包含了两个层面：


    首先是人体的自我修复，然后才是医学的支持。人体的自我修复是核心，是关键。


    # 生命具有自我修复的能力


    为什么自我修复这么重要呢？


    咱们就看看如果没有自我修复，只有强大的医疗会发生什么？


    这个极罕见的病例已经过去2年了，但是直到今天，抢救的场景还让我历历在目。


    2年前，我接诊了一个20岁的男大学生，他服毒自杀，这个毒是秋水仙碱。


    秋水仙碱本来是一种治疗痛风的药，小剂量可以治病，但是超过剂量很容易中毒，甚至死亡。


    这个男生吃了500毫克，这个剂量超过了致死量的10倍。最可怕的是，这种毒根本没有解药。


    所有人都判断这个病人肯定希望渺茫，但是他太年轻了，所有的医生又都不甘心，都希望出现奇迹。


    我们请了各个科的专家会诊，洗胃、心电监护、呼吸机、血浆置换、持续血液净化、升压药物、PICCO……全世界最先进的医疗手段都用上了。'
  - '[PAGE 25]


    但是，病人还是全部器官都衰竭了。


    他在昏迷之前，在纸上写了三个字“救救我”。不到72小时，抢救无效死亡。和教科书上写的一模一样，我们没能创造奇迹。


    我永远都能回忆起，得知这个男孩死亡的瞬间，父母爆发出的撕心裂肺的哭声。


    这么年轻的一条生命，眼睁睁地就没了，这似乎是一场失败的战役。


    是医生无能吗？不是。我自信我们是全国最优秀的抢救团队。


    是治疗力度不够吗？也不是。这个病例用尽了全世界最好的设备和药物。


    为什么这么年轻的生命却救不回来呢？


    最本质的原因，是病人失去了人类战胜疾病的最基本的环节——自我修复。


    你肯定知道，人体的自我修复主要靠细胞分裂。


    比如，咱们的皮肤上划破一个伤口，很快就会长出新的组织来填充这个伤口，靠的是细胞分裂；


    骨折之后，骨折的地方会长出骨痂，逐渐让断裂的部分愈合，靠的也是细胞分裂。


    回到这个男孩的病例，他服用的致死量的秋水仙碱，就是阻断了细胞的分裂，让细胞在分裂中期死亡。


    也就是说，细胞不再分裂了，不再产生新的细胞了，这就剥夺了疾病治愈最基本的环节——自我修复。


    为什么要讲这个病例呢？


    不是我们治不了中毒，而是这个孩子中的毒太特殊，让他无法自我修复。所以，有再强大的医疗也无济于事。'
  - '[PAGE 26]


    医疗的作用，必须基于自我修复。


    # 一切医疗都是支持自我修复


    讲到这你可能会产生困惑，既然生命必须要靠自我修复，那医疗还有什么用呢？


    我认为，在疾病面前，尤其是大病，医疗的支持作用是必不可少的。


    因为这个时候，人体的自我修复垮了。


    医疗的支持，就是给自我修复赢得时间、创造条件，等待自我修复最终发挥作用、战胜疾病。


    我工作的 ICU，也就是重症医学科，是疾病最重、距离死亡最近的地方。ICU 的治疗，体现了现代医学生命救护的最高形态。


    但我要告诉你的是，即便是 ICU 这种运用了全世界最前沿、最高端救命设备的地方，几乎所有的救命手段都是支持。


    你熟悉的呼吸机，是支持肺，让肺休息，等待自愈；


    你可能不太熟悉的床旁血液净化，是支持肾，替代肾脏的功能，等待自愈；


    甚至全世界最前沿的 ECMO，也就是老百姓常说的“魔肺”，是对心脏和肺，最高级别的支持。


    所有这些顶级的医疗设备，都是为了先把命保住，给自我修复赢得时间、创造条件，然后等待自我修复发挥作用。


    可能会说，有的病看上去确实是医生治好的，它怎么都跟自我修复没啥关系。


    比如肺炎，医生用抗生素杀死细菌，病人治愈。'
  - '[PAGE 27]


    听上去确实是抗生素起了作用。但是这个例子，同样体现了“医疗的本质是支持自我修复”这个基本共识。


    为什么呢？


    得了肺炎，先用抗生素杀死大部分细菌，但是总有耐药的，没被杀死的细菌。怎么办？


    这个时候，人体的白细胞发挥作用，消灭剩下的细菌，让肺炎痊愈。


    白细胞吞噬、杀灭细菌的过程，就是自我修复。


    同样是肺炎，但是白血病患者或者艾滋病病人就没有这么幸运了，会非常难治，这些病人甚至会因为肺炎去世。


    因为这类病人的白细胞吞噬功能差，自我修复能力低下，因此，再强大的抗生素效果也不好。


    治愈疾病，最终靠的还是自我修复。


    # 癌症免疫疗法：重新恢复自我修复


    自我修复能有多神奇呢？咱们再来看一个著名的案例。


    这个病例之所以著名，不仅仅是由于患者的特殊身份，更是由于这个病例，用到了全世界最前沿的医疗措施。同样，还有传奇的治疗效果。


    这个病人，就是美国前总统吉米·卡特（Jimmy Carte）。


    2015 年 8 月份，90 岁的卡特总统，被诊断得了恶性黑色素瘤。更可怕的是，已经发生了脑转移。


    你肯定能够想象，对于一个 90 岁的老人，预示着什么？'
  md: '

    在同学聚会的时候，我说起这个病例，我很郁闷。


    这个时候，另外一个同学就说，“别想了，赶紧喝，喝完你的病人就醒了”。


    听了这句话，我拔腿就往医院跑。


    到医院，我就问病人的妻子，他平时喝不喝酒？


    他妻子说，喝，而且每天喝一斤。


    显然病人酗酒这个细节，在之前被我忽视了。


    我猜想，病人昏迷会不会是一种酒精戒断症状呢？酗酒的人突然断了酒，严重的就有可能昏迷。


    我突然就有一个想法：为了救命，能不能试着给病人胃管里打点酒呢？


    别的医生都说，你疯了，酒不是药，这不符合常规。要是打了酒病人还不醒，会给自己惹麻烦，同行也会笑话。


    但我坚信自己的判断，当时的老主任也支持，他说，“为了救命可以试，有问题我担着”。


    结果打了酒，当天这个病人就醒了。


    这个病例是想告诉你：


    **医学所有的常规都必须优先保障活着，在特殊情况下，为了活着，常规可以打破。**


    但是，打破常规也未必一定能保证能有好的结果。


    因为，医学面临的一个现实就是不确定。


    每个病人都是不同的个体，治疗的反应因人而异，结果也不同。


    尤其是疑难病例，有时候做了，可能结果未必好；但是不做，病人就一点希望都没了。


    为了保障让病人活着，医生必须在各种不确定面前，突破各种障碍，有时甚至是禁区。


    在几十年前，心脏外科就面临着一个难题，就是没办法把心脏里的血引出来，这样就不可能打开心脏做手术。


    心脏，就是生命禁区。


    所以在当时，得了先天性心脏病，很多孩子就只能等死。


    到了 1954 年，有个美国医生认为，不能眼睁睁看着这些孩子死。


    这个医生叫李拉海（Lillehei），他是美国明尼苏达大学医学院的心脏外科医生。


    他设计了一种大胆的手术方案。


    有多大胆呢？


    给孩子做手术的时候，让他的父亲躺在边上，把孩子的血管和父亲的血管连在一起。


    这样，孩子心脏里的血就能引出来，流到父亲体内，用父亲的肺给血液加上氧，再打回孩子的身体。


    这样医生就可以手术了，孩子就有了生的可能。但是你有没有想过，这么做，手术的风险也从一条命增加到了两条命。


    李拉海医生不做，没人会说什么。但是一旦失败，父子俩人的命都没了，而且李拉海的职业生涯也会到此结束。


    如果你是医生，你做还是不做？


    当然得做嘛！


    生命第一，先救命。这个原则指导医生必须突破各种不确定，让病人活着。


    后来，这台手术成功了，父子二人都安全度过了手术。虽然手术之后孩子还是死于肺炎，但是这种手术成了当时唯一能救命的方式。


    随后一年，李拉海继续用这个方法，给40多名年龄不满2岁的婴儿做了心脏修补手术，共32名成功。


    所有这一切，都是为了两个字：活着。


    ## 生命第一，为人找回尊严


    除了活着，生命第一还必须保障让每个活着的人，能有尊严地活着。


    很多病，会让人失去尊严。


    - 比如先天性聋哑，这类病人听不到声音，也就永远学不会说话，尽管社会给他们提供各种各样的帮助，但这都不是最根本的解决办法。

    - 比如，癌症晚期的病人最怕的不是死亡，而是疼痛，疼痛的折磨比死都可怕。有的病人痛不欲生，甚至抑郁自杀。这个时候，再多的安慰都不能让病人挽回尊严。

    - 再比如，因为意外失去肢体的病人，可能要爬着移动身体。他虽然活着，但是尊严在哪里呢？

    - 还有，精神分裂症的病人，在没有药的年代只能被关在精神病院里。狂躁的病人只能被捆起来，严重的病例也只能打开大脑用手术刀破坏脑组织，人从此变成一具行尸走肉。


    那你说，他们的尊严又在哪里？


    生命第一，不仅要保证人活着，同样必须为人找回尊严。


    人工耳蜗可以把声音转成电信号，然后再用这种电极和病人的听神经连接在一起，这样，先天性聋哑的孩子就可以听到声音了。


    人工耳蜗之所以神奇，就是它的信号传导到大脑之后，产生的声音和正常人听到的一模一样。


    这样，孩子就能学会说话，而且他的语言也和正常人一模一样。


    人工耳蜗让这些先天性聋哑的孩子有了尊严。


    晚期癌痛，医生们就用药物或者手术，让病人不那么疼。不疼这个事，可不是咱们没病的人想得那么简单。


    让病人在不疼中，有尊严地走完生命的最后时光，对于他们来说，比多活几天更重要。


    肢体残缺的病人可以安装假肢，重新恢复功能；精神分裂症的病人，已经有了有效的抗精神病药物，很多病人不仅完全控制了症状，而且还可以像正常人一样回归社会，回归家庭。


    生命第一，让肢体残缺的病人重新恢复功能，让遭受痛苦的人活得有尊严，这是它的第二个层面。


    ## 生命第一，支持生命的意义


    是不是能活着，还能有尊严地活着，就够了呢？


    不是，人是社会中的人，每个生命都在追求自己独特的意义。


    为了生命更有质量，为了实现自己的价值，他们并没有选择医生认为的最有利的方案。


    生命第一的第三个层面，就是支持人实现生命的意义。


    比如，如果不截肢病人可能会丢掉生命，但是有些病人坚持保腿，他认为有腿比活着更有意义。怎么办？


    再比如，一个乳腺癌的女性坚持要怀孕，怀孕就可能会加重她的病情，缩短她的生命。但在她看来，能有个后代就是她生命的全部意义。那么，医生要不要帮助她实现自己的愿望？


    还有，一个重要工作岗位上的科研人员患了癌症，但是他不能做手术，因为做手术会耽误重要的工作，工作就是他活着的意义，所以他坚持几个月后再说。医生怎么办？


    这些问题，我也请你想一想。


    生命第一，必须支持生命的意义。


    如果反复告知病人保腿可能会丧失生命，病人依然要保腿，那么医生必须在这个条件下，想尽一切办法。


    比如立刻开始血液净化，过滤血里面的毒素，切开大腿，反复清除它的坏死组织，严密观察，随时和病人交换意见，直到最后一刻。


    对想要怀孕生孩子的乳腺癌病人，医生应该尽量用对孩子干扰最小的医疗措施，去控制她的乳腺癌，一旦时机到来，立刻开展下一步治疗。


    对于不愿放弃工作而拖延手术的病人，医生要想法制定先化疗或者放疗的方案，尽全部可能延缓他的癌症进展，一旦工作结束，立刻手术。


    给所有的生命以希望，或许这个生命是残缺的，或许这个过程是打破常规的，或许这个结果是不确定的。


    但是，生命第一永远是医学存在的终极理由。


    ### 划重点


    1. 医学保障不了人类物种的延续。

    2. 医学存在的终极理由是生命第一。

    3. 生命第一包括三个层面的涵义：活着、尊严、意义。


    ### 下节预告


    下节课进入医学的第二大基础共识。有了医学，似乎攻克一个一个的病，就成了时间问题，那么人类能不能彻底消灭疾病呢？


    ## 02 | 疾病与人终生相伴


    2019-2-28


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    上节课，咱们学习了医学的第一大基础共识，医学存在的终极理由是生命第一。


    今天这节课，咱们就来聊聊“病”。


    对于疾病，不同的人会有不同的理解。我曾经做过这样一个调查：什么是病？你怎么看待病？


    答案五花八门。我总结了一下，大概可以分成两类：


    - 第一类，把病和感觉联系在一起。认为舒服就是没病，不舒服就是病了。

    - 第二类，把健康和疾病对立起来。认为健康就是没病，病就是不健康。


    你肯定曾经或者一直也是这么认为的。


    但是，这两种观点都是片面的。感觉不能和有没有病划等号，健康和疾病也没法分得那么开。


    用一句话就是说，我们的生命注定离不开疾病，疾病是生命的一种常态。


    这就是今天要讲的——疾病与人终生相伴。


    ### 病和感觉没有必然联系


    在理解这个共识之前，有必要先了解刚才那两种对于疾病的观点为什么都是片面的。


    第一种观点，把病和感觉联系在一起。


    确实，很多很多人是先有了不舒服的感觉，然后去医院检查，医生告诉你生病了。


    所以，很多人把不舒服和生病对等，也是可以理解的。


    但是，现在医学检查手段越来越高级。你会发现，很多病根本没症状，是去医院检查以后才发现的。


    也就是说，在没感觉的时候，可能已经病了。


    《科学》杂志发表了一项研究，它说肺癌可以在体内潜伏 20 多年，然后突然转变为侵袭性的癌症，开始攻击你的身体了。这个时候，肺癌会迅速恶化。


    那么肺癌潜伏的这 20 多年，身体没有任何不舒服的感觉，是没病吗？


    实际上，几乎多数癌症都经历了一个漫长的没有症状的过程。


    科学家推测，在 90 岁以上去世的人当中，如果能够给他们进行尸体解剖，很可能多数人体内都有癌症或者癌前病变，只是生前没有感觉而已。


    所以，感觉良好并不代表就没病。同样，感觉不舒服了，也未必是有病。


    比如怀孕早期，孕妇会出现剧烈的恶心、呕吐、倦怠、乏力，也都不是病。


    不舒服和疾病根本没有必然联系。


    ### 健康和疾病可以共存


    咱们再来说说，人们对于疾病的第二个常见的错误观念，把健康与疾病对立起来，认为健康是没病，病是不健康。


    这个观点，不光大部分普通人赞同，甚至连世界卫生组织给健康下的定义，也是这么说的。


    这个定义认为，健康不仅是没病，而且是生理、心理和社会适应三个方面的完美状态。


    但是对于这个定义，很多医生包括我自己在内，并不完全认可。


    为什么呢？如果按照这个定义：健康是没病，那这个世界上就不存在健康的人了。


    在我看来，没有疾病的绝对健康，是一种永远都不可能实现的乌托邦。疾病和健康之间，没有一条清晰的界限。


    举个例子，我们每个人从出生开始，得冠心病的风险就在不断增加。


    婴儿一出生，血管就开始逐渐地老化，到了成年，血管壁上开始出现斑块，血管会慢慢硬化变窄。


    这个时候是健康吗？肯定是健康的。算是病吗？也算，血管壁上出现斑块，能不是病吗？


    这就是一种健康和疾病共存的状态。


    当血管继续狭窄，超过 70%、80%，甚至 90%的时候，人就开始出现心绞痛的症状了。这个时候，不光是病了，而且必须得看医生。


    我认为健康包括两个方面：


    - 第一，健康是可以包容疾病的；

    - 第二，健康并不是排斥疾病，健康是可以生病，又能让疾病康复。


    所以，疾病和健康之间并不存在一个绝对的界限，二者是可以共存的。


    ### 疾病的本源是进化的不完美


    你可能会问：为什么疾病会与人共存，甚至要终生相伴？


    疾病，其实就是生命的另外一种常态。


    因为人类的进化并不完美。这些不完美，就是导致疾病伴随终生的原因。


    进化不完美，体现在三个方面：


    首先，我们的基因是不完美的。


    在我看来，几乎所有的疾病都和基因有关系。


    比如癌基因，在我们出生以前，这个坏东西就已经潜伏在我们的基因组里，等待时机，等待被激活。


    除了癌症，各种遗传病、慢性病，都跟基因有关。


    这种包含我们生命巨大遗传信息的最底层的东西，都是不完美的。


    其次，人体设计也是不完美的。


    - 比如，我们的胃可以分泌胃酸，杀灭几乎所有的细菌，甚至铁块进了胃都可以被腐蚀掉。但是，这么强悍的器官却斗不过小小的幽门螺旋杆菌。这种细菌让我们得胃炎、胃溃疡，甚至得胃癌的几率明显增加。

    - 再比如，我们人体的免疫系统可以攻击病毒、细菌、癌细胞，但是这么精密的自我保护体系，有时候却会误伤自己。这样就会产生自身免疫病，比如红斑狼疮、类风湿性关节炎等等。

    - 再比如，男性睾丸这么重要的设备，却几乎没有任何防护地“挂着”，这样就很容易受到撞击和伤害。


    可以说，几乎人体的每个器官都有不完美的地方。


    基因不完美，人体设计也不完美，够悲催了吧。


    但是，还有第三个不完美，人类与环境适应的不完美。


    人类进化的速度永远赶不上环境变化的速度，一个重要的结果就是带来了病。


    咱们这副身体最适合沙漠里那种穷日子，饱一顿，饿一顿。


    突然有钱了吃饱了，不用奔跑了，这也就带来了很多代谢类疾病，比如糖尿病、高血压、高血脂、高尿酸。


    我们没办法消除这些不完美，这也就注定了疾病与人终生相伴。


    ### 疾病也有价值


    听到这你可能会挺悲观：人一辈子都摆脱不了疾病这个坏东西了吗？


    但是我要说，疾病也并不永远都是灾难，它也有价值。


    举个例子：


    孟加拉国曾经是霍乱高发地区。15 岁以下的孩子，几乎一半以上的人都感染过霍乱。


    你可能知道，霍乱是一种消化道烈性传染病，感染之后人会腹泻，严重的几个小时就可能死亡。


    但你知道吗，现在的孟加拉国，尽管仍然会有人感染霍乱，但是有的人症状却很轻，有的甚至根本就没症状。


    这是怎么回事？


    科学家经过研究发现，这类感染了霍乱，但是症状却很轻微的人，在他们的基因里有 **305** 个 DNA 片段发生了改变。


    就是这些发生改变的基因，增强了他们对霍乱的抵抗能力。


    所以，疾病可以成为进化的动力，帮助整个物种的繁衍。


    你肯定会觉得，尽管这样自己也不愿意得病，健康比啥都好，至于几千年几万年以后的子孙就顾不上。


    那我可要告诉你，没有昨天的病，就没有咱们今天的健康。


    比如，我们的身体经常被病毒感染，感冒就是一种最常见的病毒感染。


    感冒病毒会不断地刺激我们的免疫系统，免疫系统也因为这种刺激，变得越来越强大，就可以抵御更严重的疾病了。


    应该说，孩子每次感冒都能让他的免疫系统变强一次。


    有一种最新的学说，叫做“卫生假说”。


    它认为，孩子的成长环境别太干净，应该多接触细菌和宠物，增加和微生物接触的机会。


    这样的孩子成年以后，免疫系统反而更强大，反而更不容易过敏。


    医生甚至利用疾病来预防疾病。


    比如打疫苗，打完可能会有些轻微的反应，比如发烧、倦怠、乏力。


    很多人把它理解成疫苗的副作用。其实，这就是让你生一场小病，用这个“生小病”的办法，产生免疫力来预防大病。


    这些内容，在以后的课程里都会讲到，这里就不多说了。


    所以，疾病尤其是小病，也不一定都是坏事。


    当然，目前这类研究主要还是集中在微生物感染领域。


    至于其他疾病是不是对人类也有价值，或者曾经有过价值，目前还缺乏可靠的证据，我们期待有更多的研究来证明。


    ### 划重点


    1. 疾病和感觉没有必然联系。

    2. 疾病和健康之间，没有清晰的界限，疾病和健康是可以共存的。

    3. 疾病也有价值，疾病可以刺激人体免疫，可以成为进化的动力，推动整个物种进化。


    ### 思考题


    你还知道哪些疾病，是因为进化不完美导致的？


    ### 下节预告


    既然疾病与人终生相伴，那治疗的本质是什么呢？下一讲，我们进入医学的第三个共识。


    ## 03｜医疗的本质是支持生命自我修复


    2019-2-28


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    上一讲，咱们说到了疾病与人终生相伴，每个人都难免生病。


    今天，咱们就来说说医疗的本质。


    说起医疗，你知道每天有多少外地病人进京看病吗？


    有个官方数字，每天至少有 70 多万。这么算下来，每年就是两个多亿。


    这些人风餐露宿，整宿守在医院门口，就为了一张专家号。


    你能想象病人排了一宿的队之后，见到医生是什么感觉吗？就像见了神一样。


    这种感觉，是人在疾病状态下，很容易产生的本能感觉。


    在中国，病人治好了病经常会给医生送一面锦旗，上面写着“医德高尚，妙手回春”。在他们眼里，这些治好病的医生也是“神”。


    那么，医生真的是神吗？病是怎么治好的？医疗的本质又是什么呢？


    美国医生萨斯（Thomas Szasz）说过：


    > 在宗教强盛而科学无力的从前，人们误将神的力量当作医疗；在科学强大而宗教弱势的今天，人们又误将医疗当成神力。


    这句话说出了人们看待医疗的两个极端：在以前，找神看病；在今天，把医疗想成无所不能。


    很多人就想当然地认为，得了病，就应该把自己全部交给医生。


    进医院就像进修理厂，医生用药或者手术刀修修补补，然后再把好端端的身体还给我。


    这个观点，听起来似乎很有道理，因为很多病确实是被治好的。


    但我要告诉你的是，真正治好病的，是病人自己。所有的医疗行为，只是起到支持的作用。


    这就是今天我要讲的——医疗的本质是支持生命自我修复。


    我要强调一下，这个共识包含了两个层面：


    - 首先是人体的自我修复，然后才是医学的支持。人体的自我修复是核心，是关键。


    ### 生命具有自我修复的能力


    为什么自我修复这么重要呢？


    咱们就看看如果没有自我修复，只有强大的医疗会发生什么？


    这个极罕见的病例已经过去2年了，但是直到今天，抢救的场景还让我历历在目。


    2年前，我接诊了一个20岁的男大学生，他服毒自杀，这个毒是秋水仙碱。


    秋水仙碱本来是一种治疗痛风的药，小剂量可以治病，但是超过剂量很容易中毒，甚至死亡。


    这个男生吃了500毫克，这个剂量超过了致死量的10倍。最可怕的是，这种毒根本没有解药。


    所有人都判断这个病人肯定希望渺茫，但是他太年轻了，所有的医生又都不甘心，都希望出现奇迹。


    我们请了各个科的专家会诊，洗胃、心电监护、呼吸机、血浆置换、持续血液净化、升压药物、PICCO……全世界最先进的医疗手段都用上了。


    但是，病人还是全部器官都衰竭了。


    他在昏迷之前，在纸上写了三个字“救救我”。不到72小时，抢救无效死亡。和教科书上写的一模一样，我们没能创造奇迹。


    我永远都能回忆起，得知这个男孩死亡的瞬间，父母爆发出的撕心裂肺的哭声。


    这么年轻的一条生命，眼睁睁地就没了，这似乎是一场失败的战役。


    是医生无能吗？不是。我自信我们是全国最优秀的抢救团队。


    是治疗力度不够吗？也不是。这个病例用尽了全世界最好的设备和药物。


    为什么这么年轻的生命却救不回来呢？


    最本质的原因，是病人失去了人类战胜疾病的最基本的环节——自我修复。


    你肯定知道，人体的自我修复主要靠细胞分裂。


    比如，咱们的皮肤上划破一个伤口，很快就会长出新的组织来填充这个伤口，靠的是细胞分裂；


    骨折之后，骨折的地方会长出骨痂，逐渐让断裂的部分愈合，靠的也是细胞分裂。


    回到这个男孩的病例，他服用的致死量的秋水仙碱，就是阻断了细胞的分裂，让细胞在分裂中期死亡。


    也就是说，细胞不再分裂了，不再产生新的细胞了，这就剥夺了疾病治愈最基本的环节——自我修复。


    为什么要讲这个病例呢？


    不是我们治不了中毒，而是这个孩子中的毒太特殊，让他无法自我修复。所以，有再强大的医疗也无济于事。


    医疗的作用，必须基于自我修复。


    ### 一切医疗都是支持自我修复


    讲到这你可能会产生困惑，既然生命必须要靠自我修复，那医疗还有什么用呢？


    我认为，在疾病面前，尤其是大病，医疗的支持作用是必不可少的。


    因为这个时候，人体的自我修复垮了。


    医疗的支持，就是给自我修复赢得时间、创造条件，等待自我修复最终发挥作用、战胜疾病。


    我工作的 ICU，也就是重症医学科，是疾病最重、距离死亡最近的地方。ICU 的治疗，体现了现代医学生命救护的最高形态。


    但我要告诉你的是，即便是 ICU 这种运用了全世界最前沿、最高端救命设备的地方，几乎所有的救命手段都是支持。


    - 你熟悉的呼吸机，是支持肺，让肺休息，等待自愈；

    - 你可能不太熟悉的床旁血液净化，是支持肾，替代肾脏的功能，等待自愈；

    - 甚至全世界最前沿的 ECMO，也就是老百姓常说的“魔肺”，是对心脏和肺，最高级别的支持。


    所有这些顶级的医疗设备，都是为了先把命保住，给自我修复赢得时间、创造条件，然后等待自我修复发挥作用。


    可能会说，有的病看上去确实是医生治好的，它怎么都跟自我修复没啥关系。


    比如肺炎，医生用抗生素杀死细菌，病人治愈。


    听上去确实是抗生素起了作用。但是这个例子，同样体现了“医疗的本质是支持自我修复”这个基本共识。


    为什么呢？


    得了肺炎，先用抗生素杀死大部分细菌，但是总有耐药的，没被杀死的细菌。怎么办？


    这个时候，人体的白细胞发挥作用，消灭剩下的细菌，让肺炎痊愈。


    白细胞吞噬、杀灭细菌的过程，就是自我修复。


    同样是肺炎，但是白血病患者或者艾滋病病人就没有这么幸运了，会非常难治，这些病人甚至会因为肺炎去世。


    因为这类病人的白细胞吞噬功能差，自我修复能力低下，因此，再强大的抗生素效果也不好。


    治愈疾病，最终靠的还是自我修复。


    ### 癌症免疫疗法：重新恢复自我修复


    自我修复能有多神奇呢？咱们再来看一个著名的案例。


    这个病例之所以著名，不仅仅是由于患者的特殊身份，更是由于这个病例，用到了全世界最前沿的医疗措施。同样，还有传奇的治疗效果。


    这个病人，就是美国前总统吉米·卡特（Jimmy Carter）。


    2015 年 8 月份，90 岁的卡特总统，被诊断得了恶性黑色素瘤。更可怕的是，已经发生了脑转移。


    你肯定能够想象，对于一个 90 岁的老人，预示着什么？

    '
  mdcn: '

    在同学聚会的时候，我说起这个病例，我很郁闷。


    这个时候，另外一个同学就说，“别想了，赶紧喝，喝完你的病人就醒了”。


    听了这句话，我拔腿就往医院跑。


    到医院，我就问病人的妻子，他平时喝不喝酒？


    他妻子说，喝，而且每天喝一斤。


    显然病人酗酒这个细节，在之前被我忽视了。


    我猜想，病人昏迷会不会是一种酒精戒断症状呢？酗酒的人突然断了酒，严重的就有可能昏迷。


    我突然就有一个想法：为了救命，能不能试着给病人胃管里打点酒呢？


    别的医生都说，你疯了，酒不是药，这不符合常规。要是打了酒病人还不醒，会给自己惹麻烦，同行也会笑话。


    但我坚信自己的判断，当时的老主任也支持，他说，“为了救命可以试，有问题我担着”。


    结果打了酒，当天这个病人就醒了。


    这个病例是想告诉你：


    **医学所有的常规都必须优先保障活着，在特殊情况下，为了活着，常规可以打破。**


    但是，打破常规也未必一定能保证能有好的结果。


    因为，医学面临的一个现实就是不确定。


    每个病人都是不同的个体，治疗的反应因人而异，结果也不同。


    尤其是疑难病例，有时候做了，可能结果未必好；但是不做，病人就一点希望都没了。


    为了保障让病人活着，医生必须在各种不确定面前，突破各种障碍，有时甚至是禁区。


    在几十年前，心脏外科就面临着一个难题，就是没办法把心脏里的血引出来，这样就不可能打开心脏做手术。


    心脏，就是生命禁区。


    所以在当时，得了先天性心脏病，很多孩子就只能等死。


    到了 1954 年，有个美国医生认为，不能眼睁睁看着这些孩子死。


    这个医生叫李拉海（Lillehei），他是美国明尼苏达大学医学院的心脏外科医生。


    他设计了一种大胆的手术方案。


    有多大胆呢？


    给孩子做手术的时候，让他的父亲躺在边上，把孩子的血管和父亲的血管连在一起。


    这样，孩子心脏里的血就能引出来，流到父亲体内，用父亲的肺给血液加上氧，再打回孩子的身体。


    这样医生就可以手术了，孩子就有了生的可能。但是你有没有想过，这么做，手术的风险也从一条命增加到了两条命。


    李拉海医生不做，没人会说什么。但是一旦失败，父子俩人的命都没了，而且李拉海的职业生涯也会到此结束。


    如果你是医生，你做还是不做？


    当然得做嘛！


    生命第一，先救命。这个原则指导医生必须突破各种不确定，让病人活着。


    后来，这台手术成功了，父子二人都安全度过了手术。虽然手术之后孩子还是死于肺炎，但是这种手术成了当时唯一能救命的方式。


    随后一年，李拉海继续用这个方法，给40多名年龄不满2岁的婴儿做了心脏修补手术，共32名成功。


    所有这一切，都是为了两个字：活着。


    ## 生命第一，为人找回尊严


    除了活着，生命第一还必须保障让每个活着的人，能有尊严地活着。


    很多病，会让人失去尊严。


    - 比如先天性聋哑，这类病人听不到声音，也就永远学不会说话，尽管社会给他们提供各种各样的帮助，但这都不是最根本的解决办法。

    - 比如，癌症晚期的病人最怕的不是死亡，而是疼痛，疼痛的折磨比死都可怕。有的病人痛不欲生，甚至抑郁自杀。这个时候，再多的安慰都不能让病人挽回尊严。

    - 再比如，因为意外失去肢体的病人，可能要爬着移动身体。他虽然活着，但是尊严在哪里呢？

    - 还有，精神分裂症的病人，在没有药的年代只能被关在精神病院里。狂躁的病人只能被捆起来，严重的病例也只能打开大脑用手术刀破坏脑组织，人从此变成一具行尸走肉。


    那你说，他们的尊严又在哪里？


    生命第一，不仅要保证人活着，同样必须为人找回尊严。


    人工耳蜗可以把声音转成电信号，然后再用这种电极和病人的听神经连接在一起，这样，先天性聋哑的孩子就可以听到声音了。


    人工耳蜗之所以神奇，就是它的信号传导到大脑之后，产生的声音和正常人听到的一模一样。


    这样，孩子就能学会说话，而且他的语言也和正常人一模一样。


    人工耳蜗让这些先天性聋哑的孩子有了尊严。


    晚期癌痛，医生们就用药物或者手术，让病人不那么疼。不疼这个事，可不是咱们没病的人想得那么简单。


    让病人在不疼中，有尊严地走完生命的最后时光，对于他们来说，比多活几天更重要。


    肢体残缺的病人可以安装假肢，重新恢复功能；精神分裂症的病人，已经有了有效的抗精神病药物，很多病人不仅完全控制了症状，而且还可以像正常人一样回归社会，回归家庭。


    生命第一，让肢体残缺的病人重新恢复功能，让遭受痛苦的人活得有尊严，这是它的第二个层面。


    ## 生命第一，支持生命的意义


    是不是能活着，还能有尊严地活着，就够了呢？


    不是，人是社会中的人，每个生命都在追求自己独特的意义。


    为了生命更有质量，为了实现自己的价值，他们并没有选择医生认为的最有利的方案。


    生命第一的第三个层面，就是支持人实现生命的意义。


    比如，如果不截肢病人可能会丢掉生命，但是有些病人坚持保腿，他认为有腿比活着更有意义。怎么办？


    再比如，一个乳腺癌的女性坚持要怀孕，怀孕就可能会加重她的病情，缩短她的生命。但在她看来，能有个后代就是她生命的全部意义。那么，医生要不要帮助她实现自己的愿望？


    还有，一个重要工作岗位上的科研人员患了癌症，但是他不能做手术，因为做手术会耽误重要的工作，工作就是他活着的意义，所以他坚持几个月后再说。医生怎么办？


    这些问题，我也请你想一想。


    生命第一，必须支持生命的意义。


    如果反复告知病人保腿可能会丧失生命，病人依然要保腿，那么医生必须在这个条件下，想尽一切办法。


    比如立刻开始血液净化，过滤血里面的毒素，切开大腿，反复清除它的坏死组织，严密观察，随时和病人交换意见，直到最后一刻。


    对想要怀孕生孩子的乳腺癌病人，医生应该尽量用对孩子干扰最小的医疗措施，去控制她的乳腺癌，一旦时机到来，立刻开展下一步治疗。


    对于不愿放弃工作而拖延手术的病人，医生要想法制定先化疗或者放疗的方案，尽全部可能延缓他的癌症进展，一旦工作结束，立刻手术。


    给所有的生命以希望，或许这个生命是残缺的，或许这个过程是打破常规的，或许这个结果是不确定的。


    但是，生命第一永远是医学存在的终极理由。


    ### 划重点


    1. 医学保障不了人类物种的延续。

    2. 医学存在的终极理由是生命第一。

    3. 生命第一包括三个层面的涵义：活着、尊严、意义。


    ### 下节预告


    下节课进入医学的第二大基础共识。有了医学，似乎攻克一个一个的病，就成了时间问题，那么人类能不能彻底消灭疾病呢？


    ## 02 | 疾病与人终生相伴


    2019-2-28


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    上节课，咱们学习了医学的第一大基础共识，医学存在的终极理由是生命第一。


    今天这节课，咱们就来聊聊“病”。


    对于疾病，不同的人会有不同的理解。我曾经做过这样一个调查：什么是病？你怎么看待病？


    答案五花八门。我总结了一下，大概可以分成两类：


    - 第一类，把病和感觉联系在一起。认为舒服就是没病，不舒服就是病了。

    - 第二类，把健康和疾病对立起来。认为健康就是没病，病就是不健康。


    你肯定曾经或者一直也是这么认为的。


    但是，这两种观点都是片面的。感觉不能和有没有病划等号，健康和疾病也没法分得那么开。


    用一句话就是说，我们的生命注定离不开疾病，疾病是生命的一种常态。


    这就是今天要讲的——疾病与人终生相伴。


    ### 病和感觉没有必然联系


    在理解这个共识之前，有必要先了解刚才那两种对于疾病的观点为什么都是片面的。


    第一种观点，把病和感觉联系在一起。


    确实，很多很多人是先有了不舒服的感觉，然后去医院检查，医生告诉你生病了。


    所以，很多人把不舒服和生病对等，也是可以理解的。


    但是，现在医学检查手段越来越高级。你会发现，很多病根本没症状，是去医院检查以后才发现的。


    也就是说，在没感觉的时候，可能已经病了。


    《科学》杂志发表了一项研究，它说肺癌可以在体内潜伏 20 多年，然后突然转变为侵袭性的癌症，开始攻击你的身体了。这个时候，肺癌会迅速恶化。


    那么肺癌潜伏的这 20 多年，身体没有任何不舒服的感觉，是没病吗？


    实际上，几乎多数癌症都经历了一个漫长的没有症状的过程。


    科学家推测，在 90 岁以上去世的人当中，如果能够给他们进行尸体解剖，很可能多数人体内都有癌症或者癌前病变，只是生前没有感觉而已。


    所以，感觉良好并不代表就没病。同样，感觉不舒服了，也未必是有病。


    比如怀孕早期，孕妇会出现剧烈的恶心、呕吐、倦怠、乏力，也都不是病。


    不舒服和疾病根本没有必然联系。


    ### 健康和疾病可以共存


    咱们再来说说，人们对于疾病的第二个常见的错误观念，把健康与疾病对立起来，认为健康是没病，病是不健康。


    这个观点，不光大部分普通人赞同，甚至连世界卫生组织给健康下的定义，也是这么说的。


    这个定义认为，健康不仅是没病，而且是生理、心理和社会适应三个方面的完美状态。


    但是对于这个定义，很多医生包括我自己在内，并不完全认可。


    为什么呢？如果按照这个定义：健康是没病，那这个世界上就不存在健康的人了。


    在我看来，没有疾病的绝对健康，是一种永远都不可能实现的乌托邦。疾病和健康之间，没有一条清晰的界限。


    举个例子，我们每个人从出生开始，得冠心病的风险就在不断增加。


    婴儿一出生，血管就开始逐渐地老化，到了成年，血管壁上开始出现斑块，血管会慢慢硬化变窄。


    这个时候是健康吗？肯定是健康的。算是病吗？也算，血管壁上出现斑块，能不是病吗？


    这就是一种健康和疾病共存的状态。


    当血管继续狭窄，超过 70%、80%，甚至 90%的时候，人就开始出现心绞痛的症状了。这个时候，不光是病了，而且必须得看医生。


    我认为健康包括两个方面：


    - 第一，健康是可以包容疾病的；

    - 第二，健康并不是排斥疾病，健康是可以生病，又能让疾病康复。


    所以，疾病和健康之间并不存在一个绝对的界限，二者是可以共存的。


    ### 疾病的本源是进化的不完美


    你可能会问：为什么疾病会与人共存，甚至要终生相伴？


    疾病，其实就是生命的另外一种常态。


    因为人类的进化并不完美。这些不完美，就是导致疾病伴随终生的原因。


    进化不完美，体现在三个方面：


    首先，我们的基因是不完美的。


    在我看来，几乎所有的疾病都和基因有关系。


    比如癌基因，在我们出生以前，这个坏东西就已经潜伏在我们的基因组里，等待时机，等待被激活。


    除了癌症，各种遗传病、慢性病，都跟基因有关。


    这种包含我们生命巨大遗传信息的最底层的东西，都是不完美的。


    其次，人体设计也是不完美的。


    - 比如，我们的胃可以分泌胃酸，杀灭几乎所有的细菌，甚至铁块进了胃都可以被腐蚀掉。但是，这么强悍的器官却斗不过小小的幽门螺旋杆菌。这种细菌让我们得胃炎、胃溃疡，甚至得胃癌的几率明显增加。

    - 再比如，我们人体的免疫系统可以攻击病毒、细菌、癌细胞，但是这么精密的自我保护体系，有时候却会误伤自己。这样就会产生自身免疫病，比如红斑狼疮、类风湿性关节炎等等。

    - 再比如，男性睾丸这么重要的设备，却几乎没有任何防护地“挂着”，这样就很容易受到撞击和伤害。


    可以说，几乎人体的每个器官都有不完美的地方。


    基因不完美，人体设计也不完美，够悲催了吧。


    但是，还有第三个不完美，人类与环境适应的不完美。


    人类进化的速度永远赶不上环境变化的速度，一个重要的结果就是带来了病。


    咱们这副身体最适合沙漠里那种穷日子，饱一顿，饿一顿。


    突然有钱了吃饱了，不用奔跑了，这也就带来了很多代谢类疾病，比如糖尿病、高血压、高血脂、高尿酸。


    我们没办法消除这些不完美，这也就注定了疾病与人终生相伴。


    ### 疾病也有价值


    听到这你可能会挺悲观：人一辈子都摆脱不了疾病这个坏东西了吗？


    但是我要说，疾病也并不永远都是灾难，它也有价值。


    举个例子：


    孟加拉国曾经是霍乱高发地区。15 岁以下的孩子，几乎一半以上的人都感染过霍乱。


    你可能知道，霍乱是一种消化道烈性传染病，感染之后人会腹泻，严重的几个小时就可能死亡。


    但你知道吗，现在的孟加拉国，尽管仍然会有人感染霍乱，但是有的人症状却很轻，有的甚至根本就没症状。


    这是怎么回事？


    科学家经过研究发现，这类感染了霍乱，但是症状却很轻微的人，在他们的基因里有 **305** 个 DNA 片段发生了改变。


    就是这些发生改变的基因，增强了他们对霍乱的抵抗能力。


    所以，疾病可以成为进化的动力，帮助整个物种的繁衍。


    你肯定会觉得，尽管这样自己也不愿意得病，健康比啥都好，至于几千年几万年以后的子孙就顾不上。


    那我可要告诉你，没有昨天的病，就没有咱们今天的健康。


    比如，我们的身体经常被病毒感染，感冒就是一种最常见的病毒感染。


    感冒病毒会不断地刺激我们的免疫系统，免疫系统也因为这种刺激，变得越来越强大，就可以抵御更严重的疾病了。


    应该说，孩子每次感冒都能让他的免疫系统变强一次。


    有一种最新的学说，叫做“卫生假说”。


    它认为，孩子的成长环境别太干净，应该多接触细菌和宠物，增加和微生物接触的机会。


    这样的孩子成年以后，免疫系统反而更强大，反而更不容易过敏。


    医生甚至利用疾病来预防疾病。


    比如打疫苗，打完可能会有些轻微的反应，比如发烧、倦怠、乏力。


    很多人把它理解成疫苗的副作用。其实，这就是让你生一场小病，用这个“生小病”的办法，产生免疫力来预防大病。


    这些内容，在以后的课程里都会讲到，这里就不多说了。


    所以，疾病尤其是小病，也不一定都是坏事。


    当然，目前这类研究主要还是集中在微生物感染领域。


    至于其他疾病是不是对人类也有价值，或者曾经有过价值，目前还缺乏可靠的证据，我们期待有更多的研究来证明。


    ### 划重点


    1. 疾病和感觉没有必然联系。

    2. 疾病和健康之间，没有清晰的界限，疾病和健康是可以共存的。

    3. 疾病也有价值，疾病可以刺激人体免疫，可以成为进化的动力，推动整个物种进化。


    ### 思考题


    你还知道哪些疾病，是因为进化不完美导致的？


    ### 下节预告


    既然疾病与人终生相伴，那治疗的本质是什么呢？下一讲，我们进入医学的第三个共识。


    ## 03｜医疗的本质是支持生命自我修复


    2019-2-28


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    上一讲，咱们说到了疾病与人终生相伴，每个人都难免生病。


    今天，咱们就来说说医疗的本质。


    说起医疗，你知道每天有多少外地病人进京看病吗？


    有个官方数字，每天至少有 70 多万。这么算下来，每年就是两个多亿。


    这些人风餐露宿，整宿守在医院门口，就为了一张专家号。


    你能想象病人排了一宿的队之后，见到医生是什么感觉吗？就像见了神一样。


    这种感觉，是人在疾病状态下，很容易产生的本能感觉。


    在中国，病人治好了病经常会给医生送一面锦旗，上面写着“医德高尚，妙手回春”。在他们眼里，这些治好病的医生也是“神”。


    那么，医生真的是神吗？病是怎么治好的？医疗的本质又是什么呢？


    美国医生萨斯（Thomas Szasz）说过：


    > 在宗教强盛而科学无力的从前，人们误将神的力量当作医疗；在科学强大而宗教弱势的今天，人们又误将医疗当成神力。


    这句话说出了人们看待医疗的两个极端：在以前，找神看病；在今天，把医疗想成无所不能。


    很多人就想当然地认为，得了病，就应该把自己全部交给医生。


    进医院就像进修理厂，医生用药或者手术刀修修补补，然后再把好端端的身体还给我。


    这个观点，听起来似乎很有道理，因为很多病确实是被治好的。


    但我要告诉你的是，真正治好病的，是病人自己。所有的医疗行为，只是起到支持的作用。


    这就是今天我要讲的——医疗的本质是支持生命自我修复。


    我要强调一下，这个共识包含了两个层面：


    - 首先是人体的自我修复，然后才是医学的支持。人体的自我修复是核心，是关键。


    ### 生命具有自我修复的能力


    为什么自我修复这么重要呢？


    咱们就看看如果没有自我修复，只有强大的医疗会发生什么？


    这个极罕见的病例已经过去2年了，但是直到今天，抢救的场景还让我历历在目。


    2年前，我接诊了一个20岁的男大学生，他服毒自杀，这个毒是秋水仙碱。


    秋水仙碱本来是一种治疗痛风的药，小剂量可以治病，但是超过剂量很容易中毒，甚至死亡。


    这个男生吃了500毫克，这个剂量超过了致死量的10倍。最可怕的是，这种毒根本没有解药。


    所有人都判断这个病人肯定希望渺茫，但是他太年轻了，所有的医生又都不甘心，都希望出现奇迹。


    我们请了各个科的专家会诊，洗胃、心电监护、呼吸机、血浆置换、持续血液净化、升压药物、PICCO……全世界最先进的医疗手段都用上了。


    但是，病人还是全部器官都衰竭了。


    他在昏迷之前，在纸上写了三个字“救救我”。不到72小时，抢救无效死亡。和教科书上写的一模一样，我们没能创造奇迹。


    我永远都能回忆起，得知这个男孩死亡的瞬间，父母爆发出的撕心裂肺的哭声。


    这么年轻的一条生命，眼睁睁地就没了，这似乎是一场失败的战役。


    是医生无能吗？不是。我自信我们是全国最优秀的抢救团队。


    是治疗力度不够吗？也不是。这个病例用尽了全世界最好的设备和药物。


    为什么这么年轻的生命却救不回来呢？


    最本质的原因，是病人失去了人类战胜疾病的最基本的环节——自我修复。


    你肯定知道，人体的自我修复主要靠细胞分裂。


    比如，咱们的皮肤上划破一个伤口，很快就会长出新的组织来填充这个伤口，靠的是细胞分裂；


    骨折之后，骨折的地方会长出骨痂，逐渐让断裂的部分愈合，靠的也是细胞分裂。


    回到这个男孩的病例，他服用的致死量的秋水仙碱，就是阻断了细胞的分裂，让细胞在分裂中期死亡。


    也就是说，细胞不再分裂了，不再产生新的细胞了，这就剥夺了疾病治愈最基本的环节——自我修复。


    为什么要讲这个病例呢？


    不是我们治不了中毒，而是这个孩子中的毒太特殊，让他无法自我修复。所以，有再强大的医疗也无济于事。


    医疗的作用，必须基于自我修复。


    ### 一切医疗都是支持自我修复


    讲到这你可能会产生困惑，既然生命必须要靠自我修复，那医疗还有什么用呢？


    我认为，在疾病面前，尤其是大病，医疗的支持作用是必不可少的。


    因为这个时候，人体的自我修复垮了。


    医疗的支持，就是给自我修复赢得时间、创造条件，等待自我修复最终发挥作用、战胜疾病。


    我工作的 ICU，也就是重症医学科，是疾病最重、距离死亡最近的地方。ICU 的治疗，体现了现代医学生命救护的最高形态。


    但我要告诉你的是，即便是 ICU 这种运用了全世界最前沿、最高端救命设备的地方，几乎所有的救命手段都是支持。


    - 你熟悉的呼吸机，是支持肺，让肺休息，等待自愈；

    - 你可能不太熟悉的床旁血液净化，是支持肾，替代肾脏的功能，等待自愈；

    - 甚至全世界最前沿的 ECMO，也就是老百姓常说的“魔肺”，是对心脏和肺，最高级别的支持。


    所有这些顶级的医疗设备，都是为了先把命保住，给自我修复赢得时间、创造条件，然后等待自我修复发挥作用。


    可能会说，有的病看上去确实是医生治好的，它怎么都跟自我修复没啥关系。


    比如肺炎，医生用抗生素杀死细菌，病人治愈。


    听上去确实是抗生素起了作用。但是这个例子，同样体现了“医疗的本质是支持自我修复”这个基本共识。


    为什么呢？


    得了肺炎，先用抗生素杀死大部分细菌，但是总有耐药的，没被杀死的细菌。怎么办？


    这个时候，人体的白细胞发挥作用，消灭剩下的细菌，让肺炎痊愈。


    白细胞吞噬、杀灭细菌的过程，就是自我修复。


    同样是肺炎，但是白血病患者或者艾滋病病人就没有这么幸运了，会非常难治，这些病人甚至会因为肺炎去世。


    因为这类病人的白细胞吞噬功能差，自我修复能力低下，因此，再强大的抗生素效果也不好。


    治愈疾病，最终靠的还是自我修复。


    ### 癌症免疫疗法：重新恢复自我修复


    自我修复能有多神奇呢？咱们再来看一个著名的案例。


    这个病例之所以著名，不仅仅是由于患者的特殊身份，更是由于这个病例，用到了全世界最前沿的医疗措施。同样，还有传奇的治疗效果。


    这个病人，就是美国前总统吉米·卡特（Jimmy Carter）。


    2015 年 8 月份，90 岁的卡特总统，被诊断得了恶性黑色素瘤。更可怕的是，已经发生了脑转移。


    你肯定能够想象，对于一个 90 岁的老人，预示着什么？

    '
