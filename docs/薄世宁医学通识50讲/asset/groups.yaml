    这就是在治病过程中，总能遇到一条老路在新困难面前走不通了，那么，就必须要开拓一条新路。


    # 各种新的能量投放系统


    纵观医学技术的发展，绝大多数新技术都是在老路走不通，或者走不好的情况下，医生必须转换思路，从而诞生的。


    这些新技术的出现，目的是解决新问题。


    不同的技术具有各自相应的适应症，又有各自的优缺点。这些技术让医学目标越来越近患者需求。


    举几个你熟悉的例子：


    比如，在我国每年有 110 多万早产儿出生。这其中就有很多离开母体不能独立生存的孩子。'
