  - '[PAGE 328]


    从英国剑桥大学毕业，曾经在西方做过传染病研究的伍连德医生临危受命。清政府任命伍连德为东三省防疫全权总医官。


    到了哈尔滨的第三天，伍连德在地下室秘密解剖因为瘟疫死亡的尸体。显微镜下的发现让他大惊失色。


    他清楚地看到了一种椭圆形的细菌，这种细菌就是鼠疫杆菌。


    鼠疫也被称为黑死病，我在前面的课程里说过， 14 世纪欧洲爆发鼠疫，三年死亡 2500万人。这是人类历史上最烈性的瘟疫之一。


    但是伍连德想不透，鼠疫主要通过老鼠传染给人。 12 月份的东北大地已经天寒地冻了，老鼠根本就很少活动，怎么可能疫情传播这么快？会不会是一种新的鼠疫类型呢？


    伍连德想到这里，冷汗瞬间就滴了下来。


    如果是人和人之间传播，那么就太可怕了，难怪传播速度如此之快。在东北，一到冬天家家户户户都是门窗紧闭。只要是家里有人感染了这次瘟疫，那么全家都在劫难逃。


    伍连德认为，这是一种新型鼠疫，在人和人之间经过呼吸道传播。他给这个病起了一个名字——肺鼠疫。中国哈尔滨面临灭城之灾。


    在人类历史上，很多瘟疫早期根本无药可治。


    比如天花、霍乱；比如 2003 年中国非典病毒，近些年非洲的埃博拉病毒；再比如 1910年的哈尔滨鼠疫。


    鼠疫的特效药是在 33 年之后的 1943 年才有的，叫做链霉素（streptomycin）。也就是说，伍连德当时控制鼠疫根本没有药。


    # 大规模传染病的控制原则


    伍连德用了什么方法呢？'
  - '[PAGE 329]


    这就是这节课要说的大规模传染病的控制原则：管理传染源，切断传播途径，保护易感人群。


    肺鼠疫的传染源，就是感染了鼠疫的病人或者尸体。传播途径就是呼吸道传播，通过空气、飞沫传播。


    什么是肺鼠疫的易感人群呢？在当时没有疫苗，所以无论老人、儿童还是成年人，只要是接触到病人，那就都容易被感染。所以，当时所有的中国人都是易感人群。


    当时，无论是百姓还是行政长官，对于传染病控制几乎一无所知。


    老百姓只知道发生了瘟疫，所以就是逃离。家里有了病人，却隐瞒不报，或者到了晚上偷偷地把病危的病人扔在街上。所以，很多尸体被发现的时候，双手蜷在胸前，保持着一个取暖的姿势。


    当时的防疫之难可想而知。


    伍连德让士兵挨家挨户搜查，一旦发现病人，立刻送到防疫医院，房屋用生硫磺和石炭酸消毒。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_329_0.png)'
  - '[PAGE 330]


    他克服重重阻力焚烧尸体。先是 用炸药爆破、挖坑。然后按照每百个尸体 10 加仑的标准浇上煤油，对尸体进行焚烧、掩埋。这就是管理传染源。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_330_0.png)


    怎么切断传播途径呢？


    既然肺鼠疫是人和人之间呼吸道传播，所以必须减少人员流动并且采取隔离。


    他从长春抽调 1160 名士兵进行交通管制，任何人都不可能穿越封锁线。日本控制的南满铁路，俄国控制的东清铁路相继停驶。伍连德在山海关设立检疫所，凡是经此南下的旅客都要停留
    5 天，观察有没有得病。


    在哈尔滨，伍连德设计了一种简易的双层纱布囊口罩，在两层纱布中间放一块吸水药棉，戴上它就可以阻断呼吸道传播。关键是这种口罩成本低，易推行。'
  - '[PAGE 331]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_331_0.png)


    同时，他又按照病情分为疫苗院、轻病院、疑似病院几种。为不同病情的病人进行治疗的同时，还防止了交叉感染。


    管理了传染源，切断了传播途径，自然也就保护了易感人群。在这种科学、规范的防控措 施下，在短短不到 4 个月的时间，死亡人数就下降到 0。


    1911 年 3 月 1 日，当鼠疫死亡人数零报告的时候，防疫总部内一片沸腾。这是人类历史 上第一次依靠科学手段，在人口密集的大城市成功控制传染病的典范。


    这次鼠疫牺牲了 6 万人的生命，但是在当时的中国，这已经是个奇迹了。要知道欧洲三 年鼠疫，牺牲了 2500 万人。


    一个月后，“万国鼠疫研究会”在奉天（沈阳）召开，11 个国家的代表出席大会，伍连德 任大会主席。这是中国历史上在本土举办的第一次真正意义上的世界学术会议。伍连德
    以发现肺鼠疫，战胜鼠疫，扬名天下。


    1937 年，日本侵华战争爆发，伍连德在上海的家被炸毁，他回到马来西亚。1960 年 1 月 21 日，伍连德因为心脏病去世。'
  - '[PAGE 332]


    伍连德用肉身之躯，阻遏了中国鼠疫爆发，他是中国检疫防疫的先驱者之一。


    接下来，我们通过这个案例，分析一下对于不明原因、烈性、极速扩散的传染病的群体防控特点。


    # 防控不以明确传染源为前提


    治疗普通疾病，首先要了解准确的病因、病原体、发病机制。机制研究得越透彻，治疗效果也就越好。


    但是，突如其来的烈性传染病不同。在烈性传染病面前，如果能迅速找到病原体，无疑对于整个疫情的控制都是非常有利的。伍连德第一时间找到了鼠疫杆菌，这也是不幸中的万幸。


    但是，如果在瘟疫早期病原体不明，或者遇到一种前所未有的传染病怎么办？


    比如中国 2003 年的非典。在早期我们不知道这种病的病原体。到底是细菌还是病毒？如果是病毒，是什么类型的病毒？


    在病原体不明的情况下怎么办？


    不能等。


    防控的第一个层面：对于大规模原因不明的传染病防控，不能以了解病原体为必须前提。应该迅速判断疾病的性质和导致的危害。


    搞清楚病原体可能对什么敏感，对什么不敏感。迅速判断传播途径，是飞沫传播，还是经过水系或者消化道传染。


    了解传播途径之后，才可能制定针对性的措施。如果是飞沫、呼吸道传播，那么就应该像伍连德的案例一样，按照呼吸道传染病进行管理。'
  - '[PAGE 333]


    如果是水系污染导致的消化道传染病，比如霍乱，那么防控重点就应该是处理饮用水、垃圾、粪便，管理食品与河道排放等。


    传播途径不同，群体防控的重点也不同。


    一旦明确传播途径，就到了防控的第二个层面：迅速进行科学的防控措施，为治疗争取时间。群体利益为主，群体利益和个体利益兼顾。


    病原体不明的情况下，或者在伍连德的案例中，即便知道了是鼠疫，但是当时没有特效的药物怎么办？


    不能等。


    按照群体防控的措施：管理传染源，切断传播途径，保护易感人群。


    将不同病情的病人，也就是可疑感染者、感染者和严重病情的病人，进行隔离分类治疗。这既避免了疫情扩大，保护了其他人群，也能对感染者进行悉心治疗，同时体现出医学在重大疫情面前的关爱和救护。


    伍连德医生当时采用的防控措施，在今天依然适用于各种烈性传染病的控制，中国公共卫生管理部门已经具备了丰富经验。


    近年来，非洲埃博拉疫情爆发，中国政府派遣公共卫生管理人员和医生远赴非洲协助瘟疫控制。我们科就有一位医生被派遣去了非洲，圆满地完成了任务。


    划重点


    1. 伍连德医生在非常落后的条件下，用科学方法战胜鼠疫，为人类战胜大规模烈性传染病提供了宝贵经验。 2. 在突发、不明原因的大型传染病早期，即便在不能了解病原体的前提下，按照科学的群体防控流程，就有助于控制疫情。
    3. 控制大规模传染病的原则：管理传染源，切断传播途径，保护易感人群。'
  - '[PAGE 334]


    伍连德是我最敬重的医生，他是马来西亚华侨，但是他直到离世都在说，“我是个中国人”。


    他说过：


    我曾经将我的大半生奉献给古老的中国。从清朝末年到民国建立，直到国民党统治崩溃，那一切在许多人的脑海里记忆犹新。中国是个有五千年历史的伟大文明古国，历经世世代代的兴衰荣辱，才取得了今天的地位，我衷心地希望她能更加繁荣昌盛。


    # 下节预告


    女医生如何成为医学行业重要的组成部分？下节课，我们介绍一位中国女医生的代表——林巧稚。'
  - '[PAGE 335]


    # 43 ｜林巧稚：为什么现在女医生那么多？


    2019-4-10


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    1962 年，北京协和医院妇产科主任林巧稚收到一封来信，信是这样说的：


    > 我是怀了五胎的人了，前四胎都没活成，其中的后三胎都是出生后发黄夭折的。求求你伸出热情的手，千方百计地救救我这腹中的孩子。落款人：内蒙古包头_焦海棠


    看到这里，林巧稚医生立刻想到，前面几个孩子夭折的原因一定是严重的新生儿溶血病。这种病主要是母子血型不合引起的。孩子的红细胞破碎、溶血，导致黄疸，严重的病例很快就会死亡。


    在当时的中国，这种病只要是重型，还没有一个存活的先例。在全世界也只有少数病例得到治愈。


    林巧稚让焦海棠来到北京，她亲自接生。生产过程非常顺利，焦海棠生下了一个 5 斤 8 两的男婴。


    但是几个小时后，孩子的皮肤迅速变黄，最令人担心的事还是发生了。孩子发生了致命性的新生儿溶血病。


    其实在病人来之前，林巧稚医生已经检索了大量文献，研究了世界上对于这个病的治疗进展。她知道这个孩子需要换血。


    但是应该怎么换？换多少？什么速度换？换血过程中应该注意什么？这些都没有先例可循。


    林巧稚和内科、外科、儿科、病理科的专家一起讨论。最后，她决定为了救命，冒险给孩子换血。'
  - '[PAGE 336]


    林巧稚守在孩子床边，她小心翼翼地每分钟给孩子抽出 15 毫升病血，然后再输回去 8 毫升健康的血，就这么一管一管地换。时间一分一分地过去了，最后，她给孩子换了
    400 毫升血。孩子的皮肤也越来越红润了。


    按照这个做法，林巧稚总共给孩子换了三次血。最终，她救活了孩子。


    孩子的妈妈焦海棠后来回忆：“特别辛苦。整整七天，林巧稚医生不离开孩子，什么都 是她管。”


    为了感谢协和医院，感谢林巧稚医生，妈妈给孩子取名王协和。


    直到今天，换血疗法仍然是对于严重新生儿溶血病的一项关键的救治方法。


    林巧稚医生就是这节课要讲的大医生。她是北京协和医院第一任中国籍妇产科主任，她 是中国医生的表率，是中国女医生的表率。'
  - '[PAGE 337]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_337_0.png)


    # 林巧稚


    中国妇产科的开创者


    1901 年，林巧稚出生在厦门鼓浪屿。5 岁的时候，她目睹了母亲因为妇科癌症离开人世的悲剧，她立志用医学拯救病痛中的人民。


    1921 年，21 岁的林巧稚考取了北京协和医学院。协和医院是当时乃至今天，中国最好的医学院之一。在当时，协和医院采取的是西方医学教育模式，一届只招收 25
    人，能考取的人凤毛麟角。


    在这些出类拔萃的医学生中，林巧稚的成绩遥遥领先，而且拿到了最高奖学金"文海奖"。


    1929 年，林巧稚获得医学博士学位，留在协和妇产科工作。'
  - '[PAGE 338]


    当时的住院医师培训相当严格和辛苦，林巧稚吃住在医院。半年后，她被破格提升为协和医院住院总医师。按照常规，一般的医生要工作五年才可能得到这个提升。


    后来，林巧稚先后到欧洲、美国学习。


    在协和医院建院之初，医院的专家大多数都是外国人。但是在30年代以后，中国医生逐步成长起来，包括曾宪九、吴英恺、诸福棠、林巧稚等等，他们每一个人后来都成为奋斗级的医学大家。


    1940年，39岁的林巧稚担任协和医院妇产科主任。这是协和医院以来，第一位中国医生担任妇产科主任。


    新中国成立后，林巧稚的事业达到巅峰。1955年，她成为新中国第一位女学部委员，也就是女院士。


    林巧稚具备大医生的全部特质。


    首先，学术贡献。


    林巧稚是中国妇产科的主要开创者和奠基人之一，在她主持和倡导下，中国开展了第一次大规模的宫颈癌筛查。这项举措让宫颈癌早期发现率提升了大约8倍。'
  - '[PAGE 339]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_339_0.png)


    宫颈癌筛查


    林巧稚走进百姓家进行宫


    林巧稚对常见的妇科肿瘤进行探索研究，让这些病的病死率得到降低。


    为了得到中国妇女骨盆尺寸的正确数值，她检索和查阅了上万份病例，让女人生孩子更安全。即便是在她将近 80 岁的时候，仍然在病床上完成了 50 万字的著作《妇科肿瘤学》。


    其次，职业精神。


    林巧稚追求科学，率先对妇产科学许多方面进行了研究。同时，还手把手地教育年轻医生。她教学严谨，培养出了很多医学专家。


    最后，看病不看人。'
  - '[PAGE 340]


    意思是不论病人身份高低，林巧稚都用医生的严谨和关爱治疗病人。


    虽然她自己没有孩子，但是她亲自接生了 5 万多名婴儿，包括水稻之父袁隆平，冰心的孩子和林徽因的孩子。但是，林巧稚接生的最多是普通百姓的孩子。她被称为“万婴之母”。


    无论时光如何变迁，在中国的医学界，林巧稚医生永远是医生学习的榜样，是大家敬爱的老师。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_340_0.png)


    # 一生未婚的职业承诺


    很多人感慨于林巧稚医生聪慧、刻苦、敬业、爱国、仁爱。但是很少有人知道，在曾经以男医生为绝对主力的医学领域，女性从医所付出的代价和艰辛。


    这些艰辛有些来自社会偏见，有些来自家庭的压力，有些则源于观念的束缚。


    当时的观点是，学医是件艰苦的事，培养医生的过程需要大量的资源和个人的努力，结婚生子就可能让人分心。女性不可能同时扮演贤妻良母和职业女性两种角色，只能选其一。


    所以，林巧稚毕业留院的时候，当时医院给她的聘书是这样写的：'
  - '[PAGE 341]


    茲聘请林巧稚女士，任协和医院妇产科助理住院医师……聘任期间凡因结婚、怀孕、生育者，作自动解除聘约论。


    今天我们在医院看到很多女医生，太正常不过了。但是你可能不知道，在 170 年前，现代医学体系下是没有女医生的，在当时很多专业领域对女性存有偏见。


    根据资料显示，西方现代医学第一位女医生叫做伊丽莎白·布莱克威尔（1821—1910）。她报考医学院，几乎全部医学院都拒绝她。最后，她不得不上了一个当时不是很有名的学校。


    1849 年，她获得医学学位，但是找工作，又遇到了困难。拒绝的理由还是几乎都一致：“医生是一门艰难的工作，不适合女性。”


    所以，在林巧稚医生那个年代，一位杰出的女性做一名医生的个人代价就是不结婚。这并不完全是自愿的，而是受到了当时观念的影响。


    实际上，当时协和毕业的几位女老师都是终身未嫁。虽然，后来这项规定取消了，但是为了事业，很多人还是选择了单身。


    在今天，这种偏见已经被打破了。林巧稚医生的事迹告诉我们，女性在医疗岗位上同样可以做出优秀的成续。


    # ### 女医生的独特优势


    第一，女性从医，支持了患者的选择权。


    病人看病会有各种考虑，比如隐私、文化；再比如，有的人认为女医生温和细致，有人认为男医生果斷干脆。所以，实际上患者会选择医生的性别。


    在今天，女医生多了，也就支持了患者的选择权。


    2016 年，斯坦福大学的一项研究指出，50.2%的女性倾向于看女妇科医生，41%的女性没有选择倾向，8.3%的女性更希望选择男妇科医生。'
  md: '

    未必。


    再回到塞医生这个病例。1850年，塞医生在集体会议上宣布他的发现。但是，他等来的不是欢呼，而是攻击。


    他写了文章却一直不被发表。后来，好不容易发表了，也并没有在医学界引起大家的关注。再后来，塞医生丢了工作，出现抑郁，因为精神失常被送进了精神病院。再后来，他被精神病院的保安用棍棒打死，享年47岁。


    你可能会认为，这是自我纠错、自我揭短，从而受到了保守势力的攻击。但是我却不完全这么认为。


    只有提高整体认知，才是纠正无知之错的根本。


    在以前，关于传染病，人们要么认为是四体液不平衡，是人体内部出问题了。要么认为是“瘴气”或者是外层空间出问题了。这两种学说带来的认知，显然不能演化出有效的方法。


    - 1543年，意大利帕多瓦大学的维萨里（Andreas Vesalius）发表《人体的构造》（De humani corporis fabrica），标志着现代解剖学诞生；

    - 1761年，意大利解剖学家莫尔加尼（Giovanni Battista Morgagni）发表《病灶与病因》（De Sedibus et Causis
    Morborum per Anatomen Indagatis），建立了病理解剖学；

    - 后来，人类有了显微镜，在放大400倍之后看到了细菌轮廓，放大到1000倍以后看到了清晰的细菌形态；

    - 再后来，巴斯德（Louis Pasteur）和李斯特（Joseph Lister）奠定了微生物理论，证明了细菌可以传染疾病，严格的消毒和防护制度，可以有效避免交叉感染。


    只有整体认知提高，才是解决无知之错的终极方案。一旦无知之错被发现、被纠正，那么必将带来一个巨大的突破。


    ### 塞麦尔维斯曾说：


    蓦然回首，我只期待能有一天消灭这种产褥感染，用这样的快乐来驱散我的悲哀。但是事与愿违，我虽然不能亲眼目睹这幸福的时刻，那就坚信这一天迟早会到来！


    洗手制度，掀起了一场纠正体系无知之错的革命。


    在今天，有了微生物理论、消毒制度、医院感染防控制度、标准化防护制度、抗生素预防与合理使用、外科手术中的无菌原则等等。


    医学通过不断地纠正各种错误，再加上各种新型药物和助产技术，以及科学的规范，给予病人越来越科学的治疗。


    2018年，中国孕产妇病死率是18.3/10万，这个数字大约是塞医生当年一病区产妇产病死率的1/1000。


    塞医生被全世界称为“母亲的救星”，他的雕像屹立在匈牙利广场上，屹立在很多医院的花园里。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_324_0.png)


    塞麦尔维斯雕像


    医学的路，永远在纠错中前行。


    ## 划重点


    - 无知之错是没有掌握正确的知识，导致犯错误。

    - 科学方法，可以有效地发现体系的无知之错。

    - 提高认知水平，是解决无知之错的根本方法。


    ## 下节预告


    我国公共卫生制度是如何建立起来的？下节课，我们介绍以“肉身”抗击中国鼠疫的医生——伍连德。


    # 42 ｜伍连德：公共卫生如何战胜大规模传染病？


    2019-4-9


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    这节课要讲的大医生，曾经为近代中国医学的发展做过巨大贡献。


    中华医学会、哈尔滨医科大学、解放军202医院、北京大学人民医院，这些医院或者机构的前身都和他有关。


    他是1935年诺贝尔生理学或医学奖候选人之一，是第一个距离诺奖最近的华人。


    我们戴的棉口罩，还有今天饭桌上的旋转餐台，都是这个医生发明的。


    梁启超曾经说：


    > 科学输入垂50年，国中能以学者资格与世界相见者，伍星联博士一人而已！


    梁启超说的这个伍星联博士，就是伍连德。伍连德字星联。他的意思是说，当时能够站在世界舞台的中国医生，只有他一个。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_326_0.png)


    不过这节课，我们不讲伍连德的学术贡献，也不说他和诺奖擦肩而过的遗憾，更不说他主持筹建的医院和组织。


    我们说说100多年前，发生在中国东北大地上那场惨绝人寰的鼠疫，看看伍连德是怎么用科学的公共卫生手段，战胜了大规模烈性传染病。


    ## “肉身”抗击东北鼠疫


    1910年，末代皇帝溥仪只有4岁，晚清政权摇摇欲坠，内忧外患。


    10月25日这天，有两个皮毛贩子从俄国来到满洲里，投宿在一家叫做“魁生元”的小旅馆里。


    当天晚上这俩人就病了。发高烧、剧烈地咳嗽、大口大口地咳血。没两天人就死了，身上布满了淤血的斑。


    又过了两天，和他俩同住的其他两个旅客也病了。旅店老板见到人的时候，人已经死去了，浑身青紫，地面上有大量的血痰。


    几天后，千里之外的哈尔滨就发现了大量症状一模一样的病人。这是一场触之即死的烈性瘟疫。


    但是，这种情况并没有引起政府关注。


    不到两个月，这场瘟疫迅速沿着中东铁路，经过海拉尔、齐齐哈尔再到大庆，再到哈尔滨，再到长春，再到奉天（今天的沈阳），然后奔着北京如火燎原般地迅速蔓延开来。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_327_0.png)


    这个时候，再腐败无能的清政府也必须倾全国之力，遏制瘟疫。


    从英国剑桥大学毕业，曾经在西方做过传染病研究的伍连德医生临危受命。清政府任命伍连德为东三省防疫全权总医官。


    到了哈尔滨的第三天，伍连德在地下室秘密解剖因为瘟疫死亡的尸体。显微镜下的发现让他大惊失色。


    他清楚地看到了一种椭圆形的细菌，这种细菌就是鼠疫杆菌。


    鼠疫也被称为黑死病，我在前面的课程里说过，14世纪欧洲爆发鼠疫，三年死亡2500万人。这是人类历史上最烈性的瘟疫之一。


    但是伍连德想不透，鼠疫主要通过老鼠传染给人。12月份的东北大地已经天寒地冻了，老鼠根本就很少活动，怎么可能疫情传播这么快？会不会是一种新的鼠疫类型呢？


    伍连德想到这里，冷汗瞬间就滴了下来。


    如果是人和人之间传播，那么就太可怕了，难怪传播速度如此之快。在东北，一到冬天家家户户都是门窗紧闭。只要是家里有人感染了这次瘟疫，那么全家都在劫难逃。


    伍连德认为，这是一种新型鼠疫，在人和人之间经过呼吸道传播。他给这个病起了一个名字——肺鼠疫。中国哈尔滨面临灭城之灾。


    在人类历史上，很多瘟疫早期根本无药可治。


    - 比如天花、霍乱；

    - 比如2003年中国非典病毒，近些年非洲的埃博拉病毒；

    - 再比如1910年的哈尔滨鼠疫。


    鼠疫的特效药是在33年之后的1943年才有的，叫做链霉素（streptomycin）。也就是说，伍连德当时控制鼠疫根本没有药。


    ## 大规模传染病的控制原则


    伍连德用了什么方法呢？


    这就是这节课要说的大规模传染病的控制原则：管理传染源，切断传播途径，保护易感人群。


    肺鼠疫的传染源，就是感染了鼠疫的病人或者尸体。传播途径就是呼吸道传播，通过空气、飞沫传播。


    什么是肺鼠疫的易感人群呢？在当时没有疫苗，所以无论老人、儿童还是成年人，只要是接触到病人，那就都容易被感染。所以，当时所有的中国人都是易感人群。


    当时，无论是百姓还是行政长官，对于传染病控制几乎一无所知。


    老百姓只知道发生了瘟疫，所以就是逃离。家里有了病人，却隐瞒不报，或者到了晚上偷偷地把病危的病人扔在街上。所以，很多尸体被发现的时候，双手蜷在胸前，保持着一个取暖的姿势。


    当时的防疫之难可想而知。


    伍连德让士兵挨家挨户搜查，一旦发现病人，立刻送到防疫医院，房屋用生硫磺和石炭酸消毒。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_329_0.png)


    他克服重重阻力焚烧尸体。先是炸药爆破、挖坑。然后按照每百个尸体10加仑的标准浇上煤油，对尸体进行焚烧、掩埋。这就是管理传染源。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_330_0.png)


    怎么切断传播途径呢？


    既然肺鼠疫是人和人之间呼吸道传播，所以必须减少人员流动并且采取隔离。


    他从长春抽调1160名士兵进行交通管制，任何人都不可能穿越封锁线。日本控制的南满铁路，俄国控制的东清铁路相继停驶。伍连德在山海关设立检疫所，凡是经此南下的旅客都要停留5天，观察有没有得病。


    在哈尔滨，伍连德设计了一种简易的双层纱布囊口罩，在两层纱布中间放一块吸水药棉，戴上它就可以阻断呼吸道传播。关键是这种口罩成本低，易推行。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_331_0.png)


    同时，他又按照病情分为重症院、轻病院、疑似病院几种。为不同病情的病人进行治疗的同时，还防止了交叉感染。


    管理了传染源，切断了传播途径，自然也就保护了易感人群。在这种科学、规范的防控措施下，在短短不到4个月的时间，死亡人数就下降到0。


    1911年3月1日，当鼠疫死亡人数零报告的时候，防疫总部内一片沸腾。这是人类历史上第一次依靠科学手段，在人口密集的大城市成功控制传染病的典范。


    这次鼠疫牺牲了6万人的生命，但是在当时的中国，这已经是个奇迹了。要知道欧洲三年鼠疫，牺牲了2500万人。


    一个月后，“万国鼠疫研究会”在奉天（沈阳）召开，11个国家的代表出席大会，伍连德任大会主席。这是中国历史上在本土举办的第一次真正意义上的世界学术会议。伍连德以发现肺鼠疫，战胜鼠疫，扬名天下。


    1937年，日本侵华战争爆发，伍连德在上海的家被炸毁，他回到马来西亚。1960年1月21日，伍连德因为心脏病去世。


    伍连德用肉身之躯，阻遏了中国鼠疫爆发，他是中国检疫防疫的先驱者之一。


    接下来，我们通过这个案例，分析一下对于不明原因、烈性、极速扩散的传染病的群体防控特点。


    ## 防控不以明确传染源为前提


    治疗普通疾病，首先要了解准确的病因、病原体、发病机制。机制研究得越透彻，治疗效果也就越好。


    但是，突如其来的烈性传染病不同。在烈性传染病面前，如果能迅速找到病原体，无疑对于整个疫情的控制都是非常有利的。伍连德第一时间找到了鼠疫杆菌，这也是不幸中的万幸。


    但是，如果在瘟疫早期病原体不明，或者遇到一种前所未有的传染病怎么办？


    比如中国2003年的非典。在早期我们不知道这种病的病原体。到底是细菌还是病毒？如果是病毒，是什么类型的病毒？


    在病原体不明的情况下怎么办？


    不能等。


    防控的第一个层面：对于大规模原因不明的传染病防控，不能以了解病原体为必须前提。应该迅速判断疾病的性质和导致的危害。


    搞清楚病原体可能对什么敏感，对什么不敏感。迅速判断传播途径，是飞沫传播，还是经过水系或者消化道传染。


    了解传播途径之后，才可能制定针对性的措施。如果是飞沫、呼吸道传播，那么就应该像伍连德的案例一样，按照呼吸道传染病进行管理。


    如果是水系污染导致的消化道传染病，比如霍乱，那么防控重点就应该是处理饮用水、垃圾、粪便，管理食品与河道排放等。


    传播途径不同，群体防控的重点也不同。


    一旦明确传播途径，就到了防控的第二个层面：迅速进行科学的防控措施，为治疗争取时间。群体利益为主，群体利益和个体利益兼顾。


    病原体不明的情况下，或者在伍连德的案例中，即便知道了是鼠疫，但是当时没有特效的药物怎么办？


    不能等。


    按照群体防控的措施：管理传染源，切断传播途径，保护易感人群。


    将不同病情的病人，也就是可疑感染者、感染者和严重病情的病人，进行隔离分类治疗。这既避免了疫情扩大，保护了其他人群，也能对感染者进行悉心治疗，同时体现出医学在重大疫情面前的关爱和救护。


    伍连德医生当时采用的防控措施，在今天依然适用于各种烈性传染病的控制，中国公共卫生管理部门已经具备了丰富经验。


    近年来，非洲埃博拉疫情爆发，中国政府派遣公共卫生管理人员和医生远赴非洲协助瘟疫控制。我们科就有一位医生被派遣去了非洲，圆满地完成了任务。


    ## 划重点


    - 伍连德医生在非常落后的条件下，用科学方法战胜鼠疫，为人类战胜大规模烈性传染病提供了宝贵经验。

    - 在突发、不明原因的大型传染病早期，即便在不能了解病原体的前提下，按照科学的群体防控流程，就有助于控制疫情。

    - 控制大规模传染病的原则：管理传染源，切断传播途径，保护易感人群。


    伍连德是我最敬重的医生，他是马来西亚华侨，但是他直到离世都在说，“我是个中国人”。


    他说过：


    我曾经将我的大半生奉献给古老的中国。从清朝末年到民国建立，直到国民党统治崩溃，那一切在许多人的脑海里记忆犹新。中国是个有五千年历史的伟大文明古国，历经世世代代的兴衰荣辱，才取得了今天的地位，我衷心地希望她能更加繁荣昌盛。


    ## 下节预告


    女医生如何成为医学行业重要的组成部分？下节课，我们介绍一位中国女医生的代表——林巧稚。


    # 43 ｜林巧稚：为什么现在女医生那么多？


    2019-4-10


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    1962年，北京协和医院妇产科主任林巧稚收到一封来信，信是这样说的：


    > 我是怀了五胎的人了，前四胎都没活成，其中的后三胎都是出生后发黄夭折的。求求你伸出热情的手，千方百计地救救我这腹中的孩子。落款人：内蒙古包头_焦海棠


    看到这里，林巧稚医生立刻想到，前面几个孩子夭折的原因一定是严重的新生儿溶血病。这种病主要是母子血型不合引起的。孩子的红细胞破碎、溶血，导致黄疸，严重的病例很快就会死亡。


    在当时的中国，这种病只要是重型，还没有一个存活的先例。在全世界也只有少数病例得到治愈。


    林巧稚让焦海棠来到北京，她亲自接生。生产过程非常顺利，焦海棠生下了一个5斤8两的男婴。


    但是几个小时后，孩子的皮肤迅速变黄，最令人担心的事还是发生了。孩子发生了致命性的新生儿溶血病。


    其实在病人来之前，林巧稚医生已经检索了大量文献，研究了世界上对于这个病的治疗进展。她知道这个孩子需要换血。


    但是应该怎么换？换多少？什么速度换？换血过程中应该注意什么？这些都没有先例可循。


    林巧稚和内科、外科、儿科、病理科的专家一起讨论。最后，她决定为了救命，冒险给孩子换血。


    林巧稚守在孩子床边，她小心翼翼地每分钟给孩子抽出15毫升病血，然后再输回去8毫升健康的血，就这么一管一管地换。时间一分一分地过去了，最后，她给孩子换了400毫升血。孩子的皮肤也越来越红润了。


    按照这个做法，林巧稚总共给孩子换了三次血。最终，她救活了孩子。


    孩子的妈妈焦海棠后来回忆：“特别辛苦。整整七天，林巧稚医生不离开孩子，什么都 是她管。”


    为了感谢协和医院，感谢林巧稚医生，妈妈给孩子取名王协和。


    直到今天，换血疗法仍然是对于严重新生儿溶血病的一项关键的救治方法。


    林巧稚医生就是这节课要讲的大医生。她是北京协和医院第一任中国籍妇产科主任，她是 中国医生的表率，是中国女医生的表率。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_337_0.png)


    ## 林巧稚


    ### 中国妇产科的开创者


    1901年，林巧稚出生在厦门鼓浪屿。5岁的时候，她目睹了母亲因为妇科癌症离开人世的悲剧，她立志用医学拯救病痛中的人民。


    1921年，21岁的林巧稚考取了北京协和医学院。协和医院是当时乃至今天，中国最好的医学院之一。在当时，协和医院采取的是西方医学教育模式，一届只招收25人，能考取的人凤毛麟角。


    在这些出类拔萃的医学生中，林巧稚的成绩遥遥领先，而且拿到了最高奖学金"文海奖"。


    1929年，林巧稚获得医学博士学位，留在协和妇产科工作。


    当时的住院医师培训相当严格和辛苦，林巧稚吃住在医院。半年后，她被破格提升为协和医院住院总医师。按照常规，一般的医生要工作五年才可能得到这个提升。


    后来，林巧稚先后到欧洲、美国学习。


    在协和医院建院之初，医院的专家大多数都是外国人。但是在30年代以后，中国医生逐步成长起来，包括曾宪九、吴英恺、诸福棠、林巧稚等等，他们每一个人后来都成为奋斗级的医学大家。


    1940年，39岁的林巧稚担任协和医院妇产科主任。这是协和医院以来，第一位中国医生担任妇产科主任。


    新中国成立后，林巧稚的事业达到巅峰。1955年，她成为新中国第一位女学部委员，也就是女院士。


    林巧稚具备大医生的全部特质。


    首先，学术贡献。


    林巧稚是中国妇产科的主要开创者和奠基人之一，在她主持和倡导下，中国开展了第一次大规模的宫颈癌筛查。这项举措让宫颈癌早期发现率提升了大约8倍。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_339_0.png)


    宫颈癌筛查


    林巧稚走进百姓家进行宫颈癌筛查


    林巧稚对常见的妇科肿瘤进行探索研究，让这些病的病死率得到降低。


    为了得到中国妇女骨盆尺寸的正确数值，她检索和查阅了上万份病例，让女人生孩子更安全。即便是在她将近80岁的时候，仍然在病床上完成了50万字的著作《妇科肿瘤学》。


    其次，职业精神。


    林巧稚追求科学，率先对妇产科学许多方面进行了研究。同时，还手把手地教育年轻医生。她教学严谨，培养出了很多医学专家。


    最后，看病不看人。


    意思是不论病人身份高低，林巧稚都用医生的严谨和关爱治疗病人。


    虽然她自己没有孩子，但是她亲自接生了5万多名婴儿，包括水稻之父袁隆平，冰心的孩子和林徽因的孩子。但是，林巧稚接生的最多是普通百姓的孩子。她被称为“万婴之母”。


    无论时光如何变迁，在中国的医学界，林巧稚医生永远是医生学习的榜样，是大家敬爱的老师。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_340_0.png)


    ## 一生未婚的职业承诺


    很多人感慨于林巧稚医生聪慧、刻苦、敬业、爱国、仁爱。但是很少有人知道，在曾经以男医生为绝对主力的医学领域，女性从医所付出的代价和艰辛。


    这些艰辛有些来自社会偏见，有些来自家庭的压力，有些则源于观念的束缚。


    当时的观点是，学医是件艰苦的事，培养医生的过程需要大量的资源和个人的努力，结婚生子就可能让人分心。女性不可能同时扮演贤妻良母和职业女性两种角色，只能选其一。


    所以，林巧稚毕业留院的时候，当时医院给她的聘书是这样写的：


    茲聘请林巧稚女士，任协和医院妇产科助理住院医师……聘任期间凡因结婚、怀孕、生育者，作自动解除聘约论。


    今天我们在医院看到很多女医生，太正常不过了。但是你可能不知道，在170年前，现代医学体系下是没有女医生的，在当时很多专业领域对女性存有偏见。


    根据资料显示，西方现代医学第一位女医生叫做伊丽莎白·布莱克威尔（1821—1910）。她报考医学院，几乎全部医学院都拒绝她。最后，她不得不上了一个当时不是很有名的学校。


    1849年，她获得医学学位，但是找工作，又遇到了困难。拒绝的理由还是几乎都一致：“医生是一门艰难的工作，不适合女性。”


    所以，在林巧稚医生那个年代，一位杰出的女性做一名医生的个人代价就是不结婚。这并不完全是自愿的，而是受到了当时观念的影响。


    实际上，当时协和毕业的几位女老师都是终身未嫁。虽然，后来这项规定取消了，但是为了事业，很多人还是选择了单身。


    在今天，这种偏见已经被打破了。林巧稚医生的事迹告诉我们，女性在医疗岗位上同样可以做出优秀的成就。


    ### 女医生的独特优势


    第一，女性从医，支持了患者的选择权。


    病人看病会有各种考虑，比如隐私、文化；再比如，有的人认为女医生温和细致，有人认为男医生果断干脆。所以，实际上患者会选择医生的性别。


    在今天，女医生多了，也就支持了患者的选择权。


    2016年，斯坦福大学的一项研究指出，50.2%的女性倾向于看女妇科医生，41%的女性没有选择倾向，8.3%的女性更希望选择男妇科医生。

    '
  mdcn: '

    未必。


    再回到塞医生这个病例。1850年，塞医生在集体会议上宣布他的发现。但是，他等来的不是欢呼，而是攻击。


    他写了文章却一直不被发表。后来，好不容易发表了，也并没有在医学界引起大家的关注。再后来，塞医生丢了工作，出现抑郁，因为精神失常被送进了精神病院。再后来，他被精神病院的保安用棍棒打死，享年47岁。


    你可能会认为，这是自我纠错、自我揭短，从而受到了保守势力的攻击。但是我却不完全这么认为。


    只有提高整体认知，才是纠正无知之错的根本。


    在以前，关于传染病，人们要么认为是四体液不平衡，是人体内部出问题了。要么认为是“瘴气”或者是外层空间出问题了。这两种学说带来的认知，显然不能演化出有效的方法。


    - 1543年，意大利帕多瓦大学的维萨里（Andreas Vesalius）发表《人体的构造》（De humani corporis fabrica），标志着现代解剖学诞生；

    - 1761年，意大利解剖学家莫尔加尼（Giovanni Battista Morgagni）发表《病灶与病因》（De Sedibus et Causis
    Morborum per Anatomen Indagatis），建立了病理解剖学；

    - 后来，人类有了显微镜，在放大400倍之后看到了细菌轮廓，放大到1000倍以后看到了清晰的细菌形态；

    - 再后来，巴斯德（Louis Pasteur）和李斯特（Joseph Lister）奠定了微生物理论，证明了细菌可以传染疾病，严格的消毒和防护制度，可以有效避免交叉感染。


    只有整体认知提高，才是解决无知之错的终极方案。一旦无知之错被发现、被纠正，那么必将带来一个巨大的突破。


    ### 塞麦尔维斯曾说：


    蓦然回首，我只期待能有一天消灭这种产褥感染，用这样的快乐来驱散我的悲哀。但是事与愿违，我虽然不能亲眼目睹这幸福的时刻，那就坚信这一天迟早会到来！


    洗手制度，掀起了一场纠正体系无知之错的革命。


    在今天，有了微生物理论、消毒制度、医院感染防控制度、标准化防护制度、抗生素预防与合理使用、外科手术中的无菌原则等等。


    医学通过不断地纠正各种错误，再加上各种新型药物和助产技术，以及科学的规范，给予病人越来越科学的治疗。


    2018年，中国孕产妇病死率是18.3/10万，这个数字大约是塞医生当年一病区产妇产病死率的1/1000。


    塞医生被全世界称为“母亲的救星”，他的雕像屹立在匈牙利广场上，屹立在很多医院的花园里。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_324_0.png)


    塞麦尔维斯雕像


    医学的路，永远在纠错中前行。


    ## 划重点


    - 无知之错是没有掌握正确的知识，导致犯错误。

    - 科学方法，可以有效地发现体系的无知之错。

    - 提高认知水平，是解决无知之错的根本方法。


    ## 下节预告


    我国公共卫生制度是如何建立起来的？下节课，我们介绍以“肉身”抗击中国鼠疫的医生——伍连德。


    # 42 ｜伍连德：公共卫生如何战胜大规模传染病？


    2019-4-9


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    这节课要讲的大医生，曾经为近代中国医学的发展做过巨大贡献。


    中华医学会、哈尔滨医科大学、解放军202医院、北京大学人民医院，这些医院或者机构的前身都和他有关。


    他是1935年诺贝尔生理学或医学奖候选人之一，是第一个距离诺奖最近的华人。


    我们戴的棉口罩，还有今天饭桌上的旋转餐台，都是这个医生发明的。


    梁启超曾经说：


    > 科学输入垂50年，国中能以学者资格与世界相见者，伍星联博士一人而已！


    梁启超说的这个伍星联博士，就是伍连德。伍连德字星联。他的意思是说，当时能够站在世界舞台的中国医生，只有他一个。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_326_0.png)


    不过这节课，我们不讲伍连德的学术贡献，也不说他和诺奖擦肩而过的遗憾，更不说他主持筹建的医院和组织。


    我们说说100多年前，发生在中国东北大地上那场惨绝人寰的鼠疫，看看伍连德是怎么用科学的公共卫生手段，战胜了大规模烈性传染病。


    ## “肉身”抗击东北鼠疫


    1910年，末代皇帝溥仪只有4岁，晚清政权摇摇欲坠，内忧外患。


    10月25日这天，有两个皮毛贩子从俄国来到满洲里，投宿在一家叫做“魁生元”的小旅馆里。


    当天晚上这俩人就病了。发高烧、剧烈地咳嗽、大口大口地咳血。没两天人就死了，身上布满了淤血的斑。


    又过了两天，和他俩同住的其他两个旅客也病了。旅店老板见到人的时候，人已经死去了，浑身青紫，地面上有大量的血痰。


    几天后，千里之外的哈尔滨就发现了大量症状一模一样的病人。这是一场触之即死的烈性瘟疫。


    但是，这种情况并没有引起政府关注。


    不到两个月，这场瘟疫迅速沿着中东铁路，经过海拉尔、齐齐哈尔再到大庆，再到哈尔滨，再到长春，再到奉天（今天的沈阳），然后奔着北京如火燎原般地迅速蔓延开来。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_327_0.png)


    这个时候，再腐败无能的清政府也必须倾全国之力，遏制瘟疫。


    从英国剑桥大学毕业，曾经在西方做过传染病研究的伍连德医生临危受命。清政府任命伍连德为东三省防疫全权总医官。


    到了哈尔滨的第三天，伍连德在地下室秘密解剖因为瘟疫死亡的尸体。显微镜下的发现让他大惊失色。


    他清楚地看到了一种椭圆形的细菌，这种细菌就是鼠疫杆菌。


    鼠疫也被称为黑死病，我在前面的课程里说过，14世纪欧洲爆发鼠疫，三年死亡2500万人。这是人类历史上最烈性的瘟疫之一。


    但是伍连德想不透，鼠疫主要通过老鼠传染给人。12月份的东北大地已经天寒地冻了，老鼠根本就很少活动，怎么可能疫情传播这么快？会不会是一种新的鼠疫类型呢？


    伍连德想到这里，冷汗瞬间就滴了下来。


    如果是人和人之间传播，那么就太可怕了，难怪传播速度如此之快。在东北，一到冬天家家户户都是门窗紧闭。只要是家里有人感染了这次瘟疫，那么全家都在劫难逃。


    伍连德认为，这是一种新型鼠疫，在人和人之间经过呼吸道传播。他给这个病起了一个名字——肺鼠疫。中国哈尔滨面临灭城之灾。


    在人类历史上，很多瘟疫早期根本无药可治。


    - 比如天花、霍乱；

    - 比如2003年中国非典病毒，近些年非洲的埃博拉病毒；

    - 再比如1910年的哈尔滨鼠疫。


    鼠疫的特效药是在33年之后的1943年才有的，叫做链霉素（streptomycin）。也就是说，伍连德当时控制鼠疫根本没有药。


    ## 大规模传染病的控制原则


    伍连德用了什么方法呢？


    这就是这节课要说的大规模传染病的控制原则：管理传染源，切断传播途径，保护易感人群。


    肺鼠疫的传染源，就是感染了鼠疫的病人或者尸体。传播途径就是呼吸道传播，通过空气、飞沫传播。


    什么是肺鼠疫的易感人群呢？在当时没有疫苗，所以无论老人、儿童还是成年人，只要是接触到病人，那就都容易被感染。所以，当时所有的中国人都是易感人群。


    当时，无论是百姓还是行政长官，对于传染病控制几乎一无所知。


    老百姓只知道发生了瘟疫，所以就是逃离。家里有了病人，却隐瞒不报，或者到了晚上偷偷地把病危的病人扔在街上。所以，很多尸体被发现的时候，双手蜷在胸前，保持着一个取暖的姿势。


    当时的防疫之难可想而知。


    伍连德让士兵挨家挨户搜查，一旦发现病人，立刻送到防疫医院，房屋用生硫磺和石炭酸消毒。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_329_0.png)


    他克服重重阻力焚烧尸体。先是炸药爆破、挖坑。然后按照每百个尸体10加仑的标准浇上煤油，对尸体进行焚烧、掩埋。这就是管理传染源。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_330_0.png)


    怎么切断传播途径呢？


    既然肺鼠疫是人和人之间呼吸道传播，所以必须减少人员流动并且采取隔离。


    他从长春抽调1160名士兵进行交通管制，任何人都不可能穿越封锁线。日本控制的南满铁路，俄国控制的东清铁路相继停驶。伍连德在山海关设立检疫所，凡是经此南下的旅客都要停留5天，观察有没有得病。


    在哈尔滨，伍连德设计了一种简易的双层纱布囊口罩，在两层纱布中间放一块吸水药棉，戴上它就可以阻断呼吸道传播。关键是这种口罩成本低，易推行。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_331_0.png)


    同时，他又按照病情分为重症院、轻病院、疑似病院几种。为不同病情的病人进行治疗的同时，还防止了交叉感染。


    管理了传染源，切断了传播途径，自然也就保护了易感人群。在这种科学、规范的防控措施下，在短短不到4个月的时间，死亡人数就下降到0。


    1911年3月1日，当鼠疫死亡人数零报告的时候，防疫总部内一片沸腾。这是人类历史上第一次依靠科学手段，在人口密集的大城市成功控制传染病的典范。


    这次鼠疫牺牲了6万人的生命，但是在当时的中国，这已经是个奇迹了。要知道欧洲三年鼠疫，牺牲了2500万人。


    一个月后，“万国鼠疫研究会”在奉天（沈阳）召开，11个国家的代表出席大会，伍连德任大会主席。这是中国历史上在本土举办的第一次真正意义上的世界学术会议。伍连德以发现肺鼠疫，战胜鼠疫，扬名天下。


    1937年，日本侵华战争爆发，伍连德在上海的家被炸毁，他回到马来西亚。1960年1月21日，伍连德因为心脏病去世。


    伍连德用肉身之躯，阻遏了中国鼠疫爆发，他是中国检疫防疫的先驱者之一。


    接下来，我们通过这个案例，分析一下对于不明原因、烈性、极速扩散的传染病的群体防控特点。


    ## 防控不以明确传染源为前提


    治疗普通疾病，首先要了解准确的病因、病原体、发病机制。机制研究得越透彻，治疗效果也就越好。


    但是，突如其来的烈性传染病不同。在烈性传染病面前，如果能迅速找到病原体，无疑对于整个疫情的控制都是非常有利的。伍连德第一时间找到了鼠疫杆菌，这也是不幸中的万幸。


    但是，如果在瘟疫早期病原体不明，或者遇到一种前所未有的传染病怎么办？


    比如中国2003年的非典。在早期我们不知道这种病的病原体。到底是细菌还是病毒？如果是病毒，是什么类型的病毒？


    在病原体不明的情况下怎么办？


    不能等。


    防控的第一个层面：对于大规模原因不明的传染病防控，不能以了解病原体为必须前提。应该迅速判断疾病的性质和导致的危害。


    搞清楚病原体可能对什么敏感，对什么不敏感。迅速判断传播途径，是飞沫传播，还是经过水系或者消化道传染。


    了解传播途径之后，才可能制定针对性的措施。如果是飞沫、呼吸道传播，那么就应该像伍连德的案例一样，按照呼吸道传染病进行管理。


    如果是水系污染导致的消化道传染病，比如霍乱，那么防控重点就应该是处理饮用水、垃圾、粪便，管理食品与河道排放等。


    传播途径不同，群体防控的重点也不同。


    一旦明确传播途径，就到了防控的第二个层面：迅速进行科学的防控措施，为治疗争取时间。群体利益为主，群体利益和个体利益兼顾。


    病原体不明的情况下，或者在伍连德的案例中，即便知道了是鼠疫，但是当时没有特效的药物怎么办？


    不能等。


    按照群体防控的措施：管理传染源，切断传播途径，保护易感人群。


    将不同病情的病人，也就是可疑感染者、感染者和严重病情的病人，进行隔离分类治疗。这既避免了疫情扩大，保护了其他人群，也能对感染者进行悉心治疗，同时体现出医学在重大疫情面前的关爱和救护。


    伍连德医生当时采用的防控措施，在今天依然适用于各种烈性传染病的控制，中国公共卫生管理部门已经具备了丰富经验。


    近年来，非洲埃博拉疫情爆发，中国政府派遣公共卫生管理人员和医生远赴非洲协助瘟疫控制。我们科就有一位医生被派遣去了非洲，圆满地完成了任务。


    ## 划重点


    - 伍连德医生在非常落后的条件下，用科学方法战胜鼠疫，为人类战胜大规模烈性传染病提供了宝贵经验。

    - 在突发、不明原因的大型传染病早期，即便在不能了解病原体的前提下，按照科学的群体防控流程，就有助于控制疫情。

    - 控制大规模传染病的原则：管理传染源，切断传播途径，保护易感人群。


    伍连德是我最敬重的医生，他是马来西亚华侨，但是他直到离世都在说，“我是个中国人”。


    他说过：


    我曾经将我的大半生奉献给古老的中国。从清朝末年到民国建立，直到国民党统治崩溃，那一切在许多人的脑海里记忆犹新。中国是个有五千年历史的伟大文明古国，历经世世代代的兴衰荣辱，才取得了今天的地位，我衷心地希望她能更加繁荣昌盛。


    ## 下节预告


    女医生如何成为医学行业重要的组成部分？下节课，我们介绍一位中国女医生的代表——林巧稚。


    # 43 ｜林巧稚：为什么现在女医生那么多？


    2019-4-10


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    1962年，北京协和医院妇产科主任林巧稚收到一封来信，信是这样说的：


    > 我是怀了五胎的人了，前四胎都没活成，其中的后三胎都是出生后发黄夭折的。求求你伸出热情的手，千方百计地救救我这腹中的孩子。落款人：内蒙古包头_焦海棠


    看到这里，林巧稚医生立刻想到，前面几个孩子夭折的原因一定是严重的新生儿溶血病。这种病主要是母子血型不合引起的。孩子的红细胞破碎、溶血，导致黄疸，严重的病例很快就会死亡。


    在当时的中国，这种病只要是重型，还没有一个存活的先例。在全世界也只有少数病例得到治愈。


    林巧稚让焦海棠来到北京，她亲自接生。生产过程非常顺利，焦海棠生下了一个5斤8两的男婴。


    但是几个小时后，孩子的皮肤迅速变黄，最令人担心的事还是发生了。孩子发生了致命性的新生儿溶血病。


    其实在病人来之前，林巧稚医生已经检索了大量文献，研究了世界上对于这个病的治疗进展。她知道这个孩子需要换血。


    但是应该怎么换？换多少？什么速度换？换血过程中应该注意什么？这些都没有先例可循。


    林巧稚和内科、外科、儿科、病理科的专家一起讨论。最后，她决定为了救命，冒险给孩子换血。


    林巧稚守在孩子床边，她小心翼翼地每分钟给孩子抽出15毫升病血，然后再输回去8毫升健康的血，就这么一管一管地换。时间一分一分地过去了，最后，她给孩子换了400毫升血。孩子的皮肤也越来越红润了。


    按照这个做法，林巧稚总共给孩子换了三次血。最终，她救活了孩子。


    孩子的妈妈焦海棠后来回忆：“特别辛苦。整整七天，林巧稚医生不离开孩子，什么都 是她管。”


    为了感谢协和医院，感谢林巧稚医生，妈妈给孩子取名王协和。


    直到今天，换血疗法仍然是对于严重新生儿溶血病的一项关键的救治方法。


    林巧稚医生就是这节课要讲的大医生。她是北京协和医院第一任中国籍妇产科主任，她是 中国医生的表率，是中国女医生的表率。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_337_0.png)


    ## 林巧稚


    ### 中国妇产科的开创者


    1901年，林巧稚出生在厦门鼓浪屿。5岁的时候，她目睹了母亲因为妇科癌症离开人世的悲剧，她立志用医学拯救病痛中的人民。


    1921年，21岁的林巧稚考取了北京协和医学院。协和医院是当时乃至今天，中国最好的医学院之一。在当时，协和医院采取的是西方医学教育模式，一届只招收25人，能考取的人凤毛麟角。


    在这些出类拔萃的医学生中，林巧稚的成绩遥遥领先，而且拿到了最高奖学金"文海奖"。


    1929年，林巧稚获得医学博士学位，留在协和妇产科工作。


    当时的住院医师培训相当严格和辛苦，林巧稚吃住在医院。半年后，她被破格提升为协和医院住院总医师。按照常规，一般的医生要工作五年才可能得到这个提升。


    后来，林巧稚先后到欧洲、美国学习。


    在协和医院建院之初，医院的专家大多数都是外国人。但是在30年代以后，中国医生逐步成长起来，包括曾宪九、吴英恺、诸福棠、林巧稚等等，他们每一个人后来都成为奋斗级的医学大家。


    1940年，39岁的林巧稚担任协和医院妇产科主任。这是协和医院以来，第一位中国医生担任妇产科主任。


    新中国成立后，林巧稚的事业达到巅峰。1955年，她成为新中国第一位女学部委员，也就是女院士。


    林巧稚具备大医生的全部特质。


    首先，学术贡献。


    林巧稚是中国妇产科的主要开创者和奠基人之一，在她主持和倡导下，中国开展了第一次大规模的宫颈癌筛查。这项举措让宫颈癌早期发现率提升了大约8倍。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_339_0.png)


    宫颈癌筛查


    林巧稚走进百姓家进行宫颈癌筛查


    林巧稚对常见的妇科肿瘤进行探索研究，让这些病的病死率得到降低。


    为了得到中国妇女骨盆尺寸的正确数值，她检索和查阅了上万份病例，让女人生孩子更安全。即便是在她将近80岁的时候，仍然在病床上完成了50万字的著作《妇科肿瘤学》。


    其次，职业精神。


    林巧稚追求科学，率先对妇产科学许多方面进行了研究。同时，还手把手地教育年轻医生。她教学严谨，培养出了很多医学专家。


    最后，看病不看人。


    意思是不论病人身份高低，林巧稚都用医生的严谨和关爱治疗病人。


    虽然她自己没有孩子，但是她亲自接生了5万多名婴儿，包括水稻之父袁隆平，冰心的孩子和林徽因的孩子。但是，林巧稚接生的最多是普通百姓的孩子。她被称为“万婴之母”。


    无论时光如何变迁，在中国的医学界，林巧稚医生永远是医生学习的榜样，是大家敬爱的老师。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_340_0.png)


    ## 一生未婚的职业承诺


    很多人感慨于林巧稚医生聪慧、刻苦、敬业、爱国、仁爱。但是很少有人知道，在曾经以男医生为绝对主力的医学领域，女性从医所付出的代价和艰辛。


    这些艰辛有些来自社会偏见，有些来自家庭的压力，有些则源于观念的束缚。


    当时的观点是，学医是件艰苦的事，培养医生的过程需要大量的资源和个人的努力，结婚生子就可能让人分心。女性不可能同时扮演贤妻良母和职业女性两种角色，只能选其一。


    所以，林巧稚毕业留院的时候，当时医院给她的聘书是这样写的：


    茲聘请林巧稚女士，任协和医院妇产科助理住院医师……聘任期间凡因结婚、怀孕、生育者，作自动解除聘约论。


    今天我们在医院看到很多女医生，太正常不过了。但是你可能不知道，在170年前，现代医学体系下是没有女医生的，在当时很多专业领域对女性存有偏见。


    根据资料显示，西方现代医学第一位女医生叫做伊丽莎白·布莱克威尔（1821—1910）。她报考医学院，几乎全部医学院都拒绝她。最后，她不得不上了一个当时不是很有名的学校。


    1849年，她获得医学学位，但是找工作，又遇到了困难。拒绝的理由还是几乎都一致：“医生是一门艰难的工作，不适合女性。”


    所以，在林巧稚医生那个年代，一位杰出的女性做一名医生的个人代价就是不结婚。这并不完全是自愿的，而是受到了当时观念的影响。


    实际上，当时协和毕业的几位女老师都是终身未嫁。虽然，后来这项规定取消了，但是为了事业，很多人还是选择了单身。


    在今天，这种偏见已经被打破了。林巧稚医生的事迹告诉我们，女性在医疗岗位上同样可以做出优秀的成就。


    ### 女医生的独特优势


    第一，女性从医，支持了患者的选择权。


    病人看病会有各种考虑，比如隐私、文化；再比如，有的人认为女医生温和细致，有人认为男医生果断干脆。所以，实际上患者会选择医生的性别。


    在今天，女医生多了，也就支持了患者的选择权。


    2016年，斯坦福大学的一项研究指出，50.2%的女性倾向于看女妇科医生，41%的女性没有选择倾向，8.3%的女性更希望选择男妇科医生。

