    其次，法国博物学家布丰（Georges Louis Leclere de Buffon）得出一个结论：物种寿命是生长期的 5-7 倍左右。


    人类的生长期基本就到 18 岁，按照最高 7 倍推算，18 乘以 7 等于 126 岁，与 120 岁接近。


    另外，美国著名科学家海夫利克（Leonard Hayflick）发现，人类一生中细胞平均分裂次数为 50 次，每一次分裂产生的新细胞平均存活 2.4 年，50
    乘以 2.4 也等于 120 岁。


    所以，如果没病、没灾、没意外，理论上人就可能活到 120 岁。这是人类寿命的极限。


    # 年龄只能反映衰老，不能定义衰老


    听到这里你肯定很高兴。


