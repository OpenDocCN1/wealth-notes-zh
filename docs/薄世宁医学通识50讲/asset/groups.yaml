  md: "\n## 31 | 呼吸机：热修复的新起点\n\n2019-03-29\n\n你好，欢迎来到《医学通识 50 讲》，我是薄世宁。\n\n咱们今天上课以前，先开个“医院运动会”。\n\
    \n你是领导，站在主席台上检阅各个科的方队。那你能通过医生手里的“武器”，判断他是哪个科的吗？\n\n现在走来了一群脖子上跨着听诊器的，你一眼就看出来了，这是心脏科的。\n\
    \n接着来了一群拿手术刀的，你又猜对了，这是外科医生，拿手术刀做手术。\n\n后面走来了一群手里拿着凿子、锤子的。没错，这是骨科医生。敲敲打打，不仅是技术活，还是体力活。\n\
    \n又来了一群戴着高度近视镜，手里端着显微镜的。这是病理科医生，天天盯着显微镜看，把眼睛都看坏了。\n\n最后来了一大堆医生，一起用力地推着一台机器。这个机器方“脑袋”，下面是空气压缩机，边上还有一根长长的管子。\n\
    \n这是什么呢？\n\n这个铁家伙一般你没见过，只要见过就是遇到大麻烦了。\n\n这就是呼吸机。推着呼吸机的就是 ICU 医生。\n\n如果你问任何一个 ICU\
    \ 医生，他最拿手的是什么手艺？我相信每个 ICU 医生肯定说会用呼吸机。有了呼吸机，才有了现代化的 ICU。\n\n那呼吸机是怎么来的呢？它的工作原理是什么？又给医学带来了什么启示？\n\
    \n### 脊髓灰质炎与呼吸机发展简史\n\n在前面的课程里我们说过，病人危急程度是倒逼医疗技术研发的源动力。\n\n先请你一看张图片，这是人类用“铁肺”大战脊髓灰质炎。\n\
    \n![](img/4caf3257bac3bf3ff8bd0728c9b28448_240_0.png)\n\n“铁肺”大战脊髓灰质炎\n\n这一排一排的铁柜子就是“铁肺”，也就是第一代呼吸机。病人躺在里面，脑袋露在外头。铁柜子连上一个大风箱，一抽气，里面就变成了负压，这样病人的胸廓和肺就能够胀起来了。\n\
    \n铁肺可以帮着病人呼吸。\n\n为什么脊髓灰质炎的病人需要这样做呢？\n\n脊髓灰质炎，也就是小儿麻痹症，你可能见过因为脊髓灰质炎而残疾的病人。但是，可能没见过其中的严重类型。\n\
    \n严重的脊髓灰质炎不仅肢体的肌肉瘫痪，病人呼吸的肌肉也会瘫痪麻痹。没有呼吸机的时候，病人就只能活活憋死。更让人痛心的是，这种病主要攻击 5 岁以下的孩子。\n\
    \n有活下来的病人这么描述窒息的感觉：\n\n你能感觉到自己的心脏还在跳，你拼命地吸气，却完全吸不动。\n\n把没法呼吸的病人放进“铁肺”里，他就能呼吸了。\n\
    \n但是“铁肺”有个问题。\n\n虽然它可以帮助呼吸，但是解决不了病人的咳痰问题。所以，用“铁肺”治疗脊髓灰质炎效果并不好。\n\n1952 年，脊髓灰质炎在欧美再次爆发，这次不能用“铁肺”了。\n\
    \n当时，丹麦哥本哈根的两位医生提出，需要把病人的气管切开。气管切开，在气管里插上管子，解决了两个关键问题：\n\n- 首先，用一个皮囊连在管子上，捏皮囊，气就打进去了。这就解决了病人的通气问题。\n\
    - 其次，还可以通过这个管子给病人吸痰，也就解决了肺部感染问题。\n\n这么做，使抢救成功率达到了 75%。这是一个巨大的进步。\n\n这种皮囊看着简单，其实它是现代呼吸机的一个简单模型。\n\
    \n用外力、用正压把气体打到病人的肺里去，帮助病人呼吸。这就是呼吸机的工作原理。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_242_0.png)\n\
    \n再后来，发明了专门正压通气的机器，替代了皮囊和医生的手，这就是今天的呼吸机。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_243_0.png)\n\
    \n现代呼吸机\n\n现代化的呼吸机，已经用到了最新的计算机技术、流量传感技术、智能报警系统，还可以提供各种呼吸模式，以应对不同的病情需求。\n\n呼吸机越来越智能，越来越安全。呼吸机，成了生命支持中最重要的一环。\n\
    \n### 医学治疗是热修复\n\n能支持呼吸，就能先把病人的生命维持住，这给医生治病提供了更多可能。\n\n我们知道，救命和修机器不同。\n\n修机器的时候，可以先让机器停下来去修某个零件，修好了再装回去。这是冷修复。\n\
    \n那治病行吗？\n\n脊髓灰质炎是病毒攻击了咱们的神经系统。能先让生命这台“机器”停下来，再去修理神经吗？\n\n当然不能。\n\n其次，神经修复需要时间。如果没有呼吸机先保住命，哪来的后续修复呢？\n\
    \n修机器可以冷修复，但是，每一项医学的治疗技术都是热修复。\n\n热修复是个计算机术语，它的核心就是不停机的情况下，去修复功能。\n\n平移到医学上。“热”，就是活着，是维持病人的生命体征。这是最基础的要求。\n\
    \n“修”，就是干预，是医生用药、用刀去作用于疾病部位，切除病变组织，修理缺损，或者改变某种机能。\n\n“复”，就是自我修复。\n\n在大病的时候，只有先“热着”，先“修”，才有最后的“复”。\n\
    \n在呼吸机出现之前，对于大病，医生们很难“修”。\n\n为什么？\n\n脊髓灰质炎病毒的毒力很强，可能还没等人体的自我修复起作用，就已经夺去了生命。这个时候，必须先让病人能呼吸。\n\
    \n先活着，然后才有然后。这是热修复。\n\n大手术的时候，需要深度麻醉，麻醉就会让呼吸受到抑制。只有用呼吸机去控制呼吸，让血液里的氧气足够维持生命，医生才有可能做手术。这也是热修复。\n\
    \n呼吸机的出现，代表着现代生命支持技术的发展，它让更多复杂手术和更复杂、更高级的治疗技术得以实现。\n\n呼吸机就是热修复的新起点。这节课的重点就是三个字——热修复。\n\
    \n热修复的关键，首先是必须“热”。我把“热”分成了三个层面：\n\n### 热修复的三个层面\n\n- **“热”第一层：器官支持。**\n  比如，咱们前面说过的打开心脏做手术，那就必须保证心脏里面没有血。这样，外科医生才有可能做手术。\n\
    \n  如果心脏不射血了，怎么保证给其他器官供血呢？怎么做到接近人体的生理状态，做到“热”呢？\n\n  体外循环技术就是使用一台机器把心脏里的血引出来，然后经人工在体外进行气体交换，加上氧，除掉二氧化碳，然后再输回动脉系统。\n\
    \n  这样，既保证了外科医生可以打开心脏做手术，又保证了其他器官不缺血、不缺氧。尽量接近生理状态，让病人在“热”的状态下，完成以前不可能实现的心脏大手术。\n\
    \n  支持器官的功能，越接近生理状态，病人就越安全。\n\n- **“热”的第二层：降低功能。**\n  有时候，我们甚至用“冷”来保证热。\n\n  举个例子。\n\
    \n  比如心跳停止，抢救成功之后，或者严重的大脑外伤，或者溺水，这些病人都会发生脑细胞的损伤，救治难点就是怎么修复受损的脑细胞。\n\n  如果脑细胞还在快速地工作，快速地代谢，快速地履行功能，那么修复起来就非常难。\n\
    \n  那怎么办呢？\n\n  研究表明体温每降低 1 度，大脑代谢率就会降低 5%。\n\n  所以，我们可以人为地把病人体温降下来，用“冷”降低脑细胞的功能，这样不就增加了脑细胞修复的可能性吗？\n\
    \n  这个时候，“冷”就是为了保证“热”。\n\n  我们用药物、呼吸机，再加上降温措施，让病人在高度的镇静和肌肉松弛状态下，体温降低到 32-35 摄氏度。让大脑先休息，然后等待自我修复。这同样是一种“热”。\n\
    \n- **“热”的第三层：器官替代。**\n  比如，爆发性心肌炎的孩子，心脏短期内发生了剧烈的心肌结构变化。心脏不射血了，怎么办？\n\n  再比如，爆发放性的流感肺炎，肺在两三天内就快速变白了，不工作了。这个时候用呼吸机也保证不了病人的生命了，怎么办呢？怎么做到热修复呢？\n\
    \n  生命支持技术发展到今天，已经可以做到短期内替代心脏和肺工作，维持基本生命，这是最高级别的“热”。\n\n  用到的设备就是“魔肺”，它的全称是体外膜肺氧合\
    \ (extracorporeal membrane oxygenation), 简称 ECMO。\n\n  “魔肺”代表一个医院、一个地区，甚至一个国家生命支持技术的最高水平。\n\
    \n  它可以临时替代心脏或肺，或者两者一起替代。优先保证生理状态稳定，先保命。本质仍然是“热”，也就是生命支持，维持一个接近生理的状态。\n\n我再给你讲一个病例。\n\
    \n几年前，我们治疗过一个美院学画画的大学生。他因为胃溃疡导致胃穿孔。胃里的食物和胃液流到了腹腔里，带来了严重的感染和休克。\n\n外科医生紧急开腹，把这个穿孔修补好，又用大量的生理盐水冲洗腹腔，又给了大量的抗生素治疗感染。\n\
    \n手术后，病人转到了 ICU。但是，即便是这么成功的手术，手术后病人还是继发了呼吸衰竭。\n\n这个时候必须用呼吸机。\n\n咱们正常人呼吸，空气里氧气约占\
    \ 21%，这个病人要用呼吸机把 100% 的纯氧打到肺里，才能维持生命。\n\n我记得抢救的第一天晚上，护士脱开呼吸机给他吸痰的时候，这个病人咳嗽了一下，一口血水，顺着气管插管，直接就喷到了天花板上。然后，他的监护仪“嘀嘀嘀”地报警，他的血氧快速下降，心率快速上升。\n\
    \n这说明，这个病人的呼吸衰竭到了最危险的地步。\n\n你觉得这个病人救治成功的希望有多少呢？\n\n他的父母问我：“孩子还有没有好的可能？”\n\n我说：“病情确实太重了，这个时候呼吸机是保命。然后给他时间，慢慢修复。”\n\
    \n第 7 天，这个病人的病情果然好转，他脱离了呼吸机，拔了气管插管，转到外科继续治疗去了。\n\n后来，我还见过这个孩子，他毕业后回了老家大连工作，没有遗留下一点健康问题。\n\
    \n# 划重点\n\n- 脊髓灰质炎的病例告诉我们呼吸支持的重要。\n- 保证人活着的同时让人体修复，是医学上的热修复。\n- 热修复的三个层面：器官支持、降低功能、器官替代。\n\
    \n# 思考题\n\n请你分析一下最后胃穿孔这个病例，成功救治的过程中，哪个是“热”，哪个是“惨”，哪个又是“复”？\n\n欢迎把你的想法写在留言区，和我交流。\n\
    \n# 下节预告\n\n恢复生态系统最好的办法是什么？这与癌症的治疗有哪些共性？下节课，我们讲讲癌症的免疫疗法。\n\n## 32 ｜癌症的免疫疗法：激发生态韧性\n\
    \n2019-3-30\n\n你好，欢迎来到医学通识 50 讲，我是薄世宁。\n\n这节课，我们讲讲癌症的免疫疗法。\n\n我在前面的课程里（第 3 讲 医疗的本质是支持生命自我修复）讲过，美国前总统吉米·卡特（Jimmy\
    \ Carter）的晚期黑色素瘤得到有效缓解，靠的是免疫疗法。\n\n晚期白血病的小女孩艾米丽，她的白血病细胞被杀光，靠的还是免疫疗法。\n\n2018 年，诺贝尔医学奖获奖项目，也是免疫疗法。\n\
    \n如果你打开美国癌症研究所的网页，在主页上你一定会看到一行大字：\n\nImmunotherapy is the most promising cancer\
    \ treatment of our time. 免疫疗法是这个时代最有前景的癌症治疗方法。\n\n很多医生认为，如果人类有可能攻克癌症，那它一定会出现在免疫治疗领域。我自己也赞同这个观点。\n\
    \n因为，这种疗法和以前所有治疗癌症的传统方法相比，它的思路彻底变了。\n\n这节课，我会用三个案例告诉你癌症免疫疗法的工作原理和逻辑，学完之后，你就能了解癌症治疗即将到来的巨大突破了。\n\
    \n### 用细菌毒素治疗癌症\n\n第一个故事，发生在 100 多年前的 1890 年。\n\n有一天，美国医生威廉姆·科利（William Coley）在复习老病例的时候，一份特殊的病例，引起了他的注意。\n\
    \n这个病例是这么记载的：一个面部癌症的病人，手术切了癌症组织，但是很快又复发了。更不幸的是，病人的伤口还严重感染了。\n\n当时还没有青霉素，你肯定知道这意味着什么。所有的人都觉得这个病人活不了多久了。\n\
    \n但是接下来发生的事，出乎所有人的意料。\n\n这个病人的伤口每感染一次，癌症组织就都缩小一点。反反复复地感染，癌症居然越来越小。5 个月后这个病人的癌症没了，他出院了。\n\
    \n科利医生也蒙了，这不可能啊，会不会病例写错了呢？\n\n他找遍了整个纽约城，还真的找到了这个病人。\n\n科利让病人到医院检查发现，果然他的癌症没了。\n\
    \n好奇怪啊。科利想，难道是因为细菌感染激发了他的免疫力，反而杀死了癌细胞？\n\n有了这个想法，科利就尝试用细菌毒素来治疗癌症。治了上百例，确实还真的有人得到了缓解。\n\
    \n我们再来看科利当年的研究。\n\n- 首先，他也不知道这种疗法的原理。\n- 其次，他的研究没有严格的设计和对照。所以，其他医生没办法重复和验证。\n\
    - 再加上，用细菌感染治疗癌症的有效性和安全性没办法保证。\n\n所以，这种方法并没有得到广泛认可。到了 1936 年科利去世，这个方法也就淡出了人们的视野。\n\
    \n这就是时代局限性。但是，故事还没完。\n\n科利医生的女儿长大了，虽然她没能当医生，但是她说，父亲治了这么多病人，确实有缓解的，不可能都是侥幸，这种方法值得进一步研究。\n\
    \n后来，她募资建立了美国癌症研究所（CRI），支持癌症研究和治疗，尤其是免疫疗法。\n\n2018 年的诺贝尔生理学或医学奖得主，是美国科学家詹姆斯·艾利森（James\
    \ Allison）。艾利森医生就是这个癌症研究所的科学顾问委员会主任，他的获奖项目就是癌症的免疫疗法。\n\n### 癌症免疫疗法的工作原理\n\n为什么癌症的免疫疗法会得诺贝尔奖？\n\
    \n在免疫疗法出现之前，医生用手术、化疗、放疗，直接攻击癌细胞，这几种方法的本质都是外部干预。也就是借助于外援，帮着咱们杀敌人。\n\n但是，免疫疗法彻底换了一个思路，也就是增强内力。人体免疫就是咱们的内力。\n\
    \n你一定还记得，得癌症的时候，要么是免疫细胞认不出癌细胞这个“坏人”了，要么是免疫细胞打不过癌细胞了。无论是认不出还是打不过，都会出问题。\n\n所以，癌症免疫疗法的工作原理，就是恢复或者增强免疫细胞的识别能力和战斗力，发挥自身潜能，用内力来战胜癌细胞。\n\
    \n在科利医生那个年代，医生们对人体免疫原理的认识并不清晰。但是毫无疑问，他的研究是癌症免疫疗法的初步尝试。\n\n随着研究的越来越深入，科学家们逐步揭示了人体免疫系统的分子组成、化学介质，以及精确控制这个系统的分子开关。这些基础研究，为癌症免疫治疗提供了可能。\n\
    \n但是，这条探索的路走得并不容易。这一走，就是 100 年。其中，有很多科学家不应该被忘记，是他们的研究，促成了癌症的免疫疗法。\n\n### 用免疫疗法治疗晚期胰腺癌\n\
    \n下面，我们讲第二个故事。\n\n其实，每种癌细胞都有标志性的物质。免疫细胞就是通过识别这些标志性物质，来区别这个细胞是“坏人”，还是“自己人”。\n\n\
    有的免疫细胞专门负责识别，比如 DC 细胞。有的专门负责杀伤，比如 T 细胞。这两种细胞是盟友。\n\n发现 DC 细胞的人叫拉尔夫·斯坦曼（Ralph Marvin\
    \ Steinman），他是美国洛克菲勒大学免疫中心的博士。\n\n但是很不幸，在 2007 年，也就是斯坦曼发现 DC 细胞 34 年以后，他自己得了晚期胰腺癌。\n\
    \n一般来说，晚期胰腺癌患者如果失去了手术机会，存活时间平均不到一年。\n\n但是，斯坦曼博士用他自己做了一个试验。他用自身的 DC 细胞和癌细胞，制备癌症疫苗来治疗自己的晚期胰腺癌。\n\
    \n结果是他活了四年半，这个生存期，是这类晚期病人的 4-10 倍左右。\n\n2011 年 9 月 30 号，斯坦曼去世。\n\n10 月 3 号，也就是他去世三天后，诺贝尔委员会公布，由于斯坦曼对人体免疫学的贡献，决定把\
    \ 2011 年诺贝尔生理学或医学奖颁给他。他到最后也没能等到这个好消息。\n\n其实，就在斯坦曼去世前几天，他还在和女儿开玩笑说，“为了获得诺贝尔奖我也得坚持活下来，因为他们从不给逝者授奖”。\n\
    \n但是这一次，诺奖委员会为他破了例。\n\n斯坦曼的研究，把人体免疫和癌症关系的认知又推进了一步。他让咱们知道了，要想杀“敌人”，首先得认出“敌人”。\n\
    \n今天的免疫疗法，无论从哪个角度出发，都必须基于识别。只有识别了癌细胞，咱们才有可能进行下一步的杀灭。\n\n2018 年，获得诺贝尔生理学或医学奖的是美国科学家艾利森（James\
    \ P. Allison）和日本科学家本庶佑（Tasuku Honjo），他们的研究成果，同样是找到了癌细胞躲过免疫细胞杀伤的另外的关键机制。\n\n这些发现促成了癌症免疫药物的研发。这个时候，癌症的免疫疗法才真真切切地给癌症病人带来了福利。\n\
    \n癌症免疫疗法创立了一个癌症疗法的全新理念，这是人类与癌症战斗过程中，一个里程碑式的转变。\n\n为什么增强内力，依靠自身的免疫细胞就可以具有这么大的潜力呢？\n\
    \n这就到了我要讲的第三个故事。\n\n### 切尔诺贝利核爆炸和生态修复\n\n你肯定在电视上看到过原子弹爆炸的场景，有人用“核冬天”描述核爆炸之后的万物毁灭和凋零，那是一种只能用黑色和灰色描述的世界。\n\
    \n1986 年，前苏联切尔诺贝利核电站发生爆炸，这是人类有史以来遭遇的最严重的核灾难。\n\n这场灾难给生态带来的破坏，远远超过了 2011 年日本福岛核泄露。\n\
    \n有记者问专家：你认为需要多久，这个地方的生态才有可能修复呢？\n\n专家回答：至少两万年。核污染就这么可怕。\n\n今天的切尔诺贝利什么样了？毕竟刚刚过去\
    \ 30 年。是一个暗淡、破碎、凋零、荒凉的人间地狱吗？\n\n**2017 年**，有人公布了切尔诺贝利最新的航拍照片。\n\n照片上显示，在废弃的建筑物周围，长满了绿油油的植物，切尔诺贝利隔离区森林覆盖，郁郁葱葱。\n\
    \n![](img/4caf3257bac3bf3ff8bd0728c9b28448_254_0.png)\n\n科学家还观察到，隔离区里面生活着狼、野牛、驼鹿、野猪、山猫、野马和各种各样的鸟、昆虫。你可能会认为，这些动物受到核污染突变了。\n\
    \n并没有。\n\n一只年轻的野狼溜溜达达从隔离区走了出来。经过研究发现，这只狼和清洁区域的狼没什么两样。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_255_0.png)\n\
    \n这个故事和医学非常相关。\n\n遭受了人类历史上最严重的核灾难，但是经过短短 30 年，大自然就已经恢复了生机。所有人都低估了生态自身的力量。\n\n\
    这个故事告诉核专家，对于生态系统自身的修复能力要有信心。这个故事同样也让医生振奋：生命伟大的自我修复能力，永远超乎我们的想象。\n\n# 划重点\n\n-\
    \ 科利医生为癌症免疫疗法作出了初步尝试。\n- 斯坦曼告诉我们，要想杀“敌”，就要首先认出“敌人”。\n- 癌症免疫疗法的工作原理是，从外部干预，转为增强内力。内力就是人体免疫。\n\
    - 切尔诺贝利核电站爆炸后的恢复告诉我们，要对自身的修复保持信心。人体免疫就是伟大的自我修复能力。\n\n# 下节预告\n\n长久以来，精神疾病是医学的黑暗之地。下一讲，我们讲讲给精神治疗带来曙光的药——氯丙嗪。\n\
    \n## 33｜氯丙嗪：精神病治疗的第一道曙光\n\n2019-3-31\n\n你好，欢迎来到《医学通识50讲》，我是薄世宁。\n\n在你眼里，是不是每年的诺贝尔生理学或医学奖，都代表了医学的伟大进步呢？\n\
    \n那你知道有一年的诺奖发错了吗？\n\n直到今天，这个奖项都被看成是诺奖历史上最大的耻辱。\n\n这就是 1949 年的诺贝尔奖。颁给了一位医生，他发明了用切除病人的前脑叶来治疗精神病的方法。\n\
    \n![](img/4caf3257bac3bf3ff8bd0728c9b28448_256_0.png)\n\n前脑叶切除术示意图，用器具捣毁脑区\n\n\
    前脑叶就是大脑的额叶，额叶负责我们复杂的认知行为。比如记忆、思考、决策、表达等等。用手术破坏额叶，精神病病人的狂躁和幻觉自然也就消失了，病人也就不闹了。\n\
    \n但是，一个没有情感、没有判断、没有思维、只有呼吸的人，还能算一个真正的人吗？\n\n有人这么描述这个手术：\n"
  mdcn: "\n## 31 | 呼吸机：热修复的新起点\n\n2019-03-29\n\n你好，欢迎来到《医学通识 50 讲》，我是薄世宁。\n\n咱们今天上课以前，先开个“医院运动会”。\n\
    \n你是领导，站在主席台上检阅各个科的方队。那你能通过医生手里的“武器”，判断他是哪个科的吗？\n\n现在走来了一群脖子上跨着听诊器的，你一眼就看出来了，这是心脏科的。\n\
    \n接着来了一群拿手术刀的，你又猜对了，这是外科医生，拿手术刀做手术。\n\n后面走来了一群手里拿着凿子、锤子的。没错，这是骨科医生。敲敲打打，不仅是技术活，还是体力活。\n\
    \n又来了一群戴着高度近视镜，手里端着显微镜的。这是病理科医生，天天盯着显微镜看，把眼睛都看坏了。\n\n最后来了一大堆医生，一起用力地推着一台机器。这个机器方“脑袋”，下面是空气压缩机，边上还有一根长长的管子。\n\
    \n这是什么呢？\n\n这个铁家伙一般你没见过，只要见过就是遇到大麻烦了。\n\n这就是呼吸机。推着呼吸机的就是 ICU 医生。\n\n如果你问任何一个 ICU\
    \ 医生，他最拿手的是什么手艺？我相信每个 ICU 医生肯定说会用呼吸机。有了呼吸机，才有了现代化的 ICU。\n\n那呼吸机是怎么来的呢？它的工作原理是什么？又给医学带来了什么启示？\n\
    \n### 脊髓灰质炎与呼吸机发展简史\n\n在前面的课程里我们说过，病人危急程度是倒逼医疗技术研发的源动力。\n\n先请你一看张图片，这是人类用“铁肺”大战脊髓灰质炎。\n\
    \n![](img/4caf3257bac3bf3ff8bd0728c9b28448_240_0.png)\n\n“铁肺”大战脊髓灰质炎\n\n这一排一排的铁柜子就是“铁肺”，也就是第一代呼吸机。病人躺在里面，脑袋露在外头。铁柜子连上一个大风箱，一抽气，里面就变成了负压，这样病人的胸廓和肺就能够胀起来了。\n\
    \n铁肺可以帮着病人呼吸。\n\n为什么脊髓灰质炎的病人需要这样做呢？\n\n脊髓灰质炎，也就是小儿麻痹症，你可能见过因为脊髓灰质炎而残疾的病人。但是，可能没见过其中的严重类型。\n\
    \n严重的脊髓灰质炎不仅肢体的肌肉瘫痪，病人呼吸的肌肉也会瘫痪麻痹。没有呼吸机的时候，病人就只能活活憋死。更让人痛心的是，这种病主要攻击 5 岁以下的孩子。\n\
    \n有活下来的病人这么描述窒息的感觉：\n\n你能感觉到自己的心脏还在跳，你拼命地吸气，却完全吸不动。\n\n把没法呼吸的病人放进“铁肺”里，他就能呼吸了。\n\
    \n但是“铁肺”有个问题。\n\n虽然它可以帮助呼吸，但是解决不了病人的咳痰问题。所以，用“铁肺”治疗脊髓灰质炎效果并不好。\n\n1952 年，脊髓灰质炎在欧美再次爆发，这次不能用“铁肺”了。\n\
    \n当时，丹麦哥本哈根的两位医生提出，需要把病人的气管切开。气管切开，在气管里插上管子，解决了两个关键问题：\n\n- 首先，用一个皮囊连在管子上，捏皮囊，气就打进去了。这就解决了病人的通气问题。\n\
    - 其次，还可以通过这个管子给病人吸痰，也就解决了肺部感染问题。\n\n这么做，使抢救成功率达到了 75%。这是一个巨大的进步。\n\n这种皮囊看着简单，其实它是现代呼吸机的一个简单模型。\n\
    \n用外力、用正压把气体打到病人的肺里去，帮助病人呼吸。这就是呼吸机的工作原理。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_242_0.png)\n\
    \n再后来，发明了专门正压通气的机器，替代了皮囊和医生的手，这就是今天的呼吸机。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_243_0.png)\n\
    \n现代呼吸机\n\n现代化的呼吸机，已经用到了最新的计算机技术、流量传感技术、智能报警系统，还可以提供各种呼吸模式，以应对不同的病情需求。\n\n呼吸机越来越智能，越来越安全。呼吸机，成了生命支持中最重要的一环。\n\
    \n### 医学治疗是热修复\n\n能支持呼吸，就能先把病人的生命维持住，这给医生治病提供了更多可能。\n\n我们知道，救命和修机器不同。\n\n修机器的时候，可以先让机器停下来去修某个零件，修好了再装回去。这是冷修复。\n\
    \n那治病行吗？\n\n脊髓灰质炎是病毒攻击了咱们的神经系统。能先让生命这台“机器”停下来，再去修理神经吗？\n\n当然不能。\n\n其次，神经修复需要时间。如果没有呼吸机先保住命，哪来的后续修复呢？\n\
    \n修机器可以冷修复，但是，每一项医学的治疗技术都是热修复。\n\n热修复是个计算机术语，它的核心就是不停机的情况下，去修复功能。\n\n平移到医学上。“热”，就是活着，是维持病人的生命体征。这是最基础的要求。\n\
    \n“修”，就是干预，是医生用药、用刀去作用于疾病部位，切除病变组织，修理缺损，或者改变某种机能。\n\n“复”，就是自我修复。\n\n在大病的时候，只有先“热着”，先“修”，才有最后的“复”。\n\
    \n在呼吸机出现之前，对于大病，医生们很难“修”。\n\n为什么？\n\n脊髓灰质炎病毒的毒力很强，可能还没等人体的自我修复起作用，就已经夺去了生命。这个时候，必须先让病人能呼吸。\n\
    \n先活着，然后才有然后。这是热修复。\n\n大手术的时候，需要深度麻醉，麻醉就会让呼吸受到抑制。只有用呼吸机去控制呼吸，让血液里的氧气足够维持生命，医生才有可能做手术。这也是热修复。\n\
    \n呼吸机的出现，代表着现代生命支持技术的发展，它让更多复杂手术和更复杂、更高级的治疗技术得以实现。\n\n呼吸机就是热修复的新起点。这节课的重点就是三个字——热修复。\n\
    \n热修复的关键，首先是必须“热”。我把“热”分成了三个层面：\n\n### 热修复的三个层面\n\n- **“热”第一层：器官支持。**\n  比如，咱们前面说过的打开心脏做手术，那就必须保证心脏里面没有血。这样，外科医生才有可能做手术。\n\
    \n  如果心脏不射血了，怎么保证给其他器官供血呢？怎么做到接近人体的生理状态，做到“热”呢？\n\n  体外循环技术就是使用一台机器把心脏里的血引出来，然后经人工在体外进行气体交换，加上氧，除掉二氧化碳，然后再输回动脉系统。\n\
    \n  这样，既保证了外科医生可以打开心脏做手术，又保证了其他器官不缺血、不缺氧。尽量接近生理状态，让病人在“热”的状态下，完成以前不可能实现的心脏大手术。\n\
    \n  支持器官的功能，越接近生理状态，病人就越安全。\n\n- **“热”的第二层：降低功能。**\n  有时候，我们甚至用“冷”来保证热。\n\n  举个例子。\n\
    \n  比如心跳停止，抢救成功之后，或者严重的大脑外伤，或者溺水，这些病人都会发生脑细胞的损伤，救治难点就是怎么修复受损的脑细胞。\n\n  如果脑细胞还在快速地工作，快速地代谢，快速地履行功能，那么修复起来就非常难。\n\
    \n  那怎么办呢？\n\n  研究表明体温每降低 1 度，大脑代谢率就会降低 5%。\n\n  所以，我们可以人为地把病人体温降下来，用“冷”降低脑细胞的功能，这样不就增加了脑细胞修复的可能性吗？\n\
    \n  这个时候，“冷”就是为了保证“热”。\n\n  我们用药物、呼吸机，再加上降温措施，让病人在高度的镇静和肌肉松弛状态下，体温降低到 32-35 摄氏度。让大脑先休息，然后等待自我修复。这同样是一种“热”。\n\
    \n- **“热”的第三层：器官替代。**\n  比如，爆发性心肌炎的孩子，心脏短期内发生了剧烈的心肌结构变化。心脏不射血了，怎么办？\n\n  再比如，爆发放性的流感肺炎，肺在两三天内就快速变白了，不工作了。这个时候用呼吸机也保证不了病人的生命了，怎么办呢？怎么做到热修复呢？\n\
    \n  生命支持技术发展到今天，已经可以做到短期内替代心脏和肺工作，维持基本生命，这是最高级别的“热”。\n\n  用到的设备就是“魔肺”，它的全称是体外膜肺氧合\
    \ (extracorporeal membrane oxygenation), 简称 ECMO。\n\n  “魔肺”代表一个医院、一个地区，甚至一个国家生命支持技术的最高水平。\n\
    \n  它可以临时替代心脏或肺，或者两者一起替代。优先保证生理状态稳定，先保命。本质仍然是“热”，也就是生命支持，维持一个接近生理的状态。\n\n我再给你讲一个病例。\n\
    \n几年前，我们治疗过一个美院学画画的大学生。他因为胃溃疡导致胃穿孔。胃里的食物和胃液流到了腹腔里，带来了严重的感染和休克。\n\n外科医生紧急开腹，把这个穿孔修补好，又用大量的生理盐水冲洗腹腔，又给了大量的抗生素治疗感染。\n\
    \n手术后，病人转到了 ICU。但是，即便是这么成功的手术，手术后病人还是继发了呼吸衰竭。\n\n这个时候必须用呼吸机。\n\n咱们正常人呼吸，空气里氧气约占\
    \ 21%，这个病人要用呼吸机把 100% 的纯氧打到肺里，才能维持生命。\n\n我记得抢救的第一天晚上，护士脱开呼吸机给他吸痰的时候，这个病人咳嗽了一下，一口血水，顺着气管插管，直接就喷到了天花板上。然后，他的监护仪“嘀嘀嘀”地报警，他的血氧快速下降，心率快速上升。\n\
    \n这说明，这个病人的呼吸衰竭到了最危险的地步。\n\n你觉得这个病人救治成功的希望有多少呢？\n\n他的父母问我：“孩子还有没有好的可能？”\n\n我说：“病情确实太重了，这个时候呼吸机是保命。然后给他时间，慢慢修复。”\n\
    \n第 7 天，这个病人的病情果然好转，他脱离了呼吸机，拔了气管插管，转到外科继续治疗去了。\n\n后来，我还见过这个孩子，他毕业后回了老家大连工作，没有遗留下一点健康问题。\n\
    \n# 划重点\n\n- 脊髓灰质炎的病例告诉我们呼吸支持的重要。\n- 保证人活着的同时让人体修复，是医学上的热修复。\n- 热修复的三个层面：器官支持、降低功能、器官替代。\n\
    \n# 思考题\n\n请你分析一下最后胃穿孔这个病例，成功救治的过程中，哪个是“热”，哪个是“惨”，哪个又是“复”？\n\n欢迎把你的想法写在留言区，和我交流。\n\
    \n# 下节预告\n\n恢复生态系统最好的办法是什么？这与癌症的治疗有哪些共性？下节课，我们讲讲癌症的免疫疗法。\n\n## 32 ｜癌症的免疫疗法：激发生态韧性\n\
    \n2019-3-30\n\n你好，欢迎来到医学通识 50 讲，我是薄世宁。\n\n这节课，我们讲讲癌症的免疫疗法。\n\n我在前面的课程里（第 3 讲 医疗的本质是支持生命自我修复）讲过，美国前总统吉米·卡特（Jimmy\
    \ Carter）的晚期黑色素瘤得到有效缓解，靠的是免疫疗法。\n\n晚期白血病的小女孩艾米丽，她的白血病细胞被杀光，靠的还是免疫疗法。\n\n2018 年，诺贝尔医学奖获奖项目，也是免疫疗法。\n\
    \n如果你打开美国癌症研究所的网页，在主页上你一定会看到一行大字：\n\nImmunotherapy is the most promising cancer\
    \ treatment of our time. 免疫疗法是这个时代最有前景的癌症治疗方法。\n\n很多医生认为，如果人类有可能攻克癌症，那它一定会出现在免疫治疗领域。我自己也赞同这个观点。\n\
    \n因为，这种疗法和以前所有治疗癌症的传统方法相比，它的思路彻底变了。\n\n这节课，我会用三个案例告诉你癌症免疫疗法的工作原理和逻辑，学完之后，你就能了解癌症治疗即将到来的巨大突破了。\n\
    \n### 用细菌毒素治疗癌症\n\n第一个故事，发生在 100 多年前的 1890 年。\n\n有一天，美国医生威廉姆·科利（William Coley）在复习老病例的时候，一份特殊的病例，引起了他的注意。\n\
    \n这个病例是这么记载的：一个面部癌症的病人，手术切了癌症组织，但是很快又复发了。更不幸的是，病人的伤口还严重感染了。\n\n当时还没有青霉素，你肯定知道这意味着什么。所有的人都觉得这个病人活不了多久了。\n\
    \n但是接下来发生的事，出乎所有人的意料。\n\n这个病人的伤口每感染一次，癌症组织就都缩小一点。反反复复地感染，癌症居然越来越小。5 个月后这个病人的癌症没了，他出院了。\n\
    \n科利医生也蒙了，这不可能啊，会不会病例写错了呢？\n\n他找遍了整个纽约城，还真的找到了这个病人。\n\n科利让病人到医院检查发现，果然他的癌症没了。\n\
    \n好奇怪啊。科利想，难道是因为细菌感染激发了他的免疫力，反而杀死了癌细胞？\n\n有了这个想法，科利就尝试用细菌毒素来治疗癌症。治了上百例，确实还真的有人得到了缓解。\n\
    \n我们再来看科利当年的研究。\n\n- 首先，他也不知道这种疗法的原理。\n- 其次，他的研究没有严格的设计和对照。所以，其他医生没办法重复和验证。\n\
    - 再加上，用细菌感染治疗癌症的有效性和安全性没办法保证。\n\n所以，这种方法并没有得到广泛认可。到了 1936 年科利去世，这个方法也就淡出了人们的视野。\n\
    \n这就是时代局限性。但是，故事还没完。\n\n科利医生的女儿长大了，虽然她没能当医生，但是她说，父亲治了这么多病人，确实有缓解的，不可能都是侥幸，这种方法值得进一步研究。\n\
    \n后来，她募资建立了美国癌症研究所（CRI），支持癌症研究和治疗，尤其是免疫疗法。\n\n2018 年的诺贝尔生理学或医学奖得主，是美国科学家詹姆斯·艾利森（James\
    \ Allison）。艾利森医生就是这个癌症研究所的科学顾问委员会主任，他的获奖项目就是癌症的免疫疗法。\n\n### 癌症免疫疗法的工作原理\n\n为什么癌症的免疫疗法会得诺贝尔奖？\n\
    \n在免疫疗法出现之前，医生用手术、化疗、放疗，直接攻击癌细胞，这几种方法的本质都是外部干预。也就是借助于外援，帮着咱们杀敌人。\n\n但是，免疫疗法彻底换了一个思路，也就是增强内力。人体免疫就是咱们的内力。\n\
    \n你一定还记得，得癌症的时候，要么是免疫细胞认不出癌细胞这个“坏人”了，要么是免疫细胞打不过癌细胞了。无论是认不出还是打不过，都会出问题。\n\n所以，癌症免疫疗法的工作原理，就是恢复或者增强免疫细胞的识别能力和战斗力，发挥自身潜能，用内力来战胜癌细胞。\n\
    \n在科利医生那个年代，医生们对人体免疫原理的认识并不清晰。但是毫无疑问，他的研究是癌症免疫疗法的初步尝试。\n\n随着研究的越来越深入，科学家们逐步揭示了人体免疫系统的分子组成、化学介质，以及精确控制这个系统的分子开关。这些基础研究，为癌症免疫治疗提供了可能。\n\
    \n但是，这条探索的路走得并不容易。这一走，就是 100 年。其中，有很多科学家不应该被忘记，是他们的研究，促成了癌症的免疫疗法。\n\n### 用免疫疗法治疗晚期胰腺癌\n\
    \n下面，我们讲第二个故事。\n\n其实，每种癌细胞都有标志性的物质。免疫细胞就是通过识别这些标志性物质，来区别这个细胞是“坏人”，还是“自己人”。\n\n\
    有的免疫细胞专门负责识别，比如 DC 细胞。有的专门负责杀伤，比如 T 细胞。这两种细胞是盟友。\n\n发现 DC 细胞的人叫拉尔夫·斯坦曼（Ralph Marvin\
    \ Steinman），他是美国洛克菲勒大学免疫中心的博士。\n\n但是很不幸，在 2007 年，也就是斯坦曼发现 DC 细胞 34 年以后，他自己得了晚期胰腺癌。\n\
    \n一般来说，晚期胰腺癌患者如果失去了手术机会，存活时间平均不到一年。\n\n但是，斯坦曼博士用他自己做了一个试验。他用自身的 DC 细胞和癌细胞，制备癌症疫苗来治疗自己的晚期胰腺癌。\n\
    \n结果是他活了四年半，这个生存期，是这类晚期病人的 4-10 倍左右。\n\n2011 年 9 月 30 号，斯坦曼去世。\n\n10 月 3 号，也就是他去世三天后，诺贝尔委员会公布，由于斯坦曼对人体免疫学的贡献，决定把\
    \ 2011 年诺贝尔生理学或医学奖颁给他。他到最后也没能等到这个好消息。\n\n其实，就在斯坦曼去世前几天，他还在和女儿开玩笑说，“为了获得诺贝尔奖我也得坚持活下来，因为他们从不给逝者授奖”。\n\
    \n但是这一次，诺奖委员会为他破了例。\n\n斯坦曼的研究，把人体免疫和癌症关系的认知又推进了一步。他让咱们知道了，要想杀“敌人”，首先得认出“敌人”。\n\
    \n今天的免疫疗法，无论从哪个角度出发，都必须基于识别。只有识别了癌细胞，咱们才有可能进行下一步的杀灭。\n\n2018 年，获得诺贝尔生理学或医学奖的是美国科学家艾利森（James\
    \ P. Allison）和日本科学家本庶佑（Tasuku Honjo），他们的研究成果，同样是找到了癌细胞躲过免疫细胞杀伤的另外的关键机制。\n\n这些发现促成了癌症免疫药物的研发。这个时候，癌症的免疫疗法才真真切切地给癌症病人带来了福利。\n\
    \n癌症免疫疗法创立了一个癌症疗法的全新理念，这是人类与癌症战斗过程中，一个里程碑式的转变。\n\n为什么增强内力，依靠自身的免疫细胞就可以具有这么大的潜力呢？\n\
    \n这就到了我要讲的第三个故事。\n\n### 切尔诺贝利核爆炸和生态修复\n\n你肯定在电视上看到过原子弹爆炸的场景，有人用“核冬天”描述核爆炸之后的万物毁灭和凋零，那是一种只能用黑色和灰色描述的世界。\n\
    \n1986 年，前苏联切尔诺贝利核电站发生爆炸，这是人类有史以来遭遇的最严重的核灾难。\n\n这场灾难给生态带来的破坏，远远超过了 2011 年日本福岛核泄露。\n\
    \n有记者问专家：你认为需要多久，这个地方的生态才有可能修复呢？\n\n专家回答：至少两万年。核污染就这么可怕。\n\n今天的切尔诺贝利什么样了？毕竟刚刚过去\
    \ 30 年。是一个暗淡、破碎、凋零、荒凉的人间地狱吗？\n\n**2017 年**，有人公布了切尔诺贝利最新的航拍照片。\n\n照片上显示，在废弃的建筑物周围，长满了绿油油的植物，切尔诺贝利隔离区森林覆盖，郁郁葱葱。\n\
    \n![](img/4caf3257bac3bf3ff8bd0728c9b28448_254_0.png)\n\n科学家还观察到，隔离区里面生活着狼、野牛、驼鹿、野猪、山猫、野马和各种各样的鸟、昆虫。你可能会认为，这些动物受到核污染突变了。\n\
    \n并没有。\n\n一只年轻的野狼溜溜达达从隔离区走了出来。经过研究发现，这只狼和清洁区域的狼没什么两样。\n\n![](img/4caf3257bac3bf3ff8bd0728c9b28448_255_0.png)\n\
    \n这个故事和医学非常相关。\n\n遭受了人类历史上最严重的核灾难，但是经过短短 30 年，大自然就已经恢复了生机。所有人都低估了生态自身的力量。\n\n\
    这个故事告诉核专家，对于生态系统自身的修复能力要有信心。这个故事同样也让医生振奋：生命伟大的自我修复能力，永远超乎我们的想象。\n\n# 划重点\n\n-\
    \ 科利医生为癌症免疫疗法作出了初步尝试。\n- 斯坦曼告诉我们，要想杀“敌”，就要首先认出“敌人”。\n- 癌症免疫疗法的工作原理是，从外部干预，转为增强内力。内力就是人体免疫。\n\
    - 切尔诺贝利核电站爆炸后的恢复告诉我们，要对自身的修复保持信心。人体免疫就是伟大的自我修复能力。\n\n# 下节预告\n\n长久以来，精神疾病是医学的黑暗之地。下一讲，我们讲讲给精神治疗带来曙光的药——氯丙嗪。\n\
    \n## 33｜氯丙嗪：精神病治疗的第一道曙光\n\n2019-3-31\n\n你好，欢迎来到《医学通识50讲》，我是薄世宁。\n\n在你眼里，是不是每年的诺贝尔生理学或医学奖，都代表了医学的伟大进步呢？\n\
    \n那你知道有一年的诺奖发错了吗？\n\n直到今天，这个奖项都被看成是诺奖历史上最大的耻辱。\n\n这就是 1949 年的诺贝尔奖。颁给了一位医生，他发明了用切除病人的前脑叶来治疗精神病的方法。\n\
    \n![](img/4caf3257bac3bf3ff8bd0728c9b28448_256_0.png)\n\n前脑叶切除术示意图，用器具捣毁脑区\n\n\
    前脑叶就是大脑的额叶，额叶负责我们复杂的认知行为。比如记忆、思考、决策、表达等等。用手术破坏额叶，精神病病人的狂躁和幻觉自然也就消失了，病人也就不闹了。\n\
    \n但是，一个没有情感、没有判断、没有思维、只有呼吸的人，还能算一个真正的人吗？\n\n有人这么描述这个手术：\n"
