    家里的小药箱，可以备退烧药、感冒药、平时吃的慢性病用药，但是我认为不要准备太多的抗生素。


    别自己滥用抗生素。关于抗生素用不用，怎么用，还是应该咨询医生，根据处方购买和治疗。


    # 划重点


