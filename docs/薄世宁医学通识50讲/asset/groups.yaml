    ## 38 | 希波克拉底：2500 年前的誓言为什么今天还在用？


    2019-4-5


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    从这节课开始，咱们今天进入新的模块。这一模块，介绍对医学做出过突出贡献的大医生。但是，太多医生值得学习了。所以，我从贡献、精神、理念改变三个角度，找到具有代表性的几位医生，看看这些医生如何推动了医学的发展。


    这节课介绍第一位医生，他是被称为“西方医学之父”的希波克拉底医生。


    希波克拉底知名度高，你可能听过他的名字。但是，他到底怎么伟大呢？还有可能，你知道他是因一个誓言——《希波克拉底誓言》。这个誓言为什么历经 2500 年，到今天还在用呢？


    事实上，我们对于希波克拉底知之甚少。今天看到的《希波克拉底文集》，其实是很多医生作品的合集。所以更确切地说，希波克拉底这个名字是古代医生的典范，这个名字更是那个年代一种医学学派的名称。


    希波克拉底之所以伟大，首先要从医学的诞生讲起。


    ### 医学职业诞生的三大标志


    有了人类，就逐步有了医学。医学起源的初衷，就是人与人之间的救助。当这种救助越来越专业化的时候，自然也就形成一门职业。


    但是在科学不发达的以前，巫和医却是不分的。巫师也从事给人看病的事，医生也用一些巫术治病。


    这种状况一直持续到公元前 5 世纪，也就是距离今天 2500 多年前，相当于中国的春秋战国时期。


    古希腊爱琴海东南部有个小岛，叫做科斯岛。科斯岛在一个海湾的入口处，优越的地理位置利于航海，所以那里的贸易繁荣，经济发达。酿酒、冶炼、造船、建筑这些行业发展非常迅速。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_294_0.png)


    生产力的发展带来了体力劳动和脑力劳动的分工，这种氛围给西方医学的诞生提供了条件。希波克拉底就出生在这个岛上。


    先讲个传说。有一天，在科斯岛的市场上面突然有人倒地，意识不清，手脚抽动，口吐白沫。你应该猜到这个人是怎么了，就是癫痫，也就是咱们平时说的羊角风。


    这个时候，有个人挤出人群，他说：“我知道，这个人中邪了，一定是冒犯了神鬼。咱们大家快把他抬到神庙去，祈求神灵饶恕就好了。”


    今天的医学已经搞清楚了癫痫，它的病理基础是大脑的神经元突然异常放电，导致短暂的大脑功能异常。所以，病人会出现抽搐，意识丧失。等到神经元恢复正常放电了，病人也就好了。


    为什么要讲这个病呢？因为，癫痫是检验巫术还是医学的试金石。


    巫医怎么解释呢？既然这个病大家都说不明白，而且多数病人抽搐一会儿自然就好了。巫医就会说：“你们看，这是神鬼惩罚，念咒语就好了。”过段时间病人再犯病，巫医还会说：“你们看，这个人不听话，又得罪神灵了。”


    凡是没办法证伪的领域，就一定充斥着各种解释。


    大家刚要把病人往神庙里抬的时候，有个年轻人大声喊道：“这样不对，这个人大脑出了问题，根本不是什么神鬼惩罚。当务之急是赶紧给他嘴里塞上布，免得咬伤了舌头。过一会儿自然也就好了。”


    这个人就是希波克拉底。他刚给病人嘴里塞好布，病人就恢复了意识。这个时候，围观的百姓欢呼起来。巫师仓皇而逃。


    从此，希波克拉底名声大震，他的行医生涯遍布了科斯岛以及岛外很多地区。


    这个传说是否真实并不重要，重要的是，这个故事让我们理解医学和巫术的区别。


    废除巫术，确立医学，让医生成为一门独立职业的人，就是希波克拉底。他因此被称为“西方医学之父”。


    医学作为一门职业，诞生有三个标志：


    1. 疾病观形成；

    2. 治疗技术出现；

    3. 行业规则确立。


    首先，疾病观的意思是怎么看待病，怎么找病因。思想体系是任何一个学科的立足之本，疾病观就是医学的思想体系。


    在希波克拉底之前，神鬼疾病观认为病都是神鬼引起的。最典型的就是刚才说到的癫痫，还有精神疾病。巫师们认为是神鬼惩罚，鬼钻到人的脑子里了。所以，突然出现了解释不清的症状。


    而希波克拉底认为病是自身问题，是体液不平衡。他的四体液学说，认为四种体液包括血液、粘液、黄胆汁、黑胆汁，如果体液平衡，人就健康，如果不平衡，人就病了。


    尽管这种四体液学说也缺乏科学基础，但是它的伟大之处在于，从此以后，人们开始从自身找病因，把人从神鬼的桎梏中解救出来。


    希腊文明对于世界的贡献，就是“理性”二字。


    有了疾病观，自然带来了医学诞生的第二个标志——治疗技术出现。什么样的疾病观，也就带来什么样的治疗技术。


    在神鬼疾病观思想的指导下，治疗方法就是驱鬼、祈福、祈祷、祭祀等等。


    希波克拉底认为疾病是由于体液不平衡，那自然也就带来了食疗、导泻、催吐、放血、植物、动物毛骨，以及用矿物质来治病的方法。因为在他看来，这些方法都能调节体液。


    尽管在今天，这些原始的方法多数都不用了，但是今天很多医疗技术的原型，在那个年代就已经出现了。


    比如，治疗肩关节脱白的病人，现在用的让脱白复位的原理，依然是源于希波克拉底时代。他当时设计出了一种用于牵引固定的床。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_297_0.png)


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_297_1.png)


    左：希波克拉底发明的牵引固定床 右：现代牵引床


    再比如，希波克拉底提出医生要认真观察病情，详细记录包括病人的症状、体征、治疗的反应等信息。更可贵的是，在希波克拉底的著作里，还记载了他失败的案例。这样的病历同样具有极高的价值，而且体现了实事求是的态度。


    ### 《希波克拉底誓言》与医生的职业自律


    我认为，有了疾病观，医疗技术出现只是早晚问题，这些固然都是希波克拉底对医学的贡献。但我想说的是，纵使再有技术，也很难诞生一门独立的职业，技术只能诞生手艺入。


    因为一个行业或者职业，如果缺乏行业规则，而是让每个从事者自生自灭，那么一定不会得到规范、理性的发展。


    在我看来，希波克拉底更伟大的地方，就在于这节课要讲的第三点——行业规则的确立。


    希波克拉底前瞻性地预见到了医生这个职业可能面临的风险——在信息不对称的情况下，掌握信息的人，很可能利用信息优势牟取私利。尤其是在今天快速发展的医学领域。


    一个人要经过几年甚至十几年的职业训练，才能成为一名医生，而且工作后每天都要学习。大量的信息构成了医生服务病人的基础。医学科学高度专业化，分科也越来越细。这个科的医生也未必能确切地掌握其他科的信息进展。


    这种信息对于外行人，就是一道极高的门槛。


    医生和病人之间，是一种信息不对称的状态。所以，如果没有一个机制约束医生的行为，就会有道德风险，医生很可能利用知识不当获利。


    在 2500 年前，希波克拉底就用誓言的形式制定出了行业规则。


    有了疾病观，有了相应的技术，又有了行业规则，医生才成为了一门独立的职业。


    在西方很多国家，医学生入学或者毕业即将开始职业生涯的时候，要宣读《希波克拉底誓言》。中国虽然没有照搬这个誓言，但是医生、护士都有着各自的誓言。同样用宣誓的形式，承诺职业规范。


    誓言的第一版原文比较长，以下为节选的关键部分：


    > 我要遵守合约、矢志不渝。对传授我医术的老师，我要像父母一样敬重。对我的儿子、老师的儿子以及我的门徒，我要悉心传授医学知识。我要竭尽全力，采取我认为有利于病人的医疗措施，不能给病人带来痛苦与危害。我不把毒药给任何人，也决不就意见别人使用它。我要清清白白地行医和生活。无论进入谁家，只是为了治病，不为所欲为，不接受贿赂，不勾引异性。对看到或听到不应外传的私生活，我决不泄露。


    这个誓言可以概括为四个方面：尊重老师；不伤害病人；不以职业谋私；隐私保密。


    其实，这个誓言不正是很多职业必须坚守的职业规范吗？比如教师、律师、法官、会计师、审计师等等，这些以技术为主要服务形式的职业，是不是都可以参照这个誓言呢？


    所以，希波克拉底伟大之处不只是把医生从巫术中分离，确立了医学，而是意识到了职业诞生的危险，并且奠定了职业伟大的传统——自律。


    自律不是医生个人的道德品质，而是这个行业的职业要求。这就是医学诞生的第三个标志——群体自律和行业规则。


    但是客观地说，这个誓言具有一定的时代局限性。


    1948 年，世界医学会在这个誓言的基础上进行了修改，制定了正式作为医生行业道德规范的《日内瓦宣言》。以后每隔 10 年重新评估、修改，以符合时代进步。


    到今天，《希波克拉底誓言》已经经过了 8 次修改。


    除了行业自律的誓言之外，各个国家也制定出各种法律、规范、指南，让医疗这个行为越来越规范。一个掌握信息优势的技术群体，必须严格自律、不伤害、不谋私，才能真正地履行职责。


    历经 2500 年，这个誓言依旧有着它伟大的价值和意义。无论医学如何发展，也不论时空如何转换，医学的精神永远不会变。


    ### 划重点


    - 希波克拉底废巫立医，他被称为“西方医学之父”。

    - 医生作为一门独立职业诞生的标志有三个：疾病观形成，医学技术出现，行业规则确立。

    - 《希波克拉底誓言》强调行业自律，它成为医生的行业准则和道德规范。


    ### 思考题


    在你的行业里，有哪些特别的制度设计呢？欢迎在评论区留言，和大家一起交流。


    ### 下节预告


    实践为什么成为医学的核心理念？下节课我们介绍一位实践精神的代表人物——威廉·奥斯勒。


    ## 39｜奥斯勒：实践为什么成为医学的核心理念？


    2019-4-6


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    每个医生在上医学院的时候，都有读不完的书，而且都是大部头：生理、生化、解剖、组织胚胎、微生物、内、外、妇、儿、皮肤、性病、眼科等等。


    有多少呢？把这些书摞一块，肯定比几个人的身高加起来还高。


    但是学了这么多理论，就会看病了吗？


    理论和现实永远不一样。如果在火星上让种子发芽，长成植物，就可以通过光合作用产生氧气，那么咱们就可以移民火星。理论上可行吧？但是，现实呢？不行。


    《火星救援》这个电影毕竟是科幻。要想接近现实，就必须一代一代的人不断尝试。这就是实践。


    实践是理论和现实之间的桥梁。临床医学更是如此，实践是临床医学的核心理念。


    奠定现代医学教育基础，用实践理念去培养年轻医生的人，就是这节课要说的医学教育家——威廉·奥斯勒医生。他被称为“现代医学之父”。


    奥斯勒的名字可能你不熟悉。那你一定听说过美国的约翰·霍普金斯大学医学院，这是全世界最好的医学院之一，我们课程顾问团的任添华医生和冯雪医生，都在这个学校学习过。


    约翰·霍普金斯有多牛呢？它曾经连续 22 年蝉联全美医学院排名第一。它有 17 位诺贝尔生理学或医学奖获得者，16 位美国科学院院士。


    奥斯勒医生就是这个医学院的奠基人之一。这个学校的教育模式，就是源于奥斯勒的设想。


    有人说，美国成为医学强国，医学教育模式功不可没。


    这节课，我们不谈奥斯勒医生在医学上的重要发现，也不说他的职业精神和人格特质，我们只说他如何用实践理念培养年轻医生。


    ### 奥斯勒的“床边教学”


    1849 年，奥斯勒出生在加拿大。后来他来到美国，先后在宾州大学医学院和约翰·霍普金斯大学医学院担任医学教育管理工作。


    他意识到，北美当时的医学教育体系存在很大弊端。就是我们最开始提到的，医学生在医学院学的知识、理论，到了医院不能直接运用。在学校和医院之间有一条巨大的鸿沟，这显然不利于年轻医生的成长。


    奥斯勒潜心研究，到底什么样的教学模式，适合医学这个特殊的行业呢？


    说它特殊，是因为医学和任何科学都不同。医学面对的是活生生的人，每个病人都不同。而且，即便是同一种病，不同的人用同一种治疗方法，用同一种药，效果也不一样。医学充满着不确定性。


    所以，如果医学生大学毕业以后，直接去用一套生硬的理论去医院当医生，是不可能服务好病人的。


    奥斯勒是怎么解决这个问题的呢？


    首先，医学生在医学院上学的时候，就开始进入临床实习。


    这就是奥斯勒的“床边教学”。到病房里去学习、实习，边学习理论边实践。天天和病人在一起，想不成长都难。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_303_0.png)


    奥斯勒经常说：多跟病人说说话，病人的语言就揭示了诊断。只有反复实践，见多识广，才可以在不确定的临床医学面前，给病人最好的治疗。


    其次，如果医学生毕业之后，直接分配到不同水平的医院，那么他们今后的技术和能力势必发展也不同。水平有差异的医院，很可能会影响这些年轻医生的发展。


    所以，医学生从医学院毕业后，继续规范化培训。让年轻医生具备了标准化的能力之后，再开始服务病人，是对自己负责，对病人负责。这就是目前全世界很多国家施行的住院医师规范化培训制度。


    就拿咱们国家来说，医学生从医学院毕业之后，要想当医生，先要在国家规定的、具有培训资格的大医院进行三年的住院医师规范化培训。


    在美国，内科系统要培训 3-5 年，外科系统要培训 5-7 年。


    这些医生几乎是吃住在医院。不仅要培训医学知识、病人管理能力、沟通技巧、实践技能、多学科协作能力，还要培训科研能力、教学能力和职业精神。只有经历过这样的训练和实践，才能成为合格的医生。中国的住院医师规范化培训就是部分参考了奥斯勒医生提出的培训制度。


    奥斯勒终生都在推行他的“床旁教学”和用实践去培养医生的理念。


    每个领域的医生都在体系化的医学教育模式下，在实践的理念下不断成长。下面通过两个病例，看看实践在临床工作中的重要作用。


    ### 从“瘾君子”诊断艾滋病


    第一个病例，来自美国哥伦比亚大学的悉达多·穆克吉医生。


    一个中年男性，因为体重快速下降、虚弱、乏力来就诊。一般情况下，如果同时出现这几个症状，医生会首先考虑癌症。


    所以，穆克吉给病人做了全面、详细的检查。抽血、CT、超声，甚至胃镜、肠镜，全部检查都做了，仍然诊断不清这个病人到底是什么病。


    诊断陷入僵局。


    有一天，穆克吉路过咖啡厅的时候，不经意往里看了一眼，他看到这个病人正在和一个瘾君子亲密交谈。


    他回到医院，立刻给这个病人做了艾滋病的检查，结果是阳性。这个病人是艾滋病患者，艾滋病导致了他所有的症状。


    讲到这，你可能就有疑问了，为什么病人和吸毒的人聊天，就怀疑艾滋病呢？


    因为很多吸毒的人有共用注射器的现象，这样很容易互相传播艾滋病。艾滋病早期就有疲乏、食欲下降、消瘦的表现。这个病人和瘾君子走得这么近，那么他很可能也吸毒。


    所以，实践经验告诉穆克吉要这么做，结果证实了他的判断。


    这个病例不是要说明穆克吉医生有多牛，而是说在诊断阶段，实际情况远比理论复杂得多。


    理论上只要符合“1、2、3”，那么就能诊断。但是现实中没有清晰的线索用于诊断，需要医生去挖掘、梳理。


    人性的因素也远比我们想的复杂。因为各种原因，有些病人会隐瞒病情，有些病人会故意隐瞒性倾向，隐瞒心理问题，隐瞒家族史、接触史，隐瞒病情的真正原因等等。


    甚至，医生在诊断过程中搜集到的信息和指标也可能会相互冲突、相互矛盾，客观检查的数据指标也可能并不是完全一致。


    临床医学充满了不确定，没有任何一个公式可以套用在任何一个病人身上。

