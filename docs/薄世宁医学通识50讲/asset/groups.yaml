    再比如，尿毒症病人的肾没办法工作了，体内的毒素也就清除不出去。必须寻找一条新的途径清除这些毒素。


    血液透析、腹膜透析技术，可以利用分子弥散原理，让这些毒素物质排到体外。替代器官的功能，同样也是一条治病的新思路。


