    # 46 | 精进第三关：克服不理性的冲动


    2019-4-13


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    不理性是人类固有的本质之一，医生同样如此。


    3 年前，我遇到一个病例。


    病人是一个 30 岁的青年男性。高烧后出现全身器官衰竭，尤其是肾衰竭，一滴尿都没有。


    所以，需要立刻给他做床旁的血液净化，净化之前要穿刺，也就是在腿上的大血管里放一根导管，这样才能把血引出来。


    我给他消毒、铺巾、注射麻药。一切都很正常。


    但是，这个时候出现了一个反常现象。


    打麻药的时候，尽管针头很细，但是血立刻从这个小针眼里快速地涌了出来，一滴一滴地落在无菌单上，就像断了线的珠子。


    这就怪了，病人的血小板数量是在正常范围内。而且损伤的只有皮肤内的小血管，为什么出血这么快呢？


    根据这个点，我已经有了一个大概判断。然后，全院专家会诊。


    专家们给了各种详细、中肯的建议，提出了进一步检查的意见。轮到我发言的时候，我说这个病人多半是流行性出血热。


    我解释一下，流行性出血热是一种病毒感染，主要是通过鼠类传染。


    现在的卫生条件越来越好，在大城市，这种病已经非常少见了。所以大家都不同意我的观点，但我还是坚持给他抽血查抗体，如果抗体增高就可以确诊。'
  - '[PAGE 360]


    第二天，科主任给我打电话，听得出她特别高兴，她说：“薄大夫你太神了，化验结果出来了，这个病人就是流行性出血热。”


    你会不会也觉得我很神呢？


    其实，真的不是我神。因为出血速度非常快的那个反常点，我以前见过。


    20 年前，我遇到过同一个同样的病例。不同的是，那一次我误诊了。那个病人差点因为我的错误造成巨大的伤害。


    # 不理性状态下的窄化效应


    20 年前，我还在另外一家医院当住院医师，也就是级别最低的医生。


    有一天我收了一个病人。20 岁，男性，高烧三天后浮肿，肌酐 1000 多，超过了正常值的十几倍。这说明他已经到了严重的肾功能衰竭期，我立刻给他下了病危通知。


    这个男生在天津读工科，我见到他的时候，这个男生长满了胡子，但是长相英俊。他无力地躺在床上，眼睛肿得张不开。透过他微弱的眼神，我能感受到他强烈的求生欲。


    我立刻诊断他是急进性肾炎。


    这种病和你听过的急性肾炎不同，急性肾炎多数是儿童发病，可以自愈。但是急进性肾炎，是青年和中年发病。


    别看只有一个字的差别，病理不同，结局也不同。如果治疗不及时，90%以上的急进性肾炎病人，会在 6 个月内死亡或依赖透析生存。我和他说到这个诊断的时候，他吓哭了。他说：“你救救我。”


    我太想给他治好了。


    尽管别的医生说，先观察一下，但我还是缠着上级医生，坚持给他注射三天激素。'
  - '[PAGE 361]


    注射激素后的第二天，他的肌酐从 1000 多下降到 600，我觉得我做对了，但是事实很快就打破了我的幻想。不到一天的时间，他的肌酐值快速反弹，又升高到了 1000。


    我几乎绝望了，这个孩子没救了。


    第三天，我们紧急请了中国著名的肾脏内科教授会诊。我汇报病例，教授认真看完了病例又去看病人。


    然后他沉思了一会说："薄医生，你的诊断和治疗都是错的。"


    为什么呢？


    他继续说："你只想到了急性肾炎这一个诊断，但是有两个细节你忽略了：第一，病人的出血速度明显加快。第二，我去看病人的时候，看到他的尿里面有一层漂浮物。所以，我认为这个病人应该是流行性出血热。"


    这个时候我突然就想起来，这两个细节我都见到了。


    我给这个男生刮胡子的时候，他脸上擦破了一点皮，瞬间就流血不止。你还记得我是怎么描述上一个病例的出血吗？对，就像断了线的珠子一样，两个病例几乎一模一样。


    他的父亲曾经拿着留尿的瓶子让我看，他的尿里面有一层像海草一样的漂浮物，我也是见到了的。


    但是，我只是一味地关注了急性肾炎这一个诊断，把这两个关键点都错过了。


    教授继续说："马上停止你的治疗，如果继续再用大剂量激素，这个病人很可能会消化道大出血。抓紧透析，用上抗病毒药，这个病人可以治愈。"


    后来的化验证实了他的判断。根据他的治疗方案，这个病人很快就痊愈出院了，万幸的是没有留下一点儿后遗症。我差点就给病人造成不可挽回的伤害。


    我相信在平时，以我的知识范围和能力，遗漏这么关键的两个点，可能性很小。'
  - '[PAGE 362]


    那你会问了，你每天见这么多的重病人，为什么这个病例让你这么不理性呢？


    我告诉你，这个病人是我的亲弟弟。


    情感太强烈的时候，就会让不理性控制我的判断。所以，我眼睁睁地看着这些关键证据，置若罔闻。


    直到今天，这个病例都在反复提醒我：


    第一，不理性会带来窄化效应，窄化效应就会让医生过度关注某一诊断，忽略了其他的线索。


    第二，不理性会让医生过度关注疾病最坏的结局，而忽视了疾病发展规律，变得激进和冒险。


    我弟弟差点因为大剂量的激素冲击，引起可能的消化道大出血。


    临床工作中，会有很多因素干扰医生的思维。比如：


    +   - 有的时候是朋友住院，他不想按照常规流程做必要的检查，想立刻手术；

    - 有的时候是领导发话，必须要达到一个什么样的治疗效果；

    - 有的时候治疗的是社会热点人物，社会舆论会放大宣传。


    无论遇到什么样的情况，一个医生必须克服这些干扰因素理性行事。即使是面对让你憎恨的病人，比如是曾经危害过社会的罪犯，比如无理取闹的病人，甚至是伤害过你的人。


    美剧《豪斯医生》里就有个病人在治疗的时候精神失常了，他一把抓住了手术刀，扎穿了豪斯医生同事的腹部，这个医生面临下肢截瘫的危险。


    尽管其他医生都恨这个病人，但是豪斯医生仍然克服了偏见，最终为病人找到了正确的诊断和治疗方案。'
  - '[PAGE 363]


    # 一流智慧的标志


    但是毫无疑问，非理性和理性是人本质里固有的两个面。


    美国自由撰稿人朱莉娅·加莱夫（Julia Galef）在她的 TED 演讲中提到，在决策时人的思维会有两种模式，第一种叫做“士兵思维”，第二种叫做“侦察兵思维”。


    士兵和侦察兵角色不同，所以思维逻辑也就不同。医生的思维同样符合这两个思维模式。


    士兵主要负责攻击，他的任务是生存和出击。所以他所做的就是保护战友，快速歼灭敌人。


    医生的“士兵思维”，就是把所有符合他直觉的诊断信息，当成自己的战友保护起来，把不符合他判断的信息当成敌人，过滤掉，消灭掉。


    但是侦察兵不同，他负责观察形势，他的任务是尽可能看清楚地形地貌，了解敌人的兵力部署，也就是了解全局后汇报给司令部，再做下一步计划。


    所以，医生的“侦察兵思维”就是能够摒除内心的歧视、偏见和强烈的倾向，尽可能客观地找出所有有价值的证据。


    但是你必须知道，一个具有战斗力的团队，士兵和侦察兵都是不可缺少的。人的理性思维和非理性思维也是共存的。理性和非理性本来就不是一个是与非的关系，而是相互转换，配合应用的过程。


    可能你以为医生最好抛弃不理性，只留下理性思维。但是我要说，没有情感的医学是黑白的世界。


    理性让医生在关键时刻正确判断、正确行事，但情感才让医学有了温度。


    一个医生同时具备理性和不理性思维，还能正确转换，这虽然是最难的一关，但是闯过了，才能更好地服务于病人。'
  - '[PAGE 364]


    上周，病房里抢救一个大面积软组织感染，感染性休克的病人，虽然我们用了各种各样的手段，但是，最终病人还是离开了。


    当我拖着疲惫的身子沮丧地往办公室走的时候，听到后楼道呜呜的哭声。


    谁在哭呢？


    我走过去，看到我们外科刚毕业的一个1米8几的男博士在哭，我说：“哭啥啊你？”


    他说：“我管了她7天，但还是没成功。我觉得对不起病人。”


    我拍了拍他，我心想哭吧，一个医生的精进之路又开始了。


    # 划重点


    1. 情感过于强烈会带来不理性。 2. 不理性在医疗过程中会引起思维窄化。 3. 正确转换理性思维和不理性思维，是医生要过的第三关。


    # 下节预告


    下节课，我们进入新的一章，讲讲普通人如何获得最大程度的医学帮助。'
  - '[PAGE 365]


    # 47 ｜ 健康的智慧：把自己挡在去医院的路上


    2019-4-14


    你好，欢迎来到《医学通识 50 讲》。我是薄世宁。


    在上一章，我们讲了医生的精进。医生要闯过无数关卡，经过系统的思维训练和实践，才能更好地为病人服务。


    今天进入新的章节：健康的修炼。


    说说怎么聪明地管理健康；在疾病面前，怎么科学决策；怎样理性地面对生命终点。


    没人想去医院，但是谁也离不了医院。如何阻断去医院这条路，让咱们尽可能推迟去医院的时间呢？这就是这节课要说的：健康的智慧。


    疾病不是突然发生的，而是突然发现的。生活中的细枝末节，可能也就决定了何时去医院。只要干预这些细节，那就一定可以在某种程度上把自己挡在去医院的路上。


    这就好比是，尽管很多病确切的因果关系我们还没有完全掌握，但是只要打断疾病因果关系链条中的某个环节，那么同样可以预防疾病。


    多数慢性病出现症状前的因果关系链条概括为：高危因素—修复、代偿能力下降—疾病隐性期。


    接下来，我就从疾病发作之前的这三个关键环节出发，分为三个层面，讲讲如何科学管理健康。


    # 避免高危因素


    什么是高危因素呢？就是目前已知的，对于疾病的生成和发展具有高度相关性的某些因素。'
  - '[PAGE 366]


    +   1. 基因。


    美国著名影星安吉丽娜·朱莉，携带一种叫做 BRCA1 的基因，她患乳腺癌、卵巢癌的几率大大增加。这种基因就是高危因素。


    +   2. 慢性病毒或者细菌感染。


    乙肝病毒感染可以引起肝炎，之后引起肝硬化、肝癌。


    +   3. 一级致癌物。


    比如，雾霾、亚硝酸盐、槟榔、黄曲霉素等。


    +   4. 饮食过烫。


    喝热茶当水温过高，超过 65 度的时候，食管上皮受损，上皮细胞加速分裂，这样食管癌发病风险大大增加。饮食过烫，这也是高危因素。


    +   5. 不健康的饮食习惯。


    医学权威期刊《柳叶刀》（The Lancet）指出，不健康的饮食习惯是全球死亡的首要危险因素。中国因为饮食结构问题造成的心血管疾病死亡率、癌症死亡率都是世界人口前
    20 的大国中的第一名。包括：钙、膳食纤维、水果和蔬菜摄入不足，红肉、加工肉类摄入过多，高钠饮食、含糖饮料等等。


    +   6. 肥胖


    不健康的饮食结构和高热量摄入，又会带来肥胖。肥胖会引起糖尿病、心血管疾病，哮喘发病率增高，肥胖还可能与大脑萎缩有关。


    肥胖还带来了 13 种癌症的高发。来自华盛顿大学医学院的一项研究指出，引起中青年女性直肠癌、结肠癌发病率上升的一个重要危险因素就是肥胖。只要是 BMI 超过
    30（BMI'
  - '[PAGE 367]


    是体重指数，是用体重的公斤数除以身高米数的平方），结、直肠癌风险立刻增加近一倍。所以，肥胖也是多种疾病的高危因素。


    这些高危因素中，除了基因没有好办法改变，安吉丽娜·朱莉采取的用手术切除靶器官的做法，目前还有争议。


    但是，避免其他的高危因素，也就减少了日积月累的对器官和细胞的损伤，减少了修复和代偿的压力。也就是从源头上，减少了疾病的生成。


    所以，针对疾病因果关系链的第一个环节高危因素，我的建议是：


    +   1. 预防或者治疗慢性感染。


    比如，通过注射乙肝疫苗，通过阻断传染途径，应用药物抑制乙肝病毒复制等等，就可以在很大程度上避免肝癌的发生。


    再比如，注射 HPV 疫苗预防 HPV 感染，如果已经有感染，积极治疗也可以有效预防宫颈癌的发生，等等。


    +   2. 避免高危行为。


    高危行为包括抽烟，过度饮酒、熬夜、过烫饮食、雾霾天不戴口罩、食用可能含有亚硝酸盐或者黄曲霉毒素的食物等等。


    +   3. 健康饮食。


    少吃糖，少吃红肉和加工肉类，少吃盐。多吃膳食纤维多的食物。比如全麦面包、燕麦片等全谷物、杂粮，多吃水果蔬菜，多摄入高 Omega-3 脂肪酸的食物，比如某些海产品。


    尤其是膳食纤维。一项荟萃分析指出，增加膳食纤维有助于降低体重、血糖、血压、血脂，与冠心病、糖尿病和肠癌等多种疾病风险的下降有关。'
  - '[PAGE 368]


    研究者认为：这是膳食纤维50年研究史上里程碑式的事件。多吃膳食纤维能挽救生命，这应该被载入史册。建议每天摄入至少25-29克或更多的膳食纤维。


    这些都是针对第一个环节高危因素，我们可以做的。


    有些人有赌博心理，总搬出一些小概率事件，比如“谁又吸烟又喝酒，活了100多岁”“谁天天运动还跑马拉松，结果得了胰腺癌。”


    健康生活方式的建议，是循证医学大数据得出的目前可靠的证据，这本身和一些小概率事件是不冲突的。


    要有投资意识，为未来储存健康。


    # 不破坏修复和代偿能力


    接下来，我们说说干预疾病因果关系链条的第二个环节：修复和代偿能力下降。


    你一定还记得，咱们在前面讲衰老的课程《第24讲衰老：老不是问题，衰才是关键》时说过，只要生命存在，基因就会不断损伤，我们从出生开始，就迈进了一条永不可能逆转的生命之河。


    多细胞生物赖以生存的一个关键机制，就是修复和代偿。


    细胞靠加速分裂，补充受损或者死亡的细胞，这是修复。免疫细胞清除“异己”，这也是修复。细胞和器官靠加快工作，替代受损的细胞或者器官执行功能，这是代偿。


    修复和代偿是人体针对损伤的一种智慧，这是天然形成的。但是，咱们的很多行为会影响到机体的修复和代偿能力。


    比如热量摄入过多、肥胖、熬夜。'
  - '[PAGE 369]


    德国图宾根大学有一项研究指出，熬夜会破坏肾上腺素等物质分泌的昼夜节律，从而抑制 T 细胞对侵入人体的病原体，或者肿瘤细胞的粘附能力。因此，T 细胞杀伤“敌人”能力下降，从而影响免疫细胞功能。


    所以，针对第二个环节，我的第一个建议：适度节食。


    节食可以清除衰老细胞、衰老物质，有助于延缓皮肤成纤维细胞老化，产生更多的胶原蛋白和弹性蛋白，保持皮肤弹性，节食还可以延缓心血管老化。这些都是通过增加了修复和代偿的能力实现的。


    尤其对于 2 型糖尿病的病人，通过节食和运动减肥，降低体重，在早期甚至可以达到近乎“治愈”的效果。通过饮食管理一年减掉 30 斤，86% 的肥胖 2 型糖尿病患者早期，甚至可以达到停药效果。


    动物实验显示，如果小鼠只摄入正常饮食 70% 的热量，而且是一天一次的进食频率的话，不仅可以减肥和预防 2 型糖尿病，平均寿命还要延长 28%。


    第二个建议：尽量保证每天的睡眠在 7-8 小时。睡眠过多和过少，都会影响健康。


    第三个建议：运动。


    运动首先可以增加能量消耗，减轻慢性炎症反应；其次还有利于衰老物质清除，预防多种癌症和体重增加；最后还可以降低冠心病、高血压、卒中、2 型糖尿病、代谢综合征和抑郁症的风险。


    有研究指出，与不运动和肥胖群体相比，持续锻炼（相当于每周 > 150 分钟快走）和正常体重的人群，与平均寿命增加 7.2 年相关。


    这就是针对发病因果关系链条的第二个环节：改善人体的修复和代偿能力。'
  - '[PAGE 370]


    真正有效的养生项目，都是把健康饮食、节食、运动和社交封装在了文化和哲学包装下，让参与者更有价值感和意义感，但是本质上都是提高人体修复和代偿能力。所以，不要搞混。


    # 进行疾病早期筛查


    通过上面这些经过科学研究论证过的生活方式调整，可以在很大程度上降低疾病风险。有学者指出，40%的癌症是可以预防的。


    但是，即便是避免了高危因素，增加了修复和代偿能力，细胞依然还在分裂，分裂就会带来基因损伤，基因损伤就会带来衰老和疾病，甚至癌症。很多病，我们难以完全预防。


    而且多数慢性病尤其是癌症，早期没有症状。


    那么，针对疾病因果关系链条的第三个环节疾病隐性期，应该进行疾病的早期筛查，尤其是癌症筛查。科学筛查的意义，毋庸置疑。


    比如肺癌。


    在以前，没有筛查之前，我国肺癌确诊时有将近 80.0% 的患者已是中晚期，失去了根治性手术治疗的机会，5 年生存率很低，大约在 16.1%。


    但是如果早期发现，这个数字就可以提高到至少 70% 以上。


    怎么筛查呢？


    有四种癌症，具有明确的筛查价值。包括：


    +   1. 早期肺癌——用低剂量肺部 CT 筛查；

    2. 早期乳腺癌——用乳腺钼靶检查，或者加上超声、核磁共振筛查；

    3. 早期宫颈癌——用宫颈细胞学涂片检查，或者加上 HPV 检测筛查；

    4. 结肠癌和直肠癌——用结肠镜筛查。'
  - '[PAGE 371]


    开始筛查的年龄以及频率，你可以参考筛查指南（见文末）。


    筛查指南的制定具有普适性。但是我认为，对个人而言，开始筛查的年龄以及频率，还是要结合自身情况，最好和医生商量后决定。


    就拿早期肺癌的筛查来说，中国低剂量肺部 CT 肺癌筛查指南建议，年龄介于 50 岁-74 岁之间，吸烟，以及已经戒烟但是戒烟时间没超过 5 年的人定期接受检查。


    但是近年来，肺癌呈现女性化、年轻化、无吸烟史、腺癌高发等特点。如果严格按照这个年龄标准，会不会遗漏呢？


    开始筛查的年龄，应该根据实际的流行病学特点，进行适当调整。


    广州医科大学附属医院何建行教授最近发表的一项研究指出，如果筛查年龄提前到 40-45 岁，检出早期肺癌的概率，远大于到了 50 岁时再筛查。


    那么这个结果，能不能说明在指南建议的年龄之前开始筛查，可能会让更多早期患者更受益呢？当然了，还需要更多的研究证据来制定肺癌的最佳筛查策略。


    但是，我个人认为，对于重度吸烟，或者有肺癌家族史，或者有慢性肺病等等，经济条件又允许的人，肺癌筛查年龄可以提前。


    # 划重点


    +   1. 多数慢性病出现症状之前的因果关系链条可以概括为：高危因素一修复、代偿能力下降一疾病隐性期。 2. 针对第一个环节：预防或者治疗慢性感染，避免高危行为，健康饮食。针对第二个环节，可以适度节食，运动。针对第三个环节，可以进行科学的筛查。


    # 指南建议


    +   乳腺癌筛查指南


    中国抗癌协会乳腺癌专业委员会建议：'
  - '[PAGE 372]


    # **20~39岁**


    不推荐对该年龄段人群进行乳腺筛查。


    # **40~45岁**


    +   1. 适合机会性筛查。

    2. 每年 1 次乳腺 X 线检查。

    3. 对致密型乳腺(腺体为 c 型或 d 型)推荐与 B 超检查联合。


    # **45~69岁**


    +   1. 适合机会性筛查和人群普查。

    2. 每 1~2 年 1 次乳腺 X 线检查。

    3. 对致密型乳腺推荐与 B 超检查联合。


    # **70岁或以上**


    +   1. 适合机会性筛查。

    2. 每 2 年 1 次乳腺 X 线检查。


    # 乳腺癌高危人群筛查意见


    建议对乳腺癌高危人群提前进行筛查[小于 40 岁]，筛查同期推荐每年 1 次，筛查手段除了应用一般人群乳腺 X 线检查之外，还可以应用 MRI 等新的影像学手段。


    # 乳腺癌高危人群的定义


    +   1. 有明显的乳腺癌遗传倾向者。'
  - '[PAGE 373]


    (2) 既往有乳腺导管或小叶不典型增生或小叶原位癌 (lobular carcinoma in situ，LCIS) 的患者。


    (3) 既往行胸部放疗。


    +   • 肺癌


    参加年度性 LDCT 筛查的个体为年龄介于 50 岁-74 岁之间的吸烟者，至少有 20 包/年吸烟史，如已经戒烟则戒烟时间不得超过 5 年。


    如果某些高发地区有其他重要的肺癌危险因素也可作为筛选高危人群的条件，如宣称无通风或通风较差室内燃煤年数≥15 年；个旧项目有 10 年或更长的坑下作业或冶炼史。


    近 5 年有癌症病史（非黑色素性皮肤癌、宫颈原位癌、局限性前列腺癌除外）、不能耐受可能的肺癌切除手术或有严重影响生命疾病的个体则不建议进行 LDCT 筛查。


    检查措施：低剂量螺旋 CT。


    +   • 肝癌


    具有乙型肝炎病毒（HBV）和/或丙型肝炎病毒（HCV）感染、长期酗酒、非酒精脂肪性肝炎、食用被黄曲霉毒素污染食物、各种原因引起的肝硬化、以及有肝癌家族史等的人群，尤其是年龄
    40 岁以上的男性风险更大。


    检查措施：血清甲胎蛋白（AFP）和肝脏超声检查。


    具体建议：建议上述高危人群每隔 6 个月进行至少一次检查。


    +   • 胃癌


    年龄≥40 岁，且符合下列任意一条者，建议其作为胃癌筛查对象人群：


    ① 胃癌高发地区人群；'
  md: "\n## 46 | 精进第三关：克服不理性的冲动\n\n2019-4-13\n\n你好，欢迎来到《医学通识 50 讲》，我是薄世宁。\n\n不理性是人类固有的本质之一，医生同样如此。\n\
    \n3 年前，我遇到一个病例。\n\n病人是一个 30 岁的青年男性。高烧后出现全身器官衰竭，尤其是肾衰竭，一滴尿都没有。\n\n所以，需要立刻给他做床旁的血液净化，净化之前要穿刺，也就是在腿上的大血管里放一根导管，这样才能把血引出来。\n\
    \n我给他消毒、铺巾、注射麻药。一切都很正常。\n\n但是，这个时候出现了一个反常现象。\n\n打麻药的时候，尽管针头很细，但是血立刻从这个小针眼里快速地涌了出来，一滴一滴地落在无菌单上，就像断了线的珠子。\n\
    \n这就怪了，病人的血小板数量是在正常范围内。而且损伤的只有皮肤内的小血管，为什么出血这么快呢？\n\n根据这个点，我已经有了一个大概判断。然后，全院专家会诊。\n\
    \n专家们给了各种详细、中肯的建议，提出了进一步检查的意见。轮到我发言的时候，我说这个病人多半是流行性出血热。\n\n我解释一下，流行性出血热是一种病毒感染，主要是通过鼠类传染。\n\
    \n现在的卫生条件越来越好，在大城市，这种病已经非常少见了。所以大家都不同意我的观点，但我还是坚持给他抽血查抗体，如果抗体增高就可以确诊。\n\n第二天，科主任给我打电话，听得出她特别高兴，她说：“薄大夫你太神了，化验结果出来了，这个病人就是流行性出血热。”\n\
    \n你会不会也觉得我很神呢？\n\n其实，真的不是我神。因为出血速度非常快的那个反常点，我以前见过。\n\n20 年前，我遇到过同一个同样的病例。不同的是，那一次我误诊了。那个病人差点因为我的错误造成巨大的伤害。\n\
    \n### 不理性状态下的窄化效应\n\n20 年前，我还在另外一家医院当住院医师，也就是级别最低的医生。\n\n有一天我收了一个病人。20 岁，男性，高烧三天后浮肿，肌酐\
    \ 1000 多，超过了正常值的十几倍。这说明他已经到了严重的肾功能衰竭期，我立刻给他下了病危通知。\n\n这个男生在天津读工科，我见到他的时候，这个男生长满了胡子，但是长相英俊。他无力地躺在床上，眼睛肿得张不开。透过他微弱的眼神，我能感受到他强烈的求生欲。\n\
    \n我立刻诊断他是急进性肾炎。\n\n这种病和你听过的急性肾炎不同，急性肾炎多数是儿童发病，可以自愈。但是急进性肾炎，是青年和中年发病。\n\n别看只有一个字的差别，病理不同，结局也不同。如果治疗不及时，90%以上的急进性肾炎病人，会在\
    \ 6 个月内死亡或依赖透析生存。我和他说到这个诊断的时候，他吓哭了。他说：“你救救我。”\n\n我太想给他治好了。\n\n尽管别的医生说，先观察一下，但我还是缠着上级医生，坚持给他注射三天激素。\n\
    \n注射激素后的第二天，他的肌酐从 1000 多下降到 600，我觉得我做对了，但是事实很快就打破了我的幻想。不到一天的时间，他的肌酐值快速反弹，又升高到了\
    \ 1000。\n\n我几乎绝望了，这个孩子没救了。\n\n第三天，我们紧急请了中国著名的肾脏内科教授会诊。我汇报病例，教授认真看完了病例又去看病人。\n\n\
    然后他沉思了一会说：\"薄医生，你的诊断和治疗都是错的。\"\n\n为什么呢？\n\n他继续说：\"你只想到了急性肾炎这一个诊断，但是有两个细节你忽略了：第一，病人的出血速度明显加快。第二，我去看病人的时候，看到他的尿里面有一层漂浮物。所以，我认为这个病人应该是流行性出血热。\"\
    \n\n这个时候我突然就想起来，这两个细节我都见到了。\n\n我给这个男生刮胡子的时候，他脸上擦破了一点皮，瞬间就流血不止。你还记得我是怎么描述上一个病例的出血吗？对，就像断了线的珠子一样，两个病例几乎一模一样。\n\
    \n他的父亲曾经拿着留尿的瓶子让我看，他的尿里面有一层像海草一样的漂浮物，我也是见到了的。\n\n但是，我只是一味地关注了急性肾炎这一个诊断，把这两个关键点都错过了。\n\
    \n教授继续说：\"马上停止你的治疗，如果继续再用大剂量激素，这个病人很可能会消化道大出血。抓紧透析，用上抗病毒药，这个病人可以治愈。\"\n\n后来的化验证实了他的判断。根据他的治疗方案，这个病人很快就痊愈出院了，万幸的是没有留下一点儿后遗症。我差点就给病人造成不可挽回的伤害。\n\
    \n我相信在平时，以我的知识范围和能力，遗漏这么关键的两个点，可能性很小。\n\n那你会问了，你每天见这么多的重病人，为什么这个病例让你这么不理性呢？\n\n\
    我告诉你，这个病人是我的亲弟弟。\n\n情感太强烈的时候，就会让不理性控制我的判断。所以，我眼睁睁地看着这些关键证据，置若罔闻。\n\n直到今天，这个病例都在反复提醒我：\n\
    \n- 不理性会带来窄化效应，窄化效应就会让医生过度关注某一诊断，忽略了其他的线索。\n- 不理性会让医生过度关注疾病最坏的结局，而忽视了疾病发展规律，变得激进和冒险。\n\
    \n我弟弟差点因为大剂量的激素冲击，引起可能的消化道大出血。\n\n临床工作中，会有很多因素干扰医生的思维。比如：\n\n- 有的时候是朋友住院，他不想按照常规流程做必要的检查，想立刻手术；\n\
    - 有的时候是领导发话，必须要达到一个什么样的治疗效果；\n- 有的时候治疗的是社会热点人物，社会舆论会放大宣传。\n\n无论遇到什么样的情况，一个医生必须克服这些干扰因素理性行事。即使是面对让你憎恨的病人，比如是曾经危害过社会的罪犯，比如无理取闹的病人，甚至是伤害过你的人。\n\
    \n美剧《豪斯医生》里就有个病人在治疗的时候精神失常了，他一把抓住了手术刀，扎穿了豪斯医生同事的腹部，这个医生面临下肢截瘫的危险。\n\n尽管其他医生都恨这个病人，但是豪斯医生仍然克服了偏见，最终为病人找到了正确的诊断和治疗方案。\n\
    \n### 一流智慧的标志\n\n但是毫无疑问，非理性和理性是人本质里固有的两个面。\n\n美国自由撰稿人朱莉娅·加莱夫（Julia Galef）在她的 TED\
    \ 演讲中提到，在决策时人的思维会有两种模式，第一种叫做“士兵思维”，第二种叫做“侦察兵思维”。\n\n士兵和侦察兵角色不同，所以思维逻辑也就不同。医生的思维同样符合这两个思维模式。\n\
    \n士兵主要负责攻击，他的任务是生存和出击。所以他所做的就是保护战友，快速歼灭敌人。\n\n医生的“士兵思维”，就是把所有符合他直觉的诊断信息，当成自己的战友保护起来，把不符合他判断的信息当成敌人，过滤掉，消灭掉。\n\
    \n但是侦察兵不同，他负责观察形势，他的任务是尽可能看清楚地形地貌，了解敌人的兵力部署，也就是了解全局后汇报给司令部，再做下一步计划。\n\n所以，医生的“侦察兵思维”就是能够摒除内心的歧视、偏见和强烈的倾向，尽可能客观地找出所有有价值的证据。\n\
    \n但是你必须知道，一个具有战斗力的团队，士兵和侦察兵都是不可缺少的。人的理性思维和非理性思维也是共存的。理性和非理性本来就不是一个是与非的关系，而是相互转换，配合应用的过程。\n\
    \n可能你以为医生最好抛弃不理性，只留下理性思维。但是我要说，没有情感的医学是黑白的世界。\n\n理性让医生在关键时刻正确判断、正确行事，但情感才让医学有了温度。\n\
    \n一个医生同时具备理性和不理性思维，还能正确转换，这虽然是最难的一关，但是闯过了，才能更好地服务于病人。\n\n上周，病房里抢救一个大面积软组织感染，感染性休克的病人，虽然我们用了各种各样的手段，但是，最终病人还是离开了。\n\
    \n当我拖着疲惫的身子沮丧地往办公室走的时候，听到后楼道呜呜的哭声。\n\n谁在哭呢？\n\n我走过去，看到我们外科刚毕业的一个1米8几的男博士在哭，我说：“哭啥啊你？”\n\
    \n他说：“我管了她7天，但还是没成功。我觉得对不起病人。”\n\n我拍了拍他，我心想哭吧，一个医生的精进之路又开始了。\n\n### 划重点\n\n- 情感过于强烈会带来不理性。\n\
    - 不理性在医疗过程中会引起思维窄化。\n- 正确转换理性思维和不理性思维，是医生要过的第三关。\n\n### 下节预告\n\n下节课，我们进入新的一章，讲讲普通人如何获得最大程度的医学帮助。\n\
    \n## 47 ｜ 健康的智慧：把自己挡在去医院的路上\n\n2019-4-14\n\n你好，欢迎来到《医学通识 50 讲》。我是薄世宁。\n\n在上一章，我们讲了医生的精进。医生要闯过无数关卡，经过系统的思维训练和实践，才能更好地为病人服务。\n\
    \n今天进入新的章节：健康的修炼。\n\n说说怎么聪明地管理健康；在疾病面前，怎么科学决策；怎样理性地面对生命终点。\n\n没人想去医院，但是谁也离不了医院。如何阻断去医院这条路，让咱们尽可能推迟去医院的时间呢？这就是这节课要说的：健康的智慧。\n\
    \n疾病不是突然发生的，而是突然发现的。生活中的细枝末节，可能也就决定了何时去医院。只要干预这些细节，那就一定可以在某种程度上把自己挡在去医院的路上。\n\n\
    这就好比是，尽管很多病确切的因果关系我们还没有完全掌握，但是只要打断疾病因果关系链条中的某个环节，那么同样可以预防疾病。\n\n多数慢性病出现症状前的因果关系链条概括为：高危因素—修复、代偿能力下降—疾病隐性期。\n\
    \n接下来，我就从疾病发作之前的这三个关键环节出发，分为三个层面，讲讲如何科学管理健康。\n\n### 避免高危因素\n\n什么是高危因素呢？就是目前已知的，对于疾病的生成和发展具有高度相关性的某些因素。\n\
    \n1. **基因**。\n   美国著名影星安吉丽娜·朱莉，携带一种叫做 BRCA1 的基因，她患乳腺癌、卵巢癌的几率大大增加。这种基因就是高危因素。\n\
    2. **慢性病毒或者细菌感染**。\n   乙肝病毒感染可以引起肝炎，之后引起肝硬化、肝癌。\n3. **一级致癌物**。\n   比如，雾霾、亚硝酸盐、槟榔、黄曲霉素等。\n\
    4. **饮食过烫**。\n   喝热茶当水温过高，超过 65 度的时候，食管上皮受损，上皮细胞加速分裂，这样食管癌发病风险大大增加。饮食过烫，这也是高危因素。\n\
    5. **不健康的饮食习惯**。\n   医学权威期刊《柳叶刀》（The Lancet）指出，不健康的饮食习惯是全球死亡的首要危险因素。中国因为饮食结构问题造成的心血管疾病死亡率、癌症死亡率都是世界人口前\
    \ 20 的大国中的第一名。包括：钙、膳食纤维、水果和蔬菜摄入不足，红肉、加工肉类摄入过多，高钠饮食、含糖饮料等等。\n6. **肥胖**。\n   不健康的饮食结构和高热量摄入，又会带来肥胖。肥胖会引起糖尿病、心血管疾病，哮喘发病率增高，肥胖还可能与大脑萎缩有关。\n\
    \   肥胖还带来了 13 种癌症的高发。来自华盛顿大学医学院的一项研究指出，引起中青年女性直肠癌、结肠癌发病率上升的一个重要危险因素就是肥胖。只要是 BMI\
    \ 超过 30（BMI 是体重指数，是用体重的公斤数除以身高米数的平方），结、直肠癌风险立刻增加近一倍。所以，肥胖也是多种疾病的高危因素。\n\n这些高危因素中，除了基因没有好办法改变，安吉丽娜·朱莉采取的用手术切除靶器官的做法，目前还有争议。\n\
    \n但是，避免其他的高危因素，也就减少了日积月累的对器官和细胞的损伤，减少了修复和代偿的压力。也就是从源头上，减少了疾病的生成。\n\n所以，针对疾病因果关系链的第一个环节高危因素，我的建议是：\n\
    \n1. **预防或者治疗慢性感染**。\n   比如，通过注射乙肝疫苗，通过阻断传染途径，应用药物抑制乙肝病毒复制等等，就可以在很大程度上避免肝癌的发生。\n\
    \   再比如，注射 HPV 疫苗预防 HPV 感染，如果已经有感染，积极治疗也可以有效预防宫颈癌的发生，等等。\n2. **避免高危行为**。\n   高危行为包括抽烟，过度饮酒、熬夜、过烫饮食、雾霾天不戴口罩、食用可能含有亚硝酸盐或者黄曲霉毒素的食物等等。\n\
    3. **健康饮食**。\n   少吃糖，少吃红肉和加工肉类，少吃盐。多吃膳食纤维多的食物。比如全麦面包、燕麦片等全谷物、杂粮，多吃水果蔬菜，多摄入高 Omega-3\
    \ 脂肪酸的食物，比如某些海产品。\n   尤其是膳食纤维。一项荟萃分析指出，增加膳食纤维有助于降低体重、血糖、血压、血脂，与冠心病、糖尿病和肠癌等多种疾病风险的下降有关。\n\
    \n研究者认为：这是膳食纤维50年研究史上里程碑式的事件。多吃膳食纤维能挽救生命，这应该被载入史册。建议每天摄入至少25-29克或更多的膳食纤维。\n\n\
    这些都是针对第一个环节高危因素，我们可以做的。\n\n有些人有赌博心理，总搬出一些小概率事件，比如“谁又吸烟又喝酒，活了100多岁”“谁天天运动还跑马拉松，结果得了胰腺癌。”\n\
    \n健康生活方式的建议，是循证医学大数据得出的目前可靠的证据，这本身和一些小概率事件是不冲突的。\n\n要有投资意识，为未来储存健康。\n\n### 不破坏修复和代偿能力\n\
    \n接下来，我们说说干预疾病因果关系链条的第二个环节：修复和代偿能力下降。\n\n你一定还记得，咱们在前面讲衰老的课程《第24讲衰老：老不是问题，衰才是关键》时说过，只要生命存在，基因就会不断损伤，我们从出生开始，就迈进了一条永不可能逆转的生命之河。\n\
    \n多细胞生物赖以生存的一个关键机制，就是修复和代偿。\n\n细胞靠加速分裂，补充受损或者死亡的细胞，这是修复。免疫细胞清除“异己”，这也是修复。细胞和器官靠加快工作，替代受损的细胞或者器官执行功能，这是代偿。\n\
    \n修复和代偿是人体针对损伤的一种智慧，这是天然形成的。但是，咱们的很多行为会影响到机体的修复和代偿能力。\n\n比如热量摄入过多、肥胖、熬夜。\n\n德国图宾根大学有一项研究指出，熬夜会破坏肾上腺素等物质分泌的昼夜节律，从而抑制\
    \ T 细胞对侵入人体的病原体，或者肿瘤细胞的粘附能力。因此，T 细胞杀伤“敌人”能力下降，从而影响免疫细胞功能。\n\n所以，针对第二个环节，我的第一个建议：**适度节食**。\n\
    \n节食可以清除衰老细胞、衰老物质，有助于延缓皮肤成纤维细胞老化，产生更多的胶原蛋白和弹性蛋白，保持皮肤弹性，节食还可以延缓心血管老化。这些都是通过增加了修复和代偿的能力实现的。\n\
    \n尤其对于 2 型糖尿病的病人，通过节食和运动减肥，降低体重，在早期甚至可以达到近乎“治愈”的效果。通过饮食管理一年减掉 30 斤，86% 的肥胖 2 型糖尿病患者早期，甚至可以达到停药效果。\n\
    \n动物实验显示，如果小鼠只摄入正常饮食 70% 的热量，而且是一天一次的进食频率的话，不仅可以减肥和预防 2 型糖尿病，平均寿命还要延长 28%。\n\n\
    第二个建议：**尽量保证每天的睡眠在 7-8 小时**。睡眠过多和过少，都会影响健康。\n\n第三个建议：**运动**。\n\n运动首先可以增加能量消耗，减轻慢性炎症反应；其次还有利于衰老物质清除，预防多种癌症和体重增加；最后还可以降低冠心病、高血压、卒中、2\
    \ 型糖尿病、代谢综合征和抑郁症的风险。\n\n有研究指出，与不运动和肥胖群体相比，持续锻炼（相当于每周 > 150 分钟快走）和正常体重的人群，与平均寿命增加\
    \ 7.2 年相关。\n\n这就是针对发病因果关系链条的第二个环节：改善人体的修复和代偿能力。\n\n真正有效的养生项目，都是把健康饮食、节食、运动和社交封装在了文化和哲学包装下，让参与者更有价值感和意义感，但是本质上都是提高人体修复和代偿能力。所以，不要搞混。\n\
    \n### 进行疾病早期筛查\n\n通过上面这些经过科学研究论证过的生活方式调整，可以在很大程度上降低疾病风险。有学者指出，40%的癌症是可以预防的。\n\n\
    但是，即便是避免了高危因素，增加了修复和代偿能力，细胞依然还在分裂，分裂就会带来基因损伤，基因损伤就会带来衰老和疾病，甚至癌症。很多病，我们难以完全预防。\n\
    \n而且多数慢性病尤其是癌症，早期没有症状。\n\n那么，针对疾病因果关系链条的第三个环节疾病隐性期，应该进行疾病的早期筛查，尤其是癌症筛查。科学筛查的意义，毋庸置疑。\n\
    \n比如肺癌。\n\n在以前，没有筛查之前，我国肺癌确诊时有将近 80.0% 的患者已是中晚期，失去了根治性手术治疗的机会，5 年生存率很低，大约在 16.1%。\n\
    \n但是如果早期发现，这个数字就可以提高到至少 70% 以上。\n\n怎么筛查呢？\n\n有四种癌症，具有明确的筛查价值。包括：\n\n1. 早期肺癌——用低剂量肺部\
    \ CT 筛查；\n2. 早期乳腺癌——用乳腺钼靶检查，或者加上超声、核磁共振筛查；\n3. 早期宫颈癌——用宫颈细胞学涂片检查，或者加上 HPV 检测筛查；\n\
    4. 结肠癌和直肠癌——用结肠镜筛查。\n\n开始筛查的年龄以及频率，你可以参考筛查指南（见文末）。\n\n筛查指南的制定具有普适性。但是我认为，对个人而言，开始筛查的年龄以及频率，还是要结合自身情况，最好和医生商量后决定。\n\
    \n就拿早期肺癌的筛查来说，中国低剂量肺部 CT 肺癌筛查指南建议，年龄介于 50 岁-74 岁之间，吸烟，以及已经戒烟但是戒烟时间没超过 5 年的人定期接受检查。\n\
    \n但是近年来，肺癌呈现女性化、年轻化、无吸烟史、腺癌高发等特点。如果严格按照这个年龄标准，会不会遗漏呢？\n\n开始筛查的年龄，应该根据实际的流行病学特点，进行适当调整。\n\
    \n广州医科大学附属医院何建行教授最近发表的一项研究指出，如果筛查年龄提前到 40-45 岁，检出早期肺癌的概率，远大于到了 50 岁时再筛查。\n\n那么这个结果，能不能说明在指南建议的年龄之前开始筛查，可能会让更多早期患者更受益呢？当然了，还需要更多的研究证据来制定肺癌的最佳筛查策略。\n\
    \n但是，我个人认为，对于重度吸烟，或者有肺癌家族史，或者有慢性肺病等等，经济条件又允许的人，肺癌筛查年龄可以提前。\n\n### 划重点\n\n- 多数慢性病出现症状之前的因果关系链条可以概括为：高危因素—修复、代偿能力下降—疾病隐性期。\n\
    - 针对第一个环节：预防或者治疗慢性感染，避免高危行为，健康饮食。\n- 针对第二个环节，可以适度节食，运动。\n- 针对第三个环节，可以进行科学的筛查。\n\
    \n### 指南建议\n\n**乳腺癌筛查指南**\n\n中国抗癌协会乳腺癌专业委员会建议：\n\n| 年龄段 | 建议 |\n| :--- | :---\
    \ |\n| **20~39岁** | 不推荐对该年龄段人群进行乳腺筛查。 |\n| **40~45岁** | 1. 适合机会性筛查。<br>2. 每年 1\
    \ 次乳腺 X 线检查。<br>3. 对致密型乳腺(腺体为 c 型或 d 型)推荐与 B 超检查联合。 |\n| **45~69岁** | 1. 适合机会性筛查和人群普查。<br>2.\
    \ 每 1~2 年 1 次乳腺 X 线检查。<br>3. 对致密型乳腺推荐与 B 超检查联合。 |\n| **70岁或以上** | 1. 适合机会性筛查。<br>2.\
    \ 每 2 年 1 次乳腺 X 线检查。 |\n\n**乳腺癌高危人群筛查意见**\n\n建议对乳腺癌高危人群提前进行筛查[小于 40 岁]，筛查同期推荐每年\
    \ 1 次，筛查手段除了应用一般人群乳腺 X 线检查之外，还可以应用 MRI 等新的影像学手段。\n\n**乳腺癌高危人群的定义**\n\n- 有明显的乳腺癌遗传倾向者。\n\
    - 既往有乳腺导管或小叶不典型增生或小叶原位癌 (lobular carcinoma in situ，LCIS) 的患者。\n- 既往行胸部放疗。\n\n\
    **肺癌**\n\n参加年度性 LDCT 筛查的个体为年龄介于 50 岁-74 岁之间的吸烟者，至少有 20 包/年吸烟史，如已经戒烟则戒烟时间不得超过 5\
    \ 年。\n\n如果某些高发地区有其他重要的肺癌危险因素也可作为筛选高危人群的条件，如宣称无通风或通风较差室内燃煤年数≥15 年；个旧项目有 10 年或更长的坑下作业或冶炼史。\n\
    \n近 5 年有癌症病史（非黑色素性皮肤癌、宫颈原位癌、局限性前列腺癌除外）、不能耐受可能的肺癌切除手术或有严重影响生命疾病的个体则不建议进行 LDCT 筛查。\n\
    \n检查措施：低剂量螺旋 CT。\n\n**肝癌**\n\n具有乙型肝炎病毒（HBV）和/或丙型肝炎病毒（HCV）感染、长期酗酒、非酒精脂肪性肝炎、食用被黄曲霉毒素污染食物、各种原因引起的肝硬化、以及有肝癌家族史等的人群，尤其是年龄\
    \ 40 岁以上的男性风险更大。\n\n检查措施：血清甲胎蛋白（AFP）和肝脏超声检查。\n\n具体建议：建议上述高危人群每隔 6 个月进行至少一次检查。\n\
    \n**胃癌**\n\n年龄≥40 岁，且符合下列任意一条者，建议其作为胃癌筛查对象人群：\n\n1. 胃癌高发地区人群；\n"
  mdcn: "\n## 46 | 精进第三关：克服不理性的冲动\n\n2019-4-13\n\n你好，欢迎来到《医学通识 50 讲》，我是薄世宁。\n\n不理性是人类固有的本质之一，医生同样如此。\n\
    \n3 年前，我遇到一个病例。\n\n病人是一个 30 岁的青年男性。高烧后出现全身器官衰竭，尤其是肾衰竭，一滴尿都没有。\n\n所以，需要立刻给他做床旁的血液净化，净化之前要穿刺，也就是在腿上的大血管里放一根导管，这样才能把血引出来。\n\
    \n我给他消毒、铺巾、注射麻药。一切都很正常。\n\n但是，这个时候出现了一个反常现象。\n\n打麻药的时候，尽管针头很细，但是血立刻从这个小针眼里快速地涌了出来，一滴一滴地落在无菌单上，就像断了线的珠子。\n\
    \n这就怪了，病人的血小板数量是在正常范围内。而且损伤的只有皮肤内的小血管，为什么出血这么快呢？\n\n根据这个点，我已经有了一个大概判断。然后，全院专家会诊。\n\
    \n专家们给了各种详细、中肯的建议，提出了进一步检查的意见。轮到我发言的时候，我说这个病人多半是流行性出血热。\n\n我解释一下，流行性出血热是一种病毒感染，主要是通过鼠类传染。\n\
    \n现在的卫生条件越来越好，在大城市，这种病已经非常少见了。所以大家都不同意我的观点，但我还是坚持给他抽血查抗体，如果抗体增高就可以确诊。\n\n第二天，科主任给我打电话，听得出她特别高兴，她说：“薄大夫你太神了，化验结果出来了，这个病人就是流行性出血热。”\n\
    \n你会不会也觉得我很神呢？\n\n其实，真的不是我神。因为出血速度非常快的那个反常点，我以前见过。\n\n20 年前，我遇到过同一个同样的病例。不同的是，那一次我误诊了。那个病人差点因为我的错误造成巨大的伤害。\n\
    \n### 不理性状态下的窄化效应\n\n20 年前，我还在另外一家医院当住院医师，也就是级别最低的医生。\n\n有一天我收了一个病人。20 岁，男性，高烧三天后浮肿，肌酐\
    \ 1000 多，超过了正常值的十几倍。这说明他已经到了严重的肾功能衰竭期，我立刻给他下了病危通知。\n\n这个男生在天津读工科，我见到他的时候，这个男生长满了胡子，但是长相英俊。他无力地躺在床上，眼睛肿得张不开。透过他微弱的眼神，我能感受到他强烈的求生欲。\n\
    \n我立刻诊断他是急进性肾炎。\n\n这种病和你听过的急性肾炎不同，急性肾炎多数是儿童发病，可以自愈。但是急进性肾炎，是青年和中年发病。\n\n别看只有一个字的差别，病理不同，结局也不同。如果治疗不及时，90%以上的急进性肾炎病人，会在\
    \ 6 个月内死亡或依赖透析生存。我和他说到这个诊断的时候，他吓哭了。他说：“你救救我。”\n\n我太想给他治好了。\n\n尽管别的医生说，先观察一下，但我还是缠着上级医生，坚持给他注射三天激素。\n\
    \n注射激素后的第二天，他的肌酐从 1000 多下降到 600，我觉得我做对了，但是事实很快就打破了我的幻想。不到一天的时间，他的肌酐值快速反弹，又升高到了\
    \ 1000。\n\n我几乎绝望了，这个孩子没救了。\n\n第三天，我们紧急请了中国著名的肾脏内科教授会诊。我汇报病例，教授认真看完了病例又去看病人。\n\n\
    然后他沉思了一会说：\"薄医生，你的诊断和治疗都是错的。\"\n\n为什么呢？\n\n他继续说：\"你只想到了急性肾炎这一个诊断，但是有两个细节你忽略了：第一，病人的出血速度明显加快。第二，我去看病人的时候，看到他的尿里面有一层漂浮物。所以，我认为这个病人应该是流行性出血热。\"\
    \n\n这个时候我突然就想起来，这两个细节我都见到了。\n\n我给这个男生刮胡子的时候，他脸上擦破了一点皮，瞬间就流血不止。你还记得我是怎么描述上一个病例的出血吗？对，就像断了线的珠子一样，两个病例几乎一模一样。\n\
    \n他的父亲曾经拿着留尿的瓶子让我看，他的尿里面有一层像海草一样的漂浮物，我也是见到了的。\n\n但是，我只是一味地关注了急性肾炎这一个诊断，把这两个关键点都错过了。\n\
    \n教授继续说：\"马上停止你的治疗，如果继续再用大剂量激素，这个病人很可能会消化道大出血。抓紧透析，用上抗病毒药，这个病人可以治愈。\"\n\n后来的化验证实了他的判断。根据他的治疗方案，这个病人很快就痊愈出院了，万幸的是没有留下一点儿后遗症。我差点就给病人造成不可挽回的伤害。\n\
    \n我相信在平时，以我的知识范围和能力，遗漏这么关键的两个点，可能性很小。\n\n那你会问了，你每天见这么多的重病人，为什么这个病例让你这么不理性呢？\n\n\
    我告诉你，这个病人是我的亲弟弟。\n\n情感太强烈的时候，就会让不理性控制我的判断。所以，我眼睁睁地看着这些关键证据，置若罔闻。\n\n直到今天，这个病例都在反复提醒我：\n\
    \n- 不理性会带来窄化效应，窄化效应就会让医生过度关注某一诊断，忽略了其他的线索。\n- 不理性会让医生过度关注疾病最坏的结局，而忽视了疾病发展规律，变得激进和冒险。\n\
    \n我弟弟差点因为大剂量的激素冲击，引起可能的消化道大出血。\n\n临床工作中，会有很多因素干扰医生的思维。比如：\n\n- 有的时候是朋友住院，他不想按照常规流程做必要的检查，想立刻手术；\n\
    - 有的时候是领导发话，必须要达到一个什么样的治疗效果；\n- 有的时候治疗的是社会热点人物，社会舆论会放大宣传。\n\n无论遇到什么样的情况，一个医生必须克服这些干扰因素理性行事。即使是面对让你憎恨的病人，比如是曾经危害过社会的罪犯，比如无理取闹的病人，甚至是伤害过你的人。\n\
    \n美剧《豪斯医生》里就有个病人在治疗的时候精神失常了，他一把抓住了手术刀，扎穿了豪斯医生同事的腹部，这个医生面临下肢截瘫的危险。\n\n尽管其他医生都恨这个病人，但是豪斯医生仍然克服了偏见，最终为病人找到了正确的诊断和治疗方案。\n\
    \n### 一流智慧的标志\n\n但是毫无疑问，非理性和理性是人本质里固有的两个面。\n\n美国自由撰稿人朱莉娅·加莱夫（Julia Galef）在她的 TED\
    \ 演讲中提到，在决策时人的思维会有两种模式，第一种叫做“士兵思维”，第二种叫做“侦察兵思维”。\n\n士兵和侦察兵角色不同，所以思维逻辑也就不同。医生的思维同样符合这两个思维模式。\n\
    \n士兵主要负责攻击，他的任务是生存和出击。所以他所做的就是保护战友，快速歼灭敌人。\n\n医生的“士兵思维”，就是把所有符合他直觉的诊断信息，当成自己的战友保护起来，把不符合他判断的信息当成敌人，过滤掉，消灭掉。\n\
    \n但是侦察兵不同，他负责观察形势，他的任务是尽可能看清楚地形地貌，了解敌人的兵力部署，也就是了解全局后汇报给司令部，再做下一步计划。\n\n所以，医生的“侦察兵思维”就是能够摒除内心的歧视、偏见和强烈的倾向，尽可能客观地找出所有有价值的证据。\n\
    \n但是你必须知道，一个具有战斗力的团队，士兵和侦察兵都是不可缺少的。人的理性思维和非理性思维也是共存的。理性和非理性本来就不是一个是与非的关系，而是相互转换，配合应用的过程。\n\
    \n可能你以为医生最好抛弃不理性，只留下理性思维。但是我要说，没有情感的医学是黑白的世界。\n\n理性让医生在关键时刻正确判断、正确行事，但情感才让医学有了温度。\n\
    \n一个医生同时具备理性和不理性思维，还能正确转换，这虽然是最难的一关，但是闯过了，才能更好地服务于病人。\n\n上周，病房里抢救一个大面积软组织感染，感染性休克的病人，虽然我们用了各种各样的手段，但是，最终病人还是离开了。\n\
    \n当我拖着疲惫的身子沮丧地往办公室走的时候，听到后楼道呜呜的哭声。\n\n谁在哭呢？\n\n我走过去，看到我们外科刚毕业的一个1米8几的男博士在哭，我说：“哭啥啊你？”\n\
    \n他说：“我管了她7天，但还是没成功。我觉得对不起病人。”\n\n我拍了拍他，我心想哭吧，一个医生的精进之路又开始了。\n\n### 划重点\n\n- 情感过于强烈会带来不理性。\n\
    - 不理性在医疗过程中会引起思维窄化。\n- 正确转换理性思维和不理性思维，是医生要过的第三关。\n\n### 下节预告\n\n下节课，我们进入新的一章，讲讲普通人如何获得最大程度的医学帮助。\n\
    \n## 47 ｜ 健康的智慧：把自己挡在去医院的路上\n\n2019-4-14\n\n你好，欢迎来到《医学通识 50 讲》。我是薄世宁。\n\n在上一章，我们讲了医生的精进。医生要闯过无数关卡，经过系统的思维训练和实践，才能更好地为病人服务。\n\
    \n今天进入新的章节：健康的修炼。\n\n说说怎么聪明地管理健康；在疾病面前，怎么科学决策；怎样理性地面对生命终点。\n\n没人想去医院，但是谁也离不了医院。如何阻断去医院这条路，让咱们尽可能推迟去医院的时间呢？这就是这节课要说的：健康的智慧。\n\
    \n疾病不是突然发生的，而是突然发现的。生活中的细枝末节，可能也就决定了何时去医院。只要干预这些细节，那就一定可以在某种程度上把自己挡在去医院的路上。\n\n\
    这就好比是，尽管很多病确切的因果关系我们还没有完全掌握，但是只要打断疾病因果关系链条中的某个环节，那么同样可以预防疾病。\n\n多数慢性病出现症状前的因果关系链条概括为：高危因素—修复、代偿能力下降—疾病隐性期。\n\
    \n接下来，我就从疾病发作之前的这三个关键环节出发，分为三个层面，讲讲如何科学管理健康。\n\n### 避免高危因素\n\n什么是高危因素呢？就是目前已知的，对于疾病的生成和发展具有高度相关性的某些因素。\n\
    \n1. **基因**。\n   美国著名影星安吉丽娜·朱莉，携带一种叫做 BRCA1 的基因，她患乳腺癌、卵巢癌的几率大大增加。这种基因就是高危因素。\n\
    2. **慢性病毒或者细菌感染**。\n   乙肝病毒感染可以引起肝炎，之后引起肝硬化、肝癌。\n3. **一级致癌物**。\n   比如，雾霾、亚硝酸盐、槟榔、黄曲霉素等。\n\
    4. **饮食过烫**。\n   喝热茶当水温过高，超过 65 度的时候，食管上皮受损，上皮细胞加速分裂，这样食管癌发病风险大大增加。饮食过烫，这也是高危因素。\n\
    5. **不健康的饮食习惯**。\n   医学权威期刊《柳叶刀》（The Lancet）指出，不健康的饮食习惯是全球死亡的首要危险因素。中国因为饮食结构问题造成的心血管疾病死亡率、癌症死亡率都是世界人口前\
    \ 20 的大国中的第一名。包括：钙、膳食纤维、水果和蔬菜摄入不足，红肉、加工肉类摄入过多，高钠饮食、含糖饮料等等。\n6. **肥胖**。\n   不健康的饮食结构和高热量摄入，又会带来肥胖。肥胖会引起糖尿病、心血管疾病，哮喘发病率增高，肥胖还可能与大脑萎缩有关。\n\
    \   肥胖还带来了 13 种癌症的高发。来自华盛顿大学医学院的一项研究指出，引起中青年女性直肠癌、结肠癌发病率上升的一个重要危险因素就是肥胖。只要是 BMI\
    \ 超过 30（BMI 是体重指数，是用体重的公斤数除以身高米数的平方），结、直肠癌风险立刻增加近一倍。所以，肥胖也是多种疾病的高危因素。\n\n这些高危因素中，除了基因没有好办法改变，安吉丽娜·朱莉采取的用手术切除靶器官的做法，目前还有争议。\n\
    \n但是，避免其他的高危因素，也就减少了日积月累的对器官和细胞的损伤，减少了修复和代偿的压力。也就是从源头上，减少了疾病的生成。\n\n所以，针对疾病因果关系链的第一个环节高危因素，我的建议是：\n\
    \n1. **预防或者治疗慢性感染**。\n   比如，通过注射乙肝疫苗，通过阻断传染途径，应用药物抑制乙肝病毒复制等等，就可以在很大程度上避免肝癌的发生。\n\
    \   再比如，注射 HPV 疫苗预防 HPV 感染，如果已经有感染，积极治疗也可以有效预防宫颈癌的发生，等等。\n2. **避免高危行为**。\n   高危行为包括抽烟，过度饮酒、熬夜、过烫饮食、雾霾天不戴口罩、食用可能含有亚硝酸盐或者黄曲霉毒素的食物等等。\n\
    3. **健康饮食**。\n   少吃糖，少吃红肉和加工肉类，少吃盐。多吃膳食纤维多的食物。比如全麦面包、燕麦片等全谷物、杂粮，多吃水果蔬菜，多摄入高 Omega-3\
    \ 脂肪酸的食物，比如某些海产品。\n   尤其是膳食纤维。一项荟萃分析指出，增加膳食纤维有助于降低体重、血糖、血压、血脂，与冠心病、糖尿病和肠癌等多种疾病风险的下降有关。\n\
    \n研究者认为：这是膳食纤维50年研究史上里程碑式的事件。多吃膳食纤维能挽救生命，这应该被载入史册。建议每天摄入至少25-29克或更多的膳食纤维。\n\n\
    这些都是针对第一个环节高危因素，我们可以做的。\n\n有些人有赌博心理，总搬出一些小概率事件，比如“谁又吸烟又喝酒，活了100多岁”“谁天天运动还跑马拉松，结果得了胰腺癌。”\n\
    \n健康生活方式的建议，是循证医学大数据得出的目前可靠的证据，这本身和一些小概率事件是不冲突的。\n\n要有投资意识，为未来储存健康。\n\n### 不破坏修复和代偿能力\n\
    \n接下来，我们说说干预疾病因果关系链条的第二个环节：修复和代偿能力下降。\n\n你一定还记得，咱们在前面讲衰老的课程《第24讲衰老：老不是问题，衰才是关键》时说过，只要生命存在，基因就会不断损伤，我们从出生开始，就迈进了一条永不可能逆转的生命之河。\n\
    \n多细胞生物赖以生存的一个关键机制，就是修复和代偿。\n\n细胞靠加速分裂，补充受损或者死亡的细胞，这是修复。免疫细胞清除“异己”，这也是修复。细胞和器官靠加快工作，替代受损的细胞或者器官执行功能，这是代偿。\n\
    \n修复和代偿是人体针对损伤的一种智慧，这是天然形成的。但是，咱们的很多行为会影响到机体的修复和代偿能力。\n\n比如热量摄入过多、肥胖、熬夜。\n\n德国图宾根大学有一项研究指出，熬夜会破坏肾上腺素等物质分泌的昼夜节律，从而抑制\
    \ T 细胞对侵入人体的病原体，或者肿瘤细胞的粘附能力。因此，T 细胞杀伤“敌人”能力下降，从而影响免疫细胞功能。\n\n所以，针对第二个环节，我的第一个建议：**适度节食**。\n\
    \n节食可以清除衰老细胞、衰老物质，有助于延缓皮肤成纤维细胞老化，产生更多的胶原蛋白和弹性蛋白，保持皮肤弹性，节食还可以延缓心血管老化。这些都是通过增加了修复和代偿的能力实现的。\n\
    \n尤其对于 2 型糖尿病的病人，通过节食和运动减肥，降低体重，在早期甚至可以达到近乎“治愈”的效果。通过饮食管理一年减掉 30 斤，86% 的肥胖 2 型糖尿病患者早期，甚至可以达到停药效果。\n\
    \n动物实验显示，如果小鼠只摄入正常饮食 70% 的热量，而且是一天一次的进食频率的话，不仅可以减肥和预防 2 型糖尿病，平均寿命还要延长 28%。\n\n\
    第二个建议：**尽量保证每天的睡眠在 7-8 小时**。睡眠过多和过少，都会影响健康。\n\n第三个建议：**运动**。\n\n运动首先可以增加能量消耗，减轻慢性炎症反应；其次还有利于衰老物质清除，预防多种癌症和体重增加；最后还可以降低冠心病、高血压、卒中、2\
    \ 型糖尿病、代谢综合征和抑郁症的风险。\n\n有研究指出，与不运动和肥胖群体相比，持续锻炼（相当于每周 > 150 分钟快走）和正常体重的人群，与平均寿命增加\
    \ 7.2 年相关。\n\n这就是针对发病因果关系链条的第二个环节：改善人体的修复和代偿能力。\n\n真正有效的养生项目，都是把健康饮食、节食、运动和社交封装在了文化和哲学包装下，让参与者更有价值感和意义感，但是本质上都是提高人体修复和代偿能力。所以，不要搞混。\n\
    \n### 进行疾病早期筛查\n\n通过上面这些经过科学研究论证过的生活方式调整，可以在很大程度上降低疾病风险。有学者指出，40%的癌症是可以预防的。\n\n\
    但是，即便是避免了高危因素，增加了修复和代偿能力，细胞依然还在分裂，分裂就会带来基因损伤，基因损伤就会带来衰老和疾病，甚至癌症。很多病，我们难以完全预防。\n\
    \n而且多数慢性病尤其是癌症，早期没有症状。\n\n那么，针对疾病因果关系链条的第三个环节疾病隐性期，应该进行疾病的早期筛查，尤其是癌症筛查。科学筛查的意义，毋庸置疑。\n\
    \n比如肺癌。\n\n在以前，没有筛查之前，我国肺癌确诊时有将近 80.0% 的患者已是中晚期，失去了根治性手术治疗的机会，5 年生存率很低，大约在 16.1%。\n\
    \n但是如果早期发现，这个数字就可以提高到至少 70% 以上。\n\n怎么筛查呢？\n\n有四种癌症，具有明确的筛查价值。包括：\n\n1. 早期肺癌——用低剂量肺部\
    \ CT 筛查；\n2. 早期乳腺癌——用乳腺钼靶检查，或者加上超声、核磁共振筛查；\n3. 早期宫颈癌——用宫颈细胞学涂片检查，或者加上 HPV 检测筛查；\n\
    4. 结肠癌和直肠癌——用结肠镜筛查。\n\n开始筛查的年龄以及频率，你可以参考筛查指南（见文末）。\n\n筛查指南的制定具有普适性。但是我认为，对个人而言，开始筛查的年龄以及频率，还是要结合自身情况，最好和医生商量后决定。\n\
    \n就拿早期肺癌的筛查来说，中国低剂量肺部 CT 肺癌筛查指南建议，年龄介于 50 岁-74 岁之间，吸烟，以及已经戒烟但是戒烟时间没超过 5 年的人定期接受检查。\n\
    \n但是近年来，肺癌呈现女性化、年轻化、无吸烟史、腺癌高发等特点。如果严格按照这个年龄标准，会不会遗漏呢？\n\n开始筛查的年龄，应该根据实际的流行病学特点，进行适当调整。\n\
    \n广州医科大学附属医院何建行教授最近发表的一项研究指出，如果筛查年龄提前到 40-45 岁，检出早期肺癌的概率，远大于到了 50 岁时再筛查。\n\n那么这个结果，能不能说明在指南建议的年龄之前开始筛查，可能会让更多早期患者更受益呢？当然了，还需要更多的研究证据来制定肺癌的最佳筛查策略。\n\
    \n但是，我个人认为，对于重度吸烟，或者有肺癌家族史，或者有慢性肺病等等，经济条件又允许的人，肺癌筛查年龄可以提前。\n\n### 划重点\n\n- 多数慢性病出现症状之前的因果关系链条可以概括为：高危因素—修复、代偿能力下降—疾病隐性期。\n\
    - 针对第一个环节：预防或者治疗慢性感染，避免高危行为，健康饮食。\n- 针对第二个环节，可以适度节食，运动。\n- 针对第三个环节，可以进行科学的筛查。\n\
    \n### 指南建议\n\n**乳腺癌筛查指南**\n\n中国抗癌协会乳腺癌专业委员会建议：\n\n| 年龄段 | 建议 |\n| :--- | :---\
    \ |\n| **20~39岁** | 不推荐对该年龄段人群进行乳腺筛查。 |\n| **40~45岁** | 1. 适合机会性筛查。<br>2. 每年 1\
    \ 次乳腺 X 线检查。<br>3. 对致密型乳腺(腺体为 c 型或 d 型)推荐与 B 超检查联合。 |\n| **45~69岁** | 1. 适合机会性筛查和人群普查。<br>2.\
    \ 每 1~2 年 1 次乳腺 X 线检查。<br>3. 对致密型乳腺推荐与 B 超检查联合。 |\n| **70岁或以上** | 1. 适合机会性筛查。<br>2.\
    \ 每 2 年 1 次乳腺 X 线检查。 |\n\n**乳腺癌高危人群筛查意见**\n\n建议对乳腺癌高危人群提前进行筛查[小于 40 岁]，筛查同期推荐每年\
    \ 1 次，筛查手段除了应用一般人群乳腺 X 线检查之外，还可以应用 MRI 等新的影像学手段。\n\n**乳腺癌高危人群的定义**\n\n- 有明显的乳腺癌遗传倾向者。\n\
    - 既往有乳腺导管或小叶不典型增生或小叶原位癌 (lobular carcinoma in situ，LCIS) 的患者。\n- 既往行胸部放疗。\n\n\
    **肺癌**\n\n参加年度性 LDCT 筛查的个体为年龄介于 50 岁-74 岁之间的吸烟者，至少有 20 包/年吸烟史，如已经戒烟则戒烟时间不得超过 5\
    \ 年。\n\n如果某些高发地区有其他重要的肺癌危险因素也可作为筛选高危人群的条件，如宣称无通风或通风较差室内燃煤年数≥15 年；个旧项目有 10 年或更长的坑下作业或冶炼史。\n\
    \n近 5 年有癌症病史（非黑色素性皮肤癌、宫颈原位癌、局限性前列腺癌除外）、不能耐受可能的肺癌切除手术或有严重影响生命疾病的个体则不建议进行 LDCT 筛查。\n\
    \n检查措施：低剂量螺旋 CT。\n\n**肝癌**\n\n具有乙型肝炎病毒（HBV）和/或丙型肝炎病毒（HCV）感染、长期酗酒、非酒精脂肪性肝炎、食用被黄曲霉毒素污染食物、各种原因引起的肝硬化、以及有肝癌家族史等的人群，尤其是年龄\
    \ 40 岁以上的男性风险更大。\n\n检查措施：血清甲胎蛋白（AFP）和肝脏超声检查。\n\n具体建议：建议上述高危人群每隔 6 个月进行至少一次检查。\n\
    \n**胃癌**\n\n年龄≥40 岁，且符合下列任意一条者，建议其作为胃癌筛查对象人群：\n\n1. 胃癌高发地区人群；\n"
