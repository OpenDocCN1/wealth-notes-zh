    薄医生站在屏幕前，屏幕上显示的是一位 105 岁病人的基因图谱。薄医生每天的工作就是研究这些图谱，然后用算法匹配数据。


    意思是，你身上的基因突变对你来说是致病基因，但是，这段基因如果拿到别人身上，就可能成为能够治疗病的基因。


    薄医生一直在说，任何一项基因突变都有价值，都不是凭空产生的，一定可以找到这段基因突变适合的人群，用于治病。所以，他的主要工作就是基因互换。而网络和万物互联，给基因互换提供了可能。


    2069 年，医生就是可以利用世界人群基因数据和算法的人。


    这个病人的基因图谱上，显示了一种叫做 ATSNT2068 的基因片段。薄医生沉思了一下，他不用问，就知道这个人最近一定是刚从火星上回来，火星上特殊的矿物质辐射出的射线，可以让正常人的基因发生突变。突变后就是这段
    ATSNT2068。


    去年，也就是 2068 年，薄医生靠着一项名为《星际旅行人群新发基因突变在万物互联背景下的意义》的研究，顺利地通过了博士后后的答辩。答辩成绩非常好，医生还是
    50 年前那样，是个终身学习的行业。


    在这个研究中，薄医生团队第一次发现了 3266 名星际旅行的人群中出现的某种突变，也就是 ATSNT2068 基因，这种突变可以引起病人思维奔逸和失眠。


    但是，如果把这段基因移植给阿尔茨海默症病人的脑细胞里，就可以治愈阿尔茨海默症。这就是基因互换带来的巨大收益。


    太好了，薄医生马上联系了一位阿尔茨海默症的病人。


    他对病人说：“现在已经为您找到了一个合适的基因突变片段，如果能够将这段基因移植到您的大脑细胞里，那么就可以治愈您的阿尔茨海默症了。而您的阿尔茨海默症基因，移植给这位刚星际旅行回来的失眠的人，他的失眠也可以治好。”


    同时，告诉你俩一个好消，你们身上的基因传感器会把数据传给保险中心，更新了这段基因，明年保费就可以下调 20%了。”


    两位病人，同时发出了惬意的笑声。


    ## 医学在继承与叛逆中成长


    听起来是不是很科幻呢？


    但是也许不用等 50 年，这个场景就可以实现。因为这个场景，是我大胆猜想的未来医学的 3 个发展方向：


    - 1. 数据和算法。医生必须不断地积累数据，掌握算法才可以掌握未来的医学发展。

    - 2. 万物互联，网络互助。世界上每一个人都构成了网络中的节点，世界上的健康数据联系在了一起。

    - 3. 基因移植技术。充分利用自然界带来的基因突变的优，将突变基因用于治疗疾病。


    当然了，还有个更大的可能是，我的这些猜测全部都是错的。因为这些畅想还是来源于今天医学发展的现状和今天对于疾病的理解。


    医学是一个不断继承与叛逆的过程，它不会完全按着咱们的思维和逻辑发展。


    陈方正先生的著作《继承与叛逆》中有段话，我第一次读到的时候，就被震撼到了：


    > 在今日，牛顿理所当然地被视为17世纪科学革命主将和现代科学开创者，科学与宗教之分道扬镳，上帝之被槟除于自然哲学以外，都是从《原理》开始。这恐怕是牛顿自己最意料不到，也最不愿意见到的结果，因为他是以古代伟大的传统的继承者、复兴者自居，而从来没有想到自己实际上会成为叛逆者。


    我解释一下，《原理》说的是牛顿1687年完成的《自然哲学的数学原理》。


    牛顿坚信宗教，但是，牛顿对于这种信仰的继承和复兴，在他对“上帝”的思考求证过程中，反而带来了叛逆和发展。


    牛顿发现了万有引力定律，发明了微积分；他将数学导入科学，使物理、化学成为更精确的学科；还有他的力学三定律，奠定了数学在研究宇宙运动中的基础地位。


    尤其是《原理》的发表，更是成为对他信仰的一种叛逆。


    陈方正先生说这是科学。他的意思是，继承是在原有的理论基础上的发展，是在已知的延长线上进展。但是最后，却带来了终极理念的颠覆，这是个很深刻的道理。


    但我认为，这同样是在说医学。医学永远都在继承与叛逆中成长。


    比如，希波克拉底把医学从神鬼的桎梏中解救出来，创立了四体液学说。之后的医生们就承信这一理论，并且在这一理论的指导下验证、实践。


    走着走着，人们就发现了这一理论体系的巨大漏洞和错误。最后，随着人体解剖学、生理学、病理学的出现，现代医学彻底摒弃了四体液学说，这是医学历史上的继承与叛逆。


    今天咱们所有能够看到的理论或者技术，在未来，随着继承也必将发生叛逆。只是，我猜不到未来会是怎样。


    你可能会说，人工智能带来的将是叛逆。


    今天的人工智能和手术机器人都是给医生赋能，无论这种机器人多么高级，无论它可以把手术视野放大多少倍，可以做到多么精细，可以抓起比医生的手小得多的器械，但是本质上都是充当了外科医生的手和眼睛。这是继承。


    实际上在很多方面，人工智能和机器人的能力超越了医生。比如沃森机器人（IBM Watson Health）可以在 17 秒内阅读 3469 本医学专著、25
    万篇论文。但是，这还是对医学数据的学习，这还是继承。


    甚至，2012 年，沃森机器人通过了美国执业医师资格考试（USMLE）。2017 年，中国研发的一款机器人，高分通过了中国执业医师资格考试。


    但是，这依然是继承。


    因为，人工智能和机器人只知道怎么做，却永远不知道为什么这么做。而人类在不断地研究为什么。


    所以，未来发生叛逆的领域一定不在人工智能领域。人工智能和机器人可以成为医生并肩作战的战友，但是永远不可能取代医生。


    因为，只有人是掌握算法的人。


    那叛逆会来自人工器官吗？叛逆会来自 3D 打印吗？叛逆会来自免疫疗法吗？


    也请你帮我想一想：未来，在医学领域将要发生的叛逆，会是什么？


    无论是你想到的，还是你想不到的，在未来的未来也必将被颠覆。但是，以下 3 点永远不会变：


    - 1. 医学永远是为人服务的，这一终极目标永存。

    - 2. 医学研究的方法，永远建立在科学的基础上，科学方法永存。

    - 3. 医学带给咱们的希望永存。


    我非常喜欢《流浪地球》这部电影，地球将要突破木星的刚体洛希极限，进入无法逆转的解体过程。


    无论最终结果会将人类历史导向何处，我们决定，选择希望。因为，希望是像钻石一样很贵的东西，希望是我们唯一回家的方向。


    医学让科幻照进现实，回首往昔，展望未来，它永远在继承和叛逆中发展，永远带给我们希望。


    我是薄世宁，感谢来到《医学通识 50 讲》，感谢在医学殿堂里和你一起度过的 50 天，最后也祝愿这 50 讲可以让你、你的家人、你的朋友更健康。

