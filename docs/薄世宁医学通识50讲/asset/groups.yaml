    # 09｜代偿：疾病不是突然发生的，而是突然发现的


    2019-3-7


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    上节课，咱们说了要区别对待病和症状，因为大多数症状是提醒和自我保护。


    但是很多病没有症状，一旦发现就是中晚期，这又是怎么回事呢？


    这节课，我会讲一个重要的机制来解释有病却没症状的原因，以及如何巧妙地利用这个机制对抗疾病。


    先从一个多发病——胃癌的发生和发展讲起。


    幽门螺旋杆菌与胃病、胃癌


    很多胃癌的病人早期没有明显症状。


    以前，医生也不知道胃癌的确切原因。当时的主流观点认为，胃病是由刺激性食物、胃酸过多或者压力过大引起的。


    但是后来发现，人们即使避免了这些因素，胃癌的发病率依然很高。


    到了1981年，澳大利亚有两位医生马歇尔（Barry J. Marshall）和沃伦（Robin Warren）提出，胃里有种细菌叫做幽门螺旋杆菌，可能和胃病、胃癌有关系。


    这种细菌你肯定听说过，可能还检查过。这种细菌有多厉害呢？


    铁块几进到人的胃里都能被腐蚀掉，所有的细菌遇到强酸都得死，唯独幽门螺旋杆菌例外。它可以在pH值低到2.0的胃酸里活得逍遥自在。


    但是，幽门螺旋杆菌可以导致胃病这个观点刚一提出来，就立刻遭到医学界同行的攻击。当时的医生都不相信这么酸的胃里会有细菌。'
  - '[PAGE 69]


    为了证明自己的观点，马歇尔医生竟然喝了一瓶幽门螺旋杆菌，结果他真的得了胃炎。


    这样一来，越来越多的医生就相信了，确实就有这么一种细菌能在强酸里生存。


    到了 1994 年，持续的幽门螺旋杆菌感染可以导致胃癌这个观点才得到公认，世界卫生组织把这种细菌列为一级致癌物。


    一级致癌物指的是有明确证据表明可以致癌的物质，比如雾霾、烟草、槟榔、黄曲霉素等等。


    到了 2005 年，这两位医生获得了诺贝尔生理学或医学奖。他们的获奖理由是：幽门螺旋杆菌的发现，加深了人们对慢性感染、炎症和癌症之间关系的认识。


    2014 年在日本京都，全世界的医学专家达成共识：根除幽门螺旋杆菌感染，是预防胃癌的首要手段。


    为什么要讲这个病例呢？


    +   1. 从这种慢性的、持续的，甚至没有症状的细菌感染发展成胃癌，经历了一个非常漫长的过程。


    所有严重的慢性疾病都不是突然发生的，而是突然发现的。


    +   2. 掌握了这个慢性过程的具体环节，预防和治疗就有了依据。


    其实，所有的慢病都是如此。


    比如结肠癌，从一个良性的腺瘤逐步演变成恶性肿瘤，通常需要 15 年。


    女性持续的高危型 HPV 感染到发生宫颈癌，一般需要大约十几年（高危型，就是最容易引起宫颈癌的病毒类型）。'
  - '[PAGE 70]


    还有，中国人死亡原因第一的心脑血管病，也是从青壮年开始，血管上就开始出现斑块，经过 20-30 年的进展，血管逐步狭窄。当狭窄超过一定范围，才会出现心脏病或脑血管病的症状。


    当然，这些时间、数字因人而异。


    列举这些数字，是为了说明这种无症状的进展是多么漫长。但是，一旦出现症状，多数都是中晚期。


    代偿是慢病进展过程中人体的妥协


    我经常遇到晚期才来看病的病人。


    比如肠癌。肿瘤已经长到把肠子都堵住了、梗阻了或者已经发生了远处转移，病人才到医院。


    再比如，病人剧烈胸痛。做心电图、查心肌酶，发现已经是心肌梗死了。


    这个时候再问病人：怎么这么晚才来看病呢？


    很多人的回答都是：我平时很好，没一点儿感觉，为什么这个病突然找我呢？


    刚才咱们已经了解到，任何慢性病都不是突然发生的，而是突然发现的。


    那你可能会问：这些病能在体内藏这么久，我们却感觉不到，是敌人太狡猾了？还是人体太麻木了？


    都不是。


    之所以人体能够在疾病状态下，十几年甚至几十年都不出现明显的症状，是因为人体有一种代偿机制。


    这节课的重点就是两个字：代偿。'
  - '[PAGE 71]


    什么是代偿呢？就是代替、补偿。


    身体某些组织或者器官持续受损，已经没办法修复原样了，人体就调动没有受损的部分，加快补充或者代替受损的部分完成工作。


    上课课讲过，症状是人类进化带来的一种智慧，代偿就是进化的另一种智慧。


    举个例子。


    刚才咱们提到的幽门螺旋杆菌会持续攻击胃的细胞，引起胃炎，细胞就会死亡。


    这个时候，人体就会启动代偿机制，让深层的干细胞加速分裂，赶紧补充死亡的细胞。这样就防止发生严重的穿孔、出血。


    所以，人体的代偿能够让器官在持续损伤的状态下，基本上能够满足功能，也就是凑合着用，所以才不会出现明显的症状。


    只有到了疾病晚期，代偿不动或者超过极限了，症状才会出现。


    代偿是人体不得已而为之的机制，是妥协。


    代偿的最终目的是保证器官的基本功能，也就是为了保命。


    所有的慢性病，人体都会启动代偿。


    比如高血压。


    血压持续增高，心脏射血的负担就会增加。所以，心肌就会变得肥厚，射血才更有劲。这是代偿。


    再比如，治疗癫痫有种手术叫做大脑半球切除术。


    你肯定想：只剩下一半脑子，人还能活得了吗？'
  - '[PAGE 72]


    能。


    一侧大脑切除后，只要经过有计划的康复训练，另外一侧大脑就可以代偿，替代切掉的脑组织完成任务。


    病人还能够和正常人一样进行思维和活动，而且复杂的认知能力也能够得到恢复。


    甚至冠心病病人，血管狭窄了、堵了，这根堵了的血管周围的小血管就会变粗、变长，甚至长出新生的血管，替代这根堵了的血管给心肌供血，防止发生致命性的心肌梗死。这也是代偿。


    所以，经常犯心绞痛的老人反而不容易猝死。


    为啥呢？


    因为有代偿。长期的心绞痛，已经让病人狭窄血管的周围长出了新的小血管。


    反而有时候年轻人心梗了更容易死亡，就是因为还没有形成这些用以代偿的血管。


    代偿是人类一种伟大的保命机制。


    这种机制让我们在没办法去除持续损伤因素的情况下，先妥协着活下来。


    这本身是有利的一面，但是另一方面，也掩盖了病情。


    如果能去除病因，病情还可以逆转。但是如果病因持续存在，时间长了早晚还会出问题、出症状，甚至有些慢性病还可以发生癌变。


    也就是说，代偿带来了妥协的生存。但是时间久了，也会对人体产生不利的影响。


    # 代偿带给我们疾病防治的启示


    知道了代偿的原理，你也就知道怎么有效预防和治疗慢性病了。'
  - '[PAGE 73]


    下面，我为你总结了三个重要的建议：


    第一个建议：既然很多慢性病在早期没有症状，我们就要主动筛查。


    这点不容置疑。


    现在有种错误观点，认为病不知道最好，知道了反而死得更快。这非常愚昧。


    **2018** 年，**美国**癌症的总体死亡率，比历史上死亡率最高的 **1991** 年下降了 **27%**。下降的这 **27%**，就相当于挽救了
    **262** 万条生命。


    研究者认为，之所以有如此惊人的成就，其中重要的一项因素就是开展了癌症的早期筛查。


    比如结肠癌、直肠癌的发病率下降，主要原因就是推广结肠镜检查。


    从 **2000** 年到 **2015** 年，**美国 50** 岁以上的成年人接受结肠镜检查的比例从 **21%** 升高到了 **60%**。


    所以，第一个建议就是主动筛查。


    第二个建议：从源头上预防或者从中间环节阻断，可以有效防止慢病的发展。


    比如宫颈癌。


    绝大多数是 **HPV** 病毒感染，先引起慢性炎症，然后到不典型增生，最后才发展成宫颈癌。


    所以，接种宫颈癌疫苗是从源头上预防 **HPV** 感染。


    对于已经发生感染的，在不同的阶段进行针对性的治疗，就是阻断中间环节，避免最终发展成癌症。


    这就是关于慢病预防和治疗的第二个建议。'
  - '[PAGE 74]


    但是，很多病我们很难从源头上预防，也很难完全阻断。


    比如冠心病。


    尽管我们严格控制血压、血糖、血脂、不吸烟，但是还是有相当比例的人群得了冠心病。而且尽管严格用药，也会有相当比例病人的病情依然在进展。


    第三个建议：巧妙地放大代偿机制。


    什么叫放大代偿机制呢？


    我刚才讲了，冠心病是有血管狭窄了。那么，狭窄血管周围的小血管就会变粗、变长，甚至产生新血管，代替那些狭窄的血管完成供血任务。这是代偿。


    放大代偿，就是主动帮助小血管长出来。


    比如，在医生的指导下，通过适度运动就可以帮助形成这些小血管。


    病人以后再犯心绞痛或者心肌梗死的可能性，就大大降低了。


    # 划重点


    +   1. 代偿是人体面对持续损伤的一种妥协机制。 2. 代偿让器官满足基本功能，却掩盖了症状。 3. 针对慢病，我们可以主动筛查，阻断发病环节，放大代偿。


    # 思考题


    妥协带来了生存，但是也掩盖了真相。在你的行业里，有什么代偿效应呢？


    欢迎发到留言区，咱们一起互动。


    # 下节预告


    下一讲，我来介绍一种认知疾病的新角度：人和体内的细菌到底是什么关系？'
  - '[PAGE 75]


    # 10 | 内共生：认知疾病的新角度


    2019-03-08


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    我相信在这节课以前，你肯定听说过肠道菌群和疾病的关系。


    比如肥胖。


    再比如过敏性疾病，包括荨麻疹、湿疹、哮喘、鼻炎等等。


    还有焦虑、抑郁、自闭这些精神问题；类风湿性关节炎、红斑狼疮这些自身免疫病；甚至癌症，尤其是结肠癌。


    这些病都和肠道的细菌息息相关。


    但是，怎么理解这些现象的本质呢？


    人和体内的细菌是敌对关系吗？


    咱们应该如何利用这种关系，正确认知和治疗疾病呢？


    这就是今天要讲的内共生：疾病认知的新角度。


    内共生这个概念可能你觉得有点陌生。


    但是，内共生可是生物进化的关键一步。可以说，没有内共生就没有现在的人类。


    这个概念是美国生物学家马古利斯（Lynn Margulis）在 1970 年出版的《真核细胞的起源》（*Origin of Eukaryotic Cells*）这本书中提出来的。


    他认为，真核细胞里的线粒体是由细菌演化而来的。真核细胞和它内部的细菌是内共生关系。'
  - '[PAGE 76]


    我来解释一下。


    在上亿年前的某一天，细胞吞噬了细菌。吃进去不要紧，两个小伙伴同时发现“搭伙过日子”最经济、最有效率。


    随着亿万年的进化，细菌慢慢就演变成了细胞里的关键物质：线粒体。


    我们知道，细胞生存和复制都需要能量，而线粒体就是能量来源。线粒体好比是一个发电厂，发电厂可以把煤转化为电。


    线粒体可以把葡萄糖、氨基酸、脂肪这些营养物质转化为细胞可以利用的能量形式：ATP。这样生命才有了能量，进化才有了能量来源。


    这样一来，细菌得到了营养，又把营养变成了能量来供应细胞，何乐而不为呢？


    这就是内共生。


    在我看来，用内共生来解释细胞和它内部细菌的关系，只是一种狭义的理解。


    从一个更深更广的角度来看，人体和体内的细菌更是构成了一种内共生体系，这才是广义的内共生。


    这节课讲的是广义的内共生。


    打破内共生就会带来很多病，如果可以巧妙地利用和恢复内共生，也可以让很多病得到缓解或治愈。


    所以，内共生就是这么重要。


    接下来，我带你从三个层面展开理解内共生与人类疾病。


    相爱相杀，互惠互利


    我先问你一个问题：人体哪些部位有细菌呢？'
  - '[PAGE 77]


    我猜你肯定会说，肠道、口腔、鼻腔、皮肤、阴道，甚至上呼吸道都有细菌。


    但是，这只说对了一半。


    最新研究表明，健康人的血液里有细菌、眼睛表面有细菌、女生的输卵管、子宫和盆腔里都有细菌。


    甚至在以前咱们认为绝对无菌的大脑里，现在也发现了细菌。而且这些细菌并没有影响到人的健康。


    我推测，人体所有器官里都有常驻的细菌或者比细菌更小的微生物，只是现有的技术手段没有检测到而已，但是没发现不代表没有。


    我再问你第二个问题：人体有多少细菌呢？


    不计其数。


    情侣间一次接吻就可以交换 8000 万个口腔细菌。


    肠道内细菌最多，有上千种，总数大约 100 万亿。这个数字是全球总人口的 1 万 3 千多倍。如果把这些细菌一个挨一个地排好队，总长度可以绕地球两圈。


    所以，可以把人体当成一个细菌星球。


    既然人体内有这么多常驻细菌还可以和平共处，那么人和这些细菌从来就不只是敌对关系，而是内共生。这是咱们今天要说的第一个层面。


    这种内共生关系就是：相爱相杀，互惠互利。


    我解释一下。人给细菌提供了营养和生存环境，但是细菌也不“白吃”，它会从几个方面反哺它赖以生存的人体。


    首先是免疫屏障。'
  - '[PAGE 78]


    每个部位的细菌都有领地观念，也就是"这块地儿我占了"，其他的细菌或者微生物别想来捣乱。


    这样，间接地保护了咱们不受有害菌的感染，我们把这种现象叫做免疫屏障。


    比如，小白鼠的眼结膜上“驻扎”着一种细菌——乳腺炎棒状杆菌。


    这种细菌不引起任何症状，但是它可以刺激白细胞在眼泪中释放杀菌物质，这样就可以抵御其他引起结膜炎的有害菌了。


    其次，细菌会合成化学物质，帮助人体完成生理功能。


    比如 5-羟色胺是让人产生快乐的物质。但是你一定想不到，人体自身合成的 5-羟色胺只占总量的 5%，另外 95%是由细菌合成的。


    最后，细菌培养出了强大的人体免疫。


    比如肠道。为了和细菌作战，人体给肠道配备了最王牌的部队。


    有七成以上的免疫细胞集中在肠道，包括巨噬细胞、T 细胞、NK 细胞、B 细胞；还有七成以上的免疫球蛋白 A（IgA）是由肠道制造的。


    可以说肠道是人的免疫系统和细菌作战的最大战场。


    不停地斗斗斗，打打杀杀，这个过程就像不停地给咱们"打疫苗"，锻炼咱们的免疫力。


    没有对抗就没有和平，这是生物界的规律。


    所以，人和细菌的内共生关系可以总结为：


    细菌可以帮助人类抵御其他有害菌的攻击；细菌可以锻炼人体的免疫系统；细菌还会帮助人体合成生理功能必须的一些关键物质。'
  - '[PAGE 79]


    # 打破内共生就会带来病


    很多药物包括化疗药物、抗生素，很多食物包括糖，都会干扰内共生。内共生关系一旦被打破就会带来病。


    首先，细菌移位会带来病。也就是说，细菌跑到不该去的地方了。


    细菌如果在它该待的地方，就是正常菌，或者不会引起严重的问题；如果细菌跑到其他地方，就会变成有害菌。


    比如，关于阿尔茨海默症，也就是老年痴呆症病人的研究表明，在这些病人的大脑里，发现了牙周炎的细菌和一些引起口腔溃疡的白色念珠菌。


    这些菌在口腔里不会引起大问题，但是如果移位进入大脑，那就可能带来老年痴呆症。


    其次，内共生被打破，有害的微生物就会趁虚而入，这样也会带来病。


    刚才提到，正常情况下细菌会形成免疫屏障，免疫屏障的最大作用就是阻止其他的微生物来捣乱。


    免疫屏障相当于“常驻部队”，但是有时候咱们用抗生素把常驻部队都杀死了，那“土匪”就该捣乱了。


    举个例子。


    很多女生用含有杀菌剂的洗液冲洗阴道，那么接下来反而会引起真菌感染，引起真菌性阴道炎。


    在我工作的ICU，因为严重感染必须大剂量应用抗生素的病人，就很容易继发耐药菌的细菌感染或者深部真菌感染。


    这些感染很难治，这就是异常微生物入侵引起的。'
  md: '

    ## 症状的保护作用


    这种功能是人类在进化过程中形成的，是为了生存，是人体的智慧。


    比如，刚才说的外伤时候出现低血压，就是为了降低出血速度，是自我保护。


    发烧也是一种自我保护，它可以调动人体的免疫系统，杀死细菌和病毒。


    下面这个症状的保护作用，我猜你可能不清楚。


    《我们为什么会生病》（Why We Get Sick）这本书里，讲了一个非常著名的自我保护的例子——人体的限铁机制。也就是限制铁的吸收。


    得了慢性感染，比如肺结核，很多人会出现缺铁的症状，会出现缺铁性贫血。


    大多数人会想当然地把贫血看成是坏事，但是只有很少人知道，这种缺铁现象是人体的一种自我保护。


    因为微生物要存活需要铁，但是微生物却不能自己合成铁，只能从人体获得。


    所以，感染的时候人体会减少铁的吸收，故意造成一种缺铁状态，就是为了限制细菌的生长。


    如果盲目补铁，反而会加重病情。这就是干扰了人类在进化过程中形成的智慧。


    这种智慧不仅能对抗已经发生了的病，甚至能未雨绸缪，防止未来可能出现的严重问题。


    比如，怀孕的女性在即将分娩的前几天，血液里有个凝血指标会快速大幅度上升，有时候甚至升高几十倍，表示血液容易凝固。


    这还是为了自我保护，防止未来几天生孩子的时候，产道损伤可能发生的大出血。


    等到生完孩子，安全了，这个指标也会迅速恢复正常。


    总结一下。症状不仅能给我们提个醒“我生病了”，还能主动对抗疾病，甚至能预防未来有可能发生的严重异常，这是生命的本能。


    那么症状用治吗？


    # 症状具有双刃剑效应


    说完了症状的积极作用，接下来要泼点冷水了。


    人类虽然进化出了症状这种自我保护机制，但是却做不到尽善尽美。


    什么意思呢？


    很多时候，身体掌握不好这个火候。


    比如感染。


    进化告诉咱们“该发烧了”，但是烧到多少度合适呢？不知道。


    每个人有每个人的反应，绝大多数时候没问题，可以起到保护作用。但是有时候反应过度了，效果就会走向另一面，给人体带来伤害。


    比如体温过高。


    这种情况，有的孩子会惊厥、抽搐，引起大脑的缺氧。有的成年男性会出现暂时的精子活力受损。


    再比如过敏。


    过敏是人体接触到异物，免疫系统产生的排斥性反应，目的是为了咱们远离过敏物质。


    但是，有些人的过敏反应特别强烈，会出现休克、气道痉挛、水肿，严重的会引起窒息和死亡。


    还有，咱们开始讲的伤员大出血的例子。血压低是为了保命，但是血压过低或者持续时间过长，会引起器官的缺血，导致器官功能衰竭，接下来也会引起死亡。


    这些都是症状的双刃剑效应。


    所以讲到这里你就明白了，病是因果关系的第一环，症是疾病发出的信号，同时也是一种自我保护反应。


    但是如果过度了，反而会有害。


    # 骨刺和高血压真的是病吗？


    那么，应该如何正确对待疾病和症状呢？


    首先，要区分哪些是病，哪些是症，这是基础。因为病需要治，但症状却未必需要处理。


    下面我讲两个症状，很可能在以前就被你误认为是病了。


    第一个是骨刺。


    在你的印象里，骨刺是不是骨头上长出来一根刺扎在肉里了，所以会疼。这几乎是很多人的共识。


    但是，大家都错了。


    骨刺不是病，而是症状。


    真正的病，是人的骨骼和关节的老化。老化让关节的稳定性变差了，才会引起疼痛。


    骨刺，其实就是骨质增生。不仅不会引起疼痛，而且长骨刺是为了让人不疼的，是为了增加骨骼表面积，减少局部压强，让关节更稳定。


    当骨刺长好了，关节稳定了，这时候疼痛反而消失了。


    第二个症状可能误会更多了，那就是高血压。


    高血压是怎么来的呢？


    随着年龄增高、肥胖或者有些说不清的原因，血管会逐步狭窄、硬化、血流阻力增加。


    这个时候，为了保证器官的正常供血，血压就会增高，这就是原发性高血压。


    我认为，把原发性高血压定义成一种病，不如把它看成是一种症状更贴切。


    真正的病是隐藏起来的，引起血流阻力增加的病理改变。


    高血压只是为了在血流阻力增加的情况下，让器官仍然能够保持一定血流的保护性反应。


    明白了哪些问题是症，哪些问题是病，接下来的治疗才更有针对性。


    # 不过多干预症状也是治疗


    我认为，要尊重机体在进化过程中形成的自我保护，避免破坏天然的防御机制。


    所以，任何治疗都应该从病着手，对于症状要适度干预。


    症状具有双刃剑效应，如果症状严重或者持续存在，就一定会带来后续的损害。


    所以，只有在体温过高的时候才退热。


    血压持续增高，必须口服降压药，防止血压持续异常引起后续的心脏、脑血管受损。


    但是你要记得，治疗高血压更重要的应该从改变生活方式，降低血流阻力着手，而不能单纯依靠药物降压。


    别跟症状死磕，而是要找到病根，治病。


    # 划重点


    - 疾病带来的症状，绝大多数时候是提醒、是保护。

    - 症状和疾病应该区别对待。病要治，症状只能适度干预。


    # 下节预告


    有的病尤其是慢性病，却没有症状。下一讲，咱们说说对于没有症状的病，该怎么办？


    # 09｜代偿：疾病不是突然发生的，而是突然发现的


    2019-3-7


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    上节课，咱们说了要区别对待病和症状，因为大多数症状是提醒和自我保护。


    但是很多病没有症状，一旦发现就是中晚期，这又是怎么回事呢？


    这节课，我会讲一个重要的机制来解释有病却没症状的原因，以及如何巧妙地利用这个机制对抗疾病。


    先从一个多发病——胃癌的发生和发展讲起。


    ## 幽门螺旋杆菌与胃病、胃癌


    很多胃癌的病人早期没有明显症状。


    以前，医生也不知道胃癌的确切原因。当时的主流观点认为，胃病是由刺激性食物、胃酸过多或者压力过大引起的。


    但是后来发现，人们即使避免了这些因素，胃癌的发病率依然很高。


    到了1981年，澳大利亚有两位医生马歇尔（Barry J. Marshall）和沃伦（Robin Warren）提出，胃里有种细菌叫做幽门螺旋杆菌，可能和胃病、胃癌有关系。


    这种细菌你肯定听说过，可能还检查过。这种细菌有多厉害呢？


    铁块进到人的胃里都能被腐蚀掉，所有的细菌遇到强酸都得死，唯独幽门螺旋杆菌例外。它可以在pH值低到2.0的胃酸里活得逍遥自在。


    但是，幽门螺旋杆菌可以导致胃病这个观点刚一提出来，就立刻遭到医学界同行的攻击。当时的医生都不相信这么酸的胃里会有细菌。


    为了证明自己的观点，马歇尔医生竟然喝了一瓶幽门螺旋杆菌，结果他真的得了胃炎。


    这样一来，越来越多的医生就相信了，确实就有这么一种细菌能在强酸里生存。


    到了 1994 年，持续的幽门螺旋杆菌感染可以导致胃癌这个观点才得到公认，世界卫生组织把这种细菌列为一级致癌物。


    一级致癌物指的是有明确证据表明可以致癌的物质，比如雾霾、烟草、槟榔、黄曲霉素等等。


    到了 2005 年，这两位医生获得了诺贝尔生理学或医学奖。他们的获奖理由是：幽门螺旋杆菌的发现，加深了人们对慢性感染、炎症和癌症之间关系的认识。


    2014 年在日本京都，全世界的医学专家达成共识：根除幽门螺旋杆菌感染，是预防胃癌的首要手段。


    为什么要讲这个病例呢？


    - 从这种慢性的、持续的，甚至没有症状的细菌感染发展成胃癌，经历了一个非常漫长的过程。

    - 掌握了这个慢性过程的具体环节，预防和治疗就有了依据。


    所有严重的慢性疾病都不是突然发生的，而是突然发现的。


    其实，所有的慢病都是如此。


    比如结肠癌，从一个良性的腺瘤逐步演变成恶性肿瘤，通常需要 15 年。


    女性持续的高危型 HPV 感染到发生宫颈癌，一般需要大约十几年（高危型，就是最容易引起宫颈癌的病毒类型）。


    还有，中国人死亡原因第一的心脑血管病，也是从青壮年开始，血管上就开始出现斑块，经过 20-30 年的进展，血管逐步狭窄。当狭窄超过一定范围，才会出现心脏病或脑血管病的症状。


    当然，这些时间、数字因人而异。


    列举这些数字，是为了说明这种无症状的进展是多么漫长。但是，一旦出现症状，多数都是中晚期。


    ## 代偿是慢病进展过程中人体的妥协


    我经常遇到晚期才来看病的病人。


    比如肠癌。肿瘤已经长到把肠子都堵住了、梗阻了或者已经发生了远处转移，病人才到医院。


    再比如，病人剧烈胸痛。做心电图、查心肌酶，发现已经是心肌梗死了。


    这个时候再问病人：怎么这么晚才来看病呢？


    很多人的回答都是：我平时很好，没一点儿感觉，为什么这个病突然找我呢？


    刚才咱们已经了解到，任何慢性病都不是突然发生的，而是突然发现的。


    那你可能会问：这些病能在体内藏这么久，我们却感觉不到，是敌人太狡猾了？还是人体太麻木了？


    都不是。


    之所以人体能够在疾病状态下，十几年甚至几十年都不出现明显的症状，是因为人体有一种代偿机制。


    这节课的重点就是两个字：代偿。


    什么是代偿呢？就是代替、补偿。


    身体某些组织或者器官持续受损，已经没办法修复原样了，人体就调动没有受损的部分，加快补充或者代替受损的部分完成工作。


    上课课讲过，症状是人类进化带来的一种智慧，代偿就是进化的另一种智慧。


    举个例子。


    刚才咱们提到的幽门螺旋杆菌会持续攻击胃的细胞，引起胃炎，细胞就会死亡。


    这个时候，人体就会启动代偿机制，让深层的干细胞加速分裂，赶紧补充死亡的细胞。这样就防止发生严重的穿孔、出血。


    所以，人体的代偿能够让器官在持续损伤的状态下，基本上能够满足功能，也就是凑合着用，所以才不会出现明显的症状。


    只有到了疾病晚期，代偿不动或者超过极限了，症状才会出现。


    代偿是人体不得已而为之的机制，是妥协。


    代偿的最终目的是保证器官的基本功能，也就是为了保命。


    所有的慢性病，人体都会启动代偿。


    比如高血压。


    血压持续增高，心脏射血的负担就会增加。所以，心肌就会变得肥厚，射血才更有劲。这是代偿。


    再比如，治疗癫痫有种手术叫做大脑半球切除术。


    你肯定想：只剩下一半脑子，人还能活得了吗？


    能。


    一侧大脑切除后，只要经过有计划的康复训练，另外一侧大脑就可以代偿，替代切掉的脑组织完成任务。


    病人还能够和正常人一样进行思维和活动，而且复杂的认知能力也能够得到恢复。


    甚至冠心病病人，血管狭窄了、堵了，这根堵了的血管周围的小血管就会变粗、变长，甚至长出新生的血管，替代这根堵了的血管给心肌供血，防止发生致命性的心肌梗死。这也是代偿。


    所以，经常犯心绞痛的老人反而不容易猝死。


    为啥呢？


    因为有代偿。长期的心绞痛，已经让病人狭窄血管的周围长出了新的小血管。


    反而有时候年轻人心梗了更容易死亡，就是因为还没有形成这些用以代偿的血管。


    代偿是人类一种伟大的保命机制。


    这种机制让我们在没办法去除持续损伤因素的情况下，先妥协着活下来。


    这本身是有利的一面，但是另一方面，也掩盖了病情。


    如果能去除病因，病情还可以逆转。但是如果病因持续存在，时间长了早晚还会出问题、出症状，甚至有些慢性病还可以发生癌变。


    也就是说，代偿带来了妥协的生存。但是时间久了，也会对人体产生不利的影响。


    # 代偿带给我们疾病防治的启示


    知道了代偿的原理，你也就知道怎么有效预防和治疗慢性病了。


    下面，我为你总结了三个重要的建议：


    第一个建议：既然很多慢性病在早期没有症状，我们就要主动筛查。


    这点不容置疑。


    现在有种错误观点，认为病不知道最好，知道了反而死得更快。这非常愚昧。


    **2018** 年，**美国**癌症的总体死亡率，比历史上死亡率最高的 **1991** 年下降了 **27%**。下降的这 **27%**，就相当于挽救了
    **262** 万条生命。


    研究者认为，之所以有如此惊人的成就，其中重要的一项因素就是开展了癌症的早期筛查。


    比如结肠癌、直肠癌的发病率下降，主要原因就是推广结肠镜检查。


    从 **2000** 年到 **2015** 年，**美国 50** 岁以上的成年人接受结肠镜检查的比例从 **21%** 升高到了 **60%**。


    所以，第一个建议就是主动筛查。


    第二个建议：从源头上预防或者从中间环节阻断，可以有效防止慢病的发展。


    比如宫颈癌。


    绝大多数是 **HPV** 病毒感染，先引起慢性炎症，然后到不典型增生，最后才发展成宫颈癌。


    所以，接种宫颈癌疫苗是从源头上预防 **HPV** 感染。


    对于已经发生感染的，在不同的阶段进行针对性的治疗，就是阻断中间环节，避免最终发展成癌症。


    这就是关于慢病预防和治疗的第二个建议。


    但是，很多病我们很难从源头上预防，也很难完全阻断。


    比如冠心病。


    尽管我们严格控制血压、血糖、血脂、不吸烟，但是还是有相当比例的人群得了冠心病。而且尽管严格用药，也会有相当比例病人的病情依然在进展。


    第三个建议：巧妙地放大代偿机制。


    什么叫放大代偿机制呢？


    我刚才讲了，冠心病是有血管狭窄了。那么，狭窄血管周围的小血管就会变粗、变长，甚至产生新血管，代替那些狭窄的血管完成供血任务。这是代偿。


    放大代偿，就是主动帮助小血管长出来。


    比如，在医生的指导下，通过适度运动就可以帮助形成这些小血管。


    病人以后再犯心绞痛或者心肌梗死的可能性，就大大降低了。


    # 划重点


    - 代偿是人体面对持续损伤的一种妥协机制。

    - 代偿让器官满足基本功能，却掩盖了症状。

    - 针对慢病，我们可以主动筛查，阻断发病环节，放大代偿。


    # 思考题


    妥协带来了生存，但是也掩盖了真相。在你的行业里，有什么代偿效应呢？


    欢迎发到留言区，咱们一起互动。


