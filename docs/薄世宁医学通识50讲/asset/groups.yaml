    # 划重点


    1. 所有自然科学的进步，都终将 为医学所用。 2. 基础研究是地基，临床项目是应用。基础越扎实，临床就越可靠。 3. 微观是宏观的基础，医学研究越深 入越微观，也
    就为认知和治愈疾病带来了无限可能。


    # 思考题


    我们经常听到有些“偏方”或者“秘方”声称可以治愈癌症，甚至声称正在申报诺贝尔生理学或医学奖。听了今天的课，你能说说为什么它们不靠谱吗？


