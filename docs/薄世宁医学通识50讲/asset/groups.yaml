    # 36 ｜ 避孕药：把女人的身体还给女人


    2019-4-3


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    有病才吃药，这几乎是常识。但是这节课要讲的药，却是给健康人吃的。


    我们知道，人是地球上唯一一种不以繁衍为主要目的，而进行性交的物种。但是，性交又很难和繁衍分割。所以，女性参与性活动的代价远远大于男性。


    首先是过度生育问题，这会让女性没办法工作，依附于男性。另外，生产过程有风险，还会带来疾病、死亡、贫穷。随之而来的是，社会负担也会过重。


    其次，意外怀孕又带来了堕胎问题和身体伤害问题。


    避孕药，就是用医疗的形式解决了这两个问题。它是药的升级，它的主要目的不是治病，而是用药的形式把女人的身体还给女人。


    权威期刊《英国医学杂志》（The BMJ）把避孕药评为医学的 15 个里程碑之一，和抗生素、疫苗、DNA 的发现并驾齐驱。


    《经济学人》（The Economist）把避孕药看做 20 世纪最重要的科学进步之一。


    在西方，女性通过常规服用口服避孕药来避孕的比例是 30%-50%，而在中国，只有 2.3%。口服避孕药是被误解最深的药。


    让生育和性爱分割


    避孕是刚需。在没有避孕药具的年代，人们用了各种“神奇”的招数来避孕。


    比如：


    把柠檬切一半挖空，塞到阴道里；用羊的盲肠来当避孕套；喝水银。'
  - '[PAGE 279]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_279_0.png)


    这些方法不仅避孕效果不可靠，而且对女性的身体伤害很大。


    在 20 世纪 60 年代，即便是在避孕药的“娘家”美国，人们也不能谈避孕，谈避孕违法。


    当时的人们认为，有了避孕的东西会让人变淫荡，会增加偷情的概率。而且有的信仰认为，避孕违背自然法则。


    这才是掩耳盗铃。道德问题和避孕有什么因果关系呢？


    但是，就有这么一个草台班子，敢冒天下之大不韪研发避孕药。这个团队有三个人。


    第一位，是坚决推广女性避孕的社会改革家——桑格（Margaret Sanger）。她的母亲在怀孕第 18 次的时候去世，她目睹了反复生育给女人带来的痛苦。桑格负责宣传。


    第二位，原本是哈佛大学的天才——平克斯（Gregory Goodwin Pincus）。他给兔子做体外受精，试验成功了，他却被开除了，理由是亵渎生命。平克斯负责动物试验。


    第三位，是妇科医生——洛克（John Rock）。他负责临床试验。严格的临床试验，是药品申报必不可少的环节。'
  - '[PAGE 280]


    这个团队虽然小，但是分工明确。最关键的是，一旦避孕药研发成功，在未来必将产生巨大收益。


    收益是什么呢？就是女人的身体还给女人。


    有痛点，有团队，还有巨大的未来收益。这个时候，投资人出现了。是一个非常有钱的女人——凯瑟琳（Kathryn McCormick），她是国际收割机公司的老板娘。


    凯瑟琳有钱，但是不幸。她的老公是精神分裂症不适合生育，所以，她也坚定不移地赞成科学避孕。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_280_0.png)


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_280_1.png)


    平克斯（左上）、洛克医生（右上）、桑格（左下）、凯瑟琳（右下）


    研发过程很曲折，但是结果成功了。1957 年，避孕药通过了全世界药品审批最严格的 FDA（美国食品药品监督管理局）。'
  - '[PAGE 281]


    FDA 耍了个小花招。


    因为当时的社会不谈让避孕，所以，FDA 把这个药审批成治疗月经不调。在药品说明书里注明，副作用是阻止排卵。不排卵不就等于避孕吗？


    FDA 是在科学的外表下，表达人文。


    药一上市，几十万女性来开药，很多人都说自己月经不调。显然，她们是奔着这个药的副作用，也就是避孕来的。


    1960 年，美国 FDA 重新把这个药审批成避孕药。


    从此，这个充满魔力的小药丸让性爱和生育分割开来，让女人可以自主控制生育。这是人类历史上第一次真正生理意义上的，把女人的身体还给女人。


    # 避孕药不仅是避孕


    虽然避孕药可以名正言顺地避孕了，但是，也带来了新的烦恼。


    有些女性因为痛经到医院，医生给她们口服避孕药，她们只能偷偷摸摸地吃，就是因为这个药的名字叫“避孕药”。


    其实，口服避孕药的作用可不仅仅是避孕，还能治病。


    它对于痤疮、功能性子宫出血的治疗效果都很好。有研究表明，对于子宫内膜异位症引起的痛经，口服避孕药缓解疼痛有效率达 79.7%。


    对于不孕症的病人，口服避孕药甚至可以帮助怀孕。


    比如多囊卵巢综合征，就是因为激素水平紊乱导致不孕。


    口服避孕药可以调整月经，等到月经调整完毕后，需要怀孕的时候再用其他药物诱发排卵。这样，很多女生就可以成功怀孕了。'
  - '[PAGE 282]


    口服避孕药还能用于人工控制月经。


    在一些特殊时期比如高考、比赛、游泳，这个时候用避孕药人为地控制女性月经，让它错开这几天，过几天再来。


    另外，现有研究证据表明，口服避孕药对于减少某些妇科癌症还具有有一定作用，长期服用可以让子宫内膜癌的风险降低 50%，让卵巢癌的风险降低 40%。


    而且即使停药后，保护作用还会持续很久。


    所以，口服避孕药只用于避孕是不对的，这是对它第一个误解。


    第二个误解，就是认为它是激素，会带来副作用，会让人变胖。


    其实，今天说的口服避孕药是雌激素和孕激素的合剂，这和临床上引起发胖的糖皮质激素是两码事。


    少数病人在服用早期可能出现轻度水肿和体重增加，但是非常轻微。持续服用，这种作用也越来越小了。


    还有人认为，避孕药会影响要孩子，这就更是误会了。实际上，这个月停药，下个月就可以正常怀孕了。


    但是，口服避孕药也有副作用，它最大的副作用是增加了静脉血栓的机会。所以，35 岁以上，吸烟或有心脑血管病的女性，不推荐使用口服避孕药。


    关于避孕药的第三个误解，就是把口服避孕药和紧急避孕药弄混。


    有的女性不敢吃口服避孕药，但是却不拒绝紧急避孕药。有药店统计，每年情人节过后，紧急避孕药的销量都会增加 50%。


    要知道，口服避孕药和紧急避孕药是两码事。'
  - '[PAGE 283]


    口服避孕药主要是通过抑制排卵，防止怀孕，副作用很小。而紧急避孕药是阻止受精卵着床，副作用远远大于口服避孕药。


    口服避孕药让性与生育分割，这是让女人能为自己身体做主的关键一步。但是，医学所做的远不止这些。


    接下来，就是让女性想生的时候，可以安全地生。


    # 让生育和死亡分割


    在以前，生孩子全靠运气。生孩子被看做是女人的一只脚踏进了鬼门关。


    为什么这么说呢？


    以前没有科学的接生手段，只有一些没有接受过任何医学教育的老人，充当接生婆的角色。


    根据统计，在世界范围内，**80%** 的孕产妇死亡是发生在生孩子这个过程中的，主要死因是严重的大出血、感染、妊娠高血压，还有难产。


    生育这个过程，给女人的身体甚至生命带来巨大威胁。


    比如产妇发生了大出血；或者胎儿头部太大，很难通过产道的时候；再或者胎儿体位异常，胎位不正的时候，多数情况下就是产妇死亡，或者一尸两命。


    医学让生孩子的过程，在熟练的医护人员的辅助下进行。具有专业技能的助产士、产科医生、麻醉师，让女性生产的过程变得更安全。


    手术可以处理大出血，缝合撕裂的产道，有效止血。


    各种助产技术可以在胎位不正的时候辅助生产，危急时刻还可以剖宫产。抗生素和无菌操作，又减少了围产期的感染。'
  - '[PAGE 284]


    根据统计，建国初期我国孕产妇死亡率是每 10 万人死亡 1500 人，在 2018 年这个数字是每 10 万人死亡 18.3 人，大约下降了 99%。


    医学让生育和死亡分割，让女人想生的时候可以安全地生，这也是一种伟大的进步。


    接下来，医学还能让女性想什么时候生，就什么时候生。


    # 让生育和年龄分割


    有些女性年轻的时候不想生孩子，想工作，想轰轰烈烈地恋爱，想玩儿，或者想做对她更有意义的事，或者不想和现在的伴侣生。


    但是，女性的生育力在 35 岁以后会迅速下降。如果现在不生，万一哪天后悔了怎么办？


    冻卵技术就是一种“后悔药”。这同样是把女性身体的自主权还给了女性。


    根据网络报道，苹果、Facebook、携程公司，都相继出台了给女高管报销冻卵费用的政策，还推出带薪年假等措施，目的都是鼓励女性员工先为事业奋斗。


    冻卵技术就是把卵子取出来以后，放到保护液里，立刻投入零下 196°C 的液氮里保存起来。


    就像瞬间被封存到了玻璃里面，所以也叫玻璃化冷冻。需要的时候，再取出来复原就可以用了。


    当前的医疗技术，还没办法保证冷冻卵子 100% 能够复原、受孕。而且按照国际惯例，保存期也不超过 5 年。


    美国冻卵受孕成功率最高的机构，是在新泽西州的一家辅助生殖中心，根据那里的数据显示，冻卵复原后成功怀孕的比例，最高可以达到 61.3%。前提是必须在 35 岁之前冷冻，如果超过
    40 岁再冻卵，这个成功比例就会降低到 44.6%。


    在未来，随着医学的进步，这项技术一定会做到成功率越来越高，安全保存年限越来越长，给更多女性提供更多选择。'
  - '[PAGE 285]


    划重点


    1. 口服避孕药，让生育和性爱分割。 2. 专业助产技术，让生育和死亡分割。 3. 冻卵技术让生育和年龄分割。


    下节预告


    为什么说所有的科学奖，其实都是医学奖？下节课，我们说说诺贝尔奖。'
  - '[PAGE 286]


    # 37｜诺贝尔奖：所有的科学奖都是医学奖


    2019-4-4


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    如果你注意我们每节课的案例，你会发现一个规律。我喜欢用诺贝尔生理学或医学奖项目说明问题。


    首先，它权威，其次，它代表了医学研究的风向标。


    在我看来，虽然诺贝尔生理学或医学奖一直是为别人的研究颁奖的，但是，它本身也是一座医学的丰碑。


    从 1901 年第一次颁奖到 2018 年，诺贝尔生理学或医学奖一共颁发 109 次，中间因为战争暂停过 9 次。


    这节课，我们就通过百年的获奖项目，梳理一下医学的方向和趋势。


    # 自然科学的成果为医学所用


    先从一个说起——叫桑卡（Aziz Sancar），他是一名美国遗传学科学家。


    你对桑卡不了解，但你一定还记得咱们讲过的“基因修复机制”，也就是人体基因会突变，为了自我保护，人体就会自动修复突变。这个机制在研究衰老、癌症和遗传病方面都有巨大的价值。


    桑卡就是发现这个机制的关键人物之一。


    有这么突出的贡献，所有人都觉得他肯定能得诺贝尔生理学或医学奖。


    2015 年 10 月 5 日，诺贝尔生理学或医学奖隆重公布，把奖颁发给中国科学家屠呦呦，以及另外两名外国的科学家，表彰他们在寄生虫治疗领域做出的贡献。根本没提名桑卡。'
  - '[PAGE 287]


    太让人失望了。


    两天后，也就是 10 月 7 日凌晨 5 点，桑卡的妻子接到一个电话，然后对桑卡说，这个电话非常重要，要他亲自接。


    接到这个电话，桑卡说话都变得语无伦次了。原来是诺贝尔化学奖委员会打来的电话：“桑卡教授，祝贺你，得了今年的诺贝尔化学奖。”


    为什么要讲这个故事呢？


    所有人都认为，DNA 修复肯定是医学，怎么得了化学奖呢？是不是发错了？


    没有发错。在我看来，桑卡同时也获得了医学奖。


    因为发展到今天，这些顶级研究已经很难完全区分到底算化学、物理，还是医学了。


    最开始为了研究的效率，人为地把自然科学分成了不同学科。研究到最后才发现，大家都是在为生命服务。


    不论是什么学科，只要是真的技术、科学的理论，都被医学借鉴了。


    你肯定注意到了，这节课的题目不是“诺贝尔生理学或医学奖”，而是“诺贝尔奖”。100 多年来，有近一半的医学奖都涉及到多个学科。


    比如，2018 年的物理奖颁给了激光镊子和激光刀。


    乍一看属于物理领域，但其实，激光镊子就是用激光“捏住”病毒、细菌、细胞、分子、原子这样的小东西，而且不损伤它们。这个技术给医学研究甚至治疗，打开了无限的空间。'
  - '[PAGE 288]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_288_0.png)


    激光刀就是通过改变激光的脉冲和强度，让激光变成刀。


    这个技术已经被医学广泛利用，每年有无数次的眼科手术是由最锋利的激光刀完成的，不仅精细，而且创伤小。


    物理技术也是为医学所用，难道不能得医学奖吗？


    再比如，2018 年的化学奖颁给利用生物遗传变异和选择的原理，让微生物制造对人体有益的蛋白质的技术。它的成果用在哪里呢？


    还是在医学上。


    你可能知道牛皮癣、类风湿关节炎，还有其他自身免疫病，这些病非常难治。现在，有一种抗体药物可以治疗这种病，药的治疗原理就是这个获奖的化学技术。这个技术给无数在痛苦中挣扎的患者，带来了福音。


    这到底该算化学，还是医学呢？


    很多化学家抱怨，得诺贝尔化学奖的研究都是跟医学相关的，干脆把化学和医学合并算了。


    虽然这是句玩笑话，但是毫无疑问，再好的研究必须解决人类的实际问题。'
  - '[PAGE 289]


    这就是医学发展的第一大特点：医学借鉴了所有科学的精华，所有自然科学的进步，都终将 为医学所用。


    # 基础研究推动临床技术的飞跃


    我统计了 100 多年来的医学奖，又发现了另一个特点。


    也就是大部分获奖项目都是基础研究，很少有临床项目获奖。只有在早期，有些临床项 目还能获奖，但是越到后来越难。


    虽然诺奖委员会会承诺，以后会增加临床项目的获奖比例，但是我认为不太可能。


    这就是医学发展的第二个特点：以病因和机制研究为主的基础医学，始终是医学研究的 热点。


    具体到诺贝尔奖项，能够获奖的临床项目凤毛麟角，获奖项目大多数都是基础研究。


    讲到这里你可能会有疑问：临床技术是能直接用在病人身上的，是直接让病人获益的， 为什不多给这些项目发奖呢？


    这么理解就想简单了。


    基础研究是人类智慧不断累积和迭代的结果。只要研究透彻，必将带来临床技术的飞跃。


    临床项目只是对基础研究的运用，没有一个临床项目会永垂不朽。甚至，临床奖项还有 可能发错。


    比如，我在《第 33 讲 氯丙嗪：精神病治疗的第一道曙光》这节里提到过，1949 年的 诺贝尔生理学或医学奖，颁给了用脑叶白质切除术治疗重度精神病的项目。后来发现它
    的副作用太大，病人太痛苦，疗效也不好，这个奖发错了。


    但是，只要基础研究越来越深入，对生命的认识就会更透彻，医学的地基就会打得越来 越牢，医学这座大厦也就能越建越高。'
  md: '

    循证医学是医学实践中的人类基因组计划。——《柳叶刀》 循证医学是八十个震荡世界的伟大思想之一。——《纽约时报》 循证医学将彻底改变 21 世纪的医学实践模式。——《华盛顿邮报》


    ## 循证医学的五级证据


    循证医学这个概念不难理解。循证的意思，就是要遵循证据，找到最靠谱的证据。


    找证据是循证医学的核心。它把证据分成了五级，第一级最可信，第二、三、四、五级，可信程度依次降低。


    达里奥为什么不只找一个医生看病呢？


    因为，无论是不是专家，医生的个人经验都属于第五级证据，也就是可信度最低的证据。只有在缺乏其他证据的情况下，才选择用个人经验给病人看病。


    第四级证据，就可靠一些了。这就是治疗前后对比研究。


    第三级证据就更可信了，叫做对照研究。


    要想看一个治疗有效没效，一定要和安慰剂对照。因为，病人治好了未必是药好，可能是心理作用。所以，和安慰剂 PK，才能知道这个药是不是有效。


    我举一个例子，让你理解第五级、第四级和第三级证据的区别。


    比如牙齿正畸。


    根据北京大学口腔医院的统计，大约 70% 的人需要先拔牙，再矫正。决定是否需要拔牙，是依据 X 光片或者 CT 的结果，还要结合每个人的具体状况。


    假设现在你的主治医生评估完你的情况，动员你拔几颗牙，再做正畸。你会怎么想？你估计会想，我是做正畸，为什么要拔牙呢？


    如果医生告诉你，他的老师就是这么教的，他也这么做一辈子了，他的经验认为拔牙好。


    这个时候你立刻就要想到，这只是个人经验，个人经验是第五级证据，是循证医学最不可靠的证据。


    但是如果医生说，他做过几百例拔牙后再正畸的病人，治疗前和治疗后对比，所有的病人都满意。


    那你要知道，这种把治疗前和治疗后作对比的研究，只是比个人经验靠谱一些，但依然是第四级证据。


    因为，病人满意并不代表效果好。让病人满意的办法有很多。比如费用打折，或者医生的态度特别好。因此，难以了解治疗的真实效果。


    要想知道拔牙好还是不拔牙好，作个对照就明白了。


    让一组病人拔牙，一组病人不拔牙，这就是对照研究。


    对照研究的可靠程度又升高了一级，这就是第三级证据。


    所以，如果医生告诉你，他做了几百例拔牙后正畸，又做了几百例不拔牙正畸，观察了很多指标，能够证明这部分病人拔牙优势更明显。


    比如，从侧面看更美观，还可以纠正牙齿前突畸形，也就是龅牙，而且矫正后不容易复发。


    这么说，你是不是觉得踏实多了呢？这就是第三级证据，也就是对照研究得到的结果。


    梳理一下，第五级证据是个人经验，最不可靠；第四级证据是治疗前后对比，相对好一些；第三级证据是对照研究，比第五级和第四级更可靠。


    但是仔细一想，第三级证据还是有问题。


    虽然医生用拔牙和不拔牙作了对照，但是仍然掺杂了很多因素。比如，病人的要求和医生的主观倾向，这些都会影响研究结果。


    所以，第三级证据的问题，就是没有随机分配研究对象。


    怎么解决呢？


    如果可行的话，就把病人随机分到拔牙组或者不拔牙组，这叫做随机对照试验。


    这样得出来的结果就更可靠了。


    随机对照研究得到的证据就是二级证据。能够拿出二级证据的医生就非常靠谱了。甚至 FDA（美国食品药品监督管理局）进行新药审评的时候，就看随机对照试验的结果。


    讲完了二级证据，一级证据就容易理解了。


    刚才提到，二级证据很牛，但是有可能受到地区、人种、卫生情况等因素的影响。比如，有可能中国人适合拔牙正畸，但是这个经验放到美国未必可行。


    那怎么办呢？


    这就要讲到第一级证据，称为 Meta 分析（荟萃分析）。


    也就是把全世界发表的随机对照研究都拿过来，用一套科学的方法进行客观评价，得出的结论就更可靠了。


    这就是一级证据，它是级别最高的证据。


    用循证医学获得最佳治疗方案


    掌握了这五种级别的证据，你肯定已经发现循证医学的优势了。


    它最大的优势，就是综合评价当前能够获得的全部证据。一个治疗方法到底好不好，看看全世界的医生们怎么说，这样也就避免了医生个人经验带来的偏差。


    其次，循证医学得到的结论可以标准化推广，避免了因为医生水平差异，导致的治疗水平差异。


    循证医学是让病人获得最佳治疗方案的解决办法。


    2018 年 6 月 30 日，北京国际会议中心，一群顶级医生和人工智能展开了一场大战。考试题目：神经影像学。


    也就是让最牛的医生和电脑比赛，读脑部核磁共振或者 CT 片子。


    首先是比速度。当然是电脑更快，而且比人快了 30 倍以上。


    那准确率呢？


    我们可能认为在看片子或者其他复杂资料的时候，医生的经验太重要了。慢没关系，一定会带来准。


    但是，结果出乎意料。


    这些顶级医生的准确率是 66%，而人工智能的准确率达到了 87%，完胜这些全中国顶级医院的顶级医生。


    大家都说，这是人工智能战胜了医生。


    作为医生，我服。


    但是你一定没想到，人工智能算法的基础，就是综合利用了现阶段医学能够得到的最好资料和证据。所以，它才战胜了医生的个人经验。


    看似是人工智能战胜了医生，其实，人工智能的基础就是循证医学。是循证医学战胜了个人经验。


    ### 划重点


    - 综合现阶段能够获得的全部证据，才能得出最佳治疗方案。

    - 循证医学就是证据+医生经验+患者意愿，核心是证据。

    - 循证医学的五级证据依次是：个人经验，前后对比，对照研究，随机对照，荟萃分析。


    ## 思考题


    关于新生儿是趴着睡好，还是仰着睡好，很多人在争论。运用循证医学的知识，应该怎么找到这个问题的科学答案呢？


    欢迎在评论区留言，和我交流。


