  - '[PAGE 391]


    这些医疗措施都是缓和医疗重要的手段，可以大大地改善死亡质量。毫无疑问，这是最人道的做法，它是用医学让病人可以有尊严地走完生命最后一程。


    最后，缓和医疗也不仅是纯粹的医学干预，应该是身体、心理、精神三个层面的全方位干预。缓和医疗的概念和原则，体现了医学的温情。


    # 生前预嘱是更好的选择


    但是问题来了，每个人又都是社会和家庭中的人，尽管生命权决定归病人自己，但是在现实中还是充满困境。比如病人昏迷，或者其他情况失去选择的能力，这个时候如何保留生命的尊严呢？


    家人意见可能相悖，无法协调，甚至公开对质，互相谴责，闹到法院的案例比比皆是。推行尊严死和缓和医疗在现实中，又会面临各种各样的现实困境。


    那怎么办呢？


    这就要讲到这节课的第三个层面：社会的支持。


    先请你看一封信。


    2017 年 3 月 12 日，著名作家琼瑶老师在 Facebook 上公布了她的公开信，这封信是写给长子陈中维和儿媳何秀琼的。原文太长，以下为节选：


    虽然中维一再说，完全了解我的心愿，同意我的看法，会全部遵照我的愿望去做。我却又怕到了时候，你们对我的爱，成为我“自然死亡”最大的阻力。


    我的叮嘱如下：


    +   一、不论我生了什么重病，不动大手术，让我死得快最重要！在我能做主时让我做主，万一我不能做主时，照我的叮嘱去做！


    +   二、不把我送进加护病房（ICU）。'
  - '[PAGE 392]


    三、不论什么情况下，绝对不能插鼻胃管！因为如果我失去吞咽的能力，等于也失去吃的快乐，我不要那样活着！（鼻胃管是经过鼻子放到胃里的营养管。）


    四、同上一条，不论什么情况，不能在我身上插入各种维生素的管子。尿管、呼吸管，各种我不知道名字的管子都不行！


    五、我已经注记过最后的急救措施，气切、电击、叶克膜，这些全部不要！帮助我没有痛苦地死去，比千方百计让我痛苦地活着，意义重大！千万不要被生死的迷惑给困惑住！（叶克膜就是
    ECMO，也叫“魔肺”，用于支持呼吸和心脏。）


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_392_0.png)


    著名作家琼瑶


    琼瑶老师的这封信本质上就是一种生前预嘱。生前预嘱是在人具有清晰思维的情况下，对自己的生病或者死亡过程提前嘱托。


    尽管我个人认为，琼瑶老师这里面说的很多情况，今天的现代医学还是可以治愈或者恢复的，但是这不是最重要的。最重要的是，她作为一位知名作家和公众人物，用生前预嘱这种形式，提倡科学看待生命和死亡。'
  - '[PAGE 393]


    相比于家人的意见不一，或者因为亲情不舍割离，生前预嘱就是一种更好的选择。


    生前预嘱需要社会的支持。


    凡是年满 **18** 周岁，具有完全民事行为能力的人，都可以通过这种方式对自己的生命作出安排。在我国，已经有了生前预嘱的公益组织和网站，你如果有兴趣也可以去看看。


    生前预嘱的内容通过“我的五个愿望”来实现，包括：


    +   1. 一、我要或者不要什么医疗服务。

    2. 二、我希望使用或者不使用生命支持治疗。

    3. 三、我希望别人怎样对待我。

    4. 四、我想让我的家人和朋友知道什么。

    5. 五、我希望谁帮助我。


    在有些国家，通过立法支持生前预嘱的实现。


    比如 **1976** 年，美国加州通过了《自然死亡法案（Natural Death Act）》，允许不使用生命支持系统来延长不可治愈患者的临终过程，也就是允许患者依照自己的意愿自然死亡。


    在我国，尽管生前预嘱不像遗嘱那样有《继承法》的保护，实践层面会有不被遵守的法律风险。但是毫无疑问，它是推动有尊严死亡的一个有益探索。


    # 划重点


    > 1. 正确认识死亡可以让人实现有尊严的死亡。 2. 自己的成长、社会的支持、医学的温情是让死亡质量提高的解决方案。 3. 善终的含义包括 6 个层面，缓和医疗和生前预嘱是目前做到善终的有益尝试。'
