    在未来，还有可能利用人工制造出新的肾脏，完全解决器官来源和排异问题。这都是新思路。


    医学就是不断地转换思路，开发新技术，寻求新通道的过程。


    20 世纪 70 年代，因为战争，东巴基斯坦有大量的难民涌入难民营。'
