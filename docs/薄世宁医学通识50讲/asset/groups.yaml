    ## 13｜治疗：医学目标与患者需求的互动


    2019-3-11


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    上节课咱们讲了诊断的逻辑，知道了病是怎么确诊的。确诊以后就是治疗，这节课咱们说说治疗。


    要想治疗，首先要明确治疗目标，这才是治疗的核心问题。


    为了理解这一点，咱们先看一个病例。


    ### 治疗的核心问题是目标问题


    1992年，迈克尔·杰克逊出现在罗马尼亚布加勒斯特（Bucharest）演唱会现场。


    当他带上帽子、钻石手套摆出经典Pose的那一刻，全世界都安静了。


    他就这么站着，一动不动三分钟，然后音乐突然响起来，他在舞台上走出了自创的灵动飘逸的太空步。


    台下的歌迷不停尖叫，尖叫声几乎歇斯底里。无数人泪流满面，不时有人晕倒，然后被观众从头顶上架出去。


    那种激情，让人感觉到宇宙都要爆炸了。


    ![加勒斯特演唱会](img/4caf3257bac3bf3ff8bd0728c9b28448_99_0.png)


    这样的一个音乐巨星，同时也是一个备受争议的人。


    有人说迈克尔·杰克逊有钱，有全世界最好的医疗资源。为了改变黑人身份，他把皮肤漂白，移植皮肤。最后身体越来越差。


    还有人说他抹口红、化浓妆、带手套、晴天打着伞，这都是怪癖。


    但是，所有这一切都是误解。这些看似奇怪的行为都是为了治疗。


    根据维基百科以及网络上杰克逊的皮肤科医生提供的资料，杰克逊确诊是白癜风。


    白癜风病人你肯定见过，皮肤一块一块地变白。这种病病因不明，表现为黑色素细胞功能丧失，变白的地方是因为没有色素了。


    全身每个部位都可以发生，尤其是口唇、手背、脸部、脖子和生殖器周围。


    这种病至今也没有确切有效的治疗方法。


    所以，杰克逊的目标不是治愈，也不是改变黑人身份，而是让外表尽量接近正常人。


    他所有的治疗都是围绕着他这个目标展开的。


    刚发病的时候白斑很少，他就在白斑上涂抹延缓变白的药膏。他涂厚妆、抹口红、带手套是为了遮住皮肤上的白斑。


    随着病情加重，白色的皮肤越来越多，范围超过了黑皮肤，他又只能在黑皮肤部分涂抹氢醌这种可以减少色素的药物，也是为了让皮肤颜色看起来均匀一些。


    最后他的皮肤全白了，似乎是从黑人变成了白人，但是这是一种病。医学上根本没有皮肤漂白技术，也不可能移植皮肤去改变一个人的肤色。


    他的治疗目标其实很简单，不是治愈白癜风，而是“能演出”。


    无论是白变黑，还是黑变白，都是为了能让他能够登台。


    在这样的目标和治疗下，他的每场演出都获得了巨大成功。可以说 100 年之内流行音乐史上，都不会再出现能够超越他的人。


    他最后死因也和目标无关，他死于镇静药过量。


    这个病例告诉我们，治疗的核心问题是目标问题。


    治疗要先定目标，治疗是以目标为导向的。这就是关于治疗的第一个层面。


    ### 患者需求决定治疗目标


    那怎么确定治疗目标呢？


    不同的病人有不同的需求。


    治疗的第二个层面，就是根据患者的需求设计不同的治疗目标。


    2012 年伦敦奥运会，110 米栏的比赛现场，13 亿中国人都在紧张地等待“亚洲飞人”刘翔出场。


    当身穿红色运动背心和短裤，号码是 1356 号的刘翔出场的时候，现场响起一片热烈的掌声。


    但是有个细节你可能不知道。


    上场前，医生给他的右脚后跟打了一针。起跑前刘翔微微一笑，枪响后他的起动很好，但是他在跨第一个栏的时候被栏绊倒了，全场观众发出一片遗憾的嘘声。


    最后，刘翔单脚跳到终点，一瘸一拐地退出了赛场。


    ![刘翔。2012 年伦敦奥运会](img/4caf3257bac3bf3ff8bd0728c9b28448_101_0.png)


    刘翔的病叫做跟腱止点末端病（Enthesopathy），也就是脚后跟的肌腱慢性反复牵拉、劳损引起局部炎症和剧烈的疼痛。


    这个病有手术和非手术两种治疗方法。


    手术就是清除病变组织，修复缺损，经过锻炼可以康复。但手术的不利之处是，他在康复前没办法参加那场关键的比赛。


    非手术疗法可以采取痛点封闭，也就是在最痛的点注射药物临时止痛，只管用 1~2 个小时。这么做的风险，就是可能止痛失败，但是毕竟还有希望比赛。


    刘翔的需求很明确，就是带伤也要比赛。


    所以，医生和他选择了非手术疗法。尽管最后这种方法还是失败了，但是他作出了努力。


    假设刘翔的需求是放弃比赛，彻底治愈，那就选择手术治疗了。


    所以，医学上没有绝对正确的最佳解决方案。


    患者需求不同，目标不同，因此治疗方案也不同。


    这就是关于治疗的第二个层面，目标是根据患者需求制定的，患者需求决定了治疗目标。


    ### 用医学目标匹配患者需求


    但是，患者需求只是一种主观要求，不客观也不精确，它和医学目标是不同的。


    比如，对于先天聋哑孩子的父母，他们的需求是让孩子听得见，会说话。


    但是怎么算听得见呢？


    只能听到“咝咝”的响，算不算听见呢？听到所有频率的声音还是某个范围的声音呢？


    再比如，一口烂牙的病人需求是变美，能找个对象。


    那怎么就算美呢？或者把牙弄齐了就能找到对象吗？


    所以，医生必须用客观的数据和指标去匹配患者的主观需求。


    先说聋哑。


    为了满足病人能听到声音这个需求，医生会根据具体情况决定是否植入人工耳蜗。


    这个小机器可以把声音转化为电信号，电信号可以直接刺激孩子的听神经，产生听力。而且孩子听到的和咱们听到的一模一样。这样，他学会的语言咱们才能听得懂。


    ![人工耳蜗](img/4caf3257bac3bf3ff8bd0728c9b28448_103_0.png)


    在这个案例中，医学目标就是保证声音的正常转化和传导。


    手术后还要调节参数，具体到某个精确的数值。比如电刺激模式、通道选择等等。


    让孩子可以产生听觉，这些都是客观数据和指标。


    再说这个一口烂牙想变美的病人。


    医生可以通过牙齿正畸让病人的牙列变整齐，牙齿咬合舒适，边缘精密、光滑、无缝隙，不能宽，不能窄。


    根据绝大多数人的审美观点，牙齐了就可以美。


    而且正畸还可以预防牙周疾病，可以降低癌症、糖尿病、中风以及冠心病的发病率。这些都是客观的医学目标。


    而且，今天的医学还能满足人们各种不以治病为目标的需求，比如：


    - 整形、隆胸、除皱是为了美；

    - 阴道缩紧、男性阴茎海绵体假体植入是为了让生活更多彩；

    - 试管婴儿、人工授精是为了要个孩子；

    - 变性手术是为了满足心理需求。


    所以，患者需求和医学目标是两个概念。


    治疗就是用可以量化的、客观的、标准化的医学目标去逼近患者需求。


    这就是关于治疗的第三个层面。


    但是在很多时候，患者的需求很难满足，会受到各种限制。


    比如医学能够达到的水平、患者的身体条件、经济因素、社会因素，还有会受到法律和伦理的制约。


    患者需求和医学目标也会发生冲突。


    有这样一个病例。


    一个 22 岁，先天性无子宫的女生来就诊，她的需求就是想自己生个孩子。


    这个病例放在以前，患者需求和医学目标就是冲突的。


    没有子宫怎么生孩子呢？不仅患者身体条件不允许，医学水平也达不到。


    但是这种冲突不是永远的。


    2015 年，西京医院妇产科就给这个女生移植了她妈妈的子宫。用这个移植的子宫，她顺利地生下了一个健康的男婴。


    这是全球第 14 个在移植子宫内孕育出生的孩子，在中国是第一例。


    所以，随着医学的进步，医生会想法设法地用科学的医学目标去逼近患者需求，因为治疗的本质就是医学目标与患者需求的匹配。


    ### 划重点


    1. 任何治疗的核心问题都是先定目标，然后围绕目标开展治疗。

    2. 治疗目标必须基于患者需求。

    3. 治疗的本质就是用客观的、可量化的医学目标去匹配患者需求。治疗的过程是医学目标与患者需求互动的过程。


    ### 下节预告


    治疗是围绕目标，那么医生们怎么围绕目标制定治疗方案呢？


    下一讲，我们讲讲临床诊治指南是怎么回事。


    ## 14 | 临床诊治指南：是地板，而不是天花板


    2019-3-12


    你好，欢迎来到《医学通识50讲》，我是薄世宁。


    到医院看病要先诊断，也就是知道了什么病。


    然后怎么治呢？这一步，肯定也是你最关心的环节。这节课就说说这个环节。


    开始之前，我先给你讲个小故事。


    病人肚子疼到医院看病，医生检查完之后说，“你先躺着，等我一会儿”。


    病人躺下等医生，左等不来右等不来。于是他坐起来，发现医生正在上网搜“肚子疼怎么治？”。


    病人“噌”一下子从床上跳下来，一溜烟就跑了。


    当然这是个笑话。


    但是，医生查资料给病人看病可不稀奇，我还真遇见过。


    十几年前，我刚到美国做访问学者，看到主治医生查房的时候，每个小医生人手一个Pad。主治医生说到一个病的时候，每个医生赶紧查，然后按照Pad上面说的给病人开药。


    我当时想，这些美国医生脑子不好使。在中国，医生要是敢当着病人的面查怎么治病，病人肯定吓跑了。


    但是，后来我发现全美国的医生都是这么干的。在今天，全世界的医生，对于绝大多数的常见病，也都是这么干的。


    那你一定好奇医生们在查啥呢？


    他们在查指南。


    指南的全称是临床诊治指南，它的定义是：


    针对特定的临床情况，系统制订出的帮助临床医生和患者做出恰当处理的推荐意见。


    为什么要有指南呢？


    其实，咱们到医院治病最担心什么呢？


    你不说我也知道，你担心自己接受的治疗是不是最好的？医生的水平如何？会不会技术不行？会不会因为想挣钱，过度医疗？


    指南就是解决所有这些问题的。


    它是一套标准化的方案，对医生治病的每一个环节都有建议。


    比如，怎么检查、怎么治疗、怎么手术、怎么用药、剂量多少、联用什么药。几乎所有的常见病都有这么细的指南。


    同时，对于同一种病，不论这种病有多简单，都会用到多个不同的指南。


    就拿阑尾炎这种外科医生入门级的手术来说，也至少要用到 4 个指南。


    麻醉有《麻醉学操作指南》；手术有《阑尾炎诊治指南》；术后要用到《抗菌药物在围手术期的预防应用指南》；如果感染严重，还会用到《抗菌药物临床应用指南》。


    再比如，冠心病的病人，可能要用到至少 10 个指南。包括《高血压管理指南》、《中国心血管病预防指南》等等。


    指南就是这么重要。它几乎涵盖了临床上所有的常见病，以及常见病里所有的类型。


    一个医生规范地应用指南，就可以保证病的基本治疗。也就是说，指南是最基础、最标准、最规范的方案。


    按照这个方案做，就可以避免不同操作者的水平差异带来的治疗差异，还能保证效果、降低风险。


    ### 指南保证基本和规范的治疗


    举个你熟悉的例子。


    遇到心脏骤停的病人，我们应该立刻心肺复苏，不能等。


    这个时候，无论是协和医院、北医三院、华西医院、瑞金医院、同济医院等等这样大医院的医生，还是卫生院的护士，或者是马拉松赛场的急救员，甚至是一个完全不懂医的普通人，只要掌握了这个指南，心肺复苏的操作手法就基本一致。


    指南用规范的流程解决水平差异问题。


    除此之外，指南对于每个环节都有清晰的指示。


    比如，心外按压的次数是 100-120 次/分，按压的深度要达到至少 5 厘米，每按压 30 次，要给病人做两次人工呼吸，还要尽量减少按压中断时间。


    这些清晰的指标保证了一定的成功率，先尽力救命，同时也避免了不规范带来的风险，比如把肋骨压断了等等。


    在临床工作中，越是常见病，研究也就越透彻，它的指南就越规范、越厉害。不按指南操作的风险也越高。


    这是指南的第一个特点，它是地板，保证了最基本、最规范的治疗。


    ### 指南不断迭代升级


    既然指南这么重要，那么制定指南的过程必须科学。


    首先，制定指南用到的科学方法，叫做循证医学。循证，也就是让证据说话，把证据转化为最好的临床指导建议。


    把世界上治疗这个病全部的、最好的证据拿来评估，并根据这些证据制定治疗建议，这就是循证医学。在后面会有一节课专门来讲循证医学，这里就不多说了。


    其次，制定指南的人是这个领域和相关领域的专家，加上基层医院代表，再加上患者代表和循证医学专家，这些人一起检索最好的证据，制定指南。


    指南制定团队的多样性和科学的方法，保证了指南的科学性。


    指南的基础是证据。所以，只要有关键的新证据出现，指南就要迭代升级。


    比如，刚才我说到的《心肺复苏指南》，每年都会迭代一次。


    在以前，按压频率规定为≥ 100 次 / 分，但是到底多少次最好呢？原来的指南没有说明。


    最新版的指南解决了这个问题，它规定 100-120 次 / 分最好。这样既保证了安全，也让按压者能够保存体力，提供高质量的抢救。


    所有的指南都在根据新证据升级迭代。


    比如美国神经病学学会（AAN）要求，每 3 年更新一次对于神经系统疾病的指南。欧洲心脏病学会（ESC）要求，每 4 年更新一次对于心血管疾病的指南。


    有些证据更新快的医学领域，则随时可能更新指南。


    不断地升级迭代，保证了指南的前沿性和时效性。永远是利用最新的证据，给病人制定治疗方案。这是指南的第二个特点。


    ### 灵活运用指南带来更好的治疗


    但是，每个病人又是千差万别的个体，指南只是地板，它不是天花板。这是指南的第三个特点。


    举个例子。


    做双眼皮手术的时候，指南就会根据人的基本情况，包括上眼睑肿不肿、眼睑弧度、走形、眼睛和整个脸的宽度的比例、眼睛的高度等，给出具体的操作方案。


    按照这个方案，每个医生都可以按照传统的“三庭五眼，四高三低”的美学观点割出一个双眼皮，还能保证不出错，别把下眼皮给切了。


    ![双眼皮手术示例](img/4caf3257bac3bf3ff8bd0728c9b28448_110_0.png)


    ![双眼皮手术示例](img/4caf3257bac3bf3ff8bd0728c9b28448_110_1.png)


    但是，指南不是天花板。有经验的医生，可以在这个基础上灵活运用指南。


    比如，不仅保证割出双眼皮，还能根据人的脸型、五官甚至气质，按照东方人的审美观，让人眼睛有神，所谓画龙点睛。


    这就是指南解决不了的问题了。


    再比如，同样是心肺复苏，ICU 的医生和急诊科的医生最有经验，因为抢救太多了。


    病人是完全不同的个体，按照指南保证了流程的规范。


    灵活运用指南，具体情况具体分析，又给指南带来了活力。


    十几年前，我们收治了一个溺水的女大学生。


    这个女生傍晚在学校游泳，被发现的时候已经仰着漂在水面上了。校医院的医生立刻给她做心外按压，气管插管，一路按压着送到了医院。


    校医院的医生按照指南按压，给这个病人争取了时间。如果只是干等着，等送到医院就算有再好的设备，做什么也都晚了。


    这个女生送过来后，我们立刻抢救，但是太难了。


    无论怎么按压，监护仪上始终连一个自主心跳的电信号都没有。她缺氧时间太长了，希望渺茫。


    按照指南，我继续按压。


    我的胳膊都压疼了，大颗大颗的汗从额头上滴下来，滴到她的身上。


    这样坚持了十几分钟，不停地按压、给药、评估。


    这个时候，监护仪上突然出现了几个微弱的电信号。


    这些信虽微弱，虽然不是正常心脏起搏的信号，但是我知道一旦出现，就有可能是微弱的希望。


    我继续按压。


    我认为这几个电信号实在是太来之不易，虽然弱，但这可能是偶然的机会。如果只按压，那么这偶然的信号可能还会消失，所以我要放大这个信号。


    我在按压的同时，立刻让护士给她用提升心率的药。效果特别好，她的心跳快速地提了上来。


    但是，这种心律仍然是一种紊乱心律，可能是昙花一现，很快就会消失，同时也不能产生有效的血压。


    这个时候怎么办？


    是先升血压呢？还是先维持这种紊乱的心律呢？或者是用药物纠正这个心律呢？


    这些指南上没有。


    我判断，只有先把血压提起来，才可能让缺血的心脏给自身供上血，下一步就有可能会恢复正常心律。


    但是这个操作指南上也没有。


    我立刻让护士给病人注射了升压药。她的血压快速上升，但是维持不到一分钟，又迅速下降了。


    接下来，必须持续升血压，这就需要快速建立一条深静脉通道。


    我立刻换别的医生按压，我在他短暂的按压的间歇期间，从病人的锁骨下穿刺，将一根导管放进了连接右心房的大静脉，这样就可以持续注射升压药了。


    接下来奇迹出现了，这颗已经停跳了不知道多久的的心脏，终于恢复了正常心律。


    ### 划重点


    1. 指南适用于大多数病人。它用规范降低水平差异，用科学保证疗效，控制风险。

    2. 指南制定的基础是证据，会随时更新和迭代。

    3. 灵活运用指南，可以给病人带来更好的治疗方案。


    ### 下节预告


    下一讲，我们讲讲医学治疗方案，是怎么以最简单的形式呈现给你的。


    ## 15 ｜药：医学解决方案的物质载体


    2019-3-13


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    咱们今天说说药。


    提到药，你最关心什么呢？


    我们都希望药的疗效好、安全、没有副作用。这个标准，是所有人包括医生眼里的“好药”。


    那怎么做呢？


    你会说国家会用严格的法律监管药物流通的每个环节，来保障药的有效和安全。


    你说的这些都没错，但是在我看来，真正的好药却不是这么来的。


    ### 什么是药？


    要想知道什么是好药，咱们就必须先知道什么是药。


    我们通常认为药就是治病的。对，但是不全面。


    《药品管理法》给药的定义是：


    药是用于预防、治疗、诊断人的疾病，有目的地调节人的生理机能，并规定有适应症或者功能主治、用法用量的物质。


    我解释一下。


    首先，药可不只是治病，能够预防、诊断的也是药。


    比如，疫苗是为了预防；做增强 CT 打到血管里的造影剂，是为了检查。这些都是药。


    其次，这个定义更重要的是调节生理机能。


    机能，就是机制和功能。生病有发病机制还有功能变化。


    所以，治病必须打断发病机制，改变细胞或者器官的功能。而承载这个改变机能任务的就是药。比如：


    - 抗生素通过杀死或抑制细菌，治疗感染，是打断发病机制；

    - 退烧药通过调节体温调节中枢的功能，达到退烧；

    - 口服避孕药通过抑制排卵，防止怀孕；

    - 紧急避孕药阻止受精卵在子宫内膜着床，达到避孕。


    但是，我认为药品的专业定义并没有讲清楚药的实质。


    药的实质是，医学解决方案的物质载体。


    什么是载体呢？


    我举一个著名的科幻小说——《2001：太空漫游》（2001: A Space Odysssey）的例子。


    小说里有一个细节：人类在月亮上发现了一块黑色石碑并且测量它，发现它的长、宽、高三个边的比例是1:4:9。


    做到这个容易。


    但是这个石碑的神奇之处在于，不论人类用多么精确的方式测量，它的三个边比例永远是1:4:9，没有一丝一毫的误差。


    ![太空石碑](img/4caf3257bac3bf3ff8bd0728c9b28448_116_0.png)


    这种科技水平显然人做不出来。


    我解释一下，人类做出来的东西，经过极度精确的测量后，比例可以接近整数，但是永远做不到完全是个整数。


    这个石碑一定是地球以外某个未知文明留下的，也就是外星人。


    小说的作者亚瑟·克拉克（Arthur Charles Clarke）写道：


    这是那个未知文明以这种方式，狂妄地展示了自己的力量。


    外星人就是用石碑这种简单的呈现形式，展示了他们整体的科技水平。


    这个石碑就是承载外星人科技水平的物质载体。


    ### 药是医学解决方案的物质载体


    讲到这你就明白了，药也是这样一个载体。


    药承载的是所有医学知识共同体对于某种病的解决方案。


    比如，咱们嗓子发炎了，医生会开几片阿莫西林。

    '
  merge: 0
- raw:
  - '[PAGE 117]


    咱们拿到手的是简单的阿莫西林，但是它的背后却是一整套复杂的知识体系。


    比如嗓子疼和细菌的关系，细菌的结构，药物杀灭细菌的机制，药在人体怎么代谢，半衰期是多少等等。


    阿莫西林本质上就是，对嗓子发炎这个病的所有医学解决方案的物质载体。


    病人不需要了解一片药背后复杂的知识体系，只需要简单地按照医嘱吃药就可以了。


    药用一种简单形式，交付给病人一个复杂的认知体系。


    这就是关于药的第一个层面：药，是医学解决方案的物质载体。


    只有理解了这个概念，你才能知道一个好药，是怎么来的。


    # 药反映医学认知水平


    只有医学整体认知水平提高了，才可能交付出更好的载体，也就是好药。这就是关于药的第二个层面。


    每一种药，都代表了不同年代的认知水平。


    在认知水平低下的年代，人类只能靠偶然来发现药。


    实际上，咱们吃的很多药是意外所得。


    比如“伟哥”。本来是治疗心脏病的药，结果发现男病人吃了以后各个都“挺高兴”，原来它可以帮助勃起。所以，“伟哥”就用于治疗阳痿了。


    这个药物的研发过程，就是某种物质和我们希望出现的解决方案偶然匹配上了。找到这个载体是意外所得。


    后来，医学对于病的研究越来越深入，知道了病的机理，药物研发就变成了用已有的化学分子，一个一个去试，看能不能找到合适的药。'
  - '[PAGE 118]


    这虽然比偶然发现靠谱了一点，但这依然是一个认知水平相对低下的时代。


    用这种方法研发新药的成功率低，耗时费力。更关键的是，用这种方法找到的药不精准，一个药通常可以影响很多机能。


    我们希望出现的作用就是治疗作用，不希望出现的是副作用。


    还说“伟哥”，靠扩张血管来增加海绵体的供血，带来勃起。但它也同时扩张很多其它部位的血管，这样也就有了副作用。比如眼睛胀、头疼等等。


    整体认知水平提高，也就能交付更好的药。


    因此，药物研发进入了一个新时代。


    在电影《我不是药神》的情节里提到一种病——慢性粒细胞性白血病。


    以前，医学对于这个病的认知很粗浅，治疗只能靠普通的化疗药。


    化疗药会带来巨大的副作用：倦怠、乏力、脱发、恶心、呕吐、消瘦、器官功能损害。同时，治疗效果还不坏，病人生存率很低。


    那个年代，无论怎么监管生产过程，医生怎么调整用药，患者怎么配合，药物的有效性也不可能再改善，副作用也不可能再缩小了。


    新的研发思路，让好药的出现成为可能。


    也就是先找这种病的发病机制，越精准越好，如果找到一个关键点就更好了。


    到了1983年，医生们找到了这个关键点，也就是慢性粒细胞性白血病的罪魁祸首，是一段称为 BCR-Abl 的基因。这段基因合成的蛋白，不断地给细胞“乱发信号”，让细胞变成癌细胞。


    到此，发病机制明确了，并且精准到了一个靶点。'
  - '[PAGE 119]


    接下来，根据靶点设计出了专门的分子药物，它不仅稳准狠，而且减少了副作用。


    这个药就是格列卫，它带来了一个精准药物研发的新时代。


    在它以前，只有不到 30%的病人能够活过 5 年；有了格列卫，这一数字提高到了 89%。5 年之后，接近 99%的病人可以达到完全缓解。


    而且药物的副作用也大大降低了。服用这种药的病人甚至看不出任何异常，可以和正常人一样生活和工作。


    格列卫就是理想中的好药。


    这就是关于药的第二个层面：不同水平的认知体系，一定会出现不同水平的载体。


    认知越来越精细，好药出现的可能性就越来越大。这是解决好药研发的最核心的思路。


    认知提高保障药的安全有效


    医学整体认知水平越来越深入，不仅可以造出好药，还可以让曾经的毒药救命。如果认知错误，好药也可以杀人。


    这就是关于药的第三个层面。


    比如，潘金莲毒死武大郎的砒霜，它的化学名称是三氧化二砷。


    在所有人眼里，砒霜是毒药，可以害人。


    但是，随着认知水平越来越深入，今天的医生用所谓的毒药——三氧化二砷，治疗某种类型的急性白血病。联合其他药物，可以将这种凶险、死亡率很高的白血病的 5 年无病生存率，提高至
    90%以上。


    相反，如果不能提高认知水平，好药也可以害人。'
  - '[PAGE 120]


    比如，现在治疗麻风病结节性红斑，还有多发性骨髓瘤这两种疑难病有一种药，叫做沙利度胺，也叫反应停。


    但是，这个药在几十年前就是臭名远扬的“魔鬼”。


    它曾经造成了全球15000多名孩子畸形，造成的流产、早产、死胎更是不计其数。


    这些畸形婴儿的胳膊、腿都很短，手和脚直接长在躯干上，就像海豹一样。所以也被称为“海豹儿”。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_120_0.png)


    沙利度胺致畸的“海豹儿”


    所有的医生和药物研究者，都把这件事看做药品安全的一个血淋淋的反面教材。


    但是客观地说，反应停这个药没错，错就错在那个认知水平低下的年代。


    这个药就是用错了人，用错了适应症。它用在改善孕妇早孕反应上，所以好药成了杀人的恶魔。


    所以，对于药的安全性和有效性，法律监管只能保证它是一个“合格”的药。


    但是，让药更安全、更有效、副作用更小，最终依靠的是整体医学认知水平的提高。


    # 划重点'
  - '[PAGE 121]


    +   1. 药是医学解决方案的物质载体，它背后是整个医学认知体系。 2. 认知越来越深入，是增加有效性，降低不良反应的核心。


    # 思考题


    随着整体认知的提高，很多曾经的“副作用”变成了“正作用”，你还能举几个你知道的例子吗？


    欢迎发到留言区，一起互动。


    # 下节预告


    下一讲，我们讲讲为什么医院这种形式，成为医疗服务模式的中心。'
  - '[PAGE 122]


    # # 16｜医院：医疗服务最高效的组织形式


    2019-3-14


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    现代医疗服务要解决两个关键问题：


    第一，医疗服务的质量。


    第二，医疗服务的效率。


    也就是说，如何让在单位时间内，把高质量的服务用在更多的病人身上。


    为了解决这两个核心问题，在全世界都形成了以医院为中心的服务模式。


    这节课只讨论一个问题：医院为什么可以成为医疗服务的中心？


    高度分工协作


    为了说明这个问题，我们从一个疑难病例讲起，这次你先来当医生。


    病人是一个 10 岁男孩。脖子疼，两条腿没力气。


    他的脖子撑不住脑袋的重量，所以只能低着头，上课必须用双手支着下巴才能看黑板。'
  - '[PAGE 123]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_123_0.png)


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_123_1.png)


    正常颈椎是稍微向前方弯曲的，这是为了直立行走。但是，这个孩子的颈椎严重向后弯曲，这在医学上叫做严重的颈椎后凸畸形。


    这样的畸形会带来大问题。


    一方面，脖子支撑不住头的重量，头会把畸形弯曲的颈椎压得越来越弯，所以他抬不起头。


    另一方面，畸形的颈椎会压迫颈部的脊髓、气管、食管、血管。现在是两条腿没劲儿，再进展四肢都可能瘫痪。


    这个病诊断不难，怎么治呢？


    你可能会说做手术。但是，手术的难度太大了。'
  - '[PAGE 124]


    普通的颈椎手术，对于一个骨科医生不算难。


    但是这个病人曾经做过一次手术，再加上畸形，现在他的局部解剖结构乱了，手术风险也就增加了无数倍。


    其次，这个手术的关键除了矫正畸形的弯曲，还要给颈椎打上固定架子，用外力辅助，这样才不会复发。


    但是这个孩子骨发育不良，在这种畸形的椎体上打钉子，风险又增加了很多。


    还有，这个手术要做到第一节和第二节椎体，也就是紧邻大脑的寰枢椎。稍有偏差病人就会高位截瘫或者死亡。


    所以，找到能做这种手术的医生才是关键。


    找谁呢？我相信很多骨科医生都会推荐孙宇。


    孙宇是我们医院的骨科教授，主要研究疑难的颈椎畸形。每年他会做 400 例颈椎手术，其中有 100 例左右，都是疑难畸形。


    病人来北京找到了孙宇，孙宇看过病例，说：“我给你做。”


    孙宇的底气来自于他的个人技术，同样重要的，是他背后医院的整体实力。


    对于这种疑难病例，能力再强的专家一个人也解决不了全部问题。


    手术前，孙宇找到了全部相关科室的医生会诊。


    我们把这种工作模式叫做疑难病例的多学科会诊制度，也就是所有相关科室的人聚在一起讨论问题。


    骨科要制定手术方案矫正这个畸形，同时还要为这个孩子发育不良的脊柱准备特殊的手术器械；麻醉科要考虑怎么给孩子做麻醉；呼吸科要分析通气问题。'
  - '[PAGE 125]


    对于 10 岁的孩子，还要考虑到手术后的药物和营养供给，就需要营养科、儿科、药剂科来解决。


    我所在的 ICU，要保证手术后的安全，准备好处理各种意外情况。


    所以，到医院看病，你看到的是分工，我看到的是协作；你看到的是单点，我看到的是网络；你看到的是某一个专家，我看到的是整个医院平台。


    在多个学科的共同参与下，这个孩子终于完成了手术。


    这个手术能顺利完成，有一项前沿技术——手术导航，起了大作用。


    以前，做手术的时候总有医生看不到的部位。所以，无论医生经验多么丰富，也有误伤神经血管的可能。


    尤其是对于这个孩子，他的局部解剖结构已经乱了，而且椎体畸形，手术风险可想而知。


    手术导航相当于在手术器械上加了一个 GPS，钉子打到哪儿了，刀切到什么部位了，都可以在屏幕上实时地显示出来。这种技术让这台手术更快速、精确、安全。


    正因为高度分工，才让每个领域的研究越来越深入，带来最前沿的成果。医院又用协作形成了网络，才能够治疗疑难病和复杂病。


    今天，不仅是医院内部，医院和医院之间也在逐步形成分工协作的网络。


    比如，咱们国家正在推行的分级诊疗，本质就是分工协作。


    乡镇卫生院、社区服务中心保障基础的医疗保健，慢病管理、健康教育可以完成疾病的初诊。


    大医院和专科医院对于疑难病、复杂病、急性病有能力有经验。'
  - '[PAGE 126]


    大医院和基层医院相互转诊，急性病在大医院得到有效治疗后，还可以转到基层医院继续康复。


    这就是基层首诊、双向转诊、急慢分治、上下联动。


    只有在医院这个平台上，有了分工和协作的基础，才让医生的技术实现单点突破。


    这些优势技术协作起来，才可能为病人提供高质量的服务。


    医院和医院之间的分工协作，不仅保证了质量，还能让资源得以充分利用。


    # 能量高效利用


    从分工协作这个角度，能最直观地理解医院的运行。接下来，我换个角度再带你认识医院。


    先请你想一个问题：以前都是医生上门去给病人看病，为什么现在却是病人去医院呢？


    先说医生。


    孙宇教授专门的研究方向是疑难颈椎手术，那么他上门去给病人看病和各地的疑难病人都过来找他，哪个效率更高？


    当然是到医院了。


    假如现在你是管理者，有孙宇这样一个高水平的医生，你怎么让他充分发挥价值呢？


    就拿我们医院来说，日门诊量是 1.5 万人左右，每年就要为大约 500 万病人解决就医问题。


    只有医院这种形式，才能让孙宇教授的能量和最需要这种手术技术的病人匹配，达到最高效的利用。


    再说设备。'
  - '[PAGE 127]


    检验科、放射科、手术室等等这些辅助科室具有大量的医疗设备。统筹利用，又让这些设备的能量和病人高效匹配。


    医院为医生赋能。不同专业医生的能量汇聚起来，又推动医院的发展。


    所以，医院这个平台让医生、设备、技术的能量，最高效地匹配和利用。


    # 信息高效流动


    说完能量，咱们再说说信息。


    吴军老师说过：


    > **世界上唯一不变的就是变化，这个变化的过程记录下来并传递出去，就是信息。**


    同样，医院这种形式让信息能够高效流动和利用。


    在医院，每个医生都是自己研究领域信息的拥有者。信息产生大量的前沿知识，但是，怎么让这些信息迅速扩散到所有的医疗服务现场呢？


    首先，信息的沟通和流动才会带来更新，不断更新才可能带来前沿信息。


    咱们说的这台复杂手术，不仅孙宇，全部参与治疗、会诊、手术的医生和护士，都获得了不同领域的信息。


    他们又把自己领域最前沿的信息集中到这个病人的治疗上，这些就成了治疗复杂疾病的最佳信息。


    其次，我们说的“见识”，就是先有“见”，才有“识”。


    见过大量的病例，才能积累大量的经验和教训，“我见过”是“我可以”的底气。


    在医院，每天有大量病人就诊、治疗，这是医生重要的信息来源，甚至超过了书本上的信息。'
  - '[PAGE 128]


    病人为医生积累信息和经验提供了重要来源。


    说回刚才的病例，这种严重的颈椎后凸畸形并不多见。以前，医生掌握的信息量很少。


    但是在医院这个平台上，在不同医院组成的网络体系里，“孙宇对这种疑难手术有经验”这个关键信息，在医院内会传递给所有医生。还会通过医院网络、医院之间的学术交流、相互转诊，传递给其他医院和其他医生。


    那么，这种疾病的治疗必然会越来越成熟。


    但是，这些关键的信息最怕什么呢？怕丢失，怕有偏差。


    所以，医院又用专业化的传承体系，避免了信息偏差或者丢失。


    比如，带教体系、专家查房、教授会诊、多学科会诊，这让年轻医生可以不断地学习。同时，不同的医生查房、会诊讨论，也避免了个人信息偏倚。


    再比如，医院用病案系统管理每个病人的信息，这些信息存储下来永远不会丢失，可以一代一代传承下去。


    医生们通过写病历汇总关于这个疾病诊断和治疗的信息，新医生学习老病例又学习了前辈的经验。


    信息经过不断传递、更新、迭代，才形成今天的医疗知识体系。在医院这个平台上，信息得到了最高效的利用和传递。


    所以，即便你拥有私人医生对你提供日常的健康建议，有了牙病、眼病或者其他小毛病，你还可以去诊所。


    但是，只要是大问题，最终解决还需要依赖医院。


    医院这种组织形式，无论是从分工协作，能量匹配和利用，还是信息流动和传承各个层面，都让医疗服务的质量和效率做到最高。'
  - '[PAGE 129]


    # 划重点


    1. 医疗服务要解决两个问题：服务质量、服务效率。2. 医院高度分工协作，才能汇聚前沿技术解决难题。3. 医院让能量高效匹配利用，让信息充分流动传承。医院是医疗服务高质、高效的组织形式。


    你肯定还关心那个颈椎畸形孩子的治疗效果。


    这个孩子前后经历了大大小小4次手术，最后顺利出院了。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_129_0.png)


    手术后的颈椎


    致谢：感谢在本案例分析中北京大学第三医院孙宇医生、周菲菲医生给予的无私帮助。


    # 下节预告


    下节课，我们讲进保障了最大多数人利益的举措——公共卫生制度。'
  - '[PAGE 130]


    # **17 ｜ 公共卫生：性价比最高的健康工程**


    2019-3-15


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    咱们今天说说公共卫生。


    在很多人眼里，公共卫生不外乎就是处理垃圾、给水消毒和管理卫生，好像没什么大不了的。


    但是如果这么想，可就想简单了。


    在我看来，公共卫生对人类健康功不可没，它是人类历史上性价比最高的健康工程。


    用世界上最“丑”的颜色禁烟


    先请你做一个心理测试：提到绿色，你会想到什么呢？


    是不是想到了生机和希望？


    那你看看下图这个绿色：'
  - '[PAGE 131]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_131_0.png)


    潘通“鸭屎绿”色


    这个图上的绿色叫做“鸭屎绿”，这个颜色由美国潘通色彩研究所（Pantone Color Institute）设计，名叫潘通 448C。这个颜色会让你联想到什么呢？


    人们用“死亡”、“肮脏”、“像沥青一样”这三个词来描述这个颜色。


    但是，这个难看的颜色却成为澳大利亚香烟烟盒的底色。


    这样的烟还卖得出去吗？


    确实，以前澳大利亚的烟盒不是这个颜色，而是光鲜夺目的。


    这引起了公共卫生学者反对：明明是有毒的东西还做得这么鲜艳，这对民众不公平。呼吁政府得管。


    在它们的努力下，烟盒上终于出现了一行小字儿：Smoking damages to your lungs（吸烟对肺不好）。


    但是，学者仍然不满意，继续呼吁。他们认为烟盒上应该有图有真相。'
  - '[PAGE 132]


    到了 2006 年，政府就规定烟盒上必须有图，而且烟盒背面图画的面积必须占 90%。


    这些图是消瘦的身体、长了癌症的肺、烂掉的脚趾头、溃烂的血管、骷髅、死亡，怎么恐怖怎么来。这么一来，烟草销量迅速下降。


    烟草商坐不住了，那怎么办呢？


    他们发现好看的颜色，比如红色、白色、绿色依然可以刺激购买。所以，他们就烟盒的颜色做得越来越鲜艳。


    但是，这个阴谋很快就被政府发现了。既然烟草商用颜色对抗，那政府就强制他们用最丑的颜色，也就是上面图片里的“鸭屎绿”。


    这种颜色给人脏和恶心的感觉，政府觉得用它来做烟盒最好。


    2012 年，澳大利亚政府强制规定烟盒必须使用这种最“脏”的潘通 448C 作为底色，烟盒上必须有大幅的恶心图片。


    除此之外，明示危害的字号规定印多大，就必须印多大，让烟草商没有钻空子的空间。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_132_0.png)


    政府规定的烟盒样式'
  - '[PAGE 133]


    这么一来，澳大利亚烟草销量呈现断崖式的下降，而且再也没有回升。


