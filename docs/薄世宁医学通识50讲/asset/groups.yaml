    # 27 | 麻醉：不疼，才有无限可能


    2019-3-25


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    按照时间发展脉络，这节课说说医学发展的第三个里程碑——麻醉。


    在美国波士顿公园，距离开国总统华盛顿纪念碑不远的地方，矗立着另外一座纪念碑。但是，它纪念的却不是某个伟人，而是一种麻醉药——乙醚。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_208_0.png)


    为什么要给一种药竖一座纪念碑呢？


    因为，麻醉的出现，是医学发展的分水岭。


    有了麻醉，外科手术从野蛮血腥走向了安全和文明。'
  - '[PAGE 209]


    有了麻醉，很多治疗技术才得以实现。


    有了麻醉，医学伟大的人道主义精神才得以体现。


    麻醉只有一个简单的作用：让人不疼。咱们先从疼来说起。


    # 疼了未必不死：一台死亡率 300% 的手术


    麻醉出现前，医生们用病人的疼来换不死。


    什么意思呢？难道不疼就得死吗？


    对。


    在 200 多年前，人们要是得了必须做手术的病，比如截肢、胃穿孔，要么等死，要么就得忍着疼做手术。


    医生怎么做呢？


    要么让病人喝醉了再上手术台，要么就一根子打晕病人，然后把病人捆在手术台上，还得找三五个大汉把人按住。这个时候，医生赶紧开刀，速战速决。


    病人为了活命就得疼，医生为了救命就得快。


    据说，当时俄国一个医生可以在三分钟锯断大腿，半分钟切掉乳房；法国一个医生可以在 24 小时给 200 个病人截肢。


    当时手术最快的人，要数英国医生罗伯特·李斯顿（Robert Liston）。他能在 28 秒内，截掉一条腿。人称“小李飞刀”。


    那么疼了就一定不死吗？


    未必。'
  - '[PAGE 210]


    下面这台手术，不仅病人死了，无辜者也死了。这是人类医学史上唯一一台死亡率 300% 的手术。故事的主角就是刚才提到的“小李飞刀”——李斯顿医生。


    **1842 年，**李斯顿在做一台截肢手术的时候，手起刀落砍下了病人的一条大腿。但是，现场同时响起了三个人的惨叫。


    因为砍得太快了，他不仅切掉了病人的腿，还把助手的手指头，和一个围观的男性群众的要害都切了。


    后来，截肢的病人、被砍掉手指的助手、还有那个倒霉的观众，相继因为出血和感染死了。一刀三命，这台手术也成了医学史上死亡率最高的手术。


    这就是为了不死只能疼的时代，疼了也未必不死。


    但是，我必须为李斯顿医生说句话。他可不是庸医，实际上，他是那个时代最优秀的外科医生之一。


    只能说，这台手术是那个时代医学局限性的缩影。


    就是因为疼，手术必须做得快。那么肯定不细致，导致死亡率高。当时外科大手术的死亡率超过 **70%**。


    说到底，疼的问题不解决，外科手术就没办法往前走。


    # 不疼，也可以不死


    进入 **19 世纪，**麻醉终于诞生了。


    麻醉做到了不疼。不疼，又为医学发展带来了无限可能。从此，不疼也可以不死了。


    麻醉是怎么出现的呢？'
  - '[PAGE 211]


    19 世纪初的时候，美国上层社会有一种时尚，就是在聚会的时候吸笑气。笑气的化学名称是一氧化二氮。


    吸了笑气的人特别亢奋，会哈哈大笑，所以它叫做笑气。当时的人们吸这个东西，就是为了玩得更嗨。


    有个细节，就是人吸了笑气以后，哪怕磕得鼻青脸肿也不会觉得疼。


    就是这个大多数人都没当回事的细节，被一个美国医生——克罗夫·朗（Crawford Long）注意到了。他想，这东西能不能用来给人做手术呢？


    有了这个想法，朗医生搞起了研究。结果他发现了一种跟笑气类似的东西——乙醚，而且乙醚的麻醉效果比笑气还好。


    1842 年 3 月 30 日，这是人类医学史上，值得被牢牢记住的一天。


    这天，朗医生给病人吸入乙醚，成功地进行了世界上第一台麻醉手术。病人不仅没死，而且还不疼。从这天开始，医学进入了“不疼的时代”。


    3 月 30 日也被定为“国际医生节”，就是为了纪念麻醉给医学带来的巨大改变。


    1853 年 4 月，34 岁的英国维多利亚女王使用麻醉无痛分娩，顺利地生下了一个聪明健康的小王子。这是推动麻醉普及的一个里程碑事件。


    人们就想，既然女王都麻醉了，而且麻药对大人、孩子没什么大影响，这事儿靠谱。


    这样，麻醉在全世界快速推广起来了。


    而这个时候，距离李斯顿医生那台死亡率 300% 的手术，也才仅仅过去了 11 年。如果李斯顿当时有麻醉，这个高手也就不会造成一刀三命的悲剧了。


    麻醉发展到这个时候，手术可以不疼，病人还可以不死。生孩子也可以不疼了。'
  - '[PAGE 212]


    复杂精细的外科手术得以实现


    后来，更多的麻药出现了。


    医生发现，很多手术不一定必须全身麻醉。也就是说，不必让病人睡着了再手术。只让需要手术的地方不疼就可以了。


    比如，给胳膊做手术，麻醉医生就在病人胳窝下面的神经里注射麻药。这样，手臂不疼了。这就是局部麻醉，它让麻醉更加人性化。


    这个时候，麻醉做到了想让哪儿不疼，哪儿就不疼。


    再发展，麻醉从外科中独立了出来，成为了一门独立的学科，有了专职的麻醉医生、麻醉护士。


    比麻醉自身发展更重要的是，它让以前很多无法开展的手术成为可能。在不疼的基础上，复杂、精细的外科手术得以实现。


    比如，进行肺癌手术的时候，麻醉医生可以让病人单肺通气，也就是让两个肺中的一个肺来呼吸，把另外一个肺留给外科医生做手术；


    再比如，如果出血量大，麻醉医生可以人为降低病人的血压，这样出血速度就慢下来了。


    甚至，体温也是可以控制的。


    做心脏和大血管手术的时候，为了不让病人的重要器官缺氧，麻醉医生甚至可以把患者的体温降到最低 16℃。


    今天的外科，已经发展出了上千种手术。手术的复杂程度、精密程度，都超过了前人的想象。


    我们可以打开人的大脑和心脏，在以前人们认为的生命禁区做手术；我们还可以开展最新的机器人手术，让手术变得更微创。'
  - '[PAGE 213]


    医生不用再因为疼，而去尽量缩短时间导致手术粗糙。据我所知，最长的手术时间记录是 96 个小时。


    所有这些，在麻醉术出现之前，有谁敢去想象呢？


    麻醉不仅保障了外科手术的发展，而且让手术过程更安全。麻醉医生是负责手术安全的第一责任人。


    # 麻醉应用于其他治疗技术


    在不疼的基础上，不仅是外科手术，很多治疗技术都用到了麻醉。麻醉让医疗更安全高效。


    比如，传统观念认为女人生孩子就该疼。


    无痛分娩，让分娩时的疼痛减轻，甚至消失。减少产妇分娩时的恐惧和产后疲倦，最大程度地保护孕妇和胎儿。


    在美国，分娩镇痛率已经大于 85%，在英国已经大于 90%。


    而且在整个分娩过程中，产妇意识清醒，能主动配合并积极参与整个过程。生产完很快就可以下地活动，这有利于产后恢复。


    麻醉，让“女人生孩子必须疼”这个老话成为历史。


    再比如，无痛胃镜、肠镜也用到了麻醉；试管婴儿技术穿刺取卵，无痛膀胱镜，各种深部穿刺，组织活检，这些都用到了麻醉。


    在 ICU，我们联合应用麻醉药物中的镇静药和镇痛药，让病人做到安静、不疼。


    这些药物减少了 ICU 病人一些严重的并发症，比如消化道大出血，以及心肌梗死的发生率，保证了病人的安全。'
  - '[PAGE 214]


    同时，麻醉还涉及到了人的心理层面。


    一台全麻手术，不仅要保证病人在手术过程中不疼、不动，还要做到不知。这是从心理层面关心病人。


    如果病人可以感知手术场景，以后就会出现心理创伤。


    再比如，晚期癌症病人会痛不欲生，吃不好睡不好，甚至很多病人会抑郁、自杀。


    在麻醉基础上衍生出的疼痛治疗，可以用各种药物，甚至手术方法，解决这类病人的疼痛问题，让病人能够远离疼痛，有尊严地走完生命最后的时光。


    麻醉，体现的不仅是科学，更是医学的人道主义光芒。


    # 划重点


    +   1. 疼，阻碍了外科手术的发展。 2. 不疼，带来了复杂、精细的外科手术，还带来了其他治疗技术的发展。 3. 不疼，体现了医学伟大的人道主义关怀。


    # 下节预告


    医生不是医疗的全部，下一讲，我们讲讲决定医疗质量的关键要素——护理。'
  - '[PAGE 215]


    # 28 | 护理：既是医嘱执行者，又是安全代言人


    2019-3-26


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    上节课，咱们讲了麻醉。


    麻醉让医学很多治疗技术，尤其是外科手术得到了发展。


    但是，病的恢复却不只是诊断、治疗这么简单。护理是不可缺少的另外一项技术。


    在很多人眼里，护理不重要。决定治疗效果的是医生的技术，病治得好不好，就看医生那一刀。


    真的是这样吗？


    # 统计学家——南丁格尔


    其实，想知道护理的重要很简单。那就看看，有护理和没护理有什么区别。


    我找到了一个数据。这就是 1854 年克里米亚战争中，英军伤员死亡率对比。


    当时，英军有军医，但是没有专业的护士，伤员死亡率在 42% 以上。


    有了专业护理以后，伤员死亡率一下子降到 2.2%。也就是说，没护理以前 100 个伤员要死 40 多个，有了护理，只有 2 个死亡。


    创造这个奇迹的人就是南丁格尔。


    南丁格尔咱们太熟悉了——“提灯女神”。国际护理的最高奖是南丁格尔奖，每年 5 月 12 日的国际护士节，就是她的生日。


    但是，南丁格尔的另外一个身份你可能不熟悉——统计学家。'
  - '[PAGE 216]


    南丁格尔分析了克里米亚战争中英军的死亡原因。发现，真正在战场上战死的士兵不多，反而大部分死亡，是战地恶劣的卫生条件和缺乏护理导致的。


    她把这个情况做成了一张图，并用它说服了军方高层，这才把专业护理团队带入战地医疗。


    这个图的形状像一朵玫瑰花，所以也叫“玫瑰图”。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_216_0.png)


    每块扇形代表各月份士兵死亡人数。红色和黑色代表战争和其他原因致死的士兵数，蓝色代表缺乏护理而感染致死的士兵数。


    就这样，南丁格尔带着专业培训过的 38 名护士，改善卫生条件，开展专业护理。伤员死亡率迅速降低为没有护理时的 1/20。这是一个令人震惊的数字。


    所有的文献和资料上，都在强调南丁格尔身上的关爱精神，这点没错。


    但是，我认为她更伟大的地方还有三点：


    第一，她证明了治疗并不只是吃药和手术。医生不是医疗的全部，没护理不行。


    第二，护理也并不只是关怀，它更是一门技术。


    第三，她开创了专业化护理教育。护理从学徒制转变为学校教育。'
  - '[PAGE 217]


    今天，护理已经成为一门独立的学科，是独立于医生之外的。


    在我国，护理学是一级学科，与临床医学平行。目前，我国有 145 所高校招收护理本科，其中 22 所设置了护理学博士点。


    作为一名临床医生，我怎么看护理的作用呢？回答这个问题之前，咱们先回忆一件事。


    # 护理：决定医疗质量的关键因素


    曾经有一项风靡社交网络的公益活动——冰桶挑战赛，可能你还有印象。


    就是拿一桶一桶的冰水，自己把自己洗个透心凉，体验逐渐被冻住的感觉。


    当时很多名人都参加了，包括美国前总统奥巴马，还有罗胖。'
  - '[PAGE 218]


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_218_0.png)


    罗胖参加冰桶挑战


    这个活动的目的，是呼吁人们认识并关爱渐冻人。


    渐冻人是一种运动神经元病，属于罕见病，在中国的发病率大约是 3/10 万。物理学家霍金得的就是这种病。


    病人逐渐出现肌肉无力，最后所有的肌肉都瘫痪了，就像被“冻”住了一样，只有眼睛能动。目前对这种罕见病没有特效药，也就是说医生无计可施。


    最可怕的是，病人的意识和皮肤的感觉正常，哪里不舒服，想做什么，心里都明白但是自己却表达不出来。负责呼吸的肌肉瘫痪，只能靠呼吸机活着。


    得了这种病，谁能提供最合适的治疗呢？'
  - '[PAGE 219]


    既然医生没有更好的治疗方法，护理就成了最好的治疗。


    护士要随时给病人吸痰，定时翻身拍背，帮助病人活动肢体。还要给予精确的营养，监测病人全部的生命数据，随时观测呼吸机运转。同时还要跟病人多说说话，否则，病人会出现严重的心理问题。


    在我们科，就住着这样一位渐冻人。


    根据统计，有一半渐冻人会在 3 年内死亡，90%活不过 5 年。我们科的这位病人，已经存活了 8 年。


    8 年来，她身上没有一块儿褥疮。气管切开插上呼吸机，不用任何消炎药，就靠吸痰，病人的肺也很少感染，而且重要脏器都没问题。


    我预测，在专业护理下，这个病人仍然可以存活很多年。


    这个病例告诉我们关于护理的第一层认知：护理是决定医疗质量的重要因素。


    # 护理：医疗体验的核心环节


    无论一个医院的医生有多牛，医院多么多么有名气，你肯定不想遇到一个面无表情的护士，命令你脱下裤子，然后，把长长的针头一针打进屁股里。


    护理更能体现就医体验。


    对于护理认知的第二个层面：护理是医疗体验的核心环节。


    我们来到医院，第一个接触和最后一个接触的人是谁呢？是护士。


    医疗服务流程的主要界面是护士；和病人打交道时间最多的是护士；病人躺在病床上呼叫，第一个应答的也是护士。


    所有这些环节，都是医疗体验。'
  - '[PAGE 220]


    护理，就是医疗体验的核心环节。


    所以，一个态度不好的护士会影响到整个医疗体验，让病人产生不好的感觉，甚至让你对整个医疗产生误解。


    病人来医院看病，不仅希望治好病，同时，更希望被尊重、被理解、被体贴。这种体验决定了病人的信任度和满意度。


    比如你去医院打针，护士带着口罩进来了，啥也不说，“咣当”把门一关。你的恐惧肯定一下子就冲上头顶，紧张得不行。


    所以，一个有经验的护士会笑着先说一句，“为了您的隐私，咱们把门关上好不好？”。


    这么一句话会让你的感受立刻不一样。这就是体验。


    关于护理，我们讲完了医疗质量和医疗体验。这两个层面，很可能和你理解的护理差不多。


    但是，对于护理的第三个层面，可能就要打破你的认知了。也就是这节课的题目：护理，既是医嘱执行者，又是安全代言人。


    # 护理：医疗流程的监督者


    护理怎么成了医疗安全的代言人呢？其实，这点甚至连很多医生也没有意识到。


    《罗辑思维》有期节目讲过一个故事，我拿来借用一下。


    2005 年，美国发生过一起医疗事故。


    一位有经验的外科医生在给病人做手术的时候，病人突然呼吸停止。


    这个时候，医生必须赶紧停止手术，立刻给病人气管插上管，这样才能保证呼吸，才能让各个器官不缺氧，才能救命。'
  - '[PAGE 221]


    但是，这个病人在气管插管非常困难。


    医生多次尝试都失败了。其实，这个时候最好的办法是别插了，赶紧把气管切开。气管切开同样能供上氧，防止窒息。


    但是在这个病例中，尽管有人提醒，但是这个医生还是反复尝试插管。最终，他错过了最佳时机，病人因为缺氧变成植物人了。


    这么有经验的医生犯了这种错误，是他不知道后果吗？他肯定知道。


    但是在紧急情况下，过多地关注在操作上，就会忽略其他的问题，比如时间。大脑能耐受的缺氧时间只有4-5分钟，错过了时间就等同于伤害。


    这通常不是技术问题，有个词叫做“窄化效应”，说的就是这个问题。每个人都有窄化效应，医生也不例外。


    所以，必须有人对医疗过程进行监督，而且必须根据紧迫程度，不断地发出级别越来越高的警示。这样才能保证流程安全。作出监督和警示的人就是护士。


    在ICU，我们也会经常遇到紧急气管插管的病例。


    护士不仅要给药、准备器械。同时，也会不断地发出警示。


    比如，护士会说，病人氧合不好，要不要气管插管？东西已经准备好了。


    如果医生插不上，病人的血氧就会下降。这个时候护士会不断地说，现在血氧已经不到90%了，现在是88%，85%。


    意思是，医生需要立刻停下来，给病人充足的氧气后，再去试。


    如果医生反复插管失败，护士还会说，要不要叫麻醉科？'
  md: '

    ## 各种新的能量投放系统


    把葡萄糖、氨基酸、脂肪乳、微量元素、电解质，这些生命必须的能量物质，按照合适的比例，计算好热卡混在一起，通过静脉血管输送到她的身体里。


    在这条新通道的支持下，她健康地活了 30 年。其间，她还成功怀孕，生下了一个健康的女儿。


    这都是静脉输液带来的奇迹。


    毫无疑问，今天的静脉输液技术已经成为了临床上最常见，也是最普通的治疗技术。


    我们应该记得，这项技术源于人类危难之际，它挽救过无数生命。从此，医生利用这条新通道，把能量、把生的希望投放给人体。


    不过在我看来，比静脉输液技术本身更重要的，是它带给医学的一个思路。


    这就是在治病过程中，总能遇到一条老路在新困难面前走不通了，那么，就必须要开拓一条新路。


    纵观医学技术的发展，绝大多数新技术都是在老路走不通，或者走不好的情况下，医生必须转换思路，从而诞生的。


    这些新技术的出现，目的是解决新问题。


    不同的技术具有各自相应的适应症，又有各自的优缺点。这些技术让医学目标越来越近患者需求。


    举几个你熟悉的例子：


    - 比如，在我国每年有 110 多万早产儿出生。这其中就有很多离开母体不能独立生存的孩子。在母体内孩子可以获得温度，还可以从母体摄取营养。一旦离开母体怎么办呢？


    既然生出来的孩子不能再回子宫，那就换条思路：在体外模拟一个“子宫”。


    用一个恒温的早产儿温箱，保持恒定温度、湿度，同时给孩子营养、补液。


    这样一项技术，可以挽救数以百万计的新生命。这个温箱就是一种新思路。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_205_0.png)


    - 再比如，尿毒症病人的肾没办法工作了，体内的毒素也就清除不出去。必须寻找一条新的途径清除这些毒素。血液透析、腹膜透析技术，可以利用分子弥散原理，让这些毒素物质排到体外。替代器官的功能，同样也是一条治病的新思路。对于病情不适合透析，或者能够有机会等到捐献器官来源的病人，还可以肾移植。


    在未来，还有可能利用人工制造出新的肾脏，完全解决器官来源和排异问题。这都是新思路。


    医学就是不断地转换思路，开发新技术，寻求新通道的过程。


    20 世纪 70 年代，因为战争，东巴基斯坦有大量的难民涌入难民营。


    当时正值雨季，霍乱爆发了。数以百万计的难民，尤其是儿童，在短期内感染上了霍乱。


    这个时候，静脉输液却行不通了。


    为什么呢？


    因为几百万人需要同时输液，到哪里找这么多医生护士呢？又如何保证输液安全？


    而且，每天一套输液设备加上液体，就要上百块钱。如果几百万人同时需要，对于当时并不富裕的国家，怎么承担？


    这个时候，曾经帮人类抵抗霍乱的新思路——静脉补液，遇到这次的霍乱却成了死路。在特殊情况下，必须再次寻找新通道。


    医生们不得不再次把目光转回消化道。


    经过研究发现，即便在腹泻的时候，肠道也并不是一点都不吸收。


    只要口服的液体成分中葡萄糖和氯化钠按照一定比例搭配，人喝下去，肠道还能吸收。而且效果和静脉输液差距不大。


    按照这个思路，当时的医生给感染霍乱的孩子口服补液盐治疗。8 周后，霍乱的病死率一下子从没办法补液时候的 30%，降低到了不到 1%。


    这同样是转换新思路的巧妙利用。


    在今天，儿童腹泻，多数情况通过口服补液就可以解决了，只有严重病例才会需要静脉补液。静脉输液未必比口服来得更快。


    每项医疗技术都有各自的适应症，有各自的优缺点。


    但是毫无疑问，任何医疗新技术的出现，都是巧妙地利用了新思路。


    ### 划重点


    - 1. 静脉补液诞生于霍乱，它是一个新的能量投放系统。

    - 2. 新技术的发展，就是一个不断打开新思路的过程。


    ### 下节预告


    一台“死亡率300%”的手术是怎么回事？下一讲，我们讲讲麻醉。


    ## 27 | 麻醉：不疼，才有无限可能


    2019-3-25


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    按照时间发展脉络，这节课说说医学发展的第三个里程碑——麻醉。


    在美国波士顿公园，距离开国总统华盛顿纪念碑不远的地方，矗立着另外一座纪念碑。但是，它纪念的却不是某个伟人，而是一种麻醉药——乙醚。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_208_0.png)


    为什么要给一种药竖一座纪念碑呢？


    因为，麻醉的出现，是医学发展的分水岭。


    有了麻醉，外科手术从野蛮血腥走向了安全和文明。


    有了麻醉，很多治疗技术才得以实现。


    有了麻醉，医学伟大的人道主义精神才得以体现。


    麻醉只有一个简单的作用：让人不疼。咱们先从疼来说起。


    ### 疼了未必不死：一台死亡率 300% 的手术


    麻醉出现前，医生们用病人的疼来换不死。


    什么意思呢？难道不疼就得死吗？


    对。


    在 200 多年前，人们要是得了必须做手术的病，比如截肢、胃穿孔，要么等死，要么就得忍着疼做手术。


    医生怎么做呢？


    要么让病人喝醉了再上手术台，要么就一根子打晕病人，然后把病人捆在手术台上，还得找三五个大汉把人按住。这个时候，医生赶紧开刀，速战速决。


    病人为了活命就得疼，医生为了救命就得快。


    据说，当时俄国一个医生可以在三分钟锯断大腿，半分钟切掉乳房；法国一个医生可以在 24 小时给 200 个病人截肢。


    当时手术最快的人，要数英国医生罗伯特·李斯顿（Robert Liston）。他能在 28 秒内，截掉一条腿。人称“小李飞刀”。


    那么疼了就一定不死吗？


    未必。


    下面这台手术，不仅病人死了，无辜者也死了。这是人类医学史上唯一一台死亡率 300% 的手术。故事的主角就是刚才提到的“小李飞刀”——李斯顿医生。


    **1842 年，** 李斯顿在做一台截肢手术的时候，手起刀落砍下了病人的一条大腿。但是，现场同时响起了三个人的惨叫。


    因为砍得太快了，他不仅切掉了病人的腿，还把助手的手指头，和一个围观的男性群众的要害都切了。


    后来，截肢的病人、被砍掉手指的助手、还有那个倒霉的观众，相继因为出血和感染死了。一刀三命，这台手术也成了医学史上死亡率最高的手术。


    这就是为了不死只能疼的时代，疼了也未必不死。


    但是，我必须为李斯顿医生说句话。他可不是庸医，实际上，他是那个时代最优秀的外科医生之一。


    只能说，这台手术是那个时代医学局限性的缩影。


    就是因为疼，手术必须做得快。那么肯定不细致，导致死亡率高。当时外科大手术的死亡率超过 **70%**。


    说到底，疼的问题不解决，外科手术就没办法往前走。


    ### 不疼，也可以不死


    进入 **19 世纪，** 麻醉终于诞生了。


    麻醉做到了不疼。不疼，又为医学发展带来了无限可能。从此，不疼也可以不死了。


    麻醉是怎么出现的呢？


    19 世纪初的时候，美国上层社会有一种时尚，就是在聚会的时候吸笑气。笑气的化学名称是一氧化二氮。


    吸了笑气的人特别亢奋，会哈哈大笑，所以它叫做笑气。当时的人们吸这个东西，就是为了玩得更嗨。


    有个细节，就是人吸了笑气以后，哪怕磕得鼻青脸肿也不会觉得疼。


    就是这个大多数人都没当回事的细节，被一个美国医生——克罗夫·朗（Crawford Long）注意到了。他想，这东西能不能用来给人做手术呢？


    有了这个想法，朗医生搞起了研究。结果他发现了一种跟笑气类似的东西——乙醚，而且乙醚的麻醉效果比笑气还好。


    1842 年 3 月 30 日，这是人类医学史上，值得被牢牢记住的一天。


    这天，朗医生给病人吸入乙醚，成功地进行了世界上第一台麻醉手术。病人不仅没死，而且还不疼。从这天开始，医学进入了“不疼的时代”。


    3 月 30 日也被定为“国际医生节”，就是为了纪念麻醉给医学带来的巨大改变。


    1853 年 4 月，34 岁的英国维多利亚女王使用麻醉无痛分娩，顺利地生下了一个聪明健康的小王子。这是推动麻醉普及的一个里程碑事件。


    人们就想，既然女王都麻醉了，而且麻药对大人、孩子没什么大影响，这事儿靠谱。


    这样，麻醉在全世界快速推广起来了。


    而这个时候，距离李斯顿医生那台死亡率 300% 的手术，也才仅仅过去了 11 年。如果李斯顿当时有麻醉，这个高手也就不会造成一刀三命的悲剧了。


    麻醉发展到这个时候，手术可以不疼，病人还可以不死。生孩子也可以不疼了。


    #### 复杂精细的外科手术得以实现


    后来，更多的麻药出现了。


    医生发现，很多手术不一定必须全身麻醉。也就是说，不必让病人睡着了再手术。只让需要手术的地方不疼就可以了。


    比如，给胳膊做手术，麻醉医生就在病人胳窝下面的神经里注射麻药。这样，手臂不疼了。这就是局部麻醉，它让麻醉更加人性化。


    这个时候，麻醉做到了想让哪儿不疼，哪儿就不疼。


    再发展，麻醉从外科中独立了出来，成为了一门独立的学科，有了专职的麻醉医生、麻醉护士。


    比麻醉自身发展更重要的是，它让以前很多无法开展的手术成为可能。在不疼的基础上，复杂、精细的外科手术得以实现。


    比如，进行肺癌手术的时候，麻醉医生可以让病人单肺通气，也就是让两个肺中的一个肺来呼吸，把另外一个肺留给外科医生做手术；


    再比如，如果出血量大，麻醉医生可以人为降低病人的血压，这样出血速度就慢下来了。


    甚至，体温也是可以控制的。


    做心脏和大血管手术的时候，为了不让病人的重要器官缺氧，麻醉医生甚至可以把患者的体温降到最低 16℃。


    今天的外科，已经发展出了上千种手术。手术的复杂程度、精密程度，都超过了前人的想象。


    我们可以打开人的大脑和心脏，在以前人们认为的生命禁区做手术；我们还可以开展最新的机器人手术，让手术变得更微创。


    医生不用再因为疼，而去尽量缩短时间导致手术粗糙。据我所知，最长的手术时间记录是 96 个小时。


    所有这些，在麻醉术出现之前，有谁敢去想象呢？


    麻醉不仅保障了外科手术的发展，而且让手术过程更安全。麻醉医生是负责手术安全的第一责任人。


    ### 麻醉应用于其他治疗技术


    在不疼的基础上，不仅是外科手术，很多治疗技术都用到了麻醉。麻醉让医疗更安全高效。


    比如，传统观念认为女人生孩子就该疼。


    无痛分娩，让分娩时的疼痛减轻，甚至消失。减少产妇分娩时的恐惧和产后疲倦，最大程度地保护孕妇和胎儿。


    在美国，分娩镇痛率已经大于 85%，在英国已经大于 90%。


    而且在整个分娩过程中，产妇意识清醒，能主动配合并积极参与整个过程。生产完很快就可以下地活动，这有利于产后恢复。


    麻醉，让“女人生孩子必须疼”这个老话成为历史。


    再比如，无痛胃镜、肠镜也用到了麻醉；试管婴儿技术穿刺取卵，无痛膀胱镜，各种深部穿刺，组织活检，这些都用到了麻醉。


    在 ICU，我们联合应用麻醉药物中的镇静药和镇痛药，让病人做到安静、不疼。


    这些药物减少了 ICU 病人一些严重的并发症，比如消化道大出血，以及心肌梗死的发生率，保证了病人的安全。


    同时，麻醉还涉及到了人的心理层面。


    一台全麻手术，不仅要保证病人在手术过程中不疼、不动，还要做到不知。这是从心理层面关心病人。


    如果病人可以感知手术场景，以后就会出现心理创伤。


    再比如，晚期癌症病人会痛不欲生，吃不好睡不好，甚至很多病人会抑郁、自杀。


    在麻醉基础上衍生出的疼痛治疗，可以用各种药物，甚至手术方法，解决这类病人的疼痛问题，让病人能够远离疼痛，有尊严地走完生命最后的时光。


    麻醉，体现的不仅是科学，更是医学的人道主义光芒。


    ### 划重点


    - 1. 疼，阻碍了外科手术的发展。

    - 2. 不疼，带来了复杂、精细的外科手术，还带来了其他治疗技术的发展。

    - 3. 不疼，体现了医学伟大的人道主义关怀。


    ### 下节预告


    医生不是医疗的全部，下一讲，我们讲讲决定医疗质量的关键要素——护理。


    ## 28 | 护理：既是医嘱执行者，又是安全代言人


    2019-3-26


    你好，欢迎来到《医学通识 50 讲》，我是薄世宁。


    上节课，咱们讲了麻醉。


    麻醉让医学很多治疗技术，尤其是外科手术得到了发展。


    但是，病的恢复却不只是诊断、治疗这么简单。护理是不可缺少的另外一项技术。


    在很多人眼里，护理不重要。决定治疗效果的是医生的技术，病治得好不好，就看医生那一刀。


    真的是这样吗？


    ### 统计学家——南丁格尔


    其实，想知道护理的重要很简单。那就看看，有护理和没护理有什么区别。


    我找到了一个数据。这就是 1854 年克里米亚战争中，英军伤员死亡率对比。


    当时，英军有军医，但是没有专业的护士，伤员死亡率在 42% 以上。


    有了专业护理以后，伤员死亡率一下子降到 2.2%。也就是说，没护理以前 100 个伤员要死 40 多个，有了护理，只有 2 个死亡。


    创造这个奇迹的人就是南丁格尔。


    南丁格尔咱们太熟悉了——“提灯女神”。国际护理的最高奖是南丁格尔奖，每年 5 月 12 日的国际护士节，就是她的生日。


    但是，南丁格尔的另外一个身份你可能不熟悉——统计学家。


    南丁格尔分析了克里米亚战争中英军的死亡原因。发现，真正在战场上战死的士兵不多，反而大部分死亡，是战地恶劣的卫生条件和缺乏护理导致的。


    她把这个情况做成了一张图，并用它说服了军方高层，这才把专业护理团队带入战地医疗。


    这个图的形状像一朵玫瑰花，所以也叫“玫瑰图”。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_216_0.png)


    每块扇形代表各月份士兵死亡人数。红色和黑色代表战争和其他原因致死的士兵数，蓝色代表缺乏护理而感染致死的士兵数。


    就这样，南丁格尔带着专业培训过的 38 名护士，改善卫生条件，开展专业护理。伤员死亡率迅速降低为没有护理时的 1/20。这是一个令人震惊的数字。


    所有的文献和资料上，都在强调南丁格尔身上的关爱精神，这点没错。


    但是，我认为她更伟大的地方还有三点：


    - 第一，她证明了治疗并不只是吃药和手术。医生不是医疗的全部，没护理不行。

    - 第二，护理也并不只是关怀，它更是一门技术。

    - 第三，她开创了专业化护理教育。护理从学徒制转变为学校教育。


    今天，护理已经成为一门独立的学科，是独立于医生之外的。


    在我国，护理学是一级学科，与临床医学平行。目前，我国有 145 所高校招收护理本科，其中 22 所设置了护理学博士点。


    作为一名临床医生，我怎么看护理的作用呢？回答这个问题之前，咱们先回忆一件事。


    ### 护理：决定医疗质量的关键因素


    曾经有一项风靡社交网络的公益活动——冰桶挑战赛，可能你还有印象。


    就是拿一桶一桶的冰水，自己把自己洗个透心凉，体验逐渐被冻住的感觉。


    当时很多名人都参加了，包括美国前总统奥巴马，还有罗胖。


    ![](img/4caf3257bac3bf3ff8bd0728c9b28448_218_0.png)


    罗胖参加冰桶挑战


    这个活动的目的，是呼吁人们认识并关爱渐冻人。


    渐冻人是一种运动神经元病，属于罕见病，在中国的发病率大约是 3/10 万。物理学家霍金得的就是这种病。


    病人逐渐出现肌肉无力，最后所有的肌肉都瘫痪了，就像被“冻”住了一样，只有眼睛能动。目前对这种罕见病没有特效药，也就是说医生无计可施。


    最可怕的是，病人的意识和皮肤的感觉正常，哪里不舒服，想做什么，心里都明白但是自己却表达不出来。负责呼吸的肌肉瘫痪，只能靠呼吸机活着。


    得了这种病，谁能提供最合适的治疗呢？


    既然医生没有更好的治疗方法，护理就成了最好的治疗。


    护士要随时给病人吸痰，定时翻身拍背，帮助病人活动肢体。还要给予精确的营养，监测病人全部的生命数据，随时观测呼吸机运转。同时还要跟病人多说说话，否则，病人会出现严重的心理问题。


    在我们科，就住着这样一位渐冻人。


    根据统计，有一半渐冻人会在 3 年内死亡，90%活不过 5 年。我们科的这位病人，已经存活了 8 年。


    8 年来，她身上没有一块儿褥疮。气管切开插上呼吸机，不用任何消炎药，就靠吸痰，病人的肺也很少感染，而且重要脏器都没问题。


    我预测，在专业护理下，这个病人仍然可以存活很多年。


    这个病例告诉我们关于护理的第一层认知：护理是决定医疗质量的重要因素。


    ### 护理：医疗体验的核心环节


    无论一个医院的医生有多牛，医院多么多么有名气，你肯定不想遇到一个面无表情的护士，命令你脱下裤子，然后，把长长的针头一针打进屁股里。


    护理更能体现就医体验。


    对于护理认知的第二个层面：护理是医疗体验的核心环节。


    我们来到医院，第一个接触和最后一个接触的人是谁呢？是护士。


    医疗服务流程的主要界面是护士；和病人打交道时间最多的是护士；病人躺在病床上呼叫，第一个应答的也是护士。


    所有这些环节，都是医疗体验。


    护理，就是医疗体验的核心环节。


    所以，一个态度不好的护士会影响到整个医疗体验，让病人产生不好的感觉，甚至让你对整个医疗产生误解。


    病人来医院看病，不仅希望治好病，同时，更希望被尊重、被理解、被体贴。这种体验决定了病人的信任度和满意度。


    比如你去医院打针，护士带着口罩进来了，啥也不说，“咣当”把门一关。你的恐惧肯定一下子就冲上头顶，紧张得不行。


    所以，一个有经验的护士会笑着先说一句，“为了您的隐私，咱们把门关上好不好？”。


    这么一句话会让你的感受立刻不一样。这就是体验。


    关于护理，我们讲完了医疗质量和医疗体验。这两个层面，很可能和你理解的护理差不多。


    但是，对于护理的第三个层面，可能就要打破你的认知了。也就是这节课的题目：护理，既是医嘱执行者，又是安全代言人。


    ### 护理：医疗流程的监督者


    护理怎么成了医疗安全的代言人呢？其实，这点甚至连很多医生也没有意识到。


    《罗辑思维》有期节目讲过一个故事，我拿来借用一下。


    2005 年，美国发生过一起医疗事故。


    一位有经验的外科医生在给病人做手术的时候，病人突然呼吸停止。


    这个时候，医生必须赶紧停止手术，立刻给病人气管插上管，这样才能保证呼吸，才能让各个器官不缺氧，才能救命。


    但是，这个病人在气管插管非常困难。


    医生多次尝试都失败了。其实，这个时候最好的办法是别插了，赶紧把气管切开。气管切开同样能供上氧，防止窒息。


    但是在这个病例中，尽管有人提醒，但是这个医生还是反复尝试插管。最终，他错过了最佳时机，病人因为缺氧变成植物人了。


    这么有经验的医生犯了这种错误，是他不知道后果吗？他肯定知道。


    但是在紧急情况下，过多地关注在操作上，就会忽略其他的问题，比如时间。大脑能耐受的缺氧时间只有 4-5 分钟，错过了时间就等同于伤害。


    这通常不是技术问题，有个词叫做“窄化效应”，说的就是这个问题。每个人都有窄化效应，医生也不例外。


    所以，必须有人对医疗过程进行监督，而且必须根据紧迫程度，不断地发出级别越来越高的警示。这样才能保证流程安全。作出监督和警示的人就是护士。


    在 ICU，我们也会经常遇到紧急气管插管的病例。


    护士不仅要给药、准备器械。同时，也会不断地发出警示。


    比如，护士会说，病人氧合不好，要不要气管插管？东西已经准备好了。


    如果医生插不上，病人的血氧就会下降。这个时候护士会不断地说，现在血氧已经不到 90% 了，现在是 88%，85%。


    意思是，医生需要立刻停下来，给病人充足的氧气后，再去试。


    如果医生反复插管失败，护士还会说，要不要叫麻醉科？

