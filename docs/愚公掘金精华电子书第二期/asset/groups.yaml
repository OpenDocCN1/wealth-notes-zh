    ## 圈外商学院退出21天挑战0元学费课，后面的运营逻辑是什么？


    **提问：**


    花爷，下午好。圈外有推21天挑战0元学费的课（即学完达标全额返学费）。这个和懂你英语的部分返学费有点像。这也是广告方式的一种？然后引导你付费高阶课程？我感觉我是他的受众之一。但是不是很理解这个运行逻辑。请花爷分析


    **分析**


    > 其实我知道有很多学友是在观望，很多时候机会已经给到同学们了，最后是否能把握住就看同学们自己了


    2019年10月31日 23:42


    > 圈外-笑笑【早十晚八】

    > 这个课程这么不吸引对大家吗？班班真的陷入了深深的怀疑之中啊


    > 圈外-笑笑【早十晚八】

    > 指指 班班再次强调：全额返费要求，

    > 即，规定时间21天内学完所有课程，并完成提交所有课后习题。

    > 指指 鼓励大家一定多做思考

    > 指指 不要求打卡

    > 指指 不要求每天学习

    > 指指 不要求分享朋友圈


    指指 优惠后只要498元！

    指指 21天学完全额返，0元学！！

    即可额外获得共创案例库权限！且课程结束后永久回看！案例持续更新！


    > 圈外-笑笑【早十晚八】


    ![](img/62659df0b3729b5d99b589094fb4b8b0_286_0.png)


    ![](img/62659df0b3729b5d99b589094fb4b8b0_287_0.png)


    **回答：**


    返学费的策略，有两个变种。


    第一种，是有任务的返学费，比如要求你每天学习完成后，发朋友圈打开。


    这种玩法一般价格不会太高，几十块钱，最高百元左右，主要目的是吸引你完成发朋友圈的任务，带来更多的用户，本质上是裂变的玩法，把人数裂变到一个更高的数量级，再出高价课转化。


    但后来微信不允许朋友圈打卡了，这个玩法就废掉了。


    第二种，就是你现在看到的，一定程度上是在赌概率。


    假设原本课程200元，那现在我把课程价格提到400元，有50%的人打卡成功，我的盈利和之前1000元时不变，而且因为打卡返学费的噱头，降低了很多人购买的心理障碍，可能吸引更多人报名。


    当使用这种玩法的时候，其实是一种庄家稳赚的策略，如果你没有打卡，庄家赚了400元，如果你打卡完成，你充分接收了庄家的理论体系，有很大概率积蓄购买后面的高价课程。


    最差的情况是什么？100%所有人都打卡成功，且所有人都不再购买其他课程，这种情况下，庄家的损失是什么？其实非常小，无非是一点人力，课程本身是音频，一个人学和一万个人学，庄家制作音频的成本是相同的。


    这就是知识付费搞这个玩法的优越性，边际成本非常低，哪怕最差的结果，也只是稍微浪费一点人力。


    更何况，最差的这种情况，在现实中根本就不会出现。


