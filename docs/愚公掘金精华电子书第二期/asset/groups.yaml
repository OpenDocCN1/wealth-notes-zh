    \n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\n## 去日本玩发现的几个小商机\n\n我这人吧，到哪都喜欢看跟钱相关的东西，所以这次哪怕出去玩，也跟大家聊聊发现的几个有意思的商机。\n\
    \n去日本的几点小发现：\n\n- 民宿：\n\n日本的酒店普遍很小，12平左右，而且贵，东京大阪这种热门城市，普遍1000+一晚。\n\n所以民宿生意就很火。\n\
    \n在日本做民宿生意的中国人很多，但这个市场不太透明（就是游客人傻钱多），不同地区、不同装修的民宿，差价还蛮大的。\n\n用户越精明，商家就越依赖流量。于是airbnb这种民宿预订平台的抽佣非常高，对顾客抽6%~12%，对房东再抽3%。\n\
    \n所以不少商家都想跳出平台，自己做流量。最直接的方法就是做微博，做日本旅游的攻略，建立信任后民宿成交就顺水推舟了，微信直接交易也会便宜不少。（我一直强调的，信任货币就是钱）\n\
    \n微博做宣传的人设也五花八门，有的是主打美少女房东，民宿基本都是网红风，不少女孩子会带摄影机去拍照；有的主打真诚热情的房东形象，民宿的照片故意不做任何美化，你看到什么样就是什么样，非常实在，然后也会在微博提供各种热心服务。\n\
    \n我就特别吃后面这一套，整个体验下来确实很棒。\n\n这个房东也非常聪明，和房东聊天，他说他是做医药的，不少房客来了之后，直接成了他的代理商。我虽然没做代理，但仍然留了微信，以后日本那边有什么渠道需要，可以联系他去帮忙，算是打下一个资源节点。\n\
    \n你看，先做朋友，后做生意，难度就小很多。\n\n- 交通：\n\n同样的，日本交通也很贵。不光出租车贵（2公里车费近100块人民币），新干线（相当于国内动车）也很贵，大概是国内价格的四倍。\n\
    \n所以在日本，中国人的黑车生意就非常发达。一家四口的周边游，你坐新干线的钱，可以直接包一辆车一个司机（会中文）跟着你跑一天，换成你你肯定也包车。\n\n\
    这些包车生意，主要通过飞猪等平台引流，需求非常大。\n\n你看，哪里不方便，哪里就有生意。\n\n- 迪士尼：\n\n去迪士尼玩，在飞猪上提前订票，很多商家都不是及时出票的，一定要等到你入园前1-2天才给你票。\n\
    \n后来在飞猪找了一圈，找到一家能及时出票的，问他原因，他说：\n\n那些只能提前1-2天出票的，大多是利用灰产漏洞、盗刷之类的给你买的票，被坑的人来不及举报追查，你的票已经用完了。\n\
    \n不知道真假，后面没有追查了。但当你不知道别人的商业模式事，问他的竞争对手，往往能得到一点线索。\n\n- 日本的互联网比中国真的差远了：\n\n日本的移动支付非常差，只有大城市的大商场和便利店才能刷卡，小城市和乡下都不太支持移动支付，不带现金是要饿肚子的。\n\
    \n这在国内简直不敢相信，卖红薯的都支持和支付宝了。\n\n如果你上过日本的铁路订票系统，你会发现做得比当初的12306第一版本还要烂100倍......\n\
    \n前阵子711好像做了一个专属的移动支付，然后……被盗刷了很多钱……停掉了......\n\n- 之前在星球里说，我一年的个人花销很少，这是实话，我是真不爱买东西。能吃个榴莲对我来说就是顶级的日常消费了。\n\
    \n包括出去玩，我都是住民宿追求性价比。\n\n但偶尔也会享受一下，这次去泡温泉，住了两晚高档酒店，一晚差不多要四千……只能安慰自己，偶尔体会一下有钱真好的感觉，才能激发更大的赚钱热情……\n\
    \n（配图是酒店官方图，温泉是全裸泡的不给拍照）\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_625_0.png)\n\
