    ## 从事自媒体领域创作，职业规划应该怎么做？


    **提问：**


    花爷你好，我是18年毕业的工科生，因为不喜欢原专业，选择考研，但是失败了。


    今年开始工作，主要做的事微信公众号，是有关护肤科普的，平均每天一篇文章的阅读里是5-6w，因为自己是那个公众号的粉丝，所以目前是这个公众号的内容编辑。主要工作是，自己每周一篇文章，还有排版ip的稿子。


    目前的工作让我找找不到自己以后的核心竞争力在哪？对于自己的职业规划也有点迷茫。最理想的状态是希望自己以后也可以做个kol，把知识转化为金钱。但是，又不确定目前这个公司是否是个好的平台，因为公司的内容部目前在瓶颈期，核心写手走了，文章质量没有以前高。


    还希望花爷可以作为行业前辈，给点指导


    **回答：**


    我之前写过一篇文章，专门分析自媒体的，建议你好好看，多看几遍：


    ### 承认了，刚写10篇文章，我不小心赚了30万…


    看你的问题，你还在把自媒体当成是写文章。


    不不不，自媒体不只是写文章，自媒体是一门生意，一门从头到尾都要策划的生意，写文章只是其中的一部分。除了写文章，你还要懂定位、引流方法、用户运营等一系列技能。


    你现在刚干这一行，公司的号也基本定型了，那你就得一边学习自己公司的经验，搞清楚你们的号是如何做起来的、又是如何把一个公众号做成一门生意，另一边你要充分研究行业里的各种公众号，把各家自媒体的崛起之路在脑海中推演一遍，推演的多了，心里就有谱了。


    拿我自己举例吧，你知道我做自媒体之前干了什么吗？


    - 第一，我把新榜上每个分类下的头部号都分析了一遍，弄了一整天，得出了适合个人零资源上手的自媒体定位。

    - 第二，确认定位之后，我把同类型的号全部列出来，找人把他们的历史文章和数据全部抓下来，看看他们是怎么做起来的，从哪篇文章开始写火的，不断的总结、琢磨。


    完成了这两步，才算是起了头，才有开头那篇文章里列的后续策略跟进。


    你还年轻，不用急。想考高分，就要考前做一百张试卷，想做自媒体，就得研究一百个号的模式。


    这个世界，对大多数人来说，还是很公平的。


    ps.大家不要向小号提问，我不常看小号，容易漏，提问认准大号哈！


