    谢谢大家！我是周骁，有问题欢迎大家联系我一起交流讨论~


    ## 问答：


    ### 1、能具体介绍下直通车+刷爆的冷启动么？


    周骁：一般新品上架第一天破零，就是直接刷单破零，然后单量螺旋上升，第一天1单，第二天2单，然后3、5、7、10，这样递增，同时配合做一些优质卖家秀。等刷手收到货
    让他们给你评价上去，等有了基础的销量和评价了 就通过直通车推广引流。


    ### 2、你们怎么考量站外渠道的效果，目前对站外渠道推广看重的是什么点、直接带销量、还是品牌影响力？


    周骁：站外推广一般转化率和ROI比较低 不用来带销量，更多的是用来做品牌影响力和市场占有率。


    ### 3、这样前期刷的单量不多，可以直接找身边亲戚同学朋友什么的帮忙吗，需要注意什么？


    周骁：大数据可以查询到你和朋友们的账户关联，所以最好不要。


    ### 4、如果我开一个淘宝店铺。一般情况下，如何根据店铺的销量来配比我的工作人员比较合理


    周骁：根据日销量和询单人数来配比，我店铺是以100单为临界点，多一百单，就多配一个客服，多2-300单，多配备一个运营助理。


    ### 5、店铺自然排名的权重你认为哪些因素影响最大?


    周骁：客单价，销量，店铺精准标签，店铺风格，顾客评价和真实复购率。


    ### 6、店铺到底：直通车+钻展 更好? 还是用淘客推更好?


    周骁：前期用直通车拉精准人群和标签，后期稳定了搭配钻展和淘宝客提升销量。


    ### 7、新品一般没有权重，刷单的时候给刷手的搜索词是全标题？（关键词找不到店铺）


    周骁：尽量不要使用全标题，可以搜半标题，或者卡地区，价格，提前进行浏览，收藏，加购，等形成了比较深的购物轨迹，再去用关键词搜索，排名就会比较靠前。


    ### 8、不同推广方式的投资回报率怎么样？


    周骁：直通车、钻展、超级推荐、淘宝客，是现在四大主流推广方式，其中直通车对于店铺的人群和标签正面影响最大，我比较推荐。淘客会导致店铺标签混乱，可以适当开直通车拉正人群。


    ### 9、推广费用占营业额多少比较合理（不同品类估计有一定差异，你店铺目前是如何）


    周骁：推广费用一般占到利润的20-30% 比价合理，我店铺是20%，前期推广费用占比会比较高，后期稳定了会减少一些。


    ### 10、坑产怎么刷？或者说店铺层级，刷的量和同行平均转化率有关系吧，对于小类目，比如某些蓝海类目全网成交只有百几十单，怎么刷合适？关于刷单资源是否方便？


    周骁：坑产只能补，不能刷，例如一天卖50单，可以补40单以下，店铺层级决定你的流量天花板。补大单没有意义，没有权重。


    ### 11、目前做母婴类产品，除了上淘宝还有上其他销售平台吗？


    周骁：有很多线上母婴类的app，都有自带商城，可以入驻。


    ### 12、用淘客推，这个佣金怎么设置比较合适，还是直接参考头部同行？


    周骁：佣金根据利润来设置，你要想明白自己的目的是什么，如果是为了赚钱，卖一个赚一个，那佣金比肯定不要设置太高，如果是为了冲销量，带动非淘客交易，那么只要不亏，甚至小亏，都可以接受，就当免费刷单冲销量。


    ### 13、引流款火了之后，还会留着引流款吗？


    周骁：如果引流款带来的访客和流量，和后面上架的款式，以及店铺规划没有冲突，可以留下。


    ### 14、请教大佬，你们店铺引流款给店铺其它产品的销量带来多大影响？


    周骁：现在淘宝算法是千人千面的推荐算法，有精准的店铺风格和标签，就越容易被淘宝推荐给有这个需求的顾客，所以我店铺后续的款式，都是往引流款上靠的，尽量保证整个店铺的受众是同类型的，关联转化很高。


