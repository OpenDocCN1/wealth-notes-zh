    # 花爷借着教师节说一些感悟：人生没有标准答案


    今天教师节，没想到还收到好几位花友的感谢，有的看到星球的点子，去实操赚到钱了，有的职场上受到点拨，工资涨了还准备买房定居了，有的生意上遇到问题来星球提问，照着我回答的内容做，问题顺利解决了。


    说实话，乍一听你们叫我老师，还挺不好意思的，我脸皮倒是够厚，主要是没这个心理准备啊……'
  - '[PAGE 686]


    说到老师，我一直非常敬重我的初中班主任，和大家分享一下还萦绕在我脑海的两句话。


    初中因为学习比较好，课外做了一些竞赛题目，我会再出给老师做，故意刁难一下老师。


    有一次给班主任出了一道数学题，过了一会儿他和我说明，这题出错了，没有答案。我说不可能啊，我看了答案，能解出来，然后把标准答案给他看。


    班主任说了一通这个题为什么没有解，我当时能力有限，也听不懂，只记得他最后跟我说了一句：


    有的题是没有标准答案的。'
  - '[PAGE 687]


    我也不知道他这话有没有什么深意，总之鬼使神差的，这句话我一直记到现在。后来我上大学，发现身边的大学生虽然成年了，但好多人还在顺着标准答案求解，困在乖学生的思维里逃不出来，愈发对班主任的这句话印象深刻。


    班主任的另一句话，不是直接对我说的。


    我初中喜欢跟学习差的同学玩，有次和同学玩的比较皮，被班主任一起拎到外面罚站，班主任我们教训一顿之后，问差生们最近有没有抽烟打架去网吧，差生们当然是死不承认了。


    班主任最后叹了口气说，你们可以不学习，但千万不要学坏。


    就这简单的两句话，一句“没有标准答案”，是人生的上限，一句“不要学坏”，是人生的下限。'
  - '[PAGE 688]


    我觉得在愚公掘金里，不管是我发的各类思考、商机，还是解答花友的问题，也是一样的道理。


    一个回答，让你少走弯路，即是捷径。一个信息，让你看到更大的世界，就是机会。前者是基础，后者是更进一步的台阶。


    在教师节，不光要感谢老师，更要感谢生活，生活才是最好的老师。


