    9. 只能买一手，一手才1000,打新的概率是多少？

    风子：我的看法是，尝试去多申购几次，肉身感受一下，中签率还是蛮高的


    10. 这句话不理解——“打新买入的时候70几，上市以后发行价直接100零几的意思吗？知道吗，在去年10月12月竟然有的可转债卖七十几块，一张一百零几块价值，现在只卖七十几块，这意味着什么？”

    风子：七十几块是二级市场买的，不是打新的，打新一率按100元一张


    11. 打新有持仓市值要求吗？

    风子：无，但是中签了，你要有钱给扣


    12. 可转债买了之后卖出有时间限制吗，还是跟银行死期一样，必须达到一年或者几年以上

    风子：无，只要上市了之后，随时可卖


    13. 可以随时卖出吗

    风子：随君喜欢，不挑日子


    14. 没上市还能卖出吗

    风子：不行，但是申购了之后，一般只有几天就上市了，上市之后，都可以随时卖


    15. 怕踩坑，能推荐几个券商吗？

    风子：私聊我，给你推，不方便群推


    16. 是不是中签了就可以保底，在二手市场交易，就没有保底呢？

    风子：对，因为打新是100元一张，二级市场经常价格是一百多元以上，超过保本价了


    17. 分红一般是什么时间分？

    风子：如果是红利ETF，一般是年初或年末。如果是股票有时候会分两次，年中再分一次


    18. 红利指数这个分了这么多钱出来分红，会不会挤掉一部分公司长期发展所用的资金。以及能分出来这么多红利，是不是代表公司本身可供投入的发展项目有限，长期来看可能并不景气呢？

    风子：这个问题非常专业，理论上来讲，公司拿出利润出分红，通常代表着公司的运营稳定。而我们看收益，也是看整体的股价上涨+分红。关于景气与否，我们用的是规模指数，会包含各行各业，有分散作用。


    19. 买到的可转债可以自己转成股票卖吗？推荐的红利ETF与其他指数基金相比有什么优势？

    风子：上市之后，都会有一个条件，6个月后才能转股，红利我有列举了五六个，可以再翻看一下哈。


    20. 其他指数基金是否也有可投资价值？

    风子：不一定，指数基金分5大类，有的行业指数基金，就不抗行业黑天鹅，还有的指数已经高估了。


    21. 我目前欠款8.5w，月薪1万，坐标深圳。养家糊口。每月攒不到钱。也建议投资吗？有建议不？

    风子：对于负债的朋友，我的建议和花爷很像，加强自己的职业能力，从增长本金先着手，负债的朋友，要有一个意识，增长资产，这里的资产不是会计上的资产，而是从现金流的角度。会源源不断带来收入的，才是资产，比如出租的房子，分红的股票或基金。会源源不断吃钱的，比如家用车，就是负债，要有意识的去增加资产，减少负债。


    22. 请问中证500怎么样？

    风子：现在市面上有两大分歧点。一类是通过和历史价格对比，发现，现在好便宜，可以买。一类是通过自身的估值，发现不便宜。如果你问我，我会更推荐沪深300。


    23. 想问一个和今天内容不太相关的问题：现在一些公众号提供定投服务，比如某慢，某钉，等等，从您的角度看这样的基金服务是否安全（背后的基金公司过于年轻），跑路的风险有多大，与老牌的基金公司想比较有优势吗？我个人有开户，但没什么炒股经验，一直在买指基，场内费用低，但公众号的定投貌似收益率更高一些，您有什么建议吗？今天您的介绍让我对可转债的理解更深入了，感激！

    风子：首先，感谢认可！你提到的某慢，某钉都是在一种基金平台上做跟投，这种平台收费会三方面人收走，基金公司、平台、大V，也就是说，如果你跟投，那就有一部分手续费是付给大V的。所以，区分就是，如果你自己懂得定投，那就用场内，便宜，如果实在太白，又想省事，可以跟，但是跟的同时，你要先弄清楚他们的投资逻辑，不盲目。


    24. 指数基金这种一篮子里什么公司的股票都有的，尤其行业也覆盖了多种多样，怎么估值的呢？

    风子：我目前按PB为主，小于1，我都敢接刀


    25. ETF指数基金，有些基金会提供智能定投服务，根据日均线自动决定定投金额，这种方式怎么样？和自己买相比，有啥优缺点能帮忙分析下吗？

    风子：其实大多数朋友对“定投”这两个字是有误解的，定投准确的说法是定期投资，每一次现金流入时，考虑的永远是当下投资哪个最好，而不是固定某一个标的投资。


    但是，大多数会采用定投的都是基础比较薄弱，自己去找寻出当下最适合投资的标的，不太现实。所以就找指数基金这种可以平均赢市场的标的，没有太高的盈利，但是从长年来看，还不错，所以，你问的用日均线自动定投，它把定投的问题重新搞复杂了，这时候，有没有必要呢？这时候，标的就要重新考虑，还适合指数基金，如果适合，哪一种类似合适呢？


    我个人觉得用日均线判断，这是一种趋势投资，细节上有很多的讲究，比如，如何定义趋势不行了，不进行定投，比如如何定义趋势还在，继续高位定投等等。可以看下它的历史3、5年的回测，最终，还是要自己搞懂它的玩法，不然最后就是赚了不明不白，亏也会不明不白哈。


