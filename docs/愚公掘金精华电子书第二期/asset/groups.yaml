    ## 公司客服离职率高，应该如何调整激励模式


    **提问：**


    花爷你好，我现在在一家公司做运营主管。部门的客服离职率特别高，都是做一两个月就离职了。工作强度是比较小的，我觉得直接原因是工资固定，他们看不到希望。


    现在老板想要调整一下工资模式，降低底薪，加入提成模式。但是又不想工资给的太多，因为一旦工资上去了，淡季就很难降下来。让我想一下方案，身边做的比较好的同行都是比较提防我们的，因为我们是厂家，所以产品优势比他们大。也不知道去哪里学习希望花爷给个大概的激励模式方案。


    **回答：**


    人啊，是需要一直看到希望的动物。


    你提到金钱激励，没错，钱是最直接的兴奋剂，但我敢打赌，当你把客服的工资从三千拔高到四千，用不了半年，他们仍然不会满意，因为还有大把比他们有前途、薪水高的岗位，人是不会知足的。


    驾驭基层群众是从古至今的一门学问，钱只是调节的工具，通过钱，管理者需要建立起更重要的东西：阶层。


    建立阶层的过程中，四件东西最重要：身份、奖惩、竞争、出口。


    ### 1. 身份


    想象一下，职场如果是一款游戏，那客服的段位，最多只是这个游戏的新手村，如何让客服愿意更久的在新手村历练？


    设置不同的段位，让他们一直有一个看得到的目标去努力。


    建议将客服分组，每组5人左右，设置小组长，如果总人数很多，每3个小组再建立一个小团长，所有小组长、小团长从客服内部选拔，阶级分工明确。


    制度上一定要把楼梯一样的阶层搭建起来，人才有意识往上爬。


    ### 2. 奖惩


    先说奖。


    提问的花友公司是做电商的，电商客服的绩效一般与业绩直接挂钩，哪怕是售后客服，也有对应的数据标准。但奖励绩效，不在于多，而在于设置巧妙，至少需要有三种类型的奖励：


    - 第一，普惠奖，即大家努努力好好干，就能拿到的绩效。

    - 第二，头等奖，即做得最好的人才能拿的奖，一般得是个比较诱人的奖。多说一点，头等奖是实物的时候，往往效果更好，因为实物隔段时间换一次，新鲜感会带来额外动力，当然也允许折现。

    - 第三，竞争奖，这个在后面第三点再细说。


    特别强调，有奖，就一定要有惩。


    一定要给所有人设置底线指标，一次达不成指标，扣绩效，多次达不成指标，考虑劝退。在客服这个工种里，一定会出现不在乎奖励只想混日子的人，这种人要坚决清退，否则会严重影响团队氛围。


    你甚至可以直白的跟大家说，哪怕有一天离开，公司也希望你一个优秀员工的身份离开，混日子磨洋工的，绝不姑息。


    ### 3. 竞争


    竞争才能磨练出最好的团队。


    设置团队奖励，以团队为单位比拼业绩。同时你作为主管，要帮小团长、小组长们做好对客服的动员、培训，让大家在实战中去总结，拼出团队感来。


    团队间的竞争，靠的是一种仪式感、使命感。奖励是一部分，另一部分，一定要让大家明白，拼搏不仅是为公司，也是为了他们自己提升能力，以后有更好的发展。在竞争中表现优异的，成为后面小组长、小团长的备选人。


    如果你身边有做过市场销售工作的朋友，建议去取取经，销售们的动员经验都很丰富。


    ### 4. 出口


    前面3招，都是让员工在新手村更努力的攀爬，但我们必须承认一点，没有人想做一辈子客服，新手村也是有终点的，这类需求是挡不住的。


    所以，也要给所有人准备一个终极出口：


    小组长、小团长中表现最好的，有机会直接转岗到公司最有发展潜力的部门，薪水和职业前景再上一个台阶。


    如此一来，普通客服-小组长-小团长-转岗，这套阶层体系算是跑通了。还是那句话，你不能避免离职，但这套体系会最大限度的延长员工的在职时长和努力程度。


    最后再强调一点：


    钱只是调节的工具，员工最想看到的，其实是成为更好的自己。


