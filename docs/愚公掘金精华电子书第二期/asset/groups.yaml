    \ | 12.20% | 0.42 | 0.38 | 0.3 |\n| 51元 | 14.39% | 61.36元 | 10.50% | 0.46 | 0.42\
    \ | 0.4 |\n| 13元 | 9.83% | 31.37元 | 11.50% | 0.58 | 0.52 | 0.5 |\n| 09元 | 20.00%\
    \ | 40.29元 | 8.60% | 0.64 | 0.59 | 0.5 |\n| 51元 | 14.39% | 61.36元 | 10.50% | 0.75\
    \ | 0.68 | 0.7 |\n| 09元 | 20.00% | 40.29元 | 8.60% | 0.87 | 0.80 | 0.7 |\n| 13元\
    \ | 9.83% | 31.37元 | 11.50% | 1.10 | 0.99 | 0.7 |\n| 84元 | 25.52% | 60.90元 | 11.00%\
