    # 是否辞职单干？很多时候答案就在问题里


    提问：'
  - '[PAGE 422]


    花爷，有个职业方面的问题想请教。本人目前在一家工程咨询类公司工作，派驻政府单位协助开展业务，工作较为轻松，目前到手二十来万每年，福利还行，配了一辆项目用车，主要是我用。今年开始部门业务量有所下滑，年终奖有所下调，但公司总体业务平稳。现在有个机会，同事有一些门路，邀请我出来单干，主要从事水务管网修复方面的业务，目前该类业务较多，但业务入门门槛不高，竞争较为激烈。一方面自己想试试（以前想的是有合适的机会出来干，但目前的机会跟之前预想的不一样）；但另一方面，担心后续业务拓展不开，后面再找目前待遇的工作较为困难，比较矛盾。请问花爷，有没有一个分析的思路或者建议，帮助做出选择


    # 回答：


    给花友回答了几百个问题，我发现一个非常有趣的现象：


    ![](img/62659df0b3729b5d99b589094fb4b8b0_422_0.png)


    ![](img/62659df0b3729b5d99b589094fb4b8b0_422_1.png)'
