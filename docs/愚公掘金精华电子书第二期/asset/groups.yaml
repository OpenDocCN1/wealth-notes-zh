    ### “金花奖”挑战：请花爷拆解明星祝福产业


    #### 挑战提问


    花爷好，今天看到个新闻，发现一个原先不知道的产业，原来还有专门给明星牵线售卖服务的。。请花爷帮忙分析下这个产业的运作模式，非常好奇


    ![](img/62659df0b3729b5d99b589094fb4b8b0_794_0.png)


    ## 花爷回答


    其实不复杂，主要第三方中介公司，有门路跟各个名人谈好合作模式和报价，比如写字、合影、录视频、现场出席等等，然后另一头去跟有意向的个人和机构谈。跟我们之前说的公众号投放的媒介公司一个性质。


    买的人主要分两类：


    一类是追星，你别以为赵忠祥没有粉丝，像张铁林、赵忠祥、李琦、朱军这些中老年名人，粉丝年纪比较大购买力很强，至于那些小鲜肉明星的合影就更好理解了。


    顺便一提，在文体圈，带你去后台和球星、明星合影签名，已经是很成熟的产业了。


    另一类，就是请名人撑场面了，有次我朋友结婚请了赵忠祥当嘉宾证婚人，我的妈呀眼袋特别大……


    还有像今年龚文祥的3000人微商大会，请不到名人给微商站台，最后请了当当的李国庆，就是最近跟老婆撕逼的那个……


    说到微商，都知道张庭（以前是明星）做的TST是全国第一微商，其实她的好几个明星朋友都站台入股了，最出名的就是徐峥、陶虹和曹格。


    这些其实都能理解，明星就是靠名气挣钱的，在报价上也特别真实，张铁林的书画5万一幅，毕福剑的只能卖到1万，这就是名气的直接体现。挣钱不犯法，换你你也挣。


