    ## 2、公司发的项目提成，是属于员工的奖金吗？


    上善若水：不是的，如果拿了发票，就相当于与实报实销了，不算员工的工资。公司就是为了不让这一部分钱算工资，才让你们提供发票的。如果按工资算的话，一方面公司不能抵税，另一方面，你要交很多个税。


    ## 3、上面说通过把个人报酬转化为公司营业收入，最后计提到个人账户。有什么风险吗？比如导致个人账务和公司账务无法分清。后续公司经营不当，申请破产，注册资金为10w，但实际财务为20w时，是否本人需要自己再出10w


    上善若水：这就涉及到个人独资企业的责任问题，个人独资企业，它不像有限责任公司，它破产的时候是需要承担连带责任的，需要投资人谨慎对待风险。但是话又说回来，有限责任就真的有限了吗？那么有限责任的老板不也一样倾家荡产了吗？所以全靠自己去把控。没有哪一种方法是完全没有风险的。


    ## 4、这里为什么要减去5000？第二月的时候减去2520？


    例 2。假设花粉 B 每月工资 30000 元，每月社保公积金假设缴纳 4500 元，专项附加扣除中只有房贷每月可扣除 1000 元，年终奖为 60000
    元，没有其他收入，他每月缴纳的个税如下：


    一月份： (30000-5000-4500-1000) x 3% = 585 元;


    二月份： (30000 x 2-5000 x 2-4500 x 2-1000 x 2) x 10% - 2520-585 = 795 元;


    三月： (30000 x 3-5000 x 3-4500 x 3-1000 x 3) x 10%-2520-585-795 = 1950 元;


    年终奖如果不纳入综合所得，那么 十二月份工资部分：(30000 x 12-5000 x 12-4500 x 12-1000 x 12) x 20% - 16920
    = 25980 = 3900 元

    年终奖部分：60000 / 12 = 5000 元，适用 3% 税率，那么年终奖部分的个税为 60000 * 3% = 1800 元


    年终奖如果纳入综合所得，那么 (30000 x 14-5000 x 12-1700 x 12-1000 x 12) * 25% - 31920-25980
    = 24000 元

    所以：这种情况选择年终奖不纳入综合所得，更划算。


    上善若水：起征点 5000 是基本减除费用，一年 60000 元，每月就是 5000 元。那个 2520 是速算扣除数。我把个税的税率表贴上来


    ![](img/62659df0b3729b5d99b589094fb4b8b0_69_0.png)


    | 级数 | 累计预扣预缴应纳税所得额 | 预扣率（%） | 速算扣除数 |

    | --- | --- | --- | --- |

    | 1 | 不超过 36000 元的 | 3 | 0 |

    | 2 | 超过 36000 元至 144000 元的部分 | 10 | 2520 |

    | 3 | 超过 144000 元至 300000 元的部分 | 20 | 16920 |

    | 4 | 超过 300000 元至 420000 元的部分 | 25 | 31920 |

    | 5 | 超过 420000 元至 660000 元的部分 | 30 | 52920 |

    | 6 | 超过 660000 元至 960000 元的部分 | 35 | 85920 |

    | 7 | 超过 960000 元的部分 | 45 | 181920 |


    括号里面的就叫应纳税所得额，然后看算出来的结果属于1档2档还是。。。


    ## 5、去年一年没有申报个税，现在是不是可以申请退税？


    上善若水：单位会给你扣这些项目：每月5000以及你个人缴纳的五险一金。然后就是专项附加扣除，这个你自己申请了单位才会给你扣，不申请的话，单位默认你不符合条件啥，就不会扣。可以在3月1日到6月30日办理一次性退税，是这么理解吗？


    上善若水：对的，如果你确实有符合条件的专项扣除，就可以在汇算清缴的时候去申请退税


    ## 6、求助老师，我税前月收入55k左右，有两子女有老人赡养，大概可以退多少


    上善若水：你在小程序里搜那个个税计算器，然后根据实际情况填那个社保基数（肯定不是按5.5算的，超上限了），然后点击专项附加扣除，以及不点击专项附加扣除，那两个的差就是你可以申请退税的金额。5.5万超社保基数了的


    ## 7、汇算清缴申请退税的流程是怎样的？是要去税务局办理吗？


    上善若水：分享多的课件提到的，12万以下以及补税400无需清缴，这个规定也是2019年12月14日国税局敲定下来的，2018年年底出台新税法时可不是这样的，当时基线在6万。我说这个的意思就是想告诉大家，具体的退税流程以及怎么操作，国家还在征集意见稿中，还没有具体出来。只是把框架说了一下，什么可以自己办，可以单位办完，也可以找人代办，等等。。。3月份开始清缴，大家再等等吧。。。


    ## 8、本人工资低，不够交个税的资格，因此从来没交过个人所得税。像我这种情况，是不是就不用主动在APP上申报了？


    上善若水：不用汇算清缴，但是个税APP上是做专项附加扣除，跟工资多少没有关系。


