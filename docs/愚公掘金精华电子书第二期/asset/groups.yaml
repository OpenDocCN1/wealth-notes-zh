    ## 在小县城开饭店，运营一般也想不到其他好的赚钱思路，该如何谋求发展？


    **提问：**


    一进去星球就来提问，本人是个中年俩孩子的妈妈了，地处山西一个在全国排名靠前的资源枯竭型县级市。前几年不明显，因为国家一直有补贴，最近两年越发严重。整个城市人心惶惶，经济上不来，人们大批大批的结伴外出打工。做生意的见面第一句话就是最近生意越来越不好干。城市转型让人看不到希望。现在我又由于各种原因没有办法走出这个城市，现在开了家小吃店，生意一般般，无法突破，想问花爷，在这个不上线的小地方还有什么能发展的！在我的脑海裡过来过去就是开店，不是卖吃的就是卖穿的，可是这些实体行业都受到了特别大的冲击，并且投资大，风险大，线上卖吃的穿的，我的朋友圈也有，做的看起来也不错，但我觉得我不是那个料，有些迷茫？


    **回答：**


    德国有一部诗剧叫《浮士德》，主角浮士德和魔鬼做了一项交易。


    魔鬼说，我将满足你生前的所有要求，但你死后，我将拿走你的灵魂作为交换。


    这部经典诗剧的情节看上去像一本神话故事，其实这样的交换每天都在这个世界上演。


    寒窗苦读的少年用数千夜的灯光换一本翻身的学历，背井离乡的年轻人用无数个孤独强撑的夜晚换一个光明的未来，被痛斥为资本家的老板用几十倍的杠杆风险换公司更上一层楼。


    王健林看上去光鲜，其实为了万达发展借了几千亿，最后不得不割肉自保，儿子都进了限高名单。


    这世界上，哪一样不是换来的？


    选择留在资源枯竭的县级市，面临经济下行，这是交换的结果。


    做实体行业，投资风险大，这是交换的结果。


    线上朋友圈做生意还不错，但你觉得你不是这块料，这也是交换的结果。


    你看，结果都是选出来的。而现实是什么？


    现实就是，生活的每一瓶解药都苦，你必须挑一瓶喝下去，最多是挑一瓶不那么苦的而已。


    你这也是不行，那也不愿意，全国十四亿人，你的县城再小应该也有几十万人口，凭什么你突破？


    如果有不吃苦头就突破圈层的方法，那全国所有人都要齐头并进了，也就没有经济下行这回事了。


    我个人建议，在小城市想要完成突破，培养互联网思维是必经之路，是效率最高的方法。你倒不用去朋友圈卖货，可以先学着用互联网思维改造自己的小店，慢慢来，不急着求成，但也不要抗拒。


    三十岁、四十岁其实不算大，中国人平均寿命已经逼近八十，四十岁人生不过一半，除掉孩童时期，真正的事业期不过十几二十年而已，根本不算晚。


    从开小店入手的话，建议你去w看一看开店笔记，在喜马拉雅应该有免费的音频。开店笔记的老陈做了很多年了，跟我一样是个深耕的实在人（也吹一下自己哈哈），可以去多学学。


