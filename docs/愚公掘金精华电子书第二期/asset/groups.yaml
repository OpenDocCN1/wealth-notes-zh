  md: '

    ## 回答：


    你简历的最大问题：没有核心技能。


    我帮身边至少20位朋友优化过简历，每个人都有这个问题。


    普通人写简历的思路：我得过这个奖，我做的这个项目成绩不错，ok，我全给你写上去，这样可以表明我是个优秀的人了吧？


    错，错的离谱。


    你得知道，公司的管理层和HR在招人的时候，和你根本不是一个思路，屁股不在一个位置上，脑子就很难想到一块去。


    公司招人的时候，想的是我有一个业务缺人，这个人必须要会技能A，这样他一来就能把项目的空给补上。


    带着这个想法，管理层和HR在看简历（特别是3年以上工作经验的简历）的时候，脑子的想法只有一个：


    这个人会不会技能A？他怎么证明他的技能A很厉害？


    其他内容，都是一眼带过的，一份简历，初筛不会超过30秒，二轮候审不会超过5分钟。


    再看你的履历，做过3个项目，每个项目都在不同的领域，做过研发、运营管理和产品，相当于转职三次。这样的履历，如果简历写不好，那就是做事没有耐心、啥都会点但没有一个精通的形象。很难过中大型公司的简历筛选。


    公司不是不喜欢多面手，但多面手也必须要有一个专精项，不然不就成了打杂的了？哪里缺人你去哪？


    所以建议你，先给自己定一个核心能力，然后从自己的履历里，挑一些能够佐证这个核心能力的内容，放到简历里，从多个方面证明自己的核心能力。


    比如如果你把自己定位成业务增长型的产品经理（打个比方）那业务增长型的产品需要哪些辅助技能？产品搭建的能力、运营增长的能力、管理团队的能力、控制成本提高ROI的能力……


    辅助技能会有很多备选项，看看哪些是你具备的，挑出来，然后排一个优先级，重要的花大篇幅介绍，不重要的几句话带过。


    这么写下来，简历才有重点，既然公司感觉你有能力，也让HR感觉你有清晰的职业规划，一直在朝一个目标努力。


    给所有花友提个建议，如果你在写简历，建议你先去网上看至少20个别人的简历。因为网上流出的简历基本都是垃圾，你开动脑筋想一想，我要怎样才能从一堆垃圾简历中脱颖而出呢？


