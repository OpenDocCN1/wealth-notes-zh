    +   6. 没有任职受雇单位，仅取得劳务报酬、稿酬、特许权使用费所得，因为适用的预扣预缴率高于年终汇算时适用的税率，导致需要退税，这种需要做汇算清缴。（因为劳务报酬、稿酬这些是按20%预缴的，年度汇算的时候可能按3%或者10%就行了，多交的税通过汇算清缴退。涉及到劳务收入这块，因为算法不一样，要么退税，要么补税）


    +   7. 拿两份工资的，因为两个公司是各自算的，但是呢，合并起来可能就超过单独计算的税了，这种情况需要汇算清缴。


    +   8. 拿一份工资，又有兼职劳务收入、稿酬收入或特许权收入的，虽然拿到手的都是预扣了个税的，但是合并起来，就有可能涉及退税或补税。


    +   9. 反向思考：到底哪些人不用做汇算清缴呢？


    （1）只在一个单位取得工资薪金收入，而且那些扣除项目都已经按月扣了，那么无论你工资多少，预扣结果同最终汇算清缴结果都会是一样的，不需要再进行汇算清缴；


    （2）综合所得年收入不超过12万元，则不论补税金额多少，均不需办理年度汇算清缴；


    （3）要补税，但是补税金额不超过400元，则不论综合所得年收入的高低，均不需办理年度汇算清缴；


    （4）要退税，但是自愿放弃，也可以不办理汇算清缴。


