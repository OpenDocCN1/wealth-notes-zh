    # 如果想做知识付费, 在做定位的时候有什么要领和注意点呢?


    # 提问:


    请教下, 花老板的社群能做好, 我觉得跟定位定的好也不无关系的吧, 花爷当时是怎么想到“一百个淘金案例, 帮一部分中产突破天花板”这么一个定位的呢, 光是这个定位和介绍,
    让人就很感兴趣了, 如果想做知识付费, 在做定位的时候有什么要领和注意点呢?'
  - '[PAGE 317]


    # 回答：


    确实有关系。我见过很多做自媒体的，他们能写，他们有粉丝，他们本身能力很强，但他们赚不到钱，或者说商业价值没有被完全挖掘。


    因为人们为了不同的需求，付费的意愿是不同的。


    首先，有些行业天然离钱比较近，很多人说教人赚钱的人最赚钱，其实这个说法不对，事实上，所有让人变得更好、并且能够充分感知到自己在变好的行业，都比较赚钱。


    比如教育，你上个培训班，成绩提高了，教育赚钱。


    比如健康，你看个病，身体恢复了，健康赚钱。'
  - '[PAGE 318]


    比如医美，你整个容，以前不搭理你的男神来倒追你了，医美赚钱。


    其次，同样的行业，不同的细分需求也会导致付费意愿的不同。


    比如我昨天回答马场引流的那个问题说到，人们不愿意为了骑马付费，但很多人愿意为了骑马并且拍一张炫耀的照片付费。


    再比如，同样是做副业，微商的受众比兼职搬砖更受欢迎，因为门槛低、少吃苦，更符合宝妈的需求。


    人们总以为自己很理性，其实付费时，感性是绝对主导，赚感性的钱更加容易。


    最后，想长久的挖掘商业价值，一套价值体系非常重要。'
