    \n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\n## 只要688元的年费，平台下酒店免费住是如何盈利的？\n\n那天群里聊到如程酒店这个平台，在几个大号做软文投放，如下文：688住一整年酒店，这笔账怎么算？\n\
    \n核心机制就是：你交688元，买如程的会员，一年内你可以免费住如程平台的所有酒店。\n\n有的花友惊呆了，酒店住一晚少则一两百，大城市和热门景点688只够住一晚的，如程这么做，还怎么挣钱？\n\
    \n花爷之前说过，所有的生意，都逃不过算账，把账算清楚，大部分的商业模式就清楚了。\n\n营收大于成本，生意才有利润，那么如程的成本是多少呢？\n\n只要你一算，你就会发现，酒店民宿这个产品，和普通产品有个最大的不同。普通产品，买的人越多，销量就越大，只要你有库存，可以卖无限多，但酒店不一样。\n\
    \n酒店一间房，一年只能卖365晚，多一晚都卖不出去（闰年除外......）。\n\n如程平台有200多家酒店民宿，每间酒店对平台用户开放多少间房呢？它没有说，也就是说，如程可以通过控制放出的房间数，非常精确的控制自己的成本。\n\
    \n这个策略让如程几乎立于不败之地，如果交钱的会员多，如程可以多放一点房间，如果交钱的会员少，如程可以少放一点房间，无论放多少房间，如程都可以通过计算，通过控制房间数让自己盈利。\n\
    \n有花友上网查了查，果然，随便点一家广州的酒店，要提前三个月才能订到房。\n\n另外，如果你幸运的抢到了房间，在如程每次住宿还要交一笔押金，押金至少扣留一到两周。这一到两周你不能再预订酒店（控制你的预订周期），而且每天的押金也给如程提供了一大笔充裕的现金流，让他可以去投放获客，招募更多的付费会员。\n\
    \n一方面，控制房间数保证盈利，另一方面，用押金去做投放获客，再用新会员交的钱偿还押金，不断扩大规模。\n\n这是一个标准的数学游戏和财务游戏，账算得精的人，做生意不会太差。\n\
    \n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_630_0.png)\n\
    \n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\n## 国足薪水很高，为什么中国还是没人去踢足球呢？\n\n前几天国足输球，看到新闻说了两个数据：\n\
    \n- 国足教练在任900多天，薪资4亿人民币\n- 国足守门员7000多万全款买了套房，花爷顺手查了下，国足里年薪过千万的有好几个，整个中超平均年薪是700多万\n\
    \n花爷当时就觉得很奇怪：踢足球这么挣钱，为什么中国没人去踢足球呢？\n\n大家都知道，像乒乓球、羽毛球这些项目，运动员收入是远远不如同等级的足球篮球运动员的，更不要说什么举重、跳水、体操这些项目了。\n\
    \n那问题来了，一般越挣钱的行业，往里钻的人越多，那为什么家长更愿意送孩子去打乒乓球、羽毛球，却不送去足球篮球呢？\n\n中国足球注册运动员人数甚至不到乒乓球运动员的三分之一。\n\
    \n花爷在朋友圈发了这个疑问，花友留言总共有这么几种原因：\n\n- 足球高收入必须要顶尖，对天赋要求很高。\n\n但这个理由根本站不住脚，任何一项文体运动，乒乓球、羽毛球、各种乐器，每一项都是顶尖水平才有高收入，都需要天赋，足球篮球没有特异性。\n\
    \n- 足球篮球容易受伤，家长不愿意孩子去。\n\n确实有不少家长有这种想法，不过也有特例，比如送孩子去体操、举重的家长，对身体的伤害不比足球小吧？\n\n\
    另外，真实的足球篮球训练其实出现严重伤病的可能性也不是很大，特别是青少年训练时期，这点说明了家长侧的信息不对称。\n\n- 足球篮球需要场地，不像乒乓球那样，有成熟的训练学校。\n\
    \n这点有道理，足球篮球的正规青少年训练是最近几年才有的。不过，你现在去问问家长愿不愿意培养孩子去当足球运动员？家长大概率还是不愿意。\n\n- 足球想踢好，家里得有钱，得贿赂教练。\n\
    \n有个花友留言说，他朋友的朋友是从国少队退下来的，每年要给教练30万红包，家里没钱只能退出了。\n\n这话我刚听也吓了一跳，但花爷后来查了一下，国足大多数球员家境都挺普通的，像最出名的武磊，他爸是单位保安……真有天赋的孩子还是会冒尖，花友说的教练索要30万，我估计要么是口口相传夸大了，要么是教练找了个借口让他离队。\n"
