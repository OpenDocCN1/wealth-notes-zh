  - '[PAGE 174]


    本质就是一种短期贷款，我们个人投资者是借出方，在股票账户中，个人通过国债回购市场以约定的利率出借资金，然后在约定时间到了之后会给我们本钱和利息。


    有几个优点：安全高、收益稳、流动强、操作方便、手续费低。


    （1）安全性高，风险极低，除了有证监会管着，这东西是和国债有关呀，国家借的钱呀，可以把心放到肚子里去，可以说几乎0风险。


    （2）收益率时常飙升，逆回购的收益率跟市场的资金面有关，资金面越紧张，市场越需要钱，逆回购的收益率越高。


    （3）操作方便，有股票账户（需要开户）就可以直接操作，操作快捷，一键放贷，到期资金自动到账。'
