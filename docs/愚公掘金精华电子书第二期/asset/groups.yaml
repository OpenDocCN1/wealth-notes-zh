    # 花爷梦呓换酒钱


    让一部分中产先冲破天花板


    ## 怎么判别合理的消费，避免被“割韭菜”？


    近有股风气特别不好，一定要跟大家聊聊。


    你们发现没有，现在不管什么人，开口闭口喜欢把割韭菜三个字挂在嘴边。以前p2p、山寨币这种骗人的玩意儿，说是割韭菜，没毛病。


    后来割韭菜的范围越来越大，连花钱买汉服、买盲盒都是割韭菜。理由是汉服、盲盒玩具的制作成本低，却因为稀有属性，在市场卖出高价，所以就是坑、就是割韭菜。


    花爷一脸问号，这么说的话，所有奢侈品都是割韭菜，富人全部都是韭菜？


    不不不，不对。


    很多人觉得，所有的商品都应该是质量好的、划算的、高性价比的，错了，大错特错。


    如果消费一定要划分等级的话，可以粗略的划分成三级，分别是：


    1. 穷人买垃圾


    穷人只需要便宜，便宜就是一切，这就是穷人总喜欢买垃圾商品的根本原因。


    拼多多最早开辟下沉市场，全是山寨、低质量的垃圾，照样势如破竹占领市场，为什么？


    因为只要便宜，穷人哪怕在拼多多花5块钱买的10斤桃子里有一半是烂的，他还是会安慰自己：5块钱买了5斤好桃子，也挺划算呢。


    2. 中产买性价比


    真正在乎性价比的，是中产人群。


    拼多多占领了下沉市场之后，想要继续扩张，怎么办？冲击中产人群。


    怎么冲击？搞百亿官方补贴，拼性价比，我什么都比市场价便宜，中产你来不来？


    事实证明，中产很老实，拼多多的月活在2019第一季度又大幅上涨了，GMV已经超过了京东。


    3. 富人买稀缺性


    这个不用说了吧？你不会真以为富人买八星八钻的手机是因为信号比较好吧？


    这三大规律，在漫长的商业历史里，都很难被冲击，只是稍有调整。


    比如最近，大家都说消费升级，但真的所有消费都升级了吗？不是。中产只是偶尔买点奢侈品，幻想自己获得了富人阶层的准入权而已，实际上你看看中产的日常消费，还是在买性价比。


    话说回来，如果没有性价比就是割韭菜的话，那几十年里所有做穷人和富人生意的，都是在割韭菜？


    显然不可能。


    事实上，只要商品的宣传承诺，和交付的产品服务一致，都是正经做生意，不能算割韭菜。


    比如说最近很火的球鞋吧，如果你跟人说来炒鞋吧立马一夜暴富，那肯定是割韭菜。但如果有钱人花一万块钱买了一双稀有球鞋回家穿/珍藏，这不是割韭菜，而是市场稀缺性的正常表现，是正正经经的做生意。


    之所以说这么多，是因为割韭菜这三个字，充斥了太多蔑视、浮躁的味道。如果你常把割韭菜三个字挂嘴边，很容易漠视身边的商业机会和案例。而花爷反复跟大家强调了：


    信息和机会都在我们身边，别人的缺点，我们注意，别人的优点，我们重点学习。


    割韭菜看上去赚快钱、轻松，但很多人觉得自己是一把镰刀，其实只是一根想得太多的韭菜。


    到最后能长期盈利的，其实是真正创造价值做生意的人，不信你看看如今互联网圈真正的大企业里，是做生意的多，还是割韭菜的多？


