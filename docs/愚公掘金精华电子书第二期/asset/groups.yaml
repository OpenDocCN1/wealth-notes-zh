    # 花友分享：知乎上运营两个月，给公众号引粉1W+的实操分享


    最近看挺多同学在讨论知乎的玩法，刚好今年我开始认真的运营着一个知乎号。


    认真运营两个月时间里，目前通过自己的一些策略，已经打造了好几个1K以上的高赞问答，成功给自己的公众号引流1W+，个人号引流1K+。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_849_0.png)


    而且这些问答是有很强的可复制性，具体我把它分成三种类型，一一给大家讲解背后的操作细节。


    图文版看石墨链接：


    https://shimo.im/docs/xkTRPGyQHWGWWhyvc/


    《知乎实战案例》


    文字版：


    ## 一 书单合集型


    效果：667 点赞，公众号引流 1K+


    知乎问题：《不同领域的圣经级书籍有哪些？》


    问答链接： 不同领域的圣经级书籍有哪些？ - 知乎


    问答模式：书单自动化程序 + 细节优化 + 思维导图


    第一个类型是书单合集型问答，这类问题典型的代表就是之前亦仁讲过的一个案例：把该问题下的所有书单都整理成一个excel表。我自身也是从这个问答里得到启发，但我做了些优化；


    ### 优化点一： 程序自动收集


    程序：知乎爬虫+豆瓣爬虫


    效果：一键生成书单excel表单


    我自身是专业做爬虫出身的，所以我自己写了个程序，自动帮我把该问题下所有书单收集起来。然后在写了爬豆瓣书籍信息的程序配套使用，达到只要输入知乎问答的编号，就可以一键生成带有书单详细信息的表格。在上面的问答中，我收集到了一共
    5K+ 详细书籍信息。


    见图片一


    ### 优化点二：添加更优质的内容


    通过上面自己的写的一套程序，我就可以很轻松收集全所有书单的信息。但这个还不够，因为这样的玩法已经在知乎上被很多人使用了，所以我们要在继续的优化，即添加更多优质的内容。


    所以我在收集起书单的信息之后，额外添加了两个细节：1 豆瓣简介与书评；2 作者生平词条；


    见图片二


    把这两部分添加上去，是为了让读者可以提前先了解这本书基本的信息，从而判断是否适合自己，避免在一些不适合自己的书籍上浪费时间。 添加这两部分，从而让知乎用户觉得这个回答非常走心。


    ### 优化点三：添加高效读书思维导图


    思维导图是在知乎上非常有效的提高点赞的方式，并且知乎上的用户非常吃这套，等等要讲的第二个类型「专业资源型」的案例就是用到这个方法。


    结合这个书单问答，我找了一个高效读书思维导图，利用 Xmind 软件，生成了一个非常酷的思维导图。


    见图片三


    ### 总结


    自动化程序生成书单信息表，细节做优化，添加高效阅读思维导图，最后所有资源都引流到公众号才能获取。


    这是一套标准化的流程，可以复用到任何书单集的问答中。并且现在我自已优化到，只要 10 分钟，我就可以生产一个这样的问答。


    ## 二 专业资源型


    效果：3K点赞，公众号引流 5K+，个人号添加 600+


    知乎问答：《你们都是怎么学Python的？》


    问答链接：[你们都是怎么学 Python 的? - 知乎](http://example.com)


    问答模式：资源型合集 + 思维导图


    因为我自身是做Python专业出身的，并且有个运营了一年多，目前6W读者的公众号「痴海」，所以自身对于Python领域的干货非常了解。所以我在知乎上找了很多
    Python 相关的问答。


    这个问答就是纯粹的堆 Python 领域的干货集合，按照从入门到进阶的顺序，一一的列举 Python 的干货。

    - 第一部分：Python 基础 14 张思维导图；

    - 第二部分：Python 学习资料

    - 第三部分：Python 书籍推荐


    最后引导用户点赞，资源获取要到我公众号上获取。


    专业资源型的问答简单粗暴，直接把这个领域的干货往上轰炸就行，让人一看就忍不住要收藏。当然细节点大家也要优化下，比如看这类问答的用户，一般是刚入门的，所以资料放的顺序也要符合从入门到进阶。


    可能有同学会问了，这些专业型的问答怎么才能在知乎上找到？


    系统推荐的或者自己搜索的总是很难找到适合自己的问答。


    玩知乎另一个很重要的点，就是如何挑选问答。


    针对这点我同样写了一个软件，原理就是利用知乎 50W+ 的 SEO 关键词数据，配合知乎的爬虫，你只要输入关键词，软件就会输入对应的知乎问答表格数据，帮助你挑选合适的问答。


    即输入相应关键词，等待获取时间，即可在程序目录下输出对应的 csv 文件。


    见图片四


    以Python为例，通过程序输入“Python”关键词，即可生成对应的表格。


    见图片五


    ### 总结


    每个人都有自身专注的领域，对于这个领域的干货也非常清楚，知乎也是聚集各个领域专业的人群社区，所以「专业资源型」问答是非常适合知乎的。并且配合知乎问答筛选软件，可以快速帮你找到你的领域相应的问答。


    ## 三 热点预测型


    效果：785点赞，公众号引流 500+


    知乎问答：《如何看待9.27全国各地大学课堂惨叫事件？》


    问答链接：https://www.zhihu.com/question/34802883 0/answer/83…


    问答模式：提前预测热点 + 整理信息


    最后要讲的一类问答，是热点型问答，这类问答的特点就是流量非常大。并且是可以提前预测到的，一般来说微博上热门的话题，2 小时左右知乎上也会火。广泛讨论的社会型问题同样会上热搜。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_858_0.png)


    举个我的实战案例，今年 9.27 号各个高校出现了一个恶搞软件，因为我自身朋友圈有很多学生群体，所以很早就知道这个信息。我敏锐的捕捉到这个话题会火，因为知乎上学生的群体是非常多的。


    所以我一直在知乎搜索相应的关键词「9.27」、「恶搞软件」、「全国大学生」等等。很快就有最新讨论的标准问答出现，类似这样的。


    见图片六


    然后过了一会儿，这个问答有了正在热议的标识，类似这样的。


    见图片七


    说明这个问答已经上了知乎热搜了。


    确定好有大流量的问答之后，我就开始下一步收集写文的素材资料，整理成一个问答。


    对于突发的热点事件，其实大部分人都是抱着吃瓜的心态，并且都是一脸懵逼不知发生了什么。所以我们要做的就是尽可能的收集齐，对于该热点事件的信息，然后按照一定逻辑把整件事描述清楚，中间可以加点自己的观点。


    迅速整理成一篇有点信息含量的问答，快速占领前20个问答，这样是可以得到非常大的流量。


    比如说我这个问答，最初点赞只有 10 几个，阅读数就达到了 5K+。而到如今 785 点赞，阅读数达到了 8W+。


    另一个最近的热点拼多多，我也是迅速整理成一篇回答，阅读数达到了 20W+，不过由于一些推广内容，现在被删除了。


    ### 总结


    热点型问题，流量大，并且是可提前预测的，这样大家是有时间进行提前布局。要点就是快，所以尽可能的按一个套路去写作，比如事件脉络信息整理。但热点事件的另一个缺点：流量不够精准，所以我一般回答热点事件都是为了品牌曝光，为知乎账号涨粉用的。


    ## 四 知乎实战总结


    已上就是我给大家带来的三种问答类型的实战总结，做流量从来都不是一触而就的事，这背后是需要一套完整的增长体系做支持。从引流、激活、留存、变现到推荐，每个步骤都会对应的策略来支持我去做。


    知乎的玩法也是如此，从问答筛选、问答写作、前期冷启动、中期大V点赞、最后引流变现。每个环节都有对应的策略，都需要大家去研究。


    今天给大家讲解的三种实战类型，也不过是知乎当中的冰山一角，我自身也在不断的总结和摸索知乎对应的实战技巧，目前已经有一套系统的方法论，也开了一个知乎实战群，带大家一起玩知乎。


    最近开始研究知乎好物号的玩法，待我继续出成果之后，再来星球分享具体玩法。


