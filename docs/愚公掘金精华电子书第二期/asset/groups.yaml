    # 想针对小县城人群做一个类似于大众点评的餐饮类线上平台，应该怎么起步？


    **提问：**


    花爷，我想做一个饮食店线上平台，大致想法就是把小县城所有饮食店按照类别分类，比如小吃店，奶茶店，面食馆，炒菜馆等发起一个人气排行排名，关注这个平台的群众可以对饮食店进行投票，店主也可以通过付费的形式增加人气排名。这样一来对接消费群体，在这个平台可以很轻松的了解本地区饮食有哪些，综合排行靠前的有哪几家。另一方面增加饮食店的曝光度，为一些质量好但知名度不高的小店打广告。想问下这种类型的平台用公众号比较操作，还是用app等。做这种平台貌似挺复杂的，具体要怎么操作，花爷有没有类似的资源对接下。


