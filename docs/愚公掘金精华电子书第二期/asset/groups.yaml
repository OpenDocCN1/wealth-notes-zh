    ## 在微信卖蛋糕的营收已经超过主业，应不应该全职做副业？


    **提问：**


    花爷你好，我本职是做西点的，老公是个厨师，由于行业上班时间不固定，两个人都碰不到面，他就叫我趁年轻改行，然后我就改行做了小公司行政，副业就在微信卖卖蛋糕甜品，现在副业收入已经超过主业，但我平时上班，时间有限，副业收入已经到瓶颈了，主业又没有其他发展空间，家里人又不支持我开店，所以我很迷茫不知道应该如何提升收入，是放弃主业全身心做副业呢，还是提升主业能力再去学习呢？第一次提问有点流水账，希望花爷能指点迷津，感谢，比心


    **回答：**


    你家人不让你开店是对的，在微信卖卖蛋糕甜点，和开个蛋糕店完全不是一回事。现在蛋糕店不做连锁品牌非常吃亏（其实连锁品牌像幸福西饼，加盟店也不怎么赚钱），新手开蛋糕店，亏损的概率太大了。


    你副业卖蛋糕的收入能超过主业，说明你销售手艺还不错。但花爷说过，想把副业变副业，副业收入要达到主业的三倍才稳妥，至少至少是两倍。


    你的问题是，就算你能把副业收入做到两三倍，但你时间有限，也没空接这么多生意。我的建议是，你先看看获客能不能扩大了原来的2-3倍。


    假设你原来主要靠已有的微信朋友关系销售蛋糕，但你就开始尝试，从外部获取流量。比如你尝试了一下，微信加10个好友就能成交一单，那就算一算，要加多少好友，你的营收可以翻一倍。


    假设加200个好友营收可以翻一倍，那你可以先试试自己有没有能力，每月稳定的加100-200好友。


    加了好友不急着重成交，直说你时间不够，每天蛋糕是限量的，让他们抢购。这样相当于你每天做蛋糕的时间不变，但客源不断在增长，如果能保证客源增长稳定，你就可以全职提高产量了。


    不断获取客户的方法很多，做活动让客服邀请好友、微博/抖音/快手上做视频宣传、收代理接单等等，可以一个个试过来，看看哪个适合你自己。这个尝试的过程，在外人看来可能有些蠢，可能家人会不理解你为什么要去做自己不擅长的事，没关系，坚持下去，为了全职的目标坚持下去。


