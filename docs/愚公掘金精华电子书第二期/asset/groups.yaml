    前面3招，都是让员工在新手村更努力的攀爬，但我们必须承认一点，没有人想做一辈子客服，新手村也是有终点的，这类需求是挡不住的。


    所以，也要给所有人准备一个终极出口：


    小组长、小团长中表现最好的，有机会直接转岗到公司最有发展潜力的部门，薪水和职业前景再上一个台阶。


    如此一来，普通客服-小组长-小团长-转岗，这套阶层体系算是跑通了。还是那句话，你不能避免离职，但这套体系会最大限度的延长员工的在职时长和努力程度。


    最后再强调一点：


    钱只是调节的工具，员工最想看到的，其实是成为更好的自己。'
