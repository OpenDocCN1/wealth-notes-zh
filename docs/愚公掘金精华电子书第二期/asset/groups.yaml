    # 想问下花爷有啥好的案例渠道和好的案例分析方法吗？


    **提问：**


    花爷好，重读你关于长投的分析，深有感触。最近也开始学习案例分析，向成功的学经验，向失败的学教训。但自己看书钻研总感觉差点意思，想问下花爷有啥好的案例渠道和好的案例分析方法吗？认同樊登讲书的一句话：一般人读的是书里的名人名言，我却理出了书里的内在逻辑。我认同这句话，但对如何理出逻辑却不得其法。希望花爷回答，感谢！


    **回答：**


    先说明你的一个误区，樊登那种拆书整理逻辑，和分析商业案例，是两码事。


    拆书，说白了是一个整理的工作。分析商业案例，却要求有主动探索、归纳的能力。


    后者的难度要大得多，你不会分析案例很正常，小白建议从前者开始做起。


    想培养分析、调查的能力，至少要分三个阶段：


    ## 1. 整理100次逻辑的能力


    像樊登这种拆书，是非常适合小白培养逻辑能力的。因为每本书（甚至包括小说），都是自带逻辑，每一章节的主题、论点、论据都非常清楚，整理起来并不难。


    另一方面，整理100次（虚指，小白怎么也得30次朝上吧）也是一个案例逻辑积累的过程，所谓庖丁解牛，你解过100头牛，不仅解牛熟练，解别的动物也不会差到哪去。


    ## 2. 提问的能力


    这个阶段是最容易被忽视的。从拆书到自己分析案例，中间过渡的最大缺口就是发现问题、找到合适的分析切口。


    比如说我写长投这篇文章吧，长投的案例其实一直明摆着，但鲜有人关注。我分析的切入口，就来自于一个提问：一家卖9.9元课的公司，凭什么融资几个亿？


    在这个阶段，你要对着自己的在上个阶段整理的100个拆书逻辑，对每一个环节提出可能的质疑。找到好问题，才有好的分析方向。


    ## 3. 分析和寻找证据的能力


    这个阶段是普通人最大的瓶颈了，不仅要分析能力，还需要有不少工具做辅助。这种高阶能力这里就不细说了，说不明白，以后市面上看到合适的课程，推给有需要的花友。


    昨天刚跟白一喵聊，说到新时代自媒体开始进入新的红利期，就是优质内容红利。


    什么是优质内容？这三大块能力打通，加上写作/视频能力的培训，就是优质内容。


