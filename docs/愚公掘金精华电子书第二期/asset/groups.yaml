    ## 深圳可能会成为中国最后一个价值洼地


    说一个最近的思考，先直接放结论：深圳可能会成为中国最后一个价值洼地。


    大家都知道因为HK人天天踩街，最近发了一个对深圳利好的文件。一份文件就能让深圳再次起飞吗？当然不是，但分析之后会发现，其他方面的因素也站在深圳这边。


    HK那边踩街最凶的时候，大陆zf是很沉得住气的。这就像儿子跟爸爸闹矛盾，要是关上了门，那爸爸把儿子打一顿就完事了。但关键是，家门是敞开的，儿子从小又跟爸爸不亲，打一顿不仅会激化矛盾，还会让邻居看笑话。所以咱们就耗着，先冷处理，儿子精力再好，也不能一直闹下去。


    现在事态是渐渐平息了，但根上的问题还没解决，儿子终归是儿子，到底怎样让他跟大家庭融合呢？


    有人说，要控制住教育和媒体。对，zf在国际舆论这块，确实一直做得不好，最近也有苗头在整治这块，问题是现在开始发力，毕竟有点晚了，儿子都长大成人了，想做思想教育就没那么容易了。


    那最好的办法是什么呢？


    既然爸爸跟儿子闹僵了，那就让哥哥去跟儿子相处。一方面，哥哥和儿子关系更和谐，能相处得来，另一方面，哥哥是爸爸一手培养起来的，爸爸的好，儿子在哥哥的身上能感知到。


    很多事情就是这样，你舔着脸去讨好，或者严厉的去管教，都显得别有用心，一定得有一个缓冲区，让第三方介入，慢慢去解决误会和对立关系。


    现在，深圳，或者说以深圳为首的城市群，就是这个哥哥的角色，在深圳文件里，有一条清晰的写着，鼓励港澳人到深圳发展。等到有一天，HK和深圳城市群融合，就很难再闹幺蛾子。


    那深圳能不能担当这个缓冲区重任呢？这就要提到深圳的价值洼地。


    ### 1. 人才洼地


    深圳配备的城市资源，是严重跟不上一线城市的体量的，比如教育和医疗。


    而这背后的主要原因，是高校人才的缺失，在华中华北，上海北京南京都是教育重镇，源源不断的输出人才，特别是专业的服务类人才，但深圳没有名校，甚至广东的名校都不多。


    我在之前讲过，华中某普通医科大学的研究生，毕业到深圳月收入可以到4w以上 (https://t.zsxq.com/23jqv3v) ，这在内陆是绝对不可能的事，但因为深圳的人才洼地，这种案例真实发生了。


    相应的，北大清华的毕业生平均月薪不过一万多，如果他们愿意到深圳去当老师，你猜能赚多少？


    已经有小部分年轻人明白了这个道理，吃上了红利，但大多数人，是看不透的。


    而HK有世界排名靠前的大学，名校毕业生们想赚钱最终都去卖保险了，你当他们喜欢卖保险？


    深圳在发展过程中的人才洼地，给HK融合内陆提供了空间。


    ### 2. 产业洼地


    深圳并不是一个全面发展的城市，产业洼地的现象，每个城市都存在，但不是每个城市都有机会去填平的。


    深圳文件里提到，要全面开花，各个产业大发展。说是这么说，但文化和金融这两块，毕竟有特殊性，短时间想赶上北京上海，可能性很小。


    我最关注的是高新科研行业。


    国家的根本竞争力，在技术。工业革命之前欧洲的经济增速只有0.05%，是技术通过实业改变了这个世界。


    发展中国家有一个巨大的崛起红利，就是可以直接购买发达国家的高新技术，亚洲四小龙和我国的崛起都是如此。


    但现在，我们也到了自己搞科研创新的阶段了。


    我国之前的科研模式是举全国之力做攻坚，这个模式不会一直管用，这几年一直有靠市场力量搞科研的苗头，而深圳本身是具备这方面的基因的。


    产业洼地和人才洼地就像左右手，相辅相成，最终推动整个轮盘开始滚动。


    ### 3. 人口洼地


    虽然开头写的是深圳，但我在正文里一直强调的是以深圳为首的城市群。


    如果1和2中的左右手能推动滚轮，一定会带动人口的再一次涌入。但人很难全部涌入深圳，一方面深圳面积小，zf对一线城市的人口规划这几年定的很死，另一方面人口过多会引起房价问题，这个在下一小节再细说。


    所以一旦深圳成功，几乎一定会带动周边城市进一步城市化（北京此时低下了头），事实上我国城市化的后半段，都是以四五线人口涌入二线城市为主。


    这一点再深入研究的话，可以查一查东南城市群的人口流动情况。


    ### 4. 房价洼地


    最后说说大家最关心的房价，七月份全国房价涨幅能跑过通胀的不超过十个，涨幅最高的几个城市，临沂、南通、宁波、苏州——都是某个城市群带动的周边城市。


    我说深圳城市群可能是最后一个价值洼地，为什么是最后呢？因为我国城镇化已经接近60%了，一线城市的房价会被严格控制（特别是HK房价问题之后），三四五线城市推动房价的因素不足，最后的机会一定在二线城市的进一步人口涌入了。


    这么看下来，深圳城市群带动的二线城市，未来很可能是最后一批房产红利，其余的房市只会平稳或阴跌。


    本来我从来不做任何投资建议的，没必要担这个责任，但是买房这个事吧，确实对人生影响很大，所以我给一个目前的看法吧：


    如果你恰好在广东发展，且有买房的意愿，可以留意惠州。


    说了近两千字，最后强调下，深圳城市群再好，你去了也不是百分百成功，只是搏一个更大的概率，关键还是看眼界和努力。


    如果你本身在其他城市有很好的基础，也不用冒然冲过去深漂，但可以保持关注，地理上的距离对人生的限制，比你想象的要小。


