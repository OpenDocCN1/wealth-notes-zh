    # # 我们拆解长投的文章会引起给我们带来麻烦么？


    提问：


    长投学堂的拆解文章，是绝佳的流量入口，但也同时暴露了自己的坐标。相信长投的工作人员已经发现了，他们有没有对这篇文章提出异议，要求删帖或者修改呢？


