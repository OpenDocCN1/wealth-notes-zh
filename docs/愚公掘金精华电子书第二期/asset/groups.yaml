    # 为什么拼多多大盘跌了22%我还是长期看好拼多多


    花爷总结双十一的时候提到，拼多多短期内是有明显问题的，但长期我还是比较看好它。


    昨天拼多多发财报，今早收盘大跌22%。


    就算预测对了趋势，也没什么了不起，不然我也自吹自擂是股神了，没意思。'
  - '[PAGE 575]


    能猜对趋势的人很多，但没人能精准预测到趋势具体在哪一天落实在股价上。所以巴菲特才说，股市在短期是投票器，在长期是称重器。


    我一直建议，年轻人心浮气躁的话不要碰投资，也是这个道理。在投资领域最稳妥的方法，永远是选择和时间一起慢慢变富。你越急，投资就越接近赌博。


    +   3.拼多多今年从第一季度飙到年底，一路狂奔，GMV已经超过京东，这次双十一的百亿补贴声量也特别大。


    但花爷说过，市场兴奋的时候你要冷静，市场失落的时候你要盯紧。


    当初很多人骂拼多多，我在星球里看好它，现在越来越多人看好拼多多，我反而看到一些小问题。


    拼多多作为平台型电商 按理说GMV超过京东'
  - '[PAGE 576]


    拼多多作为当日型电商，按理说GMV超过京东这种自营型电商的话，市值应该比京东高20%以上最少，但现在两者市值差不多，说明资本市场也对拼多多顾虑。


    核心就是拼多多靠补贴获取的中产用户，补贴断了之后还能留住吗？


    从目前来看，能留住一部分，但留住的也完全是低价的购买力，冲击中高端还没看到太大希望。


    不过这些问题只是当下的问题，人们总是夸大当前的问题和业绩，忽略长期的意义。长期我还是看好拼多多。


