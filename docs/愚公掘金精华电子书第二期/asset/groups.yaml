    \n# “金花奖”挑战：家用按摩椅的市场如何？投资是否可行？\n\n### 挑战提问：\n\n花爷你好！最近公司办公室门口多了两台按摩椅，微信扫码支付按摩的，但是都没什么人用。我觉得可能在办公空间的按摩椅这个场景是有问题的，因为你上班时间按摩，怕被老板说上班时间去按摩，不好好工作。下班的时候人都想早点回家了，也没人还要先按摩再回家。\n\
    \n上周去看电影，发现电影院门口有两排按摩椅，用的人还挺多的，这种娱乐场所又需要等待的场景才适合按摩椅吧。\n\n最近我妈说她腰疼，去做了半个月理疗，我在想给家里买一个按摩椅。\n\
    \n想问下花爷，家用按摩椅的市场有多大，市场教育需要多长的时间，现在投资家用按摩椅是否可行？\n\n### 花爷回答：\n\n按摩椅之前有两个明显的上升趋势。\n\
    \n第一个就是你说的，商场里共享按摩椅的加盟。\n\n这个故事确实讲的很好听，买一台按摩椅加盟，放在商场、电影院里，用户有一定的使用需求，你不用管它，每天都能有收入入账。\n\
    \n当时按摩椅的品牌方宣传时算了一笔账，说一台按摩椅代理加盟费几千元，放在商场两个月你就能回本，后面都是躺赚。\n\n很多人确实吃这套，掏钱代理加盟的不少。\n\
    \n实际情况肯定没有品牌方说的那么好，因为具体运营时，还涉及到场地费用、耗损、维修等等。\n\n据我的了解，大多数代理商的运营情况也就是刚刚持平，小部分人有盈利。不管怎么样，品牌方肯定赚了，生产按摩椅的厂家肯定也赚了。\n\
    \n第二个就是你说的家用按摩椅。\n\n这种其实不是普遍需求，首先按摩椅不便宜，其次占地方，不在大多数家庭的采购范围之内。\n\n所以你去商场里卖按摩椅的店铺看看，都是瞄准中产以上的富裕家庭，请一个刘德华这样的中老年偶像代言，一通包装宣传，千把块按摩椅卖到上万块。\n\
    \n所以你说的家用按摩椅，其实市场需求没有那么宽，如果真的考虑这个领域，建议从更轻型的按摩器入手。比如肩颈、腰椎的按摩器，针对局部疾病，几百上千块一个。这个领域的玩家现在是逐渐增多的，小米网易这类品牌也在入局。\n\
    \n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_755_0.png)\n\
    \n**花爷梦呓换酒钱**\n\n让一部分中产先冲破天花板\n\n# “金花奖”挑战：对标Costco的必要商城的商业模式是什么？它会做大么？\n\n###\
    \ 挑战提问：\n\n想了解了一下花爷对这个“必要”的看法，文案看着是真给力，热点，明星，高品质低价，国外产品比较等等都弄上了，看着好不诱人，这和瓜子二手车的商业模式有什么区别，还有这算掀桌子吗？\n\
    \n能让“把 1 元当 10 万元花”的精明上海人没有似的疯狂，仅 5 小时就因客流爆满被迫暂停营业！\n\n霎时间，只有上海人才能买到便宜的好货，好像成了一种身份特权和地域优越感。\n\
    \n然而，不久，就有媒体和网友爆料称，Costco 被同样重视价廉的中国公司在 Costco 店内当场挑战。\n\n上海人拔到了韭菜？\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_757_0.png)\n\
    \n截图源于经济观察报微信公众号\n\n这家公司高管本来是组团去上海 Costco 参观学习，没想到去看后剧情发生惊人转变，一高管当场发起悬赏：只要发现必要商城上的同类商品比\
    \ Costco 的贵，通过必要商城 APP，找到平台客服，上传相应证据，必要商城将给差价十倍的奖金！\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_758_0.png)\n\
    \n大量涌入 Costco 的不止普通消费者。9 月 6 日，必要商城副总裁苗方林带队考察 Costco，考察结束后，他说“必要商城同样的东西，比 Costco\
    \ 便宜至少 30%”，并当场宣布正式挑战 Costco：“任何人，只要发现必要上的同类商品比 Costco 的贵，通过必要 APP，找到平台客服，上传相应证据，必要将按照原售价的十倍给用户奖金！”\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_758_1.png)\n\n截图源于 36 氪微信公众号\n\n这新闻一出，就惊呆了一众吃瓜群众！！！一向精明的上海人居然被骗了！那些排的队伍，流汗的红包了！\n\
    \n## 01.\n\n这个 Costco，到底真的是国色天香，还是用了营销套路的美颜滤镜，欺骗了我们所有人？\n\n开业没几天，特价的茅台没了，部分商品开始涨价。\n\
    \n有网友 po 出了媒体提到的产品对比图：\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_758_2.png)\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_759_0.png)\n\n相信大家对，看了对比图，第一的直观感受是：\n\
    \n右图的东西更便宜！\n\n什么？这个号称性价比之王的 Costco，竟然比某商城贵 30% 以上！\n\n* 差距 30% 以上是什么概念？\n  *\
    \ 在家纺上，一年能省出 2 万；\n  * 在美妆，化妆品上，一年能省出 5 万；\n  * 算下来，一年差不多能省出一套房的首付吧。\n\n咦？“便宜”难道不是\
    \ Costco 最大的招牌么？\n\n## 02\n\n# Costco 疯狂背后，隐藏了什么真相？\n\n大家都知道，在美国，线下零售业营销的套路极为成熟。\n\
    \nCostco 的本质，就是一个线下零售渠道，无论其如何吹捧，其商业目的只有一个：最大程度地让客户消费。\n\n* 用爱马仕，飞天茅台这样的超级商品吸引消费者的爆品营销；\n\
    * 用“超大包装肯定超值”的大包装心里暗示策略；\n\n这背后的一切，是一个巨大的黑洞。\n\n美国人打算于上百于之久的线下零售商，来收割从小学习孙子兵法的中国人了？\n\
    \n没想到，Costco 只经历了“7 天”的“爱跑商城”。\n\n更没想到，在美国被称为神一样的 Costco，进入中国不到一个月，就被必要商城挑战。\n\
    \n此事，连美国人都在推特上热议，甚至请川普把它要列入制裁名单：\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_760_0.png)\n\
    \n截图源于：Twitter（推特）\n\n## 03\n\n# 中国黑马，把“性价比”做到了极致。\n\n如果 Costco 性价比之王人设都会坍塌，还有没有真心实意的零售商？\n\
    \n在 Costco 有一句名言，曾被各路零售行业从业者奉为格言——降低成本最好的办法，就是提高销售。\n\nCostco 是如何提高销售的？\nCostco\
    \ 用一笔钱进货之后，一个月之内就能把货物卖出去。这也意味着，同一笔钱，Costco 一年可以周转 12 次。\n\n而其他同类普通超市，一年只能周转 4\
    \ 次，极高的周转率才是保证 Costco 成本降低的核心关键。\n\n在古典零售领域，Costco 已经足够优秀，但是：\n\n> 如果说 Costco\
    \ 是汗血宝马，\n> 那么必要商城就是现代的主马。\n\n一，是线上电商和线下门店的成本差异。\n\n中国和美国最大的差异之一是：在美国，地便宜，人工贵。而中国是反过来，地贵，人工便宜。\n\
    \nCostco 不懂中国，更不懂早已被电商“惯坏了”的中国网民：\n\n| 项目 | 在必要买东西 | 在Costco买东西 |\n| :--- | :---\
    \ | :--- |\n| 会员费 | 无 | 299元 |\n| 停车场 | 无 | 3小时 + 30元起 |\n| 排队时间 | 无 | 2小时 + |\n\
    | 来回路费 | 顺丰包邮 | 打车费平均80元 |\n| 体力消耗 | 很少 | 累到趴下 |\n| 库存消耗 | 及时、小而即食 | 大、吃不完、浪费\
    \ |\n| 性价比 | 省心、成本定价 | 比必要贵30%以上 |\n| 退换 | 响应快！差评超1%商品立即下架！ | 排队退卡！ |\n\n二、两家公司都强调砍掉“中间环节”，但必要商城是砍掉“所有中间环节”。\n\
    \n在竞争激烈的国际环境督促下，中国高端工厂早已发展到和日本、德国一致高下的地步。\n\n越来越多的品牌，只不过是在中国工厂的研发、中国工厂的设计、中国的产品上，贴了个商标，然后再以几十倍、再卖给中国人而已。\n\
    \n其实，美国 Costco 上面大部分的商品和中国必要商城上的商品的“诞生地”都是中国。\n\n商品往往从工厂，到了经销商手里，再到品牌、Costco、消费者，中间经过了层层的传递，每个环节都意味着成本的增加。\n\
    \n有什么比从工厂直接发售到消费者手中成本更低？\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_762_0.png)\n\
    \n三、必要商城模式的核心是大牌工厂直供。\n\n和 Costco 一年 12 次的周转率不同，必要商城是大牌工厂直供，压根就不玩周转，完全是 0 库存。\n\
    \n拿眼镜举例子，传统眼镜的镜片都是库存，不同的度数都要备好，就算它 25 度一个组合，这个存货也已经很可观了，眼镜的价格自然而然也就上去了。\n\n必要商城协助工厂自建柔性生产线，真正实现灵活生产。所以在生产、下单之前，工厂=0\
    \ 库存。减去高额的库存成本以后，自然售价也就下去了。\n\n著名自媒体人Keso在“毕业信任力经济”一文中曾这样写道：\n\n> “五年来，作为必要的用户，我没有收到过一条来自必要的广告短信。\n\
    > 几乎所有被普遍采用的流量手段，必要都本能地拒绝，比如疯狂打大促，搞会员制。因为在毕业看来，如果打折才值，说明平时不值，如果会员才值，说明非会员不值。\n\
    > 必要可能是唯一一个自己不搞大促，也不参与别人家大促的电商平台。在必要上，你不用等 6.18、双 11，什么时侯下单都不会亏，你永远都不会有错过今天，还要再等一年的纠结、困惑和迫不及待。”\n\
    \nCostco 这家诞生在上世纪 70 年代的零售贸易企业，在中国拥有世界上最复杂的商业形态、先进制造业土壤之中，到底能撑多久，确实有待时间验证。\n\n\
    长江后浪推前浪，陈旧的老模式，总归不得不给一些“思维活跃，不墨守成规”的新模式让路。\n\n## 04.\n\n# 中国的必要商城和美国的 Costco，到底谁更得人心？\n\
    \n目标用户同样是一二线城市的中产阶级，Costco 和必要商城都深知，品质才是第一。\n\n两者对产品都进行着严格把控，Costco 有 4000 个单品，必要商城选了\
    \ 5 年也只有 6000 个单品。\n\nCostco 刚刚进入中国两周，就遭遇了背靠中国制造优势的中国公司的挑战。\n\n众多媒体把一个年轻的中国企业推到前台，让他直面碾压全世界零售的跨国公司，谁能赢？必要凭什么？Costco\
    \ 能走多远？\n\n必要商城高品质背后，还有一个更大的命题：\n\n新国货的崛起。\n\n我们的国产消费品已然拔地而起，成为影响世界的一股势力。这背后是工厂的研发实力和对产品的品控能力。\n\
    \n而必要商城的背后，是供应链的重组，是几百家顶级工厂，生产出来的产品直接出口欧美、日韩、东南亚……等世界各地。\n\n有报道说，曾经有个用户在必要商城买了一件\
    \ 200 元的床单，等过来之后发现贴的是希尔顿酒店 5000 块的标签，咨询客服，才知这两者是同一个生产流水线上下来的，不小心被工厂发错了货。\n\n“原来我买的商品，真的是大牌品质啊。”\n\
    \n如果 Costco 是整合了优质商品，那必要商城是整合了优质制造。\n\n## 0.5\n\n# 当上海人，把美国商超挤爆到停业的同时，驻京的美国大使们在干嘛？\n\
    \n某外交公寓门口，快递小哥拿着一个网购包裹等待老外来签收。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_765_0.png)\n\
    \n而这个包裹，正是来自必要商城的。\n\n一个由原百度创始人李彦宏的助理毕胜创办，获得了中金、招商局等国家队基金的投资，“直连用户和大牌工厂”的商城。\n\
    \n与此同时，众多商业大佬、经济学家、企业高管、名人明星等也相对理性地选择只过“必要”生活，成为必要的忠粉儿。\n\n中国企业家俱乐部的一位企业家在装修房子的时候突然发现，这个商城里的产品极具性价比。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_765_1.png)\n\n> > 都是成森卫浴产的工厂在深圳\n\n\
    《凯叔讲故事》的凯叔每天早上10点，坐在马桶上的第一件事就是刷电商城的每日上新。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_766_0.png)\n\
    \n一位快递主管说，发往北京的该商城快递包裹里，地址显示最多的就是北京市朝阳区的众多明星居住的某高档小区。李晨，何炅也住在这里。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_766_1.png)\n\
    \n凭什么这些明星、名人，身价上千万上亿的人，竟然比我们会过日子？\n\n因为他们知道，光辉是给别人看的，舒适是给自己...\n"
