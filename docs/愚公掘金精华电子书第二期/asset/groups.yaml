    \ 8 折的安全垫心理上就感觉要好很多。封闭式基金的折价在这个过程中不断缩小的，到了 2013 年的时候就所剩不多了。因此这个机会就像结束了一样。\n\n\
    ## 蓝筹股\n\n蓝筹股简单来说就是那些大家都知道的大企业，因为赌场里面的筹码最大的一般是蓝色的，所以就这么命名，但是这个时候很多公司的股价已经是低到了白菜价了。可以说是过去\
    \ 10 年里面的最低的区域那一次的机会真的是现在看来不可多得，中国最优质的企业在那个时候的价格都是白菜价。这个熊市的最后阶段，当时是不知道是最后阶段的，但是却不那么艰难。因为你有方向了。银行，保险，券商，还有我自己买的，家电，都是白菜价，你真的无法想象还能跌到哪里去。\n\
    \n那是最黑暗的时候，那个时候我爸一次性把我大学要用的所有钱的一半给我 4 万元，当时我从来没一次性拿过这么多钱，分两笔买入了招商银行和美的集团，这个操作是完全由我自行负责作出的，如果钱没了，我就只能拿自己的积蓄上大学了，这个行为是冒了很大的险的，因为买入就意味着要马上亏损，买入后的一个月账户一直是绿的。我没那么绝望，但内心是崩溃的，到手的钱就看着它贬值。\n\
    \n后来的故事大家都知道了，2014 年 8 月，解放了。一路上涨\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_101_0.png)\n\
    \n就是这个，但是这个之前跌了 7 年啊，兄弟姐妹们！\n\n我父亲和我的当时的操作也是差不多的，从封闭式基金换到蓝筹股，只是他买的是平安和一些券商的组合。\n\
    \n后来，离我们最近的熊市是 2015 年的踩踏开始的，之后基本可以看作是那一次的余波。\n\n## 在这个暴跌的过程中有一个机会【股指期货】\n\n作为读者，我觉得说到这里，你也许有点摸不着头脑，因为这些机会似乎对你的意义不大，我最后会说，这里面的共性，听不懂的术语没关系，关键是思路。\n\
    \n股指期货有个术语叫做升水和贴水，大概意思和封闭式基金的折价溢价是差不多的。当时的股指期货由于悲观情绪蔓延，贴水 200-300 点，这个就相当于你如果做多股指期货的话，现货要多跌\
    \ 200-300 点才会让你到交割日那天实际产生亏损。\n\n这也意味着如果你在当时 2015 年的 8 月做多股指期货的话你的成本就比大多数人要少 200-300\
    \ 点。但是在最极端的几天，我已经忘记是具体几号了，几乎所有没有停牌的公司全部跌停。而停牌的公司也基本上是为了停牌而故意制造一个什么消息而申请停牌的。\n\n\
    我当时是根本不敢打开我的账户去看的，因为我知道我和所有人一样沦陷整个账户跌停，那个时候我在读大学，其实我也是和大部分人一样的，逃避去看自己的账户，但是周末回到家的时候，我的父亲就和我说，他准备做多股指期货。当然期货是有杠杆的，他可以不用杠杆做股指期货，就是在银行里放入等量的现金不存在爆仓的风险。\n\
    \n杠杆，就相当于你借钱去买股票。\n\n曾今我在书里看到衡量一个投资者是否够格去主动管理一个基金的特质就是，他能不能在市场最恐慌的时候加仓，甚至是在这个时候下重注。所谓主动管理就是说没有预先设定的配置限制，完全通过这个人或者团队的研究结论来配置调整各个资产的比例，这个就算是主动管理基金。按照这种标准大部分人都是不够格的，包括在那个时候的我。\n\
    \n大家都好像看到海啸来了，但是不知所措，都希望灾难快点过去，哪有时间想这个灾难会不会是机会，能做些什么？那个时候的我也是属于不够格的这类的。大部分的所谓炒股其实都是属于主动管理的，因为都是根据自己的判断作出买入卖出的决定的，事先都没有计划。也真因为如此，大多数人都亏钱。\n\
    \n结果第二天就是全线涨停。\n\n说到这里停一下，这个和今年年后第一天的暴跌，和后来的迅速反弹非常像非常像，人真的很奇怪，这一个涨停你昨天的恐惧立马就没有了。\n\
    \n我父亲经常和我开玩笑说，期货公司的经理一定吓傻了，曾经哪个经理告诉他大部分他手下的客户账户都是亏损的，就他的账户一枝独秀。更令人难以相信的是这个期货赚了几千万的客户居然还清仓跑了。一般人玩期货就像赌博一样，赚了钱哪可能收手。其实那个客户经理不知道我父亲是放了好多现金在银行里准备着把期货当现货在做的，同时也是看中期货贴水严重这次机会才会大举参与。现在他的账户因为长时间没有钱早已经冻结了。\n\
    \n暴跌后来我们经历了 15 年的融资融券，场外配资爆仓，P2P 暴雷，股权质押爆仓，商誉减值，退市，贸易战，猪肉，这些。然后，在最近 4 年的也算是大熊市吧，这个过程当中活下来，基本依靠着中国最具代表性的一些商业（蓝筹股），比如中国的保险业，家电业，还有贵州茅台。\n\
    \n先说保险业，在 2016 年 17 年的时候基本上已经跌破了保单价值。保单价值是保险业的估值方法。即把所有现在未兑付的保单去掉赔付去掉每年的贴现算到今天的价值，这个价值也是衡量保险公司手上实际能够动用的投资款的一种方式。跌破很厉害意味着保险公司严重低估。就单单凭着个就足矣是个很好的配置理由。再加上保险受市场影响比较厉害，保险公司的主要盈利方式是靠受伤的保费收入去投资，现代保险公司，投资是主要利润来源，而不是卖保险的赔付差，因此市场不好的时候会被过度低估。结果果然\
    \ 2017 年的时候中国平安以大家无法想象的速度一下子翻倍。其他保险股也有类似的涨幅。\n\n家电：如果我问你中国在全球最大的竞争力是什么？其实你很容易就会发现，是制造业，即使是今天仍然是如此。那些说制造业不行的文章和观点，只是说中国的制造业不如以前好了，并不是说中国制造业死了。这完全是两回事。\n\
    \n另一个理解：就投资这件事，谁说只有风头上的热点才能赚钱的？恰恰相反，哪个技术越是热，作为普通人你越不可能赚到钱。甚至你越容易输钱。上周回国了几天，发现上海中心地段有不少电动车品牌在投放广告和直营店。打个车也有各种品牌的插电式电动车。可以说这种事情你很难赚到钱。就好比曾经美国有上百家飞机制造公司，现在呢？好像我们最熟的只有一家波音公司。可以说不用多久大部分品牌和公司都会死掉。\n\
    \n说回家电，其实这级别的制造才是中国规模能力最强，技术上最成熟，并且事实上头部企业每年增长率远远超过 10% 的行业。格力、美的这两个加起来万亿市值的公司每年能够以\
    \ 20% 的净利润增长，你想想这是多么厉害的事情。但是很少有人把它放在眼里。同样思路的还有去年的三一重工。工程机械严重低估。插一句，上面的故事，贾跃亭的乐视是最好的例子。\n\
    \n## 最后，茅台\n\n这个是被动配置的。原因只是无为当时茅台有坏消息价格偏低，那个时候正好需要买入 A 股，茅台价格出现明显下跌。\n\n所以分析是马后炮的：茅台是中国内需的代表。\n\
    \n用制造业快速积累的财富在社会顶端的人当中积聚。这些财富让大部分人从面都吃不饱什么都买不起，到今天突然有一份饿不死的自由，哪怕工资并不高。这时候是个人都想要挥霍一下这种自由。一切曾经觉得不是自己的世界的东西突然一个分期就近在咫尺。西方的奢侈品是神秘的，一个个家族企业的故事。中国没有真正意义的家族企业，但中国的故事更有意思，因为茅台曾经是现在也依然中国官方的酒。突然一个分期就能买到，因此茅台就成了这种剁手的对象。\n\
    \n总结一下：\n\n- 中国的股票市场非常的难做，因为长时间都在熊市，而且你肉搏必被割韭菜。\n- 但是仍然要参与的原因：\n  - 1、应对通胀国际上看比房产更好；\n\
    \  - 2、中国股市有一定的诱饵\n- 是怎么成功的：\n  - 1、对付漫长的熊市采取低风险策略；\n  - 2、寻找打折的资产；\n  - 3、寻找长期存在的诱饵，不管诱饵多少抓住再说；\n\
    \  - 4、长期保持关注且持有一定的资产量，无论你觉得之后是怎么样的都用持有的方式保持关注，因为不持有很难有真正的关注；\n\n好了复制粘贴的内容前 3/4\
    \ 说完了，我补一句，如果要我用一句话来概括这个方面成功的秘诀的话应该是这样的。三个字，确定性，大多数人的成功概率是 50%，甚至还没有 50%，因为人都\
    \ 有情绪，你稍稍捕捉一下，只有在你能够 80% 把握的时候下注，那么最终你的结果可能是 10 次里 面 6 次成功，这就够了。\n\n这也是为什么这个很难把别人教会，因为听到\
    \ 60% 大家就走了。正常人只信 100% 的事情，但是你仔细想想，世界上哪件事情是 100% 的。任何东西都会波动，说说这几天的额外收益，因为我平时是持有很多股票资产的，因此发生突发事件，我的资产是跟随波动的，所以那部分收益亏损不算的情况下，我增加的操作就是额外的损益了。今天就说说我这几天都做了什么。（上面这句话的意思是，我写这个东西的时候是亏的，因为那时候暴跌下来，现在已经超过去年年底的市值）\n\
    \n年前，我开了两张认沽期权做空，简单的可以认为是一种跌了能够赚钱的东西。结果效果出奇的好，年后开盘第一天盈利 4000。然后倒过来买进改成做多（就是涨了会赚钱），神一般的节奏踏的非常的准，居然就快速反弹了，总共能到手\
    \ 10000 元，细节我就不多说了，这种神操作这么神大多也是运气好，但是我们可以用一次非常成功的经历看看背后的成功要素，以前我也抄底但是从来没有这次这么成功过。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_113_0.png)\n\n（这个图片不是很配合文字哈，但是大家能够懂意思）\n\
    \n打开股票你看到的价格波动，人们在屏幕前看到的红红绿绿的狂欢是情绪，一切的一切都是情绪。过节在家大家守着屏幕，然后看到一点关于疫情的恐惧，无助，失望，绝望，希望。这一切就全部反映在了价格上。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_114_0.png)\n\n这个图片一样，我去，这么恐怖的吗，赶紧卖了，不知道后面还会跌多少。（恐惧）咦？怎么涨了？要不要追涨？啊呀，疫情已经好转了，赶紧买入吧，再不买还会继续涨？（后悔）\n\
    \n但是你思考过这件事情影响真的有这么大吗？一家公司会因为疫情真的损失 10% 以上的生意吗？中国会损失这么多吗？\n\n等等，中断一下，我想补一刀，首先，这个抄底的机会至少过去一半了，那种绝对的赚钱的事情已经没有了，大家看看思路要紧。重点不是学着这样去做哈，然后，更重要的是这个过程，我认为不叫抄底，TMD\
    \ 应该叫救市，我就问问你敢在这次开盘第一天买进去？而且还有，我自己是比较讲道德的哈，也许商人不应该这样，但我认为，国难财是不应该发的。所以跟踪哪些东西会因为疫情受益这种事情，我自认为是不道德的，不过只是我的看法。\n\
    \n一个常识：股市理论上是应该跟着 GDP 走的。因为所有公司的利润增长应该接近于国民生产总值的增长，GDP 是股市赚钱的根基，虽然说中国股市一直没有跟上，那这个恰反而说明股市上的机会更多。今天看报道有人假设停止半个月，那么损失\
    \ 4 万亿的 GDP，这个就相当于 GDP 减少 4%，因为 2019 年接近 100 万亿，那么按照本来能够增加 5.5% 来计算，那么现在的差距相当于\
    \ 5.5+4=9.5%，但是这个是非常，非常悲观的估计。实际没有这么久，另一方面官方还会印钱，印出来的钱很容易会直接增加在股票市值上。\n\n数万个中国公司和部门组成中国的\
    \ GDP，上市公司更是他们的代表，那么理论上来说所有的上市公司平均下来应该损失和 GDP 相当，那么也就是少赚 9.5% 的增长。股票的价格长期就是反应公司的业绩的，那么这个事件，最夸张的统计无非是下跌\
    \ 9.5%。你仔细看一下的话，从过年前，到今年最低点的时候远超过了这个跌幅。\n\n这个超过的部分，就是大家的恐惧在作祟，灾难性的事情，往往是人们在过分反应，其实不光是股票市场在过分反应，很多政府也在过分反应，让本来很简单的事情变得更困难，至少目前按照官方的数字，直接或间接因为防止病毒死亡的人数，注意不是因为病毒，是因为防止病毒死亡的人数可能超过了病毒的死亡人数。这是我的观点，大家可以求证一下。\n\
    \n由于我在海外，所以除夕休市前，我是还在上班的，我看到海外的消息（往往很负面）那时候我就发现事情有点不对了，好像这个病毒的恐怖程度被远远低估了，可能不是影响\
    \ 2.75% 这么简单。（上证指数除夕下跌 2.75%），另外一般市场上有一个共识，就是年过完一般会有一波涨幅，因为该要从市场取的人都已经在年前取了，年后亲朋好友一聚餐就会讨论股票，大家就会在年后蜂拥买入，所以我觉得这种观点导致市场反应太过于乐观。于是我这才出手做空，其目的是保护我几乎\
    \ 90% 的股票资产。结果这次做对了。一下子跌了 7%，当天我就把空单平了，换成买入入抄底。\n\n听了上面的这个神操作我想大概大家心里有数，就是，市场疯狂过度反应，你把握它的情绪，然后走在前面。大家都想自己放手一试了？且慢，你必须了解一下投资的本质，才能知道为什么极端情况下我们要做这些动作，还有更重要的，风险有多大。\n\
    \n## 投资真正赚两种钱\n\n一种是市场情绪波动的钱，一种是企业增长（社会发展）的钱。\n\n前者是快钱，其实我们所谓的“炒股票”讲的就是赚这第一种钱，因为你打开交易软件，或者是看盘软件，这些东西都是为了这个而设计的，没有哪个看股票的软件一打开就是年报的吧？你打开看到的都是价格吧。你说一家公司每天涨跌幅都在\
    \ 0.5%-2% 这个范围，三个月的涨跌幅大概在 10%-100% 这个范围，你说这家公司真的在 3 个月内发生了 10%-100% 的变化了吗？这显然是不可能的。\n\
    \n那是什么在天天变？价格。其实就是心情。看心情。\n\n所以心情是相对的有好就有坏，造成的结果就是同样做一只股票，有的人倾家荡产，有的人一夜暴富。这个看心情的游戏就是这样，是零和游戏。有个人赚了，必定有个人亏了，所以我们能不能赚钱，答案也是：看心情。理论上说你的成功概率是\
    \ 50%，甚至更低，因为你还要交手续费。\n\n后者是根基，如果你持有一股票超过 1 年，你就会发现，这是个正和游戏，因为企业不断的产生利润，理论上可以出现所有股东都赚钱的情况，因为企业把赚的钱分给股东们，而且随着分红的增加，会有更多人认可这家公司，于是股价也越来越高。所以这个才是主菜。\n\
    \n## 投资讲的是确定性\n\n较量的很多时候不是谁赚的多，而是谁活的长，因为如果你借钱瞬间赚了几个亿，没用，马上你就会还回去的。死的也更快。所以谁能够用最低的风险赚到适当的可观的利润才是终极目标。即比谁赚钱更傻更轻松。\n\
    \n因此以上两种赚钱方式后者是根基。因为中国放眼全世界还是高速增长长的，在中国的众多公司中，优质的公司也是超过两个手掌的。这个的确定性要远比市场的情绪波动来的高，而且省心。其实你不应该花很多时间来研究如何抄底，因为这赚到的只是一种心情好。了解这是个前提，我们再来讨论如何抄底。\n\
    \n极端时刻的情绪往往很有确定性。\n"
