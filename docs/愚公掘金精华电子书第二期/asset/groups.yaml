    \n**3、请问给小朋友配的话，什么险种应该优先考虑？**\nKK：优先意外，重疾。\n\n**4、请问嘉宾，你在购买消费型重疾险时会考虑现金价值吗？**\n\
    KK：我个人不太考虑，当做是一个纯消费品看待，注重杠杆。\n\n**5、像重疾险这种，出问题了理赔流程是啥呀？审核和出赔付快吗？一般要准备哪些资料？**\n\
    KK：主要是按要求准备理赔资料，邮寄，快不快主要看资料准备齐不齐全。材料为病历，证明，单据等。\n\n**6、刚出来工作的建议配备什么保险呢？如果公司已经帮忙配了商保（含意外和重疾）是否还需要自己配一个？**\n\
    KK：看额度是否足够，意外和重疾确实是最基本的。\n\n**7、看到很多公号推腾讯微保，可信吗？和一般线下通过代理人办理的有什么区别吗？赔付上会不会很麻烦？**\n\
    KK：可信。区别就像淘宝和线下买东西。赔付只要资料齐全，也不会太慢。\n\n**8、像水滴筹这些平台每个月交几块钱的有必要买吗？**\nKK：没必要。水滴筹就是保险的雏形而已。\n\
