    # 十几秒的广告设置成五秒后可以关闭，这后面是什么原因？


    # 提问：


    花爷，广告一般是10几秒的都会在5秒以后可以关闭跳过，其实这样对于想要跳过广告的人来说算不算一个小心理测验，越焦急反而越专注，就越会记住广告的内容，加深广告的作用，我这只
    是个人看到了以后猜想一下。个人看这个5秒以后关闭肯定有猫腻，否则为什么设置这么个功能。'
  - '[PAGE 272]


    # 回答：


    广告设置成5秒以后可跳过，背后确实有深层次的用户心理考量：


    +   1.如你所说，当广告改成5秒可跳过时，这5秒钟之内的广告到达率极高，吸引了用户的注意力。以前120秒广告的时候，一般都是开始和结尾的广告价格最贵，中间的广告价格便宜，也是一样的道理。


    +   2.你在第几秒选择跳过广告，是一个非常重要的指标，可以以此判断你可能对什么类型的广告感兴趣，以后给你推更合适的广告。随着计算能力的提升，这点在广告系统里非常重要，如今大部分的广告系统都支持根据用户画像定向投放广告，也只有这样的广告系统才更吃香。


