    ## 期待自己可以独当一面，但一直觉得没什么技能和成就导致很消极怎么办？


    **提问：**


    花爷，我今天说的话可能非常消极，我从在学校期待走出来独当一面，到现在看清了社会，社会才是大学，而我是失败者，暴富不可能，没有一技之长，没后台的、什么大奖没抽中过也不相信自己靠运气能赢，也不相信自己有什么成就，而有人生在了终点线上，我每天干着一眼望到头的生活，觉得没意思，甚至开始怀疑活着为了什么，人为什么活着，最近一直很消极不知咋办，负能量爆棚。


    **回答：**


    我有个姑爷，是真正的文盲，不识字，老婆（也就是我姑姑）也只读了小学三年级，一对夫妻都没什么文化。


    夫妻俩生了个女儿，不甘心，冒着超生的风险，又生了一个，还是女儿。在那个年代，这个家庭背景在村里也算比较差的了。


    在我印象里，姑爷夫妻俩早上起来就去耕菜地，然后喂猪、喂鸡、做早饭，送完俩女儿上学，自己去上班。姑父在汽修厂当维修工人，姑姑则是医院护工、保姆、服务员都干过。


    下班回家，俩人又开始遛猪、去各家收免费的泔水，然后做晚饭。女儿的功课，他俩完全辅导不了，只能靠这种方式拼命赚钱（其实也赚不了多少），送女儿去辅导班补习。


    就这么十几年如一日，姑爷这个文盲竟然已经是汽修厂顶梁柱，大女儿读完研在上海定居买了房，小女儿在老家留守生了二胎、买了学区房。


    你说他们一家，算是阶级跨越吗？好像没这么夸张了，但确确实实有非常多的老一辈人，他们赚得不多，文化也不高，但他们愿意用双手、用一辈子，让家庭在富足的生活上迈出第一步。


    想来无非六个字：期望低、踏实干。


    像你一样的焦虑、痛苦，大多来源于期望与自身能力的落差。真正的、也是唯一的解法，就是定一个切实可行的小目标，然后去执行。


    现在这个时代的宣传环境，好像三十岁不走上人生巅峰就晚了。其实真的不用急，或者说，急也没用。顺应自然规律，一步一个脚印。


