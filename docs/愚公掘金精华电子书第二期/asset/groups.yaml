    # 回答：


    你简历的最大问题：没有核心技能。


    我帮身边至少20位朋友优化过简历，每个人都有这个问题。


    普通人写简历的思路：我得过这个奖，我做的这个项目成绩不错，ok，我全给你写上去，这样可以表明我是个优秀的人了吧？


    错，错的离谱。


    你得知道，公司的管理层和HR在招人的时候，和你根本不是一个思路，屁股不在一个位置上，脑子就很难想到一块去。'
  - '[PAGE 310]


    公司招人的时候，想的是我有一个业务缺人，这个人必须要会技能A，这样他一来就能把项目的空给补上。


    带着这个想法，管理层和HR在看简历（特别是3年以上工作经验的简历）的时候，脑子的想法只有一个：


    这个人会不会技能A？他怎么证明他的技能A很厉害？


    其他内容，都是一眼带过的，一份简历，初筛不会超过30秒，二轮候审不会超过5分钟。


    再看你的履历，做过3个项目，每个项目都在不同的领域，做过研发、运营管理和产品，相当于转职三次。这样的履历，如果简历写不好，那就是做事没有耐心、啥都会点但没有一个精通的形象。很难过中大型公司的简历筛选。'
