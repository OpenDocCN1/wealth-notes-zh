    刚才说情绪的钱都是零和游戏，成功概率基本小于50%。但是有一个例外！那就是发生极端事件的时候。发生极端事件的时候，你可以很清楚的看到这种情绪的前因后果，以及哪些股票是被错杀的，这个主要事件的影响在哪些方面是过度反应的。比如说你会很清楚三聚氰胺奶粉绝对不会影响中国石油，比如地震了，绝对不会影响牛奶公司，包括这次疫情，也不会影响一个卖家电的？这些最基本的常识很容易被市场遗忘，但是我们只要记得“常识”，轻而易举的就能发现这中间的确定性。


    ## 【抄底抄的就是常识和情绪的偏差】


    怎么判断什么是真恐慌呢？下面这几个例子也是暴跌，我能不能抄底？


    之前的财务造假叫什么电力的，后来退市了，突然想起来了欣泰电气对吧，那个退市最后一天还有人抄底。乐视网，倒闭破产，贾跃亭逃到国外，300块跌到3块。我买到过一个信托，现在是在归零方向走原因是去年严查P2P。


    以上的例子，你会发现市场的恐慌是正确的，如果抄了这种底，基本你就是血本无归，本金都没了。


    那么怎么识别什么时候可以抄底呢？“常识”


    很简单：记得不是每个大跌你都可以抄底的，而是你看你的常识够不够用，如果你的常识不足以判断那么不要行动！


    巴菲特好像说过一句话，好像是说我不跳10inch的栏，我跳5inch的栏，具体那句话我忘记了。


    市场下跌2.7%，这里的常识是大多数人以为年后会涨，因此不买，同时最后一天如果卖出钱是出不来的，这几个常识告诉我们，很可能被低估，市场下跌7%，这里的常识是GDP不可能再有超过这么大的变化。


