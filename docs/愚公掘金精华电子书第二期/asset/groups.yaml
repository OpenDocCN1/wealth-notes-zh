    # “金花奖”挑战：家用按摩椅的市场如何？投资是否可行？


    挑战提问：


    花爷你好！最近公司办公室门口多了两台按摩椅，微信扫码支付按摩的，但是都没什么人用。我觉得可能在办公空间的按摩椅这个场景是有问题的，因为你上班时间按摩，怕被老板说上班时间去按摩，不好好工作。下班的时候人都想早点回家了，也没人还要先按摩再回家。'
  - '[PAGE 752]


    上周去看电影，发现电影院门口有两排按摩椅，用的人还挺多的，这种娱乐场所又需要等待的场景才适合按摩椅吧。


    最近我妈说她腰疼，去做了半个月理疗，我在想给家里买一个按摩椅。


    想问下花爷，家用按摩椅的市场有多大，市场教育需要多长的时间，现在投资家用按摩椅是否可行？


    # 花爷回答：


    按摩椅之前有两个明显的上升趋势。


    第一个就是你说的，商场里共享按摩椅的加盟。


    这个故事确实讲的很好听，买一台按摩椅加盟，放在商场、电影院里，用户有一定的使用需求，你不用管它，每天都能有收入入账。'
  - '[PAGE 753]


    当时按摩椅的品牌方宣传时算了一笔账，说一台按摩椅代理加盟费几千元，放在商场两个月你就能回本，后面都是躺赚。


    很多人确实吃这套，掏钱代理加盟的不少。


    实际情况肯定没有品牌方说的那么好，因为具体运营时，还涉及到场地费用、耗损、维修等等。


    据我的了解，大多数代理商的运营情况也就是刚刚持平，小部分人有盈利。不管怎么样，品牌方肯定赚了，生产按摩椅的厂家肯定也赚了。


    第二个就是你说的家用按摩椅。


    这种其实不是普遍需求，首先按摩椅不便宜，其次占地方，不在大多数家庭的采购范围之内。'
  - '[PAGE 754]


