    ## 那华为有没有错？


    大家要注意一个细节，小李最后拿到的赔偿，是国家赔偿。而对于华为，检察院只是要求华为恢复小李的名誉。


    从法律层面来看，华为作为一家公司，认为公司内部员工有敲诈嫌疑，报警处理，这没有任何问题。


    有人说了，华为就是诚心利用企业优势欺负人，但这纯粹属于猜测，也没有证据支撑，咱们都是聪明人，不玩诛心论那一套。


    那么问题来了，小李也没错，华为报警也没错，为什么小李还会被羁押251天？


    这就是涉及到我们的一项法律制度：取保候审。


    想象下，现在有个犯罪嫌疑人，被警方拘捕，但是调查后发现，没有直接证据可以定嫌疑人的罪，怎么办？


    把嫌疑人放了吧，不好，你要真的是罪犯，出去跟人串个口供、消灭证据，不是放虎归山？


    把嫌疑人一直关着吧，也不好，关到哪天是个头啊，总不能关一辈子吧，那跟坐牢有什么区别？


    所以在法律上，我们规定了一个羁押的期限。但这个羁押期限的时长，仍然很长，于是又有了取保候审的制度。


    简单说，就是有一个保证人或者交纳一笔保证金，嫌疑人就可以被释放，等候传讯。


    又有人说了，这个我在电视剧里看过啊，有钱人交笔钱就被释放了，这不是欺负人吗。


    其实啊，取保候审的保证金并不高，最大的问题是，不是你申请了取保候审就能成功的，在我国，取保候审的申请成功率非常低。


    而这一点，恰恰成了华为事件中，小李被羁押251天的关键。


    4.


    虽然我国有取保候审制度，但在具体执行层面，并没有非常详细的法规。


    是否批捕，决定权仍然掌握在法院和公安局手中。


    想象一下，如果你是警察，现在当地最大的纳税企业起诉了一名员工，虽然调查后没发现证据，但如果这人真的有罪怎么办？


    毕竟，一直关押他并不违反任何规定，为什么要冒风险释放他呢？不如把他控制在可控范围内慢慢调查……


    这正是华为事件中被很多人忽视的核心问题。


    如果小李是杀人放火的犯罪嫌疑人，有非常重大的嫌疑，但一直找不到证据定罪，那他被关了251天后释放，大家不会同情他，反而会认为让罪犯逃脱了法网。


    但问题是，小李没有杀人放火，他只是被起诉敲诈勒索，刚被抓时上交了自己的录音笔，从头到尾都没有任何证据，为什么还要被羁押251天？


    更可怕的是，小李在这样的情况下被羁押251天，还是合法的。


    在这个过程中，华为有没有利用规则对警方施加压力？我不知道，但我知道，这项规则本身对小李就是不公平的。


    如果你感兴趣，不妨搜索下新闻，你能查到不少取保候审不成功，被羁押几百天后释放的案例。


    5.


    写到这里，花爷还真有点心慌。


    写这种文章真的吃力不讨好，又不涨粉，说不到审查一严，还把号给炸了。


    但这些话，等风声过了，还是想跟花友们说说。


    我国的法律一直在完善，但无论在世界的任何一个角落，法律的升级都需要时间，这就造成法律具有滞后性。


    有一些规则不合理的地方，如果被普通人踩中，很可能成了一辈子的坑。


    而普通人的认知局限，是多层次的。比如法律层面，很多花友都觉得学习法律是律师的事，我一个普通人要懂法律干嘛？


    其实，懂法就是保护自己。


    有人说，小李和华为的斗争，就像是蚂蚁和大象互扇耳光，蚂蚁才显得特别悲壮。


