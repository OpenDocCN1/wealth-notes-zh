    # 花爷讲讲对“口罩资金盘”这件事情的看法


    群里这几天有不少花友，都发了这张图，讲了一个口罩资金盘的故事。（大家先划到最下面去看图，不然这条帖子看不懂）


    花爷怎么看？我想说：觉得这200万好赚的人，100%都赚不到这200万。


    给你们解释下为什么。


    1. 首先，他能拿到2块钱的货源，而且是100w只，而且是现货（一星期后到货，相当于3天内就能发货）。这种货源，要拿到只有两种可能，要么，他有特别牛逼的上游渠道，要么，他在疫情的早期就开始进货，但你想想，疫情早期官方数据确诊只有几十人，这时候是很难众筹卖掉100w只的，大概率要自己垫资压货，你有这个魄力吗？


    2. 最重要的一点，你有这个渠道和能力卖掉200w只口罩吗？注意，按图里说的，先按2.5元的价格卖了100w只，然后按4元的价格又卖了100w只，一来一去相当于卖了200w只，你真的有能力卖掉这么多吗？


    其实你仔细观察这次疫情，你会发现，真正的大平台、硬渠道，都是靠低价口罩来引流，并不指望口罩赚钱，为什么？因为真正厉害的渠道，想的是流量、获客，而不是当下赚个百来万。


    3. 即使收到厂家的货了，你给用户发货的过程，也是风险。假设是5000人买了100w只，那就是5000个包裹。这么大的数目，发快递的过程中非常容易被查，一旦货被扣，肯定是进局子，而且你必须要把货款退回去，不然被大量投诉诈骗，进局子之后更严重。这个风险，你考虑过吗？


    4. 最后，哪怕一切顺利，你仍然可能会被收到货的用户投诉倒卖、投诉产品质量，一旦被查，又是收缴货款。你要知道，在非常时期，国*是要抓典型的。我在帮大家找口罩团购货源的过程中，听过的进局子的人至少有五六个，最严重的一个到现在还在局子里蹲着呢……


    有人要说了，我靠，花爷你这是在给倒卖分子洗白啊！


    不是的，我的立场一直很鲜明，我非常反对三无产品、非常反对出尔反尔的倒卖分子、非常反对销售时连蒙带骗假装自己是一手货源的人。


    今天写这么多，主要是想告诉大家，如果你觉得一件事情非常简单，非常理所当然，那有可能是你没有看透它。


    就像这张图，如果你觉得这钱赚得太容易了，那不过是茶余饭后的玩笑而已。但如果你静下心来，仔细推敲模拟一下整个流程，发现其中的诸多风险和问题，那你相当于做了一次微型的商业模拟操练。


    前者和后者的思考方式，完全不同，这就是明明外在条件、经历都相近的两个人，未来的发展却大不相同的根本原因。


    套路:


    给大家科普一下额温枪跟口罩资金盘的大坑。各位老司机新司机, 首先, 有一个人, 想要从国外或者某厂预定100w个口罩。这个口罩成本价可能是2元。这个时候他以2.5元的价格放出去。然后大家纷纷打钱。这时候他成功融资250w。打200w出去订货。等一星期后,
    100w个到货了。这个时候就是现货了。


    那现货可不想这个价格卖了。于是乎, 他就再以4块的价格卖一次。大家纷纷打钱。400w到手。然后他告诉前面2.5买的人, 没货了。退钱吧。于是把250w退掉。净赚200w。他的成本是多少呢?
    0元👛。这就是为什么你们订了半个月的货, 一直没有到, 最后退了你钱。看似商家没有得利。其实你就是借了钱给他投资拿货。


