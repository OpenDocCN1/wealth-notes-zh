    # 花爷有时间可以扒下保险销售的一些技巧吗？


    # 提问：


    花爷，我现在在做保险行业的Toc app，需要背保险销售转化指标，花爷有时间可以扒下保险销售的一些技巧吗？万分谢谢


    # 回答：'
  - '[PAGE 467]


    推荐李叫兽的一篇文章，《改变消费者的说服文案，有且只有以下4种》李叫兽:改变消费者的说服文案 有且只有以下4种_大咖_前瞻经济学人


    李叫兽虽然实战成绩比较差，是典型的理论派，但这篇文章的理论确实很棒，我还是新手的时候，卖货会参考这四个纬度来做包装。


    这里简单摘录一段案例：


    李叫兽之前遇到一个做个人定制旅游的“榴莲旅游”，在一次营销活动中，想要说服大学生毕业游，不要自由行，而选择更加省心的定制游。


    首先，你想改变什么人在什么情境下的哪种行为概率？


    比如：提高大学毕业生，在选择毕业游的方式时，选个人定制游，而不是自由行的概率。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_467_0.png)'
  - '[PAGE 468]


    然后，寻找他们在这个情境中的“喜爱刺激”和“厌恶刺激”。


    “喜爱刺激”是消费者在这个情境中渴望的行为，就像喝红牛的时候“喜爱刺激”是“精神”，在毕业游，喜爱刺激可能有：低价享受土豪的生活、无忧无虑而不是烦心等。


    “厌恶刺激”是消费者在这个情境中厌恶的行为，就像喝红牛时“厌恶刺激”是“困了累了”，在毕业游，厌恶刺激可能有：花了很多冤枉钱结果没有享受、被一些黑店坑等。


    接着，利用两种刺激，去强化或者惩罚某种行为，以改变行为概率。


    +   (1) 利用“喜爱刺激”强化购买行为，让消费者觉得用了你的产品，就会获得这种刺激。'
  - '[PAGE 469]


    “预算有限的毕业旅行，一样可以享受土豪的生活——Day2，敞篷跑车带你环游海岛”


    (激活消费者的“追求心理”。)


    (2)利用某种“厌恶刺激”强化购买行为，让消费者觉得用了你的产品，这种厌恶刺激会减少。


    “青春和心情都是有限的，不在不好玩的景点上浪费时间。——最优行程计算，删除不值得去的景点。”


    (激活消费者的“规避心理”。)


    (3)利用某种“喜爱刺激”来惩罚不购买的行为，让消费者觉得如果不用你的产品，某种喜爱的东西会丢失。


    “旅行最爱无忧无虑，但自由行并不能帮你这一点。”'
  - '[PAGE 470]


    (激活消费者的“失去心理”。)


    (4)利用某种“厌恶刺激”来惩罚不购买的行为，让消费者觉得如果不用你的产品，就会面临某种厌恶刺激。


    “期待4年的旅行，怎能一脚踏入黑店?”


    (激活消费者的“恐惧心理”)


    总之，如果你想要改变用户在某个特定情境下的行为概率，能够被文案利用的心理有且只有四种：追求心理、规避心理、失去心理、恐惧心理。


    卖保险产品也是一样，保险行业最常用的就是恐惧心理和失去心理。


    比如肺癌险吧，目标人群显然是吸烟人群。最常用的宣传就是：'
  - '[PAGE 471]


    吸烟有xx%的大概率得肺癌、肺癌一旦诊断就是中晚期治愈可能性极低、吸烟的肺和正常的肺对比、肺癌高发人群的五大症状———利用恐惧心理。


    吸烟得肺癌，肺癌治疗费用高达xx万元，治疗过程极其痛苦、成为家庭的巨大负担、几十年省吃俭用转眼就被掏空，人、财、家人生活质量全部落空——利用失去心理。


    有了这些方向，剩下的就是寻找各种论据，多方面支撑观点了。


    现在保险的软文广告很多，保险是最近两年利润增长最快的行业，没有之一。带着上面的理论多看别人的宣传，能看出不少小窍门。'
  - '[PAGE 472]


