    ## 四、组合策略


    ### 1、股购结合


    我们在定投红利ETF中，会用到一些定期不定额的策略，比如，当PB达到一定的高估时，每个月照常把定投的钱存进投资账户里。


    但是，在高估时不进行定投，然后把剩下的闲钱放进28天的国债逆回购里，一个月之后根据定投情况再做重新计划。


    当红利指数在极度低估时，我们不仅按正常的定投金额进行定投，还把之前未定投完的金额也进行补仓的行为。


    也就是，不仅定投红利ETF可以达到高位少投，低位多投，还能把闲钱充分搞点利息，这样就可以达到红利ETF的定期不定额+闲钱薅羊毛的完美结合。


    ### 2、股债平衡


    我先说下股债平衡的原理，比如把可投资金额固定分成一半，一半投资于股权类资产，一半投资于债权类资产。


    解释：


    - 股权类资产：股票、指数基金、股票基金等

    - 债权类资产：债券、债券基金、可转债等各种债，包含逆回购和现金


    当熊市往牛市发展时，股权资产会因上涨而占比慢慢变大，这时候按策略来就是卖掉部分股权资产换为债券资产，以重新达到一半一半。


    当牛市往熊市发展时，股权资产会因下跌而占比越来越小，这时候按策略来就是卖掉部分债权资产买入股权资产，以重新达到一半一半。


    这样做的目的，就是可以强制性做到低吸高抛，是小白们，克服人性的好帮手。


    50%：50%的策略是初级阶段，如果有深入的朋友还会有更进一步的优化策略，有机会再探讨。上面我们提到的红利ETF即为股权类资产，可转债和逆回购为债权类资产，最开心的是，这三样东西，都可以用同一个券商账户操作，很方便。这个股债平衡的策略，适合一次性投资的朋友，不适合定投。


