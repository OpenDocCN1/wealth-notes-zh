    # 【还是封闭式基金】'
  - '[PAGE 98]


    熬过这7年中的前三年的依然是封闭式基金。折价率从50%，降到了20%，但是20%依然意味着打8折。到了2012年开始创业板就开始牛市了，那个时候的创业板按照我和我父亲的逻辑是不会买的，价格太高，但是封闭式基金大多数都配置了这些股票，于是跟着赚钱，有了8折的安全垫心理上就感觉要好很多。封闭式基金的折价在这个过程中不断缩小的，到了2013年的时候就所剩不多了。因此这个机会就像结束了一样。


    # 【蓝筹股】'
  - '[PAGE 99]


    蓝筹股简单来说就是那些大家都知道的大企业，因为du厂里面的筹码最大的一般是蓝色的，所以就这么命名，但是这个时候很多公司的股价已经是低到了白菜价了。可以说是过去10年里面的最低的区域那一次的机会真的是现在看来不可多得，中国最优质的企业在那个时候的价格都是白菜价。这个熊市的最后阶段，当时是不知道是最后阶段的，但是却不那么艰难。因为你有方向了。银行，保险，券商，还有我自己买的，家电，都是白菜价，你真的无法想象还能跌到哪里去。'
  - '[PAGE 100]


    那是最黑暗的时候，那个时候我爸一次性把我大学要用的所有钱的一半给我4万元，当时我从来没一次性拿过这么多钱，分两笔买入了招商银行和美的集团，这个操作是完全由我自行负责作出的，如果钱没了，我就只能拿自己的积蓄上大学了，这个行为是冒了很大的险的，因为买入就意味着要马上亏损，买入后的一个月账户一直是绿的。我没那么绝望，但内心是崩溃的，到手的钱就看着它贬值。


    后来的故事大家都知道了，2014年8月，解放了。一路上涨'
