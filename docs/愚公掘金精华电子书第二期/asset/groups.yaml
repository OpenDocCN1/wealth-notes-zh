    # 亲历者分享股市投资19年，积累了九位数资产的历程


    分享主题：九位数资产的投资积累


    分享嘉宾：Andrew，Andrew的父亲90年代初开始3w本金投入股市，到如今积累了九位数资产，Andrew在本次分享中将以亲历者的角度和大家讲讲，股市20年中他所见到的经历和他对股市的理解。


    （花爷友情提醒：投资有风险，入市需谨慎！分享内容仅代表嘉宾观点）


    # 分享：


    首先祝大家新年快乐！希望今年各位都身体健康！


    前几天忙着操作了几年一遇的机会，我其实有一个账户一直没有交易，一直在等这个机会等了快一年了。


    今晚的分享前 3/4 我会讲讲我看到我父亲的经历还有我在中间的长，和我们这个股市的本质。后 1/4 我会讲讲如何抄底。以及这次的成功经验。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_73_0.png)


    我的父亲在1991的时候从3w开始，到今天到9位数。在过去的20多年里，我陪他一起见证了让人又爱又恨中国股市，并且一直以一个韭菜(普通人)的身份和视角观察，只是从原来的小韭菜变成了大韭菜。


    首先，最最最最重要的出发点，或者说是原动力。


    股票的收益）房产）债券）银行利息。


    这一点是根基，也是要持续在市场里面持有股票资产的最重要的原因，因此无法忍受账上大规模的现金吃利息是最初级的原理，至于房产能用杠杆我们另当别论。以下所有的煎熬都是自找的，为的就是让手上的现金获得最大的效益，股票是实现这个的一种手段。


    机会不如活下来重要


    其实我父亲真正在其中抓住的机会就那么几个。和很多人的想法不一样。这个市场上有很多的机会，你每天都会听到有这个股票涨停那个翻了多少倍的，这里有个谁谁谁因为买了什么东西，往往是说成一夜暴富的样子。但是你完全不可能做到每个重大的机会都被你抓住，或者有能力抓住。更重要的是其中的不少机会实际本身就是一个诱饵，引诱韭菜成为韭菜。


    我父亲作为一个普通人，抓住了我认为普通人能够抓住的几个机会。但是比起抓住机会，和这个群以往讨论的最格格不入的是：“活下来，比什么都重要。”，这和创业就这点本金，有钱赚咱就上是完全不一样的思路。


    【这个市场本来就不是为了普通人赚钱存在的】


    一听到股票，所有人都害怕了，一听到股票，所有人都用鄙夷的眼光看着我，因为那是吃人不吐骨头的地方。因为上证指数这么多年就没有好好地涨过，10年前是多少，现在还是多少。


    那么为什么还要参与这个市场？为什么这个这么糟糕的市场还值得参与？


    这个要追溯到为什么要开这个市场开始。


    其实股票市场对于企业来说是一种融资的手段，融资就是，圈钱，什么叫圈钱？在股票市场的圈钱就是我开公司要钱，我把股份卖出去，你们参股给我钱的这个过程。


    1980年代那个时候大批国有企业倒闭，整个国家都陷入一片恐慌。那时候还有一个东西叫做4050工程。就是40/50岁的大妈大叔们全都下岗了，怎么办，我还记得5年前上海的老书报亭上面还会写40/50工程，安排那些下岗工人去开书报亭就是一种方式。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_77_0.png)


    员工可以安置，但是企业不能倒闭。因为企业借了太多太多的银行的债，一旦宣布破产，那么银行那里就是一笔坏账。坏账就是这钱要不回来。银行坏账到一定，这个国家的安定就有问题。


    那么怎么办？只要让公司不倒闭就可以了，不是吗？


    要不倒闭，就要钱，银行那里已经不能再借钱了因为这只能让这个洞越来越大。于是想到了——不良资产证券化。资产证券化是不是最近才火热的词？早在90年代就他们就是这样操作的，于是开启了证券市场。为的就是让普通百姓掏腰包解决中国这么多不良的国有企业的问题。


    这也就是开头所定义的，“韭菜”。


    请记住参与这个市场的我们，永远是韭菜的身份。因为这个市场最初的设定就不是给你赚钱的。邓小平当时说“不行，我们就关，摸着石头过河”。后来发现不错，这个市场也就延续到今天。所谓的不错，其实就在那个时候，证券市场真的解决了倒闭国企的不良资产问题。


    那么怎么让你乖乖的为国接盘呢？凭什么你就会真心诚意的去买那些现在看来是“不良资产”的东西呢？


    因为这个游戏真的看起来好像人人都能赚钱的样子，“屌丝都能逆袭”，“隔壁家老王发财买房了”。和世界上其他国家的股市不一样，我们的股市始终存在不少“诱饵”，引诱韭菜成为韭菜，而真正意义上这个市场实际你是永远处在非常弱势的地位。


    我们是黑客帝国里面的人类，一旦参与，Matrix的力量比你强大一万倍，如果你不小心赚钱了的话，多半也只是找到了大Matrix的某种漏洞。而回顾我父亲的成长之路的时候，发现多年来他已经能够分辨出Matrix中的诱饵，甚至通过这些诱饵了解到Matrix的意图。


    这里顺便对一种小白的理财方式提出一点质疑。


    # 投资指数基金：


    其实投资指数基金的这种简单理财法则是由国外引进的，好多国外的书包括巴菲特都说，“大多数人还是买指数基金吧。”但是这个对于中国市场恰恰有点问题，至少在过去是错误的。


    因为你放弃了Matix的诱饵，而直接成为韭菜与Matrix进行肉搏。我出了国之后研究了很多西方的市场之后才发现，人家的指数基金是一直往上涨的，我们的指数是偶尔脉冲一下，看看这张图就知道了。


    # 图 1 中美牛熊市持续时间比较（月）


    ![](img/62659df0b3729b5d99b589094fb4b8b0_81_0.png)


    *数据来源：WIND，BLOOMBERG，国泰君安证券研究*


    我不是说指数基金是错的哈，在这样的情况，你如果定投中国的指数基金，是可以赚钱，但是这真的太艰难了，你熬得了7年熊市吗？7年真的不赚钱，真的看到买的越多亏的越多，你陪它7年吗？我真的觉得这想法在中国普及有毒。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_81_1.png)


    这是我刚刚截的图，这是上证指数多年就几个脉冲，还有原因，具体需要分析，我可以再多讲10分钟，留到以后也可以。


    # 我父亲的“启动”


    最早的诱饵，认购证：认购证就像一种彩票，你买了几张以后，有一定的概率你就能够在上市前分配到这个家公司的一定的股份。这个东西也不像彩票说有多大的奖。一开始纯粹是一种为国捐款的状态存在的。


    而我父亲那时候深受“资本主义洗脑”，满脑子想尝试资本主义的一切产物，因此证券市场是绝对不能放过的。那时候也不懂，就知道要参与就要为国捐款，也就买了这个票子。哪知道我父亲买了80张，只见上市之后小黑板上的价格擦了再写擦了再写，一夜之间股票突然变成了抢手之物，排队窗口被挤爆。（那时候的股票价格是写在黑板上的）（买股票要去窗口挤）


    ![](img/62659df0b3729b5d99b589094fb4b8b0_83_0.png)


    这个东西我上海的家有一打，不知道听过这个的你们有没有什么联想，其实这个和某个现在天天发生的事情很像？


    “兑新股”（打新），没错。这就是这个市场甚至一直存在的诱饵。


    人人都知道新股可以暴富，于是吸引着一批又一批新的韭菜进入这个市场。而这张彩票，其实就是诱饵。记得我父亲和我说那时候的报纸经常刊登谁谁谁赚了多少钱，是个什么样的富翁这样的新闻。那个时候我父亲积累了第一桶金，也是其中的一员。而最初的那个“不良资产”，快要倒闭的国企，也就变成了一个很简单的6位数代码，被人抛在脑后。谁会关心那是什么，只要“我”能够赚钱……


    实际上认购证就是今天的发新股。这是我们市场的特色。因为只有中国会有兑新股这种事，让本来根本无人问津的垃圾资产甚至优先被抢光，用兑新股这个诱饵让更多韭菜参与。然后就像今天的比特币一样，那时候的股市一开始就是前面的人赚后面的人的钱一开始只要参与就会赚钱，而葫芦里是什么药早就被遗忘了。


    后来我父亲就带着这“彩票”，在里面“遨游”，那个时候他也是什么都尝试过一遍，那时候也没有那么多的股票选择，那个时候我还太小，也不知道这其中发生了什么，但是那个时候和现在最大的不同是股票是普涨普跌的，要涨大家一起涨，要跌大家一起跌的。就这后来的几年，我父亲大约做到了100w。


    其实兑新股这件事，就是国家故意牺牲不管是优良还是不良资产的一点点利益，要求他们在发行的时候比市场价低一点点，导致大家都去用彩票的形式去抢购造成的一种现象，其实和楼市上压新楼盘的开盘价是一个原理，发行者很清楚，只有这样才会引起更多韭菜接盘，才可能吸引更多韭菜。对于现在的楼市也是互相照应，越是想要房价不崩盘，就越是要制造点小便宜让大家觉得不买就是放弃自己的机会给隔壁老王。


    新股发行的速度在中国也是被人为控制的，市场好的时候他会一周4-5家这样的速度快速发行上市，市场不好的时候，他会降低速度，最惨的时候是几个月都不发行新股。这是一个很好的风向标。你可以知道管理层对市场的判断。我父亲往往会在快速发行新股的时候减持股份。在停止发行的时候买入更多股票。


    就在最初的这些年份里，大约1999-2004年间，兑新股不像现在，你一定要买上海和深圳的股票你才有相应的“彩票数”，那个时候是直接拿自己的资金按照资金的多少就可以以申购相应的"彩票"数，因此这套操作父亲获得很大的成功，因为市场好的时候新股发行量大，把股票全部卖掉换成现金就能够享受超高的新股发行的收益，相反新股停发，把现金买成股票的时候又正好是市场的低点。任何人只要这样来来回回做几次，要亏钱，那是几乎不可能的事情。


    现在每天，我父亲早上第一件事情就是去看一下有没有网下发行的新股，他仍然在每天参与“认购证”的勾当，网下发行的新股只要你主动的去申请认购每一次都能够获配一定的股数。也就相当于每一次你都会参与一遍一个股票从原始的一级市场到二级散户手里的过程，市场的脉搏把握的非常的准。


    市场好的时候，一个新股能够连续很久的涨停板，市场不好的时候发行速度下降，可能就一两个涨停板就结束了。我父亲也从来不参与炒次新股的操作，毕竟后面就是鱼钩了，前面的才是诱饵。诱饵吃完了，何必贪心。


    这里补一句，【原则，从不参与开板后的操作】


    只卖出不买进，2004-2005年，中国股票市场上经历的第一个漫长的熊市。


    我每天放学我父亲接我回来就听到财经广播电台里面，不同口音的人讲着自己对指数线未来的判断，好多人都认为要再跌10%以上。一切回归平静，多少人倾家荡产，无疑，这些人才是真正的国有企业的接盘侠。但是他们自己不这样认为，他们只是觉得他们从另一批疯子手里买过了他们自己认为能够改变自己命运的“一个代码”。


    吃人不吐骨头，是这样，因为你吃了毒药最后你骂的不是喂你毒药的人。而这些接盘侠，居然是几乎所有股民。因为最高点的产生就是当所有人都觉得那还会再涨的时候那一刻。这也就是为什么股票市场被骂，做股票的人被看不起，或者听到就让人畏惧的原因。


    很多人对股票市场的理解大多停留在，暴富和倾家荡产上。但其实对与真正的熊市了解却知之甚少。这种感觉也是很少有人体验过的。这也是很多人真正遇到的时候不知所措的来源。


    大多数人以为的熊市就是暴跌。但真正的熊市远不止这个，暴跌一般发生在暴涨之后，这个只能叫熊市的开始，而且这种暴跌是一种必然。这仅仅是市场对于先前过分爆炸的价格的一种修复罢了。甚至不能算一种负面的事件，也不能叫灾难。灾难的只是在最高点买入的那些人罢了。这就像自然现象，天空中水蒸气凝结多了就要下雨一样，灾难的是你没带伞而已。


    真正考验你是不是合格投资者的也就是这种熊市，你能否活过来。


    真正的熊市是你看不到光，你不知道什么时候太阳会再出来？


    是收手不干了，还是继续投入更多的资金？


    当你觉得现在是历史上的低点的时候，他会更低。


    我就记得好像是两年前中美贸易战刚刚开始的时候，股票就有一波暴跌，我记得当时有个人就发朋友圈，说我要进去抄底，已经全仓买入了中国。这个人后来就没声音了。两年后的今天差不多才回到他当时买入的位置。两年。这两年不知道他有没有熬过来，这两年里如果他买错股票的话可能经历过腰斩还不止，要熬到今天,需要有多大的勇气？之前一次又一次的贸易争端，一次又一次的加征关税，他是否还像刚开始那样相信贸易战只是闹着玩的？我们现在是知道结果的人，但是对于当时的那个人来说这就是好比你要坐牢当时刑期不知道一样。看着自己的资产10w?
    9w? 7w? 4w? 4万的时候你该做什么？是不是也会像很多人一样去找网络上的各路神仙指路？“你帮我看看这个股票怎么办？”“怎么办只有你自己知道，你当时为什么买的？”


    # 【封闭式基金： 熊市中的机会】


    就是在上面的这种气氛中很多老股民已经放弃不干了。“观望” 这词恐怕是那时候被提到最多次的，代表了很多人的态度。也有些人从此不再关心股票。那个时候我父亲从书中看到了“封闭式基金”的概念，然后发现A股市场也有同样的东西在交易。要知道在所有人都弃之而去的时候，你还在独自默默的研究是很少得。就像现在我会嘲笑仍然在拼命研究区块链的人一样，


    （注： 区块链我就是看不懂，也不敢去买，这里只是类比一下），因为我们外行的人看到的就是比特币那最初的一波疯狂已经过去，现在再想赚钱就很难了，为什么他这么“傻”还在研究。在熊市的时候研究一个资产就是这样一种感觉。首先你自己很难提起劲来，其次身边也很少能够有共同战斗的人。

    '
