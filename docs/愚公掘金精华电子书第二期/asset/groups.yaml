    ## 工作轻松，空闲时间多，请问如何利用闲暇时间开启副业？


    **提问：**


    花爷，上班族朝九晚五，上班不是996，也有空闲时间，平时就是看看书，买卖股票，想利用闲暇时间搞点外快，请问如何开启副业啊？


    **回答：**


    说到这，花爷也有点不好意思了。说好十二月底一定出课的，到了还是没抽出时间。放心，花爷立个flag，过年前一定把目录、大纲弄好，争取开始更新课程。


    当初为啥想弄这个课程呢？


    就是因为很多花友来问，有什么第二职业（我不喜欢叫副业）可以做？这是个非常普遍、且刚需的问题，但我看了一圈市面上的课程，没有哪门课很好的解决了这个问题。


    市面上关于第二职业的课程都是什么样的？动不动就是躺赚、月入十万，课程内容往往是几个鸡血案例，和一些老生常谈的理论。


    一点干货都没有。


    到底有哪些第二职业适合普通人？它们的原理是怎样的？经过了怎样的发展？从事不同的第二职业有什么样的要求？哪个才是最适合我的第二职业？


    这些硬核的问题，还没有课程能直接了当的说清楚。


    所以我就动了这个念头，别人是说不清楚也好，还是揣着明白装糊涂不想说清楚也好，不好意思昂，我准备把它说清楚。


    花爷以前说过，你不能蒙着眼睛，把手教给别人带你走路，你得摘掉眼罩，把周围看个清楚，才能做出最适合你的路。


    这门课，我就准备做成“让普通人能把每个行业的命门看清楚，找到最适合自己的第二职业”的课程。


    说了半天，把我自己都整的热血沸腾了。还是那句话昂，过年前绝对出大纲和目录，争取年前就开始更新，而且一开始只允许星球内的花友报名购买，给到最低的前期折扣。


    做不到过年在群里发2000红包，大家监督。


