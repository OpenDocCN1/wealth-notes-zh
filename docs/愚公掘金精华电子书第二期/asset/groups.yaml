    ## 为什么花爷反复强调不要裸辞？


    **提问：**


    为什么花爷反复强调不要裸辞？但我这种情况，可能还是要最近提离职：


    （我裸辞过一次，因为找工作花了1个月的时间，最后因为经济压力不得不将就上班）


    但我现在的状况是：


    1. 非常明确要离开目前的公司，辞职的事情已经拖了半年了，再待下去就是浪费时间

    2. 也许你会说，都拖了半年了不能再等等吗？等有了offer再辞。未来两个月是行业旺季，公司会很忙，是没有时间去工作的（一想到忙起来做没价值的事情就焦躁）

    3. 最关键的是，我要换城市，而且要转行（新媒体运营岗转产品运营），换城市找工作不提前去一个城市不太好搞


    并且做好了裸辞之后的经济负担准备，最近提离职，月底走人之前做做求职前的准备，还有什么需要考虑的吗？


    **回答：**


    我说不要裸辞，后面还带着条件呢：除非你本身就想休息一段时间或者有资金储备。


    为什么强调不要裸辞呢？因为人一旦换了工作，至少得工作了两三年，二三十岁最重要的职场奠基生涯，你也换不了几份工作，每份工作都很重要。如果你没做好准备，冒然裸辞，万一找工作不顺利，手头资金紧张，心态基本马上要崩溃，几乎可以肯定随便找份工作就了事了，人生重要的决定走错了一大步。


    像你这种换城市（基本都要gap一个月）+经济有准备，想裸辞也没问题，你就是想出去旅行一年，只要经济允许也没问题。


    还有什么考虑的话，注意下社保公积金迁移，另外如果是转岗，最好提前能加到新城市的职业群里去了解一下情况。


