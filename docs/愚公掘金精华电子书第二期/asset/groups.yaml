    \ - 5.14 花友分享：知乎上运营两个月，给公众号引粉1W+的实操分享\n    - 5.15 花友分享：说说最近爆火的闫同学的背后\n\n## 1 前言\n\
    \n这本电子书，是“愚公掘金”星球的精华内容电子书，而且是第二期。\n\n第一期的电子书的反馈非常好，而在第一期发布之后，花爷又带着大家在星球里疯狂输出了十几万字。这个数字是什么概念？更新内容多到很多花友私聊跟我说看不过来的水平。\n\
    \n所以，咱们第二期精选内容电子书又来了。\n\n老规矩，还是由掘金案例、花爷经典人生问答和掘金闲话三个部分组成。要事先说明一下的是，由于去年案例分享的制度优化，咱们的掘金案例分享停了一段时间，所以这次电子书的掘金案例内容比第一期要少一些，不过咱们掘金案例分享已经在升级后走上正轨，不用慌，精华内容依然精彩。\n\
    \n对了，后加入愚公掘金的花友，如果你们错过了第一期电子书，可以点击下载，这个课不补，你会后悔。\n\n## 2.1 不同资产的家庭，应该如何配置保险？\n\
    \n分享嘉宾：花友KK，从17年开始购买、研究保险，研究多了结果身边朋友同事都来找他为家庭配置保险了。这次分享不会掺杂任何广告，不掺杂任何金钱交易，不涉及具体购买建议，比较适合想了解保险基础知识的朋友。KK主要和大家探讨下各种收入水平的家庭可以如何配置保险。\n\
    \n### 一、保险必要性\n\n保险代理人常见的话术估计大家都听过，例如他们会问你几个问题：\n\n- （1）你能否100%确定不会突然得大病或者遭遇严重意外？\n\
    - （2）你可以马上拿出50万+医疗费用而不影响生活和家庭吗？\n- （3）如果没钱，你有没有把握从亲朋好友那里立即借到足够的钱？\n\n怎么样，听了这几问题是不是也想买一份保险？这里就引出了保险的必要性问题。\n\
    \n从个体的角度，意外不发生的话概率是0，发生了概率就是100%。保险刚好就可以作为一种风险转移的工具，通过一定的杠杆效应，对冲可能发生的风险。保险对于积蓄不多的人作用最明显，相当于为积累期提供一个保障，防止被突然击沉。\n\
    \n但是不要认为买了保险就万事大吉，因为保险是不可能涵盖100%的情况的。对抗风险的终极方法还是多赚钱。。。\n\n### 二、买什么类型\n\n有哪些必要的保险品种呢？\n\
    \n有必要的品种主要为：意外险，重疾险、医疗险，寿险。\n\n- （1）意外险：报销型，主要针对意外身故，意外伤害，意外伤害治疗。\n- （2）重疾险：给付型（确认后全额赔付），主要针对重病大病\n\
    - （3）医疗险：报销型，主要针对住院医疗支出，包含疾病和意外。中高端也有针对门诊医疗的。\n- （4）寿险：给付型，主要针对身故或全残。\n- （5）其他品种的保险都没有购买的必要。包括什么教育险，养老险……都是没必要买的，哪怕说得如何天花乱坠。\n\
    \n首先要避开的一个问题，保险不是理财！\n\n经常听到有人说保险是骗人的，这些人很大部分就是买了带有理财性质的保险。\n\n保险可以分为消费型和返还型。\n\
    \n“消费型”比较好理解。大家应该有接触过车险吧？你付的车险费用只在发生事故的时候起作用。合同到期了，“消费”就结束了，并不会返还任何费用。但是呢，很多消费者会觉得消费型的保险很坑。他们会觉得，花了钱但是没出险，买的保险就白白浪费了。\n\
    \n所以保险公司针对这种客户又开发出“返还型”的保险。\n\n“返还型”保险特点是：如果没出险，到期就会返还所交的保费，听起来很划算。其实呢，羊毛出在羊身上。因为在保额一样的情况下，返还型要交的保费比消费型贵很多，保险公司把你多交的保费拿去投资了，到期再还给你。\n\
    \n实际上，返还型保险相当于在卖保险的时候，捆绑销售了一个理财产品给你。而这份“理财产品”的收益率实际上是非常低的，连货币基金的收益率都跑不赢……\n\n\
    至于这个收益率具体怎么计算，有兴趣的童鞋可以去搜索一下“IRR（内部回报率）”这个计算方法，这里由于篇幅原因就不再展开了。\n\n至于那些分红，储蓄，年金等纯理财的保险，也是不值得买的，具体也可以用IRR去算一下。而且，根据保监为了防范风险，规定这些保险的收益率不能超过4.025%（2019），总之，收益率是很低的。\n\
    \n如果你不是非常厌恶风险的人，或者没有特殊的财务操作需求，一般不建议买理财性质的保险。\n\n结论：应该只买消费型保险，把省下来的保费自己投资理财。\n\n\
    ### 三、具体品种\n\n好了，下面开始讲具体品种。\n\n经常有新产品推出，纷繁复杂。我觉得不应太过深研具体的产品，而是应该抓住重点，节省时间。把时间花在如何提高收入才是比较合适的，因为有一定的积蓄后，保险的杠杆作用就显得没有那么重要了。\n\
    \n那下面就简单说一下各个品种的选择要点。\n\n这里不会涉及具体产品，如果各位想了解具体产品，可以在分享结束后联系交流。\n\n#### 1、意外险\n\n\
    入门级意外险一般买一年期的就行。但是有一个地方值得注意一下，就是全残和伤残的区别。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_15_0.png)\n\
    \n举个例子，上面这一款产品，全残和伤残的保额是不一样的，伤残保额只有5万。\n\n伤残保险金=保险金额×该伤残的伤残等级所对应的保险金给付比例。\n\n\
    如果伤残保额只有5万的话，伤残鉴定赔50%的话，只能获得2.5万的赔偿。。。\n\n意外伤害身故或伤残 50万元\n意外伤害医疗费用补偿（含门诊和住院） 2万元\n\
    限社保范围内费用，扣除社保及其他途径已经报销的部分后按照100%报销\n\n另外一款产品，伤残保额是50万，伤残鉴定赔50%的话，可以获得25万的赔偿。一定要注意这个差别。\n\
    \n另外，针对还没达到残疾等级的伤害，如果保险中含有意外伤害医疗赔偿，也是可以获得赔偿的。\n\n#### 2、重疾\n\n划重点：所有的重疾险，一定包括保监会规定的25种重疾。而这25种重大疾病，占了所有重疾赔偿的95%以上。也就是说，重疾是大同小异的产品，从节约精力和时间的角度，可以抓住几个要点。\n\
    \n- （1）重疾险为了降低道德风险，会有等待期（可以理解为生效期）的概念。很明显，等待期越短越好。\n- （2）健康告知很重要：\n    - 1）大数据时代，千万不能隐瞒病史去投保，如果被发现，保险公司是可以拒绝赔偿的。你的体检，病历，医保卡使用记录，都有可能成为证据。\n\
    \    - 2）如果本身已经有某些身体问题，可以通过人工核保去进行健康告知。有部分产品支持除外责任承保（就是根据问题因素约定某些病不赔偿）。\n- （3）部分保险自媒体喜欢对比分析某些产品中对某些特定疾病的判定区别，其实没有必要。这些产品都各有优劣，不怕麻烦的话可以分散购买。举个例子，可以买2份不同公司的30万产品去替代一份60万的产品。\n\
    - （4）中症/轻症有必要吗？羊毛出在羊身上，附加中症和轻症都是建立在增加保费的基础上的。至于这些可能花费几万到十几万的风险有没有必要对冲，见仁见智了。\n\
    \n#### 3、医疗险\n\n入门级的医疗险也就是现在很火的百万医疗险\n\n- （1）优势明显：一年期缴费，价格比重疾便宜。\n- （2）潜在问题：存在续保风险，例如某一年突然出现一点小毛病导致不能续保医疗险，然后本身又没有重疾险的话，那就比较麻烦。\n\
    - （3）医疗险是报销型的，重疾险是给付型的（确诊即赔付）。\n- （4）优先配备重疾，医疗险适合作为重疾险和意外险的补充。\n- （5）和重疾险一样，一定要注意健康告知，也是比价格为主，不值得深研具体产品。\n\
    \n#### 4、寿险\n\n最后是寿险的要点\n\n- （1）保险公司会规定一些不赔的情况（例如战争之类的），免责条例当然是越少越好。\n- （2）和重疾一样，需要留意健康告知\n\
    - （3）主要作用是保障家属：例如万一经济支柱不在了，家人还能保持生活水平吗？如果是有房贷在身的，可以减轻家人还贷的压力。\n\n好了，听了理论知识，下面到了配置的部分，比较联系实际\n\
    \n### 四、配置建议\n\n#### 1、基本原则：\n\n- （1）杠杆高品种优先，例如意外险300元对应100万保额就属于杠杆高。花2万获得50万的保额和花2千获得50万的保额之间，杠杆可是相差了十倍。杠杆太低的话，保险的作用就很小了。所以年龄太大的人买保险是不太划算的，因为年龄越大越容易出险，保费也就越高。\n\
    - （2）保费支出最好不要超过家庭收入的10%，不然会很吃力，一般在4%~8%的区间比较合适。\n- （3）如果你只想挑着买，可以按这样的优先顺序：意外险\
    \ > 重疾险 > 医疗险 / 寿险。\n\n#### 2、具体例子：\n\n下面看看例子，这些例子只是一个参考，具体需要根据实际的年龄和喜好进行调整。\n\
    \n（1）以一个20万年收入（30岁）的家庭为例，主要是解决一些基础配置：\n\n| 品种 | 被保人(30岁) | 保额 | 保障期 | 缴费期 | 每年保费\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 意外险 | 男 | 100W | XX综合意外险 |\
    \ 1年 | 1年 | 300 |\n| | 女 | 100W | XX综合意外险 | 1年 | 1年 | 300 |\n| 定期重疾险 | 男 | 50W\
    \ | XX重疾 | 终身 | 30年 | 5200 |\n| | 女 | 50W | XX重疾 | 终身 | 30年 | 4500 |\n| 医疗险 |\
    \ 男 | 100W | XX百万医疗 | 1年 | 1年 | 500 |\n| | 女 | 100W | XX百万医疗 | 1年 | 1年 | 500 |\n\
    | 定期寿险 | 男 | 100W | XX定寿 | 30年 | 30年 | 1600 |\n| | 女 | 100W | XX定寿 | 30年 | 30年\
    \ | 900 |\n| | | | | | 每年总计 | 12900 |\n\n如果家庭收入低于20万或者想压缩投入的话，可以减少寿险的额度，或者重疾险改为保障到60/70岁，减轻负担。\n\
    \n（2）年收入50万的家庭为例，主要是提升了意外险和医疗险的配置和家庭支柱的寿险保额，也可以考虑提高重疾的保额。\n"
