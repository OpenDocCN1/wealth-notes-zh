    ## 工作内容和自己方向不匹配，找不到自己的职场优势怎怎么办？


    ### 提问：


    找不到自己的职场优势该怎么办，双非硕士在校期间做的图像处理方向，毕业之后进了一个小型初创公司，做智能物流小车，本来说做算法方向，其实并没有，实现几个经典路径算法，又不是用于实际中，后来就转做调度系统开发，重新学习Java开发，做起来确实没有有经验的同事做得好，然后自己心里落差很大，只能挤时间自己再恶补Java。有时候会疑惑到底做开发适不适合自己，或者说自己适不适合从头开始做Java开发，有点不甘心从此告别算法，现在计划离职了，再补补Java去杭州找找工作，但是还是纠结自己找什么类型的工作，所以想要问问。


    ### 回答：


    研发的职场优势一般只有两个，一是技术牛逼，二是参与了牛逼的项目（如果是领头就更好了）。


    前者不仅要花时间，真正的技术大牛还是需要一些兴趣驱动的。但后者就要灵活一些了，虽然你技术一般，但进到一个好项目，不仅能跟着长技术能力，还能有项目成绩给自己背书。


    如果你技术一般，进不了大厂，参与好项目需要什么？眼光。


    我在前面写过，如果分辨一个公司是否在告诉发展中：https://t.zsxq.com/Z3bqfEu。


    一个高速发展的公司，因为初始规模不大，招人比较急，一般门槛不会很高，如果能进这类公司，不仅简历好看、技术长进，运气好还能以资历优势在几年后做到leader，到时候发挥的空间就要大得多了。


    所以你不该问找什么类型的工作，你需要去挑优质的公司，好好准备面试，完成重要的一跃。


    另外补充一点，职场优势和人生优势是不同的。


    研发人员的职场优势往往比人生优势要窄，比如你会写文章、善于结交，这在研发的职场上发挥空间比较小，研发能力不行是硬伤，职场上不好混过去，但在其他的行业发挥空间就很大，做个技术自媒体，那就是完全不一样的轨迹了。


    从这个角度看，人生优势才是实现阶级跳跃的根本。只盯着职场优势看，未免太过局限了。


