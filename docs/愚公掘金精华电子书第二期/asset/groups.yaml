    \ 70% |\n\n### 3. 住房公积金\n\n单位和个人按同等比例交，公积金是交得越多员工越开心。\n\n公积金用途：\n\n- A、购房贷款：每个人的额度是50万，有补充公积金为60万，连续足额缴存公积金满六个月及以上。另外，还清了一套住房的公积金贷款的前提下，可以继续用公积金贷款买第二套。\n\
    \n- B、支付房租：适用于名下没有住房，且连续缴存住房公积金3个月及以上，最高每月提取3000元。\n\n- C、装修房子：上海市住房公积金提取管理办法第十三条职工建造、翻建、大修本市拥有所有权自住住房提取住房公积金的，应当提供原不动产权证（含原房地产权证）或者用地证明、主管部门审批文件、付款凭证等证明材料。\n\
    \n- D、家庭生活困难职工提取住房公积金用于支付房租、物业管理费、售后公房物业维修费等费用。\n\n- E、特殊情况下提取公积金：退休、出国定居、死亡等特殊情况\n\
    \n## 七、个税筹划的方法\n\n### 1、报销法\n\n你们有没有遇到过：公司要求员工每月找一部分发票报销以冲减一部分工资，一来员工可以减少缴纳个税，二来公司也可以降低缴纳社保的基数。随着金税三期的上线，这种办法有一定的涉税风险，因为员工找来的发票良莠不齐，很有可能是虚开的发票，链条中无论哪一环爆发，都会殃及池鱼。\n\
    \n### 2、保险法\n\n购买可以税前扣除的保险，比如商业健康保险，税法规定可以每年扣除2400元；比如税收递延型商业养老保险（在上海、福建、苏州工业园区试点），按收入的6%和1000元孰低原则扣除。这种方案适用于那些本来就要买保险的人，通过购买保险的方式来降低个税（但是很有限）。备注：购买的时候，直接问卖保险的人是不是可以在税前扣除，他们都有备案的。\n\
    \n### 3、股权分红法\n\n这个主要是针对公司高管的，对普通员工没有借鉴意义。具体操作：像京东、Facebook一样，对高管不发工资而是分红，因为工资很高的情况下，按45%缴纳个税，而如果按股息、分红的话，是按20%缴纳个税。\n\
    \n### 4、劳务派遣法\n\n这个主要适用于共享经济下的灵活用工人员，比如外卖平台、出行平台、微商平台、直播平台等，如果采用传统的全职模式，成本比较大，员工拿到手的钱也少了。\n\
    \n### 5、将劳务报酬转为个人独资企业\n\n身处花爷的社群中，相信在花爷每天鼓吹掘金的思维下，很多人都有自己的副业，将来也会有很多人副业收入会大于自己上班的主业收入。那么现行“综合所得”体系下，像咨询、直播、设计、讲师、网红等劳务收入都纳入综合所得，在劳务收入额不高的情形下，缴税不多，影响不大，但是如果劳务收入高于主业收入呢，这种情况如何减少交税就成了大家比较关心的问题。\n\
    \n先看下面这张图：\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_63_0.png)\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_63_1.png)\n\
    \n我们一开始就讲过，演员演戏是作为劳务收入缴税的，劳务收入是按 20% 或 30% 或 40% 预交个税的。\n\n演员一部电影或者电视剧下来，少则几百万，多则几千万，那按劳务费计算，要交巨额的税款。\n\
    \n如果是个人独资企业/合伙企业，采用核定征收的方式，综合税负率在5%左右，就大大降低了税负，而且不需要提供成本发票，就可以直接提现到私人账户。\n\n**个独核定征收小规模税负表**\n\
    \n| 收入额 | 增值税(3%) | 附加税(10%) | 企业所得税 | 个税合计 | 应交税费 | 综合税负率 |\n|---|---|---|---|---|---|---|\n\
    | 10万 | 3000 | 300 | - | 500 | 3800 | **3.80%** |\n| 20万 | 6000 | 600 | - | 1000\
    \ | 7600 | 3.80% |\n| 50万 | 15000 | 1500 | - | 3500 | 20000 | 4.00% |\n| 100万\
    \ | 30000 | 3000 | - | 9500 | 42500 | 4.25% |\n| 300万 | 90000 | 9000 | - | 49500\
    \ | 148500 | 4.95% |\n| 490万 | 147000 | 14700 | - | 106500 | 268200 | 5.47% |\n\
    \n这种方式也可以迁移到其他行业高管人群以及拿高佣金却无法提供发票的高收入人群。\n\n当然，除了考虑税率的问题，还要考虑组建公司的成本问题，全面衡量利弊再做决定。\n\
    \n最后，关于税收筹划的思维，无论作为员工还是作为老板，其实具备这种思维都是没有坏处的，比如你是营销策划人员，那不同的促销模式可能所要缴纳的税收不一样，如果你带着这种思维去咨询你们公司的财务，把这块写进策划方案里面，那相信老板也一定对你刮目相看；如果你是销售人员，不同的结算方式面临的税收也会有差异；如果是老板，那这种思维更加不能少，税收筹划贯穿于公司创建设立、生产经营、投资融资、利润分配、并购重组的各个阶段，涵盖增值税、消费税、企业所得税、个人所得税等各个税种；老板有了这个思维，碰到涉税问题的时候多与自己的会计沟通，省出来的税就是给企业多赚的钱。\n\
    \n分享结束，谢谢大家！\n\n## 问答：\n\n1、我们公司每年发项目提成，都是让我们自己准备发票，这样公司可以抵税。请问这种抵税的方式，具体是怎么操作的？可以讲下吗？我比较好奇。\n\
    \n上善若水：无论是什么发票，都可以作为成本入账，增大成本就是减少利润呀，这就减少了企业所得税，这是其一。其二，抵税这一说法肯定是针对增值税的，增值税是一个链条税，针对增值的部分才交税。比如你买进来70元，卖出去100元，那么真正交税的就是差额30元。公司让你们准备得肯定是增值税专用发票吧，如果是增值税普通发票，那么不存在抵扣这一说法。所以公司拿到的增值税专用发票的进项越多，那么就相当于那个70变成了80或者90，那么差额就小了，交的增值税就少了\n"
