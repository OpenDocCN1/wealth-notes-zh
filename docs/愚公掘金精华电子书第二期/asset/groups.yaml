    ## 转行的情况不清楚？快速了解行业的方法很重要


    **提问：**


    花爷你好，我现在做的是儿童摄影，但很想转行，最近关注了很多教育类的加盟，有一个是绘本阅读类的，类似于早教的吧，加盟费大概6、7万，总投资20万左右差不多了，还有另一个是手创类，适合大点孩子的，木工、机械，机器人什么的这一类的课程，我带我儿子体验过，孩子倒是很感兴趣，加盟费比较贵，16万左右，总投资要40万左右，因为我们是县城，房租色话不高，我现在想的是不加盟可以省钱，但是不懂这些行业，走弯路可能会浪费钱更多，还有就是这两个行业可以进入吗？我其实真的是一个挺纠结的人，贸然转行不知道可不可行，因为原来还做过餐饮，一开始挺红火，但之后就不行了，也就不干了，再去投资就不敢贸然行事了，所以请花爷指点一下


    **回答：**


    说实话，我不知道这两个行业值不值得入。我又不是神，我怎么会知道呢？哪怕这两个行业在全国都大火，在你们县城也可能会扑街，哪怕这两个行业在全国都扑街，在你们县城也有可能大火。


    个人在全局的概率面前是没有还手之力的。哪怕这两个行业全国的成功率是99%，只要你不幸是剩下的1%，那对你和你的家庭就是100%。


    不过别急，虽然我不是神算子，算不出未来，但我会告诉，如果我是你，我会怎么做。未来不是算出来的，是靠脑子试出来的。


    你说了，你是做儿童摄影的，你想转行。人一旦有转行的念头，会习惯性的想要抛开过去的一切，其实不管是早教、手创、还是儿童摄影，目标用户不都是小孩和家长吗？


    如果我是你，我会去找全县儿童教育类的商家谈，早教、手创、小儿推拿、幼儿游泳等等，每个细分领域都找一家，然后去跟她们谈合作。


    ### 怎么合作呢？


    我会把我摄影馆的所有客户都加到微信，然后和这些商家联合，每家都出一些优惠券，当做独家福利在朋友圈宣传，用户只要转发就能拿到所有独家优惠券，让优惠券传播出去。


    这样一来，我能拿到两样东西：


    第一，我能知道每家优惠券的领取使用情况，根据这个数字，我能知道每个细分领域在本县的需求到底有多大。

