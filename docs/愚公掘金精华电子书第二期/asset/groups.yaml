    # 花爷，想做短视频，

    现在还有机会吗？麻烦推荐几个比较好的讲短视频的公众号


    # 提问：


    花爷，想做短视频，现在还有机会吗？麻烦推荐几个比较好的讲短视频的公众号。


    # 回答：'
  - '[PAGE 483]


    有。短视频和公众号一样，变现方式无非几种：带货分销、广告、引流销售其他产品。


    带货分销的门槛会越来越高，靠投dou+撬动杠杆的玩法会越收越紧，最后带货还是渐渐成为大流量播主的变现手段之一。知道19年12月天猫卖面膜最多的商家是谁吗？不是欧莱雅，也不是完美日记，是辛有志严选——快手辛巴家的带货天猫店。


    广告变现，靠的还是粉丝量。目前的抖音快手，做几千万大V已经很难了，顶部播主三分之一都在掉粉，不过做到百万粉丝的几率还是有的，重要的是从一开始就要塑造好IP感，很多播主空有百万粉丝，IP价值为0，接不到广告的。'
  - '[PAGE 484]


    引流销售是我最看好的短视频变现方式，就像我在“面向结果写作”系列里讲的一样，只要你保证转化率，涨10个粉能成交，涨1000个粉也能成交，投入就有收获，对普通人最友好。现在抖音快手做初高中课程辅导的、PS培训的、衣服穿搭的，类型非常多。当然了，想做好，内容上同样要下功夫。


    讲短视频的信息源，我推荐你直接看飞瓜数据，一个专业抓短视频数据的工具。付费版很贵，不过免费版还是能看很多信息，建议初学者直接对着榜单，把热门前50名都研究一遍先。


