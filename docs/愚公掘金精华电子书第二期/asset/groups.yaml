    # 花友们注意：转行一定要谨慎


    提问：


    花爷，本人在教育机构从事了3年的辅导工作，对于教育行业并不排斥，现在已经离职，就是想走出自己的舒适区。想从事产品培训类的工作，自我感觉没什么自信在这方面，觉得没什么经验，算是转行。但是投了一些简历也没什么回应，想着要不要找一些付费的资深hr来修改简历。还有就是自己已经工作了3年，对于薪资有些要求，可是想到自己有些转行，会不会有些好高骛远。对于未来的发展有些迷茫和困惑。'
  - '[PAGE 448]


    # 回答：


    我之前说的几个转行的大忌，基本给你犯完了。所以我准备骂你一顿，希望你清醒一点：


    # 1.没有确定工作就离职


    你要是有储蓄，说我就想放松一下或者原来的工作我实在受不了了，裸辞我还理解。你既然并不排斥原先的工作，仅仅为了走出舒适区，就选择了裸辞，难道没收入没工作就叫走出舒适区了？


    如果人生真的有舒适区，那除了舒适区，还有奋斗区和茫然无措区，你现在确实走出了舒适区，但你也没走进奋斗区，而是走进了茫然无措区——还不如在舒适区呆着。


    # 2.没有充分的了解就转行'
  - '[PAGE 449]


    放弃3年的工作经验转行之前，你对期望从事的产品培训类工作并不了解。


    你可能会说，我去了解了啊。不是的，你去了解，是你的动作，你是否真正了解了，是结果。我为什么说其实并没有真正了解？


    因为真正了解的人，很清楚新的工作需要什么能力、自己在什么样的段位、自己有哪些能力匹配，如果你真的弄清楚了这些问题，不至于简历全部石沉大海。


    你想付费让hr帮你修改简历，你知道hr怎么帮你修改简历的吗？就是把岗位的要求，和你的过往经验，想方设法的匹配起来，如果你真正的了解了要转行的新工作，这件事你一定可以自己做到。


    # 3.现在怎么办？'
  - '[PAGE 450]


    给自己定一个比较短的期限，不超过两周，去找做过产品培训的人聊，去理解这类岗位需要什么能力，自己有哪些欠缺，如何在简历里规避缺陷、突出优势，然后再投一轮简历。


    到那个时候，如果你还是非常看好这个新岗位，那有面试就去，可以接受一定程度的降薪。


    如果还没有拿到合适的offer，就在原先的岗位再找一份工作，先做起来，先在舒适区活下去并为自己留有余地。记住呀，想上太空没问题，问题是太空穿的宇航服，也是在地球上造的，谁会走出舒适区，直接去太空里为自己做一件宇航服呢？


