    ### 普通人捡钱的三种理财方式


    分享嘉宾：花友风子，原先本职室内设计，17年 偶入理财投资领域，18年考取理财规划师证，并在2018年逆市做到年化36%收益率。现在是专职的理财规划师，带一个团队做理财服务。


    嘉宾会给大家分享，为什么这些方法的风险很小、约等于捡钱？如何一步一步操作去捡钱？怎么捡几率更大？


