    ## 对于单打独斗的抖音创作者来说什么样的内容更合适？


    ### 提问：


    现在教抖音拍摄的教程视频集中爆发，人们从看抖音变成了拍抖音，人人都想分一杯红利，可见有一大批人涌进抖音拍摄的人潮中，记得花爷预测过，下一步肯定有更专业的团队入驻抖音，那现在对于单打独斗的拍摄者来说做什么样的内容比较合适


    ### 回答：


    抖音的运营者正在和公众号作者面临同样的幻觉：大部分人还在以为粉丝数和播放量就是一切。


    其实抖音做到几万几十万粉赚不到钱的人大有人在，大V日子也不消停，粉丝数见顶之后每天都在掉粉，发一次视频就掉一次粉，只能靠偶尔出一个爆款缓慢涨粉。


    其实大可不必这样，特别是个人创作者，要带着目的性做新媒体，不要盲目崇拜粉丝数。


    大团队确实设备专业、人员专业，但是个人也有优势。


    - 1. 确定要自己的定位，做精准粉丝，虽然粉丝量不如大号，但是转化高，哪怕只有100个粉，如果都是目标用户那就有价值。


    2. 个人的设备可以不专业，但拍视频的手法、理念可以专业，这些都是可以学可以练的，没什么门槛。


    当你用专业的手法和理念，去切一群精准用户，效果不会太差，这个道理建议你再看下我前几天写的“面向结果写作”: https://t.zsxq.com/7EyFaA2


