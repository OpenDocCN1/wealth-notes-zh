    \ | 2009-10-22 | 2009-10-28 | 0.23 |\n| 2009 | 2009-03-23 | 2009-03-24 | 2009-03-30\
    \ | 0.24 |\n\n单看派息可能看不出来，对应它的当时价格算一下，就是每年大概4%左右。\n\n(5) 手续费低，因为这个标的是场内交易，我在用的券商是收万分0.6，而场外的变态的收百分之一，良心的也要千分之三，打折时最低也要万分十二左右，等等，等等，如果光景不好，那就稳定拿分红，当代的包租婆新姿势。如果光景好了可以止盈，等来年又低了继续买入，好消息是，我们A股，每次牛市过后，都是断崖式下跌，很快就又可以买买买了。我就不继续吹了，我们看下如何操作投资比较实在一点。\n\
    \n## 2、红利ETF如何投资\n\n我个人建议按每个人不同的收入结构来进行不同投资策略，比如，工薪阶层，每个月按月收入领工资的，就会建议用定投的方式，每个月投资，博它的上涨空间，以时间换空间。\n\
    \n如果是自由职业者，或者创业者等收入不固定或收入周期长的朋友，会建议用一次性投资，尽早吃分红，并且注意择时。\n\n择时方面，我个人的投资决策是按指数的PB来，当下PB<1是投资的好机会。\n\
    \n可以用这个连接去看指数的\nPB：\nhttps://danjuanapp.com/djmodule/value-center?channel=1300100161\n\
    \n| 指数名称 | PE | PE百分位 | PB | PB百分位 | 股息率 |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| 标普价值 | 6.17 | 1.33% | 0.68 | 1.57% | 4.95 |\n| | SPACDVCP | | |\
    \ | |\n| 上证红利 | 7.30 | 26.60% | 0.88 | 1.92% | 4.60 |\n| | SH000015 | | | | |\n\
    | 中证红利 | 7.80 | 18.56% | 0.96 | 2.16% | 4.32 |\n| | SH000922 | | | | |\n| 300价值\
    \ | 8.17 | 25.96% | 0.96 | 2.48% | 3.80 |\n| | SH000919 | | | | |\n\n具体操作，和刚才直接买入可转债是一样的方式。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_171_0.png)\n\n## 大家看两张图\n\n一、 指数名称和代码\n\
    \n指数名称：上证红利指数\n\n指数简称：红利指数\n\n英文名称：SSE Dividend Index\n\n英文简称：SSE Dividend\n\n\
    指数代码：000915\n\n二、 指数基日和基点\n\n该指数以 2004年12月31日为基日, 以1000点为基点.\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_172_0.png)\n\
    \n从2004年末的1000点算起，现在2019年下半年2708点，年化7%，加上4%分红，15年来稳定年化11%，现在仍然是在熊市区域。\n\n我们A股熊长牛短，靠的就是还在属于熊市低估区域不断积攒筹码，之后的牛市，你们懂的。\n\
    \n在股市里，80%的利润来源于20%的时间里，运气是准备出来的，可以趁现在还是属于熊市低估区域不断积攒筹码，积攒运气。\n\n如果条件允许，从明天开始动手，如果条件不允许，那就创造条件，不然之后的牛市，和你无关。这就是我要讲的第二个捡钱好东西，行情不好，4%稳定收租，行情好和股市齐飞，牛市收割一把，收益率还是可观的，对小白们很亲民，会买，就够了。\n\
    \n再来继续讲第三个投资品，因为这个第三个投资品，我个人觉得，是可以联合前面讲的两种。所以我一起讲了呀，讲完，大家再一起high。\n\n已经有很多花友猜到的，国债逆回购。\n\
    \n# 三、国债逆回购\n\n老规矩，我先讲理论，然后再讲如何实操。\n\n## 1、国债逆回购是什么\n\n本质就是一种短期贷款，我们个人投资者是借出方，在股票账户中，个人通过国债回购市场以约定的利率出借资金，然后在约定时间到了之后会给我们本钱和利息。\n\
    \n有几个优点：安全高、收益稳、流动强、操作方便、手续费低。\n\n（1）安全性高，风险极低，除了有证监会管着，这东西是和国债有关呀，国家借的钱呀，可以把心放到肚子里去，可以说几乎0风险。\n\
    \n（2）收益率时常飙升，逆回购的收益率跟市场的资金面有关，资金面越紧张，市场越需要钱，逆回购的收益率越高。\n\n（3）操作方便，有股票账户（需要开户）就可以直接操作，操作快捷，一键放贷，到期资金自动到账。\n\
    \n（4）流动性好，资金到账后，可立即交易股票。\n\n（5）手续费低到万份之0.1，按天数计算，10万做一天逆回购只需1元。\n\n## 2、国债逆回购实操\n\
    \n我们来实际的动手起来，券商操作的，如果还是说不知道哪个券商好，可以课后加我好友，我给你说我在操作的低佣券商。\n\n第一步：在主界面点逆回购，有的券商APP是写着逆回购理财啥的，反正找以这三个字就差不多\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_176_0.png)\n\n第二步：看你要把钱借出去几天，就选择对应的天数\n\
