    \n何同学从十三四岁的时候就开始看数码类的视频 (https://www.bilibili.com/video/av43248892) ,所以数码这面积累比较丰富，后来就开始做了测评。\n\
    \n何同学对测评的切入点很不一样，通常的测评都是测最新、最热的产品，而何同学所介绍的大多是自已比较感兴趣的老产品，这些产品评测的成本并不高，闲鱼上面都能买到，而且自己比较熟悉，制作起来就更为顺手了。\n\
    \n何同学的视频相比其他，更多的是心意和新意。他每一个镜头的运用、转场真的是能够看出用心的，其实对我比较印象深刻的还是何同学有着与他身份不相符的能力。\n\n\
    何同学其实在2017年就已经开始了视频制作，第一个是翻译Vlog，第二个是PR教程，从三个开始才算是真正的测评。何同学有着很强的学习能力，他的拍摄技术，包括后期制作都是在B站中自学的！并且自己还专门开了一个专栏，整理了大量资料去教PR\
    \ B站视频制作教程推荐 - 哔哩哔哩\n\n从时间顺序来看，何同学大概每个月会出一期视频，偶尔有个小爆发。把他所有的视频都按照时间顺序看的话会明显的发现：视频质量在提升！\n\
    \n从 2017 年 10 月 -2019 年 6 月，何同学每个月都在进步，怎么看出来的？ 首先是视频体验，其次是 播！放！量！！！ 从最初的 7 万到现在的\
    \ 800 万+\n\n何同学的视频，他自己从没有进行过推广、运作，完全是靠内容吸粉，逐渐滚雪球到今天的。这一个阳光男孩所拥有的能力，完全不像是一个大二学生该有的样子，在我印象中的大二学生还是整天打游戏、逃课、恋爱、死学书本知识…\n\
    \n6 月 6 日上午，工信部正式向中国电信、中国移动、中国联通、中国广电发放 5G 商用牌照，此举标志着我国正式进入 5G 商用元年。[https://cn.reuters.com/article/cctv-china-miit-5g-…](https://cn.reuters.com/article/cctv-china-miit-5g-…)\n\
    \n6 月 6 日，何同学发布了 5G 的视频…\n\n## 何同学带给我的思考\n\n民众现在更喜欢真正优质的内容，或许已经出现了‘抗药性’，不是喜欢看乱七八糟的水文、机器批量生产的文章、被各种二次加工的视频、各种标题党....\n\
    \n条件允许的情况下，坚持做自己喜欢的事情。何同学喜欢做视频、坚持了两年，中间是父母”投资“给何同学买拍摄的各种器材，从没有期望有任何回报，全凭兴趣爱好。\n\
    \n866\n\n公众号懒人找资源\n\n有自己的思考、认知。在5G的视频里，最能触动我的是 何同学探索5G的用处许久后，搜索了「4G有什么用」... 这个从现在看过去的角度真的很有趣。何同学每个视频里的策划、稿子都是自己反复打磨的，包括文章标题、TAG，从介绍卧室这个视频里\
    \ https://www.bilibili.com/video/av32146794，改了结尾的BGM和 一下小细节，很燃！让我一下就记住了他\n\n何同学在B站逐渐火起来后，从2019年5月起，YouTube、梨视频相继也出现了「老师好我叫何同学」。不知道是搬运的还是二次投放的，如果是何同学投放的说明已经察党到自己的影响力了，并开始去扩大影响力，因为在4月份的时候最起码有三个大V于何同学进行了勾搭，或许会给何同学\
    \ 一些建议吧。\n\n一些数据：\n\n新华社、央视接连点名,\n\n何同学，你火啦！！！\n\n不止是速度! 这段5G测试视频火了\n\n微博大V转发、点名的数据:\n\
