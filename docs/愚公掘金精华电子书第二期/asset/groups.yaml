    #### 2、可转债怎么赚钱


    好，上面我们知道了，这是一个大众情人，人见人爱，那我们继续来讲讲，我们如何实际投资买入收益呢，两种办法。


    ##### （1） 捡钱第一招：可转债打新


    可转债打新和股票打新很像，就是上市前去申购就是了，一出场都是一张100元，加上它到期后总共会收到一些利息。


    比如上面举例里九洲转债税后可收到总的利息是1.34%，加起来就是101.34元，这就是这张债券的保本价。


    而打新，我们申购的都是按100元一张，亏不了，假如上市后跌了，大不了最差的结果就是拿到到期后收点利息。


