    ## 对简历上的工作年限做了修改需要担心新公司的背景调查么？


    ### 提问：


    花爷你好，抱歉匿名下，问题比较负面。。


    我刚入职一家新公司，我因为工作经验不多，简历上写的三家公司，其中第一家（最早的那家）公司工作经验是有问题的，工作时间多写了一年多。


    现在新公司委托第三方背调公司来对我做背调，这个有办法避免吗（比如专门提供反背调方案的团队），还是该和领导坦诚呢......


    现在背调的人还没联系我，我已经入职了，公司非常nice，是目前最想待的公司，不想就这样无缘了🥺🥺


    ### 回答：


    别慌，公司招人主要看的还是能力，不少人都会在简历里或多或少的包装一下自己，不涉及到核心问题（主要是能力问题），一般就算背调被发现了，问题也不大。


    你现在如果能联系到第一家公司带你的领导，就联系一下，通一下气。如果联系不上也没啥关系，不用主动找领导坦白，一般情况下这事儿就这么过去了。


