    ## 请花爷在商业角度解读李子柒


    **提问：**


    请花爷在商业的角度上，解读下李子柒，有什么是我们花友可以学习借鉴的呢？


    **回答：**


    我第一次知道李子柒是2017年5月，那时候李子柒还没现在这么红，但受到了和现在一模一样的质量，很多网友喷她的视频不是真实的农村生活，甚至说她视频造假。


    于是李子柒宣布停更，并发了一条微博，把自己从16年到17年的历程写了出来。


    我特地去把这条微博找了出来，下面的图片就是李子柒在2017年写的历程（更多图片在评论里），我希望花友们一字不落、仔仔细细地看一遍。


    看完之后，大家不妨问问自己：


    如果你是2016年的李子柒，你能在如此困难的情况下，窝在小山村里，一遍遍的反复拍摄、剪辑、精益求精吗？你有这个韧性吗？


    反正我是不敢打包票说自己可以。


    李子柒的经历至少告诉我们三个道理：


    - 创造价值这件事，从来不会落伍。

    - 什么是价值，不是喷子决定的，国内国外这么多人爱看李子柒，这就是价值。

    - 李子柒17年决定和MCN合作后，事业更上一层楼。人和企业不一定要马上进行商业化，但尽早考虑商业化，终归是件好事。


    我以前幻想过很多种停更的方式，

    或许是因为我拍累了不愿再出现在镜头面前；

    又或许我遇到了可以托付终身的人成了家有了孩子；

    再或许是哪一天我找了比现在更让我感兴趣的生活方式；

    可无论哪一种，都不是我今天要面对的这种。。。


    6岁时候的我，

    被继母拽着头发往水沟里按；被打的半死不活时，

    都生生的没掉过一滴泪。

    而此刻，我是肿着眼睛抹着脸敲下的这些字。

    我很努力的想要让自己平静下来，

    也深知现在的自己样子有多难看，

    可是咬破了嘴皮我还是控制不了现在的心情。


    ——他们伤害的，是我用命在护着的那个人！！！！！


    自从关注我的人多了以后，网络上关于我的一些谣传

    就没少过，

    甚至上升到人身攻击、造谣和刻意抹黑………

    好比这些：


    一看就是很大的团队拍摄的，她只负责露个脸，她怎么会做那么多菜，肯定还有替身。居然还说说都是她自己一个拍的，不要脸！那么漂亮会做菜？用脑子想想可能啊？


    ![](img/62659df0b3729b5d99b589094fb4b8b0_506_0.png)


    这么好看的视频肯定是专业团队拍出来的啊！自己一个人怎么可能拍出来。有团队还不太人，非要硬说这是自己拍出来的，真恶心！


    还有各种“专业人士”很“专业”的去分析你用了多少个机位以及哪些专业设备的。


    **这些都很正常，或许他们不了解你；**

    **或许他们真的就觉得你一个人拍不出来。**

    **每个人有每个人的想法，我只需要做好的事情，**

    **不懂我那些人说什么，那不重要……**

    **所以哪怕看到一些有心人为了故意抹黑你，**

    **前后矛盾的编造故事时，**

    **也只能笑着安慰自己说这样的人是少数不必动**

    **再比如这样：**


    ![](img/62659df0b3729b5d99b589094fb4b8b0_506_1.png)


    从去年3月底开始拍摄美食视频到今天有一年多

    吃多少苦、遭多少罪、被泼了多少脏水、甚至被同行的恶意陷害

    始终都没觉得后悔过

    因为我始终觉得清者自清，没必要去解释。

    为了那么多在护着我保护着他们自己的粉丝朋友

    还有那么多我一发视频就当自己的作品一样的支持，

    疯狂转发评论点赞把我送上热门的真爱粉朋友们


    为了她们那份没理由的爱和信任，我要坚持拍下去。


    可今天，


    我看到老人家流血的手，看到朋友为我掉下的泪。


    第一次，第一次觉得我鼻子梁；

    有多可笑，可悲、可怜！

    我的自命清高、我的毫不在乎、我的自以为是……

    却实实在在的伤害到了心疼我的家人，

    担心我的朋友还有爱我的你们……


    今天拍新视频的时候肠冠又犯了，疼的冒汗。奶奶年纪大了不能送我去医院。就只能打我一个护士朋友的电话让她往我家跑一趟，因为之前几次拍视频中暑、冻发烧了也是她来我家帮我看的人，再者我们是几年前做公益认识的人很靠谱很热心。她来了后给我打了针，挂了瓶。之后就是一顿骂，大致就是“要视频不要命不照顾好自己以后就不管你了……”这一类的。我每生一次病就要被她骂一顿，她也骂习惯了，我也听习惯了……


    后来扯到网上的谣言，她说：“你付出这么多，有什么用，网上那些人反而还造你的谣，泼你的脏水……”后来这丫头越说越激动，大致就是说在“某子”上看到有一群人身长舌论的搜骂我造谣，她看不过就解释了几句。那些人就各种攻击她，说她以及所有帮我说话的人都是我的公关团队在洗白。她生气了就骂了几句，那一群又人又一起说我没素质，说什么我也没素质，表里不一，XXX等等等不太好听的语……最后小丫头估计太难过，自个儿坐那儿边为我打抱不平边掉眼泪……


    那一刻很心疼，从我一个粉丝都没有，拍了几天的视频没有一个人点赞到今天，她都是看着我走过来的。我每次因为拍视频生病她几乎都在，这一年我怎麼过的她最清楚不过，所以我也很清楚她为什么难受。可我什么都还没做不了，只能安慰她我没什么大事，不严重。睡一觉身体就好了…………


    这时候奶奶进来了，给我端了吃药用的开水进来。她没说话，可我明显感觉到她神情不对，心里有过这么一个念头：我们刚才所有的对话，她会不会听见了？但当时顾着继续安慰小化所以也没多想……直到我们听见外面一声金属落地的声音。小花跑出去再跑进来；她告诉我：奶奶手受伤了……


    我提了针跑出去，就看到一位80多岁的老人，左手 上血染红了一片……眼睛里含着泪，不关心伤口，也不关 心掉在地上那把割猪草的刀。直直看着前方……我瞬间 明白了，她一定是听见了。所以砍猪草的时候才会走神，
    所以才会计到自己。我们一起生活了那么多年，她的每 一个动作、她的各种眼神 我再明白不过！！！那一刻， 心像被狠狠的撕了！！！！那是我掉在心头尖上爱的 人，那是我放弃所有都要陪在她身边就为了保护她的
    人……现在，却因为我的一个疏忽间接的让她受伤了…… 我和小花过去帮她包扎，她转过头来跟我说："以后我们 节约一点，你别做这个工作了…" "


    我到现在都不知道怎么用文字去描述听到这句话的 那一刻是什么心情，撕心的疼，努力的大口深呼吸了 几次都缓解不了。怕她看到我哭，便低下头去帮她缠 纱布，眼前却什么都看不清了。


    曾经，因为怕她担心生活问题（100万粉丝以前虽然 每天都有几十个广告商找上门，但没对脾气的就没有接 任何广告也没有收入几乎一直在花老本），所以我从 一开始就告诉她我拍的每一集视频都是可以换钱的，好让
    她安心，所以她也一直以为我拍视频就是在在工作。每次 我一个人来来回回的从清晨拍到凌晨三四点。我家的院 子就那么大，我都能走的双腿酸的像灌了铅那样疼。每 次看到我忘记吃饭，她都会默默帮我把饭热在锅里并
    水跟着；每次我在房间剪视频一天没出去，她都会按时 把新鲜的饭菜端进来换掉旧的……字写到这里，突然 很想抽自己耳光子！！！口口声声说的孝顺，到头来我 却做了什么？？


    我也从来没想过有一天，会因为我在网络上上传自 己拍摄的视频而真正的伤害到我周围的人，所以之前都 不去理会那些闲言风语。一开始有人问视频怎么拍的， 我还会偶尔回答：用三脚架拍的，结果换来的一趟都
    是不相信、质疑、甚至诋毁。所以我后来就懒得回复了， 爱怎么想怎么想。我自己知道就好。可今天呢？就是 因为我的不解释，不理会，导致这样的谣言越来越多。 导致我的朋友为我打抱不平反而被骂，导致我的粉丝为
    了维护我在这那些人吐“谁”……


    心疼我还伤了自己。而这一切，都是因为我没说……


    那就今天吧……我们来一说。说一说我到底是不是砸钱包装出来的“网红”；说一说我有没有用了摄影师/摄影团队/替身 还不承认；说一说我是不是整天有一大帮助理团队/化妆团队/道具团队/编剧团队/公关团队围着我团团转，把我伺候的像个爷……


    嗯，是该说说了……


