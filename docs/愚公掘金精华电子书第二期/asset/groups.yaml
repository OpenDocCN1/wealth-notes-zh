    # 新入职公司领导就让我当负责人，求教花爷给些建议


    **提问：**


    花爷你好，我是7月份在现在的公司入职的，任电商部门的主管。还负责公司淘宝店铺运营，取得了一点小成绩。


    公司主体是皮具加工厂，生产和销售在一起感觉很乱。所以这个月老板在另外一个地方租了一间办公室，已经在装修了。准备成立一个独立的电商公司。之前我部门总共才四个人，现在新地方老板准备再招三个运营，四五个客服，还有运营助理美工这些。让我当负责人，感觉自己没有这个能力，德不配位。一想到要对新地方的盈亏负责，就慌的不行。但是又不想放过这个机会，请问花爷我该怎么办。


    **回答：**


    **六个字：不要怂，就是干！**


    退一步想，虽然负责人要为盈亏负责，但实际上你拿什么负责？真的亏了钱，会让你赔吗？


    不会，最差最差的结果，你做得实在太糟了，从负责人的位子上被撤下来了，仅此而已。


    你看，你最大的损失，也不过回到升职之前的岗位而已，你还有什么可失去的？有什么好顾及的？


    进一步想，这个世界上，有人真的准备好了吗？有公司真的准备好了吗？


    没有，商业世界瞬息万变，没有人真的准备好，或者说，当有的人磨磨唧唧终于准备好的时候，位置早被那些勇敢往前冲的人占住了。


    这个时候就是看人胆色的时候了，你没有什么好失去的，鼓足气上去干，边干边学习，哪怕成绩一般，也是一段历练，别人求都求不来这种机会。


    最后，花爷提醒你的一条职场锦囊：


    你是公司提拔上去做负责人的，公司本身需要为这个决定负责，所以从公司角度来说，他们是站在你这边的，你在努力把业务做好的同时，需要让公司看到，你也站在公司这边，和领导是一条心的。


    怎么体现出你和公司一条心呢？


    任何计划、进度，积极和领导沟通，不要怕麻烦，宁可多确认一次，不要自作主张。特别是前期，你能力不够，一定会遇到很多事情犹豫不决，这时候不要多想，直接请示领导，让领导做决定。


    做管理者，前期要学会先做好领导的**代言人**和执行人，后期再察言观色、积累经验，成为一个合格的领导。


    你按照这条铁律去做，哪怕业务做得一般，但前期决策都是领导做的，你不用担责任。相反，领导会觉得你执行的不错，很靠谱，后面别的项目，一定还会用你。


