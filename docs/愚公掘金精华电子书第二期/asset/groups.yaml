    ## 知识星球的活跃度不高，会员也不怎么响应星球活动该怎么办？


    **提问：**


    朋友做了个星球，一段时间后上千人加入了，但是整体的积极性不高。发起问题讨论，基本没人讨论；推送资源，点赞也就几个人；线下交流会，大家响应度不高。尽管用户精准，但是不知道如何调动用户积极性，如何让更多的人参与到讨论之中，想请教花爷支招。


    **回答：**


    我自己星球一千六百多人，后台数据每天有超过一千人访问，跟几个星主交流了下，感觉我这个活跃度还是算很高的。


    当初我运营星球之前，也看了很多老星球的运营方法。我发现大部分发帖量高的星球，都是打卡、交作业为主，我自己看多了其实觉得蛮无趣的，我花钱看星球本来就是来看精华内容的，从很多帖子里找有价值的信息，反而增加了我的负担。


    所以我自己运营星球，就以自己输出为主，邀请嘉宾分享为辅，至于大家发帖、评论，没有太刻意的去引导，但只要有花友发帖我基本都会回。


    凭良心说，我回答的问题、发的一些内容、包括嘉宾分享的内容质量，还是比较高的，所以我也不担心，只要有质量，数量少点也没事，没必要搞虚假繁荣。特别是有花友一周只看一两次，每次打开如果都有几百条未读帖子，真的压力山大。


    当然，这是我的运营风格，不是说那些打卡、交作业的星球不好，因为打卡、交作业本身就是那些星球的价值之一，人家参与的很带劲，只不过我不是目标用户罢了，也没必要硬去学别人，学一个四不像出来。


    所以你不妨问问你的朋友，活跃度真的是星球的最关键指标吗？通过星球，你给付费用户提供的最大价值到底是什么？


    价值的事情不想清楚，用再多的运营方法，无非是东一榔头西一棒子，把自己给敲散了。


