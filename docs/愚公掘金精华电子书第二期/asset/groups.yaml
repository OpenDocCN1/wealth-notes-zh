    ## 目前做python的自动化测试，数学和编程的底子一般可以考虑转入机器学习么？


    **提问：**


    从传统行业转向互联网大概有两年多时间，当初学的python网站后端开发不过没找到对应工作就干了自动化测试方面的。后面见机器学习很火热一时冲动就报了一个线上课程但是后来听自己大学一个从事过这种工作同学讲本科生过去连面试机会都没有。请问花爷觉得像我这种数学底子一般、编程能力也不强悍的可以考虑机器学习吗？


    **回答：**


    你同学说的基本属实，实打实的机器学习岗位很看重学历，好岗位没个清北或者留美经验连个面试都拿不到。


    为啥这么吃学历呢？因为机器学习这个工作你不是在最顶尖的学校、公司学过做过，确实学不到核心知识。这就好比踢足球，你想参加世界杯，在地区内顶尖的联赛里踢过球这是基本条件，野路子和参加个课外培训是没有机会的。


    线上课程学的内容，很多都是打着机器学习的名头，其实学的非常基础，真去面试机器学习机会不大，退而求其次面一面准备一下算法、数据工程师之类的岗位可以考虑，薪资比测试要高。


