    ## 怎么高效的读书？


    **提问：**


    花爷，提问应该怎么高效的读一本书，读书老是忘怎么破，有必要做读书笔记嘛


    **回答：**


    读书容易忘是正常的，应该的，你又不是计算机，脑子再厉害能记住几本书？


    读书的收获主要有两部分：


    - 看书的过程中，产生深刻的感悟


    很不幸，大部分书其实都达不到这个效果，一本书能有一段内容让人有所感悟，就算是一本好书了，而且这种感悟往往没过多久就淡忘了。


    - 收集知识点，以后备用


    这点想做到很容易，再烂的书，也有知识点以后用得着，比如一些数据、案例、金句等等。


    怎么个读法可以最大化这两个收获呢？


    第一，一定要学会速读，一个字一个字的看书是小孩子的看法。


    速读就是要一目十行，帮你快速筛选内容梗概，如果是好书，再精读不吃，如果是一般的书，速读能省大把的时间，而且不耽误收集知识点。


    第二，做划线笔记，把知识点挑出来，以后备用。


    我喜欢读电子书，划线做笔记方便。之后做事、写文章，想找某方面的数据、案例，直接翻划线笔记就行。


    这两点结合，可以大幅提高阅读效率，收集的大量知识点，就像一张知识地图，以后需要，直接索引就能使用，不需要脑子记。


    关于读书的问题，之前也答过，可以再看看吧 答案做个参考：https://t.zsxq.com/l66m2Fm


