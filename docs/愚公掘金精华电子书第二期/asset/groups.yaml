    ## 38 快速写作

    *Write quickly*


    人很贱，需要逼的。


    Deadline是第一生产力。


    想想你大学期末考试前一天复习的效率吧。


    写东西时，设置倒计时，一般最长30分钟。


    会逼迫你放弃完美主义，会逼迫你先快速写下框架，没空再查资料会逼迫你快速调用脑子里有的东西。


    多来几次，会越写越快，不看资料就能想起的东西越来越多，慢慢形成自己的写作套路。


    在重要渠道发的内容，是要多次修改，再发出的。


    但是每一个版本的文章写作，不管篇幅大小，都要快、快、快！


    参考文章：「快」是提升行动力的唯一方法


    ## 39 快速打字

    *Type fast*


    不要让硬件和环境，拖了后腿


    统一在一个环境、一种设备上，完成一类内容的写作。不要把时间浪费在来回切换上。


    举例：


    - 地铁上，只用手机自带的备忘录，记录碎片灵感，摘录朋友圈、公众号文章、各种能带来启发的评论。

    - 咖啡厅里，只用蓝牙键盘+手机，记录长一点、有自己的思考和总结，措辞不够严谨的内容，发布在知识星球里。

    - 家里/办公室里，只用电脑+印象笔记/石墨文档，整合碎片内容，到一个地方，形成初步的框架。正式写长文章时，断网、隔音、关手机。


    另外，自己高频使用的词汇，建立关键词库、和标准化的解释。我比较懒，就用一个excel。


    比如：OneBiz、单干、一人公司、滚雪球、迭代、算法、查理芒格。。.


    ## 40 每天写Todo list

    *Write a todo list*


    老板们日理万机，时间、注意力、精力早就被打造成碎片和粉尘了。


    要是不为复业相关的事情单独列个list，多半3个月都不会有半点进展。每天早上列一个list。


    刚开始时，每天就写1个事情，也可以。不要写太多又完不成，打击到自己的热情。


    比如：今天我要完成的事情是


    “扫完《XXXXXXX》这本书，抽20个复业方向的关键词，放在石墨文档，分享到OneBiz微信群/知识星球里”


    ## 41 记录下顿悟时刻

    *Make a note*


    Aha moment、顿悟时刻，每个人都会有。


    比如：自己拧巴了很久的一件事情，高手一句话，就点醒了你。


    这种时刻，是大脑思考回路发生改变的时候。遇到这样的情况，要赶紧趁热记录下来，以后才有机会加强，认知才会提升。


    不要懒，不要想“我一会儿再写”。


    顿悟从产生到遗忘的时间，大概是30秒。


    顿悟如樱花，说没就没了。


    ## 42 启发

    *Come up with an idea*


    人只有在放松的时候，才能有创造性、突破性的想法


    和大脑工作原理有关。塞满东西、一直在运转大脑，只能按照思维定势去运作，没办法解决复杂的新问题。


    从这个角度看，996和007是有害的。


    过去，这个害处被增长红利掩盖。


    未来10年，问题都是不确定性的、需要创新才能带来增长的。没法让脑子闲下来的人，注定会吃亏。


    容易催生大脑产生启发的4B场所：

    - Bathroom浴室

    - Bus公共交通

    - Bar酒吧

    - Bedroom卧室


    在这些地方有了想法，记下来。


    不方便写，就说，用APP讯飞语音，只要是4分钟以内都不要钱。或者苹果手机自带语音输入法，也OK。


    ## 43 放松放空

    *Relax*


    刻意发呆，反而能激发大脑活性


    为什么好的创意公司，要在公司里，给员工设置冥想、放松的工作区？


    为什么Google允许员工有10%的摸鱼时间？


    ## 44 捕捉创意的四个步骤

    （1）围绕一个明确的问题，集中时间输入

    比如：抽早上45分钟时间，关注“适合单干的小而美的生意点子”，密集的翻多本书、翻公众号、翻知识星球。不做判断，简单记录，先把信息硬塞到脑子里


    （2）孵化

    放松、放空。

    比如：散步着去上班、躺下听轻音乐、看休闲小说、出去运动。

    让大脑在后台无意识处理信息。


    （3）突然产生顿悟

    Aha时刻出现！赶紧记录下来。


    （4）输出＋验证

    方式不局限于写作，分享出去，影响到别人，通过外界的反馈来验证自己的顿悟有没有道理、价值有多大。


    ## 45 写卡片

    *Fill out a card*


    围绕一个主题，写100枚卡片/便利贴。


    求数量，不求质量。


    这是创意行业的重要方法论，用来先发散、再收敛创意。（比如：H MW方法）


    以后再单独展开说。


    ## 46 写“逻辑线”笔记


    主要适用于书、讲座。


    书写片段可以零散，但是要用一条逻辑线串起来。


    实在想不出逻辑线，就调用成熟的思考框架，来组织内容。


    参考：《解决问题的商业框架图鉴》


    ## 47 信息聚类

    *Group ideas together*

    *From analog to digital*


    待详细展开。


    ## 50 引用

    *Quote*


    在写作里疯狂引用模仿对象、行业大咖、顶级专家的话，通过反复使用，把专家的思想和智慧，敲到自己的脑子里。


    ## 52 练习精炼总结

    *Summarize*


    能用在5分钟以内，用140字总结精华，是思考能力提升的表现


    最好的发布平台：知识星球、朋友圈、微博。我个人偏好知识星球


    ## 53 写出目标

    *Set a goal*


    没目标，行动很快就会没方向。


    不具体，目标就是废的


    不写下来，多半干着干着就会忘的一干二净。


    什么叫具体？举例：


    不具体 — 我要养成写作的习惯


    具体 — 我要在21天内，养成“每天都能在知识星球发布1篇140字上下、书写时间不超过10分钟”的帖子


    目标太简单，没意义。


    目标太难，容易失败打击自信。


    最好在舒适区以外，能力圈内，马上就要超出能力圈的临界点最好。


    ## 54 实现目标

    *Achive a goal*


    三个要点：

    - 每日回顾之前写下的目标，看目标vs进展，有差距赶快调整方法、找人求助

    - 立flag：把自己的目标公示出去，给自己制造点外部压力

    - 主动寻求反馈 —— 以后再说。感兴趣自己研究，关键词“前馈”“反馈”，参考微信读书《自我教练：迈向自我实现之路》


    ## 59 解决问题

    *Solve a problem*


    输入和输出的黄金比例是3比7


    通过输出，解决自己的问题、解决身边人的问题、解决客户的问题。


    具体到中国的环境来说，大家不缺输入。移动互联网这么发达，不管愿不愿意，每个人每天都在被迫输入大量信息。输出比例根本不够。


    刚开始多把关注点放在：以解决问题为目标的输出上。找自己和别人的问题，输出，解决它！


