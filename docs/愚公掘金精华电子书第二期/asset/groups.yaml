    ## 今年双十一花爷看到的几个趋势


    前几天双十一，两头忙，今天抽空，说说花爷看到的双十一体现的几个趋势：


    1. 先吐个槽，网上流传的阿里双十一造假的事儿，但凡毫不犹豫信了的人，有一个算一个，在商业知识里基本属于文盲级别。

    2. 我在去年底的文章里就写到，经济越不好，口红效应越明显。今年果然来了。


    2018年天猫双十一预售额前三的品牌是苹果、小米、海尔。


    2019年前三全部易主，分别是雅诗兰黛、兰蔻和欧莱雅。


    口红效应，最初是指廉价的奢侈品，能给予人一种满足感。


    特别是经济飞速发展之后，人们习惯了经济向上的惯性，面对突然的经济受挫，人们需要廉价奢侈品，它们是大牌，但它们单价不高，人们需要廉价奢侈品来满足自己继续追求向上流动的幻觉。


    不过在花爷看来，口红效应在新时代，又有了另一重含义。


    口红效应不再拘泥于口红，也不再拘泥于美妆产品。


    越具有囤积价值的消费品，越符合新时代口红效应的定义。


    最典型的例子就是茅台，当Costco和拼多多把去年两千多的茅台，压到1499的时候，疯狂抢购茅台的人，和买很多只口红的女生，在购买决策上其实产生了共鸣。


    买茅台的人：请客吃饭可以留着喝，有面子，这次价格低，囤着就算喝不了，也可以出手卖掉，说不定放家里还能升值。


    买口红的人：以后总要用的，不同的色号用在不同的场合，这次价格低，囤着就算买来不喜欢，也可以卖掉，或者送给朋友。


    面子、低价、囤积价值，是口红效应时代新宠儿的特征。


    特别是囤积价值，会是最近几年经济不好的情况下，推动购买决策的一股巨大推力。


    这对卖货的花友特别重要。


    你真的觉得茅台卖1499，是Costco和拼多多大发善心吗？


    茅台从明天开始就要加产量，它们只是以渠道特价的名头，尝试着把高端用酒，变成人人可囤的消费品而已。


    茅台的高层真的厉害，活该股票一直涨。


    3. 拼多多今年从第一季度飙到年底，一路狂奔，GMV已经超过京东，这次双十一的百亿补贴声量也特别大。


    但花爷说过，市场兴奋的时候你要冷静，市场失落的时候你要盯紧。


    当初很多人骂拼多多，我在星球里看好它，现在越来越多人看好拼多多，我反而看到一些小问题。


    拼多多作为平台型电商，按理说GMV超过京东这种自营型电商的话，市值应该比京东高20%以上最少，但现在两者市值差不多，说明资本市场也对拼多多有顾虑。


    核心就是拼多多靠补贴获取的中产用户，补贴断了之后还能留住吗？


    从目前来看，能留住一部分，但留住的也完全是低价的购买力，冲击中高端还没看到太大希望。


    不过这些问题只是当下的问题，人们总是夸大当前的问题和业绩，忽略长期的意义。长期我还是看好拼多多。


    微信封杀各种分享链接之后，拼多多用口令的方式做传播，基本没有受什么影响，这点跟淘宝口令非常像。这说明拼多多正在切中大众消费的需求，做生意，切中需求永远比搞概念更重要。


    不像京东，口号喊多快好省，结果还把口号改成了多快好爽——怎么还不明白呢，省了钱消费者才爽啊！


    历史经验告诉我们，第一名和第二名竞争，倒霉的往往是第三名。现在就看谁坐稳第二名了。


    4. 双十一还有个重要的信号，格力开始降价狙击美的了。


    格力和美的小故事，之前说过了（复习入口：https://t.zsxq.com/QnIAYZv），格力虽然牌子响，但比业绩美的才是真正的空调老大，靠的就是价格便宜。


    现在格力狙击美的，是一个重要的信号。


    在讲行业的四个发展阶段里（复习入口：https://t.zsxq.com/A2r3vVf），我们分成了红利期、寡头期、争霸期和稳定期四个阶段。


    现在空调市场明显已经进入了稳定期，品牌割据的局势非常明显。


    但重点来了，当整个行业还在飞速发展的时候，稳定期的各大品牌会比较和平，你吃肉，我喝汤，大家谁也不理谁。过去几年A股某个行业兴起，基本行业内的前几名都跟着一起涨，就是这个道理。


    但当行业到顶，发展停滞的时候，稳定期的各大品牌就要开始内部绞杀了。


    手机行业，华为冲击了苹果的4-5000元市场，苹果主动涨价，给自己一个更舒适的价格区间；空调行业，现在格力要冲击低价市场，抢同行的饭吃了。


    只有增量市场才有文明，存量市场里只有厮杀。


    5. 最后讲讲最火的淘宝直播和李佳琦。


    今年双十一淘宝直播贡献了200亿，近10%的比例，没瞎都看得出来直播是未来的趋势。


    那淘宝直播的本质到底是什么呢？


    是主播带货能力强吗？


    不是的，是主播携粉丝以令品牌，是不收房租、移动的在线“沃尔玛”。


    请注意以下几点现象：


    - 李佳琦和薇娅选品，不是全网最低价就不要。

    - 但凡你看一次李佳琦和薇娅的直播，你就知道固定的套路如下：市场价是xxx，现在，打折，再拿优惠券，再送大礼包A，前x名再送大礼包B——你看你也冲动。

    - 李湘直播卖皮草，一件没卖出去。

    - 王祖蓝直播卖干粉，只卖了66盒。


    什么粉丝，什么明星都不好使，直播带货的公式就是：品牌+价格打到骨折。


    品牌算上推广费、算上主播分成，真的赚不了多少钱，就是铺市场、打品牌、清库存。


    跟沃尔玛何其相似？李佳琦就像个移动的沃尔玛货架，每天有成百上千万人来李佳琦牌超市，李佳琦借此向品牌方收取货架陈列费。


    但去沃尔玛的人，真的是沃尔玛的铁粉吗？不是，大部分人只是想要沃尔玛里便宜的商品。


    到最后，只有品牌产品和垃圾（指劣质产品/营销过度产品）最受直播市场的欢迎。


    因为品牌产品有打折的价格空间，垃圾包装成高大上的产品，也有打折的空间——而性价比高到没办法打折的产品，除非亏本，否则根本无法在直播市场生存。


    顺便再说一句，既然垃圾会占据一部分直播市场，那直播行业就有被整顿的风险，到时候不整最厉害的，就整声音最大的。


    李佳琦同学啊，千万要小心，别在热搜跟人撕逼了。


    说随便说点，也两千多字了，写的比较杂，能引发花友们多少思考，看缘分吧。


