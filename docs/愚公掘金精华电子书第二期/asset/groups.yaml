    # 在这个暴跌的过程中有一个机会【股指期货】


    作为读者，我觉得说到这里，你也许有点摸不着头脑，因为这些机会似乎对你的意义不大，我最后会说，这里面的共性，听不懂的术语没关系，关键是思路。


    股指期货有个术语叫做升水和贴水，大概意思和封闭式基金的折价溢价是差不多的。当时的股指期货由于悲观情绪蔓延，贴水200-300点，这个就相当于你如果做多股指期货的话，现货要多跌200-300点才会让你到交割日那天实际产生亏损。


    97

    公众号懒人找资源'
  - '[PAGE 103]


    这也意味着如果你在当时2015年的8月做多股指期货的话你的成本就比大多数人要少200-300点。但是在最极端的几天，我已经忘记是具体几号了，几乎所有没有停牌的公司全部跌停。
    而停牌的公司也基本上是为了停牌而故意制造一个什么消息而申请停牌的。


    我当时是根本不敢打开我的账户去看的，因为我知道我和所有人一样沦陷整个账户跌停，那个时候我在读大学， 其实我也是和大部分人一样的，逃避去看自己的账户，但是周末回到家的时候，
    我的父亲就和我说，他准备做多股指期货。当然期货是有杠杆的，他可以不用杠杆做股指期货，就是在银行里放入等量的现金不存在爆仓的风险。


    杠杆， 就相当于你借钱去买股票。'
  - '[PAGE 104]


    曾今我在书里看到衡量一个投资者是否够格去主动管理一个基金的特质就是，他能不能在市场最恐慌的时候加仓，甚至是在这个时候下重注。

    所谓主动管理就是说没有预先设定的配置限制，完全通过这个人或者团队的研究结论来配置调整各个资产的比例，这个就算是主动管理基金。

    按照这种标准大部分人都是不够格的，包括在那个时候的我。


    大家都好像看到海啸来了，但是不知所措，都希望灾难快点过去，哪有时间想这个灾难会不会是机会，能做些什么？那个时候的我也是属于不够格的这类的。大部分的所谓炒股其实都是属于主动管理的，因为都是更具自己的判断作出买入卖出的决定的，事先都没有计划。也真因为如此，大多数人都亏钱。


    结果第二天就是全线涨停。'
  - '[PAGE 105]


    说到这里停一下，这个和今年年后第一天的暴跌，和后来的迅速反弹非常像非常像，人真的很奇怪，这一个涨停你昨天的恐惧立马就没有了。


    我父亲经常和我开玩笑说，期货公司的经理一定吓傻了， 曾经哪个经理告诉他大部分他手下的客户账户都是亏损的，就他的账户一枝独秀。更令人难以相信的是这个期货赚了几千万的客户居然还清仓跑了。
    一般人玩期货就像赌博一样，赚了钱哪可能收手。 其实那个客户经理不知道我父亲是放了好多现金在银行里准备着把期货当现货在做的，同时也是看中期货贴水严重这次机会才会大举参与。现在他的账户因为长时间没有钱早已经冻结了。'
  - '[PAGE 106]


    暴跌后来我们经历了15年的融资融券，场外配资爆仓，P2P暴雷，股权质押爆仓，商誉减值，退市，贸易战，猪肉，这些。然后，在最近4年的也算是大熊市吧，这个过程当中活下来，基本依靠着中国最具代表性的一些商业（蓝筹股），比如中国的保险业，家电业，还有贵州茅台。'
  - '[PAGE 107]


    先说保险业，在2016年17年的时候基本上已经跌破了保单价值。保单价值是保险业的估值方法。即把所有现在未兑付的保单去掉赔付去掉每年的贴现算到今天的价值,这个价值也是衡量保险公司手上实际能够动用的投资款的一种方式。跌破很厉害意味着保险公司严重低估。就单单凭着个就足矣是个很好的配置理由。再加上保险受市场影响比较厉害，保险公司的主要盈利方式是靠受伤的保费收入去投资，现代保险公司，投资是主要利润来源，而不是卖保险的赔付差，因此市场不好的时候会被过度低估。结果果然2017年的时候中国平安以大家无法想象的速度一下子翻倍。其他保险股也有类似的涨幅。


    家电：如果我问你中国在全球最大的竞争力是什么？其实你很容易就会发现，是制造业，即使是今天仍然是如此。那些说制造业不行的文章和观点，只是说中国的制造业不如以前好了，并不是说中国制造业死了。这完全是两回事。'
  - '[PAGE 108]


    另一个理解：就投资这件事，谁说只有风头上的热点才能赚钱的？恰恰相反，哪个技术越是热，作为普通人你越不可能赚到钱。甚至你越容易输钱。上周回国了几天，发现上海中心地段有不少电动车品牌在投放广告和直营店。打个车也有各种品牌的插电式电动车。可以说这种事情你很难赚到钱。就好比曾经美国有上百家飞机制造公司，现在呢？好像我们最熟的只有一家波音公司。可以说不用多久大部分品牌和公司都会死掉。


    说回家电，其实这级别的制造才是中国规模能力最强，技术上最成熟，并且事实上头部企业每年增长率远远超过10%的行业。格力、美的这两个加起来万亿市值的公司每年能够以20%的净利润增长，你想想这是多么厉害的事情。但是很少有人把它放在眼里。同样思路的还有去年的三一重工。工程机械严重低估。插一句，上面的故事，贾跃亭的乐视是最好的例子。'
  - '[PAGE 109]


    # 最后，茅台


    这个是被动配置的。原因只是⽆为当时茅台有坏消息价格偏低，那个时候正好需要买⼊A股，茅台价格出现明显下跌。


    所以分析是马后炮的：茅台是中国内需的代表。


    ⽤制造业快速积累的财富在社会顶端的人当中积聚。这些财富让⼤部分⼈从⾯都吃不饱什么都买不起，到今天突然有了⼀份饿不死的自由，哪怕⼯资并不⾼。这时候是个人都想要挥霍⼀下这种自由。⼀切曾经觉得不是自己的世界的东西突然⼀个分期就近在咫尺。西⽅的奢侈品是神秘的，⼀个个家族企业的故事。中国没有真正意义的家族企业，但中国的故事更有意思，因为茅台曾经是现在也依然中国官⽅的酒。突然⼀个分期就能买到，因此茅台就成了这种剁⼿的对象。'
  - '[PAGE 110]


    总结一下：


    中国的股票市场非常的难做，因为长时间都在熊市，而且你肉搏必被割韭菜。


    但是仍然要参与的原因：


    +   1、应对通胀国际上看比房产更好；


    +   2、中国股市有一定的诱饵


    是怎么成功的：


    +   1、对付漫长的熊市采取低风险策略；


    +   2、寻找打折的资产；


    +   3、寻找长期存在的诱饵，不管诱饵多少抓住再说；'
  - '[PAGE 111]


    4、长期保持关注且持有一定的资产量，无论你

    觉得之后是这么样的都用持有的方式保持关注，

    因为不持有很难有真正的关注；


