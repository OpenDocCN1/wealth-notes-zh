    但问题是，小李没有杀人放火，他只是被起诉敲诈勒索，刚被抓时上交了自己的录音笔，从头到尾都没有任何证据，为什么还要被羁押251天？


    更可怕的是，小李在这样的情况下被羁押251天，还是合法的。


    在这个过程中，华为有没有利用规则对警方施加压力？我不知道，但我知道，这项规则本身对小李就是不公平的。


    如果你感兴趣，不妨搜索下新闻，你能查到不少取保候审不成功，被羁押几百天后释放的案例。


    +   5.'
