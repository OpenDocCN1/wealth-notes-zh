    ### “金花奖”挑战：莆田鞋在微信的投放引流模式拆解


    #### 挑战提问


    花爷好，今天在微信看文章，末尾发现了最近挺火的鞋子广告，点进去看了一下，是做莆田球鞋的，上面让扫码加微信，我大概拆解下这个流程：


    1. 先是找到微信的渠道投放，做精准投放的广告，吸引用户点击进去

    2. 通过一个宣传页，让用户产生好奇心和购买欲，然后导流到自己的私人微信

    3. 最后通过微信的朋友圈展示自己的鞋子，或者聊天的方式带货，也可以发展代理拓宽销量


    ![](img/62659df0b3729b5d99b589094fb4b8b0_788_0.png)


    ## 花爷回答


    没错，其实就是以前微商单页广告引流的路子。最早这种广告最喜欢买百度搜索的关键词广告，精准，后来广告价格被越炒越高，一个点击上百块，微商也吃不消了，开始转战其他平台。


    目前莆田鞋的引流广告，最火的投放平台就是微博，微信现在也开始有了，但我估计微信审核机制比较严，过阵子会被打压，还是微博这类广告最多（底线低啊……）。


    前阵子我在微博看到莆田鞋的广告之后，研究了一下，加了至少20个在微博做莆田鞋的人。当时准备写篇文章发公众号的，后来没空写，今天在星球大概讲一讲好了。


    我加的这帮做莆田鞋广告的，一般为两类：


    1. 一手档口货源


    市场一大，就需要多个销售层级，一层一层的把市场打穿。这类工作室，属于在莆田有一手货源的，一方面拿价比较低，另一方面，他们不光要卖货，还要发展代理把大量的档口货卖出去，所以愿意负担高昂的微博广告费做引流。


    2. 工作室、自带工厂流水线


    这种属于少数里的少数，自带工厂流水线，不走量，就是看准什么款火，然后买正品打样，一般除了鞋还有各种大牌潮牌，要磨一个月以上才能上架销售。


    等上架了，基本都是秒杀，500-1000的单价（这还是仿货），几百上千件十分钟内售罄。


    这种不仅需要有工厂支持，对运营要求也特别高，需要不断的晒工厂、打样、发货的过程，用户量和信任度积累到一定程度了，才能出现这种卖一款爆一款的情况。不能光看吃肉，不看人家吃苦。


    而平常我们大多数接触的莆田鞋，其实属于第三类，也就是一手货源下面的代理，其实自己没货，就是负责发圈宣传，有订单了找上级发货。


    其实这波莆田鞋热潮，得感谢之前炒鞋的那帮人。炒鞋炒了半天，要压资金，要控市场量，还不一定能赚钱，结果莆田鞋顺带着销量大好，原来市场价1000的鞋，被炒鞋的炒到3000，高仿的莆田鞋顺势涨价到六七百也有人愿意买了，坐收渔翁之利。


