    # 想要做微商的话，该如何选品和跟对代理呢？


    **提问：**


    之前看过花爷写过一篇做微商不丢人的文章，最近也在考虑，请教下花爷如果想要做微商的话，该如何选品和跟对代理呢？


    **回答：**


    我把你的问题转换一下：微商有哪几种类型？哪种类型适合我？每种类型需要什么样的能力？


    ## 1. 代购资源型


    这类微商，其实就是在微信里做生意而已。他们可能是代购、可能是有资源的上游经销商、甚至可能是卖盗版鞋的，总之他们的产品相比市面上会更有优势，而且大多数时候是价格优势。


    如果你对这类微商感兴趣，需要考察上级的：


    - 货源优势

    - 卖货能力强，能给别人种草，能转化带货，并且愿意培养你这方面的能力


    ## 2. 科普专家型


    典型的就是我之前在星球提过的营养师科学减肥（https://t.zsxq.com/q7eAEiq），通过专业的形象，提供“减肥饮食+减肥服务”。


    这类模式在减肥、母婴、美容、养生等领域比较多，而且往往客单价更高。我经常推荐个人如果有能力，就去做这个模式，因为服务的人不用太多也能获得不错的收益，适合个人初步发展。


    如果你对这微商感兴趣，需要考察上级的：


    - 专业知识、背景（不管是不是真有料，至少得看上去很有料）

    - 向普通人讲解专业知识，并能让人信服、愿意付费购买服务的能力


    ## 3. 拉人头型


    简单来说，就是多级分销了。当然现在简单粗暴的拉人头微商已经不多了，大多都加上1和2中的元素，但本质上，很多微商的货源没有绝对优势、专业IP也不够强，内核还是多级分销的模式。


    说直白点，除了1、2中的模式，其他大多数微商，还是避免不了多级分销。


    如果你对这类微商感兴趣，直接考察对方的拉人头能力就行了。


    当然学习拉人头也有讲究，首先不要上来就花大价钱去做代理，要有个循序渐进的过程。其次，这类微商的盘子也是有周期的，一定是在每个盘子的早期加入才最赚钱，多观察几个盘子的完整运转，你就能琢磨出点苗头了。


