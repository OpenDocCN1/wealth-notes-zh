    ## 不仅要有好实力，也要懂得如何写个好简历


    提问：


    花爷，好。进入咱社群挺久了，今天来交流下。趁着有时间，最近重新做了下自己的简历，主要是梳理下自己的一些工作经历；想请花爷这边过过目给一些建议指导。自己走的路稍稍与众不同，毕业4年只求过一次职还是两年前，也是幸运第一份工作算是踏上了所谓的蓝海和公司一起成长，然而浪潮来也快去也快；但自己收获比较大的是闯进了一个未知的领域是自己喜欢的且坚定未来自己要做的方向；现在所在的公司也是在婉拒了几个老领导、同事的邀约和项目老板直接谈后选择的，还是在自己规划的领域内，目前工作问题也挺多还在摸索前进中。


    回答：


    给你几个建议：


    **1.最紧急的，如果你想在职场上再进一步，那你写简历的水平还得再往上拨一个档次，**

    你的简历最主要的两个问题是


    a.没有特点，看不出某一项能力特别突出。你是擅长引流？还是擅长留存转化？还是对整个项目都有非常完美的把控？


    目前的简历就是啥都行，但全面发展等于全面平庸。你想一想，招聘的场景是什么？公司管理层招聘时，最普遍的想法是我得找一个xx能力特别强的，所以你一定要把突出的能力在简历里表现出来。


    b.工作内容没有说服力，虽然列了很多工作经 历，但看不出来做得有多好。


    给你一个万能公式：在xx背景下，我们定了xx的高目标，遇到了xx困难，最后我通过xx努力，达到了目标，取到了xxxx的数据成绩。


    **2.你已经坐到主管级别了，如果职场上想往上升，简历里除了工作能力，应该要体现出你的管理能力了。**


    越大公司的老板，越清楚管理的学问和重要性，所以当老板想招管理层时，业务能力只能占六成，剩下四成还得看管理能力，甚至如果是招客服销售部门的管理层，管理能力的比重会更大。


    **3.跨境电商这个行业吧，虽然有一定互联网属性，但本质是商事行业，跟纯互联网公司相比，职场上的薪水、发展潜力，都是不如纯互联网公司的。**


    你已经坐到主管级别了，下一步要突破天花板，开始要自己着手做一些小项目了，跨境电商现在资金门槛挺高，多关注信息差带来的小生意机会吧，第一步不用追求做大，赚到非工资收入的第一块钱最重要。


