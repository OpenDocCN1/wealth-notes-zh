    # # “金花奖”挑战：信用卡推广短信的包装


    ## 挑战提问：


    小商机提问。


    去年开始经常会收到信用卡办理的短信，内容大致都是： **【XX银行】 温馨提醒， 您有1张额度最高XXXX元的信用卡白金卡， 有效期X天， 点击申请 [http://xx.cn/xxx](http://xx.cn/xxx)
    退订回T。**'
  - '[PAGE 747]


    因为之前发现很多银行都有推荐办卡的活动，部分银行奖励力度还蛮大的，所以怀疑是这个方向。


    思考了一下：


    +   1. 短地址链接跳转后明显带有类似推广id的参数。


    +   2. 身边的人收到这样的信息的不多，怀疑个人信息是从信用卡管理软件泄露的。


    +   3. 这个思路和支付宝红包码群发有相似之处，改进之处是预先筛选了目标人群。


    +   4. 伪装成官方短信博取信任。


    以上是个人的思考，期待花爷更详细的拆解，谢谢。


    742


    公众号懒人找资源'
  - '[PAGE 748]


    # 花爷回答：


    非常棒，忍不住要夸夸这位花友。


    第一，发现了信用卡推广短信这个线索，而且通过查看短链接跳转后的ID参数，察觉到这不是官方的推广，而是代理商的推广。


    这一点简直太棒了，顺便给各位花友科普一下，怎么判断短信里的推广链接是不是官方的，你用浏览器打开链接之后，复制链接出来，一般看到带“ID=xxxx”类似后缀的，都不是官方的。


    第二，举一反三，把信用卡短信类比了支付宝红包的案例。


    没错，这个案例的原理和支付宝红包是一样的，就是代理商利用官方的名义，博取信任，然后诱导你办卡获取佣金。'
  - '[PAGE 749]


    但是补充一点，这里的信用卡短信，和支付宝红包短信，还是有一些区别。


    支付宝红包推广短信，是个人以支付宝名义发的，支付宝官方是不支持这种行为的，因为本质上是在薅羊毛，支付宝后续也有采取措施打击。


    但信用卡推广短信，信用卡官方是支持的。


    为什么呢？


    因为官方发推广短信，政策上是有严格要求的，整个审批流程走下来，基本效果好的营销短信都不能发。


    所以官方就把推广的任务，交给各个代理商，让代理商去做推广，对于代理商假借官方的名义，也睁一只眼闭一只眼。一般来说，代理商邀请到一个新卡用户，能拿到100-150元佣金。'
  - '[PAGE 750]


    包括发短信的手机号，有的也是信用卡银行官方提供的，不是盗取泄露。而且你也不用太担心，银行给代理商提供号码的时候，一般是大批量提供号码和地区，没有个人信息。


    当然，在这当中必然也存在一些短信，连代理商也不是，直接就是骗子短信和链接，这就属于黑产的范围了。


