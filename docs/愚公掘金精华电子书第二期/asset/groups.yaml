    ## 实践出真知，跑通模式比做完整产品更重要


    今天一天都在外面吃饭了，而且特有意思，跟不同的人吃饭，感观差异巨大。


    中午跟帅张和一本黑的老师傅吃饭，聊的大多的是流量、自媒体、变现这些很实在的话题，边吃边聊侃了两个多小时，要不是晚上我还约了饭，还能接着聊。


    晚上呢，跟几个程序员朋友吃饭。这几位也算是资深程序员了，但跟他们对话真让我哭笑不得。


    这几位都感觉啊，程序员虽然收入不错，但上面领导就把你当个码农，工作没什么意思，年纪大了还可能被年轻人代替。


    有位程序员说了：还是当自己的老板最好。


    另一位附议：对，正好这些年也攒了些钱，可以投一点搞搞自己的事业。


    我也附议，有能力探索点副业是好事。


    一位程序员接着说：其实我早就想做一个学英语的App。


    我：为什么？


    程序员：因为市面上方法都是错的，有的告诉你只要大声朗读就能学好英语，有的告诉你只要听美剧就能学好英语，这些都不对。


    我：好吧，那什么方法学英语是对的？


    程序员：xxxxxxxx（一套乱七八糟的理论，根本没听懂）


    我：现在我是投资人，我给你一分钟，你能不能把我讲懂？


    程序员：我还没想过……我需要整理出一套方法论。


    我：如果你不能在一分钟内把我讲懂，你怎么把千万英语学习用户讲懂？


    程序员：因为市面上方法都是错的，只有我的是对的，你看xxxxxxx（又是一套乱七八糟的理论）


    我：……


    我：好吧，暂且不管是什么方法，你准备怎么让用户都知道这个方法？


    程序员（做IOS的）：我准备做个App，免费，吸取一波种子用户。


    我：App store有上百万个App，你怎么让用户下载你的App？


    程序员：……（显然没想到这个问题，愣了一会儿），我可以找公众号投放，你知道有个程序员的公众号吗？stormzhang，他投放一次几千块应该够了吧。


    我：大哥，帅张我下午刚见，你要能几千块买他的投放，帮我买一百条先！


    你看，这就是大部分人的问题。


    脑子里把整个商业闭环想得特别美好，连App里某个页面的文案这种细节都想好了，沉浸在没有实战支撑的幻想里。


    结果呢？做生意最基本的流量、投放、产品包装等等，一个都没考虑过。


    这几个程序员还算是高薪的，很多普通人的所谓创业计划就更别提了。


    花爷说过很多次了，个人想做点生意，一定要盯着某个小环节使劲儿，把一件事的获客、留存、变现、包装、人设做好做透。因为人的精力是有限的，你只有把所以的力气都使在一根针上，才有足够的压强可以穿透厚物。


    晚饭最后，程序员问我还有没有别的看法。


    我说，我现在给你建议你都不会听进去的，我建议你按照自己的想法去做，等你多失败几次，咱可以再聊一次。


