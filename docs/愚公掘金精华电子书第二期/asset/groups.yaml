    ## 微信做电商该如何利用微信的短视频？微信的流量又该如何利用？


    **提问：**


    您好花爷，最近看到有人成功开通微信视频号，关于微信短视频直播，想请花爷解答下


    - 腾讯一直想做电商，他会如何打通短视频直播电商之间的闭环呢？

    - 微信如此大的流量，届时对于大部分人(包括我们做电商的)来说机会有哪些呢？


    第一次在星球提问，有不精炼的望体谅哈。


    **回答：**


    先纠正一个误区，腾讯是以前想做电商，不是一直想做电商。腾讯做易迅网已经是10年前的事了，易迅彻底被放弃之后，腾讯整个公司战略都从快速模仿变成了战略投资。


    之前写过，阿里、腾讯、美团这几家巨头的生态和商业模式有着本质区别：https://t.zsxq.com/FQjIEEY


    腾讯现在投资过的、有电商属性的企业至少有20多家，包括但不限于：对标阿里的京东、拼多多；做垂直电商的唯品会、楚楚街；做商超的永辉、超级物种；做电商saas的微店、有赞；做生活消费的58、美团点评……


    腾讯的路子早就定了，有这么个矩阵，它不需要自己做个电商巨头出来。


    从腾讯的战略，再看微信的定位就是明摆着的了：我微信就做各项基础设施做好，维持好平台秩序，其他的活儿，让真正有竞争力的企业到我们微信生态来给大家提供服务。


    所以站在微信的角度来讲，它不会致力于打通什么短视频和电商的闭环，微信思考的内容是怎么把视频内容生态做好。


    至于视频内容怎么做电商变现，并不是个大问题，可以让用户通过视频关注公众号，可以让有赞之类saas服务商来做嫁接，等等等等，方法有很多种，就看微信怎么选择而已。


    对电商人来说，微信能提供的机会，主要就是三点：


    - 留存和复购，重中之重，能利用直播、微信群、朋友圈把留存复购做好，就成功了一大半了。

    - 用微信获客，目前主要还是靠社交裂变的力量。传统的淘宝电商人里，用户推荐购买的比例是很低的，但在微信里，推荐购买的比重甚至可能超过一半以上。

    - 未来可能出现的流量红利，比如视频号和直播，但这两点目前还没有特别明显的迹象，保持观望就好，不用太过心急，具体的分析看另一条帖子：https://lt.zsxq.com/mmy7MrF


    二月常驻小尾巴：星球已经提醒一些花友续费了，不要急着续，花爷确定会在三月初，为大家做一次主题分享，分享后会宣布续费折扣，确保老会员最低价格续费。已经手快原价续费的花友，届时也可以找小助手退差价，大家留意花爷的分享通知~


