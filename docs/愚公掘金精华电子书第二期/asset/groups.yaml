    ## 花友分享：把输入的信息，通过写作变成价值输出的 22 个技巧


    白一喵：


    前天入手的日文新书（见图），我把里面和“写作”相关的话题抽取出来，结合我的理解和实践，挑了一些我认为可能对大家最有帮助的要点，总结如下。


    有问题，评论区 / 微信群见。


    ### 31 写


    Write


    越写脑子越活


    大脑有 Reticular Activating System


    可以把 RAS 想象成脑壳里的一个搜索框


    每写一次，相当于点击一次脑壳里的搜索按钮


    写得越多，点击得越多，搜索得越多，大脑的潜能被激发的越多


    ### 32 手写


    Write by hand


    ### 和键盘输入相比，手写学习效果更好


    虽然键盘打字看起来快，但是动手写带来的记忆强度、绩效提升、刺激出好点子，效果更好。这个结论，有大脑核磁共振的研究结果支持。


    也是个“越想快，反而越慢”的例子。


    ### 33 记笔记


    Make notes


    记录下的每一条信息，反映的是自己的学习轨迹


    记录信息的行家，找群里的@正记录


    快速实践：翻看一本书，掐时间快速看，找出 3 个要点，记录下来。不要多，三个就好。不要纠结找的点价值有多大，选你在意的点就好。


    公众号懒人找资源


    参考：公众号@增长潘多拉，和快速阅读相关的话题


    ### 34 写出来


    Write out


    把脑子里窜来窜去的想法和信息，像拍快照一样，写出来


    好灵感、好想法是电光火石，错过了就再也找不回来了。


    写下来。乱也不要紧。只有自己看得懂也不要紧。


    总之，写写写。


    ### 35 乱涂乱画乱写


    Scribble


    能提升 30% 记忆效果的好方法


    和上一条结合在一起使用。


    在快速记录的时候，加入一些带有【情绪】的标记。比如表情符号、颜文字、段子、语气词、脏话、语气标点...


    感情越强烈，刺激记忆深度效果越好。


    我跟你说！！！⚠️ 这样！效果 TM 的超级🔥有没有！哈哈哈！！！(///▽///)


    还不快滚去写写写！！！


    ### 36 写出清单来


    Make a list


    大脑在同一时间段里，只能处理 3 条（坨）信息


    为什么作报告、展开论点、做演讲，一般就展开 3 点？就是和大脑特点有关。


    同理，整理桌面、电脑桌面、手机桌面，可以试试把东西分成 3 堆。更容易找。


    ### 37 写出好句子


    Write good sentences


    大量读，大量写，是避不开的路


    零零散散写了这么多碎片，总有一天要给别人看，求反馈吧？


    没有写作习惯的人，一来就要你写一篇大长文，压力很大吧？

