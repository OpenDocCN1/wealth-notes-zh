    ## 最近发现各地热衷于搞马拉松赛事，背后的原因是什么？是否有商业价值？


    **提问：**


    花爷，你好。最近发现各地都热衷于举办马拉松赛事，这种现象的背后原因是什么呢？马拉松赛事大火的背后是否也存在商机？


    **回答：**


    你不妨多想一层，一个需要占据大量道路、管控交通的马拉松赛事，怎么可能没有政府的支持呢？


    事实上，每个城市都有体育健康和精神文明建设的政治任务，政治需求正是马拉松赛事的基础动力之一。


    相比于其他类型的比赛，马拉松至少拥有以下四点得天独厚的优势：


    - 1. 洋气，跑步和马拉松是欧美非常流行的运动，国内城市有一项马拉松赛事，宣传起来非常有面子。

    - 2. 相比其他赛事，马拉松不用兴建场馆，不用对器械场地做维护，成本非常可控（其实专业的马拉松服务还是挺耗人力的，但我国马拉松在这方面一直比较拉胯）。

    - 3. 参与人多，覆盖面广，一经举办全程轰动，宣传效果极佳。不像你办个市足球比赛，不踢足球的老百姓根本不知道有这回事。

    - 4. 如果办成了区域内代表性的马拉松赛事，每年成千上万的外地人涌入参赛，带动旅游业发展非常可观，又是可以大力宣传的一笔。


    因为这些优势，国内很多马拉松赛事都是官方牵头的，门票和赞助收入也比较稳定，办的不错的城市都能实现盈利。


    但全国所有城市的马拉松都能赚钱吗？当然不是，小城市、西部内陆城市的马拉松就不一定盈利，但没关系，反正盈利也没放在第一位嘛。


