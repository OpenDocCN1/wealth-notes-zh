  - '[PAGE 314]


    想像下，你公司有100人，或者更多，你不可能拿自己的24小时去管100个人的24小时，大公司别说管理员工的时间了，连员工名字都记不过来。


    中小团队基本都是KPI导向的，老板要做的，就是制定每年、每季度、每月的KPI，把KPI分配到管理层，管理层再把KPI拆解到具体的个人和时间，最后老板和管理层各自盯着进度。


    如果个别员工、管理层多次无法完成KPI，可能是能力问题，可能是效率问题，重要么？不重要，重要的是他一直做不好本职工作，那他就可以离开这个岗位了。


    如果很多员工都完不成KPI，反过来，就轮到老 板反思了，你的KPI定的对么？你和管理层一起 讨论的计划、方法对么？'
