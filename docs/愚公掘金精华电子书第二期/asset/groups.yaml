    这中间还有一件事情让我印象很深，我有个同事，在湖南老家的商场，看到了我们生产的包，问了一下价格，标价498元，同事反复确认细节，确实是我们公司生产的。后来我们还根据地址，找到了这个商场老板的淘宝号。拋去其他不谈，我们公司的产品，能让这个老板有底气卖到这个价格，还是可以说明一些问题的。


    由此可见，各种卖货平台，都只是一种销售渠道，而产品，则是商业的根本，不管市场如何变化，市场对于好产品的需求几千年都没有改变。想要在淘宝立足，首先要死磕产品，一款好的产品，才能让你越走越顺。


    如何选择核心竞品，如果身边有大数据资源，可以根据搜索热度，需求度，商品属性这些来进行综合分析，选品，如果没有，则需要请专门的设计师或者买手来做这个事情。


    ### 2、宣传推广


    我采用的商品推广手段比较简单粗暴，刷单+直通车迅速拉爆，这其中有一个刷单资源安全性和直通车水平的问题，刷单资源不安全，会直接给你的链接带来毁灭性的打击。


    多年以来的刷单经验告诉我，贵的，就是好的。千万不要贪便宜，刷手和平台没有足够的利润支撑，刷单的安全性是得不到保障的，每次虚假交易大地震，被查的往往都是便宜的资源，或者是自己鱼塘放单的，而在大家都不敢轻举妄动的时候，如果你有稳定的优质的资源，就可以实现弯道超车。建议多储备一些优质资源。


    直通车最近两年更新频率特别频繁，要不断尝试和学习，直通车水平的高低，直接影响商品的ROI。


    ## 二、电商团队建设——解决客服离职率高的问题


    这样持续到了9月份，每天都维持在100多单左右的样子，但是有一个很不正常的现象，就是客服的离职率很高，2个月不到的时间，换了三个客服。因为之前没有管理经验，于是向花爷请教了一下办法。


    我之前只是想到用钱激励，比较直接，但是花爷说，就算把客服的工资，从3000提升到4000，用不了几个月，还是会不满意，不知足。花爷给我讲了几个概念。身份，奖惩，竞争，出口。（花爷牛b）


    ### 1、身份


    想象一下，职场如果是一款游戏，那客服的段位，最多只是这个游戏的新手村，如何让客服愿意更久的在新手村历练？


    设置不同的段位，让他们一直有一个看得到目标去努力。将客服分组，每组5人左右，设置小组长，如果总人数很多，每3个小组再建立一个 小团长，所有小组长、小团长从客服内部选拔，阶层分工明确。


    制度上一定要把楼梯一样的阶层搭建起来，人才有意识往上爬。


    ### 2、奖惩


    先说奖。电商客服的绩效一般与业绩直接挂钩，哪怕是售后客服，也有对应的数据标准。但奖励绩效，不在于多，而在于设置巧妙，至少需要有三种类型的奖励：


    第一，普惠奖，即大家努努力好好干，就能拿到的绩效。


    第二，头等奖，即做得最好的人才能拿的奖，一般得是个比较诱人的奖。多说一点，头等奖是实物的时候，往往效果更好，因为实物隔段时间换一次，新鲜感会带来额外动力，当然也允许折现。


    第三，竞争奖，这个在后面第三点再细说。


    特别强调，有奖，就一定要有惩。


    一定要给所有人设置底线指标，一次达不成指标，扣绩效，多次达不成指标，考虑劝退。在客服这个工种里，一定会出现不在乎奖励只想混日子的人，这种人要坚决清退，否则会影响团队氛围。你甚至可以直白的跟大家说，哪怕有一天离开，公司也希望
    你以一个优秀员工的身份离开，混日子磨洋工的，绝不姑息。


    ### 3、竞争


    竞争才能磨练出最好的团队。


    设置团队奖励，以团队为单位比拼业绩。同时你作为主管，要帮小团长、小组长们做好对客服的动员、培训，让大家在实战中去总结，拼出团队感来。


    团队间的竞争，靠的是一种仪式感、使命感。奖励是一部分，另一部分，一定要让大家明白，拼搏不仅是为公司，也是为了他们自己提升能力，以后有更好的发展。在竞争中表现优异的，成为后面小组长、小团长的备选人。


    如果你身边有做过市场销售工作的朋友，建议去取取经，销售们的动员经验都很丰富。


    ### 4、出口


    前面3招，都是让员工在新手村更努力的攀爬，但我们必须承认一点，没有人想做一辈子客服，新手村也是有终点的，这类需求是挡不住的。


    所以，也要给所有人准备一个终极出口：


    小组长、小团长中表现最好的，有机会直接转岗到公司最有发展潜力的部门，薪水和职业前景再上一个台阶。


    ### 5、具体实施


    根据花爷的这个大纲，我根据我们公司现有的情况，制订了如下制度。


    （1）售前售后客服每月轮岗，从轮换过程中，发现问题。从工作表现和数据中，挑选出优秀的人担任小组长。


    （2）售前客服最重要的指标是询单转化率，售后客服最重要的指标是问题的解决率和满意度，根据这两个指标，设立奖惩制度，第一名直接奖励巨额奖金（我都很羡慕...），指标低于行业平均的，进行相应的惩罚。


    在工作中，态度积极，工作能力强的，达到一定绩效，公司出钱进行培训，可以自由选择，运营岗，管理岗...


    8月底开始实行的制度，到现在，客服的离职率为0，商品的询单转化率稳定高于行业平均10%，好评率和DSR服务分直线上涨，纠纷退款率为0。（花爷牛b）


    这几个月让我对电商团队的建设，有了一些不一样的看法，在一个岗位，工作时间太久，人的激情被消磨殆尽，就像追女神要不断的制造惊喜，一个原理，用不同的工作内容，不同的挑战，丰富的奖励。去激发员工的工作热情。达到一定成绩，绩效，可以申请转岗，一岗多职，等等。


    ## 三、店铺投诉的处理经验


    7月中旬的某一天，我提着早餐开开心心的走到公司，正准备吃。客服突然对我说，“哥，完了，我们惹上事了。”我心里一惊，赶紧跑到他电脑前面去看。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_213_0.png)


    这个顾客申请仅退款，退款原因是假冒品牌。然后在留言和旺旺里，发了一堆东西，说什么要向法院起诉我，向工商局申请赔偿，等等一系列东西，甚是吓人，老板都被吸引过来了。客服说，我觉得有点麻烦，我打断他说，我不要你觉得，我要我觉得。。。我觉得一点事情都没有。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_214_0.png)


    这是最后的处理结果。


    相信很多朋友都会遇到这样的情况，店铺遭遇投诉，售后，恶意敲诈。这些人往往会把后果说的很严重，动不动就是法院，工商局，传票等等，大家千万不要慌，一慌就中了这些人的圈套。


    ### 1、一般申诉的处理


    大家首先要明白，随着生意越来越好，销量越来越高，遭遇的售后问题，只会越来越多。对于正常顾客的售后需求，我是以打不还手，骂不还口，有求必应为处理原则。在这个上面，与顾客斤斤计较，会耗费大量的精力。而提供优质的售后服务，能为店铺带来正面的影响。


    刚开始，售后客服总是每天问我同样的问题...


    客服：“哥，这个人包有线头，要赔10元。”


    我：“给”


    客服：“哥这个人有一个地方脏了，要15元清洗费“


    我：“给“


    客服：“哥，这个人包用了几天了，扣子掉了，想换个新的，行不行。”


    我；“好“


    哥，这个人分手了，要20块钱买糖安慰，不然就给差评。


    我：“给……，你等会？，别人分手了，给钱有什么用，你不是单身吗，正好“


    “哦，他也是男的啊，要不知男而上...，”


    咳咳，反正只要是我们的责任和问题，我一般会无条件的答应顾客的要求，这样能保证店铺良好的评分和纠纷率，对店铺有更加深远的意义。换言之，如果售后客服，每天都纠结于和顾客讨价还价那几块钱的赔偿，对于其心态，也会带来很大的影响。当然这是面对正常的顾客来说的。


    ### 2、如何处理恶意差评


    而对于上面提到的职业打假师，差评师。我的做法就是，不妥协，不给钱，不理会。


    许多刚开店的小白，可能不会判别职业打假师和普通顾客，当你多遇到几次，你就会发现打假师一般会有如下几个共性。


    - （1）拒绝电话沟通，打过去要不挂掉，要不就说一些恐吓的话，要不就说没时间。

    - （2）总是提起投诉，赔偿，这些关键词。

    - （3）不具体讨论商品问题，纠结于问你想怎么解决，态度嚣张。


    很多卖家因为怕出事，都是直接给钱，让投诉方撤诉，据我所知，职业打假师，一般都有讨论群，只要给了一次钱，后面的售假投诉会层出不穷。一定不能给钱。


    这些人会通过旺旺联系卖家，说一些后果很严重的惩罚，说要起诉，报工商局之类的，不要被吓到，没有那么严重，如果不知道怎么回复，一般就不要回。说多错多。


    这些人一般会申请仅退款，你就只需要回复一句“您好，您在本店购买的商品，如果不满意，可以申请退货退款哦，本店支持七天无理由退换货，请您将退款申请修改为退货退款”。然后就不用管，晾在那里，这些打假师比你更急，他精力有限，又压了货款在里面。


    在这个期间，他会疯狂在旺旺上恐吓你，不要理会。等到系统默认退款的前几个小时，拒绝退款，拒绝理由写“商品不满意麻烦您申请退货退款，我给您同意，谢谢。”然后打假师一般会申请淘宝小二介入，之后淘宝小二会判定退货退款，或者直接交易完成，投诉关闭。这种投诉按我的经验来说，只要按我的做法操作，99%都不会成立。


    ### 3、如何防范职业差评师


    各位卖家应该还有遇到过职业差评师。该人群一般以正处于快速增长期的商品链接为目标，收到货后，可能找你说商品有问题，一言不和先给你来一个500字带图差评。用词专业，基本上面面俱到的把你的商品说的一无是处。


    - （1）面对这种情况，先在旺旺上与其直接联系，尽量诱导其直接说出想要钱财的目的，以便后面申诉不合理评价。

    - （2）找差评处理机构处理，市面上有盗号删评价，屏蔽评价，折叠评价，一些处理方式，与其多花一些钱处理，都不能妥协给差评师一分钱。


    一些客单价比较高的卖家朋友，可能会遇到这样的情况，顾客向法院或者工商局起诉商品虚假宣传，要求十倍赔偿。我的处理经验是，不要怂，就是干。身边的朋友有直接认栽的，5倍、10倍的赔偿给这些人，让他们撤诉。导致钓鱼执法的更多。后面我让朋友直接请律师，去该消费者所在地，直接打官司，加反诉，费用其实没有想象得那么高，对店铺也基本没有影响。


    淘宝现在也开通了打假师，差评师的投诉入口，虽然意义不是很大，不过随着淘宝制度的完善，该类人群应该会越来越少。


    ### 4、顾客如何申诉维护自身权益


    对于我们顾客来说，如果真的遇到了比较黑的店铺，除了差评，还有以下几种方法维权，事实上淘宝对于消费者权益的保障比卖家的用心很多。


    - (1) 拨打淘宝热线0571-88158198，选择具体的维权类型，和小二沟通即可。

    - (2) 用手机淘宝，点开订单详情，在页面的中间会有一个订单信息，可以点击投诉商家，提交成功后，卖家的系统后台会出现这个投诉，逾期未解决，会对淘宝卖家有相应的处罚。


