    ## 分享：


    hello，大家好，晚上分享的是关于理财投资方面的知识，据我所知，咱们花友里是卧虎藏龙呀，如果你是老司机，那么分享后一起来闹一闹呗。


    如果你是小白，那听完假如不能使你马上实操起来的，请提问到能实操起来为止，一切不以实操为前提的投资知识，都是耍流氓。


    我选了三个，对于业余个人投资者来说，最适合的投资品，已经有花友猜到了哪三个了，第一个来讲可转债。


    ### 一、可转债


    #### 1、可转债是什么


    可转债这小玩意儿，它和银行定期存款是非常像的。


    银行定期存款，本质上就是我们把钱借给银行，到期后银行还给我们，并每年付给我们一定利率的利息，不知道大家有注意到一个细节没有，我们存钱用的储蓄卡，它原名叫借记卡。


    我们和银行是一种债主和债权人的关系，可转债的“债”，便是一样的原理，可转债的本质是我们把钱借给上市公司，到期后上市公司还给我们，并每年付给我们一定利率的利息，原理和银行定期存款一毛一样，但是，我们猜中了开头却没猜中结尾。


    这可转债可是披着“债”的皮，干着“股”的事，它有一招很骚的姿势，上市公司允许我们在一定的条件下换成他们家的股票，这可不得了了，鸡贼的我们一盘算，要是股票涨的红红的，我们就换成股票卖掉，直接盈利，要是股票不咋滴，最差的结果无非就是乖乖等到期收点利息呗。


    于是，铸成了可转债名声在外：下有保底，上不封顶，下有“债”性保底，上有“股”性不封顶，保本无风险。撸起袖子，买买买，但，那边上市公司也不是吃素的，这么好的条件，代偿就是到期利息少。


