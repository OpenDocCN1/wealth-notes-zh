  md: '

    这篇软文阅读量目前是 20W+，已经很久没涨过阅读了，总共就是发了这两个平台，我当时真没想过什么霸屏，全是意外。


    因为之前全民 K 歌非常火，我的软文正好是一篇干货，然后被很多网站转载了，搞笑的是什么呢？这些平台转载我的文章并没有把我的广告去掉。


    比如那个西西软件园，这个网站权重可谓是相当高了，他甚至排名比我自已发的知乎和搜狐的还要高。当然还有很多其它平台转载。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_805_0.png)


    所以就莫名其妙的霸屏了，真的是意外，正好那两年全民 K 歌也是火的不要不要的，每天公众号涨粉几百+。


    接下来就是玩套路了：“裂变”。


    我并没有打算先用一些免费资料把引流来的粉丝留住，而是直接玩裂变，这个好处就是直接帮我过滤掉一些伸手党，留下来的都是一些付费用户和愿意去做裂变的。


    裂变玩法很简单，就是转发文章到朋友圈积攒免费获取资料，要么就是付费 59.9 元购买。


    ![](img/62659df0b3729b5d99b589094fb4b8b0_806_0.png)


    当时这种文章我发了最少 10 多篇，因为公众号留言只能精选 200 条，放一些优质的留言出来效果会更好嘛。然后那时候公众号的粉丝真的是每天猛增的情况，然后我每天都要手动审核他们的截图给他们发资料。


    至于付费转化率，看下图：


    ### 图4


    这只是其中一个平台的数据，我为了数据好看，做了 5 个平台来收款（荔枝微课/千聊/略知/小鹅通/小程序商城还有直接微信付款的），哈哈。所以到后期，微信裂变+百度流量，我一直都没缺过新用户，这个效果一直
    到今天还没有停止，裂变我现在没做了，但是百度还是会有流量来，现在时不时还是会有几个人来付费，不过现在付费的方式没走平台了~


    除了这个资料，从图4可以看出，还有一个 128 元的，这个说来话长，我简单说下，这个是我当时研究的一个全民 K 歌自动群发私信的一个软件，因为大部分人想要涨粉嘛，而私信涨粉是真粉，不是僵尸粉，当时我没做公众号之前是在淘宝卖的，后来各种原因（你懂的）才转移到公众号。


    后来因为有模拟器的出现，正好模拟器带了这个功能，所以，最后我只是录了一个小教程教他们利用模拟器来实现自动私信功能，就是这样一个信息差让我小赚了一笔。


    后面我还做过一套课程，转化率也还 OK，有那么几百人购买。


    除了上面这些，我还做过视频引流，不过这个视频主要是引流到我的网站，视频当时是发在 B 站，转化率也很高，当时我这个网站的文章平均阅读量都是几万，内容全是一些软件效果器插件之类的。后来这个站关了我就不细了~


    接来说说怎么做：


    其实你可能说我是运气，但也不是，因为我的文案本身就是一篇干货内容，所以才会被其他平台转载，比如我前几个月写过一篇文章，然后也被“爱运营”这个网站转载了。


    真正的运气其实是算当时正好全民 K 歌是很火的时候，百度相关的内容也很少，所以我去做这个词很容易就霸了屏，但是对于现在很多词想要霸屏还是要做一些优化的，SEO
    我是基础，下面就简单说一下个人方法。


    ## 1、引流


    我的文案是一篇教程，跟其他的引流不同的是我的这个教程是没有写完的，只写了一半，或者说我标题中提到的“修音”，在文案中我是没有教的。


    所以这样的引流效果非常好，大家可以去尝试一下。很多人喜欢用资料去引流，但其实用你的文章去引流效果会更佳。


    比如你写一篇干货教程，在文章中留下了两个问题没解决，这样，看文章的用户就会想要去获取这两个问题的答案，这样的引流相对精准。


    比如我上个月的一篇文章目前知乎阅读 10W+，我原本没打算用这篇文章去引流，但也正好是文章中提到了一些关键词，比如 XX 群。然后底下评论全部都是求进群的~，又是一个意外~


    ## 2、霸屏


    其实百度霸屏我最常用的方法就是用已经存在的平台，比如百家号/搜狐号/时间号/豆瓣/知乎/360 图书馆/简书/新浪博客……


    原因很简单，这些平台权重本身就很高。


    经过测试，以上这些平台搜索结果会在前 3 页，百度自己家的就更不用说了，一般都是首页。但也看是什么词把~


    还有就是视频平台，B 站/腾讯这两个。


    把文章往这些平台一分发，几乎就能实现一个小霸屏，还会有意外收获，就是有些其他平台会转载。


    额，还有新闻源也阔以尝试尝试。


    但是霸屏也并不是一个词，而是多个相关词，我这纯属意外，我就不展开讲了。


    ## 3、裂变


    这个相信大家都比我玩的溜，我的套路刚刚说过了，其实用户一来我就直接裂变，大概 100 个人，会有 20-30 人会取关，30-40 人会做任务，10 人左右会付费。


