    # 花爷介绍一下公司的合伙人制，有哪些书籍可以看一下？


    提问


    花爷，你好。我想了解一下公司合伙人制，合伙人制股份分配是怎么样？怎么分配比例创始人能一直掌控公司？能详细讲一下吗？有那些书籍及相关资料可以看一下。谢谢。


    回答：


    几个关于合伙开公司的常识：'
  - '[PAGE 453]


    1. 股权分配要考虑三部分，创始人、合伙人和团队激励池——小白开公司不留团队激励池，公司遇到问题（比如创始人觉得合伙人不行，要换人）或员工激励时，就会受限制。


    2. 创始人早期最好保证51%以上的控股，特别是中小团队，我一般建议创始人要占70-80%，当然前提是创始人能力够强。


    3. VC一般一轮投资要拿10%的股份，直接从老股东的股份里稀释。这一点你就能理解，VC其实是双刃剑，因为第一轮VC投资之后，他就是老股东了，只要第二轮有新VC进来，估值够高，第一轮VC就有机会套现离场。所以你看朱啸虎当初投了OFO，极力撮合OFO和摩拜合并，不成之后又快速把股份卖给阿里套现，根本不管、也不看好你创始人戴威有什么商业梦想。资本始终是逐利的。'
