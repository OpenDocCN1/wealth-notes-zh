    # 问答：


    1、我们公司每年发项目提成，都是让我们自己准备发票，这样公司可以抵税。请问这种抵税的方式，具体是怎么操作的？可以讲下吗？我比较好奇。


    上善若水：无论是什么发票，都可以作为成本入账，增大成本就是减少利润呀，这就减少了企业所得税，这是其一。其二，抵税这一说法肯定是针对增值税的，增值税是一个链条税，针对增值的部分才交税。比如你买进来70元，卖出去100元，那么真正交税的就是差额30元。公司让你们准备得肯定是增值税专用发票吧，如果是增值税普通发票，那么不存在抵扣这一说法。所以公司拿到的增值税专用发票的进项越多，那么就相当于那个70变成了80或者90，那么差额就小了，交的增值税就少了'
  md: "\n| 预扣预缴 | 关系 | 汇算清缴 | 退补税 |\n| :---: | :---: | :---: | :---: |\n| 实际按月/次缴纳个税金额合计\
