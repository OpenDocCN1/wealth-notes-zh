    \n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\n## 请教花爷怎样判断一个行业是否有潜力，处在哪个时期？\n\n**提问：**\n\n花爷我想请教一下，你是怎么判断一个行业是否有潜力，处于什么时期，又有什么样的表现。\n\
    \n**回答：**\n\n笼统分的话，几乎每个行业都要经历四个阶段：\n\n1. 红利期：\n   一般是科技进步带动的社会普遍性需求爆发，比如90年代改革开放带来的商业浪潮，比如2010年前后处理器升级带来的智能手机，比如四五年\
    \ 前4G推广带来的短视频。\n   这个时期的特点就是准入门槛低，小兵小将只要入场都能分的一杯羹。拿手机行业举例吧，智能机刚出的时候，什么小辣椒、大可乐、大黄蜂，各种小品牌你们还有印象没？全是流水线上的货，贴牌就出去卖了。\n\
    2. 寡头期：\n   行业爆发期间，往往有一个寡头带动了整个行业的发展，比如手机届的苹果，比如短视频里的抖音。\n   寡头一般有核心的能力优势+先发优势，一段时间内把持行业超过30%的市场——想想手机的苹果，想想电脑的windows。\n\
    \   当然，有的行业没有寡头，有的行业没有长期固定的寡头。\n3. 争霸期：\n   这里的争霸，是指除了寡头（如果有）之外的各个品牌开始瓜分地盘。\n\
    \   因为通常情况下，冲击寡头是比较难的，而市场又足够大，所以小品牌最先争夺的，是寡头吃不下的市场。\n   在这个过程中，最显眼的两个词就是：性价比，渠道。\n\
    \   小品牌争霸，要么玩性价比，通过压缩利润快速占领市场，要么玩渠道触达，通过渗透快速战略市场。\n4. 稳定期：\n   在稳定期，大多是一超多强的局面，大部分市场已经被占领，各家还存货的品牌都在努力挖护城河，小品牌几乎没有机会。\n\
    \   如果小品牌在稳定期还能崛起，只有几种情况：\n   - 开拓了新市场，比如拼多多的下沉市场，比如手机的海外市场\n   - 行业的核心技术出现更新，牌桌被新人给踹翻了\n\
    \n上面4种时期，根据不同行业会有变动。\n\n有的行业可能只有2-3个时期，有的行业可能各时期的顺序不同，但基本覆盖了大多数行业的发展规律。\n\n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\
