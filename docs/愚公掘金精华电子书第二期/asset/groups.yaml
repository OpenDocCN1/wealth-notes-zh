    \n看完配置建议，下面说一下一些常见问题。\n\n# 五、常见问题\n\n## 1、自媒体\n\n花爷也分析过，保险自媒体和长投差不多，也是投入产出跑顺了，所以不断打广告。\n\
    \n- （1）可能会协助处理健康告知，但是也仅限于简单的情况（绝大多数不可能具备深厚的医学知识），大部分情况，他们也就是转介到保险公司去核保而已。\n- （2）部分保险自媒体很喜欢分析产品，不断写是为了运营需要。实质上作用不大，每个产品各有优劣，实在不放心可以分散买几份。\n\
    \n## 2、保险期限\n\n重疾险和寿险都有终身或者60/70岁等不同的期限，应该如何选择？\n\n同等条件下，终身期限肯定是比买到60/70岁要贵。考虑到你可以把省下来的保费自己去投资，再加上通胀因素，理论上是没有必要买终身期限的。但是，如果你对投资没有足够把握的话，也可以选择终身期限。\n\
    \n## 3、线上/线下\n\n线上成本低，价格便宜，服务也越来越完善。可以参考网购的发展过程，体验会越来越好。\n\n线下，同样的保额，保费贵很多。\n\n\
    举个例子：很多人吐槽的产品：平X福。\n\n### 平安福 2018\n\n**保障计划：男30岁**\n\n| 项目 | 详情 |\n| :--- | :---\
    \ |\n| 交费期限 | 20年交 |\n| 首年保费 | 20736.55元 |\n| 保障期限 | 终身 |\n| 保险金额 | 510000元 |\n\
    \n**投保险种明细：**\n\n| 投保险种 | 保险金额 | 保障期限 | 交费期限 | 首年保费 |\n| :--- | :--- | :--- |\
    \ :--- | :--- |\n| 平安福2018 | 510000.00 | 终身 | 20年交 | 9282.00 |\n| 平安福重疾18 | 500000.00\
    \ | 终身 | 20年交 | 6250.00 |\n| 平安福(2018)肿瘤 | 500000.00 | 终身 | 20年交 | 2400.00 |\n\
    | 长期意外 | 500000.00 | 至70岁 | 20年交 | 2500.00 |\n| 被保人豁免C2016 | - | 20年 | 19年交 |\
    \ 82.66 |\n\n平X福喜欢捆绑销售，特点是保费巨贵，基本买过的人都吐槽。\n\n**建议：** 如果已经买了这种产品，可以对比一下重新买的情况，能退就退掉吧。注意，要先后接好新的保险再退保。\n\
    \n## 4、小公司靠谱吗\n\n很多网络销售的保险都是没听过的公司在卖，那么这些小公司靠谱吗？\n\n这个问题保监会替你想好了。只要是保监会批准的，资质都没问题。就算万一破产，只要保单有效，保监会可以确保你的保单有其他公司承接的。因为这些保险公司每年都需要交保障费的，就类似银行的存款保险保护机制。\n\
    \n## 5、投资机会\n\n花爷的地盘，不提一下（可能的）赚钱机会，都不好意思了，哈哈。刚才吐槽了线下保险公司的产品性价比不高，但是从另一个角度看，也说明他们的利润是比较丰厚的。这里面是不是有投资机会呢？\n\
    \n**风险提示：** 重要的事情说三遍。股市有风险，投资需谨慎。\n\n### (1) 保险股\n\n之前记得花爷在某个问答里面提到过，保险是个高速增长的行业。\n\
    \n- 1）保险公司的内含价值（一种衡量指标）平均增长率15%+，处于高速增长期。参照香港、台湾、美国的保险发展历程，未来多年仍将高速增长。\n- 2）行业整体估值适中。\n\
    - 3）进入/经营门槛高，除了头部几个公司，其他中小公司基本都不赚钱。\n- 4）2019全面放开了外资控股保险的限制。对照日韩两国和台湾地区的对外开放历程，外资会有一定发展空间，但本地龙头地位难以撼动。\n\
    \n### (2) 具体标的\n\n通常来说，通过指数基金去参与一个行业的投资是个不错的选择，风险也比较小。可惜的是并没有保险主题的ETF，只有非银金融ETF（包含了券商），所以这里就不介绍相关的指数基金了。\n\
    \n按道理是不应该提到个股的，但是上市的保险股就只有几只，下面简单说说其中几只的特点。\n\n- 1）平安：龙头，增长最快。\n- 2）太保：中规中矩，股息较高。\n\
    - 3）新华：业绩一般，估值较低。\n- 4）最近HK有风波，在HK上市的内地保险H股更是跌到接近历史低位，有兴趣可以留意一下。\n\n**保险股估值对比表：**\n\
