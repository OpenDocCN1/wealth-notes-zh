    \n## 4、小公司靠谱吗\n\n很多网络销售的保险都是没听过的公司在卖，那么这些小公司靠谱吗？\n\n这个问题保监会替你想好了。只要是保监会批准的，资质都没问题。就算万一破产，只要保单有效，保监会可以确保你的保单有其他公司承接的。因为这些保险公司每年都需要交保障费的，就类似银行的存款保险保护机制。\n\
