    ## 产品经理的职业路径与成长


    笼统划分的话，产品经理一般分业务线和研发线，业务线不光要跟研发对接，还要跟运营、市场各种业务部门对接，接触面很广，对公司整条商业脉络摸得比较熟，研发线的主要精力就放在和程序员一起做开发项目了，对技术认知要求高一些。


    日常工作上，初级产品做原型策划，中级产品紧盯项目管理，高级产品把控公司策略，这些技能点的难度是逐级递增的。但你不管是什么类型的产品，是初级中级还是高级，产品都比较锻炼逻辑能力和思维能力，这对小白很重要。


    推荐你两本书，《结网》和《幕后产品》，不用细看，快速翻一遍就能有个了解。


    说完好处，缺点来了：


    - 产品这个行业没有什么门槛，起薪又高，导致很多互联网行业的人都想转行做产品，研发、运营、市场等等都有，现在产品这个职业质量参差不齐，毫不客气的说一半以上是水货，公司有个有真本事的产品带你很重要。

    - 业务线的产品，和不同部门、不同类型的同事打交道很多，而且往往没有实权，又要求人配合，往好了看是打磨社交能力，往坏了说有时候心理压力真的蛮大，我以前产品部门所有女同事，全部都在开会的时候被气哭过。

    - 虽然起薪高，但是爬到了管理层，产品没有运营吃香，因为大公司的产品可以互相抄，但运营策略的执行很难抄。换句话说，产品做到一定高度，必须主动补充自己的运营能力和商业水平，否则可能就到顶了，最牛逼的产品专家，不做管理层的话，年薪一般超不过60万（小公司估计难超40万）。


