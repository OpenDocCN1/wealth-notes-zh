    ## 怎么判断公司是否处在发展中？


    **提问：**


    有个花友提问怎么判断公司是否发展中，答案写好了提问被删了......我愣，直接发出来吧。


    **回答：**


    看一个公司是不是在高速发展阶段，其实就看两点：


    - 这个公司所在的市场价值大不大：


    腾讯最早的时候，做不下去，赚不到钱，想要卖掉都没卖出去，结果十几年后腾讯每年营收疯狂增长，持有腾讯的股票比买房还赚钱，为什么？为什么市场前后对腾讯的看法差这么多？


    因为腾讯的核心是社交，最早的时候，国内普遍不认可社交市场的价值，大家都用电话短信呢，谁会花钱用QQ？你怎么盈利？那时候大多数人不看好，是正常的。


    但后来互联网飞速发展，人们发现社交虽然不赚钱，但社交关系链切入游戏市场、文娱市场等等，非常有效。这就不一样了，游戏、文娱这些市场价值巨大，腾讯怎么可能不赚钱？


    这前后的变化，就是腾讯切的市场价值不同，你在一个小市场里，你就不可能有多大发展的空间。


    很多公司长期亏损，比如京东、比如现在的拼多多，但大家仍然认可它们，因为电商市场的价值太大了，一旦做成就是百倍的投资回报。


    公司所在市场的总体价值，是公司的天花板。


    - 这个公司有没有核心优势：


    光市场价值大、天花板高还不够，你得证明在广阔的空间里，你有能力飞起来。


    这时候核心优势就非常重要，腾讯的社交、京东的物流和品控、拼多多的下沉市场扩张能力，都是绝对的核心优势，甚至你说得长投，它的投放体系和数千名兼职体系的管理，也是核心优势。


    一般来说，核心优势有两方面，一方面是策略，你的策略有效，可以在前期获得先发优势，另一方面是执行力，策略是会被竞争对手模仿的，同样的策略，你的执行效果比所有人都好，这也是核心优势。


    基本上，投资人大概毛估一个公司的价值，看的也是这两点，企业所在的市场价值天花板高、企业又有核心优势，能同时满足这两点的都是非常优秀的企业，越早投资回报率越高。


    大公司有时候其实也挺焦虑的，比如腾讯常年称霸国内游戏市场，这个大蛋糕的发展空间已经到顶了，如果不能找到新的高价值的市场，腾讯未来的发展就很可能出问题。这就是像腾讯这样的大企业，要不断出新项目，投资、创新的原因。


    至于第二个问题，个人职场和公司是否在高速发展中的关系，其实很简单：


    - 如果能去大公司，尽量去大公司

    - 如果大公司呆腻了，可以去有发展潜力的公司当管理层

    - 如果能力不够，大公司进不去，可以去有发展潜力的公司磨练几年


