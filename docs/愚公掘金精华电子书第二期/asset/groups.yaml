    ## 准备开年工作了，请花爷说说在这种情况下，电商会怎样的环境，要做好什么准备？


    **提问：**


    花爷，准备开年工作了，说说在这种情况下电商会怎样的环境，要做好什么准备？


    **回答：**


    疫情影响下电商肯定是下滑的，一方面工厂出货难，供需失衡后价格上涨，购买需求少了，另一方面快递也不给力。这种影响肯定是阶段性的，疫情之后会回到正常水准，不过这几个月的营收没了就是没了。


    对电商这个行业，我最近几年的看法不变，就是卖家一定要想办法增加和消费者的触点。


    触点其实是一个餐饮行业比较流行的概念，服务员每接触顾客一次，都称之为一个触点。正常情况下，触点越多，黏性越高，触点越少，效率越高。


    大的餐饮企业高度标准化，会严格根据企业定位，把控触点的数量。比如以服务为口碑的海底捞，会有意增加标准服务流程中的触点，但太二酸菜鱼为了追求高翻台率，会刻意减少触点。


    对电商这个行业的大部分从业者来说，流量越来越贵，新的流量渠道、裂变和复购都非常重要，所以增加触点是一个趋势。


    传统的淘宝电商，精力都花在付费买流量，是一种筛子模式，一瓢米倒进筛子，能筛多少是多少。


    下一个阶段的电商，不仅要付费买流量，而且要在多个渠道付费买流量比较效果，并且维持长期的触点关系。更像是一种米缸模式，不仅要用不同的筛子筛米，而且要把筛过的米都装在缸里，减少对筛子的依赖。


    去年最火爆的几个天猫美妆品牌，都是靠“内容种草+微信流量池”这套配置做出来的，而且国际一线大品牌也开始在研究这套打法了，后续一定会有跟进。


    直播（售前增加触点）和微信（售后增加触点）慢慢会变成电商的标配的。


