    还有估值，这个东西也是很扯的概念，其实也是因人而异，你懂这个，那么就知道，哦，这个价格不贵，因为你有经验，你以前买过或者，你经历过什么事情， 你知道这类公司业绩一塌糊涂只是暂时的，你了解，而我不了解，所以，这个东西每个人是不一样的。


