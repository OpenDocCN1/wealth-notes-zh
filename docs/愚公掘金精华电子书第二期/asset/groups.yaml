    ## 花友分享：分享一点自己分析用户需求的方法


    安神：


    分享一点自己分析用户需求的方法，或者有 **NB** 方法的伙伴，多多交流。


    什么 3W 框架，4P 理论，就不谈了...


    为什么要了解用户需求？不管是创业、工作或者说卖一样东西，在淘宝开店卖某个产品等，首先了解用户的真实需求，你在卖的时候，才能更贴近用户，卖什么，怎么卖？在最大的契合度上满足这个需求，才能做的更好，避免自嗨。


    1、这几天刚好帮一个朋友做点分析，百度关键词规划师，搜索核心关键词“会计培训”，然后下载，分类信息，可以根据实际情况，比如我是根据了解、品牌、价格、服务、产品、其他等进行信息分类，有了这些，就可以用来做任何事情，比如产品定位，或者宣传策略，推广渠道，可以用来做参考，除了单纯的了解这个东西的人以外，还有
    10% 的人在了 解价格，那我们在做推广文案或者做产品口号的时候，就可以突出价格和服务。还有 1 个长尾词，关于学习心得，虽然整体占比不高，但是拿到知乎上搜索，我发现这样引流真的很顺其自然，比你写什么诱饵之类的文案好多了。如果是做线上培训的，百度指数的地域分布，相应搜索量高的城市，是不是就可以在信息分类平台多投点广告，比如
    58、闲鱼。


    2、这个是我以前就点评时，经常用的方法，就是去看大众点评的评论，比如这个米线店，那任何老板会给自己刷好评，不会给自己刷差评，我是一般好评差评都会看，对手的评论也多
    多去看，里面可能会很多自己发现不了的产品场景、用户需求反馈，最终你会知道用户喜欢什么，把这些信息爬下来（web scraper 爬点评有点困难）和上面方法一样，通过价格、服务、卫生、口味等进行分类，然后进行相关的品调、竞调、店内调整、服务培训，逐一解决问题。有一个很奇怪的现象，大家在点外卖的时候，餐品、包装、服务、配送等稍微有不满意的，就很大可能给商家差评，但是往往你去店里吃饭的时候，在难吃，也没有见哪个顾客和老板吵一仗或者干一仗，最多你就是不来了，所以这里面就有很多隐性需求是可以提升的空间。


    - 3、淘宝的问大家，也很适合做品调，看看大家关心什么问题，比如宝宝起名，大家都在担心是不是用软件在起名，他们已经很明白的告诉你了，我是要一个真正的大师，那么做主图的时候是不是可以用相关文案把这些顾客的疑虑打消，突出产品卖点。当然
    i 继续用你的软件起名并没有任何影响....胸大不大无所谓，脑洞一定要大，当然你胸大我更喜欢！！！


    - 4、关于工具，除了这些，淘数据、5118 的词频脑图、百度指数、微信指数、爱站等都是很好的分析工具。百度关键词规划师是需要企业账户开通的，没有的可以用熊猫关键词代替。


    车还是那辆车，不同的司机可以开出不同的水平，就看你怎么使唤了，冬天黑的早，年轻的哥哥姐姐们“开车”该上路了，我没得事干，我家车回娘家了，有没有同情的，举个手！


