  md: "\n# 说说中国的自有住房率\n\n看到一个数据，说中国自有住房率89%，好多媒体拿这个说事。\n\n其实国内这个大学那个权威的各种调查，没谱的居多，记住花爷这句话：\n\
    \n> 你想要证明什么，都能找到数据支撑，一定能。\n\n比如这个89%的数据，来自西南财经大学的调研，全国样本量是多少？8438个。你说这点样本量代表全国，你信吗？\n\
    \n为了表面数据好看，国内官方给出的自有住房率从2010年开始就一直没有高，但是大多在混淆概念。再说了，有自有住房，不代表有居住质量。\n\n最近几年，大家一个明显的感受就是，身边朋友家里没房的，真的不多了，反倒是小城市，家里几套房的大有人在。写这段话的时候我回想了一下，老家的身边朋友好像没有低于每家两套房的，我自己家里拆迁拿了三套房，说起来很霸气，其实值不了多少钱，权当给爸妈当养老金了。\n\
    \n但另一方面，一线城市的房子还是难买，买了五环想住四环，住了四环想进三环，不住到城墙边都不算满足，剩下夫妻双方六个钱包都凑不够最低首付的，只能租房子再撑一撑或者退回二线了。\n\
    \n本质上，无论房市怎么不被看好，房子始终起到了城市过滤器的作用，而且越发达的城市，过滤作用越明显。\n\n这种过滤作用，会是未来5-10年的主旋律，有心的朋友可能发现，现在教育都在大力推职高了，就是给被过滤下来的孩子一个缓冲带。\n\
    \n反过来说，我之前在星球里强烈看好深圳东莞惠州一带（复习链接：https://t.zsxq.com/Rv3VNrN），现在更是同样的想法了，听说最近深圳南山区的一个豪宅小区挂牌价涨了30%。\n\
    \n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_742_0.png)\n\
    \n**花爷梦呓换酒钱**\n\n让一部分中产先冲破天花板\n\n# “金花奖”挑战：价格更高的新型连锁水果店的盈利点和优势是什么？\n\n### 挑战提问：\n\
    \n花爷，你好！来深圳出差发现新型连锁的水果店(如百果园)和生鲜店(如帅大妈)比较多，价格比传统的店要高一些。请问它们的盈利点和传统的店有什么不同吗？商业优势又在哪里呢？\n\
    \n### 花爷回答：\n\n鲜丰和百果园在全国扩张得很凶，主要有几点核心优势：\n\n- 1. 统一、明亮的装修，看上去很诱人、上档次，满足了一部分生活富足的人群的水果消费升级需求——而且随着经济发展，这类人群会越来越多。\n\
    - 2. 虽然鲜丰、百果园这种水果店，比一些小店的价格普遍要贵一点，但它们每天都会有几款团购的水果很便宜，做引流款，保证中低端用户的黏性。\n- 3. 全国大批量的连锁店开业，基本上连四五线城市都有，大量的采购量反向压低了总部采购水果的价格。\n\
    - 4. 总部对公众号、小程序团购、社群都有统一的运营SOP，这点传统店拼了老命也跟不上。\n\n总的来说，抓住了一波水果的消费升级需求，然后整合供应链、产品运营、搭建品牌，虽然价格高一点，但对传统小店的打击非常大。——这不是说所有鲜丰店都赚钱，但整体来看，总部一定受益，不排除部分小店会开不下去。\n\
    \n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_745_0.png)\n\
    \n**花爷梦呓换酒钱**\n\n让一部分中产先冲破天花板\n\n# “金花奖”挑战：信用卡推广短信的包装\n\n### 挑战提问：\n\n小商机提问。\n\
    \n去年开始经常会收到信用卡办理的短信，内容大致都是：\n\n> **【XX银行】温馨提醒，您有1张额度最高XXXX元的信用卡白金卡，有效期X天，点击申请\
    \ [http://xx.cn/xxx](http://xx.cn/xxx) 退订回T。**\n\n因为之前发现很多银行都有推荐办卡的活动，部分银行奖励力度还蛮大的，所以怀疑是这个方向。\n\
    \n思考了一下：\n\n- 1. 短地址链接跳转后明显带有类似推广id的参数。\n- 2. 身边的人收到这样的信息的不多，怀疑个人信息是从信用卡管理软件泄露的。\n\
    - 3. 这个思路和支付宝红包码群发有相似之处，改进之处是预先筛选了目标人群。\n- 4. 伪装成官方短信博取信任。\n\n以上是个人的思考，期待花爷更详细的拆解，谢谢。\n\
    \n### 花爷回答：\n\n非常棒，忍不住要夸夸这位花友。\n\n第一，发现了信用卡推广短信这个线索，而且通过查看短链接跳转后的ID参数，察觉到这不是官方的推广，而是代理商的推广。\n\
    \n这一点简直太棒了，顺便给各位花友科普一下，怎么判断短信里的推广链接是不是官方的，你用浏览器打开链接之后，复制链接出来，一般看到带“ID=xxxx”类似后缀的，都不是官方的。\n\
    \n第二，举一反三，把信用卡短信类比了支付宝红包的案例。\n\n没错，这个案例的原理和支付宝红包是一样的，就是代理商利用官方的名义，博取信任，然后诱导你办卡获取佣金。\n\
    \n但是补充一点，这里的信用卡短信，和支付宝红包短信，还是有一些区别。\n\n支付宝红包推广短信，是个人以支付宝名义发的，支付宝官方是不支持这种行为的，因为本质上是在薅羊毛，支付宝后续也有采取措施打击。\n\
    \n但信用卡推广短信，信用卡官方是支持的。\n\n为什么呢？\n\n因为官方发推广短信，政策上是有严格要求的，整个审批流程走下来，基本效果好的营销短信都不能发。\n\
    \n所以官方就把推广的任务，交给各个代理商，让代理商去做推广，对于代理商假借官方的名义，也睁一只眼闭一只眼。一般来说，代理商邀请到一个新卡用户，能拿到100-150元佣金。\n\
    \n包括发短信的手机号，有的也是信用卡银行官方提供的，不是盗取泄露。而且你也不用太担心，银行给代理商提供号码的时候，一般是大批量提供号码和地区，没有个人信息。\n\
    \n当然，在这当中必然也存在一些短信，连代理商也不是，直接就是骗子短信和链接，这就属于黑产的范围了。\n\n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_750_0.png)\n\n**花爷梦呓换酒钱**\n\n让一部分中产先冲破天花板\n\
    \n# “金花奖”挑战：家用按摩椅的市场如何？投资是否可行？\n\n### 挑战提问：\n\n花爷你好！最近公司办公室门口多了两台按摩椅，微信扫码支付按摩的，但是都没什么人用。我觉得可能在办公空间的按摩椅这个场景是有问题的，因为你上班时间按摩，怕被老板说上班时间去按摩，不好好工作。下班的时候人都想早点回家了，也没人还要先按摩再回家。\n\
    \n上周去看电影，发现电影院门口有两排按摩椅，用的人还挺多的，这种娱乐场所又需要等待的场景才适合按摩椅吧。\n\n最近我妈说她腰疼，去做了半个月理疗，我在想给家里买一个按摩椅。\n\
    \n想问下花爷，家用按摩椅的市场有多大，市场教育需要多长的时间，现在投资家用按摩椅是否可行？\n\n### 花爷回答：\n\n按摩椅之前有两个明显的上升趋势。\n\
    \n第一个就是你说的，商场里共享按摩椅的加盟。\n\n这个故事确实讲的很好听，买一台按摩椅加盟，放在商场、电影院里，用户有一定的使用需求，你不用管它，每天都能有收入入账。\n\
    \n当时按摩椅的品牌方宣传时算了一笔账，说一台按摩椅代理加盟费几千元，放在商场两个月你就能回本，后面都是躺赚。\n\n很多人确实吃这套，掏钱代理加盟的不少。\n\
    \n实际情况肯定没有品牌方说的那么好，因为具体运营时，还涉及到场地费用、耗损、维修等等。\n\n据我的了解，大多数代理商的运营情况也就是刚刚持平，小部分人有盈利。不管怎么样，品牌方肯定赚了，生产按摩椅的厂家肯定也赚了。\n\
    \n第二个就是你说的家用按摩椅。\n\n这种其实不是普遍需求，首先按摩椅不便宜，其次占地方，不在大多数家庭的采购范围之内。\n\n所以你去商场里卖按摩椅的店铺看看，都是瞄准中产以上的富裕家庭，请一个刘德华这样的中老年偶像代言，一通包装宣传，千把块按摩椅卖到上万块。\n\
    \n所以你说的家用按摩椅，其实市场需求没有那么宽，如果真的考虑这个领域，建议从更轻型的按摩器入手。比如肩颈、腰椎的按摩器，针对局部疾病，几百上千块一个。这个领域的玩家现在是逐渐增多的，小米网易这类品牌也在入局。\n\
    \n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_755_0.png)\n\
    \n**花爷梦呓换酒钱**\n\n让一部分中产先冲破天花板\n\n# “金花奖”挑战：对标Costco的必要商城的商业模式是什么？它会做大么？\n\n###\
    \ 挑战提问：\n\n想了解了一下花爷对这个“必要”的看法，文案看着是真给力，热点，明星，高品质低价，国外产品比较等等都弄上了，看着好不诱人，这和瓜子二手车的商业模式有什么区别，还有这算掀桌子吗？\n\
