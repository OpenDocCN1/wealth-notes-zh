    # 5、普通人打打新股赚点零花钱靠谱吗？


    Andrew：打新是要市值的，就是说一定要买沪深A股的股票的，靠谱的，而且是必须坚持的事情，不中是正常的，理性，理性，你要做的是每天坚持去看一下，然后点一下，然后万一中了，绝对不能没有现金，问朋友借也要给配上，因为这就是中国市场送给每个参与者的，不拿就输了。


    # 6、小散最好是集中持股还是分散持股？几只几个行业为佳？


    Andrew：我发现我爸买的特别集中，但是我说说我的方法我自己感觉更加容易使用一点，因为每个人的精力是很有限的，尤其是现在上班了，更少见的时间能够说去把任何哪怕一个行业去弄透，那么必然有一个你集中研究的行业，这个集中的行业中你要找到你能看到确定性的东西，找'
  - '[PAGE 130]


    到你的猎物（公司）然后你可以一开始少买一点，然后可能散的很开哪里又发现一个好的，你又去买了一点，然后随着你的研究深入，你会越来越了解你研究的这个行业和公司，然后你就会开始理解什么时候这家公司算便宜的，于是你就会开始等待这个价格的出现，比如现在就给你机会了，但是你不知道买什么，这种情况就不会出现，然后你一次又一次的加仓。最后你的配置就会变成好多个股票，每个都很少都忽略不计，只是用来追踪，但是有1-2个你特别确定的股票可能这前1-3个加起来超过你的60%以上配置。这是我目前用的方式，那些忽略不计的买的很少的，也能够促使你不断跟踪，扩大自己的理解范围。


