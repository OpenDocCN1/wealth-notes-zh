    ## 是否辞职单干？很多时候答案就在问题里


    **提问：**


    花爷，有个职业方面的问题想请教。本人目前在一家工程咨询类公司工作，派驻政府单位协助开展业务，工作较为轻松，目前到手二十来万每年，福利还行，配了一辆项目用车，主要是我用。今年开始部门业务量有所下滑，年终奖有所下调，但公司总体业务平稳。现在有个机会，同事有一些门路，邀请我出来单干，主要从事水务管网修复方面的业务，目前该类业务较多，但业务入门门槛不高，竞争较为激烈。一方面自己想试试（以前想的是有合适的机会出来干，但目前的机会跟之前预想的不一样）；但另一方面，担心后续业务拓展不开，后面再找目前待遇的工作较为困难，比较矛盾。请问花爷，有没有一个分析的思路或者建议，帮助做出选择


    **回答：**


    给花友回答了几百个问题，我发现一个非常有趣的现象：


    ![](img/62659df0b3729b5d99b589094fb4b8b0_422_0.png)

    ![](img/62659df0b3729b5d99b589094fb4b8b0_422_1.png)


    很多问题的答案，其实就藏在提问里，只是花友自己不知道。


    你看你的问题，前2/5都在介绍自己目前的工作，全是优点，有钱有车还轻松，虽然业绩有下滑，但你忍不住又“解释”一句总体业务很平稳。


    接下来只有1/5的篇幅在介绍同事拉你单干的业务，基本都是缺点，虽然业务多，但是门槛不高，竞争激烈。


    我们再看看，最后你提到自己两个顾虑，一方面你想试试，但你不是因为同事拉你单干的业务足够好而想去试试，只是有个人独立发展的长期规划而已。另一方面就很真实了，如果单干做不好，很难找到现在这么好的工作了——你看看，你心里其实明白得很嘛。


    你说说，答案其实你心里已经很明白了，对不对？


    你想要有个头脑更清醒的人，确认一下你的想法是否正确。好，那花爷告诉你，你是对的，这种情况不适合辞职去单干，你的工作好着呢。而且你也没到必须二选一的地步，工作继续干，和同事可以商量用业余时间一起做，反正你也说了，你本职工作本来就比较轻松。


    一个经验，等到你副业的收入是你主业收入的2-3倍，再考虑把主业辞掉全职，在这之前，主业是你生活的地基，哪有为了装修把自己地基给掘掉到道理？


