    # 2019送我的10句箴言，但凡一句有用，你就值了


    《2019送我的10句箴言，但凡一句有用，你就值了》，全文四千多字，先给大家尝尝鲜。


    花爷以前说过，我不喜欢名句、箴言这些东西。


    为啥呢？因为人说的每一句话，都有其对应的语境。脱离了语境看结论，容易出现理解的偏差。'
  - '[PAGE 530]


    但禁不住呢，过去两周有几位花友，私聊我想听听我的2019年终总结。


    确实，于我而言，2019年馈赠了我一些启示，我也竭尽所能的沉淀了一些思考。


    花爷转念一想，唉，算了，被误解是表达者的宿命，但我的总结里只要有一句话对花友们管用，那就是一件善事。


    于是，我总结了2019年送给我的10句箴言，为了方便大家理解，每句箴言下我还是做了一些注解。


    答应我，先记住：


    我不是你们的指路牌，也没有任何人可以当你一生的引路人，但是，我可以做你们的一把戒尺。


    +   1. 时间是所有人最宝贵的资产。'
  - '[PAGE 531]


    我妈有个好朋友的儿子也在上海，比我小一岁。


    不过我运气比较好，收入要高他一些，所以有一次吃饭，他问我，有没有什么特别深的感悟能和他分享。


    我说，你有一样东西，特别宝贵，我这辈子再怎么努力，都不可能比得上你，你知道是什么吗？


    他问我是什么，我说，就是这辈子的任何时间里，你都永远比我小一岁。


    一年时间，可能什么都不会发生，也可能什么都机会发生。


    我曾经不止一次的在星球、公众号里和大家说过，财富大多无法直接获取，必须通过把时间置换成虚拟资产，比如信息、知识、技能、经验，然后才能兑现财务。'
  - '[PAGE 532]


    今天，无论科技如何发展，人类始终无法在跟寿命相关的生物科技上有大的突破，换言之，时间是世界上最不可再生的消耗性资产，也是普通人和富人相对而言最公平的资源。


    回想过去，我发现自己实现跨越的每一个阶段，都和高效利用时间资源有关。


    实习时，房租预算有限，花爷宁愿住在四人上下铺的廉租房里，也要住在公司附近；刚上班那会儿，虽然工资也不算特别高，还是咬咬牙住在可以步行上班的地方，每天省出一个多小时的上下班路程时间。


    今天想想，我的很多积累，都是从下班时间里，一点一点抠出来的，那真的是比铁公鸡还抠，嘿嘿。


    +   2. 要想逆天改命，更要顺应自然规律。'
  - '[PAGE 533]


    2019的票房冠军《哪吒之魔童降世》里，有句台词非常火，叫我命由我不由天。


    这句话配合电影剧情，在哪吒喊出口的一瞬间，一股人定胜天的豪迈气势喷薄而出。


    但很多人都理解错了。


    哪吒最后为什么能改命？不是因为他突然小宇宙爆发，嚎了一嗓子，而是因为他有十足的天赋，因为他跟太乙真人学到了真本事，因为他有好师傅、好父母支持着他，因为他的善良感化了命中注定的对手敖丙。


    这就好像一个高中小混混，突然考上了清华，如果说他是一咬牙一跺脚就考上了，你信吗？你不能信，他必须要付出日积月累的努力，才能改变自己的命运，这就是自然规律。'
  - '[PAGE 534]


    想要某方面逆天改命，就更要在其他方面顺应自然的规律。


    我见过不少老板、小生意人，做出了一点成绩后，就开始盲目扩张，忽略显而易见的市场规律，结果一落千丈。


    很多人都忘了，想要改变规则，先得顺应规则。


    3. 好事情都被吹牛逼耽误了。


    因为19年时间比较自由一些了，所以有时候会咖啡馆工作。


    不是吹，在上海的任何一家咖啡馆坐一下午，你能听到至少三个千万级别的生意。'
  - '[PAGE 535]


    有一次坐我后面一哥们，张口就要超越马云，闭口又不把马化腾放在眼里，眼看着地球都快容不下他牛逼的了，我实在走不了，赶紧走人换个地儿清净。


    回去的路上，我也在想，如果他真的亲身去实践了，等碰了几次壁之后，其实也就成长了，也就说不出来这么不着调的话了。


    说不定实践几次之后，能力强了，真有个好点子被他做成了也有可能。


    但可惜啊，他把时间花在了吹牛逼和打嘴炮上了。


    +   4. 条条大路通罗马，但只有一条属于你。'
  - '[PAGE 536]


    花爷以前有个比较出名的理论，普通人需要通过四个阶段，才能完成财富的跃阶，它们分别是：开眼、复制、贯通和跨越。


    很多人都卡在开眼这个阶段，没有看过足够案例，就很难对商业有深入的理解。


    不过有些人，却恰恰相反，他们的问题就在于，自己知道的太多了。


    去年，我看过非常多的团队领导、创业者，表现出一种莫名的焦虑，为什么？因为他们看到有人在短视频成功了，有人在淘宝直播成功了，有人在私域流量成功了……他们着急。


    有花友和我诉苦，团队目标一季度一个变，领导无病却要乱投医，做计划从来不考虑资源是否充沛，搞得团队怨声载道，最后还没有效果。'
  - '[PAGE 537]


    这样的团队，应该不在少数。


    老话说，条条大路通罗马，但很多人都忘了，人不可能同时走在几条路上，去罗马的路再多，最适合你的，一定只有一条。


    特别是小团队、创业者和个人，不是花爷吓唬你，经济下行的年份里，别瞎折腾。


    先看清路，再走路。别埋头在迷宫里乱窜，你身上的干粮其实并不多。


    5.人生没有节奏感，干啥都像在添乱。


    去年有次词很火，叫浪潮式发售。


    什么意思呢？你发售一件商品，要像浪潮一样，一波一波的用不同的素材宣传，有一个完整的从铺垫、到设置悬念揭秘、最后到揭秘的过程。'
  - '[PAGE 538]


    这样的发售，既能充分调用用户的兴趣，又能多次发布素材信息，触达到更多的用户。


    这就是生意的节奏感，再拔高一层，人生其实也需要节奏感。


    国内不少年轻人有一个坏习惯，总想上来就干一票大的，不能一夜暴富都不算是成功，最后暴富是不可能的，反而到处抓瞎，忙活半天还在原地踏步。


    其实大多数生意、大多数人生，都是一个长期的事，一开始做不到十全十美，才是常态。


    举个例子，第一代iphone堪称划时代的发明，大玻璃屏、手势交互、app矩阵系统，引领了未来十几年的移动浪潮。'
  - '[PAGE 539]


    但你知道吗，第一代iphone甚至没有简单的文字  复制粘贴功能，说出来你可能都不敢相信，复制  粘贴的功能，一直到三年后的iphone4才被加上  的。


    这也是我反复提到的“长期收益、指数盈利”的思  想。


    人生是一场马拉松，却有太多人把它当成了百米  赛跑，其实你并不需要比所有人跑得快，只要沿  着正确的路线跑完，就能赢。


    6.不肯吃亏，是穷人的惯性。


    我们的上一代人，有很大一部分长辈，是不肯轻  易吃亏的。


    为什么呢？很好理解，穷怕了。


    534


    公众号懒人找资源'
  - '[PAGE 540]


    人越是穷的时候，日子过得苦的时候，就越是下意识的保护自己。当人承担风险的能力几乎为0时，不肯吃亏就是保护自己的最好方法。


    这一点，我们也能理解，毕竟是时代背景造成的。


    问题是，在我们这一代的成长过程中，生活条件已经有了非常大的改善，但耳濡目染，我们这代还是有不少年轻人，继承了父母轻易不肯吃亏的习惯。


    其实社会上的规则很简单，年轻人不吃点小亏，大佬们凭什么高看你一眼？连主动给大佬帮帮忙都不愿意，大佬凭什么要提携你？吃饱了撑的？


    穷人为了规避风险，不肯吃亏。而富人因为承担风险能力高，愿意吃亏换取一些可能的长期收益。'
  - '[PAGE 541]


    而有一定风险承担能力的年轻人们，是否愿意吃点小亏，换取长期的收益？


    这笔账有这么难算吗？


    7. 小船什么时候比航母有用？在湖里的时候。


    有花友问我，现在腾讯、阿里这些巨头企业生意做得这么大，咱们普通人还有机会吗？


    有，当然有。


    航母虽大，但它吃水深，掉头难，没有足够的市场空间，它施展不开。在海里，小船比不过航母，但在湖里，小船自由穿行，航母一早就搁浅了。'
  - '[PAGE 542]


    很多花友不理解大公司的运作模式。我举个例子，今天腾讯成立了一个新的子公司，投资了一个亿，那就相当于这家子公司从诞生那天开始，估值就高达10个亿左右了。


    这家子公司的CEO，每天脑子里想的是什么？不是怎么赚钱，而是怎么把10个亿的规模，做到100个亿，他要找市面上各种做到百亿规模的公司先例，供自己借鉴。而那些规模太小的生意，他看都不会看一眼。


    但普通人就不一样了。


    对大多数普通人来说，年入百万已经是非常小概率的富足生活，千万收入更是个人利用技能创收的天花板。在这些天花板很低的小生意领域，普通人和巨头是不存在竞争关系，反而是一种相互促进的共生关系。'
  - '[PAGE 543]


    这块我过年期间会在星球里重点讲，2020年对企业和个人有哪些机会，年后争取整理一下发一篇文章出来给大家分享。


    # 8.红利从来没有消失，它只是升级了。


    从2016年开始，就有人叫唤公众号的红利消失了。


    但你 看，2019年花爷做公众号，效果也挺好，虽然粉丝不算多，但黏性超高，这还是 在只用了非常有限的精力运营的基础上。


    那公众号的红利到底有没有消失呢？


    严格来说，是早期野蛮增长的红利消失了。公众号刚出来那会儿，二维码随便往那一贴都有人好奇扫码，文章写完没有任何排版也能大火。'
  - '[PAGE 544]


    是，那段时间确实是最初的黄金期，但我们都应该意识到，野蛮增长的时代本来就总有一天会过去的。


    现在，公众号或者说整个内容领域，只是红利的门槛升级了而已。


    用户的互联网年龄在增加，他们不再满足于简单的、毫无营养的垃圾内容，他们开始渴望、甚至愿意付费学习精品的、高效的内容。


    对内容行业的垃圾制造者来说，红利消失了，但对有能力、有一技之长的从业者来说，我们的机会来了。


    9.做好失败100次的准备，才有资格抓住1次成功的机会。'
  - '[PAGE 545]


    花爷在之前的文章里写过，18年我手上的电商业务萎缩，开始找新的方向。


    怎么找呢？罗列了十几个可能的方向，一个个的干下去。最终从几个做出小成绩的方向里，选中我最喜欢的公众号作为主攻方向。


    经常有花友会诉苦，说花爷，我之前是做xx业务的，但是做了没效果，怎么办？


    我追问，你试了多少次？通常回答都是一次，三次以上的屈指可数。


    我真的希望所有花友都牢记一点：每天有无数的普通人想要完成阶级跨越，如果你能把别人PK掉，靠的不仅是天赋、智慧，很多时间靠的是坚持。'
  - '[PAGE 546]


    成功的机会是留给有准备的人的，留给有什么样准备的人？做好失败100次准备的人。


    这也是咱们愚公掘金星球中问答服务的意义，你来提问，花爷保证你的方向正确，并且提供一些可能的建议方案，而你呢，就负责持续不断的坚持、打磨。


    10.既然要做梦，干脆把梦做大一点。


    关注篮球的花友知道，自从姚明成为中国男篮主席以来，国内篮球在 market化的道路上取得了很大的进步。


    去年，CBA发布了一部纪录片，制作水准非常高。纪录片主题，就叫“敢梦敢当”。'
  - '[PAGE 547]


    很奇怪，在国内，梦想是一个在电影里、漫画里、综艺节目里常见的热血名词。但在现实生活中，如果有人把梦想挂在嘴边，总觉得怪怪的。


    想一想，你上一次思考梦想这件事，是多久之前的事了？


    我们一直羞于把梦想说出口，以至于有时候，甚至忘了心里的那个梦想是什么。


    愚公掘金里有个花友特别害羞，他不愿意在星球提问，怕不好意思，连私聊我提问都要鼓足半天的勇气。


    他甚至和我说，他觉得能跟我聊天已经是非常了不起的事情了。'
  - '[PAGE 548]


    听到这句话我真是哭笑不得，我和他说，年轻人既然要做梦，就把梦做得大一点，反正又不花钱。下次我期待你不仅能来提问，还有能力凭自己的能力赚到钱，到社群里来做分享。


    花爷在和团队小伙伴制定KPI时，也常说，咱们把目标定高点。咱们定200，即使完不成，也能做到150，要是目标定在150，那连100都不一定能完的成了。


    没想到啰啰嗦嗦，竟然写了四千多字。还是那句话，但凡有一句对你有用，就值了。


    最后，花爷就把CBA新赛季的口号送给大家吧。


    新的一年里，祝大家，敢梦，敢当。'
