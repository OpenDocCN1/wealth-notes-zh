    我们再看看，最后你提到自己两个顾虑，一方面你想试试，但你不是因为同事拉你单干的业务足够好而想去试试，只是有个人独立发展的长期规划而已。另一方面就很真实了，如果单干做不好，很难找到现在这么好的工作了——你看看，你心里其实明白的很嘛。


