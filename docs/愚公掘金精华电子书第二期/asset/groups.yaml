    ### “金花奖”挑战：非互联网行业应该怎么启动针对本行业的细致化搜索服务？


    #### 挑战提问


    从生活中已经存在的产品中找商机


    俗话说人无完人，一个产品也注定不会是完美的，会有它无法触及到的点，使用产品的用户越多，这个点就会成为更多人的痛点。


    比如汉堡王是从麦当劳、肯德基无法提供更多口味的汉堡这个痛点出发，在市场已经被这两家公司基本占领的情况下取得了一席之地。


    本人是建筑施工行业，平时会上网搜索资料，大多数情况都是通过百度，搜出来的资料五花八门，从这个想法出发我想做一个建筑施工的导航网站，搜资料的时候从土木在线、筑龙网这些专业网站资料库中进行搜索，把搜索范围缩小，结果更有针对性，但是问题是本身不是互联网行业，也没有资源，资金也有限，这种情况应该怎么启动会比较好呢？


    ## 花爷回答


    直截了当的跟你讲，做互联网行业，经验、资源、手艺、资金，这四样如果你一样都不占，那就先别折腾什么大动作了，大概率竹篮打水一场空。


    ### 经验


    你没有互联网从业经验，是没办法判断自己的点子靠不靠谱的。这个行业里最不缺的就是点子，每一个你想过的点子，都一定被别人想过，所以你的点子要么别人做完失败了，要么就是别人已经做了，只是你还不知道。


    ### 资源


    在十几年前的站长时代，网站推广主要靠互推、站群和SEO。今天你去做个网站，根本没有太多的资源和方式去推广，等网站做完了，你就傻眼了，根本没人来，到时候你怎么办？


    ### 手艺


    做网站需要技术的，你应该不太会，所以你得找个研发和你一起干。但问题是，研发凭什么听你的指挥跟着你干？


    ### 资金


    做网站、推广、研发都离不开钱，这点不需要多说吧？


    按照你的思路，遇到的问题太多了。普通人做事，千万不要上来就要搞个网站搞个App，你得先有本事聚到人，验证自己的点子是正确的，然后再考虑投入做产品。


    举个例子，你觉得大家的问题是搜索不到精准的资源。


    如果这个问题是真的，那如果退一步，你把各个专业论坛里的资料弄下来，整理出行业里的资料包，按照各种场景分门别类，大家应该都需要吧？


    如果大家都需要找你要这个资料包，你就能去论坛、贴吧分发资料包，聚集到一批行业里的精准用户群了吧？


    这个时候，你就成为了行业里的小KOL，就可以组讨论群、学习群，链接到行业里各种资源了吧？


    完成了用户和资源的第一波积累，再考虑是做一个小程序、还是网站，或者换一个方向，去做行业内的课程、业务对接等等，选择方向就多多了吧？


    你看，换一种思路，先聚人，后做产品，局面一下就打开了。


    并不是说按照我说的就一定能成功，但你这样做，哪怕中间运转错误，失败了，也能积累一定的经验和资源。如果你上来就闷头搞一个产品，产品做出来后发现没有人用，那真就两眼一抹黑，几个月白干了。


