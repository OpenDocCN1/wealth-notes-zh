    # 花爷谈谈对“发现公众号”这个微信新功能的理解


    公众号在内测的新功能：发现公众号。


    很明显，微信也发现了公众号流量的两极化问题，去年把公众号订阅合集改成了信息流，这次又加上了系统智能推荐，算是对头条系算法推荐的一种有限的对抗吧。


    对自媒体人来说，肯定是利好，而且我看到过三次推荐，三个号的阅读量都在1000-5000之间， 也就是说：


    目前的推荐算法，可能更倾向于中小规模的公众号。


    另外，看图片里的样式，很有意思。大部分App内的推荐，都以推荐内容为主，但公众号推荐，主要展示的是公众号名称和简介，文章的展示很弱。


    从结果倒推，我觉得微信团队的想法可能是：


    1. 从性质上说，官方定义是在给你推荐公众号，而不是在推荐文章，不会突然很明显的出现一篇你没有关注的公众号的文章，维护订阅号的订阅本质。


    2. 如果推荐文章，毫无疑问一定会出现大量标题党，更严重的是，系统需要加强对文章的审核，避免推荐违规文章，操作难度更大。相反，推荐公众号就要安全很多。


    总之，目前看来，是对微信创作环境的一个利好。不管外界再怎么说公众号红利消失，公众号仍然是单个粉丝价值最高的内容平台，没有之一，我每个月都能看到新的、有一定成绩的新号涌出。


    我之前写自媒体趋势的帖子

    （https://t.zsxq.com/lMZ37ii) 提到，深度内容是自媒体的最优解，这是官方扶持、变现能力、用户需求三方面的大势所趋。


    希望微信能把系统推荐的算法优化好，而自媒体人，除了好好做内容（获得推荐）之外，可能还得想一个更吸引人的简介了（提高推荐后的点击转化率）。


