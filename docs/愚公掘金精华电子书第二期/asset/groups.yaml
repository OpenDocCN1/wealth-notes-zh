    ## 中国本土快餐行业第一品牌——老乡鸡


    2018中国快餐排行榜，第一肯德基，第二麦当劳，第三汉堡王，全是国外连锁。


    第四是谁？中国的老乡鸡——中国快餐第一品牌。


    我相信很多人都没听过这个土的掉渣的牌子，但老乡鸡目前全国800多家直营店了，而且现在只是在华东华中开店，还有京津冀、珠三角等大片市场等着它去抢占。


    我们今天回看老乡鸡的发展历史，有两点值得所有生意人学习：


    ### 1.好的生意只取一瓢饮


    老乡鸡出自安徽合肥，原先叫肥西老母鸡，2012年改名老乡鸡，升级成快餐连锁。


    其实老乡鸡就是一个中式食堂，一叠一叠的小菜，用户自选几个菜，跟浏阳蒸菜其实有点像，估计很多人都吃过类似的中式食堂。


    相当于中式的肯德基：极致的标准化、流水线点餐就餐、翻台率高、长时间营业。


    我看过身边很多人，都想要开个餐饮店，其中有一批人，有一些本钱，真的去开店了。


    他们开店对标的是谁呢？网红店。


    你在任何一个城市都能看到这种餐饮店，装潢搞的特别小清新，稍微懂点运营的还会花钱写软文推广、找人假排队。


    结果呢？大多撑不了几个月。


    餐饮是门复杂的综合生意，每个环节看上去都不难，但所有的利润，几乎都是从各个环节里抠出来的，这几天要求做餐饮的预算一定要花在刀刃上。


    老乡鸡对传统的中式食堂的升级在哪？


    装修，干净明亮，但不会太高大上；菜品，有几道招牌菜主打，但不追求极致的美味，快餐不需要。


    围绕着“快、干净、好吃”做文章，但又不过分追求品质。


    好的生意做最适合的，不用做最好的。


    ### 2.抢市场要集中火力


    老乡鸡目前的扩张，只在华中华东，其中合肥武汉南京几个重点城市，每个城市超过100家店。


    不在他的势力范围，你可能听都没听过，但在他的势力范围，一定要刷爆市场。


    在广告界，有个亘古不变的规则，就是做广告一定要短时间轰炸，二十年前做保健品广告，电视报纸广告牌一起轰炸，现在世界杯的电视广告，仍然是广告高频重复，一遍遍轰炸。


    老乡鸡集中火力在华中华东扩张，也是一样的道理。


    一方面，进一个市场就要在这个市场站稳；另一方面，这种快餐对供应链要求很高，集中开店有利于给分店供货保证品质。


    老乡鸡说自己2023年要开1500家直营店，我觉得按这个趋势稳定发展下去，完全有可能（看看排行榜的后几名，对老乡鸡没有太大的威胁）。


