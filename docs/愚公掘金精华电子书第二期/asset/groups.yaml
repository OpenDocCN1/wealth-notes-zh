    ## 开展副业一定要评估好成本投入


    **提问：**


    花爷，你好。


    基本情况是这样，我所处的是一个发展还算可以的县级市，消费水平也不错。我自己在国企工作(非编制，工资不高)，想做个副业。


    大概半年多前我咨询了一个艺术类培训的加盟项目。那会总部告诉我加盟类型是区域加盟，但我所在地区已经被加盟了。最近我又接到电话，说我这还没有加盟，问我是否还有兴趣，关于前后不同的说法，那个人


    说因为不是一个员工所以不知道什么情况，现在我这开放了单店加盟，还说总部挺看好我这。我自己瞎猜想，看好他们怎么不来开直营(据我了解，总部有在别的地方开直营)，还有一开始说已经被加盟了，是否有可能是想开直营店，后来综合考虑又放弃了。换言之，总部都不来开，是不是代表风险其实挺高？


    投资费用：前期交给总部的费用在80w左右，预备资金要在200w以上，以后每月还要交1-2w管理费给总部。


    写的有点乱七八糟的，想请花爷帮忙分析下，这个项目的可操作性，谢谢。


    **回答：**


    艺术培训本身是有市场的，你的描述里还是不知道这家品牌有什么核心优势、成功案例之类的，没办法直观判断它值不值得加入。


    但从成本来看，预备200w资金+每月2w管理费这个成本太高了，你这不是副业，是创业了，而且是没个好家底根本玩不起的那种创业。


    而且培训类的运营难度不小，那种慢慢做大的还好一点，没有经验突然开一个很大的培训机构，失败概率很大。


    贴一个花友@小象在星球里之前的评论，他是做木工培训的，虽然和艺术培训不太一样，但是有一点类似之处，仅作参考吧（原链接：https://t.zsxq.com/R3nQ7AM）：


    我是一个木工爱好者，自己有一个工作室在自己做东西玩，之前有一年是在一家木工房做老师，就是教小朋友呀、大学生呀、还有一些团建玩木头做木头的产品。单单说木头的文创产品，现在圈里都卖的很一般，不赚钱。做培训的木工房，你可以去搜一下mylab木艺实验室了解一下，他们做的比较大的。做这个培训，首先是设备的投入和保养，预估一个100-200平的木工坊的话，只设备差不多得15万左右，设备很贵呀，我自己的工作室设备就花了2万多了。然后还有木料（如果对木料不懂很容易吃亏），还有就是房租了，还有电费，空调暖气，还需要懂这方面的老师，这个是投入。收入的话，是按照每次客人来做东西收费，比如做一个梳子200块，做支笔600块这样子。你可以算算需要几年，需要多少次消费可以收回成本（很难）。然后小朋友第一次来玩是会很感兴趣的，因为新鲜或者好动等等，但要他来第二次第三次就就很难了，还要考虑安全问题，毕竟都是锯啊刀啊这些工具。成人会稍微好一点，不过也就一点点，有很多大学生啊年轻人基本都是东西都没有做完然后就再也不来做了。还有一点就是，学生基本上只有周末才会过来做东西，基本周一到周五会很少很少客人，而且还是县城，人少，而且可以接受这一新鲜事物也比较难。确实来说，小朋友这个年纪，做手工是很好的锻炼动手动脑，但对于分数来说没有太大的直观的帮助。所以并不建议搞这个。


