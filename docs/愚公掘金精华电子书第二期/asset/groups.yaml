    ## 从“绿洲APP”说一个重要概念：后发先至


    讲一个重要的概念：后发先至。


    为什么要讲这个概念呢？最近微博出了一款新的社交app“绿洲”，好嘛，大家都疯狂下载体验，你体验就体验吧，偏偏很多人打出了这样一个概念：赶紧入驻抢占风口！获取第一波流量红利！


    这话说的，好像占领市场全靠打劫似的。


    我早就强调大家要有“穿越式思维”，即你假设自己穿越到十年后，再看当下的问题，就会非常明朗。


    一个社交软件如果能兴起，生命周期一般长达5-10年，像微信这种世界会更长。在这个纬度上看，一个月、两个月的时间，完全不值一提。


    微信2011年推出，你能说2011年不玩微信的，后面就没机会了吗？


    微信公众号2012年推出，最火的那批公众号都是2012年入驻的吗？


    抖音2016年上线，为什么2017年才开始大范围的红利期？


    事实上，大部分App或者平台刚上线的时候，连平台自己都没想好以后要干嘛，快手最早是做gif动图的工具，跟短视频一点关系都没有。


    你抢着入驻，除了收获一批跟你一样想获取流量的人之外，不会有更多的益处。恰恰相反，如果你天天盯着这些新平台，闻到流量的味道就到处乱窜，反而没有时间专心练好内功。


    比较好的方式是什么样的呢？


    看到新兴的平台，下载看一看，如果没有特别之处（大概率），就不要管了。等到过一阵子，大家又再度讨论它了，再关注不迟。


    更妙的是，后进场的人可以研究最先进场的人是如何运营的，吸收他们的经验教训，然后利用自己平时积累的内功，进行改良升级，这就是后发却能先至的秘诀所在。


    你可能要问，万一等我听到消息，已经晚了呢？别急，你以为有㶣多人（注：原文似为“很多人”或“少数人”，此处依语义修正为“很多人”或保留原意“你以为有㶣多人”->
    “你以为有㶣”可能是OCR错误，结合语境应为“你以为有很多人”）知道的事情，其实全国还有大把的人不知道，再说了，真有值得关注的平台，这不还有花爷呢吗？


    放心，我一定及时在星球里通知你。


