    \n## 2、保险期限\n\n重疾险和寿险都有终身或者60/70岁等不同的期限，应该如何选择？\n\n同等条件下，终身期限肯定是比买到60/70岁要贵。考虑到你可以把省下来的保费自己去投资，再加上通胀因素，理论上是没有必要买终身期限的。但是，如果你对投资没有足够把握的话，也可以选择终身期限。\n\
    \n## 3、线上/线下\n\n线上成本低，价格便宜，服务也越来越完善。可以参考网购的发展过程，体验会越来越好。\n\n线下，同样的保额，保费贵很多。\n\n\
