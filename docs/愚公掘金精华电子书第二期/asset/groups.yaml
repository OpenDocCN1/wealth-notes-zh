    如果 Costco 性价比之王人设都会坍塌，还有没有真心实意的零售商？


    # 03


    中国黑马，

    把“性价比”做到了极致。


    在 Costco 有一句名言，曾被各路零售行业从业者奉为格言——降低成本最好的办法，就是提高销售。


    Costco 是如何提高销售的？

    Costco 用一笔钱进货之后，一个月之内就能把货物卖出去。这也意味着，同一笔钱，Costco 一年可以周转 12 次。


    而其他同类普通超市，一年只能周转 4 次，极高的周转率才是保证 Costco 成本降低的核心关键。


    在古典零售领域，Costco 已经足够优秀，但是：


    > 如果说 Costco 是汗血宝马，

    那么必要商城就是现代的主马。


    一，是线上电商和线下门店的成本差异。


    中国和美国最大的差异之一是：在美国，地便宜，人工贵。而中国是反过来，地贵，人工便宜。


    Costco 不懂中国，更不懂早已被电商“惯坏了”的中国网民：


    | | 在必要买东西 | 在Costco买东西 |

    |---|---|---|

    | 会员费 | 无 | 299元 |'
  - '[PAGE 762]


    | 停车场 | 无 | 3小时 + | 30元起 |

    | :--- | :--- | :--- | :--- |

    | 排队时间 | 无 | 2小时 + | |

    | 来回路费 | 顺丰包邮 | 2小时 + | 打车费平均80元 |

    | 体力消耗 | 很少 | 累到趴下 | |

    | 库存消耗 | 及时、小而即食 | 大、吃不完、浪费 | |

    | 性价比 | 省心、成本定价 | 比必要贵30%以上 | |

    | 退换 | 响应快！差评超1%商品立即下架！ | 2小时 + | 排队退卡！ |


    二、两家公司都强调砍掉“中间环节”，但必要商城是砍掉“所有中间环节”。


    在竞争激烈的国际环境督促下，中国高端工厂早已发展到和日本、德国一致高下的地步。


    越来越多的品牌，只不过是在中国工厂的研发、中国工厂的设计、中国的产品上，贴了个商标，然后再以几十倍、再卖给中国人而已。


    其实，美国 Costco 上面大部分的商品和中国必要商城上的商品的“诞生地”都是中国。


    商品往往从工厂，到了经销商手里，再到品牌、Costco、消费者，中间经过了层层的传递，每个环节都意味着成本的增加。


    有什么比从工厂直接发售到消费者手中成本更低？


