    # # 花爷梦呓换酒钱


    让一部分中产先冲破天花板'
  md: '

    这段时间我利用自己的学习和搜索能力，疯狂探知各种可能赚钱的生意，也由此接触了很多接地气的玩法，但我也和你们一样，沮丧地发现：


    内心非常浮躁，好像知道不少，但又没有哪件事干得很好。其实很多生意，你看上去是能一个月就大赚一笔，其实人家已经积累了很多年。


    于是痛定思痛，开始只做自己擅长的事，并且注重长期盈利。


    第一桶金是做微信生态的电商赚到的。那时候微信公众号生态带货很火，我这人比较能写，一开始是自己写，自己找货源，朋友的公众号友情帮我推了，没想到小赚了一笔。


    后来就是不断的选品、找关系、合作推文，比较忙的时候开始拉了小伙伴兼职一起做，最爆的一次，一篇推文卖了100多万流水。


    但这种模式还是有严重的问题，极度依赖渠道，必须要跟有粉丝有影响力的号合作，有不少渠道消耗的都是我的人际关，并不持久。


    收入上因为对渠道有依赖，也不是特别高，那段时间刨去给团队成员的工资，我年收入也才五六十个，赚钱比较低效。


    我又开始寻找更好的方向，必须是那种能长期积累资源和影响力、在产业里有一定话语权的方向。


    最后我找到了现在正在做的事情，自媒体。


    ## 4. 自媒体，科学、实在的帮花友培养赚钱的能力


    选定自媒体这个方向之前，其实花爷做了不少尝试，包括公众号、短视频、微博、基于微信的团购等等，大概花了四个多月的时间，把每个方向都尝试了一遍，每个方向里的不同的策略，我又都尝试了一遍。


    你能想象么，在那小半年时间里，我每隔两三天做总结，内容都是“xxx策略失败，接着试下一个策略”……


    现实就是这样，失败才是常态，成功才是偶然。把一件事情做成，就是这么无趣，你要做好失败99次的准备，但只要成功1次就够了。


    有意思的是，在不断尝试之后，有好几个方向我都跑通了，甚至有的已经获得了现金流收入。


    这其中的过程我都在文章里写过，这里就不赘述了： [我折腾的这一年](#)


    最终，我还是选择了自媒体这个领域，理由很简单：尝试了一圈，我发现还是做自媒体时，自己觉得最自在。


    这个世界上有潜力的领域有很多，不用眼红别人的成绩，你最终还是会回到让你最舒适的那个领域。


    做自媒体那会儿，我看了不少经济金融的书，花了一段时间写了一篇：（删后重发）借鉴美日：经济下行时，什么行业还在赚钱？


    一开始发出来没什么效果，后来有次不经意，在曹大的知识星球里发了一下，一下子火了。我的第一篇文章阅读量就破万了。


    再之后连写几篇，粉丝一直在涨，而且我的粉丝质量比较高，有些大佬加了微信上来就是转账888要交个朋友，搞得人非常懵逼……


    写文章的过程中我也发现，大家普遍还是对赚钱、拓展收入来源比较感兴趣。


    有句话很流行，叫教人赚钱的人才是最赚钱的。这个行当割韭菜的人确实非常多，但是人们的需求是客观存在的，难道真的没有科学的、实在的能够培养人赚钱能力的方法吗？


    花爷根据自己经验，把一个人的提升分成了四个阶段：


    - 一开眼：


    大多数的中产、白领、中小生意人，在自己的领域钻了太久，已经形成思维定式了。偶尔抬起头，想做点事情的时候，懵圈了，不知道该干嘛。


    我们缺的不是大道理，而是眼界、实例推演、和细节。


    - 二复制：


    将别人案例中的技巧，移植到你自己的领域里。虽然前几次移植尝试，大概率会失败。


    - 三贯通：


    失败的历程，会转化成经验，成为你的虚拟资产。你开始更深入的理解了商业、社会和人性本质，理解社会运转的元规则。


    贯通后的你，不一定能马上变现，但在能力、分析、情商上都会有巨大的提升。


    - 四跨越：


    贯通的人，最终会找到一个合适的领域，将自己 的思维、方法变现。


    这个阶段有早有晚，甚至可能需要一点运气。


    有意思的是，大多数人从贯通到跨越，都不再完 全从事自己原先专注的领域。


    我的社群、公众号文章，大多基于这个体系，所 以我的粉丝气质也比较正，相比一夜暴富，我们 更愿意相信长期盈利的价值。


    后面的事儿就水到渠成了，公众号开了三个月， 粉丝一直在催做付费社群。为了保证质量，我还 是先做了一个多月的内测，内测只有六十多人， 效果还不错，所以开放了社群的公开报名。


    报名一放开，当天就满了1000人……


    现在花爷的公众号粉丝也不多，1.6w，因为电商那块我还在跟进，比较忙，文章更新的少。我的付费社群用户1600人，超高的付费转化率，而且用户口碑一直不错。有了这块的加成，我的年收入终于艰难的超过了100个，我自己复盘写下来都感觉好累……


    你说收入增加之后，生活有啥本质区别吗？其实没啥区别，我消费欲望不高，也就是以前爱吃榴莲买的时候会犹豫，现在想吃就吃了，我管这叫榴莲自由……


    现在我已经把团队的重心慢慢往自媒体转了，明年会更体系化的做好不割韭菜的培训体系。当然，我从来不强迫诱导用户付钱，想看免费内容的，公众号还是可以继续看。不吹牛，我的文章质量确实还可以，不然也不会粉丝这么认可。


    其实还有很多内容可以跟大家分享，比如一直有人问我，我怎么做到在更新文章这么少的情况下，维持如此高的粉丝黏度和付费率的？有没有什么技巧？但今天咱们的时间也有限，就不说了，下次再有机会再给大家分享吧。（花爷补充，这部分内容会在我们愚公掘金星球里更新）


    最后送各位朋友一句话，共勉吧：


