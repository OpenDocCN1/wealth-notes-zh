    \n# 二、红利ETF（代码510880）\n\n天呀，我竟然荐股，会没朋友，不不不，这不是股票，这是基金。基金现在可是林林种种加起来几千几万 个了，为何我唯独推荐它，且听我慢慢道来。\n\
    \n## 1、红利ETF是什么\n\n讲概念都是比较无聊的，大家忍一下下，它是一个场内交易的主题型指数基金，这里有四个关键词，场内、主题型、指数、基金，我一个一个解释一下。\n\
    \n指数：是由指数公司，根据不同的筛选条件筛选出的一批股票组成一个股票组合。\n\n主题型：指数还根据不同的筛选条件分不同的指数类型，比如本例中的红利主题指数，指的是筛选股息率高、分红比较稳定、具有一定规模及流动性的一些股票组成的指数。\n\
    \n基金：基金分很多类，通俗的理解就是，基金经理拿投资人的钱去投资什么，这个基金就叫什么基金，比如投资于股票市场，那这个基金就叫股票基金（本例中的红利ETF为指数型基金，属于股票型基金的一个细分类里）。\n\
    \n场内：基金投资有两个大类渠道，场内和场外，场就是指证券交易所，通过券商在交易所内交易的，叫场内，交易方式就是即时的买卖。\n\n通过第三方平台如蛋卷基金、天天基金网，或者通过银行、基金公司官方网站等进行申购的，叫场外，交易方式为申购和赎回。\n\
    \n由于上面的这些特殊，它拥有一些特殊的优势\n\n（1）永远上涨，指数的背后是一家家鲜活的上市公司，上市公司承担的是国家经济发展的主要角色，公司的资产跟着国家GDP和通胀率在上涨，因此，长期来看，只要国家的经济不断发展，这个指数就跟涨，如果你看好中国，那就可以安心投它。\n\
    \n（2）自我代谢，指数的编制规则，每过半年或一年就要更新筛选结果，也就是更新股票组合，差的踢掉，筛选进新的符合条件的进来。\n\n（3）抗黑天鹅，因为指数的筛选机制的原因，天然分散风险，分散在不同行业不同市值不同成份股上面，来自个股、行业的黑天鹅，都不怕的。相反，一旦遇到个股黑天鹅，导致指数的短期内暴跌，反而是补仓的好机会，因为在半年或一年更新组合时会筛掉这只不符合条件的个股，纳进好的，指数短期内就会补涨。\n\
    \n（4）收租稳定，最近F.I.R.E（Financial independence, retire early）风靡一时，这个英文直译过来就是财务独立，提前退休。\n\
    \n做法就是，过极简生活，本金攒到年支出的25倍时，通过投资年化收益率为4%的稳定无风险的投资品，每年拿投资收益当成生活费，实现财务自由，提前退休，做自己想做的事。\n\
    \n这非常像用25倍年支出的这笔本金买了一套房，然后出租，每年租金是4%，但是现实中，特别是我们国内，4%的租售比（年租金/房价）是找不到的，基本上都在2%以下，而红利ETF就是个非常不错的替代品，我们来看下它的历年分红。\n\
    \n| 分红年度 | 权益登记日 | 除息日 | 派息日 | 每10份收益单位派息（元） |\n| :--- | :--- | :--- | :--- |\
