    你想要证明什么，都能找到数据支撑，一定能。


    比如这个89%的数据，来自西南财经大学 的调研，全国样本量是多少？8438个。你说这点样本量代表全国，你信吗？'
  - '[PAGE 740]


    为了表面数据好看，国内官方给出的自有住房率从2010年开始就一直没有高，但是大多在混淆概念。再说了，有自有住房，不代表有居住质量。


    最近几年，大家一个明显的感受就是，身边朋友家里没房的，真的不多了，反倒是小城市，家里几套房的大有人在。写这段话的时候我回想了一下，老家的身边朋友好像没有低于每家两套房的，我自己家里拆迁拿了三套房，说起来很霸气，其实值不了多少钱，权当给爸妈当养老金了。


    但另一方面，一线城市的房子还是难买，买了五环想住四环，住了四环想进三环，不住到城墙边都不算满足，剩下夫妻双方六个钱包都凑不够最低首付的，只能租房子再撑一撑或者退回二线了。'
