    # 花爷和大家讲讲视频号现在怎么样，还有没有机会？


    年前讲自媒体的趋势（https://t.zsxq.com/lIMZ37ii），我们提到了微信视频号，如果做起来的话，可能会成为自媒体的标配。


    年后有花友来问，花爷，视频号现在怎么样了？有机会吗？


    1. 视频号还没到all in进场的时候。


    就我最近几周的观察来看，视频号还远不到成熟的时候。一个内容生态想要繁荣起来，必须满足以下几点：


    - 流量分发机制，必须能刺激创作者去创作内容。


    流量怎么分发，是一个内容生态最关键的问题，早期微信是靠社交分发的，有一个社交流量红利期，而现在抖音和头条是靠算法分发的，微博则是靠算法+KOL节点分发的。


    无论如何，必须要把流量给到生态鼓励的好内容上去，而且是一大批好内容上去，才能刺激创作。


    现在视频号的分发机制还没有定型，社交流量的红利已经几乎没有了，算法分发又不成熟，大量的视频号拿不到流量，这是最致命的问题。


    大家现在去看视频号，同一个视频，在视频号的数据要远远低于抖音。


    - 已经获取的流量，要有足够丰富的变现手段。


    这点其实微信不用担心，因为微信用户的流量价值是所有生态里最高的，只要微信愿意打通视频号和公众号/个人号/微信群，就不愁变现方式。


    这一点，不是微信做不到，而是目前微信不愿意做。


    基于以上两点，视频号还不值得我们当成主战场all in。


    多说一句，每次一个新的内容生态出来，就有一批导师说接下来会有巨大的红利，不抓住就错过了，一听就让人上头。


    公众号是2012年成立的，一直到15年都还称得上是红利期，抖音是16年上线的，真正的爆发期是17、18年，一直到现在全球用户数还在增长。


    其实每个内容生态的红利期，都不是在最早期，而是在创立之后的一段时间，等到各种机制、策略成熟了，才迎来爆发期，而且红利期的时间会很长。


    2. 已经在做短视频的，可以进场视频号。


    不值得我们all in，但已经在做短视频的，可以把视频号当成一个同步内容的平台，把自己的短视频搬运过来，操作成本很低。


    想要申请内测开通企业视频号的花友，可以通过下面的二维码申请。有花友测试过，已经申请成功了。


    3. 相比于视频号，微信直播在短期的价值可能更大。


    花爷之前在一个问答里说过，2020年的电商需要不断增加和用户的触点，直播（售前触点）和微信（售后触点）慢慢会成为电商的标配（详情见：https://t.zsxq.com/uz76UNR）


    在这个前提下，微信直播在短期对普通生意人的价值会更大，毕竟淘宝直播去年是什么成绩，大家都有目共睹了。如果电商卖家自己有微信用户池，用微信直播带货一定会比普通的群拼团效果更好。


    对微信直播感兴趣的，建议关注腾讯直播助手公众号，申请直播权限。（不要催我直播，金城武还没准备好露脸……）


