    \n# 花爷梦呓换酒钱\n让一部分中产先冲破天花板\n\n# 个税、社保、公积金的那些事儿\n\n**分享嘉宾：** 上善若水\n\n**分享：**\n\n\
    假设小花粉一个月工资1万元，在抖音培训机构兼职讲课的收入每月有5000元，在报刊上发表了几篇营销类文章取得收入3万元，有一套房出租每月5000元，女朋友闹着要抽奖于是买了一张彩票中了5万元，2019年炒股共赚了5万元。\n\
    \n请问小花粉哪些收入要交税？他需要汇算清缴吗？\n\n如果换成是你，你知道你的哪些收入是已经交过税的？交了多少？哪些收入压根就不需要交税？这里就需要把个人收入划分成不同的类别，不同类型个税计算方法不一样，专业人士叫它“综合所得”税目。\n\
    \n另外，什么叫汇算清缴，就是，我们每取得一笔收入，给钱的一方一般都会先预扣个税，比如我们的工资，单位都会先扣个税，然后再发到我们手里。\n\n但是有些人，不只是有工资或者压根没有工资，全来自兼职收入，或者中途换了工作单位，等等，这些情况就可能涉及补税或者退税，这个补税或者退税的过程就叫汇算清缴。\n\
    \n# 一、什么是综合所得\n\n个人的收入分为以下九项，只有第1至4项是要纳入汇算清缴的。\n\n**表一：**\n\n| 税目(项目) | 内容 | 方式\
    \ |\n| :--- | :--- | :--- |\n| 1.工资、薪金所得 | 个人因**任职或者受雇**而取得的工资、薪金、奖金、年终加薪、劳动分红、津贴、补贴以及与任职或者受雇有关的其他所得\
    \ | 每月/次预扣预缴 + 年终汇算清缴 |\n| 2.劳务报酬所得 | 个人独立从事各种**非雇佣**的劳务所取得的所得。包括设计、装潢、安装、制图、化验、测试、医疗、法律、会计、咨询、讲学、新闻、广播、审稿、书画、雕刻、影视、录音、录像、演出、翻译、广告、展览、技术服务、介绍服务、经纪服务、代办服务等\
    \ | 每次/月预扣预缴 + 年终汇算清缴 |\n| 3.稿酬所得 | 个人因其作品以图书、报刊形式**出版、发表**而取得的所得 | 每次/月预扣预缴 +\
    \ 年终汇算清缴 |\n| 4.特许权使用费所得 | 个人提供专利权、商标权、著作权、非专利技术以及其他特许权的使用权取得的所得 | 每次/月预扣预缴 +\
    \ 年终汇算清缴 |\n| 5.经营所得 | 个体工商户、个人独资企业、合伙企业、企事业承包等生产、经营所得 | 按年分项计算申报 |\n| 6.利息、股息、红利所得\
    \ | 个人拥有债权、股权等而取得的利息、股息、红利所得 | 按次分项计算申报 |\n| 7.财产租赁所得 | 个人出租建筑物、土地使用权、机器设备、车船以及其他财产取得的所得\
    \ | 按次分项计算申报 |\n| 8.财产转让所得 | 个人转让有价证券、股权、建筑物、土地使用权、机器设备、车船以及其他财产取得的所得 | 按次分项计算申报\
    \ |\n| 9.偶然所得 | 个人得奖、中奖、中彩以及其他偶然性质的所得 | 按次分项计算申报 |\n\n# 二、综合所得费用扣除\n\n2019年出的个税新政策，大家都很开心，因为有一个专业词汇“专项附加扣除”冒出来了，大家可以少交税了。那怎么个扣法？有哪些项目？请参考花爷文章《22个问题看懂个税抵扣》，链接\
    \ https://mp.weixin.qq.com/s/cYFrVxbby3N1NN2PPWNA-w\n\n**图一：**\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_43_0.png)\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_44_0.png)\n\n用上面那个小花粉的例子来讲解这些“费用扣除”到底怎么用：\n\
    \n工资1万，每个月（专项扣除）社保和公积金1700，有一个子女和一套房贷（专项附加扣除）1000+1000=2000元，那么小花粉单位当月预扣个税 (10000-1700-2000-5000)=1300，乘以\
    \ 3% = 39元。\n\n对于<专项附加扣除>这一块讲几点花爷没提过的：\n\n1. **问：范思辙2019年办理了专项附加扣除，2020年想继续在原单位办理，该怎么办？**\n\
    \   **答：** 需要在今年12月份及时关注前期填报信息的变化情况。如有变化要及时修改；如果没有变化也可不进行修改，系统会自动将2019年填报的信息延长至2020年。\n\
    \n2. **问：费介年初在鉴查院上班，年中换了家单位，如何操作专项扣除？**\n   **答：** 如果中途更换工作单位的，一定要记得在个税APP上修改相关信息（怎么操作后面会讲），改为新单位作为你的扣缴义务人，否则新单位无法给你扣除。另外，如果是一次性扣除的，比如职业教育，原单位扣除了新单位就不能重复扣除；如果是分月扣除的，不能同一月份重复扣除。\n\
    \n3. **问：范闲因为工作太忙，2019年没有及时把父亲年满60周岁的资料提交上去，导致没有扣除专项附加，怎么办？**\n   **答：** 范闲父亲10月份就已经年满60周岁了，范闲可以在11月份时扣\
    \ 2*2000=4000元，或者在2020年汇算清缴时再扣，建议前者。另外，1个老人扣2000元，2个老人也是2000元，跟人数无关。\n\n4. **问：滕梓荆月薪2万，妻子月薪5000元，女儿的教育费以及房贷，是一方扣还是各50%扣？**\n\
    \   **答：** 选择工资待遇高的一方全额扣除。因为个税是按7级累进税率计算的，工资越高，缴纳个税越多，我们就越要想办法把基数降下来。\n\n5. **问：五竹为了提升竞争力，2020年开始攻读在职研究生，但是2019年没有这块扣除，怎么操作？**\n\
    \   **答：** 从拿到录取通知书当月起，就可以申请每月扣除400元。其他情况比如2019孩子没上学，2020年9月孩子开始上学了，都是自符合条件的那个月起就可以扣除，只是需要到个税APP里添加相关信息（怎么操作后面会讲）。\n\
    \n6. **问：林婉儿旧疾复发，2019年年底住院，到2020年年初才出院，这个可以在2019年扣吗？**\n   **答：** 大病医疗不像子女教育等其他几个项目，可以每个月预扣，大病医疗只能在汇算清缴时扣除。像这种跨年的，只能以医疗费用结算单上的结算时间为准，一般是在2020年出院时才结算，所以属于2020年的专项扣除。大病医疗可以扣自己的、配偶的和未成年子女的，谁工资高扣谁的。\n\
    \n7. **问：王启年有一套房子在还款，但是没有做专项扣除，2019年10月瞒着老婆又贷款买了一套，可以扣除吗？**\n   **答：** 税法规定：每个家庭只能享受一次首套住房贷款利息扣除，但是这个首套并非特指第一套房，也可以是第二套房的贷款（但必须是按首套贷款利率贷款买的）。扣除的前提是第一套房没有贷过款或者贷过款却没享受过这个扣除政策，这种情况下第二套是可以申请每月1000元的专项扣除的。\n\
    \n8. **问：司理理作为北齐贵妃，享受北齐给的高新待遇，自己在京都又成立一家公司招揽客户，赚着双份工资，这个情况怎么作专项扣除？**\n   **答：**\
    \ 如果同时从**两处以上**取得工资、薪金所得，一个纳税年度内，只能选择从其中一处申请专项扣除。\n\n9. **问：京都第一才女范若若因精通琴棋书画，虽没有专职于任何一家公司，但是常年约稿不断，这种情况可以申请专项附加扣除吗？**\n\
    \   **答：** 如果没有取得工资、薪金所得，仅取得劳务、稿酬或特许权使用费所得，又需要享受专项附加扣除的，应当自行报送相关信息并在办理汇算清缴时扣除。\n\
    \n# 三、哪些人需要做汇算清缴\n\n简单总结一下：就是要么补税要么退税的人群，才需要做汇算清缴。\n"
