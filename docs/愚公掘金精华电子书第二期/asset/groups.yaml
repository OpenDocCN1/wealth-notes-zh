    ## 售后评价对公司改进工作有帮助么？差评对骑手的惩罚影响大么？


    **提问：**


    花爷，你好，今天想问问外卖平台的几个问题。


    - 1. 我很好奇如果骑手超时送达，或者是「提前点送达」在公司里面的惩罚严重吗？

    - 2. 平台的售后服务是真的很对公司有改进帮助吗？每次投诉之后，平台只会发无门槛红包打发消费者，超时以及「提前点送达」的现象依旧不减。

    - 3. 这个会不会是平台售后的某种策略？违规的骑手订单那么多，能发现超时或者「提前点送达」是其中一小部分人，其中愿意花时间去投诉又是更小一部分人，每次的成本就是5块钱无门槛红包，相对用户买了「准时赔」的收益，成本很小。

    - 4. 用户越来越不敢打差评，平台的改进行动力会不会越来越差？


    **回答：**


    我觉得这个事儿网上讨论的方向有点跑偏了。


    首先，大家现在应该都知道一个概念，叫做平台性的矛盾转移。


    比如点外卖，平台给了用户不合理的预期，结果骑手完不成，用户给差评，而平台又规定，一个差评会扣掉骑手一整天的工资。


    很显然，这样的规则是不合理的。但在现实中，矛盾往往不会指向平台，而是转移到用户和骑手之间，骑手觉得用户不通情达理，用户觉得自己理所当然，平台的过错就被短暂的忽视了。


    以上是你们经常看到的逻辑，对，但不完整。


    事实上，外卖平台的规则一开始确实不合理，但别忘了，每一方都拥有不断动态调节的能力。


    外卖平台想长期良性发展，一定会改善自己的规则，不然用户和骑手也不是傻子，可能被你忽悠一次，不可能被平台忽悠一辈子。


    规则如果长期不合理，骑手可以用脚投票，大不了不干了。但事实是什么？骑手和外卖生意还在不断增加，这行的赚钱能力是超出规则不合理带来的弊端的。


    比如，以前骑手一个差评确实要扣几百块，但据我所知，现在一个差评只扣几十块钱了。你看，平台也在不断调整规则，生态内的几方都在相互适应。


    当然，对这次事件，我的观点很明确，不管是罚几百还是几十，都不应该发展到杀人的地步，太过了。


    所以：


    - 1. 售后服务会让平台改进吗？ 当然会。

    - 2. 售后服务可以解决所有的售后问题吗？永远不能，解决收益永远必须大于解决成本，否则平台不会有动力推行。


    无论是发优惠券还是骑手给你打电话道歉，都只是在成本接受范围之内的一个最优解，而不是让你100%满意的完美方案。


    3.那一些人觉得很重要、但平台没有动力去改进的问题怎么办？


    好问题，一般这种情况，就需要严重的爆发性事件才能引起平台的重视了。比如……在去年重庆的公交车冲入大桥坠河之前，有多少人觉得对司机动手是件不可饶恕的事情呢？


