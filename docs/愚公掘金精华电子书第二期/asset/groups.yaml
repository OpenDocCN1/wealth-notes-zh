    ### “金花奖”挑战：美团为什么放弃摩拜IP改出美团单车？


    #### 挑战提问


    美团为什么放弃摩拜改出美团单车？


    最近家里楼下突然多了很多美团的黄色小单车，明明美团已经花了大价钱收购了摩拜，为什么要放弃摩拜一直营造的品牌和培养的忠诚用户，改出美团单车？


    ## 花爷回答


    迟早的一件事，你得明白美团的商业逻辑是什么。


    阿里也投资收购过很多公司，最出名的莫过于饿了么，阿里的策略是什么？你发展的够好，行，你可以独立发展，但你的用户数据和流量必须接入到阿里，因为阿里的业务大多和钱有直接关系，接入可以进一步拓展用户价值。


    当然，还有一点原因是阿里的数据研发能力实在太强了，前阵子跟朋友聊天，说天猫国际本来准备吞掉考拉，吞掉之后最大的区别是啥？考拉原来一百个程序员要做的事，接入阿里的计算系统可能只要十几二十个人就能搞定了。


    所以阿里像一座主城，周围都是卫星城，每一座卫星城都要跟主城连接。卫星城把血液输送给主城，主城加工出来后再输送回去，整体性更强。


    腾讯也投资收购过很多公司，腾讯的策略是什么？纯粹的辅助策略，你发展你的，必要的时候我可以利用社交关系给你导导流量，具体发展的怎么样还得看你自己，更像是投资逻辑。


    所以腾讯也是一座主城，但下属的城邦离他都远着呢。你缺人缺粮，主城给你输送一点，要是扶持不起来，你就自生自灭去吧，反正下属的城邦多了去了。


    最后说美团，美团一直想做一个衣食住行的生活服务平台，它要的是什么？它要你跟生活服务相关的一切，都想到美团。


    所以美团也是一座主城的话，它吞并的每一块版图，都要归入主城所有，这样才能扩大美团的服务范围。你看，除了团购，美团还出了打车、点餐、酒店，而且都发展不错，打车业务仅次于滴滴，酒店业务的间夜数已经超过了携程飞猪。


    只要跟生活服务相关的东西，它都要吞进去，吞的行业越多，它在生活服务领域的盘子才能越大。


    所以美团收购摩拜，本来就是出行里的一环，跟美团打车的性质一样。但现在的问题是，很多人压根还不知道摩拜属于美团，这不等于白收购了吗？


    所以摩拜有一天一定会改名美团，不光是改名，连用户都要往美团上去导流。只不过摩拜之前的品牌知名度太高，不太好吞并，但没关系，慢慢来，迟早要有这么一天的。


