    ### “金花奖”挑战：有100个特权的全球骑士卡的商业逻辑是什么？


    #### 挑战提问


    一直在潜水，试着挑战一下，哈哈~花爷，我最近总是在微博看到有一种全球购骑士卡，原价299，现在活动免费送只要12块邮费，说是“汇聚24国大牌优惠，超100项尊享特权”，这个卡是真的么，花爷拆解下它的盈利模式呗，谢谢！


    ![](img/62659df0b3729b5d99b589094fb4b8b0_777_0.png)


    ## 花爷回答


    这个骑士卡是前段时间微博最火的代理广告了，很多热门微博评论里都有，给花友们看个骚套路，见下图。


    这个骑士卡的策略组合确实非常棒，说几个重要的点：


    1. 黑金骑士卡，本身应该是模仿美国运通的百夫长卡（人称卡中之王），总之就是外表各种高大上，极度满足人的虚荣心。


    2. 卡不要钱，只要12元邮费，其实邮费+制卡费应该低于12元，也就是说光卖卡也是赚的，这是第一吃。


    3. 一般领卡之后，会让你下一个App，里面有很多购物优惠。花友们，你们知道一个电商类的App的获客成本有多高吗？


    淘宝京东的App新用户获客成本都是几百元，而这个骑士卡，用户自己掏钱买卡，顺带下载App，App获客成本几乎为0，这是第二吃。


    4. App里确实有些优惠产品，这些产品怎么来的？


    一方面有些产品渠道，本身就有优惠，只是大多数用户不知道而已，骑士卡把这些优惠资源整合在一起，赚取一波信息差。


    另一方面，有些商品走的是淘客的佣金模式，也就是说商家和骑士卡合作，不仅给价格优惠，骑士卡官方还要拿一部分佣金，这是淘客的商业逻辑（不懂淘客的回去复习：[https://t.zsxq.com/62BAuZB](https://t.zsxq.com/62BAuZB)）


    这是第三吃。


    一边用骑士卡的虚荣积攒用户，一边拿着用户量和商家谈合作、佣金推广，最后一鱼三吃，把整个模式跑通。


    一个好的商业策略，只要找到线头在哪，就能牵着线头把每个环节跑通，形成一个闭环。这是花爷之前提过的、典型的滚雪球的模式。


