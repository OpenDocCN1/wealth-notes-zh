    # 为什么做培训的老师，自己不去做生意，而是培训别人做生意呢？


    前几天，群里有个花友深夜问了个问题，非常有意思。


    他问：为什么做培训的老师，自己不去做生意，而是培训别人做生意呢？'
  - '[PAGE 570]


    类似这种质疑，网上非常多，大家都说，要是赚钱人家会教你？还是教人赚钱的最赚钱！


    我回复他，这个问题其实挺简单的，我反问你两个问题，你回答我之后，你就懂了。


    第一问题，假设现在有个生意，有50%的概率能赚一万块，学费500，不是骗子，你觉得有没有人愿意学？（50%是当时随口编的，我觉得能有个10%，花500就不冤）


    花友说，愿意，500不贵，花了就花了。


    第二个问题，假设你有这个生意的经验了，做生意你赚一万块，做培训你猜赚多少？


    花友这次直接说，他懂了。'
  - '[PAGE 571]


    道理其实很简单。人到了一定程度，会不满足当下的利润，需要想办法突破当下的收入瓶颈。但恰恰是这个人觉得不满足的利润，可能是大把普通人梦寐以求的，很多人甚至连十分之一都达不到。


    很多人觉得，老师是把自己的东西倾囊相授，但其实并非如此，稍微有点能力的培训老师，比学员要 high 好几个等级。


    他教你一些基础的东西，你用学到的东西，能够搏一个成功的概率，你的学费就值了。


    我们再反过来想，越是告诉你暴利的、没有门槛的、百分百能赚钱的，越是骗子。真正的好老师，会告诉你要学哪些东西，学了能干嘛，把收益给你描述清楚。'
  - '[PAGE 572]


    这就好比你上中学，一定能考清华北大吗？不一定，但你不会觉得中学学费花得冤枉，因为中学校长最多告诉你咱们学校每年能考10个清华，不会许诺你什么。


    如果一个学校，告诉你不管什么成绩，只要上了这所中学就一定能上清华，你觉得可能吗？不可能，但可以肯定的是，这所学校学费会很贵。


    之前有花友微信感谢我，说自己付费加了不少圈子，觉得帮助最大的还是花爷。还有花友来问我，把星球口碑运营好，有什么秘诀。


    花爷有什么诀窍吗？如果有的话，可能就三点：


    1.我确实能写一点对大家有帮助的东西。


    2.我愿意坚持输入，我作为星主的输出量，在所有星球里应该也能算是最多的一档。'
  - '[PAGE 573]


    3.我不管提供什么服务，描述和实际服务都是基本一致的，不喜欢瞎吹牛逼。


    合理的控制预期，不要把用户当傻子，真诚才是最好的套路。


