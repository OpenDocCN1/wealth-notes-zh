    - 2. 虽然鲜丰、百果园这种水果店，比一些小店的价格普遍要贵一点，但它们每天都会有几款团购的水果很便宜，做引流款，保证中低端用户的黏性。\n- 3. 全国大批量的连锁店开业，基本上连四五线城市都有，大量的采购量反向压低了总部采购水果的价格。\n\
