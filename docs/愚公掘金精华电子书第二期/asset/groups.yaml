    ## 在小县城车站旁开小卖部利润可观吗？都需要调研些什么呢？


    **提问：**


    花爷，我在洛阳偃师，一个五线小县城。这里新汽车站年后要投运了，在车站旁开个小卖部利润可观吗？开之前都需要调研些什么呢？


    **回答：**


    利润可不可观我不知道，只能跟你说说可以调研哪些数据做参考。


    营收上：


    - 1. 新汽车站的客运量，这个一般规划文件里会有预计吞吐量。

    - 2. 如果怕规划文件的预计吞吐量不准，可以再看一下新站的线路规划，对比以前老站同样线路有多少人流。比如老站被完全撤除，新站在原有基础上增加线路，且新站位置不偏僻，那新站吞吐量肯定比老站大，而老站的吞吐量是能查到的。如果老站不撤，新站老站有相似的线路和班次，那新站跟老站的吞吐量应该相当（位置不偏的情况下）。

    - 3. 人流量的转化率，直接去老站蹲个一天，就能估算出老站小卖部门口的人流量和购买人数，两者相除就是转化率。

    - 4. 客单价，同样是蹲点估算，不用太准确，大概就行。


    当然3和4你直接想办法去找老站小卖部老板聊会更方便。


    成本：


    - 1. 房租，新站怎么交租，几年一签，水电费用等等。

    - 2. 装修，装修损耗也是成本，新手容易忘，你就当每年折旧30%好了。

    - 3. 人力，不管是自己看店还是招人，都要当成人力成本算进去。

    - 4. 货物成本，大部分小卖部的毛利率差别不大。


    上面这些成本应该都不难查询到。这样算下来，就有了最简单的公式：


    日均人流量*转化率*客单价>日均成本，当这个公式成立时，你才能够盈利。


    对新站来说，日均人流量的数据是最难估算的，没关系，你把自己测算的转化率、客单价、日均成本都带进去，评估一下要让这个不等式成立，日均人流量至少要有多少。


    这时候会有两种情况：


    - 1. 要让不等式成立的日均人流量数字不大，新站肯定能够满足，那肯定值得去干。

    - 2. 要让不等式成立的日均人流量数字非常大，大到比新站所有班次的载客量之和还要大，那肯定不能干。

    - 3. 要让不等式成立的日均人流量数字算出来，新站可能达到，也可能达不到，这时候你就要做好两手准备，想一想，你的成本还能不能压缩？你的客单价还能不能提高（有的车站卖稍微贵点不会影响销量）？你的转化率能不能提高（增加新的品类比如热饮食提高购买率）？


    很多生意到底都是一堆一堆的公式，反复的测算、改进其中的数值，直到利润的数值不断扩大。把上面的问题搞清楚，相信你对能不能开店就有一定的把握了。


