    ## 跳槽后遇到瓶颈？努力不懈才是常态，机会留给有准备的人


    **提问：**


    花爷，本人年近35，近来非常迷茫。30岁转行做互联网，传统企业的互联网。结果可想而知。勉强支撑几年后转型失败。我被塞进后台部门，行政人事之类，打杂岗。本身仅有的互联网经验，还都是失败的经验。加上大环境不很好，跳槽其他互联网公司的难度很大。互联网从业者偏年轻化，比体力脑力都比不过。所以近一年来混迹后台部门时一直在思考是否就此从业务部门转到后台职能部门。但是传统民企，管理相当混乱，职能部门干的活，跟流水线上的工人没差别。很原始。不用动脑子，机械式干活。跟我想职业转型差距太大。所以想咨询花爷，我如何选择我后半生的职业呢？继续无脑干活累计经验？还是尽早跳互联网企业？还是直接跳中小企业的职能岗？


    **回答：**


    我想反问两个问题：


    - 当初30岁你毅然转型互联网，为了什么？

    - 你说现在的环境，跟你理想的职业差距太大，那么，你理想中的职业是什么样的？


    如果你只看到互联网行业钱多，看不到需要付出的努力，那职场当然不会给你期待的馈赠。


    在你的描述里，你不成功的理由包括：


    - 因为是传统互联网公司，所以转型失败，被塞进后台部门

    - 跳槽失败，因为大环境不好

    - 互联网行业年轻，脑力体力比不过年轻人

    - 传统民企业管理混乱，跟你想到的职业转型差距大


    全是外界因素，没有一句话在主观上找自己的问题。


    进入传统互联网企业，为什么被塞进后台部门的是你？


    哪怕公司环境不好，用业余时间努力从而跳槽的也大有人在，为什么这个人不是你？


    公司越是一摊烂泥，奋进的人越努力往外跳，为什么你还在犹豫？


    我也不想把话说太重，但你这个年纪，需要有人把你骂醒。


    想一想，从30岁转行到现在快35了，至少三四年过去了，你闭上眼睛，过去几年的工作历历在目，你有没有过为了30岁的目标而咬牙拼命的时刻？有没有不顾一切困难也要学习突破的夜晚？


    如果有，那我建议你依靠过去几年积累的学习，尝试面试、跳槽到更好的公司。


    如果没有，那么希望你记住两点建议：


    - 你可能觉得公司环境差，觉得家庭负担大占用时间，是啊，个人成长的环境太难了。可是谁不难呢？回报和付出是成正比的。

    - 到35之后再入行互联网公司从基层干起就太迟了，现在去下载我们星球的电子书（https://t.zsxq.com/aIlleqN），全部认真看完，挑一个感兴趣、上手容易的模式，边实干边学习。


    做好心理准备，第一次尝试、第二次尝试可能都会失败，不要放弃，咬牙探索下来。


    只有做好失败100次的人，才有资格成功1次。


