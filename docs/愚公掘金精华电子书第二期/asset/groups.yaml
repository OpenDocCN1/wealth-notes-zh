    \n![](img/62659df0b3729b5d99b589094fb4b8b0_54_1.png)\n\n3、建议无论你是否需要修改2020年的专项附加信息，都下载APP去查询一下，以免发生失效的情形导致2020年无法扣除，比如孩子7月份就从幼儿园毕业了，但是没有及时修改信息导致失效，后续无法扣除；或者因为房租租期到了，住房租金信息失效。\n\
