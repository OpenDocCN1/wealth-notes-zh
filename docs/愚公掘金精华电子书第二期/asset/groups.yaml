  - '[PAGE 635]


    说了半天，没有一点可以充分说明中国的家长为什么不愿意让孩子去踢足球打篮球。


    花爷想来想去，想到了一个可能的原因，就是：


    中国的家长，特别是上一代的家长，根本没有意识到文体行业是底层翻身最大的捷径这个事实。


    上一代家长本身信息就比较闭塞，我们国家又有崇尚知识分子、轻视文体行业的传统，大家都想培养孩子上清华北大。


    但清华北大多难考？全国能上清华北大的不到 1%，清华北大毕业后能年入千万的，也不到 1%。


    而在匮乏的足球行业，这个概率要大得多，只要实现就是阶级超级大翻身。'
  - '[PAGE 636]


    当然了，也不是说你进了足球行业就能翻身，但如果家长有这个意识，好歹可以送孩子去试试呢？对不对？不比你去练钢琴翻身的几率大多了？


    要知道，美国的底层黑人哪怕再穷，也都知道从事文化和体育行业是全家翻身的捷径，你去看很多球星，小时候如果展现出天赋，单亲家庭省吃俭用也要供孩子打球，为什么？父母心里门清啊！只要打出名堂，未来一年赚的钱现在八辈子也赚不了啊！


    而国内的上一代父母，因为信息差，连试试孩子有没有天赋的心思都没有。'
  - '[PAGE 637]


    这也是为什么父母为孩子选的专业、方向，往往是错的，因为大多数父母都选当下最好的方向，等孩子毕业了，这些方向大多已经过气了，不信你去问问前几年被家长报了土木的孩子，现在工作好赚钱吗？


    说白了，还是花爷以前说的穿越性思维，多站在未来的维度想问题。


    所以我以前的帖子说，年轻人刚进社会，可以去深圳做教育医疗行业 （https://t.zsxq.com/Rv3VNrN），抓紧时间窗口期，后面一看，果然这些行业的竞争也开始变激烈了。


    如果你不知道未来的趋势，看看国外，看看发达地区，人家已经帮你把路走过一遍了。'
