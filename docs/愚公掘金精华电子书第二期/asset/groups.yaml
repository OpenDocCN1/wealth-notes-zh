    - 2. 重点强调你的能力和现在的岗位是匹配的，和HR和领导聊你的规划、当下的工作问题


    真的，不用慌，大概率是不会找你的，平时也跟领导、人事搞好关系。


    很多人面试都会美化自己的简历，比如把自己的当前薪资报高一点。其实HR就跟学校讲课的老师一样都知道，下面学生有什么小动作，你真当老师站讲台上不知道？


    只要考试成绩过得去，老师会睁一只眼闭一只眼的，哪有那闲工夫一个个纠小动作，HR又不是包青天。


