    ## 民宿酒店怎么做连锁招加盟？应该如何利用精准酒店客户的微信？


    **提问：**


    花爷，我和先生做的都是传统行业。目前包括两方面：

    一、建筑设计公司，涉及建筑、规划、园林、林业等综合设计及测绘和考古勘察这种设计相关的业务种类，目前做的主要是政府业务和少量开发商业务。现在这块还算稳定，行业竞争也大，所以去年，我们又代理了岩棉、一体板和软磁贴的材料代理，材料业务进展缓慢，目前还没走上正轨。

    二、酒店，原本我们是想做长租公寓，脑子一热，调研不足，做了之后发现城市平均房租下降，利润太薄。转而再次改造改为酒店运营，定位城市民宿，实际上是赋予酒店服务以温度，客户体验有家的氛围，来区别于传统酒店。


    现在困惑，本意是今年年后再收购一家酒店，改造成我们的品牌，奔着区域小连锁去。但疫情当前，一切停摆，而且今年整体经济都不好，再投入还是要看工程公司那块是否有比较大的现金缺口，因为目前来看，肯定影响合同回款进度的。对于一个有一两家店的规模，但比较
    having 经营特色的店，如何来做连锁招加盟。另外，我们酒店的客群非常年轻，集中在16-30岁。目前单店微信粉丝有几万人，全部加了客人的个人微信。这部分是否有除了日常住宿需求以外，再开发的方向。


    谢谢花爷，连续看了很多天星球内容，感觉我的年纪算比较大的，年轻人都这么厉害这么有想法和眼界，羡慕年轻，也感叹自己不能落伍。会多学习的。


    **回答：**


    你这种条件其实是很适合做加盟连锁的，你有三个非常好的优势：


    1. 你的民宿有明确的定位和特色

    2. 你不是瞎搞特色，而是已经有两个成功案例，有一整套选址、装修、获客运营的SOP

    3. 你把所有用户都加微信上了，这点简直太棒了，而且你的用户群很年轻，和有意向加盟创业的人群是重叠的


    接下来其实很好办了，在你民宿住过的用户，就是你的招商池子。对于这些人来说，你可以提供整套的加盟开店方案，包括选址、装修、运营培训等等，总之让代理只需要提供加盟启动资金和参与人员培训就可以了。


    剩下要做的，就是让住过的民宿的用户，进一步加深对你的信任，相信你不是骗大家的加盟费、而是真的有本事帮大家把民宿新店开起来的人。


    这就需要你不仅是服务用户，而且要和大家分享，怎么把一间民宿开起来、会遇到哪些坑、每个月的客流量能有多好、你有哪些经营理念等等。


    你就当是给自己的创业写日记，逼迫自己每天去记录、展示自己，一般不出两个月，就能完成一轮对用户的信任培养。到时候尝试着发一个招商的信息，会有意向人群找你做代理商加盟的。


