    如果你只看到互联网行业钱多，看不到需要付出的努力，那职场当然不会给你期待的馈赠。


    在你的描述里，你不成功的理由包括：


    +   · 因为是传统互联网公司，所以转型失败，被塞进后台部门


    +   · 跳槽失败，因为大环境不好


    +   · 互联网行业年轻，脑力体力比不过年轻人


    +   · 传统民企业管理混乱，跟你想到的职业转型差距大


    全是外界因素，没有一句话在主观上找自己的问题。'
