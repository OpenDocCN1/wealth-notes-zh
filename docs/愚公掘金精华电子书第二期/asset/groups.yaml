    # 微博上最近兴起的一种精准引流小手段


    最近兴起的一个引流小手段。在某个垂直领域（比如财经）的知名大V的微博下方留言：“论财经，我只服A和@B。”


    其中A是这条微博的主人，知名大V，B是引流的对象。


    普通人看到这样的评价，会把B当成和A类似的大牛，点到B的主页浏览，如果主页信息够诱人，就有可能关注。'
  - '[PAGE 647]


    这是典型的公域流量截流的策略，也就是在公共的流量平台（比如上文的微博），找到精准的流量（比如财经大V的微博评论，看到的都是财经粉），用第三方的口吻（显得中立可信），巧妙的引出真正想到导流的账号地址。


    这样的操作简单有效，可以写成机器人程序，批量在公共流量平台去发类似的评论，完成公域流量截流。


    举一反三，类似的手法在知乎、微信读书、豆瓣等所有公共流量平台都可能有效。在知乎，问题的类型可以帮我们定位流量的精准性，在豆瓣，小组/图书/电影的类型可以帮我们定位流量的精准性，在微信读书，书的类型可以帮我们定位流量的精准性。'
  - '[PAGE 648]


    想到之前的另一个成功案例，某游记平台刚上线，想找大家来写游记，但旅游的人太分散了，你哪怕出钱，也很难找到刚刚旅游结束的人来写游记。


    怎么办呢？


    产品经理想了一个办法，他研究了某种算法，通过微博内容，筛选出最近刚旅游的人，然后写了一个机器人程序，去用户的微博下面评论。


    机器人评论：在吗？


    对方：xxx（不管对方回什么，都触发下一条评论）


    机器人评论：我们是一个年轻的创业团队，有一个不情之请。'
  - '[PAGE 649]


    对方：xxxxx（不管回答什么，都触发下一条评论）


    机器人评论：邀请你来写游记，有xxx奖励...

    （省去具体内容，并且这里故意把一大段话拆成2条评论发，更接近真人对话风格）


    对方：xxxxx（不管回答什么，机器人再无回复）


    就是这个简单的机制，这个游记平台向30万用户发出了写游记的邀请。


    这是个八九年前的案例，和今天花爷看到的评论引流有异曲同工之妙。世上其实少有大的创新，在不同场景下巧妙运用前人的经验，就算是一次微创新了。'
