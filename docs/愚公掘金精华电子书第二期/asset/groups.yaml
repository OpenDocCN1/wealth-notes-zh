  - '[PAGE 763]


    拿眼镜举例子，传统眼镜的镜片都是库存，不同的度数都要备好，就算它 25 度一个组合，这个存货也已经很可观了，眼镜的价格自然而然也就上去了。


    必要商城协助工厂自建柔性生产线，真正实现灵活生产。所以在生产、下单之前，工厂=0 库存。减去高额的库存成本以后，自然售价也就下去了。


    著名自媒体人Keso在“毕业信任力经济”一文中曾这样写道：


    > “五年来，作为必要的用户，我没有收到过一条来自必要的广告短信。

    几乎所有被普遍采用的流量手段，必要都本能地拒绝，比如疯狂打大促，搞会员制。因为在毕业看来，如果打折才值，说明平时不值，如果会员才值，说明非会员不值。

    必要可能是唯一一个自己不搞大促，也不参与别人家大促的电商平台。在必要上，你不用等 6.18、双 11，什么时侯下单都不会亏，你永远都不会有错过今天，还要再等一年的纠结、困惑和迫不及待。”


    Costco 这家诞生在上世纪 70 年代的零售贸易企业，在中国拥有世界上最复杂的商业形态、先进制造业土壤之中，到底能撑多久，确实有待时间验证。


    长江后浪推前浪，陈旧的老模式，总归不得不要给一些“思维活跃，不墨守成规”的新模式让路。


