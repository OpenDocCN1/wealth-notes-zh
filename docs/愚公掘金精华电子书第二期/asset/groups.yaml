    以下几种情况有可能涉及补税或退税：


    +   1. 中途换过工作，而且交税的人群。一方面新旧单位不可能无缝衔接，另一方面由于新税法累计预扣预缴方式，新单位5000元的减除费用不考虑旧单位的累计月份，这种情况肯定多交税了，可以通过汇算清缴申请**退税**。


    +   2. 毕业生年中入职或者换工作中间有断层，且有交税的，这种情况，因为每年6万元的费用没有充分地扣除，公司在发工资的时候会少扣费用多交税，这时可以通过汇算清缴申请**退税**。


    +   3. 2019年有专项附加扣除符合条件却没有扣除的，或者有大病医疗的情况，这时可以通过汇算清缴申请**退税**。


    +   4. 没有任职受雇单位，仅取得劳务报酬、稿酬、特许权使用费所得，需要通过年度汇算办理各种税前扣除的。


    +   5. 一年收入不超过6万（因为起征点一个月5000，一年6万），但是由于中间某一个月份工资奖金高而预缴了个税的，这种情况可以通过汇算清缴申请退税。'
