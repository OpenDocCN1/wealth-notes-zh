    \n职工医保主要针对在职职工和缴满医保的退休人员\n\n居民医保主要是学生、全职太太等没有固定工作的人群\n\n职工医保有2个账户：个人账户以及统筹账户，每个月我们交的钱进入个人账户，可以用来买药或者看门诊等，其实这个过程用的全是自己的钱。统筹账户的钱在大病住院、大额花费才动用。缴满一定年限，终生医保待遇。\n\
