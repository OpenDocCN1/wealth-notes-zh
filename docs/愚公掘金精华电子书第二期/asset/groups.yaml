    # 想搞副业致富，应该怎么辨识有效人脉和观察身边好的商机？


    **提问：**


    花爷好。我的基本情况：小城市体制内老师，想搞副业致富，培训班不考虑教育局抓得紧。问题：1. 看您的一个回答说，小城市人要去认识朋友，可是有的人是爱吹牛，有的闷声发大财，怎么办认结交哪些人呢，如何辨别获得的信息哪些是真那些假呢？哪些途径的可以努力扩大社交。2.
    比如今天在街上就看到很多店面生命周期很短，没多久就换门面了，哪些是能赚的，他们怎么赚到钱。该从哪些方面观察。整个属于没有方向的状态，还请花爷指教。多谢！


    **回答：**


    1. 大家一定要有这样的思想准备：


    当你为一个目标奋斗时，失败才是常态，成功才是偶然，但只要成功1次就够了，所以要做好失败99次的准备。


    当你去结交朋友时，遇到牛皮大王、遇到狐朋狗友是常态，遇到真正有本事的人才是偶然。只有结识99个普通人，可能才会遇到1个真正有本事的人。


    所以不要心急，先尽可能的补充数量，然后才能追求质量。


    至于怎么判断是真本事还是吹牛？聊天的时候，多聊细节，比如谁说他在做xx业务，多聊聊业务逻辑和细节，能说出细节的大多是真干过，前后矛盾的基本是吹牛皮。


    另外，不要因为某一件事就给人定性。在小城市，最常见的情况是一个人各方面都表现的吊儿郎当，但某一方面确实有些资源和本事，看人只看优点就行了，缺点一笑而过足以。


    ## 怎么在小城市扩大社交面？


    其实你能接触多少人，除了你的积极性之外，取决于你自己能为别人提供的价值。当你的价值和别人的业务能够关联起来的时候，就有能产生新的深度链接。


    这点我在之前的问题“如何在新城市快速扩展人脉”里详细解答过： https://t.zsxq.com/nMRfyRn


    核心就一点，主动为别人提供价值，你就能链接到更多的人。链接人脉是自然而然的结果，而不是手段。


    ## 线下店哪些是真的赚钱的？


    一般来说，经常换门面的大概率是不赚钱的，非加盟店如果开的很久，大概率是赚钱的。加盟店如果加盟的店数一直在涨，那品牌方肯定是赚钱的，早期加盟商也是赚钱的，后面的就不一定了。


    遇到感兴趣的线下店，但是不清楚其商业模式，可以观察一阵子之后来星球，描述清楚基本情况，直接向我提问。


