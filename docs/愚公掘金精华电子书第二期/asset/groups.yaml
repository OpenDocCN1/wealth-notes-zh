    # 年薪50w想进一步提升自己应该怎么规划？


    提问：


    ![](img/62659df0b3729b5d99b589094fb4b8b0_351_0.png)'
  - '[PAGE 352]


    责人带十几个人，18年公司组织架构调整做了事业部负责人，除了技术，还负责了产品和运营，19年初，组织架构再调整，又回到只负责技术了，目前管理30多人。


    因为18年负责了一段时间产品和运营，技术也慢慢放下了，导致再回来负责技术也沉不下来了，空闲时间也一直找机会(分析痛点找需求)，看能不能自己做点事情。也经常买得到的课来学习，比如梁宁的产品课，华杉的营销课等。


    我现在32，年薪50w，想出去创业，但是放不下现在的工资，因为需要养家。又沉不下来好好工作，很是难受。现在就想着第一步先搞搞副业，能获得一些工资外收入，也实践下营销能力。目前也列了一些想法，比如开个公众号开始写中层管理者方面的文章、比如开个抖音好物号、比如结合家人的一些优势开个淘宝店然后引流等等，但大都没有开始实践。我自己的优势是有一颗持续提升认知的心、逻辑思维能力比别人强些、有技术基础，弱势是执行力有些差，想的不如做的多。


    最后，我的问题是，像我这种情况您觉得我应该如何规划后面的路径？如果我想年薪百万，最快的方式是什么？'
  - '[PAGE 353]


    # 回答：


    年薪50w创业只有两种可能，要么投资人追着投钱让你创业，要么创业的生意盘子已经转起来了，全心投入可以加倍扩大规模。


    显然你两种都不符合，不要有一点辞职创业的念头，现在投资圈的钱紧的可怕，许多VC下了死命令，没有高增长数据支撑、没有规模化的ROI，宁愿让投过的创业公司死掉也不会再追加了。


    从四五十万到一百万是一个大台阶，不可能我今天说点子然后你就完成目标了，只能说以我的经验，给你两个建议：'
  - '[PAGE 354]


    # 1、心态放平，重中之重


    最开始有段时间，你会感觉什么都想做，却做什么都把握，明明有几十万年薪保底，比普通人的收入水平强多了，却好像什么都没有，非常焦虑。


    经常忍不住想，难道自己这辈子就这样了？万一我收入不进后退，全家的生活质量还怎么保障？


    我相信你一定有过类似的感觉，因为相同的脆弱，我曾经也有过。


    事实上，人什么时候摆脱这种心态，什么时候才能真正的前向踏出一步。就好比孩子跌进水里，原地扑棱个不停，觉得自己快完了，其实水坑根本没多大，踩着底走几步就摸到边界了。'
  - '[PAGE 355]


    遇到焦虑的时候，多用用花爷经常教大家的穿越式思考：想一想，如果十年后你回想今日，你希望自己做一件什么样的事情可以坚持十年？


    坚持十年是件非常难的事情，这个方法可以帮助你排除当下浮躁的选择。


    # 2、专注做你擅长的事情


    你还有个特质和我当初很像。


    大概两年前吧，我有一天猛然发现，自己的技能点特别满，看上去什么都会，但没有特别擅长的东西。我一直在想，自己到底最擅长做什么？


    这个问题的答案，是试出来的。


    现在副业这个话题特别火，我更喜欢称它为第二职业。那么到底什么事情，可以算得上一份好的第二职业的？'
  - '[PAGE 356]


    我觉得必须满足一个条件：投入的成本较低，主要是时间成本。


    比如你去开个饭点、加盟奶茶店，这叫第二职业吗？不叫，这些不仅要投入时间，还要投入大量金钱。


    但自媒体、淘客、电商、微商这些职业，前期可以只投入较少的资金，主要是投入时间，成了一本万利，没成也亏不了什么东西。


    在这些适合做第二职业的方向里，选一些自己感兴趣、觉得自己有优势的，一个个去尝试，哪个最容易出效果，就去做哪个——第二职业是很累的，没有正反馈很难坚持下来。'
  - '[PAGE 357]


    就你列的几个方向里，个人感觉抖音好物分销带货可能比较适合。自媒体的话，你没做过，淘宝店的话，投入的人力资金还是有点大，而抖音好物带货主要是时间成本，一旦开窍也容易出正反馈。


    多说一句，短视频带货确实是现在的大风口，我最近也安排了身边一个朋友去做这个，等他摸底完我会投入一点精力和资金去做。


    说到这，其实我脑海中有个想法越来越清晰，最后跟大家说说，看看大家意见。


    第二职业现在越来越火，但大多数讲副业的课程，效果夸大严重，学了也没什么效果。我觉得想开展第二职业，其实有两个核心问题：


    +   1. 有哪些第二职业可以做？我适合哪个方向的第二职业？'
  - '[PAGE 358]


    +   2.选定了一个第二职业，如何快速入门上手，掌握基础的技能知识？（注意不是让你一夜暴富，是快速入门）


    这两个痛点，我觉得是当下最普遍、最核心的，后面我应该会围绕着这两点做课程、训练营。


    等做出来了，难免要星球里的花友内测，现在算是个小调研吧，感兴趣的点个赞，花爷心里有个数。


