    # 国足薪水很高，为什么中国还是没人去踢足球呢？


    前几天国足输球，看到新闻说了两个数据：


    -国足教练在任900多天，薪资4亿人民币


    -国足守门员7000多万全款买了套房，花爷顺手查了下，国足里年薪过千万的有好几个，整个中超平均年薪是700多万'
  - '[PAGE 632]


    花爷当时就觉得很奇怪：踢足球这么挣钱，为什么中国没人去踢足球呢？


    大家都知道，像乒乓球、羽毛球这些项目，运动员收入是远远不如同等级的足球篮球运动员的，更不要说什么举重、跳水、体操这些项目了。


    那问题来了，一般越挣钱的行业，往里钻的人越多，那为什么家长更愿意送孩子去打乒乓球、羽毛球，却不送去足球篮球呢？


    中国足球注册运动员人数甚至不到乒乓球运动员的三分之一。


    花爷在朋友圈发了这个疑问，花友留言总共有这么几种原因：


    +   1. 足球高收入必须要顶尖，对天赋要求很高。'
  - '[PAGE 633]


    但这个理由根本站不住脚，任何一项文体运动，乒乓球、羽毛球、各种乐器，每一项都是顶尖水平才有高收入，都需要天赋，足球篮球没有特异性。


    +   2. 足球篮球容易受伤，家长不愿意孩子去。


    确实有不少家长有这种想法，不过也有特例，比如送孩子去体操、举重的家长，对身体的伤害不比足球小吧？


    另外，真实的足球篮球训练其实出现严重伤病的可能性也不是很大，特别是青少年训练时期，这点说明了家长侧的信息不对称。


    +   3. 足球篮球需要场地，不像乒乓球那样，有成熟的训练学校。'
  - '[PAGE 634]


    这点有道理，足球篮球的正规青少年训练是最近几年才有的。不过，你现在去问问家长愿不愿意培养孩子去当足球运动员？家长大概率还是不愿意。


    # 4.足球想踢好，家里得有钱，得贿赂教练。


    有个花友留言说，他朋友的朋友是从国少队退下来的，每年要给教练30万红包，家里没钱只能退出了。


    这话我刚听也吓了一跳，但花爷后来查了一下，国足大多数球员家境都挺普通的，像最出名的武磊，他爸是单位保安……真有天赋的孩子还是会冒尖，花友说的教练索要30万，我估计要么是口口相传夸大了，要么是教练找了个借口让他离队。'
  md: "\n## 从最近爆火的协和维E乳看背后的商业规律\n\n最近爆火的协和维E乳，被几百个淘宝直播的主播同时安利，7天卖了51万支。买的观众都以为是北京协和医院出的，结果实际厂家是苏州协和工厂，这家厂1990年代就有了，当时就是蹭名牌的厂，30年后又靠着蹭名牌火了一把。\n\
    \n这事儿其实有很多商业里的规律可言，你看：\n\n- 淘宝直播、种草博主，永远不是推最好的，而是推利润最高的。\n- 怎么样才能利润最高？推荐观众老爷们觉得好的。\n\
    - 但真正好的东西，利润往往最低，怎么办？推观众觉得好，但其实没那么好的。\n- 那普通老百姓觉得什么好？便宜、大牌、生活刚需。\n- 便宜和刚需都好解决，但不是每个人都能做大牌，怎么办呢？蹭大牌。\n\
    - 其实蹭大牌，是医院自己先发明的。医院的自制药，很多都没有经过严格的医药审查，医院也大多没能力自己研发生产，大多是代工厂产品，贴了医院的牌子，立马就变成名牌产品，专门给医院创收的。\n\
    - 现在协和工厂蹭协和医院的牌子，本质上和协和医院自己贴牌生产维E乳，性质上差别不大。\n- 冒牌的都能这么火，各大医院该醒醒了，正品如果也有主播安利带货，你猜效果会怎么样？\n\
    \n记住花爷这句话：用户觉得好，但其实没那么好的东西，保健养生产品是一个特别大的品类。它们成本足够低、又能卖出高客单价、还非常容易获得各大医院、各大名医的背书光环。\n\
    \n接下来的直播、短视频带货，一定会爆出更多的保健养生产品。\n\n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_600_0.png)\n\n## 从电影《我的祖国》里学习讲一个好的故事\n\
    \n国庆几部电影都看了，今天先说说《我和我的祖国》。\n\n花爷一直说，做生意、做品牌、做电商、做自媒体……等等等等，其实本质上，都是在给用户讲一个好故事。\n\
    \n好故事从哪里学，电影里就有。\n\n《我和我的祖国》是七个导演的小短片合集，质量差距非常大，上一秒还是林志玲，下一秒就是凤姐，上一个故事还热泪盈眶，下一个故事就破口骂娘。\n\
    \n好故事和坏故事的差距，对比之下，尤为巨大。\n\n但是无妨，我们仍然可以从七个导演身上，看到一些故事背后的运转逻辑。\n\n### 1. 好故事，都从小人物讲起\n\
    \n以前我们也拍爱国教育片，但反响远远没有今年这部《我和我的祖国》，这里面有七十周年的时代背景原因，但更重要的一点是：\n\n大家其实都不爱听大道理。\n\n\
    以往的爱国教育片，大都拍的是领导人的历史事件，跟老百姓的生活太远。\n\n这次七个小短片，不论质量好坏，无一例外，都是大事件里，小人物的故事。\n\n从电动国旗设计师的视角看开国大典，从无名科研人员的视角看原子弹爆炸，从弄堂小男孩的视角看女排夺冠，还有其他的钟表匠、飞行员、扶贫老干部等等，也都是如此。\n\
    \n越要讲好一个大的故事，越要选择一个小的切入点，让用户能够代入进去，随着小人物的视角，感受大事件的脉搏。\n\n这里不得不提我上次发的、知名大号卢克文的一条写作技巧：\n\
    \n人物比故事更重要，故事是服从于人物的。（详情：https://t.zsxq.com/QbURb27)\n\n同样的道理，在写作、宣传产品、品牌宣传上也是一样。\n\
    \n### 2. 不完美的主角更惹人爱\n\n我们很多产品，在做产品介绍的时候，恨不得把自己说成是万能的，这也行，那也行，越听越玄乎，用户听了都发怵。\n\n\
    其实不够完美的角色，更容易被用户接受。\n\n我们看七部小短片里，比较出彩的几部：前度、夺冠和北京你好，三部的主角都是有缺陷的。\n\n前度里的黄渤，恐高，最后是咬着牙爬上旗杆的。\n\
    \n夺冠里的小男孩，孩子天生比较弱势，在大人的世界里没办法反驳，最后为了天线放弃了找小美的机会。\n\n北京你好里的葛优，能力差又爱得瑟的一出租车司机，不受前妻和儿子待见，最后把门票咬牙给了汶川小男孩。\n\
    \n这种不完美的设定，更真实，更让用户放心，也为故事的矛盾做了铺垫。\n\n在今天，你会看到很多产品说，“我们确实价格有点贵，但是效果好啊，你算算，多花钱解决问题，和花冤枉钱啥问题也解决不了，到底哪个更划算？”\n\
    \n这就是典型的主动暴露弱点，并且美化自己的弱点。\n\n不完美，也是真实的一部分。\n\n花爷给这七部短片的排序：\n\n- 第一档：前度、夺冠\n- 第二档：北京你好\n\
    - 第三档：回归、护航\n- 第四档：相遇\n- 第五档：白昼流星（除了个别画面挺美，其他几乎一无是处，最精彩的偷钱借钱环节也是借鉴的）\n\n另外还想说一点，如果非得挑个刺的话，这七部短片，面对个人和集体的利益冲突时，都选择了牺牲自己，成全集体。\n\
    \n当然，这我也能理解，毕竟就是这个主旋律，也为了戏剧冲突。\n\n但是，其实还有很多事例，个人和集体是相辅相成、互相促进的，而且这类事例应该成为常态，社会才能更持久的发展。\n\
    \n希望下一个十年的电影里，能出现更多相互促进的小故事吧。\n\n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_607_0.png)\n\n## 公众号红利真没了吗？不，只是写作方式变了\n\
    \n聊聊写作，今天先讲个第一部分。\n\n上次看到个数据，说公众号九成阅读量不过万，底下评论一片哀嚎，说公众号红利没了，现在做公众号都是炮灰。\n\n但就拿2019年来说，半佛仙人、不会画出版社、卢克文等等几个号，火的都特别快。\n\
    \n就拿花爷自己来说，虽然我没把全部精力放在自媒体上，粉丝不算多，文章更得不勤（涨粉慢），收费方式也单一（没开课、没开训练营，星球的受众其实蛮小的），但收入也还行。\n\
    \n为什么大众的感观，和实际情况相差这么大呢？\n\n因为评判标准错了，阅读量、粉丝数已经不是衡量一个公众号是否出众的指标了。\n\n相信有过自媒体经验的花友，都发现过这样两个现象：\n\
    \n- 一篇文章爆了，阅读量大涨，但是涨不了粉。上次纯洁的微笑写了一篇10万+爆文，涨粉3500，这个数据已经算高的了，很多号的爆文涨粉率不到1%。\n-\
    \ 有阅读量有粉丝，但是赚不到钱，推付费产品没用户买账。之前有个50万粉的号，想跟我这边电商合作，我扫了一眼往期内容就说合作不了，你这粉丝黏度合作了也没用，卖不出去。\n\
    \n这两个现象，直接说明了问题：\n\n- 单纯传播信息的文章，就像看新闻，看完就换台。如果不打造IP，用户根本不在乎你是谁。\n- 自媒体和用户之间没有建立信任，涨粉也没用，除非你能批量搞几百万粉，那是你的本事。\n\
    \n所以，时代变了。\n\n早期自媒体，是面向阅读量、面向粉丝数写作，但这套玩不转了，只要阅读量和粉丝数，没用。\n\n现在的自媒体时代，花爷称之为“面向结果写作”。\n\
    \n### 什么叫面向结果？\n\n你是做教育培训的，你的IP、你的文章、你的粉丝属性，都奔着教育培训去。\n\n你是做设计装修的，你的IP、你的文章、你的粉丝属性，都奔着设计装修去。\n\
    \n以此类推。\n\n以前，人们关注的是数量，但现在，关注的是质量，是转化率。\n\n面向结果写作最大的好处是，你不用愁写作没有效果。\n\n以前做自媒体，不做到几万几十万粉，根本变不了现，但如果你面向结果写作，因为用户精准，哪怕只涨了100个粉，加到微信里也是100个潜在客户，基本肯定会有成交。\n\
    \n所以，面向结果写作，花爷最基础的三个建议：\n\n- 一定要先确定自己的定位、用户的属性\n- 选目标用户感兴趣的主题，不要追热点\n- 适当降低发文章的频次，写出精品干货文章出来\n\
    \n你看，挑剔用户、不追热点、少发文章……这些在老式的自媒体行业都是不可想象的，但花爷告诉你，这才是更适合于普通人的、面向结果写作的方法。\n\n今天先讲到这，这个小系列下次有空再接着讲。\n\
    \n记得点赞评论让我看到点反馈，上次还有花友问我，感觉内容特别好，怎么点赞这么少呢？\n\n我进后台一看数据，靠，每天一千多人都上线看了内容，全是潜水的，禽兽！\n\
    \n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_613_0.png)\n\
    \n## 写几点通用的简历注意事项\n\n金九银十，估计最近跳槽的挺多，私下微信帮好几个花友看了简历，再一个一个帮你们看也不是办法，干脆写几点通用的简历注意事项：\n\
    \n- 长的好看放照片，长的中等去拍个轻度PS的证件照也能放，特村的照片就算了吧还不如不放。\n- 简历是件严肃的事儿，越少出错越好，别放什么网络用语、嘤嘤嘤、颜表情、撒娇的话在简历里，大多数情况下绝对是减分项，显得特别不专业、不稳重，像个没上过班的大学生似的。\n\
    - 写工作经历，不要笼统，也不能只放数据，遵从下面这个模板往里套：\n    > “在xxx的背景下，项目定下了xxx的目标，遇到了xxx困难，最终在我用xxx的方法，解决了问题，取得了xxx的数据。”\n\
    \n上面每一个xxx都不能少，特别是你用xxx方法取得了xxx的数据这两部分，越具体越细节越好。\n\n- 有人说了，我没做出什么成绩啊，这可怎么写？记住：\n\
    \    - 你参与的，就算你的项目经历\n    - 你的项目戏份重，就多写你的工作，你的项目戏份少，就多强调遇到的困难\n    - 如果数据好看，直接亮数据，如果数据不好看，就说数据比之前上涨了x倍\n\
    - 如果拿的出手的作品、业务项目的成绩，直接放附件或者链接，绝对的加分项。特别是你上了工作相关的课程，上课这件事不重要，你的课程成绩、作业作品才重要。\n\
    - 写个人特点，不要写片汤话，没意思，一定要摆出事实。\n\n你说你爱自学，告诉我哪些技能是你自学的（买课听这种不算，要证明你自学并且掌握了某项技能）；你说你做事积极主动，告诉我你在工作中积极推动了哪些项目，取得了什么成果……诸如此类。\n\
    \n- 最后一点，要求比较高，送给高阶的求职者。\n\n对中意的几家重点求职公司，要仔细揣摩对方的招聘要求，勾勒出对方理想的求职者画像，然后针对性的修改自己的简历。\n\
    \n这点要求很高，就像考试做题，当你知道出题老师这道题想考你哪个知识点的时候，你很难答错。\n\nps.为啥花爷说求职、简历这事儿这么有信心，因为身边确实有几个朋友，在我的辅导下拿到了BAT级别的面试机会和offer（辅导之前甚至拿不到面试）。\n\
    \n但是这事儿确实太麻烦了，至少消耗2小时以上，只能友情帮帮认识很多年的好朋友，就没时间一一帮星球里的花友了，见谅，多琢磨上面几条，应该也能收获不少。\n\n\
    本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_618_0.png)\n\
    \n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\n## 去日本玩发现的几个小商机\n\n我这人吧，到哪都喜欢看跟钱相关的东西，所以这次哪怕出去玩，也跟大家聊聊发现的几个有意思的商机。\n\
    \n去日本的几点小发现：\n\n- 民宿：\n\n日本的酒店普遍很小，12平左右，而且贵，东京大阪这种热门城市，普遍1000+一晚。\n\n所以民宿生意就很火。\n\
    \n在日本做民宿生意的中国人很多，但这个市场不太透明（就是游客人傻钱多），不同地区、不同装修的民宿，差价还蛮大的。\n\n用户越精明，商家就越依赖流量。于是airbnb这种民宿预订平台的抽佣非常高，对顾客抽6%~12%，对房东再抽3%。\n\
    \n所以不少商家都想跳出平台，自己做流量。最直接的方法就是做微博，做日本旅游的攻略，建立信任后民宿成交就顺水推舟了，微信直接交易也会便宜不少。（我一直强调的，信任货币就是钱）\n\
    \n微博做宣传的人设也五花八门，有的是主打美少女房东，民宿基本都是网红风，不少女孩子会带摄影机去拍照；有的主打真诚热情的房东形象，民宿的照片故意不做任何美化，你看到什么样就是什么样，非常实在，然后也会在微博提供各种热心服务。\n\
    \n我就特别吃后面这一套，整个体验下来确实很棒。\n\n这个房东也非常聪明，和房东聊天，他说他是做医药的，不少房客来了之后，直接成了他的代理商。我虽然没做代理，但仍然留了微信，以后日本那边有什么渠道需要，可以联系他去帮忙，算是打下一个资源节点。\n\
    \n你看，先做朋友，后做生意，难度就小很多。\n\n- 交通：\n\n同样的，日本交通也很贵。不光出租车贵（2公里车费近100块人民币），新干线（相当于国内动车）也很贵，大概是国内价格的四倍。\n\
    \n所以在日本，中国人的黑车生意就非常发达。一家四口的周边游，你坐新干线的钱，可以直接包一辆车一个司机（会中文）跟着你跑一天，换成你你肯定也包车。\n\n\
    这些包车生意，主要通过飞猪等平台引流，需求非常大。\n\n你看，哪里不方便，哪里就有生意。\n\n- 迪士尼：\n\n去迪士尼玩，在飞猪上提前订票，很多商家都不是及时出票的，一定要等到你入园前1-2天才给你票。\n\
    \n后来在飞猪找了一圈，找到一家能及时出票的，问他原因，他说：\n\n那些只能提前1-2天出票的，大多是利用灰产漏洞、盗刷之类的给你买的票，被坑的人来不及举报追查，你的票已经用完了。\n\
    \n不知道真假，后面没有追查了。但当你不知道别人的商业模式事，问他的竞争对手，往往能得到一点线索。\n\n- 日本的互联网比中国真的差远了：\n\n日本的移动支付非常差，只有大城市的大商场和便利店才能刷卡，小城市和乡下都不太支持移动支付，不带现金是要饿肚子的。\n\
    \n这在国内简直不敢相信，卖红薯的都支持和支付宝了。\n\n如果你上过日本的铁路订票系统，你会发现做得比当初的12306第一版本还要烂100倍......\n\
    \n前阵子711好像做了一个专属的移动支付，然后……被盗刷了很多钱……停掉了......\n\n- 之前在星球里说，我一年的个人花销很少，这是实话，我是真不爱买东西。能吃个榴莲对我来说就是顶级的日常消费了。\n\
    \n包括出去玩，我都是住民宿追求性价比。\n\n但偶尔也会享受一下，这次去泡温泉，住了两晚高档酒店，一晚差不多要四千……只能安慰自己，偶尔体会一下有钱真好的感觉，才能激发更大的赚钱热情……\n\
    \n（配图是酒店官方图，温泉是全裸泡的不给拍照）\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_625_0.png)\n\
