    ## 不止要学会找商机，更要学会找商机的思路


    **提问：**


    花爷你好，看亦仁大佬的星球时，亦仁有篇帖子提到抖音发设计签名然后留微信的赚钱模式，随之模仿，我做的起名，坚持一段时间后视频就过不了审了，号被封！我想问的是如何去寻找挖掘这种小项目，因为觉得这种思路是对的，想做，但苦于没有卖点。


    再就是想问下花爷，也是在亦仁大佬星球看见的，简单点说就是有个5000人的微信，深度链接，就可以活得很滋润。想问下如何寻找这类人呢，想学习模仿一下。


    辛苦花爷。


    **回答：**


    噗，现在别的星球遇到的问题也来问我了吗......


    姑且聊几句吧，大家要搞清楚一个重点：大佬的话是不能全信的。


    什么？花爷你是说大佬都在骗人吗？


    不是，很多大佬是在跟你真心实意的交流，但问题是，很多人没办法100%理解大佬的意思。


    为什么会这样呢？因为大佬说的话，都有对应的语境、背景，真要完全讲清楚，可能要说几个小时。但大佬的时间有限，没办法，只要把各种语境、背景给省略掉了，不可能面面俱到。


    比如你说抖音设计签名的玩法，大佬说谎了吗？


    没有，只是你再去跟进时，抖音的审核环境已经变了，用这个模式的也多了，所以就不灵了。


    但实际上，你搞清楚模式的本质，把因为背景环境不同的坑给绕过去，这个模式可能又能跑通了。


    再比如，亦仁哥说有5000个人的微信，深度链接，就能活得很好。


    这话我也认同，但这话的重点是什么？是要有一个5000人的微信吗？不是，是你要有能力和5000人产生深度链接，怎么产生深度链接？


    你要能稳定的为他人提供价值，你微信里有的是5000个有付费意愿的客户，而不是随便加5000人。


