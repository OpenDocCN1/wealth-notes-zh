- raw:
  - '[PAGE 93]


    封闭式基金是什么呢？ 一般的基金是你买了，基金公司给一张票上面写着你持有该基金多少份，基金为你直接负责，等要钱的时候呢，再让基金公司还给你你投入的这点份额现在的价值的钱。


    封闭式基金是买了后就不能卖了， 但是呢可以卖给市场上的其他人。


    这就好玩了，因为你和其他人之间的价格不是固定的，有人买的时候价格就高，没人买就低。因此封闭式基金你买入的成本可以甚至比基金份额的价值要低或者要高，即每天都在波动。'
  - '[PAGE 94]


    当时的封闭式基金更是不能被大多数人所看好，因为封闭式基金的封闭，意味着管理者一旦发行了基金就不再为之后的揽新客户发愁，因为买了就不会马上来基金公司要钱赎回，不会再从基金公司那里再把钱要回来一说，也就不用再对业绩有太大的焦虑。市场就因为这个对其非常不看好。


    有不少封闭式基金得以用 5 折的价格在市场上交易 1 元的东西只卖 0.55 元，封闭式基金的投资中还包括 30% 的国债。要知道国债基本上就是钱，不可能用
    50 块买 100 块的国债的。但是市场低迷起来是家都不认识的。就那个时候开始我父亲就开始全仓持有封闭式基金，我也是在那个时候听从我爸爸的以上逻辑把我所有的压岁钱都买入了封闭式基金（2700元）。'
  - '[PAGE 95]


    你说封闭式基金真的赚了很多很多钱吗？其实相对的上涨百分比上不是最优选择，它在2007年的暴涨中不是涨的最多的。那为什么这个东西成为了这次的成功的关键了呢？因为仅仅以上的这个逻辑，会让你在熊市的时候手握光明。在漆黑一片的市场中的那一点点光明。知道自己拿着的资产相当于还要再跌一半下去才是现在的成本。这就让你在熊市中能够比别人多那么一点希望。而这点希望才是能够熬出熊市的关键，关键是你的全部家产都在股市的时候，这种信念可以说比任何消息，任何人给你打保票，都来的重要。在那个当下你会觉得这是最好的选择。'
  - '[PAGE 96]


    我父亲当时就不停的给我念叨“你看有这种好事，100块的东西只卖50快，你说买不买？”，其实我知道他是说给自己听的。我父亲就这样能够坚定的从熊市就满仓持有封闭式基金，一拿就是好多年。想想这50块买到100块的感觉就乐的睡不着觉，于是可以不停的说服自己“亏损都是短暂的”。


    后来的故事大家就都知道了2007年“死了都不卖”这首歌红遍大江南北，那时候我小学5年级，上证指数达到历史上的最高点从998涨到6124，超过6倍。我截个图哈'
