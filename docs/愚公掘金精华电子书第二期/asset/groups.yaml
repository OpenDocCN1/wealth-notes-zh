    ## 可口可乐这种顶尖品牌为什么还要每年持续大量的投放广告？


    **提问：**


    花爷，你好！可口可乐这个品牌明明已经站到顶端位置了，为什么还要每年持续大量的投放广告


    **回答：**


    讲个有意思的地方，很多学科的道理其实是相通的。


    比如物理中有惯性的概念，质量越大，惯性越大。在商业领域其实也类似，越是大品牌，品牌的影响力就越持久。


    那惯性在什么时候会减小呢？在摩擦力出现的时候，在外力出现的时候。同样的道理，品牌的影响力也会随着时间、随着竞争对手的出现消减——如果你一直无所作为的话。


    广告界有句名言：我知道我的广告营销费用有一半被浪费了，但我不知道是哪一半。


    用户接受一个品牌，通常需要多次的触达，才能占领认知，最终形成购买决策。在这之后，又需要不同的触达，提醒用户复购。


    在这个过程中，品牌不知道自己做的哪些广告达到了触达用户、占领心智的效果，那只要多次触达，保持曝光，才能确保。


    哪怕这些广告中有一半被浪费了，那这浪费也值得。


    商业领域里，能够牢牢把握某个细分行业头把交椅一百年的品牌并不多，为什么？因为随着时间推移，消费者的口味、时代的潮流是多变，品牌想火一百年，需要在每个5-10年里，都踩准最正确的营销广告策略。


    可口可乐显然做到了，所以它是其中的佼佼者。它能火这么多年，恰恰是因为它能在不同时代采用了不同的、却又非常正确的营销策略，你说它敢把广告停掉吗？


