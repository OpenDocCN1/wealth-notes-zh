    # 自己性格上有一些与职场不匹配的地方，到底要不要改？


    最近一周出去逛了一圈，更新比较少，见了几个老同学老朋友，被问到一个很有意思的问题。


    我这帮老同学，私企外企上班的有，做生意的有，体制内和国企的也有，混得好一点的已经当了经理，不过大体还是刚工作没几年的基层。


    跟他们一个个聊天的时候，不约而同的都说 到这样一个烦恼：'
  - '[PAGE 680]


    工作几年之后，发现自己性格上有一些与职场不匹配的地方，到底要不要改？


    比如有个同学，脑子其实蛮灵光的，各种人情世故也很懂，但是骨子里，性格不喜欢交际。偏偏他也在公立单位上班，总听人说能爬上位的都是长袖善舞的角色，很纠结自己到底要不要也去吹彩虹屁巴结领导。


    再比如有个同学，这几年混得还不错，做生意赚了一小笔，但是做生意的人都爱焦虑，总看到圈子里别人干这个赚钱了、干那个赚钱了，心里越想越乱，不知道自己该不该也换个方向、换个模式去做生意。


    类似的问题，花爷以前也有过，我了解的圈内各行各业的生意比普通人多得多，最开始的时候，心也乱，吃着碗里的，总想盯着锅里的。


    675


    公众号懒人找资源'
  - '[PAGE 681]


    后来怎么想通的呢？我看了一本书。


    说起来这本书，不是什么名言巨著，反倒是一本历史小说，马伯庸的《三国机密》。书的很多内容已经忘了，但有一些段落，还历历在目。


    这书的主角，是东汉末年的汉献帝。当年马伯庸和一帮作者吃饭，讨论历史上究竟哪位末代皇帝最难翻盘，大家都认为汉献帝配得上一个提名。


    大家对汉献帝最熟悉的典故，应该是曹操挟天子以令诸侯，这里的天子，就是汉献帝。历史记载中，汉献帝其实蛮有胆略，无奈汉室没落，资源实在太差，汉献帝一生颠沛流离，根本翻不了盘。


    于是马伯庸就写了这本小说：如果我是汉献帝，究竟能否翻盘呢？'
  - '[PAGE 682]


    因为马伯庸从来不写穿越小说，所以他在开头，安排了一个“替身”的情节。具体是这样，汉献帝生病快死了，但他在民间其实一直藏着一个双胞胎弟弟。于是弟弟就进了宫，顶替哥哥成了汉献帝，小说故事以此开始。


    这个套路其实挺老套的，但让我印象深刻的，是这样一个小细节。


    小说里，真正的汉献帝，为人阴冷狡诈，但他的弟弟是民间长大，为人却忠厚善良。刚开始顶替哥哥的时候，弟弟总是刻意模仿哥哥的狡诈冷血，心里却很痛苦，结果事情一件也没做好，被阵营里的臣妾各种嫌弃。


    这时候有个谋士，跟弟弟说了这样一段话。'
  - '[PAGE 683]


    他说啊，历史上成功的皇帝，其实各有各的天子之道。有的冷血无情，有的宅心仁厚，都有成功的案例。重要的是，无论你是什么样的处事风格，只要能坚持一辈子，就是你的道。


    弟弟就是听了这句话，决定遵从本心，开启自己的征程，而不是做哥哥的替身。


    这个故事我跟好几个老同学讲过，我自己也时常提醒自己：


    找到自己的处世之道，找到自己所能提供的价值，然后用时间去贯彻它。


    有时候你可以根据环境的变化，适当的做一些调整，但永远不要违背自己的本心，试图把自己变成别人。'
  - '[PAGE 684]


    你可以用眼睛看别人，可以动手学习别人，但屁股一定要坐在自己的位子上，不然就容易摔屁墩。


    这道理听起来挺哲学、挺虚的，但没事拿出来琢磨琢磨，总能品出点味道来。


