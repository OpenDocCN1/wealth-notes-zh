    # 提问：


    我在一个小县城的事业单位工作，想发展副业，目前对社群很感兴趣，发现小县城的社群文化还很欠缺，线上线下活动几乎没有，请教花爷，您觉得在县城做新型社群有没有商机？


    # 回答：


    最近几年小县城最活跃的社群主要是两类。'
  - '[PAGE 338]


    一类是线上麻将游戏的社群，不知道你家那边有没有，前两年各地的麻将线上游戏很火（今年有的地方管的严了），代理从游戏平台购买房卡，然后拉人进微信群，撮合在线上平台打麻将。用户打麻将需要消耗房卡，代理主要赚这中间的差价。


    还有一类是团购群，用低价的生鲜、水果、食品等高频产品引流大家进群，然后慢慢扩充品类。


    这类一般有两种形式，第一种是加入某个供货平台（比如社群团购，或者淘客也行），社群管理者只负责引流、销售，发货出货交给平台处理，第二种就比较简单粗暴了，有的人会直接拉个群，统计购买意向，然后自己开个面包车去批发市场大量采购，再按统计意向分给用户，挨家给送过去。我看过的成功案例，一年营业额也能做大几十万。'
  - '[PAGE 339]


    以上两类社群是普适性比较高、门槛比较低的，相对的，你的县城里可能也有人在做了，竞争可能激烈一点。


    花爷再补充两个相对小众的社群类型。


    +   1.商家的本地学习交流社群：


    任何时代，商会都是有需求的。小县城生意难做，中小商家其实很需要链接、交流，以学习的名义把大家组织起来线上线下活动，这样的社群在很多地方都有成功案例。


    这种社群一般需要你在商户圈子里有一定人脉，你或者你认识的人能牵头把冷启动做起来。


