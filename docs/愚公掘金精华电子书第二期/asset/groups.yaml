    ## 花爷同步下副业课进度和星球会员可享受的福利


    最近忙完了一件很重要的事，终于能喘一口气了。一转眼20年都过了一旬了，跟各位花友同步下最近的一些计划吧。


    1. 被大家拿着砍刀催的第二职业课程，这次是真的在准备中了，小助手在搭建听课的平台，花爷在准备课程目录，一切稳的一批，预计下周就跟大家见面。


    这次的课程，怎么说呢，如果我做成小班的训练营，收费四位数，一点毛病都没有，绝对不愁卖。


    不过我有我的计划，这次的内容，我希望更多人能看到，真正的学习到，而不是被各种“月入十万”、“躺赚”的课程耍的团团转，市面上太缺基础的通识教育了。


    所以最终定价不会高，放心。


    作为星球会员，额外享受到的福利主要有二：


    第一是课程前期不会对外开放，只对内开放报名，大家可以提前看到更新，后续的一切课程内容升级也都能看到。


    第二就比较直接了，星球会员再优惠一点，永远是全网最低价，现在是，以后也是，这条承诺不会变。


    2. 前阵子星球里主要是答题为主，没怎么更新其他内容。其实花爷有不少内容想写，确实是没时间。不过现在时间宽裕一些了，立马把想写的内容提上日程。


    我准备写一篇文章，谈谈我对2019年的总结，以及2020年的趋势判断，包括国内商业链条的分工变迁、个人跨越的机会等等。


    文章写起来比较费劲，估计要年后再发了。不过年前，我会陆陆续续把一些小要点都发到星球，直接跟花友们讨论。很多内容我都已经拥有了腹稿，想想就有点小激动。


    3. 之前说过，这个月公众号发恰饭广告的广告费，过年拿出来给大家发红包。


    具体发多少还没想好，看到时候的心情，我这人就是经不住别人夸我像金城武，一听就容易高兴。


    4. 年后回来二月份，有一批老会员快到期了，一直有花友追着问什么时候上到期续费的折扣。那这里就明确的说两点。


    第一，老会员续费一定是所有加入星球的方式中价格最低的，没有之一，大家一年的感情在这，不用多说。


    第二，到期续费的折扣二月份会上，到时候我准备搞了直播活动，给大家做一次分享，具体是群里分享还是语音直播间，还没想好，主题也没定，反正有这么个想法，年后来筹备。


    5. 大家知道，19年上半年我写了几篇文章效果特别好，但下半年因为时间关系，实在没空写长文了。20年，回归深度的内容创作是花爷计划的重中之重，同时，新一年的星球内容、活动也会更频繁起来，我已经想好了框架，等二月份回来给大家公布，嘿嘿。


    暂时就这样。


    新的十年开启了，我很爱过去那十年，我很期待未来这十年。


