  md: "\n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_459_0.png)\n\
    \n## 花爷是如何做知识管理，在需要的时候能想得起，用得上？\n\n**提问：**\n\n我替一些小可爱，问花爷：\n\n你是如何做知识管理，在需要的时候，做到想得起、用得上的？\n\
    \n**背景：**\n\n星友们应该都能感受到，花爷是个把自己浸泡在信息流中的人。各种理论、案例，能记得住、用得上，这也是种能力。\n\n除了通过反复应用、反复表达来加深记忆以外，你还有啥管理信息和知识的心得？\n\
    \n**回答：**\n\n说实话，方法简单到爆炸。\n\n我知道在很多领域，比如时间管理、信息管理上，有很多大师，也有很多理论方法。\n\n我也尝试过这些方法，但是后来我发现，大多数的理论和方法，实在是太复杂了。复杂到普通人在用这些方法管理信息、管理时间的时候，坚持不了几天就想放弃。\n\
    \n比如知识信息管理吧，一般的理论方法里，都会涉及到整理、分类、脑图、应用等等，我真的很想问，这么复杂有多少普通人能坚持的下来……\n\n反正我是坚持不了，我承认，我就是一普通人。\n\
    \n所以我做知识管理的方法很简单：\n\n1. 管控信息源，低质量的全部取关，然后剩下的，多看，每天看。\n2. 看到好的内容，收藏，确保用的时候找得到。\n\
    3. 好内容，多讲给别人听。\n\n我甚至觉得上面这三条，说是知识管理我都有点不好意思，太高大上了。\n\n以大部分人的程度，根本没到知识管理的地步，核心还是懒，懒得看、懒得和他人分享信息。\n\
    \n但懒不是问题，人天性就是很懒的，我们需要的，是不断的正反馈，才能激励自己培养一个好的知识摄取习惯。\n\n很多人爱看抖音，因为十几秒就能收获一段情绪，很多人不爱学习，因为学了好几天分数也不一定能上的去。\n\
    \n这就是正反馈的作用。\n\n那不断获取优质信息的正反馈是什么呢？\n\n第一，跟朋友分享信息，别人不知道的事情，我都知道。说得好听点，叫分享信息的社交愉悦感，说得不好听点，就是装逼。\n\
    \n所以我常跟人家说，要勇于装逼，小小装逼和虚荣心是学习的第一个起点，不然为什么小时候大家爱争第一名呢？\n\n一些理论里说，跟朋友分享信息，是为了巩固自己的知识，有点太虚了，大家都直白点，分享信息，就从满足自己小小的虚荣心开始。\n\
    \n第二，分享信息能获利，能挣钱。这个没啥好说的吧，长期把第一条做好，第二条就是水到渠成的事。把分享信息作为一份职业，能挣钱了当然有动力。\n\n我现在算是两条都齐全了，而且对信息量的要求也很大了，但我仍然没有用那些特别复杂的知识管理方法，所以我觉得对于大多数人来说，也不需要搞那么复杂。\n\
    \n当方法比问题还要复杂的时候，这个方法往往是坚持不下去的。\n\n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_465_0.png)\n\n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\
    \n## 花爷有时间可以扒下保险销售的一些技巧吗？\n\n**提问：**\n\n花爷，我现在在做保险行业的Toc app，需要背保险销售转化指标，花爷有时间可以扒下保险销售的一些技巧吗？万分谢谢\n\
    \n**回答：**\n\n推荐李叫兽的一篇文章，《改变消费者的说服文案，有且只有以下4种》\n\n李叫兽虽然实战成绩比较差，是典型的理论派，但这篇文章的理论确实很棒，我还是新手的时候，卖货会参考这四个维度来做包装。\n\
    \n这里简单摘录一段案例：\n\n李叫兽之前遇到一个做个人定制旅游的“榴莲旅游”，在一次营销活动中，想要说服大学生毕业游，不要自由行，而选择更加省心的定制游。\n\
    \n首先，你想改变什么人在什么情境下的哪种行为概率？\n\n比如：提高大学毕业生，在选择毕业游的方式时，选个人定制游，而不是自由行的概率。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_467_0.png)\n\
    \n然后，寻找他们在这个情境中的“喜爱刺激”和“厌恶刺激”。\n\n“喜爱刺激”是消费者在这个情境中渴望的行为，就像喝红牛的时候“喜爱刺激”是“精神”，在毕业游，喜爱刺激可能有：低价享受土豪的生活、无忧无虑而不是烦心等。\n\
    \n“厌恶刺激”是消费者在这个情境中厌恶的行为，就像喝红牛时“厌恶刺激”是“困了累了”，在毕业游，厌恶刺激可能有：花了很多冤枉钱结果没有享受、被一些黑店坑等。\n\
    \n接着，利用两种刺激，去强化或者惩罚某种行为，以改变行为概率。\n\n1. 利用“喜爱刺激”强化购买行为，让消费者觉得用了你的产品，就会获得这种刺激。\n\
    \   “预算有限的毕业旅行，一样可以享受土豪的生活——Day2，敞篷跑车带你环游海岛”\n   (激活消费者的“追求心理”。)\n2. 利用某种“厌恶刺激”强化购买行为，让消费者觉得用了你的产品，这种厌恶刺激会减少。\n\
    \   “青春和心情都是有限的，不在不好玩的景点上浪费时间。——最优行程计算，删除不值得去的景点。”\n   (激活消费者的“规避心理”。)\n3. 利用某种“喜爱刺激”来惩罚不购买的行为，让消费者觉得如果不用你的产品，某种喜爱的东西会丢失。\n\
    \   “旅行最爱无忧无虑，但自由行并不能帮你这一点。”\n   (激活消费者的“失去心理”。)\n4. 利用某种“厌恶刺激”来惩罚不购买的行为，让消费者觉得如果不用你的产品，就会面临某种厌恶刺激。\n\
    \   “期待4年的旅行，怎能一脚踏入黑店?”\n   (激活消费者的“恐惧心理”)\n\n总之，如果你想要改变用户在某个特定情境下的行为概率，能够被文案利用的心理有且只有四种：追求心理、规避心理、失去心理、恐惧心理。\n\
    \n卖保险产品也是一样，保险行业最常用的就是恐惧心理和失去心理。\n\n比如肺癌险吧，目标人群显然是吸烟人群。最常用的宣传就是：\n\n吸烟有xx%的大概率得肺癌、肺癌一旦诊断就是中晚期治愈可能性极低、吸烟的肺和正常的肺对比、肺癌高发人群的五大症状——利用恐惧心理。\n\
    \n吸烟得肺癌，肺癌治疗费用高达xx万元，治疗过程极其痛苦、成为家庭的巨大负担、几十年省吃俭用转眼就被掏空，人、财、家人生活质量全部落空——利用失去心理。\n\
    \n有了这些方向，剩下的就是寻找各种论据，多方面支撑观点了。\n\n现在保险的软文广告很多，保险是最近两年利润增长最快的行业，没有之一。带着上面的理论多看别人的宣传，能看出不少小窍门。\n\
    \n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\n![](img/62659df0b3729b5d99b589094fb4b8b0_472_0.png)\n\
    \n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\n## 花爷看一个行业问题的时候是如何获取行业数据的？\n\n**提问：**\n\n关于研究方法的问题，请花爷指教一下，花爷看一个行业问题的时候，行业数据是怎么获得的呢，比如我现在想研究电商与直播带货，直播目前对电商平台商家的影响，直播流量来源，直播的多元玩法，有点无处下手，花爷会给些什么建议呢？\n\
    \n**回答：**\n\n有个知瓜数据可以看淘宝直播带货的数据，还有个叫飞瓜数据的可以看抖音快手短视频带货数据，这俩是一家的，他家还有个西瓜数据可以看公众号数据，反正取名就是各种瓜……\n\
    \n一般这类工具价格都蛮贵的，推荐你个网站，可以看到各种工具的介绍，还能领试用：首页 - 增长工具箱\n\n本内容来自帮助一部分人先突破人生天花板的社群“愚公掘金”，请关注公众号“花爷梦呓换酒钱”，回复“愚公掘金”了解社群。\n\
    \n![](img/62659df0b3729b5d99b589094fb4b8b0_475_0.png)\n\n# 花爷梦呓换酒钱\n\n让一部分中产先冲破天花板\n\
    \n## 花爷觉得体育这个行业在未来几年国内发展会怎样？\n\n**提问：**\n\n花爷好，您好！想请问下您是如何看待目前国内体育行业发展呢，最近朋友邀请我去一个主要承接体育赛事的公司上班，可我感觉这两年国内经济都不是很好，而且前几年政策都在说扶持体育，可这几年我感觉体育好像也做不太起来的样子，加上看新闻万达体育还亏了不少，但朋友总说这是个朝阳行业，我很担心这是个看似朝阳其实是发展比较难的行业。。。摇摆不定，花爷您觉得体育这个行业在未来几年国内发展会这样？\n\
    \n**回答：**\n\n我以前还会写一点讲趋势的文章，现在不写了，只在星球里说一说，为啥呢？\n\n因为很多人的脑子，他就是直的，你真是一点办法都没有。你说某个行业的趋势是上涨，他就认为这个行业干啥都能吃到红利，回头没有效果，还要喷你的趋势不对。\n\
    \n任何红利、趋势，主要是起个助推作用，关键还是个人的努力和执行。一坨牛粪，它就是插上鲜花，摆上满汉全席，它也好吃不了啊!\n\n拿体育行业来说，是不是朝阳行业呢？\n\
    \n整体来说，是的。体育的内容IP越来越值钱，周边产业的需求也越来越旺盛，政策上官方也很看重，体育健康事业的建设是政绩考核的一部分。\n\n但具体到执行，这行好不好做呢？真的不是很好做，或者说，普通人做成的概率很窄。\n\
    \n内容IP和周边体育用品产业，盘子太大，需要大量的资金调动，腾讯买NBA的版权费是5年15亿美金，各类体育品牌的营销和资金门槛也非常高，早就不是以前德尔惠这种小作坊猛砸广告就能起盘的时代了。\n\
    \n普通人从事体育行业成功的案例，往往是以下几类：\n\n1. 体育类的自媒体、网红，有流量之后，带货和广告（主要收入）、卖资源（比如内部活动票、明星合影机会之类的）\n\
    2. 体育体系里的人，利用手头资源做生意。厦门大学的教练，用学生和人脉资源帮自己的体育用品品牌\"淮者体育\"站台宣传，现在这个牌子在国内算做得比较好的个人品牌。\n\
    3. 专业人士做体育培训，也有一些成功案例。这类整体还是做生意的逻辑为主，获客是重中之重，明星运动员开的培训往往能够马上收到成效，也是因为这个原因。\n\n\
    你朋友邀请你的承接体育赛事的公司，说到底，未来发展如何和体育行业没太大关系，主要还是看能不能稳定的有承办体育赛事的单子。\n\n一个省有能力办体育赛事的机构和企业，一共也没多少，这里头，人脉关系和资源很重要，你懂的。\n\
    \n从职业发展角度看，这个行业的局限性比较大，跳槽的选择性也不多，再加上你朋友邀请你的公司又是个吃资源的行业。如果你不是特别热爱体育，我不建议你去。\n\n\
