    ## 以大闸蟹为例讲两个突破圈层，触达用户的商品营销案例


    **提问：**


    花爷，从8月十五前一周开始，有之前在北京的时候一起的兄弟托我搞了点梭子蟹，然后在朋友圈里做了半个月，收益还可以，准备再做几个品类，然后包装个青岛特产的礼盒出来，走团购和政企渠道，做淘宝的话没有经验，怎么样才能扩大规模？


    **回答：**


    以大闸蟹为例，说两个真实案例，一个微信，一个淘宝，你看有没有一点启发。


    不管哪种模式，都是突破圈层、接触更多高质量用户最重要。


    在微信，有个哥们儿做大闸蟹的，主要的破圈手段就是送。


    他加了很多知识星球，跟星主搞好关系，在星球里做福利抽奖宣传，或者通过星主做宣传介绍，加了不少星球好友的微信，毕竟到了季节买大闸蟹是刚需。


    然后在他那里买了或者领了中奖的大闸蟹之后，他都会额外送一些。因为星球里人群质量比较高，拿了人家的东西不能白拿吧？至少要发个朋友圈宣传一下，人群圈层一下子又扩散了一层。


    举一个他在条形码的星球做抽奖宣传的例子：https://t.zsxq.com/v7m2V7U


    在淘宝，今年最火的方式就是做大闸蟹的蟹券。


    平常买大闸蟹，八只至少150-200元，今年八月份开始，蟹商就推出了蟹券，原价几百块，折扣后一百多，用完优惠券八九十块钱就能买到蟹券，到十月再用券提货。


    一般这种都是找淘客合作一起推（不知道什么是淘客的去复习：https://t.zsxq.com/62BAuZB），我看到淘宝京东做蟹券销量比较大的，一个月都是数十万单。


    这么做的好处，首先提前给当年的销量有一个保底，其次用低价券把销量和平台排名给冲上去，等到十月份大闸蟹的正季，再正常价格销售，赚取利润。


    举一个淘宝蟹商和微博淘客合作推蟹券的例子，看下图。


    在微信和在淘宝，思路是一样的：


    找到合适的渠道（如上面的星球or淘客），以合适的方法合作（如上面的抽奖or分佣带量），先把人群基数扩大，然后再做活动进一步裂变、转化。


