  - '[PAGE 112]


    这也是为什么这个很难把别人教会，因为听到 60% 大家就走了。正常人只信100%的事情， 但是你仔细想想，世界上哪件事情是100%的。任何东西都会波动，说说这几天的额外收益，
    因为我平时是持有很多股票资产的， 因此发生突发事件，我的资产是跟随波动的， 所以那部分收益亏损不算的情况下， 我增加的操作就是额外的损益了。今天就说说我这几天都做了什么。（上面这句话的意思是，我写这个东西的时候是亏的，因为那时候暴跌下来，现在已经超过去年
    年底的市值）'
  - '[PAGE 113]


    年前，我开了两张认沽期权做空，简单的可以认为是一种跌了能够赚钱的东西。结果效果出奇的好，年后开盘第一天盈利4000。然后倒过来买进改成做多(就是涨了会赚钱)，神一般的节奏踏的非常的准，居然就快速反弹了，总共能到手10000元，细节我就不多说了，这种神操作这么神大多也是运气好，但是我们可以用一次非常成功的经历看看背后的成功要素，以前我也抄底但是从来没有这次这么成功过。


