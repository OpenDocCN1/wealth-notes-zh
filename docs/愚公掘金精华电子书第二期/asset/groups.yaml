    ## 3、国债逆回购注意点


    我今晚讲的三种，都是可以在券商里直接交易的，简单粗暴，下面我讲一些操作国债逆回购注意点。


    ### （1）交易时间


    根据交易所最新规定，逆回购交易日时间延长半小时，即每日9:15-15:30，比股票晚半小时，这很方便白天操作完股票，把剩下的钱转进去，第二天就又可以用来买股票了，丝毫不让钱闲着。


    ### （2）结算时间


    在借出时选择约定的期限，一旦借出成功只有到期后才能获得本息，T日参与n天期逆回购，T+n日返回本金+收益（可购买股票），T+n+1日可取，遇到节假日顺延。


