    ### “金花奖”挑战：拼多多那么多的很多低价水果是如何盈利的？


    #### 挑战提问


    我也试着来挑战一下，期待花爷翻牌。


    今天看到一条新闻，昨天拼多多的股票上涨了8%，市值已经超过了百度，身边有好多朋友都在上面买过东西，就想起来我上次试着在pdd买了芒果，价格比市面上便宜很多，这种很多低价的水果，拼多多又是怎么实现盈利的啊？


    ## 花爷回答


    做生意，要记住一个概念：水果是绝佳的引流商品。


    第一，水果基本属于刚需，要吃水果的人多，特别是女性多，而女性是更好的消费用户。


    第二，水果是高频商品，吃完了还得吃，用水果引流可以带来复购。


    第三，水果从果农手里到水果店，中间是有一定价差的，你把水果当引流爆款，出货量大的话可以直接在上游低价拿货，有价格优势。


    所以，拼多多拿水果引流这事，就很好理解了。


    对拼多多而言，他需要用户，而且现阶段需要中高端用户。电商平台的获客成本很高，关键是这钱还用不出去，你去给那些白领发红包，人家不相信你，水果就是一个绝佳的介质，不光能引流，而且订单完成的过程中可以加深用户信任，让新用户留下来继续购物。


    所以拼多多官方的水果补贴，实际上就是把日常的获客、留存成本，换成低价水果的形式而已。


    而对商家而言，店铺里有些水果平价出手，不赚钱，专门用来获客。因为水果是高频刚需，店铺里另外一些高端品种，再用来拉升利润。


    把两者结合起来，就是拼多多不承担库存，但他把营销费用补贴给商户去低价卖水果，起到平台获客和拉升商户们销售额的作用。


    你单看这一笔交易，看不懂，但你从整个大盘来看，拼多多的营销费用其实没变，但把费用花在水果补贴上，整个大盘都收益，这就是分析问题的视角高度问题。


