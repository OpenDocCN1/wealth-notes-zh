    # “面向结果写作“系列——抛开阅读量和粉丝数来面向结果写作的几个答疑


    继续“面向结果写作”小系列，上次讲到新环境下的自媒体要抛开阅读量和粉丝数，学会面向结果和转化写作。没看的赶紧去戳链接复习：https://t.zsxq.com/7EyFaA2


    有花友私聊了我几个小问题，花老师再回答一下。'
  - '[PAGE 551]


    # ——为什么要降低更新频率，多写精品深度文章？我看很多大号都是日更，写的也比较简单呀。


    因为不同阶段，做不同的事情。大号发展到后期，粉丝数已经见顶了，日更是团队在运作，文章写简单点也没什么。但你看在早期，大号是怎么做起来的？还是靠精品内容几波爆发。


    个人的时间有限，更要把全部资源打到最重要的事情里去，不出精品内容，连前100个粉丝都攒不出来。


    # ——粉丝数和阅读量就完全不重要吗？


    在早期，确实如此。如果你不注重转化和质量，哪怕你攒了一定粉丝，只要变不了现，基本等于竹篮打水一场空，这种付出后却毫无成果的局面是最绝望的。'
  - '[PAGE 552]


    等你保证质量的情况下做到一定粉丝数（比如几千上万粉），再考虑扩充粉丝数也不迟。


    ——我看小红书、微博有很多自媒体号，发的内容都很平常啊，他们是怎么做起来的？


    有一种机构叫MCN，他们通过批量的运作手段，控制了一大批自媒体号，然后打包去做变现（主要接广告）。说白了就是批量造号，这个不是普通人能玩起来的。


    而且这种玩法现在也不好过了，除了几个人傻钱多的行业之外（汽车、高端酒旅、高端护肤品说的就是你们），大部分广告主都越来越精了，特别注重你的内容质量，水分一查便知。


    预告下，明天更新这个小系列的第二部分：在面向结果写作之前，如何找到自己的定位？'
