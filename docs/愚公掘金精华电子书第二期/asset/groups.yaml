    # 请花爷拆借下樊登读书会的商业模式


    提问：


    花爷，可否像拆解长投一样，详细拆解一下樊登读书会的模式？非常好奇他怎么起来的，网上找不到详细的资料。谢谢花爷


    回答：


    很多人以为樊登读书会对标的是得到，完全错了，这俩是完完全全的两个不同模式。'
  - '[PAGE 511]


    得到确实如它宣传的那样，做了一个线上的大学。


    大学的模式是什么？牛逼的大学吸引牛逼的老师，牛逼的老师打造牛逼的专业和课程，牛逼的专业反向促进大学更加牛逼。


    推动整个商业模型越滚越大的，是牛逼的专业老师，所以提到得到，你想到的是刘润的五分钟商学院，是薛兆丰的经济学讲义，是香帅、吴军、梁宁等等大V。


    牛逼的线上大学和牛逼的专业课老师，既是得到的起家法宝，也是得到现在的瓶颈。


    一方面，线上课毕竟不可能如大学线下一学期的课程一般有效，另一方面，大V毕竟是有限的，曲高总是和寡，哪怕你是清华北大，大部分普通人根本听不懂也不想听。'
  - '[PAGE 512]


    所以，用户量到一定瓶颈后不增反跌，是得到目前最大的问题。


    讲了这么久得到，那樊登读书会有什么不同呢？


    如果说得到是一所高逼格的线上大学，那樊登读书会就是一个每天给你正能量的“知识微商”。


    注意，花爷说它是知识微商，不是说它不好，我从来不歧视微商。恰恰相反，知识付费产品其实非常适合微商的模式。


    得到的课，大V出品，反复打磨保证高品质。樊登读书会的内容，有这么高的品质吗？


    没有，樊登读书会的内容可能还不错，但远没到优秀的程度，而且它的内容以拆书为主，优不优秀主要跟书有关系，制作难度其实没那么大。'
  - '[PAGE 513]


    樊登读书会最核心的增长机制，是他的分销裂变机制。


    让我们回顾下，传统的微商为什么被骂？因为2块钱成本的产品卖200块，大部分利润都被拿去发展下线拉人头了，产品质量不行，消费者当然不满意。


    但知识付费产品不同，一旦制作完成，卖1份和卖10000份的成本是一样的，边际成本为0。也就是说，知识付费可以在把利润全部用来拉人头的基础上，保证产品质量。


    樊登读书会就是利用这一点，完成了几波主要的裂变机制：


    +   1. 有过几次免费领付费会员的裂变活动，做的非常成功，其实如我们上面所说，无论新增多少会员，樊登读书会的成本其实都不会增加多少。'
  - '[PAGE 514]


    2. 和几个大平台合作，免费送付费会员，又新增了一大波用户。


    3. 在现有会员中，发展代理，在各城市负责做活动、拉新，新加入的会员给予代理很高的分销提成，直接打穿了很多二三线城市，单这一点，得到几乎就不可能做到。


    4. 后续还发售了实体会员卡，代理可以低价买卡，然后自行销售赚取差价。这招既快速回笼了资金（代理批量买卡要一次性付清），又倒逼代理努力去发展新会员。


    简单来说，得到的增长是大V驱动的，樊登读书会的增长是代理裂变驱动的。大V的数量有限，代理数量理论上无限，这就是二者拉开用户数差距的主要原因。'
  - '[PAGE 515]


    有人可能会想，樊登这套知识微商的模式如果真的这么牛逼，那不是谁套用一下就能做大做强了？


    其实不是。


    樊登能把这套模式跑通，本身也有其强大的护城河：


    +   1. 为了迎合更大体量用户的需求，樊登读书会的内容数量必须够多，这就很考验保质保量快速出课出内容的能力。


    +   2. 虽然裂变成本远低于传统行业，但前期大量铺内容、团队的工资、APP开发和服务器成本等等，仍然需要大量资金，这就考验团队的融资能力，特别是早期，事儿还没办成就靠刷脸讲故事拿到大量投资的人，基本都是圈里的名人。'
  - '[PAGE 516]


    3.高效的裂变、吸收大量全国代理、维护代理出单，本身就是一种能力。这事儿就跟打仗一样，当司令不用上前线看着轻松，但能把几万的兵带好，其实非常难。


    最后补充一句，得到和樊登读书会的案例，恰好符号一条最原始的规律：


    质量越高，价格越高，规模越小。


    （得到的高价产品真的太少了）


