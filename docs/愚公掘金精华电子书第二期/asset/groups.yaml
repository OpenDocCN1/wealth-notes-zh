    # 找工作适合自己很重要


    **提问：**


    您好。我现在想换工作但是比较犹豫，以下是我的信息。我是10年专科毕业，学的建筑装饰工程技术。毕业后做过业务员、销售、仓库管理员、化工厂、电子厂、无抵押贷款、课程顾问等工作，现在在北京做艾灸养生行业，我也喜欢这个行业，只是每天上班十三个小时以上，所以想换工作。家人让我回去考教师资格证，我本人想考对外汉语教师，感觉这个更自由。想请花爷帮忙分析下这三个的利弊给个建议。谢谢


    **回答：**


    你学历不占优势，工作九年来换了至少8份工作，且工作之间基本没有关联成长性，直白点说，一直没有一个始终为之奋斗的长期目标。包括你的提问描述里，提的最多的，也是工作条件，而不是自己的愿景。


    当然，这样没任何问题，我们不应该强求每个人都起早贪黑为梦拼命。虽然我一直鼓励花友们年轻多奋斗，但我不是成功学导师，我很明确的跟你说，我觉得这个世界应该允许有人不想要活得那么辛苦。


    那既然你是这样的类型，那选择职业发展也简单了，尽量选体制内工作，稳定，收入和社会地位中上，你家人如果有资源，能安排你考完证之后当老师，是一个不错的选择。


    顺便说一句，未来教师的收入和社会地位会进一步上升，大家要重视教师这个职业。


