    **提问：**


    长投学堂的拆解文章，是绝佳的流量入口，但也同时暴露了自己的坐标。相信长投的工作人员已经发现了，他们有没有对这篇文章提出异议，要求删帖或者修改呢？


    会不会有被起诉的风险，您是如何权衡考虑的？


    **回答：**


    纠正大家的一个误区，很多人都觉得我写长投的商业模式，是在扒长投的皮，其实不是的。


    确实，我在文章里写过长投用理财暴富来宣传非常可笑，但从整体来看，长投的试学课、兼职代理制度，都是非常好的商业模式，后来在理财、保险、知识付费领域，很多企业都在学长投的模式，足以说明其优秀程度。


    我通过一些投资人，也认识长投内部的人员，大家交流的其实非常好，没有你们想象的那么剑拔弩张。


    很多人觉得世界是非黑即白的，不是对的就是错的，不是好的就是坏的，长投为了宣传夸大效果，那它一定是坏人。其实不是这样，聪明人擅长看到别人的长处，并且利用别人的长处。


    再说负面营销的问题。


    那篇拆解长投的文章，目前3万多阅读，陆陆续续一直还在增加，不算多也不算少吧。


    长投的人从来没有找过我要求删改，一方面，中小企业的公关能力偏弱，没有那么多的人手，另一方面，我自发布文章之后，从来没有再宣传推广过，后面的阅读基本都是花友在微信搜索自己找来的，所以后续的影响力也已经有限了。


    很多人以为公众号会被企业起诉，很可怕，其实吧，大多是一些公众号作者喜欢给自己加戏。


    一般企业公关，第一步肯定是加你微信，跟你搞好关系，商量能不能给个面子做删改。有的大企业比较傲慢，直接在微信投诉，公关词写得很可怕，其实最坏的情况无非是微信官方把文章删了，不能把你怎么样。


    还有极少数情况，大公司会给你直接寄律师函，怎么办？


    那你还不赶紧写一篇声泪俱下的文章，痛斥大公司欺负弱小，怒刷热点？哈哈哈哈哈哈哈。


    真的，别担心，你见过哪个自媒体因为写文章被企业告上法庭并且最终承担了高额赔偿的？


    做自媒体，最怕的是不跟党走，其他方面，风险不大，你懂的。


