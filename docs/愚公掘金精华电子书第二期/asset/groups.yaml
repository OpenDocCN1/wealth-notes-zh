    ## 进入新公司后，从0到1的淘宝电商实战讨论


    分享嘉宾：花友周骁，入淘七年，14年至今打造月销量过千的商品15款，单款总销量最高10万件，全店总销量破100万。


    分享：


    ### 一、从0到1打造爆款竞品


    #### 1、打造竞品


    大家好！我叫周骁。


    今年7月份在现在的公司入职，公司主要业务是母婴类双肩包的生产和销售。老板天天和我说，让我给他一个计划，怎么把品牌影响力做起来，怎么吸引粉丝，说我做好计划就给我升职加薪，迎娶白富美，走向人生巅峰…。


    公司原本没有线上销售平台，一切都要从0开始。


    我想一个消费者，面对一个没有任何名气的产品，首先能够吸引他的，肯定是价格，然后收到货，他会对你的产品进行一个价格和质量的匹配。他要是觉得一般，那可能就没有下次了，如果他觉得物超所值，那可能彼此间的故事就会继续。。。


    我觉得可以从这方面下手，于是我和老板说，开发两款极致性价比的产品，价格定位在100，从面料，做工，细节处理，包装，审美，服务，售后，每一个配套环节，都做到极致。这两款产品，可以不盈利，甚至小亏，用来打造店铺和品牌形象。提升影响力和市场占比。吸引一部分顾客，成为我们的忠实粉丝。


    这段时间，我每天跑生产车间，和车间的裁缝师傅建立了深厚的革命友谊，终于生产出了两款个人觉得比较有市场竞争力的产品。然后花心思拍照，做文案，挑模特，等等一系列工作，接着投入店铺进行了一系列推广，算是小有所成，虽然比不上行业大佬，但是好歹有所成绩，饭碗算是保住了。。。

