    30 分钟走势类型的中枢，那么 5–6 作为 5 分钟走势类型的回落，并没有回到中枢 A 中（即 5–6 的低点比中枢 A 的 ZG 高），它就构成了第三类买点。同时这个第三类买点也证明了中枢
    A 已经构筑完成，所以我们用第三类买点来确定前一个中枢的终结。'
