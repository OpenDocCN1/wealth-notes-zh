- pgno: 184
  md: '# 一、关于分型、笔、线段


    # 1. 笔和线段在运用时的区别是什么？


    笔与线段的内部结构其实是一样的，它们的区别只在于级别的大小。


    类似的情况可以不断地去推演，到最后只是级别的问题。极小中枢可能是秒上的中枢，甚至只是三个价位重叠产生的中枢，它连笔中枢都不是，但内部依然有结构，可以把它理解成最小中枢。


    在运用时，应该关注的是买卖点的级别，出现的顶底分型是笔的买卖点，还是线段的买卖点，还是标准走势的买卖点。操作只是级别问题，它的内部一定存在结构且最好满足结构饱满的要求。


    # 2. 笔与级别的关系。


    级别越高的笔( 内部需要有次级别走势类型, 有背驰, 有标准的走势完成 ), 稳定性越高，反之容易形成笔的破坏。当我们的交易水平还不高，对整个力量对比还没有完全建立起来时，需要大一点的级别去交易，至少要看到
    30 分钟以上的级别。初期尽量不要用 1 分钟、5 分钟走势去做，小级别是用来观察生长的。


    # 3. 如何判断顶底分型是否成立？


    如图 4-1 所示，从本级别图上看，会发现 0-5 内部是有一些波折的，也就是说这里面形成过一个很小级别的盘整走势类型运动。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_185_0.png)


