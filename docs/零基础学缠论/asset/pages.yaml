    缠论就是在破当下，它用一种很清晰的表达告诉我们，当下的思考方向、思考重点应该是什么。


    2011 年 年末， 正赶上重庆啤酒的崩盘走势（80.5元一路跌到17.5元），利用缠论分析后，震撼到我了，因为当时，在我所掌握的理论里，只有缠论能告诉我，这
    60 多元的下跌过程中，只在 2012 年 1 月 20 日这天才能介入，因为只有这天才出现了第一个 1 分钟买点，而且这个买点信号是那么的清晰可见。


    缠论的最大功效就是对我们原有的底层逻辑进行颠覆和重构，缠论指导我们不再以 的角度看待市场。


    交易是一场修行


    只有从源头上解决问题


    最终才能得到想要的结果


