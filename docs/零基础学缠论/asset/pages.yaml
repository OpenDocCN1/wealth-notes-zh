    没有走出我想要的力量，5-6 拉回中枢就要注意了，当 6-7 还是没有很强的力量打出去，中枢 3-4 的离开段 4-7 明显没有进入段 2-3 的力度强时，到
    7 这里我是减仓的，9 这里不出新高就全清仓了，2-7 这个盘整走势类型可以随时结束。'
