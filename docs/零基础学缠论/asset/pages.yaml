  md: '在分解时，3 是最高点，一般是把 0-3 当成一个走势，因为它有中枢、进入段、离开段，结构是饱满的，所以从 3 这里切开，不把 1-4 当成一个中枢。当然，用多义性分析，把
    1-4 作为一个中枢，当出现第三类卖点 5 时，中枢 1-4 被确定下来也是没有问题的。


    另外，盘整走势类型看第三类买卖点，强调的是对于盘整走势类型来说是没有方向的，但第三类买卖点预示走势方向的产生，而走势的方向是交易最先需要搞清的事情。


    # 12. 趋势离开段（c 段）是否应该要有第三类买卖点？


    如果 c 段里有第三类买卖点，这个 c 段是标准的，从级别上讲，它就不存在小转大。如果它没有第三类买卖点，也可以在中枢 B 中继续震荡。因为趋势走势类型的结构饱满，可以随时完成，所以
    c 段要更加当心一点，它很容易对应同级别的反向走势（如图 4-88 所示）。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_253_0.png)


    图 4-88'
  merge: -1
  img_proc: true
- pgno: 254
  md: '缠师在没有提出小转大之前，全部按严格的理论推导，无论是中枢 A 还是中枢 B，一定有第三类买卖点来终结它，然后再说后面变化的事，但在实际走势中，小转大不是一个偶发现象，是经常出现的，也是很重要的一个分类。结构完整出现第三类买卖点对应的是标准走势，小转大对应的是非标准走势，它们都是对走势转折的描述。c
    段中要防止小转大，所以一般出了高点，加上量价配合的判断，有问题就先出来，后面即使有上涨也是空间有限，当然这并不绝对，还要看它离开的力度，它有更细微的结构可以用来观察。如果非要用第三类买点严格去套用的话，会发现很多地方的适应性是有问题的。


    # 案例 重庆啤酒


    如图 4-89 所示，0–5 是一个日线级别的上涨，但它一个 1 分钟走势就下去了，从 80 元跌破 20 元，是一个标准的小转大。如果非要等三买去确认的话，5–6
    这段下跌就跑不了，但如果按结构来看，当 0–5 出现两个同级别中枢，c 段 4–5 一出新高，就可以减掉应对小转大的仓位了。所以 c 段要提高警惕，尤其是已经运行很久、涨幅巨大的品种。'
