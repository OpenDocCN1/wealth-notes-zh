  md: '所以不能根据账户里单子的涨跌一味地去单方向考虑，这是最核心的，要知道市场的力量在哪里，再考虑怎么去布局。


    # 10. 有人觉得缠论原文最大的问题是前后矛盾，为什么会有这种感觉？


    有些朋友总结说：缠论原文中一开始说所有买卖点都是由背驰产生的，后来发现有例外，来了小转大；第一类买点＋第三类卖点的组合与前期定义自相矛盾，又来了中阴段。


    当我们把缠论原文完全领悟后，就不存在这个困惑了。缠师是想把他的东西梳理给大家看，刚开始阐述的是标准模型，但随着教学的展开，缠论逐渐被细化，逐渐抽丝剥茧地论证着定义、呈现着应用。


    我以前讲课也是这样的过程，2008 年做教学工作时，一开始的梳理肯定是粗线条的，讲的过程中发现有很多问题或有些内容没有讲到、讲透，会重新添加修改。有一位学友，第一期听了，过半年又来听，发现跟以前讲的看似一样，但核心内容的阐述发生了很大变化。就像小学教案，现在小学的教学内容和
    5 年前是不一样的。


    这是进化过程，这种进化过程是被允许的，但主干的东西没有改变。缠论原文中的定义在前后文上是有些出入的，那些定义在我看来本身就不能称之为定义。缠中说禅第一定律、第二定律，在我看来不是定律，定律是不变的东西，上述定律却告诉我们有三种变化，这叫定律吗？但它告诉我们，变化才是核心才是必然，如何应对变才是要掌握的核心内容。如果你僵化地、机械地用，其实用均线、MACD
    就够了，不用学缠论的。


    缠论能让我们精准地分析市场，它可以做到完全分类，让我们知道怎么变，怎么读懂市场，应变才是缠论的核心。所以没有必要纠结在它的矛盾中，其实它不矛盾，说的是一个东西，而恰恰这个所谓的矛盾是我们理解缠师的思维、精选地理解缠文的捷径，用生长的逻辑理解事物是缠论给我们带来的重要思'
