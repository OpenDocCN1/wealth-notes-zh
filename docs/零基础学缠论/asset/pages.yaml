- pgno: 122
  md: '# 四、缠论分析的几个核心


    到现在为止，我们已经学习了缠论基础的大部分内容，缠论的构建已经有了一个基本的雏形，理论中的几个核心要点也已经浮出了水面，我们来作一个小结。


    缠论分析层面有几个核心要点：


    +   1. 走势必完美：是缠论的指导思想。


    走势必完美是整个缠论居统摄性地位的指导思想。


    +   2. 级别：关注递归逻辑，使走势可立体分析。


    没有级别，一切都是混沌的。有了级别和递归的双重指引，走势就变得立体化了，走势之间的关联性变得非常有序，所有走势都可以被唯一定义，所以掌握级别的概念并能熟练地运用是非常重要的。


    +   3. 背驰：引入动力学逻辑，能锁定第一类买卖点。


    有了背驰和区间套的概念，才可以锁定第一类买卖点。而第二、三类卖点也是次级别或次次级别的第一类买卖点。


    +   4. 结合律：保证缠论客观性的铁律。


    很多学缠论的人并不特别重视结合律，觉得它可有可无，其实结合律是保证缠论客观性的铁律。缠论的运用必须遵守结合律，如此，多义性地表达才能呈现“变换不变性”的客观性，走势才能鲜活起来。所以结合律是无处不在、绝不可违反的存在，我称它为保证缠论客观性的铁律，后面会详细讲解。


    缠论的这几个核心要点，需要深入理解和掌握，在这几个核心要点上，要多下功夫，才能真正掌握缠论。'
  merge: -1
  img_proc: true
- pgno: 123
  md: "# 结 合 律\n\n结合律是缠论分析中必须遵守的铁律，是我们经常运用但却容易忽视的一个规则。我是把结合律提高到一个非常高的高度上去认识的，因为结合律的存在，才保证了缠论分析结果的客观性（唯一性），即变换不变性。\n\
    \n# 一、结合律\n\n+   1. 定义。\n\n结合律是二元运算可以有的一个性质，意指在一个包含有二个以上的可结合运算子的表示式，只要算子的位置没有改变，其运算的顺序就不会对运算出来的值有影响。\n\
    \n+   2. 结合律的表达方式：\n* a+b+c=(a+b)+c=a+(b+c) \n\n+   3. 结合律要起作用的必要条件：\n* （1）运算子的位置不变；\n\
    * （2）运算子不遗漏且不能重复使用。"
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 二、缠论的结合律


    +   1. 必须按顺序结合，不能打乱先后顺序。


    数学：$a+b+c=(a+c)+b$（交换律）


    缠论：$a+b+c \neq (a+c)+b$


    在数学应用（都是加法时）中，可以出现 $(a+c)+b$，但在缠论应用中，各组件是不能这样打乱顺序用的，即在缠论应用中符合结合律，不符合交换律。


    +   2. 任何组件不遗漏且不能重复使用。


    $a+b+c \neq a+b \neq (a+b)+(b+c)$


    当走势拆解、重新组合的时候，已经用过的组件，不能再被重复使用。组件遗漏或重复使用，即违反了结合律。


    它的表达式是 $a+b+c \neq (a+b)+(b+c)$，$b$ 的重复使用一定导致结果的变化。


    # 三、结合律在缠论中的运用


    +   1. 笔的结合律运用。


    笔的组成：顶（底）分型 $+n$（$n \geqslant 1$）根 $K$ 线 $+$ 底（顶）分型。


    笔的确立：新一笔的生成才能确立前一笔的完成。


    如图 3-102 所示，笔由三个组件构成：顶（底）分型 $+n$（$n \geqslant 1$）根 $K$ 线 $+$ 底（顶）分型。这三个组件之间不能重复使用，这也是为什么一笔一定是由五根及五根以上
    $K$ 线来构筑的原因。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_125_0.png)


    在实际应用中，如图 3-103 所示，1、2、3 形成底分型，5、6、7 形成顶分型，3、4 之间存在包含关系。在缠师的定义里，2-6 是不允许成为一笔的，但在我的逻辑里它可以作为一笔。我把
    3 这根 K 线进行了拆分，用它的次级别去看，只是因为 3 这根 K 线运动的幅度过大，而把 4 这根 K 线给破坏掉了，所以可以人为地把 3 这根 K 线分成两根。这是我在处理中的一个变通，但它依然是遵守结合律的，组件没有被重复使用。'
  merge: -1
