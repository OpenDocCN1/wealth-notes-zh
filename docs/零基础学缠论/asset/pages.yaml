  md: '# 背  弛


    # 一、背驰的定义


    背驰是力量衰竭的表现，体现了动力学在缠论中的运用。


    背驰是力量衰竭的表现，而衰竭与否需要比较而得，所以掌握背驰，需要解决谁和谁比的问题。


    # 二、中枢的引力


    +     - 中枢对进入段和离开段具有相同的引力；


    +     - 构筑中枢的组件越多，其能量越大；


    +     - 能量越大的中枢引力越大，脱离中枢需要的能量就越大。


    中枢在构筑过程中会产生势能，即中枢随着重叠区域面积的增加，会产生一种类似于地球引力的引力场（质量）。可以把它理解成一个星体的构建，能量会逐渐转换成质量，而这种质量对它的进入段和离开段就形成了一种吸引力。构筑中枢的组件越多，这种吸引力的能量也就越大。能量越大的中枢，脱离它的时候需要的能量也就越大，我们通过比较中枢的离开段和进入段就可以知道，离开段是否可以真正离开（如图
    3~70 所示）。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_87_0.png)


    图 3-70


    这个逻辑也可以解释一个股谚：“横有多长，竖有多高”，即中枢越大，其引力越大，一旦真正离开，所需动能越大，而越大的动能，其导致的运动时空越大。


    # 三、背驰的判断方法


    +   1. 缠论原文中判断背驰的方法。


    缠论原文中是用 MACD 红绿柱的面积来判断背驰的。


    MACD 是一种常用的判断背离的指标，但是在缠论中没有用“背离”表达，而是用“背驰”表达。


    背离和背驰的本质区别：MACD 指标通常用的是红绿柱的高度，而在缠论中用的是红绿柱的面积。


    在传统理论里可以找到背离的概念：当走势出了新高，但是 MACD 红绿柱高度没有出新高，就发生了指标背离（如图 3-71 所示）。'
  merge: -1
  img_proc: true
