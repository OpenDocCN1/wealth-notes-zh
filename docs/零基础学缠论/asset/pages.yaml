- pgno: 60
  md: '一个构筑完成的线段，其包含的笔的个数必然是奇数。偶数的线段，其实是没有完成的线段（如图3-29所示）。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_60_0.png)


