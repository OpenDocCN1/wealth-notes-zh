- pgno: 168
  md: '# 多级别联立及不测而测


    多级别联立及不测而测是缠论的综合运用部分，也是缠论基础的最后一个要点。


    # 一、多级别联立的概念


    +   1. 级别的概念使任何一个走势都可以被唯一标识。


    +   2. 任何走势都是由其次级别走势来完成构筑的。


    +   3. 当下所处位置需用多个级别走势从属关系来同时定义和演绎。


    走势不是某一级别的表达，而是在整体观下的、多级别的从属位置进行一个更客观准确的表达。就像你要寄东西，光写你家的门牌号，东西肯定是不能被邮寄到的，你需要具体写到某省、某市、某区、某街道、某门牌号才能寄到。它是一个从属关系，在这种从属关系下，位置才能被唯一确定，走势也同样如此。


    +   4. 多级别联立强调的是在整体性的保证下来观察其演绎。


    有了这个思路，我们才能准确地去 judgement 目前市场的所处位置，或者更低级别上的变化是否导致整体变化，是否需要再向上一级别来考虑定位（整体是相对的），所以多级别联立更强调的是整体性下的观察。'
  merge: -1
  img_proc: true
- pgno: 169
  md: '5. 多级别联立的分析过程是对走势分解及组合的过程。


    在讲多义性的时候，大家已经观察到，在结合律的保证下，走势只要重新拆分组合，就可以被不同定义，所以在高级别下已完成的结构从属关系也依然可以被后期的运动所打破。


    # 二、A0 的设定


    1. A0 是分析某段走势的开启位。


    A0 就是一段走势的起点，即自同构性走势间连接的那个节点位，这是走势分析的基础。由于有了分解的任务，在划分走势时会先设定 A0，就是假设前面的结构完成，这个点就可以被作为
    A0 来使用了（如图 3-145 所示）。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_169_0.png)


    2. A0 均为某级别的第一类买卖点（包括可分辨和不可分辨）。


    第一类买卖点不单指背驰形成的买卖点，小转大所形成的第一类买卖点'
