- pgno: 42
  md: '如图 3-11 所示，1、2 这两根 K 线是非包含的向下序列关系（出低不出新高），3 处于向下序列中，所以 2、3 的包含采用向下处理，取 2、3
    这两根 K 线的低中低、高中低作为新 K 线 3''（3'' 为新 K 线，代替原有的 3）。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_42_0.png)


    2. 遵循先左后右的处理顺序。


    按时间顺序先左后右进行相邻两根 K 线的包含处理。


    处理后的新 K 线，仍可与右边相邻的 K 线进行包含处理。


    如图 3-12 所示，当多根 K 线存在包含关系时，就需要按照时间顺序进行逐次处理。先处理 2、3 的关系，2、3 形成新的 K 线 3''后，新 K 线
    3'' 再跟第四根 K 线比较，处理完后形成新的 K 线 4''。这就是逐次处理，遵循先左后右的处理顺序。'
