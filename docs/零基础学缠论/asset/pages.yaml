  md: '来就想用刚学到的一个知识点来进行交易，但缠论不同于传统理论。传统理论有很多对局部的描述和用法，学习传统理论或许可以上来就投入实战，用其局部的特征就能部分地指导交易了，而缠论完全不能如此。缠论中的任何定义和逻辑都是缠论的组成部分，就像造一辆车，不能刚做出一个轮子就当车用，缠论是个体系，必须完全掌握才能投入实战。缠论是难学易用，大部分人因为难学而弃学，真正掌握了缠论，就像学会了游泳，可能无法讲出游泳是什么，但一定不会轻易溺水了。学会缠论，缠论将伴随我们一生，成为指导交易的唯一逻辑，绝无弃用之说。


    13. 学习缠论，我经历的三个阶段。


    缠论不废万法，可以统摄万法。


    刚开始接触缠论，理解到这个程度会很困难。下面就以我学习缠论的切身体会，来谈谈我所经历的三个阶段：


    第一个阶段：九阴真经。


    缠论可以使不懂市场、不懂 K 线的人，快速建立一套高效的分析逻辑，因为缠论的分析体系很完备。


    在第一阶段，缠论就像金庸老先生笔下的“九阴真经”，深深地让人着迷，给人憧憬，似乎只要得到缠论的真谛，在市场中获利则如探囊取物般容易，看着缠师傲然地言说：一年没有赚到三五倍的利润，就不是学会本
    ID 理论的人！那一刻，刚翻开缠文，便想着“华山论剑”了。


    我接触缠论时，也算老手，已经经过十余年的股市历练，并且已经有成型的交易逻辑，但还是被缠论的效果震撼到了。刚开始学习的阶段，我是真的把缠论当成“九阴真经”一样的上乘技术来学的。


    先聊一下缘起：


    2008 年年中的时候，我的朋友邓文聪向我推荐缠论，当时我的法执（传'
