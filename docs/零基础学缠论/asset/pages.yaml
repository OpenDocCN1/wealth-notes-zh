    是 5 分钟的标准第三类买点。6、7、9 都是相对于中枢 A 的第三类买点，只是构成的级别不同。


    30 分钟级别的中枢是由 5 分钟走势构建的，如果是 5 分钟走势形成的第三类买点有可能是在构筑 30 分钟的中枢 B，然后出现 c 段，整个上涨走势可能就结束了。所以标准第三类买点只有一个，但具备操作价值的可以有多个，就像第二类买点有
    n 个一样，只要 1、2、3、4 不出现对于 0 来说的新低，那 1、2、3、4 都是第二类买点。


