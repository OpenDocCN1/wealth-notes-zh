    一是你们递归的初始层是否相同；二是你们采用的递归函数是否相同。


    这两点相同，才能说你们探讨的是同一件事。


    # 五、一个表格理解走势级别的生长


    走势的组件，是从 K 线开始的，K 线到分型，就是一种升级方式，即通过特征及处理特征的规则来对 K 线进行处理升级。所有的升级方式都是根据特征处理的规则来构建的。由
    K 线通过规则把它升级为分型，而后，分型组合为笔，其实也是一次递归，只是这个递归逻辑只在讲特征序列时用了一次。由笔通过规则构建为线段，这也 是一次递归，这个递归逻辑在构建大线段时用过一次（如表
    3-2 所示）。'
