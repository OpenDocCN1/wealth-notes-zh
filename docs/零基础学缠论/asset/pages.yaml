  md: '价的逻辑就是另外的两个维度，当然还包括制订不同策略的指导原则，这部分本书没有详述，留待以后在专题的书籍中再讲解。


    # 8. 人人都学会缠论后，谁来亏钱？


    人人都学会这个前提本身就是错误的。佛教已经传播 2500 多年了，成佛的人多吗？所有人都知道波浪理论的情况下也有“用”的差别，缠论也是一样的。有多少人知道缠论？知道缠论的人有多少能学会缠论？即便学会了，“贪嗔痴疑慢”能否克服？就像
    5100 点，学缠的人都能看出来，那是背驰段的背驰段，但即便如此，不是所有人都能跑掉的，他还有贪，这个解决不了，什么理论都掌握了也没有用。


    整体来说，最终比的还是对市场的认知以及对自我的认知的深度，当然也包括交易体系是否建立、是否完善。例如，上证指数 5178 点时的顶，虽然没有第一时间跑掉，但有足够的纠错机制，也还是可以盈利出场，也依然可以做到灵敏的反应市场。这种灵敏其实是我们反应体系的效果呈现。这种反应靠什么？靠的是之前的策略有没有完备，每一种变化是否都考虑到了，执行是否无碍，能否当机立断。这层层的因素促成了我们的综合体系是否足够稳定，是否可以灵动地应对市场变化，这就是一个功力高低、心性高低的问题了。同样的标的、同样的操作手法，不同的人使用起来，哪怕两个人水平一致，也依然是有差别的。


    在交易体系的任何一个环节中都会存在不同层次上的差别，任何一个微小的差别之下的选择，其对应的行为，都会导致不同的结果，蝴蝶效应是客观存在的，日积月累下显现出来的巨大差别是超乎想象的，所以我们只能尽量去追求更加接近市场。但是，每一个人的修为不同，你是否能达到？你能到达哪里？你对内对外的认知到达什么高度，股市就会回馈你多少，而且长期来看，这是必然的。5178
    点以后，就是共业下产生的大跌，共业所致，大'
  merge: -1
