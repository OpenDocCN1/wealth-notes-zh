- pgno: 98
  md: '走势结构，它的次级别、次次级别甚至次次次级别的走势类型依然是存在的，依然可以用寻找走势类型的背驰点的方法来找到它最后的背驰中的背驰的背驰。当锁定它内部的走势类型背驰点之后，就认为3可能结束了，而后再用1和3的运动空间进行比较，如果3的运动空间＜1的运动空间，那就是线段背驰，它就构成了一个线段级别的卖点。


