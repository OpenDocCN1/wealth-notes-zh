    # ## 二、中枢区间


    前三个线段重叠之后，可以把中枢区间固定下来，而后在这个中枢区间内，可以有 $n$ 个线段不断地在中枢区间内上下运动。中枢也是有生长概念的，如何生长将在后面“中枢的生长”中进行详述。


    缠师在原文中对中枢区间有过两次定义：


    第一种定义：中枢区间是由前三个线段的重叠部分来固定的，取前两高点中的低点作为中枢高（ZG），取前两低点中的高点作为中枢低（ZD），ZG−ZD形成的区间就是中枢区间。围绕中枢运动的最高点，称高中最高（GG）；围绕中枢运动的最低点，称低中最低（DD）（如图
    3−41 所示）。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_73_0.png)


    第二种定义：所有构筑中枢的线段，每一个线段都会对应一个高点和一个低点，在这些高点中选取最低点作为中枢高（ZG），在这些低点中选取最高点作为中枢低（ZD），ZG-ZD
    形成的区间就是中枢区间（如图 3-42 所示）。


