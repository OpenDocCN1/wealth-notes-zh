- pgno: 53
  md: '以上是缠师介绍的方法，通过把不合逻辑的顶底进行排除，然后进行笔的划分。这种划分方法适合静态的或者已经走出来的图形。


    # 2. 简缠的划分方法。


    简缠是通过笔的延续性的逻辑来进行划分的。该方法虽然依旧是在静态图上划分笔的，但从起点的第一顶分型开始，按次序对每个形成的顶底分型进行当下的考察，处理过程却是当下的、动态的。它是以下下的角度去推演笔是否形成，对把握当下更有效，所以我比较推崇这种推演式的处理方法。


    （1）把所有当下的顶底分型找出来。


    这与第1种方法相同，顶底分型还是那些位置（如图3-20所示）。


    （2）通过笔的延续性的逻辑判断笔是否成立。


    如图3-20所示，因为左边0-1截图不够，它肯定起于一个底分型，这一笔先画到1这里（暂定），那它什么时候落定？当后面从1开始只要向下五根K线走出来，前一笔一定落定。走到2的时候，1这个顶分型所对应的向上笔就一定成立了，新的一笔可以从1先画到2（暂定）。然后2底分型涨起来不够五根K线又出新低，这个向下笔继续延续（破坏），而后走到3出现底分型，这一笔又可以1一直画到3（暂定）。当3这个底分型涨起来，走出五根K线后，新的一备具备生成条件，前一笔1-3成立（落定）。由于3-4不满足五根K线，所以继续等下一个顶分型出现，当走到6的时候，可以从3画到6（暂定）。然后继续等从6开始的向下五根K线出来，新一笔产生，3-6这一笔就被确立（落定）。


    按照这个方法，最后得出如下图的笔（如图3-23所示）。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_54_0.png)


    最后，这两种方法得出的笔是一样的（K线包含关系处理一致的情况下），但简缠的划分方法通过暂定笔加落定笔的过程推演方式，可以很快知道这个笔在哪里暂定，在哪里落定，不需要后面生成新的顶底分型之后再回头去判断，这样在后期的结构判断中就比较简单了。


    # 七、笔的划分注意事项


    +   1. 顶底分型——对应。


    笔必须是一顶一底，或一底一顶才能形成；顶分型必须对应底分型，底分型必须对应顶分型。顶分型与顶分型之间，底分型与底分型之间是不能形成笔的。向下笔结束才对应向上笔，向上笔结束才对应向下笔，所以它一定是上下相连，顶底一一对应的（如图
    3-24 所示）。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_55_0.png)


    图 3-24


    +   2. 顶和底之间至少有一根 K 线不属于顶分型和底分型。


    这是用笔的定义来规定的，因为它要符合结合律（结合律将在后面“结合律”中进行详述）。


    +   3. 顶分型必须高于底分型，否则不构成笔。


    一个向下笔一定是起始于顶分型，结束于底分型，顶分型的最高点一定高于底分型的最低点。


    如图 3-25 所示，底分型跟顶分型相连，这应该是一个向上笔，但是结构重心却偏下，这是不允许出现的。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_56_0.png)


    # 八、笔的重要性


    笔是缠论中的基础组件，也是缠论最基础的分析单位。所有走势的构筑，以及交易体系的建立，都是从笔开始的。


    我们通常会用到月线或周线的笔和顶底分型。例如，当周线底分型都没有形成前，也就意味着周线的向下笔还没有完成，这时，还不能进行大规模抄底，日线以下的底分型只能进行尝试性建仓。所以在大周期的判断中，笔和顶底分型已经起到很关键的作用了。


    笔是缠论最基础的组件，所有走势的构筑均是依托于笔开始的（我们所建立的交易体系，后面所要讲到的三类买卖点、背驰等概念，都是从笔开始的），所以作为最基础的笔的定义大家一定要清楚，同时通过训练，能够快速地将K线处理成笔，达到看裸K线图时，眼里只有笔，而没有K线的境界。


    笔的连续性是操作的客观基础。'
  merge: -1
  img_proc: true
