  md: '到它的次级别走势类型。


    # 2. 以走势类型作为最小分析单位。


    为了保证交易的稳定性和有效性，充分利用好区间套，我们以走势类型作为最小分析单位。


    如图 3-101 所示，想知道日线的一笔 0-1 是否在 1 的底分型位置真正终结，可以把 0-1 这一笔通过区间套到更低周期图上去观察，分析它的 30 分钟走势结构、5
