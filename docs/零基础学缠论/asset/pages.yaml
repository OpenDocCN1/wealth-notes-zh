- pgno: 316
  md: '统理论运用还不错）很重，并没有在意。一直到 2011 年，老邓几次分析结果（他一直用缠论做分析）和我出入很大，而且最终是他对了，这让我意识到，缠论有传统理论无法替代的功效。这件事点燃了我对缠论的兴趣，我开始通过缠论原文来学习缠论。2011
    年年末，正赶上重庆啤酒的崩盘走势（80.5 元一路跌到 17.5 元），利用缠论分析后，震撼到我了，因为当时，在我所掌握的 theory 里，只有缠论能告诉我，这
    60 多元的下跌过程中，只在 2012 年 1 月 20 日这天才能介入，因为只有这天才出现了第一个 1 分钟买点，而且这个买点信号是那么地清晰可见。


    缠论对我的颠覆就是通过这样鲜活的实例、这样深刻的体悟达成的，而这样的体悟一定是基本掌握缠论后才能有的，所以，听别人说“缠论牛！"那没用，别人的体验是无法使我们建立坚实的学习信心的，必须是我们能真切感受缠论对我们有用，才能真正建立实信，即便最后你说缠论是无用的，也必须是你真正学明白并能娴熟运用后，才有资格说：缠论对我没用。同我在本书中一直强调的缠论的博大精神一样，也是我学完、用过多年后，才敢如实评价：缠论予我新生。


    学习缠论的第一阶段，就是学了“缠中说禅”的第一个字：缠。它代表着结构表达，是基本的技术分析体系。它能够帮助我们建立完整的交易体系，例如，什么级别的买卖点、怎么布局交易等。所以第一阶段是构筑技术分析体系。


    把缠论当成纯技术应用的时候，绝大多数人一开始都是落于技术中的，落入“产生第三类买点就得涨，就得创新高”这样的传统理论的对应性思维中，或者经常陷入“接触 1
    分钱算不算进入？”“差 1 分钱算不算没进人？”等一系列标准正确与否的纠结中。


    当我们的逻辑还在第一阶段，把缠论作为一种技术描述或者技术信号在用时，走势后期变化的核心逻辑在哪里以及如何应变，其实还没有通达于心。'
