  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_131_0.png)


    如图 3-109 所示，0-3 是 30 分钟走势类型，进入段 0-1 是 5 分钟级别走势，离开段 2-3 是 1 分钟级别走势。2-3 这个 1 分钟级别走势离开，我们能够找到它的盘整背驰转折点
    3，但由于 2-3 是 1 分钟级别走势，我们在 3 处不可以认定 2-3 一定不能生长成 5 分钟级别走势，从而无法在 3 处就认定本级别 30 分钟走势完成。之后发生转折形成了
    30 分钟级别走势 3-4，那么 3 这个地方就发生了小转大。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_131_1.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: '也就是说b段完成1分钟走势之后走出了一个比5分钟还要大的反向走势，后期再回过头去看，在3这里已经完成了转折，这种情况就叫小级别背驰引发大级别转折。


    **2. 通过区间套在次级别及次级别以下的走势里均未发现背驰现象，本级别走势没有可被观察的终结现象，无法认定第一类买卖点。**


    例如，在观察b段的时候，b段虽然满足离开段是次级别走势类型的要求，但b段的内部没有任何背驰现象，当下无法判断b段的结束，即通过区间套无法找到任何背驰现象，但b段却戛然而止，并且引发了本级别走势类型的结束。


    如图3-110所示0-3这个走势，离开段2-3看不到背驰就转折了，这就是小级别未发生背驰引发的大级别转折。这种情况在一些个股的小级别图上经常发生。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_132_0.png)'
