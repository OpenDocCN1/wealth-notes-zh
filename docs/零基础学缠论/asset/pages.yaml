- pgno: 93
  md: '# 区间套


    # 一、区间套的定义


    +   1. 数学上的定义。


    闭区间是数学用语，与开区间相对。


    闭区间：是直线上的连通的闭集，是直线上介于固定两点间的所有点的集合（包括给定的两点），用 $[a, b]$ 来表示（包含两个端点 $a$ 和 $b$，且 $a<b$
    ）。由于它是有界闭集，所以它是紧致的。


    闭区间套定理：有无穷个闭区间，第二个闭区间被包含在第一个区间内部，第三个被包含在第二个内部，以此类推（后一个区间会被包含在前一个区间里面），这些区间的长度组成一个无穷数列，如果数列的极限趋近于
    0（即这些区间的空间最终会趋近于 0 ），则这些区间的左端点最终会趋近于右端点，即左右端点收敛于数轴上唯一一点，而且这个点是这些区间的唯一公共点。


    如图 3-76 所示，2 是 1 的组成部分，3 是 2 的组成部分，以此类推，橙色段（我们可以观察的最低级别）属于所有的封闭区内的组成部分。'
  merge: -1
  img_proc: true
- pgno: 94
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_94_0.png)


    图 3-76


    # 2. 缠师的定义。


    缠论的区间套定理也就是缠中说禅精确大转折点寻找程序定理：某大级别的转折点，可以通过不同级别背驰段的逐级收缩范围而确定。换言之，确定某大级别的转折点，要先找到其背驰段，然后在次级别图里，找出相应背驰段在次级别里的背驰段，将该过程反复进行下去，直到最低级别，相应的转折点就在该级别背驰段确定的范围内。如果这个最低级别是可以达到每笔成交的，理论上，大级别的转折点，可以精确到笔的背驰上，甚至就是唯一的一笔。


    区间套就是利用走势的自同构性，对走势组件进行拆分，锁定观察段（背驰段），此观察段在次级别图上必然存在对应的走势，对这个锁定的次级别走势继续分解，可以锁定次级别走势的观察段（背驰段），继续在次次级别上重复上述动作，直到找到需要观察的最低级别，当这个最低级别走势完成，也就意味着闭区间的走势全部完成。这是缠论在观察走势结束时，从高级别'
  merge: -1
  img_proc: true
- pgno: 95
  md: '向低级别逐级寻找背驰点的方法。


    区间套的运用要求是，先要有一个闭区间，确定要观察的是哪一个走势，而后不断锁定区间、缩小级别观察下去。换个说法，就是在离开段中，从大级别往小级别逐级地找到各级的离开段，最终找到背驰点的方法。例如，一个30分钟走势的完成，必是最后的1分钟走势完成导致最后的5分钟走势完成，从而导致30分钟走势完成。区间套贯穿整个缠论的运用。


    区间套之所以能在缠论中体现和运用，依据的是走势的自同构性。


    缠论把走势分成趋势走势类型和盘整走势类型，而这两种走势类型都是非线性结构的模型，可以让我们在不同级别下都能看到相似的结构特征，这就是走势的自同构性。所以运用区间套这个原理就可以逐级把走势拆分开，逐渐找到走势的终结位置。


    # ## 二、区间套的运用


    +   1. 区间套判断背驰。


    判断一个30分钟走势何时结束，背驰点在哪里。如图3-77所示，一个30分钟走势a+A+b+B+c已经形成，现在处在c段中，那就可以找到c段的起点A0（A0将在后面“多级别联立及不测而测”中进行详述），运用区间套在次级别（5分钟级别）里再去看30分钟的c段，这个30分钟的c段在5分钟走势里可能也完成了a+A+b+B+c，这个c我们称之为c中c（c-c）。'
