    # 13. 操作时，只用缠论的结构可以吗？


    缠论是用结构、用“生住坏灭”来解释市场，运用的时候是需要增加其他维度的，包括比价关系、基本面分析等，所以操作是综合性的事情。


    上证指数 5178 点时，会看到很多的个股都处于 30 分钟甚至日线中枢的 b 段，一个 5 分钟走势一下就拉得很高，然后直接结束，全部跌回去，几倍的空间还没反应过来就没有了。当然从结构上也能解释，因为向上没有构筑中枢又回来了，继续中枢震荡。但它为什么这样走？其实是比价造成的，整个大盘共业性地往下走，基本没有能扛得住的。


    缠论解释的是图形如何观察处理的问题，对微观层面的解释比基本面的'
  merge: -1
  img_proc: true
- pgno: 256
  md: '解释要更加精细。比如从基本面看，这只股票 10 元以下都是可操作区域，但是 10 元操作还是 5 元操作，这要交给缠论，它可以帮我们更好地跟随市场。


    缠论告诉我们情绪是如何发展的，我们的贪嗔痴疑慢在每个阶段是怎么表现的，它能让我们很清楚地看到现在市场中究竟是什么样子的人在交易，以及正在发生着什么。


    至于图形为什么走成这样，缠论将此理解为市场合力的最终呈现。图形如何形成？是什么力量让它小转大？怎样把握这些事情？这是需要对合力的构成进行完全分类的。我在学习缠论半通不通的时候，就产生过困惑，我的原有体系是按照价值投资、博弈论、趋势理论、筹码理论等搭建的，学完缠论之后，技术分析更多依托于缠论的结构，但是基本面跟它发生冲突的时候，我有过一段磨合的时间。2013
    年我逐渐明白了，走势未来的方向不是缠论给出来的，缠论只是告诉我们这只股票这个地方结构完成了，可以关注了。同样结构完成的两只股票，谁会涨得好还是要从基本面出发，后面可以涨得好，是因为后面不断有新的多头加入，驱动他们加入的一定还是基本面，所以驱动因子才是谁能涨得好的原因，缠论结构是用于交易的，哪里建仓，哪里加仓，哪里做
    T，这些都是需要缠论的技术层面来解决的。


    # 14. 第三类买卖点有 $n$ 个？


    按标准定义来说，第三类买卖点只有 1 个，但次次级别所形成的次次级别第三类买卖点也是存在操作价值的。


    如图 4-90 所示，一个 30 分钟中枢被突破 4-5，然后一个 1 分钟线段（次次级别第三类买点）的回撤 5-6，可以把 6 看作是一个 30 分钟中枢上方的第三类买点。'
