- pgno: 234
  md: '这个时候的上涨，先用反弹的眼光去操作它，可以等第二类买点的确认，至于它在后面是否演变成新的上涨趋势走势类型形成第三类买点，要等形成30分钟级别第三类买点的时候，再去纠正，这是第一个方面。


    另一方面，要考虑用仓位应对，按照不同级别对应不同仓位。如图 4−66 所示，如果在背驰点 1 的位置买了以后，又继续向下跌破买点，则出现在 2 的位置是否还加仓的问题。这就涉及仓位控制的问题，不能因为
