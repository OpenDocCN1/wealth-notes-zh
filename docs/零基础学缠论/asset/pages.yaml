- pgno: 26
  md: '# 交易心理不同


    缠论能让我们的交易心理发生根本性的变化，这是缠论与传统理论最大的不同点。


    # 一、传统理论


    着眼于统计学下的大概率事件，当小概率事件出现时会动摇信心甚至放弃。


    传统理论解决的是统计学下的大概率事件。我们在量化过程中发现，任何一个指标或单一现象，如果成功率能够达到50%以上，那已经算大概率为，达到60%，在股市里已经是一个非常好的策略了。只要盈亏比≥1（即盈利次数/亏损次数≥1），就可以成为可用的交易逻辑了。


    止损用“忍”，逆人性。


    例如，一个赢面6、输面4的交易策略，盈亏比为1.5，它失败的概率虽然只有40%，但当它连续失败时，你的信心就会动摇，就会对这套逻辑产生不信任感，一旦出现需要止损的情况，只能忍，因为你不能接受。


    追求成功率、稳定性，但却陷入对市场无常更深的恐惧。


    用传统理论亏损时的心态是：这个理论有问题，或者我自己没有掌握好，是我的问题。所以多数在传统理论里打转的人总想找到成功率更高、更稳定'
  merge: -1
  img_proc: true
- pgno: 27
  md: '的逻辑和体系，所以就不断地换方法，不断地去学习来形成自己的交易体系，但这过程是漫长而无果的，最终多数人形成的是对市场无常的深深恐惧。这也导致了部分人选择以基本面为依托，却不知基本面依然是无常的，只是周期过大，不能快速体会罢了。


    # ## 二、缠论


    **以市场的走势为根本，不作倾向性预判。**


    缠论以市场的走势为根本，无需作太多倾向性的预判，它并没有胜率的概念，而是关注市场如何生长、当下到哪里了。


    **止损用“化”，从容自如。**


    缠论的止损用“化”，心中没有喜欢或者厌恶这样的情绪，只是买点买、卖点卖，从容自如地去交易。


    **完全接受市场的变化无常，应对即可。**


    在缠论中经常有第一类买点转化为第三类卖点的情况，当你明白第一类买点可以转化为第三类卖点的时候，才可以说你在运用缠论。它是要让我们完全接受市场的变化是客观存在的，我们只要通过缠论，知道市场在往哪里变以及怎么演变，然后作相应变应即可，即不测而测。这里不是我们的问题，也不是方法的问题，只是市场在发生变化，我们需要应变，仅此而已。我们的心态会很平和，做错几次也没有关系，因为错已经不是我们的错，只是市场要如此生长而已。


    在实战运用中，一个 30 分钟的买点，它是先从 1 分钟的买点开始形成的，出现 1 分钟的买点可以尝试性地买，形成了 5 分钟的买点就继续加仓。因为一个向下的走势完成了就一定对应一个向上的走势，这是必然的。只有通过'
  merge: -1
  img_proc: true
- pgno: 28
  md: '这样的向上、向下走势的反反复复地连接，走势才可以逐渐地构筑和生长。在这个走势的生长构筑中，我们通过仓位有依据地应对，逐渐降低成本，就能构建一个零成本的交易模型了。


    缠论是根据市场变化来进行应对，它不像传统理论去寻求“我要掌握方法”，其实在统计学里，100%被证明有效的方法是不存在的。最极端的一次事件是2008年初金融危机大跌的时候，在这之前欧美有大量的程序化交易，有两位物理学研究者构建了一套交易模型，号称其模型是地球毁灭N次才会出现一次失败，结果在金融危机的时候还是把仓位打爆了。所以即使它发生失败的概率是几亿分之一，当那个“一”发生的时候依然是有问题的。


    反观缠论，它不可能发生这样的事情，因为市场怎么走我们就怎么应对，我们绝对是跟着市场在运动的，而不会主观地忽视同样可能发生的低概率事件。所以当我们建立了应变的逻辑，我们对市场就不再恐惧和贪婪了，缠论能从根本上解决我们操作时的心理问题。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 学习步骤不同


    既然缠论有这么好的优势，不仅可以完整地看市场，还能从局部精致地分析市场，同时又能应变市场，那它是不是很好学呢？


    缠论和传统理论的学习步骤，是有不同之处的。


    # 一、传统理论


    易学难用。现象容易理解掌握，实战却如入迷宫。


    传统理论大家都觉得很简单，阴阳K线、头肩底、趋势、市场超越平衡等，但运用起来却很困难。为什么？因为它的哲学思维逻辑很难形成。任何一个理论体系都有它的边际，这种边际的存在使其只能是局部有效，而边际的突破又是模糊的，无法在当下判断其有效性是否能起到应有的作用。当我们有几套逻辑之后，它们甚至会有冲突，例如，单边走势和震荡从来就是一对矛盾，用任何理论都无法对这两种状态进行准确的边际划分。所以传统理论的自洽性逻辑是极难建立的，有些人可能练了十几年都不得其法。传统理论易学难用，现象容易理解和掌握，但其随后演变上的或然性是始终存在的。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 二、缠论


    **难学易用**。先逻辑构建，构建后，走势如自己的掌纹般清晰。


    缠论的难不在现象上，它的现象如笔、线段等依然跟传统理论一样，也是由相构成的，有非常清晰严谨的规则，很容易被掌握。它的难是难在逻辑构建，以什么样的角度去运用它。当我们构建好逻辑之后，所有的理论就都可以用缠论去构建和剖析了，这时我们再看任何结构、任何理论，就如同缠师所说，如自己的掌纹一样清晰可辨了。'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# ## 总结


    缠论不仅是一套有法，更是一套交易哲学，但交易哲学依然要从现象开始构建，所以本书中缠论是按照我现在所理解的缠论逻辑从最基础开始来为大家进行讲解。


    我认为从技术层面来构建的缠论，是缠师的交易哲学，甚至是他的哲学哲学所写的一个范本。我们学习缠论，说到根上，是在临摹缠师的思维构建，通过笔、线段、走势类型以及走势生长的相关概念，整个临摹一遍，当完全掌握之后，我们掌握的其实是如何构建思维逻辑，以及缠论视角下对市场的解读。


    当我们能够通过走势的生长，以及它的拆分和组合逻辑，逐渐地衍生出交易逻辑、交易哲学的时候，才能说我们真正掌握了缠论。市场还是那个市场，但我们的视角变了，对市场的感受和买卖的选择也就完全变了。到那时你可能会由衷地说，缠论真的很伟大；到那时你也会和我一样，为弘扬缠论奉上一份绵薄之力。'
  merge: -1
  img_proc: true
