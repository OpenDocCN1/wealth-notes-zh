- pgno: 280
  md: '这就是“横有多长，竖有多高”，它是可以被推导出来的。


    以上讲的就是如何利用走势的完整性来构建交易体系，通过对走势的推演，就知道什么样的走势、哪个位置的走势才是我们要参与的，无论从中线还是短线都是有保证的。如果同时具备对基本面和走势生长能量的判断，就有了双重保险，我们将战无不胜。


    买入前，要关注：


    哪一段是可交易的未完成走势？


    哪里会出现 *b* 段的上涨？


    哪只股票出现 *b*–*A* 的买点？


    这个买点后面所对应的 *b*–*b* 有没有基本面支持？


    持有时，要关注：


    是不是出现 *b–c* 段了？


    只要没有出现 *b–c* 段及次级别的第三类卖点，都不用去理它，随它生长。把眼界变成这样，就已经能够战胜市场 90% 的人，因为这样的视角已经跟 90% 的人完全不同了。


    # 11. 为什么说走势必完美是缠论最核心的思想？


    使用缠论时最核心的指导原则是走势必完美。任何级别、任何走势终将终结，且任何级别、任何走势都被唯一表达。


    缠师在原文中说过几次走势必完美，前面说的是“任何级别的任何走势都将终结，进入新的走势中”。也就是说无论市场出现了什么情况以及未来可能出现的所有情况，都能被缠论解释和定义，缠论对市场做到了真正的完整定义和解析。在市场运动的分析理论里，唯有缠论是无漏的。再看它后面那部分“且任何级别、任何走势都被唯一定义”，用了个“且”，“且被唯一表达”，这是缠论最核心的地方。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '学习缠论过不了级别这一关，那缠论就白学了。级别是可量化的，任何级别的任何走势都能被唯一定义。无论在哪个级别，30 分钟也好，1 分钟也好，新股也好，这根
    K 线从属于哪个走势中的哪一段的哪一个位置，它是被唯一定义的，是被数字化了的。有了这个精准定义之后，才能说它其大无外、其小无内，我们才能真正应用它。缠论最神奇的地方是：它把看似非常繁杂的走势，变成了一段一段可被唯一定义的走势，唯一定义的段落。先拆分，然后再组成，即便是多义性的处理，依然可以知道它是什么。只有这样，才能知道此刻身在何处，才能知道这个地方用什么样的策略是最优的，这是缠论最基础、最核心之处。


    什么时候对走势分解非常自如了，知道从哪到哪是什么，对这样的定义、这样的组合能变成什么都很清楚了，才能说掌握了缠论，才能运用好缠论。


    # ## 七、关于小转大


    +   1. 一个小转大的运用分析。


    小转大是指走势在次级别中未出现背驰的情况下引发了本级别走势的完成，通常会发生在本级别走势的背驰段。小转大是用区间套观察走势时不可把握的一类情况，缠论对走势的完全分类因为有了小转大而完美。


