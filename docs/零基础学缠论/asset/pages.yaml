    新线段生成才能确立前线段的完成。


    线段的确立与笔的确立是同一个逻辑，是一脉相承的。线段是否完成，一定要等下一个线段生成之后，才能被确立，反向的线段没有生成之前，前线段依然在生长延续中（如图3-30所示）。'
