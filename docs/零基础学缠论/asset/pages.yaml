  md: '5 分钟图上看，也发生了背驰。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_230_0.png)


    它能保证从 5 这里对应一个 1 分钟的上涨结构，这个 1 分钟上涨结构起来之后，可能走成三个 1 分钟上下上走势就完成了 5 分钟上涨结构，这是最恶劣的走势了（如图
