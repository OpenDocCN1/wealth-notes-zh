    # 2. 小转大形成原因是什么？


    小转大在行情加速赶顶或赶底的时候比较多见。因为一旦趋势（此处是传统理论的趋势概念）形成，大家就会按趋势去想问题，小转大是市场多空双方激烈交锋的结果，是多头空头最后的宣泄造成的，一般伴随着疯狂的贪婪或极度的恐惧情绪，用均线看是非常强烈的走势(均线向下或向上快速发散，如图4—116、图4—117所示)。'
