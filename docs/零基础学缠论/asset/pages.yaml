    # 一、中枢的定义


    中枢：至少由连续的三个线段（次级别走势类型）的重叠部分构成。


    一个向上的中枢必须是由下上下三个线段来构筑的，在标准模型中，中枢前面有进入段（向上的线段），后面有离开段（向上的线段），这样就构成了一个向上走势（如图 3-39
