- pgno: 43
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_43_0.png)


    图 3-12


    # 3. 处理标准。


    （1）缠论原文处理标准。


    缠师在原文给过两种处理方式。缠师把所有存在包含关系的K线最终处理为非包含关系的K线，然后把存在包含关系的K线全部隐藏，这是大家常见的一种。


    如图3-13所示，2、3、4皆为包含关系，进行处理后，就只剩下1和新形成的2这两根K线了。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_43_1.png)


    图 3-13'
  merge: -1
  img_proc: true
- pgno: 44
  md: '（2）简缠处理标准。


    简缠的处理逻辑是逐一处理。缠论原文中是把处理过的K线去掉了，只剩下新的K线，而简缠是不隐藏存在包含关系的K线的。


    如图3-14所示，处理前是四根K线，处理之后还是四根K线，但它可能是个底部不断抬高的平顶。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_44_0.png)


    这样处理是为了满足整体性原则。一根长的K线出来之后，经过长时间的横盘，如果用缠论原文的处理标准可能只剩两根K线了，整个横盘过程是不被显示的，对时间因子也有一定的破坏性；如果用简缠的处理标准，保留了时间因子，就知道它经过了多少根K线。简缠处理标准最大程度地保留了市场运动痕迹，无论是空间的还是时间的，同时，它的级别的一致性也能得到最大的保证，使市场的信息得以充分保留，所以我是基于这个原则提出了这个新的处理方式。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 五、多根 K 线包含关系处理步骤实例


    对于多根 K 线的包含关系处理，可按以下步骤进行（如图 3-15 所示）：


    ![](img/77d1cc7c2112cc267ea790a8866c5111_45_0.png)


    +   **第一步：** 找到最左边具有包含关系的两根 K 线；


    +   **第二步：** 与前一根非包含关系的 K 线相比较，如果是处于向上（下）序列中，则采用向上（下）处理方式；


    +   **第三步：** 进行包含关系的处理（两根 K 线不作合并，保留 K 线在原位置）；


    +   **第四步：** 观察是否还存在具有包含关系的 K 线，若有，则重复第一、二、三步，直到处理完所有包含关系。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '笔


    # 一、笔是缠论之神奇的开启


    笔是缠论第一个最重要的概念。从“笔”开始，缠论就有别于其他所有理论了。


    笔是缠论的基石。


    笔是缠论中最基础的组件。


    传统理论的分析逻辑里，由笔替代 K 线来进行分析计算，效果也会大幅提升。


    传统的 K 线分析是建立在 K 线上的，而 K 线是建立在对时间的人为分割的基础上的，例如日 K 线，就是人为地把交易过程按天来进行分割，一根日 K 线反映的是一天的交易状况。那么如果按照小时来分割，这一天的交易过程就是四根小时线（据国内股票市场一个交易日的开盘时间是
    4 小时计算），是一个 K 线组合。不论是分析一根日 K 线还是四根小时线的 K 线组合，其本质都是人为地按照某一固定时间分割的标准，对交易过程进行割裂性下的分析。


    笔的神奇之处在于，无论用什么时间周期进行分割，只要在某周期内构成笔的特征不发生改变，就还是在一笔内的运动。一笔运动时间的长短跟时间的分割周期有关系，但不是主要关系，它与四种分型的关系才是必然关系，'
  merge: -1
  img_proc: true
- pgno: 47
  md: '这是笔的最重要的逻辑。例如，一根日 K 线，可能只是一个 5 分钟的笔，也可能是三个、五个或者更多 5 分钟的笔（最多十一个）。


    # 二、笔的定义


    笔的组成：顶（底）分型 + n(n \ge 1) 根 K 线 + 底（顶）分型。


    向上笔是由底分型开始，顶分型结束，中间有 n(n \ge 1) 根 K 线；向下笔是由顶分型开始，底分型结束，中间有 n(n \ge 1) 根 K 线（如图
    3-16 所示）。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_47_0.png)


    通过构建的逻辑，原来的分型就变成了笔的组件，由 K 线构筑分型是缠论的第一层构建逻辑，由分型构筑笔是缠论的第二层构建逻辑（这里面的 K 线都是经过包含关系处理过的，具有唯一特征）。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 三、笔的确立


    新一笔的生成才能确立前一笔的完成（如图 3–17 所示）。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_48_0.png)


    图 3–17


    # 四、笔的延续


    新一笔未生成前，前一笔延续。


    当 K 线走势满足笔的定义时，这一笔为暂定状态（当前暂定笔的结束点，后期仍有被破坏的可能），直到新的反向笔生成，该笔被确立。在这之前，该笔延续，这就是笔的延续。


    如图 3–18 所示，当走势从 0 走到 1，已满足笔的定义可以暂定为笔，其后的 1–2 虽然已经走出了四根 K 线，但是仍不能确认 0–1 笔的结束，所以
    0–1 笔延续。当走势走到 3 出新高，新的反向笔仍然没有生成，0–1 笔就依然'
  merge: -1
  img_proc: true
- pgno: 49
  md: '延续中。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_49_0.png)


    图 3-18


    由此可知，只要符合条件的最终的顶（底）分型未确立，一笔的结构就不会被破坏，它就可以无限延续。因此，时间上的人为分割所造成的分析上的割裂，在笔的定义下能够得到修复。


    # 五、笔的延续性


    通过笔的定义可以知道，一顶一底相呼应，所以：


    一个向上笔完成后必然对应着一个向下笔；一个向下笔完成后必然对应着一个向上笔。


    如图 3-19 所示，它就形成了一上一下的循环往复，我们称之为波动的、轮回的运动表达。市场的运动必然是通过笔来划分出很清晰的上、下对应性'
  merge: -1
  img_proc: true
- pgno: 50
  md: '的往复运动。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_50_0.png)


    # 六、画笔的实盘案例


    笔有两种划分方法，通过案例来演示：


    1. 缠论原文中的划分方法。


    先找到顶底分型，把不满足笔条件的顶底分型去掉，剩余的顶底分型连成笔。


    （1）找到所有的顶底分型。


    如图 3-20 所示。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_51_0.png)


    图 3-20


    （2）把不满足笔条件的顶底分型去掉。


    如图 3-20 所示，2-3 是底对底，所以 2 这个底分型是不成立的，去掉；3-4 满足一底一顶，但是不够五根 K 线，所以 4 这个顶分型是不成立的，去掉；4
    不成立后，3-5 是底对底，所以 5 这个底分型也是不成立的，去掉；3-6 是一底一顶，顶底间满足五根 K 线，是成立的，保留；6-7 不满足五根 K 线，所以
    7 这个底分型不成立，去掉；6-8 满足五根 K 线，且是一顶一底，所以 8 这个底分型是成立的，保留；8、9 都是底分型，所以 9 不成立，去掉；10、11
    都是顶分型，所以 10 不成立，去掉；8-11 是一底一顶，满足五根 K 线，所以成立，保留。


    按照这个方法，把不符合条件的顶底去掉（如图 3-21 所示）。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_52_0.png)


    图 3-21


    （3）把剩余的顶底分型连成笔。


    最后，把剩余的顶底分型连成笔（如图 3-22 所示）。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_52_1.png)


    图 3-22'
