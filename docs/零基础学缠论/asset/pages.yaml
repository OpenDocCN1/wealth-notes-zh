    # 3. 依据走势必完美对走势进行推演有什么重要性？


    走势的推演就是推断它会如何完成当前走势。比如不测而测，就是在推演一个未完成走势将如何完成。对于推演的层级，比如走势处于日线级别，一条路径是往下推演：它在 30
    分钟上会如何演绎，5 分钟上会如何演绎，即日线是如何逐次完成的。另一条路径是往上推演：日线完成后的变化会导致周线级别什么变化，月线级别什么变化。功力越深，走势推演的层次和变化就越多，有些人可能只能推演两三层的走势，之后再怎么变就懵了。缠论功力深浅，就是由此来界定的。


    准确划分走势是初级阶段需要掌握的，而对后面的推演才是真正见功夫的地方。


    # 4. 走势必完美感觉很抽象，如何在交易过程中体会呢？


    走势必完美是操作的核心，我们交易的就是走势的未完成段，它刚一勾头，就知道哪一个走势要完美了，以及这个走势意味着什么。当交易的走势可完成时，就可以卖出了；当交易的走势未完成，只是次级别走势完成时，就可以继续持有或者加仓。


    如图 4-102 所示，5 这里产生针对中枢 1-2 的第三类买点，当它走到 8 的时候就要注意了，7-8 一定不能跟 5-6 产生背驰，否则整个结构就被破坏了，这就是“枯木龙吟”，也就是要知道哪些位置是需要留意的，不能因为此处级别低就不关注。7-8
    一出现就知道它意味着什么，这才是见功力的地方。如果它一笔就能走到 9，那就安心拿着，因为这样就不背驰了，而这样走，它后面需要演变出新的中枢，或者说很可能在构筑更大的结构了。'
