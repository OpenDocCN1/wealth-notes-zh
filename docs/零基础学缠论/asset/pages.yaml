- pgno: 317
  md: '第二阶段：易筋经。


    在金庸老先生的笔下，“易筋经”是少林绝学，书中描述此功：圈一身之脉络，系五脏之精神，周而不散，行而不断，气自内生，血从外洞。练成此经后，心动而力发，一攒一放，自然而施，不觉其出而自出，如潮之涨，似雷之发。《笑傲江湖》的令狐冲，便是通过修习此功法才将体内八道异种真气化除净尽。


    其实不管我们抱着什么初心来到市场，最终必然回到理解市场、理解自我的路上（回不到这个路上的，那就退出市场吧，否则只能是市场中被猎杀的猎物），当我们在学习市场中的各类投资技巧和方法时，也会遇到令狐冲这样的困惑，即不同理念下的方法论经常会发生冲突、造成交易时更加犹豫不决，无所适从。当时的我也不是一个例外。


    在 2013 年 11 月前，我对缠论的概念算是搞明白了，也能大致用缠论分析了，但随之而来的问题让我更加困惑了。这个困惑就是：缠论的买点几乎都是出在大周期的阴线上，而在阳线上考虑的是卖，这与我掌握运用了十多年的传统趋势理论矛盾，让我极其痛苦，不知道应该遵循哪个。直到
    2013 年 11 月，我突然明白，其实缠论才是最顺势的理论，这个“势”，不是传统理论描述的势，不是已走出来的走势方向的表达，而是市场之力是延续还是衰竭，支撑市场运动的能量表达才是真的“势”。由这点出发再看传统理论，原来的困惑点也就迎刃而解了，随着对缠论智慧的逐渐领悟，我发现原来散落的，甚至看似矛盾的理论，居然各得其所、相得益彰。缠论就像易筋经，打通了人的任督二脉、打通了所有关节，就像一根线把所有的珠子串了起来，知道什么理论在何处会起作用，知道什么时候该做什么事情，依据的不再是每个理论，而是缠论的各级别下的走势节点。


    这个阶段，解决的是：缠中禅。这时，缠论成为我交易体系中唯一的交'
