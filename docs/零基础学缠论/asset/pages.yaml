- pgno: 138
  md: '# 中枢的生长


    中枢生长的三种方式是我在这几年教学以及实战中的总结，缠论原文中对这三种方式并没有进行非常准确的定义。在我做缠论量化的过程中，发现中枢的生长有三种不同的方式，通过不断地推导、验证，最终把这三种方式确立了下来。


    三种方式都有其特征，而且是有次序地出现，每个当下只能是其中的一种生长方式，是很好分别及定义的。


    # 一、中枢生长的三种方式


    中枢生长有三种方式：中枢延伸、中枢扩展、中枢扩张。


    # 1. 中枢延伸。


    +   （1）由前三段构筑中枢后，继续围绕中枢区间运动。


    在中枢延伸过程中，没有出现第三类买卖点，即中枢一直在生长，从未终结，当延伸出九段之后，中枢就升级了（如图3-115所示）。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_139_0.png)


    中枢延伸是一个动态的运动过程，由前三段 1、2、3 来确定中枢区间，而 4、5、6、7 是在中枢延伸的生长过程中，走到 9，中枢就升级了。


    +   (2) 中枢延伸不一定升级。


    中枢延伸和中枢延伸升级是两个不同的概念。


    当中枢延伸到九段以上时，我们称之为中枢延伸升级，当然它可以继续不断地延伸下去。中枢延伸升级是以 3 的幂次方为进制不断升级的，三段构筑的中枢就是 3¹ 段（三段），当中枢延伸至
    3³ 段（九段），中枢完成第一次升级，当中枢延伸至 3³ 段（二十七段），中枢完成第二次升级，以此类推，中枢可以不断延伸升级下去。


    如图 3-115 所示，假设每一段代表 5 分钟走势类型，当它形成三段重叠后，就已经是一个 30 分钟级别的中枢了，当它延伸至九段以后，就升级到日线级别中枢了，当它延伸至二十七段以后，就升级到周线级别的大中枢了。它不断地形成
    3 的幂次方段在中枢区间内运动，它的中枢级别就在不断地升级中。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '2. 中枢扩展。


    （1）在前面构筑了一个中枢后，次级别回抽形成了第三类买卖点，原中枢暂时被定义下来，但是上去后又回到原中枢了。


    如图3-116所示，0-7这个走势，当它出现第三类买点6后，7-8又回到原中枢1-4时，它就进入中枢扩展模式，对应的是0-7的反向同级别运动，即7-12。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_140_0.png)


    （2）中枢扩展不一定升级。


    中枢扩展和中枢扩展升级是两个不同概念。


    如图3-117所示，0-7是由5分钟走势类型构成的30分钟盘整走势类型。当6形成第三类买点时，原中枢1-4被固定下来；当它又回到原中枢1-4进行中枢扩展之后，如果形成跟1-4同级别的中枢8-11，就会形成一个7-12的反向运动。1-4和8-11两个中枢是由它的次级别（5分钟）构筑的反向同'
  merge: -1
  img_proc: true
- pgno: 141
  md: '级别（30 分钟）中枢，此时原走势并没有升级，只是形成了上下对应的两段走势运动。


    ![](img/77d1cc7c2112cc267ea790a8866c5111_141_0.png)


    （3）当三个同级别走势形成重叠，原走势即通过中枢扩展的形式完成了走势升级，中枢扩展升级的实质是中枢的组件升级导致中枢升级。


    如图 3-118 所示，当中枢继续扩展，形成 7-12、12-13、13-14 这三个 30 分钟走势，并且三个 30 分钟走势有重叠，那么 7-12、12-13、13-14
    这三个 30 分钟走势就构筑了一个日线级别的中枢，就形成了中枢的扩展升级。'
