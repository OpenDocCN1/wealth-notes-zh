  img_proc: true
- pgno: 181
  md: '（4）小转大的可能性发生。


    任何一个走势的推演过程中，一定要把小转大考虑在内。不可被把握的转折恰恰是最不应该被忽视的转折，所以要把小转大永远作为不测而测的一种变化考虑进去。走势结构充分的时候小转大是很容易判别的，但走势结构不充分的时候也要考虑小转大的发生，要知道该如何应对。


    **5. 不测而测的推演，是在区间套和递归的共同作用下完成的。**


    对力量的判断，或者对小转大的判断，都是一种递归逻辑。例如上面的案例，A0 选取之后，观察 1 分钟走势如何递归到 5 分钟走势，它通过什么样的生长能完成 5
    分钟走势。当它完成 5 分钟走势之后，在区间套的逻辑下，我们就能知道它完成的是不是整个结构背驰的位置。


    所以递归和区间套，一来一去都需要去观察，不测而测是在它们共同作用下完成的，我们必须有这个体悟，才能说不测而测进入了境界，否则不测而测是僵化的，是需要突破的。


    # 五、总结


    讲到这里，缠论从一开始的分型的搭建，一直到最后的运用需注意的要点基本上就成形了。当然这里面还会遇到很多特殊情况的处理问题，那么我们应该基于什么样的原则去理解、使用以及变通缠论，这个我将在未来给大家进行深入的剖析。在不变的准则下，我们才能处理万变的情况，所以下一阶段我们会进行这方面的建设。


    为便于各位灵活掌握缠论的基础知识，我在下一章中罗列了一些过往教学中其他学友遇到的一些常见问题及解答，希望对学习者有所帮助，同时也为后期的实践打下坚实的基础。'
  merge: -1
