    第二层：分型构筑笔；


    第三层：笔构筑线段。


    两种递归方式：


    首先第一递归函数生成第一级别：线段构筑最低级别（本级别）走势类型。再用第二递归函数生成第二级别并不断向上递归：本级别走势类型构筑'
