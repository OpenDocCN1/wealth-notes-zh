  md: '![](img/77d1cc7c2112cc267ea790a8866c5111_180_0.png)


    # 图 3-152


    这就是多级别联立下的不测而测的一种展开，我们可以知道它的防守位在哪里，知道它是怎么破坏的。任何一个交易标的都可以用这个方法来进行分析。


    # 4. 掌握要点。


    （1）严格遵守结合律，这是走势分类客观性的保证。


    只有遵守了结合律，整个多义性分析才具备变换不变性的属性，这个结果才被我们所依据。


    （2）多级别联立下的分析强调整体性、立体化思维。


    不能割裂地去看任何一段走势，任何一段走势都是从属于整个大级别结构的。次级别走势结束，一定会进行更大级别的中枢构筑，或者更大级别的走势生长。所以一定要建立整体性、立体化的思维模型。


    （3）生长力量的判断是在多维度下进行的。


    每一个 A0 设置完之后，可以通过观察它的反向运动产生的力量，来判断它有可能向哪一种变化发展。'
