- pgno: 21
  md: '1997 年亞洲金融風暴後，韓國因為經濟崩潰而接受 IMF 的緊急救助貸款，並於 2001 年清償完畢） ，有錢人們會買進股票，透過不正当的股權發行，把某些集團納入自己的手掌心中。錢越多的人越敢買投資股票，反之，沒錢的人就會說不要玩股票。


    公司是現代版的奴役體系。公司利用所謂的「薪水」 ，讓每個員工都為了這份薪水變成拚命三郎，就算公司的保留盈餘再多，也只會支付給員工最低限額的新資。薪水給得太多會不利於管理，因為他們如果儘可能減少薪水的發給，那就只需偶爾發放低額獎金，員工就會為此赴湯蹈火。不但如此，公司只會釋出一個
    CEO 的位置，然後給予這個人賺以想像的高薪。為什麼要這麼做呢？因為看著這個人，其餘 99.99% 的員工就會燃起夢想與希望。


    但如果底下的員工們除了薪水以外，還有其他收入，甚至比薪水賺得還多（假設是透過股票投資賺取），那麼公司所有人都再也不能成為契約上的「甲方」了，因為當員工的經濟狀態寬裕時，忠誠度就會下滑。


    當然股票很危險，非常危險。但「高風險、高報酬」，是支配階層所創造出來的理論，如此高風險的股票，這些上層人士卻大肆操作，把難以想像的金額投入股市，從中賺取非常多的價差。


    一定會有人反問我，他們是因為有錢才可以賭博吧？並不是的，財力不是問題，因為打從一開始股票對他們而言就不是賭博，因此並'
  merge: -1
