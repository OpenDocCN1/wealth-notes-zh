  md: '# 7、看均線的關鍵在於，別盲從別人的作法


    前面我們了解了移動平均線，其實是為了這個章節做鋪陳。均線是誰能夠侃侃而談，而且視為理所當然的常識，也就是說我們要求打破刻板觀念。如果能夠刻刻板觀念打破，能夠獲得極大的報酬。


    思考一下吧。每個人都在等五日線、二十日線、六十日線、一百二十日線的話，那到底誰會賺到錢？如果所有人都知道的好消息是什麼？就是壞消息了。所以我們要民眾皆知的均線，稍微對個彎換個方式想。如果各位能夠領悟這個章節的內容，就可謂是比入門水準再更上一層樓了。'
