- pgno: 255
  md: '理價值 600 億的房產還算嗎？」


    「我的後腦勺又被敲了一下。」


    「李組長，不要用金錢當作你的目標，也不要把钱當作你的夢想，去找尋更遠大的東西吧。」


    包租公的夢想好像就是從這時侯被遺棄的，而我看世界的觀點也從此更上一層樓了，心裡也變得輕鬆很多。一開始我唯一的目標是實現財務自由，但是現在我的人生又從金錢當中立了，我開始思考我的最終目標，是不是應該去實現更遠大的夢想。


    股票當然是我的挑戰，拿著短線在三年內從薪資中自立，已經為我的人生帶來巨大的轉機點，我將來還能夠開象更多的可能性。


    書出版前我打算重新寫一篇後記，不知不覺現在已經來到 2019 年的 3 月。這段期間我還是低認其投資股票，不過我也找到了新的投資目標。我投資了一間名為「氣泡經濟」的新創公司，它們提供讓所有人都能輕鬆學習股票、房地產、保險、海外投資等全盤經濟的經濟平台，而我是其中的大股東，這間新創公司目前正在大幅成長。此外我也成為了一間正在打造機器人投資顧問、與人工智能新聞的人工引擎新創公司「Pulixers」的共同創辦人。接著我又重新回到職場，這是一間與第四次產業革命有著密切關係的上市公司，我以
    IR、新產業及投資部門的負責人身分加入。'
