  md: '瞬間被停止交易或下市（縮格：韓國股市規定，在每年2~3月審計期間，若企業被會計師拒絕表示審計意見，便會立刻遭到停止交易；合港的下市機制則有兩大條件，包括一、企業被簽證會計師出具繼續經營能力存在重大不確定性查核報告，二、每股淨值低於3元，若滿足其一且在三年內無法改善，將予以暫停交易，並於停牌後半年強制下市）。


    KOSDAQ的企業裡經常發生這種狀況，但我不是要嚇你們，叫你們只能投資KOSPI。其實KOSDAQ對短線而言更有利。2017年3月，連資本超過1,000億的上市公司「IF
    Limited」都因為遭到會計師拒絕表示審計意見而被中止交易，所以必須一直保持小心謹慎。


    如果應該提出審計意見時卻沒有提出，這種時候一定要小心。還記得我們說股市裡面最重要的是什麼嗎？就是「sell」。請銘記，如果企業被會計師拒絕審計意見時，你連賣的機會都沒有。


    # 股東相關內容


    對於長線投資人而言，這個部分非常重要。大股東持有的股份越多，代表了公司經營權穩定等狀態，可以為公司整體加分。但是對短線投資人而言這部分不是太重要。如果大股東的持股減少，代表公司可能發生經營權的紛爭，一般來說經營權紛爭對短線投資人而言是個好消息。


    再者，我們最多只打算持有五天，不需要連公司的持股比例等都考慮進去。當然，不是只有大股東持股比例較低才是好股票，對於短線'
