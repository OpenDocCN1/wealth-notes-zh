  md: '我每天都像身处地獄，以第一名身分考上大學的那份自信感，早已蕩然無存。那時我才理解，為什麼有人會因為幾百萬元而選擇自殺，但是我們依然沒有自殺的勇氣，所以每天睡覺前我都會禱告，「主啊，真的恨抱歉，但是我已經沒有活下去的勇氣了，求求你不要讓我瞇眼迎接明天。」


    但是我每天都依然是會睏眠，就像詛咒一般。


    我們家每年元旦都會一起去正東津看日出，但是自從破產，因為家裡沒錢開車，所以我們就改在父母住的住十二星路旁一起聚會。


    我連確切的年份都已忘記不清了，但我只記得那年元旦的早晨我感覺特別悲慘，因為我還是那天睜開了雙眼，不過慶幸的是當天是國定假日，所以不會接到信用卡公司的催繳電話。我找出幾件乾淨的衣服穿上，然後提著從路上買來、免費毛氈到的15,000元（約新台幣390元）韓幣跟隨盒走出家門。父母所在的屋旁旁到處都是黴菌，而且冬冷夏熱，但我們求的只是一個避風避雨的地方。


    我抵達不久後二弟隨後就到了，他穿著整潔的西裝，兩手提著重量牛肉與禮盒。雖然我很替他感到驕傲，但又真的覺得自己很寒酸。跟父母拜完年，我們一起看完《無限挑戰》新年特輯後，二弟說特別的日子要買雙鞋給小妹當禮物，就去了明洞逛街。


    那天晚上二弟跑來森林洞找我，「哥，你為什麼沒有告訴我？這樣我喜不就變成糗蛋了嗎？」'
