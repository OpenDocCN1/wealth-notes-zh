- pgno: 53
  md: '思考。原因是心理不穩定的散戶們，就算在短線時也容易不穩定，只想着要快點賣出，但是懂得看綠圖的買超主力為了確保購買數量，當然希望委員量越多越好。而那些已經確保購買數量的買超主力，如果想要從中賺取報酬，當然希望委員量越多越好。如果委員量增多的話，先創還是買超主力的一方，就會轉換成或賣超主力。


    股票是活的，是一場心理遊戲。如果被到板概念綁架的話，就很难從股票裡賺到錢，必須在所有人都說 Yes 的時候說 No，具有不一樣的觸點才能賺到錢。還有，委員與委員的主力心理遊戲也是透過這個綠圖進行的。


    綠圖的部分我們後續會再討論，現在我們必須要先做好堅固的心理建設。'
