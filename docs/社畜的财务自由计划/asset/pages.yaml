  md: '提供概念股的分類。


    隨著當天波動的概念進行投資也是好的投資方法，但是這種方法比較適合初學者，而且就算是中階或高手也很容易失誤。為什麼？因為所有人都知道的消息，不是好消息的可能性比較高。


    # 多看精選新聞，培養去蕪存菁的能力


    概念波到來之前，要先具有預測的能力。但是應該要如何才能培養觀察市場與國際情勢的眼光呢？


    就是「閱讀報紙」。從現在開始不要閱讀網路新聞，希望各位能開始播賦質報紙（編按：現在氣質報紙較少，建議訂閱付費型的電子報）。以我為例，我每天晚上回家之後除了看新聞網頁頁，也會看日報的頭版，隔天再把訂來的日報打開閱讀。我一般來說會看朝辭日報、中央日報、東立日報、每日經濟、韓國經濟、EDAILY、ETODAY的報紙。


    為什麼一定要看報紙呢？


    你們覺得每天在傾巢而出的網路新聞大概有幾則呢？大概估計也有十萬則以上。登記為網路媒體的公司有一萬間，每一間一天就大概只有十則新聞，一天也有十萬則新聞。實際上，有些公司每天會發布'
