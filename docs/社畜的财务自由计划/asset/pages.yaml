  md: '# ## 我邊上班邊操盤，三年賺到三十億


    三十歲那年我以工讀生的身分，展開了人生第一次的職場生活。當時的薪水是稅前30萬元（編號：本書中的幣值皆為美元，1美元約等於0.025新台幣，若出現其他幣值，會特別標示），雖然每年調薪，但對於與同齡人相比，資歷和畢業進度落後太多的我而言，更能清楚感受到薪資的極限。就算成為僅占全公司1％的高階管理層，光靠薪水我也無法成為有錢人，所以即便不是鐵飯碗，經常擔憂不知會不會被炒魷魚，也只能選擇咬牙苦撐。那該如何成為有錢人呢？我期望能透過工作證明自我價值，又能擺脫薪資走上自由的人生，因而選擇了股票。


    我知道剛開始接觸股票，賠錢是很正常的，但之後總會把錢賺回來。我還要結婚。如果還有足夠的錢在高階周遭租一間貴黃房（編號：'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# # 008




    韓國獨特的租屋制度，房客在簽約入住時，付給房東一定額度的押金，租約結束後房東需全額退還，一般而言這筆押金費用為房屋價格的六成），我認爲除了股票沒有其他辦法了。


    所以2015年，我湊齊了自己全部的財產總共480萬元，重新投入股票市場。接者用兩年半的時間獲利10億元，第三年報酬率超過了20億，連我自己都不敢置信，身邊友人當然也嚇了一大跳，紛紛來問我投資的祕訣。大家除了被我報報酬率嚇到以外，也覺得一個每天工作十二小時的血汗上班族，竟然有時間能夠投資，非常神奇。


    我目前已維持續投資四年了，我不是一位投資高手，也不是有名的投資人，更沒有所謂的獨家或特別投資技巧，只是運氣很好。我認識的厲害的股票投資老師，溢益良多，而且又剛好搭上股市上漲的順風車。


    而我也因此培養出屬於自己的原則與眼光，開始與身邊的人分享我的方法，以及我有興趣的股票。大部分的人都有不錯的結果，其中也有人獲得了高報酬。看到大家能夠更有活力的繼續過著職場生活，我開始認爲，我的投資經驗應該是
    يمكن 分享給大家的。


    其實我要分享的並不是什麼天大的祕訣。


    > > 「不要長線投資。」

    > 「找出五天內就能一次賺夠的股票。」'
