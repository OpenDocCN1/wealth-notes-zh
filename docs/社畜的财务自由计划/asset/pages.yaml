- pgno: 122
  md: '當股實強力突破壓力線時，股價可以說會很容易漲到下一個壓力點。不要害怕，我們並非在賭博，而是透過正確的分析來進行股票買賣。我們在這裡所指的「強力」，意味著伴随高成交量的強力買進趨勢，如果沒有成交量的話，就不能成立（也被稱為突破買入法）。

    如果出現這種幾乎像漲停板的紅長線，就要在股價強力突破壓力線的同時，買進股票。


    支撐與壓力是能讓我們知道買賣與賣出時機點的重要指標，請應用在其他股票上多加練習。看著 HTS 系統上已經畫好的支撐線，去分析其中的原因，持續練習直到自己可以畫出這條線為止。


