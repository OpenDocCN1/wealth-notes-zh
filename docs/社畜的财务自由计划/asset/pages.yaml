- pgno: 123
  md: '讓我們再來看看幾個可以顯示支持與壓力重要性的案例。


    # K 線 (蠟燭圖)


    ![](img/28e73127539f4de4c136d9605847a1f7_123_0.png)


    K 線 (蠟燭圖)，把一定期間內的股價，用柱狀條呈現的線圖，稱作 K 線圖。標示一天股價的成為日 K，一週的則為週 K，一個月稱為月 K。當然也還有分 K、以一、三、五、十五分鐘為單位、六十分鐘的分時
    K 線則能看出一小時內的股價變化。


    健線 (黑 K 線) 與陰線 (紅 K 線)


    陰線是收盤價高於開盤價，會以紅色（上漲）作高警示：健線則是收盤價低於開盤價，會以藍色（下跌）做為警示。上下突出的線則會展示出當天的最高價與最低價。


    ![](img/28e73127539f4de4c136d9605847a1f7_123_1.png)


    > 編按：臺灣多以紅 K 線來稱「健線」，黑 K 線來稱「陰線」'
  merge: -1
  img_proc: true
