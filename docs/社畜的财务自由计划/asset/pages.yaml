  md: '所夢想的財富自由，甚至連應付寬裕的老年生活都很困難。


    那麼上班族到底應該怎麼做，才能夠獲得財富自由？答案是，理財，而且必須要進一步投資。對於一個領著低薪且身無分文的上班族而言，不管如何左思右想，能想到的方法就只有股票。


    # 「股票很危險」

    其實只是假象


    「股票不就是賭博嗎？」


    「買股票太耗費精神，怎麼好好上班？」


    「上班時間請不要玩股票。」


    我們父母那輩，包括在公司高層要職的人，對股票都持有非常負面的看法。他們會說，玩股票很容易家破人亡，散戶最終只會賠錢，阻擋我們接觸股票。說著這都是「為了我們著想」。


    這種現象不僅局限於年長者，也有很多年輕人傳達說著「理財是根本」，卻又說「股票就是賭博」。如果想要接觸股票，就會有連股票是什麼都不懂的人，也跳出來阻擋。


    如此危險的股票，到底是哪些人在玩呢？幾乎所有上市公司的所有人，都會透過股票進行變相贈與。發生國難的 IMF 時期（編按：指'
