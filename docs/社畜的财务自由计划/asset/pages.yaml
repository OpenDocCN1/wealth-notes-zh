  md: '現在想想，那位看在前輩的面子上，被拖來見我的股票高手應該覺得我很荒唐吧。但是人與人的缘分真的很奇特，雖然不知道他是怎麼看我的，但是他真的從基本分析、看財報、技術分析、看線圖等，一步一腳印的教我。


