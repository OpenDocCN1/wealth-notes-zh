  md: '# 認識到底層的過去，是我努力的动力


    大家想聽聽我以前的故事嗎？


    如果是七十、八十年代的人，應該都記得「IMF 外匯危機，這個可怕的經歷吧？我們家就是在這時候支離破碎的。我的父母在鄉下地方經營自營企業，為了抵抗IMF接二連三的衝擊，他們成為卡奴，持續靠貸款維持，結果還是走到了破產。當時我正在就讀大學四年級，我的弟弟正在準備第三次重考，妹妹則正在就讀大學一年級。


    當時我們兄妹全都在準備國家考試，我跟小妹在準備司法考試，弟弟則是在準備註冊會計師（CPA）考試。在艱困的經營環境下，我們的父母跑去賣鱈魚燒、在中國餐廳裡工作、還經營一間小麵館，支持著我們三個人的經濟。但是在這種以補習班為中心的考試體制下，金錢的多寡直接決定了考試的合格機率。像以前那種獨自到關閉讀書，或是兼職當著考試院管家（編按：考試院是韓國特有的一種租屋形式，用較爲低廉的價格，提供住宿給到首爾準備考試的考生，而管家的職責則是負責'
