- pgno: 256
  md: '賣高管的身分受僱。然後我還投資了一個開發 VR 遊戲的非上市公司。


    在這些公司裡我不是沒有年薪，不然就是以最低薪資一半都不到的金額簽了合約（高階主管並不受最低薪資法規範，但是能夠獲得股份）。現在我才真的覺得自己已經從薪資中獨立了，因為我可以不受薪資限制做自己想做的事。


    2018 年第四季，我們第一次整個家族一起出遊，帶著媽媽、岳父、岳母一起去歐洲旅行，幾乎所有的旅程都是靠著租車跟 Airbnb 度過。我先跟長輩們一起玩了一個月，接下來的兩個月我跟老婆和兒子一起出去旅行，在此我找到了真正的幸福。很奇怪吧？


    仔細回想起來，跟媽媽一起度過二十四小時這種事，除了兒時以外好像就沒有過過了。就算只是去幼稚園上課，也不能跟媽媽每天黏在一起，上了大學之後每年光是要相處一個星期都很困難，開始上班之後更是如此。這是第一次跟兩家的長輩，也就是媽媽、岳父和岳母二十四小時連續膩在一起相處了一個月。就算不跟聽老人家嘮叨也無處可逃，但聽著他們的談話，我清楚地明白了他們對於人生、孩子與孫子的想法，讓我深感幸福。


    跟老婆和孩子一起旅行的時光，也讓我回顧了自己的幸福。我本來以為自己已經很顧家了，但是這次的旅行卻讓我認為自己應該花更多時間在家人身上，我甚至在想自己是不是已經忘了透過股票賺錢的初衷。大家都說幸福不是追求而來的，是透過發現而來的。這趟旅行'
  merge: -1
  img_proc: true
- pgno: 257
  md: '讓我了解了這句話的意義，這可能也是我人生最重要的發現吧。


    暫時脫離股票出去旅行，另一件讓我有重大領悟的事情，很顯著的跟股票有關係。我一開始認為每個人都可以跟我一樣投資股票，也認為大家應該跟我一樣努力。但是現在我的想法有了大幅度的改變。


    老實說我從來沒有覺得自己成功過。但是當年我考試不斷落榜，還一直被追債的時期，我也沒有認爲自己是一個失敗者。人生不就是這樣嗎？我們所有人都活在沒有彩排的现实當中，每個人也似乎都有自己的步調、目標、方法與道路。但是這本書依然會出版，除了與各位分享我的經歷與秘訣以外，我還告訴各位的是要去摸索、發現、準備與跳躍，希望各位都能展開一場自己的財務自由計畫。


    也許有人現在正深陷泥沼，覺得自己已經是位失敗者，未來也毫無希望了。請想像未來的自己吧，你還在原地踏步嗎？答案可能是吧。那麼現在再回頭想想過去的自己也，你還是在原地踏步嗎？


    愛因斯坦說過，「每天不斷的重複做相同的事，卻期待有一天能出現不同的結果，這是精神病的初期症狀」。


    好好思考，然後做出改變吧。利用時間、人和地點來發現自己的幸福，立刻做出改變吧，現在開始還不晚。


    願各位都能成為一位發現幸福的投資人。'
