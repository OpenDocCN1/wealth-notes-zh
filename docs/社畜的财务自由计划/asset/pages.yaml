- pgno: 38
  md: '的時間鑽研發呢。


    總而言之，我想說的就是：股票可以從小額開始投資。假設我們從 500 萬開始投資，每個月有 20% 的報酬率，那麼三十六個月，也是三年過後會有多少錢呢？29.6
    億元。不可能有每個月 20% 報酬率？那每天 1% 的報酬率呢？是不是覺得很有可能？即便是只有 100 萬的小額投資人，只要找到對的方向與投資原則，三年後也可以擁有
    1 億元。我從 480 萬開始，在兩年五個月內賺到 10 億元，又在兩年十個月的時候賺到 20 億。第三年的時候賺到 30 億元，千萬不要覺得這不可能。在短短的人生命中，當你判定為不可能的前瞬間，我們的頭腦就會被侷限。各位只要打破刻板印象與偏見，這就會變成有可能。


    我身邊有很多人想要投資股票，卻沒有本金當藉口，遇遲不敢投資。每當我看到這樣的人，內心的一角總是有一股無法抹去的鬱悶。難道我是一開始就賺這麼多錢的嗎？剛開始從小額投資，當然報酬金額也不會太高。


    但是我深感當初能以小額開始投資，真的是上天賜與的幸運。假如我是從幾千萬或是幾億開始投資股票的話，還會擁有像現在一樣安全穩健的投資能力嗎？我想答案應該是絕對不行吧。


    很多散戶都是像飛蛾一樣，衝進股票市場受了重傷然後離去，因為「股票就是賭博」，頭也不回的就走了，當然這些人還會再回來，所以現在的你們才會讀著這本書不是嗎？'
