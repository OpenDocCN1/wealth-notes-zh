    再生能源概念股一路高漲，所以我開始留意還沒浮上檯面的太陽能股票中，藏圖表現最好的 Daesung Fine Tec。


    我開始分批買進，接著在 5 月 16 日的時候，隨著 Daesung Fine Tec 熱加入太陽能概念股，股價上看漲停板，我光在這一天就賺了 3,700
    萬元（約新台幣 92 萬 5 千元）。我在 15、16 日的時候買入，並在 16 日賣出實現了報酬。


    個性比較急的讀者，看到這裡應該很立刻知道要怎麼看藏圖吧？但是現在就算各位開始學習藏圖，也無法理解的，因為各位過去


    ![](img/28e73127539f4de4c136d9605847a1f7_76_0.png)


    # Daesung Fine Tec · 5 月 16 日急壞上漲至漲停板'
