    四十五日線買賣最大的優勢就是，就算股價在四十五日線上沒有立即上漲，只要不跌破六十日線，幾乎有九成以上的股票都會反彈。是一個對當沖或短線投資來說很好的投資方法。


    +   6. 在報酬高的股票中尋求跌破反彈的作法。所謂的崩盤就是指短線股價下滑時，股價持續也買以低價格股票大量售出，使股價迅速下跌的情況。而買空賣空是指在股票下跌中發生回測時進行買賣的股票。


