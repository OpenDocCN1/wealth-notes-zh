  md: '區分。這帳戶的帳戶中如果出現套牢股票，就會經常感覺虧損，因此被套牢的股票，我會透過證券公司的「股票匯卷」（不同券商之間股票移轉）進行分類，有時候也會為了參加證券公司推出的免手續費活動，或是實戰投資大會等，而增加帳戶。


    以我自己為例，這帽子與短線我放在培育證券，波段與暫時收集的股票會放在未來資產（與大字證券合併之前），被套牢的股票則放在大字證券。有進投資證券是在 2017
    年開的，五年內免手續費是它的優勢。


    培育證券因為用得最久也最上手，雖然現在我主要使用的證券公司為有進，但是線圖和檢索我全部會先透過培育進行操作及確認。'
