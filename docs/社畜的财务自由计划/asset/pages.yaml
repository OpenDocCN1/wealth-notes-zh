  md: '我第一次投資股票也是在 2011 年，當時我放棄高考，在偶然中接觸了股票。每天九點開市到下午兩點五十分的模式，看起來很簡單也很有趣。當然，當時的投資結果非常不好，雖然有過兩天內上漲兩倍以上的經驗，但是卻反覆掉進立刻賠錢的惡性循環中，只要我「買就跌、賣就漲。」


    我跟所有人一樣：一開始什麼都不懂。什麼是優差、營業利潤率、當期淨收入……我什麼都不懂。我只是因為渴望一夜致富，就幾次把打工薪資存下當作基金全投入股市，但每次都是一無所獲。我投資了一家傳說中名為
    Terra Resource 的公司，結果血本無歸，後來又投資了一家我連名字都想不起來，許驊說要開發愛滋病治療藥物的公司，資金又全數歸零，因此我開始覺得原來股市就是賭博，雖然離開股市。但是後來的情況，讓我不得已只能回到股市，接著在命運的安排下，我認識了一些很好的人，開始認真鑽研股市，才走到今天這個成就。


    現在回頭想想，那真的就是一場緣分。我遇到這輩子第一個讓我想跟她結婚的女人，但是我卻什麼都沒有。偶然在前輩的介紹之下，我認識了一位被稱作股市高手的人，第一次見面的時候，我就緊繃抱住了他的大腿。


    「我想結婚，拜託請你幫我賺到能在首爾近郊租棟單層的钱。」'
