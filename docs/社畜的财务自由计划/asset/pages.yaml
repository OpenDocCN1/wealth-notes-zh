- pgno: 249
  md: '# ## 11. 給投資人的最後叮嚀


    在最後我有一些話一定要告訴各位，這是這段期間我所經歷過的所有的喜怒哀樂、所教訓給我的投資心態。


    第一點：千萬不要滿意


    投資股置時，什麼時候會讓各位倍感疑惑？


    應該大部分的人都會說「虧損嚴重的時候」吧。當看者持有的股票走向 -10%、-30%、-50% 的時候，真的很痛苦。但是如果只用你持有資產的 1% 投進這個未知的股市時，-10%、-30%、-50%
    也會一樣痛苦嗎？


    當你因為虧損嚴重而痛苦不已的時候，意味著你的投資配置不當。


    如果只花資產比重 10% 來投資，不管股票再怎麼跌，你也不會過於在意，也不會因此煩躁和痛苦。反正總有一天能漲回來脫手而出，'
  merge: -1
  img_proc: true
- pgno: 250
  md: '就算決定停損也不會對自己的資產造成致命的傷害。

    一定要時時刻刻注意自己的投資配置，能夠「藏倉」在股市的時候，一年可能都不到一兩次。同時具有藏圖＋成交量＋好消息的股票，在我看來機率不到 1%。投資一百次才能遇到一次，非常不容易。

    我們不是經常聽到這句話嗎？「不要把雞蛋放在同一個籠子裡」。雖然我有時候還是會把雞蛋放在同一個籠子裡，也就是想拚一把的時候。但是就算是這種時候，我也絕對不會投入
    50% 以上的資產。

    投資高手們總是慎重的再調整投資比重，但是散戶們卻對這個部分漫不關心。請各位一定要多花點心思，特別是看綠圖選出來的股票，比重千萬不要超過 20%。


    第二點：投資是一場惊鬣競目。


    不管什麼時候，請務必要開心交易。

    練習的時候要說真以待，實際操作時要開心對待。

    如果有人願意跟你一起開心投資，那是更好不過的了。


    第三點：股票市場三年後依然會高你敬開。

    股票市場永遠是敞開的，認真鑽研與練習，就算三年後再開始正'
  merge: -1
  img_proc: true
- pgno: 251
  md: "式投資也不嫌晚。這本書可能是為了這句話而寫的吧，各位是為了等待那不知何時才會上漲 1% 的「人生股票」，才因而投資股市的。\n\n  人生中不管是自願、他人要求、或是偶然也好，都一定會抓到梧大的機會，這個機會可以是房地產、也可以是股票，或者是婚姻，很多時候我們都要等到與機會擦身而過，才會明白這是一個機會。\n\
    \n這個機會，就是要能夠在股市的槍林彈雨裡抓住梧大的機會。但假如各位壓根就不投資股票，或是投資水準不夠高，便無法從這浩大的機會中獲得高報酬，股票要先相信自己才能下注。\n\
    \n各位如果可以從現在開始培養對股票的感知與心態，即使是三年後、或甚至是一年後，都有可能抓住讓自己資產大躍進的機會。\n\n為了不錯過這麼重要的機會，請不要急於眼前的這些報酬，等你好鋼研後再正式投入股市也不嫌晚。\n\
    \n為了讓自己在機會來臨時，透過自身的判斷進行交易，請從現在就開始努力吧。\n\n# 第四點：休息也是投資的一種\n\n股市狀態不好的時候就休息吧，休息就能夠阻止資產的損失。\n\
    \n2017年7月，我正在寫這篇文章的時候，三星電子的季度利潤超過 Apple，成為世界第一的新聞橫蠻而出。與此同時，KOSPI 也在雨"
