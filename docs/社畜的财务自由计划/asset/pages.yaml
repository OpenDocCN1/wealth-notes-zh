- pgno: 222
  md: '# 10. 遊牧民的股票投資

    三大原則


    我認為無論什麼樣的法則，都要能夠被簡單敘述。不管任何事或是任何理論，如果不能簡單歸類為三大原則，就不算是真的了解它。所以對於股票，我也有我自己的三大原則。當然我不是一開始就有這三項原則，這是在操作的过程中逐漸形成的。


    +   買進前的三大原則

    ② 買進後的三大原則

    ③ 遊牧民


    第一點跟第二點就算了，但大家應該很好奇第三點，何謂「遊牧民」吧？但即便如此，也請讓我們按照順序繼續看下去。這個章節的存在，就是為了讓大家對投資時的思維模式能更加一目了然。'
