    我說過什麼？


    股價暴漲的前提是成交量暴增（至少比前一個交易日增加500%~1,000%以上）後，緊接成交量銳減（25%以下）的情況。


    5月31日及6月1日時發生了上述的情況，緊接著6月2日股價就飆漲，擊漲漲到1.725元，將近漲停板。同一天我從Kuk Young G&MM獲得了97%的報酬，共590萬。


