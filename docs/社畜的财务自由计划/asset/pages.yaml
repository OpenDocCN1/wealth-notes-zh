- pgno: 39
  md: '關於人生的穩定性，我在前面已經談過，但股票的變動性比薪資高上許多，其中的報酬與虧損會對人生造成的影響也比較大，所以投資人應該要訓練能夠承受這種變動的「心靈肌肉」。剛開始應該要像熱身一樣，用自己能夠輕鬆管理的小額開始投資股票，一開始就先談關論著「資本」、「本金」的人，從出發點開始就已經是錯了。


    仔細思考看看吧。假設你今天只有 10 萬元的股票，你覺得會虧損還是賺錢呢？我想答案應該是後者吧。持有自己能夠承受的金額來看整個市場，很多東西會看得更加清楚。如果用著想一夜致富的心態來看這個市場，就會看不見真相，就像是一匹只望著前方堅韌的寶馬一樣。我認爲
    200 萬的本金就很足夠了，甚至再少部分也沒有關係。


    # 症狀二：


    ### 誤以為專職投資才能賺大錢


