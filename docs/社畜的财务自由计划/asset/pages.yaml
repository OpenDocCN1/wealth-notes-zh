  md: '如果想要擺脫呆滯狀況、財務自由，最少每個月都要透過股票賺到跟自己薪水等值的金額。如果你想過從薪資中完全財務自由，每個月必須要賺到 1,000 萬元（新台幣
    25 萬元）的資本所得，你想透過價值投資或長期投資來達成這件事？根本不可能。你的錢不像法人、外資、企業老闆一樣多，更何況法人其實也做短線操作，但是散戶卻要長期投資？這只是在說明「我不會投資」而已。如果巴菲特是韓國人，他也會靠著短線操作成功。


    上班族們應該要盡早從「長線投資與價值投資才是優良投資方式」的誤解中擺脫。三星電子股價漲了很多吧？但就算漲這麼多，一年也漲不到 100%。對法人而言 100%
    已經算是很多了，因為錢滾錢的規模不一樣，但是身為散戶卻跟著法人操作，只會成為盤中燦而已。


    再者，掌握價值投資的信託公司，如果在六個月以內做不出成果，客人便會轉身就走。因為他們不知道短期項目有些些，所以他們撰寫報告、分析行情、撰寫戰略，再將它們共享出去，募集被小道消息吸引的付費會員，接著創造訂單。


    如果能確保短時間內就創造高報酬，那麼那些计量投資人、價值投資人還真的會從事價值投資嗎？只有沒有自信心面對短期投資的人，才會成為非自願性執行長期投資的「堅持投資人」。


    讓我們一起高喊吧！


