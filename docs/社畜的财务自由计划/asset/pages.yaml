  md: '用來當作子彈，等好的投資標的出現時使用。


    我自己的錢都沒有全部燒給，如果還當中還混了別人的錢。不過是瓜分了自己的報酬，賠了夫人又折兵。（但如果一次付出 100 億給我就另當別論了，哈哈哈，但是上班族能有這筆錢的話，幹嘛拿來買股票呢？）


    如果說一開始投資股票的資本必須夠大才行，那我應該要收下別人的錢來進行投資吧，但其實我證明了股票也可以從小額投資開始。我自己不就是從一開始的 480 萬，到一年後的
    1.5 億，創下了大概 3000% 的報酬率。


    你應該會想「這不過就是特殊案例而已」吧？所以我帶著一個跟我關係很好的弟弟做了測試，但我並非只是跟他說要買什麼股票，而是要求他照著我的投資方式來做。他一開始只有
    3,000 萬元（約新台幣 75 萬元），還不到一年內就變成了 1.3 億元（約新台幣 325 萬元）。


    我的方式還算滿正確的，只不過需要鑽研學習，應該說是非常需要鑽研學習。我前面也提過，我每天晚上十點下班後，就會開始研究股票到凌晨兩三點。我已經好幾年沒有看過連續劇了，電影也只有偶爾才看（其實應該要多看電影才對，舉例來說，如果我親自去看了《犯罪都市》這部電影，應該就會有機會買下製片公司
    Ktwi 傳媒集團的股票）；我真的很喜歡玩遊戲，所以也買了索尼最新的遊戲機，不過也只有玩了一次，雖然我真的很想沉浸於此，但是如果只玩遊戲，明天


