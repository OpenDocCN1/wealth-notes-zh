    # 韓國投資證券，約7000萬


    帳戶多吧？剛開始我只有使用韓培證券，後來才加辦了兩個倍肯證券、兩個未來資產證券，還有兩個有進投資證券，最近又加了 KB證券與韓國證券。培育、未來、有進都很好，但是我認為有進是後起之秀。


    各位持續投資的話，帳戶也會慢慢增加。初學者會以單一帳戶進行搶帽子（scalping，以分秒為單位進行交易的超短線買賣）、當日沖銷（day trade，當日買賣）、短線（最多五天的交易）、波段交易（兩週以上，操盤一到三個月的買賣）、長線投資（六個月以上的買賣）、套牢（非自願性長期投資）等交易，但繼續操作後就會開始以性質作分類。


    PART 1 社會啊，使今天開始做超額投資吧！

