- pgno: 22
  md: '不危險，至少對他們而言，股票並非「高風險、高報酬」，而是「低風險、高報酬」。上層人士之間可以分享情報，並安全的大幹一筆。他們賺的錢，從數十億、數百億到數千億都有，繼而言之是我們無法想像的世界。


    那麼無法獲得這種上層情報的散戶們，究竟要怎麼做才能降低風險，創造報酬呢？以我的經驗來說，只需要學習即可。沒有錢的我們，透過學習了解股市，就能大幅降低風險，當風險被降低後，股票就再也不是賭博了。


    於是我一開始，就拼了命的學習。


    # 血汗上班族的我，

    如何靠投資賺大錢？


    上班族很難有時間投資股票，真的很難。但是上班族也很難有時間讀書、很難有時間談戀愛、同儕很難有時間去看電影。上班族還要回家鄉探堂父母都很困難，別說是海外旅行了，連去國內旅行也都很難。


    這麼說來，投資股票有多難呢？


    人們為什麼會認為「對上班族而言股票是賭博」？因為他們認為透過股票賺錢需要付出時間和學習，一旦不是如此投資，就很容易賠'
