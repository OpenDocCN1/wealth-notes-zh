  md: '# 用三日線

    找出暴漲股買點


    股票是一場心理遊戲，誰不想要便宜時買進，高價時賣出？股票市場正是這種貪婪的集會地。前面「五日線」的章節我跟各位提過，如果股票長時間併不前，或是股價大幅下跌的股票發生劇烈反彈時，碰到五日線的時候就要趁餘燼（黑K）時買進股票。問題就出在所有的人都在等這條五日線，那麼究竟股價會不會跌落至五日線呢？


    如果是股價突然上漲的情況，並不適用於五日線交易方式。股價突然上漲，意味著買進的力道大於賣出的力道，這種情況下股價不會來到五日線，大部分則是會來到三日線。


