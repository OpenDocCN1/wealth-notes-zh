  md: '# 不受時間限制的

    交易方法


    針對早上九點到十點都擠不出時間，但是又想投資股票的話，這個章節會推薦給各位一個交易方法。這個方法就是先經過幾天的時間讓買進後，再抽出一分鐘的時間冒出賺取報酬。這也是一個打破刻板印象的方法，因為一般而而言，這是傳出售出重大不利消息時，股票配股增資、無償減資中延伸出來的買進策略。這個技術是運用一本書都難以闡述的複雜又龐大的技術，但在這裡我會向各位簡略做個介紹。


    # 現金增資


    什麼是現金增資？用一句話總結，就是將除權後產生的面額損失，透過發行新股的方式恢復股權的買賣法。聽起來很複雜吧？實際上也真的很複雜，是一種必須透過實際操作過才能體會到的買賣方法。這個方法可以獲得高額報酬，但是沒有實際操作的經驗很難加以體會。要解釋這個買賣法寫一百頁都不夠，是非常專業的領域，因此這個章節我們會透過案例來了解整體框架，希望以後各位都能親自嘗試看看。一般在市場上，如果公司宣布進行股東配股增資，股價幾乎會落'
  merge: -1
  img_proc: true
- pgno: 208
  md: '到接近跌停。接著公司在這個時候增发股票，所謂的現金增資就是意味著公司需要錢，為了得到這筆錢，只好向股東伸手的意思。現金增資因為股數的增加，股價自然就會被稀釋。


    但是這種不利消息，只能適用於既有股東身上，不適用於後纔才購入的新賣家，這反而是否能够以非常便宜的價格購入股票的機會。除權的當天股價幾乎都會上漲，除權的時候，如果能将優先股股票賣出的話，就可以賺取高額利益。


    這個時候各位應該被什麼是除權、什麼是優先股股票搞弄得很頭轉向吧。簡單來說，除權就是以使的方式，把股價按照減幅進行股價調降。雖然股東可以獲得以便宜價格購入新股的機會，但同時也必須面臨除權（以前一天收盤價為主下調股價）。這是為了舊股東與新股東間保持公平所採取的措施。除權之後進場的新股東，以及現有股東以便宜價格購入新股時，都會面臨相對的損失，讓其相互抵銷。


    但公司也必须要確認誰能獲得優先配股權對吧？而標準就是配發新股的那天。配發的前一天就會進行除權，必須在除權前一天持有股票才能取得優先配股權。如果想要參與增資的話，只要將優先配股權賣出即可。我是那種「見好就收」的類型，所以基本上都會直接賣掉，讓我們來看一下實際買賣。


    我們來看看世崇電信吧。當公司宣布要進行股東配股現金增資，時股價跌了30%（綠框部分）。6月28日的時候，我們可以看到股價'
