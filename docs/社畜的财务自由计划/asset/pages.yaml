  md: '與此同理，6月5日時成交量雖然銳減，但與五日報的距離過遠（前節◎），因此隔天股價上漲的機率不高，不過假如股票價格開盤在五日均線上，仍然有上漲的可能性。如果兩天後，也就是6月7日成交量又再次銳減，同時伴隨股價下跌的話，6月8日的時候就有可能突破1,650元，屬於表現良好的燭圖（P.S.2018年2月我回過頭來看，發現6月12日的時候股價漲到了1,850元）。


    所以我們可以將成交量原則歸納如下：


    # 成交量的原則


    +   ◎ 股價暴漲的前兆=成交量暴增（至少比前一個交易日增加500%～1,000%以上）後，發生成交量銳減（低於前一個交易日的2.5%）的情況。最好的情況是低於前一個工作日的12%。


    +   ◎ 成交量銳減的當天，股價不能跟五日線高檔迴避。碰到五日線的情況就可以（要先確認五日線高於支撐線），不能大幅跌破五日線。


