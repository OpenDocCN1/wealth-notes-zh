  md: '入賭博的狀況中。


    想胡謅的時候，我們會猜議要讀哪一本書，看電影時，也會猜議要看哪一部電影，要回家看爸媽時，會從年假開始著手計畫，煩惱如何安排一家人的行程，旅行就說不用說了。但是要對投入大筆金錢的股票，我們卻不會像看電影或苦惱，更多的時候我們會這聽途說。


    用這種方式投資股票，當然是一種賭博，風險也只會高不會低。


    如果你不是想花錢，而是下注決心想賺錢，那就必得學習。而且我敢保證，只要學習就能獲得報酬。


    我高考不斷失敗，重考到年紀很大，在反覆的失敗下，直到 2011 年，我才以三十歲中段班的年紀，開始我人生第一次的職場生活。我從税前月薪 100 萬元（新台幣
    2 萬 5 千元）的工讀生開始做起，兩年後雖然转正，但薪水仍然不達 150 萬（新台幣 3 萬 7 千 5 百元）。


    我們家在 IMF 時期家道中落，2011 年我剛進公司時，銀行帳戶裡只剩下 100 萬，在這之前我都是貧窮的公職考生，貧困的時期我還新譯過「只要有 300
    萬元（約新台幣 7 萬 5 千元），我就可以住在有廁所的套房裡，拜託讓我中 300 萬元的樂透就好了」。


    但我真是殘酷的。為了照顧正在準備註冊會計師考試的弟弟，我利用信用卡拆東牆補西牆，還差點變成信用不佳者，最辛苦的就是一天內會接到數十通信用卡公司催繳電話的時期吧。我還記得當時因為自己沒有勇氣尋死，每天晚上還祈禱著「拜托明天不要讓我的期限」了。'
