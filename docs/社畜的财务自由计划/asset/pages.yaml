    請持續累積報酬增加資本吧。只要基礎能夠好，連接帶利增加的帳戶也能穩如泰山。但是沒有基礎便能只靠運氣往上爬的人，隨著帳戶的錢變多，遲早也會因為無法承受風險，導致倒台的機率大幅提高，所以請不要著急。


