  md: '# 從迷宮裡逃脫的方法


    各位知道迷宮吧？字典裡說「迷宮是拐彎抹角，一旦進去便難以脫身的地方」。


    ![](img/28e73127539f4de4c136d9605847a1f7_112_0.png)


    很熟悉的迷宮吧？我們小時候不都解了很多迷宮的謎題嗎？這種迷宮只要花時間，誰都可以找到出路。但是，為什麼呢？請花五秒鐘想想看，為什麼所有人都能解開這個迷宮？


    答案就是，因為各位是由上而下俯瞰這個迷宮。這是因為我們'
  merge: -1
  img_proc: true
- pgno: 113
  md: '2D 的方式看著這個迷宮，所以才能解開這個謎題。但假設各位是以 3D 的角度站在同一個迷宮裡，你們真的能逃脫出去嗎？


    在 3D 的迷宮與用 2D 的角度看迷宮，是完全不同次元的東西。如果想從 3D 迷宮逃脫出去，就必須轉換觀點，慢慢地角度往上抬高，就會漸漸看見全貌。最後就會看見
    2D 平面圖，就算要花很多時間，但還是能把迷宮解開。


    現在正在累積相關知識的我們，是站在 3D 的迷宮裡，但是等迷宮的資訊漸漸在腦海裡融會貫通，你就會看見地圖，也就會轉換成為 2D 迷宮。


    股票也是一樣的道理不是嗎？各位現在站在 3D 的迷宮裡，所以覺得股票很難，又有點恐懼。但如果能在這場遊戲裡，由上而下俯瞰，那麼眼前看見的便不是恐懼，只不過是像走在熟悉的街道上，就能解


    ![](img/28e73127539f4de4c136d9605847a1f7_113_0.png)


    PART 2 如何正確學習知識，才能做好財務投資？ 111'
