  md: '成交量。越是股票高手，就越只單純看均線與成交量，其中更高者的人只看股票與成交量。


    這裡所謂的「看股票」指的是能夠從多年的經驗中，看出「端倪」的能力。這裡的端倪指就是一漲就漲萬里，一漕就漕千里。


    我們是操作短線的人，對於短線族而言，最壞的情況就是股票緩慢增長，雖然對於長線投資而言這是好現象，但務必先清楚決定好自己是要搶帽子、短線還是做波段！像我自已就是屬於搶帽子與短線之間的類型，會比玩短線的人更快脫手，有時候買進五分鐘後就會直接賣出）。


    這次我們要學的是成交量的概念。這是上班族股票生涯中最重要的部分之一，也是其中最難以領會的部分。我會盡可能仔細說明給你位聽，但是我想前面「支撐與壓力」的部分、各位能領悟的恐怕也不到5%吧。要等到各位能夠完全將其自由應用在每一支股票上時，這才會成為是你自已的能力。但也有些人會利用其他方式，找到屬於自己的一條路，為自已帶來150%、200%的領悟。


    讓我們來做個約定吧，我們在股市中會聽到諸如一目均衡表、RSI、MACD、布林通道等各式各樣的指標，但這些都只是江湖偏語。也有很多人會號稱自已是精通以上指標的股市專家，作威作福，但是這些人大部分是騙子的可能性屮居。如果有人跟你高談闊論這些東西，那就請他出示帳戶證明給你看。為了要確認他是不是偶然找到一支扶搖直上的股票，請他一定要把日報期率、月報期率全部讓你看過目看看，'
  merge: -1
  img_proc: true
- pgno: 136
  md: '我相信他應該拿不出來。

    我們只看均線與成交量，雖然其他指標能夠舉起來也不是件壞事，但最後你也用不到它們。我也是把全部都學了，最後卻只看均線與成交量，只有在成交量比較大的時候，為了更確保依據提高信心，才會稍微看一下其他指標。


    # Aim High


    讓我們再次回到 Aim High，看成交量的部分。下圖總共有三個綠色箭頭，我們要看的地方是第一個跟第二個綠色箭頭。我們可以看出股價急速上漲的前一天，成交量急速下降，透過這個狀況我們可以了解到：


    +   - 股價暴漲的前兆

    - 成交量暴增後（至少要比前一個交易日多 50%～100% 以上）

    - 成交量急速下降（25% 以下）


    我們把成交量的部分放大檢視，可以看出 4 月 25 日的成交量比前一天大幅減少 20%。因為前一天公布的通如注意 2，許多股民基於風向大幅降低時或賣出；或是股價與成交量產生極端變化時，證券交易所基於保護投資者的立場，在必要時要求投資人要求跟蹤的公告。


    2. 當有報導或消息傳出；或是股價與成交量產生極端變化時，證券交易所基於保護投資者的立場，在必要時要求投資人要求跟蹤的公告。'
