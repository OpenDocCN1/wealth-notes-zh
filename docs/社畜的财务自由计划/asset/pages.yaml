  md: '天只睡三、四個小時，努力研究股票的動力。


    財務自由之後我最享受的一件事，就是去餐廳不用再點最便宜的套餐，而是可以點自己想吃的東西。還有去買衣服的時候，不需要偷瞄價目表，甚至不用問價格也可以，喜歡的話只要說「請幫我拿一件」就行了。


    以前只能從媽媽身上拿零用錢的我，現在已經可以給媽媽零用錢了，也第一次不再住月租房而是做買房。現在每當我看到媽媽和兒子的時候，我都會想起父親。


    爸爸在事業倒台之後，為了繼續照顧我們，去了中式餐廳洗碗和煮麵，結果中途得了肺癌。被醫生宣告只剩下十個月的時間，最後在第九個月的時候就離開了我們。


    大家都說人在死亡前會回歸孩童時期，我想起了爸爸在過世前一個月最常對我說的話：


    「我們什麼時候要買房子？」

    「我們什麼時候要買車子？」

    「你什麼時候才要帶孫子回來？」


    到現在我最抱歉的，是父親生前我們三兄妹都沒能結婚，當然更不用提孩子了，而且這事也沒房。


    但是爸爸去世後，神奇的是所有事都一件一件實現了。二弟率先給了婚，隔年輪到我結婚，再下一年小妹也結婚了。後來我先有了孩'
