  md: '我們當然能夠透過操盤賺錢，但是那種上下報酬率 1 ~ 3% 的短期交易，我們絕對沒辦法光透過操盤就能夠從 500 萬賺到 10 億元。應該有很多投資高手想大聲反駁吧？但是請細心直問吧，你現在坐辦公室的財富真的是只靠操盤得來的嗎？許多人把股票包裝成能夠靠操盤致富，為什麼？因為這樣可以讓自己的神格化。操盤只能勉強我們，最終決定還是在成交量與資料分析。如果不是這樣的話，就應該懷疑他是不是透過零股交易（未滿十股的小規模交易）來刺激股票的。


