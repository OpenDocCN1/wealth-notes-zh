  md: '# 除權息相關事項


    透過除權息，我們就可以判斷這間公司是否真的有賺到錢。當然，不是所有賺錢的公司都一定會配息，所以這不能做為絕對判斷的條件。


    但是持續有配息的公司，有的甚至比銀行利息還高，這在基本分析上可以做為加分的條件。


