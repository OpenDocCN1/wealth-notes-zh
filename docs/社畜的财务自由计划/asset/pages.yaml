  md: '百元)。但是這當中，年薪1億元以上的人，「至少」都是四十五歲以上且在中小企業以上等公司任職的機率較高，大部分有兩名以上的孩子，住在蠻不錯的公寓，且有一台好車。


    不知道是不是因為現在補習費越來越高，根據社會地位高低，在教育上也要花更多心思。如果孩子送去私立幼稚園，包括各種費用後，一個孩子每個月花100萬已經算是便宜的了。但能只花100萬的話已經算是不錯了，如果再加上鋼琴、美術的補習費，一下子就會超過200萬，兩個孩子的話就是400萬元。再加上房貸、車貸、融資或其


    他生活花費，又得支出200萬元。在這樣的基礎上，即使每月看著點花，總共花費控制在450萬元，其實還要存200萬都很辛苦。就算年薪1億元，每個月存下200萬（約新台幣5萬元），一年也只能存下2,400萬，十年後也只有2億4千萬。


    應該會有人反問說：「透過複利十年至少也會有4億吧？」但我的回答是：「就因为這樣所以才賺不到錢。」


    十年之內孩子就會上大學，家裡面可能會有人生重病，也有可能需要搬家，十年的話連車子也到了該汰換的時間。


    會想到複利的人，通常假情況很樂觀，但是世界並非如此運轉。我們一定會發生不如意的事，所以看事情的角度要趨於保守，因為「意外」是人生中非常重要的事，我們要隨時保持準備。


    這個時代光靠薪資難以致富。我們所有人都明白，不要說是人'
