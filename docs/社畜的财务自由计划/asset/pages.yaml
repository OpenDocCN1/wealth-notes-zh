    # 一百二十日线


    一百二十日线反映的是半年来的平均价格。同理而知，两百四十日线就是为期一年，三百六十日线则是为一半的线。一百二十日线被视为长期均线，也被视为景氣线，因为股市比實際景氣超前半年，


