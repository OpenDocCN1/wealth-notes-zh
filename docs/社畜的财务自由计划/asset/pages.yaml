    「主力大哥們回來了。」


    股票討論版裡經常會看到這種發言。


    沒有，他們並沒有回來。各位口中的主力其實是個虛像，並不存在。交易了一千次也可能只會遇到一次你們口中聲望所繫的主力，而且遇到的這一次，散戶也會成為他們的姿分，絕對不可能賺到錢。


    讓我們重新整理一下何謂主力。


    +   賣出股票的散戶＋法人＋外資，整體稱為「主力賣超」，

    買入股票的散戶＋法人＋外資，整體稱為「主力買超」。


    +   股票下跌是因為主力賣超大於主力買超，

    股票上漲是因為主力買超大於主力賣超。'
