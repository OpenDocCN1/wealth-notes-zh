    # 社畜的路自由时光


    總之看到第二個綠框的部分，就可以發現第二次長上影線出現後，成交量雖然銳減，但是第一根陰線（黑K）離五日線間距太遠。不過第二根陰線（黑K）就跟五日線較接近，因此可以推測隔天很有可能大幅上漲，這個時候點就是派偵察兵出動的時候，接著再持續盯盤，等第二根陰線（黑K）突破前一個高點的時候再買進即可。


