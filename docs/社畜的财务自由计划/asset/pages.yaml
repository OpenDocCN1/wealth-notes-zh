    其是連推薦你這支股票的人都已經出場的話，那就請無條件停損。就算停損後股價上升，那也是沒辦法的事，只能埋怨自己在還沒準備好的狀態下就買了股票。


    情報買賣法必須小心的情況，就是推薦的當事人曾經任職在那間公司，因為他已經離開公司了，所以到手的情報可能已经不是第一手情報，如果遇到這種情況請無條件停損。


    還有，請銘記一件事。


    傳出好消息的公司，絕對不會在一天暴跌 5% 以上，好消息會以各種方式四處散播。一有人都會考慮此時或者保險出現時進場，因此股價絕對不會跌到 5% 以上。萬一這支股票一天內跌超過
    5%，請無條件減少一半的持有比重。


