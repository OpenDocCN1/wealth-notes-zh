  md: '# 1. 不想被薪資綁死，該如何獲得財務自由？


    # 百萬年薪就能成為有錢人嗎？


    年薪 1 億（約新台幣 250 萬元），這是每個上班族夢想中的數字。


    2017 年統計局的分析指出，大費民國的上班族中，只有大約 3% 的人年薪達到 1 億元。許多人為了實現年薪 1 億元的夢想對公司盡心盡力，拚了命的想要晉升或拿到獎金。為此不顧朋友、同事，甚至父母、兄弟姐妹之間的信用。


    但是年薪 1 億元，就能成為有錢人嗎？


    據統計指出，以 2018 年為基準，如果年薪 1 億元，扣掉各種稅金和支出後，實際上每個月只會入袋約 650 萬元（約新台幣 16 萬 2 千 5'
