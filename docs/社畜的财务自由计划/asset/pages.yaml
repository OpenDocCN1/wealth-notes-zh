  md: '![](img/28e73127539f4de4c136d9605847a1f7_215_0.png)


    如果這支股票有好消息，股價絕對不會出現下滑的趨勢。持續上漲或在底部拉盤的狀態下，才會有好消息傳出。假如你聽到小道消息的時候，線圖上已經漲超過底部的30%以上，請千萬不要買進。


    舉例來說，下面這種股票就是絕對不能碰的股票，而且這種線圖會出現負面消息的機率比較大。


    首先是新元綜合開發，這支股票有各種正面消息跟負面消息，但股價確實在公司發布一則小公告後急速下滑；這種線圖短強回的機率幾乎是零。


