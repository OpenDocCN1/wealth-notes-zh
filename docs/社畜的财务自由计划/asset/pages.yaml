- pgno: 77
  md: '日交易紀錄： Doosing Finc Tec (2017 年 5 月 16 日)


    對線圖所了解的常識中，很有可能都含有錯誤的偏見，光是我理解到這種事情，就足足花了兩年。對於初學者戶而言，我說說你們能理解的概率趨近於零。現在我們還處於學習基本分析的階段，請花心思寫註解：在基本分析中，我們能獲得什麼資訊吧。


    第二點：第二項中的住址也是我們要留意的部分。雖然 Doosing Finc Tec 的例子中，住址與股票上漲與否沒有關聯性，但事實上如果公司住址可以與概念股相掛上邊，也能帶來非常高。


    舉例來說，Paper Coree 這間上市公司因為在新萬金附近持有大規模的土地，每當新萬金開發消息出來時，總是會上看漲停板。


    # 股本變動


    對於上市公司而言，股本的變動非常重要。如果目前著手分析的公司有發生過股本變動的情況，一定要把變動的原因給找出來。如果股本增加的話，就是要以增資的方式進行，還是以債券的方式進行，如'
  merge: -1
  img_proc: true
- pgno: 78
  md: '果是減資的話、則要了解原因為何。如果公司發行了可轉換債券（CB, Convertible Bond）或附認股權公司債（BW, Bond with Warrant），一定要確認該公司的資本狀態。


    # 股票發行狀況


    上市公司在存續期間必須在章程中記錄發行股票總數，公司剛成立時所發行的股票數量也會一併記載。發行的股票總數不能高出成立時的四倍，為的是限制企業主不能無上限的不斷發行股票（編按：台灣企業的發行股票總數，須符合公司章程中所登記之資本總額的規範）。


    這部分重要的原因是，增資與減資只要看一眼就能明白。我們可以確定Decenting Fine Tec 曾經有增資過，但從未有減資的經驗，這也是表示公司很穩定的佐證之一。


    反之，如果是經常發行新股的公司，會建議各位盡可能不要碰，因為這有可能讓投資人重新注意股票市場勝過於公司內部經營。事實上，為了增資大量發行股票的公司，沒有一間有好結果。


    +   1.  Cb和BW都是由公司所發行的公司債，會根據規定的條件決定是否有轉換成股票的權利。BW只能以協議好的價格進行轉換，但是CB是可以根據轉換價值內的股價進行轉換。BW主要是針對海外投資人發行。'
