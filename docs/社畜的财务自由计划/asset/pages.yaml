  md: '寫到這裡，大家應該還是看不懂，如果想要寫到讓大家都明白，真的是可以足足寫超過一百頁，所以我們只需要先知道有這種投資方法存在即可。


    # 減資交易


    減資是上市公司中最負面的消息之一，因為資本額不足，所以也是被用來避免股票下市的方法。但是減資有時候也能被看作是好消息，因為減資已經是所有負面消息中的最後一步棋了。


    經過確切的企業分析，確認所有得不利都已透露出，減資已是最後一步棋的時候，最好可以在暫停交易的最後一天買進股票確保數量。減資買賣如果仔細說明起來也很複雜，我們就以實際案例來代表吧。下方是
    C Columned 的線圖，在底部減資後，股價上升了約三倍之多。


    下圖則是 Cubes 的表單，也是在底部減資後股價上漲約 30%。減資很危險，但是減資有很高的可能性是該公司的「最後一步棋」。原本的潛力股因為業績惡化＋股東配股現金增资，最後才會進行減資。因此①要確認股價已經在底部，②不利消息已經全部釋出，③在審計報告書沒有異常的月份（二到三月除外），才能進行減資交易。'
