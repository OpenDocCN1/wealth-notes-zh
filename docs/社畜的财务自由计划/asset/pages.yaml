  md: '# 你的投資目標是多少？


    ![](img/28e73127539f4de4c136d9605847a1f7_219_0.png)


    不管從尋股市還是房地產投資，都要訂出明確的投資目標，然後要針對你的目標明確定議出執行方案。假設我們希望用 100 萬或 1 億元，透過股票獲得每年 30%
    的報酬好了，那麼投資目標就是 130 萬或是 1.3 億對吧？聽起來很振奮人心吧？但其實現對各位的人生並不會造成任何影響。


    擁有 100 萬跟擁有 130 萬的生活品質都是一樣，還是會為了一、兩萬元緊張兮兮，也不能從月租房搬进傳買房。這個金額就算換成 10 億元也一樣，擁有 10
    億跟擁有 13 億也並沒有什麼差異。雖然有自已的房子跟夢想的車子，但是還是買不起江南區的一套房，也還是得去上班。你想要坐擁一套江南豪宅嗎？不管是 10 億還是
    13 億，甚至是 30 億都還是買不起江南豪宅，只不過擁有 30 億元的話，能夠擁有一點的房子跟一輛好一點的車子，僅止如此。


