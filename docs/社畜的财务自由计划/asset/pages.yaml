  md: '「哥是怎麼了？發生什麼事了嗎？怎麼臉色這麼差？」，小妹就把這時時日的事一五一十的告訴了他。


    「我們家三兄妹之間本來是沒有祕密的，是連個人煩惱都會互相傾訴的關係，只要聚在一起總是笑逐顏開，我們甚至有幾年的時間，還三個人一起住在一間小套房裡。我們住在一間逼屈房都散不出去的下半身，互相咒罵一顿後，為了活下去還是只好把鼻子塞在窗縫呼吸……哈哈哈。


    自從二哥考上註冊會計師後，我故意不提自己的事，而小妹也為了不想給剛步入職場生活的二哥太多壓力，對自已下了封口令。


    那天晚上從小妹口中聽到我的事之後，二弟在深夜跑來了新林洞，我們促膝長談分享了彼此的故事。「哥，你在這張紙上寫下你全部的負債吧，總體算起來大概是1500萬。


    二哥說，『就當作是我借給你的錢吧，以後你一定要還給我，所以你一定要收下』，等他一考到會計師，就會立刻把錢匯到我已经透支的帳戶裡。


    我的人生從此重新開始。


    我又開始有勇氣重新讀書，連出去社會工作的勇氣都拾回了。在這之後每当我遇到困難，只要回想那兩個月每天被催債，甚至希望自己能够死掉的日子，我就會渾身起雞皮疙瘩重新振作，這也成為了我每'
