  md: '周勝率必然會上升。2015年當時，我從平均庫存480萬升至1.5億時，周勝率是29.9%。


    # 吃早餐的三十分鐘，

    就能做好股票投資


    上班族最大的煩惱就是上班時間沒辦法看盤，因此才有很多上班族夢想著當專職投資人，又或是無可奈何只能繼續兼職投資。但是在做夢的時候就無法從股市獲利的人，就也算是當了專職投資人，我敢說他們能從中獲利的機率趨近於零。在職場間如果沒有每個月賺到至少比薪資高三倍以上的報酬，專職投資這種事連想都不用想了。


    接下來，我要告訴各位，我是怎麼每天工作十二個小時依然能投資股票，這個方法說特別算特別，但又不太特別。


    我只要手裡有股票，就會不自覺一直想看盤，對其念念不忘無法專心工作。所以我採用的是，前一天選好股票，在當天收盤以前持續買進，以「委買賣＋檢圖＋資料」（詳註：本書中作者多次提及「資料」一詞，視內文情境，有時指消息面＋基本面，有時則單指其中一項，後文出現時，會隨內文附註。）交易法，在隔天一次勝負。盡可能以「當天買進、隔日中午前賣出」為循環，我會盡量選擇即使隔天無法賣出'
