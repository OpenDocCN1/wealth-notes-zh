  md: '但是打造這個系統的方法，只要在網路搜尋「股票自動買賣 API」，與「股票 Telegram API」就可以找到很多人的研究結果，因為有很多人也跟我有同樣的想法，推薦各位也研究一下這個系統。


    但我想也許有人不知道什麼是 Telegram，這個通訊軟體聽平凡投資股票的人都會知道。就算是沒有接觸股票的人，在當初 KakaoTalk 傳出監聽事件（編按：韓國最多人數用的
    SNS 服務，在 2014 年左右曾經爆出，KakaoTalk 官方將通訊內容提供給檢查機關的爭議。2016 年，由韓國最高法院宣布這一行為違法）時，應該也聽聞過媒體都充滿著「我要移民去
    Telegram」這句話吧。Telegram 不會被駭客入侵也無法被監聽，除非是本人自己把手機交出去，而 Telegram 也像 KakaoTalk 一樣有電腦版。


    所謂的 API 則是 Application Programming Interface 的縮寫，指的是被使用在操作系統和應用程式之間的語言或訊息的協定。簡單來說，都屬於應用程式，而所謂的公開
    API，意思是允許應用程式的使用者可以按照各自的需求，將其程式重新撰寫。


    而我就是利用這個公開 API 的方式，結合證券公司提供的強大搜尋引擎與 Telegram，打造出了這個通知系統。下方就是驅動程式的畫面，因為我是在週末的時候構圖的，所以股票搜尋後面沒有出現相關資料。如果這個能夠拿到專利權，我倒是真的很想把這個程式商用化。


