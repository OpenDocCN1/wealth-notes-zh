  md: '子，接著二弟和小妹也依序有了孩子，再來我們也都有了車，然後現在我們都住在電梯大樓裡。


    我一直深信，是離開的爸爸很在意自己生前無法讓我們擁有這些，所以才在另外一個世界幫助著我們。因此每當重要節慶或是爸爸的忌日，我都會到爸爸安葬的追思公園禱告，然後向他撒嬌。


    「多虧了爸爸，我在股市裡賺了好多錢，但是如果想讓媽媽過上好日子還不是很夠。爸爸要替我好好新疝哦，只要來個十字漲停板，人生應該就會截然不同吧！」雖然二弟跟小妹都會說「夠了啦～～～」，叫我不要疝了，但是我們對這深信不疑。


    這和我是不是基督徒沒有關係，我相信這世界上一定存在著先祖的庇蔭，所以每次進行交易時，我都會新疝。'
