- pgno: 59
  md: '活的意思)


    跟電影《大蝦》中元斌所說的台詞很像吧？如果元斌說的是「live」，我們所說的就是「buy」。請成為一位今日買今日賣（或明日賣）的投資人吧，一定要成為一位最多只持有股票五天的短期投資人。


    上班族賬戶唯有這麼做，才有可能從扯平中逃脫。


    當然，如果股票帳戶規模超過 5 億（約新台幣 1,250 萬元）以上，就會出現一定比重的波段操作與長期投資。因為短線需要成交量多且委買賣充足的股票，但是這種股票不是每天都會有，而且賣出時必須要經過考慮，所以一支股票很難買到持有
    2 億（約新台幣 500 萬元）以上，一般來說手上的持股都不會超過 5 億。我自己平均來說，持有的股票介於 2 到 5 億以下，會保留 10 到 15 億元的預備金，因為金額較大，自然就會尋找房地產、債券等長期投資項目進行投資。但是帳戶金額未滿
    5 億元的人，只需要考慮短線即可。


    # 想在股市賺到錢，你得買「容易賣的股票」


    股票的核心是什麼？是「buy」還是「sell」？很會投資股票又是什麼？是買得好重要？還是賣得好重要？'
  merge: -1
  img_proc: true
- pgno: 60
  md: '這是股票界裡，為數不多的共同真理中的其中一項。


    # 股市的本質是「sell」


    假設我們持有 1 億元價值的 A 股票，隨著股價上漲雖然想出售，但是卻沒有人要買，就讓現有的股價已經 +10%，如果在委託上填上 1 億元，應該也會不斷下滑到跌停。這樣做不行，那樣做也不行，結果就是在理想的時間賣到理想的金額，最後以虧損結尾，這是很常見的案例。俗話說「玉不琢，不成器」。不管股票再怎麼漲，如果獲利無法實現的話就沒有任何用處。所以為了獲利，不要去買好的股票，而是要去買「好賣的股票」。嘴上回答「股票的核心是
    sell！」，但是戶頭裡卻有五到十支股票的人，就是一個什麼都還不懂的股票新手。不管你再怎麼說自己是長線投資，你的帳戶裡還是充滿了「大雜燴」，這樣的人是無法成為價值投資人的。不管你是不是專職投資人，如果你賺的比你上班還少，每天過得心驚膽顫，就不能成為專職投資人。同樣道理。


    如果你認為買進好股票才能買得好，也就是站在 buy 方法的散戶們，你可以立刻把股票視窗關掉，然後直接去百貨公司，裡面有很多品質很好的商品。在那裡買的東西，至少以後還能當二手品賣掉，有些情況下，搞不好買二手的價格還比原價高。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '就像我前面提過的，韓國股票是在轉型市場內漲跌，散戶獲得消息的能力無從跟法人與外資比較，所以我們才需要短線。法人與外資的錢基本上接近無限，因此買優良股票並沒有錯。他們在KOSPI（韓國綜合指數）突破兩千三百點大關的現在，只需要挑選指數良好的股票進行投資即可。因為資本額夠大，一年就算只有30%的報酬，也能夠賺到驚人的金額。法人與外資的目的只是要賺取比利息更高的報酬率罷了。如果你是散戶，但是有10億（約新台幣3,500萬元）左右的資本額，可以進行價值投資或長線投資，就算一年報酬率只有10%，一年也能賺到1億元，很不錯吧。


    但是這本書是為了那些目前沒有太多資本，又希望能讓人生翻身的上班族散戶所寫。我們一年裡至少要有100%以上的報酬，才有可能稍稍抓到成為有錢人的那條線。如果想在前購買一套房子且不貸款的話，一年就必須要有300%以上的報酬。


    為了能創造出如此的報酬，我們需要三點原則。


    +   ① 最容易賣的股票。


    ② 要像守護自己的生命般，守護自己所訂定的停損點。


    ③ 漲停板不屬於我，就算只有賺100塊也要賣。


    只要好好堅守這三點原則，周轉率就會大幅提升。採用短線的話，'
