  md: '# 前言

    我邊上班邊鼓舞，三年賺進三十億


    我這本書是從2017年春天開始撰稿，不知不覺就這樣過了兩年，這當中我個人也有了很大的改變。2017年時，我辭掉原先遊戲公司的工作，轉到了其他公司，現在開始靠自己獨立創業。2018年冬天，與家人去歐洲旅行幾週同時，我也曾試著一邊旅行一邊操盤。


    因為這本書經過無數次的補充與修改，我必須先告知各位，文章的時序會多少有些混亂。我在撰寫原稿的時候，是像擼一樣把每次操盤的狀況記錄下來，並沒有按照順序撰寫。這是因為還我還在上班的時候，我就開始撰稿，而且一開始的出發點是寫給上班族投資人看，所以站在上班族的立場所敘述的內容，我還是維持當下的時間點來撰稿，必要時加上附註。隨著時間的經過，有些書中的股票也已經被下市或暫停交易，但因爲我希望讓各位看整個投資過程，所以仍然把這些內容保留下來，希望大家能夠了解這點後再閱讀本書。


    二〇一九年一月

    遊牧民


