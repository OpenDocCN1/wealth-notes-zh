  md: '# ◎堅守停損原則


    # ◎誠心祈禱


    # 賺到錢就慶幸不要再續買出股票


    股票名言裡有句話說：「買進是技術，賣出是藝術」。


    這句話也就是說，買進的時候我們可以依照各種理論和經驗，創造出相同的買點，但是賣出的時候就取決於自己了。但仍然有很多新手會問：


    > 「所以什麼時候要賣出？」


    > 「我抓不到測出的時間點」


    這些話都沒有意義。


    就算只賺到 100 塊也要賣出。我到目前為止每個月的平均報酬率維持在 20%。我從 500 萬元開始投資，每個月都有 20% 的報酬，那麼三十六個月後，也就是三年後會有多少錢呢？總共是
    297 億元。從前面 NuanceCall 交易中可以看到我的報酬率在 2% 左右，但是報酬卻超過了 4,000 萬元。


    思考一下你為什麼要投資股票吧？是為了要買一支好股票嗎？不是的，你是為了要賺到錢。那如果想要賺到錢，你應該要怎麼做呢？把股票賣掉。而我們卻忽略了這簡單的原理，相信自己那不知打哪來的『靈感』而一直不想賣出股票。'
