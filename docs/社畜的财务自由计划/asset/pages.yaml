- pgno: 12
  md: '在股票市場裡，賺錢與不賺錢的人只是在觀念。市場上有無數的上班族股票帳圖和技術分析等投資書籍，解釋投資觀念的書籍也有不少，我認為沒必要便是在其中又多寫一本毫無差別的書籍，所以我打算在這本書增加幾項差異。


    第一，整個人上班族短線投資為觀點著筆。


    大部分的股票投資人想一鼓作氣操作短期、中期、長期投資，導致投資的規模變得非常大，就像是「數學公式」一樣，往往成為一本永遠讀不到結尾的書籍。投資人的唯一觀點只有一個——報酬！所以這本書我想整理出以短期投資為出發點，所必要的所有情報。


    第二，態度比方法更重要。


    我會盡量減少財務報表、線圖、技術分析等相關的內容，這並不是說我們不需要閱讀這樣的書籍，而是因為市面上已經有很多相關書籍了。如果想要成為好的投資者，就必須要努力學習，請各位盡量透過其他書籍去吸收技術分析所需要的相關知識。這本書我希望是以我自身的經驗為基座，告訴上班族投資的正確方式與累積能力的方法。


    更重要的是，因為我自己閱讀過很多會引導投資人走向投資失利的書籍，所以我想導正各位錯誤的投資劉觀念。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '第三，只談論我親身的經歷。


    既往的股票相關書籍大部分都比較側重於理論，但是真的說起來，卻沒有書籍是以實際案例為重點，告訴讀者如何將理論應用於實際交易。老實說，我認為很多書籍就只是些話術而已。所以我會記錄自己實際交易的詳細過程，並且公開我的帳戶，以「直播」的方式撰寫本書。


    這本書我會逐一把破那些認為股票是賭博的錯誤刻板概念，並且讓各位了解，如何利用新聞或公告這類所有人都可以輕鬆獲得的消息，將它們與新聞做連結。我大部分提及的都是最近當天、最長五天內就能獲利的股票，短打是賭帽交易類似的作法，另外我也會稍微討論到概念股。（概念股到底是不是一種賭注？大家會害怕概念股的原因，就是因為把概念股視為價值股，並且期待有的關係。）


    總而言之我最強調的就是，埋頭苦幹的學習以及經驗的積累。請各位想像一下，假如讀過好幾十本梅西和 C 羅（編按：為為國際知名的足球明星）的足球技術教學書，就能把足球踢得跟他們一樣好嗎？不可能對吧。他們的實力除了技術以外，基礎的體能訓練、使用技術的時間與感知也佔據很重要的地位。不管是哪一方面，只單靠技術一定不夠，必須要能加以實踐，才會成為我們真正的知識。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '對於股票投資，我要告訴大家一句真理名言，我自己也是經歷無數次失敗後，才真正體會到這句話的價值。


    > 「大家都知道的好情報就是壞情報」


    這是一句打破刻板觀念的名言。如果這本書能夠幫助你體會到這句話的真諦，那就是盡到它的責任了。所以本書在前面的部分幾乎沒有討論到技術性的內容，大部分的篇幅都放在批判錯誤的刻板觀念上。


    請稍安勿躁，初學者如果急於學會操作，只會傾家蕩產。請從零開始，相信我的親身經歷，從頭到尾依序閱讀。


    我出書前特別謹慎注意，股市當中沒有所謂的絕對，所以寫在這本書裡面的內容，也不可能只有成功沒有失敗。各位讀者讀過這本書後，如果投資成功，對我並沒有影響；但是萬一投資失敗的話，我就很可能招來怨聲連連。當然，即使各位按照我的方法操作，還是有可能會投資失敗，但是我認為成功的機率應該會比較高。在我體驗過每天被信用卡公司不斷追債，連喝一杯現磨咖啡都要猶豫不決的經歷後，我真的為了讓自己財務自由，而付出很多努力，所以與此同時，我也想幫助世上為錢而苦的人們。


    我用盡全力撰寫人生的第一本書，希望閱過這本書的上班族投資人，都能夠擺脫仰賴薪資維生的日子，獲得財務自由。'
  merge: -1
  img_proc: true
