  md: '這本書完全是依據我的經驗所撰寫而成，所以會使用我實際帳戶的截圖來撰寫，因為我想要表達，上班族也可以透過短線操作獲得高報酬。股票世界裡高手很多，騙子也很多。當我遇到奇怪的人說荒唐的話時，也會自然脫口而出「拿出你的存摺來看看」這種話。雖然即便我以此為證，還是會有很多人無法相信，說我造假之類的，但是對我而言，這極致只是想傳遞最起碼的信任。其中我的帳戶號碼與真實姓名會進行遮蓋處理（只留下最後一個字）。


