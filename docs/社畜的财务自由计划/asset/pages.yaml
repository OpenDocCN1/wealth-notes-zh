- pgno: 118
  md: '# 6. 投資人必懂的

    三大指標


    不會英文的人總是買一本厚厚的文法書，以為自己英文不好是因為學會文法。股票也是一樣，越是股市新手，明明對於均線、RSI、MACD 等指標不太熟悉，卻又很關心這些輔助指標的趨勢，然後誤以為要找出藏在其中的機密，才能夠成為股市高手。但是這些都是錯覺，股市上所有的指標都不過只是後行情態與輔助指標，只是用來做爲預測的參考資料而已。


    獵圖分析非常重要，但也不能把一切都賭在獵圖上。雖然不知道這個階段各位能不能理解，但是其中我們最主要看的：第一是成交量，第二是獵圖，最後才是資料。教導我股票的老師，他的實力在股票界裡備受肯定，包括他以及其他股票高手們，會看的股票指標只有兩項，就是均線（移動平均線）與成交量。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '把其他指標當作是主要指標的人裡，應該沒有人敢公開自己的帳戶明細，他們只不過是要耍嘴皮子的「嘴上高手」而已。要迷惑新手最好的方法，就是大量使用他們從來沒聽過的專業術語；再告訴他們「只要你看某指標，你也能成為股市高手！」藉此騙取高額的人會費。千萬不要被這些人騙了，這些技術分析的部分，等到我們完成基礎節能訓練後再學也不遲。我為了使本書更加簡潔，所以盡可能避免寫網路上搜尋得到或是市面上書籍已經收錄的內容。也就是說，我認為基礎節能，也就是做好心理建設這件事，是對未來而言最重要的事，所以到目前為止請各位先不要著急。


    我希望各位不要心心急念，一直記掛著操盤與輔助指標，但也不是說就可以完全不去了解它們。在這個章節裡，我們會學習各種指標中務必了解的其中三項指標，也就是支撐和壓力、成交量以及均線。


    # 第一個指標：

    支撐與壓力


    支撐與壓力是強化基礎節能最重要的知識，也是一定要搞懂的部分。99%的股票都可以套用在支撐與壓力之上，所以請務必熟悉這個指標，將其應用在每一支股票上面。'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# CASE STUDY HamblisSoft


    我們將透過 HamblisSoft 的實際案例來了解支撐與壓力。下圖一號與二號的地方可以看出，股價大約到 5,900 元的時候都獲得強力的支撐，然後重新反彈，扮演了支撐前一個低點的角色。一旦股價跌破支撐線，這條線就會成為強大的阻力，也就是說，當股價跌破了難以跌破的支撐線時，這條支撐線日後就會變身為阻擋股票上漲的壓力線。


    讓我們再繼續看下去。雖然先前在一號與二號的時候，5,900 元是最後的支撐線，但是自從股票跌至 4,000 元後，就無法再度突破 5,900 元的壓力線。請看三四五號，股票在
    5,900 元的線上連續幾次被阻擋，


    ![](img/28e73127539f4de4c136d9605847a1f7_120_0.png)'
  merge: -1
  img_proc: true
- pgno: 121
  md: '這條線分擔著強大的壓力線，成為了一套HabisSoft跌破無法上漲的原因。


    PS.2018年2月畫新回來複習HabisSoft，發現即便HabisSoft搭上強勢的虛擬貨幣概念股，但仍然無法突破此壓力線。


    我除了看到六號點位的橫向線以外，也會看最高價與最低價碰到的線，最神奇的是支撐與壓力這兩個作用會不斷輪替，一旦形成了支撐線就很難跌破。但假如一旦跌破，成為壓力線後就很難再突破。


    請大家交易時，務必要銘記在心。


    +   - 買進時要先確認股價不會跌破支撐線

    - 賣出的時候，要在股價無法突破壓力線後跌

    - 這兩句話要當作咒語般烙印在腦海裡，如此一來才能大致估算買賣與賣出的時間點。但除了上述這兩個原則以外，還有另一點需要注意。


    ④ 強力突破壓力線時的買進點'
