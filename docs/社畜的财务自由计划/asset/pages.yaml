    # 像鍛鍊肌肉一樣，從小筆交易開始練習


    投資股票意味著什麼呢？這是一件會為自己的人生帶來變動的事。薪資非常穩定，變動性非常低。如果以定存利息來算，一年也就只能感受到 2% 固定利息的變動。但是股票如果波動大一點的話，一天之內可能會在正負
    30% 上下。這一點非常吸引人，但相較之下也蘊藏著同樣的風險。所謂的變動性就是風險。


    剛開始投資股票的人，看到股價上漲且帳戶裡的錢瞬間增加的時候，就會開始想像自己已經是一位成功的投資人，而且還擁有江南房子（按注：韓國首都首商用房價極幸地段）的樣子，為此感到幸福。自信心會隨著帳戶裡增加金額的比例一起水漲船高。相反的，當股價下跌就會感到莫大的挫折感，帳戶總會跟自己信心'
