- pgno: 204
  md: '讓我們來看 HLB, 這是 Telegram 通知我的股票之一。


    Telegram 發資訊給我的時候是下午, 如果我在當時於八日線附近買進, 就能獲得不錯的報酬。


    透過與 Telegram 連動不僅非常有效率, 還能體會到什麼叫做真正的上班族買賣法。但是重點是在於, 你能不能夠自己打造出一個系統。現在我所使用的系統,
    因為是我自己設定的, 所以我也是唯一一位使用者。我之所以沒辦法把這個系統商業化的原因, 是因為我不是專業技術人員, 沒有自信能夠做到系統的除蟲與更新。


