    # 財務狀況


    檢視耐克過去五年的財務表現，可以理解公司一直保持著相當穩定的成長步伐，二〇一一到二〇二○年的平均營收成長率為七％。不過二〇一六年的營收成長率從二〇一五年的○．八％下滑到五．八％，顯著的下滑幅度嚇壞了投資人，股價也應聲下跌。公司管理層立刻採取應變措施，致力於創新，並改變行銷策略，以年輕人與女性產品市場為目標，同時積極發展網路銷售平台。此舉讓公司的營收又逐漸重返正常軌道，股價也重新振作。


    對穩健成長型的公司來說，如何保持獲利能力是最重要的目標。耐克的品牌優勢，使它在競爭激烈的環境下仍可維持產品售價。加上紡織材料隨著科技而逐漸改良，產品價格跟著上漲，盈銷費用控制在總收入的三成左右，毛利率與營業利潤率即便在營收成長趨緩時也能保持穩定，過去十年的毛利率一直維持在四三至四六％之間，營業利潤率幾乎維持十三％以上，是相當優異的表现。


    不僅獲利表現穩定，耐克的現金流也保持穩健增長趨勢。近幾年由於公司的營運重'
