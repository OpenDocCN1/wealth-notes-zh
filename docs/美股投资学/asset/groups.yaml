    3）。若是資金規模較大的投資人，也可以將資金進行分散配置，降低風險。


    那麼，該如何查詢券商是否為美國合格登記的券商呢？投資人可以至「美國金融業監管局」（The Financial Industry Regulatory Authority,
    FINRA）網站或「美國證券投資人保護組織」網站的會員名冊進行查詢。


