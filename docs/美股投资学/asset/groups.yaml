    ## 第 13 章 股價型態判讀：順勢追高或逢低布局


    在了解移動平均線與趨勢線之後，股價型態判讀就相對簡單多了。這一章將介紹常見的基本股價型態，讓讀者可以更快地理解這些型態所代表的意義，以及可能引發的後續走勢。


    常見的型態包括「整理型態」與「反轉型態」。在上漲的過程中，由於有些投資人會先獲利了結出場，有些人會在中途買進加入，一買一賣之間就會形成股價的區間震盪，市場上多空呈現拉鋸，等待下一波走勢的發動，繼續過去的走勢，這就是「整理型態」，例如箱型整理、三角形整理或旗型整理等都屬此類。


    而「反轉型態」則是股價的趨勢即將有重大轉折，由於趨勢的變化不會一夕反轉，有可能經過幾天、幾週甚至幾個月的洗盤，最後才終於反轉向下突破。所以，理解基本的股價型態，能幫助我們就反轉型態的特徵預先辨識警訊，避免確認反轉後蒙受重大的損失。


    ### 圖 36 箱型整理


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_216_0.png)


    ### 整理型態：箱型整理的漲跌趨勢觀察


    如前所述，整理型態是指股價在一個固定的價格區間上下震盪，沒有走出明確的方向。在這個區間內，股價的上線壓力與下緣支撐，各自可以繪製出一條水平線，形成像「箱子」一樣的四方形，故稱為「箱型整理」。此時的股價正在進行盤整，消化凌亂的籌碼，多方及空方的角力拉鋸，等待走出一個明顯的趨勢。


    如何畫出箱型型態呢？只要連接每個高點畫出上線壓力線，以及連接每個低點畫出下緣支撐線，就會呈現一個盤整型態。如果股價大幅突破箱型整理，代表買進訊號；如果股價跌破箱型整理，則代表賣出訊號（參圖
    36）。


    箱型整理有可能出現在價格的低檔或高檔，但也會出現在股價的發展過程，因為股價在上漲與下跌時不可能一路飆漲而不經過籌碼的整理。每當上漲到某個程度，通常會發生籌碼換手的情況，形成短期的平台整理。這時賣方代表對該股票的供給量，買方代表對該股票的需求量，決定股價未來的走勢發展。


    如果想要賣出股票的人多於想要買進股票的人，也就是供給大於需求時，股價便開始下跌。當股價跌破整理區間的下緣支撐，市場上其他投資人也會跟著拋售股票，驅動股價有更明顯的跌勢。


    相反地，如果想要買進股票的人多於要賣出的人，也就是需求大於供給時，股價便開始上漲。當股價突破整理區間的上緣壓力，市場上其他投資人也會跟著追捧股票，驅動股價有更明顯的漲勢。


    以星巴克為例，二〇一五至一八年經歷了相當長時間的整理區間，股價上下震盪，沒有明顯的突破發展。直到二〇一八年底，由於財報利多驅動股價上漲，帶量突破後才啟動一波強勁的上漲。也因為之前盤整的時間長，上漲幅度會更大，每股從六十五美元上漲到快一百美元，不到一年時間漲幅超過五〇%（參圖
    37）。


    另外是股價高速發展中的箱型整理，例如二〇二〇年疫情爆發以來股價上漲超過七倍遠距會議軟體「Zoom」，在經歷第一階段上漲後開始進行橫整整理，籌碼的消化與緊接而來的財報利多，啟動了股價的第二波飆漲（參圖
    38）。


