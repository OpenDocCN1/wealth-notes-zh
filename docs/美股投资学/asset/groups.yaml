    # 第 18 章


    # 生活美股：行


    汽車業新戰局，角逐新能源商機


    生活股中「行」的部分，包含了過去的傳統汽車行業、汽車修繕零售等公司，這些公司過去曾是輝煌一時的成長股，例如通用汽車與福特汽車（Ford Motor Company，美股代號
    F），卻因為科教創新帶來的產業變遷開始衰退，正努力轉型成為未來的轉機股。


    接下來會以目前新興產業的公司做介紹，包括新能源車與共享汽車，讓讀者理解一個舊時代產業被顛覆需要的條件，以及在研究這些公司時需要注意的關鍵數據，找到未來產業中的領導者。


    # 一年上漲七○○%的飆股：特斯拉


    汽車行業正在產生新的變化，特斯拉（美股代號 TSLA）的崛起宣告電動車時代'
