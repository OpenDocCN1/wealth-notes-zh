    # 年度經常性收入


    相較於網飛這種企業對消費者的商業模

    式，如果一家訂閱經紀公司的商業模式屬於「企

    業對企業」（B2B）的訂閱經濟公司，這時就

    應該去檢視公司的「年度經常性收入」。顧名思

    義，「年度經常性收入」就是會經常發生、公司

