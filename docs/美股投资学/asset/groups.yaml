    # 財務狀況


    八年三月以來，股價由谷底反彈，漲了一倍有餘，證明尼可確實做得不錯。


    觀察Circle十年的財務報表（參表49），除了二〇一五至一六年因食安風暴而造成營收大幅下滑，其餘時間都保持相當穩健的成長。最近十年營收平均每年成長十四%，每股盈餘平均每年成長十二%。


    在未發生食安風暴之前，Circle是一家成長性相當優異的公司，每年都有超過二○%的營收成長率，基本上比許多科技股都優秀。除此之外，公司的獲利能力也相當好，毛利率持續維持在二六至二七%，營業利潤率也維持在十七%左右。食安風暴後，公司努力進行補救，雖然至今獲利能力尚未回到過去的水準，但未來仍有進步的空間。


    尤其Circle一直以來都沒有負債，現金資產充足，即便遭遇新冠肺炎疫情，也有相當堅實的基础可以從容度過，股價在二二〇〇年以來上漲超過六〇%。


