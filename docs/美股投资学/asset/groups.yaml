    # 第 9 章 現金流量表的重點觀察


    最後但同樣也很重要的財務報表，就是現金流量表。現金流量表之所以重要，在於當公司的營收快速成長時，它可以幫助我們重複確認公司損益表結算出來的獲利方向，究竟是流入了資產負債表中的現金資產，還是流到了其他地方。


    在現金流量表中，「營運現金流」、「投資現金流」、「融資現金流」和「自由現金流」是四個必須關注的重點。


    ## 營運現金流


    所謂營運現金流，是指公司在一定期間內本業所賺到的營收，扣除非現金項目所剩餘的金額。算法是這樣：將損益表結算出的淨利，加回未實際流出現金的項目（例如折舊與應付費用），再扣除未實際流入現金的項目（例如應收帳款與存貨），得出的數值就是營運現金流的部分。


    營運所產生的現金流愈高，代表公司將獲利轉化為現金的能力愈好。拿營運現金流的數值與營收、獲利等數值進行比較，如果之間呈現正向且匹配的關係，代表公司的營運狀況良好，競爭優勢也愈強。反之，如果今天公司擁有很高的營收，卻沒有相應的營運現金流入，就應該去檢視公司是否有美化財報的嫌疑，或是為了業績而讓客戶赊欠，最後衍生出呆帳的問題就不好了！


    ## 投資現金流


    所謂投資現金流，是指公司在一定期間內支付與投資有關的活動所花費的現金，活動包括購買不動產、廠房與設備、投資或出售有價證券等。為了賺取未來的現金流，所有的公司都應該持續進行有生生產力的投資，所以投資現金流通常是負值。


    投資對於公司來說是現金的流出，卻是不可省去的必要支出。試想一家不從事投資、不進行擴張的公司，又要如何創造成長呢？也因此只要公司的投資現金流穩定，現金流狀況就相對健康。


    ### 表 44 蘋果公司的現金流量表


    | | 2020 | 2019 | 2018 |

    | :--- | :--- | :--- | :--- |

    | 營業現金流（百萬美元） | 80,674 | 69,391 | 77,434 |

    | 投資現金流（百萬美元） | -4,289 | 45,896 | 16,066 |

    | 融資現金流（百萬美元） | -86,820 | -90,976 | -87,876 |


    資料來源：蘋果公司年報


    ## 融資現金流


    所謂融資現金流，是指公司為了營運，將對外進行籌資活動所獲得的現金，包括發行債券、貸款，扣除股票回購、支付股利所支出的現金計算而成。融資對公司來說就是現金的挹注了，在低利率時代藉由融資來做更積極的商業布局，對資本運用得宜的公司來說是相當大的優勢。


    以蘋果公司為例，從公司年報（參表 44）可以觀察到，二○一九年的營業現金流入下滑，主要是因為營收衰退所造成，但是在二○二○年的營業現金流入又增加到八○六．七四億美元，較前一年成長了十六%。投資現金流的變化則是公司的收購支出、但是蘋果的理財能力也相當優異，投資有價證券的獲利讓公司的投資現金流總金額是正值。最後一欄則是融資現金流出增加，由於蘋果公司的現金資產相當充沛，所以支付鉅額股息與回購數量相當多的自家股票，融資現金流的總金額為負值，將現金以不同的形式回饋給股東，對股東來說是相當開心的事情。


    ## 自由現金流


    自由現金流是一個非常重要的項目，表示公司可以自由地支配現金。一間好公司的資本配置能力對未來的成長有著巨大的影響力，讓它們可以再發揮更大的價值。公司也可以用這些現金來回購股票、支付股息，等於把現金回饋到股東身上，提高股東權益來驅動股價成長，好處多多。


    在表 45 中，可以看到蘋果公司在二〇二〇年的營業現金流為八○六‧七四億美元，扣除資本支出七三‧○九億美元後，仍有超過七三三‧六五億美元的自由現金流可以運用。充沛的自由現金流讓蘋果公司在回購了超過十億股的自家股票，並且將每股的股息從○‧七五美元調升至○‧八美元，成長了六‧七％。


    ### 表 45 蘋果公司 2020 年營業現金流


    | | 2018 年9月 | 2019 年9月 | 2020 年9月 |

    | :--- | :--- | :--- | :--- |

    | 營業現金流 (百萬美元) | 77,434 | 69,391 | 80,674 |

    | 資本支出 (百萬美元) | -13,313 | -10,495 | -7,309 |

    | 自由現金流 (百萬美元) | 64,121 | 58,896 | 73,365 |


