    ## 未來展望


    秉持不僅是賣商品，而是賣一種熱愛瑜珈的生活方式，Lululemon 成功樹立了獨特的品牌文化，也吸引了一群死忠的消費者，包括未來的消費主力 Z 世代對品牌的認同度極高，可帶動未來的銷售成長。


    除此之外，Lululemon 會加快進軍國際市場的腳步，而亞洲市場是未來的發展主力，二〇一九年在亞洲地區開設了二十四家新店面，高於北美的十九家，國際市場的營收比二〇一八年成長了二二%，也高於北美市場的二〇%，成長潛力值得期待。


    相對於台股公司較缺乏國際品牌的公司，反而更多的是為國際品牌代工的公司，雖然擁有優秀的技術與經營管理能力，卻無法讓股價有爆發性的成長。反觀美股，許多知名的國際品牌股價長期趨勢向上，在企業進行數位轉型的過程中，更讓傳統大廠的股價重新注入活力，激勵股價創下歷史新高，是台股所不能及的。若對美國上市的運動股有興趣，可參考其他相關公司，如
    Skechers (美股代號 SKX)、Under Armour (美股代號 UA)、Ralph Lauren (美股代號 RL)、VF Corporation
    (美股代號 VF) 與 Fossil (美股代號 FOSL)。

