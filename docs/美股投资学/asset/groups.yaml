    # 美股息的分發


    美國股市中有許多值得長期持有的好公司，由於營運穩定，現金流也相當充沛，通常每年會以股息或回購股票的方式，將這些現金回饋給持有公司股票的股東，讓股東除了享受長期股價上漲的資本利得外，還可以獲得股息連年成長的好處。


    一般來說，美股中絕大多數的公司都是「每季」配息，一年配發四次股息，甚至有些公司是「每月」支付股息給股東，讓投資人每個月都有一筆額外的現金流可領。因此，如果投資人想要參與股息，應該留意公司所公告的四個日期，請參考表
    6。


    其中最需要關注的日期是「除息日」。想要領到每季（或每月）發放的股息，投資人必須在公司的除息日之前買入股票，如果不小心在除息日之後才買入股票，則必須等到下一次的除息日才能領息。'
