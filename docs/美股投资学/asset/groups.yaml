    觀察圖 9，其中的「當前剩餘績效義務」（Current RPO）是指十二個月之內即將完成的合約內容，而「非當前列餘績效義務」（Non-current RPO）則指十個月之後才會完成的合約，整體剩餘績效義務的走勢呈現穩定上升趨勢。不過當「非當前列餘績效義務」積壓太多的時候，就需要注意後續是否會有訂單大幅流失的風險。


    ## 競爭對手與未來展望


    在目前的客戶關係管理軟體市場當中，市占率排名前五名的公司分別為 Salesforce、SAP（美股代號 SAP）、甲骨文（Oracle，美股代號 ORCL）、Adobe
    與微軟。就軟體市場來看，Salesforce 軟體是目前發展最快速的企業軟體類型，占全球企業軟體市場總收入的四分之一。二〇一八年，全球企業在 Salesforce
    軟體的支出成長了十五·六%，達到四八二億美元。而目前這樣的成長態勢仍在進行中，預計到了二〇二五年會成長到八百億美元。


    由於 Salesforce 很早就採用訂閱制的商業模式，在這個領域已具有規模優勢。加上公司積極併購，在二〇一九年斥資一五三億美元收購數據視覺化軟體 Tableau
    後，二〇二〇年底又宣布以二七七億美元併購通訊軟體平台 Slack（美股代號 WORK），整合產業中的公司，並為顧客提供更全面的服務，不斷地透過新增的業務功能吸引顧客購買，同時也降低了營運成本，進而增加獲利。尤其在加入道瓊成分股之後，絕對是不容忽視的雲端王者！


    ## 人資管理軟體，優異的高速成長股

    ### Raycom


    Raycom（美股代號 PAYC）成立於一九八八年，是一家提供人力資本管理（Human Capital Management，HCM）服務、成長相當快速的「軟體即服務」公司。二〇一四年公開上市，在二〇二〇年一月二十八日納入標普五百的成份股。


    相較於 Salesforce，Raycom 的業務單純許多，鎖定員人數介於五十至五千名的中小型企業，提供顧客從招聘人才到人員退休的整個就業週期，包括員工招聘、薪資管理、勞動力管理與優化員工績效等業務部門，最大的收入來源為薪資單處理。截至二〇一九年底，公司擁有超過兩萬六千五百名客戶，並且享有極高的客戶滿意度，每年的客戶留存率皆超過九〇%。


    ### 主要業務


    Raycom 的業務範圍涵蓋下面五個主要部門，建立統一的系統來整合並管理員工資料庫，簡化一切與人力資本有關的流程，提高工作效率。


    - 一、薪資單：這是 Raycom 最大的營收來源，提供薪資付款解決方案，計算薪資並定期向員工進行轉帳。

    - 二、人才招聘：尋找可以為公司創造最佳績效的員工，提供雇用與到職的流程規畫。

    - 三、人才管理：企業內部的培育訓練規畫，將績效與薪酬連結，提高員工滿意度。

    - 四、人力資源管理：自動化文件與任務管理，即時的數據交換與文件簽核，讓工作妥善分配勞動力。

    - 五、時間與勞動管理：利用軟體功能來追蹤工作流與出勤時間，提升工作效率與


    ### 財務狀況


    Paycom 的收費方式是按照「企業支薪的員工數量」去計費。雖然中小企業的員工數很少，但美國的中小企業數量其實相當多，而 Paycom 選擇從這個市場出發，不與行業中的領導者直接競爭是相當聰明的選擇。


    在二〇一〇年時，Paycom 的營收僅五千七百萬美元，到二〇一九年已經接近七．四億美元（參表 23），營收成長相當快速。驚人的是，最近五年的營收平均每年都成長三七．四％，符合高速成長股的特質。


