    # 財務表現


    正式來臨，成為所有車廠未來的研發主力、兵家必爭之地。除了電動車產業的蓬勃發展，無人機、無車人事與共享經濟也因為科技的進步而逐漸發展成熟，投資人應先做足準備，把握未來的趨勢。


    成立於二〇〇三年的特斯拉，總部位於美國加州，致力於生產電動車、推廣電動車市場的發展，以及銷售太陽能板，是一間垂直整合永續能源的公司。


    由於創辦人伊隆·馬斯克（Elon Musk）的獨特領導魅力，加上公司所掌握的技術優勢，對於特斯拉的行銷大有助益，所生產的 Model 3 持續保持在最暢銷電動車排行榜的首，訂單與營收持續成長。在特斯拉坐穩電動車市場的領導位置，且證明公司的商業模式可以獲利後，也讓許多新創公司加入市場，帶領產業進入高速增長的階段。


    在評估這類型公司時，必須關注公司的營收成長，包括車價以及交付數量化的影響。汽車業屬於重資產產業，需要高額的資本支出，因此資產運作效率的狀況是評估的指標之一，運作效率愈高，獲利能力也就愈好。此外，還需關注經濟環境的變化，當景氣不好時，汽車這類耐久財的需求就會下降，進而影響到營收表現。


    特斯拉電動車的營收自二〇一〇年的一·一七億，成長至二〇一九年已達二四五·'
