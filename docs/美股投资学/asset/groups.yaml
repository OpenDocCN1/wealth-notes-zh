    # 競爭對手


    目前美股中上市的營運數據中心的REITs共有五家，包括Equinix、Digital Realty、CoreSite（美股代號COR）、QTS Realty
    Trusts（美股代號QTS）與Cone（美股代號CONE），其中Equinix與Digital Realty分別為產業市占第一與第二大的領導者，數據中心數量多且覆蓋範圍廣，是其他競爭對手難以超越的競爭優勢。


    # 未來展望


    根據Research and Markets的統計，全球數據中心託管的市場規模將在二〇二〇到二〇二四年間增長二三〇．九億美元，平均每年的成長率達十二％。大型數據中心營運商的成長，主要是透過持續購買資產與併購策略來擴大營運範圍，擁有更龐大的規模優勢來鞏固未來營收的持續性與穩定性。


    Digital Realty在最近幾年也一直積極進行併購與建立合作夥伴，二〇二〇年第一季以八十四億美元的價格收購歐洲數據中心營運商Interxion，之前曾以高價收購巴西數據中心營運商Altice，與同業Digital
    Land Technology（美股代號DLR），二〇二一年在香港的數據中心也將完成，將有助於加強國際市場的地位與鞏固競爭優勢。


    由於觸角延伸到世界各地，也讓大型租戶更願意與Digital Realty簽訂長期租約。這類數據中心託管REITs的租約通常較長，租戶轉換與退租的機率較低，簽訂之後搬遷的機率也低，讓公司的營收穩定成長。不管是從產業的基本面或分析企業體質，都可以看出Digital
    Realty是一家能夠持續維持成長的公司。


    若對美國上市的住房股有興趣，可參考其他相關公司與ETF，如Webster Financial（美股代號WEB）、Regent Realty Trust（美股代號REG）、Vanguard
    房地產 ETF（美股代號VNO）、Schwab 美國房地產指數 ETF（美股代號IYR）與SDR 標準房屋建商 ETF（美股代號XHB）。


    # 第 18 章 生活美股：行


    汽車業新戰局，角逐新能源商機


    生活股中「行」的部分，包含了過去的傳統汽車行業、汽車修繕零售等公司，這些公司過去曾是輝煌一時的成長股，例如通用汽車與福特汽車（Ford Motor Company，美股代號F），卻因為科技創新帶來的產業變遷開始衰退，正努力轉型成為未來的轉機股。


    接下來會以目前新興產業的公司做介紹，包括新能源車與共享汽車，讓讀者理解一個舊時代產業被顛覆需要的條件，以及在研究這些公司時需要注意的關鍵數據，找到未來產業中的領導者。


    # 一年上漲七〇〇%的飆股：特斯拉


    汽車行業正在產生新的變化，特斯拉（美股代號TSLA）的崛起宣告電動車時代正式來臨，成為所有車廠未來的研發主力、兵家必爭之地。除了電動車產業的蓬勃發展，無人機、無車人事與共享經濟也因為科技的進步而逐漸發展成熟，投資人應先做足準備，把握未來的趨勢。


    成立於二〇〇三年的特斯拉，總部位於美國加州，致力於生產電動車、推廣電動車市場的發展，以及銷售太陽能板，是一間垂直整合永續能源的公司。


    由於創辦人伊隆·馬斯克（Elon Musk）的獨特領導魅力，加上公司所掌握的技術優勢，對於特斯拉的行銷大有助益，所生產的Model 3持續保持在最暢銷電動車排行榜的首，訂單與營收持續成長。在特斯拉坐穩電動車市場的領導位置，且證明公司的商業模式可以獲利後，也讓許多新創公司加入市場，帶領產業進入高速增長的階段。


    在評估這類型公司時，必須關注公司的營收成長，包括車價以及交付數量化的影響。汽車業屬於重資產產業，需要高額的資本支出，因此資產運作效率的狀況是評估的指標之一，運作效率愈高，獲利能力也就愈好。此外，還需關注經濟環境的變化，當景氣不好時，汽車這類耐久財的需求就會下降，進而影響到營收表現。


    # 財務表現


    特斯拉電動車的營收自二〇一〇年的一·一七億，成長至二〇一九年已達二四五·七八億，平均每年成長超過七〇%，是相當驚人的數字。不過由於汽車產業是重資本支出的行業，所需的投資與人力支出皆相當龐大，也導致特斯拉過去幾年一直無法盈利，現金流呈現燒錢的狀態（參表56）。


    不過這樣的情況在二〇二〇年開始扭轉。觀察特斯拉的交付數量，由於生產線逐步架設穩定，生產效率提高，產量自從二〇一八年起顯著增長，即使遇到二〇二〇年的疫情，交付數量也不受影響。在二〇二〇年第三季的財報中，特斯拉的汽車總產量比前一年成長七六%，交付數量較去年同期成長五四%，公司已經連續五個季度盈利。二〇二〇年十二月確定被納入標普五百指數的成分股，成為指數中市值第六大公司。


    # 競爭對手


    特斯拉雖然是電動車的領導廠商，但在市場發展潛力仍相當大的情況下，自然吸引眾家車廠投入資源研發與電動車的生產，包括通用、福特、保時捷（Porsche）等傳統車廠都相繼加入市場，推出新型電動車款。在競爭日益激烈的情況下，特斯拉不得不採取降價策略來搶奪市占，以至於好不容易穩定的獲利能力可能再度陷入危機，投資人在買入公司股票前，可以從近幾季毛利率與營業利潤率的變化來判斷。


