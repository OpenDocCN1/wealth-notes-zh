  md: '


    # 二、互補者：當兩項商品或服務搭配在一起，能讓兩者變得更具吸引力且發揮更大的價值，我們就可以稱兩者之間為互補品。例如蘋果以外的手機搭配AirPods系統、智慧型手機與手機內的晶片、高速網路與雲端行業的發展趨勢等，都是很好的例子。


    # 三、供應者：供應者代表兩者之間存在著相依關係，彼此互為合作夥伴，共同創造雙贏的局面。譬如品牌如果沒有製造商的支援，即使品牌形象做得再好，也沒有產品可以賣給顧客。供應鏈如果沒辦法正常運作，就會造成企業無法進行銷售，連帶影響到整體的營收表現。例如2020年爆發的新冠肺炎疫苗，許多企業的供應鏈因為受到停工與封鎖的關係而無法生產出貨，造成整個生產到銷售的運作都受到影響。


    # 四、競爭者：競爭者代表產業內的參與者數量，彼此間具有排他性，例如買了蘋果手機後要再擁有三星手機的機率就低很多，或是一旦加入亞馬遜（Amazon，美股代號AMZN）的Prime會員，因為已經預先付出了會員費的成本，之後要再去沃爾瑪（Wal-Mart，美股代號WMT）消費的可能性就會下降。當產業中的競爭者愈多，原本的利潤就會被分散，更多時候是競爭者為了搶奪市場而打起價格戰，使得彼此利潤下滑，最後誰也拿不到好處。


    用價值網了解一家公司與顧客、互補者、供應商和競爭者的關係，進而了解整個產業的全貌，評估公司所處的產業地位，還能順勢找到產業中相關的公司以及上下游的供應鏈，挑選出表現好的公司來做更深入的研究。


    我在尋找美股中的好公司時，也會運用這樣的思維，先從目前最主流的產業著手，在高速發展的產業中找到表現最好的公司，然後從這個公司的商業模式進行延伸，試著找到更多潛在的投資機會。


    就我來看，每一個投資人都應該把自己當成企業分析師，而不是股票分析師，也就是以經營者的眼光去看待想要投資的公司。要經營一家公司，如果連自己都不清楚是該做什麼生意，更談不上獲利了！所以不要超過自己的能力圈範圍去做投資，而應該選擇你了解的公司，如果你有仔細觀察過去的紀錄，就會發現只要投資人能夠掌握這個選股原則，他們的投資生涯表現通常相當亮麗。


    # 更重要的是商業模式的創新


    好的商業模式是成功的第一步，但公司要如何維持商業模式中的競爭優勢，支持股價長期向上成長，是投資人下一個必須思考的問題。


    管理大師彼得．杜拉克曾說：「現今企業的競爭，不是產品之間的競爭，而是商業模式之間的競爭。」過去傳統的企業生命週期已不能代表新經濟下的商業模式，唯有創新的商業模式是現代企業的必備技能。企業仍保有競爭優勢時就開始打造新的成長動能，才有辦法讓股價符合市場所給予的高估值，為股東帶來更多回報。


    根據研究機構Euromoney的統計，過去五十年標普五百成分股中的公司生命週期，從平均三三年下滑到二四年，甚至未來有可能縮短到只有十二年。一家企業擁有好的商業模式不夠，因為一旦成長到某個階段，勢必面臨到成長趨緩的問題，股價也會因此陷入困境。同一套商業模式不一定可以持續在市場上維持領先，因為商業模式會不斷嘗試創新，打造新的成長動能。


    《從A到A''》（Great to Great）的作者詹姆．柯林斯（Jim Collins）提出的飛輪效應告訴我們，一家公司從優秀到卓越的過程就像一個巨大的飛輪，開始轉動之前必須先累積大量的動能，才有辦法在未來快速奔馳，持續推動前進。能夠推動飛輪的動能就是「創新」。


    「新」、從零到一，這種做創新，而從一到無限大又可以衍生出多種創新模式，突破原有的產業生命週期，不斷開創出新的成長曲線，這也是現代企業可以一直維持高速成長的原因。


    以亞馬遜為例，創辦人傑夫·貝佐斯(Jeff Bezos)，將飛輪的概念實際運用在公司管理上，永遠保持「第一天」的心態，像新創公司一樣思考，敢於冒險才有辦法持續創新。


    他除了在零售產業創造佳績，也不斷嘗試新的領域，最賺錢的業務—亞馬遜雲端運算服務(Amazon Web Services, AWS)更是成長的重要功臣。


    不過，更重要的是亞馬遜的另一項原則：以顧客為尊。其將顧客置於價值網的正中央，透過網路結合的每一端都可以為顧客增加價值，並且在本身擁有的大數據優勢下，搶在顧客之前發現需求。


    網路的普及，也催化出像電子商務、訂閱經濟與軟體即服務(Software as a Service, SaaS)等新的商業模式，藉由數據的蒐集與分析來進行產品優化，傳統的商業模式需要在推出產品後才能得到客戶的反饋，現在卻可以從做中學，動態調整產品內容來提升顧客體驗，讓新創企業得以高速生長。美股中許多高速成長股都屬於這一類。


    上市公司祖睿(Zuora，美股代號ZUO)，執行長左軒霆最早提出「訂閱經濟」一詞，他在著作《訂閱經濟》中就指出當前的新商業模式，已經由過去的線性轉型成環形模式，包括透過持續研究與開發增加產品的功能、不斷推陳出新、設計獎勵機制來鼓勵購買與強化消費行為。唯有把企業當成一個年金來經營，才有辦法達成永續的目標。後面章節會進一步討論這類型公司。


    # 找出企業的獲利方程式


    投資人剛開始投資美股時，如果不敢追強勢股，最好的方式就是從簡單易懂的產業著手，從日常生活中尋找投資機會。因為每天都會使用到的東西，自然容易了解產品與服務的優缺點，以及具備怎樣的競爭優勢與發展空間。


    就算是難以預測的科技股，其實許多科技產品與服務早就圍繞在我們的生活周遭。不同于台股中的科技股多為代工與零組件公司，專業程度與技術性高，一般投資人很難理解，但美國許多科技股都是日常生活與工作場域中時常接觸到的平台與軟體公司，例如社群媒體「臉書」、零售霸主「亞馬遜」、金融科技公司「PayPal」或巴菲特持有的「蘋果」等公司，這些「生活中的科技股」具備了以下特色：


    - 一、善用科技提高效率：由於科技的進步、5G 時代的來臨，這些公司提供的產品與服務愈來愈多元，讓我們的生活更便利。

    - 二、網絡效應擴張快速：網絡效應在新經濟中扮演關鍵角色，傳統公司得益於規模經濟與品牌效應，建立起企業的護城河，如今有辦法創造商業網絡的公司才是贏家。

    - 三、獨占市場規模優勢：只要具備了規模優勢，產業中的領導者與落後者的差距就會愈來愈大，顯現出大者恆大、贏家全拿的狀況。


    我認為當前美股中最具代表性的公司都擁有上述的特徵，也因如此才有辦法站穩產業中的領導地位，維持高速的成長率與優異的獲利能力。了解這些公司的基本面，就能掌握判別公司未來發展的重點。


    # 尖牙股的商業模式


    「尖牙股」（FANG）指的是包括「臉書」（Facebook）、「亞馬遜」（Amazon）、「網飛」（Netflix，美股代號NFX）與「谷歌」（Google，母公司是字母控股公司，美股代號GOOGL）四家公司第一個字母集合而成的簡寫，由CNBC知名財經主持人吉姆·克萊默（Jim
    Cramer）提出，代表美股中最具影響力、漲勢最兇猛的幾家科技公司。


    # 臉書


    臉書成立於二〇〇四年，是全世界最大的社交媒體平台，擁有 Facebook、Instagram、Messenger、WhatsApp、與 Oculus 等五個主要產品與服務，提供免費的社交媒體平台，每天有超過十八億的人口透過網路使用臉書的服務。廣告收入就是臉書主要的營收來源，雖然我們使用臉書完全免費，但也提供了臉書相當大量的數據，了解我們的喜好與需求。也因此，透過平台的網絡效應吸引更多用戶，也讓更多廠商到臉書來投放廣告吸引消費者，讓臉書的獲利維持高成長。二〇一九年的營收達七〇七億美元，比前一年成長了二七％，最近五年的營收平均成長率為四一．五％。


    投資人評估臉書的未來發展時，可以關注的重要指標包括「活躍用戶數量」與「每位用戶平均收入」（Average Revenue Per User (ARPU)）。這兩個指標也泛用於其它平台上，評估平台的使用度與變現能力。當活躍用戶數愈多，臉書向廣告主收取的廣告費用就愈貴，換算成每位用戶的平均收入也愈高，持續推升臉書的營收成長。


    - 活躍用戶數量：活躍用戶數量來衡量臉書平台提供的功能是否讓用戶滿意，願意常常造訪，並在上面進行活動。根據臉書提供的數據，到二〇二〇年第三季，臉書的日常活躍用戶（即每天至少訪問一次臉書的用戶）已達十八億人以上，月活躍用戶數（即過去三十天內曾經訪問臉書的用戶）已達二十七億人，是全球最大的社交平台（參圖3）。

    - 每位用戶平均收入：所謂「每位用戶平均收入」，可以衡量公司如何將平台上的人流進行貨幣化，轉換成真正的獲利。將某段時間內的總收入除以平均用戶人數，得到的數字就是公司從個人用戶上可以獲得的收入。以臉書來說，將廣告營收除以平均用戶數量，就是每位用戶幫臉書賺得的平均廣告收入。


