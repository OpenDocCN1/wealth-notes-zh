    # 融資現金流


    所謂融資現金流，是指公司為了營運，將對外進行籌資活動所獲得的現金，包括發行債券、貸款，扣除股票回購、支付股利所支出的現金計算而成。融資對公司來說就是現金的挹注了，在低利率時代藉由融資來做更積極的商業布局，對資本運用得宜的公司來說是相當大的優勢。


    以蘋果公司為例，從公司年報（參表 44）可以觀察到，二○一九年的營業現金流入下滑，主要是因為營收衰退所造成，但是在二○二○年的營業現金流入又增加到八○六．七四億美元，較前一年成長了十六%。投資現金流的變化則是公司的收購支出、但是蘋果的理財能力也相當優異，投資有價證券的獲利讓公司的投資現金流總金額是正值。最後一欄則是融資現金流出增加，由於蘋果公司的現金資產相當充沛，所以支付鉅額股息與回購數量相當多的自家股票，融資現金流的總金額為負值，將現金以不同的形式回饋給股東，對股東來說是相當開心'
