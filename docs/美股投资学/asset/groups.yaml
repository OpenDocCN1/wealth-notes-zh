    # 找出企業的獲利方程式


    投資人剛開始投資美股時，如果不敢追強勢股，最好的方式就是從簡單易懂的產業著手，從日常生活中尋找投資機會。因為每天都會使用到的東西，自然容易了解產品與服務的優缺點，以及具備怎樣的競爭優勢與發展空間。


