    # 第10章 從好用網站快速篩選好公司


    第三部中介紹了相當多財務指標的意義與應用，幫助大家可以更快速掌握財報中的重點，以評估一家公司的營運狀況，並決定是否該買入這家公司的股票。


    如果是初次接觸某家公司，最好的方式就是讀一次公司的年報，了解業務內容與營運狀況、管理層的討論與想法，如此可以讓你理解公司的核心產品與理念，之後就是定期追蹤公司的季報與重大消息即可。


    如果想要更快速獲取公司的訊息，也可以使用許多免費資源的網站，直接就能找到公司長期以來的營運表現，省下許多整理的時間。


    ## 指標篩選的好用網站：Finviz


    Finviz 是利用指標篩選公司最好用的網站之一，而且絕大部分的功能都是免費的。不管投資人想用產業分類、財報數據、估值指標或技術分析指標來挑出理想條件的公司，都可以利用網站的功能快速找到相對應的個股。


    首先，點進 Finviz 首頁，在左上角的搜尋框中打入想查詢的公司名稱或股票代碼，便可以進入個股介紹的頁面。


    進入個股資料頁面，可以觀察到公司的股價型態、資本資料與指標列表、股價表現與分析師評級和目標價等資訊，綜合不同面向的數據進行分析。接下來，介紹兩個十分好用的功能。


    ### Screener（掃描）


    「Screener」位於網頁的上方選單，投資人可以利用這個功能，針對個股的分類、基本面、技術面或兩者結合來進行篩選。對於偏好以技術分析作為進出場參考的投資人，網站中也提供了較詳細的篩選指標，包括均線、型態辨識與動量指標等，是
    Finviz 比較特別的功能。圖 15 為進入 Screener 的畫面。


    ### Maps（熱力圖）


    觀察整體盤面的變化、強弱類股的輪動，對投資人來說相當重要。Finviz 提供了「Maps」的功能，只要選取過去一段時間（單日、單週、年度等）與不同市場（標準五百、整體市場、世界與ETF等）的表現，就能透過圖表清楚呈現，也能快速找到強勢的族群與公司（參圖16）。


    與台股不同的是，圖中以紅色呈現下跌，上漲則以綠色呈現，主要提供上一個交易日個股的漲跌幅度。以圖中「ANZN -1.03%」為例，是指亞馬遜在最近一個交易時間的股票價下跌一・〇三%。


    ## 資訊豐富的強大網站：Morningstar（晨星）


    Morningstar（晨星）是知名的研究與評級機構，雖然有付費功能，但網站上提供了豐富的免費資源，對一般投資人查詢來說已經非常足夠。

    首先，進入網站後在左上角的搜尋框中打入想查詢的公司名稱或股票，便可進入個股介紹的頁面。接下來，介紹幾個我覺得這個網站中十分好用的功能。


    ### Quote（報價）

    以蘋果公司為例，進入公司查詢網頁後的第一個選單就是「Quote」，在股價線圖右側可以查看詳細的報價資訊。

