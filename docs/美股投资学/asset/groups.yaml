    網飛的成功在於創辦人的高瞻遠矚，也受益於科技的進步、網路與移動式裝置的普及，讓公司可以更快的方式擴展市場，目前擁有一、九五億個付費用戶，坐穩龍頭寶座。


    不過，串流媒體平台的競爭者愈來愈多，包括迪士尼（The Walt Disney Company，美股代號DIS）來勢洶洶，新推出的串流服務Disney+自推出後不到一年就累積了七千三百七十萬個付費用戶，強大的智慧財產權與影視內容不可小覷。加上亞馬遜、蘋果與短影音平台、抖音、等公司都亟欲搶奪消費者的注意力與時間，未來整合所有資源、加強與各地市場的合作關係，提高公司的營運效率與吸引更多用戶，是網飛最重要的課題，只要妥善因應，長期來看仍有相當大的發展空間。


    # 谷歌


    全世界最大的廣告商「字母」是一間控股公司，二〇一五年，谷歌進行改組，將搜尋業務「谷歌」與其他事業整合到新公司「字母」之下，包含廣告收入、Youtube 廣告、Android、Chrome、雲端業務、硬體等業務，也投資了智能家庭、電動車、生物科技等新創事業。


    廣告收入包括在谷歌搜尋時出現的點擊廣告，還有Gmail、Google Maps 和 Google Play中的廣告，以及Google Adsense 與AdMob
    等在其他網站投放廣告的產品，二〇二〇 年也開始揭露 Youtube 平台帶來的營收貢獻，占整體營收約十一％，是廣告收入中成長性最好的一塊。


    不過由於廣告業務的營收放緩，投資人會發現谷歌的股價是尖牙股中表現最平淡的公司，沒有發生爆發性的上漲趨勢。這是因為公司的雲端業務發展較慢，占整體營收的比例僅五．五％，新創事業包括智慧家居公司
    Nest、自動駕駛汽車公司 Waymo 與生物科技

