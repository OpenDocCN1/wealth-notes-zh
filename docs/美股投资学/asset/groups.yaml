    那麼好的投資人來說，要看全英文財報通常會心生畏懼。其實如果已經大致了解公司的業務內容，只要觀察幾項重要的關鍵數據，就可以了解目前的營運狀況。接著就從美國證券交易委員會網站找到蘋果公司年報（10-K），提出幾個必讀項目來說明（參圖11）。


    +   會計年度（Fiscal Year）：進入年報第一頁，需要特別關注的是每家公司的會計年度有所不同。一般來說，台股的會計年度都是從每年一月一日開始、十二月三十一日結束，美股則是依據各個公司的慣例來決定財務資訊的時間段，例如蘋果公司的會計年度在每年九月二十六日進行結算。


    +   項目1公司介紹（Item1. Business）：在項目1的內容中，會詳述目前公司銷售的產品與服務、商業模式及營運概況（包括產業概況、競爭環境與供應鏈）等重要訊息。以蘋果公司為例，投資人從這裡可以了解公司背景及目前提供的新產品與服務內容。


    +   項目1A 風險因素（Item1A Risk Factors）：內容包括公司在未來可能面臨的風險，包括總體經濟、政府政策與法規限制、突發事件的影響，以及供應鏈狀況與競爭對手。投資人在進行研究時，也應該把這些因素納入考量，做一個整體的理解與評估。


    +   項目6選定財務數據（Item6 Selected Financial Data）：此處提供最近五年的特定營運數據，讓投資人掌握到一個比較長期的營運趨勢。例如從圖12可以觀察到蘋果公司'
