    **延伸指標：MACD**


    移動平均線是相當實用的指標，根據移動平均價格的計算也衍生出許多相關的指標，例如「平滑異同移動平均線指標」（以下簡稱 MACD）。


    MACD 的計算方式是把短期移動平均減去長期的移動平均，通常採用十二日和二十六日的指數移動平均（exponential moving averages, EMA）得出的差值，來觀察長短期移動平均線處於收斂還是發散。當
    MACD 為正值且價格位於均線之上時，表示股價處於上升趨勢；當 MACD 為負值且價格位於均線之下時，表示股價處於下跌趨勢。


    計算出 MACD 指標後，再计算出最近九個交易日的 EMA，稱為「訊號線」。觀察圖 30 下方的兩條曲線分別代表 MACD 與訊號線的走勢，下方的直條圖表示
    MACD 與訊號線的距離。若 MACD 大於訊號線，則直條圖高於零軸；若 MACD 小於訊號線，則直條圖低於零軸。


    ### 圖 30 蘋果公司 2020 年股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_208_0.png)


    圖片來源：Tradingview


    與黃金交叉和死亡交叉策略相同，當 MACD 由下往上穿越訊號線為黃金交叉，且直條圖由負轉正時，代表買進訊號；而當 MACD 由上往下穿越訊號線為死亡交叉，且直條圖由正轉負時，代表賣出訊號。


    **準確判讀進出場時機指標：趨勢線**


    除了移動平均線，我認為加入股價趨勢線的判斷，可以更清楚地觀察價格的變化，更準確地判斷進出場時機，降低進出市場的頻率。


    一個趨勢的形成需要的元素很多，除了市場上參與者的數量、投入的資金以外，還需要時間的累積，也因此當趨勢形成後，除非有重大事件發生，否則趨勢很難突然被逆轉。舉例來說，二○二○年初的新冠肺炎疫情爆發，扭轉了過去長達十年的美股牛市，標普五百指數在三月跌破前一個低點，甚至跌破了一九三二年以來的長期趨勢線（參圖
    31），市場中蔓延著恐懼的氣息，深怕一九二九年的大蕭條悲劇又再重演。


    以前述內容來判斷，投資人在股價跌破均線、呈現弱勢型態時就應該減碼應對，等待更好的進場機會。而觀察股價在跌破趨勢線後，開始有買盤進場承接，一旦重新回到趨勢線上方，就是相當理想的進場位置。其後在短期均線翻揚、向上突破長期均線時，更可以順著趨勢逐步進場加碼。


    **趨勢線繪畫法與判讀**


    趨勢線呈現了市場或標的資產的整體方向，投資人可依股價的發展繪製出趨勢線。


    在股價波動的高點（波峰與低谷）分別進行連接，形成一個股價走勢的通道，就可以找出股價的壓力與支撐區，提早進行投資規畫，面對突發狀況時也能更快做出反應。


    趨勢線的繪製有兩個重點：


    - 兩點成一直線，趨勢線可以連接點愈多，愈具有代表性。

    - 趨勢線可連結的點覆蓋時間愈長，愈具有代表性。


    參考圖 32，在趨勢發展過程中，每次股價的上漲或下跌接近趨勢線時都會形成支撐或阻力，市場中看多與看空的投資者相互角力，醞釀下一波走勢力道。只有在一方獲勝後，股價才有所突破，決定趨勢將延續還是反轉。


    ### 圖 31 標普 500 指數 2011 至 2020 年股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_210_0.png)


    圖片來源：Tradingview


    畫好趨勢線後，可以觀察目前的股價走勢處於上升趨勢、下降趨勢或橫盤整理，藉此辨識出目前的股價形態，評估未來的發展。上升趨勢線可作為股價拉回整理的支撐，下降趨勢線則作為股價繼續上漲的壓力（參圖
    33），而橫盤整理的上緣與下緣，也可作為支撐與壓力（參圖 34）。不論股價未來是突破了下檔支撐或突破了上檔壓力，都可視為是行情發動的重要訊號。


    所以，當公司股價仍在上升趨勢、股價短期拉回接近趨勢線時，都是可以考慮的進場點。除非股價跌破趨勢線，使得原先的股價性質遭到改變，這時就要小心股價會有更進一步重跌，應該先減碼出場。


    ### 圖 32 趨勢線畫法


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_211_0.png)


    投資人也可以觀察趨勢線與移動平均線的位置，當兩者接近時，可作為雙重的支撐與壓力，對於股價走勢的影響更大。若股價在這邊有重大的突破發生，通常會引發一波更劇烈的走勢，趨勢延續或反轉的指標性更強。


    **延伸指標：RSI**


    透過加入「相對強弱指標」（Relative Strength Index，以下簡稱 RSI），可以衡量股價趨勢延續性，以及預先察覺股價轉弱的訊號。


