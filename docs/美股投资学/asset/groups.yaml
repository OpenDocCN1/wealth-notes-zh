    # 獲利穩定性


    對成熟型公司來說，維持獲利能力相當重要，這同時也代表了公司的成本與費用管控能力。獲利增加的來源又可以分為「開源」和「節流」兩個部分，開源是增加營收，節流是降低成本。


    因為市場競爭大，寶僑雖然擁有品牌優勢，卻無法穩拿定價權，所以要開源是比較困難的。消費品需要靠廣告行銷來吸引消費者的目光，如果成本與費用控制得好，在節流這一塊的優勢就能彰顯出來。


