    还记得当初瑞·达利欧（Ray Dalio）的钜著《原则》(Principles) 在亚马逊逢上架三天，Tom 就已经读完原文，同时完成了三篇心得。在国内还没有中译本的情况下，能领先把最新资讯和知识传达给读者、开拓投资人的视野，便是我们的初衷。而当时《原则》


