    ## 從產業選擇最佳標的


    對於不熟悉美股個股的投資人，除了大盤 ETF 以外，還能藉美股的產業分類來做進一步的資金配置。在景氣循環週期中，每一個階段市場中的領導類股也會不同，當市場熱絡時，投資人應該觀察目前盤面上的領導類股，並找出該類股中最強勢公司的最大勝率，資金動能推升股價上漲，顯示出強者恆強的現象。而當經濟開始有衰退疑慮、市場中不確定性升高時，資金通常會流向穩健且具固定收益特性的類股，投資人若觀察到該類股有增強趨勢，便可以提高警覺，進行部位的調控來因應未來可能發生的變化。


    美股中的產業依據「全球產業分類系統」（Global Industry Classification System, GICS）來進行分類。全球產業分類系統是由標準普爾與摩根史丹利資本國際公司（Morgan
    Stanley Capital International, MSCI）於一九九九年八月共同開發的行業分類系統，涵蓋全球股市九五%的公司，將上市公司分類至十一個主要的經濟部門，並將這些部門向下細分至不同的次產業別，共有四級分類，是研究員與投資者重要的參考依據。


    二〇一八年，由於行業的創新與發展，指數委員會將「臉書」（Facebook，美股代號FB）、"字母控股公司"（Alphabet，美股代號GOOG）、"推特"（Twitter，美股代號TWTR）以及遊戲類股公司「藝電」（Electronic
    Arts，美股代號EA）、"動視暴雪" (Activision Blizzard，美股代號 ATVI) 等企業，從資訊科技類股移到由電信類股更名的通訊服務。所以，目前的十一大產業分類依序如下：


    - 一、原料（Materials）：化學製品、金屬採礦、紙產品和林產品。

    - 二、非必需消費品（Consumer Discretionary）：汽車、服裝、零售和休閒消費。

    - 三、必需消費品（Consumer Staples）：日用品、食品和藥品零售。

    - 四、能源（Energy）：能源設備與服務、石油和天然氣開採。

    - 五、金融（Finance）：銀行、金融服務和保險。

    - 六、醫療保健（Medical & Health）：醫療保健服務、醫療產品、藥品和生物技術。

    - 七、工業（Industry）：資本財、運輸、基礎設施、航空和國防。

    - 八、資訊科技（Information Technology）：軟體服務、硬體技術和設備、半導體。

    - 九、通訊服務（Communication Services）：電信服務和媒體娛樂。

    - 十、公用事業（Utilities）：電力、天然氣、水利事業。

    - 十一、房地產（Real Estate）：房地產開發、管理及相關信託。


    想要投資上述產業，同樣可以買進相關的 ETF，參表 10。


