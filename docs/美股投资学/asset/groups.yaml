    目前看來，公司的費用增加速度已經下降，二〇一九年的營業費用九．三五億美元比二〇一八年多一倍，但二〇二〇年縮減至九．二四億美元，營業利潤率也從負六○．八％提升到負十九．九％。以這樣的趨勢發展下去，有可能在未來幾年轉虧為盈。


    另外，投資人還應關注公司的現金流量表。營業現金流成長，表示銷售額持續增長，從表 29 可以看出，二○一六年的營業現金流為負六千八百萬美元，到二○二○年已轉為正一．一六億美元，在持續投資與併購下，自由現金流量可以維持在一定的水準。


    但沒有盈餘的公司還能投資嗎？檢視 DocuSign 的財務報表後，會發現公司的現金資產充裕，負債比也沒有過高，先衝成長的決策是相當正確的。倘若未來遇到市況不好，公司不太可能面臨短期的流動性危機，在逆風時改採較保守的策略，減少費用維持營運即可。


