    也是轉機，耐克藉此推出健身 App「Nike Training Club」，在疫情期間下載量超過八百萬次，比二○一九年增加三倍。耐克運用 App 打造與消費者的緊密關係，提高消費者的體驗與忠誠度，對於公司品牌形象大有助益，也幫助公司更加了解用戶需求，打造更好的產品。


    除此之外，疫情也使得消費習慣跟著改變，由以往的實體店面轉向網路商店購買，耐克「直接面對消費者」部門營收連續兩季度成長超過七五%，原本預計在二○二三年度線上銷售占總營收比三○%的目標提早達成，公司也將未來目標提高至五○%。


