    工具，用以確認股價的發展趨勢，以及股價的重要支撐與壓力位置。


    ### 判斷趨勢方向


    我認為，判斷股價當前的發展趨勢是移動平均線的最重要功能。當移動平均線的斜率是正的，股價位於移動平均線的上方，代表公司股價走勢向上發展，屬於強勢訊號。如果移動平均線的斜率是負的，股價位於價格平均線的下方，則代表公司股價走勢向下發展，屬於弱勢訊號。


    圖 26 是釀果公司二〇一四至一七年的股價走勢，當股價位於三條均線之上，則呈現明顯上升趨勢，即便股價拉回整理，在均線附近也會有支撐力道，支持股價重新回到上漲軌道。而當股價開始跌破均線，就必須注意是否有反轉跡象，一旦股價跌破所有均線之下，則開始呈現明顯的下跌趨勢，在反彈沒有突破均線之前，都是相當弱勢的型態。


    移動平均線愈陡峭，代表行情的走勢速度愈快也愈強勢。當股價在短時間內飆漲或暴跌，長短期均線之間的距離會被快速拉開，一旦股價距離均線太遠，就會造成乖離過大的情況。這時可能會有短期獲利了結的賣壓出現，使得股價走勢開始趨緩，動能減弱，於是移動平均的斜率變得平坦，行情的波動縮小，所有的移動平均線會愈來愈靠近，出現股價高檔或低檔的盤整期，有相當大的機率是在醞釀下一波的趨勢發展。


    ### 圖 26 蘋果公司 2014 至 2017 年股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_203_0.png)


    圖片來源：Tradingview


    ### 支撐與壓力位置


    移動平均線涵蓋的時間愈長，愈能代表一家公司股價的長期趨勢，也不容易反轉。所以當股價下跌接近移動平均線的位置時，通常會有支撐力道讓股價稍做整理，然後開始後續的走勢。而股價上漲接近移動平均線時，也會有阻擋壓力必須整理突破。


    對長線投資人來說，找到一家值得長期投資的好公司，希望在合理的價格買進，就不該在股價飆漲時進場追高，而是耐心等待股價拉回再分批進場布局。觀察這類型公司的股價，最好的進場點通常是在兩百日均線附近，因為股價在兩百日均線附近會形成強力支撐，一旦跌落至兩百日均線附近，通常賣壓減弱，買盤增強，逐漸構成箱型整理型態（參圖
    27）。投資人若確認基本面沒問題、公司本質仍然強健，就可以考慮在兩百日均線附近開始建立部位，等待籌碼穩定後股價重新回到原本的上漲軌道。


    ### 圖片 27 迪士尼 2017 至 2020 股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_204_0.png)


    圖片來源：Tradingview


    對於短線或波段操作的投資人來說，則可加入長 / 短期移動平均線的黃金交叉與死亡交叉來判定買 / 賣點。當短期均線突破長期均線時稱為「黃金交叉」，可視為買進訊號；相反地，當短期均線向下突破長期均線時稱為「死亡交叉」，可視為賣出訊號（參表
    46）。


    二〇二〇年來，許多雲端類股漲勢強勁，例如遠距會議軟體 Zoom（美股代號 ZM），短線上漲幅度都相當驚人。在短期移動平均線向上穿越長期移動平均線，形成黃金交叉時買進股票，藉由移動平均線來判斷進場位置，可以幫助投資人降低股價大幅波動對心理造成的影響，更可以紀律地進出市場，賺取不錯的報酬（參圖
    28）。


    同樣是雲端成長股，以 OEG% 為例，一旦短期股價轉弱，短期移動平均線向下穿越長期移動平均線，形成死亡交叉時賣出股票，可以幫助投資人保住應有的獲利，或是及時出場，降低虧損對整體資產造成的損失，提高手上的現金部位去尋找更好的投資機會（參圖
    29）。


    當所有的均線都維持正斜率，表示公司股價維持強勢上漲狀態。想要買入公司股票投資人，可在股價拉回至長期均線整理、短期均線突破長期均線時進場，降低追高的風險。


    在買入公司股票後，只要股價持續上漲，長短期均線的趨勢尚未反轉之前都不需要賣出。除非發生短期均線向下突破長期均線、股價大幅下跌時，這時就需要注意風險，考慮減碼股票，將獲利入袋為安。


    至於該選用時間多長的移動平均線，取決於投資人設定的持有時間，我們稱之為「時間架構」。短線交易者通常選用的時間架構較短，觀察短期的移動平均線來決定買賣點；而長線投資人選用的時間架構較長，觀察更長期的移動平均線來決定買賣點。這表示如果是用長期移動平均線來進行買賣點的決策，就可以減少交易次數，持有時間也愈長，降低因為頻繁交易而產生的交易成本。


