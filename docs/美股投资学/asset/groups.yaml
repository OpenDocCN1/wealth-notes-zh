    ### 現金流量充沛


    在營收穩定增長的情況下，必需消費類股的資本支出就不會有大幅度的變化，透過穩定的自由現金流入，公司便可持續支付股息，維持長期的股息成長紀錄。


    表 17 為寶僑公司近十年的財務狀況，從股息配發金額來看，平均每年大約成長 5%。如果不是營運良好的公司，是很難有這麼優秀的表現，可以說，寶僑是一家值得長期持有的好公司。


    ### 未來展望


    寶僑公司屬於必需消費類股，產品需求持續，加上具有品牌優勢，從上述的財報數字來看，營收相當穩定。


    目前寶僑的股息殖利率為 2.2%，雖然高於大盤的平均殖利率，但是與最近十年相比仍然偏低。以本益比${}^{[6]}$對公司進行估值，目前寶僑的本益比為 28.7
    倍，高於過去水準，如果以過去十年的本益比區間來看，寶僑的本益比介於十六至三十二倍之間，取中間值在本益比為 24 倍附近會是比較合理的價位，因此投資人可以等待更好的機會再進場投資。


    ⑥ 本益比（Price-Earning Ratio），即投入的成本和獲利的比值，計算公式為「目前股價」除以「未來每股盈餘（EPS）」。本益比常被用來評估一家公司的股價是便宜價或昂貴價。


    ## 第5章 發掘新經濟的潛在機會


    近十年來，智慧型手機的問世與普及，網路速度倍速成長與發展，讓許多產業掀起革命性的變革。例如我們的消費習慣從實體店面購買轉變為網路購物，企業為了滿足消費者的需求，也已經發展成新零售模式，把線上與線下進行整合。「軟體即服務」產業就是在這樣的環境下發展成熟，讓過去的硬體存儲裝置轉變成雲端服務，也就是隨需隨選、隨需隨購的商業模式。


    舉例來說，過去我們想要聽某位歌手的歌曲，就得去唱片行選購 CD，現在只要到 Spotify（美股代號 SPOT）就能隨選隨聽；過去想要觀看某部電影，得去百事達租片，還常常因為逾期而多付了幾十塊錢罰金，現在只要在
    Netflix 上隨選隨看。甚至，未來連家具都可以訂閱，IKEA 計畫在未來推出家具訂閱服務，如此就能定期改造自己的居家環境，讓生活變得更有樂趣。


    ### 倍速成長的訂閱經濟效益


    美股中有許多高速成長的「軟體即服務」公司，都是訂閱經濟公司，由於營收爆發力強，股價在短時間內飆漲數倍，成為市場新寵，例如網飛、Netflix、Snapchat
    與 Zoom（美股代號 ZM）等公司都是很好的例子。


    根據國際研究機構 Gartner 預測，到 2023 年，75% 的公司提供的產品與服務都將採用訂閱方式進行，有 70% 的公司則已建立這項服務或正在考慮提供訂閱服務。美國的訂閱經濟公司在過去七年的營收平均每年成長
    18%，相對於標普五百指數的公司平均每年成長僅 3.6%，訂閱經濟公司的成長率是多數公司的五倍以上。


    訂閱業務受益於穩定和可預測的收入預測、直接從消費者的資料數據優化服務，投入的固定成本很小，卻可以帶來規模效應的特性，不僅是高速成長的雲端股，許多大型企業也積極轉型，從過去所有權為主的買斷制，變成使用權為主的訂閱制，打造一個永續性的商業模式。


    由於這個產業正高速發展中，企業數位轉型已成主要趨勢，加上公司營收更穩定且財報的可預測性很高，因此投資人可以更準確地評估未來展望，進行更高效的資本配置，可以說，訂閱經濟是新經濟中的成長潛力新秀。但評估訂閱經濟公司時，只看營收與獲利是絕對不夠，因為多數的「軟體即服務」公司都只有營收成長，卻沒有獲利入袋。


    訂閱經濟公司的目標不是單次的買賣行為，而是希望與顧客達成長久的關係。在合作過程中為了滿足客戶的需求、提高滿意度，就必須持續投資、研發與進行併購活動，把所有利潤都投入成長是相當合理的做法。雖然看起來是一間虧損的公司，實際上是創造未來的收入為目標，拿賺來的錢再投資，不計成本獲取新顧客以擴大市占率，鞏固在產業中的地位。在觀察訂閱經濟公司時，必須關注「營收成長率」、「顧客數量成長」、「每位用戶平均收入」、「年度經常性收入」、「年度合約價值」和「帳單金額」等重點，以下逐一說明。


    ### 營收成長率


    營收成長率是觀察公司股價動能最重要的指標之一，由於「軟體即服務」公司的成立時間都較短，就好像青少年一樣活力充沛，跑百米抵達終點的速度比成年人或老年人快上許多，所以營收成長率也相當高。


    舉例來說，遠距會議軟體公司 Zoom 的營收從 2019 會計年度第四季度開始，每一季皆有相當亮眼的成長，在 2020 年疫情期間，需求大幅提升，讓公司連續兩個季度的營收年成長率超過
    300%，也讓 2020 年的股價漲幅近 500%。


    ### 顧客數量成長


    顧客數量對訂閱經濟公司來說相當重要，由於這些公司大多是軟體公司，開發出一套軟體的成本都是固定的，愈多客戶付費訂閱，成本回收愈快。因此公司會透過促銷或免費試用吸引客戶進來，剩下的就是努力留住客戶。


    顧客數量與營收成長緊密相關，因為訂閱經濟的營收動能就是來自於顧客數的增長，一旦顧客開始訂閱，持續使用公司產品就會產生源不絕的營收。訂閱經濟公司通常是採定期簽約、定期付款的營運模式，為了確認公司營收的穩定性，追蹤訂閱公司老顧客的增減以及新客戶數的成長也相當重要。但如果只顧著找新客戶而忽略了售後服務也不行，因為合約期間若顧客覺得服務不好，隨時可以走人，對公司的損失更大。


    ### 每位用戶平均收入


    透過對「每位用戶平均收入」的了解，可以讓投資人知道公司是否具有競爭優勢，並且掌握定價權。在公司提供的財報中，如果每位用戶平均收入上升，表示公司產品價格上漲，或顧客很滿意公司的服務、買了更多產品，對營收成長也有幫助。如果每位用戶平均收入下降，有可能是競爭太激烈、公司調低產品的售價或顧客買的產品變少，這

