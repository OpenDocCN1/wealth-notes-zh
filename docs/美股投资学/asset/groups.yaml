    ## 前言


    很高興在沒有保證獲利的書名加持下，你還願意翻開這本書，表示對於投資的想法我們是站在同一陣線，擁有同樣的價值觀，了解面對市場時應保持謙虛，面對不確定性保持警戒，才有辦法在任何時間點都做出理性、正確的決策，一起擁抱穩健獲利，踏上美股投資的美好旅程。


    這不是一本告訴你如何從美股迅速致富的書，也沒辦法讓你在短時間內獲得財富自由，而是與你分享我近十年投資美股所累積的經驗與方法，讓每一位想要參與美股市場的讀者，透過這本書可以省下我當初進入美股市場時摸索的時間，更快地找到專屬於你的獲利模式。


    不管你是屬於哪一種投資人，我認為這本書很適合你。股神華倫．巴菲特（Warren Edward Buffet）曾說，投資是用一位經營者的眼光去看待一家公司。買一間公司的股票，就是擁有這家公司所有權的一部分，跟著公司未來的成長一起獲利，這才是所謂的價值投資。而美股正是實踐這套投資哲學最好的地方，擁有眾多值得長抱的好公司，只要你願意跨出第一步，絕對會在未來實際嘗到獲利的果實。


    我比大家幸運的是，在更早時候就參與了這個市場。十六年前從投資台股開始，也曾經操作海外期貨與外匯保證金，到最後決定專注在美股市場，當中的每一個嘗試與決定都是在不斷地了解自己與挑戰自己，尋找印證自己的假設與獲得滿意報酬的成就感。


    商科背景的我，從學生時代對企業管理與投資理財就有高度興趣。我時常在想，到底我們從書中所学習到的理論，是不是真的可以實證在投資市場上？還記得我在修總體經濟學這門課的時候，教授當著全班同學的面說她投資股票從來沒賺過錢，我那時在想，連一個經濟學博士都沒辦法戰勝市場，我們為什麼還要學習這些知識？


    不過，實際開始投資之後就發現，買股票不是拿出一本說明書照著操作就能賺錢，而是一個動態發展、自我鞭策與成長的過程。所有的投資都是從模仿開始，累積交易經驗，並從失敗中學習，最後找到適合自己的方法才能持之以往。


    ### 危機之後，更加存在風險意識


    回想一下，你買入第一張股票的原因是什麼？大概都是聽某個人說某家公司好、股票上漲就下手買了把。其實我也是，剛開始投資時懵懵懂懂，根本不知道什麼是價值投資、怎麼估值，也沒有自己的交易策略。還記得我在二○○八年金融危機之前，因為營業員的推薦，買入了當時還是寶來證券（現為元大寶來證券）發行的「羅素二○○○基金」，這應該算是我「第一次」接觸美股吧。


    羅素二○○○指數的主要成分股是市場上的中、小型股，在當時美股市況熱絡的情況下，買入之後很快就獲利達二○%以上。當時的朋友，也就是現在的老公告從《經濟學人》（The
    Economist）雜誌讀到美國的次貸危機似乎即將引爆，催促我先落袋為安。由於報酬率已經超出我的預期，因此沒考慮太多就將基金贖回獲利了結，沒想到真的躲過了金融危機的崩盤，算是相當幸運。


    直到二○○九年股市開始從低點復甦，記得是三月，大盤還在四千多點左右，許多股票的價格都跌到谷底，但似乎也沒有持續下探的壓力。我開始在低檔買入，等待市場復甦，而這些公司後來都讓我賺進了超過一倍以上的獲利。


    雖然當時對於投資也沒有特別用心研究，但經歷了金融危機後讓我了解到，投資市場上任何樂觀的情緒、美好的事情都有可能發生意外，再瘋狂的行情終會有結束的一天。而且似乎沒人可以準確預測危機來臨的確切時間點，如果沒有時時提高警覺，很容易就會被過度樂觀的心態所影響，做出後悔的決策。到現在，這樣的風險意識仍保存在我的投資哲學中。


    ### 證所稅讓台股量縮，正式投入美股


    我就這樣操作台股一直到二〇一二、一三年都還很順利，當時我們採用的方法是透過技術分析與股價型態來進行投資決策，也就是不看基本面好壞，當股價開始發動，突破壓力區或創新高價時就買入股票，跌破支撐時則賣出股票，嚴守這個紀律來停利停損。不過，當時證所稅的施行效應逐漸浮現，台股成交量大幅萎縮，每日平均成交量從一千億元以上逐步下降，有時甚至只有五、六百億元的成交量。想要追強勢股，沒有量又怎麼會有動能呢？結果這個方法反而發揮不出應有的效力，迫使我們找到新的方法來應對新的投資環境。


    我先生當時已經開始操作海外期貨，他認為要投資賺錢，就不能把自己局限在一個市場裡，也不該局限於一個只會做多的交易者，而應該彈性運用投資工具來創造最大報酬。記得我當時看了《炒匯王：賣在最高點》這本書，作者是日本炒匯女王鳥居萬友美，她利用技術分析來進行短線外匯交易，賺到相當不錯的報酬，完全符合我當時的交易策略，於是開始研究外匯保證金的交易。


    外匯保證金是利用高度的槓桿來進行外匯交易，不同的平台可以融資的比率不同。當時有很多平台都能交易外匯保證金，但是我選了安全性最高的盈透證券（Interactive
    Broks，簡稱IB）來開戶。後來有些外匯交易平台因為承受的風險太高，禁不起匯率突然大幅波動而倒閉，讓投資人血本無歸的事件不少。


    盈透證券是美國的上市公司，連續幾年評選為最安全的網路券商之一。台灣投資人開盈透證券帳戶的優點是方便，只需要線上填寫申請單即可，一旦開戶通過後，就可以進行交易。盈透證券上可交易的商品非常多，包括外匯保證金、美國股票、歐洲股票、亞洲股票與債券等一應俱全，如果想要進行資產配置，一站就可以搞定。


    我在操作一陣子外匯保證金後，因為同一個帳戶也可以買進美股的上市公司股票，於是我就像一般投資美股的新手，開始買進自己熟悉的公司，包括蘋果（Apple，美股代號AAPL）、星巴克（Starbucks，美股代號SBUX）、耐克（Nike，美股代號NKE）等公司。隨著時間經過，手上的標的愈來愈多元，除了日常生活中常見的品牌，也開始研究與買進科技股，然後是這兩年最熱門的雲端股。跟著產業趨勢的發展，我找到更多公司前景看好、股價型態強勢的成長股，跟著美股這段大多頭，我賺到不錯的獲利。


    ### 從經營者角度出發，找到值得投資的好公司


    巴菲特的老師、價值投資之父班傑明·葛拉漢（Benjamin Graham）曾說：「用做生意的方式來投資，是最聰明的方法。『擁有一家公司與擁有這家公司的股票並無不同，也應該採取相同的心態。巴菲特自認是一個生意人，所以能做好投資；同時他也是一個投資人，所以能做好生意。』」


    我除了投資以外，也經營公司，因此日常營運中包括管理、產線規畫與客戶接洽等工作讓我相當忙碌。管理就和投資一樣，不是拿出一本說明書照著做就能成功，你會遇到各種預期之外的狀況必須解決，大多數的時間都在思考該如何把公司的運行變得更有效率，在提升產能及獲利能力之外，還可以為股東創造更多價值，讓每年都可以派發令人滿意的分紅。所以看到葛拉漢這段話時特別有感觸，促使我將這樣的觀念也套用在美股投資上。


    我認為，如果今天我用經營公司的角度去剖析一間想要投資的公司，或許我也能擁有比其他人更多的優勢，找到一間值得投資的好公司。從那時開始，我在看公司時，一樣從產業、財務、管理這幾個面向來評估一間公司的真實價值，同時觀察是否正在產業趨勢上、具有營運效率、獲利能力佳、可以產生穩定現金流與優異的管理層，這些是一間好公司的基本特質，也是進行投資決策時的關鍵因素。


    用這樣的方式投資美股，除了能讓你在思考時具有宏觀的視野、清晰的邏輯與可依循的原則，更重要的，你是在真正了解這家公司，並認同公司的核心理念後才買進股票，將自己視為公司的所有權人，把長期持有當成是一個正確決策下的結果，而非買進公司的理由，也才是我心中真正認定的價值投資哲學。


    ## 第一部

    ## 前進美股新世界


    為什麼每個人都該前進美股市場？

    美股市場是除了台股以外與我們最親近的市場，

    許多我們熟悉的大品牌都是美股的上市公司，

    也是投資人最容易了解的市場。

    若以投資的角度來看，

    將資金分散配置在國際市場，

    美股可說是最好的選擇！


    ### 第 1 章

    ### 台股很好，多一個資產配置選擇更好


    投資美股後，最常被問到的問題是：投資台股不好嗎，為什麼會想要投資美股？


    台股當然有很多公司，但是當我開始投資美股之後，我認為美股市場真的是另外一個不一樣的世界，潛藏的商機無限，有太多值得探索的事物等待被發掘。就好比中華職棒晉升大聯盟、從台灣超級籃球聯賽（SBL）晉升到美國職業
    NBA 的殿堂一樣，面對更強勁的競爭對手，也感受到自身實力快速進步。


    #### 熟悉的大品牌，最容易被了解的市場


    為什麼我認為每個人都該前進美股市場，在科技日新月異、靠一支手機就可以與世界接軌的時代，獲取資訊的能力大幅提升，有更多管道可以快速掌握公司動態。尤其美股市場是除了台股以外與我們最親近的市場，許多我們熟悉的大品牌都是美股的上市公司，也讓我們更容易去研究。


    若以投資的角度來看，觀察近十年的股市表現，美股也是全世界最強的資本市場。以大盤指數的 ETF 報酬率來觀察，「標普五百指數 ETF」（美股代號 SPY）在過去十年，平均每年為投資人創造約十三%以上的報酬率，以科技股為主的纳斯达克指数
    (NASDAQ Composite Index，美股代號 IXIC) 更是每年創造十七%以上的報酬率，而台股的「元大台灣50」（交易代號0050）則每年創造約一○%的報酬率。台灣投資人為了避免將資金投入在單一市場，承擔政治或經濟情勢變化帶來的風險，將資金分散配置在國際市場，美股可說是最好的選擇！


    除此之外，美股市場還有許多其他國家股市沒有的優點，包括：


    - 美股是全世界最大的資本市場：由於美股是全世界最大的資本市場，吸引許多具有成長潛力的公司來掛牌。很多知名的新創公司都希望能夠美股上市，以爭取市場的關注度與投資人的青睞。除此之外，美股市場的交易量大，流動性非常好，不管是想要做多或做空股票都不需要擔心沒有成交量，讓投資人的操作策略可以更加多元化。

    - 美股的監管嚴謹，保護投資人權益：美股的資本市場發展悠久，所以能夠提供給投資人的保護也更完備。像是美國證券業的最高機構「美國證券交易委員會」（U.S. Securities
    and Exchange Commission, SEC）會負責監督市場，要求上市公司提交財報、大股東買賣申報等資訊揭露，維持市場效率與經濟的正常運行。

    - 投資商品選擇多元，策略調整相當彈性：美股的券商平台功能相當齊備，交易商品十分多元，只要一個帳戶就能買賣股票、ETF、債券、選擇權、期貨與外幣等資產。而且美股投資通常是採取保證金帳戶交易，用三○％的保證金便可以開始交易。而當你持有的資產市值超過帳戶裡的現金，則會自動開啟融資功能，滿足任何投資人的需求，讓資產配置達到最佳化。


    #### 踏入美股市場，讓我看得更長遠


    除了帶來令人滿意的獲利這個好處外，研究美股為我帶來更大的附加價值，使我对於這個世界的變化變得更敏銳，在研究的過程中更能掌握趨勢的脈動，眼界變得更寬廣，看事情的角度也更全面與客觀。


    過去投資台股時，閱讀財報常常會需要「測字」，因為公司在供應商或客戶列表時常常使用A公司、B公司來代表，而不敢直接寫上對方的公司名稱。但這個問題在看美股財報時幾乎不會發生，通常財報上對於每個細節都相當清楚明瞭，投資人一看就能了解整家公司的營運狀況。


    為什麼會有這個情況發生？主要原因就在於美股的上市公司幾乎是品牌大廠、平台公司，具有最強的競爭地位，當然什麼都敢攤在陽光下給大家看。例如蘋果公司每年都會公布供應商行名單，不是因為它握有訂單的主導權，可以決定要把訂單下給哪家公司，而接單的公司除非如台積電這樣具有難以超越的技術能力，也只能靠價格競爭來分食蘋果這塊大餅，營運上真的比較辛苦。


    此外，美股中有許多歷史悠久、營運良好的百年企業，這些公司擁有無法取代的商業模式，因此能在產業中長期占據了領導地位。例如寶僑（P&G，美股代號PG）、3M（美股代號MMM）、可口可樂（Coca-Cola，美股代號KO）、耐克等公司，除了靠品牌優勢賺取穩定的收益與配發股息，為股東帶來豐厚的報酬，也持續地投入研發、創造新的商品與服務，帶來成長動能。


    美股中許多公司的研發能力都非常強，尤其是科技巨頭對於未來科技的投資更是不可遺余力，包括電動車與自動駕駛、人工智慧、金融科技、生物科技與雲端服務等領域，都有公司在美股中掛牌上市。


    針對看好的產業，投資人可以選擇明星個股來投資，例如電動汽車和太陽能板公司「特斯拉」（TSLA，美股代號TSLA）、繪圖晶片大廠「輝達」（NVDA，美股代號NVDA）、電子支付公司「Square」（美股代號SQ）等高速成長股，也可以買入相關的ETF，投資一籃子產業中的公司，跟著他們的發展一起獲利。


    由於技術的進步，帶動企業轉型與消費升級，這些產業的發展都仍在高速發展中，如同一輛賽車奔馳在寬廣的賽道上，讓賽車手可以緊踩著油門狂奔。資金如同車水源源不絕的能源，讓這些美股公司的成長動能可以延續，股價長期趨勢向上，更適合長期持有。也因為如此，在研究這些公司時，我都用更多元的角度去看待它們，以一個更長遠的眼光去思考公司的未來，在腦中描繪所有可能的情境，並試著找出答案。用這樣的方式讓投資人在研究的過程中持續開拓眼界，更能夠接納這個世界的高速變化。


    ### 第 2 章

    ### 新手進入美股的第一張地圖


    對現在投資人來說，投資美股市場已經不是一件遙不可及的事。過去許多投資人對於前進美股市場的障礙，不外乎是不知道如何開戶、英文程度不好、蒐集美國上市公司的資訊較困難等問題，儘管知道美股中有許多知名品牌企業，多數投資人仍然遲遲不敢下手。


    但現在這些疑慮都已經逐漸消除，不管是台灣券商的複委託服務，讓你使用自己熟悉的券商下單軟體就可以買進美股，海外的大型網路券商也都提供了中文化的下單軟體以及中文客服，讓你在任何時間有問題時都能直接聯繫解決。以我過去的經驗，海外券商的客服非常強大，幾乎所有問題都可以即時處理，客戶體驗非常良好。


    如果擔心把自己的錢匯到海外帳戶會有風險，建議可以先開立一個台灣的複委託帳戶。早點開始投資，就可以早點開始累積資產，早點達到理想中財富自由的目標。


    #### 美股券商比較


    目前投資美股主要有兩種方式，第一種是直接在海外的網路券商開立帳戶，另一種則是由券商提供的複委託服務，即投資人不需要在獨立海外帳戶，而是委託國內券商幫你買賣國外的股票，好處是如果原本就有買賣台股，國內券商大多提供複委託服務，開通手續簡便。投資人可以根據自己的需求，選擇最有利的券商來進行交易。


    以我常用的網路券商來說，主要有盈透、德美利（TD Ameritrade，簡稱 TD）與複委託帳戶，主要的差異在於手續費、可交易商品與融資成本。


    #### 主要特色


    由於美國許多券商包括德美利、第一證券（Firstrade）與嘉信證券（Charles Schwab）都已經實施買賣股票、ETF 零手續費的服務，新手投資美股時，建議從這些低手續費的券商開始，降低自己的交易成本。


    而不敢把資金匯出至國外銀行的投資人，可以選擇台灣券商的複委託服務，雖然手續費較高，至少早早買早享受，優先享受股價上漲的好處，一旦開始從美股中獲利，相信就有充分的動機去找尋更好、CP
    值更高的服務。關於券商特色比較請參考表 1。


