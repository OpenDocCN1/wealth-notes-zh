    ## 第15章


    # 生活美股：食

    民以食為天，新型態飲食契機


    在第二部到第四部，主要以選股時應注意的三大面向（產業面、基本面與技術面）進行討論，希望有助於讀者分析個別企業的發展前景、營運表現及股價型態的判讀。


    對於想要踏入美股市場的投資人，除了幾個熟知的企業外，還有什麼公司值得投資呢？事實上，最簡單的方式就是從生活中發掘投資商機。本章就從與我們最切身相關的「食」談起，因為即便經濟再不景氣，每個人總是要吃飯，填飽肚子才有氣迎接未來的挑戰。所以不管在順風或逆風，和吃有關的行業需求都會持續存在。


    # 保持穩定，以現金流爲目標


    在美股中，整條食品產業鏈有各式各樣的公司可以投資，包括我們最熟悉的「可口可樂」、「百事公司」（PepsiCo Inc.，美股代號PEP），烹飪時必須使用的調味料如「味可美」（McCormick
    & Company，美股代號MKC），或是擁有哈根達斯（Häagen-Dazs）、冰淇淋、綠巨人等知名品牌的「通用磨坊」（General Mills，美股代號GIS）。這些都是美股中歷史相當悠久的公司，擁有強大的品牌優勢，因此能在市場上長期屹立不搖。


    投資人在挑選個股時可以發現，這些公司因為具有下列兩大特性，因此未來能持續帶來穩定的現金流：


    - 一、營收可預測性：因為這些公司具有品牌優勢，產品在市場上有一定程度的需求，加上有穩定的現金流進行新產品研發與併購行動，讓公司維持一定程度的成長性。

    - 二、獲利能力穩定：規模優勢讓公司的不同產品可以共用產品線，所以即便是在競爭激烈的環境下，也能藉由降低成本與提高生產效率來維持獲利能力。


    以可口可乐為例，從財報中可看出，近幾年因為健康意識抬頭，人們對於碳酸飲料的需求下滑，導致營收從二〇一三年開始顯著衰退，平均每年衰退4%，到二〇一九年只剩下約三七三億美元（參表48）。


    雖然公司在開源方面遭遇困難，幸好節流措施做得不錯，仍維持頗佳的獲利能力。


