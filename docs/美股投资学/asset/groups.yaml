    勢，讓產品比同業有更好的定價權，毛利率一直維持在穩定的水準，平均維持在五○% 以上，比同產業中的公司都還高（參表52），營業利潤率與淨利率的表現也相當優異。


    二〇一七以來，雖然零售業的衰退對許多運動品牌造成不小的衝擊，但Lululemon 的管理層非常優秀，在策略執行和達成度上都有傑出的表現，包括男裝比例的提升與海外市場的發展。公司在二〇二〇年第二季的財報提到，新開設的九家店面中就有四家位於中國市場，亞太市場的實體店面突破一百家，在需求持續上升的情況下，未來仍為主要發展重點。除此之外，二〇二〇年以五億美元併購開發健身鏡的新創公司「Mirror」，也將公司的業務範圍擴展到居家健身市場。


    # 競爭對手


    耐克、愛迪達與 Under Armour 等運動品牌都是 Lululemon 的競爭對手，不同的是，Lululemon 的產品一開始就不依賴經銷商，而是透過品牌專賣店與網站進行銷售，並在品牌專賣店內開設瑜伽課程，培養顧客的品牌忠誠度。由於做出了自己的產品區隔，因此就算瑜伽褲售價超過新台幣三千元，仍讓顧客心甘情願掏錢購買。'
