    ### 圖 34 亞馬遜 2019 至 2020 年股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_212_1.png)


    圖片來源：Tradingview


    RSI 指標的數據非常容易取得，投資人不需要深究計算方式，但要了解該指標通常採取十四天的數據，由市場上的買盤與賣盤計算得出，其數值介於零到一百之間。數值愈大，代表市場上的買盤愈強，股價上漲氣勢愈盛；數值愈小，代表市場上的買盤愈弱，股價下跌的情況有很大機率會持續下去。


    一般來說，RSI 指標高於七十時代表超買，低於三十時則代表超賣，但在美股中，由於股價上漲的延續力道相當強勁，即便處於超買階段，也不代表股價會馬上反轉下跌。不過當股價短期內飆漲到一定程度、買氣逐漸趨緩時，RSI
    指標由超買區向下跌破七十，則有可能引發股價進一步下跌。或者股價在創新高的過程中，RSI 指數數值並沒有跟著創下新高，形成背離狀況（參圖 35），這時投資人才需要採取動作。


    利用 RSI 來追蹤股價當前的價格變化，我們可以藉此評估漲勢是否能夠延續，調節手中漲多的部位，進行投資組合的彈性配置。


