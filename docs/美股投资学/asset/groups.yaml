    我們可以藉由了解各產業的特性，擬定並執行自己的投資策略。例如面對景氣的擴張期，成長性最大的金融與科技類股似乎是最好的選擇；進入趨緩期，可以配置受景氣影響較小的必需消費類股與健康照護類股；當景氣落入衰退，防禦型的必需消費類股與公用事業類股最受到市場青睞；等待景氣谷底翻揚、重新進入復甦期時，再將資金投入到非必需消費類股與房地產類股，跟著經濟的復甦一起成長。


