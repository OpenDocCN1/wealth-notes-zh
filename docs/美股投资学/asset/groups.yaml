    # 第2章

    新手進入美股的第一張地圖


    對現在投資人來說，投資美股市場已經不是一件遙不可及的事。過去許多投資人對於前進美股市場的障礙，不外乎是不知道如何開戶、英文程度不好、蒐集美國上市公司的資訊較困難等問題，儘管知道美股中有許多知名品牌企業，多數投資人仍然遲遲不敢下手。


    但現在這些疑慮都已經逐漸消除，不管是台灣券商的複委託服務，讓你使用自己熟悉的券商下單軟體就可以買進美股，海外的大型網路券商也都提供了中文化的下單軟體以及中文客服，讓你在任何時間有問題時都能直接聯繫解決。以我過去的經驗，海外券商的客服非常強大，幾乎所有問題都可以即時處理，客戶體驗非常良好。


    如果擔心把自己的錢匯到海外帳戶會有風險，建議可以先開立一個台灣的複委託帳戶。早點開始投資，就可以早點開始累積資產，早點達到理想中財富自由的目標。'
  - '[PAGE 39]


    # 美股券商比較


    目前投資美股主要有兩種方式，第一種是直接在海外的網路券商開立帳戶，另一種則是由券商提供的複委託服務，即投資人不需要在獨立海外帳戶，而是委託國內券商幫你買賣國外的股票，好處是如果原本就有買賣台股，國內券商大多提供複委託服務，開通手續簡便。投資人可以根據自己的需求，選擇最有利的券商來進行交易。


    以我常用的網路券商來說，主要有盈透、德美利（TD Ameritrade，簡稱 TD）與複委託帳戶，主要的差異在於手續費、可交易商品與融資成本。


    # 主要特色


    由於美國許多券商包括德美利、第一證券（Firstrade）與嘉信證券（Charles Schwab）都已經實施買賣股票、ETF 零手續費的服務，新手投資美股時，建議從這些低手續費的券商開始，降低自己的交易成本。


    而不敢把資金匯出至國外銀行的投資人，可以選擇台灣券商的複委託服務，雖然手續費較高，至少早早買早享受，優先享受股價上漲的好處，一旦開始從美股中獲利，相信就有充分的動機去找尋更好、CP
