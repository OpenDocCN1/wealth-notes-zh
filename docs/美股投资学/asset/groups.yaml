    #### 可交易商品與融資利息


    如果主要以美股市場為主，德美利所提供的可選擇標的就已經完全足夠。但是如果希望布局多市場的投資人，目前盈透提供三十三個國家以上的市場進行交易。而台灣券商也提供了包括美、港、日、滬港通等國家的股票給投資人選擇。


    除此之外，由於美股券商多以保證金交易，投資人只要擁有三成資金就能買進股票，並允許向券商融資來買股票，還可利用槓桿提升投資報酬率。舉例來說，如果你帳戶中的淨資產為兩千美元，從券商融資兩千美元，便可以購買價值四千美元的股票。

