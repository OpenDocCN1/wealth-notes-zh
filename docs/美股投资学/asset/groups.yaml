    資料來源：美國證券交易委員會


    # 第8章 資產負債表的重點觀察


    投資家彼得·林區 (Peter Lynch)說過：「沒有負債的公司不會破產。」獲利能力是公司的成長引擎，資產負債表則是公司的靠山，幫助公司在逆境中求生存；有足夠的資產可以維持正常營運。


    對於股價的上漲，資產負債表的影響力雖然不大，卻不能忽視它的重要性。我在觀察資產負債表時，重點是公司當前的流動性、債償能力與資本配置狀況，確認公司在突發狀況下有應變危機的能力。


    二〇二〇年新冠肺炎疫情爆發，使得許多原本正常營運的公司破產倒閉，原因就是公司在疫情期間的收入銳減，儲備資產太少，負債金額太高，導致無法繼續營運。該如何在危機來臨前先辨識出有可能發生問題的公司，資產負債表可以提供投資人線索。


    在資產負債表中，「流動資產變動」、「應收帳款變動」、「負債比率變動」是我們必須關注的三個部分。


    ## 流動資產變動


    流動資產包括了現金、有價證券、存貨、應收帳款等在一年內可以變現的資產，當流動資產愈高，表示公司具有更好的應變能力來因應環境變化。


    不同屬性的公司，流動資產的比例也會有所差異。零售餐飲業通常是以現金交易，所以帳上的現金充足。而現在有許多網路公司都是輕資產公司，除了固定資產的比例低，帳上現金也很雄厚，只要沒有過高的負債，即便目前沒有實際獲利，都還不至於會造成經營危機。


    以蘋果公司為例，其流動資產占總資產的比例為四四％，其中帳上擁有的現金與約當現金高逹三八○億美元，占比為十一％，還有能快速變現的有價證券五二九億美元，占比十六％（參表42），可以發現公司持有現金的比例很高。擁有高額的現金資產不僅能讓公司的營運更穩定，也能將資金進行更有效率的配置、收購企業或配發給股東，促進公司成長與提高股東權益。


    約當現金，指短期內具有高度流動性的短期投資，由於容易變現加上交易成本低廉，所以可被視為現金。


    ### 表 42 蘋果公司的流動資產數據


    | | 2020年9月26日 | 2019年9月26日 |

    |---|---|---|

    | **當前資產（百萬美元）** |  |  |

    | 現金及現金等價物 | 38,016 | 48,844 |

    | 有價證券 | 52,927 | 51,713 |

    | 應收帳款淨額 | 16,120 | 22,926 |

    | 存貨 | 4,061 | 4,106 |

    | 賣方非貿易應收款 | 21,325 | 22,878 |

    | 其他流動資產 | 11,264 | 12,352 |

    | 流動資產總額 | 143,713 | 162,819 |

    | **非流動資產（百萬美元）** |  |  |

    | 有價證券 | 100,887 | 105,341 |

    | 物業，廠房及設備淨額 | 36,766 | 37,378 |

    | 其他非流動資產 | 42,522 | 32,978 |

    | 非流動資產總計 | 180,175 | 175,697 |

    | 總資產 | 323,888 | 338,516 |


    資料來源：美國證券交易委員會


    ## 應收帳款變動


    在流動資產中，投資人要觀察的部分是應收帳款的變動，因為應收帳款的增減往往代表公司競爭優勢的改變。應收帳款增加，有可能代表公司收不回貨款，或是延長了客戶的付款期限所導致。但如果公司極具競爭優勢，通常都是客戶捧著現金來爭取訂單，不需要靠延長公司的收款期限來吸引客戶。也因此當應收帳款突然大幅增加時，應試著找出原因，避免未來公司因為收不回應收帳款而變成呆帳，影響獲利能力。


    從表42可以看到，蘋果公司的應收帳款還從二〇一九年的二九億美元，下降到二〇二〇年的一六一億美元，顯示收款能力變好，代表公司競爭優勢變得更穩固。


    ## 負債比率變動


    負債比率（總負債／總資產×100%）的變動是觀察一家公司營運狀況的重要指標，從這項指標可以看出有多少公司資產是來自於向外借款。當負債比率過高，公司需要負擔的舉債成本也會增加，一旦短期營運出現狀況，每個月又有固定支出的利息費用，對於公司的營運會產生相當重大的危機。


    在低利率時代，由於舉債成本低，許多公司反而偏好借錢來投資，當投資報酬高於借款成本，會讓公司的成長速度加快，股價水漲船高。不過如果是營收與獲利都不穩定的公司，除了自有資產之外還不斷地向外籌資、毫無限制地揮霍，當負債比率一直攀升時就要特別注意了。


    在蘋果公司的財報中，目前的負債總額為二五八五億美元，扣除應付帳款、遞延收入等不需支息的負債總額，除以資產總額三三三九億美元，可以得出二〇二〇年的負債比率約為〇·三六（流動負債之商業票據496＋定期債務8773＋非流動負債之定期債務87667÷總資產323888×100%=35%），低於五〇%，屬於相當穩健的水準（參表43）。


    「流動資產」、「應收帳款」與「負債比率」三個觀察項目都代表了公司的營運表現，流動資產大幅降低、應收帳款增加與負債比率提高，對公司來說都是警訊。除此之外，我们还可以透過财务指標的趨勢變化，判斷公司的資金流動性、營運效率與資本配置狀況，藉以發現異常之處。


