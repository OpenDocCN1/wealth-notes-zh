    ### 關鍵指標


    CrowdStrike 在年報中提供的關鍵指標率，包括「訂閱客戶數量」、「年度經常性收入」與「基於美元的淨保留率」，都可以用來衡量公司的營運表現與營收穩定性。


    - 一、訂閱客戶數量：由於企業開始拋棄傳統的安全軟體，將這部分的需求轉移至像 CrowdStrike 這樣的網路安全雲端服務商，使得公司的訂閱客戶數從二〇一八年的一千兩百四十二個，成長至二〇二〇年的五千四百三十一個，每年成長超過一倍，是相當驚人的成長率，也是營收快速成長的動能（參表
    34）。

    - 二、年度經常性收入：觀察這項指標的變化，可以了解公司目前的營運狀況。當年度經常性收入的成長率愈高，代表舊客戶續約與新客戶購買呈現成長狀態；但若成長率降低，則要小心客戶流失的風險，顯示未來成長性趨緩。CrowdStrike
    的年度經常性收入雖然從二〇一八年的一四○%下滑到二〇二〇年的九二%，仍維持在相當高的水準（參表 35）。


