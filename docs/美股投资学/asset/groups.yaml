    # ### 判斷趨勢方向


    我認為，判斷股價當前的發展趨勢是移動平均線的最重要功能。當移動平均線的斜率是正的，股價位於移動平均線的上方，代表公司股價走勢向上發展，屬於強勢訊號。如果移動平均線的斜率是負的，股價位於價格平均線的下方，則代表公司股價走勢向下發展，屬於弱勢訊號。


    圖26是釀果公司二〇一四至一七年的股價走勢，當股價位於三條均線之上，則呈現明顯上升趨勢，即便股價拉回整理，在均線附近也會有支撐力道，支持股價重新回到上漲軌道。而當股價開始跌破均線，就必須注意是否有反轉跡象，一旦股價跌破所有均線之下，則開始呈現明顯的下跌趨勢，在反彈沒有突破均線之前，都是相當弱勢的型態。


    移動平均線愈陡峭，代表行情的走勢速度愈快也愈強勢。當股價在短時間內飆漲或暴跌，長短期均線之間的距離會被快速拉開，一旦股價距離均線太遠，就會造成乖離過大的情況。這時可能會有短期獲利了結的賣壓出現，使得股價走勢開始趨緩，動能減弱，於是移動平均的斜率變得平坦，行情的波動縮小，所有的移動平均線會愈來愈靠近，出現股價高檔或低檔的盤整期，有相當大的機率是在醞釀下一波的趨勢發展。'
