    臉書的營收有九十八%以上來自廣告收入，這項收入從二〇〇九年的七．六億美元，成長到二〇一九年的六九七億美元，創下歷史新高。在活躍用戶持續增加的情況下，臉書從二〇一二到一九年的平均每位用戶收入也從五．三三美元上升為二九．二五美元，上漲了將近五倍之多（參圖4）。


    在廣告市場逐漸飽和、監管與競爭環境日益升溫的情況下，臉書要鞏固競爭優勢的方法一定是開拓更多獲利來源，才有辦法維持過去成長表現。未來除了廣告業務，臉書也希望藉著廣泛的用戶基數，發展數位貨幣與行動支付的業務，擴展公司的營收來源與創造下一階段的成長。二〇一九年六月提出的「LIBRA」加密貨幣計畫，預計於二〇二一年重新啟動，值得投資人關注後續的發展。


    # 亞馬遜


    亞馬遜成立於一九九四年，以網路書店起家，到現在已是一家Everything store（萬貨商店），成為網路零售的霸主。其營收來源不再只有銷售產品的收入，還涵蓋其他多種收入來源，包括實體商店、訂閱服務、第三方賣家服務、廣告收入以及最賺錢的AWS雲端服務。


    亞馬遜是全世界最大的電子商務平台之一，在美國的線上零售市場占比超過五成。雖然占比極高，電子商務占全美零售額的比例卻僅十一．二%，表示未來成長潛力仍然相當大，因此到目前為止，公司不計成本地吸收用戶、擴展市占率。亞馬遜雖是電商零售霸主，但獲利一半都是來自於AWS雲端運算服務，更是目前讓公司維持高速成長的引擎。


    亞馬遜的主要商業模式是零售，但投資人想要評估亞馬遜的未來發展，應該關注的重要指標不僅是營收的表現，更應兼顧「獲利與現金流變化」和「AWS的成長」。


    - 獲利與現金流變化：亞馬遜的營收從二○一○年的三四二億美元，成長至二○一九年的二八○五億美元，平均每年成長二七．六％，仍處於高速發展階段，不過營業利潤率僅有五％左右的水準（參表12）。要不是AWS雲端運算服務的利潤率可達二八％，整體的營業利潤率會更低。


    創辦人貝佐斯在致股東信中提到，亞馬遜致力於創造長期價值，不看重短期利益，所以賺來的錢都拿去再投資，並且以追求現金流量最大化為目標，這一點完全體現在亞馬遜的財務報表中。投資人在評估公司價值的時候，將重點放在自由現金流的變化是比較適當的。


    觀察表12，可以看到亞馬遜的自由現金流量從在一〇〇年的二五．一六億美元，到二〇一九年已經成長為二一六．五三億美元，在現金流充沛的情況下，不只公司可以更靈活地進行資本配置，也可以更積極地進行收購策略，將觸角延伸至更多領域。


    - AWS的成長：雖然主要營收來源是零售業務，AWS雲端運算服務僅占總營收的十一％，卻是亞馬遜最賺錢的部門，也是激勵股價上漲的動態來源。


