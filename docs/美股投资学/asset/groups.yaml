    # ## 第二部


    # # 用商業思維投資美股


    每一個投資人都應該把自己當成企業分析師，

    而不是股票分析師，

    也就是以經營者的眼光去看待想要投資的公司。

    好的商業模式是成功的第一步，

    但公司要如何維持商業模式中的競爭優勢，

    支持股價長期向上成長，

    是投資人下一個必須思考的問題。


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_68_0.png)'
