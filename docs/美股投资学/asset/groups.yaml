    常常造訪，並在上面進行活動。根據臉書提供的數據，到二〇二〇年第三季，臉書的日常活躍用戶（即每天至少訪問一次臉書的用戶）已達十八億人以上，月活躍用戶數（即過去三十天內曾經訪問臉書的用戶）已達二十七億人，是全球最大的社交平台（參圖3）。


    每位用戶平均收入：所謂「每位用戶平均收入」，可以每位用戶平均收入是衡量公司如何將平台上的人流進行貨幣化，轉換成真正的獲利。將某段時間內的總收入除以平均用戶人數，得到的數字就是公司從個人用戶上可以獲得的收入。以臉書來說，將廣告營收除以平均用戶數量，就是每位用戶幫臉書賺得的平均廣告收入。


    臉書的營收有九十八%以上來自廣告收入，這項收入從二〇〇九年的七．六億美元，成長到二〇一九年的六九七億美元，創下歷史新高。在活躍用戶持續增加的情況下，臉書從二〇一二到一九年的平均每位用戶收入也從五．三三美元上升為二九．二五美元，上漲了將近五倍之多（參圖4）。


    在廣告市場逐漸飽和、監管與競爭環境日益升溫的情況下，臉書要鞏固競爭優勢的方法一定是開拓更多獲利來源，才有辦法維持過去成長表現。未來除了廣告業務，臉書也希望藉著廣泛的用戶基數，發展數位貨幣與行動支付的業務，擴展公司的營收來源與創造下一階段的成長。二〇一九年六月提出的「LIBRA」加密貨幣計畫，預計於二〇二一年'
