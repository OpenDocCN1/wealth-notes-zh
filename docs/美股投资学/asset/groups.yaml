    Salesforce 提供了「剩餘續效義務」（Remaining Performance Obligation, RPO）這個指標來衡量公司的營收穩定性，判斷未來是否能夠有持續的收支。與財務體質都有持續提升，自由現金流可持續擴大，可以擁有更彈性的資本配置，也不會有短期流動性的問題，造成公司無法正常營運的危機。


