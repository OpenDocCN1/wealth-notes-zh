    資料來源：美國證券交易委員會／作者整理


    - 三、基於美元的淨保留率：「基於美元的淨保留率」的變化是衡量舊客戶續訂情況的指標，當淨保留率上升，表示公司除了原本的服務外，額外購買了其他功能；當淨保留率下滑，則表示公司減少了對服務的購買，是一項負面訊號。通常這個比率應維持在一二〇%以上。CrowdStrike
    的平台架構相當完整，在公司的 Zero 平台上提供十一個雲端模組，跨越多個大型安全市場，包括端點安全、安全和 IT 操作（包括漏洞管理）以及威脅情報，運用
    AI 人工智能建立更即時的偵測功能。在全面的服務下，讓顧客可以購買更多功能模組來提高淨保留率，大約有五五%的客戶購買四個或四個以上的模組，超過三五%的客戶購買五或五個以上的模組，讓公司在這個指標上維持穩定的水準，從二〇一八到二〇年的「基於美元的淨保留率」分別是一一九%、一四七%、一二四%。


    ### 競爭對手與未來展望


    競爭對手除了傳統的防毒軟體公司如 McAfee、微軟以及博通 (Broadcom，美股代號 AVGO) 在二○一九年併購的「賽門鐵克」(Symantec)，目前有提供網路安全的雲端服務商還包括
    Palo Alto (美股代號 PANW) 和 F-Secur (美股代號 F E Y E )、CrowdStrike。雖然不是這個市場中規模最大的公司，卻具有先行者優勢，居產業中的領導地位。


    根據研究統計，全球網路安全市場的規模在二○一七至二二年之間，每年平均會成長十二至十五%，到了二○二五年，使用雲端防護平台的用戶將占資安產業的九五%，而目前的使用率僅二○%，顯示仍有相當大的發展空間。


    在目前的市場上，CrowdStrike 是唯一一家專注於端點安全部署的純網絡安全供應商，比大多數的端點安全替代方案更有效且更易于設定、使用與進行防護。除了在美國市場打好根基，二○一九年的市場占有率比前一年還成長了一倍，在端點安全軟體中排名第四。目前正積極擴展海外市場，增加營收來源。在二○一八至二○年的會計年度，CrowdStrike
    從國際市場獲得的收入占總收入的比例從一七％成長到二六％，足見未來的發展很值得投資人期待。


    ## 第三部


    ### 用實際數據評估公司


    該如何知道自己的判斷是正確的？


    最好的方式是閱讀公司的財報，用具體的數字來佐證。


    因爲公司對於自家的商業模式、產品種類、市場分佈與未來展望通常都交代得非常清楚，只要有心讀過一次財報，對於公司的背景至少可以掌握七、八成以上。


    #### 第6章


    ##### 美股財報公布日，你應該注意的事


    該如何知道自己的判斷是正確的？最好的方式是閱讀公司財報，用具體的數字來佐證。過去閱讀台股財報時總覺得非常枯燥無聊，甚至感覺像在讀天書，讀完後還是沒辦法判定公司是否值得投資。自從開始投資美股，我對於看財報這件事大大改觀，反而覺得非常有趣，因為公司對於自家的商業模式、產品種類、市場分布與未來展望通常都交代得非常清楚，只要有閱讀過一次財報，對於公司的背景至少可以掌握七、八成以上。


    ###### 美股財報種類


    投資人想要搜尋美股公司的財報時，通常有以下几种文件格式可供選擇：


    - 年報：10-K（美國公司年報）、20-F（非美國公司年報）。

    - 季報：10-Q（美國公司季報）、6-K（非美國公司季報）。

    - 重大事項報告：8-K。

    - 內部人持股變動書：Form 4。

    - 股權變動書 SC13G、股權變動補充文件 SC13G/A。

    - 機構投資者股權變動：13F。

    - 美國公司上市公開說明書：S1（美國公司）、F1（非美國公司）。


    ##### 年報：10-K（美國公司年報）、20-F（非美國公司年報）


    在每一個會計年度結束後，美國證券交易委員會要求美股上市公司依照公司規模大小，必須在六十至九十天內提交年報，也就是 10-K，非美國註冊、但在美國掛牌上市的公司則需提交
    20-F，內容包含公司業務、組織結構、財務報表與管理層的薪酬分配等資訊，是幫助投資人進行決策的重要依據。


    想要認識一家公司，最好的方式就是從閱讀一家公司的年報開始。由於每一家公司的描述都相當完整詳細，就好像幫自己上了一堂商業分析課，增強商業思維與財務思維。


    ##### 季報：10-Q（美國公司季報）、6-K（非美國公司季報）


    在每一季結束後，美國證券交易委員會要求美股上市公司必須在四十至四十五天內提交季報，也就是 10-Q，非美國註冊、但在美國掛牌上市的公司則需提交 6-K，內容包含該季度的財務狀況、管理層的分析與討論，以及其他相關訊息揭露。若是外國在美國上市的公司，則應提交
    6-K 文件作為申報文件。


    從季報中可以觀察公司在前三個月內的營運表現，與前一年的數字進行比較，避開一年中淡旺季的影響，更好地呈現出公司的營運狀況與成長趨勢。


    ##### 重大事項報告書：8-K


    當公司有任何重大事件或公司內部變更，包括收購、破產、董事辭職或會計年度變更等事項需通知大眾時，就得提交重大事項報告書（8-K）。上市公司直接藉由 8-K 報告重大消息與異動，如此能與投資人有更好的溝通，避免媒體誤導與內線交易嫌疑。


    ##### 內部人持股變動書：Form 4


    公司董事、高階主管與其他任何擁有公司一○％股權以上的股東，在買賣股票後兩天內，皆應提供內部人持股變動書（Form 4）給美國證券交易委員會。


    內部人是最了解公司營運狀況的人，追蹤他們的進出狀況也等於提前掌握公司未揭露的訊息，而持有一定比例股權以上的大股東，對公司也會有更深入的分析和產業的研究，其實進與賣出的動作具有重要的參考價值。


    ##### 股權變動書 SC13G、股權變動補充文件 SC13G/A


    為維持公開、透明的原則，讓一般投資人能掌握上市公司股權流通情況，外部投資人初次買入美國上市公司股票、股權占公司在外流通股數五%以上時，須在一定時間內提交股權變動書（SC13G）給美國證券交易委員會。在持股公告後，當投資人持股又有發生變動（買進或賣出），則要再提交股權變動書補充文件（SC13G/A）來進行說明。


    ##### 機構投資者股權變動書：13F


    管理資產超過一億美元的機構投資人，像是避險基金、養老基金或主權基金等，在每一季結束後四十五天內，應提交機構投資者股權變動書給美國證券交易委員會，揭露目前的持股組合。由於機構投資人具有推動市場的能力，一般投資人可以藉由聰明錢的去向，評估公司股價的未來發展。


    ##### 公開說明書：S1（美國本土公司）、F1（非美國公司）


    美國本土公司申請公開發行股票時，應向美國證券交易委員會提交美國公司上市公開說明書（S1）文件，內容包含業務內容、競爭策略與優勢、財務結構、募得資金用途與可出售股份等訊息，讓投資人了解公司目前的營運狀況。若是外國公司想赴美上市，則應提交
    F1 文件作為申報文件。


    ###### 掌握財報閱讀重點，有效判讀資訊


    前面提到的重要財報資訊，都可以透過美國證券交易委員會的網站（www.sec.gov）查訊。進入網站後，從上方「Filings」下拉點選「Company Filings
    Search」（參圖 10 上圖的①），在「SEARCH」輸入想要查詢的股票代號（例如蘋果公司股票代號為 AAPL，參圖 10 上圖的②），就會出現公司的相關選項。然後再選擇想要閱讀的財報文件，即可開始閱讀（參圖
    10 下圖）。


    除了從美國證券交易委員會網站查詢資料，還可以透過公司網站中的「Investor Relations」專區取得相關資訊。進入這個專區後就能找到股價資訊、財務資訊、重大新聞稿與即將舉行的投資者活動。投資人在瀏覽公司網站時，可以了解公司的歷史沿革與產品，對於認識公司有相當大的幫助。


    前面提過，認識一家公司最好的方式就是直接閱讀公司財報，但對英文能力可能不太好的人來說，要看全英文財報通常會心生畏懼。其實如果已經大致了解公司的業務內容，只要觀察幾項重要的關鍵數據，就可以了解目前的營運狀況。接著就從美國證券交易委員會網站找到蘋果公司年報（10-K），提出幾個必讀項目來說明（參圖
    11）。


    - 會計年度（Fiscal Year）：進入年報第一頁，需要特別關注的是每家公司的會計年度有所不同。一般來說，台股的會計年度都是從每年一月一日開始、十二月三十一日結束，美股則是依據各個公司的慣例來決定財務資訊的時間段，例如蘋果公司的會計年度在每年九月二十六日進行結算。

    - 項目 1 公司介紹（Item 1. Business）：在項目 1 的內容中，會詳述目前公司銷售的產品與服務、商業模式及營運概況（包括產業概況、競爭環境與供應鏈）等重要訊息。以蘋果公司為例，投資人從這裡可以了解公司背景及目前提供的新產品與服務內容。

    - 項目 1A 風險因素（Item 1A Risk Factors）：內容包括公司在未來可能面臨的風險，包括總體經濟、政府政策與法規限制、突發事件的影響，以及供應鏈狀況與競爭對手。投資人在進行研究時，也應該把這些因素納入考量，做一個整體的理解與評估。

    - 項目 6 選定財務數據（Item 6 Selected Financial Data）：此處提供最近五年的特定營運數據，讓投資人掌握到一個比較長期的營運趨勢。例如從圖
    12 可以觀察到蘋果公司


