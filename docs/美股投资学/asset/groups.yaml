    # 存款人權益保障


    為加強保護存款人及維護金融秩序，中央存款保險公司規定，金融機構須提供每一個存戶新台幣三百萬元的存款保障來保護存款人。而若將資金匯到國外券商進行投資，美國證券投資人保護組織
    (Securities Investors Protection Corporation, SIPC) 同樣也會提供投資人一定程度的保障。'
