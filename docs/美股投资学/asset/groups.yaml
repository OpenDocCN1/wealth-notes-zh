    ## 選擇投資工具


    投資人在進行選股時，通常可以採用兩種分析方式，即「自上而下」（top-down investing）分析與「自下而上」（bottom-up investing）分析。「自上而下」分析是指先觀察總體經濟指標，例如國民生產毛額（GDP）、失業率、利率、通貨膨脹等經濟數據後，確認目前的總體經濟環境處於成長趨勢中，接著進一步檢視市場情況，找到最強勢的領導產業，挑出表現最好的公司進行投資。而「自下而上」分析的順序則是倒過來，先找到自己認為理想的投資標的，專注在某一家表現優異的好公司，投資之前先對公司進行徹底研究，包括商業模式、財務表現、未來展望等因素，再逐漸向上延伸至該產業中其他公司的表現，進行更完整的分析與研究（參圖
    1）。


    但哪一種方式最好呢？我認為兩者相輔相成。在經濟衰退、大盤表現十分弱勢時，即便是優異的公司股價表現也會受到壓抑；然而經濟開始恢復正常並開始成長時，大盤表現好，好公司的股價就有更高的可能性能打败大盤，獲得超越大盤的報酬率。


    由此可知，投資人在投資前必須注意三個重要問題：總體經濟、產業趨勢、個別企業表現。


    ## 總體經濟


    〔總體經濟循環〕指的是經濟循環，是觀察景氣變化的指標，投資人可以針對目前的總體經濟狀況做出自己的持股配置。經濟衰退時採取防禦策略，將資金配置在穩健、抗跌的資產上；經濟成長時則採取積極策略，找到最強勁的產業與公司來投資。


    世界最大避險基金「橘水基金」（BridgeWater Associates）創辦人瑞．達利歐（Ray Dalio）在《大債危機》（Principles for
    Navigating Big Debt Crises）一書中提到，一個經濟的循環與一國的債務管理有極大相關性，長期循環可以橫跨七十五年以上，短期循環則每十五年會發生一次重大危機，重塑整個經濟體系，進行資源的重新分配。而這個時候就是投資人創造財富的最佳機會。


    試想過去十年的最長牛市，不是因為二〇〇八年的金融危機而揭開序幕，當時聯準會的救市策略，降息加上量化寬鬆政策讓經濟快速復甦，帶動資產價格上漲。正當大家在想景氣榮景何時會結束時，沒人預測得到是因為二〇二〇年的新冠疫情，意外促使市場大幅回調，企業運作停擺，消費迅速萎縮，實體經濟遭受重創，許多企業因此違約倒閉。不過也因為有了過去的經驗，聯準會更積極地開創出新的工具，大規模購債與撒錢救市，資金潮進入股市形成V型反轉，也是許多投資人最好的入市機會。疫情加速了新創企業的發展，對於突破式創新科技的需求激增，為未來的循環打開一扇新的大門。


    ## 產業趨勢


    研究產業趨勢，找出市場上哪些產業處於萌芽期、哪些產業處於高速成長期或穩成長期，以及哪些產業處於成熟期、甚至已經開始衰退。處於萌芽期的產業雖然發展前景大，但有很高的不確定性，不適合一般投資人冒風險投入。而營收與獲利逐漸衰退、開始走下坡的產業則應該避開，轉去找一些仍有廣大發展空間的產業，包括創新產業、產業轉型等。


    關注產業趨勢相當重要，原因在於聰明錢的資金是會跟著賽道上奔馳最快的車跑。這很像在賽馬比賽中，賭金通常集中押注在幾匹好馬上，因為牠們更有可能贏得勝利。只要產業仍有寬廣的發展空間，吸引更多公司加入分食利潤，就好像只要這些好馬的賠率仍有利可圖，就會吸引更多的資金進場。


    ## 個別企業


    「個別企業」表現則是在成長的產業中找到領先的，並關注哪些公司從萌芽期跨到高速成長期，或從高速成長期跨越到穩健成長期。這些公司的產業前景看好、已經普及但尚未有過度競爭，企業仍可靠本身的競爭優勢來賺取超額報酬，並藉由先發者優勢來進行擴張整合，加速公司成長。任何公司的股價都是由市場對公司的成長預期來推升，唯有成長的公司，才能為投資人帶來豐厚的獲利，這也是本書主要分享的投資方式。


    如果你選擇成為一位主動投資人，這些基本功課都是在做投資組合規畫時必須注意的面向。而在美股市場中，針對這些不同性質的資產，都可以找到相關投資標的，高效率地進行你的資產配置。


    接下來就從美股中常見的商業模式開始介紹，從生活中發現商機，找到正在高速成長的趨勢產業，再觀察產業中有哪些公司處於領導地位，檢視他們的營運表現並評估未來發展，最後建構出一套完整的投資原則，幫助你在美股投資的路上走得愈來愈順。


    ## 第二部


    ### 用商業思維投資美股


    每一個投資人都應該把自己當成企業分析師，

    而不是股票分析師，

    也就是以經營者的眼光去看待想要投資的公司。

    好的商業模式是成功的第一步，

    但公司要如何維持商業模式中的競爭優勢，

    支持股價長期向上成長，

    是投資人下一個必須思考的問題。


    ![img](img/59586a9aa5c5e7f9004ef373947a8ffe_68_0.png)


    ## 第3章


    ### 賺錢公司都有獨特的商業模式


    紐約大學金融學教授亞斯華斯·達摩德仁 (Aswath Damodaran) 是一位典型的價值投資者，善用數據分析對企業進行合理的估值。他曾說：「我天生就著迷於數字，但當我研究數字時，極為諷刺的是，我對數字的研究愈多，對於完全以數字為支撐的論點就愈感到懷疑。」


    這段話告訴我們，一個好的估值方式並不只是把數據處理過並跑出結論，而是在整個過程中挖掘這家公司的良好故事，對於企業的理解愈深並找出公司的商業模式，才能體現企業的真實價值。


    #### 什麼是商業模式？


    在思考商業模式時，先回答一個問題：這家公司是靠什麼賺錢？它提供哪些產品與服務，需要透過哪些合作夥伴，以及滿足了哪些人的需求？這些都是公司在進行商業布局時所建構的「價值網」（Value
    Net），而每家公司都擁有自己的價值網，架構出獨特的商業模式。


    「價值網」的概念由經濟學家亞當．布蘭登伯格（Adam M. Brandenbeger）與貝利．奈勒波夫（Barry J. Nalebuff）提出，我認為這是在研究企業競爭、策略與發展時最重要的方法。利用價值網連結產業鏈中的每一個參與者，描繪出完整的商業情境，以一個更全面的角度去思考，在所有參與者中找出最具價值的投資對象。


    以圖 2 來分析，思考如何利用價值網來為公司創造出更大的價值。網中的參與者時而競爭、時而合作，建立起動態循環，投資人站在價值網中央，檢視企業的內部情況與優勢，也可以用旁觀者的角度來思考企業未來的成長與外部挑戰。


