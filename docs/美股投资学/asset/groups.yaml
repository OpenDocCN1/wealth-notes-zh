    ### 圖 42 頭肩底的反轉型態


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_222_1.png)


    **頭肩底：底部型態，確認低檔反轉**


    頭肩底與頭肩頂是完全相反的型態，也代表完全不同的意義。頭肩底是由三個波谷組成，主要的波谷呈現的價格最低，其餘兩個波谷則低點相近，是確認股價跌無可跌、準備鹹魚翻身的典型反轉型態。常見走勢如圖
    42。重要的確認訊號是，在價格下跌的過程中，股價雖創新低，但成交量逐漸縮減，最後挾大量上漲突破頸線。


    具有頭肩底型態的公司，通常都是股價之前歷經嚴重跌勢後陷入低檔整理，等待基本面改善與籌碼消化後，才有辦法重新振作。蘋果公司在二○一五至一六年時，因創新能力被市場質疑，結果公司股票遭到拋售，股價在當時陷入泥沼，直到二○一七年才開始有顯著的突破發展（參圖
    43）。


    再看看運動品牌耐克，二○一六年可說遭遇逆風，股價陷入低潮，歷經快兩年的整理才有明顯突破，股價在突破後開啟一段明顯的上漲趨勢（參圖 44）。更多關於耐克基本面變革的討論，請參第五部。

