    ## 運動界的大成長股：Lululemon


    同樣利用數位管道成功打造企業文化、股價大幅飆漲的運動服飾品牌 Lululemon，也是投資人值得關注的公司。


    Lululemon 成立於一九八八年，是一間總部位於加拿大的運動服飾製造商。主要商品為瑜伽服飾和配件，在十七個國家共擁有近五百家實體商店，也經營電子商務。公司經營的方式是把瑜伽服飾與配件當做精品，採用少量多樣、價格比同業貴且幾乎不打折的方式來銷售。


    ## 財務狀況


    最近十年的營收成長率平均為二四・三%，屬於高速成長公司。公司擁有的品牌優勢，讓產品比同業有更好的定價權，毛利率一直維持在穩定的水準，平均維持在五○% 以上，比同產業中的公司都還高（參表
    52），營業利潤率與淨利率的表現也相當優異。


    二〇一七以來，雖然零售業的衰退對許多運動品牌造成不小的衝擊，但 Lululemon 的管理層非常優秀，在策略執行和達成度上都有傑出的表現，包括男裝比例的提升與海外市場的發展。公司在二〇二〇年第二季的財報提到，新開設的九家店面中就有四家位於中國市場，亞太市場的實體店面突破一百家，在需求持續上升的情況下，未來仍為主要發展重點。除此之外，二〇二〇年以五億美元併購開發健身鏡的新創公司「Mirror」，也將公司的業務範圍擴展到居家健身市場。


    ## 競爭對手


    耐克、愛迪達與 Under Armour 等運動品牌都是 Lululemon 的競爭對手，不同的是，Lululemon 的產品一開始就不依賴經銷商，而是透過品牌專賣店與網站進行銷售，並在品牌專賣店內開設瑜伽課程，培養顧客的品牌忠誠度。由於做出了自己的產品區隔，因此就算瑜伽褲售價超過新台幣三千元，仍讓顧客心甘情願掏錢購買。


