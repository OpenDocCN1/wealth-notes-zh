    ## 圖 16 Finviz 的 Maps 頁面


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_178_1.png)


    圖片來源: Finviz


    側可以看到關於公司的基本資訊，包括股價、交易價格區間、成交量、殖利率、市值、估值指標等（參圖 17）。此外，Morningstar 網站根據內部的評價系統，將上市公司分成九類，稱為「晨星風格箱」（Morningstar
    Style Box），根據市值與成長／價值因子進行分類，可作為投資人在選擇投資標的時的參考指標。


    同一頁面向下轉動，就可以看到公司檔案。左側描述公司的歷史沿革、產品與服務及營收來源，右側為公司產業分類、最近一次營收公布日、會計年度日期與員工人數（參圖 18）。


    ## Key Ratios（關鍵比率）


    我自己最常使用的功能是「Key Ratios」（參圖 19 的①），這個功能提供了營收成長率、淨利成長率、營業利潤率、資產報酬率、股東權益報酬率等數據參考。之後再點選下方的「Full
    Key Ratios Data」（參圖 19 的②），就會進入新的資訊頁面。


    在 Full Key Ratios Data 頁面中，Morningstar 免費提供了最近十年的重要數據，而且都可以直接轉成 Excel 檔案，讓投資人做整理與保存，相當實用。


    追溯過去十年的財務數據，可以看出一家公司的營運穩定程度與成長趨勢。在所有數據中，我最關注的項目為「獲利情況」、「現金流表現」、「財務體質」，從這三個面向去評估公司是否值得投資。


    ### 獲利情況


    這部分主要觀察「營收」、「獲利比率」與「每股盈餘」是否能維持一個成長趨勢。獲利是一家公司股價上漲最重要的動力，一旦開始衰退，股價也會應聲下滑。


    進入 Find Key Ratios Data 頁面後，點選圖中下方的「Growth」（成長）欄位，就可以觀察到每個指標的年成長率，以及三年、五年與十年的平均複合成長率，了解公司目前處的營運週期位置（參圖
    20 區塊①）。


    ### 現金流表現


    把公司的營運現金流扣除資本支出，可以得到自由現金流。此處的資本支出是指公司為了追求成長而進行具生產力的投資，包含投資固定資產，以及購買土地、廠房和設備的金額。自由現金流愈高，代表公司不需要一直砸錢投資，把錢留在自己口袋裡，也可以發給股東（參圖20區塊②）。


    ### 財務體質


    圖20區塊③的財務指標是用來檢視公司是否會面臨流動性風險，流動比率或速動比率的數值過低或財務槓桿過高，都會讓公司承擔更高的營運風險。評估這些指標時，除了將目前的數值與過去的紀錄做比較，也應該與同產業中的公司做比較，找出一個可接受的變動區間。


    ## Financials（財務數據）


    以蘋果公司為例，在進入公司頁面後，點選最上方的「Financials」，可以查到公司當前的估值（Valuation）、成長（Growth）、財務健全（Financial
    Health）與獲利能力（Profitability）指標。此處也免費提供投資人關公司最近五年的財報數據（參圖21）。


    ## Valuation（估值指標）


    在Valuation頁面中，Morningstar將投資常用的估值指標列出，包括本益比（Price / Earnings）、股價 / 現金流比率（Price
    / Cash Flow）、股價淨值比（Price / Book）、本益成長比 (PEG Ratio) 等（參圖 22）。藉由觀察長期的估值數據，可以了解過去的股價波動範圍，對獲利穩定的公司來說，可以更好地掌握進出時機。


    ## 視覺化的分析網站・GuruFocus


    GuruFocus 網站有免費與付費兩種版本，若是使用免費版本，財報只能看到四年的數據，重要指標的長期數據大都無法查詢，是網站的缺點之一。不過優點是，進入個股介紹頁面後，網站會將當前公司各項指標數據以視覺化的方式，與過去的歷史平均值及同產業平均值進行比較，並提供個股評分參考。下面是網站中幾個好用功能的介紹。


    ### Financial Strength（財務強度）


    從首頁左上角打入想要查詢的公司或股票，進入個股頁面後，就可以看到左側的「Financial Strength」（參圖 23 的①），提供了公司的負債比率、包括現金／債務比
    (Cash-to-Debt) 、負債／權益比 (Debt-to-Equity) 、負債／EBITDA 比 (Debt-to-EBITDA) 與利息保障倍數（Interest
    Coverage）。體質強健的公司擁有較低的負債比、較高的利息保障倍數，更有能力度過營收趨緩或衰退時期。


    註⑥：EBITDA ＝ 稅後淨利（E）＋利息費用（I）＋當期所得稅費用（所得稅費用）＋折舊費用＋攤銷費用。


    ### (2)Profitability Rank（獲利能力排名）


    頁面中間的「Profitability Rank」（參圖 23的②）提供了幾種數據，包括公司的營業利潤率（Operating Margin %）、淨利率（Net
    Margin %）、股東權益報酬率（ROE %）、資產報酬率（ROA %）、資本報酬率（ROC %）以及營收成長率（Revenue Growth Rate）。獲利能力愈好的公司，激勵股價上漲的能量就愈大，也愈有可能成為下一支飆股。


    ### GF Value（GF 值）


    頁面右側的「GF Value」（參圖 23的③）是依據 GuruFocus 網站內部擬定的評估指標，計算出公司目前的真實價值，以河流圖的形式呈現目前股價處於高位、合理或低估的價格，幫助投資人更有效率地辨識股價位階。


    GuruFocus 創辦人田測產博士遵循價值原則成立了這個網站，介紹與討論許多價值投資者，包括巴菲特、葛拉漢、喬伊·葛林布雷（Joel Greenblatt）與彼得．林區等大師的投資原則，設定各種篩選條件來幫助投資人更有效率地進行研究，篩選出符合自己投資條件的公司。


    ### Peter Lynch Chart（彼得．林區圖表）


    在個股介紹頁面往下滑動，可以看到每檔個股的 Peter Lynch Chart。在《彼得林區選股戰略》（One Up On Wall Street）一書中提到，使用盈餘趨勢線作為股價是否被高估／低估的參考，當股價高於盈餘趨勢線時，代表股價被高估；當股價低於盈餘趨勢線時，代表股價被低估。


    在使用盈餘趨勢線時，原本設定的條件以「本益比等於十五」作為標準，不過這樣的標準套用在地當前的市場中很難找到被低估的公司。後來經過修正，改以過去的本益比中位數作為盈餘趨勢線的參考，以公司過去的股價波動來衡量合理的價格區間似乎更為適當。


    圖 24 為蘋果公司的彼得林區圖表，可以發現股價走勢伴隨著穩定的盈餘上漲，直到二 ○ 二 ○ 年股價開始飆漲，大幅脫離原本的軌道，這時就要注意股價是否被市場高估，有過熱的現象了。


    ### Guru Trades（大師交易）


    在 Peter Lynch Chart 上方是 [Guru Trade] 功能。GuruFocus 網站在 Gurus Latest Trades（最新大師交易）中記錄了機構投資人、避險基金與知名投資者的交易紀錄，下方則列出該個股目前的持有者，由持有最多者依序排列至最少，並顯示占總管理資產的比例。藉由觀察這些聰明錢的流向，就可以提早發現潛在的獲利機會。


    ### DCF Calculator (現金流量折現計算機)


    在個股頁面中，Gurufocus 還提供了免費的現金流量折現計算功能（參圖 23 的④），投資人可依照網站的預設參數或自行輸入參數，計算出目前的合理股價。


    以蘋果公司為例，網站上的預設值如下（參圖 25）：


    - 一、計算基準預設為最近十二個月的每股盈餘的數字進行計算。

    - 二、成長率 (Growth Rate)：網站預設為過去十年的平均成長率，數值不小於五 % 與不大於二○○%（若成長率小於五%，則預設為五%；若成長率大於二○%，則預設為二○%）。

    - 三、終值成長率（Terminal Stage）：網站預設為四%，這是指公司跨越高速成長階段後的成長率。

    - 四、折現率（Discount Rate）：折現率為投資人的預期報酬率，設定的數值應高於大盤平均報酬，網站的預設值為十二%。


    根據網站設定的參數計算出蘋果公司目前（二〇二一年一月二日）的合理股價為七二．二二美元，實際股價為一一三二．六九美元，超出合理股價八三．七%，判斷目前股價處於高檔。投資人計算出來的合理股價可作為進出場的參考依據，但要提醒一下，運用現金流量折現法還需預估公司的未來成長率，但營運狀況是會隨時間與環境而變化，投資人對於股價的判斷也應隨著資訊的更新而動態調整，才不會因為被估值錨定而錯失進場機會。


    ### Dividend（股息）


    GuruFocus 網站也提供個股股息查詢的功能（參圖 23 的⑤），資訊相當完整。進入股息頁面後，顯示公司從哪一年開始股息持續成長，還有殖利率（Dividend
    Yield）、股息發放率（Dividend Payout Ratio）、近五年的平均股息成長率（Growth Rate）、成本殖利率（Yield On Cost）與回購率（Share
    Buyback Ratio）等資訊。


    ### Total Return Calculator（總報酬計算機）


    在Dividend（股息）頁面下方有「Total Return Calculator」功能，可以計算出持有該股票（含資本利得與股息收益）的總報酬，頁面右側還顯示了殖利率走勢圖。殖利率的計算公式是股息除以股價，當長期穩定配息的公司殖利率來到高檔或低檔時，可能代表股價被低估或高估。


    # 第四部


    # 用圖表判讀買入時機


    研究完公司的基本面後，投資人若想要再更全面地評估一家公司，應該在決策流程中加入最後一項工具——技術分析。當你客觀地面對技術分析這項工具、讓它爲你所用時，它反而能幫助你擺脫情緒的影響，做出更理性的投資決策，讓你可以更好地掌握進出場原則。


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_194_0.png)


    # 第11章


    # 評估股票，必須加入技術分析


    在前述章節中，用了很多篇幅討論如何判斷一家公司是否處於高速發展的產業、公司的財務體質是否良好，以及這家公司是否適合作投資。不過在研究完公司的基本面後，投資人若想更全面地評估一家公司，應該在決策流程中加入最後一項工具——技術分析。


    講到技術分析，很多人馬上聯想到許多常見的技術指標如〔隨機指標〕（Stochastics Oscillator、KD）、〔平滑異同移動平均線指標〕（Moving
    Average Convergence Divergence、MACD），然後就產生排斥的念頭。但我認為，投資最重要的應該是觀察趨勢的變化，虛心接納所有市場上的訊號，並從中找出對自己有利的線索。


    舉例來說，技術分析就如同在YouTube 影片下方看到的點擊率數字，你無法從這個數字斷定這部影片的品質好不好，但可以知道人氣高不高，以及現在的趨勢是什麼。技術分析匯集了每一位投資人進行的動作（買進或賣出），並以數字或線圖呈現出來。


    加上技術分析不僅只有指標判讀，也涵蓋了股價型態的辨識技巧。當你客觀地面對技術分析這項工具、讓它為你所用時，它反而能幫助你擺脫情緒的影響，做出更理性的投資決策，讓你可以更好地掌握進出場原則。


    ## 降低機會成本


    投資中重要的一個概念，就是「機會成本」。它代表了個人、投資者或企業等不同主體的潛在收益，有可能因為選擇了其他的替代選項而犧牲潛在收益。由於機會成本往往是無形的，所以很容易被一般人忽略，也因此導致許多令人扼腕的結果。


    當一個人在決策過程中面臨衆多選擇、思考著哪個選項對自己最有利時，就該考慮機會成本的問題。假設有兩個選項A和B，一旦選擇了A而放棄B，則機會成本就是指你放棄B的價值。


    在投資市場中，每個人的資金都是有限的，如何讓它在有限的資源下發揮最大的價值，根據每個投資標的進行分析、比較與投入，就是一種機會成本的比較。透過基本的研究，我們可以對所持有股票的公司有更深入的認識。當公司面臨短期的營運狀況時，投資人可趁低檔撿便宜，並享受價格回歸到內在價值的好處。而正因我們認為這些公司比其他漲多的公司更具有上漲的潛力且獲利空間更大，損失的機會成本就更小。


    ## 讓價格回歸價值


    而將技術分析加入到決策流程中，能幫助我們降低機會成本。與上述挑選投資標的不同的是，在這個環節我們比較的不是潛在獲利機會，而是「時間」，也就是在同樣的獲利條件下，哪一個選項能用最短的時間達到預設的報酬率。而在這樣的投資邏輯下，就能讓資金的配置效率達到最佳化，更快累積我們的財富。


    該用什麼方式降低機會成本、提高投資報酬，而價格又如何回歸到價值上，做法就是把基本分析結合技術分析，才能了解背後的邏輯並做全盤思考。


    首先，以純粹的價值投資來說，在不考慮一家公司的成長價值，就目前擁有的資產中藏有其他隱含價值或被市場給予樂觀的期待而高估；而當股價低於公司價值時，也有可能是市場對於公司的前景過於悲觀，寧願以低於價值的價格賣出，也不願意持有。


    這是價值投資者最擅長的領域，憑著敏銳的察覺力找到被低估的股票，賺取豐厚的報酬。價值投資之父葛拉漢曾說：「這個市場總會有一股神祕的力量讓價格回到價值。」但是，這樣調整的時間需要多久則無法確定，會用什麼樣的方式來進行也沒辦法預測。


    以過去的紀錄來看，有幾種方式可以促使一家公司的價值回歸。第一種是公司的經 營管理層表現出眾，大刀闊斧地進行改革與重整，讓公司重新恢復活力，使投資人對公 司的未來展望重拾信心，開始買進公司股票，激勵股價上漲。


    另一種方式則是主動型投資人 (active) 常採用的策略，他們會買夠多的股份進入 董事會，主導企業的決策，在過程中逐漸釋放出具企業價值，讓其他投資人也注意到公司
    的轉變，開始買進股票推高股價，也讓這些主動型投資人大賺一筆。只不過一般投資人 沒有主動投資人的資源可以利用，很難靠這種方法獲利致富。


    最後一種我認為是一般投資人最適合、也最能掌握的方法，那就是觀察市場變化， 追隨有重大事件公布或股價突然劇烈波動的公司，了解這些公司是沒有任何「催化劑」 發生，讓投資人發現公司內在價值的提升，驅動股價反轉。


    常見的催化劑包括企業進行轉型或變革時，更換原本經營不善的管理者、出售效率 不彰的資產、調整營運策略來提振營收等措施，使公司的營運狀況獲得改善，轉虧為 盈；或是公司所屬的產業開始高速發展，推出新的產品與服務受到客戶青睞，成為市場
    上的主流，於是營收開始大幅成長，也造成股價上漲。


    催化劑是股價動能的來源，所謂「動能投資」就是源於市場上大多數投資人開始 注意到某檔股票並且買入。由於需求上升、資金流入，形成一股強烈的推升力道，促使 股價快速上漲。市場上資金流入的動能會開啟一波股價上漲的新趨勢，投資人若是在這時進場布局，也可以為自己帶來相當不錯的報酬率。


    打開股價線圖，在催化劑發生的同時，往往也是技術面重要的關鍵位置。由於美股沒有漲跌幅的限制，在重大消息公布時，股價通常會有跳空現象產生，脫離原本橫盤整理的區間，成為型態上的強勢訊號，是投資人可以考慮的進場位置。接下來幾章會就幾個重要的技術型態做詳細介紹，幫助投資人嗅出訊號，做出正確決策。


    # 第12章


    # 最簡單好用的技術分析：移動平均線與趨勢線


    投資人在市場的目標是什麼？答案一定是找到會上漲的股票，因為沒人看到剛買進的股票一直下跌還會開心。只靠基本面分析雖然可以找到好公司，卻沒辦法預測買進後的股價會先上漲還是下跌，這時加入技術分析因素，幫助判斷當下的情境是否對自己有利益就相當重要。


    在採用技術分析為輔助工具時，不需要把所有指標都套用進來，而應專注於觀察股價的型態變化，例如目前屬於強勢型態、整理型態或弱勢型態，辨別公司當下所處位置，找到最合適的進場時機。最主要的判斷依據，就是「移動平均線」與「趨勢線」。


    ## 判斷趨勢的指標：移動平均線


    在技術分析中，移動平均線是非常基礎卻具有重要意義的指標。計算移動平均線的方 式，是加總特定时間段內的成交價格，除以交易日數來計算出平均值，利用這樣的方式來減少股價隨機波動的影響，平緩這段時間持續變化的價格數據。


    ### 移動平均線的三種架構與判讀


    由於股價是每天更新，透過移動平均線可以讓投資人更容易判別股價的趨勢變化。除此之外，幾乎每一家的看盤軟體都提供移動平均線的指標資訊，投資人相當容易取得，如果能夠善用移動平均線，對於投資決策也有很大的幫助。


    一般來說，我最常參考的移動平均線有三種時間架構：


    - 一、二十日均線：也代表月線，計算最近一個月的股價平均成交價格。

    - 二、五十日均線：也代表季線，計算最近一季的股價平均成交價格。

    - 三、兩百日均線：也代表年線，計算最近一年的股價平均成交價格。


    由於移動平均線是基於過去的數據來計算，屬於滯後指標。移動平均線涵蓋的時間愈短，愈可以表示近期的股價表現；而涵蓋的時間愈長，雖然可以顯示股價長期的表現，但滯後性也會愈大。所以，移動平均線不應該拿來作為預測工具，而應該作為確認

    '
