    # 生活美股：衣

    ——健身正夯，運動品牌成為新時尚


    當人類的生活品質不斷提升、平均壽命延長的同時，如何讓自己過得更健康，是每個人追求的目標之一，這也使得健康概念蔚為主流，其中「健身」成為生活中不可或缺的。


    在趨勢的發展下，由健身衍生出來的商機無限，帶動了傳統產業掀起變革。接下來，我將介紹兩家既懂得適應環境的快速改變、又具備創新能力公司，分別是「耐吉」和「lululemon」（美股代號
    LULU）。


    # 運動界的不敗霸主：耐吉


    耐吉是全世界最大的運動鞋、運動服飾和器材的供應商，旗下除了耐吉，還擁有'
