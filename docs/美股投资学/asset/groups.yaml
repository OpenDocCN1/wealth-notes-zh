    # 未來展望


    電動車產業目前正處於高速發展階段，根據統計，從二〇一九到二六年，全世界的電動車市場規模預計成長五倍之多，在二〇二六年將達到五六七〇億美元的市場規模，年複合成長率為十五．六％。特斯拉自謂為能源公司，積極研發再生能源技術，包括電動車必備的電池技術，在公司的電動車市場份額為世界第一、占比達十八％且持續成長的情況下，正行駛在寬廣的產業賽道上。


    目前特斯拉提供的車型包括銷售最好的Model 3、Model S/X與Model Y，銷量比起過去都有顯著成長，公司在加州費利蒙與上海的超級工廠產能持續增加，預計在柏林和德國的工廠開業後可帶來更高的產量，順利交付並提振營收。


    而最具成長潛力的，莫過於特斯拉自動駕駛技術的實現。由於特斯拉擁有大量的內部技術，隨著硬體與軟體的結合，更多數據的蒐集讓整個系統可以變得更聰明也更強大，成為特斯拉獨有的競爭優勢，讓對手在這個部分難以超越，也讓市場對特斯拉的股價可以有更高的期待。


    # 共享經濟獨角獸：Uber


    Uber（美股代號UBER）創立於二〇〇九年，來自創辦人加勒特·坎普（Garret Camp）與特拉維斯·卡蘭尼克（Travis Kalanick）在大雪中招不到計程車而產生的構想，打造出透過手機軟體媒合司機與乘客的共乘軟體，成為一間共享經濟公司，翻轉了原本的計程車業。


    全世界正處於從擁有汽車轉向運輸及服務（Transportation-as-a-Service，TaaS）的新商業模式，快速發展的進程受到投資市場矚目。二〇一九年公開上市時，Uber的服務已經遍及全世界六十三個國家，擁有超過一一億名用戶，每季的載運次數超過十億次。除此之外，Uber在二〇一四年推出餐點外送（Uber
    Eats）服務，二〇一七年推出卡車貨運（Uber Freight），並致力於研發自駕車和城市空運服務等未來科技。


    # 財務狀況


    Uber的營收自二〇一七年的七九・三三億美元，到二〇一九年營收已達到一四〇億美元，平均每年成長五〇%以上，仍處於相當高速的發展趨勢。公司的主要營收來源分為三個部分，乘車服務占總營收的七六%，餐點外送占總營收十八%，貨運服務占總營收5%（參表57）。


