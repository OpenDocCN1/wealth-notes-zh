    ## 未來展望


    後疫情時代，加速了所有產業的數位轉型，餐飲業也是如此。在新冠肺炎疫情的影響下，許多實體店面被強制關閉，或禁止在室內用餐而改為外帶，卻因此大幅提高了 App
    網路訂餐、顧客忠誠計畫與外送服務的普及程度，讓顧客可以更方便、更快速地享用餐點，並藉由數據分析來提高產品質量與顧客滿意度。


    長遠來看，Chipotle 未來的成長性可由兩部分來觀察：


    - **一、新店開設**：二〇一七、一八年開設新店的速度放緩，著重內部管理。依公司年報所提，二〇一九年計畫開設一百四十至一百五十五家分店。而海外開店部分，管理層則較保守，認為
    Chipotle 產品的口味不適合推向國際市場，如此反而可能有損公司的獲利能力。

    - **二、線上訂單系統的發展**：外送訂餐的趨勢逐漸普及，根據 Statista 統計，二〇一九年線上訂單成交金額達到一九五億美元，二〇二三年將達到二四五億美元。而
    Chipotle 的線上訂單系統做得很早，也做得相當不錯，執行長尼可希望未來三年能將公司從線上訂餐獲得的收入份額提高到五〇%以上。不管是餐點製作效率或消費集點的忠誠計畫，目標在於提升消費者良好的使用體驗，促使他們未來持續消費的可能性。


    雖然 Chipotle 的管理層認為自己不適合走向國際，但投資人在關注其他餐飲股時，仍可觀察公司是否有發展網購管道、打造新型態的用餐模式，以及是否能拓展海外市場，因為美股中的餐飲股不會只聚焦美國市場，而會以全世界為目標，積極向外展店。


    像 Chipotle 這樣具成長性的餐飲股在美股中相當常見，由於美股公司提供的產品與服務皆以全世界為市場，餐飲業又有持續性需求，能靠著持續開發新餐點來吸引不同的顧客群。除了在美國快速展店，也能擴張到海外市場，讓獲利持續成長。若對美國上市的餐飲股有興趣，可參考其他相關公司，如達美樂（Domino''s
    Pizza，美股代號 DPZ）、達登餐飲（Darden Restaurants，美股代號 DR）、麥當勞（美股代號 MCD）、星巴克（美股代號 SBUX）與百勝餐飲集團（Yum!
    Brands，美股代號 YUM）。


    ## 生活美股：衣

    ### 健身正夯，運動品牌成為新時尚


    當人類的生活品質不斷提升、平均壽命延長的同時，如何讓自己過得更健康，是每個人追求的目標之一，這也使得健康概念蔚為主流，其中「健身」成為生活中不可或缺的一部分。


    在趨勢的發展下，由健身衍生出來的商機無限，帶動了傳統產業掀起變革。接下來，我將介紹兩家既懂得適應環境的快速改變、又具備創新能力的公司，分別是「耐吉」和「lululemon」（美股代號
    LULU）。


    #### 運動界的不敗霸主：耐吉


    耐吉是全世界最大的運動鞋、運動服飾和器材的供應商，旗下除了耐吉，還擁有 Converse、Hilfiger 和 Jordan 等品牌，透過經銷、專賣店與網路平台將產品銷售至全世界。雖然享有品牌的競爭優勢，股價卻在一六年遭到重擊，一度下跌超過二〇%。原因在於競爭對手「愛迪達」（Adidas，美股代號
    ADDY）在產品與行銷上，扭轉了過去運動品牌只有機能性卻沒潮流感的形象，運用獨到的行銷手法，藉由名人和社群網路傳播，將過去曾經輝煌的產品再一次推向流行高峰，使得耐吉的銷售倍感受壓。


    不過，話題與流行終究是短期產生的效應，投資人在熱潮過後還是應該回到基本面，檢視公司是否具有堅實的財務基礎、穩定的成長與獲利，這才是長期最該關注的部分。下面三個面向是投資人必須關注的重點：


    - **一、財務體質**：消費者對品牌的偏好變化相當快速，只要抓對口味，隨時有可能翻身。因此投資人需觀察公司在面對市場變化時，是否仍有充足的資本因應，並透過持續創新來突破逆境。

    - **二、產業競爭**：零售產業的競爭十分激烈，因此除了流行的敏銳度，新商品的開發與行銷活動的規畫都很重要。以往只強調機能性的運動品牌逐漸走向生活化、時尚化，爭取更大的市場。

    - **三、景氣循環**：非必須消費品類的支出會因為經濟變化而改變。景氣熱絡時，人們會多消費，對於奢侈品的支出更多；景氣衰退時則會減少支出，使得公司的營收表現受到影響。


    ## 財務狀況


    檢視耐克過去五年的財務表現，可以理解公司一直保持著相當穩定的成長步伐，二〇一一到二〇二〇年的平均營收成長率為七%。不過二〇一六年的營收成長率從二〇一五年的
    0.8% 下滑到 5.8%，顯著的下滑幅度嚇壞了投資人，股價也應聲下跌。公司管理層立刻採取應變措施，致力於創新，並改變行銷策略，以年輕人與女性產品市場為目標，同時積極發展網路銷售平台。此舉讓公司的營收又逐漸重返正常軌道，股價也重新振作。


    對穩健成長型的公司來說，如何保持獲利能力是最重要的目標。耐克的品牌優勢，使它在競爭激烈的環境下仍可維持產品售價。加上紡織材料隨著科技而逐漸改良，產品價格跟著上漲，銷售費用控制在總收入的三成左右，毛利率與營業利潤率即便在營收成長趨緩時也能保持穩定，過去十年的毛利率一直維持在四三至四六%之間，營業利潤率幾乎維持十三%以上，是相當優異的表現。


    不僅獲利表現穩定，耐克的現金流也保持穩健增長趨勢。近幾年由於公司的營運重點放在數位平台的發展，讓資本支出提高，但這對公司未來的營收表現是有幫助的，屬於具有長期效益的投資。在二〇二〇年的新冠疫情中，要不是有線上購物的支援，抵銷了實體店面關閉造成的傷害，公司極有可能面臨更大的虧損。


    再加上自由現金流量保持充裕，除了將充沛的現金以股利方式分配給股東，也持續回購庫藏股，減少在外流通的股數。耐克從二〇一一年開始每年支付股息給股東，最近十年股息平均每年成長十四%，是具有成長與穩健股息的好公司（參表
    51）。


    ## 競爭對手


    耐吉的競爭對手包括愛迪達、Lululemon（美股代號 LULU）、安踏體育（股票代號 2020.HK）、威富公司（VF Corporation，美股代號
    VF）等品牌。


    運動服飾品牌的競爭相當激烈，耐吉能夠維持競爭優勢的主要關鍵，在於產品的品質、價格與創新能力，透過「直接面對消費者」（Direct to Consumer,
    DTC）的數據蒐集和分析，掌握市場流行的快速變化，持續提高營運效率與獲利能力。


    ## 未來展望


    在二〇二〇年的疫情中，全球實體門市幾乎無法營業，營收因此受到重擊。但危機也是轉機，耐克藉此推出健身 App「Nike Training Club」，在疫情期間下載量超過八百萬次，比二○一九年增加三倍。耐克運用
    App 打造與消費者的緊密關係，提高消費者的體驗與忠誠度，對於公司品牌形象大有助益，也幫助公司更加了解用戶需求，打造更好的產品。


    除此之外，疫情也使得消費習慣跟著改變，由以往的實體店面轉向網路商店購買，耐克「直接面對消費者」部門營收連續兩季度成長超過七五%，原本預計在二○二三年度線上銷售占總營收比三○%的目標提早達成，公司也將未來目標提高至五○%。


    圖 45 是耐克「直接面對消費者」的收入，可以看出從二○○九到一九年呈現穩健成長趨勢，占比已達三○%。如果未來可以將線上銷售的占比提升，對耐吉的獲利能力將大有改善。


    管理層預估，透過線上銷售產生的收入要比批發銷售產生的收入高出一倍，毛利率更高，讓營業利潤成長兩倍。店租或人力成本下降以及物流妥善管理，都將提升耐吉的毛利率，創造更多的成長機會。


