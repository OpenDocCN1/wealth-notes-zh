    # 第 7 章

    損益表的重點觀察


    投資美股的目的，是要找到一家長期成長的好公司，跟著公司的成長一起獲利！而損益表是了解一家公司的成長性與獲利能力最好的資訊來源，投資人可以因此知道這家公司的營收表現、成本控管能力與獲利能力。公司的營收表現是股價成長的引擎，獲利則是源源不絕的動能，支持股價走勢一路上漲。


    在損益表中，「營收與營收年成長率」、「毛利率」、「營業利潤」和「淨利率」是我們必須關注的幾個重點。


    # 營收與營收年成長率


    觀察營收與營收年成長率，可以幫助投資人辨認這家公司目前所處的生命週期，是處於成熟、穩健成長還是高速成長。唯有理解自己持有公司的屬性，才能對公司的股價'
  - '[PAGE 155]


    做出合理預期。


    依照營收成長率的高低將公司進行分類，可以避免給予公司過高的期待，實際上卻沒有得到應有的報酬率。由過去的經驗來看，我會將營收年成長率低於一○％的公司歸類為「成熟型公司」。這些公司的股價波動平緩，但是只要營運良好，擁有穩定的現金流，就可以持續支付穩定的股息給投資人。因此，投資這類公司以領股息為目標。


    營收年成長率介於一○至二五％的公司，我歸類為「穩健成長型公司」。這些大都是規模較龐大的公司，而且已經擁有穩定的營收來源，他們會持續推出新產品，積極搶占市場以擴大市占率，或是直接用併購策略來創造新的成長動能，帶動股價持續上漲。由於股價趨勢向上，投資人以合理價買進，兼具資本利得與股息收益。


    而營收年成長率超過二五％、甚至創造出三○至四○％以上成長率的公司，我歸類為「高速成長型公司」。這些大都是中小型企業，所以股價的爆發力大，股價上漲的速度也很快。但投資人須注意，這些公司雖然擁有高成長性，卻缺乏穩定性，甚至尚未有實際獲利，一旦成長開始趨緩或未達得到市場預期，股價也會快速反轉。由於這類公司股價波動劇烈，因此投資策略以資本利得為主，須嚴格控制風險。


    蘋果公司的整體營收年成長六％（參表37），會被投資人放到成熟型公司這一類，因為認為股價沒有向上發展的可能性。但事實上，蘋果的股價在二〇二〇年創下歷史新'
  - '[PAGE 156]


    高，總市值突破兩兆美元。


    但如果有看過公司年報，便會了解公司目前正處於轉型階段，希望能提高手機以外的產品與服務銷售比重，打造新的商業模式，再造成長循環。


    觀察二〇二〇年的年報數據（參考表38），可以看到 Apple 的營收在智慧型手機市場已經飽和的情況下，二〇一九、二〇二〇年都是呈現衰退趨勢，但 Mac 和
    iPad 的營收都還有兩位數的成長，表現算不錯。


    蘋果公司這兩年的股價飆漲，主要因市場對穿戴式裝置及服務收入的成長潛力看好而給出高估值。穿戴式裝置包括 AirPods、Apple TV、Apple Watch、Beats
    products、HomePod 等產品，而服務收入則包含 AppStore、數位內容訂閱與其他服務。


