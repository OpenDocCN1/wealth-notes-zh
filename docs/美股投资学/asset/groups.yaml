    將線上銷售的占比提升，對耐吉的獲利能力將大有改善。


    管理層預估，透過線上銷售產生的收入要比批發銷售產生的收入高出一倍，毛利率更高，讓營業利潤成長兩倍。店租或人力成本下降以及物流妥善管理，都將提升耐吉的毛利率，創造更多的成長機會。


    # 運動界的大成長股：Lululemon


    同樣利用數位管道成功打造企業文化、股價大幅飆漲的運動服飾品牌 Lululemon，也是投資人值得關注的公司。


    Lululemon 成立於一九八八年，是一間總部位於加拿大的運動服飾製造商。主要商品為瑜伽服飾和配件，在十七個國家共擁有近五百家實體商店，也經營電子商務。公司經營的方式是把瑜伽服飾與配件當做精品，採用少量多樣、價格比同牌貴且幾乎不打折的方式來銷售。


    # 財務狀況


    最近十年的營收成長率平均為二四・三%，屬於高速成長公司。公司擁有的品牌優'
