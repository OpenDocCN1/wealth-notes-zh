    以股息收益為目標的投資人，像可口可樂這樣的績優企業是不錯的選擇，可以根據本益比、殖利率等估值指標來判斷合理的入場價格。以二〇二〇年來看，可口可樂的本益比為二七．九三倍，預估未來本益比為二四．六九倍，相較於過去五年平均本益比四四．九倍，尚處於合理的水準。殖利率為三．○五％，與過去五年平均殖利率三．二二％差距不大。


    # 聚焦成長，以成長性爲目標


    如果想要選擇成長性高的食品股投資，餐飲股會是更好的選擇。現代人因為忙碌而沒太多時間煮飯，只能餐餐當「老外」（三餐老是在外），而速食就成了最方便的選擇。


    從二〇〇二到一九年，美國快餐服務業（Quick Service Restaurants, QSR）的年產值從一五九○億美元成長到二七三○億美元，預估未來每年將以七．六％的速度繼續成長。


    熟知的麥當勞（McDonald''s，美股代號MCD）、星巴克等現在被稱爲穩健成長股的公司，過去也經歷過一段高速成長期。這些餐飲集團成長的主要動力源於市場擴展、收入來源擴大與成本效益提高，使得股價漲勢也很強勁，演變至今成爲產業中的領導者。


    光靠餐廳的營收、品牌授權費就能有穩健的收益率槓，可作爲長期投資的選擇之一。


    我們可用這些成功的企業爲標準，進而研究其他更年輕的餐飲股，就能挖掘出下一個明日之星。接下來以知名墨西哥捲餅連鎖餐廳「Chipotle」（美股代號CMG）爲例，透過各項分析的演練，幫助你如何炮製找到其他績優企業。


    # 餐飲界的超級成長股．Chipotle


    Chipotle是最近十年美股中的超級成長股，主打自然新鮮、以健康概念爲訴求、並且現點現做的墨西哥捲餅爲招牌產品。二〇〇六年公開上市，股價從每股四七．五美元上漲到一三四○美元，漲幅超過二七○○％。截至二〇〇八年十二月三十一日，Chipotle在美國經營了兩千四百五十二家餐廳，有三十七家海外分店與兩家非Chipotle餐廳。


    當然，Chipotle的股價一路走來並非平步青雲。公司在二〇一五年發生食安風暴，造成股價從最高點每股七七八美元一度下跌至二五〇美元左右，跌幅達七○%，後續更是接連出包，使得公司面臨巨大危機。


    通常，當好公司遇到倒楣事時，反倒是投資人的最佳機會，這時就要了解公司股價的下跌原因、公司本質是否發生改變、有哪些催化劑可讓公司起死回生，並思考需要多長時間來實現。然而在Chipotle股價大幅下跌的同時，我們該如何判斷這檔股票還具有投資價值？


    # 危機應變


    首先，Chipotle的問題明顯出在「管理」，這必須靠經營者來解決，管理層在事發時的處理態度是相當重要的指標，可以看出有無及時提出改善措施，挽回消費者的信心。


    事件發生後，Chipotle開始積極採取變革行動，包括改善整體環境衛生狀況、更換菜單、開發線上訂餐系統與忠誠客戶計畫，並且實施大幅優惠措施來吸引顧客回流。雖然會對公司的短期獲利造成影響，但留住客戶才是當務之急。


    二〇一八年三月，Chipotle的創辦人史蒂夫·艾爾斯（Steve Ells）因與論壓力而退位，改由布萊恩·尼可（Brian Niccol）接任執行長，持續推動餐廳改善計畫。自二〇一

