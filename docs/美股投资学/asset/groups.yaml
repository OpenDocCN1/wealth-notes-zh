    只要營收成長快，公司的毛利率就會逐年增高，從表 24 就可看出，現在 Paycom 已是一家獲利公司。大體而言，「軟體即服務」公司的研發與營銷費用占比都會比較高，需要用更高的支出去換取成長。但
    Paycom 在成本控管上相當優秀，營業利潤率與淨利率逐年成長，自由現金流也在增加，財務體質相當穩健。所以即便正處於高速擴張的階段，也不需要擔心短期會有流動性的風險，造成公司營運上的困難。


    ### 重要指標


    評估 Paycom 營運狀況的關鍵指標有幾項，包括「客戶數量」、「銷售團隊數量」、「年營收保留率」以及「經常性收入」。由於顧客要訂閱 Paycom 的軟體功能，就得定期支付訂閱費給
    Paycom，所以只要觀察經常性收入成長便能判斷公司的未來表現。


    透過表 25 可以看到，Paycom 的客戶數量逐年增加，是營收成長的主要動能。也因需要服務的客戶變多，為了滿足顧客即時的請求與問題，並且提高顧客滿意度與創造長期的合作關係，銷售團隊的數量勢必也要隨著客戶數量增加而提高。


    最後則是年度收入保留率，這個指標追蹤現有客戶的留存率，衡量客戶是否滿意公司的服務，願意留下來繼續付費訂閱。一家公司要維持一○○% 的保留率相當困難，但應該將流失率控制在一定的水準，以免營收大幅下滑。


    除此之外，因為 Paycom 會代替客戶處理薪資的稅務申報，所以會先向客戶收錢再去繳稅。這筆資金中間停留時間約一百二十天，在這段時間，Paycom 會把錢投資於貨幣市場基金、活期存款與商業票據等來收取利息。隨著客戶提供的服務愈來愈多，再藉由投資收益提升公司的獲利，也是相當聰明的做法。


