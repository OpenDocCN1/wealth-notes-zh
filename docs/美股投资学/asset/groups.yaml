    這時就是一個警訊，不要讓煮熟的鴨子又飛到別人家去了。


    表18是網飛二○一九年第三季到二○二○年第三季北美市場的財務數據，從表中可以看到，新增的付費用戶成長幅度雖然趨緩，但因為網飛調漲了訂閱費用，每位用戶平均收入還是逐漸提高，維持獲利能力。


    ### 年度經常性收入


    相較於網飛這種企業對消費者的商業模式，如果一家訂閱經紀公司的商業模式屬於「企業對企業」（B2B）的訂閱經濟公司，這時就應該去檢視公司的「年度經常性收入」。顧名思義，「年度經常性收入」就是會經常發生、公司能持續入帳的收入，計算公式為：「當前的年度經常性收入」減「流失的客戶」加「新增的年度合約價值」。這個指標用來衡量「軟體即服務」公司營運的穩定性，當公司提供服務給企業客戶，幫助客戶提升他們的管理、行銷與銷售能力，為客戶帶來更多的實際好處，自然會形成對公司的忠誠度，持續地付費訂閱更多的功能。


    如果公司流失的客戶少於新增的年度合約價值，表示年度經常性收入有成長，也代表公司具有競爭優勢，不但顧客願意留下來續約，還有可能訂閱更多其他的服務，讓公司更輕鬆地擴大營收。但如果流失的顧客大於新增的年度合約價值，表示年度經常性收入呈現衰退，公司得盡快找新客戶來彌補缺口，不要以為老客戶不值錢，其實老客戶才最有價值。


    ### 帳單金額


    評估訂閱經濟公司的營收時，應該採用「帳單」的數據。其與營收不同的是，帳單包含已經簽好合約但尚未實際履行業務，所以還沒收到錢，不能認可成營收，然而這是評估公司能否繼續成長的一個更準確指標。


    除此之外，訂閱經濟公司會依照本身的行業特性，在財報中列出其他指標，讓投資人可以更了解公司的營運狀況。這些指標包括「活躍用戶數」、「客戶取得成本」、「一年度合約價值」等，都是在檢視公司收入的穩定性與可持續性、轉化成本未來成長的重要資訊。後面將列舉幾家訂閱經濟公司的發展做進一步分析。


    ### 成功轉型訂閱經濟，股價五年漲五倍： Adobe


    Adobe（美股代號ADBE）成立於一九八二年，是多媒體軟體開發的領導廠商，為專業人士、行銷、一般消費者提供一系列產品與服務，應用於藝術、網頁設計、影片和動畫製作、遊戲開發等產業，客戶遍及全世界各大企業與品牌，產品包括
    Photoshop、Illustrator、Premiere Pro、Lightroom CC、InDesign、Adobe XD 等。


    二〇一二年五月，Adobe 首次推出「Creative Cloud」的訂閱服務，開始推動訂閱制的轉型，不再銷售昂貴的套裝軟體，改以每個月收費的方式讓客戶使用自家的軟體。此舉引起市場一片譁然，華爾街分析師紛紛調低Adobe
    的目標價，使得股價沉寂了一段時間。然而隨著轉型成功，二〇一七年的營收突破七十億美元，驅動股價開始強勢上漲，從二〇一五年初到二〇二〇年，股價已上漲超過五六七%，市值超過一二三○億美元。


    #### 產品定位


    Adobe 的主要產品可分為下列三大業務：


    - **數位媒體**：這是Adobe 所有業務中最重要的「一塊」，占總營收的六九％。旗艦產品是Adobe Creative Cloud，透過訂閱服務，經由線上下載並使用Adobe
    最新版本的軟體。文件處理軟體Adobe Acrobat 則提供使用者免費使用Acrobat Reader 軟體或觀看PDF檔案，電子簽名Adobe Sign
    與Adobe Scan 等功能。除此之外，Adobe 藉由Adobe Sensei 所蒐集到的數據，透過AI人工智能和機器學習，幫助客戶擁有更個人化的體驗，減少繁瑣的流程，以增強使用效率。

    - **數位體驗**：數位體驗主要用於協助客戶進行數位轉型，占總營收的二九％。在此業務中，Experience Cloud 包含了Adobe Advertising
    Cloud、Adobe Analytics Cloud、Adobe Marketing Cloud 與Magento Commerce Cloud等四個雲產品，利用Adobe的內容與數據平台，幫助企業建立專屬的購買程序、管理廣告，並且深入了解他們的客戶。

    - **出版**：出版部門主要應用取代或因應傳統印刷市場的需求，占總營收的二％，包括線上教學（Clearning）解決方案、數位文件出版、線上會議與表格平台，透過Adobe
    PostScript 和Adobe PDF印刷科技，使這些生產流程變得更安全有效率。


    #### 財務狀況


    Adobe在二〇一一年就著手訂閱制的轉型，一開始為了讓原本的顧客接受新的商業模式，在營收上沒有顯著的效益，直到二〇一五年的營收年成長率達到雙位數，較前一年同期成長十五％，才正式踏上高速成長的軌道。


    透過持續性的購買，可以改善原本銷售套裝軟體時一次性收入的週期性影響，創造穩定的現金流入，由於不需要一次支付大筆金額，也讓更多新客戶與一般消費者開始願意訂閱，擴展整個市場的覆蓋率，讓收入得以快速成長，在資本配置上更具彈性，得以持續性開發新产品、投資與併購。


