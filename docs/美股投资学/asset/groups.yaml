    由於成功轉型為訂閱公司，Adobe在最近五年的獲利能力也大幅改善。公司的全系列產品都具備高度的護城河，普及程度廣，轉換成本高，讓用戶不會隨便就取消訂閱，自然可以創造更多的盈餘。另外在費用支出上，轉為訂閱制後節省了過去的營銷費用，不需要在經銷商鋪貨，消費者直接到Adobe官網就可以訂閱軟體，省下許多中間成本。所以營業利潤率由二〇一五開始持續提升（參表20），帶動現金流的增長，讓公司有更多資本可以去進行投資，強化用戶體驗，創造一個良性的成長循環。


    #### 競爭對手與未來展望


    雖然Adobe在數位媒體業務的完整性與功能性幾乎無可匹敵，不過還是面臨一些潛在威脅。例如臉書、Snapchat、Pinterest等公司也都在開發編輯與分享圖像的直接功能，讓許多使用者可以繞過影像軟體的編輯過程，不需要額外購買專業軟體。還有，像是Google、微軟、Dropbox（美股代號DBX）等公司也開發了文件檔案的相關功能來與Adobe
    Document Cloud競爭，而應用於數位簽名與電子合約的AdobeSign，則有目前產業內市占率最高的DropSign（美股代號DOCU）與之競爭。


    但我認為，Adobe長時間累積的競爭優勢很難被超越，尤其是軟體輸出格式已經形成產業標準，加上公司目前致力於發展人工智慧技術，整合所有裝置，提升產品性能與擴展服務範圍，依照Adobe自己的預估，到二〇二二年的潛在市場規模將達到一二八〇億美元，而公司最近一年的營收金額僅一一二億美元，不到預估規模的一〇％，就長期而言，Adobe仍相當具有發展潛力。


    想要評估Adobe合適的進場時機，由於成長股的股價通常建立在市場對公司未來預期的上，因此估值都偏高，用本益比來估值並不合適。主要還是觀察「營收成長率」與「股價／營收比」這兩個指標，判斷目前的價格水位。另外也可參考彼得林區評價法，透過本益成長比¹或盈餘趨勢線來觀察過去的價格走勢（詳見第10章），在低於趨勢線時分批進場布局。


    ### 雲端服務先驅，躍升新道瓊成分股：Salesforce


    Salesforce是「軟體即服務」行業的先驅，最早將客戶關係管理（CRM）轉型為訂閱制，導入「軟體即服務」的商業模式。客戶關係管理是企業透過軟體，將銷售、行銷與客服等完整的銷售流程進行整合與分析，提高資源的使用效率，也可以增強客戶的使用體驗，可說是現代商業中不可或缺的重要工具。


    在過去，傳統的客戶關係管理系統價格昂貴，公司的專業軟體原本局限於服務高端市場，中小企業無力負擔。現在經由雲端服務，讓公司的市場延伸到低端市場，幫助了許多中小企業不必購買價格高昂的設備與軟體，只要每個月支付訂閱費用就能使用需要的服務，而且還能自動更新軟體，省下許多維護費用和成本，創造了額外的商業價值。


    也因為此，Salesforce 在二〇二〇年首次被加入道瓊成分股中。道瓊成分股的調整代表整體美國經濟的變革，該公司的加入也足以證明數位轉型的趨勢已不可逆，雲端經濟已成為市場主流，具有指標性的意義。


    #### 主要業務


    Salesforce 的主要業務如下：


    - **銷售雲 (Sales Cloud)**：以更有效率的方式進行銷售，包括存儲、分析與預測數據、追蹤訂單進度，直接透過雲端平台進行交易。

    - **服務雲 (Service Cloud)**：為了讓公司更好且更智能地進行客戶支援與服務，透過雲端平台與客戶進行即時聯繫，並且進行快速的人員調度與即時追蹤，提升顧客滿意度。

    - **行銷雲 (Marketing Cloud)**：透過雲端服務進行大數據的分析與預測，以精準掌握目標客戶，提高顧客的參與度、轉化率與忠誠度。

    - **Salesforce 平台與其他**：除了上述三項業務，Salesforce Customer 360 平台還有其他相關功能可以進行客製化的選用，直接為企業打造專屬的顧客關係管理平。


    #### 財務狀況


    Salesforce 在二〇二〇年成為道瓊成股之列，可說是其中成长性最好的一家公司。由於不斷地拓展業務範圍、進行併購與垂直整合擴大規模，使得營收維持高速成長，收入從二〇一一年的十七億美元，到了二〇二〇年已達一七〇億美元（表
    21），平均每年成長將近三〇%，直至二〇二〇年底還沒有減速的跡象。


