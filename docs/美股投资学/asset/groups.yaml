    投資人透過年報中前七個項目提供的資訊，包括「商業模式與產業環境」、「產品與服務內容」和「營收來源與表現」，可以對公司有更全面的了解，在閱讀財務報表時就能更快拉出關鍵數據，判斷公司的營運狀況。接下來，我們要學習如何閱讀公司財報，一步步將三大報表中的重點提列出來！


    ## 第 7 章

    ### 損益表的重點觀察


    投資美股的目的，是要找到一家長期成長的好公司，跟著公司的成長一起獲利！而損益表是了解一家公司的成長性與獲利能力最好的資訊來源，投資人可以因此知道這家公司的營收表現、成本控管能力與獲利能力。公司的營收表現是股價成長的引擎，獲利則是源源不絕的動能，支持股價走勢一路上漲。


    在損益表中，「營收與營收年成長率」、「毛利率」、「營業利潤」和「淨利率」是我們必須關注的幾個重點。


    #### 營收與營收年成長率


    觀察營收與營收年成長率，可以幫助投資人辨認這家公司目前所處的生命週期，是處於成熟、穩健成長還是高速成長。唯有理解自己持有公司的屬性，才能對公司的股價做出合理預期。


    依照營收成長率的高低將公司進行分類，可以避免給予公司過高的期待，實際上卻沒有得到應有的報酬率。由過去的經驗來看，我會將營收年成長率低於一○％的公司歸類為「成熟型公司」。這些公司的股價波動平緩，但是只要營運良好，擁有穩定的現金流，就可以持續支付穩定的股息給投資人。因此，投資這類公司以領股息為目標。


    營收年成長率介於一○至二五％的公司，我歸類為「穩健成長型公司」。這些大都是規模較龐大的公司，而且已經擁有穩定的營收來源，他們會持續推出新產品，積極搶占市場以擴大市占率，或是直接用併購策略來創造新的成長動能，帶動股價持續上漲。由於股價趨勢向上，投資人以合理價買進，兼具資本利得與股息收益。


    而營收年成長率超過二五％、甚至創造出三○至四○％以上成長率的公司，我歸類為「高速成長型公司」。這些大都是中小型企業，所以股價的爆發力大，股價上漲的速度也很快。但投資人須注意，這些公司雖然擁有高成長性，卻缺乏穩定性，甚至尚未有實際獲利，一旦成長開始趨緩或未達得到市場預期，股價也會快速反轉。由於這類公司股價波動劇烈，因此投資策略以資本利得為主，須嚴格控制風險。


    蘋果公司的整體營收年成長六％（參表37），會被投資人放到成熟型公司這一類，因為認為股價沒有向上發展的可能性。但事實上，蘋果的股價在二〇二〇年創下歷史新高，總市值突破兩兆美元。


    但如果有看過公司年報，便會了解公司目前正處於轉型階段，希望能提高手機以外的產品與服務銷售比重，打造新的商業模式，再造成長循環。


    觀察二〇二〇年的年報數據（參考表38），可以看到 Apple 的營收在智慧型手機市場已經飽和的情況下，二〇一九、二〇二〇年都是呈現衰退趨勢，但 Mac 和
    iPad 的營收都還有兩位數的成長，表現算不錯。


    蘋果公司這兩年的股價飆漲，主要因市場對穿戴式裝置及服務收入的成長潛力看好而給出高估值。穿戴式裝置包括 AirPods、Apple TV、Apple Watch、Beats
    products、HomePod 等產品，而服務收入則包含 AppStore、數位內容訂閱與其他服務。


    一〇一〇年，蘋果推出的 Apple One，就是將 Apple Music、Apple TV+、Apple Arcade 與 iCloud 打包成一個訂閱套餐，以更低的價格獲得超值的服務，吸引消費者若要享受這些服務，就得使用蘋果手機與其他硬體設備。這個做法成功打造出所謂的蘋果生態圈，再造公司下一波成長軌道。


    #### 毛利率


    > 毛利＝營業收入－營業成本

    > 毛利率＝毛利／營業收入＝(營業收入－營業成本)／營業收入


    一家公司的毛利等於營業收入減掉營業成本，透過從毛利的變化，投資人可以看出一家公司的競爭優勢及成本控管的能力。


    毛利增加，代表公司具有競爭優勢，擁有更大的定價權，即便產品提高售價、東西賣得比別人貴，客戶還是願意買單。而擁有成本優勢的公司隨著產品銷量增加，公司營運會變得更高效，獲利能力提升。


    毛利除以營收就得到「毛利率」，代表毛利占總營收的比率。我認為直接觀察毛利率的變化，可以更清楚呈現公司的營運表現。當毛利率持續上升，表示獲利能力愈來愈好，是相當正面的訊號之一；如果毛利率突然下降，有可能是因為競爭能力下滑而導致降價求售，或是成本突然失控，這都是重要警訊，必須試著找出原因。


    以蘋果公司為例，表 39 是二〇二〇年報提供的數字。二〇一九會計年度後，蘋果將財務報表「產品」（硬體）與「服務」（軟體）的毛利分開，讓投資人可以更清楚了解不同產品類型的獲利表現。


    蘋果公司二〇二〇年硬體的毛利為六九五億美元，占總毛利的六六%，軟體的毛利為三五億美元，僅占總毛利的三四%，這是因為目前產品營收仍是主要的收入來源。不過再看表
    39 下面的毛利率，可以發現軟體其實是比較賺錢的業務，硬體的毛利率僅三一、五%，而且逐年遞減，軟體的毛利率卻整整高出硬體一倍，而且逐年遞增，抵消了硬體的下滑，讓公司整體毛利率可以維持在一定的水準。


    事實上，蘋果公司由於手機與其他產品在搭配自己的 iOS 系統下，原本硬體毛利就比許多競爭對手高，未來在硬體收入占比逐漸提高的趨勢下，公司的獲利能力有很大機率會愈來愈好。


