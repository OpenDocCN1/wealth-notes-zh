    根據研究機構預測，全球人力資本管理市場的規模預計從二〇二〇年的一七六億美元，增長到二〇二五年的二四三億美元，在預測期內的複合年增長率為六．七%，是軟體行業中發展最快的產業之一。


    而數位轉型是現代企業的趨勢，不僅是外部管理，對內也可以提升營運效率，幫助企業內部的管理與溝通，提升認同感，並達到企業核心目標。最早採用創新解決方案的一定是大企業，而在技術推動成本逐漸降低的情況下，市場也會愈來愈普遍及普及。


    Paycom 從中小企業的利基市場崛起，未來可以持續擴大服務範圍。由於中小企業採用數位轉型的速度比較滯後，這也代表 Paycom 未來仍相當具有成長潛力。


    ## 電子簽名雲端服務商

    ### DocuSign


    DocuSign（美股代號 DOCU）成立於二〇〇三年，是一家提供電子簽名的雲端服務商，二〇一八年併購雲端管理平台公司 Sprinklr 之後，將業務版圖擴及至電子合約製作、簽訂與管理，提供更完整的解決方案。目前擁有超過六十六萬名付費客戶和數億名用戶，是電子簽名市場中市占率最高者，占比達七〇％，包括電信公司
    T-Mobile、消費品大廠聯合利華（Unilever）、客戶關係管理龍頭 Salesforce 等公司都是它的客戶。


    DocuSign 的主要產品為「協議雲」（Agreement Cloud），提供一個平台讓客戶可以建立專屬文件、直接在電子文件簽名、付款並進行後續管理。傳統簽訂合約的流程通常需要費耗許多人力與時間，在將這些繁雜的文書作業轉到線上作業後，不僅大幅節省所需時間，從原本可能需要幾天縮減到幾個小時，還可以避免人工造成的錯誤，快速檢視合約內容，查看合約期限與管理，提高效率與顧客體驗。


    ### 財務狀況


    DocuSign 於二〇一八年五月公開上市，目前提供公開查詢的營運數據可追溯至二〇一六年。公司有九五％的營收來自於訂閱收入，與每位客戶簽訂平均時間為一到三年的合約，讓客戶每年進行付款。二〇一六年，DocuSign
    的營收僅二、五億美元，到了二〇二〇年已經成長到九、七億美元，近三年營收平均成長率為三六・六八％，處於相當高速的成長階段（參表 26）。


