    # 第4章

    培養敏銳洞察力，把競爭優勢變常識


    從前面對尖牙股的介紹，可以了解到雖然均貴為科技巨頭，但是每家公司的商業模式仍有其獨特之處，造就了他們與競爭者之間的差異，打造出無可取代的競爭優勢，而這也是推動股價成長的主要因素。從日常生活中去了解這些公司，把察覺競爭優勢的能力變成普通常識，就可以讓美股投資人更好地去評估公司的未來發展，跟著公司成長一起獲利。


    # 從護城河看競爭優勢


    巴菲特用護城河來比喻競爭優勢的概念：「優異的公司必須有一條護城河，讓競爭者難以侵略，為公司帶來持續的超額報酬。」


    當公司擁有穩定成長的收益來源，就能讓股價的長期趨勢向上發展，其中的意涵表'
  - '[PAGE 92]


    示這些公司一定具備某項得以維持自己在產業中領導位置的競爭優勢。常見的競爭優勢有下列六種：


    +   一、規模優勢：具有規模優勢的企業，可以擁有更好的定價權與議價能力，驅動營收成長與提高獲利能力。例如蘋果公司對其供應鏈有相當好的議價能力，他們的手機單價雖然比其他品牌貴，但消費者還是願意買單，代表蘋果具有產品的定價權。


    +   二、網絡效應：網絡效應也是規模優勢的一種，當某個產品或服務有愈來愈多人使用且普及到一定程度後，便會形成行業中的領導優勢，雖然會為消費者帶來更多價值，但也會提高用戶的轉換成本。例如臉書會由舊用戶持續吸引新用戶前來使用；亞馬遜的電子商務系統亦然，當會員人數愈多，就會吸引更多商家來銷售產品，進而提供更低價的產品給消費者，形成正向循環。


    +   三、成本優勢：大規模的生產可以提高企業的產能利用率，或是同一套設備可以用來生產不同的產品，使公司的單位成本降低，提高獲利能力。成本優勢在軟體業特別明顯，例如微軟的
    Office 文書軟體或 Adobe 的繪圖軟體，一旦開發出來後就可以持續在市場上銷售，只要付費人數愈多，公司的生產成本就愈低。


    +   四、品牌優勢：品牌的價值在於提高產品的價值，以滿足消費者的獨特體驗。例如'
  - '[PAGE 93]


    為什麼一般人願意多花一些錢買Tore、多花一倍的錢買星巴克咖啡，甚至願意多花幾倍的錢到Hers（美股代號TIF）購買珠寶，就是因為這些公司的品牌效應，使得產品可以擁有比實際價值更高的溢價。


    五、技術優勢：擁有技術優勢的公司具有強大的研發實力，為自家的智慧財產權申請專利。在專利權尚未到期之前可以限制競爭者加入市場，保護公司的獲利能力，並藉由授權專利而獲利。例如工業大廠3M、半導體公司高通（QualcommInc）、美股代號QCOM）或生技製藥公司等都受到龐大的專利權保護。不過注意公司是否有持續創新，因爲一旦專利權到期，獲利可能大受影響。


    六、特許經營：特許經營行業是指受到法規限制、需要政府給予執照才能經營的公司，例如金融行業、公用事業與通訊電信行業都屬此類。這些公司在產業內具有壟占優勢，競爭者少，獲利自然穩定成長。在金融科技的高速發展下，線上支付、虛擬銀行的普及對傳統銀行造成很大威脅，但是正因為這種趨勢，投資人反而可以關注如Visa、Mastercard（美股代號MA）、PayPa（美股代號PYPL）、Square等公司，透過大數據的蒐集與分析來建立自身的競爭優勢，提供更快速、更安全的金融服務。'
