    #### 毛利率


    > 毛利＝營業收入－營業成本

    > 毛利率＝毛利／營業收入＝(營業收入－營業成本)／營業收入


    一家公司的毛利等於營業收入減掉營業成本，透過從毛利的變化，投資人可以看出一家公司的競爭優勢及成本控管的能力。


    毛利增加，代表公司具有競爭優勢，擁有更大的定價權，即便產品提高售價、東西賣得比別人貴，客戶還是願意買單。而擁有成本優勢的公司隨著產品銷量增加，公司營運會變得更高效，獲利能力提升。


    毛利除以營收就得到「毛利率」，代表毛利占總營收的比率。我認為直接觀察毛利率的變化，可以更清楚呈現公司的營運表現。當毛利率持續上升，表示獲利能力愈來愈好，是相當正面的訊號之一；如果毛利率突然下降，有可能是因為競爭能力下滑而導致降價求售，或是成本突然失控，這都是重要警訊，必須試著找出原因。


    以蘋果公司為例，表 39 是二〇二〇年報提供的數字。二〇一九會計年度後，蘋果將財務報表「產品」（硬體）與「服務」（軟體）的毛利分開，讓投資人可以更清楚了解不同產品類型的獲利表現。


    蘋果公司二〇二〇年硬體的毛利為六九五億美元，占總毛利的六六%，軟體的毛利為三五億美元，僅占總毛利的三四%，這是因為目前產品營收仍是主要的收入來源。不過再看表
    39 下面的毛利率，可以發現軟體其實是比較賺錢的業務，硬體的毛利率僅三一、五%，而且逐年遞減，軟體的毛利率卻整整高出硬體一倍，而且逐年遞增，抵消了硬體的下滑，讓公司整體毛利率可以維持在一定的水準。


    事實上，蘋果公司由於手機與其他產品在搭配自己的 iOS 系統下，原本硬體毛利就比許多競爭對手高，未來在硬體收入占比逐漸提高的趨勢下，公司的獲利能力有很大機率會愈來愈好。


