    ## 財務狀況


    自八年三月以來，股價由谷底反彈，漲了一倍有餘，證明尼可確實做得不錯。


    觀察 Circle 十年的財務報表（參表 49），除了二〇一五至一六年因食安風暴而造成營收大幅下滑，其餘時間都保持相當穩健的成長。最近十年營收平均每年成長十四%，每股盈餘平均每年成長十二%。


    在未發生食安風暴之前，Circle 是一家成長性相當優異的公司，每年都有超過二〇%的營收成長率，基本上比許多科技股都優秀。除此之外，公司的獲利能力也相當好，毛利率持續維持在二六至二七%，營業利潤率也維持在十七%左右。食安風暴後，公司努力進行補救，雖然至今獲利能力尚未回到過去的水準，但未來仍有進步的空間。


    尤其 Circle 一直以來都沒有負債，現金資產充足，即便遭遇新冠肺炎疫情，也有相當堅實的基礎可以從容度過，股價在二二〇〇年以來上漲超過六〇%。


    在觀察餐飲股的財報時，除了營收表現、獲利能力與現金流量外，更重要的是公司提供同店銷售額（comparables）的數字變化。由於零售業或餐飲業等擁有實體店面的公司每年都會持續開設新店面，若以目前擁有的總店數計算銷售成長率，會有誤導的嫌疑。但「同店銷售額」只計算至少營運十二個月以上的店面收入，因此更具參考價值，可讓管理層了解既有店面的營運效率，也能藉此評估設立新店面的節奏與預期效益。


    Chipotle 在二〇一七、一八年的同店銷售額都有成長，二〇一九年的成長更是高達兩位數，表示原有的店面營運相當良好，帶動整體的營收成長。在這個時候，公司就可以開始規畫開設新店來進行擴張（參表
