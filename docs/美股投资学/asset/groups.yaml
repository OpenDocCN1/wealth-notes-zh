    突破六千億美元，也確定被納入到標準五百指數。


    投資人應該觀察標準五百指數的變化，因為該指數約占了美國股票市場八〇％的市值，是用來衡量美國大型股最好的指標，可以更真實地呈現美國股票市場的價值變動。標準五百指數採用「市值加權法」（market
    value weighted）來計算每家公司在指數中所占的權重，市值愈大，在標準五百指數中的重要性就愈高。


    ## 那斯達克指數


    那斯達克指數涵蓋在那斯達克交易所上市的兩千五百多家企業，包含了在美國上市的國外企業存託憑證（ADR）、普通股、房地產投資信託等標的，其中將近五〇％的成分股都是科技股，所以被視為呈現科技股表現的代表指標。該指數採用「市值加權法」，計算每家公司在指數中所占的權重，市值愈大，在指數中的重要性就愈高。


    不過，更多投資人關注的是那斯達克一百指數，該指數涵蓋那斯達克交易所上市、別除金融股後市值前一百大的公司，更集中於科技巨頭的表現，光市值前五大的公司就占了整個指數四〇％的權重。


    那斯達克指數與標準五百指數都是採用「市值加權法」來分配每家公司在指數中的權重，市值愈大的公司所占的權重愈大。美股中市值最大的蘋果公司在那斯達克一百指數中占比為十二．三％，在標普五百指數中占比則為六．七％。


    而道瓊工業指數與前兩者不同，採用「價格加權法」來分配每家公司的指數中的權重。公司股價愈高，所占的權重就愈大，對指數的影響也愈大。目前指數中價格最高的「聯合健康保險公司」（UnitedHealth
    Group，美股代號UNH）股價為三五一美元，占指數的權重為七．五％。


    ## 從 ETF 投資三大指數


    無論是專注於指數化投資、希望跟著大盤成長且穩定獲利的被動投資人，或是在茫茫股海中挑選最佳標的、希望獲取超額報酬的主動投資人，都應該先了解大盤，從指數投資開始，將它納入投資組合之中。


    而上述三大指數中，以標普五百指數最能代表美國整體股市的變化。原因在於，與道瓊工業指數相比，標普五百指數的成份股更多，涵蓋的範圍更廣、更分散，因此更具代表性。而與那斯達克指數相比，那斯達克指數以科技股為主，指數的波動幅度也更大。在行情多頭下，三大指數的趨勢同步上漲，代表整體市場呈現強勢的狀態，當其中一個指數的上漲趨勢反轉，投資人也應該密切關注其他兩個指數是否有轉弱趨勢，以評估未來的市場方向。


    那麼，該如何投資三大指數呢？投資人可以買進追蹤指數的 ETF（參表 8），例如「SPDR 道瓊工業平均指數 ETF」（美股代號 DIA）、追蹤道瓊工業指數，最近十年的年化報酬率為十二．三二％，不過雖說道瓊工業指數是三大指數之一，具有一定的重要性，但將資金投入道瓊成分股，集中在三家公司較無法提供分散風險的作用。


    在追蹤標普五百指數的 ETF 中，除了規模最大的「SPDR 標普五百指數 ETF」（美股代號 SPY）以外，還有先鋒基金公司（Vanguard）推出的「Vanguard
    標普五百指數 ETF」（美股代號 VOO）以及安碩（iShares）的「iShares 核心標普五百指數 ETF」（美股代號 IVV），投資人可以選擇其中費用率最低的一檔投資，節省交易成本。


    此外，還有「1288 那斯達克一百指數 ETF」（美股代號 QQQ），則是追蹤那斯達克一百指數，買入在那斯達克上市前一百大的公司。雖然這檔 ETF 的費用率最高，但在目前美股市場上仍是科技股獨霸的情況下，報酬率也是最優異的。在趨勢發展的過程中，我認為
    QQQ 是相當值得配置的標的之一。


    除了上述五檔 ETF，還可以考慮另外兩檔以至世界股票市場與全美國市場為投資組合的 ETF（參表 9）。


    ETF 是適合長期持有、賺取長期穩定收益的資產。


    選擇大盤 ETF 作為投資組合的基礎，可以避免在盤勢波動劇烈時，投資人的心理受到影響而賣出股票，卻錯過了後續的反彈行情。當然，也可以將其他主題型、趨勢型與主動型
    ETF，與個別公司的股票進行資金配置，隨著市場的變化波段操作獲利，幫自己在盤平均報酬外增添額外收益。


