    # 臉書


    臉書成立於二〇〇四年，是全世界最大的社交媒體平台，擁有 Facebook、Instagram、Messenger、WhatsApp、與 Oculua 等五個主要產品與服務，提供免費的社交媒體平台，每天有超過十八億的人口透過網路使用臉書的服務。廣告收入就是臉書主要的營收來源，雖然我們使用臉書完全免費，但也提供了臉書相當大量的數據，了解我們的喜好與需求。也因爲如此，透過平台的網絡效應吸引更多用戶，也讓更多廠商到臉書來投放廣告吸引消費者，讓臉書的獲利維持高成長。二〇一九年的營收達七〇七億美元，比前一年成長了二七％，最近五年的營收平均成長率爲四一・五％。


    投資人評估臉書的未來發展時，可以關注的重要指標包括「活躍用戶數量」與「每位用戶平均收入」（Average Revenue Per User (ARPU)）。這兩個指標也泛用於其它平台上，評估平台的使用度與變現能力。當活躍用戶數愈多，臉書向廣告主收取的廣告費用就愈貴，換算成每位用戶的平均收入也愈高，持續推升臉書的營收成長。


    活躍用戶數量：活躍用戶數量來衡量臉書平台提供的功能是否讓用戶滿意，願意'
