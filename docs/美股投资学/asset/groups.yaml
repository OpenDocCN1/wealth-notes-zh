    # 掌握出場時機


    能夠接受停損概念並確實去執行，讓投資人避免陷入鉅額虧損的窘境。但大多數人之所以無法接受停損，是因為一旦虧損持續擴大時，會陷入一種情緒性麻痺的狀態，心理上無法面對虧損的現實，生理上自然沒辦法採取停損動作，這都是因為一開始沒有進行「斷捨離」的工作。


    所謂「斷捨離」，是指藉由對物品進行「減法」來為自己的生活加分。也就是斷絕與捨棄不需要的事物，幫助自己可以更專注在重要的事情上。對於生活是如此，對於投資更是如此。在投資上摒除不必要的雜訊、已經不再產生價值的資產，以及專注在目前最具有成長潛力的公司上，才有辦法提振投資組合績效。


    一般投資人沒有掌控市場的能力，更沒辦法控制自己投資組合中購買的股票會漲多少，也無法控制它們會漲多久，這些都是無法預期的事情。投資人能控制的就是資金配置的比例、買進的價格（成本），以及自己的承受風險（損失），在可控的範圍內進行調整，將資金做最有效的配置。


    那麼，何時是斷捨離的時機呢？


    # 第一步，了解自己投資的公司。


    例如投資前是否經過審慎評估，並且確實了解公司的營運狀況與股價特性是屬於成熟股、穩健成長股還是高速成長股。成熟股的營運穩定，雖然可以支付穩定的股息給股東，但成長性較差，倘若所屬的產業衰退，本業也遭遇逆風影響到公司基本面，那就該思考賣出手中的股票，尋找更穩健的標的。


    如果是選擇穩健成長股與高速成長股，股價隨著公司的成長而上漲，就該注意公司的營運策略，投入的資本是否帶來相應的成長，以及成長是否有趨緩的疑慮。如果公司沒有把目標放在擴大市占、增加新的營收來源與鞏固競爭優勢，對成長股來說就是潛在的風險，也是投資人該考慮離開的時候。


    # 第二步，進場前應該先設想失敗的情況，並想好出場機制。


    很少投資人在進場前會先想到離場的問題，是因為主觀認定買進公司的股票後，股價會朝著自己預設的方向前進。不過，一個完整的投資決策包含了進場與出場的規畫，在進場前思考可能發生的情況，在行情不如預期時更能理性面對與反應。


    如果你是以基本面因素進場，例如公司併購、營收表現良好而買入公司的股票，認為公司會因為合併而產生綜效，或是營運表現會持續下去，當這些基本面因素消失時，例如過高的合併價導致公司財務負擔加重，或是營運出現非預期的問題，受到競爭對手打壓等狀況時，就該考慮賣出。但如果你是以技術面因素進場，先找到型態上股價的支撐與壓力，在股價的關鍵點位附近設定停損點，如果股價發展不如預期，只要碰到停損價就該出場。


    # 第三步，當股價朝自己預想的方向發展，就要思考何時獲利了結。


    股價朝著自己預想的方向走，表示在投資前所做的研究與分析是正確的，這是投資人最喜歡的情境與最理想的狀況，也就是行情正朝著你規畫的方向走，代表獲利開始累積，讓好公司幫你賺錢。同樣地，以基本面因素驅動股價上漲的公司，一旦發生基本面問題（例如營運轉差、成長趨緩等因素），投資人就該評估該公司本質是否已經改變，然後決定是否獲利出場。


    而以技術面因素進場的投資人，當短線行情發生重大走勢、突然大幅飆漲時，也應該觀察上漲的動能是否可以維持。就算市場上的投資人持續買入公司的股票，成交量大幅攀升，驅動股價上漲，還是有動能耗盡的時候，如果短線上沒有買盤支撐，出現量價背離的情況，就得搭配技術指標的變化趨勢，考慮出場時機。


    # 用投資將現金轉化為財富


    自二〇〇八年金融危機以來，美股大盤經歷了史上最長的一段牛市，市場的風險意識逐漸降低，到二〇二〇年即便經歷了新冠疫情造成的崩盤，市場也快速做出V形反轉，重新回到上漲軌道，在年底重新創下歷史新高，道瓊工業指數突破三萬點大關，市場行情一片看好。在此榮景下提到「停損」兩個字，投資人通常是不屑一顧，一笑置之。看好美國經濟長期成長，我認為逢低買入大盤指數的
    ETF、作為長期投資的配置選項絕對是正確的，尤其在貨幣寬鬆的環境下，現金不值錢，唯有投資才能將你的現金轉化為真正的財富，提高你的購買力，讓生活品质越來越好。


    不過，如果投資人仍有主動選股的部位，而且偏好波動大的成長股操作，停損仍是投資中最重要的觀念，也是必定要確實執行的動作。即便停損十次後，股價最後都漲回來，但只要第十一次發生崩盤，你會發現過去的辛苦都只是為了此刻做準備。將風險降低，保護你的資產避免重大損失，才有辦法讓資產穩健增長，不怕一萬，只怕萬一！


    ## 第五部


    ### 用生活選股追求穩健報酬


    對於想要踏入美股市場的投資人，

    除了幾個熟知的企業外，

    最簡單的方式就是從生活中發掘投資商機。

    不管在順風或逆風，

    和生活有關的行業需求都會持續存在。


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_236_0.png)


    ## 第15章


    # 生活美股：食

    民以食為天，新型態飲食契機


    在第二部到第四部，主要以選股時應注意的三大面向（產業面、基本面與技術面）進行討論，希望有助於讀者分析個別企業的發展前景、營運表現及股價型態的判讀。


    對於想要踏入美股市場的投資人，除了幾個熟知的企業外，還有什麼公司值得投資呢？事實上，最簡單的方式就是從生活中發掘投資商機。本章就從與我們最切身相關的「食」談起，因為即便經濟再不景氣，每個人總是要吃飯，填飽肚子才有氣迎接未來的挑戰。所以不管在順風或逆風，和吃有關的行業需求都會持續存在。


    # 保持穩定，以現金流爲目標


    在美股中，整條食品產業鏈有各式各樣的公司可以投資，包括我們最熟悉的「可口可樂」、「百事公司」（PepsiCo Inc.，美股代號PEP），烹飪時必須使用的調味料如「味可美」（McCormick
    & Company，美股代號MKC），或是擁有哈根達斯（Häagen-Dazs）、冰淇淋、綠巨人等知名品牌的「通用磨坊」（General Mills，美股代號GIS）。這些都是美股中歷史相當悠久的公司，擁有強大的品牌優勢，因此能在市場上長期屹立不搖。


    投資人在挑選個股時可以發現，這些公司因為具有下列兩大特性，因此未來能持續帶來穩定的現金流：


    - 一、營收可預測性：因為這些公司具有品牌優勢，產品在市場上有一定程度的需求，加上有穩定的現金流進行新產品研發與併購行動，讓公司維持一定程度的成長性。

    - 二、獲利能力穩定：規模優勢讓公司的不同產品可以共用產品線，所以即便是在競爭激烈的環境下，也能藉由降低成本與提高生產效率來維持獲利能力。


    以可口可乐為例，從財報中可看出，近幾年因為健康意識抬頭，人們對於碳酸飲料的需求下滑，導致營收從二〇一三年開始顯著衰退，平均每年衰退4%，到二〇一九年只剩下約三七三億美元（參表48）。


    雖然公司在開源方面遭遇困難，幸好節流措施做得不錯，仍維持頗佳的獲利能力。


