    # 讓投資美股變簡單


    我沒有投資美股的主要原因是對資訊取得與了解太少，這也是許多投資人會遇到的問題。但現在投資市場的環境已經大幅度改善，投資美股的方式變得簡單許多，你可能會遇到的問題像是券商開戶、海外稅務、主要的美國企業介紹．．．．．．等等，都能在這本書裡看到。


    本書更提供了許多美股公司財務分析個案，有我熟悉的Agile。（我可是忠實用戶），也有我不熟悉的商業模式（例如使用訂閱制的公司，該注意的財務指標及計算公式），還提供了基本面投資人該知道的各種財報說明，例如10｜K、10｜Q以及很多投資人都會看的13
    F。這些介紹大幅降低了投資人搜尋知識的時間成本，包含我在內！如果之後開美股戶頭，必定會讓這本書出現在我的桌上。（^順便一提，如果我開戶應該會買波克夏、耐克和蘋果公司，畢竟我們要買你所買、買你所愛。）


    美股和台股當然有差別點，但是也有共同點，很多人的想法會卡在在其中一端，有些人則不會。想要了解一個人是否具備非凡的腦袋，就要看也能否在兩種不同的看法中優游自得的，而Gus就是這種人，你也可以成為這種人。


