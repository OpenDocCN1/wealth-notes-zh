    ## 第 13 章 股價型態判讀：順勢追高或逢低布局


    在了解移動平均線與趨勢線之後，股價型態判讀就相對簡單多了。這一章將介紹常見的基本股價型態，讓讀者可以更快地理解這些型態所代表的意義，以及可能引發的後續走勢。


    常見的型態包括「整理型態」與「反轉型態」。在上漲的過程中，由於有些投資人會先獲利了結出場，有些人會在中途買進加入，一買一賣之間就會形成股價的區間震盪，市場上多空呈現拉鋸，等待下一波走勢的發動，繼續過去的走勢，這就是「整理型態」，例如箱型整理、三角形整理或旗型整理等都屬此類。


    而「反轉型態」則是股價的趨勢即將有重大轉折，由於趨勢的變化不會一夕反轉，有可能經過幾天、幾週甚至幾個月的洗盤，最後才終於反轉向下突破。所以，理解基本的股價型態，能幫助我們就反轉型態的特徵預先辨識警訊，避免確認反轉後蒙受重大的損失。


    ### 圖 36 箱型整理


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_216_0.png)


    ### 整理型態：箱型整理的漲跌趨勢觀察


    如前所述，整理型態是指股價在一個固定的價格區間上下震盪，沒有走出明確的方向。在這個區間內，股價的上線壓力與下緣支撐，各自可以繪製出一條水平線，形成像「箱子」一樣的四方形，故稱為「箱型整理」。此時的股價正在進行盤整，消化凌亂的籌碼，多方及空方的角力拉鋸，等待走出一個明顯的趨勢。


    如何畫出箱型型態呢？只要連接每個高點畫出上線壓力線，以及連接每個低點畫出下緣支撐線，就會呈現一個盤整型態。如果股價大幅突破箱型整理，代表買進訊號；如果股價跌破箱型整理，則代表賣出訊號（參圖
    36）。


    箱型整理有可能出現在價格的低檔或高檔，但也會出現在股價的發展過程，因為股價在上漲與下跌時不可能一路飆漲而不經過籌碼的整理。每當上漲到某個程度，通常會發生籌碼換手的情況，形成短期的平台整理。這時賣方代表對該股票的供給量，買方代表對該股票的需求量，決定股價未來的走勢發展。


    如果想要賣出股票的人多於想要買進股票的人，也就是供給大於需求時，股價便開始下跌。當股價跌破整理區間的下緣支撐，市場上其他投資人也會跟著拋售股票，驅動股價有更明顯的跌勢。


    相反地，如果想要買進股票的人多於要賣出的人，也就是需求大於供給時，股價便開始上漲。當股價突破整理區間的上緣壓力，市場上其他投資人也會跟著追捧股票，驅動股價有更明顯的漲勢。


    以星巴克為例，二〇一五至一八年經歷了相當長時間的整理區間，股價上下震盪，沒有明顯的突破發展。直到二〇一八年底，由於財報利多驅動股價上漲，帶量突破後才啟動一波強勁的上漲。也因為之前盤整的時間長，上漲幅度會更大，每股從六十五美元上漲到快一百美元，不到一年時間漲幅超過五〇%（參圖
    37）。


    另外是股價高速發展中的箱型整理，例如二〇二〇年疫情爆發以來股價上漲超過七倍遠距會議軟體「Zoom」，在經歷第一階段上漲後開始進行橫整整理，籌碼的消化與緊接而來的財報利多，啟動了股價的第二波飆漲（參圖
    38）。


    ### 圖 37 星巴克 2015 至 2018 年股價的箱型整理型態


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_218_0.png)


    圖片來源：TradingView


    ### 圖 38 Zoom 於 2020 年的股價走勢圖


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_218_1.png)


    圖片來源：TradingView


    ### 反轉型態：頭部與底部判讀


    反轉型態的發生，對投資人來說是相當重要的訊號。股價在低檔建構反轉型態，有可能是基本面開始轉好，機構投資人開始偷偷買進，買盤支撐股價不再下探低點，也是股價即將止跌回升的訊號。這時候投資人可以關注股價的後續發展，一旦反轉確立便可以進場布局。


    反之，股價若是在高檔建構反轉型態，則是相當不利後續走勢的訊號。一檔股票經過一段強勢的上漲而來到高點，卻沒有持續的買盤支撐股價再創新高，反而有賣壓出籠，讓股價的波動開始加大，就要小心是否有人正在出貨，把股票倒給想要追高的投資人，最後套牢在高點。


    當趨勢延續一段時間，投資人若發現價格走勢開始大幅震盪，發生「高點不破、低點不破」的現象時，股價有可能正在醞釀反轉。這時投資人最好不要衝動進場，反而應該先觀察股價型態的變動，等待價格走勢確認後再採取行動也不遲。以下介紹常見的反轉型態，只要理解這些基本形態，再延伸至其他變形，就能更好地掌握股價趨勢。


    ### 圖 39 頭肩部的反轉型態


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_220_0.png)


    **頭肩頂：頭部型態，確認高檔反轉**


    頭肩頂是典型的反轉型態，在發展過程中，會由一個主要的波峰加上兩側各一個高點相近的波峰組合而成，看起來很像一個人的頭部與肩膀，因此被稱為「頭肩頂型態」。


    頭肩頂常見的走勢如圖 39。價格在第一 次創高後，股價拉回整理再重新向上創新高，不過沒有持續買盤推升股價，導致股價再次下跌至前一個低點。雖然股價在前一個低點仍有支撐力道，但重新上漲後無法再創新高，僅上漲到第一
    個高點後就再次下跌，這時就已經有了頭肩頂的雛型產生。


    要確認股價是否反轉向 下，股價向下突破兩個低點連成的頸線是關鍵，也是頭肩頂確定成形的必要因素。縱然股價還想重新振作往 上，但頸線已經變成主要的壓力，阻止股價發展，也讓股價陷入弱勢的局面。除此之外，圖中的頭肩頂型態不一定只有兩個波峰，也有可能如圖
    39 的右圖中所見，只要頸線相連，股價向下突破仍可確認反轉成立。


    ### 圖 40 通用電器 2015 至 2018 股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_221_0.png)


    圖片來源：TradingView


    但不是每一個頭肩頂型態都是標準型，只要多觀察就能找到共通點，預先設下停損點，控制投資風險。以通用電器（General Electric Company，美股代號
    GE）為例，二〇一六年的走勢是相當典型的頭肩頂型態，股價在一五年底伴隨高成交量創下新高後拉回，後續股價雖然再度創高，卻沒有成交量的支持，導致走勢後繼無力。二〇一七年五月跌破頸線，引發瀑布式的下跌走勢，從每股三十美元下跌至十美元以下（參圖
    40）。


    再看看食品公司「卡夫亨氏」（The Kraft Heinz Company，美股代號 KHC）的股價走勢也是如此，股價上漲創新高的過程中，由於沒有伴隨成交量的支持而露出疲態，股價跌破頸線後雖然進行了約五個月的整理，卻無法重新站回頸線之上，開啟另一波更嚴重的下跌走勢（參圖
    41）。


    ### 圖 41 卡夫亨氏 2016 至 2019 年股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_222_0.png)


    圖片來源：TradingView


    ### 圖 42 頭肩底的反轉型態


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_222_1.png)


    **頭肩底：底部型態，確認低檔反轉**


    頭肩底與頭肩頂是完全相反的型態，也代表完全不同的意義。頭肩底是由三個波谷組成，主要的波谷呈現的價格最低，其餘兩個波谷則低點相近，是確認股價跌無可跌、準備鹹魚翻身的典型反轉型態。常見走勢如圖
    42。重要的確認訊號是，在價格下跌的過程中，股價雖創新低，但成交量逐漸縮減，最後挾大量上漲突破頸線。


    具有頭肩底型態的公司，通常都是股價之前歷經嚴重跌勢後陷入低檔整理，等待基本面改善與籌碼消化後，才有辦法重新振作。蘋果公司在二○一五至一六年時，因創新能力被市場質疑，結果公司股票遭到拋售，股價在當時陷入泥沼，直到二○一七年才開始有顯著的突破發展（參圖
    43）。


    再看看運動品牌耐克，二○一六年可說遭遇逆風，股價陷入低潮，歷經快兩年的整理才有明顯突破，股價在突破後開啟一段明顯的上漲趨勢（參圖 44）。更多關於耐克基本面變革的討論，請參第五部。

    '
