    有時間，我們稱之為「時間架構」。短線交易者通常選用的時間架構較短，觀察短期的移動平均線來決定買賣點；而長線投資人選用的時間架構較長，觀察更長期的移動平均線來決定買賣點。這表示如果是用長期移動平均線來進行買賣點的決策，就可以減少交易次數，持有時間也愈長，降低因為頻繁交易而產生的交易成本。


    # 延伸指標：MACD


    移動平均線是相當實用的指標，根據移動平均價格的計算也衍生出許多相關的指標，例如「平滑異同移動平均線指標」（以下簡稱MACD）。


    MACD的計算方式是把短期移動平均減去長期的移動平均，通常採用十二日和二十六日的指數移動平均（exponential moving averages, EMA）得出的差值，來觀察長短期移動平均線處於收斂還是發散。當MACD為正值且價格位於均線之上時，表示股價處於上升趨勢；當MACD為負值且價格位於均線之下時，表示股價處於下跌趨勢。


    計算出MACD指標後，再计算出最近九個交易日的EMA，稱為「訊號線」。觀察圖30下方的兩條曲線分別代表MACD與訊號線的走勢，下方的直條圖表示MACD與訊號線的距離。若MACD大於訊號線，則直條圖高於零軸；若MACD小於訊號線，則直條圖低於零軸。'
