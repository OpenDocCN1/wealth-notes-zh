    ### 競爭對手與未來展望


    在上市公司中，Adobe 的 Adobe Sign、Dropbox 的 HelloSign，以及 Citrix（美股代號 CTXS）的 RightSignature，都是電子簽名市場中的競爭者，也有許多未上市的新創公司正在積極拓展。


    由於企業對於工作效率提升、安全性與供應鏈管理需求的增長，研究機構 Market and Dales 預估，全球的電子簽名市場將從二〇二〇年的二十八億美元成長至二〇二六年的二百四十一億美元，每年將會以一・○四%的複合成長率成長。若
    DocuSign 的市占率可以維持在七○%，等於擁有九十八・七億美元的潛在機會，從二〇一九年的總營收九・七四億美元來看，成長空間相當大。


    原本已處在高速成長軌道的電子簽名與合約市場，因為二〇二〇年新冠肺炎疫情，造成需求急速升溫，使得 DocuSign 的業績大幅增加。公司的成長策略除了吸引新客戶，還包括舊客戶增加購買其他方案與國際市場的布局，在電子簽名的普及率逐漸提高、導入新客戶的數量持續增加的情況下，潛在商機很大。


    顯見 DocuSign 的未來發展十分值得期待。


    想要評估 DocuSign，合適的進場時機，比起已有盈餘的成長股，公司尚未開始獲利是因為把錢都去衝成長，所以營收爆發性會更強，股價反而追着營收成長率跑。營收成長率對公司的股價影響相當大，營收成長愈高，股價漲勢愈凶，投資人若用「股價／營收比」判斷目前的價格是否被低估，反而會產生買高賣低的偏誤，所以判讀時最好加入技術型態的輔助來控制風險（詳見第四部）。


