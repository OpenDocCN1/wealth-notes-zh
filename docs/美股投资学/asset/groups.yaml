    # 未來展望


    後疫情時代，加速了所有產業的數位轉型，餐飲業也是如此。在新冠肺炎疫情的影響下，許多實體店面被強制關閉，或禁止在室內用餐而改為外帶，卻因此大幅提高了App網路訂餐、顧客忠誠計畫與外送服務的普及程度，讓顧客可以更方便、更快速地享用餐點，並藉由數據分析來提高產品質量與顧客滿意度。


    長遠來看，Chipotle 未來的成長性可由兩部分來觀察：'
  - '[PAGE 246]


    一、新店開設：二〇一七、一八年開設新店的速度放緩，着重在內部管理。依公司年報所提，二〇一九年計畫開設一百四十至一百五十五家分店。而海外開店部分，管理層則較保守，認為Chipotle產品的口味不適合推向國際店，如此反而可能有損公司的獲利能力


    二、線上訂單系統的發展：外送訂餐的趨勢逐漸普及，根據Statista統計，二〇一九年線上訂單成交金額達到一九五億美元，二〇二三年將達到二四五億美元。而Chipotle的線上訂單系統做得很早，也做得相當不錯，執行長尼可希望未來三年能將公司從線上訂餐獲得的收入份額提高到了五〇%以上。不管是餐點製作效率或消費集點的忠誠計畫，目標在於提升消費者良好的使用體驗，促使他們未來持續消費的可能性。


    雖然Citizre的管理層認為自己不適合走向國際，但投資人在關注其他餐飲股時，仍可觀察公司是否有發展網購管道、打造新型態的用餐模式，以及是否能拓展海外市場，因為美股中的餐飲股不會只聚焦美國市場，而會以全世界為目標，積極向外展店。


    像Chipotle這樣具成長性的餐飲股在美股中相當常見，由於美股公司提供的產品與服務皆以全世界為市場，餐飲業又有持續性需求，能靠著持續開發新餐點來吸引不同的顧客群。除了在美國快速展店，也能擴張到海外市场，讓獲利持續成長。若對美國上市的'
