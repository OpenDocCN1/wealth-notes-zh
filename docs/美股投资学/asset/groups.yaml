    ### 反轉型態：頭部與底部判讀


    反轉型態的發生，對投資人來說是相當重要的訊號。股價在低檔建構反轉型態，有可能是基本面開始轉好，機構投資人開始偷偷買進，買盤支撐股價不再下探低點，也是股價即將止跌回升的訊號。這時候投資人可以關注股價的後續發展，一旦反轉確立便可以進場布局。


    反之，股價若是在高檔建構反轉型態，則是相當不利後續走勢的訊號。一檔股票經過一段強勢的上漲而來到高點，卻沒有持續的買盤支撐股價再創新高，反而有賣壓出籠，讓股價的波動開始加大，就要小心是否有人正在出貨，把股票倒給想要追高的投資人，最後套牢在高點。


    當趨勢延續一段時間，投資人若發現價格走勢開始大幅震盪，發生「高點不破、低點不破」的現象時，股價有可能正在醞釀反轉。這時投資人最好不要衝動進場，反而應該先觀察股價型態的變動，等待價格走勢確認後再採取行動也不遲。以下介紹常見的反轉型態，只要理解這些基本形態，再延伸至其他變形，就能更好地掌握股價趨勢。


    ### 圖 39 頭肩部的反轉型態


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_220_0.png)


    **頭肩頂：頭部型態，確認高檔反轉**


    頭肩頂是典型的反轉型態，在發展過程中，會由一個主要的波峰加上兩側各一個高點相近的波峰組合而成，看起來很像一個人的頭部與肩膀，因此被稱為「頭肩頂型態」。


    頭肩頂常見的走勢如圖 39。價格在第一 次創高後，股價拉回整理再重新向上創新高，不過沒有持續買盤推升股價，導致股價再次下跌至前一個低點。雖然股價在前一個低點仍有支撐力道，但重新上漲後無法再創新高，僅上漲到第一
    個高點後就再次下跌，這時就已經有了頭肩頂的雛型產生。


    要確認股價是否反轉向 下，股價向下突破兩個低點連成的頸線是關鍵，也是頭肩頂確定成形的必要因素。縱然股價還想重新振作往 上，但頸線已經變成主要的壓力，阻止股價發展，也讓股價陷入弱勢的局面。除此之外，圖中的頭肩頂型態不一定只有兩個波峰，也有可能如圖
    39 的右圖中所見，只要頸線相連，股價向下突破仍可確認反轉成立。


    ### 圖 40 通用電器 2015 至 2018 股價走勢


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_221_0.png)


    圖片來源：TradingView


    但不是每一個頭肩頂型態都是標準型，只要多觀察就能找到共通點，預先設下停損點，控制投資風險。以通用電器（General Electric Company，美股代號
    GE）為例，二〇一六年的走勢是相當典型的頭肩頂型態，股價在一五年底伴隨高成交量創下新高後拉回，後續股價雖然再度創高，卻沒有成交量的支持，導致走勢後繼無力。二〇一七年五月跌破頸線，引發瀑布式的下跌走勢，從每股三十美元下跌至十美元以下（參圖
    40）。


    再看看食品公司「卡夫亨氏」（The Kraft Heinz Company，美股代號 KHC）的股價走勢也是如此，股價上漲創新高的過程中，由於沒有伴隨成交量的支持而露出疲態，股價跌破頸線後雖然進行了約五個月的整理，卻無法重新站回頸線之上，開啟另一波更嚴重的下跌走勢（參圖
    41）。


