    的 E T F，投資一籃子產業中的公司，跟著他們的發展一起獲利。


    N V D A）、電子支付公司「 S q u a r e」（美股代號 S Q）等高速成長股，也可以買入相關


    由於技術的進步，帶動企業轉型與消費升級，這些產業的發展都仍在高速發展中，如同一輛賽車奔馳在寬廣的賽道上，讓賽車手可以緊踩著油門狂奔。資金如同車水源源不絕的能源，讓這些美股公司的成長動能可以延續，股價長期趨勢向上，更適合長期持有。也因為如此，在研究這些公司時，我都用更多元的角度去看待它們，以一個更長遠的眼光去思考公司的未來，在腦中描繪所有可能的情境，並試著找出答案。用這樣的方


