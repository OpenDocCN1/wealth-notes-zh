    根據Snagc Research Group的研究，二〇二〇年第二季，全球在雲端基礎設施服務支出超過三百億美元，比二〇一九年增加七十五億美元，在數位轉型趨勢發展下，這個數字未來將繼續成長。而在幾家主要的服務提供商中，亞馬遜的AWS目前仍是市占率最高的雲端服務平台，市占率高達三三％，比起微軟的Azure占比十八％、字母控股的Google
    Cloud占比九％，前五大廠商的市占率達到八成。


    在這樣的情況下，競爭對手的加入使得市場競爭愈來愈激烈，以致 AWS 從二○一九年以來平均四○％以上的年成長率，到了二○二○年第三季的財報公布時，年成長率僅二九％，是投資人應關注的重點趨勢之一。


    亞馬遜在電子商務與雲端平台的領導地位目前仍無人能取代，加上貝佐斯優異的領導能力，帶領公司不斷地創新與成長。除了原本的業務，亞馬遜透過廣大的會員數與數據蒐集，致力於發展
    Prime 會員經濟、訂閱服務與廣告業務，未來也都具有相當大的發展空間，讓市場對亞馬遜的股價有更多期待。


    # 網飛


    網飛成立於一九九七年，其實公司一開始並不是一家串流媒體公司，而是與競爭對手百視達（Blockbuster）一樣都是以經營DVD出租服務為主。時至今日，百視達已然殞落，而網飛的成功源於創辦人里德·海斯汀（Reed
    Hastings）在早期發現串流媒體服務商機，並在二〇〇八年開始積極轉型，享受先行者的優勢，成為串流媒體產業的領導者。


    網飛的商業模式採訂閱制，提供不同的價格方案，讓使用者根據需求選擇合適的方案付費。由於客戶如果不滿意服務就可以隨時取消訂閱，低進入門檻讓網飛快速普及，用戶數與營收快速成長。不過為了提高消費者體驗，滿足觀眾的所有需求，避免客戶流失的情況產生，網飛也必須將獲利再投資於節目製作，由於金額龐大，使得公司現金流仍為負數，且數字一年比一年還多，沒有止穩跡象。


    投資人在評估網飛的未來發展時，除了觀察公司的財務面、成本控制與資本的運用效率是否得當，也應該關注「訂閱用戶增長」、「每月平均用戶收入」與「現金流變動」等重要指標。隨著用戶數的增加，公司是否有辦法兼顧內容品質與成本管控，是股價能否進一步上漲的關鍵。


    - 訂閱用戶增長：網飛製作一部影集，產生內容的成本都是固定的，如果訂閱人數愈多，換算下來花在每位客戶的成本就會愈低，回收得更快。二〇一一年第三季到二〇二〇年第一季，訂閱人數持續增加，已經達到一．九三億訂閱數（參圖5），其中七二九○萬來自美國，占總營收的五六%。由於美國市場的成長可能趨緩，為了營收成長，網飛相當積極地拓展海外市場，與當地媒體業者合作發行作品，藉由降低成本、提高效益來推動成長。

    - 每月平均用戶收入：儘管訂閱人數持續增加，不過如果是以價格戰來吸收顧客，那麼公司未來的獲利就岌岌可危了。網飛在二〇一七年進行了兩次漲價策略，從財報數字來看並沒有對公司造成嚴重的衝擊。除了人數增加之外，二〇一六到一九年的平均用戶收入也從八．六一美元上漲到一〇．八二美元（參圖6），這是因為公司仍然持續產出好的內容，根據消費者的喜好調整演算法，藉以提高顧客的忠誠度，即使漲價也會繼續訂閱。

    - 現金流變動：網飛的營收與獲利雖然持續高速成長，最近十年的平均每年營收成長率為二八．三%, 獲利成長率高達三〇．八%, 但由於需要將資金投資在龐大的內容上，因此現金流持續流出，金額有增無減。表13為二〇一五至一九年的現金流量表，或許你會很驚訝，一家年營收超過兩百億美元的公司，營業現金流竟是負數！這是因為公司將內容製作的成本計算在內，折舊與攤提的費用必須從營業現金中扣除，使得現金流量流出持續擴大。在這樣的情況下，網飛就必須舉債來支應支出，因此負債比率很高，未來如果遭遇營運逆風、營收衰退，所面臨的風險也相對較高，是投資人應該密切關注的部分。


