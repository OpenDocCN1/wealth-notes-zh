    # 第20章

    專屬自己的投資哲學，成為紀律投資者


    進入投資市場超過十五年，一路的心得讓我深刻體悟到價值投資大師查理·蒙格（Charlie Munger）的一句話：「如果知道我會死在那裡，那我將永遠不去那個地方。」重視風險，避免重大的錯誤，比承受風險、賺取誘人報酬更重要，因為最毒的毒藥往往包在最絢爛的糖衣之下，等到發現時為時已晚。


    每位投資人在市場上都有可能犯錯而造成投資虧損，包括我自己，但犯錯並不可怕，在可接受的損失之下，重要的是能否在每一次的錯誤中及時發現、檢討、反饋與修正，因為市場永遠會給我們重新振作的機會。


    化理解爲個人獨特的投資邏輯


    投資最怕人云亦云，投資人最容易犯的錯誤，就是在大盤熱絡、市場一片看好的情'
  - '[PAGE 294]


    況下，對於沒有研究過的公司，只是看到股價上漲就衝進市場追價，結果剛好接在最高點，損失慘重。而有經驗的投資人處在市場中，也不免被市場氛圍所影響，違反原先設定的投資原則，買入被高估的股票。


    巴菲特曾說過：「想要達到穩健的投資，必須仰賴知識的累積與理性的選擇。」知識是你對於自己投資的公司蒐集了多少資訊，對這些資訊進行整理、分析與邏輯推導，列出所有可能的情境與結果，把這個過程轉化為腦中的智慧，並藉由實際操作來得到經驗與成果。理性則是避免從眾心理，培養獨立思考的能力。在面對投資事件事情時，投資人應該擁有一個健康的心態，設定合理的目標，不隨群眾起舞，也不一窩蜂地追逐熱門標的。當結果不如預期，應該願意坦誠接受失敗，反思問題的核心來進行修正，持續地精進對危機的應對方式與對市場的理解。


    建立一套完整的投資邏輯，可以藉由下列四個面向來思考：


    +   一、理解經濟運行的規律：目前處在景氣循環與信用週期的哪個位置。

    二、理解資本市場的運行：市場的規則與其他參與者的行為呈現出什麼樣的氛圍。

    三、理解這個行業或公司：產業趨勢是否正在成長，以及公司基本面是否穩健。

    四、理解自己：我適合什麼樣的方法做研究和投資。'
  - '[PAGE 295]


    藉由回答上面四個問題來建構自己的知識與理性，思考對投資真正重要的因素，整合出一套投資邏輯與操作系統，保持耐心與堅守原則，不要為股票付出過高的價格，但當價格跌到合理價位時要毫不猶豫地買進。雖然投資人無法預測市場的變化，卻可以先做好萬全準備，等待機會降臨。


    不過，我認為最重要的其實是最後一個問題，也就是投資人到底夠不夠了解自己能成為哪一種投資人、採用什麼樣的策略。一個人的投資方式反映了他的生活態度，如果用了不適合的方法，便沒辦法有紀律地執行決策，更不要說靠這個方法在市場上長期獲利。在還不了解企业自己之前，最好的方式就是學習前人的智慧，從模仿開始。


    # 最好的學習從模仿開始


    成為一位紀律的投資者需要時間與經驗的累積，最好的學習都是從模仿開始，不管是投資新手或在股海打滾已久的老手，勇於摸索新事物、持續培養閱讀的習慣、積極蒐集資訊，並將資訊篩選與整理成知識，再串聯成智慧，就變成邏輯推理的最佳工具，幫助你更理性地做出投資決策。


    在這個階段，最好的模仿對象就是成功投資者，願意提供他們寶貴的市場經驗，幫助你更快進入狀況，找到最適合自己的投資方法，並選出最合適的投資標的。投資美股'
  - '[PAGE 296]


    可以學習的對象很多，美國許多投資大師與避險基金皆有出版書籍或公開的資料與論文可以參考，投資人可透過眾多管道汲取這些寶貴的研究。


    我剛開始投資時雖然接觸的是技術分析，但直到閱讀了葛拉漢與大衛·陶德（David L. Dodd）所撰寫的《證券分析》（Security Analysis）以及巴菲特的相關書籍，才開始真正將投資這件事系統化，懂得辨別好公司的特徵。《證券分析》中對於真正的價值投資哲學定義、如何評價值產與企業的價值、辨識股價的安全邊際、衡量風險與報酬之間的關係等重要觀念，都是我後續投資決策上依循的原則，影響相當深遠。


    後來又讀了馬克·米奈爾維尼（Mark Minervini）的《超級績效》（Trade like a Stock Market Wizard）與威廉·歐尼爾（William
    J. O''Neil）的《笑傲股市》（How to Make Money in Stocks），這兩本書著重於技術分析的探討，也讓我的操作方式開始將基本面向結合技術分析，藉以判斷成長股的股價發展趨勢。一家公司的股價上漲不僅有基本面的支撐，更重要的是市場上資金的流向，才是推升股價上漲的最大動能。如果只是一味地依賴估值指標，往往會陷入數字的盲點，錯失了更多獲利的機會。


    最後，當投資人擁有知識與方法後，最重要的則是心法，也就是正確心態的培養。我們要謙虛地面對市場，將實際操作的成果轉化為經驗，持續反饋來增強自己的能力。


    想要培養投資上的正確心態，我也相當推薦幾本書籍可以參考。第一本是麥可·莫'
  - '[PAGE 297]


    布新（Michael J. Mauboussin）撰寫的《魔球投資學》（More than You Know），作者把股市視為一個複雜的適應系統，想在市場中生存，就得以跨學科的視角來看投資，學習簡化複雜的問題，以冷靜的態度接受我們不能預測的事，並勇敢預測我們能預測的事。


    其次是美國經濟學家、二〇一七年諾貝爾經濟學獎得主理查·塞勒（Richard H. Thaler）的《不當行為》（Misbehavior）與羅伯特·席勒（Robert
    James Shiller）的《非理性繁榮》（Irrational Exuberance），這兩本都是行爲經濟學必讀的經典書籍，作者從經濟理論的角度切入，並加入對人類行爲的研究，藉由了解群衆互動所產生的影響來強化理論如何轉化為現實，驅動市場的變化，找到可辨識的循環週期。


    不僅是經濟學、心理學書籍，還可以閱讀商業傳記、科技趨勢等不同類型的書籍。透過大量的閱讀，將每個階段接收的知識融會貫通，找到最適合自己的進出場策略，持續穩定地在市場中獲利。


    # 建構自己的投資策略


    很多人都希望建構一個投資模型來進行每一筆交易決策，但是要建構自己的投資策略，必須從多方面來進行評估，就好像設定一個程式，在程式中加入諸多參數，摒除外部干擾來確實執行指令。'
  - '[PAGE 298]


    所以，你的投資模型應帶入的參數包括資金規模、風險承受度、交易風格等，唯有找出適合的投資流程與目標，才有辦法規畫達成的方法，並從每一次的決策中得到反饋與修正。


    一般投資人的投資決策也不是靠隨機猜測來擬定的，而是藉由經驗找到支持股價上漲的相關因素，買入符合條件的股票。在建構出初步的投資模型後，要知道一個完美的投資模型並不會保證每一筆都會賺錢，而是在大量交易筆數之下獲得一個穩定的獲利結果。而要有這樣的獲利，必須考慮下列幾個因素：


    # 一、本金


    你有多少本金可以投資？這筆資金是閒錢嗎？是否會有任何狀況導致這筆資金需要提領出來？如果這筆資金對你的生活會造成重大影響，建議還是不要把錢投入股市，因為股市的漲跌是隨機波動的，一旦市場開始下跌，你的資產也會貶值。


    本金的規模也是相當重要的問題。資產少的投資人跟著大戶進出市場卻總是賺不到錢，原因在於大資金與小資金的操作方式其實完全不同。如果是資金規模大的投資人，在操作上會更著重於穩健增長，資金進出市場的頻率也會更低，避免對價格波動造成過大的影響，試想如果你是巴菲特，著重的當然是現金流的收益更勝於短期的資本利得'
  - '[PAGE 299]


    吧。而資金規模小的投資人，雖然缺點是對價格的影響力微不足逍，跟著大戶投資時，如果沒有考慮時間成本，在價格上漲之前眼巴巴等股價上漲，資金的運用反而相當沒效率；反過來思考，小資金的優點是更適合靈活的操作方式，例如更短期的波段投資，或是操作市值比較小的股票也不用擔心流動性的問題，讓本金可以發揮更大的價值。


    # 二、報酬


    你希望在多長時間內創造多少報酬？根據設定的目標來反推年化報酬率，是幫助你擬定策略的最好方式。


    舉例來說，許多人最常採用「七二法則」，也是將七十二除以投資報酬率，計算出让資產翻倍需要多少年的時間。假設報酬率為一〇%，七十二除以十得到七、二，表

    示資產翻倍需要七、二年的時間。又或是規畫未來退休之後每年可以領取的現金流，

    許多人會用「四%法則」來計算，也就是考慮到退休後每年所需的生活支出，將一年的花費除以四%來計算需要的資產規模，如果預計退休後年需花費一百萬元，則退休金就應該高於兩千五百萬元（1,000,000
    ÷ 4% = 25,000,000）。


    最後還有一種專職交易者，追求的是絕對報酬，而不只是超越大盤的相對報酬，他

    們必須花費更多時間與精力在投資上，才能創造出更優異的績效以符合所付出的總成本。'
  - '[PAGE 300]


    # 三、風險


    唯有了解自己的個性，才能知道對投資的風險承受度有多高，思考每一筆可虧損的金額是多少，然後決定資金配置狀況。


    市場上對於風險的定義有很多，但我認為價值投資大師霍華·馬克思（Howard Marks）提出的定義最貼切：「真正的風險是本金蒙受損失的風險。而投資人的工作就是為了獲利而聰明地承擔風險。」


    由於風險無法完全消除，但可以先對風險做足準備，像是找到負相關性的資產、將資金分散投資，或設定停損點來控制損失，降低面對危機發生時的威脅與打擊。當我們瞭了解風險，就愈能掌握自己的投資組合。我總是在電腦旁貼著一句話：「低買高賣，大賺小賠。」提醒自己不要讓情緒因子擾亂投資決策，因為「風險極小化，獲利極大化」永遠是投資市場中的常勝法則。


    # 四、風險報酬比


    「風險報酬比」是在擬定投資策略中相當重要的關鍵因素。許多投資人願意接受小額的獲利，卻不願接受小額的虧損，讓虧損部位持續擴大，造成難以挽救的結果。想要獲得超額報酬，不能只看眼前的獲利而忽略了風險。因此，我們必須根據自己對投資標的'
  - '[PAGE 301]


    的研究，評估未來潛在上漲與可能下跌的幅度，思考現在是否位於合理的投資價格。


    巴菲特曾說：「不要指望股票賣出好價格，而是只要買進價格合理，即使賣出價格普通也能為你帶來好績效。」以價值投資理論來看，估算出一家公司的內在價值，在價格低於價值時買進公司的股票，留下足夠的安全邊際，就是在限制投資人的風險，並盡可能放大期望獲得的報酬值。


    而在技術分析的領域，風險控管是絕對不能忽視的部分。第四部曾討論過股價型態的支撐與壓力位置，這些可代表一家公司股價的關鍵點位，判斷股價的趨勢是否得以延續或顯示即將反轉的訊號。一旦股價朝著非預期的方向前進，就必須及時停損，等待更好的進場機會。


    我在規畫資金配置時，通常是將資金進行較平均的分配，部位的規模以每筆資金的最大虧損不超過總資金的二至五%來設定，嚴設停損機制，讓獲利持續奔跑，我認為這才是累積資產的最好方式。


    # 假設與推論


    在決定是否要投資一家公司之前，投資前必須先進行完整的調查，了解該公司的經營狀況、獲利表現以及管理階層等是否良好。'
  - '[PAGE 302]


    投資人可以不斷提出問題，靠自己對公司的認知來回答，就會發現過程中搜尋資料的精準度也會大幅提升。舉例來說，一家具有轉機題材、營運狀況逐漸改善、轉虧為盈的公司可能就會衍生出下列的問題：


    +   * 問：為什麼上一季發生虧損？

    * 答：產品銷量未達預期。


    +   * 問：為什麼產品銷量未達預期？

    * 答：因為不受消費者青睞。


    +   * 問：為什麼不受消費者青睞？

    * 答：因為公司沒有做足充分的市場調查、產品設計不符合消費者需求、行銷方式錯誤。


    +   * 問：那要怎麼解決？

    * 答：端視公司目前提出的調整方案為何。


    +   * 問：這種現象是一時的還是永久的？

    * 答：要判斷公司股價是否被低估，未來是否有可能重新振作。'
  - '[PAGE 303]


    回答完這些問題後，對公司未來的展望也會有清楚的藍圖，自然能進行合理的估值與設定買進的價格區間。


    # 檢討與反饋


    每一次的投資決策都是彼此獨立的，單筆投資的正確或錯誤都有原因，想要更精進自己的投資能力，最好的方式就是為每一筆投資決策製作紀錄，對自己的投資負責。


    投資決策的重要性往往被投資人忽略，認為只要有券商提供的對帳單、關注帳面上的損益就是在做投資了，但製作交易紀錄才是提升投資績效的關鍵。投資人應記錄下每一筆投資進出場的原因，計算交易的勝率、獲利的總金額，在後續的檢討中釐清盲點，不要犯下重複的錯誤。最重要的是，交易紀錄可以讓我們複製成功模式，千萬不要相信自己的記憶，而要靠交易紀錄幫我們養成執行紀律的習慣。


    # 紀律執行策略


    投資最難的部分不是判斷出最好的投資策略，而是維持長期的觀點，在市場的高峰或低谷都堅守原則。在建構了自己專屬的投資模型後，影響我們是否可持續獲利的最大因素，不是已經擁有了最完美的投資方式，而是擁有正確的投資心態。'
  - '[PAGE 304]


    價值投資人葛林布雷說：「一個方法之所以有用，是因為它不是一直有用，甚至經常没用。堅持到底地使用這套方法，市場終究有一天會站到你這邊！」很多時候，其實我們已經有了好的方法，但方法總有失靈的時候，這時如果無法保持耐心，轉而投向自己不熟悉的領域，最後就會把獲利又吐了回去。


    在投資的過程中也是，如果你是一位短線交易者，有時會發現自己獲利了結的股票又上漲了一倍，這時並不需要覺得後悔，因為你原本設定在行情的發展中進行一段特定區間的操作，目標是否確實達成才是關鍵的。如果你是一位長線投資人，也有可能短期賺取到不錯的報酬時，因為預期未來會有更高的獲利空間，最後卻損失了原本曾經擁有的帳上獲利。每一筆投資不一定都會帶來預期的結果，但投資人仍必須堅守原則，有紀律地進出市場。


    本章主要討論的主題，是一個專業投資人養成的必經過程。其實最重要的是認識自己，透過認清自己在市場中的位置，清楚掌握自身的優勢，定期檢視投資流程，記下每筆投資決策的動機與結果，並思考什麼樣的投資策略可以發揮優勢。除此之外，投資人必須願意接受失敗，因為這是發現錯誤與防止重蹈覆轍的最佳方式，也唯有面對不完善的自己，才會發現持續進步的空間，獲得滿意的投資報酬，並持續存活在市場中。'
  - '[PAGE 305]


    # 第21章


    # 建立正確投資心態，克服心理偏誤


    在投資這條路上，決定投資成敗的關鍵就是心態。近幾年來，由於行為經濟學的興起，挑戰傳統經濟學理論中關於「人都是理性」的假設，讓我們知道人的決策不是只關於訴訟理性，而與情緒因素相輔相成。


    投資市場也是經濟學的延伸，股市會上漲或下跌，由市場裡所有投資人的行為所決定，在我們做這些決策時，往往會受到心理偏誤影響而無法保持理性。誠實面對這些問題，了解人性的慾望、貪婪和恐懼如何影響我們的心理，幫助我們做出更好的投資決策。所以，在前一章中一直強調要有紀律地進出市場，將自己的投資流程標準化，幫助我們在擬定投資決策時對抗人性本身的心理偏誤。以下是一般投資人面對投資行為時容易產生的心理偏誤，讀者不妨自我檢視。'
  md: "\n# 圖 46 各種類型投資人的股債配置比例\n\n![](img/59586a9aa5c5e7f9004ef373947a8ffe_287_0.png)\n\
    \n一、保守型投資人：股票二〇%，債券八〇%。保守型投資人通常將投資組合中很大一部分的占比配置在債券資產上，以保護本金，獲取穩定的現金流為目標。\n\n二、穩健型投資人：股票五〇%，債券五〇%。由於穩健型投資人希望資產能夠穩定增長，因而願意承擔適度的風險，以保護通貨膨脹帶來的影響，他們會以尋找優質且能支付股息的證券資產為主要目標。\n\
    \n三、積極型投資人：股票八〇%，債券二〇%。積極型投資人允許資產價值有劇烈的波動，他們以資產能快速增值為目標，挑選具有爆發性成長潛力的股票，藉此獲取比市場平均價更高的超額報酬。\n\
    \n由於本書以主動選股為主，接下來就以積極型投資人為例（即希望長期以高效率的方式獲取報酬、累積資產，更快達到財務目標），結合前面介紹過的內容，建構一個積極成長的投資組合。\n\
    \n# 圖 47 積極型投資人的股債配置比例\n\n![](img/59586a9aa5c5e7f9004ef373947a8ffe_288_0.png)\n\
    \n## 股債配置\n\n如前面所述，積極型投資人的股票配置占八〇%，債券占二〇%，因此在這八〇%的比例中，建議大盤ETF至少配置四〇%以上，而剩餘四〇%可依投資人對市況的研究、產業的觀察與個股的\
    \ analisis，配置在看好的標的上（參圖47）。\n\n至於我自己則以主動選股為主，投資組合中有四〇%為大盤ETF，包括「SPDR標準普五百指數ETF」（美股代號SPY）與「Invesco那斯達克一百指數ETF」（美股代號QQQ），另外四〇%則配置在趨勢產業的ETF、穩健成長股、房地產類（REITs）與高速成長股。\n\
    \n# 圖 48 財女 Jenny 的投資組合\n\n![](img/59586a9aa5c5e7f9004ef373947a8ffe_289_0.png)\n\
    \n趨勢產業ETF包括當前高速發展中的金融科技、電子商務與電動車概念，在美股中有相當多標的可選擇，而穩健成長股則以公司營運穩定、財務體質良好的股息成長股或\
    \ 200 為主，最後再搭配股價波動大的高速成長股或技術型態面有突破的公司，作為短期收益來源。\n\n我的目標是打造一個長期正向循環的投資組合（參圖 48）。\n\
    \n在這個組合中，我將具有現金流入槓桿的資產再投資，並將短期操作的獲利再投入到這些穩健增長的標的上，讓資產可以更快速累積。累積資產的方式有以下兩種，讀者可參考並進行操作：\n\
    \n- 一、定期定額：即固定將收入的一定比例，以定期定額的方式投入到市場，進行股價配置，追求長期穩健的增長。根據過去歷史的紀錄，自一九二六年来，股票八○%加債券二○%的積極型投資組合每年可創造九·四%的平均報酬率，優於保守型和穩健型的投資組合，原因就在於政府政策與持續的生產力創新，推升資產價格上升，股市持續走高，長期的表現優於債市。這也是為什麼現今的投資人一定要投資的理由，因為長期投資能讓我們在上市公司賺取的利潤中分一杯羹。\n\
    \n- 二、正向投資組合循環：除了定期定額，還可以將固定收益證券、有支付股息的標的再進行投資，包括股息成長股與REITs，使用券商提供的股息再投資計畫（Dividend\
    \ Reinvestment Program, DRIP），將配發的股息自動再買入公司的股票。目前有許多美股券商提供了股息再投資計畫是不收手續費，更可以節省成本，長時間累積複利效果。除此之外，成長股的波段操作在獲利了結後也要再投入到市場中，讓這些獲利帶來更高的價值。我通常會把短期的獲利分為兩部分，其中一部分等待其他好機會便積極出手，另一部分則投入到大盤指數，為這些資金尋求長期的坡道，持續地滾雪球，讓雪球愈滾愈大。\n\
    \n> 如同巴菲特所說：「人生就像滾雪球，你只要找到溼的雪和很長的坡道，雪球就會愈滾愈大。」人生的每一件事都是經驗的累積，而投資也是經驗的累積，幫助我們在過程中愈來愈順，愈快達到自己想要的目標。\n\
    \n# 第六部\n\n## 用正確心態讓投資長長久久\n\n重視風險，避免重大的錯誤，比承受風險、賺取誘人報酬更重要。\n\n每位投資人在市場上都有可能犯錯而造成投資虧損，但犯錯並不可怕，在可接受的損失之下，重要的是能否在每一次的錯誤中及時發現、檢討、反饋與修正，因為市場永遠會給我們重新振作的機會。\n\
    \n![](img/59586a9aa5c5e7f9004ef373947a8ffe_292_0.png)\n\n### 第20章\n### 專屬自己的投資哲學，成為紀律投資者\n\
    \n進入投資市場超過十五年，一路的心得讓我深刻體悟到價值投資大師查理·蒙格（Charlie Munger）的一句話：「如果知道我會死在那裡，那我將永遠不去那個地方。」重視風險，避免重大的錯誤，比承受風險、賺取誘人報酬更重要，因為最毒的毒藥往往包在最絢爛的糖衣之下，等到發現時為時已晚。\n\
    \n每位投資人在市場上都有可能犯錯而造成投資虧損，包括我自己，但犯錯並不可怕，在可接受的損失之下，重要的是能否在每一次的錯誤中及時發現、檢討、反饋與修正，因為市場永遠會給我們重新振作的機會。\n\
    \n#### 化理解爲個人獨特的投資邏輯\n\n投資最怕人云亦云，投資人最容易犯的錯誤，就是在大盤熱絡、市場一片看好的情況下，對於沒有研究過的公司，只是看到股價上漲就衝進市場追價，結果剛好接在最高點，損失慘重。而有經驗的投資人處在市場中，也不免被市場氛圍所影響，違反原先設定的投資原則，買入被高估的股票。\n\
    \n巴菲特曾說過：「想要達到穩健的投資，必須仰賴知識的累積與理性的選擇。」知識是你對於自己投資的公司蒐集了多少資訊，對這些資訊進行整理、分析與邏輯推導，列出所有可能的情境與結果，把這個過程轉化為腦中的智慧，並藉由實際操作來得到經驗與成果。理性則是避免從眾心理，培養獨立思考的能力。在面對投資事件時，投資人應該擁有一個健康的心態，設定合理的目標，不隨群眾起舞，也不一窩蜂地追逐熱門標的。當結果不如預期，應該願意坦誠接受失敗，反思問題的核心來進行修正，持續地精進對危機的應對方式與對市場的理解。\n\
    \n建立一套完整的投資邏輯，可以藉由下列四個面向來思考：\n\n- 一、理解經濟運行的規律：目前處在景氣循環與信用週期的哪個位置。\n- 二、理解資本市場的運行：市場的規則與其他參與者的行為呈現出什麼樣的氛圍。\n\
    - 三、理解這個行業或公司：產業趨勢是否正在成長，以及公司基本面是否穩健。\n- 四、理解自己：我適合什麼樣的方法做研究和投資。\n\n藉由回答上面四個問題來建構自己的知識與理性，思考對投資真正重要的因素，整合出一套投資邏輯與操作系統，保持耐心與堅守原則，不要為股票付出過高的價格，但當價格跌到合理價位時要毫不猶豫地買進。雖然投資人無法預測市場的變化，卻可以先做好萬全準備，等待機會降臨。\n\
    \n不過，我認為最重要的其實是最後一個問題，也就是投資人到底夠不夠了解自己能成為哪一種投資人、採用什麼樣的策略。一個人的投資方式反映了他的生活態度，如果用了不適合的方法，便沒辦法有紀律地執行決策，更不要說靠這個方法在市場上長期獲利。在還不了解企业自己之前，最好的方式就是學習前人的智慧，從模仿開始。\n\
    \n#### 最好的學習從模仿開始\n\n成為一位紀律的投資者需要時間與經驗的累積，最好的學習都是從模仿開始，不管是投資新手或在股海打滾已久的老手，勇於摸索新事物、持續培養閱讀的習慣、積極蒐集資訊，並將資訊篩選與整理成知識，再串聯成智慧，就變成邏輯推理的最佳工具，幫助你更理性地做出投資決策。\n\
    \n在這個階段，最好的模仿對象就是成功投資者，願意提供他們寶貴的市場經驗，幫助你更快進入狀況，找到最適合自己的投資方法，並選出最合適的投資標的。投資美股可以學習的對象很多，美國許多投資大師與避險基金皆有出版書籍或公開的資料與論文可以參考，投資人可透過眾多管道汲取這些寶貴的研究。\n\
    \n我剛開始投資時雖然接觸的是技術分析，但直到閱讀了葛拉漢與大衛·陶德（David L. Dodd）所撰寫的《證券分析》（Security Analysis）以及巴菲特的相關書籍，才開始真正將投資這件事系統化，懂得辨別好公司的特徵。《證券分析》中對於真正的價值投資哲學定義、如何評價值產與企業的價值、辨識股價的安全邊際、衡量風險與報酬之間的關係等重要觀念，都是我後續投資決策上依循的原則，影響相當深遠。\n\
    \n後來又讀了馬克·米奈爾維尼（Mark Minervini）的《超級績效》（Trade like a Stock Market Wizard）與威廉·歐尼爾（William\
    \ J. O'Neil）的《笑傲股市》（How to Make Money in Stocks），這兩本書著重於技術分析的探討，也讓我的操作方式開始將基本面向結合技術分析，藉以判斷成長股的股價發展趨勢。一家公司的股價上漲不僅有基本面的支撐，更重要的是市場上資金的流向，才是推升股價上漲的最大動能。如果只是一味地依賴估值指標，往往會陷入數字的盲點，錯失了更多獲利的機會。\n\
    \n最後，當投資人擁有知識與方法後，最重要的則是心法，也就是正確心態的培養。我們要謙虛地面對市場，將實際操作的成果轉化為經驗，持續反饋來增強自己的能力。\n\
    \n想要培養投資上的正確心態，我也相當推薦幾本書籍可以參考。第一本是麥可·莫布新（Michael J. Mauboussin）撰寫的《魔球投資學》（More\
    \ than You Know），作者把股市視為一個複雜的適應系統，想在市場中生存，就得以跨學科的視角來看投資，學習簡化複雜的問題，以冷靜的態度接受我們不能預測的事，並勇敢預測我們能預測的事。\n\
    \n其次是美國經濟學家、二〇一七年諾貝爾經濟學獎得主理查·塞勒（Richard H. Thaler）的《不當行為》（Misbehavior）與羅伯特·席勒（Robert\
    \ James Shiller）的《非理性繁榮》（Irrational Exuberance），這兩本都是行爲經濟學必讀的經典書籍，作者從經濟理論的角度切入，並加入對人類行爲的研究，藉由了解群衆互動所產生的影響來強化理論如何轉化為現實，驅動市場的變化，找到可辨識的循環週期。\n\
    \n不僅是經濟學、心理學書籍，還可以閱讀商業傳記、科技趨勢等不同類型的書籍。透過大量的閱讀，將每個階段接收的知識融會貫通，找到最適合自己的進出場策略，持續穩定地在市場中獲利。\n\
    \n#### 建構自己的投資策略\n\n很多人都希望建構一個投資模型來進行每一筆交易決策，但是要建構自己的投資策略，必須從多方面來進行評估，就好像設定一個程式，在程式中加入諸多參數，摒除外部干擾來確實執行指令。\n\
    \n所以，你的投資模型應帶入的參數包括資金規模、風險承受度、交易風格等，唯有找出適合的投資流程與目標，才有辦法規畫達成的方法，並從每一次的決策中得到反饋與修正。\n\
    \n一般投資人的投資決策也不是靠隨機猜測來擬定的，而是藉由經驗找到支持股價上漲的相關因素，買入符合條件的股票。在建構出初步的投資模型後，要知道一個完美的投資模型並不會保證每一筆都會賺錢，而是在大量交易筆數之下獲得一個穩定的獲利結果。而要有這樣的獲利，必須考慮下列幾個因素：\n\
    \n##### 一、本金\n\n你有多少本金可以投資？這筆資金是閒錢嗎？是否會有任何狀況導致這筆資金需要提領出來？如果這筆資金對你的生活會造成重大影響，建議還是不要把錢投入股市，因為股市的漲跌是隨機波動的，一旦市場開始下跌，你的資產也會貶值。\n\
    \n本金的規模也是相當重要的問題。資產少的投資人跟著大戶進出市場卻總是賺不到錢，原因在於大資金與小資金的操作方式其實完全不同。如果是資金規模大的投資人，在操作上會更著重於穩健增長，資金進出市場的頻率也會更低，避免對價格波動造成過大的影響，試想如果你是巴菲特，著重的當然是現金流的收益更勝於短期的資本利得吧。而資金規模小的投資人，雖然缺點是對價格的影響力微乎其微，跟著大戶投資時，如果沒有考慮時間成本，在價格上漲之前眼巴巴等股價上漲，資金的運用反而相當沒效率；反過來思考，小資金的優點是更適合靈活的操作方式，例如更短期的波段投資，或是操作市值比較小的股票也不用擔心流動性的問題，讓本金可以發揮更大的價值。\n\
    \n##### 二、報酬\n\n你希望在多長時間內創造多少報酬？根據設定的目標來反推年化報酬率，是幫助你擬定策略的最好方式。\n\n舉例來說，許多人最常採用「七二法則」，也是將七十二除以投資報酬率，計算出让資產翻倍需要多少年的時間。假設報酬率為一〇%，七十二除以十得到七、二，表示資產翻倍需要七、二年的時間。又或是規畫未來退休之後每年可以領取的現金流，許多人會用「四%法則」來計算，也就是考慮到退休後每年所需的生活支出，將一年的花費除以四%來計算需要的資產規模，如果預計退休後年需花費一百萬元，則退休金就應該高於兩千五百萬元（1,000,000\
    \ ÷ 4% = 25,000,000）。\n\n最後還有一種專職交易者，追求的是絕對報酬，而不只是超越大盤的相對報酬，他們必須花費更多時間與精力在投資上，才能創造出更優異的績效以符合所付出的總成本。\n\
    \n##### 三、風險\n\n唯有了解自己的個性，才能知道對投資的風險承受度有多高，思考每一筆可虧損的金額是多少，然後決定資金配置狀況。\n\n市場上對於風險的定義有很多，但我認為價值投資大師霍華·馬克思（Howard\
    \ Marks）提出的定義最貼切：「真正的風險是本金蒙受損失的風險。而投資人的工作就是為了獲利而聰明地承擔風險。」\n\n由於風險無法完全消除，但可以先對風險做足準備，像是找到負相關性的資產、將資金分散投資，或設定停損點來控制損失，降低面對危機發生時的威脅與打擊。當我們瞭了解風險，就愈能掌握自己的投資組合。我總是在電腦旁貼著一句話：「低買高賣，大賺小賠。」提醒自己不要讓情緒因子擾亂投資決策，因為「風險極小化，獲利極大化」永遠是投資市場中的常勝法則。\n\
    \n##### 四、風險報酬比\n\n「風險報酬比」是在擬定投資策略中相當重要的關鍵因素。許多投資人願意接受小額的獲利，卻不願接受小額的虧損，讓虧損部位持續擴大，造成難以挽救的結果。想要獲得超額報酬，不能只看眼前的獲利而忽略了風險。因此，我們必須根據自己對投資標的研究，評估未來潛在上漲與可能下跌的幅度，思考現在是否位於合理的投資價格。\n\
    \n巴菲特曾說：「不要指望股票賣出好價格，而是只要買進價格合理，即使賣出價格普通也能為你帶來好績效。」以價值投資理論來看，估算出一家公司的內在價值，在價格低於價值時買進公司的股票，留下足夠的安全邊際，就是在限制投資人的風險，並盡可能放大期望獲得的報酬值。\n\
    \n而在技術分析的領域，風險控管是絕對不能忽視的部分。第四部曾討論過股價型態的支撐與壓力位置，這些可代表一家公司股價的關鍵點位，判斷股價的趨勢是否得以延續或顯示即將反轉的訊號。一旦股價朝著非預期的方向前進，就必須及時停損，等待更好的進場機會。\n\
    \n我在規畫資金配置時，通常是將資金進行較平均的分配，部位的規模以每筆資金的最大虧損不超過總資金的二至五%來設定，嚴設停損機制，讓獲利持續奔跑，我認為這才是累積資產的最好方式。\n\
    \n#### 假設與推論\n\n在決定是否要投資一家公司之前，投資前必須先進行完整的調查，了解該公司的經營狀況、獲利表現以及管理階層等是否良好。\n\n投資人可以不斷提出問題，靠自己對公司的認知來回答，就會發現過程中搜尋資料的精準度也會大幅提升。舉例來說，一家具有轉機題材、營運狀況逐漸改善、轉虧為盈的公司可能就會衍生出下列的問題：\n\
    \n- 問：為什麼上一季發生虧損？\n  - 答：產品銷量未達預期。\n- 問：為什麼產品銷量未達預期？\n  - 答：因為不受消費者青睞。\n- 問：為什麼不受消費者青睞？\n\
    \  - 答：因為公司沒有做足充分的市場調查、產品設計不符合消費者需求、行銷方式錯誤。\n- 問：那要怎麼解決？\n  - 答：端視公司目前提出的調整方案為何。\n\
    - 問：這種現象是一時的還是永久的？\n  - 答：要判斷公司股價是否被低估，未來是否有可能重新振作。\n\n回答完這些問題後，對公司未來的展望也會有清楚的藍圖，自然能進行合理的估值與設定買進的價格區間。\n\
    \n#### 檢討與反饋\n\n每一次的投資決策都是彼此獨立的，單筆投資的正確或錯誤都有原因，想要更精進自己的投資能力，最好的方式就是為每一筆投資決策製作紀錄，對自己的投資負責。\n\
    \n投資決策的重要性往往被投資人忽略，認為只要有券商提供的對帳單、關注帳面上的損益就是在做投資了，但製作交易紀錄才是提升投資績效的關鍵。投資人應記錄下每一筆投資進出場的原因，計算交易的勝率、獲利的總金額，在後續的檢討中釐清盲點，不要犯下重複的錯誤。最重要的是，交易紀錄可以讓我們複製成功模式，千萬不要相信自己的記憶，而要靠交易紀錄幫我們養成執行紀律的習慣。\n\
    \n#### 紀律執行策略\n\n投資最難的部分不是判斷出最好的投資策略，而是維持長期的觀點，在市場的高峰或低谷都堅守原則。在建構了自己專屬的投資模型後，影響我們是否可持續獲利的最大因素，不是已經擁有了最完美的投資方式，而是擁有正確的投資心態。\n\
    \n價值投資人葛林布雷說：「一個方法之所以有用，是因為它不是一直有用，甚至經常没用。堅持到底地使用這套方法，市場終究有一天會站到你這邊！」很多時候，其實我們已經有了好的方法，但方法總有失靈的時候，這時如果無法保持耐心，轉而投向自己不熟悉的領域，最後就會把獲利又吐了回去。\n\
    \n在投資的過程中也是，如果你是一位短線交易者，有時會發現自己獲利了結的股票又上漲了一倍，這時並不需要覺得後悔，因為你原本設定在行情的發展中進行一段特定區間的操作，目標是否確實達成才是關鍵的。如果你是一位長線投資人，也有可能短期賺取到不錯的報酬時，因為預期未來會有更高的獲利空間，最後卻損失了原本曾經擁有的帳上獲利。每一筆投資不一定都會帶來預期的結果，但投資人仍必須堅守原則，有紀律地進出市場。\n\
    \n本章主要討論的主題，是一個專業投資人養成的必經過程。其實最重要的是認識自己，透過認清自己在市場中的位置，清楚掌握自身的優勢，定期檢視投資流程，記下每筆投資決策的動機與結果，並思考什麼樣的投資策略可以發揮優勢。除此之外，投資人必須願意接受失敗，因為這是發現錯誤與防止重蹈覆轍的最佳方式，也唯有面對不完善的自己，才會發現持續進步的空間，獲得滿意的投資報酬，並持續存活在市場中。\n\
    \n### 第21章\n### 建立正確投資心態，克服心理偏誤\n\n在投資這條路上，決定投資成敗的關鍵就是心態。近幾年來，由於行為經濟學的興起，挑戰傳統經濟學理論中關於「人都是理性」的假設，讓我們知道人的決策不是只關於訴訟理性，而與情緒因素相輔相成。\n\
    \n投資市場也是經濟學的延伸，股市會上漲或下跌，由市場裡所有投資人的行為所決定，在我們做這些決策時，往往會受到心理偏誤影響而無法保持理性。誠實面對這些問題，了解人性的慾望、貪婪和恐懼如何影響我們的心理，幫助我們做出更好的投資決策。所以，在前一章中一直強調要有紀律地進出市場，將自己的投資流程標準化，幫助我們在擬定投資決策時對抗人性本身的心理偏誤。以下是一般投資人面對投資行為時容易產生的心理偏誤，讀者不妨自我檢視。\n"
  mdcn: "\n# 圖 46 各種類型投資人的股債配置比例\n\n![](img/59586a9aa5c5e7f9004ef373947a8ffe_287_0.png)\n\
    \n一、保守型投資人：股票二〇%，債券八〇%。保守型投資人通常將投資組合中很大一部分的占比配置在債券資產上，以保護本金，獲取穩定的現金流為目標。\n\n二、穩健型投資人：股票五〇%，債券五〇%。由於穩健型投資人希望資產能夠穩定增長，因而願意承擔適度的風險，以保護通貨膨脹帶來的影響，他們會以尋找優質且能支付股息的證券資產為主要目標。\n\
    \n三、積極型投資人：股票八〇%，債券二〇%。積極型投資人允許資產價值有劇烈的波動，他們以資產能快速增值為目標，挑選具有爆發性成長潛力的股票，藉此獲取比市場平均價更高的超額報酬。\n\
    \n由於本書以主動選股為主，接下來就以積極型投資人為例（即希望長期以高效率的方式獲取報酬、累積資產，更快達到財務目標），結合前面介紹過的內容，建構一個積極成長的投資組合。\n\
    \n# 圖 47 積極型投資人的股債配置比例\n\n![](img/59586a9aa5c5e7f9004ef373947a8ffe_288_0.png)\n\
    \n## 股債配置\n\n如前面所述，積極型投資人的股票配置占八〇%，債券占二〇%，因此在這八〇%的比例中，建議大盤ETF至少配置四〇%以上，而剩餘四〇%可依投資人對市況的研究、產業的觀察與個股的\
    \ analisis，配置在看好的標的上（參圖47）。\n\n至於我自己則以主動選股為主，投資組合中有四〇%為大盤ETF，包括「SPDR標準普五百指數ETF」（美股代號SPY）與「Invesco那斯達克一百指數ETF」（美股代號QQQ），另外四〇%則配置在趨勢產業的ETF、穩健成長股、房地產類（REITs）與高速成長股。\n\
    \n# 圖 48 財女 Jenny 的投資組合\n\n![](img/59586a9aa5c5e7f9004ef373947a8ffe_289_0.png)\n\
    \n趨勢產業ETF包括當前高速發展中的金融科技、電子商務與電動車概念，在美股中有相當多標的可選擇，而穩健成長股則以公司營運穩定、財務體質良好的股息成長股或\
    \ 200 為主，最後再搭配股價波動大的高速成長股或技術型態面有突破的公司，作為短期收益來源。\n\n我的目標是打造一個長期正向循環的投資組合（參圖 48）。\n\
    \n在這個組合中，我將具有現金流入槓桿的資產再投資，並將短期操作的獲利再投入到這些穩健增長的標的上，讓資產可以更快速累積。累積資產的方式有以下兩種，讀者可參考並進行操作：\n\
    \n- 一、定期定額：即固定將收入的一定比例，以定期定額的方式投入到市場，進行股價配置，追求長期穩健的增長。根據過去歷史的紀錄，自一九二六年来，股票八○%加債券二○%的積極型投資組合每年可創造九·四%的平均報酬率，優於保守型和穩健型的投資組合，原因就在於政府政策與持續的生產力創新，推升資產價格上升，股市持續走高，長期的表現優於債市。這也是為什麼現今的投資人一定要投資的理由，因為長期投資能讓我們在上市公司賺取的利潤中分一杯羹。\n\
    \n- 二、正向投資組合循環：除了定期定額，還可以將固定收益證券、有支付股息的標的再進行投資，包括股息成長股與REITs，使用券商提供的股息再投資計畫（Dividend\
    \ Reinvestment Program, DRIP），將配發的股息自動再買入公司的股票。目前有許多美股券商提供了股息再投資計畫是不收手續費，更可以節省成本，長時間累積複利效果。除此之外，成長股的波段操作在獲利了結後也要再投入到市場中，讓這些獲利帶來更高的價值。我通常會把短期的獲利分為兩部分，其中一部分等待其他好機會便積極出手，另一部分則投入到大盤指數，為這些資金尋求長期的坡道，持續地滾雪球，讓雪球愈滾愈大。\n\
    \n> 如同巴菲特所說：「人生就像滾雪球，你只要找到溼的雪和很長的坡道，雪球就會愈滾愈大。」人生的每一件事都是經驗的累積，而投資也是經驗的累積，幫助我們在過程中愈來愈順，愈快達到自己想要的目標。\n\
    \n# 第六部\n\n## 用正確心態讓投資長長久久\n\n重視風險，避免重大的錯誤，比承受風險、賺取誘人報酬更重要。\n\n每位投資人在市場上都有可能犯錯而造成投資虧損，但犯錯並不可怕，在可接受的損失之下，重要的是能否在每一次的錯誤中及時發現、檢討、反饋與修正，因為市場永遠會給我們重新振作的機會。\n\
    \n![](img/59586a9aa5c5e7f9004ef373947a8ffe_292_0.png)\n\n### 第20章\n### 專屬自己的投資哲學，成為紀律投資者\n\
    \n進入投資市場超過十五年，一路的心得讓我深刻體悟到價值投資大師查理·蒙格（Charlie Munger）的一句話：「如果知道我會死在那裡，那我將永遠不去那個地方。」重視風險，避免重大的錯誤，比承受風險、賺取誘人報酬更重要，因為最毒的毒藥往往包在最絢爛的糖衣之下，等到發現時為時已晚。\n\
    \n每位投資人在市場上都有可能犯錯而造成投資虧損，包括我自己，但犯錯並不可怕，在可接受的損失之下，重要的是能否在每一次的錯誤中及時發現、檢討、反饋與修正，因為市場永遠會給我們重新振作的機會。\n\
    \n#### 化理解爲個人獨特的投資邏輯\n\n投資最怕人云亦云，投資人最容易犯的錯誤，就是在大盤熱絡、市場一片看好的情況下，對於沒有研究過的公司，只是看到股價上漲就衝進市場追價，結果剛好接在最高點，損失慘重。而有經驗的投資人處在市場中，也不免被市場氛圍所影響，違反原先設定的投資原則，買入被高估的股票。\n\
    \n巴菲特曾說過：「想要達到穩健的投資，必須仰賴知識的累積與理性的選擇。」知識是你對於自己投資的公司蒐集了多少資訊，對這些資訊進行整理、分析與邏輯推導，列出所有可能的情境與結果，把這個過程轉化為腦中的智慧，並藉由實際操作來得到經驗與成果。理性則是避免從眾心理，培養獨立思考的能力。在面對投資事件時，投資人應該擁有一個健康的心態，設定合理的目標，不隨群眾起舞，也不一窩蜂地追逐熱門標的。當結果不如預期，應該願意坦誠接受失敗，反思問題的核心來進行修正，持續地精進對危機的應對方式與對市場的理解。\n\
    \n建立一套完整的投資邏輯，可以藉由下列四個面向來思考：\n\n- 一、理解經濟運行的規律：目前處在景氣循環與信用週期的哪個位置。\n- 二、理解資本市場的運行：市場的規則與其他參與者的行為呈現出什麼樣的氛圍。\n\
    - 三、理解這個行業或公司：產業趨勢是否正在成長，以及公司基本面是否穩健。\n- 四、理解自己：我適合什麼樣的方法做研究和投資。\n\n藉由回答上面四個問題來建構自己的知識與理性，思考對投資真正重要的因素，整合出一套投資邏輯與操作系統，保持耐心與堅守原則，不要為股票付出過高的價格，但當價格跌到合理價位時要毫不猶豫地買進。雖然投資人無法預測市場的變化，卻可以先做好萬全準備，等待機會降臨。\n\
    \n不過，我認為最重要的其實是最後一個問題，也就是投資人到底夠不夠了解自己能成為哪一種投資人、採用什麼樣的策略。一個人的投資方式反映了他的生活態度，如果用了不適合的方法，便沒辦法有紀律地執行決策，更不要說靠這個方法在市場上長期獲利。在還不了解企业自己之前，最好的方式就是學習前人的智慧，從模仿開始。\n\
    \n#### 最好的學習從模仿開始\n\n成為一位紀律的投資者需要時間與經驗的累積，最好的學習都是從模仿開始，不管是投資新手或在股海打滾已久的老手，勇於摸索新事物、持續培養閱讀的習慣、積極蒐集資訊，並將資訊篩選與整理成知識，再串聯成智慧，就變成邏輯推理的最佳工具，幫助你更理性地做出投資決策。\n\
    \n在這個階段，最好的模仿對象就是成功投資者，願意提供他們寶貴的市場經驗，幫助你更快進入狀況，找到最適合自己的投資方法，並選出最合適的投資標的。投資美股可以學習的對象很多，美國許多投資大師與避險基金皆有出版書籍或公開的資料與論文可以參考，投資人可透過眾多管道汲取這些寶貴的研究。\n\
    \n我剛開始投資時雖然接觸的是技術分析，但直到閱讀了葛拉漢與大衛·陶德（David L. Dodd）所撰寫的《證券分析》（Security Analysis）以及巴菲特的相關書籍，才開始真正將投資這件事系統化，懂得辨別好公司的特徵。《證券分析》中對於真正的價值投資哲學定義、如何評價值產與企業的價值、辨識股價的安全邊際、衡量風險與報酬之間的關係等重要觀念，都是我後續投資決策上依循的原則，影響相當深遠。\n\
    \n後來又讀了馬克·米奈爾維尼（Mark Minervini）的《超級績效》（Trade like a Stock Market Wizard）與威廉·歐尼爾（William\
    \ J. O'Neil）的《笑傲股市》（How to Make Money in Stocks），這兩本書著重於技術分析的探討，也讓我的操作方式開始將基本面向結合技術分析，藉以判斷成長股的股價發展趨勢。一家公司的股價上漲不僅有基本面的支撐，更重要的是市場上資金的流向，才是推升股價上漲的最大動能。如果只是一味地依賴估值指標，往往會陷入數字的盲點，錯失了更多獲利的機會。\n\
    \n最後，當投資人擁有知識與方法後，最重要的則是心法，也就是正確心態的培養。我們要謙虛地面對市場，將實際操作的成果轉化為經驗，持續反饋來增強自己的能力。\n\
    \n想要培養投資上的正確心態，我也相當推薦幾本書籍可以參考。第一本是麥可·莫布新（Michael J. Mauboussin）撰寫的《魔球投資學》（More\
    \ than You Know），作者把股市視為一個複雜的適應系統，想在市場中生存，就得以跨學科的視角來看投資，學習簡化複雜的問題，以冷靜的態度接受我們不能預測的事，並勇敢預測我們能預測的事。\n\
    \n其次是美國經濟學家、二〇一七年諾貝爾經濟學獎得主理查·塞勒（Richard H. Thaler）的《不當行為》（Misbehavior）與羅伯特·席勒（Robert\
    \ James Shiller）的《非理性繁榮》（Irrational Exuberance），這兩本都是行爲經濟學必讀的經典書籍，作者從經濟理論的角度切入，並加入對人類行爲的研究，藉由了解群衆互動所產生的影響來強化理論如何轉化為現實，驅動市場的變化，找到可辨識的循環週期。\n\
    \n不僅是經濟學、心理學書籍，還可以閱讀商業傳記、科技趨勢等不同類型的書籍。透過大量的閱讀，將每個階段接收的知識融會貫通，找到最適合自己的進出場策略，持續穩定地在市場中獲利。\n\
    \n#### 建構自己的投資策略\n\n很多人都希望建構一個投資模型來進行每一筆交易決策，但是要建構自己的投資策略，必須從多方面來進行評估，就好像設定一個程式，在程式中加入諸多參數，摒除外部干擾來確實執行指令。\n\
    \n所以，你的投資模型應帶入的參數包括資金規模、風險承受度、交易風格等，唯有找出適合的投資流程與目標，才有辦法規畫達成的方法，並從每一次的決策中得到反饋與修正。\n\
    \n一般投資人的投資決策也不是靠隨機猜測來擬定的，而是藉由經驗找到支持股價上漲的相關因素，買入符合條件的股票。在建構出初步的投資模型後，要知道一個完美的投資模型並不會保證每一筆都會賺錢，而是在大量交易筆數之下獲得一個穩定的獲利結果。而要有這樣的獲利，必須考慮下列幾個因素：\n\
    \n##### 一、本金\n\n你有多少本金可以投資？這筆資金是閒錢嗎？是否會有任何狀況導致這筆資金需要提領出來？如果這筆資金對你的生活會造成重大影響，建議還是不要把錢投入股市，因為股市的漲跌是隨機波動的，一旦市場開始下跌，你的資產也會貶值。\n\
    \n本金的規模也是相當重要的問題。資產少的投資人跟著大戶進出市場卻總是賺不到錢，原因在於大資金與小資金的操作方式其實完全不同。如果是資金規模大的投資人，在操作上會更著重於穩健增長，資金進出市場的頻率也會更低，避免對價格波動造成過大的影響，試想如果你是巴菲特，著重的當然是現金流的收益更勝於短期的資本利得吧。而資金規模小的投資人，雖然缺點是對價格的影響力微乎其微，跟著大戶投資時，如果沒有考慮時間成本，在價格上漲之前眼巴巴等股價上漲，資金的運用反而相當沒效率；反過來思考，小資金的優點是更適合靈活的操作方式，例如更短期的波段投資，或是操作市值比較小的股票也不用擔心流動性的問題，讓本金可以發揮更大的價值。\n\
    \n##### 二、報酬\n\n你希望在多長時間內創造多少報酬？根據設定的目標來反推年化報酬率，是幫助你擬定策略的最好方式。\n\n舉例來說，許多人最常採用「七二法則」，也是將七十二除以投資報酬率，計算出让資產翻倍需要多少年的時間。假設報酬率為一〇%，七十二除以十得到七、二，表示資產翻倍需要七、二年的時間。又或是規畫未來退休之後每年可以領取的現金流，許多人會用「四%法則」來計算，也就是考慮到退休後每年所需的生活支出，將一年的花費除以四%來計算需要的資產規模，如果預計退休後年需花費一百萬元，則退休金就應該高於兩千五百萬元（1,000,000\
    \ ÷ 4% = 25,000,000）。\n\n最後還有一種專職交易者，追求的是絕對報酬，而不只是超越大盤的相對報酬，他們必須花費更多時間與精力在投資上，才能創造出更優異的績效以符合所付出的總成本。\n\
    \n##### 三、風險\n\n唯有了解自己的個性，才能知道對投資的風險承受度有多高，思考每一筆可虧損的金額是多少，然後決定資金配置狀況。\n\n市場上對於風險的定義有很多，但我認為價值投資大師霍華·馬克思（Howard\
    \ Marks）提出的定義最貼切：「真正的風險是本金蒙受損失的風險。而投資人的工作就是為了獲利而聰明地承擔風險。」\n\n由於風險無法完全消除，但可以先對風險做足準備，像是找到負相關性的資產、將資金分散投資，或設定停損點來控制損失，降低面對危機發生時的威脅與打擊。當我們瞭了解風險，就愈能掌握自己的投資組合。我總是在電腦旁貼著一句話：「低買高賣，大賺小賠。」提醒自己不要讓情緒因子擾亂投資決策，因為「風險極小化，獲利極大化」永遠是投資市場中的常勝法則。\n\
    \n##### 四、風險報酬比\n\n「風險報酬比」是在擬定投資策略中相當重要的關鍵因素。許多投資人願意接受小額的獲利，卻不願接受小額的虧損，讓虧損部位持續擴大，造成難以挽救的結果。想要獲得超額報酬，不能只看眼前的獲利而忽略了風險。因此，我們必須根據自己對投資標的研究，評估未來潛在上漲與可能下跌的幅度，思考現在是否位於合理的投資價格。\n\
    \n巴菲特曾說：「不要指望股票賣出好價格，而是只要買進價格合理，即使賣出價格普通也能為你帶來好績效。」以價值投資理論來看，估算出一家公司的內在價值，在價格低於價值時買進公司的股票，留下足夠的安全邊際，就是在限制投資人的風險，並盡可能放大期望獲得的報酬值。\n\
    \n而在技術分析的領域，風險控管是絕對不能忽視的部分。第四部曾討論過股價型態的支撐與壓力位置，這些可代表一家公司股價的關鍵點位，判斷股價的趨勢是否得以延續或顯示即將反轉的訊號。一旦股價朝著非預期的方向前進，就必須及時停損，等待更好的進場機會。\n\
    \n我在規畫資金配置時，通常是將資金進行較平均的分配，部位的規模以每筆資金的最大虧損不超過總資金的二至五%來設定，嚴設停損機制，讓獲利持續奔跑，我認為這才是累積資產的最好方式。\n\
    \n#### 假設與推論\n\n在決定是否要投資一家公司之前，投資前必須先進行完整的調查，了解該公司的經營狀況、獲利表現以及管理階層等是否良好。\n\n投資人可以不斷提出問題，靠自己對公司的認知來回答，就會發現過程中搜尋資料的精準度也會大幅提升。舉例來說，一家具有轉機題材、營運狀況逐漸改善、轉虧為盈的公司可能就會衍生出下列的問題：\n\
    \n- 問：為什麼上一季發生虧損？\n  - 答：產品銷量未達預期。\n- 問：為什麼產品銷量未達預期？\n  - 答：因為不受消費者青睞。\n- 問：為什麼不受消費者青睞？\n\
    \  - 答：因為公司沒有做足充分的市場調查、產品設計不符合消費者需求、行銷方式錯誤。\n- 問：那要怎麼解決？\n  - 答：端視公司目前提出的調整方案為何。\n\
    - 問：這種現象是一時的還是永久的？\n  - 答：要判斷公司股價是否被低估，未來是否有可能重新振作。\n\n回答完這些問題後，對公司未來的展望也會有清楚的藍圖，自然能進行合理的估值與設定買進的價格區間。\n\
    \n#### 檢討與反饋\n\n每一次的投資決策都是彼此獨立的，單筆投資的正確或錯誤都有原因，想要更精進自己的投資能力，最好的方式就是為每一筆投資決策製作紀錄，對自己的投資負責。\n\
    \n投資決策的重要性往往被投資人忽略，認為只要有券商提供的對帳單、關注帳面上的損益就是在做投資了，但製作交易紀錄才是提升投資績效的關鍵。投資人應記錄下每一筆投資進出場的原因，計算交易的勝率、獲利的總金額，在後續的檢討中釐清盲點，不要犯下重複的錯誤。最重要的是，交易紀錄可以讓我們複製成功模式，千萬不要相信自己的記憶，而要靠交易紀錄幫我們養成執行紀律的習慣。\n\
    \n#### 紀律執行策略\n\n投資最難的部分不是判斷出最好的投資策略，而是維持長期的觀點，在市場的高峰或低谷都堅守原則。在建構了自己專屬的投資模型後，影響我們是否可持續獲利的最大因素，不是已經擁有了最完美的投資方式，而是擁有正確的投資心態。\n\
    \n價值投資人葛林布雷說：「一個方法之所以有用，是因為它不是一直有用，甚至經常没用。堅持到底地使用這套方法，市場終究有一天會站到你這邊！」很多時候，其實我們已經有了好的方法，但方法總有失靈的時候，這時如果無法保持耐心，轉而投向自己不熟悉的領域，最後就會把獲利又吐了回去。\n\
    \n在投資的過程中也是，如果你是一位短線交易者，有時會發現自己獲利了結的股票又上漲了一倍，這時並不需要覺得後悔，因為你原本設定在行情的發展中進行一段特定區間的操作，目標是否確實達成才是關鍵的。如果你是一位長線投資人，也有可能短期賺取到不錯的報酬時，因為預期未來會有更高的獲利空間，最後卻損失了原本曾經擁有的帳上獲利。每一筆投資不一定都會帶來預期的結果，但投資人仍必須堅守原則，有紀律地進出市場。\n\
    \n本章主要討論的主題，是一個專業投資人養成的必經過程。其實最重要的是認識自己，透過認清自己在市場中的位置，清楚掌握自身的優勢，定期檢視投資流程，記下每筆投資決策的動機與結果，並思考什麼樣的投資策略可以發揮優勢。除此之外，投資人必須願意接受失敗，因為這是發現錯誤與防止重蹈覆轍的最佳方式，也唯有面對不完善的自己，才會發現持續進步的空間，獲得滿意的投資報酬，並持續存活在市場中。\n\
    \n### 第21章\n### 建立正確投資心態，克服心理偏誤\n\n在投資這條路上，決定投資成敗的關鍵就是心態。近幾年來，由於行為經濟學的興起，挑戰傳統經濟學理論中關於「人都是理性」的假設，讓我們知道人的決策不是只關於訴訟理性，而與情緒因素相輔相成。\n\
    \n投資市場也是經濟學的延伸，股市會上漲或下跌，由市場裡所有投資人的行為所決定，在我們做這些決策時，往往會受到心理偏誤影響而無法保持理性。誠實面對這些問題，了解人性的慾望、貪婪和恐懼如何影響我們的心理，幫助我們做出更好的投資決策。所以，在前一章中一直強調要有紀律地進出市場，將自己的投資流程標準化，幫助我們在擬定投資決策時對抗人性本身的心理偏誤。以下是一般投資人面對投資行為時容易產生的心理偏誤，讀者不妨自我檢視。\n"
