    以上幾種股價型態的分析是觀察股價趨勢的有效方法，幫助投資人在關注基本面之  餘多一個判讀指標，更準確地掌握進場時機。


    # 創造股價突破的催化劑


    好的投資機會難求，不是隨時都有，投資人只能做好準備，耐心等待機會來臨時馬上把握住。所以，平時投資人花最多時間的地方應該是在研究企業價值、產業趨勢與風險管控，從企業的商業模式、財務報表及經濟趨勢等進行分析。找到好公司後，接著就是等待預設的價格訊號發生，下決策的時間其實最短。


    從前面的討論中可以了解到，在行情即將展開前，從股價型態通常可以觀察到蛛絲馬跡，接下來要說明是什麼原因造成價格型態突破，使價格的上漲或下跌得以持續下去，發展成明顯趨勢。


    在美股這個高效率的市場中，催化劑是驅動行情的關鍵因子、創造股價突破的訊號。所以投資人單看技術分析時會覺得毫無頭緒，但若加上催化劑這個因數，一切其實都符合邏輯。'
  - '[PAGE 226]


    # 營收報告超過預期


    美股中最常見的催化劑，就是營收報告超過市場預期，跌破分析師的眼鏡。在每一季的營收公布日，股價都會有相當大的波動，有時甚至直接跳空上漲百分之二十至三十以上。除了上一季的財報表現優異之外，投資人還需關注管理層在財報會議上給出的營收預期，因為公司內部一定是最了解狀況的人，只要給出的營收預期樂觀、上調原本的數字，對於股價也會有很大的激勵作用。


    # 更換管理階層


    許多公司的股價萎靡不振，是因為公司的管理出了問題。原本的經理人沒辦法領導公司成長，導致營運衰退，於是市場看壞而拋售持股。這時若公司宣布更換管理階層或傳出有主動型投資人介入，對於公司的股價具有激勵作用。然而股價反彈是否能維持下去、扭轉原本的股價劣勢，還得看新管理階層提出的營運規畫，投資人必須持續追蹤。


    # 重大併購事項


    當公司有重大的併購案發生時，對於公司股價通常具有巨大的影響，但究竟會上漲'
  - '[PAGE 227]


    或下跌，還要看併購案的內容對雙方是否有利、能否產生綜效來決定。如果兩家公司都是上市公司，那麼市場就會評估併購方的出價是否合理或買貴，或者被併購一方吃虧了，據此做出反應。


    # 整合業務，清算資產


    想要提高公司的營運效率、激勵股價上漲，整合不賺錢的業務與清算多餘的資產是相當有用的方式。與其讓資源閒置，不如將它們處理掉，還能獲得一筆額外收入，而市場通常會因此給予正面回應。不過，這個方式帶給公司的效益通常很短，股價上漲的持續性還是得回歸到公司本質是否真的改善才行。


    在催化劑發生時，都會造成公司股價的劇烈反應，股價跳空上漲或下跌，通常也能確立股價型態突破。股價跳空後大都會有一段整理期，在這個時候就要思考催化劑是否具有延續性，如果能在未來逐步發酵，為公司帶來更多效益，也會帶動股價的成長。倘若答案是肯定的，也等於是投資人進場布局的好時機。'
  - '[PAGE 228]


    # ## 第 14 章


    # 與股票斷捨離


    金融交易心理輔導師馬克·道格拉斯（Mark Douglas）在他的著作《紀律的交易者》（The Disciplined Trader）中提到：「在交易市場中，不要成為一個被動的輪家，而是要掌握大局，採取主動。」「對於已經開始下跌的股票，從技術型態就可以觀察到線索，股價呈現弱勢型態，而這通常已事先反應出基本面的問題。俗語說：「買在預期，賣在實現。」「有許多你不知道的訊息正在傳遞與發酵，等到整個市場都知道的時候，已經是最後一拍，而你最好不要當最後一個傻瓜。


    在股價已經朝著對你不利的方向前進時，果斷地減手中持股，降低風險絕對是正確的選擇。降低虧損是讓資產穩健增長的唯一方式，如同巴菲特說的，投資的第一條準則是「不要賠錢」，第二條準則是「永遠不要忘記第一條」。'
  - '[PAGE 229]


    # 停損是為了降低風險


    什麼是停損？就是賣出手中虧錢的股票，把現金留在手上，尋找下一個獲利機會。為什麼需要停損呢？其實和投資時會設定出場條件是一樣的。每位投資人在擬定投資決策時設定出場點的條件都不同，如果是看中一家公司的長期價值成長而持有的股票，當公司基本面發生改變、已經不符合當初買進的理由時，當然就該毅然賣出。


    但更多時候公司的股價會下跌，是因為除了你知道的原因之外，還有更多你不知道的因素，在之後才會公諸於世（事實上，上漲的股票也是一樣）。一般投資人沒辦法預知突發狀況，但可以透過股價型態、觀察價格與成交量的變化來察覺異狀並預做準備，或是在事件發生時及時應對，做出最好的決策。


    這也是本書一直強調控制風險的目的，每一筆虧損到五〇%的投資，一開始都是從五%、一〇%開始累積的。參考表47，當你在虧損一〇%以內時停損，只需要賺十%便可以賺回本金。但當虧損擴大時，你需要花更大力氣賺回本金。等到虧損達五〇%，你必須找到一支能賺回一倍的標的才行，但又有多少檔股票可以馬上漲一倍呢？


    就算股價在停損之後又恢復到上漲的趨勢，只要把股票再買回來就好，損失的不過是五到一〇%。就把它當做付保險費吧，保險通常是最好不用用到，然而一旦發生重大'
  - '[PAGE 230]


