    ### 項目 7 營運結果與管理層說明 (Item 7 Management''s Discussion and Analysis of Financial
    Condition and Results of Operation)


    在這個部分，公司會針對近兩年的個別財務細項進行討論，包括營收與獲利成長（或衰退）的主要原因，以及管理層未來將推行的改善方案，以因應目前的狀況。好公司的管理層可以提供有效且合理的願景，讓投資人更了解公司未來的營運展望，並且透過觀察過去執行的結果，來評估公司是否可以達到設定的目標。


    投資人如果想要了解蘋果股價漲跌的原因，詳細閱讀「項目 7」會有相當大的幫助。例如二〇一九年报在此項目下一開始的「二〇一九會計年度亮點」中提到：「相較於二〇一八會計年度，二〇一九會計年度的總營收衰退二％或五十四億美元，主要是因為穿戴式裝置、家用配件與服務成長，抵銷了手機的負面影響。銷售數字下滑。」另外，強勢美元也為二○一九會計年度的營收帶來重大的不利影響。


    觀察年報中「依產品區分」的營收表現（參圖 13），iPhone 在二○一九年的營收占總營收的五五%，但其實大幅衰退了十四%，是拖累整體營收表現的關鍵。表現最好的穿戴式裝置、家用配件（包括
    AirPods、Apple TV、Apple Watch、Beats products、HomePod、iPod touch 等）則大幅成長了四一%，服務收入（包括數位內容商店與串流媒體服務、Apple
    Care 與授權收入）成長了十六%，雖然占總營收比例仍較低，由於成長率高，預期未來對公司的營收貢獻會有顯著效益。


    除了依產品種類區分的營業收入，蘋果公司也提供了「依市場區分」的營業收入（參圖 14），藉以理解公司產品與服務在每個地區（包括美洲、歐洲、大中華區、日本、亞太其他地區）的營收狀況。


