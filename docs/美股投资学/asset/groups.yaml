    # 第17章

    生活美股：住


    不用買房也有產，另類居住投資學


    不管是租房還是買房，或是維護住宅家實質所花費的成本，「住」是每個人的人生中最大筆消費，也是無法避免的消費支出。投資與「住」有關的概念股，不僅能讓我們賺進不錯的報酬，還能藉此補貼居住方面的消費支出。


    而在美股中，除了投資與住宅相關的零售類股，包括全球最大的家飾品與建材零售商，不動產證券化市場發展得相當完備，涵蓋各種產業，包括零售、住宅、辦公室，甚至在數位化時代必備的數據中心都有相關標的可投資，兼具成長與穩定收益的特性。


