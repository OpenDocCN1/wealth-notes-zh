    # 確認偏誤，欺騙你的往往是自己


    行為經濟學中有個理論叫做「稟賦效應」（endowment），由經濟學家塞勒提出，這個理論是指人們對自己持有的東西特別重視，覺得它格外有價值，並給予很高的評價。我們對於想要投資的股票，往往也有類似的情況。


    投資人在研究一家公司是否值得投資時，一定是認為該公司具有發展前景，先給了正面的主觀評價後才著手深入基本面。但如果開始研究後，卻只顧著尋找證明自己當初假設沒錯的證據，就好像開始和股票談戀愛一樣，這時只看得見優點，整個人陷入確認偏誤當中。等到真正買入之後才是惡夢的開始。忽視反面意見，對投資人來說相當危險。我們不該總是問自己「為什麼該買這家公司的股票」，而該問自己「為什麼不該買公司的股票」，如果真的想不到答案，這才表示你真的應該買它！


    另外，已經持有公司股票的投資人，也常受到確認偏誤的影響而蒙受損失。買入後只看公司好的一面，卻未持續追蹤公司變化。當警訊發生時未及時處理，說服自己困境終將過去，股價終會止跌回升，最後看著手上的淨值愈變愈少，因受不了而砍在低點。


    在持有股票的過程中，持續觀察市場與公司營運、依據新資訊來調整對公司的看法是相當重要的，例如這些新消息對公司的影響是輕微或嚴重、是短期或長期，或者是是否已經違反應初買進的條件。如果當初買入的理由已經不存在，果斷出場是最好的選擇。


    # 短視近利，最終蒙受損失


    有個成語叫「短視近利」，說的是人們只看重眼前好處而忽略長遠影響，因此總會做出後悔的決定。如果經營者是短視近利的人，對公司的未來絕對很危機，因為他會為了自身的利益聲望，把公司的資源配置在錯誤的位置，導致營運不善，股價應聲下跌。而投資人在進行投資決策時，也應該以長期的思維去思考公司的價值，如果只重眼前所見，除了做出錯誤判斷，也會因此蒙受損失。


    在韋斯利・格雷（Wesley R. Gray）和杜白・卡萊爾（Douglas E. Carnegie）合著的《計量價值的勝率》（Quantitative Value）就描寫了這樣的例子。二〇〇〇至二〇〇九年間，CGM聚集基金（GCM
    Fund）是美國表現最好的基金之一，每年為投資人創造了十八・二％的報酬率，比其他基金的平均報酬率高出三・四％。按理說，持有這支基金的投資人應該都獲利豐富才對，但實際上的平均報酬是負十一％。


    為什麼會這樣？就是因為投資人在市場上總是只看短期表現，卻沒有長期的思維，導致一有大幅波動就追高殺低，結果該賺到的獲利沒賺到，該離開的時候卻衝進市場。


    而我們在研判一家公司是否值得投資時，也應該用一個長期的思維來評估公司的發展。比爾・蓋茲（Bill Gates）曾說：「我們總是高估未來兩年會發生的改變，低估了未來十年將發生的改變。」套用在投資市場上，意思是我們總是高估現在在市場上熱門股未來的發展，卻忽略了指在默默耕耘、伺機轉型與調整體質後重新振作的冷門股。這些公司可能仍處於企業生命週期的初始期，或是在邁入穩定後尋找第二曲線，重新開創成長，由於兩個狀況都具有極高不確定性，使得股價當下受到壓抑，其實它們在未來有可能才是市場中的主角，等待時間證明自己的價值。


    # 損失規避，讓你愈虧愈多


    心理學中的「損失規避」（loss aversion），是指人們在面對同樣的獲利和損失時，比起獲利帶來的愉悅感，損失帶來的痛苦是前者的兩倍。在面對投資決策時也是如此，投資人通常手上的賺錢股票，只要稍微回檔就急著獲利了結，深怕晚一步就來不及賣，結果錯失了後面一大段的漲幅，但是當手上的股票虧損時，卻遲遲不願意認賠賣出，因為他們認為只要沒賣掉虧損部位，就不是真正的虧損，想要等股價反彈，卻只見帳上的損失金額愈來愈大。


    討厭損失，是所有市場投資人的共識，沒有人做投資是想虧錢的，但陷入損失厭惡的心理偏誤，卻常常讓人愈虧愈多。這是因為當投資人手上持股一直下跌時，多數人選擇去接下跌的飛刀，認為只要一直攤平成本、不賣出股票，一旦股價反彈就能很快獲利。不過，要知道在股價下跌的過程中，損失的不只是金錢而已，還有在股票被套牢時損耗的時間成本，如果這段時間出現了其他好的機會，手上卻沒有現金可以利用，一來一往的損失更大。要避免損失規避造成的傷害，還是得回歸到心態控制，做出違反人類本能的行動——停損。


    我經常提醒自己：做好停損，讓獲利持續奔跑。股價的上漲代表市場對公司有一致的共識，看好公司的未來前景，才會持續買入公司的股票。而股價下跌通常也事出有因，等到問題確定義發生時才停損，反而容易砍在最低點。


    # 過度樂觀，泡泡愈吹愈大


    在諾貝爾經濟學獎得主席勒的《非理性繁榮》一書中，提到市場泡沫是怎麼形成的，也就是當看到股市持續上漲、所有人都對未來感到樂觀時，就會吸引更多人加入市場來推升投機行情，最後又因為信心喪失而崩盤。


    我們要如何判斷現在的市場是否已進入泡沫階段？席勒提出了「週期調整本益比」（Cyclically Adjusted Price to Earnings Ratio,
    CAPE），這是利用過去十年的通貨膨脹調整與企業盈餘水準的關係，來反映股票市場目前的估值水準。


    知名避險基金公司「AQR 資本管理公司」（AQR Capital Management）在二〇一七年提出一篇論文，其以六十年的週期調整本益比平均值為標準，當低於此數值時買入股票，高於此數值時則減少股票部位，轉而增加現金部位。不過從一九〇〇到二〇一五年，使用這個策略的績效並沒有比「買入持有策略」（Buy
    and Hold）要好多少。


    根據歷史資料顯示，週期調整本益比自一九五〇年起便呈現上升趨勢，所以很多時間的股價看起來都是被高估的，導致使用這個策略的人大多數時間都過於保守，無法賺到應得的利潤。


    由上述看來，我們都太相信自己所知道的事，並認為這就是事情的全貌，但真相其實是「你所知道的事遠比你以為自己所知道的事還多得多」。過度樂觀與過度自信，會造成未來有錯誤預期與不切實際的目標，最後承擔過高的風險而不自知。


    要知道，市場具有多樣性與多變性，面對行情的走勢，沒人可以準確預測，但是當市場氛圍來到高潮時，投資人便應該提高警覺，如同逆勢投資大師約翰．坦伯頓（John Templeton）所說：「多頭市場在悲觀中誕生，在懷疑中成長，在樂觀中成熟，在興奮與激烈中死亡。」


    # 心理帳戶，落入陷阱而不自知


    最後一種常見的投資心理偏誤，是經濟學家塞勒提出的「心理帳戶」（Mental Accounting）學說，主要在探討人們如何思考金錢，並做出經濟決策。舉例來說，如果你今天花了三百元買了電影票，到了電影院門口卻發現電影票不見了，你是否會願意重新買一張呢？多數人的答案是不會，因為這樣等於花了兩倍的錢去看一場電影。但是若情境改變，你沒有先買好電影票，而是走到電影院時，發現原本放在口袋裡要買票的三百元不見了，但打開皮夾還有一張千元大鈔，你是否仍會買票看電影呢？多數人的答案是會，這就是心理帳戶的影響。


    「心理帳戶」是指人們在做決策時，會常在心裡設定幾個不同的帳戶，把這些帳戶分類地進行管理，彼此之間都是獨立的。例如同樣是買票看電影，但由於我們把買票的錢和皮夾裡的錢分別放在不同的帳戶，導致做出不一樣的決策。


    雖然將帳戶分類別進行管理有時是好事，但套用在投資決策上，可能就會落入陷阱而不自知。「賭場盈利效應」（House money effect）是心理帳戶偏誤的代表，我認為這也是投資市場中十分常見卻常被忽略的偏誤之一。概念是這樣的：一個因為一兩次成功而致富的人，重要的是他能否守住財富，而不是像賭徒一樣，即使在賭場時有獲利，最後也是口袋空空走出賭場大門。這是因為賭徒往往陷入一個「莊家的錢」陷阱，把贏來的錢視為莊家的錢，同時將自己的本金與賺來的錢分開，於是原本保守的心態就會因為額外的獲利而改變，開始下更大注，承受更高風險，所以很快地又把錢還給賭場。


    股市熱絡時也是如此。因為價格上漲而獲利豐厚，會讓投資人持續加碼買進已經漲多的熱門股，忽略了當價格已被哄抬、大幅超出應有的合理估值時所伴隨的風險，導致在行情突然反轉時不知所措。因此，唯有保持客觀態度，冷靜面對市場，做好規畫與紀律執行，才能避免落入投資陷阱，讓資產穩健成長。


    # 了解價格，才是決定報酬的關鍵


    人們在投資中的情緒，推動我們行為背後的力量，通常是一件事物在觀念上的可信度，而非合理性。也就是當我們具有強烈的信念為基礎時，常常會受到許多不可避免的心理偏誤影響，包含個人與集體的行动，主導金融市場中的普遍氛圍，誘使我們做出不理性的行為，導致錯誤的判斷。


    舉例來說，我們常聽到想要高報酬就得承受高風險，這句話就過去的統計數據來看，卻是與事實相違背的。實際上回測過去的長期報酬，價值股的長期表現優於成長股，所需承受的風險卻低於成長股。然而在貨幣寬鬆、資產大幅升值的牛市裡，更多的錢反而是去追逐沒有實際獲利的高成長股，將估值推高到無法想像的程度。


    了解價格，才是決定報酬率的關鍵。投資人可以靠波段操作股票，看好企業的未來展望，願意為成長支付更高價格，預測股市的行為來獲利。或是靠發現被低估的股票，確認下方需承受的风险低於上方潛在的獲利空間，在價格低於安全邊際時買進，在高於公平價值時賣出而獲利。兩種方法的成功因素都是價格，一旦我們對於一檔股票的評價錯誤，或對企業成長創造的獲利預期失準，導致買入成本太高，都可能造成成本金損失。


    為了避免後悔，除了分散投資組合、降低個別資產對於整體報酬的劇烈影響，資產配置中常提到的「再平衡」，也是採取同樣的思路。定期調整投資組合，賣出市場追捧的資產，買進冷門的類別。在長期之下，均值回歸的現象會重複發生，這樣的「再平衡」法則可以讓資產不會受到市場大幅波動的影響，賺取高於市場平均報酬的豐厚獲利。


    這也是本書提到諸多方法的結合，在不同時期將資金配置在最高效的地方，將個別決策的結果進行累積，發揮復利力量，使整體財富穩健成長，創造滿意的長期績效。


    ## 結語


    ### 最好的投資方法，就是最適合自己的投資方式


    「JC 財經觀點」粉絲團在一個偶然的情況下，成立於二〇一六年九月，想要將自己所閱讀的財經商管書籍和美股市場投資經驗分享給每一位讀者，在分享過程中認識更多對閱讀與投資有興趣的朋友，一起切磋討論，創造更多價值。


    所幸我和先生一直堅持初衷，沒有改變當時許下的承諾，在這段時間搭著社交媒體蓬勃發展的順風車，短短四年累積文章超過數百篇，粉絲人數達到兩萬五千人的里程碑，投資獲利也在這段時間大幅成長，是令人意外卻幸福的收穫。在粉絲團成立近四年後，接到遠流出版公司的邀請寫下這本書，將所有的想法與經驗進行整合，用更完整的文字傳達我們的理念，也希望可以鼓勵更多想要前進美股市場、但遲遲未採取行動的讀者，現在或許是打開美股大門最好的時機點。希望讀完這本書的你，可以給予你投資美股的動機與勇氣，並獲得額外思想與財富上的收穫。


    回顧自金融危機以來，政府的量化寬鬆、科技的突破式創新與人類對生活品質的重視，創造了超過十年以上的多頭市場，讓很多投資人已經遺忘了過去曾經發生的嚴重災難，甚至有些這幾年加入市場的投資人根本沒有體會過空頭市場的可怕，也沒有見過所謂股市的崩盤。有些股市老手笑稱這些年輕一輩的投資人沒有經過空頭市場，就不算真正的投資人，這個情況到今天都不一樣了。


    ### 永遠對風險做好準備


    美股市場在二〇二〇年經歷了太多前所未見的事件，新冠病毒肺炎疫情在二月初開始蔓延全球，市場的恐慌與拋售使得原本強勢的美股重挫，引發一連串的連鎖效應。


    連股神巴菲特都說，他這輩子從來沒看過的美股熔斷機制，竟在十個交易日內發生了四次。接著，道瓊工業指數在三月十二日下跌了二三五二・六點，創下一九八七年股災以來最大單日跌幅。其後油價崩盤，造成能源股的營運岌岌可危，甚至在期貨市場出現前所未見的一負油價，大大重傷了市場投資人。


    就業數據與經濟數據都創下了新低紀錄，為了避免經濟陷入無法挽回的衰退危機，聯準會祭出史上最大的救市計畫，甚至連過去不曾援助的不良債權都納入名單，企圖挽回市場信心，讓市場開始V型反彈。但危機是否已經過去了呢？直到寫下這段文字的當下，市場仍潛藏著高度不確定性，無法預測接下來的股市走向。


    疫情總會趨緩，經濟會不斷循環發展，市場終究會復回到正常運作，也會帶領股市重新振作。歷經這次的危機，對每個投資人來說絕對是寶貴的一課，也是一次新的開始，讓你了解市場永遠潛藏著未知的風險。而身為投資人最重要的事，就是永遠對風險做好準備，長期存活在市場上的人才是最後的贏家。


    ### 世界上最好的獲利天堂


    我在本書中提到的內容，包含自己在美股投資多年經驗的心得，看美股市場在歲月間的風格轉換與高潮迭起，不管是在過去、現在還是未來，我相信皆適用於不同的市場環境，並能提供讀者一套可依循的投資邏輯，從中找到適合自己的投資方式，建立起專屬於自己的投資原則。


    除此之外，書中提到許多看好的產業與商業模式，包括訂閱經濟、金融支付與電動車等科技趨勢，也都正處於蓬勃發展階段，由於美股的趨勢動能延續性非常強，好的公司面對全世界的市場擁有更強的競爭能力，加上資訊的流通速度與獲得比過去更容易，現在加入美股市場絕對為時不晚，更好地參與這些公司的成長，帶來豐厚的獲利。


    當然，書裡有許多我過去與現在都在關注並持有的公司，分散於不同產業類別，每個產業具有不同的特性與評價方式，希望提供讀者一個大方向，先了解產業中的領導公司，培養自己的能力圈並持續擴展投資範圍。


    綜觀全世界，找不到一個比美股更多元、更多選擇性的市場。錢進美股之後，相信你也會發現美股是這個世界上最好的獲利天堂，一起在美股中實現財富與自由的人生。


