    對於不熟悉美股個股的投資人，除了大盤 E T F以外，還能藉美股的產業分類來做進一步的資金配置。在景氣循環週期中，每一個階段市場中的領導類股也會不同，當市場熱絡時，投資人應該觀察目前盤面上的領導類股，並找出該類股中最強勢公司的最大勝率，資金動能推升股價上漲，顯示出強者恆強的現象。而當經濟開始有衰退疑慮、市場中不確定性升高時，資金通常會流向穩健且具固定收益特性的類股，投資人若觀察到該類股有增強趨勢，便可以提高警覺，進行部位的調控來因應未來可能發生的變化。


