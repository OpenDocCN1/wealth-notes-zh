    一、數位媒體：這是Adobe 所有業務中最重要的「一塊」，占總營收的六九％。旗艦產品是Adobe Creative Cloud，透過訂閱服務，經由線上下載並使用Adobe
    最新版本的軟體。文件處理軟體Adobe Acrobat 則提供使用者免費使用Acrobat Reader，軟體或觀看PDF檔案，電子簽名Adobe Sign
    與Adobe Scan 等功能。除此之外，Adobe 藉由Adobe Sensei 所蒐集到的數據，透訓AI人工智能和機器學習，幫助客戶擁有更個人化的體驗，減少繁瑣的流程，以增強使用效率。


    二、數位體驗：數位體驗主要用於協助客戶進行數位轉型，占總營收的二九％。在此業務中，Experience Cloud 包含了Adobe Advertising
    Cloud、Adobe Analytics Cloud、Adobe Marketing Cloud 與Magento Commerce Cloud等四個雲產品，利用Adobe的內容與數據平台，幫助企業建立專屬的購買程序、管理廣告，並且深入了解他們的客戶。


    三、出版：出版部門主要應用取代或因應傳統印刷市場的需求，占總營收的二％，包括線上教學（Clearning）解決方案、數位文件出版、線上會議與表格平台，透過Adobe
    PostScript 和Adobe PDF印刷科技，使這些生產流程變得更安全有效率。


