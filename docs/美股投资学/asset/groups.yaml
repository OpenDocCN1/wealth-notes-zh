    # 第3章

    賺錢公司都有獨特的商業模式


    紐約大學金融學教授亞斯華斯·達摩德仁 (Aswath Damodaran) 是一位典型的價值投資者，善用數據分析對企業進行合理的估值。他曾說：「我天生就著迷於數字，但當我研究數字時，極為諷刺的是，我對數字的研究愈多，對於完全以數字為支撐的論點就愈感到懷疑。『」


    這段話告訴我們，一個好的估值方式並不只是把數據處理過並跑出結論，而是在整個過程中挖掘這家公司的良好故事，對於企業的理解愈深並找出公司的商業模式，才能體現企業的真實價值。


    # 什麼是商業模式？


    在思考商業模式時，先回答一個問題：這家公司是靠什麼賺錢？它提供哪些產品與'
  - '[PAGE 70]


    服務，需要透過哪些合作夥伴，以及滿足了哪些人的需求？這些都是公司在進行商業布局時所建構的「價值網」（Value Net），而每家公司都擁有自己的價值網，架構出獨特的商業模式。


    「價值網」的概念由經濟學家亞當．布蘭登伯格（Adam M. Brandenbeger）與貝利．奈勒波夫（Barry J. Nalebuff）提出，我認為這是在研究企業競爭、策略與發展時最重要的方法。利用價值網連結產業鏈中的每一個參與者，描繪出完整的商業情境，以一個更全面的角度去思考，在所有參與者中找出最具價值的投資對象。


    以圖 2 來分析，思考如何利用價值網來為公司創造出更大的價值。網中的參與者時而競爭、時而合作，建立起動態循環，投資人站在價值網中央，檢視企業的內部情況與優勢，也可以用旁觀者的角度來思考企業未來的成長與外部挑戰。


