  - '[PAGE 261]


    股的類型。雖然營收沒有太耀眼表現，卻維持著相當優異的獲利能力，毛利率一直維持在三四％左右，十年來如一日，展現超強的成本控管能力，營業利潤率也逐年成長，顯示公司的營運愈來愈有效率，才能在零售產業中保持领先地位。


    穩定增長的獲利為公司帶來充沛的現金流，家得寶的股息從二〇一一年每股配發二．〇一美元，到二〇二〇年已經成長至每股五．四四美元，最近十年的股息平均每年成長率為二○．七％，相當適合作為長期投資的標的。


    # 競爭對手


    目前在美股市場中能與家得寶相抗衡的，就是另一家居家修繕類股「勞氏公司（Low''s，美股代號LOW）」，股價同樣維持長期向上的趨勢。不過以近幾年的表現來看，家得寶在營運表現、財務狀況都優於勞氏公司，在未來的成長性上，我認為家得寶也更具具優勢。


    把家得寶與競爭對手勞氏公司的股價進行比較，雖然兩者股價表現差異不大，勞氏公司的主要客戶是想要動手DIY裝修房子的人，家得寶的客戶則主要針對專業的承包商，因此消費金額會更高，營收成長速度也更快。在線上購物平台的發展上，家得寶的發展也比勞氏公司快，營運效率與獲利能力優於對手。最後，根據美國銀行的統計數'
  - '[PAGE 262]


    據，每一千個千禧世代消費者中，有六七四%更喜歡家得寶而非勞氏公司。年輕人是未來的主要消費族群，這也讓家得寶的未來更具成長性。


    # 未來展望


    由於家得寶的業績與房市的好壞呈現正相關，在房市熱絡時，消費者對於居家修繕的需求也會提高，房市降溫時，對居家修繕的需求則會降低，所以「景氣好壞」與「消費者支出」的變化對於家得寶的業績有較大影響。雖然二〇二〇年因為疫情而使得許多實體店面暫停營業，但令人意外的是，民眾也因為宅在家沒事情做而開始進行居家修繕，加上家得寶線上消費使用率的成長，減緩了對家得寶的業績衝擊。


    以長期角度來看，根據統計，二〇一九年美國家庭房屋修繕產值約四千億美元，預計到二〇二三年會成長超過四千五百億美元，其中家得寶的銷售額預估可達一千億美元，占總產值的四分之一。


    二〇一五到一九年，平均每位房屋持有人每年花費在房屋修繕的金額從三二八美元成長到九〇八一美元。因此，即使家得寶的營業因疫情受到影響，未來仍可維持穩定成長的步伐。'
  - '[PAGE 263]


    # 坐享租金收入的房地產股票：不動產投資信託 (REITs)


    許多人因為投資房地產而致富，但投資房產所需花費的成本太高，不是每個人都負擔得起。在美股中，小資族不用實際去購買房地產，把現金全壓在流動性差的房地產上，可以選擇更多元、更具成長潛力的「不動產投資信託」（Real
    Estate Investment Trusts, REITs），既具成長性，又能享受股價上漲的獲利，還可以穩穩領現金流。


    所謂「不動產投資信託」，就是透過不動產證券化，在公開市場上進行交易，讓投資人用一檔證券，就可以投資持有持續產生收益的不動產公司，或是向客戶提供融資服務而獲取收入的公司，藉此獲利。


    根據擁有的物業類型與公司收入來源，常見的REITs 有下列兩種：


    +   一、權益型（Equity REITs）：投資權益型REITs 就像包租公／婆的角色，擁有不動產的產權，主要收入來自於出租不動產收取的租金，公司也會隨著不動產的增值而獲利。


    +   二、抵押型（Mortgage REITs）：投資抵押型的REITs 類似金融業的角色，不直接持有房地產，而是向不動產的開發商貸款或投資不動產抵押證券，賺取利息與資本利得。'
  - '[PAGE 264]


    投資人在買入REITs之前，應該先了解產品的特性、不同類型的公司在營運上的差異與可能面對的風險，才有辦法挑選出最適合自己的標的。


    另外，REITs雖然具備固定收益證券的性質，但也與股票和ETF相同，配息需預扣三〇〇％的股票稅。投資人在挑選REITs時，不僅需要注意殖利率，也應該考量該產業未來的成長性，跟著公司的成長一起獲利。接下來針對挑選REITs應考量的優缺點進行討論，讓讀者可以更深入了解這個商品。


    # 投資REITs的優點


    除了擁有穩定的現金流收益，投資REITs還有许多其他的優勢，幫助投資人更快累積財富。貨幣寬鬆時代推升資產價格高速上漲，而REITs就是主要的受惠族群之一，也因此
    在過去二十五年的總回報率高於標普五百的指數報酬，也優於其他固定收益證券。


    +   一、選擇多元：根據美國全國不動產投資信託協會（Nareit）的分類，目前可以投資的REITs行業包括辦公室、住宅、倉庫、商場、健康照護、數據中心、無線通信基礎設施和度假酒店，範圍廣，選擇性多。


    +   二、流動性佳：REITs是在集中市場掛牌交易，與股票交易方式相同，因此流動性'
  - '[PAGE 265]


    與變現性都比直接投資不動產還要好，投資門檻也較低，一般投資人皆可參與。


    三、配息優勢：由於REITs的收入來自於穩定的租約，依照政府法規，REITs必須將九○%的應稅收入分配給股東，因此投資REITs可以獲得的股息也比一般股票多，長期下來，超過五○%以上的收益都來自於股息的現金流收入。


    四、抵抗通膨：租約通常會保護REITs的收益不受通貨膨脹影響，每年跟著調漲租金，REITs的配息通常可以超過通貨膨脹率。


    五、資產配置：不動產投資是美國第三大資產類別，波動度雖高於債市，卻低於科技股、小型股與新興市場股價指數，波動幅度則與全球股市相當。顯示REITs在一定的風險程度下，有創造穩定成長報酬的特質，是相當適合作為資產配置的工具之一。


    # 投資REITs的風險


    當然，任何投資商品都有潛在的風險因子，即便是REITs這類長期上漲的標的，也會因為短期市場變化而有劇烈波動。預先認識可能面臨的風險，讓投資人在風險來臨時處變不驚，甚至在REITs下跌至合理價格時加碼買進，就能創造更多的現金流收入。


    一、景氣變化：REITs的價格波動會受到景氣的影響。當景氣衰退時，房地產的需'
  - '[PAGE 266]


    求下降，REITs的價格也會應聲下跌。因此在選擇REITs時，可以考慮物業具有持續性穩定、租約較長的標的來投資。


    二、利率變動：利率的波動也會影響REITs。利率上升時通常不利於整體股市上漲，導致REITs 的股價跟著下跌。另外，抵押型REITs對於利率波動的敏感程度更大，會直接影響公司的獲利能力。


    三、過度集中：單一類別的REITs將資金集中投資在某一物業上，當該產業遭遇逆風時，REITs的價格波動也就更大。如商業房地產近幾年先是受到電商崛起的打擊，又面臨新冠肺炎疫情擴散的衝擊，將許多REITs的股票打入谷底。


    四、成長較慢：REITs必須將九○%的應稅所得以紅利進行分配，投資人雖然拿到了配息，但公司能再投資的資金就變少，在沒有採取其他方式募集額外在資金的的情況下，也限制了公司的成長性。


    五、負債過高：當REITs為了擴張而以舉債融資的方式籌措資金時，須注意公司的負債比率高低於五○%，避免因為突發狀況而引發流動性風險，導致無法營運而破產。


    # 美國市值前十大REITs


    在選擇REITs作為投資標的時，應該先評估公司營運的產業屬性，是否具有持續性、'
  - '[PAGE 267]


    可以穩定營運並擁有發展前景的產業。舉例來說，在線上購物逐漸普及的情況下，過去占地面積廣大的購物中心在現在的需求就降低了，投資於市場的REITs也大會影響，於是股價下跌。


    而受惠於國際網路，包括5G產業、雲端產業的發展，許多科技公司需要場地放置伺服器，使得營運數據中心的REITs股價成長性比其他REITs高。投資人也可以選擇具持續性需求產業的REITs，例如健康照護中心與公用事業的REITs，就是可以考慮的標的。


    目前美國市值前十大的REITs（參表54）中，大多數也與電信和數據中心相關，市值最高的「美國電塔」（American Tower，美股代號AMT）就是經營無線通訊的基地台業務，全美市占率最高的不動產信託公司，其最大的客戶是美國主要電信商AT&T，也可以持續獲得穩定的收入。


    在表54中排名第四的Equinix（美股代號EQIX），是全球最大的數據中心營運商，在全球各地提供數據中心主機託管、互聯網服務與基礎設施的管理服務，科技進步帶動大量數據、AI人工智能與雲端產業的趨勢發展。除了科技公司以外，所有行業都將面臨數位轉型而將原本的業務線上化，大型科技巨頭提供管理數據的服務，但這些數據需要靠數據中心來維護，也因此讓這些公司的業務高速成長。而由於數據中心深具規模優勢，在該產業中，我也相當看好數據中心託管商排名第二的Digital
