  mdcn: '

    由蘋果公司的財報可以了解到，不同產品、不同產業的毛利率差別是很大的，因此投資人在分析公司時，必須先了解公司的商業模式與產品屬性，不能拿不同產業的公司做比較。例如折扣商店沃爾瑪的商業模式主要是低毛利、高週轉率，而社交平台霸主臉書的商業模式則是靠平台的廣告收入，由於低成本、高費用，毛利率高達八○以上。如果直接比較兩家公司，會得出完全錯誤的結果。


    ## 營業利潤率


    - 營業利潤=毛利-營業費用

    - 營業利潤率=營業利潤/營業收入

    - 公司毛利扣除營業費用後獲得的利潤就是營業利潤，將營業利潤除以營業收入，就得到營業利潤率。營業費用包含一家公司的研究與開發、銷售與管理、折舊與利息等費用支出，這些費用通常用於開發新產品、擴展市場與留住人才，強化公司的競爭優勢。

    - 營業利潤率愈高，代表公司除了具有良好的成本控管能力之外，更具有高度的品牌優勢與網絡效應，不需要過多的營銷費用，也可以讓顧客心甘情願地掏錢購買產品。


    在損益表中，營業費用通常分為兩類：


    一、研究與開發費用：指開發、設計與優化產品所需的費用支出。公司想要持續成長，就必須找到市場上還未被滿足的需求，開發出新產品來吸引顧客購買。所以，一家具有創新能力的公司一定會把部分營收用在研究與開發上。如果看到公司的研究與開發費用持續降低，就該警覺未來是否有成長趨緩的狀況。


    二、銷售與管理費用：指公司用於銷售、行政與管理等與公司製造產品或提供服務的流程沒有直接相關的費用，例如行銷廣告與員工薪資。營收穩定成長、已經達到一定規模的公司，為了能站穩市場的領導地位，這項費用通常穩定維持在一個水平。但高速成長的新創公司除了研發以外，行銷費用的支出也很高，在早期不計一切地吸引客戶、搶占市場，因此營收成長和毛利的數字雖然都很漂亮，卻仍處於虧損狀態。


    以蘋果公司為例，由於已經成長到一定規模，具有規模優勢，基本上研究與開發費用占總營收的比例維持在穩定狀態，從二〇一八年的五％，上升到二〇二〇年的七％，應是與公司近年的業務轉型有關，另外，品牌優勢也讓公司不需要花費大筆銷售和行政支出，因此銷售與管理費用穩定地占營收比例的七％左右（參表40）。


    ## 淨利率


    淨利率（營業利潤＋業外損益）×（1－稅率）淨利率＝稅後淨利/營業收入


    最後要觀察的是淨利率，由此可衡量一家公司整體的獲利能力。淨利率愈高，代表獲利能力愈強，股價也會愈強勢。


    淨利是將營業利潤率加上業外獲利（或損失）、稅負或訴訟等項目計算得出。如果公司的業外收入（損失）金額突然有明顯異動或占比過大，表示公司的獲利主要受到業外而非本業影響，這是值得關注的警訊之一。


    同樣抓出蘋果公司的淨利來看（參表41），在營業利潤扣除其他收入/支出、所得稅等費用之後，公司的淨利在二〇二〇年為五七四億美元，將淨利/營業營收得出淨利率為二〇.九%（57.41÷274.515×100%＝20.9%）。


    在觀察公司的獲利能力時，應該把淨利率結合毛利率與營業利潤率的趨勢一起看，在正常情況下，三率應該呈現同向的發展趨勢。高毛利率代表優異的成本控制得宜，高營業利潤率代表優異的管理效率，而高淨利率代表公司的獲利能力。除此之外，三率之間的變化比例也應互相匹配，倘若某一個數字的變動突然很大，有可能是公司的內部問題，也可能是業外損益導致，對公司造成短期或長期的影響。當三率之間有明顯差異，則應該在每個階段找出變化的原因，提早發現潛在的問題。


