    第6章


    # 美股財報公布日，你應該注意的事


    該如何知道自己的判斷是正確的？最好的方式是閱讀公司財報，用具體的數字來佐證。過去閱讀台股財報時總覺得非常枯燥無聊，甚至感覺像在讀天書，讀完後還是沒辦法判定公司是否值得投資。自從開始投資美股，我對於看財報這件事大大改觀，反而覺得非常有趣，因為公司對於自家的商業模式、產品種類、市場分布與未來展望通常都交代得非常清楚，只要有閱讀過一次財報，對於公司的背景至少可以掌握七、八成以上。


