    # 掌握出場時機


    意外，就會慶幸自己有買保險，將損失降到最低，所以千萬不要因小失大而懊悔終生。


    能夠接受停損概念並確實去執行，讓投資人避免陷入鉅額虧損的窘境。但大多數人之所以無法接受停損，是因為一旦虧損持續擴大時，會陷入一種情緒性麻痺的狀態，心理上無法面對虧損的現實，生理上自然沒辦法採取停損動作，這都是因為一開始沒有進行「斷捨離」的工作。


    所謂「斷捨離」，是指藉由對物品進行「減法」來為自己的生活加分。也就'
  - '[PAGE 231]


    是斷絕與捨棄不需要的事物，幫助自己可以更專注在重要的事情上。對於生活是如此，對於投資更是如此。在投資上摒除不必要的雜訊、已經不再產生價值的資產，以及專注在目前最具有成長潛力的公司上，才有辦法提振投資組合績效。


    一般投資人沒有掌控市場的能力，更沒辦法控制自己投資組合中購買的股票會漲多少，也無法控制它們會漲多久，這些都是無法預期的事情。投資人能控制的就是資金配置的比例、買進的價格（成本），以及自己的承受風險（損失），在可控的範圍內進行調整，將資金做最有效的配置。


    那麼，何時是斷捨離的時機呢？


    # 第一步，了解自己投資的公司。


    例如投資前是否經過審慎評估，並且確實了解公司的營運狀況與股價特性是屬於成熟股、穩健成長股還是高速成長股。成熟股的營運穩定，雖然可以支付穩定的股息給股東，但成長性較差，倘若所屬的產業衰退，本業也遭遇逆風影響到公司基本面，那就該思考賣出手中的股票，尋找更穩健的標的。


    如果是選擇穩健成長股與高速成長股，股價隨著公司的成長而上漲，就該注意公司的營運策略，投入的資本是否帶來相應的成長，以及成長是否有趨緩的疑慮。如果公司'
  - '[PAGE 232]


    沒有把目標放在擴大市占、增加新的營收來源與鞏固競爭優勢，對成長股來說就是潛在的風險，也是投資人該考慮離開的時候。


    第二步，進場前應該先設想失敗的情況，並想好出場機制。


    很少投資人在進場前會先想到離場的問題，是因為主觀認定買進公司的股票後，股價會朝著自己預設的方向前進。不過，一個完整的投資決策包含了進場與出場的規畫，在進場前思考可能發生的情況，在行情不如預期時更能理性面對與反應。


    如果你是以基本面因素進場，例如公司併購、營收表現良好而買入公司的股票，認為公司會因為合併而產生綜效，或是營運表現會持續下去，當這些基本面因素消失時，例如過高的合併價導致公司財務負擔加重，或是營運出現非預期的問題，受到競爭對手打壓等狀況時，就該考慮賣出。但如果你是以技術面因素進場，先找到型態上股價的支撐與壓力，在股價的關鍵點位附近設定停損點，如果股價發展不如預期，只要碰到停損價就該出場。


    第三步，當股價朝自己預想的方向發展，就要思考何時獲利了結。


    股價朝著自己預想的方向走，表示在投資前所做的研究與分析是正確的，這是投資'
  - '[PAGE 233]


    人最喜歡的情境與最理想的狀況，也就是行情正朝著你規畫的方向走，代表獲利開始累積，讓好公司幫你賺錢。同樣地，以基本面因素驅動股價上漲的公司，一旦發生基本面問題（例如營運轉差、成長趨緩等因素），投資人就該評估該公司本質是否已經改變，然後決定是否獲利出場。


    而以技術面因素進場的投資人，當短線行情發生重大走勢、突然大幅飆漲時，也應該觀察上漲的動能是否可以維持。就算市場上的投資人持續買入公司的股票，成交量大幅攀升，驅動股價上漲，還是有動能耗盡的時候，如果短線上沒有買盤支撐，出現量價背離的情況，就得搭配技術指標的變化趨勢，考慮出場時機。


