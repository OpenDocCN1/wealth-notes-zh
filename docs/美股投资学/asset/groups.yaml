    ## 美股息的分發


    美國股市中有許多值得長期持有的好公司，由於營運穩定，現金流也相當充沛，通常每年會以股息或回購股票的方式，將這些現金回饋給持有公司股票的股東，讓股東除了享受長期股價上漲的資本利得外，還可以獲得股息連年成長的好處。


    一般來說，美股中絕大多數的公司都是「每季」配息，一年配發四次股息，甚至有些公司是「每月」支付股息給股東，讓投資人每個月都有一筆額外的現金流可領。因此，如果投資人想要參與股息，應該留意公司所公告的四個日期，請參考表
    6。


    | 表 6 參與除息的四個重要日期 | |

    | :--- | :--- |

    | **宣告日 (Declaration Date)** | 公司宣布除息日與配息日。 |

    | **除息日 (Ex-Dividend Date)** | 想要領股息，務必在除息日前持有股票。除息日當天開盤後，配息會從股價中扣除。 |

    | **登記日 (Record Date)** | 除息日之前持有公司股票的股東，才會被登記在公司名冊上。 |

    | **配息日 (Payment Date)** | 股息正式發放給股東的日期。 |


    其中最需要關注的日期是「除息日」。想要領到每季（或每月）發放的股息，投資人必須在公司的除息日之前買入股票，如果不小心在除息日之後才買入股票，則必須等到下一次的除息日才能領息。


    ## 摘懂美股投資稅務


    稅務是投資人相當關注的問題之一，首先要知道的是，投資美股是沒有「資本利得稅」，也就是即使買到一檔股價飆漲、連年翻倍成長的公司，也不需要為了獲利而支付額外的稅賦。在充滿成長潛力的美股市場中，這對投資人來說是一大優勢。


    不過，當海外所得超過台幣一百萬元，還是需要向台灣的國稅局進行所得申報；若是超過台幣六百七十萬元，則除了申報之外還須繳納額外交稅款。這點是投資人必須特別注意的地方，避免漏報海外所得。


    除此以外，雖然資本利得免稅，但若投資有支付股息的公司，在收到股息時，券商會預扣三〇%股息稅。舉例來說，如果公司支付每股一美元的股息，則投資人收到的股息為一（1×30%）＝0.7美元（相關稅務說明請參考表7）。


    ### 表 7 各項稅務規範


    | 稅務名稱 | 稅務規範內容 |

    | :--- | :--- |

    | 資本利得稅 | ・稅率0%。<br>・資本利得為免稅，但台灣投資人須依規定填寫W-8BEN表格。 |

    | 股息稅 | ・稅率30%。<br>・領到股息前會先預扣30%股息稅，投資非美國公司的稅率則依註冊國家而有不同。 |

    | 利息稅 | ・稅率0%。<br>・投資債券的利息免稅。 |

    | 遺產稅 | ・稅率0%～35%。<br>・外國人在美國遺產稅的免稅額為6萬美元，超過的部分採累進稅率計算，最高達35%。台灣複委託賬戶可以委由券商協助辦理。
    |

    | 海外所得稅 | ・稅率0%～20%。<br>・以「戶」為申報單位：<br>申報戶所得<台幣100萬元者不需申報；<br>申報戶全年海外所得總額≥台幣100萬元者，須全數計入基本所得額*；<br>基本所得額>台幣670萬元者須繳稅。
    |


    ＊基本所得額＝綜合所得淨額＋海外所得＋特定保險給付＋未上市股票與私募基金受益憑證交易所得＋非現金捐贈金額＋分開計稅之股利及盈餘。


    資料來源：美國國稅局、財政部賦稅署／作者整理


    有些投資人會覺得預扣三〇%的股息稅相當重，而不願意去投資美股中的股息成長股，我認為這是相當可惜的一件事，理由如下：


    - 一、美股的公司股息殖利率通常偏低，目前標普五百指數的平均股息殖利率約一、六%，甚至許多高成長性的公司都不發股息，大部分用股票回購方式將現金返還給股東，所以對整體報酬率影響不大。如果真的想支付股息稅，還是有很多其他的好公司可以選擇。

    - 二、投資美國公司的股票與ETF都需先被預扣三〇% 的股票稅，但若是投資在美國上市而非註冊於美國的公司，則會依據註冊國家而有不同的稅率。例如投資於台灣在美股上市的公司預扣的股票稅率是一○%，投資於英國公司的股票股票稅為○%，投資於中國公司的股票則為一○%。

    - 三、美股的公司除了可持續支付股息外，能夠持續每年提高股息的 companies 也比皆是。舉例來說，可口可樂的股息已經維持了連續五十七年成長的紀錄，每年配發的股息都比前一年還多，累積下來，其實付出去的股息稅僅是可獲得報酬的一小部分。

    - 四、即使是投資台灣股市的股息所得，超過兩萬元就得扣繳補充保費一．九一%以及股利所得税（併入綜合所得稅或採分離課稅稅率），並不是完全不用負擔稅務。


    在這些考量之下可以發現，投資美股需負擔的稅務其實沒有想像中那麼高，也不應是投資美股的阻礙。用更長遠的眼光來思考，在美股中一定可以找到能維持長期競爭優勢的公司來投資，跟著公司成長，一起享受獲利的果實。


    ## 建構你的投資組合


    了解美股環境與基本規則後，就可以正式投入美股市場，買入人生的第一檔美股標的。但到底要選擇哪個標的、如何建構投資組合，是新手投資人面臨的第一個難題。讓我們思考一下，一個可以擁有正向循環的投資組合是什麼樣子？


    - 一、複利成長股：通常代表公司擁有非常長時間的穩定現金流，並且持續支付股息，讓本金像滾雪球一樣愈滾愈大。投資人可以選擇營運穩定的股息成長股來打造一個現金流組合，享受長期資本市場的複利。另外，只要美國仍是世界上最強的資本市場，在看好美國經濟持續成長下，美股大盤指數
    ETF 就是複利成長股的最佳選擇。

    - 二、穩健成長股：通常是指穩定營運且在產業中占領導地位、規模較大的公司。這些公司具有優異的獲利能力與穩定的現金流，並且善用這些資本去進行擴張，透過研發與收購等策略來創造成長，並透過回購股票或股息回饋給股東，激勵股價持續向上，讓投資人享受到優於大盤的資本利得。

    - 三、高速成長股：不同於複利成長股與穩健成長股，高速成長股通常仍處於虧損狀態，股價卻可以呈現爆發式的成長，短期內創造巨額的投資報酬。這是因為這些公司處於新興產業，營收成長率極高，但為了搶占市場，公司只好把獲利再用於投資、研發與行銷上，使得短期內雖然無法盈利，市場卻願意給予高估值。


    運用以上三種不同的資產特性來規畫投資組合，投資人可以用大盤指數作為投資組合的基底，將在高速成長股中賺取的獲利，再分別投入於大盤指數與穩健成長股，打造一個正向循環的投資組合。


    舉例來說，資金規模大的投資人與資金規模小的小資族，在投資的策略規畫、資產配置上就會有所不同。先思考一個問題，你覺得一百萬的一%和一百的一%一樣嗎？以百分比來看是看一樣，但換算成金額就差很多了！小資族的進出對市場完全沒有影響，在資金配置會更靈活，一旦資金規模愈來愈大，要考慮的面向就會愈來愈多，包括年齡也是影響投資組合的重要因素，年輕人還擁有旺盛的勞動力來創造收入，試錯成本比較低，也可以承受較大的風險，更適合打造一個積極型的投資組合，提高在高速成長股的配置比重，並把賺得的獲利配置到大盤ETF上，長期投資來累積資本。而年紀較大、甚至已經退休的投資人，則應著重於穩健型的投資組合，降低報酬的波動率，打造一個具有持續現金流入的投資組合。


    另外，如果你想成為為全職交易者，與擁有本業、把投資當做額外收益來源的投資人在投入研究的時間也有極大差異。少數投資人將投資視為謀生職業，大多數的時間用於研究投資，尋找最好的投資機會、擇時進出市場，並在風險可控的情況下，追求最大的絕對報酬。


    不過，多數投資人的情況則相反，與其頻繁地盯盤，更希望讓投資單純化，獲取合理且穩定增長的報酬，讓未來的退休生活动品質可以更好。因此，完全沒時間看盤的投資人可以選擇將資金配置於大盤的
    ETF，獲取長期平均報酬。而對於主動投資有興趣、希望自行挖掘好公司的投資人，則可將部分資金進行配置來增添報酬率。


    ## 不同類型投資人的最佳資產配置


    在投資環境與商業環境快速發展與汰換下，不同類型的投資人可以選擇最適合自己的資產配置方式，才能安心地做好長期投資規畫。


    而在資產配置的課題上，最為人熟知、也具有歷史回溯數據證明的就是「股債平衡策略」，這是將資金配置在股票與債券兩項具有負相關性的資產上，藉以平衡報酬的波動率，創造長期穩定的績效與財富增長。


    股票是風險性較高的資產，所以承擔風險下得到的「風險溢酬」更大，比起「固定收益型」的債券商品，股票獲得的報酬比債券更高。但正因為債券具有「固定收益」的特性，所以在面臨意外事件發生、不確定性上揚、風險加大時，具有保護的作用。


    積極型投資人通常採用股債比為八比二的配置，而保守型投資人則以自己的風險承受度來進行比例調整，並且定期調整再平衡，例如賣出手上漲多的資產，買進跌深的資產。長期透過這樣的「再平衡」法則，可讓投資組合不會受到市場大幅波動的影響，賺取市場的平均報酬。


    除此之外，投資人如果願意多花一些時間研究，也可以考慮在投資組合中加入更具有成長動能的創新元素。方舟投資（ARK Invest）是美國一家專注於破壞式創新的投資公司，旗下擁有五個主要旗艦型基金，投資在包括區塊鏈、人工智慧、機器人、能源儲存與基因序列等熱門趨勢產業下的領導公司，其中最知名的投資案例就是特斯拉的成功，讓創辦人凱薩琳·伍德（Cathie
    Wood）聲名大噪。


    二〇二〇年，方舟投資撰寫了一篇〈重新思考資產配置〉（Rethinking Asset Allocation），文章中討論了「將創新科技納入投資組合」的重要性，並提供公司的回測績效來進行佐證。


    將資金配置於整個市場，可以獲得整個市場的平均報酬，而將方舟投資的創新策略注入該投資組合後，在投資組合的風險與波動沒有大幅增加的情況下，可以為投資組合平均每年帶來三．七％的超額報酬。


    這與我自己的投資理念相當符合，在原本的被動投資部位加入主動的元素，將看好的趨勢產業加入到整體投資組合當中，為自己帶來額外的報酬。以這樣的方向來思考，穩健型投資人可將資金進行分散配置在大盤指數，而積極型投資人則可提高投資組合中主動選股的占比，藉由挑選好公司、主題型的
    E T F，或直接選擇投資像方舟投資這樣的專業投資公司發行的商品，作為投資組合的配置之一。


    ## 從指數投資開始


    投資美股一定要認識三大指數，這三大指數具有不同的代表意義，可以綜合評估整體市場的表現。對新手來說，一開始投資的也可以從指數成分股中最強的公司開始認起。


    大盤指數可以用來判別行情走勢，評估當前市況、版塊強弱與產業趨勢，以下分別說明「道瓊工業指數」〔Dow Jons Industrial Average Index，美股代號D
    J I A 〕、「標普五百指數」〔 S & P 500 Index，美股代號S P X 〕與「那斯達克指數」這三大指數的差異與特色。


    ### 道瓊工業指數


    道瓊工業指數是追蹤美國紐約證券交易所（N e w York Stock Exchange，NYSE）和那斯達克交易所（NASDAQ）最受市場關注的三十家上市大型藍籌股，也代表美國整體經濟的發展。藍籌股是指擁有可追溯的營運記錄、是市場上公認最具品牌優勢及財務狀況相當良好的公司，所以道瓊工業指數的成分股通常是一般投資人耳熟能詳的大型企業，包括迪士尼（Walt
    Disney Company）、美股代號DIS）、微軟（Microsoft）、美股代號MSFT）、蘋果公司與VOY（美股代號V）等公司。


    二〇二〇年道瓊工業指數調整成分股時，加入了雲端產業龍頭「Salesforce」公司（美股代號CRM），曾經紅極一時的能源產業龍頭「艾克森美孚石油（Exxon
    Mobil），美股代號XOM）同時被剔除，表示雲端產業在美股中已成爲主導經濟的支柱之一，而能源產業則受到嚴峻挑戰。


    ### 標普五百指數


    雖然道瓊工業指數可被用於衡量美國整體經濟的變化，但成分股只有三十檔，觀察上難免與實際的整體股市狀況出現偏差，沒辦法反應整體市場的狀況。而標普五百指數是由美國五百家最大的上市公司組成，除了市值、流動性之外，還必須符合在外流通股數的限制，以及營運表現連續四個季度都獲利的條件，才足以被納入標普五百指數，代表美國最強的五百家企業。二〇二〇年底，電動車龍頭特斯拉達成連續五季獲利，市值

