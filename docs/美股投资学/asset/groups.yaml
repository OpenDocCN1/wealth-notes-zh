    ## 美股市場的遊戲規則


    在進入美股市場之前，了解遊戲規則是最重要的第一步，如同一個人在學開車之前，必定得先讀過交通法規，才能避免正式上路時誤觸規定。遵守規則、安心上路，讓你以更快抵達目的地，而在投資這趟旅程中，了解規則是讓你更快抵達財富目標首要條件。


    所以，美股市場中有哪些遊戲規則（參表4）是投資人應該要注意的呢？


    - 一、交易時間：一般來說，美股的交易時間是台灣時間的晚上九點半開盤，直至隔日凌晨四點。若遇到冬令時間（十一月至隔年三月），則會延後一個小時，變成晚上十點半開盤，直至隔日凌晨五點收盤。在這段時間內，股市交易非常熱絡，盤中交易量也非常大，享受看盤的樂趣是投資美股的好處之一，但是不要誤會，除非是做當沖交易，否則完全不需要盯盤。美股中有許多營運穩定、獲利成長的好公司都值得長期持有，投資這些公司來享受複利的力量，才是投資美股的終極目標。

    - 二、交易單位：投資台股時，一般是以「一張」股票（等於一千股）作為買賣單位，但到了美股市場，投資單位以「一股」為計算單位，而不需要再計算買一張需要多少資金。舉例來說，若某公司的股價為十美元，那麼買入一股的成本就是十美元。這對小資族來說更為有利，因為可以利用定期定額的方式，持續買進好公司的股票，積少成多，累積下來的成果可是很驚人的！

    - 三、漲跌幅限制：與投資台股最大的不同，在於台股的股價每天有漲跌幅一○%的限制，但美股沒有漲跌幅限制，所以在遇到重大事項宣布、財報公告日時，股價會有非常大的波動。這也證明了美股是個極具有效率、不會被特定人影響股價的市場，只要公司的基本面良好，股價長期向上的趨勢就不會被輕易改變，也讓投資人更有信心持有股票。

    - 四、交易手續費：與投資人的長期報酬率最相關的一個關鍵，就是交易成本。交易手續費對長期投資人來說可能佔比不高，但對於持續買進股票、交易頻率較高的投資人而言，絕對要納入決策的考量因素，避免賺了股價，卻被交易成本吃掉大部分的報酬。不過幸運的是，在科技的進步與市場環境的競爭下，目前許多海外券商都提供了投資美股與ETF一零手續費一的服務，節省了大筆手續費，讓投資人的資產累積更有效率。

    - 五、交割日與當沖限制：開立美股帳戶時，券商会提供兩種帳戶給投資人選擇，一種是現金帳戶，另一種是融資（保證金）帳戶。如果選擇開立現金帳戶，券商對於交易的限制會更嚴格，避免發生違約交割的情況。而多數投資人會選擇融資（保證金）帳戶，使用合理的槓桿進行交易，當購買金額未超過帳上現金額度時，券商是不會向投資人收取融資利息的，但如果超過現金額度，就會針對券商公告的融資利率來收取利息。這些都可以在網站上查詢，或直接詢問中文客服，得到最立即的回應。


    表5是現金帳戶與融資（保證金）帳戶對於交割日與當沖的規範，要特別注意的是，如果開立的是現金帳戶，當帳上沒有現金、想要換股操作時，一定要等股票賣出後且資金交割完成才能再買進其他公司的股票，不然券商會暫時把帳戶停權，等待一段時間後才能恢復交易。


