    # 第 1 章


    # 台股很好，多一個資產配置選擇更好


    投資美股後，最常被問到 的問題是：投資台股不好嗎，為什麼會想要投資美股？


    台股當然有很多公司，但是當我開始投資美股之後，我認為美股市場真的是另外一個不一樣的世界，潛藏的商機無限，有太多值得探索的事物等待被發掘。就好比中華職棒晉升大聯盟、從台灣超級籃球聯賽（SBL）晉升到美國職業
    NBA 的殿堂一樣，面對更強勁的競爭對手，也感受到自身實力快速進步。


    # 熟悉的大品牌，最容易被了解的市場


    為什麼我認為每個人都該前進美股市場，在科技日新月異、靠一支手機就可以與世界接軌的時代，獲取資訊的能力大幅提升，有更多管道可以快速掌握公司動態。尤其美股市場是除了台股以外與我們最親近
    的市場，許多我們熟悉的大品牌都是美股的上市公司。'
  - '[PAGE 34]


    司，也讓我們更容易去研究。


    若以投資的角度來看，觀察近十年的股市表現，美股也是全世界最強的資本市場。以大盤指數的 ETF 報酬率來觀察，「標普五百指數 ETF」（美股代號 SPY）在過去十年，平均每年為投資人創造約十三%以上的報酬率，以科技股為主的纳斯达克指数
    (NASDAQ Composite Index，美股代號 IXIC) 更是每年創造十七%以上的報酬率，而台股的「元大台灣50」（交易代號0050）則每年創造約一○%的報酬率。台灣投資人為了避免將資金投入在單一市場，承擔政治或經濟情勢變化帶來的風險，將資金分散配置在國際市場，美股可說是最好的選擇！


    除此之外，美股市場還有許多其他國家股市沒有的優點，包括：


    一、美股是全世界最大的資本市場：由於美股是全世界最大的資本市場，吸引許多具有成長潛力的公司來掛牌。很多知名的新創公司都希望能夠美股上市，以爭取市場的關注度與投資人的青睞。除此之外，美股市場的交易量大，流動性非常妤，不管是想要做多或做空股票都不需要擔心沒有成交量，讓投資人的操作策略可以更加多元化。


    二、美股的監管嚴謹，保護投資人權益：美股的資本市場發展悠久，所以能夠提供給投資人的保護也更完備。像是美國證券業的最高機構「美國證券交易委員會」（U.S.'
  - '[PAGE 35]


    Securities and Exchange Commission, SEC）會負責監督市場，要求上市公司提交財報、大股東買賣申報等資訊揭露，維持市場效率與經濟的正常運行。


    三、投資商品選擇多元，策略調整相當彈性：美股的券商平台功能相當齊備，交易商品十分多元，只要一個帳戶就能買賣股票、ETF、債券、選擇權、期貨與外幣等資產。而且美股投資通常是採取保證金帳戶交易，用三○％的保證金便可以開始交易。而當你持有的資產市值超過帳戶裡的現金，則會自動開啟融資功能，滿足任何投資人的需求，讓資產配置達到最佳化。


    # 踏入美股市場，讓我看得更長遠


    除了帶來令人滿意的獲利這個好處外，研究美股為我帶來更大的附加價值，使我对於這個世界的變化變得更敏銳，在研究的過程中更能掌握趨勢的脈動，眼界變得更寬廣，看事情的角度也更全面與客觀。


    過去投資台股時，閱讀財報常常會需要「測字」，因為公司在供應商或客戶列表時常常使用A公司、B公司來代表，而不敢直接寫上對方的公司名稱。但這個問題在看美股財報時幾乎不會發生，通常財報上對於每個細節都相當清楚明瞭，投資人一看就能了'
  - '[PAGE 36]


    解整家公司的營運狀況。


    為什麼會有這個情況發生？主要原因就在於美股的上市公司幾乎是品牌大廠、平台公司，具有最強的競爭地位，當然什麼都敢攤在陽光下給大家看。例如蘋果公司每年都會公布供應商行名單，不是因為它握有訂單的主導權，可以決定要把訂單下給哪家公司，而接單的公司除非如台積電這樣具有難以超越的技術能力，也只能靠價格競爭來分食蘋果這塊大餅，營運上真的比較辛苦。


    此外，美股中有許多歷史悠久、營運良好的百年企業，這些公司擁有無法取代的商業模式，因此能在產業中長期占據了領導地位。例如寶僑（p&G）、美股代號PG）、3M（美股代號MMM）、可口可樂（Coco），美股代號KO）、耐克等公司，除了靠品牌優勢賺取穩定的收益與配發股息，為股東帶來豐厚的報酬，也持續地投入研發、創造新的商品與服務，帶來成長動能。


    美股中許多公司的研發能力都非常強，尤其是科技巨頭對於未來科技的投資更是不可遺余力，包括電動車與自動駕駛、人工智慧、金融科技、生物科技與雲端服務等領域，都有公司在美股中掛牌上市。


    針對看好的產業，投資人可以選擇明星個股來投資，例如電動汽車和太陽能板公司「特斯拉」（$TSLA$）、美股代號TSLA）、繪圖晶片大廠「輝達」（$NVDA$）、美股代號「特斯拉」（$TSLA$）、美股代號TSLA）、繪圖晶片大廠「輝達」（$NVDA$）、美股代號'
