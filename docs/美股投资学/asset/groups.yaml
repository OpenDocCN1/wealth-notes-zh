    # 反轉型態：頭部與底部判讀


    反轉型態的發生，對投資人來說是相當重要的訊號。股價在低檔建構反轉型態，有可能是基本面開始轉好，機構投資人開始偷偷買進，買盤支撐股價不再下探低點，也是股價即將止跌回升的訊號。這時候投資人可以關注股價的後續發展，一旦反轉確立便可以進場布局。


    反之，股價若是在高檔建構反轉型態，則是相當不利後續走勢的訊號。一檔股票經過一段強勢的上漲而來到高點，卻沒有持續的買盤支撐股價再創新高，反而有賣壓出籠，讓股價的波動開始加大，就要小心是否有人正在出貨，把股票倒給想要追高的投資人，最後套牢在高點。


    當趨勢延續一段時間，投資人若發現價格走勢開始大幅震盪，發生「高點不破、低點不破」的現象時，股價有可能正在醞釀反轉。這時投資人最好不要衝動進場，反而應該先觀察股價型態的變動，等待價格走勢確認後再採取行動也不遲。以下介紹常見的反轉型態，只要理解這些基本形態，再延伸至其他變形，就能更好地掌握股價趨勢。'
