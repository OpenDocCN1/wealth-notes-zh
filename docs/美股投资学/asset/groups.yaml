    路安全服務，像其他的雲端服務公司一樣線上化，透過雲端平台 Falcon 串聯筆記型電腦、桌上型電腦與伺服器多點運行，並藉由 AI 人工智慧更智能、更即時地檢測到威脅並阻止安全漏洞，幫助企業在面對網路安全問題時，可以更全面、更有效地進行防禦與管理。在全世界已經擁有超過五千四百三十一個訂閱戶，其中《財星》（Fortune）一百大公司裡就有一半是它的客戶。


    ### 財務狀況


    CrowdStrike 在二〇一九年六月公開上市，目前提供公開查詢的營運數據可追溯至二〇一七年。最近三年客戶數每年均有超過一倍的成長，表示 CrowdStrike
    所處的產業還在高速擴展階段，營收從二〇一七年的五千三百萬美元成長到二〇二〇年的四・八億美元，最近三年平均每年營收成長一〇八%（參表 30）。


    CrowdStrike 成長得愈快，累積的客戶愈多，可以蒐集到的病毒資料庫也就愈龐大。在這樣的情況下，公司的成本效率隨之提升，服務的即時性與全面性也更好，讓客戶愈來愈依賴公司，養出客戶的忠誠度。


    觀察 CrowdStrike 的獲利能力，毛利率從二〇一七年的三五．五％到二〇二〇年已成長到七○．六％，營業利潤率也從二〇一七年的負一七一．七％大幅提升至二〇二〇年的負三○．三％（參表
    31）。而二〇二〇年花在銷售與行銷的費用約二．六七億美元，占总營收的五五％，是最大一筆支出，如果再加上研究與開發、一般與行政的支出就已經透支了。現階段這個費用有可能還會成長，是影響獲利能力的關鍵（參表
    32）。


    如同雲端成長股 Docusign 的例子，CrowdStrike 的營收成長飛速，毛利率維持在七○％左右，但也因為處在高速擴張階段，必須支出大規模的營銷費用，使得公司目前還未開始獲利。


    接著觀察 CrowdStrike 的現金流量表（參表 33），二〇二〇年的營業現金流已從前一年流出兩千三百萬美元，變成擁有一億美元的現金流入，自由現金流也由負轉正，從二○一九年的負六千六百萬美元，到擁有一千兩百萬美元的自由現金流入。正現金流可以讓公司在未來的資本配置上更靈活，加上充沛的現金資產，流動比率為二．三八，負債比率更是趨近於零，對公司展望來說是相當良好的訊號。


