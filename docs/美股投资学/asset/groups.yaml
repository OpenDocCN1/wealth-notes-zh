    # 第19章


    # 打造最適合的投資組合


    在了解美股中的趨勢產業以及各類公司的分析方式後，回到本書一開始提到的問題：該如何將這些資產進行篩選與配置，打造一個穩健成長的投資組合？接下來就從最基本的資產配置開始，幫助你循序漸進地打造個人化的投資組合。


    # 了解自已，才能做好資產配置


    什麼是資產配置？就是將資金配置到多元資產類別，彼此之間的走勢呈現相反情況，具有負相關性，然後藉由不同標的的組合達到降低整體投資風險的目的。在這個過程中包含三個重要元素，分別是「時間」、「分散配置」與「風險承受能力」，投資人選擇投資標的時，也應該盡可能降低交易成本，並定期將投資組合調整回一開始設定的比例，這個過程稱為「再平衡」。'
  - '[PAGE 284]


    投資標的中可選擇的主要資產包括現金、股票、債券與不動產，如果投資組合過度集中在某個特定資產，當資產價格大幅波動時就會影響投資人的情緒，結果提早離開市場而錯失應得的利潤，這是多數投資人長期投資時最常面臨的重大阻礙。由於我們無法預測短期內會繼續上漲或下跌，因此要以獲取穩健合理的報酬為目標，規劃一個長期的投資計畫，時間才會變成你的朋友！


    在開始資產配置之前，先問自己下面幾個問題：


    # 一、你有多少時間可以花在投資研究上？


    首先問自己有多少時間可以理解一個產業，深入去研究公司，來規畫你的投資組合。一般投資人由於有本業收入，投資是增加額外財富的工具，如果希望在擁有工作的同時，透過儲蓄與投資來累積更多的退休金，讓老年的生活品質更好，可以選擇ETF作為主要配置。但是選擇做一位主動投資人，則一定需要有更多時間來投入，了解景氣的循環、盤勢的變化及個別公司的營運動向，才能做出最好的判斷。


    # 二、你能夠承受的損失有多大？


    風險承受度決定了我們的投資風格，以及應該配置在哪一種類型的資產上。積極型'
  - '[PAGE 285]


    投資人會將更多資產配置在風險較高的資產，以獲取更高的報酬；保守型投資人則會將風險降低，提高波動較小的資產比重，追求持續且穩定的收益。


    此外，進行資產配置是為了讓投資人在長期下獲得滿意的報酬，但短期內仍有可能碰到虧損狀態，因此投入到市場的資金必須是短期內不會動用到的，如此才有辦法長期持有，避免突發狀況導致被迫停損出場，無法達到累積資產的目標。


    # 三、你的長期目標是什麼？


    年齡決定了我們的投資期限。人一生中的每個階段都會有不同的優先選擇，投資目標也會跟著改變。試想一位正值壯年的投資人和一位屆臨退休的投資人，他們的投資組合怎麼會一樣呢？年輕人趁著還有高生產力的優勢，可以賺取更多的勞動收入，同時試著提高自己的投資風險承受度，打造更積極的投資組合；而年紀漸長的人重視穩定增值，將重心轉往現金流的組合。


    資產配置並不是一個固定公式，而是依照每個人不同的情況，包括年齡、資金規模與風險承受度等因素，綜合評估之後找到最適合自己的比例。因此進行投資之前，應該先了解自己的投資風格、目標報酬率與風險承受度，才有辦法打造最適合的投資組合。'
  - '[PAGE 286]


    # 股債配置比例


    最基本的資產配置，就是將資金分成「股票」與「債券」兩個部分。股票是風險性較高的資產，因此能獲得的報酬自然比固定收益型的債券商品更高。但債券的「固定收益」特性，使得它面對風險加大時具有保護作用，例如發生金融海嘯、疾病傳播、恐怖攻擊等無法預期的事件時，債券的價格會因為資金湧入而升高。


    有趣 的 是，當 市 場 一 片 樂 觀 時，沒 人 會 想 到 風 險，更 不 會 被 債 券 的 低 報 酬 率 所 吸 引，而 放 棄 令 人 垂 涎
    的 高 風 險、高 報 酬 資 產。既 然 風 險 無 法 預 期 與 避 免，我 們 在 風 平 浪 靜 時 就 應 該 先 做 準 備，時 時 保 有
    風 險 意 識，並 實 踐 在 自 己 的 投 資 決 策 裡。


    投 資 台 股 時，由 於 台 灣 的 避 險 工 具 較 不 盛 行，選 擇 性 也 較 少，所 以 往 往 無 法 達 到 最 有 效 的 資 產 配
    置。但 美 股 中 可 以 藉 由 債 券 E T F 的 配 置 來 避 險，包 括 政 府 公 債 E T F 與 綜 合 債 券 E T F。有 些
    投 資 人 會 配 置 高 收 益 債 券（俗 稱「垃 圾 債」），不 過 高 收 益 債 券 的 性 質 其 實 更 像 股 票，而 且 有 高 度 的
    違 約 風 險，不 適 合 作 為 固 定 收 益 與 避 險 資 產。


