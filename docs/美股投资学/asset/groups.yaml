    ## 尋找不被時代淘汰的王者


    擁有競爭優勢的公司可以在市場上持續獲利，並且為股東帶來超額報酬。除了前一章討論的公司以外，投資人還可以關注另一個族群，作為資產配置的選擇之一，那就是「股息成長股」。有投資台股的人要找到高殖利率的股票不難，但要找到像美股一樣，數十年來年年持續調高股息的公司幾乎沒有吧！股息成長股指一間公司除了配發股息給股東外，每年還會提高股息的金額，讓投資人除了享受股價上漲的資本利得，還可以累積股息的複利效果。舉例來說，蘋果公司
    2019 年每股發放 0.77 美元的股息，2020 年發放每股 0.82 美元的股息，較前一年成長了 6.5%。從 2016 至 2020 年這五年來看，蘋果公司每年都提高了股息金額，平均每年成長率約
    10%（參考表 14）。對股東來說，持有的成本價格是固定的，但每年的收益持續增加，總報酬率也提升。對我來說，股息就是一個「獲利優先」的概念，當你支付價格（即成本）買進一家公司的股票時，除非賣掉股票才能換回現金，但若是公司每年穩定地支付股息，等於讓你先把當初預付的錢領出來，逐步攤平成本。


    ## 圖 8 「標普五百股息貴族指數」成分股中的各行業占比


    ![](img/59586a9aa5c5e7f9004ef373947a8ffe_95_0.png)


    資料來源：S&P Global


    不過蘋果公司支付股息的時間並不長，不能稱為典型的股息成長股。美股中有許多股息逐年成長的好公司，甚至擁有超過五十年以上的股息支付紀錄，這些公司通常具備歷史悠久、營運穩定且現金充沛等特徵，不需要大筆的資本支出，就可以將賺來的現金以股息方式分配給股東。


    標準普爾在 1905 年五月推出了「標普五百股息貴族指數」（S&P 500 Dividend Aristocrats Index），將連續二十五年增加股息、市值超過三百億美元且平均成交量超過五百萬美元的公司納入成分股中，於每年一、四、七和十月進行重新調整。


    觀察股息貴族的行業組成，以工業類股的占比成分最大，其次是必需消費與基礎材料類股（參圖 8）。顯見如果想要著重在穩定的股息收益、不管景氣好壞都不會減少配息的公司的，通常是具有持續性需求的產業，股價走勢也相對平穩，近年股價成長飛速的科技股反而在指數中的佔比較低。


    如果想要投資組合配置股息成長股，可以參考 ProShares 的「標準五百股息貴族 ETF」（美股代號 NOBL），管理費僅 0.35%，只要投資這檔 ETF，就能直接持有所有股息成長貴族公司。


    對於個別公司的研究，在評估股息成長時看重的不會是公司的營收爆發力，而是「營收可預測性」、「獲利能力穩定」和「現金流量充沛」這三大特徵。這些特徵在股票族的成分股中顯而易見，主要都是具有持續性需求、但成長力道較弱的公司。以下就以股息連續成長五十七年的寶僑公司（Procter
    & Gamble，美股代號 PG）來說明。


    ## 股息成長續優股：寶僑


    寶僑成立於 1837 年，是全世界最大的消費品製造商，擁有 Tide（汰瀾）、Clairol（查爾明）、Pantene（潘婷）和 Pampers（幫寶適）等品牌，幾乎都是每天會使用到的生活用品，歸類為必需消費類股。


    必需消費類股受到景氣的影響較小，而且具備抗通膨的特性，不管經濟好壞都有一定的消費需求。價格會隨著時間而上漲，讓公司的營收相對於科技股等變化較大的產業更加穩定，股價穩定向上。


    ### 營收可預測性


    要了解寶僑的營收是否具備可預測性，先要了解影響公司的主要原因為何。必需消費類股的需求穩定，但最大的威脅就是市場競爭。市場競爭愈激烈，想要吸引消費者的方式就是打折拚戰，影響到的就是營收與獲利情況。


    想想看，就算平常習慣用 P 牌的洗衣精或衛生紙，如果今天突然 A 牌做促銷活動降價一百元，消費者很有可能就會被吸引去試用，甚至一試成主顧。所以必需消費類股的顧客忠誠度是比較低的，公司最好採用「機海戰術」，也就是不管買哪一種品牌，背後的母公司都是寶僑，這樣公司的營收才有成長的機會。


    從表 15 可以看到，寶僑的營收其實滿穩定，雖然近幾年因產業的競爭加劇而趨緩，但在公司積極整併與出清不賺錢的部門後，逐漸恢復成成長的軌道，成長率也開始提升。


