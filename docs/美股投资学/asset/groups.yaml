    # 結合基本面與技術面，一套完整的投資系統


    二〇二〇年在各國央行寬鬆的貨幣政策下，全球興起了一股投資熱潮。在資金氾濫的情況下，投資幾乎成為全民運動，人人對於投資知識的渴求，達到了前所未有的地步。在網路發展成熟、國際化環境的推動下，網飛、Uber、特斯拉等美國公司提供的產品和服務，早已融入每個人的生活中，使得美股不僅成為大家茶餘飯後討論的話題，更成為資產配置的最佳選擇，而Jenny
    的《美股投資學》在此時出版，可以說正是時候。'
  md: "\n# 美股投資學\n\n跟著 JC 錢進美股，  \n打造高速成長、穩健收息的投資組合，  \n擁抱世界財富\n\n財女Jenny 著\n\n# 投資美股，眼界更不同\n\
    \n**推薦人：Mr. Mark 市場先生**  \n財經作家\n\n幾年前我曾經和一家新加坡最大的券商主管交流，提到大多數的台灣人投資股票都是以台灣為主，我好奇地問他，新加坡人是不是也以投資新加坡股市為主？他說新加坡的券商看盤軟體，一登入看到的就是美股和全球市場。\n\
    \n雖然知道新加坡的股市規模本來就很小，加上他們做事很習慣都是考慮全球市場，但這個答案還是讓我很驚訝，因為這和我們在台灣的體驗完全不同。在臺灣，所有的券商看盤軟體一進去都是台股，一直到近兩年因美股投資人逐漸增加，券商才開始有推廣複委託的趨勢。\n\
    \n大多數投資人一開始對美股往往提不起興趣，原因不外乎是覺得英文不好懂，也不熟悉市場與規則。但如果我們登入券商看盤軟體看到的也都是美股市場，想必人們的認知會完全不同。\n\
    \n# 為何要投資美股市場？\n\n在講座或者網路社群上，我時常遇到讀者詢問：「市場先生，我可不可以只投資台灣股票、台灣的ETF就好？」\n\n踏出美股的第一步也許不容易，但只要你去詢問任何一個已經開始投資美股的人，他們一定會告訴你美股市場的許多好處。其中有兩個最重要的特性：\n\
    \n- **一、美股市場選擇性更多元：** 美國股市規模占全球約五○%，台灣則約二%。許多全球知名的品牌、最新技術的企業、各種好用的ETF，都能在美股市場中選擇交易。此外，台股市場中能保持連續十年成長的企業寥寥可數，但在美股市場則比比皆是。\n\
    - **二、美股市場資訊透明度較高：** 我和作者〔註〕一樣，看台股財報時也覺得是在看天書，台股財報看似什麼都有揭露，卻又什麼重點都沒說，你得自己從中抓重點。當然，往好處想是這樣就存在一些發掘潛在機會的條件，往壞處想則是你實際上並無法因此搞懂一家公司。但美股市場不僅揭露必要的資訊，財報上會主動把所有重點告訴你，包含一些巨大的變化、產業競爭狀況、公司的風險。讀過台股財報的人再去讀美股財報，一定會覺得如沐春風。\n\
    \n# 不單單了解財務數字\n\n我們都知道，過去績效不代表未來績效，企業過去的營運狀況不代表未來也會如此，每年的盈餘成長不代表未來一定也會成長。\n\n\
    因為財務數字只是呈現結果，唯有理解財務數字背後的原因，才能對未來變化做出相對合理的推測。只要讓企業獲利、成長的原因不變，未來就有比較大的可能性繼續獲利和成長。在這樣的基礎上，對公司的評價與估值才有意義，否則單純看過去財務數字對未來的分析，如同是看後照鏡開車。\n\
    \n而每家公司帶來獲利的原因都不同，觀察這些原因是否改變，需要觀察的重點也不同。《美股投資學》這本書透過許多案例，告訴讀者如何對企業做出分析與判斷。例如：臉書是觀察它的「活躍用戶數量成長」和「每位用戶平均帶來的廣告收入」；網飛是觀察它的「訂閱數增長」與「現金流變動」；近年轉型為訂閱制付費的Adobe，則是觀察它來自訂閱的「經常性收入」。\n\
    \n除了關鍵因子以外，也要理解企業風險、未來展望。外部因素也同樣要考量，包含上下游、競爭對手狀況，都會影響企業未來表現。\n\n# 一定有我們所不知道的事\n\
    \n即便我們對企業做足了功課，仍不代表我們有能力百分之百預測未來，只是把握相對增加了而已。\n\n再好的公司，一定都有股價表現不好的時候。有時是公司遇到暫時的逆風，有時是全市場氣氛都很低迷。實際上每間公司的特性都不一樣，我們要投資它的理由、信心和掌握程度都有所不同，適合操作的方式也不一樣。\n\
    \n有些公司即使股價暫時表現不好，在分析原因後你也依然有信心長期持有。但有些公司當初只因為某些資訊對它看好，一旦狀況有變，也應該適時停損出場，而非一味地堅持長期投資。\n\
    \n書中有一段話我很喜歡：「忽視反面意見，對投資人來說相當危險。我們不該總問自己『為什麼該買這家公司的股票』，而該問自己『為什麼不該買公司的股票』，如果真的想不到答案，這才表示你真的應該買它！」\n\
    \n本書十分值得一讀，書中介紹了美股基礎知識與常用工具，你可以感受到作者 Terry 的思考非常清晰有條理，期待你能從中有所收穫。\n\n# 推薦文：別讓錯過美股成爲遺憾\n\
    \n**推薦人：安納金**  \n(^一個投機者的告白實戰書^ 暢銷財經作家)\n\n在我一九九七年開始踏入國際金融市場之初，美國股市就是我第一個接觸到的市場，而且讓我大為驚豔！因為無論在產業深度或廣度以及可選擇的標的，美股都是目前全世界第一大市場，不可勝數的證券代碼，有些只有一個英文字母（例如「C」是花旗集團、「F」是福特汽車、「T」是AT&T、「V」是VISA），有些則多達五個字母，不像台股證券代碼是按照不同產業類別以數字編號。美股龐大而複雜的世界，讓第一次接觸到美股的我覺得好浪漫，但也很迷惑。\n\
    \n**# 適逢其時的一本書**\n\n在二十多年前，台灣人直接下單投資美股並不多見，當時市場上也很少有相關資訊教導我們如何直接開戶買賣美股，因此當時我和多數好友都選擇以海外基金的方式。然而對於許多我們鍾情的公司，例如蘋果、亞馬遜，看著它們不斷成長，這些公司的市值以數千倍到數萬倍以上的擴增幅度在全世界攻城掠地，心中難免惆悵。雖然成長於同一個時代，卻缺乏好的引路人教我們如何直接買進這些公司的股票，成為全世界最強企業的股東。\n\
    \n作者撰寫的這本書《美股投資學》，雖然對我的個人投資生涯而言來得太晚，但相較於絕大多數的股票投資人，卻適逢其時！茲以三個重點因素來說明。\n\n首先，這個時機恰好在道瓊工業指數突破三萬點大關、一個長期的重要里程碑，讓沒有參與過美股投資的人不得不正視這一塊大餅，並體認到美國\
    \ FAANG 等科技巨擘，終究是帶領全世界股市不斷創新高的成長動能核心所在。其次，有愈來愈多的投資人已經廣泛使用網路券商平台，因此直接開海外帳戶投資美股逐漸是一個新顯學（本書也會指導如何跨出第一步）。更重要的是，本書是以我們生活中最常接觸的食衣住行等行業、最容易被並掌握資訊的面向，作為投資美股的入門引導，對多數沒有直接下單買賣美股經驗的投資人來說，內容深度恰如其分！\n\
    \n**# 前進美股，等於放眼全世界**\n\n美國除了擁有最多、最具國際競爭力的大企業，其他各國的產業龍頭也都紛紛前往美國掛牌，例如台灣股市最大權值股「台積電」，很早就在美國掛牌\
    \ ADR（American Depository Receipts，在美國發行的存託憑證）。因此，學會如何前進美股，就等於放眼全世界！\n\n在全球投資理財路上，我太晚學會直接開戶投資美股，這是我的一大缺憾，但此時拿起《美股投資學》這本書的您不會有這個遺憾。我誠摯推薦給每一位想要前進美股、前進全世界的台灣投資人。\n\
    \n願善良、紀律、智慧與你我同在！\n\n# 推薦文：用美股輕鬆實現價值投資\n\n**推薦人：阿格力（許凱迪）**  \n台股生活投資領航者\n\n阿格力是台股生活投資的領航者，從美股市場淬煉出一套適合散戶的生活美股投資學，因此我們的相識可說是從「生活投資」出現交集及緣分。二〇二〇年開始，我經常邀請阿格力到我主持的財經節目《投資最給力》暢談美股投資經驗，從總經談到趨勢，再從趨勢挖掘出更多美股投資機會。在經過三月份的崩盤洗禮後，阿格力的投資風格及策略變得更加全面，而這些好康都在《美股投資學》中毫不藏私的一○○%分享。\n\
    \n**# 投資美股沒有想像中困難**\n\n若提到美股投資最大的心魔，大家最害怕的肯定就是「菜」英文，認為沒有很厲害的英文能力就無法投資美股。但其實阿格力在書中列出了具中文客服的券商可供選擇，投資並沒有想像中那麼困難，只要了解幾個遊戲規則就能啟動你的美股投資計畫。大家回想台股投資或學習的經驗，一開始不也從市場的交易時間、單位及交割規則開始學嗎？接著進入市場體驗投資的美好，並運用各種財經書籍慢慢精進自我。\n\
    \n**# 直擊痛點，投資不再無所適從**\n\n多數人大量閱讀財經書籍，通常看完就會忘記或只是比賽看書看了幾本的「解成就」，甚至某些時候過量閱讀反而影響投資思緒。特別的是，阿格力閱讀量雖然高於常人不少，卻總能將其中的精髓重點運用於投資上，藉由不斷吸收大師鉅作而調整投資策略。因此看到這本書的讀者們相當幸福，看似只是閱讀一本書，實際上早已將數以百計的經典結合於各個章節中了。\n\
    \n例如書中提到什麼時候該和股票斷捨離？就引用《紀律的交易者》（The Disciplined Trader）所提到：「在交易市場中不要成為一個被動的輸家，而是要掌握大局採取主動。」她不僅分享書籍的經典，也同時巧妙結合自身的觀點，如果你也曾經拜讀相關書籍，肯定時常在閱讀時會心一笑。\n\
    \n而投資美股的另一個迷思，就是認為台股與美股是不同市場，也必須研擬不同的投資策略來因應。但具有兩個市場實戰經驗的投資人肯定知道，其實無論市場怎麼改變，投資策略及邏輯都是相通的。例如公司營運就是看基本面和財報數字，而進出場則需參考技術面輔助研判，甚至產業趨勢也是需要特別注意的重點。\n\
    \n再提一個更直接的痛點，大家都知道投資美股的好康，但問到如何更深研究個股，往往僅停留在「公司很不錯」的表面階段，接著偶爾看看新聞即不再另行研究。如此缺乏完整性的投資架構其實相當高風險，除了沒有即時性也不全面，就算投資人想認真研究，卻容易因為資訊爆炸而無所適從。\n\
    \n以上臚列的美股投資議題僅僅是冰山一角，書中提到更多實際投資才會遇到的情境及解法，相信無論老手或新手都能得到不少收穫。此外，用了一章的篇幅談論生活選股，找出食、衣、住、行等相關類股，並結合產業面、基本面及未來展望等角度切入剖析，絕對能讓讀者對美股有截然不同的認識。\n\
    \n# 推薦文：一本帶你入寶山的武功祕笈\n\n**推薦人：華倫老師**  \n（《華倫老師存股系列》、《對股票存千萬》作者）\n\n回想二十年前我初入股票市場時，認為股價波動是一個有生命的東西，相信自己可以抓住每一個股價波動，創造利潤。殊不知這是魔鬼在吹門徒，讓自己愈陷愈深於投機的零和遊戲當中。故事的結局就是幾乎賠光了所有的積蓄，直到我知道了股神華倫・巴菲特（Warren\
    \ Buffett）。\n\n我將巴菲特價值投資的精神運用在臺灣股市當中，開始研究公司基本面，研讀公司財務報表，了解公司未來成長的潛力，以及公司的競爭對手和可能遇到的風險。我從投機到投資，從流浪教師到華倫老師，經過十五年的長期投資，達到財富自由的目標。\n\
    \n但是多年來，我的投資僅局限於台股，對全美國股市這個世界最大的經濟體一知半解，也由於語言和交易制度甚至換匯的問題，總讓我覺得麻煩，甚至不得其門而入。\n\n\
    當我看到「J C 財經觀點」版主 Jere 所撰寫的《美股投資學》，我才對美國股票市場有一個完整的輪廓和方向，於是迫不及待想要推薦給大家了。\n\n巴菲特說他出生在美國而不是阿富汗就像是中樂透一樣，一九四二年四月，當時巴菲特十一歲，他買了人生第一檔股票，當時道瓊工業指數是一百點，現在已經三萬點（2020年十一月二十五日收盤為三○一四點）；如果你在一九四二年到美股市場，投入一百萬美元於標普五百指數基金，那麼七十七年後將增值為五十三億美元。巴菲特認為，他和波克夏·哈薩威（Berkshire\
    \ Hathaway）的成功只是美國經濟不斷成長下的產物，這沒什麼好驕傲。\n\n**# 書中自有黃金屋**\n\n誠如 Gary 說的，台股雖然很好，但多一個資產配置的選擇會更好，就好比從台灣的超級籃球聯賽晉升到美國\
    \ NBA 的殿堂一樣。美國股票市場有太多國際化且大家耳熟能詳的大公司，分布在食、衣、住、行、育、樂等各種不同產業中，像蘋果、臉書、Alphabet（Google\
    \ 母公司）、亞馬遜、耐克、特斯拉．．．．．．等等，我們要成為這些大企業的股東，就必須要進入美股市場。\n\n經由 Jony 的介紹，就算您像我一樣對美股是一張白紙，也能經由本書從開戶、到稅務、到公司財報研究得到完整資訊，甚至可以經由許多免費網站更深入了解公司的基本面。此外，《1013》也介紹了美國主要指數的種類，還有個股的分類，提供許多美國指數型基金ETF的資料及過去的績效表現，更不容於介紹許多優質美國公司股票，不管是穩定成長股還是高股息概念股，絕對會讓讀者有入寶山的感覺。\n\
    \n「書中自有黃金屋」，指的就是這本書了，它不但是進入美國股市的入門書，也是一本工具書，更是您財富累積的武功祕笈。廢話不多說，建議大家趕快收藏囉！\n\n\
    # 推薦文：美股新手進入市場的敲門磚\n\n**推薦人：資心理人**  \n理財部落格\n\n近幾年隨著網路的便利，以前覺得遙不可及的美股市場，現在只要開通海外券商，或者是使用台灣券商的複委託功能，即可開始投資美股。而美股市場非常龐大，有許多強大的跨國公司可以投資，例如星巴克、麥當勞、Google\
    \ 等等，不管你是哪種類型的投資人，都可以在美股市場找到適合自己的投資標的，也不用像在台股市場一樣，要去猜哪家公司可以打進蘋果的供應鏈、哪家公司是特斯拉概念股，直接就能投資蘋果或特斯拉的股票。\n\
    \n而且美國因為股市發展已久，監管嚴謹，美國證券交易委員會負責監督市場，確保投資人能夠在市場上獲得應有的資訊，在遭受損失時（例如券商疏失）也能夠獲得應有的保護。\n\
    \n**# 看見更廣闊的投資世界**\n\n感謝出版社出版了這本《美股投資學》，書中用淺顯易懂的表格與資料，帶領大家了解一些在臺灣耳熟能詳的美股標的，進而能夠理解如何分析與思考投資的標的是否值得買進持有，以及一些好公司是如何成長並帶動股價上漲，他們又有什麼樣的護城河及競爭優勢得以保有在市場的領先地位。\n\
    \n如果是喜歡領股息投資人，[www]也介紹了哪些公司的股息是持續成長，並評估這些公司如何能夠細水長流地穩定配發股息。如果是指數型投資人，從書中也能找到許多低成本的\
    \ ETF 投資工具，讓你投資標普五百指數或歐洲美洲市場，甚至直接投資全球市場。更重要的是，作者會讓你知道為何低成本那麼重要，因為要知道同樣投資一個指數（例如標普五百），如果基金公司收取的內扣費用愈多，投資人拿到的報酬就會愈少，逐年累積下來的差距會非常可觀，而因為美股市場夠龐大且成熟，所以有非常多低成本\
    \ ETF 可供選擇。\n\n書末對於投資人如何保有正確的投資心態也做了精彩論述，許多很棒的觀點值得參考。要知道，有正確的投資觀念，比去找什麼聖杯投資標的更重要，能夠在市場上長期存活才是贏家，而在市場上要能長期持盈保泰，有正確的投資心態與觀念才是關鍵，知道自己的風險承受程度，正確地進行資產配置（例如現金、黃金、債券之類的配置），可以讓你不會隨著市場情緒追高殺低，做出錯誤的決策，穩定累積資產，享受市場帶來豐厚報酬。\n\
    \n祝福閱讀此書的朋友皆能夠建立正確的投資觀念，選擇適當的投資標的，成為人生贏家。\n\n# 推薦文：做個優游自得的投資人\n\n**推薦人：雷浩斯** \
    \ \n價值投資者、財經作家\n\n會認識\\[\\_\\_\\]，是因為我的醫生朋友說：「有個\\[\\_\\_\\]財經觀點\\[\\_\\_\\]粉絲頁文章很棒，推薦你看。』我就搜尋這個粉絲頁，並花很多時間看文章，發現內容非常豐富，其中一篇探討巴菲特買股票和收購公司的差異，這個主題正好我剛研究完畢，於是我留了言。\n\
    \n隔天，\\[\\_\\_\\]就發訊息和我聊了起來。我們很聊得來，後來他們夫妻倆還請我吃飯（請我吃飯很不划算，因為我吃不多），我們很快就變成很好的朋友，因為我們都是投資人和愛書人，投資和閱讀的風格都很接近，共同話題當然不少。\n\
    \n**# 英雄所見略同**\n\n\\[\\_\\_\\]讓一般讀者印象最深刻的，是她驚人的閱讀量和文章寫作量。我自認是個閱讀機器，讀書量不會輸給任何人，唯一讓我直接認輸的人就是她。有寫過文章的人都知道，能夠快速且有效地閱讀和產出文章並不容易，以「1」的寫作量來說，我還沒看過比她行的，輸給她完全不去臉。\n\
    \n閱讀是「2」，寫作是「0.999」，從這兩點可以看出，個人聰明，但是要看出有沒有深入思考，則是要看他所問的問題。\n\n有一次她「」問我：「為什麼巴菲特不買耐吉，這完全符合他的標準啊？」「我也有一樣的問題，只是從來沒人跟我討論過。這個問題重要的點在於大多數人只會重複敘述巴菲特持股，很少有人找到符合巴菲特標準卻還沒買投資標的。\n\
    \n我當時回她：「也許是因為反壟斷法的關係，因為波克夏旗下也有跑鞋公司。」但耐吉是一家很棒的公司，我讀過耐吉創辦人的自傳，很喜歡這個創辦人，自己也穿耐吉的鞋子。只是我沒開美股戶頭，所以沒辦法買耐吉的股票。當耐吉股價下跌時，我買了它的代工廠「豐泰」，這檔持股讓我獲利頗豐。後來我才知道，「」買入耐吉公司股票的時間點和我買入豐泰的時間點差不多，當真是奇妙的巧合和判斷。\n\
    \n而後我舉辦了許多網聚活動和年度聚會，「」總是非常捧場，有時候擔任講者，有時候以 VIP 的身份參與。我的粉絲們也百分之百樂於看到她，她總像個鄰家女孩一樣樂於分享所知，就像《美股投資學》這本書的內容一樣。\n\
    \n**# 讓投資美股變簡單**\n\n我沒有投資美股的主要原因是對資訊取得與了解太少，這也是許多投資人會遇到的問題。但現在投資市場的環境已經大幅度改善，投資美股的方式變得簡單許多，你可能會遇到的問題像是券商開戶、海外稅務、主要的美國企業介紹．．．．．．等等，都能在這本書裡看到。\n\
    \n本書更提供了許多美股公司財務分析個案，有我熟悉的Agile。（我可是忠實用戶），也有我不熟悉的商業模式（例如使用訂閱制的公司，該注意的財務指標及計算公式），還提供了基本面投資人該知道的各種財報說明，例如10｜K、10｜Q以及很多投資人都會看的13\
    \ F。這些介紹大幅降低了投資人搜尋知識的時間成本，包含我在內！如果之後開美股戶頭，必定會讓這本書出現在我的桌上。（^順便一提，如果我開戶應該會買波克夏、耐克和蘋果公司，畢竟我們要買你所買、買你所愛。）\n\
    \n美股和台股當然有差別點，但是也有共同點，很多人的想法會卡在在其中一端，有些人則不會。想要了解一個人是否具備非凡的腦袋，就要看也能否在兩種不同的看法中優游自得的，而Gus就是這種人，你也可以成為這種人。\n\
    \n投資美股，請由本書開始，除了充沛的知識之外，你還可以得到投資的樂趣。\n\n# 開闊視野的投資之作\n\n**推薦人：Jay Chiaoo**  \n\
    JC Capital 執行長\n\n在自媒体逐渐兴盛的年代，二〇一六年，我们成立了「JC财经观点」。\n\n当初的想法，是经由介绍国外的经典投资著作、最新的财经出版物、报章杂志的优质内容和即时的财经趋势，撰写成文章心得，藉此达到推广阅读、传达正确投资观念的目的。\n\
    \n还记得当初瑞·达利欧（Ray Dalio）的钜著《原则》(Principles) 在亚马逊逢上架三天，Tom 就已经读完原文，同时完成了三篇心得。在国内还没有中译本的情况下，能领先把最新资讯和知识传达给读者、开拓投资人的视野，便是我们的初衷。而当时《原则》的心得，也為我們的網站注入不少流量，使「JC財經觀點」扎穩了根基，也讓Jenny更有信心地朝這樣的目標前進。\n\
    \n在《原則》之後，Jenny、又陸續介紹了保羅·桑金（Paul D. Soren）和保羅·喬森（Paul Johansson）合著的《哥倫比亞商學院必修投資課》（Pitch\
    \ the Perfect investment）、席拉·寇哈特卡（Sheela Koultekar）的《黑色優勢》（Black Edge）等書。由於翻譯整本書要花相當長的時間，Jenny讀完原文後，透過羅列重點、提出觀點的方式解析作品，受到愈來愈多讀者的肯定，也使得粉絲團按讚人數逐步成長，網站更是累積了數百篇心得文章。而將書本中的觀念融入實戰投資這樣的風格，也成為了JC財經觀點獨有的特色。\n\
    \n**# 結合基本面與技術面，一套完整的投資系統**\n\n二〇二〇年在各國央行寬鬆的貨幣政策下，全球興起了一股投資熱潮。在資金氾濫的情況下，投資幾乎成為全民運動，人人對於投資知識的渴求，達到了前所未有的地步。在網路發展成熟、國際化環境的推動下，網飛、Uber、特斯拉等美國公司提供的產品和服務，早已融入每個人的生活中，使得美股不僅成為大家茶餘飯後討論的話題，更成為資產配置的最佳選擇，而Jenny\
    \ 的《美股投資學》在此時出版，可以說正是時候。\n"
  mdcn: "\n# 美股投資學\n\n跟著 JC 錢進美股，  \n打造高速成長、穩健收息的投資組合，  \n擁抱世界財富\n\n財女Jenny 著\n\n\
    # 投資美股，眼界更不同\n\n**推薦人：Mr. Mark 市場先生**  \n財經作家\n\n幾年前我曾經和一家新加坡最大的券商主管交流，提到大多數的台灣人投資股票都是以台灣為主，我好奇地問他，新加坡人是不是也以投資新加坡股市為主？他說新加坡的券商看盤軟體，一登入看到的就是美股和全球市場。\n\
    \n雖然知道新加坡的股市規模本來就很小，加上他們做事很習慣都是考慮全球市場，但這個答案還是讓我很驚訝，因為這和我們在台灣的體驗完全不同。在臺灣，所有的券商看盤軟體一進去都是台股，一直到近兩年因美股投資人逐漸增加，券商才開始有推廣複委託的趨勢。\n\
    \n大多數投資人一開始對美股往往提不起興趣，原因不外乎是覺得英文不好懂，也不熟悉市場與規則。但如果我們登入券商看盤軟體看到的也都是美股市場，想必人們的認知會完全不同。\n\
    \n# 為何要投資美股市場？\n\n在講座或者網路社群上，我時常遇到讀者詢問：「市場先生，我可不可以只投資台灣股票、台灣的ETF就好？」\n\n踏出美股的第一步也許不容易，但只要你去詢問任何一個已經開始投資美股的人，他們一定會告訴你美股市場的許多好處。其中有兩個最重要的特性：\n\
    \n- **一、美股市場選擇性更多元：** 美國股市規模占全球約五○%，台灣則約二%。許多全球知名的品牌、最新技術的企業、各種好用的ETF，都能在美股市場中選擇交易。此外，台股市場中能保持連續十年成長的企業寥寥可數，但在美股市場則比比皆是。\n\
    - **二、美股市場資訊透明度較高：** 我和作者〔註〕一樣，看台股財報時也覺得是在看天書，台股財報看似什麼都有揭露，卻又什麼重點都沒說，你得自己從中抓重點。當然，往好處想是這樣就存在一些發掘潛在機會的條件，往壞處想則是你實際上並無法因此搞懂一家公司。但美股市場不僅揭露必要的資訊，財報上會主動把所有重點告訴你，包含一些巨大的變化、產業競爭狀況、公司的風險。讀過台股財報的人再去讀美股財報，一定會覺得如沐春風。\n\
    \n# 不單單了解財務數字\n\n我們都知道，過去績效不代表未來績效，企業過去的營運狀況不代表未來也會如此，每年的盈餘成長不代表未來一定也會成長。\n\n\
    因為財務數字只是呈現結果，唯有理解財務數字背後的原因，才能對未來變化做出相對合理的推測。只要讓企業獲利、成長的原因不變，未來就有比較大的可能性繼續獲利和成長。在這樣的基礎上，對公司的評價與估值才有意義，否則單純看過去財務數字對未來的分析，如同是看後照鏡開車。\n\
    \n而每家公司帶來獲利的原因都不同，觀察這些原因是否改變，需要觀察的重點也不同。《美股投資學》這本書透過許多案例，告訴讀者如何對企業做出分析與判斷。例如：臉書是觀察它的「活躍用戶數量成長」和「每位用戶平均帶來的廣告收入」；網飛是觀察它的「訂閱數增長」與「現金流變動」；近年轉型為訂閱制付費的Adobe，則是觀察它來自訂閱的「經常性收入」。\n\
    \n除了關鍵因子以外，也要理解企業風險、未來展望。外部因素也同樣要考量，包含上下游、競爭對手狀況，都會影響企業未來表現。\n\n# 一定有我們所不知道的事\n\
    \n即便我們對企業做足了功課，仍不代表我們有能力百分之百預測未來，只是把握相對增加了而已。\n\n再好的公司，一定都有股價表現不好的時候。有時是公司遇到暫時的逆風，有時是全市場氣氛都很低迷。實際上每間公司的特性都不一樣，我們要投資它的理由、信心和掌握程度都有所不同，適合操作的方式也不一樣。\n\
    \n有些公司即使股價暫時表現不好，在分析原因後你也依然有信心長期持有。但有些公司當初只因為某些資訊對它看好，一旦狀況有變，也應該適時停損出場，而非一味地堅持長期投資。\n\
    \n書中有一段話我很喜歡：「忽視反面意見，對投資人來說相當危險。我們不該總問自己『為什麼該買這家公司的股票』，而該問自己『為什麼不該買公司的股票』，如果真的想不到答案，這才表示你真的應該買它！」\n\
    \n本書十分值得一讀，書中介紹了美股基礎知識與常用工具，你可以感受到作者 Terry 的思考非常清晰有條理，期待你能從中有所收穫。\n\n# 推薦文：別讓錯過美股成爲遺憾\n\
    \n**推薦人：安納金**  \n(^一個投機者的告白實戰書^ 暢銷財經作家)\n\n在我一九九七年開始踏入國際金融市場之初，美國股市就是我第一個接觸到的市場，而且讓我大為驚豔！因為無論在產業深度或廣度以及可選擇的標的，美股都是目前全世界第一大市場，不可勝數的證券代碼，有些只有一個英文字母（例如「C」是花旗集團、「F」是福特汽車、「T」是AT&T、「V」是VISA），有些則多達五個字母，不像台股證券代碼是按照不同產業類別以數字編號。美股龐大而複雜的世界，讓第一次接觸到美股的我覺得好浪漫，但也很迷惑。\n\
    \n**# 適逢其時的一本書**\n\n在二十多年前，台灣人直接下單投資美股並不多見，當時市場上也很少有相關資訊教導我們如何直接開戶買賣美股，因此當時我和多數好友都選擇以海外基金的方式。然而對於許多我們鍾情的公司，例如蘋果、亞馬遜，看著它們不斷成長，這些公司的市值以數千倍到數萬倍以上的擴增幅度在全世界攻城掠地，心中難免惆悵。雖然成長於同一個時代，卻缺乏好的引路人教我們如何直接買進這些公司的股票，成為全世界最強企業的股東。\n\
    \n作者撰寫的這本書《美股投資學》，雖然對我的個人投資生涯而言來得太晚，但相較於絕大多數的股票投資人，卻適逢其時！茲以三個重點因素來說明。\n\n首先，這個時機恰好在道瓊工業指數突破三萬點大關、一個長期的重要里程碑，讓沒有參與過美股投資的人不得不正視這一塊大餅，並體認到美國\
    \ FAANG 等科技巨擘，終究是帶領全世界股市不斷創新高的成長動能核心所在。其次，有愈來愈多的投資人已經廣泛使用網路券商平台，因此直接開海外帳戶投資美股逐漸是一個新顯學（本書也會指導如何跨出第一步）。更重要的是，本書是以我們生活中最常接觸的食衣住行等行業、最容易被並掌握資訊的面向，作為投資美股的入門引導，對多數沒有直接下單買賣美股經驗的投資人來說，內容深度恰如其分！\n\
    \n**# 前進美股，等於放眼全世界**\n\n美國除了擁有最多、最具國際競爭力的大企業，其他各國的產業龍頭也都紛紛前往美國掛牌，例如台灣股市最大權值股「台積電」，很早就在美國掛牌\
    \ ADR（American Depository Receipts，在美國發行的存託憑證）。因此，學會如何前進美股，就等於放眼全世界！\n\n在全球投資理財路上，我太晚學會直接開戶投資美股，這是我的一大缺憾，但此時拿起《美股投資學》這本書的您不會有這個遺憾。我誠摯推薦給每一位想要前進美股、前進全世界的台灣投資人。\n\
    \n願善良、紀律、智慧與你我同在！\n\n# 推薦文：用美股輕鬆實現價值投資\n\n**推薦人：阿格力（許凱迪）**  \n台股生活投資領航者\n\n阿格力是台股生活投資的領航者，從美股市場淬煉出一套適合散戶的生活美股投資學，因此我們的相識可說是從「生活投資」出現交集及緣分。二〇二〇年開始，我經常邀請阿格力到我主持的財經節目《投資最給力》暢談美股投資經驗，從總經談到趨勢，再從趨勢挖掘出更多美股投資機會。在經過三月份的崩盤洗禮後，阿格力的投資風格及策略變得更加全面，而這些好康都在《美股投資學》中毫不藏私的一○○%分享。\n\
    \n**# 投資美股沒有想像中困難**\n\n若提到美股投資最大的心魔，大家最害怕的肯定就是「菜」英文，認為沒有很厲害的英文能力就無法投資美股。但其實阿格力在書中列出了具中文客服的券商可供選擇，投資並沒有想像中那麼困難，只要了解幾個遊戲規則就能啟動你的美股投資計畫。大家回想台股投資或學習的經驗，一開始不也從市場的交易時間、單位及交割規則開始學嗎？接著進入市場體驗投資的美好，並運用各種財經書籍慢慢精進自我。\n\
    \n**# 直擊痛點，投資不再無所適從**\n\n多數人大量閱讀財經書籍，通常看完就會忘記或只是比賽看書看了幾本的「解成就」，甚至某些時候過量閱讀反而影響投資思緒。特別的是，阿格力閱讀量雖然高於常人不少，卻總能將其中的精髓重點運用於投資上，藉由不斷吸收大師鉅作而調整投資策略。因此看到這本書的讀者們相當幸福，看似只是閱讀一本書，實際上早已將數以百計的經典結合於各個章節中了。\n\
    \n例如書中提到什麼時候該和股票斷捨離？就引用《紀律的交易者》（The Disciplined Trader）所提到：「在交易市場中不要成為一個被動的輸家，而是要掌握大局採取主動。」她不僅分享書籍的經典，也同時巧妙結合自身的觀點，如果你也曾經拜讀相關書籍，肯定時常在閱讀時會心一笑。\n\
    \n而投資美股的另一個迷思，就是認為台股與美股是不同市場，也必須研擬不同的投資策略來因應。但具有兩個市場實戰經驗的投資人肯定知道，其實無論市場怎麼改變，投資策略及邏輯都是相通的。例如公司營運就是看基本面和財報數字，而進出場則需參考技術面輔助研判，甚至產業趨勢也是需要特別注意的重點。\n\
    \n再提一個更直接的痛點，大家都知道投資美股的好康，但問到如何更深研究個股，往往僅停留在「公司很不錯」的表面階段，接著偶爾看看新聞即不再另行研究。如此缺乏完整性的投資架構其實相當高風險，除了沒有即時性也不全面，就算投資人想認真研究，卻容易因為資訊爆炸而無所適從。\n\
    \n以上臚列的美股投資議題僅僅是冰山一角，書中提到更多實際投資才會遇到的情境及解法，相信無論老手或新手都能得到不少收穫。此外，用了一章的篇幅談論生活選股，找出食、衣、住、行等相關類股，並結合產業面、基本面及未來展望等角度切入剖析，絕對能讓讀者對美股有截然不同的認識。\n\
    \n# 推薦文：一本帶你入寶山的武功祕笈\n\n**推薦人：華倫老師**  \n（《華倫老師存股系列》、《對股票存千萬》作者）\n\n回想二十年前我初入股票市場時，認為股價波動是一個有生命的東西，相信自己可以抓住每一個股價波動，創造利潤。殊不知這是魔鬼在吹門徒，讓自己愈陷愈深於投機的零和遊戲當中。故事的結局就是幾乎賠光了所有的積蓄，直到我知道了股神華倫・巴菲特（Warren\
    \ Buffett）。\n\n我將巴菲特價值投資的精神運用在臺灣股市當中，開始研究公司基本面，研讀公司財務報表，了解公司未來成長的潛力，以及公司的競爭對手和可能遇到的風險。我從投機到投資，從流浪教師到華倫老師，經過十五年的長期投資，達到財富自由的目標。\n\
    \n但是多年來，我的投資僅局限於台股，對全美國股市這個世界最大的經濟體一知半解，也由於語言和交易制度甚至換匯的問題，總讓我覺得麻煩，甚至不得其門而入。\n\n\
    當我看到「J C 財經觀點」版主 Jere 所撰寫的《美股投資學》，我才對美國股票市場有一個完整的輪廓和方向，於是迫不及待想要推薦給大家了。\n\n巴菲特說他出生在美國而不是阿富汗就像是中樂透一樣，一九四二年四月，當時巴菲特十一歲，他買了人生第一檔股票，當時道瓊工業指數是一百點，現在已經三萬點（2020年十一月二十五日收盤為三○一四點）；如果你在一九四二年到美股市場，投入一百萬美元於標普五百指數基金，那麼七十七年後將增值為五十三億美元。巴菲特認為，他和波克夏·哈薩威（Berkshire\
    \ Hathaway）的成功只是美國經濟不斷成長下的產物，這沒什麼好驕傲。\n\n**# 書中自有黃金屋**\n\n誠如 Gary 說的，台股雖然很好，但多一個資產配置的選擇會更好，就好比從台灣的超級籃球聯賽晉升到美國\
    \ NBA 的殿堂一樣。美國股票市場有太多國際化且大家耳熟能詳的大公司，分布在食、衣、住、行、育、樂等各種不同產業中，像蘋果、臉書、Alphabet（Google\
    \ 母公司）、亞馬遜、耐克、特斯拉．．．．．．等等，我們要成為這些大企業的股東，就必須要進入美股市場。\n\n經由 Jony 的介紹，就算您像我一樣對美股是一張白紙，也能經由本書從開戶、到稅務、到公司財報研究得到完整資訊，甚至可以經由許多免費網站更深入了解公司的基本面。此外，《1013》也介紹了美國主要指數的種類，還有個股的分類，提供許多美國指數型基金ETF的資料及過去的績效表現，更不容於介紹許多優質美國公司股票，不管是穩定成長股還是高股息概念股，絕對會讓讀者有入寶山的感覺。\n\
    \n「書中自有黃金屋」，指的就是這本書了，它不但是進入美國股市的入門書，也是一本工具書，更是您財富累積的武功祕笈。廢話不多說，建議大家趕快收藏囉！\n\n\
    # 推薦文：美股新手進入市場的敲門磚\n\n**推薦人：資心理人**  \n理財部落格\n\n近幾年隨著網路的便利，以前覺得遙不可及的美股市場，現在只要開通海外券商，或者是使用台灣券商的複委託功能，即可開始投資美股。而美股市場非常龐大，有許多強大的跨國公司可以投資，例如星巴克、麥當勞、Google\
    \ 等等，不管你是哪種類型的投資人，都可以在美股市場找到適合自己的投資標的，也不用像在台股市場一樣，要去猜哪家公司可以打進蘋果的供應鏈、哪家公司是特斯拉概念股，直接就能投資蘋果或特斯拉的股票。\n\
    \n而且美國因為股市發展已久，監管嚴謹，美國證券交易委員會負責監督市場，確保投資人能夠在市場上獲得應有的資訊，在遭受損失時（例如券商疏失）也能夠獲得應有的保護。\n\
    \n**# 看見更廣闊的投資世界**\n\n感謝出版社出版了這本《美股投資學》，書中用淺顯易懂的表格與資料，帶領大家了解一些在臺灣耳熟能詳的美股標的，進而能夠理解如何分析與思考投資的標的是否值得買進持有，以及一些好公司是如何成長並帶動股價上漲，他們又有什麼樣的護城河及競爭優勢得以保有在市場的領先地位。\n\
    \n如果是喜歡領股息投資人，[www]也介紹了哪些公司的股息是持續成長，並評估這些公司如何能夠細水長流地穩定配發股息。如果是指數型投資人，從書中也能找到許多低成本的\
    \ ETF 投資工具，讓你投資標普五百指數或歐洲美洲市場，甚至直接投資全球市場。更重要的是，作者會讓你知道為何低成本那麼重要，因為要知道同樣投資一個指數（例如標普五百），如果基金公司收取的內扣費用愈多，投資人拿到的報酬就會愈少，逐年累積下來的差距會非常可觀，而因為美股市場夠龐大且成熟，所以有非常多低成本\
    \ ETF 可供選擇。\n\n書末對於投資人如何保有正確的投資心態也做了精彩論述，許多很棒的觀點值得參考。要知道，有正確的投資觀念，比去找什麼聖杯投資標的更重要，能夠在市場上長期存活才是贏家，而在市場上要能長期持盈保泰，有正確的投資心態與觀念才是關鍵，知道自己的風險承受程度，正確地進行資產配置（例如現金、黃金、債券之類的配置），可以讓你不會隨著市場情緒追高殺低，做出錯誤的決策，穩定累積資產，享受市場帶來豐厚報酬。\n\
    \n祝福閱讀此書的朋友皆能夠建立正確的投資觀念，選擇適當的投資標的，成為人生贏家。\n\n# 推薦文：做個優游自得的投資人\n\n**推薦人：雷浩斯** \
    \ \n價值投資者、財經作家\n\n會認識\\[\\_\\_\\]，是因為我的醫生朋友說：「有個\\[\\_\\_\\]財經觀點\\[\\_\\_\\]粉絲頁文章很棒，推薦你看。』我就搜尋這個粉絲頁，並花很多時間看文章，發現內容非常豐富，其中一篇探討巴菲特買股票和收購公司的差異，這個主題正好我剛研究完畢，於是我留了言。\n\
    \n隔天，\\[\\_\\_\\]就發訊息和我聊了起來。我們很聊得來，後來他們夫妻倆還請我吃飯（請我吃飯很不划算，因為我吃不多），我們很快就變成很好的朋友，因為我們都是投資人和愛書人，投資和閱讀的風格都很接近，共同話題當然不少。\n\
    \n**# 英雄所見略同**\n\n\\[\\_\\_\\]讓一般讀者印象最深刻的，是她驚人的閱讀量和文章寫作量。我自認是個閱讀機器，讀書量不會輸給任何人，唯一讓我直接認輸的人就是她。有寫過文章的人都知道，能夠快速且有效地閱讀和產出文章並不容易，以「1」的寫作量來說，我還沒看過比她行的，輸給她完全不去臉。\n\
    \n閱讀是「2」，寫作是「0.999」，從這兩點可以看出，個人聰明，但是要看出有沒有深入思考，則是要看他所問的問題。\n\n有一次她「」問我：「為什麼巴菲特不買耐吉，這完全符合他的標準啊？」「我也有一樣的問題，只是從來沒人跟我討論過。這個問題重要的點在於大多數人只會重複敘述巴菲特持股，很少有人找到符合巴菲特標準卻還沒買投資標的。\n\
    \n我當時回她：「也許是因為反壟斷法的關係，因為波克夏旗下也有跑鞋公司。」但耐吉是一家很棒的公司，我讀過耐吉創辦人的自傳，很喜歡這個創辦人，自己也穿耐吉的鞋子。只是我沒開美股戶頭，所以沒辦法買耐吉的股票。當耐吉股價下跌時，我買了它的代工廠「豐泰」，這檔持股讓我獲利頗豐。後來我才知道，「」買入耐吉公司股票的時間點和我買入豐泰的時間點差不多，當真是奇妙的巧合和判斷。\n\
    \n而後我舉辦了許多網聚活動和年度聚會，「」總是非常捧場，有時候擔任講者，有時候以 VIP 的身份參與。我的粉絲們也百分之百樂於看到她，她總像個鄰家女孩一樣樂於分享所知，就像《美股投資學》這本書的內容一樣。\n\
    \n**# 讓投資美股變簡單**\n\n我沒有投資美股的主要原因是對資訊取得與了解太少，這也是許多投資人會遇到的問題。但現在投資市場的環境已經大幅度改善，投資美股的方式變得簡單許多，你可能會遇到的問題像是券商開戶、海外稅務、主要的美國企業介紹．．．．．．等等，都能在這本書裡看到。\n\
    \n本書更提供了許多美股公司財務分析個案，有我熟悉的Agile。（我可是忠實用戶），也有我不熟悉的商業模式（例如使用訂閱制的公司，該注意的財務指標及計算公式），還提供了基本面投資人該知道的各種財報說明，例如10｜K、10｜Q以及很多投資人都會看的13\
    \ F。這些介紹大幅降低了投資人搜尋知識的時間成本，包含我在內！如果之後開美股戶頭，必定會讓這本書出現在我的桌上。（^順便一提，如果我開戶應該會買波克夏、耐克和蘋果公司，畢竟我們要買你所買、買你所愛。）\n\
    \n美股和台股當然有差別點，但是也有共同點，很多人的想法會卡在在其中一端，有些人則不會。想要了解一個人是否具備非凡的腦袋，就要看也能否在兩種不同的看法中優游自得的，而Gus就是這種人，你也可以成為這種人。\n\
    \n投資美股，請由本書開始，除了充沛的知識之外，你還可以得到投資的樂趣。\n\n# 開闊視野的投資之作\n\n**推薦人：Jay Chiaoo**  \n\
    JC Capital 執行長\n\n在自媒体逐渐兴盛的年代，二〇一六年，我们成立了「JC财经观点」。\n\n当初的想法，是经由介绍国外的经典投资著作、最新的财经出版物、报章杂志的优质内容和即时的财经趋势，撰写成文章心得，藉此达到推广阅读、传达正确投资观念的目的。\n\
    \n还记得当初瑞·达利欧（Ray Dalio）的钜著《原则》(Principles) 在亚马逊逢上架三天，Tom 就已经读完原文，同时完成了三篇心得。在国内还没有中译本的情况下，能领先把最新资讯和知识传达给读者、开拓投资人的视野，便是我们的初衷。而当时《原则》的心得，也為我們的網站注入不少流量，使「JC財經觀點」扎穩了根基，也讓Jenny更有信心地朝這樣的目標前進。\n\
    \n在《原則》之後，Jenny、又陸續介紹了保羅·桑金（Paul D. Soren）和保羅·喬森（Paul Johansson）合著的《哥倫比亞商學院必修投資課》（Pitch\
    \ the Perfect investment）、席拉·寇哈特卡（Sheela Koultekar）的《黑色優勢》（Black Edge）等書。由於翻譯整本書要花相當長的時間，Jenny讀完原文後，透過羅列重點、提出觀點的方式解析作品，受到愈來愈多讀者的肯定，也使得粉絲團按讚人數逐步成長，網站更是累積了數百篇心得文章。而將書本中的觀念融入實戰投資這樣的風格，也成為了JC財經觀點獨有的特色。\n\
    \n**# 結合基本面與技術面，一套完整的投資系統**\n\n二〇二〇年在各國央行寬鬆的貨幣政策下，全球興起了一股投資熱潮。在資金氾濫的情況下，投資幾乎成為全民運動，人人對於投資知識的渴求，達到了前所未有的地步。在網路發展成熟、國際化環境的推動下，網飛、Uber、特斯拉等美國公司提供的產品和服務，早已融入每個人的生活中，使得美股不僅成為大家茶餘飯後討論的話題，更成為資產配置的最佳選擇，而Jenny\
    \ 的《美股投資學》在此時出版，可以說正是時候。\n"
