    由於產業競爭激烈，還有來自各地區市場的監管壓力，使得公司有營收成長趨緩的問題，股價在一九年公開上市後表現疲弱。再加上二〇二〇年的疫情影響，對公司無異是一記重擊，租車業務總預訂量比前一年同期大幅衰退，平台的活躍用戶數大幅減少，股價也跌破公開發行價。


    對共享經濟來說，最重要的是先建立網絡效應，擴展市占率是當前最重要的目標。檢視C2C的獲利情況，毛利率在最近幾年平均約為四七%，但由於產業處於高速發展階段，不管是行銷廣告、人事管理或研究開發的費用持續擴大，公司仍在不斷燒錢。看起來目前現金仍足以支應日常營運，若虧損金額持續擴大，面對突發性意外時承受風險的能力不足，難保不會發生危機。


    # 競爭對手


    Lyft（美股代號LYFT）是Uber在共享汽車行業的主要競爭者。在美國市場中，Uber的市占率高達七十一%，遠高於Lyft的二十九%。另外，Uber還有一個優勢就是它已經擴展到國際市場，Lyft則局限於美國市場，因此Uber的營收來源更為廣泛。


    至於外送餐點服務的主要競爭者，包括了Grubhub（美股代號GRUB）、DoorDash和Postmates。Uber在二〇二〇年七月宣布收購其中一間競爭對手Postmates，對提升市占率大有助益，晉升為美國市占第二的外送服務平台。此外，還與許多企業進行合作，推出雜貨送貨服務，藉以擴占公司的營收來源，鞏固市場地位。


    # 未來展望


    二〇二〇年由於疫情關係，Uber的乘車服務在短期內受到巨大影響，外送餐點服務卻逆勢成長，創下佳績。雖然Uber仍在虧損中，但現任執行長多拉·霍斯勞沙希（Dara
    Khosrowshahi）在財報會議上提出，以燒錢驅動成長的時代已經過去，未來Uber應該專注在能獲利的市場上、維持營運，並在二〇二一年底實現盈利目標。就這樣的營運策略來看，對公司的影響相當正面。


    公司現階段採取的策略包括擴展利潤率較高的Uber Eats，整合已超過五十萬家餐廳，並推出Uber Connect的送貨服務、汽車租賃服務Uber Rent和寵物運輸服務Uber
    Pet，透過多元化的業務來擴展營收與提高用戶的參與度。


    投資Uber這類型公司，評估的主要重點在於未來發展前景。預估共享汽車行業到二〇二二年的市場規模，將比二〇二〇年成長五〇%。疫情的影響是短期的，重點是疫情後公司能否回到正常的營運軌道。而共享汽車行業發展已經成熟，Uber是行業中的領導者，將觸角由乘車服務延伸至相關產業，形成規模效應，在監管法規的問題逐漸排解之後，對於公司的股價仍然可以樂觀看待。


    若對美國上市的汽車股有興趣，可參考其他相關公司，如Lyft（美股代號LYFT）、Grab（美股代號GRAB）、Nio（美股代號NIO）、AutoZone（美股代號AZO）等公司。


    # 第19章 打造最適合的投資組合


    在了解美股中的趨勢產業以及各類公司的分析方式後，回到本書一開始提到的問題：該如何將這些資產進行篩選與配置，打造一個穩健成長的投資組合？接下來就從最基本的資產配置開始，幫助你循序漸進地打造個人化的投資組合。


    # 了解自已，才能做好資產配置


    什麼是資產配置？就是將資金配置到多元資產類別，彼此之間的走勢呈現相反情況，具有負相關性，然後藉由不同標的的組合達到降低整體投資風險的目的。在這個過程中包含三個重要元素，分別是「時間」、「分散配置」與「風險承受能力」，投資人選擇投資標的時，也應該盡可能降低交易成本，並定期將投資組合調整回一開始設定的比例，這個過程稱為「再平衡」。


    投資標的中可選擇的主要資產包括現金、股票、債券與不動產，如果投資組合過度集中在某個特定資產，當資產價格大幅波動時就會影響投資人的情緒，結果提早離開市場而錯失應得的利潤，這是多數投資人長期投資時最常面臨的重大阻礙。由於我們無法預測短期內會繼續上漲或下跌，因此要以獲取穩健合理的報酬為目標，規劃一個長期的投資計畫，時間才會變成你的朋友！


    在開始資產配置之前，先問自己下面幾個問題：


    ## 一、你有多少時間可以花在投資研究上？


    首先問自己有多少時間可以理解一個產業，深入去研究公司，來規畫你的投資組合。一般投資人由於有本業收入，投資是增加額外財富的工具，如果希望在擁有工作的同時，透過儲蓄與投資來累積更多的退休金，讓老年的生活品質更好，可以選擇ETF作為主要配置。但是選擇做一位主動投資人，則一定需要有更多時間來投入，了解景氣的循環、盤勢的變化及個別公司的營運動向，才能做出最好的判斷。


    ## 二、你能夠承受的損失有多大？


    風險承受度決定了我們的投資風格，以及應該配置在哪一種類型的資產上。積極型投資人會將更多資產配置在風險較高的資產，以獲取更高的報酬；保守型投資人則會將風險降低，提高波動較小的資產比重，追求持續且穩定的收益。


    此外，進行資產配置是為了讓投資人在長期下獲得滿意的報酬，但短期內仍有可能碰到虧損狀態，因此投入到市場的資金必須是短期內不會動用到的，如此才有辦法長期持有，避免突發狀況導致被迫停損出場，無法達到累積資產的目標。


    ## 三、你的長期目標是什麼？


    年齡決定了我們的投資期限。人一生中的每個階段都會有不同的優先選擇，投資目標也會跟著改變。試想一位正值壯年的投資人和一位屆臨退休的投資人，他們的投資組合怎麼會一樣呢？年輕人趁著還有高生產力的優勢，可以賺取更多的勞動收入，同時試著提高自己的投資風險承受度，打造更積極的投資組合；而年紀漸長的人重視穩定增值，將重心轉往現金流的組合。


    資產配置並不是一個固定公式，而是依照每個人不同的情況，包括年齡、資金規模與風險承受度等因素，綜合評估之後找到最適合自己的比例。因此進行投資之前，應該先了解自己的投資風格、目標報酬率與風險承受度，才有辦法打造最適合的投資組合。


    # 股債配置比例


    最基本的資產配置，就是將資金分成「股票」與「債券」兩個部分。股票是風險性較高的資產，因此能獲得的報酬自然比固定收益型的債券商品更高。但債券的「固定收益」特性，使得它面對風險加大時具有保護作用，例如發生金融海嘯、疾病傳播、恐怖攻擊等無法預期的事件時，債券的價格會因為資金湧入而升高。


    有趣的是，當市場一片樂觀時，沒人會想到風險，更不會被債券的低報酬率所吸引，而放棄令人垂涎的高風險、高報酬資產。既然風險無法預期與避免，我們在風平浪靜時就應該先做準備，時時保有風險意識，並實踐在自己的投資決策裡。


    投資台股時，由於台灣的避險工具較不盛行，選擇性也較少，所以往往無法達到最有效的資產配置。但美股中可以藉由債券ETF的配置來避險，包括政府公債ETF與綜合債券ETF。有些投資人會配置高收益債券（俗稱「垃圾債」），不過高收益債券的性質其實更像股票，而且有高度的違約風險，不適合作為固定收益與避險資產。


    既然基本的資產配置有「股票」與「債券」兩部分，那麼我們應該如何分配比例呢？根據不同類型的投資人，以下有三種股債配置（參圖46）：

    '
