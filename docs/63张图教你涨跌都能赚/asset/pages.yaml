- pgno: 11
  md: '大收益。此時，我不禁體會到「投資股票果然是種技術」。


    只要學會扎實的技術，便能應付任何緊急狀況。以平常心冷靜而正確地操作每一步，就能度過難關，獲得龐大收益。


    只要掌握好方向，當股價劇烈變動的時候，遠比小幅波動的時候更能獲得高收益。


    沒錯，「暴跌」「暴漲」其實就是投資世界中最能賺錢的大好機會。我的學生縱使在疫情衝擊下都還能賺進百萬，如果你只想安穩獲得月入數千至數萬的收益，那麼只要閱讀本書，再加上練習，就足以達成目標。


    請以這次疫情衝擊下獲得的教訓為本，確實學習如何面對暴跌、暴漲，以及「在那之後的股價波動」。


    堅定、勤勉、還要當個緊盯股價動向的「股市跟蹤狂」。


    只要確實閱讀本書內容，勤加磨練股票投資技術，就不用再害怕暴跌和暴漲了。請保持不受動搖的平常心，好好學習在任何市場都能致勝的技術。祝福所有散戶投資人好運連連！'
