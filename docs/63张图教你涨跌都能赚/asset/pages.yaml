    # 圖 38 股納解析


    A和B兩個案例是從放空開始，稍微獲利之後就了結。這是因為在放空之後，K線下端價格節節升高，或是進入盤整狀態，這種時候大多會分岐失敗。


    不過，這種失敗也暗示「股價從下跌趨勢打底反彈的可能性」。在A區分岐失敗後的紅線③，亮起了漂亮的下半身訊號，出現再次挑戰的機會。在B區分岐失敗後，也可以判斷紅線③很強勁，因此進行買進。


    重要的是別被失敗絆住腳步，要看出失敗暗示反方向變化的可能性，並且切換策略。'
