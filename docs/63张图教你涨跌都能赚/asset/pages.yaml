- pgno: 193
  md: '但若股價進入 20 日線和 60 日線之間，5 日線又呈現無力的盤整發展，就會很麻煩。由於無法判斷走勢往上或往下，暫時靜觀其變會是比較好的做法。


    在趨勢持續的過程中，暫時... 也會很難說明細， 這種時候不妨乾脆休息吧。


    在休息放鬆的時候，可以反覆閱讀我的著作，也可以觀看線圖。有精神的話，就來練習看千張線圖；如果沒那麼有幹勁，至少可以每天悠閒地看數檔個股的線圖，將時間花在提升實力上。


    圖 57 是適合休息的股價變動案例，在持續強烈的上漲趨勢中出現暫時下跌，或是在持續強烈的下跌趨勢中出現暫時上漲。在下跌趨勢中，5 日線向上突破 20 日線，甚至繼續上漲觸碰
    60 日線，或是碰到 60 日線之前反彈回跌，這些時候都很難操盤。


    是會繼續下跌，加速下跌趨勢呢？還是突破 60 日線，持續上漲呢？這些發展是股價本身也很難決定的。


    遇到這種案例時，請先休息，直到找到其他的線圖訊號，例如股價無法刷新高點、未跌破低點、突破整數關卡等。'
