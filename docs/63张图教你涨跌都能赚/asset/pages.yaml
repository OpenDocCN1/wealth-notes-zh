  md: '實際上，完成反鳥嘴的是隔天的黑線②，或是再隔天跌得更深的...，但我希望投資人在這個案例中採取更快速的行動。出現黑線①的反下半身訊號之後，只要股價繼續下跌，就能看見反鳥嘴訊號完成，請做好這樣的預期，盡早在黑線①進行放空！


