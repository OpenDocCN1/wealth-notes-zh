- pgno: 195
  md: '# 圖解 當均線下跌時出現小反彈，該怎麼做？


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_195_0.png)


    # 圖 58 傻神解析


    雖然均線的排列呈現反PPP狀態，但在長期下跌走勢中，仍有反轉上漲的跡象。看見A的上漲與失速，預測股價「會在B轉換趨勢」，因此在紅線①的下半身訊號買進，這個操作沒有問題。

    但是，如果太過堅持期待股價上漲，長期持有多頭部位是很危險的。這個案例中，在黑線②撤退才是正確選擇。

    投資人應像這樣注意「還在反PPP狀態所以氣勢疲弱」，盡早放開多頭部位。

    在這種曖昧的盤整狀態，請畫出高點和低點線，觀察股價是否突破其中一條線，會是比較好的做法。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '當走勢發展來到 ，股價再度轉為上漲，令人心生「這次一定可以」的信心。而且就如淺綠色橫線所示，5日線的低點升高，也加強了做多的依據。


    我們假設在 下單買進，此K線對20日線形成下半身訊號，因此這個投資策略本身並不差，但如果過度期待今後反轉上漲，則會投資失敗。在這個案例中也是，沒有出現太多獲利就回到原本的價格了。


    受限於個人的偏執，而忽略整體下跌的反PPP狀態，是很危險的事情。


    明明是不需要特地進場的時機，卻下單買進了，這種時候就必須利用9日法則和股價對5日線形成的反下半身訊號，判斷逃跑的時機。我要在這裡嚴正聲明，技術尚未到家的初學者，不必勉強挑戰這種走勢。


    如果是進階班的投資人，只要線圖持續反PPP狀態，也許就會是看準股價加速下跌，來進行放空的勝負關鍵。'
