    指數急跌後進入盤整，接著出現反彈上漲的氣息。由於此時是反 PPP 狀態，必須慎重行事。


    要是在亮起 N 大訊號前出現下半身訊號的紅線①，或是在完成 N 大訊號的紅線②買進，指數卻在遇到 14,000 點的整數關卡回跌，出現紅線③，這時要考慮指數可能下跌，維持多頭部位並增加空頭部位可能會比較好（追加空單）。


