  md: '# 相場式投資只鎖定這些個股


    相場式投資技術鎖定的目標，是眾多投資人熱絡交易的個股，因此成交量高或成交金額大，且市值也高。


    判斷標準是每天成交量在 300 萬股以上，平均成交金額為 20 天平均最低 30 億日圓以上，市值則在 5000 億日圓以上。如果想靠做空獲利，適用信用交易制度的「貸借證券」也是必要條件之一。


    僅開放「融資」信用制度的個股稱為「貸借融資股票」，可融資和做空的個股則稱為「貸借股票」¹。近年也有許多網路證券公司設定獨有的可信用交易個股（可多空雙做），讓投資人更容易從做空開始操作。


    1 編註：「貸借股票」「貸借融資股票」為日股規定，台股較無特定稱呼。以台股來說，要成為放空標的，需符合以下三個條件之一：①上市、櫃滿 6 個月且每股淨值在票面（10
    元）以上的普通股票。若無面額或每股面額非屬 10 元者，為上市滿 6 個月且財務報告顯示無累積虧損。②上市、櫃滿 6 個月且財務報告顯示無累積虧損的臺灣存託憑證。③上市、櫃滿
    6 個月且非外幣買賣的受益憑證。'
