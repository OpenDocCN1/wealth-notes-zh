- pgno: 187
  md: '# 成為只瞄準

    好球揮棒的投資人


    如同第1章所述，投資股票就算站著不動，也不會被三振出局。因此，保持「只瞄準好球揮棒，圍著壘腳繞壘」的心態很重要。尤其在新冠疫情時期，投資人更需要改變投資股票的習慣。


