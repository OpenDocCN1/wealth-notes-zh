  md: '# 20 日線與 5 日線

    交會時的抉擇


    容我重複說明，「5 日線> 20 日線> 60 日線的 PPP 狀態崩塌轉為盤整時」以及「60 日線> 20 日線> 5 日線的反 PPP 狀態崩塌轉為盤整時」，就請先休息。


    因為這種時候，很難判斷走勢會往上還是往下。


    下一頁[模糊] 就是一個具體的案例。「[模糊]」是[模糊]（分岐訊號的失敗案例）博報堂 DY 控股公司的股價線圖，「[模糊]」則是[模糊]（N 大的失敗案例）日經平均股價指數的變化。


    在「[模糊]」博報堂 DY 控股公司的案例中，分岐訊號失敗後，均線的排列就從 PPP 狀態變為 20 日線> 5 日線> 60 日線。接著，均線在Ⓐ處變得聚集，並且出現短暫跌破
    60 日線的黑線①，讓人以為股價要下跌了，結果卻反轉上漲，最後回到了上漲趨勢。'
