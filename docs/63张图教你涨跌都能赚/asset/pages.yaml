  md: '# 市場紛亂期間的注意事項


    在疫情尚未完全平息的時期，「零營收」成了見怪不怪的經濟現況，沒有人可以預測自己投資的企業會發表什麼樣的決算內容。


    因此，就算是大型股，也最好在該公司發表決算前先暫停交易。雖然相場式投資術不看公司業績，但還是要 ...。


    下一頁 ... 是郵儲銀行的股價。郵儲銀行從 2018 年 3 月以來一直持續著下跌趨勢，這樣的股價變動（線圖圖形）很適合做空。


    但是，由於疫情帶來的暴跌，這檔個股在 3 月 13 日寫下低點 826 日圓，之後股價就反彈轉為上漲。


    5 月 15 日（圖中 ...）來到近期的高點附近，顯示許多人預期股價會繼續往上走，甚至期待突破高點。然而，這一天發表了 2021 年 3 月份的營收預期，宣布營收比市場預期還低，因此，隔周的星期一，也就是
    5 月 18 日，股價就下挫了（圖中⑧）。'
