- pgno: 152
  md: '# 注意鳥嘴「騰空」


    說了這麼多優點，但其實鳥嘴和反鳥嘴也有一個該留意的地方：當股價騰空上漲或下跌，單日出現大幅度變動，遠離前一天的股價，就是相當危險的時候。


    下一頁圖 的 SKYLARK 控股公司便是很好的案例。在股價線圖的左半邊，股價持續上漲，在中央的黑線③的上影線寫下最高點。


    接著股價如同高空彈跳般騰空下墜。而且連續四根黑線，完成銳利的反鳥嘴 A。


