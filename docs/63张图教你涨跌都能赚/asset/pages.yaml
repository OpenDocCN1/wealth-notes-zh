  md: '# 鳥嘴是轉換趨勢的警示聲


    「鳥嘴」和「反鳥嘴」訊號指的是 5 日線和 20 日線交會，形成如鳥嘴般的銳角（圖 39）。


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_141_0.png)'
  merge: -1
  img_proc: true
- pgno: 142
  md: '一定有人認為「這就是黃金交叉（死亡交叉）」，但其實兩者完全不一樣。


    鳥嘴之所以像鳥嘴，是因為 。至於黃金交叉和死亡交叉，無論20日線是否走平，只要有所交會即成立。運用黃金交叉和死亡交叉，並無法獲得勝利。


    除了5日線之外，20日線也必須有明顯且相同的趨勢走向，否則無法形成鳥嘴訊號。這就是相場式鳥嘴訊號與黃金交叉最大的不同。


    20日線往上走，處於上漲趨勢，5日線則以更陡峭的上升角度突破20日線，這種銳角會在什麼時候形成呢？


    只有在股價暫時下跌，或從下跌趨勢反轉上揚的氣勢很猛烈的時侯，才會形成鳥嘴。


    漂亮的鳥嘴訊號形成後，幾乎沒有預測失敗的案例。只要是正確的鳥嘴形狀，單憑鳥嘴訊號判斷的精準度就很高，成功率也很高。


    要說鳥嘴訊號的困難之處，也許是要小心別被下單後氣勢猛烈的股價給甩在後頭了。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 鳥嘴的成功案例和「偽鳥嘴」


    下一頁的圖 40 是 2016 下半年川普當選美國總統時的日經平均股價指數。牽動大行情的鳥嘴訊號出現在 A 區。


    鳥嘴分為兩種：趨勢持續時出現的訊號，以及趨勢轉換時出現的訊號。從均線的排列來看，這檔個股屬於上漲趨勢持續時出現的訊號。原則上，分岐訊號的 5 日線在碰到 20
    日線之前便遠離，但趨勢持續中的鳥嘴訊號，則是發生在 5 日線稍微潛入 20 日線之下，經過微量震盪之後。


    在短時間急挫之後，股價快速反彈上漲，才是正確的鳥嘴訊號，否則只是在 20 日線走平狀態下，5 日線和 20 日線的單純交叉而已。


    圖 40 的長黑線 ① 顯示股價大幅下跌，接著出現長紅線 ②，股價快速反彈上漲，呈現出銳利的鳥嘴圖形。


    這個案例在明確出現鳥嘴之後，要在紅線 ③ 下單買進。在出現驚心動魄的長黑線 ① 之後，你可能會懷疑這個買進點是否過早，但此時你應該相信這股氣勢，勇敢買進，因為這可說是過去
    30 年以來最漂亮的鳥嘴訊號前三名。'
