- pgno: 126
  md: '# 什麼是「分岐」？


    投資股票的基本守則是 。上漲趨勢時做多，下跌趨勢時做空，這就是跟隨趨勢的概念。


    那麼，在上漲趨勢中隨時都可以做多嗎？下跌趨勢中隨時都可以做空嗎？


    如果趨勢永遠不變，那當然可以。但是，投資人做多時都想盡可能在低點買進；做空時盡可能在高點賣出，這樣才能獲得更多收益。


    無論持續多麼強勁的走勢，都會有投資人在這段期間獲利了結，因此股價一定會上下變動。


    上漲的股票，會因為做多的投資人獲利了結，而使股價暫時下跌。下跌的股票也是如此，總有一天會因為放空的投資人把股票買回，而形成短暫的反轉上揚。


    處於上漲趨勢的股票，在因投資人獲利了結而暫時下跌的時候，能以稍微便宜的價格買進。這種跟隨趨勢的手法，稱為暫跌買進，是'
  merge: -1
  img_proc: true
- pgno: 127
  md: '最普遍的做法多方法。


    以下基礎知識說明給超級初學者聽：在投資用語中，將上漲中的股價暫時下跌的情形稱為「暫跌」。這就是「暫跌買進」的命名由來，而英文則是叫作「dip」（有浸泡、沉沒之意）。


    接下來講下跌趨勢的情形。如果在空方買回造成短暫的反轉上揚時進行放空，就能以較高的股價賣出空單。這個方法稱為「回漲放空」，目的是盡可能以高價賣出。


    冗長的前言說到這裡結束，為了自然而然學會「暫跌買進」和「回漲放空」這兩個跟隨趨勢的基本買賣法，我發明了獨門訊號——「分岐」。


    分岐訊號主要觀察的是 5 日線和 20 日線。股價連日上漲後，5 日線和 20 日線將一同往上走。相對位置為 5 日線在上，20 日線在下。只要它們幾乎呈平行移動，就會持續上漲趨勢。


    請看圖 34。在紅色的 5 日線和綠色的 20 日線呈平行關係往上走時，如果股價短暫下跌，5 日線也會受到影響而下跌，趨近 20 日線。之後股價再次回到上漲趨勢，5
    日線也連帶上揚，遠離 20 日線，而且不會與 20 日線交會。這個型態就稱為「分岐」。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# 分岐是上漲趨勢的、下跌趨勢的分岐


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_128_0.png)


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_128_1.png)


    雖然這個名字聽起來有點負面，不過實際上代表的是短暫失速的走勢復活，會讓人士氣大增。


    股價轉為上漲之後，5日線才會上揚，因此在分岐出現的前後，必定會發生股價以紅線的姿態站上5日線的下半身訊號。


