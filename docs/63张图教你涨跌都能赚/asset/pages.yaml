- pgno: 183
  md: '# 統整相場式 5 大訊號


    # 【下半身／反下半身訊號】


    判斷下半身與反下半身訊號時，5 日線的方向非常重要。單獨出現此訊號時不應貿然買賣，請與近期的高低點、整數關卡、分歧訊號、鳥嘴訊號發生前一天等其他訊號組合觀察。


    我們應該養成自然而然逐一確認其他訊號的習慣。只要確實建立判斷標準來區分成功和失敗，下半身和反下半身訊號就是最容易提高精準度的訊號。


    此外，運用9日法則，就能將收益延展至最大。藉由數K線的數量，抓到停利的時機，對初學者來說也很容易！


    # 【分歧訊號】


    分歧訊號告訴投資人上漲趨勢中的暫跌買進點，以及下跌趨勢中'
  merge: -1
  img_proc: true
- pgno: 184
  md: '的回漲放空時機，可以說是相當適合初學者運用的訊號。


    別錯過與趨勢方向相反的 K 線，以及該 K 線對 5 日線形成的下半身或反下半身訊號，此時請抓準股價回到趨勢方向的時機。預測「接下來會形成分歧訊號」後，請盡早下單。


    鳥嘴是 5 日線和 20 日線交會的訊號，必要條件是 20 日線本身也呈現一定角度的往上或往下。若是走平的 20 日線，即使與 5 日線交會，那也不是鳥嘴訊號。


    經過上百、上千檔個股的線圖驗證，當真正美麗的鳥嘴完成之際，預測成功率幾乎可說是百分之百，是精準度相當高的訊號。


    鳥嘴訊號會出現在趨勢大轉換的初期階段，投資人可以藉此從趨勢的開始到結尾都大豐收。


    不過，K 線也有可能變動過於激烈，導致鳥嘴發生時已經開始劇烈的股價變動，而使投資人操作失敗，唯獨這一點應留意。'
  merge: -1
