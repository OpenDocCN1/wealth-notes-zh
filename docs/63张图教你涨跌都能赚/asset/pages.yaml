  md: '# 善用均線進行

    股價的出口民調


    相場式投資術的第二個必備工具，是均線。


    均線全名為「移動平均線」，指的是將某個期間的股票收盤價平均值依序連成一條線，例如 5 日線就是將前四個交易日的股價和當天的股價，共五天分股價平均值連起來的線；以周線為例的話，60
    周線則是取過去 60 周，也就是一年多的股價變動平均值。


    相場式投資術常用的基本款均線如下：觀察短期變動，看 5 日線（本書用紅色標示）、中期看 20 日線（本書用綠色標示）、長期看 60 日線（本書用藍色標示）。近年來，我認為可以運用更長期間均線，來觀察長期走勢、進行買賣，因此也推薦各位再加上超長期的
    100 日線（本書使用紫色）。有些證券公司提供的網路看盤工具初始設定為 5 日、25 日、75 日線，但同時也會提供客製化設定，請各位自行改成 5 日、20
    日、60 日線。'
  merge: -1
  img_proc: true
