    此外，當 5 日線突破 20 日線，靠近藍色的 60 日線，接著回到原先的走勢而遠離 60 日線，則是另一種版本的分歧。


    總之，當 5 日線靠近較長期的均線，接著又像說聲再見般，回到原先的趨勢方向，就是分歧訊號。'
