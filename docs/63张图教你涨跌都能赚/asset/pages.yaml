- pgno: 137
  md: '博報堂 DY 控股公司在⒜區和⒝區都成功完成分岐訊號，股價逐漸往上攀升，但在⒞區卻分岐失敗，希望各位投資人對此都能抱持警覺。在⒞的分岐發生之前，從股價「不上不下」的盤整狀況應該可以察覺過熱。


    股價在天花板陷入墜落，就是分岐訊號失敗的前兆。在⒞區的紅線①做多的結果是失敗，雖然出現做多的分岐訊號，但股價下跌，表示股價走弱的可能性相當高。


    分岐失敗是一個警訊，在這裡可以判斷⒞區是否為股價的天花板，必須迅速切換策略。可以改為保有多頭部位，再稍微追加空單的策略。


    有些人的思考方式比較沒有彈性，認為股票的買賣訊號「必須100%準確，不準確就不用」。


    但是，失敗的訊號也有利用價值。當某個訊號失準時，應該要想到該個趨勢的方向將與訊號暗示的方向相反。'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 化失敗為成功的分岐案例


    我們來看看分岐訊號不成立時，如何切換買賣策略的案例。


    下一頁 是連鎖電器行 Bic Camera 的股價線圖。的 5 日線就像是黏住 20 日線，之後又離開，建立了特異的分岐訊號。我在跌破 5 日線的黑線①進行放空，但是股價並未加速下跌。


    當 5 日線下方的 K 線下端價格節節升高，大多都會分岐失敗。在 看到 長長的下影線時，就能知道「這波下跌並不強」；所以要先出掉。


    反過來說，我們也可以判斷「下端價格節節升高，表示反轉上揚的力道變強」，而在 再次挑戰，這也是很高明的手法。同時突破 5 日線和 20 日線，亮起下半身訊號，是再次挑戰的依據。


    接著請看 。股價被 60 日線壓著打，回到下跌趨勢，亮起分岐訊號。我在刺激跌破 5 日線的黑線④進行放空，結果分岐失敗。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 重點講 失敗為成功之母——反轉上揚


