- pgno: 20
  md: '2020 年 4 月 7 日，日本政府發布緊急事態宣言。4 月 8 日，該公司位於淺草、銀座的兩家分店開始暫時歇業。即使如此，松屋的股價仍然持續上漲。


    4 月至 5 月中旬，所有松屋百貨不見重新營業的跡象，如果股價真的由公司業績帶動，為什麼那段時間的松屋股價未見下滑呢？


    下一頁 是經營唐吉訶德的泛太平洋國際控股公司（Pan Pacific International Holdings Corporation，PPIHD）股價。在疫情衝擊前，唐吉訶德因日本入境需求（訪日外國人旅客）而賺取了龐大收益，但在疫情爆發後，來店人次減少，該公司
    3、4 月分的現有分店營收與前一年同月相比，減少了將近 5%。


    唐吉訶德的分店營收通常會超過前一年的兩倍，對於持續締造優秀業績的公司來說，下滑 5% 是相當嚴峻的情況。


