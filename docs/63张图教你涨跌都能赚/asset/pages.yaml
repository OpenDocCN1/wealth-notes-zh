  md: '# 後疫情時代，公司業績決算內容前夕需提高警覺


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_65_0.png)


    相場式訊號雖然多樣化，適用於所有的股價行情，但並不能預測企業發表決算後的結果。


    在疫情期間，企業的營收無法預測，經常會發生股票的拋售或爆量買進，超出依賴基本面分析的專業投資人預期。尤其在發表決算前後，股價變動的情況相當混亂，容易預測失準。


    即使是成交量大的大型股，也最好在決算發表前先暫時脫手，不持有任何部位，這是比較明智的選擇。'
