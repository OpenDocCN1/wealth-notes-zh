- pgno: 42
  md: '# 線圖走勢明確，獲利更簡單


    開設了信用交易帳戶，獲得操作放空的入場券後，就能立刻在暴跌走勢中獲利嗎？答案是 NO。


    這是基本的股價變動模式。


    當你正心想：「股價大幅下跌，很好！」而操作放空時，其實暴跌趨勢往往早已走向尾聲，股價正要開始急轉直上。如果在不好的賣出點下單賣出，只會導致大虧損。


    舉例來說，在 2020 年疫情造成的暴跌期間，如果你在 3 月上旬誤判「股價不會繼續跌了」而早早買進，那麼在 3 月下旬之前都會遭遇持續虧損；如果在 3 月下旬以為「這波暴跌看來『跌跌不休』」而操作放空，那在之後的反彈上揚中還是會面臨大虧損。


    投資股票最重要是「趨勢」和「買賣點」，本書所介紹の相場式訊號即能幫助你破解這兩個關鍵。


    所謂暴跌，就是最極致的下跌趨勢，此時多空方向當然是空方比'
  merge: -1
  img_proc: true
