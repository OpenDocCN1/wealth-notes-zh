  md: '# 沒有永遠的漲跌


    股價不會永遠持續上漲或下跌。


    當股價漲到一定程度，部分在上漲前就買進股票的投資人會認為「差不多可以停利了」，於是賣出股票。暴跌時也一樣，因為大量放空而賺錢的投資人，一定會在某個時機點停利、下單買回。


    看完以上說明，一定會有人問：「所以股價變動絕對會持續九根K線嗎？」或是抱怨：「有時候只會持續四、五根K線不是嗎？」


    說起來，不符合9日法則的股票，或是股價走勢不明顯的個票，都不是很適合做實戰標的。看不出趨勢的個股，表示其線圖並不理想，就算投資也不容易獲利。'
