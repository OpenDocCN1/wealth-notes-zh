  md: '# 疫情帶來的投資啟示


    2019 年 12 月，中國武漢市發現第一起新型冠狀病毒的感染病例，疫情很快就蔓延至全世界，造成全球大流行。在本書執筆當下（2020 年 6 月 22 日），全球感染人數已達
    906 萬人，並造成 47 萬名死亡病例。


    2020 年 3 月，疫情蔓延至歐美各國，造成全世界股價大暴跌。日經平均股價指數從 2020 年 1 月的高點下滑約 32%；美國紐約道瓊指數也從 2 月創下歷史新高以來，下滑了大約
    38%。


    圖 1 為疫情造成暴跌前的日經平均股價指數變動。從 2 月中旬至 3 月中旬，大盤宛如尼加拉瀑布般，以陡峭的角度傾瀉而下，簡直完美示範何謂「暴跌」。


    在疫情造成衝擊前，歷史上已有過數次暴跌紀錄：1990 年代的經濟泡沫破裂、2000 年的網路泡沫破裂、2001 年的美國 911 事件、2006 年的活力門事件
    ¹、2008 年的金融海嘯。股市一路經歷了許多衝擊，但


