  md: '# 成交量是投資人的心理狀態指標


    越多 人參加買賣，就越能消除股價的異常波動異常。當股價比投資人認為的適當價格更低，就會有大批投資人判斷「現在很便宜」而買進，使股價反轉上揚。


    正因為這類股價反映了多數投資人的想法，K 線所顯示的股價變動和均線顯示的趨勢才有說服力、穩定性和規律。


    「成交量」顯示股票在單日交易期間有多少股票被買賣，我們會以「這檔個股每天平均交易 200 萬股」這種方式來描述。


    以金錢為單位來計算成交量，說明個股單日交易多少金額，這個數值稱為「成交金額」。成交量乘以股價，就能算出當天的成交金額。


    為了降低我們判斷交易時的難度，也為了防止無法買賣股票的風險，選擇投資標的時必須留意：一定要有相當程度的成交量和成交金額。股價便宜的個股，成交金額通常偏低，而像迅銷（Uniqlo
    的母公司）'
  merge: -1
  img_proc: true
- pgno: 87
  md: '或任天堂這種股價較高的個股，成交量看似就會比較低，在觀察的時候要注意兩種數值的平衡。


    成交量高，反映出眾多投資人興奮投入交易的心理狀態。反過來說，成交量低的股票則顯示許多投資人熱情冷卻，失去對該檔個股的關注。


    換句話說，成交量可是顯示投資人心理狀態的指標。


    圖 21 是疫情造成暴跌前後的日經平均股價指數線圖，並且記錄了日經 225 檔個股的合計成交量。疫情開始造成股價暴跌後，日經平均股價指數整體的成交量暫時下降了，但在股價止跌前的
    3 月 13 日上漲至 34 億股。3 月 19 日創下疫情衝擊後的新低點 16,358 點，此時成交量膨脹為 20 億至 30 億股。


    圖中 ① 期間是股價剛暴跌時，許多投資人開始一口氣拋售，使成交量大增。之後股價不僅未止跌，更因為沒多少多方出現，成交量減少，股價仍繼續暴跌，這就是 ② 的情況。


    接著，越來越多投資人認為「跌到這個價格算很划算了」，交易股數也增加了，這就是 ③ 的情況。此時日經平均股價指數仍是下跌，但到了 ④ 的期間，出現許多多方，成交量因此大量增加。這證明了原先觀望的多方開始認為「股價跌得這麼深，這時候買就賺到了」。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '![](img/c6d4133cb59b8266e40592e4f86e86ab_88_0.png)


    的前後期間稱為「恐慌性拋售」。此時有很多人賣出股票，也有不少想買回放空股票的投資人。恐慌性拋售就是股價反轉上揚的機會。


    成交量也可以說是「目前市場釋放的熱能」。熱能越高，股價變動越明顯。在暴跌後的反轉上漲，或是在暴漲後的反轉下跌之所以是絕佳獲利機會，原因就在於股票的高熱能。


