  md: '# 什麼是「下半身」和「反下半身」？


    股價變動有兩種模式：來勢洶洶和缺乏氣勢的時候。在缺乏氣勢的時候，即使投資也不會獲利。投資人要在股價來勢洶洶的上下起伏時下單，不然很難獲得收益。相場合式訊號涵蓋了上述股價本質，其中最推薦的訊號是下半身和反下半身（圖27）。


    下半身訊號指的是股價原先呈短期下跌狀態，且位於5日線下方；其後一旦突然出現站上5日線的紅線，即預告加速上漲。


    這個訊號會在剛要開始上漲的階段亮起，因此是做多的好時機。只要上漲氣勢延續下去，就能大賺一筆。


    有時出現下半身訊號後，卻又再次出現黑線，使股價跌回5日線下方。即使遭遇這樣的失敗，由於K線仍未遠離5日線，投資人仍能迅速調整判斷。'
  merge: -1
  img_proc: true
