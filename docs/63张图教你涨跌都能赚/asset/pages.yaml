- pgno: 81
  md: "向、均線與股價的相對位置、各期間的均線排列順序。\n\n其中最重要的 是均線的傾斜方向。尤其長期的 60 日線和超長期的 100 日線，其傾斜方向是大趨勢的珍貴指引（圖\
    \ 19）。\n\n除了傾斜方向，也要注意均線的排列順序。當股價與均線由上而下依序是股價＞ 5 日線＞ 20 日線＞ 60 日線時，就是最完美的上漲趨勢。相場合投資術將這個狀態稱為「PPP」（讀為「砰！砰！砰！」），用這個詞來造句的話，便是「線圖上形成\
    \ PPP 後，會持續目前的趨勢」，我會在第 5 章詳細說明這個訊號。這個指標聽起來很有氣勢，又喜氣洋洋，很棒吧？\n\n反過來說，當股價持續強勁的下跌趨勢時，線圖上的排列順序由上而下為\
    \ 60 日線＞ 20 日線＞ 5 日線＞股價，均線的傾斜方向為向下，稱為「反 PPP」。 \n\n請注意排列順序的變化。當 5 日線跌破 20 日線時，證明短期下跌走勢變強。之後，5\
    \ 日線跌至 60 日線附近，可能表示要轉換為下跌趨勢；但也可能會受到 60 日線的支撐，再度轉為上漲。"
