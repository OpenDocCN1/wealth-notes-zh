- pgno: 26
  md: '股價變動的模式，基本上都是一樣的。實際上無論是在疫情爆發前，還是疫情導致的暴跌當下，又或是在暴跌之後的走勢，股價模式並沒有新的變化。


    在發生疫情前，經濟活動暢行無阻，因此任何股價變動都可以在事後用「公司發表新產品」「業績下調了」等理由放「馬後炮」。


    然而受到疫情影響，諸如鳥貴族、松屋百貨、唐吉訶德（泛太平洋國際控股）這些企業暫停了經濟活動，以基本面分析來看，未來「只可能持續下跌」，但實際上股價卻上漲，而且這種狀況頻繁發生。面對這種奇怪的狀況，若以相場式訊號來解讀，其實全部都能得到合理的解釋。


    這是我一直以來的 א主張。在這次疫情造成的暴跌下，正好證明了此主張千真萬確。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 股價是心理戰，

    線圖是反映人心的明鏡


    是什麼因素帶動著股價呢？如同前文提到，是「人心」，也就是投資人的心理狀態，諸如期待和希望、恐懼和不安等情緒。


    容我再次強調，鳥貴族和松屋百貨的股價之所以在暫時歇業後仍反轉上揚，全是因為人們的期待感，認為「疫情趨緩後就會重新開業」。


    在這份模糊的期待下，越來越多人認為「現在股價很划算，不買就虧大了」。這就是為什麼即使公司業績極差，股價卻依然上漲。股價稍微上漲後，有賺頭的投資人會認為「既然已經漲了，就先賣掉吧」，於是賣出股票，獲利了結。


    因此，原本逐漸上揚的股價就會稍微下跌。這種時候，有些股票會因為這波賣壓而引來更多賣壓，使得股價繼續下跌。'
  merge: -1
  img_proc: true
- pgno: 28
  md: '股價為什麼會變化？新冠疫情再次為我們解答了這道大哉問，那就是新冠疫情帶來的第三個投資真相：帶動股價的唯一關鍵，就是投資人的交易行為。


    無論公司業績多差，只要有人買它的股票，股價就會上漲；反之，無論公司業績多好，只要想賣股票的人增加，股價就會下跌。這是最簡單明確的真相。


    正因為股價來到高點，才有可能發生暴跌。假如人從1公尺高的地方跳下，那麼下墜的幅度並沒什麼大不了。但如果從標高100公尺，甚至1000公尺的地方一躍而下，則下墜的過程就會變得既激烈又快速。暴跌／暴漲的股價，其下滑／上揚的氣勢越強勁，線圖上的買賣訊號就越清楚易讀。所以我才會說，暴漲、暴跌是最棒的獲利時機。'
  merge: -1
  img_proc: true
