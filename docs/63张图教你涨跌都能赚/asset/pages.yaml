- pgno: 91
  md: '# 圖解12 超過近期最高點所形成的壓力線，股價趨勢更強勁


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_91_0.png)


    股票的多方和空方會直接影響股價的變動，而近期的最高點和最低點經常是多方和空方的心理攻防線。


    當股價突破之前的最高點所形成的壓力線，並且快速向上爬升，多方也會一鼓作氣湧入。再加上在最高點附近放空的空方必須買回股票，股價會變得很容性上漲。


    這就是為什麼當股價衝破之前的最高點，股價的上漲... 這也可以說是投資人心理造成股價變動的經典模式。'
  merge: -1
  img_proc: true
- pgno: 92
  md: '反過來說，這是股價依之前的最高點和最低點變化的經驗法則。


    但是，即使是持續上漲趨勢的股票，也很少有一直上漲的狀況。大部分都是經過數次挑戰仍無法突破近期的最高點，盤整一段時間之後，股價終於超過了最高點，然後開始大幅上漲。也就是「上漲→盤整→再上漲」。


    下一頁是經營企業併購事務的 Nihon M&A Center 日 K 線圖。這家公司不畏懼疫情帶來的暴跌，在 2020 年 5 月創下上市以來的最高價，從
    2009 年起的 11 年間，股價爬升超過 60 倍，持續猛烈攻勢。


    如此強勢的股票也有無法突破最高點而盤整的時候。如圖顯示，股價近期的最高點來到 3,200 日圓，而股價整整 3 個月都無法突破此高點，持續盤整。


    當 Nihon M&A Center 的股價出現，完全突破 3,200 日圓高牆之後，便一鼓作氣上漲至 3,600 日圓。同樣是上漲趨勢，有些股票會「上漲→觸碰到爬升的
    20 日線或 60 日線後下跌→再次觸碰到均線然後上漲」，也就是短暫下跌的類型；有些則是「飆漲→相當長期的盤整→突破後飆漲」的調整突破型。'
