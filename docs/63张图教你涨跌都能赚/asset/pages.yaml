  md: '# 均線的排列與糾結


    同樣都是股價上漲的狀態，在走勢剛開始的階段，氣勢會特別強勁，請各位積極把握這個時機。而下半身訊號會告訴我們在勢關鍵的時機。


    股價變動基本上是「下跌、盤整、上漲」，如果要做多，就是在「盤整之後上漲」的走勢下單。


    此時要注意的是均線的排列。當股價結束下跌，進入盤整的期間，5 日線、20 日線、60 日線大多也是走平且交纏的型態。


    如果在這個時候亮起強烈的下半身訊號，而且 5 日線、20 日線、60 日線如孔雀開屏般上升，那就是最佳時機。在均線開始呈現 5 日線 > 20 日線 > 60
    日線的 PPP 狀態，而且同時出現下半身訊號，這個組合技就是充滿上漲力量的強烈訊號！


    圖 29 的電子遊戲公司史克威爾艾尼克斯線圖中，亮起下半身訊號的長紅線①正是完美案例。由於這根長紅線的出現，均線正要形成 PPP 排列。'
