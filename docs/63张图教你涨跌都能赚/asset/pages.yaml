  md: '# 前言


    # 歡迎來到我的獲利道場


    有時彷佛天使般輕舞飛揚，有時搖身一變為惡魔使得人心惶惶，陷入恐慌——這就是股價。


    當報紙標題寫著「日經平均股價指數下滑 1,000 點！」「史上最大暴跌」時，想必許多人會感到不安，覺得「股票果然碰不得」。


    2020 年 3 月，受到新型冠狀病毒疫情蔓延的衝擊，日經平均股價指數連日下跌，每日連續下跌超過 1,000 點。3 月 19 日盤中出現 16,358 點的最低點，和
    2020 年初以來在 1 月 17 日創下的最高點 24,115 點相比，跌幅為 32%。


    別說散戶投資人了，連人稱「專家」的機構投資人都紛紛發出絕望的慘叫。


    在這樣的背景下，我所經營的「股票道場」擁有約 3,500 名學生，是亞洲最大規模的股票投資學堂。我每天都會收到許多學生的郵件或親筆信。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '「這不是大賠了嗎？你要怎麼幫我！」「老師，我要放棄投資股票了。」應該很多人以為，我會被陷入恐慌的學生們的這些抱怨和抗議聲浪淹沒吧。


    但實際上正好相反。


    「老師，這是我人生中最賺錢的時刻！」


    「才一個月就獲利 400 萬日圓！」


    「原來投資股票這麼簡單啊！」


    來自會員的郵件和信件中，滿溢著感謝、感動和歡喜之情。閱讀這些文字後，我每天都感到很幸福。


    關於投資股票，我至今已重複說過很多遍：「股票就是上漲後下跌、下跌後上漲的生物。因此，只要在上漲時做多、在下跌時做空，機會、獲利和幸福感都會倍增。」


    我親愛的學生們都很扎實地實踐這番教導。即使在新冠疫情造成的暴跌走勢，以及在那之後的強勢反彈中，他們仍能靠著相場式投資技術，賺進龐大收益。


    這是我近 40 年的投資歷程中，比自己獲利還要更開心的事情。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '股票投資的世界中，總是瀰漫著「股票不漲就不會賺」「跌了就會賠」的迷思。


    很多人誤以為，每當股價暴跌或是長期低迷的時候，投資人就只能大賠一筆，垂頭喪氣地離開投資世界。我對這樣的誤解感到憂心忡忡，於是決心開啟股票投資的「啟蒙運動」。


    「無論股票上漲或下跌，無論走勢偏向何處，都有辦法獲勝！請各位好好學習『上漲時做多、下跌時放空』的獲利技術。」


    股票道場的學生們反覆聆聽這條教義，聽到耳朵都要長繭了；眼睛也因為持續看著股價線圖，看到都要冒血絲。他們一路磨練股票投資技術，因此在其他投資人飽受恐懼與不安侵擾的疫情期間，我的學生都能不慌不忙地想起這條教義：


    「對了！這種時候只要放空就好了。」


    結果，股票道場的許多學生，都在疫情影響下的暴跌走勢獲得「人生賺最多」「獲利好幾百萬」「相當於一年收入」的龐大收益。而在那之後的股市反彈上漲中，他們也早已從線圖中瞧出端倪，輕鬆賺進大把鈔票。


    股票道場的學生無論做多或做空都能獲利，我本人當然也獲得龐'
