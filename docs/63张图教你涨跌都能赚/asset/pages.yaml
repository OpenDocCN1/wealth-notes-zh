- pgno: 39
  md: '# 暴跌變暴賺的第一步：

    擁有信用交易帳戶


    疫情之下，連股票專家也難逃慘賠的命運，但仍有人在此時經歷了「人生最賺錢」的時刻。這是怎麼辦到的呢？能夠在疫情中順利獲利的人，都懂得操作信用交易的「放空」技術。


    使用一般的現股交易帳戶雖然可以買股票，但是不能用來放空。


    相對地，如果想在股價暴跌時也能獲利，就必須先開設信用交易帳戶，並確實學習放空技術，再加上充足練習，即可勇於進入投資的殿堂。


    說到信用交易，相信很多人會認定「風險很高，可能會傾家蕩產」而退卻。但只要學會看懂相場式訊號，確實遵守紀律、貢徹停損（認賠殺出），就能避免過度恐懼。


    以日本為例，信用交易指的是將 30 萬日圓以上的現金或股票證券'
  merge: -1
  img_proc: true
- pgno: 40
  md: '當作保證金，交給開設帳戶的證券公司，以該「信用」為本進行投資。投資人最高可使用保證金評估值的三・三倍金額進行交易，這是信用交易的其中一個優點。¹


    假設將 100 萬日圓的現金存入信用交易帳戶，最高即可操作約 330 萬日圓的投資交易。能投入比本金更高的金額，就能更有效率地獲利，但反過來說，風險當然也會升高。


    以最高金額投資的話，就會形成「三・三倍槓桿」，但我希望...。槓桿一詞出自於槓桿原理，在股票的世界，以少量資金博得高獲利就稱為「槓桿效果」。


    容我再說一次，就算你能以 100 萬日圓的本金操作 330 萬日圓的投資，但仍請採取保守策略，操作 100 萬日圓本金即可。只要謹守「一倍槓桿」，就能避免因信用交易而出現超出本金的虧損，導致籌不出錢還款的慘況。


    當因信用交易而出現龐大虧損，使得本金大幅減少時，證券公司會要求追繳保證金。


    1 編註：目前台股的信用交易額度共分 15 級，從最低額度 50 萬到最高 6000 萬元。投資人可以視自己的財力狀況與交易記錄，決定申請哪一級。'
