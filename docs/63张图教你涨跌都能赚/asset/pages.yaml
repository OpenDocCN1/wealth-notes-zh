- pgno: 155
  md: '# 什麼是 N 大和反 N 大？


    股價趨勢由多空攻防戰形成，多方勝出即為上漲趨勢，空方勝出則為下跌趨勢。


    在多方與空方的戰場上，有時看似多方壓倒性獲勝，股價強勢上漲，但空方勢力回歸，股價在初期階段短暫下跌。而多方也不認輸，驅逐最後反擊的空方剩餘勢力，再度壓倒性獲勝。這種情況下，股價就會開始強勢上漲，形成真正的走勢。因為多方兩度抵擋住空方的攻勢，這種走勢一定會很強勁。


    具體顯現這類多空攻防戰的訊號，就是 N 大、反 N 大（圖 44）。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 反 N 大


    轉為 上漲趨勢

    20 日線

    原本往上突破 20 日線，

    後來下跌靠近 20 日線，

    <|start|>...再次轉為上漲


    轉為 下跌趨勢

    20 日線

    原本跌破 20 日線，

    後來上漲靠近 20 日線，

    結果再次轉為下跌


    # 此訊號發生在趨勢轉換初頭，因此可以獲得高收益


    5 日線由下往上突破 20 日線，轉換為上漲走勢時，又暫時跌回 20 日線附近，接著再次轉為上漲，這就是……，適合做多買進。


    5 日線原本由上往下跌破 20 日線，後來反轉上揚，逐漸靠近 20 日線，結果又往下墜，這就是……，適合做空。


    在股價因疫情而暴跌後的反彈回升中，N 大也能發揮極致威力。在 2020 年 3 月中旬的暴跌之後，5 日線突破 20 日線，形成 N 大訊號。之後股價持續上升，訊號非常準確。這種案例在許多個股中也可看見。


    除了均線，股價本身也會呈現 N 字形變動。這種變動容易出現在'
  merge: -1
  img_proc: true
- pgno: 157
  md: '壓力線和支撐線的高點、低點線，以及整數關卡。作為壓力線的高點或整數關卡一旦被突破，該股價線就會快速轉變為抵擋股價下跌的支撐線。


    股價突破壓力線之後，會一度下跌至原先的那條壓力線，投資人可以藉此確認這條線是否真的已經變為支撐線，如此一來，均線自然就會形成N字形。


    原先的壓力線變成支撐線，以及原先的支撐線變為壓力線，這種「角色轉換」經常發生在線圖上（圖 45）。


    以某個層面來看，N大可說是一種均線的類型。


    靠近之後又遠離，乍看之下彷彿是分岐訊號，但其實不一樣。N大訊號的5日線原本在20日線之下，接著由下往上突破20日線，然後跌回20日線附近，又再遠離20日線；反觀分岐訊號的5日線原本就在20日線之上，接著靠近20日線，然後又遠離20日線。兩者的差異就在這裡。'
  merge: -1
  img_proc: true
