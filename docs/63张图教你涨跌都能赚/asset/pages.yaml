- pgno: 192
  md: '# 當均線紊亂時，就休息


    當均線的排列狀態紊亂，訊號的精準度就會稍微下降，這時不妨就乾脆休息。


    我們假設在上漲趨勢中，原本均線的排列為 5 日線＞ 20 日線＞ 60 日線，結果 5 日線跌破 20 日線，進入 20 日線和 60 日線中間。


    如果 5 日線短時間內再次超過 20 日線，那上漲趨勢就會持續；要是不只跌破 20 日線，又繼續跌破 60 日線的話，則暗示將轉換為下跌趨勢。基本上投資人很容易從中進行買賣決策。


    但是，5 日線若未突破上方的 20 日線或下方的 60 日線，而是長時間陷入盤整狀態時，這種案例會很難判斷。接下來到底會再度超過 20 日線回到上漲趨勢呢？還是跌破
    60 日線進入下跌趨勢？曖昧不明的盤整股價實在令人傷腦筋。


    如果 5 日線有力地上下變動，股價看似往某個方向發展，而且伴隨下半身或反下半身訊號，那還可以讓人大展身手。'
