- pgno: 75
  md: '# K 線濃縮了 4 種資訊


    圖 17 顯示 K 線的結構。K 線的厲害之處在於，能夠將「該期間的起始價格、結束價格以及最高價、最低價」這四個資訊（開盤價、最高價、最低價、收盤價）濃縮在一根
    K 線中。相較之下，另一種常見的股票圖表——折線圖，只能顯示「股價和前一天相比是高還是低」。


    收盤價高於開盤價，就是「紅線」；收盤價低於開盤價則是「黑線」。


    日 K 線是以一根 K 線表示一天的股價變動；周 K 線是以一根 K 線表示一周的股價變動；月 K 線則是以一根 K 線表示一個月的股價變動。


    K 線的優點，是能透過形狀和顏色，呈現各個期間的股價變動。


    紅線的方形柱體（也就是中間實體部分）看起來很長時，稱為「長紅線」。長紅線代表開盤後股價持續上揚，而且在當天最高價附近收盤。連續出現長紅線時，代表上漲走勢很強；反過來說，「長黑線」則代表下跌走勢很強。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/c6d4133cb59b8266e40592e4f86e86ab_76_0.png)


    如果K線的上影線（方形柱體上方的線）很長，代表股價一時上漲，但之後失速下跌，即為強烈賣壓對抗高價的證據。


    反之，如果下影線很長，代表股價曾大幅下滑，之後反彈上揚。於是我們可以知道股票多方在最低價附近將股價拉抬上去。


    就像這樣，。'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'K 線是各自獨立的個體，當紅線和黑線交互出現時，由於它們的開盤價與收盤價的位置相反，因此難以一眼判斷其股價和前一天相比是漲是跌。


    圖13整理了各種K線組合，並針對這些組合的股價變動進行解說。圖中的紅線連接了每天的收盤價，稱為「收盤價線」。


    剛開始可能很難一眼分辨這些組合，但只要勤加練習就能越來越熟練。看了數百、數千次之後，只要K線排列映入眼簾，就能立刻看出股價和前一天相比是漲是跌了。


    我只要看到K線，別說是當天的股價變化了，連股價走勢的猛烈程度以及「今後的走勢氣息」都能一目了然。我通常都能靠今天的K線料中明天的K線。


    這部分我無法以文字說明，但在看見K線的那瞬間，我的身體……不，我的大腦就會自動開始反應。據說，厲害的操盤手一看見線圖，就能瞬間意會「現在該買進」或是「再等一下」。這樣的判斷並不涉及公司的業績表現，也無關圖上出現的訊號。因為當你一味地苦苦硬套理論時，就會被瞬息萬變的股價拋在後頭。請各位務必學習「感受的技術」。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '![](img/c6d4133cb59b8266e40592e4f86e86ab_78_0.png)


    # 圖18 陰紳解析


    在K線圖中，由於紅線與黑線的收盤價位置相反，當它們交互出現時，可能難以判斷股價呈上漲還是下跌走勢。此時不妨考慮暫停交易，觀望一下狀況。①在股價上漲時出現黑線，但收盤價比前一天高，未必代表上漲走勢變弱。②在股價下跌時出現的紅線也是同樣道理。③在出現黑線後，股價仍持續攀升，因此這只是上漲走勢稍作休息而已。④最後出現黑線的情況，有兩種可能發展：不是止跌就是逢高賣壓沉重。從⑤的第一和第二根K線可以知道逢高賣壓沉重，第三根黑線即反轉下滑，股價疲弱。⑥的K線變動不規律，難以預測走勢，結果盤整向下跌破。最後的黑線完全跌破最近的收盤價，股價露出疲態。'
