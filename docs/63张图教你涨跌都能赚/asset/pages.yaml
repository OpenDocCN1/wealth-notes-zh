  md: '股票投資的本質，就是預測股價會往上還是下。不過，股價非常陰晴不定，諸如「以為會上漲結果下跌」「以為會下跌結果上漲」這種「背叛」戲碼，根本是家常便飯，甚至會發生「看似上漲後會下跌，結果繼續上漲」「看似下跌後繼續下跌，結果果然下跌」這種複雜變動。如果股票是「紅旗白旗舉起來遊戲」²，鐵定會考倒每個人吧！


    一般而言，我們很難精準猜測這頭陰晴不變的生物，會往哪個方向走。


    前面提過，投資股票就像選舉，要進行「出口民調」來預測比較有優勢的候選股。當 5 日線往上揚，而且股價站在 5 日線上時，可以判斷「從過去五天的平均值來看，多方較有優勢」。均線就是進行出口民調的工具，用來調查多方和空方何者較具優勢。


    股價會不斷上下變化。「投票的走向」時時刻刻都不一樣，但只要掌握過去一段期間的投票結果平均值，就不用太擔心；因為這樣就可以掌握目前「多方黨」和「空方黨」的角力關係。


    在均線形成的出口民調中，務必要注意三點事項：


    2 編註：左手拿紅旗、右手拿白旗，聽指令動作，錯誤者淘汰的遊戲。常見口令如「紅旗舉起來、白旗舉起來、紅旗不要放下來、白旗不要放下來」。'
  merge: -1
