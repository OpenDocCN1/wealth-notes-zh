  md: "# 換資的真相 ③：疫情下的股市就像高爾夫球，基本功最重要\n\n股票的世界很像高爾夫球場。高爾夫球場遍布全國各地，各有不同的場內路線；股票也有上漲、下跌、盤整、暴漲或暴跌、反彈上揚或下墜等不同形態的「路線」。\
    \ \n\n專業的高爾夫球選手會配合球場的地形設計，擬定各種策略；但業餘人士不會面臨「今天採用東京高爾夫球場的打法，明天用千葉高爾夫球場的打法」這種情況，無論面對哪種球場，他們的策略都一樣。\n\
    \n從這次疫情中，我們可以看到第四個真相：不斷改變策略，是浪費微薄的夢。換句話說，「分析經濟情勢、公司業績」的策略，並不適用於疫情下的股市。\n\n身為散戶，我們唯一能做的就是老實練習基本功，來面對各種類型的高爾夫球場。用扎實的技術擊中小小的球，縮短你與果嶺的距離，進入果嶺後瞄準進洞。\n\
    \n如果只看公司業績表現來買賣股票，在這次疫情中，就會犯下「在3月中旬的谷底賣出，結果又在高點買進」的大錯。"
