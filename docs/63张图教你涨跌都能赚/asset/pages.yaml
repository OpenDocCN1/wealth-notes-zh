- pgno: 73
  md: '# 制伏股價怪獸的武器


    即使新冠疫情造成股價暴跌，仍有許多學生開心地告訴我：「這是我人生中最賺錢的時刻！」「一天就賺了 400 萬日圓！」


    我希望各位讀者也別畏懼股價的暴漲和暴跌，成為在股票市場這個戰場中冷靜攻防的戰士。


    如果只是呆呆地手拿一把竹槍，那根本不可能獲勝。散戶投資人必須將各式各樣的股票工具當作「武器」，然後勇敢和股價這頭猛獸戰鬥，將其制服，收編為寵物。因此，必須學習預測每一刻的股價變動。


    相場合投資術善用眾多武器，其中最基本的是「K線」和「均線」，以及各式各樣的相場合訊號。本章將介紹我們經常使用的兩個技術：「近期最高點、最低點」及「整數關卡」。如果你能連同第
    5 章介紹的相場合獨門訊號一起學會，就能有效提升買賣的精準度。


    那麼，為了讓初次嘗試投資的讀者能迅速理解，我先介紹最基本的線圖常識—— K 線。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '要靠投資股票賺錢，就必須成功在低點買進，在高點賣出；或是運用放空，在高點賣出，然後在股價變便宜時買回。


    K 線代表的就是股價變動本身，只要盡可能正確預測「下一根 K 線會比現在的 K 線高還是低」，就能在股票投資上獲利。


    對於操作「做多」的人來說，買進股票後連續出現「紅線」，就表示股價上漲，即能產生收益。有些線圖會將「紅線」用白色、綠色或紅色來顯示，本書使用日本最普遍的白色。¹


    對於操作「做空」的人來說，下單放空後，連續出現「黑線」，就表示股價下跌，有獲利空間。本書以黑色的 K 線表示。


    1 編註：台股線圖上的「紅線」多為紅色；「黑線」為黑色。'
