  md: '# 下半身、反下半身的重點是 5 日線的方向


    下半身是上漲訊號，反下半身是下跌訊號，判讀關鍵則在於 5 日線的方向。


    當 5 日線明顯往下走，即使突然出現站上 5 日線的紅線，也不算是下半身訊號。至少要在走平的狀態，最好是在 5 日線稍微往上走時，出現突破 5 日線的紅線，才算是完成下半身訊號。5
    日線是昇或微上走是下半身訊號成立的絕對條件。


    圖 31 顯示日本製鐵（當時的公司名稱是新日鐵住金）的股價變動。右邊的紅線 ③ 雖然突破了 5 日線，但是 5 日線完全呈現往下的方向，所以不是下半身訊號；而且股價也不符合「超過近期的高點」，無法組成組合技。這只是
    5 日線跌破 60 日線和 100 日線之後的短暫反彈上漲罷了。


    再提供一個注意事項：當股價過熱，走勢持續上漲時，下半身訊號特別容易被誤判。'
  merge: -1
