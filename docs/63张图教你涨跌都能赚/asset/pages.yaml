    +   • 例如，當指數大幅跌破之前的最低點時，代表正式開始暴跌。\n• 在暴跌後的反彈上升過程中，指數經常在漲回 20 日線或 60 日線等中長期均線時，又暫時回跌。\n•
    當指數或 5 日線不再低於之前的低點，且 20 日線從向下走勢轉為盤整，並再次上揚時，即暗示暴跌結束。\n• 當「實際指數」「5 日線」「20 日線」依序超越原先位在上方的
