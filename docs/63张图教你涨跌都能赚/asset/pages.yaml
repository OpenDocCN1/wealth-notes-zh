  md: '# 別忽視「近期的最高點和最低點」


    剛才提到股價陰晴不定，但股價其實也有很執著的一面。股價會記住過去曾發生慘痛經驗的價格水準，因此當股價來到該區間時就會出現特殊變化。或許有人會感到疑惑：「過去曾有慘痛經驗的股價？那是什麼？」以下就讓我再稍加說明。


    說到投資人的失敗經驗談，一定會有「買進後才發現那是近期的最高點，之後就下跌了，大虧一筆」，或是「放空後才發現已經是最低點了，後來股價就上漲，真是慘痛的失敗」。這是很可能發生在初學者身上的事，簡直是「買在天花板、空在地板」。


    無論什麼樣的股價線圖，股價都是呈鋸齒狀上下變動，一邊造出山頂和谷底，一邊往前推移。當股價撞到山頂就是最高點，正因為有人買在最高點，才會形成這個最高點。


    對打算買股的人而言，最高點是過去買股卻賠錢造成心理陰影的'
  merge: -1
  img_proc: true
- pgno: 90
  md: '價格。因此，當股價上漲至那個最高點，就會因為多方的恐懼心理和新的空方加入，使得股價下跌。


    這就是為什麼「壓力線」很容易發揮作用的原因。


    反過來說，當股價來到之前的最低點，曾在那個價格放空的人會記得「這是我曾經因為股價上漲而賠錢的價格」。因此，這個價格容易成為「支撐線」。



    下一頁是 大成建設的股價線圖，大成建設是負責建設東京奧運主場館的公司。大成建設在 3 月 23 日出現 2,755 日圓的低點，接著反彈上漲，在 Ⓐ（3 月
    27 日，最高價 3,395 日圓）、Ⓑ（4 月 10 日，最高價 3,415 日圓）、Ⓒ（4 月 30 日，最高價 3,420 日圓）形成 3,400 日圓壓力線，股價始終無法突破。


