  md: '# 圖例 下跌趨勢中的分岐訊號判別 PPP


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_131_0.png)


    # 圖 35 股神解析


    適合放空的「分岐」訊號成功關鍵，在於均線呈 60 日線＞ 20 日線＞ 5 日線的反 PPP。只要反 PPP 狀態持續，可能會發生很多次分岐，但早期的分岐比較容易成功。


    尤其下跌趨勢往往比上漲趨勢更猛烈，也有不形成分岐而持續下跌的案例。


    最好的情形是雖然黑線①突破 20 日線，但在黑線②出現反下半身訊號，判斷「漲勢疲弱，可能會發生分岐」，因此進行放空。'
