  md: '# 趨勢轉換型鳥嘴

    顯示股價的高空彈跳


    接下來看看反鳥嘴的典型案例，也就是加速轉換至下跌趨勢的訊號。下一頁顯示松本清控股公司在疫情帶來暴跌前後的股價變動，出現趨勢轉換型的反鳥嘴訊號。


    為了在趨勢轉換時形成反鳥嘴訊號，股價必須從離 5 日線、20 日線「相當遠的高處」大幅下跌，且在 5 日線與 20 日線交叉之前，20 日線必須往下走。


    股價必須發生如高空彈跳般的下墜，才能形成如般銳利的反鳥嘴。只要點亮這種反鳥嘴訊號，股價一定會發生猛烈的下墜。


    在松本清控股公司的股價線圖中，黑線①以反下半身訊號跌破藍色的 60 日線，此時就是進行放空的時機。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 圖解圖 趨勢轉換為最跌前的「反鳥嘴」


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_147_0.png)


    # 圖 41 股神解析


    A區出現「趨勢轉換型反鳥嘴」，股價從原先的上漲趨勢進入天花板的盤整狀態，接著就一躍而下。由於劇烈下滑的股價帶動20日線往下走，因此完成反鳥嘴。


    在黑線①跌破5日線和20日線，並對60日線形成反下半身訊號時，投資人就可以預測「反鳥嘴可能出現」，迅速在黑線①放空。鳥嘴比其他訊號難出現，但出現之後的預測準確度很高，是它的魅力所在。順帶一提，B區的綠色20日線走平，因此雖然股價上漲，但不是鳥嘴。'
