  md: '# 實戰時，要看好

    股價和均線的關係


    實際操盤時，最需要注意的是股價和均線的相對位置。股價和5日線的排列順序經常在變化，當位於5日線之下的K線突破並站上5日線時，代表短期的上漲走勢變強。反之，當位於5日線之上的K線跌破5日線時，就表示即將開始強勢下跌。


    均線就像是阻擋股價變動的「高牆」或「軟墊」。如果股價碰觸均線，卻始終未突破，就表示目前的趨勢仍會持續；一旦突破均線，可能意味走勢變強勁，或是往反方向變動，有各式各樣的變化。總之，均線和股價的相對位置就非常重要。


    圖20就是很好的範例。①是均線阻擋股價變動的高牆案例；②則是均線支撐股價的軟墊案例。


    此外，均線並不只會發揮如護欄般的作用，也會發生如③的狀況：股價突破均線。'
