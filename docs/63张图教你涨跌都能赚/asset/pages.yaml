- pgno: 41
  md: '股價暴跌通常比股價上漲走勢猛烈，其中一個原因就是追繳保證金。有些投資人使用信用交易進行部位操作，卻超出了本身可負擔的金額，由於追繳保證金而使得手頭現金不足，最後只好含淚將持股拋售，加劇了股價的下跌走勢。


    如果總是以最高額度的槓桿進行交易，勢必會經常遭遇危機。希望各位不要太貪心，以穩健、從容的心態持續投資股票、扎實獲利。


    習慣信用交易的操作方式後，就可以嘗試在極有把握時進行高槓桿交易。在此之前，初學者請從最小額度開始勤加練習。'
