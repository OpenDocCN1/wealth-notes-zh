    在 PPP 狀態下買進的原因百百種。在紅線③買進的人認為下影線很長，預測股價會上漲，因此早期進場。在黑線②買進的人認為 PPP 狀態中股價下跌，但在 20
    日線止跌，判斷「股價差不多要上漲了」，因此買進。在黑線③買進的人則認為股價在 PPP 狀態中出現下半身訊號，便信心十足地買進。


    但即使在 PPP 狀態下，股價也會走到天花板，一旦在箱型股價區停滯，無論何時買進都不會成功。從箱型股價區的股價變動，和嘗試買進卻投資不順的狀況中，如果能盡早察覺「這裡是天花板」，就能對於股價之後的下跌走勢有所防備。在上圖的右半邊，反
    PPP 完成後，股價也同時止跌了，有時候要是等著 PPP 或反 PPP 完成就太遲了。'
