- pgno: 50
  md: '# 股價暴跌時

    也能善用「9日法則」


    請看下一頁，這三張圖都是日經平均股價指數的線圖，最左邊是2020年疫情造成的暴跌（以下稱為「疫情暴跌」），中間是2018年1月至2月發生的暴跌（以下稱為「2018年1月暴跌」），最右邊是2016年11月至12月川普當選美國總統時的暴漲（以下稱為「川普暴漲」）。


    「9日法則」將開始上漲或下跌的起始K線訂為「第一根K線」。請注意，


    如果是下跌，連續出現黑線，就「2、3……」繼續數下去。即使得途中出現紅線，只要收盤價未大幅超過前一根K線的開盤價，或是未站上5日線，就繼續數「2、3、4……」。


    然後，持續下跌到第九根K線，就可以判斷「接下來下跌的走勢應該會變弱」，在此停利，這就是9日法則的基本規則。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 圖解秘訣 「9日法則」幫你在暴跌暴漲中找出停利點


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_51_0.png)


    # 圖11 股價解析


    在股價暴跌、暴漲過程中，一旦下跌或上漲期間拉得很長，投資人就容易對於膨脹的收益感到焦躁，導致太早停利。


    此時，可以把「9日法則」當作「延長獲利」的工具。這不僅適用於疫情造成的暴跌，綜觀歷史上的暴跌、暴漲，可以發現從起漲／起跌的高低點開始算起，股價會在第九根K線前後暫時結束強勁的變動。


    只要善用這個法則，就不用擔心預測正確卻馬上讓大魚溜走。請記住「9日法則」，將目標放在「擴展獲利」和「壓縮損失」。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '當然，並不是每次趨勢都會持續九根 K 線。圖 的「疫情暴跌」就顯示第一波下跌在第七根 K 線出現紅線，結束下跌趨勢（雖然在第四根也出現了紅線，但收盤價未大幅超過前一根
    K 線，因此繼續持有）。


    第二波也符合 9 日法則，在下跌的第九根 K 線出現紅線，可以停利。


    同樣看圖，在「2018 年 1 月暴跌」的第二波下跌中， 出現了紅線，但收盤價還是沒有大幅超過前一根 K 線，所以繼續持有；接著在 停利，就算是大功告成了。而「川普暴漲」的第一波上漲中，雖然在
    ③、⑤、⑧ 出現黑線，但仍應繼續持有。到了第九根 K 線當然可以停利，不過走勢持續到了 ⑫。第二波上漲則應在 ⑧ 的黑線停利，最為理想。


    掌握這個法則後，你是否覺得股票變得更輕鬆了呢？即使在暴跌中操作放空，也不必慌慌張張地停利。以第九根 K 線當作標準，就能從容延長獲利機會。無論股價變動再劇烈，任何走勢都很少持續超過九個交易日。當然，過去也曾出現過超過
    9 日，一路來到「10、11、12……」的連續上漲或下跌，但請記住「捨頭去尾取中間」這句投資名言，老實在第九根 K 線停利吧！'
