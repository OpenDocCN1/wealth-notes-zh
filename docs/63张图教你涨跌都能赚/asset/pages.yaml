- pgno: 208
  md: '# 後記


    # 散播股票投資的美好


    本書不只收錄成功案例，也大量介紹了失敗案例，讀者可藉此了解相場式訊號適用的地方、不適用的地方以及容易出錯的地方，徹底驗證我們介紹的交易訊號。


    當新冠疫情造成股市股價暴跌的時候，我開始執筆本書，但這次的暴跌和過去不同，之後並未出現反轉下跌或是第二谷底這類現象，而是持續直線反彈上揚。


    別說是疫情造成的衝擊了，這簡直是疫情泡沫化。


    股價暴漲時要注意什麼？沒錯！就是最高價所形成的箱型股價區。閱讀過本書，一定馬上就能想到。


    此外，當股價數次挑戰整數關卡卻無法成功，以及長短期的均線互相靠攏時，請好好觀測接下來的走勢變化。'
  merge: -1
  img_proc: true
- pgno: 209
  md: '如果股價持續陷入疫情泡沫化，那就善用分岐訊號，等待暫跌買進點，進場買進後再運用 9 日法則，將獲利延伸到最大。


    日語中有這麼一句話：「『學』是模仿，『習』是熟悉。」


    從疫情發展以來，種種現象已經證明，股價變動並非反映經濟的變化，而是反映人心的一面鏡子。因此，未來的變化一定都能從過去的股價變動中看出端倪。


    人心不會進化成電腦，所有股價變動源是延續人類所經歷過的。


    只要向過去學習，就能拋開驚慌和焦慮。對我的股票道場的學生來說，暴跌不過是司空見慣的現象。


    至於疫情帶來衝擊之後扶搖直上的股價，也如同本書提到「暴跌後必有反彈上漲」的道理，只要明白這個道理，就能輕鬆獲利。


    所有的答案都寫在股價線圖上。當 5 日線突破 20 日線之後短暫下跌，形成 N 大訊號，此時進場買進，就能輕鬆開關獲利之路。只要模仿過去的經驗即可。


    這本書並不局限於疫情暴跌前的「微幅震盪」和在那之後的「極端下跌」，也羅列了後續發展的線圖。'
  merge: -1
  img_proc: true
- pgno: 210
  md: '因為暴跌之後緊接著的是，股價從谷底復活以及之後的微幅震盪，還有往上或往下走的可能性。


    我所精心挑細選的這些範例線圖，是各位在新冠疫情時期操盤時，一定會遇到並且獲利的場面。


    本書所匯集的內容，無論過去、未來的任何時代，都能派上用場。搭配相場式訊號的細心解說，將讓這些訊號成為投資的鋒利工具。


    無論疫情是否帶來衝擊，股價變動原理都沒有太大的變化，但我本人卻因為疫情而有一點點不同了。


    我學會使用線上視訊工具 ZOOM，可以運用「分享畫面功能」，輕鬆將相場式訊號畫在電腦的線圖上，實際演練相場式股票技巧。


    話雖如此，我還是想和各位直接面對面，凝視每一雙眼睛，帶著笑容伺機插入笑話，以未經機器壓縮的聲音，將投資股票的美好和各位分享！


    我想和與我一樣熱愛股票的人，在充滿溫度、熱情的空間相聚；交流切磋投資技術！


    我所經營的股票道場長年透過非營利組織「日本全球孩童疫苗募'
  merge: -1
