- pgno: 197
  md: '# 暴跌後的反彈停在

    60 日線，就休息


    在下跌趨勢中，即使股價轉為上漲，在碰到上方的 60 日線時又回跌了，這種個股在新冠疫情期間也常出現，這是投資人應該休息的代表案例。請看圖 59 電影公司東寶的股價線圖。


    東寶的股價暴跌到 3 月中旬，後來雖然因為新冠疫情的影響，電影院持續歇業，但股價仍反彈回升。股價碰觸到地板後，5 日線的低點和高點屢創新高，可以視為氣勢相當強勁的反轉上揚。


    在暴跌後仍不確定是否會持續反轉上揚的走勢中，會就碰一波圖跟藍色 60 日線的膀價「攻防戰」。無論任何型態的暴跌，在反轉上揚時都會面臨這場攻防戰，這是股價暴跌後的特徵。


    在圖 59 的放大圖之中短暫形成了 Ⓐ 的箱型股價區，亮起下半身訊號的紅線①突破了箱型股價區的上限，是相當適合挑戰的買進點。'
