  md: '# 反 PPP 的成功與失敗差距


    反 PPP 狀態下的放空操作，和 PPP 狀態下的做多重點相同，重要的是從走勢的停滯和 5 日線的上下波動中判讀情勢。


    在圖 35 的 NTT 股價線圖中，股價從上漲轉為盤整，然後在 A 區開始下跌。「股價、5 日線、20 日線」跌破「60 日線、100 日線」，完成了反 PPP
    狀態，緊接著在 B 區還發生了分岐訊號。


    後來，股價在 C 區受到 20 日線的壓迫，轉為下跌，出現代表反下半身訊號的黑線 B，又再度發生分岐訊號。這根黑線 B 就是進場放空的時機。從下跌的起點紅線
    a 開始數，在剛好第九根 K 線的黑線 C 停利，是反 PPP 狀態下理想的放空操作。


    這種狀況請注意 60 日線和 100 日線這兩條長期均線的排列變化。當 60 日線位於 100 日線的上方，且兩條線靠得非常近時，可以想見當股價持續下跌，不久後紫色的
    100 日線就會變成在最上方。


    長期均線的排列變化，以及預想變化的發生，都有加速股價下跌'
