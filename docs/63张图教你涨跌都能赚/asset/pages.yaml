  md: '接下來，股價在黑線②突破了 60 日線，但因為是黑線，給人氣勢疲弱的印象，接著連續兩根黑線，股價跌破 60 日線。


    這個小回跌正是股票投資適合休息的時候。包含黑線②在內，連續出現三根黑線，而且跌破了 60 日線，令人不禁考慮是否該做空，但是股價並未跌破箱型股價區Ⓐ的下限和綠色的
    20 日線，也無法確定會加速下跌。話雖如此，因股價跌破了箱型股價區Ⓐ的上限，所以也不敢繼續做多。


    決定觀察後，看到接著出現的長紅線③對 5 日線和 60 日線都形成下半身訊號，而且在箱型股價區Ⓐ的上限（3,500 日圓的整數關卡）反轉上漲，因此重新買進才是正確選擇。'
