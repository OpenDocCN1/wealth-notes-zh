- pgno: 32
  md: '這是一場前所未有的大規模實驗，測試「零營收或無法預測業績的企業股價如何變動」。別依賴基本面分析，這就是這場實驗帶來的實責教訓。


    ![](img/c6d4133cb59b8266e40592e4f86e86ab_32_0.png)


    專家也是會犯錯的。2020 年 3 月股市暴跌時，許多投資名嘴認為「今年股市會很慘」「接下來幾年內業績都會一蹶不振，因此股價也不會漲」，但結果如何呢？相信大家現在都非常清楚。


    例如選舉前，大眾媒體會進行出口民調來預測結果。線圖能夠顯示目前投資人在「多」「空」之間的投票選擇。假設投票結果顯示投給「空」的人較多，就能毫不猶豫地透過放空賺取收益。


    眾所皆知，股票就像投資人之間的人氣投票。如果投給「買進」的人較多，股價就會上漲；投給「賣出」的人較多，股價就會下跌，這是相當簡單的原理。'
