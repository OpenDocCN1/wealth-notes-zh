- pgno: 189
  md: '# 切身感受股價

    發生變化的緩慢時光


    我先前介紹過看千張線圖的練習方法，基本上我很重視大量練習，以及經年累月後融入骨子裡的學習效果。


    不過，這個練習必須經過一段長時間才能產生效果，這是唯一的缺點。即使你能感受到「如果變成這樣，之後就會變成那樣」的股價變動模式，也無法切身感受股價發生的緩慢時光。


    但是，每天進行數檔個股的「線圖鑑賞」，不只能幫助你體會股價產生變化的時刻，也能感受到股價尚未發生變化的時光。


