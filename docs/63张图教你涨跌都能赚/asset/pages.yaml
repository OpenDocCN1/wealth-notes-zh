- pgno: 188
  md: '# 養成每日鑑賞

    個股線圖的好習慣


    話雖如此，我也知道即使明白前述的道理，股票投資就是讓人欲罷不能。因此，我建議各位迷途羔羊，要做好一項與交易無關的功課：每天一次在固定的時間，觀察二至三檔個股。


    請各位如同觀賞庭院花朵或美術館的西洋繪畫般，以無欲無求的心態觀察個股。藉由每天觀看數檔個股，就能發現諸如「今天和昨天相比沒有明顯的變化」「噢？和昨天相比有一點變化」「好像會發展出新的趨勢」這樣的細微改變，並且在同一個時間軸上體驗這些變化。'
