- pgno: 185
  md: '# [N 大／反 N 大訊號]


    N 大是我本人很喜歡的訊號。由於此訊號會在趨勢轉換初期正確告知股價走向，常常能讓投資人獲利，非常好用。


    不過也有趨勢轉換氣勢疲弱，導致預測失敗的案例，此時請注意 5 日線的低點節節升高或高點節節下降的狀況。當 5 日線的低點節節升高，面對 20 日線亮起 N
    大訊號時，就代表股價將轉為非常強勁的上漲趨勢。


    # [PPP／反 PPP 訊號]


