  md: '# 交易活絡的 ETF 也 OK


    在股票市場上市的 ETF（指數股票型基金），如果資產規模在數千億日圓以上，而且每天的交易都很活絡，即是適合投資的標的。


    提到 ETF，就不得不提日股最近的大客戶——日本銀行（以下簡稱「日銀」）。每當 ETF 價格下跌，日銀就會快速買進護盤。在日銀的護盤加持下，價格變動穩定。這種類型的股票，就很適合成為初學者實踐相場式投資術的第一檔標的。


    圖 13 是野村資產管理公司發行的東證股價指數連動型 ETF 股價線圖，這也是日銀投資的其中一檔 ETF。


    這檔 ETF 的資產規模超過 10 兆日圓，每天成交量通常有 200 萬至 400 萬股。而與日經平均股價指數連動的「日經 225 連動型 ETF」（同樣由野村資產管理發行）也有超過
    6 兆日圓的資產規模，單日成交金額也相當可觀。如果想「直接」以日經平均股價指數的指數變動操作，不妨就投資這檔 ETF。'
