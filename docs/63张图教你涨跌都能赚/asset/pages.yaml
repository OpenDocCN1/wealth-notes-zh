  md: '# 鳥嘴和反鳥嘴

    少不了耐心觀測


    鳥嘴訊號的上漲氣勢強勁，準確度也很高，也許依照訊號下單後會有點擔憂，但只要再忍耐一下不要停損，常常就會得到甜美的結果。面對失誤，盡早撤退是鐵則，但漂亮的鳥嘴訊號可就是例外了。


    圖 42 是水產公司丸羽日朗的股價線圖。綜觀整張圖，可以看到漂亮的「下跌、盤整、上漲」圖形。其中，Ⓐ點出現了鳥嘴。


    20 日線向上走，代表過去盤整的局面見底，股價劇烈震盪，使 20 天的平均股價依然上漲。在這樣的背景下，Ⓐ區的 5 日線與 20 日線交叉，形成銳利的角度，完成了鳥嘴。


    從 20 日線上揚這點來看，可以知道上漲氣勢非常強，此時出現站上 5 日線和 20 日線的紅線①，也亮起下半身訊號，在此時買進就是投資的正確步驟。'
