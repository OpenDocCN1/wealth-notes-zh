  md: '# 股價漲跌有固定型態


    從日本火腿的案例也可以知道，股價從上漲轉至盤整，再轉為下跌趨勢的過程中，有其一定的「型態」。均線的排列變化、止跌之後又再度跌破低點下墜、從谷底反轉上漲之後又再度下跌……無論什麼樣的下跌都有共同的型態。雖然並非所有的暴跌和暴漲都完全相同，但如果事先做好功課、仔細檢視過去的案例，就有辦法應付所有的股價走勢。


