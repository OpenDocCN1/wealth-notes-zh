    # 投資黃金法則⑥：發掘自己的好球帶


    很遺憾，這次疫情中有不少人慘賠作收，但是也有人實踐相場式投資技術後，締造「人生最賺錢的時刻」。各位不妨抓準股價劇烈變動的機會，將「暴跌」訂為自己的「好球帶」。股票風暴節有獨特的軌跡，只要能成功看出徵兆，就能迎來好結局。


    請看圖 7，這是在疫情爆發前，2018 年 12 月至 2019 年 1 月上旬的日經平均股價指數變動。


    右上角是 2020 年 2 月以來因疫情而暴跌的走勢，兩相比較之下，除了部分細節上的差異外，兩者可說是非常相似。'
