    我們來看看具體的分岐訊號典型案例。成功的關鍵在於均線的排列。首先介紹從放空開始操作的分岐訊號。


    下一頁圖...是比價購物網站 Kakaku.com 的日 K 線圖。圖的左邊顯示「股價、5 日線、20 日線」依序跌破「走平的 60 日線、100 日線」，股價從盤整轉為下跌的趨勢。均線形成反
    PPP，股價開始下跌。


