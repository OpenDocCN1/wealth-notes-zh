  md: '# 分岐容易因為遇到天花板或地板而失敗


    分岐訊號通常發生在走勢暫歇的時候，而走勢並非永無止境。


    當股價上漲至出現過熱，多數的多方就會開始考慮賣出。此時，越來越多認為「股價過高，多方勢力也減弱，差不多該放空了」的空方也會加入戰局，形成多空抗衡的局面。股價陷入盤整之後，如果空方勝出，股價就會急速下跌，轉而進入下跌走勢。


    本以為是走勢暫歇，結果是轉換走勢。此時承受的傷害通常很大，請多加注意。


    圖37是博報堂DY控股公司的股價變動。A區和B區的分岐訊號都成功了，但C區的分岐訊號卻失敗了。


    在看似形成分岐訊號的紅綠①買進之後，迎來的是黑線，然後紅線，股價在這兩個交易日的震盪之後轉為下跌。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '![](img/c6d4133cb59b8266e40592e4f86e86ab_136_0.png)


    # 圖 37 觀念解析


