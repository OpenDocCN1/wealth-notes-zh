    # 當沖的交易資本：現況核實


    你可能已經提撥一筆資金準備交易。我們先談交易資本的問題，

    檢討相關的現實層面，內容或許有些傷感情，卻是必要的。此處需要

    考慮兩個重要法則：


    # 法則一、不能害怕交易資金虧損


    換言之，運用於交易的資金，即使虧損也不會影響你與家人的生

    活。如果交易資本禁不起損失，交易決策就會受到恐懼情緒干擾。你

