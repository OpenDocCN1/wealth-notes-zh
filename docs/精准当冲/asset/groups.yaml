    # 放空操作的禁忌


    不要在建立空頭部位後，就外出逛街、出遊，除非你已經設定自動化回補停損。再說，有時候看著標的股票價格下跌也蠻有趣的。看著股價下跌而自己的荷包受惠，那種感覺就像看著敵對球隊的四分衛被擒殺。過去，我們經常因為多頭部位價格下跌而受害，現在終於可以體會加害者的感受。'
  - '[PAGE 375]


    不要放空日線圖呈現上升趨勢的股票。放空對象應該處於下降趨勢，或正處於向下反轉的價格型態。對於部位交易，標的股票需要預先查核《投資人經濟日報》的「綜合評等」。放空對象的綜合評等必須在
    50 或以下。


    不要只因為你認為價格太高而放空股票。我還記得雅虎當初成為網路熱門股票的情況。1998 年 3 月，雅虎股價來到 100 美元大關，價格每天變動好幾點。當時價格如此劇烈波動的股票並不多見。不少口袋很深的交易者，在雅虎股價觸及
    99 美元時進場放空。他們幾乎把所有財產都押進去，放空了成千上萬股。可是，雅虎還是帶著一抹微笑，揮揮手，順利越過 100 美元大關。放空交易者只能咬緊牙關硬撐，宣稱沒有任何東西可以漠視地心引力，包括雅虎股價在內。但雅虎股價還是持續走高。事實上，有很長一段時間，該股票都沒有回頭。這段走勢讓很多人傾家蕩產，並且讓很多交易者永遠出局。


    你會懂得更多。閱讀本書後，你看到某些股票夾著大量向上突破，判斷其價格將持續走高。你是正確的。


    不要試圖從空邊搶帽子，如果你是剛入門的初學者。先累積經驗，再從事這類高風險行動。放空對象除非是 ETFs 或股指指數期貨迷你契約，否則向上跳動的規定會讓放空操作相當費神，不容易精確拿捏。為了區區
    25 美分賺頭，不太值得這麼做。


    不要放空成交量不大的股票；換言之，不要放空每天平均成交量不超過 30 萬股的股票。事實上，不論是做多或放空，這類股票都不適宜。'
