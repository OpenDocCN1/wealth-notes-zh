    知道結果，不妨叫出股價走勢圖與 TICK 指標，然後仔細比對。


    另一種深具參考價值的市場內部指標是 TRIN，該指標是由理查·阿姆斯（Richard Arms）在 1967 年設計。TRIN 是「交易指數」（Trading
    Index）的簡稱，也稱為「阿姆斯指數」（Arms Index）。


    TRIN 主要衡量價格波動率，其讀數通常和 TICK 保持反向變動關係。TRIN 讀數偏低，代表市場由多頭主導；TRIN 上升，代表空頭慢慢取得市場控制權。


    如同 TICK 的情況一樣，每個交易所都有自家的 TRIN。


    各位可以透過直接下單平台取得紐約證交所資訊，這也是最多交易者使用的版本；截至目前為止，多數網路折扣券商並不提供這項資訊給客戶。至於 CNBC 螢幕下側，每隔一段時間就會顯示
    TRIN，通常擺在 TICK 後面。


    同樣地，我的電腦螢幕採用 5 分鐘走勢圖顯示 TRIN 資訊，和 TICK 走勢圖並列，並與其他市場提示擺在一起。請注意，這兩種內部指標並列有個優點：兩者的變動方向基本相反。


    TRIN 的計算公式如下：


    ```

    上漲家數／下跌家數<br>上漲成交量／下跌成交量

    ```


    如同 TICK 一樣，TRIN 也是短線交易指標。TRIN 可以偵測成交量流向。當指標讀數低於 1 時，代表大部分成交量流向上漲股；相反的，當指標高於 1
    時，代表大部分成交量流向下跌股。換句話說，當指標低於 1 時，通常視為多頭市場；指標高於 1 時，則視為空頭市場。'
