    # CCI


    CCI 是由一條曲線構成的超買／超賣擺盪指標，該指標最早由記者唐納·蘭伯特（Donald Lambert）運用於商品交易。


    ## CCI 為何重要


    CCI 是衡量目前價格相較於統計平均數的位置。


    ## 如何運用 CCI


    CCI 可以直接用其超買／超賣讀數，也可以用其與價格行為之間產生的多頭背離與空頭背離。CCI 指標計算的預設期數為 14 期。


    - 超買：CCI 讀數超過 +100 為超買。

    - 賣出訊號：CCI 由 +100 以上折返。

    - 超賣：CCI 讀數跌破 −100 為超賣。

    - 買進訊號：CCI 由 −100 以下折返。

    - 替代性買進（賣出）訊號：價格向上（向下）穿越中線（0 線）。


    ## 新手筆記


    1. 隨機指標運用於盤中走勢圖，開盤跳空線形經常造成指標讀數與訊號扭曲。

    2. 日線圖上的超買／超賣資訊，應該運用於當沖交易。從事當沖交易過程，如果知道相關股票處於超買或超賣狀態，往往有助於瞭解下午盤的價格為何漲跌。


    如同隨機指標一樣，CCI 波動相當劇烈，我通常將其運用於較長期的時間架構，譬如日線圖與週線圖，協助確認交易決策。很多交易者將其用為盤中走勢圖的進場訊號。不論各位交易的時間架構如何，CCI
    最好配合其他工具確認買進／賣出訊號。


    圖 7-19 顯示 CCI 如何運用於嬌生（Johnson & Johnson，JNJ）日線圖。


    # MACD


    MACD（麥克 D）是英文「移動平均收斂發散」指標的字頭語，此指標的設計者是著名技術分析師吉拉·亞培爾（Gerald Appel）。


    MACD 是運用移動平均方法建構的技術指標，所以走勢相對穩定，波動不至於過分激烈，深受許多投資人與交易者喜愛。我們運用這套由兩條曲線構成的系統，協助擬定進場和出場決策。


    ## 內容


    走勢圖上，MACD 繪製為 2 條線，MACD 線與訊號線。如同其他擺盪指標一樣，MACD 繪製於價格和成交量並列的另個面板上。MACD 線代表快速線，計算公式取
    12 期 EMA 與 26 期 EMA 相減的差值。


    訊號線代表慢速線，取 MACD 的 9 期 EMA。多數交易軟體計算 MACD 的預設參數值，就是取前述 12-26-9 組合。


    有些使用者偏好把 MACD 指標繪製為直方圖，某些套裝軟體則允許使用者選擇採用兩條線或直方圖的 MACD。


    ![](img/468d7cacb0b269ef1c907b6846010599_215_0.png)


    圖 7-19 嬌生（JNJ）日線圖。股價波動如果相當劇烈，CCI 也會跟著跳上跳下，就像吃了興奮劑的袋鼠，訊號不斷反覆。就此例來說，CCI 及早發生的多頭背離與空頭背離，顯然有助於擬定買進和賣出決策。研究每個超買與超賣訊號、多頭與空頭背離，以及它們與價格行為之間的關係。4
    月初向上翻升的走勢還在進行中，可能遭遇上檔 50 天均線壓力。另外，美國證交所製藥類股指數（JNJ 為該指數成分股之一）目前處於下降趨勢。我們持續觀察 CCI、50
    天移動平均與其他技術指標，藉以決定是否進場。


