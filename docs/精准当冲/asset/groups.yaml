  md: "\n## 新手隨堂考\n\n### 題目\n\n- 01. 關於搶帽子，其交易風格、交易規模，以及風險／報酬比率如何？\n- 02. 某些數字水準在支撐／壓力方面扮演什麼功能？\n\
    - 03. 關於搶帽子交易，最佳買進－賣出報價之間的碼差最好是多少？\n- 04. 列舉 3 種理想的搶帽子交易架構。\n- 05. 對於多邊搶帽子的交易，買進報價或賣出報價的深度更重要？\n\
    - 06. 如果要追買某支走勢快速的股票，只要採用市價單就可以了。正確或錯誤？\n- 07. 你持有賺錢的搶帽子部位，突然看到期貨行情暴跌，TICK 急跌穿越零線，買進報價排隊的造市者人數快速消失。如何結束部位？\n\
    - 08. 何謂「向上跳動的規定」？\n- 09. 某股票觸及包寧傑帶狀上限，但收盤價不能穿越，次日線形下滑，後續走勢可能如何發展？\n- 10. 波段交易想要尋找放空對象，觀察日線圖處於下降趨勢的股票，價格低於\
    \ 20 天移動平均，最好也低於 50 天移動平均和 200 天移動平均。正確或錯誤？\n- 11. 股票呈現下降趨勢，成交量應該要放大？\n- 12. 持有空頭部位的股票，價格如果上漲，起始回補停損單也應該跟著往上調整。正確或錯誤？\n\
    - 13. 適合放空的頭肩頂型態，______ 肩的成交量應該縮小。\n- 14. 成交量不足的股票，特別適合放空。正確或錯誤？\n\n### 答案\n\n\
    - 01. 每天通常要進行好幾筆交易，每筆交易的股數為 500-1,000 股，風險／報酬比率為 1:2。\n- 02. 對於支撐／壓力功能來說，整數扮演重要角色，半整數也很重要。\n\
    - 03. 對於搶帽子交易來說，最佳買進－賣出報價的價差，最好不要超過 1、2 美分。\n- 04. （1）盤中走勢呈現橫向整理。（2）呈現 20 分鐘或更久的狹幅橫向穩定盤整。（3）絕大多數線形都收在最高價附近。\n\
    - 05. 建立搶帽子多頭部位，買進報價應該要有足夠的深度。\n- 06. 錯誤。這只適合用來向另一半解釋股票交易為什麼賠這麼多錢。\n- 07. 原本賺錢的搶帽子交易突然逆轉，可以採用限價賣單出脫部位，價格設定在當時最佳買進報價下方\
    \ 1、2 檔。\n- 08. 股票價格向上跳動才允許放空。換言之，股票最近成交價格必須向上跳動，或向上零跳動（先前成交價格向上跳動，最近成交價格沒有跳動）。\n\
    - 09. 價格很可能向下發展，可能朝包寧傑帶狀下限發展。\n- 10. 正確。\n- 11. 不。\n- 12. 錯誤，絕對禁止。\n- 13. 右肩。\n\
    - 14. 只適合追求刺激的人，或者交易帳戶有錢可供損失的人。\n\n## 培養頂尖交易者思維\n\n### 創造豐盛的心態\n\n> 「可是，你要知道，如果願意的話，你可以達到完全的財務獨立。這將有助於提升你的意識，藉以適應這種程度的完整性。」\n\
    \n——約翰·蘭多夫·普萊斯《豐富之書》\n*John Randolph Price, The Abundance Book*\n\n每個人都有權享有豐盛與富足。然而，為了吸引它，我們必須主導自己的信仰和思想。不僅要關注自己做了什麼，還要給周圍的世界貼上標籤。\n\
    \n豐盛與否，反映我們的思想水準。舉例來說，個人或許不能對全球經濟直接產生影響，但當我們不斷抱怨這些情況，就會抱持負面態度。這種負面情緒對生活造成重大影響，也影響我們身邊的人。\n\
    \n你是否仍堅持那種正義蘊含於貧窮的信念？你的思想或談話，是否經常夾雜著「我不能」、「我恐懼」、「我不知道如何」、「不夠」等。不妨把這類感覺取代為富足、充裕與自我價值。\n\
    \n相信自己是個特殊的人。你有著獨特的認知。生活偏向於療癒、勝利與成功。\n\n設想內在和外在富足是你的權利。你的思想應該專注於自家祝福，而不是你認為的匱乏或局限。擴展對於自己生活的信心。創造有助於發展正面結果的心態，並將它們彙整到自己的經驗中。\n\
    \n## 擁抱虧損：此乃交易者的摯友\n\n各位看到本章標題，可能會建議我到醫院檢查精神狀態，但請各位先聽我慢慢道來。\n\n交易生涯的成敗不在於所得獲利，而是交易虧損——即如何管理虧損，從中汲取教訓。\n\
    \n蘇格拉底曾說，未經檢視的生活不值得過。而未經檢視的交易虧損，會送你到排隊領救濟便當。相信我。我不僅一次曾經如此，手上還拿著湯匙。\n\n學習交易最重要的事情，就是記錄交易日誌。這不是自我鞭撻。事實上，我稱此為「成功旅程日誌」——處理得當的話，其功能就是如此。\n\
    \n找一本綠色（鈔票顏色）封面的筆記本，或設立一個電腦檔案夾。每天交易結束，就記錄股票報價代碼、進場價格、出場價格等。第一句話請寫：「我進行這筆交易，因為……，」然後寫下理由。\n\
    \n你可能基於很好的理由建立部位：明確的價格型態、高勝算架構、1：3 的風險／報酬比率、完美進場點、有效的由上而下交易準則。可是，交易仍然虧損。紀錄的第一句話是：「這筆交易虧損是因為……。\
    \ 」這方面記錄不需自我批評，只需客觀列舉交易失敗的理由。千萬不要引用情緒性字眼，譬如「愚蠢」或「蠢蛋」等。單純的就事論事，然後，研究這些事實，以及各種選擇。\n\
    \n最後，註明「將來如果發生類似情況，我會……。 」列舉你準備採取的各項步驟。下一次，你打算如何有效保障交易資本？如何確保交易成功？\n\n你如果執行一筆極端完美的交易，也請把內容納入交易日誌。研究該筆交易過程，學習如何汲取成功啟示。\n\
    \n隔天早晨，翻閱昨天記錄的成功旅程日誌。有時間的話，不妨翻閱過去的紀錄。\n\n前文曾說過，人們如果寫下特定目標，其效力將明顯超過單純地擱在腦海裡。這也包括交易日誌在內。我認識的成功交易者，大多在交易生涯初期就養成記錄交易日誌的習慣。這個習慣對於各位的成功絕對有幫助。\n\
    \n### 七種「致命情結」：如何保障資本，再活一天\n\n讓我們敞開心胸，談談某些經常發生的失敗情況，好好檢討。我曾親身經歷這些失敗，但各位沒有必要如此。\n\
    \n#### 情節 1：災難發生\n\n大盤走勢強勁，你買進某支走勢強勁的股票且買點絕佳。可是，幾分鐘後，CNBC 突然發布重大利空消息。市場發展急轉彎，你持有的股票隨著大盤下跌而引發停損。你立即小額認賠出場。\n\
    \n避免虧損的戰術：世上沒有這種戰術。你趁著走勢強勁的大盤市況，在適當時機買進某支走勢強勁的股票。可是，這筆交易碰上意外利空消息。當部位設定的停損遭到引發時，產生了虧損，這是經營事業會碰到的正常風險。\n\
    \n歸根究柢，這個情節代表一筆好交易，只是碰上意外事件，結果股價下跌，而你採取適當的出場行動，因此發生小額虧損。研究與檢討相關程序。這看起來簡單而容易複製？事實不然（沒錯，「採取適當出場行動」往往很困難）。\n\
    \n這類虧損是唯一可以被接受的合理虧損。如果能夠及早停損認賠，就是採取正確行動。這類虧損不至於對你構成傷害，其他的虧損才會。\n\n#### 情節 2：好消息與壞消息創造的雲霄飛車\n\
    \n上午 11:30，你持有的股票漲到上檔壓力區，帳面獲利 2 點。你沒有在預定獲利目標實現這 2 點獲利，而是繼續持有部位。你琢磨著：行情在午休時段會稍微休息；然後，該股票會克服這個壓力水準，再上漲\
    \ 1、2 點。\n\n很快來到下午 2:30。你的股票與大盤又無動於衷地熬過一小時。難道是明天即將公布的就業資料造成影響？最後，你的股票價格慢慢滑落到當初進場點，然後跌破，引發停損。你只能嘆氣，認賠出場。\n\
    \n我剛從事交易時，不知道碰過多少次此類經驗：買進一支好股票，獲得不錯的帳面利潤，但我拒絕獲利了結，於是價格一下下跌而引發停損。沒錯，我知道每個人都碰過這類情況，但這並不能安慰我。\n\
    \n這種事情之所以發生，關鍵在於：鬆懈而樂觀（貪婪？）你陶醉其中，沒有客觀看待現實。\n\n避免虧損的戰術：\n\n- 第一，當沖交易時，股票一旦取得 2\
    \ 點獲利且逼近上檔壓力，就應該落袋為安。不要理會股價是否漲到九霄雲外。反正先獲利了結，事後才恭喜自己。\n- 第二，股價在上午 11:30 逼近上檔壓力，通常都會拉回整理。即使沒有特殊理由，午休時段的沉悶走勢也會拖累漲勢。\n\
    - 第三，隨時掌握即將公布的重要經濟資訊，譬如：就業報告、消費者物價指數（CPI）、供應管理協會指數（ISM）、生產者物價指數（PPI）。這些報告每月公布一次，通常是東部標準時間上午\
    \ 8:30 到 10:00 之間。金融網絡所評論的債券期貨行情反應，可以透露市場是否喜歡其所公布資訊。\n  這些報告的解釋與公布時程，請造訪我的網站，點擊「教材」（Tutorials）與「經濟日程表」（Economic\
    \ Calendar）。\n  \n  深受期待的經濟報告公布前一天，下午盤走勢通常很平靜。許多專業交易者——包括交易所的場內交易員——經常提早下班。即將公布重大資訊前，專業玩家通常不樂意持有部位。個人交易者可以模仿這些專業玩家；午休前，結束全部或多數部位。萬一市場出現明確走勢，你隨時都可以進場。\n\
    - 第四，現在的市場價格波動異常劇烈，上午盤與下午盤不妨看成是兩個不同交易日。很多情況下，下午盤行情可能全然反轉早盤走勢。你的股票早盤表現強勁，不要理所當然認為下午盤還會如此；總之，也許真是如此，也許不是。午休前，為了幫助消化，不妨結束一、兩筆成功交易。有人這麼說：「獲利了結並不會讓你破產。」\n\
    \n#### 情節 3：放棄停損遊戲\n\n你打算進行短線搶帽子交易。標的股票穩定進行整理，透露向上突破的徵兆。你先建立些許部位，等到價格夾量向上突破時，再完美進場點加碼。可是，突然間，浪潮方向反轉，市況變動異常快速，股價像落石一樣下跌，直接穿越你的停損。於是你向下追價。你的賣單價格不是設定在最佳買進報價下方幾美分，也不是採用市價賣單，你堅持按照目前的買進報價賣出。價格持續向下跳動：「難道沒有人想買進這支股票嗎？」你哀嘆一聲，沒有。\n\
    \n幾分鐘內，股價與原始停損的距離已經拉大到 2 點。然後，你靈機一動，短線搶帽子可以轉變為當沖。沒問題。檢視當天起始低點，將其設定為新停損。喔！價格已經穿越這個水準。昨天的最低價呢？唉唷，已經過了半點。虧損擴大為\
    \ 3 點。\n\n可是，等等，你突然又想到另一個點子。這筆交易沒有必要當沖。不必如此。就現在看起來，這是一筆波段交易。相較於當沖，波段交易的停損可以設定得更寬鬆。沒錯，如此一來，完全沒問題。\n\
    \n手心冒汗，胃部絞痛，你叫出日線圖，尋找下檔最近的支撐區，即買盤可能存在的價位。老天，找到了，距離目前價位還有 4 點。\n\n你知道這是什麼情況了嗎？\n\
    \n避免虧損的戰術：進場建立部位前，先決定時間架構，盤算風險／報酬比率，擬妥交易計畫；然後，不論碰到什麼困難，請完全按照計畫行事。任何一筆搶帽子，都不可能變成波段交易，或成為當沖。\n\
    \n現在，請舉起你的右手，跟著我唸：\n\n「我對我的滑鼠發誓，從今天開始，只要我做交易，就絕對、絕對不會忽略停損參數。」\n\n#### 情節 4：天上掉下來的刀子\n\
    \n今天的市況慘不忍睹。市場先生聽到某位聯準會觀察家喃喃說著，CNBC 報導通貨膨脹壓力惡化，造成他心情惡劣。TICK 讀數遊走於 -500，TRIN 讀數攀越\
    \ 1.2。陰霾瀰漫。感謝老天，你兩手空空，雖然找不到任何可供放空的對象，不過手指卻很癢。\n\n有支藥品產業的領導股，價格已經跌了一週。這個對象令人感到棘手。不過情況很合理，因為產業都有問題。當然，股價如果觸及日線圖的\
    \ 50 天移動平均，跌勢想必會反轉。今天應該出現這種情況。你叫出走勢圖。\n\n情況確實如此發展。價格觸及 50 天移動平均，反彈 50 美分。很棒。正如同經紀人所說，你可以買低，然後賣高。於是，你買進。\n\
    \n經過短暫反彈後，行情又恢復跌勢。僅有的些許帳面獲利很快就消失，跌勢穿越 50 天移動平均與你的停損。你兩眼緊盯螢幕，全身動不了。價格又跌了 1 點，然後又\
    \ 1 點。你看著價格直直落，不願認賠如此嚴重的損失。收盤前，虧損來到 4 點。你的神經已經麻木，只能繼續持有部位，聽到收盤鈴聲響起。\n\n避免虧損的戰術：某位聰明交易者曾說，「不要試著承接天上掉下來的刀子。」\n\
    \n- 首先，大盤如果展現反向趨勢，但你覺得無聊——請離開。如果沒有坐在電腦前面，你就不太可能犯下初學者最常見的錯誤——過度交易，或因為無聊而交易。\n \
    \ 你不在場的期間，萬一市場趨勢反轉，不是錯失機會嗎？這原本就是賽局的一部分，沒什麼了不起。\n- 其次，大盤趨勢不論如何，趨勢都是你的朋友。多數股票會隨著大盤起伏；所以，順勢而為。\n\
    - 最後，股價下跌通常都有理由。當賣盤超過買盤時，沒有人想要這些下跌的股票。交易者稱呼這類股票為「天上掉下來的刀子」。拜託，不要嘗試承接，你可能受傷。\n\n\
    「買低，賣高」適用於房地產買賣，卻未必適用於股市，尤其是短期交易。記住，挑選買進對象時，就如同幫自己的球隊挑選隊員。你不會挑選笨手笨腳或缺手斷腳的人。隊伍想要獲勝，就必須挑選身體最強壯的人。交易想要賺錢也是，你要挑選走勢最強勁的股票。\n\
    \n#### 情節 5：嘿！等我一下！\n\n正常交易日上午 8:30，你正在觀看 CNBC 播報股市行情新聞。股價指數期貨上漲得很漂亮。道瓊指數昨天創新高，市況看起來不錯。\n\
    \n你啜飲咖啡，盤算今天預期的收穫。昨天收盤後，你偏愛的紐約證交所掛牌券商股票公布盈餘，數據較華爾街預期高出 10 美分。到了上午 9:31，CNBC 報導該股票價格還沒有開出來，等到價格開出來，想必會大漲。你鎖定這個機會，決定搶在其他人之前，預先遞入買單。\n\
    \n你轉身坐到電腦前面，輸入交易指令。根據計畫，這將是一筆波段交易，你按照市價買進 500 股。\n\n到了 9:35，開盤價終於出現，價格向上跳空 2 點。你的買單成交易價格高出\
    \ 1 點。可以接受。你知道漲勢一旦啟動，就不會回頭了。\n\n5 分鐘後，你的看法沒錯，價格又上漲 1 點。太棒了！漂亮的交易。\n\n你稍做休息，趁機打電話邀請幾位朋友晚上聚餐——你請客——然後又回到電腦前面。大盤仍然上漲，股價指數、TICK、TRIN、期貨等，一切表現良好。至於個別股票，哦？老天，價格跌了\
    \ 2 點。更糟的是價格垂直落，完全沒有停下來的心思。買進報價不斷往下跳動。價格已經跌破盤中低點，你馬上認賠。怎麼回事？\n\n避免虧損的戰術：\n\n-\
    \ 第一，不可在開盤前遞入市價單買進股票。不論市場或個股，開盤前遞入市價單，通常成交在可能的最高價格。隨後填補缺口的走勢，會讓這筆交易立即陷入虧損。\n-\
    \ 第二，嚴密監控那些公布優良盈餘績效的股票。等你確定價格走勢方向後，才進行交易。這可能需要 2、3 天。各位應該聽過一種說法：「根據謠言買進，新聞發布賣出。」股票公布盈餘之前，如果價格就因為市場謠言而大漲，你認為實際發布新聞時，股價表現如何？獲利了結。迅速而猛烈。\n\
    \  你可能質疑：「可是，股價在開盤後還上漲了一陣子。總有人買進。這是誰買的？」\n  答案是你，還有那些根據理所當然設想而買進的投資大衆————他們認為盈餘績效很好，當天價格應該上漲。\n\
    \  有時候確實如此，但不必然。\n- 第三，消息公布前，股價如果已經上漲，專業報價商（就紐約證交所掛牌股票來說）必須賣出庫存股（造市者情況也是如此）。記住，買盤如果超過賣盤，專業報價商與造市者就必須負責供給股票。你認為他們真會讓股價無限上漲嗎？若是如此，他們如何買回股票？專業報價商與造市者可不是吃素的，也不是經營慈善事業。\n\
    \  開盤時段，他們撮合交易指令，接著就盡快壓低買進報價，讓自己有機會低價買回股票。等到你與其他持股者感覺恐慌而低價拋售股票，他們再拉抬行情，高價賣出股票。\n\
    \n結論：看到盈餘利多消息，不要急著進場，等到市場完全消化新聞、股價走向明確後才動手。\n\n#### 情節 6：行情反覆\n\n你從事當沖交易，看到大盤走勢強勁、個股走勢強勁，於是你找到絕佳買進點進場。股價先是走高，然後停頓。差勁！\n\
    \n行情出現反向走勢。股價指數期貨下跌，TICK 讀數下滑，可是……TRIN 讀數仍然偏低。很好。你決定繼續持有部位，嘴裡喃喃自語：「TRIN 決定結果。」\n\
    \n期貨價格突然大跌，TICK 跟進。老天，怎麼回事。股價指數與某些技術指標雖然下滑，但 TRIN 仍然相對低檔，還不到 0.8。\n\n買進報價隊列的造市者陸續消失。你的股票跌破下檔最近支撐，甚至穿越你的停損。麻煩了。可是，支撐畢竟是個「區域」，不是嗎？很多專家都這麼說。實際認賠前，你決定再通融\
    \ 20 美分的緩衝。\n\n買進報價很快向下跳動 20 美分。就在你準備送出賣單前，股價反彈了 25 美分。還好，差一點。\n\n可是不到幾秒鐘，行情又恢復跌勢。TRIN\
    \ 稍微走高，其他技術指標慢慢跌破支撐。跌勢進行得相當緩慢，像是凌遲。這是拉回走勢，對吧？價格畢竟不可能直線上漲。漲勢總是夾雜著折返。\n\n股價下跌，每支陰線都夾著大量。夠了！你咬緊牙關認賠。倒槌透頂。\n\
    \n突然間，你想要報復。這支混蛋股票如果要下跌，或許可以放空。反正總是要從這支股票撈回一點。等待價格反彈（反彈過程才容易掌握價格向上跳動的空頭機會），你放空了\
    \ 500 股，停損設在反彈高點上方 25 美分。就是如此了。\n\n股價走勢稍顯猶豫，然後下跌 30 美分，跌勢又停頓。突然間，期貨價格開始反彈，TICK\
    \ 讀數快速上升。你的股票觸及下檔次要支撐。成交量暴增。第 2 級報價螢幕顯示買進報價有很多玩家排隊等待。老天，不要這樣搞。不過，這可能只是下降趨勢發展過程的反彈而已。現在就出場？或多等一下？\n\
    \n股票乾淨俐落地穿越你的停損，而且行情繼續挺進。你忍痛回補。又是損失——兩面挨耳光。現在，你已經擁有反覆俱樂部的會員資格。\n\n避免虧損的戰術：\n\n\
    - 第一，你任由股價跌破起始停損而沒有採取行動。如果按照計畫認賠，事件就告一段落，也不至於引發後來的報復情緒。「不要因為憤怒而想報復」，這類情緒通常不適用於股市。\n\
    - 第二，憤怒情緒促使你隨後放空股票。對於股票交易來說，憤怒經常讓你付出昂貴代價。\n- 第三，TRIN 確實訴說了正確的故事，雖然價格才是根本要素。我經常看到這類情況，TICK\
    \ 讀數像落石一樣下跌，但 TRIN 卻連續好幾個小時維持在 0.8 以下。這種現象很矛盾，特別容易造成困擾。碰到這種令人難以捉摸的混濁狀況，最好退場觀望。你不知道「混濁」最終會如何釐清，你也不能判斷缺乏趨勢的市況。\n\
    \n#### 情節 7：飆漲\n\n你知道什麼是關鍵：強勁的行情。你瀏覽走勢圖，尋找適合當沖買進的股票。你剛好在 CNBC 節目聽到某共同基金經理人提到一支新的無線通訊股票\
    \ Missile.com。這位經理人很喜歡這支股票，包括其產品，還有該公司執行長。想必不錯。每當某人在 CNBC 節目提到某無線通訊股票的名稱，價格就飆漲。\n\
    \n你馬上叫出 Missile.com 的日線圖。哇！一週前，價格還是 11 美元；今天，價格是 44 美元！目前股價遠超過 20 天移動平均，漲勢雖然已經過度延伸，但誰能夠和事實爭辯呢？觀察第\
    \ 2 級報價螢幕，賣出報價就像被飢餓的食人魚啃噬：45 美元、45.50 美元、45.80 美元、46 美元、46.40 美元、46.70 美元。不過半點左右，這就是你想要的。這也是第\
    \ 2 級報價的功能，不是嗎？速度。你按照目前價格加 5 美分買進，很快就在 47 美元買進 500 股。賣給最高的出價者——你！\n\nMissile.com\
    \ 價格稍微震盪，幾秒後，價格開始崩跌。嘿！停住！時間與交易量螢幕不斷閃爍著紅色的向下跳動。你的手緊握著滑鼠，全身僵硬。拜託，不要再跌了。\n\n短短幾秒內，價格來到\
    \ 44 美元。你的破洞已經擴大為 1,500 美元。怎麼爬出來？\n\n在 CNBC 出現的那位基金經理人，不是說 Missile 是支好股票嗎？如果在\
    \ 44 美元再買進 500 股，每股平均成本就是 45.50 美元，起碼遠低於原本的 47 美元。於是，你在 44 美元又買了 500 股。現在，短線搶帽子已經變成波段交易了。\n\
    \n隔天，市場開盤下跌，無線通訊指數走勢疲弱。Missile 股價來到 41 美元，跌勢因為午休時段而趨緩，暫時做整理。這應該就是底部了，你心中琢磨著。行情稍後應該會向上突破，再度展開上升趨勢。所以，你在\
    \ 41 美元又買進 500 股。\n\n午休過後，盤中走勢圖的線形收盤逐漸向低價收斂。你知道，這種情況顯然不妙。實際行情發展也是如此，價格下跌。你覺得胃部絞\n"
  mdcn: "\n## 新手隨堂考\n\n### 題目\n\n- 01. 關於搶帽子，其交易風格、交易規模，以及風險／報酬比率如何？\n- 02. 某些數字水準在支撐／壓力方面扮演什麼功能？\n\
    - 03. 關於搶帽子交易，最佳買進－賣出報價之間的碼差最好是多少？\n- 04. 列舉 3 種理想的搶帽子交易架構。\n- 05. 對於多邊搶帽子的交易，買進報價或賣出報價的深度更重要？\n\
    - 06. 如果要追買某支走勢快速的股票，只要採用市價單就可以了。正確或錯誤？\n- 07. 你持有賺錢的搶帽子部位，突然看到期貨行情暴跌，TICK 急跌穿越零線，買進報價排隊的造市者人數快速消失。如何結束部位？\n\
    - 08. 何謂「向上跳動的規定」？\n- 09. 某股票觸及包寧傑帶狀上限，但收盤價不能穿越，次日線形下滑，後續走勢可能如何發展？\n- 10. 波段交易想要尋找放空對象，觀察日線圖處於下降趨勢的股票，價格低於\
    \ 20 天移動平均，最好也低於 50 天移動平均和 200 天移動平均。正確或錯誤？\n- 11. 股票呈現下降趨勢，成交量應該要放大？\n- 12. 持有空頭部位的股票，價格如果上漲，起始回補停損單也應該跟著往上調整。正確或錯誤？\n\
    - 13. 適合放空的頭肩頂型態，______ 肩的成交量應該縮小。\n- 14. 成交量不足的股票，特別適合放空。正確或錯誤？\n\n### 答案\n\n\
    - 01. 每天通常要進行好幾筆交易，每筆交易的股數為 500-1,000 股，風險／報酬比率為 1:2。\n- 02. 對於支撐／壓力功能來說，整數扮演重要角色，半整數也很重要。\n\
    - 03. 對於搶帽子交易來說，最佳買進－賣出報價的價差，最好不要超過 1、2 美分。\n- 04. （1）盤中走勢呈現橫向整理。（2）呈現 20 分鐘或更久的狹幅橫向穩定盤整。（3）絕大多數線形都收在最高價附近。\n\
    - 05. 建立搶帽子多頭部位，買進報價應該要有足夠的深度。\n- 06. 錯誤。這只適合用來向另一半解釋股票交易為什麼賠這麼多錢。\n- 07. 原本賺錢的搶帽子交易突然逆轉，可以採用限價賣單出脫部位，價格設定在當時最佳買進報價下方\
    \ 1、2 檔。\n- 08. 股票價格向上跳動才允許放空。換言之，股票最近成交價格必須向上跳動，或向上零跳動（先前成交價格向上跳動，最近成交價格沒有跳動）。\n\
    - 09. 價格很可能向下發展，可能朝包寧傑帶狀下限發展。\n- 10. 正確。\n- 11. 不。\n- 12. 錯誤，絕對禁止。\n- 13. 右肩。\n\
    - 14. 只適合追求刺激的人，或者交易帳戶有錢可供損失的人。\n\n## 培養頂尖交易者思維\n\n### 創造豐盛的心態\n\n> 「可是，你要知道，如果願意的話，你可以達到完全的財務獨立。這將有助於提升你的意識，藉以適應這種程度的完整性。」\n\
    \n——約翰·蘭多夫·普萊斯《豐富之書》\n*John Randolph Price, The Abundance Book*\n\n每個人都有權享有豐盛與富足。然而，為了吸引它，我們必須主導自己的信仰和思想。不僅要關注自己做了什麼，還要給周圍的世界貼上標籤。\n\
    \n豐盛與否，反映我們的思想水準。舉例來說，個人或許不能對全球經濟直接產生影響，但當我們不斷抱怨這些情況，就會抱持負面態度。這種負面情緒對生活造成重大影響，也影響我們身邊的人。\n\
    \n你是否仍堅持那種正義蘊含於貧窮的信念？你的思想或談話，是否經常夾雜著「我不能」、「我恐懼」、「我不知道如何」、「不夠」等。不妨把這類感覺取代為富足、充裕與自我價值。\n\
    \n相信自己是個特殊的人。你有著獨特的認知。生活偏向於療癒、勝利與成功。\n\n設想內在和外在富足是你的權利。你的思想應該專注於自家祝福，而不是你認為的匱乏或局限。擴展對於自己生活的信心。創造有助於發展正面結果的心態，並將它們彙整到自己的經驗中。\n\
    \n## 擁抱虧損：此乃交易者的摯友\n\n各位看到本章標題，可能會建議我到醫院檢查精神狀態，但請各位先聽我慢慢道來。\n\n交易生涯的成敗不在於所得獲利，而是交易虧損——即如何管理虧損，從中汲取教訓。\n\
    \n蘇格拉底曾說，未經檢視的生活不值得過。而未經檢視的交易虧損，會送你到排隊領救濟便當。相信我。我不僅一次曾經如此，手上還拿著湯匙。\n\n學習交易最重要的事情，就是記錄交易日誌。這不是自我鞭撻。事實上，我稱此為「成功旅程日誌」——處理得當的話，其功能就是如此。\n\
    \n找一本綠色（鈔票顏色）封面的筆記本，或設立一個電腦檔案夾。每天交易結束，就記錄股票報價代碼、進場價格、出場價格等。第一句話請寫：「我進行這筆交易，因為……，」然後寫下理由。\n\
    \n你可能基於很好的理由建立部位：明確的價格型態、高勝算架構、1：3 的風險／報酬比率、完美進場點、有效的由上而下交易準則。可是，交易仍然虧損。紀錄的第一句話是：「這筆交易虧損是因為……。\
    \ 」這方面記錄不需自我批評，只需客觀列舉交易失敗的理由。千萬不要引用情緒性字眼，譬如「愚蠢」或「蠢蛋」等。單純的就事論事，然後，研究這些事實，以及各種選擇。\n\
    \n最後，註明「將來如果發生類似情況，我會……。 」列舉你準備採取的各項步驟。下一次，你打算如何有效保障交易資本？如何確保交易成功？\n\n你如果執行一筆極端完美的交易，也請把內容納入交易日誌。研究該筆交易過程，學習如何汲取成功啟示。\n\
    \n隔天早晨，翻閱昨天記錄的成功旅程日誌。有時間的話，不妨翻閱過去的紀錄。\n\n前文曾說過，人們如果寫下特定目標，其效力將明顯超過單純地擱在腦海裡。這也包括交易日誌在內。我認識的成功交易者，大多在交易生涯初期就養成記錄交易日誌的習慣。這個習慣對於各位的成功絕對有幫助。\n\
    \n### 七種「致命情結」：如何保障資本，再活一天\n\n讓我們敞開心胸，談談某些經常發生的失敗情況，好好檢討。我曾親身經歷這些失敗，但各位沒有必要如此。\n\
    \n#### 情節 1：災難發生\n\n大盤走勢強勁，你買進某支走勢強勁的股票且買點絕佳。可是，幾分鐘後，CNBC 突然發布重大利空消息。市場發展急轉彎，你持有的股票隨著大盤下跌而引發停損。你立即小額認賠出場。\n\
    \n避免虧損的戰術：世上沒有這種戰術。你趁著走勢強勁的大盤市況，在適當時機買進某支走勢強勁的股票。可是，這筆交易碰上意外利空消息。當部位設定的停損遭到引發時，產生了虧損，這是經營事業會碰到的正常風險。\n\
    \n歸根究柢，這個情節代表一筆好交易，只是碰上意外事件，結果股價下跌，而你採取適當的出場行動，因此發生小額虧損。研究與檢討相關程序。這看起來簡單而容易複製？事實不然（沒錯，「採取適當出場行動」往往很困難）。\n\
    \n這類虧損是唯一可以被接受的合理虧損。如果能夠及早停損認賠，就是採取正確行動。這類虧損不至於對你構成傷害，其他的虧損才會。\n\n#### 情節 2：好消息與壞消息創造的雲霄飛車\n\
    \n上午 11:30，你持有的股票漲到上檔壓力區，帳面獲利 2 點。你沒有在預定獲利目標實現這 2 點獲利，而是繼續持有部位。你琢磨著：行情在午休時段會稍微休息；然後，該股票會克服這個壓力水準，再上漲\
    \ 1、2 點。\n\n很快來到下午 2:30。你的股票與大盤又無動於衷地熬過一小時。難道是明天即將公布的就業資料造成影響？最後，你的股票價格慢慢滑落到當初進場點，然後跌破，引發停損。你只能嘆氣，認賠出場。\n\
    \n我剛從事交易時，不知道碰過多少次此類經驗：買進一支好股票，獲得不錯的帳面利潤，但我拒絕獲利了結，於是價格一下下跌而引發停損。沒錯，我知道每個人都碰過這類情況，但這並不能安慰我。\n\
    \n這種事情之所以發生，關鍵在於：鬆懈而樂觀（貪婪？）你陶醉其中，沒有客觀看待現實。\n\n避免虧損的戰術：\n\n- 第一，當沖交易時，股票一旦取得 2\
    \ 點獲利且逼近上檔壓力，就應該落袋為安。不要理會股價是否漲到九霄雲外。反正先獲利了結，事後才恭喜自己。\n- 第二，股價在上午 11:30 逼近上檔壓力，通常都會拉回整理。即使沒有特殊理由，午休時段的沉悶走勢也會拖累漲勢。\n\
    - 第三，隨時掌握即將公布的重要經濟資訊，譬如：就業報告、消費者物價指數（CPI）、供應管理協會指數（ISM）、生產者物價指數（PPI）。這些報告每月公布一次，通常是東部標準時間上午\
    \ 8:30 到 10:00 之間。金融網絡所評論的債券期貨行情反應，可以透露市場是否喜歡其所公布資訊。\n  這些報告的解釋與公布時程，請造訪我的網站，點擊「教材」（Tutorials）與「經濟日程表」（Economic\
    \ Calendar）。\n  \n  深受期待的經濟報告公布前一天，下午盤走勢通常很平靜。許多專業交易者——包括交易所的場內交易員——經常提早下班。即將公布重大資訊前，專業玩家通常不樂意持有部位。個人交易者可以模仿這些專業玩家；午休前，結束全部或多數部位。萬一市場出現明確走勢，你隨時都可以進場。\n\
    - 第四，現在的市場價格波動異常劇烈，上午盤與下午盤不妨看成是兩個不同交易日。很多情況下，下午盤行情可能全然反轉早盤走勢。你的股票早盤表現強勁，不要理所當然認為下午盤還會如此；總之，也許真是如此，也許不是。午休前，為了幫助消化，不妨結束一、兩筆成功交易。有人這麼說：「獲利了結並不會讓你破產。」\n\
    \n#### 情節 3：放棄停損遊戲\n\n你打算進行短線搶帽子交易。標的股票穩定進行整理，透露向上突破的徵兆。你先建立些許部位，等到價格夾量向上突破時，再完美進場點加碼。可是，突然間，浪潮方向反轉，市況變動異常快速，股價像落石一樣下跌，直接穿越你的停損。於是你向下追價。你的賣單價格不是設定在最佳買進報價下方幾美分，也不是採用市價賣單，你堅持按照目前的買進報價賣出。價格持續向下跳動：「難道沒有人想買進這支股票嗎？」你哀嘆一聲，沒有。\n\
    \n幾分鐘內，股價與原始停損的距離已經拉大到 2 點。然後，你靈機一動，短線搶帽子可以轉變為當沖。沒問題。檢視當天起始低點，將其設定為新停損。喔！價格已經穿越這個水準。昨天的最低價呢？唉唷，已經過了半點。虧損擴大為\
    \ 3 點。\n\n可是，等等，你突然又想到另一個點子。這筆交易沒有必要當沖。不必如此。就現在看起來，這是一筆波段交易。相較於當沖，波段交易的停損可以設定得更寬鬆。沒錯，如此一來，完全沒問題。\n\
    \n手心冒汗，胃部絞痛，你叫出日線圖，尋找下檔最近的支撐區，即買盤可能存在的價位。老天，找到了，距離目前價位還有 4 點。\n\n你知道這是什麼情況了嗎？\n\
    \n避免虧損的戰術：進場建立部位前，先決定時間架構，盤算風險／報酬比率，擬妥交易計畫；然後，不論碰到什麼困難，請完全按照計畫行事。任何一筆搶帽子，都不可能變成波段交易，或成為當沖。\n\
    \n現在，請舉起你的右手，跟著我唸：\n\n「我對我的滑鼠發誓，從今天開始，只要我做交易，就絕對、絕對不會忽略停損參數。」\n\n#### 情節 4：天上掉下來的刀子\n\
    \n今天的市況慘不忍睹。市場先生聽到某位聯準會觀察家喃喃說著，CNBC 報導通貨膨脹壓力惡化，造成他心情惡劣。TICK 讀數遊走於 -500，TRIN 讀數攀越\
    \ 1.2。陰霾瀰漫。感謝老天，你兩手空空，雖然找不到任何可供放空的對象，不過手指卻很癢。\n\n有支藥品產業的領導股，價格已經跌了一週。這個對象令人感到棘手。不過情況很合理，因為產業都有問題。當然，股價如果觸及日線圖的\
    \ 50 天移動平均，跌勢想必會反轉。今天應該出現這種情況。你叫出走勢圖。\n\n情況確實如此發展。價格觸及 50 天移動平均，反彈 50 美分。很棒。正如同經紀人所說，你可以買低，然後賣高。於是，你買進。\n\
    \n經過短暫反彈後，行情又恢復跌勢。僅有的些許帳面獲利很快就消失，跌勢穿越 50 天移動平均與你的停損。你兩眼緊盯螢幕，全身動不了。價格又跌了 1 點，然後又\
    \ 1 點。你看著價格直直落，不願認賠如此嚴重的損失。收盤前，虧損來到 4 點。你的神經已經麻木，只能繼續持有部位，聽到收盤鈴聲響起。\n\n避免虧損的戰術：某位聰明交易者曾說，「不要試著承接天上掉下來的刀子。」\n\
    \n- 首先，大盤如果展現反向趨勢，但你覺得無聊——請離開。如果沒有坐在電腦前面，你就不太可能犯下初學者最常見的錯誤——過度交易，或因為無聊而交易。\n \
    \ 你不在場的期間，萬一市場趨勢反轉，不是錯失機會嗎？這原本就是賽局的一部分，沒什麼了不起。\n- 其次，大盤趨勢不論如何，趨勢都是你的朋友。多數股票會隨著大盤起伏；所以，順勢而為。\n\
    - 最後，股價下跌通常都有理由。當賣盤超過買盤時，沒有人想要這些下跌的股票。交易者稱呼這類股票為「天上掉下來的刀子」。拜託，不要嘗試承接，你可能受傷。\n\n\
    「買低，賣高」適用於房地產買賣，卻未必適用於股市，尤其是短期交易。記住，挑選買進對象時，就如同幫自己的球隊挑選隊員。你不會挑選笨手笨腳或缺手斷腳的人。隊伍想要獲勝，就必須挑選身體最強壯的人。交易想要賺錢也是，你要挑選走勢最強勁的股票。\n\
    \n#### 情節 5：嘿！等我一下！\n\n正常交易日上午 8:30，你正在觀看 CNBC 播報股市行情新聞。股價指數期貨上漲得很漂亮。道瓊指數昨天創新高，市況看起來不錯。\n\
    \n你啜飲咖啡，盤算今天預期的收穫。昨天收盤後，你偏愛的紐約證交所掛牌券商股票公布盈餘，數據較華爾街預期高出 10 美分。到了上午 9:31，CNBC 報導該股票價格還沒有開出來，等到價格開出來，想必會大漲。你鎖定這個機會，決定搶在其他人之前，預先遞入買單。\n\
    \n你轉身坐到電腦前面，輸入交易指令。根據計畫，這將是一筆波段交易，你按照市價買進 500 股。\n\n到了 9:35，開盤價終於出現，價格向上跳空 2 點。你的買單成交易價格高出\
    \ 1 點。可以接受。你知道漲勢一旦啟動，就不會回頭了。\n\n5 分鐘後，你的看法沒錯，價格又上漲 1 點。太棒了！漂亮的交易。\n\n你稍做休息，趁機打電話邀請幾位朋友晚上聚餐——你請客——然後又回到電腦前面。大盤仍然上漲，股價指數、TICK、TRIN、期貨等，一切表現良好。至於個別股票，哦？老天，價格跌了\
    \ 2 點。更糟的是價格垂直落，完全沒有停下來的心思。買進報價不斷往下跳動。價格已經跌破盤中低點，你馬上認賠。怎麼回事？\n\n避免虧損的戰術：\n\n-\
    \ 第一，不可在開盤前遞入市價單買進股票。不論市場或個股，開盤前遞入市價單，通常成交在可能的最高價格。隨後填補缺口的走勢，會讓這筆交易立即陷入虧損。\n-\
    \ 第二，嚴密監控那些公布優良盈餘績效的股票。等你確定價格走勢方向後，才進行交易。這可能需要 2、3 天。各位應該聽過一種說法：「根據謠言買進，新聞發布賣出。」股票公布盈餘之前，如果價格就因為市場謠言而大漲，你認為實際發布新聞時，股價表現如何？獲利了結。迅速而猛烈。\n\
    \  你可能質疑：「可是，股價在開盤後還上漲了一陣子。總有人買進。這是誰買的？」\n  答案是你，還有那些根據理所當然設想而買進的投資大衆————他們認為盈餘績效很好，當天價格應該上漲。\n\
    \  有時候確實如此，但不必然。\n- 第三，消息公布前，股價如果已經上漲，專業報價商（就紐約證交所掛牌股票來說）必須賣出庫存股（造市者情況也是如此）。記住，買盤如果超過賣盤，專業報價商與造市者就必須負責供給股票。你認為他們真會讓股價無限上漲嗎？若是如此，他們如何買回股票？專業報價商與造市者可不是吃素的，也不是經營慈善事業。\n\
    \  開盤時段，他們撮合交易指令，接著就盡快壓低買進報價，讓自己有機會低價買回股票。等到你與其他持股者感覺恐慌而低價拋售股票，他們再拉抬行情，高價賣出股票。\n\
    \n結論：看到盈餘利多消息，不要急著進場，等到市場完全消化新聞、股價走向明確後才動手。\n\n#### 情節 6：行情反覆\n\n你從事當沖交易，看到大盤走勢強勁、個股走勢強勁，於是你找到絕佳買進點進場。股價先是走高，然後停頓。差勁！\n\
    \n行情出現反向走勢。股價指數期貨下跌，TICK 讀數下滑，可是……TRIN 讀數仍然偏低。很好。你決定繼續持有部位，嘴裡喃喃自語：「TRIN 決定結果。」\n\
    \n期貨價格突然大跌，TICK 跟進。老天，怎麼回事。股價指數與某些技術指標雖然下滑，但 TRIN 仍然相對低檔，還不到 0.8。\n\n買進報價隊列的造市者陸續消失。你的股票跌破下檔最近支撐，甚至穿越你的停損。麻煩了。可是，支撐畢竟是個「區域」，不是嗎？很多專家都這麼說。實際認賠前，你決定再通融\
    \ 20 美分的緩衝。\n\n買進報價很快向下跳動 20 美分。就在你準備送出賣單前，股價反彈了 25 美分。還好，差一點。\n\n可是不到幾秒鐘，行情又恢復跌勢。TRIN\
    \ 稍微走高，其他技術指標慢慢跌破支撐。跌勢進行得相當緩慢，像是凌遲。這是拉回走勢，對吧？價格畢竟不可能直線上漲。漲勢總是夾雜著折返。\n\n股價下跌，每支陰線都夾著大量。夠了！你咬緊牙關認賠。倒槌透頂。\n\
    \n突然間，你想要報復。這支混蛋股票如果要下跌，或許可以放空。反正總是要從這支股票撈回一點。等待價格反彈（反彈過程才容易掌握價格向上跳動的空頭機會），你放空了\
    \ 500 股，停損設在反彈高點上方 25 美分。就是如此了。\n\n股價走勢稍顯猶豫，然後下跌 30 美分，跌勢又停頓。突然間，期貨價格開始反彈，TICK\
    \ 讀數快速上升。你的股票觸及下檔次要支撐。成交量暴增。第 2 級報價螢幕顯示買進報價有很多玩家排隊等待。老天，不要這樣搞。不過，這可能只是下降趨勢發展過程的反彈而已。現在就出場？或多等一下？\n\
    \n股票乾淨俐落地穿越你的停損，而且行情繼續挺進。你忍痛回補。又是損失——兩面挨耳光。現在，你已經擁有反覆俱樂部的會員資格。\n\n避免虧損的戰術：\n\n\
    - 第一，你任由股價跌破起始停損而沒有採取行動。如果按照計畫認賠，事件就告一段落，也不至於引發後來的報復情緒。「不要因為憤怒而想報復」，這類情緒通常不適用於股市。\n\
    - 第二，憤怒情緒促使你隨後放空股票。對於股票交易來說，憤怒經常讓你付出昂貴代價。\n- 第三，TRIN 確實訴說了正確的故事，雖然價格才是根本要素。我經常看到這類情況，TICK\
    \ 讀數像落石一樣下跌，但 TRIN 卻連續好幾個小時維持在 0.8 以下。這種現象很矛盾，特別容易造成困擾。碰到這種令人難以捉摸的混濁狀況，最好退場觀望。你不知道「混濁」最終會如何釐清，你也不能判斷缺乏趨勢的市況。\n\
    \n#### 情節 7：飆漲\n\n你知道什麼是關鍵：強勁的行情。你瀏覽走勢圖，尋找適合當沖買進的股票。你剛好在 CNBC 節目聽到某共同基金經理人提到一支新的無線通訊股票\
