    50 萬股，但分為好幾筆交易進行。針對紐約證交所股票進行動態交易，應該「順著大額交易方向」進行。某筆交易即使符合你的條件，還必須確定交易方向順著大額指令的方向進行。如果數量資訊顯示你的交易違背潮流方向，你最好留在岸上等待潮流轉向。


