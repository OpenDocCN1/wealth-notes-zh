    自己遠超過背景，遠超過自己的教育，遠超過所處的生活狀況。


    讓我們按照一個更龐大的計畫，展開每天的生活。


    每週、每天、每小時，我們都可以選擇如何生活。當我們處在一個平靜、強大和有意識的內心場所，也為生活帶來了嶄新的意義。我們超越了個人極限，體認到生活可以是令人興奮的成功表現。'
