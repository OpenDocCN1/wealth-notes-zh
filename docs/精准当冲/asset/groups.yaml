    # 向上與向下突破


    對於既有上升或下降趨勢來說，向上突破與向下突破可能代表趨勢連續或反轉。這些連續或反轉走勢，通常代表最具動能的盤勢。你希望在這些走勢即將發動之前買進（或放空），且在盤勢趨緩之前獲利了結。


    # 向上突破


    所謂向上突破，指股票由橫向整理過程向上突破壓力而創新高。這種過程如同圖 6-12 顯示，球由天花板的孔洞穿越。對於任何時間架構，不論是動能交易或當沖，向上突破都代表絕佳買進機會。


    # 向上突破的三個階段


    +   1. 首度突破：股價穿越關鍵壓力的時刻（球穿越一樓天花板）。如果天花板壓力在 60 美元，你在第 2 級報價螢幕顯示成交價格為 60.05 美元或
    60.10 美元時買進。換言之，實際成交價格高於關鍵壓力，有些交易者要求收盤價高於關鍵壓力。典型的領先突破應該夾著顯著大量。


    +   2. 拉回：上升趨勢經過首度突破後，出現獲利回吐的現象，或漲勢觸擊上檔壓力而回檔，重新測試原先的突破價位。等到賣壓消退，買盤重新進場，價格就會回升。當價格由拉回走勢回升，就創造了第二個進場機會。這時進場最安全，因為首度突破已經奠定買盤。


    +   3. 二次突破：股票漲勢再起，突破先前的樞紐點（二樓天花板）。價格穿越二樓天花板的孔洞，進入三樓。當沖採用盤中'
