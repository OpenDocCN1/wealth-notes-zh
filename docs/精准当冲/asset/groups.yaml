    ## 向下突破


    向下突破是向上突破的相反情況。請參考圖 6-24，向下突破的過程，價格跌破交易區間的下檔支撐，然後出現反彈，最後又下跌而創新低。


    向下突破代表理想的放空機會。稍後會詳細討論放空交易的技巧，現在只準備稍微介紹放空行為：交易者如果認為某股票價格將下跌或價值將減少，就可以考慮建立「空頭」部位。換言之，你先在公開市場賣出股票，希望隨後有機會低價買回（回補）。放空如果成功，獲利是賣出價格與回補價格之間的差價。


    ### 向下突破的三個階段


    - 1. 向下突破：股價跌破下檔的關鍵支撐（球掉下一樓地板的洞）。如果關鍵支撐在 60 美元，交易者在價格跌破 60 美元時放空。

    - 2. 股票跌到次個支撐區，價格出現反彈。這波反彈的性質類似於向上突破的拉回，只是方向相反而已。很快地，空頭又掌握盤勢，多頭收手，股價恢復跌勢。這是放空股票最安全的進場點。

    - 3. 價格跌破最後的支撐或樞紐點（地下室地板）。對於當沖來說，這個進場點有點太遲，但對於波段交易者而言，仍然是進場機會。


    ![](img/468d7cacb0b269ef1c907b6846010599_157_0.png)


    圖 6-24 三階段向下突破的放空訊號


    圖 6-25 到圖 6-28 藉由日線圖與盤中走勢圖說明向下突破的案例，包括前述 1、2、3 階段型態。請注意，不論運用於日線圖或盤中走勢圖，各種型態的進場點都相同。


    ![](img/468d7cacb0b269ef1c907b6846010599_158_0.png)


    圖 6-25 Vertex Pharmaceuticals, Inc. (VRTX) 日線圖顯示股價從 10 月到 3 月呈現的上升趨勢，事實上，股價翻了一倍。然後，3
    月中旬過後，股價開始下跌。


    - 1. 3 月 23 日，一支長黑線跌破支撐 36.95 美元（賣出訊號）。隨後 3 天內，股價跌到 34.68 美元。

    - 2. 股價展開反彈，回到原先的突破價位附近（37 美元），原先的支撐轉變為現在的壓力。經過 6 天橫向盤整，價格再度下跌，出現另一個賣出訊號。

    - 3. 4 月 6 日，價格跌破前一波低點 34.68 美元，這是第三階段的賣出訊號。隨後 2 天內，股價跌到 31 美元。


    製藥與生化科技股票的價格波動劇烈，持有 2 天空頭部位就會造成相當沉重的心理壓力。這些股票的交易務必小心處理，尤其是生化科技類股，股價漲跌往往深受公司產品臨床實驗結果的影響。這也是為什麼這類個股的表现，經常和整體類股產生分歧的原因。


    ![](img/468d7cacb0b269ef1c907b6846010599_159_0.png)


    圖 6-26 Amgen, Inc. (AMGN) 15 分鐘走勢圖。本例說明當沖客可運用的放空機會。交易者如果仔細研究這份走勢圖（進行任何交易都應該做的工作），就可以發現
    AMGN 處於下降趨勢。


    - 1. 4 月 6 日，股價大跌。4 月 7 日，開盤價 72.28 美元向上跳空，股價曾經來到 72.49 美元。可是，賣壓立即出籠，股價很快就被壓回前一天收盤價
    71.85 美元，甚至來到 71.25 美元。

    - 2. AMGN 展開反彈，回到前一天收盤價，但這是典型的多頭陷阱，空頭很快又掌握盤勢。就目前例子來說，你可以在高價黑線低點附近加碼放空。

    - 3. AMGN 跌破先前低點（71.25 美元），價格繼續下滑。當股價停頓於 70.60 美元，並且開始回升時，精明的交易者可以回補。


