    ## 搶帽子交易架構


    技術性交易的最大優點，就是幾乎所有的價格型態，往往能套用


    ![](img/468d7cacb0b269ef1c907b6846010599_349_0.png)


    圖 11-7 Titanium Metals Corp.（TIE）233 跳動檔走勢圖，顯示股價開盤走高，然後呈橫向震盪走勢，直到上午 10:50 左右出現暴跌走勢，價格下跌
    3 點。當價格跌破當時盤中低點 37 美元（水平虛線，前頭標示），短線帽子可以進場放空。到了 11:45，價格由低點反轉。我根據高點與低點設定費波納奇水準。TIE
    價格直接反彈 61.8% 水準，剛好對應先前的壓力。明智的動能交易者與短線帽子應該在此獲利了結（先前當然應該先做部分獲利了結）。然後，價格拉回到 50% 水準，隨後又回升走高。


    RealTick® graphics used with permission of Townsend Analytics, Ltd. © 1986-2007
    Townsend Analytics, Ltd.


    到任何時間架構。相同的價格型態可以運用於部位交易、波段交易、當沖、動能交易，以及短線搶帽子，因為某些架構與排列會發生在不同時間架構。


    時間架構如果縮短為幾分或幾秒，就能夠看到適用於短線搶帽子交易的基本價格型態——橫向盤整的向上或向下突破，拉回或反彈走勢的折返。可是，交易者還是需要辨識更大型的排列，因為最理想的搶帽子機會往往來自較大型的動態走勢。


    就我觀察，最適合搶帽子的交易架構，來自於既有趨勢的緊密橫向盤整型態。這類型態呈現狹幅橫向盤整，時間至少持續 15～30 分鐘，當然愈久愈好。最理想的搶帽子交易架構為：


    - 發生在趨勢明確交易日的早盤或下午盤（不是在走勢不穩的午休時段）。

    - 呈現至少 15 分鐘的狹幅橫向盤整。

    - 10 期與 20 期移動平均緊貼在當時價格型態下方（多頭部位）。

    - 醞釀動態階段，數支線形收盤價位在最高價附近。

    - 成交量放大顯示動態。


    早盤通常沒有充分時間醞釀真正的橫向盤整走勢。很多情況下，早盤的最佳搶帽子盤勢，是由長期（日線圖）支撐展開的彈升走勢。隨著時間發展，尤其是午休時段後，才有機會看到真正的橫向盤整向上突破，下午盤才慢慢出現這類甜蜜的搶帽子良機。


    在橫向盤整實際向上突破前，可以提前進場，前提是你能夠有精確的時間測量，並做好風險／報酬分析。等待盤整過程出現小線形，收盤價慢慢向高價靠攏。然後，觀察成交量、第
    2 級報價資訊、時間與交易量、標普期貨 E 迷你契約等的變化，以及 TRIN 與 TICK 指標，判斷向上突破是否即將發生。


    提早進場當然會承擔額外風險，走勢可能向下反轉，跌破支撐，快速下跌（價格一旦跌破支撐，空方會取得控制權，迫使盤勢進一步走低）。因應策略：在價格向上突破前，先根據預期走勢建立半數部位，等到突破實際獲得確認後，再建立剩餘部位。獲利來到
    25 美分時，可以先結束半數部位，剩餘部位再多爭取些許利潤，實際情況取決於股價走勢強度。


    就我來說，如果針對反轉走勢買進，通常會一口氣建立整體部位，然後分兩批出場。


    圖 11-8 與圖 11-9 顯示的架構適用於盤中走勢圖。我採用 2 分鐘或 5 分鐘走勢圖，實際情況取決於股價變動速度。1 分鐘走勢圖的「雜訊」（無意義的價格波動）過多，但主要還是取決於個人偏好。


    圖 11-10 到圖 11-12 顯示 5 分鐘走勢圖進行的搶帽子交易案例。研究後，試著在開盤期間尋找類似的架構與進場型態。進行紙上模擬交易，直到覺得理所當然為止。


