    1 美分。所以前一筆成交價如果是 20 美元，次一筆成交價如果是 20.01 美元，就會閃動綠色，因為價格向上升動。如果接下來一筆成交價為 20 美元，則閃動紅色，因為價格向下跳動。可是這筆交易未必是賣出，有可能設定在
