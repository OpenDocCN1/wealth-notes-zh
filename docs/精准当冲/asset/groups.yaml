    型的動態走勢。


    就我觀察，最適合搶帽子的交易架構，來自於既有趨勢的緊密橫向盤整型態。這類型態呈現狹幅橫向盤整，時間至少持續 15～30 分鐘，當然愈久愈好。最理想的搶帽子交易架構為：


    +   ▷ 發生在趨勢明確交易日的早盤或下午盤（不是在走勢不穩的午休時段）。


    +   ▷ 呈現至少 15 分鐘的狹幅橫向盤整。


    +   ▷ 10 期與 20 期移動平均緊貼在當時價格型態下方（多頭部位）。


    +   ▷ 醞釀動態階段，數支線形收盤價位在最高價附近。


    +   ▷ 成交量放大顯示動態。


    早盤通常沒有充分時間醞釀真正的橫向盤整走勢。很多情況下，早盤的最佳搶帽子盤勢，是由長期（日線圖）支 撐展開的彈升走勢。隨著時間發展，尤其是午休時段後，才有機會看到真正的橫向盤整向上突破，下午盤才慢慢出現這類甜蜜的搶帽子良機。


    在橫向盤整實際向上突破前，可以提前進場，前提是你能夠有精確的時間測量，並做好風險／報酬分析。等待盤整過程出現小線形，收盤價慢慢向高價靠攏。然後，觀察成交量、第
    2 級報價資訊、時間與交易量、標普期貨 E 迷你契約等的變化，以及 TRIN 與 TICK 指標，判斷向上突破是否即將發生。


