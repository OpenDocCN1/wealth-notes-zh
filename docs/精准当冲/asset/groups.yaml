    對於搶帽子交易來說，時間與風險／報酬比率會壓縮。由於獲利目標很小，部位所允許承擔的風險更小。這方面交易持續的時間只有幾秒或幾分鐘。每股獲利目標：15～75
    美分。


    搶帽子交易想要賺錢，勝率必須夠高。如果是波段交易或當沖交易，一筆成功交易的獲利，或許能彌補兩筆失敗交易的虧損。搶帽子的情況則不是如此。一筆交易賺了 25 美分，次筆交易虧損
    13 美分，然後又一筆交易損失 12 美分。這並不是扯平，你已經賠錢了，因為還有佣金成本。


    # 價格行為：整數與半點


    某些數字會自然提供支撐／壓力功能，譬如：整數與半點。股價上漲時，逼近整數價位往往有所猶豫，或者穿越整數後，還會拉回整理。


    伊古魯冰淇淋是典型的當沖對象，假設股價上漲到 25.98 美元，由於逼近整數 26 美元，走勢顯得猶豫不決。如果當天走勢特別強勁，股價可能直接突破 26 美元而來
    26.05 美元，然後拉回，或許折返到 25.90 美元。這也是持股者經常在價格逼近整數時，獲利了結的緣故。


    整數也扮演支撐功能（除非價格剛穿越，如同上段敘述案例）。伊古魯冰淇淋走勢如果下跌，一旦逼近 25 美元，跌勢可能趨緩或停頓。一旦跌勢突破 25 美元而來 24.90
    美元，跌勢可能轉劇。投資人與交易者知道價格走勢會「排斥」整數，一旦股價下跌而觸及整數或 0.90、0.75 價位，可能引發停損賣單，導致價格進一步下跌。


    半點提供的支撐／壓力功能或許稍弱，但通常可以緩和走勢。股'
