    # MACD 為何重要


    MACD 是穩定、可靠的順勢擺盪指標，非常適合做為確認工具。我運用 MACD 於週線圖、日線圖與小時走勢圖，協助確認進場與出場決策，建立正確的順勢部位。MACD
    只要繼續走高，就代表既有趨勢維持不變。


    # 如何運用 MACD


    MACD 曲線會擺動於中央零線兩側。


    - 隨著曲線上升或下降到達極端讀數（個股情況不同），價格將呈現超買或超賣。

    - 買進訊號：MACD 線由下往上穿越訊號線。

    - 賣出訊號：MACD 線由上往下穿越訊號線。

    - 快速線 MACD 與訊號線之間的距離拉開，意味著上升或下降趨勢過度延伸，可能即將拉回或反彈。

    - MACD 呈現多頭背離或空頭背離，交易者當然可以運用這種現象。可是隨機指標與 CCI 的背離現象通常更快出現，這也是交易者喜歡採用這兩種指標的緣故。


    > **新手筆記**

    > 運用於較短期的盤中走勢圖，MACD 減掉訊號線的差值經常繪製為直方圖，以呈現可靠的動能訊號。記住，MACD 的運用，必須和價格、成交量與移動平均配合使用。


    這項指標有個缺點：MACD 適合運用於趨勢明確的股票或指數。相關股票如果呈現橫向發展，MACD 就喪失動能，所提供的資訊往往缺乏參考價值。


    圖 7-20 為 Adobe Systems, Inc.（ADBE）日線圖與 MACD 指標。


    本書出版時，單是紐約證交所與那斯達克證交所就有超過 8,000 支撐股票。如果你考慮的股票並不符合最佳交易條件，為什麼要勉強做交易呢？你還有其他 7,999
    個機會可供選擇。如同成功交易者所瞭解的，獲利潛能最高的交易對象，需要在各種重要層面符合條件，包括：支撐／壓力、K 線、成交量、移動平均，以及你所選定的動能指標。


