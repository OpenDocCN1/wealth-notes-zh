    40 美元。整個部位的市值成為 12,000 美元，帳戶淨值為 6,000 美元，融資為 6,000 美元。所以，你的淨值損失為 1,500 美元，融資損失為
    1,500 美元，損失總計為 3,000 美元。如果你當初只做現金交易而買進 150 股，虧損只有一半。


    如同前面所提，你如果打算在 5 個交易日進行 4 趟來回或以上的交易，股票帳戶淨值必須隨時維持 25,000 美元以上。換言之，交易過程裡，股票帳戶起碼必須維持這個餘額。如果違反規定，多數券商会凍結交易帳戶，直到你補足存款為止。根據常識判斷，為了保有緩衝彈性，存入餘額理當超過
    25,000 美元，至少應該有 30,000 美元。


    就當沖客來說，好消息是交易金額為現金的 4 倍。換言之，帳戶內如果有 25,000 美元，當沖交易金額可以達 100,000 美元。可是，隔夜部位的保證金交易，通常是帳戶淨值的
    2 倍。


