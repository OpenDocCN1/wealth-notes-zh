    保留兩個交易帳戶也提供另一項紅利：剛交易時，當沖經常虧損，但我的長期持有股票（所謂的「部位交易」）卻賺錢。結束整天慘烈的交易後，看見部位交易帳戶是賺錢的，這多少可以安慰我受到傷害的自尊，也可以沖銷當沖帳戶的虧損。


    請注意，想維持兩個不同的帳戶，必須秉持兩種不同的心態或紀律。處理長期股票時，不能抱持積極交易的心理，反之亦然。某個帳戶如果侵入另一個帳戶領域，就失去維持兩個帳戶功能的意義，一切會陷入混亂。


    另外，如果想維持雙重帳戶，其中一個帳戶不妨設在交易指令撮合效率高、佣金費率低、無附加服務的網路券商。記住，佣金費率愈高，券商提供的服務愈多。你往來的直接下單券商，想必可以提供各種研究資料。事實上，有很多網站提供免費的股票新聞和研究資料，請查閱本書第
    14 章列舉的金融資訊網站。


    # 滑價與佣金：對於獲利的影響


    滑價指下單當時報價螢幕顯示的理論成交价格，其與實際成交价格之間的差距。缺乏警惕的交易者與投資人運用市價單買賣股票時，往往讓造市者有機會上下其手，賺取滑價帶來的利潤。


    舉例來說，你想透過網路券商買進伊古魯冰淇淋股票。此時該股票最佳賣出報價為 29.50 美元。你下單按照市價買進 500 股伊古魯。照理來說，這筆交易的成交價格是
    29.50 美元，但實際回報價格卻是 29.55 美元。實際買價較理論成交价格每股高出 5 美分，500 股就是 25 美元。這種情況每天如果發生 5 次，滑價就是
    125 美元。'
  md: '

    ## 法則二、交易資本必須是禁得起虧損的資金


    這點相當殘酷，卻是初學者必須面對的現實，因為剛從事交易時，必定會賠錢。很多交易者賠掉交易帳戶，甚至房子、家具、汽車等。千萬別讓自己列入這份傷亡名單裡。禁不起虧損的資金，就不能拿來交易。如果籌措不出足夠的交易資本，不妨多等一陣子，直到你擁有足夠的「閒置」資金為止。


    準備交易帳戶資金時，初學者還必須留意一項原則：你起碼必須學習 6 個月，才能穩定地在市場上賺錢。


    ## 選擇交易工具


    我在第二本著作《短線交易初學指南》談到，美國人對於股市情有獨鍾。這種說法現在仍然成立，且熱情愈演愈烈。交易者學會如何從市場賺取利潤後，他們張開雙手迎接市場推出的各種投資和交易工具。


    每位交易者都應該根據自己的個性與生活形態，挑選適當的交易工具。初學者犯下的最大錯誤，就是魯莽地挑選價格波動最劇烈的股票或期貨契約進行交易，只因為親朋好友或鄰居也這麼做。關於金融交易，想和其他人較量或比拚交易工具、交易方法、獲利多寡等，純屬浪費時間。


    評估自己的個性，你可能對於高風險環境感到「如魚得水」，也有可能只適合低風險環境。其次，你需要考慮準備交易的工具。雖然選擇很多，但初學者大多挑選股票、ETFs，以及股價指數迷你期貨契約。


    - 股票是最常見的交易工具，興許是歷史悠久。市面上有價格波動劇烈的股票，也有走勢穩定的股票。至於每股價格，有些股票單價只要幾美分（水餃股，或「粉紅單」股票，pink
    sheet stocks），有些則高達數百美元。

    - ETFs 是股市的明日之星。ETF 由特殊性質的一籃股票構成，可以視為普通掛牌股票一樣進行交易。所謂的一籃股票，可能由某特定類股構成，譬如：半導體類股、銀行類股等；也可能代表某特定股價指數，譬如：道瓊工業指數、那斯達克指數或標普
    500 指數；或是某國家或地區的股票，譬如：日本、印尼、巴西等。目前大約有 200 種 ETFs 可供交易，但大多沒有顯示每天成交量資料，因此較難掌握適當的進出場點。凡是提供成交量資料者，都值得進一步研究。就價格波動程度來說，多數交投熱絡的
    ETFs，相對其成分股，走勢較為穩定。

    - 股價指數迷你期貨契約，譬如：道瓊工業指數迷你契約、標普 500 指數 E 迷你契約、那斯達克 100 種股價指數期貨 E 迷你契約、羅素 2000 期貨
    E 迷你契約等深受市場歡迎。迷你期貨契約提供較高的財務槓桿，交易帳戶不必隨時保留至少 25,000 美元淨值（根據美國證管會規定，凡是在美國境內開設股票交易帳戶，當沖交易者帳戶至少必須維持
    25,000 美元淨值）。可是，股價指數迷你契約的行情波動劇烈，交易涉及可觀風險。如同所有交易工具一樣，最好循序漸進，實際介入前，不妨先深入研究。


    ## 全職或兼職？


    實際進行交易前，先建立目標。你打算花多少時間從事交易？你準備做為全職或兼職交易者？


    多數交易者在交易過程緊盯報價螢幕，不願錯過任何賺錢機會。某些交易者則另有正職工作，每週僅交易 2、3 天。我認識某些交易者，每天只交易 2 小時，也就是價格波動最劇烈的兩個交易時段：開盤後一小時（上午
    9：30 到 10：30），以及收盤前一小時（下午 3：00 到 4：00）。


    ### 兼職交易者


    現在，你已經設定準備投入交易的時間，讓我們更深入觀察你的目標：


    - 你打算每天進行 3 筆或更少的交易？

    - 你準備做為波段交易者或部位交易者？換言之，部位持有時間為 2 天到 2 個星期？或更久？

    - 你只有在空閒時才研究交易，並不打算全心投入嗎？


    你如果這麼做，只能算是兼職交易者；這種情況下，只需要透過折扣券商設立網路交易帳戶就可以了。交易設備可以安放在家裡或辦公室某個角落，包括一台電腦，兩台顯示器，以及一台電視機。


    ### 全職當沖交易者


    各位如果符合下列條件，就屬於全職的當沖交易者：


    - 你打算每個營業日都進行交易，且平均每天 3 筆交易以上嗎？

    - 你希望每筆交易都能設定精準的進場點和出場點嗎？

    - 你打算快速進出市場嗎？部位持有時間只有幾秒或幾分鐘。

    - 你打算全心全力運用技術分析與圖形分析嗎？

    - 將來準備仰賴交易為生嗎？


    如果符合上述條件，你就需要設立透過網路快速銜接交易平台，譬如：數位用戶迴路（DSL）、電纜或 T-1 線路。交易設備可以安裝在家裡，或與其他交易者共用辦公室。


    ### 網路券商


    透過網際網路銜接網路券商，可以說是股市的革命性創舉。過去，你需要開車到市中心某棟氣派的辦公大樓，由身著深色西裝的經紀人招呼你進入裝潢精美的辦公室，協助你開設交易帳戶。經由這類帳戶進行交易，每筆佣金可能高達
    100 美元。當然，券商會提供股票研究資料，你如果真能夠賺錢的話，或許足以因應佣金成本。


    近年來，交易環境的變化實在太大了。現在，網路券商提供一系列收費便宜的服務，熱情歡迎你光顧生意。你可能從未看過他們的辦公室，也未實際接觸他們的員工。


    ### 開戶


    想要開立股票交易帳戶，多數券商會請你透過網路下載開戶申請書，填寫後，用電子郵件寄回券商。然後，你可以把開戶資金藉由支票存入帳戶，或直接透過銀行帳戶把資金匯入交易指定帳戶。


    如果要在折扣券商開戶，需留意他們是否提供下列服務：


    - 合理低廉的佣金費率。

    - 網站瀏覽方便，能夠迅速顯示圖形。總之，網頁反應必須夠快。

    - 交易介面規劃合理，具有防範資料輸入錯誤的設計。

    - 快速回報系統，帳戶餘額與投資組合即時更新。

    - 方便使用、內容豐富的研究資料。

    - 多種替代聯絡管道。碰到緊急狀況或市場崩盤，交易指令的傳遞與執行效率如何，系統是否會塞車？伺服器是否會當機？是否可以透過電話聯絡經紀人？速度是否夠快？

    - 融資成數夠高（保證金成數夠低）；各家券商提供的融資成數差異可能讓你訝異。

    - 如果交易帳戶設定最低開戶金額，規定應該合理（如果符合美國證管會對於「典型當沖交易者」的規定，在 5 個營業日內進行 4 趟或以上的來回交易，帳戶內至少必須維持
    25,000 美元淨值）。


    如何挑選券商，口碑很重要。詢問其他交易者意見，除了費用之外，也要考慮券商提供的服務。挑選幾家最受推崇的券商，打電話請他們寄送相關資料。請記住，佣金费率如果很便宜，服務品質通常不太好。


    以下列舉一些常見的網路券商，包括網址與電話號碼：


