    \ 40 美元。整個部位的市值成為 12,000 美元，帳戶淨值為 6,000 美元，融資為 6,000 美元。所以，你的淨值損失為 1,500 美元，融資損失為\
    \ 1,500 美元，損失總計為 3,000 美元。如果你當初只做現金交易而買進 150 股，虧損只有一半。\n\n如同前面所提，你如果打算在 5 個交易日進行\
    \ 4 趟來回或以上的交易，股票帳戶淨值必須隨時維持 25,000 美元以上。換言之，交易過程裡，股票帳戶起碼必須維持這個餘額。如果違反規定，多數券商会凍結交易帳戶，直到你補足存款為止。根據常識判斷，為了保有緩衝彈性，存入餘額理當超過\
    \ 25,000 美元，至少應該有 30,000 美元。\n\n就當沖客來說，好消息是交易金額為現金的 4 倍。換言之，帳戶內如果有 25,000 美元，當沖交易金額可以達\
    \ 100,000 美元。可是，隔夜部位的保證金交易，通常是帳戶淨值的 2 倍。\n\n信用擴張看似有趣，但剛開始交易時，最好暫時忘掉保證金帳戶，完全做現金交易。另外，交易帳戶應該隨時保留部分現金。聽起來很無趣？請放心，不論抱持何等謹慎的態度，市場都會提供許多娛樂節目與刺激活動。\n\
    \n## 設計一套簡單的營業計畫\n\n如同本章標題所示，交易是一種事業，因此也應該當成事業來經營。成功的交易者會在進行交易前，先擬定簡單的營業計畫。運用前面討論的內容，編製一份自己的操作指南。舉例來說，稍做評估，判定自己是嫌惡風險或者能夠容忍風險，然後再配合可供運用的時間、財力，挑選適當的交易工具。\n\
    \n- 購置一台高性能電腦，一台或數台顯示器，尋找適當的網路服務商，或許還要租交易軟體，支付交易所費用（如果需要期貨市場報價資訊的話）。另外，你可能需要購買研究資料，訂閱報章雜誌。\n\
    - 嚴格規定一項法則：任何單筆交易所承擔的風險，絕對不可超過帳戶淨值 2%。舉例來說，假定交易帳戶內有 1 萬美元，則任何單筆交易虧損都不可超過 200 美元。當然，帳戶淨值如果變動，最低風險也要隨之調整。\n\
    - 核算每個交易日允許產生的帳戶最大淨值耗損，虧損一旦達到這個金額就停止交易，檢討交易程序。\n\n![](img/468d7cacb0b269ef1c907b6846010599_69_0.png)\n\
    \n最重要者，必須設定切合實際的目標。很多初學者經常犯下這方面的錯誤：「我開戶存入5萬美元，每天應該可以賺進500美元。」\n\n如同下一章準備討論的主題，最好設定程序導向而非金額導向的賺錢目標。強調精準的進場與出場點，提升交易勝率，这也是切合實際的健全目標，可以納入經營計畫。\n\
    \n## 創造成功導向的環境\n\n當沖交易最令人稱道的特色，就是可以在任何地方從事交易。總之，不論在怎樣的環境下進行交易，像是家庭辦公室、備用辦公室，或交易中心，一律適用某些準則。\n\
    \n想要正確進行交易，需要保持正確的心態，專心並秉持嚴格紀律執行交易。\n\n先從家庭辦公室談起，以下準則相當明確，有些可能是你沒有想過：\n\n- 交易場所最好設有窗戶，引進自然光有助於保持正面情緒，眼睛看東西也比較舒服。\n\
    - 若採用精密的交易軟體，不妨設置雙螢幕。如此一來，你可以同時觀看兩倍數量的走勢圖、造市者報價資訊與盤勢發展。\n- 不要忘了備用網路連接。相較於網路斷線可能造成的災難，每月支付的額外費用實在微不足道。\n\
    - 架設一台電視，轉到 CNBC 或其他財經頻道。\n- 交易過程不要接電話。你不大可能一邊談論職襟或流行服飾，一邊進行交易。我曾經因為禮貌而和朋友閒聊，同時進行交易，結果賠了不少錢。事先讓親朋好友瞭解，交易過程你不方便講電話。請打開電話留言機。\n\
    - 交易辦公室需要保持安靜。不要讓孩子或寵物在裡面跑來跑去，老公或老婆也不要好心幫忙打掃。\n- 桌面維持整潔，只擺放交易資料。手頭上的最大部位岌岌可危時，你當然不希望在紙堆裡尋找停損設定的交易資料。雜亂會導致壓力。\n\
    - 價格波動的部位如果沒有設定自動化停損，千萬不要跑去察看信箱或洗車。剛學習交易時，我曾經因為跑到外面照顧貓咪而賠掉 500 美元。\n\n## 模擬交易是否有必要？\n\
    \n某些人主張，初學者實際交易前，最好先花幾週或幾個月進行模擬交易，也就是沒有投入資金的紙上交易；另一些人則認為，這純粹是浪費時間。\n\n我認為模擬交易是相當有意義的學習工具，前提在於你必須假裝自己實際投入資金。這個過程可以協助交易者熟習市場脈動，以及個別股票或股價指數的股性。\n\
    \n模擬交易可能讓你賺進大把鈔票，誤以爲實際交易也很簡單。請注意，模擬交易欠缺一項要素：情緒。交易過程如何控制情緒，絕對會影響交易成敗的勝算。事實上，這個議題非常重要，本書第\
    \ 4 章將詳細說明。\n\n### 新手隨堂考\n\n- **>> 題目**\n    - 01. 股票交易不可動用哪種性質的資金？請說明相關的兩個法則。\n\
    \    - 02. 描述目前股票交易採用的三種層級報價資訊。\n    - 03. 設立兩個交易帳戶的三種優點。\n    - 04. 何謂滑價？\n \
    \   - 05. 避免支付過多佣金的三種方法。\n    - 06. 避免收到追繳保證金通知的安全方法。\n    - 07. 模擬交易是否值得運用？\n\
    \n- **>> 答案**\n    - 01. 運用於交易的資金不可害怕虧損，只能運用禁得起虧損的資金。\n    - 02. 第 1 級報價即時顯示最佳買進報價與最佳賣出報價；第\
    \ 2 級報價顯示所有市場參與者遞入的買進報價與賣出報價；第 3 級報價屬於專業報價商和造市者專用，允許他們更新或改變報價。\n    - 03. （1）碰到追繳保證金的情況，可以從另一個帳戶調度資金。（2）萬一碰到技術性問題，導致某個帳戶不能正常交易，可以透過另一個帳戶進行避險。（3）長期帳戶持有核心投資組合，可以緩衝或彌補當沖帳戶的虧損。\n\
    \    - 04. 滑價指下單當時報價螢幕顯示的理論成交價格，其與實際成交價格之間的差距。\n    - 05. （1）開設兩個交易帳戶，一個挑選佣金費率低廉的網路券商。（2）避免過度交易。（3）記住，交易要賺錢之前，必須先賺進佣金費用。\n\
    \    - 06. 交易帳戶隨時都應該保留部分現金。\n    - 07. 是的。模擬交易可以訓練初學者瞭解不同股票的股性、技術指標之間的關係，並且協助交易者熟悉市場脈動。\n\
    \n# 培養頂尖交易者思維\n\n## 你的願景，是生命對於偉大的邀請\n\n> 「如果知道自己不會失敗，你會怎麼做？」\n> —— 羅伯·舒勒博士（Dr.\
    \ Robert Schuller）\n\n你的願景隱藏在內心深處，它代表最純粹的潛能；即你的真實自我。真實願景代表最核心的自我，它說明了你是誰，世界定了你個人的偉大程度。\n\
    \n想要瞭解自己的願景，使其形成可辨識的思想形式，就必須撇開老舊、有限的信念，並看到真實的自我——由天賦智慧、能力與智識構成。這個自我可以發揮你的最高潛能，創立目的明確的人生。\n\
    \n一旦清楚自己的願景，你可能不知道如何完成它。很少人知道。可是，就如同種子埋入溫暖的土地，陽光自然知道如何讓植物生長，願景所蘊含的宇宙智慧也會讓它自然開花結果。\n\
    \n為了讓願景萌芽，你只需傾聽內心指引。按照它的指示行事。踏出第一步，然後第二步。如同來自陽光與雨滴的照顧，滋養種子成為強壯、健康的植物，你對於願景投入的能量愈多，它就成長得愈快。你將被自動引導到正確的人、正確的地方和正確的情況，推動你的旅程繼續向前邁進。\n\
    \n在你心中成長的願景，是無限的你、強大的你、睿智的你。只有你才有信心，滿懷熱情向前邁進，抓住最具挑戰性的機會。\n\n你的願景是生命對於偉大的邀請。你是否願意接受這個邀請？\n\
    \n# CHAPTER 4\n\n# 培養致勝的市場心態\n\n專家表示，好的性行為，10%來自身體，90%來自腦海。不論各位相信與否，好的交易也是如此：10%來自方法，90%來自心智紀律。你可以研究走勢圖與技術指標，直到眼睛打結為止，但除非發展一套明確的交易心態，否則你等於走在沒有安全護網的鋼索上。\n\
    \n首先，你的交易生涯必須奉行下列兩個應該鐫刻於石的法則：\n\n法則 1：保障交易資本。\n\n法則 2：追求完美交易（不是為了賺錢）。\n\n這兩個法則是否太簡單而不像真的？其實不然。它們看起來簡單，卻不易達成，但你可以設法精通。各位從本書學到的每件事，幾乎都可以回溯到這兩個法則。如果牢記這兩個法則，並將它們運用到每筆交易，幾乎可以確保你將有成功的交易生涯。\n\
    \n## 法則 1：保障交易資本\n\n任何領域的成功者，都會利用工具協助自己達成目標。\n\n身為成功的交易者，你的工具包括：市場知識、心智與情緒紀律，以及交易帳戶。永遠要保障交易資本，不要濫用、草率處理，也不要讓別人掠取。資金是你最珍貴的工具，必須全心全力保護它們。\n\
    \n「沒錯，我們早就知道這些東西了，」你回答，「你說得太簡略，你的解釋太過頭了。」\n\n真是如此嗎？我打賭大家都聽過這個統計數據：有 8 成或 9 成的交易者會破產。如同各位所知，某些交易者習慣追價、不採用停損、堅持抱牢失敗部位、過度交易、持有過於龐大的危險部位，以及逆勢進行交易。他們魯莽地對待自己最珍貴的工具：交易資本。\n\
    \n我每天和交易新手相處，他們宣稱自己會盡一切所能保護資本，但下一秒，他們就濫用交易資本，草率進行交易。他們沉迷於當下的刺激，受到飆漲股票的激勵，感染市場的買進陶醉氣氛。我們都曾經如此。\n\
    \n即使你能避免承擔所有不必要的風險，仍然有某個比例的交易會失敗，所以不要再讓草率的交易來添亂，否則有天起床，你將發現帳戶的資產都變了。\n\n那些每年獲利\
    \ 5 位數、6 位數，甚至 7 位數的真正玩家，對於自家帳戶資本的保護態度，就像母老虎照顧小老虎。他們秉持謹慎的態度交易。對於偶爾免不了泡湯的合理交易，他們將其視為經營事業的必要費用。除此之外，他們不會聽任草率交易造成的虧損來添亂。\n\
    \n經常出現在 CNBC 節目的精明退休投資人，也是哥倫比亞大學教授的吉姆·羅傑斯（Jimmy Rogers），他在傑克·史瓦格（Jack D. Schwager）著作的《金融怪傑》（Market\
    \ Wizards: Interviews with Top Traders）書中表示：「任何人都應該引用的最佳法則之一，就是……完全不做任何事，除非有事可做。我就是靜待一旁，直到鈔票躺在某個角落，而我需要做的，就是走過去，把它們撿起來。」\n\
    \n羅傑斯與其他頂尖金融玩家，他們懂得保障資本，累積龐大財富。他們能夠辨識高勝算機會的徵兆，且控制情緒，願意靜靜等待，直到時機成熟。各位也應該如此。\n\n\
    以下是有助於保障交易資本的心智工具：\n\n- 進行交易的过程中，隨時對自己說：「我永遠要保護自己的交易資本。」大聲喊出來。不要喃喃自語，而是激情大喊！聽起來蠻瘋狂的？試試看，確實有效。\n\
    - 按下「買進」鍵之前，好好思考下列問題：\n    - 1. 我為什麼要進行這筆交易？這筆交易是否符合市場趨勢？這個交易決策是否得到主要技術指標的確認？\n\
    \    - 2. 由技術角度評估，進場點是否完美？\n    - 3. 是否備妥高勝算的周全交易計畫？交易萬一失敗，出場點在哪裡？交易如果進行順利，如何獲利了結？\n\
    \    - 4. 進行交易的時間如何？（如果在營業日某個時段交易，幾乎可以保證交易成功或失敗。請參考第 5 章）\n\n經過適當的練習，你在 5 秒內就可以回答上述問題。答案如果明確、肯定，交易成功的機會應該很大；答案如果很模糊，需要尋找各種藉口，那麼最好三思而後行。\n\
    \n現在，請發誓或對自己保證，你一定會好好保護交易資本。寫下這條法則，貼在電腦登幕旁邊。另外寫幾份貼在浴室鏡子、冰箱門與其他場所，不時提醒自己。如果必要，寫在手背：總之，這個概念必須深植腦海。交易者對待自己的帳戶資本，應該像將軍對待自己配戴的指揮刀一樣關懷而尊重。隨時保護交易帳戶，不要隨便暴露在風險中。你如果妥善照顧它，它也會善待你，同時持續成長。\n\
    \n## 法則 2：追求完美交易，不是為了賺錢\n\n表面看起來，這條法則似乎不合理，實際不然。那些真正賺大錢的交易者，不會在交易過程中，一直盤算自己賺了多少錢。他們不會想著：哇，美孚汽油又漲了\
    \ 2 點。讓我算算看，嗯，1000 股，乘以 2 塊錢，總共是 2,000 美元。\n\n如果老是盤算自己賺或賠多少錢，必定影響專注力，判斷力也會被扭曲。\n\
    \n既然談到這方面問題，不妨再深入探討。早晨起床後，不要對你的伴侶、配偶、小孩或寵物宣稱：「我今天的交易必須賺進 1,000 美元。」相信我，這會讓你踏入失敗模式。我曾經這麼做，別人也曾經這麼做。我可以保證，這麼做等於展現了注定失敗的心態。\n\
    \n事實上，你如果設定某個金額目標，告訴自己每天必須帶多少錢回家，幾乎就可以確定這個目標絕對無法達成，對初學者來說尤其如此。「必須賺多少錢的目標」會影響你對於市場的判斷。這方面的壓力可能促使你勉強進行勝算不高的交易，因為你承諾自己或別人將帶多少錢回家。\n\
    \n另外，當你做出此類承諾後，往往會碰到數週以來不曾看到的棘手行情。技術指標顯示你最好留在場外觀望，但內心卻不斷焦急你進場賺錢，於是你勉強交易。結果幾乎一定賠錢。現在，你更是尷尬與懊惱，覺得自己被打臉，最後自然造成更嚴重的虧損。\n\
    \n糾正這種錯誤：從現在開始，你的目標不是賺錢。\n\n交易目標：把交易做好。交易過程不要心繫金錢。忘了這件事。把股價看成單純的數字，而不是金錢。\n\n\
    完美交易如同藝術品。就像毫無瑕疵地把球傳給 30 碼外跑動的接球員，或者像進行心臟手術，又或像戰鬥機降落在航空母艦甲板上，這些皆需展現高度技巧與果斷決心。對於完美的交易來說，金錢只是副產品；交易結束後，你大有時間慢慢計算。\n\
    \n股票交易具有一項神奇特性：你愈是不考慮金錢，金錢累積的速度愈快。為什麼？全心全力進行完美交易的人，他們讓失敗交易迅速認賠，讓成功交易繼續發展。他們珍惜、愛護自家的交易資本，不冒不必要的風險。他們瞭解某些不適合交易的劇烈波動行情，知道如何退場觀望。他們懂得控制情緒，不對任何人做出金錢承諾，包括自己在內。\n\
