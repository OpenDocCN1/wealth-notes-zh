    # ## 根本放空策略


    股票處於上升趨勢，當價格向上突破壓力高點，你會針對部位交易、波段交易建立多頭部位；反之，當股票處於下降趨勢，當價格向下貫穿支撐低點，你也會在其下方 1～10
    美分位置建立空頭部位。


    建立空頭部位前，絕對要先做風險／報酬分析，並運用前文提到的 1：2 或 1：3 比率。換言之，對於空頭部位來說，潛在風險是上檔最近的壓力，也就是空頭部位停損而準備回補的價位。至於獲利潛能，則計算下檔支撐的獲利目標。請注意，為了避免軋空，獲利目標最好設定在實際支撐上方
    50 美分附近。


    對於動能交易與當沖，風險／報酬比率參數應該根據盤中目標調整。設定在上檔最近壓力區域的停損，其與進場價格的距離必須夠接近，如此才能有效保障資本，至於獲利目標（最近支撐）必須夠遠，足以提供充分獲利潛能。


    如果放空對象跌勢猛烈，限價賣單設定在最佳買進報價下方 2～3 美分位置；反之，如果放空對象呈現漲勢，限價賣單可以設定在最佳賣出報價。


    ．空頭部位建立後，回補停損單可以設定在進場當天高價上方 10～70 美分位置。這個停損距離如果太遠，可以運用 60 分鐘走勢圖尋找最近的上檔壓力水準，回補停損單設定在該水準上方
    10～70 美分位置。此處考慮的 10～70 美分乃代表安全緩衝，我們不希望停損被正常價格波動引發。空頭部位的停損一旦設定，絕對不可向上調整，不論基於任何理由或考量。股價一旦觸及停損，就停損回補。


    對於波段交易與部位交易，價格一旦下跌，停損應該調整到日線圖最近反彈高點或盤整區域上方 10～70 美分位置。部位獲利 1 點左'
  - '[PAGE 371]


    右，應該先回補半數部位。剩餘部位可以等到追蹤型停損遭到引發，或趨勢轉弱或獲利目標達成。


    最安全的放空進場點，是尋找價格處於明確下降趨勢的股票。任何呈現階梯狀下降趨勢（換言之，走勢的一連串波段轉折高點與低點持續下滑）的股票，20 天移動平均與 50
    天移動平均扮讀上檔「天花板」壓力的股票，走勢只要出現明確向下突破發展，就適合放空。等待股價向上反彈而漲勢轉弱，就進場放空。還記得美好的春天嗎？向下的相反型態，就是適合放空的「陰暗的秋天」。


    現在是重新複習第 5 章陰陽線型態的大好時機，譬如：空頭吞噬型態、吊人、夜星等，這些型態都代表趨勢即將向下反轉。


    各位或許也想稍微溫習第 6 章討論的向下突破。上升趨勢連續型態產生的某些架構——這些東西只需要朝相反方向調整。


    盤中走勢圖處於崩跌狀態的股票，尋找連續整理型態，以及過度延伸而即將反轉的漲勢。觀察 5 分鐘或 15 分鐘走勢圖，留意那些股價處於 20 期移動平均之下的股票。愈多移動平均處在股價上方，愈適合放空。


    留意先前交易日發生與目前存在的重要支撐水準，觀察它們在盤中走勢圖的位置。價格跌勢可能在哪裡回升？該處距離空頭部位進場點至少要有 1、2 點價差。這個價差愈小，風險愈高。


