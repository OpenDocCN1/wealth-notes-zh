    從事放空操作，同樣適用由上而下的準則。首先尋找大盤疲弱的市況，或至少有些主要指數，例如紐約證交所或那斯達克走勢疲弱（取決於標的股票掛牌交易所）。標的股票隸屬的類股走勢也呈現下降趨勢。TICK
    呈現負值讀數，TRIN 讀數超過 1.0。另外，標普期貨 E 迷你契約與那斯達克 100 期貨 E 迷你契約下跌。如果使用隨機指標或 CCI 等擺盪指標，最好呈現空頭背離，或處於下降趨勢。


