    易、針對銀行類股與營建類股進行波段交易，或者進行道瓊指數成分股的部位交易，並運用道瓊期貨迷你契約進行避險。各位也可能從事ETF的部位交易，然後運用選擇權避險，甚至嘗試外匯交易。


    不論怎麼決定，如果你像其他專業玩家一樣挑選特定領域，獲得成功的速度與成就，想必會勝過涉獵許多不同領域的人。


    ## 高素質金融網站


    目前，可供投資人和交易者運用的金融網站，它們提供的資訊豐富程度，已經完全超出過去的想像。透過搜尋引擎輸入股票或當沖……碰！你會看到數不清的網站出現。


    為了方便讀者著手，以下列舉某些網站，它們提供的資料主要是金融市場的教育資訊與新聞。這些網站大多可以免費瀏覽，有些則提供訂閱服務，不過仍然包括一些免費資訊。


