    1-2-3 進場階段。


    - 1. 早盤出現明顯跌勢，到了午休時段，走勢開始盤底，快速形成底部。中午 12:30 左右，ABX 回升，並且在 29.28 美元向上突破底部盤整。價格隨後上漲，突破先前高點
