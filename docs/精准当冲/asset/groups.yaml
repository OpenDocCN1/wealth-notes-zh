    > ### 新手筆記


    走勢動能十足的日子，大盤如果呈現上升趨勢，你持有的股票也跟著水漲船高的話，有些交易者在 5 分鐘或 15 分鐘走勢穿越 20 期移動平均時買進，或在 5 分鐘或
    15 分鐘線形跌破移動平均時賣出。'
