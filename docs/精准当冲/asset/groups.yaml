    # 新手隨堂考


    # ## 題目


    +   01. 處於強勁上升趨勢的股票，有價漲量增、價跌量縮的現象。正確或錯誤。


    +   02. 有效的向上突破，需要大成交量配合嗎？為什麼？


    +   03. 股票夾著大成交量向上突破，不過成交量在價格拉回過程仍然很大。這是什麼意思？


    +   04. 股票交易（當沖或波段交易）對象，每天平均成交量少於 10 萬股，這種情況合適嗎？為什麼？


    +   05. 移動平均代表重要的支撐與壓力。正確或錯誤？


    +   06. 對於當沖交易，你考慮的股票 5 分鐘走勢圖，顯示股價正處於 20 期移動平均附近，但上檔緊靠著 200 期移動平均。這種情況下，是否適合建立多頭部位？理由何在？


    +   07. 某股票呈現橫向區間走勢。20 期移動平均呈現水平狀發展。這種情況下，移動平均提供的資訊是否值得參考？


    +   08. 隨機指標、CCI 與 MACD 為何是有效的決策輔助工具？'
  - '[PAGE 220]


    # » 答案


    +   01. 正確。股票呈現強勁的上升趨勢，對於買盤的吸引力大於賣盤。所以股價上漲時，成交量理當放大，價格一旦回檔或呈現橫向整理，成交量就會萎縮。

    02. 沒錯，向上突破過程爆出大量，有助於突破成功。更多買盤（需求+貪婪）推升股價，價格漲得愈高。

    03. 價格向上突破後的拉回整理過程，成交量如果增加，意味著壓碟嚴重，向上突破很可能失敗。

    04. 股票每天平均成交量如果不足 10 萬股，就不適合做為短期交易對象。成交量如果太低，萬一需要立即買賣股票，恐怕會有風險。

    05. 沒錯。類譬如 20 期、50 期、100 期與 200 期等主要移動平均，通常具有顯著支撐/壓力功能。

    06. 不，這不是進場建立部位的好時機，不論多頭或空頭部位都是如此。股價如果位在 200 期移動平均之下，就不適合買進，除非你想撿便宜貨。這種情況同樣不適合建立空頭部位，因為股價位在
    20 期移動平均之上，低檔有支撐，至少暫時如此。如果想建立空頭部位，應該等價格跌破 20 期移動平均（如果大盤與其他技術指標配合）。

    07. 唯有行情呈現明確的上升或下降趨勢，移動平均才'
