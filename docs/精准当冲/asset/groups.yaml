    \ 總裁\n\n# 謝詞\n\n這幾個月來，我第一次鬆口氣。感覺很棒！不久前，我完成第一本著作《精準當沖》的第二版修正（另外兩本著作分別為《短線交易初學指南》〔A\
    \ Beginner's Guide to Short-Term Trading〕與《新股市短線交易》〔Short-Term Trading in the\
    \ New Stock Market〕）。\n\n就寫作來說，本書是我的第一胎，對我的人生具有非凡的意義。\n\n就如同養育小孩一樣，本書不免牽連到許多人。\n\
    \n本書得以完成，有賴許多人的貢獻，我想借此機會致意，感謝他們在過程中給予協助。\n\n感謝我的先生 Mike，感謝你一再容忍，包括垂死的盆栽、遲來的晚餐，以及寂寞的週末假日。感謝你提供的各種意見與支持，還有熱情的擁抱。\n\
    \n感謝我的女兒 Adrienne，感謝你的鼓勵、幽默與智慧。妳給我帶來歡樂、光明與真正的祝福。\n\n感謝我的家人 Chuck、Tammy、Gail、Missy、Jenny\
    \ 與 John，感謝你們的支持，並體諒我「潛入幕後」。\n\n感謝我的助理 Tina Hoelsli，感謝妳的敏捷與高效率回應，並且經常鼓舞我的士氣。\n\
    \n感謝我的編輯 Jill Alexander，感謝妳提供的強大支援，推動我向前邁進。妳是最有耐心、最有才華的編輯，感謝妳協助本書得以圓滿完成。\n\n感謝我的出版代理\
    \ Deidre Knight，感謝妳全力支持，如果沒有妳，本書絕對無法完成。妳是最棒的！\n\n感謝 RealTick 軟體的開發商 Townsend Analytics,\
    \ Ltd.，尤其是 Mike Felix 與 Sarah Neis，感謝你們的支持。\n\n感謝 John Carter 能夠在百忙之中撥空幫本書撰寫前言。\n\
    \n感謝我的好友提供給一位作者的最大支持，尤其是 Joyce Smith、Jacqueline Middleton、Pam Hastings，以及 Penny\
    \ Lavoie。是的，Penny，如同妳所建議，本書從頭到尾綻露著「愉悅色彩」。\n\n最後，我要感謝辦公室同仁 Beverly Pickens、Mary\
    \ Ellen 與 Courtney，你們經常鼓勵我，每天供應我好幾次巧克力糖……\n\n感謝你們每一位！老天爺祝福你們！\n\n# 導論\n\n歡迎來到當沖的蠻荒世界。請抓牢了，因為你們將經歷一段最精采、恐怖的旅程！\n\
    \n股市如同雲霄飛車，把交易者帶到令人汗毛直豎的顛峰，然後灑到地獄深淵。愛好刺激的冒險者趨之若鶩，而膽小者只能勉為其難忍受或離開。\n\n所謂當日沖銷（day\
    \ trading）或活躍交易（active trading）是一種不怎麼溫和的交易方式，它必須在同一個交易日完成股票買賣。1990年代之後，這種交易方式變得異常普遍，精明的交易者藉此賺了不少錢。這與市場成長脫離不了關係：自從\
    \ 1995 年以來，全球矚目的道瓊工業指數，由 3,834 上漲到 11,000 以上。當然，標普指數與那斯達克綜合指數（NASDAQ）也不甘寂寞，同樣屢創高價。\n\
    \n1990 年代末期的大多頭市場，帶領股價一飛沖天，直到 2000 年代初期的空頭市場把股價拖到谷底，隨後又向上奔騰。\n\n面對如此激烈的價格波動，投資人不得不放棄過去奉為圭臬的「買進一持有」策略。股價不僅急漲，也會急跌；換言之，怎麼上去，就怎麼下來。全球事件對股市造成的衝擊異常快速，交易者必須學會「及時掌握」手上的東西。（慘痛的）經驗顯示，「志得意滿」的後果，往往是「獲利得而復失」。\n\
    \n1990 年代初，首批當沖客出現。當中有很多人是「SOES 草寇」（small order entry system，小額指令輸入系統），也是最早運用網際網路進行交易的玩家。他們運用那斯達克第\
    \ 2 級報價資訊，下單到電子交易所「場內」。\n\n隨著網路日益普及，一般交易者也學會如何研究股市。原本專屬於特殊菁英的神祕領域，現在開放給這些熱中研究的人。他們不僅能勝任研究，還能推導市場各種因果變化。舉例來說，通貨膨脹如果造成威脅，聯準會就會調高利率，所以企業將被迫支付較高的貸款利息，盈餘也會減少，結果造成股價下跌。\n\
    \n1995 年，嘉信集團（Charles Schwab）首先成立折扣證券商。其他折扣券商隨後陸續成立，並提供各式線上服務。現在下單交易不再受限於電話聯絡，也無須等待營業員接單，人們紛紛透過網路帳戶交易，並透過電腦自動設定停損、追蹤行情變化。\n\
    \n到了 1997 年，股市成為當紅炸子雞，不僅成為人們熱烈追逐的目標，股價也不斷創新高（雖然某些股價屢創新低，但似乎未受注意）。很快地，人們聽說網路帳戶可以隨時買賣股票，只要花幾分鐘或幾小時就可以賺進大把鈔票。太棒了！新時代的市場交易者於焉誕生，我們稱之為「當沖客」。\n\
    \n當然，這些積極從事交易的玩家需要更先進的工具，於是直接下單券商應運而生。他們採用精密的交易平台，也就是運用那斯達克第 2 級報價資訊的小額指令輸入系統下單，並提供各種精確的股價走勢圖與技術指標。\n\
    \n1990 年代末期到 21 世紀初期，股市資深交易者想必清楚當時發生的故事。2000 年 1 月，股市飆漲到令人噴鼻血的程度，市場沉迷於陶醉氣氛，不論是宴會派對或電視談話節目，談論主題經常圍繞股市行情。交易者往往瞬間賺進龐大財富，然後沒多久又賠光。\n\
    \n行情怎麼上去，就怎麼下來，到了 2000 年春天，在高度膨脹的那斯達克市場與科技股帶動下，市場泡沫破滅。2002 年 10 月，原本不可一世的科技類股指數由高點\
    \ 5,132 跌到低點 1,108。\n\n當沖客如果不願或不懂得放空股票，甚至堅持過去做多的心態，接下來只能面對破產的命運。所謂的搶帽客（scalpers）也在\
    \ 2001 年 4 月喪失獲利空間，因為買賣報價的價差明顯縮小（也就是當時最佳買價與最佳賣價之間的價差）。\n\n當然，空頭市場不會永遠持續；到了 2003\
    \ 年，金融市場再度綻露樂觀氛圍。股票價格又上漲了。\n\n隨著股市蓬勃發展，新型交易工具陸續推出，除了股票與選擇權之外，交易者還可以挑戰集中市場掛牌交易的基金（Exchange\
    \ Traded Funds，簡稱 ETFs）、E 迷你契約、道瓊指數迷你期貨契約，以及個股的期貨契約。過去，外匯交易原是銀行與金融機構專屬市場，現在個人交易者也得以下涉足此領域（提供全球外匯與相關期貨契約的交易）。\n\
    \n網路券商與直接下單券商，明顯提升了交易平台的運作效率與執行速度。\n\n「好了，我懂了，身為交易者，我們只要上網，瀏覽股票新聞和走勢圖。然後，運用網路交易系統，用滑鼠點擊我們想買進的股票，當然要先挑選最完美的買點。接著，我們可以坐下來，喝杯咖啡，等著數鈔票。對嗎？」\n\
    \n沒錯。\n\n嗯……有時候確實是如此。\n\n我確實碰過這樣的例子，雖然未必始終如此。\n\n踏入這個行業初期，我曾趴在電腦鍵盤上琢磨著：「我到底搞錯了什麼？」看著交易帳戶餘額不斷地一大筆、一大筆流失，這顯然不是我負擔得起的。我靠著這個帳戶過活，從中支付房貸、水電費、女兒的學費，還有高額的信用卡債。你很少看到交易帳戶餘額能夠如此快速減少。\n\
    \n有一天，我決定賣掉所有的股票（不需要太費勁，因為淨值所餘不多），而且鬱悶了好幾週。然後，我從自怨自艾的情緒中平復，開始感到生氣。究竟是什麼緣故，讓我賠這麼多？有個念頭忽然徘徊在我的腦海：知識。我欠缺必要的知識。\n\
    \n有些工作只要憑藉著一點勇氣，還有適當的運氣，就不難成功，但股票交易顯然不能這麼做。踏入這個生死相搏的競技場，如果不具備必要的知識，你會被當作點心吃掉。\n\
    \n我知道自己是失敗者之一，犯下了無數的錯誤。遭逢龐大的虧損後，親朋好友不斷勸我放棄，可我就是那麼頑固。\n\n我繼續閱讀那些看不懂的技術分析書籍、觀賞 CNBC\
    \ 金融分析節目，直到眼花繚亂。有一天，朋友介紹我認識一對成功的當沖客夫婦。在邀請之下，我到他們家參觀交易的電腦設備，並瞭解如何進行交易。一個嶄新的世界在我眼前敞開。我發現，當沖交易遠較我當初想像的要困難得多。\n\
    \n我屈服了，開始參加探討交易技巧與策略的課程，瘋狂地研究與學習。6 個月後，朋友問我的交易進展如何，我咬牙堅稱：「我已經賠得比較少了。」\n\n他們只能翻白眼。\n\
    \n又過了一陣子，我大致可以打平。然後，有一天，大約是我從事交易一年後，我終於有能力賺錢，而且是相當穩定地賺錢。雖然賺得不多，但起碼可以維持生計。\n\n\
    等到賺錢成為家常便飯後，我覺得可以協助別人像我一樣。我想，必定有很多人希望在家裡工作，自己當老闆，自由安排作息時間，還能每週賺點生活費。\n\n那些初學者為什麼要和ㄧ樣犯下相同的錯誤呢？我說不定能夠幫助他們避開某些嚴重的錯誤——那些可能勾消交易帳戶的錯誤。\n\
    \n剛從事股票交易時，我希望有一本書可以直截了當地告訴我應該怎麼做：「市場如果出現這種現象，就不要交易，」或「市場如果發出這種訊號，就大膽進場。」於是我決定，等到我能夠穩定賺錢時，就要寫一本這樣的書。\n\
    \n本書接下來的篇幅，我會像好友交心一樣，跟各位談論交易。我會解釋如何進行交易才不至於嚴重虧損，也會在大家實際進行交易之前——而不是之後——說明絕對重要的細節。我會告訴各位如何保障資本，進而賺錢。\n\
    \n真希望當初有人可以告訴我這些，而且是用我聽得懂的方式來說。若是如此，我就可以避免許多不必要的損失。所以，想從事交易的朋友們，請聽我娓娓道來。\n\n現在，先預祝各位賺錢順利！\n"
