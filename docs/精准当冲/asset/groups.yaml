    圖 9-15 顯示 Chevron Corp. (CVX) 日線圖的頭肩底排列案例。


    # 單純的突破


    每支股票各有股性。股票呈現橫向整理，未必能夠發展為杯狀帶柄或雙重底等特定型態的結構，可能只是單純地進行盤整，等待好消息、盈餘，或籌碼承接。這種單純盤整仍然可供操作——事實上，我更喜歡這種型態，因為比較容易設定進場點。


    橫向盤整的結構愈緊密，操作風險愈低。只要候選對象符合由上'
