    \n## 保證金交易（融資／融券交易）\n\n融資（保證金）就是往來券商提供的貸款。如同銀行一樣，券商也收取利息。開設交易帳戶時，你可能希望開設保證金帳戶，通常稱為「50%保證金帳戶」。換言之，貸款額度等於你在帳戶內存入的資金（貸款額度不收取利息，除非實際動用）。\n\
    \n你如果在股票交易帳戶存入 10,000 美元，往來券商会提供 10,000 美元的貸款額度，所以交易帳戶的購買力為 20,000 美元。\n\n> **新手筆記**\n\
    > 期貨交易帳戶另有最低開戶金額的規定，細節資料請向期貨券商查詢。\n\n請注意，運用帳戶所有購買力，不論是否涉及保證金（融資），絕對是最危險不過的行為。交易如果充分運用融資，盈虧潛能是現金交易的兩倍。舉例來說，假定融資買進\
