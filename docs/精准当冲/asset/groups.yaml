    \n# 前言\n\n1999年底，全民包括養老院看護在內，幾乎都成為股市天才。人們依照基本面（譬如「網頁點擊率」）挑選股票，若買進的股票沒有馬上賺錢，就抱牢持股，期待最後喜劇收場。窩囊廢才用停損單。有一陣子，這套策略確實奏效且運作得相當順暢，但2000年第2季後，它就失效了。這個曾讓許多人賺大錢的方法，很快就成為虧損的保證。可是，人們有因為受到教訓而調整策略嗎？不，多數人還是搞砸了。\n\
    \n時值2000年，我已經在股市打滾十多年，經歷過1987年股市崩盤，累積許多失敗教訓。當市場泡沫崩解，我已不是新手，股票操作也順利翻多為空，因此賺了不少錢。我認識的很多人，顯然沒有針對市況調整操作方式。反之，他們沿用過時的策略。網際網路畢竟改變了世界，一切只需用滑鼠點一下。這次確實不同。唉！他們受傷慘重。\n\
    \n當時的情況頗令人沮喪，我想找尋適當書籍，推薦給從事市場交易的親朋好友，但就是「找不到」。這些書不是強調技術、內容枯燥乏味，就是看法太過樂觀，認為道瓊指數會奔向36,000點。正當我準備放棄時，偶然看到托妮・透納（Toni\
    \ Turner）的《精準當沖》（*A Beginner's Guide to Day Trading Online*），內容令人耳目一新。\n\n> *\
    \ 備註：書名直譯為《網路當沖初學指南》。這本書第二版的繁體中文版（也就是讀者手上的這本書），書名另訂為《精準當沖——美股當沖實戰守則，抓住每個下單決策點》。\n\
    \n剛開始交易時，我曾經參加講習、造訪相關網站、徵詢營業員意見等，盡可能學習相關知識。可是我取得的資訊往往十分晦澀，甚至說法彼此矛盾。我希望可以找到更符合人性的學習方式，像是認識某個資深老手，我們一起前往星巴克喝咖啡，暢談交易經驗。這就是我閱讀托妮著作的感受。因此，我非常樂意推薦本書給剛學習股票交易的新手。本書極易閱讀，讀者可以輕鬆瞭解市場運作方式，學習各種交易方法，而不只是抱著期待心理買股。\n\
    \n本書內容首先討論股市短線交易者的生活形態，包括最早那批交易者。然後，作者簡單描述市場運作方式，以及個人交易者在其中扮演的角色。接著，托妮清楚而有趣地說明如何進行當日沖銷交易，如何將此視為事業來經營。我非常贊同本書強調的主張：「把交易做好，而不是為了賺錢」。這個概念可以讓交易者省掉不少麻煩，避開許多挫折。\n\
    \n接下來，托妮敘述技術分析與交易架構的基本知識，這也是我強烈推薦新手與進階者閱讀的理由。我經常接到讀者詢問移動平均、基本價格型態，以及各種擺盪指標等問題，我的回應很簡單：閱讀托妮這本著作！本書還採用我喜歡的「邊喝咖啡邊聊天」風格撰寫，效果相當好。\n\
    \n無論從事任何行業，若想要成功，必須先瞭解工作環境。就金融業來說，網路或線上交易屬革命性創舉，從開戶到點擊買賣按鍵的行為看起來異常「簡單」。這也意味著沒有經過適當訓練的投資人，更容易因為操作太過簡單而產生誤解，或者觀念遭到扭曲。舉例來說，任何人如果沒有受過專業飛行訓練，就不可能潛進機場，成功駕駛某架\
    \ 747 客機。網路交易也是如此，我認識的投資人，即使對股市只有最粗淺的認識，也想藉此試試手氣，看結果如何。但當沖交易並不適合這樣做。\n\n初學者想要盡快上手、透過股票交易謀取生計，托妮這本著作是最佳入門捷徑。本書新版增訂了初版問世以來的變動，包括造成交易世界革命性變化的事件。讀者如果希望有人可以在星巴克和他們一起閒談股票交易，共同探索這個令人興奮的行業，本書正是他們需要的。\n\
