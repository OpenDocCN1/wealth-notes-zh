    空頭在 MDC 跌破 83 美元（完成雙重頂排列）進場建立部位。股價雖然跌破第一道支撐 78 美元，但 8 月整理暫時守住 75 美元。


    ![](img/468d7cacb0b0b269ef1c907b6846010599_365_0.png)

    圖 11-16 NetEase.com Inc.（NTES）15 分鐘走勢圖，顯示一波多頭走勢最終演變為快速而致命的雙重頂排列。5 月 16 日，價格漲勢沒有克服框紐水準
    R1 的壓力。隔天，5 月 17 日，價格向上跳空，最初 15 分鐘一度挺進到前一天高價，結果卻收長黑線，同時完成雙重頂排列。請注意，開盤第一支線形跌破 23
    美元，該處也是先前折返低點／昨天收盤價／20 期移動平均，空頭如果在此進場，到了 S2 可以迅速獲利 1 點，如果繼續持有部位，每股可以多賺進 60 美分。

    RealTick* graphics used with permission of Townsend Analytics, Ltd. © 1986–2007
    Townsend Analytics, Ltd.


    請注意，8 月價格向下跳空的兩天後（雙重頂排列經常透過向下跌空走勢完成型態），持有隔夜部位的空頭可以獲利不少。


    到了 9 月與 10 月，MDC 日線圖出現另一個雙重頂排列。


    圖 11-16 顯示 NetEase.com Inc.（NTES）的 15 分鐘走勢圖。請注意，價格重新測試高點失敗而完成雙重頂排列的同時，价格也跌破日線框紐水準與
    20 天移動平均。數個賣出訊號彼此確認，顯示 NTES 乃是極佳放空機會。


    ### 頭肩頂


    ![](img/468d7cacb0b0b269ef1c907b6846010599_366_0.png)

    圖 11-17 放空型態：頭肩頂排列


    頭肩頂排列是此處想要討論適合做為部位交易、波段交易與當沖放空操作的第二個高勝率架構，請參考圖 11-17。這種型態看起來像是一般人體輪廓。股價上升趨勢發展告一段落，價格拉回而形成「左肩」。稍做整理後，價格回升再創新高「頭部」，價格隨後折返獲得支撐，最終又出現另一波漲勢而創下較低的峰位「右肩」。請注意，頭與兩肩所夾低點的連線，其延伸稱為「頸線」。


    價格一旦跌破頭肩頂排列的頸線，大概會發生一波重大跌勢。交易者建立的空頭部位，回補停損單可以設定在進場當天高價上方 10~70 美分位置。


    最理想的頭肩排列交易，請檢視成交量狀況：左肩的成交量應該最大，頭部也可能出現大量，但右肩的成交量應該明顯萎縮。如果右肩爆出大量，務必謹慎，該排列可能演變為上升趨勢的連續排列。交易者若想建立空頭部位，最好等待日線收盤價跌破頸線，雖然可能減少獲利，但可以避免碰上軋空行情。頭肩頂排列如果演變為上升趨勢，漲勢可能相當猛烈，迫使空頭恐慌性回補。


    圖 11-18 顯示 Lennar Corp.（LEN）日線圖的頭肩頂排列。這種排列雖然發生在盤中走勢圖，但日線圖與週線圖的型態結構通常比較明顯。


    頭部反轉排列完成後的放空操作，還有兩項額外建議：


    - 挑選先前頭部漲勢特別陡峭的對象。頭部漲勢愈猛烈，後續跌勢愈可觀。

    - 下檔支撐顯得愈微弱，跌勢發展得愈快。


    ![](img/468d7cacb0b0b269ef1c907b6846010599_367_0.png)

    圖 11-18 Lennar Corp.（LEN）日線圖呈現相當明確的頭肩頂排列。請注意「頭部」的十字線。價格由頭部反轉下滑後，形成右肩的過程，20 天移動平均快速趨於平坦，當時有
    2 支陽線的上影線特長，凸顯上檔沉重買壓。走勢同時跌破頸線與 50 天移動平均之後，LEN 並沒有很快放棄抵抗，反彈走勢一度重新測試頸線，但這支反彈長陽線並沒有嚇跑空頭，也沒有引發許多空頭部位停損。LEN
    緊跟著出現大跌走勢。請注意，幾週後，價格重新向上測試頸線（走勢圖標示「反彈回升」），這代表另一次放空機會。事實上，隨後幾個月內，又出現多次放空操作的機會。

    RealTick® graphics used with permission of Townsend Analytics, Ltd. © 1986-2007
    Townsend Analytics, Ltd.


    ### 包寧傑帶狀（Bollinger Bands）


    關於放空操作，約翰·包寧傑（John Bollinger，www.bollingerbands.com）提供另一項有用的指標。包寧傑帶狀（Bollinger
    Bands）類似於移動平均，該指標由兩條曲線構成，分別代表價格行為波動的上限與下限。


    標準的包寧傑帶狀，其涵蓋範圍是價格±2 個標準差（standard deviations，用以衡量價格波動程度）的 20 期指數移動平均。多數圖形分析軟體都提供包寧傑帶狀指標。


    包寧傑帶狀的主要性質：價格走勢如果向上觸及包寧傑帶狀上限，隨後很可能反向折返；跌勢如果觸及包寧傑帶狀下限，隨後也很可能向上折返。


    讀者可以觀察價格行為與包寧傑帶狀的互動關係，這種互動型態如果符合個人交易風格，不妨用於放空操作。換言之，股價如果來到包寧傑帶狀上限而折返，此時適合放空（就我來說，除非股價當時位在
    20 天移動平均之下，否則我還是不會放空；這是我放空操作的基本法則）。


    圖 11-19 顯示 Dell Inc. (DELL) 日線圖，以及包寧傑帶狀的运用。


    ![](img/468d7cacb0b0b269ef1c907b6846010599_369_0.png)

    圖 11-19 Dell Inc. (DELL) 日線圖，此處顯示包寧傑帶狀與 20 天移動平均（虛線）。2 月份，價格向上突破，但漲勢後繼乏力，走勢轉弱。最佳放空機會在
    4 月，包寧傑帶狀當時呈現收斂，意味著將突破走勢。價格跌破 20 天移動平均，不能支撐包寧傑帶狀上升。不久，價格跌破年初以來的下檔支撐，所有徵兆都顯示價格將下跌。這波下降趨勢發展過程，空頭部位獲利頗豐。價格跌至
    26 美元，行情一度反彈到包寧傑帶狀上限，但漲勢無以為繼，又出現另一次放空機會。

    RealTick* graphics used with permission of Townsend Analytics, Ltd. © 1986-2007
    Townsend Analytics, Ltd.


    ## 新手筆記


    1. 日線圖呈現雙重頂或頭肩頂排列，當價格跌破支撐而完成排列，隔天上午開盤經常向下跳空。除了恐慌性賣出與放空操作造成的賣壓外，還有第三種賣盤：許多交易者與投資人持有多頭部位，往往在這個支撐水準設定自動化停損單。價格一旦跌破支撐，就引發停損賣單，龐大賣壓遠超過買盤所能夠消化。另一個理由：恐慌性賣壓。

    2. 如上升趨勢一樣，價格跌勢也有賴大成交量引發動能。可是，重大跌勢未必需要大成交量配合，股票可能因為其他問題而下跌，譬如：交易者冷漠、投資人不關心、盈餘利空消息、大盤瀕臨空頭氣氛等。


    ## 根本放空策略


    股票處於上升趨勢，當價格向上突破壓力高點，你會針對部位交易、波段交易建立多頭部位；反之，當股票處於下降趨勢，當價格向下貫穿支撐低點，你也會在其下方 1～10
    美分位置建立空頭部位。


    建立空頭部位前，絕對要先做風險／報酬分析，並運用前文提到的 1：2 或 1：3 比率。換言之，對於空頭部位來說，潛在風險是上檔最近的壓力，也就是空頭部位停損而準備回補的價位。至於獲利潛能，則計算下檔支撐的獲利目標。請注意，為了避免軋空，獲利目標最好設定在實際支撐上方
    50 美分附近。


    對於動能交易與當沖，風險／報酬比率參數應該根據盤中目標調整。設定在上檔最近壓力區域的停損，其與進場價格的距離必須夠接近，如此才能有效保障資本，至於獲利目標（最近支撐）必須夠遠，足以提供充分獲利潛能。


    如果放空對象跌勢猛烈，限價賣單設定在最佳買進報價下方 2～3 美分位置；反之，如果放空對象呈現漲勢，限價賣單可以設定在最佳賣出報價。


    空頭部位建立後，回補停損單可以設定在進場當天高價上方 10～70 美分位置。這個停損距離如果太遠，可以運用 60 分鐘走勢圖尋找最近的上檔壓力水準，回補停損單設定在該水準上方
    10～70 美分位置。此處考慮的 10～70 美分乃代表安全緩衝，我們不希望停損被正常價格波動引發。空頭部位的停損一旦設定，絕對不可向上調整，不論基於任何理由或考量。股價一旦觸及停損，就停損回補。


    對於波段交易與部位交易，價格一旦下跌，停損應該調整到日線圖最近反彈高點或盤整區域上方 10～70 美分位置。部位獲利 1 點左右，應該先回補半數部位。剩餘部位可以等到追蹤型停損遭到引發，或趨勢轉弱或獲利目標達成。


    最安全的放空進場點，是尋找價格處於明確下降趨勢的股票。任何呈現階梯狀下降趨勢（換言之，走勢的一連串波段轉折高點與低點持續下滑）的股票，20 天移動平均與 50
    天移動平均扮演上檔「天花板」壓力的股票，走勢只要出現明確向下突破發展，就適合放空。等待股價向上反彈而漲勢轉弱，就進場放空。還記得美好的春天嗎？向下的相反型態，就是適合放空的「陰暗的秋天」。


    現在是重新複習第 5 章陰陽線型態的大好時機，譬如：空頭吞噬型態、吊人、夜星等，這些型態都代表趨勢即將向下反轉。


    各位或許也想稍微溫習第 6 章討論的向下突破。上升趨勢連續型態產生的某些架構——這些東西只需要朝相反方向調整。


    盤中走勢圖處於崩跌狀態的股票，尋找連續整理型態，以及過度延伸而即將反轉的漲勢。觀察 5 分鐘或 15 分鐘走勢圖，留意那些股價處於 20 期移動平均之下的股票。愈多移動平均處在股價上方，愈適合放空。


    留意先前交易日發生與目前存在的重要支撐水準，觀察它們在盤中走勢圖的位置。價格跌勢可能在哪裡回升？該處距離空頭部位進場點至少要有 1、2 點價差。這個價差愈小，風險愈高。


    圖 11-20 顯示 Nike Inc.（NKE）日線圖，其中標示的放空進場點，適用於波段交易與當沖。圖 11-21 是 NKE 小時走勢圖，由更細膩觀點呈現放空進場點。圖
    11-22 的 15 分鐘走勢圖則進一步放大。


    這三份走勢圖顯示數個不同時間架構，它們都呈現相同的放空訊號。這項技巧適用於波段交易與盤中交易的進場點，以及風險管理。


    ![](img/468d7cacb0b0b269ef1c907b6846010599_372_0.png)

    圖 11-20 Nike Inc.（NKE）日線圖顯示股價陷入下降趨勢。4 月，當 20 天、50 天與 200 天移動平均相互收斂時，空方正磨刀霍霍。請注意，20
    天移動平均如何向下貫穿 50 天移動平均與 200 天移動平均。這個死亡交叉組合，代表理想的放空機會。隨機指標也一路下滑；成交量大致維持穩定。4 月初，價格跌破
    84 美元時，波段交易者可以進場放空，停損設定在 85 美元（200 天移動平均稍上方）。第一個回補訊號在 82 美元，距離先前低檔支撐 81 美元不遠。一支紡錘線預示著價格可能向上反轉。另一個放空機會在
    5 月，大概就是 NKE 遭受上檔壓力 83.50 美元的 3 天後，價格跌破 81 美元短期支撐，目前價位 78 美元，獲利頗豐。盤中交易者可以運用波段交易的進場點進行動態交易或當沖。


    從事放空操作，同樣適用由上而下的準則。首先尋找大盤疲弱的市況，或至少有些主要指數，例如紐約證交所或那斯達克走勢疲弱（取決於標的股票掛牌交易所）。標的股票隸屬的類股走勢也呈現下降趨勢。TICK
    呈現負值讀數，TRIN 讀數超過 1.0。另外，標普期貨 E 迷你契約與那斯達克 100 期貨 E 迷你契約下跌。如果使用隨機指標或 CCI 等擺盪指標，最好呈現空頭背離，或處於下降趨勢。


    ![](img/468d7cacb0b0b269ef1c907b6846010599_373_0.png)

    RealTick® graphics used with permission of Townsend Analytics, Ltd. © 1986-2007
    Townsend Analytics, Ltd.


    ## 精準當沖


    ![](img/468d7cacb0b0b269ef1c907b6846010599_374_0.png)


    這份 15 分鐘走勢圖可以放大觀察先前 NKE 日線圖與小時走勢圖（圖 11-20 與圖 11-21）的最後行為。這份圖形呈現 5 月 19 日價格行為的細節，也顯示當沖交易的理想進場點。NKE
    開盤稍微向下跌空，價格反彈程度不足以填補缺口。訊號代表空頭可以積極進場。配合追蹤型停損，這筆交易可以持有到下午 1:30 左右，當時出現 2 枝狀成交量直方圖（對我來說，1
    枝這類線形就夠了），這是價格可能向上反轉的警訊。交易者可以在 78 美元回補，獲利超過 1 點。

    RealTick® graphics used with permission of Townsend Analytics, Ltd. © 1986-2007
    Townsend Analytics, Ltd.


    ## 放空操作的禁忌


    - 不要在建立空頭部位後，就外出逛街、出遊，除非你已經設定自動化回補停損。再說，有時候看著標的股票價格下跌也蠻有趣的。看著股價下跌而自己的荷包受惠，那種感覺就像看著敵對球隊的四分衛被擒殺。過去，我們經常因為多頭部位價格下跌而受害，現在終於可以體會加害者的感受。

    - 不要放空日線圖呈現上升趨勢的股票。放空對象應該處於下降趨勢，或正處於向下反轉的價格型態。對於部位交易，標的股票需要預先查核《投資人經濟日報》的「綜合評等」。放空對象的綜合評等必須在
    50 或以下。

    - 不要只因為你認為價格太高而放空股票。我還記得雅虎當初成為網路熱門股票的情況。1998 年 3 月，雅虎股價來到 100 美元大關，價格每天變動好幾點。當時價格如此劇烈波動的股票並不多見。不少口袋很深的交易者，在雅虎股價觸及
    99 美元時進場放空。他們幾乎把所有財產都押進去，放空了成千上萬股。可是，雅虎還是帶著一抹微笑，揮揮手，順利越過 100 美元大關。放空交易者只能咬緊牙關硬撐，宣稱沒有任何東西可以漠視地心引力，包括雅虎股價在內。但雅虎股價還是持續走高。事實上，有很長一段時間，該股票都沒有回頭。這段走勢讓很多人傾家蕩產，並且讓很多交易者永遠出局。

    - 你會懂得更多。閱讀本書後，你看到某些股票夾著大量向上突破，判斷其價格將持續走高。你是正確的。

    - 不要試圖從空邊搶帽子，如果你是剛入門的初學者。先累積經驗，再從事這類高風險行動。放空對象除非是 ETFs 或股指指數期貨迷你契約，否則向上跳動的規定會讓放空操作相當費神，不容易精確拿捏。為了區區
    25 美分賺頭，不太值得這麼做。

    - 不要放空成交量不大的股票；換言之，不要放空每天平均成交量不超過 30 萬股的股票。事實上，不论是做多或放空，這類股票都不適宜。

