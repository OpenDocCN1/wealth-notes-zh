    # TICK 走勢圖


    讓我們稍微談論跳動檔走勢圖（tick chart）。跳動檔走勢圖不同於根據時間劃分的盤中走勢圖。就 5 分鐘走勢圖來說，每支線形代表 5 分鐘的價格表現，跳動檔走勢圖的每支線形代表特定數量交易。舉例來說，50
    跳動檔走勢圖的每支線形代表 50 個價格跳動。至於每個價格跳動究竟有多少契約口數或股數成交，則不考慮。


    短線帽客運用跳動檔走勢圖，因其顯示的動能更明顯。交易如果沉悶，線形排列緩和；交易如果熱烈，價格跳動快速且激烈，動能明顯。


