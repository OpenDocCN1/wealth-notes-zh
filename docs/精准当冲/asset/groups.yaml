    搶帽子的標的股票，報價碼差最好只有 1、2 美分。這是進行搶帽子交易的必要條件。進行這類交易時，部位承擔的風險不得超過 5～10 美分。你如果必須按照賣出報價買進，則馬上要接受的損失碼差不要超過
