    # # 支撐與壓力


    支撐與壓力是最常見的交易概念，也是交易者必須徹底瞭解的兩個概念。每當觀察走勢圖，不論是 1 分鐘走勢圖、日線圖、標普 500 期貨走勢圖，乃至於那斯達克綜合股價走勢圖，腦海裡都應該立即浮現兩個問題：支撐在哪裡？壓力在哪裡？


    支撐／壓力是供給／需求交互作用所產生的具體化現象。股價不會基於自己的意志而漲跌，也沒有什麼交易神明或電腦程式決定股價漲跌。價格走勢完全是因為市場參與者的買賣行為造成。可是市場參與者（包括你與我在內）都有記憶。支撐與壓力是來自於人類的記'
