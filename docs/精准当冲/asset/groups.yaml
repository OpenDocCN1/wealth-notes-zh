    ## 精準當沖


    ![](img/468d7cacb0b0b269ef1c907b6846010599_374_0.png)


    這份 15 分鐘走勢圖可以放大觀察先前 NKE 日線圖與小時走勢圖（圖 11-20 與圖 11-21）的最後行為。這份圖形呈現 5 月 19 日價格行為的細節，也顯示當沖交易的理想進場點。NKE
