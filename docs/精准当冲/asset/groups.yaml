    \n當然，工作底稿與交易日誌可以整合。我發現，記錄交易預定的時間架構（核心交易、波段交易與當沖），更可以帮助自己面對現實，避免忽略停損，而把失敗的短期交易視為投資。\n\
    \n我在《新股市短線交易》（*Short-Term Trading in the New Stock Market*）曾經提到，各位將發現「交易表單有良知」。除了進場與出場日期、報價代碼、股數、盈虧欄位等基本資料外，這表單還包括交易類型（部位交易、波段交易與盤中交易）、起始停損、獲利目標、風險／報酬比率、調整後停損與追蹤型停損、調整後獲利目標等。資料非常詳細？是的。填寫這份表單，可以讓你學習許多風險管理技巧，強化交易與挑戰能力。\n"
  mdcn: "\n請注意，買進陶醉氛圍推升的漲勢，很可能因為恐懼而急遽下跌，讓你瞬間後悔莫及。精明的交易者經常說：「趁著能賣的時候賣出，不要等到不得不賣的時候。」\n\
    \n- **交易戰術提示**：如果交易失敗，股價就像漏氣的氣球，這時千萬不要想按照賣出報價賣出。想按照賣出報價賣出，就必須有人願意高價接手。你只能按照買進報價脫手，如果行情跌得很快，價格甚至必須低於最佳買進報價。\n\
    \n這方面戰術還需考慮其他因素，稍後會討論。另外，你的第 2 級報價資訊系統如果提供模擬操作模式，不妨練習如何按照買進報價買進，按照賣出報價賣出。\n\n\
    ### 星期五\n\n今天，繼續觀察各種指標與價格走勢的互動，包括：TICK 與 TRIN（紐約證交所或那斯達克，或兩者，根據個人需要），標普期貨 E 迷你契約（或個人挑選的其他迷你期貨契約），以及標的股票盤中走勢圖和對應的第\
    \ 2 級報價資訊。\n\n> **新手筆記**\n>\n> 交易者可以把紐約證交所或那斯達克的 TICK 和 TRIN 繪製成不同顏色的兩條曲線圖，並列在一起。如此看起來，波動程度會比較緩和，容易看到兩者之間的行為關係，解釋也更清楚。\n\
    \n叫出標的股票的另一份走勢圖，可以的話，採用不同時間架構。原來的盤中走勢圖如果是 5 分鐘走勢圖，現在可以采用 15 分鐘或 60 分鐘走勢圖。採用相同期數的移動平均，譬如說\
    \ 20 期移動平均與 200 期移動平均。然後，若某份走勢圖看到向上突破或向下突破，請觀察另一份走勢圖的對應情況。檢視成交量與移動平均。\n\n當沖交易如果想維持高勝算，就應該要求\
    \ 3 種不同時間架構走勢圖都出現相同的買進或賣出訊號。舉例來說，你觀察的日線圖或小時走勢圖，顯示候選股票由支撐區域向上回升，對照 5 分鐘與 15 分鐘走勢圖，發現這兩份走勢圖也顯示理想的進場訊號。\n\
    \n除了前文討論的向上突破與向下突破型態之外，後續章節還會討論其他型態。\n\n建立部位當時，價格最好合理貼近走勢圖的短期均線。價格距離 20 期移動平均如果太遠，意味著走勢已經太過延伸。今天，觀察盤中走勢圖的向上突破如何由支撐區域回升、價格如何在支撐區域進行整理或（向上或向下）反轉，以及移動平均提供的支撐。\n\
    \n觀察股價如何向上突破主要壓力區域。觀察成交量的對應表現。\n\n### 新手筆記\n\n如果可以取得羅素 2000 期貨的 E 迷你契約報價資訊（訂閱網址\
    \ www.cme.com），而且你的電腦螢幕還有空間的話，不妨叫出報價資訊，觀察該指數的 5 分鐘走勢圖。有些時候，羅素 E 迷你的走勢會領先標普期貨與那斯達克\
    \ 100 期貨。\n\n向上突破過程，成交量是否已經先行放大？失敗的向上突破，伴隨的成交量是否不夠大？是否受到大盤走勢轉弱的影響？充分運用你所學習的知識去分析股價行為。\n\
    \n### 交易指令類型\n\n我知道各位兩眼乾澀，頭腦像糨糊一樣，但請打起精神，學習下列的交易指令。\n\n各位可以使用的交易指令類型包括：\n\n- **市價單（market\
    \ orders）**：如果按照「市價」買賣，等於給專業報價商或造市者全權委託書。他們決定你需要支付或取得的成交價格。當你的交易指令到達他們手中，這些人可能不會按照當時顯示的報價撮合（我曾經目睹造市者接到市價賣單時，調降他們的買進報價）。你所交易的股票成交量如果很大，交投狀況穩定，而且你不想追價，不妨採用市價單。你如果不計代價而急著買賣，可以採用市價單。除此之外，請採用限價單。如果不能成交，就不要追價。市場永遠都有機會。\n\
    - **限價單（limit order）**：採用限價單交易，意味著你準備按照特定價格買賣特定數量的股票。換言之，限價買單設定的價位，低於當時的最佳賣出報價；限價賣單設定的價位，高於當時的最佳買進報價。專業報價商或造市者想撮合你的限價單，必須等到成交价符合或優於你指定的價格。\n\
    \  - 你如果希望按照目前買進報價和賣出報價的中间價買賣，或者按照目前買進（賣出）報價買進（賣出），就可以採用限價單。你準備買進的股票，價格如果上漲，可以採用限價買單在低檔等待；當然，這種限價買單可能成交，也可能沒有成交。賣出股票的情況也是如此。你想賣出的股票，價格如果下跌，可以采用限價賣單掛在高檔等待；同樣地，這種限價賣單可能成交，也可能不會成交。限價單可以是「當日有效」或「取消之前始終有效」（good\
    \ till canceled，簡稱GTC 或常效單）。\n- **全有或全無（AONs, all or nothing）**：交易指令可以指定為全有或全無。換言之，專業報價商或造市者如果不能撮合整筆交易，那就完全不要撮合。舉例來說，如果你運用全有或全無限價單買進\
    \ 500 股，這個指令必須全部成交，不能只成交一部分（換言之，不能只買 350 股）。我通常都不會勾選全有或全無。如果行情變動得很快，我下單買進 1,000\
    \ 股，或許只能買到些零股，譬如 26 股。碰到這種情況，我只能處理零股；各位或許希望勾選全有或全無。\n- **買進停止單（buy stops）**：你可以採用這種交易指令買進股票，指定價格高於目前行情。舉例來說，伊古魯冰淇淋股票目前交易價格為\
    \ 20 美元，正好是當下需要克服的重要壓力。股價如果能夠向上突破 20 美元，你就打算買進。可是，你知道，很多人都在注意這支股票，股價如果真的突破 20\
    \ 美元，勢必有很多人準備搶進。這種情況下，如何先下手為強呢？你可以預先在 20.01 美元設定買進停止單（我把買進停止單設定在 20.05 美元，如此更能確定股價成功向上突破），靜待後續發展。伊古魯如果不能突破\
    \ 20 美元，你的買單就不會成交。缺點：股價如果觸及你指定的停止價位或更高，買進停止單就生效而變成市價買單，很難預估實際成交價格究竟是多少。舉例來說，市場開盤前，你用買進停止單透過網路券商買進\
    \ 500 股伊古魯冰淇淋，停止價位設定在 20.01 美元。市場開盤，萬一伊古魯冰淇淋跳空大漲，你的成交價格可能是 23.01 美元。然後，你可能要面對「和跳空缺口對幹」（fading\
    \ the gap）的交易者（「和跳空缺口對幹」指某些交易者看到開盤跳空，就建立反向部位，因為預期價格會立即拉回試著填補缺口）。相較於前一天收盤價，股票開盤跳空的程度如果超過\
    \ 0.5 點，通常都會立即折返。所以你的買進停止單可能成交於 23 美元，但價格可能很快就拉回到 21 美元。這給我們什麼教訓呢？市場開盤前，不要預先遽入買單。適合採用買進停止單的時機：你準備買進某支正處於狹幅盤整的股票，但你想外出午餐，又擔心該股票剛好在這個空檔向上突破。\n\
    - **停損單（stop-loss order）**：對於持有的股票多頭部位，你可以藉由賣出停止單，指定按照某低於目前行情的價位賣出股票。等行情來到你指定的價位，該賣出停止單就自動變成市價賣單。同理，對於持有的股票空頭部位，可以藉由買進停止單，指定按照某高於目前行情的價位回補股票。等到行情來到你指定的價位，該買進停止單就自動變成市價買單。\n\
    - **限價停損單（stop-loss limit order）**：停損單一旦生效，就自動成為市價單；反之，限價停損單一旦生效，就變成限價單。換言之，限價停損單設定兩個價位，一個是停損價位，另一個則是限價單的指定價格。\n\
    - **自動化追蹤型停止單（automatic trailing stops）**：很多折扣券商和直接下單券商都提供自動化追蹤型停止單。就多頭部位來說，你設定的停損單會隨著行情走高而不斷向上調整（但不會向下調整），所以價格只要從目前價位下跌某特定程度——由使用者指定為\
    \ 10 美分、90 美分或任何特定水準，或某特定百分率——多頭部位就自動停損。至於空頭部位，情況剛好相反。\n- **即效單（fill or kill orders）**：交易指令如果沒有立即成交，就馬上取消。\n\
    \n恭喜你完成初學者訓練課程。當你開始實際進行交易，就能體認這段辛苦訓練的成果，也會慶幸在沒有進行交易的情況下先訓練。因為沒有實際進行交易，才能保持輕鬆的心情學習。\n\
    \n接下來的篇幅，我們準備討論各種時間架構下的實際交易準則與下單程序。換言之，即將討論交易實務。\n\n本章談到許多重要內容，請確實完成「新手隨堂考」，寫下問題的答案。然後，接下來幾週內，找時間溫習，務必確實瞭解所有的相关術語和概念。\n\
    \n### 新手隨堂考\n\n#### 題目\n\n1. 上午開盤後，行情大概在何時出現第一波反轉走勢？\n2. 有經驗的交易者獲利主要在午休時段。正確或錯誤？\n\
    3. 債券市場何時收盤？\n4. 當沖客積極交易的股票，臨收盤前 10 ∼ 15 分鐘會出現明顯的賣壓。為什麼？\n5. 有經驗的交易者通常在上午開盤 10\
    \ 分鐘後，才進行第一筆交易。正確或錯誤？為什麼？\n6. 技術指標大致上可以劃分為兩大類：____________ 和 _______________。\n\
    7. 請解釋何謂 TICK 指標？\n8. 紐約證交所的 TICK 讀數如果超過 +1,000，代表大盤行情將進一步走高。對於這種現象，精明的交易者應該加碼多頭部位。正確或錯誤？\n\
    9. TRIN 衡量什麼？\n10. 紐約證交所的 TRIN 讀數如果小於 1，交投最活絡的股票是處於漲勢或跌勢？\n11. 紐約證交所的 TRIN 讀數遊走於\
    \ ________ 區域附近，意味著空頭與多頭彼此競爭盤勢控制。\n12. 如果想從多邊進行當沖與搶帽子交易，最適合的市況是：TICK 讀數 ______，TRIN\
    \ 讀數 ______。\n13. 標普 500 期貨契約與其 E 迷你契約是最受重視的領先指標。正確或錯誤？\n14. 「時間與成交量」報價資訊顯示成交價為紅色，是否代表賣出？如果不是，為什麼不是？\n\
    15. 如果你想立即脫手某股票，限價賣單的指定價格，是否適合設定在買進報價和賣出報價的中間價？理由？\n16. 交易者如何賺取買一賣報價的價差？\n17.\
    \ 如果想出脫多頭部位，最安全的做法是趁著漲勢或跌勢賣出？\n18. 成功進行當沖交易的主要竅門是什麼？\n\n#### 答案\n\n1. 上午 9:45\
    \ ~ 10:10。\n2. 絕對錯誤。有經驗的交易者會盡量避免在午休時間進行交易。\n3. 東部標準時間下午 3:00。\n4. 當沖客不願持有隔夜部位，他們會在收盤前結束部位。\n\
    5. 市場開盤後，有經驗的交易者至少等待 10 分鐘才進行交易。理由：市場開盤期間，行情主要由專業報價商和造市者控制。\n6. 落後指標與領先指標。\n7.\
    \ TICK 讀數代表成交價格向上跳動家數，減掉成交價格向下跳動家數的餘額。個別交易所都有自己的 TICK。\n8. 錯誤。紐約證交所的 TICK 讀數如果超過\
    \ +1,000，代表漲勢過度延伸，隨時可能向下反轉。精明的交易者會調緊停損。\n9. TRIN 衡量大盤市場的價格波動程度，以及流向上漲或下跌股票的資金。個別交易所都有自己的\
    \ TRIN。\n10. 漲勢。\n11. 1.0。\n12. 大於 0，小於 1.0。\n13. 正確。\n14. 時間與成交量呈現的價格為綠色或紅色，代表成交價向上跳動（綠色）或向下跳動（紅色）。紅色的成交價雖然可能代表賣出，但未必如此，因為紅色只代表成交價格向下跳動。如果行情變動很快，時\n\
    15. 不。如果想要快速出脫股票，限價單的價格不會設定在買進報價和賣出報價之間。股價走勢穩定，你可以採用市價賣單，或限價賣單設定在賣出報價。如果賣出價格設定在買進報價和賣出報價之間，你可能需要不斷改價，或者向下追價。\n\
    16. 按照買進報價買進，按照賣出報價賣出。\n17. 想出脫多頭部位，最安全的做法是趁著漲勢賣出。\n18. 成功機會最高的當沖交易，應該在日線圖挑選處於上升趨勢的股票，而且沒有面臨先前的壓力區。你希望兩個時間架構——譬如：5\
    \ 分鐘與 15 分鐘——走勢圖都出現高勝算的買進訊號\n\n![](img/468d7cacb0b269ef1c907b6846010599_255_0.png)\n\
    \n### 直覺的功能\n\n> 「唯有用心看，才看得清楚；重要的東西，用眼睛是看不見的。」\n>\n> ——聖修伯里（Saint-Exupery）\n\n\
    如何界定直覺的意義，也就是難以捉摸的「第六感」呢？根據韋氏字典說法：「這是一種不需明顯借重理性思考和推理，可以直接取得認知的力量或能力。一種立即呈現的洞察力。」\n\
    \n西方文明推崇理性、合乎邏輯的思維過程，而依賴人類五感之外的知識被認為是欺騙，實在令人遺憾！當我們堅持用邏輯和理性來判斷事物的同時，卻忽略了個人與生俱來的神奇智慧天賦。\n\
    \n現在，科學證實人類思維有兩種層次：有意識的理性思維，以及潛意識的直覺思維。意識的運作就像電腦，可以處理經驗數值，根據過去經驗做判斷，並計算相關結論。\n\
    \n但直覺思維卻可以超越個人界限，進入一座龐大的智慧和洞察力倉庫。當我們需要時，這種能力可以分析資訊做為指引。這種洞察力又稱為直覺，或第六感。\n\n尊重並滋養個人的直覺力，讓它成為我們生活的指導力量，我們的自信心會因此增強，生活各方面更有安全感，也更充滿力量。\n\
    \n如何運用直覺力，並聽從直覺的指示？方法之一是體認其存在。另一種方法是針對這個最明智的能力提出問題，譬如：我現在需要知道什麼？以目前的情況，我應該怎麼做？\n\
    \n某種感覺可能立即出現，讓你依此辨識、採取行動。如果沒有，相信答案很快就會出現在某個想法、對話、書籍、電影或事件裡。愈是經常練習，這種交流就愈容易、愈清晰。\n\
    \n直覺力永遠存在並供我們運用。直覺知道如何克服挑戰、達成目標。我們只需提出問題，然後信任它。\n\n## CHAPTER 9\n\n# 擬定適合你的交易計畫\n\
    \n假定你準備從薩薩諸塞州波士頓，開車到亞利桑那州猶馬，而你從未到過猶馬。這種情況下，如果沒有查閱地圖並預先做好規劃，想必你不會倉促上路。\n\n如果要割除盲腸，醫生不會拿起手術刀，說開刀就開刀吧？他總該先做必要的檢查。建築師蓋房子，也不會拿起磚塊就開始砌牆；總要先畫圖，再按圖施工吧！\n\
    \n職業運動選手除非預先擬妥比賽計畫，否則不會草率進場。UCLA 傳奇籃球教練約翰·伍登（John Wooden）曾說：「如果沒有做好準備計畫，那就準備接受失敗。」同樣的道理，成功的交易者在投入成千上萬資金進場論輸贏前，理當預先擬妥周全的交易計畫。\n\
    \n擬定交易計畫，然後按照計畫行事。一旦建立部位後，管理交易的技巧將決定最終勝負。\n\n首先，檢視你買進（或放空）股票當時所需填寫的基本資料；其次，討論「由上而下」相對於「由下而上」的交易策略；接著探討一項最根本、也是最重要的決策概念：風險／報酬分析；最後，各位將學習任何時間架構都適用的多頭部位進場和出場準則。\n\
    \n### 如何設計交易計畫？\n\n買股票就像在公園散步一樣簡單。但想要穩定地賺錢，還需配合周全的計畫、熟練的技巧，以及嚴格的紀律。本書第 4 章曾經談到，交易需要自信。沒有任何東西比周全的交易計畫更能加強信心了。\n\
    \n為每筆交易準備一份簡單的書面計畫，這是交易者給自己的最佳禮物。這麼做除了可以避免搞不定停損，同時提醒自己必須確實獲利了結。\n\n我會針對每筆交易準備一份非正式的工作底稿，並在部位結束後立刻填寫交易日誌。這兩件事都很簡單，如果有必要，也可以合併處理。我不希望把資料弄得也太複雜，最後面對一大堆數據，甚至找不到停損價位。\n\
    \n交易過程中，我的手邊放著一本黃色筆記本（你可知道黃色對於思考最有帮助？這也是為什麼很多筆記本都使用黃色），交易日誌則採用 Excel 試算表記錄。\n\n\
    一旦發現勝算高的交易機會時，我就在黃色筆記本上計算風險／報酬比率，然後根據核心交易、波段交易或當沖交易的性質，查閱週線圖、日線圖、盤中走勢圖上的支撐／壓力。\n\
    \n交易架構如果很好，我就按照進場價格建立適當規模的部位，然後在停損欄位填寫停損價格。對於正在進行中的交易，我會預先遞入停損單。\n\n少數情況下，我不會採用自動化停損交易指令，並在工作底稿上特別標示停損價位（我嚴格要求自己按照停損價位出場）。\n\
    \n### 新手筆記\n\n研究資料顯示，擺在腦海裡的目標沒有太大意義。把目標實際寫下來，通常更有意義。同樣的道理，心理停損可以計價還價，你最起碼應該白紙黑字寫下停損。交易經驗顯示，當股價真的下跌時，我們經常可以找到充分理由，把停損調降到次一個支撐區。把停損寫下來，眼見為憑，至少有助於我們維持紀律。當然，最好的辦法是把停損單預先交給券商。\n\
    \n現在，部位已經建好，即便是當沖交易，我都會在工作底稿記錄日線圖，甚至週線圖上的壓力水準。舉例來說，股票的日線圖或週線圖如果呈現超買，有可能影響股價在日線圖的反應。買進熱潮或有利的大盤走勢，可能在早盤帶動股價走高，但到了下午盤可能出現獲利回吐的實歷。\n\
    \n股價一旦逼近上檔潛在壓力區，當然也接近我設定的獲利了結目標。我會密切觀察發展，調緊停損，可能做部分或全部的獲利了結。\n\n價格漲勢如果強勁到穿越壓力而創新高，我會繼續持有部位，並因應大盤市況，考慮是否需要加碼。不論哪一種狀況，如果股價已經逼近上檔壓力，而我正忙著其他交易，只要稍微瀏覽就可以掌握當時狀況。\n\
    \n圖 9-1 顯示黃色筆記本工作底稿的樣本，圖 9-2 說明交易日誌試算表採用的欄位。\n\n我的交易日誌保留 3 個空位，用來記錄分批出場的價位。舉例來說，在\
    \ 14.29 美元買進 800 股甲骨文，然後在 14.70 美元、15.20 美元與 15.40 美元分 3 批出場，股數分別為 300 股、300 股與\
    \ 200 股。分批出場比較安全，也是不錯的戰術，因此交易日誌的試算表設計時，應該預先考慮每筆交易都能個別登錄，包括淨價格與淨額。\n\n![](img/468d7cacb0b269ef1c907b6846010599_260_0.png)\n\
    \n時間架構愈長，訊號愈有意義。舉例來說，週線圖的買進訊號，其重要性超過日線圖的賣出訊號；日線圖的買進與賣出訊號，重要性超過盤中走勢圖的對應訊號。\n\n\
    | 日期 | 報價 代碼 | 多頭/空頭 核心， 波段，當沖 | 股數 | 進場 價格 | 停損 | 潛在支撐/壓力 （起始獲利目標） |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| 5/21 | ORCL | L, Swing | 500\
