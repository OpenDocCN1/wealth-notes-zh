    \ 2 級報價的功能，不是嗎？速度。你按照目前價格加 5 美分買進，很快就在 47 美元買進 500 股。賣給最高的出價者——你！\n\nMissile.com\
    \ 價格稍微震盪，幾秒後，價格開始崩跌。嘿！停住！時間與交易量螢幕不斷閃爍著紅色的向下跳動。你的手緊握著滑鼠，全身僵硬。拜託，不要再跌了。\n\n短短幾秒內，價格來到\
    \ 44 美元。你的破洞已經擴大為 1,500 美元。怎麼爬出來？\n\n在 CNBC 出現的那位基金經理人，不是說 Missile 是支好股票嗎？如果在\
    \ 44 美元再買進 500 股，每股平均成本就是 45.50 美元，起碼遠低於原本的 47 美元。於是，你在 44 美元又買了 500 股。現在，短線搶帽子已經變成波段交易了。\n\
