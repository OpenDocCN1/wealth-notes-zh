    千萬不要成為詐騙受害者。對於每筆交易，務必自行思考。如果預先做好準備工作，就不需要別人來幫你做決定。記住一項最重要的目標：保護交易資本，按照計畫進行交易。只要能夠達成這些目標，底線自然有所保障。


    # # 交易者的身心健康


    你知道嗎？相較於沙發，我那雙合腳的鴨子拖鞋更能賺錢。不要嘆氣，聽我慢慢道來。


    # ## 身體


    各位如果還不知道，本書為期 2 週的「新兵訓練營」已經教導各位，專職從事交易對於身體與心理都是嚴苛的負擔。另外，整天坐著顯然也有礙健康。


    各位如果已經安排固定的運動時間，請繼續進行，雖然為了交易，你可能需要早點起床。如果沒有安排此運動，請立即著手進行。早晨務必到戶外活動，快走、跑步、騎單車、遛狗、游泳等。舉重也不錯，但嚴格的有氧運動最有助於頭腦清醒，抒解身體壓力。


    運動有助於思考，可以讓你能夠對抗壓力。另外，運動也可以讓交易者避免整天坐著。如果早餐前找不到運動時間，不妨運用午休時段。


    # ## 心理


    如同各位知道的，股票交易需要完全專注，也需要勇氣和自信心。每天早上走進交易場所，你必須覺得自己在最佳巔峰狀態。不是'
  - '[PAGE 418]


    傲慢或自以爲是，而是自信。


    你是否剛和親密伴侶分手？是否和某個最親密的人吵架？是否有家人正罹患重大疾病？你是否擔心孩子單獨在家？


    你是否罹患感冒？昨天是否發生嚴重交易虧損？是否感覺十分沮喪？


    不論什麼緣故，只要感覺很差，就不要進行交易，否則很難不發生虧損。


    # ### 應該遵循的交易法則


    我知道的成功交易者，都把他們奉行的交易法則清單，貼在電腦螢幕附近。請各位也考慮這麼做。書面交易法則可以提醒我們隨時記得目標，以及行為準則；就心理效應來說，其功能如同書面停損一樣：內容明確，沒有討價還價的空間。不妨將它們視為自己的意識。當我們受到市場催眠，認為自己可以蒙混過關時，書面法則會帶領我們回到「核心」。


    以下是我嚴格遵循的法則。各位如果願意的話，也可以採用它們，或做為某種形式的基準，並做必要的調整。把你的交易法則擺在隨時可以看到的地方。


    # #### 務必嚴格奉行的交易法則


    +   1. 永遠要保護交易資本。


    +   2. 完全按照計畫進行交易，不要考慮賺錢與否。


    +   3. 除非交易機會符合由上而下的交易法則，否則不進行交易。


    +   4. 進行完整的風險／報酬分析後才進行交易。'
  - '[PAGE 419]


    +   5. 絕對不追價。任何單筆交易都不押下「全部身家」。


    +   6. 紐約證交所的 TICK 讀數大於零，TRIN 小於 0.9，我才會進行多邊當沖交易。


    +   7. 對於進行的每筆交易，我都會寫下防護性停損，也預先遞入停損單。停損價格一旦遭到觸及，絕對嚴格進行。


    +   8. 如果有兩筆交易連續虧損，我就暫停交易，重新評估市況。


    +   9. 當沖交易如果虧損，就絕不持有到隔夜。


    +   10. 只要有獲利了結的理由，部位就出場。'
  - '[PAGE 420]


