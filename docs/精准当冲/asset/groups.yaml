    \n## 培養頂尖交易者思維\n\n## 釋懷過去\n\n> 「 人們總是把現狀歸咎於時勢。我不相信時勢。凡是在世上有所成就者，都會努力尋找其想要的時勢，如果找不到所需要的時勢，便自己創造時勢。」\n\
    >\n> ——喬治．伯納．蕭（George Bernard Shaw）\n\n你知道有誰能夠完全忘掉自己的過去？很少人可以享有這種自由。對我們來說，過去並不是真正的過去。痛苦的事情即使發生在幾週、幾個月或幾年前，依然會牽動我們內心深處的情緒。\n\
    \n我們試圖埋葬過去，但過去仍然影響現在的生活。後悔與怨恨在無意間消耗我們的內在能量，因為我們並未意識到自己正為消極和不愉快的情緒感到困擾。除非透過某種方式釋放這種負能量，否則過去會影響現在的經驗，甚至影響我們創造未來。\n\
    \n想活出生命最高的潛能，就不要累積憤怒、怨恨和恐懼等負面能量，因為這些負面情緒會阻礙我們產生積極能量。\n\n釋懷過去的最好辦法，就是寬恕……寬恕曾傷害我們的人和事。就像身體能夠治癒生理傷害，我們的內心也希望治癒情感創傷。透過釋放這些傷害來治癒，透過寬恕來釋放。\n\
    \n為了寬恕，我們必須面對事實。承認此身背負的負能量，再也不能影響我們。我們選擇離開和拋棄，唯有如此，才能寬恕。\n\n寬恕是我們給自己的禮物，讓心靈得以從過去解脫，讓生活能被賦予正面情緒，讓個人得以自由創造豐盛、成功的明天。\n\
    \n# CHAPTER 11\n## 帽客與空頭\n\n某位成功的帽客表示：「帽客扮演的角色，性質接近參與作戰的戰鬥機飛行員。如果不能正確解釋專業對手的行爲，他們就會抓住你犯的錯誤。\n\
    \n你必須鎖定對手的行動，精確評估其意圖。他們是否準備面對面作戰？你看到的是真的嗎？一旦你有新決定，或迎戰，或退場觀望，再選擇更適當的機會。如果選擇錯誤，最好的反應就是立即退到安全地帶，重新調整戰略。」\n\
    \n這個比喻非常精確。當你決定搶帽子，就是和市場專業玩家正面迎戰，而他們絕對是最無情的對手。\n\n## 何謂搶帽子？\n\n如同前文提到的，搶帽子是一種特殊交易風格，持有部位只有幾秒或幾分鐘，交易者鎖定的獲利目標通常不到\
    \ 1 點。這種交易方式最近較不流行，因為過去的分數報價，現在已經改為小數點報價。但現在還是有人嘗試此類交易；若是如此，他必須：\n\n- 能夠長時間專注。\n\
    - 能夠迅速執行交易指令。\n- 永遠保持靈敏。\n\n成功帽客必須嚴格遵循停損法則，不允許一廂情願地期待股價回升。現實是，你如果決定參與這項活動，對手大多是機構交易者，他們擁有更多經驗、資金，並掌握更多報價資訊。\n\
    \n如果決定從事搶帽子交易，整體戰術為：交易規模大，每筆交易至少是 500 股或 1,000 股；每天進行好幾筆交易；風險／報酬比率為 1:2（帽客不考慮長期走勢，也沒有耐心。他們採用的走勢圖時間架構很少超過\
    \ 5 分鐘）。\n\n如此短線的交易，規模如果太小，即使獲利，扣掉佣金等成本後，淨利恐怕有限。每天交易如果少於 10 筆，或許不值得花工夫去搶帽子。記住，你進行的交易很多會失敗。按照風險／報酬比率來看，唯有進行的交易筆數夠多，才能確保賺錢。\n\
    \n我進行此類交易是採用 2~5 分鐘走勢圖尋找標的架構，然後透過第 2 級報價資訊系統下單。\n\n我不建議透過網路折扣券商進行此類交易，因為下單程序太過繁瑣，需要點擊太多按鍵。一旦下單，交易者就沒有什麼辦法控制了。進行搶帽子交易，速度是主要的武器。第\
    \ 2 級報價系統提供透明的報價資訊，執行速度快，可以做為管理交易的額外工具。\n\n## 搶帽子基本戰術\n\n從事搶帽子交易，輸贏取決於紀律的嚴謹程度。如同前面所提，搶帽子交易不允許讓貪婪、恐懼、期待以及判斷正確需求等情緒有任何發揮空間，必須保持絕對的冷靜與算計。\n\
    \n尤其是貪婪，容易促使帽客持有部位的時間過長。然後，貪婪就會勝利，給予交易者虧損重擊。\n\n剛從事這方面交易時，這是我面臨的最大挑戰。一旦建立部位，自己與部位的黏著程度往往太牢。這就是貪婪，美其名為太過樂觀。不管怎樣稱呼，如果想繼續抱住部位多賺額外的\
    \ 5 分錢利潤，結果永遠適得其反，利潤變少或虧損。\n\n換言之，進行搶帽子交易時，如果聽到內心貪婪的呼喊，就應該立即變現。\n\n對於搶帽子交易來說，時間與風險／報酬比率會壓縮。由於獲利目標很小，部位所允許承擔的風險更小。這方面交易持續的時間只有幾秒或幾分鐘。每股獲利目標：15～75\
    \ 美分。\n\n搶帽子交易想要賺錢，勝率必須夠高。如果是波段交易或當沖交易，一筆成功交易的獲利，或許能彌補兩筆失敗交易的虧損。搶帽子的情況則不是如此。一筆交易賺了\
    \ 25 美分，次筆交易虧損 13 美分，然後又一筆交易損失 12 美分。這並不是扯平，你已經賠錢了，因為還有佣金成本。\n\n## 價格行為：整數與半點\n\
    \n某些數字會自然提供支撐／壓力功能，譬如：整數與半點。股價上漲時，逼近整數價位往往有所猶豫，或者穿越整數後，還會拉回整理。\n\n伊古魯冰淇淋是典型的當沖對象，假設股價上漲到\
    \ 25.98 美元，由於逼近整數 26 美元，走勢顯得猶豫不決。如果當天走勢特別強勁，股價可能直接突破 26 美元而來 26.05 美元，然後拉回，或許折返到\
    \ 25.90 美元。這也是持股者經常在價格逼近整數時，獲利了結的緣故。\n\n整數也扮演支撐功能（除非價格剛穿越，如同上段敘述案例）。伊古魯冰淇淋走勢如果下跌，一旦逼近\
    \ 25 美元，跌勢可能趨緩或停頓。一旦跌勢突破 25 美元而來 24.90 美元，跌勢可能轉劇。投資人與交易者知道價格走勢會「排斥」整數，一旦股價下跌而觸及整數或\
    \ 0.90、0.75 價位，可能引發停損賣單，導致價格進一步下跌。\n\n半點提供的支撐／壓力功能或許稍弱，但通常可以緩和走勢。股價上漲到 25.47 美元，走勢可能稍微停頓或折返；或是價格來到\
    \ 25.85 美元或 25.95 美元，可能稍微拉回，跌勢停頓在 25.55 美元。\n\n## 搶帽子技巧：及早進場\n\n當今的帽客等不及價格向上突破。由於部位持有時間非常短暫，需要及早採取行動。為了運用最初的動能，帽客趁著股價還處於整理階段就提早進場。等到股價實際向上或向下突破時，他們可能加碼。另一些交易者可能趁著隨後的向上或向下突破而結束半數部位，動機也是運用當時的市場動能。實際上如何操作，取決於個別交易者。不論風格如何，目的都是盡快獲利了結。\n\
    \n美式足球接球員需要「好手」，而帽客需要的是「快手」。對於多頭部位，如果可以的話，你要在別人出價時買進、在他們要價時出貨，同時還需注意股市走勢發展。\n\n\
    ## 第 2 級報價與搶帽子策略\n\n這是第 2 級報價資訊針對搶帽子交易提供的因應策略，這些技巧有助於更精確掌握搶帽子與盤中交易。\n\n搶帽子的標的股票，報價碼差最好只有\
    \ 1、2 美分。這是進行搶帽子交易的必要條件。進行這類交易時，部位承擔的風險不得超過 5～10 美分。你如果必須按照賣出報價買進，則馬上要接受的損失碼差不要超過\
    \ 2 美分。報價碼差愈小，部位承擔的風險也愈小。\n\n瞭解最佳買賣報價的碼差後，接著要注意相關股票在第 2 級報價的參與深度。如果你突然決定賣出股票，有多少專業報價商、造市者與\
    \ ECNs 排隊提供買進報價準備接手？排隊提供買進報價的參與者愈多（準備接受客戶賣出的專業報價商、造市者與 ECNs），市場愈有深度（對於放空者來說，前述程序需做調整，交易者需考慮賣出報價）。\n\
    \n就交投活絡的股票來說，數以千計的交易者同時觸及買進報價。舉例來說，伊古魯冰淇淋一旦融化，你、我與數以千計的交易者同時遞入賣單。這些賣單在千分之幾秒內消化既有的買進報價。排列在最佳買進報價之下，專業報價商和造市者很可能也會消失。ECNs\
    \ 登錄的報價早就不復存在。這使得往下的報價也跟著消失。咕嚕。\n\n就造市者立場來看，當然希望價格像磚塊一樣下跌。他們等待持股者全身冒冷汗，願意不計代價出脫持股。等到賣壓消退，造市者再用較高的報價招呼新買家。\n\
    \n除非買進報價存在足夠深度，才可以進行多邊的搶帽子；同理，除非賣出報價存在足夠深度，才可以進行空邊的搶帽子。交易法則：除非提供最佳買進報價的專業報價商或造市者有\
    \ 4 位或以上，否則不進行多邊搶帽子交易。股票提供最佳買進與賣出報價的造市者如果只有 1、2 位，代表深度不夠。對於搶帽子交易來說，報價深度太淺，意味著行情如果出現不利發展，潛在虧損會很嚴重。\n\
    \n> **新手筆記**\n> 相較於其他交易風格，搶帽子最容易過度交易。請謹慎挑選交易對象，精挑細選最好的機會。如果市場內部指標反轉並經過確認，應該跟著反向操作，或退場觀望。\n\
    \n圖 11-1 顯示 Research in Motion, Ltd.（RIMM）的第 2 級報價螢幕。對於價格波動如此劇烈的股票，此處顯示的買進報價和賣出報價深度適用期間可能很短暫，但對於短線帽客和動能交易者來說，仍然可以提供額外資訊。\n\
    \n![](img/468d7cacb0b269ef1c907b6846010599_339_0.png)\n\n圖 11-1  Research in Motion,\
    \ Ltd（RIMM）的第 2 級報價螢幕，顯示買進報價的深度超過賣出報價。至少就目前來說，買進力道勝過賣出。如果觀察最近成交價格，可以看到價格點到賣出報價\
    \ 71.35 美元。你如果打算買進 RIMM，就需要支付最佳賣出報價（71.35 美元）。另外，賣出報價欄位顯示最佳賣出報價只有兩位參與者 ARCA\\\
    \ 與 PSE。這兩個報價很可能快速消失，而你可能支付更高一檔的 71.36 美元。\n\n標的股票的攀升速度如果快點——但不至於太快——且買賣報價之間的價差稍微留有空間，你可能按照稍高於買進報價的價格買進。換言之，如果報價碼差允許的話，你可以濾入限價買單，按照此最佳買進報價高出\
    \ 1 美分的價格買進。\n\n價格發展速度如果太快，標的股票按照賣出報價成交——漲勢過快，買單不可能點到買進報價——只能按照賣出報價成交。\n\n一旦持有部位後，假定動能持續推升價格走高，就要盡快按照賣出報價出場，想辦法在賣壓出現前掌握一些利潤。\n\
    \n如同當沖交易一樣，買進之前，先查核標的股票的股性。價格拉回的平均幅度是多少？價格漲勢的平均幅度又是多少？衡量最近的向上攏動距離，這有助於你判斷進場後可以期待什麼。\n\
    \n剛學習交易的過程中，搶帽子交易的規模不要太大，可能是 500 股或 1,000 股。新手飛行員使用的飛機可能是賽斯納，如果直接爬進 F-16 駕駛艙，恐怕會有麻煩。同理，初學者可能習慣持有小規模的較長期部位，如果突然交易\
    \ 2,000 股的超短期部位，同樣會有麻煩。所以慢慢練習，逐漸磨練自己的技巧。\n\n## 強化盤中交易工具\n\n此處雖然討論搶帽子交易，但各位可以發現，本章內容對於各種盤中交易也有幫助。\n\
    \n實際交易雖然取決於個股的股性，但成功的帽客通常運用道瓊期貨迷你契約、標普期貨迷你契約、那斯達克期貨迷你契約做為扳機。當然，有關期貨契約走勢的解釋，各交易所的\
    \ TICK 與 TRIN 指標也是珍貴的輔助參考。\n\n圖 11-2A 與圖 11-2B 分別代表 ES（標普 500 期貨 E 迷你契約）與 The\
    \ Home Depot, Inc.（HD）的 5 分鐘走勢圖，還有 10 期和 20 期移動平均（請注意，不論是 ES 或 HD，午休時段的成交量都明顯萎縮）。除非個股發生重大新聞，否則絕大部分股票——尤其是\
    \ HD 之类的大型股——都深受大盤走勢（ES）影響。\n\n圖 11-2A 與圖 11-2B 各自繪製了 10 期與 20 期移動平均。10 期移動平均最貼近價格型態。只要這兩條移動平均的位置處於價格型態下側，10／20\
    \ 交叉系統可以做為交易訊號，用於建立與結束部位（向上交叉代表買進，向下交叉代表賣出）。請注意：午休時段如果運用這套系統，訊號可能有反覆之虞。\n\n你的軟體如果提供費波納奇折返比率，可以用於期貨迷你契約的\
    \ 2 分鐘與 5 分鐘走勢圖，取得極具參考價值的支撐／壓力。圖 11-3 顯示費波納奇折返比率運用於 ES 的 5 分鐘走勢圖（換言之，圖 11-2A）。此處的費波納奇比率運用於起始樞紐低點（0%）到樞紐高點（也就是上午\
    \ 10:40 出現的盤中高點）。各位可以看到 ES 的後續走勢如何波動於這些費波納奇水準。\n\n你使用的軟體如果提供「每天的」樞紐水準（換言之，這些樞紐水準是根據每天最高價、最低價與收盤價計算），你可以將這些水準繪製在迷你期貨契約走勢圖，藉以顯示支撐／壓力。我發現，多數情況下，RealTick\
    \ 提供的每天樞紐水準適用於 5 分鐘走勢圖。\n\n![](img/468d7cacb0b269ef1c907b6846010599_341_0.png)\n\
    \n> RealTick® graphics used with permission of Townsend Analytics, Ltd. © 1986-2007\
    \ Townsend Analytics, Ltd.\n\n![](img/468d7cacb0b269ef1c907b6846010599_342_0.png)\n\
    \n圖 11-2B Home Depot Inc.（HD）5 分鐘走勢圖，以及 10 期和 20 期移動平均。\nRealTick* graphics used\
    \ with permission of Townsend Analytics, Ltd. © 1986-2007 Townsend Analytics,\
    \ Ltd.\n\n樞紐水準（pivot）是根據簡單公式計算的支撐／壓力，最初流行於場內交易員，他們沒有時間參考走勢圖，因此參考這些樞紐水準提供的支撐／壓力。\n\
    \n交易者當然可以自行計算樞紐水準，但如果能夠透過電腦軟體計算，顯然更有幫助。\n\n不論是月線圖、週線圖與日線圖，都可以計算相關的樞紐水準，但以日線樞紐水準最常用。繪製樞紐水準，需要前一個交易期間——月、週或日——的高價、低價與收盤價。R＝壓力，S＝支撐的基本樞紐公式：\n\
    \n- R2：樞紐＋（高價－低價）\n- R1：2×樞紐－低價\n- 樞紐：高價＋低價＋收盤／3\n- S1：2×樞紐－高價\n- S2：樞紐－（高價－低價）\n\
    \n就搶帽子與當沖的基本運用來說，每天樞紐水準提供的功能不錯。進階交易者還會在走勢圖增添週與月的樞紐水準。圖 11-4 顯示標準 500 期貨迷你契約 5\
    \ 分鐘走勢圖標示的每天樞紐水準。\n\n前述 5 個樞紐水準（R1, R2, 樞紐, S1, S2），中間的主要「樞紐」最重要。交易價格如果落在該水準之下，代表當天走勢疲弱；價格如果跌破\
    \ S1，則更疲弱；如果跌破 S2，走勢當然疲弱異常，意味著盤勢由空頭控制（就 RealTick 來說，R2 為黃色，R1 為藍色，樞紐為紅色，S1 為綠色，S2\
    \ 為黃色）。\n\n另一方面，價格如果攀升到主要「樞紐」水準上方，代表正面意義；價格如果穿越 R1，具有多頭意義；如果收盤價能夠克服 R2，且\n\n##\
    \ 新手筆記\n\n> 對於任何時間架構的走勢圖，「樞紐高點」（pivot high）是一個新高價格，其價位高於前一個與後一個高價。同理，「樞紐低點」（pivot\
    \ low）是一個新低價，其價位低於前一個與後一個低價。\n"
