    \n### 直覺的功能\n\n> 「唯有用心看，才看得清楚；重要的東西，用眼睛是看不見的。」\n>\n> ——聖修伯里（Saint-Exupery）\n\n\
    如何界定直覺的意義，也就是難以捉摸的「第六感」呢？根據韋氏字典說法：「這是一種不需明顯借重理性思考和推理，可以直接取得認知的力量或能力。一種立即呈現的洞察力。」\n\
    \n西方文明推崇理性、合乎邏輯的思維過程，而依賴人類五感之外的知識被認為是欺騙，實在令人遺憾！當我們堅持用邏輯和理性來判斷事物的同時，卻忽略了個人與生俱來的神奇智慧天賦。\n\
    \n現在，科學證實人類思維有兩種層次：有意識的理性思維，以及潛意識的直覺思維。意識的運作就像電腦，可以處理經驗數值，根據過去經驗做判斷，並計算相關結論。\n\
    \n但直覺思維卻可以超越個人界限，進入一座龐大的智慧和洞察力倉庫。當我們需要時，這種能力可以分析資訊做為指引。這種洞察力又稱為直覺，或第六感。\n\n尊重並滋養個人的直覺力，讓它成為我們生活的指導力量，我們的自信心會因此增強，生活各方面更有安全感，也更充滿力量。\n\
    \n如何運用直覺力，並聽從直覺的指示？方法之一是體認其存在。另一種方法是針對這個最明智的能力提出問題，譬如：我現在需要知道什麼？以目前的情況，我應該怎麼做？\n\
    \n某種感覺可能立即出現，讓你依此辨識、採取行動。如果沒有，相信答案很快就會出現在某個想法、對話、書籍、電影或事件裡。愈是經常練習，這種交流就愈容易、愈清晰。\n\
    \n直覺力永遠存在並供我們運用。直覺知道如何克服挑戰、達成目標。我們只需提出問題，然後信任它。\n\n## CHAPTER 9\n\n# 擬定適合你的交易計畫\n\
    \n假定你準備從薩薩諸塞州波士頓，開車到亞利桑那州猶馬，而你從未到過猶馬。這種情況下，如果沒有查閱地圖並預先做好規劃，想必你不會倉促上路。\n\n如果要割除盲腸，醫生不會拿起手術刀，說開刀就開刀吧？他總該先做必要的檢查。建築師蓋房子，也不會拿起磚塊就開始砌牆；總要先畫圖，再按圖施工吧！\n\
    \n職業運動選手除非預先擬妥比賽計畫，否則不會草率進場。UCLA 傳奇籃球教練約翰·伍登（John Wooden）曾說：「如果沒有做好準備計畫，那就準備接受失敗。」同樣的道理，成功的交易者在投入成千上萬資金進場論輸贏前，理當預先擬妥周全的交易計畫。\n\
    \n擬定交易計畫，然後按照計畫行事。一旦建立部位後，管理交易的技巧將決定最終勝負。\n\n首先，檢視你買進（或放空）股票當時所需填寫的基本資料；其次，討論「由上而下」相對於「由下而上」的交易策略；接著探討一項最根本、也是最重要的決策概念：風險／報酬分析；最後，各位將學習任何時間架構都適用的多頭部位進場和出場準則。\n\
    \n### 如何設計交易計畫？\n\n買股票就像在公園散步一樣簡單。但想要穩定地賺錢，還需配合周全的計畫、熟練的技巧，以及嚴格的紀律。本書第 4 章曾經談到，交易需要自信。沒有任何東西比周全的交易計畫更能加強信心了。\n\
    \n為每筆交易準備一份簡單的書面計畫，這是交易者給自己的最佳禮物。這麼做除了可以避免搞不定停損，同時提醒自己必須確實獲利了結。\n\n我會針對每筆交易準備一份非正式的工作底稿，並在部位結束後立刻填寫交易日誌。這兩件事都很簡單，如果有必要，也可以合併處理。我不希望把資料弄得也太複雜，最後面對一大堆數據，甚至找不到停損價位。\n\
    \n交易過程中，我的手邊放著一本黃色筆記本（你可知道黃色對於思考最有帮助？這也是為什麼很多筆記本都使用黃色），交易日誌則採用 Excel 試算表記錄。\n\n\
    一旦發現勝算高的交易機會時，我就在黃色筆記本上計算風險／報酬比率，然後根據核心交易、波段交易或當沖交易的性質，查閱週線圖、日線圖、盤中走勢圖上的支撐／壓力。\n\
    \n交易架構如果很好，我就按照進場價格建立適當規模的部位，然後在停損欄位填寫停損價格。對於正在進行中的交易，我會預先遞入停損單。\n\n少數情況下，我不會採用自動化停損交易指令，並在工作底稿上特別標示停損價位（我嚴格要求自己按照停損價位出場）。\n\
    \n### 新手筆記\n\n研究資料顯示，擺在腦海裡的目標沒有太大意義。把目標實際寫下來，通常更有意義。同樣的道理，心理停損可以計價還價，你最起碼應該白紙黑字寫下停損。交易經驗顯示，當股價真的下跌時，我們經常可以找到充分理由，把停損調降到次一個支撐區。把停損寫下來，眼見為憑，至少有助於我們維持紀律。當然，最好的辦法是把停損單預先交給券商。\n\
    \n現在，部位已經建好，即便是當沖交易，我都會在工作底稿記錄日線圖，甚至週線圖上的壓力水準。舉例來說，股票的日線圖或週線圖如果呈現超買，有可能影響股價在日線圖的反應。買進熱潮或有利的大盤走勢，可能在早盤帶動股價走高，但到了下午盤可能出現獲利回吐的實歷。\n\
    \n股價一旦逼近上檔潛在壓力區，當然也接近我設定的獲利了結目標。我會密切觀察發展，調緊停損，可能做部分或全部的獲利了結。\n\n價格漲勢如果強勁到穿越壓力而創新高，我會繼續持有部位，並因應大盤市況，考慮是否需要加碼。不論哪一種狀況，如果股價已經逼近上檔壓力，而我正忙著其他交易，只要稍微瀏覽就可以掌握當時狀況。\n\
    \n圖 9-1 顯示黃色筆記本工作底稿的樣本，圖 9-2 說明交易日誌試算表採用的欄位。\n\n我的交易日誌保留 3 個空位，用來記錄分批出場的價位。舉例來說，在\
    \ 14.29 美元買進 800 股甲骨文，然後在 14.70 美元、15.20 美元與 15.40 美元分 3 批出場，股數分別為 300 股、300 股與\
    \ 200 股。分批出場比較安全，也是不錯的戰術，因此交易日誌的試算表設計時，應該預先考慮每筆交易都能個別登錄，包括淨價格與淨額。\n\n![](img/468d7cacb0b269ef1c907b6846010599_260_0.png)\n\
    \n時間架構愈長，訊號愈有意義。舉例來說，週線圖的買進訊號，其重要性超過日線圖的賣出訊號；日線圖的買進與賣出訊號，重要性超過盤中走勢圖的對應訊號。\n\n\
    | 日期 | 報價 代碼 | 多頭/空頭 核心， 波段，當沖 | 股數 | 進場 價格 | 停損 | 潛在支撐/壓力 （起始獲利目標） |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- |\n| 5/21 | ORCL | L, Swing | 500\
