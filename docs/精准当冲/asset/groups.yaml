    人滿意。有位交易教練曾跟我說：「停損設定位置，取決於個人的風險容忍程度。」


    沒錯。風險容忍程度高的人，可以采用較寬鬆的停損，因此部位遭到停損的機會，當然就少於風險高度敏感的人，成功獲利的潛能也更大。可是，部位一旦遭到停損，損失也較嚴重。


    風險容忍程度低的人，設定的停損比較緊密，藉以舒緩部位承擔的心理壓力。但這些人也要忍受另方面的痛苦，他們設定的停損比較容易被引發，因此經常需要重新進場提高交易頻率，藉以攔捕更多的小額虧損。


    建立部位後，起始停損設定在當天最低價下方 10~50 美分位置；若此設定的停損太遠，可以改設定在 15 分鐘走勢圖下檔支撐之下 10~30 美分（空頭部位的停損設定則相反）。同樣地，停損設定要用常識判斷。交易股票單價如果是
    115 美元，每天價格區間平均為 4 美元，停損顯然就要設定得寬鬆一些。單價 20 美元的股票，每天價格區間平均為 1 點，或許可以采用 30 美分的停損。當然，相關設定也要考慮支撐／壓力位置。股價一旦創新高，停損就要根據目前價位調整，或許要減掉拉回的價格平均區間。


    如何設定追蹤型停損呢？隨著價格朝有利方向發展，調整部位停損，藉以保障既有獲利。假定你在 20.25 美元買進某股票，起始停損設定在 19.70 美元。根據估計該股票拉回走勢的平均幅度為
    40 美分。稍後，等到該股票價格上漲到 20.90 美元（或附近），你再把停損調整到當前價位下方的 40 美分位置，也就是 20.50 美元。當天只要價格創新高，就把停損調整到新高價位下方
    40 美分位置。等到該股價逐漸逼近上檔某壓力區，你可能不再考慮停損，直接做部分或全部獲利了結，實際處理方式需考慮當時大盤市況、剩餘交易時間，以及個股走勢強度等因素。


    記住，一旦設定停損後，多頭部位的停損只能往上調整，空頭部位的停損只能往下調整。


    ## 新手筆記


    不論是網路折扣券商或直接下單券商，應該會提供自動化追蹤型停損單功能，這使得停損設定更容易。衡量盤中走勢圖過去 3 天內的拉回走勢平均幅度，然後根據這項數據設定追蹤型停損，或許額外加上幾美分，防範可能出現的反覆走勢。另外，價格一旦接近目標價位，可以考慮調緊追蹤型停損，盡可能掌握既有的帳面獲利。


    ## 適合當沖交易的架構


    前面談到波段交易與當沖適用的兩種典型架構：橫向盤整的向上突破，以及拉回走勢的向上突破。如果只針對這兩種架構進行交易，同時結合 K 線、成交量、移動平均、動能指標、由上而下的交易準則等提供的訊號，就可以創造成功的交易生涯。


    對於那些想要有更多機會的人，可以觀察其他架構，微調進場點。首先，做好研究工作。分析前一天（昨天）價格走勢，這能夠透露一些資訊，包括你可以在今天的何處與何時進場（就開盤跳空走勢來說）。


    不論是當沖或較長期交易，移動平均都扮演重要角色。對於盤中走勢圖，我會採用 20 期與 200 期移動平均，因為這兩條均線可以提供明顯的支撐／壓力（對於極短線的搶帽子交易，我採用
    1 分鐘走勢圖與 10 期移動平均）。交易者一旦培養自己的交易風格，就可以根據偏好，增添 100 期或 50 期移動平均，甚至採用 EMA（如果交易軟體提供這種移動平均的話）。記住，對於盤中多頭交易來說，股價目前位在日線圖或盤中走勢圖的
    20 期移動平均之上，交易成功的機會比較大。


    15 分鐘走勢圖的 200 期移動平均特別重要，這條均線如果壓在目前股價上，價格漲勢將面臨重大壓力。


    假想你在游泳池潛水，有個彪形大漢站在泳池邊，不斷阻止你浮出水面。每當你想要浮出水面換氣，他就把你的頭壓回水裡。200 期移動平均就是扮演這種壓力。當然，某些股票確實可以向上突破
    200 期移動平均而繼續挺進。可是你交易的股票，如果上檔即將面臨 200 期移動平均壓力，股價順利上漲的機會就變小。


    ## 買進架構 1: 圖 10-6


    買進的標的股票，正由盤整底部向上突破，或日線圖已呈現上升趨勢，但最近 2、3 天價格拉回整理。昨天（假定你在「今天」進場）的日線圖是一支實體很小的十字線，下影線觸及或接近正處於上升狀態的
    20 天移動平均。今天，市場開盤接近昨天收盤價（相差不到 35 美分）。換言之，開盤稍微跳空，缺口很快就被填補，然後行情回升，突破早盤高價。價格突破前一天十字線高價時，代表買進訊號。如果各項條件顯示「進場」，進場日當天一大早先建立小部位，等到價格突破十字線高點再加碼。這種交易最好在早盤建立部位。


    ![](img/468d7cacb0b269ef1c907b6846010599_315_0.png)


    圖 10-6 買進架構 1


    替代操作方法：市況如果顯示股價在下午盤還能繼續上漲，且風險／報酬關係有利，不妨在收盤前獲利了結半數部位，剩餘半數部位成為波段交易。


    圖 10-7 顯示 Consolidated Edison（ED）日線圖，目前正處於上升趨勢（一系列波段走勢的高點與低點持續墊高）發展初期的拉回走勢。拉回走勢發展過程，有兩天出現十字線，也就是說當天的開盤價與收盤價接近，當天高價與低價的區間相對有限。十字線扮演
    functional 就像「壓力鍋」一樣。隔天行情如果朝正面發展，往往適合進行當沖交易。


    圖 10-8 顯示前述 ED 5 分鐘走勢圖，說明買進架構 1 的運作。


