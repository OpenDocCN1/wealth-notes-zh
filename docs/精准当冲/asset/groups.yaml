    +   - 吊人發生在延伸性漲勢的末端，錘子發生在延伸性跌勢的末端。


    +   - 這種線形代表既有趨勢可能發生變化。


    如同圖 5-9 顯示，錘子與吊人線形的實體可以是白色或黑色，但白色的錘子更具多頭意涵，黑色的吊人更具空頭意涵。


    吞噬型態（Engulfing patterns）由 2 支線形構成，代表主要趨勢反轉的徵兆。請參考圖 5-10，左側是發生在延伸性跌勢末端的多頭吞噬排列，代表既有下降趨勢即將向上反轉；右側是發生在延伸性漲


