    Townsend Analytics, Ltd.


    ## 精準當沖


    ![](img/468d7cacb0b269ef1c907b6846010599_160_0.png)


    圖 6-27 Pfizer, Inc. (PFE) 15 分鐘走勢圖呈現明確的下降趨勢。各位如果觀察日線圖，就會發現這支製藥與消費者醫療保健股票處於下降趨勢。4
    月 7 日，PFE 這份盤中走勢圖，展現完美的 1-2-3 階段向下突破型態。製藥類股屬於「防禦型」股票。經濟不景氣的情況下，很多投資人強調民生必需品類股，包括醫療保健（製藥、生化科技、醫療器材等股票）、食品、家庭用品、個人保健與化妝品等。


    RealTick® graphics used with permission of Townsend Analytics, Ltd. © 1986-2007
    Townsend Analytics, Ltd.


    ![](img/468d7cacb0b269ef1c907b6846010599_161_0.png)


    圖 6-28 道瓊指數迷你契約的 5 分鐘走勢圖，這是道瓊工業指數期貨契約的迷你版本，在芝加哥期貨交易所掛牌。稍後會更詳細討論「迷你道瓊」契約。現在，先看這份盤中走勢圖的向下突破案例。


    - 1. 早盤接近中午，迷你道瓊創盤中高價 11,242，然後做橫向整理。中午 12:30，價格向下突破，跌破頭部的橫向整理下檔支撐，跌到早盤先前高點壓力附近才獲得支撐

    - 2. 很快地，迷你道瓊又跌破 11,215 的支撐，5 分鐘線來到 11,210 。

    - 3. 迷你道瓊來到先前的支撐，很快就跌破。由於下檔另一個支撐就在附近，精明的交易者此時不該積極加碼。下午 2:30 左右，買盤進場。


    RealTick* graphics used with permission of Townsend Analytics, Ltd. © 1986-2007
    Townsend Analytics, Ltd.


    股票可能透過兩種方式進行修正：（1）橫向發展或整理，（2）拉回。對於下降趨勢來說，拉回過程則是「反彈」。


    不論透過哪種方式修正，只要價格不跌破原先突破關卡的支撐，修正走勢一旦結束，價格重新上漲，就是絕佳的加碼進場點。


    反之，修正過程如果跌破原先突破關卡價位的支撐，就代表出場訊號。


    ## 如何繪製趨勢線


    交易者應該養成繪製趨勢線的習慣。瀏覽走勢圖時，你可以在腦海裡繪製適用的趨勢線，也可以在走勢圖上實際繪製趨勢線。


    理論上，繪製趨勢線時，可以銜接兩個低點或兩個高點，就如同繪製橫向走勢的支撐與壓力，以下將說明得更精確一些。


    繪製趨勢線是研究技術分析的基本功之一，每位交易者與投資人都應該要熟悉這種方法。


    ## 新手筆記


    - 1. 有些交易者認為首度向上突破後，價格最好做橫向整理，而不是拉回到原來的突破關卡附近做修正，因為這類的向上突破，力量更強勁。另一些人則認為無關緊要，拉回走勢只要守住低檔支撐，其本身就是正面訊號。

    - 2. 不論什麼東西，怎麼上去，通常就怎麼下來。股價也是如此。你的持股如果出現兩天飆漲走勢，回檔通常也是直線下降，這種情況幾乎看不到買盤支撐，刺激程度恐怕超出預期。

