    圖 9-10 顯示 Lear Corp.（LEA）日線圖的雙重底排列和買進機會。


    雙重底排列代表理想的買進機會，理由之一是價格重新測試低點成功而向上回升。這時，持有空頭部位的交易者看到下降趨勢發展可能告一段落，於是回補。空頭回補的買進，配合多頭搶攻，價格可能快速上揚。


    就形狀來說，雙重頂是雙重底對應的型態，又稱為 M 頭。雙重底是發生在延伸性跌勢末端的底部反轉排列，型態完成後，將出現上升趨勢；同理，雙重頂是發生在延伸性漲勢末端的頭部反轉型態，型態完成後，將出現下降趨勢。當股價跌破雙重頂型態盤整區的支撐，空頭可以進場放空。放空技巧，請參考第
    11 章討論與雙重頂的案例。


    ### 杯狀帶柄型態


    這個型態是由經濟日報創辦人威廉·歐尼爾（William O''Neil）命名，經常出現在各種時間架構，提供不錯的獲利潛能。對於核心交易與波段交易，應該留意日線圖這種盤底型態。排列結構看起來像咖啡杯側面，有個圓形杯狀底部，外帶杯柄，請參考圖
    9-11 說明圖例。圖 9-12 顯示杯狀帶柄的買進訊號。


    杯狀帶柄排列完成前，會出現柄部的橫向整理，蓄積向上突破的動力。價格一旦夾著大量向上突破杯狀帶柄的壓力區域，可以買進半數部位，剩餘部位則在拉回整理向上反轉的美好春天買進。這部分最安全的進場點，是在美好春天高點上方
    5～10 美分位置買進。


    > **新手筆記**

    > 如果不確定價格盤整後的突破方向，可以檢視盤整期間收盤價位置。如果大部分收盤價都位在最高價附近，很可能意味著向上突破；反之，多數收盤價如果位在最低價附近，則可能向下突破。當然，這只是大概原則，並不保證必然如此。另外，交易者也可以檢視超買／超賣技術指標，尤其是背離現象。

