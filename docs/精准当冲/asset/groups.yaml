    5 分鐘），而是以特定跳動檔或交易筆數為準（不是契約口數或股數，而是實際交易筆數）。觀察跳動檔走勢圖，股價指數或個股動能減緩，走勢圖也會放緩。動能如果增加，尤其是價格走高或走低，跳動檔也明顯增加。我選擇採用
