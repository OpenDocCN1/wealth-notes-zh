    交易者如果考慮採用直接下單交易平台，不妨評估下列要點：


    1. 交易指令輸入系統能夠直接下單到所有主要交易所，且不僅透過單一電子通信網絡。就目前來說，那斯達克的市場第 2 級報價資訊總覽顯示的市場參與者數量最多。

    2. 系統執行交易的速度如何？記住，速度是最重要的武器。快速執行能力可以幫你節省很多錢，尤其當你急著出場時。

    3. 系統是否方便鍵盤操作？需要用鍵盤輸入交易指令嗎？最好採用按鍵方式。買進與賣出的勾選方塊是否夠清楚？學習使用電子系統已經夠難了，千萬不要再無謂添亂。我剛學習交易時，偶爾會搞混買進與賣出。

    4. 系統是否穩定、可靠？當機的情況有多普遍？你與市場的連結將因此被切斷。這點很重要，因為市場女神有著非常奇特的幽默感：就在你抱滿價格波動最劇烈的半導體股票時，某個壞心腸分析師剛好調降半導體產業評等，而在半導體股票行情崩跌的過程，你的系統也當機！不要輕易放過系統的業務代表：這套系統究竟有多少人使用？萬一發生問題時，方便透過電話聯絡嗎？系統支持人員是否夠及時？

    5. 所有重要資訊是否都顯示在相同頁面？如果為了查閱帳戶部位與交易指令，以及第 2 級報價資料與走勢圖等，需要來回叫出不同頁面，一旦碰到緊急狀況，你就會瘋掉。

    6. 投資組合資料的更新速度如何？你需要隨時知道目前持有的部位、已經完成的交易、帳戶餘額、帳面盈虧等資料。你也需要隨時看到股票候選清單，包括正在追蹤的股票、目前價格、價格變動等。

    7. 系統是否提供股價指數期貨的報價資訊？這點很重要，你至少需要標普 500 指數 E 迷你契約的報價。如此可能需要額外支付費用，但金額微不足道。如果交易道瓊成分股或那斯達克股票，就需要有道瓊迷你契約與那斯達克
    100 種指數迷你契約的報價。這部分內容稍後會詳細討論，目前你只需要知道，每個市場專業玩家在交易過程中，隨時都會追蹤這些股價指數期貨的價格走勢。

    8. 系統是否提供客製化走勢圖？走勢圖能夠顯示股票表現。我如果不是正在看著手頭持股的走勢圖，就是在瀏覽其他候選股票的走勢圖。繪圖套裝軟體的品質差異頗大，有些品質很好，有些很差。你可能不希望採用長條圖，這種圖形提供的資訊不足；你可能希望採用
    K 線圖（陰陽線），還有許多技術指標，譬如：移動平均（moving average，MA）、隨機指標（Stochastics）、趨向系統（Directional
    Indicator system）、包罩傑帶狀（Bollinger Bands）、移動平均收斂發散（moving average convergence-divergence
    oscillator，簡稱MACD）、相對強弱指標（Relative Strength Index，簡稱RSI）、商品通道指數（Commodity Channel
    Index，簡稱CCI）等。後續章節會詳細介紹這些技術指標。你必須確定繪圖系統允許更改參數的預設值。另外，你也需要知道時間架構的問題，系統必須提供季線圖、月線圖、週線圖與日線圖，最好還有盤中走勢圖。各位如果覺得前述說明有些不知所云，大可不用擔心，隨著持續閱讀本書，相關概念會愈來愈清楚，這些絕對沒有表面上看起來那麼困難。

    9. 成為進階交易者後，你需要設計一套客製化篩選系統，從所有股票中，選取符合條件的候選股票。你使用的軟體是否提供這方面功能？軟體本身是否具備篩選功能？（我使用的交易軟體內建基本篩選功能）

    10. 交易佣金費率如何計算？按照交易股數計算？或按照交易筆數計算？券商收取的費用多寡，取決所採用的造市者或 ECN。詳細查詢券商收取的每筆費用。

    11. 交易軟體是否收取月費？每個月是否規定至少需要進行幾筆交易？交易數量如何影響月費？

    12. 保證金比率如何？是否具競爭力，現金餘額是否支付利息？

    13. 開戶是否有最低餘額規定？（美國證管會規定當沖客的帳戶餘額起碼要有 25,000 美元，而證管會的規定會自動成為券商的規定）

    14. 交易平台是否提供警訊提示功能？如果具備這方面功能，當股票觸及某價位時，是否可以讓系統透過影像或聲音提供警訊？

    15. 交易平台是否提供市場相關新聞？需額外收取多少費用？

    16. 系統安全性如何？除了你之外，還有誰能夠進入你的帳戶？防範措施是否充分，譬如密碼等，是否足以防範駭客入侵？


    下載這些平台的試用軟體，你將發現某些適合初學者，某些則更適合技術專家。即使軟體功能很強，你也需要知道券商情況，打電話給他們，確認電話回應速度如何？是否有人回應？或只有語音信箱？你應該提出一連串問題，不妨把對方視為傳統網路券商。


    想要深入了解各種交易軟體平台的優缺點，最好前往參觀交易博覽會或金融產品展，觀賞業務代表實際操作各種交易軟體，如果有任何問題也可以現場提出。


    務必與其他交易者討論，彼此交換意見。唯有那些真正採用、實際操作的交易者，才能透露真實狀況。真實狀況非常重要，尤其是涉及實際資金輸贏的時候。


    ### 是否有必要設立兩個交易帳戶？


    我有兩個交易帳戶。第一個帳戶完全用於當沖交易，這個帳戶進出頻繁，所有部位在市場收盤前就會結束，很少持有隔夜部位。


    第二個交易帳戶持有中期部位，帳戶設在網路券商，理由有三點：第一，網路券商允許我使用常效停損單；所謂「常效單」指「取消前始終有效」的交易指令（多數直接下單券商會在市場收盤時，自動取消所有未生效的停損單）。所以透過傳統網路券商進行交易，我
    知道自己設定的停損單始終有效，不需擔心。


    第二個理由：偶爾會碰到追繳保證金的情況。你持有的隔夜多頭 部位，第二天上午開盤可能大跌，因此接到追繳保證金的通知。交易 時段內，交易者必須處理很多事情，腦海裡還需要做各種計算，有時
    候不免犯錯，使得部位超過保證金限制。碰到這種情況，有些券商會 自動提示警告，拒絕後續的交易指令。


    我最近有碰到類似情況，但自動系統並沒有發出警告，仍然允許 我進行交易，因此稍微超出保證金允許交易的額度。隔天，我打電話 向券商的交易櫃台查詢，經紀人承認：「系統有時候不能正常發揮功
    能，交易者有責任追蹤自己的保證金情況。」


    我保留兩個帳戶的第三個理由：伺服器有時會當機，這可能讓你 付出慘重代價。你正全神貫注想結束某個遭到不利走勢影響的部位， 突然螢幕靜止了。詛咒幾個不雅字眼後，你趕快轉換到另一個帳戶
    （假定設立在另一家券商），情況如果太糟，還需針對某些部位進行


    ![](img/468d7cacb0b269ef1c907b6846010599_63_0.png)


    ### 新手筆記


    務必安排另一家網路業者，以備不時之需。有線數據機的速度 雖然快，效率也高，但偶爾會當機，所以你必須安排另一套無 線上網設備，甚至透過撥接式數據機上網。總之，除了一般使
    用的有線上網或 DSL 線路，還需另行準備其他上網方式。至於 費用，相較於網路當機可能造成的損失，譬如 500 股的 1 點損 失，這成本根本微不足道。


    ![](img/468d7cacb0b269ef1c907b6846010599_63_1.png)


    保險。


    保留兩個交易帳戶也提供另一項紅利：剛交易時，當沖經常虧損，但我的長期持有股票（所謂的「部位交易」）卻賺錢。結束整天慘烈的交易後，看見部位交易帳戶是賺錢的，這多少可以安慰我受到傷害的自尊，也可以沖銷當沖帳戶的虧損。


    請注意，想維持兩個不同的帳戶，必須秉持兩種不同的心態或紀律。處理長期股票時，不能抱持積極交易的心理，反之亦然。某個帳戶如果侵入另一個帳戶領域，就失去維持兩個帳戶功能的意義，一切會陷入混亂。


    另外，如果想維持雙重帳戶，其中一個帳戶不妨設在交易指令撮合效率高、佣金費率低、無附加服務的網路券商。記住，佣金費率愈高，券商提供的服務愈多。你往來的直接下單券商，想必可以提供各種研究資料。事實上，有很多網站提供免費的股票新聞和研究資料，請查閱本書第
    14 章列舉的金融資訊網站。


    ## 滑價與佣金：對於獲利的影響


    滑價指下單當時報價螢幕顯示的理論成交价格，其與實際成交价格之間的差距。缺乏警惕的交易者與投資人運用市價單買賣股票時，往往讓造市者有機會上下其手，賺取滑價帶來的利潤。


    舉例來說，你想透過網路券商買進伊古魯冰淇淋股票。此時該股票最佳賣出報價為 29.50 美元。你下單按照市價買進 500 股伊古魯。照理來說，這筆交易的成交價格是
    29.50 美元，但實際回報價格卻是 29.55 美元。實際買價較理論成交价格每股高出 5 美分，500 股就是 25 美元。這種情況每天如果發生 5 次，滑價就是
    125 美元。

