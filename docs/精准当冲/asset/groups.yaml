    1. 進行多邊搶帽子交易時，不該等到股價漲勢轉弱才獲利了結。換言之，你應該趁著股價上漲動能而賣出，不要擔心把錢留在桌上。這種交易風格就是要運用價格動能，盡快獲利了結。

    2. 股票處於盤整階段，留意隨機指標或 CCI 呈現的多頭背離。這種現象往往意味著股價即將向上突破。


