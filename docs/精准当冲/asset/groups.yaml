    # ## 交易指令類型


    我知道各位兩眼乾澀，頭腦像糨糊一樣，但請打起精神，學習下列的交易指令。


    各位可以使用的交易指令類型包括：


    市價單（market orders）：如果按照「市價」買賣，等於給專業報價商或造市者全權委託書。他們決定你需要支付或取得的成交價格。當你的交易指令到達他們手中，這些人可能不會按照當時顯示的報價撮合（我曾經目睹造市者接到市價賣單時，調降他們的買進報價）。你所交易的股票成交量如果很大，交投狀況穩定，而且你不想追價，不妨採用市價單。你如果不計代價而急著買賣，可以採用市價單。除此之外，請採用限價單。如果不能成交，就不要追價。市場永遠都有機會。


    限價單（limit order）：採用限價單交易，意味著你準備按照特定價格買賣特定數量的股票。換言之，限價買單設定的價位，低於當時的最佳賣出報價；限價賣單設定的價位，高於當時的最佳買進報價。專業報價商或造市者想撮合你的限價單，必須等到成交价符合或優於你指定的價格。


    你如果希望按照目前買進報價和賣出報價的中间價買賣，或者按照目前買進（賣出）報價買進（賣出），就可以採用限價單。你準備買進的股票，價格如果上漲，可以採用限價買單在低檔等待；當然，'
  - '[PAGE 248]


    這種限價買單可能成交，也可能沒有成交。賣出股票的情況也是如此。你想賣出的股票，價格如果下跌，可以采用限價賣單掛在高檔等待；同樣地，這種限價買單可能成交，也可能不會成交。限價單可以是「當日有效」或「取消之前始終有效」（good
    till canceled，簡稱GTC 或常效單）。


    全有或全無（AONs, all or nothing）：交易指令可以指定為全有或全無。換言之，專業報價商或造市者如果不能撮合整筆交易，那就完全不要撮合。舉例來說，如果你運用全有或全無限價單買進
    500 股，這個指令必須全部成交，不能只成交一部分（換言之，不能只買 350 股）。我通常都不會勾選全有或全無。如果行情變動得很快，我下單買進 1,000
    股，或許只能買到嗆零股，譬如 26 股。碰到這種情況，我只能處理嗆零股；各位或許希望勾選全有或全無。


    買進停止單（buy stops）：你可以採用這種交易指令買進股票，指定價格高於目前行情。舉例來說，伊古魯冰淇淋股票目前交易價格為 20 美元，正好是當下需要克服的重要壓力。股價如果能夠向上突破
    20 美元，你就打算買進。可是，你知道，很多人都在注意這支股票，股價如果真的突破 20 美元，勢必有很多人準備搶進。這種情況下，如何先下手為強呢？你可以預先在
    20.01 美元設定買進停止單（我把買進停止單設定在 20.05 美元，如此更能確定股價成功向上突破），靜待後續發展。伊古魯如果不能突破 20 美元，你的買單就不會成交。缺點：股價如果觸及你指定的停止價位或更高，買進停止單就生效而變成市價買單，很難預估實際成交價格究竟是多少。舉例來說，市場開盤前，你用買進停止單透過網路券商買進
    500 股伊古魯冰淇淋，停止價位設定在 20.01 美元。市場開盤，萬一伊古魯冰淇淋跳'
  - '[PAGE 249]


    空大漲，你的成交價格可能是 23.01 美元。然後，你可能要面對「和跳空缺口對幹」（fading the gap）的交易者（「和跳空缺口對幹」指某些交易者看到開盤跳空，就建立反向部位，因為預期價格會立即拉回試著填補缺口）。相較於前一天收盤價，股票開盤跳空的程度如果超過
    0.5 點，通常都會立即折返。所以你的買進停止單可能成交於 23 美元，但價格可能很快就拉回到 21 美元。這給我們什麼教訓呢？市場開盤前，不要預先遽入買單。適合採用買進停止單的時機：你準備買進某支正處於狹幅盤整的股票，但你想外出午餐，又擔心該股票剛好在這個空档向上突破。


    停損單（stop-loss order）：對於持有的股票多頭部位，你可以藉由賣出停止單，指定按照某低於目前行情的價位賣出股票。等行情來到你指定的價位，該賣出停止單就自動變成市價賣單。同理，對於持有的股票空頭部位，可以藉由買進停止單，指定按照某高於目前行情的價位回補股票。等到行情來到你指定的價位，該買進停止單就自動變成市價買單。


    限價停損單（stop-loss limit order）：停損單一旦生效，就自動成為市價單；反之，限價停損單一旦生效，就變成限價單。換言之，限價停損單設定兩個價位，一個是停損價位，另一個則是限價單的指定價格。


    自動化追蹤型停止單（automatic trailing stops）：很多折扣券商和直接下單券商都提供自動化追蹤型停止單。就多頭部位來說，你設定的停損單會隨著行情走高而不斷向上調整（但不會向下調整），所以價格只要從目前價位下跌某特定程度——由使用者指定為
    10 美分、90 美分或任何特定水準，或某特定百分率——多頭部位就自動'
  - '[PAGE 250]


    停損。至於空頭部位，情況剛好相反。


    即效單（fill or kill orders）：交易指令如果沒有立即成交，就馬上取消。


    恭喜你完成初學者訓練課程。當你開始實際進行交易，就能體認這段辛苦訓練的成果，也會慶幸在沒有進行交易的情況下先訓練。因為沒有實際進行交易，才能保持輕鬆的心情學習。


    接下來的篇幅，我們準備討論各種時間架構下的實際交易準則與下單程序。換言之，即將討論交易實務。


