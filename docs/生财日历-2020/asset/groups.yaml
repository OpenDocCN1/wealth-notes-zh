    # 赚钱的几个变化曲线。


    做个小项目，赚到几十万，隔年项目死；再把赚的钱扔到新项目里面去，赚个百八十万，隔年还是死；再把赚的钱扔到新项目，泡都没有冒起来；借钱再搞项目，有点眉目，再借钱，信用卡额度套出来，好了，终于起来了，年底项目卖掉，套现离场。


    赚钱的曲线变化基本上是这 样的。阶层不到，别跟我说上市，时间最贵，希望可以把握。


    ![](img/4811ea1b783f3e7a66aa0d4445ea956f_55_1.png)'
  md: "\n# 26\n1月26日 星期日 农历 正月初二\n\n## 来自「大树」的主题\n\n我们是如何设计出生财有术Logo的？\n\n解读：圈子（社群）+\
    \ 钱￥（旋转起来钱的符号）+ 术（生财有术）。\n\n一个谈钱不伤感情的社群。\n\n整个形象是一个转起来的钱币，把术和钱结合在一起。通过图形化设计，既是术又是钱，紧贴主体，颜色延续原有的绿色系印象，用了一个更“脆”更年轻的颜色。\n\
    \n![](img/4811ea1b783f3e7a66aa0d4445ea956f_26_0.png)\n\n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码\
    \ 可查看完整主题\n\n# 27\n1月27日 星期一 农历 正月初三\n\n## 来自「周可」的主题\n\n做抖音视频两个基本点：要学会蹭热点，做热门内容。\n\
    \n- 一是做热门领域，抖音上像奇闻、探索、励志、动画，都是热门领域，有非常多受众，选择热门领域做内容，更容易爆，更容易出效果，事半功倍。\n- 二是“复制”热门内容，对绝大部分人而言，要从0到1创作一条爆款内容，几乎不可能，但，我们可以选择重做一遍爆款内容。把别人的爆款，按照我们的理解，做成自己的爆款。这种方式，目前在抖音上屡试不爽。\n\
    \n![](img/4811ea1b783f3e7a66aa0d4445ea956f_27_0.png)\n![](img/4811ea1b783f3e7a66aa0d4445ea956f_27_1.png)\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 28\n1月28日 星期二 农历 正月初四\n\n## 来自「无知」的主题\n\
    \n口碑维护这场仗是需要一直打下去的，而实际情况是渠道广、媒体平台多、信息源庞大，单靠几个人没法完全覆盖到的。\n\n所以我们需用到舆情监控工具，一套有内容分析功能的爬虫系统，可以基于设定的关键词，实时监控全网几万个媒体站点的信息，并对信息能做正负面识别，且可以分析各个媒体平台的发文声量、事件的传播路径等，可以帮助决策者第一时间发现负面报道，做出决策。在舆情事件的传播中，时间是最重要的资源。\n\
    \n![](img/4811ea1b783f3e7a66aa0d4445ea956f_28_0.png)\n![](img/4811ea1b783f3e7a66aa0d4445ea956f_28_1.png)\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 29\n1月29日 星期三 农历 正月初五\n\n## 来自「Sky」的主题\n\
    \n我们身边很多人之所以焦虑，大多数原因是我们只有一份工资收入，一旦失去这份收入，我们的房贷、车贷、生活就会失去保障，所以我们每天必须去面对我们不喜欢的人，不喜欢的事情，以及不喜欢的人际关系。\n\
    \n知乎上有一个很经典的问答，月入3W感觉很焦虑？有一个点赞很高，“你收入的姿势不对，如果你是收房租月入3W你肯定会幸福”。\n\n所以，趁着年轻，给自己多找一些收入的渠道。\n\
    \n![](img/4811ea1b783f3e7a66aa0d4445ea956f_29_0.png)\n![](img/4811ea1b783f3e7a66aa0d4445ea956f_29_1.png)\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 30\n1月30日 星期四 农历 正月初六\n\n## 来自「条形马」的主题\n\
    \n社交网络普及以后，我们不需要和大牛拥有相同量级的资源和社会生态位，只需要在某一或某几个领域上，拥有和对方认知能力相匹配的层级，就能与之对话。\n\n整天羡慕赶风口和追红利，其实若以时代为分野，能对话这事儿已经是我们区别于上一个时代的人的大红利之一了。\n\
    \n![](img/4811ea1b783f3e7a66aa0d4445ea956f_30_0.png)\n\n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码\
    \ 可查看完整主题\n\n# 31\n1月31日 星期五 农历 正月初七\n\n## 来自「许欢」的主题\n\n> “这是最好的时代，也是最坏的时代！”\n\
    \n英国文学家狄更斯曾这样描述工业革命发生后的世界。\n\n在5G的年代，是信息革命的时代，但上面这句话同样适用。因为跟不上时代的人，这个时代对于他来说，就是最坏的时代。而对于我们的认知来说，我们即将迎来的是最好的时代！\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 32\n2月1日 星期六 农历 正月初八\n\n## 来自「王六六」的主题\n\
    \n没有谁能把每次活动都做到爆发增长，都是经过无数测试测出的最优解，一个好的选题是要经过几十个、几百个选题去测试出来的。\n\n![](img/4811ea1b783f3e7a66aa0d4445ea956f_32_0.png)\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 33\n2月2日 星期日 农历 正月初九\n\n## 来自「李晨」的主题\n\
    \n我相信好运，我的好奇心也常带给我一些好运。个人努力重要，但想要有更好的发展，也很需要思考历史进程以及运气的影响。\n\n幸运的人，常常善于发现周围世界的闪光点，主动增加自己接触的信息，这就是幸运的行为。\n\
    \n![](img/4811ea1b783f3e7a66aa0d4445ea956f_33_0.png)\n\n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码\
    \ 可查看完整主题\n\n# 34\n2月3日 星期一 农历 正月初十\n\n## 主题\n\n有钱赚钱，没钱赚人气。钱可以不赚，人气不会过时。  \n心态要好。\n\
    \n![](img/4811ea1b783f3e7a66aa0d4445ea956f_34_0.png)\n![](img/4811ea1b783f3e7a66aa0d4445ea956f_34_1.png)\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 35\n2月4日 星期二 农历 立春 正月十一\n\n## 来自「亦仁」的主题\n\
    \n做项目要区分赚的是新鲜感的钱还是赚稳定提供价值的钱。\n\n判断不一样，打法不一样。现在再考虑做地图的事情，建议亏钱找渠道卖地图，作为引流款，后面有高客单价的变现端来承接。\n\
    \n就跟区分是做赚钱的公司和值钱的公司一样，做项目也要区分是赚新鲜感的钱还是赚稳定提供价值的钱。\n\n![](img/4811ea1b783f3e7a66aa0d4445ea956f_35_0.png)\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 36\n2月5日 星期三 农历 正月十二\n\n## 来自「拾山」的主题\n\
    \n用错误的方法去赚钱，强化的是错误的方法和错误的理论，最终一定会卡到一个阶段无法再提高了。而用正确的方法亏了钱，你恰恰有了一个修正自己投资体系的机会，从而更加完善这个体系和框架。\n\
    \n久而久之，你就可以找到可重复盈利的方法了。\n\n![](img/4811ea1b783f3e7a66aa0d4445ea956f_36_0.png)\n\
    \n生财有术 一个谈钱不伤感情的社群  \n生财有术成员扫码 可查看完整主题\n\n# 37\n2月6日 星期四 农历 正月十三\n\n## 来自「一本黑」的主题\n\
