    农历 腊月廿三


    来自「沈小善」的主题


    **做了好产品，怎么动员身边资源？**


    有公众号、微信群资源、大量好友的大佬，他们转发宣传能力强，可以帮到你。但为什么要帮你？他们知道你做的是什么吗？你提供的东西有价值吗？他们信任你这个人吗？


