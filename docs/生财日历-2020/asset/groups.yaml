    让我们想想，用户主动搜索，用户基数很大，购买意愿强烈，这是什么地方？答案呼之欲出：淘宝！


    于是我到淘宝上调查了一下，信用卡相关关键字几乎没人做！红利啊！


    立刻用生意参谋分析了需求的分布，关键字的搜索量，竞争度，优化关键字后设计上架了这样一个产品：XXX银行信用卡内部员工申请通道，售价2块，核卡失败可退。


    上架2周关键词排第一，每日询单最高400多。


