    # 来自「条形码」的主题


    大众普通爆品如何挖掘，有人做过这样的总结：男人怕虚怕穷、女人怕老怕丑、小孩怕笨、老人怕死。这四个怕，算是一条捷径了。但这也是竞争最为激烈，价格最没有底线的品类了。


    如果想要拥有定价权，在没有品牌力的前提下，建议先避开这些品类，试着往小众领域摸索。比如资格证相关的培训类；比如找热门高薪知识工作者行当的领路人来开课，像大数据分析、数据挖掘、小程序设计甚至区块链技术这样的口子；比如象征身份和品味的一些闲课，如红酒品读、国画赏析和歌剧赏析这类。


