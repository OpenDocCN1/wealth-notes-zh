- pgno: 2
  md: '# 序言


    人類為了經濟獨立而需要金錢；過去數世紀以來，許多人用各種方法教育我們關於金錢的理解，但是沒有一個時代能真正提升管理金錢的智慧水平。歲月流逝、世代輪替，而我們依然原地踏步。即便聰穎絕頂的人，也常常對金錢充滿了無知；而真正擁有財富並維持財富的人，沒有理由公開他致富的祕密。就算已經在市面上廣傳的方法，也像過了有效期限的藥丸一樣，只是一般的知識罷了。


    解決人生金錢的問題是非常重要的事，如同使靈魂覺醒一樣。若忽視這重要的價值，現實的金錢也會忽視我們。如果認為金錢是世俗的事而置之不理，或者因為害怕而逃避它，那麼所造成的損害必然會影響我們和整個家庭，並延續到我們的下一代，而且一生都擺脫不了勞動的束縛。


    我出生在一個勞工階層的家庭裡，我們在父親為家人不眠不休的工作之下，勉強地度過了不用挨餓的童年。但現在我是一個每年向美國和韓國政府繳納數十億韓元稅金的人，我從一個如同是巴基斯坦偏鄉的勞工，搖身一變成為'
  merge: -1
  img_proc: true
- pgno: 3
  md: '總管世界各地事業的企業家，是哈佛的律師和會計師們引頸期盼的人。那曾經因害怕踏入一碗 6 美元涼麵的韓國餐廳，而放棄推開那餐廳沉重木門的人，如今卻每天賺得一般上班族好幾年的薪水。


    我從貧窮的最底層開始，爬上了幾乎最高的位階，在這過程中，我有機會細細經歷有關金錢的各種屬性。我站在一個視野較深又寬廣的位置上，看見了賺錢的意義，以及金錢如何流動、為何消失、湧向何處，錢在做什麼事、留下什麼痕跡等。


    一定有人比我更具深遠的洞察、思維和邏輯，從白手起家成就了更大的事業，對於金錢的屬性有更精細的理解。但是市面上的書籍，其實大部分都是由於那些從未真正賺過錢的理論家所寫出來的。反而以撰寫這種書籍來賺錢的人更多，真正懂得金錢屬性的資產家，不會願意將那些祕密寫在書裡。


    因為知道這個祕密的人不多，所以我將這件事當作上天賦予我的責任，彷彿冥冥中被命運引領似的。然而，我考慮了好多年才提筆寫這本書。我雖然已經出版過幾本書，但寫作對我來說仍是一項艱難的工作。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '之前曾租用電影院，以「錢的屬性」為主題，向一般大眾公開演講，後來被剪輯成影片供人點閱。因此有許多網路紅人在製作和複製的過程中，使我的原意和目的漸漸走味了。當我想要導正的時候，已經在網絡上流竄，點閱率超過了千萬次。因此，我決定趁現在還來得及的時候，將我要傳達的內容明確地整理成書。


    我不會在此書中深入論述或解釋金錢的哲學和倫理的價值觀，我也沒有那麼大的能力。但我要傳達有關金錢的所有想法、經驗和觀點，因為我敢說我比任何人都擅長賺錢的事，而且又懂得讓錢「黏」在我身邊。


    金錢才能保護我或幫助我所愛的人，它能使我們無須仰賴他人生活。這是金錢極其平凡的價值，但世界對於這平凡的價值，有不平凡的要求。正因為如此，我們無法以平凡的方式擁有豐足的金錢。但願藉著此書我能詳細地道出我對待金錢的方式，並且邀請讀者同享這份喜悅。


    但有一點需要注意的，就是各位讀者雖然接受了本書的價值，但並非所有的人一定都能成為富翁或財務自由的人。但越是年輕的人，如果能認同本書的價值並且實踐，就一定能成為富有的人。還有，任何一個人如果認同此價值觀，'
  merge: -1
  img_proc: true
- pgno: 5
  md: '我堅信必能活出迴然不同的生活。


    我只盼望自己能成為除了宗教之外，在世俗的領域裡，影響各位生活幸福的那個人。本書包含平時我在演講和課堂上所闡述的內容，其中有金錢的五種屬性，以及想成為富翁的人所需要的四種能力。


    金錢的五種屬性是指「金錢具有人格、規律的收入力量、金錢各自不同的品性、金錢的重力、對待別人的金錢態度」。成為富翁所要具備的四種能力則是「賺錢的能力、存錢的能力、維持的能力、使用錢的能力」。還有我強調要以不同的能力來理解這些，並且要以不同的方式學習。


    有些內容是在之前《思想的祕密》、《似懂非懂的事》著作中出現的文章或敘述。雖有重複，但懇求大家的諒解。另外，我努力地為一些不懂經濟術語的人解答，希望能夠容易理解。無論如何，期盼這些內容，對每位讀者在經濟獨立和自主的生活上有所助益。'
  merge: -1
  img_proc: true
