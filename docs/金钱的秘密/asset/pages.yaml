  md: '# 變成投資「體質」


    複利不是你家姑姑的名字，不了解複利的人，就像不認識字就去讀大學一樣。盼望先學認識字再來投資。


    那些習慣不繳清信用卡餘額，延到下個月付利息的人，或習慣以無息分期付款，買一件 5 萬韓元襯衫的人，絕對沒有資格投資。因為沒有利息的概念，也沒有管理收入的能力，更沒有消費的資格。長時間吃劣質的飲食，就要透過斷食來改變體質。因此要剪掉信用卡，使用現金卡，或挨餓幾個月，才能變成投資「體質」。使用信用卡是非常不好的經濟活動。


    通常我們說人耳根子軟，比較帶有可愛的意思。但是耳根子軟的人不只讓自己受害，還會連累家人受苦，也帶給旁邊的人傷害。耳根子軟的人輕易相信別人的話，卻絕對不會聽家人的建議。家人是最沒有利害關係的，彼此給予最單純的忠告，但有人寧願聽計程車司機的建議去投資。如果自己没有主見，就會盲目聽從別人的決定，而承擔責任的卻是自己。在沒有建立好自主權、每件事上都能理性思考、抱持合理的懷疑之前，什麼都不要做，盼望等到太太或先生答應為止。'
