- pgno: 27
  md: '# 財產增值的過程


    要籌集 10 億韓元，首先需要 1 億韓元；又為了籌集這 1 億元而需要 1,000 萬元，而那 1,000 萬元則是從每月存 100 萬元或以上開始。假設我們費了
    100 分的努力，1 年存到了 1,000 萬元，那麼籌集第二個 1,000 萬元所付出的努力會比第一次低。因為已經存到的那 1,000 萬，即可透過利息或投資創造了自己的資本。


    雖然第一個 1,000 萬元是用自己的努力和時間默默實現的，但那 1,000 萬元自己會來幫助我們，所以等於是兩個人一起努力的結果。也就是說，我和資本一起工作創造出其他的資本。所以存第一個
    1,000 萬元所付出的努力值為 95，這數值會隨著存第二、第三個 1,000 萬元而漸漸變小。如果為了存第一個 1,000 萬花了 10 個月，那麼第二個
    1,000 萬元就是 9 個月，然後是 7 個月、5 個月，以此類推遞減。剛開始若以 100 分的努力存了 1,000 萬元，那麼存到 1 億元的最後一個
    1,000 萬元時，只要用 20 或 30 的力量就可以達成。如此幾年後就能存到 1 億元，而那 1 億元會透過同樣的過程，又在幾年之後變成幾億，再過幾年就變成了
    100 億。


    財產增值的過程，不是以 1、2、3、4、5 正整數（自然數）的方式增加，而是以 1、2、4、8、16 的倍數方式。只要了解這一原理，任何人都可以致富。'
