  md: '# 03 對於權威或專家 要常抱持懷疑


    任何人的意見都不能代替我們的決定，

    我們需要自己判斷、學習並做決定。


    我不太相信專家們，對於律師、醫生、會計師、投資專家以及銀行理財顧問等專家的意見或提案，總是抱持懷疑。我也不太在意高層的政治人物、著名的作家、大企業的經營者以及藝人們所說的話。也從未特地去找他們曾經光顧的餐廳等，那個地方不會因為曾經拍過什麼電影，被炫耀出來就變得更美。我是一個比想像中高傲的人，我不知道名人喜歡的美食是否符合我的口味，我去住他們住過的飯店，也不會更提升我的品格。


    他們的聲望或對世界的影響力，對我個人沒有影響。我認為醫生、律師、會計師、投資專家、宗教人士的所有意見，只是一個意見而已。無論用多麼高級的專業術語包裝，我都不會膽怯。我不是認為自己比他們優秀，但也不認為自己比他們差。因為這不是相對的比較。'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 不盲目屈服


    無論多麼偉大的政治人物或著名的藝人，都有需要面對的部分。著名的學者身邊總是有一些與他觀念不同的學者；每小時 1,000 美元的律師周遭，也總是有反駁他意見的對手；經驗豐富的醫生，也有很多與他看法不一的同事。因此我不承認任何絕對權威。


    我就是我自己，我是獨自存在的人，是一個獨立的人格。當我如此尊重自己時，就有了愛自己的尊嚴。這尊嚴使我尊重他人，同時不會盲目屈服任何權威。甚至連我們所愛的父母、尊敬的老師，還有神父、牧師和師父等，都無法超越我們的自由意志，神也不能奪走。因為我的存在不是為了神，而是神的存在讓我幸福。


    在投資方面，銀行職員、證券公司職員、投資專家、前輩，或者世界最高的基金負責人、銀行的行長、政府高層官員等，他們任何人的意見當然也都不能代替我們的決定。我們需要自己判斷、學習並做決定。遇到投資的問題，就詢問買賣時機、前景和商品的這些動作，是低水平的行為，而回答問題的人也是如此。高手是問而不答，唯有「不知道」才是正解；那些覺得說「不知道」會感到不好意思的人，才會隨便亂說一番。


    投資也是一種學習和經驗。實現富有、匯集資本的技術，都是從學習和經驗得來的，而且這些都需要自己去完成。'
  merge: -1
  img_proc: true
- pgno: 161
  md: 聽了別人的意見之後而投資成功的人，也可能因為聽了別人的意見之後破產。讓自己成為大人物，使別人以你為傲。**我們尊重世上有權威的人，但要保持懷疑的態度直到最後。**希望各位能成為制定規則的人，絕對不要被駕馭。自己制定規則，有一天規則就會消失，到那一天自己才會站立得穩。
