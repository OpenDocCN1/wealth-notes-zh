  md: '是津貼支出。保險很難解約，若中途解約本金就會消失的原因就在此。更何況保險公司在支付如此多的津貼同時，為了經營自己的公司，必須將員工的薪資、辦公室租金、廣告費等都包含在保險費內。因此原價
