  md: '# ## 11


    到三星證券


    買三星股票的人


    > 股票市場裡的大成功也像中頭彩一樣，


    如果想證明這不是投機而是投資，


    就要有長時間一點一滴邁向成功的證據。


    大學一年級時，我第一次知道股票這東西。但是我身邊沒有一個人投資股票，我也不知道該去哪裡問、向誰討教。當然也因爲沒有錢，所以根本不知道要有多少錢才能買股票。因此我就直接去了當時的汝矣島證券交易所，因爲我想起偶爾在電視播報證券的新聞中看過股票交易畫面。於是我就對站在厚重玻璃門前的警衛說我要買股票，結果警衛把我撞出去了。


    這是我第一次接觸股票的經驗，我撰寫本文時，心裡想是否仍然有人像我一樣，以爲買股票是到申請上市櫃的證券交易所。但驚訝的是，最近我聽到還有人到三星證券買三星電子股票！原來無知者
    30 年前和 30 年後的今天毫無兩樣。如同以爲買樂天巧克力棒，就要去樂天超市一樣。'
