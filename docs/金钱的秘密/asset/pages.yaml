- pgno: 220
  md: '少」5年，如果把時間不足的資金拿去投資，結果會因急躁連自然的機會也錯過了。只要投資5年內閒置不用的錢，若沒有那種錢，就去創造它，或者就不要投資。


    時間比人類精明。收入不固定的人，最後會動用投資資金。「固定收入」這支援軍；能保護已投資的錢。要從固定收入中，拿出一定的錢作為投資基金。


    好勝心過強的人，微幅漲跌也會讓他為之興奮。如果投資成功，會到處炫耀、請客，因此散盡利潤。如果投資失敗了，有可能變成廢人。想要把投資做好的人，必須要穩健。成功了要穩重，有虧損也一樣的沉穩，投資市場不是體育運動。


    商品和服務會隨著群眾成長和死亡。若沒有利用大眾運輸工具、沒有吃過路邊小吃、沒有去過市場，就不會了解股票市場。一個只開車、只光顧由專用廚師接待的餐廳、只到百貨公司購買日本晴王麝香葡萄
    (Shine Muscat) 和蘋果芒果的人，不能成為成功的投資者。要兩者兼備，即使豐裕仍然要在群眾裡面常常保持自然。


    錢來得快去得也快，快速賺到的錢，也很快就消失。因為想快速賺錢，所以會去追逐耀眼的高風險資產。即使賺到錢，最後也像扔到水裡的棉花糖一樣消失不見。當錢看穿主人的貪婪時，便會離開。那些想要急著賺錢快速致富的人，可能很久以後才會成為有錢人，或者永遠不會致富的機率更高。'
