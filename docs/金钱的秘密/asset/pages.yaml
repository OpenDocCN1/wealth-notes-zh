  md: '提出「股票會上漲嗎？」這種問題的人有兩個缺點，一個是只想儘快創造收入，另一個是不買自己想買的，而是跟著別人買。自己的錢品質不好，也不相信購買的商品，結果是不相信自己，所以無法創造利潤。因此必須記得，若不改變這種習慣，一輩子也無法擁有資本利潤。


    所以做投資的人，不能只是臆測並只確認能否獲得收益的狀態，市場情況再惡化，也要在可應對情況下投資。這是投資的定規。'
