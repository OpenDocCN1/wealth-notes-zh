- pgno: 124
  md: '# ## 13 創造我的獨立紀念日


    > 個人若想要獨立，就必須從其他地方創造收入，而不是從自己的工作。>把自己賺來的所有工作收入節省下來，讓這收入變成資產，就是獨立的開始。


    獨立紀念日、光復節、戰勝紀念日等國家紀念日，都是為了恢復曾被奪走的國家主權而設立的紀念日。我們個人也有屬於自己的紀念日，人生中最重要的一天是生日和結婚紀念日。這些就像開天節*和政府成立的紀念日一樣，又像光復節和獨立紀念日。從人生的角度來看，光復節是一個人離開父母開始獨立生活的日子；而透過財務獨立達到財務自由的日子，就是個人獨立紀念日。


    *註：韓國紀念朝鮮民族的起源。


    6 月 27 日是我個人的獨立紀念日，因為那一天是我的資本收入超過工作收入的日子。我把開始不需要再工作的每一天，當作我個人的獨立紀念日。個人的收入有兩大類，第一類是透'
  merge: -1
  img_proc: true
- pgno: 125
  md: '過自己的勞動或工作而獲得的薪資收入。像上班族、個體工商戶、公務員、專業人士或企業經營者，都必須親自工作才能有收入。自己的工作所得是基本的收入來源，他們為公司、上司、國民、客戶和消費者工作。為某人工作就是將自己的時間和才能提供給別人來創造收入，如果接受服務的人拒絕，我的收入就沒了。因為沒有決定權，所以就沒有主權。


    # 規劃資產的運用政策


    個人若想要獨立，就必須從其他地方創造收入，而不是從自己的工作。把自己賺來的所有工作收入節省下來，讓這收入變成資產，就是獨立運動的開始。如果我現在還沒獨立，所有的收入就要用在創造資產方面。那些將大部分收入用於消費而非資產的人，終身無法達成獨立。將收入累積變成資產，資產又再產生另一資產，當資產規模超越工作收入，那一天就是個人的獨立紀念日。


    為了讓這天提前到來，必須下定決心計畫 5 年、10 年、20 年的資產運用策略來投資，堅決斬斷這一代貧困的鎖鏈。從那天起無論工作與否，都是我的自由，退休或繼續工作都好，因為已經是贏得自由的人了，這一天是自主權生效的日子。


    達到獨立之後，可以稍微奢侈一點也沒關係。每年紀念這一天，預約最好的餐廳或計畫旅行，或為自己買一束花。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '生日是送給生養我們的父母禮物的日子，因為他們把我們生了下來。但是個人獨立紀念日是靠我的努力而達成的日子，所以可以盡情地慶祝。讓家人也要支持你人生中最重要的是個人獨立紀念日，讓他們知道這一天，並得到他們的祝福，而且記得絕對不要再變貧窮，享受正確的財富。


    我們也可以教導子女們這種觀念，幫助他們成長並離開父母，創造自己的光復節和獨立紀念日。我盼望各位能早日迎接個人的獨立紀念日。期待將來有一天，我們公司的花店一天能收到數百籃訂單，上面要寫「慶祝個人獨立紀念日」的賀詞。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 14

    管理金錢的四種能力


    > 蓋一棟房子需要 3 年，但拆毀只需一天。

    一個擁有資產的人無法持守資產的最大原因，是沒有管理那些該去正確投資的資產。


    所有從事經濟活動的人，都會根據金錢的四種能力來增加資產。其中有人只擁有一個能力，也有人擁有全部四個。此能力分為賺錢的能力、存錢的能力、維持的能力及使用的能力。雖然我們稱那些有賺錢能力的人為有錢人，但是有錢人要維持財富，就必須具備這四種能力。只要擁有其中一個能力就能致富，但是無法繼續維持財富。而且這些能力是各自不同的能力，所以必須用不同的方式學習。


    # 賺錢的能力


    有賺錢能力的人很容易被看見，因為這種能力是外顯的。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '具備這種能力的人，大部分都是愛冒險、精通生意、善於推銷、能幹的人。他們屬於樂觀型，不輕易放棄，企業家中有很多是這一型的人。具有專門職業，誠實又聰明的人也有這種能力。尤其在企業家中，有很多此能力特別突出的人。


    但是相對地較缺乏其他的能力，因此反而容易負債、被詐騙，甚至員工貪汙都不知道，在管理財產方面有很多不成熟的地方。這些人最常見說的一句話就是：「我只要出去賺錢就好了」。對於會計或投資細節的問題，以及對財務報表的理解，感到非常吃力，所以經常坐視旁觀。這些人存了很多財產後，一下子就揮霍殆盡了。他們隨便報稅，或者遇到複雜的投資支出問題時，因為不懂也覺得麻煩，於是就相信他人、委託他人管理。


    另外，有些人雖然被許多人詢問該如何賺錢，但有時連他們都沒有認知到自己賺很多錢。因為經常繳完各種費用之後，好像什麼都沒剩，雖賺了很多錢，也不會有感覺。


    # 存錢的能力


    存錢的能力與賺錢的能力是不同的能力，會賺錢並不代表會存錢，因為存錢需要具備調整資產的平衡和管理細微支出的能力。還需要具備對發票處理、物品管理等瑣碎之事，到稅率、利息、投資、匯率等相關的知識和理解，並且還要看重財務分離和支出管理。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '不僅如此，對待金錢的態度要正確。不可隨便對待小錢，要能將大筆的錢送到適當的地方。若隨便對待小錢，周圍的人也會跟著隨便，而應該要放大筆錢出去的時候，卻不能把它放出來，所以周圍的人就離開了。


    當人離開時，也會帶著錢離去。因此存錢的能力因人品而有所差異，需要兼備果斷和寬容。會賺錢但不懂得積蓄，則與無底的甕一樣，不管賺多少錢卻一直漏，總有一天會變成空的甕。


    # # 維持的能力


    維持財富的能力，是懂得賺錢的人有了積蓄金錢的能力後，為守護財富而必須具備的能力，這又是與賺錢或存錢的能力完全不同的能力。持守財富是最艱難的事之一，就像看守城池比攻取更難的道理一樣。這時他們因被眾人譽為資產家，名聲遠播，所以奢華和虛榮也經常在門外侍命。會開始尋找與自己相襯的房屋、車子、美食、朋友、時尚名品等。也是開始認為自己看待金融、政治、經濟的眼光與一般人不同，不再尋求老師，自己當起老師或「大人」的好時機。


    資產瓦解是一瞬間，蓋一棟房子需要 3 年，但拆毀只需一天的功夫。一個擁有資產的人無法持守資產的最大原因是，沒有適當管理那些該拿去正確投資的資產。投資是世界上最困難的事情，而什麼都不做是最糟糕的投資，所以也不能什麼都不'
  merge: -1
  img_proc: true
- pgno: 130
  md: '做。投資是一個不能靠努力取代的領域，需要兼具洞察力和宏觀的眼光，還要有進場和退場的標準。因為城牆可能瞬間倒塌。


    # ## 使用的能力


    最後，使用金錢的能力猶如高超的政治技術，要簡單但不可吝嗇。個人要過簡單的生活，但不能強求家人或周圍的人，也不能強迫員工。「像我這麼有錢的人都如此節儉，你們也要像我一樣啊！」這不能當作教訓，因為彼此的生活價值不同。


    該支付的必須按時付出，不可拖延或遲繳。即便那是給父母的零用錢，也要在既定的日期，像支付員工的薪資一樣準時奉上。如果所僱用的是按日計算薪資的臨時工，就必須當日支付工資。無論是清潔員、維修員、送貨員還是外務員都一樣，需要當日馬上支付。如果我們占用了那些以鐘點賺錢者的時間，就該償還。若忘記與美髮師的預約，或者因遲到而造成他工作不便，那麼即便我們沒有去修剪頭髮也要付費。因為對於美髮師來說，那段時間是不會再回來的資產。如果向律師朋友詢問了意見，不是請他吃一頓飯而已，而是支付諮詢費，因為那名律師朋友完全付得起一頓飯的費用。知識的諮詢費用之所以昂貴，是因他們為了獲得那專業知識，曾投入了大量的時間。若預訂好餐廳卻不能去的時候，不必覺得抱歉，只要付錢就好了。這些都是常識。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '相反的，不要因那無用的權力或虛榮心而到處請人吃飯。不必與那些認為有錢的人就應該請吃飯的人為伍，若聽到這些人對我們辱罵，就當作是補藥。格調或名譽非來自這些地方，對於那些懂得尊重他人之錢的人，可以請他們幾次。想要學習正確用錢的本領，就要懂得接受被罵，總比被我的錢罵我來得好，因為我的錢若罵我，便可能離開我。


    我們要了解這四種能力是不同的能力，並要努力地學習每一種。若忽略其中任何一個，便無法做長久的有錢人，或許能嘗到短暫的致富滋味，但是如果真的變成富有的人，反而會更悲慘。因為曾經擁有過卻被剝奪的傷痛，比從未擁有過的悲傷更大。盼望大家能成為賺很多錢，也能好好地積蓄及持守，正確使用金錢並幸福的有錢人。'
  merge: -1
  img_proc: true
- pgno: 132
