- pgno: 62
  md: '# 16 雞蛋在不同籃子  為何還是破？


    分批購買多檔股票，等於將好幾個籃子放在同一個架子上，那架子最後還是會倒塌啊！


    「不要把雞蛋放在同一個籃子裡」，這是投資格言中最古老、最著名的格言。其實這是出於義大利古老的諺語，有一位美國的譯者，翻譯塞凡提斯的小說《唐吉訶德》時，將「智者為了明天，懂得慎用今天，不會在一天內冒險所有的事」的名言意譯成此格言。之後，因著對分散投資的「投資組合理論」（portfolio
    theory）有所貢獻，獲得 1981 年諾貝爾經濟學獎的詹姆士．托賓（James Tobin），在記者請求他將此理論解釋成一般大眾能理解的語言時，他回答：「要根據風險和收益來分散投資。換句話說，不要把你所有的雞蛋都放在同一個籃子裡。」


    從此之後，「不要把雞蛋放在一個籃子裡」，就變成了投資格言中最有名的一句話。因此塞凡提斯所說的人生哲學——'
  merge: -1
  img_proc: true
- pgno: 63
  md: '「不要在一天內冒險所有的事」，演變為在投資上降低風險的意思。也許這是農夫們從經驗中得到的教訓，就是農夫提著一個裡面裝滿雞蛋的籃子，跨門檻的時候不小心絆倒了，因此全部的雞蛋都破了。


    # 投資最重要的原則


    若分散投資各種項目，就能抵消相互的風險，也會降低危險度，這叫做投資組合（portfolio）效應。避險基金大師達利歐（Ray Dalio）說：「在投資中首先要做的就是有策略的資產分配，以防無法預測的未來。」他指出分散和資產分配是投資最重要的原則。


    但問題出在將整個籃子放在一個架子上；從投資的概念來看，分批購買多檔股票，也等於將好幾個籃子放在同一個架子上，那架子最後還是會倒塌啊！


    假設有一個人，他投資房地產就像投資股票一樣，將全部的財產只投資在公寓、土地、辦公大樓、商業租賃的建物等房地產上，這不能叫做分散投資。因為架子倒塌，那麼公寓、土地、辦公大樓和出租建物等也會跟著一起倒。一般傳統的投資有活存、定存、房地產、股票、債券、即期外匯等，若認為在一個市場裡購買多樣商品，就等於遵行「不要把雞蛋放在一個籃子裡」的格言，那是非常危險的。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 有關十個項目的投資組合


    良好的投資組合可使投資者保持「平常心」，以投資組合理論獲得諾貝爾經濟學獎的哈利・馬可維茲（Harry Markowitz）表示，保持平常心是成功投資最重要的因素。他說他也以
    50 比 50 的比例，分散投資在債券和股票上。根據經濟學家梅爾・史塔曼（Meir Statman）的調查指出，由十個項目組成的投資組合，可以消除 84%
    的突發性風險。


    我將股票分散成十幾個項目，有投資債券、存款和房地產等。也就是將雞蛋放在不同籃子裡，如餐桌、架子、冰箱和書桌上。當然過多的分散也會使利潤分散，所以需要對各個市場有個別的研究。當我匯集資金的時侯是做集中投資，當資產創造資產時，則是做分散投資。也就是派遣出去做攻擊手的資產，就讓它只做攻擊一個傢伙的戰鬥性投資；而做防禦守護者的資產，就將它廣泛分散。若是必須持守的資產，就不能通通放在架子上。慢慢地、一點一滴地賺錢，是最快累積財富的方法。'
  merge: -1
  img_proc: true
