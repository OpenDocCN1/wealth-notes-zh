  md: '想戰勝強者。因為在競爭中已經呈現輸的狀態，所以沒有挑戰的意識，也沒有想挑戰的心志。


    非洲豪豬（體重達13至27公斤，一種類似老鼠的強壯動物）不怕獅子，因為牠沒有輸給獅子的意念。鬣狗也靠著搶奪獅子捕獲的獵物生存，因鬣狗的堅持和不退縮的挑戰，最後獅子只好讓出食物。


    我們的想法改變，才能看見強者是弱者的食物。弱者更容易找出強者沒有看見或不足的部分，並改進和挑戰，完全沒有懼怕強者的理由。我在經營企業的初期，也從不害怕市場上已經存在的巨大競爭者。我們有很多可替代他們的創意，因為我們的公司規模小，所以可以迅速採取行動。我們雖然是小小的商店，卻能夠與擁有3,000個商店的公司競爭，那是因為我們從來不認為自己是微小的。而且我們把這擁有3,000個商店的公司，當作是我們的市場。


    # 下 定 決 心 成 為 強 者


