  md: '# ## 01 戰勝金湯匙


    > 我們只看見他們已經變成強者的樣子，

    所以無法想像他們曾經都是弱者。

    他們擊敗了強者，登上今天這位置。


    我們對歷史有很大的誤解，歷史上充滿了關於強者的故事，其實也是弱者的故事，應該說歷史記載了弱者擊敗強者的事蹟。


    弱者變強者的過程讓人感動又興奮，當弱者擊敗強者時我們心中會湧出欣喜，把自己投射在弱者身上，有種補償作用的滿足感。縱觀實際歷史，有很多弱者擊敗強者的記載，如《三國志》中劉備聯盟孫權，以火攻戰術術伏曹操數十萬大軍的赤壁之戰；由李舜臣將軍率領朝鮮水軍十三艘軍船，在鳴梁擊退日本三百多艘軍船的海戰，這些都是弱者戰勝強者的例子。


    波士頓大學的阿雷奎恩-托夫特（Ivan Arreguin-Toft）教授，曾針對 19 世紀以後，兩百多場強國與弱國的戰爭做過分析。根據其結果顯示，弱小國勝利的比例達
    28%，也就是說將近有三分之一的弱小國得勝。而 1950 年到 1999 年，弱小國的戰勝率則超過了 50%，因為發展出像游擊戰之類的非正規戰術。'
