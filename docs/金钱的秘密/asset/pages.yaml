  md: '逃漏稅。公款、稅款、會費、朋友的錢，以及父母的錢，這些都是別人的錢。


    # 就算是一塊錢也是別人的錢


    我們對待他人金錢的態度，就是對待自己金錢的真實態度。從朋友請客時會點更昂貴的東西，在聚餐時點更多酒的行為中，就顯出一個人看待金錢的標準如何。


