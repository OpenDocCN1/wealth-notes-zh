- pgno: 285
  md: '# # 18 聚財時當農夫，投資時當漁夫


    > 一個有能力的漁夫會根据自己的判斷思考該往哪裡撒網，漁夫不會打電話到水產協會詢問下網的時間和地點。


    許多人相信富翁因為有更高級的資訊，所以站在有利的投資點。也有些人認為富翁們因為錢多，所以他們可以在市場暴跌時，趁著逢低加碼買進，擴增自己的資產。


    但有時錢越多越會造成更大的損失，有錢人和一般人的區別在於決策的方向和速度。他們在財富形成的過程中，做了許多明智的決定，所以站在那位置的機率就很高。有錢人累積財富時像農夫一樣，深入挖掘土地，等待下雨，戰勝乾旱，長期忍耐等候。當他們賺了錢擁有資產時，便像漁夫一樣到處走動，隨著到處沒的魚群調整船頭，並隨著風向和水溫四處撒網。去年在這裡嘗到甜頭，但過了一年又隨著自己的直覺變更方向。


    他們會根據投資資產的變動做出冷靜又快速的決定，他們'
  merge: -1
  img_proc: true
- pgno: 286
  md: '的主觀明確，所以不會受資產管理人或金融公司員工的意見影響。一個有能力的漁夫會根據自己的判斷思考該往哪裡撒網，漁夫不會打電話到水產協會詢問下網的時間和地點。富翁之所以能夠繼繼做富翁，是因為他們在同樣的情況下，發揮了兩個與眾不同的能力。


    首先，不會因為他們是富翁，所以就有一種系統為他們預測或傳達危機，他們只是在平時就準備好應對危機的發生而已。其次，當實際發生危機時，他們雖然沒有更好的應對答案，但是當他們看到答案，便會實際去實行。當一般人在猶豫的時候，他們已經顛覆了市場的情勢等候著。換句話說，他們有卓越的能力化危機為轉機。然而在危機時期，那更多的資訊和資產並不能幫助他們。


    一個不能承受這種危機的富翁，也會往下墜落。富翁也是一種能力，因此經得起危機的人會更加富有。'
