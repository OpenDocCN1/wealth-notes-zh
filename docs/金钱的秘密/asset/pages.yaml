  md: '# ## 16 四分之一法則


    > 比起像巴菲特那樣的極端節制，

    我想更明確地為我的努力訂一個獎勵制度。


    2019 年的春天，我曾與幾個年紀大的老朋友和年輕的新朋友，開車穿越美國旅行。我們搭乘大型 SUV 休旅車從洛杉磯開到紐約，這不是有特別目的地的旅行。但我有一個很想去的地方，那就是華倫·巴菲特先生，位於內布拉斯加州奧馬哈市的住宅。因為我難以置信美國最富有的人之一，所居住的房屋竟然比我的還小，所以我想去親眼目睹一番。


    我聽說過很多有關巴菲特的儉樸和灑脫，但我很想親眼看

    看，他是否真的住在那種房子裡。當我抵達他的住家時，得知

    華倫·巴菲特先生剛開車離開去上班了。他的房子沒有保安設

    施，也沒有警衛，他就住在 62 年前以 301,500 美元購買的自住

    宅。說實話，從巴菲特的投資實績來看，便知道他不買房子的

    理由。他的房子 2020 年時價格為 854,000 美元。如果將這些錢

    放在投資裡，將會達到 136 億美元。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '擁有 900 億美元財產的巴菲特，之前一直使用三星電子在 2010 年下半年推出的 20 美元摺疊式手機，最近才換成 iPhone11。早餐也是在上班的路上，到麥當勞吃「早餐套餐」。他曾在接受美國有線頻道
    HBO 的採訪中說過：「當我感覺財務不是那麼寬裕的時候，會選擇吃便宜的東西。」


    # 平衡儉樸和奢侈的標準


    他比我富有幾萬倍，但我的生活卻比他奢華好幾倍。


    我的家比巴菲特的家貴好幾倍，而且我已經很久沒有在麥當勞吃早餐了。


    我非常尊重又尊敬巴菲特的儉樸。世界首富之一，實際上過著美國中產階級極其平凡的生活，所以不用在圍牆上設置鐵絲網或聘請保全人員。這是最精彩的 parte 之一。


    其他富豪在最高的地方圍築籬笆，在屬於自己的領域裡，享有保全攝影機和警衛的生活；與他們相比巴菲特的偉大無可比擬。


    我雖尊敬他，但是完全不想效法。我雖然沒有非常奢侈，但我另有標準，我稱它為“Quarter”法則。英文 Quarter 的意思是四分之一，就是以與我相同經濟實力或收入水平的人為標準，我的生活水準是他們的四分之一。


    如果我賺 10 萬美元，就要像賺 25,000 美元的人一樣生活；'
  merge: -1
  img_proc: true
- pgno: 280
  md: '若賺 100 萬美元，則就像收入 25 萬美元的人一樣生活；賺 1,000 萬美元，那麼就像一個收入 250 萬美元的人一樣生活。


    四分之一的法則是為了平衡儉樸和奢侈兩者之間的標準，我訂定該標準的理由是為了克服一個危機，就是在不確定每年我的資產是否會增加的情況下若發生問題時，3 年沒有收入還可以生活。另一個理由是當我的收入越多時，我想把增加的那部分作為給自己的補償。因為比起像巴菲特那樣的極端節制，我想更明確地為我的努力訂一個獎勵制度。


    # 富豪的品格


    我的家人已經有很長一段時間可以不用考慮價格，在美國全食超市（Whole Foods Market）購買有機產品。他們可以盡情地買鮮花，並擁有休閒用、家庭用、上班用、野外用汽車。我們住世界上最昂貴的飯店，旅遊時搭商務艙或頭等艙。


    如果明年收入減少，我們會按照四分之一法則，搭乘經濟艙或降低消費，就是自己設定獎勵和限制。我是一個經歷過貧窮的白手起家企業人，若要與那些收入水平與我相同的富豪平起平坐，我相信我的財富必須經過更長的考驗。如果我要像他們一樣購買噴射飛機，並擁有更大的豪宅，我就必須比他們多賺
    4 倍。我認為那才是身為後來移民白手起家的富豪能有的最大奢侈。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '東方哲學說陰陽調和才能呈現完整，我們眼睛看得到的房屋、衣服或汽車等都是屬於陽的部分，而言語、態度和飲食等都是屬於陰，因此對企業家或資產家來說，反而需要有適當格調的奢侈。


    企業家不超出奢侈範圍的穿著、乾淨的汽車、美化的房子等能提高信譽，而合宜的言語、端正的態度、攝取乾淨的飲食等能提升修養，這些都顯露出富豪的品格。如果你是富翁但不想學習巴菲特，那麼盼望跟著我實踐四分之一法則，這是最安全的享受富有之道。'
