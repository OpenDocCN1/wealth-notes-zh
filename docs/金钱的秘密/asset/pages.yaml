- pgno: 46
  md: '# 向具生活洞察力的哲學老師學習


    其實股市是一個可怕的市場，在那裡連運氣都行不通。所謂買賣股票就是買賣公司；而買賣公司的人，在金融和經營的世界裡，是最強大的掠食者。他們為了在投資股票上獲得成功，必須認真下功夫理解所有的經濟術語，並要了解各個公司的運作方式。另外還需要對國家的產業發展過程和政治勢力的運作有全面的知識，擁有人文學的知識之外還需要有信心，以便冷靜地避開許多人的貪婪、欲望、恐懼和挫折等。


    以為去樂天超市才能買到樂天巧克力棒的人，即使在偶然的好時機裡買到了三星電子股票，但因為不知道什麼時候才能实现獲利，所以四處打聽消息後得到微薄的利潤。他會一直不斷地短線進出，因此投入的本金漸漸被吞噬，最後又為了恢復本金，在不合理的項目上投機。


    如果下決心投資股票，期望大家能像經營公司及就讀大學一樣研究 4 年。如果遇到好前輩，便能縮短學習的時間。對身為投資者的我而言，華倫·巴菲特、班傑明·葛拉漢（Benjamin
    Grahm）、霍華·馬克斯（Howard Marks）、安德烈·科斯托蘭尼（André Kostolany）等人物，是具備「長期成功」（在這裡長期的成功非常重要）和生活洞察力的哲學老師。如果大家遇到的前輩是接受這些投資哲學的人，就值得跟他們學習。我不信任那些在投資或事業上秉持「往年的經驗」和「理論」的人，'
  merge: -1
  img_proc: true
- pgno: 47
  md: '我只相信那些長期以來從事投資或事業經營良好，而且現在仍然在賺錢的人（在這裡長期一樣非常重要）。


    成功或卓越的理論，無論那是什麼，都需要長時間證明。所謂長時間，至少是一個世代（30年）以上。不可相信短期成功或有一次輝煌成就的人，也不要相信沒有實際成果的理論家。有一個常常進出賭場的朋友，每次都會贏錢，每次都中頭彩，還向人顯示他兌換現金的收據。但是沒人知道他為了贏得頭彩輸了多少錢。


    # 眼見為憑


    股票市場裡的大成功也像中頭彩一樣，如果想證明這不是投機而是投資，就要有長時間一點一滴邁向成功的證據。一想到有多少老師會對那些到三星證券公司，買三星電子股票的人提供建議，就覺得心寒。其實證券公司的職員也對投資一無所知，他們只是坐在市場的前端罷了，真的就是「坐在椅子上」而已。如果他們很懂投資，就沒有理由在證券公司做如此耗費精神的工作了。最好的證券公司職員，就是回答「我不太清楚」的人。


    隔壁鄰居去釣魚，釣回來的魚越來越大隻。剛開始他炫耀釣到手掌大小的魚，後來他說釣到如手臂一般長的魚。過了'
  merge: -1
  img_proc: true
- pgno: 48
  md: '幾年，他張開雙手比，誇耀自己釣到的魚有多長。現在這位已具知名度的職業級釣魚高手，不再張開雙手比了，他只伸開拇指和食指，吹噓著抓到這麼大的魚。


    「好像不是很大啊？」我的話還沒說完，他立刻說：


    「哦，那只是魚的兩眼距離。」我從未見過他釣到的魚，但是那條魚就這樣「長大了」。


    因此我建議初學者，**在沒有親眼看到之前，請不要輕易相信**。'
