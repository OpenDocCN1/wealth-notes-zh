- pgno: 93
  md: '若非這三種情況，就沒有理由必須參與，也不想參與。因此與事業規模相比，我擁有相當多的自由。然而我太太對我的觀察是，我說好要在安息日時歇息不工作，但我還是一天到晚工作。於是我仔細地記錄了我所做的事。


    # 我所做的事


    首先，早上起牀確認我的信箱。我有四個信箱，如果都是工作上的請求或結算，我要立即做決定。不需要的郵件或廣告則立刻刪除，我不喜歡看到信箱像書桌或抽屜一樣凌亂。所有的信件讀完之後，我都當場刪除或立刻回覆。我的學生或粉絲們的信件則收集起來，每一兩個月回覆一次。若不立刻處理這些信件，又會有信件進來，最後會變成像網路聊天一樣，造成我的負擔，這是我從處理信件中得到的智慧。


    確認信件之後，便進入網站按照順序瀏覽新聞，其實這順序沒什麼意義，只是隨著視野的擴展，就變成一種習慣了。瀏覽的順序大致如下：首先從《紐約時報》開始，其次是《華盛頓郵報》、《華爾街日報》、CNN
    和 Fox News 等美國主要新聞和新聞頻道；再來就是透過英國的《金融時報》、《泰晤士報》、《路透通訊社》，以及《EIN 世界新聞報導》（EIN World
    News Report）瀏覽俄羅斯消息；又轉到日本的《朝日新聞》、《讀賣新聞》和《日本經濟日報》瀏覽，最後瀏覽一遍'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Yahoo Japan 網頁。再從日本出來去瀏覽中國的《環球時報》和《人民日報》之後，有時也去翻闖中東的《約旦時報》，又到歐洲瀏覽一遍法國的《世界報》和《費加洛報》，再看看德國的《明鏡周刊》、《世界報》、《法蘭克福匯報》。


    # 每天要瀏覽的世界


    如此環繞世界一圈回來，再看休斯頓地區的《休斯頓紀事報》之後，再看幾家韓國的新聞；這是我每天瀏覽的世界。每當觀看這些新聞時，總是努力地瀏覽一個以上的相關報導，因為每一家新聞報導都有自己的論調或政治傾向，所以看事實的角度不同，所關心的也不一样，如果只關注一個地方可能會太偏頗。近來因
    Google 或 Papago 的翻譯都很通順，所以不管哪一種語言，都可以透過翻譯來了解其中大致的內容。按順序瀏覽全世界的新聞消息之後，就轉移到經濟網站。


    我沒有按順序瀏覽經濟網站，因為中途若出現一些消息是有關我所投資的公司或持有股份的公司時，就需要到處尋找相關消息。最先要去的地方是雅虎財經（Yahoo Finance），這裡有許多一般的投資資訊，是雅虎最受歡迎的其中之一。我會收看
    CNBC（消費者新聞與商業頻道）、Bloomberg（彭博社）、Market Screener（市場篩選），確認隱藏在 CNN business 的 Fear
    & Greed Index（恐懼與貪婪指數），瀏覽美元指數走勢'
