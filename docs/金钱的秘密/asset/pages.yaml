    人已在進行了。


    最近調查小學到國高中生將來的夢想，結果是偶像、社群

    媒體網紅、地主、運動員等職業。高年級的學生較偏向老師、

    教授、公務員等穩定的職業；而這些夢想的目的就是高收入或

