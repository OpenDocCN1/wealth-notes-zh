  md: '這樣的人不僅不會投資，連投機都不會，他們只是在扮演支付證券商手續費或增加交易量的角色而已，或者眼看著存摺裡的錢如冰淇淋一樣地融化了。而且這些積蓄的錢當中，有些是下個月要繳的大學學費或明年的結婚資金等。若用借來的錢做股票，甚至用兩三倍的槓桿原理來購買商品，那簡直就是與身後藏著刀子的勒索犯一起工作。若參雜了這些錢，最後連本來可以用來投資的錢也受到影響。


    # 股票明天會上漲嗎？


    猶如在一箱地瓜裡，只要有一顆爛地瓜，就會散發出惡臭，然後開始擔心整箱的地瓜一樣。因此就會向周圍自稱專家的人討教：「在支撐線上是否會有技術性反彈？明天股票會上漲嗎？」等類似愚蠢的問題，又聽取愚蠢的回覆，因為太心急
    了。


    以這種方式應對股市的人，絕對無法從股票中賺到錢。即便偶然賺到了錢，那筆錢也會再次流入股市，最終與本金一起消失無影。股市對於將它當成賭場的人，會給予冷酷的懲罰，並没收他們的財產。在股票市場上，清楚知道股票和股票交易來龍去脈的人，才能夠長期賺錢，他們是非常了解市場功能的人。發行股票的理由是，成立公司的人無法自己一個人募集所需要的資金，必須靠許多人共同募集，而股票是按照那投資金額分配的保證書。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '起初該證書只是單純制定分配價值的紙張而已，但中間會出現一些人想買賣該紙張上面所記載的權利。隨著買賣的人增加，為了讓大家在一個地方和指定的時間交易，而設立了證券交易所（第一家證券交易所：阿姆斯特丹證券交易所，1602年由荷蘭東印度公司設立／Verenigde
    Oostindische Compagnie, VOC*）。就是以共同投資來創立公司，並獲得股票分配，對公司抱有不同期望的人，在這期間買賣該權利。


    *註：在阿姆斯特丹建立。目的是在印有 VOC 標誌的股票和債券上交易。


    # 成功投資者的三個主要特徵


    投資股票成功的人，具有三個主要特徵。


    第一，他們將自己當作經營者。認為這是與別人一同集資所成立的公司，所以想仔細了解公司的本質。他們非常了解那是什麼樣的公司、會做什麼、又如何經營等。會密切查看會計帳簿和年度報告書，並懷著與經營者相同的心態，來了解公司在市場上的角色。他們把公司當作自己的存在腦海裡，不會被別人的評價或憂慮動搖。


    如果我是經營公司的老闆，就不會聽信周圍人的謠言或專家的意見，賣掉自己的公司或放棄經營，我們在投資上也應該有同樣的態度。買進時相信自己的判斷，要抽離也是根據自己的判斷，不會隨著股價的變動而來回徘徊，因為他們知道水果要成熟是需要時間的。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '第二，他們保有的金錢是優質的。成功人士的資金堅如磐石，這筆錢不會盤算立即的去向，長久安然地留在原位。這些錢聚集在一起，只打算一輩子扎根安居，並且只提供叫做「分紅」的餐食。當然也具有強大的凝聚力，不被欺生或威脅而屈服。有時那些錢還會在它自己的位子上當起主人，直到產生利潤止，總是懂得悠然等候。


    第三，會等待時機便宜買進。一個真正的投資者，不是清楚賣出的時機，而是買進的時機。買的時候便宜買進，賣出就更加容易了。能便宜買進很難，更何況是低點買進好股票。所以在選擇一個將會大獲成功但還在成長的公司時，必須要有長久忍耐等候的勇氣；而且要有勇氣在恐懼當中買進股價一下子暴跌的股票。當恐懼蔓延時，再續優的股票也能以低價買進。對他們而言，暴跌或蕭條反而是一種好景氣。這樣的投資人一生都會從股市中獲得美好的果實。


    仔細想想，幾乎世界上所有的企業，都是以股份公司的型態運作，並年年成長。但為什麼大家將股票市場視為合法的賭場，或者是一場零和賽局呢？如果你之前在股市中只有賠錢，也沒嘗到什麼甜頭時，則請先自我審查一番，以上成功人士的三個特徵當中，是否有任何一個特徵符合自己。我想應該沒有。這樣的人即便與成功人士一樣，以同樣的價格買進同樣的股票，結果還是會賠錢。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '真正的投資者，不會勸自己的親戚或朋友投資，或者給他們建議，因為他們知道反正退場的時候不會一起出來。


    總之，完全以自己的資本、相信自己的人，才能在股票投資的市場中獲得成果。'
