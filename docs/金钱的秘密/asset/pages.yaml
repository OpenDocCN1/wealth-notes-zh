- pgno: 291
  md: '# ## 結語


    寫書對我而言仍然是一項最困難的事。這段時間透過老闆學概論課程，教導三千多名企業家的過程中，常常覺得各種金錢的問題是最實際的苦惱。我看見這些問題不僅針對實際經營事業的人，也關乎所有的人。所以這本書的內容不只針對經營者，是關乎所有的人，特別是準備踏入社會生活的年輕人。


    2020年是我安息度假的一年，我打算停止所有的演講和課程，到世界各地旅行、閱讀書籍等。但是自3月起，由於新冠病毒影響了整個世界，所以只能留在家裡，就這樣不知不覺將稿子寫完了。


    我要特別感謝我的姪女朴智英，她不分日夜地幫助我調查資料和校對。也感謝我的學生金賢真，每次都跟著我的演講或課程，協助我抄錄內容。也許從專家的立場來看，我所描述的經濟術語、理論、數字等都不夠專業。請將我當作一個投資者，而非經濟學家，並且對於我所敘述的內容敬請見諒。


    如果這本書能帶給更多人經濟自由的機會和方法，我將倍感榮幸。


    金勝錫 2020年4月19日'
