  md: '# 03 大富翁

    是上天註定？


    > 改名字的用意是堅決以全新的身分生活，

    並不表示新的名字會帶來另一個人生。


    某個場合有人提出了這樣的問題：「小富由勤，大富由天。這句話是出於《明心寶鑑》，我想聽聽您是否同意。」對於此問題，我表示同意。但是我要補充一點。如果那問題裡包含
    了「那麼富翁是註定的嗎？」我的回答是「不」。不是因為我 認為富翁是已註定的，所以我同意《明心寶鑑》裡的那句話， 而是我認為不是註定的，所以才同意。


    因勤勉而成為富翁這道理確實正確，但是大富翁不是接受 天命、由上天揀選的。我幾經失敗後，靠著一次成功走到今天。 我有很多經歷，並且以自稱（或別人稱我）老師的角色，向數
    千名企業家傳授企業之道。這樣的我如果再次失敗，還能從一 無所有回到這位置嗎？'
  merge: -1
  img_proc: true
- pgno: 239
  md: '不！我可以憑著我的勤奮和觀察事業的眼光，做一個小富翁，但再往上我就沒有任何把握了。有一次事業成功的人，能再次在另一個事業上成功的比例並不高。如果富翁是上天註定的人，那麼他隨便都可以再度變富翁，他有這樣的命運。反過來說，如果大富翁是由天註定的人，那麼不是被天意命定的人，無論怎麼努力也不會成為大富翁。


    相信這種宿命論的人，會解析財闊的生辰八字、改名字，非常迷信。改名字的用意是堅決以全新的身分生活，並不表示新的名字會帶來另一個人生。如果改名字就可改變人生，我想世界上的名字應該都很相似。


    一個人能成為富翁，並不是因為他有特別的命运，只是具有成為富翁的環境而已。就是努力、誠實和勤奮的致富要素，有了這些要素，剛好有一天就成了真正的富翁。


    我在事業上成功也是因為運氣，當我開始這事業並擴張的時期，我剛好在那城市，所以我說這不是實力而是運氣。如果那是實力，就表示我是一個厲害的人物，無論何時何地都能成功。但我不是那樣的人，我只有一個比别人厲害的地方，就是我非常明白那是運氣。這就是我們應該常常為自己所擁有的財富感恩、謙卑的基本原因。'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# ## 04 想創業的年輕人

    先去小公司吧！


    > 當你知道自己擅長此工作時，

    > 便隨時可能自己創業，因為這期間所累積的

    > 資金和經驗，將會消除創業的困難。


    沒有資本或創意也可以創業。創業是容易致富的方法，也是最困難的方法。任何人都可以創業，但是成功率很低。有三分之一的創業公司存活 5 年以上，而中小企業是能降低創業失敗、匯集資本、接受經營管理訓練的地方。


    大型企業因規模較大，所以能處理的業務有限。如果你是下定決心一定要創業的年輕人，我希望你選擇進入小公司學習今後想要從事職業。最好是有三到四名員工、有自己的職責但比較沒有劃分工作領域的小公司。因為你可以隨著公司的成長學到很多東西，如果失敗也是老闆的責任。


    無論你的興趣是資訊、傳播、製造業，只要進入小型公司'
  merge: -1
  img_proc: true
- pgno: 241
  md: '就可以接觸所有，等於一邊領薪水一邊學習事業。而且因為是小公司，所以你可以觀察各樣業務的運轉情形。把工作當作自己的事來努力，雖然年紀輕，也能很快被升遷。若公司成長順利，還有可能直接成為管理者，反而比大企業得到更好的待遇，也比較有工作成就感。如果希望有高薪和優渥的福利，那麼立刻進入大企業是比較好，但你將一輩子過領薪階級的生活。


    # 學習創業的祕密


    一個身無分文的年輕人，也可以在幾年之內開一家咖啡店。接下來我就要透露這個祕密。首先進入一家在社區當中生意興隆的咖啡廳，那些地方常常有打工兼差的職缺。進去上班之後積極地學習，像做老闆一樣認真地努力工作，把自己當作老闆，主動觀察、包攬所有事務。甚至熱愛工作到一個程度，讓顧客們因為你而更喜歡光顧。最後你會做到經理的位置，接下來是策劃取代老闆。成為經理，提高銷售業績，管理員工順暢，創造一個不需要老闆的狀態。


    那麼老闆將會採取兩個行動，有的老闆會到處遊玩，有的老闆則想再開一家店。從這一刻起，你將成為像老闆一樣擁有決定權的人。老闆會害怕你辭職不幹，所以他不敢再去打室內高爾夫球，因為沒有管理第二間商店的人。我不是教大家用威脅的方式，我的意思是或許你有機會用分期付款的方式收購一'
  merge: -1
  img_proc: true
- pgno: 242
  md: '間店。因著你的熱情和能力，有機會成為老闆的合夥人。就是像這樣透過一邊領薪水，一邊學習工作和經營事業。而且當你知道自己擅長此工作時，便隨時可能自己創業，因為這期間所累積的資金和經驗，將會消除創業的困難。


    我若重來還是會選擇創業，即使現在失敗，還是會創業。如果我的兒子要創業我會很開心，因為唯有透過創業成功，才是最快從土湯匙白手起家的捷徑和唯一之路。我想自己僱用自己，並隨心所欲盡情地給自己薪水。我絲毫沒有想進入大企業，在那裡得到肯定來度過我人生的念頭。我想自己肯定自己，掌握自己的人生。


    我喜歡挑戰，喜歡隨心所欲地工作，渴望看到我的創意實現。年輕的創業家進入小公司，在那裡累積經營公司的經驗後，到三十多歲再創業也不嫌晚。二十多歲在公司學習，三十多歲創業，四十歲繁榮發達，五十多歲讓給接班人，六十多歲從職場退下來享受生活，這就是最好的人生。'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# # 05 持續和學習


    > 人生是認真的生活才能勉強站穩，

    若偶而有時間才做，不知不覺幸運就來臨了，

    那麼我認為這幸運不是幸運，而是不幸。


    每當我想改變某種事物，或者有一個強烈的願望時，我會

    有持續 100 天的習慣。持續 100 天積極地努力，就會發生改變，

    我的目的是證明自己做得到。


    《中庸》裡面「能久」的「久」這字是持續（duration）的

    意思，具體的期限是 3 個月。孔子的教訓是任何一件事只要持

    續 3 個月不斷地做，就能改變其本質。這是我從橋杙老師（金

    容沃教授）那裡聽到的，後來我才明白這概念來自於非常古老

    的教誨。


    中文的「功夫」英文翻譯為“to study”，其實是鍛鍊身體的

    意思。我相信 3 個月持續不斷鍛鍊身體的人，能改變任何事。

    生活中最重要的事情之一，就是持續地實踐。


    若有人想改變自己，我建議持續 3 個月。想成功節食，就'
  merge: -1
  img_proc: true
- pgno: 244
  md: '要試試持續 3 個月下午 5 點以後不再進食。想戒菸就忍耐 3 個月。想要鍛鍊胸肌就要做 3 個月的伏地挺身。想學習股票，就花 3 個月看遍數百個 YouTube
    相關影片，融会貫通所有相關書籍。無論那是什麼，若想達到專家的水準，就要花 3 個月的時間努力。3 個月是最好的時間，能改變一個人的身體、心靈和想法。想要改善自己的生活，最好在固定期間付出實際的努力，在這樣的過程中正確地養成習慣。弘揚健康被稱為傳道人
    Arnold 洪教練，數年來一直以「100 天的承諾」標語，幫助一般大眾為了健康而改變習慣。他的信念就是鼓勵大家持續運動 100 天，改變自己的人生。


    具體而言，那些不嘗試任何動作的人，就別妄想下個月或明年自然就會產生另一種生活。賺錢和投資的事，也需要付出努力、學習和研究的代價。人生是認真地生活才能勉強站穩，若偶爾有時間才做，不知不覺幸運就來臨了，那麼我認為這幸運不是幸運，而是不幸。


    若非經由努力而得的幸運，總有一天會被奪走。不管是什麼，都持續努力地實踐，雖然困難也要堅持 100 天。若覺得 100 天很難，那就做 3 個月。這道理吸引你嗎？希望你能被吸引。'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 06 能做的事業無止境


    從一個小小的疑問而開始的挑戰，

    有機會變成傑出的事業，

    可開發的新事業依舊無止境……


    有些人想做事業，但真要做的时候，卻覺得沒有什麼可做的。我的記事本裡記錄著數十個可行的事業，其中大部分都不需要太多的資本。那些我認為平常生活裡需要改善的事物，後來全都變成了我做生意的靈感，所以「沒什麼可做的事業」這想法並不屬實。


    看起來這世上所有必要存在的事業已經達到飽和了，但我的想法正相反，還有很多可發展的新事業。既有的事業者經營不佳，或者已經經營失敗的事業，都會是絕佳的新事業。我所記錄的就是這種，我要把它公開，幫助大家看見我如何尋找新的事業項目。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '有一次我和晚輩們一起去日本的銚子市旅遊，從銚子市可以眺望太平洋。每天早晨我沿著海灘散步，看見海邊到處都是漂流木。我平時就有用木頭製作桌子的愛好，所以當我看到那些被海水浸泡後變堅硬的樹木，便激起我想擁有它的欲望。


    也許這些是從世界某個地方，被颶風吹斷的樹木，在太平洋上漂來漂去後漂到了這裡。一個有才幹的木匠能利用這些樹木製作成精美的家具，並且可以為這家家具的品牌命名：「你來自哪裡？」為品牌創造一個故事：在異國某海邊成長的一棵樹，最後被製造成家具。在悠閒地清理散落在沙灘上的木頭時，就可以生出故事。也可以藉著再生、環境保護等議題，創造與現代產業倫理相融合的家具公司。


    # 看見創造事業的機會


    最近男性們也很會化妝，或許也可以開創男性化粧品專賣店。因為很多男性覺得不方便到女性商店選擇用品，而且男性用品種類也越來越多。這些都是可以考慮嘗試的創意，但很多時候我們比較習慣只是當作一個構想而已。平時我若看見產業漏洞等問題，會把它記下來，也實際地嘗試實現它。


    其中一個就是花店。在美國即便不是特別的日子，大家平常也會買很多花。超市最前面就擺滿了花，那些不是送禮用的，'
  merge: -1
  img_proc: true
- pgno: 247
  md: '所以可以在購物時隨手拿一束，也不用包裝就放入購物車裡。

    但是我發現韓國花店很少，只有在市區地下室的主角裡，貼著一張「鮮花配送」的標示。商店前後的舊花盆上，有一些既沒枯死也賣不掉的植物。


    我住在飯店的時候，偶爾也會買些花放在房間裡，但是在韓國買花非常不方便。我做了一番調查後發現，韓國的花卉市場是以婚喪喜慶為主。80%的鮮花銷售到婚喪喜慶的市場，個人消費市場不到20%，像我這樣即興式購買鮮花的人不到1.5%。與美國完全相反，在美國個人消費市場是80%。於是我決定在韓國開花店。我真的很納悶是韓國人不買花，還是市場流通有問題。在預備開設商店的過程中，我完全站在消費者的立場來看所有觀點。例如將冰箱設計成開放式的，讓消費者可以隨意觸摸花朵，上面標示的銷售價格也訂在消費者容易接受的範圍內。身為零售商店首次在「農水產物貿易振興中心」（aT
    Center）拿到了拍賣權。若有好的進口產品就直接進口，也可以一朵一朵的銷售。我開店至今約有兩年，在首爾已經擴展了12間花店。除了如花般的青少年之外，如今所有的年齡層，不分男女老少，像到便利商店一樣，隨時都可以進來買鮮花。


    原來韓國人不是不喜歡花，而是韓國流通市場的問題。因為他們的經營方式，讓像我一樣想要買花的人無處尋得。現在韓國SNOWFOX FLOWERS的總銷售額，達到全國零售商店第一名。'
  merge: -1
  img_proc: true
- pgno: 248
  md: '預估在首爾市中心，就可以開設三百多家，是可以上市的典範。從一個小小的疑問而開始的挑戰，卻達成了傑出的事業。


    認為沒有什麼事業可做的人，是缺乏發掘創意的眼光。可開發的新事業仍舊無止境，如果你還是找不到，建議你去參加所有的國際展覽會，只要展覽會名稱前面有「國際」兩個字就去參觀。裡面一定有一些剛起步的公司，或者因租不起昂貴的攤位，老闆一個人守在角落裡的外國公司。若能拿到韓國的代理銷售權，或改善一些構想，就是新的事業了。可行的事業毫無盡頭，希望充滿野心的創業家們能睜大眼睛。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 07


    企業家


    是自由的職業


    擁有最高學歷的人，


    夜以繼日努力讀書的目的，真的就只是為了


    求得這樣的工作嗎？人生只有一次，


    我堅信一定有能讓自己成為禮物的一條路。


    我不相信年輕人的夢想是進入大公司工作，我為他們為了做公務員而拚命讀書感到難過。


    在大企業最大的成功，就是成為高階主管。大企業的高階主管是有薪階級的一顆星。根據韓國經營者總協會的一項調查，摘這顆星的機率為 0.7%，每 1,000 名當中，只有
    7 個人能成為高階主管。進入公司後，平均需要 18 年才能晉升為經理，而晉升到高階主管平均则需要經過 22 年。1,000 名大學畢業生進入公司後，被提升為經理的只有
    24 人，成為高階主管是 7 人。按照這項調查，2.4% 的人被晉升為經理，那麼其餘 97.6% 的人，不但沒有成為經理還被解僱，到那時年紀已經是四十多歲了，而且高階主管的晉升率每年都在下降。'
  merge: -1
  img_proc: true
- pgno: 250
  md: '有一次總領事館邀請休斯頓地區分公司的代表出席。他們大部分都是與韓國煉油產業有關的子公司總經理，也是由韓國總部位命的高階主管。令我驚訝的是，他們一邊輕鬆地談論數萬億韓元的計畫案，但是在私下交談時，卻擔心回去後退休的生活。


    # 大企業將奪走你的夢想？


    結論是即便成為高階主管，也不過就是領薪階級。很多人憂心忡忡，擔心任期結束後回國是否還有其他職位，又煩惱退休之後孩子的學費和汽車等費用著落。那數萬億、數千億韓元都不是他們的錢。


    我只能說那些想進入大企業的青年們，可能根本不知道這事實。如果他们知道，怎麼會把人生投在挑戰這 0.7% 的成功率上，然後等 50 歲退休之後為車子和學費擔憂呢？擁有最高學歷的人，夜以繼日努力讀書的目的，真的就只是為了求得這樣的工作嗎？真讓我匪夷所思。


    大企業不再是夢想的地方，而是奪走夢想的地方。真的想一輩子靠著賣自己的時間來賺錢過日子嗎？事實上，我說「一輩子」也不對。也許你會被要求在 50 歲之前提前退休，從那以後沒有人願意再花錢買你的時間。但是你還要活幾十年，那把'
  merge: -1
  img_proc: true
- pgno: 251
  md: '年記還能重新開始嗎？這真是你人生的目標嗎？為什麼你不會想成為資本家或企業家呢？是害怕失敗嗎？創業成功的機率比成為高級主管的機率高 42 倍。如果是因為沒有創業資金，難道這世界上所有的創業者，都是抱著資本誕生的嗎？創業本來就是從小規模開始。企業家的創業精神是願意去挑戰，即使只有
    10% 的成功率。聽說 90% 的人會失敗，因此害怕而猶豫嗎？那麼我要再次提醒你，即便你成為 0.7% 的那顆星，到了 50 歲還是得退休。


    就算經營事業失敗的機率為 90% 是事實，但是爬不到高階主管位置的機率，比事業失敗的機率高達 14 倍以上。你會想跳進這種低效率的競爭中嗎？你不想和昨天的自己競爭嗎？不想成為自己生命的主宰嗎？或許你已經進入職場，或者職業是醫生、律師也沒關係，如果有機會就去創業。即便是醫生你也可以夢想自己是一個擁有醫生執照的經營者，或是擁有律師執照的經營者。誰都可以成為企業家，也可以成為資本家。僅此一生，千萬不要以進入大企業為人生的目標。要常常勇於挑戰，逃脫框架。盼望各位能為自己做夢，夢想自己給自己薪水，終身僱用自己，甚至將時間歸還給自己。


    企業家是唯一可以把自己當作禮物送給自己的職業。人生只有一次，我堅信一定有能讓自己成為禮物的一條路。願各位的希望和夢想都能戰勝恐懼。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# 08 每筆錢

    都有不同的品性


    > 有堅定的生活哲學，才能匯集優質的錢。

    只要錢的主人下決心積存優質的錢，

    那麼錢會自動黏在主人身邊。


    每一分錢會隨著產生的過程，具有不同的個性。每筆錢都有性格傾向和氣質，所以有很固執的錢，有非常大膽的錢，也有些軟弱無力的錢。有些錢喜歡待在家裡，有些錢出去後永遠不會回來。正如出於同一個父母的兒女，他們的喜好和性格也都不同，而金錢也一樣。


    同樣的1,000萬韓元，靠著粗重勞動賺的錢、從投資股票賺的錢、從賭場賺的錢、從儲蓄生出來的利息錢，絕對不同。因為每筆錢都不一樣，所以有些錢死黏著主人，無法發揮錢的價值；有些錢很容易消失，有些錢會引來其他的錢，甚至有些錢會帶走周邊的錢。因為錢隨著產生的方式，而長出性格和傾向。


    因此賺錢的時候，要盡可能賺品質好的錢。所謂品質最好'
  merge: -1
  img_proc: true
- pgno: 253
  md: '的錢，當然是以正當的方法一點一滴積蓄的錢。如透過薪資收入、合理的投資或正當的事業所賺的收入。


    # 營造讓錢黏住你的環境


    透過自己的創意和勞動賺來的錢，等於是把自己人生唯一的資產──時間給了別人再換得錢，所以特別珍惜又驕傲，比其他的錢更珍貴，會像對待孫子孫女般那樣的寶貴。若不隨便亂用這些錢，讓它變成資產，透過投資或儲蓄就能不斷地產生利息。


    相反的，與這些寶貴的錢相比，如一擲千金似的從賭場贏來的錢，會在下一個賭場裡將其他剩餘的錢帶走；用詐騙而得的錢，會花在奢侈和放蕩的生活上，最後毀滅人生。以類似投機的方式投資，或者以急於致富的心態，盲目地利用槓桿原理，靠運氣賺得的錢，也會用在向人炫耀的地方，最後這些錢一口氣會帶著所有的錢一起離家出走。有時候劣質的錢會傷害主人，也會毀掉他的家人。


    有堅定的生活哲學，才能匯集優質的錢。只要錢的主人下定決心積存優質的錢，那麼錢會自動黏在主人身邊。因為不貪婪，所以不會受騙；因為行為端正，所以不會把錢浪費在虛浮、飲酒作樂的場合上；因為不圖不勞而獲，所以不會有丟臉的事；'
  merge: -1
  img_proc: true
- pgno: 254
  md: '因為不圖公家的錢，所以不會卑躬屈膝。這樣的人身邊的機會變得更多，也有很多運氣跟著他。會湧進很多品質好的資產，也不會傷害他的家人，反而讓家人彼此凝聚。就算靠幸運所得的資產，只要與好品格的錢混在一起，也會變成好品格的錢。


    彷彿生長在不同環境的年輕人，進入軍校學習紀律和校風，成為具有相同價值觀和規範的夥伴，最後成為軍官一樣。我們都知道交朋友的時候要慎選，而存錢也要如此。這樣積蓄的錢越多越好，它會堅定地守護你和你的家人，不會分散。而且會長久留在你身邊守護你的人生，讓你享受人生，成為一個受人尊重的富翁。


    # 銅板是金錢的種子


    在某一個曼哈頓下雨的夏天，吃完晚餐後，我和家人一起到梅西百貨公司，它坐落在 34 街，有一百年多年的歷史，像遺蹟一樣佇立著。百貨公司正門的地板上有一塊銅版，上面記錄了該公司的歷史。我正想著有多少資本、財貨及有錢人踩著那銅版穿過了這道門。這時有一個看起來約
    40 歲的乞丐坐在銅版前，淋著毛毛細雨，向路過的人投以乞求同情的眼神。我看到他寫在紙上的求助內容，我想他應該是受過相當教育的人。


    夜已深，我想他可能沒有吃晚餐，於是我們將口袋裡不多的'
  merge: -1
  img_proc: true
- pgno: 255
  md: '現金放進他面前的杯子裡，然後我又回來站在屋簷下。有幾個人從口袋裡拿出硬幣丟給他，接著有一個更慷慨的印度女人給了他一張金額不小的紙鈔。這時可能他才有足夠吃晚餐的錢，於是開始收拾他簡陋的行李。最後他看了看杯子，並從眾人給的硬幣中挑出幾個硬幣扔在街道上。後來他可能怕雨水淋濕了求助牌，便把它夾在背包和後背之間，消失在雨中。


    地板上躺著他所丟的 3 個一分錢（約 11 韓元），之後有很多人踩著銅板經過，但沒人注意那幾個硬幣。我淋著雨向前走了幾步，用手撿起 3 個淋濕的硬幣放在手上。其實在美國
    3 分錢買不到任何東西，但我知道不看重小錢的人，也無法管理大筆的金錢，所以我像撿寶石一樣把它撿了起來。這時結束購物的妻子和兒子，拎著兩雙超過兩萬美分的運動鞋走了出來。我玩弄著右邊口袋裡的
    3 個硬幣，一邊自言自語地說：「這些銅板是金錢的種子」，一邊跟著兩人走回家。


    人不太了解一個事實，就是小錢能讓人變富翁，大錢能讓人變貧窮。或許那曼哈頓街上的乞丐，10 年前比我富有。也許是在曼哈頓的金融街，從事管理大筆資金的工作，後來因發生失誤而破產了。或者因輕視小錢，只顧追逐大錢，而導致今天的結果。在這過程中，那歷經無數次失敗的東方貧窮移民小子卻變成了有錢人，在曼哈頓第
    5 街買了一戶有陽臺的房子，作為週末偶爾來度假的地方。我的意思是因為珍惜小錢，所以大筆錢也跟著來。'
