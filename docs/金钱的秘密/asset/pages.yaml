  md: '# 05 金錢具有重力


    > 錢具有拉動身邊其他金錢的能力，

    並對周圍的金錢產生影響。

    如果能以重力一樣的作用原理善加利用金錢，

    任何人都能把最少的錢變成大筆財產。


    重力是現代物理學的相互作用力量之一。根據牛頓之說：「重力對一切具有質量的物體產生作用。」重力是指具有質量的物體，影響其他質量物體的力量。其力量的大小與各物體的質量成正比，能拉動附近的物體，並達到最遠的距離。它與距離的平方成反比，所以距離越遠力量越弱，但在很遠的距離仍然有作用。


    我們生活在地球上，感受不到重力巨大的力量。但太空船必須以每小時 4 萬公里的速度飛行，才能脫離地球的引力圈。重力的力量能將宇宙飛行的流星帶到地球上。因為地球比月亮重，所以具有更強的重力；而太陽比地球更大、更重，所以其重力的影響更遠。我們用肉眼極限能看到的該影響力只有太陽系。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '神奇的是，金錢也具有這重力一樣的作用。錢會影響其他的錢，那筆錢的金額越大，對其他錢的影響就越大。錢具有拉動身邊其他金錢的能力，並對周圍的金錢產生影響。如果能以重力一樣的作用原理善加利用金錢，任何人都能把最少的錢變成大筆財產。


    # 了解錢的重力


    如同長達 6,679 公里，河口寬 240 公里，每秒有 20 萬 9,000 立方米的水流入大海的亞馬遜河，也是從祕魯南部的安地斯山脈內瓦多米斯密山（Nevado
    Mismi）裡流出的溪流開始的。


    我們居住的這個巨大地球，也是由一顆顆小小的粒子牽動周邊的粒子，並逐漸增大體積，而形成了現在 5,972,000,000,000,000,000,000 噸的地球。因此，無論多麼微小的東西，只要了解其屬性，就能牽引周圍，並增加其體積或大小。如此變大的資本，也容易吸引更多其他的資本。


    假設有人下定決心要籌集 10 億韓元的資金。10 億是一個月入 300 萬韓元薪資的人，27 年不吃不喝才能存到的金額。這是漫長艱辛的過程，而且是全額儲蓄的情況。就算是投資，也不能損失一分錢。若只存一半的薪資，也需要花費
    50 年。但是若能了解錢的重力，就另當別論了。這世上一切擁有大筆財富的人，都不會以那種方式存錢，而且也不會讓資金如此流動。'
  merge: -1
