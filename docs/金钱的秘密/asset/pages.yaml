- pgno: 100
  md: '# 06 金融危機

    爆發後的三種人


    在這種暴跌市場中，會形成巨大的財富移動，使窮人的錢流向富有的人，猶如水不會逆流而上一樣，因而富者更富。


    當股市持續呈現「牛市」（bull market），許多人湧入貪婪時，無論市場的實際價值如何，股票會持續上漲，因而產生「盲目購買市場」的匯率過度反應現象（overshooting）。但是如果情況持續下去，股市必定因泡沫破滅而崩盤。這時機必然來臨，這是自然的原理，只是不知道是什麼時候。


    就像大家雖然知道當落葉紛紛飄落的時候，就是秋天過去冬天到來，但是所有人都想這個冬天應該不會來臨一樣。然而有一天毫無預警的突然降下了暴雪，於是產生同時大量拋售的現象（undershooting），造成股票大暴跌，最後落入空頭市場（熊市）。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 暴跌市場中三種類型的人


    通常如此大規模的暴跌市場，大概每 10 年造訪一次。但是真正發生後，無數的專家才出來解釋為什麼會發生這種情況，由此可見似乎沒有人知道具體的原因。在這種暴跌市場中，通常會有三種類型的人：


    第一類是完完全全遭受損失的人。這樣的事件看似造成在金融市場投資的人很大的影響，其實那些許多生活平凡的人是直接的受害者。雖然從未投資過一張股票，但仍然受到影響。


    金融資產與所有的企業都有關連，股價暴跌會導致公司的業務萎縮，失業率上升，實體經濟迅速降溫，所有人的收入都會縮減。收入縮減會造成房地產停滯，房地產下跌又導致融資回收，而負債的人將被追討還債。股票它自己漲了又跌，跌了又漲，上上下下，但受害的卻是我們。理由只有一個——負債。因為負債，所以其他人的資產變動，會造成我們資產的變動，其影響一覽無遺。


    第二類是完全不受此暴跌影響的人。他們沒有負債，而且工作穩定。對他們來說，股票市場暴跌的新聞，只是那經常高喊不景氣的某部分人所發出的喧囂罷了。他們覺得反正暴跌的影響最快一年，最晚幾年之內便能全部解決，彷彿什麼事都未發生似的，股市會重新回升不必擔心。他們會如此平和是因為沒有債務。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '第三類的人比較特別，他們是在這種情況下，仍然獲利的資產家，他們將這種狀態視為難得一次獲得數年資產的機會。在這種暴跌市場中，會形成巨大的財富移動，但是這種大移動，會使窮人的錢流向富有的人，猶如水不會逆流而上一樣，因而富者更富。


    # 樂觀資產家的行動


    然而並非每個有錢人都能從中受益，當人陷入絕望、在恐懼中顫抖，將所有財產拋售的時候，這些人反而走向黑暗。而有些人知道當風險變最大，以致無人購買，形成大量拋售的狀態，反而是風險最小的狀態，因而付诸實際的行動。這時到處充斥著關於景氣最極端的輿論，儘管如此他們仍然不會停止投資，他們是樂觀主義者，相信產業和經濟的根本價值，相信世界將會前進。他們的野心每次都讓他們成功，而且這樣的成功方式已經持續了數百年。時機一旦來臨時，都是悄悄地不易發現。而當股市情況整頓好時，樂觀主義的資產家們早已建造更高的房子了，這就是他們如神似的領導世界的方式。


    有顆巨石從山上滾下來，有被石頭砸死的人，也有逃過一劫的人，更有把石頭拿去賣的人。最大的財富移動每次都是這種方式。'
  merge: -1
  img_proc: true
