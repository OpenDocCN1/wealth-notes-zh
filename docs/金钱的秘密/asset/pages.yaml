- pgno: 111
  md: '這是一個給那些躺在不同的抽屜裡一陣子、與其他種類物品互不相識的東西找到「親朋好友」的工作。然後在把它安頓好的抽屌上，用便條貼暫時寫上屬於它的名字，例如按摩器、運動器材、拖鞋、文具、遙控器、小型電子產品等名稱。


    # 練習懂得正確使用金錢


    物品整理完之後，可以用辦公專用的標籤機，為每個抽屌製作屬於自己漂亮的名字，並列印整齊貼在上面。標籤大小要適中，太大反而不好看。工作全部結束後，將被子摺好放回去，再來喝杯茶反省一下。


    如此整理後，便知道我們何等隨便對待世上的物品。那些不知道的、不想要的、不必要的東西，源源不絕地出現在我們眼前。並且我們會因為買了許多沒用的東西而汗顏，發現自己竟然擁有這麼多不會使用的東西。不只我們的身體會產生污垢，生活中也會藏污納垢。若不除去這些污垢，正當的財富雖然會找上門，但又會轉身離去。


    正如沒有一個女人願意與手肘及脖子後面有污垢的男人約會一樣，這些小小的動作猶如蝴蝶效應一樣，會改變我們對物品的態度，以及看待世界的眼光，讓我們變成懂得正確使用金錢的人。減少我們隨便亂買東西的情況，買回來的東西也會被'
