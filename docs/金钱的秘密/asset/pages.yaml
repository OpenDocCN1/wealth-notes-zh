- pgno: 272
  md: '# 14 如何看待合夥的關係


    金錢比友情強硬，所以若合同不明確或是有漏洞，就會破壞友情和親情。


    對於接受投資的人，我想說：如果你能明白別人的錢比自己的錢更重要，那麼就可以合夥。如果你相信自己有義務向投資人每季定期報告財務報表，那麼就可以合夥。如果事業發展順利，你會將錢還給朋友，也沒有終止合夥的意願，那麼就可以合夥。如果你相信自己拿薪水時，有責任向合夥人報告薪資水平，那麼就可以合夥。如果你有信心讓彼此記錄和閱覽所有詳細的資金執行情況，那麼就可以合夥。


    對於做投資的人，我想說：如果事業出問題，你不打算取回你的錢，那麼就可以合夥。如果你認為事業不順利的時候，合夥人仍然可以拿薪水是正確的，那麼就可以合夥。如果你不會隨便對待合夥人公司的職員，對待他們像自己的員工一樣，'
  merge: -1
  img_proc: true
- pgno: 273
  md: '那麼就可以合夥。如果你確信自己不會在外面吹噓「這家公司是我的」，那麼就可以合夥。


    對於雙方，我想說：如果兩人的合約有明確的文件並有公證過，對股份、職責、薪資、經營權、利潤的分配方式、責任的界線、股票轉讓同意權、再投資比率、合約終止條件等項目有明確的記錄文件，那麼就可以合夥。如果兩人了解董事會或增資、配息等用語，並以書面形式達成了協議，那麼就可以合夥。如果兩人有正確的業務職責表，而一方沒有履行職責的情況，能根據損益分配比率的調整達成協議，那麼就可以合夥。


    合夥進展順利或不順利都是問題，若遇到不對的合夥人，比起工作的壓力，因合夥人造成的壓力更令人害怕。但是若遇到好的合夥人，就等於有兩個信念相同的人同心協力。因此為了維持良好的合夥關係，必須將所有的事物整理成文件，並尊重彼此的資產。


    金錢比友情強硬，所以若合同不明確或是有漏洞，就會破壞友情和親情。造成夫妻或父子之間關係破裂的，也是那合在一起的錢。雖然兩人是朋友或家人的關係，但彼此之間的金錢不會成為朋友或家人，只有簽訂明確的契約才能让彼此的金錢成為朋友或家人。希望大家能明白友情歸友情、金錢歸金錢的觀念。唯有尊重別人的金錢，才能解決所有的合夥問題，'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# # 15 不知道方向，

    # 就往寬闊的道路


    不是專家的人，

    若不想在特定資產領域中迷失方向，

    只要找到資產所指示的大馬路就可以。


    我曾在江南購買過一棟自己喜歡的建築物。該建物的所有者是一名六十多歲的男人，他本來堅決不賣，後來改變主意聯絡我。他有好幾棟建築物，他要賣掉的其中這一棟是為孩子補貼創業的資金。


    當時我對房地產的了解並不多，交易完成之後，我問他：「 您能告訴我一個購買房地產的眼光嗎？」他沉默了一會兒，或許他在思考我的詢問是真誠的，所以他真的只告訴我一件事，然後就離去。他說：「
    我只購買從捷運入口出來後馬上入眼的建築物。就是今天貼出來要出租或買賣的資訊，今天就有人聯繫的情況。如果不是因為我的兒子，我一輩子都不會賣它。金先生，今天你也是因為接到聯絡電話而來簽合約不是嗎？」'
  merge: -1
  img_proc: true
- pgno: 275
  md: '從這位先生的標準就成了我購買房地產的標準。當然捷運站前的建築物都很昂貴，但是如果可以選擇房客和房客的水準，變現也很容易時，也能將昂貴變成最便宜的。即使是現在，當我購買建築物時，比起建物的大小，我還是比較關注地點（場所、位置），比起利潤我也看重地點，比起建物的年分我還是重視地點。因為我明白對於不是專門投資房地產的人來說，能獲得的最大又安全的利益就是地理位置。而且在我對房地產還沒有建立完全的自信之前，以建物的地點為主要購買目標，都沒發生過重大的失誤。


    # 先選擇最大、最好的


    到別的城市旅遊時走大馬路比較好，有時候明明有條大路，卻想尋找捷徑走小路，結果走入死路，或者必須重新繞回來。相信自己的方向感，有時也可能迷路。不是專家的人，若不想在特定資產領域中迷失方向，只要找到資產所指示的大馬路就可以了。


    在還沒有完全了解的市場上投資的時候，這是非常有用的提示。我在購買股票時，如果對該產業沒有很明確的了解，我始終選擇第一名。之後若理解度提高時，也會選擇第二名。雖然我對投資房地產的了解仍然不足，但是在資產分配方面，有時我需要保有房地產。因此我光靠著只購買位於主幹道上的建築物，就已經做出了亮眼的成果。'
  merge: -1
  img_proc: true
- pgno: 276
  md: '不能成為富翁的人，他內心有不能成為富翁的想法。眾所周知，首爾市中心的房地產價格很高。其實貴有貴的理由，但是由於大家覺得太貴，所以到首爾附近通勤方便的城市去投資。蘋果的股價最近10年間上漲了30倍，其股票上漲有它的原因。有人不是買蘋果的股票，而是買蘋果主題股或相關股票。在重要地點買一棟小小的建物、少買一點蘋果股票的方式是不對的，就像為了尋找捷徑而走人死路一樣。這又像有棵樹正在開花結果，卻硬要拿它的種子來種樹一樣製造風險。


    # ## 最佳投資者經常做的事


    當我投資時，總是考慮兩個問題：賺錢重要，還是避免損失重要。想要同時抓收益和避免損失這兩隻兔子，最後兩個都沒抓到，這就是現實。在投資世界裡倖存的人，不是「一桿進洞」（hole
    in one）的人，而是經常打出「小鳥」（birdie，低於標準桿數一桿）的人。一桿進洞的人很少有獲勝的情況，也不會為了在下一場比賽中獲得優勢，而冒著生命鎖定一桿進洞。但是每個人都對一桿進洞有興趣，卻忽略低於標準桿數一桿（小鳥）。就算打不到高於標準桿數一桿（bogey），或高於標準桿數兩桿（double
    bogey），也可以的朋友中成為優秀的選手。減少自己不知道及無法控制的事，就是最佳投資者經常做的事。


    如果只走大馬路，就一輩子看不到有趣的事。當後街小巷'
  merge: -1
  img_proc: true
- pgno: 277
  md: 出現的小吃街上，大家都在賺大筆錢的時候，你可能無法參與其中。換句話說，如果過度降低風險，可能會有跟不上平均增長的失誤。但是不會因為我的利益比別人的平均利益少，就成為窮光蛋。如果發生一次問題就變成身無分文，就千萬不要有這樣的失誤，一旦落後將永遠無法重返這個市場。希望各位在了解所有大街小巷之前，必須走在大街路上。
