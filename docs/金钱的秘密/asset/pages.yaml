  md: '# 17 三種致富之道


    > 請越早起步越好，如果從十幾歲或二十幾歲

    開始培養觀察產業的眼光，也在職場生活中

    不斷地投資，在 40 歲左右，

    資本超越薪資所得的日子就會來臨。


    致富的方式只有三種；分別是承襲遺產、中樂透或事業成功。若不是父母有錢，其中最容易達成的就是事業成功。中樂透的比率，比事業的成功率低很多。就算中獎，但因為這些金錢的性質不良，所以維持長期富有的機率也不高。


    那麼剩下的只有事業，而事業成功的方法有兩種。首先是自己創業。創業需要有忍耐痛苦的勇氣，要付上一所有一切，帶著拚死拚活、血淚交織的代價才能勉強成功。成功之後為了持守，一刻也不能掉以輕心。必須尋找創意，成立公司，尋求資本，勞動和管理並行才可。要得到消費者的認可絕非易事，當然如果能正當地成功，在我們的人生裡，我們自己就是一個完美的禮物。一生持有自我決定權，就是擁有自由，做自己想做的，不想做的時候就不做。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '第二是騎在別人的成功上，站在贏的那一方。若騎在領先在前的馬背上，當後面的馬超前時，就迅速地改換馬騎奔，這樣做也沒有人會責怪。


    這方法比直接創業更安全，可以從小就開始做，也能一邊工作一邊進行。有些公司經營順利，已經在某一個領域排名第一。他們將公司的價值分成數百萬、數千萬片，那每一片叫做股票，並且把那股票變成任何人都可以隨意買賣的股票。可以一張張的賣，也可以一年之內任何時候購買。可以到銀行或證券商，當場開立買賣的帳戶，也可以透過網路或應用程式來開戶。不必為了購買那公司的股票而聯絡他們，或親自去到那公司，因為大部分的金融公司都有代理此交易。


    若持有這種公司的股票，公司越擴大股票的價值就越升高，每年或每季都能分配到股利。找到發展良好的企業、經營能力優良的經營者，並購買該公司的股票來匯集資金，比直接經營來得更容易。


    但是從此開始，有些需要注意和努力的事。買了股票若上漲，則必須放棄賣出的想法，要有「股票只買進不賣出」的觀念。所買的股票立刻上漲不是一件好事，應該長久慢慢地往上升，這樣才可以存更多的錢，更多擁有那績優股。若是有股息的股票，可以一輩子不用賣出。'
  merge: -1
