  md: '錢是從 20 年前開始積蓄下來的，就概率而言，個人自我保險會更好。因為不管保險公司銷售哪種商品，所設計的商品都是對我不利的。冠上儲蓄型、免稅型和續約型等各種誘惑的名號，最終也都是對顧客不利的商品。另外，保險公司有權拒絕那些可能對他們造成損失的投保，對於有病歷、年紀大或職業暴露的人，保險公司可以拒絕他們加保。也許有人會反問：「即使這樣，也有很多因保險而受惠的人吧？」在賭場贏錢的人也只占
