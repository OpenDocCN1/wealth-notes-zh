- pgno: 256
  md: '# 09 家族中的「鳳凰」

    該如何對待親人？


    如果資產規模已超過 100 億韓元，

    就是資產創造資產的時期。


    或許大家覺得在兄弟姐妹當中，若有人變富翁，總比都沒

    有人發財來得好，但家人之間會因此發生各種意料不到的問題。


    一個國家若爆發貧富差距，也會導致社會的安全網崩潰，

    緊張的局勢高漲。當家人之間的貧富差距拉大時，會瀰漫著不

    和睦、失落和指責等。我相信我的讀者都會成為富有的人，因

    此我想預先告訴各位，當你變富有的時候，該如何與父母以及

    兄弟姐妹相處。


    我所提供的看法，可能因賺錢的規模和是否結婚而有些許

    的差異。我以自己的情況為例，將自己曾犯的錯和做對的部分

    整理好記錄了下來。'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 情況一，資產規模在 10 億韓元以內


    此時不應該做的事情如下：借給兄弟們創業資金、給父母換房子或車子。


    應該做的事情如下：給供養父母的嫂子或弟媳買名牌包、給剛進入大學的姪子買筆記型電腦、家族聚餐時你請客、定期給父母生活費等。


    這是剛擺脫貧窮成為富翁的情況，是默默照顧家族中比較辛苦的婦女或姪子們的時期。因為可能會引起家人之間的嫉妒和猜忌，所以要照顧比較辛苦或被冷落的家人。這時還不到一定要提供創業資金或換車子的程度，自己的資產还未紮根之前不要動用大筆錢。除了父母的生活費之外，任何費用都不能作為經常性支出。


    給父母親的生活費要像發薪水一樣，必須在固定日子自動轉入，不可遲延。不要讓父母操心，若延遲一天父母親就會擔心孩子的事業是否遇到了問題，或以為自己做錯了什麼。每個月都要固定轉入，如果事業逐漸擴大，就慢慢提高金額。而且把「生活費」改說成「投資股息」，不要讓父母覺得拿生活費時要看孩子的臉色。向你的父母解釋這些「股息」是他們年輕時，對孩子投資的努力和價值，請他們坦然接受。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '也鼓勵父母不要將生活費存起來，若生活費沒有按時入帳，他們會感到不安，不敢花用。為父母辦理現金卡，避免他們把自己的生活費存下來，幫助其他家境困難的兒女或孫子孫女。如此便可以從存摺上看見他們每個月搭計程車、喝咖啡，以及買花的所有花費明細。


    千萬不要接受兄弟們的投資邀請、支援購買房子資金、提供生活費等。這時期一不小心會變成還未從水裡游出來卻被抓住腳踝的情況，最後大家再次陷入貧窮。要注意這些事一不小心就會斷絕兄弟之間的情緣。現在是優先照顧你的太太和兒女的時候，而不是父母或兄弟姊妹。用這些錢給嫂嫂、弟媳、母親、姊姊妹妹們買高級皮包效果會更好。**這時期不是支援家人的時候，而是防止家人分散的時候。**


    # 情況二，資產規模在 50 億韓元以內


    這時候是給父母買房子或買車的時期。不再是只給父母零用錢，而是承擔全部生活費的時候，也是供應姪子們學費的時候。兄弟之間的嫉妒已過去，到了彼此接納的時期。這時即便花費這些大筆錢，也不會聽到擺架勢、裝闊之類的冷嘲熱諷。照顧姪子們的理由有兩個：強化堂兄弟關係的共同體概念，也能使他們經常見面，彼此相處融洽。


    另一個好處是兄弟姊妹們會更減少向我們請求困難的幫助。如果有一個富有的兄弟姊妹，為自己的孩子繳學費、送他'
  merge: -1
  img_proc: true
- pgno: 259
  md: '們去旅行、開學時為他們換新的筆記型電腦等等，他們就不會提出無理的要求。花在姪子們身上的錢，比用在提供兄弟們事業資金或支援購屋資金等便宜，也是智慧聰明的支出。這個時期仍需要以謹慎的態度來支援兄弟們的需要。


    # 情況三，資產規模超過 100 億韓元以上


    這時期兄弟姊妹當中不應該有窮困的人，我們要積極幫助他們擺脫貧窮，現在他們的貧窮是我們的責任。為兄弟姊妹當中具有企業家特質的人成立公司，並賦予職責。不僅我們自己成為富有的人，也要讓家族變富有。如果資產規模已超過
    100 億韓元，就是資產創造資產的時期了。


    這時期可以每年送父母去旅行，也送父母的朋友一起去，讓父母在朋友面前為自己的孩子感到驕傲。不是成為家人和親戚之間的「鳳凰」，而是保護的關係。若有需要支持親朋好友的婚喪喜慶，或住院費等之類的事，我們就是保險顧問的角色。而且這些都要透過配偶去做，如此我們的配偶才會在家族中受到尊敬，也能與我們一起享受成就感。'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 10 失敗的權利


    阻止孩子創業的父母才是失敗者，

    這些父母將自己的恐懼傳染給孩子。


    可能有人讀完這整本書之後，還是沒有勇氣，也不知道方向。我目前擁有幾家公司，並且各個公司都有總經理在經營。但我從來沒有因總經理們失敗而懲戒他們，反而我會責怪他們缺乏挑戰。在某些情況下，我看到了他們失敗的部分，但我暫時放著不插手。因為或許這一次的失敗能阻止下一次的失敗，或者是我自己做錯了。我經歷過很多次失敗，現在仍然在生活中經歷著失敗，因為我還是喜歡接受挑戰。


    失敗是權利，特別是年輕人的失敗，他們有失敗的特權。無論我們的時代如何歌頌成功、貶抑失敗，但這世界上有多少沒有失敗的成功呢？一個從來沒有失敗就達到成功的人，很可能會因為一次失敗就失去所有。因此沒有失敗融入其中的成功還不算成功。沒有鋼筋的混凝土能撐多久呢？

    做父母的也應該包容兒女的失敗，要懂得歡迎失敗。很多'
  merge: -1
  img_proc: true
- pgno: 261
  md: '父母因自己曾失敗，所以很希望自己的孩子不要經歷失敗。他們為了不讓孩子失敗，而阻止孩子接受挑戰，最後卻因此導致孩子失敗。若我們有個失敗的兒女，則代表我們有個願意接受挑戰的孩子。阻止孩子去創業，鼓勵他們去就業的父母才是失敗者，這些父母將自己的恐懼傳染給孩子。只要有父母的包容和接納，孩子們一定可以再次接受挑戰，而且總有一天會成功。


    年輕人絕對不要懼怕失敗，失敗是你們的權利，今天你依然有失敗的權利。各位是否想像過沒有失敗權利的世界會是如何？失敗是年輕人必須遵守的權利。每個人都在彷徨、挫折中成長，沒有人未曾經過一次失敗，就踏上成功的門檻。失敗不是犯罪，就算是魯莽的事，也要不斷地挑戰它，因為對那些不願去挑戰的人而言，所有成功的過程都是冒險。'
  merge: -1
  img_proc: true
- pgno: 262
  md: '我相信書籍仍然是生活中最好的工具，雖然我們可以透過網路或媒體找到更快更準確的資料，但比不上書裡提供的隱密資訊。我現在每個月依然購買二十幾本書，因為我所關心的事各式各樣，所以閱讀量偏多。如果我对物理學的理論有興趣，就會立即訂購相關書籍。若對債券好奇，便把所有關於債券的書籍全買齊。若喜歡某一位特定的作家，我甚至會去二手書店尋找他已絕版的書。


    還好我閱讀書的速度很快，三百多頁的書兩三個小時就能讀完。必要時我會在書上畫線，或者當我讀到某段內容或單字時，會將我的一些靈感或想法寫在旁邊。即便我的想法與書中的內容不同，我也會將它記下來。如果那本書與主題不合、內容不實，或者我不太喜歡，我不會非把它讀完不可。有時因我


    # 11 書本讓人富有嗎？


    > 我們常常在閱讀的過程中，被作者深深吸引，

    對作者驚人的思維和見解感到好奇，

    不知不覺成了知識的俘虜。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '忘記了書名和作者，所以又重複買了讀過的書。還好現在用網路訂購，付款之前會親切地顯示買方的購買記錄。


    我的書房裡有數千本書籍，是這些書讓我成為富翁的嗎？不是。書不能讓我們致富，而是當我們有了理解書的能力，並主動發掘問題時，才會遇見致富之道。


    # ## 與巨人同行的方法


    我們常常在閱讀的過程中，被作者深深吸引，對作者驚人的思維和見解感到好奇，不知不覺成了知識的俘虜。把事實擺一旁，將書中所有的內容當作真理全盤接受，完全沒有自己的想法。然而即便是最有名的作家文章或偉大學者的理論，都不完全正確，連聖經都有誤譯和遺漏的部分。但有些人卻對作者著迷，甚至用手抄寫他的書，比作者還清楚記得書中的內容。只看見作者書中某些內容是正確的，而完全不思考除此之外其他部分可能有問題。那麼哪一部分是正確的，哪些部分是錯誤的呢？


    其實有一本「書」會告訴我們這答案。有些人讀完一本書，備受其中影響，精神知識增加後，反而覺得自己很寒酸。若是如此，讀越多的書，肩膀更下垂，膝蓋更無力。不是騎在巨人的背上，而是被壓在巨人的屁股底下。這時有一本書能讓我們'
  merge: -1
  img_proc: true
- pgno: 264
  md: '挺起胸膛、膝蓋伸直，並告訴我們與巨人同行的方法，那就是「散步」。透過散步來接觸活生生的書。不會讓我們產生懷疑、提問的書，無論怎麼讀都是一本死的書。


    我們要透過散步的時間，來思考從書中領受的主題和觀點，不要盲目的被作者的權威屈服，要以自己的標準判斷對錯。透過這樣的時間，練習挺起下垂的肩膀、伸直彎曲的膝蓋，獨自站穩。每當閱讀的時候，可能膝蓋會再次彎曲，但是只要繼續練習獨立思考，有一天將會發現腿上長了肌肉，肩膀挺直，屹立不搖。所以要透過散步和自問養成懷疑和提問的習慣。


    盼望各位藉著走路或安穩坐著時，思考一下今天讀過的書。那麼將會發現再偉大的老師所寫的書，有些內容可能是為了增加篇幅而寫的廢話，有的只是單純以銷售為目的，而寫出來的自我啟發而已，因為你心靈的膝蓋變健康了。散步能使我們身心保持健康，希望大家每天走
    1 萬步以上。'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 12 神為何不公平？


    > 遭遇挫折或失敗，不要埋怨神也不要責備自己，

    那不是神的錯，也不是你的錯，

    只要重新面對挑戰就好了。


    當我們無論多努力也看不到希望，又遭遇持續不斷的挫折和失敗時，就會埋怨神。當我嘗到好幾次失敗，感到挫折氣餒的那段時期，也曾埋怨過神為何如此殘忍。我不了解我這麼努力，又不做壞事，也勇於面對挑戰，為何屢屢失敗。我想像我這樣的人若成功，一定可以幫助很多人，神為什麼不賜給我好運，我實在覺得懷疑又委屈。


    但是隨著時間的流逝，我發現神總是公平的，我想通不是因為我成功了。無論是成功前或成功後，神都不干預任何事情，這就是祂的公平。回想起來，無論我失敗了七次還是十四次，祂都沒有參與。相反的，即使我肆無忌憚地賺了很多錢或得到過度的稱讚，祂也不會干涉。神彰顯的公平就是不干涉這世界，讓它自行運作。'
  merge: -1
  img_proc: true
- pgno: 266
  md: '人越相信神應該是公平的，就越失望，這種失望的情緒蔓延開來，最後就擴大成神是不公平的想法。但是無論多麼艱辛，都不要埋怨神，也不要倚靠神，要學習自立。不尋求神的幫助，下定決心自己站起來，才能真正看到方向。神根本不會因你獻上的祈求和禱告而動搖。


    向神禱告是傾聽祂要說的話，而不是一味地對神傾洩自己想說的話。不相信神的人都知道這個道理，不知道為何反而信奉奉神的人常常折磨祂。遭遇挫折或失敗，不要埋怨神，也不要責備自己。那不是神的錯，也不是你的錯，只要重新面對挑戰就好了。


    神不干預世界，並不是因為祂冷漠無心，而是無為而治。不是因為神不愛我們，而是因為祂真的愛我們。祂讓我們自己行動，讓大自然自行運作。神一旦介入世界，世界上一切所有都會停止，就是死亡，這就是神領導世界的方式。


    神透過不干預向人彰顯祂的祝福和支持，盼望各位盡情帶走世上所有的財富和祝福，透過財富實現你的願望。'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# # 13 只


    會投資的宋老闆和他常生氣的太太


    > 公司應該有投資的比例，


    沒有公司會將每年 $ 100 \% $ 的利潤用在投資上。


    宋老闆是經營之神，他所開創的每個賣場都很成功，製作的菜單頗受好評。位於首爾附近的甜點咖啡廳常常客滿，附近還有一家他經營的烤肉店，一樣生意興隆。宋先生工作的咖啡廳後面，有一間和咖啡廳一樣大小的研究室，其入口處貼著「研究室」的標示牌。宋老闆的電腦檔案裡有兩萬多張照片，分別有菜單、陳列方式、照明、器具、道具以及服裝等，整理得井井有條。全都是他走訪日本、歐洲和東南亞等著名餐廳而獲得的靈感。因著宋老闆的這種學者式的探索，咖啡廳的客人不必出國旅行，也可以享受來自世界各地的美食，因此他的咖啡廳總是高朋滿座。'
  merge: -1
  img_proc: true
- pgno: 268
  md: '但是他的太太經常生他的氣，因為他們結婚將近 20 年，但至今都還沒有屬於自己的房子，也沒有存到財產。周遭的人都以為他們是真富豪，生活艱難的娘家也隱約期待他們的幫助，但他們真的沒有錢，也沒有財產。儘管他有兩間店面，但每天從早到晚都要到店裡工作，否則連生活費都沒有。他太太因看不慣他的行為，所以不去咖啡廳幫忙，而是去烤肉店工作。


    # 夢想遠大的宋老闆


    宋老闆咖啡廳後面的研究室裡有六名員工，比在咖啡廳裡工作的四個人還多。研究室的職員不做咖啡廳裡的工作，而咖啡廳員工的夢想是進入研究室，因為那邊薪水比較高，工作也富有創造力。宋老闆的夢想遠大，他想把這咖啡廳擴展到全國，創造成大企業。所以他設立了食譜研究室，與員工一起製造世界上所有美味的食譜。他們開發食譜的速度之快，一年更換四次全部的菜單。雖然顧客們都很開心，但他的太太卻心急如焚。


    原因很簡單，因為宋老闆的咖啡廳所有收入，全部用在研發菜單和研發人員的薪資上。他帶著員工去日本學習食譜，也隨時升級菜單，每年花費在製作菜單標示牌和改造設施的費用，就超過了咖啡廳的利潤。每次新的菜單都會大賣，他興奮得認為自己會發財。菜單改變，所使用的杯盤等也跟著換新，杯盤換新，連餐桌和照明也全都更換。偶爾看到業界的人來稱讚宋老闆，又羨慕他的樣子，他太太內心就翻騰不已。'
  merge: -1
  img_proc: true
- pgno: 269
  md: '宋老闆是完美主義者，他在經營咖啡廳之前，曾經做過汽車保養服務中心，在那之前還經營過印刷廠。那時他為了想創立韓國最好的印刷廠，只要有收入就進口德國製或日本製的印刷機。曾經又為了創立專門維修進口車的一流保養中心，而購買各種類型的二手進口車，將它們全部拆卸後研究。


    他很會賺錢，但賺到的錢全部拿去投資在事業上，他的太太從沒有摸過這些錢。現在若不是咖啡研究室，每個月還會有2,000萬韓元的利潤，但這一切都用在研發人員的薪資和材料的成本上，一毛也不剩。若不是從烤肉店抽出一些生活費，這些錢一定又被他拿去聘請更多研究室的職員。社區裡的人稱讚他太太：「妳先生那麼努力工作，賺那麼多錢真是太棒了！」聽到這些話她快氣炸了。


    # 宋老闆的罪狀


    我很清楚宋老闆絕對不會成為富翁，正如他太太所說，宋老闆的咖啡廳或烤肉店生意越好，投資在店面和員工的錢就越多。


    宋老闆的第一個罪狀是無限投資。公司應該有投資的比例，沒有公司會將每年100%的利潤用在投資上。就算宋老闆有數十間商店，那些錢也不會流向他太太。因為他為了建立更大的公司，必須做更大的投資。若有任何閃失，就會再次跌入谷底。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '第二個罪狀是侵占。挪用他人的財物，就是違反刑法，得以處 10 年以下有期徒刑或 3,000 萬韓元以下的罰款。宋老闆侵吞了他太太的財產。


    夫妻的財產是共有的，一對夫妻住在一起，不管誰賺錢，一半的收入是屬於配偶的。宋老闆將他在生意上賺得的所有錢全部用在投資上，這就是侵占了妻子的那一份。若想全額投資，必須得到妻子的允許。但是妻子雖反對，他每年依舊如此。還有做先生的宋老闆最大罪狀是「經營無知罪」，他身為家長和經營者卻不知道將一半的利潤分給妻子，用剩下的一半發展事業才是最明智的做法。


    宋老闆既是家長，又是企業的經營者。經營事業不是外在的架勢，也不是公益活動。他在这段經營生意期間，如果有持續將一半利潤給他太太，他太太一定會尊重他，並以他為傲，而且給太太的那一半，現在可能已經變成了一棟房子，或許也已經預備好養老金了。


    若說「要維持像現在一樣的經營規模並擴大事業，就應該做這種程度的投資」，這種辯解是不對的。因為宋老闆做生意不是為了帶給家人幸福，而是為了自己的虛榮心犧牲了家人。這是他太太輕視這做先生的又對他生氣的主要原因。


    我想提醒宋老闆：「請將一半的利潤還給太太，這是你太'
  merge: -1
  img_proc: true
- pgno: 271
  md: 太當得的股份，也是對你有利的。家庭的財產除非轉給太太，否則不是完整的資產。太太所保管的錢才是家裡實際的資產。若能如此做生意，既能保護你的事業，又能增加家裡的財產。而最大的福澤是你的太太會以你這企業家為榮。」希望「宋老闆」一定要讀這篇文章。
