  md: '# 17 防止被騙的方法


    > 若是我不了解的事業模式，

    發生事故就無法控制；而預期利潤豐厚，

    就是風險很大的意思。


    年輕時我曾被騙過幾次。當時我很急迫，正如美國早期的移民者一樣，那時候我們全家人一天工作16個小時，一週工作112個小時。疲憊艱辛的家人都變得很敏感，話鋒尖銳。父母漸漸衰老，而孩子正在成長，希望似乎渺茫。當時我穿著從二手服裝店花3美元買來的牛仔褲，坐在沒有冷氣的卡車上，每天早上去市場買水果來賣。我心想只要努力打拚，將來一定可以打著領帶在辦公室裡工作，週末還可以帶家人出去玩兒。我的眼睛被急迫的欲望蒙蔽了。


    當時三寶電腦公司的eMachines曾是最大的股東，以主打銷售低價電腦在美國市場掀起一股熱潮，在韓國企業歷史上第二次在美國那斯達克市場上市，引起大眾一度關注。


    在上市之前，有個人給了我購買1萬美元股票的特權。當時1萬美元對我來說真是一大筆錢，對素昧平生的我施予如此'
