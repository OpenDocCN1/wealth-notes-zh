  md: '善於往良好的方向預測，但還是無法獲利。想要在投資市場上長期成功，就必須了解風險，掌握自己資金的狀況，並且應對風險、戰勝它。


    # ## 具備洞察風險的眼光


    通常我們認為風險高，損失或獲利也會高；風險低，損失或獲利也低。這樣的認知就像數學最基本的加法乘法公式一樣簡單。其實有時候兩個數字相乘之後，得到的答案反而會變小。意思是風險也有各種複雜的情況，如果風險增加，獲利的不確定性及損失的可能性也會增加。一般認為變動性較大的市場，風險就越大，但預期收益幾乎沒有隨著變動性改變的情況。


    事實上，很少人察覺風險大的消息傳遍時，就是風險降低的狀態。通常股票市場的繁榮時期，看似沒有風險，而股價暴跌期，好像風險大幅增加。因為不知道在暴跌期會造成何等深遠的損失，那風險看起來又太大，所以無人購買股票而導致暴跌。事實上，那個時期正是風險最小時候。


    在股市上漲期，沒有人害怕風險時，也會有風險最大的情況。看似風險消失的多頭市場，反而風險最大。因為那是形成泡沫的唯一地點，因此必須具備洞察風險的眼光。


    華倫·巴菲特有句名言：「別人恐懼時我貪婪，別人貪婪'
