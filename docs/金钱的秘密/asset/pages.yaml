  md: '遭受了沉重的打擊。六類股票暴跌高達 50% 以上，而巴菲特的傳統價值股票投資組合，受到格外強烈的襲擊。或許這是在他 11 歲就開始的 80 年投資生涯最後階段，以及一生的聲望上劃了一道裂痕。


    # 另一種交易方式


    我不是個善於交易的人，不善於交易的人就不要有交易。所以當我為了購買汽車而討價還價時，也先找出合適的價格之後，只向業務員提出一次最終購買價格（drive out
    price）。


    就是向他表達如果價格令我滿意，我就照單全收，否則就當場離開，而且表示不會再討價還價。此方法大部分都讓我以最合理的價格買到車，曾經還有在一個小時內就把車開回來的經驗。


    購買房地產時，我也幾乎運用相同的方法。議價完成後，若又有其他的理由要求另外的價格，我會立刻終止交易。與其再次來回議價，我選擇放棄交易。因為我不喜歡互相猜疑，不喜歡也不善於協商。這種方式是對那些不太善於交易的人最好的交易方法。所以我也討厭每次買了股票又要賣出，我會選擇一次買進後，可以長久不需要交易的公司股票。甚至我喜歡一輩子都不需要賣出的公司股票。


    之前有兩個鄰居，其中一個賣了農地後，在首爾市郊各地'
