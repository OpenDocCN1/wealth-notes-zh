  md: '# 19 頭涼、腳暖、

    八分飽


    若能節制貪婪，反而會賣到好價位。投資若超過 100%，就有可能變為 0%……


    保持頭部涼爽、腳部溫暖，不要吃太飽，給肚子留一些空間，就是「頭涼腳暖八分飽」。這是古代佛教僧侶們傳承下來的生活規範，也是我的投資哲學。中醫強調「頭寒足熱」，頭部保持涼爽，而雙腳要保持溫暖。八分飽就是當肚子填到
    80% 時，就不再吃。遵守這原則，就能使身體的循環變好，不太容易生病且活得健康，並能預防因過飽而產生的所有疾病。自然界的動物不用運動或健康管理，也會活得很好。人也是只要持頭涼、腳暖、八分飽，就能平安無憂地度日。


    十幾年前我從日本面相學家兼傑出的投資專家——水野南北先生的書中，學到「八分飽」的道理，並力行到如今。這個教導不僅對節制飲食、身體健康有益，也適用於賺錢、存錢以及使用錢的所有過程。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '為了賺錢必須殷勤奔波，去現場觀察、了解、學習。花錢的時候卻要冷靜，需經過理性的判斷之後才支出。投資的時候勿狼吞虎嚥似的貪婪，在吃得過飽之前就從座位上站起來，才是長久維持豐衣足食的最佳生活方法。不過度貪心才能獲得最切實的利益，而這個道理就是八分飽。投資的時候，賣出的難度不亞於買進。因為無論如何成功地掌握了買進的良機，但如果賣出失敗，最後可能連本錢都會失去。賣出之所以難是因為貪婪。


    若能節制貪婪，反而會賣到好價位。投資若超過 100%，就有可能變為 0%，所以 80% 是最高的。希望大家在飲食或股票上，都能持守八分飽的教訓。'
