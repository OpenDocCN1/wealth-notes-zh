  md: '# 13 國際社交禮儀與全球化的關係


    若想得到與自己地位相襯的待遇，

    就必須重新學習簡單的禮儀，提高自己的

    品格和企業的形象。


    我曾在中央大學帶領企業家進行為期兩年的全球化經營者課程，他們是一群想要從韓國往全世界擴展事業的企業經營者。曾有一週我帶著他們到美國洛杉磯及紐約，拜訪美國企業或企業組織，讓他們體驗現場教育。


    但是當我把他們帶到現場時，發現即便是韓國首屈一指的品牌代表，也完全沒有具備國際標準的禮儀訓練。看到他們完全沒有一般先進國的企業家日常該有的禮儀之後，我開始驚慌了。其實他們的失誤在韓國是很自然的行為，不會被譴責或遭冷眼。


    於是我想在這些經營者的韓國品牌在進入美國之前，首先'
