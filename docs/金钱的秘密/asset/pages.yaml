  md: '工作的一部分而已。如果不會使用智慧型手機，在現今資訊世界裡，只能做較下層的工作。最近連和尚都會使用手機的通訊軟體，牧師也要懂得用臉書，才能與信徒們互動。


    # 金融理解力是一項生活工具


    除了不識字的文盲和電腦文盲之外，金融文盲也一樣。金融知識是關乎生存的問題，美國前聯準會主席亞倫・葛林斯潘（Alan Greenspan）說：「不識字的文盲導致生活不便，但金融文盲則導致生存癱瘓，所以更可怕。」金融文盲對於保護資產、增加資產，宛如城主守護倒塌的城牆一樣，別人要拿走他的財產，也無力保護，被奪走了也不知道。想把錢匯集起來，但因為不知道自己和對方的價值，所以每次都支付令人荒謬的價格，或者廉價轉讓。因此有時在現實生活中，無法擺脫比文盲或電腦文盲更悲慘的生活。


    建造自己的城牆、保護自己的財產、將資產匯集在城內，這一切的金融活動都要從了解金融術語開始。


    調查韓國成年人對金融的理解度，得到的結果是低於OECD（經濟合作暨發展組織）的平均水平。從各個年齡層的理解度來看，最高是三十多歲，其次按順序為四十、五十、二十、六十和七十多歲。月收入250萬韓元以下的金融理解度是58分，月收入在250萬韓元以上420萬韓元以下的是63分，而收入在這以上的則是66分。二十多歲和六、七十歲的人最容'
  merge: -1
  img_proc: true
- pgno: 78
  md: '易受到財務詐欺的影響，經常暴露在投資風險中，也是因為對金融的理解程度不足的緣故。有時收入越多，金融知識也就越多；但是要有豐富的金融知識，收入才會增加，也可以保護財產，因此可以說金融理解力的本身就是一項了不起的生活工具。不論男女老少，如果金融知識不足，就容易產生錯誤的投資或錯誤的金融決策，而這些決策會導致自己信用不良，或把自己推向貧窮，最後造成社會全面的問題。


    # 理解金融術語


    我從韓國銀行提供給民眾最有幫助的術語當中，篩選出九十幾個提供給大家參考。如果大家能理解其中八成以上的術語，並可以把它的意思解釋出來，那麼你就擁有了一道堅固的城牆，是完美的城主。如果是介於五成到八成之間，則值得肯定，但仍需要有更多學習再去投資。若在
    50 個以下，而且一直以來都沒有關注這些，則需要停止所有的投資，先去搞懂這些基本的術語，一天都不能等，因為金錢正每天都往城外流出。否則無論如何努力工作，又忠心的站崗護衛都毫無意義了，你的勞苦和財產會精疲力竭，最後消失不見。請仔細閱讀以下術語，了解其中的含義，並標示出你能向他人說明的部分。


    附加利率、景氣動向指數、經常收支、就業率、固定利率、痛苦指數、金髮女孩經濟 (Goldilocks economy)、公共財、供'
