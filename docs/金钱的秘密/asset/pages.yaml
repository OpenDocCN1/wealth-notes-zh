  md: '才想起主張賣空的陰謀論，想找到破壞市場的罪魁禍首。「只讓你知道」也是一種陰謀，一個明理的人應該想到「那傳聞怎麼會傳給我呢」？!


    如果股價飆漲，我認為是勢力的陰謀，我確信是市場的大戶和背後操作勢力聯手來誤導散戶。因為對於非正常的情况，不會有如此簡單的答案。一個比特幣會漲到 30 萬美元，或者江南房地產會暴跌半價以下的這種傳聞，是陰謀和期望以及預測混雜在一起的現象。如果有人將這些預測與邏輯性數據结合在一起時，陰謀就會消失，只剩下科學性預測。要分辨這種理論是否屬實，從它能否用簡單的話來說明便能得知。


    常識是分辨誇張、虛構、扭曲和欺騙的最明智工具，沒有一個證據顯示，學得多就等於更有常識。常識與知識是不一樣的能力，人與人之間各樣的想法和意見相互交錯而得的就是常識，常識從智慧與知識以及道德相互交錯而來。


    因此常識站在歷史、法律、習俗、信仰、邏輯、理性之上。常識是普遍的知識和見解，它不需要特別的探究或學習，即使沒有特別的努力，大部分的人也能自然而然地領悟。所以常識可以用簡單的話來表達。


