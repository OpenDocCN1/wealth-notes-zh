  md: '# 03 複利的祕密


    有兩種東西自然而然滲入在我們的生活裡，並且帶來很大的影響，那就是肥皂和複利。


    在理財技術中複利的威力不容小覷。所謂複利有重複的意思，是在本金和利息上生利息，而且利息的利息上再生利息。與複利相對的是單利，單利是指本金支付一次利息的情況，前期本金所產生的利息不會併到下一期本金重複生息。換句話說，在以單利所得的利息和本金合併的金額上，再生利息的結構就是複利。


    如果將 1,000 萬韓元，以年利率 6% 的單利計息，5 年後將可領回 1,300 萬韓元。但是若使用複利計息時，則可多領 488,502 韓元的利息。看似沒有差別，但算一算增加了
    20 個月的利息。


    若改為 10 年，與單利相比利息多 2,193,967 元韓元，相當於 87 個月的利息。如果這種狀態持續 20 年，將獲得比本金更多的額外利潤，就是 11,112,045
    韓元。如果把這個差別搞清楚'
