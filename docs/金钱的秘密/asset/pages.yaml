  md: '# ## 01 創造引水

    和第一桶金的

    五種規則


    > 因為錢的問題，不能去醫院、不能讀書、延後結婚、不敢生小孩、不能幫助父母、老了還到處欠債，這才是金錢的奴隸。


    村子裡井水消失、自來水設施尚不完善的時期，大家是抽地下水來飲用。是將水管嵌入地下水道，裝上泵浦，將一、兩甎水倒進泵浦中，再用力上下拉、壓，把地底下的水抽上來。觀察水泵浦的結構，上面有個引水孔，被橡皮隔膜塞住。其原理很簡單，當水抽上來時，橡皮隔膜會堵住引水孔，以防止抽上來的水再流回去。


    為了將水抽上來而倒進去的水，叫做「引水」。韓文原意有「去迎接」的意思，英文叫做 “Calling Water”，意思是「把水引上來」。只要加入一次引水，再不停地上下猛壓泵浦，就能'
  merge: -1
  img_proc: true
- pgno: 149
  md: '將水抽出來。若沒有引水便無法把水抽出來，所以在泵浦的旁邊總是會放一個用來引水的水桶。凡是想匯集資本藉著投資獲得資本收益的人，都要準備一筆符合這引水功用的錢，這引水就是種子基金。


    # 開始創造 1 億韓元資金


    種子錢是指購買農作物種子的錢。為了達到適當的投資，約需要 1 億韓元的資金才能在股票或房地產上進行有意義的投資。如果只以少量的資金投資，即便產生利益或損失，並不會造成很大的意義或衝擊，所以會不太關心。這些錢必須是能變成
    10 億、100 億、1,000 億元的種子資金。現在我要提出 5 種使年輕人能創造 1 億韓元的實用方法。


    +   第一，下定決心要存到 1 億元。


    +   第二，寫好「要存到 1 億元」，貼在書桌前。


    +   第三，剪掉信用卡。


    +   第四，按用途將存摺分成數個。


    +   第五，先存 1,000 萬元。


    # 下定決心存 1 億韓元


    第一項建議，每當我對大家說我想要實現某個目標時，便強調首先必須要 有「真的想實現此目標」的心志。我會靜靜地'
  merge: -1
  img_proc: true
- pgno: 150
  md: '坐在書桌前，對自己說：「我想斷開我們家人被貧窮捆鎖，成為受人尊敬的有錢人，並守護我的家庭和我所愛的人。」當我如此激勵自己的那一刻，我所說的話便產生能力，驅動我達成目標。話不說出口，會開始關心心中的想法，並限制自己的行動。相反的，把話說出來，會開啟心中的想法，最後就帶出行動。盼望各位能認真看待這句話，每當感到困難的時候，要不斷對自己說鼓勵的話。這就是開始。


    # 寫好「要存到 1 億元」，貼在書桌前


    第二項建議，親筆寫下「我要存到 1 億元」，貼在書桌前較明顯的地方。最好是常常看見的地方，貼在馬桶對面的牆上、餐桌上也好，或者到處都貼更好。如果你的欲望很堅強，也可以將它放在手機的主頁或電腦螢幕上。不用怕別人看到，越多人了解我們的欲望並給予支持，就越容易實現。就算有人嘲諷也沒關係，我們需要預先學習接受這種譴諷，因為在創造並維持財富的過程中，隨時都要學習接受揶揄。這種調侃或指責，在財富達到無可冒犯的地步時就會減少，所以不必理會，就到處貼吧。


    事實上，這兩項建議與第三個相比，看似容易卻是最難。因為要改變人的想法，比採取行動更難。大多數不能致富的人，並非因為沒有能力、機會或種子基金，而是缺乏真正想要成為富翁的渴望。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 剪掉信用卡


    第三項建議，則需要工具，就是拿出剪刀剪掉信用卡。成為有錢人的第一個先決條件，就是將複利變成站在我這邊的工具。但是信用卡是複利的敵人，總會掐住我們的脖子成為阻礙。因此為了讓複利變成朋友和幫手，首先必須剪掉信用卡。一旦複利站在我們這邊，所有的錢就會隨之而來。


    從今以後只攜帶現金或使用現金卡。或許你覺得帶著硬幣在身上，會發出喀啷聲不太方便，要使用現金卡又餘額不足；但不要擔心，稍微辛苦一點，複利就會來幫助我們，必須忍耐和等候。就算有一兩個月的時間過得像乞丐，也要像脫離毒品的束縛一樣咬著牙根撐過去。必須讓自己改變，要使用現在的收入，而非未來的收入。


    # 按用途將存摺分成數個


    第四項建議，是多開立幾本存摺。不要將水電費或生活費全都存在一本存摺裡，多開立三、四本存摺，一本存摺只存入固定支出的生活費，例如房租、電話費、交通費等生活必需費用。其他存摺則存入餐飲費、咖啡等額外的花費。這些錢要在月初算好後就存進去，即便中途某一個部分全用光了，也不要挪用其他存摺裡的錢。另外還要開立一本專門儲蓄的存摺。要按照個人的預算開立幾個存摺，若覺得這樣很麻煩，也可以將'
  merge: -1
  img_proc: true
- pgno: 152
  md: '現金分裝在不同的信封裡。或許這些事很繁瑣，而且開立銀行帳戶也需要一些錢，但還是要做，而且要做的理由很清楚。


    管理一個國家或公司，需要編列預算。要預測一年的收入和支出，並區分哪個部分要編列多少預算。因為要達到平衡的預算，才能治理和經營。個人的經濟活動也是如此，要按照基本的生活費、儲蓄、文化休閒娛樂、教育等主要項目來編列預算。如果隨便花完再把剩餘的存起來，那麼無論公司或國家不用幾年就會破產。國家或公司的各個部門都有單獨的預算使用權，彼此不能干涉，但是個人金錢的使用是可以進進出出的，所以更需要按照這種方式分類，必須勉強自己實踐。


    # 先存 1,000 萬韓元


    第五項建議，請先實現目標金額 1 億韓元的十分之一，即 1,000 萬韓元。1 億元聽起來是一筆鉅額，但是只要努力，誰都可以存到 1,000 萬。無論是需要一年還是兩年，目標就是存到
    1 億元。若勉強自己存到第一個十分之一，在存的過程當中，你會體驗到樂趣，而且會產生要領及額外的收入，因此更會提高興趣。第二筆 1,000 萬比第一筆的 1,000
    萬就更容易存，我們必須經歷這種存錢的過程。


    每當我在演講裡分享這些內容時，一定會有年輕人提出這'
