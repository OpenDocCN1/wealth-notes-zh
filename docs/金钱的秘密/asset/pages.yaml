  md: '準備一筆種子資金，申請貸款，找到合適的建物，只要成功一次，便能以此為基礎，擁有許多建物。這樣的人將會成為銀行最放心的客戶。這方法不僅適用於餐廳，還有補習班業者、商業大樓及托兒所等。


    一般熟悉的大型企業，事實上全都採取這種兼得房地產利潤的形式。麥當勞是全球最領先的餐廳業者，同時也是世界上擁有最多不動產的房地產商。幾乎所有的大型超市也都一樣，例如兒童公園、迪士尼樂園或飯店之類的企業，也都是房地產企業。連鎖店也能成為房地產事業，與個人創業者相比，連鎖店倒閉的機率較低，對賣場較有保障，所以能向店主收到租金。麥當勞就是一個典範。


    農場若能吸引顧客直接來採買，也能成為房地產企業。如果同時有生產、製造和銷售的農場，就是房地產企業，這又叫做「第六產業」。花店也可以是房地產企業，我在首爾市中心開設了許多花店，這其中有一些店面是我買的。若市場上出現的待售商品，是我們進去後有能力支付目前市場租金的商場時，我就會買下來進駐。因為我們創造的人潮流量資產，沒有理由被屋主奪走。


    如此有能力的企業主，至今尚未成為屋主的理由非常荒謬。因為他們從來沒有想過，他們認為買建物需要很多資金。有些'
