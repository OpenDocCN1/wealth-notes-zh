- pgno: 287
  md: '# 19 存錢的四種習慣


    這些微小的習慣不會讓你有錢，

    但是有這些習慣的人，

    一旦有錢進來，就絕對不會縮水。


    沒有自尊感的人，即便有錢了也不會正確使用，所以錢對他沒有太大的幫助。缺乏自尊感的人有了錢也只會用在享樂上，在還沒有學會真正愛自己、尊重自己的狀態下得到金錢，就會以菸酒、娛樂、奢華、虛榮、交際、出國旅行、購買名牌等方式提高自己的價值。金錢可以建立自信和自尊，但是在擁有金錢之前，必須先具備幾個平常的習慣和素質。


    特別盼望年輕人進入社會之前，必須學會這四件事。對尚未學會的成年人，也希望能有警戒作用。這些核心意義是在成為有錢人之前，要提前養成富者的態度和習慣，當財富臨時，才能堂堂正正地領受它。


    這四個習慣具有一個效果，就是當你適合擁有財富時，它能避免你的財富流失，並經常停留在你身邊。在沒有養成下列習慣和態度的情況下賺到錢，錢反而會傷害人。'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# ## 一、起床後立刻伸懶腰


    保持平躺的姿勢，將手臂伸到頭頂，雙手合十，身體呈C型，並左右伸展腰部。然後坐在床上，雙腿伸直，兩手十指交叉向上舉高，上下伸展腰部。


    就是用伸展全身來幫助肌肉放鬆和收縮，這個動作能溫和地刺激體內肌肉，快速消除疲勞。它雖然簡單，卻是一種全身運動，肺部瞬間獲得很多氧氣。


    早晨伸懶腰是一種與世界連結的動作，也能讓身體充滿能量。動物們雖沒有運動也會伸懶腰，那是所有動物身體自然的行為。如果養成伸懶腰後再起床的習慣，就能以感恩的心和充滿自信的態度迎接一天。伸懶腰就是用身體和心靈向新的一天打招呼，從一天的開始就是活力充沛的人。


    # ## 二、起床後整理床鋪


    整理自己睡過的床鋪，代表為生活感恩。飲食和睡覺的床，最能顯出一個人的生活品質。要感謝床讓我們睡得舒服，要對床表達禮儀。把被子攤開抖一抖，把枕頭擺正，就像飯店服務生整理房間一樣。晚上回到家躺在雜亂的床上，表示侮辱自己，若每天如此，便等於嘲弄自己的人生。懂得整理床鋪的人不是平凡的人，而是偉大的人。這種瑣碎的事能讓人變得偉大。'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 三、早晨空腹喝一杯水


    若能喝一杯以上更好，但至少喝一杯。在吃東西之前先喚醒身體，補充睡覺時透過肺部、皮膚和呼吸所排出的水分，稀釋黏稠的血液，促進腸胃蠕動，幫助排便。不僅是腸胃，還能刺激大腦的交感神經，幫助大腦從睡眠中甦醒過來，讓身體暢快。現代醫學有許多這方面的資訊，這是人類數千年的智慧。


    # 四、養成固定起床和睡眠的時間


    如果工作不允許有固定睡眠的時間，那麼不要妥協請於固定起床的時間。盼望大家每天都能照著以上說法，日出之前起床迎接太陽。固定作息是非常重要的品德。透過這些為自己創造信心，為他人創造信任。這樣的人首先會從他最親近的家人得到信任。


    如果早晨持續做這四件事，你的肩膀和腰部會自然伸直，整個人看起來變高。變得言行堅定，飲食單純。雖然年紀輕，但穩重可靠。雖為晚輩也能受到尊重，雖是下層的人，卻被當作領袖看待。這時若開始賺錢，金錢會讓你更加突出。這樣的人已經有了立足之地，也懂得分辨虛名，所以不會把錢花在奢侈或炫耀的事上。最後當然留下好因緣，斷絕壞因緣。'
  merge: -1
