  md: '億韓元。目前銀馬大廈的市價約二十多億韓元，兩者相差 1,000% 以上，算起來滿遺憾的。


    但是不必惋惜，我想如今仍然持有 1975 年購買的三星電子股票，並且還沒有賣出的人，除了李健熙董事長及他的家人之外，可能一個也沒有。因為抱著主人的心態等待的人並不多。


    # 是否該長期持有？


    從一般的投資風格來說，有短期投資家和長期投資家，而短期中又有超短期投資家，長期當中也有永遠不會賣出的投資風格。價值投資者則屬於稍微不同的分類。以價值為基準的情況下，也會變成短期投資家。如果購買後急速上漲，超過了標準價值，就會出現與持有時間無關必須出售的情況。我不會告訴大家長期抱持股票是好的，但我認為能夠長久持有、值得長期抱持的股票，是一種了不起的投資。


    安德烈·科斯托蘭尼（André Kostolany，投資教父，被譽為歐洲證券界偉大的遺產）也曾歷經波瀾萬丈；傳奇的長期投資家——日本股神川銀藏，也曾遭遇過幾次破產；彼得·林奇（Peter
    Lynch，金融投資人、富達公司副總裁）也曾經被迫辭職，但他很聰明，在這之前就主動離開了。他們都是長期投資者，但並非沒有經歷艱難。連最具代表性的長期投資家暨價值投資者——華倫·巴菲特，也因
    2020 年新冠肺炎引起的股市崩盤，'
