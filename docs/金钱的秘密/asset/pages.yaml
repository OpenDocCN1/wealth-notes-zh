  md: '# 10 你覺得以後

    股票會上漲嗎？


    > 金融市場是預測對了你就是英雄，

    預測錯了也不是罪犯，不會因此被起訴。


    有朋友問我這種問題，通常我不會回答。從 2020 年 3 月開始股票下跌後，有些後來才投資股票的朋友們滿心擔憂，到處詢問，最後來問我。或許因為我在經營事業，所以他們認為我的判斷會更有威信。他們心想要再加碼買進，還是要賣出，真是思慮煩擾。


    我不會回答這些問題，理由很簡單，雖然我有自己的答案，但這答案對提問者並不見得有效。誰也不知道暴跌的股票何時會上漲，不管多麼有名、擁有多麼了不起的投資紀錄，就算是一個國家的領導人也不會知道。雖然很多人會根據走勢圖來做技術性投資，或者根據過去的例子來大膽預測，但金融市場是預測對了你就是英雄，預測錯了也不是罪犯，不會因此被起訴。'
