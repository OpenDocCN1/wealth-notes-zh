- pgno: 186
  md: '因此時間讓我得以學習、遇見專家，又得到更好的情報。這樣的良性循環可以繼續下去。


    無論購買房地產還是股票，我絕對不會跟風。不管待售商品有多好，我會提出我計算的價格並伺機而行。我所設定的價格只是以我資本的規模和出租利潤為基準，對方提的價格根本不重要。雖然有些賣家對我提出的價格感到受侮辱，但如果我以對方的價格購買，那就是我的屈辱了。


    這就是「不」的精神。股票也是若達到我希望的價格，我就按著指定的價位買進，不必窮追糾纏。我會確認配息率，核算適當的價格，然後等候 1 個月、2 個月，甚至 1
    年。不必每次都想從市場獲利，我不認為別人的利益是我的損失，因為我可以從下一次的交易中獲利。如果不來討價還價，就不去討價還價。這是無情的戀人，就是「不，算了」。


    年輕時，我偶爾會去拍賣場買椅子、冰箱、推土機，甚至還買過馬。那時我一樣會設定好我想要的價位，若超過這個價位，就冷靜地轉身離開。有時我用 200 美元買到一匹馬，有時也會用
    1 萬 2,000 美元買到價值 6 萬美元的推土機。就是本著「不，算了」的精神。


    # 可怕的是貪婪和泡沫


    我不僅不害怕鬼魂或天然災害，反而覺得頗具魅力。剛上'
