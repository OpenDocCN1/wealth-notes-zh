  md: '別成為金錢奴隸


    來源不好的錢可能會傷害主人。要經常賺優質的錢，學習自我節制，對下面的人要寬容。對清潔人員、司機、餐廳員工或便利商店工讀生，要常常保持感謝的心。自己越是大富翁，對歲月和社会更要充滿感激的心。因為小財富可以靠自己的努力達成，但是大財富則需要社会組織和幸運的助力。


    若要確保致富的工具不會傷害致富的目的，就要懂得愛惜金錢、管理金錢。真正愛惜錢財就不會隨便對待它，也不會用溺愛來束縛它，總是把它送到好的地方。不受尊重的錢會永遠離開，被愛惜的錢會重新回到主人的懷抱。所以那些必須離開的錢，要像朋友一樣歡送它；回來的錢則像兒女一樣歡迎它。


    當金錢成為目的的那一刻，所有價值的標準都會變成金錢，而變成一家之主的金錢，最後來駕馭人。結果變成人為錢工作，成為金錢的奴隸。'
