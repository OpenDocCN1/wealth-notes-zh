- pgno: 95
  md: '圖之後，再確認倫敦布倫特原油的價格，瀏覽 investing.com、dividend.com、finviz.com 網站後，到美國聯邦儲備理事會的網站確認是否有新消息，若對財務報表有疑問，就到
    marketbeat.com，若對機構投資者的動向有疑問，則到 whalewisdom.com。我也會在 tipranks.com 和 seekingalpha.com
    等網站研究各個股票，進入霍華・馬克斯（Howard Marks）所經營的美國橡樹資本管理有限公司（oaktreecapital.com），查看是否有霍華的留言。最後是
    barrons.com（巴倫周刊），進到韓國財經興論網裡面，按順序瀏覽上傳的資料或 Pannet 及 Naver 金融，就結束了一天的主要工作準備。


    # 房地產要持續追蹤觀察


    如此瀏覽一遍要花費兩個多小時，接下來我悠閒地喝一杯咖啡，然後再去其餘的網站走一遍。我幾乎每天都会瀏覽 loopnet.com 網站，這是美國最大商業房地產銷售網站。我每天都在這裡確認我感興趣的城市所有的待售房產，特別要追蹤並確認我現在居住的地區，或者是我有房產的地區，如休斯頓、洛杉磯、紐約等地的所有待售房產。


    我會一年購買一、兩次房地產，所以要持續追蹤觀察才能知道價格的變動和趨勢。因為房地產和股票不同，價格的形成過程不明確，所以要不斷比較和追蹤才會產生概念。'
  merge: -1
  img_proc: true
