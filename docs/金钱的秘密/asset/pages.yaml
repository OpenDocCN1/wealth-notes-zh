  md: '# 18 為何存不了錢？


    沒有投資的錢是死的，放在櫃子裡不動的錢，等於吞了通貨膨脹的毒藥，慢慢的死亡。


    無法存錢的人最大的藉口就是收入少、錢不夠用，但錢不夠用的原因是貪吃卯糧，造成這種情況的罪魁禍首就是自己。此刻流逝的時間，已經堆砌成過去，最後必須為現在和過去負所有的責任。


    有些人認 要用的錢多但收入不足，所剩無幾的錢要投資也太少，所以根本存不了錢。但是這樣的人就算收入增加，還是會說同樣的話。因為收入增加，花費也會增多，依舊刷信用卡預支未來的收入。我看到很多人雖然收入非常高，或經營事業賺了大錢，但用錢習慣依然一樣。可見這不是收入多寡的問題，而是生活態度的問題。


    除非貧窮到三餐不繼、居無定所，否則任何人都可以透過積蓄財富及投資來成為富有的人。我敢斷言那些使用信用卡的人、每次不小心遺失物品的人、看輕小錢的人、不儲蓄的人，'
  merge: -1
  img_proc: true
- pgno: 71
  md: '以及不懂得投資的人，絕對不會成為有錢人。這樣的人財富偶爾會登門造訪，但立即轉身而去。


    # ## 剪掉信用卡


    千萬不要把未來的收入挪來現在用，要剪掉信用卡，使用現金卡付款。不要想著信用卡公司贈送的點數，那不是信用卡公司白送的禮物。積點數的核心意義是「多使用、為累積點數而購買」，就是利用累積點數的優點，增加不必要的消費，以累積點數的方式吸引消費者購買，這就像殺雞取卵一樣。雖然現在現金不足，但仍可以用未來的收入購買想要的東西，加上還可以累積那少少的點數，以此打破了消費的戒心。


    最常見的辯解為「反正那些東西早晚都要買，還能累積點數，這豈不是很聰明的道理？」但如果這邏輯是正確的，信用卡公司應該早就取消積點系統了。如果停止刷信用卡，從本月開始使用現金卡或現金來購買物品，會發現不必要的支出明顯減少，而且會看到更多的利益。為了累積價值
    1 萬元的點數，就要有 100 萬元的消費，其中有幾十萬元是不必要的支出。使用信用卡真的是愚蠢的行為。


    # ## 愛惜物品


    還有不謹慎管理物品的人，也不會成為富有的人。他們把'
  merge: -1
  img_proc: true
- pgno: 72
  md: '物品或商品當作無生命的東西，隨便對待它。所有的東西都是生命的副產品，是由大自然的材料和人類的時間結合出來的，都出自生命。最好用漂亮的貼紙或標籤，將名字貼在長久使用或隨身攜帶的物品上。貼著物主名字的物品，瞬間就有了生命。即便遺失了，也會奮力地找到主人。物品帶回家裡之後，要放在固定的位置，使用後需要清潔或管理的物品，應立即擦拭以免損傷。偶爾使用或每逢季節才用得到的東西，應妥善管理，包裝整齊，防止沾染灰塵，以便隨時拿出來再用。財富會黏著愛惜物品的人，因為財富的型態終究是物品。


    # ## 從小開始


    小錢是大錢的種子，是變成資本的幼苗，所以隨便對待種子，不懂得照顧幼苗的人，無法養育出任何東西。積攢小錢，預備種子基金，再慢慢創造投資或事業的「引水」，才是成功的基礎。沒有打好基礎的臨時建築物，叫做組合屋，它無法蓋很大，風一吹就飛走了。所有的投資都是從小錢開始，從小額開始的投資經驗，會帶來大筆投資的機會。匯集到一筆資產之後，就要投資。沒有投資的錢是死的，放在櫃子裡不動的錢，等於吞了通貨膨脹的毒藥，慢慢地死亡。


    那些被不了解投資或未有投資經驗的主人帶走的金錢，其下場不是孤獨死，就是見機逃走。現在就請各位把書闔上，拿出剪刀剪掉信用卡，這是成為富翁的第一步。'
