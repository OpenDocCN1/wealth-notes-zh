- pgno: 233
  md: '售出了。當我在全球 11 個國家，成為擁有三千多個商店和 8,308 名員工的全球餐飲企業大股東的那一瞬間，那業界傳奇的競爭對手，卻透過退場策略從經營者的位置上退下了。他直到最後都是一名傑出的經營者，他心知肚明，因著我們公司他吃了多少苦，經歷了許多困難，但他從來沒有用不正當的方法，或是違背道義的動作來競爭。一名優秀的競爭者走進了歷史。


    當我們還是弱者的時期，我沒有懼怕。但是我知道或許總有一天有一個無名小卒的公司，會以它獨特的創意和熱情來牽制我們的腳步。我們只進攻的那段日子已經過去了，我明白當我們成為強者兼具防守和進攻的那一刻，若稍不留意也會被弱者擊倒。因為能擊倒我們公司的不是強者，而是弱者。


    土湯匙不必懼怕金湯匙，因為是金湯匙，所以它擁有的優點，可能也是缺點。一隻體型龐大的大象或長頸鹿，一旦坐下來要站起來就有點難。相反的，這期間狐狸已經蹦蹦跳跳幾十趟了。找出差異性的變化，並快速行動是弱者的優點。再強壯的男人都無法與那睜大雙眼、脫掉上衣、奮力衝過來的男人爭鬥得勝。


    想法改變，就會發現弱者不是強者的食物，強者才是弱者的食物。結論是，強者之所以是強者，不在於他已經擁有的，而是下定決心要成為強者的人才是真正的強者。歷史的流動總是如此。'
