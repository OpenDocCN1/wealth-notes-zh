- pgno: 89
  md: '億韓元以上的人當中，有 20% 的人也不認為自己是富豪。財富的標準是非常相對的，所以韓國的富豪，有一半不認為自己是富豪。


    # ## 富豪增加財富的方法


    這些韓國富豪，大部分是以營業收入（47%）和房地產投資（21.5%）成為富豪的。他們經營業業賺錢，將資本盈餘投資在房地產上，並且每月儲蓄 500 萬韓元。他們增加財富的方法就是儲蓄，平均儲蓄
    12 年，創造出 5 億韓元種子資金作為投資資金。創造此程度資金的平均年齡為 44 歲，這些資金主要投資在房地產（61.6%）和金融資產（35.1%）上，但資產運用的核心目的主要是維持現狀，因為知道守財不容易。


    但是我認為一般富豪的標準有三個：第一是擁有屬於本人的無貸款房屋，第二是超過韓國家庭月平均收入 5,411,583 韓元的非勞動收入。


    如果一個人住在江南區價值數 10 億韓元的公寓大樓裡，年薪上達億元，但有一筆貸款，需要從工作中獲得收入，就不能算是富豪。我認為一個人雖然發生某種經濟問題或身體受傷，但有屬於自己的房子，還有平均所得以上的收入之保障才是富翁。如果想要擁有
    500 萬韓元以上的非勞動收入，則必須將 20 億韓元以上的資產投資在房地產或金融資產裡面。'
