- pgno: 42
  md: '# 「不知道」才是正確答案


    儘管靠近這些領域的人，都是經濟學家或分析家，但沒有任何證據顯示他們比其他特定職業的人士富有。具有這種特別能力的人，不會在有關談論經濟的節目中，對景氣發出預測的言論。


    他們大都悄悄地出售衍生商品，並擁有一所大學或一家廣播電台，或者成為世上所有企業的最大股東。偶爾有因預測正確而出名的人，但是與其他人相比，他下次的言論能持續發燒的機率並不高。這就像丟鋼板一樣，猜對一次正面的人，也不能保證下次猜對正面的機率比其他人高。


    然而比起他們說的話更可怕的是，聽了這些意見後，將全部財產都押在這上面的人。沒有人知道明天有哪些特定的股票會漲跌，連我身為經營者，都不知道明年的公司會如何。那些以專家的頭銜預測利率升降、股價漲跌的論點，只是他們個人的意見罷了，不代表比其他人的意見更重要。因此當有人問專家或明智的投資者：「這支股票會上漲嗎？」「未來的債券市場會如何？」「從現在開始會反彈嗎？還是會再下跌呢？」通常他們的回答是：「我不知道」。


    「不知道」才是正確的答案，因為未來不是在過去的數據模式內形成的，而是新的未來匯合在數據裡而已。所以沒有規則，而且每次都會發生意想不到事。'
