- pgno: 282
  md: '# 17 靠禱告不能致富


    > 機會和運氣不只屬於相信神的人，

    它會接近所有的人，

    每個人只是需要努力和智慧來判斷機會。


    神不能把你變成富翁，如果能靠著神的恩典成為富翁，那麼這世界的富翁都應該是相信宗教的誠實人，而想要效法他們成為富翁的人也都還會相信神。在不信神的人當中也有很多富翁，而信其他宗教的人當中也有很多富翁。


    神不關心能否把你變成富翁，祂無法製造錢，這是神無法做到的事之一。


    無所不能、賜予所有祝福的神很奇怪，祂竟然把錢託付給人。這世界所有的宗教都一樣，無論多麼偉大、住在多麼雄偉建築裡的神，最後都會變成紀念品，因為人比神更懂得賺錢。


    錢必須由自己賺，如果你是真正的宗教信仰者，你不會買一張彩券向神禱告希望中獎，並且說會把錢用在善事上。也要放棄認為自己只要誠實生活，總有一天神會讓你發財的願望。'
  merge: -1
  img_proc: true
- pgno: 283
  md: '富有不是靠禱告和誠實達成的，而是靠努力和智慧、機會和運氣。機會和運氣不只屬於相信神的人，它會接近所有的人，每個人只是需要努力和智慧來判斷機會。


    # 他們是否比你更富有？


    另外，像算命師、巫師、觀相學家、占星家或塔羅牌等，無論那叫做什麼職業，在詢問他們有關金錢的方向之前，要先弄清楚他們是否比你更富有。如果他們比你窮，就不用多問了；如果他們比你更富有，那麼你想比他們更富有就難了。


    有時他們的占卜能救你，但除了善變的幸運之外，沒有任何或然率可言。到目前為止，在我的人生中，我從未倚靠過超自然的力量或信仰。以後我也沒有這樣的打算，也不會為了經濟上重大的決定而尋求神。如果是不能用考查或學習來解決的部分，我會利用直覺。也許向神禱告可以得到保護，但神保護不了錢包。倚靠超自然的心態就如相信夢是現實一樣，這種心態會造成非常危險的財務狀況，最後甚至導致破產。


    有一段時間，因朋友的介紹我認識了一位相當有名的算命師。他的辦公室裡有許多高級政治人物和知名人士的痕跡。他拿起一杯茶與我面對面坐著，靜靜地望著我的臉，突然他放下還沒到口的茶，便拉著我走了出去。他帶我到附近的一家餐廳，'
  merge: -1
  img_proc: true
- pgno: 284
  md: '我不知道他怎麼知道我喜歡烤魚，他也沒問我就點了各式各樣的魚。當一道道菜擺滿了桌子時，他認真地問我：「拜託！請教教我賺錢的方法。 」


    那一瞬間我確實明白了，一個很能預測未來的人，面對錢就沒轍了。我建議他以《周易》命理學為主，設立一個生辰八字算命的網站。他說他第一次聽到這種建議，又說怎麼能用網路算命，揮揮手表示不能認同。我想那位算命師可能還在那辦公室裡卜卦賺錢，並漸漸老去。'
