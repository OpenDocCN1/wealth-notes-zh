  md: '·現在我才開始到個人感興趣的網站，我會各選一個美國和韓國的幽默網站，以及博覽會網站、亞馬遜、Netflix、韓國網絡書店、Facebook、Instagram等，如此繞一圈結束上午的工作。我每天都做這些事，以從中獲得的資訊或資料為基礎來決定事業的方向或投資決策。每天瀏覽這些地方，若發現更好奇的部分或相關的書籍，就會立即訂購閱讀並彙整。不管是什麼，都會將它建檔儲存，並列印後放進文件夾裡。將有關持有股票資訊、房地產買賣資訊、年度報告書以及一般股票資訊等，用正式的標籤貼在文件夾上，按照項目區分，將它存放在座椅後面明顯的位置保管。


