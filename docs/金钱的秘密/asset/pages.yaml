  md: '# 04 守護財產

    所要做的事


    我會花很多時間蒐集、區分和了解資訊，學習和蒐集資訊都不能懈怠。


    我已經不需要按時到公司上班了。我透過董事會來參與、管理我所擁有或持有股份的各個公司，所以除非有董監事會議，我都在家裡工作。除了和我一起工作的幾名總經理之外，直接受我指示的職員有常駐在韓國和美國的兩名執行祕書而已。除此之外，平常也與律師、會計師、財務管理師和幾家主要往來的銀行財務經理們商談工作。


    我認為內容冗長又細密的報告書是為了撰寫報告用的，所以我請每位總經理每週一次，提出兩百字左右簡單的文字報告，幾乎沒有聚集或碰面。若有總經理每次做決定時都來詢問我，我認為這代表他沒有能力或資格勝任此工作。只有三種情況我才會參與各個公司，如申請到增資或者想要進入其他事業群的時候，以及總經理任職或罷免的情況。'
  merge: -1
