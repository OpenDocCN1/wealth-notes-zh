  md: '另外，因為我知道市場會變成什麼樣，所以已經根據此情況來投資。當然我也不知道這個市場下個月或明年將如何，而且那也不是我該關心的問題。但是我很清楚明年或5年後的情況會是如何。


    # ### 股票獲利不能有的習慣


    現在各位應該知道答案了吧？把時間再延長一點，覺得10年後會怎樣呢？如果是這種程度，應該任何人都知道答案。問題是愚蠢的，因為大家都知道答案。只要根據知道的答案作答就好了，但是因為操之過急，所以為那未知問題苦惱不已。


    一個人用可以等待10年的資金來投資，但是在市場的暴跌中，卻害怕更多的暴跌，這是不合理的思維。如果不斷地暴跌，股票的價格就會跌破公司的淨值。不是風險消失的程度，而是本身已超過損益平衡點。從此開始，市場的高手和資本家將會參與其中，他們會計算股票的淨值，以撿到精品一樣的心情來搜購股票。一般人擔心股票再下跌而猶豫不決的時候，大打折扣的機會就結束了。幾天之
    前還是高價銷售的名牌商品，就在幾天之內全部的商品變成打七、八折，這時當然要購買不是嗎？更何況該商品不是消費財，它以後還可以再以高價出售，而且中間還會有分紅，所以當然會瞬間搶購一空。對某些人來說，黑色星期一就是黑色星期五。'
