  md: '# # 20 財富的特性


    > 努力生活，並不表示能賺很多錢，

    賺很多錢，並不表示一定能成為有錢人；

    成為有錢人，並不表示就會幸福，

    財富不是生活的目的，而是工具。


    如果每個人都是因努力生活而成為富翁，那麼這世界早就公平了，每個人都應該早就是富翁了。我們的父母真的非常努力地生活，但沒有像富翁一樣退休。努力生活可以解決溫飽，但是真正要成為富翁，光靠努力是不夠的。


    其原因是方向不正確。努力的人以為勤奮可以解決一切，所以想用增加工作量來成為富有的人，但是透過工作和儲蓄來致富是有限度的。


    他們因為工作太繁忙，沒有學習讓資產自動運作的方法，也不關心投資或市場的資金流動情形。他們沒有學習存錢的方法，也不懂得將儲蓄的錢增大。當其他資產上漲時，好不容易買到一棟房子就結束人生，徒留努力工作的名聲。'
