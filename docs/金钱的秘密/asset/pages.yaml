  md: '# ## 40 歲成為富翁算太快


    快速致富的唯一方法，就是不要有速成致富的心態。一個走在白手起家之路的人，40 歲能成為富翁都算太快。在二、三十幾歲快速致富的年輕人當中，能夠一輩子持有這些財富的人屈指可數。所以成為富翁的最佳年齡是
    50 歲以後，若年紀輕輕就成为有錢人，會比較缺乏管理財富的技術。因為投資或經營業事所得的利潤更吸引人，而儲蓄和維持財富的能力，與所擁有的財富相比顯得很脆弱，所以後來再次變貧窮的機率很高。


    想要速成致富的心態背後是，擔心被比較或者想炫耀自己。財富像建造房屋一樣，需要慢慢地堆砌。


    無論什麼年齡，要學習各種賺錢的技術、存錢的能力、守住金錢的能力以及用錢的能力，50 歲都難做到。這四種能力就像餐桌的四隻腳，其中有任何一隻腳長短不一或斷掉，桌上攤滿的食物必然翻倒。所以我們應該丟棄快速致富的想法，而是去預備種子資金，學習複利和投資以及經濟術語，擺脫金融文盲。


    拚命地節省，創造 1,000 萬或者 1 億韓元的種子資金，減少貪慾，逐漸擴充資產；當那資本利潤超過勞動所得的那一天，就是變成富翁的日子，也是自己經濟獨立的紀念日。我們會永遠紀念這一天，它將是我們和家人的自由之日。這樣致富的人不會再變窮，而且財富代代相傳。這是最快的致富方法。


    不要急著致富，最快致富的方法就是先將這一點銘記在心。'
