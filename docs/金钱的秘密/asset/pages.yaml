- pgno: 104
  md: '金是縮減的。因為現在銀行支付的利息為 1.75%，所以在儲蓄的那一刻，錢就開始消失。


    # 儲蓄是致富第一步


    定存也相差無幾，雖然偶爾有吸引人的 5% 左右利率，但僅限於小額或前面幾個月的優惠，這些大部分都是廣告商品。單靠儲蓄不會成為富有的人，但儲蓄仍然是致富的第一步。要成為富有的人，則需要種子資金，而必須利用銀行才能存到這種子資金。若能機靈地利用儲蓄銀行或農會金庫，便可以找到利率
    3% 以上的商品。當然銀行也有可能倒閉，所以本金最高保額必須在 5,000 萬韓元再投入儲蓄。


    財產是「資本 × 投資利益率 × 期間」的總和，也就是用多少資金，以多少的收益率，存多久的時間。如果想到 10 億韓元的財產，只要將第一筆的 1 億種子資金，以
    10% 的利潤，在 25 年期間以複利堅持不懈地累積就能達成。假設我現在 30 歲，到 55 歲時就會成為富翁。


    如果現在是 30 歲，將致富的目標設定在 45 歲，那麼每年就要有 16.5% 的複利利潤。若現在是 25 歲，用 5,000 萬韓元 16.5% 的利潤一直到
    45 歲，便能成為 10 億韓元的資產家。越早開始越有利。在 25 歲存到 5,000 萬的種子資金是不容易，但要連續 15 年以上支付 16% 以上的利潤，更不是件容易的事。'
  merge: -1
