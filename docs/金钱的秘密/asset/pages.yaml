  md: '板上。這動作可能會產生灰塵，所以要打開窗戶。然後站在被子的正中央，向著屋內四面各鞠躬一次，並輕聲說：「家裡的東西你們好！今天我將伺候大家，做一番整理。」


    # 練習與物品道別


    打完招呼之後，把家中抽屜裡所有的東西拿出來放在被子上。不可以用倒的，要像撿雞蛋一樣，有條不紊地一個一個放在被子上。這樣便知道自己收集了多少沒用的東西，你會發現原來有這麼多從未用過的東西，它們毫無頭緒地混合在一起。


    你可能會覺得很羞愧，而且必須要感到羞愧。現在請你跪在地上（帶著謝罪和尊重），拿起其中一樣東西，感受一下它是否讓你心動。雖然不知道該如何正確地形容這種悸動，但是可以問問自己是否仍然愛它、想要收藏它。這是日本收納女王近藤麻理惠推薦的方法。


    將那些仍然心動的物品放在右邊，對那些不再心動的物品說：「謝謝這段時間」或者說：「把你擱在一邊沒有使用，對不起」，或者說一聲「再見」之後放在左邊。無論是多麼瑣碎微小的物品，都以同樣的方式道別後分類。分類完，左邊物品中若還堪用的東西，就把它捐出去或賣掉，該丟的就丟掉。接下來，右邊的物品不要原封不動地放入抽屜裡，要按種類分類，在一個抽屜裡放一樣物品。'
