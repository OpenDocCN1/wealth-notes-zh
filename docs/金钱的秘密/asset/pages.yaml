  md: '# 02 靠股票獲利者的

    三個特點


    在股票市場上，清楚知道股票和股票交易來龍去脈的人，能夠長期賺錢，

    他們是非常了解市場功能的人。


    從股票虧錢的人比從股票賺錢的人更多，這恐怕是事實。

    在所有的資產市場中，普遍的現象是輸家比贏家多，所以富翁少窮人多。尤其是股票市場，虧錢者較多的原因是任何人都能自由地進入市場，而且可以用小小的金額投資。


    大家每年都說經濟不景氣，但在 2020 年 3 月市場暴跌中，

