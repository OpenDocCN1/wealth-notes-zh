  md: '不如買可口可樂；比起 Mastercard 卡，我會買 Visa 卡；比起富國銀行，我會購買摩根大通。但我也會注意那靦靦第一名的第二二名，例如比起投資沃爾瑪（Walmart），我也會投資像好市多一樣讓第一名忐忑不安的第二名。因為它可以成為一頭年輕的獅子替代老獅子，但是對第三名就興致缺缺了，在我的頒獎台上，根本沒有第三名的位置。


    總結投資原則與標準如下：


    +   1. 遠離一切快速賺錢的工作。

