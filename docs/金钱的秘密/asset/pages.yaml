  md: 請越早起步越好，如果從十幾歲或二十幾歲開始培養觀察產業的眼光，也在職場生活中不斷地投資，我想在 40 歲左右，你的資本超越薪資所得的日子就會來臨。那時你的同事們可能銳氣已減弱，但是你已經是自由的有錢人了。回顧自己年輕時，何等需要有人如此提醒我，想到就覺得自己實在很愚蠢。所以盼望各位從今天起立刻購買一張優良公司的股票。
