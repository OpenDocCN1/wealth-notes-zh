    若想得到人的尊重，就先尊重他人；同樣的，若渴望自己的錢得到尊重，就要懂得尊重別人的錢。即便那是我持有100%股份的公司，我也只在符合公司用途的情況下使用法人信用卡。而且我去自己公司的賣場買東西，也一定會付錢。因為相關公司的負責人或各賣場的經理，是根據營業利潤的水平來獲得實際業績，如果我隨便拿走東西，就是讓他們的利潤績效虧損，就算是一塊錢也是別人的錢。還有，繳稅是國民應盡的責任和義務，假設在我的農場開一條馬路，或在小溪上蓋一座橋，也要花費數十億；而我們不用花一分錢，就可以花一個小時跨越相隔很遠的城市，這都是因為有很多人向政府繳了該付的稅金。'
