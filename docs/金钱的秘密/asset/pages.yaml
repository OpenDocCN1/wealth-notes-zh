    10%，以首爾的一棟公寓平均價格 8.2 億韓元來計算，此金額可購買 5 萬棟公寓。韓國人平均每戶家庭資產為 4 億韓元左右，這代表平均家庭中的 10 萬戶家庭，其全部的資金正在等待購買股票，可見規模之龐大。'
