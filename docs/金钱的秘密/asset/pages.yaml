  md: '# 10 財經專家真的能預測景氣嗎？


    未來不是在過去的數據模式內形成的，而是新的未來蘊合在數據裡而已。所以沒有規則，而且每次都會發生意想不到的事。


    沒有！一個也沒有，以後也不會有。當然在短期特定的時段是有可能的，但是沒有人能預測宏觀經濟（macroeconomics）的景氣狀況，也沒有預測正確的。就像透過風箏的飛行，便知道風吹的方向，但是當氣球隨著風颳起的時候，我們無法知道它會往哪個方向飛。尤其，就算學者或專家預測幾個月或幾年後的景氣，我們也不能將他們的話當作事實。


    雖然總有些部分或某個人的預測是對的，但這就像算命先生所說的話一樣，對某些人來說是對，對另一些人卻可能是錯。只是所公開的部分是過去猜對的經歷，錯誤的部分則不提，所以呈現出來的仍然像專家一樣。若有人能找出景氣模式的原理，可能在一年之內就會成為世界上最富有的人，而數年後就能賺得全世界的財富。'
