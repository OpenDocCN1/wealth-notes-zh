  md: '2018 年，韓國銀行出版了一本《700 個金融經濟術語》的冊子。目的是向國民傳達正確的經濟概念，提高他們對金融的了解。總之就是幫助民眾在經濟方面能有合理的決策，相關文件可到韓國銀行網站免費下載。這些術語是所有從事實際經濟活動的現代人都必須學習的，我覺得這個教育應該編入高中的正式課程裡。


    以前住在農村的老人沒有受過教育，不認識字，所以常常會請郵差幫忙讀他們兒子寄來的信。不識字的中世紀歐洲人，也只能聽從神職人員讀給他們的聖經解釋和教導。因為他們看不懂字，不知道如何直接與上帝溝通。不識字的文盲活得悲慘又貧窮，電腦文盲也一樣。不懂得使用電腦和智慧型手機的方法，不太容易找到工作，連外送的工作都不能做。因為外送員為了處理業務，必須同時盯著好幾支智慧型手機，送貨只是他


    # 01 拒當金融文盲


    要有豐富的金融知識，收入才會增加，也可以保護財產，因此可以說金融理解力的本身就是一項了不起的生活工具。'
