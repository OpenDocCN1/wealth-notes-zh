  md: '# 存摺裡的錢如冰淇淋一樣地融化


    但是這些資本並非都能獲利，其中有許多人的會虧損，只有一部分的人能創造出利潤。會虧損的人特徵如下：


    第一，他們只是跟著進入股市。第二，沒有購買的計畫。第三，資金的力量薄弱。奇怪的是，他們積攢財產的時候，像對待兒女那樣的愛惜、觀察，但投資的時候，卻像參加團體旅遊一樣只是跟著走而已。靠血汗賺來的錢，就這樣付諸流水了。


