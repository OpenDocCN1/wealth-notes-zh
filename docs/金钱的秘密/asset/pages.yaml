- pgno: 107
  md: '資大師們寫給股東的信或他們自己所寫的書籍，會覺得好像讀 的是同一本哲學書。他們會解釋有關股價的波動和政府債券的 利率趨勢，其實是用數字來呈現人類的慾望和挫折罷了。


    # 第一件事就是學習


    一個年輕人想要學習事物的事理，以獲得世界至高無上的 真理，他所要做的事第一件就是學習。35歲成為佛陀的悉達多 （釋迦牟尼），也不是只停在菩提樹下繼續悟道而已。起初他
    拜婆羅門苦行者為師，進行禁食和打坐等各種苦行，也從婆羅 門教的修行者那裡學習瑜伽。後來釋迦的父親終於意識到他兒 子並不想繼承自己的王國，於是派了5名老師來教他的兒子6
    年功課，他等於接受了5名大學教授的課外輔導。


    耶穌的〈登山寶訓〉被譽為他教誨中的經典。1947年，在 以色列和約旦之間死海附近的昆蘭洞穴中，發現了猶太教艾賽 尼派（Essene）的古文獻。猶太支派中的艾賽尼派是重視禁慾、
    公義和敬畏的支派。這是當時為了躲避掌權者撒都該人和法利 賽人的迫害，而將這些文獻藏在山洞裡面。這份古文獻包含了 耶穌的〈登山寶訓〉。此外，在初代教會的組織和用語當中，
    還遺留著許多艾賽尼教派的痕跡。這些文獻是在耶穌出生前150 年寫成的，由此推測耶穌曾接受過艾賽尼派的教育，耶穌並沒 有獨自做木工自學。'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 獲得智慧的方法


    這些達到神境地的人都需要學習，更何況我們。學問是我們獲得智慧的器皿，想要盛裝智慧的聖水，就需要帶著器皿去。或許我們覺得像英文和數學之類的學問，對獲得智慧有什麼幫助？其實學習另一種語言，就是把不同的文化全部納入我們裡面；而學習數學是以一般人都能接受的型態來理解人類社會的價值體系。


    學習基礎學問是一件枯燥乏味的事，因為有很多必須死背的東西，但是若跳過這些必須背的過程，就沒有獲得智慧的方法，因為所有的智慧都要用語言和文字來表達、解釋。要成為投資大師，就必須精通語言和數學，這樣才能了解世界和事業。


    一個人經歷如此長時間的成功和失敗後，才能在這極其世俗的投資世界裡，產生屬於自己的哲學。我認為無論那是什麼，在某一領域成為大師的人就是哲學家。我相信偉大的哲學家，不僅呈現在思想的領悟當中，更是在極其枯燥無聊的學習和身體力行之下誕生。'
