  md: '# 強者是弱者的食物


    世界最強的美國也在越南戰爭中敗北。同樣的，在企業界裡也有非常多弱者擊敗強者的故事，或者說全部都是弱者得勝也不為過。我們已知的企業像沃爾瑪、微軟、蘋果、星巴克、亞馬遜、谷歌、特斯拉等超大型公司，10
    至 20 年前也都是弱者。韓國最大的企業三星，也是從大邱賣乾麵的小餐館起家，漸漸開始銷售上面標示三顆星的「星牌」包裝麵條，後來才轉變為三星。而現代公司是一名在首爾經營「京一商會」米店的年輕人創立的公司。曾在晉州經營紡織業的具先生和親家許先生，直接將原料倒入大鐵鍋裡生火，生產出國內最早的
    Lucky Cream 保養品，後來逐漸擴大成現在的 LG 公司。


    因為我們只看見他們已經變成強者的樣子，所以無法想像他們曾經都是弱者。他們擊敗了強者，登上今天這位置。他們的策略如出一轍，有別於現有市場的強者。他們將第一名的力量削弱，登上了這位置。強者有強者的弱點，因著那弱點，與看似不成對手的弱者爭競時，巨大的強者屢屢遭挫。


    由於強者本身規模很大，所以要花很長的時間才能發現外在的變化，即使發現了，執行的速度也很慢。因此，當弱者轉換策略，以很快的速度和執行力來挑戰時，成功率很高。弱者一直停留在弱者的位置上，不能成為強者的最大原因，就是不'
