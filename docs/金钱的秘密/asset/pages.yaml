  md: '因龐大的損失而賣出了。悲觀的專家們說，這次恐慌絕對不可能 V 字形反彈，也有人說是 W、L 或 U 形，眾說紛紜。


    # 在恐懼當中看到的希望


    事實上沒有人能預測未來，我決定只相信事實。在那恐懼當中，仍然有人看見希望，我很好奇他們的希望是什麼。3 月中旬恐懼達到頂峰時，我開始購買股票。其實我也很害怕，所以我用大約三分之一的現金資產收購，並且為持續下跌的情況做好防備。我在這場恐懼當中看到的希望，不是新冠肺炎病毒的累積總數，而是發生的比率和發生的期間。大部分的國家，在疫情達到高峰之後，下降趨緩的時間約為一個月。確認人數每天都在增加，所以總計圖表的曲線是上升的。可是發生比率は與前日相較，確認人數增加了多少，所以曲線圖是下降的。大多數的國家在疫情發生的初期都掉以輕心，因而導致疫情增加；當恐慌達到最嚴重時，開始呈現趨緩的模式。我注意的焦點是發生比率，而不是確認人數。若以發生比率作為基準，可以看到一旦過了最高點，新冠病毒就得到控制和趨緩。


    比起目前的情況，市場更害怕這種不確定的景況，所以在不能決定股票市場的未來。其實這是每個人都知道的事，但是並非每個人都看得懂那呈現事實的未來。我的投資是否會成功，數年後才會揭曉。但是有一個非常確定的事實，就是當道'
