  md: '# 要懂得管理支出


    賺很多錢，並不表示一定能成為有錢人。為了成為有錢人，比起會管理收入，更要懂得管理支出。當開銷變大，奢侈增加時，就要賺更多的錢，但那些錢往往不是固定的薪水。收入減少，開銷卻未縮減，所以收入全部變成了支出，最後資產必然也跟著縮減。


    富有不是來自收入的規模，而是來自支出的管理。不要隨便對待小錢，要縮減所有的經常性支出。最好的收入就是定期進來的錢，最差的支出就是定期支出的錢。每個月自動轉帳的錢無論有多瑣碎都應減少，不要被一個月
    10 萬元的數字矇騙，因為在這 10 萬元的背後掛著冗長的 36 個月。一份為期 3 年，價值 360 萬元的合約，每次要支付 10 萬元。


    變成有錢人並不表示是幸福。因為要守護的東西變多，所以有更多的不安和擔憂。往上看更有錢的人，就顯得自己寒酸；往下看窮困的人，便發出哀嘆。到銀行未見分行經理打招呼就生氣，要排隊等候就會抱怨。家人们只有在花錢的時候才會聚集在一起，親戚們只有在借錢時才出現。有錢人的財富當中，若有不正當的收入或搶來的錢，就會擾亂家庭。


    侵吞稅金的錢會變成凶器，意外之財的好運必到處炫耀之後消失無影。'
