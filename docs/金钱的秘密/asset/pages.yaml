    911 恐怖襲擊等重大歷史事件，發出預言的中世紀預言家諾斯特拉達（Michel de Nostredame），他的預言雖有歧義卻仍舊存在，留給人隨意解釋的空間。在認同科學事實的人當中，也有許多人仍然相信人類沒有登陸月球。只要他們相信自己是對的，那些便成了他們的信仰，不再需要邏輯或證據。


    在 1960 年代，阿波羅計畫集結了美國所有力量，而有 75 萬人與這計畫有直接或間接的關聯。若以人類沒有登陸月球的陰謀論為前提，沒有人反問有這麼多人參與並進行了這龐大的計畫，那麼如何保守了此驚世之舉的祕密。對這事實的懷疑逐漸擴大時，美國太空總署
