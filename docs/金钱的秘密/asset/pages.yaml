  md: '# 08 接住掉落的刀子


    越是預測市場情況、掌握具體數字和時機的專家，越會用完美的數據和言論包裝恐怖後傳遞出去。


    要接住掉落的刀子（股價下跌），就必須知道公司的價值，而非價格。如果市場的變動性低於該價值，就要分期買進。因此，要有投資的原則，而投資的原則是當你清楚該公司的價值時才能實行。有很多人常拿出投資格言：「不要接掉落的刀子」、「絕對禁止加碼買進，將停損當作投資指南」，然而這樣的教導是針對那些靠技術投資或動量投資者說的。


    對於那些價值投資的人來說，當刀子掉落時，就是買進的時候。只是實際發生那種情況時，要接住掉落的刀子是相當恐怖的。但是那時候沒能接住的人，等跌得越多就越無法接住了，最後就遠離投資。


    當刀子掉落要去接住時，若戴上皮手套會如何？這雙皮手套的一邊是分期買進，另一邊是確信公司的內在價值。當股價'
  merge: -1
