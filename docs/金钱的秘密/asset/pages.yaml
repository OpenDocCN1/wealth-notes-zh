  md: '# # 18 跳脫政治傾向

    來解讀經濟


    > 如果一個人的政治理念完全偏向某一方，

    就會失去理解經濟的能力。


    這句話的意思是不要因為政治信念，而帶著偏見來解釋經濟。許多新聞媒體在經濟報導中常隱藏著某種意圖或目的，所以不要原封不動地從表面來理解此類的報導。經濟新聞常常是負面的報導，負面新聞比正面新聞較受讀者注意。猶如走在路上，聽到「啊！小心車！」比「樹開花了」更引人關注一樣。


    美國經濟新聞的言論，也是其中六成為負面性新聞，而韓國的負面新聞則超過八成以上。以負面為基礎的新聞使媒體具有監控的功能，由此可知為何負面新聞所占比率較高。因為新聞媒體的主要立場是「做得好是理所當然，做不好就應該被批評」。說到這裡，這些只是我對新聞媒體善意的解釋。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 媒體與政治的影響


    新聞媒體的問題之一是會扭曲經濟報導，將它變成政治新聞。對於同樣的情況，有一篇可能會這樣報導：「慘不忍睹的私人企業……有 1,600 家停業」，或者：「去年自營業者的歇業率，創下
    10.98% 的歷史新低」。輿論就是根據新聞報導，歸咎於「經濟失敗」。或相反的，如 1997 年外匯危機當時，有國外的媒體不斷報導韓國可能會發生外匯危機，在這種情況下，韓國新聞媒體的報導竟然是「完全沒有問題」。甚至當時國內媒體所寫的社論是：「不要助長經濟的危機感」、「不需要對經濟抱持悲觀」。


    這些報導都不是經濟新聞，而是政治新聞。因此如果一個人的政治理念完全偏向某一方，就會失去理解經濟的能力。如果對實體經濟誤判，稍有不慎就會導致投資失敗。


    政治色彩的不同最會讓人互相嫌惡，反而不同的宗教比較沒有問題。學歷或財產規模的差異，在成為親密的朋友之後，也比較不會有太大的問題。在臉書上沒有聽過因宗教不同而斷絕朋友關係的消息，但屢見因政治傾向不同，就當面毫無顧忌地把對方刪除的情況。在政治傾向極端不同的人之間，有時情緒激動到甚至不惜殺人。我們都曾從歷史記載中，看見實際互相殘殺的情形。雖然在世界歷史上，曾經因宗教衝突而爆發過戰爭，但其中還是隱藏著打著宗教旗號的政治利害關係。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '最 deep 層的情感差異來自政治，因此完全支持某一方的強烈政治傾向者，在新聞媒體中也只會看符合自我傾向的報導，他的想法、判斷都偏向一方。事實上政治傾向本身不是問題，只是在面對經濟新聞時，我們一定要明白必須以實際數據來參考並判斷事實。對於帶有偏頗的標題或言論，要隨時保持懷疑。


    投資或事業若走錯一次方向，便可能從競爭行列中遭到淘汰，甚至破產。當房價暴跌，造成恐慌，以致現金枯竭時，會突然出現「房價上漲的時代來臨了」等荒謬的報導。若把這種煽動購買的新聞報導當成事實接受，便可能敗光家產，到頭來還不知道要向誰追究責任。盼望各位將自己的政治傾向和經濟政策分開來判斷。'
