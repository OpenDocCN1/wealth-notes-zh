- pgno: 177
  md: '下時，沒有不會感到恐怖的投資人。若有人說自己完全沒有感覺，那麼那些錢可能不是他的，或者是他說謊，不然就是精神病患，三者之一。每個人都會覺得恐懼。


    # 看懂騙局


    投資不是與市場的抗爭，而是與自己的交鋒。如果為了減少那恐懼感而去分期貨進，使用閒置的資金，並且以低於價值的價格買進，就要遠離經濟財經分析的報導和股價監視器。


    越是會預測市場情況、掌握具體數字和時機的專家，越會用完美的數據和言論包裝恐怖後傳遞出去。他們把同一個情況解釋成相反，而且他們的心從早到晚變化莫測。算命專家一次拋出一堆各種預測，只因中了其中一個而受到好評。曾經猜中韓國第
    16 任總統當選人為盧武鉉的算命專家，一生都在宣傳他的能力，但連他本人都忘記他曾說李會昌會當選第 15 任總統、鄭東永先生會當選第 17 任總統的事。


    從媒體中看見廣告內容：「如果買我們推薦的亞馬遜或Netflix（網飛），現在已經賺了數千倍，所以一個月只要付 10 萬美元，我們就會告訴你會漲漲的幾檔股票。」說得像命理師一樣天花亂墜，但這是騙局。因為在他們推薦的項目中，以退市或不板上漲的項目居多。'
