  md: '# 14 你的退場策略是什麼？


    預先準備便能按策略縝密的調整事業方向，而且可以預先計算投資的方向和極限。


    凡是開創公司或目前正在經營企業的人，都應具備退場策略（exit strategy）。退場策略必須從事業初期就開始計畫，才能掌握方向。正在經營企業的人當中，可能有些人完全沒有考慮過退場策略，甚至有人第一次聽到此言論。


    當我們開始某個事業時，會想經營一輩子，其實能經營一世子的事業沒有想像中的多。因為企業環境每天都有變化，而且隨著我們自己的財務狀態或能力，也會有許多變數。一般事業可分三種退場策略，在這三種策略當中，決定出對自己最有用的那一個，乃關乎自己所擁有的事業，是否有持續成長的可能性。


    當本人的事業目前雖然經營得非常順利，但是以後幾年內'
  merge: -1
  img_proc: true
- pgno: 202
  md: '不再有延續的可能性，或競爭者增加時，第一個退場策略就是出售。一般做生意的人，若目前的事業或生意順利，根本不會考慮出售。如果目前的事業在10年或30年後仍然存在則另當別論，但有些事業雖然非常順利，也不敢保證1年後的發展。


    # # 策略一：出售


    正如股票過熱時就要把它賣出，事業也是如此。出售企業時能獲得最高價格的方法，當然就是在企業最好的狀態下賣出，但是會捨不得自己創立的企業。有些人用自己或孩子的名字來創立品牌，就算如此也要抱著隨時出售的打算，因為「我」這個人比我的品牌更寶貴。


    若錯過售出的時機就毀了，所以不要隨便把自己的名字放進企業裡，不要把自己投射在公司上。有些公司因事業發展良好，而接獲出售的請求，但有時卻因要求的價格過高，最後導致成長減緩。如果成長已經到無法繼續往上發展的地步，交易價格就會驟降。沒有人會願意用最高的價格，收購一個不再成長的公司。因為買家想要購買的最大原因，就是渴望收購的公司會有更多成長。通常連鎖店超過一百多家以上的公司，經常有這樣的失誤。而且賣場超過100個，個人也買不起。通常基金公司或機構會購買它，但是如果沒有進一步的增長空間，則沒有理由購買。即便當前的利潤很高，但要要是沒有持續成長的'
  merge: -1
  img_proc: true
- pgno: 203
  md: '可能性，出售價格外可能反而降低。企業就是企業，它是現實的，公司不等於我，所以要懂得在最佳時期，隨時做好離開的準備。


    # ## 策略二：首次公開募股


    使用第二種退場策略的公司，是持續成長可能性高的公司。若公司在產業內占有一席之地，將來成長的可能性高，而且達到成長之後，長期以來仍創造收入持續增長的事業時，那麼最具代表性的退場策略就是「首次公開募股」（IPO:
    Initial Public Offering）或與大型企業之間的合併與收購（M&A）。有兩大理由推動公開募股：由於公司規模變得太大，不是個人能買得起的，因此有分散賣給很多個人的公開募股；另外有透過增資籌集資金後，更快掌握市場為目的的公開募股。前者的意圖是創業者想要售出後走人，後者的目的是擴張公司。


    # ## 策略三：無退場策略


    最後一個退場策略是無退場策略。當一個企業堅固的程度足以代代代傳，又具有強大的品牌力量，或者在特定領域中掌握市場的時候，此策略才可行。也就是說，賣掉合適的企業後，不能再創造不能再購買此類企業的情況，其策略就是以終身經營該企業來創造收入。一個讓顧客從全國各地聞名而來的美食店，或者已具有強大品牌力量的工業產品，沒有理由出售。'
  merge: -1
  img_proc: true
- pgno: 204
  md: '這是可以代代相傳的良好企業，擁有這種企業才是最佳的退場策略。只能選擇第一種出售退場策略的人，他們的夢想就是無退場策略。


    經營企業的人要以這三種退場策略為主，來思考自己的企業體適合哪一個，並為今後該走的方向做好準備。預先準備便能按此策略縝密地調整事業方向，而且可以預先計算投資的方向和極限。根據所選的策略，便可以輕鬆地決定設備、改善設施、增設、購買房地產等大項目，又不會使用不必要的資金。就像開始創業的時候要具備事業計畫書一樣，盼望各位都能記得，從事業撤出的時候，也需要事業計畫書。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 15 所有事業

    都將與房地產、

    金融會合


    金融和房地產一直是世界的強者，

    他們遇強則弱，遇弱則強，並長年屹立不搖，

    若稍不留神，總有一天刀子從你腳下飛過來。


    不管哪種事業，只要事業有成長，且跳脫了區域範圍，走入大馬路時，便有兩個人等候著。他們倆會接近你，站在你左右兩旁，手搭在你肩上說：「我們親密地相處吧！」其中一人身穿西裝打著領帶，另一人則穿著夾克，頭戴帽子。這兩個人是競爭對手，又是同行。他們是該地區的「土地爺」，為了更加發展事業，你必須與這兩個人維持融洽的關係。他們是友亦是敵，若是敵，想要進一步發展事業就不容易了。就算成為朋友，也要相處一段時間後才知道是否是真正的朋友。


    那身穿西裝打領帶的就是金融，身穿夾克頭戴帽子的則是房地產。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '通常生產的三大要素是土地、勞動和資本。這是農業為主的時期產生的理論，換成現代生產三大要素，就是房地產、企業和金融。所有事業都以房地產為基礎，因為無論何種行業，都要有賣場、辦公室或工廠。


    # 房地產的特性


    所有的房地產都有其價值，此價值可用準確的數字計算出實物金額。具有實物價值的變動性資產，全部用於產生利息或支付股息。使用房地產的企業所支付的租金是屬於股息或利潤，一個企業可以支付租金，表示與房地產緊密相連，是有能力購買或開發房地產的企業。因此與房地產的所有者產生緊張關係，企業可以是房地產的用戶，也可以是房地產的購買者。換句話說，因為具有購買房地產的資格，所以若將當前的事業與房地產連結，可持續創造出不亞於現有事業的利潤架構。


    結論是，若所擁有的公司事業經營有成，無論在哪裡開店都有餘力支付租金時，就等於擁有很多房地產的資格。此時，如果能得到金融體系的貸款，在公司的資產結構上，就會出現屬於事業和房地產的兩種利益結構。因為房地產是屬於比事業相對安全的資產，與利潤相比具有高價交易的特點。很多公司都可擁有房地產，而能持有的原因如上所述。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 與金融組織合夥


    一個企業為了掌握市場維持成長率，需要募集投資資金，甚至會透過收購、合併或公開募股達到成長的狀態。金融會干預這一切所有過程，根據投資的種類和方向，金融資本將決定公司的組織、股份和利潤分配方式，而因著該協議公司將走向與金融組織合夥的道路。


    新創公司的情况，有進行像 Pre-seed、Seed、SeriesA、SeriesB 等一樣連續性的投資來稀釋股權的過程；也有根據資本的金額和性質，要求超過創業者以上的資本，或者以干預新股發行的方式參與經營。資本進入公司的意思是信用開始變成資產，此時所有一切不會因為創業者把自己的事業經營得更好而停止，這代表必須與金融組織維持好的關係並了解資本，才能跳到立足的階段。


    創造收入的方式分為幾種：首先，有以自己的勞動力為收入的勞工或自營業者，也有利用他人的勞動力和資本創造收入的企業家，還有與金融合作，透過信用提前兌現利潤的方式。隨著事業增長，就必須與金融攜手並進。若缺乏金融知識，無論事業經營得多好，可能也會變成《老人與海》中的老漁夫桑迪亞哥。


    桑迪亞哥在墨西哥灣花了好大力氣捕到一條大旗魚，將牠'
  merge: -1
  img_proc: true
- pgno: 208
  md: '掛在船上開往家裡，希望能在市場上賣得高價。但是，旗魚的血引來了鯊魚，最後鯊魚把旗魚全吃掉只剩下魚骨。對金融資本缺乏了解的經營者，都有可能變成桑迪亞哥。


    # 遇強則弱，遇弱則強


    金融有一把精巧又鋒利的刀子，這把刀總是反覆不定，必要的時候它會幫你擊退競爭者；當情況急轉彎時，刀鋒可能轉向你。正如它能冷酷地剖開肉和骨一樣，也能支解你和你的事業。但是如果把房地產和金融變成站在你這一邊時，便會擁有兼具擴張性及穩定性的事業。而且如此擴大的事業，規模越增長，就能將房地產和金融放在腳底下。它不再要求作合作夥伴，只希望扮演屬下的角色緊跟在你身邊。


    但是仍不可掉以輕心，金融和房地產一直是世界的強者，他們遇強則弱，遇弱則強，並長年屹立不搖，若稍不留神，總有一天刀子從你腳下飛過來。不要只為自己的事業努力，盼望能以同樣的熱情去學習金融和房地產。但願各位記得，世界上所有知名的經營者都制伏了這兩者，且安穩地坐在他們的位置上。'
