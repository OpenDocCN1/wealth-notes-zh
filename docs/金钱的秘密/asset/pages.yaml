  md: '我東山再起的人說：「以幾百美元就可以投資外匯交易」，但完全跌到谷底的我，已經沒有對抗的方法了。


    我不知道外匯期貨投資是屬於高槓桿商品，會出現負利潤。結論是我不是跌到地板，而是跌到地下室。移民生活10年，3,650天的心血努力，就全部付諸流水，最後落得一身負債。


    同一個人以此方式不斷地提出好幾次建議，但一切都結束之後，我仍然覺得他的意圖是善良的。我認為他確實從這件事沒得到什麼好處，所以我還是選擇站在他那一邊。數年之後我才覺悟，他只是利用我的錢和急迫性來測試自己從未驗證過的想法而已，為他還用了一些專業術語。


    # 只投資自己了解的領域


    我後來明白當時eMachines公司上市是典型的公開退場策略，股票即時技術分析交易是實驗的樣本，而股票期權又是大型基金投資者的避險樣本，外匯則是國際專家的投資領域。是我的無知和貪婪導致這種結果，也是我受騙的最大關鍵點。


    值得慶幸的是，從此以後我再也沒有被任何人騙過。若不貪心也不參與不熟悉的領域，就不會暴露在受騙的環境中。若從利潤豐厚的所有提案中退出，只在自己了解的領域內投資，就可以遠離所有的受騙風險。'
  merge: -1
  img_proc: true
