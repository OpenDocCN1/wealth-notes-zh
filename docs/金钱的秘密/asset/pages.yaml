  md: '# 09 會計師  很會投資嗎？


    > 降低風險才是成功的捷徑，投資者去冒險

    就等於投機。要過濾掉沒有利潤或預測虧損

    的公司，就必須學習理解財務報表。


    所謂的價值投資，就是以適當的價格買進成長可能性較高的企業股票，若超過適當的價格就賣出。此時要找出股票是否為合理的價位，最正確的เครื่องมือ就是該企業的財務報表。一般人很難了解一家公司的財務報表，因為不僅很難理解那些用語，而且也看不懂。那麼精通財務報表的會計師，真的很會投資嗎？


    投資分為資訊和心理，對財務報表的理解和解釋的能力是屬於資訊。我們在亞馬遜就算購買一支 20 美元的眼影筆，也會確認商品評價是否超過四顆星，並搜尋看看有哪些負評。在書店購買一本
    1 萬韓元的書（約台幣 250 元），也要確認書評。但是我們購買股票時，既不看商品評價，也不看書評，單單靠著未經證實的傳聞，也能非理性地決定讓數千萬、數億韓元出擊。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 降低風險才是成功的捷徑


    我們應該學習閱讀股票的商品評價——財務報表，財務報表是一種企業的成績單。沒有比財務報表更能確認該企業今後是否更加成長，也可以藉此確認過去和現在表現是否良好。財務報表就像一個學生即將進入大學的成績單一樣，從成績單上可以推測該學生之前的功課情況，如果該學生之前的功課很好，將來功課更好的機率也會很高。如果成績不好，可以推測今後也沒什麼太大的發展，因此成績單是決定錄取的重要標準。當然功課好的學生，畢業之後也不見得有突出的成就，相反的，有些學生現在不太起眼，但日後卻有可能創造極大的成功。


    但投資是以機率為基礎獲得成功的，因為要把失敗降到最低，成功機率才會提高。當然降低風險才是成功的捷徑，投資者去冒險就等於投機。要過濾掉沒有利潤或預測虧損的公司，就必須學習理解財務報表。


    當我開始經營自己的公司後，發現公司成長初期，營收比利潤重要，之後營業利潤比本期的淨利潤更重要，如果現金流量不佳，便會導致黑字倒閉。公司財務報表中包含了這所有的資料。本期淨利可以透過出售公司的建築物或其他投資來增加，但如果營業利潤正在萎縮，則表示事業本身很艱難，而且正一點一點地出售公司來維持營運。'
  merge: -1
  img_proc: true
- pgno: 182
  md: '若資本多但只保有現金而沒有事業投資時，一樣要抱持懷疑；相反的，如果增長過快以致銷售增加，卻沒有產生利潤時，也有可能是好的。因為這種公司只要掌握市場，改善利潤結構，就會成為獨占市場的強者。這一切都是從理解和確認財務報表中得到的。


    我經常看到身邊許多從事專業工作的人，沒有將本人職業的特性運用在自己身上。甲狀腺專科醫生罹患甲狀腺炎，雖是律師也被欺詐，身為會計師卻根據傳聞來投資的情況都非常普遍。我也從未見過一項根據或調查，是有關會計師比一般投資人呈現更好的投資收益，也沒有醫生比一般人更健康的調查，身為律師也不能保證更有效率。


    但是只要自己願意，醫生也可以活出最健康的生活，律師可以得到最公正的待遇，會計師可以是最會投資的人。他們與一般人沒有特別的不同，這並不表示他們的專業知識無用，而是因為會計帳簿裡沒有投資的時間和投資心理。正如鋼琴調音師也不代表會演奏一樣，會計師也只是透過帳簿來檢查公司的品質而已。雖確認過事實，並不表示可以準確知道投資買進和賣出的時機。


    這是多麼可幸啊！否則世上所有的資產都歸會計師所有了。當然如果能比其他快人一步取得品質檢查的結果，就有可'
  merge: -1
  img_proc: true
- pgno: 183
  md: '能創造出相當可觀的投資利益。所以法律禁止那些審計成長型公司，而且能知道結果的會計師投資該相關公司。


    # 務必學習看懂財務報表


    其實這是非常簡單的問題：假設我是目前我所投資的公司現任老闆，我就可以吩咐下屬將本月財務報表拿來。若要了解自己公司的狀況，則需要閱覽此文件來掌握情況。希望各位找一天把自己當作正在經營此公司的老闆，並翻閱會計帳簿，如此便能看懂它。


    很帥吧？！股東也是老闆，若有不了解的部分，就主動學習、詢問。即便是會計師也不會特別有這種優越突出的能力。就像為了讀英文小說，要死背字母和單字一樣，我們也需要學習會計用語和結構才有可能了解它。如果我們想成為富翁，並保有成功投資者的身分，請務必學習看懂財務報表。


    如果我有需要學習的功課，會一次買三十多本相關書籍，像是從漫畫寫成的會計學一樣簡易的書籍開始，到以專業圖書為主的會計學等。然後用一、兩個月不斷深入研究，直到累積一定的知識水平為止。最後就能達到聽得懂並且能評價的程度，如同在大學修一門課程一樣投入。這是人生必須要做的功課，所以我建議大家將市面上簡單或較難的會計學書籍全部買下來，並且去尋找相關的演講聆聽。'
