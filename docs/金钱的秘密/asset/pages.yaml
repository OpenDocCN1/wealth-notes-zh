- pgno: 105
  md: '資本 X 投資利益率 X 期間 = 財富


    # 年輕也能成為百萬富翁


    假設我把現在的所有經驗與知識帶回 25 歲時，我是不會以將錢存在銀行的方式來籌備第一桶金。我寧願從每個月的薪水中拿出 50 萬韓元左右，購買韓國最大公司的股票。不管股價上漲或下跌，我會在每個月的同一天購買
    50 萬元股票累積起來。


    若以市值最大的公司來說，目前是三星電子，但若有一家公司的市值超越三星電子，我便轉換到該公司，並繼續做相同的投資。如果回到 15 年前，每月購買 50 萬韓元的三星電子股票，那麼現在的總價值高達
    5 億韓元左右。但是若將這些錢存在銀行裡，也只有 1 億韓元多一點。以這種方式想成為 10 億韓元的資產家，我想也許到死之前都不太可能，因為要存到 95 歲。如果目前擁有價值高達
    5 億韓元的三星電子股票，那麼在短短幾年內變成 10 億韓元的可能性就很高。再加上股息分配，所以不必每個月再投資 50 萬韓元。


    這就是雖然年輕，也能在一個穩定工作的情况下，成為百萬富翁的方法。儘快開始實行就可以，因為在這公式中最重要 的變數是投資的時間。成為百萬富翁並沒有想像中的難，我再说一次，致富的最快方法，就是放慢腳步。'
