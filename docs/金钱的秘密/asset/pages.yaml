  md: '# 02 貴公司的本益比（PER）是多少？


    本益比的變化取決於你在參與度低的狀態下，所開展的事業能夠持續多久。


    稱為股票市盈率（本益比）的 PER，是將某支股票的每股市價除以每股純利潤（EPS）的數值。PER 是股票市場中衡量公司價值的重要資料，它是市場對企業的股票呈現的評價指標。


    假設某個企業的股價為每張 5 萬韓元，如果每股收益為 5,000 韓元，則該公司的本益比（PER）為 10。因為 10 年的利潤和股票價格相同。若本益比高，則表示股價比每股收益高；反之，如果本益比低，代表股價比每股收益低。


    公司本益比高的意思，代表公司的價值有高評價，也表示公司將來成長有望，持續經營的可能性高，所以預先以高價出售。相反的，如果本益比低，則表示該公司尚未得到認可，或者事業發展的信任度不可靠。將這本益比概念應用在自己尚未上市的工作或事業，就會得到很有趣的結果。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 提高本益比


    假设有三個人的年收入都是 1 億韓元，第一個人在市場的入口，經營一家餐廳賺取利潤，第二個人是經營一家有名氣的補習班來獲得利潤，第三個人是從唱片版權的收入中獲得利潤。雖然他們的年收入都一樣，但根據收入的來源，其隱藏的額外資產也會不同。


    餐廳的老闆若出售自己的商店，則可以收取 3 年的權利金。如果他的商店不受景氣影響，是在市場裡面時間悠久、頗有名氣的商店，也許可以收取 5 年的權利金。那擁有唱片版權的人，可以獲得
    10 年的版權。他的權利金比餐廳的老闆更高，因為版權的主人幾乎可以不用工作，也可以長時間持續創造收入，也就是本益比高。但經營補習班的那位本益比為 0，原因是如果他停止經營補習班，補習班就無法運作。


    沒有人會買老闆把公司賣掉之後，就不再有收入的公司。因此，根據收入根源的穩定性和持續性，其本益比會增高；而穩定性消失的所得，本益比則變零。像醫生、律師、名講師、演藝人員、培訓師、運動選手、網紅、音樂家、廣播人、作家等令人稱羨的職業，大部分是本益比低，或者完全沒有。相對的，本益比高的職業是僱用從事這些職業的人來賺錢的經營者，而不是靠自己的職業賺錢。要建造出即便特定人物的影響力消失了，也能繼續營運的組織，如此才會有高的本益比。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '並非所有的餐廳本益比都一樣。假設兩個淨利相同的賣場，任何人都可以在廚房按照食譜配方做出佳餚的餐廳，比倚賴名廚師的餐廳本益比高。如果是主人不用工作賣場也能照常運作的餐廳，本益比將會更高。也就是本益比的變化取決於你在參與度低的狀態下，所開展的事業能夠持續多久。有很多專業家雖然有很多各樣的事業或職業，但是真的沒有考慮過自己的本益比。當我在演講中談到本益比時，特別對那些從事專業工作的人，或補習班老師們衝擊很大。與其他職業相比他們是高所得群，所以本來不擔心自己，卻被現實的數字嚇到了。


    # 創造真實的收入


    因為若不提高本益比，無論賺多少錢，當停止工作的那一刻，收入就會消失，所以不能不擔心未來。大部分的情況是，雖然收入已經很高，但支出水平也很高，所以只要收入稍微縮減就會不安，也無法存錢。事實上沒有本益比的人，其特徵是個人能力比一般人強，所以收入偏高。


    尤其像著名的運動選手或演藝人員等有特別優渥收入的，他們的收入極具時間性，別人需要花一生賺得的錢，他們只要花幾年就有了。我們絕對不能認為自己的收入規模，一輩子都能維持在高峰。因此有些超級演藝人員，會以購買大樓收租金的方式增加收入，而知名度較低的演藝人員，則是選擇開餐廳或做生意。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '如果個人的工作或事業沒有本益比，那麼從現在起要將自己的收入轉移到本益比較高的領域。年收入 1 億韓元的補習班經營者，不能認為 1 億元就是他自己的收入。要在這
    1 億韓元當中節省、儲蓄後拿去投資的錢，才是自己每月創造的真正收入。如果存了幾年後買了一間套房，收取 50 萬韓元的租金，那麼這 50 萬韓元才是完整的本益比，也是自己真正的收入。直到創造出一個月
    1,000 萬韓元這種高品質本益比的收入，才能盡情享受生活。一個月賺 50 萬韓元的人，不能像賺 1,000 萬韓元的人一樣生活。因為沒有投入勞動而獲得的固定收入，才是自己真實的收入。


    在個人的經濟活動中，只有從資本產生的錢才是自己的錢。一個人的職業或企業收入高但本益比低，則必須改變個人的生活水平。要積極地透過財產轉移，一天天創造出資本利益。


    你的收入不是真正的收入，如果你不明白或不能接受這道理，你的老年生活就岌岌可危。不管年收入有多高，最後都一樣。盼望不要放心自己目前的收入，鼓勵自己去創造高本益比的經濟活動。'
  merge: -1
