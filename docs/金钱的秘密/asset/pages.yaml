  md: '# **05** 貧窮

    **比想像中更殘忍**


    相信自己能成為富有的人，則一定不會變富有；而相信自己能成為富有的人當中，一定會出現富有的人。


    現代人把人生的價值得比財富的積蓄更重要，我也認為人生的價值很重要。但是發出此心聲的人，必須經常檢視自己的真意。通常會說這種話的人，大概有以下三種原因：第一，不清楚有關生活價值的標準。第二，不知道貧窮的可怕。第三，自己沒信心成為富有的人。


    很多人說比起金錢更希望擁有自由，因為必須有自由才可以維持人生的價值。但是要有龐大的金錢，才能在現代經濟社會的框架內享受自由。只是有一個穩定的工作還不夠，企業界變化莫測，沒有一個大企業能看到未來
    5 年的發展情景。追求人生的價值不是當下的事，而是透過整個人生才能達成。因此我們有責任利用現在，為自己未來的剩餘時間做資源分配。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '雖然我們自己滿足儉樸的生活，但我們的家人、配偶和孩子們的人生價值可能會不一樣。我們不應該將自己的人生價值強施於其他家人，也許他們希望的人生價值是豐富、購物和美食。我們有撫養的責任，就不能忽視家人的這些需求。


    # 不能鄙夷財富


    沒有經歷過貧窮的人，根本想不到貧窮的可怕。心靈的貧窮可以藉著冥想和讀書來彌補，但是經濟方面的貧窮，會讓人漸漸失去善良的意志，甚至僅剩的一絲尊嚴也會被貧窮奪走。貧窮會讓人既沒有禮節，也喪失品德。若一個人三餐不繼或風餐雨宿，便無法維護人類基本的尊嚴；若有負債更是度日如年、日月如梭了，因為肚子每天都飢餓，而還債的日子每月都會來。


    另外，貧窮會使家庭的根基解體。窮困的時間久了，反而會心生貪婪、累積怨恨和憤怒，最後危害健康。生活艱困的人，很難維持內心的悠閒和平靜，也比較難以擁有客觀的觀點，因容易受傷而增加不滿和抱怨的情緒，以致人際關係破裂。比爾·蓋茲說：「用浪漫或謙虛來掩蓋貧窮是非常可怕的，生於貧窮不是罪，但是死於貧窮就是錯。」


    成為有錢人的第一步方法，就是相信自已可以變成有錢人。我們可以鄙視某些有錢人，但不能鄙夷財富。當然並非相信自'
  merge: -1
  img_proc: true
- pgno: 99
  md: '己能夠成為富有的人，就一定能富有，但我認為不相信自己能成為富有的人，則一定不會變富有；而相信自己能成為富有的人當中，一定會出現富有的人。


    因為那信心會促使人思考、付諸實踐，願意披荊斬棘，開闢道路。因為要實行所以會儲蓄，有思考所以開始尋求學習，想要挑戰自己所以努力工作。其實要成為千萬富翁或億萬富翁，光靠努力是行不通的。那是與生俱來的天賦和時代環境，以及運氣结合在一起時才有可能。但是任何人都可以靠努力到達百萬富翁，憑著誠實、節制和不斷的努力，最快可在四十多歲，最晚五十多歲就能成為百萬富翁。


    **貧窮比想像中還要殘酷，而富有比想像中還要幸福。**'
