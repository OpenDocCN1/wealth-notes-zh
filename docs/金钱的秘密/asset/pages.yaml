  md: '# 04 固定流入的

    資金力量


    做生意或經營事業，不要羨慕光一個夏季

    一天的銷售額就達 1,000 萬韓元的人，

    而要羨慕每天持續進帳數十萬的小飯館。


    假設一年的收入為 5,000 萬韓元，A 每月固定收入 400 萬

    韓元，B 有時賺超過 1,000 萬韓元，有時則一分錢也賺不到。兩

    人每年都有 5,000 萬韓元的收入，但兩種金錢的力量是不一樣

    的。固定收入的質比非固定收入好，優質的錢會吸引其他的錢，

    凝聚在一起不會散開。由於固定收入比非固定收入的力量強大，

