  md: '# 定期資產是高品質資產


    這是虛構的故事，但是透過小旭的例子，我們可以學到幾個教訓。


    第一，100 億韓元確確實是一筆鉅額沒錯，但是如果想把它變成沒有損失的固定收入，那麼這筆錢其實還不算多。相反的，如果我們有 276 萬韓元的固定收入，則與擁有
    100 億韓元的資產家別無兩樣。定期、固定收入資產的力量，通常等同於該金額的 100 倍。定期資產就是具有如此高的價值，是高品質的資產。


    第二，賺錢和守財一樣難。我們必須學習持守錢財的能力，因這能力不會自動產生。有時候賺錢是機會和運氣的相助，但是若沒有研究、經驗和知識這些重要的價值，終究無法持守錢財。


    第三，即便真的擁有了 100 億韓元，但如果沒有月薪 276 萬韓元者該有的生活態度時，那筆財產可能會瞬間下降。我們要認清這事實，並活出儉樸端正的生活，你將可能會賺得
    100 億韓元，所以盼望預先接受這些智慧。'
