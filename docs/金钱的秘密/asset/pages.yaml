  md: '# 現金流量要保持恆定


    同樣的，經營企業最重要的是現金流量。現金的流入和流出統稱為現金流量。如果一個企業的現金流量不順暢，雖有獲利，但破產的可能性很高。就像不管什麼時候下雨，農作物現在就在乾旱當中燒死了。體內的血液要持續地流動，四肢才能自由地動作；呼吸也要正常，生命才能延續；飲食要規律，才能存活。一個人溺水
    10 分鐘後，再給他注入不足的空氣，他也不會活過來。將肉放進已經餓死的人嘴裡，他也不會復活。


    金錢也一樣，當現金流量保持恆定時，生活的經濟才能富裕。現金穩定地流入，如同只用數百名組織化的警察或士兵，就可以有效地管制成千上萬的群眾一樣。這樣的現金流量，能使不順遂的人生得到控制。


    如果正在計畫做生意或經營業，不要羨慕光一個夏季一天的銷售額就達 1,000 萬韓元的人，也就是非細水長流的人，而要羨慕每天持續進帳數十萬的小飯館。因為一個夏季所賺的那
    1,000 萬韓元，像棉花糖一樣輕，一碰就碎了；而小飯館的 100 萬韓元，則像水泥一樣堅硬，所以能建造大樓。只為接待活動團體的顧客，而忽略常客的老闆不會成功。


    因為非固定的收入是一次湧進的錢，所以會容易令人產生錯覺，以為自己賺了很多錢。這些錢看起來比實際的價值大，因此會造成奢侈、隨便花用，結果留不住錢。一般常見的想法是，因為不知道錢什麼時候會再進來，所以要存錢生活，但實際上能如此調整的人寥寥無幾。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 固定收入能駕馭風險


    我們手裡若有一根針，現在有一顆氣球在我們眼前飄蕩，這時我們會很想把它戳破，這是人普遍的心理。


    收入不固定的人，應該找一份能將資產轉移到固定收入的工作。像演藝人員、演講員、補習班教師、建築工人、有季節性的企業界業主、運動員、開業醫師等非固定收入的工作者，皆包含在這範圍內。


    收入不固定換成另一種說法，就是個人的專長或才華很多，在短時間內能獲得很多收入。這樣的人有收入時，應該購買能產生出固定所得的不動產，或可分配股息的績優股來轉移所得。如果不儘快轉移到固定所得，那不固定的錢財就會被那些擁有固定金錢的人吸走。固定的錢和非固定的錢彼此競爭，最後獲勝者總是那固定的錢。


    固定收入的最大優勢就是能預測未來，意思是固定的收入可以駕馭金融資產最大的敵人 — 風險。風險對資產來說是最可怕、最恐怖的，而且它能奪走一切。不知道它會藏在哪裡，或許在角落迴繞著，突然讓我們相遇，這就是風險。能控制這風險是很大的優勢，能控制就表示有信用，而且這信用可以作為實際的資產，所以同樣的
    5,000 萬韓元，也會變成 1 億或更多的資產出現在現實中。'
  merge: -1
  img_proc: true
