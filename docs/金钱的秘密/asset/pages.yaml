  md: '# # 16 聰明人為何

    墆入陰謀論中？


    > 人生若脫離了常識，那一剎那

    便有可能淪為失敗者，好朋友因此離開，

    最後有很大的機率以貧窮的古怪人終結人生。


    越是聰明、有高知識水平的人，越容易墆入陰謀論，因為特別討厭不確定感。當複雜的政治因素或無法理解的經濟環境出現時，就會有很多人想對此提出一番言論。但是若解釋不清，陰謀論就成了簡單又容易的答案了。宗教的教義主義者、保守或革新兩種極端的知識分子，也容易被陰謀論同化。


    而且因為他們的知識和學術權威被大多數人肯定，所以這陰謀論便有力量說服群眾。像 UFO、占星術、血型、另類醫學等依然備受知識階層者支持。《The philosophy
    files》的作者倫敦大學教授史蒂芬·洛（Stephen Law），將我們周圍這種蔓延的非理性信仰陷阱命名為「知識的黑洞」。在我們日常的言論當中，充斥著這種非理性的信仰和主張，連菁英分子也被此迷惑，因為它的邏輯和理論非常合理。'
