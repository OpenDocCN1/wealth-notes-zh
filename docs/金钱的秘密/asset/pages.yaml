  md: '# 成功，從禮儀開始


    這些就是最高經營者大學培訓課程的內容，對他們叮嚀這些原則，讓我覺得自己不像一個大學教授，比較像幼稚園的老師。我們還沒有學會國際水準的文化禮儀，沒有資格取笑外國人。現在當我與學生一起出國參觀企業或參加展覽時，至少穿著休閒西裝到機場。因為穿著整齊，行為舉止也會變得幹練。我們不是去大川海水浴場，也不是去泰國芭達雅，所以出發之前必須先叮嚀一番上述內容。他們雖然都是成年人，都是知識淵博、帶領職員的公司代表，但若想得到與自己地位相襯的待遇，就必須重新學習。這些簡單的禮儀，能提高自己的品格和企業的形象。


    居住在首爾的外國人有一百多萬，但我們尚未學會國際標準禮儀。韓國的企業家若想到國外開展事業，就必須學習符合國際標準的行為模式。“Manners Maketh
    Man”（禮儀成就非凡的人），這是電影《金牌特務》主角哈利著名的台詞。針對參加美國哥倫比亞大學 MBA 課程的 CEO 進行了一項調查：「影響你成功的最大因素是什麼？」結果顯示「禮儀」占了
    93%。禮儀是教育、習慣，是尊重、顧慮對方的態度。國際上的成功，乃從禮儀開始。'
