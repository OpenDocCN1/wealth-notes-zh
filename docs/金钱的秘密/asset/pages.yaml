  md: '了，你將會立即明白，即便領取同樣的複利利息，但比起一年領一次利息，不如按季分批領，甚至按月領利息，則會更有利。


    # 複利對於債務的恐怖影響


    但是，相反的，若將複利的概念用於債務利息來償還的情況，就會產生非常恐怖的數值。若開立貸款帳戶，以 10% 年利率借了 500 萬韓元，雖然每月的利息只有 41,667
    韓元，但若拖延不付利息，下個月的利息不是兩個月 83,334 韓元，而是 83,681 韓元，增加了 347 元，這是因為有 41,667 元的利息加在一起。然而認為「才
    347 元」和「高達 347 元」兩者之間的差別，會導致投資的差異，也會帶來財富和生活的差異。


    像這樣若繼續兩年不還貸款，兩年後的本息則變成 6,051,525 韓元，每月的利息是 50,429 韓元。3 年後本金變成 6,685,199 韓元，利息為
    55,710 韓元，而且年息將增加到 13.4%，這是「才 347 韓元」所造成的結果。再舉一個例子，買一棟房子，貸款 3 億韓元，以 30 年 4% 複利還款，需要支付的總金額則是
    9 億 9,000 萬韓元。如果將這貸款分為 30 年按月支付，月抵押借款為 276 萬韓元，需要支付 21 年的利息，本金才會從下個月開始減少。複利就是如此可怕。


    最終，財產的價值會根據複利是友或是敵而有所不同。想'
