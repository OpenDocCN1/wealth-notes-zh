- pgno: 162
  md: '# 04 讓錢找上門的七個訣竅


    +   1. 丟掉所有不合乎品格的惡習。如說髒話、發牢騷、輕浮的坐姿、嘲笑他人、穿著邋遢、約會遲到或變卦等，這些都是沒有品格的行為。


    +   2. 不要猶豫尋求幫助。多問多請教，登門拜託。一定會有願意回答問題、給予幫助、歡迎我們的人。


    +   3. 做好犧牲的準備。小的目標伴隨著小的犧牲，大的目標伴隨著大的犧牲。為了讀書需要放棄睡眠，為了存錢則需要花更多的時間工作。


    +   4. 記錄並整理。要整理所有的投資明細、情報、突發的創意、名片、網站密碼、購買紀錄等並記住。這是財產，同時也會保護我們。'
  merge: -1
  img_proc: true
- pgno: 163
  md: '+   5. 要有長期目標。登山必須爬到山頂才能看見山峰，不要被立即的刺激誘惑，要尋找一生值得持守的價值。


    +   6. 千萬不要想得到眾人的喜愛。不要看人的眼色，毅然決然面對別人的指責，也不要冒著生命危險建立群體關係。真正的朋友兩個也嫌多，家人的支持是所有基礎的基礎。避免與負面的人來往，要與比我們優秀的人交往。


    +   7. 不要認為時間很多。現在投資都算晚，唯有年齡是不勞而獲的。你若早一點投資，就會早一點致富。'
