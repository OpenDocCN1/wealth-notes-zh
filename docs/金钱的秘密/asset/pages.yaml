  md: '人惴惴不安說：「光開一家店就已經很不容易了，我怎麼敢……」

    但這與事實有很大的出入。你看到不如自己有能力的人都擁有了建物，不覺得奇怪嗎？


    # 付租金的人就是屋主


    當我們在走訪附近的房地產、查詢待售商品、找尋銀行、準備種子資金的過程中，便能看見可行的方法。你將會發現有很多不需要花費大量金錢購買房地產的方法，若能將**目前經營企業的熱誠**一半投入研究房地產，便可以捕捉待售商品和機會。房地產本身就是一種透過租金產生投資紅利的產品，因此**非常可以使用槓桿原理**。也就是比想像中容易的意思，不是沒有困難，而是比想像中輕鬆。


    在經營事業期間，若能銘記「付租金的人就是屋主」這句話，那麼有一天必定會成為屋主。如果忘記這一點，便會在每年上漲的租金中痛苦掙扎，落入不斷遷移店面、被屋主責罵的光景。只要好好抓住一棟屬於自己的建物，並還清貸款後，就可以利用槓桿原理來購買其他的建物。這是很特殊的投資產品，所以**絕對不要放棄欲望**。'
