  md: '# ## 16 保險不是儲蓄


    保險是一種基於風險的概率遊戲，

    保險公司即商品開發公司，找出會發生風險

    或損失的領域，並將這些領域的

    實際損失數字統計後訂定保險金額。


    我所熟悉的人當中，有一個人每月收入約250萬韓元，但

    每月要繳80萬韓元的保險費，所以常常叫苦。我問他為何要買

    那麼多保險，原來他把保險當作儲蓄。保險的目的是，原保險

    的投保人支付議定的保險費，為投保人的財產、生命或身體發

    生事故時所預備的安全保障。


    但是保險公司不只銷售與實際風險相關的人壽保險和意外

    保險而已，除了基本的保障性保險和儲蓄性保險之外，還銷售

    定期保險、終身保險、變額保險、萬能保險、個人年金保險等

    商品。保險是一種基於風險的概率遊戲，保險公司即商品開發

    公司，找出會發生風險或損失的領域，並將這些領域的實際損

    失數字做一番統計後訂定保險金額。假設一座1萬人的村莊，'
  merge: -1
  img_proc: true
- pgno: 135
  md: '每年有 5 個事故死亡者，就先向 1 萬人分別收取 10 萬韓元，收集到 10 億韓元時，便分給那 5 人各 2 億韓元。因為每個人都擔心自己可能在那
    5 個人當中，所以願意每年拿出 10 萬韓元，萬一發生事故，也可以讓家人安然生活，所以都認為這是很好的制度。


    # ## 保險公司是追求利潤的企業


    這 10 萬韓元是該產品的成本，但是這不是由國家或非營利組織免費主導的，而是由追求利潤的私人企業。他們自己制定、開發和推廣自己的保險產品，當發生事故時也要審查，還需要投入營運費。另外，保險是需要積極銷售的商品，所以也有專門從事銷售的保險經紀人公司（GA）。保險經紀人公司
    GA 是扮演比較分析各保險公司的產品後，傳達給消費者的角色。為了銷售一種產品，必須運作一間龐大的公司組織，還要向廣告和銷售網支付津貼，所以在 10 萬韓元裡加上利潤來銷售，因為需要有人管理和執行。


