  img_proc: true
- pgno: 154
  md: '# 02 好的負債，壞的負債


    > 想要成長或投資，就需要向銀行借貸才能慢慢增長。認為「絕對不可負債」的觀念，是因為沒有弄清債務的功能。


    直到我寫此書的現在，我沒有任何負債。與我同等企業規模的人當中，很少見零負債的情況。我經營的企業沒有負債，個人財產也沒有負債。自宅或投資的房地產，全都是用現金購買的，金融資產中也沒有正在利用槓桿原理來投資的商品，信用卡裡也沒有未繳清的餘額。沒有負債是我藏在心底的驕傲。其實這是非常極端的情形，而且身為企業經營者，這不應該是值得驕傲的事。從資產管理或投資的立場來看，很像跛腳的人。


    我之所以經營如此極端的無負債事業，是因為個人心靈創傷。年輕時我一邊做生意，一邊拆東牆補西牆還信用卡債務，不斷盲目地挑戰。因跳票常常接到銀行的電話，想到那情景至今仍仍然心有余悸。那段日子我甚至出現「圓形秀」，有時只要'
  merge: -1
  img_proc: true
- pgno: 155
  md: '看到銀行的招牌，心臟就怦怦跳。有句話說：「一朝被蛇咬，10 年怕草繩」，記得小時候我們去抓青蛙，把手伸進土坑裡，結果摸到的是蟾蜍粗糙的背部，我非常驚嚇，至今看到蟾蜍還是覺得毛骨悚然。長大後銀行對我來說就是那種恐懼，到現在我還是不太喜歡去銀行，有關需要處理的銀行業務，我會請銀行職員帶著文件到我辦公室來。


    # 沒借貸的人信用評價差


    因我知道債務的可怕，所以下定決心不再向銀行借貸，至今也仍然堅持著，但現在似乎是該擺脫創傷的時候了。在一般市場上，我是信用評價比較差的人，其實也不能說不好，因為我從未向金融機構借貸，也沒有還款的紀錄，所以無法衡量信用評價。沒有這些往來明細，就會被定義為信用不好。在過去的
    20 年間我從未借貸過，所以只是沒有評比的依據而已，但從另一方面來看，或許也是信用最 高的人。也許正因如此，美國最大的銀行向信用評分最差的我這個亞洲男人，發送了兩張文件，並為我開立了一個利息
    2% ，信用額度達 2,000 萬美元的帳戶。雖然已經辦好 6 個月，但我還沒有使用。


    其實負債有好的負債和壞的負債，因我決定遠離壞的負債，所以連那些好的負債也都推辭掉了。這對經營者或投資者來說，我想也算是無能的表現，因我個人的心靈創傷，對事業風格造'
  merge: -1
  img_proc: true
- pgno: 156
  md: '成很大的影響。因此形成了極度保守經營，一不小心就無法跟上競爭者或市場的平均利潤。許多大型企業雖然有累積儲備金，卻仍習慣透過發行公司債券來創造額外的收益。信用就是金錢，如果有信用，就應該使用那信用，但我只是把它綁好放在那裡。


    # 好負債的條件


    當然現在我還是堅持不想使用壞的負債，但現在我們已經成長到可以使用好的負債了，就是到了可以再去摸蟾蜍的時候。從會計學的標準來看，淨資產和負債合併就等於資產。從單純的角度來想，會不明白為什麼負債是資產，就像有人買了
    5 億的房子，貸款為 4 億，卻說自己的資產是 5 億，這聽起來有點不合理。資產、資本、淨資產、財產等用語，在會計上是有區分的，也有明確的會計項目，但一般人的想法卻是「全部還清之後，還剩多少」。


    所以一般人認為借貸的錢是別人的錢，要敬而遠之。其實當你借到錢的那一刻，就可以隨意使用它，所以也就是你自已的錢。如果你認為這些可以隨心所欲的錢就是財富，那麼債務越多，也就有可能成為富有的人。但是有幾個條件，如果按照這些條件使用錢，就能變成好的負債，若違反這條件，就會變成壞的負債。其實負債沒有好壞之分，是由個人決定將它變成朋友還是暴徒。為了將負債變成好的債務，需要以下幾個條件：'
  merge: -1
  img_proc: true
- pgno: 157
  md: '第一，不可用在消費上。如果將它用在純粹支出、旅遊、償還債券等方面，就會招惹其他更多壞的負債。必須用在能產生額外的利潤和資本的擴張。


    第二，要有固定的收入，而且以後能夠利用這負債創造固定的收入。再好的投資，如果不能保證一定的現金流量，反而會被債務纏身窒息而死。因此要有餘力固定支付債務的利息，或者由債務本身所產生的利潤來支付。


    最後，從投資中產生的 ROE（股東權益報酬率），必須高於從負債中產生的利息。如果投資收益小於債務利息，這負債當然會變成壞的負債。以年利率 3% 的貸款購買年利率
    6% 的大樓，支付利息之後剩下 3% 的利潤。公司製造商品後，剩餘 30% 的利潤，則可以增設工廠設備來賺更多的錢。此時若能以 5% 的利息獲得融資，從增加的生產設備中獲得
    25% 的利潤，那就是好的負債。換句話說，如果能用便宜的利息賺取更多的利潤，那麼這筆負債就是非常好的負債。


    從我口袋裡拿錢出去的負債是壞的負債，而為我帶來錢的負債則是好的負債。無法控制的負債是壞的負債，在控制範圍內運作的負債是好的負債。


    大企業若沒有使用這種債務，不太可能會成長。想要成長'
  merge: -1
