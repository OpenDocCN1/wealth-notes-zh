- pgno: 199
  md: '要教導他們國際企業的行為標準。我下決定心把這些眾所周知的公司代表，當作幼稚園學生來教育。教導的內容大致是：


    進入餐廳有人帶位之前，要在入口等候。任何座位都不要先坐下來。走路時注意不要撞到人，如果不小心碰到了人，就必須道歉。吃東西時，不要喧嚷著分享，吃的時候也不要灑出來。在飯店走廊要降低聲量。在公共場所排隊時，不要與前面的人貼得太近。在外面接聽電話時，要小聲點。到別人家裡做客時，不要隨便開冰箱。去訪問別人的工作場所或開會時，要穿著端正。去探訪企業時，不要穿拖鞋。在餐廳用餐要給小費，在韓國餐廳也一樣給小費。到雜貨店買東西未結帳前，不要先打開來吃。靠近鏡頭時，要懂得禮讓。看到黑人不要做出驚訝的表情。不要因聽不懂就罵人或批評。很多人一起行走時，要靠一邊走。不要坐在飯店大廳的地板上。不要將衣物和皮箱散放在飯店房間裡。不要將飯店的房間製造成垃圾場。從飯店出來時，每天在枕頭上放
    1 至 2 元美金的小費。把頭髮梳一梳再出門。要留鬍子就留，要剃就全部剃掉，千萬不要留幾根在下巴。不要背著手走路。吃東西時不要發出咀嚼聲。當外國人說韓文時，就用韓文回應。不要詢問他人的年紀。後面若有人，要為他拉著門，尤其對女性，一定要拉著門。不要拉服務生的衣角。不要打嗝。不要擤耳朵。與人說話時不要眼睛注視對方，手遮嘴巴。不要在公共場合補妝。不要分發國旗。不要在飯店的房間裡吃泡菜。'
