  md: '無數的提案不斷向我湧來，有時因我拒絕而被當作傻瓜，他們實在無法理解我為何拒絕如此大好的投資機會。我拒絕的理由有兩個，一個是利潤太多，另一個是不了解其事業的模式。若那是我不了解的事業模式，發生事故就無法控制；而預期利潤豐厚，就是風險很大的意思。


    像意外一樣突然被騙的情況，沒有想像中多。有被人欺騙經歷的人，經過深思後就會明白該學功課。如果還不明白，便有可能再次捲入騙局中，所以要特別小心。'
