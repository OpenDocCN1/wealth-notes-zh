  md: '時我恐懼。「（Be fearful when others are greedy, and be greedy when others are fearful.）他認為當所有人都害怕時，表示風險已在降低的狀態了。


    # 從哲學角度了解風險


    所以壞的情況並不糟糕，反而因為優惠的價格給了購買資產的機會，因此形成風險減低的時機。因害怕風險沒人買進的那一刻，正是風險最小的時候，這聽起來有些矛盾。飛機最安全的時候，就是飛機發生事故後的那一週，因為此時所有的航空公司都會更加徹底檢查、維護飛機。


    風險的特性之一，是過去的實例不會影響未來。尋找模式的人不會考慮新的未來或尚未發生的情況；當新的事情發生時，只會將目前的情況和過去綁在一起重新解釋而已。然而世上總會發生史無前例的最壞情況，而且在投資世界裡，那些沒有未雨綹繮的人到時候就會消失。另外，風險以規律的外表不定期地出現。「平均每
    10 年下跌一次、平均下跌 30%」之類的話，是對了解風險最具干擾的數據。


    沒有比「平均」更空洞的字眼了，因為有時「平均」是毫無意義的，或者扭曲事實。因此所謂了解風險，不是根據模式和分析而得出推測，而是從哲學的角度來接近風險更為合理。'
