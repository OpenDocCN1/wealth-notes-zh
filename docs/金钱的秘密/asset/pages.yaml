    上班族小旭從無後嗣的大伯父那裡繼承了一筆龐大的財產：100 億韓元。他夢想從此過著富人的生活，但是仔細閱讀遺書後發現有兩個條件：第一，遺產不能有任何一分損失。第二，要從利潤中扣除年度通貨膨脹率。


