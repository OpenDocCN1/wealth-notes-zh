  md: '與他們一同旅行，發現他們對購物毫無興趣。他們喜歡去參觀博物館，喜歡走路，也喜歡相聚在一起。他們完全沒有打算去購物中心，也沒有想買各式各樣的紀念品。他們與那些剛成為富豪，或者想要看起來像富豪一樣的人迥然不同。確實比起買東西，他們更喜歡享受當下的經驗，與工作夥伴們相聚，親自參與當地的活動。


