    沒有計畫、不做研究，全部的知識來源只有從財經頻道聽到的「高股息股票」和「認養股」，就憑這些消息便心急如焚、迫不及待地欲將全部的財產投入其中，比去挑別人的狗糧都沒誠意。像這樣在一天或一兩個小時內，就會促地決定投資項目的人，只要有人在他耳旁嘀咕一兩句，便立刻把錢拿出來。


