  md: '# 07

    成為年輕的

    有錢人


    成為百萬富翁並沒有想像中的難，致富的最快方法，就是放慢腳步。


    在我們父母那一代，儲蓄是最好的投資。每戶都有好多本存摺，幾乎沒有不儲蓄的。1971年7月，當時韓國信託銀行公告的利率 25.2%。80年代也持續這利率，1991年隨著利率的自由化，便下降到
    10% 左右。韓國銀行最高存款利率紀錄，曾達到年利率 30%（1965年9月）。


    如果在 1971 年以復利存了 100 萬韓元到現在，則足足高達 2,600 億韓元，是很值得儲蓄的。所以至今仍有許多老一輩的人，還是知道儲蓄是最正確的。那些剛踏入社會開始有收入的年輕人，也是先以存錢或把錢存入銀行來開始進行金融投資。這是慣性。


    但是現在不可能再靠儲蓄致富了，不僅不可能，還會造成損失，扣除約 2% 的物價上漲率和 15.4% 的利息稅，實際上本'
