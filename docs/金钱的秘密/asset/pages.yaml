  md: '響應而吸引顧客來到賣場，又頗有招攬客人能力的餐廳經營者，他從人潮流量的增加而得的收入，可能比賣餐飲所賺的錢還要高。這樣的人在人潮流量增加中所得的利潤，會全被屋主奪走。他們以自己的能力使建物商圈的顧客流量增加，並帶動建物价上升、租金上漲，但這一切都付給了屋主。


    # 兼顧事業並獲得利潤的方法


    這些人事業的本質不是經營餐廳，而是房地產開發商。他們非常能夠透過自己經營企業的能力，挽救那些較偏僻的位置，或者因別人經營倒閉而退出的賣場。只是他們不知道自己比任何人都有資格成為最佳的房地產經營者，自己是天鵝，卻以為是隻鴨子。屋主和我們不一樣，他只是以一生積蓄的錢和貸款買了一棟建築物，又因著有能力的企業經營者，使他可以靠月租來償還貸款、維持生活罷了。若有經營不穩的企業進來，漸漸拖欠租金，最後事業倒閉離開，那屋主也會心如刀割。因為屋主雖然最大，但上面還有一個銀行。


    這世上沒有人能贏過債務，但是你卻沒有拖欠租金，一直順利地經營事業。如果你擁有一棟建物，會比任何人都具有償還銀行貸款的能力，銀行最喜歡的顧客就是你。因此要成為建物的所有者，自己來兼顧事業和人潮流量增加的所有利益。人潮流量增加而獲得的利潤，可能比經營餐廳所賺的錢來得多。'
