- pgno: 12
  md: '# 01 金錢是有人格的


    金錢隨時都在注視我們，所幸金錢不會記仇，因此無論我們過去的行為如何，若從今天開始學習尊重它，錢便會重新開始尊重我們。


    金錢是有人格（person）的，如果說金錢像人一樣，是具有思考、情感和意志的人格，我想可能有些人很難接受這種說法。因為人格是指自己能思考、有自我，是個別的實體。而金錢不會自己思考或移動，它只是數字而已，所以或許聽起來有點牽強。但在企業領域中，公司也被賦予人格，正如有個「人」字的「法人」（legal
    person）一樣。公司法人像人一樣有訴訟，也會遭訴訟，如一個主體一樣，能與人抗爭、協商或合作。


    金錢具有比「法人」更精巧、更具體的人格。有些錢喜歡與人在一起成群結隊；有些錢則一輩子躲藏著。它們之間有各自會去的地方，且隨著流行聚集或分散。它們喜歡依附於看重自己的人，對於隨便看待錢的人，有時會以傾家蕩產作為報復。只要是隨便看待小錢的人，儘管時而會獲得大筆的錢，但是錢也會很快就離開，它們會留在善待金錢的人身旁生小孩（利息）。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 學會與錢一起生活


    正因為如此，金錢不會靠近隨便看待錢的人。因為金錢有這種特性，所以我稱之為人格。在本書中將會不斷地出現一些我把錢比喻為人格的內容，希望各位讀者能理解。我之所以能成功擁有豐厚的財富，就是因為我學會把金錢視為「有情感的人格」，並且學會與錢一起生活的方法。


    如果我們因為太愛錢，只把它關在家裡面，那麼它一有機 會就想往外跑，而且會告訴同伴這人是守財奴，千萬不要接近 他。對於不尊重錢的人，它不會協助他們成為富翁。人若能把
    錢用在有價值意義和慈善的事上，錢會被感動，而且呼朋引伴 帶其他的錢來找主人。但那些將錢用在酒家或賭博的人，它就 會背離那抱持不正確心態的人。


    金錢是具有情感的實體，所以要愛它但不能過分；該擁抱 時就擁抱，但是該離開時，則需要放開它。絕對不可忽視或隨 便對待它，要懂得尊重和感謝。有如此心態的人，錢總是會給
    他機會，並接近、保護他。


    金錢隨時都在注視我們，所幸錢不會記仇，因此無論我們 過去的行爲如何，若從今天開始學習尊重它，錢便會忘記一切， 重新開始尊重我們。學習接受金錢是具有人格的實體，對待它
    要像朋友一樣，與它維持深厚的友誼。當我們如此下定決心的'
  merge: -1
  img_proc: true
- pgno: 14
  md: '那一刻，對金錢的態度便會煥然一新。不再隨便看待小錢，也會把大錢送到它該去的地方。就像我們不會為了奢侈或虛張聲勢而利用朋友一樣，我們會把它們帶到好的地方。


    # 錢不是所有物


    我們會將身上的錢用在高尚的事情上、用在所愛的人身上和值得保護的地方。而從旁關注這些動作的錢，也會吸引更多的「朋友」來到我們身邊。同時我們也不該成為金錢的奴隸，因為錢不是所有物，彼此不是上下的關係，而是互相以高度尊重的形式在一起，這才是真正富有的面貌。


    透過勒索、暴力或非法而進入權力者或暴發戶手中的金錢，會隨時等待潛逃的日子，或者會傷害主人之後逃離，所以我們必須棄絕與危險的金錢變親密的意念。


    當我們意識到金錢是有人格，且接受這觀念的那一剎起，就開啟了一生通往富有的道路。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 02 投資比我

    更優秀的經營者


    > 投資這些優秀的公司，就等於與他們合夥，而且不需要他們的同意，隨時都可以投資。


    我在三十多歲時曾經投資股票，結果慘遭失敗。我憑著過去對股票的資訊，找到了最好的交易模式，甚至還介入了投資的程序交易。當時我相信這是最快解決貧窮的方法，我自以為我比一般人聰明又有膽識。現在回想，那不是投資，而是投機。何等的愚蠢，真是羞愧不已。


    當時以投資人而言，我的水準程度連進幼稚園都不到，但自己卻以為是大學生的水準，這種態度當然不可能有好的結果。市面上有很多以過去的數據來預測未來的書籍和演講，每當看到這些便想起過去的我，心裡不禁充滿了遺憾。若猜測這些人現在和未來的財產狀況，我的感受的確如此。當時我賠光了所有的財產，從此不再涉入股市。直到大約是
    5 年前，我才重新'
  merge: -1
  img_proc: true
- pgno: 16
  md: '開始投資股票。而過去這 5 年期間，我雖然買入相當多的股票，

    但是幾乎沒有賣出。若有人問我是否在投資股票，我會說沒有，

    因為我不是透過買賣股票來賺錢的一般投資者。


    # 有資產時應該做的兩件事


    若有資產，我會做兩件事，就是將它用在擴展公司或足以

    再創造出其他資產的地方。近幾年來，我的公司不再需要增加

    資本，所以必須再為公司的剩餘資本尋找其他的投資。我這一

    生都是企業家及經營者，但我知道還有許多人比我更優越，所

    以有時候我甚至覺得自己像個幼嫩的小孩。在市場上有太多更

    優秀的公司或經營者，那是我未曾想過的。所幸其中有很多是

    已經上市的公司，這代表任何人都可以如願以償地購買該公司。

    買 100 美元也好，1,000 美元也可，甚至一天也可以買幾百萬美

    元，即使它是世界上最大的公司也一樣。


    與我們往來的客戶當中，也有很多年年成長、經營績效優

    良的公司。或者我以消費者及客戶的立場接觸的公司當中，也

    有許多卓越的經營者。這些公司大部分都比我的公司大、更成

    長，而且是很有能力的經營者。比我更優秀的經營者，經營著

    比我更優良的公司，所以我沒有理由對投資猶豫不決。


    因此投資這些優秀的公司，就等於與他們合夥，而且不需'
  merge: -1
  img_proc: true
- pgno: 17
  md: '要他們的同意，隨時都可以投資。只需要找到該公司的配息政策、配息率及合理的價格幅度。合理的價格取決於你要買多少股，而不是按照既定的預算，考慮用多少錢來買一股，因為配息率隨著股票的數量而改變。在企業和投資的世界裡，投資比我優秀的企業和經營者，不是非法也不是非道德的事情，更不是可恥的，乃是一件極其合法、合理，又值得驕傲的事。


    我會儘量使用我所持股的公司物品或福利，因為現在它是我的公司。我用微軟電腦在亞馬遜購買 NIKE 球鞋，用大通銀行（JPM）發行的信用卡付款；用蘋果手機叫 Uber，到機場搭乘達美航空回家；途中經過好市多買一箱可口可樂，放進三星冰箱裡。這讓我有種自給自足的感覺，不是單純的消費者、競爭者或旁觀者，而是老闆。等除息日股價若下跌，我還可以
    用更便宜的價格購買優良公司；說到這裡，不禁覺得自己有些狡黠。拉著比我優秀的經營者衣角隨行的心情，彷彿擁有一個好哥哥般。盼望各位也能找到自己的好大哥！'
