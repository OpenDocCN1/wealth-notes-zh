  md: '或投資，就需要向銀行借貸才能慢慢增長。投資房地產的人也差不多，認為「絕對不可負債」的觀念，是因為沒有弄清債務的功能。


    盼望大家從這一篇的內容中，得到的資訊不是「負債沒關係」，負債確實是恐怖的。不懂得用刀子，就會切到自己的肉，若操作避刀有餘，便能烹飪出精美的菜餚。但是刀子仍然是危險的，必須小心操作。'
