- pgno: 219
  md: '以上問題答案若超過五個「是」，則絕對不要開始投資。我想目前情況甭談投資，可能連錢都存不住吧。投資是合夥關係，又是參與經營。交易是單純的買賣，從批發商購買蘋果，再拿到市場賣，這不叫做投資，那是低價買進高價賣出的交易。在股票市場上透過股票的價差來獲利，或者在房地產市場上做差額投資、買賣土地所有權，都不能稱為投資。要懂得分辨自己是投資者還是交易者，才能開始動作。你可能需要投入很多錢，才能確認哪種方式適合自己。


    自己必須有買進和賣出的標準，不是別人制定的標準，而是你自己。在市場上最愚蠢的問題，就是詢問別人買進賣出的時機。問此問題是因為自己沒有標準，沒有標準代表無法說服自己為何投資。這樣的人因為很會購買而獲利，但結果還是賺不到錢。因為直到賣出為止，利潤才算實現。


    如果你需要購買高級車子、名牌包和昂貴的衣服讓人稱羨，那麼還未具備投資的資格。當你想讓人看起來自己很富有的時候，就不要花錢；成為有錢人了，就要使用錢。在成為有錢人之前，必須將所有的資產用來創造其他的資產。雖然品味帶來金錢，但品味和奢華是不一樣的。與實際資產相比，过度的品味也是奢侈。


    # 成為成功的投資者


    投資至少要等待 5 年，才能發揮應有的價值。要注意的是「至'
  merge: -1
