- pgno: 164
  md: '# 05 上班族成為有錢人的方法


    當成一人公司的經營者時，就要常常思考和努力改善服務。因為顧客的收入增多，你的收入也增加，而且還會升遷。


    我們去上班的理由大致分為三種：看重穩定生活的價值、對於創業的恐懼比希望更大、雖有創業的欲望，但沒有創意或資本。如果不得不上班，那麼要一個上班族成為有錢人，那方法就是成為經營管理者或總經理。


    但是，想成為經營管理者或總經理，本人卻仍然走在上班族的方向時，達成的可能性則微乎其微。你的工作方向要朝著給予薪資、下達指示、工作不受時間限制的「雇主」，而不是拿薪資、接受上面的指示、在規定時間內工作的「勞方」。換句話說，要將自己視為一人公司，把主管或公司視為你的顧客，不要把自己當作按照指示工作的雇工而已。


    自己就是經營「我」這一家企業的老闆，將自己想成「與'
  merge: -1
  img_proc: true
- pgno: 165
  md: '公司簽訂企劃服務合約的商業夥伴」，而不是企劃組的職員。如果公司滿意我的服務，就會更新合同，即使需要提高費用也甘心樂意。把自己當成一人公司的經營者時，就會常常思考和努力改善服務。因為你顧客的收入增多，你的收入也增加，而且還會升遷，帶來連鎖反應。


    # # 成為公司合夥人


    對雇主來說，公司的收入因一名員工而增加時，就很難按照一般員工的制度給予他薪資。會怕他辭職，也擔心他去創業，最後只剩下讓他成為合夥人的這一條路。就算不能合夥，也要將他升遷，給予他較高的薪資或分紅利。


    從公司的立場來看，員工有三類：第一類是工作績效低於薪資的人、第二類是工作績效和薪資相稱的人、第三類是創造出比薪資還要高利益的人。第一類工作績效低於薪資的員工會被解僱；第二類工作績效與薪資相等的員工，只能維持原位，不容易被升遷；第三類能創造出比薪資還要高利益的員工，則會獲得升遷，並且被接纳為合夥人。


    以我的標準來看，那工作績效和利益比薪資高的人，他所創造的利益，至少是他薪資的 3 倍，因為這樣他的薪資與公司的利潤及盈餘才是相當的。但是在職場上，也有些人即使沒有'
  merge: -1
  img_proc: true
- pgno: 166
  md: '實際創造出 3 倍的利益，卻也能獲得升遷和報酬。如果一個人能力傑出但沒有忠誠度，另一個人忠誠度高但能力不足，那麼老闆會提拔誰呢？


    忠誠度是必要的條件，能力則是可選擇的條件，所以一個員工雖能力稍微不足，老闆也會因他高度的忠誠度使他升遷。理由很簡單，因為能力強卻沒有忠誠度的員工，會隨著績效提高而出去創業或要求合夥。因此個人只要有略高於平均水準的績效和忠誠度，就能成為高層管理者的候選人。


    # ## 工作的兩個成功關鍵


    +   只要有兩樣值得關注的行動，無論在哪裡工作都能成功。第一是報告的時間。


    接到主管的指示之後完成了工作，就需要向主管報告工作已完成。你或許認為「做完就可以了」，但從主管的標準來看，就等於沒完成。如此小小的動作帶給主管很大的影響。在下的職員們也因類似的問題而備受困擾，但實際上自己也不會對上司這樣做。主管也不太容易每次向下屬確認工作完成與否，有時連自己也忘了。但是有一天，他發現所指示的內容沒有報告，被遺漏了怎麼辦？這種事只要發生一次，就會留下不好的印象，可能那些過去
    99% 按時完成的工作都毫無意義了。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '相反的，若能按照指示執行，並立即向上級確認，特別是向主管確認完成的工作是被遺忘的部分時，便在上司心目中留下信任的印象。第二個是「禮貌」，俗話說：「有禮走遍天下」。在不造成令上司為難的情況下，無論在電梯或餐廳裡遇見你的主管時，就主動向前問候，這是在幼稚園學習的禮節。鄭重地問候，意味著兩人之間產生了一種關係，有了關係和因緣才能成事。英文有一篇「推繩子」（pushing
    on a string）的文章，一輛帶有繩子的玩具車，我們拉那繩子，玩具車就被拉過來，反過來推繩子，玩具車怎麼也不會動。玩具車只有在拉它的時候才會有反應，上司們也只有在部下「拉」他們的時候才會有回應，而「問候」就是那條繩子。上司們不會隨便「拉」屬下，因為還不確定他們是否是忠誠的。


    總而言之，在職場成功的原則非常簡單。把工作當成自己的事認真工作、立即報告、有禮貌就可以了。特別在小企業裡，只要做到這幾點，幾年之內就有可能成為高階主管。從經營者的角度來看，這樣的員工是顆寶石。老闆的心自然被他吸引，總是想為他做點什麼，甚至有種「終於找到了接班人」的想法，會非常珍惜他，因為老闆認為極少有這種態度的員工。


    若成為高階主管或總經理，就有可能得到比一般上班族高10至20倍以上的收入。並且根據公司的情況，還可能有特別津貼和股票選擇權，或者透過參與經營來認購股票。'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# # 持續投資


    上班族要成為有錢人的另一個方法就是投資。就是持續將20% 的薪資存下來創造種子資金，並持續投資。在職場上領薪水的人，若不用投資來致富，那只有與富豪結婚或中樂透這一條路。


    若不夢想透過升遷來達到成功，或者認為無機會，那麼就要勤奮地學習投資。如果**不投資，只想用退休金來養老，人生後半場可能會變得很悲慘，這世界沒有完全有保障的工作**。就當作沒有這
    20% 的薪資，並且以正確的方式存 20 年以上，大部分人都有可能富有地退休。然而投資也需要幾經熾熱的學習過程才能帶來成功。


    就當作自己有兩個職業，並持續不斷地學習和觀察經濟。你不能認為投資是儲蓄，儲蓄不再是投資，也不是零存整付，更不是保險。還要另外學習能夠賺得物價上漲率以上，以及平均股價指數以上的技術。如果沒有這個技術，那麼希望你能保持禮貌、尊重老闆。若能實踐這兩個方法，雖然是工作穩定的上班族，保證也能成為百萬富翁。'
  merge: -1
  img_proc: true
- pgno: 169
  md: '對於足球比賽的勝負有個爭論點：究竟教練的角色和選手的角色哪個比較重要。從球隊比賽的特性來看，教練的重要性毋庸置疑。2002 年韓日世界盃，以及最近在越南擔任教練的朴恆緒的活躍表現上證明了一點：一樣的團隊成員，在換了一名教練之後，榮獲了卓越的成績。


    優秀的選手要發揮技能，需要有遊刃有餘駕馭戰略和戰術的教練，調整球隊內部的角色，讓選手發揮應有的能力。他要決定哪個選手什麼時候進場、什麼時候退場、要在哪個位置與對方的哪一名選手交手。因此球隊的實力會隨著教練的判斷而發生變化。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '資產的投資也是一種團隊競賽。韓國的投資比起資產分配（asset allocation）更傾向於只關注投資的部位，有很多關於投資何種商品的研究和資訊，相反的，對如何分配資產卻興趣缺缺。這如同組好了一支球隊，但沒有教練（資產分配），選手（部位）全都上場做前鋒，而守門員也分擔了前鋒的功能，無人守球門的情形一樣，甚至主要選手或候補選手全都上場了。


    # 每筆錢都有自己的故事


    資產本來是寫著擁有者的名字，是屬於一個人的，但也是各個不同的錢，正如同一支球隊，選手卻有多名一樣。因匯集金錢的過程不同，所以金錢裡面也有敗生的。有的錢叫做本金，有些是來自外國的傭兵——美元和人民幣。而且各自的合約期限也不一樣，有的是將在1年之內出去的錢，因為它是結婚預備金；有些錢會進來勾引其他的錢，因為要在3年內買房子；有些錢將一輩子做土地爺，因為它會存活到最後，成為退休金和遺產。


    每筆錢都有它自己的故事、目的和期限，因此在投資之前必須先訂定，並透過資產分配來計畫要在何處、以何種方式來投資比較恰當。若沒有認真地思考這個過程，那麼就像沒有教練就上場比賽的球隊一樣。無論何種比賽，都需要團隊合作，只有一、兩人的球技表演很快就結束了。再偉大的選手，也不能獨自防守、傳球、帶領比賽，否則不用猜比賽一定會輸。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 建立自己的有價證券投資組合


    所謂資產分配，就是以現在的資金，根據它的目標或承受風險能力（risk tolerance）以及投資期限來分配後，訂定投資的方向。資產的種類隨著政治、社會的條件而帶來收益率或風險性的變動，因此要避免集中在特定資產上的風險，要創造符合投資者目標的資產組合，這就是有價證券的投資組合（portfolío）。每個投資者的年齡和收入都不同，使用計畫和預期收益也不一樣。


    第一，檢視自己的財務狀況。第二，確認投資的目的。第三，設定風險承受度。要將這些變數考慮進去，根據投資項目來分類。


    企業的基金管理者，可能認為資產分配比投資更重要。因資產分配若做得好，投資反而變得更容易。比起個別投資項目的選定、買進、賣出的時期，如何投資於何種資產更能創造大部分的收益。


    但是現實的投資世界，只見選手不見教練，忘記資產分配價值的重要性，只尋找該投資哪種項目，於是時常出現失誤。無論是何等優秀的投資天才，也無法每次都預測成功，順利地買進賣出。唯有分配才是維持資產的根源。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '建立自己的有價證券的投資組合時，首先要做的就是準確地確認和了解本人所投資的資金類型。正如你是教練，必須先認識自己團隊的選手一樣。每個選手的實力不一，優缺點也不同。同樣的，金錢的用途和耐心也都不一樣。教練要考慮安排哪個球員在前鋒，以何種方式讓幾名防守員上場。他必須根據對方球隊來計畫比賽，考慮除了守門員之外，該將十名球員的陣型分為「4-3-4」或「4-2-4」，還是「3-5-2」。資產分配不是將
    100% 的資金全部投資在股票上，而是劃分為債券、房地產或儲蓄商品，需事先考慮各種資產可持久的時間，並設定每種資產的預期利益，這所有一切都是資產分配。


    我認為在投資上，教練比球員更重要。簡而言之，做好資產分配是投資利益的全部。其實資產運用良好的基金公司，都具備明確的分配政策。運用資金的首要義務是不能有損失，如果沒有資產分配的策略，總有一天會失去所有，無論過去賺了多少，都可能一次全都消失。


    盼望各位將全心關注投資產品的心，投入在資產配置當中。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 07 與銀行討價還價？


    我們的選擇決定我們的命運，

    若相信自己只能在別人既定的事情當中選擇，

    那麼我們只能活在別人制定的人生當中……


    「您要不要用牛肉呢？還是雞肉呢？」在飛機上聽到空服員問這問題，並不表示只有兩個選擇，我們可以回答：「兩個都要」。若某家著名的餐廳規定「未預約，恕不接受」，就請他們將我們排在候補的名單上，因為可能有些客人會臨時取消訂位。當銀行的行員拿出定存的表單，一邊在上面圈出一邊告訴你定存利率為
    1.9% 時，就要求他 2.08%。


    不管有什麼，提供的選擇權限，大部分都不是最終的選擇權。有時候「不選擇」也是一種選擇。


    航空公司會根據乘客對雞肉和牛肉的喜好比例來準備餐盒，但有時也不準，點餐的比率有時較偏向一種，而一邊有剩餘的情況。若有剩下的，空服員就會送來。著名的餐廳也會有一定比例的顧客，最後會有取消預訂或無法準時到達的情況。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '但是餐廳為了提高品質，還是堅持預約制度，所以對沒有預訂就進來的客人，不能公開告知還有座位。若是穿著端正又帶著禮貌、尊重的語氣請求候補座位時，大部分都會排到座位。


    # 以資訊為出發的請求


    1.9%的利率是銀行想要出售的價格，但是如果你知道隔壁銀行同樣的活期儲蓄存款利率是2.07%時，就可以提出2.08%的要求。不想失去客戶的銀行經理會自行斟酌，其實每家銀行內部都有例外的規定。外幣兌換的手續費也一樣，可以不管基本的匯率，提出自己希望的匯率，因為每家銀行的兌換優惠匯率都不一樣。不要停止在九折的優惠匯率，試著提出自己想要的優惠匯率。因為外幣兌換的手續費率隨著各個銀行有1.5%到1.9%的差異，因此就算九折的優惠，也有一番差異。1萬美元（以1,200萬韓元的匯率計算）1.5%手續費的九折優惠匯率和1.9%手續費的七折優惠匯率，差額是5萬400韓元。


    我的意思不是要大家表現強詞奪理，而是遇到被要求選擇或要選擇的情況時，不要以為只能選擇廣告內的選項。強詞奪理反而會把事情搞砸，會讓我們變成無禮的人；但是以資訊為出發的請求是對我們有利的，不會造成對方的損失。反正飛機上那些剩餘的餐盒，在降落之後就會立即銷毀；餐廳本來要浪費的食材，也可以在不失品味的情况下，讓它變成額外的收入；'
  merge: -1
  img_proc: true
