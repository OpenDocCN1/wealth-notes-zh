  md: '國中時從學長口中聽到了一些故事，於是曾在星期六晚上 12 點，去探勘學校的公共洗手間。因為我很好奇，是否真的像他們所說的，會有鬼遞給我紅色或藍色的衛生紙等之類的事。我拿著手電筒，從一班到十班，打開所有的教室和洗手間，就是沒看到鬼。曾經有一段時間，我也很想去觀看暴風和龍捲風，所以很認真地思考這件事，但因為妻子的勸阻而作罷。


    現在我仍然強烈渴望看到活火山爆發和阿拉斯加冰山崩塌的景象。我也不怕獨自到山上野營，我很想體驗自我想像的恐怖或大自然帶來的恐懼，但問題是這些都沒法讓我感到恐懼。反而股市崩盤比鬼魂或暴風更可怕，但是比這種不景氣或恐慌更可怕的是貪婪和泡沫。恐懼會悄悄尾隨，而貪婪來臨時，則要逃之夭夭遠離它。


    市場景氣再怎麼不好，5 年就會回轉。因為政府改朝換代，產業也改變了。我學到房地產不是用來買了又賣出的，如果想賣出，那乾脆賣股票還比較好。所以我會試著把它放
    10 年，我至今還沒賣過任何一樣，事過之後，總是覺得沒有賣是對的。無論是股票或房地產，我會尋找一輩子都不需要賣出的商品。


    任何類型的行業，若在該行業中排名第一，它就有定價權，這是領導業界之人的特權。不管是房地產還是股票，我都會尋找第一名。購買房地產時，我會選擇那城市最昂貴的地區；購買股票時，我會買該業界排名第一的股票。與其買百事可樂，'
