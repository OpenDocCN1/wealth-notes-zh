- pgno: 90
  md: '第三是能克制欲望。這條件是一個人必須成為自己生活的主人。


    財富是相對的比較，無論有 50 億還是 100 億韓元，只要與別人比較，就認為自己並不富有，這就是人。雖然有 100 億韓元，但是站在有 200 億韓元的人面前，可能會覺得自己很寒酸，而面對
    1,000 億韓元的人，就顯得更是自卑了。


    # 創造一個「不再需要工作」的環境


    這種人不管賺多少錢，總是覺得貧窮。雖擁有數萬億財產，但是若站在比爾·蓋茲或傑夫·貝佐斯（Jeff Bezos）面前，可能還是覺得自己很寒酸。要有自我人生哲學和自信，才不會與人比較。有自信的人，雖有錢，也隨時可以購買名牌精品，但不會堅持必須擁有。他不需要用炫耀財富來提升自己的自尊，所以不會一定要戴高級名錶或拿高級名牌包。如果必須擁有豪宅、高級房車、名牌精品以及享受豪華美食，才能提升滿足感，那麼最好一輩子都不要遇見比自己更富有的人。


    結論是創造一個「不再需要工作」的環境，才是成為有錢人的第一步。所謂不再需要工作的意思有兩種：一個人完全離開工作職場，但是還會有收入，而且他的精神和思想是自由的，不需要和別人比較。意思就是肉體和精神兩者都得自由才是富'
  merge: -1
  img_proc: true
- pgno: 91
  md: '有的人。若住在鄉下一間屬於自己的小房子裡，非勞動收入高於鄰里的平均水平，而且對那收入感到滿足，這就是富有的人。


    我的經驗是，當我們真正成為有錢人時，有時候會忘記自己擁有多少錢。因為無法測量所投資的資產或公司的價值，如果想知道自己的資產規模，還要尋求他人的幫助，也不清楚銀行帳戶裡有多少錢。現金性的資產也隨著每分每時的股價而變動，吃頓午餐的時間，就消失或增加了一棟房子，這代表你已达到無法與別人比較的情況。


    所以我認為清楚自己現在有多少財產的人，其實並不是有錢人。有錢人不能根據金額的標準來衡量，因為有錢人是不需要再賺錢的人。'
