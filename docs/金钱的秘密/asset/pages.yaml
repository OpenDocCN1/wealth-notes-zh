- pgno: 153
  md: '樣的問題：「您是否太強調金錢了？我們雖然知道金錢對生活很重要，但如此存錢，不就成了金錢的奴隸嗎？」其實我只是談論有關金錢的重要性和致富之道而已，但是我發現當我提及有關儲蓄和投資，或者節約方面的話題時，有些人就會表現出不悅。但我覺得提出此問題的年輕人是虛偽的。


    如果鄙视金錢的話题，就是关闭了致富的第一道门。对金钱的看法如此随便，我认为那人的想法本身就陷入金钱奴隶的状态。若因为钱的问题，所以不能去医院、不能读书、只能延迟结婚、不敢生小孩、不能帮助父母、老了还要找工作到处欠债，这才是金钱的奴隶。


    韩国老人的贫穷比例接近 50%，老年人的自杀率居世界第一，三分之一的原因是经济因素，因为年轻时随便对待金钱的结果。我建议要减少消费、多多储蓄及投资，并不是鼓励大家变成吝啬鬼，不要过幸福的日子。其实刚好相反，财富增值，了解社会的经济结构，踏上致富之路是莫大的幸福。趁年轻时追求这幸福，将来就有富裕的生活，而这富裕的生活又能带来其他的幸福。希望现在大家拿着剪刀往书桌去。'
