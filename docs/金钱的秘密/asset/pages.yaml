  md: '# 產生更多富有的人


    我們學習數學是先從四則運算開始，再學習九九乘法，進一步理解四則運算。學習英文也要先從學英文字母開始，包含大小寫字母都要背，這是起步。我們無法向任何人學習金融或經濟，沒有一個國家或學校有個體經濟的相關教育，原因很簡單，因為沒有理由非得要教。


    這意思就像古時候不讓奴隸或奴婢認識字一樣，因為他們學會認字之後，便開始懂得深入思考，能整理記憶，看懂文件，所以管理者不會喜歡下面的人學習識字。經濟知識也是如此，經濟知識豐富的人，會讓資產家的地位受到威脅。


    因為所有的投資合約會曝光，無法在股票或銀行交易中占優勢。但我相信隨著中產階級日益壯大，將會擴大國家安全網，發展出健全的社會。若自己變富有而其他人仍在貧窮當中，這看起來似乎很好，但是此國家的政治和社會的安全網會瓦解，最後還是上層集團的人包攬了這一切危險。因此最好的國家是中產階級穩固，任何人只要努力工作，都可以成為中產階級，並產生更多富有的人。


