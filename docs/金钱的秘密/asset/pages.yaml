  md: '# 15 金錢流動的時間

    都不相同


    錢會隨著金額和來源，各有不同的流動時間。

    即便是相同的金額，根據它的來源，

    時間流動也各不相同。


    電影《星際效應》中，有一個時間流動不一致的場景。這個場景顯示，離開地球的太空船，經過蟲洞到達遙遠的銀河系時，在太空船裡度過的歲月只有兩年，但在地球上已經過了23年。相反的，也有比地球流動更慢的時間場景。這理論就是受黑洞影響重力場變強的地方，時間流動非常緩慢。


    伽利略發表了相對論說：「所有的運動是相對的，等速運動的觀察者適用相同的物理法則。」但是科學家發現了「光的速度始終不變」的事實，於是相對論受到了挑戰。在搭乘火車時，若要算出對方的速度，需要對所有觀察者應用「加速度定律」的物理法則，但是計算光速時不能應用「加速度定律」。愛因斯坦發表了與這種矛盾性相反的「狹義相對論」（或稱特殊相對論），他證明靜止和移動的人，其時間的流動是不同的。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '我們不談難懂的物理定律，簡單地說明，例如，當一個人墜入愛河或熱心工作的時候，覺得時間過得特別快；而坐在狹窄的飛機座位裡，幾個小時就像一天一樣漫長難耐。對領薪水的人來說一個月很長，但對欠債的人而言，還錢的日子感覺一眨眼就到了。我們常說年紀越大，時間過得越快。對
    60 歲的年長者而言，1 年的感覺是人生的六十分之一，但對 6 歲的孩子來說，1 年的感覺是 10 年。無論人或世界，時間的流動都不一樣。


    # 有時間的金錢豐富有餘


    錢也是如此，它一樣受特殊相對原理的影響。它會隨著金額和來源，各自有不同的流動時間。即便是相同的金額，根據它的來源，時間流動各不相同。而且會隨著金錢的主人，流動的時間也不同；即使是同一個主人，也有在不同時間所獲得的錢。時間充裕、緩緩流動的資金，雖進入同樣的投資當中，卻會安穩地等候其他資金到位；但是時間不足、急躁的錢如坐針氈，沒有時間結交其他的金錢。要有充裕的時間才能結交朋友、談戀愛、生小孩，雖然是同一時期投資股票的金錢，有些錢是明年結婚的資金，有些錢則是下學期要繳的學費。最可怕的傢伙是從貸款舉債跟來的錢，這樣的錢像食人族一樣，啃食著本金且到處亂跑，甚至有時會突然衝出來，想吃掉本金和本金的主人。相反的，有些錢因為無確實落腳之處，所以打算就在這地方安頓過日子，領取
    10 年 20 年的股息。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '雖然在人眼中看到的是錢的額度，但這些錢在成長、製造以及尋找主人的過程中，都經歷了不同的環境。雖然流入同一個主人，有些錢的時間多，有些錢沒有時間。被主人擁有的金錢，它的時間也會隨著那位主人而改變，如果主人所持有的金錢是已經有很多時間的金錢，那麼新進的金錢也將開始有更多的時間。金錢大量的湧入，不代表新的主人就能給那些金錢更多的時間，除非那個人的品格比錢好。


    遇見好主人的金錢會越來越豐富有餘，它會深思熟慮，將錢送到好的地方。它不急於追求成果，也不會為了生小孩而威嚇、糾纏。金錢會結識更安心的好夥伴，結出更多的果實。神奇的是，時間多的金錢所生出來的金錢，因為都是一樣的孩子，所以又會生出很多有時間的金錢。


    沒錯，無論是誰，若不能領導時間充裕的金錢，那麼最後將被那些金錢所指揮。'
