- pgno: 179
  md: '我在 30 歲那年，學了當時在美國剛開始普及的圖表分析訓練技術後，第一次投資了股票。由於當時的失誤賠掉了全部的財產，之後二十多年來再也沒有接近股票市場。未來是新的，但我從過去推測未來。雖然根據過去的數據投資，便能產生利潤，但當時我並不知道其實目前呈現的數據，就是新的過去。當我知道這一點的時候，是已經失去全部財產以後。那不是投資，而是投機和賭博。因為我學的是錯誤的投資，所以賠光了累積多年的財產並負債，之後就不能投資了，我就這樣浪費了珍貴的
    20 年。


    接住掉落刀子的勇氣，以及接住那刀子時所受的傷，讓我明白有一天正確握住刀鋒、收割一捆莊稼的秋收季節一定會到來，這是我將近 50 歲才學會的功課。現在才弄懂也真是萬幸，我只是希望我的失誤能成為年輕人的警惕。'
