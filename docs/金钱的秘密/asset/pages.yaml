  md: '特別的優惠，我沒有理由推辭。過沒多久，上市掛牌竟被撤銷，股票變成了廢紙。我應該就此停止，然而我的無知和欲望再度燃起。


    # 無知和貪婪的結果


    他說美國股票即時技術分析交易正熱門，藉此分析交易賺到錢的人越來越多，於是他提議成立這種交易公司來賺手續費。我連問都沒問，他所推薦的那誘人的股票，為何最後變成了廢紙。我一心為了不要做蔬果買賣，有機會能到辦公室裡上班而興奮不已，所以再次接受了他的提案。


    沒有任何可證明的利益，我們就這樣設立了證券交易辦公室。我們在幾位顧客整天謾罵聲當中進行了秒殺交易，但結果都慘不忍睹。不到兩個月，顧客因損失慘重全都離開了，最後只剩下我自己，開始親自著手交易，猶如賭場的經紀人獨自下注維持賭場一般。


    資本自然就這樣萎縮了，於是他又說：「既然這樣，就來個最後一擊，賺個大的吧。」他提議做股票期權交易。對股票期權不了解的我，不斷地問了又問，好不容易對產品有一番了解後，立刻開始進行股票期權交易，但這無非是一場猜單雙、大小的賭博罷了。我們不斷地重複賺得少、賠得多、付手續費，最後賠光了所有的資產。我陷入極大的挫折和失墜中，而徬忽'
