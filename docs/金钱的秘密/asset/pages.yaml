- pgno: 49
  md: '# 12 尊重別人能改變運氣


    不該為了高舉自己而對不在場的人不敬，

    若對別人關心的事不感興趣，

    那麼他的運氣也就到此為止了。


    幾年前，我曾透過一家報社的記者從中介紹，認識了一名韓國著名的企業家。他的企業從韓國起家，更擴展到整個亞洲。他的生活充滿了熱情，在經營事業上非常精心又很有自信。雖然面對許多跨國企業勢不可當的進攻，卻也輕鬆地堅持了下來，我被他創新的思維和充滿自信的事業態度深深感動。但是隨著時間流逝，令我感到困擾的事逐漸增多了。


    當他談論自己的事業時，眼神和口才一樣的生動，受到全場所有人關注，他也樂在其中。但是當別人談論另一個話題的時候，他就立刻顯出毫不關心的樣子。自己沒有主持話題的時候緘默不言，對他人的話題不表示興趣。而且在大家的談話中出現名人的名字時，他都帶著輕蔑的口吻說：「那個人啊……」'
  merge: -1
  img_proc: true
- pgno: 50
  md: '他稱呼歐巴馬、Carrie Lam（林鄭月娥，香港行政長官）、安倍或孫正熙等，一律都是「那個人」，他也如此稱呼他所有的朋友。不管對方是現任的部長、立法委員或他的晚輩、員工都一樣。顯然他是為了炫耀自己的事業領域和與人的交情罷了。


    顯然，當我從那個地方離開後，我也會被稱為「那個人」而已。最糟糕的是，他的話題焦點不斷圍繞著自己最近關注的高爾夫球，但全場沒有一個人在打高爾夫球。若有人談論有關植物園的話題時，他就把話題轉到那附近的高爾夫球場；若有人提到東南亞旅行，他會再次提起高爾夫話題；甚至有人提到郵輪相關的話題時，他也會把高爾夫扯在一起。也許他想在船上打高爾夫球，讓球飛滿天吧。


    # 話語顯露心裡的氣味


    他的熱情和經營事業的才華不再發光，雖然他的事業成功，但我想他可能不會有真正的好朋友，我真為他感到遺憾。恐怕那天出席的人當中，沒有一個人想珍藏他的名片。他不該為了高舉自己而對不在場的人不敬，若對別人關心的事不感興趣，那麼他的運氣也就到此為止了。


    其實我敘述這故事是為了我自己。我的事業規模逐漸擴大，也受到老師般的禮遇，但我發現最近我也會用「他呀、那個人、'
  merge: -1
  img_proc: true
- pgno: 51
  md: '那傢伙」等稱呼，來炫耀自己與那些頗有名氣的徒弟間的交情。我發現自己就連在私人的場合中，也像老師一樣很愛教訓人，話也變多了，這真令我驚愕。我從他的表現中看到我自己的樣子，於是我開始自我反省。


    我相信這些瑣碎的事會改變一個人的人生和運氣，甚至連經濟環境都會產生變化。要變成自以為是的老頑固，或是愚蠢保守的人，皆易如反掌，但是那一剎那，緣分、運氣、財富也必消失。


    因此，已經成功的人要懂得自我檢視，而想要成功並維持豐裕又穩定生活的人，則永遠不要學習這種輕浮的態度。要知道尊重前輩和朋友，善待晚輩或學徒，人前人後都要始終如一。少說話多傾聽，這樣的人會贏得人的熱愛和信任，而熱愛及信任將會創造運氣。


    人的心意表現在言談之間，若沒有情感，徒有理論和論點而已，則無法感動人、改變人。我們不會因為人的能言善辯而尊敬他，而是看見他的誠意。若是有誠意的人，即便彼此之間的想法和意念不同，也會互相尊重。話語顯露人心裡的氣味，透過人的言語就能聞到人心散發出來的氣味是惡臭還是馨香。而幸運和幸福都願意跟隨馨香之氣。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 13 重複的失敗

    是習慣


    當人陷入自滿的那一刻，

    會對完全不可能的事情充滿了確信，

    相信運氣就是實力，將推測當作知識。


    有些人做什麼都不順遂，例如好不容易準備開店，但下個月店鋪前面就要修路；走路扭傷腳踝或被詐騙；也常常發生汽車擦撞事故。大部分的人可能認為是運氣不好，但經常發生這種事的人，應該重新審視自己的生活方式。或許是因急躁的欲望，在沒有仔細確認的情況下就開店了，後來發現生意不如想像中的好，因此一邊擔憂一邊匆忙地走路，結果不小心被人行道破裂的地磚砸傷了腳。又因心煩意亂、粗心的行為釀成交通事故。這一切都有相互關聯，**不是因為運氣不好，而是讓自己一直暴露在倒楣的環境中**，才會遇到這些不幸的事。


    如果這種事故頻繁發生，就該想想這些就是人生的警訊，在尚未發生重大事故之前，要先檢視平常生活的所有方面。經'
  merge: -1
  img_proc: true
- pgno: 53
  md: '常忽略的各種小事故，有一天可能變成重大的事故。要檢視自己是否亂花錢、是否有太多無用的因緣關係、吃的食物乾淨與否、是否按時吃飯、在家或在外態度是否一致、是否嘲諷或誹謗別人、是否常常口出惡言等等。


    事情不順遂的人要少吃一點食物，不要吃太飽，要遠離重口味和粗糙的食物，要按時吃飯。光做到這些也能重獲好運，因為為了按時用餐，必須要有規律的生活，包含不需要見不必要的人。


    這就是開始，若這樣做，相信身體會變得更輕盈。會想運動，因為走路或動的時候，想法會變得更清晰。這時才懂得分辨貪婪和欲望，而且才會看到時機。因此當大家動的時候，才能按兵不動。雖然獨自站在反方向，也能控制自己的恐懼。這時一些隱藏在因緣關係當中的真實朋友，也會浮現出來。從此開始，一切都會迎刃而解，健康、財富和人脈也會隨之而來。


    # 重復的運氣是實力


    相反的，有一些人平時總是有好運跟著他。他無論走到哪裡，都會抽到獎品。又很會猜拳，也能一眼就找到停車位。做生意也毫無困難、凡事順利。這樣的人與其說他運氣好，不如說他比一般人更敏銳、更聰穎。他將抽獎單對折後放進抽獎箱裡，把手伸進抽獎箱裡來回攪動時，摸到對折的兌獎券比平放的機率髙。他觀察猜拳的時候，男人比較會出石頭，而女人出'
  merge: -1
  img_proc: true
- pgno: 54
  md: '剪刀的機率較高。所以和男人猜拳時他出布，與女人猜拳時就出石頭，因此贏的機率就提高了。在猜拳的時候，他觀察對方的手腕上有用力的筋，表示對方可能會出石頭。出石頭後輸的人，下次出布的可能性很大；而那出布之後輸的人，再出剪刀的機率較高。或許他是個沒事就熟練這幾條要領的人吧。如果我們沒有察覺這些，就以為他是個運氣好的人而已。


    這樣的人在經營事業方面，也很會找到符合時代潮流的項目，而且很懂得脫身。好像不管做什麼都很順利，在別人看來是運氣，但是從他的角度來看，是經過很多研究和觀察的結果。


    這樣的人最需要注意的是，別誤以為自己是運氣好的人。當周圍的人都稱讚他運氣好，而本人也如此相信時，就有可能发生重大事故。因他相信自己的運氣，所以大膽地嘗試一些不確定的事，跳進盲目的投資裡。有時也會成功，贏得大家的羨慕，但那些都與觀察和學習無關。運氣絕對不會重複，很可能因一次的失誤而摧毀一切。當人陷入自滿的那一刻，會對完全不可能的事情充滿了確信，相信運氣就是實力，將推測當作知識。所有情況皆順利時，會誤認為運氣就是實力，但運氣是不規律的。


    因此，無論我們是運氣好的人，還是運氣不佳的人，建議大家都能常常定時定量吃健康的飲食。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 14 透過新聞分辨事實和投資情報


    所有的人和企業都想確保現金，因此股票買賣顯得有些魯莽。恐懼生出恐懼，大家都在市場上拋售股票。幾個月前還充滿自信的世界經濟，瞬間就崩潰了。


    新冠病毒（COVID-19）於 2020 年 3、4 月，讓全世界陷入一片恐慌；美國道瓊指數由 1 月即將突破 3 萬點之際，瞬間重挫至 1 萬 8,000
    點。大眾媒體每天總是忙著統計、發布各國的感染及死亡人數，全世界都在恐懼當中。所有的經濟專家也都在預測經濟大蕭條及各種暴跌的資訊，煽動恐慌，導致大多數的股票跌破了公司的資產價值。


    因新冠病毒引發出很多的變動，從發行高收益（high yield）債券的公司破產開始，影響到優良企業的連鎖破產。2020 年 3 月份，美國失業率在下兩週內達到
    995 萬件，相當於 2009 年金融危機的 6 個月申請數量，是平常件數的 50 倍以上。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '曾經失業率僅有 3.5% 的美國，現在已攀升到 17% 了。失業率的增加會使收入不均的情況更加惡化，美國黑人的失業率已被證實從 3 月的 5.8%，到
    4 月急速上升為 16%。


    # 瞬間崩潰的世界經濟


    就業市場的惡化，將導致今後生產、消費、投資和實物指標等所有方面的惡化。不禁令人再次想起 1929 年美國經濟大蕭條的情形，被稱為先進國家的美國、英國以及歐洲主要強國，就這樣崩壞了。


    這些國家不是先進國，只是強國而已。各國的應對和醫療體系簡直到令人失望的程度，國家的領導人遭感染時，立刻就把世界封鎖。雖然世界的經濟焦點都在美國，但美國卻在其中呈現出最糟糕的面貌。光是最大的城市——紐約，感染人數就比中國多，甚至一天死亡人數高達
    600 人以上。疫情爆發初期，川普總統充滿自信地炫耀他們最好的醫療系統，能將犧牲降到最低。


    所有的人和企業都想確保現金，因此股票買賣顯得有些魯莽。恐懼生出恐懼，大家都在市場上拋售股票。幾個月前還充滿自信的世界經濟，瞬間就崩潰了。甚至以價值投資和長期投資聞名的巴菲特，他追加購買的航空公司股票，不到一個月也'
