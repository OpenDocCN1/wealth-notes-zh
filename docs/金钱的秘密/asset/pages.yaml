- pgno: 133
  md: '因為這事業裡面會埋藏著某個人的傷痛。還有一些製藥公司，也是當疾病發生和死亡人數增加時股價才會上漲。藥物原是用來預防死亡和治療疾病的，製藥公司卻因疾病傳染導致人類死亡，以致股價更加上漲。作為管理階層或投資人，不知道會有什麼想法。


    此外，我也會遠離那些因發生空汗或氣溫異常，而帶動股價上漲的企業。事實上這些是充滿爭議的話題，因為無論如何都需要有人做，而且是必要的。但是我不想把來自傷痛或不幸的金錢放進我的資產裡面，我所賺得的每分金錢都有它的故事。小時候曾讀過黃順元的《陣雨》，覺得惹人憐愛的清純少女是我理想的對象，但上了年紀之後，才發現惹人憐愛的清純女孩，並不適合做我的妻子。


    我覺得要與開朗的人生活才會幸福，因為太太情緒憂鬱，全家的氣氛就變得沉悶。金錢也一樣不喜歡憂鬱和黑暗，它會想要遠離那種氛圍。'
  merge: -1
