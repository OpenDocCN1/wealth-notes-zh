  md: '# 為孩子開立股票帳戶


    想要教導孩子成為企業家的方法，就要從小開始為他們開立一個股票的帳戶。國中是最佳時期，大學也很好。首先存入相當於一、兩個月補習費的金額，再用其中的 70% 購買韓國最大公司的績優股，用
    30% 讓孩子自己選擇要購買的公司。在孩子們使用的某些物品品牌中，會有一些在同儕之間很受歡迎的產品，或者提供服務的地方。父母與孩子們討論後購買這類股票，藉此機會教導孩子們如證券、品牌、公司價值、股息等經濟術語。當股票價格上漲或下跌時，可以與他們一起分析市場的行情。實際購買股票，看著自己帳戶裡現金發生的變化，學習相關公司和經濟的知識，與只是透過理論來學習的情況是天壤之别。


    只要孩子們能跟隨此方法，而且又感興趣，便可以往企業天才的方向培育他們。天才不僅在音樂、運動或讀書方面，若教導他們企業觀念，也能培育出天才。當別的孩子正在引領期盼蘋果新手機的時候，有些父母與孩子們所談論的，卻是蘋果公司的股息政策、該公司庫藏股的買賣動向，以及新產品預計銷售金額，因此這些孩子便能學會洞察政治、經濟、社會的所有層面。


    正如玩遊戲時要有賭注才有趣一樣，孩子們也是有了證券帳戶才能看到這一切。股票投資不只是單純的投資，而是一樣'
  merge: -1
  img_proc: true
- pgno: 191
  md: '工具，它能幫助孩子們了解企業、國家及世界經濟，並且在現場看見公司的經營系統運作情況。猶如韓國首席執行長李約翰（John Lee）所提出的建議，與其把錢花在私立學校或補習上，不如從孩子小的時候就把這筆錢存入他們的證券帳戶裡，這些錢將會變成孩子的大學學費或創業基金。


    # 不要過於低估孩子的潛力


    如果孩子想創業或經營事業，就會主動尋找適合自己的學習，他們只是不知道為什麼要學數學或英文，而不是不願學習。他們若覺得自己需要讀大學，就會去讀。無論什麼，只要他們覺得有需要，就會主動去學習。帶著他們去參加企業人士的演講，或參與股東大會，或透過展覽會、訪問企業界等行程來鼓勵他們擁抱經營者的夢想。


    韓國青年具有創新、卓越的實驗精神，但父母們反而希望他們能記取自己失敗的教訓，不要孩子們勇於接受挑戰。所以父母提出的方案和目標就是好好讀書，將來進到大企業工作，或者安定在專業的工作上就好。年輕人的潛力無限，父母們過於低估孩子的潛力了。一個年輕人若下定決心，無法預料他會創下何等驚人之舉，發揮何等潛能。


    不要將父母放棄的經驗傳承給孩子，除非是涉及犯罪的事，否則無論孩子做什麼我皆不干涉。做自己喜歡的事，做自己想...'
  merge: -1
  img_proc: true
- pgno: 192
  md: '做的事才是人生。我們不知道一個孩子的能力會發揮到什麼地步，所以希望大家不要限制孩子的夢想，只希望他們以進入大企業上班為夢想的目標。


    以色列是由國家、社會和大學帶頭積極幫助希望創業的青年，以色列青年的夢想是在美國那斯達克上市，而已有數不清的以色列人公司在那斯達克上市了，以色列人所持有的公司高達
    40%。


    # 培養具挑戰性精神的孩子


    為什麼韓國青年的夢想，不是在那斯達克上市，而是成為地主呢？這是父母的錯。以色列人稱奇特的挑戰精神為「虎剌巴」（chutzpah）精神，意思是指厚臉皮、大膽、魯莽、具挑戰性的精神。這豈不剛好符合你的孩子嗎？


    各位家裡或許有一個臉皮厚、大膽、不聽話又傲慢無禮的孩子，從小就不拘形式不受權威的約束，又敢反抗，吹毛求疵，我想這孩子正是有企業家的特質。因為沒有給這樣的孩子營造一個鼓勵去挑戰和創業，以及不畏失敗的環境，所以那些有才能、有創意的孩子，夢想就變成了穩定的公務員或老師。


    希望在這次孩子的生日時，送給他們一份精彩的禮物，就是一張上面寫著「企業家」頭銜的漂亮名片。當孩子拿到名片'
  merge: -1
  img_proc: true
- pgno: 193
  md: '時，立刻就變成了大人，因為他們參與了一部分的社會生產，變成社會的一分子。就算只是為他們開立儲蓄和投資帳戶，給予滿滿的鼓勵，就能讓孩子們具有在實際生活中勇於面對挑戰的精神。他們可以做自己想做的，父母若支持他們面對失敗和挑戰，就必能成功。


    「雖然頻頻失敗，但沒關係，只要成功一次就可以了。」如果各位的父母曾如此支持你成為企業家，那麼各位現在是否也是某公司的老闆，而不只是上班族呢？


    有一天你的孩子一定會將之前存在證券帳戶的錢，以幾百倍奉還給你。'
