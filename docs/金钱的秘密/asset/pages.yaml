  md: '在可以賣嗎？現在可以買嗎？」等股票相關問題時，彼此的答案必不同。提問的人要知道自己是屬於股票經紀人（trader），還是投資人（investor），而回答的人也要知道提問者是屬於股票經紀人還是投資人。


    # 勿憑一句話做決定


    會問問題是好的，功課好不一定會成功，但會問問題的人成功率可能會比較高。但投資的世界例外，因為投資與金錢直接相關，根據一句話所做的決定，與實際收益有很深的關聯。最大的問題是，回答的人不知道答案。銀行職員、證券公司的職員、會計師、專業投資人，甚至知名的基金經理人都不知道真相，他們只是傳達展望和傳聞罷了。諸如報章雜紙或電視上經常出現的高手外傳、必殺技、項目推薦、股票命理大師、投資訣竅、預測上漲的項目、投資實戰法、圖表技術分析、買賣特別講座、短線當沖、技術分析成功祕訣等，所有誘惑的言論都是騙局。


    他們在學習這些技術，進行投資股票的過程當中，發現了傳授這些技術會更賺錢。或者只是證券公司在贊助的項目上，為增加交易量而僱用的人。因為只有交易本身增加，證券公司才能獲利。這就像有些人會用「我要傾盡戶頭存款讓人看見」這句話來炫耀偶然的成功；或者高階行銷商，展現他們的豪華'
  merge: -1
  img_proc: true
- pgno: 123
  md: '轎車、存摺一樣。一個穩重的投資者，不會炫耀他們的投資方式或公開存摺，勸人投資。


    他們這些所有行為，都可能導致現實生活中意想不到的受害者。他們接受建議獲得了成功，但不會持久。若聽取建議後失敗了，就會遭到埋怨，所以面對家人或親戚，只能小心翼翼。在問問題之前，必須具備提問的資格，而為了具備這樣的資格去學習的過程中，就自然而然明白為什麼不要提問。將會發現「投資房地產好，還是投資股票好」這問題，是多麼令人感到尷尬的問題。


    當我們發現這是尷尬的那一刻，便具備了投資的基本資格。'
  merge: -1
