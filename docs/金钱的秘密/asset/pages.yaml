  md: '假設你向 1 萬個投資人發送郵件，向其中 5,000 人發送明天股票會上漲的訊息，又向其餘 5,000 人發送明天股票會下跌的資訊。第二天，再向屬於那正確預測的
    5,000 人的一半傳送會上漲，一半則傳送會下跌的訊息。這樣經過一週五次的發送之後，那剩下的 312 人就會把你當成股神。現在這 312 人，不管你怎麼騙他們都會相信。許多經濟學家也大同小異，即便
    1 年只有一次預測正確，仍然可以繼續扮演專家的架勢。


    # 學會正確握住刀鋒


    真是神奇！預測得越不正確，所談論的理論越精美。讓人聽著聽著，合理價值和分期買進的那皮手套便一一解體，切傷你的手指、割斷你的手腕。我敢斷言沒有一個，因看了股市行情的媒體報導之後投資成功的人。光聽那些市場分析的專家們兩三個前的報導，就能看出他們是多麼穩重又有格調地傳達錯誤的預測。


    真盼望至少能有一個投資節目，是以價值為中心來解釋投資，而非以買賣為主。打電話到電台詢問某支股票是否會漲跌這種一來一往的行為，才是拆毀股票市場重要價值的行為。證券節目預測價格、分析圖表都是如出一轍，他們不會為大眾評估公司的價值。市場上只有交易沒有投資，所以只充斥著投資股票之後而破產的人群。'
