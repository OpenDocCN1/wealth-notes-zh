- pgno: 67
  md: '# 為何不應該賣股票？


    如果你是該公司的創辦人或經營者，應該不會買賣該公司的股票。只要擁有一股，你就是股東，因此要懷著股東的心去研究和觀察公司。代表理事，即公司的總經理，是股東們委託經營管理的「雇員」。只要那雇員不是經營不當或讓公司的本質價值受損，就不應該賣股票。而且你要像公司的經營者一樣，閱讀、了解該公司的年度報告書、營業報告書、財務報表等，並且像總經理一樣傾聽消費者對該公司生產的產品所發出的反應和評價。


    即便我説得這麼詳細，但我想沒幾個人會有實際的行動。可能因為不知道如何尋得好公司，或者經濟術語比想像中艱澀，所以阻擋了行動力。如果讀者的年齡在國高中以上，盼望從現在開始按照我所建議的方法試試看。


    請從自己最有興趣的領域裡，找到發展最好的公司，並選擇在相關的行業中，市價總額最大的公司即可。在領域中排名第一是非常重要的，通常第一名不會破產，當市場發生危機時，因「大馬不死」（被追趕的大馬看似岌岌可危，但終有活路，不會死），所以反而會主導業界，擁有定價權。選擇業界排名第一的公司，根據自己的財務狀況，每月至少買一張股票。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 買一張優良公司的股票


    買進股票的本身就很重要，在不買股票的情況下做研究，與持有股票的狀態下做研究是完全不同的，看待企業的眼光本身就不一樣。一旦持有一股，就會注意相關產業的新聞或業界資訊，而且自動就了解了經濟相關用語。希望各位能這樣持續地籌集一年，股價下跌也沒關係。如果下跌就可以買到更便宜價格，若上漲也很好，反而該擔心的是上漲太快。


    我一再重複強調，最快致富的方法是慢慢地致富。結論就是那些堅持速成致富的人，只會成為讓周圍的人變富有的推力而已。按照這樣穩定地匯集5年、10年的股票後，大家也能逐漸成為企業家。可以參加該公司的股東大會，拿到他們的工作報告，還可以得到一條印有該公司標誌的毛巾。因為是我們的公司，所以會使用這公司的產品，並介紹給周圍的人。每當產品一一銷售的時候，就要抱著其中幾百萬分之一是屬於自己的心態來觀察公司，因為你是股東。


    股東就是公司的所有者，若秉持這種企業家的心態，便會產生觀看整體企業的眼光，也會了解該產業，並且對國家經濟、國家之間的利害衝突，以及整個金融市場產生關心。而且這些與政治也有關聯，所以你可以選擇為你的哲學和商业利益發言的政黨，並且以投票來參與社會。'
