    wings in Brazil set off a tornado in Texas?）


    這是由美國氣象學家愛德華·諾頓·羅倫茲（Edward Norton Lorenz），於1961年在氣象觀測時所產生的疑問，之後成為物理學的「混沌理論」（chaos
    theory）基礎。在地球上某個地方發生的微小運動，有可能發展成龍捲風的起點，這稱為蝴蝶效應。我希望從現在開始我所談論的觀點，能成為每位讀者人生的「蝴蝶效應」。


