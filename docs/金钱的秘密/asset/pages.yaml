  md: '# 不知道自己不知道的人


    經濟學家約翰・高伯瑞（John Galbraith）說：「世界上有兩種人，一種是『不知道的人』，另一種是『不知道自己不知道的人』」。可是那預測匯率、股價動向或原物料價格等全面經濟的人，為何到處銷售書籍、演講賺錢，又在
    YouTube 上宣傳精彩的專業評論和預測呢？我們是屬於「不知道的人」，而他們是「不知道自己不知道的人」罷了。自己相信自己聰明的人，就會預測，也依靠預測來投資。雖然有時預測正確，但有時並不對。這是真理。


    人類成立股票交易已超過 400 年，但至今仍沒有出現可預測的理論。在投資的世界裡有幾個不變的真理，就是經濟預測是不可能的，以及篤信會帶來最沉重的懲罰。在人類的現代經濟結構中，這是不變的規則。


    在佛教的《般若心經》中，教導由「色、受、想、行、識」五蘊和合而成的我即是「空」，意思是「我什麼都不知道」。當我們說「我什麼都不知道」的時候，反而能脫離危機。最危險的時候不是「不知道」的時候，而是自認為知道的時候。這樣的人甚至認為自己的預測沒有錯，只是這次運氣不好而已。但是當我們不知道或覺得不知道的時候，就會小心戒備，並且會未雨綢繆。'
  merge: -1
  img_proc: true
- pgno: 44
  md: 當我們明白自已不知道，才會對各個投資資產或公司進行深入研究及蒐集資訊。而且還要確認其中的關係，找出大家尚未看到的東西。以此為前提，當市場往其他方向發展時，只有那具有勇氣逆向的人，才能在市場中脫穎而出。
