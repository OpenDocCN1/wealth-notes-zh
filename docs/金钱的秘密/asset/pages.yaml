  md: '# 感言


    寫給台灣的讀者：


    能向台灣讀者介紹我的書，我倍感欣喜。其實我為了擴張事業去過台灣好幾次，但是因為台灣的外食產業水準很高，所以每次都令我躊躇不前。可是我從未想過我的書能在台灣出版，可以在書中與台灣讀者相會。


    我出生於韓國，大學時移民到美國，在那裡開始經營事業。我在韓國完成了大部分的教育，社會生活則是在美國度過的。我曾經歷過非常貧窮的生活，現在擁有大富翁的生活。正因如此，我親自接觸到東方和西方各樣的經濟觀念，以及許多關於貧窮與富有的規則和原理。


    這本書最初是針對韓國人寫的，但裡面的價值和訓誡，對世界任何一國的人都有幫助。我相信對台灣的讀者也一樣有價值。台灣與韓國一樣，40至50歲的人口最多，10年後老年人的比例會比年輕人多。失去勞動力的老年退休者，他們的貧窮將會成為社會的問題。我盼望各位在年輕時，就能儘早將我的書掌握在手中。


    我再次為我的書能被台灣讀者接受而歡喜，並感謝所有參與出版和翻譯的工作人員。期待有一天能與各位讀者相見，謝謝大家。


    11/12/20 於休士頓'
