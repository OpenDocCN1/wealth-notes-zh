  md: '# ### 11 付租金的人

    ### 所潛藏的價值


    準備一筆種子資金，申請貸款，找到合適的建物，只要成功一次，便能以此為基礎，擁有許多建物。


    無關從事哪種行業，如果你目前是付租金的人，那麼就是有最多能力擁有該建物的人。因為現在的屋主自己不能從那建物生出租金，所以需要找到在這建物內透過經營企業來付租金的人。換句話說，如果各位在不欠屋主的租金之下，目前正在經營事業中，就表示你有能力擁有該建物。


    凡利用賣場、工廠或辦公大樓等事業場所，來營造收入付租金的企業經營者，要知道從自己的企業裡會產生兩種收益。第一個當然是事業本身所產生的收入，另一個是從車水馬龍的人潮中產生的不動產增值。


    如果經營餐廳沒有受到商圈的影響，或者因消費者高度的'
