- pgno: 120
  md: '# # 12 投資房地產？還是股票？


    在問問題之前，必須具備提問的資格，而為了具備這樣的資格去學習的過程中，就自然而然明白為什麼不要提問。


    將過去 10 年來韓國房地產指數和股價指數做一番比較，則感受不到别具意義的差別。當然若拉回 20 年前，股票市場會有更好的結果，這是事實沒錯，但因房地產的指數，沒有將相關的租金收入核算在內，所以很難斷定哪一個更好。通常我們認為房地產投資者和股票投資者兩種是不同的投資者，但如此分類並不正確。我認為投資房地產的人屬於較保守穩定型，而投資股票的人則屬於進攻型，且喜歡追求高成長。


    房地產市場裡，有些是以租金收益為基準來買賣房地產，有些則是透過開發創造收益。以租金收入為中心投資房地產的人，與在股票市場裡投資紅利續優股的人有相同的傾向；而投資房地產開發業的人，與在股票市場裡投資具有前景主題股的'
  merge: -1
  img_proc: true
- pgno: 121
  md: '人有著相同的傾向。換句話說，不是用投資市場的不同來劃分投資者傾向，而是根據投資的風格。


    # 懂得問對人、問對問題


    領股票股利就像收月租一樣，以收月租為目的的屋主，沒有理由每個月確認建物的價格；而領股利的股票投資者，也因為對股息更感興趣，所以對股價變動不太敏感。這些人不會對今年房價或股票沒有上漲而焦躁不安，因為他們認為建物的價格，只有在租金調整時才會上漲，而股價也是當績效提高時才會上漲。因此他們都是有相同傾向的投資者，若問這些人股票和房地產哪一個是更好的投資選擇，他們會以股利和租金比較後，結果哪一邊多得利益就是最好的地方。


    投資股票的人也分為兩大類，這兩類是完全不同的投資者。有些人是找到公司的內在價值，購買相對被低估的公司股票，等待公司成長，具有長期投資眼光的投資人。相反的，也有一些是根據群衆投資心理，隨著技術性反彈和阻力買賣的股票經紀人。


    雖買賣同一家公司的股票，一種人是與公司合夥的情況，另一種人是向前者購買，又賣給後者的分銷商。技術性投資人，只需要關注良好的交易系統和交易量，所以不會關心公司的來歷或公司的未來。因此股市入門的新手們，當周圍的人問：「現'
  merge: -1
