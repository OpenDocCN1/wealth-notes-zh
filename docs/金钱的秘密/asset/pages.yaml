- pgno: 185
  md: '熱門股。相信自己的事業會一夕之間翻轉人生，一生都在寻觅投機事業，或者像金銀島投資、金礦、製藥股等一樣的彩虹雲。


    這種幸運不是幸運，所以所有能快速達成的事或高利潤的事，我都與它保持距離。如前所述，我不會投資在任何傷害生命、不尊重生命的行業，也不參與。個人生命與所有的生命息息相關，如果我們隨便對待生命，大自然或其他生命也不會尊重我們，幸運會離去，健康、人也都離我們而去。


    不投資是最糟糕的投資，資產要經常保持在投資的狀態。當然為了投資而待命的資本也算投資，但是沒有任何計畫或毫無欲望的資產會逐漸死亡。沒有一棵樹會如此說：「我這樣就夠了」或「有這些陽光就可以了」，因為當周圍的樹木長到一個地步遮住它的陽光時，它就結不出果實，最後枯竭而死。所以最壞的投資，就是什麼都不做的投資。


    # 用賺來的錢買時間


    我賺錢是為了買時間，我是一個用財富將人生當作禮物送給自己的人。無論做什麼，或不做什麼，都是我的自由。所有的時間都是為我所用，所以我可以學習任何東西，得到需要的一切。我有能力聘請周遭最優秀的專業人員來確認情報，並向他們徵求意見。隨著資本的增加，投資對象情報的數量品質就越不同，並會產生更好的資產投資結構。我用賺來的錢買時間，'
