- pgno: 92
  md: '那个时候卖东西有多容易？因为当时平台免费给流量，商品链接挂上去就有人买，当时在淘宝开店的人，不用太有本事，只要坚持下来的，都发财了。


    回过头来拆解下那句话有什么问题呢？


    首先，商业世界的基本原则是双赢，没有任何一个人能把所有的事情都做了，只有合作，才能把蛋糕做大，把好机会分享给别人，就是一个寻找志同道合的人，一起把事情做大的过程。


    星星之火，可以燎原。这句话说的不是这么一个意思吗？


    其次。我把发财的机会介绍给你，跟我从你身上赚钱，这两个事情本来就不矛盾。一手资源微信291934484


    例如说你本来一年挣20万，别人给你介绍一个项目，你们一起做，他一年赚1000万，你一年赚100万，那这个项目可不可以做？


    不要关心别人从我身上赚了多少钱，而要关心我自己因为这件事情能赚多少钱。


    最后，拿“爸爸”来说事情，就更加莫名其妙了。谁的爸爸也不是全能的，能炒菜的不一定会修车，能修车的不一定会懂做生意。很多创业机会，爸爸们是真不懂，也操作不下来。


    因为创业是有门槛的，不一定跟我们关系越亲近的人就越适合。


    不断扩大链接的范围，不断打造IP才能够找到更多志同道合，可以一起发展的同频者。'
