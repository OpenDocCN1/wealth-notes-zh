- pgno: 67
  md: '有了之前谈话带来的基本的信任基础，对方主动问我要微信，说跟我和 Joie“学习”一下。


    如果对方不主动提，我们就可以很直接地提出来：“我们加个微信吧！”。一般情况下，对方都会同意。千万不要不好意思问，很多时候，多问一句话，就会多出去一些可能性。


    以上几个方法，帮助我结识了来自各行各业的朋友，大家可以灵活运用。但是方法，永远只是停留在“术”的层面，在“道”的层面，最重要的，是要对其他人怀有尊重和感恩之心。


    要广结善缘。因为每一次相遇，都是命运的馈赠。只有尊重和珍惜，才能换来真正的信任，有了信任，才有生意。


