- pgno: 78
  md: '# 17 普通人的时代机遇


    一个人要做成事情，有两个决定性的因素：


    第一要有逻辑自洽的认知体系，第二要顺势而为。


    认知体系解决的是底层逻辑的问题，顺势而为解决的是效率的问题。


    想明白自己这辈子想要达到怎样的状态，是打工还是创业？是普普通通，还是看一看自己能走多远？是择一城而终老，还是逛尽世间繁华？


    想明白为了过自己想要的生活，愿意付出怎样的行动？这些行动的要如何串联到一起，才能指向自己的生活目标？


    有小聪明的人不少，有体系化思考能力的人不多。体系化的思考力、执行力，加上顺势而为，等于如虎添翼。


    在正确的时机，做正确的事，想不成功都难。


    今天，我想从零售发展简史的角度谈一谈，我为什么坚定地看好 KOC 品牌推广这个赛道。


    先说结论：新零售时代，以分享经济为特点，是普通人创业最好的时代。


    世界整个零售行业的演变，都朝着两个关键的方向：


    目标客户群更大以及渠道成本越低。


    下面让我带着大家，盘点一下世界零售行业发展的关键阶段：'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 01 单店时代


    单个的商店出现在 18 世纪以前，规模都比较小，例如日杂店，屠宰店等，大多数情况下都是家庭经营。


    有史可查的全球第一个成规模的百货商店，是 Harding, Howell & Co，诞生于 1796 年的伦敦。


    ![](img/23a01d83bcb4e49ef80138fea59b1887_79_0.png)


    （图片来源：reserch.britishmuseum.org）


    单店时代的局限在于客户的覆盖范围有限，无法形成跨区域的影响力。


    # 02 连锁时代


    现代意义上的连锁店诞生于 1895 年，当时的大西洋与太平洋茶业公司 (A&P)开了第一家连锁超市。'
  merge: -1
  img_proc: true
- pgno: 80
  md: '![](img/23a01d83bcb4e49ef80138fea59b1887_80_0.png)


    （图片来源： medium.com）


    连锁店和个体店铺相比，有着以下优势：


    集中采购降低了物料成本，统一管理标准降低了管理成本。店铺数量的增多，可以触达更多消费者，有利于品牌的传播。


    同时由于各店之间相对独立，所以可以在不影响品牌声誉的情况下试验新产品，如果不成就...不...就是某个区域的销售受影响，不会波及其他店铺。


    # 03 大型实场时代


    世界上第一个室内大型商场，于 1955 年诞生于瑞典北部。


    ![](img/23a01d83bcb4e49ef80138fea59b1887_80_1.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '大型商场在引流效果上更好，并且能够满足消费者多重需求，相当于一个暂时的“私域流量池”，只要你一进到里面，就很难不花钱。你不买衣服不买鞋子可以，但你不能不喝水，逛累了也不能不吃饭。


    Walmart、Costco、都是属于这类大卖场。


    # 04 专卖时代


    专卖店可以理解成是需求极度细分，极度注重品牌效应的连锁店。这类店铺产品定位非常准确，降低了消费者的选购成本，在进店之前就知道自己要什么。


    著名的奢侈品店，都是采用的这种模式 面向大众的店也很多，例如专卖儿童玩具的“Toysrus”。


    专卖店看似窄小的消费者的群体，但是由于覆盖面广，并且可以精准满足客户需求，所以客源稳定，回购率高。由于它同时具备了连锁店的特点，经营成本也大幅降低。


    以上的零售店形式，虽然一个比一个先进，但本质上，他们都是同样的物种，也就是必须要有自己的供应链和实体门店。


    这就造成了店铺形式越先进，进入成本越高，并不适合普通人创业。


    # 05 虚拟门店时代


    上个世纪 80 年代，电视购物开始兴起，开启了零售行业无门店销售的时代。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '![](img/23a01d83bcb4e49ef80138fea59b1887_82_0.png)


    这种零售模式，应该算是直播卖货的鼻祖。带货人在镜头前都会用变换的音调配上丰富的肢体语言，现场演示各种商品的神奇功能。不同的地方只有两点：一个是录播，一个是直播；以前是通过电话下单，现在是通过链接下单。


    零售业发展的确在，其实跟我们普通人创业也没什么关系。真正让普通人有机会低成本创业的平台，是曾经的淘宝。


    # 06 新零售时代的开启：平台电商


    平台电商出现在 2000 年左右，它最大的特点是：理论上能够面向所有网民，极大地扩大了目标客户的范围；开店成本低，不需要实体门店，但是需要自己解决供应链，一般都有自己的仓库。很多人是把自己家里当成仓库。


    六年前我在深圳的时候，在网上买了个自行车，一了解发现卖家居然离我住的地方非常近，于是我就决定上门取货。卖家住在城中村的出租屋内，一进门就发现，他们家除了基本的家具，其他空间都被未开箱的自行车堆满了。'
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/23a01d83bcb4e49ef80138fea59b1887_83_0.png)


    这其实代表了淘宝早期卖家的状态，同时也是淘宝小卖家的黄金时代。平台本身的知名度会为商家引流，而且由于早期卖家数量相对不多，平台内流量争夺并不激烈。


    接下来，才是属于我们普通人轻创业的时代：


    # 07 社交电商 1.0 时代


    社交电商的出现，其实是伴随着微信的流行。从 2013 年诞生以来，微信在全球已经拥有 亿 的用户，而这个数字还在持续增加。微信最大特点有：用户基数大，功能齐全：既有社交功能，又有商务功能，而且完全免费。


    ![](img/23a01d83bcb4e49ef80138fea59b1887_83_1.png)


    嗅觉灵敏的人利用微信做起了产品分销，成为了第一批“微商”，吃到了第一波红利。微商最大的好处，是营销成本低，毕竟装个微信也不要钱，渠道成本可以说是零。


    但是最大的问题在于它的操作模式。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '很多微商的重点就是把产品卖给代理，要求代理动不动就压几万、几十万的货，至于你是否能够触达消费者，这不是项目发起人关心的问题。


    在接下来的一两年的发展过程中，微商行业经历了“大洗牌”，大量产品质量低劣，操作方式违规的微商项目被淘汰。


    第二轮洗牌开始于 2016 年左右。


    有的微商项目虽然产品还不错，也很有强的零售和招募团队的能力，但是由于产品线单一，即使单品利润不错，复购率也高，但因为不能满足消费者多样性的需求，加上缺乏团队管理能力，没办法给代理商提供成长的机会，所以这类项目的后劲不足，人来的也快，离开得也快。


    在这样的背景下，能够同时供应多种商品的社交电商平台应运而生。这些平台从品牌方批量进货，采用返佣的方式，依靠你我这样的个体经销商进行推广。同时，新型的社交电商平台不要求代理商囤货，极大地减少了经销商的创业成本。


    与此同时，主流平台电商对小商家已经极度不友好了一方面站内流量贵，另一方面微信以及其他网络平台也在不断瓜分传统电商平台的流量。


    淘宝小成本创业时代，宣告结束。


    # 08 社交电商 2.0 时代


    2018-2020 年是社交电商大爆发的两年，各种平台也是泥沙俱下，良莠不齐。'
