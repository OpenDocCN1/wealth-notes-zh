  md: '# 01 适合普通人的商业策略


    赚到我人生中的第一个 1000 万，我用了 3 年的时间。


    2016 年底告别打工生涯到现在，挣了有小千万人民币，我的商业策略，就两条：第一条就是模式要相对较新，第二条就是投入要相对较小。


    为什么要模式新？


    是因为任何新事物，都有认知成本在里面，哪怕是有大资本的玩家，也是需要花时间才能搞清楚。


    例如社交社交电商这个领域，18-20 年入场试水的企业不少，蒙牛、京东、小米、阿里都做了相应的尝试，到现在基本上都是半死不活的状态，但是也有少数的不试水成功，进入了行业的深水区。


    在野蛮生长时期，反正大家都不懂，而受众对于新领域，还有一些新 鲜感，作为个体创业者，随便选一个项目，也能学到东西，乱打一气，也能抓到一些红利。


    项目能走得比较长远，当然好，如果不行，转换的成本也很低。


    而传统行业，我是试过的，比如教英语。这类行业表面上看市场大，但竞争已经非常充份，而且里面的门道，不比新行业少。


    但是进入早的那批人，就能够掌握你掌握不了的很多潜规则，相当于你的起步就晚了很多。


    引流、转化，课程设置、学员跟进、转介绍，每个步骤，只有亲自做过，才知道里面的窍门。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '实际上，我从大学三年级就开始搞培训，来了澳洲之后又做了差不多两年，在控制成本的前提下，年利润 70 万人民币左右，基本上就到头了，还累得半死。


    总之，传统行业，要活下来，不是很難，但是要赚到不错的钱，非常难。


    坚持小投入，是因为只有这样，我才亏得起。我只要亏得起，多试几个项目，总有能起来的。


    现在谁给我说一个项目百分之百赚钱，我肯定是不会理他的，因为他可能还没有被现实毒打过。


    往往是那些信心满满，把很多钱投入到一个项目里面，觉得一定能做成的人，只要遇到一个“杀鸡”事件，倒下的速度是最快的。


    在坚持上呆着，比赢钱更重要。


    哪怕错过了 99 个机会，当第 100 个机会来临的时候，我只要抓住了，就可以翻身了。


    这个逻辑不是一年赚一个亿的逻辑，这么搞也成不了大企业家，可能连你小区的财富榜都上不了，但一年赚个上百万，甚至几百万，成为一个默默无闻，生活宽裕的上中产，是完全有可能的。


    以上两个简单的策略，给我的生活带来了一些改变：'
  merge: -1
  img_proc: true
- pgno: 4
  md: '从每天早上六点半起床，准备上班，到睡到自然醒；从租房到买房，从买一套房到买两套房；从买小房子到买大房子；做生意没有欠过一分钱的债，每个月只有多赚和少赚，不可能亏钱。


    在可预见的将来，我都会坚持这两个策略。


    赚钱不应该是轰轰烈烈的，那是戏剧的桥段。现实中，无非就是是在策略清楚，成本可控的前提下去执行自己的判断。


    平淡枯燥且乏味地慢慢变富，不也挺好吗？'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 02 如何找到低成本的机会？


    机会是怎么来的？就是一个字：


    “碰”。


    在做生意的过程中，效率很重要。这里的效率，不仅指赚钱的效率，还指吃亏的效率。


    只要是成本小，不违法的事情，你都去试试。这样做的好处，就是不管是好的还是不好的经验，你都能第一时间获得，这个效率，比你去参加网上的培训班，要靠谱多了。


    我 2020 年投了一个项目给了 9000 元。是一个很知名的网络公司背书的直播项目，推广项目的事情，是外包给一个小公司。


    当时是试运行，我的判断是直播一定是个风口，一定要抓住，就交了 14000 元，说是有帮别人开通 app 的权限。


    但是这个小公司在推广这个项目的时候，运用了一些打擦边球的方式，结果被管控了，APP 被封了几次，现在也不知道公司还在不在，我去退钱，只退了 5000 元。


    后来呢，这个直播 app 可以免费下载，你们可能都在用。


    这个项目，明显是失败了，我的损失，也就是 9000 元。但是如果让我重来一次，我也会选择去交这个 14000，因为根据当时的信息，这个险，是值得冒的。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '但是通过这个事情，我学到了很多东西，包括这些大企业，如何通过小公司来替他们做一些灰色操作，一旦出现问题，马上就能撇清关系，完美地进行风险隔离。


    我也知道了一些，一些看起来浓眉大眼的企业，在试验一个新项目的时候，其实也会用一些有争议的手段，只不过当他跑出来之后，就刚正不阿，坚决维护正常的市场秩序了。


    好的机会，也被我碰到过。


    我做自媒体，做了两年多吧，最开始是做英语培训，后来做创业类。我做英语培训的时候，国内一位英语培训机构的主管联系到我，说有个英语写作外包业务，问我有没有兴趣。


    业务的内容，就是给国内的研究生考试的英语写作部分写范文。


    你们在国内买的那些英语教辅书上面的英语范文，都是外包的。水平高点的，是找母语人士写的，水平低点的，就是找英语系的研究生去写


    这家培训机构，应该是属于水平比较高的，所以他们想要找英语母语人士写，而我又在澳洲，他就问我能不能找到写手。


    我简单估计了一下风险，范文平均一篇的稿酬，大概是 800 人民币，我给澳洲写手的报酬，大概是 300 人民币，约合 60 澳元。但是我不能一次性从培训机构那里拿到钱，我要分两次，预付款一次，50%全部稿件通过之后，再拿最后的
    50%。


    其实我的预付款，就已经能够覆盖写手的报酬，所以对我来说，风险很小。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '我的工作，主要就是把国内的中文版的写作要求，翻译成英文，并且通过电话会的形式，给写手讲解清楚，然后把编辑的审稿意见，跟他们进行沟通就行。


    合作了两年多，我给培训中心供了几千份稿件，我自己就写过一篇范文，目的是自己感受下写作要求，就这个项目，我前前后后净赚大概40多万人民币。


    看到这里，可能有读者就会说：你就编吧！现在网络这么发达，为什么辅导机构不直接找写手呢？


    原因很简单，因为能够把中国应试教育的英语范文标准，给英语母语人士讲明白的人，其实是不多的。


    这就是细分领域的概念。


    他们要范文，要的是英语母语人士的用词，丰富的表达，但是语法要符合中式英语的要求，要符合中国高校英语系的教授们对语法的理解。


    我的价值，就是用英语把这个事情给英语母语写手讲明白，而且确保他们的作品，能够符合要求。


    看到这里，你可能注意到了，我没有把招聘的成本算上去。


    其实当时我已经有三位合作的澳洲英语老师，都是大学本科以上的母语人士，现成的写手。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '后来活多了，我直接去 Gumtree 发广告，免费的，来应聘的写手多的不得了。我把要求固定下来，发给他们，每个人写一篇样稿，我一看就知道他们的理解力和文字水平怎么样，遇到合适的，就进一步谈。


    这个辅导公司，现在我们还在合作。


    总结下，机会这个东西，不管是你主动，还是别人来找你，不妨听听看，试试看，亏得起的情况下，最好自己操作下，只要吃亏的程度有限，有上行的空间就好。


    要增加碰到机会的概率，就要多认识人。


    总的原则，就是要多输出内容，多参加一些线上线下的社群，多参加各种活动，说不定哪天你从哪里得到的一个机会，就能改变你的人生。


    因为机会，是由圈子带来的，圈子的质量，决定了机会的质量。


    打工人的圈子，讨论的是隔壁公司的薪水。


    小老板的圈子，讨论的是合作的机会。


    大老板的圈子，讨论的是资本运作。


    听都没听过的机会，肯定不可能转变成你能够拿到手里的机会。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 03 创业不能想当然！


    去年有位布里斯班的网友咨询做副业的问题，她想从国内进纺织品和日用品过来卖。


    我就问她一个问题：


    你认识的人里面，有没有靠这个生意发财的？她说没有。我直接告诉她，这个生意不是个好生意。


    普通人创业选项目，最有效的方法，就是模仿背景跟自己差不多的人的成功案例。


    2016 年，在吃火锅的时候，珀斯的一位宝妈朋友告诉我们，代购如果稍微用心做，可以挣到澳洲一个全职员工的工资，然后我和我 Joie 马上就在朋友圈宣布做代购，第一年就赚了小
    10 万澳币。


    2017 年，我发现在线英语很火，我看有些老师一个系列课能挣十几万，我觉得虽然没有那么大的名气，在行业里面的资历也不是太久，但我英语也不错，又能上网，别人一年挣一百万，我一年挣个十几万应该没问题吧？


    然后我就马上拉了一个英语跟读群，火速在多个平台注册了英语教学的账号，在沪江网校注册成为讲师。头三个月我都是在免费输出，之后开始收付费学生，一年半的时间，挣了大几十万。


    2018 年在墨尔本的一个代购交流群里面，一位在悉尼的宝妈向 Joie 推荐了一个渠道运营的项目，说一个月能挣个几千万。


    那时候我们觉得说，反正都在做代购，增加个货源渠道也好，没想到随着项目的发展，这三年我们在上面挣了八百多万。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '将来我可能还会做新的项目，但我一定不会自己去想一个生意，我会去看别人已经赚到钱，而且我能复制的生意。


    毕竟大多数人，其实是没有那个智力、资源和运气去做成一个新的模式。别人赚不到钱，你也赚不到钱，资源能力跟你差差不多的人能赚钱，你也能赚钱。


    这大概率能够赚钱的行业，想办法做到头部的百分之几过创业，实现财务突破的最佳策略。'
  merge: -1
