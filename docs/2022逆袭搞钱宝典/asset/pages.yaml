- pgno: 56
  md: '之前跟一位直销行业的大姐聊天，她是做美国的一个直销项目，做了17年。主流的直销项目，有一点是做得非常棒的，就是线下的活动，他们非常懂得如何通过线下的活动，让新的经销商或者意向客户，了解做得好的老的经销商是一种怎样的状态，从而产生想要靠近的愿望。


    跟社交相关的生意，必然需要展示个人价值，这一点上，整个行业都是相通的。这就是为什么，当一个项目的红利期过去之后，曾经做到过顶部的  人，换一个项目，一样能做得非常好。


    任何行业的高手，都有他们核心的竞争力的。展示价值的能力，就是所有通过 IP 变现的商业模式的核心竞争力，这一点从来没变过。


    可惜的是，这些可贵的能力，在不懂的人眼里，就简化成了“洗脑”和“发圈”。


    只不过，互联网出现之前，更依赖于线下的沟通，互联网出现之后，扩大了信息传播的范围，加速了传播的速度而已。


    通过在朋友圈的内容输入，进行 IP 打造，为私域流量转化，打下基本的信任基础，但仅有这个步骤，还远远不够。要完成转化，还需要一些更直接的动作。


    下一篇，跟大家讲讲如何在朋友圈推广产品和项目。'
