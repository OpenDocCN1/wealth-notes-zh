- pgno: 87
  md: '# 18 创业者的规则意识


    本章跟大家谈谈关于“规则”的话题。


    你们有没有发现？很多人头脑聪明，思路清晰，表达流畅，也很勤奋，但做生意总是差那么一点意思。


    对于生意人而言，守“规矩”，也许是一个基本要求，但绝对不是一个美德。相反，成功的生意人，都懂得如何利用规则，甚至自己创造规则。


    为什么呢？就是因为他们不懂灵活利用“规则”。


    评论里面有澳洲的读者，让我讲讲代购是怎么做的，为什么限购那么严格，当初我做代购的时候，还能买到那么多奶粉？


    前两年我和 Joie 做代购的时候，澳洲大部分超市的奶粉限购是没人两罐或者四罐。现在主流的超市，Coles、Woolworth、Big W，大部分时候，也都还是这个规定。但我和
    Joie 一周至少能买四五百罐。


    在普遍限购的情况下，我们的策略很简单，就是开着车，这个超市买七八罐，然后去下一个超市。


    后来我们发现，限购也有时效性，而且哪怕是大连锁超市，每个分店的操作也不一定完全一样，甚至 2017 年的时候，Coles 有一段时间 A2 三段的奶粉，一个托盘一个托盘地摆着卖，我们那一次就定了好几百罐。


    接着我们去了在华人圈子里面不太出名的药房，发现这些药房的限购政策要宽松很多，个人限购八罐，甚至一些不紧俏的奶粉，根本就不限购。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '再后来，我们联系到一些更小的药房，由于太不出名，澳洲本地的市场又太小，哪怕是大超市里面紧俏的奶粉，他们手里有不少存货，或者有订货的资格。


    虽然在店里的告示上还是说限购，但是找到老板好好谈，完全可以到店后面的仓库几十上百罐地去取货。


    # Coles 有段时间完全不限购


    而大多数澳洲代购，听到网上说超市限购奶粉，就不敢接单了。这就是为什么，同样做代购，他们一个月挣一千澳元，我能一个月挣一万的原因。


    规模比较大的代购，在 2015-2017 年之间，已经成立了公司，刚开始求着本地的药房拿货，后来利用它大的规模优势，直接跳过了珀斯本地的药房，去悉尼更大的批发商那里去拿货，甚至发展到后来，珀斯本地的中小药房，反过来找代购公司去进货。


    奶粉代购行业的这个变化，澳洲做得比较大点的代购，都很清楚。


    只不过这种事情，太违背国内消费者对澳洲的想象，所以一般不会跟客户详细解释，说了他们也不信。


    但背后的商业逻辑就是很简单。作为奶粉批发商来说，我不管你是药房还是代购店，只要你的量足够大，最够稳定，我就能把代理权给你。


    华人代购刚开始的时候，货量少，跟药房超市打交道的时候，被各种“修理”。


    货还没到，就要求给全款，不给就滚蛋，然后还有捆绑销售。当时我跟一家小药房合作了一年，然后他们有一批奶粉卖不出去，快过保质期'
  merge: -1
  img_proc: true
- pgno: 89
  md: '了，100多罐，老板直接告诉我们说，这批奶粉，你给我消化了，你不买，今后别的奶粉我们也不供应了。


    我能怎么办？只能接下来。那批奶粉，到后来有十多罐快到保质期了也没卖出去，只能丢掉。


    后来还出现我预付了款，结果奶粉没给我，因为他们药店交接的问题，在我找到付款记录的情况下，依然拒绝供货或者退款。


    后来找了仲裁，因为我买的量大，认定我跟那家药房是商业纠纷，不是消费者和商家的关系，所以建议我们协商解决，要不然就打官司。


    我大概了解一下，打官司律师费可能都比他们欠我的钱要多了，只能跟药店老板协商，还还了我大概百分之六十的货款，这个事就算了解了。


    这个药房老板是西方人，所以当我听到国内和澳洲的华人说西方的生意人更厚道、更守信誉，素质更高，我就笑笑，这些人是没有被毒打过，多见多看多了。


    人性都是共通的，没有种族之分。西方人里面，也有坑你没商量的，华人大部分，也是好人多。


    基本上 2018 年以后，澳洲的绝大多数的奶粉资源，都掌握在代购和跨境电商平台手里了，个体代购货源的选择更多了，也不需要再看超市和药房员工的脸色了。只知道跑
    Coles 和 Woolworth 的代购，那都是小白。


    澳洲的大代购商，已经建立了横跨中澳两地的供应链，亲手改写了澳洲奶粉的供应规则。'
