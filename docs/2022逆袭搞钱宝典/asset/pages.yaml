- pgno: 48
  md: '给大家一个简单的公式：经历/经验+体会


    我 2018 年 10 月的时候，确定了 IP 变现的逻辑，就是用自媒体引流，微信将观众和读者转化成为消费者和渠道营销项目经销商，然后把经验复制给经销商，不断扩大销售规模。


    大致的领域，就是创业和投资。


    我初期的内容，基本上都是以我之前的代购和英语培训项目为素材，从中提炼出一些具备普遍分享价值的内容。


    这样，我就从一个英语老师，转变为一个创业经验分享者，你们现在去微博，我的认证，还是“教育博主”。但我同时又属于在财经领域影响力“飙升”的博主。


    对于自媒体来说，如果你缺乏相关行业的经验，那么你就可以做一个总结者，用自己的话，描述别人的经验，然后加上你自己的理解就


    同样一个社会热点事件，利用同样公开的信息，有的人就能够加工成可读性很高的 10 万+文章，但大多数人，只能当读者。


    这就是生产者和消费者的区别。即使是同样的材料，生产者也能把他们加工成有卖点的产品，而消费者只有挑选和享受制成品的权利，不能享受到生产带来的利益。


    知乎上很多问题的高赞答主，他们在很多领域，其实也不怎么懂，只不过他们搜集资料的能力和表达能力更强而已。'
