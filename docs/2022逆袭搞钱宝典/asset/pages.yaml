- pgno: 37
  md: '# 09 持续破圈


    今天的关键词，是“躬身入局”。


    想要知道开保时捷的是什么样的人，那就自己去买一辆。


    2021 年 1 月，我去珀斯的保时捷专卖店定了一辆最新款的卡宴 Coupe，当天下午试驾，在车行下班前就把订金交了，一周后提车。


    我对保时捷这个品牌代表的设计语言很认可，喜欢品牌的运动基因和对个性的大胆表达。


    当我是一名普通的公司雇员的时候，开豪车的人的身上，是有一种神秘色彩的。因为我在内心深处认定一个令人绝望的事实，就是我哪怕打一辈子工，也不会有买得起卡宴的一天。


    大家都是人，同样要工作，甚至同样是来自普通家庭，为什么就是有人能够挣到十倍、百倍于我的收入？


    但比好奇成为强烈的情绪，是不服气，就是这种不服气，加上一近乎盲目的自信，开始自己做生意，坚信自己一定可以成为富人。


    破圈是唯一的出路，躬身入局是唯一的选择。


    2016 年 8 月，我从打工人，变成创业人，完成了跑道的切换。


    2017 年 3 月的英语培训，开始增加了跑道的宽度。


    2018 年初，我发现跑道越来越窄。我和 Joie 认为，我们必须再次破圈。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '创业之于打工，最大的优势之一，就是能够积累属于自己的可支配资源，所以，所谓的“破圈”，无非是用新的手段利用现有资源，并且进一步扩大资源。


    虽然代购的产品价格竞争越来越大，但是我们的代购客户还在；虽然英语培训赚钱不多，但至少学员还在。


    有人，有需求，对你有信任，这就是你的初始资源，如何把初始资源转化成商业资源，是每个创业者都应该思考的方向。


    2018 年，“社交电商”的概念开始兴起，也就是个体同时具备产品消费者和推广者的双重身份，利用初始的客户资源进行裂变，从而达到各大市场占有率的目的。


    当时我的一个拍 … 的学生家长，把西澳业绩第一的国内某纸尿裤品牌的经销商 Michelle 介绍了 Joie。


    在此之前，我们对于这种模式的理解，还停留在概念上，通过跟 Michelle 的交流，我们发现，她之前也是做代购的，代购的消费群体，也纸尿裤的用户，是高度重叠的，所以很快就拥有了初始消费者和代理，而且她已经把这个模式跑通了，一个月能有三四万人民币的利润。


    她的成功案例，相对于我和 Joie 当时的情况，是具备高度的可复制性的，虽然很多细节不清晰，但是我们决定躬身入局，边干边学。


    由于当时中国开放二胎没几年，国内对纸尿布的需求激增，加上通过代购已经积累了一定量的客户群，Joie 直接投入了几万人民币做了高级代理。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '因为产品本身确实不错，刚需度也高，所以她两个月收回了成本，到现在，在这个项目上赚了大概小十万人民币。


    但是从商业模式的角度分析，它也有两个缺点：


    产品单一，只有纸尿裤和纸巾，虽然回购率比较高但是产品品类有限


    在一批货卖完之后，下一批货经销商需要垫资购买，不能给人一种“落袋为安”的感觉，从而在一定程度上，打击了经销商的积极性


    2018 年 3 月，在墨尔本的一个代购交流群里面，某家代理澳洲新西兰品牌的社交电商平台的经销商 Y 主动添加了 Joie 的微信，经过大概一周的互动之后，开始向
    Joie 介绍项目。


    我们发现它的模式和纸尿裤卖自很像，但是优点很明显：


    首先，平台完全是由澳洲的本地厂家直接供货，没有第三方，而且产品都是澳洲本地畅销几十年的产品，质量完全可以放心；


    同时，第一批货出完之后，经销商在今后都不需要再购买产品，只需要卖产品就行了，利润直接返给经销商；


    第三，产品品类很多，能够满足消费者各种需求；


    第四，平台的主创团队的营销能力很强，支持很到位。


    当时的门槛，其实挺高的，要成为高级代理商，需要充值几万人民币的货款，于是我们直接从高级代理商做起，拿最低的折扣，开始推广。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '我们大概是为什么愿意出这个钱呢？是因为实际上，我们在做代购的时候，遇到商场药店打折，我们也是会适当囤一些产品的，我们车库里，随时都是几万澳元的存货，这些货，还有过期的风险，现在我把货款放到一个平台，可以用最低折扣进货，而且不用担心过期的问题，这些产品作为代购产品的一个补充，应该也是能卖出去的。


    还有一个，就是哪怕平台跑路了，不到一万澳元，我们也是亏得起的。


    现在平台的经销商准入条件更低，升级方式也更多样，也是一个挺大的进步。


    Joie 从自用开始，坚持打卡，坚持文案和照片原创，在朋友圈种草，带动了很多Pkg，其中以女性为主。


    虽然她也招了一些经销商，但是前三个月没有挣多少钱，因为团队的销售能力不够，而且为正规的社交电商项目，不是拉人头就能赚钱，必须得把货给卖出去才有利润。

    我们分析了一下，主要是因为 Joie 的销售技巧没有得到有效的复制。


    于是她在 4 月份的时候建立了一个 ABM 经销商群，每天在群里分享好的销售经验。


    这个做法效果非常好，因为很多技巧是可以被直接复制的，例如：一定要自用打卡，如何建立个人人设，如何写文案，如何拍图片。


    由于产品质量好，模式也相对较新，受众的又起一种新鲜感，愿意了解产品和项目的人很多，加上公司的一些促销互动，Joie 的销售额，从 2018 年 4 月份开始，逐月飙升。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '在这个过程中，我都是以一种“幕后军师”的角色支持 Joie，我会把我学生或者学生家长里面对产品和项目感兴趣的人推给 Joie，也会帮助她一起管理社群，观望项目的进展。


    2018 年 9 月底的时候，我决定逐步关闭英语培训业务，因为新项目已经稳定盈利五个月，而且月平均收益，远远高于我的英语培训，并且，在时间投入上，也比英语培训项目少很多。


    这就意味着，我的时间，放到新项目上，才是一个更有效率的选择。我决定自己注册账号，全职做新项目。


    摆在我面前的第一个问题，就是流量哪里来？


    因为我通过教英语引流过来的潜在客户和经销商，都转给 Joie 了，相当于我是零资源起步。


    下一篇，我给大家讲讲，我是如何从零开始，打造一个新 IP 的。其中的一些要诀，可能跟你们参加过的大多数的“引流”培训，很不一样，甚至完全相反，我会逐一拆解。


    任何生意的本质，都是人。


    以诚换诚，以心换心，这才是长久的生意之道。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 10 如何打造个人 IP？


    在移动互联网如此发达且免费的情况下，还有人说“没机会”，这已经不是“没见识”，简直可以说是“没良心”了。


    在打造 IP 之前，我们需要回答一个最基本的问题：一个人为什么要在网上打造自己的 IP？


    **最重要的是，“打工人”就等于“工具人”，工具的特点，就是“功能明确，符合标准，但是没有个人品牌，没有个人品牌，就等于没有生产资料。**


    一个人在大公司，尤其是甲方公司上久了，就会有一哈没有


    实际上，强大的...是它办公室的人，而乙方对你的所有吹捧，都只是基于你的职位带来的那一点点行方便的可能。


    当这个人离开公司两周之后，原公司的同事，就不会有人提起他，以前三天两头嘘寒问暖的乙方老板，也在突然间没了音讯。


    如果一个人的本事，离开了公司之后，就没有人认可，那他就不是真有本事。


    生意的本质是人，人与人合作的基础，是信任，信任的前提，是了解，了解的前提，是沟通，沟通的前提，是输出。


    一个人的个人 IP，就是他的个人品牌，也就等于来自受众的信任。


    这就是为什么我不遗余力地强调打造个人 IP 的重要性。'
