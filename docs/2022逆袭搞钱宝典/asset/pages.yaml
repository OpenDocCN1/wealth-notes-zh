  md: '只要你在某个领域持续输出价值，在互联网上留下自己的足迹，就一定会有同频道的人，发现你并且跟你做链接。这样的人多了，你是不愁生意机会的。


    这个过程可能会非常缓慢，铺垫期可能会比较长，但是一旦你具备了一定的影响力，你就是一个行走的品牌，可以不依赖任何机构随时将你的商业价值变现。


