- pgno: 63
  md: '# 14 如何开辟陌生人市场


    在前文中，我给大家分享了，如何网上打造 IP，如何引流到微信，如何在私域完成流量的转化。


    过程中，我也接到一些读者的私信和留言，咨询关于如何在网上推广自己的业务。


    我想强调两点：


    首先，不管你销售的是什么产品，不管你用何种平台，你必须要自己产出内容，自己写东西、自己出镜，只有这样，才能在受众心目中留下印象，没有个人特色，就没有 IP。


    第二，在做好内容后，不要过分注重推广。要让别人看到你，太容易了，但要别人记住你，就很难，只有足够优秀的内容，才有可能带来有价值的粉丝。


    所有“横空出世”的背后，都是你看不到的“厚积薄发”。


    打造 IP 的过程，就是一个投资自己的过程，也就是让自己越来越值钱。这个过程是很漫长的，但强大的个人品牌能带来的机会和资源，也是难以想象的。


    在网上内容输出的过程，是一个“广结善缘”的过程，同频道的人，可以因为认可你的文字或者视频主动认识你，互通有无，共同通发展。


    在线下，为了能够链接到志同道合的人，发现潜在的客户和合作伙伴，我们也要随时准备好展示我们的价值，“输出”价值观。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# 你人生中遇到的每一个人，都有可能成为你的“任何人”。


    所以，持续不断认识和链接更多的人，你就能接触到更多的机会，不断增大自己成功的几率。


    回想一下，你离开家乡外出闯荡的路上，是不是绝大多数机会，工作也好，创业也好，都是陌生人带来的？


    甚至血缘之外最亲密的关系，也是跟陌生人建立的。


    和我们相遇、相知、相爱，直到组成家庭，生儿育女，白头偕老，相守一生的那个人，曾经也不过就是一个陌生人而已。


    我们寻找潜在的客户，和寻找爱人，并没有本质的区别。


    首先，我们需要定新信。


    在恋爱关系中，只有自信的人，才会从内心深处认为自己配得上另一半。同样也，只有坚信自己的事业能够给人带来价值的人，才能散发出自信的光芒。


    我对我从事的项目，怀有极高的热忱。我真心相信，分享健康、分享美丽、分享创富机会，做自己的主人，是我能实现的最完美的生活方式。


    大多数跟我一起聊过天的人，只要谈到跟创业相关的内容，之后都会评价我“非常有激情”或者“很有感染力”。


    其实我自己跟他们聊天的时候，我没有注意到我的表现，因为那就是我最自然的状态。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 感受，是装不出来的。


    即使是演员，也讲究“真听真感受”。情绪体验可以迁移，但不能生造。一个对自己的事业没有热爱的人，是不可能成为一个好的销售的。这就是为什么，同样一个项目，不同的人去做，效果可以相差
    10、100 倍。


    我和我太太参与的这个品牌推广项目，业绩好的经销商，无一例外都是激情满满，而做得不好的经销商，无一例外，都是犹犹豫豫，毫无自信的，跟性别、年龄、背景、学历，都没有任何关系。


    # 因为心态，同时具备造就一切和破坏一切的巨大力量。


    接下来，我给大家分享一下技术层面的心得：在线下，我们如何与陌生人建立联系？


    我通过一个例子，给大家讲几个方法：


    # 第一、主动给予帮助


    去年的时候，我的中国护照快过期了，于是去领事馆换护照。有些申请资料，需要用大厅里的复印机复印。


    我注意到有一位四十多岁的大姐，看着像是不太像操作的样子，于是我主动上前，问她是否需要帮助？果然，她说她完全不会用打印机，于是我就帮她复印了资料。


    # 第二、学会倾听


    当我们回到等待区的时候，她就开始跟我聊天，问我是干什么的。我简单说了一下我的生意，然后问了一下她的情况。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '她说之前在珀斯开了一个餐馆，老公跟他离婚了，回到了中国，她自己一个人艰难支撑了半年，管不过来，就把餐馆卖掉了，现在正在寻找生意项目。


    倾听他人，除了能够了解到对方的基本情况之外，更重要的是，可以通过对方描述人生的方式，看出 TA 的性格和价值观。


    # 第三、给予赞赏


    从她的话中，我的感受到她是一个非常坦诚的人，小态也比较开放。


    于是我就把我对她的评价告诉她。这个方法，与其说是为了赢得陌生人的信任，更多其实是训练我去发现每个人身上的闪光点。


    # 第四、学会共情


    共情是与陌生人进行情感链接最快的方式。


    我和 ''oie 当初带着 3 万人民币到澳洲，经历了失业又创业的过程，知道现在小有成绩，我们对于新移民在澳洲生活下来的的难度，是深有感触的，所以我很理解她的不容易。


    我跟她讲了一下前几年我们在澳洲努力寻求发展的经历，几分钟的时间，相似的经历和共同的感受，让我们的距离更近了。


    # 第五、留下联系方式


    因为在领事馆停留的时间有限，要想今后有更多的联系，必须留下联系方式。'
