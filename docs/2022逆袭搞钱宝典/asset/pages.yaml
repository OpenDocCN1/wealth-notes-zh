  img_proc: true
- pgno: 31
  md: '# 08 再次转型


    有人说，已经成功的人，说起挣钱，都是那么容易。


    我觉得自己在过去几年，的确是取得了一些成绩，之前的文字里，我并没有特别突出创业过程中的困难，原因是 我希望大家要默认，创业就是很辛苦的，它就是一个需要持续发现问题和解决问题的过程。


    我可以渲染我如何一天连上七节课，晚上备课到深夜，第二天早上七点又起来，用沙哑的嗓音，强行聚集我所有的能量，热情洋溢地给悉尼的学员上在线课。


    我也可以详细描述我去超市购买的时候，如何在遵守限购要求的前提下，还遭到澳洲本地销售员的白眼，如何被其他华人当面训斥，说我们影响了他们在澳洲本地人的形象；如何顶着
    40 度的高温，汗流浃背地在车库打包。


    但是我觉得没必要。


    因为你选择了一个行业，就要接受这个行业对你的基本要求，就该承受你应该承受的。


    你就是靠做这个事情赚钱的，体力上的付出，你要接受，有人对你有误解，看不起你、骂你，你也要继续做，因为路是你自己选的，受不了的话，很简单，那就别干了。


    底线是，你只要干一天活，就要有一天的角色意识。或者说得高端一点，就是要“专业”。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '是创业过程中，要保留一定的灵活性，一旦发现某个项目赚钱效率低，要果断调整策略。


    在线英语培训是我创业以来的第二个生意，到 2018 年 10 月就决定不再进一步投入精力发展，不接受新学生，2019 年 1 月完全停掉了所有的课程。


    原因有以下几点：


    # 第一：获客成本过高


    做教育培训，个人 IP 很重要。


    为了打造值得信任的英语教师/机构的形象，我需要花大量时间维护免费的英语社群，包括微信、微专和公众号。


    英语每日打卡群...每天会录制一段教学视频，配上文字在群里教学。但是哪怕是精力...每天坚持，结果我倒是坚持下来了，群里面的人却...动了。


    一年过去了，现在打卡群基本上不动了，一个群里 500 人，可能只有两三个人会跟读。


    # 第二：回购率低


    大多数的学员，包括成人和家长，在心底是不会完全信任一个老师或者是机构，你教得再好，再负责，一般三个月到半年后肯定会换到别的地方。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '因为不管你说什么，学员一旦没有取得立竿见影的进步，他们就会换老师。


    外行永远觉得自己比专业人士懂得多。


    哪怕学员进步很大，他也会觉得说这个老师的精髓我已经学到了，我可以换人了。说什么语言学习的规律，什么循序渐进，都没用。


    # 往往越是那种简单粗暴，出奇制胜的“绝招”，越容易被初学者自抛。


    例如说，你什么都不要管，只要把《新概念英语》给我背下来，背到说梦话都是课文内容，那么你只要一开口，一下笔，剑桥的教授都要被你流利的英语惊到。


    这是一个傻 x 得不能再傻人的理论，因为你背课文背得再好，也只能解决“输入”的问题，表达，不管是口语还是书面用语，是属于“输出”的范畴。


    一个只练套路不练实战的拳手，是不可能有战斗力的，因为对手不可能按套路出拳；一个只背课文不与人交流的英语学习者，是不可能具备任何表达能力的，因为对方不可能按课本说话。


    但是，这种故事足够吸引人，成功路径足够简单，足够给人希望，所以，信的人多得是。而且往往是英语差得不得了的那群人对英语学习的方法头头是道，而真正练英语的时间少得可怜，如果他们不是对英语老师很信任，你基本上很难改变他们的想法。


    # 第三，竞争太大'
  merge: -1
  img_proc: true
- pgno: 34
  md: '2021 年教培行业整顿之前，网上的可供选择的教学平台太多了，而且很多平台为了抢占市场，不怕亏本，各种各样的免费试听课太多。


    我走的是特色模式，留下来的客户都是比较认可我的教学理念，而且相信一分钱一分货的，但这也限制了我的学员数量。


    # 第四，利润低


    我团队里面有 4 名母语老师，给她们的课时费占到收费的百分之六十，所以我要是再往营销上付出更多的成本，同时学员数量不够大的话，我就根本没的赚了。


    但是学员数量稍微一起，我的管理成本又提高了，到时候还要考虑招人做助理，最后算下来精力花费了不少，利润没有多少。


    如果我要扩大规模，就要大幅增加前期投入。我甚至考虑过在珀斯本地开一个教学中心，甚至去看了好几个商业地产，可以作为潜在的教学点。后来算了一下账，违背了轻资产创业的初衷，于是放弃了这个想法。


    实际上，我创业五年多都一直坚持一条原则：


    **所有需要高额前期和后期持续投入的项目，我都不做，因为你赚到的钱，需要马上投进去。**


    这就是为什么，我不考虑做餐厅，尤其是中高档餐厅。首先前期投入大，接着是房租，地段越好，租金越贵。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '生意再好的餐厅，每过两三年，你是必须要重新装修的，这是一笔很大的花费，虽然是挣了钱，但你需要不断往里面砸钱，才能保持餐厅的吸引力。


    所以很多开餐馆的老板，你看着店里客人多，以为很赚钱，实际上，现金流确实是不错的，老板也开着豪车，但真正手里的利润有多少，很难讲。


    代购规模做大了，也有一个问题，就是为了拿到不错的价格，就需要囤货。赚的钱，全在仓库里堆着，只要你不关门，你的仓库里就永远有一批货在那压着。


    而且代购的产品，大多数是有保质期的，货量越大，过期的产品就越多。所以越是大的代购店，仿老东西，赠送的礼品就越多，因为那些存货都是快临期的，送给...还能赚个人情，不送的话，过期的还要出垃圾处理费。


    所以我要给轻资产创业的的朋友一点自信：


    很多排面大，重资产的创业者，看起来给人感觉很牛，实际上他不一定有你的赚得钱多，说不定，他在内心深处，还要羡慕你，只不过为了保持他作为“大老板”的高傲，在评价你的时候，会带有一些不屑。


    网上有的博主会说，一个生意，最重要的是现金流，不在于利润，而且喜欢拿京东来做例子，虽然亏了十几年，但是跑出了自己的赛道，一样很成功。


    我先不说，大强子从创业京东到现在，公司到底有多少个徘徊在生死边缘的时刻，我就问两个问题：'
  merge: -1
  img_proc: true
- pgno: 36
  md: '第一，你有没有开创一个新商业模式的能力？第二，你能不能拉到投资？


    我不行，因为我是普通人。那么就意味着，这个社会上，99.99%的人，都不行，凭什么你就是那 0.01%呢？


    最适合普通人的创业路径，就是去做赚钱的生意，哪怕再小，绝不借钱创业，能赚一点是一点，落袋为安，增加自己的抗风险能力，然后滚雪球，慢慢做大。


    基于以上几点，我估计在保证小成本的前提下，教英语的年收入顶点，是 80-100 万人民币，我不喜欢没有增长潜力的生意，于是开始寻找新项目。


    下一章，给大家讲讲，我和我太太 Joie，是如何找到低成本，高潜力的新赛道的。'
  merge: -1
