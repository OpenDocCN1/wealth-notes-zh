- pgno: 57
  md: '# 13 如何把消费者转变为合作伙伴？


    在前几章当中，我给大家介绍了 IP 变现的系统化思维、如何进行 IP 定位、如何进行内容输出、朋友圈如何打造，接下来，我要给大家分享的是，如何在微信上，把陌生的“观望者”，转变成为你的客户甚至是生意合作伙伴。


    在讲具体的技巧之前，我要解决一个大家的一个疑问，微信上，到底能不能挣钱？


    可以挣钱，而且非常挣钱。


    微信是 2011 年 1 月 21 号诞生的，到现在马上 10 年了。在这期间，已经有无数人借助这个免费的工具，挣到了百万、千万身家。


    这些人里面说不定就有你认识的人，而且是学历、家庭背景都不如你的人，他们靠微信赚到了不错的钱，只不过你不愿意相信，认为他们很 Low，早早地屏蔽了他们，或者已经将他们删除。


    朋友圈生意，作为一种商业模式，为什么会存在？


    因为便宜。


    近五年的互联网生意，很多都是直接或者间接利用微信起来的。例如某多多，现在已经出现在各种网络节目和 app 当中，但是刚开始起盘的时候，靠的就是在朋友圈和微信群里面刷一个又一个的优惠链接。


    这就是某多多的群众基础，后来的铺天盖地的广告投放，结合了大量的初始用户，才让它在短时间内爆发。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '大多数互联网项目在刚开始起盘的时候，是不敢大规模投放广告的，因为创始人需要验证这个商业模式是否跑得通，同时也不一定拿得到融资。即使拿到，投资人也不是傻子，是会分阶段投入，不可能一开始就烧钱。


    所以，靠个体消费者或者代理商在微信上进行推广，就是一个非常省钱，而且高效的做法。一般 WX 用户的联系人，两三百个是很正常的，每个联系人的背后，又有两三百个人，扩散出去，数量就很庞大了。


    传统广告，你的东西能不能卖出去，跟我没关系，广告费，你要先给我。在一个产品或者平台没有基本客户基础，同时商业模式还不成熟的时候，这样做就很冒险，很可能白烧了广告费。


    个体推广的方式就不一样，你只有把链接/二维码成功推出去之后，品牌方才会给钱。


    企业创始人，只需要把传统广告投放渠道预算的一小部分，出让给消费者或者经销者，就可以达到既能验证商业模式，又能达到推广效果，同时还能省钱的效果。


    只要互联网创业存在一天，WX 作为推广渠道的功能，就存在一天。


    所以，微信联系人的转化，值得大家花功夫好好研究。


    如何完成转化？我给大家总结了几个要点：


    # 1、朋友圈打造是完成转化的关键步骤'
  merge: -1
  img_proc: true
- pgno: 59
  md: '其实大多数找我了解产品和项目的朋友圈好友，都不是我主动谈的，而是通过观察我的朋友圈到一定阶段，觉得我这个人以及项目都比较靠谱，然后主动询问的。所以朋友圈的打造，是完成转化的关键步骤。


    在我们已经通过朋友圈的其他内容展示了我们自己全面的，鲜活的，并且让人信任的个人形象之后，我们就可以慢慢植入产品和项目。


    (1) 一般的步骤应该是先分享自用产品的感受，打消受众对于产品的顾虑


    这个种草不可能一天两天见效，要持续一段时间才行。你的好友经常看到这些产品在你的朋友圈出现，而且能看到你使用产品之后的前后变化，就肯定有人会感到很好奇，开始询问产品。这个时候，你就可以根据他们的自身情况，推荐符合他们需求的产品。


    (2) 一对一跟踪，持续使用感受


    微信对于其他销售渠道的优势之一，就是能够跟及时地触达消费者 作为一名合格的销售，如果你在朋友圈销售的是产品，那么一定要做好跟踪。


    很多主流的直销品牌，尤其是美国的，大家直观的感觉，就是他们的东西很贵。但是大家有没有想过，为什么这么贵的东西，还有人买？为什么这些品牌能存在几十年？比一些曾经耳熟能详，“脚踏实地”的传统企业，还要更长命？


    因为他们很注重客户服务。如果你花了 100 块在产品上，其中至少 60%，是花在了服务上。


    好的服务，能够让消费者感觉到尊重、重视甚至是关怀。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '这里给大家介绍一个原则，就是“3-7-21”原则。这个原则是我的 一位客户服务做到顶尖的朋友提出来的。


    内容很简单：在客户下单后的第 3 天，第 7 天和第 21 天，对客户进行跟踪。


    第 3 天跟进的内容，是客户有没有收到货？如果收到，给客户讲...使用产品的一些注意事项。


    我主营的类目，是护肤品、化妆品和健康食品。


    护肤品，是很挑皮肤的，同样的产品，不同肤质的人，使用感受会完全不一样，作为销售，我们需要根据客户的肤质，设计个性化的使用方法。一手资源微信221934884


    例如说，如果是皮肤比较干的人，在使用涂抹式玻尿酸的时候，会有刺痛感。这不是产品本身的问题，而是使用方法的问题。


    在下单第三天的时候，我们就需要告诉客户，在使用产品之前，要先做好补水，有了这个提醒，客户的产品使用体验，就 会大大提升。


    第 7 天和第 21 天的时候，也要进行跟进，因为客户在使用的过程中，可能会产生其他问题，如果不主动询问，由于知识的缺乏，客户很可能会把一些正常的反应，当成是产品的问题，由于没有沟通，就会对产品失去信心。


    # 2、利用线上的招商会达到转化'
  merge: -1
  img_proc: true
- pgno: 61
  md: '如果你项目，在销售产品的同时，还在招商，那么线上招商会，是一个很好的方法。


    线上招商会的目的，是为了给潜在的意向客户一个更系统地了解项目的机会。


    每一位从公域流量来到微信的联系人，我都会跟他们进行简单的沟通，如果不是明确拒绝产品和项目，我就会给他们备注，在线上招商会之前，我会对他们进行邀约。


    邀请发出去之后，大概最后会有百分之三十的人参加，加入的，3%-4%的概率。这个数据，就是现实生活中真实的数据，所以在任何行业，大家都不要报不切实际的幻想。


    不同行业，商业模式不同，挣钱效率也不同，但要做到顶部，都不容易。


    就好像那些在网上表现出很洒脱，讥刺“奋斗逼”的那些人，自己本身就是“奋斗逼”中的“战斗机”。


    虽然单次的概率很低，但是我采取的策略是同一个人，只要他不明确表示拒绝，我每次线上招商会都邀请他。


    我有不少客户，是参加了三次以上的线上招商会才成为客户或者经销商的。对我来说，也没多费多大功夫，方正通知都是群发的，拉个人进群，也不麻烦。


    但是，就是这种简单重复的动作，长期坚持，会增加招商成功的几率，因为人的想法，生活状况都会变化，说不定哪天他就想通了，愿意试一试。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 你来去自由，我随时都在。


    很多时候，一个人的胜出，靠的不是出众的智力和过人的体力，而是“熬”的能力。


    很多聪明人其实是经不住熬的。


    因为他们能一眼看出事情的“本质”，“无非就是……”和“只不过……”是他们的口头禅。


    但是一个事情，看出框架容易，看出门道就难，必须要真刀真枪地干，才能获得真正一手的经验，获得真正有价值的信息。


    真正的门槛，是我摔过的坑，比你迈过的步还要多。


    聪明人太依赖他们的智商，认为只要他们开动脑筋，总能找到更好的模式，更好的解决办法，于是在一个项目上遇到困难的时候，他们会认为这是项目本身的问题，于是频繁更换项目，最终也没有找到完美的项目。


    而舍得下笨功夫去“熬”的人，虽然也能遇到不靠谱的项目，但因为ta认真做过，所以即使是吸取的失败教训，也比那些走马观花的聪明人深刻。


    只要让这种“笨人”碰到一个不错的项目，凭借他们的坚持精神，可以比“聪明人”更快地脱颖而出。


    下一章，我给大家分享下，渠道运营类生意，如何进行线下引流和转化。'
