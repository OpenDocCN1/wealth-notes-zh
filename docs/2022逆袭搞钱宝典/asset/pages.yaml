- pgno: 94
  md: '# 20 轻装上阵


    本章我想跟大家聊一聊我对创业成本的新看法。


    我一向不赞成投资太大，甚至孤注一掷的创业，尤其是第一次创业，给自己的生活留点余地，心理压力不会那么大。但是我发现对于大多数人来说，创业的时候，稍微有一点成本，反而更容易坚持下去。


    真正开门第一天就赚钱的生意，非常少，大多数的项目都是需要铺垫的，线下的生意需要找产品、找店铺，工商、消防、税务、招工......工作量很大。


    线上的生意相对来说简单点，但变现的路径也是需要一定步骤的，那种“是我，打钱”的事情是不存在的，哪怕是骗子，也要苦心钻研话术。


    没有煎熬，就没有成功。见效比较快的项目也至少需要两三个月都准备，才能开始赚钱，而且即使是赚钱，也不可能一夜暴富。


    我当初做英语培训的时候，在各种平台上免费输出三个月才招到第一个付费学员。


    任何英语稍微好一点的人，复制我的方法，都是可以招到学生的，一年保底挣个十来万一点问题都没有。


    但是英语好的人很多，能像我这样坚持的人就很少，哪怕坚持一个月的人，人群中可能不到1%。


    这不是因为他们没有这个意志力，而是因为这本来就是零成本投入的项目，放弃了也没有什么大不了。'
  merge: -1
  img_proc: true
- pgno: 95
  md: '这就是创业的规律，一个生意赚钱不赚钱，跟创业者有没有本事，其实没啥太大的关系，因为能力是可以rl通过学习和锻炼提高的；跟行业也没有关系，行业只能决定你能赚多少钱，而不能决定你能不能赚钱。再“好做”的生意也有人不赚钱，再“难做”的生意，也有人做到亿万身家。


    在创业的道路上，再有本事的人，也要熬过一段黑暗期。只有投入，不见回报，过一段时间，很自然地就开始怀疑行业怀疑项目，甚至怀疑自己。


    在这种情况下，如果没有一点点前期的资金投入，一个人就没有放弃的成本，可以直接撂挑子，因此也错过了学习、成长和积累的机会，不可能熬到挣钱的那一天。


    很多人的生意为什么做成了？很大程度上并不是因为他都有本事，而是因为前期投入了不少钱，必须撑下去，实在是撑不下去了，才会放弃，结果就撑过了低谷期，到了红利期就赚钱了。


    所以大家在考擦任何项目的时候，如果没有任何门槛，那么很有可能这个项目的模式很牛，但是你自己因为没有成本，所以会随随便便放弃，适当的投入会带来适当的压力，对提高创业成功率，是绝对有好处的。'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 21 2022 年，普通人如何逆袭？


    答案只有一个：互联网。


    住在一线城市最顶级楼盘里面的富人，相互之间，其实是没什么社交的，他们都是在各自的圈子里面玩。


    因为不同行业的老板之间，很难有真正的交流的，因为挣钱方式之间的区别，比打工和创业的区别还大。


    一个有着 20 多年校龄，建筑面积 4 万平米，学生 1000+，每年学费住宿费能收一两千万，教职工 100 多人的私立学校，一年能有多少钱的利润？


    一两百万。


    我爸在这个学校教了 20 年的书，去年刚退休，他亲眼看到学校从几十个人发展到现在的规模。这么多年里面，他遇到校长几百回，没有一次校长的脸上，不是挂着愁容，因为要操心的事太多了。


    还有一次，为了省两块钱的人力三轮车费，在校门外和车夫吵得得不可开交。


    我和 Joie 两个人做电商，加上三个人的兼职运营团队，去年的销售额，8000 万，利润 400 万以上。


    去年是我们做项目的第三年，2018 年的时候，我们前期总共投入了 11 万人民币，没有任何的固定投入，所以没有任何财务上的压力。


    我跟这个学校的校长，是无法沟通的。'
  merge: -1
  img_proc: true
- pgno: 97
  md: '因为虽然我们赚钱的逻辑，都包含了流量的获取、转化、留存和裂变。


    但是学校的生意，太麻烦，需要自己生产教育产品，学员裂变率（转介绍）低、客单价虽然高，但利润率低、维护成本高、生意本身的门槛高，不是谁都能拿到资质的。


    而现在随着互联网的发展，全球供应链效率的大幅提升，个体作为渠道节点的功能，越来越强大。电商渠道，可以说是没有门槛的行业，任何人想做，都可以入场。小学没毕业可以做，没钱可以做，没人抄袭样可以做，而且做好了，能发财。


    而且新行情的涌现，是以季度为单位的。只要你想，几乎随时都能找到适合你的项目。


    你可以走着入场，跑着入场，甚至还可以躺在那里，被其他人拖着入场，莫名其妙赚大钱。


    而这个人，可能是你素未谋面的陌生人。


    所以为什么 old money 看不起 new money，就是这个原因，在拧老钱的那帮人眼里，很多赚新钱的机会，其实是下沉了的，一点都不精英。


    退后二十年，开工厂、办教育、搞建筑、挖煤矿，哪一项都不是一般人能撬动的。你要有信息，有钱，有关系才行。


    而现在呢，随便一个阿猫阿狗，利用互联网，居然可以年入百万，千万。这种事情，“老钱”看不懂，更不愿意相信。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '这就是为什么，有些老板明明实体都开不下去了，也不愿意到 VX 去引流的原因。他们觉得丢人，没档次。


    但是新兴的行业在不断兴起，随着“新钱”群体的壮大，老钱的话语权会逐步被替代。今天的新趋势，未来就会成为常态，曾经的先锋，到现在可能已经走向末路。


    我就是“阿猫阿狗”，看这篇文章的读者中 99%的人，都是“阿猫阿狗”。


    如果把我放到只有精英才能胜出的时代，我只能一辈子过着很普通的生活，因为新人是没办法在老规则下出头的。


    普通人，一定要盯紧时代发展的趋势，跟着大趋势走，只有关注新机会，尝试新机会，抓住机会，才有机会逆袭。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 22 2022 年普通人如何做自媒体？


    我发现，今年的媒体人，比去年更勤奋。


    我加入的几个大 V 的社群，在我下播之后，群主都还很活跃，各种发红包，与群友互动。今天一大早，各个公域的平台，创作者作品发布的密度，也比平时高出好多。


    为什么大家都这么拼？一方面是因为过年期间，大多数人在聚会的间隙，其实是很无聊的，流量红利大，更重要的是，从大趋势看，2022年，流量的钱，更难赚了。


    流量变现，有以下几个趋势：


    # 第一个趋势：自媒体人在公域流量的争夺，不再以单纯的粉丝数量为战场，而是高质量粉丝的数量。


    其实这个趋势，在 2018 年底的时候，就已经显示出来，只不过当时很多的自媒体人，并没有意识到，尤其是粉丝几十万上百万的博主。


    一方面，是因为当时的商家对广告主还比较信任，也可以说还比较傻，对于大 V 广告带货的真实效果，并没有一个相对准确的理解，还处于交学费的阶段，而收学费的大 V，就是这一波认知差红利的获益者。


    后来越来越多的商家，花了几万块的广告费，结果只卖出几百块的东西，于是也慢慢明白过来：原来粉丝数量，是可以作假的；即使粉丝是真的，粉丝质量比粉丝的数量更重要。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '总体说来，消费品领域和知识付费领域，财经类粉丝的消费能力，比职场类的高，职场类粉丝的消费能力，又比剧情号的粉丝消费能力高，最不愿意花钱，同时也没什么钱的粉丝，是军事和时政类。


    即使是财经类博主，拥有几十万级别的粉丝量，全靠广告和带货，一年也很难有百万以上的收入。


    接下来的变现方式，就是知识付费。

    这对粉丝的质量要求也很高。如果粉丝的消费能力和消费欲望都不强，看热闹的多，真正付费的人少，就会出现人很火，但挣不了多少钱的情况。


    而且只是付费这个变现途径本身，周期性是很强的。


    最显著的问题，就是付费粉丝的增长速度，跟不上变现的速度。同一个课程，可能第一期的時候能招 500 人，赚了二三十万，第二期的时候就只有 300 人，第三期的时候可能就只有
    150 人了。


    博主要持续赚钱，只能开发新的知识付费产品。而博主的专业能力是有限的，自己熟悉的领域就那点东西，后期只能跟其他博主合作。


    下面问题来了，既然你是跟别人合作，那我作为为什么不能直接找你合作的那个人去买课呢？


    实际上，这种大 V 带中 V 的模式，到后来就是大 V 在为中 V 引流。


    所以，没有大规模变过现的大 V 博主，一开始变现，势头是很猛的，第一年能干个几百万，但第二年收入就减半，到了第三年，如果没有全新的产品出来，基本上就没多少钱可赚了。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 第二个趋势，就是博主的后端运营能力，决定了 IP 变现的效率和持续性。


    我 2018 年以前的定位，是教育类博主，消费能力和意愿，属于中等偏上，而我的粉丝，全网加起来，也就两万人，根本不可能接到广告。


    而大的细分领域的头部博主的粉丝量，非常恐怖，动不动就两三百万，我作为新晋博主，已经太多增量粉丝留给我了，所以必须谨谨慎考虑我的商业模式。


    于是我采取了两个策略：


    # 第一就是把 IP 往创业上靠，后端链接到业机会。


    # 第二就是增加账号的垂直度，专攻创业领域里面小成本，跟互联网相关的细分领域，把大 V 们里面那些有细分需求的人，转化到我这边，为他们服务。


    事实证明，这两个策略是对的。


    到现在我全网也就不到 6 万粉丝，其中 8000 还是过去两个星期在知乎涨起来的，而且基本上就靠这篇连载，所以这里面有一定的偶然性。


    一个事情，偶然性越强，越难以复制。


    前不久在我的创业分享社群里面，有群友说他刚买了比特币，昨天买的，而且坚信能赚钱，因为某某大神赚了钱。


    我没有否定他，因为有可能三年后，比特币真的会再翻 10 倍。但我觉得这个标的不确定因素太多，所以复制性会比较差。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '投资就是要追求确定性，要不然跟去赌场有什么区别？


    精准输出、精准引流、精准转化和精准服务的策略，把 IP 变现的确定性，提高到了极致。


    去年的時候，我的粉丝五万，变现 430 万，今年的目标，至少是 600 万。


    我吸引的，就是想要通过小成本创业，改变人生的人，我在公域发表的内容，就已经完成了初步的筛选。


    然后进入我私域的人，通过三言两语的交流，完成分流。


    一部分粉丝只是对我有一定的好奇心，这部分人我就让他们观望观望。一部分粉丝对我做的事情比较感兴趣，我简单介绍一下，然后把他们推给我太太，让他们获取更多信息。还有一部分粉丝自己有生意，想要开拓眼界，他们就可以进入我的创业社群。


    偶尔会遇到杠精，我直接删除拉黑，绝不废话。


    这个步骤，实际上把所有的粉丝都进行了转化成为了潜在的消费者和合作伙伴、知识付费的客户。


    第三个趋势，就是自媒体人对粉丝的影响力，相对于内容质量，触达频率的权重，会越来越高。


    2021 年，刘德华进驻抖音，几个小时的时间，粉丝就达到了两千万。


    刘德华是我少年时期的偶像，现在还是我的偶像，但是多了一个身份，就是我的“竞争对手”。'
  merge: -1
  img_proc: true
- pgno: 103
  md: '因为我自己也有抖音，所以在引流方面，我们是有竞争的。


    能和自己的偶像，出于同一个竞争领域，我既感到有些意外，同时也有一些小小的自豪。


    因为这说明，流量变现的生意，潜力还很大，大明星都想进来分一杯羹。


    和大明星相比，我们普通人有什么优势？


    我们的优势恰恰就是粉丝不多，所以可以增加达粉丝的频率，与粉丝一起成长进步，分享人生经历，从而增加粉丝的粘性，达到长期的合作。


    这就是为什么我和团队逢年过节要做直播的原因。在华人最重要的节日，我们没有和家人一起聚会，没有出去放鞭炮，没有打牌，而是精心准备，和茫茫的小伙伴们一起跨年。


    大明星，大V，可以做知识输出者，引导者，榜样，但是他们很难成为倾听者，陪伴者，这就是我们小V和KOC的机会所在。


    2021年，不管你是自媒体人，还是微商，只要你在私域里面有粉丝，不管这个数量是一千还是一万，甚至不管你有没有完全确定你的商业模式，一定要确保你跟粉丝的触达频率足够，只要你能成为那个让他们每天至少想到一次的人，你就还有机会靠IP变现。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 23 最有效的学习方法，就是亲身实践


    在经济形势极其不稳定的背景下，有不少朋友，现在正在寻找副业。


    同时，大多数的朋友都有这样一个共识：互联网相关的营销项目，是能够同时满足符合时代趋势、投入成本低而且发展空间大三个条件的创业板块。


    大家真正纠结的问题，在于项目那么多，到底要选哪一个。


    我的建议是，随便选一个。


    我自己是做渠道营销的，我当然希望大家能够首先考虑我的项目。但是站在创业指导者的角度，我认为一个人的核心能力，比项目本身更重要。


    这个判断听起来跟我之前的观点有点矛盾，我之前更多强调项目选择的重要性。


    实际上，影响创业成功的因素有很多，在不同阶段，不同因素的权重是不一样的。


    对于创业小白来说，刚开始做副业或者辞职，尝试做第一个生意。这个阶段，重要的不是项目，而是认知。


    第一个认知，就是思维方式，也就是要明白通过出卖劳动力和时间赚钱与通过商业模式赚钱之间的本质区别。


    前者的机制是简单交换，后者的机制是杠杆。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '如果用打工的思维去创业，最后的结果，只不过是把用劳动力换钱的模式，换了一个环境而已。


    例如说，辞掉了朝九晚五的办公室工作，去开一个早餐店，然后和自己的伴侣，每天早上 4:00 起床做早餐。


    这种生意，是没有什么附加值的，跟上班没区别，甚至还比不上上班，上班至少不用自己投入。


    而同样是做早餐店，能够成为品牌方让别人来加盟，这里面就利用的杠杆效应，也就是把他人的资金和劳动，都为自己所用，把一定的风险转嫁给别人。


    思路上的转变，可以通过接受二手信息，加上自己的思考来实现，但是决定创业者成败的关键认知，必须要从实践当中学习。


    基于我这几年创业的经历，我发现，只要是跟互联网相关的个体创业项目，对人的能力要求，其实是高度一致的：


    设计变模式的能力、内容输出能力、文字表现力、镜头表现力、演讲能力、带货能力、社群运营能力、团队管理能力等。


    我发现，具备上述能力的人，在过去 10 年，能有抓住一波又一波的机会。


    实际上，我目前项目的经销商里面，有一部分，就是原先做微商、直销、电商的团队长，他们带着相关行业建立能力切入新项目，很快就能把团队做起来。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '我也发现，三年前以小白身份加入项目的经销商，例如我们的第一位经销商就是一位纯小白宝妈，之前完全没有做过跟互联网相关的副业，连代购都没做过，通过三年的实践和成长，现在已经成长为可以独当一面的团队长，年入六七十万。


    # 核心能力怎么取得？


    最有效的方法，就是直接上手干，同时跟着优秀的人去学习，这样才能确保在方向上不犯错。


    遇到真问题，解决真问题，才能学真本事。


    经济不好，赚钱更难。练好内功，至少能跑过那些持续观望的人。


    哪里有什么一夜暴富，一切都是功到自然成。


    大家好，上个星期，带着团队打完了几年第一次大活动：3.8 女神节，之后休息了几天，继续跟大家分享。


    今天的话题是，为什么我的经验，值得普通人模仿？


    其实，大多数真正有用的策略，说出来都不太好听，例如“空手套白狼”。但是这句话对于想要创业的普通人来说，是再实在不过的金玉良言。


    这句话有两个要点：


    一是投入小，最好零资金投入，因为亏得起，没心理压力。


    第二是选择的行业相对边缘，大家都不是很懂，护城河不是很深。'
  merge: -1
  img_proc: true
- pgno: 107
  md: '2016 年七八月份，我和 Joie 决定开始自己做生意，找了一圈，发现只要投资额超过两万澳元的生意，我们都不敢做。因为我们当时总共的存款，还不到 4
    万澳币。贷款就更别想了，还在租房，哪有房子抵押？车也是个二手车，贷款刚还完，也就值个一万澳元。


    现在想想，幸好当时没钱，只要但凡有点钱，或者有房产抵押，我们就去做实体生意去了，开清洁公司、鱼薯店甚至做汽车旅馆这Attach，认识的华人朋友的生意，基本上也是集中在这些领域。


    如果做这些生意，我和 Joie 这样的行业小白，加上疫情的影响，基本上只有两个结果：生意失败，负债累累，或者生意成功，但是艰难维持。


    结果我们选择了从“空手套白狼”的生意做起，做代购，虽然挣得不多，但是不亏钱。代购挣了点钱，然后我又用极小的成本，做英语培训，一年也就几十万，但是是净亏钱。


    再到 2018 年，先做某纸尿裤项目，后来遇到现在的品牌推广项目，个性投入顶天了，也就几万人民币而已。三年过去了，现在一个月的平均利润，是 20-30 万人民币打底。


    普通人创业，就该模仿我，因为我们的共同点，就是既没钱，也没有经验。如果是一个小白，听别人忽悠几句，就敢借钱去做实体，就跟第一次入股市的散户一样，基本上都是要被“割”的。


    但是，只要我成本够低，甚至没有成本，我就不怕，大不了不赚钱，我再换个项目就好。


    尤其是进入的领域还是成熟行业，那些做了五年十年，经验丰富的老板，可能都在勉强维持，你凭什么刚进去就能赚到钱？'
  merge: -1
  img_proc: true
- pgno: 108
  md: '而新行业就不一样了，大家都在摸索，只要你比别人稍微研究得多一点，就能挣到钱。做代购的时候，大多数澳洲代购，机械转发，我和 Joie 的朋友圈图片拍得用心了那么一点点，销量就上去了。


    做品牌推广的早期，当时很多人还没有社群运营的概念，我们就随便拉了一个群，稍微管一管，代理的活跃度马上就起来了。等大家都有了社群运营的意识了，我们又切入公域引流、布局短视频和直播触达。


    试想三年前，如果我去做传统实体行业，例如开餐馆，我有机会干的过那些十年从业经验，而且比我有钱的竞争对手吗？


    珀斯的华人餐馆，去年到现在，倒了有一半吧，难道是他们的能力都不如我？


    我跟一些做得还不错的餐馆老板聊过，他们的勤奋程度，扪心自问，我是做不到的。


    现在还能活下来的，除了要很有强的运营能力，还要有相当充沛的现金流，外加一点点运气。


    很多之前都有餐饮的经验的餐馆老板，但这个行业确实太难做了，再加上疫情的影响，也只能被迫关门。


    社交电商，其实现在依然是边缘行业，但是进入成本是真的低，但是做好了，赚钱绝对比做个小生意强很多。


    “空手套白狼”的好处那么多，唯一一点“坏处”，就是不太被主流人群认可。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '第一个就是对于行业本身的偏见。很多这类项目，都不是传统意义上“正儿八经”的生意。第二个，就是会给人一种“赚快钱”的感觉，很难持续。


    对于一个看法，生意只要不违法，不违反社会的公序良俗，就可以做，赚钱的方法不同，结果一样，大学教授的 100 元工资和微商赚的 100 元利润，购买力是一样。


    再说“赚快钱”。有些人觉得说只有实体生意，才踏实，才能长久赚钱。这其实是最大的误解，初创生意三年的存活率 10% 这个数据，其实是不分行业的。反正失败率都那么高，为什么不找个成本低的行业呢？


    哪怕活下来，传统行业就真的比边缘行业更长久吗？珀斯华人商业圈北桥那片，在过去四年，有多少餐馆、代购店、咖啡店、礼品店关门？同样的时间，我和 Joie 做数据，依托上英语，做
    ABM，从第一天开始，每天都赚钱，一直秉现在，要亏钱都不可能，你说哪个行业更长久？


    想要增加收入的普通人，真的要好好研究下“空手套白狼”，这才是最稳妥的做副业和创业方向。'
  merge: -1
  img_proc: true
