- pgno: 11
  md: '# 04 具备哪些特点的创业者，最容易失败？


    # 一、缺乏对商业逻辑最基本的理解


    前不久，在我的创业干货分享群里面，有位会员咨询我，说她去年做了一个助眠的产品，她可以保证，比市面上同等价格的产品的质量更好，因为使用的中药材级别更高，还痛斥了某市面上很流行的保健茶饮料的暴利：每包成本只有五毛钱，但销售价格却能高达几十块。


    她觉得如此良心的产品，应该会卖得很火爆。


    我就问她：你这个产品卖得怎么样？


    她说：在朋友圈推出之后，无人问津，很着急，于是找了个主播帮她带货，15000 元的费用，保证能够卖出 5000 盒以上。结果直播结束之后，只卖出去几盒，每盒
    300 元。


    我说：那这个主播没有履行承诺啊！


    她说：没有办法，合同上并没有销量保证。


    我问：最后怎么样了？


    她说：最后，主播一分钱也没退，送了我六个字：


    “傻 X，好好活着！”


    听了她的遭遇，我的感觉，是哀其不幸，怒其不争。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '“不幸”的是，她不但被主播骗钱，还要受她的侮辱，而且还没有办法，因为骂人，不犯法。


    “不争”的是，她居然连基本的商业常识都不懂，就敢自己做品牌。


    我们先不说主播的能力，单看要价，就很有问题。


    商人的第一原则，就是利益最大化。


    300 元一盒的产品，如果她真的能够卖出去 5000 盒，她绝不可能只收 15000 元，而是会采用佣金加提成的方式。


    这个要价，本身就是一个过滤器，驯的就是对直播抱有不切实际幻想的人的钱。


    在回过来说她的产品为什么卖不出去？


    因为她是用消费者的思维去做生意，把注意力完全聚焦在商品本身，而不是渠道。


    渠道永远比商品本身更值钱。


    哪怕是用消费者的思维，她也仅仅局限在小众的消费者的圈层，用自己的认知去揣测她完全不了解的人群。


    # 二、大多数的消费者，并不具备太深的专业知识


    什么药材分级的标准，她不说，我根本不知道饮料的原料，还要适用这个标准。我不知道，也就意味着 99.9%的消费者都不知道。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '大多数的消费者，买东西，一看价格，二看品牌，没了。绝对不会刨根究底地了解产品背后的东西。


    上个月，我就想买个舒服点的车开。去了雷克萨斯车行，销售不鸟我，然后我就直接去了保时捷，买了台卡宴。


    我不可能去丰田车行，因为丰田的定位是家庭车，不是豪华车。保时捷，我买得起，是豪华车，开着挺舒服，我就买了，就这么简单。


    我把定金付完之后，连“Porche”准确的发音都不知道，我之前都是把重音放到前面。


    我对这个车有什么了解呢？但不影响我买它。这个就是品牌。


    而建设品牌，是要烧钱的。


    保时捷在很长的时期，旗舰车就一个型号，就是 911。


    后来保时捷发现，他们的这款车，口碑确实是好，性能确实是牛，但不赚钱，因为研发费用太高了。


    所以后来才推出了卡宴、帕拉梅拉、马坎这些被保时捷的死忠粉认为 是背叛了保时捷传统的车型。


    但是这些车卖的很好，很赚钱，于是保时捷就用在这些车型上赚到的 钱，继续研发 911 车型。


    说会到我这位会员。她在没有烧钱做品牌建设的情况下，直接做出一个自认为质量很高的产品，幻想着通过一位不知名的主播，就能打开市场，这完全是在做白日梦。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '但现实的情况是，她没有钱，现在还做着一份全职的工作，一个月的工资，还不到 3000 元。


    她需要的，不是去做一个自己的品牌，而是先赚钱。


    为了能赚到钱，就要提升自己的销售能力。


    最简单的办法，就是看看她身边有哪些通过小成本甚至是零成本赚到钱的同龄人是怎么赚钱的，去向他们学习，模仿他们。


    创业，首先解决的是生存的问题，然后解决发展的问题，最后才是理想的问题。


    千万不要爬还没有学会，就直接学飞，那样不但会摔得肉疼，就连自信也会被摔碎的。'
  merge: -1
