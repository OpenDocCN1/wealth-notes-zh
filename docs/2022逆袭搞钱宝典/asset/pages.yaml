- pgno: 68
  md: '# 15 如何在线下维护客户？


    所有的生意，都要建立在某种程度的信任之上。


    所有社交类生意项目，线上的作用，更多是完成引流和种草，线下活动，在信任的建立上，有很大的作用。


    我把线下聚会，根据目的的不同，大致分为三类：


    # 产品分享


    # 创业沙龙


    # 休闲活动


    大多数人，都身就有着社交的需求的，人只能在与他人交往的过程中，才能更直观地得到来自他人的反馈，从够确认自身的价值。


    尤其是对于宝妈群体，平时除了孩子和家人，和社会的接触少，是有很强的聚会的意愿的。


    所以，聚会这种形式，具备天然的吸引力，先不管具体的内容如何，至少可以认识不同的人，听到不同的想法，给单调的生活，增加一些色彩。


    意向为什么要来参加产品分享会呢？


    除了能够满足他们社交的需求之外，更重要的，是要让他们感受到被关心。'
  merge: -1
  img_proc: true
- pgno: 69
  md: '我们分享产品的目的，是为了在各个方面帮助人，让他们的生活变得更好。举办产品分享会，就是为了能够给意向一个机会，去了解我们的产品，如何能够让他们得到更好的体验。


    产品分享，最好的方式，就是“下午茶”，准备的要点，恰恰是不要刻意准备。


    创业者为了能够把事情做起来，可以“反人性”，需要在一定程度上跨出心理舒适区。


    但是我们在对待潜在客户或者合作伙伴的时候，一定要顺应人性的规律。


    人只有在放松的状态下，才能更好地接收信息。


    所以，产品分享的氛围，至关重要。


    地可以选在自己家里，也可以外面咖啡厅，约上那些在朋友圈对你的产品感兴趣的朋友，喝喝茶，聊聊天。


    以介绍大美丽大健康类产品为例，不要一上来就聊产品做推销，要先聊生活，自然地过渡到产品。


    如果是我们熟悉的人，可以向对方询问你的状态：你觉得我最近皮肤/头发/指甲是不是比之前好了？接着过渡到介绍你使用的产品。


    如果是第一次见面，可以先赞美对方在容貌气质上的闪光点，夸她很懂得保养。接下来过渡到那些产品可以帮助她保持状态。'
  merge: -1
  img_proc: true
- pgno: 70
  md: '在试用的时候，要注意对比。例如说护肤品可以只涂抹一只手，或者半边脸，然后让体验者自己去描述使用这个产品的感受。


    如果你对产品相关的信息并不是那么熟悉，也不用怕，因为感觉大于语言。


    只要你的意向客户回忆起这次聚会，第一感觉是轻松愉快的，同时产品也确实有亮点的话，那么他就会把你，以及你介绍的产品和这种感觉绑定到一起，从而产生购买的欲望。


    分享经济的关键，是把客户转化成为产品的推广者。


    特斯拉汽车在中国的订单量，从 2021 年开始，一直告诉增长，除了性价比高，他们的销售模式，跟传统汽车品牌，也有很大的不同。


    当你走进特斯拉的车行的时候，迎接你的，并不是专职的销售人员，而是特斯拉的车主。特斯拉通过给车主人员优惠或者送实物的方式，激励他们进行契约式销售。


    这个例子，说明分享经济的销售理念，已经跳出互联网，撞进了传统商业的营销框架。


    从消费者到推广者的转变，有四个关键点：


    # 首先，消费者要对产品本身有较高的认可。


    这一点，我们已经靠线上种草、后续跟进以及线下产品分享会这几个步骤解决了。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 接下来，就是要有创业的愿望。


    这一点，可以从跟客户多次的沟通中得出判断。


    # 第三点，就是对介绍人的信任。


    # 第四点，就是对项目本身的信任。


    其实，最后两点，是一个问题，就是客户对你的信任到了哪个阶段？


    项目是你带给他的。你自己，就是项目形象的具体化。因为创业分享会的关键，就是建立参与者对你个人的信任。


    为了做到这点，讲故事的能力，就非常重要。通过你的形象、精神状态、语言、肢体动作所体现出来的，项目带给你的改变，比介绍项目本身，还重要。


    你要给参会者讲述你如何接触到这个项目、产品对你的生活，带来了哪些改变？项目在提升你的眼界、能力和财富方面，起到了怎样的作用？


    这就需要你在演讲的过程中，设计出能够与参会者相链接的点，让他们觉得：她描述的心理，不就是我当时的心态吗？既然她能进步，那么我也能！


    所以，讲述自己的故事，不是为了炫耀自己有多牛，因为这些信息，与他们无关。


    # 你需要做的，是用你的故事，来与听众产生共鸣，让他们产生代入感，让他们有信心成为你。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '实际上，所有加盟类的生意，餐饮也好、酒店也好，都是这样给加盟商信心的。


    创业沙龙，只有你一个人分享，不行，因为如果你已经做得很好，小白依然会产生距离感。


    你需要安排刚创业不久的分享者来讲述他们的故事，描述他们如何取得一点一滴的进步，这会让参会者觉得，成功是可以靠点滴来累积的。


    创业沙龙，也可以跟产品体验结合，方法参照前文。


    以上的两种聚会的形式，跟业务直接相关，但如果线下聚会的目的性都很明确，也容易给意向，甚至团队的推广者造成一定的心理压力。


    为了保持聚会的持续吸引力，我们需要不定期举行一些跟业务无关的活动，团队成员的家庭成员，也欢迎。


    爬山、散步、郊游、吃饭都是很好的方式。这样做的目的，是为了跟线下成员，建立业务关系之外的生活化联系，削弱交流的功利感，同时也能够给他们的家属一个了解团队的机会，用正面的形象，消除他们的顾虑。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 16 社群运营


    前不久，有一位读者跟我联系，她自己也是做自媒体的，全网大概有三万粉丝，面对的群体主要是青年女性，平时主要就是带带货，但是收入不是非常稳定，所以想要寻求更有效的变现途径。


    她的问题，在腰部博主，特别有代表性。腰部博主，一定不能走头部博主的路线。因为头部博主，也称为 KOL，有足够多的流量，所以靠广告、靠音浪就能养活自己，但是腰部主播，就那么几万，十几万粉丝，要说没业务，偶尔也有点，但是业务很不稳定。


    哪怕就是顶流的 KOL，例如优质内容领域的百万公众号博主，广告也越来越不好接了。一方面是因为各种博主多了，一个比一个能说、会写、会演，竞争大了。


    另外一方面，近年来经过国家对直播数据造假的调查和处理，很多商家现在已经没那么忽悠了，不像两三年前一样，愿意花大价钱找自媒体大 V 打广告。


    广告不好接了，知识付费的钱，也没那么好挣。


    # “花千金”的目的，就是为了买个“我愿意”。


    很多人分析知识付费的模式，都是从产品本身有用没用这个角度来的。


    这个方向，已经走偏了，因为有用没用，不是你旁观者来衡量的，是由付费的客户衡量的，他觉得有用，就有用，哪怕只是一厢情愿的感觉，只要人家愿意，你能怎么样？'
  merge: -1
  img_proc: true
- pgno: 74
  md: '知识付费，从商业模式上说，真正的问题，在于复购率。


    任何一个博主，都不是十项全能的，必然有他自己擅长的领域。


    做视频博主，就教你做视频；写文字的博主，就会教你写作；创业类的博主，就会跟你分享创业经验；投资类的博主，一般就是将一些股票基金的常识。一手资源微信2219344884


    厉害点的博主，一个人能横跨两三个领域，已经是非常牛了，而一开门课程学完之后，大多数人，其实是没有动力再学第二遍的。也就是说，大部分粉丝，一个领域，你只能在他们身上赚一次钱，三个领域，那就是三次钱，这就顶天了。


    这个模式要持续下去，就需要有持续不断地有新流量进来，而且流量的规模要相当大，才能够筛选出付费的用户，这对任何自媒体 up 主都提出了很高的要求，也就是你不但要持续输出，你还要不断有新的内容，能够给受众提供新的价值。


    所以，大 V 的压力也很大。如果仅靠广告和知识付费，很可能去年挣 500 万，今年就只能挣 100 万，明年考虑的就是能不能把运营成本赚起来的问题了。


    还有一种变现的方式，就是自己有品牌，有供应链，然后做销售。这种方式，其实跟跟帮别人带货的逻辑是一模一样，只不过自己有了供应链之后，产品的成本更低，销售利润高一点而已，一样避不开流量获取和复购率的问题。


    对于腰部 up 主，优势是有一定的 IP 和粉丝，但是新流量进入的速度不如大 v，要想提高变现的策略，唯一的出路，就是深耕高质量的粉丝，让粉丝因为跟你一起合作，把钱给挣了。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '如何实现？就是把粉丝培养成 KOC（关键意见消费者），同品牌方或者品牌方指定的平台合作，帮他们打市场。


    可能很多读者不知道，唯品会，早期的時候，是用类似微商招代理的方式做起来的。采用的就是利用社交关系，把销售团队裂变出去，然后迅速扩大平台知名度，占领市场。


    那么，“KOL”和“KOC”有什么区别？


    KOL， Key Opinion Leader,关键意见领袖。


    粉丝多，影响力大，能够帮助品牌方扩大影响力。新品牌喜欢用顶流 KOL 做直播，其实看重的并不是一场直播的销量，因为品牌方在这个过程中给到 KOL 的是最低价，根本没什么利润，加上坑位费，根本就是要亏钱。


    品牌方真正的目的，是为了借助直播这种形式，让 KOL 给自己的产品做广告，然后拿着几十秒的视频片段，投放出去，说明我这个产品是头部的网红都认可的，你放心买就是了。


    但是仅仅到这一步，也只是解决了知名度的问题，广大消费者也不一定会买单。


    真正让消费者买单的，是最贴近真实消费群体的 KOC，这群人，就是认识的，跟你关系比较近的这些人，他们真实使用的反馈，才是你下单的真正动力。


    张三喝了这个茶，确实瘦了；李四用了这个精华，皱纹确实少了。于是你也就没顾虑了。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '张三李四跟你的年龄差差不多，甚至比你的年龄还大。但是看起来比你还年轻，你气得过气不过？


    人是很容易受他人影响的。不要说护肤品和化妆品，很多人决定要买大件商品，例如说豪车，最直接地让他下决定掏钱的，大部分时候，是因为他认为的，跟他混得差不多的人，甚至比他混得还差的人买了他想买的车。


    他可以买，我为什么不能买？我比他差在哪里？


    所以，人对没有任何交集的陌生人的故事，会仅仅当成故事来看，但是只要之前有过任何联系，这个人生活中的但凡有任何值得注意的变化，你都会用来比照你自己。


    这种心理机制，你也可以说是人与人之间的影响力，也可以说成是 “Peer Pressure（同辈压力）”。


    你美了，我也要美！你瘦了，我也要瘦！你有钱了，我也要变有钱！


    底层的消费心理，加上互联网的模式，就造就了商家新的营销方式：KOL+KOC，既能够满足覆盖率和触达度，又能够深度种草，促成交易。


    对于腰部博主来说，社群+推广项目的方式，既可以满足粉丝的消费和创业的需求，也可以升华与粉丝的关系，把内容创作者和内容消费者的关系，变为创业合伙人的关系，有钱大家一起赚，这样的关系，才能长久。


    就拿我自己起来说，我当初做英语培训的时候，粉丝变现的模式，跟知识付费是一样的。一个粉丝变成我的学员，学完一门课，例如说雅思考'
  merge: -1
  img_proc: true
- pgno: 77
  md: '上了一定的分数，他就不会再来学了，我们的师生关系的存续期就很短，一两个月，最长的可能就是半年一年，结束之后，就没有然后了。


    但后来我做了渠道推广的项目，我之前的学生或者学生家长用了用产品，觉得产品确实还不错，做经销商还能拿折扣，分享还能赚点零花钱，于是就有一部分加入进来了。当然我前文也讲过，做英语培训的那部分学员，基本都导流给我太太了。但是其中的很多人，一两年了，还在平台消费，还在推广产品。


    这就说明，带着粉丝一起创业，就是会比提供一次性的，没有复购率的产品和服务更具备持续性。'
