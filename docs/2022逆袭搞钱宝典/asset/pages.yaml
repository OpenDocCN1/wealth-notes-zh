- pgno: 15
  md: '# 05 胆子大一点


    很多人写自己的创业故事，都喜欢把自己的格局和能力夸大。其实一个人的成长，是一个很漫长过程，会受到很多因素的影响。


    我今年 38，我觉得自己很年轻，人生才刚刚开始，可塑性很强。


    所以我希望看这本书的朋友们，尤其是二十出头的朋友们，如果对目前的生活不满意，不要过分焦虑，未来还很长，机会还很多，给自己一点时间成长，五年十年过后，你回过头看看自己的进步，你就会发现，你也很了不起。


    五六年前的我，其实也是一个有个工作很满足，甚至有些沾沾自喜，过分看重“稳定”，一点险都不愿冒的人。


    所以，今天我的关键词，是“胆子大一点”。


    理论上说，任何一种商业形态，都是有萌芽期、上升期、顶峰期、衰退期和消亡期的，机会最好的时期，是萌芽期和上升期。


    衰退期和消亡期其实很容易判断，但前三个时期，就不那么容易看出来，而且没有人知道各个阶段能持续多久，在所有人的认知水平都差不多的情况下，胆子大一点，就能克服大多数人克服不了的心理障碍，从而也更容易吃到红利。


    我是 2012 年底，在国内的时候就靠独立技术移民拿到澳洲的绿卡，但是我不敢去，因为我的思维，还停留在去一个地方，必定要有一个稳定的工作的阶段。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '2013 年初的时候，我被调到了深圳，在某跨国石油服务公司在蛇口赤湾的基地做基地经理，但是我不到 30 岁，工资、奖金和各种补助加起来，一年差不多能有
    40 万的收入。


    作为当时全国最年轻的基地经理，我兜里有钱、眼中有光，觉得自己前途无量。


    这种心理，造成了我在认知上的“隧道思维”：只能看到职场的发...完全看不到互联网社交化风潮带来的巨大机会。


    国内来说，我当时在宝能太古城租房，当时做微商赚钱的那一批人，已经开着跑车，住进了对面的“深圳湾 1 号”。但是当时的我，坚持认为，这些人并不真实存在，他们的财富，都只存在于“PS”当中。


    澳洲那边，我已经旅居在那边的澳洲同学那里，听说了代购的兴起。


    实际上，2012-2016 年这段时间，在澳洲做个体代购赚钱的容易程度，相当于插跟铁棒都开花。


    当时中国国内对海外商品，尤其是奶粉的需求强劲。同时，澳洲和中国相关部门还才刚刚注意到代购行业的兴起，所以监管还没跟上。由于中国消费者还没有从对国内商家的信任危机中走出来，国内的跨境电商平台，也还没有发展到明显抢占澳洲个体代购的程度。


    但是我胆子太小，我不敢去，我怕去了澳洲没工作，过苦日子，我也怕我一个外企中层管理，去了澳洲之后做体力工，面子上过不去。


    拿到绿卡之后的那一年，我把我所有的聪明才智，社交能力，都用在了为自己创造条件调到澳洲上。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '终于，在当时亚太区副总裁的帮助下，我于 2014 年底，被总公司调到了昆士兰州的一个边远小镇，离布里斯班有 500 公里。


    我当时的职位，是 OHS（健康环境与安全）顾问，职位级别和国内比起来降了两级，收入换成人民币，也就只比在国内多了 20 万。


    最大的问题，是小镇上只有七八千人，华人更是之后二十几个，所以对于跟中国相关的商机，我基本上是绝缘的。


    但是当时在澳洲的州府城市，悉尼墨尔本自不用说，只要是人口规模和配套稍微过得去点的城市，例如布里斯班、珀斯、阿德莱德，大量的华人通过代购，年入几十万，甚至上百万澳币。


    如果你是个体代购，当时基本上是在朋友圈发什么东西，就有人会买什么，甚至你不发，总有人追着你问，根本用不着开网店。


    当时在澳洲做代购的宝妈，在带着一两个孩子之余去超市买买货，去当物流公司寄货，一年挣个十万澳币以上，根本不难。


    如果你胆子再大一点，投入多一点，批量采购，甚至开到中国的物流公司，利润就更高了。一个物流公司，投资不用太大，十几、二十万澳元，自己出一半，从银行贷一半，买两辆二手面包车，和大的物流集团签订合同，借助他们的飞机或者集装箱，租一个仓库，准备一台叉车、雇佣几个拿度假打工（WHV）签证的员工，就可以开干了，代购高峰期，最多半年就回本。


    也就是说，我当初只要胆子稍微大一点，拿到绿卡马上走澳洲，去任何一个大中型城市，而不是在国内再磨蹭一年半，我就是做代购，也比我上班拿工资强不知道多少。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '还好，2015 年四月份，我得到一个升职的机会，被调到了珀斯，一个人口 200 万以上州府城市，接触到了一些华人，才发现原来挣钱的路子那么多。


    2016 年，公司进行结构调整，给了我两个选项：要么每周工作三天，相当于变相减工资，要么我直接辞职，公司给我一次性补偿。


    我选择了后者，拿着差不多四万澳元的补偿，离开了公司，我立志要像那些自己做生意的华人一样，闯出自己的一片天地。


    这是我人生最关键的一次选择，也是一次大胆的选择。但是没有它，就没有今天的我，没有今天的生活。


    接下来，我要跟大家分享下，我的每一分钱是怎么赚的，我在创业过程中的学到的经验，教训和收获的成长，希望可以与真实的创业者和想要创业的朋友，交流共勉。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 06 第一个“年入百万”


    大家从事的行业也许不同，但是商业的本质，是相通的，无非就是“趋势+逻辑+执行”。


    上一章，我提到了胆量，也提到了趋势。当澳洲代购以及相关业态处在上升阶段的时候，我由于胆量太小，错过了，但是我还是抓到了顶峰期的红利。


    在接下来的文字当中，我力求用最真实的执行经验和经过时间验证成功的逻辑，给大家呈现出普通人小成本创业领域一些普遍性的干货。


    2016 年底告别“打工人”生涯之后，我其实有过短暂的迷茫和不安。


    毕竟从之前的 8 年时间，我的主要收入，取决于供职的公司。当时的我，虽然有决心走一条新路，但有决心，不代表就可以天不怕地不怕。


    太太 Joice 非常支持我的决定，我们约定，用两年的时间进行生意上的尝试，如果不行，我们重新找工作。


    为什么是两年呢？因为我们算了一下，账户里所有的存款，加上澳洲政府针对失业人群或者低收入人群的补助，我们还能过上两年相对体面的生活。


    人可以失败，但不能后悔，我们必须要给自己的人生，一个机会。


    当时的我，除了大学三年级的时候，办过一个补习班，就再无任何其他经商的经验。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '但是经验这个东西，是很容易学的，要真正走出创业这一步，比经验更重要的，是理念。


    就好像一个人要学习拳击，就必须要上拳台。上台之后，他会被打，也会打到别人，但他需要那么一个瞬间，下决心面对未知，跳上拳台。


    当时面临的第一个问题，就是没有本钱，没有经验，怎么做生意？


    答案就是：找到你能撬动的消费者需求，用尽量小的成本和尽量低的风险，满足这些需求。


    我先后考虑过很多小生意，最后都被我一一排除了。


    汽车旅馆（Motel）的特许经营，动辄上百万澳元的投资，排除；鱼薯店，十万澳元级别的投入，排除；清洁生意加盟，几万澳元的投入，排除。


    最后就剩下代购。


    但是我和我太太当时对代购的收入潜力，并没有直观的印象，觉得应该是那种一个月可能挣个几百零花钱的小生意。


    直到有一次，同在珀斯的我的高中同学到我家做客，谈到她的代购生意，告诉我们认真做一做，挣个全工作的钱，没啥问题。


    当时她每周会发一张发货的照片，我就去她的朋友圈看她一个月发了多少货。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '我一数，才发现她平均每个月要发 160-180 个包裹，平均每个包裹能赚 30-50 澳元，一个月的利润 5000-9000 澳元。而且这个收入，是在她老公有全职工作，她自己还带着两个孩子的情况下取得的。


    我惊呆了。


    然后开始从商业项目的角度认真分析代购。


    代购生意，其实是近乎完美的低成本入门生意。


    它没有资金成本。先收钱，再买货。如果我收了钱，产品买不到，那好，我把钱退给你就好，垫钱是不可能垫钱的。


    它没有任何技术含量，上手常快，只需要发朋友圈、接单、买货和寄货就行了。


    代购产品的选择，是奶粉，刚需度高，消耗也快，所以现金流入速度快。


    最后，经营代购不需要整块的时间，不用坐班，灵活度相当高，每周只需要去超市要点统一采购两三次，再统一发货两次，就够了。


    于是我们在朋友圈正式宣布开始做代购。第一个月，我们挣了 1400 澳元，虽然不是太多，但是我们觉得还是有潜力的。


    第二个月，我们增加了代购产品的品类，增加了 UGG 鞋系列，并且在图片拍摄上更注意细节，增加朋友圈客户的购买欲望，那一个月，我们挣了 6000 澳元。


    第三个月，国内入冬了。我太太开始推销澳洲某皮草大衣品牌，那个月我们挣了 8000 多澳元。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '如果按照正常的个体代购经营的方式，这个收入，基本就没有太大的上升空间了。


    但生意的本质，是人，不管做任何的生意，都要想办法不断扩大消费者的数量，只要沿着这个思路去走，就会不断找到新路子。


    由于当时是代购的高峰期，国内大的电商平台虽然已经开始布局，但是国内消费者对它们的信任，还没有建立起来，所以澳洲代购利润足够大，我就想着可以把国内一部分想要赚钱的消费者变成我的经营者，我给他们一定的利润空间，让他们去扩展更多的客户。


    于是我们从以前的同学同事中，挑出几十名合作伙伴，一起把生意做大。这个动作，每个月为我增加了两三千澳元的额外收入。


    我们拓展的第二类客户，是珀斯本地有代购需求的留学生。


    代购做到第三个月的时候，我们的包裹量已经能够达到每周六七十个。在此之前，我们是去珀斯华人商业区的快递代收点去寄货。在去寄货的时候，我们发现，有不少的留学生也在那边打包产品。


    当时我就想，我的包裹量也不小，是不是可以了与快递公司直接合作，在我家里面设置一个收货点？


    于是，我联络了珀斯几家比较有名的对华物流供应商。最开始几家，都不接受在居民区设置收货点。唯独有一家刚成立一年多的快递公司为了扩展业务，同意了在我家设置收货点。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '有了这个资格，我就开始在网上做宣传。当时在珀斯有那种同城的微信广告号，非常便宜的价格就能够把你的服务广告和微信二维码一同放上去。


    我们主打的，就是代发服务。由于快递收货点的邮寄费用会叠散客要低一些，所以我们可以在这中间赚一些差价，而且留学生平时要上课所以时间也不多，我们在平时采购的时候可以帮助他们代买，然后帮助他们打包，每个包裹收
    1 澳元的打包费，加上运费的差价，一个包裹我们就可以赚 4-5 澳元。


    收费虽然不多，但是架不住数量大。因此在这项业务上，我们每个月又能够增加一两千澳元的收入。


    值得一提的是，在这个过程中，我们并没有增加其他额外的成本。当时其实我们住的地方就是一个租来的公寓，所有的打包在客厅和餐厅就完成了。


    从 2018 年 1 月份开始，我们在代购上每个月的收入就能够稳定在 1500 澳元左右，折合人民币 60000 元。


    当时在澳洲做代购的华人，每个月的平均收益，大概是 500-800 澳元。同样的时期，同样的生意，我之所以能做到平均水平十倍以上的收入，就是因为我不断寻找新机会，新的增长点，有了想法，就去执行，仅此而已。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 07 及时转型


    但是在“稳定”的代购收入背后，我也嗅到了危机的气息。


    当时我们的代发服务能够存在的前提是，珀斯当时提供此类服务的商家太少，远远不能满足代购的需求。


    我们明显感觉到从 2017 年 6 月份开始，找我们代发的留学生就越来越少了，因为他们可以在大的代购店那里得到更及时更便宜的服务。


    这件事情给了我一个启发，就是任何的生意，除了有周期，还有竞争。


    你要么比别人做的早，要么比别人做的好，要么比别人成本低，要么比别人有特色，要么你就...力差断。


    如果这几点你都做不到，那么你在竞争当中，就会越来越没有优势。如果想要寻求新的突破，就只能开辟别的赛道。


    这一条规律，夫妻店适用，千亿市值的大公司也一样适用。


    每一个商业机会的衰退，当事人，是绝对有感知的，问题的出现本身不可怕，暂时找不到突破口也不可怕，最可怕的，是掩耳盗铃，觉得事情会自然而然好起来。


    2017 年 3 月份的时候，我们发现，即使卖的最好的奶粉订单的数量也在明显的减少。


    一方面是因为大量的澳洲华人已经看到了代购的商机，参与到“代购大军”中来，把价格压得越来越低。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '另外一方面，随着国家监管力度越来越大，国内消费者对跨境电商平台的信任感越来越强，我预感到代购的红利将会在接下来几个月褪去。


    同时，代购这个项目，并不需要花太多的时间，而且基本上我太太一个人就可以做完 90%的工作。我的主要工作就是开车和打包，所以我开始筹划第二个小成本的生意。


    代购这个生意，让我的家庭收入，达到 60-70 万人民币。接下来，我给大家讲讲我的第二个生意，英语培训。


    但是因为大的电商平台的崛起，个体代购的客户，正在被一步步抢占，是时候寻找第二个项目了。


    再恢弘创业史，第一笔的买卖，一定是“生存”。


    很多现在知名的企业，在刚成立的时候，完全想不到会发展成现在的样子。


    三星的第一家店，是卖鱼干的，和电子产品八竿子打不着；兰博基尼，最早是做拖拉机的，跟“高大上”完全不沾边。


    只有先存活下来，才能在将来，有机会蜕变。


    所以，在创业初期，为了活下来，在适当的时候变换项目，是非常正常的。


    有的创业者，第一个项目没有成功，或者没有达到理想的收益，就得出结论，自己不适合创业。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '实际上，创业就像拉力赛，而项目，只是赛道上的不同型号的车辆而已，不要因为一辆车跑得慢，甚至坏掉了，就中途弃赛。


    收获，属于坚持到最后的人。


    下面具体给大家讲一讲，我第一个年入百万的第二个项目构成：英语培训。


    之所以考虑做这个项目，有以下几方面的原因：


    首先，华人家长，不管在哪个国家，都很重视教育，不管是出国也好，考研也好，K12 也好，英语都是一个非常重要的科目。甚至很多家长自己，也有提高英语的需求，需求是有的。


    当时，整个教培行业，还处于蓬勃发展的阶段，现在回想起来，恍如隔世。


    其实，我对这个行业，其实并不陌生，因为我有英语培训的经验。


    早在 2007 年，我大学三年级的时候，我就在学校附近的居民区开了一个培训学校，当然是“地下”的那种，没有任何办学资质，招生是在小区的公告栏上贴广告，上面是招生信息，下面是写上我手机号码的纸条。老师的招聘启事也是我在附近几所大学的公告栏上贴的。


    小区门口的一套简易桌椅和一个易拉宝，就构成了我的“招生办公室”。


    最后，互联网的发展，已经完全能够支撑线上英语培训业务，可以低成本地实现引流、转化、教学和学员的后续跟踪服务。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '给我启发最大的，是新东方艾力老师。当时他做了一个早起读英语打卡的群，利用社群销售课程，出书，商业变现非常成功。


    我就想：我大学学的是英语翻译，我英语也很不错，也可以上网，他能通过教英语挣钱，为什么我不可以呢？


    我再给大家分享一个创业的策略：


    **找到一个你能模仿的，成本最低的生意模式，研究它，在市场环境没有根本性变化的前提下，去行动。如果 TA 能赚到钱，大概率，你也能赚到钱。**


    英语学习，是长期的需求，我正好是英语翻译专业毕业，英语发音也相对准确，可行性非常高。


    于是，我就模仿艾力的做法，也做了一个免费英语学习群。第一批群友，是我朋友圈的朋友，其中包括很多代购的客户，甚至在澳洲的留学生和很多孩子，也加入进来。'
  merge: -1
  img_proc: true
- pgno: 28
  md: '每天我都会在群里分享一个的简单的英语教学内容，对学生的发音进行点评。2017 年 3 月建群，到 6 月份，就已经有四个群了，接近 2000


    为了吸引外部流量，我在微博和 CCtalk 也开始发布免费的英语教学视频课程以及直播公开课，同时在珀斯同城的微信推广号上打广告。


    最开始的两个月，我没有招到一个付费的学生。直到五月份，我才有了第一位学生，是一位珀斯的访问学者，她想要提高口语。


    我根据她的情况，为她设计了教学方案，上课的平台，就是微信语音。当时的价格，是 20 澳元一个小时。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '有了第一个付费的学生，也就意味着有了广告宣传的素材。我把学员反馈发到朋友圈，微博上，同时随着我在公域网络发布的内容越来越多，微信之外，也有学生找我学英语。


    随着口碑越来越好，我的课时费，也从 20 澳元一个小时，涨到了 60-80 澳元一个小时，学员不仅来自国内，还有在澳洲上学的华裔中小学生和留学生。


    到 2017 年底，我已经忙不过来了，高峰时期，每周接近 30 节课，我个人的时间和精力，已经没有潜力可挖了。


    ![](img/23a01d83bcb4e49ef80138fea59b1887_29_0.png)


    （备注一周的课表，这上面只是教学时间，还不包括备课）


    于是我做了两件事情：第一，开始招募澳洲本地的英语老师分担教学任务，第二就是开始筹划小班，在我家客厅进行一对多小班教学，小班的对象，是在澳洲生活的华人。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '他们中的很多人，由于英语基础较差，去上纯英语的教学课，根本跟不上，而我既能够交给他们澳洲日常生活中使用频率最高的用语，又能够用中文给他们解释，确保他们能够听懂，这又是一个满足细分市场需求的例子。


    到 2018 年初，同时在册的学生，有 100 多名，高峰期的月收入，除去老师的提成，能到 4 万人民币。


    ![](img/23a01d83bcb4e49ef80138fea59b1887_30_0.png)


    （备注：我家客厅里的小班课，学生坐的椅子，5 澳元一把）


    这个过程中，还有一个意外的收获，就是一名国内教辅机构的部门负责人通过微博找到我，跟我合作英语范文写作。


    代购+英语培训+范文写作，这三个项目，让我的家庭收入，在 2017 年，第一次超过了 100 万。


    但是，我在 2018 年 10 月，完全放弃了英语培训业务。下一篇，给大家讲为什么。'
