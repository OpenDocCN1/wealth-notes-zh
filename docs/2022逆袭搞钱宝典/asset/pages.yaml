- pgno: 52
  md: '# 12 如何做私域？


    这一章，我来谈谈如何把从公域网络平台进入微信的流量，转化为我们的消费者甚至是生意伙伴。


    进入私域的流量，无论年龄、职业和学历，有一个基本的特点：


    他们对我，或者是我提到的产品/项目是有兴趣的。


    但是这种“兴趣”，不一定完全是正面的，也有人是过来“打假”的，就是觉得我在网上发布自己的内容不真实。


    这类读者，偶尔也会遇到一两个。我也不会花太多时间解释，因为纯粹是浪费时间。


    而大多数的读者和粉丝，是抱着一种好奇和观望的态度来的。


    如何把这些热情的人，转化成为信任我的人，这是一个私域转化的关键。


    办法也很简单，就是写文案。


    朋友圈发照片是很常见的展示方式，但是百分之九十九的人都不大喜欢写文案，因为怕麻烦，这也就是为什么百分之九十九的人在朋友圈赚不到钱的原因。


    基本上大家做一个项目，你不愿意做的事情，就是会把你卡在那里的事情，但是大家都不愿意做的事情你做了，你就脱颖而出了。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '![](img/23a01d83bcb4e49ef80138fea59b1887_53_0.png)


    我最早意识到演讲能力的重要性，是在高中的时候看到俞敏洪早期的演讲。他在讲台上表现出来的那种热情和真诚，感染了我。我意识到，演讲能力，在一项必不可少的技能，将来到社会上，会派上大用场。


    而我是一个比较内向的人。为了克服这个缺点，上大学之后，任何能够登台的比赛，我都会参加。


    刚开始的时候，有的比赛，我甚至连海选都进不了，紧张到一站到评委面前，我就反胃。通过反复的锻炼，大学毕业之后，我已经拿过无数的语言类的奖项。


    演讲能力，使我在上班时比一般同事更快升职，在后来创业的过程中，更好地传达我的想法，把自己销售出去。


    这就是为什么在过去的一年多，我靠在网上写文章，引流到 WX，就把几十名完全陌生的人转化为品牌推广合伙人。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '从 2018 年 10 月开始，我每天在各种平台平均的文字输出量，是 5000 字以上。


    任何人，任何生意，想要依靠朋友圈赚钱，第一步就是要丰富内容。


    因为信任的前提，是要被人看到，发圈数量不够，别人根本注意不到你的存在，自然也没有机会接触到你传递的信息。


    但是，丰富朋友圈，不代表狂发广告，营销号，没有价值。


    为什么电视台播放的剧集中间会插播广告？因为如果只播放广告，你不可能会看电视，正是为了让你能够在不注意的时候，看两眼广告，通过多次的印象，记住品牌的名称。


    同样的道理，你的朋友圈，也要有可读性，要像经营一本杂志一样去经营。


    人生感悟、生活状态、创业心得、试试评论都可以发。这样就可以帮助好友全方位地了解我们，增加信任感。


    在朋友圈只要帮助陌生人回答两个关键问题，就可以实现把微信好友转化成为消费者或者合作伙伴：


    问题 1：这个人是谁？我为什么要信他？


    回答：我是 XXX，我是一个积极健康而且靠谱的人，我很真诚，我经常把我朴素的想法发表出来，理念上我跟你是一类人。'
