- pgno: 47
  md: '这些确实都需要，但没有必要在起步阶段就全都准备好，而且你也不可能准备好。


    # 因为一个高质量的 IP，是生长出来的，不是策划出来的。


    只要做到持续输出，你自然知道你自己适合讲哪方面的内容，因为你不熟悉的领域，你也讲不了。


