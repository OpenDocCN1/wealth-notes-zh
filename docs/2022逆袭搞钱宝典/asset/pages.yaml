- pgno: 49
  md: '当你的经历更丰富之后，你就可以渐渐地利用个人的经历和经验，代替外部材料，从而创造出带有强烈个人风格的内容。


    在创作内容的过程中，一定要特别关注观众和读者的反馈，经常进行内容复盘：


    在大的话题领域，那些细分的方向是大家更爱关注的？你怎么说大家更容易接受？你只要边做边调整，自然就会知道文本怎么写，如果是视频，拍摄的时候有哪些需要注意的地方。


    罗永浩 2020 年初刚开始做直播的时候，被很多所谓台认为很懂的人嘲，说他连基本的直播技巧都不懂。这都快一年了，人家在直播界，已经坐稳了顶流。


    别人问他有什么秘诀，他斩钉截铁说了四个字：


    “就 TM 卖


    内容输出，其实就是一个不断试错的过程，你只有去试了，你才知道哪些东西行得通，哪些东西行不通。


    拍视频的，你没有拍上几百条，写文字的，你没有写个上几十万字，没资格说什什么技巧。


    接下来一个问题，如何选择发布平台？


    答案很简单：到处发！


    同样的内容，有的网站上大家反响很热烈，去另外一些网站，可能就没人理你，但是你不用管，反正就是个复制粘贴的事情，发就是了。发得'
