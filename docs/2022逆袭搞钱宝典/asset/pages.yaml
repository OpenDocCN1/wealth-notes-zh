  md: '这当中大多数的平台是纯粹的分销平台，产品的特点是已经被消费者熟知的品牌，采取的策略是低价加补贴。


    这类平台在 2020 年的生存极度艰难，因为他们和拼多多，淘宝，京东等平台是一条赛道，基本上是 100 家就倒掉 99 家。


    无论是流量，供应链，资金还是知名度，新兴平台都很难与头部企业抗衡。


    # 新平台要生存下来，必须要开辟新的赛道。


    利用社交媒体的覆盖度和粘性，加上经销商的个人影响力，独家代理并推广国外的<|message|>G小众优质品牌，是提高利润率，增加品牌方对经销商依赖度的优势策略。


    但是仅仅把经销商当成是转发机器的纯分销平台，一旦一个品牌被推火，由于没有独家代理权，被马上被头部企业更强势的低价策略，把消费者给抢走，这就是澳洲的个体代购越来越难做的根本原因，我现在基本已经退出这个行业。


    新零售时代，是一个将普通人创业门槛降到无限低，同时将收益放到无限大的时代。如果想要充分享受时代红利，必须要在两方面下功夫：


    提高 IP 打造能力，我们需要在朋友圈以及其他的网络平台，做好定位，持续输出内容，链接同频者；刻意练习语言表达能力，写作能力，演讲能力等；提高销售能力和社群运营能力。


    同时选择并专注于能够走得长远的优质项目，把项目相关的方方面面都研究透彻，做到行业顶部，不可能挣不到钱。'
