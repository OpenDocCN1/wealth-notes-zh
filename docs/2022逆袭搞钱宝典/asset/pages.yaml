- pgno: 51
  md: '到这些地方引流，有一个前提，就是你一定要有机会输出你的观点，与其他学员互动。本质上其实是一个价值展示的过程，也就是你表达的内容，你的同学里面要有人感兴趣，你说的道理，要有人认可，有人愿意跟你链接。


    如果没有任何特色和一定的实力背书，而且表达能力也不太好，付费课程和社群，也许不是一个很好的引流途径。


    以上是引流的一些基本的策略和方法论，今后有机会可以给大家进行更详细的拆解。


