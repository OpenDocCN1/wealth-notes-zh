    一定要明白这样一句话："有道无术，术尚可求，有术无道，止于术"。


    案例=术；道=背后的本质规律，思维。为了更好的学习【布局思维】之【焦点思维】，其实在我们身边有这样一个跑白金创始人，一直在用我们的焦点思维。


