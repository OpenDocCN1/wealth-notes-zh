  md: '# 卧龙营销咨询：《布局系统》速成班内容


    我们在给一家企业做线上推广宣传过程中，也做过很多这样的测试，我们发现，在某文章下画框评论，发现效果显著，而后我们做的就是，通过几个文案，一家不同的QQ,微信，测试，那个留言文案更有吸引力，让精准粉更多进来，而其中一个我们自己都看了挺心动的，这个效果非常好。是之前发一个文案的好几倍。


    而后，我们招募更多刷手，天天留这种评论，那ossz直接这个网站全部都是我们的留言，被我们给全面覆盖了。


