  md: '# 阳龙营销咨询：《布局系统》速成班内容


    周五：布局分享


    好了，在开始课程之前，昨天有个企业家朋友说。最近在群里学习比较累，建议可以中场休息，或者一次只讲解1-2个点。被我否决了。


    因为我们本周只有7天的课程，大家辛苦一点，我总结几十年的策划思维，如果你能消化了。那么会非常有用。


    所以，尽可能给大家讲清楚，尽量多讲解一些干货。——以保证我们的学习效果。


    如果你不是很了解，不是很懂。有很多上市公司老总，以及企业家，都偷偷打印了一份。然后自己当书来看。


    预计年底，我们《布局系统》这本书会真正出版，如果你有心，可以保持关注。


    好了，继续我们今天的布局思维分享。


    首先我们简单复习一下前几天的内容：


    +   焦点思维解决破局问题，和布局问题；

    换位思维解决同频问题；

    方程式思维解决框架问题；


    目标——同频——框架；


    因为一个目标，需要框架，需要流程，需要换位思考，而今天我们讲解更为重要的【层次思维】也可以划分为框架思维中的节点框架。


    +   焦点思维：解决破局问题：如何定局，破局问题。

    换位思维：解决同频问题

    方程式思维：解决框架问题

    层次思维：解决流程问题（流程节点=节点框架）


    学会了层次思维，今天我们设计套路的能力，和布局的能力至少可以上升一个层次。


    # 【层次思维】思考点的几个思考原则：


    +   1、必须要有点点（节点框架）


    常用节点框架：前-中-后；底-中-高；小一 大；……前—中—后；


    在营销布局中，常用节点。

    售前——售中——售后；'
