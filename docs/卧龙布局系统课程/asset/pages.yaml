  md: '# 卧龙君销售咨询：《布局系统》速成班内容


    人们从来不会认为“价值”太高了。

    人们只会认为“价格”太高了。


    价格＝风险。      价值＝好处；

    好处越大，越没有风险，当然就会有一大批人抢着做这件事情。因为人性趋利避害。


    正因为，会赚钱的人（或者说“会为他人创造更多好处的人”）都是懂得如何利用“价格杠杆”的人。


    所以，“免费”就把人们风险一次性降到最小，为零了……那么，你当然就更容易获得顾客，更容易让人们掏钱。（零风险，几乎没有风险了）


    在这里请注意，“免费”不是指“不要钱，白送”，而是指“先让人尽快地先得到，体验好处”，这样人们体验到你产品的价值，好处了，当然更愿意“回报”你！也就是说“买更多”。


    真正的收入，来源于“第二轮销售”——你难道没有听说过吗？

    真正的利润，来源于“已购买过的老顾客”——你难道不了解吗？


    营销永远不是赚一次合作，而是先让一大批人进来，然后进行第二轮，n轮，是终身合作伙伴。李嘉诚85%生意，来自转介绍，懂了就懂了……一定要懂得客户终身价值的培养。


    所谓一次销售，要么是骗子。      要么是销售，推销。      而且获取新客户的成本相对较高。无论是招商，还是营销，还是恋爱，各种交易，都是如此。


    尽可能让他/她/它 没有任何风险，假如有风险一定要让好处>风险。


    对于换位，有4个维度；换位思维 4个思考维度


    +   1. 时间（过去-现在-未来；）这个思考维度，是指出时间不对称。


    不论是营销中，还是商业战场中，都是占据时间差就是王者。时间差决定信息差，信息差决定财富差。


    任何一个行业都具有时间性：雏形期——成长期——稳定期——成熟期——衰退期。

    任何一个人的心智，脑袋里都有这样一个时间概念：过去——现在——未来；

    做任何生意：一定要懂得，挖掘过去的痛处，伤害，恐惧。过去的疑惑，困难，ui虑，问题等。


    简单讲，每个人都喜欢回忆，比如我们要卖一款保健品。    延时性爱的。


    比如：我们怎么几句话？'
