  md: "# 卧龙营销咨询：《布局系统》速成班内容\n\n所以，在我们设计营销方案的时候，首先要明白，我们提升的目标是什么。\n\n有人脑子一热就说：我要提升利润，提升客户量。\n\
    如果我们要提升客户量，什么动作都不要做，我们恨尽一切办法，看到底有哪些方法可以提升客户量？\n\n能不能找出 ск来？ 客户从哪里来？ 无非线上+线下。\n\
