  md: '现在，我根本不看香港电视剧了，看不懂，不好玩。东南亚的年轻一代估计也不看了。而内地十三亿人口，花三个亿拍个电视剧，完全没问题。


    任何一种新发明，新产品，新工具，只要质量中上，符合国人习惯，单靠内地市场就可以做到世界第一。例如网购，微信支付，快递，高铁，今后的电动轿车，共享经济。这是其他国家无法比拟的，甚至是无法参与竞争的。假设你做出了一条超级受欢迎的花裙子，花传媒，卖出去几十万条是完全可能的，而在欧美国家，一个女式超级爆款也就是500-1000条的量（某外国设计师的原话）。这就导致了外国无法法和中国的经济体量竞争。


    近年来，消除贫困工作，稳步推进。安徽山区的农民家庭，一般都带有几万美元。西北的边郊农民，买车住别墅的，比比皆是。消除贫困的最大好处是，人人都有消费得起一般商品。这就创造了无限大的市场。


    当然，中国经济也有一些隐忧：


    +   一是企业负担沉重，抑制了创业热情。


    企业负担主要增长点是，强行给企业职工增加福利，这是好事。


    但是，企业利润没有同步跟上，其他税费并没有下降，单早要求企业主封肉，为职工福利买单加工资，这就抑制了投资热情。


    因为资本是必须有回报率的，当回报率和风险不成比例的时候，创业就消失了。


    +   二是居民生活成本太高。


    医疗教育系统对一般居民的收割，实在是太狠了。


    现在去住院，一个简单感冒咳嗽，可以搞出几百上千元的检查费中药费，还有一套振振有词的道理，嗯，医生是为你好。


    教育也是这样，人为搞出了各种转校费赞助费补课费之类的，学校对家长还要考试，老师对家长使劲敲样子，报纸上刊登的各种劣质手段，令人瞠目结舌，家长敢怒不敢言。


    +   三是住矛盾。


    各大城市明的暗的，采取各种手段，故意吸引外地大学生来就业交社保，直接推涨本地房价，引发各种家庭矛盾，例如媳妇要加名字。（省略一千字）


