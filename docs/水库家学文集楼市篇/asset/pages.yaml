  md: '无数心血凝聚，如果他们成功了，通过加税，找个借口惩罚他，强行抹平，一开始是很解气，但时间长了，很多人也就不愿意吃香喝劲了。等他发财了，我们分了他的深圳就好，我干什么要这么辛苦？你看，我不是很聪明？


