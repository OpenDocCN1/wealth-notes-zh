    答：我有这样一个房子，再也不想进去了。风大到略暗的衣服直接吹湿，门缝是呼呼啦啦的声音，房间超级潮湿，棉被发霉，西装发霉，一天到晚，身上汗闷，衣服湿漉漉的。


    # 现在的大方向是稳房价等


    土地增值税不是新事物，只和房地产业有关，和个人住房，目前无交。现在的大方向是稳房价等。


