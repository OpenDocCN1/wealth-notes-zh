  md: '如果没有房地产市场，单位发房子，家家户户拿着一百万、几十万的消费，会造成几个后果：


    +   1. 很多人不愿意好好上班了。特别是民企小厂。我都有几十万，上百万了，干一辈子也不过如此，何必那么辛苦的背井离乡，加班加点呢？


    +   2. 愿意努力工作的人少了，招工难。工资快速上涨，生产量逐步减少。花钱的人多，生产的人少，物价越来越高。通货膨胀就来了。


    +   3. 通货膨胀有自我加速的规律。因为一旦出现大的通货膨胀，大家都会拼命囤积货物，抢购，进一步引发加速通胀。所以，普通人手里有太多的钱，就必须给他一个出路。


