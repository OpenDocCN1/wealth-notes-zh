    # 散户炒股，都是韭菜


    股市暴跌造成的金融风险，远远不是股民亏点钱那种小事情了。


    # 一，单个公司


    A 股上市公司的创始人和大股东，经常会把自几的股权拿到银行抵押贷款。例如前段时间，严守一老师喷的那个电影公司老板，把自己手里桑接近 100% 的股，全部拿到银行去抵押了，还发了公告。


    股价有波动，一旦暴跌，卖都卖不掉。银行是非常谨慎的。举例（不当真），你去贷款 5 亿，你手里的股票市场价 10 亿，银行会和你签一个合同。这些股票归银行控制，如果股票下跌
    30%，你必须 3 天内增加新的抵押。如果下跌 40%，银行立即抛售，不和你打招呼。银行绝对不可能等到股票只剩下不到 6 个亿的时候才去卖，因为银行贷给你
    5 个亿，有利息，你最后的还款可能是 5.4 个亿。银行若是卡在最后的点去抛，往往是抛不掉的，银行必然是提前抛售。


    这种情况还算是好的，至少大股东并没有违约。


    如果股价下跌过快，银行根本抛不掉，最后只卖出了四个亿，那大股东就失去公司控制权，个人直接破产，公司也借不到其他银行的钱了。


    # 二，集体抛售的问题


    上市公司老老板自几的股权去抵押贷款，绝不是个例，是很多的正常情况。如果某一股票下跌，其他股票全是在上涨，或者价格平稳，那么，倒霉的就是那一个公司。如果集体大盘出现了严重暴跌，会有大量的公司股权被抵押的银行抛售。本来股市就在暴跌，银行火上浇油，大量抛售，会把股价砸的稀巴烂。这就叫“闪崩”。


    # 三，系统性风险的传染


    2015 年，很多人拿股票去抵押借钱，最后根本抛不掉，欠的钱根本也还不了，对公司的控制权也丢失了。


