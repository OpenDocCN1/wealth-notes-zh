    +   1. 税利，土地款。


    +   2. 融资利息。


    +   3. 工资。原材料也是其他工厂工人的工资堆起来的。设计院员工劳务成本，建筑队的工资。


    +   4. 开发商利润，两年周期合计12%，再低不如存银行了。如果开发商是毛白旁，你家房屋的质量，你敢住吗？


