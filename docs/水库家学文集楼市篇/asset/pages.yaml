    # 东北家里平常都是一两个菜而已


    没有觉得寒酸。我父母也不是那种愿意一顿饭做好几个菜的人。西南地区（云贵川渝）反而是一顿饭要几个菜加一个汤，才算正经。


    答：不仅仅是东北，北京也是这样的。下庄路上买 5 个肉夹馍，电饭烧煮点小米粥，脆瓜拍黄瓜，这还算是中产了。上海本地人，两荤两素一海鲜，再加个番茄花荡汤或冬瓜汤，现炒现吃，吃剩下的全部倒掉。


    # 一省双雄，谁主沉浮（2018.06）


    中国沿海省都是一省两特大。大连和沈阳，济南和青岛，南京和苏州，宁波和杭州，福州和厦门，广州和深圳，南宁和柳州。天津和保定是分散了不算。


    这个是近代沿海贸易引发的历史问题。在改革开放初期，大力推进市场经营，都是省会强于省会，但是，省会调动全省资源的的力量太强大，了，今后可能是比翼齐飞。


    杭州已经明显超过宁波，南京和苏州基本差不多了。其他几个省会，我相信很快会超过兄弟市。


    # 上海会限外牌吗？


    上海不会参考北京的做法，限外牌进入外环线？（一家之言，仅供参考）


    答：上海大部分就业在外环内，高薪岗位集中在外环内，如果上海限制外牌进入外环线，直接的后果就是，你必须先有上海车牌，你才能到距离工作单位比较远的地方买房，最好不要跨区买房。现在，上海车牌中标率差不多是
    4%。北京是 1%o。


    任何经济变化都不是单一因素的。外牌可以进入上海市区，很多人就不买上海车牌了。如果限制外牌进入市区，中签率会急剧下降。北京的中签率已经最高降低到 1/1900，可能你一辈子可能也拍不到。


    北京的外来人口和上海差不多，大致是八百万，外牌常驻北京的机动车有 70 万辆，估计上海类似。上海每年的新增牌照是 10 万个左右。外牌如果全部换为上海牌照，再加上上海的正常需求，'
