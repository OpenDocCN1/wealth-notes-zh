    # “管家”一边催退租一边带新客


    澎湃新闻：【自如甲醛超标多位租客生病，“管家”一边催退租一边带新客】标榜品质租房的自如，却将刚装修好的房子迅速出租，导致房屋甲醛超标等问题屡禁不止，租客们出现了头晕、皮肤过敏、喉咙肿痛等现象。


    主张退租的租客，即便是拿到了机构出具的检测报告，仍要为甲醛超标的房子正常支付房租，医药费等很难得到补偿。租客提出退还全部租金的要求遭到拒绝，自如只答应退还未发生的租金。工作人员还略带“威胁”地表示，一天不退房，产生的租金和服务费就要增加一天。


    经媒体、工商部门的介入，自如同意退还全额租金，但要求签订一份带有“封口性质”的和解协议。而旧房客还没搬走，管家就迫不及待地带新的租客前去看房了。


    柴桑：若进入寡头时代，你还能够怎样？


    # 京沪人群里最大的渴望还是


    房子，房子，房子。

    为什么不是扩大供应呢？十万不够，那就五十万管。

    背后的原因，我们都懂，看破不说破，还是好朋友。

    嗯，你慢慢等降价吧！


    # 中国最大的内需还是房子


    大中城市的房子。

    现在的问题是，尽快扩大供应，搞活经济，而不是压制需求，冻结市场。


    # 京沪房价下跌的最主要原因


    不让你买了。

    需求一晚上升街，自然会产生观望情绪，95 折是很正常的。换句话语，限购和摇号政策必须长期坚持，不能松，一松就会强烈反扑回弹。


    现在除了房子，还有什么靠谱的保值手段？很多人买房不是为了牟利，而是为了攒养老金。等我二十五年后退休，现在的钱还值现在的钱吗？十年前潘加一块或八毛，现在六块七块了。我妈已经气的无语了，这又怎么样？认了呗！


    2020 年，京沪将有一大批新人符合限购资格，即将下场争夺房源了。如果不能加快建设，到时候，烈焰红唇，房价可想而知了。


    建议：


    +   1. 大城市要利用好现在的过建期，大力建设房源，切实保障供应。

    2. 通过统计学技巧解决问题，只是过建措施，我们既要治标，也要治本。'
