    # **多买一套房可以避免很多家庭矛盾**


    我们家以前也有大房子，但十年前的别墅，再好也就是农民房的感觉。这次，丈母娘买了一套上档次的外地别墅，干挂石材，大品牌商的，看上去和欧洲别墅差不多。丈母娘非常喜欢，于是就按照自己的想法设计装修方案，准备搞豪华欧式风格。


