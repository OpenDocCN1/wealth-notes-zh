  md: '# 怎么赚钱？


    +   1. 选择有一定社会需求，入门门槛极高的项目。要么是高资金，起步500万以上的投入，要么是刻苦练习5-10年才能达到的技术。

    2. 寻找销售网络。这个是考验天赋和悟商的。


    # 出国已经没有经济学意义了


    80年代中后期，日本工资是上海的100倍，现在是1.5倍。

    实事求是讲，出国已经没有任何经济学意义了。


    # 现在的经济两难局面


    京沪广深，经济条件最好，就业率最高，工资最高。类似长春，驻马店，遂宁这种地方，经济结构单一，就业弹性不足，没关系的年轻人很难找到月入八千或一万的岗位。怎么办？


    一是让小镇年轻人自由流动到高收入地区，实现收入翻翻，但会刺激京沪房价飞起来。


    二是采取明目的堵的办法，不鼓励年轻人去京沪广深，降低京沪住房需求，压住京沪房价。但年轻人在小地方趴窝，收入上不去，也难啊。


    三是加快建设区域性中心城市，例如武汉，成渝，太原，沈阳。但这是慢功夫，至少二十年的周期，年轻人等不下了。举个例子，上海的一南一北分别是宝钢和金山石化，超级特大企业啊，但搞了三十年了，至多是市区的六七成水平，这说明人为的形成区域中心，是非常慢的。


    今后，经济格局会怎么走向？你自己下注了。


    # 如何牺牲一代人，融入新城市？


    现在的京沪市区房价，已经高到了只有土豪买得起程度了。


    正常人拼了命也就是去外环线外买套一百平米漂亮公寓。


    配套不行，交通不便，四周荒疏，兼卡横行。


    但二十年后，这些地方就起来了，你的下一代就享受红利了。


    这和种树是一样的，上一代人的努力成就了下一代人安逸。


    不要老说没背景，屌丝都是很自私，自己不愿意牺牲，只会鸡贼占便宜，你再过十代还是屌丝家庭。


