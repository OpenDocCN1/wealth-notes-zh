    # 离开京沪，基本没有好结尾


    京沪规律。


    不论什么原因，离开京沪的人，基本没有好的结尾。


    这么多年过去了，这个规律还有效！


    # 经济学中的抢购气氛


    经济学中的抢购气氛。


    现在的中青年人很难理解抢购。我是经历过 88 年抢购潮和 92 年认购证的人，现在也几乎淡忘了。但我说个前几天发生的事情。


    国庆节前，我去加油站，我是十几年驾驶的老司机了，在上海甚至是外地，从来没有遇到过加油站无油的情况。那天是下雨天，也是巧了，第一个加油站，下午四点半开过去，工作人员说没油，我以为是意外情况，没在意。


