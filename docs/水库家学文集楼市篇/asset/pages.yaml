    老年人喜欢散步慢跑，打小球，找点园艺。还有一些老年人，一天到晚坐在咖啡店里，一小杯咖啡，一张报纸，一小时一开奖的小彩票，互相聊聊天。有钱人去俱乐部，和几个熟人打打牌，喝喝小酒。


    一小批超级精英，一天到晚忙工作，绝大部分普通人就是过日子。欧美人的贫富差距肯定是存在的，但是看上去不明显，最大的区别是房子和存款。不熟悉的人，根本不知道对方是什么人。


    一句话，无聊。赚不到什么钱，也不会太惨。大家心态极好。能够来中国旅游的，都是中上阶层了。


