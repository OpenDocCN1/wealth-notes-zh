    以前是买房降税，增值思维。现在，上面说不对，不能这么想，那大家就不想，没意见，完全支持。今后怎么想呢？保值思维。


    现在，银行信贷支持力度极大，钱从来哪？m2啊！这几天，江浙沪，哗啦啦啦的下大雨了。在这种环境中，我们肯定是房住不炒，但是买个租房还是应该的。毕竟，改善生活是市场经济的本质，这个不错的。


    我们其实一直在回避一个问题。民企不赚钱是银行不贷款吗？不是的。真正专注实业的民企，根本不需要多少贷款。货卖的动，到处都付款，怎么会缺钱呢？只有那些不务正业搞房地产和产品滞销厂家，才需要贷款。


    民企困难是，成本高，利润差。银行给企业更多的贷款，也不会降低商品成本！相反，货币多了，方方面面的价格上涨，利息支出增加，企业成本更高了。


    我们支持民企，首先其中的是降低税费，而且是普惠！不要审批制。小企业就派几十个人，抽出一个会计专门去跑审批，研究各种优惠政策，到处敲门拜码头，这成本也承受不了啊！


    # 真正的房住不炒精神


    上海地铁附近的 loft，即商办楼（非住宅），30平米多一点，已慢慢热销了，这也充分体现了房住不炒的精神。购买者没想赚钱，就是买个住的面积，省的被房贷和累资债。虽然不赚钱，但也是个资产，逐风挡雨的地方。总价一百多万，贷款5成，90%县城985都能承受。啥认命了。万一以后好起来了，算中奖。


    # 上涨是倍数，下跌是成数


    > （房住不炒，闲时藤聊）


    如果我有房源，肯定规定全款在老金京沪，但我限购了。也正因为有支付能力的人，大批限购了，所以没人买房了。我不怕超风险，特别是那些账面损失，我更不关心。但你不一样，如果跌了，老婆肯定会闹的。所以，这事确实难办。


    楼市是超级万转轮，转弯加速，是有阶段的。我们这些吃瓜群众，久经沙场。各种细节，一看就懂。如果房子上午挂出去，


