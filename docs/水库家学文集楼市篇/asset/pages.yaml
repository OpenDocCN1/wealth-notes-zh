  md: '举例，我的房子，两百万买的，五年前还清了贷款，现在也估值五百万了。我想买一千万的房子，如果卖掉老房子 500 万，贷款五成，月供 2.6 万左右，很多中高级职员家庭完全可以负担。但是，我要拿出七百万首付，再加上办证装修等将近百万，我就没能力了。


    正因为这么多优质中产金领，被七成首付卡住了，苦无资金，又难以解决，所以，超过一千万的房子，生意冷清。这个价位，其实需求很大，但苦于没有融资渠道。与此同时，富人在高端领域独孤了。富人往往有各种生意往来，有更多的融资渠道，转过来，先过去，首付多拿出两三百万是可以解决的。


    结论：首付七成是不能动的，一旦下降，把中产送进来买房，房价就不是现在这样了，富人或许再次获益。你说我扯谁去说理？


    # 京沪深盘的质量定位


    可能金越杀越下。


    由于限购限贷，富入场券基本都用掉了。二套房首付七成，也是卡住了很多金领家庭。目测 90%的购买力，集中在总价 3-6 百万区间。这个区间，购房者的选择面是比较差的，要么是远郊区三室两厅，要么是市区老公房的小二居。超过
    1 千万的购买力，都被严重遏制了。开发商也不敢多做了。


    假设，我要买个 2000 万的房子，首付七成，加上装修税费，大概是 1500 万现金。这相当于一个上市公司的全部流动资金了，能够负担的人不多。


    如果贷款五成，总价 1500 万，首付大概 800 万（市区 90 平米卖掉就行了），月供 4 万，很多中高级职员家庭就可以负担。市场购买力会立即火爆。


    结论：如果是数年后有换房需求的上车盘，尽可能把总价控制在 500 万以下，将来换股改善的时候，接盘侠最多，出手周期最短。（房住不炒，依法依规）


    # 理论研讨


    目前难以实施个人破产制度。


    个人破产制度的核心是，没收房产十定点居住。现行环境下，是不可能的。农民房怎么没收？门门贴个封条很简单，但接下来怎么办？等拆迁的时候扣掉。那是不可能的，拆迁的本意是保障居住，你扣钱了，他怎么居住？马上就成为各级部门头疼的顽周了。


    个人破产制度，是基于财产私有和抚危保障。香港澳基某财破产了，没收一切资产，住了七年的租跟房。我们做得到吗？要在各县区建设多少这种房子？建设资金在哪？


    # 今年的主基调是（2019.03）


    稳房价，稳地价，稳预期。这三个方面是自我循环的。


    +   1，稳房价是手段，目的是稳地价。地价是主导，大家心里都懂。


    +   2，稳预期，意思是你不要指望放大便宜了，不可能的。新房房价是严格审批的，千万不要想多了。


    +   3，要维持楼市平稳，最关键的一条是，m2 源源不断，这不，资金面已经宽松了。


    价格，预期，舆论，资金，多管齐下，经济学的大好局面，就不远了。你脚尖拉一下就看多了。'
