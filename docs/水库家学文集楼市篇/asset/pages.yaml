    # 有没有房，是一票否决制


    我在老家镇子上是十里八乡公认的最佳女婿人选。有房，985，大单位，收入好，聪明，长得不错，嘴甜，热情。


    到了京沪，没有房子了，我所有的优点只证明了一个结论，你就是标普 500 的标准凤凰男，啥也不是啦。很难老婆，这种情况绝不是个例。因为没房子，我这个郊区上海男和一大群外地男和青浦宝山嘉定松江奉贤金山的男生聚居在一起，某棚户区特别便宜，但是条件也差。


    也有很多女生无房产，她们依靠大单位和名校光环，*嫁的不错，脱离了我们这个贫困朋友圈。也有个别女生嫁给了无房产外人，但那些男生基本都是精英中的精英，论文级别极高，现在也发达了。


