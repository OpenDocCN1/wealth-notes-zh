  md: '往往是二套房，首付至少七成。以我的经验，两千万以上豪宅不会日光，当天卖掉七八成最多了。


    # ## 区别是选房顺序


    +   1.  大胆干，卖掉老房，囤好资金，参加摇号，争取先选房。


    +   2.  捡漏法，你事先和售楼小姐熟悉一下，加个微信。但不参加摇号，就在现场看看，如果剩余的未售楼盘里，有我满意的，去和售楼小姐谈付款日期（涉及到你自己卖老房）。


    说个行业小秘密，豪宅售楼小姐，都是经过“规范发 B”培训课程的，总是会装出一副高高在上，爱理不理，我们很紧俏，公司领导等有预定之类的样子。其实不是的。售楼小姐是有提成的，多卖一套，对她是绝对有好处的。如果你真要买，她回去后，就算和副总打二十个电话，也会为你争取的。


    # ## 抓紧上车，抓紧改善，快快快


    +   1.  我积极赞同，全家人齐心协力，在大城市安居乐业，新增或改善居住条件，抓紧上车，抓紧改善，快快快。


    +   2.  没条件的同学在大城市购买或改善的，请把我拉黑吧。你看我心烦，我看你也烦。


    +   3.  我们用的是纸币，这是合法大前提。


    +   4.  城市容量是有限的。上海是 2500 万人口。杭州南京苏州，也是有上限的。笑脸相迎是有阶段性重点的，北京欢迎你，城市让生活更美好。到了黄金分割线，严格清理低端，法不容情。


    +   5.  买房不仅仅是价格问题，而是几代人的生存根基。做大事，不要有鸡贼心态。不要想把一万元花成一万一千元，别人也不是傻的。


    +   6.  忘记过去，展望未来。茅台的原处股，你买到了吗？


    # ## 如果你年轻的时候


    有一套大城市的小二居，你的命运还会是现在这样吗？


    # ## 房价是由就业岗位决定的


    特别是高薪岗位。


    就业越好的地方，房价就越好。你住在内环线，在家门口找个简单岗位，还是很快的。实在不行，你去贴物业要求在小区里当保安，出门就算上班了。


    我有一次去市中心三甲医院，在附近小区停车等人，就和保安大叔聊聊天。保安大叔五十八岁，他说，他这一辈子就在这个小区里。六十年代出生，长大，结婚，生娃，中年失业离婚，在小区里当保安，一个月工资三千。实际收入六千多。我顿时来劲了，为啥？


    他说，你们白天来停车，有的人也不要发票，这就算我的了。要不是物业安装了探头，我一个月八千都有。他还说，小区门口我有小块空地，如果停车，我进出很难，但一个小时十块我成了，难就难，我也不在乎。这是我的小金库。


    我差点哭出眼泪了。


    # ## 京沪老破小的魅力


    张大叔接近五十岁，住在老破小里。父母没了，老婆离了，就他一个老光棍，工资三千多。这个条件要是放在我们阜阳老家，基本就算人生结束了。他倒是老来俏了。'
