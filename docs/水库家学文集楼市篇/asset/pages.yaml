    # 北京经济实力，肯定会超过上海


    今后，北京经济实力，肯定会大幅度超过上海的。这一点毫无疑問。


    现在的上海，还是和十年前一样，普通人的心态没什么变化。大家聚在一起，只有三个话题：房子买了没？你是啥单位？工资加了没？


    我们从来不讨论什么创业开公司，那是外地人干地。这个城市提供了中国最优质的公共产品，医疗教育较好，廉洁度还行，马路比较干净，治安还可以，房价还是很高。


    +   1. 上海经济的基础是国际化；

    2. 一是欧美日外资进来的第一站。

    3. 二是长三角民企出口的最后一站。


    今后，外企和民企，肯定是让位于国企和房企了。北京是审批中心，当仁不让，一枝独秀。互联网城那么几个公司，这倒不算什么大罪。


    善待民企，是中国经济转型阶段的重要工具。养肥了再分，也不迟啊！何必这么急呢？


    # 经济结构的分层


