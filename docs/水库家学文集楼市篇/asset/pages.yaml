    2. 男方可以上名字而没有上名字，一般认为是女方婚前个人财产。双方的金钱往来，按照赠与或借贷处理（看当时的真实意思）。


    两者的结果差距是十万八千里。


    莱莱：现在结婚买房是太复杂了，你搞懂了吗？我是半懂。


    # 国际大型会议会不会影响城市房价？


    莱莱，某城市要开一个国际大型会议，房价会不会涨？


    答：国际会议和房价没有关系。联合国在纽约，那天天价涨了吗？国际会议只是一个噱头，关键是当地的态度。2015年，很多地方没有国际大会，也不难得一遍比糟！


    # 有三套的，人生大赢家


