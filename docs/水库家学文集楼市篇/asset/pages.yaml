  md: '# 车位要不要买？


    我没车，我这几年不会去，我过几年可能卖掉，小区现在车位很空，小区附近马路上随便停车，租个车位很便宜等等，都是常见的理由。


    房子和车位的关系，相当于，西装和纽扣的关系。没有纽扣也可以穿，但总是不舒服。大部分小区，交房后的三年，车位很空的，看不出来要买的理由。五年后，我保证你的喜哭。


    与此同时，你五年八年后，经济宽裕了，依法置换，依法改善，依法卖出去的时候，有车位就是加分项。


    车位是必需品，建议入手，毫不犹豫。当然，一家一个就够了。自用不炒。


    # 无产权车位，怎么定价和转让？


    现在，大部分地下车位是没有产权的。住户和物业签 20 年租约，不能再多了，因为合同期只保护 20 年，同时保证原住户优先续租。住户在用几年后，卖房或不用车了，想把车位转让出去。


    一、价格。包括使用费什么的，双方自己谈，我不介绍了。价格，理论上应该打个折扣，因为租期少了。


    二、手续。因为不存在产权过户，只能是合同约定。我介绍下步骤：


    +   1. 签个转租合同，双方约定，甲方剩余的租赁期限内，归乙方使用。

    2. 甲方手里的原物业发票（几十万的那个），协议，交给乙方保管。

    3. 必须经过物业同意盖章，否则，合同自然撤销。

    4. 买得起车位的人基本不穷。签了合同，原房东一般不会反悔，因为无利可图，或者利益极小，犯不上大吵大闹。但是，必须经过物业盖章登记，否则，保安找你麻烦事情，就搞复杂了。


    三、交割。这个很重要。实际交接时，双方签字确认，因为交付前后，车位产生的风险，例如地面积水，排线，需要挖开，需要占用半个平米等各种损失，由谁承担，以交付为分界线。


    # 写字楼，loft


    不存在满五满二的问题，逢高减仓，再也别买了。


    # 楼市是经济学中纯内部问题


    房价只是经济运行中的一个小内在，真的不需要多想，一切都在掌握中。

    房价是其他经济领域综合作用的结果。

    房价只是结果，不是原因。原因明确了，结果自然就明确了。


    # 孟母三迁，最重要的是什么？


    答：老房子不要卖掉。学区房很重要。


    # 怎么买单位附近的房子？


    菜菜，我是中部地区的小镇青年，在北京东三环某公司上班，二本学历，月入九千多。我怎么能买的起一套单位附近的房子？那么多北京人有房子，而我没有，这公平吗？'
