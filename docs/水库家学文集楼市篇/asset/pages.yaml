  md: '从浦东旗舰店的金融人才公募，一直干到了春熙路。漫漫西行路，只有重庆和西安没动。2018 年开始，这两个地方的土著终于觉醒了，抬起来路。三个月跑光人家两年的路。


    这一轮大行情，涨不涨是次要的，关键是彻底消灭了空头地区。除了个别故意搏出位的货，全国各地的火树小巷，已经没有人数当众说暴跌了。就算他不服脆，他儿子还要娶媳妇呢。这么说话的人，哪个嫁嫁女人到他家啊！


    我们反对房价暴涨。但是，他就这么涨上去了。你说几百大道理，有什么用？你懂我也懂，大家一笑而过吧。


    # ## 小地方的商铺，除了旺铺，其他抓紧抛掉


    旺铺的价格合适，也可以抛掉。换到省会城市房子做首付。长期看，省会城市这么抢人，小地方，五到十年后是没有竞争力的。房产投资，一般是十年以上的周期。


    # ## 莱芜，什么时候砍沪省会城会暴跌？


    答：如果二十岁思考这个问题，你是对历史负责。


    如果三十岁还在思考这个问题，你是对婆儿不负责。


    如果四十岁还在思考这个问题，你是对谁也不准备负责了！


    # ## 无论你什么时候买房


    你都有一种心痛的感觉。mmp，比去年又涨了这么多，我父母 20 年白干了。


    但是，两年后，你会拷打自己的灵魂，为什么当时买少了，当时为什么不多买一套？捶胸顿足，嚎啕大哭。mmp 的，一百万活生生的从手里甩掉了啊！


    # ## 首次买房，心理状态是极度紧张


    三代人存了几十年的钱，一下子就花出去了，手脚都要打哆嗦。两年后，喜笑颜开。三年后，基本释信。二次买房，连看都不看，直接刷卡！


    # ## 楼市热钱，一路向下！


    **【全国楼市调控政策今年已发上百个 4 月就有 33 次】中原房产研究中心统计数据显示，仅 4 月份，全国各种房地产调控政策合计多达 33 次。25 个城市与部门发布调控政策，其中海南、北京、杭州等城市发布了多及房地产相关政策。一季度的全国房地产调控政策共计
    76 次。**


    为什么会出现这种情况？这是本轮调控的目标和节奏决定的。


    本轮调控的目标是去库存，不是降价，至今没有正式的说法提出要地城市要降价，一直是反复强调去库存。以武汉成都西安郑州为代表的各地省会，在 2016 夏天后都出现大幅度上涨，是普遍现象，这是配合去库存，越涨越买。打压房价是很简单的，海南，郊家，一分钟解决战斗。


    去库存的步伐就是，把资金在京沪深源的热线，一层一层往下推，以热线解决中西部县城的库存。目前，又到了换拉时间。热点省会基本关门，中下省会地级市开始登场了。2019
    年底，县城库存消的差不多了，才是调控起点。


    再说一遍，现在是三四线去库存的关键时刻，一二线城市必须相忍为国，共克时艰，房价绝对'
