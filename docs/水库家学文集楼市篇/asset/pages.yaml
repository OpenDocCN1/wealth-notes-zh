  md: '自己关起门来互相做钱，只要你出的利息高，钱管够，香港在 1997 年的汇率保卫战中，隔夜利息达到了 300%。


    3. 央行帮忙。miff 麻辣粉，sl 股粉股粉等，你爱吃咋吃吧。反正是自己地里的种的，管够。


    p2p 就没这事了。p2p 本身不收存款，只是民间借贷的中间人，说白了，和房产中介差不多。p2p 的利息（收益率）远远高于银行，因为不受央行的利率监管。民间借贷利息，24%以下就是合法。


    老王要借款一百万，在网站上说一下，几十个散户借给他，网站抽点手续费，大致就这样了。p2p 一般盘子较小，几十亿算好的了，而且绝大部分都借出去了，最多是留点备用金，2
    个亿就算多的了。如果出现挤兑，分分钟耍命了。


    有利就看有弊，虽然收益高，但出事了，也没人兜底。银行可以享受的各种救助措施，p2p 是没有资格享受的，垮了就垮了，你去找官司吧。


    备注：解放后，银行关闭的就两个，一是淮海及展银行，二是西北某个县的村镇银行。有兴趣的可以自己百度一下。


    p2p 垮了，借钱的服务人还耍不还钱？答：理论上，肯定要还钱的，但实际上，这些钱可能没了，还不出来了。抓几个骗子判刑的可能性更大。


    # 每个人都知道一句话


    在恐惧中贪婪，在贪婪中恐惧。


    但有谁能做到呢？没有人能够。股，债，汇，楼，四大市场，都是追涨杀跌，人云亦云。


    # 伟大的创业精神


    住在 1000 万的房子里，过着月薪 3000 块的生活，这才是伟大的创业精神。


    市场经济的起步积累阶段，都是光宗耀祖的。活盲人靠着“白天做老板，晚上睡地板”的精神，百折不挠，走向世界，把中国商品买到了全世界的卡卡角落。


    努力，才能改变命运。上一代的艰辛才能换来下一代的幸福，你吃过了苦，添齐了首付，攒下了面钱，下一代就可以安心读书，继续发展了。大家都躺在地上抱怨不公平，伸手要福利，那不是发展的悲哀。


    一些骚文人，一天到晚，悲天悯人扶殿泪，哭这个苦，哭那个穷，解决方案就是向集体伸手，要救济，要帮助。这合理吗？


    我们还是发展中国家，不等不靠，自立自强，我们的明天才能更加美好。


    # 和玉小鲁商谁


    买房拿出三代人储蓄，这是对中等收入阶层剥夺？


    我尊称你敢于表达意见的勇气，但我不同意你的观点。


    这个说法，属于无事生非，胡搅八道。北京每年几十万套房子卖出去了。你们单位买房的同事难道不是群众，都是腐败和不合理高收入的钱，都是剥夺中等收入人群？我滴天啊，这简直是胡说八道，不讲道理了。


    京沪等少数地方的房价确实高。但中国这么大，房价低的地方比比皆是，离开北京市中心 25 公里的燕郊只要两万多元，距离 35 公里的固安只要一万多。你老家县城也就八千块。可非要靠一'
