  md: '你找茬，这才是最麻烦的。


    # 巴西大豆？呵呵


    几年前，巴西铁矿石给我们四万亿的势头，一次性涨价 95%的事情，还历历在目。我们多次请他协调，都没人理。所以，巴西贸易是靠不住的。


    # 大豆和玉米的地位


    九十年代以前，我们为什吃肉少，米饭多。因为我们的鸡鸭猪牛羊少。为什么不多养肉食呢？没有饲料，主要是玉米和大豆。


    为什么不种植玉米和大豆？土地有限。种了大豆玉米，稻麦就不够了。


    现在，我们很象丰富了，原因很简单，出口大量创汇，有钱进口大豆和玉米，然后搞肉食饲养，一下子就解决了吃肉问题。


    所以，大豆和玉米的进出口，本质上是互利关系，而不是一方吃亏的事情。这次把大豆玉米拿出来了，说明已经到了极大之勇气了。一年内有序在顶着，暂时没事，但拖不起。


    # 我尽量看的隐秘一节点（2018.04）


    中美贸易纠纷要尽可能早点平息。否则，可能引发的事情，实在是太复杂了，对美国也有巨大伤害。


    当前的大格局是，美英俄正在互相驱逐外交使节，这是撕破脸了。此时，如果美国再和中国闹大事情，日本肯定要掺和进来。我怎么着，都觉得不太像是玩真的。


    中美在亚洲的很多领域，是互相有默契的。这种默契不是写在报纸上的，而是心照不宣，主要是世界和平方面，经济问题反而是第二位的。


    中国人的性格是：你给我面子，我吃点亏都可以。但是，你不给我面子，给我便宜我也不要了，就争一口气。川普是商人出身，对这个事情的认识，不一定深入。


    这次我们摆出的架势，是很大之勇气。大豆和玉米的重要性，简直是农业之母的地位。如果真的搞起来了，我们第一年的库存，还能够维持价格平稳，但是第二三年后，粮油肉价格必然是上升较大（这个不敢多说了）。美国出手，可不是一个美国，别忘了，他还有一群小兄弟。


    民以食为天。如果食品价格变动大了，其他商品的价格，全部要改。这就不是贸易战了，而是新经济制度要适应新经济变化了。


    大豆和玉米的进口，其他国家在短时间增加供应，能不能顶替美国？不管能不能，美国会让他们捡便宜？如果是重要物资供应不足，那么只能是往回走，票证。后面的事情，我就打住了。大家自己研究吧。


    # 经济新时代真的来了！


    但绝不是淘宝和微商，而是服务业。


    人的需求是非常多的。不仅仅是滴滴打车，送外卖，现在各行各业都在暗暗的抢地盘。你们动动脑子，也整一个冷门项目。十年后，你就有出息了。我给你点启发，快递顺丰鉴定都是需求极大的热门种类。只不过，你不知道而已。以此类推。'
