    实际上，银行不是这么算账的。银行的主要贷款，都是以房产作为抵押的。假设这套房子价值 两百万，打七折，贷款给你 140 万。如果这套房子降价 20%，只剩下
    160 万了，银行只能贷款 112 万给你。这时候，银行就会要求贷款人立即归还 28 万，否则，银行就处于高风险状态了。


    如果经济差到个这个度，贷款企业一般是还不出钱的，很多企业个人就拖着不还了。你走立法 律程序拍卖，我的损失也不大。爱咋咋地吧。


