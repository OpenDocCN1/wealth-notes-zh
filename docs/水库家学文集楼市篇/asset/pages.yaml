  md: '走出房子，缺乏专业技能，周边不少同学已经在准备考研，因为是理工科专业，据过来人说不考研未来起点很低，本科工资也很低。所以我强迫自己坐进图书馆，却看不进任何东西，脑子全是房子房子房子。


    答：人生赢家啊！南京三套房。考研某个球啊！


    # 现在，确实有一些特殊房子，打了九折


    我举个例子。某本地大叔借了高利贷，知道有雷了，跑路前，把房子九折出手，但要首付八成，说是另外买房了，过户后再付 20%，家套付了几百万，还没过户，高利贷就起诉了，房子被法院查封了。


    当然，这事情可以打官司，但天下没有掉馅饼的事情。


    # 我这些年看房，遇到过的“九折房子”


    +   1. 房产证名字是另一方人的，现在要离婚了，男方想卖，老婆不让卖。我去看房的时候，老婆正好进来闹了一下，吓得我赶紧要走。


    +   2. 隔壁有条狗，天天半夜大叫。


    +   3. 隔壁住了个弹钢琴的，扰民剧烈。


    +   4. 窗口十米外是个垃圾站，半夜要运垃圾，噪音巨大。


    +   5. 小区最边上一套，下面是个餐馆，长年油烟味。


    +   6. 房东出国了，户口无处可迁。


    +   7. 有多个高利贷抵押的，没人敢买。


    +   8. 房东上了法院黑名单的。


    +   9. 房东黄赌毒的。


    我建议，这类房子，千万莫碰。后患无穷，谁也不知道哪一分钟出事了！


    # 买房会不会降低生活品质？


    我觉得，无房户才是最低生活品质！


    # 买房就是创业！


    买了房子，就像是经营一个企业。房租就是利润，房价就是身价，找租客就是拉单子，催租金就是催款，还有股权投资，资产并购，咨询服务，战略企划，一歪一歪的。


    市场有波动，这个很正常！


    向着美好未来，前进，前进，前进！


    # 这次楼市调控，意义重大


    央视财经：【全国首套房贷利率同比上涨超 20% 你贷款 200 万多还 40 万】数据显示，今年 11 月全国首套房贷款平均利率为 5.36%，相当于基准利率
    1.09 倍，同比去年 11 月上涨超 20%。如果现在贷款 200 万买房，要比去年多支付 40 多万的利息。专家认为，首套房贷利率上调的可能性依然存在，但上浮空间已经不大。'
