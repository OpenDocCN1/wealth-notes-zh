    # 为什么大清基本没有房价问题？


    （上海除外）


    最近亲戚给我讲了张爱玲文学研究。老旦八卦，农村土地和城市土地是一样的可以转让的。城里 房太贵了，城乡结合部，例如虹桥乡，就冒出来了，二本子和富人们就去虹桥乡造房子了。


    现在，农村土地不能买卖，但是，大批二本子进大城市了，所以居住就紧张了。'
