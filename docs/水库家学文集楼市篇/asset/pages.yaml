    # 4月份的微博预言，再次兑现


    浅谈学区房办法的不可持续性。


    公办优质小学，一般是历史比较长的小学，那么注定是在一片老破小学校房的包围圈里。这一大片的老破小，户口数量是非常惊人的。


    这几年，学区房观念开始慢慢普及了，浦东某小学校附近的某老破小，居然卖到浦东顶级豪宅的价格。这意味着什么？越来越多的老破小房东，会选择卖掉高价的小区，改善居住条件。那么买家是谁？孩子马上要读书的富裕家长。于是，这几个小区，入学新生数量越来越庞大，今年
    xx 著名小学已经爆满了，部分学区房孩子放读去。


    现在，小学是按照各种指标进行排名，排在最后的孩子就删除。这个办法是临时性措施了。公立学校的排名办法，是不是科学合理，可能不一定经得起严格审查。随着时间的推移，可能越来越多的儿童家长要质疑了，举例。


    +   1，穷人家庭，父母子女户口出生在二三块小块的学区房里面，但买不起房子，没有房产证。2，富裕家庭，提前三年，买了学区房，户口房产证都有。


    你说，哪个孩子应该读？


    展望未来，学区房可能会是空壳，周围 3-5 公里，好差中学校搭配，随机摇号的可能性更大！'
