    # 我不会投资金融产品


    投资是有前提的，信息披露+社会监督。这两种东西，简直是天方夜谭。你去差评一个什么理财产品看，分分钟就被人起诉了，你就陷入无穷无尽的官司。平台只要没有出戴后跑路，任何金融产品都没人敢差评的。你买金融产品，赔的是最后一棒归谁。


    房子，是实实在在的东西，就算房价长，绿化差，屋顶漏水，但确实做到了信息披露，你可以完整了解产品的情况，然后决定买不买。这个道里，大部分人也懂。但是，当你存了一百万现金，买房不够，存款吃亏，你就很抓怒了。很多人就开始心思活络，想去搞理财产品了。


    这是普遍情况，大部分理财产品的倒没策对象，就是这批人。


    # 为什么市场经济这么多年了


    # 还是人债社会？


    人情社会是，你欠我人情，但不是当场结算，你日后其他方面还给我。


    市场经济是，明码标价现割现，银货两讫不欠情。


    为什么我们还在人情社会里打转转？因为日常生活中，有很多不可言说的事情不是用钱来结算的。举例，你今天帮我托个人，我明天给你办个事，但碍于法律，不能直接结算，只能是人情套人情。


    但是，没门路的人，算是倒了大霉了。你兜里有了五百万拆迁款，那又怎么样，有些事情倒弄不成。


    # 我对实体经济有点悲伤


    现在，越来越多的赚钱行业，出现了独有兔公司，先号他一百亿，让其他小老板轮得相当子，所到之处，寸草不生。等你们均了，我再提价。


    我们还能怎么办呢？但是，这里面有个漏洞，他没有本事把京护楼市都买下来！


    # 2019 的经济大方向


    写这种大题日，对个人声誉度的风险是极大的。过段时间，万一话错了，就会有一群买不起房子的三线屌丝，掀嘎叫的自费冲上来打清。但荣总是什么人啊？万军中，取上将首级。兄弟我，抖料出身，大宅门里的老裁婚，自信满满。


