  md: '来吧，你点菜。你喜欢哪个建筑，哪个高架桥，哪个地铁，东方明珠，世贸大厦，上海中心，你随便挑，只要出的起钱，三年交钥匙，拷贝不走样，包括房间插座的款式都一样。你绝对不要怀疑中国制造的复制能力。


    有现钱最好。要是没钱，也没关系，以物易物。你的大豆，稻谷，矿石，衣帽鞋，我包向了。


    # 现在的黄冈，喝了真不上头


    中国的财政收入结构，必须转型了。


    目前的困难是，该市及其相关行业（包括家电建材），至少贡献了一半的财政收入。这导致了他也不敢去真正触动这个行业的灵魂，最多是，“靠，不要涨得太快了，马儿，你慢慢跑，不急啥”。


    如果财政收入减一半，城市会如何，地铁没了，马路破了，教师工资打七折，城市灰头灰的，马路边的垃圾越来越多了，就业不行了，大街小巷到处是无所事事闲逛的农村青年年，谁也承担不起这个后果，必须找到一个替代办法，补上这个财政缺口，才能扫掉地产的砒码。


    这是结构性的经济改革，是触及跟层次的，重塑三观的财政改革，激烈程度绝不亚于当年国企大下岗，问题是，真要改了，居民们又不高兴了，因为任何经济改革，首当其冲的就是工本于，文也不行，比不上985，武也不行，比不上建贸文，拉线工，他们可能是最先被淘汰出局的人。


    经济改革的确切方向，我也不知道。但我隐约的约认为，是工业升级，服务业升级，就是让人过的舒舒服服，例如把塑钢门窗做的更加漂亮，更加结实。不要和我说什么高科技，高科技带动了什心就业，和一般人没关系，以后，可能是工本手要离开城市办公富，去宁陵农村的车间做塑钢门窗了，你接受吗？


    工商业转型，过程很长，期间的财政缺口怎么办？如果还舍不的掉楼市，那么太夜很难实买去会做实业的。所以，必须下决心，彻底放弃楼市，财政缺口通过印钞或旁救解决


    钞票多了，可能又会去买房，怎么办，让你买不了。


    +   1. 限购提高到十年社保，或者十五年。

    2. 严禁跨省就业，京沪人才引进，总额限制，省级审批。

    3. 跨省婚姻，子女户口随母老家

    4. 新房房产十年内不得转让，十年后转让，由住房保障机构回收。

    5. 恢复盲流保护性滞留手段，闲散人员不得滞留大城市。

    6. 房产公开，谁多买了，动员他捐出来。


    需求没了，房价就没人关心了，大家集中精力搞工商业升级，建设美好家园。


    # （货币的秘密）


    2014年，你家也买不起大城市房产。


    2019年，你还是买不起大城市房产。


    但是，你用2019年的收入，可以轻松购买得起2014年的房价。


    为什么，你是大学生，你先说。


    # 现在，谁在赚钱？


    艰苦岗位的服务业。


