    # 出口升级，求稳不求快


    九十年代，欧美普通人，工作比我们轻松，赚的比我们多几十倍。某著名国产果汁的老板曾经写过一个回忆录，当年他们还是乡镇小厂，引进了最先进的欧洲设备，但是我们从不会用啊。于是欧洲厂派了一个工程师过来安装调试培训，那个工程师的工资是乡镇小厂发的。我印象最深的是，外国工程师一个的的工资，比他们全厂一百多个人工资加起来还多。


    三十年，转眼一瞬间。现在，中国的高科技也可以出口了。未来的民用大项目可能包括：高铁，飞机，通讯（天上卫星+地上华为），远洋海工，跨桥设备等，基本涵盖了海陆空天。以中国的勤劳加上高科技，如果实现了大项目出口，欧美的苦日子就要开始了。


    从现实看，我们似乎有两个时机选择：


    一是硬件拼凑+运用创新，性能接近欧美，寿命也可以的时候，以低价冲击对方国有地盘和市场。这总会引发对方激烈的不服气。各种事情都会出来，最后台什么情况，很难预料，如果对方一开始就拒绝。我们损失还小点。如果对方半渡而击，损失更大。毕竟技术还在别人手里。


    二是关键软硬件基本原创，以较大自创优势击败欧美产品。这种情况，矛盾教少。当年日本彩电横扫内地市场，我们都没什么抱怨的，人家的东西确实好，愿意买啊。


    目前看，很多民用大项目，关键零部件还不能自产自销。在这种情况下，我们要谦虚谨慎，尊重欧美的传统利益，合作共赢，尽可能不搞低价冲击，似乎更现实。


    # 我们是人口大国


    纺织品大国，就是靠做裤子衬衫起家的。现在，农村还有那么多的贫困人口等待扶贫，县城乡镇那么多无业妇女到处溜达闲逛，可我们居然要花美元去越南撕进口低价裤子衬衫。为什么不把很多无业人员组织起来生产裤子衬衫呢？因为成本太高了，还不如进口。这事情，目前无解。


    # 大基建，只能往前走


    如果一个经济体的制造业不怎么样（不敢说不好），大基建却非常发达，那么这个经济体的m2增速，就有回头路了。


    制造业有个特点，自我循环，财务平衡。在不增加货币的情况，实现平稳就业。'
