  md: '# 我对楼市充满乐观，而且非常非常乐观。我不是来搞笑的，这是经济的大格局


    我不喜欢楼市。楼市再火，是慢慢优抚。楼市挂了，今晚就要死。说来说去，就一个难题，楼市拉动了就业和财政，上下游，几百个产业集群，无数的产业工人。要让楼市挂了，真的很难弄，环空一个难过，当天就挂了，连拉一下都没有，直接玩球，但是，哪个行业来替代楼市，扛起就业和财政的两杆大旗？目前没有。


    就业，无非是几大门：体制内，外企，民企。


    1，体制内的就业，数量不能太大。因为体制内，为体制外，提供基础原材料，例如水电气油，基础设施。国企赚的是外全民企赚的钱。国企的出口创汇只占10%。外企和民企各占45%。如果国企背大量的就业人口，赚谁的钱？国企为国企一根380v的电线，五十米，要几十万。小餐饮行业，挨个十五米的燃气管子，要10-20万。如果大家都爱国企，这钱收的到吗？计划经济时代，公家单位把城市就业基本包下来了，最后怎么样？1998年的国企大下岗，就在眼前。刚走不远。


    2，外企，曾经是就业主力军，但现在，越来越多的著名外企以亏损为由，认认走了。很多去越南了。为什么？劳动力成本。民全要得满，少交了社保，是普遍情况，但也正是这个原因，民全勉强活下来了。你去看看装修公司，有几个人交社保的。你再去看看汽修厂，电子厂，皮鞋厂，塑料工厂，有几个交足社保的？


    但是，外企不敢啊。员工诉尔：外面老板签字，我们偷税一点。外国老板吓得汗坏了。足额交，这成本就哗啦啦上去了。以前技术优势明显，可以开高价，一瓶可乐卖的比一桶柴油还贵。现在赚不到了。指望外企扛起几千方的就业，难啊。


    3，民企。原来还搞点偷偷摸摸的小动作。现在，大张旗鼓的宣传劳动法，检察院发打官司，已经司空见惯了。赚钱的民企不多，很多中小微型企业，朝不保夕是常态，经常走在盈亏线的边缘。指望民企扛起楼市的就业大军，可能性不大。


    就业是刚性的。不管怎么样搞，必须把就业率稳住。那么谁来扛？


    以前搞一些付居助工，交通协管员，清洁员，轮护类，机关事业短期合同工。这些就业总量是有限的，时间是临时的，纯粹是花钱买个清凉，工资也不高。


    真正的就业，应该是生产部门，有效益的单位，自愿增加招聘。问题是，除了赚钱企业，两桶油，大银行，还剩几个赚钱的民企？中国制，曾经打通全球无敌手，现在民企已经混成了那个鸟样子，成本到底是怎么抬上去的？有关部门心里点点数吗？


    说了半天，目着不到一个行业可以扛房地产上下游容的就业和财政。怎么办？小火慢炖，慢慢来。有关部门创造条件，把民企调整到大多数都是赚钱了，这时候就可以把房地产烧了。问题是，这个过程要多久？


    # 投资什么最保值？


    世界上最了解经济，且愿意告诉你说实话的，只有大银行了。买什么东西保值？我们说了不算，但有一个标准答案是不容置疑的：银行接受抵押物。银行是最严格的经济学家，他们对一切资产都熟悉，他们愿意接受的抵押物，就是最保值的东西。


    作为白领家庭，你不可能拿出什么矿证矿，高速公路上地证，成品油零售批准证书，一干吨钢材，作为银行前能拿出的抵押物无非是两个东西：房产，股票。'
