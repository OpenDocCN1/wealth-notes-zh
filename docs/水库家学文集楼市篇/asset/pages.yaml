  md: '九，旅游，省略五百字。傻子才去呢！


    十，买车，问题是停车太难了。我现在都怕开车，经常打车。


    # 必须剔除荒唐价格！


    我去看了商场，现在的男士冬季服装价格实在是太离谱了，简直是接近骗子了。国产不知名牌的羊毛大衣（含少许羊绒），近万元的价格，比比例是。人家阿玛尼卖二万一万元，毕竟是世界著名品牌，有天价广告费，时尚代言人。你一个前所末闻的浙江县城品牌，卖二万元是不是过过了？羊绒大衣，就是两米布料，机器裁剪缝制一下。五六百元一米布料，应该是顶贵了。怎么算出来一万元的价格，我也是目瞪口呆。市场经济，你有定价自由，但是这么做，消费者怎么激发消费潜力？


    我都不知道这种万元杂牌大衣，能够卖出去多少，但总觉微不是滋味。我们有必要把价格组总算一算，看看阻碍激发消费潜力的环节卡在了哪里？


    # 今天，有个大仙说：


    现在的京沪，年轻人已经没有什么资源可以给他去奋斗了。


    这说法有点武断了。我当年大学毕业，也是给不到任何希望，房子票子位子女人，啥也没有。


    但是，改革来了，住房改革，WTO，外贾提速，房地产繁荣，一个接一个的大利好，眼花缭乱。我们这一代，绝大部分都比父母好了一百倍。


    现在，中国的人均 GDP 只有美国的五分之一，科技进步的空间到处都是，经济发展继续深化，年轻人的未来，大有可为。有一小部分屌丝，不思进取，没有任何工作动力，就想去分人家富人的机器和房子。给你了，你又能怎么样？失去动力，失去创造，你得到的无非是-堆破砖头。物业费也交不起，十年后就是老破小差的必须小区。那时候，你的儿子怎么办？


    我们要向前看，去创造，去发展，而不是叽叽歪歪！


    # 看了两个小时的抖动


    说的是一个加拿大的陪读妈妈怎么艰难适应新生活。她在北京也是高收入了，一去加拿大就买房买车，打冰球，狠补习班，上私立。这些有钱的人总是受宠，为什么呢？我也是心情郁闷。虽然有些事情不说破，但心里憋闷啊。五千年文明，处处是多音，我什么都喜欢，为什么要走呢？


    # 彩礼的经济学本质


    彩礼是把男方拥有的钱财，转移给儿媳。这笔钱是男方的老婆本。男人失去了这笔钱，基本没有财力再婚了，对女方婚姻有个保络。农村地区，离异女是不可能分到房子的。城市男性的房产如果是婚前
    的，女方离婚也得不到房子。


    彩礼制度是中国古代文明，有保护女性的一面，也有破坏婚姻的一面。它极大抬高了娶妻门槛。男方要准备婚房，酒席，三金，服饰，一大笔彩礼，一桩家庭如果两个儿子，真是负担不起，怎么办？聘老婆。


    通过负债的形式，把老婆先骗过来，然后逼迫女方把彩礼拿出去还债。如果女方不同意还债，那就一起吃咸菜。婚后，女方逃跑或执迷离婚，一般是索退钱的。男方婚后立即要求生孩子，绑定风险。有了孩子，你一般就逃不掉了


