    # 为什么我们会如此之快的成为世界第二经济体？


    首先是国家伟大。


    当然，还有一点小小的因素：科技进步放缓了，给后面的人留出了足够的追赶时间。表面上看，高科技遍地开花，实际上，除了互联网技术，其他方面，可能几十年基本没有什么科学原理的进步，最多是应用层面的改善。汽车冰箱彩电洗衣机，工作原理都是
    50 年前的成熟技术。


    我们现在是液晶面板的最大生产商，为什么赶上来？因为技术停止了，我们慢慢学会了。科学就是做实验。做一个实验不行，就做十万个实验，只要时间充足，总是会破的。再加上我们的成本优势，一下子顶定了。工程机械领域，我们是绝对的
    top1。就算是芯片业，如果十年内没有根本性进步，那我们彻底也搞定了。AMD 是好助攻。


    为什么我们进步这么快？


    +   一是外汇充足，舍得下本钱。在有标准答案的领域，我们历来不缺工艺技巧，缺的是外汇和长期投入。现在外汇多了，进口设备，消化吸收，很多事情就迎刃而解了。例如高铁。外汇哪来的？衫彩换飞机就是个好办法。


    +   二是市场够大。我们的市场是平行的。上海发明个什么好产品，一个星期内，西安就有卖了。一个月后，贵州山区也有了，价格一样，你要是在新加坡生产手机，一共几百万人，你能卖多少？本钱都收不回来。等我们国内消费者用顺手了，技术
    bug 也修复了，再卖到全世界，打遍天下无敌手。


    +   三是集中力量办大事。例如，我们可以在这么短的时间内，完成这么大的高铁干线网络，技术、资金、拆迁、化解矛盾，都是天量的工作，我们也是做到了，就是这个机制有力量。不管你服不服，大家都从大众。收割一下，赶紧的。


