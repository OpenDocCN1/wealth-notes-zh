    # 3月份的微博，预言成真


    .我对学区房是不看好的。


    ‘学区的意思是，在义务教育阶段，可以靠房子优势，进入公立的优质小学初中。但这个事情，目前已经变化了。


    大背景是：义务教育公平化。实际上是不再鼓励孩子们，点灯熬夜，做怪题偏题，把身体搞坏了。


    小原因是：精英教育，逐步开始。这主要靠钱，而不是学区。你买学区房，学校又没收到什么好处。你有钱来读，没钱拉倒。


    学区房迅速逐步向高价优质学校过渡，是个大趋势。现在，上海的白领家长已经全面接受高价小学的理念，每学期几万元，不在话下，就怕进不去。甚至出现了名牌小学对家长进行素质考试的奇葩事情。


