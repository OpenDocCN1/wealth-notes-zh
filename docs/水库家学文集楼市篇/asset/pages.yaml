    后面我就不说了，大家自己体会。


    # 为了某种正确


    我们不能说什么“经济大萧条”之类的话，我们就说是“实体经济暂时困难”吧，这是报纸上讲的，今年是经济最困难的一年之类。有原文，别抬杠啊。


    在暂时困难期间，人们的经济反应是什么？不投资，不扩产，去杠杆，去产能，买保险避险资产。国际市场，避险保值品种主要是：黄金，美元。（有争议，但差不多）但是，我们这里的黄金和美元，都不能作为避险品种。


    +   一，黄金。不是流通物，一一般也花不出去。你拿金条买不到房子车子，一般人是把黄金作为艺术收藏品，类似高价字画，古董。


    +   二，美元外汇。那是严管的，搞不好扣你个大帽子。你也带不走，花不了。你拿美元买个自行车都不可能。因为一般人没有复制真伪的能力，总不能吃个烛光晚餐，然后带上美元去银行赎贴吧？


    普通人在经济学上有避险资产需求，那么，聪明的市场总会找到替代品。在我们这里，大城市房产是广泛接受的避险品种，可以换任何东西。房产证就是大银行存款，贼心霸得好。女人最喜欢，丈母娘，小媳妇，复妻无娘，就认这个！


    京沪房产狂热由来，你就是姑爷！漂美闺女带你走，老人家绝无异议，还要送你一台车。如何破解这种非理性房产需求？


    +   1，充分发挥实体经济的正能量。要让工厂办企业的人赚到钱，而不是企业进退两难，老板贼头盗贼脑，目光呆滞。


    +   2，进一步严厉限购，干赔社保十年，彻底断了外地人的念想。


    +   3，m2 不能再扩容了。钱多了，物价一涨，人工工资就上去了，产品无力抬价，这就找补上了。


    # 近 20 年，m2 涨了几十倍


    京沪从每平米三千元涨到了十万左右，任何一个时点上车，屌丝及其父母都是人生大赢家。但他们就是不愿意上车，谁劝没他们，他们就敬祝道：“你们是要害朕啊”！你还又有什么办法？他们最喜欢告诉你的是，曾经有一小段时间，京沪跌了
    12.63%。你看我聪明吧，我都都知道，连小数点都知道。这样的聪明人，我是不想在转角遇到你。滚！


    # 大型活动的奥秘


    很多人不理解，这个大型活动，那个大型活动，各地方城市的领导为什么那么起劲？办个 xx 大活动，真的赚钱吗？这是普通人的思维，不是行政官管理者的思维。我讲清楚奥秘，你就明白了。'
