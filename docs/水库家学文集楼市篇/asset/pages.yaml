    乖，来调点！


    # 不作为投资意见 (2018.11)


    此次公司回购改革方案，是理论重大突破，力度超乎想象，这是根本性和长期性利好，也是经济学基本常识。我是周末看到修法决定的，当场就惊呆了。我的经济学敏感度是超强的，立即就傻乎乎的喊多了。但我真的不懂股票，因为我忘记了一点，大资金也是周末才反应过来的，没有建仓时间啊。


    周一白天，磁盘暴跌，恰好也是建仓时间（纯属巧合）。周一晚，平安千亿回购计划在 CCTV 和新华社发布，这下子大家都反应过来过了。这不是小利好，是大利好。但散户的态度不重要。重要的是，周二大资金怎么办，继续硬抗一天暴涨，还是撒丫子抢跑呢？


    最后的结果是，大家一股脑的撒丫子抢跑，先入再说吧。反正这个事情是早晚弹掉。于是，周二大阳线。周三散户也入场了。


    周一，开市前的集合竞价是大黑线，开门就缴数。


    周二周三，开市前的集合竞价是大红线，开门就跑跑跑。


    我虽然不懂股市，但我的政策敏感度很高。周末那天，股民们看我是像 250，各种冷嘲热讽，铺天盖地。当时我也没办法，索性硬对，搞搞笑。大家一起看热闹。


    # 我给你十块钱 (2018.11)


    你能不能让我笑一下？


    移动互联网的下半场，普通人能够赚钱么？我们来先思考一个普通问题：类似于支付宝（荣荣）这样的全定制网红，有没有存在的价值？很多人认为没价值，就是一个卖皮子的，最好退昌平沙子。再问：这么多年来说房价价值的经济学家有价值吗？相声演员和歌手有价值吗？这个答案，我放到最后讲。


    我们都非常熟悉移动互联网。移动端的上半场主角是，卖家。现在换到了，省路一百字。马化腾说。下半场是产业互联网，方兴未艾。那什么是产业互联网？按照一般人的理解，就是把移动互联网和工厂企业联系起来，做大数据，分析销售。皮鞋厂最好在每个女人的
    bra 里放上芯片，自动连线手机，看售我的货品最后卖给谁了。


    这可能是产业互联网的一个细分领域，但只是很小的方面。我理解的核心是，移动互联网有无界限的的优势，满足人们一个极微小，的需求，创造财富。'
