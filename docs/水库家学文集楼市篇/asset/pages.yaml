    # # 大部分上海市区家庭


    在九十年代就是这个样子的。先辈们的起步都是很难的。光荣和骄傲是靠时间熬出来的。没有第一步，哪有第二步？屌丝们也不要再抱怨部分父母的自私懒惰，吃光用光，身体健康，什么也没有留给我之类的。你应该想的是，今后我也为人父母了，我怎么回答这个问题。不要过多的考虑个人得失，要考虑长远发展。钞票就是一张纸，房子才是家庭的根基。


    ![](img/fe0763d1c3cef9e2b76dd74a0e5520f1_70_0.png)


    # # 没有卑微，哪有荣耀？


