    商业利润的最大来源是，风险溢价。不承担风险，躺着赚钱的好事，怎么能轮到你？你算哪根葱啊？有背景的也抢的打破天儿。


    我和菜嫂以前很多年做生意，几乎是天天站在悬崖边，思维压力非常大。因为这种长年累月的精神紧张，例如全家签字担保了天文数字的企业贷款，导致了我们这种家庭和普通人家的思维方式，完全不同。时间长了，我甚至喜欢上了风险。赢了山珍海味，输了整个家请酒席，真是贼刺激，飘飘欲仙，欲罢不能。


