    # 现在京沪是那些人在买房？


    前段时间，我陪一个亲戚去收房。因为一系列手续要办，所以都是全家总动员，相关人员一起来。我看了一下，名义上都是三十几岁为主，四十五六十岁的亲戚都有，但是真正的买单族是老年人，即年轻人的双方父母，因为涉及到一些合同细节都是父母讲得清楚。孩子们就是看看房子。


