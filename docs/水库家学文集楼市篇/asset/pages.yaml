  md: '于中介来说，可能就是随口一说，而针对一个家庭来说，可能是三代人的积蓄，容不得半点失误。


    # 为什么京沪不出台三年五年的限售政策？


    偏偏是某些二线城市城市这么干？说白了，还是维护新房的出货速度，避免次新房冲击开发商的售价节奏。这那是什么房价啊，这是保驾护航。


    真要看，五年社保限购，分分钟打七折！（售楼处之心理，路人皆知）


    # 再怼杨红旭


    杨红旭：北京都跌了，还能什么城市不可能跌？这个命题，直击要害！


    莱莱：西安都暴涨了，还有什么不可能呢？


    # 我梦见


    +   * 五年后，松江区涨到了十万 / 平米。

    * 如果你不相信，请你取关，

    * 如果你相信，请你留下来发财。


    # 强烈呼吁央行彻底封杀租房贷！


    租房贷可能会变成炒房利器！传说中的零首付，再出江湖。


    上海一套房 500 万，首付 180 万，我买下来后租给女友，女票贷款 120 万租房，租房贷放款后，小两口再去结婚，基本就是零首付了。对钱？


    这个模式一旦推开，炒房简直是不要钱了！后果不堪设想！


    大城市公租房的房源稀缺，地段偏远，如果今后鼓励租房，必然是大力吸纳社会房源。为了稳定房租，必然是长期租的，一次性付清，房东不可能接受十年不变的分期付款。你现在租的什么十年前的租金价格吗？一次性付清，房客必须是贷款，年轻人哪里付得起
    10-15 年房租？


    # 2020 年之前不会有大的行情


    杨红旭：近期，很多网友，问老杨北京楼市走势，昨天在会上分析过此事，三种可能：1. 摸底过程中的无序波动；2、开始进入短周期的上行通道，价格会一直涨至新高。3.
    下跌过程中的 abc 三浪，当前开始 b 浪，但 c 浪会小于 a 浪。三种皆有可能，概率最大的是……昨天说了……


    莱莱：2020 年之前不会有大的行情，甚至可能有 5% 的下降。2020 年夏天到秋天开始，大幅度上升。


    # 京沪楼市调控（2018.04）


    变成了大家抽签打新股。


    # 我们反对房价暴涨


    这一轮大行情是 2016 元旦开始，一路向西，逆流而上。'
