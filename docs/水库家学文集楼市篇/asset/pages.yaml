  md: '山东人在外地经商工作人数量很多，虽然发大财的土豪不太多，但小门小户也有不少，例如山东的蔬菜大蘑菇基本控制了上海的批发价格，建筑装修业人数量大，山东的研究生独霸京城。山东穷农数量也多，这些人买不起资产，回老家置业的经济实力还是有的，大多数愿意去青岛，而不是济南。


    与此同时，山东省内一般家庭，现在投资意识超强强大。临沂，威海，寿光等地方，富人也很多的，这些人也喜欢青岛。


