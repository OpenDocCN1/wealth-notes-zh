    # 这个最贵，三年后要哭的


    京沪五年限购和新旧房价倒挂，就是为了二线城市去库存。现在浙江小地方和上海金山区房价差不多了。你不要把特殊当正常。谢谢你一家门。


    我就是那个回去了的重庆人。2016年我轰炸了北京西城区的房子，1300多万，回到重庆，在渝北区两山买了个联排不到300万，装修花了200多万，剩了800多万，买了辆车花了110万。也不去微商的投资，花了200万在西安产油新区买了两套房东，6000一平入手的。在回生银行买了300万21年的理财，年回147%，每年收道20多万钱。后我的有七八十万都锁在交付期里买了几套房期款和基金。2017年回两山区的房价涨了一倍，西安产区的房价也涨了快一倍。我科比冲道的同类了，由于新房期还没交付，只进要么也没有产生太大的交易费用，省了接近400万，又存了理财。在理财里有700万，支付能有百来万。目前在北京彩票活每月税后总有数到万元，这在百平米内的房。


    现在不上班，在短期，月收入在万多，在重庆家里四口人每月花水大来也就支出三万元左右，这就是—笔财的财务自由。


    # 六个钱包是正常的！


    千百年来，建房买房都是每个家族第一事。小时候，我们在上海搭建棚户区房子，不是六个钱包，是八个钱包，十个钱包，把爷爷奶奶，外公外婆也要拉进来凑份子。你看农村建房，也是全家总动员，有钱的出钱，有力出出力，爷爷奶奶动全部掏干净才退休。现在经济发达了，八个钱包变成了六个钱包，四个钱包，这是经济发展的证明，这是欣欣向荣的景象。'
