  md: '那些拿个不值钱文凭的博士硕士，真不要勉强来了，松山湖或许可以，京沪不适合你。


    # 商业地产越来越差了？


    是因为互联网。


    商业地产分为两大类，商铺和办公楼。


    商铺已经是大街了，互联网一键搞定。除了人对人的服务业，理发餐饮小超市，其他不是交付消费的交易，都可以通过快递解决。所以，商铺的意义基本消失了，以后改为快递站就行了。


    办公楼本来就是毫无意义的。商贸类，技术服务类的企业，就是一台电脑，打订单，录息也可以搞。办公楼最多摆点样品。以前担心是皮包公司，拿了钱跑路，最好有个公司地址，最好是装修的漂漂亮亮，显示企业实力。现在不需要了，淘宝机制完全解决了你的后顾之忧，七日内，无条件退款。还要个毛的办公室？


    # 如果你无论看到什么新闻


    都会联想到北京沪房价下跌，那么，恭喜你，你这一辈子也就这样了。


    # 真正能够遏制房价


    过快上涨的政策是，限购五年社保以上，最好是十年。


    # 为什么房价不计入物价指数？


    因为买房不是居民消费，而是纯商业行为，类似于买股票，和日常民生无关。


    房租是计入物价指数权重的。因为房租是真正的消费。当然，屌丝也不懂这些学问。他们只会呼咔呼呼的骂几句，然后去打游戏了。“老板，黄焖鸡米饭，放辣板！”


    # 面朝大海，春暖花开


