  md: '不能龙抬头，不守规矩的，必 定 要 靠 手 段！


    君子慎独，共勉。（这水平能不能评副高？）


    # 这收入在北京算什么层次？


    男，今年33岁了，国内大型央企分公司低层，一年到手35万，这收入在北京属于什么层次？


    答：有房算中上，没 房 算 外 来 漂 荡 人 口，建 议 你 老 乡 返 乡 就 业。


    # 解决大城市的房价问题，必须是雷霆手段


    调控十多年了，房价越调越高，你叫大家怎么说呢？


    解决矛盾必须是抓住重点问题。万军之中，取上将首级。首先要把北京上海的房价降下来。与其一点一点的往前挪，不如直接采取大手笔。


    +   1、立即疏散人口，没有大城市户口 的，全部劝返回乡。近三年落户的，一律注销户口。


    +   2、若做 不到第一个措施，放开土地供应，每年新增80-100万套房屋规划，5-6年内完成，成本价核算，网络公示，加5%利润出售，彻底打掉上涨预期。


    +   3、菜 是 不 是 有 毛 病？ 大 家 鉴 定 一 下。


    # 我们反对炒房，反对房价暴涨


    但是，我们这种 书 呆 子按 照市场经 济规律研究认为，现在的某些搞 法还将继续催生房地产的持 续 兴 旺 和 房 价 往 上 走。


    当前经济活动的主要表现特征是，人口流动单向，从分散的农村、乡镇、县城，向大城市，热点城市快速聚集。人口聚集之后产生了新的行业，进一步满足了新增人口就业，例如原来需求极小的快递送餐，送餐服务，打扫卫生，治安保安，在大量的人口涌入了大城市后，这些需求直接旺盛了。人口增加，业务增加，招工增加，反复循环，使大城市的人口越来越多。现在的乡村基本是看不到青壮年。


    外地人来城市后，也有几个层次的需求。


    第 一，有 个 集 体 宿 舍，晚上至少不能在狂天。


    第 二，老 婆 来 了，至少 有 个 房 间 吧，总 不 能 两 口 子 和 大 家 睡 一 起 吧。


    第 三，能 不 能 租 一 套 房？


    第 四，能 不 能 买 一 套 小 房？


    第 五，来 十 多 年 了，儿 子 快结 婚 了，我 们 能 不 能 在 大 城 市 买 个 2室1厅，90平 米？


    住房需求，一 层 一 层 的往 上走，房地产的需求不断在爆发。而有关城市严控土地出让，房屋供应非 常 短缺，不 能 满 足 市 场 的 需 求，当 然 有
    很 多 大 理 由 啊，土 地 规 划 什 么 的，这 就 导 致 了 房 价 持续的上涨，真的很难遇到。调控这么多年了，你说怎么办？


    # 房价改变了一切


    房价爆炸，改写了二十年来的城乡利益格局。


    我 刚 工 作 的 时 候，上海外环线的农村姑娘，是很难嫁给城里来。江桥，周浦，川沙，七宝，那些地方的姑娘，想想嫁给咱们市区的凤凰男，千难万难。她们农村姑娘，一年也来不了几次福州路'
