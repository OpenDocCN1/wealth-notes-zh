  md: '现在，基层部门普遍不重视就业，因为就业太好了。随便搞个机场，地铁，立马带动钢材水泥铝合金，各种管道管线，安装调试，呼啦啦的一大群人的就业就解决了。现在是招不到人啊！但是，修地铁的钱是哪来的？谁去还债？呵呵，过两年我就调走了，这事情，我管不着


    # 京沪和纽约东京（2018.01）


    现在，京沪和纽约东京，经济发展，生活水平，各有千秋，基本是一个层次了。


    当然，京沪房价比东京高一点，是美中不足。我们不要再涨了，等一等东京，甩掉二名太远了，做人不厚道啊！


    # 我对 m2 是有深刻认识的


    我只能说，不要有过多幻想。古往今来，经济发展的动力大致是两个思路。


    +   - 一是凯恩斯学派，简单粗暴。印票子，发下去，拉动就业。以工代赈，让原丝们去修黄河堤坝，但以前是金银铜市，变不出来，现在简单了，票子好使，要多少有多少。

    - 二是奥地利学派。这个恶心大了。强调高科技，创新的产品，以此增加交易，产生税费。这不是为难人嘛？


    # 怎么保证失业率低于 5%？


    我已经注意到了，H& M，Zara 这些低价服装，现在也是东南亚进口了。这是中小企业生存的一个大趋势，其他各种一般性商品会陆续走上这条不归路的。但是，我们这个腰杠杠，就是必须确保失业率低于
    5%。怎么办呢？


    简单，m2 扩容，修地铁，修农田水利，修高速公路，把云贵川的各路大山里都修上省级公路。失业就不存在了。那么这么多出来的 m2，怎么办啊？西开。我不知道！


    # 经济学是阶级斗争的正面战场


    但斌说茅台涨价，没人骂他为富不仁。


    菜菜偶尔说了一句房价要涨，铺天盖地的斗争私批判，油炸粉碎！


    屌丝最大的愿望不是自己发财，而是让别人倒霉！


    # 30 岁以下，早忘了贫穷和大面积失业


    从 2002 年起，中国内地加入 WTO（世贸）开始，我们过了十五年的好日子。经济发展，突飞猛进，一年一个样，三年大变样。


    现在三十岁以下的人，早已忘记贫穷和大面积失业的痛苦，总认为，今后肯定是会越来越好。农民工都把子女按精英化来培养（我没有其他意思）。我只能是东笑一笑了。


    # 大型外资厂为什么要走？


    说白了也简单，成本越来越高。


    外资大厂在中国，是比较规矩的，因为做账的的都是中国大学生，要是敢玩花活，分分钟有人告你。企业和员工不可能一辈子忍受的，总有翻脸撕逼的最后一分钟。'
