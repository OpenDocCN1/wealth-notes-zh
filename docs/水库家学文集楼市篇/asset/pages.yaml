  md: '4，降低企业运营成本到底怎么样了，大家心里不懂吗？


    中小企业最盼望的不是贷款，而是降低成本。只有那些资本运作的大佬才需要几百几千亿贷款，实体經濟哪里需要多少贷款啊！只要生意好，亲戚朋友立马把钱送来了，不就是李嘉房的钱嘛！现在，企业没钱，是因为没有利润，银行贷款给没有利润的中小企业，只能是短期为。治标不治本。


    # 理性看到外国商品


    你坐的飞机是美国的，拍照片的镜头是日本的，电冰箱洗衣机的铁是澳洲的，奶粉是新西兰的，你老婆的 lv 是法国的，你买的书是德国海德堡机器印刷的。你的拖鞋是中东石油炼的。你的家具木材是非洲的，你吃的肉蛋禽，饲料是进口玉米。


    # 为什么老的计划经济走不下去了？


    一是分配机制不鼓励创新，计划经济的特点是，干多干少一个样，哪怕有点奖金，也是极少的，精神鼓励为主。这时候，人的思维就保守了，不敢犯错，创新都是冒险。没有肯定成功的创新，就说得叛军。原来一直是那个样子，我能不能改变外观？呵呵，不行。如果说错，全厂职工没奖金了，谁来赔？


    二是没有进步的动力。发展进步，多累人啊！累死累力，我就这点工资，你能不能给我省点力气？我也不想多干。绝大部分人没有无偿额外劳动的想法。即使有个人非常想干，但是，他叫不动人啊。自己一个人也干不了多少！算了吧。


    三是内耗麻烦，司空见惯。计划经济，一切分配看级别。你上我就上不去了，位子有限啊！那有人就搞事情。


    你昨天晚上和张群花亲吻了，我看见了。


    你这样做是出风头。


    你这样做是对领导不忠。


    呵呵，这种事情绪越来越多，大家慢慢的把注意力转移到了互相提防。至于创新发展，重要是重要，但那是单位的重要。我的第一个任务是别被人家黑了。


    个人怎么办呀？搞好关系。王小二年年间抽佣，我要装没看见。李大铁偷东西，我赶紧回避。朱厂长找我客户捞了一只大火腿，管我鸟事。这群人，罪都不起啊。


    当然，也有一些人非常好，但是架不住大多数人思想觉悟没到啊。计划经济下的京沪第一皮鞋厂干不下去了，最后还不如浙江农村的小作坊。


    # 高科技和低科技


    都是经济学的重要组成部分。


    中国 13.83 亿人啊。欧美日韩人口加起来也没我们多。我们要是都转型去做高科技了，其他发达国家也在做高科技，这么多高科技给谁用？


    亚非拉印巴孟加拉，人口是多，但外汇少啊。印度 13.39 亿，巴基斯坦近 2 亿，孟加拉近 1.7 亿，看上去很多，但有多少人放弃欧美日韩的高科技，专门买我们的国产高科技？


    高科技和低科技，要齐头并进。我们不能只重视高科技，鄙视低科技。14 亿人口的就业，不能指望高科技，还是要实事求是，高科技和低科技并重。印度人口多，工资低，低价衬衫和塑料拖鞋'
