    # 2019年北京沪楼楼市将持续微跌，甚至爆出几个大减价的个案


    因为无论怎么降价，京沪楼市有购买力的人群越来越少。有钱的干着急，不能买，不跌才怪了。现在，京沪有购买力的大概是：


    一是外地人士留学生子女。拿了英国硕士，直接入户口，爹妈给五百万现金。但是，这种人大极少很少。你看看留学生宿舍就知道了。


    二是人才引进，必须是把老老家房子卖掉，但是，大部分人才是來自三万以下的低房价地区，厦门，南京，杭州的薪资正高，在本地有头有脸，一般不会去京沪。往往是低房价地区，特别是华北，西南，西北等。东北精英，从大-跳走人了，不会再有什么高薪出来了。低房价地区的人，老家还有父母，-般也就是拿个300万过来。这点钱在京沪买二套房的话，基本是无欲需求。


    三是本地置换，传统的买入大户。但是，他们的老破小，老破中，接盘侠是外地大学生夫妻，而他们正好是限购对象。所以，二手房房现在基本卖不掉了。没有首付，怎么买？


    四是京沪楼市限购差异。很多外地人不熟悉，北京限购表面看起来很严，但留了两个小门，一是工作居住证，二是外地单身也可以购房。北京的工作居住证，大家感觉以前办比较容易，2016年后（省略几百字）。通过工作居住证立即取得北京购房资格，现在不容易了，五年社保是京沪的主渠道


