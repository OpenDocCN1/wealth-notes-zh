    以前，我们大量出口，你不想没关系，外国人买，你还可以继续就业。但是，现在老外可以去东南亚，墨西哥买塑料拖鞋了，这一块的岗位就没了。


    内需不涨，外籍竞争，就业怎么办？没关系，大基建。我们可以把舟山沙沟淘里也修上高标准公路，地级市也修地铁。还有农田水利，治污环保，再搞几年也没事。


    钱从哪来？你是专家，你先说。


    中国经济稳中向好，我们欢欣鼓舞。


    # 如果一个城市


    最好的工作是银行电力，这个城市的经济动力基本没希望了。


    # 建议新版十万亿


    以前的四万亿是借钱给城投公司，搞大基建。这个结果是，基建和制造业抢劳动力，制造业难过。新版十万亿的意思，制造业企业，全部减税减藏减社保，三免五减半，财政不是部分，由十万亿补税，充分释放企业活力，恢复企业利润表，稳定就业，拉动股市。


    # 中国经济往哪里走？


    现在，经济形势已经是摊开来讲明了。外企民企的实际利润，大家都懂，不敢多说了。国企主要是花不完的。最大的问题是就业。


    民企是就业主渠道，但是，民企现在的压力太大了。


    一是税负高居不下了。大规模减税减藏减负担，说了好几年了，但是还在认真研究阶段，你说开心伐？


    二是企业内部管理非常难。企业对员工毫无管理力度，开除，辞退，扣钱，什么都需要取证打官司。问题是，企业取证的成本已经高过了赔偿的成本，没有实际意义。


    三是劳动力成本越来越高。这个高，不是自然的，而是无奈的。大基建无休无止的从制造业拉走一股劳动力，水涨船高推动工资上涨，产品成本上涨。


    四是销售价格无力提升。劳动力处于欠流动状态，千家万户却在压缩开支，城市买房，换房，艰难支撑大消费。医疗服务吸占了剩余支出，最后只剩下基本的吃穿用。对外出口，外商不接招，不愿意抬价采买。现在的欧美超市，还有多少中国制造？


    五是各种有关部门的呵呵。一言难尽。


    建议：


    +   1，全力以赴，支持民企往高科技方向发展，赚取超额利润，维持有关部门税费需求和劳动力'
