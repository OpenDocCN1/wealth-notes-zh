  md: '假如你选择逃避，只是把麻烦推给了下一代。


    为了孩子，勇敢向前冲！


    # 小地方真的不缺房子


    人越来越老，房子越来越多，以后空置率会越来越高，特别是地级市和县城。大家看看，整个大四川，除了成都，地级市县级市，有几个二本大学生愿意回去？整个山东，除了济南青岛，其他也就呵呵了。其他省份同理。缺房子的是大城市，而且是很缺很缺！


