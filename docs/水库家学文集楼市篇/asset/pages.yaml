  md: '1，上班远倒不是事情。买得起别墅的有钱人，大多是生意人，自由职业者，港台明星，外地富人，不一定天天上班，至少家人不上班的很多。


    2，商业配套由团购解决了。中青年身体好，医院也不急。


    3，真正麻烦的是，孩子读书难。郊区别墅区，是玉米地里建起来的，周围没有中小学，最近的农村小学也在5-8公里以外。买得起别墅的家长，怎么舍得孩子读农村小学？所以，郊区别墅进入恶性循环。不想买新房，二手房也卖不掉。


    这种情况已经在慢慢改变。成熟的别墅区，本地政府已经开始引入高质量的民办优质学校。教育问题慢慢得到突破，10年后，郊区别墅群是重大机遇。


