    +   2. 本地每年新增需求毕竟有限，又都在新盘里面摘猪捡羊毛，二手房会迅速滑落。这是京沪的普遍经验，也是目前的实际情况。


    +   3. 青岛限购，缺乏外地买家，本地摇号中奖的购房者需要立即支付首付，只能被迫降价抛售二手房给本地人。一旦市区二手房下跌，非限购区将信心动摇，僵持几个月后必然降价！


