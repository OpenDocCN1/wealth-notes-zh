- pgno: 174
  md: '答: 丈母娘和老丈人离婚, 我爸和我妈离婚, 我和我老婆离婚, 六个单身人口, 再加一个孩子, 估计不会缴税了。


    问: 若这样也不行, 还必须缴税, 怎么办?


    答: 我和老婆的收入如果没有增加, 那只能省吃俭用了, 孩子不读幼儿园了, 老婆不买化妆品了。我也不换手机了。除了吃大米, 其他消费全部停止。最后留点积蓄,
    给老人看病。


    问: 你们都不花钱了, 那中国经济靠什么?


    答: 靠 m2 了。


    问: 你为什么不卖掉 1-2 套房子?


    答: 孩子今后结婚怎么办? 到时候更加买不起了。


    # 上海现在的房产税


    上海现在的房产税, 扣除人均六十平米, 多出来几十平米, 缴纳极低的税率, 总的大概几千块到两万。相比较五年后的涨幅, 忽略不计了。如果你家住在市区大平层,
    不用考虑房产税了。


    如果继续按照这个方法征收, 那也无所谓了。


    # 以前是怎么让一个地区的房子迅速涨起来的?


    +   1. 先找个借口或者卖点, 舆论一下。当然, 这是虚的。例如 x 万亿, xx 博览会, xx 运动会, 高铁, 安库容, 反正就是个由头。


    +   2. 抢卖地, 货币化拆迁。一家给几百万, 几千万 (例如商铺, 小厂), 动员他们自己买房。于是, 楼市里突然出现一群野蛮人, 用小孩子背着现金入市了。


    +   3. 中介, 开发商, 售楼小姐, 各路专家, 哄的一下来到此处, 火爆了, 火爆了。


    +   4. 银行放水, 拆迁户的竞价还是开发商的, 楼市要吸引的是场外资金。这就需要银行积极支持了。贷款哗哗的放。


    +   5. 报纸说要严厉遏制本市本区本县房价。这下子把没想到买房的人, 也吓傻了。大家都买了, 谁也别硬扛了。老爷, 明天去看房。


    +   6. 然后, 房价就按照自己的逻辑演绎了。


    +   7. 等本地房子销售差不多了, 当的一下, 严厉限购, 封山育林了, 积蓄下一波正能量了。


    # 严厉限购, 彻底避免集中性的逢高抛售


    基本确保了不会出现大范围的下滑趋势。大家的想法是, 暂时不涨了, 是因为限购, 而不是价格虚高。于是, 大家继续攒币, 三年后, m2 上来了, 自然就谈事了。


    投资的核心是, 集体性思维。其实, 海淀区, 朝阳区, 内环线, 哪里值十几万一平米啊! 只不过, 大家现在认为值这个钱。


    房价要下来, 必须来一次, 彻彻底底的大波动, 直接打三折。但是, 这个不可能的!


    你认命吧!


    # 不交税的, 直接判刑


    刘擎: 房产税该不该征我不关心, 但你非要论证收房产税会拉高房价我就不赞成了, 要不咱试'
