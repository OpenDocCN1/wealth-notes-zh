  md: '上有合道理的原因，但永远不会有人会完整的告诉你，为什么历史上不是这样的，欧美日是不是这样的？

    我也不会告诉你。因为这是长期战略。战略目的，你自己想吧。


    # ## 世界上有一门课叫做经济哲学


    但没人研究。这玩意没有实用性，既不能考证，也不能做笼，大家不感兴趣。实际上，这种知识是真正的屠龙术，是大国决策的价值取向。有些话，有些事，是永远不会出现在公众场合的。要理解一个重大长期政策，不是那些垃圾员给你扯扯热闹，而是要看懂贯穿决策的内心依据。


    # ## 我谈的经济学


    都只说一些浅的内容。真正深层次的东西，我是不敢说的。举例，西方经济学中，“资源诅咒”是一个大家都听说过的名词，也知道大概意思，就是卖资源国家，经不起外贸波动。


    但实际上，外国人当初发明这个概念的本意是：任何一个经济体，必须防止底层人太有钱了，必须千方百计把底层人的钱拿走。资源诅咒，只是这个思想的一个例子而已。当然，这是万恶的资本主义思想，和我们无关。


    中国经济稳中向好，我们欢欣鼓舞。


    # ## 外汇安全，就是粮油安全


    中国经济最强大的创汇机器，不是什么高科技，而是我们鼓励恳急，自产自销的中小企业。塑料桶，做锤子，滑板车，是真正的原创竞争力。那几个最牛B的手机民企，有哪个可以摆脱美国的重要零部件了？没有。别看平时吹牛厉害了，若被断了软件硬件，真不如我们做篮筐的。


    在你好我好的蜜月期，花枝招展的外企，屁股一扭，满地春风，给我们带来了不少三来一补，我们也可以赚点人工差价。如果不开心了，丸企分分钟走人，不留下一个铜板。


    黄金，很好。省省一万字。


    所以，要千方百计支持制造业，特别是有国际竞争力，有创汇能力的小企业，不说多大气实力，至少让他们喘口气，活到下一个蜜月期。何必急呢？反正他们天天在天上飞，也跑不掉的。什么时候想倒霉了，还不是分分钟的事情。


    现在，在经济形势不明朗，多留一条路，多一个备选项，总是好的。等我们真正掌握了核心技术，掌握了芯片，高芯片，再找个理由去抢小老版，依法严厉打击少交税的社保个税，也不迟啊！

    中国经济稳中向好，我们欢欣鼓舞！


    # ## 至今还有很多人


    主要是领工资的那些人，认为：川普是为了中期选举，和我们玩过家家。不理他就行了，不必太担心。他们还历数了历任美国白宫对华态度的转变，总结出了一套白宫三步曲：初期为了上去而骂驾。中期为了生意而缓和。后期为了自己日后求华做讲座而谈友谊。完美入设。


    我想说，专家们不要太简单化了。我们要抓紧内部准备，迅速把各行各业可以创汇的企业扶持起来，准备粮食，准备长期战。不要轻敌了。


    川普对外征税，我们对内呵呵，美国确实不够意思。


    中国经济稳中向好。


