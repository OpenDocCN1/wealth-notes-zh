  md: '深圳方案中，肯定是体制内的人容易申请一些，例如公务员教师医生研究所，因为他们有职称，各种证书比较齐全，而在社会上打工的，包括工矿企业的一般职工，就比较难了。这些人估计连职称都没有。而往往最缺房子的还是这些中低收入家庭。


