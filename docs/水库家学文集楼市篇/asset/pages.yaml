    现在是金融和货币主导的经济模式，我非常担心，很多中西部地区理工科的985，最后变成250。他们看待问题，喜欢用能量守恒的思想，用曲线运动的思想，例如，房价高了就会跌，低了就会涨，认为经济学是个完美曲线。'
