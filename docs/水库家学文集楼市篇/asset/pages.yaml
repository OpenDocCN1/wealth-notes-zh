    男朋友是正式海员，大学毕业去年工作的，我师范研究生，明年毕业。落不了户。都是村里人，买房子里补贴不了钱，男朋友想歇一口气，攒钱给五年后，在上海买房。看感觉不太靠谱啊，房价涨得太快了。担心五年后上海的房子买不起，别给二线城市也各种限购，到时候就真的哪里都不能买了！

