    # 中国经济改革


    现在的任何经济发展新方法，必须同时满足以下条件，你看还能怎么办？


    +   1. 国企要过得好。

    2. 银行要过得好。

    3. 公款单位要过得好。

    4. 医疗教育单位要过得好。

    5. 一般收入人群要加工资。

    6. 退休人员要加退休金。

    7. 农民要增收。

    8. 楼市要猛烈去库存。

    9. 房价，省略一万字。你懂的。

    10. 财政要增收。


    注意，是同时满足这十个大条件！


    那么剩下的选项项就是两个了：一是民企多贡献一点，二是m2 动动脑筋。


    我水平低，实在想不出什么思路了。你是大学生，你来提！


    # 中国经济的优势


    人口规模大，语言基本统一


    现在港台吃瓜妇女开始追内地剧了，例如最近热播的几个宫廷大戏。当年如日中天的TVB，基本沦为街边小店了，服装道具反复用，丢人丢到姥姥家了。其实原因也简单。港台的人口基数太小，一部戏是无法接受几亿元以上投资的，因为真的收不回成本了。以前香港电视剧辐射内地，东南亚。


