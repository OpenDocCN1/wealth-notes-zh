- pgno: 179
  md: '菜菜：房价不涨，利息猛涨。银行抢了开发商的净利润。屌丝喊了半天，啥也没得到啊！


    这次楼市调控，意义重大。开发商的利润和税源，原来大部分是留在地方财政。这次，死压房价，狠涨房贷利息，通过银行系统的垂直管理，于是把楼市财源转移到顶部层级了，一鸭三吃，皆大欢喜。


    无房户得到了什么？你是大学生，你先说。


    # 调控十年了


    你觉得内环线漂亮公寓，离你越来越近了呢，还是越来越远了？


    # 房价是什么？


    +   1，房价和成本，没有一毛钱关系。就算是单位免费给你的房子，你也会卖五百万，少一分钱都不行！


    +   2，房价和供求关系也没关系。就算是不让买了，大家还是不肯走，眼巴巴的守着，像个贞洁烈妇。


    +   3，房价和货币也没关系。m2还在扩张，环京已经绝掉了，动都不动一下。


    +   4，房价和人口也没关系。房价的波动幅度远远大于人口的进出。


    +   5，房价和供给也没关系。京沪无论供地多少，反正你买不起。


    +   6，房价和调控也没关系。调控了这么多年，已经成为连续剧了。


    房价实际上是一种对未来的预期。


    心若在，梦就在，大不了从头再来！


    # 福利分房的苦楚


    我是那个年代过来的，福利分房有多内幕，真是不堪回首。


    +   一，单位有多少房子，普通人根本不知道。不要以为分房子都是公开的，很多事情，只不过你不知道而已。


    +   二，一套房价值五百万，少说点也要两百万。很多人卡卡在了可上可下的档口，还能怎么办呢？大家都懵。


    +   三，房子福利分配，完全是按级别排队。那么，你的一切就掌握在领导手里了，你真的喜欢一辈子围绕单位副总，使劲巴结的那种生活？


    +   四，同级别的，看工龄或获奖等因素。这里面大有奥妙。分房子之前，都会排出一个表格。同样是副科级，A 老是五年工龄，B 女是三年工龄+论文二等奖。领导想给
    A 看，就把工龄分值拉高。领导想给 B 女，就说鼓励科研，把论文分值拉高。你没地方哭的。


    +   五，普通工程师分房子，排队三十年也不一定保证。


    # 当年是如何被福利分房坑了的？


    A 男硕，25 岁进单位，业务骨干。


    B 妹纸，小中专，财务，嘴甜人美，当年领导经常报销各种餐费，所以她知道全单位大部分内幕。


    174'
