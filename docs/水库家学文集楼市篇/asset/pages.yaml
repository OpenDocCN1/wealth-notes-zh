  md: '假设你在老家或者京沪隔壁区域，因购买继承，已有两三套，如果禁止在京沪购买第三套，那直接反应就是，卖掉小地方房子，腾房票。这个情景蔓延开了，对二三四线城市的财政和楼市的打击，实在是太惨烈了。


    京沪家庭在环京，海南，重庆，嘉兴等不限购地区，买第二第三套房的情况很多。例如老夫妻在京沪只有一套六十平米老公房，住住是卖掉老房得款 400-500 万，大部分留给儿子在京沪首付一套新房，老夫妻在环京环沪的便宜地方买个房子养老。这是化解社会贫富差距，缓解大城市住房紧张的好办法。


    若干年后，儿子媳妇有能力在京沪买第二套，如果禁止全国第三套，那么肯定是卖掉二三四线房子，聚焦京沪，因为孙子结婚也要提前准备了。卖外地，买京沪的情况一旦蔓延，小地方楼市就关门吃面了。这就涉及到，理论界怎么看待楼市作用的问题？


    目前看，京沪人口拥挤，交通堵塞，房价暴涨，确实需要严格限制楼市，减少人口。但对于很多二三四线城市群，楼市是当地数一数二的支柱产业，卖一个楼盘就是几十亿，小地方要创办一个年销售几十亿且赚大钱的大企业多困难啊！小地方财政收入的大部分和楼市相关，拉动了装修和家具家电销售，对就业影响巨大。如果因为京沪限购，导致小地方抛售房产，小地方的有关部门是绝对不愿意看到的，这就等于为地方倒贴盘地方。


    除非在全国层面彻底放弃楼市的经济拉动力，彻底否定财政对二三四线城市依赖，否则全国禁止三套房的政策只会是小地方吃亏，京沪其实也没啥影响。


    # 我是楼市投资温和派


    讲究的是赚时间的价值，在力所能及的情况下为下一代铺路打桩。


    高杠杆，搞边缘。空当稳龙，红包大法，是烧大赌场，我是坚决不赞不说的。我也希望中年富裕起来，不要去碰这些打法。我们就老老实实过点小日子，赚点长期利息，稳健当当。等把接力棒交给下一代，我们就去环球旅行啦！


    # 你有没有去过豪宅的售楼处？


    2000 万以上的，你在里面是什么感觉？


    # 杨牛刀一真暗示


    楼市马上要冷冻，开发商债务到期要挥泪大甩卖，大家不要急之类的。这是思想不成熟的稚嫩。


    房地产行业是国民经济的重要部门，是财政的半壁江山，是带动上下游两百个行业的经济发动机。我们对经济调控的能力那么强，又是人民币计价的内储物资，怎么可能垮了，疯人说梦啊！


    # 绝大多数人根本不研究楼市


    这几天，下车间，进工厂，购买学校，看群租房，做了大量田野调查。


    +   - 居然，还有好多年轻的大学生认为，房价涨到头了，应该要跌了。

    - 三十多岁的中青年白领普遍认为，快买。

    - 四十多岁的大叔，基本不关心房子，反正也买不起了。

    - 五十多岁大爷大妈，因为子女大学毕业要房子了，已经进入神经兮兮状态，不知道将来是涨是跌，度日如年。'
