    现在的人才房是六年封顶，也就是说，你不能住一辈子。而且，住在里面，要符合很多条件，如果不符合条件了，就必须搬走。实际 上，正常家庭是不能搬家了，因为孩子读书有问题了。中小学同步等学的难度，比买房还大。


