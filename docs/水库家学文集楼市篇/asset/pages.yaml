    # 上海经济往哪里走？


    现在，很多人心浮气躁，看到互联网行业好几年，好像上海没有做大互联网行业，就了不起了。其实，这是思维有障碍的表现。


    上海的经济定位是很明确的，做中国的客厅。深圳杭州，勉强做个车间吧。客厅的要求是，漂亮，整洁，规范，方便，适合居住。你们在外地厂里好好干活，赚到了钱，来上海买一个小户型。


    好了，下课！


    # 我曾经的房客，租了大半年就走


    我的房子曾经出租给一个上海互联网小公司。几个外地小年轻在办公室里开公司，租了大半年就走了。我和他在收钱的时候，聊了几句。原因也很简单。


    +   1，公司的几个主要技术人员，房子买在了远郊区，青浦，嘉定，松江。而公司在市中心，每天上下班和加班，受不了。上海没有什么北京城中村和地下室。


    +   2，上海的成本太高。市中心房租贵，劳动法太严格，招个小妹接电话，都要五险一金，一个外地人要在上海市中心活下去，至少六千元工资，还是活的很惨。月薪一万没房子，算是不下收入。小公司现金压力太大。


    +   3，六个月没投到风险投资，就完。了。


    # 互联网的起步，在北京是肯定的


    北京是互联网的发源地，这个是没有任何疑问的。原因也简单。


    互联网的起步是新闻网站，例如 sina，搜狐，网易。内容之后是辩论，这大致是属于宣传口。地方政府没必要去做这个敏感东西。万一点了炮，也没什么好处。所以，互联网的起步，在北京是肯定的。


    在中国，一切内容，都是需要审批的。而审批内容，特别是可 能涉及到敏感内容，地方政府是不愿意去碰的。阿里巴巴是卖货的，微信 QQ 是私聊，不涉及内容发布，后面发展了另说，但起步肯定是纯商业事物。


    上海后来也想突破互联网，但失败了。上海是全国互联网金融的发射地。你看，绝大部分闪瞎跑路的 p2p，都和上海有关，大多数是注册在浦东。据说那个南京钱宝，总注册地好像也在上海，更不要说什么中首合伙人之类的，纯粹是本土骗子。


    # 我说个所谓的门道


    浙江某县是个皮毛批发地。我听一个朋友说（我没研究过这个门道），皮毛是十月份，山东河北的农村地区生产。但是，需要貂皮狐狸皮的大衣厂，是次年五月份采购皮毛，农民没钱过年，需要有中间商收货，半年后加价出售。'
