  md: '# 如何处理购房问题？


    首付满了就立即买，不要想多了。长远看，没有吃亏的。


    # 我为什么要买房？


    爷爷奶奶外公外婆，爸爸妈妈，会有 3-5 套房给我，我为什么要买房？


    > 答：我从来没见过哪个人真的继承到了这些房子。原因很复杂。


    首先，爷爷奶奶这一辈，他们一般是多于子女的，所以不可能全部留给你。


    第二，现在老年人再婚非常普遍，一旦找了老太婆，嫁了老头棍，你就不可能有任何遗产。反而要求后背供养他们。


    第三，现在 6070 后的父母，丧偶离身后，再娶再嫁的达到 99%（我周围），子女彻底悬了。


    # 楼市不是经济学问题


    我印象中 90 年代中后期，上海购房就业读书，必须要有上海户口。这是北京沪房价格最大的法宝。


    全国楼市看京沪，把京沪楼市平抑下来，其他地方，迎刃而解。但是，楼市平稳意味着看开发建设销售将趋缓下滑。很多小地方经济不发达，地方财政将直接进入围绝期。


    2000 年前后，很多地方工资都发不出来，就是靠开发房地产，才使得财政收入的突飞猛进。


    如果把房地产抑制住，这些地方的财政收入如何安排？需要有新的替代办法，很多小地方曾经搞过招商引资，但是非常困难。


    这已经不是经济学问题，而是利益再平衡的问题。


    # 清华本科毕业，买房困难


    菜菜：我是清华本科毕业，买房困难，父母不给力，家庭不厚，奈何不已。我非常担心同龄人在经济方面超过我。怎么办？


    > 答：清华校训是，自强不息，厚德载物。大学毕业只是人生的开始，而不是终点站。你要早日忘记曾经的辉煌，在新的人生道路上继续努力拼搏。实在不行，也可以向二师兄那样安安静静的吃软饭。这一点，我们有优势的


    # 房产大 V 里面出过房产专业书的


    董蕾，杨红旭，欧战效，菜菜。菜菜的发行量最大，再版四次。


    吴晓波一般是财经类作家。


    还有几个不要脸的，是牛刀，时寒林，andi 谢，遥遥是笑话。


    # 6 号床，加大电流！


    “丢脸病人：我还是多读书，拿长远眼光来看，房子的问题不是问题，可能现在是个问题。就好比以前没电视的时候做梦都买不起电视，现在家家有。中国迟早回归转型的，但你的机会只有一次，不要在半睡醒的句式，还真得有诗和远方，眼光长远一些。


    151'
