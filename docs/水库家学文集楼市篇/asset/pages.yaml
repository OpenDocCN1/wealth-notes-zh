  md: '凯恩斯的内涵很简单。失业加剧时，多印钞票搞基建，大家都有工资了，商品就有人买了，市场再次繁荣，失业减少。麻烦是，家家户户的钞票不会一次性花完，必然有一部分结余，人们就想保值，不动产价格不断上涨。外地大学生就住开心了。


    我们都知道凯恩斯主义的缺点，问题是，有比凯恩斯更好的办法吗？裁员的原因很多，例如微信来了，传真机厂就垮了。手机视频来了，彩电厂就垮了。这种零零碎碎的倒闭，没什么坏处，彩电厂的员工可以去手机厂，反正都是搞螺丝。真正可怕的是，企业普遍不要气，商品卖不动，街道裁员。


    理论上说，销售少了，税费也会相应的减少。实际上不是，反而更多了。


    首先，社保基数年年增加，倒逼你交钱。


    第二，税费是下指标的，正常的税不够，那就鼓励举报，深挖历史。中因几千两小公司个体户，小老板和兼职会计不可能比执法部门还精通政策，要想让你交钱，有的是办法。


    第三，金融部门，趁火打劫。企业的大环境不好，贷款风险欲上升了，银行直接加利息。明面上不让加，那就搞暗的，让客户给银行做回报。一般有两个办法：


    +   1.  贷款利息算一年，实际上只能给你用10个月。你必须提前两个月放回账上。

    2.  贷款总额算100万，实际上只给你70万，另外30万只是放在账上看着的。


    如果你敢得罪银行，你就倒霉了。


    走到这个地步，中小企业基本上就是砧板上的鱼肉了。


    结论：共克时艰，减税减费，给中小企业喘口气，是利大于弊的。。


    # 菜菜现身说法，财富自由是什么感觉？


    第一阶段，随心所欲。


    不用上班了，睡到自然醒，想干什么干什么，去旅游，去吃饭，去逛街，看电视剧可以看到凌晨。如果你有烧的业余爱好，再也不要把心软求领导知道了。


    第二阶段，无聊。打亏同事门近况


    自由在自的日子，你过上十个月。等寒秋冬走一圈，你就无聊了。在这一年左右里，像一般也没什么新朋友，就是玩。玩够了，就觉得没有什么新的信息。与此同时，你的老熟人门开始有变化了。有的升官了，有的点背出事了，有的出了大新闻，有的离婚了。反正你会很好奇。


    第三阶段，无人搭理你了


    职阶无朋友。你的老熟人对你的一个失业人员，完全没有兴趣，基本和你断了，逢年过节没人联系你。你也没有新朋友。总不能在小区找人玩吧？这时候，你会觉得很孤独。


    第四阶段，自己找点乐子


    例如搞个小生意，不图赚钱多少，就是有个社交圈子。我是写微博，打发时间。


    # 国产手机在印度市场碾压苹果？


    现在的数据，貌似是这样的，但宜啊，但是，我们不要忘记十年前的教训。在越南，国产摩托车曾经把日本摩托车打的满地找牙，但说几年就因为质量太差，全线溃败。


    我用过所谓最好的国产手机，我是一吐为火。两年就不行了，卡的想骂人。我买你的机器，放弃了面子，不就是图个实惠吗？你倒好，便宜是便宜了，但是不能用啊！


    我买的iPadmini，2013年11月首发，现在升级为iOS12，速度快得很，完全没问题。'
