    # 微积分是骗外行的


    如果你 在专业期刊以外的场合，发现某篇经济学文章看不懂，这说明作者是个小忽悠，不懂装

    懂，堆弄各种怪怪语气的所谓词汇，显得自己好像很厉害。

    这类文章一般是二本学生写的。真正的优秀作者，在写的时候就会考虑，如何让其他领域的读

    者看懂。经济学是普世价值观，没有什么深奥的，微积分是骗外行的。


    # 在岸人民币和离岸人民币


    为什么汇率不同？


    +   1、在岸是指国内交易，离岸是指境外交易，主要是香港新加坡，和内地经贸往来较大的地方，

    他们有人民币兑换需求。例如回内地，先兑换好一些人民币，免得打车都找兑了。

