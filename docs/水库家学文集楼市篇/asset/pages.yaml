    每日上海：#上海身边事#【他精心打造 2400 m²别墅，只为度假用】任先生是一名艺术收藏家，曾留学法国。2009年，他在上海市区买下一栋套内面积 800
    m²的别墅，带 1600 m²花园和 200 m²游泳池。不喜欢房子摆橱窗，浮夸水晶灯的80年代装修风，任先生请来好友兼设计师袁宗彦，历时3年，将它打造成了优雅的法式大宅。via一条视频


    莱莱：这种房子完全没有实用性。上海需要开空调的时间，差不多是八个月，像他这种完全敞开式的房子，要么太冷，要么太热。抽烟机也无法工作。敞开式的厨房根本不适合中国人的饮食习惯。室内没有电梯，住起来也很累，唯一的用处可能就是给别人拍电视剧。


    # 我的可爱查友


    我跟查友讨论买房子，他们说房子就是用来住的，不管是在自己的还是租房，都行，还说现在到处都在建房子，之后迟早会有房子来给人住。而且国家有政策，我们不用考虑房子。他们还说，有几百万的话，把钱用在做事上，回来进一些好的单位，这些单位可以给他们分房子。


    答：你同学大概是傻子吧？


    # 这房子算谁的？


    上海房产专业律师：我是外地户口男，婚前，在上海父母的坚持下，我付首付，女方一人名字。我的本意是双方共有，但我买房时是外地单身，不能加名字。现在结婚不成。这房子算谁的，怎么分？


    答：房子是男方实际出钱，女方婚前购买，且女方一人名字，分为两种情况：


