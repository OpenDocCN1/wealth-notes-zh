    # 丈母娘是楼市调控的最大障碍


    我建议，各社区要开一个丈母娘岗前学习班，整顿一下风气。什么三室两厅加名字？瞧瞧，最多二居室，不能再多了。


    现在的丈母娘一般是60后，就是当年“外销堵人墙，公民野战队”的女将妈妈们，受够了没房子的痛苦。上海大规模改善住房是2000年后，这批丈母娘一般都是在棚户区结婚生育的。所以，她们对房产证的高望，那是刻骨铭心的。你不要指望这些老娘们好说话，想都不要想。麻烦的，赶紧去售楼处。加名字！


    # 彩票：秒懂


    【人民日报微文：房地产税法拟6年内提请审议】人民日报社旗下公众号人民日报微文文章披露，9月7日，全国人大常委会召开立法工作会议，将深化税收制度改革和全面修改税收法定原则，修改刑法修正案、制定增值税法、房地产税法等8个部门法，全国主任薛明辉接受了记者采访。许安排，五年立法规划安排的重点领域立法主要包括：深化金融体制改革和防范金融风险，修改证券法、商业银行法、中国人民银行法、制定期货法；深化税收制度改革和全面深实营改法应原则，修改税收征管管理法、制定增值税法、房地产税法等8部门税改法法。人民日报微文：房地产税法拟6年内提请审议


