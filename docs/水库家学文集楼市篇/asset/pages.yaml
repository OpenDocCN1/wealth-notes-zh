  md: '第二，消费没跟上。小龙虾的特点是，大排档的俚品，家里吃是不多的。因为小龙虾自己做，味道不行，必须是小饭店搞才行。大排档不是必需品，一般是人高兴了，赚了钱，才去来一顿。今年，各行各业，生意不好做，卖房卖车卖衣服，消费动力都不足。


    供大于求，谁都知道。你不知道的是，为什么农民降价也没用？


    餐饮行业的成本，不是原材料，不是小龙虾本身，而是房租、营业员工资，装修，环保费等，这些成本还在快速上涨，小龙虾成本便宜十块八块的，顶个毛线啊？


    餐馆老板的态度很明确，我是不可能减价的，因为营业员还在要求加工资。小龙虾卖不动，我就卖点别的，总不能亏本吧！


    ![](img/fe0763d1c3cef9e2b76dd74a0e5520f1_287_0.png)


    # 各位网友


    尽量不要谈论敏感内容，你承受不起后果的。我们就说话“花前月下二木子”。你就是个普通人，不要幻想自己是个角，不是的。你连个三线歌手都不如。


    # 破七会不会利好出口？


    关系不大。


    人民币贬像3%，相比较10-25%的美国关税，微乎其微。更何况，现在每年工资社保，环保成本增加，远远超过3%。'
