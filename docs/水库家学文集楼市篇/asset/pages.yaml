  md: '# 经济体的就业结构都是二八效应


    任何一个经济体的就业结构，还是二八效应。20%的岗位需要专门知识，法官医生教师会计师工程师等。80%的人是操作工，一共十个动作，只要培训几天就行了。把 80%的人拖入无休无止的读书竞赛，对整个社会是巨大浪费。


    扩招前的教育制度是对的。大部分人在初中就知道自己不是当工程师或研究员的料了，早早的去炒砂子当厨师。现在反而是高收入人群，五星级宾馆厨师长。那些砸破绊绊考大专的，反而下岗了，浑浑噩噩大學生，现在是隔壁的主力。


    如果你家孩子是读读书料，能够考上 985，还是要支持。如果也就是个三本高职水平，真不如学个卤鸡爪之类的谋生之道。当然，底层是不服气的。他们最喜欢诋谩谩造。好吧，你咋咋滴吧。你，几本？


    # 一种超级淳朴的想法


    最近在外地发现，很多二本三本的大学生（已经毕业，中低收入），从来没有去过京沪，只去过省城。


    他们有一种超级淳朴的想法：京沪生活不好，房价贵，省城最好。


    # 这两年，我最震惊的一件事


    就是正经上海人已经开始跑到杭州去上班了。


    讲实话，我内心是五味杂陈。我知道这是必然的，我也早就说过了，京沪的未来，是全国首人的消费和服务城市，重工业，轻工业，电子网络，都是劳动密集型，京沪要不起。


    但是，这一天就这样悄无声息的来了，我还是很吃惊的。


    # 我预测（2018.03）


    个税起征点是 5000 元。（一个星期后，你们来膜拜吧！）


    # 为什么很多美国上市公司回归 A 股


    为什么很多美国上市公司（内地企业）纷纷要求回到 A 股？


    答：因为内地的股价明显偏高，高 50-100%以上。这两个好处：


    +   1.  套现后，股东身价大涨。

    2.  不套现，股权质押给银行，贷款总额大幅度上升，缓解资金压力。

    3.  太阳底下没有新鲜事。


    # 郁金香泡沫，已经永远消失了


    所谓价格泡沫，必须有个前提，货币总量基本稳定。如果某个商品价格暴涨，会导致社会上没钱维持这么高的价格，最后价格崩溃。郁金香时代是金市，香港是浮动联系汇率，日元有广场协议，货币总量是强约束，泡沫是必须破裂的。


    但是，如果某个经济体的货币是不受约束的，那么就根本没有泡沫，只不过是水涨船高而已。'
