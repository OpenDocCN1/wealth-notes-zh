    不久前, 我知道的一个师范类研究生, 考取了市区小学的公办编制, 激动的直跳。这个年轻教师是外地小县城飞飞出来的金凤凰了, 最后落到了大城市的- -个小学。中小学英语教师实际上是要求名校专业本级的,
    虽然不一定明说。待遇是, 外地户口教师, 七年后可以申请上海户口。


    教小学生, 有必要这么搞吗? 上海以前的小学老师, 大部分是小中专, 初中毕业就读师范学校, 毕业就开干了。不也很正常吗? 当然, 这个事情和学校, 和教师,
    都没关系, 这个问题是经济学问题, 资源配置。


    大城市凭借其秀的氛围, 少量出人头地的机会, 相对高一点的工资, 源源不断的挑走了小地方的人才, 资金, 学霸, 美女等等- -切的资源。合理吗? 从个人角度看,
