  md: '女人出去搬个三五万，一家人吃饭也够了。男人也没什么开支，就是玩玩手机，看个东京爱情片，上网猜猜财宝盆，三百块零花钱，抽抽啤酒也够用了。要是遇到谁家装修盆房子，他去干个短期施工，还有点小收入。或着托人干个停车收费员，家门口餐馆后勤，一个月两千块，自己开支也够了。


    四，农民工往过得得好一些


    农民工一直是个体力活的，动手动脑，这就有了优势：一是思想优势，干久了，没有思想包袱。一年七八万打底，没有这个收入，心里发慌。二是有劳动技能，相同行业总有招工需求，自己干了十几年，当个小组长都没问题，技术好的，直接是车间副主任了。三是身体习惯了长期劳动，闲着不干还会出毛病，适当干干活，还舒服一些。这种农民工，往往可以干到六十岁。


    部分县城男到了四五十岁就溜了，诸随随意，农民工夫妻，不生大病，往往可以干到六十岁，两个家庭的差距就是十几年收入，儿子多套县城的二层房。


    结论：县城的体面就业，严重不足。早点走吧。


    # 菜菜的经济学理念


    金融是本，财政是末。


    用金融的眼光看房价，很容易随波逐流，东张西望，不知所措。我心脏怦怦跳。


    用财政的角度看房价，方向清晰，一敲就看，非常稳健，犹如老僧入定。


    # 货币贬值


    对外资企业的影响就大了。


    正常情况下，外资企业在本国经营，都是美元换算成本市使用，企业有 10%的净利润，已经不错了。如果汇率贬值 10%，外资等于一年白干。如果贬值 15%，外资就亏老本了。


    一旦形成贬值预期，那做什么也不想干了，走了才不亏。


    如果这个外资是内销为主，例如某些香皂汽车，贪图还有利润，但是股东是外国人，投下去的本钱，拿不到利润，积极性就不高了。


    中必赢是肯定的。


    # 我们70后,小时候是很穷的


    我在上海，没饿肚子。很多中西部农民孩子，他们在我大学里告诉我，小时候连吃饭都吃不饱，当然，地瓜还是有的。我读小学的时候，经常有外国人来参观学校。外宾们随便拿出一个东西，都是我们没见过的，哪怕是钥匙圈，我们都当做宝贝一样珍藏起来。读读高中的时候，亲戚给我一个电子表，我激动的抱着睡觉，谁也不让接。


    转眼三十多年，京沪在城市建设方面已经超过纽约巴黎。美国中产家庭收入大概是五万美金，相当于 35 万人民币，其实，上海中产家庭也差不了这些数字。实在是恍若隔世，难以置信。


    # 你小龙虾自由了吗？


    为什么小龙虾不好卖了，降价也没用？


    首先，肯定是供大于求了。这些年，养小龙虾的赚了钱，技术也上去了，养殖范围进一步扩大，产量大大增加。'
