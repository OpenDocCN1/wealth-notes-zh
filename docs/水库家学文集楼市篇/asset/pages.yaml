    # 为什么首套政策


    只卡到本市无房，而不是全国全省无房？这是财政原因。


    技术已经没问题了，关键是后果。如果以全国全省无房，作为首套标准，那么所有的三四线城市的楼市就会迎来换房大潮。你就吓会说，转让给父母。改名字，就是大几万费用，今后你总是要继承的，又是一大笔钱。而且，三四线趋势向下，早晚早晚益。


    大家拿了卖房款会如何？存银行是不划算的，肯定集中到大城市改善住房了。房子本身的成本，微不足道。房产的本质是财政收入。如果出现这种小地方购房潮，相当于小地方的财政收入源源不断的流入了大城市，这个后果是大家不愿意看到的，也是无法承受的。


    # 在京沪，如果买房靠自己


    基本就是人见人嫌的老光棍了。


    # 棚改和旧改区别


    +   1. 棚改以拆旧建新为主。力度大。

    2. 旧改以修修补补为主。力度小。


    # 二套房首付七成，


    剥夺了大多数女性买房的可能性。


    研究经济问题，不能脱离实际。实际情况是，男方大多数有婚房，首套资格，首付三成，很多家庭也能够接受。女方大多数无房，原因很多，例如父母妹妹还有个别儿子，实在无能无力。


    +   1. 男方婚前用掉了首付资格。婚后再买，就是首付七成，按照目前的大城市房价，正常人基本不现实了。女方也就没房了。

    2. 男方婚前有两套或更多，女方永远不能拥有房了。


    现在的高婚率，京沪东北等地区，接近四成。大量的女性面临离婚后无房的悲惨境遇。


    建议：


    +   1. 男方适当补偿女方。女方的首套资格被男方用掉了，这个宝贵资源，应该得到补偿。

    2. 限购政策要充分考虑女性利益。例如，婚前首套，也可以实行首付三成，依法保障妇女的经济权利。'
