    # 破七对房价有影响吗？


    房价是要审批的。和成本没有太直接的关系，建设成本略有上涨。


    +   楼市是纯内销产品，和外汇不挂钩。当然，少许的间接影响还是会有，建设成本略微增加。


    +   2，工人工资可能要涨价。因为工人的生活里中，有一部分是食品，石油制成品。这些是进口的，可能略微涨价。


    +   3，房企的实际成本，例如汽油，铁矿石，进口大型设备，可能略有涨价。


    +   3，房企的融资成本涨价。很多房企的资金来源于境外融资，例如广州的几个土地大佬，现在银行卡住了资金流入房地产，他们就靠境外融资。借入美元，还钱的时候，要把人民币换成美元，这个兑换成本就大了。


    但是，房价一直和成本的关系不大。房价主要取决于人口流动，m2，限购，备案价审批，其他行业盈利情况。


