    么多提前买了？以后互换未来支去不方便。


    这几年，很多在外地工作过的中肯年重庆人，回重庆买了好几套房子，等增值，结果这些年也没增值，还被周围很多人嘲笑。于是重庆的经环境里，就没了买房等涨价这个概念。


    重庆的女性小老板特别多，女性创业的比例远远高于男性，而女性往往是希望家庭主要时机。炒房买房的意识一直是低迷的，重庆的老太姨或者家庭主妇，更加喜欢买别墅，对于市区的
