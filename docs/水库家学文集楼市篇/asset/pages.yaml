    工资：孟买工人可以罢 gong，工资是 1000 元/月+奖励，新德里工人不能 ba 工，一个月休息四天，一天工作 12 小时。工资是 1500RMB. 缺点就是工人太赖，还有政府限制他们用自动化，因为用自动化消化不了就业。


    工厂：印度低压电生产工厂老板抱怨，中国这两年产品涨价太厉害，不得重新找渠道或者自己从中国开模具，放在印度生产。江苏的纺织机械已经是印度的通用品。


    总括：印度私营企业，就像是十多年前的温州小厂，虽然刚刚起步，但充满希望和热情。


    # 卖掉老家资产，来上海买房


    莱娱告诉我，外地某生意伙伴前几 年把孩子送到上海上班，今年有了购房资格，迅速卖掉了老家全部资产，凑了八百万现金在上海买房，准备退休后，老夫老妻来沪带孙子。


    京沪是全国人民用真金白银投出来的宫殿啊！


    # 大部分县城，将迅速衰败


    现在的资金流是这样的。


    孩子大学毕业了，按照家庭条件，往京沪，广州南京杭州，省会，热点城市就业，然后，老家的房子卖给换盘侠。一层一层的把资金往大城市搬运。末端就是县城，靠农民工回乡买房接盘。但是，越往下，接盘侠的质量越差，所以，县城很难得到暴利！


    # 小地方的人就会吹


    傅蔚冈：今天在杭州听到一个脑洞大开的说法：今后上海将是一个宜居城市，成为杭州的后花园。


    菜菜：西湖大学要超过清华了。郑州要建设国际化大都市。呵呵，小地方的人就会吹！


    # 萧山不是杭州的？


    叮咚叮当：正宗杭州人才讲杭州话，南到六和塔，北到环城北路，西到环城西路，东到环城东。以外的全是乡下人，还真以为萧山也是杭州人呢？搁笑了，杭州人在纽约伦敦有豪宅的多了去了，有能！


