  md: '净。富人都是偷鸡摸狗的。这种思维反复传递给了下一代，往往就造成了新的固化。


    中国经济走到世界第二，是真刀真枪练出来的。内环线的大楼，都是一砖一瓦盖出来的，大多数富人决不是什么你想想的偷奸耍滑。很多失败者总想回到过去大锅饭。其实，在那个年代，你爸妈也混得不好啊。


    父母一代把自己的落后，懒惰，自私，归结于别人不好，那就失去了自省。有人买房赚了，他破口大骂是投机。有人卖鸭脖子赚了，他怀疑人家缺斤少两。有人升上去了，他背后说人家多亲多不靠，反正全世界就他好。他找谁说呢？最多的就是子女，因为他要证明自己的落后和不堪，都是别人不好。


    很多小蘑菇在这种环境中形成了最初的价值观，也就失去了发愤图强，努力逆袭的动力，反正都是别人不好。我考不上985，是因为教育不公。我买不起房子，是父母太差。我找不到漂亮老婆，是富二代多坑多占。一切平均分，就什么都解决了。


    把自己的失败归结于别人不好，是人间最轻松的事情。但是，这样没有意义。这不是正能量，而是往下走。


    # 财富在哪里？


    往下看，脚踏实处，到群众中去！


