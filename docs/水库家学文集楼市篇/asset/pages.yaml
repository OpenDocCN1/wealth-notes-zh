  md: '但对于怎么办，办不办，只是一个原则性要求，没有细化到需要什么证明，到哪里开证明，开不到证明，怎么处理？


    这种原则性规定，就给了基层窗口无穷无尽的借口。


    想给你办，这几个材料也够了，不想给你办，你永远缺这个缺那个！


    我说的是，不太常见的事情。


    你去办个常规事情，没这么复杂！


    # 淘宝是中国产业升级的痼疾


    淘宝的核心是：只能比价，无法通过照片比质量。


    对于非标产品，例如裤子，裙子等，是不适合的。


    这就导致了卖家挖空心思维低成本。


    你买到劣质品后，你还不敢公开说，因为你的信息都在卖家那里，他可以天天骚扰你的家人，甚至推测出你的单位，直接打到你领导办公室。


    # 公办粮的时候，我就不敢惹他们


    以前是公办粮店，顾客被营业员大声呵斥，是家常便饭。


    营业员如果生气了，一甩手走了，你等着吧！


    在太阳底下等一个小时也很平常。


    所以，我每次去买米，都是小心翼翼，生怕哪句话把这些人惹了。


    如果米的质量不好，有点老鼠屎，小石子的，我也不好多说一句，下次还要找他买，得罪不起啊！


    # 粮食购销放开后，情况才有所改变


    三十年前，米饭里吃出白石子，老人嫌掉半顿饭，没人会奇怪。


    自从粮食购销放开后，小贩们在第一年就严防死守，米饭里吃到白石子的事情，我家是再也没有发生过。


    # 京沪流行“一百万焦虑症”


    家里有一百万左右现金，干啥也不行。


    买房买不起，买车养不起，炒股不会，理财怕骗。


    不过，这病会自愈，十年后就毛了，你的焦虑症也好了，旅游几次就拉到了！


    # 月入一万五也敢问理财


    你好，我一个月将近一万五的工资，怎么理财啊？


    答：你好意思来问这个问题？'
