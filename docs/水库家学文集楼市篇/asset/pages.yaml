    these 房子现在超级抢手，为什么呢？卖给外地精英了。你去看，上海陆家嘴，北京牛车记的老破小，单价十万，超过纽约了。


    外地精英喜欢什么？上班近，学区房。外地精英基本是读书出来的，超级看重学区。外地精英工作难度大，天天累的像条狗，很看重上班近。京沪老房子，大多数卖给了这些外地
    985 。


    结论 2：外地家庭限购一套，所以不可能出租的。京沪居民卖掉一套老房子，出租市场就少一套房源。


    # （二）上海家庭二套都是市区商品房


    那么，价值是 1500~2000 万了。这种情况不多的。目前可能出租，但这种家庭子女马上结婚了，婚后就自住了，出租房源会越来越少。


