  md: '答：你应该有更加远大的志向。你一个大学生，去和北五环的小市民比，丢份啊！你应该和马爸爸，王女婿比。祝你成功。


    # 内环线最大的房东。


    可能是老国企。


    刚才在家门口转了转，多年前破旧不堪国企老厂房，已经焕然一新了。外立面刷的漂亮亮光，门窗都是崭新的，空调一排排，整整齐齐。挂上一个什么创业园，软件园之类的牌子，摇身一变，成了
    T 大房东。像我这个年龄的本地大叔们，哇啦哇啦的指挥停车。四周一看，没人就不开票了。


