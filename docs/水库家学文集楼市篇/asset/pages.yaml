  md: '我又开了三公里，到了第二个加油站，也说没油，我一下子慌了。因为车里已经快没油了，如果再加不到油，这车就要在马路上趴窝了。于是，我在第二个加油站下车，仔细询问为什么没油。那个工作人员说，正在卸油，不能加。必须是一个小时后来。我不相信，就去看那个油罐车，确实在作业。但我不知道是卸货，还是其他事情。


    万般无奈，加上内心恐慌，于是急匆匆奔赴第三个加油站。那个加油站，因为是国庆节首届后一天，里面没有排队的车等加油，下雨天，室外外没有工作人员，看上去就像是一个彻底歇业的加油。往里里面开的时候，内心极度恐慌。进去后，因为下雨天，没人搭理我。我的紧张情绪到了极点，真是没油了。于是我下车敲办公室门，工作人员说没油。我一下子长舒一口气。


    我本来是准备加300元92号汽油，那天我和工作人员说，满油。最后加了370元，还心满意足。讲老实话，如果第三个加油站也没油，我可能立即愿意去买高汽油（若有），即使涨价，我也会去买。毕竟是刚需啊！


