  md: '那时候，年轻人的想法都是天天加班，写论文，很职称。只有一些中老年屌丝，大单位里坐了十几年老正班，百无聊赖的才研究房子。研究房子有个麻烦，就是要到处看。那时候绝大部分家庭都没有车，一般人没时间到处跑。而这些人板凳可以在上班时间溜出去，开着单位车，办完单位事，中午去工地看看。


