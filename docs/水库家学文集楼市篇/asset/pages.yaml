  md: '县域体制内家庭，基本希望孩子去大城市。


    五、今后十年，小地方楼市逐渐达到供需平衡和供大于求


    现在，农村的年轻人全部走完了，一般的内地县城，年轻人是不感兴趣的，实在混不好的才回来。出去的回来的，慢慢达到平衡，就没有什么新增需求了。


    现在还有很多县城居民的改善型需求。老县城房子旧了，先买一套新的。等以后老房子拆迁拿到钱后，可以把贷款还上。


    县域体制内的外来新增人口，总量少，和本地年轻人结婚，不缺房源。


    六、总结


    县城或者经济落后地级市，外来新增需求，附近农村改善型需求，逐渐减少。子女外出后，卖房子的家庭，将越来越多。五年十年后，供大于求是可能的。老旧小区的空置房会越来越多。一栋老楼里，只有一半房子有人住的情况，我也是见过的。


    # ## 解决房价高企的最好办法是


    做实实体经济也能够赚钱。


    大家自然就不炒房子了。炒房和炒股是一样的，都是金融属性发挥了客观规律，水往低处走，哪里有钱水往哪里！现在的情况是，我们老夫妻赚了两百万首付，不给儿子买房，拿着钱怎么办？存银行吃亏？炒股赌博，理财到处是骗子，开店没时间，投资大哥卖家的实体？呵呵，实体经济都穷成那样了，我还找他？不可能的。


    市场经济的成功者是1%，大部分是不成功的平庸之辈。这些1%的幸存者，资金只能在国内花，你说怎么办？他想去日本买个房子，不行。他想去美国买个公司，基本不可能。老板就亏点钱，也只能是京沪买房了；至少传给姑娘嫁离婚，今后不贬值啊。


    如果大家都这样，那么为什么不多造房子呢？你问我，我谁问你？现在造房子可快了，六个月可以预售，18个月交付。可大城市就是扩大供应，既然资金多，房子少，需求大，你怎么办？


    # ## 上一轮的京沪底部特征是（2018.12）


    中介关店潮，甚至出现中等规模的连锁中介，彻底倒闭。目前还只是零星关闭，不算最底部。


    # ## 警惕三四五线楼市的日本化


    现在，越来越多的三四五线城市，已经出现二手房卖不动的情况了，这些地方，经济结构单一，居民收入不高，毫无特色，人才外流远远大于流入，楼市已经进入僵局了。（学区房除外）


    一，租不掉


    很多小地方，除了批发市场附近，其他小区没什么外来租房需求。


    二，卖不掉


    三四五线特点是，人少地多，有关部门进行了大规模的新城开发，各种优质配套，例如医院学校机关，成规模迁往新区，本地年轻人结婚都去新区了。老城小区不动，索性不拆了，修修补补又一年。因为外来需求少，本地需求去了新城区的漂亮小区。老小区，日渐破败，沦为养老楼。


    三，没地分


    小地方如果新区卖的好，才有今后的土地款。老城区，呵呵，拆个渣渣都要死要活的，你随意吧，我把下水道给你疏通了，你也别来找我。所以，有关部门对于新区销售和维护，那是高度'
