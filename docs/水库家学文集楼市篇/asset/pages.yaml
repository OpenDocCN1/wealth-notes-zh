  md: '答：很简单。每隔几年，涨了两倍，卖掉一套，就可以维持另外九套的五年月供。最后再卖掉一套，已经涨了6-8倍，就全部还清贷款了。期间还有房租收入，工资收入。我把老蒋子的故事告诉你，你还质疑。实在是没有发财的潜质了。


    # 为什么炒股赚不到钱，而买房发财？


    为什么炒股的人，赚不到钱，而买房的人，个个发财？其实我早就想明白了。


    炒股，阶段性发财的人很多很多，例如那个250，几个月赚了两千万。但是，这钱来的太快了，每天都在大把大把的缺钱，全世界都在狂欢，人到了这种程度，精神状态不可能冷静的。你不要以为你可以冷静。就像你再不掉抽烟一样。


    股市崩盘是没有预兆的。小跌一下，没人当真。那时候赚钱这么容易，是你人生唯一接近大暴的机会，你怎么可能放弃呢？你当时想的最多的是，设个止损线，保住一千万。众所周知，当崩盘来临时，你的股票根本没买入，直到跌光本金为止。


    买房的人，95%是自住的，或者为孩子预备的，没什么人炒牌。在中国，卖房子是敢家；很忌讳的。所以，房价芝麻开花节节高。


    # 很多人把房子当股票炒作


    京沪事业单位工资族，买一套漂亮小区房，是完全正常的。


