    # 粤港澳大湾区发展规划纲要


    央视新闻：#新闻联播#【中共中央国务院印发《粤港澳大湾区发展规划纲要》】《规划纲要》指出，建设粤港澳大湾区，既是新时代推动形成全面开放新格局的新尝试，也是推动“一国两制”事业发展的新实践。编制本规划，是为全面贯彻党的十九大精神，全面落实贯彻“一国两制”方针，充分发挥粤港澳大湾区优势，深化内地与港澳合作，进一步提升粤港澳大湾区在国家经济发展和对外开放中的支撑引领作用，支持香港、澳门融入国家发展大局，增进香港、澳门同胞福祉，保持香港、澳门长期繁荣稳定，让港澳同胞同胞用担人民共担民族复兴的历史责任、共享祖国繁荣富强的伟大荣光。


    本规划是指导粤港澳大湾区当前和后后一个时期合作发展的纲领性文件，共分为“规划背景、总体要求、空间布局、建设国际科技创新中心、加快基础设施互联互通、构建具有国际竞争力的现代产业体系、推进生态文明建设、建设宜居宜业宜游的优质生活圈、紧密合作共同参与‘一带一路’建设、共建粤港澳合作发展平台、规划实施”等十一章。规划近期至2022年，远期展望到2035年。粤港澳大湾区包括香港特别行政区、澳门特别行政区和广东省广州市、深圳市、珠海市、佛山市、惠州市、东莞市、中山市、江门市、肇庆市，是我国开放程度最高、经济活力最强的区域之一，在国家发展大局中具有重要战略地位。


