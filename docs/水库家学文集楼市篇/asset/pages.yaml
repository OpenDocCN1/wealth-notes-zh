    # 上海金山区


    这个地方很特殊。首先，这个地方绝对不穷，相反，一般居民还挺有钱的。这个地方和浙江省嘉兴平湖接壤，属于上海的最南面，是连接沪浙的交通大动脉。但是，这个地方的房价永远是上海最低。因为它是上海乃至全国最大的化工厂基地。有没有污染，我不知道。但是绝大多数上海人，宁愿去崇明岛，吃萝卜咸菜藏红花，也不愿意去化工厂附近踩别墅。


    你去看全世界各大城市规划，最大的污染源，往往是建在跨省市接壤的地方。至少有一半的空气污染是给对方了。展望未来，这个地方迟早会越来越好的。上海北部的宝钢现在已经陆续搬了。南面的金山化工，是不是符合大都市的高管定位，大家自己研究。（只是个人猜测，不是确定消息）


    很多外地人拿了集体户口，买不起房子，准备打道回府了。那么，金山区买个老破小住户口，还真是不错。你要上哪上哪，但给孩于留个出路，没有房子，孩子不能读公共户口。如果有干年后拆了，那就是意外惊喜。（纯属猜测）。大家都说目前不会拆的。


    # 楼市的小秘密


    新房满二，实际上相当于二手房满五。因为实际起算日不同。


    满二年五年，是产权证日期（交易税期）为起点。这就造成了新房和二手房巨大的差别。


    +   1，二手房，2017年1月首付后马上可以过户，2月份就拿到房产证了。2019年2月，就满二年了。


    +   2，新房，往往是交了首付数后，要等两年甚至三年，才能办理产权证。然后再起算日期。举例：2017年1月首付，往往是2019年8月才开始办证，到了2021年8月，才满二年。实际上接近五年了。


    这对于今后有改善置换需求的上辈而言，成本巨大。


    结论：二手房时间成本低，相同时间内改善置换，税费可能显低很多了。


    # 房产问题


    主要涉及五大块：信贷政策，公证办理，办理条件，税费判定，纠纷处理。这五大块，分别隶属于不同的系统。绝大部分听写的老爷师，只是粗略的懂一些大路货知识，一到涉及细节目，基本不擅长其他条线的政策。能够全部贯通的专业性人才，比大熊猫还少。


    给大部分一般人，99.99%以上，从来没有一字一句的读过近几年的房地产政策通知，更谈不上记得住这些知识，也无法准确判断历年通知间互换后房产的问题（涉及到算账）。他们对政策的认识，主要来源于胡同口大爷大妈的闲聊，同事上司的小组口，再加上自己的一点逻辑推理。因为他们认为，自己家设这个特殊情况，所以根本不会去注意相关细节。这非常普遍的知识短板。


    我去年底，和银行专门做房贷的几位工作人员也聊过几次，我故意问了几个办理和税费的疑难'
