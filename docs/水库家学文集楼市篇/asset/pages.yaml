    近十年，中国经济最明显的变化就是六环外的农民有钱了。我们小区的水电工和收垃圾的岗位，竞争白热化，实际收入不亚于小老板，因为很多居民有个小修小补就找水电工另外付钱了。还有各种你想不到的事情。改废品的就不说了。


