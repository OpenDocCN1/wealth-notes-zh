  md: "# 京沪生活的痛苦，钱花不出去\n\n前两天看电视剧，正阳门，里面有个场景，小酒馆，就是家门口附近，喝点小酒，听听八卦。这种消费场所，一天花费不大；天天去，开支就大了。\n\
    \n京沪也有一些贵的地方，人均一两千块钱，我从来不想去，因为太远了。为了吃个饭，在晚高峰的马路上开一个半小时，头晕脑胀，心情不好。\n\n家门口附近，也没什么消费场所，就是几个肉骨头炖汤，灰灰黄山菜饭，灰尘满天飞，看了就饱了。\n\
    \n我不知道大家有没有日常消费花不出去钱的痛苦？\n\n# 我年轻时，最励志的一句话\n\n说出来，你可能会哭死过去。\n\n“年入十万不是梦”。这就是我们当年拼命激励自己的一句话。前两天，我的法律顾问告诉我，八十年代，打个离婚官司，律师忙几个月，也就是收费40元。估计现在很贵了。wokao,\
    \ 什么都要趁早啊！\n\n# 和保姆闲聊他们家的经济实力\n\n+   1，儿子，初一学历，送快递，就是送饭的那种，一年9.8万。  \n2，儿媳，初中毕业，育月嫂，一年15万以上。\
