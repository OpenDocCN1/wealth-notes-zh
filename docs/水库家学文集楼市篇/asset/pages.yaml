    # 我的经济学理念


    尽可能用合法自愿互利的手段。和平的减少贫富差距，包括婚姻，买房，合法但又卑微的高收入职业。我们不应该嘲笑向上挣扎的人。我不愿意看到激烈手段。建造一个大楼需要无数的财力物力人力，但是搬掉一个大楼是分分钟的事情。


