  md: '贵换来的，至于土地重金融如何，咱就不多说了。为什么呢？


    农产品价高质量。究其原因既是，历史学霸丝们和钉子户最喜欢的一家三吉曲模式。这种小农经济彻底没希望了。土地流转，也只是过渡性的，也没有产权确认，一般人也不敢大规模投入啊！我辛辛苦苦投入几百万，过两天村集体个屁冕堂皇的理由，说不同意了，要收回土地，你说怎么办？这事情就这么造了。你爱咋咋滴！


    # 燕郊春跌的情况


    会在其他大城且滋润吗？


    燕郊春跌的原因很简单：限购了，要买房，去燕郊交社保三年。这个确实击中燕郊购房者痛点了。燕郊本来就是乡镇档次，要啥没啥，房价这么贵的原因是，邻近北京。京领自朝被五年社保限购了，迫于无奈，在燕郊给老人孩子买个房子，周末可以去看望她。


    那我能不能去燕郊交社保呢？不可能。


    +   1. 正常人不会去的。燕郊社保三年，北京五，真正买燕郊的客源，大部分已经在北京工作一段时间了，燕郊熬满三年，北京也差不多熬满五年够资格了。正常人不可能会去燕郊交社保。


    +   2. 不正营的人会计去吗？去不成。燕郊本来就设多少企业。燕郊楼市的体量是几万套规模，要是几万人为了一购房去燕郊交社保。正常企业是不敢要他们的，这就集中在少数“背户头的企业”。有关部门查获知道了。”王总，你公司有七百个人交社保，你营业领多少？办公场地多少？人都在哪呢？”


    +   3. 退休老人和孩子，不能在燕郊交社保。在北京能够弄得起燕郊房子的外地人，也是中等白领。本人也不会放弃北京社保，就算他愿意放弃，北京企业也不敢不收啊。万一员工反吹一口怎么办？


    但是，燕郊这个经验无法复制到京沪。因为很多人非常愿意去京沪工作交社保，是实打实的。五年社保就五年。反正老家工资低，我就在京沪熬了。省会类似。京沪要想降低住房需求，靠社保换房屋，效果可能不大。人说说少啊，那总要住房的。建议：


    +   1. 大规模提供低价房源，每年十万套起步，控制在每平方米两万元较为符合外地群众的收入实际，满足外地群众的合理住房需求。


    +   2. 大规模提供中小学，满足外地群众合理的教育需求。


    +   3. 或者赶人。


    大家觉得怎么办？


    # 青岛房价可能会阶段性下调（2018.08）


    但长期一定看好。


    先说经济基本面：


    一，青岛产业结构偏老化


    青岛的市五百强，海尔海信青啤，和二十年前没区别，看电视，吹空调，喝啤酒。


    青岛的市内民企五百强，中x大（原来的焦化厂），x德集团（你的康），山东大x（拔鸭毛的），利x集团（开超市的），新xx（做假发的），x丰（做煤的）。员工既签可以，致富很难，高营收入应该不错。


    青岛旅游业也县县就两个月，和京沪广港漫淡台，没法比。


