  md: '现在，很多年轻人读了个技校中专改制的外扩二本，就忘记历史了，忘记了艰苦奋斗，嘴巴一张。“我没北京房子，不公平啊”！你才有不公平呢？你会干什么？你做出什么业绩？你为社会做了什么？键盘侠还是打游戏啊！


