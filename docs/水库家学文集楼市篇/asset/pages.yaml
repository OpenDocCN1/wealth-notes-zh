  md: "实际上，经济学观点和第八学院大神差不多，没有什么正常不正常可言的。\n\n# 就是找你借钱，还不付利息\n\n盖德财经记者工作台：脉购团队宣布将上线付费音频课程，听课三年后加薪不超50%可申请退款\n\
    \n> 桑案：假设，我说的是假设。\n我要做个承诺，你听我的课，三万/半年，满一百人开班，三年不上拆迁妹，我给你退款。\n\n这是什么意思呢？说白了，就是找你借钱，还不付利息！\n\
    \n# 公平是相对的\n\n+   - 大家都吃不饱，是真公平了，但这个公平，你喜欢吗？\n    - 我吃牛扒，你吃馒头，貌似不公平，但至少大家都吃得饱饱的。破坏生产是最简单的，把土豪房子贴个封条，由居委会统一分配房子，公平了。你分到与否不敢肯定，但肯定的是，今后就没人愿意建设和生产了。\n\
    \n# 客观看待中国经济\n\n1978年，中国还有很多地方，饭都吃不饱，姑娘姨婆婆裤子都没有。仅四十年，中国每个家庭都买得起美国别克轿车了（不一定是真的去买）。城市建设超过欧美。居民家庭每年也有2-3万美元的收入。这是非常非常巨大的成就。\n\
    \n当然也遇到了一些问题，环境污染，贫富差距，腐败清正。瑕不掩瑜，这四十年是伟大的，是全世界独一无二的成就。我不相信你愿意回到文革时代吧？\n\n所以，中国还是昌盛的。\n\
    \n# 中国式办证：没有私生子证明\n\n我有一次在交易中心听到了一个笑哭笑不得的事情。\n某兄妹办理遗产继承，窗口要求办事群众证明：父母就这两个子女，没有私生子。\n\
    我实在想不出，证明不存在的事情，到哪里去开证明？\n\n# 窗口的人很聪明\n\n窗口的人心里都清楚，多干这一件事情，他也不可能就此加工资，升级别。\n办错了反而担责任。遇到吃不准的，一推了之最安全。\n\
    有的人更加聪明，他意思是办，但不说明，他找了个条文，给你扩大解释，添油加醋，要你去开很多证明，实际上把你推出去了，你还说不一二二三。\n\n这就苦了来办事的人。\n\
    \n# 我说的是不太多见的事情\n\n现在的一些不常见的事情，也有文件政策。"
