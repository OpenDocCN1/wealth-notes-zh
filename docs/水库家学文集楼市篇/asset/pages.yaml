    2. 民企取得原材料后，绞尽脑汁，生产出普通人喜欢的产品，赚取利润。

    3. 有了钱，大家去买房。房企发财了。


    私企民企实际是中间层，对上，缴纳高额买价和获得许可证，对下，发工资养民，承担巨大风险。上海富通，还可能会全家破产，那么就要有一定利润担保，否则，谁去冒这个险？


    现在是，方方面面只看见了一部分成功的小民企，他们居然赚了钱，我操，实在是眼红啊。于是，各路人马纷纷拍马赶到，亮出家伙，来，开仓了。你赚了这么多钱，要共享啊！


    好了，我服了。还是买房吧！


    # 上海为什么互联网大公司很少？


    答：携程，艺龙，盛大，饿了么，大概算是第二梯队的互联网公司。其实，原因很简单。


    +   1. 上海各部门普遍看不起小民企，互联网公司清一色是民企，不找你麻烦算是好的了。上海最喜欢的是，外企五百强，四大所，国企，房企。

    2. 上海人不喜欢创业，特别是高风险创业。上海的小企业主要是做单子。例如某大公司要搞个系统升级，他们去接单。张江那里大多数是这个模式。

    3. 上海人特别保守。互联网最大的难题是，网上支付和快递。支付宝是2003年底推出的，外地的一个东东。上海主流人群一开始是根本不相信这种东西。现在的几大快递公司在上海一开始做'
