  md: '王大嫂和老公是外地人，小区自行车群值夜班的老，两口子五十几岁，吃住在车厢里，还利用车厢空地，摆了一台别人搬家丢弃的老式缝纫机，兼职做裁缝，缝缝补补，改个裙子袖口，换两套旧扣子之类的，一件衣服收费，20元30元，生意不错。


    王大嫂有个外地农村侄女，小王，37岁，有个娃，单身，从小没有干过农活，长得还是可以在某快递当记录员。孩子在老家没人管，读小学，小王放心不下。但是带来上海，又不能读书，自己也没房子，苦恼不已。


    王大嫂就把小王介绍给了张大叔，年龄相差13岁。双方互相满意就结婚了。按照政策，小王的独生娃孩子，可以在上海借读中小学，高考可以。小王想，如果孩子初中学成绩优秀，就回老家读高中。如果成绩一般，就直接考个上海中专，以后升大专，一下子解决了心头大患。


    老张跟孩子跟妈走了，日常不联系。这个老破小，就是他们母子的立足点。房子孩子都解决了。老张虽然不怎么怎么样，但也老实，大几岁也没什么。


    人出人，气死人啊！


    # 一城一策，楼市分层开始了


    +   第一层次，京沪，广深。（严重冻结，冻地）


    第二层次，发达省会，天津，副省级城市，苏州。（阶段性高位，不急）


