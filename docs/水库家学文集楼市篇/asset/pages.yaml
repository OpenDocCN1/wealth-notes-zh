    首先我们要想清楚，房地产怎么就成了投资工具？


    家庭90%~98%的资产，是房子。买房是家庭每户最大的消费，当年停止福利分房，就是为了拉动住房消费，但是，由于房地产价格太大了，以前一般家庭不太愿意买房，或者买最低价的，能住就行了。这时候，房子还是居住属性。


    有关部门急了。住房销售的税费，关系到本地区财政收入的半壁江山。你不买了，有关部门可怎么过日子啊？不行，必须让你买，不买不行，方法也简单：


    第一步，诱之以利。你买了，就涨乐，划算吧？就像炒股票，这下子，大家开始买了。


    第二步，货币排水。富人毕竟是少数，一般人还是买不起。有关部门又出新办法，贷款给你，再搞个房子教育你。美国老太到了八十岁才还清贷款，但享受了一辈子。中国老太到八十岁才够房子，但一辈子没享受过。于是，为了满足贷款需求，m2如洪水一般涌出。


    第三步，诱他去赌。中国人的性格是：不欠债，好赌。于是，有关部门再次上演大片，报纸上到处议论温州炒房团：你看，投资几年，翻倍利润，比开厂还好！这下子，把中国人心深处“好赌”的性格激发出来了。沿海地区彻底认同炒股。


    第四步，父母煽遥言。2008年以前，广大的内地老百姓，还是榆木脑袋，就是不会不赌不想贷款买房。呵呵，你总要结婚吧？让丈母娘逼男方买房，卖房不给婚。


