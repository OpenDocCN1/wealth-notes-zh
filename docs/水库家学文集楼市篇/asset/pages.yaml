    # ## 假如京沪按 1%征收房产税


    房产税。美国最低是 1%每年，也有 2-3%的，但不多。假设京沪 1%来征收：


    一是单套免税。那就会抢购豪宅了。富裕家庭把手里的多套普通房子抛售，拼成一套。但是，京沪的实际情况是内环缘源公寓并不多，也就是 3 万套左右，到时候内环线的房价就疯了。我是欢迎的。


    二是每套征收。现在浦浦一套五百万是起步价，一年要交税五万。实际上很多家庭是无能力承受的，例如老人，丧偶，疾病，残疾，还贷中。不交税的，判刑还是上黑名单？


    三是税率降低，例如 0.3%，一千万房子，每年交 3 万，这对房价有多少遏制作用？


    四是税负转嫁，如果高税率，房租肯定是飙升的，除非京沪的房子租不出去。


    五是有条件申请减免。这利益实在太大了，到时候黄牛可以重新就业了！


    # ## 房产税就是针对大城市


    房产税是各地自行办理，小地方暂时不会收。


    房产税，说白了，就是针对前十名的大城市。


    其实，我是很欢迎房产税的，就是想看看到底怎么收？


    我不相信这些专家在学校书都没念好，现在居然就可以解决好这么复杂的关系。


    房产税理论基础不是房产，而是个税。


    个税的理论基础，我就不敢说了。（财政学专家留言）


    # ## 房产税的宏观考虑


    作为财政学专家，我最担心的是，房产税的宏观调控，要避免京沪抽干了全国的水。


    一是按面积征税，南京以西的各省会的别墅和大平层还不如京沪的一个老破小。如果跨区套利，各地多余的资金会集中涌入京沪。


    二是按价值收税，事实上很多家庭交不起，拆门赶人？呵呵！


    # ## 房价的根源


    根本不是房子本身，而是：m2 速度，户籍改革，人口流动，区域发展，财产公开，财政结构，商业环境。


    姚事论事解决不了房价趋势，只不过地加一点成本和时间，到时候转给下家就是了！


    # ## 房产税必须按年收


    房产税必须是一年一收，才能起到作用。


    如果是卖掉的时候集中收，那么不过是买房的人倒霉而已，多出个十几万或几十万，根本起不到什么降速作用。


