    # 现在不是没有行情


    而是不让说行情。


    # 为什么房价让人千回百转？


    房价到底怎么样了？我们有两个角度。一是大政策，是“稳预期，稳地价，稳房价”，一目了然。二是实际情况。不限购的小地方，例如中西部就业都比较艰难的小县城和地级市，这两年的房价，呼啦啦的飞起来了，7
    千-1.5 万普遍情况。


    把房价打下来的办法有一百个，当天晚上打对折都是可以的。但是，房价下来的后果，谁来承受？这个问题就复杂了。


    一，财政收入


    房价和成本之间，有个巨大的秘密花园，财政收入是大头。各种正式编制的工资，低保救助，'
