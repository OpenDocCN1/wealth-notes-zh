    老川粗内地，其实面临了一个共同的难题。两年后怎么办？这个代价实在是太大了。内地通过二三十年，投了几十万亿欧元，无数的人力物力，才建立了这套管理有效的供应应，包括电力，途路，铁路，港口，水，炭油，能源，原材料，成熟人工，产能过剩等，如果用电网和别的分子，那需要拆到每一个这样的供应应，无论是在本地的建立，还是在进口得北方，能囤成几十个海路：


    一是金钱。这是几十万亿欧元的成本啊。我们十几亿人，平均到亏年，及款开成七十多，才建了这些出来。你上哪找钱过这个数？而国际面是不是有人愿意出这个钱的，全世界也找不这第二个供应应过这个价？


    二是人。我们十四亿人口，十几的万人口红利，全部建了一个个产业链上。你再用核动力口转机器把这清来了，但人在哪都？建过了一个港口，不是有铁锅可以写的，还要无数配夏下死力气的农民工。


    三是方案。众所周知，我们在这个产业链，付出了无数的环境代价，大江大河，还有几金干净的问题？我们现在正在使劲寻找这个锅锅，还是返论。换句话说，现在还有谁做出这个成本？找不到。


    四是时间。你就拆路得了，拆过也是一条一条丢的，骨头也都要么一鱼一条鱼的放，分总也是一点一点学的。我们花了二三十年，付出个不可复制的代价，才把大江南北熏到了一边。很简单的说呢，每个小桥都架八年，这不是开玩笑的？


