    +   1. 在源头上控制货币的发行量，整个社会没那么多钱了，那么房价自然就能控制住。

    2. 热点特大城市，暂时不要再无休止的接纳新的外来人口，人来了必然是有租房需求的，需求增大了，那么自然会合对价格产生影响。

    3. 进一步加快住房供应。不要为了把地价卖高了，故意人为控制卖地节奏，我们可以设定一个在建工程量，比如说，特大城市必须有 30 万套在建工程量；低于 30
    万套，立刻批地，哪怕把价格降下来，我们也要把供应量搞上去。

