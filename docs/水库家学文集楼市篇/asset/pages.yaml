  md: '# 一、资金


    这种会议，资金是上面拨下来的，用在了自己地盘里。地方是明显受益的。至少把沿途的居民房子粉刷一遍，各种管井盖重新检查一遍。开心伐？


    # 二、领导来看你


    地方的管理者，特别是副职，平时很难有机会和高层管理者说话的。但是，如果上面来人了，很多管理人员就有机会近距离和领导挨聊了。万一表现好，上面就看到你了。这是难得一遇的。


    # 三、最重要的是，形成了强有力工作抓手


    这个问题，小白基本无法理解。整治河道，整治垃圾，拆迁等一系列硬骨头，你要按照平时的 工作力度开展，那是很难很难的。这个要无脑，那个托关系，这是你家二哥，那是我的丈母娘，难
    办啊。(财宝讲进经济公众号)但是，有了这个抓手，这是今年省里的一号任务，不认，这就搞 得定了。这话，我就说半截，你们自己体会。


    # 四、活动圆满成功后的嘉奖


    (省略一千字)，皆大欢喜。


    # 长期稳定的扶贫


    应该是走市场化道路，提倡劳动致富。


    扶贫工作，非常重要。当年我留学的时候，有很多人为贫穷失业而愤青，在国外的工 厂里，尖 进，小偷小摸，听到那种情况，我实在难以觉得我们多厉害，感觉不到什么"厉害了，我的人"。
    消灭贫困，是一个大国的伟大责任，义不容辞。


    短期内，给贫困户送钱送物，是工作需要，立竿见影。机关小干部领来洛也方便。但是，彻底 解决问题，应该是让有劳动能力的人通过劳动脱贫。我们给那些长期脱毒的农村酒架子的大小微烂，
    送再多的钱，也没用。这个月得钱了，下个月呢？


    在中国，四大之家，只要有一个壮劳力打工，就脱贫了。问题是，不少家庭就有一个壮劳力， 只有一些老弱病号，4050 人员。这些人群是脱贫的重点之区。正常总想应该是，大活做不了，那就
    做点小活。红包不行，那就看大门，多少是个收入。可事情被劳动法搅乱了。


