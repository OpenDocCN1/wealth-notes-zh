  md: '了新房的小豪，其他人不可能买得起。首付一千万，你说来给谁？


    所以，如果你有钱了，你就会面临一个富人的烦恼：是攒几个豪宅留给孩子，还是投资小户型增值？上海家庭，4+2的人口结构，大房屋票基本够用了。


    你是大学生，你先说！


    # 一证一套，让房价插上隐形的翅膀


    现在的拆迁趋势是货币化。一证一套，或者全货币。


    一证一套的意思是，拆你一套老房子，只给一套拆迁房，另外给你现金若干。


    如果你选择全货币，另外再奖励现金（很大一个数字）


    如果一个普通家庭，拿到了几百万现金，你会干什么？除了一部分吃吃喝喝的往往，大多数家庭也只有买房了。这就导致了大量的现金直接涌向楼市。


    一个地方如何拉起房价？很简单，拆迁。拆迁户拿着钱在楼市扫货，就像去年的杭州。你一个赚工资的人，怎么可能和拆迁户比实力？


    今后会如何？我当然知道结果了，但我不能直说。


    你爱喝喝吧。我是中疾控职。没什么担心的。


    # 楼市的强制指导价


    这个搞法，说白了就是计划定价，如果强制定价能够行得通，我们也不会搞市场经济了。强制定价就是低于市场价，表面看，好像统计数据下来了，但是实际上，后果复杂。


    一，万人抢购。有便宜占，那也不是天上掉馅饼。南京河西区的那个几公里排队，影响实在太大了。本来大家懵懵懂懂的以为，楼市貌似降温了，结果搞出来一个万人大排队，直接敲醒了很多梦中人。


    二，供应下滑。不赚钱了，大家自然没什么生产积极性了。可以计划生产，但是，计划经济是谁怕苦，我们还是知道的。供应下降，但需求旺盛，你说二手房会成什么样？


    三，质量下滑。既然你定价格死了，那还可能是想办法节约药成力，样子付才敢刷薄，大横门厅取消，绿化搞便宜的，电梯搞便宜的，门窗买最低价的，设计也不用了，拿个老图纸改一改；


    四，卖地收人的缺口怎么办？财政支出是刚性的，你说哪一块可以减下来？教师工资拖一拖？还是市政保活缓一缓？楼市下滑了，卖地市容得滑下滑，1-2年没问题，但时间长了，你说怎么办？九十年代的上海是什么样子，我们历历在目


    政策不是万能，政策只代表了有关部门选择猪哪呷头，而不是面面俱到，皆大欢喜。


    建议，索性把二手房的定价也管死了，否则，政策压住了新房价，实际上又买不到，空欢喜一场，最后还便宜了房东。


    # 读大学买了房子，现在满脑子都是房


    目前在南京上大学。刚上大一，老家因看房不方便，给钱让我帮自己买一套婚房，房价翻倍。我年轻，有点飘，已经分不清是眼光还是走上好政策。


    16年，我又向父母要钱，更觉先前一塞又做了二把，想尽办法硬破局，破资产，陆续又买入两套。房子是赚了点钱，但我付出了巨大的时间成本，精力成本，机会成本。


    从大一拿了奖学金（最低等），到大二已经学业预警，现在已经大三上快结束，而我仍然没有'
