    到 1 万是很普遍的，少数的车间还要高，车间的组长，厂长，他们的收入可能会更高。两口子贴瓷砖，日入一千是正常价。另外，土地成本也非常高，水电气，税费，劳动法，环保法，工人福利待遇，已经超过了东欧地区，所以再也不可能生产出非常廉价的衬衫了。


