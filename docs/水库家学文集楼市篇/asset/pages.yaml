  md: '任何经济体陷入滞涨，那等于老房子着火，直接要呵呵了。

    建议：最好是谨慎发钞。如果 m2 超发，要有回收机制。


    +   1. 谨慎发钞，减少热钱和剩余资金。

    2. 发钞多了，要有蓄水池予以回收。

    3. 决不能让热钱在社会上四处游离，处处设防，防不胜防，最好的办法是，这个蓄水池，一网打尽。


    # 我应该回老家去吗？


    我在京沪的市区老破小价值 350 万，老家的县城别墅也不过是 260 万，有天有地，全家团聚，孩子可以读县一中。我应该回老家去吗？


    答：亲爱的年轻人，老家你是回不去了，别多想了。


    +   1. 就业。老家没有和你专业对口的岗位，即便你找到一个当地大企业的工作岗位，也不过是混日子，熬级别。县城的关系网，我不说，难道你就不懂吗？放弃专业，在没有强大人脉的情况下，你敢去混县城，还不如直接说你放弃自己了。

    2. 创业。县城除了小饭店小超市，其他哪个生意你能够做？咱们不说黑白道，就问消费在哪里？

    3. 退休后怎么样？可以的，除了医疗差一点，其他倒也正常。


    # 为什么不敢提醒 p2p 有风险？


    为什么，我们以前不敢公开提醒大家 p2p 有风险呢？


    有关部门都不说，我们怎么说？我们大嘴巴一说，分分钟会被扣个帽子，搞不好还惹事了。扣你个大帽子，破坏这个，破坏那个，天天有人找你打官司。你说烦不烦？写得得小心翼翼。


    # p2p 连续爆雷


    家破人亡，夫妻反目，连续上演，惨不忍睹。


    我们不要嘲笑这些贪财的人。这十多年来，相对于房产，票子毛了，是铁板钉钉的事实，除了 p2p，一般家庭还能投资什么？


    # 理论研究，欢迎拍砖


    为什么银行不会倒闭，p2p 经常倒闭？


    银行和 p2p，在经济学的底层实质上是一样的，借贷而已。但是法律性质不同，借款人，债权人，中介，三方的法律地位和责任，银行和 p2p 是完全不同。


    只要是炒钱的，倒闭就一个原因，挤兑。挤兑往往是地区性的，解救后没有出现全国性挤兑，也根本不可能出现。本币是央行印的，你要就给你，挤死个球啊！银行应对地区性挤兑，简直是小菜一碟，省行的部门经理加个夜班就行了。


    +   1. 存款准备金（自有资金）。银行的盘子极大，平时由母总集中取献，就把乙丙丁城市分行的资金调过去。

    2. 同业业务。银行有个接近无限的放款市场，就是同业市场。这个和老百姓无关，就是银行'
