  md: '# 有没有只涨不跌的东西？


    所有的商品都是只涨不跌的，除了股票。你要是不相信，你去找个五六年前的价格表。


    # 世界范围内的技术进步


    阶段性放缓了，结果可能是扑朔迷离的。


    我们的工业技术短板，主要就是芯片等，和世界最先进的技术，差距可能也就是二代左右。碰巧的是，前面的选手停了下来。我们完全有可能在十年内追上去。即便目前还达不到，也没关系。大不了，尺寸做的的大一点而已。你的芯片是火柴盒大小，我做个方便面大小，也可以用。这和以前有和没有的区别，完全不同了。


    更加意外的是，中国是十四亿人口的岛度统一大市场。除了房子，其他消费领域，大家都买得起。农民工和超级富豪，都买得起最新款手机。这个市场容量，足以支撑任何一种技术模式。也就是说，我可以采用和你完全不同的技术，我也可以发展的很好。


    这个结果对于发达国家是个极其尴尬的事情。你如果拿不出全新的匪夷所思的技术，你就没有什么优势了，更不可能和我讨价还价了。你的手机又小又漂亮，包香烟大。我的手机笨重一点，两倍香烟的大小，但性能一样，应用软件的手握比你来快十倍（例如微信支付），你反而输了。


    如果只是技术升级，而不是彻底革命性的原创技术，例如互联网，那么，中国迟早会追平发达国家，也就是十年到二十年。最大的变数是，世界范围内，会不会出现我们意想不到的新技术？发生全面战斗的可能性，微乎其微。或许，你在远洋战斗有优势，但我在家门口，是不输的。我在家门口的几个热点敏感地区，摆开架势，攻你必救。你不来，这里都是我的，你来了，大家一起在泥潭里打滚，你扛得住几年？


    今后怎么样？真是不知道了。


    # 中国出口，路在何方？


    出口大基建，例如桥梁地铁水电站。


    东南亚的中低端制造业起来了，我们继续再搞塑料桶，衣箱鞋，估计没出路了。但是，这些国家的，大型基建项目的经验和能力，是不行的。欧美的大基建早就停止几十年了，人员技术也不足以支撑出口级别的大需求，而这些，正好是我们的强项。


    东亚现在搞制造业，再过个五年八年，必然遇到水电气基础项目的短缺，等他们攒够了首付，我们就出口给他们。


    当然，这些项目也会遇到纠纷，主要是当地居民阻挠之类的。但是，我相信，这个不是大问题。水电站可以缓一缓，地铁桥梁，你总需要吧？要是你坚持不要，那你的制造业也做不下去了。三天两头断水断电，谁和你玩啊？


    # 中国的城建模式


    对于广大发展中国家，是具有超强魅力的。


    假设，我复制一个上海的大基建给你，那些东南亚地区可能直接跳乐观疯了。因为上海的大基建本身就是全世界最高水平了。'
