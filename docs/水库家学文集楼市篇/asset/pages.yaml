  md: '如果我们略他一年，他自己就消停了。某地是个纯进口的地方，吃啥拉撒都是进口的。没选项，就玩不下去了。大不了，水电检修三个月。


    # 你越巴结，人家越鄙视你


    真正的强者，是靠实力说话的。一味讨好，买单，时不时的大礼包，人家根本看不上你。美国人从不讨好谁，可大家都认他。千万不要以为，我对你点好点了，你就会感恩戴德，都听我的了，那是不现实的。


    # 中国身份几个亿的屌丝富人


    实际生活水平，真的也就是个中产户。就是房子车子好一点，银行债务多一点。


    开车，一样堵车。我有一次在高架桥上被憋尿了，痛苦不已，后来专门买了旅行尿袋。


    居住，几千万的房子，一样有烦恼，有邻里纠绕，隔壁那个卖鱼佬的儿子，一天到晚吹个 sb萨克斯。对面那家傻货邻居在院子里搞了喷泉，哗啦啦的，烦死了。后面那个屌丝，还养狗，养你妈啊？地下室还渗水，门铃经常坏。


    吃饭，餐桌都是菜肴那么几种品。蔬菜，我在屋顶种了一点，但是品种单调，你也可以在自家花园里割。有时候中午一个人，就去街对面的小铺子，吃碗十块钱的辣酱面条。我喜欢自带碗筷。


    衣服，最舒服的是几十块钱的老头衫，大裤衩，boss 西装，也不舒服。


    教育，和你一样读取对口的中小学，私立民办太远了，孩子太小，也不可能天天开车。


    医疗，呵呵了。谁让你是有钱人，还喜欢次个牙科装逼，呵呵，来对地方了。一天一万不过瘾？那就一天五万。你那个爽利，大概管两个月，要不要再加把？


    几个亿的屌丝富人，其实只有一点尊严，比中产惬意，上班不打卡。我肿成皮球了，还有几个 985 女民工啥对我。呵呵，我也知道你们逗我玩的。想加工资？没门。


    # 京沪什么人活得最好？


    各种二代，他们不担心钱，又有时间，精力也好，尽情挥洒荷尔蒙。


    有钱有势的人，烦心事后多。今天老张要救我黑材料了。明天员工要上网斗我了。后天，销售部说，货卖不动了。快下班了，采购告怱我，原材科涨价了。


    中产也烦，银行贷款亚历山大，孩子读书考不到前五名，老婆一天到晚抱怨，公司地位可能不保了，年轻人天天挑战我们这种三十七七的大叔。


    正式编制也烦，钱不多，事多。一天到晚都是糟心事。熬了七八年，好不容易出了空缺，空降兵直接下来了。我心里那个难受啊！还不敢说出来。面对比自己小三届的直接领导，还要假装顺从，顺你妈了个锤子。


    小老板也烦心。生意不好发愁，生意好了，员工辞职，找他墙角。客户也不好搞！总有几个事妈，吹毛求疵，打架也不好，不理也不行。


    员工最愤怒，老子辛辛苦苦一个月，也就几万八千的，什么时候买的上省城房子？我的要求已经是最低的，有个房子住就行，老婆七成新都算捡到家了。你还要我怎么样？


    农民也发愁。虽然这几年千啥快，抗了地里人不少钱，老家县城的三层房也买了。可儿子在中山悉尼，要娶媳妇，我哪是有钱给他买啊？儿子对象已经不高兴了。老家更惨，二婚的女人要彩礼，一分钱不能少，这不是找了个祖宗吗？'
