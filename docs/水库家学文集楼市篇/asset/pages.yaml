  md: '+   读一般大学有没有用？二本子真没什么意义了。或许你不服，那你看看近三年，你们村里毕业的的二本子就知道了。我周围不靠关系也能一年几十万收入的，基本都是艰苦岗位。


    +   一，煤炭院，997，全年无休，灰尘大，气味大。


    +   二，早餐店，夜啤店。早上五点开门，或者凌晨经营。很累。


    +   三，装修施工队长。工地灰大，吃住不行。


    +   四，小超市。开到半夜一点。


    +   五，五金店，类似于小超市，早九点晚十一点。一家老小住在商铺阁楼里。


    +   六，助动车。又卖又修，露天作业。


    +   七，中介店长。三年赚一次。


    +   八，收废品。


    +   九，菜场杀鱼。坚持下来，老夫妻一年五十万是有的。


    # 另一半农村女人去哪了？


    若再任由农村女人随意嫁到城市，农村光棍就越来越多了。


    按照人口统计学，农村男女比例差 5%最多，婚姻情况不应该这么紧张。但你实际看到的情况是，农村未婚男女比例相差 50%以上。那么，另一半农村女人去哪里了？城里。


    +   一、升学


    众所周知，二本以下的高考成绩，比得是记忆力和自律性，女生的优势明显。所以，农村女生考上个破大学就走出农村了，再也不回来了。


    +   二、打工


    很多农村未婚妇女，在沿海发达地区打工时，遇到别人介绍相亲，就嫁到当地了。不再回老家相亲了。


