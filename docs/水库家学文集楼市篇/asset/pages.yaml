    # 为什么 2003 年以前，京沪房价低？


    因为那时候，外地大学生人数很少。扩招的第一批大学生是 2002 年毕业，当时这些大学生大多数来自小地方，根本没有房地产意识，大家还没反应过来。等 2003
    年以后，大家发现，没有户口，有社保也可以定居，2007 年后，小学生借读也可以了，外地大学生醒过味了。


    # 你说怎么办？


    +   1. 关掉水龙头，房价肯定涨不起来。缺点：GDP 和就业，影响较大。


    +   2. 大量建设低价房。但房价越低，需求越多，大家一起来占便宜了，那是无底洞啊！


    +   3. 减少大城市实际居住人口。但是外地大学生的子女还希望在北京读中学呢！


    你说怎么办？


    # 对大中城市买房的意见


    子女的婚房还是要买的，最好早点买，别被股市理财时间忽悠了。


    买房不要指望抄底最后一块钱。


    国家给你的贷款扶持政策，一定要用好用足。


    居住不炒，长期持有，至少五年。


    贴瓷砖买灶台，也是拉动内需。


    # 现在的二手房调控


    基本思路是限制交易。


    例如高税负，限制贷款，限制出售，几年不能卖等，直接结果就是二手房供应量锐减。供应减少的情况下，能够降价？我是看不懂了。你说降价就降价吧，我也无所谓。


    # 如果房地产垮了，m2 停了


    或许少量拿 985 凤凰可以便宜几十万买套房了，但那麽多农民工可就要下岗再就业了。四十多岁的农村大叔，上有老，下有下，你说怎么办？你指望包工头像当年的老国企单位一样，管他们一辈'
