    对各类企业的不同影响。


    +   1. 房地产业企业，大中型企业，外资企业和出口企业，是大利好。这类企业，开发票是额定操作，降税是直接利好，当天获益。


    +   2. 微企业（个体户，虾米小公司），120 万以下营业额免交税（增值税），不讨论。


    +   3. 小企业获益有限。营业额在 120-1000 万的企业，利润大概是 10-80 万的小企业，例如中餐馆，小批发商，日用品生产企业，装修公司，钢镚门窗，地板厂，家具厂等。这类企业的最大负担不是税收，而是社保。


    举例，某小企业年营业额 600 万，经过抵扣，增值税一般是营业额的 2 个点，12 万就差不多了，现在减税，一年少交 2 万左右。与此同时，这类企业社保压力大，建议：加大社保下调的力度，稳定工资基数。否则，就算下调了比例，工资基数上去，小企业还是获益有限。


