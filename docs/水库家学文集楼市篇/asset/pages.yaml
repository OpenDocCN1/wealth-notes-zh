    # 京沪很富裕


    来京沪做保姆的人，绝对不愿意回老家，因为老家找不到钱。为什么京沪这么富裕？因为京沪集中了天底下最好的单位。一个三甲有多少人才了？还有各种总异员工。都是现金牛。


    富裕人口多的城市，民间消费力极强，各种生意好做。举例，绝大部分行业，杭州的工资是上海的七成。有一次，我熟人发生企业合同纠纷，去杭州找了个律师，来上海打官司，便宜了八千块律师费，挺高兴的。杭州特点工
    25~30 元一小时，上海是 40-45 元。


