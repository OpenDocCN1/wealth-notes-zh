    # 办公楼有没有价值？


    **目前市场低迷。主要原因是供应量太大了，企业生意不好，办公楼需求不大。以前办公楼往往变成了单身狗住宅，现在不允许了，大量的办公楼一下子抛给市场，市场没这个需求，再加上抵押限制，租售户口读书，水电气不同于住房，一般人不买办公楼。外地人也不买（孩子报名读书不行）。**


