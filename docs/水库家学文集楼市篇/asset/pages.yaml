    过正常来说：房子我们的真的够了，空置率很大


    ![](img/fe0763d1c3cef9e2b76dd74a0e5520f1_103_0.png)


    # 微博开大会，董蕾谈了个观点


    房子没有替代品。


    我不同意。房子的替代品是外汇，如果外汇放开，很多人会立马把所有房子抛掉；只留一套，美加澳新日也不缺啊。问题是，货币出不去啊，只能在锅里炖，那就一起炖。


    # 一城一策，因城施策，已经开始了（2018.12）


    这是第一阶段，心理准备期。商掉头转向还早，但心理期期望值止跌了。


