  md: '互联网经济，拼的是经济规模，人数基数。不要说×港，就是西欧各国，也没出现二马。道理很简单，你的产品，成本不低的，但基础用户不够，单子少，利润低，后劲小，基本没花头。×港人口2，还加一个宁波市。我无法想象，一个小小的宁波谁能诞生二马？完全不可能。


    二，×港可能产生淘×模式吗？根本不可能。


    一方面，支付手段一直是巨大障碍，马爸爸不知道怎么了，一个民企竟然都得到了全国银行系统的支持，发明人类历史上最伟大的支付工具。支付宝的技术和设计理念，二本子也可以想的出来。难的是落地。十几年前，民企去银行是什么待遇？我是亲身经历，门口站着排队啊，看到一个桂圆，都要点头哈腰，生怕为难你。谁能想象，全国的银行系统支持你一个民企，搞一个前所未有的大变化？这就是马爸爸的伟大。


    另一方面，淘×是内贸，不涉及海关。但是，×港要是搞互联网销售，涉及到的问题就复杂了。外汇，通关，检验检疫，知识产权，那是无穷无尽了。有一个风吹草动，小店规模本不可能应付。欧美对淘×的意见是长期存在的，这个问题要是放到×港，你能活几裁？


    三，QQ微×，更加不可能了


    这种工具，是传播思想啊！思想有好的，不好的。如果是境外产品，要不要审查啊？类似的社交工具，世界各国多去了，打的进来吗？


    四，做成华强北行不行？


    1998年到2004年，内地居民去一次境外，都是光荣耀祖的感觉。那时候，我们单位有个出差某港的机会。一个老科长哭哭啼啼的找领导说，还有两年就退休了，一辈子没有出去过，希望领导给个机会。领导说不同意，让其他人去了，他在办公室发飙了好几个月。


    人流过不去，华强北也难做强。


    五，做硬件行不行？理论上可能。但不是很符合当年的观念。


    台积电，三星，都是非常成功的。但是，×港的传统观念是，单纯做生意，而不是自己生产。李豪是做塑料花起家的，那是因为塑料花的生产成本不高，还可以拼一拼。搞电脑芯片，那就不是几百万美元的成本了，可能是几十亿，几百亿美元的成本了。至少几百亩工业园地，就难以解决。


    科工署，还是贸工局，争论了几十年。现在联想还是活活的潇洒，朱为被老刀叫停了。当然，我是中立观点。支持国产品，我支持你支持的也OK。（不怕招）


    在×港，能够拿的出做硬件本钱的，也都是几家地产业商了。本车行做好的好好的，何必去转型，做一个自己完全不懂的，可能赔光的生意？一般人也说这个想法。


    有人会诟，朱为电信设备也是从小做到大的，怎么不？朱为去看香方的发展历史和历史机遇，再说下去就是缺啥子，×港企业是难以复制的，×港的企业也确实没有几十年的耐心做生意。


    数风投，实际上是没做下去。金老师也不能事后说，当年做了肯定就会发财，科学探索，商业经营，都是有巨大风险的。我们不能以二十年后的现实，做个聪明的事后诸葛亮。


    # 钞票不是问题


    韩唱吃个快餐近万元，但经济很好，日本类似情况，我们以前万元户就是土豪了，现在就是个鸟，所以，钞票不是问题，关键是经济发展。


    # 需要有买单侠


    某地搞成这个乱几烂了，他内部各方矛盾都以收场了。这就需要有个买单侠，其他人把所有的锅，都甩给他一个人背。如果我们过去了，我们就成为买单侠了。其他人都解套了，还要倒打一耙。'
