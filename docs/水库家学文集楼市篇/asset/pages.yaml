    # 秦岭别墅拆违的意义


    很多人看热闹，以为就是西安郊区的有些部門违法乱纪，但我看到了更加深层次的原因。其他 各省各处的拆违，必将加速，拆违已经不仅仅是违法乱纪的问题了，而是上升到很高的高度了。'
