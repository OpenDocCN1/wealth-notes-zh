  md: '中国经济成为世界第二，已经是没有任何争议了。第一和第二之间是什么关系？有两种可能性，一是我管你的关系，二是合作关系。


    1. 美国希望是我管你的关系。美国有一个根深蒂固的观念，世界的一切规则都必须是，美国优先，有利于美国利益。二战之后，世界经济出现过多个第二名，美国无一例外的把他们管得服服帖帖，让他们上就上，把他们踹进了就踹进了。


    以前的第二名，都是西方贸易体系里的主要成员，必然是服从美国的安排的，不可能挑战美国的地位。而最明显的例子就是日本的广场协议。广场协议有很多争议，但是结果是很明确的，而日本失去了世界第二的位置，而且国力由强盛转为平缓。


    2. 美国的核心国力是美元。美元是世界上最得到全世界认可的基础货币。美联储是全世界央行，全世界主要贸易都是用美元结算。美国只要把美元印出来，就可以买到他想要的一切。美国要想维持美元的唯一地位，不可替代的地位，必须有能力管控其他国家的贸易规模和贸易规则。


    这快毛皮毡，表面上有很多原因，深圳那个倒霉公司其实就是因为给几十个人发了奖金，最后导致国家层面的贸易纠纷，表面看不符合逻辑，实际上是必然的。因为美国要测试一下，其他国家是不是服从和遵守国家制定的贸易规则。这是美国经济强大的最重要基础。


    3. 我们希望是平等合作关系。在世界贸易体系里，我们发挥特长，增强国力，形成多极化的世界。走到这一步，和美国价值观就大不一样了。假设世界上出现了另外一个巨头，可以和美国平起平坐，那么美元的地位，就不是唯一了。


    美国以后再想通过简单印个美元就可以获得任何的利益，那都是不可行了。


    4. 毛式后的唯一目的是测试：第二名还能不服管了？你在这个大背景下考虑问题，观察问题，就会豁然开解。中美贸易之间不是简单的增加出口，让美国得一便宜，就可以解决的。


    这涉及到谁管辖的问题，涉及到美国国家的根本利益。中美贸易出现反复反复的纠纷，谈好的又不算了，拂了便宜又要加码，都是再不断的试探底线，你是不是要接受服从“美国利益优先”这个基本原则。


    5、我们也面临两难。内心希望独立自主，是不想接受美国的各种要求，但现实上我们又没有做好足够的直接对话的经济准备。最后的结果可恐是，在领域唱大妥协，争取一点战略空间和战略时间。


