    欧树认为，美国在欧洲战场应该得到部分利益，但是美国要求得到全部，非常不公平的。当时，整个欧洲全都打烂了，惹不起美国。欧洲被迫同意美国成为老大。


    欧洲内部互殴了一次，全军覆没，美国跳出来摘油桃子，成为世界老大，真是有苦说不出。欧洲痛定思痛，永不再战。现在货币统一，欧洲内部已经完全没有二战仇恨了。


    (能不能评颠覆?)


    # 毛衣站，不一定是川普的最佳选择


    因为真的关门了，欧美也失去了对我们的影响力。搞僵了，有可能造成两个结果，


    +   - 一是川普希望的，经济领域确实差距扩大，部分科技领域落后的分数更多了。


    +   - 二是万一倒逼出几个大成果，那川普就傻眼了。这种可能性也不是没有。我们现在的差距，不是设计问题，而是工艺问题。因为买的到，习惯性地选择，又快又省事。哪天真要是不买不到，只能硬着头皮自己干了，一开始可能很苦涩，但保不齐出个大成果(例如吉事时期的高等瓷)，那岂不大家都意外了?


    中国不是小国，经济潜力巨大，那么多美元储备，也不是废纸。


    两手准备，和为贵。


    # 贫富差距，实际上只是面子差距


    马爸爸和我有多少差距?他一旦发布会，大家会不由自主的鼓掌。他一发慈悲意见，大家会激情转发。他去开会，必然坐第一排。他非常重面子，我没什么面子。我去开会，一般是坐在中间排的外侧，溜出去上厕所方便。


    在吃穿用方面，普遍人和马爸爸差距不大。他可以坐漂亮的车库，我也能存车，当然，稍微小一点。他在老家杭州的房子很大，你在老家德州房子也很大。他可以去吃大闸蟹，你也可以吃。他可以住欧美旅游，你也可以去，只不过他去了有人专车接机，你去了只能坐旅游大巴。


    屌丝们一定会说，土豪们在美国有大房子，我嫉妒的怒火中烧，受不了了!那么你爱家乡，为什么想要一个美国的别墅?你神经病啊?


    “二喜酱，把我的意大利炮推出来，给我轰他娘的!”


    # 贫富差距和生产效率


    市场经济，充满了巨大的风险和不确定性，需要企业家的冒险精神。结果是，有赚钱的，也有亏钱的，时间长了，就带来了贫富差距。


    很多喷子希望抹平贫富差距，出发点是可以理解的。但是市场经济完全靠个人觉悟，奉献精神，赚了钱给大家分。亏了钱，企业家带着老婆孩子逃身房子赚桥洞。目前还没到。可能个别有觉悟的大土豪嘴高调，那可以让他去山区定居，看他愿不愿意跟回京师把房子卖了?


    很多喷子说：给富人加税，往眼里加，让富人把钱吐出来。一个体育冠军，一个电影明星，是'
