  md: '与此同时，大量原材料是进口的。例如服装行业现在大量采用的是石油产品面料和丝线，人民币贬值后，石油价格肯定是上涨的，制成品也会涨价。进出口相抵，好处不大。


    令人关注的是，粮油是大量进口的，玉米豆粕是进口的，食品上涨会引发工资进一步上涨。当年，猪肉大涨的时候，我的好些员工立马就过来要求加工资，理由是蔬菜肉蛋都涨了，工资也要涨。


    少许的纸币贬值，象征性意义较大，对出口企业的实际意义不大，增加出口的最好方法是，千方百计让出口企业有钱赚。现在的情况是，每个条款都可以给企业发通知，今天要改这个，你配合一下，明天要搞那个，你配合一下。双方把大量的精力时间，浪费在了这些零碎的事情，时不时还来一次大检查，你懂的。


    现在注册公司交钱很快，注销公司不交钱了，我滴天哪，一年半年，不知道要跑多少趟。当然，人家都有政策依据，我们也不好说什么，配合一下呗。


    # 大港区，实际上是一盘好棋


    精关绝伦。但是对于某地的法律和教育届人士，没有什么直接好处，所以，那帮人故意唱反调。


    某地汇率改不了，住房改不了，立法改不了，法院改不了，行政改不了，城管改不了，什么也改不了，但年轻人的就业发展，泡在屋檐，怎么办吧？干脆，我们搞一个新的地方，愿意改的，你过来发展，不愿意来的，你继续待在老地方。


    这些年，以富士康为代表，港湾在内地产的很好，是我们最大的贸易进差（之一），没有内地的净利润，他们的小日子可能没这么开心。那么，索性你也来赚钱，我们提供最好的支持，一家人不说两家话。


    住房，除了个粵地区，绝大部分地方不贵，买个别墅都可以。


    . 经商办企业，我们大力支持。


    医疗教育，我们配合你。实际上，给某地的年轻人一个巨大的机会。


    但是，这个设计忽略了另外一帮人，某地教育和法律的人士，没有得到直接好处。如果你过来做生意，肯定是按照我们的法律制度，那边的律师就没生意了。教育是某管的，某地的青少年就这么多，无论在哪里上学，不会增加多少利益，所以，这群人心里不爽了。暗暗的找劲。


    x 港一定更加类！


    # 经济结构再升级！


    经济无非是三驾马车：外贸，投资，消费。


    +   1. 外贸，参考CCTV，你说的话都相信。欢欣鼓舞。


    2. 消费，最大的消费就是买房。酒店就旅馆，我积极赞同，拼。


    3. 投资，现在的投资，大手笔的项目，都是看不到回头钱的，修个高速，旧区改造，只花钱，不赚钱，基本是花了就没了。钱哪来的？人民币是自己的，好说好说。


    # 钱哪来的？


    十年前，很多小地方的房价只有三四千，那时候，这种地方都是破破烂烂的，穷的一笔。现在，这些地方的房价都是过万了，道路漂亮，大楼漂亮，教师待遇节节高，什么都漂亮！钱哪来的？你问我，我问谁啊？'
