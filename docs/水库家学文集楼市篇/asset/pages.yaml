    # 京沪楼市目前还是上半场 (2018.02)


    我可以明确告诉你，京沪楼市目前还是上半场，以后有的卖了。屌丝们就会晕送。


    我说个数据。法国的第一名城是巴黎，第二名城是马赛，房价差距是 6-8 倍。现在，上海和南京的差距，只有 3 倍。


    # 说楼市


    内环线就这么大，十几年没有多出一分地，还是黄菊时候融的申字型。


    与此同时！m2 如滔滔江水，连绵不绝，铺天盖地，你疯房的，一个苹果要六块钱了，一个烂番茄 2.5 元，你说我拽谁去说谎？


    # 为什么京沪高价房的涨幅很低？


    豪宅楼盘太少了。超过一千万的房子，十年后涨到两千万，基本已经没人接盘了，在整个中国，买得起两千万房子的家庭，奢侈品局，且基本都已经被限购了。与此同时，低价房的楼盘多，多的一比，特别是老公房的一室户，价格就像是瞌天顺，十年涨
    5-8 倍是很正常的。


    高价房和低价房的功能是不同的。高价房是保值和自住为主，低价房是投资筹码和暂时居住。高价房业主很少卖房子，除非是特殊原因，例如大笔投资，移民和破产。低价房业主，天天想卖小换大，交易特别活跃。


    客户买大房子 的目的是：自住，保值，炫耀和传家宝，不是炒作，没必要限购，且有可能在这个领域慢慢放开。


    # 京沪房价的差距，也会越来越大


    上海的购买人群，主力是外企和民企人士，其他人群，工资不高，总体上没什么后劲。


    北京的购买人群，主力是国企和（哈哈），这个资金来源是无穷无尽的。


    北京楼市，还会更好。


    # 租客同权，可能吗？


    如果租房也能上优质小学，会如何？现在优质小学有新生家长招生问答卷，最后一题大概率是，你愿意捐多少给学校？呵呵，你懂的。


    假设捐款 30 万，现在，租客同权了。那么房东肯定会把这个算入房租的。第一年房租是 35 万，第 2-5 年，是 5 万正常你。


    这时候，租客占便宜了吗？没有，这等于把对学校的捐款，转移到了房东手里。房东一下子'
