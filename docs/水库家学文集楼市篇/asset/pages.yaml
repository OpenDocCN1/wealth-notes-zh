    # 感受到经济热度负增长了


    这两天买了个豪华桌子，送货的小哥说，他今年倒了霉。原来一天要送货十几桌，上门安装干到半夜，现在一天送货三四家，他们送货小哥的一半收入来自于小费，因为安装家具会遇到各种各样的个性化需求，房东要付小费给送货小哥。


    今年，送货小哥完全没生意了，气地发抖。他的意思是，我一年白干了。呵呵，挺有意思。大方向影响到一个送货员了。


    # 有木有觉得冬装越来越贵了？


    我问了一下租客，主要是人工越来越贵了，冬装不像体恤衫可以机械化，冬装都是手工制作的，现在的员工都要求住夫妻房＋单独卫生间，不愿意加班，人工每六个月千元加社保，是基本配置。


    所以，不要抱怨了。以后还会涨。


    # 除了房和猪


