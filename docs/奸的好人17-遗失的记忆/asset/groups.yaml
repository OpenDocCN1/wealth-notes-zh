    # 「李想遗失的记忆 5」


    进入霹雳州，过了金马伦的入口，高速公路上便出现很多载树桐的大型卡车。我喜欢超越大型卡车的感觉。但今天怎么看不到一辆大型的树桐卡车；我继续踩油门加速前进。


