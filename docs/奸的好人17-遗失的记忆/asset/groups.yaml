    为了让我报仇雪恨，上天安排我经历死亡到重生那个阶段，目的是让我看清楚冬眠记忆里到底储藏了什么秘密。


    由于我自己神通盖世，因为怡保车祸开发了你的神通，而让我深入最深的潜意识内，令我知道了惊人的大秘密，让我知道谁才是我最大的仇人。


