    李想右掌朝天摇晃着，左掌朝地摇晃着，他紧闭双眼，冥想着熊熊烈火围着他燃烧起来，火势很快与太阳合一，他口中喃喃自语说：


    > 「黎敏平的孩子，黎敏平的孩子……天雷勾动地火，啊，天雷勾动地火，嗡，咕噜李想悉地哞，天雷勾动地火……烧死黎敏平的孩子，噢噢噢噢噢……YES」


