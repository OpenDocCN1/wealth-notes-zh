    # 第一话


    「教導我？！哈哈哈！幹屁啦！最好是這樣！難道教導我就不能用比較好一點的態度嗎？根本不需要用到打罵的，奇怪你以為你是誰啊？教導我？！操你他媽的雞巴毛！鬼才相信！」


    我酒醉得厲害，想要站起身一—數落，可是旋即就腿軟，再度倒下去。


    「超仁你喝得太多已經醉了，我先出去告訴連長，說你明天早上可以晚一點起床，因為我找你喝酒啊……呃……我會告訴連長……呃……」


    敬平學長吐著酒嗝，蹌跚走出了庫房後，就留我一人在庫房里。我也因為喝得实在太醉了，就乾脆躺在地上摊开成大字型，呼呼大睡，迎接從此沒有敬平學長的好日子。


    「呼……魯……呼……嚕……呼……嚕……」


    記憶圖片顯示著當時的我發出沉重如雷的鼾聲。


    在夢境中，我覺得自己的嘴巴里好冰好冰，感覺到嘴巴都快凍伤了，流在嘴邊的唾液也開始凝結成冰了。


    更讓我感到奇怪的是，覺得有東西往嘴巴里面抽动著……


    當我張開眼睛時，心神震媛，魂不附體。


    「啊……好爽啊！他媽的，哦……真的是太爽了……哦……」有一個聲音变調的呻吟著。


    我什麼都看不到，只知道被兩條大腿夾著臉頰，嘴巴有東西在蠕動著……


    此時我想動卻沒法動，一方面因為身體整個被五花大綁，另一方面因為喝了太多酒的關係，全身上下只剩眼珠能轉動，近距離看著一雙大腿的皮膚。


    接著我被推開，雍痪坐在地上，我看清楚了，原來这只大腿就是黎敬平的。


    黎敬平蹲下來用粗壯的双手用力的捏住我的双頰，黎敬平用力往我的額头推了一下，就摊开双腿站了起来。


    我看著脫光褲子的黎敬平，一口氣把许多髒话當作是国语与台語結合的繞口令全都吐出来，可是話才滑到喉咙间，却被「不祥之物」給堵住了。


    我一方面头很痛，一方面感到非常的气憤，簡直快瘋了，


    痛心疾首的想要宰了黎敬平这个大变态，把他的命根子用刀砍下来丢去喂狗！


    命的是，「小超人」在这种奇耻大辱的时刻，竟然撘起了蒙古帳篷。


    一会儿，黎敬平又把我推开，一只手依然用力的捏在我的脸颊上，另一只手则拿起了一杯热水就往我的嘴里灌下去。


    「啊——！」


    我感到嘴巴像被火烧了一样。


    「干！冰火五重天果然名不虚传！太棒了…啊……」黎敬平又变态的狂笑着。


    我感到一阵噁心想吐的感觉，但是黎敬平似乎没有想要停止的迹象。


    几分钟后，黎敬平再度推开我，转过身默不出声。


    看来一场浩劫已经黯然落幕了，义愤填膺的我终于松下一口气，心跳也放缓了许多。


    并不知道好酒沉瓮底，好戏在后头！


    原来是到了下半场。


    「听说《新》的冰火五重天，比旧的更加刺激……」


    黎敬平从旁边的塑料袋中，拿出一大把涂满芥末的不丹毒椒，并看着手中这个在 2007 年曾获金氏记录，又称为印度鬼椒，也被誉为天下第一辣到有资格制作催泪弹的不丹毒椒喃喃自语。


    黎敬平对着目光迟滞的我淫笑，再拿一把不丹毒椒直接塞进我的嘴里，并用一只手压着我的头，一只手压着我的下巴，逼着我把辣椒嚼烂。


    从来不吃辣的我被芥末呛得眼睛泪流不止，满脸通红，全身冒汗，一股溶岩般的热流直冲脑门。同时，鼻头出火，连鼻孔都被烧焦了，在芥末加持下的不丹毒椒，辣味相信已经超过了一百二十万「史高维尔单位」（辣味的指标）。


    黎敬平也气喘如牛汗流浃背，他脸上露出了超猥亵的表情，并从衣服的口袋里，拿出了一种双重薄荷口味的「土人牙膏」，直接挤了半条到我的嘴巴里。我嘴里一阵冰天雪地的感觉，他再抓一把冰块往我的嘴里塞去。


    那一种天寒地冻，如同吃了 20 条 AIRWAYS 口香糖后，马上再灌冰水的感觉，我简直痛不欲生，整个脸的五官全挤压在一起了。


    我也在这个一冰一热的快速交替乏下，头脑早已呈现一片瘫痪，已变成活死人。


    黎敬平也累得两腿瘫在地上，我怒不可抑的瞪大双眼看着他。


    「你……现在一定很想……很想问我，为什么我……要这么做吧？」


    黎敬平像是刚做完剧烈运动一样，上气不接下气的说着：「就让我告诉你吧！这就是我对你 的「教导」！听懂 了没？！【教导】！哈哈哈哈哈哈哈哈哈哈哈哈哈！」


    我狠狠瞪着黎敬平，而黎敬平也不客气的开始说实话。


    「贱骨头，我老实告诉你吧！从第一天知道你叫超人开始，我看你就非常不顺眼了，对我来说，你这个死天兵连舍我屎的资格都没有！学长我因为要退伍，所以心情不错，特别给你大开眼界！算你三生有幸，是你前世修来的福气啊！哈哈哈哈哈
    哈哈哈哈哈！福气啊！」黎敬平诡异的狂笑声不绝于耳。


    我此时吃了秤砣铁了心，肆无忌惮忌惮开骂：「我退伍之后，我一定一定要加十 倍、二十倍，甚至一百倍的奉还给你！赶羚羊草之摆！干！」我脸 额和耳根发烫的怒骂黎敬平。


    黎敬平用怜悯的眼神看着我。「什么？我没听错吧天寿死团仔！加倍奉还？！．别笑死人了，你以为你真的是超人吗？就凭你这只胆小鬼！哼！呸！超人？！」


    「黎敬平你回答我，所有的一切都是你一手策划的吗？为什么是我？我到底做错了什么？！」


    我开始呜咽泣诉，不甘心自己一直被蒙在鼓里，若明若暗，一直都在无助的流沙中挣扎着。面对如黎敬平这样亦正亦邪的待机凶兽，和没有底线的群魔乱舞，我显得无能为力，不知所措。


    「哈哈哈！对此我深感歉疚，不过又不是我针对你，是其他人针对你好吗？！司徒先生，你未免太高估你自己了。解决你这种没有半分重的飘尘，我可是游刃有余。假如是我黎敬平一手策划，你根本不可能待到今天。


    很早以前，他们请教我要如何「招待你」，我只告诉他们：「拜托你们高抬贵手，意思意思，找出司徒超仁的抗压极限就好了」。


    黎敬平侃侃而谈，显得理直气壮。


    「……」我感觉撕心裂肺，晴天霹雳，只能蠕动着嘴唇，欲言又止。


    「从你的后续反应，我观察到，你并不是一个最弱的弱者，而是一个最突出最优秀的弱者，所以我很好奇，当『魔鬼聚光灯』打在你身上，会产生什么样的连锁反应？！由你司徒超仁所主演的真人秀，比探索频道中血肉模糊的弱肉强食还要精彩绝伦。因此，把你留下来，当然是因为你有被留下来的价值！


    看 著一个在低谷胡乱乱撞的无头苍蝇，凭著超人般的意志力任人鱼肉也无动于衷，穷途末路依然意志坚定，一步一脚印慢慢往上爬，忍受负重完成当兵的使命。一个如碎片的生存者有这样的能耐，实在令我万分激赏，太了不起了哈哈哈哈！」


    黎敬平讲得热火朝天，越说越亢奋，声嘶力竭的没完没了。


    一路以来的磕磕绊绊。今晚终于给了我一个理想的交代，结束了我想破头脑毫无思绪而捶心肝的日子。


    「为什么说，有，连，锁，反，应？」我听得瑟瑟发抖，吹胡子瞪眼间，不明白黎敬平想要表达的是什么意思。


    「司徒超仁，你有没有留意到，这一个举世无双的欺压盛宴里头，后来冲锋陷阵的已经不再是高高在上的长官或学长，而是和你同阶层的庶民，或是那些比你更微不足道的奴才。这一点都不出乎意料！奴才们戮力同心，处心积虑施展浑身解数向王献计，主要的目的就是要转移王的视线，这样就不会殃及池鱼。


    在大鱼吃小鱼，小鱼吃虾米的大环境里，当奴才们领悟到「弱者的生存之道」——掳对你这个稻草人是取悦王的唯一途径，那么他们就会为了明哲保身而不择手段。你就是他们保命的护身符，也是他们用来献佛的贡品！当奴才们被「针对超仁就是王道」的病毒感染到，你猜我还需要脱裤子放屁弄脏我的手吗；我顶多只不过是一个没有爆米花吃的观众兼路人甲而已，多可怜啊！」


    阴柔的黎敬平所说的话，如冷静和锋利的剃刀，在不知不觉中剃了我的心好几刀。当我真正发觉受伤的时候，已经血流满地，不可收拾。


    被当头棒喝的我恍如隔世，捧着一颗被压垮的心灵，椎心泣血。


    煽风点火唬使人的破坏力，比单对单明刀明枪对决更恐怖。


    最悲惨的不是敌众我寡，而是连敌人是谁都不晓得。


    「说句掏心的话啦，你不要以为桃李不言，下自成蹊！在这里或是外面的丛林，只在乎你的人脉阔不阔，后台硬不硬，靠山壮不壮！你要有立足之地，只有一百零一个方法，就是当上强者，成为王；根据达尔文的丛林法则，物竞天择，适者生存，只有强者才有生杀予夺大权，才有见魔斩魔见佛斩佛的尚方宝剑，才能凌驾于人性之上，不至于被其他人践踏，最终才能生生不息！哈哈哈哈哈！」


    黎敬平用手指压住一侧鼻孔用力出气，把从另一侧鼻孔擤出来的鼻涕抹在我布满精液的嘴唇上，并补吐几口唾液。


    「黎敬平你这借刀杀人的蛆虫，快杀我啊，来来来！你不是很想我死吗；如果你让我活着走出去，我一定会让你不得好死，断子绝孙！」我咬牙切齿诋骂着，切骨之仇非报不可。


    「想要报复我吗；哈哈哈！好啊，等你变成真正的超人再说吧！对了，假如你


    真的变身成超人的话，记得我啊！我是黎敬平！黎敬平这三个字，将会是你一辈子无法摆脱的梦魇！请多多指教！」黎敬平得意的笑着，从右边的架子上的暗处，取出一台数码相机。


    「今天的一切，我全部都拍下来了，大家来把一刹那的光辉，变成永恒吧！而且张张都是你一一超一一人的脸部特写哦，如果你不想要你婀娜多姿的美态被人 PO 在网络上，你最好闭上你的狗嘴！喔，超仁的裸体，人肉大搜索……哈哈哈哈哈……」黎敬平语带威胁的说。


    我心中暗骂：「只听说过有女人被人拍裸照威胁的，还没听过男人被这样搞啊！黎敬平！你最好不要让我找到机会！只要有一天我找到机会，在你临死之前，我一定会帮你清洗你肮脏污秽的灵魂，我要用热水和火烧的煤炭喂你吃，让你腐败的灵魂能够得到清洗，洗刷刷洗刷刷！之后，我一定把你碎尸万段，用刀片把你身上的肉，一片一片的切下来喂乌鸦！你死了之后，还要鞭打你身上一块块骨头，直到全部碎成粉为止！」


    接着我看到黎敬平从口袋拿出了一块布，捂住我的嘴。我不断想要挣扎，可是因为全身被绑着，根本动不了。


    「小超人乖乖，我想我要先请你小睡一下了，不然若是有人看到这里的一切，我想我可能会退不了伍，说不定还会被抓到牢里去。不过我想就算有人发现，我最后也还是会没事的。」黎敬平奸笑着。我吸入成份不明的迷药之后，就昏死过去了……


    在这段期间到底发生了什么事，李想手中拿着的图片没有记录，因此我也不清楚，只知道醒来之后，记忆图片显示是在军医医务室里躺着。


    不过因为昨晚喝了太多的酒，所以宿醉很严重，头痛得要死。


    ——这就是当时我清醒后的第一个记忆，海马回的记忆图片没有记录。为什么我会忘掉了之前黎敬平所做的一切，而又是谁对我施展过毁灭记忆图片的举动呢？


    这点其实就跟李想被清洗掉记忆的线索很相似，但李想看到这一幕的记忆图片后，已经忘记了他本来的目的——


    我勉强看了看四周，想要了解自己为何会在这里，需要找个「人」问……


    「你醒啦！」一个相貌俊朗，脸上泛着油光，梳着如前总统的油头，戴着黑色粗框眼镜，年纪大约 30 来岁，穿着医师白袍的男人，从帘子的对面慢慢走了过来。


    「你好，我是这里的医官、我姓秦，单名一个寿。」


    我差点笑了出来。


    「他妈的！好一个『医官秦寿』（衣冠禽兽）！」我心中暗想着。


    「对了！秦医师，为何我会在这里？我是什么时候被送来的？」我急着想确定所有情况的细节，即使八九不离十。


    「这些都不重要，重要的是你需要多休息，因为你的身体现在很虚弱。」


    秦寿并没有理会我满腹的疑问，只是要我多休息，别想太多。


    「请问当我来这里时，你有没有看到黎敬平？我印象中好像遇过黎敬平……呃，但随后发生的事……呃，怎么我什么都记不起来了……」我双爪捣着脸颊，露出痛苦的神情。


    而秦寿看着我，也没有太大的反应，只是说了一句：「哦，能忘掉不应该记得的事，总是好的。这种事情，我早就见多了，见怪不怪。我好心劝你，最好不要和黎敬平斗，你会被整得很惨的。」


    我觉得医官的回答中，好像透露出一讯息，而这些讯息似乎是反映着『医官肯定知道某些不可告人的内幕』，我一向都没想过跟黎敬平斗，到底『这种事』是什么事？


    「秦医师，听你这样说，你好像知道什么事情？」我试探性的问。


    「总之，你先休息吧。晚一点你们连上的长官会过来看你！」秦寿很明显的顾左右而言他。


    「秦医师，拜托你，我真的很想知道……」


    我话才说一半，秦寿就打断了。


    「超仁你不要再铁齿了，我能帮助你的，我都做了，我已经仁至义尽。我发现你脑部的血清素不足，导致你太过容易悲伤，可以的话多做运动。除此之外你也可以多吃香蕉，有研究指出吃香蕉能够振奋人的精神和提高自信心，还能缓和情绪，并具有抗忧郁的效果。据说，香蕉含有制造血清素的原料……唉，黎敬平已经退伍了，在今天早上就离开了，你就当什么事都没发生过吧……」


    秦寿最后回了这句话后，他突然转身双手环抱着头颅，额头紧贴着额头，我渐渐昏昏欲睡，开始出现幻觉，看到黎敬平的形象愈来愈模糊，渐渐消失在幻想中，接着秦寿就离开了我的病床。只留下满脑子空空；独自发呆的我，躺在那一间


    空荡荡的病房里。


    从这一天开始，我对黎敬平的恨意全无。黎敬平就像是一位很陌生很遥远的学长。


    不过，我却需要面对一个长期的后遗症……


    不知道为什么，每一天晚上都会梦见一条红色人形的巨无霸香蕉，在梦境里不停地追着我。他们一直跑圈圈，不断地跑圈圈，直到我跑得全身脱水，油腻腻脂肪也跟随者水分散流出来，此时我的身材变成了营养不良的饥民，连吞一口水，吸一口气都能让肚子暴胀。


    「啊……我是谁啊？啊……啊啊……你又是谁啊？为什么死命追着我！」在梦中我总是如此惊醒。


    「吼吼吼吼吼……」红色巨无霸香蕉双手叉腰仰天淫笑，口音很像一个人。


    如果不是李想误打误撞，冒失地闯进超仁的海马回拿出这张记忆图片，黎敬平只不是记忆里一位很陌生又遥远的军中学长。


    超仁坐在餐厅的座位上，想起这段不堪回首的往事，整个人的火气都上来了，呼吸也愈来愈粗重。


    他的手心灼烫，拳头愈握愈紧，盯着那个变态的敬平学长，有一股冲动，想要冲上去就一拳往凤敌鼻梁上灌下去，让他鼻血如喷泉般爆喷而出。


    但这纯粹是他的幻想。七窍生烟的超仁并没有真正行动，一方面是他本来就是个愤怒不过半秒的胆小鬼，另一方面是黎敬平的旁边有四个穿黑色西装，戴着墨镜，一脸横肉，身高六尺多的彪形大汉当守护神。


    「看来好像是他的保镖，如果我现在贸然冲出去，岂不是送羊入虎口？我还是识趣一些，才不至于捅马蜂窝。可能我的拳头都还没碰做到他，我就已经被四个黑衣人拖到后面的巷子修理一顿了。君子报仇，多少年都不晚。」超仁虽然胆小，可是管中窥豹，对于目前的情势谁占上风，还是很清楚的。


    于是气冲牛斗的超仁把原先要离开椅子的屁股，再度贴回原位，调整呼吸之时，拳头也慢慢松开了。


    「不过这口气我实在是咽不下去，记住精卫填海的精神，我一定要报仇。」超仁下定决心。


    而黎敬平也因为旁边有溜须拍马的餐厅经理，和一堆阿谀奉承攀龙附凤的阿猫阿狗围着他，所以并没有留意到超仁。


    就看着黎敬平一行人，浩浩荡荡、有说有笑上到二楼去了。


    超仁趁着黎敬平上了楼后，丢下一张千元大钞在桌上，连零钱也不拿，就倏然冲出了餐厅后门，来到了餐厅后面的小巷。


    惘然若失的超仁，因为一张遗失的记忆图片，将他的情绪掀起千层巨浪，他渐渐明白他为什么极度排斥吃香蕉，凡是看到人吃香蕉他就会不停地呕吐，当晚必然会梦到自己会被一根巨大红色的香蕉追。


    要不是李想，他根本无法知道他对香蕉的排斥原来是……


    因为这个原因，当他看 A 片的时候，他都是故意跳过前戏，直接看精华部份。


    难怪超仁经常无法控制地强迫自己刷牙，尤其他从水沟出来之后，脏兮兮的超仁肯定先会刷牙超过半小时，之后才洗澡。


    刷牙的两个小时后，他会不自觉的一口气吃五条以上口香糖，挤爆整个嘴巴，好像在嚼汉堡似的，方才感觉一丝安全感。


    到了这一刻，这些不寻常的习性，都可以被理解了……


    这一切全都是由黎敬平所造成的心理阴影。


    超仁紧紧握住颤抖不已的拳头，酸酸的眼泪已经在泪腺蓄势待发。


    「那我底 [有] 什么条件可以跟他斗？！」忍辱含垢的超仁反问自己，口气有一点哽咽。


    超仁此刻的心智与情绪像是回到军中生活的他，变成一条绝境求生的可怜虫。


    在军中生活的他，知道自己真的什么也没有，但是在窘迫的处境之下，他只能像过河卒子一样往前冲，他必须在一切看似不可能之中找出可能性。


    「我到底 [有] 什么？！」超仁大声的反问自己。


    「我 [有] 年轻的本钱，我 [有] 冲动，我 [有] 家人，我 [有] 励志书，我 [有] …… 」超仁殚精竭虑列出对他有帮助的东西。


    「诅咒……」


    超仁对自己说了一连串的话后，说出了这一句，这过河卒子终于冲出了军中生活的屏障，他的心智与情绪渐渐从军中生活里绝境求生的可怜虫，恢复到现在的司徒超仁。


    「对啊！我有诅咒的神力啊！怎么没有想到呢？这是我唯一最大的优势啊！


    虽然偶尔不太灵，可是却常常有效，就算命中率只有1%也没关系！只要我诅咒100次之中灵验1次，我就有机会了！况且我的实力还远超过这个机率！」超仁发现了自己的优势后，欣喜若狂，忍不住傻笑起来。


    「黎，敬，平，我，要，诅，咒，你……」


    超仁说出了这一句，他决定违背对李想的承诺。


    他和李想的协定是：寄发乌鸦电邮给黎敬平，对黎敬平的情人与孩子进行诅咒、发出警告，李想答应过超仁，收到了祈福忏悔金，就对黎敬平进行诅咒，不但要他的钱，还要他的命！


    超人紧握双拳，猥急的筹谋着：


    「不！刚才李想还说，收到钱之后可以帮我报仇，而且他对报仇这件事一向都稳操胜券。如果我躲在水沟发功，加上李想的诅咒，双剑合并，就会变成七龙珠中由孙悟空和达尔合体的达洛特，呈现最强最杀的无敌状态，胜算肯定大大提升，简直就是瓮中捉鳖。反正师父说要干一件大事，让所有收过我们乌鸦电邮的人都大吃一惊，都跌破隐形眼镜！〈注〉请看《神棍》第二集之〈第一话：前因后果〉


    「话说回来，如果私自行动，真的让我把黎敬平给诅咒死了，那么我们就什么钱都收不到，而且李想肯定会大动肝火，岂不是赔了夫人又折兵吗？不过，李想这家伙真的会替我报仇吗？」超仁又开始怀疑起来，逡巡不前的他尝试以理性的角度，努力计算这一场仗的得失和风险。


    就在这个时候，颠扑不破的隽语箴言奇迹般出现了，这是励志类书籍发酵的结果。


    超仁房间里面的梦想板，摆放着一本据说内容已经改变了千万人命运的红色天书。


    除了R&B小天王两年前的主打歌《超人不会飞》，这一本红色的激励天书帮他打了一针无敌强心剂，其书名和超仁息息相关，所以让他更加爱不释手。


    这一本书附送有声书，书上写着，只要反复听读，反复领悟，当读到一千遍并反复运用的时候，奇迹就会出现！


    超仁为了激发自己成功的潜意识，每一天不间断播放这个有声书。就连睡觉的时候，上厕所的时候，开机车的时候，看A片的时候，他都会听这MP3，反复听着这本书的内容。


    直到今天，他已经听了超过一千遍，而且对红色激励天书中的精华倒背如流。


    当初他只希望在潜移默化下，能够把成功的基因移植到自己身上，不需要搜肠刮肚，就能够把最卓越的一面流露出来。


    到时候，登峰造极的超仁就真的会飞了！


    「超仁，成功者总是主动出击！」超仁甲说。


    「超仁，成功与借口永远不会同住在一个屋檐下，选择成功，就不可以有借口；选择借口的人肯定不成功！」超仁乙说。


    「超仁，成功者愿意做什么事情呢？对了我想起来了，是做别人不愿意做的事，做别人不敢做的事，做别人不肯做的事和做不到的事！」超仁丙说。


    「超仁，人不疯，他的企图心就不够大。人不疯，很难成功啊！超仁，当有人说你「疯」的时候，可能你就要成功了！」超仁丁说。


    「超仁，没有推到极限，没有全力以赴的人，他的人生就好像飞机机长没有把排挡杆推到极限，他的飞机不管飞多久，永远都是在机场！」超仁戊说。


    「超仁，成功者总是以最短的时间，采取最大量的行动！」超仁己说。


    「超仁，你是想要成功，还是一定要成功？」超仁庚说。


    「我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的，我是最棒的……」


    超仁高高举起了权威一指，指向了天空，并不断地激励自己，和书名一模一样。


    「全世界听着，我司徒超仁已经准备豁出去，黎敬平你不会再有和平的日子了，已经没有任何和平方案的解决方法，我要让你每年、每月、每天、每时、每分、每秒都不会有好日子过，我要干一个损人不利己的战斗！黎敬平你滚回苏州卖鸭蛋吧！去死吧！我不只想要你死，我一定要你死！！！」


    即将甩开包袱的超仁双手紧握著拳头颤抖着，彷彿看到胜利的曙光。


    「我，司徒超仁，在这里对著天上的乌鸦和地上的垃圾桶许下公众承诺，如果我没有了了天以内把黎敬平给干掉，我就剃掉全身上下，的毛，无论是头发、眉毛、鼻毛、腋毛、脚毛、阴毛，通通剃光光！同时我裸奔，一丝不挂到士林夜市跑来回一圈！裸奔士林夜市！」

