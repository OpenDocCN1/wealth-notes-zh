    「唬……唬……唬……」


    汗流浃背的李想趴在床上，发出困兽般的闷哼之声。


    他慢慢伸直双爪，抓住床头，如禽兽择偶失败那样愤怒低吼：「臭屁，李我想怕你？我倒要看谁怕谁？」


    李想紧闭双目，企图打开他的天眼通。


    可是他只看到很多缤纷的光彩交织着。他继续用力专注，眉心隐隐有些发痛，但他的灵眼还是无法穿过光彩网。


    接着，他额头溢出汗水，全身颤抖着，一个翻筋斗，站稳了脚步，高喊：「战斗胜──佛……」话声未落，他便向前扑倒，碰一声，李想一个踉跄趴个狗吃屎。


    只见李想狼狈趴在地上继续颤抖着，并发出撕心裂肺的呻吟声。


    出奇的是，李卜与张紫怡依然昏睡着，全然不晓得病房内李想不寻常又痛苦的举止。


    李想用尽力气睁开眼睛看着门口，咔嚓一声，一个熟悉的身形推门而入，接着有一个瘦巴巴的人跟在那人的身后。


    ……李想看到门口有七色光彩交织着，接着他心神紊乱，歪着头张着嘴，露出了发白干裂的舌头不断喘气。


    此时，许多 3D 立体图片不规则的出现，像蜘蛛网般交织在房间内……


    瘦巴巴的人郑重宣布：「这就是我用灵力，将大家的记忆图片交织在一起的效果了！有星日马李忠在『丽花宫』牵引他的神识到这里看『电影』即可了……呵呵。」


    李想用尽力气站了起来，他想睁大双眼看清清楚眼前的一切，瘦巴巴的人走到李想跟前，好像主人摸宠物那样摸着李想的头发：「李想，乖……」


    李想顿觉得眼睛一阵刺痛，像是被强光照射着，他无法睁眼，接着他觉察到一只干瘪的手掌抚摸着他的头颅，不断地磨蹭，感觉像被性骚扰。


    李想慌张地用力推开这只手，霎时他像触电般，脑海有一片又一片的记忆图片浮现出来……


    他后退了好几步，几乎失去重心跌个四脚朝天，但总算是勉强稳住脚跟，真的险象环生。


    李想的眼神放射出骇人的辐射咆哮：「别碰我！」


    「你看到什么吗？」瘦巴巴的人歪着嘴角阴阴笑。


    李想深呼吸了几次，眼前景物犹如随着摄影机光圈被调大，而慢慢变得清楚了。


    站在他面前的是一个瘦巴巴的老人，而站在老人斜后面的，竟然是与李家渊源极深的张虎。李想的虎躯颤抖不已，他用眼角扫视病房内四周，看到李卜与张紫怡在沙发上睡得像死猪一样。


    老人蹒跚走近李想一步，诧愕的李想不自觉后退一步，他伸手在床头上随手抓起一个瓷杯，握着手柄作势要丢过去。


    他那就保持着「从未失误」记录的第六感告诉他，张虎与瘦巴巴的老人来者不善，而且自己的父母昏睡就是他们俩做的好事。


    老人用右手比剑指，闷哼一声：「去！」李想手上瓷杯应声而碎，均匀的粉末纷纷扬扬的落了一地。


    「能够用精神力量改变物质形态的，才，叫，做，神，通！」


    老人微笑著看着他，字里行间充满五行的磁力。停格的李想目瞪口呆看傻了眼，抖动的双脚钉死在地板上，心脏好似跳着火热的巴西桑巴舞。


    李想迅速恢复神识，他双手举起身前的一张椅子高举过头，而老人立刻伸出右爪，在空气中一捉，闷哼：「著！」李想手中的椅子像被一股强大的吸力扯走，椅子飞到老人的手中，可是老人只用他的左手尾指支撑著整张椅子。


    李想心里无比震惊，嘴巴张得更大，全身颤抖不已，一个念头涌上心头：「这厮想杀我，简直易如反掌！」


    目前的局势是跋前踬后，动辄得咎，李想现在也只是螳臂当车。


    老人和张虎同时露出既得意又胜利的神情，这一切都是他们预料中事。


    老人轻松地微微一笑，李想被他那诡异的笑意搞的心烦意乱。


    李想心气一急，打个哆嗦，脑中一片空白，一个翻身筋斗，站稳身子，正想高喊句：「战斗胜佛重临人间……」但老人后发先至，用右手按住李想的顶轮。


    李想全身瘫痪跪倒在地，陷入昏迷之中。


    看来他的「战斗胜佛」尚未出现，便已经被老人的右手按得消失无踪了。


    他想藉助精神分裂的「战斗胜佛」显身，可惜，在老人面前根本是无用武之地。


    李想象孙悟空被观世音收服，无法自主又进入了他遗失的记忆中……


    「乖，李想，慢慢享受接下来更精彩的回忆吧！」老人嘴角上扬着。


    ## 第五章


    ### 李想遗失的记忆 8


    天花板再度裂开，那阵旋律相同、似有还无的音乐又响起。一道彩虹从天而降，一个身段苗条的女人站在彩虹上，女人背后有刺眼的五色神光。


    这个女人笑嘻嘻地向我招手——这次我看清楚了，她酷似我老妈子张紫怡，我认得她的胸型。


    她躺在弧形的彩虹道上，张开双腿……


    我张惶失措，不知道要不要继续看下去，即使她的阴道和我有革命情怀，不过她是我妈耶！


    突然，一阵天旋地转，我像被龙卷风卷起，又落到一片湿漉漉的沼泽地。


    这里是很黑很暗的洞窟，只有微弱的光线从地下一个小小泉眼透出。


    洞窟里的水愈来愈多，渐渐淹过了我的身体，我想高喊救命，可是嘴巴一张开——咕噜咕噜，液体便迅速灌进我的口中，顺着食道，涌入胃部。


    我慢慢蜷缩起身体，感觉自己正慢慢缩小。


    不知过了多久，我曾经计算过，肯定有九个月以上……


    突然，地下的泉眼张开，我随着洞室内的水，哗啦哗啦地滑了出去。


    我慢慢站起来，看见一双女人的脚，分开来跨在妇产床脚蹬上。


    她腹部高耸，虽然我无法看清楚她的相貌，但我感觉到她就是张紫怡，她给我的感觉既熟悉又亲切，但此刻似乎又有点疏远陌生。


    她也是站在彩虹上的那个女人，背后透着同样刺眼的五彩神光——穿着青袍的医生往她的会阴轻巧又迅速割了一刀，鲜血淌出来的同时，小孩的头也出来了。


    她用力推挤，小孩滑进医生的双手里……


    医生熟练地抱起小孩，紫色的皮肤渐渐变红。


    接着，医生拍拍小孩的屁股，让小孩受到刺激急促的哇哇大哭，小孩哭的时候打开隔膜，这有利于肺泡的张开和气体交换。


    「恭喜，小小的男子汉出生了！」我看到护士绑紧脐带；然后剪断。


    这是我，这是我！


    我感到一阵喜悦，像是获得重生一样——我出生了！我兴奋地手舞足蹈……


    轰隆一声，我被一股吸力扯入另外一个空间。


    这一次，看到老妈子张紫怡抱住我：「宝宝乖，妈妈抱你去洗澡喔……」


    我心里好温暖，感觉得到母子情深。


    她正脱去我的上衣，却突然发出杀猪般的惨叫。


    张紫怡把我摔到地上，并指着我的胸口的一块肉瘤。


    这一块不寻常的肉瘤，从一个不断溢出脓血的伤口长出来，有两个马铃薯那么大。


    我还来不及看清楚画面，突然我被狂风一吹，又飘到响着嘟嘟声的房间里……


    我看到我躺在手术台上，一位穿青袍的医生切除我胸部的那块肉瘤，接着医生将肉瘤放在助理护士手中一个圆盘上。


    助理护士瞥了一眼，接着她发出震天刺耳的惨叫声，她跌跌撞撞往后退，圆盘也拿不稳。肉瘤随着圆盘跌在地上，她立刻转过身子，头也不回冲向门口，一溜烟就蒸发于手术室。


    护士还不小心的搞倒了放手术工具的推车，所有的手术工具都随着推车散落在地，叮当叮当声响个不停。


    她猛力推开手术门，哭喊跪倒在楼层的柜台，不停地呕吐，把之前所吃的麦当劳快餐通通都呕了出来。


    青袍医生看了肉瘤也后退了数步，当场进行自我催眠：「没事没事！冷静冷静！现在要保持镇定，深呼吸、深呼吸，千万要记得我是医生。我现在在手术室内……」


    青袍医生下了判断，他暂时将肉瘤搁置一旁，全心全意地抢救着我。


    我要看清楚，到底医生从我的胸部挖出怎样的肉瘤。


    我看到，静静躺在地上的肉瘤，就像一个血淋淋但没有头盖骨的头颅……


    而肉瘤不只有不断眨着的大小眼，没有鼻子，只有一张不断开合的嘴巴，嘴巴内还有两排隐泛寒光近似鲨鱼般的利齿……


    「分开了，分开了……终于分开了……」


    我听到同一个空间，传来司徒超仁凄惶的声音，但我看不到他的存在，如果他没有发出这种声音，我根本不知道同一个空间，有两个人共同看到这一幕。


    分开什么？妈的，分开什么？


    我开始意识到自己真的被分开了，但分开什么？我有一股不祥的感觉，不由自主地看着地上的肉瘤，我声音颤抖着喃喃道：「没有分开，分开什么……」


    「不！不！这不是我，这不是我！」我想将这个怪物踩个稀巴烂，但我双脚对淮怪物肉瘤跳起来、用力一踹时，地板竟然裂开一个大洞，我就这样一直跌落，不知道跌落了多深多久……


    ……轰隆一声，我又被吸力扯入另外一个空间。


    这一次，看到老妈子紧张抱住我，她竭力忍着眼中的泪水，疲惫的将我放在婴儿手推车上。


    「妈，她是我妈……」司徒超仁惊慌的声音又在房间响起……


    「不！这个婴儿应该是我，而那块大小眼的肉瘤不是我，真的不是我！」我狞笑，指着躺在婴儿车上的我说话。


    老妈子神色恍惚的推着婴儿车，她痴呆的眼神直视着前方，打开大门，我意识到不寻常的事情将会隆重登场……


    我心里发急，想阻止某件事的发生，便冲了出去。但刚出房门，一道强烈刺眼的阳光照射将我反弹回房间内，身体也冒出了浓烟，并散发出烧焦味。


    我悲痛莫名，指着老妈子狂骂：


    「你这臭婆娘，你生了我，又舍弃我！你畜牲都不如，从今天起、我再也认你为母亲！臭婆娘！我死了之后，没人替你庆祝母亲节，更没人替你送终，如果我重生，我一定要想办法折磨你这臭婆娘至死！」


    但她还是听不到我愤怒中带着哀求的叫喊。


    「不！不！妈，千万不要舍弃我，你是我的亲生母亲啊！我，我不要做弃婴……」


    司徒超仁熟悉的声音从空气中响起，感觉上是婴儿内在的声音发出来，当这个声音出现时，我又感觉到我是这个婴儿的一小部分，而那个声音又像是婴儿独立又自主的生命，他的声音像是完整的生命……


    如果婴儿不是我，为何我又觉得自己是婴儿的一部份呢？


    而我呢？我去了哪里？


    但由婴儿发出的声音，我又确确实实感受到我已经不是婴儿的一部份了……


    我到底去了哪里？


    感觉上，我的躯体还是留在房间里，但我的灵体依然看到老妈子推着婴儿车走到繁忙的街道上。老妈子像下了最大的决心，加快脚步走进一家佳世客大卖场。


    她步入婴儿用品的部门，举目看了四周一下，确定没有人之后，就更小心翼翼地将婴儿车推到一个角落。接着她假装选购婴儿用品，慢慢移动几步，若无其事的离开婴儿车远一点。


    她假装很专心选看物品，但又鬼鬼祟祟的再离婴儿车远一点，当她再度确定四周没有人注意到她时，她便头也不回、加快脚步离开了婴儿部门。当她走出大卖场后，竟然流露出异常兴奋的模样……


    我像是隔着一个很远的距离，看着与我相关但又无关的画面。


    接着我一阵晕眩，眼前又陷入一片黑暗……


    □ □ □ □ □


    司徒超仁躺在床上，紧闭的双眼，也流下了两行热泪……


    他一板一眼、一浮一沉的呼吸，每个呼气都像沉载千年的怒气往外吐尽，他心胸微微的红光异常的跳动著。


    接着，他呼吸声慢慢的均匀。房中，一个叫星日马李忠的神秘老人确定司徒超仁又进入了沉睡中，他才露出满意的微笑，缓缓的闭上双眼，继续盘腿而坐。


    ## 第六章


    ### 李想遗失的记忆 9


    我又回到湿漉漉的沼泽地。


    我没有了任何感觉，因为我的心已死……


    水在洞窟里渐渐升高，水位已经到达我的胸口，每一口吸气都达到极限。


    水淹过了我的头，我放弃了憋气念头。


    我好想死，老天爷您可怜我，让我溺毙在这洞窟里吧……


    我听到微弱的「嘟……嘟……嘟……」声音响起。


    嘟嘟一声，都间隔了很久很久，我意识又渐渐模糊不清……


    哗啦哗啦，我像又从洞窟滑了出来……


    我连站起来的力气也没有，干脆躺在地上看着天花板。


    我听到婴儿的哭叫声，我知道我又出生了。


    我听到医生吩咐护士说：「拿去清洗干净。」


    他继续说：「恭喜你们！」


    我不想再多看这臭婆娘一眼，但我被房间内的喜悦气氛感染到。


    这时，我被一个熟悉的声音吸引住。


    我慢慢站起来，看到我的老爸李卜侧坐在臭婆娘张紫怡的床边，爱怜地握住她的手，抚摸着她的头发，他们俩满脸洋溢着喜悦、幸福。


    「骗子，无耻的神棍李卜，没良心弃婴的臭婆娘」


    我冲到李卜的面前，往他的左脸送了一记左勾拳。


    接下来的事让我震惊不已，我拳头竟然像气体般穿透了他的脸颊。我顺着力道的去势跌了一跤，以为自己会跌在臭婆娘的怀里，但我也穿过她与床铺，跌在地上。


    我余怒未消，想再站起来掐死他们。


    这时，房门打开，护士抱住我进来。


    李卜接过我，轻声呼唤我的名字：「李想，李想，爸爸抱你，乖乖……」


    我听着自己的哭声，惊讶得嘴巴不能合拢。当李卜弯下身，将刚出生的我温柔地放在张紫怡的手里，她伸手抱住我，将脸亲密地贴近我的红润润的脸颊时，一瞬间我看到自己心胸里面空了一个洞。


    「李想！」他们俩紧紧将我团团环抱着，我感受到自己是他们的心肝宝贝和掌上明珠。


    我闭上双眼，嘴角很自然的向上弯，享受着当下的幸福与爱——我很幸福……


    我感觉自己心口的空洞慢慢被填满了，我低头看着空洞逐渐修复……


    突然，我开始察觉原来我已经死了。


    但眼前的一幕，我又出生了！


    死亡与出生像间隔着一道门，死亡与出生也像钱币的两面。


    我的灵魂亲眼看着自己的出生，也确实感受到自己的死亡……


    看来，是离开人世的时候了……


    死亡，就是灵魂离开人的臭皮囊，进入另外一个空间。


    我再也无法主导自己的身体，感官系统对于外界的刺激，全然与现在的我扯不上任何关系。


    我思绪一片凌乱，好像思绪发生了连环车祸，全部都乱七八糟的撞到一起。


    咦！我记起来了，我终于记起来了……


    我的自线杀人计划。


    我开着 CDEZ-2，几乎撞上大型卡车时，我本能地转动方向盘……


    我发生了严重的车祸。死亡是过渡，出生是苦难的开始。


    我的记忆的一格连着一格，在我面前重演着……


    干！找还没死！


    我觉得自己又被戏弄了。


    感到全身肌肉麻痹，与疼痛相互交错。


    我开始感受到肌肉的僵硬，接着便失去平衡，瘫痪靠在墙壁上。


    后来又恢复了神智，我体内的感官系统只剩下痛楚的感觉，痛就像烈火一样燃烧着我每根神经，我全身皮肤都像裂开一样……


    嘿，你们这对贼父贱母，你们要的只是没有任何自主权的，三个月大的小李想！你们完全不管在怡保车祸中生死未卜的我。


    我已经不想再做长大后的李想，我一定要用自己的神识回到刚出生的我，我看到李卜抱住我，感觉好温柔，好温柔……


    我希望自己的时间永远永远永远停格在这一刻……


    虽然我的意识还是迷迷糊糊，但却能感受到自己被包得像木乃伊一样，全身无法动弹，我的呼吸很弱很弱。


    喉咙以慢节奏闷哼着「呃……呃……呃……呃……」的呻吟……我不是死了吗？


    ——当时，我还不了解人性分成两个部份，第一就是先天的「本性」，第二就是后天的「伪性」。不过当我明白这两者的差别时，我已经成为举足轻重，叱咤风云的头号人物了——


