    # 序幕


    # 「李想遗失的记忆一」


    我满心雀跃的拦腰抱住 Angelina，她作势挣扎，想摆脱我的上下其手，却碍于我的淫威而不敢过度抗拒。


    我将嘴唇紧贴着她油滑滑的朱唇，贪婪地用舌头撩拨她的舌尖。


    她全身不由自主扭动着，一边喘着气，一边发出气若游丝的呻吟——对，我要的就是这种反应，你继续享受吧！


    我把她推倒在床上，脱掉她粉红色蕾丝边内裤，硬塞进她的嘴里，接着将她的右腿抬起，放在我的肩膀上，我拼命扭动着身体……


    她发出不知道是痛楚还是亢奋的呻吟，几乎毫无反抗之力。


    我的双手继续快速用力揉捏着她的身体各部位，她已经不再挣扎，开始和我乳交融难分难解。


    看来她似乎已经达到浑然忘我的半昏迷境界了。


    哼，这么快就想我满足她，岂非破坏我的原则？


    我缓缓停下，轻轻推开她，用挑逗的气音对她耳语：「Baby，让我们到了兰卡威岛的老鹰饭店，再进行激战吧！」一面用力捏住她粉嫩的双颊，放开手，缓缓的站了起来……


    我看着赤裸躺在床上的她，出其不意。狠狠地反手掌掴她的脸。


    「啪、啪！」声响是多么悦耳动听。也许我出手过重，血丝从她的嘴角溢出。


    我龇牙咧嘴狞笑着，紧紧抓掀她的头发，粗暴地将她拉离床铺，旋即用力将她推向墙壁。


    「咚、咚…」传来几声美妙的撞墙声。


    她背倚着墙，颓然顺势滑坐在地，双眼布满红丝，眼泪潸潸流下，但也不敢哼半句。


    接着她把含在嘴里的蕾丝边内裤奋力一吐，用又爱又恨的狂野眼神瞪着我，犹自气喘吁吁，全身虚脱无力——哈哈，最爱 Angelina 这种与生俱来被虐的倾向，正好满足我的性暴力癖好。


