    眼前又陷入一片黑暗，呼噜呼噜声响起，他又看到五色光明。


    朦胧中，那个人又影影绰绰的出现了。


    他心情渐渐恢复平静，开始感到很充实，有一种温柔的声音，有节奏地指示着他：


    呼——吸——呼——吸—！


    慢慢的，光明中那个人随着司徒超仁有节奏的呼吸，渐渐化成一缕薄如轻烟的光，随着他的呼吸，缓缓进入了他的鼻腔内。


    超仁感觉有一个人躲进了自己的身体，慢慢腐蚀着他每条神经，溶入他的血液、心跳、呼吸、意识中，他跟他已经合二为一，接着他的胸口微微发出红光，起伏着……


    「南无阿弥陀佛夜，哆他伽多夜，哆地夜他，阿褥利都婆毗……」


    如果听到《往生咒》的诵经声，不需要见怪，因为这是超仁为李想特设的铃声。


    此咒取自于《拔一切业障根本得生净土陀罗尼经》，而演唱者则是演艺圈时下最夯、最牛的当红炸子鸡，胡静怡。


