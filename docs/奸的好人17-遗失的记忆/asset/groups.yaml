    这个人神色凄惶，额头冒着点点汗珠，不断比手划脚自言自语，在只能容纳一只四脚兽的狭小空间里来回踱步。


    「但，怎么会这么刚好呢？！怎么会………


    他耸耸肩，叹了一口气悠长的气，仍然在脑海的暗室里寻找藏着答案的宝盒。


    「今天梦中幻觉的车祸情况，怎么会和我从吉隆坡被送回台湾时，我那段失忆的时段，与爸妈所胡乱描述的情况简直一模一样呢！」这个人脱口说出了这句话。他不是别人，他正是司徒超仁。


