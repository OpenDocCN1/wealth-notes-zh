    哼！老爸告诉我，这个修炼法是他临时凭空想象出来。话说当时他正开着一个玄门正宗神通异能修炼班，因为找不到资料，老爸自己狗急跳墙，胡乱创作一个「太阳神通异能开发法」来应急。


    后来，老爸看中超仁不知所谓的诅咒力量，又将这套「太阳神功」改名为「消除业障，伏魔平妖，驱除小人，五雷轰顶，天诛地灭，升官发财，上天下地，唯我独尊」诅咒法。


    嘿，老爸说名字愈长愈容易骗人。


    当时老爸为了骗超仁，所以教超仁这个法，一开始我并不知道此法是老爸的虚构，因此跟超仁一起修炼。


    结果超仁练不出什么效果，而老爸看到我天天勤苦练功，才将真相告诉我，并吩咐要我不必再修炼。


    但我知道真相的时候，我已经练成了不可思议的诅咒力量。


    黑暗的守护神，也说我是借假修真，结果将假的变成真的力量，因为我是菩萨转世。


    老爸和老妈子飞去美国第三大药厂，又想引进新的算命骗局用来骗钱，说想配搭上超仁有时有效，有时没效的粪便蛆虫诅咒大法。


    我估计，如果老爸不将乌鸦行动的诅咒交给我办，相信不出半年，乌鸦行动就会因为超仁的诅咒有时有效、有时没效而被捣砸！


    我不知道老爸在想什么？以超仁这等三脚猫的烂诅咒功夫，以他一个超弱的来拉我这个超强的，怎么说也通不通！


    其实老爸只是很单纯相信「老妈子摸骨法」，摸出司徒超仁具有死神诅咒的力量。


    但在我眼里，不必靠超仁也可以！


    不过老爸不相信我能将「假」的修成「真」的。


    老爸向来都认定我有精神分裂症，总是千叮万嘱要我按时吃药。


    因此趁老爸不在，我告诉超仁，我们要干几件大事轰动台湾，而且死得愈多人就愈好！


    在我的辞典里，没有鸵鸟政策，只有效果！


    当我修炼这个「消除业障，伏魔平妖，驱除小人，五雷轰顶，天诛地灭，升官发财，上天入地，唯我独尊」诅咒法，确实是有生理上的感应。


    最重要的是，现在我终于修炼到可以用这个密法来诅咒人，而且诅咒的效果也不比死胖子的「粪便蛆虫」诅咒大法差。


    老爸虽然承认用虚伪的神通进行欺诈超仁，但这方法反而对我有效，只是老爸没足够的功力驾驭这个方法罢了！


    我趁着老爸飞去美国时，我做了以下的实验，我相信他回到台湾，看到了我这张成绩单的效果也会哑口无言，无话可说！


    李想陷入一阵沉思，将他诅咒成功的成绩单，放在桌子上，纸上密密麻麻写着：


    1. 巴先生在玄门正宗碰到我，我随口说他会有针剥熬到来！结果他离开玄门正宗后，到庙会大拜拜，人潮中他被推挤到乩童身旁，乩童当时起乩，甩铁针球，甩到巴先生的下巴，庙方赶紧送人带铁针球送医。


    李想的救赎：


    我让巴先生这个虔诚的道教徒去庙会里吸收各大神尊的灵气，刻意安排许多乩童子化成人潮，让巴先生接近乩童，吸收正灵降世的正阳之气，来洗涤巴先生从头到脚的晦气与霉运。我还特别费心让乩童的铁球针甩伤巴先生，让他流出前世不好因果所带来的血液，也化开巴先生这世造口业的障碍。


    基督教所谓耶稣扛十字架为人类赎罪，在道教来说，乩童拿五宝让身体流血是祛除邪魔，我让巴先生下巴刺着铁针球流出血液，也意味着替他全家人祈福销罪……我的确是人世间的菩萨！


    2. 在街道上碰到卖豆腐的李先生，知道他销岁的大儿子很喜欢《头文字D》漫画，所以我吩咐李先生劝他的儿子，开车不要逞凶斗狠在街头乱窜蛇行喔，如此才可以避开S煞！结果李先生没听我的话，他晚上喝醉酒时，在街头开车一样S型乱冲，虽然没有事，却在媒妓行房时，女方阴部呈现S状锁紧了阴茎，拔不出来，救护车载走双方就医！


    我必须解释为什么会跟诅咒不同：


    虽然我没有看过李先生的大儿子平常在街头开S型乱开车，我估计，他的大孩子因为崇拜《头文字D》，有可能会危害路人。在台湾，如果李先生开车致人死伤而逃逸，要被处六个月以上、五年以下有期徒刑。当李先生的大儿子致人受伤而逃逸，会被吊销其驾驶执照；致人重伤或死亡而逃逸，要吊销其驾驶执照，并不得再考领啊。


    老爸，由于我慈悲心肠，发愿救世，不让青春年华的他因为S型开车闯祸毁了一生，同时我也要让他了解，学生时期就是只能读书，所以我在关键时刻，念力一转，希望转嫁在李先生做父亲的身上，因为养不教，父之过。


    大学生最好不要乱交异性朋友。有了性爱，就会有杂交的可能，这会病毒攻心啊！不过，他做老爸的又不检点，已经有太太了，竟然还敢媒妓，因此我绞尽脑汁让他接受S型紧缩的地狱式处置法，让李先生替代了大儿子的诅咒，结果还是S熬教训了李先生。


    我这次费心劳力，救了一位前途不可限量的学生！我想叩问天下仁慈之心，舍我其谁？


    3. 有一次我在街边，看到一位小姐是长发的，我心里动了一个念头：头发熬。结果第二天《芭蕉日报》报导，一位长发女性回家坐出租车，下车时头发不小心被车门夹住，而司机也累了，没注意就开车，结果女人的头皮被掀掉了。


    4. 我跟自己说，今天不要开车，不然会有车祸。第二天我又看《芭蕉日报》，看到一位陈先生开车很慢，也很注意来车和后视镜。可是经过一个路段时，突然有一个中年人从安全岛跳出来，结果把那个人撞死了。经查证，那人是久病厌世，所以选择自我了断。


    5. 我今天忘记倒垃圾，因为我的潜意识告诉我，今天会有人犯垃圾熬。结果我还是在同一天的《芭蕉日报》读到：一个人倒垃圾时，因为要追垃圾车，结果一个重心不稳，整个人掉进垃圾车里去。


    6. 我每次看到你的好徒弟司徒超仁蹲在水沟，结你所谓的粪便蛆虫诅咒法，我就想：总有一天，会有大便熬的出现。结果当天晚上我梦到，你逼我看的精神科医生，他因为一天内都没有吃啥东西，所以肚子很扁。他在路上路过傻水桶时，他特别注意并闪开。不过他继续往前走时，他看到有人在他的面前昏倒了，结果他发现那个人没有呼吸了，便马上为他做CPR。做人工呼吸时，那个人突然醒过来，大吐特吐，结果精神科医生整个口腔都被那个人当作呕吐盆使用。梦醒之后，我就坐在床上哈哈大笑！


    7. 结果我继续睡觉，又梦到：司徒超仁上了飞机后，因为吃坏肚子，他跑进厕所上大号。而飞机上的马桶是那种上完后把秽物自动吸进去的装置。可是这次的声音怪怪的，可能是因为大便太多了，所以有点不通，结果马桶吸几下后就爆炸了，炸得司徒超仁满身都是粪便，在厕所里清了一个多钟头。


    我梦醒之后，笑得眼泪都流了出来，我想：那个超仁为了修炼粪便蛆虫诅咒法，而整天冥想被大便困团围住，飞机上的粪便之所以会爆裂出来，全因他被诅咒大法反噬，这是他无法驾驭好这个诅咒法最好的证明。


    李想拿着这份诅咒成功的实验报告，心中得意洋洋。


    突然间，李想到大门口有一团黑雾快速飘忽的进来，黑雾当下组成人形。


    人形黑影用沙哑的声音，粗声粗气地说：「啧啧，你老爸到今天还是卖狗皮药膏的江湖佬？不过这江湖佬有高明表演戏法蛊惑人心，他是高级的魔术师。台下的傻瓜们依然信得傻乎乎，疯疯癫癫趋之若鹜。一个敕派的开创始人对外公布自己有神通，实际上所有的神通都是依靠着自己的太岁与孩子。


    最吊诡的是有神通的太岁与孩子，居然听命于没有神通的骗子，有时候我真的觉得玄门正宗过度崇拜老爸李卜，简直不分上下，我想用人头猪脑形容比较贴切，这局面比抛头颅、洒狗血胡闹的八点档更好看多了哦，哈哈哈！」


    李想指者人形黑影怒骂：「这是我的家务事，而我的家事不需要你这只鬼东西插手！我父亲现在已经是太上皇，最主要是负责在幕后享清福，现在幕前的所有场面都由我一手掌握。所以，我才是一家之主！我才是真正掌握主控权的一家之主！」


    人形黑影不屑地嘲笑：


    「李想菩萨，你是不是又没吃药？谁是真正掌握主控权的，大家心知肚明吧。你？哈哈，只不过是李卜的赚钱工具，是他的扯线木偶其中一个配角而已。你这个傀儡，每次提呈意见时，都乱七八糟毫无建设性可言，你老爸几时采纳过你的意见呢？即使「乌鸦行动」，哪个是出自你的策划呢？你这个傀儡在『玄门正宗』有什么建树啊？所有的场面？你这个傀儡顶多撑门面而已，啊哈哈哈！」


    黑影手舞足蹈，讥讥笑了几声之后继续说：


    「你看、你看，你的这篇实验见证报告，简直可以用乱七八糟、胡言乱语来形容，你不彷拿着这份报告给外人看，大家都会说写这份报告的人有精神病，是很严重的精神分裂症病人写的胡言乱语。


    第一个和第二个的实验，一看就知道你很强勉强解释自己的诅咒力量，既然诅咒了，又为何要救赎？放屁！接着你为了想凑足了这个圆满数字，你又将《芭蕉日报》的新闻，附会上的自己的梦境，而有没有这些梦，你自己心知肚明啊！我看你还是按时吃药比较安全点，你老爸和老妈子临去美国前，不是千叮万嘱要你按时吃药吗？你认为你老爸会相信你这份报告吗？」


    李想想听气，但又一时反驳不了。他举起拳头，一记右勾拳往黑影轰过去，怎知他一个扑空失去了重心，重重地趴跌在地板上。当他抬起头环顾四周，黑影已经消失不见了。


    「你这个鸡巴阿飘，下次如果你再出现，我一定用愤怒之火将你烧到灰飞烟灭！」


    李想揉着手肘和膝盖的挫伤，咬牙切齿的讬谰。


    ![](img/237675b87ee3b5bddaa78c410bf9f326_22_0.png)


    门铃响了，李想不情愿地爬了起来，满腹怒气。


    他想如果是超仁出现，他一定将气出在他的身上。


    如李想所愿，他打开门果然看到超仁站在门外。


    「嗨！」超仁还想堆起笑脸，他本想高喊一句「李想菩萨」，可是连半句话都还没出口，李想即欺身上前，出手神速，一巴掌就掴上超仁的右脸。


    超仁对突如其来的掌掴感到莫名其妙，抚摸着火辣辣的右脸正想还击。


    怎知还来不及咒骂，李想又一拳打在超仁的肚子上。


    接着李想往超仁的身上胡乱挥拳，来不及抵挡的超仁被打得脸青鼻肿，痛得眼泪直流哇哇大叫。


    李想猛然抓住超仁的头发硬揪死扯。


    超仁一开始是很愤怒，准备跟李想拼命，接着想到：万一李想请了战斗胜佛下来，他又如何打得过李想呢？


    于是他又悲叹自己时运不济，忍气吞声，想到跪地求饶是最好的方法。


    「痛，痛，痛！放手，放手，我不敢了，菩萨，菩萨请您饶了我把！」


    超仁本能地跪在地上向李想求饶，李想不理睬超仁的挣扎，硬将超仁拖上楼，推进了房间。


    超仁稳不住身子，跌在地板上，喘着气无辜地看着李想。


    李想将手伸入裤裆，摸了一摸阴茎的龟头，他将手抽出，捣在超仁的鼻子上。


    「死胖子，好闻吗？我警告过你，我没有神经病，我没有神经病，我是有神通的菩萨！」


    超仁嗅到一股腥臭味，连声咳嗽着说：「李想菩萨，这是王母娘娘前的蟠桃香味，喷喷香，香喷喷啊！」


    「死怪物，要不是我给师父面子，要不是我要报答师父的知遇之恩，我肯定会杀死你—我绝对会在水沟放大便给你！妈的！」超仁心中诅咒着，脸上堆满着笑容，但却很奇怪地控制不住泪水涔涔流着。


    「唉，我又有什么本事跟这混蛋斗？我的诅咒法怎么比得上他的诅咒法？现在人为刀俎，我为鱼肉。我唯有先将一把刀插在心上，忍一时风平浪静啊。唉……」


    想到这里，唾面自干的超仁连发脾气的念头都不敢。


    「告诉我，为什么你会这么迟？！」李想质问师罪。


    「我被天桥底下的老人阻扰了，他硬拉着要跟我去谈天……」


    超仁知道自己百口莫辩，不过还是很努力厘清。


    「你这个笨蛋蠢材，老人那么孱弱，你给他一拳，不就收拾了他？」


    李想指着超仁的头，举起右拳转动着。


    「好的，好的！下次我会！」赔笑达人超仁脸色死灰的点头示好。


    李想以训练狗的口吻指令超仁：「坐！坐下来，盘腿坐下来！」


    「发生了什么事？」超仁一头雾水，不知道李想接下来想玩什么把戏？


    「闭起眼睛，快！照我的话做！」李想面无表情说。


    超仁惘然地闭起双眼，他虽不情愿，但还是跟着做。


    超仁心想：「对这头疯子，还是敷衍他比较好，没必要跟他缠斗，说到底他是师父的独子。」


    「啪！」超仁又被李想掴了结结实实的一巴掌。


    「专心点，来，深呼吸，听话，继续深呼吸……」


    李想不断重复一边叨念着，一边用手抚摸着超仁的头颅，李想慢慢在超仁的前面蹲了下来，他双手环抱着超仁的头颅，慢慢将距离拉往自己的方向。


    「不！你想干什么？」超仁惊惶睁开双眼，挣扎推开了李想的环抱。


    「你以为我想干什么？」李想将脸贴近着超仁的脸颊，彼此近距离看着对方的双眼。


    「我……我……不要！」超仁不知道自己担心些什么，但就是恐惧感不断涌出，他控制不住，眼泪爬满了整张不知所措的脸。


    「我，要！我，要，你，现，在，给，我，闭，上，眼。」


    「不!」


    「啪啪！」李想又左右掴了超仁两记耳光，还抬起脚狠狠地往超仁胸部踹了几踹。


    「听好，照着我的话去做，给我闭上眼！否则，你有苦好受！」


    超仁眼泪夺眶而出，他心中惊慌极了。


    他向天祷告着，拜托千万不要，千万不要！老天，求你保佑我！就算您要我减自己10年阳寿，我也一百个愿意，求求您！


    即使超仁不知道自己在担心什么，甚至乎不知道自己千万不要什么，不过超仁全身的神经系统却告诉他自己，千万不要……


