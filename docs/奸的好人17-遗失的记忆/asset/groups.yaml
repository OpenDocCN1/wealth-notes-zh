    苦苦盼望孔明随时双腿一蹬的他，对着这个当头一棒感到措手不及，心里只嗑嗑吁哀哉。


    「干！这是什么世界？妈的，两棍致命伤、脑出血，这样还不死，怎么他还不死？老天爷是不是存心跟我作对啊！」


    司徒超仁滚瓜滑圆的身躯跪在马桶前，失望地耷拉着头，面对马桶坑吁天抢地。泣涕涟涟地看着马桶坑里自己的倒影，随着一颗颗晶莹剔透的眼泪泛起层层涟漪。


    「岂有此理！真是让人嫉妒，像郭美丽这种三围那男人看到都会吹火，性无能看到都会再度重振雄风的超级绝色大正妹，现在竟然又可以和那个嚣张的孔明在一起！妈的！我不爽！我真的很不爽，为什么？为什么……？」


    这时的超仁愈喊愈激动，情绪也再度失控。


    他全身瑟瑟发抖，瞳孔里散发出青色光波，说话开始有点大舌头。超仁感觉刺骨寒风不断地吹着自己，使得豆腐状的心脏好像颠簸起来，震得碎掉后纷纷扬扬地落了一地，被表情狰狞的孔明断断续续的践踏与碾碎。


    「啊——！！！」


    超仁发出摧心剖肝的怒叫。


    「如果我是神！我第一个一定让孔明不得好死！他最好出车祸或是被人在路上乱刀砍死！等他死了之后，干！但……他还是死不了……」


    超仁感觉全身像个高压锅，充满电磁波；气血夹带着发飙的细胞直爆脑袋。对孔明恨入骨髓的超仁目露充满杀气的辐射，全身颤抖的咆哮着！


    司徒超仁愤怒地一拳打在浴室的门板上发泄心中不平之气，只听到「碰」的一声，门板随着怒气凹陷进去，瘀青的拳头却没有一丁点儿疼痛，但不甘心的情怀紧紧咯噬着他的心。


    他把门打开，想走出浴室，但走没几步他又回到洗手台用冷水洗脸，抬起头怔怔地盯看镜子里的自己。


    突然，「他」的话又在超仁的耳边响起：


    「出院了天之后，当你的情绪波动到很想杀人时，看看你心口结疤的伤口，会变成什么？」


    他双手扶着洗手台，看着镜子不断喘气，镜子也随着喘气蒙起了一片朦胧的雾气，他看到自己胸部起伏着，微微隆起并发出微弱的红光。


    超仁闭起双眼把上衣脱了，心情不免有些紧张，正颜厉色对自己说：


    「妈的，男子汉大丈夫，怕什么？我呸！什么看到自己心口的怪物，若不懂驾驭，哼！你命不久矣……都是狗屁！管你什么牛鬼蛇神，总之通通放马过来，我肯定跟你们拼个你死我活！」


    他深深吸了一口气，还是双眼紧闭着……终于，提起颤抖的右手，小心翼翼摸了心口他发觉，自己竟然摸到一块突起的肉——「妈的，不要吓我，这是什么？」


    超仁还是不敢张开双眼，继续茫无头绪的摸。


    他只知道凸起的是一块肉瘤类的形状——


    「这不是癌症吧？死了，死了，我该怎么办呢？」


    他再深吸一口气，缓缓地把双眼张开一线：「哗！这是什么？天啊，这是什么？」


    超仁蹲下，低着头潜然落泪。他全身颤抖，背脊大汗淋漓，心脏麻酥酥的，上下排牙齿跳着没有节奏的踢踏舞。


    「呜呜呜呜……报应啊！报应！呜呜呜呜……是李卜、李想害我，害我有此报应……呜呜呜呜……」


    ## 第三话


    此时，超仁的头顶突然冒出一颗闪亮的灯泡和三个感叹号：[叮叮!!!]


    灵光乍现，超仁像突然想起什么似的，豁然开悟，豁然站起身——「找他！找他就对了！妈的，手机去了哪？」


    超仁赶紧套回衣衫，冲出浴室，迅速跑进自己的房间。他拉开抽屉，拿出装名片的巧克力铁盒，将里头杂乱无章的名片倒出来一张一张乱找——「他，他的名片去了哪？」


    但他愈是紧张，就愈是找不到。


    陡然，他灵光一闪——「哎呀，我记起来了，我放在钱包里！干！」


    他马上冲到桌子前面，从屁股破洞的钱包里掏出一张黄色的名片，然后拿起手机拨通……


    听筒传来中国歌手萨顶顶的「万物生」，清越悠扬的声音令超仁陷入微秒的沉思。


    「嘿嘿嘿，司徒超仁，终于等到你了！」超仁听到有人接听，才回过神来。


    「我……想与你见面！」超仁掉牌，直截了当。


    「好，没问题。」他爽快的答应。


    「我现在骑机车到『慈灵宫』找你。」显然的，他与李家颇有渊源。


    「不！那里都是李卜的人。我们就在西门町的『丽花宫』见面吧！」他有所顾虑。


    「西门町的『丽花宫』？！好，没问题，我马上到！我求你求你，求求你救救我，我知道错了，我不想死，请你救我，只有你才能救我！我以后再也不帮神棍李卜的忙，我情愿不要诅咒的神通，我不要！我不要！」


    超仁热泪潸潸，哽咽地求情，也不管西门町的「丽花宫」是个什么地方。


    「放心，你不会有的。」对方不疾不徐的说，好像有十足的把握。


    「他妈的死神棍李卜！他妈的死神棍李卜！」超仁矢口是李卜干的好事。


    「你在电话里对李卜狂妄，于事无补。」他保持一贯的悠游自在。


    「好，我马上过来！」吓得灵魂已经差一点被勾魂使者绑票的超仁下定决心。


    拨了一通生死攸关的电话，怒火中烧的超仁用幻想中修理孔明的力道，捶打自己的心口。「怪物，你去死吧，魔兽，你去死吧！」


    他看着心口溢出浓稠的鲜血，惊瑟万分：「哗，流血了、流血了，怎么办？我该怎么办？」


    此时，超仁开始乱了阵脚。


    从玄门正宗修得诅咒大法后，他天真的以为，从此身份地位将扶摇直上，平步青云。


    但神乎其神的命运竟然如此捉弄他，跟多日以来费尽心机的「梦想可视化」适得其反。


    现在的他为了保命，如果能够从头开始，他宁可放弃含辛茹苦建造出来的一切，情愿什么都不要。


    现在的司徒超仁，情愿自己每天被人欺负，被人以毒辣的言语鞭挞、以无情的白眼扫射，他也不想再看到心口出现的魔兽。


    为了力挽狂澜，他来不及再细想，便三步并作两步快步冲出大门，骑了机车往西门町这个代表希望的方向驶去。


    司徒超仁现在只记得「他」说过的警告，但却忘了痴呆老人的告诫。


    其实痴呆老人也在痴痴地等着司徒超仁的回心转意，但超仁一念之间，还是在


    这条人生，是由一连串无止尽的选择所组成，每个选择都可以决定一个人往后的命运。


    ## 第四话


    ### 「第一章」


    司徒超仁骑着他的极速小绵羊，飙风打在他的脸上，旋即把刚从泪腺探出头来的眼泪吹走。


    「妈的，我快变成一个又丑、又肥胖、又默默无闻的怪物，我不是怪物，我不是怪物！真不公平，乌鸦组织刚干了大事，而我却变成了怪物，孔明被我诅咒了还 不死，真不公平！


    孔明并没有死……因此这一切都是巧合……我并不是李卜说的有修炼诅咒的 天才……


    我也没有魔力……就算全天下的男人都死光了……郭美丽根本不会看上 我……我这个怪物，我现在快变成了怪物……我永远是个体黑暗底下的失败 者……永远都是……一切都不会改变……」


    这些极度微弱声音，像是一种无线电波一样，不断的在超仁的脑中呢喃着。


    超仁心中混乱到极点，他读高中时，与孔明之间的往事又浮现在他的回忆中。


    ### 「司徒超仁的记忆」


    孔明拖着疲惫的身心回到家里，进入自己和弟弟合用的房间，见到超仁躺在单 人上下铺的下铺读书。他并不搭理，随手将背包扔在书桌旁，就直接爬上上铺仰卧， 闭起双眼。


    「哥，1 月 30 日，自封权谋大师的李民杰，会在世贸一馆南沙龙区与搭诒教 主郑匡宇联合演讲，主要是推荐他们的新书《出位——硬要世界看重我》，你会去 听吗？」


    超仁早已经摩拳擦掌, 要与作者有更进一步的接触。为了这场演讲, 他已经很有心机的准备了 20 道问题, 准备在问答环节出位。


    「看情况而定！」面有骄矜之色的司徒孔明闭着双眼，漫不经心的回答。


    「哥，你可有想过毕业之后的出路？」超仁温文尔雅的问。


    「唔！可能是到《芭蕉日报》当狗仔队吧！」司徒孔明半开玩笑话说，他根本懒得回答超仁的提问。


    「哥，我看了《出位》之后，心里有很大的感慨……」


    书海中的拼命三郎想要分享他积雪囊萤后的心得。可是，话声未落，「呼噜……呼噜……」声大作，孔明以感性的鼻鼾声回应了超仁的感言。


    「嘿！每次你都不听我讲话！每个人活在世上都希望被人看重，哥，你从来就不把我的话听进去。」


    超仁嘀嘀咕咕的抱怨着，总不明白，怎么众光灯都不在自己的范围内，明明自己这种身型很容易找啊。


    「不公平？人生真的不公平！为什么我什么都得不到！却总是看到身边有一大堆的人要什么有什么！呔！孔明这个家伙，长那副什么鸟样子，只不过比较会念书、比较会搞人际关系而已。除此之外，他也不是什么了不起的人，他凭什么从高中开始就有恋爱可以谈，而且那些女人都有一定的水平，这些女人是被下药了吗？还是瞎了吗？怎么全部都和孔明有一腿！」


    超仁总是顾影自怜，无论他付出多少汗水，都从来没有接受过别人竖起一根拇指头。


    这时超仁突然想起，孔明就是自从高中考上第一学府「建国中学」之后，突然变得不可一世的。


    更让人生气的是，后来孔明考上了台湾大学，他的人气更是旺到不行，不但当上了热舞社的社长，更同时跨足到「山水康辅社」。而康辅社最擅长的就是「挂羊头卖狗肉」，美其名是大家学习如何与人相处，实际上是忙着办好几场联谊，认识一大堆秀色可餐的美女。


    新鲜人这个阶段的女人是最好口的，不但懂化妆、懂打扮，肌肤白皙吹弹可破。最重要的是，这些美眉的年龄才十八岁上下，这就是时下年轻人说的「青春的肉体」（台语发音）。她们都刚刚告别少年迎接成年，可以做成爱人爱做的事，想到就口水直流。


    孔明也是好人卡的纪录保持人。不过，跟超仁相反，孔明是派发好人卡的圣诞老公公，发给那些倒追他的美眉们。更扯的是，孔明曾经三番四次把房间腾空，好让他有足够的空间，给美眉「当家教」。俗语说得好：好奇心杀死猫和他的主人。有一次，超仁为了一探究竟，整个人塞到床底，才知道所谓的家教是怎么一回事。


    那时候的超仁并不知道，他的人生将会出现让他毕生都震惊与害怕的转变。


    「奇怪！这个世界好像都在和我作对一样，总是觉得自己活在这个世界似乎不重要，连说个话都没人听……」


    超仁一边用手指夹着手上的书，嘴里一边叽里呱啦碎碎念个不停。


    司徒文武是武侠小说与历史演义小说迷，他最喜欢的作品是《三国演义》，因此他为二子一女取名为：司徒孔明、司徒超仁与司徒貂蝉。司徒超仁是这个家中排行老二的，这个人虽然和他的哥哥在同一个家庭长大的，可是两者的个性却是南辕北辙，在生活中也积不相能。


    「超人超人超仁的！乱七八糟！简直就是硬把这个名字套在我的身上，羞辱我一辈子嘛！干！」


    超仁很介意他的名字不像他的哥哥或妹妹一样，是从《三国演义》得到灵感。


    「哥哥真是家里的骄傲啊！我想，光宗耀祖的事情，未来就靠他啦！」柠檬酸酸的味道十分呛鼻。


    「反观我呢？唉……孔明二十岁时已经是资优生，参加演讲与辩论比赛都得冠军，他是父母的希望、学校的精英、国家的栋梁。我呢？跟白璧无瑕的孔明比较，到目前为止还是一事无成、才能凡庸，想起来真是惭愧……」


    超仁感慨的说著，反正他己经习惯自言自语，这些话都只说是给自己听。


    「有人说，从二十岁到二十五岁是『极端自我就是王』的年龄，不应该有烦恼，脸上永远都会挂着微笑，没有中年的危机，出来社会工作的屈辱更远在天边。但我已经二十三岁了，我的烦恼特别多，都是因为我有你这个司徒孔明哥哥。唉，既生瑜、何生亮！啧啧……」


    他无限困扰的摆动着胖胖的头、胖胖的脖子、胖胖的肩膀、胖胖的手臂、胖胖的手腕、胖胖的手掌、胖胖的手指……还要接下去吗？


    「呸！我司徒超仁岂是用下半身思考的人！」——原来，他腰部以下是不思考的！


    不要看司徒超仁好像是个胸无大志的人，其实他常常幻想着自己有一天能够成

    大功、立大业，让所有的人跌破隐形眼镜。


    当然，他会这么想，就是因为他的养父母总喜欢拿他和司徒孔明比较。尤其当他拿着满江红的成绩单回到家里，养父母对他尖刻的批评，往往万箭穿心，令他这种感觉更加强烈。


    这导致他的内心一方面总是想要向人证明自己其实是很棒的人，而另一方面，却因为事情总以失望收场，所以他的胆子穿洞，变得愈来愈愈小，愈来愈不敢面对现实，且常常躲着人群。


    然而，就在这种「理想与现实」的巨大差异下，他养成了一个习惯。这个习惯就是「不断看书」。所以你若是看到司徒超仁的身影，总是可以看到他独自一个人，无论坐在椅子上或躺在床上，手中总拿着一本书孜孜不倦的阅读，并发出朗朗的读书声。但是若是仔细观察，你将会发现，这些书只有封面和作者不一样而已……


    「哈哈哈！妈的！我觉得我的精神又回复到巅峰状态了，从今天开始我要开始努力了！」


    每回看完书，你就会看到司徒超仁脸上露出了充满希望的神情，兴致勃勃的订下新的计划！一说到这里，白痴应该都猜得出这是什么类别的书了。


    这个司徒超仁平常的嗜好，就是看「励志书」。对他来说，每次看励志书的一瞬间，马上就能够让他忘却自己正活在一个现实且残酷的世界里。这种书最大的特色，就是会有一大堆故事，而这些故事的主轴都围绕在「如何改变人生」这个主题上。


    这些书也让他常常在过着如同坐云霄飞车的循环。「激励号」云霄飞车从暗无边际的低谷出发，一飞冲天直上云霄，待正面能量被现实生活中的重压困难和挫折损耗得所剩无几，他便又回到了低谷，等待重新出发。


    就在司徒孔明还未回到家时，超仁看了一本名叫《没有借口(No Excuse)》的书。


    他被书里面的一个名叫（把信送给加西亚）的故事给感动了。这个故事讲述的是：美国总统威廉麦金莱把一封在美西战争中决定美国命运的信交给安德鲁·罗文中尉，让他把信送给古柏将军加西亚。


    罗文中尉接到任务后，没有任何推诿，立即行动，以其绝对的忠诚、责任感和创造奇迹的主动性，经过三个星期的艰难跋涉，克服重重危机，最终把那信交给了加西亚将军，并为总统带回了加西亚将军的回信，使美国在美西战争中取得胜利，安德鲁·罗文中尉也就成就了成为国家英雄的梦想。


    ### 「第二章」


    ### 「张紫怡的记忆」


    我坐在加护病房的走廊长凳上，双手捂着脸，总算是松了一口气。


    刚才听说儿子已经度过危险期，我突然感觉自己几乎虚脱，全身一点力气也没有，连呼吸也力不从心。


    现在，我只想躺下好好睡一觉，一切都会在睡梦中变得很美好。


    这时，卜哥和张虎喘着气赶到，直奔加护病房的走廊。卜哥立刻奔向看着加护病房外的玻璃窗，脸贴着玻璃窗看着李想，感觉似熟悉又陌生。


    「怎么搞的？我不是换掉了他的Ferrari跑车吗？我知道他喜欢开快车，所以才换辆GEZ-2给他，怎么会这样？」


    卜哥一拳打在墙壁上宣泄内心的怒火，无法理解他的神机妙算，竟败给了李想的别扭和固执。


    「紫怡，我想进去看看李想。」李卜心里火急火燎，爱子之心显露无疑。


