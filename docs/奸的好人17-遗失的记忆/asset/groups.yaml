    ## 第八章


    老人全神贯注坐着静坐，秦寿摆了一个「圆」脸，缩在一旁屏息以待，连呼一口气也得尽量拖得细、慢、长，仿佛只要呼吸间稍微一沉重，就会惊醒老人。


    不知道过了多少炷香的时间，老人缓缓张开炯炯有神的双眼，对一直偷打哈欠的秦寿说：「星日马李忠与司徒超仁在『丽花宫』……」


    于是秦寿话不多说，以跑代走领着老人上了他的丰田轿车，往『丽花宫』的方向出发。


    「师父……金神七煞，逃了三煞……还有一煞牛筋牛祭遭到底在哪……」秦寿脑中的电线总是连接不到问题的牛鼻子。


    「唉……其中的曲折情由我还搞不懂，我只是透过神定功夫，看到这些情况，而超仁在半昏迷中，神识进入了鬼金羊王霸牵引出几个人交织在一起的记忆网络中……我需要唤起司徒超仁的良心！」老人正经八百的说。


    「为什么金神七煞会选择司徒超仁做傀儡？」蔫呼呼的秦寿依然满脸疑团。


    「我看是冲着『玄门正宗』的势力，和张紫怡的两次的恶胎而来……」老人吃准金神七煞的动机是如此。


    秦寿全身寒毛都吓得稍息立正站好：「两次的恶胎？」


    「我进入过他们交织在一起的记忆网络，我发现张紫怡天生就有手通的异能，她的第一胎是被自己的丈夫与数名流氓轮奸的孽种。第二胎也不是李卜的，而是当年被她同居男人霸王硬上弓强暴的。超仁的神识在他出生前，不知何故已经跟李想的神识交织纠缠，从此展开两人的相互掣肘之战……」


    老人望着车外的倒退景物，为了剧情的白热化叹了一闷气。


    「其实司徒超仁很小的时候，只要遇到什么不开心的事情，都会从孤儿院跑到这里躲在水沟中逃避……他国中时在学校被欺负，也会骑脚踏车来过这里，躲在水沟中……」


    老人突然跳开原本的话题，回忆起当年司徒超仁浑身湿漉漉躲在水沟哭泣，而老人看着魂不守舍的他红着双眼从水沟爬出来后，苦口婆心地安慰着他，并静静听他诉苦的往事。秦寿对于老人岔开了话题，默不作声。


    「最近，司徒超仁频频躲在水沟，经过数次，我发现有一个共同点，就是在『收日』、『除日』、『破日』，还有每月的阴历初六、十六、二十六日，这些日子都有除去祸害与解除小人的意义……」老人侦探式的头脑推本溯源，并进行了详尽的归纳法。


    秦寿双手握住方向盘，冒汗的手心也把方向盘弄得湿淋淋。


    他心中不免有些着急，他想：「师父，拜托你快说到重点吧！」


    「直到有一天，我在睡梦，司徒超仁又躲进水沟，我无意中进入了超仁的记忆，发现他刚出生不久，胸部便长了一块肉瘤，那块肉瘤不但长了大小眼，还有嘴巴和牙齿，裂开的嘴巴不断流鲜红色的黏黏液体。


    我在梦中惊醒之后，看到水沟微微发光，于是在好奇心的驱使下我走过去看，正好看到他大水沟爬了出来。在那时我还不敢确定，直到他离开我，我用触摸过他身体留下的磁场，顺着他这个脉络迅速进入禅定一探究竟，我才察觉到，他背后被一批神秘人操纵。


    如果没错的话，这一些魑魅魉魉都进过精神病院，而且具有神通力量。他们在操控司徒超仁的海马回，并让李想、超仁、张紫怡的记忆交织浮现出来，企图借此唤醒潜伏李想与超仁内心惊天、拽鬼神的阴影与仇恨。


    而这股影响的力量是来自於金神七煞，因此才找你调查松精神病院的记录，我也想知道金神七煞来了多少人……而金神七煞向来都被传说是日本影子集团安排在台湾的眼线，企图阻碍中共的中华联邦结盟。至于为什么超仁会被卷入这场漩涡，我估计是超仁的心口余毒的关系。再深入的细节，我还不知道……」


    老人不着边际地述说着整个大环境概梗，秦寿不敢插腔，耐着性子听着老人的车轱话，等待着老人的答案。


    老人一边在脑海中进行沙盘推演，一边从容不迫的把一切娓娓道来：


    「每个人的内心除了有光明一面，也隐藏着阴暗一面，两股力量都因为我们碰到不同的情景就会有不同的变化。


    例如当年，你看到司徒超仁被黎敬平性侵犯时，你对他产生同情之心，用我教你的方法将他这段创伤隐藏在海马回最深的地方！这就是光明一面；同样的，司徒超仁从小被欺凌，他是弱者，表面上他逆来顺受，实质在他独处时，心中怨恨浮现，诅咒欺凌他的人，内心想要对他们多倍奉还，才能吐出压抑在内心的怒气。


    诅咒是变相的弱者表现，就因为对敌人无可奈何，才需要在背后鬼鬼祟祟诅咒，否则约对方面对面单挑即可了。从他们的记忆图片，我发现都跟诅咒力量有关系，但我尚窥不破一个道理：为什么季想或超仁的诅咒力量变得强大起来呢？是无缘无故强大起来，还是有别的原因，至今我依然一无所知……」


    秦寿把车转了一个弯，即将丰田轿车停了下来。


    老人心头微微一震，身经百战的他意识到大事不妙，他的第六感告诉他必须随时准备施展两手神通，于是他蹲在地上右手抓了一把泥巴，一手拿了一块瓦片，快步走进了「丽花宫」。


    秦寿与老人看到605号房门未上锁，顿时不祥之感浮现，老人推开房门，看到马日星李忠咽喉上插着一把弹簧刀，死不瞑目倒在地上，鲜血已经凝固多时。


    老人将泥巴往墙壁一撇，随手用瓦片往墙壁一割，喃喃念了一段咒语，墙壁马上裂开。老人拉住秦寿的手，走进裂开的墙壁里……


    他们看到一片静谧的树林，天空彤云密布，此时的树林已经是黑黝黝的，什么都看不太清楚。前面闪过两个背影，有一个妇女与司徒超仁跑入了树林的深处，秦寿惊慌地喊了一声：「师父，司徒超仁……」


    语声甫落，轰隆轰隆响了一声，秦寿与老人又站在「丽花宫」的605号房内，秦寿大为惊讶：「师父……为什么……」


    「刚才我施展的是缩地法追踪司徒超仁，过程是不能出声的。我们要快点离开这里，再做打算。」老人解释道，并比出「保持肃静」的手势。


    秦寿心慌慌的问：「师父，你能不能再继续……」


    「不能再发动了，我已经将司徒超仁与女人仅留在房间的微弱磁场讯息给用完了。我们得快点离开这里。」老人斩钉截铁的回答。


    ## 第九章


    李想盘腿坐在床上，张开嘴巴，一大雷气体状的灵魂从口中飞出……


    李想对着空气咧嘴狞笑。


    「黑暗的守护神，你看到了吧，并没有人教导过我灵魂出窍，这是我自己领悟与发明的方法，不需要人教我。总之，你不要用经典与文献，或者用古人记载的说法来压我。我有我自己的方法。我的灵魂是自主的，心念一动，灵魂就去到那里。如果你要我相信经典文献，那么我自身的经验又如此的真实，就好像我喝的水是温是冷，就是我自己能感受得到，与他人何干？理论与经典能证明我喝着的水是温还是冷吗？」


    「黑暗的护法神，记得我老爸带我去见博学和尚时，我装傻向博学和尚虚心请教修炼白骨观的大秘密。但我没有告诉博学和尚，每当我注意着脚趾头，会慢慢看到脚趾的白骨，接着，我的灵魂便可以从脚趾头爬出来。这个是我独门的修炼方法，没有经典记载。我的灵魂出窍就像法轮功一样，是上古时代失传的秘密方法。我可不是神经失常的精神分裂症，我是活得很正常的人，我没有神经病！」


    房间内看不到任何人，只见李想欣喜若狂的继续盘腿静坐，好不诡异。


    「如果我要引经据典，我可以告诉你，病从口入祸从口出，你注意到吗？有两个口字，病从口入是被邪灵从我们的口入侵，灾祸是你的三魂七魄，在你的口不小心走漏了一点，引发了不好的事情，这是古代的秘密，只有释迦牟尼、耶稣基督、孔子、老子知道，这是断层失传的口诀，不然什么叫秘密？」李想继续对着空气指手划脚的自言自语。


    「你再看『唐虞有，尧舜无；商周有，汤武无。』这个猜字的谜语，谜底是口字，这不是证明了口可以灵魂出窍吗？当然我不会公开说出我的见地，否则妒忌我的人又会说我发神经，乱解释，又用逻辑学来压我！」


    李想继续说话，完全没有察觉到房门咔嚓一声已被打开。


    张虎从房门外悄悄探头来，看到李想自言自语，摇头叹息道：


    「这怪物神经得蛮可怜的，明天就是他正式接管『玄门正宗』的第一天了，侏薄的心性不知道什么时候才会改？小心玩火自焚啊教主！呜呼哀哉……」张虎轻轻把门关上，不声不响的离去。


    李想在幻觉中，看到自己的灵魂不断飞、不断飘……


    这时，身处半空中的他听到下面有很微弱的呼吸声，此起彼伏。定神往下一看，尽是一片无尽头的葱翠丛林。


    踌厉风发的李想象电影里红内裤外穿的超人一样，伸展双拳，大喝一声「去！」


    ——便直飞进了丛林。


    他留意听，里面传来的呼吸声像海浪拍打堤防一样，他估计是有人在这里修炼气功。


    「请问是那位前辈高人？」神色急遽的他慢慢落地，抱拳恭敬地问。


    「……」没有回应。


    前面的丛林分开了一条路，就像摩西过红海一样。


    他往前面直走，看到一个妇女。她对李想微笑着，站在女人身后的好像是李想所熟悉的司徒超仁。


    「死胖子，你为什么在这里？」李想惊讶地想冲过去拉超仁。而妇女从地上抓了一把泥土，往天空一撒，泥土散开来化成镜花水月。李想又不知何故，站在一座高山的山脚下。


    这时，他看到漫山遍野的人往山顶爬，气氛静穆。他们个个瘦骨嶙峋，一脸恍然不断攀爬着，爬得很辛苦也毫无怨言。有些人还失足滚下了山，头破血流还是继续的爬，有着铜墙铁壁的决心。天色愈来愈黑，乌云密布。陡然，一道光明劈开乌云，李想便轻轻地飘了上去。


    他在山顶俯视攀爬着的众生，觉得这些人好可怜，眼中不自觉簌簌泪下。


    眼泪化成豆大的甘露，全都把这些人淋得湿漉漉，都变成了落汤鸡。接着他看到自己的泪水化成洪水，洪水倾泻下来汇成了如万马奔腾的急流，把这些人冲得不见踪影，惨叫声不断扩张，气势焰赫。


    「哈哈哈哈哈…...」


    他仰天狂笑，称心地看着这群人被洪水冲走的滑稽模样——做神的第一步；就好像黑社会一样，先给这些信徒下马威，令他们怕你，你就是神，神就应当诅咒不服从命令的信徒！


    洪水过后，他来到一片草地上，看到李卜向他举起屠弱的中指。


    他向前去，用尽吃奶之力，以手肘把李卜撞倒在地上，看到李卜断了几根胸骨，倒在地上痛苦呻吟着。


    李想佞笑的俯视着他，接着不断用脚踩李卜的头。


    他一直不停地踩，不停地踩……愈踩愈兴奋，还把李卜当作皮球踢。


    他不断踢，继续疯狂地踢……


    李想狂喊着：「老爸，我现在是帮助你这个骗子消业障，孽根未除，难上西方极乐。嗐咕噜李想悉地哗！」


    李卜趴着抱住李想的双膝，他的眼泪沾湿了李想的膝盖，声泪俱下求饶：


    「李想菩萨，李想活佛，李想金刚上师我知道错了，我知道错了，我知道错了……」


    李想心念一动，手中多了一把日本刀，刀锋被一道如南极光的绚烂光彩划过，李想从李卜的背后一刀插了下去。


    李想认为自己解脱了他，只见垂死的李卜语无伦次：「冤孽啊！冤孽啊……」


    「哈哈哈哈哈……哈哈哈哈哈哈……哈哈哈哈哈！


    李想又对着廓落的夜空仰天狂笑着。


    接着，Angelina 的灵魂飘然而至。


    她满身鲜血，一见到彻骨痛恨的李想便伸展手臂，指甲陡然增长，向他飞扑过来。


    李想死命地隔开她的双爪，怒喝道：「贱骨头！你今天还不醒悟吗？你前世满身罪业，今生才为奴为婢，还敢和与菩萨转世的我私奔；你差点坏了我的道行，要不是我及时出手干预，我慧根深厚，岂不是给你这满身罪业的妖怪害了？」


    Angelina 默默走到李想的面前。


    他趴开她的衣服，用万能的手捏一捏她的大奶，之后他伸出舌头在大奶上以回旋的方式不断舔舐。


    这个时候，他那如锯条的利齿把雪白乳肉山峰上的葡萄干给咬掉，并吞了下去。Angelina 的奶头与垂涎欲滴的 G 奶分离，浓稠鲜血溅了李想半身。


    「啪啦！」他又狠狠掴了她一巴掌，说道：「我已经在医院躺了六个多月。肚量大的我为你受苦受难，替代了你了地狱的业障！」


    说实在，李想揣得无穷的过瘾。他看着 Angelina 慢慢变成一头粉红猪，脸颊膨胀得像头猪，他好想捧腹狂笑，不过他还是咬着舌头忍住不笑，直到舌头都被咬出血，他才忍俊不禁。


    李想见机不可失，赶紧掏出涨红的金箍棒，钻进去粉红猪的菊花里不断地乱窜。


    到了欲仙欲死的瞬间，李想粗着脖子高喊：「Angelina Jolie！Hahahaha！Angelina Pig！Pig！」


    李想从幻象中惊醒，缓缓张开双眼，下意识的摸了摸下体。


    他感觉身体出现了岔气，呼吸间两肋感到疼痛。


    调整呼吸后，他缓缓地伸了个懒腰，走到浴室。


    盥洗后，走到沙发等着女佣送早餐给他，他随手拿起《芭蕉日报》一看，报纸头条封面般红大字标题写着：「日本 8.8 级地震，122 人死，海啸将直击亚洲多国。」


    他继续翻看，有许多触目惊心的照片，都令人不寒而栗。


    李想如有所悟。


    「哦，我明白了，我终于明白了！我看到很多爬山的人，这些人都是惨死的众生。我的泪水化成洪水，把他们冲走，其实诅咒他们等于解救了他们……」


    「哼！呵呵……」他天耳通突然打开了，他听到灵界有「人」在冷笑！


    他以心灵通话试图寻找冷笑的人：「谁？」


    「我」阴阴声从他右边传过来。


    李想往着右边的方向看去，原来是被他用日本刀插死的李卜。


    李卜现在完好无损地翘起二郎腿，双手交叉置于胸前，带着轻蔑的笑意叼了一根雪茄。


    「呵呵，你的解释一点都不合理。你梦到一大群人爬山，怎么现在变成了你预知日本发生地震，你去拯救了他们？」李卜吞云吐雾的问。


    「他们……他们爬山是要避开海啸与地震。」


    李想脑筋转了千回，终于让他找到合理的解释，虽然他觉得解释得很勉强很辛苦，但他却满足于自己的合理化。


    哦！真的吗？你认为你可以说服谁？李卜喷出了如奥林匹克的括环烟圈。


    「我 looking 着名妇女在地上抓了一把泥土，往天空一撒，就是最好的证明，这是预示着地壳将裂开，就好像我看到丛林裂开一样。」李想象是又松了一口气，还自以为很聪明想到这个证据。


    李卜挑衅的问：「李想你不要再痴人说梦话了，为什么你不干脆到日本拯救众生？」


    「我是进入了灵界救度死亡的灵魂。灵界的景象跟现实世界的景象是不一样的。所以，我看到乌云密布……！」李想急速呼吸，开始拗不过他的父亲。


    「其实我不需要再向任何人证明！」


    李想站起来，他看到李卜也跟着站起来。


    李想将手中的报纸往李卜的方向扔去，却看见报纸穿过李卜的身体掉在沙发上。


    「李卜，你听好，我不想再跟你纠缠，今天之后就是我当『玄门正宗』掌门人的黄道吉日，你放心，我做乌鸦行动会做得比你出色！」「铁齿」的李想如此回敬他的父亲。


    李想头也不回便吹着口哨往餐桌走去，开始用餐。


    一会儿，突然李想又看到李卜坐在他身旁窃笑着，李想揉一揉双眼，李卜又蒸发了，李想继续低头吃着。当他抬起头来时，李卜又再次出现了，他再揉一揉双眼，李卜又消失在空气中。


    「李卜，我等下就是『玄门正宗』的掌门人了，你，死，不，足，惜！安息吧！」


