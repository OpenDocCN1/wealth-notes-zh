    但他们永远不知道，当天我读了李敖的自传，读到一个很特别的故事。


    李敖说自己的祖父也是很凶的人。有一次大家一起赌钱，某位兄弟输给发狠，在大腿切出一块肉来做赌本。本来赌钱的不想招惹麻烦，会给他钱了事。否则，庄家输了不是给钱，而是要切大腿的肉赔人，因此看到这么凶的人赌钱，就赌钱算了。但这回是李敖的祖父当头风，他马上切出自己的肉来说：「我不怕你，我没跟你赌之前，我也切出一块肉，有本事你就拿走！」结果吓得这个人夹着尾巴逃之夭夭。


    李敖还在书里说，明朝的魏忠贤也是这么狠的角色，赌钱赌输了，切掉子孙根'
