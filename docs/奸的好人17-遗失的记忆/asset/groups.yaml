    超仁的手机来电铃声，已经从台湾前第一名模胡静怡的《往生咒》，换成现任第一名模林志玲的《带我飞》。这首歌虽然已经有三年历史，不过有偶像谱曲，还有志玲姐姐的宋词填词，加上以销魂的娃娃音献唱，足以弥补超仁对《往生咒》的敬畏与恐惧。


