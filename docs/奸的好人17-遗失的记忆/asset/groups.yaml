    李想声嘶力竭蹲在地上呐喊着，涕泗滂沱，眼泪噗噜噜的滴到地板上。


    超仁鲜少见过李想这种如丧考妣的凄苦模样，但李想的举动更让他丈二金刚摸不着头脑。


    「让我再看清楚一点！」话语毕落，李想又眼疾手快起身环抱着超仁的头颅，额头紧贴着额头。


    两人又开陷昏昏欲睡，纷纷坠入无尽的记忆漩涡……


    # 「司徒超仁遗失的记忆 2」


    我赤着脚，懒洋洋地漫步在细软的滩地上。


    长海岸岸线明显的向外暴露出许多，潮水如魔术般消退在几百尺的暗色黄土滩地外。


    此刻正值退潮时分，露出了比平时更宽广的海滩。


    除了我之外，就只剩下咸咸的海风，浪声不大的海潮，躺在黄滩上等待晒月亮的贝壳，几只互相追逐的小螃蟹，还有同样在沙滩上活动的路人甲乙丙。


    不过对我而言，其他人事物都不重要，仿佛整个沙滩都是我的私有地。


    我独自站在海岸线边缘，伸了伸懒腰，享受着片刻的张静。


    涨潮时候，我现在所处的位置可是浪高十尺；现在，我踩在几分高的海浪上发呆，时而跟海浪嬉戏，踢着迎面而来的海浪，溅起了浪花，也溅起了以前和家人一起到海边野餐的童年回忆。


    我慢慢沿着海岸缘一路走下去，一边走一边俯身捡起形状各异的海螺贝壳。


    有的时候我会停下脚步，把钟情贝壳贴在耳边，倾听来自海洋的声音。


    耳闻好像传来，来自海底微小生物绵绵不绝的呼吸声，缠绕于耳……


    随后，我在海边弯腰捡起一块石头，扔向大海，只见石头在海面上如蜻蜓点水般的弹跳了十几下，才沉入茫茫大海。


    此刻变动不大的海面很适合练习打水漂。我来到湖边或海边，总是喜欢练习打水漂。我选了一些石头，拇指摩撑着石头许下了愿望，掷向汪洋大海，就数着石头在水面上弹跳的次数。'
  - '[PAGE 48]


    我有时也无聊的想，或许可以挑战金氏世界纪录，弹跳超过五十几下，那会有多炫。国小时候爸妈常常取笑我说：「你常常这样打水漂，不知道会让多少鱼儿见不到明天的太阳，多少的鱼儿找不到妈妈喝奶。」


    「也不会那么准啦。最多是受轻伤而已，顶多请假几天就没事了。」哥哥孔明一定帮我插口搭腔笑答。


    这次是我独自出游，而且还是不是跟团旅游。我不知走了什么狗屎运，闲逛旅游展时竟然抽到兰卡威岛的免费来回飞机票，因此我打算游玩兰卡威之后，到吉隆坡玩一趟再回台湾。


    兰卡威岛，位于西马来西亚北部的州属，也就是吉打州。兰卡威岛由几百个大大小小的群岛组成，群岛间流传着一些古老传说，其中，一个最著名的传说是关于玛苏丽公主的诅咒。话说这个貌美的正妹，引起了其婆婆的妒忌，当她丈夫从军后，她的婆婆就控告玛苏丽公主通奸罪。


    古时候，根据当地的法律，通奸的罪名就是死刑。就好像我们中国人以前的通奸，是要浸猪笼那样。


    即使更多的民众相信玛苏丽公主的清白，在围观她的死刑之际，却没有人挺身而出为她求情。


    结果，当刽子手把短剑刺入玛苏丽公主的胸膛，令人震惊的事情发生了：伤口流出不是红色的血，而是白色的血。白色的血，象征她是清白的。


    玛苏丽公主咽下最后一口气前下了一个诅咒，兰卡威岛将会遭遇多灾多难，长达七代。


    直到后来，马来西亚的前首相马哈迪医生开始发展兰卡威，恰好七代过去了，诅咒也已结束。所以今日，兰卡威才能变成如今闻名东南亚的度假胜地，还是免税的购物天堂，巧克力和酒都相当便宜。


    「喂，司徒先生，我们要离开了！」就在这时，一个甜美的嗓音拦截了他的思绪。


    转身看到美丽的女导游正向我招手，我响应：「马上过来！」


    我快步走到女导游跟前，跟着她上了箱型车。


    「明天就要离开这里，往吉隆坡去了，再见！兰卡威。」我依依不舍想着，跟着美丽的女导游上了没冷气的箱型车。


    司徒先生，明天要搭早班船离开兰卡威，接着我们再坐比较舒服、有冷气的'
