    老妈子气得几乎说不出话，喘气骂道：「你发神经，她哪个地方像范冰冰，神经病！像饭桶差不多！」


    我是时候狠狠地给老妈子斯巴达式的教训，因为我发现自己身体所有的部份都是上佳的武器，我可以用自残来对付母亲。


