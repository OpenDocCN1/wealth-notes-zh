  - '[PAGE 58]


    月，一颗浅绿色的地球，还有几颗被光环环绕，像戴着一顶漂亮大草帽的粉红色卫星，在湖面组成小型的银河系，无与伦比的绝美瑰丽。


    微风飒然而至，湖面上咯咯漾起阵阵荧光波纹，湖里水草发出荧光色的光泽。


    同时还有几尾六块腹肌棱角分明的壮实男人鱼，全身熠熠光彩，在湖里妩媚的游着泳，翘翘的屁股弧线深深吸引她的眼球。


    「道造，放松你的头、你的身体，你的脚吧。道造啊，尽情拥抱大地之母吧!」魅音如是耳语。


    归真返璞的胡静怡二话不说，吸了一口气，双膝一弯一直，人已经跳上半空中，顺着瀑布的水势直冲而下。


    她双手合掌直伸于头顶上，以最优美的跳水姿势头下脚上，就在接近湖面时，她又摊开双手拥抱大地之母。


    「啊……啊……大地之母，道道来咯！快拥抱道造吧！」


    「砰！」


    发出沉闷的碰撞声响，胡静怡的头颅应声碎裂，脑浆四溢血肉模糊，浓稠的鲜血流了满街。


    街道上的路人连影子也没看清楚，瞬间只看到一个挺直的身子，头下脚上直冲柏油路面。那人身子在剧烈撞击后微微弹起，挣扎蠕动几下就静了下来，已是返魂乏术。「跳楼啊！有人跳楼啊！快叫救护车！死人啦！」围观的民众越来越多，好奇心果然杀死猫。


    李想戴着洛杉矶奇奇队鸭舌帽，隐伏在转弯角处，露出满意的阴朋微笑，他咕哝低声，冷冷地说：


    「妈的，你这死八婆，竟然花了我两个星期的时间来诅咒你。黎敏平，这是第一个警告，第二个就轮到你的儿子。我已经他妈的诅咒了胡静怡与你的孩子两个星期了，要是你死了孩子之后，乌鸦还看不到你的忏悔信，也还收不到你的祈福钱，第三个人一定是你！」


    说完，他迅速转身离去，消失在霓虹月色下。


    「南无阿弥陀佛夜，哆他伽多夜，哆夜夜他，阿弥陀佛都婆吽………」天边传来幽幽的《往生咒》。'
  - '[PAGE 59]


    李想开着跑车，进入街道旁一个角落。


    坐在车内的他，一边听着节奏蹦蹦跳跳的莫扎特 D 大调双钢琴奏鸣曲，一边运筹帷幄，准备发动。


    李想右掌朝天摇晃着，左掌朝地摇晃着，他紧闭双眼，冥想着轰轰烈烈火围着他燃烧起来，火势很快与太阳合一，他口中喃喃自语说：


    > 「黎敏平的孩子，黎敏平的孩子……天雷勾动地火，啊，天雷勾动地火，嗡，咕噜李想悉地哞，天雷勾动地火……烧死黎敏平的孩子，噢噢噢噢噢……YES」


    他的右掌以倾斜 45 度劈出。


    「五雷轰顶，天诛地灭！升官发财，上天地下，唯我独尊！」


    # # 「第八章」


    如果今天是二月初二的龙抬头日，太阳刚升高地平线时，苍龙抬头升上半空，地平线将会出现一片蓝盈盈的晴空。但今天不是二月初二，今天即将发生黎敏平毕生永远估计不到的事情。


    黎敏平走入雾气弥漫的浴室，宽衣解带后打开淋浴花洒，准备履行一项应战前的重要仪式。当 38 度半热水从头顶淋了下来，热水的能量灌满身陷选举困局的脆弱心灵。


    如果说，一本好书是一盏指引航向的灯塔，那么一场热水澡就是洗涤心魂的仙丹灵药。经过热水澡的洗礼后，让他心中冒出无法言喻的舒畅感，涣散的心神即时互相贯通，融合一体，进而形成扎扎实实的无敌勇气与意志力。


    自他竞选仁义党主席的活动开跑以来，总是披星戴月，所以每天一早的 38 度半热水澡，代表着不可或缺的能量充电站。


    这个热水澡对他起了超凡入圣的影响，使得他进行演说时、游说党内成员支持他时，精神抖擞，更显得雄赳赳、气昂昂——只要他在仁义党竞选赢得主席之位，下一步他就会代表仁义党竞选台湾总统。


    今天是最后的关键时刻，明年的第一天就是投票日，他必须趁胜追击，做最后的冲刺。他需要以大票数的票数赢得党主席之位，接着在 2014 年，代表仁义党竞选总统选举——届时，他将会以三十八岁年龄，成为台湾历史上最年轻的总统。'
  - '[PAGE 60]


    这日，他将花洒的水龙头关了之后，突然眼前黑黝黝一片，觉得天旋地转，恍恍惚惚仿佛听到漫天嘈杂的飞鸟声音。


    「呃……奇怪，这个星期总是这样……洗澡时总听到鸟叫声，呃……」


    每次他都打开浴室门瞧瞧，但什么都没看到。


    这次……


    他打开浴室内后，遽然发怔，心中发毛，寒毛直竖，鸡皮疙瘩一块块如浪潮般一波波的浮现全身上下。


    黎敬平压根儿就无法分辨眼前的情景，房间里头充满了密密麻麻的乌鸦，占满了他的床铺、桌子、椅子、书橱、计算机、风扇、梳妆台。


    所有的乌鸦都「哑！哑！哑！」张开嘴巴叫着，此起彼落，好像冲着他而来。


    黎敬平吓得魂不附体，连衣衫也来不及穿，随手围着毛巾即飞快的冲出浴室，打开了橱柜。


    只见一把改造的自动型雷明顿 M870 霰弹枪在橱柜中安眠，黑黝黝的枪管即使被层层灰尘包围，依然无法掩盖其令人不寒而栗，随时都会起让人鸡皮疙瘩兼打哆嗦的骇人杀气。


    黎敬平取出雷明顿 M870 霰弹枪同时，也不忘拿取那个装满子弹的特制牛皮子弹包，以备不时之需。


    这一支沉寂已久的雷明顿 M870 泵动霰弹枪，口径十二，全长、1080 公厘，重三点八公斤，改造过的弹匣容量为 8 发子弹，由美国雷明顿武器公司生产。与它配用的弹种为
    12 号霰弹，也称之为鹿弹。


    鹿弹是一层青色的塑料外套，里头则含着发射用的弹药和弹头。弹头里含有大量的银珠子，因此 1 颗鹿弹可以同时把弹头里的 12 颗直径六点一毫米的小银珠，散射出一大片范围。跟普通的子弹比较，霰弹的攻击区域更广。


    黎敬平想要开枪射杀乌鸦，谁知乌鸦像被操控的黑衫军大队般，阵容整齐一致，咻一下就飞出房间，接着穿过走廊、客厅，冲破大门，一直往前飞，黎敬平一路在背后嗷吁吁的狂追着这些乌鸦。


    他看着大门被乌鸦冲破一个大洞，惊讶得合不上嘴巴，大门的大洞无法让他直接穿过去，他只好转动门柄推开大门。情急之下，他连身上围着的毛巾掉落都没察觉，赤裸全身冲出大门，却突然停下了脚步，心脏在这个时候彷彿暂停一样。'
  - '[PAGE 61]


    因为他眼前所看到的景物，已经不是他往常所熟悉的，对面的景象不再是一排 又一排高级别墅，而是一片茂密的葱绿丛林。


    突然间，一切都很不合理。


    黎敬平对眼前的幻象，除了有隐隐约约的恐惧之外，更激发出他变态好斗的个 性。


    他是那种变态折磨人之后，又惺惺怜悯的人，当对方一旦放下心防，他会 做出更变态的行为。


    「好玩啊，我要杀光你们，杀！杀！杀！」黎敬平双眼反白，咧嘴狞笑流着口 水，脸部表情既阴森又恐怖。


    他的变态与性格上的扭曲，此时此刻全都因环境而逼发出来。


    他喘着气，回想著童年时，他不小心将父亲的鸟笼给打开，父亲那会唱歌的心 肝宝贝就唰地飞走了，他被父亲狠狠地修理了一顿，跪在地上不断地叩头求饶……


    第二天，他拿著一百度的沸水，将他父亲第二只、第三只鸟笼并排在一起，将 沸水当头淋下……


    朦胧的灰色天空，不知道何时滚来了团团乌云，云层像一块块厚厚的巨型灰色 棉花，棉花里蕴藏着饱满水分。


    天空酝酿鬼哭神嚎的情绪，一场倾盆大雨已经箭在弦上，一触即发。


    黎敬平一眼望去，更傻了眼。眼前森然的树林中，挤满排排站的乌鸦，像是对 他严阵以待，颇为壮观。


    可是此时的乌鸦大队，却异常冷静，和刚刚嘈杂的情景形成强烈对比。


    寒风飕飕，没有半点乌鸦的啼叫声，使得枝叶妖异的摩擦声和时有时无的蝉鸣 声所组成的交响乐，显得格外刺耳。


    有了这把雷明顿 M870 霰弹枪的加持，现在黎敬平身上开始散发出毁灭性的杀 气他想要与乌鸦大队一次雌雄，于是他把八颗又粗又长的、2 号霰弹逐个塞入弹膛。


    接着，他打开猎枪上闭锁的保险栓，准备和乌鸦大队来个你死我活。


    黎敬平举起猎枪，想对着多不胜数的乌鸦群开一枪示威，黑衫军却像看穿他诡 诈的阴谋一般，瞬间又列队成群飞进树林。


    黎敬平见状，唯有端著猎枪气急败坏的边跑边追，一直追、一直追，使尽吃奶 力气追到一片空地。'
  - '[PAGE 62]


    正所谓：流水不腐，户枢不蠹。目前的追逐，是他一辈子活动量的总和，除了床上，他几乎都不做运动。


    只见多不胜数乌鸦紊乱地飞着，眼前尽是黑压压的影子。


    按耐不住心头怒火的他，额头爆出青筋，每一根血管好似都充满瓦斯，绷着一张臭脸跟黑衫军对峙。


    他屏着呼吸，缓缓举起了膛的雷明顿 M870 霰弹枪，连瞄准的功夫也省了，接着就是扣下扳机，一枪又一枪、一枪又一枪……


    枪管随着发射出的子弹吞云吐雾，冒出一阵阵白烟，就像个烟瘾重的老烟枪。


    射完第一轮的八发子弹，黎敬平意犹未尽，逐渐坠入要和这群欺侮他的黑衫军势不两立的情绪里。


    他低下头赶紧填满弹膛的空缺，打算展开第二轮大厮杀。


    这时，溃不成军的黑衫军已变成一盘散沙，四处乱窜，而睚眦必报的黎敬平又怎会手下留情呢？


    他肆无忌惮朝着最大群的黑衫军不断狂追，随时随地灵感一来就补上几枪。


    嚣张的黎敬平一路沿着树林曲里拐弯的羊肠小道不断狂追黑衫军，在势必诛黑衫军九族的信念下，连他的手脚被树林里的荆棘划伤了，他都抛在九霄云外。


    乌鸦大队寥如晨星，已经没剩下几只阿猫阿狗。


    不知不觉，黎敬平来到了一个废弃的农庄。农庄杂草丛生，乱蓬蓬的杂草被一些姹紫嫣红的花点缀着，画面十分绚丽。


    草丛里传来「沙……沙……」的声响，黎敬平半蹲着屏息静气，用枪头对着声源。


    +   　- 窜出头的是只营养不良，四肢短粗，长相讨喜的小野猪。尾随领头小野猪的还有三五只体型参差不齐的小野猪，仿佛在玩捉迷藏。


    蹦蹦跳跳的小野猪发出吱吱声响，好像跟黎敬平平安，对端着猎枪的他不多加理会，毫无戒备之心，继续玩他们的捉迷藏。


    具备野外常识的猎人能够推断，只要找到小野猪，附近肯定会有体重超过 200 公斤以上的大野猪出没。


    这时黎敬平的肾上腺持续着杀戮之后的高亢荷尔蒙，他手痒痒地想：「既然都来了，而且难得可以出动封存已久的拿破仑三号猎枪，是时候大显身手了。」


    果然不出所料，随后远处的草丛传来「沙啦啦……沙啦啦……」的移动声，他'
  - '[PAGE 63]


    不动声色地接近声音来源。


    走到废弃农庄的另外一端，他惊喜连连，因为那里有三五只大野猪。


    公的野猪少说也有 300 公斤，母的估计 200 公斤起跳。距离大野猪不远，更有满坑满谷铺天盖地的小野猪，攒三聚五嬉闹着。


    「今天你们都逃不出我的五指山，见到我黎敬平算你们倒霉！准备投胎吧！」


    于是他把弹膛中剩余的空缺全部填满。风吹草动中，他瞄准其中 1 只视野最佳的瓮中之「猪」。


    就在此时，其中一只大母野猪突然用五个高八度音悲愤交加的朝天嚎叫，惊动了所有的小野猪。三五成群的小野猪死命横冲直撞，东奔西跑，四处乱窜，并不断吼叫喊救命。


    其中只 300 多公斤的公野猪则露出獠牙，鼻孔喷气，登时一个箭步以子弹列车的音速朝黎敬平冲了过来。


    黎敬平看着那只大公野猪估计有七寸长的上翻獠牙，就像锋利无比的剑锋。野猪怒发冲冠，红头涨脸，全身鬃毛竖立，令黎敬平突然起有想要退避三舍的念头，顿时吸了一口冷气，行动瘫痪。


    ——彼此距离 500 公尺——


    他剧震一下，见情势不对，倒退了几步转身逃跑之际，却一个踉跄跌个狗吃屎。


    ——彼此距离 200 公尺——


    在这种危如累卵的情势下，他狼狈地爬起来，转过头来就端起最后一根稻草——雷明顿 M870 霰弹枪，瞄准大野猪的眉心扣下扳机。


    一枪又一枪……


    公野猪发出了凄厉的惨叫声，安静下来。


    突然间，黎敬平感觉腹背受敌，还被左右夹攻。


    ——彼此距离 50 公尺——


    一个帅气的转身，他往周围的几只小野猪发难。


    一枪又一枪，一枪又一枪……


    除了地上静止不动的几只，其他都逃得无影无踪，连个影子都没有。


    赤条条的他射过数枪之后，射击加上追逐，还有跟野猪的搏斗，已经耗尽了他的体力。'
  - '[PAGE 64]


    # 第一话


    体力透支的黎敏平蹲坐在地上喘着气，用手抹去额头上象征报复成功的汗水，不自觉就露出金光闪闪的假牙奸笑着，就连脸上的毛孔似乎也跟着咯咯大笑。


    迅雷不及掩耳，雷鸣电闪之际，大雨就像断了线的珍珠一样，不断地往下泼洒。刹那间所有的一切，风云色变，物换星移。


    倾盆似的雷阵雨劈头盖脸打下来，很有节奏地不断敲打他的头。


    淋着雨的黎敏平抬起头，被眼前景物彻彻底底的吓到尿失禁，五脏六腑揪在一起打成失魂落魄的他看到眼前不再是丛林


    这个时候，学府的警铃响彻云霄，进入紧急状态。死里逃生的老师和学生们死命抱头鼠窜，躲开杀气重重的雷明顿 M870 霰弹枪枪管，高分贝的尖叫声不绝于耳。


    学校的警卫林伯伯平躺在地上。身中多弹，命在旦夕。灰白色保安制服被浓稠的血液染得红不隆冬。


    林伯伯身后则是趴着新婚的郭老师，七孔出血，死状恐怖。两个死者的身上被雷明顿霰弹枪的鹿弹轰得宛如蜜蜂窝，密密麻麻弹孔溢出无止尽的血浆。


    诧愕的黎敏平，更不敢相信自己所见到的一切。地上还多了四具躺在血泊中的小孩尸体，鲜血从尸体上的枪伤徐徐流出。


    他脸色一阵青一阵白，再看着自己手中紧握着雷明顿 M870 霰弹枪，双腿一软，瘫痪跪在地上，头脑一片混乱，一脸懊丧地摇头。


