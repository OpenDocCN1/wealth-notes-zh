    「李想，你果然了不起，一出手即解决掉胡静怡。胡静怡，看那胖子还敢不敢再播你唱诵的往生咒。」


    他随手将毛巾丢进浴缸内，拿起睡袍穿上，懒洋洋的躺在床上，他的眼皮愈来愈重……


    ### 李想遗失的记忆3


    我驾车飞驰在往北马来西亚中部怡保的高速大道上，双眼没有焦点的直盯着前方放空，脚下猛踩著油门。甚至，握著方向盘的手还属不属自己，我都说不上。


    其实我不在意能多快抵达兰卡威岛，我只是等待「目标」的出现──别的事很难说，但对于这种事，我一定超有耐心。


    2007 年改编自法兰克·米勒（Frank Miller）小说的电影《300 壮士：斯巴达的逆袭》，内容描述斯巴达国王列奥尼达一世和三百名斯巴达战士，奋力对抗波斯帝国的薛西斯一世和他的大军。面对悬殊的人数差距，壮烈殉国的斯巴达战士鼓舞了所有希腊人，让他们团结起来对抗波斯大军的入侵。


    斯巴达式的牺牲决心是：「长矛断了就用刀，没有刀就用手和牙齿。」全身上下每个部位都可以是你的武器。


    斯巴达人的遗言如此传述：「陌生的过客，回去告诉斯巴达人，我们遵守斯巴达精神，在此倒下！」──战士宁可站着死，却不跪着生。


    我要老爸知道，这就是你调教出来的孩子。


    我曾经在杂志看过这则名句，于是特地抄了下来贴在床头：


    > 「我是一个兴风作浪者，我相信这是我可能成功的主要原因。我做了每个人认为做不到的事情，而且这些事情的方法，会使得每个人都说我疯狂！」──当然，包括了我身边的女人和这次的计划。


    我老爸说，我四岁之前，二叔经常来我家串门子。


    每当有飞机从头顶经过，我总是兴奋跺脚，指着蔚蓝的天空说：「哇，你看，大飞机耶！二叔二叔，那飞机飞到哪里去啦？」


    二叔会摸摸我的头说：「飞机飞到云里，飞到很远很远的地方。」


    「哎哟，怎么飞机不等我啊？」我难掩脸上失望的表情。


    为了逗我开心，他喜欢将我高举起来放在他的肩膀上，跟我玩「坐飞机」。


    当时候我很高兴，手臂向两旁伸直张开，想象我化身为飞机高高的翱翔。伸展笔直的双手犹如天平，时而一边高一边低，时而一边低一边高，不断的唱着我最拿手的「造飞机」。


    ```

    造飞机、造飞机，来到青草地

    蹲下去、蹲下去，我做推进器

    蹲下去、蹲下去，你做飞机翼

    弯着腰、弯着腰，飞机做的奇

    飞上去、飞上去，飞到白云里

    ```


    我四岁生日那一天，二叔在客厅里和我玩「坐飞机」，一时大意把我举得太高，天花板吊扇毫不留情的把我的额头划上一道口子，当场血流满面。


    我马上被送往医院急救，缝了好多针。


    额头上那道五寸长的疤痕，就是这样烙印在我的脸上一辈子。


    现在我并不是很在意伤疤是否明显，我要说的是，当时这伤却几乎要了我的小命——老实说，我照着镜子看了很多次，我倒觉得疤痕不很明显。


    正所谓：如果身上没有一点疤痕，算什么男人啊！这样不是很酷吗？


    老妈子说，她为了这件事，从此与二叔撕破脸皮，正式脱离兄弟关系，大家各走各路，不相往来。


    我这段经历，是老妈子与老爸跟我重复说了很多遍的往事。


    虽然我对二叔及这件事完全没有记忆，不过从我有记忆开始，我照镜子时，就看到那个疤痕。


    不知道从什么时候开始，在我的成长过程中，额头的疤痕总是与我的名字连在一起。我不知道他们笑什么，当我说：[你好，我叫李想！]我注意到他们的目光，总是先来个全身扫视，之后看一看我的额头，迟疑片刻，嘴角才泛起一丝皮笑肉不笑的笑意——好虚伪的笑意，接着很不自在伸出所谓的友谊之手。


    也许是他们心虚了，但也很可能是我的幻觉。


    我总觉得，他们的掌心都有些潮湿……


    我真的不介意额头有一道五寸长的疤痕，但却很介意人家问：[李想？理想！你有什么理想？]


    我心里骂烂的狂讪谁：[干你这乌龟王八蛋，你去问我老爸吧！]


    我第一个女人小泽玛莉亚，虽然是有妇之夫，却从不在意我额头的疤痕。


    但学校里的正妹，每当我上前搭讪时，她们总会鬼鬼祟祟的看-看我额头那道五寸长的疤痕。


    我说过，我真的不介意。


    但我不喜欢额头的疤痕太过引人瞩目，所以我开始留长头发。


    后来学校的训导主任将我的长头发剪掉，疤痕又抛头露面。


    因此，我超不喜欢待在学校这鬼地方，蓄长发不是我的自由吗？我不喜欢没有自由的感觉！


    每次新相识的朋友总会问：[李想，你额头上的疤痕……]


    我像播音机一样，不知道重复了多少遍相同的解释。


    其实，我也很想问这些新相识的智障朋友：[为什么你有眼睛，鼻子，嘴巴？……唉，你的眼睛还能动？」


    不过我很自豪地说，我身边出现过的四个女人，从不介意我额头的疤痕。


    呵呵，我忘了说，其实当年我的疤痕是从额头上斜 45 度划到右眼角上，还好没有变成独眼龙。但我右眼因此显得特别小，而在两眼对比下左眼就特别大。


    我这大小眼，因为这次的计划，使我变得更特色！


    我这个特色可以变成一个惊天动地感人肺腑的神话故事——这个世界真的有前世因，今世界！


