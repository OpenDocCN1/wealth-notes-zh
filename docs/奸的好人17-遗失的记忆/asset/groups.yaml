    其身，行拂乱其所为……」


    没想到时隔多年，我还是对这一段念念不忘。好记忆的秘诀？我都把这些当做嘻哈音乐那样 RAP。


    Yo，yo，yo……


    后来我听 说，服用类固醇与长肉剂会长出完美而又健壮的肌肉，不过副作用是使得声带变得沙哑低沉。


    可是，我看过美国人写的书，凡是声音低沉者都是优秀的领导者，于是我透过为我跑腿的走狗，替我买非法的类固醇与长肉剂。


    马来西亚政府以为买这类药必须要有医生核准，但他们并不知道，我可以透过药厂无耻兼没有公德心的销售员，寻找那些生意涣魄的医生，从他们那里转手卖给我即可。


    这里和美国不一样，美国的医生是不准卖药的，因此我永远相信制度会改变人心——我开始服用类固醇与长肉剂，果真进步神速，肌肉如魔术般一块接着一块长出来，同时我的神通也变得更加厉害
    了。


    现在我每天都看到满街都是阿飘，有环肥燕瘦的男女老少和变性阿飘，我还看到每个人身体所发出的灵光，有红橙黄绿蓝靛紫和黑色光。


    渐渐的，我发现自己好像连他心通也够发 挥了。


    每天晚上临睡前我都会照着镜子，轻轻抚摸着我领头的疤痕……


    有一次我故意在老妈子张紫怡面前窃笑着抚摸疤痕，她看得眼泪直流（都是假惺惺的鳄鱼眼泪），紧紧抱住我摸着我的头（趁机偷探我的信息磁场）。


    我感受到她软绵绵的胸脯还有她的卜卜心 跳（让我心软且色心大起），额头还隔三四秒即滴下几滴水（内心紧张而流出的汗水）。


    我看看自己的心口洞愈来愈大，洞里面还有火焰缠绕着的忿怒尊不动明王，不动明王跟我一样都是大小眼，很酷！我安抚着目光与我双眼同样不协调的忿怒不动明王，心平静气跟袍说：「老大耐心点，忍住，我学会了等待，现在时机还没到！」


    拥有神通的人，第一个明哲保身的条件就是要保守秘密，千万不要让没有神通的平凡人知道你拥有神通。一旦凡夫俗子知道你拥有了神通，他们就会妒忌你，进而开始中伤你，冤枉你有神经病。因此，大家应该知道世界上神通异士都住在什么地方，对吧？'
