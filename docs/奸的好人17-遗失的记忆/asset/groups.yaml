    \n你们认为一个精神分裂的人会喜欢阅读吗？\n\n告诉你们，我没有精神病，我是一个博览群书的英雄好汉！高知识分子！爱国主义者！环保份子—玄学专家！\n\n\
    等等……这里有一片记忆图像吸引了我……\n\n我看到六个月大的我不知何故嚎啕大哭，张紫怡像疯子一样跪在我的面前，垂头丧气不断磕头：「求求你，你不要再哭了，求求你，我给你叩头……」\n\
    \n我看着图像的片段，心里实在爽快——哈哈哈哈哈，老妈子给我叩头，哈哈哈哈哈……\n\n我多么希望我愈哭愈大声，最好将这个臭婆娘逼成神经痛，她连自己的亲儿都舍弃，还有什么资格当人的母亲？从我看到她舍弃我的那刻，我已经对某些事顿然大悟。\n\
    \n接下来的事，让我瞳孔扩大，这件事令我大开眼界，事实证明我果真没有误会她。\n\n我听到啪一声清脆的响声，我狞笑着看着紫怡左—右已—巴捆打我。\n\n我笑得更大声，我看到我哭得更厉害。\n\
    \n我侧头看着我脸部留下清晰的红色手掌印，耳边还听到紫怡像开机关枪那样的咒骂：\n\n「哭够了吗？你再哭下去，妈还不知道能不能养活你？李想，你不想活，妈也不想活了，我们一起死了算了，死是一种解脱！」\n\
    \n我看着这一幅「感人肺腑」的窝心刻面，笑得眼泪都流了出来。\n\n之后紫怡掐住我的咽喉，我看得更是笑到眼泪直流——快，老妈子不用给我面子，大力一点、大力一点——我又是一阵狂笑！\n\
    \n妈，你还掐得不够大力，你今天没吃饱饭吗？我教你，你要用尽平生最大的力气才有可能掐死我，要是我此刻被你掐死，今天就不会再有我的存在了。\n\n我很满意的看着这图片：我帮你加油打气。\n\
    \n大门打开，我看见李卜回来，他疾速奔向紫怡，一巴掌挥过去：「你疯够了吗？！」\n\n她捂着火辣的脸频抽泣着。\n\n李卜温柔地把我抱到沙发上，抚摸着我的头。我又看到自己心口有一大洞，大洞慢慢被填补回去……\n\
    \n李卜将我紧紧抱进怀里，我们父子俩在沙发上睡着了，好幸福哦！\n\n又是一片寂静，紧接着，更精彩的一幕又出现了。\n\n我看到披头散发的张紫怡，背后绽放出五彩神光。\n\
    \n她拿着刀片，狠狠地区额头上以 45 斜度割了一刀。我将脸贴近在图片画面，看到我血流如注，哭喊之余还「呷下」很多血液。\n\n脸上已经分不清楚哪些是眼泪，哪些是血液。\n\
    \n我的哭叫声救了李卜一命，因为她也准备在李卜的脸上补上一刀。\n\n李卜及时反应，双腿一蹬，踢中紫怡的腹部。她像断线风筝似地倒退。\n\n李卜担心紫怡的飞刀绝技，他飞身扑向紫怡，抢过了刀片，用力扯着紫怡的头发，狠狠地掴了好几巴掌，直到紫怡被打得陷入昏迷。\n\
    \n他匆匆以右手抱住我，左手揪着紫怡的头发上车……\n\n看到张紫怡在我的额头留下伤痕，我心冷了下来，我出奇冷静，安之若素。\n\n如果你问我，为什么我不愤怒，我会告诉你们，我觉得很好玩啊！\n\
    \n我倒希望她干脆将我杀掉，让我痛痛快快的死不是比较专业吗？\n\n我不是说过，我从来不介意我脸上的疤痕吗？\n\n换成是其他人，他一定会恶声恶气狂骂自己的母亲：「怎么会有这样的母亲，就算虎毒都不食子，豺狼亦有母爱，你却比禽兽都不如！」\n\
    \n我更不会因为看到我血流满脸，听到我的哭泣声而感到心如刀割。\n\n实际上，我倒是希望她这一刀割得更深，我希望看到血流得更多——其实我最希望看到，她一刀划过李卜的喉咙，这样比较刺激不是吗？\n\
    \n另一方面，我也很好奇，这个臭婆娘在我脸上割了一刀，而往后的日子，李卜为什么会放心让我跟她一起住？李卜难道患有失忆症？他看到自己亲生儿子被严重的伤害，他竟然没有想过报仇？我看不到李卜为了我脸上的伤痕——这个人工伤疤报复！完全没有任何报复的迹象！如果我是李卜，我一定会缝着眼睛笑，冷冷的跟她说：「我不会让你死。让你死掉岂不是便宜了你这个臭婆娘。\n\
    \n我要让你毁容，用针戳你的乳房，一针一针戳，让你浑圆的乳房慢慢泄气，也看你慢慢的受苦。我要在你脸上淋硫酸，不过我只会淋半边脸，另外半边，要给其他人看得出，你美丽的脸庞和丑陋的脸庞的对比，好像美容院的广告那样，毁容前和毁容后，这样一定很好笑。\n\
    \n我更会把你的阴道缝起来，看你怎样死。在你的乳房，我曾经摄取营养的地方，我还会割开一个伤口，放苍蝇蛋下去。通常，这个伤口注定腐烂。不过，我不会让你的乳房被截掉，这样不好看。\n\
    \n你让我活在谎言当中，我会让你活在地狱当中。或者，如果真有人狱这个地方，你会求我让你到那个地方去透透气，因为这里的人间地狱，会让你痛不欲生，且永不超生。谁叫你让我俊俏的脸多了许多余的伤疤。你这个疤痕的始作俑者，斩！\n\
    \n我侧头看着他们绝尘而去，突然茅塞顿开——原来如此，难怪我从没听过二叔的名字，难怪我没看过二叔的照片，难怪一直以来我都没有婴儿时期的照片。\n\n原来才六个月大的我，即被自己的亲生母亲所伤害……\n\
    \n画面渐渐褪色，变得没有色彩，好像六十年代的黑白电视。\n\n我看着紫怡被送进精神病院一年……\n\n但我忘了今天我的心里又破了一个很大的洞，这是一个无底的黑洞，也好像漩涡，把我今天看到的一切美好回忆都吸走了。\n\
    \n要不是后来，一直保护我的黑暗护法神告诉我、提醒我，要不是后来我展示神通，我今天的记忆真的是被吸进黑洞里面，不会再出现。\n\n记忆图片中继续显示着：\n\
    \n张虎猛然离开我的额头，我还是闭着双眼继续昏迷着。\n\n他心神不守看着张紫怡与李卜，颤抖地说：\n\n「师父，师母，他有很大的怨恨，他的海马回里有很深的记忆图片，我烧毁了一次，它又自动重整修复了一次，因为他看到自己的疤痕……」张虎不敢继续下去，他脸色煞白的看着李卜与张紫怡。\n\
    \n「等等，张虎，你是进入他的海马回吗？」李卜突然想起一个重要的资讯。\n\n「是的，师父。」张虎不知道为何李卜有此一问。\n\n李卜提出一个重要的论据：「根据研究大脑的研究显示，我们人类不可能记得三岁以前所发生的事，理由是三岁前海马回还未成熟……所有的情绪都是无意识的表现……」\n\
    \n「师父，这点我还不清楚……不过我想问你们，在小师兄李想昏迷的当儿，你们有没有在现场，而你们又有没有想起过李想婴儿时期的往事？」张虎寻找着合理的解释。\n\
    \n李卜望着张紫怡，紫怡低头缓缓地地点着头。\n\n「师父，如果我没有推测错误，那时小师兄他神识处于迷离状态，漫游在手术室內，他的脑磁波可能无意中接触到师傅脑细胞因为回忆往事而发出的极微量磁波，产生了事件关联的电力波连接，而将师母的记忆串联进小师兄的记忆中……其实……」\n\
    \n张虎吞了口口水，继续说：\n\n「我相信这是小师兄无意的闯入，不过……，据我师父鬼金羊王霸教我入侵大脑神通时，他说过，只有高手能将数人的记忆串联起来，让彼此的脑磁波发生事件关联的电力波连接……」\n\
    \n「够了，你帮我们，再洗掉这段记忆，千万不要让李想知道真相……」李卜别过脸指示张虎。\n\n张虎犹豫了片刻，终于又再次用额头贴着李想的额头。\n\n李想瑟缩在角落啜泣，一时无法自己。\n\
    \n过了一会儿，他悄悄地站了起来，举起椅子，蹑手蹑脚慢慢的走到张紫怡的面前，高举椅子往张紫怡的头狠狠砸了下去。\n\n紫怡惨叫一声，栽在地上的血泊中，李卜被突如其来的攻击吓得全无睡意，但已经太迟了，李想转移了攻击目标，猛力将椅子往李卜的头颅砸下，李卜双手护着头颅尖叫：「神经病，神经病！」\n\
    \n李卜与张紫怡满脸鲜血，两人紧紧抱在一起，瞪大双眼傻傻的看着李想。\n\n李想象是失去理性的野兽，双眼布满血丝，急促的喘气。\n\n「怎么你不敢打死他们？」瘦巴巴的老人嘲笑李想，似乎很想看李想如何亲手打死自己的父母。\n\
    \n李卜与紫怡从梦中看到相同的幻象，可惜他们来不及从惊悸的迷离境界清醒过来。看着李想对自己攻击，根本来不及反抗。\n\n李想指着紫怡的鼻子狂喊：「臭婆娘，我刚才看到你举用刀片在我脸上狠狠地割了下，我亲眼看到的，你这个死八婆！你怎么解释？」\n\
    \n「李想……呃……」\n\n紫怡处于半昏迷之间，斜靠着沙发，她想拼尽力气向他解释。\n\n她迷糊中看着瘦巴巴的老人，气若游丝一字一字地吐出：「金神七煞……」脸色突然变得死灰。\n\
    \n「呃，张……张虎……原来是……你……」\n\n李卜心头震撼，他开始意识到，刚才之所以看到幻象，李想之所以恢复记忆，原来都是张虎的一手策划。\n\n「张虎，你……为什么……要这样做？」李卜神情凄惶指着张虎问。\n\
    \n老人推开张虎，走到李卜跟前蹲下来，倨傲地瞪着他，脸黑口臭的表态：\n\n「为了帮助李想不要被你这个神棍所操控，帮助他早日登上玄门正宗的掌门人。我们可以放过你，七天之后，待你们脸上的淤肿消除，我要你们宣布李想是玄门正宗的掌门人，你们夫妇俩自此云游四海……」\n\
    \n「呃，鬼，金，羊，王，霸……」张紫怡终于恢复神识，娇躯微抖看着这个瘦巴巴的老人，嘴巴张大得无法合拢，吭哧了老半天，吐出了一个陌生的名堂。\n\n「对，就是我，多年不见了，别来无恙？」鬼金羊王霸不以为然地笑说。\n\
    \n张虎得意的笑着，精神颇为激奋：\n\n「紫怡，你一定很好奇，为什么我们可以将你、李想、李卜，还有……司徒超仁的记忆在这里交织在一起，让彼此观赏？」\n\n\
    他慢慢走到紫怡的沙发座位前，手中拿着一瓶矿泉水摇晃着说：「全靠这种高科技的研发，嘿嘿！」\n\n「原来是你张虎……」咬牙切齿的李想蓄势待发，准备对张虎发动攻击。\n\
    \n此时张虎转过身，看着正喘气不停发出低吟野兽嚎声的李想，说：\n\n「李想，你放心吧─我们是过来帮助你的，去年李卜带你去那有钱的住宅看风水，你回家之后，你的黑暗守护神不是告诉你，你可以将会成为玄门正宗的接班人吗？你不是经常寻思，为什么李卜没有神通，而我们这些有神通的人需要听命于李卜？呵呵，我们现在就如你所愿……]\"\
    \ \n\n李想双手紧握的拳头，慢慢的松了下来……\n\n李卜看着李想，再失望地与张紫怡对望着，面面相觏时两人均露出绝望的神色。\n\n[呵呵，李卜，你的孩子好奇怪哦，为什么—听到他可以接替玄门正宗的时候，他想杀人的气焰突然降了很多，我还以为他会为了报仇不顾一切……嘿嘿……]\"\
    \ \n\n鬼金羊王霸蹲着身子在李卜耳边说完悄悄话之后，用双手捏着李卜如瘠薄土地的臉频，并用力狠狠的掌搋了两巴掾。「啪啪!!」李卜脸频由青转红。\n\n[想儿，我可以继续传授你入侵他人记忆的内功密法上让你本有的潜能爆发出来，嘿嘿……·]王霸缓缓站起来，转头对李想咧嘴笑说。\n\
    \n「唬，唬，巫!巫!我可以学会一切的内功密法，我天生才识聪明，我会自动学会最厉害的神功密法!」李想双眼又布满了红丝，不断用舌头滋润干涓的嘴唇。\n\n[你真有本事吗？神经病只是修炼神通的初阶，有神经病的人!通常都比正常人容易得到神通，但你可要记住，这不等于发神经的人都有神通!』谪诈多端的王霸笑眯眯说着。\n\
    \n李想霍地翻了一个筋斗，狂喊着战斗肚佛来了。髐力惊人的他又翻了一个筋斗，凌空双腿踢向王霸，只见王霸用剑指着空气快速画圈，李想便不受控制地转了一圈，顿吋失去重心，顷刻四脚朝天摔个倒头栽。\n\
    \n躺在地上他想鲤鱼打挺跳起身时，王霸的脚跟已经踩在他的肚脯上。\n\n「谁是战斗肚佛？说!」王霸用力踩着李想，李想一动也无法动。\n\n「齐，天，大，圣，孙，悟，空!」李想极力挣扎着，口出狂言。\n\
    \n「哈哈哈哈哈，孙悟空，猴精孙悟空？」这时，王霸仰天狂笑着，他把脚挪开。李想迅速鲤鱼打滚三圈后来个蜈蚣弹起，跟着半蹲着做猴子状。\n\n[所以我说你神经病，这是你的精神分裂症，是你的想象，你只是开发了一点神通。我再说一次，你有神经病不一定有神通，哈哈．孙悟空是虚构人物，你还是别痴心幻想了!』王霸看似掏心掏肺的耳提面命。\n\
    \n「我是战斗肚佛!我没有神经病!我是孙悟空，我没有神经病!我不是精神分裂症！我没有神经病!」李想四处跳跃着，动作如猴子撒身抓耳，扮得惟悄惟妙。\n\n「嘿嘿李想，你知道吗？你，绝不是你老妈子张紫怡跟李卜生下的孩子……·」\n\
    \n### 第四话\n\n王霸揭老底后，露出得意的神情看着李卜与张紫怡，他彷彿将连李卜都不知道、紫怡心底隐藏的最大秘密都给揭露出来。\n\n张紫怡涨红脸，耳根发烫，并不断地咳嗽着，咳了一口含有血丝的痰。\n\
    \n她的精神涣散颓废，胸口苦闷难捱，用憎恨的眼神看着王霸。\n\n「李想，你知道你还有一个同母异父的野鸡杂种哥哥，他心口那块肉瘤，其实就是……」王霸说到这里卖了一个关子，看著一脸死气沉沉的张紫怡！\n\
    \n紫怡嗄泣颤抖不已，她开始，啜著，呜呜呜呜呜呜低吟着。\n\n「李想，你不应该分裂成孙悟空，这世界上真有一个战斗之神，因为你的知识不渊博，所以才不晓得，只是凭你个人意愿将你内心的野兽给引发成孙悟空，其实你应该分裂出更具力量的战斗之神！」王霸把「望李想成龙」的心思倾注在这一番话当中。\n\
    \n「战斗之神？」蓬头垢面的李想竖起耳朵，歪著四十二度的头看著王霸。\n\n王霸轻轻地点头。\n\n「战斗之神是谁？」李想颤抖著不停喃喃自语。\n\n「刑天。」\n\
    \n「刑天？没听过，你不要再骗我了，哈哈、哈哈，我是……」李想狞笑著，对绵里藏针的王霸感到不解。\n\n「呵呵，刑天你没听过？在远古的时代，黄帝打败蚩尤后，刑天发怒，指明要跟黄帝单挑独斗后来他被黄帝砍了头。但是刑天并没有死，他把胸前的乳头当作双眼，肚脐当作嘴巴，所以，你的大哥心中割出来那块肉瘤就是－－你！所以你是恶胎！第二次终于让你顺利出生了，哈哈！」\n\
    \n王霸爽朗豁达的笑声盘旋在半空中，振聋发聩的回音穿透李想的心，心中沉睡的巨人也被吵醒了。\n\n李想踉跄地跌坐在地上喟然长叹，张虎伸手扶起李想，顺势推著失神的李想到床上。\n\
    \n轻口薄舌的张虎轻轻拍拍他的肩膀，在他的耳边挑衅说：\n\n「可怜、可怜，你原本已经有精神病，今天让你受了太大的刺激，但再难受你 也得接受……」\n\n\
    「够了，够了，求你不要再说了，求你……」紫怡披头散发，跪在地上不停地\n"
