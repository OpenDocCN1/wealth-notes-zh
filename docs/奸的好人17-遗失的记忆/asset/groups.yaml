    此时，大旱望云霓的超仁终于发挥出一种很恐怖很可怕的力量——当众承诺，绝不裸奔，一定要成功的力量！


    「哑！哑！……哑！哑！……」几只无聊之极的乌鸦盲目附和。


    「等等……我在记忆图片中看到，秦寿环抱我的额头紧贴着他的额头……天啊，那不是李想进入我脑部记忆之前的动作吗？为什么当时我清醒后会失掉所有的记忆……」超仁开始冷静下来，感到不可思议的同时，也觉得无巧不成书，两者之间一定有错综复杂的联系。


    「真相是什么？谁能还原真相啊？」


    超仁不希望继续被女驸马招亲的感觉愚弄着，他希望新郎官揭盖子的那一天快点到来。


    「南无阿弥陀佛夜，哆他伽多夜，哆地夜他，阿弥利多婆毗……」


    超仁的手机又响了起来，他有种来者不善的预感。


    「死胖子，刚才我看到你的记忆图片，我注意到那个医官跟你额头贴着额头，我一时忘了他的名字，你快带我去见他！」李想用很急速的声音催促着。


    「他叫做秦寿，是……」超仁结结巴巴回答。


    「不要啰唆！你赶快死回来我的家！」李想的圣旨又到。


    ## 「第四章」


    超仁按了门铃，开门的是李想，他拖着超仁直奔楼上房间。


    李想将超仁推坐在床上，双手插腰没头没脑地问：「秦寿是不是清洗了你的记忆？」


    「什么清洗记忆？！我懂你说什么？」超仁怒发冲冠地问。


    「快，快，快，告诉我，怎么找到秦寿？」李想刨根究底，并激动地抓着超仁的肩膀摇。


    「等，等，我真的不懂你说什么，清洗记忆，我不明白！」


    「妈的，我被人清洗记忆啊！到底是谁？黑暗的护法神，告诉我到底是谁？」


    李想声嘶力竭蹲在地上呐喊着，涕泗滂沱，眼泪噗噜噜的滴到地板上。


    超仁鲜少见过李想这种如丧考妣的凄苦模样，但李想的举动更让他丈二金刚摸不着头脑。


    「让我再看清楚一点！」话语毕落，李想又眼疾手快起身环抱着超仁的头颅，额头紧贴着额头。


    两人又开陷昏昏欲睡，纷纷坠入无尽的记忆漩涡……


    ## 「司徒超仁遗失的记忆 2」


    我赤着脚，懒洋洋地漫步在细软的滩地上。


    长海岸岸线明显的向外暴露出许多，潮水如魔术般消退在几百尺的暗色黄土滩地外。


    此刻正值退潮时分，露出了比平时更宽广的海滩。


    除了我之外，就只剩下咸咸的海风，浪声不大的海潮，躺在黄滩上等待晒月亮的贝壳，几只互相追逐的小螃蟹，还有同样在沙滩上活动的路人甲乙丙。


    不过对我而言，其他人事物都不重要，仿佛整个沙滩都是我的私有地。


    我独自站在海岸线边缘，伸了伸懒腰，享受着片刻的张静。


    涨潮时候，我现在所处的位置可是浪高十尺；现在，我踩在几分高的海浪上发呆，时而跟海浪嬉戏，踢着迎面而来的海浪，溅起了浪花，也溅起了以前和家人一起到海边野餐的童年回忆。


    我慢慢沿着海岸缘一路走下去，一边走一边俯身捡起形状各异的海螺贝壳。


    有的时候我会停下脚步，把钟情贝壳贴在耳边，倾听来自海洋的声音。


    耳闻好像传来，来自海底微小生物绵绵不绝的呼吸声，缠绕于耳……


    随后，我在海边弯腰捡起一块石头，扔向大海，只见石头在海面上如蜻蜓点水般的弹跳了十几下，才沉入茫茫大海。


    此刻变动不大的海面很适合练习打水漂。我来到湖边或海边，总是喜欢练习打水漂。我选了一些石头，拇指摩撑着石头许下了愿望，掷向汪洋大海，就数着石头在水面上弹跳的次数。


    我有时也无聊的想，或许可以挑战吉尼斯世界纪录，弹跳超过五十几下，那会有多炫。国小时候爸妈常常取笑我说：「你常常这样打水漂，不知道会让多少鱼儿见不到明天的太阳，多少的鱼儿找不到妈妈喝奶。」


    「也不会那么准啦。最多是受轻伤而已，顶多请假几天就没事了。」哥哥孔明一定帮我插口搭腔笑答。


    这次是我独自出游，而且还是不是跟团旅游。我不知走了什么狗屎运，闲逛旅游展时竟然抽到兰卡威岛的免费来回飞机票，因此我打算游玩兰卡威之后，到吉隆坡玩一趟再回台湾。


    兰卡威岛，位于西马来西亚北部的州属，也就是吉打州。兰卡威岛由几百个大大小小的群岛组成，群岛间流传着一些古老传说，其中，一个最著名的传说是关于玛苏丽公主的诅咒。话说这个貌美的正妹，引起了其婆婆的妒忌，当她丈夫从军后，她的婆婆就控告玛苏丽公主通奸罪。


    古时候，根据当地的法律，通奸的罪名就是死刑。就好像我们中国人以前的通奸，是要浸猪笼那样。


    即使更多的民众相信玛苏丽公主的清白，在围观她的死刑之际，却没有人挺身而出为她求情。


    结果，当刽子手把短剑刺入玛苏丽公主的胸膛，令人震惊的事情发生了：伤口流出不是红色的血，而是白色的血。白色的血，象征她是清白的。


    玛苏丽公主咽下最后一口气前下了一个诅咒，兰卡威岛将会遭遇多灾多难，长达七代。


    直到后来，马来西亚的前首相马哈迪医生开始发展兰卡威，恰好七代过去了，诅咒也已结束。所以今日，兰卡威才能变成如今闻名东南亚的度假胜地，还是免税的购物天堂，巧克力和酒都相当便宜。


    「喂，司徒先生，我们要离开了！」就在这时，一个甜美的嗓音拦截了他的思绪。


    转身看到美丽的女导游正向我招手，我响应：「马上过来！」


    我快步走到女导游跟前，跟着她上了箱型车。


    「明天就要离开这里，往吉隆坡去了，再见！兰卡威。」我依依不舍想着，跟着美丽的女导游上了没冷气的箱型车。


    司徒先生，明天要搭早班船离开兰卡威，接着我们再坐比较舒服、有冷气的箱型车。去吉隆坡途中，我们会经过怡保，届时会带你游览怡保许多洞穴，尝一尝那里的怡保芽菜滑鸡！


    ## 「李想遗失的记忆 2」


    Angelina 是我四个女人当中，我最爱上的那一个——如果不包括我家的小狗美宝也很爱上她的话。


    我十六岁时，同学们都才开始在看 AV 片，对性充满了好奇，彼此讨论如何把妹、或者想着如何把正妹骑上床。


    我静静坐在角落听他们高谈阔论——哼！这班傻瓜、可怜虫，多么的无知……


    印度的诗人、哲学家泰戈尔说：「你不可能只是站在海岸注视着海水，就误以为自己渡过了海洋，你不要让自己耽溺于希望之中。」


    我不是只看 AV 片，和一班男生讨论把正妹骑上床的傻瓜，我不会只耽溺于希望之中，我从没让他们知道，我其实已经和有夫之妇鬼混了六个月。


    她酷似日本女优小泽玛莉亚，因此我和她上床时昵称她为「玛莉亚」，不问可知我的床头与计算机全都是小泽玛莉亚的裸照。


    我静静来到他们的面前，不发一语，又默默地离开，很潇洒的不带走一片云彩。


    我用眼角瞄了瞄他们——你们懂什么；你们知道当我上我的玛莉亚时，多爽多快活吗？嘿嘿……


    我看不起他们这班饭桶。


    如果不是我老爸从台湾过来，我也不会与玛莉亚分开。


    我老爸，哼，据八卦新闻报导，老爸年轻时还试过与有夫之妇有染，老妈子却无耻为他辩解说：「你老爸不同…」


    呸！根本没有什么不同，是你们双重标准！


    在你们眼中，无论我做什么，你们都看不顺眼。


    不要以为我没看《玉周刊》。《玉周刊》就曾经报导过，老妈子本来是有夫之妇，后来是老爸抛弃了即将结婚的未婚妻，将老妈子娶了过来。


    老爸在我十三岁时，从台南移居到马来西亚这鬼地方，赚了第一桶金，还搞响了名头，更被封为当地的「拿督」(这是马来西亚皇室对对国家有贡献者赐予的一个荣誉爵位)。


    之后他索性就把我和老妈子留在这里，每隔四个月就会飞去台湾一趟。


    「拿督李卜」笑说：「在马来西亚，有钱，什么问题都可以解决！？这个谁也知道，其实他只要老妈子羁留在这里，自己好满世界飞去风流快活——不要以为我不知道，只有老妈子傻傻的相信他。


    老妈子又自称她摸一摸老爸就知道老爸在外有没有拈花惹草。不过我才不相信老妈子有什么手道灵能，能摸出老爸有没有鬼混过，全都是骗子的游戏，因为我老爸就是一个算命骗子。


    用钱「解决」问题，不是他教我的吗？


    老爸今年一共问了我十次：「你二十岁了，想过你的出路吗？」


    我很想告诉他，用钱不是可以将问题解决吗？


    何必问我如此烦恼，又不知道如何解决的问题呢；


    玛莉亚与我分手后，我撕破床头小泽玛莉亚的海报，还将计算机内的图片全都删除掉。


    这一切，我没有任何感觉。


    爸妈狠心拆散我们，我却没有失恋与悲痛的感觉。


    我是了不起的英雄，拿得起放得下。


    我眼睁睁看着玛莉亚哭肿双眼离开——嘿嘿，可能玛莉亚也不是因为爱我，而是为了她「身败名裂」而流泪——两天之后，我即把她忘得一干二净了。


    我是多么潇洒的男子汉！


    我实在不明白那些痴男怨女，为什么会因为分手而哭得死去活来？


    真是没用的家伙！哭死哭瞎，也是活该！


    后来，即使老妈子识破了我与冰冰的地下情，我也不怕。


    老妈子狠狠地掴了我一巴掌，我二话不说，拿起刀片往手臂一割，一道三寸长的刀痕。吓得她跪在地上求我不要自残。我用脚「推」倒老妈子，以报复她赏我耳光之仇。


    不过我要跟大家说明，我不是为了冰冰，而是要「教训」这个养我生我的泼辣娘——以后不准你再掌掴我！


    我也不明白，为什么爸妈总是反对我上过的女人。


    要是他们那么清高，哪会有我？！


    我从来没有要求过要来到这个世界，可是爸妈却「硬要」逼我来到这世界。


    我活得不快乐，谁该负责？


    我来讨债应该一点也不过分！


    就是因为爸妈，逼得我一年换一个女人。


    不要以为我不知道，迅迅很可能是老妈子不想再与我有正面冲突而偷偷打发了她——当然这只是我的猜测。照理来说，因为玛莉亚与冰凇事件，迅迅与我的关系，我已经处理得非常小心。


    不过迅迅离开了是不争的事实，总而言之，这次我不会轻易放过 Angelina。


    我不轻易放过她不是我爱她爱得很深，而是我要老爸老妈翻开明天的报纸会吓一跳！


    想到那画面就更过瘾！


    我要爸妈从此之后不再干涉我的私事，这是一个教训。


    我一边回想着往事一边继续踩着油门，将时速飙到 160……


    ## 「第五章」


    李想迅速惊醒，一手推开超仁，一脚踹向他那日益膨胀的大肚腩。


    「妈的死胖子，你究竟看到什么？我告诉你，我不是这样的人，那个人不是我。即使是我，我也是伪装的！」


    超仁抚摸着肚子，一脸无辜地说：「师兄，我不是有意要看的，是你逼我看到的，我又不是有心的。请你原谅我，可以的话，我可以忘记它！」


    李想在地上打滚，鬼哭狼嚎：


    「妈的，为什么会这样？为什么会这样，到底是谁做的？为什么我没看过这段回忆，为什么？我不是记忆图片里面那种人，我是很多人崇拜的李想菩萨啊！」超仁被李想的举动吓得蜷缩在床角，嘴唇发白颤抖抖着，心脏就快要被恐惧撑爆。「不！


    我要冷静下来，我要冷静下来!」李想摇摇晃晃跌坐在地上。


    「等等！本来我只是想入侵你的记忆，为什么我会跟你的记忆交错在一起，让我看到你的记忆，你又看到我的记忆呢？」


    李想突然变了个人似的，刚才在地上打滚与鬼哭狼嚎，好像从没发生过一样。


    接着李想又像变了另一个人，将刚想到的疑问又抛诸脑后，他竟然盘腿而坐，慢慢闭起双目。


    时间一分一秒过去，超仁犹豫着要不要趁着这段时间离开，他小心翼翼地爬离床铺，想要不动声色蹑手蹑脚的溜出去。


    但他下床才走没几步，李想突然睁大小虎目—「我看到了，我看到我的记忆图片是有烧毁的迹象……」


    李想转头怒瞪着超仁，用食指指着他的鼻子:「告诉我，你被遗忘的记忆图片有什么不同，是不是那个秦寿将你的记忆清除？」


    「李想菩萨，我是真的不懂，也不知道!」超仁以几乎求饶的声音哀求着李想。


    「好，我再看一遍!」说罢就双手环抱着超仁的头颅，额头贴额头。


    奇怪的是这次两人并没有昏昏入睡，只有李想一人像昏迷了一样。


    李想慢慢醒过来，缓缓睁开双眼，推开超仁，自顾自说:「我明白了，你的记忆图片是被压沉在脑海而不是被烧毁，很可能就是那个什么秦寿干的好事。」


    超仁不敢搭腔，他担心又不知道说了什么而引起李想的神经病发作。


    「好吧，我帮你报仇，你替我找秦寿出来谈判!」李想没头没脑说出这句话。


    「我……我……不知道该从哪里找秦寿？」


    超仁心中难免不认同李想的想法，他不明白找秦寿有什么好谈判，但又不敢作声，心中咕哝骂了一句:「真是神经病的李想。」


    「就这样决定吧！我们明天在凶时，一起发动诅咒黎敬平的亲人，我会用『乌鸦』的身份，电邮给所有玄门正宗的大护法，索要解除消灾金。呵呵，他们都是大富豪、政界人物和黑道人物，告诉他们，黎敬平的家人会替他承受灾难！


    这是一个警告，等到黎敬平的家人遭受了乌鸦的无情诅咒之后，乌鸦就会再跟黎敬平要解除消灾金，如果黎敬平敢不给的话，嘿嘿！他也肯定惨死-」


    其宾，这些话李想已经对超仁重复了多次，而且李想早已经将电邮寄了出去。


    「那，你不是说……」超仁还没说完，被李想打断了。


    「你放心，我会帮你报仇，我的意思是说，即使收到了消灾解难金，一个星期后，黎敬平一样要死！」李想的脸紧贴着超仁，超仁打了一个哆嗦。


    ## 「第六章」


    超仁从脏兮兮的水沟爬出来，匿藏在水沟已经足足有半天光阴，累得他蔫头耷脑。


    他整顿衣衫时，看着住在天桥底下那囊空如洗的痴呆老人，还是多年如一日，穿着那件有数十块不同颜色补丁的汗衫。


    这一次，老人用睡佛的姿势侧躺着，眯着眼睛对胖子笑呵呵。


    「年轻人不要做坏事，要好好利用你的能力哦！」


    超仁愣了一下，身体僵硬，他全身冒出冷汗。


    从小到大，他都没见过天桥下的痴呆老人洗澡，也不见他乞食。超仁认识痴呆老人十多年了，试过近距离与痴呆老人接触，却从未觉得痴呆老人身上发出臭味。痴呆老人是乞丐，却从不乞食，只是跟人要白开水喝。


    印象中的丐帮总是面黄肌瘦，鸠形鹄面，昏昏欲睡无精打采。


    可是，眼前这个鹤发童颜的痴呆老人却是红光满面，岁月似乎没有在他脸上留下痕迹，而且身材发福，中气十足，有别于一般的伸手将军。


    难道，老人是吸血鬼？或是千年老妖？


