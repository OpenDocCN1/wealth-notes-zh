    随着他的咒语愈念愈紧凑，他冥想中的火势也愈来愈旺。


    从台湾蔓延至亚洲半球，接着整个地球，烧出宇宙之外，与太阳结合。


    他还是站在圈圈之内，突然他高举右掌向天摇晃摆动着，左手垂直向地摇晃，口中的声音也喊着：「噢，噢，噢，噢，噢⋯⋯YES!」，右掌以倾斜45度劈下。


