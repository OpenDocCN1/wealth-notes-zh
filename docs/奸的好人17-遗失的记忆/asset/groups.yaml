    # 第四话


    「哇！超厮的！一个男人，就是要这样子才叫男子汉啊！」司徒超仁一边赞叹着，一边幻想着自己就是书中的角色「安德鲁•罗文中尉」。


    「超仁啊，放下你的书吧！饭煮好了，可以吃饭了！」妈妈打开房门探头进来叫道。


    「……」


    「喂！你又在看这种没用的书！真是有够浪费时间的，有这种美国时间，还不去好好念念学校的课本比较实在。」他的妈妈一如往常的唠唠叨叨。


    「啰咿你不了解啦！跟你解释你也不懂啦！」司徒不耐烦的回答。


    不过，也由于二十四节令鼓。司徒超仁就顺手把书往旁边一扔，出去吃香喷喷的晚饭了。


    「算了，先不要想太多了。现在最重要的是，星期六是权谋大师李民杰和搭讪教主郑匡宇的新书发表会，我一定要去会见他们两位，和他们面对面的谈话和握手。


    有句话不是说明：「要成功就必须和成功者在一起」，我怎么会可以放过这种天大的好机会呢！」超仁深知他不成功，因为他没有下定决心；他还不成功，因为他还没有下定决心。所以这一次，他会抱着「一定要十非要不可」的决心，到会场会见成功人士。


    「对了，还要和他们两位照相，回家后贴在天花板上，这样子我入睡前都可以看到他们两位，一边幻想着这些成功者面对面给我鼓励—让我的人生愈来愈美好！《秘密》这本书不是说明？要想象得愈真实就愈好，因为潜意识搞不清楚真实与幻想的差别……」


    司徒一边幻想一边窃笑，连饭粒都从嘴角掉了出来，散落在桌子和他的身上，连地上也有。在一旁吃饭的妈妈，看得眼如铜铃，也不晓得这个儿子是不是有什么毛病。


    想着想着，超仁不由得闭起双眼，头靠在桌子的棱角上，发出呼噜呼噜的鼾声……妈妈轻轻把他推醒：「懒猪，快醒醒，连吃着饭也会睡着，真是的！你已经老大不小啦，怎么还……」妈妈摇摇头，用轻度的语气说话，默默地收拾着桌上的残羹剩饭。


    如果将来我有孩子，我一定不会看不起自己的孩子！


    超仁觉得自己永远是扮演输家的角色，所以大家都欺负他。'
