    终于，她精神崩溃了，她以凄切的哭声宣泄压抑已久的恐惧与惊慌。


    # 「第二章」


    # 「郭美丽的记忆」


    孔明与美丽两人肩并肩，慢慢的走过斑马线。


    因为红绿灯故障了，孔明更加小心翼翼，拉着美丽的左手腕。


    「好有特色的建筑物啊！」美丽停下脚步仰着头，微微张开小嘴看着这栋建筑。


    「这栋建筑是台湾国立博物馆，样式采仿文艺复兴时期古希腊多力克式，中央圆顶塔高近的公尺，气势磅砖不凡，是整幢建筑的视觉焦点喔。」


    孔明搭着美丽的肩膀细说从头。


    「同性恋团体曾在这里的露天音乐台举办『彩虹、同志、梦公园』活动，藉由集体现身策略，让许多同性恋者可以在阳光的照耀下携手公开庆祝自己的性别认同，可能因为这样，久而久之这座公园就成为同性恋者的聚集地吧！」孔明卖弄文采的娓娓道来。


    美丽很俏皮问着孔明：当时有没有结伴参加此活动啊！孔明也故意诙谐回答：「走！我带你去参观我和当时男友参加的音乐台。」


    今天人烟稀少，可能快下雨了吧，天空都阴沉下来了，眼看每个路过公园的行人不再逗留，草草欣赏一番，纷纷迅速离开。


    「我也想赶快离开，我们又没带伞。」美丽拉着孔明衣袖，希望赶快离开。


    这条路必须经过某座公园，而这座公园仿佛是座废弃多年的荒地，野草已经长高到人的小腿以上。


    公园内的座椅也因长年的风风雨雨侵蚀，感觉像是只要一碰就会骨折一样崩塌，所以许多人如能选择不经此路，就会尽量绕道而行。


    「我的手腕有点痛…你怎么啦，有心事吗？」美丽小声地问。


    「对不起，对不起，弄痛了你……」孔明边走边道歉，他当下心神不宁，左顾'
  - '[PAGE 95]


    右盼，牵着美丽的手腕往前走着。


    走着，走着，孔明深感这座公园毫无人气，感觉可能是罪案的黑区，于是加快脚步。


    在两人的右前方，有一座长条的座椅，上面坐着三个年轻人，翘着二郎腿，三人坐姿就像三堆烂泥一样在长椅上坐着、躺着，嘴巴往上撅起，吐出一圈又一圈的烟雾。


    「妈的，早知道就绕道而行。」


    孔明心中忐忑不安，眼瞄着在他右方的女友，穿着美丽的紧身吊带衣衫，钩勒出丰满又明显的双峰线条，还露出了一半深邃的乳沟。


    孔明边想边往前走，美丽也下意识用右手抓着孔明的手臂，双乳也贴近了孔明，在他的手臂上轻轻摩撩。


    「小姐，穿得很露喔！奶子很挺喔，摸一下啦！」其中一名地痞双手靠拢嘴边淫荡地喊着，两旁的兄弟也哈哈大笑。孔明瞪大眼睛朝着他们看。


    「干你娘勒！再看！再看啊，来啊！」其中一名地痞忽然跳起来，像发现入侵者的狗一样，头抬得老高，侧着身，以鄙视的眼神盯着孔明叫嚣。


    孔明绕到美丽的右方，气势汹汹的直视着对方。


    但孔明忘记，对方不只一人，自己寡不敌众，肯定左支右绌！硬逞强只会是蚍蜉撼大树。


    「叩！」好大一声清脆声响，犹如铁锤敲开西瓜的声感，另外一人当下拿着机车大锁，明日张胆从孔明后脑勺狠狠的甩过。


    孔明连惨叫也来不及，当场双腿下跪，双手抱着后脑，只见他两手的手指不断的用力抓着头皮，指缝间有浓稠的液体流下，他眼睛用力紧缩着没办法睁开。


    「流血了，救命啊！流血了，不要再打了，不要再打了，求求你们……」美丽惊慌失措大叫。


    美丽俯身要去搀扶孔明时，其中一个地痞用迅雷不及掩耳的速度，右脚以踢自由球的脚法朝着孔明的下颚，不留情面狠狠的踢下去。


    孔明登时翻倒在地上，动也不动了。


    □


    「不！不要！不要再打了，不……」'
  - '[PAGE 96]


    神情颓然的郭美丽像回到现场一样，歇斯底里的呼喊着。


    「大嫂……」超仁识趣的叫了郭美丽一声。虽然郭美丽还没有嫁进司徙家，可是超仁看得出孔明一心想要娶这个女人，原因就是以前孔明交往过的历任女友，没有一个像她超过三个月的。


