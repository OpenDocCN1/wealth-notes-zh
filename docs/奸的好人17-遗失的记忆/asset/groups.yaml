    月，一颗浅绿色的地球，还有几颗被光环环绕，像戴着一顶漂亮大草帽的粉红色卫星，在湖面组成小型的银河系，无与伦比的绝美瑰丽。


    微风飒然而至，湖面上咯咯漾起阵阵荧光波纹，湖里水草发出荧光色的光泽。


    同时还有几尾六块腹肌棱角分明的壮实男人鱼，全身熠熠光彩，在湖里妩媚地游着泳，翘翘的屁股弧线深深吸引她的眼球。


    「道造，放松你的头、你的身体，你的脚吧。道造啊，尽情拥抱大地之母吧！」魅音如是耳语。


    归真返璞的胡静怡二话不说，吸了一口气，双膝一弯一伸，人已经跳上半空中，顺着瀑布的水势直冲而下。


    她双手合掌直伸于头顶上，以最优美的跳水姿势头下脚上，就在接近湖面时，她又摊开双手拥抱大地之母。


    「啊……啊……大地之母，道道来咯！快拥抱道造吧！」


    「砰！」


    发出沉闷的碰撞声响，胡静怡的头颅应声碎裂，脑浆四溢血肉模糊，浓稠的鲜血流了满街。


    街道上的路人连影子也没看清楚，瞬间只看到一个挺直的身子，头下脚上直冲柏油路面。那人身子在剧烈撞击后微微弹起，挣扎蠕动几下就静了下来，已是返魂乏术。「跳楼啊！有人跳楼啊！快叫救护车！死人啦！」围观的民众越来越多，好奇心果然杀死猫。


    李想戴着洛杉矶奇奇队鸭舌帽，隐伏在转弯角处，露出满意的阴鸰微笑，他咕哝低声，冷冷地说：


    「妈的，你这死八婆，竟然花了我两个星期的时间来诅咒你。黎敏平，这是第一个警告，第二个就轮到你的儿子。我已经他妈的诅咒了胡静怡与你的孩子两个星期了，要是你死了孩子之后，乌鸦还看不到你的忏悔信，也还收不到你的祈福钱，第三个人一定是你！」


