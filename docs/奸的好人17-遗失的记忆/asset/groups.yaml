    当李想惊觉自己说出这句话时，他又开始懊恼起来，又自言自语：


    「妈的，二叔是谁？为什么我完全记不起老爸说的这件事？二叔到底是谁？为什么老爸会说帮我报仇，我脸上的疤痕真的是二叔留下的吗？我的头又好多痛啊！」


    疑惑的噩梦总是层见叠出，一次又一次把李想推向崩溃的悬崖边，摇摇欲坠。


    「造飞机、造飞机……


    蹲下去、蹲下……


    蹲下去、蹲下……」


    「我怎么对这首歌一点印象都没有？」


    李想不断用手捶着脑勺，希望能把这段回忆敲出来，可惜，这首歌根本不在内存的档案夹里。


    司徒彪仁从床上坐了起来，心中极度惊慌，浑身发抖，简直快尿裤子了。


    「怎么搞的、怎么搞的？为什么我会梦到那怪物的事情？是真的吗？李卜真的是这样训练他？而他二叔又是怎样的人？他的大小眼是在四岁就受到残害的吗？」


    「不，我还是不动声色比较好，否则让李想这怪物知道我梦过他的记忆图片，我又有得难受了！」彪仁计谋着。


    # 第二话


    不知何故，超仁竟然误闯进李想遗失的记忆碎片。醒来后他心神恍惚，再也无法睡下去，于是起床开了计算机。


    他以「乌鸦」的身份登上了 gmail，一看之下，惊讶得嘴巴像篮球框一样张大，一时之间，他发不出声音……


    他心中乐透了，想马上拿起电话与李想分享这则喜讯，奈何电话从拨通直至进入语音信箱，李想并没有接听。


    「南无阿弥陀佛夜，哆他伽多夜，哆地夜他。阿弥陀佛，哆他耶哆，悉耽婆毗，阿弥陀佛哆，毗迦兰帝，阿弥陀佛哆，毗迦兰多…」


    电话传来胡静怡的歌声，超仁不禁鸡皮疙瘩，冷汗涔涔。


    哀怨的手机铃声，像是一只躲藏在手机里死不瞑目、永不超生的厉鬼怨灵所吟唱的悲歌。


    「他奶奶的，我一定要换过铃声。不然听到她的歌声就心里发毛。」超仁心中乱腾腾的咕哝着，拿起电话接听，电话另一端传来野兽发情交配不成般的咆哮。


    「死胖子，为什么黎敬平死掉了，你有没有诅咒他？」李想百思不解的质问。


    「我……我……我没有！我今天早上本来想告诉你，不过被你打断了……」超仁战战兢兢，如临深渊，如履薄冰，决定死口不认，担心被神经接近失常的李想反咬一口。


    「为什么你不提一提我，不要这么急杀死他的孩子，解决了黎敬平的情妇胡静怡已经是最大的教训……」忧心如焚的李想就像一只鲁莽的冒死鬼。


    「李想菩萨，我只是按照您的吩咐，只对胡静怡和他的孩子诅咒，你说过要我们两个人一起发出诅咒，我真的只诅咒了这两个人，真的没有骗你。」


    超仁看似虚心地说着，说这番话时，超仁刻意提高声调，加快讲话的速度，想要强化李想对自己的信任。


    真相是：在水沟中，司徒超仁只是满怀怨恨地诅咒着令他毕生感受奇耻大辱的黎敬平，他根本忘了对胡静怡与黎敬平的孩子下诅咒——因此超仁心如肚明，能够咒死黎敬平的是自己，而咒死胡静怡与黎敬平孩子的，是李想。


    等等……


    他们俩从没想过，为何实验多次的诅咒修炼，只有这次的力量变得极为强大？难道真的是无缘无故，一天内就增强了一个甲子的功力？


    「李想菩萨，您神力盖世，英明神武，您一出手『乌鸦行动』就马到成功了，我刚才打开电邮，收到将近一百多封忏悔信，师父回来之后，一定夸奖您。」


    超仁知道，每个要「当神」的「人」，多少都有自恋的欲望，区别仅是程度的轻重，李想当然也不例外。


    他只需轻轻称赞李想的「神」，李想就会得意忘形，注意力分散，甚至忘记了原本打电话过来的目的。


    果真，妄自尊大的李想在电话另一端开始不断吹嘘，他的诅咒法有如何如何的厉害，他说他的黑暗守护神还告诉他，迟些他能遥控他人的脑部运作……


    司徒超仁根本无心听他不确实的吹嘘。他多次跟李想近距离接触，每当李想开始自恋吹嘘时，呼吸系统一定产生变化。


    司徒超仁读过一本研究大脑的书籍，书中描述一位妇女，脑内扣带回长了一个肿瘤，使得她变成超级自恋狂。


    超仁一向以来都认定李想的扣带回有病，而他心中最希望的是李想长了一个恶性肿瘤，早点死了，那他就不必再遭受李想无理的苛责与辱打。


    他表面上一脑态唯唯诺诺，昧着良心应和着李想滔滔不绝的「神力狂想曲」，心中却不耐烦地不断咒骂着李想：「神经病，你是唱完了没有？」


    好不容易，李想终于挂断电话。超仁懒洋洋躺在床上寻思：


    「哇！不知何故？一直以来我们的咒术大法都没这么厉害，不知这回走什么狗屎运，还是天落红雨马生角，突然间我们的功力暴升。要是师父在多好，起码我们有个有头脑的人，可以领导我们来未来的走向。」


    任何人第一次获得「权力」，甚至知道要取走一个人的生命或荣辱只需「一句话」时，都会开始变成超级自恋狂。


    超仁想着想着，回想当年还有谁欺负过他，因为今天的超仁已经不是昔日的超仁了，他不会再让任何人欺负自己。


    所有曾经欺负过他的狗杂种，都要承受应有的惩罚！


    于是，他开始部署着下一步，想要诅咒的对象……


    「但是，我就算诅咒那些有钱人死，他们即使有投保、买保险，保险金的受益人也不会是我！那也没轶啊！若是那些有钱人，我们诅咒他的家人死了，但他又像黎敬平一样自杀了，那么祈福金从哪里来呢？」


    茫无头绪的超仁一边搔着毛茸茸腋下，一边进行推理。


    「若要领保险金，不如诅咒我的养父养母，起码爸妈有投保险金，难道要杀爸妈才行？」


    好像有点道理。


    「嘻嘻，反正他们又不是我的亲生父母，死了也不关我的事，呵呵呵呵。」


    但超仁又心念一转：


    「不对！爸妈那么疼孔明，即使要死，也是孔明先死！」


    随着司徒超仁胸部起伏，他心中微傲的血色红光亮了起来，而超人浑然不觉，他愈想愈入神，嘴角泛起充满邪意的狞笑。


    超仁看了看手机显示的时间，又到了晚上九点多，被李想一番「神力狂想曲」自恋吹嘘折腾了许久。他又在床上胡思乱想了一阵，心神游走，突然想到：现在司徒孔明一定又和郭美丽鬼混了，哥有这未婚妻，不夭夭上她我切掉！


    他回到计算机前，猥琐笑了一笑，将一个属于司徒孔明与郭美丽的秘密档案打开——


    「哈，孔明自以为高明，用 RSA 密码系统锁住自己的档案，殊不知我是解码高手，呵呵。『有名大站』能流出那么多正妹艳照，还不都是我的杰作？吼吼！」


    档案里当然全是郭美丽与司徒孔明的性爱自拍。


    「哥与美丽都没汲取爱迪生陈的教训，那么喜欢自拍性爱照片。」


    超仁用剪裁技术，将司徒孔明的部分全部删除，只留存郭美丽的裸体照片。


    「美丽你好正啊，是我的菜啊！你千万不要做我的嫂子，千万不要跟着司徒孔明，每次看到司徒孔明抱住你，我就妒火中烧。不知道孔明上了你多少次？现在若是孔明被抢匪打死了，就没有人再跟我争你啦。」


    司徒超仁再次露出猥琐劣笑，他胸口渐渐隆起，微微发出红光。他缓缓走出房间，又骑着他的极速小绵羊，前往天桥底下的水沟基地。


    # 第四章


    深夜凌晨，超仁不动声色的从水沟爬了出来。


    今晚他没有看到痴呆老人，于是骑着他的极速小绵羊朝西门町方向驶去。


    每当超仁压力大时，他就会带着一张千元大钞，骑着他的机车，直奔西门町大吃大喝。


    超仁骑在中华路上时，虽然中华路的路面很宽，但由于车流量实在太大，所以他总觉得很窄而且空气也不好。但是为了吃美食，再累也值得。


    首先，第一站他会去西门町最有名的卤味——「老天禄」，去吃些鸭舌、鸭翅、鸡爪、鸡翅、豆干……等等老天禄招牌菜，这些可是国内外游客或大明星来台指定的美食佳肴。


    之后，他便和一群被他称为「过着美国时间的羊群」一起排着队、挥霍青春，去买那个号称全台独具特色「蚵仔面线站着吃」的阿宗面线。卤大肠、面线、香菜、蒜泥、黑醋所交织而成的面线羹汤，色香味俱全，香飘十里，实在令人垂涎三尺。饕客们虽然被罚站着吃，也依然甘之如饴，大块朵颐之后还意犹未尽再三回味。


    吃到现在，肚子也有了一点饱胀感，所以该吃点冰品了，于是超仁会跑往下一站「成都杨桃冰」。这是一间五十年以上老店，各式各样的杨桃冰凉饮品是绝佳消暑圣品，让人在夏日解渴透心凉，也有菠萝、李子等等古早风味。


    ![](img/237675b87ee3b5bddaa78c410bf9f326_77_0.png)


    超仁吃饱喝足了，打算回家，发动摩托车引擎，油门一踩，急驶而去。


    这时，他听到「轰隆！轰隆轰隆！」的声音，由远至近……


    是车子引擎的声音。


    转弯道上，一道蓝白色的亮光逐渐接近，一辆黄色跑车晃动着以S型在马路上蛇行，地上发出摩擦巨响，路人都被吸引了目光。


    好巧不巧的是，这时超仁也从路边的反射镜中，看到了那一道亮光，愈来愈向他逼近。


    「天啊！我和你无冤无仇，千万不要撞上我，千万不要撞上我……」


    超仁只剩下二十秒的时间——


    千钧一发的瞬间，超仁两眼睁睁前方，神色大变，猛踩油门往前冲冲冲。


    「咻！」一声巨响！


    超仁从后被撞个正着，他感觉自己翻了数个筋斗，脑袋里空白一片，眼里景物像照相机快门一样闪过。


    黄色的车头灯照射着他，太刺眼了，他不由得闭上眼睛，眼前金星乱舞，他觉得自己像断了线的风筝，天空、白云、树、街灯，还有四周的建筑，都急剧的旋转、扭曲、晃动着，仿佛天地万物都在跳着霹雳舞……


    此时，超仁已经无法动弹，就这样昏迷过去……


    # 第五章


    # 司徒超仁的幻觉


    超仁感到头脑昏眩，好像旋转个不停，眼前一片黑暗，伸手不见五指，能见度零。


    突然，眼前又变亮了，于是他看了看四周，发现自己正站在马路边，而李想则站在面前，歪着脸看着自己。


    「我怎么会在这里？」超仁丢了一个问题给李想，但还是觉得很不不可思议。超仁不禁怀疑自己的眼睛，就在讲话的刹那间……


    「碰！」


    超仁看到，眼前有一个和自己毫无二致的胖子，被三口砂石车从左边给撞飞了出去！至少飞出十多米之远，才落地。


    「噗！……」他口喷鲜血，要死不死，奄奄一息躺在血泊当中，全身抽搐着颤抖。


    而李想就站在他的面前看着他，脸上露出了奸笑。


    「救我……李想菩萨…拜托你……救救我……」


    司徒超仁用剩下的最后一口气央求着。


    虽然超仁求着李想，可是李想却也无法移动身子。


    这时他表情被定格，身子僵硬，似乎被无形的力量钉在地上一样，一动也不动。


    超仁眼前的景物开始移动，慢慢的往后退……


    「救我……」超仁伸出一只满是鲜血的手。


    接着，沙石车当场从他身上压了过去。


    「啊啊啊啊啊！」


    超仁声嘶力竭地痛苦尖叫，但是好像所有人都听不到。


    接着就看到砂石车来来回回连续碾平他的身体，鲜血、肠子、内脏……全都喷了出来，宛如变成了涂满鲜血酱汁的「超人牌」人肉肉干。


    他整个人被压到只剩下前半截，下半身则已经血肉模糊。


    「救……我……」


    超仁用两只鲜血淋漓的手，拖着他那不成人形的半截身体，慢慢的爬向李想，而背后拖着一条长长的血痕。


    但是，那种极度剧烈的疼痛，痛得他爬到一半就不支倒下了，再也爬不动了……


    他看着李想缓缓走到他半截的身体边，李想做出跳水的姿态，以完美的姿势，扑咚一声，笔直插入超仁的胸部，随即消失不见……


    突然，超仁眼前又变得一片黑暗……


    司徒貂蝉听完电话，脸色大变，手不停地颤抖着——不是真的，这不是真的！


    她拍打自己的脸颊，摇一摇头部，打了一个冷颤——我不是在做恶梦吧！


    电话又再响起，她以颤抖的手拿起听筒——


    「天啊！」


    司徒貂蝉双手捂着脸啜泣不已。


    父亲司徒文武温柔地抚摸她的双肩：「貂蝉，发生了什么事？告诉爸……」


    她流泪满脸，缓缓抬起头，眼前的司徒文武像是陡然膨胀成巨大无比的成蛋超人，像是唯一可以依靠与拿主意的英雄。但事实上，发生这类剧变，即使这个成蛋超人也是个泥足巨人。


    但她需要投入父亲的怀里，至少这样可以带给她安全感。


    貂蝉哭着把脸埋进父亲胸前，闻到父亲口腔里的烟味，还有腋下发出霉气十足的狐臭味。平时她会觉得很恶心，但今晚却让她感觉无比的安心……


    「貂蝉，发生了什么事，快告诉爹……」司徒文武被女儿反常的举动吓了一跳。


    「爸，二哥在中华路，被车撞倒，送往医院了……大哥，大哥他被流氓打伤，在急诊室急救……」司徒貂蝉有一点语无伦次，从泪腺飘出的水份已经超出了负荷。


    「这……这……」司徒文武紧张得说不出话来。


    「什么？什么？」司徒文武的老婆林美凤一听见，手中正要拿去洗的脏衣服全掉在地上了。她惊骇之下，嘴巴无法合拢，好像魂不附体般发晕。


    「他们在哪家医院？」还是司徒文武第一时间清醒过来。


    「台北市和平医院。两人都在同一家医院。」未回过神来的司徒貂蝉机械地说。


    司徒文武左手牵着娇妻，右手牵着女儿：「快！我们快赶到医院去。」


    > 亚拉伯罕·马洛斯有一句名言：「如果一个人只精于铁锤，那么所有的问题到他手上，都会变成铁钉。」


    李想在摄影棚前，品味着这句充满哲理的话。


    「对于一个自称是众生的信仰依托、世人宇宙坐标的中心和原点、无可被取代的救世主、即将接班成为『玄门正宗』的掌门人，还有要称霸全世界风水五味九五之尊的我，经过三天前凌晨黎敬平与胡静怡失心疯的惨死，我的自我是唯一性和独特性渐渐显现，现在已经彰明较著。」


    戴着「宇宙教主光环」的李想继续陶醉在自己的幻想中，连他的手机铃声响了数次，也全无知觉；


    「现在的我，所有的信息一旦被我校，都只自动连接到处理风水与玄学的右脑。我还能像神一样随自己的喜好而操控他人的祸福，我可以强烈地感觉到，我已经逐渐迈向成为闻名世界、无所不能、肉身菩萨活佛的高峰！」


    李想任由化妆师为他补粉，他嘴角微微翘起。


    这是李想临时接到的紧急通告。经过《芭蕉日报》绘声绘影渲染报导，说是敌对政党的人对黎敬平与胡静怡下诅咒与降头，而也不知道那个高官政要接受过乌鸦

