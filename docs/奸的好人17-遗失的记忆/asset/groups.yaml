    我不是精神分裂患者，我不是南怀瑾预测二十一世纪最多精神病患者中一位。不要以为我老妈子有产后忧郁症，就等于我有精神病。


    虽然我在小学想过自杀，也玩过上吊自杀的死亡游戏，但我不忧郁症病人。我只是斯巴达的英雄，用我的身体做武器，教训自己的父母。


