  md: '

    但看秦寿的样子，他又好像有这份功力！


    李想啊！李想，难道秦寿有没有这份功力会看样子看得出来吗？


    不！不！不！


    秦寿采取的是将超人的创伤记忆压至海马回深层之中，如果不是我跳进螺旋光游至最深处，也找不到他这片记忆图片……


    李想愈想愈乱，在床上鲤鱼翻滚着呐喊：「呜呜……呜呜……我的头脑很乱，黑暗的守护神，快死出来，出来跟我说话！」


    「嗡，咕噜李想悉地哼……」


    李想的手机铃声响起。他接听过来：「死胖子，现在打电话来干嘛？」


    「李想，你看了电视新闻报导吗？」超仁在电话另一端以急速的口气说话。


    「哼！看，看个狗屁！」李想嗤之以鼻。


    「李想，新闻标题为仁义党候选主席黎敏平立法委员血洗校园，连亲生儿子都难逃一死！黎敏平今天早上发疯了，一丝不挂的拿着猎枪狂奔，见人就杀，他甚至裸奔到他孩子的学校，射杀了他自己的孩子还有几个小朋友……」超仁一口气叙述这件惊天动地的头条大新闻。


    李想得意的回答：


    「对！我先走到胡静怡的公寓下，对准她的窗口诅咒她，而后我看到她从天台跳了下来。虽然我用了两个星期的时间，其实我不是没有能力，而是要用两个了这个圆满数字，来完成第一次惊天动地的乌鸦诅咒。所以我很满意自己的诅咒。


    看到胡静怡死后，我便开车到黎敏平的住所附近，对他的孩子也进行诅咒。我只是随便诅咒黎敏平的孩子，当然这个随便诅咒我也是用两个了这个圆满时间来完成，不过他的孩子我是随便诅咒的啦，那孩子是不是死得很惨？」


    虽然李想不知道黎敏平的死讯，也不知道黎敏平的幻觉，但他一心想独揽所有的功劳，故先一步抢白告诉超仁。


    超仁装作恍然大悟：「难怪，新闻报导说，胡静怡坠楼自杀惨死！」


    接着他以感恩的口气继续说：


    「这超屌耶！真的宛如两发无法抵挡，直透云霄的超能量全垒打！谢谢你，李想菩萨！如果单凭我在水沟的『金刚无敌大便法』，相信效果也不可能那么显著！」


    「喂！你这个死超仁，他妈的！你不是答应要帮我找秦寿吗？你敢给我开空头支票，我就发功诅咒你有吃不完的大便！你现在可见识过我的诅咒功夫了吧！」李想顿时又变成青面獠牙。


    「我……我不知道他在哪里……不，我会想办法打听，我会想办法。」超仁踌躇几秒，他不想激怒李想。


