    还是老掉牙的邪不能胜正，天使获得满堂彩。经过一番内心的挣扎后，我终于伸出友谊之手，直接拿起了眼前的酒杯。「黎学长，我虽然不会喝酒，但是我还是必须要谢谢学长的照顾。敬你的！」


    干下了第二杯后，我一边和敬平学长有一搭没一搭的大聊特聊，一边喝酒。


    彼此一直以来紧紧封闭的心房，也随着给俩人坦诚相见而打开了，大家言归於好，把过去的恩恩怨怨都一笔抹杀。


    就在喝了几杯「狗尿」下肚以后，我开始感到头有点昏昏沉沉的。


    不过也在酒精的催化之下，醉醺醺的他如同吃了豹子胆，把心中长久以来所累积的怨气一口气给吐了出来：


    「敬平学长，你知道吗？我本来觉得当兵是一件简单的事，可是因为你的出现，所以我常常觉得生活好痛苦。为什么你会把我当肉中刺眼中钉，每次都会找机会刁难我，明明我就没有做错什么，可是你就是不放过我！你说！你为什么要这么做？！害我常常在站哨时，都会默默的看著已经装有实弹的
    65K2 步枪，有时真的觉得干脆自我了断算了…你说啊！为什么要找我麻烦：为什么？」我一边发着酒疯一边颠颠晃晃的说着。


    「超仁！其实我对你这么凶是有原因的！」


    接近酩酊大醉的黎敬平拿着酒杯，眼睛看着酒杯，轻轻的摇晃着杯里的酒……


    「其实我是为了你好，我是为了『教导』你！让你快快成长！」敬平静醉的吐出这句话。'
  md: '

    图片都啰啰嗦嗦才切入正题，应该直接进入轴心戏才对。


    超仁嚎泣，打着哆嗦，他咬牙切齿，全身颤抖……


    李想这时再度缓缓地睁开他自吹自擂看穿三界九地二十八天的左眼，嘴角露出淫邪的笑意，又睁开他号称窥破十八层地狱的右眼。他像胜利者般慢慢站起身子，双手插腰问超仁：“你，到底要不要报仇？”


    超仁泪流满面，点点头，这一次，这对欢喜冤家难得的达成共识。


    超仁的秘密，从两人心电感应的那一刻起已经不只属于他。


    “嗡咕噜李想悉地哗……其实我可以帮你……”


    李想走到超仁的面前，蹲了下来。


    “……条件是，乌鸦计划成功之后，老爸会给你 100 万美金，我要拿你这 100 万美金！”李想在超人耳边轻声细语道：“给我 100 万美金，不然，你就等着天天在梦中反复回忆着你这段被遗忘的创伤，这是你自找的！”


    “但那 100 万美金是师父将来给我的酬劳。李想大哥，不，不，李想菩萨，况且现在我们的乌鸦计划从没有成功过……没有成功过，等于师父还没有给过我任何酬劳……”超仁难为情地说。


    “死胖子，你听好，我只是拿回属于我们李家的东西。况且，乌鸦计划一定会成功，因为诅咒成功的人会是我是我，你只是强化我的诅咒。我没跟你现在要，我是说当老爸给你，你就要给我！嘿嘿！”


    “不可能的！你拿了师父给我的钱，我以后怎么办？难道要我一辈子都躲在脏水沟内想大便吗？难道你要我一点酬劳都没吗？我已经 29 岁了，到今天什么都没有……”


    “你懂神棍是什么意思吗？就是有神通的光棍。有神通的光棍你又知道是什么意思吗？就是有神通的流氓痞子啰！”李想双手插腰，很满意自己的说明。


    “胖子，你一点都不像超人，我才是超人，拜托你不要整天唱《超人不会飞》，恶不恶心啊你？你才真的不会飞！你诅咒的力量要发挥出来就得躲进水沟发功，要是没有水沟呢？怎么办？吃西北风吗？哈哈哈换成是我发功的话……”李想紧闭双眼竖起右掌摇晃着。


    “李想菩萨，你是师父的儿子，你有很多金山银山，十辈子也花不完。我可跟你不一样，既没有理财知识，也没有专业技能，没人脉，也没社会地位，也没……”


    面对满嘴喷粪的李想，超仁不断的否定自己，认为自己真的无能无力，李想冷笑着看他，超仁愈说愈无力。


    于是他停止了他的抱怨，并低着头沉浸在深深的低潮之中。


    若是每天都要梦见这段已经遗忘了的惨痛回忆，如果没法子报仇，那种精神折磨一定会让人发疯。


    超仁看穿了李想的意图，但也希望跟李想合作，一来可以报仇，二来即使将所有的功劳送给李想也无所谓——让李想干出一件大事给师父李卜看。由他做老大接替乌鸦行动，而超仁就得跟着李想做他的小弟——不过，前提是只要他能够报仇的话，也值得。


    “那你还想不想继续待在玄门正宗？”李想以威胁的语气说话。


    “我真的不想放弃这个机会，因为李想菩萨你是真的有神力的人，我不知哪世修来的福报，让我有机会进『玄门正宗』，也才有机会得到李卜大师的教导，并有这个福气与李想菩萨做同门……师……兄……因此我的人生才有希望，不然未来依然是一片黑暗，我真的不想再过这种虚无缥缈的堕落了……”超仁喃喃自语。


    “我从没有告诉过老爸，我也很同情你这个超人从小到大被欺压的遭遇。我今天除了进入你的海马回，看到你的秘密，我还会跟你秘密商量一件事，我想在大学进行、办公室进行，我要解救天下的众生苦难。”


    李想得意地说，他已经忘记原本的企图只是借助超仁的记忆，寻找是谁损坏与燃烧他记忆的线索。


    毕竟，超仁算是少数与李家这么亲近的人。如此一搞，却有意外的收获。


    “我不能放弃，因为这个李想真的是欺人太甚，想要逼我退出赛局，所以我一定要想出办法生存下去！这个李想真的有神经病，突然又离题谈什么同情我，『什么在大学、办公室进行解救众生的计划，发神经！他说话永远是杂七杂八，跳跃式的，简直是乱七八糟、胡言乱语！』悲愤交加的超仁对自己如是说。


    超仁在地板上慢慢匍匐，看李想说了这段胡言乱语之后，就独自坐在地板上笑呵呵地跟空气说话。李想象是没发现超仁几乎已爬离他的房间，还是继续对着空气比手划脚，露出很是兴奋的模样高谈阔论。


    爬出房门后，超仁边走边跳地冲下楼，迅速骑上他的极速小绵羊离开。他想走得愈远愈好；等李想发完神经之后，最好也将敲竹杠的事给忘得一干二净。


    ![](img/237675b87ee3b5bddaa78c410bf9f326_28_0.png)


    有人说，人生是由无数回忆组成，回忆是由日子累积，当生命走到尽头，蓦然回首，原来，令你难舍的，都是那些日子。


    因此还有一个说法是，濒死者会对一生做浓缩性的回顾，生前的回忆如同电影那样，形同一幕接着一幕的画面，将会按照事情发生的时间顺序，在濒死者面前移动、演示。


    有些人甚至能够短暂的进入画面，让画面当下的情感和格调，得以做最后一 次的体验。


    超仁一边任由风吹着自己的脸，一边想着：到底李想是怎样修炼成这种秘力量，竟然可以闯入他头脑的海马回，甚至找到他早已遗忘的创伤回忆。


    超仁曾有一次在杂志读过，荷兰科研人员发现一种治高血压和心脏病的药物，可以令人忘掉不愉快的回忆，今后或可以用来治疗心理疾病，令荷里活电影《无痛失恋》中的情节成真。


    阿姆斯特丹大学心理学家金特 (Merel Kindt) 领导的科研人员发现，这种 β 受体阻滞药（治高血压和心脏病的药物）可以干扰大脑的记忆。他们希望利用这种特性，帮助患有「创伤后综合症」的病人。


    超仁多么希望早日忘掉这段回忆，本来它根本就被封印于深沉脑海中，渐渐分解为空气。拜这个李想所赐，无缘无故解开封印，让接近幻灭的痛苦记忆重现天日。


    # 「第三章」


    超仁只要一急躁、一有压力，就会想要借着大吃大喝来纾解情绪。狂吃美食是他发泄负面情绪的出口，他身上的游泳圈正是压力到访过的痕迹。


    因此他骑着极速小绵羊到了一家饭店的餐厅里，拿了菜单后，一口气就点了 5 道以上的菜。


    “这样应该够吃了。”脑满肠肥的超仁了解自己的胃容量能够装入多少食物。


    就在等菜上桌的期间，他痛定思痛，一直思考着李想挖出他创伤的回忆。


    超仁双手抓着头皮，不断的抓痒，而头皮屑也一直像雪花般飘落，点缀了双层大神扒……


    突然，大家都被门口嘈杂的声音分散了注意力。


    超仁看到所有的人都停下手上的刀叉，整个餐厅所有人的目光，全部投向同一个方向，议论纷纷。


    超仁也把头抬起来，看到底是哪个人那么大牌，打扰了他吃饭的兴致。


    他看到餐厅的经理马上从楼上流星赶月地飞奔下来，搓着手掌，一副谄媚的样子，走到那个人的前面鞠躬哈腰。


    “欢迎光临！黎议员！您能莅临本店，小的真是感到万般荣幸啊！今天就由小的做东，不论吃还是住，全部免费！请到楼上的 VIP 贵宾室……”


    而正竞争着仁义党主席的当红政治人物黎敬平议员，也很有礼貌的和经理握手，请经理帮忙他带路。


    “议员先生，这边请！这边请！”


    “他怎么会出现在这里？！”超仁心如悬旌，两眼直瞪说了这句话，马上把脸别到一旁，深怕被这个学长认出来。


    “他应该已经忘记我了吧？！都……已经退伍……这么多年了……如果不是那个李想搞什么入侵记忆……我也完全不知道他是我的学长……”


    超仁期间艾艾的自言自语。本来已经忘掉的部分创伤回忆，被李想搅乱后，回忆的当事者之一又偏偏这么巧，在这里遇到。


    # 「司徒超仁遗失的记忆 1」


    「黎敬平」外表不怎么样，五短身材，而他那个头更是大得不得了，活像个「多啦 A 梦」一样，不过是「邪恶」版本的。


    性格则是睚眦必报，但却也欺善怕恶，至于在刻薄菜鸟的规划方面则从不窠臼、必有创新。


    据说这种类型的人，最适合从政。因为他的表情总是露出一种高傲、自以为是的样子，习惯性用下巴看人，正符合了一句话：“矮子矮，一肚子拐”。


    当年当兵时，我是 1954 梯，而那位学长是 1951 梯的。


    虽然我们两个的梯次不会差很远，但是军中是论资排辈的。


    这种奉行弱肉强食的学长学弟制之下，只要他的梯次在你之前，就算是你的学长了。


    每个当菜鸟学弟的，都常常私下抱怨学长学弟制是多么的不合理，如果自己哪一天当上了学长，一定要废除这项不成文潜规则。不过随着菜鸟进化成老鸟，就会出现“换了位子就换了脑袋”的现象。


    而当时，这个学长就是常常请我“吃小灶”的一个人。


    在我的军旅生涯中，很多鸟事总是不断的发生。


    早上起床后，值星官集合大家早点名，就分配打扫的工作给大家，而老鸟一定是分配那种比较轻松的工作，例如擦擦中山室（军中集合大家谈论事情的地方，也是吃饭的场所）的桌子啦！“教导”学弟工作啦！


    而当兵被操得可塑性极高的我，也理所当然的被分配去扫地，由于军中树种得多，每天都会有一大堆叶子被风吹刮下来，所以那些菜鸟就负责清扫这些叶子。


    就在这个时候，黎敬平常常借机吩咐正在执勤的我到外买食物，而过后总是装傻赖账。有好几次被抓包，害得我被长官炮轰、处罚，黎敬平屁股拍拍就闪人。


    另外，当张英杰学长指派任务给我时，黎敬平就会在同时间“特地安排”另一项任务，和张英杰学长隔空对战。


    军总常常出现这种言人人殊的情况，就是“两个不同的长官或学长，同时叫同一个学弟去做不一样的事”，不然就是“两方坚持自己的方法才是对的”。


    而当夹心饼干的我，除了苦笑，还是苦笑……因为实在不知道，此时到底要听谁的指令？怎样做才能够顺得哥来又不失嫂意？


    许多的菜鸟心情也像我一样，前怕龙后怕狼，就算怨声载道也骨梗在喉，委曲求全。


    当任务失败的我被双方奚落之后，总是没人愿意排难解纷，挺身而出帮我说句公道话。我此时完全切身体会到“人情冷暖”的道理。


    因此，我最耳熟能详、且身同感受的名句就是：“在军中，不动鞦，不打算，专打不长眼！”


    最让我不爽的是，每次晚上站哨时，这个学长常常故意拖哨。有时自己一个人连续站了 4 小时都没人来接，而也只有怒气吞声下来。


    因为这种事情若是越级往上报，上级长官绝不会为这件事而重重的教训学长，顶多形式上作个样子，口头上念几句，敷衍了事而已。最后学长被念得一肚子怨气，还是会回过头出在“抓耙子”学弟的（台语：爱打小报告的人）身上。


    再来，他是旅长、营长、连长眼中的“红人”。这并非因为他有出色的工作能力或表现，而是他的父亲是政党元老，也是政府大官，所以每个长官都像哈巴狗一样，没有一个敢随便招惹他。


    今天我能过着“非一般舒适”的军中生活，黎敬平“居功至伟”。


    “他妈的！又是一个狐假虎威的死王八蛋！”我心中常忍不住咒骂这只畜牲。


    话虽如此，和其他“糟糕透顶惨绝人寰的鸡巴代志”比较下，黎敬平的滥权只是小巫见大巫。


    ![](img/237675b87ee3b5bddaa78c410bf9f326_31_0.png)


    传说中间闻不如一见的“黄埔十道美食”，就如太阳追逐月亮、月亮追逐太阳的戏码，日复一日，不断地在我的身上重演，早已经见怪不怪。


    军中，我甚至被冠上“黄埔超人”的美称，或有“过街老鼠超人”的封号，妇孺皆知。


    我“被电”和“被整”的过程，足以写成一本百科全书般厚的“自强勉励”教材，就连那些有轻生念头的人看了，都会如获重生，脱胎换骨，深感珍惜生命的重要性。


    很多时候，这个倒霉的老蟹只诚心祈求，如果一切都只是保持在这个“黄埔十道美食”的范围当中，那该有多好啊！


    与其他花样百出五花八门的“精心设计”相比之下，被滥权的黎敬平欺压的经历只属于“小菜一碟”。那些惨无人道的“高尚待遇”，真叫闻者伤心，听者落泪。我常常垂头丧气的这样想：“到底我是当兵，还是当狗”！我连狗都不如！”


    当兵以来的日子，经历过了为我特别精心调配的“四面埋伏”后，长年以来只敢维持在两种稳如泰山的睡姿，就是仰卧与俯卧。没有其他原因，就是刚开始我都是习惯性侧睡。有不明人士趁着我熟睡的时候，在半边床位洒满图钉，结果当熟睡的我一换睡姿，无论是从左侧卧换成右侧卧，或者相反，都会被钉得仰天长啸，痛不欲生的醒来。


    变态班长对“紧急集合”情有独钟，他的至理名言就是“随时做好准备防御解体！”意思就是说，敌人无情，当兵者需要常常提高戒备，以防被人偷袭。结果，变态班长时不时在鼾睡声中发出“紧急集合”的长哨，命令大家在两百秒内到操场集合。大家起床后都搞得人仰马翻，磨磨蹭蹭多时才到操场，准备被体罚。


    我就遇过几种状况。第一种就是靴子里被放图钉，第二种情况就是靴子的鞋带被打死结，或者靴子被绑在床柱上，第三种则是靴子底部被粘了宇宙无敌大象牌强力胶，第四种是靴子和我玩捉迷藏。种种际遇的后果就是，解决窘状后拖累了大家。


    两百秒后，开始算起的每一秒，都是一个被体罚的单位。假设说落单的我在十分钟后抵达，十分钟六百秒，扣除两百秒，全体要做四百下的仰卧起坐，或是交互蹲跳，或是仰卧起坐。当教官念到魔术
    3 个字“搭拱桥”，长达四百秒，也就是六分钟多，大家都心力交瘁，怨声四起。


    紧接下来的日子，我每一天都提心吊胆的检查所有的配备，不过我的物件还是逐个闹失踪，全体还是顺理成章的因为而接受体罚。因此，“犯众憎”就是最贴切形容我在大家心目中的地位。渐逝地，慈眉善眼的同梯与学弟都开始变得凶神恶煞，连那些常常和我共患难的茬弱之士，都开始把枪头转向我。


    “火鸟攻略”是我难忘的经历。不明人士将用于消除肌肉酸痛、挫伤瘀伤扭伤的辣椒膏涂抹在我的内裤，当辣椒膏发挥其火辣辣的特效后，我在烈日当空下操练，届时成为“火鸟”。


    “悟空攻略”更是离谱。不明人士将处于半湿状态的衣裤沾上整人的化学快速致痒粉，当汗水与致痒粉混在一起，让我在练习枪术时苦不堪言。有时候长官会故意在大家把枪刺出去后，让大家如快闪族那样定格五分钟，我感到奇痒无比，如顽猴般猛搔痒，结果全体学员被教官赏做与我如出一辙的“悟空搔痒”，因此奠定我是“恐怖分子”的地位。


    我忍无可忍，胆大包天使用军中的申诉专线。结果东窗事发，黄妈妈（军中人权促进会）热心慷慨介入调查，营长因此而大发雷霆，事后下令全体禁假，因此我“好端端”成为了营中的“当红炸子鸡”，更备受大家的“爱戴”。


    很多时候，我的矿泉水中会有乳白色不明液体沉淀；三不五时，我的食物中掺杂头发碎屑，好心的黎敬平学长教我吞棉花，好让那些发碎不会滞留在内脏，这才让我逃过得到长期的呼吸气管疾病的灾难。


    有时平白无故的泻肚子，结果被反锁在厕所里，而且灯光也被熄灭。呆了一个夜晚，终于能打开厕所的门，却被一堆靠在门口的棍子扫把全压下来，被“打”得鼻青脸肿。


    后来我发觉，“整”我的人已不再是长官或学长，而是那些在军中和我一样卑微的弱者。我被窝窝囊囊的弱者欺负，无语问苍天。我度日如年，整天都以泪洗脸，只能默默地承受这一切。就算日夜惕励，始终是过着随波逐浪的生活，很多事情都不在我的掌控当中。


    黎敬平只是偶尔的“教导”我如何扫地，有时吩咐我买食物后赖账，故意拖哨，还有就是语气不好，就是这样而已。即使黎学长不算是仁人志士，不过也没有过火的举动。相较之下，在坎坷的军中生活里碰一鼻子灰，最想不开的就是连军中和我同样等级的“狗”都会鄙视我。被“狗”踩在脚底下的滋味最令我煎熬。


    花花世界的现实中，与单纯的军旅生活一样，有灰色道理隐藏着，人一但有了权势，没有亲属关系的人也都来攀附，所谓的门前结起高头马，不是亲来也是亲啊！


    光阴荏苒，岁月如梭。一晃就是黎敬平功成身退，衣锦还乡的日子了。


    黎敬平退伍的前一天晚上十一点多，连长和很多其他的学长都没有睡觉。他们一伙人找个小房间，买了许多啤酒、香烟、槟榔，还吩咐伙房的学长到厨房拿来许多肉馅小菜，大煮四川麻辣鸳鸯火锅。大家就在小房间里说说话笑的，好不快活。


    而此时躺在床上的我，心情也是非常的兴奋。


    “那个鸟人终于要走了！哈哈哈！我自由了！哈哈哈……”我盖着被子暗自窃喜。


    大约过了一个多小时后。


    “刷……刷……刷……”


    我突然听到脱鞋的声音，一阵一阵脚步声逐渐靠近，而且声音愈来愈大声，最后声音停止在我的床前。


    “操！死天兵！你给我起来！快点起来”一个人把手伸进蚊帐之中，用力扯着被子。


    我听着这个熟悉不过的声音，吓得快点假装睡得很熟。


    那个人直接用手大力摇：“喂！司徒超仁！鸡巴天兵！快给我起来！别再装睡了！”


    那个人大嚷着，我知道再装就破功了，所以只好勉为其难假装被摇醒。


    “咦……敬平学长？！你不是正在和连长、学长们高高兴兴的庆祝退伍？怎么会跑来这里；而且这么晚了，请问敬平学长有什么事情？”我一边说着一边假装揉着惺忪的眼睛。


    “麦啰唆！马上起来！”


    我这时心里直觉不妙，因为这个鸟人找我，从来都没有好事情。


    “学长你真的醉了，我想还是早点睡觉比较好，我送你……”我跟在敬平学长的屁股后面，一边假惺惺的搀扶着学长，还不自觉的露出了许多超出脸部表情限制的鬼脸，其实是希望敬平这个鸟人可以早点睡觉，不要再找我麻烦。


    走着走着，走到了一间库房前，敬平学长用钥匙把库房打开。


    “死天兵，滚进去！”敬平学长用命令式的语气说。


    “明天就要退伍了，这个鸟人不会是想要趁这个最后的机会，在库房先毒打我一顿再杀人灭口吧！”我幻想着这些变态情节，肉颤心惊，愈想愈可怕。


    “婆婆妈妈的，怕什么？！你这个人真的很懦弱耶！”敬平用一种不屑又同情的口气说。


    “今天是最后一天了，学长我明天就要退伍了，以后大家各奔东西后，恐怕这一世也不可能再见面。所以，学长想趁永别之前和你好好聊聊，不醉不归。”敬平学长一反常态的举动让我感到吃惊，真的不知道自已是否面临著暴风雨前的宁静。


    敬平学长蹦蹦跚跚走到库房的角落，打开角落的箱子，拿出了一些零嘴和苏格兰威士忌酒。拿了两个喝酒用的玻璃杯，并放入一点冰块，就打开“JOHNNIEWALKER”（约翰走路）帮我倒了半杯。


    “来！超仁！干杯！”敬平说完后就直接先干为敬了。


    看到这样的情况，输人不输阵，我也一口气干了。


    其实我本身不烟不酒，所以虽然只是半杯，喝完后也让我整个人喉咙像是烧了起来一样，全身如置焚化炉，鼻孔都喷出了水蒸气。


    “臭他妈个 B!这就是为什么我不爱喝酒的原因了！呸！”我心中暗暗吐苦水。


    “哈哈哈！你这个家伙不但懦弱，连酒量也差成这样。窝窝囊囊成何体统？你将来出社会和别人应酬你该怎么办啊；以后如何成得了大事啊！？”敬平一边说一边再填满我的酒杯。


    “学长好了，好了，我不想再喝了，我真的不会喝酒，我只要吃零嘴就好了。”


    我露出极为欠揍的无辜表情求饶地说。


    “不行！”敬平学长斩钉截铁的命令着。


    “明天我就要退伍了，今天等于是我在军中的最后一天，我想说之前对你这么凶，感到很不好意思，所以才会把你从床上挖起来，想说要和你『赔罪』，顺便『忏悔』，难道你不领情；别告诉我这点面子你都不肯给学长！”才说完，敬平学长又干了另外一杯。


    此时我心中也很挣扎，天使与魔鬼打得马仰人翻：


    “黎学长混蛋归混蛋，但是他明天就要退伍了，而且在退伍前还请我吃东西和喝酒，最重要的是还要和我『赔罪』，恳求我原谅他，如果我真的这么狠心，我岂不是连猪狗都不如了吗；超仁，母亲常说得饶人处且饶人—这一次要听母亲的话啊！”


    还是老掉牙的邪不能胜正，天使获得满堂彩。经过一番内心的挣扎后，我终于伸出友谊之手，直接拿起了眼前的酒杯。“黎学长，我虽然不会喝酒，但是我还是必须要谢谢学长的照顾。敬你的！”


    干下了第二杯后，我一边和敬平学长有一搭没一搭的大聊特聊，一边喝酒。


    彼此一直以来紧紧封闭的心房，也随着给俩人坦诚相见而打开了，大家言归於好，把过去的恩恩怨怨都一笔抹杀。


    就在喝了几杯“狗尿”下肚以后，我开始感到头有点昏昏沉沉的。


    不过也在酒精的催化之下，醉醺醺的他如同吃了豹子胆，把心中长久以来所累积的怨气一口气给吐了出来：


    “敬平学长，你知道吗？我本来觉得当兵是一件简单的事，可是因为你的出现，所以我常常觉得生活好痛苦。为什么你会把我当肉中刺眼中钉，每次都会找机会刁难我，明明我就没有做错什么，可是你就是不放过我！你说！你为什么要这么做？！害我常常在站哨时，都会默默的看著已经装有实弹的
    65K2 步枪，有时真的觉得干脆自我了断算了…你说啊！为什么要找我麻烦：为什么？”我一边发着酒疯一边颠颠晃晃的说着。


    “超仁！其实我对你这么凶是有原因的！”


    接近酩酊大醉的黎敬平拿着酒杯，眼睛看着酒杯，轻轻的摇晃着杯里的酒……


    “其实我是为了你好，我是为了『教导』你！让你快快成长！”敬平静醉的吐出这句话。

