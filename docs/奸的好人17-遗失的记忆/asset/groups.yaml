    更玄的是，周围的景色不断后退，即使我的双脚紧紧地钉在路上，一动也不能动。


    脚下的道路仿佛安装了滑轮，或像是水平式电动走道，以大约时速 10 公里的速度不断前进。这里没有光明的隧道，但却像是一条怎么走也走不完的道路。


    这里很像传说中，生命结束后的移动式走廊。


    不知不觉，我被钉着的脚终于能够移动。


    我一直大步跨走，发现背后有笨重的脚步声，我转身看到一个胖子满头大汗，垂头丧气，喘呼呼跟在我的后面。


    我必须尽快摆脱他的跟踪，于是快步继续向前走，突然，走道前面出现一道大门，把我吓了一跳。


    可是，接下来并没有再发生任何不寻常的现象。


    > （老天！到目前为止，这整个四维空间和所有现象，有什么是寻常的？是我电影看太多了吗？还是想象力高人一等？）


    我定一定神，把门轻轻推开，看到一个身材如可口可乐曲线瓶那般，穿着粉色丝绸肚兜和白色迷你裙的女人，笑嘻嘻地招呼我进去。


