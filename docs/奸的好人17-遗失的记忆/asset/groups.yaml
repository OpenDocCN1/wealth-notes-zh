    # 「第四章」


    # 「李想遗失的记忆 7」


    恍惚之中，我感觉有几股锐不可当的气流，在头盖骨里横冲直撞，令我的头嗡嗡作响，头也一时大一时小。


    这股在里头四处奔腾的气流，逐渐形成一个强烈旋转的气旋，其外形就好像一个巨大的漏斗，是一个猛烈旋转着的圆形空气柱，不断地往头外钻，欲破头而出。那一种声势，就好像古代在战场中冲锋陷阵的万马千军。


    头盖骨负荷不了，旋转速度惊人的圆形空气柱以翻江倒海的气流把头骨破开。头骨破开后，气流也就烟消云散。头骨里面是一片充满丛林气息的原始森林。


    原始森林里埋了一颗小种子，以一种破竹之势快速成长，变成了一棵耸立云霄的千年老树。这个时候，一双粗暴的手拿着锯子锯着千年老树，瞬时火光冲天，发出咔吱咔吱的噪音，不断摩擦着我的神经。


    一种身不由己的感觉，令我觉得很有安全感。


    突然，一丝微光之后，左眼传来微痒的感觉——不，应该是说，有点针刺的感觉。


    接着，右眼又像被针刺了一下。


    我感觉双眼与我的意识分离了，而我的意识又自己的身体分离了。


    现在是眼睛、身体、意识三者都仿佛被隔离在三个不同的空间，都不在我的指挥之下。


