    如果受到三种情况当中两种变化同时夹攻时，就会产生令人难以想象的痛苦。如果这三种变化同时发生，绝对是天崩地陷，情况可怕之至！


    原本，我对这三种情况，根本不屑一顾。


    不过当我重生之后，我却从这三种变化中看到一个契机，这个契机就能令老爸李卜变成一个成功的江湖骗子。


