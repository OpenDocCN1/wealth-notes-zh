    我不疾不徐的站起来，向围观且窃窃私语的路人甲乙丙丁等点点头示意，接著仰起头，双掌合十，面朝橘红色的夕阳，以大家听到的声音朗诵：「嗡咕噜李想悉地呼……愿你得以往生西方极乐世界，嗡咕噜李想悉地呼……」


