    「阿虎，你还是寻找他童年的记忆图片，将之烧毁吧！将来的事，将来才算吧！」


    卜哥握住我的手，他双眼看着我，我已经没有了主意，还是听从卜哥的决定吧！


    我缓缓点头，张虎将额头紧贴着脸包裹得像木乃伊李想的额头……


    —我是不是该对你绝望了？对你，我已经无能为力了！


    张紫怡从梦中惊醒，弹坐了起来，她喘着气，望着躺在病床上的李想。


    李想不知何故，吐出一口鲜血后就昏迷不醒，她心里现在好担心。


    医生李想的心脏不明原因停止跳动过，血液中二氧化碳不正常地升高，需要继续留院观察。


    突然，紫怡的手被另一只冰冰冷冷的手紧紧握住。


    「紫怡！紫怡！」原来是李卜，他用力紧抓着紫怡的手痛苦叫着：「我心口忽然好痛！好痛！」


    过了一阵子，阵痛才云消云散。疼得火辣辣的李卜慢慢坐了起来，半躺在沙发头靠椅背说：「奇怪，睡得好好的，怎会这样？」


    她说：「卜哥，我梦到 6 年前，李想在怡保连环车祸的记忆，我心理很不服……」


    「怎么会这样？……我也梦到 6 年前李想在怡保发生车祸后，是张虎帮他……」李卜附和说，大家心照不宣。


    「卜哥，我们俩都做了相同的梦……万物都有征兆……」两人心有灵犀一点通。当下李卜全无睡意，不知所以然的又回想到：当时自己替司徒超仁起卦之后，又替李想卜卦的一支签，不小心掉落到地上，弹了三下，钻进桌下的怪异事件……


    李卜一生中少有灵异事件，那一次的事让李卜不得不相信司徒超仁未来的潜力，也使得他知道，即使李患有精神分裂症，但也得准备将玄门正宗交给他继承。这是天意，天意不可违也。


    李卜的确不愿承认这支卦象的驭示，这时，李卜的心口又闷闷作痛起来……


    张紫怡取来张虎到医院时送他们的矿泉水。


    打开了盖子，她闻到一股香气，喝了一口，心中觉得无比清凉，她将水瓶递给了李卜，李卜也喝了一口，精神才缓和了下来。


    ## 「第三章」


    司徒超仁来到 18 层楼高的「丽花宫」才恍然大悟。


    站在偷情宾馆的大厅门口，他用力吸了一口冰凉空气，即通过自动开关的大门走入宾馆内，瞻前顾后、左顾右盼的走向酒店厅堂的服务柜台。


    酒店金碧辉煌，其装潢与摆设与季卜的豪宅比较，有过之而不及。


    整个空间充满了奢华的品味设计，这里应该算是迎宾厅吧。脚下地板全是白色大理石所铺置而成，角落放了修剪过的独具特色盆栽。两旁墙上都是白色石雕，中间的玻璃桌上，放了许多琉璃花瓶，花瓶里插着粉红色的玫瑰花，再配上背后紫黑色大理石的背景，显得特别高雅。


    而由深棕色檀木所制成的巨大屏风，则把大厅隔成了许多有气氛的小隔间，每一间都独具特色。坐起来非常舒适的深红色沙发上，放着几个别致的小抱枕，而沙发背后背景则是镶金雕花设计，天花板上点缀着许多微弱淡黄色的灯光，让气氛柔和了许多，低调而优雅的设计融入其中。


    「哇！这个大厅也太豪华了点吧……」超仁看得目瞪口呆，犹如来到了阆苑仙境。


    他走向了柜台。


    「先生您好，请问您是要休息还是住宿？」柜台小姐亲切询问。


    「我要叫……我要找张虎……」超仁腼腆的回答。


    「请问，您就是司徒超仁先生，对吗？」柜台小姐以一种服务至上的语气问。


    「我是……」浑浑噩噩的超仁搔搔头发，想要自我介绍。


    「好的，请您稍等一下。」小姐处理了一下计算机，拿了一张感应式卡片和一瓶矿泉水递给超仁，卡片标明 605 号房。


    「小姐，请问……这是做什么？」司徒超仁满腹疑惑，对这一切安排感到浑身不自在。


    「是张虎先生吩咐我，如果有一位叫司徒超仁的人找他，就开一间房间给他。」小姐保持一贯的笑容可掬回答。


    ### 神棍之遗失的记忆


    「小姐，不好意思，我是有很重要的事情要找张虎，张虎在哪……」超仁还是想再三确认。


    「司徒先生，真的不好意思，张虎先生只是这样吩咐我。如果有什么疑问，麻烦请您直接联络张虎先生。」


    而超仁也不好意思再问下去，于是就直接拿着钥匙和矿泉水上去饭店房间了。


    超仁经过酒店吧台时，全副注意力灌注在一位穿着黑色深 V 领毛衣的辣妹。皓齿蛾眉的辣妹嫣然一笑，从上到下打量着超仁，不自觉的拨弄长长的金黄色卷发，用挑逗的眼神不断给予暗示，让从未对女性「深入了解」的超仁异常兴奋。


    天使和恶魔激战过后，超仁鼓起勇气走上前去，[扩大人际关系]。


    超仁伸出友谊之手，正要自我介绍之时，辣妹递过一个印有热辣辣红色唇印的酒杯给超仁。不知所措的超仁接过酒杯，偷瞄辣妹几乎低到腰间的 V 字领，发觉辣妹的胸部激凸，确定没穿内在美，这让他的「小超人」搭起了激情的帐篷。


    被辣妹电得神不守舍的超仁，吞了几口咸湿口水，举起辣妹的酒杯喝下几口黄汤，这个时候，辣妹把脸贴在超仁耳边，吹了一口温柔柔软的气。


    「不要忘了 605 的张虎……」


    辣妹说完话，一转身就走出酒店大厅。


    超仁感到惊骇莫名，被煞到心脏衰弱，整个过程犹如坐过山车那样。他吸了一口深深的气，就带着百思不解的心情，搭电梯上到六楼。


    到了六楼，电梯门打开了，这次看到的是一条又长又时尚，灯光昏暗的走道，不同颜色的霓虹灯一圈一圈环绕着走道，加上所播放的萨克斯风音乐，让人有一种飘飘然的感觉。


    「哇！连走道都打造得像充满神秘色彩的时光隧道一样，让人在还没进房间以前，就能感受到「偷情」的兴奋感了，真的让人『冻未条』啊！如果刚才有那个辣妹陪伴，就更加好……」暗爽的超仁一边赞叹着，一边寻找着自己的房间。


    「601……602……603……」超仁顺着门房号码不断搜索。


    「605！将将将将，找到了！就是这一间！」


    超仁拿出柜台小姐给的卡片，放在感应器上。[哞哞……卡嗄]门锁应声而开。


    超仁扭开门锁走了进去，里面是一片黑暗，但当他把卡片插进房间里的感应装置时，灯光顿时亮了起来，超仁对映入眼帘的景象感到不可思议。他头脑当机，看得目瞪口呆，说不出话来……


    也许这是人类面对心目中的完美艺术时，会有的共同反应吧？！


    房间里面的摆设，真的是非常高级，而且非常有气氛，房间设施接近完美，让你无法再提出任何的苛求。浴室的大按摩浴缸可以让你深深地浸泡其中，从大落地窗看出去，搭配着如梦似的风景，视野是超乎想象的迷人，这个地方就如同是伫立在凡尘中的仙境一般。


    「哇！这里真是成人的秘密花园啊！」超仁感叹的说，但，此刻超仁的心情并无心欣赏。


    接着超仁看到房间里那张深红色的大水床，他沿着水床边缘，用手顺势摸着床单上柔软的毛料。


    体型庞大的他慢慢坐在浮动的床垫上，不停拼命的摇啊摇，感受水床的韧性。摇久了有一点晕船的感觉。


    玩累了，他拿起手机，拨通了张虎的电话，但张虎没接电话，此时，超仁那种痛苦的感觉又涌上来了，感觉更加的抑郁烦闷……


    「妈的！我现在到底该怎么办呢？」超仁烦闷的问着自己。


    「张虎要我到这 家超级偷情汽车旅馆里，到底有什么目的？」


    这个时候，超仁的心空空荡荡，灵魂又被绑架。他有一点担心张虎借这个机会诱奸他，那么他多年来辛辛苦苦保持的处男身，就毁于一旦。可是，他又觉得在生死关头疑神疑鬼，是一件很荒谬的事。


    他无意识地躺在床铺上，顿感失落。疲累又空虚的他现在唯一能做的，就是默默地躺在这里等张虎。


    当思绪停止转动的时候，他回想 着在医院，张虎对他说的那一番话。


    ### 「司徒超仁车祸后的回忆」


    「张虎，怎么会是你？」司徒超仁惊讶地问，他的下巴好像即将掉到胸部。


    张虎老神在在：「超仁，你先冷静听我说。是我假裝醉酒驾车，故意应验你第三个劫，让你的野兽跑出来。」


    「你……你……我……我……干你娘勒!我跟你有什么切骨之仇……你……你他妈的要这样害我!」超仁气得七窍生烟，差点说不出话来。


    张虎却瞪圆虎目，态度老气横秋，有恃无恐的说：


    「李卜的文王卦向来第一神准，天底下没有多少位卜文王卦的，能有这份功力! 6年前，你在马来西亚怡保椰壳洞出车祸，现场的连环车祸发生爆炸，只有你和李想没死。李想受了重伤，而你那时只是很怪地受了轻伤，没内出血，连医生也摸不着头脑，只是昏迷了一个星期。那时张紫怡握住李想的手，发现他的灵魂出窍，而李想的神识一直想摆脱一个胖子，于是我进入了李想的记忆系统，我，看，到，了，你!」


    「张虎，你到底在说什么；为什么我完全没有记忆？」超仁愈听愈震撼，全身紧绷，心中冒起更多大大小小的疑问。


    「那时候，我还在李想的头脑颔叶部份，看到李想的幻觉，我看到李想被你胸口一股吸力拉进了你的胸部!」张虎露出一脸阴郁的表情，用食指指着超仁的胸部。


    张虎停顿了一会，一脸便秘的表情继续说：


    「那时候，我暗恋张紫怡，对李卜崇拜得五体投地，想当个全职的术数师父，所以我李想的幻觉跟李卜说了，于是……」


    听到这里超仁感到晴天霹雳，眼神透着恐惧，心里发毛，第六感告诉他，张虎说的都是真的。他现在开始渐渐有了头绪，了解为什么自从李想进入了他的海马回之后，他时不时会在梦中看到李想遗失的记忆。


    张虎叹了一口气，深深的吸了一口气。


    「于是，张紫怡与李卜到病房看你，张紫怡握住你的手，感应你的神识灵觉，她感应到你就是李想，李想就是你，所以她又派我进入你的脑部，看一看为什么会这样……」


    「我是李想，李想是我……我不是怪物……到底怎么了，到底怎么了……」超仁用怪里怪气的论调不断的碎碎念。


    「那时候，我也感到很奇怪，后来张紫怡对着你的头颔摸得很详尽，她发现你有很严重的忧郁症，你的快乐中心暗淡无光，生命中像是失去了一股力量。紫怡将摸到的讯息磁场告诉了李卜，李卜帮你起了一支卦，发现你心中沉睡的强大力量，需要经过三道浩劫，每个浩劫都几乎要了你的命，但你又会安然无恙……」


    张虎说得怯声怯气，他也有一种切肤之痛。


    超仁嘴嘶地说：「那……怕保车祸是第一个劫……」


    张虎点一点头。


    超仁惊讶想起他第一次遇到张虎，他说：「我在慈灵官看你现场拍摄《不可思议》节目，现场表演驱鬼时，我被流氓攻击，是第二个浩劫……」


    张虎的表情已经解释了一切。随后张虎又以一种气吞山河的量量，笃定回答：


    「我要激发出你的灵力，所以刻意制造第三个浩劫，希望能呼唤出你的力量……因为时机已经到了，尤其是你们的乌鸦行动，取得空前的成功」


    「你为什么要这样做……」虎口余生的超仁浑身哆嗦，眼球涨得通红。


    他欲哭无泪，几乎崩溃，已经无法再承受任何任何刺激。


    同时，他更嗔怪张虎把仅存的一点幸运都抢走。


    「李卜当时还帮你多起一支卦，他发现你拥有吞噬他人生命的野兽力量……而你命格能帮助一代教主清除障碍，李卜一直觊觎教主的头衔，不过他独术难支，因为他没有神通！于是他想到利用你，开始布局控制你，而因此不通知你的亲人，你的医疗费完全由他负起，并且派了我来，清除你昏迷中所有的记忆！」


    谜底到了这一刻，终于被推开。不为人知的那一幕，显出了模糊的轮廓。


    「你为什么要告诉我这些……你不是帮李卜的吗？你有什么意图？」超仁睥睨着居心叵测的张虎，对他的动机百思不解。


    张虎缓缓叹了一口气，眼眶的泪水几乎夺目而出，他强忍着，又缓缓吐出一口气。


    「我跟随李卜多年了，在他眼中，我只不过是他的棋子或走狗。」


    张虎说了这句话，停下来看着超仁，两人交换了「同是天涯沦落人」的凄凉眼神。


    「李卜是个神棍，他在江湖地位屹立不倒这么多年，当然卜卦确实灵验，不过他是骗根，他只是利用人类的恐惧心理，诈，财，骗，色……他靠着老婆的手通灵力，看了很多人内心的世界。


    他看出我有清洗他人记忆的神通技能，所以他搞其他女人之后，就吩咐我清洗她们的记忆……我表面是通灵大师，实质根本是骗人的。我既不能看到鬼，也无法跟灵界沟通。我只不过是帮李卜做奴隶，暗中替卖主清洗对方的记忆，洗掉他们不应该知道的记忆。李卜看中了这点，用我这个神通帮助很多有钱人……」


    张虎垂头丧气地说，像是做临死前的最后告白，彻头彻尾没有半分言不由衷。


    耳软心活的超仁心理噗通噗通跳个不停，脸色发青，一时不知该如何回话。


    「当年我进了精神病院，是一位叫王霸的人，开发了我的神道感应能力。」


    张虎一边说，一边将脸贴近超仁，缓缓用食指指着超仁胸口继续说：


    「据李卜当年起的卦，你出院后7天之内，力量就出现，而力量的源头就在你的胸部。」


    超仁听了张虎的叙述，不知觉摸一摸自己的心口。


    「你的力量一旦出现，若不懂驾驭，哼！你命不久矣……」在这关键时刻，张虎煞有其事的臆测。


    他运用了李卜的江湖口诀，操纵着他人的恐惧。


    「没人知道如何驾驭你的神道念力，只有我们在精神病院接受过训练的，才知道如何驾驭这股神秘的力量。我需要你的帮忙，我想成立影子秘密组织。」张虎额上爆出青筋，露出圆滑的笑容。


    「什么『影子』？我完全不懂你说什么？」六神无主的超仁问。


    「『影子』就如同李卜摘出来的『乌鸦』。」


    张虎又说：


    「如果你不相信，7天后，你一旦看到你的野兽力量出现时，你将会有翻天覆地的大改变。打电话给我！记得，李卜也会知道这是你的第三个浩劫，同样的他也会找你。要记得，李卜老谋深算，他是城府极深的人，只不过想要利用你罢了，你是斗不过他的！他一直在等瓜熟蒂落的那一天。最好，你能先联络我。」


    张虎再三叮咛。在这个与李卜相互掣肘的拉锯战里头，他延颈企踵，就盼能够收纳超仁这个王牌到手，继而扭转乾坤。


    超仁双手抓头，大嚷着：「啊……我很烦—我很乱！我很累！你给我滚出去！」


    张虎的出现，扰乱了超仁的思绪，他又不自觉地问摸一摸自己的心口。


    超仁感觉心情烦闷，想起那些呶咄怪事，就觉得怪堵心的。


    他想着想着，嗅到握在右手里的矿泉水所散发出的扑鼻香气，这个香气没有言语能够形容。他打开盖子，喝了一口。


    过了不久，所有眼前的景象似乎都叠上了多层的影子。


    渐渐的，他又进入了梦乡之中……


    ## 「第四章」


    ## 「李想遗失的记忆 7」


    恍惚之中，我感觉有几股锐不可当的气流，在头盖骨里横冲直撞，令我的头嗡嗡作响，头也一时大一时小。


    这股在里头四处奔腾的气流，逐渐形成一个强烈旋转的气旋，其外形就好像一个巨大的漏斗，是一个猛烈旋转着的圆形空气柱，不断地往头外钻，欲破头而出。那一种声势，就好像古代在战场中冲锋陷阵的万马千军。


    头盖骨负荷不了，旋转速度惊人的圆形空气柱以翻江倒海的气流把头骨破开。头骨破开后，气流也就烟消云散。头骨里面是一片充满丛林气息的原始森林。


    原始森林里埋了一颗小种子，以一种破竹之势快速成长，变成了一棵耸立云霄的千年老树。这个时候，一双粗暴的手拿着锯子锯着千年老树，瞬时火光冲天，发出咔吱咔吱的噪音，不断摩擦着我的神经。


    一种身不由己的感觉，令我觉得很有安全感。


    突然，一丝微光之后，左眼传来微痒的感觉——不，应该是说，有点针刺的感觉。


    接着，右眼又像被针刺了一下。


    我感觉双眼与我的意识分离了，而我的意识又与自己身体分离了。


    现在是眼睛、身体、意识三者都仿佛被隔离在三个不同的空间，都不在我的指挥之下。


    瞬间，我再回到嘟嘟声响的房间，又看到一个人躺在手术床上，四个青袍人团团围着他。


    我知道躺在手术床上的人与我关系非比寻常，好像在哪儿见过他，我感觉他与我相熟。


    ### 神槌之遗失的记忆


    我绕过四个人，对四周环境的感觉开始愈来愈弱。我发现自己现在的动作比以前流畅了许多。


    从我飘忽流畅的动作，对比手术室内那些人的动作，他们每个动作与步伐都像一格一格的移动，他们说话也非常刻意与僵硬，像是电力不足的机器人。


    最不可思议的是，我觉得自己没有了身体的束缚，轻飘飘的浮了起来


    一开始我有些害怕，接着，我开始喜欢上这种感觉。


    我心态一动，不如飘浮到天花板，看看躺在手术床上的人是谁。


    说时迟那时快，一转念的瞬间，我整个人已飘浮了起来。


    终于——我看到了！


    我看到了……


    看到手术床上的「他」，眼眶里空荡荡的没有眼珠，口腔里塞了一辆型号为584 意大利的法拉利跑车，荧光色的车身闪烁发亮着。


    跑车的引擎轰隆轰隆作响，轮子转动不停，排气管开始冒火，而且夹带放炮声和滚滚浓烟。


    ……我微弱的感受到这位没有眼珠的病人，身体内有我的意识在运作。


    如果我有与他有关系的话，到底是什么关系呢？


    我突发奇想，如果他是我的话，现在的他与现在的我，到底哪个才是真我呢？


    我就是我，我不是其他人，我正在观察他日前所经历的一切，我念念相续，没有一刻停止思虑，但每个思虑又像是无法串联起来。


    如果他真的是我，那么我现在就是一个既独立但又不自主的我，与躺着的我（他）分离出来了—有一股强烈的感觉这样告诉我。


    我慢慢缩小，愈缩愈小，身体又像是回到襁褓之中，耳边有细碎的叮当音乐声。


    这个时候，我的笑牵动着大人的心，一个女人，不！好像是张紫怡，她不断逗着我玩：「安辜辜……安辜辜……」


    我看着这画面，感动得不得了，我告诉自己，我会记得要乖乖，我一定乖乖，我不要哭泣，我要奶奶，我要喝奶奶……请你们多点关心我，请你们多疼疼我……


    又回到静止的片刻，切断了我的意识流，切断了我能知道、能观察、能感受、能意识的一切，与我所认知、所观察、所感受的所有。我又消失了……


    这里彻底的安静！


    ## 第四话


    不！当我「能知」消失之后，就像全城的灯火一起熄灭，感觉上就是全世界都突然消失在黑暗里！


    司徒超仁想挣扎起身，接着，他在意识昏迷之中，看到五彩光明，光明中慢慢显现一团类似人形的迷雾，踏着七色彩飘来他的面前，环抱着他的头颅，他们俩额头对着额头……


    超仁又看见了另一幅画面：


    ## 「李卜的记忆」


    「李想会再一次破相吗？」我的心简直沉到地核内部，怅然若失的问。


    我斜眼看到张虎坐在副驾驶座，他的呼吸像是几乎停止，唾液哽在喉咙间，不上不下。


    我双手不自觉更用力握住 S600 奔驰的方向盘。


    我很喜欢开豪华房车的感受，我还觉得，坐在自己的驾驶座上，就是唯一可以不必伪装的片刻，因为车内都是自己人。


    紫怡坐在后座，后视镜是我能看她表情而彼此沟通的桥梁，她选择让张虎坐在我的旁边，在现阶段，我们决定最好彼此的心都能保持一段很舒服的距离。


    紫怡捂着嘴，想摆脱什么似的摇一摇头，她心头兀自突变地跳。


    她满怀心事的望着车窗外迅速倒退的景物，还有一张倒映在车窗上五味杂陈的脸孔。


    「看到李想被包得像木乃伊，我心里很疼，很难过……」张紫怡在后座哽咽地说。


    我静静听着……说不出任何话，脑中一片混乱。


    「医生说，他的头盖骨有三寸裂缝，一片爆裂的碎片插在左脑。不幸之大幸的是，血从耳朵流了出来，因此脑壳中没有积血；否则会更麻烦。在猛烈撞击下，眼窝、颏骨、上下颚都有裂痕。右边脸颊下陷，脸部全都移位了……双腿还有五六处骨折。」


