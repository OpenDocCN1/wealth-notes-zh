    司徒超仁从幻象中惊醒，他吓出一声冷汗，眼球全都布满张力舞爪的红血丝。

    「难道他说的是真的，难怪我只记得曾经到过兰卡威岛，但怎么回到台湾，过程发生了什么事，我全然没有印象。但，他又怎么知道得那么详尽？我的记忆系统难道像李想一样，被人阴谋破坏了，不想让我们记得某些关键的记忆？」


    超仁摸一摸自己的胸口，感觉胸口有锥心刺骨的刺痛感。

    「还有 7 天，7 天之后，我胸口真的像他说的一样吗？那时我该怎幺办？」


    「对了，正如他所说，怎么可能我和李想的诅咒，一下子变得那么厉害？难道真的是像他所说，即使是师父，也一早就被人设计好，知道师父命数走到今天这一步，安排了他在这个关键时刻出现？」


    超仁很想尽快解开这个扑朔迷离的真相，他担心福无双至，祸不单行。


    ◻ ◻ ◻ ◻ ◻


    「妈的，又发这种怪梦……要是给我知道，是谁在我的脑部做了手脚，我要他死得比黎敏更惨！」


    失魂落魄的李想从梦中惊醒后，双手猛拉扯自己的头发，他急速喘着气，脖子有些僵硬，心情久久不能平复。


    李想的思绪杂乱无章，不过他的直觉经过缜密的分析后告诉他，现在只能孤注一掷。即使司徒超仁是他的怪物，不过李想一定要找他，进入他的记忆。因为李想有一个强烈的预感，只要进入超仁的记忆，他应该就能找到一个息息相关的线索。


    而李想心中也一直怀疑着，为什么老爸李卜会看中司徒超仁，为什么他会相信司徒超仁有天生的诅咒力量？


    这一切的疑问，李想希望探摸索隐，现在他正整装待发。


    ## 第 4 章


    还没推开病房的大门，打了如意算盘的李想站在门口咕哝了一句，再勉强挤出和蔼可亲的僵硬笑容，轻轻把门推开。


    眼前的一幕吓了李想一跳，事情来得太突兀，使他简直瞪目结舌，不知所措。


    他居然看到李卜与张紫怡两人分坐在超仁的床头，像父母一样呵护着司徒超仁。


    第一个让他感到愤怒的是: 老爸老妈什么时候回来了？回来前为什么不通知他一声？难道超仁的生命那么宝贵吗？值得老爸老妈子特地从美国赶回来？


    第二个让他愤怒的理由则是: 超仁这个死胚子是什么东西，值得大家如此关怀，他只不过是家里养的一只蜉蝣！


    他不禁怒从心头起，恶向胆边生，瞬间有一股冲动，想上前去狠狠蹂躏超仁一番，再活活掐死他。


    但理智又拍拍他的肩膀告诉他，目前必须强忍住这口恶气，顾虑到各个方面的前因后果。


    李想心中燃起熊熊的怒火，很想拔掉房中那股不对劲但又很温馨的气氛。


    「爸、妈，你们不是在美囯谈脐带血、干细胞的命理计算代理权吗？怎么这么快回来？」俯首帖耳状的李想恭恭敬敬的问，但他根本不关心老爸李卜的回应，就转头笑着又问超仁:


    「哈！超仁，你没事吧，看起来你精神奕奕的……」


    李卜也展现出惯有的笑容，没有立即回答李想的问题。


    「那个……张……虎……他……」超仁嘴唇微颤抖动着，他吸了一口气再说：

    「他醉酒驾车，把我从身后撞飞进水沟，还好他马上把我送到医院，否则我小命都没了！」


    李想听到超仁这番话，觉得一口浊气上涌，几乎作呕。但理智又要他强忍怒气，不能发作，一切要以大局为重。


    「超仁，我要你赶快好起来。」李卜以超越亲生骨肉的慈爱语气说，满头都像沾满蜜糖，听了真是扎李想的耳朵。


    「师父，我们的乌鸦……」


    「超仁，人没事就好了，不要再谈什么乌鸦不乌鸦的，我们要看到你人没事啊！而我们也不相信什么乌鸦组织。」


    张紫怡那散发着母爱的声音安抚着超仁，同时用眼神示意司徒超仁这里不好说话。


    一向以来飞扬跋扈的李想呆立现场，张口结舌，浑身僵硬，双脚像被钉住，无法移动身体往前多走一步。


    他全身哆嗦，双手紧握颤抖的双拳，心已经在踏入房门的那一刻被摔得支离破碎——天啊，不是真的，这不是真的！没事，怎么可能？你怎么没事，你怎么还早点死？


    李想知道即使不照镜子，也估计得出，跟一脸铮光瓦亮铿光瓦亮的超仁相比之下，现在自己的脸色一定很难看。


    「李想，你没事吧！」张紫怡慈眉善目的慰问着。


    李想喉咙干燥，口腔像发生旱灾，费尽了力气都吐不出一个不字，只有干瞪眼的份。


    「李想，超仁三天后就应该可以出院了。」李卜堆出满脸欣慰的笑意。


    「哦，哦！」唯唯诺诺的李想心中感嘴不已。


    「超仁，昨天我上柯总的节目谈《降头与诅咒》……」他终于找到一个话题切入。


    但李卜与张紫怡听到李想一提到这个，脸色变得很难看，就像坏掉的红绿灯一样，神色不断的转变。


    「李想，过来这里。」李卜将声量尽量压得很低，并向李想招手。


    李想费了九牛二虎之力走到超仁的床边，轻轻拍一拍他的肩膀，很无奈地说：「看到你没事就很开心了，我昨天……」


    「李想，我们都打扰了超仁很久，他需要时间休养。」


    张紫怡把李想的话给打断，她转身对超仁说：「超仁，一切都等你出院后再说。」


    张紫怡说完，便推着李想的背向外走去。


    ## 第五章


    离开中华路的台北市立和平医院（在西门町附近，曾在 SARS 大流行期间，封闭隔离治疗病人，造成了一些医护人员的伤亡，因此知名），众人启程返回狗窝。


    李卜亲自开 BMWX5 休旅车，这是极少见到的现象，回到台湾 6 年来，李想已经很少看过李卜亲自开车，果真是铁树开花水倒流。


    李想回想起当初，李卜教他如何当一名神棍的第三堂课，是由张虎开车，领着司徒超仁坐在后座。


    现在是张紫怡坐在李卜身旁。两人神色凝重，犹如前往葬礼慰问吊唁般，一扫刚才欢乐声和笑声搅拌一片的温馨。


    「爸，你真的想送死胖子到「台大医院」（台湾等级最高医院之一）？」原本噤若寒蝉的李想终于打破了沉默。


    李想故态复萌，还对刚才的事情耿耿于怀，说话间吐出微微苦涩的二氧化碳。


    临走前，李卜信誓旦旦对超仁说，要是当时自己在场，一定送他到台大医院做一个检查李想侥幸超仁还懂得不好意思，连说：不！不！不！


    但李想早已窝了一肚子鸡巴顶琐的火，就是想不通，也放不下为什么李卜竟然会对超仁这么好？一反常态的嘘寒问暖？难道，为了「玄门正宗」的千秋大业，他可以连自己亲生的儿子都出卖？


    「李想，出来跑江湖有两个『保险秘诀』，一，就是要演技；二，就是要懂得说模棱两可的话。你给予他人的指示绝对不能很明确，否则你本来很有料，也变得没有料了。总之那些头脑停留在石磛时代的人就是犯贱，喜欢拿钱出来给江湖神棍骗钱，交了学费后心里才会舒服。」


    李卜又摆起扑克牌脸孔，对李想耳提面授，每次的说教总是夹杂了江湖骗子说话的守则。


    张紫怡从中斡旋，插嘴叮咛着这个不通人情世故的初生之犊：


    > 「李想，超仁现在已经检查过身体，全然无恙，即使我们事后孔明告诉他，要是我们在，我们一定会吩咐张虎送你到台大医院，可是超仁已经在和平医院了，你爸的说法，无异是门面话……」


    > 「我知道，这就等于你看到人家买了珠宝钻石，你问她价钱，一旦对方说出个价码，你就可以用两个选项的话术来包装，第一个包装的方向是显示自己是内行人的高价值；所以你就告诉对方，哦，我认识某某珠宝店的老板娘，以后你要买珠宝我可以带你去她的店，我帮你杀个好价码，像你手中的珠宝，我可以用比市价低一倍的价格购得—老妈子我明白，这时对方已经有了珠宝，她断不可能这么快买第二次？第二个包装的方向，是要让对方爽呆了，就是进行马屁术的包装，因此你可以露出惊讶的表情，哇塞！以赞叹的口吻说，真的又便宜又珍贵……」


    李想像孙悟空驾上筋斗云，把话题胡扯到十万八千里的外太空去了。


    李卜与张紫怡交换了眼神，各自摇头叹息，神色扭捏。


    张紫怡担心李想继续胡扯不停，故意转换了话题：「真巧，张虎喝醉酒撞到自己的同门师兄，说起来，超仁三起大劫已经过了……」


    「紫怡，你刚才摸过超仁的头颅，你有什么发现？」李卜兴致勃勃关心地问。


    「卜哥，我刚才摸过他的恋爱中心，发现已经变得扭曲，而他的战斗中心却异常的活跃。但不知何故，他的额叶部份却无敌地闪烁光芒，像是有过神秘的宗教体验，或者试过灵魂出窍。」


    张紫怡凭着她的那双灵通的玉手摸过上万个头颅，即使她的脑壳神算法并非百分百中，但不中亦不远矣！


    李想别过脸看着窗外，无心听李卜与张紫怡的讨论—一我虽然有神通，但论演技总比不上爸妈，然而，我是一个很实际的人，我才不管爸妈那套什么狗屁不通的包装话术。


    「紫怡，你还感应到什么？」每次李卜无法以理智分析时，如果不是依靠紫怡的起乩，就是要求紫怡的手通灵能。


    紫怡十二岁时，就曾在台湾东吴大学李侗岑教授「难以置信信息磁场的网站」做过实验。


    「我所接受到的讯息磁场是，他对我们内心充满恐惧、怀疑，对我们有了一层隔膜与防备。嬉皮笑脸纯粹是不信任的障眼法。」紫怡的杏眼圆睁，神情怅惘的徐缓道末。


    李想趁着绝佳时机毛遂自荐：「爸，既然如此，就由我来接手他的『乌鸦计划』，而且黎敬平和他的孩子、加上胡紫怡，都是我一个人，没有超仁的帮助下被诅咒成功的。」


    正襟危坐的李卜隐忍心中的怒气：


    「你还敢说，我有要你诅咒他们吗？你在电视节目上胡扯，柯总还打电话给我投诉你的不当言论，你没有按照剧本宣读！」


    「我说的比他们的剧本好听，你没看到今天的新闻吗？我的话题引起网络上热切讨论……」


    「你还敢说？节目中你差点露底了，说什么加入玄门正宗可以避开乌鸦的诅咒，这句话是你说的吗？即使要带出这个讯息，也是我们信徒说的话，你……」李卜恨不得赏给李想两记耳光。


    张紫怡赶忙转移话题：


    「李想，我以触摸过超仁多次，发现他体内有一股不能控制的凶猛之极兽性。这股兽性不是普通人所有，所以，我们需要他最大的诅咒灵力，而他是那股野兽会在三次的大劫后被召唤而醒来……」


    紫怡知道自己孩子的脾性，若任由这个话题胡扯下去，李卜会忍不住骂他，而李想情绪激动下，又起弘请出战斗圣佛加入讨论，那时候就头大了。李想被卷入思想的死胡同之中：


    我实在不明白，为什么我们这种有神通灵能的特异人氏，需要听从一个什么鬼神力都没有的平凡人？！


    难道正如老妈子说的，神通抵不上智能？


    我最不服气的是，常听到老妈子的金玉良言：印度八十四位大神通者今天何在？


    中国的儒家思想就规范了我们中国人多年，一个思想家抵得上八十四个神通者，而这两句又是精神病院全神七煞说的话——其实根本无法比较，简直是狗屁不通！


    李想看善李卜，李卜暂停停车后，闭目养神背倚靠著座椅，就像老僧入定，进


    ## 第二话


    入深层思虑之中。


    老爸，你该说话啊！


    李想打开灵眼，看到老爸头上的暗黄色光线闪烁不定，很显然他内心万分焦虑，心境郁闷。李想那从未失手的第六感知道——李卜想着的不是黎敬平惨死事件，而是感受到山雨欲来风满楼的不祥预感。


    排山倒海地警示着举棋不定的李卜，这个布局已经陷入竭蹶状态，下一步棋的张力非同小可，禁不住任何的差池，所以需要精打细算，并深谋远虑，万万不可轻言妄举。


    「玄门正宗」得以发扬光大，全靠李卜的运筹帷幄。


    而李卜的所谓《易经》无敌神算法，根本就是以虚构与胡扯构成的问话骗术。


    他故弄玄虚之余，还得靠老张紫怡的触摸灵通能力，看到未来的信徒脑中的讯息磁场。


    李想看到李卜头上的光色刹那间一变，由暗黄色变得清晰起来，渐渐转成白色——老爸想通了。


    李卜重新发动车子，加快车速回到他们金碧辉煌的豪华别墅，也是他所谓的狗窝。


    ## 第六章


    李想心中郁闷回到房间，他躺在床上，百般无聊。他找到了遥控器，打开电视，漫无目的地瞪着屏幕，茫然无视，电视的光芒闪烁着，让他昏昏欲睡……


    ## 李想遗失的记忆 6


    我眼前的世界诡异而迷幻，面前是空荡荡的一大片四维空间，四周充斥着各种各样、色彩斑斓且不停滚动着的迷雾，还传来高频的天籁竖琴声。


    极目之处，看不见地平线。


    眼前的道路九拐十八弯，弯道毫无规律不停变动着，而且好像不断在延长，毫无止尽。


    更玄的是，周围的景色不断后退，即使我的双脚紧紧地钉在路上，一动也不能动。


    脚下的道路仿佛安装了滑轮，或像是水平式电动走道，以大约时速 10 公里的速度不断前进。这里没有光明的隧道，但却像是一条怎么走也走不完的道路。


    这里很像传说中，生命结束后的移动式走廊。


    不知不觉，我被钉着的脚终于能够移动。


    我一直大步跨走，发现背后有笨重的脚步声，我转身看到一个胖子满头大汗，垂头丧气，喘呼呼跟在我的后面。


    我必须尽快摆脱他的跟踪，于是快步继续向前走，突然，走道前面出现一道大门，把我吓了一跳。


    可是，接下来并没有再发生任何不寻常的现象。


    > （老天！到目前为止，这整个四维空间和所有现象，有什么是寻常的？是我电影看太多了吗？还是想象力高人一等？）


    我定一定神，把门轻轻推开，看到一个身材如可口可乐曲线瓶那般，穿着粉色丝绸肚兜和白色迷你裙的女人，笑嘻嘻地招呼我进去。


    我在半推半就之下走进去，这个长相很常见于 A 片的女人便迫不及待躺在床上，张开双腿，一双闪烁着的妙目，望着我发出无声的媚笑。


    她裙子底下没有穿内裤，我看得目瞪口呆，嘴巴张开得能够吞下一个沙锅大的拳头。


    她继续向我招手，于是我像碰上漩涡一样，不能自主地被卷进一片湿漉漉的沼泽地，我还发现胖子跟我一起被漩涡强力吸了进来，我在狭窄空间中被迫得紧紧贴着胖子的胸部，胸部贴胸部，我们俩不断的往下沉陷。


    我心神陡然一怔；之后什么知觉都没有……


    忽然「轰隆」的一声响，在一片闪光中，我看到一个人躺在手术床上。四个人团团围着他，挡住了我的视线。


    ## 第三章


    我看不清楚这人的相貌，但我确定自己的前方正是这个人的头部。


    其中一位戴眼镜的青袍人，指着被剥开的头壳说：「你们看！这里，这是什么？」


    另一位略胖的中年青袍人用抽吸器将血清走，戴眼镜的青袍人吸引了我注意力，我想趋前看清楚，谁知道又来一位穿着同样青袍的年轻人挡住了我的视线，同时还有嘟嘟噼声不断干扰着我。


    我不耐烦的大声高喊：「你们让开一点好吗，我要看看！」


    房间里只有手术仪器发出嘟嘟噼声响，还有振荡着耳膜的回音，但就是没有半个青袍人鸟我，连头也不回过头来看一下。


    接着房里变成一片漆黑，好像电流被中断，可是其他人连呼哧声都没有，好邪门！


    我突然感到一阵恐惧，我很冷，而我也发现自己还紧贴着胖子的胸部，奶头贴奶头，胖子他也不断颤抖着，我好像就是他，他也好像就是我，我们快变成暹罗连体婴……


    我不喜欢这种感觉，我用尽力气不断挣脱他。


    正在这时，响起一阵似有还无的音乐之后，天花板裂开，一道彩虹从天而降，恍惚间我看到一个轮廓模糊的女人身影单脚站在彩虹上（我会认为那是一个女人，自然是从她苗条的身段判断）……


    我全身不能动弹，突然，床边多了一个人的手臂。


    我愕然，还来不及有所反应，另一只手臂又从天空掉下来了。


    这双手臂死命的掐住了我的脖子。


    我无法呼吸，而且快要窒息了，使尽吃奶之力想摆脱手臂的纠缠，但四肢却不听我大脑发出的指令。


    我感到全身的力气正渐渐消失……


    干！我死定了！


    耳边彷彿听到一大批白乌鸦七嘴八舌的粗劣嘶哑声：「呝……呝呝……呝……呝……」


    我开始全身鸡皮疙瘩，打了无数次的冷颤。


    接着，我又看到胖子的身影——死胖子你是谁？你给我滚开！


    但我却喊不出声——你给我滚开，马上离开这里！


    我依然喊不出声，依然紧紧被一双脂肪过多肉的肥手掐住我的脖子，我毫无缚……


    ![](img/237675b87ee3b5bddaa78c410bf9f326_112_0.png)


    鸡之力，没有能力反抗。


    我最后的知觉只知道，我又紧紧贴着胖子的胸部，奶头贴奶头，接着我整个人被吸进胖子的胸部，只剩下头部露在外面，我觉得自己出头壳很冷……很冷……


    □   □   □   □   □


    怎么可能，怎么可能他会是他，李想捂着脸啜泣着，蜷缩成拳头的双手猛扯自己的头发……


    「哇！」一声大叫，李想吐出一口鲜血，再度昏厥，李卜与张紫怡冲进房间，拍打着李想的脸颊，李想已经昏迷不醒了……


    「快、快，送李想到医院-」


    □   □   □   □   □


    「怎么可能……这怎么可能呢？」


    猝然间，一个人喃喃自语起来，诧愕的声音回荡在渺无人迹的房间里。


    「这应该是巧合吧？！对，一定是巧合！这是幻觉，不是我的记忆……


    不过，我仅存的残遗记忆是，我确实是去过兰卡威岛，而听爸妈说过，回程中在怡保的椰壳洞这死亡公路上，确实是被一辆车从对向车道撞过来，结果造成连环大车祸，十死三重伤，他们发现我时，好像说我双手抓住一个人的头颅……]"


    这个人神色凄惶，额头冒着点点汗珠，不断比手划脚自言自语，在只能容纳一只四脚兽的狭小空间里来回踱步。


    「但，怎么会这么刚好呢？！怎么会………


    他耸耸肩，叹了一口气悠长的气，仍然在脑海的暗室里寻找藏着答案的宝盒。


    「今天梦中幻觉的车祸情况，怎么会和我从吉隆坡被送回台湾时，我那段失忆的时段，与爸妈所胡乱描述的情况简直一模一样呢！」这个人脱口说出了这句话。他不是别人，他正是司徒超仁。


    「这是我的幻觉，梦境内容和我一点关系都没有！」超仁好声好气的安慰自己。


    「这件事不关我的事……不关我的事………不关我的事……不关我的事……不关我的事………不关我的事……」


    超仁不断的催眠自己，告诉自己刚才的梦境一定不是真的。


    顷刻间，超仁敛容正色，安静了下来。


