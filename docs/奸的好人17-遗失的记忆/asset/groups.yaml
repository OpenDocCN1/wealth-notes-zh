  - '[PAGE 5]


    我从钱包拿出六张马币五十令吉的纸钞洒在她的脸上，头也不回走出了房间，独留她颓废地坐在地上啜泣着，我虽然没再看她、但我想她的嘴唇是一直颤动着的。


    对我来说，这才叫做「酷」！


    □


    Angclin，是我替她取的洋名。她有古铜色的皮肤，还有那超性感的丰厚朱唇。


    我每次上她时都猛力拉扯她的头发，毫不客气将她的头大力压在床上，疯狂地掌掴她。


    我想看她泪流满面向我求饶。每一次我都乐在其中，很享受这种皇帝式的待遇。接着，强迫她用丰厚的双唇为我「服务」，到了欲仙欲死的瞬间，我就会粗着脖子高喊：「AngelinaJolie！」


    —对，你猜得不错，我床头正是有一张 Angliajolie 的大型海报、她是我青春期自今的性幻想对象之一。


    我的 angelina，双唇与 G 奶，酷似国际性感女星 AngelinaJolie。有了她之后，我是多么的性福！


    她与我之间的暧昧关系，谁都不能够知道，尤其是我的爸妈……


    □


    她把行李搬上车，我袖手旁观。


    我想，从今天开始，让我们重生吧！一切就按计划进行，宝贝！


    我真希望全世界的人都看不到我不经意在嘴角流露的轻蔑笑意。


    一切就按计划进行。我内心泛起，一阵快意，多么刺激的游戏！


    —


    当然，我从没想过，这个天衣无缝的计划，竟从此改变了我生命的轨迹。


    更意想不到的是，这个世界也托这个计划的福，变得更加多姿多彩。


    往后的日子，也因为这个计划，使我成为世界瞩目焦点人物、各国媒体的新宠儿、采光灯下的男主角，连台湾总统也透过特别管道暗暗地召见我，日本还派出金神七煞刻意地讨好我。


    中共更派出密探暗中想尽办法监视我，中共这只可爱的洪水猛兽，无论如何都不愿任由我返回「祖国」，进而壮大敌对者的声势。


    不过，当初我策划这项计划时，从没想过这个计划会脱序演出，无心插柳之中'
  - '[PAGE 6]


    将我改变成如此「重要」！


    不，其实严格来说，我和这计划都渺小如蝼蚁，出发点也是意外的单纯：


    > ——只是要教训自己的爸妈！


    □


    「baby，上车吧！」我轻轻拍一拍她富有弹性的臀部——多么结实，又具有线条美的臀部！


    # Baby 我会永远怀念你的……


    我上了车，启动引擎，用力踩着油门，让这辆马来西亚国产车 GEN-2 发出轰隆隆的吼叫声——很喜欢这辆被改装过的 GEN-2，就因为它的吼叫声够刺耳，并夹带一丝丝的撕裂声。


    我哼着愉快的曲子，轻拍着方向盘——老二，今天得靠您了！


    无理取闹的老爸没收了我的 Ferrari 跑车，又惴惴地买了这辆 GEN-2 给我口口声声说是为了我的安全，司马昭之心却是不想让我开快车，令我愈想愈干！


    「轰隆隆-」大马力的引擎发出咆哮巨响后，GE2-2 发动了，迅速穿过别墅大门；方向盘一转，即出了主要干道，我用比 Ferrari 跑车慢三倍的速度，直奔通往马来西亚北部的高速公路。


    □ □ □ □ □


    李想从睡梦中弹跳起来，坐在床铺上，头皮发麻，牙齿打颤，喉咙干涸，猛吞唾液，冷汗直流，双手无法控制的颤抖着，心里感到凛冽的寒意，还打了五个连环哆嗦。


    这个梦挺真实的，好像是他生命中一次难忘的经历：即似曾相识，又全然陌生......


    不过李想那从未失误的第六感告诉他，这段记忆像是电脑中被删除的档案，是一段遗失的记忆。


    于是他盘腿静坐，几下深呼吸，就感觉自己像是进入一片光明当中......


    他将注意力放在脑部，想透过精神的力量进入海马中，以神通力量看看脑部最深邃的地方，也就是大脑研究专家说的最古老的脑，制造回忆的部位。


    他的神识经过如海星形状的神经元。


    自从得到黑暗的守护神引领，进入脑内「旅游」多次，李想已经没有兴奋的'
  - '[PAGE 7]


    感觉，不过他却认定神经元的触突像极了电影《阿凡达》的神树。


    抵达了左右两边的头盖骨，如两把镰刀半弯的形状，顶住一个洞穴的入口。


    他用灵力内观这个狭窄的隧道，其实这里就是左右脑传电作用的峡谷。


    他继续深入峡谷中，看到一道光芒似螺旋，转着圈圈向他靠近。


    接着，一页又一页如照片平面的图片飘过他的面前。


    他不自觉说：「哦，这就是记忆拼图。」


    他用右手的食指在一张纸图片前划过，像是控制着虚幻的触控式荧幕。


    图片很有节奏的跟随着他的手势，从右到左移动着。


    他抓住其中一章图片，伸手进入螺旋式转圈圈的光芒中，再取走一张图片。


    「咦？这不是昨天的画面吗？」


    # 「李想的记忆图片」


    傍晚时分，我独自行在一条熙来攘往的街道。


    有一个少年，可能从电视上知道我李想的大名，趋前来向我追问前程。


    我最讨厌不付钱而想占我神通便宜的信徒，于是偷偷在心中对着他起了诅咒，笑咪咪告诉他：「你犯了飞鞋煞！」


    少年一脸雾煞煞地问：「请问大师，什么是飞鞋煞？」


    我耸耸肩膀，无可奈何地摇摇头说：「天机不可泄露也……」伸起权威一指，指向前面行人道的转角处。


    少年充满好奇的走到转角处，我远远随后跟着他。少年刚一转入转角处，中间店铺有一条黄金猎犬莫名其妙向他狂吠了起来。


    少年当时愕然不已，神情凄惶，不知所措的僵在原地，像是在玩 123 木头人那样。


    此时此刻，手上没有任何武器的他急中生智，迅速脱下左脚的 NIKE 球鞋，并把球鞋高高举起作势要打狗。


    以「兽性」看懂「人性」的黄金猎犬并未受到吓阻，反而吠得更厉害，一发不可收拾。'
  - '[PAGE 8]


    少年作状要将鞋子丢过去。


    谁知道，球鞋不小心脱手而飞……


    「啊！惨了！」才喊出半句，鞋子不偏不倚命中了黄金猎犬。


    「sorry……」少年心知不妙。


    被激怒的黄金猎犬，有如发现自己被戴绿帽的妒夫一样，发狂朝著少年扑过去。


    少年为了闪避这只兽性大发的黄金猎犬，一时间无法顾及马路上川流不息行驶的車輛，就惊慌失措冲到马路中央。


    紧接着、传来「砰」一声巨响，少年被一辆箱型车撞得飞起来，被抛离数里倒在地上，口中吐著鲜血，下身尿液齐出。


    他双眼睁得像条眼睛凸出的死金鱼，在呼出最后一口气前，嘴巴一张一合地翕动著，且像道士催符念咒般念念有词，好像是念著：「飞鞋煞……飞鞋煞……」


    奄奄一息的少年，身体抽搐几下之后终于断气了。


    我穿过围观的人墙，众目睽睽下蹲在少年的尸体旁，并感叹地睥睨著少年反白的眼睛。


    过后，我好心把少年的眼睛合起来，让他死也瞑目。


    「嗡咕噜李想悉地呼……」


    念一念我的心中心咒，这句咒语隐藏了我修练成功的秘密心法，真希望这个时运乖戾的无名氏一路好走。


    我不疾不徐的站起来，向围观且窃窃私语的路人甲乙丙丁等点点头示意，接著仰起头，双掌合十，面朝橘红色的夕阳，以大家听到的声音朗诵：「嗡咕噜李想悉地呼……愿你得以往生西方极乐世界，嗡咕噜李想悉地呼……」


    不出我所料，我听到议论纷纷的众生传来一阵轻呼：「是李想菩萨！」


    随后惊叹声此起彼伏，人声鼎沸，不绝于耳。


    说时迟，那时快，一个年迈的瘸子鹅行鸭步的走到了我面前，一个屈膝就紧紧抱著我的小腿，并激情地轻吻我的脚无数次。


    见惯大场面的我也为之愕然，浑身鸡皮疙瘩，不过很快就进入状态。


    随后，在羊群心理的发酵之下，很多围观的众生也敛社跪下，双手合十向我朝拜，并跟著我一起朗诵：「嗡咕噜李想悉地咿……」


    沸沸扬扬，气势磅礴，场面冠冕堂皇。'
  - '[PAGE 9]


    微风拂照，我洋洋得意的双手合十，闭起双眼，深呼吸后仰头瞪着老天生。用内在的话语跟天空上经过的空行母说话：『嘿嘿，没有神通力量的老爸兜鼐老底（注广东话，意思是指将底牌全给揭露出来了。）告诉我，作为一个出色的神棍，必须要有适当的演技，在适当的时候表演出来。』


    『不过，我李想绝对是有真实实证，兼有有神通力量的『光棍』，所以我给自己这个现场的表现一百分。』我把目光望向群众。


    『『棍』这个字，在现代人概念中具有『骗子』和『无赖』的涵义，现代人将棍解释成『棍骗之徒』。但我绝对是有神通力量的『光棍』，我一旦要索取钱财与美色之时，善信若不听话，他肯定会死得很惨，就像这个少年这么惨！你说，这有哪一点像『骗』？』


    我很怀疑，若我用内功将这些话传开，到底会有多少人有他心通，听到我内在的声音；


    我脸上绽放笑靥，对着这群众生流露完全属于我个人特色的微笑魅力，刹那间陷入一阵沉思：


    你们知道吗？


    我多么想一而再、再而三告诉大家，我是有神通的光棍。


    当然，你们这批路人，也许以为光棍是指成单身或未婚男子的意思。


    在明代，光棍是流氓的意思。明代对于流氓的专用称呼是破落户，这个破落户并非指家道破败，而是指「不务正业」。


    光棍这个词在清代也是指流氓，由此还发展出称乎流氓的「棍」系列。


    我很喜欢看古惑仔电影，喜欢看黑社会电影，喜欢流氓，喜欢瘪三，喜欢痞子。


    一言以蔽之，我是有神通力量的古惑仔、黑社会、流氓、瘪三、痞子。


    所以我又不同意洞悉内情的老爸，说我们是神棍，他的定义认为我们是骗子，是旁门左道。


    第一、我不是骗子；第二、我比较像流氓。


    我只不过是视规矩矩的帮人看命，也是你情我愿的。


    所谓收人钱财，替人消灾。


    错就错在我有神通！'
  - '[PAGE 10]


    如果寻命的信徒付不起消灾解难的祈福钱，他肯定会遭受报应！


    这不单是我给予他应有的惩罚，还是得罪神而应该遭受的天谴。如此而已。


    □


    我端详着这个翘辫子的少年，得意的神情不自觉表露于面上。「对，这就是我的神通，嘿嘿！我不熟神棍，但我也是神棍！」


    我必须在警察和记者到来前离开现场。


    □ □ □ □ □


    看着记忆图如动画显示的李想，对自己发出自豪的狞笑，而且感到一阵惬意。


    他既自恋成狂地认为自己是天命所归，又觉得他在替天行道。


    「来吧，来找我算命吧！我是赫赫有名的铁口直断，想贪小便宜免费问我前程，我随便一句飞鞋煞，你就需要惨死当场。如果你想要深入了解我的特异功能能力，无上欢迎，请先投保写遗嘱，贾祸自负。


    哈哈哈哈哈，看来我真的很神！


    不，我看来和实际上都很神！」


    李想自言自语，很满意地举起这张记忆拼图，他爽呆了。


    靠！不过，我不是寻找这张记忆拼图。


    于是他用往上一抛，拼图又碎成小片，像碎花纸洒落下来。


    螺旋转圈的光芒将记忆碎片吸了进去，李想刚才在记忆碎片上灌注了灵力，因此他的灵力能够自动感应他要寻找的记忆。


    他手中拿到刚才梦境中的记忆图片，灵力从手指传递给他讯息，发出警噎：


    他的海马内存，被一只神秘又强大手掌，将内里一大堆记忆拼图用内功震得粉碎！


    他看着这张梦境出现的记忆图片，被震得支离破碎，还有烧过的痕迹，随着这个脉络寻找下去，他发现脑部竟然还有很多相同的碎片……


    「妈的！干！操你奶奶的，到底是谁？是谁干的好事？」他咆哮狂怒！


    □


    从静坐中恢复了神识的李想，内心很忿怒，同时又很恐惧，甚至有許多解不开之谜……'
  - '[PAGE 11]


    他在一张白纸上写着：


    (1) 到底是谁，在我头脑用功力震碎或烧毁了我的记忆拼图，哪一个鬼崽子有这个功力？


    (这个世上有这等功力的人应该不多，连我老爸李卜或老妈子张紫怡都不能！)


    (2) 即使有这份功力，他也需要摸着我的头盖骨发功，毕竟震碎记忆图片不像诅咒术，可以远距离发功。


    (这个世上谁能如此接近我？难道他会隐形，难道他趁我熟睡中进行，难道是死胖子？不，死胖子绝对没这个能力、)


    (3)「凶手」这样做的目的是为了什么？动机是什么？


    (4)「凶手」震碎了我的记忆拼图，会得到什么好处？


    (或者，我脑内的记忆到底隐藏了什么关键信息，而这些信息对震碎我记忆拼图的人，会有什么影响呢？)


