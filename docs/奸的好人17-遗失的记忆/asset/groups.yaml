    电话另一边，简谋略拿着话筒，另一手摸着下巴呼之欲出的粉刺，微微笑说：


    「唉呦！钟杰克啊，我可不会傻到打电话和你透露我有两个同性恋男友吧？这是调查案件中两个重要关键性人物啦，我可是用了夺命连环的高度连续调查技巧找出来的喔，可不像《芭蕉日报》或《香蕉日报》那种，找挑那些花边新闻究版面下的三流的记者可以相比的。请你别忘了，我也是这家公司的投资老板之一，不要对我妈的来，妈的去啦，那我可用秘密案件多寡来收费喔，哈哈哈！还有一件事，就是……」


    谋略话还没完，钟杰克已狠狠地把电话给挂断。


    谋略当下就像川剧变脸一样，收起笑眯眯的脸孔，双手握紧拳头，下弦月型嘴型渐渐随之浮了出来，心里一把熊熊的无名火也在闷烧着。简谋略冷冷的拿着一台跟随他上刀山下火海的笔记本电脑，盘坐在神桌前的供桌上，快速打开了计算机，从活页夹里建立一个档名：「老虎蹲下，是准备大跃起！」


