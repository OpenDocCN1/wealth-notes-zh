  - '[PAGE 81]


    的电邮，透露风声让《芭蕉日报》加油添醋地报道，影射黎敬平也收过乌鸦的电邮，因为没有交祈福金，而被乌鸦进行诅咒。


    甚至《芭蕉日报》还言之凿凿说，黎敬平曾透过乌鸦的诅咒杀害仁义党前任主席，导致前主席一家五口车祸惨死，今日黎敬平自己玩火自焚了。


    李想几乎读完所有的报纸，连网络新闻也不放过。


    报导得最详尽的是《芭蕉早报》，最诡异的是《芭蕉日报》谈及邪术诅咒。也许因为《芭蕉日报》渲染的影响，不知道何方人物，竟然在一天内成立了数个乌鸦诅咒的网志，脸书上也有数个自称乌鸦的粉丝专页，一天内竟然有一万多人按了赞成为粉丝。


    李想这个本尊看了洋洋得意，他觉得愈是混乱，对他们的计划愈是有利。


    ![](img/237675b87ee3b5bddaa78c410bf9f326_81_0.png)


    柯桢制的助理一踏入房门，随手指房门给关上，打开活页夹，递交一份厚厚的剧本给李想。他接过后快速翻阅，剧本内容其中一段对白是标明要李想说的：


    诅咒的力量，无影无形，拥有置人于死地的威力，是传说中最令人胆战心惊的黑巫术。


    诅咒主要有两种，一种是某人因为触犯了某些禁忌而被引发；另一种是，委托黑巫师，为心怀怨恨的人报仇。


    所谓第一种触犯禁忌的诅咒，最著名的是埃及图坦卡门墓地的诅咒。其碑上刻着：「要是谁打扰了法老王的安宁，死亡就会降临在他的身上。」


    1923 年，有一支考古队打开了图坦卡门墓地的大门，发现了法老王的金棺。其中一位卡纳冯爵士被蚊子叮了一下，就一病不起。他去世当晚，整个开罗出现不明原因的停电。同时远在英国，卡纳冯爵士的爱犬也不明原因突然暴毙，时间与爵士的死亡时间相吻合。


    当大家检验卡纳冯爵士的尸体时，发现他左脸上有一个很明显的红肿地方，竟然与法老王左脸的伤痕吻合。跟随爵士考古的队员，如学者阿瑟·梅斯莫、南非富豪裘尤、解开法老王墓尸布的考古学家亚奇博尔特，之后也都一一离奇身亡。


    李想默读到这里，心中实在火大，将剧本摔在一旁，心想：「妈的，又是这些制作人不知在哪本抄下来要我念的对白。要我记这么复杂的对白，根本就是狗眼看人低，瞧不起人！我才不会去记，我会用自己的方式演绎。」'
  - '[PAGE 82]


    剧本所包含的，无非主持人的开场白，节目的开端对白重点，接着是发展与转折对白，还有高潮的对白。在高潮的部分，通常都会有一个梗。


    这也如同相声。相声中会有两个角色，一个角色会说很多，不断的说出笑话让人发笑，而且还会制造一些矛盾，是相声的主角，这个角色称为「逗哎」；另外一个角色，则会扮演聆听、接话搭腔的角色，是为「捧哏」。捧哏会为逗哏推波助澜或力挽狂澜，把梗推向高潮。捧哏往往戳破逗哏的矛盾点，引发笑点。


    不同于相声中的哏，综艺节目中的哏往往一戳就要破，当场要引发笑点。


    因为毕竟节目中有很多人，而时间有限，观众的专注力也有限，不能像相声那般，长时间只把目光放在两个人身上，因此哏不能拖延太久。


    活页夹里面的剧本，只有李想的地方空白，剧本中已经做了密密麻麻的记号，只要单单阅览一番，就知道节目的高潮在哪里，其他艺人的精彩对白与麻辣笑话在哪里。


    柯总监领教过李想多次在节目中的胡言乱语，甚至往往离谱十万八千里。虽然如此，他的疯言疯语却引起网络上广泛的讨论。


    不过柯总监还是小心为上，不希望惹上任何官非或非议，也不希望被 NCC 国家通讯传播委员会请去喝咖啡，更不希望因为违反「电视节目分级处理办法」相关规定，节目被迫从《保护级》升华到《辅导级》或《限制级》。


    这个临时腾出的节目叫：《关键时刻：诅咒和降头》。


    这是一个新的环节，特地为黎敬平与胡静怡的惨死量身定做，因此节目开始时，屏幕会打上：


    【本节目属于保护级，未满六岁之儿童不宜观赏，六岁以上未满十二岁之儿童需父母、师长或成年亲友陪伴观赏。】


    李想与主持人走入摄影棚，主持人先做了一番介绍：


    > 「全国的观众们，大家晚上好，欢迎你们来到《不可思议》这个节目，我是《不可思议》灵异感应特工队的大队长大宾宾。今天在节目中，将会和大家讨论两个个案。这两个个案都有一个共同点，跟今晚的主题《降头与诅咒》有关。」


    > 「同时今天我们在节目中，很荣幸的邀请到了来自玄门正宗的李想大师，跟各位一起讨论《巴蕉日报》所大肆报导的《黎敬平与胡静怡被乌鸦神秘组织诅咒惨死》的个案。节目开始，首先介绍：坐在我右手边的，这一位最厉害吶，他就是大家都认识的响当当人物，是城中人气爆表，有《现代人的活菩萨》之称，亚太地区最著'
  - '[PAGE 83]


    名的神通大师，也是台湾第一玄教『玄门正宗』未来接班人的李想大师。李想大师，您好。」


    李想看了主持人一眼，清一清喉咙，期期艾艾对着镜头说：「主持人好，大家好，观众好，你们好，在美国的爸爸妈妈好。


    坦白说，我是一个不喜欢，也不习惯跟人间好的人，我的左眼比较大是因为我可以看穿三界九地二十八天，你们看到吧……」


    李想用食指指着自己的右眼角，。


    「……我这个招牌右眼的眼角，有一道疤痕，就是说这道疤痕可以上入天入地，表示我的右眼可以窥破十八层地狱。看了我的大小眼，等于是我给大家最高的上天祝福，也给大家长寿的祝福，因为我可以帮助你们地狱除名，删改生死簿。」


    李想虽然语无伦次，却也露出自傲中丝毫不谦虚的神情，像是迷醉其中。


    「李想大师，你有没有听过乌鸦这个神秘组织？」主持人大宾宾开门见山，单刀直入。


    「当然听过，当我第一次听到乌鸦这个神秘组织时，就让我想到一个法律问题，我想严厉的质问现代最权威的法學顾问：请问法庭会相信诅咒这事吗？」这时李想的右手伸出食指，语气充满挑衅对着镜头说话。


    「警察、法官、律师们，你们统统给我听着，如果一个人想消灭他的敌对者，请杀手杀人，被警方查出主谋，这个人就会被定罪……」


    李想狞笑着，转过头看着主持人，主持人禁不住打了一个哆嗦。


    「但是，如果一个人会邪术降头，他用降头或诅咒的力量杀人，请问如何定罪？施术者，有不在场的证据，可以远距离杀人，却没有人证与物证可以证明他杀了人，请问法律如何定这个人罪！」


    李想特意将语气放轻，彷彿自己就是最大的胜利者，而语气简直是向警察与法庭宣战。


    「我这里有一个比喻：这就等于陈先生瞪着他的仇家，然后他回家之后躲在厕所，一边打手枪，一边诅咒他的仇家被车撞死。结果，就在陈先生坐在马桶一边大便，一边看《神棍》，一边挖鼻屎放进自己的嘴巴时，他的仇家在同一时间回家，结果被卡车撞死；或者那个仇家过马路不看车，被跑车撞死；或者那个仇家爬山不小心跌死；或者那个仇家被蚊子咬过之后，第二天就离奇暴毙而死，那么法律如何定陈先生的罪！」'
  - '[PAGE 84]


    # 第二话


    李想的语无论次一发不可收拾，已经偏离了剧本几十万年，还举起拳头对着镜头摇晃着示威。


    柯总监气得暴跳如雷火冒三丈，在摄影机后比手画脚，向李想指着镜头后工作人员举起的大字报，示意他照着剧本宣读。


    主持人先是愣了一下，不知道该如何应对，不过他总算是经验老道，马上接口道：


    「对了，李想大师，您是不是想要说，即使真有乌鸦这个神秘组织，也无法证明乌鸦杀过人，甚至也很难有证据证明他们施邪术杀人，而法律更难以对降头或诅咒等邪术定罪。】


    但说到这里，主持人已经冷汗直流了，心里毛毛的。


    「其实，你们误会了，以为黑巫师、降头师，或者乌鸦神秘组织才会诅咒。事实上第一个进行诅咒的不是人，而是神！」


    李想说出「神」这个字时，挺起胸膛，双手举起的拇指让自己的胸部指着。


    「你想想吧，谁要是不听神的话，神就会对人进行诅咒，不是放大洪水，就是要人好端端的变成狼人，或者变成动物。后来的巫师会诅咒人，也是向神学习罢了！」


    李想露出「你们根本都不懂」的不屑神情，看着镜头。


    事前从未准备的李想，信口开河又是一番叹观止矣的伟论：


    「……换句话说，你要成为神，你除了要会降福给人之外，你还要拿捏惩罚的力量。


    就好像做父亲的，在办公室受了老板一肚子鸟气，回家后孩子想亲一亲、抱一抱爸爸，要缠着爸爸说故事其实说故事只不过是那区区 15 分钟，但爸爸还是没有耐心的狂骂孩子打扰他，说孩子不听话，就惩罚孩子。爸爸一定对吗？不知道，很难分辨，我的意思很简单，神惩罚人类其实就是进行诅咒。】


    主持人大宾宾苦笑了一下，摄影棚外的柯总脸黑得像锅底，脏脏话都飙了出来，不过李想却无视大家的反应，他很是满意自己的真知灼见。


    主持人善意给予李想点拨，希望李想可以转回正题：


    「李想大师，其实诅咒是不是分成两种，一种就是触犯禁忌而被诅咒，而这种触犯禁忌所得到的诅咒，是不是一种心理暗示呢？」


    「我知道你要引导我说什么，其实你只不过兜了一圈，要我说出埃及法老王的


    81'
  - '[PAGE 85]


    诅咒，不过这不是我李想想说的话题。


    坦白说，我看了剧本，我已经忘记了是1929年，还是1992年英国BBC电台去过图坦卡门墓地拍照，结果全组人，没有一个活命回来。1929年还是1992年，我都忘记是什么年份。记年份不是我的专长，我的专长是神通不是历史，所以我们还是不要谈埃及的诅咒。我们不妨看看黎敬平与胡静怡的惨死，有三个可能，第一个是叫做骨指术，第二个叫做蛆虫法，其实是大便虫法，第三个叫忿怒金刚伏魔法。李想愈说愈兴奋，在抛砖引玉之下滔滔不绝。


    「李想大师，为什么你认为黎敬平与胡静怡的惨死是这三个诅咒法呢？」主持人满脸疑惑。


    「呃……呃……哦，我是听说，乌鸦这个神秘组织是靠这三种步入神的境界前一定要学的诅咒法，咳……咳……」


    李想清一清喉咙继续说：「即使我们玄门正宗一向以来都不会公开这些降邪术，除了我之外，我老爸命令所有玄门正宗的弟子都不可以沾这一类的邪术，这个规定的处罚是很严重的，除了会被踢出玄门正宗，还要留下子孙赔谢罪。父亲担心我们学会邪术之后会『黑白乱来』，所以就设下一个如此毒辣的规则。」


    李想说出口之后，顿时觉得说多错多，因此他想转换话题而说：「大宾宾，不如我们谈一谈泰国的降头，好不好？」


    有一种在泰国比较简单而流行的，叫做「纳西杠杠」。『纳西杠杠』的来源很有趣，就是妻子怕丈夫找其他女人，所以她就用「纳西杠杠」封锁自己的丈夫。当她煮好饭，她就会把饭放在地上，打开她的沙龙；坐在饭上，让饭的热气在沙龙里盘旋，让热气在她的私处徘徊，私处所有的汗水就会滴在饭上，当丈夫回来时，就给她的丈夫吃。之后，她的丈夫就不会找其他女人。


    我们最怕的不是纯净的降头术，而是混种的降邪术，就是五毒加上几种邪术混种的。理论上，在降头里面，有分成五种毒物。第一毒就是蝎子，第二毒就是蜈蚣，接着分别是蜘蛛、壁虎、蛇，就是五毒，是降头里面最毒的。就把这五种毒物，放在碗里磨成粉。这还不止，还加上「纳西杠杠」，还有加上女生下体的脏脏水，也就是月经，还加上一个尸油。


    死人的油就是找一个女死者。火葬过后，女死者的嘴巴就会有一种油。而这个女生，也就是女死者必须是处女。特别的地方是，这个女死者要满49岁，施术者念经文49天，不可以停止。念经到了第49天，才打开女死者的嘴巴，从嘴巴倒出'
  - '[PAGE 86]


    油。你要知道，49 岁的处女，而且是死在 49 岁的处女，不是那么好找的。」


    听到这里，柯总监的脸上已经闪过无数次被挑衅的神情，他的剑眉紧皱着，发白的头发快要冒烟，咬牙切齿的静观其变。


    李想继续自以为很高明的自圆其说：


    「把之前的几样东西混合后，念了咒语放在水中，让这个男生来喝。因此，这个男生就中了降头。有的时候，单单要找出邪术的根源，也会耗尽我们很多的时间。所以啊，你说如果要找到黎敬平和胡静怡的死亡真相，我必须煞费苦心，进入七七四十九个阶段的禅定，额头碰他们的额头，我方能进入他们的海马回，才能找到他们的记忆图片，知道事情的真相。


    很少有师傅懂得全面的降头术，我只是其中的少数。因此，遇到混合的降头，如果道行比较低的，就只能破解一两样。又要找根源，因为你很难知道这个放降头的师傅是谁。这就好像解密那样，如果只要破解一组密码，那么是轻而易举。不过，如果有多组的密码，而且密码与密码是重叠的，那么要破解就会比较困难。


    其实道理很简单，要破解乌鸦的诅咒有两条途径，一是给祈福金，要不然就是找玄门正宗保护你！」。


    今天，我李想站在这里向乌鸦宣战，有我们玄门正宗保护的人，凡我玄门正宗的人，都不怕乌鸦的诅咒，乌鸦，你有本事就向我李想进行诅咒吧！」


    柯总监气得跺脚，操足了李想十八代的祖宗。不过他可想而知不到，这个时代里读小说的人，或者看电视节目的粉丝，最爱的就是李想这类胡言乱语，前言不对后语，杂七杂八，没有系统乱说一通的「嘴炮大师」。


    这个现场播映的节目，第二天即引爆一场网络大战，热火朝天，网上也出现了两极化言论：网上的摇旗呐喊声响遏行云。


    李想的脸书粉丝专页，更瞬间加入了数以万计的新粉丝。


    在刚刚现场录播节目中的人，每个人内心都对李想的胡扯与离题感到愤怒与错愕，不过第三大起，李想在灵异界的地位却扶摇直上。


    人生波谲云诡，并不会按照沙盘推演的。这才是人生难得可贵的地方。'
