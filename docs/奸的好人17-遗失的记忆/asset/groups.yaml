    # 『第六章』


    # 『司徒超仁的幻觉』


    超仁费力地半睁开眼，如坠云雾地走到客厅坐下，本能地拿起遥控器打开了电视，就在百多个频道里来来回回转。


    「实在是吃太饱了！干！今天又吃多了，不是说好要减肥的吗？怎么一点自律的精神都没有！」


    超仁就是这样，老是无法控制地做错事；之后又不断责备自己，无止尽的重复这种恶性循环。


    「没关系啦！晚餐多吃一点，这样子半夜才不会想要吃宵夜。」司徒妈妈听到后这么说。那句“慈母多败儿”不是没有道理的。


    「知道啦！」超仁如行尸走肉趴睡在沙发，有气无力地回应。


    「最好是这样！哪一次不是把晚餐吃得饱饱的，到了半夜又开始嘴馋，又骑着机车跑出去买了……」司徒超仁心里这样 OS，不过没有讲出来，因为讲出来只会引来一顿责骂和一阵白眼而已。


    「欧麦尬！好帅哦！敖犬跳舞真的好帅哦！」


    超仁往那如同花痴一般笑声的方向看过去。


    「原来是小妹啊！」他冷眼看着司徒貂蝉拍着手乐不可支。


    司徒超仁的养父养母一共领养了三男一女，除了一个极度优秀，出类拔萃的人中翘楚哥哥司徒孔明之外，还有一个每天好像快乐小鸟的乐天派妹妹——司徒貂蝉，平时除了上学与补习之外，最大的休闲活动就是「看电视」或是「和朋友出去玩」。


    「哥！你快来看！这一段很好笑！哈哈哈！」


    貂蝉又开始看着《我爱黑涩棒棒堂》（台湾有名的电视节目，里面的人都是一些年轻漂亮的美眉和帅气的底迪们，个个都是有才艺的，是许多年轻人喜爱的节目）。


    「逃谢了！我不要！我不想看这种节目，我可不想随他们起舞！」超仁以不屑的口气说。


