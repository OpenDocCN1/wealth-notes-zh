  md: "\n# 神棍之遗失的记忆\n\n那人慢条斯理走进来，站在超人的面前。\n\n「是你？见鬼了！」\n\n站在司徒超仁眼前的，就是他在半昏迷时，幻觉中看到他在自己的嘴里塞进一张黄色符纸的人。\n\
    \n超仁瞪着眼看眼前这个熟悉的人，心里转了数十个念头——他，为什么会出现？\n\n# 第三话\n\n# 「第一章」\n\n接听到手机留言时，李想也不知道自己是不是幸灾乐祸，心里有种中乐透的喜悦。\n\
    \n当他知道司徒超仁被跑车撞飞，跌进水沟，心里确实是很兴奋。尤其第二个消息说超仁的哥哥司徒孔明被地痞打到奄奄一息，李想心里真希望看到司徒超仁一家人灾祸连连。\n\
    \n他觉得，要是超仁死了，那更是锦上添花，连一脚把他踢开的功夫都可以省了。\n\n然而，当他听到最新的留言讯息，发现是超仁亲自打电话告诉他自已已没大碍，这下子又将他快乐的情绪拉入谷底，心中冒起一种不是滋味的滋味。\n\
    \n「他妈的，死胖子，为什么这么多人死，你却不早点死？你总是那么幸运，每次你都死不了！」\n\n此时，李想正踌躇到底要先去医院假惺惺探望司徒超仁，还是回家睡觉比较好。他做了最后的决定：回家休息，假装没听过留言讯息。\n\
