    # [祈记]


    是透过「乌鸦」这神秘组织，以诅咒的力量恐吓政界与企业界。书出版之后，三天内即破了十五万销量，一个月内在中美联邦狂销三百万本，诚可谓前无古人后无来者。


    三天前，他们三人都秘密收到一封由「乌鸦」发出的电邮，限他们在三个月内缴付祈福金，否则他们将面临「乌鸦」的诅咒。


    而世界上只有「玄门正宗」号称能够抵御「乌鸦」的诅咒，换句话说，他们三人的选择就是给「乌鸦」祈福金，再不然就是加入「玄门正宗」。


    杰克收到电邮后，即召集三人开会，杰克透过逻辑推理推断，为什么从没有第二个宗教组织胆敢说能解开「乌鸦」的诅咒，事情肯定有蹊跷！而他们收过无数的匿名信件，都说「乌鸦」其实就是「玄门正宗」。


    「宋钱麻烦你赶紧联络谋略，三十三分钟后我们在『一合相』的图书数据库见面！」杰克说完站起身来。


    突然他眼前一黑，整个房间黑暗了下来。


    摇了！晃了，干！又是地震的余震！


    书房内激烈摇晃震动着，几乎把杰克给晃倒在地，书柜强烈地左右摇晃，彷彿三面的墙壁都将倒塌下来。还好书柜有安置特制防弹玻璃，所以才不至于让书本都四处乱飞。


    书房电灯忽明忽暗，电灯发出吱吱响，不断的噪音十足是泰国恐怖电影气氛。


    瞬间，地不动了，不摇了！灯也亮了。奇怪的是，灯光比刚刚还要亮，简直亮得有点炫目，使杰克瞳孔也缩小了许多。这犹如冥冥中有人在导演这场恶作剧一样……


    「哗！」


    杰克高声惊叫着！


    他的身体四周，慢慢浮出一团黑色气体……


    「我怎么了！」


    他看着自己的身体出现异状，心中怦怦跳个不停，脸上闪烁着恐惧的气色。


    渐渐的，整团黑色气体凝聚起来，把杰克的整个龙躯给包覆住。杰克眼如铜铃，看着这团由气体凝聚成的黑暗烟团，身体彷彿被定格，动弹不得。


    黑暗烟团以迅雷不及掩耳的速度，钻进冷气口。


