    由于臭婆娘想假惺惺地展现她的虚伪爱心，她没有再外出替人算命看风水，全心全意照顾着我——说穿了她是在监视着我的一举一动。


    每星期她都会在家里开班，传授她的「玄门正宗」，集天下术数、风水、玄学，开创出前无古人后无来者的正宗算命法与风水秘诀。


    来听课程的只有三个臭皮匠，一个男的，两个女的。据说这三个都是马来西亚「玄门正宗」的嫡传弟子。至于李卜密法修炼，需要跟随李卜到东京求法，经过严格的筛选，才能有金刚上师的资格。


    举凡「玄门正宗」的传承弟子，所得的供养必须分成三份，一分为自己的生活费用，另一份则是捐赠慈善，第三份必须交付李卜或张紫怡。


    我的身体渐渐康复，元神也渐渐恢复。


    虽然家里的印度尼西亚女佣又看上了我，但因为张紫怡隔在中间当电灯泡，害得我们无法进一步接触。


    每当夜深人静，总有一缕青烟从门缝中缓缓飘入，在房内的空气中慢慢化开，变成两个女人的模样。


    两个女人都披头散发，面色蜡白，吐出九寸长的紫色舌头。


