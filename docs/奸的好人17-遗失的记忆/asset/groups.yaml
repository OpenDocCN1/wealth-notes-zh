    \ 「李想遗失的记忆 5」\n\n进入霹雳州，过了金马伦的入口，高速公路上便出现很多载树桐的大型卡车。我喜欢超越大型卡车的感觉。但今天怎么看不到一辆大型的树桐卡车；我继续踩油门加速前进。\n\
    \n我喜欢快的感觉，我们这个世界压力重重，世界正以惊人的速度飞快地改变，科技日昇月新，速度快得我们无法想象，所以我们不进则退。\n\n二 00 七年有一项研究全球三十四个城市的人走路速度的报告，显示现在的人走路速度已经达到每小时\
