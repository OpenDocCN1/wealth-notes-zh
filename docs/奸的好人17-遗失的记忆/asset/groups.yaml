    前面还有一辆卡车，我必须再来一次。


    Angelina，谁叫你不识趣 触摸我脸上的疤痕？谁叫你问我 Wry？


    我感受到你抚摸我的爱意，我不介意你问我，我也估计你不会介意我的疤痕。


    但我知道爸妈会反对我们。不知道从哪天开始，你的恋情被发现时，爸妈又会从中破坏，我们之间是不 会有好结果的。


    你的牺牲，就当作为为你所爱的我换取日后爸妈给我的自由，这是我目前唯一的理想。


    我知道你是爱我的。我和你上床时，你还会时刻跟我唠叨，家务还没处理好。


    在老母子回来之前，你一定要将衣服烫好，把晚饭弄好……你有太多的顾虑了。


    自古以来，革命总是免不了流血、牺牲。'
