    我的 GEN-2 开得像飞一样快，眼见左边乘客位置即将撞上卡车时，突然，我快速将方向盘转向右边，轻轻松松的超过了卡车。


    没撞上不是因为 我害怕，而是我发现这辆卡车不是载树桐的卡车。


