    \n老爸将玛莉亚打发回印度尼西亚之后，又请了一个菲律宾女佣处理家务。不要以为我不知道，老爸与老妈子在房间偷偷商量，要请一个比之前更丑的女佣。\n\n我趁老妈子出门为太富豪看风水时，又重施故技，故意吩咐冰冰整理我的房间，乘机把门关上，拿着马币两百令吉塞进她的内裤，把她脱个精光……\n\
