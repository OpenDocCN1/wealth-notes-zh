    Angelina，她竟然睡着了，并不知道自已经历了两次的生死大关。


    难怪老妈子经常说，柬埔寨女佣就像住在森林里的野人，什么都不懂，什么都不会，她可以数天不洗澡，食物掉在地上，也可以不顾卫生拾起了就放进嘴巴。


