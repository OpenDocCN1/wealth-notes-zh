    李想指者人形黑影怒骂：「这是我的家务事，而我的家事不需要你这只鬼东西插手！我父亲现在已经是太上皇，最主要是负责在幕后享清福，现在幕前的所有场面都由我一手掌握。所以，我才是一家之主！我才是真正掌握主控权的一家之主！」


    人形黑影不屑地嘲笑：


    「李想菩萨，你是不是又没吃药？谁是真正掌握主控权的，大家心知肚明吧。你？哈哈，只不过是李卜的赚钱工具，是他的扯线木偶其中一个配角而已。你这个傀儡，每次提呈意见时，都乱七八糟毫无建设性可言，你老爸几时采纳过你的意见呢？即使「乌鸦行动」，哪个是出自你的策划呢？你这个傀儡在『玄门正宗』有什么建树啊？所有的场面？你这个傀儡顶多撑门面而已，啊哈哈哈！」


    黑影手舞足蹈，讥讥笑了几声之后继续说：


    「你看、你看，你的这篇实验见证报告，简直可以用乱七八糟、胡言乱语来形容，你不彷拿着这份报告给外人看，大家都会说写这份报告的人有精神病，是很严重的精神分裂症病人写的胡言乱语。


    第一个和第二个的实验，一看就知道你很强勉强解释自己的诅咒力量，既然诅咒了，又为何要救赎？放屁！接着你为了想凑足了这个圆满数字，你又将《芭蕉日报》的新闻，附会上的自己的梦境，而有没有这些梦，你自己心知肚明啊！我看你还是按时吃药比较安全点，你老爸和老妈子临去美国前，不是千叮万嘱要你按时吃药吗？你认为你老爸会相信你这份报告吗？」


    李想想听气，但又一时反驳不了。他举起拳头，一记右勾拳往黑影轰过去，怎知他一个扑空失去了重心，重重地趴跌在地板上。当他抬起头环顾四周，黑影已经消失不见了。


    「你这个鸡巴阿飘，下次如果你再出现，我一定用愤怒之火将你烧到灰飞烟灭！」


    李想揉着手肘和膝盖的挫伤，咬牙切齿的讬谰。


    ![](img/237675b87ee3b5bddaa78c410bf9f326_22_0.png)


    门铃响了，李想不情愿地爬了起来，满腹怒气。


    他想如果是超仁出现，他一定将气出在他的身上。


    如李想所愿，他打开门果然看到超仁站在门外。


    「嗨！」超仁还想堆起笑脸，他本想高喊一句「李想菩萨」，可是连半句话都还没出口，李想即欺身上前，出手神速，一巴掌就掴上超仁的右脸。


    超仁对突如其来的掌掴感到莫名其妙，抚摸着火辣辣的右脸正想还击。


    怎知还来不及咒骂，李想又一拳打在超仁的肚子上。


    接着李想往超仁的身上胡乱挥拳，来不及抵挡的超仁被打得脸青鼻肿，痛得眼泪直流哇哇大叫。


    李想猛然抓住超仁的头发硬揪死扯。


    超仁一开始是很愤怒，准备跟李想拼命，接着想到：万一李想请了战斗胜佛下来，他又如何打得过李想呢？


    于是他又悲叹自己时运不济，忍气吞声，想到跪地求饶是最好的方法。


    「痛，痛，痛！放手，放手，我不敢了，菩萨，菩萨请您饶了我把！」


    超仁本能地跪在地上向李想求饶，李想不理睬超仁的挣扎，硬将超仁拖上楼，推进了房间。


    超仁稳不住身子，跌在地板上，喘着气无辜地看着李想。


    李想将手伸入裤裆，摸了一摸阴茎的龟头，他将手抽出，捣在超仁的鼻子上。


    「死胖子，好闻吗？我警告过你，我没有神经病，我没有神经病，我是有神通的菩萨！」


    超仁嗅到一股腥臭味，连声咳嗽着说：「李想菩萨，这是王母娘娘前的蟠桃香味，喷喷香，香喷喷啊！」


    「死怪物，要不是我给师父面子，要不是我要报答师父的知遇之恩，我肯定会杀死你—我绝对会在水沟放大便给你！妈的！」超仁心中诅咒着，脸上堆满着笑容，但却很奇怪地控制不住泪水涔涔流着。


    「唉，我又有什么本事跟这混蛋斗？我的诅咒法怎么比得上他的诅咒法？现在人为刀俎，我为鱼肉。我唯有先将一把刀插在心上，忍一时风平浪静啊。唉……」


    想到这里，唾面自干的超仁连发脾气的念头都不敢。


    「告诉我，为什么你会这么迟？！」李想质问师罪。


    「我被天桥底下的老人阻扰了，他硬拉着要跟我去谈天……」


    超仁知道自己百口莫辩，不过还是很努力厘清。


    「你这个笨蛋蠢材，老人那么孱弱，你给他一拳，不就收拾了他？」


    李想指着超仁的头，举起右拳转动着。


    「好的，好的！下次我会！」赔笑达人超仁脸色死灰的点头示好。


    李想以训练狗的口吻指令超仁：「坐！坐下来，盘腿坐下来！」


    「发生了什么事？」超仁一头雾水，不知道李想接下来想玩什么把戏？


    「闭起眼睛，快！照我的话做！」李想面无表情说。


    超仁惘然地闭起双眼，他虽不情愿，但还是跟着做。


    超仁心想：「对这头疯子，还是敷衍他比较好，没必要跟他缠斗，说到底他是师父的独子。」


    「啪！」超仁又被李想掴了结结实实的一巴掌。


    「专心点，来，深呼吸，听话，继续深呼吸……」


    李想不断重复一边叨念着，一边用手抚摸着超仁的头颅，李想慢慢在超仁的前面蹲了下来，他双手环抱着超仁的头颅，慢慢将距离拉往自己的方向。


    「不！你想干什么？」超仁惊惶睁开双眼，挣扎推开了李想的环抱。


    「你以为我想干什么？」李想将脸贴近着超仁的脸颊，彼此近距离看着对方的双眼。


    「我……我……不要！」超仁不知道自己担心些什么，但就是恐惧感不断涌出，他控制不住，眼泪爬满了整张不知所措的脸。


    「我，要！我，要，你，现，在，给，我，闭，上，眼。」


    「不!」


    「啪啪！」李想又左右掴了超仁两记耳光，还抬起脚狠狠地往超仁胸部踹了几踹。


    「听好，照着我的话去做，给我闭上眼！否则，你有苦好受！」


    超仁眼泪夺眶而出，他心中惊慌极了。


    他向天祷告着，拜托千万不要，千万不要！老天，求你保佑我！就算您要我减自己10年阳寿，我也一百个愿意，求求您！


    即使超仁不知道自己在担心什么，甚至乎不知道自己千万不要什么，不过超仁全身的神经系统却告诉他自己，千万不要……


    虽然如此，他还是听从李想的吩咐缓缓闭上双眼，他不自觉地微微张开嘴巴，第六感告诉他浩劫又来了，可是他根本连自己也搞不懂又来了什么，他只有悲伤与恐惧。


    「啪！」李想又打了超仁一扒。


    「给我闭上你的臭嘴！」


    超仁虽然被捆，但这次他却满心欢喜地照着李想的话闭上嘴巴，老天显灵了！


    李想蹲了下来，双手再次环抱着超仁的头颅，将超仁的头颅拉近，他用额头顶着超仁的额头，彼此近距离的深呼吸着，彼此的脸与脸的接触空间只有一个铜币厚度的距离。他们几乎闻到对方的体味，从双方的体气中感觉那遥远又熟悉的感觉。


    时间分秒过去……


    他们两人开始昏昏欲睡…


    眼前又是一阵漆黑。


    李想与超仁被毛毛细雨中微弱的光芒包围着。


    他们两人都感受到悲观忧伤的感觉，渗透过他们身上每个细胞。


    他们俩站在茂密的树干上，许多树枝都有银色的光芒闪烁着。


    有时候树枝与树枝之间像闪电一样，以刺眼的光芒彼此衔接。


    超仁感觉自己没有了形体，正确的说法是，他与李想像佛变成无形无相的气体，而李想的气体控制着超仁的气体。


    李想与超仁以惊人的速度穿梭在繁复又茂密的树枝群，超仁感觉到李想像是在追逐着一个电讯图片。


    「李想，请问这里是哪里：你拉着我在树干上飘过，感觉上就像《阿凡达》的世界……」超仁竟然有点兴奋。


    「蠢材，这里是你的脑部结构，你的头脑没有光芒，死气沉沉，表示你注定悲哀。你若进入我的脑部，你会发现很多闪烁的光彩，乱乱射，好看了。超仁我跟你说，我说乱乱射不是我说错话，我是故意的，我是故意的。乱乱射的意思是：金光闪闪，瑞气千条，我们现在走的地方是神经元触突……」李想像老马识途地介绍。


    「为什么……」超仁想知道为什么李想要「侵犯」他的脑部，但话还没问出口，他就感觉到李想推开了他，高高跳了起来。接着李想飞入了一个黑暗的隧道。


    超仁留心看下四周的环境，发现自己身处一个黑暗轨道的入口处，他往上一看，上面好像是两条弯曲的大香蕉，而自己正像是在两条大香蕉之间，他看着赤红色的大香蕉，不寒而栗，他的恐惧感一波比一波更强烈地涌上心头。


    超仁突然感觉悲哀哀伤的感觉一涌而上，并侵袭全身的细胞。


    他身子不停地抖着，他感觉自己呐喊着，不要、不要啊……不啊……不要啊……


    超仁感觉李想出来了，他拿着光点的图片在超仁面前调皮地晃了一下，一道刺眼的光芒闪烁着，超仁终于看到图片内的显示的画像，超仁歇斯底里的吼叫着，呐喊着！


    「啊……不要啊……停下来……不要啊……停下来……啊！」


    ![](img/237675b87ee3b5bddaa78c410bf9f326_25_0.png)


    超仁睁开阔双眼，从幻觉惊醒，他惊慌地推开李想，瘫痪趴在地上泣不成声，不停地用手捶着地板。


    他陡然爬坐了起来，用发冷又抖动的双手摸一摸脸庞，自言自语道：「我刚才 是作梦吗？」


    超仁全身痉挛，不断喘气，接着不停地呕吐。「这不是真的，这不是真的……」


    「哈哈，哈哈，笑死我了，哈哈哈哈哈，笑死我了……」李想在地上笑得翻滚，他半躺在床头，指着超仁说：「你这个死胖子总是喜欢啰啰唆唆的，连看你的记忆

