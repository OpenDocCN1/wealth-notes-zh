    二 00 七年有一项研究全球三十四个城市的人走路速度的报告，显示现在的人走路速度已经达到每小时 3.5 英里，比十年前快了 20%，人际互动的交谈速度也比十年前快上
    20%。


    快，带来更多的不确定，甚至变得不可预测，这就是我所要追求的刺激，我不想被人掌控，我的命运我主宰！


    老爸将玛莉亚打发回印度尼西亚之后，又请了一个菲律宾女佣处理家务。不要以为我不知道，老爸与老妈子在房间偷偷商量，要请一个比之前更丑的女佣。


