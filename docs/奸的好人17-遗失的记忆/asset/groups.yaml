    指令用的是静怡五岁之前所用的乳名，客家腔调类似她过世的母亲。


    她听着指令，迷迷糊糊地走到阳台上，伸展双手，毫无方向感。


    此刻，情景时空来个天翻地覆的大转变，胡静怡竟然身处美轮美奂的潘多拉仙境。


    站在高瀑瀑布边缘，她的脚底下是一片澄静的湖水，湖心倒映著一轮紫色的明'
