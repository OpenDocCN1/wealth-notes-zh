    口


    超仁经过天桥底下，看到孤独的老人翘着脚睡着了。


    他不想打扰老人，静悄悄爬进水沟，他闻到一股呛鼻的酸味。


    「妈的，不知道是哪个流浪汉的呕吐物？」


    他从裤袋拿出手机，等着简讯传来的指令，不过，他想要的简讯并没有按时传过来。


    超仁干脆闭起双眼，先将自己身处的水沟冥想成堆满大便，内里有许多蛆虫在蠕动，大便将他围绕一圈又一圈，大便愈来愈多，愈堆积就愈高……


    他蹲在孤儿院附近的这个水沟执行任务，是因为这里镌藏着他许多悲惨的回忆——有太多他被欺凌而充满怨恨的回忆——当他冥想大便充盈整个宇宙天地时，就是开始要发挥悲惨的呐喊力量，加以诅咒的时刻。


    执行任务前，他必须唤起他自怨自艾，自觉悲惨的回忆。


    他想着想着，不自觉口中低声哼唱着：


    神棍之遗失的记忆


    「如果超人会飞

    那就让我在空中停一停歇

    再次俯瞰这个世界

    会让我觉得屌一些

    拯救地球好累

    虽然有些疲惫但我还是会

    不要问我哭过了没

    因为超人不能有眼泪。」


    常常有人嘲讽说：这首歌的演唱者唱起歌，像一边吃着槟榔、一边嚼着卤蛋、一边在诵经。即使有人将他的歌声讽刺为含着鸟蛋的公鸡准备被宰杀时的凄惨叫声，简直天理不容；不过超仁始终还是对那道十二年的偶像给予十二万分的支持。


    从小到大，超仁就对他的名字感到困扰，也对别人取笑他的名字感到反感，更对崎岖不平的人生感到绝望透顶。


    但！就在两年前，当R&B小天王创作了一首《超人不会飞》，也拍了一部鼓励平凡人有勇气变成英雄，为社会创造更多无限可能性的MV时，终于为他这只万念俱灰的迷途羔羊，带来充满希望的阳光。


    现在，就算躲在秽气熏天的水沟里，只要哼上几句《超人不会飞》的副歌，他就会感到红内裤外穿的正牌超人附身，充满足以消灭怪兽的正面能量似的。


    ![](img/237675b87ee3b5bddaa78c410bf9f326_13_0.png)

    ![](img/237675b87ee3b5bddaa78c410bf9f326_13_1.png)


    天底下的父母都希望为自己的孩子取个好名字。


    孩子的幸福是从名字开始。


    一个好名字可以带给你孩子一生的能量，给予你孩子一生的自信。


    但我的养父却因为喜欢《三国演义》，而给哥取名为孔明，妹的名字为貂蝉。


    这个家庭先收养了孔明与貂蝉，而我，我被自己的亲生母亲遗弃在佳世客的大卖场内；不知道是哪位好心人，将被遗弃的我送至附近这家孤儿院。


    因为某次儿童节，八岁的我在孤儿院扮超人娱乐大家，逼得做义工的养母很喜爱，而决定收养我。


    我真怀疑我的养父，把哥叫做孔明的目的是想他像诸葛孔明一样聪明吗？


