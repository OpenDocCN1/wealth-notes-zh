    \n老爸将玛莉亚打发回印度尼西亚之后，又请了一个菲律宾女佣处理家务。不要以为我不知道，老爸与老妈子在房间偷偷商量，要请一个比之前更丑的女佣。\n\n我趁老妈子出门为太富豪看风水时，又重施故技，故意吩咐冰冰整理我的房间，乘机把门关上，拿着马币两百令吉塞进她的内裤，把她脱个精光……\n\
    \n那天我一共上了她三次，每一次都搞得她死去活来。\n\n这次我可找不到任何凭据，看菲律宾女佣有什么地方酷似范冰冰，但我看了电影《苹果》之后，我还买了 DVD。每次看到范冰冰被梁家辉硬上，我心情就莫名兴奋，小弟弟自然勃起。那时我还收集了很多范冰冰的海报，我已经训练到自己闭起眼睛，硬上女佣，脑海尽是幻想的画面。\n\
