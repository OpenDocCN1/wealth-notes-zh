    『『棍』这个字，在现代人概念中具有『骗子』和『无赖』的涵义，现代人将棍解释成『棍骗之徒』。但我绝对是有神通力量的『光棍』，我一旦要索取钱财与美色之时，善信若不听话，他肯定会死得很惨，就像这个少年这么惨！你说，这有哪一点像『骗』？』


