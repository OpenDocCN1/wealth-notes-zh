    杰克想到每次他与谋略冲突后，可以调解彼此纠纷的中和人宋钱。「一合相传媒集团」一开始就是由钟杰克、宋钱与简谋略三人，靠实力加上血汗才拼出今天的辉煌成就。


    他们三人将公司取名「一相」的目的，是告示着这三个在「桃园拉拉山结义」的三弟有相同的理念、有相同的梦想，三人不分彼此合而为一，无二无别。即使大家不是「同年同月同日生」，不过大家都不约而同抱着只愿能「同年同月同日死」的伟大情操。


    从 2013 年开始，他们创办了一家网络电视台，开始的时候他们只用普通的摄影机拍下节目，而凭着他们大量搜索资料，游说专家在他们网上电视台做专题讨论的节目，又透过
    3D 动画补充资料上的说明，他们主持的节目三年前就被称为暗流文化。也有人这样断言：「『一合相』是本世纪最可能翻转地球的软势力」


    在没有专业主持人的情况下，他们三人干脆亲自上阵当起讨论嘉宾，宋钱以制造话题，将话题炒热，在网络煽风点火最为擅长，而谋略则运用冷笑话，在他监管与主持的节目里，往往每分钟都能使得观众爆笑到岔气，杰克则以串联故事，火辣用词与比喻，加之逻辑推理而闻名。


    一开始只有小量的粉丝，渐渐地，在「一传十、十传百」的网络力量驱使下，「一合相」终于成为网络上的巨无霸，每一天阅览率高达数十万人次。他们花了两年半的时间搜索足够的数掘，出版了《神经病与神通的关系》，在市场造成风靡之后，他们又增设了出版部门，因此凡是在网络播放过的节目，每三个月就可根据其内容整理出一本新书，推出市场。


