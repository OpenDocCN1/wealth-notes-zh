    李想又觉得自己受控于张虎与王霸。


    “我知道你现在企图说服你自己，说自己是神。你也知道自己有精神分裂症，更知道自己有忧郁症。你现在是自己骗自己，你是极度自卑的可怜虫，企图将每件事合理化成你有神通，你愈来愈神经了。你不吃药，不接受治疗，还幻想自己和李卜继续生活在一起……”


    “够了！不要再说！不要再说了！”


    李想双手捂着耳朵，不想再听李卜狗屁不通的废话。


    房间静止了一段时间。


    “李想教主，我们可以出发了。你可以正式成为‘玄门正宗’的教主了！”终于，张虎的声音打破房间内的寂静。


    李想默默站起来，低头狞笑着，希望张虎没看到他的狞笑。


    他不希望张虎看到藏在他的身后的李卜。


    他内心盘算想着：


    这就是天意！是神的旨意！


    嘿嘿……


    我的正宗，玄门：


    救世主的我！


    李想的时代来临了！


    他咧嘴而笑，但他并不知道，这是不是奸邪的微笑。


    《神棍之遗失的记忆》完


    2016年后，李想当了玄门正宗三年的教主，世界不再是拜金主义，而是追寻神秘主义，特异功能的年代！社会愈多神经病……


    ## 后记


    ## 后续篇


    钟杰克来到了蕴藏知识的聚宝盆，那是建立于小型城堡第四楼的一千平方公尺私人图书馆。


    即使当不成大教授，不过最终，阴错阳差下竟然赚到了第一桶金，所以钟杰克购买豪宅时就在装修方面挥金如土，让两层楼高的第四楼成为自己沉浸书海的地。


    这个私人书房的特色，就是三面环墙式大书柜，另外一面则是面对海洋的落地窗。


    书房的书柜也是两层楼高，高到可以顶住天花板，而且书柜上的书琳琅满目，令人眼花缭乱，只有主人钟杰克熟悉每本书的位置所在。


    每一个书柜都附带一个可随轨道滑动的梯子，所以如果想要取高处的书，就必须动用这个梯子。


    他看着三面墙壁的书柜，之后爬上梯子，找到其中一座标志为“玄学百科”的书柜上。


    这里一半的书是关于玄学术数、特异功能、神秘组织的书，他用食指触碰着这一系列书背，喃喃自语说：


    > “玄门正宗、李想……每次在节目上，李想都胡言乱语，但‘玄门正宗’的发展却如日中天，按道理，李想这种人绝对搞不出这种大组织……现在‘玄门正宗’的影响力愈来愈大，甚至可以操控政局与国际大企业。70%挂牌上市公司，玄门正宗都占有百分之八的股权，反之，没有加入玄门正宗的企业、政党政领袖都相继离奇的惨死，网络不断有匿名人士四处散布：其实‘玄门正宗’背后最大的力量就是乌鸦，而乌鸦到底是不是‘玄门正宗’背后的杀手呢？”


    钟杰克手中取下六本有关诅咒的书籍，放到书桌上，他双手揷着脸颊，吐出一口闷气。


    “哈利路亚麦达令，阿尼陀佛我爱你，啊啦啦啦啦……”


    钟杰克拿起手机，简谋略从手机另一头传来兴奋的语气：“我终于找到司徒超仁的踪迹了，还有一位叫做秦寿的精神科医生……”


    杰克不耐烦打断了谋略：


    “妈的，谁是司徒超仁？谁是秦寿？现在到底谁打谁？你干嘛讲话和做事永远都是那么跳跃式的，我根本摸不着头绪，你告诉我这三个人干嘛？他们是谁？现在我们集中的火力是揭开乌鸦这个神秘的组织，还有跟政治与企业势力不断膨胀的‘玄门正宗’有什么关系？”


    电话另一边，简谋略拿着话筒，另一手摸着下巴呼之欲出的粉刺，微微笑说：


    “唉呦！钟杰克啊，我可不会傻到打电话和你透露我有两个同性恋男友吧？这是调查案件中两个重要关键性人物啦，我可是用了夺命连环的高度连续调查技巧找出来的喔，可不像《芭蕉日报》或《香蕉日报》那种，找挑那些花边新闻究版面下的三流的记者可以相比的。请你别忘了，我也是这家公司的投资老板之一，不要对我妈的来，妈的去啦，那我可用秘密案件多寡来收费喔，哈哈哈！还有一件事，就是……”


    谋略话还没完，钟杰克已狠狠地把电话给挂断。


    谋略当下就像川剧变脸一样，收起笑眯眯的脸孔，双手握紧拳头，下弦月型嘴型渐渐随之浮了出来，心里一把熊熊的无名火也在闷烧着。简谋略冷冷的拿着一台跟随他上刀山下火海的笔记本电脑，盘坐在神桌前的供桌上，快速打开了计算机，从活页夹里建立一个档名：“老虎蹲下，是准备大跃起！”


    手指间流露出不甘心的低气压，却陆陆续续敲打着高度能量的文字在 WORD 文件内：


    > “钟杰克啊，我不是没脾气，我只是要维持股东与股东间的友好关系，不然我真的可以闭着眼睛吃定你们。你们到现在还不知道是我的底细，嘿嘿嘿。

    >

    > 当初，我是用不服输的心态离家出走的，当时我耳边常听到：‘谋略少爷啊！有钱的老爸给您遮阴多好！谋略少爷啊！您真的是天公疼爱的阿斗……’因此，我深深体验到，在坐拥金山银山有钱老爸身旁，无论我付出多少努力，无论我表现多优秀，总是会有狗眼看人低的言语出现，背后还有很多不知所谓的闲言闲语和流言蜚语！倒不如实际一点，靠自己的本事，用血汗拥抱智慧的宝藏，并创造一番事业！

    >

    > 因此，激起了我内心硬汉子的热血脾气，当我走出家门口，就是要为自己打拼一番事业！钟杰克啊！你不知道的是，只要我动一动手指，写出一份黄金计划书给我老爸看，就会有一笔笔压死人的巨款可以把我们的整个公司买下，你们这几个人将跟‘合一相股东’有缘无分！也许你们连当我下属都不够资格，当我愿意与你们合作打拼，是我在这里渐渐看出未来梦想的清晰度。是我在给大家机会！是我！”


    谋略坐在计算机前，自言自语叨念着心中那口闷气。


    > “天真无邪的钟杰克啊！你不知道的是，台面上我常常故意当‘憨仔’嬉皮笑脸，私下却可以把对方话语中的真假与虚伪，以及言外之意听得一清二楚。我是可以暗中在舌灿莲花的一问一答中挖出八卦，深入真相的口技天才！钟杰克！我不是纸老虎，我不是没脾气，我是汉子的硬脾气！我是顶天立地的铁汉！”


    谋略继续无意识在网络上继续搜索讨论乌鸦的网站，希望可以从其中窥破一些蛛丝马迹。


    接着他打开电邮一看，心头一惊……


    随即他又露出不屑的神情，低哼了一声，他对着计算机吼叫：“你—有本事就放马过来！”话方骂出口，他突然想到，他那多金的老爸是否也曾收过相同的电邮？如果是的话，他现在加入了玄门正宗吗？


    若是如此，就可以从他老爸那里做内应下手调查。简谋略把可能是乌鸦所策划的动画式警告信函中，所有的恐吓伤害一一记录在计算机里，于是他站起来想离开座位。


    他站起身后，突然全身僵硬不动，他感觉全身麻痹，第一次感受到濒临死亡的恐惧。那几秒钟就像让他经历了一柱香的时辰……


    他无法发出任何声音，看着自己身上被一团黑鸦鸦的黑雾像莲花叶一样迅速包围了起来，黑雾像是火灾现场一样乌烟瘴气。


    谋略感觉到脚底板凉凉的，像是袅袅升高，他暗骂：“天啊！我离地不知道多高了……”


    于是他干脆闭上双眼，感觉到身体僵硬如蒋公的铜像，并有一股不可控制的尿流顺着裤管流下。雾气黑到他真的不知道眼睛现在是睁开还是闭起的，耳朵又听到诡异的靡靡之音，怪音他妈的怪到他脑袋像孙悟空，被头上紧箍圈整缩成葫芦型，世上终极头痛莫过于此啊！


    这时他眼前又浮出一幕又幕的画面，就如濒死前没有新意的例常惯例。还是老话一句，他不知道自己眼睛睁开还是闭着，只知道死亡的恐吓威胁着他，眼前一幕接着一幕的画面居然是拔舌地狱、蒸笼地狱、刀山地狱、油锅地狱、血池地狱……


    恐怖恶心的3D真人影像在他眼前跑完了18层，最不可原谅的最后一幕是，一本蓝色生死簿上写着“命在旦夕”，血淋淋的四个大字直接浮贴在谋略的眼前！


    瞬间黑色气团忽然散开，冲入冷气孔，而简谋略像自由落体一样扭曲身躯摔在地板上，这时候他已经忘记痛是怎样的感受了，他只知道，他是完全靠着爬的力量，拿起电话打给杰克……


    □ □ □ □ □


    杰克想到每次他与谋略冲突后，可以调解彼此纠纷的中和人宋钱。“一合相传媒集团”一开始就是由钟杰克、宋钱与简谋略三人，靠实力加上血汗才拼出今天的辉煌成就。


    他们三人将公司取名“一相”的目的，是告示着这三个在“桃园拉拉山结义”的三弟有相同的理念、有相同的梦想，三人不分彼此合而为一，无二无别。即使大家不是“同年同月同日生”，不过大家都不约而同抱着只愿能“同年同月同日死”的伟大情操。


    从2013年开始，他们创办了一家网络电视台，开始的时候他们只用普通的摄影机拍下节目，而凭着他们大量搜索资料，游说专家在他们网上电视台做专题讨论的节目，又透过3D动画补充资料上的说明，他们主持的节目三年前就被称为暗流文化。也有人这样断言：“‘一合相’是本世纪最可能翻转地球的软势力”


    在没有专业主持人的情况下，他们三人干脆亲自上阵当起讨论嘉宾，宋钱以制造话题，将话题炒热，在网络煽风点火最为擅长，而谋略则运用冷笑话，在他监管与主持的节目里，往往每分钟都能使得观众爆笑到岔气，杰克则以串联故事，火辣用词与比喻，加之逻辑推理而闻名。


    一开始只有小量的粉丝，渐渐地，在“一传十、十传百”的网络力量驱使下，“一合相”终于成为网络上的巨无霸，每一天阅览率高达数十万人次。他们花了两年半的时间搜索足够的数掘，出版了《神经病与神通的关系》，在市场造成风靡之后，他们又增设了出版部门，因此凡是在网络播放过的节目，每三个月就可根据其内容整理出一本新书，推出市场。


    最近他们三人合着了一本小说《诅咒的力量》，内容影射“玄门正宗”其实就是透过“乌鸦”这神秘组织，以诅咒的力量恐吓政界与企业界。书出版之后，三天内即破了十五万销量，一个月内在中美联邦狂销三百万本，诚可谓前无古人后无来者。


    三天前，他们三人都秘密收到一封由“乌鸦”发出的电邮，限他们在三个月内缴付祈福金，否则他们将面临“乌鸦”的诅咒。


    而世界上只有“玄门正宗”号称能够抵御“乌鸦”的诅咒，换句话说，他们三人的选择就是给“乌鸦”祈福金，再不然就是加入“玄门正宗”。


    杰克收到电邮后，即召集三人开会，杰克透过逻辑推理推断，为什么从没有第二个宗教组织胆敢说能解开“乌鸦”的诅咒，事情肯定有蹊跷！而他们收过无数的匿名信件，都说“乌鸦”其实就是“玄门正宗”。


    “宋钱麻烦你赶紧联络谋略，三十三分钟后我们在‘一合相’的图书数据库见面！”杰克说完站起身来。


    突然他眼前一黑，整个房间黑暗了下来。


    摇了！晃了，干！又是地震的余震！


    书房内激烈摇晃震动着，几乎把杰克给晃倒在地，书柜强烈地左右摇晃，彷彿三面的墙壁都将倒塌下来。还好书柜有安置特制防弹玻璃，所以才不至于让书本都四处乱飞。


    书房电灯忽明忽暗，电灯发出吱吱响，不断的噪音十足是泰国恐怖电影气氛。


    瞬间，地不动了，不摇了！灯也亮了。奇怪的是，灯光比刚刚还要亮，简直亮得有点炫目，使杰克瞳孔也缩小了许多。这犹如冥冥中有人在导演这场恶作剧一样……


    “哗！”


    杰克高声惊叫着！


    他的身体四周，慢慢浮出一团黑色气体……


    “我怎么了！”


    他看着自己的身体出现异状，心中怦怦跳个不停，脸上闪烁着恐惧的气色。


    渐渐的，整团黑色气体凝聚起来，把杰克的整个龙躯给包覆住。杰克眼如铜铃，看着这团由气体凝聚成的黑暗烟团，身体彷彿被定格，动弹不得。


    黑暗烟团以迅雷不及掩耳的速度，钻进冷气口。


    “哈利路亚麦达令，阿尼陀……”


    杰克的手机又响了，杰克喘着气，迅速拿起手机，宋钱气喘如牛说着：


    “杰克，刚……刚才……房间突然像地震一样，一下子……停电；我……看到……我看到……我身体浮出黑气膻……冲向冷气口……我……”


    电话又突然挂掉了。


    “哈利路亚麦达令，阿尼陀佛我爱你，啊啦……”


    这时手机又响起，杰克心中不祥的感觉升起，不要是谋略！


    手机果真传来谋略的声音：


    “杰克，刚……才，我身体浮出黑气体……不行了！大事不妙了，极有可能是‘乌鸦’发出的警告，他让我们产生幻觉。我搜索到一些数据，我们要见一见司徒孔明，司徒超仁的哥哥……”


    “要来的始终会来，看来乌鸦已经看上了我们，他们已经向我们宣战。”杰克这样回答。


    （待续，请继续追看《神棍》第二集。）

