    # 第三话


    # 「第一章」


    接听到手机留言时，李想也不知道自己是不是幸灾乐祸，心里有种中乐透的喜悦。


    当他知道司徒超仁被跑车撞飞，跌进水沟，心里确实是很兴奋。尤其第二个消息说超仁的哥哥司徒孔明被地痞打到奄奄一息，李想心里真希望看到司徒超仁一家人灾祸连连。


    他觉得，要是超仁死了，那更是锦上添花，连一脚把他踢开的功夫都可以省了。


    然而，当他听到最新的留言讯息，发现是超仁亲自打电话告诉他自已已没大碍，这下子又将他快乐的情绪拉入谷底，心中冒起一种不是滋味的滋味。


    「他妈的，死胖子，为什么这么多人死，你却不早点死？你总是那么幸运，每次你都死不了！」


    此时，李想正踌躇到底要先去医院假惺惺探望司徒超仁，还是回家睡觉比较好。他做了最后的决定：回家休息，假装没听过留言讯息。


    口 口 口 口 口


    203号普通病房里笼罩着一片愁云惨雾，气压低得一让人接近窒息。


    林美凤哭红双眼，关怀地问：「超仁，你没事吧！现在好了一点没有？」司徒文武与司徒貂蝉也是满脸忧虑，眼眶里充满泪水。


    一脸满不在乎的超仁跳下床，走了一圈踏步后说：「亲爱的各位观众，我精神奕奕，我是天公的孩子，没疼痛，没事！没事！」


    即使听孩子这样说，黯然神伤的司徒文武摇摇头，依然说不出话，司徒妈妈林美风也还是眼泪直流。


    司徒超仁有种大事不妙的预感，养母林美凤的眼泪与养父司徒文武的忧愁不是'
  - '[PAGE 93]


    悬挂在自己的身上，但又说不出所以然。他内心有种快意，想：「最好是我的诅咒灵验了，最好是司徒孔明出事，反正他又不是我的亲大哥，管他去死！」。


    他假装吞一吞口水，强作镇静地说：「爸、妈、貂蝉，你们看，我没事啊！」


    司徒貂蝉哽咽着说：「大哥被匪徒打伤，现在在急诊室急救，还没度过危险期……」


    这消息对超仁来说，简直是天大的喜讯，他想象挂在舞台高空的的盏强灯一起闪烁下，用偶像之一安东西罗宾的经典动作振臂狂呼一声：OH……YESSSS！


    不过，他知道演戏一定要演全套，所以他又将狂喜的心情给压抑下来。


    「超仁，你在这里休息一阵，我们去看你大哥那里等消息……」林美风跟泪腺的拉锯战还是没完没了。


    「不！爸妈，我跟你们一起去等消息！我没事！看大哥要紧。」


    司徒超仁认为，这是他唯一能做的事——他现在唯一能做的，就是要亲眼见证司徒孔明的死亡过程，而过一段日子之后，他就得负起照顾郭美丽的重责了。


    他陪着父母，走到正在急救司徒孔明的诊室。


    司徒超仁看见愁眉不展的郭美丽坐在和平医院急诊室外面，不断重复眼泪流了又被蒸发掉的循环。


    她身穿紧身吊带内衣，酥胸半露，下半身是超迷你热裤，身材的曲线玲珑浮凸，引起超仁无限遐想，垂涎欲滴，咸湿的口水不断在喉咙间游荡。。


    超仁总觉得，郭美丽长得像日本 AV 界的翘楚，曾荣获年度日本成人广播大奖最佳女优奖的爱田由。因此他很难坐怀不乱，常常不自觉又有生理反应，紧咬舌头才勉强安抚勃起的小超人」。


    超仁呼吸开始急促，不自主地偷瞄了郭美丽呼之欲出的胸脯几眼，也忍不住对她迷人的白皙长腿吞口水，看着她在司徒孔明秘密档案内的裸体照片。


    「美丽，发生了什么事？」林美风抱住美丽双臂。


    「伯母……」


    郭美丽才刚刚替警方录完口供，勉强还算是故作镇静，将事件重游一遍，但每重游一遍就等于将这起恐怖与震惊的事再回忆一次。她唯有以颤抖的声音，断断续续将事发经过再诉说一次。'
