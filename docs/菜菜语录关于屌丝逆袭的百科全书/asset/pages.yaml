    大虹桥是市级重点，目标很清楚，嘉定青浦松江三区靠近市区的那一片地。但是，大部分外地人对这一块不太熟悉。这就需要前期打品牌，大投入了。这一块投入的红利，是可以预期的。


    地缘经济学。上海经济的前途是向西发展，和苏浙真正打成一片，长远看，就是江浙沪大都市圈。江浙沪的中间点，就是虹桥机场以西十公里，北横通道，G50 和 G60，三条线辐射的那块区域。这是今后二十年的布局。


