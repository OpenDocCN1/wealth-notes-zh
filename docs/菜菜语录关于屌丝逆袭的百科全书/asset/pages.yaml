  md: '都在有限的几个地方了。一旦市场变化，基本没出路了。大城市的特点是，行业多，今年在袜子厂做会计，明年可以去中介公司做会计。


    哪个行业发财了，咱们就去哪个行业。小地方，一旦不好了，只能背井离乡了。


    请教。四川农村一般家庭，靠近县城的近郊，儿子职院大专文凭。毕业后，成都做电焊工，月入7千，但怕苦怕累，一年后回县城，做小厂销售，月入3000元，吃住在家里，好幸福。家里有能力在县城买房，很难在成都买房。女朋友是县城服装店的店员。问：今后可能会如何？


    县城小厂职工，前途基本为零。这代人不出去闯一闯，下代人要吃苦。


    特大城市的就业和创业机会。房地产相关行业，是个长盛不衰的行业。衣食住行，是人的本能需求。例如租售中介，维修装修，搬家保洁，合同纠纷，贷款搭桥，信息服务，除甲醛，儿童接送，小区广告。你能拍出一套漂亮的旧房照片，都可以增加成交率。如果你不想成为码农或科学家，可以多琢磨这个传统行业。


    人的一生，毕业后十五年最关键。一般到37岁，体制内的，基本可以写退休小结了。体制外的生意人，尚属未知数。所以，像我这样有条件的人，不如辞职出来算了。你等于是活了两次。很多人一辈'
