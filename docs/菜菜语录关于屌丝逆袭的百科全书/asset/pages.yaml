    # ## 第八节 一些思考


    对今后 10 年内的户籍判断。


    京沪将来必定是以房管人，有房就有立足点了，今后市民待遇，肯定是看得见的。所以，当你能够买得起京沪房子时，孤注一掷，哪怕是上海崇明县，北京密云县。这个赌局，你是不会输的。不要在平是不是便宜了
    5%，这个是小事情。千万不要去昆山，燕郊，那是傻逼了。


    我坚信，以房管人是。大方向。


    我对这个纷繁复杂的社会现实真的怕了。我的想法是，给孩子留一些内环线的房子，告诉他，千万不要离开内环线，一辈子就基本靠谱了。实在要走，只能去美国，千万不要去内地，上海人搞不过外地人的。


    28 岁前的看点：曾经考到同济以上，工作五年被大单位提拔用过一次，骗到过漂亮姑娘，做生意三年后有 20 万盈利，买了京沪房。如果你达到上面任何一项，说明你具备成功的智力水平或情商。一事无成的，尽早看清现实，靠不了爹，就踏踏实实过日子吧。'
