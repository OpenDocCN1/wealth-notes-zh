- pgno: 79
  md: '年轻时候，只看女人的脸。老了，就变成看女人身材了。我现在已经慢慢向老年人过渡了。女人，丑一点不要紧，关键是，又白又胖，腰又细。


    怎么在家门口赚钱？我说个特例，大家参考。


    海南某度假小冢一共有十几幢大楼。每栋楼25层，每层十户，大约是250户人家。春节入住率75%。来回机场的打车需求是375车次。如果父母和女婿不是同时过来，那就增加到了400〜450车次需求。再加上度假期间的临时包车旅游吃饭，大概有500-600车次的需求。少数家庭是自驾车过来，但不多。


    每次包车费200〜220元，一个人或三个人，都是这个价。这栋楼春节半个月的交通费支出是10万元。小区十几栋楼，单是打车，就要开支150-200万元。当然，一个驾驶员肯定吃不下。


    实际情况是，去机场单程50分钟。海南的飞机，白天到深夜都有。私家车接飞机，都是提前几天说好的，几个驾驶员完全可以调剂，做到来回不空车。一天跑3-4趟，来回都有客人，收入1500元是肯定的。如果出现拼车，收入可以高达2000元。


    我遇到一个驾驶员，就春节一个多月，赚到十万。淡季，每月五千或一万。一年20万是靠得住的。


    +   1，自己跑车一个月，接飞机，购物吃饭，附近旅游，每天纯收入1500元。大年夜都有生意。收入4-5万左右。很辛苦。


    +   2，分流一部分业务给家属亲戚接单，他提成，大概是1万。'
