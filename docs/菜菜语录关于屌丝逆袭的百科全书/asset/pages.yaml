  md: '房东看一眼，就知道租客的情况。如果很幸福，看到房东，肯定热情，希望续租不加钱。如果糟透了，就是愁眉苦脸。特别是女人，全部写在脸上，她们认为，对房东就是租金关系，没必要装逼。我看到了真实的人生和狗血剧。京沪，漂亮女人不一定混得好，而土肥圆没选择，求男人结婚，买房早，都发财了。


