- pgno: 62
  md: '通用技术，特别是考证书的那种工作，你唯一的任务是拉单子。干活嘛，大家都会，你把把关就行了。


    例如cpa，律师，一建，专代，cfa，一般码农等。


    年轻人要把情商放在第一位，会让人开心，让人放心，把单子给你。当然，你要是能够发明苹果手机，神秘的鸭脖子配方，你可以飞上天的作！


    # 第三节 如何当领导


    如何当领导？不要事事都管，下属在一线历练，比你了了解实际情况，除了大事情，政策制定，入门条件，其他不要管了，让下属自由发挥，你就当是风险投资了。你就管好一件事情，研究下属的智商和人品，能打70分，就是优秀人才，德才兼备是神话，聪明人喜欢钱，忠厚人做事慢，你的责任是，给他们定岗。


    我当老板的经验，一是充分发挥下属的积极性，经理有权，积极性超高，但也会贪一点，忍了；二是下属比你了了解情况，不要瞎指挥；三是原则问题不能让，贪一点可以，吃里扒外，必须解职，做好打官司的准备；四是产品质量要盯紧，这是根本；五是规模比利润更重要，如果你有大志向；六是社保必须交，不讨论。


    我算是运气好的。基本是3-4年升一次，级别+职位。我手下的，'
