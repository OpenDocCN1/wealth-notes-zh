- pgno: 28
  md: '如何写微博？把生活里的点点滴滴，提炼成一个实实在在的剧情。屌丝们不要写那种思辨型、哲学型、结论型之类的东东，没人感兴趣，因为你的功力还不够。你穷的只想早点微博收费，还来告诉我成功人士的生活真谛？


    再次建议有时间的同学们，抓紧做个自媒体，今后自媒体是个金矿。做全能大v，现在难度太大了，做个专业v吧，你最好找个吃瓜群众有兴趣看的小领域，做的精致一点，如果质量好，我愿意帮忙推荐。以前，上海第一大报《新民晚报》也不过是几十万份的销量。自媒体已经取代传统报纸，成为新的传播方式。你做好了，肯定有较好收入。


    深夜呼吁：大学生要高度重视自媒体。你们有时间，有精力，有专业知识，应该能够做好。2010年是淘宝大牛，2020年是自媒体发财。电视报纸已不适应普通人需要了。谁掌握了自媒体，谁就开启了财富大门。我是第一批金v，给你趟开了路子，你抓紧跟上。策略：踩线不过线，遇事先跪倒。来，我先跪为敬，噗通！


    **【发财指南】电视台被网络视频打垮，已指日可待了，55岁以下的人，基本不需要看电视了，捧个手机即可，新闻电视剧，样样都有。那么，今后的广告业何去何从？自媒体。你想啊，要是你的创作**'
