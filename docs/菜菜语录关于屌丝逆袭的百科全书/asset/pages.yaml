  md: '2，你找个饭店，承包五个平米，先做一下。


    3，给菜市场已经开起来的熟食店，送货。如果销量好，说明你的东西好。


    # 民企异地产开分公司，一般找谁？（屌丝要哭了）


    一是找小三当总经理。这是最多的，最普遍的。老板先**几年，**出感情了，给她*在郑州买个房子，最好贷款七成，然后告诉她，一生一世，永不背叛（和大老婆离婚还在谈）。这时候，小三对老板的积极性和认同感是非常强的，一般很少贪污。小三的来源主要是：总部的会计，出纳，销售。经过考察，聪明，诚信和人品，基本过得去。


    二是亲戚里的大学生。年纪轻，好管理，有老家父母做人质。同时采取分成制。


    三是在本地市场收编一个团队。合伙制，你包干销售，我负责产品，年底按照利润分成，一年一签。


    四是子女。


    油煎荷包蛋。95%的女大学生是做不好一个完整的荷包蛋的。悲哀啊！我教你最简单的办法。厚底锅，干烧到发烫轻微冒烟，加一点油，润滑锅子表面，打入鸡蛋，加锅盖后立即关火，不管了。12分钟后，一个完整不粘锅的油煎荷包蛋就好了。千万不要手贱，去动没有成型的鸡蛋，时间一到就好了。'
