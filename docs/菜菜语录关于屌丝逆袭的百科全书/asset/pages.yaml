- pgno: 80
  md: '3，新小区，客户来了之后要买各种家具物品，他介绍家具店信息，有回扣，兼带货运服务。那个地方的家具店，就那么几家，没什么选择余地。大概2-3万。


    这个生意最关键的是如何找到客户，并且让客户相信你？


    他没有通过物业人员介绍。因为物业人员要好处，他就在小区附近自我介绍，发名片，留微信，第一次生意热情周到，然后通过住户之间的互相介绍。


    这个司机特别聪明，他往往说，万一半夜遇到急事，例如小孩发烧之类的，他就住附近，立即就过来。这个卖点很打动人。因为度假村附近没有医院，必须去县城。


    度假村有个特点，熟人报国来买，邻居之间，比较热情，愿意交往。这种情况下，介绍生意是很普遍的。


    赚钱的门道都是保密的。你要学会仔细观察事物，研究各种成功案例，而不是指望谁教你发财，你还躺在床上，脸上一副嫌麻烦的样子。


    2009年以前的经济模式，还是有借鉴意义的。


    那时候，国企100%掌握上游资源。民企买来资源后，加工成五花八门的产品，卖给全世界。国企通过原材料的涨价，例如油，电，水，气，铁，铜，煤等，自行决定对小私企抽多少提成。


    这种模式创造了一个利益分享机制。国企拿大头，民企有盼头。


    私企老板可以不睡觉的干活，紧盯全世界的需求变化，哪里要加'
