- pgno: 81
  md: '大号的体恤衫，哪里要纯黑色的加肥裤，哪里要大号的圣诞球，他们想尽一切办法满足市场需求。


    国企是不可能做到这么高的效率，董事长甚至不愿意主动决策，因为决策是有风险的。位子来之不易啊，万一决策错了，位子就保不住了。主动请示，事事报告，等待上级精神。这样最安全。但是，市场经济不等人啊。


    现在，很多格局都变了。民企已经不再是以前的民企了，因为越来越不赚钱了。为什么不赚钱，我也 不敢多说。反正近十年，很少听说谁开厂发财的，倒闭的厂子倒是一茬一茬的。


    现在最时髦的是，买房。很多大小老板凑在一起，不谈生意，就谈买房，北上广买房，海南买房，避暑度假房。谈的眉飞色舞，精神百倍。有时候还谈炒股。


    与此同时，各路神仙，普遍歧视民企。例如银行，其他部门，我不敢谈了。那些羞辱人的话，张嘴就来：低端产业，工资太低，黑心老板，你为什么不发明苹果手机啊？你们啊，自生自灭吧？


    我在沈阳，目前无业，家里有祖传卤鸭脖秘方（味道绝对超过绝味鸭脖），但是目前好点位置的小门市租金太贵了，我怕万一开不起来把老本都赔光了。您对我有什么建议？


    答：1，你是小本经营，先做社区店，办好各种证件，成本不高的，装修也不需要多好，兼外卖。你的东西好不好，马上就知道了。若好，再做一个小店。'
