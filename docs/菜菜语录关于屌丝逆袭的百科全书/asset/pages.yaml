- pgno: 66
  md: '不违约。我坚持了很多年，事先和我吵架的人，多了去了，最后都喜欢我。


    如果你与人相处之时只想着为自己谋利，迟早是要混不下去的。


    通过利他来利己，才是高明的做法。


    # 第六节 为什么不要学金链子大哥


    北方很多农村人故意打扮成混混样子：板寸，粗链子，短脖子，


    花体恤，耐克鞋，一脸凶相。其实愚蠢。穷人要发财，必须别人愿意


    拉他一把，给机会。你这么打扮是告诉别人，我是没底线的无赖，随


    时会咬你一口，打掉你三颗牙。这种人一辈子没机会。要么在底层惹


