  md: '淘宝扼杀创新。美国小伙子发明了一个手机自拍杆，网上众筹，结果没几天，淘宝到处开卖。淘宝可以说，不是我生产的。但事实上，淘宝是仿害的孵化器和扩大器。没有淘宝的渠道，假货销售缓慢，伤害很小。你说有啥办法呢？


    走，去内环线！


    户籍制度是有道理的。以前是城乡差别，现在是区域不平衡，如果不限制，人口必定是聚集到一起，就好像世纪公园不设防，谁都可以进来搭个棚子占个地方，结果是可想而知。解决办法是，先强力管住人口无序流动，逐步改善区域平衡，常抓不懈。这个过程确实存在不公平，但是最科学的，哪有绝对公平？


    户籍制度，说白了是保护了城市贫民。取消户籍，意味着取消福利。对于富裕人口，取消公办小学，他更希望读私立小学。取消医保，日本也就两个小时飞机。取消帮团也无所谓，富人也从来没享受过。取消政策房，最好，房租又高了。屌丝说取消户籍，实际是抢夺城市贫民的福利，不是公平，实际是不公平。


    现在京沪结婚，相当于一个近千万的企业并购规模，居然没有任何的尽职调查，酿成了无数唏嘘故事，令人发指。望广大法律金融征信专业人士，挖掘潜力，找到突破口，尽快形成市场认可的商业模式。'
