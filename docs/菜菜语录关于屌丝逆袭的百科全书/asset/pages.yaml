  md: '30 岁的意义：30 岁前，你可以靠考试和文凭，获得很多利益。30 岁后，一切看销售额。


    # 第四节 正确的人生是抓大事


    大妈思维。喜欢比较各种优惠促销活动，然后进行最佳方案组合。你若有过这种行为，你要注意了。这种思维方式，会坑人的。你会下意识的把这种思维方式，带入到人生就业生活的方方面面，最后真就是个大妈了。当然，这不是失败，只是不成功而已。正确的人生，把所有力量集中起来，抓住几件大事即可。


    我的经济学经历，平时都是不灵的，但关键几个大事情，抓的紧。大学是最好的。第一次工作是优质，现无业。老婆抓的稳准狠。房子抓住了。股市基本不看。公司及时关闭。房产只买不卖。就这几件事情看牢了，我现在不愁了。


    我不喜欢读书，也不需要读书。任何具体事情都有专业人员，工程师，分析师，律师，注会。我只要保持对大势的直觉就行了。我天天写微博，就是了解人心，了解趋势。现实中，没有熟人愿意敞开心扉。我不用微信，也不喜欢微信，熟人之间没啥营养。只有陌生人之间的单刀直入，快意恩仇，才是人心。爱微博！'
