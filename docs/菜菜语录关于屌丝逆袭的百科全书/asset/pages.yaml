  md: '但是，当熬到 35 岁了，95%的人就开始走下坡路了。没什么发展了。这些一直是螺丝钉，技能单一，离开企业就是个SB了。


    读书不好的人，起步很惨，一般是去小企业打工。小企业一般是三个层级，一般是工人，主管，老板。老板和大部分工人也熟悉。这就导致了一个可能性，如果你在底下干的认真，很快会进入企业核心圈（一般3-6个人），员工流动性很大，你干得好，上上下下都知道。你也熟悉和掌握了办企业的一切知识点和经验。


    如果时来运转，你35岁有机会创业了，或者内部承包，发大财的可能性是有的。因为你的竞争对手都在高大上的陆家嘴写字楼里虚度光阴，而你已经在小企业里独当一面了。单说金钱，小企业老板，比一个五百强的部门总经理，可能要好的多，人也自由得多，一年赚百万，真的不算什么稀奇。


    优等生的中年人生。


    外企有个隐秘的发展曲线。毕业后的10-15年，你如果努力又聪明，你会飞速发展，“一年一进步，三年大进步”，从年轻到中年，一直是顺风顺水。但当你接近40岁时，你的曲线就断崖式结束了。这事情没人会告诉你的，你也不知道。但这是事实。只有1-2%的管理人员可以豁免。


    对中年人的话。风险是辩证的，不是单向的。你躲在大单位里，貌似安全了，但你可能失去了改变命运的机会。当你无力再改变的时候，大单位突然不安全了。我靠，傻眼了。这就是我上一代人的路。'
