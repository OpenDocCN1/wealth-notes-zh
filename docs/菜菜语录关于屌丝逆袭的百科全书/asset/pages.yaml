- pgno: 61
  md: '莱莱，某同事诋毁我，我是大单位新人，男的，担心撕破脸，对我的前途有影响，一直是忍气吞声。现在，有的人背后说我坏话，越来越厉害了。怎么办？


    答：这是典型问题。我年轻时也遇到过。我当时也是忍气吞声，怕影响形象。现在，我以过来人的眼光，谈谈体会。


    我建议：转正后，豁出去闹一次，就针对他一个人。坐在他办公室，大吵大闹，领导来劝了，就哭一耙走人。但不要涉及别人。


    闹开了，短期内有负面影响。领导永远不希望手底下有人闹。但是，利大于弊。


    +   1，别人知道你是个敢惹事的家伙，就不会轻易黑你了。大单位，没人愿意公开吵架。


    +   2，大单位领导，变化太快了。你刚刚入职，晋升是几年后的事情，那时候，大家早就不当回事了。早撕早受益。


    +   3，个别领导和大部分同事，还会好奇问问为啥吵架？那你减少了很多误会。


    +   4，挑选吵架的对手，要特别注意，不要挑领导眼里的红人，最好挑个老油条。既体现了战斗力，后果也不太严重。老油条在单位里也没朋友。


    +   5，事后肯定要做检讨。部门会议上，痛哭流涕装可怜。书面检查跑不掉的。但这个不要紧，这玩意不会进档案。随它吧。


    +   6，年轻人脑子发热，大家一般不会太苛求，只是让你不要再吵了。单位也要和谐。'
