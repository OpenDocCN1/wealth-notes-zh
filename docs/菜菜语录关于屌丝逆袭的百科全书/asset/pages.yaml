  md: '可以发展一下其他爱好，时机到了，也有收获。


    # 做大生意。


    +   1、你看好某个新行业，要在不知道怎么赚钱的情况下，先切人进去。这时候，进入成本很低，就当是布个闲棋冷子。


    +   2、不要急于赚小钱。这个收费几十，那个收费几百，看似热热闹闹，其实没啥大头头。


    +   3、提供有价值的内涵。你可以一个月出一条，但要有价值。


    说个财务秘密。现在有很多行业需要大 V，但不是那种情感笑话类，而是业务类。例如发电机，水管，机械，电子，法律，会计，等等。这种大 V ，很难产生，因为把枯燥的专业知识，写成天天有人看的乐呵呵的微博，且要围绕业务特点，进行知识普及，非常困难。希望大家想想办法，一但，有，必发财。


    这里面的每一个领域，都蕴含了无限商机。你选一个，像莱总那样坚持不懈，4-5年，必有大成。到时候，你随便干点啥买卖，都行！我是财经类第十名，前九名都是炒股的。


    微信也在实验创造“专业学科大 V”，但内容问题没解决。现在比较烂市的是宏观经济类，都在冒充专家，好像 90 年代的股评家。成功的行业大 V 极少，考试类，淘宝类，手机类有了，但还有成千上万的行业，没有大
    V 。这是个巨大的金矿，但开采困难。要是你能够普及一句，装修看 XX，那是亿元级财富了。'
