  md: '甩起来麻烦。


    屌丝家长，你要告诉儿子，刷题考上 211，就是读书的终点站，进了大学，只要混毕业就行了，什么几把英语六级，直接放弃。打篮球，练胸肌，比高数满分重要的多。白富美和丈母娘，喜欢男性荷尔蒙，不喜欢酸不拉几的数学课代表。（莱莱的毕生经验，全部奉献）


    现在，最穷的是好吃懒做，喜欢坐办公室小地方来的大学生。我给农村女孩指个路：护士，三年大专，收入高，小医院 6 千月薪，大医院 15 万一年，关键是找工作容易。如果英语好，移民也是很快的。现在，加拿大、澳大利亚抢着要，但英语学习难。护士，算是体面的苦工作，京沪嫁人也是加分的，毕竟是稳定工作。


    穷狗的内在原因是：一是缺乏信息，很多观念还停留在五年前的**小道消息**。二是嫉妒烧毁了理智，最希望富人明天出大事，他可以看笑话。三是懒，想暴富。**我的赚钱经验是：做任何主业，最后都不赚钱了，但在做的过程中遇到了很多机会，而这些机会会导致了我最后赚钱了**。穷狗是不会理解的。


    # 第四章 婚恋泡妞篇


