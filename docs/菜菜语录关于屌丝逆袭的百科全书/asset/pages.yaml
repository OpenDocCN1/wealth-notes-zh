  md: '这不是因为女孩子喜欢钱，而是因为钱能表达男人的爱，他说你一个人没钱的人跟我一个有钱的人同时喜欢一个女孩子，结果我想见她就去见她，逢年过节没事就送东西给她，然后她开心不开心我都能想陪着就陪着，你呢？没钱，想去看她，还得安排时间，要送点东西给人还要算来算去，然后她不开心了，你还走不开，得加班工作，你说站在女孩子角度想问题，谁更爱她？在她眼里一定是我更爱她啊。想都不用想啊，同样两个男孩子，都说很爱我，结果一个天天来找我，天天送东西给我，开心不开心都陪着我，一个开心也不陪我，不开心也不陪我，也不送东西，也不找我，还说爱我，你信么？女人不是爱钱，更是爱一种被喜欢被尊重被追求的感觉，这个角度看问题，当然是有钱男人更能获得女孩子的喜欢，前提不要是有钱渣男，因为你也很难证明一个没钱的男人一定比有钱的男人，人品更好啊。所以在同等条件下，有钱是很大的加分项。然后他还说还有25%的女性是光靠钱搞不定，还需要花时间，需要大量的时间，这个比钱更重要，问题是你没钱哪里来的时间呢？所以还是得有钱才有时间。还有5%的女性是钱也搞不定，时间也搞不定，这个就需要魅力去征服了。然后他就跟我说，你看魅力这个东西，本质其实也还是钱啊，你跟我一起吃饭，我看你那么能说的人，也一句话不说，为什么啊，因为没我有钱啊。我点点头说是啊，没你有钱，说什么都是你对，还不如不说。所以你自然就更又魅力了。听完这段话，我就默默回去继续努力赚钱了。


