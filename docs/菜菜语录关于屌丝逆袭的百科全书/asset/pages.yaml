- pgno: 42
  md: '正确的做法是死缠烂打。女人到 30 岁，表面不打折，实际是没条件了，只要有礼貌的紧追，无往不胜。


    女人有两种需求：情感需求和经济需求。但是，大部分小康家庭的女孩，大一到大三，对经济需求不太深刻，刚刚走完高考，看了不少韩剧，放飞自我，此时更多的是强调感需求。记住，这是屌丝自用的唯一窗口期。一旦女人开始大四求职，看到闺蜜嫁入内环线三居室，世界就变了。


    追女生，几个星期内，没牵上手，就可以换方向了？


    二人单独约会三、五次，女生不给牵手，男的可以撤退了。


    牵手，是女方代表愿意交往的认可度。不是所谓约炮。女方不太喜欢，但又想找个备胎，男粉丝应该有心理准备。每个女生都是从白雪公主一路降价，最后到群租房的也是大把大把，因为王子太少了，最后就是在农夫和花匠里面挑个帅一点的，这无可厚非。但农夫也希望知道自己是不是备胎。所以，有此一问。


