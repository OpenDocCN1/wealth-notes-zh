- pgno: 29
  md: '能力强，段子好，视频精美，你就是个地市级电视台的水平。这要赚来多少钱啊！加油加油。五十万年薪不是梦！


    我的 2 次小预测。


    第一次，四万亿。那时候的人，大多数不懂货币，即使懂货币，也不会把学术和个人生活联系起来。我是货币学专业人士，弃实从虚，算是走对了，当然，胜之不武。


    第二次，自媒体。我们是同一起跑线。六年前，我并不知道自媒体如何赚钱，但这是一种颠覆性改变，可能会有新机遇，现在自媒体真的干掉了纸媒。我还把家里的有线电视停掉拉，因为长期不看。今后，自媒体是大方向。赚钱机会多。我并不急于靠这个赚钱，就当是价值储蓄了。当然，我这么多年没有被封号，也算比较懂事。踩线不过线，遇事先跪倒。


    微博，越来越审美疲劳了。原创内容的大 v 基本没有了。剩下的大 v 是：炒股，明星发照片，互骂，情感专家，小广告，六学床的。很多人去了微信（广告收入高）。原因是，自媒体很难持续保持高质量，毕竟个人精力和水平是有限制的。微博没有创收渠道，也无法聘请员工。今后热度过了，可能也是搜狐同学录了。


    【自媒体为啥走不远？】近来，自媒体发财的人很多。某女装微信号，教女人穿衣打扮，一年广告收入近千万，成本就是请两个人在'
  merge: -1
  img_proc: true
- pgno: 30
  md: '网站扒图片，写打扮教程。自媒体都是一些极具才华的人，厚积薄发，一朝成名。但问题是，个人再有才华，经不起一天几千字的创作消耗，往往两年后就没干货了，无长期商业价值。


    【自媒体的风格受制于商业模式】。自媒体的两大趋势：一是专业化，二是段子化。专业化，表述精准，四平八稳，喋喋不休，专家认可，但会导致阅读量急剧下降，因为屌丝实在看不懂，无法评论。段子化会因用词的严谨性不够，而饱受鄙视。目前自媒体尚未形成商业模式。所以走向不好判断。


    【如何增加粉丝？】内容最重要。微博推广其实很简单，你在类似主题的中v微博里写评论，例如房产，经济，中介，育儿，家教，卖货。写得好，自然就有人看，有人粉了。但不要在那种评论几千的大v下面写，因为很快会被淹没。最好是50-100条评论的热点中v那里写，既有热度，又不会被淹没。三个月见效。


    不加V的商业模式，是典型的隐秘需求解决方案。


    商业消费分为明显需求（衣食住行）和秘密需求（不见光的，愿意花大钱的）。我以前对隐秘需求不熟悉，自从写了微博，我发现，这种需求是非常巨大的。


    隐秘需求，最典型的是是和性话题有关。实际上，供需双方都是巨大的，只不过没有渠道。但是除了这种需求，还有很多情感类需求，例如如何斗小三，如何控制老公的钱，如何给离婚抢房子埋下伏笔，'
  merge: -1
  img_proc: true
- pgno: 31
  md: '如何化解各种内心痛苦，这种需求不是什么心里治疗医生可以解决的，而是需要值得信赖的老江湖能提供。


    不加 V，就是提供了这种商业模式，非常成功。我相信，不加 V 的收入是非常高的。我从来不做情感咨询的人，都可以接到不少这类咨询，如果换成专业接单，全国各地的非正常需求是非常非常大的。而这种商业模式的定价权在于提供者，所以，这种需求，非常值得研究。


    怎么当网红？很多人说，我没钱去炫耀，何老师有钱，我没办法了。有人说，我也不漂亮，不如星妹妹那样条顺脸嫩。其实，这些都不是主要的。最重要的是，你有别人感兴趣，但又不懂的内容。你就算是个淘宝妹，你把工作的快乐分享一下，也是网红。你看急诊室的莺老师，居然把那么枯燥乏味的事情，做成了网红。你的工作总不会比急诊室包扎绷带还枯燥吧？


    # 第七节 985 要不要留京？


