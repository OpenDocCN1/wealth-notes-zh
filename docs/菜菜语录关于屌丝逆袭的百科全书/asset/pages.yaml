  md: '口大骂，但98%以上，讲信誉，守规矩，不害人。我对她们充满感情。现在实体小店，几乎是灭顶之灾，淘宝抄号族把小店逼入绝境。我谈楼市，就是给些启发，很多人已经成功突围了。


