- pgno: 3
  md: '黯淡出了人们的视线，再也不提他的名言名句了。这是多么大的胸怀和情操啊！菜总不争名，不谋利，用一个知识分子的淳朴，淡然的解释京沪，解释经济，解释人心。向菜总致敬！


    讲房价最好的，应该是菜总。北京爿偏交易细节知识，杨红旭喜欢搞一大堆数据，眼花缭乱。菜总讲房价，是举重若轻，把大宏观问题讲成了邻居大叔的家常话，老少咸宜，难能可贵。但菜总有时候挖苦人太狠，可能是为了突出亮点，也可能是斗嘴，实在是令人厌恶。菜总微博，刺激肾上腺激素，多看会上瘾。


