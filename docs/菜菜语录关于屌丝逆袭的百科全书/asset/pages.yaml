  md: '不能经常负重，个子矮。


    二是生活技能，女孩买菜做饭，缝缝补补，男孩修个自行车，换个灯泡，安装电脑桌。


    三是抓分数，考上复旦交大是重中之重。一个豪门媳妇，二本还是顶级大学，天差地别。


    四是注意视力，劳逸结合，不要近视。


    要教孩子学好，千万不要从小就让孩子适应社会，教孩子一些偷奸耍滑，占便宜的事情。


    家长要培养孩子将来做大事的心态，必须要讲诚信。诚信是，吃小亏，等待大机会。年轻人收入低，很容易陷入斤斤计较的窘境，一定要摆正心态。占便宜就像做小偷，会上瘾的。必须在源头上卡断，从小盯紧，不忘初心。我对孩子投入那么多心血，不是为了培养一个很会占便宜的聪明小人。我的一生，都是为了孩子在更大的舞台上竞争一次，哪怕失败，也值了。这种高段位的竞争，基本不看聪明了，而是看你对利益的态度。你每次分30%，你可能会有一次机会，你每次分70%，你就没有下次了。你对人宽厚，人家心里都懂的。


    我现在发现，孩子的性格养成，基本是随妈的。大部分家庭，父亲没耐心带娃，结果，娃就偏向母亲的性格，甚至是生活习惯也是。看来，找个靠谱的老婆，很重要啊！'
