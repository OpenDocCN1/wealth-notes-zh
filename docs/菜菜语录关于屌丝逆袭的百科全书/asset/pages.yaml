- pgno: 57
  md: '题了。


    # 第六章 人情世故篇


    # 第一节 交朋友


    求人和托人的区别：求人，是你没资源，纯粹是去求人，例如孩子入托，今后要用尊严去还人情。托人是指，让你帮个忙，是我看得起你，以后你有事，我帮你。你不愿意，我给别人打电话，也没问题。一个入混社会，关键是你有多少资源。没人脉，可以多请客，但要给人一种印象，我懂事，不是来占便宜。


    如果你的资源缺乏,单纯的掏心窝子的招待同学朋友,毫无意义。别人还以为你有啥要求帮忙的棘手事,反而会躲躲闪闪。我失业是主动的，不需要钱了，还上什么班啊？但很多熟人同学不知道原因,猛地听说我这么好的条件,居然失业了,以为我犯事了。本来高高兴兴吃饭,吃了一半,说话都留三分。啥，我懂。


    人脉是怎么来的？利益置换。屌丝不要处心积虑的到处巴结权富，没用的。你踏踏实实想点什么办法，让自己变得有点儿利用价值。哪怕你会做一手卤菜，也比副教授靠谱。


    三五年不见的朋友，基本没有共同话题了，除了回忆往事，就是各说各的。一句话总结，你帮不了我发财，我帮不了你升官，吃次饭，'
  merge: -1
  img_proc: true
- pgno: 58
  md: '拉倒了。没有共同利益的纯消耗，不可能长久。交朋友，最主要的是能够互惠。所以，屌丝不要埋怨高富帅疏远你。大家都很忙，你有啥让别人值得花时间的东西吗？没有，请走开！


    别人和你交朋友，不是为了帮你忙，而是希望你今后帮他的忙。等你交换，基本可行。若你想让朋友多冒点险，250才理你。若以为，我今天拿公司利益请客，你就会记得我的好，等我创业了，你就会回报我。傻逼。等你创业了，你就是马路上的路人甲，无权没势，谁理你？最多，路边餐馆一顿低价酒的交情了。


    朋友。给目前“还在位子上的人”说个体会。你到了人走茶凉时，曾经的兄弟，最多5%会继续认你朋友，90-95%都是礼貌性客气，遇事就装傻，一接电话：“不好意思，我在开会”。记你好的人，往往是混的差的人，他一辈子没什么人帮助，你偶然帮他一次，他感谢一辈子。而那些精英，遇到好事太多，不当回事。


    # 第二节 如何混大单位


    大学生如何判断上司对你的态度？这是人生最重要的事情，但谁也不会告诉你。其实也很简单，安排透露一切秘密。你千万不要以为，有好事忘了你，是领导一时疏忽，或名额有限。遇到两次，你就不要再骗自己了。赶紧辞职，或者改换门庭，跑另外一条线了。领导做事，心思极细，绝不会忘了自己手下的。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '混大单位的时间安排：50%时间研究上司，要让上司满意；30%时间研究同事，防止出现过多诋毁；20%时间研究业务，别出错，争取有点小成绩。干业务，到头也就是个部门副职，没啥意思。年轻人应该志向远大，争取上台阶。有背景的，别人不会惹你，不要自己炫，但要让人知道，找个
    38 去放风，自己不提。


    这种地方，第一讲究的是混。技术不行没关系，找个技术骨干给你当下属就行了。混的诀窍是，让别人觉得，你能够给别人带来利益，别人就会不反感你。他吃剩下的骨头，可能会甩给你一块，你就爽了。


    【没背景，如何在大单位做人？】兹事体大，难啊。


    一是不要急吼吼抢好处。名利不靠你主动抢，而是领导发的。你硬生生抢到了芝麻，会丢了西瓜。


    二是不要太冒尖。你牛，显得我蠢，想死你。工作偏上即可。


    三是会忍。你肯定不会是第一波提拔的，你要帮助第一波人上去，他若在大头头家偶然说你几句好话，你就值了。


    四是不要说别人坏话。哪怕这个人欺负你，你委曲求全，认怂认错，人家也就放过你了。千万不能进入撕逼模式。


    五是不要对单位大变化发表意见。嘻嘻哈哈，含糊过去。


    六是至少要和一个顶头上司关系较好。


    七是其他还有很多。以后再谈。'
