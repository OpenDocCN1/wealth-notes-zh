- pgno: 38
  md: '程度。专业积累什么的不说了。


    说个小故事。完成一件事情，有两个办法，一是用机智的办法，又快又好的完成；二是用下苦力，笨方法，满头大汗的完成。那么，对上要用笨方法，这样显得你很努力，很厚重，人畜无害，重点培养。如果你对上用巧办法，那么上面对你的印象是，此人太狡猾，要防着。你是聪明不讨好，屌丝后备军。


    没有后台，你干的越好，越倒霉。


    莱莱，我是上海211屌丝，应届研究生，我准备毕业了先在上海赚3年钱，然后回自己省城，你怎么看？


    答：这三年的主要任务是，骗个老婆。


    +   1，建议去外环外就业。例如青浦，嘉定，松江，奉贤，南汇。这三年就是争取遇到拆迁妹。


    +   2，注意打扮，浑身上下搞干净了。不要考虑事业发展，反正是要走的。赚的工资全部买名牌。眼镜，包包，服饰。


    +   3，第二年买个车，十万左右，首付五万，上老家牌照。泡妞方便。


    +   4，租个郊区漂亮公寓，就说是自己的。有上海妹愿意来，你抓紧用了。


    +   5，省城相亲要抓紧，但不要发展太快，礼貌大方热情，否则，'
