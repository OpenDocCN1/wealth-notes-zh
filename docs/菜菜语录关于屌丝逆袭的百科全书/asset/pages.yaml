  md: '我完全支持考证书，例 CPA，码农，工程师，律师，医师，翻译之类的高端证书。大学课程基本是垃圾，教的也不上心，学的百无聊赖，倒霉的是父母血汗钱。高级证书的通过率很低，CPA
    大概是 5-8%，医师通过率大概是 80%，这就逼得你认真学习，要比别人学的好，这就玩命了。如果没有这些考试，学生质量太差。


    我永远不想再回答青春。我是学霸，青春年代全部是在做题。家里也穷，校花看不上我。我是天天下班加练，苦练业务，下班背 GRE，根本没用，人家有关系啊。唯一捡漏是，某重要业务竞赛，人事科看我平时拽，就派我去比赛，准备看我笑话，我拿了全国第三，前三名公费访问学者，迅速拿下李嫂。异常惊险啊！


    回忆过去，我至少经历过三次不成功便成仁的底线竞争。侥幸，三次都全身而退。总结起来，其实也很简单。首先，你怕的事情，别人也怕，也发愁；第二，人的智力水平差不多，就是比赛虐待自己；第三，如果你赢过几次这种极限比赛，你会对自己有完全的自信心。人嘛，都差不多，专业不同而已，没啥拽的。


    新人为啥得挑桃子？坐得住，耐得住辛苦的态度，是未来许多事情所必须的；简单重复性劳动中都不能发现规律和技巧的人，多半不能委以重任；处理简单事务的能力远远没有想象中那么简单；在工作中与人沟通和相处的能力需要相当的磨砺，才能达到足以担负重任的'
