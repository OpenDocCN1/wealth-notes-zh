  md: '似决策失误，最后赔光了全部家产，还欠下巨债。我是当事人，吓得浑身发抖。菜嫂他们家根本无所谓。我以为我遇到老赖家庭了。丈母娘对我说，确实大亏，满仓库都是卖不出去的产品，今年卖不掉，明年就是老货了，也没人要了，家里没钱了。但你要相信，明年肯定发财。我以为他们全家是骗子，只想把自己的几十万要回来。


    第二年，丈母娘确实发财了，但还是没有弥补第一年的亏损，第三年才打平，以后就发财了。第二年，我去问老丈人，你不怕吗？老丈人说：我已经告诉你了，我肯定会赢的，你为什么要怕呢？我说：第一年亏了二十套房子，你让我怎么相信你？老丈人和我说了原因。（你看三遍）


    +   1，开厂卖货，最重要的是销路。必须有无数的小商户给你拼命推销，把你的货摆在他们店里最核心的位置，所有的营业员都赞美你的货。但是，你怎么让他们死心塌地的这么干？


    +   2，让他们赚钱，赚到他们满意。于是，第一年，我们拼命的生产，不管什么型号，什么品种，全部是过量了两倍在生产，目的只有一个，让小商户要什么有什么，没钱进货直接赊账给他们，确保他们首次合作就发财。


    +   3，小商户赚钱很难，好不容易抓到了一个大厂，让他们发了财，第二年就彻底死心塌地了。我们第二年连进货的钱都没了，但不要紧，卖销售权。你还想发财吗？交二十万预付款。钱就来了。打开了销路，占领了货架，取得了对方信任，你还会穷吗？


    穷人和富人，是两种思维价值观。'
