- pgno: 22
  md: '式绝大部分来自家庭，要记住，他们错了，所以穷。你应该仔细观察富人。不要说什么人家假冒伪劣，尔虞我诈，你这么好，为啥还穷呢？


    举个最简单的例子。你读书的时候，成绩好，但不愿意和大家分享你的经验，考试不让同学偷看你的卷子，担心别人超过你了。工作后，什么事情都想压人一头，显示你的水平高，期望上级提拔你。其实，这么做的结果是，你根本上不去。因为你把所有人得罪光了。


    正确的思维是，愿意分享。世界这么大，钱赚不完的。你赚你的，我赚我的，我拉你一把，不求回报，至少你会说我几句好话。菜菜这个够意思，能够当兄弟。这就行了。单位里有18个处长位置，你也就占一个位置，你帮人一把，又如何？


    坏人到处有。但是，大部分人是懂得回报的。不懂回报的人，走不远的，你放心，他绝对不会在下一个竞技场和你相遇，因为别人会干掉他的。你做不出惊天动地的高科技，大部分人做不出来。大家都是平常人，就是一句话，混人情。为什么混了这么些年，最后你富我穷？很简单，我对别人有用，别人就愿意把机会给我，而不是给你。


    （菜总原创）如果你的父母没有成功过，不是土豪，没有处级，就永远不要听他们的。


    他们这一辈子就活在了底层，接受到的所有信息和价值观，都是最劣质的，最容易贫困户的，最斤斤计较的。貌似精明占便宜，实际上一生悲催。举个菜嫂家的例子。


    菜嫂家里多年前新开了一个生意。第一年做，我也参与了，貌似


