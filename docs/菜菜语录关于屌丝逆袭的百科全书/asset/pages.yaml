- pgno: 60
  md: '没有背影，如何混大单位？大单位的第一特征是垄断的，没有外部竞争者，全是内斗。这种地方表面看也要技术，甚至是很复杂技术。没经验的屌丝很容易痴迷技术，而被边缘化。


    那些一天到晚，拼命研究技术，瞧不起别人的 250，没有好下场。你牛，显得我蠢，册那，摁死你。


    为啥上面不鼓励技术？没有竞争，要什么技术？你再能干，我通过种种办法，不让你干，你技术再好有啥用？


    技术特别好的人，怎么摁住他？给他扣个帽子，人品差之类的。


    你已经坐在办公室里了，先不要干活。先思考几个问题，


    +   1、同事能从我这里得到什么好处？


    +   2、若否，那别人为什么要拉你一把？


    +   3、我今后上升的依据在哪，碰运气？


    若你想不明白，干也是白干。


    大单位怎么提拔人？隔代制。直接领导不能提拔你，但可以坏了你。提拔，必须是再上一层的头决定。如果没有背影，你的头最多不害你，但很难硬帮忙。其他竞争者，天天说你坏话，你们就在泥潭里互相撕逼。十年后，就是个猥琐大叔。这是无数人走过的血泪路。你，十有八九也是这样。若有背影，绿色通道。'
  merge: -1
