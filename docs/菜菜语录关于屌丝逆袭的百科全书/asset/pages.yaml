- pgno: 65
  md: '我一辈子都在帮别人忙。如果你要混大事，记住一句话：攒什么，不如攒人品。


    人心莫测。很多人一辈子生活在幻想中，自以为称兄道弟，请客多次，朋友很多。实际是，当你真正谈到钱和利益的时候，朋友基本没了，剩下的就是利益分配，和路人差不多。你眼里的朋友，就是他人眼里的路人，没啥区别。做生意成功，不要指望所谓的‘朋友’，而是让别人有利可图。


    没有大本事，就不要折腾了。


    做老板是条不归路。做了老板的人，就没能力再去当员工了。对员工的要求，某个技能熟练，其他你不用管了。老板的技能是，具体技术不要老板操心。对外，老板要拉来单子。对内，分配利益，别自己人打起来。别看劳资双方朝夕相处，完全两个世界。老板做久了，基本是不会干活了，满脑子搞人。创业需谨慎。


    如何证明对方已经和你绝交了？求人帮忙，短信微信，两次不回，你打电话过去，对方只是淡淡的客气，毫无热情，OK，你自觉一点吧。如果你是重要人物，你不理他，他逢年过节，必然会给你发短信微信。如果一年没有主动联系你的人，可以删除了。


    我做生意的信条：事先斤斤计较，事后绝不违约。即使亏本，也'
