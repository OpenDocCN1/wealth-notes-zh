- pgno: 56
  md: '# 第三节 学校教育的问题


    学校教育和私塾，类似流水线皮鞋和定制皮鞋。大规模标准化，好处很多，但本质是大路货，没有收藏价值。私塾是个性定制化，成本太高，机会难得，但出精品。但普通人没有机会得到。本来民间还有一脉传承的家学，文革也打断了，现在独生子女的主要任务是考大学，也废了。走完
    16 年教育，你基本就废了。


    很多屌丝以为，私塾是读几本三字经，这只能说你是屌丝出身了。私塾确实读点古书，但那是增加文学修养，写作文溜一点。私塾本质是，如何个性化的适应社会，考学，拜码头，拉帮结伙，经营生意，如何与黑白两道混，如何走门子投机。你以为是电视里的酸秀才背书啊？简直
    250。民国大佬多经历过家学。


    上学的时候因为考评方式单一，大多只看分数，非常单调乏味。还是社会这所大学有意思，没人管你，没人监督你，全凭自觉，更重要的是，没人教你，要自己感悟，没有人给你打分，没有人告诉你哪里错了，不是每件事都像解数学题那样有固定的顺序，对错的尺度并不明显。所以，很多好学生进入社会后很茫然。


    中小学培训机构的问题在于，太早学套路，而不是注重实际能力的提高。大部分的小孩子的学习能力是个逐步提高的过程。我们家小子从来没上过学前班什么的。刚上小学，数学跟不上，我看了下，我说没问题，不是数学不好，而是语文不好，读不懂题目。后来就没问'
