- pgno: 25
  md: '万设备，以废品价格卖掉，这样，董事会其他人就不可能趁我不在的时候，盲目生产了，就真想赊账，也没东西赊出去了。这也是我天天写微博的原因。我就趴在厂里，顶死看牢，谁敢违反纪律，我立马踩刹车。


    又熬了一年，周围剩下的企业，只有两个了。原来的第一名企业和我，销售规模差不多了。


    第三年，其实市场很好，但是合作的销售商精神崩溃了，大部分转行不做了，导致我们只是小赚。第四年发大财了。第五年全部收复失地。


    # 第六节 为什么写微博


    莱莱，纯好奇，你花这么多的精力在微博上，但并没有做任何营销、广告、收费等项目，甚至据说连版权和署名都放弃了。难道您是在纯做公益？


    答：我是个聪明的 250。人生，时时刻刻，要给自己留出另一个通道。万一哪天我穷了，我立马可以转型卖土鸡蛋了。保证三个月超过老榕。


    感叹一下。我写微博五年多，开始是好玩，现在每天都有要求打广告的客户来联系，一条 1500 元，如果我接广告，估计一个月也有不少收入了。当然我不赚这个钱。我的体会是，如果你认认真真做一件事，五年基本有收获。希望同学们也努力，在做好本职工作的同时，'
