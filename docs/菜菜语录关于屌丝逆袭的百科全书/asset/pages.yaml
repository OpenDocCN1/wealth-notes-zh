- pgno: 4
  md: '# 第一章 关于经济大势


    看到趋势，才能发财。


    中国是个巨大经济体，整体经济发展趋势不可能是突变，是可以预测的。巨轮掉头，不是一眨眼的功夫，很多人不懂这个政策会带来什么趋势变化？哪种选择的可能性最大，何时发生？就事论事，永远慢一拍。等你在报纸上看到，就没有机会了。你必须看出报纸上没有刊登的后续政策，才能赚钱。


    中国经济是一艘巨轮，不可能急转弯，货币政策是方向盘。根据我们的研究，货币政策从确定到公开，大概是一个月。从公开到市场有所反应，大概是一个月。从有所反应到形成共识，大概是两个月。我们只要在三个月内完成规定动作，就可以笑的脚丫子乱翻。菜菜不上班，天天看盘。你记住了，要是打冲锋，你就躲在我后面，跟着我往前跑。


    我这些年一直在思考货币。我不看西方经济学，那是乱说的。我就看央行微博和数据，看了这么多年，看出感觉了。稍微有点变化，我就会捕捉到。连续三个月是相同变化，肯定是有话讲了。所以，我猜谜语超级准。任何事情都有预兆。特别是大事情，有个统一思想的过程，这就是我们的机会。


    内环线的爱情最美！'
  merge: -1
  img_proc: true
- pgno: 5
  md: '经济学，不能保证一个国家发财，否则，每个穷国发一个诺贝尔奖获得者，就没有穷国了。经济学对个人有意义。一个政策出来之前会有风声和预热，你要高度警惕了，甚至可以打埋伏了，等政策出来，还有传播理解的过程，大概2-3天，这就是抢钱的时间点。我前年微博说，M2到14%，京沪暴涨，一月份完美兑现。


    经济学原理是枪，资金是子弹，两者结合，才有突围的可能性。


    地方财政收入四大块：负债，卖地，税费，罚款。（社保是专款专用）


    隔十年，就有一次大的改道。


    83-92年，是个体户，例如傻子瓜子；1993-2002，是乡镇企业家出风头，例如几个著名的富裕村；2002-2008，年是民企和外贸的黄金时期，出口厂老板赚翻了，制造业巨头，层出不穷；2009年至今，是互联网和房地产，群星闪耀，势不可挡。


    今后？


    服务业。


    我发现，服务业的利润确实高。因为服务业是一种个性化的需求，甚至涉及到其他更多的利益，例如生命安全，财产安全，子女安全，有时候就不太斤斤计较了。有志于做小老板的同学，可以考虑一下。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '资产永远比商品贵。


    沪牌是资产，年年增值，不存在折旧。汽车是商品，落地就不值钱。市场经济下，每个人都要有资产定价的基本经济学思维，而不是简单嘲笑你买不起的资产，不值这个价。车牌，作为资产价格，是对上海市区道路使用权的折价，而不是那块
    80 元不到的小铁皮，就像房产证工本费也就 80 元。


    2016 经济大思路，就两句话，一是县市去库存是主基调，二是假设京沪省城跌了，县城房子卖给谁？只要实事求是的理解了这两句话，今年的事情，就算办完了。


    世界变得太快了。今年是 2016 年，也就是十年前，你家或许还有机会住进内环线，一眨眼，沧海桑田，你连住进外环线也难了，你的社会地位和经济地位，已经急剧下降。不要以为工资增加了几万块，你就开心了。以后每隔半年，你带孩子来参观一次内环线，然后鼓励孩子说：好好学习，拼上三代人，也要再回去。


    个人不可能和经济大势对抗。顺势而为，保留火种。一旦有机会，再来也不迟。明知没有产品销路了，还恋战不撤，硬扛到底，看上去英雄，实际是悲剧。我从来不卖房子，不胡乱花钱，就是因为有一天，我可能还要回去做实业，要留个本钱。菜总很能干，能吃苦，你们不'
  merge: -1
  img_proc: true
- pgno: 7
  md: '要笑话那些比你还有钱还努力的房东。


    # 第二章 关于房产投资


    # 第一节 购房指导意见


    年入百万的普通家庭，买二套房，要看十年大趋势。


    上海限购二套。如果你不是什么大土豪，基本就是在 2-3 套的圈圈里打转了。例如万一你爸离婚后多买一套之类的。


    买房有个硬门槛，资金。绝大部分家庭，前面有贷款，后十年不断积累，再存个第二套首付钱，基本是极限了。


    我一直不谈哪个楼盘便宜一点，哪个楼盘会多涨个 5%，这是股市抢帽子的超短线做法，不适用楼市。买卖一套上海房子，税费几十万，没事最好不要乱动。这就是房住不炒的基本含义。


    过去十年，是内环线的黄金十年。不要说什么涨幅比外环线低3.65%之类的怪话，资产的秘密是：流动性和抗跌性。懂的自然懂。


    今后十年看哪里？我不说答案。因为，我也没有答案。但我谈谈思路。


    1，地缘经济学。这是大趋势。


    2，区域性贸易中心。结合新消费的模式，自己多琢磨。


    3，人口，货币，就业，如何平衡。


    4，新生代的思维和价值观。


    反正你也没钱去星辉国际，不如在家擼擼大脑。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '最后说一句，超短线思维，相对于十年，十五年的人生决定，那是毫无意义的。


    菜菜，大浦东和大虹桥，你看好哪一个？我只能投一套。


    答：我倾向于，十年后的大虹桥。


    大浦东是国优品牌，蓝筹股。大虹桥是省优品牌，绩优股。


