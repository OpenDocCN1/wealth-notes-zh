  md: '我经常嘲笑技术男，但那是高段位的竞争，不适合普男。如果你 100%努力了，但 35 岁不能成为业务尖子，说明你不够聪明。那就回老家，安安心心培养孩子吧。房在固安，奔波北京，身体都垮了。你在北京多赚的那点小钱，代价是全家人的健康和孩子活在河北小地方，意思不大。


    你来北京图个啥？就是图个人出头地的机会，不是每天四小时在路上，春节回老家吹个牛。你买河北房子，涨幅和老家省城也差不多，为了多一点点蝇头小利，忘记初心，无谓消耗体力，时间长了，人生就失去了目标。你尽可能靠近单位附近生活，用好这二十年的青春，努力成为专家（运气好可能走上台面），为下一代打一个基础。今后的竞争，是三代人的家族式竞争，不要多想自己的那点小面子，要看三十年。


    第一代人，要敢于自我牺牲，甘当人梯。


    大城市好处是，就业机会多。无论你学什么专业，在京津都能找到工作，哪怕是数学系和航天工程。如你没技术，就做简单工作，修空调，修热水器，修水管，开黑车，一个月搞个近万元。大城市人口密集，需求集中收入多。当然，你要有个房子，否则
    1/3 收入给房东，就郁闷了。小地方，基本没有技术岗位需求。


    小地方的最大风险是，产业单一。


    例如煤炭，钢铁，或几个大厂，或全县做袜子羊毛衫。高薪岗位'
