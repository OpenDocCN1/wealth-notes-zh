  md: '【给京沪穷漂的话】 我工资两万，没有房票，又要结婚。不买环京沪，我还能怎么办？这是 985 穷漂们的最常见情况。然后，985 们就随波逐流了。老婆找个上肥圆，也不讲究了，先用起来再说。房子，找个自己勉强供得起国安（看上去也很漂亮），先图个面子。结婚后，接来老家父母带孩子。


    小夫妻彻底进入生活的强制轨道，每天路上四个小时，回到家里瘫成泥。小夫妻浑身被各种绳索，捆成了五花大绑的肉粽子，无法动弹。这样的情况很普遍，大家也认可。但这种生活有意义吗？房子是河北的，老婆是外地的，孩子上的是河北小学，连贷款都是河北的。你是来北京还是来河北？你为孩子留下了什么？你为啥要走上这条路？看到这里，我估计你想哭了。


    985 应该走出什么样的人生弧线？我不敢说我懂，但我可以分享一下我的经验。我从来没有坐过公交车上班，到现在都不会坐地铁。我毕业后，一直是在单位附近生活，起初是租破房，后来买小房。我把所有的热情和精力，投入到工作和学习中。我在单位里迅速成为业务数一数二的人。我当时想好了，如果没被起用，五年后，我就凭本事跳槽。后被起用了就没走。现在看来，前十年的钻研业务，是人生转折点。


    穷人最宝贵的是，青春和努力。少时苦，不是苦。老来苦，真正苦。你没有背影，没有三百万首付，你唯一能做的就是，把自己的业务水平拉高到别人比不上，靠本事成为尖子。第一代只能走技术之路。'
