  md: '唯一住房，置换期内，户口怎么迁？部分人卖老房，买新房。老 房户口要迁走，新房产权证没下来，不能迁入户口，引发争吵索赔。（实际居住是租房）。理论上，房东可以申请暂时落户到社区公共户，我遇到了几个实例，手续复杂，尚未办成，不确定性大。为避免纠纷，建议：30万保证金，一年迁走，否则没收。


