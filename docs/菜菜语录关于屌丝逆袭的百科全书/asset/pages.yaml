  md: '住这个，包你三代不愁。


    # 如何追女神？


    我包你成功。你同时追 3-6 个，注意保密，不怕丢人，就是隔几天微信联系一下，不要骚扰人家。到 28 岁，你必能够下手几个。相信我，没错的。微信的拟稿：我很仰慕你，我知道自己配不上你，就是默默喜欢你。我愿意为你牺牲一切。不求回复，只求不要拉黑，看到你的照片，就是我最大的快乐。


    记住一条。没人会嫌弃狗长得丑。


    # 女神心态。


    女神接到自己不喜欢的男生求爱微信，第一反应是恶心。没关系。这种恶心，是会变的，只要你不频繁的去骚扰。摸奖，一周一次即可。随着时间的推移，女神也会有情绪低潮期，脆弱期，这时，她的想法就变成了喜欢忠诚，哪怕不是男神。她也会默默想起，几公里外，有个对他非常爱慕的屌丝。


    操她。


    反正屌丝也是闲的没事，发条微信，也不占时间。时不时的发一条，就当是免费摸奖。


    # 求莱莱指导如何追男神？


    答：基本类似手法。人类的共同心理是，喜欢忠诚。虽然你不会'
  merge: -1
  img_proc: true
- pgno: 41
  md: '嫁给一条狗，但你还是喜欢狗的忠诚。男人也是。如果有个女生，虽然不好看（但也别太恶心人），男生是知道的，即使不回复，他会把你当做一个心理底线。万一哪天喝醉了，你就可以下手了。


    不求永远。


    我有个朋友，没钱也不帅，为人还算大方，先后和几十个妹子好过，其中不乏颜值高的。我也问过他追妞秘诀，答案很简单，就是勇敢表白。他表白被拒近百次，他说每次被拒就像2块钱的彩票开出“谢谢惠顾”，不沮丧更不死缠烂打，而是马上收拾心情去开下一张彩票。很多单身狗表白白要憋半年，实在浪费青春。


    屌丝应该学习一下黑人兄弟的泡妞方法。他们真是有水平。一入校开始，他们每天都会找不同的女生求爱三次。基本上一个月下来，全系女生都被求过了，失败了也没啥，你又不损失。万一撞上一个正好郁闷的女神，你就开开心心下手吧。据我观察，黑人兄弟都有马子。内地男同学多数是三年光棍，惨的一比吊糟。


    泡妞。最熬人的功夫是，开战前最好火力侦察清楚。她是啥情况？家庭出身，学习情况，经济情况，观察气质。内向型的，最好下手，基本是一击即溃。外向型的，最难办，击中了也不知道是不是备胎。穷人家的小美白最难，因为她患得患失，考虑太多。白富美太冷，难以搭话，但好处是，你没有竞争对手。'
