    +   1， 基础简单的数理化，由老师教一下。

    2， 适应集体生活，树立集体观念。

    3， 培养同龄人之间的竞争意识。

    4， 让孩子知道人世间的各种情感：拍强者马屁，互相坑害队友，举报揭发，谈恋爱。

    5， 熟悉别人在想什么。

    6， 通过各种考试比赛，逐步树立信心，那群蠢货也就这样了。


    培养孩子，

    一是体育锻炼，长跑加强身材和心肺功能，摸高跳跃，会长高。'
