- pgno: 24
  md: '# 我家的五年大调整。


    我前一条微博说的七个大调整，表面看，都是防守收缩，保守谨慎，但最后怎么就赚大钱了昵？这其实也是当初家族会议，多数人反对的理由。


    其实很简单。大趋势看，市场总需求没有变，普通人有钱了，中高级需求甚至还扩大了。以前不太赚钱的原因是，企业互相杀价，赊账，市场需要10件货，各企业为了争夺扩大市场份额，盲目生产，最后居然生产了20件出来，最后卖不出去，急眼了，搞赊销，大减价，最后大家一起完蛋。


    这个弊端，大家都看到了，但是不敢调整。因为一调整，市场就丢了。人家都是赊账，你搞现款现货，客户滋溜一下就跑了，你的大量产能就闲置了，工人没收入了，原材料供应商也看不起你了。市场上会谣言四起，莱莱垮啦。


    我坚持调整减产，游说了很久，也无法说服家族里的其他人。五年前那一天，我横下一条心，破釜沉舟，只做不说，把欠款的客户全部得罪光了，人家主动不来了。这导致企业无单可下，自然也没有什么库存。那一年，我们这个圈子非常惨烈，我们生意少，结果是小亏，友们生产的多，卖不掉，结果是大亏。我们周围十五个同类厂，主动关闭了十个。大家进入悲催的调整期。


    因为我们生产少，侥幸活下来了，于是，家里慢慢接受严格财经纪律的观点。为了防止死灰复燃，我又干了一件狠事。新买的几百'
