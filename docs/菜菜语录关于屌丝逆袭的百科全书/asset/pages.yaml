    那时候，一辆别克赛欧加牌照大概是 8 万，内环线老破小是 15 万。我至今还记得我们单位这个老兄。他老婆是汽车公司上班，可以优惠。他呢，教科书般的倒霉蛋，帅的一塌糊涂，学问也好，就是升不上去，老正科到了五十岁，万念俱灰。那时候是副处配桑塔纳，正处帕萨特，可以开回家。他的同龄人都开上了，就他没有。心里那个难过啊！


