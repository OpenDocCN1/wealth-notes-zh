  md: '中国菜，没希望了。中国菜的经济基础是：人力不值钱，食材值钱。中国菜往往是极耗人工的制作流程。现在人工那么贵，正宗的高级中国菜，普通人是吃不起了。如今大小餐馆里的中国菜，说白了：大锅菜分盘+微波炉。调味品是各种香精，闻起来流口水，吃起来，味同嚼蜡。我已经上当多次，现在不去中餐馆。


    菜总的“制造业不可能三角”（lmpossible trinity）。中国制造业利润薄，就业人数多，是初级阶段，在没有进入高科技打遍天下的德日工业水平前，“财政，老板，员工”，不可能同时乐呵呵。现在情况是：财政满意，员工满意，小老板不容乐观了。中间掉链子的后果，就业压力跳过企业，直接到了gov。


    大豆和玉米的地位。


    九十年代以前，我们为什么吃肉少，米饭多。因为我们的鸡鸭猪牛羊少。


    为什么不多养肉禽呢？没有饲料。主要是玉米和大豆。


    为什么不种植玉米和大豆？土地有限。种了大豆玉米，稻麦就不够了。


    现在，我们餐桌丰富了，原因很简单，出口大量创汇，有钱进口大豆和玉米，然后搞肉禽饲养，一下子就解决了吃肉问题。


