  md: '高进低出，利用赊账产生的现金流，维持大老板的形象。那时很多上海美女也被阿诈里骗到床上去了。但钢材价格有波动，资金链容易断了，就会官司缠身。


    我有个熟人，属于几进几出的老官司了。所有亲戚都鄙视他。但他最后还真发财了。因为阿诈里的标准手法是：先拿货，再付钱。2003年后，钢材价格是火箭上升，一般人不相信会一直涨，只有阿诈里无所谓。结果，阿诈里因为先拿到货，都发财了，成功上岸。后来，我还在一个财经节目看到过这个骗子，成功企业家了。


