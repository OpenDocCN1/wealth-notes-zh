- pgno: 63
  md: '我基本是尽力照顾了。但我也没什幺资源，只能是去抢别的部门资源。例，我就一个副职岗位，手下三个牛人，怎幺办？提拔年轻的，吹捧年老的。那个中年人，我拼命为他争取隔壁部门的职位。但这种路数只能在底下用用，高段位的，不是这幺玩了。


    为啥喜欢提拔年轻人？好管啊。如果提拔老资格，可能暗中竞争。年轻人，一般不敢卖主求荣，而且脑子简单。年轻人顺风顺水的时候，干活特别卖力，提拔个能干的副职，内部事情基本可以不管了，一门心思巴结上面。万一他将来发达了，也算个人情。迫不得已的时候，头还可以拿他当枪使，抛出去当替罪羊。


    如何给分公司配班子？分公司在外地，你根本管不住，配班子就很重要了。我的做法是，大区经理+行政总监。大区经理决定一切，年底考核指标。行政总监必须不懂业务，离开总部就会失业，负责向老板打小报告，两年一换。若大区经理叛主，行政总监肯定不会同流合污，因为投靠小老板，不如投靠总部。


    # 第四节 人际交往的秘诀


    啥叫人品？


    你不骂脏话，不占人便宜，那是修养，不是人品。


    人品是一个硬币的两面。正面是，能够帮的上别人忙。你在医院能帮人挂号，你在教育局能帮人进优质小学。背面是，你不能挡别人道。如果你的竞争对手和你一起争夺科长位置，你就算帮过他，他也'
  merge: -1
  img_proc: true
- pgno: 64
  md: '不会说你好话。正反两面不容易，所以逆袭难啊！


    人际交往的秘诀：无论是亲友和陌生人，如果对方是个靠谱的人，希望和对方保持良好关系，那么，你要迈出第一步，先主动让利，吃点小亏，几百-几千元 的档次。人都不肯先吃亏，但一旦认为你是可以信赖的人，又往往给你很多机会。除了做官，其他行业，不要歧视落魄的人，以后的事情，说不定的。


    如何与人合作？


    第一次合作，如果是五五开的份量，你主动谦让一部分利益，你六我四，各自尽力而为，确保对方把第一次合作干好，保证了你对外的信誉。完成后，观察合作方的态度，如果他觉得，他拿六是天地意义的，那就点到为止了。如果他觉得，下次应该看贡献分成，说明人品靠谱，值得交往。


    # 第五节 通过利他来利己


    人情。我不赞成普通人去攒人情，因为你没有能力去办这些事情。攒人情是个非常高难度的事情。举个最简单的例子，“我儿子今年上初中了，想去个市重点，你帮我联系一下”。“我正在办某个高难度的证，你帮我问问进度。”你行吗？一般人都是自己求人的事情，哪里帮的了别人啊？这是高段位的事情。


    别老让别人帮你忙，你帮过人家什么？答：我做过的好事，多了。


    65'
