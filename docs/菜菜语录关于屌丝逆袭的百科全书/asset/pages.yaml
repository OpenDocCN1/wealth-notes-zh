  md: '有买家能全款，都是连环置换，40-70-100-130-200 平米。如果在置换环节，彻底卡死贷款，打断置换链，交易量肯定下降 80%，游戏立马结束。


    但我们承受不起这个后果。居民财富的 90% 是房子，企业的固定资产 80% 是房子，社会大量财富，特别是金融行业，以京沪价格作为维系业务的基础。一旦基础没了，所有贷款的抵押物就不存在了，要么抽贷，要么追加抵押物，这都会摧毁微观经济运行。就业问题，当天晚上就会出现。


