- pgno: 27
  md: '大城市的未来。经济发展就是围绕房子。销售渠道就是围绕自媒体。万变不离其宗，你只要理解了这个内容，就不会穷。有才华的专业人士应该抢先占领高地，形成独特的服务方式和口碑。先不要赚钱，水到渠成，等你哪天要辞职创业了，这就是你的商业渠道。现代商业，不能再靠熟人介绍了，必须自主掌握渠道。


    我写微博，不为自己赚钱，就是图个大家开心。有好的微博，我一定支持。我建议有专业能力的同学，如果你不能升官了，就认认真真搞个自媒体，这是今后的重要创业渠道。


    做自媒体要爱憎分明，立场明确。四平八稳像个老太婆，谁也不得罪，那也没人喜欢。说话要真诚，内心要敞亮。错了就道歉，对了就坚持。例如，我围观董藩斗美女，我就是蹭热点，图热闹。一开始，我误会是仙人跳了，希望看董藩的大笑话，结果误会了，错了咱就道歉。道歉完了，再不遗余力的怼他。


    # 如何做自媒体？


    +   1，老师，可以搞每日一题之类的。


    +   2、医生，谈谈各个季节的保养。


    +   3、CPA，谈谈小企业做账注意点。


    以此类推，语言要简单，大白话。'
