- pgno: 503
  md: "# 道德风险（Moral Hazard）\n\n+   - 道德风险：央行的救助可能会鼓励金融机构过度冒险，导致杠杆过高和下一次危机。  \n+  \
    \   - 金融机构管理层可能过度扩张其资产负债表，达到“大而不能倒”（too big to fail）。  \n+     - 杠杆越高，利润越高，奖金越高。\
    \  \n+     - 公司“帝国”越大，管理层权力和影响力越大。  \n+   - 央行可以威胁不救那些过度冒险的机构。  \n+     但危机发生时，央行可能不得不救（时间不一致问题（Time-inconsistency\
    \ problem））。"
  merge: -1
  img_proc: true
- pgno: 504
  md: '# 宏观审慎政策


    +   - 宏观审慎政策（Macroprudential policies）

    +     指旨在提高金融系统稳定性的规则和政策。

    +   - 不包括旨在保护投资者的规则和政策（可称为“微观审慎”）。'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# 宏观审慎政策


