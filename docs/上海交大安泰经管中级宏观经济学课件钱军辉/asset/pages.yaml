- pgno: 25
  md: '# # 一个供求模型


    +   - 考虑国债市场，这里的交易决定了每时每刻的利率曲线。

    +   - 在此例中，国债价格（或无风险利率）是内生变量。

    +   - 经验事实：利率呈现周期性波动特征。

    +   - 一个简单的模型：债市的供给和需求曲线模型

    +     - 内生变量：债券价格和债券数量

    +     - 外生变量可能包括：央行货币政策、外国货币政策、通胀预期、政府财政赤字等等。

    +     - 外生变量移动供给和需求曲线。


    ![](img/0703ffa5d8e4463f582a035dab90975a_25_0.png)'
  merge: -1
  img_proc: true
