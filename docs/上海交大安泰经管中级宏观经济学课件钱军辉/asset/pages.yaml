- pgno: 27
  md: '# 结构模型


    +   - 国债供需模型是一个结构模型（Structural model）。

    +     - 先验假设（即“结构”）：供给曲线和需求曲线，均衡

    +       $$Y^s=f(P,X^s)$$

    +       $$Y^d=g(P,X^d)$$

    +       $$Y^s=Y^d$$

    +     - 该模型刻画了内生变量和外生变量之间的因果关系。

    +   - 此类建模思路被称为“结构建模”（Structural approach）。


    +   - $P$：债券价格

    +   - $Y^s$：供给

    +   - $X^s$：供给侧外生变量

    +   - $Y^d$：需求

    +   - $X^d$：需求侧外生变量'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 非结构模型


    +   - 另一种建模思路是“非结构建模”（Reduced-form approach）

    +     - 先验假设较少，让数据决定模型

    +     - 利用变量之间的相关性进行预测'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 结构模型和非结构模型


    +   - 结构模型的解具有非结构模型的形式，我们称之为非结构形式（reduced-form）。

    +   - 结构模型一般非常简化（忽略具有预测价值的因素），因此结构模型一般不适合用于预测。

    +   - 而非结构模型（经常是数据驱动）更加灵活，经常给出更准确的预测。

    +   - 变量之间的相关性会发生变化（结构变化），因此基于非结构模型的预测会因为结构变化而出现偏误。-- “卢卡斯批判”'
  merge: -1
  img_proc: true
