- pgno: 399
  md: '# 平准政策（Stabilization Policy）


    +   - 政府既掌控货币发行，也是最大的消费者，有能力让经济平稳。

    +   - 理想状态的经济，生产处于产出潜力水平，失业率处于自然失业率水平。

    +   - 但来自需求侧和供给侧的冲击，会让经济偏离自然水平。'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# 需求侧冲击


    +   - 需求侧正面冲击包括：

    +     a) 资产泡沫（股票、房地产）

    +     b) 信贷泡沫

    +     c) 外需正向冲击

    +   - 负面冲击则相反：泡沫破灭、外需负向冲击等。

    +   - 在经济过热时，动用紧缩性政策；在经济衰退时，动用扩张性政策。'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# 供给侧冲击


    +   - 供给侧冲击是指改变要素或技术的冲击。

    +   - 正向冲击（如技术革命）一般不需要政策应对。

    +   - 而负向冲击通常会带来通胀和经济衰退。

    +     - 由天灾引起的农产品价格冲击

    +     - 环保风暴

    +     - 罢工潮

    +     - 原材料和能源供应紧张'
  merge: -1
  img_proc: true
