- pgno: 329
  md: '# LM 曲线


    +   - 给定 $M$ 和 $P$, 为让 LM 方程保持成立, $r$ 的上升必须伴随 $Y$ 的上升,

    +   - 因此LM曲线向上倾斜。


    ![](img/0703ffa5d8e4463f582a035dab90975a_329_0.png)'
  merge: -1
  img_proc: true
- pgno: 330
  md: "# LM 曲线\n\n+   - LM曲线上的点都可能对应货币市场均衡，给定 $M$ 和 $P$。\n+   - $Y$ 和 $r$ 是内生变量，两者一般都同时变化，表现为在LM曲线上移动（moving\
    \ along the LM）。\n+   - 应用隐含函数定理可得曲线斜率：\n+     $$\\frac{\\partial r}{\\partial\
    \ Y} = -\\frac{L_2}{L_1} = -\\frac{\\frac{\\partial L(r,Y)}{\\partial Y}}{\\frac{\\\
    partial L(r,Y)}{\\partial r}}.$$ \n+     - 如果 $L_1 = \\infty$, LM 曲线为水平（流动性陷阱，liquidity\
    \ trap）。\n+     - 如果 $L_1 = 0$, LM 曲线为垂直（货币数量理论）。"
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 货币政策如何移动LM曲线


    +   - 外生变量（*M* or *P*）的变化会让LM曲线移动。  - 如果货币当局增加货币供应 *M*↑, 那么 LM曲线向右移动。


    ![](img/0703ffa5d8e4463f582a035dab90975a_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 货币政策如何移动LM曲线


    +   - LM 定义了一个隐含函数 $Y(r, M, P)$。应用隐含函数定理可得

    +     $\frac{\partial Y(r, M, P)}{\partial M} \equiv \lim_{\Delta M \to 0} \frac{Y(r,
    M + \Delta M, P) - Y(r, M, P)}{\Delta M} = \frac{1}{P L_2}$。


    +   - 也就是说，如果央行增加货币供应 $\Delta M$，那么 LM 将向右移动约 $\frac{\Delta M}{P L_2}$。'
  merge: -1
  img_proc: true
