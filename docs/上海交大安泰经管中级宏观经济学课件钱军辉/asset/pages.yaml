- pgno: 279
  md: '# 刘易斯模型（The Lewis Model）


    +   - 以英国经济学家 Arthur Lewis (1915-1991) 命名。刘易斯是发展经济学的奠基人。


    ![](img/0703ffa5d8e4463f582a035dab90975a_279_0.png)'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# 假设


    +   - 在 Lewis 模型中有两个部门：工业和传统农业。

    +   - 传统农业部门容纳无穷劳动力，MPL和实际工资接近零。

    +     - 因此农业部门也称为subsistence sector（维持生存的部门）。

    +   - 工业部门很小，雇佣很少劳动力，维持较高MPL和实际工资（相对农业部门）。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 工业部门何不一步到位？


    +   - 虽说传统农业MPL接近零，但工业部门无法用零工资招到工人。

    +   - 为吸引劳动力，工业部门必须给出高工资

    +     - 支付城市更高的生活成本

    +     - 提高产业工人的社会形象

    +   - 工业部门也愿意付出高于MPL的实际工资

    +     - “效率工资”的考虑

    +     - 在古代，主人给下人高于MPL的工资，对主人来说很有面子。'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 刘易斯模型


