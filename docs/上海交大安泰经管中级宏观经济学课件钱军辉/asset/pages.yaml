- pgno: 414
  md: '# 应对AD冲击引起的衰退


    +   - 温和的AD衰退中，财政和货币政策均有效。

    +   - 但如果衰退较深，且有恐慌情绪，仅仅货币政策可能失效。

    +   - 此时减税的效果也存疑，因为人们出于谨慎目的，可能选择将多出的税后收入存起来。

    +   - 此时，直接的政府消费和投资更有效果。

    +     - 提高总收入

    +     - 恢复信心'
