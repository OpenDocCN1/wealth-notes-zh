- pgno: 232
  md: "# 人均产出\n\n+   - 定义 $y = \\frac{Y}{L}$ 和 $k = \\frac{K}{L}$。$y$ 为人均产出（output\
    \ per capita）。$k$ 为人均资本存量。因为生产函数的规模收益不变，所以\n+   \n+   $$y = \\frac{Y}{L} = \\\
    frac{F(K,L)}{L} = F(k,1).$$\n+   - 定义 $f(k) \\equiv F(k,1)$，将上式写为\n+   \n+   $$y\
    \ = f(k).$$\n+   - $f(k)$ 是个体生产函数（individual production function）。我们假设：\n+   \n\
    +   $$f(0)=0,\\ f'(k)>0,\\ f''(k)<0.$$\n+   其中 $f'(k)$ 是边际资本产出（marginal product\
    \ of capital, MPK）。\n+   - 我们也假设：\n+   \n+   $$\\lim_{k\\to 0} f'(k)=\\infty,\\\
    \ \\lim_{k\\to\\infty} f'(k)=0$$"
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 资源积累


    +   - 投资（investment）让资本积累，折旧（depreciation）让资本损耗。资本存量的变化由如下微分方程刻画：

    +     $$\dot{K}_t \equiv \frac{dK_t}{dt}=sF(K_t,L_t)-\delta K_t$$

    +   - 人口变化由如下微分方程刻画

    +     $$\dot{L}_t=nL_t.$$


    > 两个记号：

    > ① $K_t \equiv K(t)$

    > ② $\dot{K}_t \equiv \frac{dK_t}{dt}$'
  merge: -1
  img_proc: true
