- pgno: 203
  md: '# 汇率（Exchange Rate）


    +   - 汇率是一对货币之间的相对价格。

    +   - 汇率可以表示为一单位本币兑换多少外币，也可以表示为一单位外币兑换多少本币。

    +   - 市场报价一般选择让汇率数值大于1，例如人民币和韩元汇率记为200韩元/人民币，人民币和美元汇率记为7.2人民币/美元。

    +   - 人民币有在岸汇率（CNY）和离岸汇率（CNH）。'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 一个约定


    +   - 在本课程的理论学习中，我们约定汇率以本币为分母，即汇率数值含义为一个单位本币兑换多少外币。

    +   - 在此约定下，汇率数值上升表示本币升值（appreciate, strengthen），汇率数值下降表示本币贬值（depreciate, weaken,
    devalue）。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 有效汇率（Effective Exchange Rate）


    +   - 有效汇率对一篮子货币的汇率指数。

    +     - NEER (Nominal effective exchange rate): 用名义汇率编制的有效汇率。


    RMBX_t = c_0 \prod_{i=1}^{M} X_{it}^{w_i}


    其中 w_i > 0 为权重，满足 \sum_{i=1}^{M} w_i = 1


    +   - REER (Real effective exchange rate): 用实际汇率编制的有效汇率。'
  merge: -1
  img_proc: true
