- pgno: 474
  md: '# 结语


    +   - “自然”均衡（产出=产出潜力，利率=自然利率，失业率=自然失业率）跟其他均衡一样转瞬即逝。

    +   - 经济自带动能，一旦复苏回到自然均衡，就会更进一步到过热的均衡。

    +   - 股票和信用市场的周期，及其背后的投机活动，是经济周期的重要驱动。'
  merge: -1
  img_proc: true
- pgno: 475
  md: '# 结语


    +   - 金融周期并非简单重复：

    +     每次都一样，每次都不一样。

    +   - 金融市场不断经历结构变化

    +     - 政府应对经济周期：规制和去规制

    +     - 市场应对规制变化：金融创新、影子银行

    +   - 借用马克吐温的名言：

    +     - （宏观经济）历史并不重复，只是经常押韵。'
  merge: -1
