- pgno: 428
  md: '# # 静态和动态


    +   - 静态模型（static model）刻画一组变量的**同期**（simultaneous）关系。

    +     - 例如在凯恩斯交叉模型中，$Y_t = C(Y_t - T_t) + I_t + G_t$。下角标 $t$ 可以忽略。

    +   - 动态模型（dynamic model）刻画一组跟时间相关的动态关系（比如引入内生变量的滞后项）。

    +     - 假设适应性预期（adaptive expectation），菲利普斯曲线变成：$\pi_t = \pi_{t-1} - \beta(u_t
    - u^n) + v_t$，一个动态模型。'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# 静态AD-AS模型


    +   • 考虑如下线性 AD-AS 模型

    +     $Y_t = 100 + 0.4P_t + u_t,$

    +     $Y_t = 400 - 0.6P_t + v_t,$

    +     其中 ? 和 ? 分别表示供给侧和需求侧冲击。解该模型，得到价格水平为：

    +     $P_t = 300 + (v_t - u_t).$


    +   • 在静态模型中，外生冲击对内生变量的影响是瞬时（instantaneous）的。'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# 一个简单动态AD-AS模型


    +   - 现在把模型改为：

    +     $Y_t = 100 + 0.4P_{t-1} + u_t.$

    +     $Y_t = 400 - 0.6P_t + v_t,$

    +     该模型变成了动态模型。在时间 $t$，该模型有三种变量：

    +     - 内生变量： $Y_t$ 和 $P_t$

    +     - 外生变量： $u_t$ 和 $v_t$

    +     - 滞后内生变量： $P_{t-1}$


    +   - 所谓模型的解，就是把内生变量用外生变量和滞后内生变量表示出来。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# 稳态


    +   - 我们定义稳态（steady state）为外生冲击为零，内生变量不变的状态，即

    +     $Y_t = 100 + 0.4P_{t-1}$,

    +     $Y_t = 400 - 0.6P_t$,

    +     $P_t = P_{t-1}$.

    +   - 在稳态，$P_t = 300$, $Y_t = 220$.'
