- pgno: 151
  md: '# 消费函数


    +   - 让 $T$ 表示收入所得税。于是可支配收入为 $(Y-T)$。

    +   - 消费函数刻画了最终消费和可支配收入的关系：$C(Y-T)$。

    +   - 我们假设 $C(\cdot)$ 为可求导的增函数：

    +     $$C''(Y-T)>0.$$'
  merge: -1
