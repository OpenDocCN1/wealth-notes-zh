- pgno: 264
  md: "# AK 模型\n\n+   - 假设\n+     - 人口为常数\n+     - 线性的“技术”：\n+   \n+     $$Y_t = AK_t,$$\n\
    +   \n+     其中 $Y_t$ 为产出，$K_t$ 为资本存量，$A$ 为一个常数，测度资本的平均产出（average product of capital）和边际产出（marginal\
    \ product of capital）。\n+   \n+     - 资本积累服从：\n+   \n+     $$\\dot{K}_t = sY_t\
    \ - \\delta K_t.$$\n\n+   - 简单推导可得：\n+   \n+     $$\\frac{\\dot{Y}_t}{Y_t}=\\\
    frac{\\dot{K}_t}{K_t}=sA-\\delta.$$"
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 模型含义


    +   - 只要 $sA > \delta$, 我们就有持续增长。

    +   - 之所以有持续增长，是因为我们假设边际资本回报为常数 $A$。

    +     - 为理解这点，我们想象该模型中的资本存量包含 “知识” （knowledge）。'
  merge: -1
  img_proc: true
