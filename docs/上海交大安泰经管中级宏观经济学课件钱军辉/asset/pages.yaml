  md: '# 经济利润和会计利润


    +   - 实际经济利润（Economic profit）定义为：

    +     $$Y - MPL \cdot L - MPK \cdot K$$

    +   - 会计利润（Accounting profit）是经济利润与资本回报之和：

    +     $$\text{accounting profit} = \text{economic profit} + MPK \cdot K$$'
