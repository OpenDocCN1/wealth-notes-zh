- pgno: 304
  md: '# 周期波动的一些经验事实


    +   - 增长有惯性（persistent）。

    +   - 扩张期较长，衰退期较短。

    +   - 消费波动较小，投资波动较大。

    +   - 就业跟产出联动（奥昆法则，Okun’s Law）

    +     $(Y_t - \bar{Y}) = -\gamma(u_t - u^n)$,

    +     其中 $u^n$ 为自然失业率, $\bar{Y}$ 为产出潜力, $\gamma > 0$.'
  merge: -1
  img_proc: true
