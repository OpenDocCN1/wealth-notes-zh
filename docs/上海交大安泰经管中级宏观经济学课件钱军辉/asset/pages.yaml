- pgno: 154
  md: '# 财政政策


    +   - 财政政策分为征税和支出两个方面。

    +   - 在我们的模型中，财政政策由 $T$ 和 $G$ 刻画：

    +     - 如果 $G = T$, 财政平衡（balanced budget）

    +     - 如果 $G > T$, 财政赤字（budget deficit）

    +     - 如果 $G < T$, 财政盈余（budget surplus）

    +   - 假设 $G$ 和 $T$ 均为外生变量，

    +     $G = \bar{G}$, $T = \bar{T}$.'
