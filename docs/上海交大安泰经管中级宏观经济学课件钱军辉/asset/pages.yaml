- pgno: 61
  md: '# # 资本、投资和折旧


    +   - 资本是生产要素之一。

    +   - 投资是为增加资本存量所做的支出。

    +   - 折旧是资本存量的损耗。

    +   - 例子：

    +     - 假设在 1/1/2002：

    +       - 某经济的资本存量为 500

    +       - 在 2002 年：投资 = 100，折旧 = -20

    +       - 那么在 1/1/2003：该经济的资本存量为：500+100-20=580


    +   - 资本是存量（stock），投资和折旧是流量（flow）。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 关于住房


