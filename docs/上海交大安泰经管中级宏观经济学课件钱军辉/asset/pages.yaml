  md: '# 政策含义


    +   - 因为股票市场有重大缺陷，所以投资需求不能仅仅依赖股市。

    +   - 凯恩斯： *When the capital development of a country becomes a by-product of
    the activities of a casino, the job is likely to be ill-done.*'
