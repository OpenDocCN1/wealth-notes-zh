- pgno: 78
  md: "# 同比和环比上涨\n\n+   - 给定CPI篮子（w_i）和月度价格（p_it），CPI同比上涨：\n+     $$\\sum_{i} w_i\
    \ \\left(\\frac{p_{it}}{p_{i,t-12}} - 1\\right) \\times 100\\%.$$  \n+     - 该数据是头条通胀数据。大体避免了季节性，但丢失了环比变化信息。\n\
    +   - CPI环比上涨\n+     $$\\sum_{i} w_i \\left(\\frac{p_{it}}{p_{i,t-1}} - 1\\right)\
    \ \\times 100\\%.$$"
  merge: -1
  img_proc: true
