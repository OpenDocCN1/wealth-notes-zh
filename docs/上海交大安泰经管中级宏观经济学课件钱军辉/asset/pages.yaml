- pgno: 32
  md: '# 古典学派的宏观思想


    +   - 核心假设：个体理性，价格和工资灵活，市场永远出清（clear）。

    +     - 无需担心需求（需求自动消化供给，供给产生需求。）

    +     - 货币数量理论（Quantity theory of money, David Hume, Irving Fisher）

    +       $$MV = PY$$

    +     - 货币是浮于真实经济表面的一层纱（A veil of money）：货币外生给定，不影响真实经济活动。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 凯恩斯


    +   - 凯恩斯（John Maynard Keynes）于1936年出版《通论》， *General Theory of Employment, Interest
    and Money.* 这被认为是宏观经济学的开端。\n- 凯恩斯的《通论》解释了大萧条为什么会发生，以及政府应该做什么。\n- 凯恩斯理论基于行为经济学假设，人不够理性，市场不够完美。\n  -
    粘滞价格（Sticky price/wage）\n  - 动物精神（Animal spirits）\n  - 选美比喻（Beauty contest）'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 新古典综合（Neoclassical Synthesis）


    +   - 以萨缪尔森（Paul Samuelson, 1915–2009）为代表的凯恩斯主义者，将凯恩斯经济学和新古典微观经济学结合起来，形成了“新古典综合”。

    +   - 萨缪尔森建立了新的经济学研究模式：用正式的数学模型表达经济学理论。

    +   - 基于凯恩斯主义经济学，经济学家（如Jan Tinbergen (1903–1994), Lawrence Klein (1920-2013)）建立大型计量经济学模型，用于预测和政策分析。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 菲利普斯曲线（The Phillips Curve）


    +   - 在大型计量模型中，有一个方程被称为“菲利普斯曲线”：通胀和失业率之间的负相关关系。

    +   - 菲利普斯曲线是宏观经济管理（熨平经济周期）的理论基础。


    ![](img/0703ffa5d8e4463f582a035dab90975a_35_0.png)


    Data of United Kingdom 1913–1948 from Phillips (1958)'
