- pgno: 169
  md: '# 货币


    +   - 货币是随时可用于交易的资产。

    +   - 货币的基本功能:

    +     - 储值（Store of value）

    +     - 计量单位（Unit of account）

    +     - 交易媒介（Medium of exchange）

    +   - 货币种类:

    +     - 商品货币（Commodity money）

    +     - 法定货币（Fiat money）

    +       - 数字货币（Digital money）

    +   - 货币形态

    +     - 纸币和硬币（physical cash, coin）

    +     - 银行存款（bank deposits）

    +     - 储备（reserves）

    +     - 其他'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 从商品货币到法定货币


    +   - 用商品货币（如白银）交易的成本较高。

    +   - 为降低交易成本，银行开始铸币，固定重量和纯度。

    +   - 为进一步降低成本，银行可以发行“银票”，持有银票的客户可以到银行换取白银。银票也就成为银本位的货币。

    +   - 交易需求无限，金银供应有限。如果坚持金银本位，会有通缩压力。

    +   - 如果人们不在乎换取金银的选择，那么银行可以发行没有金银支持的“钞票”。

    +   - 现代中央银行正是如此。现代国家立法规定商家必须接受央行发行的货币，这就是法定货币（fiat money）。

    +   - 法定货币的价值来自国家权力和信用。'
  merge: -1
  img_proc: true
- pgno: 171
  md: "# 货币政策\n\n+   - 制定货币政策是中央银行的主要职能，通过控制货币供应和利率，以实现政策目标。  \n+     - 价格稳定（price\
    \ stability）  \n+     - 经济增长和就业\n+   - 中国的央行是中国人民银行（People’s Bank of China, PBC）。\n\
    +   - 美国的央行是“联储”（Federal Reserve, the Fed）。\n+   - 欧元区的央行是欧洲央行（European Central\
    \ Bank, ECB）。"
  merge: -1
  img_proc: true
