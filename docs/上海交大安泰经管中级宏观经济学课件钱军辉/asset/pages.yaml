  md: '# IS-LM导论


    +   - IS 代表 “Investment” 和 “Saving”。

    +   - LM 代表 “Liquidity” 和 “Money demand”。

    +   - IS-LM 模型是一个需求侧模型，其均衡刻画了在一定价格水平上的有效需求。

    +   - IS-LM 是最流行的凯恩斯理论的诠释。'
