- pgno: 74
  md: '# 消费者价格指数（CPI）


    +   - CPI (Consumer Price Index) 测度消费者所面临的一般价格水平。

    +   - 统计局通过住户调查决定一个典型消费者购买的一篮子商品和服务。依据该篮子，统计局按如下公式计算CPI，

    +     $$CPI_t = c_0 \frac{\sum_i q_{i,t_0} p_{it}}{\sum_i q_{i,t_0} p_{i,t_0}}$$


    其中


    +   - $p_{it}$ 为第 $i$ 种商品或服务在 $t$ 期的价格，

    +   - $p_{i,t_0}$ 为该商品或服务在 $t_0$ 期的价格，

    +   - $q_{i,t_0}$ 为该商品或服务在 $t_0$ 期的消费数量，

    +   - $c_0$ 为常数（一般为100，表示基期价格水平为100）。'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# CPI\n\n+   - 让 $w_i$ 表示第 $i$ 种商品或服务在 CPI 篮子中的消费额比例（按基期 $t_0$ 价格和数量计算），\n\
    +   \n+     $$w_i = q_{i,t_0} p_{i,t_0} / \\sum_{i=1}^{M} q_{i,t_0} p_{i,t_0}$$\n\
    \n上页的计算公式可改写为：\n\n$$\\text{CPI}_t = c_0 \\sum_{i=1}^{N} w_i \\left( \\frac{p_{it}}{p_{i,t_0}}\
    \ \\right).$$"
  merge: -1
  img_proc: true
- pgno: 76
  md: '# “苹果和桔子”经济


    +   - 在“苹果和桔子”经济中，价格和数量分别为：


    | Year | Apple | Orange |

    | --- | --- | --- |

    |  | Price | Quantity | Price | Quantity |

    | 2016 | 0.6 | 25 | 1.1 | 15 |

    | 2015 | 0.5 | 20 | 1 | 10 |


    +   - 于是2016年CPI为


    CPI₂₀₁₆ = 100 * (0.6 * 20 + 1.1 * 10) / (0.5 * 20 + 1 * 10)

    = 100 (0.6/0.5 * 1/2 + 1.1/1 * 1/2) = 115.'
  merge: -1
