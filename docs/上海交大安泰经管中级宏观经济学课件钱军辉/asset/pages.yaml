- pgno: 353
  md: '# 利率的作用


    +   - 利率在 IS-LM 模型中常常被忽视，但它的变化是均衡调整的机制。

    +   - 在正常情况，

    +     - 扩张性货币政策降低利率，从而刺激投资需求。

    +     - 扩张性财政政策会抬高利率，从而部分 “挤出” 投资需求。

    +   - 在流动性陷阱中，因为利率不受（扩张性）货币政策影响，因此货币政策无效。'
  merge: -1
  img_proc: true
- pgno: 354
  md: '# 货币政策传导的利率渠道


    +   - IS−LM 刻画了货币政策传导（monetary policy transmission）的利率渠道（interest−rate channel）：

    +     $M \uparrow \implies i \downarrow \implies r \downarrow \implies I(r) \uparrow
    \implies Y \uparrow$.

    +     - 货币刺激的直接作用是降低名义利率。

    +     - 在粘性价格假设下，名义利率降低传导到实际利率降低。'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 利率政策


    +   - 在现实世界中，央行对短期利率的设定有主导作用。

    +   - 央行可动用若干货币政策工具（monetary instruments），以实现短期利率目标（target）。

    +     - 美国： federal funds rate

    +     - 欧元区： The overnight market rates

    +     - 中国： DR007， LPR'
