- pgno: 416
  md: '# 失业率和通胀率的负相关


    +   - 如果AS曲线向上倾斜且固定，那么AD曲线的移动导致总产出和价格水平的正相关。

    +   - 如果奥昆法则（Okun’s law）成立，那么失业率和通胀率之间呈负相关。这正是菲利普斯曲线（The Phillips curve）所刻画的。


    ![](img/0703ffa5d8e4463f582a035dab90975a_416_0.png)'
  merge: -1
  img_proc: true
- pgno: 417
  md: '# 菲利普斯曲线（Phillips Curve）


    +   - 一个较为现代的菲利普斯曲线方程如下，

    +     π = Eπ − α(u − uⁿ) + ν.

    +     其中 Eπ 为通胀预期， u 为失业率， uⁿ 为自然失业率， (u − uⁿ) 为周期性失业率， ν 为价格冲击（供给侧冲击）。


    +   - 菲利普斯曲线将通胀分解为三个组成部分：

    +     - 通胀预期（Expected inflation, Eπ）

    +     - 周期性通胀（α(u − uⁿ)）

    +     - 价格冲击（ν）'
  merge: -1
  img_proc: true
- pgno: 418
  md: "# 推导\n\n+   - 让 $p_t = \\log(P_t)$. 于是 $\\pi_t = p_t - p_{t-1}$. 重写线性AS方程为\n\
    +   \n+     $p_t = E p_t + \\phi(Y_t - \\bar{Y}) + v_t$\n+   \n+     其中 $v_t$\
    \ 为新加入的价格冲击。\n+   - 方程两边减去 $p_{t-1}$ 得到\n+   \n+     $\\pi_t = E \\pi_t + \\phi(Y_t\
    \ - \\bar{Y}) + v_t$.\n+   - 用 Okun’s law, $(Y_t - \\bar{Y}) = -\\gamma(u_t -\
    \ u^n)$, 得到\n+   \n+     $\\pi_t = E \\pi_t - \\alpha(u_t - u^n) + v_t$, with\
    \ $\\alpha = \\phi\\gamma$."
  merge: -1
  img_proc: true
- pgno: 419
  md: '# 通胀如何变化


    +   - 从菲利普斯曲线方程

    +     π_t = Eπ_t − α(u_t − u^n) + ν_t


    我们可以推断推动通胀变化的四个因素：


    +   - 周期性失业率 (u_t − u^n)，导致需求拉动的通胀。

    +   - 价格（供给）冲击 (v_t)，导致成本推动的通胀。

    +   - 通胀预期的变化

    +   - 自然失业率 (u^n) 的变化'
  merge: -1
  img_proc: true
- pgno: 420
  md: "# 适应性预期（Adaptive Expectation）\n\n+   - 一个更加具体的菲利普斯曲线方程为\n+     $$\\pi_t = \\\
    pi_{t-1} - \\alpha(u_t - u^n) + v_t.$$ \n+     其中我们假设\n+     $$E\\pi_t = \\pi_{t-1}.$$\n\
    \n+   - 这样的假设，被称为通胀的适应性预期。\n\n+   - 如果适应性预期成立，那么通胀率在时间维度上有惯性（persistent）。"
  merge: -1
  img_proc: true
