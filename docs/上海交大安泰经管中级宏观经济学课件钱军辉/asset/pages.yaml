- pgno: 160
  md: '# 虚拟实验（Virtual Experiment）


    +   - 模型均衡条件定义了实际利率 $r$ 的隐含函数（implicit function）

    +     $Y = C(Y - T) + I(r) + G \ \Rightarrow r(Y, T, G)$

    +   - 虚拟实验就是研究隐含函数 $r(Y, T, G)$ —— 外生变量变化如何影响内生变量。

    +   - （如果只有一个内生变量）隐含函数的偏微分刻画某外生变量对内生变量的边际效应，控制其它外生变量。例如：

    +     $\frac{\partial r}{\partial G} \equiv \lim_{\Delta \to 0} \frac{r(Y, T,
    G + \Delta) - r(Y, T, G)}{\Delta}$'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 隐含函数定理的应用


    +   - 模型均衡条件可写为

    +     Θ(r,Y,T,G) = Y − C(Y − T) − I(r) − G = 0.

    +   - 隐含函数定理（implicit function theorem）告诉我们，

    +     \(\frac{\partial r}{\partial G} = -\frac{\frac{\partial \Theta}{\partial
    G}}{\frac{\partial \Theta}{\partial r}} = -\frac{-1}{-I''(r)} = -\frac{1}{I''(r)}\).'
  merge: -1
  img_proc: true
