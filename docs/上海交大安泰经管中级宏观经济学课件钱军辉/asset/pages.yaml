- pgno: 342
  md: '# 解释一： IS 衰退


    +   - 资产泡沫破灭后的投资和消费需求下降

    +     - 1929年股灾

    +     - 同时房地产泡沫终结

    +   - 其他二次冲击

    +     - 30年代初期的大规模银行破产

    +     - 过紧的财政政策（财政平衡信条）

    +     - 贸易保护主义冲击（如Smoot–Hawley act of 1930）

    +     - 通缩和通缩预期的效应'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 债务通缩理论（Debt-Deflation Theory）


    +   - 假设：**负债者的边际消费倾向高于净储蓄者**。

    +   - 通缩增加**实际债务负担**，负债者购买力转移至净储蓄者手中。

    +   - 购买力转移导致的净储蓄者的消费增加不足以抵消负债者的消费下降。净效应是消费下降，IS 曲线左移。'
  merge: -1
  img_proc: true
- pgno: 344
  md: "# 通缩预期的效应\n\n+   - 考虑如下 IS-LM 模型：\n+   \n+     \\[\n+     Y = C(Y-T) + I(i-E\\\
    pi) + G\n+     \\]\n+     \\[\n+     \\frac{M}{P} = L(i,Y).\n+     \\]\n+   \n\
    +     其中 $i$ 为名义利率（内生变量），$E\\pi$ 为通胀预期。\n\n+   - 如果通胀预期产生，即 $E\\pi$ 下降，甚至变成负值，那么\
    \ IS 曲线左移。"
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 解释二: LM 衰退


    +   - Friedman 和 Schwartz 在《A Monetary History of the United States, 1867–1960》一书中，认为货币紧缩导致了大萧条。  -
    从1929到1931年，实际利率的确上升了。  - 但在同期，实际货币供应（*M/P*）上升，名义利率下降。'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 政府如何应对衰退


    +   - 政府可以用财政政策、货币政策、以及两者结合，来增加总需求。

    +   - 财政刺激（Fiscal stimulus）

    +     - 增加政府消费和投资

    +     - 减税

    +   - 货币刺激

    +     - 降息

    +     - 量化宽松'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# 政策分析


    +   - 固定 $P$，对 IS-LM 全微分可得

    +     $$(1 - C'')dY - I'' dr = dG - C'' dT$$

    +     $$PL_2 dY + PL_1 dr = dM$$

    +   - 全微分将关于 $Y$ 和 $r$ 的非线性方程转化为关于 $dY$ 和 $dr$ 的线性方程。

    +   - 应用克雷默法则（Cramer''s rule）可分析

    +     - 增加政府消费的效应: $\frac{dY}{dG}$ and $\frac{dr}{dG}$

    +     - 加税的效应: $\frac{dY}{dT}$ and $\frac{dr}{dT}$

    +     - 货币扩张的效应: $\frac{dY}{dM}$ and $\frac{dr}{dM}$.'
  merge: -1
  img_proc: true
- pgno: 348
  md: "# 财政政策效应\n\n+   - 固定 $M$（即令 $dM = 0$）。应用克雷默法则可得\n+     $$dY = \\frac{L_1(dG\
    \ - C' dT)}{L_1(1 - C') + I' L_2}$$ \n+     $$dr = -\\frac{dG - C' dT}{L_1(1 -\
    \ C') + I' L_2}$$ \n+   - 财政政策效应总结如下：\n+     - 增加政府采购对产出的影响: $\\frac{dY}{dG} =\
    \ \\frac{L_1}{L_1(1 - C') + I' L_2} > 0$\n+     - 增加政府采购对利率的影响: $\\frac{dr}{dG}\
    \ = -\\frac{L_2}{L_1(1 - C') + I' L_2} > 0$\n+     - 加税对产出的影响: $\\frac{dY}{dT}\
    \ = -\\frac{L_1 C'}{L_1(1 - C') + I' L_2} < 0$\n+     - 加税对利率的影响: $\\frac{dr}{dT}\
    \ = \\frac{L_2 C'}{L_1(1 - C') + I' L_2} < 0$"
  merge: -1
  img_proc: true
- pgno: 349
  md: '# 货币政策的效应


    +   - 固定 $G$ 和 $T$，应用克雷默法则可得

    +     $$\frac{dY}{dM} = \frac{I''}{P(L_1(1 - C'') + I'' L_2)} > 0$$

    +     $$\frac{dr}{dM} = \frac{(1 - C'')}{P(L_1(1 - C'') + I'' L_2)} < 0$$'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# 流动性陷阱（Liquidity Trap）


    +   - 流动性陷阱是指增加流动性（货币供应）无法降低利率的情况。

    +     - 当 $L_1 \equiv \frac{\delta L(r,Y)}{\delta r} = \infty$ ， LM 曲线水平，同时 M
    上升无法下移 LM 曲线。

    +   - 流动性陷阱中，货币政策无效 $\left(\frac{dY}{dM}=0\right)$.

    +     - 凯恩斯眼中，美国1932年所发生的流动性危机

    +     - 日本90年代“失去的十年”

    +   - 但财政政策在流动性陷阱中有效:

    +     $\frac{dY}{dG}=\frac{1}{1-C''}$ and $\frac{dY}{dT}=-\frac{C''}{1-C''}$.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# 何时财政政策无效


    +   - 当 $L_1 \equiv \frac{\delta L(r,Y)}{\delta r}=0$（等效于货币数量理论，$\frac{M}{P}=kY$），LM
    曲线垂直，财政政策无效。

    +   - 在这样的情况下，只有货币政策有效。这是货币主义（代表人物为弗里德曼）在70年代滞胀（stagflation）时期所持立场。'
  merge: -1
  img_proc: true
