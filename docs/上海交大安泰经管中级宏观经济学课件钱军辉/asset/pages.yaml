- pgno: 37
  md: '# 新古典宏观经济学（New Classical Macroeconomics）


    +   - 新古典经济学家，尤其是卢卡斯（Robert Lucas Jr., 1937-）进一步挑战凯恩斯主义经济学。

    +     - 重视宏观经济学的“微观基础”（Micro-foundation）

    +       - 推崇具有微观基础的结构模型（比如基于理性代表人的优化决策）

    +       - 批判大型计量模型（非结构）（卢卡斯批判）

    +     - 应用“理性预期”（Rational expectation）假设


    +   - 实际商业周期（Real Business Cycle, RBC）理论（Edward C. Prescott 和 Finn E. Kydland）

    +     - 方法论：动态一般均衡模型，Dynamic Stochastic General Equilibrium, DSGE

    +     - 政策含义：商业周期是经济对外生冲击的有效反应，因此无需政策应对。'
  merge: -1
  img_proc: true
- pgno: 38
  md: "# 新凯恩斯主义（New Keynesianism）\n\n+   - 为应对新古典经济学对凯恩斯经济学缺乏微观基础的批判，新凯恩斯经济学研究市场不完美如何发生，从而构造凯恩斯经济学的微观基础。\
    \  \n+     - 垄断竞争（Monopolistic competition）  \n+     - 粘滞价格（Sticky price）  \n\
    +     - 信息不对称（Asymmetric information）\n+   - 代表人物：斯蒂格利茨（Joseph E. Stiglitz）、Guillermo\
    \ Calvo、Michael Woodford、Gregory Mankiw等"
  merge: -1
  img_proc: true
