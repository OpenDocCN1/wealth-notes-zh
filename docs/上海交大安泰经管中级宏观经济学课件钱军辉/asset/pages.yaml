- pgno: 237
  md: '# 稳态的稳定性（Stability）


    +   - 上述的稳态是**稳定**的：

    +     如果有扰动，$k_t$ 会回到 $k^*$。

    +     - 如果有冲击导致 $k_t$ 低于（高于）$k^*$：因为投资高于（低于）损耗和人口稀释，$k_t$ 将不断增加（下降）直至 $k^*$。'
  merge: -1
