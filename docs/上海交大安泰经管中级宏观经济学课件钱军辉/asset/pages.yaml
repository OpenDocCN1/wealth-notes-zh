- pgno: 359
  md: '# 关键假设


    +   - 资本自由流动——于是有一个共同的世界利率。

    +   - 小型经济——世界利率的价格接受者（price taker）。

    +   - 大型经济——其储蓄和投资行为影响世界利率。

    +   - 粘性价格，于是名义汇率变化等于实际汇率变化'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# # 固定汇率（Fixed Exchange Rate）


    +   - 如果一个经济体实行固定汇率，其货币当局会时刻准备干预外汇市场，在本币有贬值（升值）压力时做多（做空）本币。

    +     - 金本位（如 Bretton Woods）

    +     - 货币联盟（如欧元区）

    +     - 联系汇率制（如港币）

    +     - 美元化（Dollarization）（如曾经的阿根廷，当前的委内瑞拉）


    +   - 固定汇率的优势

    +     - 汇率稳定

    +     - “进口”大国货币政策


    +   - 固定汇率的劣势

    +     - 货币政策的不独立

    +     - 需要维持大量外汇储备'
  merge: -1
  img_proc: true
