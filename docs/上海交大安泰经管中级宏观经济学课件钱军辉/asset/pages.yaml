- pgno: 362
  md: '# 浮动汇率（Floating Exchange Rate）


    +   - 在浮动汇率制度下，汇率在外汇市场自由浮动。

    +   - 货币当局可能干预外汇市场（dirty float, managed float），也可以完全不干预（clean float）。

    +   - 浮动汇率的优势

    +     - 货币政策独立性（货币当局可以照顾“汇率稳定”以外的目标，如就业和通胀等）

    +   - 浮动汇率的劣势

    +     - 汇率波动较大'
  merge: -1
  img_proc: true
