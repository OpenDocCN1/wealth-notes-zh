- pgno: 369
  md: '# 小型开放经济、固定汇率


    +   - 在固定汇率制度下，央行为了维持给定汇率水平，要在贬值压力环境中做多本币（做空外币），要在升值压力环境中做空本币（做多外币）。

    +   - 当央行做多本币（做空外币），央行在紧缩货币供应；当央行做空本币（做多外币），央行在扩张货币供应。

    +   - 对建模的影响：在固定汇率制度下，货币供应视为内生。'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# 资本流动的挑战


    +   - 上世纪80年代开始，美国和IMF推动发展中国家开放资本账户，即允许资本流动，形式包括：

    +     - 直接投资

    +     - 证券投资

    +     - 跨境贷款

    +   - 同时，因为惧怕汇率波动，很多国家仍然保持固定汇率或较为刚性的管理浮动汇率。

    +   - 自由资本流动和刚性汇率结合，给宏观经济管理带来巨大挑战。

    +     - 在自由资本流动前提下，必须二选其一：要么选择固定汇率、牺牲货币政策独立性；要么选择独立货币政策，但必须实施浮动汇率。'
  merge: -1
  img_proc: true
