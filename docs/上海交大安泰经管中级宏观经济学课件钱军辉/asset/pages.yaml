- pgno: 152
  md: "# 边际消费倾向（Marginal Propensity to Consume）\n\n+   - 边际消费倾向 (MPC) 是增加一个单位可支配收入所带来的消费支出增加。用消费函数的一阶导数表示：\n\
    +   \n+     $$MPC = C'(Y - T)$$ \n+   - 特例：如果 $C(\\cdot)$ 为线性函数, 比如\n+   \n+ \
    \    $$C(Y - T) = 100 + 0.7(Y - T),$$\n+   \n+     那么 MPC 是常数。"
  merge: -1
