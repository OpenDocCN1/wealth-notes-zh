- pgno: 140
  md: '# 收入分配


    +   - 在我们的假设下，劳动者得到 $F_2(\bar{K},\bar{L})\cdot\bar{L}$，资本所有者得到 $F_1(\bar{K},\bar{L})\cdot\bar{K}$，没有经济利润。

    +     - 注意在“规模收益不变”假设下，我们有 $F(zK,zL)=zF(K,L)$ $\forall z>0$。于是从 $\frac{dF(zK,zL)}{dz}=\frac{d(zF(K,L))}{dz}$
    得到

    +       $$F_1(zK,zL)K + F_2(zK,zL)L = F(K,L).$$

    +       让 $z=1$，代入 $K=\bar{K}$ 和 $L=\bar{L}$，得到

    +       $$F_1(\bar{K},\bar{L})\bar{K} + F_2(\bar{K},\bar{L})\bar{L} = F(\bar{K},\bar{L})
    = \bar{Y}.$$'
  merge: -1
  img_proc: true
- pgno: 141
  md: "# Cobb-Douglas 经济\n\n+   - 假设 $F(K,L)=AK^\\alpha L^{1-\\alpha}$，我们有\n+   \n\
    +     $$\\mathrm{MPK}=F_1(K,L)=\\frac{\\alpha AK^\\alpha L^{1-\\alpha}}{K}=\\\
    frac{\\alpha F(K,L)}{K}$$\n+   \n+     $$\\mathrm{MPL}=F_2(K,L)=\\frac{(1-\\alpha)AK^\\\
    alpha L^{1-\\alpha}}{L}=\\frac{(1-\\alpha)F(K,L)}{L}$$\n\n+   - 资本所得的份额为\n+  \
    \ \n+     $$F_1(\\overline K,\\overline L)\\cdot\\overline K=\\alpha F(\\overline\
    \ K,\\overline L)=\\alpha\\overline Y$$\n\n+   - 劳动者所得的份额为\n+   \n+     $$F_2(\\\
    overline K,\\overline L)\\cdot\\overline L=(1-\\alpha)F(\\overline K,\\overline\
    \ L)=(1-\\alpha)\\overline Y$$"
  merge: -1
  img_proc: true
