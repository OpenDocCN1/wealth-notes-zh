- pgno: 137
  md: "# 劳动力需求曲线\n\n+   - 固定 $K=\\bar K$，关于 $L$ 的一阶条件刻画了劳动力需求和实际工资之间的关系（即劳动力需求曲线）：\n\
    +   \n+     $$F_2(\\bar K,L)=\\frac{W}{P}.$$\n\n— 因为 $F_{22}\\equiv\\frac{\\partial^2F}{\\\
    partial L^2}<0$，$F_2$ 是 $L$ 的减函数。因此较低的实际工资对应较高的劳动力需求。"
