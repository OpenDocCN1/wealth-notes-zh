- pgno: 479
  md: '# 自动财政稳定器


    +   - 自动财政稳定器（Automatic fiscal stabilizers）指自动起到稳定经济作用的财税制度安排。

    +   - 税收稳定器（Tax stabilizers）

    +     - 个人所得税（Personal income tax），累进税制

    +     - 企业所得税（EIT），增值税（VAT），营业税（BT）

    +   - 财政支出稳定器（Spending stabilizers）

    +     - 失业保险

    +     - 其它社保支出（如退休金）'
  merge: -1
  img_proc: true
- pgno: 480
  md: '# 自动稳定器的优势


    +   - 自动工作，没有迟滞，全周期运行。

    +     - 相机决策的政策常常缺位或迟滞。

    +   - 自动稳定器越多越好。

    +   - 自动“稳定破坏器”越少越好。'
  merge: -1
  img_proc: true
- pgno: 481
  md: '# 相机财政政策


    +   - 相机政策（discretionary policy）基于决策机构在特定场景下的判断和决策。

    +   - 直接的政府支出

    +     - 在基础设施、公共健康、教育等方面的支出

    +     - “择时”（Timing）很重要

    +   - 减税或税收优惠'
  merge: -1
  img_proc: true
- pgno: 482
  md: '# 财政赤字和公共债务


    +   - 财政赤字是流量（flow），公共债务是存量（stock）。

    +   - 政府不必“量入为出”，可以“入不敷出”。

    +     - 政府财政赤字是私人部门的净收入。

    +     - 政府公共债务增加，意味着私人部门资产增加（在封闭经济，两者相等）。

    +   - 应该用实际效果评价财政政策，而不是财政平衡这样的教条。'
  merge: -1
  img_proc: true
- pgno: 483
  md: "# 李嘉图等效（Ricardian Equivalence）\n\n+   - 因为政府最终要还债，所以是否减税（增加赤字）这一问题其实就是“现在收税，还是未来”（tax\
    \ now or tax later）。\n+   - 李嘉图等效原理：在某些假设下，这个选择的结果没有差异。  \n+     - 减税不会刺激总需求。"
  merge: -1
  img_proc: true
- pgno: 484
  md: '# 李嘉图等效为何不成立


    +   - 人们常常短视。

    +   - 对生命有限的纳税人来说，用长期债务融资支持的减税是种福利增加。

    +   - 对面临借贷约束的人来说，减税是一种“普惠”贷款。

    +   - 政府不一定需要还清债务。'
  merge: -1
