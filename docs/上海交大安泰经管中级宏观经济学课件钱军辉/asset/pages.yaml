- pgno: 261
  md: "# 实际工资和资本回报\n\n+   - 在竞争环境中，实际工资等于劳动边际产出（MPL），实际资本回报等于资本边际产出（MPK）。在稳态，我们有：\n\
    +   \n+     $$MPL = \\frac{\\partial Y}{\\partial L} = \\frac{\\partial}{\\partial\
    \ L}\\left(ALf\\left(\\frac{K}{AL}\\right)\\right) = A\\left(f(k^*)-k^*f'(k^*)\\\
    right).$$\n+   \n+     $$MPK = \\frac{\\partial Y}{\\partial K} = \\frac{\\partial}{\\\
    partial K}\\left(ALf\\left(\\frac{K}{AL}\\right)\\right) = f'(k^*).$$\n+   \n\
    +   - 索罗模型 II 预测持续上升的实际工资和稳定的资本回报。"
  merge: -1
  img_proc: true
