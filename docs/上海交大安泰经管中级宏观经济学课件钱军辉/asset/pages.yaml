- pgno: 422
  md: "# 通胀和失业之间的权衡取舍\n\n+   - 对政策制定者来说，菲利普斯曲线意味着通胀和失业之间的权衡取舍（Trade-off）。\n+   - 但菲利普斯曲线并不稳定。\
    \  \n+     - 通胀预期和价格冲击都会改变截距。  \n+     - 斜率也可能随时间变化。\n\n![](img/0703ffa5d8e4463f582a035dab90975a_422_0.png)"
  merge: -1
  img_proc: true
- pgno: 423
  md: '# 牺牲比例（Sacrifice Ratio）


    +   - 可以用一个牺牲比例来刻画通胀和失业之间的权衡取舍。

    +   - 不过更常见的“牺牲比例”是指通胀和GDP增速之间的权衡取舍，即牺牲多少个GDP增速的百分点，来换取通胀下降1个百分点。

    +   - 牺牲比例有多大，常常取决于政策可信度有多高。'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# 理性预期


    +   - 理性预期（Rational expectation）是一个常用的模型假设：人们使用所有信息，形成大体上正确的预期。

    +   - 在理性预期假设下，可能不存在通胀和失业之间的权衡取舍。

    +     - 坏处：无法用通胀上升换取失业率降低。

    +     - 好处：无痛控制通胀（如果政策可信）。'
  merge: -1
  img_proc: true
