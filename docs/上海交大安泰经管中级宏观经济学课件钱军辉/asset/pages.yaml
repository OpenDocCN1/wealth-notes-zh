- pgno: 208
  md: "# 实际汇率\n\n+   - 实际汇率是一个货币相对另一个货币的购买力，给定当前名义汇率和价格水平。\n+   - 用 $e$ 表示名义汇率，$P$\
    \ 表示国内价格水平，那么用外国货币为单位的本国价格水平为 $eP$。\n+   - 用 $P^*$ 表示国外价格水平，实际汇率定义为\n+   \n+ \
    \    $$\\varepsilon = \\frac{eP}{P^*}$$"
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 购买力平价（Purchasing Power Parity）


    +   - 如果 ε = 1，购买力平价（PPP）成立。理论上说，PPP是一价定理（the law of one price）的一个推论。

    +   - 如果 ε > 1，本币高估（本国价格比外国高）。

    +   - 如果 ε < 1，本币低估。'
  merge: -1
  img_proc: true
