  md: '# 凯恩斯交叉（Keynesian Cross）


    +   - 假设总支出（total expenditure）是消费支出、投资支出和政府支出之和：

    +     $$TE = C + I + G,$$

    +     - $C = C(Y - T)$

    +     - $T, I, and G$ are exogenous.

    +   - 总支出必须等于总收入（$Y$），

    +     $$Y = C(Y - T) + I + G.$$'
