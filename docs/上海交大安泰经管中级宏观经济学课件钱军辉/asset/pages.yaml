- pgno: 243
  md: '# 黄金律（Golden-Rule）


    +   - 稳态个人消费是稳态人均资本存量的函数

    +     $c^* = f(k^*) - s f(k^*) = f(k^*) - (\delta + n)k^*.$

    +   - 定义：让稳态个人消费最大化的人均资本存量，我称之为黄金律资本存量（golden-rule level of capital）。

    +   - 一阶条件可得：

    +     $f''(k^*_{gold}) = \delta + n.$

    +   - 在黄金律水平，资本边际产出等于折旧率+人口增长率。'
  merge: -1
  img_proc: true
