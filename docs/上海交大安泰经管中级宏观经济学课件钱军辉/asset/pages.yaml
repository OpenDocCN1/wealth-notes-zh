- pgno: 469
  md: '# 股市估值周期：牛市


    +   - 大众心理（Mass psychology）驱动估值周期。

    +     - 在熊市底部，谨慎和风险厌恶达到极致。敢于下注的投资者获得高额回报。

    +     - 随着公司基本面改善，投资者信心恢复，估值上升。

    +     - 新概念、新事物（漂亮50、互联网、FAANG等）冒出，投资者热情高涨，并吸引更多人入场，亏钱恐惧被踏空恐惧代替，估值进一步上升。

    +     - 股价加速上涨，所有人相信股票还会涨，因此无视估值，买到就是赚到，社会达到“股疯”状态。'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# 熊市


    +   - 在股疯状态中，微小的利空就能导致崩盘。

    +   - 牛市越牛，看多做多的人越多，仓位越重，看空做空的人越少，开始下跌后流动性越缺乏（买盘少）。

    +   - 下跌会让杠杆投资者收到 “margin call”，要求补充保证金，导致 “fire sale”，在缺乏流动性的市场中，推动股价加速下跌。

    +   - 股市估值下跌，导致投资和消费意愿下降，公司基本面下滑，并反馈到股价。

    +   - 投资者心理从股疯的极度乐观，切换到担心，盼望政府救市和反弹，在经历多次失望后达到极度悲观。

    +   - 熊市可能漫长，长达几年（A股2001-2005，2008-2013），也可能很短，历时几周（美股2020.3）。'
  merge: -1
  img_proc: true
- pgno: 471
  md: '# 明斯基金融不稳定假说


    +   - 明斯基（Hyman Minsky, 1919-1996）是一个“后凯恩斯主义”经济学家。

    +   - 明斯基提出，金融系统在“稳健”（robustness）和“脆弱”（fragility）之间钟摆，从而推动宏观经济商业周期。


    ![](img/0703ffa5d8e4463f582a035dab90975a_471_0.png)'
  merge: -1
  img_proc: true
- pgno: 472
  md: '# 明斯基的信用市场周期


    +   - 对冲融资（hedge finance）

    +     - 现金流足够还本付息。

    +   - 投机融资（speculative finance）

    +     - 现金流足够付息，但需要借新债还旧债。

    +   - 庞氏融资（Ponzi finance）

    +     - 现金流既不能还本也不能付息，需要资产价格不断上涨。


    ![](img/0703ffa5d8e4463f582a035dab90975a_472_0.png)'
  merge: -1
