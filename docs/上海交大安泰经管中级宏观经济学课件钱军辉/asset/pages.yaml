- pgno: 492
  md: '# 利率走廊


    +   - 利率走廊（Interest rate corridor or channel）是控制短期货币市场利率（short rate）的常见制度安排。

    +   - 走廊顶部（ceiling）： 央行向金融机构借出的利率。

    +   - 走廊底部（floor）： 央行从市场借入的利率。'
  merge: -1
  img_proc: true
