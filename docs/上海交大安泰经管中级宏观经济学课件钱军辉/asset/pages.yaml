- pgno: 13
  md: '# 计划经济


    +   - 从1953年至1978年，中国学习前苏联，试验了计划经济。

    +   - 计划经济依赖政府决定生产商品种类和数量，用哪些资源进行生产，以及由政府决定分配。

    +   - 没有市场，没有市场价格，没有创业者；厂长既没有动力，也没有自主经营和投资的权力；劳动者没有工作动力，也没有动力投资自己。

    +   - 结果是资源浪费、经济和生活水平停滞。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 混合经济


    +   - 1978年十一届三中全会召开后，中国开始改革开放。

    +   - 改革的一个重要方面是让市场扮演越来越重要的角色。

    +   - 2001年中国加入世界贸易组织（WTO），标志着经济全面开放。

    +   - 当前中国经济是一个混合经济形态：市场在资源分配中起到决定性作用，同时政府扮演重要角色。'
  merge: -1
  img_proc: true
