- pgno: 212
  md: "# PPP的推论\n\n+   - 如果 PPP 成立，\n+   \n+     $$e_t = \\frac{P_t^*}{P_t}.$$ \n\
    +   \n+     对数差分（log difference）后得到\n+   \n+     $$\\log\\frac{e_t}{e_{t-1}} =\
    \ \\pi_t^* - \\pi_t,$$\n+   \n+     其中 $\\pi_t^*$ 和 $\\pi_t$ 分别为外国和本国的通胀率。\n+\
    \   - PPP 意味着，如果外国通胀高于本国通胀，那么本国货币倾向于升值。"
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 利率平价（Interest Rate Parity）


    +   - 如果我们进一步假设本国和外国有相同的实际利率，那么

    +     $$\log\frac{e_t}{e_{t-1}}=i_t^*-i_t,$$

    +     其中 $i_t^*$ 和 $i_t$ 分别为外国和本国的名义利率。

    +   - 利率平价告诉我们，如果外国名义利率高于本国，那么本币倾向于升值。

    +   - 该版本的利率平价被称为“无抵补利率平价”（Uncovered interest rate parity）。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 超调（Overshoot）


    +   - 如果外国利率上升，本币瞬时贬值，且超过长期均衡，从而维持无抛补利率平价。

    +   - 超调是汇率波动较大的一个理论解释。


    ![](img/0703ffa5d8e4463f582a035dab90975a_214_0.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# 关于利率平价的经验事实


    +   - 在经验研究中，利率平价很少得到支持。即，高利率货币经常升值而不是贬值。

    +   - 此经验规律是套息交易（Carry trade）的基础。

    +     - 做空低息货币（贷款），做多高息货币。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# 小型开放经济模型


    +   - 假设:

    +     - 资本自由流动

    +     - 实际利率 $r^*$ 在世界市场决定，小国是价格接受者

    +     - 净出口是实际汇率 $\varepsilon$ 的减函数 $X(\varepsilon)$, $X''(\varepsilon) < 0$.

    +   - 在外汇市场，外汇供应方是净出口 $X$，外汇需求方是净资本流出（net capital outflow）， $F = S - I$.

    +   - 在外汇市场均衡，

    +     $$F(r^*) = S - I(r^*) = X(\varepsilon).$$'
  merge: -1
