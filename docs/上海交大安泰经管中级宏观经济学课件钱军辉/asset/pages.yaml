- pgno: 506
  md: '# # 课程结语


    +   - **建模就是简化。** 好的模型忽略不必要细节，聚焦主要的机制。

    +   - **理论模型刻画一组因果关系。** 外生变量的变化为因，内生变量的变化为果。

    +   - 理论模型的价值在于：很容易**实现“其他条件不变”**（ceteris paribus, other things being equal），即控制其他外生变量不变，单独分析一个外生变量的影响。

    +   - **时间维度重要。** 短期、中期、长期分析基于不同假设，能带来不同的理解。

    +   - **宏观环境不断变化。** 对同一个问题，答案可能会随环境变化而变化。

    +   - **熟悉数据和历史**是应用理论和理解经济的关键。'
  merge: -1
  img_proc: true
