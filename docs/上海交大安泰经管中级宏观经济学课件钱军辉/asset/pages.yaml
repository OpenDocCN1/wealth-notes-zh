- pgno: 267
  md: "# 两部门（Two-Sector）模型\n\n+   - 两部门模型假设经济有两个部门：制造业（生产商品和服务）和“知识业”（生产“知识”）。\n+\
    \   - 制造业的生产函数为\n+   \n+     $$Y_t = F(K_t, (1-u)L_tA_t),$$\n+   \n+     其中 $u$\
    \ 为知识业就业比例。\n+   - 知识业的贡献是技术进步：\n+   \n+     $$\\frac{\\dot{A}_t}{A_t} = g(u),$$\n\
    +   \n+     其中 $g(u)$ 刻画技术进步速度如何依赖知识业。\n+   - 资本积累过程：\n+   \n+     $$\\dot{K}_t\
    \ = sY_t - \\delta K_t.$$"
  merge: -1
  img_proc: true
- pgno: 268
  md: "# 稳态\n\n+   - 让 $k = \\frac{K}{AL}$，稳态如下\n+   \n+     $sf(k^*, u) = (\\delta\
    \ + n + g(u))k^*,$\n+   \n+     其中 $f(k, u) = F(k, 1 - u)$.\n+   - 两部门模型也允许持续增长。\n\
    +   - 稳态增长率不再外生给定，而是依赖“知识业”如何生产。"
  merge: -1
