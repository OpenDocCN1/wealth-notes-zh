- pgno: 68
  md: "# 更具体的分解\n\n+   - 让 $C^d$ 表示用于购买国产商品和服务的消费支出，$C^f$ 表示用于购买进口商品和服务的消费支出。\n+ \
    \  - 同样的，定义 $I^d,I^f,G^d,G^f$．我们有：\n+     $$C=C^d+C^f, I=I^d+I^f, G=G^d+G^f.$$\
    \ \n+   - 让 $EX$ 和 $IM$ 分别表示出口和进口，则\n+     $$X=EX-IM$$\n+     $$IM=C^f+I^f+G^f.$$\
    \ \n+   - 因此我们有\n+     $$Y=(C^d+C^f)+(I^d+I^f)+(G^d+G^f)+EX-(C^f+I^f+G^f).$$"
  merge: -1
