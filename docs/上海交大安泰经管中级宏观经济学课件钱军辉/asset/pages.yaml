- pgno: 367
  md: '# 虚拟实验小结


    +   - 汇率 $e$ 扮演了类似封闭经济IS-LM模型中利率的角色。

    +   - 财政刺激引起汇率升值，“挤出”出口，总产出不变。

    +   - 货币刺激引起汇率贬值，刺激出口，总产出上升——货币政策传导的汇率渠道：

    +     $M \uparrow \Rightarrow e \downarrow \Rightarrow X(e) \uparrow \Rightarrow
    Y \uparrow.$'
  merge: -1
