- pgno: 434
  md: "# IS 方程\n\n+   - 我们考虑如下 IS 方程\n+   \n+     $$y_t = \\bar{y} - \\alpha(r_t -\
    \ \\rho) + u_t,$$\n+   \n+     其中 $y_t = \\log(Y_t)$, $\\bar{y} = \\log(\\bar{Y})$,\
    \ $r_t$ 为实际利率, $u_t$ 为需求侧冲击, $\\alpha$ 为常数（利率变化如何影响总需求），$\\rho$ 为自然利率（natural\
    \ rate of interest）。\n+   - 实际利率 $r_t$ 设置为事前实际利率,\n+   \n+     $$r_t = i_t - E_t\\\
    pi_{t+1},$$\n+   \n+     其中 $i_t$ 为名义利率，$E_t\\pi_{t+1}$ 为 $t$ 时刻对下一期通胀率的预期。"
  merge: -1
  img_proc: true
- pgno: 435
  md: '# 菲利普斯曲线方程


    +   - 我们设置如下“菲利普斯曲线”方程：

    +     $$\pi_t = E_{t-1}\pi_t + \phi(y_t - \bar{y}) + \nu_t,$$

    +     其中 $(y_t - \bar{y})$ 为产出缺口（output gap）， $\nu_t$ 为供给侧冲击， $\phi$ 为常数（产出缺口如何影响通胀）。

    +   - 该方程刻画通胀和产出（就业）之间的权衡取舍，因此我们称之为菲利普斯曲线方程。'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# 货币政策规则


    +   - 我们假设央行采用如下货币政策规则（monetary policy rule），

    +     $i_t = \pi_t + \rho + \theta_\pi(\pi_t - \pi^*) + \theta_y(y_t - \bar{y})$

    +     其中 $\pi^*$ 为通胀目标, $\theta_\pi$ 和 $\theta_y$ 分别刻画政策利率如何应对通胀和产出变化。

    +   - 刻画美联储的泰勒规则（Taylor’s rule）为

    +     federal fund rate = inflation + 2 +0.5(inflation − 2) + 0.5(GDP gap)

    +   - 该规则体现了货币政策的双目标:

    +     - 通胀

    +     - 就业'
  merge: -1
  img_proc: true
- pgno: 437
  md: "# 完整模型\n\n+   - 预期采用适应性预期（$E_{t-1}\\pi_t = \\pi_{t-1}$）。于是\n+   \n+     $y_t\
    \ = \\bar{y} - \\alpha(i_t - \\pi_t - \\rho) + u_t,$\n+     $\\pi_t = \\pi_{t-1}\
    \ + \\phi(y_t - \\bar{y}) + v_t,$\n+     $i_t = \\pi_t + \\rho + \\theta_{\\pi}(\\\
    pi_t - \\pi^*) + \\theta_y(y_t - \\bar{y}).$\n+   - 内生变量: $y_t$, $\\pi_t$, $i_t$\n\
    +   - 滞后内生变量: $\\pi_{t-1}$\n+   - 外生变量: $\\bar{y}$, $\\pi^*$, $u_t$, $v_t$"
  merge: -1
  img_proc: true
- pgno: 438
  md: "# 稳态\n\n+   - 稳态（steady state）定义为：通胀率为常数，无冲击（$u_t = v_t = 0$）。\n+   - 可以推导出：\n\
    +   \n+     $y_t = \\bar{y}, \\pi_t = \\pi^*, i_t = \\pi^* + \\rho,\\ r_t = \\\
    rho.$\n+   - 在稳态，实际变量（$y_t, r_t$）跟货币政策无关，而货币政策只影响名义变量（$\\pi_t, i_t$）。（即，古典两分法在稳态成立。）"
  merge: -1
  img_proc: true
- pgno: 439
  md: "# 解\n\n+   - 可以解出：\n+   \n+     $$\\pi_t=a_1(\\pi_{t-1}+v_t)+a_2\\pi^*+a_3u_t,$$\n\
    +     $$y_t=\\bar y+a_4(\\pi^*-\\pi_{t-1}-v_t)+a_5u_t,$$\n+   \n+     其中\n+  \
    \   $$a_1=\\left(1+\\frac{\\phi\\alpha\\theta_\\pi}{1+\\alpha\\theta_y}\\right)^{-1},\\\
    quad a_2=\\frac{\\phi\\alpha\\theta_\\pi}{1+\\alpha\\theta_y+\\phi\\alpha\\theta_\\\
    pi},\\quad a_3=\\frac{\\phi}{1+\\alpha\\theta_y+\\phi\\alpha\\theta_\\pi},$$\n\
    +     $$a_4=\\frac{\\alpha\\theta_\\pi}{1+\\alpha\\theta_y+\\phi\\alpha\\theta_\\\
    pi},\\quad a_5=\\frac{1}{1+\\alpha\\theta_y+\\phi\\alpha\\theta_\\pi}.$$\n\n+\
    \   - 名义利率 $i_t$ 依据货币政策规则可得。"
  merge: -1
  img_proc: true
