- pgno: 270
  md: '# 经济增长核算（Growth Accounting）


    +   - 经济增长的贡献来自哪里？

    +     - 要素积累

    +       - 资本 (K)

    +       - 劳动力 (L)

    +     - 技术进步


    +   - 上述各项各自贡献多少？

    +     - 如果增长的源泉不是技术进步，而只是要素积累，那么增长可能无法持续。'
  merge: -1
  img_proc: true
- pgno: 271
  md: "# 技术进步\n\n+   - 我们用全要素增强的函数形式，$Y_t = A_t F(K_t, L_t)$，其中 $A_t$ 称为全要素生产率（total\
    \ factor productivity）。\n+   - 简单推导可得增长核算方程：\n+     $$\frac{\\dot{Y}_t}{Y_t} =\
    \ \\alpha_t \\frac{\\dot{K}_t}{K_t} + \\beta_t \\frac{\\dot{L}_t}{L_t} + \\frac{\\\
    dot{A}_t}{A_t},$$\n+   - $\\frac{\\dot{A}_t}{A_t}$ 被称为索罗残差（Solow residual），测度技术进步的速度。"
  merge: -1
  img_proc: true
