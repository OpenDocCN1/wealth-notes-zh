- pgno: 2
  md: '# 宏观经济学


    +   - 宏观经济学、微观经济学、和计量经济学是经济学三大领域。

    +   - 宏观经济学将经济看作一个整体，研究其增长、波动，以及管理。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# 个体和整体


    +   - 微观经济学研究个体（消费者、厂商等）行为，宏观经济学研究整体行为。

    +     - 宏观经济学依赖总和（aggregate）概念，如总需求、总供应、总体价格水平等。

    +     - 总和变量的经济学含义未必就是相应个体变量之和（比如，总体价格水平）。

    +     - 适用于个体的定律未必适用于整体（比如，需求曲线）。

    +     - 宏观经济学更倾向“行为经济学”假设。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 宏观经济学目标


    +   - 理解经济波动（或商业周期）的原因和后果。

    +   - 理解为什么有些国家能实现长期经济增长，而其他国家不能。

    +   - 理解宏观经济政策

    +     - 财政政策（Fiscal policy）

    +     - 货币政策（Monetary policy）

    +   - 宏观经济预测'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 为什么宏观经济学重要


    +   - 理解经济增长和波动，是宏观经济管理的前提。

    +   - 稳定增长的经济不仅意味着越来越高的生活水平，而且也意味着更和谐的社会。

    +     - “仓廪实则知礼节，衣食足则知荣辱。”

    +     - 经济萧条容易让国民排外、歧视少数族群、支持极端主义。'
  merge: -1
  img_proc: true
