- pgno: 45
  md: '# 国内生产总值


    +   - 国内生产总值 (Gross Domestic Product, GDP) 是一段时间内（比如一个季度）所有国内生产的、最终商品和服务的、交换价值总和。

    +   - 三个角度看GDP:

    +     - [生产] 国内生产的最终商品和服务价值

    +     - [收入] 国内生产的最终商品和服务交换中产生的总收入（income）

    +     - [支出] 国内生产的最终商品和服务交换中产生的总支出（expenditure）

    +   - 每次交换产生的收入必等于支出，因此总收入必等于总支出。'
  merge: -1
  img_proc: true
