- pgno: 20
  md: '# 宏观建模


    +   - 经济学家用建模来理解经济问题。

    +     - 从数据出发，总结出需要解释的现象（内生变量的统计量，如增长问题中的实际GDP增速），称为“经验事实”（Empirical fact）。

    +     - 为解释该现象，提出一个模型（一个简化的玩具经济），该模型包括

    +       - 内生变量和外生变量

    +       - 变量之间的关系（假设，Assumptions）

    +     - 什么样的模型是成功的模型？

    +       - 从模型得到的推论（假说，Hypotheses），用外生变量的变化“解释”需要解释的现象（内生变量的特征）。

    +       - 从模型得到的其他推论得到数据支持。

    +     - 当场景发生变化，成功的模型也会失败，此时需要更新的模型，用以解释新现象。

    +     - 如此建模和理解的过程，没有终点。

    +   - 经济学研究的进步体现在经验和模型的积累。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 如何运用模型的艺术


    +   - 提出和分析模型是科学（Science），在特殊现实场景运用模型是艺术（Art）。

    +   - 凯恩斯如是说：

    +     *Economics is a science of thinking in terms of models joined to the art
    of choosing models which are relevant to the contemporary world.*'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# It Depends!


    +   - 跟经济有关的问题，不错的回答总是：It depends.

    +     - 实际场景很复杂，模型假设是否成立，有很大的不确定性。

    +     - 客观、准确、全面的观察很重要。

    +     - 谦虚很重要。'
  merge: -1
  img_proc: true
