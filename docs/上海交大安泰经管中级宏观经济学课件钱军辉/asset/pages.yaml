- pgno: 433
  md: '# 一个更有用的AD-AS模型


    +   - 模型设定

    +     - IS 方程

    +     - 菲利普斯曲线方程

    +     - 货币政策规则（monetary policy rule）

    +   - 解模型

    +   - 应用'
