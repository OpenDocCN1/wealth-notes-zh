- pgno: 184
  md: "# 货币和通胀\n\n+   - 对货币数量方程作全微分可得：\n+     $$\\frac{dM}{M} + \\frac{dV}{V} = \\\
    frac{dP}{P} + \\frac{dY}{Y}.$$  \n+     - $\\frac{dM}{M}$ 和 $\\frac{dY}{Y}$ 分别为货币供应和实际GDP增速。\n\
    +     - $\\frac{dP}{P}$ 为通货膨胀率。\n+     - 因为 $V$ 为常数，所以 $\\frac{dV}{V} = 0$.\n\
    +   - 给定实际GDP增速，货币供应增速决定了通胀率。"
  merge: -1
