- pgno: 181
  md: '# 货币数量理论


    （Quantity Theory of Money）


    +   - 用 $T$ 表示一段时间内交易次数，$P$ 表示价格水平，$M$ 表示流通中的货币。我们可以定义货币流通速度（transaction velocity
    of money）为

    +     $$V \equiv \frac{PT}{M}.$$


    +   - 经典假设：货币流通速度是常数。


    +   - 货币数量理论写为

    +     $$MV = PT.$$'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 货币数量理论

    （Quantity Theory of Money）


    +   - 对于异质性商品和服务，“交易次数”可用“不变价”加权，因此 $T$ 可用实际GDP代替，得到更实用的货币数量理论：


    $$MV = PY,$$


    其中 $Y$ 表示实际GDP。'
  merge: -1
  img_proc: true
