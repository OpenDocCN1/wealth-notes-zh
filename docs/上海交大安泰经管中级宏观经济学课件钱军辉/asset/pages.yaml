- pgno: 260
  md: '# 平衡增长（Balanced Growth）


    +   - 索罗模型的稳态刻画了平衡增长的路径。

    +   - 一些重要的比例为常数

    +     - $C_t/Y_t$, $K_t/Y_t$

    +   - 另一些按相同速度增长

    +     - 人均资本 ($K_t/L_t$)

    +     - 劳动生产率 ($Y_t/L_t$)'
