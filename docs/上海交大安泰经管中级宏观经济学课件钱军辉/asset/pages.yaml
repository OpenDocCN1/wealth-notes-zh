- pgno: 458
  md: '# 投资的重要性


    +   - 如果忽略政府开支和外贸，我们可以将有效需求 Y 分解为

    +     $$Y = C(Y) + I,$$

    +     - $C(Y)$ 为消费函数（凯恩斯称之为 propensity to consume）。

    +     - $I$ 为新投资产生的需求。

    +     - 有效需求产生收入。

    +   - 如果投资需求下降，有效需求、收入、就业随之下降。'
  merge: -1
  img_proc: true
- pgno: 459
  md: '# 富裕中的贫困


    +   - 因为边际消费倾向（MPC）低于一，且可能随收入上升而下降，所以富裕社会的消费需求和收入之间的缺口较大。

    +   - 投资不仅跟增长有关，也是维持当前收入水平的必须。

    +   - 如果投资下降，有效需求下降，失业就会上升。

    +   - 富裕中的贫困（Poverty in the Midst of Plenty）：富余的生产力，贫穷的失业人口。'
  merge: -1
  img_proc: true
- pgno: 460
  md: '# 投资需求的决定因素


    +   - 预期收益（Prospective yield）：（投资形成的）资产未来的现金流（cash flow）。

    +   - 资产的供应价格（Supply price）或重置成本（replacement cost）：生产该资产的边际成本。

    +   - 利率'
  merge: -1
  img_proc: true
- pgno: 461
  md: '# 资本边际效率


    +   - 给定预期收益和资产供应价格，可以计算资本边际效率（marginal efficiency of capital），用以刻画资产的回报率

    +   - 用 $Q_1$, $Q_2$, ..., $Q_n$ 表示预期现金流。资本边际效率是一个折现率 $r_m$，满足如下方程：

    +     Supply price

    +     $= \frac{Q_1}{(1 + r_m)} + \frac{Q_2}{(1 + r_m)^2} + \cdots + \frac{Q_n}{(1
    + r_m)^n}.$'
  merge: -1
  img_proc: true
- pgno: 462
  md: '# 资产的需求价格


    +   - 资产的需求价格（demand price of a capital asset）定义为

    +     Demand price

    +     = Q₁/(1 + r) + Q₂/(1 + r)² + … + Qₙ/(1 + r)ⁿ,

    +     其中 r 为利率。

    +   - 如果某资产的供应价格低于需求价格（也就是 rₘ > r），那么创业者就会投资供应该资产。

    +   - 创业家们会不断投资，直到没有什么资产的 MEC高于利率。'
  merge: -1
  img_proc: true
- pgno: 463
  md: "# 宏观经济不稳定的源头\n\n+   - 资产的供应价格相对稳定。\n+   - 现金流预期，尤其是长期预期，很不稳定。因此资本边际效率很不稳定。\n\
    +   - 凯恩斯认为资本边际效率的不稳定性是商业周期的根本原因。  \n+     - 资本边际效率的乐观估计导致过度投资和经济过热。  \n+    \
    \ - 过度投资迟早让资产回报下降，乐观估计突变为悲观估计，导致投资需求迅速下滑。"
  merge: -1
  img_proc: true
- pgno: 464
  md: '# 衰退如何结束


    +   - 当资本边际效率低于利率，投资需求维持疲弱，衰退持续。

    +   - 衰退如何结束？

    +     - 央行将利率降至低于资本边际效率。

    +     - 预期资产现金流改善（信心恢复）

    +     - 供应价格下降，使得资本边际效率上升。'
  merge: -1
  img_proc: true
- pgno: 465
  md: '# 股票市场的作用


    +   - 对潜在的创业者来说，买入股票是投资实业的替代。

    +     - 股价（估值）高企鼓励投资实业，反之则投资实业动力下降。

    +   - 股票市场为各类资产提供了常规估值（conventional valuation），即常规的需求价格。

    +     - 股市的常规估值有缺陷，但必不可少。

    +       - 因为不确定性（Uncertainty），很难形成预期，对预期的信心也很脆弱。'
  merge: -1
  img_proc: true
- pgno: 466
  md: '# 股市的缺陷


    +   1. 股市总体的估值能力可疑。

    +   2. 利润短期波动对股价影响巨大。

    +   3. 常规估值是大众心理（mass psychology）博弈而成，可能因为某些非基本面原因发生巨变。'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# 股市的缺陷


    4. 即使是专业投资者，其主要工作也不是做更好的预测，更合理的估值，而是预测常规估值的变化，从而跑在别人前面。


    — “价值投资者”的挑战


    +   a) 人性更喜欢迅速致富。

    +   b) 价值投资者需要更多耐心，更多的资源，要避免杠杆。

    +   c) 通常是一个群体（基民或投资委员会）衡量价值投资者的表现，逆向投资者会受到最多批评、质疑和撤资。'
  merge: -1
  img_proc: true
