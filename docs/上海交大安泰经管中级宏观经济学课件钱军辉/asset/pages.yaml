- pgno: 477
  md: '# 平准政策


    +   - 政府有责任，也有能力稳定经济。

    +   - 我们希望政策是“逆周期”（countercyclical）的，即衰退时刺激，过热时紧缩。

    +   - 我们希望避免“顺周期”（procyclical）政策，即衰退时紧缩，过热时刺激。'
