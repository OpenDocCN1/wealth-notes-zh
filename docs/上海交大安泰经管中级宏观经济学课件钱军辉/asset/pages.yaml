- pgno: 136
  md: "# 一阶条件\n\n+   - 关于K的一阶条件：\n+   \n+     $$F_1(K,L) = \\frac{R}{P}.$$ \n+   \n\
    +     - $F_1 \\equiv \\frac{\\partial F}{\\partial K}$ 为 “边际资本产出”（Marginal product\
    \ of capital, MPK）。\n+   - 关于L的一阶条件：\n+   \n+     $$F_2(K,L) = \\frac{W}{P}.$$\
    \ \n+   \n+     - $F_2 \\equiv \\frac{\\partial F}{\\partial L}$ 为 “边际劳动产出”（Marginal\
    \ product of labor, MPL）。"
  merge: -1
