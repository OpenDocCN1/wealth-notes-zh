  md: "# 计算 GDP\n\n+   - GDP: 一段时间内国内生产的最终商品和服务的市场价值总和。\n\n$GDP_t = \\sum_{i=1}^{M}\
    \ q_{it} p_{it}$\n\n其中 $q_{it}$ 和 $p_{it}$ 分别为第 $i$ 种商品或服务的数量和价格，$t$ 代表时间段（比如某个季度）。\n\
    \n+   - 如果一棵苹果树和一棵桔子树构成一个经济，每年生产20个苹果和30个桔子，市场价格分别为0.5和1元，那么\n\nGDP = (苹果价格 ×\
    \ 苹果数量)\n    + (桔子价格 × 桔子数量)\n    = (0.5 × 20) + (1.0 × 30) = 40 元"
  merge: -1
  img_proc: true
- pgno: 48
  md: '# GDP核算规则：

    用市场价格


    +   - 如果有市场价格，就用市场价格计算商品和服务的价值。

    +   - 如果没有市场价格，就采用估价（imputation），比如自有房屋的租金需要估价。

    +   - 对地下经济不作估价。'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# GDP核算规则：

    最终商品和服务


    +   - 中间产品不作重复计算

    +     GDP = 最终商品和服务的价值

    +     = 所有生产阶段的增加值的总和

    +   - 二手商品不计算（包括库存商品的出售）'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# GDP核算规则：

    国内生产


    +   - 进口的商品和服务不算在GDP内。

    +   - 但它们会被计算在支出法GDP的消费或投资项内。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 名义GDP和实际GDP


    +   - 名义GDP（nominal GDP）用现价（current price）， $GDP_t = \sum_{i=1}^{M} q_{it} p_{it}$。

    +     - 数量和价格变化都能带来名义GDP变化。

    +   - 实际GDP（real GDP）用不变价（constant price）， $RGDP_t = \sum_{i=1}^{M} q_{it} p_{it_0}$，

    +     其中 $t_0$ 代表基期（base period）， $p_{it_0}$ 不随时间变化。

    +   - 实际测度（实际GDP，实际工资等）帮助我们衡量剔除价格变化后的实际变化。

    +   - 名义GDP和实际GDP之间的关系：

    +     $GDP_t = P_t \cdot RGDP_t$，

    +     其中 $P_t$ 是GDP平减因子（GDP deflator, or implicit price deflator for GDP）。'
  merge: -1
  img_proc: true
