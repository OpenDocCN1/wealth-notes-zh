- pgno: 283
  md: '# 工业化


    +   - 工业部门使用来自传统农业部门的廉价劳动力，获得较高的资本回报。

    +   - 工业部门将利润再投资，积累更多资本，需求更多劳动力。

    +   - 于是更多劳动力从传统农业部门迁移到工业部门，后者维持高利润（因为传统农业部门的MPL保持在零附近）、高投资。经济发展进入良性循环。

    +   - 因为劳动力从低效率部门（传统农业）迁往高效率部门（工业），所以总体效率提高，实现“技术进步”。'
  merge: -1
  img_proc: true
