- pgno: 407
  md: '# 一般 AS 曲线


    +   - AS曲线刻画了总供给与总体价格水平之间的关系。

    +   - 总供给曲线可以由如下函数表示：

    +     $$P(Y, Z),$$

    +     其中 $Z$ 为一组外生变量，且 $\frac{\partial P}{\partial Y} > 0$，即总供给曲线向上倾斜。'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# 论证1：不完美信息（Imperfect-Information）


    +   - 假设每个公司生产一种不同的商品。

    +   - 公司所拥有的产品价格信息不完美：当物价上涨时，会错误地认为自己的商品更受欢迎了。即错把普遍的涨幅看作相对的涨幅。

    +   - 当总体价格上涨，相当数量的公司选择扩大生产，于是有了向上倾斜的AS曲线。'
  merge: -1
  img_proc: true
- pgno: 409
  md: "# 线性AS曲线\n\n+   - 一个有用的线性AS曲线如下：\n+   \n+     $$P = EP + \\phi(Y - \\bar{Y}),$$\n\
    +   \n+     其中 $Y$ 为产出，$\\bar{Y}$ 为产出潜力，$P$ 为价格水平，$EP$ 为预期价格水平，$\\phi > 0$ 为一个参数。\n\
    \n![](img/0703ffa5d8e4463f582a035dab90975a_409_0.png)"
  merge: -1
  img_proc: true
- pgno: 410
  md: '# 论证2：粘性价格和异质性公司


    +   - 假设有两种类型的公司

    +     - 价格灵活类，其价格设定遵循

    +       $P_f = P + \gamma(Y - \bar{Y})$.

    +     - 价格粘滞类，其价格设定为预期价格

    +       $P_s = E P$.

    +   - 假设 $s$ 价格粘滞类占比。于是总体价格水平为

    +     $P = s P_s + (1 - s) P_f =$

    +     $s E P + (1 - s)(P + \gamma(Y - \bar{Y}))$.

    +   从中可得

    +     $P = E P + \frac{(1 - s)\gamma}{s} (Y - \bar{Y})$.

    +'
  merge: -1
  img_proc: true
