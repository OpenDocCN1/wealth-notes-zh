- pgno: 202
  md: '# 国际收支平衡（Balance of Payments）


    +   - 国际收支平衡恒等式：

    +     经常账户余额 + 资本账户余额 + 统计误差 = 0


    +   - 在理论分析中可以忽略统计误差，因此经常账户盈余（赤字）对应资本账户赤字（盈余）。'
  merge: -1
