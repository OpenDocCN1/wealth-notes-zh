- pgno: 310
  md: '# 含义


    +   - 总支出决定总收入。

    +     - 节俭悖论（Paradox of thrift）

    +   - 总产出可能会低于产出潜力，同时失业率可能高于自然失业率。

    +   - 投资和政府支出的重要性：因为边际消费倾向（MPC）递减，所以为支持更高的收入，投资和政府支出要扮演更重要角色。

    +   - 乘数效应（Multiplier effect）：投资或政府开支的增加一个单位，会引起大于一个单位的收入增加。'
  merge: -1
  img_proc: true
- pgno: 311
  md: "# 政府购买的乘数效应\n\n+   - 假设消费函数为线性，\n+     $$C(Y - T) = C_0 + C_1(Y - T),$$\n+\
    \     其中 $C_0$ 为“自主消费”（autonomous consumption），$C_1$ 为“边际消费倾向”（marginal propensity\
    \ consume, MPC）。\n+   - 对以下方程应用隐含函数定理，\n+     $$Y = C_0 + C_1(Y - T) + I + G.$$\n\
    +     可得\n+     $$\frac{\\partial Y}{\\partial G} = \\frac{1}{1 - C_1} = \\frac{1}{1\
    \ - MPC}.$$\n+   - $\\frac{1}{1 - MPC}$ 被称为政府购买乘数（government purchase multiplier）。\n\
    +   - 投资增加也有同样的乘数效应。"
  merge: -1
  img_proc: true
