    +   - 实际工资（Real wage）是以产出为单位、支付给工人的工资，\(\frac{W}{P}\)。

    +   - 实际资本租金（Real rental price of capital）是以产出为单位、付给资本所有者的租金，\(\frac{R}{P}\)。'
