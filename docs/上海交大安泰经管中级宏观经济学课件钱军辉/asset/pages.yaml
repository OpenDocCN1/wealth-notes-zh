- pgno: 240
  md: '# 索罗模型Ⅰ的含义


    +   - 如果经济已经处于稳态，那么人均收入将不再增长。但总收入仍然随着人口增长，

    +     $Y_t = y^* L_t = y^* L_0 e^{n t}$。

    +   - 如果经济低于稳态水平，那么会有一段收敛型（convergence）或追赶型（catch-up）的增长。'
  merge: -1
  img_proc: true
- pgno: 241
  md: "# 储蓄的影响\n\n+   - 稳态方程如下：\n+     $$ s f(k^*) = (\\delta + n) k^*.$$ \n+   -\
    \ 用隐含函数定理可得\n+     $$ \\frac{\\partial k^*}{\\partial s} = - \\frac{ f(k^*) }{\
    \ s f'(k^*) - (\\delta + n) }.$$ \n+   - 因为 $\\lim_{k \\to 0} f'(k) = \\infty$,\
    \ $\\lim_{k \\to \\infty} f'(k) = 0$, 曲线 $s f(k)$ 与斜线 $(\\delta + n)k$ 在 $k =\
    \ k^*$ 处相交，所以\n+     $$ s f'(k^*) < \\delta + n.$$ \n+   - 因此高储蓄率对应更高的人均资本存量和产出。"
  merge: -1
  img_proc: true
