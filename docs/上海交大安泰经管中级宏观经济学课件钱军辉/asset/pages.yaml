  md: "# 简化假设\n\n+   - 封闭经济：假设净出口 $X=0$。于是\n+     $$Y=C+I+G.$$ \n+   - 财政外生：政府购买 $(G)$\
    \ 税收 $(T)$ 均为外生变量。"
