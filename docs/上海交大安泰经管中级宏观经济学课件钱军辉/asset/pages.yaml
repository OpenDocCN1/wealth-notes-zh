- pgno: 390
  md: "# 让价格“内生”\n\n+   - 为了分析通胀，必须允许价格变化。\n+   - 我们把时间窗口从“短期”拉长至“中期”，即价格会有变化，但并不灵活。\n\
    +   - 于是价格成为AD-AS模型中的内生变量。\n+   - 事实上，我们可以将 IS-LM 视为 AD-AS 的特例:\n+     $Y = C(Y\
    \ - T) + I(r) + G$\n+     Demand side $\frac{M}{P} = L(r, Y)$\n+     Supply side\
    \ $P = \\bar{P}$"
  merge: -1
  img_proc: true
- pgno: 391
  md: '# 总需求（Aggregate Demand）


    +   - IS-LM方程定义了一个隐含函数 $Y(P,T,G,M)$，即总需求函数。

    +   - 其中总需求$Y$和价格$P$之间的关系为“总需求曲线”。

    +   - 为解出 $Y(P,T,G,M)$，我们可以在IS-LM方程组中消去 $r$.

    +     - 更简单的做法是通过全微分，消去 $dr$，解出 $dY$.'
  merge: -1
  img_proc: true
- pgno: 392
  md: "# AD 曲线的斜率\n\n+   - AD曲线的数学含义：给定 $T$，$G$，$M$ 等外生变量，价格水平 $P$ 上升一个单位，总需求 $Y$\
    \ 变化多少。\n\n+   - 对 IS-LM 方程全微分，消去 $dr$，得到\n+   \n+   $$\\frac{dP}{dY}=-\\frac{P}{L}\\\
    left(L_1\\frac{1-C'}{I'}+L_2\\right)<0,$$\n\n因为 $L_1<0, L_2>0, I'<0, 0<C'<1$。"
  merge: -1
  img_proc: true
