- pgno: 196
  md: "# 净出口（Net Export）\n\n+   - 在开放经济中，国内支出不一定等于国内产出。其差额为**净出口**：\n+   \n+     $$Y-(C+I+G)=X=EX-IM,$$\n\
    +   \n+     其中，$Y$为总产出，$(C+I+G)$为国内支出，$X$为净出口，$EX$为出口，$IM$为进口。\n+   - 净出口也称为**贸易余额**（balance\
    \ of trade）、**贸易差额**。"
  merge: -1
  img_proc: true
- pgno: 197
  md: "# 经常账户（Current Account）\n\n+   - 贸易余额是经常账户（CA）最重要部分：\n+     CA = 贸易余额（trade\
    \ balance） + \n+     净要素收入（net factor income） + \n+     净现金转移（net cash transfer）\n\
    +     - 如果 CA>0: 经常账户盈余（surplus）\n+     - 如果 CA<0: 经常账户赤字（deficit）\n\n+   - 在本课程中，我们忽略要素收入和现金转移，将经常账户与贸易余额视为等同。"
  merge: -1
  img_proc: true
