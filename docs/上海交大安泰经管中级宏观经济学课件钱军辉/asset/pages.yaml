- pgno: 235
  md: '# 稳态（Steady-State）


    +   - 一方面，随着资本不断积累，资本边际产出下降，因此投资（$sf(k)$）增速下滑。

    +   - 另一方面，资本折旧按固定速度消耗资本存量，人口增长按固定速度稀释资本存量。

    +   - 该经济会达到一个稳态，新增资本与损耗和人口稀释相等：

    +     $$i^* = sf(k^*) = (\delta + n)k^*.$$

    +   - 在稳态，人均资本存量不再变化。我们称 $k^*$ 为稳态人均资本存量。'
  merge: -1
  img_proc: true
