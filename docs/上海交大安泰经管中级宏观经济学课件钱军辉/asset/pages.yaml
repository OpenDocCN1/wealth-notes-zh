- pgno: 322
  md: "# # IS方程\n\n+   - 假设投资是实际利率的函数：\n+     $$I = I(r).$$\n+   - 我们假设 $I(r)$ 可导，且\
    \ $I'(r)<0$，高利率抑制投资。\n+   - IS方程刻画了金融市场（可贷资金市场）均衡，\n+     $$Y=C(Y-T)+I(r)+G.$$\
    \ \n+     - 内生变量：$Y$ 和 $r$\n+     - 外生变量：$T$，$G$，等\n+   - IS方程定义了一个隐含函数 $r(Y)$，即\
    \ IS 曲线。"
  merge: -1
  img_proc: true
- pgno: 323
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 324
  md: '# IS 曲线的斜率


    +   - IS 定义了一个隐含函数，

    +     $r = r(Y, T, G)$.

    +   - IS 曲线的斜率是 $\partial r / \partial Y$，其定义为

    +     $\frac{\partial r}{\partial Y} \equiv \lim_{\Delta Y \to 0} \frac{r(Y +
    \Delta Y, T, G) - r(Y, T, G)}{\Delta Y}$.

    +     - 其他条件不变（即固定 $T$ 和 $G$），$Y$ 增加一个单位，对应 $r$ 增加多少。

    +   - 应用隐含函数定理可得

    +     $\frac{\partial r}{\partial Y} = -\frac{1 - C''}{-I''} = \frac{1 - C''}{I''}
    < 0.$'
  merge: -1
  img_proc: true
- pgno: 325
  md: '# 扩大政府采购如何影响IS曲线


    +   - 给定任意一个 $r$，凯恩斯交叉模型告诉我们，政府购买增加 $\Delta G$ 所带来的收入增加为 $\frac{\Delta G}{1-MPC}$。

    +   - 也就是说，政府购买增加 $\Delta G$ 将导致 IS 曲线**右移** $\frac{\Delta G}{1-MPC}$。


