- pgno: 364
  md: '# 小型开放经济、浮动汇率


    +   - 第一个 Mundell-Fleming 模型：小型开放经济、浮动汇率

    +   - 实质上就是开放经济 IS-LM 模型。包含两个方程：

    +     $$Y = C(Y - T) + I(r^*) + G + X(e)$$

    +     $$\frac{M}{P} = L(r^*, Y),$$

    +     其中 $r^*$ 为世界利率， $X(e)$ 为净出口（net export）， 满足 $X''(e) < 0$ 。

    +   - 两个内生变量: $Y$ and $e$.

    +   - 其他变量，包括 $r^*$，外生。'
  merge: -1
  img_proc: true
