  md: "# 资本账户（Capital Account）\n\n+   - 资本账户记录资本流动，或金融资产归属变化。\n\n资本账户余额 =  \n直接投资余额（direct\
    \ investment）+  \n证券投资余额（portfolio investment）+  \n其他非储备投资余额（other non-reserve）+\
    \  \n储备投资余额（reserve）"
