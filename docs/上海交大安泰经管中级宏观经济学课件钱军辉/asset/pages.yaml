- pgno: 17
  md: "# 宏观变量和宏观模型\n\n+   - 宏观变量（GDP、失业率、通胀率、利率、汇率等）是经济的测度。  \n+     - 通过观察宏观变量，我们能较为客观地了解经济。\
    \  \n+   - 宏观模型刻画一组变量之间的因果关系。  \n+     - 通过对宏观经济进行建模分析，我们能逐步理解经济。"
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 内生变量和外生变量


    +   - 经济学模型一般既包含内生变量，也包含外生变量。

    +     - 内生变量（Endogenous variable），也被称为“因变量”（Dependent variable）：变量的值取决于模型的解。

    +     - 外生变量（Exogenous variable），也被称为自变量（Independent variable）：变量的值是给定的。

    +   - 基于模型的经济解释：将模型内生变量的变化和外生变量的变化联系起来。'
  merge: -1
  img_proc: true
