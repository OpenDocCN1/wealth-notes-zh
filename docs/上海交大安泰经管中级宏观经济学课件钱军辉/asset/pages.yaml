- pgno: 255
  md: '# 索罗模型 II


    +   - 第一个索罗模型无法解释人均收入和产出的持续增长。

    +   - 第二个索罗模型引入**技术进步**，用以解释**持续增长**。

    +   - 我们假设：

    +     - 封闭经济（$X=0$），最小政府（$G=0$）。

    +     - 劳动增强的生产函数，$Y_t=F(K_t,A_tL_t)$，其中

    +       - $F$ 规模效益不变

    +       - $A_t=A_0e^{gt}$ 为技术水平，增长速度为常数 $g$。

    +       - $L_t=L_0e^{nt}$ 为人口，增长速度为常数 $n$。

    +     - 储蓄率为常数，$S=sY$。

    +     - 资本折旧率为 $δ$。'
  merge: -1
  img_proc: true
- pgno: 256
  md: '# 有效个体生产函数


    +   • 让 $y = \frac{Y}{AL}$, $k = \frac{K}{AL}$。$y$ 是有效人均产出（output per effective
    worker） $k$ 是有效人均资本存量。我们有

    +   $$y = \frac{\hat{Y}}{AL} = \frac{F(K, AL)}{AL} = F(k, 1).$$

    +   定义 $f(k) \equiv F(k, 1)$，上式重写为

    +   $$y = f(k).$$


    +   • 我们称 $f(k)$ 为有效个体生产函数（*effective individual production function*）。我们假设：

    +   $$f(0) = 0,\ f''(k) > 0,\ f''''(k) < 0.$$

    +   以及

    +   $$\lim_{k \to 0} f''(k) = \infty,\ \lim_{k \to \infty} f''(k) = 0$$'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# 资本积累


    +   - 我们假设：

    +     \dot{K}_t = sF(K_t, A_t L_t) - \delta K_t

    +     \dot{L}_t = n L_t

    +     \dot{A}_t = g A_t


    +   - 于是 $k_t$ 的变化如此刻画：

    +     \dot{k}_t \equiv \frac{d}{dt}\left(\frac{K_t}{A_t L_t}\right) = \frac{\dot{K}_t}{A_t
    L_t} - \frac{K_t \dot{L}_t}{A_t L_t^2} - \frac{K_t \dot{A}_t}{L_t A_t^2}

    +     = s f(k_t) - (\delta + n + g) k_t.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 稳态


    +   - 我们定义问题为有效人均资本不变的状态，即 $k_t = k^*$，

    +     $$sf(k^*)-(\delta+n+g)k^*=0.$$


    +   - 在稳态，

    +     $$\frac{K_t}{A_tL_t}=k^*.$$


    意味着：


    +   - 总产出 $Y_t=A_tL_tf(k^*)$，增长速度为 $n+g$。

    +   - 人均产出 $\frac{Y_t}{L_t}=A_tf(k^*)$，增长速度为 $g$。


    +   - 于是索罗模型 II 可以解释人均收入的持续增长。'
  merge: -1
  img_proc: true
- pgno: 259
  md: '# 练习


    +   - 增加储蓄率对稳态产出有何影响？

    +   - 有效人均资本的黄金律水平在哪里？'
  merge: -1
