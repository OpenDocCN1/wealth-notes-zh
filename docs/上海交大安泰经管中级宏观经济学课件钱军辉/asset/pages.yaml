- pgno: 83
  md: '# GDP平减因子与CPI


    +   - GDP平减因子的篮子等同于GDP篮子，GDP篮子包含所有**产出**的商品和服务。而CPI只包含居民**消费**的商品和服务。

    +     - 公司和政府购买的商品和服务价格反映在GDP平减因子中，不在CPI中。

    +   - GDP篮子中只包含**国内**产出的商品和服务，而CPI篮子中包含进口消费品。

    +   - GDP篮子权重随时间变化，而CPI篮子权重在短期固定（等于基期居民消费支出结构）。'
