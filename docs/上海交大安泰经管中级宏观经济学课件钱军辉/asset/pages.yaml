  md: '# 收入分配


    +   - 在我们的假设下，总产出固定，因此总收入也固定。我们用一个代表性公司（Representative firm）模型来理解收入分配。

    +     - 想象供给侧由很多具有相同生产函数的公司组成，它们生产同一样产品（叫它“Y”），面临相同的要素价格（工资（W），资本租金(R)）和商品价格（P）。

    +       - Y：实际GDP

    +       - P：价格水平'
