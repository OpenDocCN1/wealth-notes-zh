  md: '# 货币政策规则


    +   - 货币政策规则（monetary policy rule）刻画了央行如何应对经济基本面变化。

    +   - 中介目标变量和货币政策目标（通胀、经济增长等）之间的经验关系。

    +   - 如果该关系比较稳定，可能成为央行货币政策的参考。'
  merge: -1
  img_proc: true
- pgno: 497
  md: '# 泰勒规则


    +   - 泰勒规则（Taylor Rule）如下：

    +     federal fund rate = inflation + 2

    +     +0.5(inflation − 2) + 0.5(GDP gap)

    +   - 泰勒原则：名义利率上升速度应该快于通胀率。'
  merge: -1
  img_proc: true
