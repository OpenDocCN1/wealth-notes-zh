- pgno: 147
  md: '# 名义和实际利率


    +   - 名义利率（Nominal interest rate）是可以直接观察到的，用 $i$ 表示。

    +   - 实际利率（Real interest rate）不可观察，但可以估计，用 $r$ 表示。实际利率又有两种：

    +     - 事后实际利率（ex post real interest rate）

    +       $r = i - \pi,$

    +       其中 $\pi$ 表示通胀率。

    +     - 事前实际利率（ex ante real interest rate）

    +       $r = i - E\pi,$

    +       其中 $E\pi$ 表示通胀预期。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 费雪方程


    +   - 从事后实际利率定义可以得到费雪方程（Fisher equation）：

    +     $i = r + \pi.$

    +   - 从事前实际利率定义得到另一个版本的费雪方程：

    +     $i = r + E\pi.$'
  merge: -1
  img_proc: true
