- pgno: 451
  md: '# 凯恩斯的总需求曲线


    +   - 凯恩斯用如下总需求函数刻画需求侧，

    +     $D = f(N)$，

    +     其中 $D$ 为企业预期收入（总需求价格）， $N$ 为劳动力数量。

    +     - 因为微观产品各不相同，所以产生宏观加总（aggregation）困难。

    +     - 如何对微观需求进行加总？凯恩斯用就业$N$替代产量，用收入$D$替代价格。

    +     - 每个企业都考虑其产品需求，进而决定产量和雇佣人数：给定预期收入$D_i$，选择雇佣$N_i$人。

    +     - 因此在宏观上，给定预期收入$D = \sum_i D_i$，需求的劳动力为$N = \sum_i N_i$。'
  merge: -1
  img_proc: true
- pgno: 452
  md: '# # 总需求曲线


    +   - 总需求函数是增函数

    +     - 预期收入（价格水平）越高，需要匹配的产能（劳动力）越高。


    ![](img/0703ffa5d8e4463f582a035dab90975a_452_0.png)'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# 凯恩斯的总供给函数


    +   - 凯恩斯提出如下总供给函数

    +     $Z = \phi(N)$,

    +     其中 $Z$ 为雇佣 $N$ 人所对应的总供给价格（aggregate supply price）。

    +     - 给定就业 $N$，总供给价格是支持该就业水平的最低预期收入。

    +     - 决定产量和雇佣人数前，每个企业考虑生产成本：给定雇佣人数 $N_i$，要求收入至少达到 $Z_i$，否则就要裁员。

    +     - 加总后，$N = \sum_i N_i$ 所对应的最低预期收入为 $Z = \sum_i Z_i$。'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# 总供给曲线


    +   - 总供给函数也向上倾斜：

    +     为支持更多就业，总供给价格要上升。

    +     - 总供给价格高于要素成本（包括工资），我们可以假设

    +       $Z = W \cdot N + R,$

    +       其中 $W$ 为平均工资，$W \cdot N$ 为劳动力总成本，$R$ 为其他要素成本和经济利润（假设不变）。


    ![](img/0703ffa5d8e4463f582a035dab90975a_454_0.png)'
  merge: -1
  img_proc: true
- pgno: 455
  md: '# 凯恩斯的AD-AS模型


    +   - AS 曲线比 AD 曲线更陡。

    +   - 当 N 较低，AS 曲线低于 AD 曲线。

    +   - 因此 AD 和 AS 曲线有交点，即存在均衡。

    +   - 当 AD 曲线下移，AS 曲线不变（因为工资等原因），均衡就业下降。


