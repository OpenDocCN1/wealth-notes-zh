- pgno: 494
  md: '# 非常规货币政策


    +   - 2008年金融危机爆发后，欧美央行开始了“非常规货币政策”（unconventional monetary policy）。

    +   - 主要特点：央行保证充足储备（ample supply of reserves）。

    +   - 在充足储备前提下，利率走廊实质上变成利率底部（floor system）。

    +   - 公开市场操作的作用下降，准备金利率作用上升。'
  merge: -1
  img_proc: true
