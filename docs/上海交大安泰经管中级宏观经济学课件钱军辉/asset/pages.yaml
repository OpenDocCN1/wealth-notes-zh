- pgno: 9
  md: '# 市场经济


    +   - 市场经济依赖市场解决生产和分配问题。

    +     - 当某些商品需求上升，消费者抬高商品价格，诱导厂商生产更多。

    +     - 为生产更多供不应求的商品，厂商抬高了生产要素价格（如劳动力工资），于是诱导要素所有者供应更多要素投入。根据要素价格，厂商尽量多用廉价要素，实现成本最小化。

    +     - 工人因为贡献劳动力得到工资，资本所有人因为贡献资本获得资本回报，公司股东得到剩余利润。所有人都是商品和服务的消费者。'
  merge: -1
  img_proc: true
