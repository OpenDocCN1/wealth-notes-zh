- pgno: 125
  md: '# 一个自然失业率模型


    +   - 让 $L$ 表示劳动力总人数，$E$ 就业人数，$U$ 失业人数。我们知道 $L=E+U$，以及 $U/L$ 为失业率。

    +   - 让 $s$ 表示离职率，即，在一段时间内（一个月）离职的人数为 $sE$。

    +   - 让 $f$ 表示入职率，即，在该时间段找到工作的人数为 $fU$。

    +   - 假设劳动力市场处于稳态（steady state）：

    +     $$sE=fU.$$'
  merge: -1
  img_proc: true
- pgno: 126
  md: "# 自然失业率\n\n+   - 从稳态条件我们得到\n+     $$\\frac{fU}{L} = \\frac{s(L - U)}{L}.$$\
    \ \n+   - 所以\n+     $$f\\frac{U}{L} = s\\left(1 - \\frac{U}{L}\\right),$$\n\n\
    解出\n$$\\frac{U}{L} = \\frac{s}{s + f} = \\frac{1}{1 + f/s}.$$"
  merge: -1
  img_proc: true
- pgno: 127
  md: '# 含义


    +   - 该模型用两个参数刻画自然失业率，离职率和入职率。

    +   - 只要离职率大于零（意味着有人离职后没有马上找到工作），自然失业率就大于零。

    +   - 要让自然失业率降低，要么降低离职率，要么提高入职率（让失业的人更快找到新工作）。'
  merge: -1
  img_proc: true
