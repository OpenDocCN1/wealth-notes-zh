    ## 52、营养有多重？


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_224_0.png)


    There are still some folks in the "fried potatoes for breakfast" school who are
    inclined to measure nourishment by the weight of a meal.


    But fortunately for the stylists of everything from cars to clothing (as well
    as for our general health), new discoveries in nutrition are gradually correcting
    such opinions.


    Most of these discoveries are coming out of laboratories, and are gradually finding
    their way to American tables. But one of them is coming right out of the breakfast
    habits of this new trim generation that likes everything light.


    These folks are discovering Kellogg''s Rice Krispies as the cereal of nutrition
    without weight. The one that''s refreshing to the morning appetite. Light on the
    spoon, the tongue and the tummy. But high in food value— because it delivers important
    nourishment of whole grain rice.


    Rice, you may recall, has been one of man''s chief fueling grains back since the
    days when he had to stoke up to lick his


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_224_1.png)


    weight in wildcats. And its modern cereal form—Kellogg''s Rice Krispies—still
    supplies important whole grain values.


    Surprisingly enough, as well known and popular as this cereal is, it has long
    been waiting for the adult world to grow young and modern enough to appreciate
    a morning food that''s light but nourishing. Kids know it as the world''s only
    talking cereal—the one that says "Snap! Crackle! Pop!" when you pour on milk or
    cream.


    But don''t let that light-hearted manner fool you. Rice Krispies will stay right
    with you—give you vitamins, minerals, and energy generators today''s pace calls
