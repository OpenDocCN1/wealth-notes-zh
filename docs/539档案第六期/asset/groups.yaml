    # 40、塞维尔故事：对抗 42 年的气候战争，科学最终取得胜利


    # THE SAYVILLE STORY:

    SCIENCE WINS A 42-YEAR

    BATTLE AGAINST WEATHER


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_171_0.png)


    > Story of the struggle to develop a house paint that will last years longer—under
    all weather conditions in the U.S.A.!


    NEAR SAYVILLE, N. Y., is a bleak and quiet meadow. Standing in its center are
    rows and rows of painted, fence-like structures, nothing more.


    But in this quiet meadow a bitter contest has been fought—for over forty-two years.
    It has its victories and defeats. Few of them would merit a line in your local
    newspaper. Yet every homeowner who cares about maintaining his home has a stake
    in what happens in Sayville.


    The opponents in the contest are paint and the elements. The elements seem to
    be favored, for the paint on the test "fences" is scarcely 2/1000ths of an inch
    thick, while the weather goes from freezing rain and frost in winter to baking
    heat in summer. Changes in temperature and humidity are frequent—and sudden.


    But while the weather does its worst, science does its best—in this case, science
    in the service of National Lead Company, makers of "Dutch Boy" House Paint. What
    can weather do to house paint? Why does it fade, blister, chalk, peel? What about
    moisture, or dryness, or heat, or icy cold? How long can a paint job stand the
    weather? Answers to these questions must come from the "fences," where over 25,000
    "tests" are on exposure every day. As the answers come, back they go to the "Dutch
    Boy" laboratories. Soon new paints come out to be brushed on the "fences," and
    the battle begins again.


    The major victory at Sayville—the victory of greatest significance to homeowners—has
    been the development of "Dutch Boy" House Paint. All the years of testing, all


    the hours in the laboratory, have had this result: the formulation of a paint
    homeowners now call "the 5-year house paint." "Five years," remember, is what
    they say—in a country where painting a house every three or four years is common!


    Year after year, over thousands of tests, "Dutch Boy" House Paint has been brought
    to a near-perfect balance of beauty and durability. The tests show that it keeps
    its color better, resists blistering, mildew, metal staining, shows greater freedom
    from cracking and scaling, than all the other paints tested with it. Support for
    the verdict of the Sayville tests comes from homeowners themselves. They say "Dutch
    Boy" is the 5-year house paint!


    You owe it to your home, and to the money you spend to maintain it, to find out
    about "Dutch Boy" House Paint. Find the name of your "Dutch Boy" Dealer in the
    Yellow Pages of your phone book. He''ll tell you all about "Dutch Boy" House Paint—the
    paint homeowners call "the 5-year house paint." And he''ll be glad to recommend
    the color and type of "Dutch Boy" House Paint best suited for your home.'
