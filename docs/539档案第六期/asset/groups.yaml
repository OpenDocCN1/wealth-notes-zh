    艾伯特·多恩——这位著名的艺术家，从他豪华的摩天大楼工作室向外眺望，可以看到他曾经住过的贫民窟。


    艾伯特·多恩小时候住在贫民窟，酷爱画画。13 岁的时候，他不得不辍学养家。尽管他每天工作 12 个小时，但是他还是会利用业余时间，在家学习艺术。22 岁时，他靠画画，一周能挣
    500 美元。后来，他成就越来越高，成了可能是广告艺术史上最会赚钱的人。


    像多恩这样“白手起家”的故事还有很多。诺曼·罗克韦尔 15 岁辍学。史蒂夫·多哈诺斯，著名的封面艺术家，在从事艺术之前，是开卡车的。哈罗德·冯·施密特 5
    岁时成了孤儿。罗伯特·福西特 11 岁辍学。奥斯汀·布里格斯，曾经住不起带有冷水的公寓，现在住着一个超过 100 英尺长的豪华房子。


    帮助他人的计划: 10 多年前，这些人和其他 6 位同样著名的艺术家——帕克，乔恩·惠特科姆，弗雷德·路德肯斯，本·斯特尔，彼得·亥尔克，约翰·阿瑟顿——来讨论一个问题和一个计划。


    多恩指出，全国各地都需要艺术家。然而，许多人都想成为艺术家，却不知道怎么才能成为艺术家。这些人最需要的是，有一个简单的方法，能让他快速掌握著名艺术家一直使用并取得成功的商业秘密和专业技术。“为什么我们不能，”多恩说道，“研究一些方法，让顶尖艺术家来培训任何具有绘画天赋的人——不管他们住在哪里，有多少业余时间？”


    这个想法得到了大家的热烈支持。这 12 位著名艺术家从繁忙的工作中，挤出时间开始埋头策划。他们专门为学校的精品自学课程制作了超过 5000 幅画。然后，介绍了艺术的基本原理，每个人都为课程融入了自己独特的成功方式和技巧。诺曼·洛克威尔设计了一个


    简单的方法，来解释如何绘制“真正的人。”乔恩·惠特科姆展示了如何绘画漂亮的女孩。多恩则教授了如何用循序渐进的方式来绘制动画和幽默画。


    接下来，是他们的最具挑战性的问题……如何对数千英里之外的学生寄来的绘画进行指正，辅导？这些著名的艺术家测试了很多方法。最终形成了一个可能是目前为止，最个人化，最有效的批评辅导方式。


