    # 46、关于膨化谷物的童话故事


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_194_0.png)


    # A Twilight Story


    # About Puffed Wheat


    When you serve a supper dish of Puffed Wheat in milk, make this your story sometime.
    It is like a fairy tale. Each bubble of wheat is a kernel, puffed to eight times
    normal size. All its thin, airy flakiness is due to steam explosions. And each
    has been shot from guns.


    # 100 Million Explosions


    Each kernel of wheat contains, as it grows, more than 100 million food cells.
    Each food cell is hard and hollow. A trifle of moisture is in it. Each must be
    broken to digest. Other cooking methods break part of those food cells, but never
    more than half. So Prof. Anderson, a famous food expert, sought a way to break
    them all.


    Puffed Grains are made by his process. The grains are sealed in huge guns. The
    guns are revolved for sixty minutes in 550 degrees of heat. Thus the bit of moisture
    in each food cell is changed to steam. Then the guns are shot. Each food cell
    explodes. And the grains come out puffed to bubbles, as you see. This makes the
    whole grains wholly digestible. Every atom of every element is food. That''s why
    countless mothers, every morn and night, serve these grains to children.


    Puffed Wheat Except in Far West 12c

    Puffed Rice 15c

    Corn Puffs—Bubbles of Corn Hearts—15c


    You find these fascinating dainties. You call them food confections. With sugar
    and cream or mixed with fruit they seem like breakfast buns. Boys eat them like
    peanuts when at play. Girls use them in candy-making. But they are, above all,
    perfect grain foods. In no other form have cereal foods ever been so fitted to
    feed. The better you know them the more you will serve them. Keep all three on
    hand.


