    safety. It''s your windshield which is made of a tough, transparent sheet of plastic
    that bonds two pieces of glass together. It''s the only kind of safety glass that
    passes the American Standards Association specifications for American car windshields.
    This plastic-glass sandwich is Laminated Safety Glass, and today most cars have
    LSG also in side windows.

    The plastic interlayer in Laminated Safety Glass reduces the hazard of flying
    glass. A rock striking this "sandwich" may crack the glass, but the plastic layer
    holds the glass in a tight grip to keep it from breaking into dangerous fragments.

    LSG won''t "trap" you! Because of its unique ability to "give", you can quickly
    kick or knock LSG out of a window frame in case doors and windows are jammed shut.


