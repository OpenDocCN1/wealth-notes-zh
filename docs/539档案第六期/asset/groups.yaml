    你找到这些迷人的美味。把它们称为糖果食品。把它们和糖，奶油，水果混合起来，就能给孩子提供一顿美味糖果早餐。男孩喜欢把它们当作坚果一样的零食吃。女孩子们则把它们当作糖果。


