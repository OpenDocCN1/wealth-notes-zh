    # 1、500 美元一天，撰稿人的乌托邦


    # 500 美元一天，撰稿人的乌托邦


    我发现了一个销售我一直以来赠送的东西的方法！市场非常巨大，我要把这个方法分享给你！


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_11_0.png)


    杰瑞·布坎南 美国塔俱乐部董事长

    撰稿人的乌托邦方法创始人


    不，这和出卖灵魂无关，但却能给你带来巨大回报……而且，非常有趣！请阅读下面的文字，我将告诉你如何销售你已有的大量产品，而且你卖的越多，你得到的就越多。


    懒人不可能拥有财富，然而，尽管我经常被称为懒惰的人，我却找到了一种致富方法！


    18 年来，我一直做教育类销售员，收取佣金。刚开始我和函授学校合作，后来又和大型商业大学合作。所有和我合作过的人，都认为我是他们有史以来聘用过的最有效的销售人员，但最终都解雇了我。


    因为我不能创造出我应创造的销量。我的解释，永远无法让他们满意，我说我喜欢面对面销售，但是我讨厌穿着西装，皮鞋，系着领带站在大街上去销售。我甚至讨厌每天去市中心挨着一个个的办公室去销售！


    他们说需求是发明之母。在辞去最后一份收取佣金的销售工作后，我告诉自己，永远也不再做穿着西装，系着领带，拿着公文包去让别人致富，自己收取佣金的工作了。


    所以，我申请了国家失业补贴，回头审视我的处境。我用了足够长的时间，来策划一个在我脑海里盘旋了很多年的一个想法。方案开始实施后，我几乎只通过销售文字赚了很多钱——我再也不用出去工作了！这就是现在人们说的撰稿人的乌托邦的开始。


    今天，我比之前上班时的工作时间更长了，但是我很享受每一分钟——而且，得到了我应有的财富！（你知道吗？我是我遇到过的最好的老板。）除了星期六，我在家，穿着舒适的旧衣服，每天就能赚
    100—500 美元！


