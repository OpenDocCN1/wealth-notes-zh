    # “Send me a man who reads!”


    If your boy reads a lot, don’t worry about his becoming a bookworm. International
    Paper’s new research shows that top high school scholars are also likely to be
    leaders.


    We interviewed 100 high school seniors who had just been awarded national academic
    scholarships. In one month, 9 out of 10 read at least one book. The total number
    of books read by these boys was 400.


    Then we interviewed 100 seniors who had been accepted by various colleges, but
    had not been awarded any type of academic scholarship. In one month, only 6 out
    of 10 read at least one book. Total number of books read: 175. The conclusion
    is as clear as print:


    Men who read more achieve more.


    And they are almost twice as likely to be leaders. Of 100 scholarship winners,
    67 were officers of at least one social or athletic organization. Only 39 of the
    non-winners had a similar honor.


    The message is plain. Reading is often a mainspring to leadership. Lincoln once
    said that his best friend was the man who brought him a book—one that “I ain’t
    read.”


    Teen-agers are their own best friends. Half the books borrowed from the New York
    Public Library are borrowed by teen-agers. They spend money for books, too. The
    classics are now available in paperback form and account for a healthy share of
    the one million paperback books sold every day of the year.


    # How fast do you read?


    The average reading speed is 250 words per minute. Some people can read ten times
    that fast.


    To find out how fast you read, simply have someone time you for five minutes.
    Then, count the number of words you’ve read and divide by five. If you’re below
    average, chances are your eyes and mind wander. Concentrate harder to eliminate
    the problem of re-reading sentences, paragraphs, even pages.


