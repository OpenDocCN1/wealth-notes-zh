    ## 44、蛋白质！为什么蛋白质解决了青少年的一个问题


    ## PROTEIN! Why protein answers a problem of teen-agers


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_187_0.png)


    In this land of plenty, a surprising percentage of our teen-agers suffers from
    malnutrition. Trouble is, they''re filling up on the wrong foods, say doctors,
    dietitians and nutritionists.


    They agree that diets containing ample protein are especially important during
    the growth period. For without adequate protein, the young body doesn''t have
    what it takes to develop properly. And emotional disturbances—the sudden storms
    followed by listlessness—can often be traced to this lack.


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_187_1.png)


    How does protein work? To put it simply, the body is made up of millions of microscopic
    cells, each a tiny chemical factory manufacturing what the body needs. But before
    there can be any production, a plant must have raw materials. Proteins are these
    materials.


    When is protein needed most? At breakfast. That''s when the body has gone 12–14
    hours without food. It''s also the meal teen-agers are most likely to skip.


    Recognizing this problem, Kellogg''s worked with two leading Universities to come
    up with an answer. They found it in Special K—a new, ready-to-eat protein cereal.
    A serving with milk provides more high-quality protein than any other leading
    cereal—hot or cold.


    Now teen-agers can get a good share of their vital protein requirements when they
    need it most—at breakfast. And the kind in Special K is unusually inviting to
    eat—a fact teen-agers, especially, will appreciate.


    Kellogg''s OF BATTLE CREEK


    ## 蛋白质！为什么蛋白质解决青少年的一个问题


    在这片富饶的土地上，营养不良的青少年占的比例让人惊讶。医生，营养学家都一致认为，问题在于他们吃的食物不对。


    他们一致认为，饮食中含有足够的蛋白质对生长期间的青少年尤为重要。因为，没有足够的蛋白质，身体就会缺乏健全发育所需要的物质。情绪不稳定——忽然暴跳如雷，忽然无精打采——也是缺乏蛋白质引起的。


    蛋白质是如何发挥作用的呢？简而言之，人体由数以百万计的微小的细胞构成，每个小细胞都是一个小化工厂，生产着身体必需的物质。但是，在生产之前，工厂必须有必要的原材料。这些原材料就是蛋白质。


    身体什么时候最需要蛋白质？早餐时间。因为这时候，经过一夜，身体已经有 12 — 14 小时没有进食了。而且，早餐也是青少年最有可能跳过的一顿。


    认识到这个问题后，家乐氏联合两所知名大学开始寻找答案。最后，他们在一种 Special K 的物质——一种即食蛋白质谷物中找到答案。加入牛奶后食用——热食或冷饮，能为身体提供比其他任何谷物都多的蛋白质。


    现在，青少年在早餐中就可以获得他们身体所需的最至关重要的蛋白质。而且，这种含有 Special K 的即食蛋白质味道特别好——青少年都特别喜欢。


    巴特尔克里克 家乐氏


