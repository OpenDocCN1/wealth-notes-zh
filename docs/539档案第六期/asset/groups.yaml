    # Eyeglasses: New Status Symbol?


    New respect for insight and intelligence has created a boom in, of all things,
    eyeglasses. But they''re more than a status symbol. Read why more people than
    ever will have their eyes examined in the next 12 months.


    Item: Three years ago a glamorous young actress dumbfounded the experts when she
    refused to go on TV without her glasses. Today she is a well-known TV personality.
    Her distinguishing trademark—her glasses.


    Item: A rising New York executive has excellent vision—but always wears glasses
    in major conferences. He says they make him feel more secure, add weight to his
    opinions.


    Item: From four separate communities come reports of a "rush" on glasses by teen-age
    girls. Not all need them, but they all say glasses make them look sophisticated
    and impress their friends.


    These are three small signs out of many of perhaps the biggest boom in good vision
    since they brought out the eye-chart in 1863. The startling fact: 37,000,000 Americans
    now wear glasses.


    What''s behind the boom? A noted psychologist offers this explanation.


    "Glasses belong"


    "Intelligence and insight." he says, "are respected values in America today. Glasses
    have always been the symbol of the man who sees more, thinks clearly. Now they
    are also the symbol of the smart and sophisticated woman. They stand for intelligence
    and insight. In a word, glasses belong."


    But glasses are far more than a status symbol for most Americans. Experts judge
    that, with TV and movies, reading, artificial light and later hours, Americans
    have tripled the use of their eyes since 1980. That''s one good reason to have
    eyes examined now.


    Another, the great variety of new frames and lenses. Now you can get tri-focals,
    half-lenses, special glasses for any pursuit. (Some folks even have bowling glasses!)
    What''s more, some 200 new frame styles came out last year!


    If you wear glasses, but got them several years ago, it may pay you to see the
    new improvements.


    ## How to get an examination


    If you''ve been thinking of having your eyes examined, what better time than the
    present? Simply phone any reputable eyecare practitioner for an appointment. It
    takes no more time than a dental check, and costs little indeed.


    More and more top people in every field, actresses to athletes, are making eye
    examinations a regular habit. They get them at the same time as regular physical
    and dental checks for the family. It''s easy on the memory that way.


    ## Better Vision Institute BVI


