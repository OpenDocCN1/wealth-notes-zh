    laboratories. Here, cottons, linens, even nylons—yellowed by age or suds scum—washed
    back to pure white again without bleaching! Where whites had deep-set stains or
    dye transfers, the use of a household bleach helped the whitening action of new
    all.


    You can now wash your yellowed cottons, linens, nylons, even washable heirloom
    fabrics back to lovely white, gently, without bleaching—thanks to new all with
    AE-160.


    The first "controlled suds" detergent, all brought measured economy to an America
    accustomed to measuring washing power by billows of suds. With the development
    of automatic washers, manufacturers realized the need for a detergent without
    thick suds, one that could wash cleaner, rinse easier and take better care of
    the washer, too. Monsanto created the answer: all. Now the millions of automatic
    washer owners who have used all know that clothes wash cleaner in "controlled
    suds" because more dirt rinses out.


