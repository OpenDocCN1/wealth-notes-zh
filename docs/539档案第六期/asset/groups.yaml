    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_67_0.png)


    A revolution is taking place in bread, a part of the scientific revolution that
    is changing the world.


    When you eat a slice of bread today, you can consume a good source of complete
    protein—if you eat the right bread. Complete protein is protein equal in quality
    to the protein in eggs, meat, and milk.


    Protein is the building stuff of life. Over 70 per cent of the solid part of your
    body, excluding fat, is protein, and you must eat new protein constantly to rebuild
    and renew it. If you do not, you become tired, run down, even sick.


    A remarkable discovery now gives us a new bread that a responsible group of research
    scientists call: "A complete and good-tasting protein source."


    This discovery was developed by the Wisconsin Alumni Research Foundation in Madison,
    Wisconsin—the scientific organization which put "sunshine" vitamin D in milk.


    The discovery is V-10 Protein, a completely new protein made from natural grain
    sources. Scientists of the Foundation have found this new protein equivalent in
    nutritional value to animal protein—meat and dairy foods.


    There are "good" proteins and "poor" or incomplete proteins. Protein, chemically,
    is composed of building blocks called amino acids,


    and a good protein food must contain a vital 10 of them. Wheat does not have all
    these in proper amount and balance. This new grain mixture does.


    Nutritionists in many big companies had spent years trying to develop a palatable
    grain source of complete protein with these vital 10 amino acids. Now we have
    it.


    This new protein was named V-10 for vital 10. It was added to high protein flour
    to produce V-10 Protein Bread. Bread was chosen for its first wide use because
    bread is the one food eaten by most people at most meals.


    Nutrition scientists do not consider V-10 a "diet" or "fad" bread, but consider
    it a substantial nutritional improvement in bread.


    They are concerned about the protein deficiency of thousands of Americans—dieters
    and non-dieters. For example, if breakfast is slighted, it creates a hunger that
    makes it difficult to control the intake of food the rest of the day. Everyone
    must have complete protein. Six slices of V-10 Protein Bread will supply approximately
    25 per cent of your daily protein requirement.


    V-10 Protein Bread is near-white or gold-white—its flavor is particularly enhanced
    when toasted. For further information, write the V-10 Division, F. H. Peavey &
    Company, 760 Grain Exchange Building, Minneapolis 15, Minnesota.

