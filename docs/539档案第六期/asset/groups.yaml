    1967 年夏天，我无意中看到一位纽约内科医生的报告。他在报告中说，他曾帮助 10000 名超重的男性和女性，成功地减掉了他们想减的体重。这些人包括医生、护士、营养师、人寿保险专家、演员、棋特，和其他不论如何努力，都从未成功减肥的人。


    然而，在减肥期间，这些人可以想吃多少就吃多少——不用计算卡路里。他们可以和以前吃的一样多，甚至可以比以前吃的都多。他们从来没有挨饿。根据这个方法，在第一个
    3 天里，他们就看到了惊人的效果，下降的体重，让每个人都觉得难以置信。有些人，第一周就减掉了 25 磅。在仔细研究完这个医疗报告后，我决定试一试这位医生的方法。


