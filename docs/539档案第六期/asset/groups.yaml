    # Do you carry this much extra weight every day?


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_136_0.png)


    Suppose, for the next hour or so, you carried this 25-pound weight. You’d quickly
    realize the burden of this extra weight on your entire body.


    Many people constantly carry a similar or even greater burden—in the form of extra
    body pounds. And those surplus pounds are definitely a hazard to your health.


    For example:


    Men weighing 25 pounds above the average have an excess mortality of 20 percent,
    while a weight of 50 pounds above the average is associated with a death rate
    as much as 50 percent higher.


    After you are 30, it becomes increasingly important to control your weight—even
    to stay underweight. To do so, you must eat less and stick to your new eating
    habits. Remember, high-calorie foods are the main pound producers—fried foods,
    rich desserts, creamed dishes, gravies and dressings.


    Count your calories carefully. Follow a chart—there’s one in the Metropolitan
    Life booklet offered below—and learn how to plan low-calorie meals.


    Start your weight-control program with your doctor’s advice. He will see to it
    that your meals provide all the essential food elements needed to keep well while
    reducing—and thereafter. Don’t be misled by the claims made for “wonder” diets.


    By keeping your weight down permanently, you can increase your chances for a longer
    life—and more vitality and better looks, too.


