    # "SEND ME A MAN WHO READS!"


    # International Paper interviews the man who trains Pan Am pilots to make decisions
    at 600 m.p.h.


    Chief pilot Sam Miller tells what it takes to be an airline captain today—and
    why it helps to be a reader.


    Line squall, short runway, traffic jam—the jet simulator at left can confront
    a pilot with them all—without leaving the ground.


    This is Sam Miller’s “classroom”—an exact replica of a Boeing 707 cockpit, complete
    with 246 instruments.


    # How pilots do their homework


    They read. Miller’s men must read and learn the weather characteristics and landing
    approaches to 250 airports. They must read a set of manuals with over 800 pages,
    and keep up with constant changes.


    Says Miller: “This business is fast-moving in more ways than one. But there’s
    only one way to stay up-to-date. Read.”


    # Languages and law


    “In a single day, one of my men may land in as many as five different countries.
    To cope with all the legal, political, and technical problems takes experience
    and reading — constant, wide-ranging reading.”


    What does it take to become an airline captain? “It’s hard to generalize,” says
    Miller. “But I’ve found one thing they have in common is the ability to learn
    — through training, actual flying, and reading.”


    Sam Miller’s experience jibes with I-P’s research: Men who read more achieve more.


