    # SHOULD A CAR''S ENGINE BE IN FRONT OR IN THE REAR?


    It makes quite a difference. Driving a rear-engine car is not like driving a front-engine
    car at all. Automotive engineers have been testing many cars lately to get all
    the facts. The results of those tests are of importance to every driver in America.


    To begin with, all the rear-engine cars tested were decidedly back heavy. Such
    unbalanced design produces a dangerous driving characteristic called "oversteering,"
    which causes a car to exaggerate the effects of cross-winds and each road crowns.
    On the wide-open straightaways of our modern highways, where cars are often buffeted
    by powerful cross-winds, the rear heavy automobile is exceedingly difficult to
    control.


    On the other hand, front-engine cars like the SIMCA react in the opposite way.
    They actually tend to compensate for the slope of a road crown, and fight back
    against cross-winds. The difference in handling is due to the difference in weight
    distribution.


    And since front-engine cars are so much easier to control, it follows that they
    produce less driver fatigue than rear-heavy cars.


    Compared with SIMCA, the rear-engine imports leave much to be desired. SIMCA outweighs
    them overwhelmingly. SIMCA is longer, wider, and much more powerful. SIMCA is
