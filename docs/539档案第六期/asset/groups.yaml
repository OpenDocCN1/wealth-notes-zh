    # 49、他们画画


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_214_0.png)


    Albert Dorne—from his luxurious skyscraper studio, this famous artist can see
    the slums where he once lived.


    # They DREW


    By REX TAYLOR


    ALBERT DORNE was a kid of the slums who loved to draw. Before he was 13, he had
    to quit school to support his family. Although he worked 12 hours a day, he managed
    to study art at home in spare time. At 22 he was earning $500 a week as a commercial
    artist. He rose higher and higher to become probably the most fabulous money-maker
    in the history of advertising art. Dorne''s "rags to riches" story is not unique.
    Norman Rockwell left school at 15. Stevan Dohanos, famous cover artist, drove
    a truck before turning to art. Harold Von Schmidt was an orphan at 5. Robert Fawcett
    left school at 11. Austin Briggs, who once couldn''t afford a cold-water flat,
    now lives in a magnificent home over 100 feet long.


    A plan to help others: More than ten years ago, these men met with six other equally
    famous artists—Al Parker, Jim Wi Hulomb, Fred Ludekens, Ben Stahl, Peter Helck,
    John Atherton—to discuss a problem and a plan. Dorne pointed out that artists
    were needed all over the country. Yet thousands of men and women wanted to become
    artists, and didn''t know how. What these people needed most was a convenient
    way to master the trade secrets and professional know-how that the famous artists
    themselves had learned only by long, successful experience. "Why can''t we," asked
    Dorne, "develop some way to bring top-drawer art training to anyone with talent
