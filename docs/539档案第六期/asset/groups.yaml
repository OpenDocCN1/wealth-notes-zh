    # 送给花粉过敏者的好消息：


    如果你去年夏天住在纽约，而你花粉过敏，你做什么了？你是不是花了 300 美元去山上疗养？或者花了 500 美元，去海上航行。或者，你只能忍受不停地打喷嚏。


    如果你住在密尔沃基，你患有花粉病，你不用去山上，或海上。你只要花 1.25 美元，买个抗组胺就可以。


    抗组胺是一种神奇的新型过敏药片，为了确定它是否受欢迎，去年夏天，在中西部地区进行过市场测试。结果非常惊人：在花粉病盛行的季节，中西部所有药店的抗组胺都销售一空。


    什么是花粉病？为了理解为什么抗组胺有效，我们首先要明白什么是花粉病。它是一种因为花粉引起的过敏。（什么是花粉？花，草等的雄性生殖细胞。）有些人对花粉过敏，而有些人不会。在某种程度上，这是一种遗传症状。


    如果你对花粉过敏，花粉就会攻击你的粘膜，组胺会被释放出来，扩张毛细血管。身体组织采取应对措施，因...会出现突如其来的喷嚏、鼻塞、流泪、流鼻涕、眼睛痒等症状。此时，你就得了花粉病，严重的花粉病。


    抗组胺的效果：抗组胺会尽可能从根源上治疗所有的过敏反应。两类抗组胺共同发挥效果。血管收缩以及解充血成分，能够收缩毛细血管，收缩鼻粘膜。这种神奇的药物，还能治疗咳嗽，振奋精神，赶走困倦。该药物中还包含丰富的维生素
    C 以及钙，能加强毛细管的抵抗力。


    抗组胺的一部分好处来源于它没有的东西。和大多数感冒药片和胶囊不同的它，不含阿斯匹林，或其他止痛药的成分（有些人对这些成分过敏）。没有咖啡因。没有巴比妥酸盐或其他易上瘾的药物。对大多数人来说都没有副作用。


    你夏天感冒吗？今年夏天，数以百万计的美国人将会发现，抗组胺止住了咳嗽，打喷嚏，眼泪，流鼻涕，眼睛过敏发痒，不管是花粉、灰尘引起的，还是狗、猫的毛或你的妻子的化妆品引起的。夏季的感冒（以及冬季的感冒）往往也是过敏引起的。


    告诉你一个方法：如果经常感冒，一年感冒 3 次，甚至更多，那么你的感冒很可能就是过敏引发的。赶快服用抗组胺吧。


