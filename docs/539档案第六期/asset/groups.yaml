    you could save enough in a year to pay for the gasoline used on a 300-mile vacation
    trip!


    Startling … but true! Because all lets you measure clean, white washes by the
    spoonful! all is the condensed, super-rinse "controlled suds" detergent—specially
    developed for best results from automatic washers.


