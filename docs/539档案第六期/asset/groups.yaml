    优雅的味道：史都华虾米纽堡——新鲜龙虾在装饰有精美雪利酒的奶油酱里游泳。


    菠菜增加节日气氛——史都华菠菜舒芙蕾——嫩菠菜叶和黄油，鸡蛋的完美融合。


