    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_205_0.png)


    # 在短短 4 周内


    # 培养你做梦都想不到的超强记忆力！


    坦白地说，这是一个几乎令人难以置信的广告，内容是“有史以来，最具爆炸性的记忆课程。”


    它由哈瑞·洛拉，世界上最伟大的记忆专家创造。它——有史以来第一次——为培养普通人令人难以置信的超强记忆力而设计。具体表现如下：


    # 永远不会再忘记任何人的名字！


    首先，一旦你学完这个具有革命性的新记忆课程，你就永远不会再忘记任何一个，对你来说重要的人的名字或相貌。即使你已经 5 年……10 年……甚至 20 年没有见这个人了，但是你见到他之后，依旧可以叫出他的全名，和他打招呼。你能清楚地记得他的妻子，孩子的名字。你能清楚地记得他在公司的职位，他最大的兴趣爱好，如果你想给他留下印象，你甚至能记得他的生日。


    （让我们再重复一次：我们意识到这么超强的记忆力，对现在的你来说，肯定不可能。但是，我们还意识到，如果你用完全错误的方式，试图记住这些信息，也是不可能的。一旦你知道了正确的方式，不可能就会变得可能，变得司空见惯。现在，你可以零风险去证明它们！


    现在，让我们再说一个你能拥有的“看似不可能的”超强记忆力：


    # 读一遍，就记住整本杂志！


    你将要学习：


    拿起任意一本流行杂志，比如大概 60 页或 70 页。立刻翻阅，你只要用一个小小的技巧，就能把每一页的内容都印在你的脑海里。（当然，你不会记住每个字；但是，你对每一页的内容，将有足够的印象，能够：）


    把那本杂志递给一个朋友——让他随便指出几页，顺序由他选。然后，等着看他难以置信的惊讶表情吧，你可以立刻说出——不仅每页的正文内容，而且还能说出它旁边的广告。


    你可以一遍又一遍地应用这个技巧。但更重要的是这个简单的 “记忆相机” 的很多其他应用：在短短一周内，为你增加普通人一年才能增加的新词汇量。或者，几分钟内快速记住半小时演讲（或销售说辞）的所有内容，以便你到时准确无误地说出所有内容。或者——为你创造一个全新的世界——听过一次，就准确无误地记住多达
    10 个笑话，即使 10 年后，也不会忘记其中任何一个词语！


    # 在大脑里带一本电话簿


    这个课程将教你如何把你想记忆的任何数据转换成图形——然后，把这个数字图形永远刻在你的脑海里。


    比如，用这个简单的方法，你就能在短短 30 秒内，记住任何一个电话号码（包括区号），而且永远不会忘记（即使你脑海里已经记忆了多达 100 个电话号码）。


    或者，如果你稍微灵活应用一下，就可以把这个 “图形数据记忆法” 应用于扑克牌上，你的朋友们肯定会拒绝再和你用钱下赌注玩牌了。比如，在桥牌中，叫人任意隐藏 47
    张牌，你都能轻松立即说出任意 5 张隐藏的牌数。


    或者，你可以记住整个价目表，通过在客户办公室快速引用一系列数据，赢得一笔又一笔的订单。

