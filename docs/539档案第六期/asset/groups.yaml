    ## Cancer... like a small spreading flame... demands prompt action


    At the first sign of trouble—and cancer often causes early warning symptoms—see
    your physician right away.


    In doing so, the chances of cure are greatly increased. In fact, it is estimated
    that if all cancer patients were treated early and adequately, one half could
    be saved.


    Prompt action, then, is your most important personal safeguard against cancer.
    Fortunately, medical science offers others.


    One notable example is a simple test—the so-called "Pap Smear"—by which one common
    form of cancer in women can be detected early, or even before symptoms appear.
    If every adult woman took this test every year, the type of cancer that it reveals
    could almost be eliminated as a cause of death.


    Moreover, your physician can often detect other forms of cancer—in both men and
    women—while the disease is still localized. At this early stage, treatment by
    surgery, X-ray and other forms of radiation is much more likely to be successful.


    Since early detection is an important factor in the outcome of cancer, all adults
    should have periodic health examinations and, between checkups, watch for these
    seven warnings of cancer:


    - 1. Unusual bleeding or discharge.

    - 2. A lump or thickening in the breast or elsewhere.

    - 3. A sore that does not heal.

    - 4. Change in bowel or bladder habits.

    - 5. Hoarseness or cough.

    - 6. Indigestion or difficulty in swallowing.

    - 7. Change in a wart or mole.


    These symptoms, though often caused by some condition other than cancer, should
    never be ignored. Should any one of them last longer than two weeks, don''t neglect
    to see your physician immediately.


    For more information about this disease, write for Metropolitan''s booklet, Facts
