    # 26、贝尔先生的发明后来怎样了？


    # What’s happened

    to Mr. Bell’s

    invention?


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_116_0.png)


    Eighty years ago Alexander Graham Bell invented the telephone. His simple instrument
    which was to revolutionize personal communication had only 12 parts. The Bell
    telephone which Western Electric makes today — simple, though it appears—has nearly
    500 parts.


    But if the telephone’s parts have multiplied by forty, its convenience and usefulness
    have multiplied, too, until we talk clearly and dependably across the country
    and across the seas. Today, some telephones have controls which raise the volume
    of sound for better hearing. Some have push-buttons for switching calls. Some
    have a light over the dial, for dark places. Some let you talk without lifting
    the handset. And there are instruments which answer when you’re away and record
    messages.


    These modern conveniences are manufactured by Western Electric people, carrying
    on work begun for the Bell System back in 1882. We’ve had a big role in telephone
    progress over the years. Our main job is to translate laboratory ideas into efficient,
    economical quantity production.


    Behind the scenes in Bell central offices you can see our handiwork. Where calls
    once were switched entirely by hand, there are now rows of automatic switching
    equipment which respond when your finger twirls the dial. And even faster, better
    switching equipment is on the way.


    Today, equipment made by Western Electric permits a single pair of copper pathways
    to carry up to 1,800 conversations at once. And the towers of radio relay transmission
    systems march across the country to help speed calls and TV programs over distances.


    Where can the pursuit of better telephone communications lead?


    One intriguing forecast is this: Some day everybody will be given a telephone
    number at birth and, equipped with a push-button watch-sized instrument, will
    be able to call and to see anyone, anywhere.


    Incredible? No more so than 1956 telephone service would have appeared to people
    80 years ago. But whatever shape the future of telephone service may take, Western
    Electric—fulfilling its function as Bell System manufacturer—will engineer machines
    and processes for making what is needed... turning ideas into products skillfully
    and economically so Bell telephone service may be even more useful and convenient.


