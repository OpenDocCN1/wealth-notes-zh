    Without breakfast, mid-morning fatigue sometimes occurs along with irritability
    and difficulty in concentrating on work or studies. So a good breakfast is the
    best way to begin the day.


    What is a good breakfast? It should supply 25 to 33 percent of the vital nutrients
    needed for the day. It should include fruit, bread made from whole-grain or enriched
    flour; cereal or eggs, meat or fish; and milk either to drink or use on cereal
    or in a cooked dish.


    A breakfast planned around these foods gives "pickup power" needed after some
    12 hours of fasting, and ... helps you to avoid overeating at lunch or dinner.
    This is why overweight people need well-balanced breakfasts.


    If you or members of your family seldom feel hungry at the breakfast hour, you
    might get into a good breakfast habit if you try some of the following suggestions:


    - 1. Start the day at least 15 minutes earlier. This will allow more time for
