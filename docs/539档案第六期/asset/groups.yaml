    ## "Send me a man who reads!"


    A telephone lineman who picks up a book during his lunch hour probably won''t
    remain a lineman very long.


    The executive ranks of his company are within his reach. And every time he picks
    up a book, he''s closing the gap between where he is and where he wants to be.


    International Paper''s latest research study shows this is a well traveled path
    to success. We studied the leisure activities of 100 men who were once linemen,
    switchmen, cable splicers, or installers. All of these men are now telephone company
    executives.


    In a month, each of these men finds time to read an average of 1½ books. Add this
    to 3 magazines and

    14 newspapers a week and the implication is as clear as print:


    Men who read more achieve more.


    These men started their spare time reading long before they got to where they
    are today. And in most cases, it was a long climb. The chairman of the board of
    one company started his career with a pick and shovel.


    A book a week may not make you chairman of the board. But it will give you a head
    start in that direction. And you''ll be surprised just how much you can accomplish
    in only a month''s time.


    Next time you have a few minutes to spend, invest them. Walk over to the nearest
    bookstore or library. It may turn out to be the best walk you ever took.


