    # 47、临床研究发现，大多数超重的人都缺乏这 8 种能燃烧脂肪的营养


    # Clinical studies find that most overweight people are lacking in these 8 fat
    burning nutrients


    Tablets now available that provide all 8 fat burning nutrients


    # 临床研究发现，大多数超重的人都缺乏这 8 种能燃烧脂肪的营养


    # 现在一种能为你提供 8 种燃烧脂肪的营养元素的药片出现了


    来自：约翰·怀特黑德 媒体服务


    （坎顿，俄亥俄州）你有没有感觉到，你明明没有吃很多食物，但是体重还是莫名其妙地上升？新的研究发现，这并不是你的错觉。


    临床研究表明，很多超重的人缺乏特有的营养素来有效地燃烧脂肪。这些研究，曾被很多知名医学期刊引用，包括《美国临床营养学杂志》，《国际生物化学杂志》，《新英格兰医学杂志》，以及《当前疗法研究》和《国际肥胖杂志》。知名大公司，生物技术研究公司，也对一些人群进行了研究测试，这是其中一些研究照片。


    这些研究发现，大多数超重的人摄入的卡路里，并不比那些不超重的人多。大多数超重者都缺乏以下 8 种使身体燃烧脂肪的营养。左卡尼汀，吡啶甲酸铬，胆碱，肌醇，生物素，胰液素，甜菜碱酶，和维生素
    B6。这些营养物质只存在于某些食物中，你必须摄入足够的这类营养物质，来充分燃烧脂肪。


    进行充分研究后，生物技术研究公司制造了一种，能为你提供这 8 种燃烧脂肪的营养元素的药片。


    使脂肪转化成能量，需要经过许多化学过程和阶段（见图 1）。在很多阶段，都需要一些关键营养，作为催化剂将脂肪分解成不同的部分。这些催化剂和化学反应，包括关键营养元素胆碱，肌醇，生物素和维生素
    B6。


    脂肪分解还需要两种关键酶，胰液素和甜菜碱酶。脂肪还需要被运送到被称为脂肪燃烧室的线粒体细胞。脂肪左卡尼汀的帮助下被运输到线粒体内，转化为细胞用来维持生命运行的能量。一些其他重要营养物质，如吡啶甲酸铬，能帮助调节和产生胰岛素，胰岛素有助于控制饥饿，调节脂肪存储，帮助生成肌肉。这些营养物质，会在这个过程中被用完。缺乏它们，脂肪代谢就会减缓。如果我们均衡膳食，吃包含这些营养元素的对的食物，我们的脂肪代谢速度就会一直处于一个高水平。


    已经有大量的临床研究表明，这 8 种关键营养物质，能使人体有效地燃烧体内储存的脂肪，保持适当的体重。


    医学杂志《当前疗法研究》（51 261-274）上的一个临床研究指出，对 30 位肥胖女性和 10 位肥胖男性进行饮食测试。这些女性每天规定摄入 1200
    卡路里，男性每天摄入 1600 卡路里。这两组分别被一分为二。一组的饮食提供足够数量的卡路里，但是只包含 8 种燃烧脂肪的关键营养元素中的 2 种，吡啶甲酸铬和左卡尼汀。另一组则服用了一种含有非活性成分的药片。饮食中含有脂肪燃烧的营养成分的那组人，减重
    15 磅，而另一组减重 0 磅。


    最新研究还发现，决定体重增加或减少的，并不是每天摄入的卡路里总量，而是卡路里的食物来源。并非所有的热量都一样。某些类型的热量会 100% 快速转换，存储为脂肪，而某些类型的热量，只有
    40% 会转化成脂肪储存。当你吃不同类型的特定食物时，你也增加了脂肪的燃烧。而且，这种组合应该不断改变，这样身体就不会储存脂肪。这种组合，能最大化你的脂肪燃烧量，是提高代谢率的关键。


    生物技术研究公司，以及其他一些临床研究也都发现了这点。要想减肥，实际上大多数超重的人每天都需要增加卡路里，如前面所说，变换他们热量来源的食物类型。


    如果你过多降低你的卡路里摄入量，每天只摄入 1000 卡路里，甚至更少，你的身体就会进入生存模式。那时，它将降低你的新陈代谢，使脂肪燃烧水平降到最低。它还会开始消耗你的肌肉和减少内脏活动，来提供能量，保护脂肪。


    生物技术研究公司还发现，当研究对象被提供给包含 8 种燃烧脂肪的关键营养元素，获得正确的卡路里食物来源组合时，他们可以增加他们每天的卡路里摄入量，每天可以吃
    5 顿美味的饭菜，不用挨饿，就能成功减肥。他们减肥，也没有做大量运动，导致自己精疲力尽。事实上，每天只要做几分钟运动，不用筋疲力尽，就能刺激肌肉。所有这些元素都被融入了一种名为生物起源的药片中。


    一个 28 人研究小组（这里刊登了其中 4 人的照片），服用生物起源减肥片后，取得了很大成果，医生对其服用前后的变化给予了验证。


    这组研究对象，在短短 4 周内，减了 220 磅，围度减了 169 英寸。11 周内，共减去 416 磅，围度减去 356 英寸。仅在 4 周内，75% 的研究对象，血压下降平均
    27-50 点。其中一些人的血压下降了超过 60 点。81 - 50% 的人胆固醇水平平均下降 36-57 点，一些人下降了超过 100 点。研究小组中的一个人，糖尿病患者，血糖水平降低了
    39 点。再强调一次，这一切仅发生在 4 周内。很多人测试对象还说，生物起源减肥片，还缓解了他们的其他疼痛。


    这组测试对象中，有的人之前从来没有减肥成功过，而这次却减重很多。有些人服用生物起源减肥片，仅仅 1 周，就减了 7 磅。有些人在短短 2 周内，裤子尺寸就减小
    2 码。在仅仅 11 周内，有些人的裤子就减小了 6 码。


    生物起源减肥片由生物技术研究公司开发的。主要开发人员有弗兰克·坎帕泰利，以及大卫·德斯。


    弗兰克·坎帕泰利是认证的私人教练，营养师。他是著名的最畅销健身书和健身计划作者，你在全国各地的电视台、杂志或报纸上可能看到过他。大卫·德斯是认证的专业健美运动员，由健美运动员国际联盟（IFBB）给予认证，是著名的国际健美比赛冠军。要想参加比赛，健美运动员的体脂必须降到
    7% 以下，因此，大部分的减肥知识都起源于专业健身社团。德斯还是必须保持低体脂的好莱坞电影明星和专业模特的知名私人教练。


    生物起源减肥片，已经被写入了一个易于遵循的特别报告中，广大受众都可以使用这个方法。全国很多人都在用这个方法，并且已经第一次成功地减去了大量体重，而且没有反弹。使用生物起源减肥片的人都说，即使他们停止服用了，体重也不会像之前使用那些无效的时尚减肥方法一样反弹。


    生物起源减肥法，为你列出了为了获得燃烧脂肪的关键营养元素，你需要吃的所有食物种类和数量。生物起源减肥法，还为你提供了一些能大大提高你的新陈代谢，加快你的脂肪燃烧速率的食物热量来源组合。还包含一些简单的运动，来刺激你的肌肉，加速脂肪燃烧。


    生物起源减肥法，还包含一瓶 60 片生物减肥片药片，每片都包含 8 种燃烧脂肪的关键营养成分。这些营养元素，纯天然，绝对安全。它是一个知名维生素公司为生产生物技术研究公司生产的。


    生物起源减肥片，为生物技术研究公司独家所有，并非任何商店都可以买到。只要 39 美元，你就可以获得生物起源减肥法，但是如果你在未来 10 天内订购，作为给本报的读者的特别折扣，你就可以获得生物起源减肥法，和含有
    8 种燃烧脂肪的关键营养成分片一瓶，共 60 片，只要 29 美元。如果你对生物起源减肥法不完全满意，还享有无条件退款保证（BSP504）。


