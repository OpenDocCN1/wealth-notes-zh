    ## 23、你家的车上是否有 “安全线”？


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_104_0.png)


    ### Does your family''s car have the "Line of Safety"?


    Next time you''re in your car, examine any exposed edge of glass in a window or
    door vent. Is there a distinctive line visible in the edge of the glass? If there
    is, be very glad it''s there.


    The line you see is actually a tough, completely transparent sheet of plastic
    bonded between two pieces of glass. The window is literally a "plastic-glass sandwich."
    It is Laminated Safety Glass.


    You can''t see the edge of your windshield, but you don''t need to. Laminated
    Safety Glass is used in the windshield of every car made in the United States.
    Most cars provide Laminated Safety Glass in side and door windows as well. Here''s
    how Laminated Safety Glass helps protect you:


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_104_1.png)


    Suppose a rock was hurled against your car. If it struck your windshield—or a
    side window made of Laminated Safety Glass—the glass might break. But the tough
    plastic interlayer would tend to hold the glass in a tight grip and keep the broken
    pieces from flying apart, reducing the hazard of shattering glass. Other types
    of safety glass do not have this plastic interlayer.


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_104_2.png)


    The plastic interlayer also acts as a resilient cushion that reduces the shock
    of impact. Another advantage of this unique ability to "give" is that it allows
    Laminated Safety Glass to be knocked or kicked out of a window frame. Think what
    this could mean if you had to get in or out of your car in seconds with doors
    and windows jammed shut!


    You have Laminated Safety Glass in your windshield. Check to see if the "Line
    of Safety" is in your side windows as well.


