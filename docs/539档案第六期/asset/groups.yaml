    ## 贝尔先生的发明后来怎样了？


    80 年前，亚历山大·格雷厄姆·贝尔发明了电话。这个彻底改变了人与人之间的沟通的简单仪器只有 12 个部分。西电公司今天制造的贝尔电话——尽管看起来很简单——却有将近
    500 个部分。


    但如果电话的部件增加了 40 倍，那么它的方便性和实用性也应该成倍增长，直到我们给大陆另一端，大洋另一端的人打电话，也能听得清清楚楚。


    今天的电话，有些加入了提高音量的按钮，让听者听得更清楚。有些加入了切换通话的按钮。还有些按键带背光，这样在黑暗的地方，拨号也很方便。有些加入了免提功能，不拿话筒就可以轻松拨打电话。还有些有自动答录电话的功能。


    这些便利的现代功能，都是西电人制造的，他们不断地改进 1882 年的贝尔系统。这些年，我们的电话制造已经取得了巨大进步。我们现在的主要工作是，把实验室的想法转化为高效、经济的可批量生产产品。


    在贝尔中央办公室幕后，你可以看到我们的成就。以前电话切换全部要靠手动，而现在，当你手指转动刻度盘时，一系列自动转换设备就会做出相应的反应。甚至还有更快，更好的交换设备。


    今天，由西电公司制造的设备，一条铜线能一次承担 1800 个通话。无线电中继传输系统能加速全国电视和通话信号传输。


    那么，更好的电话通讯能发展到什么程度呢？


    一个有趣的预测是这样的：有一天，每个人出生时就会有一个电话号码，并佩戴一个手表大小带有按钮的仪器，可以在任何地方给任何人打电话。


    人们也觉得不可思议。可是，不管未来的电话形状如何改变，西电公司——作为贝尔系统制造商都会不断完善它的功能——会不断根据需求完善机器和系统——把想法巧妙，经济地变成产品，让贝尔电话服务变得更实用和更方便。


    西电公司


    贝尔系统的制造和供应商


    ## 作业


    ## 27、灰衣女士

    ### Gray Lady


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_120_0.png)


    IT''S not too easy to be a gloom-chaser after a full day''s work at a regular
    job. Yet it''s something Elaine Gereg of our Allentown, Pa. plant has been doing
    for a long time as a Gray Lady of the American Red Cross.


    Week after week, as a member of this volunteer group, Elaine visits the Allentown
    hospital... a part-time mother in the children''s ward, friend to the friendless,
    comforter to the disconsolate... dispelling loneliness or homesickness wherever
    she goes.


    Her reward? A child''s laughter... a light in the eyes of the patients. And the
    feeling she gets of having contributed to the community in which she lives and
    works.


    Volunteer community work like Elaine''s is typical of many of Western Electric''s
    120,000 people in our factories, distribution and installation centers across
    the country.


    Take Ralph Lawson of our Los Angeles distribution center. He''s been active in
    Boy Scouting for over 17 years, has received one of the highest honors — the Order
    of Merit.


    Or Al Berry of our Chicago factory who for years has served as a member of the
    Board of Education as well as being a board member of the YMCA in his home town
    of Naperville, Ill.


    Or Helen Sullivan of New York who helps conduct a recreational program for the
    Institute for the Crippled and Disabled, and assists students there in editing
    a newspaper.


    So many give of themselves unselfishly: Art Urton, of our Denver installation
    group, is active in the community life of Arvada, Colo., where he serves as a
    city councilman and member of the Chamber of Commerce; or Chet Phillips of Baltimore
    who last year headed up Maryland''s drive for funds to fight muscular dystrophy.


    There are hundreds — yes, thousands — of our employees who join earnestly in volunteer
    work for the betterment of their communities... community chest workers, volunteer
    firemen... all willingly offering their time and talents.


    Frankly, we''re delighted when we hear about Western Electric people taking a
    voluntary part in their communities'' affairs. And appreciative, too. We like
    to feel that one reason we do a good job as the manufacturing and supply unit
    of the Bell System is that we''ve been fortunate enough to attract people like
    these to work for us.


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_120_1.png)


    ## 灰衣女士


    在做完一整天的例行工作后，还要精神抖擞，为他人缓解忧郁，并不是一件容易的事情。然而，我们宾夕法尼亚州阿伦敦工厂的伊莱恩·杰雷格，作为美国红十字会的灰衣女士，却已经坚持做这件事情很久了。


    日复一日，作为红十字会的志愿者，伊莱恩每周都会去阿伦敦医院……兼职照顾儿童病房的孩子，陪伴没有朋友的病人，宽慰孤独的人……不管她到哪里，都能为人赶走孤独，缓解思乡之苦。


    她得到的回报是什么？孩子的笑……病人开心的眼神，以及她为自己生活和工作的社区做出贡献的成就感。


    像伊莱恩这样的社区志愿者，在我们西电气公司全国各地的工厂，配送中心以及安装中心 120000 名员工当中有很多。


    比如，洛杉矶配送中心的拉尔夫·劳森，17 年来，他一直是童子军的活跃分子，获得了最高荣誉———功勋章。


    或是芝加哥工厂的阿尔·贝里，多年来一直担任他的家乡伊利诺伊州，内珀维尔市基督教青年会的董事会成员，同时也是教育委员会的成员。


    或是纽约的海伦·沙利文，她帮助残疾人研究所策划各种娱乐项目，帮助那里的学生编辑报纸。


    许许多多的人，都在无私地奉献着：丹佛安装集团的阿特·奥顿，活跃在科罗拉多州阿瓦达的社区生活中，在那里他担任着市议会议员和商会的成员；或去年为了筹到对抗肌肉萎缩症的资金，去马里兰的切特·菲利普斯。


    我们的员工里数百人，乃至数千人，都加入了建设更美社区，社区核心工作团队，以及消防队等的志愿者队伍……所有人都自愿奉献着他们的时间和才能。


    坦率地说，当听到我们西电公司的人自愿参与社区的事务时，我们很自豪，也很感激。我们愿意相信，我们认真做好贝尔系统的制造和供应，其中一个原因就是为了吸引这样的人来为我们工作。


    西电公司


    贝尔系统的制造和供应商


