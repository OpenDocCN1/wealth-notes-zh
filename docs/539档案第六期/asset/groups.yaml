    Of course, you won''t out-super Superman, or even run faster for the bus just
    because you''ve breakfasted on a bowlful of Kellogg''s Rice Krispies. But you
    will realize you''ve eaten well. And you''ll know you''ve given your body a food
    that''s light in everything but nutrition. Isn''t that the way you like to start
    your mornings?


    # 营养有多重？


    这里有一种早餐食物，重量很轻，营养却很丰富


    现在还有一些习惯了“早餐吃煎土豆”的人，喜欢用谷物的重量，来衡量营养的多少。


    但幸运的是，为了追求身材完美的人，从汽车界到服装界（也为了我们的健康）的新发现，逐渐纠正了人们对营养的观念。


    这些发现大多出自实验室，并逐渐登上了美国人的餐桌。但是，其中一个发现，却出自美国喜欢一切轻事物的一代人的早餐习惯。


    这些人发现，家乐氏爆米香是一种很有营养，却几乎没有重量的食物。一种可以唤起早晨食欲的食物。小小的一勺，不腻口，吃完不会觉得胃里沉重。但是，却含有很高的营养价值——因为它能提供全谷物大米的重要营养物质。


    你可能记得，过去的日子里，大米一直是为人体供能的主要食物之一，但是，要想满足身体所需，却必须饱餐一顿。如今，它的新形式--家乐氏爆米香--仍然能够提供重要的全谷物营养价值。


    令人惊讶的是，这种谷物虽然众所周知。但是，大部分成年人，还需要以年轻的心态，紧跟时尚，才能接受这种轻，却很营养的食物。孩子们知道它是世界上唯一一种会说话的谷物——一种当你倒入牛奶或奶油后，会说：“嗞啦！啪啦！砰！”


    但不要让它轻巧的外表欺骗你。爆米香会一直呵护你——给你提供丰富的维生素、矿物质和如今较快的生活节奏所需要的能量。


    当然，你不会仅仅因为早餐吃了一碗家乐氏爆米香，就比超人还厉害，比公交车跑的还快。但是，你意识到，你已经吃好了。你会知道你给身体提供了轻巧，但却很营养的食物。这难道不是你想开始新的一天的方式吗？


    ## 53、茶叶酷刑室——揭示的重大秘密！


    ![](img/8cffddf1c8314e0aa1e8e826db1d033a_227_0.png)


    # Torture Chamber for Tea


    — and the wonderful secret it revealed!


    There''s quite a story behind the strange looking contrivance you see above—a
    story with a very happy ending for everyone who loves good tea.


    Most people don''t know that tea contains a natural essence which gives it its
    wonderful flavor and fragrance... and that this essence is adversely affected
    by high heat and humidity. Now, even the fastest-selling teas may take considerable
    time to go from packing plant to the consumer''s home, and during this time there
    has been no way of controlling the conditions of heat and humidity under which
    it will be stored or displayed.


    As a result, the tea you previously bought—whatever the brand—was often not at
    its best in taste and aroma because it was no longer fresh! The answer to this
    problem of freshness, therefore, was to package tea in a material which would
    effectively defy heat and humidity for long periods. We finally decided to use
    aluminum foil... but first we tried an experiment.


    Our research laboratory devised the box pictured above. Inside it we can create
    and control any degree of heat and humidity. With it we can subject tea, in just
    seven days, to all the conditions of heat and humidity to which an average package
    of tea will be exposed in any part of the country for many months.


    We placed packages of foil-wrapped Tender Leaf and packages of other teas —not
    protected by aluminum foil—in this "torture chamber" for a full week. Then we
    had tea experts taste the tea from each package. Without exception they chose
    foil-wrapped Tender Leaf Tea for its distinctly richer flavor, finer fragrance,
    brighter color! These results were later confirmed by regular tea drinkers in
    all parts of the country.


    Now you too can discover how good really fresh tea is. Just make your next glass
    of iced tea with Tender Leaf Brand. You''ll see what an amazing difference freshness
    makes in tea—what a wonderful lift Tender Leaf Tea gives you!


