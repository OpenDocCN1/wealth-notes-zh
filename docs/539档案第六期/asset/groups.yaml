    ## 33、过度饮酒


    ## Some things you should know about


    ## Excessive Drinking


    Most Americans either leave alcohol alone entirely—or drink moderately and sensibly.
    Unfortunately, however, there are 5 million men and women in our country who cannot
    control their drinking—and most of them break down socially, emotionally and physically.
    Alcoholism is among our most important health problems. These questions and answers
    may give you a better understanding of it.


    ## Why do people become alcoholics?


    The precise cause or causes of alcoholism are as yet unknown. Emotional difficulties—tension,
    worry, guilt, and other dreadful feelings—are certainly connected with alcoholism.
    The alcoholic drinks to escape his inner conflicts. And he becomes so dependent
    on alcohol that he cannot face life without it.


    ## What are the warning signs of alcoholism?


    When a person starts "guilting" alcohol to "fortify" himself, drinking alone or
    in the morning, giving strange excuses for his behavior, having trouble on the
    job or at home... addiction to alcohol may be in the offing.


    ## Can an alcoholic recover?


    Recovery depends on the alcoholic''s own fundamental desire to stop drinking—and,
    having stopped, never to drink alcohol in any form again. Medical treatment is
    important in furthering recovery. New drugs help ease the alcoholic''s discomfort.
    Psychotherapy helps him recognize his problems and deal with them without alcohol.


    ## What should you do to help an alcoholic?


    Face the problem without embarrassment. The family—especially those members closest
    to the alcoholic—should seek help from someone who knows how to handle the problem.
    The family doctor, or a clergyman, or a social worker, or a friend may be able
    to advise you about the best course to take.

    Alcoholics Anonymous helps many people conquer their compulsion to drink. The
    only requirement for Alcoholics Anonymous membership is an honest desire to give
    up liquor. There are no dues or fees for its services.

    When given the help they need, many alcoholics can recover and make a fresh start.


    ## Help for the Alcoholic and His Family


    If Alcoholics Anonymous is not listed in your telephone directory write to: Alcoholics
    Anonymous, P. O. Box 459, Grand Central Annex, New York 17, New York.


    Metropolitan''s new booklet—Alcoholism, A Guide for the Family—summarizes this
    problem and offers helpful suggestions for its solution.


