- pgno: 20
  md: '考虑尽可能不让得贡方形成更大的牌力，即组成同花顺。


    为了达成这个意向，应选择将本家有较多相邻同花的那个最大牌贡出去。如果没有这样的牌形，可以将“相邻”的范围扩大到“近邻”去考察，这样得贡方形成同花的几率就会大大降低。


    一般来说，进贡方是处于劣势地位的，但事实并非完全如此。如果你觉得诧异，看下统计数据就明白了。


    我们将回贡后的情形分成四档，第一谓之“成火”，指进贡方得到回贡后组成炸弹或加强了火的威力；第二谓之“补缺”，指回贡弥补了进贡方的缺牌，主要包括组成三连和顺子；第三谓之“一般”，指回贡仅能成对或三张；第四谓之“多余”，即回贡成单或在顺牌中间多出一张。掼蛋实战中，回贡成火的比率为惊人的
    50%，补缺占 6.3%，一般占 40.6%，多余仅占 3.1%。所以，得贡方未必就是得利者，如果回贡失当，受益的往往是进贡方，这种现象有人称它为“反先”。


    为了抑制进贡方“反先”，回贡方应当避免回牌让对方成火或补缺。如何做到呢？


    首先是将组顺后的多余牌回去。按照比率，除王牌外，其余牌张各家得率均为四分之一，即 2 张，组顺后余出的牌张成火率较低。第二个方法是“拆手”，即将较小的对牌或三张拆开回贡，这样做得贡方难以成火，虽有补缺的可能，但补缺的概率毕竟很低；即使补了缺，总比让对方成火好。第三是控制回牌的花色，这和上文所说的进贡方控制得贡方的方法类似。第四，在回牌花色难以判断的情况下，首选回红心，这主要是为了照应配牌。只要回牌的大小与配牌相邻或相近，得贡方自行组成同花的可能性很小。


    千万不要忘了，以上的进贡、回贡控制方法是针对对方的，如果进贡、回贡给对门，就要完全换位思考了，具体做法基本上就是上述方法的反面。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# （三） 上家控制技术


    一般来说自己是上家控制的对象，老攢们都会说：上家打我，活该；我打上家，不该。从牌理和位次关系看，老攢手的经验之谈确有道理。


    在我们的局牌中，平均每家要打 9.6 手牌，垫手多达 33.6%，而通过上家直接垫出的又占了其中的一半多，可见上家出牌对你有多大的意义。


    “轻易不接对门牌”是攢蛋界公认的，因为每个主打牌的人都会有自己的战术意图，总希望牌局向自己预期的方向发展，所以，作为对门方，若非十万火急或十分有把握控制局势，你不要去接对门的出牌，同时，拦截对门是对手的责任，而非对门的义务。


    当然，垫牌不在此限。这个招法强调“慎”接，若同时具有极大极小的同类牌则可以接转。


    那我们对上家走牌有什么原则要求吗？非常遗憾，这个环节没有定式，有的只是大概的经验和感受。


    首先要预判上家可能走的牌型，如果能为你带牌的，放任通行，甚至可以暗中帮他的“忙”，诱使其打出你能垫上的牌型。如果上家所出牌型与你根本不对路，应立即封杀。


    第二，如果上家传牌，要即时予以阻止，即便你有需要垫的牌。因为这个时候不是垫牌的时候，如果你贪图便宜去垫，你是垫上了，但下家也走完了。


    第三，对上家的冲刺牌，除非你对对门有绝对的把握，否则应在自己的位次上拦截上家。有的时候，明知对门可以接住或拦死这样的冲刺，但你也要算笔帐，算什么呢？因为拦住冲刺是目的，所以只要拦住就可以了，这时要算的是以最小的付出拦牌。


    在这里不得不再次提醒攢友，一定要以小的付出来达到目的，否则会有极其遗憾的结果发生。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '上家控制战术有几个基本公认的招法有必要在这儿详细解读一下，当然这些招法未必都是针对上家的，但它们首先是从上家开始的，所以就在这儿读取它。


    第一个来介绍攒名气最大的招法“牌不打四”，这个招法的牌理根据很简单：如果是火，你打了也白打；如果不是火，你不打他也走不掉。


    4 张嘛，只存在上述两种方式，所以你不 去管它。但在这里要探讨的不是“牌不打四”的本身，而是它的反方向——“牌可打四”。


    不是说不打“四”吗，怎么又打起它了呢？首先告诉大家一个秘密，在实战牌局中有超过 20.8% 的“四”被打了。那么，“牌不打四”的例外有哪些呢？


    ① 你当前已经处于“空保火”状态，你空保的“火”大于对方的冲 刺“火”，此时不走，更待何时！


    ② 你已经处于连续冲刺状态，你的上家阻止你，你的冲刺“火”比上家阻击的火大，且你的余手是死牌，一般情况下可以考虑打“四”。因为“开弓没有回头箭”，即使你停顿，也无垫牌或偷机的可能，犹如让对方上手，还不如勇往直前来个比拼。


    即使对方可以压制你的冲刺，但剧烈的实力消耗，一定会让你的对门得利。


    当然，如果你的余手不是死牌，而是较大的类牌，且场上形势表明出现此类牌的可能性很大，这时就要谨慎行事了，是否继续冲刺就得结合现场牌势。


    ③ 你的下家主打后已经呈净火状态，你的对门主动压制并呈现冲刺状态，这种情况表明你的对门握有大火，此时上家强行下火阻拦，你应当尽力打上家的余“四”，且不论上家手中
    4 张余牌是什么货色。这种“打四”唯一的理由 是下家手中的净火可能大于上家打出的火。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '④对手余“四”可能是两类牌，“1+3”或“2+2”，如果让对方打掉一手后，你或你的对门将无法继续阻拦对手另一方的递牌，或只能阻拦一手，而对手另一方的递牌能力可能超过一次，此时应当打“四”。


    上述情形是实战中比较常见的格局，应当重视。


    如果你觉得对手余“四”是3手或以上的牌形，即2单1对或4张单，那就别去理它。当然这种情形很少见。


    现在来介绍本段的第二个招法，它叫“打九不打十”，或叫“打七不打八”，为什么呢？因为9张是两手牌的可能性非常大，且大多是5张牌型+4头火，比如顺子、三带对和4头火，如果你不打他就“空保火”了，虽然4头火火力不强，但走牌势在必然；也正因为4头火冲牌无力，所以打9才具有现实意义。


    10张就不同了，5+5的组合表明火牌较大或很大，即使5头火也是具有一定冲牌保障的，更别说火力强大的同花了。


    但凡事都要具体对待，我们的定式和招法都不能超越牌形，实际牌形决定你对它们的态度，不可一概而论。


    如果实战中你能令上家受制，甚至蒙羞，那要大大的恭喜你，这是一个了不起的成绩，因为你在被限制的位次上成功地实施了反限制，并且做得如此出色。


    # （四）下家控制技术


    这是你的本职。其实不用解释，任何牌类游戏都是这么个理，只是掼蛋的下家控制方式与其它牌类游戏相比，具有自己独特的风格而已。


    麻将对下家的控制主要是防吃牌，这是基于它的排列和组合的规则，而掼蛋不同，它对下家的的防守主要是防垫牌。


    这也是一个矛盾的所在，如果严防下家垫牌，自己的垫牌也会受到影响，怎样寻得其中的平衡，确是一件需要好好算计的事情。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '掐指数来，控制下家大致也就几种情形，我们不妨分别研究一下，看看怎样做更切合实际。


    # ## 1、对垫牌的控制


    防止下家垫牌，就如我们平时防火防盗一样，时时要得弦绷紧，但也不要神经过敏，首先还得看看手中起成的牌形。


    如果你的牌形较好，具备向头游冲剌的实力，那你得注意了，当垫的牌你赶紧垫，暂时放过下家。即使下家有些过分，甚至有“挑逗”或“挑衅”你的行为，虽然是“必打”之牌，你也不妨放过去，让对门明白你的意图。当你形成“必上”的趋势时，再把控制恢复到常态。


    当你的牌形较差时，你应该彻底放弃垫牌的念头，一门子心思玩控制，阻断下家的垫牌之路。从常理讲，当你的牌形较差时，就是对方的牌形较好时，因为此时你不具备取胜的条件，所以你只能自我“牺牲”。


    彻底放弃胜机去阻断下家，要有铁的意念。有时面对诱惑，你的意志会突然不坚定，那么危险就埋下了，相关的的例子太多了。所以，如果防守，就做彻底的阻击手。


    # ## 2、对传牌的控制


    我们在传递牌的技术中告诉你怎么传牌，送给你一个“矛”，现在又要讨论怎样阻止传牌，再送给你一个“盾”。你千万别用那个“矛”刺现在这个“盾”，因为这是两个不同方面的问题，前面说的是总体和大局上的方针，现在说的是局部和具体的方法。


    前文说过，“传牌必接”是我们攒蛋的一个招法，那么现在告诉你另一个相对的招法，它叫“递牌必堵”。对于传牌，只要你能堵截，就一定要堵，千万不要临堵时又去考虑环牌、环手的事，一念之下就可能铸成大错。


    # ## 3、对冲刺牌的控制


    冲刺牌是有征兆的，这是不争的事实。


    冲刺牌不可能象麻将起手和那样悄悄地就推了下来，等你明白过来时'
  merge: -1
  img_proc: true
- pgno: 25
  md: '只有给钱的份。冲刺牌必须打出相当的手数，而这个过程，会让出牌方的本来面目和意图暴露无遗，这样，让防守者阻击有充分的时间和准备。


    在防止冲刺牌过的程中，阻击手只有一个任务，就是想方设法让可能冲刺者“坏一手”。如果你做到了，冲刺就不会出现。


    具体怎么做，你得对照具体牌型，这是没有通则的，但有两个招法可以参照。


    第一个招法叫“要封封到顶”，它强调在封牌时应当尽量让拦截的牌型最大化。当然这只能是相对的，你不可能一阻单牌就上大王，一阻三张就上级牌。但在阻拦顺子时，你千万不要舍不得，要封堵就封到顶。


    为什么封堵顺子必须到顶呢？这是因为同样的牌形比较多，在统计中我们发现，等大的顺子组成机率比其它牌型要高得多，它几乎是三带对的20倍，是钢板的500倍。


    “封到顶”的好处是不言而喻的，如果对方要继续主打，就得下火，代价昂贵；如果你封不到顶，对方接牌到顶，那么付出昂贵代价就是你自已。实战中是否“封到顶”还要结合手中牌形，还要看场上态势，不要机械主义理解和适用这个著名的掼蛋招法。


    第二个招法叫“要火给火”，它的意思很明白，当对方逼火时，你就毫不犹豫地火，至于后果怎么样，先不考虑。


    “要火给火”招法是针对一方虚假逼火而言的，在掼蛋实局中，我们发现超过半数的“逼火”是“虚假”的，是想虚张声势瞒混过关。正因如此，“要火给火”就能即时有效地粉碎对方的阴谋。


    是虚假逼火还是“诱火”，这要认真分析、判断，如系前者，火下的适得其所；如系后者，只能是悲惨的无谓牺牲，体现不出任何价值。


    判断是否“诱火”，除了参照手牌、场牌外，还要考虑掼手的打牌风格和技术等级，行牌过急的低端掼手由于技能不足，很少能使出“诱火”的妙招。而对掼蛋高手则需要分外留意了，难以判明的情况下宁愿被其诱招，'
  merge: -1
  img_proc: true
- pgno: 26
  md: '也不要盲目地作无意义的消耗。


    # 三、 反向控制


    任何控制技术都有它的反面，那就是反控制。


    所以控制你，是因为你过早地表现出了冲刺的意图，你的主打牌或拦截牌态势强硬，逼人太甚，对方不得不全力抗衡。


    其实你可以做得巧一点，让你的意图温婉地表达，这样可以避免锋芒毕露，以较小的风险达成目的，取得胜利。


    我们将掼蛋控制论的最后三个方法告诉你，希望你做得更好。


    第一是打出梯度。这是一个行之有效的好方法，能在无形中躲过对方的阻击。比如你有2个三张、4个对牌，那么打2个三带对时，你不妨将中间2个对子带出去，而留下相差很大的一大一小两对牌，这样出对时，就能顺利回收。如果你留下两个相邻的大对牌，是无法形成回收的，这样就自己为自己坏了一手。


    第二是把局势搅乱。所谓浑水摸鱼，你不妨在不影响整体牌形的同时故意跟牌，让对方搞不准方向，这样你可能在乱中得利，乘机开溜。


    第三是以小得大。用较小的类牌引诱对手下大类牌封牌，为你以后的同类牌畅通无阻先行扫除障碍。


    # 结语


    掼蛋的控牌技术，从根本上讲是利用了掼蛋固有的类牌的差异性，即牌型的相生相克。


    掼蛋是南北文化和河湖文化交汇的产物，它的文化背景决定了掼蛋包容和积淀的本质。所以，在掼蛋的控制牌技术上，虽有大家的共识，但也呈现出一定的地域差异，如南方重视牌型，北方善于变化，西部讲究实效等等，这种百花齐放的局面，有利于掼蛋技术进一步的提高和发展。


    段绪林，淮安掼蛋文化协会副会长、兼职位评定委员会主任，掼蛋网首席技术专家，著有《掼蛋宝典》一书。手机：13776723910。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 掼蛋文化与境界


    （授课：周高）


    # 一、文化的力量


    # （一）掼蛋作为一种文化，具有至善的力量


    老子说：“上善若水”，“天下莫柔弱于水，而攻坚强者莫之能先也。”世界上最柔软的事物是水。但水一旦汇聚成大水、洪水，那种力量是无坚不摧的。掼蛋作为一种文化，本身就是一种善良的力量——柔软而坚韧，掼蛋文化一旦弘扬开来，也会产生摧枯拉朽、推陈出新的强大力量。在掼蛋的过程中，能够逐步悟出“善”的深刻内涵，则是掼蛋文化的不朽功勋了。老子提出的“无为而治”核心是一个“善”字，包括清静之治、自然之治、柔弱之治和爱民之治，“圣人常无心，以百姓之心为心。善者，吾善之；不善者，吾亦善之”。老子善良地认为：我无为而民自化，我好静而民自正，我无事而民自富，我无欲而民自朴。掼蛋爱好者应当记取老子所告诫的“善”：上善若水、知足常乐、安居乐业、功成身退、自知之明、大器晚成、出生入死、根深蒂固、哀兵必胜、天网恢恢疏而不漏，合抱之木生于毫末，九层之土起于垒土，千里之行始于足下。


    # （二）掼蛋作为一种文化，具有思想的力量


    拿破仑说：世界上有两种力量：利剑和思想；从长而论，利剑总是败在思想之下。掼蛋文化所依托的辩证思维、战略思想、创新理念，支撑着这项新兴体育运动方兴未艾、如火如荼、蓬勃发展。掼蛋文化中蕴含了强大的思想力量，掼蛋文化既洋溢哲学思想，又充满人文精神，还散发科学理性。思想体现在史、诗、伦理学、博弈论等诸多方面，学史可以看成败、鉴得失、知兴替；学诗可以情飞扬、志高昂、人灵秀；学伦理可以知廉耻、懂荣辱、辨是非；学博弈可以识大体、顾大局、明大势。走进掼蛋，就是'
  merge: -1
  img_proc: true
- pgno: 28
  md: '走进文化、走进智慧、走进思想，我们想问题、办事情、干工作，就会更有底气、更有信心、更有境界。但凡于同伴于大局有利的牌，要果断决策、当仁不让、勇于担当；但凡是在于同伴于大局不利的牌，要审慎思考、恪守纪律、严禁乱出。


    # （三）掼蛋作为一种文化，具有文明的力量


    《周易》说：“见龙在田，天下文明。”唐代孔颖达注疏《尚书》时将“文明”解释为：“经天纬地曰文，照临四方曰明。”“经天纬地”意为改造自然，属物质文明；“照临四方”意为驱走愚昧，属精神文明。从内容上看，文化是人类征服自然、社会及人类自身的活动、过程、成果等多方面内容的总和，而文明则主要是指文化成果中的精华部分。掼蛋文化是一种先进的文明，掼蛋文化具有文明的力量，它深深熔铸在社会大众的生命力、创造力和凝聚力之中，成为国家灵魂、民族品格的一部分，在越来越广泛的范围内影响着人们的思维方式、生活习惯、业余生活。“先天下之忧而忧，后天下之乐而乐”的人生抱负，“苟利国家生死以，岂因祸福避趋之”的家国情怀，“富贵不能淫，贫贱不能移，威武不能屈”的浩然正气，“鞠躬尽瘁，死而后已”的献身精神等，都在掼蛋文化中得到广泛传承和大力弘扬，这就是文明的力量。


    # 二、掼蛋的精髓


    # （一）掼蛋之要，一在沟通


    每个人对掼蛋都有自己的认识，都有不同的理解，因而谋篇布局、篇章结构都是不同的，组牌技术、出牌思路也是仁者见仁、智者见智。掼蛋取胜的法宝在于沟通，即如何建立双方的联系和如何破坏对方的联系。桥牌是在叫牌中建立联系的，而掼蛋则是行动中建立联系的。沟通是对整体态势的共同理解、主攻助攻的关系确定、攻防转换的战机把握、双方战术的无缝对接。沟通是掼蛋的灵魂，好的沟通能集中兵力、以劣胜优，不懂'
  merge: -1
  img_proc: true
- pgno: 29
  md: '沟通往往各自为战、齿亡唇寒。沟通贯穿掼蛋的始终，从第一牌到最后一张牌，沟通始终是双方思考的首要问题。


    # （二）掼蛋之要，二在谋势


    很多领导者都是高手，因为说到底掼蛋也是牌力资源的合理配置和有效整合，领导者往往也是在配置人力资源、激发干部活力。即使一个牌手胜率很高、成绩突出，也不会令人信服地称赞他是大师或常胜将军。但中国第一太后半月就是大师，半月可能是中国历史上第一个打牌高手，特点就是运用战略思维、辩证思维、创新思维，登高望远，高屋建瓴，洞察全局，掌握主动。半月成功的原因是熟读《孙子兵法》，懂得权宜应变。《孙子兵法》：“兵者，国之大事，死生之地，存亡之道，不可不察也。”另一段话对半月影响更大：“夫兵形象水，水之形，避高而趋下；兵之形，避实而击虚。水因地而制流，兵因敌而制胜。故兵无常势，水无常形；能因敌变化而取胜者，谓之神。”


    # （三）掼蛋之要，三在牌感


    作为一个竞赛项目，掼蛋的本质就是6个字：牌感、脾气、牌技。牌感占30%，脾气占30%，牌技占40%。掼蛋就是30%的牌感+30%的脾气+40%的牌技。掼蛋就是先天形成的牌感+现场产生的脾气+后天练就的牌技。要想在掼蛋比赛中取得好的成绩，三者缺一不可。有的人脾气很好，但牌感缺乏，牌技更差，这样的牌手不会走得更远。牌感就是对比赛的阅读能力、对形势的判断能力、对牌型的组合能力、对掼蛋性质的理解能力。夸张地讲，就是几个瞬间：瞬间战略定位的能力、瞬间合理组牌的能力、瞬间预判形势的能力、瞬间权宜应变的能力、瞬间策应同伴的能力、瞬间阻击对手的能力。当然，强调牌感，丝毫不否认脾气的影响和牌技的作用。脾气俗称手气，拿到手的一副牌的好坏、强弱、优劣。俗话说，你辜负了一次好牌，好牌将会辜负你十次。人狠不如牌狠，牌狠人才狠。腹有诗书'
  merge: -1
  img_proc: true
- pgno: 30
  md: '气自华，手有强牌人自狠。牌技则博大精深，如何局部与全盘、个人与集体、进攻与防守、控制与反控制之间的辩证关系，彰显牌手的技术水平乃至综合素质。


    # （四）掼蛋之要，四在牌技


    对于掼蛋高手而言，既无永恒的定律，也无一贯的法宝，既无现成的模式，也无固定的套路。我在前几年曾经总结过掼蛋比赛的八大定律（首引定律、K定律、用炸定律、逼炸定律、贡还定律、掩护定律、转向定律、配牌定律）和40个基本公式，以及坚决依从规律、坚决遵从定律、坚决服从纪律、坚决不挡同伴牌路、坚决不放对手过关、坚决不出逆天之牌、坚决不打赌气牌、坚决不打无理牌的八大纪律，以此为基础，打开胜利之门。


    # 三、掼蛋的境界


    什么是掼蛋的境界，掼蛋的境界就是“天下为公”，《礼记》所言“大道之行也，天下为公。”“天下为公”的基本含义是：天下是天下人所共有的，不是一个集团、一个群体的。同理，掼蛋是天下人所共有的。不是一个地区、一个群体的。


    什么是掼蛋的境界，掼蛋的境界就是国学大师王国维阐述的的人生三境界：独上高楼，望尽天涯路，此第一境界也；为伊消得人憔悴，衣带渐宽终不悔，此第二境界也；众里寻她千百度，蓦然回首，那人却在灯火阑珊处，此最高境界也。


    掼蛋的境界就是陆游的“金戈铁马，气吞万里如虎”。


    境界就是苏轼的“大江东去，浪淘尽，千古风流人物”、“乱石穿空，惊涛拍岸，卷起千堆雪”、“谈笑间，樯橹灰飞烟灭”。


    掼蛋的境界就是“孤帆远影碧空尽，惟见长江天际流”、“疏影横斜水清浅，暗香浮动月黄昏”、“沉舟侧畔千帆过，病树前头万木春”、“长风破'
