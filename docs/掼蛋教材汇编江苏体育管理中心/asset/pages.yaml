  md: '# 第二部分  掼蛋的牌型与规律


    # 一、单牌


    # （一）单牌的来源


    # 1、无法组进其它牌型的单牌，称为天然单牌


    如 2、333、44、6、7777, 其中 2、6 属于天然单牌，无法和其它牌组成顺子或者没有逢人配配成其他牌型。


    # 2、组牌产生的多余单牌，称为组牌余单


    如 234456，其中 2、3、5、6 本来是 4 张单牌，如果组成 23456 的顺子，则 4 成为组牌余单。


    2233344，组成 223344，3 成为组牌余单。


    # 3、拆接牌产生的多余单牌，称为拆接余单


    1010JJQQKKKA，接对手顺子组了 10JQKA 多了 10、J、K 三张单牌和 QQ。


    AAA 用了 AA 接对子，多余一张 A。


    钢板 QQQKKK，接三带两拆成 KKKQQ 多了一张 Q。


    778899，接小一点的三连对时拆成 778899 多了一张 8。


    拆接余单和组牌余单在某些时候没有什么不同，只是主动和被动的区别，而主动和被动是我们单牌防守的关键考察点，主动出牌一般没有余单或者只产生组牌余单，而被动接牌就可能产生较多的拆接余单。


    # （二）单牌防守


    对于天然单牌的防守，我们主要关心出牌者已出的数值相近牌型之间的空腔。比如一家出了 33322，又出了 77755，此时 7 以下只有 4、6 没有出过，防止单牌至少要
    6 开始。再比如出牌者出了两手特殊牌型 333444 和 888999，此时单牌的防守至少要 7 开始，防止 5、6、7 单牌被放过。


    对于组牌余单的防守，主要观察牌型是顺子，中小顺子的单牌防守，尽量防到顺子的最大牌。比如 45678，单牌至少防守到 8。


    对拆接余单的防守，我们以三连对为例，如果三连对是接对手牌的，


    – 6 –'
  merge: -1
  img_proc: true
- pgno: 10
  md: '比如对手用 778899 压 223344，此时防守拆接余单应不低于 9，防止 7、8、9 中有单牌是拆接产生的多余单牌轻易过掉。


    # （三）孤张定律（课堂详解）


    # 二、对子


    一局牌对子的数量通常仅次于单牌，对子和单牌是常用于沟通的试应手牌型。


    从概率上看，除去逢人配有 6 张级牌、8 张 A 和 8 张 K（级牌不为 A 或 K 时），在我方双进贡单牌不控的情况下，就算自己没有大对，搭档拿到大对的概率很高；如果我和搭档都没有
    K 以上的大对，本身这副牌就非常难打，除非牌型特殊或者炸弹较多才有可能获胜。这是单牌失控，为什么多用对子沟通的数学理论依据。


    两对之间跨度较大的牌型。对手打过小对比如 33，我方跟过 44，对手直接 KK，类似的情况比赛中经常出现，两对之间跨度较大，一般中间成顺子或者三连对的概率较高，这个防守的时候需要注意。


    小对不要的牌，也要防止顺子和三连对。


    对子的作用很大，就一种牌型打到底有时候都能取得奇效，同时对子又是所有牌型中最没有用的，跟在三带二后面不计大小，但是根据带出来的对子大小可以辅助判断对手所剩牌型。


    # 三、三同张


    主要是两种形式：三带两和三不带


    三张牌我们主要研究每一手三张之间的间隔度，如果三张牌型多，而且间隔较小，这样的牌型大多数是差牌，要不牌就特别好，特别好是小概率事件。


    比如 444、777、JJJ 三手三带两走出来，这把牌差牌的概率很高。因为几乎三张之间的间隔数值小于 5，牌连接不起来，剩下的只能是天然单牌、对子、三张和炸弹，除非出牌者恰好是三、四炸以上或者有逢人配将多余单牌组成同花顺的小概率事件，对此类牌型无需过度防守。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '另一种情况确需要谨慎对待：三张与三张之间的间隔跨度较大。比如 33322 接着就是 AAAKK，两头的三带两都走了，中间的牌很可能连起来的，比如一把顺子加一把同花顺，或者三连对等，这样的牌型很可能是头游的有力竞争者，要谨慎应对。


    三不带的特殊价值：


    当牌手首发三带两时，对高手来说他已经吹响了主攻的号角，三带两的牌型给对手带牌一带就是 5 张，而且常常是大的三张把小对子带掉，风险很高，而三不带却是经常用到的试应手牌型。


    一般出三不带有几种情况：没有对子带（组成几把顺子了）、对子 和三张不匹配（比如 3 个三张，1 个对子）、对子成了三连对、对子太大 （只有 10 以上的对子）、有意破坏对手牌型结构。


    作为发牌方，首发三不带可以传递牌力不是很强的真实或者虚假信息 （迷惑对手），如果没有小对子进行沟通，诱惑对手大的三张接牌将小对 子留下，实现控制权交换。例如
    333KK 和对手 AAA44，你打出 333，对 手 AAA 接过去后，44 要交给你 KK。


    三不带打出来，对方很难处理，如果接了三不带很可能小对子给留下 了，不接又不甘心让对手继续出牌。正确的应对需要根据自己的牌力和角 色定位制定方案，如果牌力不足不需要强行拦截，看对手后面出来的三张
    的间隔度处理，过度防御会得不偿失。


    # 四、顺子


    组顺子的目的通常是为了减少单牌，组一把小的顺子多 3 张以上小单 牌是不合理的，助攻传牌给搭档的情况除外。


    和三张相对，两把以上的顺子主要考察重叠度。


    23456     23456     23456     23456

    23456     56789     78910J    910JQK


    上面四个例子，两顺子分别是完全重叠、有重叠、无重叠、有间隔。


    我们按照最优组牌的思路去分析，两把顺子重叠的部分有对子的概率


    8'
