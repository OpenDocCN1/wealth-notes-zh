  md: '思想对牌手的影响是深远的，比如，后发制人、坚强不屈、安如磐石、开源节流、前车之鉴、始终如一、积善成德、兵不血刃、博闻强记、约定俗成、移风易俗、提纲挈领、青出于蓝、流言止于智者、万变不离其宗；再比如，不登高山，不知天之高也，不临深渊，不知地之厚也，是故，不积跬步，无以至千里，不涓细流，无以成江海。骐骥一跃，不能十步，驽马十驾，功在不舍。锲而舍之，朽木不折，锲而不舍，金石可镂。


