  md: '# 对手分析与掼蛋残局


    （授课：丁 华）


    # 第一部分 理论框架


    # 一、头游就是硬道理


    # 头游定胜负


    竞技规则中最重要的内容是胜负规则。


    +   ❏  一局的胜负是由头游决定的。其它游，只影响胜负的大小。


    +   ❏  一人头游，全队升级。


    +   ❏  头游就是硬道理：本来能拿头游，因为失误弄丢了，至少损失 2 级。双上的牌，结果被打双下，就是损失 6 级，需要打 2 个双上才能弥补。这一点影响全盘。


    # 二、头游的 4 种主要方式


    了解头游的主要方式，有利于抓住每一个头游的机会。


    # （一）炸弹胜


    炸弹多，需要护送的小牌少，最后剩 1 张或更多的炸弹。


    这就是传说中的好牌。胜利了，只能获得一般的快乐。


    # （二）闯关胜


    倒数第 2 轮出的牌恰好无人能敌，也就是炸弹或大牌刚好把小牌护送完，没有浪费。


    牌力弱于炸弹胜。


    # （三）听牌胜'
  merge: -1
  img_proc: true
- pgno: 35
  md: '剩最后一手牌，需要队友帮助送牌。炸弹或大牌不够用。


    实战中被对手送牌，或者自己送自己获胜，也可算是听牌胜。


    牌力弱于闯关胜。


    这种牌胜利了，可以获得很大的快乐。有人甚至说，这是摽蛋获胜的最高境界。


    # （四）偷袭胜


    对手以为你一次出不完，结果对手错了。6 张牌的木板和钢板可用于偷袭。


    还有一种情况：对手被你的气势震慑，放弃了阻击，结果你赢了。


    一副牌中，常见的头游方式是第 2、3 两种，而第 3 种常因闯关失败形成。


    # 三、牌型的强弱


    一手牌从强到弱依次是：炸弹、最大牌、中高牌、小牌。


    # （一）最大牌


    # 1、自然最大牌


    抓牌完毕之后，自然形成的同牌型中最大的牌。


    大王是单张的自然最大牌。


    对大王是对子的自然最大牌。如果大王没成对，则对小王是对子的自然最大牌。


    3 张级牌（也称“级牌”、“参谋”），是三同牌中的自然最大牌，带上对子则是 3+2 中的自然最大牌。


    10JQKA，是顺子的自然最大牌。


    QQKKAA，是木板的自然最大牌。


    KKKAAA，是钢板的自然最大牌。'
