  md: '析、科学预测，根据客观规律制定、调整和实施战略。


    5、谋略性。运用谋略，重在对全局的谋划。制定战略强调深谋远虑，尊重客观规律，多谋善断，以智谋取胜。


    # 二、掼蛋的战略


    掼蛋的战略远比技术重要。很多牌手组牌、记牌、算牌等技术都很出色，但始终不能成为顶级高手，就是因为不懂战略。掼蛋每一场比赛有每一场比赛的战略，每一局也有每一局的战略，不同的规则、不同的时段有不同的战略，制定战略的前提是战略分析。


    掼蛋的性质：两人配合作战的数学策略游戏、博弈游戏。


    掼蛋的目标：团队利益最大化。


    # （一）决定战略成败的要素


    +   1、资源配置，即组牌；


    +   2、竞争优势；


    +   3、团队配合。


    # （二）战略分析（课堂详解）


    # 1、战略分析的前提


    ①已知信息：绝对牌力和贡还牌；


    ②概率计算。


    # 2、战略分析的方法


    ①引入 SWOT 分析法、波士顿矩阵；


    ②外部环境：机遇和威胁；


    ③内部条件：优势和劣势；


    ④轮次与大牌。


    # （三）战略定位（课堂详解）


    掼蛋定位：根据自己牌力的相对强弱确定自己在本副牌博弈中的位置'
  merge: -1
  img_proc: true
- pgno: 7
  md: '和角色。


    定位关乎一副牌成败。每一副牌只能有一个头游一个二游，如果不根据自己的客观牌力，每一副牌都将自己定位头游的竞争者，显然不实事求是，制定战略就会出错。出错的后果是胜负逆转或者极差损失，例如可能将搭档头游的机会葬送，或者原本不双下的被打成了双下。


    我们要赢的是一场比赛或者一局比赛的胜利，而不是每一副牌都必须拿头游。


    # （四）战略的制定与选择


    +   1、制定战略要考虑内部资源配置和外部环境的相互作用。


    +   2、战略目标一要合理，二是制定后必须坚定不移的执行。


    # （五）一副牌几种情境下的战略初步选择（课堂详解）


    +   1、轮次少炸弹多；


    +   2、轮次少大牌多；


    +   3、轮次少炸弹大；


    +   4、轮次少炸弹少；


    +   5、轮次少大牌多；


    +   6、轮次多炸弹多；


    +   7、轮次多炸弹大；


    +   8、轮次多炸弹少；


    +   9、轮次多大牌多；


    +   10、轮次多大牌少。


    # （六）沟通后的战略目标调整（课堂详解）


    +   1、双强敌弱


    +   2、双弱敌强


    +   3、一强一弱


    +   4、强弱不明'
