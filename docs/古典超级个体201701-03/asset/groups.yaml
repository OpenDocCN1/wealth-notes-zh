    拖延描述的是行为而不是人。


    问题并不等于人，并不能说“我们天生就是个爱拖延的人”。你只是“在某些领域更容易出现拖延状态”罢了。绝大部分人都可以通过练习让自己的拖延降低到能愉快生活工作的程度。万事都拖延和零拖延的人不存在。


