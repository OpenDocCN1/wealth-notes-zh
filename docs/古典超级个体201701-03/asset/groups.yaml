    # 3.分析幸福


    你女朋友可能问过你：你喜欢我什么呀？我们为什么这么好呀？


    你怎么回答的？我敢打赌，只要你答，她都不会太满意。


    咨询师很早就发现，把伤心的事情写下来会降低负面情绪，这是一种重要的抗抑郁的手段。不过你可能不知道——把幸福的事情写下来也会降低幸福感。


    为什么呢？加州大学心理学教授、《幸福有方法》的作者索妮娅·柳博米尔斯基（Sonja Lyubomirsky）做了个这样的实验：


    实验中设置了4组参与者：


    +   第一组：在大脑里回放自己一个幸福的经历；

    第二组：需要思考这个经历的每一个步骤，还要分析：为什么会这样，这次经历和以往有什么不同等等；

    第三组：通过写作回顾那个幸福的经历；

    第四组：通过写作回顾和分析整个幸福的经历。


    结果发现，使幸福感降低的并不是写作，而是分析。脑补幸福片段的第一组最幸福。其次是第三组——因为要写出来有逻辑，必须进行一些分析。而脑子里分析和写作的那两组都那么幸福了。理性分析会降低所有情绪体验。


    如果你希望自己更加幸福，请一定记得这个结论：分析痛苦，品味幸福。遇到负面情绪，通过写作来分析是件好事。（第13周讲拖延症时教大家的自由书写，还记得吗？）但遇见幸福的事，体验就好。


    “好事经不起琢磨”至少从心理层面上是成立的——没事别总想“我怎么过得这么好，为什么呢？”“这段时间我怎么这么有运气，为什么呢？”——踏踏实实，心安理得地享受就好——我就是这么幸运、霸气、可爱的人啊！


    就好像英国作家切斯特顿 (Gilbert Chesterton)说：“幸福犹如宗教是一种神秘的东西,永远不要对它加以理性的阐释。”


    那我们昨天不是刚分析了幸福吗？——这就和学习游泳一样，刚开始要分解动作，但是实战的时候，千万要即时反应，别多想。


    如果再遇到女孩问：“你为什么爱我”“你爱我什么”这样的问题时，别傻乎乎分析了吧。一把抱住人家说，“不知道，我想可能这就是缘分吧，看，有流星！”


    既然出了题，我也给你个参考答案：


    +   梁思成问林徽因：“有一句话，我只问这一次，以后都不会再问，为什么是我？”

    林徽因答：“答案很长，我得用一生去回答你，准备好听我说了吗？”


    看人家这个境界。


    # ——一个总结——


    今天我们分析了幸福的三个误区：


    以幸福为最高目标往往不会幸福；总想回到过去，重复简简单单的幸福，不如给自己调一杯幸福鸡尾酒；最后，分析痛苦，而品味幸福。


    # 春节·幸福践行3


