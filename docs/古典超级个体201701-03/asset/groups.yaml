    同样的信息放在你面前，你能分析出什么？


    你也许不信，但是柯南就能分析出你完全看不见的东西，这就是第三种重要的能力——分析推理能力。


    提高这种能力，你需要了解基础的逻辑学、推理的方法。以及妨碍你推理的各种谬误。


    有了这种能力，你就能很好地将信息串联起来，同时也能看到被隐藏的逻辑漏洞。


    ## 4. 沟通表达能力


    只有具备良好的沟通表达能力，才能把你的推理和独立思考的过程表达出来，传递出去。


    写作是对人表达；编程是对机器表达（对于普通人是否需要学习编程，我个人保持怀疑态度）；辩论是向辩友表达；还有人会用公式表达，比如爱因斯坦；有人用绘画表达，比如毕加索；有人用建筑表达，有人用音乐表达……


    总之，你需要培养适合自己思想的表达方式。


    当然还有高阶的：


    ## 包容模糊性——这就是郑板桥的“难得糊涂”。


    ## 创造性——你有机会创造属于自己的一手知识。


    《对伪心理学说不》第8版是一本被书名毁掉的书，原名叫做 How to think straight about Psychology 书名的问题在于，大部分人连“伪心理学”的概念都不知道，更别提说“不”了。书的作者基思·斯坦诺兹奇在序言里说了一段话，非常精炼地表达出了这种思维方式（序言一般都是作者怕别人get不到自己的观点而写的，有木有！）


    这段话是：


    > “有两个点可以区分心理学家和其他人：

    第一，心理学的批判性思维习惯。心理学家不相信个体智慧，更相信科学方法，即科学方法的本质是证伪；心理学家不怕犯错误，怕以假乱真；心理学家不相信回答所有问题的真理，相信所有问题都有一个相对正确的答案。心理学家不相信个案和例子，因为其随机性和主观性太多明显。

    第二，心理学的概率性思维：我们更愿意相信，任何人类的行为都是概率性的表现，他有一定的不确定性，容易受其他事物影响。”


    ## 行走的“思想发生器”修炼攻略


    当一个人有了这套内在思维能力，他能怀疑、能找信息、能独立思考、能清晰表达、能包容不确定、能创造知识。就成为一个行走的“思想发生器”。


    我们常见的各领域的顶尖人物，无不是这几个步骤的修炼者。


    当然，我们没法一下子修炼成这样。所以在很长一段时间，我们的任务还是先学习，先找到各领域高等级的代理人、寻找那些优秀的、中正的表达者，吸收最好的观点，才能做出有价值的批判。


    但是在学习的时候，需要提高一个层次——思考。别天天看完专栏就走，要带着这4个视角，看看作者是如何提出问题的？他是如何搜集信息的，源头是什么？他是如何推论的？他又是如何表述的？他对哪些留言视而不见，哪些会认真思考？他带来哪些新观点？


    多了这个层次，你才算是个上道的学习者。随着你水平的提高，学习和思考的比例会改变，越到后面，你就会思考得越多，逐渐进阶。


    其实当一个人真的开始走这条路，你就会发现，他是一个平时看上去非常谦卑，没事喋喋哈哈很少动怒，但是在自己的领域，在专业时刻高不可攀，锋芒毕露的人。不管多傻的提问和争辩，他们都能从中学到东西，而不是只为了辩倒对手——他们之所以天下无敌，不是没有人能干得过他们，而是他们面对真相时，不以任何人为敌。


    我的老师吴伯凡曾说过一个境界——


    太极卦象中只有一卦是每爻皆吉，就是“谦”卦，下面是代表高山的“艮”，上面是代表大地的“坤”。


    远看就是一个忸人、厚德载物，傻乎乎，乐呵呵；近看高不可攀，仰为观止。


    我也想成为这样的人啊！


