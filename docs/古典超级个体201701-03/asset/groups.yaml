    # 新年第一天该怎么过？


    # 10-8


    Mr.Y,你好！


    今天是2017年的第一天，心心念念，想给你写封信。


    你看，我们不谈成长工具，不谈大家都在讲的“怎么做新年计划”，我聊聊怎么过1月1日这一天。


    元旦其实是一个很有趣的时刻——新的一页日历翻过去，你突然有一种脱离过去一年的轻松感，以及新的一年被交付的强烈感。


    东北的朋友左右看，南方的朋友跟我脑补：白雪皑皑，掩盖过去的一切；在协调一片白茫茫上，新的一年正在重建。


    就是这种开启一个新世界的即视感。


    不过，过去其实没法结束：你要减的肉还在身上，你欠下的书还在书架上，你做过的事依然在增值。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_0_0.png)


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_0_1.png)


    # 回顾


    # 希望


    # 去做


    新年最该做的事情不是定计划，而是回顾和展望。


    英语中的“一月”January，来自罗马神话里双面神的名字。这个神有两张脸——他一面看着过去，一面看着未来。他认为，一月份要做的事，就是看过去和未来。


    回顾过去，所以懂得自己哪里做得不好；展望未来，看到机会、趋势和可能性。


    元旦这天，做计划之前，最该做的是复盘——


    拿出自己去年的计划（如果还能找到的话）回顾下：去年你认为自己应该做的、能做的，哪些预期完成？哪些并没有？哪些估计太乐观？哪些其实还可以更大胆些？'
