    # 如何成为一个做事情专注又快乐的人？15-2


    Hi，欢迎来到超级个体，过个有意义的年，做一个有幸福感的人——超级个体春节专辑。


    15-2 如何成为一个做事情...


    # 超级个体


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_46_0.png)


    一起职场加速的第103天


    卓越的人做什么都非常投入、兴致勃勃，这不是在适合并的结果，而是内在设计的结果。“适合”对他们来说是结果，而不是原因。


    当你听到这一集的时候，假期已经过去了一半，你的生活过得怎么样，有趣吗？


    我们常抱怨工作太无趣，放假才好玩。真的给你几天时间，很多人会很郁闷地意识到，自己除了吃睡发呆，你也不会玩——春晚无聊、聊天无聊、看书也挺无聊的。小时候那种专注又投入玩的状态再也找不到了。


    今天，我们谈谈如何让自己成为一个做事情投入、享受过程的人。


    ## —— 一个概念 ——


    你一定曾经投入地做过一件事——绘画、写作、谈话、下棋、上网，当你完全投入其中，你也许会忘记时间、忘记吃饭、忘记长时间坐姿的背疼，忘记上洗手间……如果你经历过这种状况，你就有过心流的体验。


    心流这个概念由米哈里·齐克森米哈里 (Mihaly Csikszentmihalyi) 提出，他定义为：“对所做的事情全身心投入的感受，心流产生的时候，会有高度的兴奋感和充实感”。


    他观察了很多艺术家创作时的状态，发现他们创作时，经常忘记饥饿、疲劳和不适，灵感源源不绝，心灵平静灵活。但是一旦作品完成，他们的兴致马上消失，又重新掉回到真实世界里面来。显然艺术家们进入了另外一个精神状态。


    在随之而来的扩大研究中，他发现很多顶级的运动员、企业经理人、作家、主持人与讲者都有这样的体验。这是一个人类普遍现象。他把这种现象命名为“心流”(Flow)。


    如果你有过潜水经验，你就能马上理解什么是flow。海底有很多看不见的流，一旦你进入，你不需要动作，只要专注地保持浮力呆着，水流就能带着你在海底移动，进入看不见的通道，与世界摩擦力为零。《海底总动员》里面的主人公马林就是坐着洋流去找儿子的。


    其实我并不太喜欢“心流”的翻译，早期的大陆翻译是“流畅”或者“沉浸”更加直接，而台湾的翻译“神驰”则更有意向上的精准。


    米哈里总结了“心流”的5个体验：


    - 高度专注一直到结束

    - 自我消失，忘记很多生理需求、也不在他人的评价

    - 时间感停止

    - 有控制全局的感觉

    - 过程即回报


    这不就是你逛淘宝的感觉吗——不眠不休，点击“放入购物车”的时候感觉掌控全局，看看就好，过程即回报。


    另一个体验是经典游戏俄罗斯方块——你仔细思考下这个游戏，既不救公主，也不杀恶龙，唯一的结果就是死。但是为什么你还是喜欢玩？——因为其中不断调整的难度和技术，让你进入了心流状态。为了体验这个过程的快乐，结果是什么反而不要了。如果工作和生活也能像游戏一样好玩，那该多棒！


    我们在“幸福四矩阵”里谈到过“忙碌奔波型”的人（见文章14-2），他们只享受目标达成后的小快感。很多人后台给我留言——我专注目标并且保持结果心态，难道不对吗？专注目标并没有不好，但是你应该学会在过程中获得专注的幸福，这就是心流的意义。


    ## —— 一个策略 ——


    人怎样才能进入心流？有三点：清晰的目标、即时反馈以及技术与挑战的平衡。


    ### 设定能即时反馈的目标


    清晰的目标和即时反馈相辅相成。没有清晰简单的目标，根本不可能有反馈——因为你不知道做到了没有。大部分人和心流无缘，是因为他的目标充满形容词，而非名词。


    比如健身，“每次尽力做”就是一个不清断的目标，你大脑还需要在努力的时候反复思考“是不是尽力了？”，很难投入；但是设定到：“每组12次，组间休息30秒，实在做不到就放下”，就是个清晰能反馈的目标。


    又如写作，如果设定为“把文章写好，让读者喜欢”，很容易写不下去——你写作的时候会持续的自我批评和思考，“这一句好不好？读者会怎么看？”，但其实读者还不知道在那里呢，没法反馈；但如果是“第一遍写，列出所有想法，大概4千字”，这个目标就很容易获得即时反馈。


    很多编辑会建议你“别管读者，自己写爽”，其实意思也是——“自己写爽”，就是个能反馈的目标。


    做事情之前先问问自己，你这个标准是能获得反馈吗？如果自己设定不出来，那么就信任一套靠谱的方法论，好的方法论一定给你具体能反馈的指标，而不是“靠感觉”、“心诚则灵”这种路子。


    ### 控制技能和难度比


    高能力做低挑战的事容易无聊，低能力做高挑战的事容易焦虑。但在焦虑和无聊之间，有一个神奇的空间，人其中很容易进入专注状态，这就是心流通道。更加精确地说，当难度略高于技能5-10%的时候，最容易有心流。


    ### 找到心流通道


    很多人第一次接触新事物，都会有这样的学习路径。


    比如我第一次接触滑雪。一开始看到雪场觉得“哇！新鲜”；没人教，自己滑了几次，勉强超级道不会摔倒了，开始觉得“有点无聊”，此刻你掉出通道进入无聊区。


    一旦过了新鲜期，一定要有名人点拨，展现专业系统——教你东西，比如转弯、重心、动作细节，你又会重回通道，觉得“好玩！”但一旦真的尝试，马上觉得“什么情况！完全控制不住”，进入焦虑区。


    然后你开始细分动作；耐心练习一段，慢慢心理踏实了“Hold住了！”你又重回通道。


    ### 设计心流通道


    如果说学习是一个完全可以自控的过程，工作则比较难控制——因为任务的内容和难度都不是你设计的。你需要在完成工作任务的前提下找到心流，这就需要你的内在设计。


    你需要持续调整难度与挑战的关系。如果工作难度比较高的时候，第一步不是动手做，而是学会寻找方法论，把大目标拆解到自己能控制、能自我反馈的小目标开始。


    ### 当工作难度太低，尝试给自己设定成长型突破


    我在新东方讲课的时候每天10小时、4节课、连续60天，非常倦怠。于是把教师技能比如“讲笑话”、“让人哭”、“语速快”、“讲故事”……列了10个项目，每天专门练一门。循环6圈，快快乐乐过了暑假。


    ### 沟通的心流


    你是否发现和有些人沟通，常常会被带入另一个世界，完全忘记现实的时间流逝——抬起头已经到大半夜了。谈话也有心流通道。


    ## ——一个总结——


    今天我们谈到了心流的概念，以及如何设计自己的心流。


    ## 春节·幸福践行9


    ## 投入：投入一件事10分钟


