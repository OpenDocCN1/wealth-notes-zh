    \n![](img/f3b148b1b2c51fd788bb1762dd156f4f_108_1.png)\n\n# 4条职业发展路径，助你少走弯路 20-1\n\
    \n20-1 4条职业发展路径，助...\n\n我们谈了跳槽的姿势、也逐渐清晰了自己的价值观，本周我们谈谈如何在职业中更好地找到定位——安心工作吧。\n\n\
    很多人开年的时候会遇到一个职业目标，比如绩效是多少，要完成什么任务，然后冲着这个就开始埋头工作了。一年下来，任务达到了欢喜、没达到失落——但是为什么完成？为什么给这个任务？期间自己到底有没有增值？完全没概念——我们一直在低水平的勤奋。\n\
    \n你每天这么努力地做时间管理，各种挤出累得要死的下班后2小时做思考学习，但是最大段的8小时时间，却交给了根本不知你人生方向、也许也不知道你优劣势的管理者的分配，是不是很滑稽的？\n\
    \n最大的时间管理，其实是方向上的管理——我们要学会自己做定位，结合组织要求来工作，这样才是上班，不是让班上你。\n\n本周我们会解释在公司里、行业里和在行业之间切换，分别应该如何自我定位——确定方向，主动前进。\n\
    \n# —— 一个概念 ——\n\n# 看懂组织透视图\n\n想象一个玻璃金字塔，从上到下分三层，每层分8个片区，中间有一个电梯，这大概就是现代典型的组织形态。\n\
    \n8个片区意味着8个不同的部门、三层则对应执行、管理、决策的三个组织形态。如果你在CBD的楼顶往下一看，每一个小格子间都对应一个小公司，而每个公司都有一个小型金字塔。\n\
    \n那么在这个金字塔中该如何发展，如何定位自己？\n\n先看清楚地图。\n\n# 金字塔的平面图：\n\n+ 市场：品牌、广告、公关、商务合作等\n+ 销售：直销、分销、电商、会销渠道、代理等\n\
    + 研发：研究、开发、设计、产品经理等\n+ 生产：生产、制作、写代码、种植、服务等\n+ 服务：客服、提供服务、知识服务等\n+ 财务：管钱、算账、避税、资本运营\n\
    + 人力：人的选用育留、薪资福利、企业文化\n+ 行政：场地、物品采购、行政事务\n\n其中财务、研发、生产的专业性要求比较高，需要专业的学历或者证书。市场、销售、服务、人力和行政，更多都是专业知识+综合能力的体现，经过一段时间的在职学习，完全可以相对灵活地走动。\n\
    \n而管理——按照彼得·德鲁克的说法，是第九项职能——管理是让人和事情更好匹配起来的专业职能——需要通过专业系统的学习。我们专栏未来会有1/4的时间专门谈到管理、领导、授权等知识。\n\
    \n这是平面图，再看看截图。要知道的是——上二楼的电梯门只在中间。所以要往上走，你需要关注什么人比较容易上电梯。\n\n越是核心的部门越容易上电梯——电梯门肯定是朝向那些更加核心的部门。\n\
    \n各部门越核心的人距离中心越近，越容易上电梯。但是核心并不需要你最专业，一个销售团队里的负责人，并不是一定是业绩最好的人。但是他往往业绩还不错，并且愿意花时间、精力带别人和做管理的人。\n\
    \n还有就是任何公司——请注意是任何公司，包括你认为很公正廉洁的公司——和 管理层接触多，更亲近的人更容易上电梯。忠诚度和亲密度本来就是合作的前提。仅凭自己专业就一张臭脸的人要注意了——职场价值=能力-沟通成本。\n\
    \n所以——最好的上楼方式就是，在核心部门、在团队头部、常常和高层接触的人。\n\n# —— 一个策略 ——\n\n# 用 “生涯四看” 设计路径：\n\n\
    看懂了地图，我们看看路径。组织内发展有四条路。\n\n# 1. 向上发展\n\n在组织内承担更大的责任，带更大的团队，做更大的事。\n\n# 2. 向深发展\n\
    \n专业发展，在团队里做得更加精深。一方面专业本身是一种专业竞争力，在足够专业的公司里，专业岗可以一直做下去。另一方面，更专业也是靠近管理岗的重要手段。\n\
    \n一个错误的看法是专业人士就不需要搞管理——其实不然，发展到一定专业程度，也需要管理能力。一个产品经理和一个类似张小龙这样的也叫产品经理，能调用的人力、科技、眼界、资源是不一样的，这些东西反过来也限制你的专业。向上和向深发展是协同的，\n\
    \n# 3. 左右发展\n\n转换职能，进入更适合你的领域。如果你向上、向深都看不到让你激动的方向，也许你可以左右挪动一下，看看有没有新的切入点你更合适。比如原来敲代码的人，也许发现自己更适合做产品设计，甚至销售，这时候就可以做左右移动。\n\
    \n# 4. 向外发展\n\n如果你当前的核心价值暂时没法在组织里获得，向外是个好方式——也许你在创造你的第二套职业系统（海洋体系，见文章 1-1）；你也可以去追求家庭工作平衡，比如结婚生娃；你也可以通过兴趣重新探索自己……这种情况下，设计一个职业外的目标就很好。\n\
    \n这四个方向顺序清晰——定位就出来了。\n\n如果听完这一周的专栏，你对你的职业方向有个大概了解的话，我觉得已经百倍地值回了定这个专栏的票价和时间。因为你的时间和生命才是最重要的，这个世界上最大的浪费就是走弯路。\n\
    \n举一个我好朋友Andy的故事，他在一家上市的教育公司做CFO，我们在一个创业大赛的评委席认识，他分享了自己的职业经历：\n\n他的起点不高，但是路径很清晰，一开始就是做专业——在小公司做审计，然后做了2年跳到四大做审计，然后逐渐进入到和上市审计相关的团队。进入团队以后，一直在刻意提高自己的项目管理能力——一方在项目管理者角度能看到更多的深度（高度深度协同），一方面也为了未来做管理打下基础。\n\
    \n有那么2年时间，公司内斗很厉害。大家都没有什么发展，他也不着急，定位职业外发展——大量时间学习注册会计师，混各种投资人和CEO的圈子，没事去分享公司避税、上市的坑，提升人脉、增加通用技能。\n\
    \n等到内斗结束，他顺利成章地进入一家为公司上市的团队，跑清楚了所有流程，也理解了另外的证监会、法律、投资人关系等业务。在做完第二家公司的上市案子以后，直接跳过去，做CFO了。\n\
    \n一个无名学校的会计系学生到百亿级企业的CFO需要多久？不长不长，12年。\n\n小公司审计2年，四大审计4年，管理者带团队2年，内斗观望又2年，上市公司团队每年带一个一共2个2年。\n\
    \n# —— 今日回顾 ——\n\n为什么仅仅完成自己的职位要求是不够的？\n\n# —— 每日践行 ◆——\n\n下一步你觉得这个哥们会往哪里发展？该如何行动呢？\n\
    \n# 企业中的发展路径\n\n![](img/f3b148b1b2c51fd788bb1762dd156f4f_110_0.png)\n\n最大的时间管理，是方向上的管理——我们要学会自己做定位，结合组织要求工作，这样才是上班，不是让班上你。\n\
    \n# 【本周特约成长导师】\n\n本周我请到赵昂老师，他是中国生涯领域咨询案例最多的三个人之一——这么说吧，现在中国收费最高的20个人，有一半是他带出来的。\n\
    \n![](img/f3b148b1b2c51fd788bb1762dd156f4f_110_1.png)\n\n职业定位的思考\n\n最直接、简单粗暴的时间管理方法，就是“加减乘除”里的“减”，学会给自己定位，做最重要的事，不浪费最好的时间和生命。\n"
  mdcn: "\n# 彩蛋 | 践行：背包3年，长成自己的样子\n\n# ——慢慢长成自己的样子——\n\n2012年，大学毕业刚一年。\n\n考虑了一个礼拜后，决定辞职，当时拥有的积蓄不足2万块，也没有下家。\n\
    \n继续找工作吧——恩，要的，可是做什么好呢？\n\n不知道，那现在最想干嘛呢？——想出去走走，闷了好久。\n\n去哪里呢？——邻近的国家好了。那就这么定了罢。\n\
    \n那一年，我23岁。\n\n于是，整理了一个50L的背包，做了一个月的计划——从西藏去尼泊尔、印度、斯里兰卡，过完24岁的生日，就回来继续老实工作。\n\n\
    可是人生哪里会像计划表那样条理严明，毫无差错。说不定一个转弯，遇见的一个人，方向就改变了。于是，当我每天在斯里兰卡独自闲逛，准备再过些日子就买机票回家的时候，旅馆里遇见了一个人，他说：从这里飞去约旦的机票不贵呢，你可以去啊。\n\
    \n> “约旦……约旦有什么？”\n> \n> “有佩特拉古城，有阿拉伯的美男子呀。”\n\n回家么？还是继续走？看了一眼存款还没有用完，那么继续走吧，钱用完就回家。\n\
    \n于是，在一个晴朗的早晨，飞机抵达安曼，那时阳光耀眼。\n\n世事巧合，在安曼旅馆的楼梯道，碰到了在尼泊尔时有过一面之缘的小伙伴，于是他国遇同乡，一起更好玩。\n\
    \n于是小伙伴的鼓动之下，我们沿着埃及南下，一路闯非洲，而我幸运地在埃塞俄比亚感染了疟疾，一直拖到索马里兰才最终确诊并住了一个星期医院，并准备拖着病殃殃的身体，心有戚戚的挥别同伴独自回国。\n\
    \n恩，钱花光了，开始找工作吧，人生还是要回归正轨的呀。\n\n那是2013年，我24岁。\n\n要不要去澳洲打工？因为身体虚弱急需回国而主动帮忙买机票却凑未谋面的小伙伴发来消息——结伴去打工吧，虽然不知道怎么找工作，不知道能否找到工作，但尝试一下吧。\n\
    \n要去么？可是没有钱了啊，应该要老老实实找工作才对呀。\n\n不去么？可是很害怕未来的自己会后悔或是遗憾啊。\n\n父母说：如果真想去，并可以承担最坏的结果，就是你到那边什么工作也没有，只能买张机票再回家，那你就去吧。我们可以赞助你的机票。\n\
    \n于是，我飞去了澳洲，体验了沙发客，在农场找到了工作，摘了半年的葡萄，吃了无数从来没见过的葡萄品种，认识了一群可爱的小伙伴，自驾去塔斯马尼亚环岛。制造着人生中最美好的种种回忆。\n\
    \n那是2014年，我25岁。\n\n![](img/f3b148b1b2c51fd788bb1762dd156f4f_105_0.png)\n\n![](img/f3b148b1b2c51fd788bb1762dd156f4f_105_1.png)\n\
    \n结束了澳洲的农场生活，我带着摘葡萄赚的还剩下的两万多块钱，去了俄罗斯，格鲁吉亚，亚美尼亚，伊朗，泰国和印度。半年后再次花光了所有的钱回来。真正开始重新找工作。\n\
    \n那是2015年初，我26岁。\n\n![](img/f3b148b1b2c51fd788bb1762dd156f4f_105_2.png)\n\n![](img/f3b148b1b2c51fd788bb1762dd156f4f_105_3.png)\n\
    \n那一年，网上开始流行：世界那么大，我想去看看。\n\n那一年，各种文章开始教人怎么2000块走西藏，怎么穷游。\n\n那一年，越来越多的人开始辞职去旅行，寻找人生的意义。\n\
    \n那一年，我回归生活，并为不知道找什么工作而焦虑不安。\n\n我偶尔也会纵观大学毕业之后的那几年，这是和大多数人不同轨迹的选择，但是我从未有一刻为自己的选择后悔过。即使在重新找工作的那段时间，在企图重新融入社会的节奏却毫无头绪，夜里被眼泪惊醒，觉得前途渺茫一片黑暗的时候，也不曾有一刻质疑过我曾经的一次次选择。\n\
    \n我想，正是那每一次选择，才产生了一次又一次我与这个世界美妙的相遇，打磨和雕刻着我的世界观，价值观。知道这个世界有你无法改变的苦难，也有你无法忘记的美好，有人在世界的某个角落，过着与你截然不同的生活；有人守着一方天地，心满意足；有人不安于现世，用毕业追求一个梦想。有令你好奇的，有令你开心的，有令你悲悯的，有令你感动的…这些情感充斥和充满足着我的生命。\n\
    \n人生的每一阶段为我们成长，反思，并决定自己下一步的方向。\n\n其实每个人对自己生活的选择并没有什么对错，就如同这个世界总有一些深层次共通的价值观，例如：善良，宽容，对美好的渴望。我们有时候更容易和价值观相近的人成为朋友，因为他们身上不时会闪现我们欣赏的地方。但也不必批判和我们不同的价值观，就如同不必去纠正世界的多样性。\n\
    \n![](img/f3b148b1b2c51fd788bb1762dd156f4f_106_0.png)\n\n最终我找到了工作，是第一份工作时认识的客户，后来逐渐成为朋友，她渴望向我那样义无反顾去旅行，自己却被种种原因束缚。她介绍了我去了她的公司，最终通过面试，成为500强外企的一名普通员工，开始学习了解一个新的行业。\n\
    \n今年，我28岁，刚刚工作两年，如每一个平凡的上班族，偶尔有纠结，不时有期待。去年一度纠结是否等待机会回老家，就这么过安逸稳定的小城生活。可以考虑供房子，供车子，像我所有没有离开家乡的朋友一样。\n\
    \n后来朋友发来松浦弥太郎在《100个基本》里的一段话：我们每天都会面临无数抉择。因此，每天都会有困惑和烦恼，在不知道选择什么好的时候，就选择艰辛的那条路吧，因为这样不管是对是错，都会更集中精力去做，会变得更加慎重，更加仔细地准备。从结果上说，也会学到更多的东西，更容易获得成功。相反，选择轻松的一条路，则不仅没有紧张感，也会所学甚少。她说看到这段话突然想起我向她诉说过的纠结。那么，让我们选择比较艰辛的那条路吧，因为那条路上，可能性也更多。\n\
