    # 独立思考决定心智上限 23-1


    23-1 独立思考决定心智上限


    我在美国参加一个名叫《设计思维》的国际会议时，听设计思维的大师Penny讲过一个印象深刻的小故事：


    美国宇航员在太空很郁闷，失重条件下钢笔和圆珠笔没法写字。NASA花费了10年时间200万美元的经费，希望研制出能在失重条件下使用的笔，但没有成功——因为要求太复杂：失重环境下书写自如，不会挥发、不磨损表面……


    于是NASA公开向社会征集方案，一个德国小学生寄来一个包裹，写了一行字“你们试过这个吗？”。打开包裹，发现是一支铅笔。其实，苏联宇航员在太空一直用的，就是铅笔。


    > Penny教授最后总结说——“好的设计，不是最新进，而是最实用。很多人认为设计师是拿出最酷的方案的人，其实他们是拿出最能解决问题的方案的人，这就是设计思维的本质。”


    每次我讲这个故事，都会有人露出恍然大悟的微笑。这微笑背后一般有两重会意：一方面觉得美国人傻，钱多但是脑子不好用。一方面觉得大师讲得很对，这是智慧。


    这真是个好故事。


    且慢。


    这个故事从头到尾都是错的。Penny教授嘛——其实就是“骗你”（Penny的谐音）教授。


    # 第一个坑


    稍微做点调查，你发现这是个扯淡的故事。不信？接下来我陈述3个事实：


    +   1. 美国早期太空活动中宇航员使用的就已经是铅笔了。比如在水星计划和双子星计划中。美国人并不像故事里描述的那样，比苏联人傻。


    +   2. 太空钢笔也已经被发明出来了，直到今天还在用。1965年，美国一家叫做Fisher的公司开发了太空使用的AG7型太空笔（Fisher Space
    pen）。原理是笔芯里密封高压氮气，靠气压把油墨推向笔尖。这种油墨不挥发，能在各种环境下使用。笔尖经过特殊工艺配合超硬碳化钨笔珠，绝不会脱落，适应的温度范围是零下40到零上121度。神舟六号上用的就是这种笔，而且国外亚马逊就能买到，价格是35美金左右。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_148_0.png)


    经过上述的论证，结论似乎再次浮现了：


    美国人并不傻，NASA也不是笨蛋。而且高投入的确研发出来了好产品。


    这才是真实情况。


    且慢。


    # 第二个坑


    这里还有个你没有深想的问题：在太空钢笔发明之前，铅笔是一种好的太空书写工具吗？


    字迹模糊了怎么办？失重环境下如何削？如果铅笔芯断了，石墨到处飞会对电子元件造成致命威胁。这些情况是怎么处理的？现在这种铅笔还在服役吗？


    于是继续做调查发现——即使是美国人和苏联人使用的太空铅笔，绝非寻常物。

    首先，人家是自动铅笔，不用削。

    其次，人家用的也不是石墨笔芯，而是“软性有机粘合剂-有机染料”配方，这种笔芯类似蜡笔——不容易折断，也不会产生微粒。

    更好玩的是，这种笔今天还在大范围被宇航员使用，是太空站标配，并没有被取代。

    因为这两种笔各有优缺点，各有适应范围，不存在谁比谁差的问题。


    太空钢笔书写流利，使用时间长，字迹相对牢固，使用方便一些，但是成本高，结构复杂。太空铅笔则使用范围广，结构简单，成本低，是国际空间站上的标准装备。两者其实是根据不同思路开发，但共同解决了问题的好范例。并不存在谁比谁强。


    讲到这里，你以为事情终于真相大白了吧。

    且慢，

    其实背后还有一个坑。你猜是什么？


