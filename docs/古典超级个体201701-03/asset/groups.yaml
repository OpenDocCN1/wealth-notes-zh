    # 朝阳期：进入一个行业的最好时机 20-3


    20-3 朝阳期：进入一个行...


    如果说职业发展是一场个人的创业——对于幸福度影响最大的是价值观和优势，对于成就高度影响最大的，也是进入行业的时机和执行力。


    陈虎平在他λογία《打破自我的标签》里提到这样一个观察：


    +   00年的优秀毕业生去了外企、四大；土鳖毕业生去了四环边的中关村公司；

    05年好学生进入了风头正劲的诸葛亚；土鳖毕业选择了卖鞋卖袜子的阿里；

    10年优秀的毕业生都留学留在美国；土鳖毕业生立在了BAT；

    16年的优秀毕业生去了BAT，开始自己创业；只有一群人默默被挤进了工业农业电商；


    这些人当时的选择，都并非自己的主观选择，但随手的选择却都让他们进入一个潜在的上升直梯，与伟大同行，也抓住了—次重新设计人生的机会。生涯的训练就是让这种无意的选择变得有意和刻意。


    过去两天，谈到的是组织里的定位，在价值链条上的定位，都是空间层面的。今天要讲的是一个时间点上的定位，也就是时机。


    # —— 一个概念：产业周... ——


    产业经济学提出了“行业生命周期”的概念来解释“时机”这件事。这个模型认为，行业也有自己的生命周期，分为初创期、成长期、成熟期和衰退期。也有人形象地喻成：曙光期、朝阳期、成熟期、夕阳期。


    # 曙光期


    觉得有需求，一群理想主义者刨一片地，吭哧吭哧做完了苦逼的基础设施。


    # 朝阳期


    需求增多，第一拨人发现商机，新产业出现。


    行业扩张，第二波人涌入，进入残酷的竞争。


    行业成熟，第三拨人努力挤入，分食剩余空间。


    # 成熟期


    行业稳固，第四拨人接盘，获取微薄利润。


    # 夕阳期


    行业下滑，有人留守，有人迁移找新机会。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_113_0.png)


    进入一个新行业最好的时期，是朝阳期。第一波获得50%溢价，第二波抢到30%溢价，第三波瓜分10%。等到第四波的时候，只有微薄利润，没有太多溢价了。


    一不注意，就君生我未生，我生君已老，错过了进场的好机会。人一生遇到好的机会，大概有3-4次。


    # —— 一个技术 ——


    # 怎么判断什么时候是好时机呢？


    # 曙光期谨慎入场


    我们专栏的读者很多都是职场3-10年的人，这意味着尽要不要一下子进入职场高级道——在一开始的时候入场，以为一个素人会在爆发期有什么机会。这都是财富故事会的主体，并非真象。


    第一批的机会是留给在机会旁边看了很久的人，你现在才进去太晚了。所以你能在公众视线里看到的领军人，都不是从头做起，而是从类似的领域技能迁移过去的（该概念在文章4-2讲过）。咪蒙是搞文字的、PAPI酱是学编剧的、各种知识IP人家是很多年积累的……


    你从来没有做过大数据，现在有一个哥们号召你——来我们一起学习从头开始创业吧，我们的未来是星辰大海……去不去？不要去。


    # 关注子产业


    你应该直接跑到这些人没有空做的、更加细分的市场，也许就是子产业。《好好说话》很火你是有机会介入了，有没有可能做一个《好好说话》的恋爱版——《好好说情话》？这个机会就很大。模式、结构都很清晰，内容很聚焦。


    搜狗原来就是搜狐的一个小模块，你看人家现在。


    # 关注二级市场


    既然大家都在淘金，不如我们来卖水和牛仔裤吧。这就是牛仔裤品牌李维斯的来源。职业也是一样，赶不上第一波，不如试试看二级市场。


    我的一位小友前段时间从市场转技术，想去学习前端。当时我不太赞成——APP大潮都快过去了，前端需求不仅不会增多，而且某些创业公司释放的劳动力还会泛滥。


    他说那未来什么火？要不要直接去学习大数据或者VR？


    除非你是这方面天才，否则也别碰。因为成为一个数据专家需要很长的学习周期，你很难赶上这个进度。二级市场其实是个好策略——大数据几年内一定会像来自水一样对接到每个人、每家公司，但是个人是用不上的，因为使用门槛太高，一定是对企业用户。


    企业用户则需要大数据公司有人去理解需求，设立方案，这个人既要懂客户也要懂点儿技术，还能出方案——和当年的做CRM系统，今天做企业SRSA平台销售工程师一样。这个二级市场肯定有机会。


    # 横向迁移


    中国非常大，在一线城市做过的市场，完全可以在二线、三线城市继续再做一遍，然后是四五线城市。原来培训领域的大师们，这段时间被小鲜肉和知识网红替代了，去哪了？他们奔波于二三线城市，收入比现在还高。因为有更大的空间。


    不知不觉，你一定不会买的“安踏”品牌，在二三线城市的市值已经超过600亿，成为全球第五大运动品牌了。'
