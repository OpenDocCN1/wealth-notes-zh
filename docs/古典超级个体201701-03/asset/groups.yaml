    古典


    其实所谓的一二线城市的童鞋们，他们也很苦恼。比如：


    我一直在困惑一个问题——要不要回老家？我是 一个程序员，今年29岁了。在百度工作，自己并不属于大牛级别，也看不到机会。没户口，没有买房。我有一个同乡女朋友，她一直建议我回西安生活，这样一切都很好。我这个样子，该规划吗？


    # 关于如何选择城市


    我在一篇《逃离北上广？——那你在追寻些什么》解释得很清晰。稍作改动放在下面。


    每天早上，手机都会给我推送一个信息——


    “今天北京的空气质量指数为187，属于不健康，请减少户外活动，关闭门窗。”我把提示按掉，下意识深吸一口气，又马上呼出来。然后你打开门，做 出个跳崖前坚毅表情，一头扎入雾霾的北京。哦北京！北京！


    # 第一，职业与生活的多元性不同


    # 第二，生活 的压力不同


    # 第三，资源不同


    最后是特殊资源——不同的地方拥有不同的资源。大城市几乎集中了中国最好的教育、艺术、医疗、金融资源；还有政治资源（如果你玩这个的话）。而小城市也有特殊的资源：和父母亲生活在一起，在家乡生活的归属感，以及来自家庭的各种人脉关系。


    只有你明白了各自的好处，才能在不同地方真正过得好，在我看来，活得最坎坷的是——那些坐着拥挤的地铁在雾霾中穿行，然后进入一个不喜欢，也无可能性的工作，晚上再坐2小时车才能回家的
    人，却从来不参与任何一个冒险、聚会、沙龙、展览的人。


    他们沉默地承受了城市最操蛋的一面，却完全享受不到城市的美好——机会、可能、新鲜、多元。


    你永远无法停止逃离，除非你找到自己真正想要追求的。要想清楚这个选择，每个人都需要认真思考：你这个阶段到底想要些什么？职业、自我、家庭，你的重点在何处？精彩、多元、归属、从容、可能、宜居……哪些是你不可或缺的生命要项？


    从生涯来看，人生是一个打开再合拢的过程——你需要在年轻的时候看到足够多的可能，才有可能在而立之年从容地选择自己想要的生活。


    好的生涯轨迹一般是20-35岁前以职业发展为核心，在大城市尝试各种可能，有机会就再往上。到了35岁前后，形成稳定的对生活的定见，然后做职业-家庭-自我的平衡选择。你只有一日春尽长安花，才敢在某一天平平淡淡才是真。


    对于自己内心没有方向的人，去哪里都是逃离；而对于生命有方向的人，走向哪里都是追寻。所以苏轼被发配到当时的四线城市惠州，才会写下“试问岭南应不好，却道：此心安处是吾乡。”


