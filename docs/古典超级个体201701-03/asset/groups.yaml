    如果你仔细看各个测评对于优势才干的描述，你会发现他们大多是关于“才干”的描述，而非具体的工作事项。

    也就是说，这种“自然而然的思维、行动和感受的模式”之所以神奇，是因为他的应用范围很广——你的才干可以迁移和组合，应用在大部分工作中。关于“能力迁移”和“乐高式组合”，前面详细讨论过（可参考文献4-1）。


    比如你的优势是：“排难、和谐、识人、前瞻”，该该如何组合呢？

    这会让你在：

    做销售时，成为一名会识人、帮客户解决困难、而且预见性的解决对方问题的顾问式销售；

    做领导时，会是一名有远见、懂人、懂带团队也能帮下属解决问题的人；

    若是一名画家，你也许会在预见艺术界品味风向，建立自己的好朋友圈子上，特别出色，你会是一名在时代前沿，有影响力的人。


    优势能运用到大部分领域去，优势更多是一种“副词”而不是“名词”，是做事情的方式，而不是某一件事情本身。你也许因为有了“学习”的优势，而获得了“英语好”的优势。


    张建文：我的一大优势是“成就”，Gallup报告解读为——精气充沛，做事情锵而不舍，一整天忙忙碌碌。但我现在的问题是也没做成什么特别令自己有成就感的事情。那么即使——我觉得是优势，跟其他人相比也是劣势，怎么办？


    ## 古典


    我们先回顾下优势的定义：“持续地近乎完美的表现，持续地产生积极成果的能力”，所以优势的三个要素：近乎完美的表现、持续的能力、积极的成果。


    优势并不许诺你——要比别人强。


    这里需要区分两个概念——“优势”和“竞争优势”。优势的定义如上，竞争优势则是：“在一个竞争中，相对于其他选手的明显优势”。


    优势=才干×投入，所以即使在你最优势的领域，都一定有人比你投入更多，起步更早，所以有人比你强，是天经地义的事。


    那为什么还要关注自己的优势呢？


