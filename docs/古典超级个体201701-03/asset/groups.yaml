    文章的基础。特别 是古典老师这类学习型的文章，更应该只字不差地去阅读，因为每一个字都值得我们去精读。

    好处二：培养你的耐心。不得不说这是只字不差阅读带来的馈赠，而耐心无比重要。会让我们心态更平和，让我们更淡然处之。只字不差地阅读虽然快起来花时间多，但你充分理解文章之后，快就是慢了。

    其次，做笔记是必不可少。在时间充足时，我会大段大段摘录精彩的句子，在时间紧张时，会记下文眼的句子。老师的高效学习模型中已经充分显示做笔记的人的记忆会比不做笔记记得更多，充分调动我们的感官去学，让我们记忆更牢固。

    再次，音频文字结合，一边听音频一边看文字，旁边还有纸和笔，一次美妙的旅程就开始了。每天都对文章有期待，所以每天都有惊喜。不同的心态去学习会带来完全不一样的效果。

    最后，也是最重要的，那就是践行。行动是改变的抵达，践行才是最好的理解。对于每日践行，自己都会老老实实，认真去执行，哪怕执行得不好，但也要去落实。当然，还有每天的留言。认真读文章总会有一些你想说的话，那就留言吧，把自己的思考、困惑写出来，也是另一个角度呈现自己的思考成果。每一天的留言其实也是一次写作的锻炼，这是我们不应错过地机会。

    只字不差地阅读，调用多感官去学习，认认真真去践行，记录自己的所思所得，这是自己目前学习专栏的方法。但还有一个最大的不足就是，教是最好的学还未能执行。

    接下来，得试着当老师的感觉，多输出，整理自己的讲说稿。

    感谢古典老师带来的启迪。好好学习，天天向上。

