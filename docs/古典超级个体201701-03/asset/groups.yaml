    钛钯麒麟 1

    在2012年参加北京时间管理沙龙至今，一直在攻克拖延症这样的难关，心里又很清楚关键是心里有太多想。

    小时候玩游戏的时候，想尽办法去执行，而做作业的时候都在想着玩游戏，两件事的价值，从本质上对当时的我来说，就有着拖延的必然因素在里头。


    人生这辆车要先想清楚自己的方向在哪，而在执行的过程中存在很多内心不愿意，却又 STP是必须去做的事情，是享受去做、娱乐去做、游戏的做，还是痛苦去做、坚持去做、咬牙的做，在我看来是拖延与否的必然条件之一。


    很荣幸成为践行奖的超级个体之一，和古典老师一起，成为最好的自己，通过实践做到最好的人生，‘知行合一’

