    # 区分一二三四手知识，找到知识源头 21-2


    21-2 区分一二三四手知识...


    王小波讲过一个笑话：二战时将军视察前线，看到一个新兵很紧张，于是给他一块口香糖。


    > ——好点了吗？士兵。

    > ——好多了，长官。不过这口香糖为什么没味道？

    > ——因为我嚼过了。将军说。


    我们身边也有很多嚼过的口香糖信息——在你的朋友圈、QQ空间、微博，社群里各种转发的內容和信息、你书架上的各种名人、朋友推荐的书籍……各种二三四手信息不计其数。


    面对知识焦虑，这些“口香糖信息”的确让你镇定了点，而且怕你觉得无味，还加入大量麻辣、鸡精、味精、GIF动画和美女照片起味儿——但是当你吃惯这些，你永远没法享受真正的优质知识的味道。


    因为你没法去到知识的源头了。


    ## ——► 一个概念: 知识源头 ◄——


    在西藏我曾经接近过长江的源头，很难想象在上海看到的浩浩荡荡的长江，其源头竟然这么狭窄，好像我躺下就能将水流拦住一样。


    就像河流的源头一样，知识源头，是知识发源的地方，是知识刚刚被创造出来的地方。这里的知识浓度和质量极高，有丰富的底层逻辑和基础概念。当顺流而下，离源头越远，支流越多，混入的杂质就越多。当一份知识掺入了太多杂质时，恐怕只能勾兑成鸡汤了。


    # 一手信息：知识的源头


    1978年的诺贝尔经济学奖得主赫伯特·西蒙(Herbert Simon)在1973的时候，与合作者威廉·蔡斯(William Chase)共同发布了一篇关于国际象棋大师与新手的论文，首次提出专业技能习得的“十年定律”，他发现象棋大师的长时记忆中有5-10万个棋局组块，他推测这需要花费十年的时间。


    # 二手信息：忠实转述一手信息


    # 三手信息：为传播而简化和极端化观点的陈述


    # 四手信息：为各种动机充满个人经验的情绪化表达


    # 区分一二三四手知识


    一手知识是一些正在被研究、思考和验证的新鲜的思考，可能在这些研究者的脑子里、笔记本上，还未完成后续加工，但是新鲜热辣。另外一些思考被系统化表现出来，就成为了专业期刊上发表的论文。


    我当然不是贬低第三、四手知识。因为我自己也写着三百多万畅销书，文章阅读量也常有十万+，我也转载着三四手知识。三四手知识有它的优点，受众面大，传播效率很高，门槛不高，是大众有机会社发现源头的重要手段。


    重点是你作为读者的追求——你喝到了第三四手知识，是否有向源头走近的追求？还是一直在这里继续舒服的猛？


    另一个是你作为作者的追求——比如说我写的2本书中，《拆掉思维里的墙》销量300万。但是第二本《你的生命有什么可能》，有用信息量应该增加了一倍，但是销量则不足前者的十分之一，并不是我不会写爆文了，而是追求不同了。第一本书算是三手，第二本基本算2.3手。


    ## ——一个技术——


    # 如何进入知识的源头？


    # 1. 能辨别和找到知识源头


    前面讲了这么多概念，你应该刻意辨析一二三四手知识。你需要找到更多好的，产出一二手信息的资源。一般来说，下面这些内容是好知识的概率更高：


    - 一手研究论文、行业的学术期刊、行业最新数据报告；

    - 名校的教科书、MOOC里推荐的一手材料、维基百科；

    - 讲到底层逻辑、思考质量比较高、略微难懂的书和文章；

    - 各行业领军人物、行业大牛推荐的书单、豆列。


    # 2. 跟随知识源头的人


    如果你实在来不及看这些内容，记得跟随站在知识源头的人。因为他们是面对源头的，如果他们比比较会表述，那就真的是幸运了。


    在我看来，“得到”订阅专栏的各种作者都是这样的人，尤其是卓老师、万维钢，他们一个站在科技链条源头，一个站在优质图书源头，表述相当忠实和清晰。


    如果你同时订阅几个专栏，很容易发现专栏作者用不同语言讲同一个道理。这个时候看留言，就看不出不同人的心智水平了——比较低的人会说：“你这个万维刚讲过，没意思”，比较高的人会意识到：“你这个万维刚也这么说，有意思。”后面的人意识到——源头总是聚合的，统一的，而不是各自不同的，这才是精华。多看几遍，多几个角度，比给你看一篇信息量极少，但是长篇大论的文章好很多，更加有认知效率。


    # 3. 成为知识的源头


    这个有点难度。我们下周谈如何输出知识的时候再说。


    > “沂河那得清如许，为有源头活水来”。


