    有一十六个棋子，只是颜色不同而已，但是在进行每一步选择的过程中，对于同一个问题“走什么子，走到哪里”的选择不同，一步步累积，到最后就形成了天壤之别。看似每次只进行一个选择，但是选择的
    质量和效果在时间长河中会有非常明显的差别。 每下一步棋你会想多远，你下棋的经验有多少，你下棋的心态怎么样，这些种的因素，最终都决定着最终的结局。如果你看重过程，那么你需要把握过程，如果你看重结果，那么你更需要把握过程。

    有些事你必须做了才知道什么是好，什么是更好，而只是凭空单纯的想，单纯的看是没有办法去替代实践的。如果单从方法论的角度看，不断的去寻找更好的方法本身就不是一种好方法，真正的好方法可能是：实践，并在实践过程中结合经验和知识不断指导，调整自己的实践过程。可能一直在找好方法的人们并不清楚好方法的真正含义。
