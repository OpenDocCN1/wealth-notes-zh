    ## 和我一起 加速成长 跑赢这个时代


    升级自身能力 解除成长焦虑 我为《超级个体》代言


    邀请你也加入这个40000人的“超级共同体”


    我们身边有一些经常被提起，但是很少被真正理解的概念，比如说物理里的量子力学、企业中的商业模式，还有本周我们要谈的“知识管理”。


    ### ——一个概念——


    ### 什么是知识管理？


    知识不多说了——管理是什么？


    如果说管理是“调动资源，有效率有效地达成目标”。知识管理的本质应该就是——收集和整理知识，有效率地产出结果，解决问题。


    如果用身体打比方就是：“吃得好（信息资源），吸收好（认知资源），运动好（学习效率），更健康（有效产出）。”


    - 要重新区分一二三四手知识，是让大脑“吃得好”；

    要区分三种读书法，是让认知资源最优化，让大脑“能消化”；

    理解“学习金字塔”，是让学习效率最高。


    要“极其功利地读书”，要“输出倒逼输入”，因为这样以终为始，学习才有效用，才能够有效地产出。


    所以外行人的学习制度表，往往是“读了多少本书”，“画了多少脑图”或“我手机里有多少个APP工具”。


    而《超级个体》追寻的学习刻度，应该“掌握多少一二手知识”，“认知效率提升多少”、“熟熟悉什么学习方法”以及最重要的“输出了什么”。如果你是自己的首席知识官，输出就是你的绩效指标。


    好，讲到这里——我们已经绕开了知识管理的3个大坑。


    ### 1. 把印象笔记等知识管理工具当知识管理


    很多人把各种知识管理软件的使用，当成了知识管理，是犯了“把书架当成书，把藏书当成有学问”的谬误。


    人们遇到好的知识，就下意识地收藏到自己的各种知识管理工具中。长久下来，知识收藏了许多，微信也收藏了一堆。这个动作非常好，但仅仅是知识管理的第一步，还有2个动作你没有做——你什么时候读？用的时候怎么提取、提取的产出是什么？


    但也有倒过来用的聪明人——我的一位设计师朋友刘雪雪就是这方面的高手——她负责过很多大型项目的体验式设计，这需要她短期了解一个行业。她的方法是订阅要研究的领域的所有头部公众号，但是然后并不打开。做方案前，从行业高手处找到“关键词”以后，再去搜索，阅读后直接做成文章。


    所以千万不要让知识管理止步于收藏和分类知识，后面还有提取和表达很重要。只是了第一步，像篮球运动员接球走了一步，既不起跳，也不投篮，非常可惜。


    > 心理学家、《心智探奇》的作者史蒂芬·平克说—— “写作之难，在于把网状思考，用树状结构，体现在线性展开的语句里。”


    恰好对应的就是知识管理的收集知识、整合知识、呈现知识三个步骤。


    你不如形象地把知识管理比喻成“两步半上篮”——


    - 第一步：接球，拿稳球——收集、整理知识

    第二步：调整动作，准备上篮——提取、整合知识

    最后半步：投篮，命中——形象化、表达知识


    带着这个认知，我们来看看第二个误区。


    ### 2. 把思维导图等记忆工具当知识管理


    容我说一句得罪人的话：大部分手绘的、过于精致的、花花绿绿、让你成就感爆棚的思维导图，是一个好的记忆工具，却是糟糕的知识管理工具。


    下面有三个理由：


    - a. 不便搜索：如果当你要提取知识，就发现手绘的图并不方便——不能搜索，不能互相链接，甚至不好保存。

    b. 不利传播：而作为知识产品的输出，手绘图往往只能让人觉得“woo, 好好看，好用心”，但是个性化的表达并不利于传播——我大部分时间无法直接看图理解内容。

    c. 不好整合：明天我们会提到，并不是所有的知识都是树状结构的；更加重要的是，真正系统地输出内容，需要整合很多张脑图的知识，这意味着脑图们需要分拆然后整合，手绘做不到。


    考虑到思维导图是由英国的托尼·博赞在电脑不发达的上世纪70年代时候提出的，我不认为他今天还会认为手绘是个好方法——我认为最好的方式也许是要么把脑风暴和记录的手绘图整理成电子版的，要么直接用软件记录和传播。


    另一种方法就是视觉引导的思路，国内这个体系是毛阿泡引入的——用手绘走过知识管理全流程。她认为视觉引导未必是脑图、也不一定要炽目，一切都是为了更好的用视觉提取知识。


    我看过她在某个大型论坛的会场，讲者一播放，她一边画。讲完视觉导图就出来了。即使没有听课，看图也有个60-70%的理解率。这也就完成了知识管理的三个过程。


    这是第二个误区——晒笔记很好，但千万别把“特艺艺特有就感的知识记录”变成知识管理的终点——知识的功能性远比炫耀性重要——别忘了，要极其功利地读书。


    ### 3. 把写作、讲课等当成了主要的知识输出


    那么，是不是阅读、整理、整合然后写成文章、课程输出（就像这篇文章这样），就是唯一的知识管理路径呢？


    并不是，知识管理并不是内容生产者、研发者或者讲师的专利。而是每个学习者都需要学会知识管理。知识管理的输出方式有：内容、技能和判断。


    ### a. 输出内容


    写作和演讲的确是常见形式，但除此之外，知识的输出有非常多的形式：


    比如产品设计新思路的PPT、开会时提出的一个新观点、两个人之间有启发性的谈话，哪怕吃饭时的一个段子……你可以用很多形式输出不同的知识。


    ### b. 输出技能


    知识也能转化为技能，比如表达能力、学习能力的上升，你更加知道如何搞定某类客户。


    ### c. 输出决策


    很多人听完课以后，决定投身某个领域。刘备见完诸葛亮，决定三分天下，这也都是知识转决策——投资者做最多的决策，所以他们学习也最勤奋。


    作为知识管理的最后一步投篮，写个爆文，做个IP属于扣篮级别的——你没必要一上来就扣篮，你可以选择很多形式。


    ### 职场人最好的知识管理产出——复盘


    其实如果要给职场人只介绍一个重要的知识输出习惯，我不建议写文章，而是写文档和写复盘。


    我和罗辑思维团队合作的时候，每次直播完，我乐呵呵回家睡觉时，他们开始复盘。因为他们有一个复盘文化（国内源头是联想）——当组织任何一个人有新的探索（二手知识）的时候，一定要尽快集体讨论，共同复盘（高效率的学习），并且以文字的方式（隐性知识显性化）知会这个团队里的所有人（知识输出）。读完复盘文档的这一瞬间，所有人的思维都跟着升级了。


    那些持续产生复盘知识的个体，在团队里地位逐渐就高了起来，因为——专业本来就是一种领导力。那些持续做复盘的团队，他们的认知和学习效率就是做事不复盘，复盘不记录，记录不学习的团体的10倍。


    很多人做事情靠状态——好的时候无往不利，糟糕的时候一塌糊涂。他们其实就是缺乏持续的知识输出。成功就是找到幸运但是低概率的事，变成知识，并高概率地重复。


    所以我告诫我身边的小伙伴——与其总想着写文章大火，不如自己积累身边的做事的知识——老事情写文档，新事情做复盘。


    攀岩者会在岩壁上打下钉子，让自己即使失手也不会自由落体。知识就是时代攀岩者在不确定的岩壁上打下的钉子——输出知识让我们更有勇气，更有效率，不用担心从头做起。


    ### —— 每日回顾 ——


    - 知识管理的主要目标是什么？

    知识管理现在的三个主要误区是什么？

    知识管理的两步半，是哪三个动作？


    ### —— 今日践行 ——


    你现在理解了知识管理的两步半，反思一下：


    - 你过去的误区有哪些？

    知识管理“两步半”，你走了哪几步？又错过哪些？


    以及，别忘了文章开头说好的，帮我一个忙：）


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_137_0.png)


    知识管理的本质是收集整理知识，有效率地产出结果、解决问题。如果你是自己的首席知识官，输出就是你的绩效指标。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_137_1.png)


    升级自身能力 解除成长焦虑 我为《超级个体》代言


    邀请你也加入这个40000人的“超级共同体”


    今天是古典陪伴你成长的第 151 天，一起加速，成长为更好的自己。


    ## 写给努力却学不好的人，给大脑注入知识晶体22-2


    22-2 写给努力却学不好的...


    怎么形容努力学习又不懂学习的人的悲哀？


    我写了个三句半，你看是不是这样：


    书到用时方恨少，话到嘴边没地儿找，别 人一说都看过


    只好感叹，我靠，你讲得真好


    唉，我是不是长了个假脑子啊。


    我们今天来谈谈如何有效地提取知识。


    ### ——一个概念——


    ### 知识晶体


    我们都知道，铅笔芯的石墨和坚硬的钻石都是碳原子组成，不过钻石的碳原子之间形成了非常稳定的晶体结构，这也是钻石是已知自然界最硬的物质的原因。钻石的硬度，来源于他的结构。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_0.png)


    钻石原子结构 ●-C


    另一个例子是沙子和混凝土，散沙根本抓不住，使劲就散了。但是混入了水泥和石块，这些东西之间形成结晶，散乱的沙子能够建起一座高楼。


    知识也是一样——知识的结构和知识的元素一样重要。如果知识点之间能够像晶体一样，在知识之间形成稳定的架构。知识就形成一种“知识晶体”——《超越智商》中斯坦洛维奇中称为crystallized
    intelligence。知识从散装变成了晶体，就变得不容易磨损，强度很大，也容易整体提取。


    星座就是个特别典型的知识晶体。


    ### 4种知识结构


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_1.png)


    知识晶体的多少，决定了一个人的专业程度。让脑子里的知识形成晶体，才是你知识提取能力形成的关键。


    ### 4种知识结构


    ### 1. 树状结构：体现事物层级，包含关系


    MIT计算认知科学实验室主任Josh用计算模拟了循环结构、星星结构、方块结构、链条结构等，最终用数学方法证明人类最佳的抽象知识结构是树状结构。


    ### 2. 关联结构：体现事物相互关系


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_2.png)


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_3.png)


    ### 3. 序列关系：体现先后、因果关系


    序列关系是一种流程图的知识结构。展现事情的前后、因果和逻辑关系。


    最常见的就是工作流程图，就是说明书的步骤指南——第一步，第二步然后是第三步。比如我提到的“不从第一页读书法”就是典型的序列关系：找书-目录-章节。


    再比如我们转载的求职逻辑图，如下一—一件事从上到下全做完才算完。


    都是典型的因果结构。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_0.png)


    ### 4. 数据结构：体现数量差异关系


    最后一种知识的结构，是数据结构。平时常见的柱状图、饼状图、增长曲线……


    数据图展示的是事物空间、时间上的差异性。这就不多说了。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_1.png)


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_2.png)


    有很多知识结构呈现之巧妙，真的是让人叹为观止。他们本身就自带美感，比如太极八卦图。


    黑白两个部分平分秋色，代表阴阳调和，相互依存和平衡。


    阴鱼的眼睛是阳，阳鱼的眼睛是阴，再增加一点动态弧线，展现出阴阳的相互依存又相互转化，对方就是转化的诱因和方向。这是时间和因果关系。


    在太极图的旁边，3个连续或者断开横条组合，形成8个不同的卦象。这8卦两两重叠，展现出64种不同的卦象。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_3.png)


    ### —— 一个技术 ——


    ### 如何提升这方面的能力？


    ### 1. 大量看模型


    不仅要看，还要每次思考这个模型希望表达的关系。这一点我们《超级个体》专栏的童鞋特幸运，我是个知识晶体控——每天的成长卡，就是一个知识晶体。这个专栏的订阅者应该已经有63个了。你大可以自己琢磨。


    ### 2. 自己尝试模仿


    看了一个模型一段时间后，不妨关掉图片，自己画一遍。


    费曼技巧转述时，也可以自己尝试画一遍，看看和原来的架构有什么区别，找到差距再调整。


    时间一长，你脑子里的模块足够多，知识自动就按照模型存放了。


    ### 3. 强迫自己写本书


    这个是高阶用法——每当我需要研究点什么，我先假设自己要出一本书，然后先列我自己作为初学者的所有问题，然后按照逻辑给这些问题编成一个目录。


    我对这个领域一无所知，但是知识结构却已搭好，只等散装知识来吸附了。


    后来我看到阳志平老师的文章，他的方法和我一样，还升级了一版：“不断问自己，书的体系是什么，有哪些打动读者的地方？”


    就是这样。


    前几天有人发留言：


    > “难道说‘得到’大咖的知识，都是教我们的时候学会的吗？”


    我赶紧截图发给罗胖。


    > “完了，被人发现我们的商业秘密了！”


    信不信由你啰。


    ### —— 今日回顾 ——


    为什么很多人有很多的知识量，却提取不出来？


    为什么说知识的晶体比散装知识更有价值？


    人类有哪几种常见的知识结构？


    如果想提高自己的知识提取能力，该做哪三件事？


    ### —— 每日践行 ——


    你身边有没有特别擅长做知识结构的高手？


    你最近一个印象比较深刻的知识结构是什么？


    对于把散装知识转为为晶体，你有什么高招？来给我们分享下吧。


    古典


    ### 特约成长导师：


    这次我请来的是我的好朋友战隽（sun三声），国内自我成长领域的顶级导师。他有个称号——中文互联网上最有名的“学霸”。


    怎么“学霸”法？举例，2011年战隽制定过一个“每天读一本书”的目标。结果，那年他不但读了419本书，而且还“十分凶残”地写了378篇书评。这些年，战隽一直聚焦自我成长领域，文章全网总阅读量数亿。


    现在，他是有50万关注用“知乎”大V。他的warfalcon是最大的个人成长自媒体号，粉丝过百万。这种违反了所有命名规则不好记的号还有这么多粉，证明文章写得好的要死。


    > 他说：“不把信息当作知识，不把收藏当作学习，不把阅读当作思考，不把储存当作掌握。不提炼总结、不应用学习、不深入思考、不实践反馈，就不会变成自己的能力。”


