    # 思考精选


    甜趣陶心 4

    很多人发现自己的优势和天赋后，如同发现玉石，欣喜并洋洋得意。整体沉浸在晒朋友圈、并享受朋友圈的赞美而乐此不疲。然后忘记了，玉不琢不成器，价值连城的美玉需要长期的设计雕琢打磨和抛光。这样除了自嗨，并不能真正改变生活。这段话也写给自己，谨记！

