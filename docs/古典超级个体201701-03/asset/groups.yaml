    # 如何把发现的才干用到工作中去？ 17-1


    Hi，你好，发现你的优势，聚焦人生可能，欢迎来到《超级个体》优势管理专题！


    17-1 如何把发现的才干用到...


    ## ——一个观察——


    关于才干优势我最喜欢的一个比喻，是来自古希腊人。


    他们认为天赋是你身边看不见的“守护神”。他会在你不知道的时候暗中保护你，如果你要召唤它，你需要清晰地喊出这些守护神的名字。每个神都有自己独特的能力、脾气，也都有自己的阴暗面，真正的勇者懂得合理调用他们的力量。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_70_0.png)


    ## ——一个策略——


    才干也一样——很多时候我们只是“隐隐约约”觉得自己有才干，就好像隐藏在你身边的守护神，虽然能保护你，但是你无法召唤，你也许需要给他们一个清晰的名字。


    上 一周我们用测评、SIGN等很多方式，总算是知道了他们的名字，今天我们进一步让他们现身，看清楚他们的形象，了解他们的脾气，也知道他们的弱点，这样你能更好地调用你的守护神。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_70_1.png)


    4个方面，给你的天赋做个画像！


    下面是让自己看清楚这些才干的“才干卡片”以及“优势取向的工作”。


    # 才干素描


    用4个问题进一步勾勒关于才干的形象。如果有测评，你会在测评报告上找到很多类似的线索；也可以通过讨论知道更多。


    ## 1.在哪用？


    环境和领域：我的这个优势，在什么领域适合用？（项目的哪个阶段？什么专业领域？）


    ## 2.对内：在个人成长方面怎么用？


    我的这个优势，如何帮助我更快地成长？


    ## 3.对外：在为人处事、管理方面怎么用？


    我的这个优势，在我做事、做人、管理时应该关注哪些重点？


    ## 4.如何防止滥用？


    我的这个优势有什么阴暗面？我该用什么方式规避？找谁支持下？


    前面三个很好，内在逻辑基于《超级个体》的能力模型（见专栏第一条发刊词）。选择合适的领域（生涯规划、职业定位）；以自我成长为核心，围绕的是产品能力（专业技能，做事能力）、媒体能力（传播能力，影响力）、运营能力（领导管理，做人能力）。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_70_2.png)


    我重点说说防止滥用。所有的才干都有自己的阴暗面。


    为了让大家更好地理解“才干素描”，现在以我自己的一个优势——“理念”为例子。


    我是一个极端喜欢和关注“理念”的人，总能看到事物之间的联系。当然这个优势也有阴暗面，过于关注“理念”让我容易飘，做事不接地气。


    下面关于“理念”优势应用的这四个方面：


    ## 环境（在哪里用？）


    - 适合进入项目的策划阶段、尤其是理念搭建阶段；

    - 适合成为一名专业人士、擅长研发；

    - 适合进入那些需要持续进行理念学习的领域，比如生涯规划、咨询之类的。


    我大量参与了很多公益和商业项目策划、天使投资、咨询等活动。


    ## 自我管理（在个人成长方面怎么用？）


    - 每天一定要留出足够的思考和学习时间，学到新知识，想明白一件事，自己睡觉都是安稳的。跑步也有了意义——是一个思考的好时间。


    每天晚上11-1点会花时间看书、思考、写作。每周周末会有半天时间独处。


    要认识各个方面的“理念”高手，持续地组织思想夜宴。


    ## 做事重点（在为人处事、管理领导方面怎么用？）


    - 要在理念比较重要的项目、环节投入更多精力，放手执行层面。


    参与品牌设计、理念传递、企业文化、心智改变等方面事情。


    在传播和管理时，更快地抓住好的、最新的理念，给大家拆解和介绍那些看上去非常复杂的概念，这是我的重要价值之一。


    ## 盲区与支持（如何防止滥用？）


    “理念”好的人，总容易看不惯太务实的人，其实“理念”需要务实的人实现，否则就永远是理念。所以多找实干家，学会用他们的语言说话。


    “理念”好的人表达容易虚，而且思考过快。所以要学习图示、讲故事、脑图等方式，把自己的抽象概念具象化，让更多人理解。


    “理念”好的人容易自嗨，一定要点批评家、分析家来刺激你，让你有机会锤炼自己的理念。


    # 情人节，你需要的爱情心理学知识都在这里了

    17-2


    Hi，你好，发现你的优势，聚焦人生可能，欢迎来到《超级个体》优势管理专题！


    17-2 情人节，你需要的爱情...


    > “小红，今晚的月光透过汉庭的窗户看一定很美。”


    今天是情人节，估计今晚你要做热烈且羞羞的事，我先给你紧急补一门爱情的心理课。必须要爱情的心理学知识，都在这里了。


    谈到爱情，最美丽的开头肯定是一见钟情，英文叫做“Fall in love at first sight”。这个表达我觉得非常贴切——“fall in love”就是整个掉下去、沦陷、跳楼、失重的、非理性的。明知道是个悬崖，但为了你我愿意纵身一跃。


    但爱情真正的难关在第二阶段，还不说步入婚姻，只要两个人相处久了，激情都会褪去，如何进一步相处？这就是一门学问和智慧。英文中的表达也很有趣：The really
    trouble with falling in love at first sight is the second sight。一见钟情的真正麻烦是第二见。


    在《泰坦尼克号》里，杰克牺牲掉自己让露丝活下来，这是个悲剧。但如果杰克爬上来还活了下去……不知道会不会是更大的悲剧。


    为什么会这样？永远充满激情的爱情会有吗？


    答案也许是：很难。


    ## —— 1 ——


    一个人热恋的时候，大脑会分泌一种激素苯乙胺 PEA（Phenylethylamine）。PEA是一种让你极度兴奋的激素——当你看到喜欢的人的一个笑脸、一段微信文字，你都会心跳加速、手心出汗、脸庞灼热、瞳孔放大，感觉自己被融化：


    你“来电”啦！


    请注意，“来电”不是一个形容词，而是发生在你大脑中的真实的生化反应！


    有两种情况可以人为创造PEA，一种是吃巧克力，一种是遇到危险。所以如果你喜欢一个人，你可以带TA去陌生又危险的地方旅游，或带上一包巧克力，去看鬼片。


    不幸的是，这种心灵春药起作用的时间很短，平均不到30个月（2.5年），而且效果递减。慢慢地，两个人就“左手拉右手”，无感了。


    # 什么是情感账户？


    “情感账户”这个观念是美国心理学家威拉德·哈利(Willard Harley)提出来的。我们每个人心里都有一个账户，你每一次做让对方高兴的事，就是在对方的账户里存款；你每次让对方哭泣、受挫折、受痛苦，就是从对方的账户里提款。


    # 如何提高“情感账户”的储值


    原则是——存款的时候要“投其所好”，而不是“给己所要”。


    ## —— 3 ——


    美国的盖瑞·查普曼博士（Dr.Gary Chapman），写了一本书叫做《爱的五种语言》，观察和分类了爱的5种语言，这个理论有点儿意思。


    第一种爱的语言：Quality Time—精心时刻。花高品质的时间跟对方在一起。心不在焉地玩手机不算。


    第二种爱的语言：Gift—精心的礼物。重点是在精心，而不在于花多少钱。


    第三种爱的语言：Acts of service—服务的行为。也就是说，在对方需要你的时候，尽量主动地提供帮助。


    第四种爱的语言：Physical Touch—身体的触摸。很多时候，说不出来的爱，可以借着身体让对方感受到。尤其对于女生来说，亲密的、非性的拥抱，更容易让她们感受到爱意。


    第五种爱的语言：Words of Affirmation—肯定的言语。就是赞美的话。看到对方的好处，就随喜赞叹。当你感激对方的时候，可以直接告诉他。也可以通过电话、文字表达对方的鼓励、感激和想念。


    要在情感账户上“存一进百”，关键是——找对语言，找对时间。


    # 第一 找对语言


    我身边有这么一对伴侣：


    妻子出于爱，也出于责任，把家庭照顾得很好，在家里打点上下，洗衣做饭，细致入微；先生则实肯干，性格温厚，事业上也表现得很优秀。看上去一切都很完美。但妻子并不觉得自己被爱，她买了很多礼物送给对方，却被认为是浪费钱；她做了很多可口的饭菜（古训不是说，要抓住男人的胃吗），但是对方好像没有什么感觉；她时常暗自哭泣，觉得不被爱。


    我们身边有很多这样的故事——他们生活空间靠得只有10平米近，但是心里的平行宇宙却相隔10光年。他们都是懂得付出，值得被爱的好人，只是一直不懂对方的语言，做着存百得一的事情。


    在这个故事里，妻子的语言是服务、礼物和身体接触；而先生的语言是精心时刻和赞赏的语言。他们每天都在用自己“爱的语言”表达，彼此却很难产生互动。


    # 第二 找对时机


    老婆晚上十点半才到家，进门边拖鞋边对丈夫抱怨：“我这个老板实在是太变态了，自己不走也不让我们走，临下班才开会，忙到现在才结束。”


    这句话是正确的，但是一出口，就是扣了一大笔钱。其实这个时候，最需要的是陪伴和支持。假如这个时候稍微给点爱的语言，其实是一个存一得百的好机会。这和投资是一样的，在对方最难的前期投100万，你能占20%；如果等人家到B轮融资了再投100万，你顶多占0.1%。


    要爱得热烈、要爱得智慧、要爱得准确，愿你每天都是情人节。


