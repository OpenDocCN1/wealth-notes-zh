    # 交作业


    本周一给你们布置了一个思考题：一个无名学校的会计系学生经过12年时间，做到了百亿级企业的CFO。期间他是怎么设计自己的发展路径——在小公司审计做2年，在四大审计做4年，管理者带团队2年，内斗观望2年，做公司上市案子2年，后面这个哥们更适合往哪里发展？


    古典


    现在我来给出我个人的一个建议：


    # 向上发展


    不仅仅是担任CEO，还可以考虑是否可以去更大的公司、更大的平台做CFO。另一个思路是直接进入金融、投资行业，从金融层面操控更大的组织群。


    # 向深发展


    CFO的工作也有很多部分，是否有机会在某一个领域做到更深更极致？我进入了ACCA的CFO圈子，他们都各有各的深度方向——有人在财务云大数据方面有深入研究；有人则在地区经济上有独特见解。还有资产配置专家，收购分拆专家。


    # 左右发展


    到了这个位置，左右的方式不仅可以考虑深度参与业务、运营、产品、供应链管理部分，还可以考虑上下游的整合——比如教育上游的学术资源汇聚、教育资源的打包与整合。


    # 向外发展


    抓紧时间，完成自己的自我探索、自我完整、人脉积累、学术目标或家庭任务等。


    具体选择哪个？

    目标已经给出，分析下价值-优势的重叠区域就好。这就是VVG的目标系统。


    本周，我要送给大家一个专栏发布以来最大的福利——价值8000元的资深生涯咨询专家赵昂老师的咨询一例。


    赵昂是我认识的、最有洞察力的职业生涯咨询师。他进入生涯咨询领域7年来，研究了50多个行业，做了2000多个小时的咨询，培训过数千名咨询师。


