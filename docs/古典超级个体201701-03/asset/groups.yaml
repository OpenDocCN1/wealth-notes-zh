    \ \n01-07 06:42:01\n\n# Change is a Good Thing\n\n# 超级践行 | 就这样看着自己一点点在变好 11-7\n\
    \n这是“超级践行者”征文活动一等奖的获奖作品之一，作者：超级践行者001 ——威红。\n\n两个月了，每天6点半，准时报到，开启美好的一天。\n\n这两个月刷了许多新知，每天都在思考和行动，我的身上确实实发生了许多的变化，每天都在一点点变好。\n\
    \n## —— 两个月以来的改变 ——\n\n## 一、认知升级\n\n从专栏里学习升级大脑，学习转变思维方式，知道了付出就是抢便宜，消费观念发生了改变，知道了注意力、精力、时间都比金钱更重要，认识到了成长的重要性，开始懂得投资自己。\n\
    \n## 二、提高了时间利用率\n\n我一直有早起的习惯——6点，有时候会更早些，但起来之后不知道做什么，都浪费掉了。\n\n十月底正式开启学习模式，6点前刷得到其他内容，看海洋体系小伙伴们的文章并写评论。6点起床，6:30-8:00——“营养早餐”时间，《超级个体》专栏，每天坚持学习和思考，到目前近50条留言入了精选（老师给了这么多的奖励，最大的是签名书还有暖心回复，开心）。\n\
    \n这两个月我高效利用了早上的时间，很充实，满满的成就感。\n\n## 三、开始每天写文章\n\n以前我最怕的就是写东西，作文、方案、汇报材料、总结，一碰文字脑袋就短路，就想逃，不得不写时就百度、复制、粘贴。曾经多少次暗暗下定决心要好好练习，却从未行动过。\n\
    \n这次以写留言为契机，终于开始练习了。之后和一群超级个体成员组成了一个小团队——海洋体系拓展群，我们在一起每天写文，到目前我已经写了50来篇了，文章不长也不够好，但行动起来了就是最好的改变，完成比完美更重要。\n\
    \n## 四、朋友多了\n\n我性格比较孤僻，不爱跟别人交流，总把自己封闭起来。加入超级个体后，开始拓展自己的圈子，发展弱联系。另外还认识了很多新朋友——海洋体系拓展群的小伙伴们，我们约定一起写文，相互交流，分享经验，在这里我开始有了表达的欲望。\n\
    \n海洋体系是我们一些超级个体自己组织的一个小团队，我们有共同的目标，一起走在成长路上，我们相互学习，相互鼓励，相互监督，在努力长成为自己的样子。这是一个能发现、提升和实现自我价值的圈子，这是2个月来最意外的收获。\n\
    \n这个小团队里，几个小伙伴对我影响很大：微笑群主，初期创建这个小集体的時候，办事效率极高，深深地震撼到了我。追忆、木马、顺顾、山人、飞翔及其他人，看到他们发文章对于我就是一种鞭策，我就会竭尽所能去学习、去思考、去写文章。\n\
    \n## —— 踐行工具的体会 ——\n\n## 断舍离\n\n以当下的自己为坐标，以需要、适合和舒服为标准，清理物品的同时也清理自己。第一次大扫除后感觉自己重生了，轻装上阵踏上了成长之路。之后，也在践行，现在不需要的东西不会再买了，学习方面没以前那么贪心了，偶尔还是会有些\
    \ Yönet，不有弹窗提醒了。\n\n## 3秒禅\n\n在手机刷微信时运用得最多，效果最佳。现在基本可以保证至少2个小时不刷微信了，甚至有时半天都不记得打开，给自己留出了很多的大块时间。\n\
    \n## 电子静默\n\n电脑不用就不开机，必要时才联网，不再关注娱乐八卦和综艺节目等等，有了更多学习的时间。手机上关掉了除电话外的所有通知，刚开始尝试时心里总会想要看看有没有新信息，心里的通知也关不掉，所以专心做事和读书时就把手机放在伸手够不着的地方，结合3秒禅，忍了几天后，渐渐地适应了。\n\
    \n## 除法\n\n碎片化思考，大块时间执行，比如写这一篇文章，第一天构思基本框架，第二天完成初稿。之后五天每天修改一遍，并复习了《超级个体》之前的全部内容，做了进一步补充和完善。\n\
    \n## WOOP+执行意图\n\n坦白讲这个工具用得不是很好，只实践了3次。存在的问题是每天做的事都差不多，写来写去就那么点东西，总想不出来可能的if。原因是工具用太多了，思考不够深入，自己的知识匮乏，阅历不够，经验也不足。需要继续学习，尽力演绎更多的可能吧。\n"
  mdcn: "\n# 知识众筹｜变着法儿对你好的企业福利 11-4\n\nHi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。\n\n\
    周二的留言前所未有的充满羡慕嫉妒恨，留言里第一次充满各种醋味——我过得不好无所谓，关键是知道了你们还过得那么好，这就很不好了。\n\n比如这位“SD水”朋友的幽默感：\n\
    \n> “满满一波仇恨，我愿用一整年的带薪休假换一个开放式管理。先想想用点啥换个带薪休假。”\n\n很多管理者问“我该如何提供好的福利”，也有很多人问“上哪儿能找到这么好的企业啊”。话分两头，各表一枝。我整理了一下留言，收集了5种企业能提供给员工的有趣福利，也提供了5个企业福利识别器。\n\
    \n## 弹性上班：\n\n- 平时弹性上班时间\n- 在节假日，如果没有很重要的事，可提前半天走\n- 过节算好什么时候买车票，提前告知上下班时间\n\n\
    ## 节日问候：\n\n- 儿童节，送儿童摄影写真券\n- 圣诞节，节日布置\n- 三八节，全体女员工一起学习烘焙\n- 生日時，送礼品\n- 过节时，给老人红包\n\
    \n年底，公司给员工父母写一封信，加一个红包，请员工带回家或邮寄过去。谈谈这一年孩子在公司的成长，公司的背景以及孩子的表现——在外地的父母亲很希望知道我们的状况，而我们回家往往又不愿意说，这个设计非常暖心。别问我怎么知道的——我们新精英坚持8年了。\n\
    \n## 偶尔给员工创造点精心时刻：\n\n公司在2016年组织的一场千人豪华游轮之旅，让我至今念念不忘，大海，冲浪，攀岩，表演，美食，新奇，刺激，快乐，疯狂……真是刘姥姥进了大观园，体验了一回。\n\
    \n## 心想事成专案——满足绩效好的员工的个性化需求\n\n年初抛出35年个性化愿望，包括员工发展类、即时满足类，还加进了一对一职业辅导、与高管聚餐等。员工发展类是让有潜力的员工尽早跳到管理层视线，可以提供助力加速成长；即时满足类，让员工更多注意家人亲情，稳固员工大后方。\n\
    \n## 阿里招聘文化：\n\n2016年最大的感受是总裁室的老大人纷纷亲自招聘海报，玩各种花样做宣传，贴在公司所有人多地方，只为了让员工内推，内推的奖励还十分丰厚。同时各部门还经常出各种招聘的H5引导大家在朋友圈扩散。这跟老师讲的“招聘营销化”趋势是一致的。\n\
    \n## 下面是第二部分——怎么找到这些组织？\n\n问世间，福利到底谁最高？下面列出5个福利识别器，帮你更好识别。\n\n## 1.不同企业不一样：\n\n\
    HR界流行一个这样的外企福利鄙视链：\n北欧>英法>美加>东南亚>台湾香港\n\n## 2.体制内和效益不好的国企是重灾区\n\n其实真正的福利重灾区是体制内，或者是今年效益不好的国企——体制内近几年，各福利迅猛缩水。以送礼、吃饭为主要收入的珠宝商、饭馆、娱乐场所倒了一堆。国企则受到网络经济很大冲击，很多都自顾不暇，哪有什么心思关怀你？\n\
    \n## 3.大公司>中型公司\n\n从公司规模大小来说，一般大型公司的福利比较好。大公司毕竟财大气粗，也有了专门负责操心的HR。小公司则极度看人，老板一般直接管这个事，遇到好的，把你当家人看。中等的公司往往没有制度性福利，又不幸到没法人普惠。\n\
    \n## 4.赚钱的公司>不赚钱的公司；人很重要的公司>人不重要的公司\n\n其实说回来，福利也只是资本的一种意志体现——管理者并不是慈善家，福利是为了更好地创造情感，推动企业目标实现，所以能赚钱的公司，福利好，比如一些互联网公司。\n\
    \n个人价值非常重要，情感和创意很关键的领域，比如文创、设计、高科技领域，福利也一定好些。\n\n## 5.成长是最重要的福利\n\n不过不管大家怎么晒福利——都一定要记得：在一家公司，你能获得的最大福利，就是自己的成长，能力持续上升，眼界总在开阔，而心智变得越来越成熟。排除了这个，福利再好的公司也是游乐场——并不是一家真正值得合作的组织。\n\
    \n当有一天你如果发现自己被饲养得好好的，同时一眼能看到未来20年，身边又都是一群60后的同事或者有同样年龄心态的老人——你就距离被淘汰不远了。\n\n古典\n\
    \n梁敏、Mindy、姜生叶、Ace'sUn、楠楠、斯霞、普洱茶@凌、姚奕月、昕早雨的留言等对文中内容有贡献，为了保证阅读感受，在这里统一感谢啦！\n\n\
    ## ——今日精进——\n\n福利只是每个人整体收入的一小部分。一个人的职业收益包括：工资福利、职业发展、情感意义三个部分。现阶段的你最看重哪个部分？在这三个部分，结合你的实际情况，今年合理的理想状态是什么？\n\
    \n今天是古典陪伴你成长的第77天，一起加速，成长为更好的自己。\n\n![](img/f3b148b1b2c51fd788bb1762dd156f4f_9_0.png)\n\
    \n公众号“得到”“古典”\n\n思考精选\n\n天火仙人 4 好多好多好的福利，但都不是我的，成长最重要，羡慕完了就要去好好成长了。 现在我最看重的是职业发展，没有发展的\
    \ 工作是令人疲倦的。今年最理想的状态是拿着3：4：3，三种状态差不多持平，但最看重的还是职业发展。现在的自己就像养精蓄锐的剑手，先练基础，再图一剑天下来。\
