    ## 功利读书法，五倍提升认知效率 21-1


    21-1 功利读书法，五倍提...


    你肯定意识到了，在这个信息爆炸的时代，知识已经多到学不完。


    但是那些大牛们，比如吴伯凡老师（就是隔壁专栏《伯凡日知录》的作者），他做 “冬厦相对论” 的时候，连稿子都没有，坐下来就出口成章——这些神人好像总是在读海量的书，聊一些你完全不懂的概念。


    同样是24小时，为什么差距那么大？


    时常也有人问我——你每天到底拿多少时间读书？


    其实这不是一个时间管理的问题，而是认知效率的问题。


    ## —— 一个概念 ——


    ## 认知效率


    比如你问一个人：


    空闲时候该干什么？


    ——不如学学英语吧。


    为什么学？


    ——这个未来总有一天会有用的。


    但是就没有什么明天马上会用吗？


    他就回答不上来了。他根本没想过为什么学、要学什么。


    我们从小听到的最多一句话是——怎么又在玩，不去读书啊？而你只要一读书，不管有多慢、读什么书，大人就不打扰你了，久而久之，很容易形成一个概念——学习总没错。


    这个思路是错的。在知识匮乏、非终身学习年代，学肯定比不学好。但是在今天知识爆炸、终身学习时代，要比的不是学不学，而是认知效率。


    同样的认知资源投入，会有完全不同的回报，这就是认知效率的不同。认知效率低的人，都在做低水平的勤奋。牛人真正的秘诀是在最精华的资源上，以高很多倍的认知资源来学习，所以认知效率是你的很多倍。


    ## —— 一个技术 ——


    ## 1. 极其功利的少读书


    一个新知什么时候最有效率？


    认知心理学认为成人学习有三个前提要求的时候效率最高，有目的导向、有即时反馈的最近发展区。简单的说——能解决当下的问题，学会了有地方用的，难度适中的知识最有效。


    为什么在国内学个英语口语12年都学不好，走到国外3个月就能交流了？因为在国外，交流是刚需、有地方练习以及老外对你的发音口音很宽容，难度适中。这种时候三个条件都具备，效率就高，学得就快。


    所以你反过来也能理解——为什么刷那些《管理者必读的xx本书》的书单，对你意义不大，这些认知资源的目的性弱、缺乏实践环境、难度不一。


    那些标题党的微信文章，比如《不看这篇文章，错过了一个亿》，更是凭空制造出一个“需要解决的问题”。你回头思考下——即使你真的遇到了能让你获得一个亿的方式，这是你当前的问题吗？这是你当前的水_ll?
    这是你学了就能用的东西吗？


    我已经关掉朋友圈功能1个多月了，并没错过身边任何值得学习的东西——因为我学习的东西是极其功利的——从遇到的问题出发，从我能实践的领域出发去找合适的认知材料。


    这样一来，读的东西会少很多，基本解决了知识太多的问 题。


    ## 2. 极其功利的配置资源


    《如何阅读一本书》中，给阅读做了几个分类：娱乐性、知识性、心智性。如果比作爬山——


    +   娱乐性的是下坡，越走越舒服；

    知识性的是平坡，能开动，但是略微费力；

    心智提升类的是爬坡，看起来会很累，但是真的会提升脑力和理解力，理解新观点的速度会加快——也就是我们说的，学习力增强了。


    很多人天天学习，学习力却没有什么上升，随着年龄增长，自己的脑力体力下降，于是觉得“年岁大了，脑子不好使了”。其实是心智提升类书籍读的少的缘故。因为他主要的认知是娱乐性和知识性的——你哪怕读一辈子报纸，也并不会增加学习力。


    有时候很多人给我留言，说看不懂，要我说人话！——其实真正提升你的东西，并不会让你那么舒服的。


    学习其实也是一样，你可以根据认知目的不同，设定不同的目标、分配不同的资源。


    比如说我自己这个月的认知资源配置：


    +   认知性阅读：《人类群星闪耀时》、《反脆弱》等书的写作技术，为写书做准备。


    提高心智的认知难度很大，属于“攻读”——需要有大段的时间，系统的阅读。我一般放在早上或深夜。最好还要配置高人讨论以及实践的环境。我找到了业内最好的编辑和作者，一起讨论如何写好有冲击力的书。


    +   知识性阅读：各种行业调查报告、行业论坛、大量专业书籍如《人生设计》、《混沌生活》、《认识电影》、《好好学习》……


    知识性阅读的目标就是知道某事——所以特别适合碎片化学习和社交性学习。认知资源可以配置上下班路上，用碎片化时间，检索式的读；实在不行拜托别人读，然后交流；读的时候迅速判断是不是有用的知识，决定自己的涉入深度。


    +   娱乐性阅读：《爱情刈子手》、《理想的下午》、欧文·亚隆、舒国治、各种电影……


    娱乐性的学习，主要用来放松和陶冶，认知资源可以很低——放在累的时候翻几页。比如两次谈事之间读，有换脑子的感觉。


    最好的书是三者兼有，不同时能读出不同功用来的。比如说彼得·德鲁克的《旁观者》、《卓有成效的管理者》，比如《高效能人士的7个习惯》、《穷爸爸富爸爸》，比如文学中的《红楼梦》。


    所以，一定要强忍住买书的欲望，极其功利地分配资源——从你自己的需求开始，区分三种阅读，设定目标，分配资源。

