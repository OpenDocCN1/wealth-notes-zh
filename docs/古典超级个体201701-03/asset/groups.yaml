    古典


    其实所谓的一二线城市的童鞋们，他们也 很苦恼。比如：


    我一直在困惑一个问题——要不要回老家？我是 一个程序员，今年29岁了。在百度工作，自己并不属于大牛级别，也看不到机会。没户口，没有买房。我有一个同乡女朋友，她一直建议我回西安生活，这样一切都很
    好。我这个样子，该规划吗？


    # 关于如何选择城市


    我在一篇《逃离北上广？——那你在追寻些什么》解释得很清晰。稍作改动放在下面。


