    # 精华 | 搞清价值观，这10点必知 19-5


    19-5 精华 | 搞清价值观，这...


    1.价值观是内心对于价值之间的重要程度排序，我们每个人的生命、时间、资源都有限，知道什么是重要的，什么是更重要的，就是价值观。就好像指纹不同一样，每个人都有自己独特的价值观。


    2.一个人只有知道什么是更重要的，才会有稳定的欲求，才有可能被满足，也才有可能持续地积累。所以清晰稳定的价值观，是高手之路，也是好的合作者的必备条件。否则这个人永远是个漂泊者——在各种欲望和诱惑之中，摇摆不定——那些诱惑之所以是诱惑，因为你不知道什么是更重要的。


    3.价值观没有正确与否，只有真诚与否。理性 and 科学可以制造出核弹，但是对于人类应不应使用核弹这种事，其实是价值判断问题。越是重大的决策，越是需要价值观的参与。


    # 4.澄清自己的价值观：


    每个人都有自己的价值观，但是并不一定都能清晰地表达自己的价值观。所以价值观需要持续地澄清。一开始可以通过测评和删减法的方式来做。初步确定以后，价值观还需要一个持续探索、体验和践行的过程。正是这个过程，我们逐渐越来越了解自己。


    什么时候我们就知道价值观足够清晰了呢？当你能清晰地表达出来具体的内容，而不是一个抽象词汇；做决定的时候能想得起来；平时真的在主张和行动时，就真的清晰了。


    5.价值观都是正向的，即使那些很负面的行为，背后也有正面的价值观，只是用了错误的表现方式——因为每个人都追求更好的 人生。只不过他们看不到更好的方式。


    # 如何清晰价值观


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_101_0.png)


    价值观就像是我们心中按照重要程度排列的清单，是我们判断对错和做选择时的内在标准。


    # 6.目标=价值观X视野


    价值观-目标模型（VVG）：价值观就像是人生雷达，不断在视野里找到最大化价值的方式，形成目标。这就是价值观落地的VVG模型。当我们知道自己做的是符合价值观的目标，我们就身心如一。一旦我们偏离路线，就动力缺失，过上了假生活。


    当视野变大、价值观变化的时候，要及时调整自己的人生目标。


    # 7.与他人共赢的价值观：


    作为社会人，你肯定无可避免地掺和进来其他人的价值观。价值观不仅有方向也有强度，是个矢量。所以在弱小的 前期，你可能不得不按照他人的价值观来生活，寻求双赢。但是随着你自身实力越来越强，你的价值观比重越来越重要，你会越来越按照自己的方式生活。牛人之所以牛，是因为他们有强大清晰的价值观。


    # 视野-价值观-目标。三点一线


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_101_1.png)


    目标是价值观在视野中的最佳选项。当你找到这个选项，沿着这条路出发，你会内心宁静，动力十足，被梦想叫醒。


    # 8.价值观的改变规律


    从价值观地图的左边“开放”沿着“卓越，独立自主”或“博爱仁慈”，最终走向“稳定安全”。最好的方式不是一开始寻求“平平淡淡”，而是每个阶段都享受不同阶段的精彩。


    # 9.如何处理价值观内在冲突？价值观并不会冲突，冲突因为当前资源所限。一 种方式是放到不同时间阶段实现；一种是放在不同角色同时实现；还有一种方式是提高能力，扩大资源，期待同时实现。


    更重要的是，你可以通过教育、通过创造成就事件，调整价值观，保持年轻的心态。


    # 10.最后讲一个关于价值观的建议——尽可能多的体验人生，然后再做选择。


    难得来世界一趟，你要到处走走看看，至少知道自己有多少种可能，然后才有可能做选择。只有观完了世界，才有世界观。你需要一日看尽长安花，才知道此心安处是吾乡。


    很多人生活狭隘得只有判断题，别人安排好了一切，他只是选择——是、不是，喜欢、不喜欢。人生不应该是个判断题，至少是选择题。搞好了，还可以是个创作题。视野不足的所谓坚持选择，相当于没
    sở完题目就直接抢答，是矫情是任性，并不是做自己。


