    # 目标=价值x视野 19-2


    19-2 目标=价值x视野


    > “在一回首间，才忽然发现，原来，我一生种种的努力，不过只为了周围的人都对我满意而已。为了博得他人的称许与微笑，我战战兢兢地将自己套入所有的模式、所有的桎梏。走到途中才忽然发现，我只剩下—副模糊的面目，和一条不能回头的路。”


    这不是谁的独白，而是作家席慕蓉在她写的《独白》一书中的一段话。有没有也打动你？按照流行的话来说——“我可能过了一个假生活”。


    我们有自己的价值观，带着罗盘上路，为什么还会迷失自己？今天我为你介绍一个链接价值观与目标的VVG模型。


    价值观-视野-目标（Value-Vision-Goal），即：目标是价值在视野中的最佳选项。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_96_0.png)


    当你找到最佳选项，沿着这条路径出发，你的价值观、目标和行动都暂时完全一致，所以你内心宁静，动力十足，感觉被梦想叫醒——这就是走心的真人生。但是慢慢的，我们的视野和价值观都会发生变化，就会进入迷茫状态。


    下面3种情况，有没有击中你的？


    # 1. 视野变大，拉高目标


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_96_1.png)


    当视野变大，以前的目标A就不再能满足你，你需要重新根据自己的资源设定新的目标B。从A到B的路径才会让你重新获得动力十足的人生。


    # 2. 价值改变，调整目标


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_96_2.png)


    随着年龄、阅历、人生阶段的不同，价值观也会慢慢改变。比如一个人有了孩子，常常会把价值观从成就转为稳定，这个时候他的注意力就从“再冒一次险”变成了“稳定地获得收入，少加班”。


    公司也是一样，创业前期，组织价值观往往是“高速增长”；到了中、后期则是“组织发展”，这也会让组织在不同阶段重用不同的人才。


    如果我们能阶段性地复盘和定计划，梳理下价值观，重新盘点下资源，你就能定出阶段性让你兴奋的新目标。


    # 3.他人参与，共赢目标


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_96_3.png)


    更复杂的系统，是你的人生里加入了其他人的价值观。你也许认为自己是个自由大于一切的人，但是你父母一直希望你早点定下来；你的领导希望你更加稳重高效率一些；你的女朋友则希望你更加浪漫一点儿。这就涉及到了多方的多重博弈。这该怎么办？


    人都是社会性动物，自己特立独行肯定是没戏的，要学会双赢与合作。如上图一样，你需要在你和对方的价值观中找到一个合适的夹角，然后设定出一个双方都愿意达成的价值观，然后根据双方共同的视野，选择一个新的目标。


    那为什么我看到牛人都是很牛气，很有个性呢？为什么乔布斯这么专横，还能成功？


    因为你把因果倒置了。正因为他们无比的牛，他们的价值观强度很大，视野比一般人开阔，所以即使是比较弱的价值观，一旦进入牛人的价值观系统里，也会被牛人强化，并无限接近这些牛人原有的价值观。不是因为他们有个性而成功，而是因为成功才有个性。


    比如从“那个谁”到“星仔”到“星爷”，辈分与脾气日增的周星驰；比如你对比一下初上《对话》栏目青涩的马云和今天穿个休闲服和王健林叫板的马云。这也就是“现实扭曲力场”。


    反过来说，如果你一直就是被各种他人的价值观带着跑，很少思考和强化自己的价值观，自己的价值观力道自然就越来越弱，到后面就完全找不到感觉了——这就是传说中的“迷失自我”了。


    不管是因为缺乏对自己的觉察，还是疏于制定新目标，或者是在合作道路上过于独断、过于讨好，都会让自己的VVG模型（价值-视野-目标）不在一条直线上，这样的日子越走越没动力，最后只能被人群推着走。


    于是，我们过上了“假生活”。'
