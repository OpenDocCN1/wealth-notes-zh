    ## 我的才干检索：


    - 1.找一个安静的地方，找一张白纸对折2次分成四块。每一块对应一个字母S、I、G、N。

    2.然后按照大概7年为一个阶段，一段段回忆，寻找自己生命中的SIGN(信号)。

    3.从事件中间寻找共同点，并且尝试提炼出来，比如“写作、与人沟通、共情”。

    4.如果有更多时间，把前面学过的AEIOU法，也用进去。（见文章12-3）。你也可以结合测评来获得更多的对自身优势的认识。


    - 我童年阶段，有哪些S.I.G.N的经历？

    小学阶段，有哪些S.I.G.N的经历？

    中学阶段，有哪些S.I.G.N的经历？

    大学到毕业后几年阶段，有哪些S.I.G.N的经历？

    30岁前后，有过哪些S.I.G.N的经历？


    这大概需要花你40分钟的时间——你需要一个阶段，一个字母地检索，尽可能多地回忆——简单地写下事件关键词，等全部写完再做总结。如果没有时间，只回顾近7年的也可以。


