    今天是古典陪伴你成长的第133天，一起加速，成长为更好的自己。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_100_0.png)


    # 精华 | 搞清价值观，这10点必知 19-5


    19-5 精华 | 搞清价值观，这...


    1.价值观是内心对于价值之间的重要程度排序，我们每个人的生命、时间、资源都有限，知道什么是重要的，什么是更重要的，就是价值观。就好像指纹不同一样，每个人都有自己独特的价值观。


    2.一个人只有知道什么是更重要的，才会有稳定的欲求，才有可能被满足，也才有可能持续地积累。所以清晰稳定的价值观，是高手之路，也是好的合作者的必备条件。否则这个人永远是个漂泊者——在各种欲望和诱惑之中，摇摆不定——那些诱惑之所以是诱惑，因为你不知道什么是更重要的。


    3.价值观没有正确与否，只有真诚与否。理性 and 科学可以制造出核弹，但是对于人类应不应使用核弹这种事，其实是价值判断问题。越是重大的决策，越是需要价值观的参与。


    # 4.澄清自己的价值观：


    每个人都有自己的价值观，但是并不一定都能清晰地表达自己的价值观。所以价值观需要持续地澄清。一开始可以通过测评和删减法的方式来做。初步确定以后，价值观还需要一个持续探索、体验和践行的过程。正是这个过程，我们逐渐越来越了解自己。


    什么时候我们就知道价值观足够清晰了呢？当你能清晰地表达出来具体的内容，而不是一个抽象词汇；做决定的时候能想得起来；平时真的在主张和行动时，就真的清晰了。


    5.价值观都是正向的，即使那些很负面的行为，背后也有正面的价值观，只是用了错误的表现方式——因为每个人都追求更好的 人生。只不过他们看不到更好的方式。


    # 如何清晰价值观


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_101_0.png)


    价值观就像是我们心中按照重要程度排列的清单，是我们判断对错和做选择时的内在标准。


    # 6.目标=价值观X视野


    价值观-目标模型（VVG）：价值观就像是人生雷达，不断在视野里找到最大化价值的方式，形成目标。这就是价值观落地的VVG模型。当我们知道自己做的是符合价值观的目标，我们就身心如一。一旦我们偏离路线，就动力缺失，过上了假生活。


    当视野变大、价值观变化的时候，要及时调整自己的人生目标。


    # 7.与他人共赢的价值观：


    作为社会人，你肯定无可避免地掺和进来其他人的价值观。价值观不仅有方向也有强度，是个矢量。所以在弱小的 前期，你可能不得不按照他人的价值观来生活，寻求双赢。但是随着你自身实力越来越强，你的价值观比重越来越重要，你会越来越按照自己的方式生活。牛人之所以牛，是因为他们有强大清晰的价值观。


    # 视野-价值观-目标。三点一线


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_101_1.png)


    目标是价值观在视野中的最佳选项。当你找到这个选项，沿着这条路出发，你会内心宁静，动力十足，被梦想叫醒。


    # 8.价值观的改变规律


    从价值观地图的左边“开放”沿着“卓越，独立自主”或“博爱仁慈”，最终走向“稳定安全”。最好的方式不是一开始寻求“平平淡淡”，而是每个阶段都享受不同阶段的精彩。


    # 9.如何处理价值观内在冲突？价值观并不会冲突，冲突因为当前资源所限。一 种方式是放到不同时间阶段实现；一种是放在不同角色同时实现；还有一种方式是提高能力，扩大资源，期待同时实现。


    更重要的是，你可以通过教育、通过创造成就事件，调整价值观，保持年轻的心态。


    # 10.最后讲一个关于价值观的建议——尽可能多的体验人生，然后再做选择。


    难得来世界一趟，你要到处走走看看，至少知道自己有多少种可能，然后才有可能做选择。只有观完了世界，才有世界观。你需要一日看尽长安花，才知道此心安处是吾乡。


    很多人生活狭隘得只有判断题，别人安排好了一切，他只是选择——是、不是，喜欢、不喜欢。人生不应该是个判断题，至少是选择题。搞好了，还可以是个创作题。视野不足的所谓坚持选择，相当于没
    sở完题目就直接抢答，是矫情是任性，并不是做自己。


    # 价值观地图


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_101_2.png)


    人生从“开放”起步，中间是2条不同的自我实现之路，有人追求“自我卓越”，有人追求“仁慈博爱”，最后都步入“保守”。


    # ——每日践行——


    把本周价值观内容分享给你的另一半，并借助专栏19-1的内容互相了解彼此的前三位价值观是什么。如果你单身，就分享给最好的朋友。如果你没有最好的朋友……已经这么可怜了，今天的践行就给你放假了吧。


    # 一定要看｜我想讲的，都在这个故事里 19-6


    周六，我第一次尝试在这个时间发出一些特别好的文字。


    不是我的原创，我也无力转述，也不是为了偷懒，仅仅仅是因为我非常非常期待你能读到这些文章，我相信这比再学个什么知识多多了。


    今天这篇是来自当年明月写的《明朝那些事儿》结尾的最后四千字。洋洋洒洒的7部明史，最后竟然用徐霞客的故事收尾。他在最后反复地强调“我想讲的东西，就在这个故事里，我讲完了。”


    # 学完了价值观的你，听懂了吗？


    徐宏祖出生的时候，是万历十五年。


    在这个特定的年龄出生，真是缘分，但外面的世界，跟徐宏祖并没有多大关系，他的老家在江阴，山清水秀，不用搞政治，也不敢被人砍，比较清净。


    在旅行的过程中，他还开始记笔记，每天的经历，他都详细记录下来，鉴于他本人除姓氏外，还有个号，叫做霞客，所以后来，他的这本笔记，就被称为《徐霞客游记》。


    崇祯九年（1636），五十岁的徐宏祖决定，再次出游，这也是他的最后一次出游，虽然他自己没有想到。


    正当他考虑出游方向的时候，一个和尚找到了他。


    这个和尚的法号，叫做静闻，家住南京，他十分虔诚，非常崇敬鸡足山迦叶寺的菩萨，还曾刺破手指，血写出一本法华经。


    鸡足山在云南。


    当时的云南鸡足山，算是蛮荒之地，啥也不通，要去，只能走着去。


    很明显，静闻是个明白人，他知道自己要一个人去，估计到半路就歇了，必须找一个同伴。


    徐宏祖的名气，在当时已经很大了，所以他专门找上门来，要跟他一起走。


    对徐宏祖而言，去哪里，倒是个无所谓的事，就答应了他，两個人一起出发了。


    他们的路线是这样的，先从南直隶出发，过湖广，到广西，进入四川，最后到达云贵。


    不用到达云贵，因为到湖广，就出事了。


    走到湖广湘江（今湖南），没法走了，两人坐船准备渡江。


    渡到一半，遇上了强盗。


    对徐宏祖而言，从事这种职业的人，他已经遇到好几次了，但静闻大师，应该是第一次。此后的具体细节不太清楚，反正徐宏祖赶跑了强盗，但静闻在这场风波中受了伤，加上他的体质较弱，刚撑到广西，就圆寂了。


    徐宏祖停了下来，办理静闻的后事。


    由于路上遭遇强盗，此时，徐宏祖的路费已经不足了，如果继续往前走，后果难以预料。


    所以当地人劝他，放前進念头，回家。


    徐宏祖跟静闻，是素不相识的，说到底，也就是个伴，各有各的想法，静闻没打算写游记，徐宏祖也没打算去礼佛，实在没有什么交情。而且我还查过，他此前去过鸡足山，这次旅行对他而言，并没有太大的意义。


    然而他说，我要继续前进，去鸡足山。


    当地人问：为什么要去。


    徐宏祖答：我答应了他，要带他去鸡足山。


    可是，他已经去世了。


    我带着他的骨灰去。答应他的事情，我要帮他做到。


    徐宏祖出发了，为了一个逝去者的愿望，为了实现自己的承诺，虽然这个逝去者，他并不熟悉。


    旅行很艰苦，没有路费的徐宏祖背着静闻的骨灰，没有任何资助，他只能住在荒野，靠野菜干粮充饥，为了能够继续前行，他还当掉了自己所能当掉的东西，只是为了一个承诺。


    就这样，他按照原定路线，带着静闻，翻阅了广西十万大山，然后进入四川，越过峨眉山，沿着岷江，到达甘孜松潘。


    渡过金沙江，渡过澜沧江，经过丽江、经过西双版纳，到达鸡足山。


    迦叶寺里，他解开了背上的包裹，拿出了静闻的骨灰。


    到了。


    我们到了。


    他郑重地把骨灰埋在了迦叶寺里，在这里，他兑现了承诺。


    然后，他应该回家了。


    但他没有。


    从某个角度讲，这是上天对他的恩赐，因为这恰是他的最后一次旅途，能走多远，就走多远吧。


    他离开鸡足山，又继续前行，行进半年，翻越了念仓山，又行进半年，进入藏区，游历几个月后，踏上归途。


    回去没多久，就病了。


    喜欢锻炼的人，身体应该比较 Fix，天天锻炼的人（比如运动员），就不一定好，旅游也是如此。


    估计是长年劳累，徐宏祖终究是病倒了，没能再次出行。崇祯十四年（1641），病重逝世，年五十四。


    他所留下的笔记，据说总共有两百多万字，可惜没有保留下来，剩余的部分，大约几十万字，被后人编成《徐霞客游记》。


    在这本书里，记载了祖国山川的详细情况，涉及地理、水利、地貌等情况，被誉为十七世纪最伟大的地理学著作，翻译成几十国语言，流传世界。


    好的，总结应该出来了，这是一个伟大的地理学家的故事，他为了研究地理，四处游历，为地理学的发展做出了突出贡献，是中华民族的骄傲。


    是这样吗？


    不是的。


    其实讲述这人的故事，只想探讨一个问题——他为何要这样做？


    没有资助，没有承认（至少生前没有），没有利益，没有前途，放弃一切，用一生的时间，只为了游历？


    究竟为了什么？


    我很疑惑，很不解，于是我想起另一个故事。


    新西兰登山家希拉里，在登上珠穆朗玛峰后，经常被记者问一个问题：


    你为什么要爬？


    他总不回答，于是记者总问，终于有一次，他答出了一个让所有人都无法再问的答案：


    因为它（指珠峰），就在那里！


    因为它就在那里。


    其实这个世上很多事，本不需要理由，之所以需要理由，是因为很多人喜欢找抽，抽久了，就需要理由了。


    正如徐霞客临终前，所说的那句话：


    > “汉代的张骞，唐代的玄奘，元代的耶律楚材，他们都曾游历天下，然而，他们都是接受了皇帝的命令，受命前往四方。”


    > “我只是个平民，没有受命，只是穿着布衣，拿着拐杖，穿着草鞋，凭借自己，游历天下，故虽死，无憾。”


    说完了。


    我要讲的那样东西，就在这个故事里。


    我相信，很多 人会问，你讲了什么？


    用如此之多的篇幅，讲述一个王朝的兴起和衰落，在终结的时候，却说了一个故事，你到底想说什么？


    我重复一遍，我要讲的那样东西，就在这个故事里，已经讲完了。


    所以后面的话，是讲给那些不明白的人，明bai的人，就不用继续看了。


    此前，我讲过很多东西，很多兴衰起落、很多王侯将相、很多无奈更替、很多风云变幻，但这件东西，我个人认为，是最重要的。


    因为我要告诉你，所谓千秋霸业，万古流芳，以及一切的一切，只是糞土。先变成糞土，再变成土。


    现在你不明白，将来你会明白，将来不明白，就再等将来，如果一辈子都不明白，也行。


    而最后讲述的这件东西，它超越上述的一切，至少在我看来。


    但这件东西，我想了很久，也无法用准确的语言，或是词句来表达；用最欠缺的话说，是只可意会，不可言传。


    然而我终究是不欠缺的，在遍阅群书，却无从开口之后，我终于从一本不起眼，且无甚价值的读物上，找到了这句适合的话。


    这是一本台历，一本放在我面前，不知过了多久，却从未翻过，早已过期的台历。


    我知道，是上天把这本台历放在了我的桌前，它看着几年来我每天的努力，始终的坚持，它静静地，耐心地等待着终结。


    它等待着，在即将结束的那一天，我将翻开这本陪伴我始终，却始终未曾翻开的台历，在上面，有着最后的答案。


    我翻开了它，在这本台历上，写着一句连名也不说明白的名人名言。


    是的，这就是我想说的，这就是我想通过徐霞客所表达的，足以藐视所有王侯将相，最完美的结束语：


    成功只有一个——按照自己的方式，去度过人生。


    # （全文完）


