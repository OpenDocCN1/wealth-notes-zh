    # 短板已死，优势永生

    ——你从未真正理解的木桶原理16-1


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_56_0.png)


    Hi，你好，发现你的优势，聚焦人生可能，欢迎来到《超级个体》优势管理专题！


    16-1 短板已死，优势永生...


    歌手李健在节目《开讲了》谈及到自己如何走上音乐之路：


    > “我们宿舍有六个人，每个人都有特长。我们上铺是一个对哲学很感兴趣的人，他大一的时候就看黑格尔。另外一个室友是不停地学语言，学英语、学日语、学法语、学德语。也有获得奥林匹克数学金牌、物理金牌的，他们总是只要什么题目就能考到97、98分。但对我来讲不一样，我可以通过努力、通过勤奋，考到六七十分、顶多八十分算不错了。但是我参加的一些歌唱比赛，基本上都是第一名。”


    李健毕业后依据专业选择了广电总局，但并没有感受到工作的成就感——直到几年后卢庚戌点醒他，并邀请他共同创立水木年华，他才开始走上音乐人的道路。


    我并不准备说：“如果你有一个音乐梦想就要去实现”这样的鸡血，李健的成功是多因素的综合。但是我想指出的是——


    许多人和李健一样，很早就以各种方式接触过自己的天赋，但却一直没有真正上心——直到自己被生活或者其他天赋运用者打击，或者被人“踹”了一脚，才开始真正思考自己的优势，并围绕自己的天赋和优势设计自己的人生。


    # 我们大部分人都在荒废自己的天赋和优势。


    如果不是被卢庚戌这个朋友“踹”一脚，李健也许不会走上这条音乐人之路。


    我们这一周，就准备“踹”（try）你一脚。


    # ——关于优势的3个误区——


    今天，人人都在谈论优势、长板原理，每个人也都知道应该发挥自己的优势。


    但是你真的问他：


    > “你的优势是什么？”


    很多人就答不上来，说不清楚；即使有些人知道自己有什么优势，但又总是羡慕别人身上“含金量”更高的优势；即使知道、也欣赏自己的优势，也很少有人（估计不超过10%）真正投入足够多的精力，甚至是以优势来设计自己的人生。


    # 彼得·德鲁克看得明白：


    > “多数人都以为，他们知道自己擅长什么。其实不然，更多的情况是，人们只知道自己不擅长什么——即便在这一点上，也往往认识不清。”


    我们先从常见的几个误区开始入手，谈谈关于优势的一些观念。


    # 1.持续纠错，就能成功？


    如果你能纠正一个弱点，你会变得好一些——所以我们很自然地认为——只要可以纠正所有的弱点，我们就会成为一个完美的人。


    其实纠错顶多能让你得70分。以写文章为例，如果拼写和句法准确无误，你的文章就能得优吗？三年级也许可以，但是以后就不能了——因为不出错只是个基础要求。


    反过来，如果优势足够强大，有弱点也无所谓——海明威就是个以拼写和句法错误而闻名的作家。但是并不妨碍他成为20世纪美国最伟大的小说家。毕竟写作的真谛在于真知灼见，何况还有一堆编辑兜着呢。


    # 事实上，真正让你达到100甚至120分的——是你才干加努力。就像李健遇到的，在中学成绩稍微对付下就能进前几名，但是到了清华，高手林立，只有聚焦自己的长处、扬长避短才有机会胜出。


    你也许会说——这个我都知道——不过即使这样，大部分人对于扬长的投入还是不够。


    # 2.你还是扬长不够。


    有没有发现平时哪都能打到车，可一下雨，出租车总是特别不好打？更加恼火的是，好不容易遇上一个，人家又说要收工——雨天司机收工也特别早。


    有学者研究过这个现象，他们发现，司机倾向于通过每天“要赚多少才能不亏”的方式来计算自己的工作时间，比如一天拉500块，一旦赚够了，就停止工作。雨天打车人多，加价多，所以收工早，而平时活不多，他们的工作时间则加长。


    其实真正聪明的做法是在雨天（单位时间收入高）的时候多干，在晴天（没活的时候）早点回家休息。


    经济学中的“前景理论”对此的解释是，我们对于“多赚”与“少得”的敏感程度不一样——我们对于让自己“不亏”的心理动力，远远高于让自己“多赚”的心理动力。


    为了不亏，我们弥补弱势的时间远远胜于发挥优势的时间，我们查缺补漏的热情远高于我们关注优点的热情；为了不亏，我们在自己的“晴天”领域——那些平平常常的领域要了亲命地干，在我们本可以收获更多的“雨天”领域，则随随便便对付。

