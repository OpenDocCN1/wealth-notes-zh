    # 想优雅地离职？学关羽

    18-3


    Hi，入市有风险，跳槽需谨慎，欢迎来到本 бои跳槽专题！


    18-3 想优雅地离职？学关羽


    # ——一个观察——


    你一定在港片中看到过这一幕——黑社会大佬要出去砍人，出门前先拜拜关二哥，有趣的是，警察出去抓人，也要拜拜关二哥。在中国文化中，上得庙堂、下得厅堂，事业单位和民企都热爱的神，关羽独一个。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_86_0.png)


    这也难怪，兄弟们喜欢他——所以他从杀人亡命的黑社会做到汉朝前将军；领导喜欢他——因为他义字当头，追随刘备报效曹操；老百姓喜欢他——因为他凌上不欺下。


    关二哥实在太会做人了。


    # ——一个策略——


    今天从关羽的一个故事，谈谈该如何优雅地转换组织的四条法则。


    关羽在刘备麾下打仗，被曹操生擒。曹操爱才，封他为偏将军。一边厚待，一边让张辽去做做思想工作，看能不能留下他。


    关羽长叹一声：“我知道曹公对我很好。但是我和刘备大哥发誓要同年同月同日死，不能背信弃义。我不会留太久的，但是我会立下一点功劳，报答曹公。”


    > （原文：“吾极知曹公待我厚，然吾受刘将军厚恩，誓以共死，不可背之。吾终不留，吾要当立功以报曹公乃去。”）


    张辽如实告诉曹操，曹操义之。等到关羽杀完颜良，曹操知道他要走，大加赏赐。关羽拒绝了所有赏赐，写了封信给曹操，悄悄离开，找大哥刘备去了。留下了千里走单骑的佳话。


    不能不佩服关羽，在辞职换单位之际，他做对了4件很重要的事。


    # 1.好的离职时机


    关羽一开始就决定最后肯定要走，但什么时候走？

