    ## 第二个区分，要区分开问题和人


    拖延描述的是行为而不是人。


    问题并不等于人，并不能说“我们天生就是个爱拖延的人”。你只是“在某些领域更容易出现拖延状态”罢了。绝大部分人都可以通过练习让自己的拖延降低到能愉快生活工作的程度。万事都拖延和零拖延的人不存在。


    有了这两个区分，我们就先让自己跳出一个大坑——“过度战拖”。


    你恨自己拖延没问题——但报仇也得找对人，不可滥杀无辜。《天龙八部》里面，乔峰杀死了阿朱铸成一生的悔恨。他要是每天滥杀一个呢？那就不是大侠，而是魔头了。


