    # 如何把发现的才干用到工作中去？ 17-1


    Hi，你好，发现你的优势，聚焦人生可能，欢迎来到《超级个体》优势管理专题！


    17-1 如何把发现的才干用到...


    # ——一个观察——


    关于才干优势我最喜欢的一个比喻，是来自古希腊人。


    他们认为天赋是你身边看不见的“守护神”。他会在你不知道的时候暗中保护你，如果你要召唤它，你需要清晰地喊出这些守护神的名字。每个神都有自己独特的能力、脾气，也都有自己的阴暗面，真正的勇者懂得合理调用他们的力量。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_70_0.png)


    # ——一个策略——


    才干也一样——很多时候我们只是“隐隐约约”觉得自己有才干，就好像隐藏在你身边的守护神，虽然能保护你，但是你无法召唤，你也许需要给他们一个清晰的名字。


    上 一周我们用测评、SIGN等很多方式，总算是知道了他们的名字，今天我们进一步让他们现身，看清楚他们的形象，了解他们的脾气，也知道他们的弱点，这样你能更好地调用你的守护神。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_70_1.png)


    4个方面，给你的天赋做个画像！


    下面是让自己看清楚这些才干的“才干卡片”以及“优势取向的工作”。


    # 才干素描


    用4个问题进一步勾勒关于才干的形象。如果有测评，你会在测评报告上找到很多类似的线索；也可以通过讨论知道更多。


    # 1.在哪用？


    环境和领域：我的这个优势，在什么领域适合用？（项目的哪个阶段？什么专业领域？）


    # 2.对内：在个人成长方面怎么用？


    我的这个优势，如何帮助我更快地成长？


    # 3.对外：在为人处事、管理方面怎么用？


    我的这个优势，在我做事、做人、管理时应该关注哪些重点？


    # 4.如何防止滥用？


    我的这个优势有什么阴暗面？我该用什么方式规避？找谁支持下？


    前面三个很好，内在逻辑基于《超级个体》的能力模型（见专栏第一条发刊词）。选择合适的领域（生涯规划、职业定位）；以自我成长为核心，围绕的是产品能力（专业技能，做事能力）、媒体能力（传播能力，影响力）、运营能力（领导管理，做人能力）。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_70_2.png)


    我重点说说防止滥用。所有的才干都有自己的阴暗面。


    为了让大家更好地理解“才干素描”，现在以我自己的一个优势——“理念”为例子。


    我是一个极端喜欢和关注“理念”的人，总能看到事物之间的联系。当然这个优势也有阴暗面，过于关注“理念”让我容易飘，做事不接地气。


    下面关于“理念”优势应用的这四个方面：


    # 环境（在哪里用？）


    +   适合进入项目的策咙阶段、尤其是理念搭建阶段；


    适合成为一名专业人士、擅长研发；


    适合进入那些需要持续进行理念学习的领域，比如生涯规划、咨询之类的。


    我大量参与了很多公益和商业项目策划、天使投资、咨询等活动。


    # 自我管理（在个人成长方面怎么用？）


    +   每天一定要留出足够的思考和学习时间，学到新知识，想明白一件事，自己睡觉都是安稳的。跑步也有了意义——是一个思考的好时间。


    每天晚上11-1点会花时间看书、思考、写作。每周周末会有半天时间独处。


    要认识各个方面的“理念”高手，持续地组织思想夜宴。


    # 做事重点（在为人出事、管理领导方面怎么用？）


    +   要在理念比较重要的项目、环节投入更多精力，放手执行层面。


    参与品牌设计、理念传递、企业文化、心智改变等方面事情。


    在传播和管理时，更快地抓住好的、最新的理念，给大家拆解和介绍那些看上去非常复杂的概念，这是我的重要价值之一。


    # 盲区与支持（如何防止滥用？）


    “理念”好的人，总容易看不惯太务实的人，其实“理念”需要务实的人实现，否则就永远是理念。所以多找实干家，学会用他们的语言说话。


    “理念”好的人表达容易虚，而且思考过快。所以要学习图示、讲故事、脑图等方式，把自己的抽象概念具象化，让更多人理解。


    “理念”好的人容易自嗨，一定要点批评家、分析家来刺激你，让你有机会锤炼自己的理念。'
