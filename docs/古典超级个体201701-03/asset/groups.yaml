    ## 写给努力却学不好的人，给大脑注入知识晶体22-2


    22-2 写给努力却学不好的...


    怎么形容努力学习又不懂学习的人的悲哀？


    我写了个三句半，你看是不是这样：


    书到用时方恨少，话到嘴边没地儿找，别 人一说都看过


    只好感叹，我靠，你讲得真好


    唉，我是不是长了个假脑子啊。


    我们今天来谈谈如何有效地提取知识。


    ### ——一个概念——


    ### 知识晶体


    我们都知道，铅笔芯的石墨和坚硬的钻石都是碳原子组成，不过钻石的碳原子之间形成了非常稳定的晶体结构，这也是钻石是已知自然界最硬的物质的原因。钻石的硬度，来源于他的结构。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_0.png)


    钻石原子结构 ●-C


    另一个例子是沙子和混凝土，散沙根本抓不住，使劲就散了。但是混入了水泥和石块，这些东西之间形成结晶，散乱的沙子能够建起一座高楼。


    知识也是一样——知识的结构和知识的元素一样重要。如果知识点之间能够像晶体一样，在知识之间形成稳定的架构。知识就形成一种“知识晶体”——《超越智商》中斯坦洛维奇中称为crystallized
    intelligence。知识从散装变成了晶体，就变得不容易磨损，强度很大，也容易整体提取。


    星座就是个特别典型的知识晶体。


    ### 4种知识结构


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_1.png)


    知识晶体的多少，决定了一个人的专业程度。让脑子里的知识形成晶体，才是你知识提取能力形成的关键。


    ### 4种知识结构


    ### 1. 树状结构：体现事物层级，包含关系


    MIT计算认知科学实验室主任Josh用计算模拟了循环结构、星星结构、方块结构、链条结构等，最终用数学方法证明人类最佳的抽象知识结构是树状结构。


    ### 2. 关联结构：体现事物相互关系


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_2.png)


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_138_3.png)


    ### 3. 序列关系：体现先后、因果关系


    序列关系是一种流程图的知识结构。展现事情的前后、因果和逻辑关系。


    最常见的就是工作流程图，就是说明书的步骤指南——第一步，第二步然后是第三步。比如我提到的“不从第一页读书法”就是典型的序列关系：找书-目录-章节。


    再比如我们转载的求职逻辑图，如下一—一件事从上到下全做完才算完。


    都是典型的因果结构。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_0.png)


    ### 4. 数据结构：体现数量差异关系


    最后一种知识的结构，是数据结构。平时常见的柱状图、饼状图、增长曲线……


    数据图展示的是事物空间、时间上的差异性。这就不多说了。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_1.png)


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_2.png)


    有很多知识结构呈现之巧妙，真的是让人叹为观止。他们本身就自带美感，比如太极八卦图。


    黑白两个部分平分秋色，代表阴阳调和，相互依存和平衡。


    阴鱼的眼睛是阳，阳鱼的眼睛是阴，再增加一点动态弧线，展现出阴阳的相互依存又相互转化，对方就是转化的诱因和方向。这是时间和因果关系。


    在太极图的旁边，3个连续或者断开横条组合，形成8个不同的卦象。这8卦两两重叠，展现出64种不同的卦象。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_139_3.png)


    ### —— 一个技术 ——


    ### 如何提升这方面的能力？


    ### 1. 大量看模型


    不仅要看，还要每次思考这个模型希望表达的关系。这一点我们《超级个体》专栏的童鞋特幸运，我是个知识晶体控——每天的成长卡，就是一个知识晶体。这个专栏的订阅者应该已经有63个了。你大可以自己琢磨。


    ### 2. 自己尝试模仿


    看了一个模型一段时间后，不妨关掉图片，自己画一遍。


    费曼技巧转述时，也可以自己尝试画一遍，看看和原来的架构有什么区别，找到差距再调整。


    时间一长，你脑子里的模块足够多，知识自动就按照模型存放了。


    ### 3. 强迫自己写本书


    这个是高阶用法——每当我需要研究点什么，我先假设自己要出一本书，然后先列我自己作为初学者的所有问题，然后按照逻辑给这些问题编成一个目录。


    我对这个领域一无所知，但是知识结构却已搭好，只等散装知识来吸附了。


    后来我看到阳志平老师的文章，他的方法和我一样，还升级了一版：“不断问自己，书的体系是什么，有哪些打动读者的地方？”


    就是这样。


    前几天有人发留言：


    > “难道说‘得到’大咖的知识，都是教我们的时候学会的吗？”


    我赶紧截图发给罗胖。


    > “完了，被人发现我们的商业秘密了！”


    信不信由你啰。


