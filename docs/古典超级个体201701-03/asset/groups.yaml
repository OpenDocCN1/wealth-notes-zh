    # 问答 | 价值观冲突？给你3个方法 19-4


    # 价值观矛盾怎么办？


    葛淼：“仁慈博爱与追求卓越为什么是矛盾的呢？”


    古典


    首先明确一个内容——价值观并不矛盾，只是距离比较远。


    如果把北京市区比作一张价值观地图，东边繁华绚烂，西边学术氛围浓厚。北京中关村在西北，CBD在东南。两者只是相距很远，来回路上就得3小时，没法同时兼顾罢了。


    第二个是——矛盾是因为你资源不足。


    通勤3小时这事对于上班族的确矛盾。但是如果你有直升飞机可能就不矛盾了，你完全可以2小时切换一下。或者你有大把时间，你上午去一个地方，下午三里屯喝茶，晚上去一个地方，也不矛盾。


    矛盾是因为你有太多欲望，但拥有的时间太少。价值观就是提醒你把资源先投入到对你更重要事情上去。


    不过如果你实在割舍不了任何一个，平衡也是一种方式。


    # 1. 不同时间玩不同的价值观


    比如尔·盖茨、扎克伯格——年轻的时候好奇、新鲜、探索，然后找到机会迅速做大做强，然后搭建组织，迅速做稳，最后转身离开做公益慈善。


    佛陀出家前是净饭王太子，幼年住在皇宫尽享人间繁华，学完了文艺武艺，还有美好的嫔妃和宫女们陪伴左右，而后才决心修行——所以你一开始就舍掉很多欲望，只做一两件事就比较难，因为总会想。


    我的一个朋友李萍老师是个很智慧的人，当她孩子从海外留学回来，正是放开手脚做点事时候，孩子却告诉她自己梦想就是开个咖啡馆，好好地过宁静快乐的日子。一般的妈妈早炸毛了，她却特别淡定——


    > “妈妈支持你的梦想，不过我建议你可把这个梦想放到35岁实现。这样你有了自己的一群好朋友，每天可以在咖啡厅聊有趣的事情。你也有了经济基础，不用为咖啡厅的花费担忧，这样做起来心情更舒畅。”


    的确，每个梦想都值得实现，但不一定是马上。


    # 2. 同一时间，不同角色做不同的价值观


    前面说的查尔斯·汉迪在《象与跳蚤》里提到的组合式人生（见文章2-2），也是一种人生方式，在工作中卓越，在家庭里友善，每年还抽出时间做公益，博爱慈善优先。


    # 3. 同时拥有两个相距很远的价值观，是一种诅咒，当然也是一个巨大的礼物


    如果你必须同时拥有2个冲突的价值观，也不是不行，但这是个巨大的修炼，因为你需要学习——如何把2个完全不同的东西拈合在一起。


    比如说达芬奇，就是把艺术、开放、好奇和探索的天性，完美地和自己严苛、规律的自律和守时结合到了一起。甘地年轻的时候是个吊儿郎当的律师，在南非被辱后惊醒——他的仁爱毋庸置疑，他的卓越、自律超越也非常清晰。


    自由又自律，爱人又爱己，这种价值观的左右互博虽然难控制，但一学会就是大招。


    # 怎么确定自己的价值观呢？


    古典


    # 体验-践行-定见


    至少要体验下吧——体验一开始可以是间接体验，比如看看小说，看看电影，旅游一段；慢慢地是直接体验，尝试一下，进入他们的圈子，义务做点相关的事。


    然后是践行——这个时候度过了开始的新鲜期，你大概知道你喜欢的到底是新鲜还是价值观了。


    我是国内比较早的那批背包客之一，大概是02、03年。当时大家的说法都是“我的灵魂在路上”、“要背上包走遍天涯”。现在回想起来，有90%的人都不是真正的背包民族——有些校出门15天就想家了，这其实是新鲜感；有些低头猛跑全中国，各种犇行，根本不看风景不看人，求的只是成就感；有些是到一处就拍照、写文、发博文、写书，求的是认同感。


    践行一段，深知自己的价值观，我看重的不∈漂泊，而是好奇。这种好奇在商业、心理、科学、人文也都能旅行。


    最后一个阶段是定见——当你试穿完所有的价值观，也践行了一段，你就越来越坚定地相信某些价值观，这就是定见。然后你就踏实了，老老实实用这个来作准则。一旦找到第一次的基准点，以后就调调整很多。隔段时间校准一下，心里非常宁静。


    所以价值观是进入不确定航海时代的罗盘。


    正如“超级个体”原小青说：


    > 今天老师那句“并不是平平淡淡才是真，平平淡淡只是最后一个阶段”，戳到我的痛点了。年轻时，我是多么欣赏甚至推崇“平平淡淡才是真”啊，有什么失意的事情，也会用这句歌词来安慰自己。现在回想，我怎么悟性就这么低呢？怎么就忘了歌名是《再回首》呢？老了才能回首，年轻时就该是想做就做，冲冲打打。


    最后讲一个性价比不一定最好，却是我信奉的人生方式：


    难得来世界一趟，你要到处走走看看，至少知道自己有多少种可能，然后才有可能做选择。只有观完了世界，才有世界观。你需要一日看尽长安花，才知道此心安处是吾乡。


    很多人生活踯躅得只有判断题，别人安排好了一切，你只有打钩打叉。


    人生不应该是 tầng判断题，至少是选择题。搞好了，还可以是个创作题。视野不足的所谓坚持选择，相当于没弄完题目就直接抢答，是矫情是任性，并不是做自己。


