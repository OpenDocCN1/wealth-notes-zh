    # 想优雅地离职？学关羽

    18-3


    Hi，入市有风险，跳槽需谨慎，欢迎来到本周跳槽专题！


    18-3 想优雅地离职？学关羽


    ## ——一个观察——


    你一定在港片中看到过这一幕——黑社会大佬要出去砍人，出门前先拜拜关二哥，有趣的是，警察出去抓人，也要拜拜关二哥。在中国文化中，上得庙堂、下得厅堂，事业单位和民企都热爱的神，关羽独一个。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_86_0.png)


    这也难怪，兄弟们喜欢他——所以他从杀人亡命的黑社会做到汉朝前将军；领导喜欢他——因为他义字当头，追随刘备报效曹操；老百姓喜欢他——因为他凌上不欺下。


    关二哥实在太会做人了。


    ## ——一个策略——


    今天从关羽的一个故事，谈谈该如何优雅地转换组织的四条法则。


    关羽在刘备麾下打仗，被曹操生擒。曹操爱才，封他为偏将军。一边厚待，一边让张辽去做做思想工作，看能不能留下他。


    关羽长叹一声：“我知道曹公对我很好。但是我和刘备大哥发誓要同年同月同日死，不能背信弃义。我不会留太久的，但是我会立下一点功劳，报答曹公。”


    > （原文：“吾极知曹公待我厚，然吾受刘将军厚恩，誓以共死，不可背之。吾终不留，吾要当立功以报曹公乃去。”）


    张辽如实告诉曹操，曹操义之。等到关羽杀完颜良，曹操知道他要走，大加赏赐。关羽拒绝了所有赏赐，写了封信给曹操，悄悄离开，找大哥刘备去了。留下了千里走单骑的佳话。


    不能不佩服关羽，在辞职换单位之际，他做对了4件很重要的事。


    ## 1.好的离职时机


    关羽一开始就决定最后肯定要走，但什么时候走？

    除了金三银四，高级人才跳槽的最好时机是一——完成一个阶段性任务，立下点功劳以后。


    ## 2.一个无法拒绝的理由


    为什么要离职？你需要有一个理由。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_86_1.png)


    ## 3.正确的辞职对象


    关羽对曹操派来的兼职人力资源张辽表达过自己的离职想法，但是他正式告知离职时，却是通过辞职信——休书一封。直接交给了直接领导曹操，然后悄悄地离开。


    ## 4.持续地保持情感账户


    理由很简单——因为越是好的人才、高级圈子，人数越少。抬头不见低头见，昨天的故人可能明天就是合作对象，你要为自己留后路。


    这不，关羽在华容道看到了落魄的曹操，冒着砍头的危险，放了曹操。


    所以即使你离职了，也要和前东家保持好的关系。毕竟你积累了几年的经历、人脉、朋友和行业地位都在其中。有能促成的合作，尽量促成；有能转介的客户，尽量给原来的同事；有一些能躲开的冲突，不违反原则的情况下，尽量躲开。即使是你现在的领导，也会觉得你这个人值得交。


    那些在“为什么要离职”的问题上痛斥前团队、公司和管理者的人，基本都会被打低分。因为你对待上家的态度，就是对待下家的态度。


    比如三国时期著名的大区经理吕布，连续跳了三次槽，丁原、董卓两位前领导都被干死。最后被曹操抓到，曹操正有点犹豫。刘备一旁补刀：“您还记得丁原和董卓两位前CEO吗？”


    吕布，卒。


    要做关羽，别作吕布。


    ## —— 今日回顾 ——


    关羽在职业转换的时候，做对了哪四件事情？


    什么时候是职业转换的好时机？


    什么理由是辞职该说的，什么是不该说的？


    为什么离开了原单位，也要和他们保持良好关系？


    ## —— 我要践行 ——


    还是那句话——一切不以职业发展为核心的跳槽都是要流氓。所以跳槽能不践行，尽量不践行。


