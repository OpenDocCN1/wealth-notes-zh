    人生的每一更为我们成长，反思，并决定自己下一步的方向。


    其实每个人对自己生活的选择并没有什么对错，就如同这个世界总有一些深层次共通的价值观，例如：善良，宽容，对美好的渴望。我们有时候更容易和价值观相近的人成为朋友，因为他们身上不时会闪现我们欣赏的地方。但也不必批判和我们不同的价值观，就如同不必去纠正世界的多样性。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_106_0.png)


    最终我找到了工作，是第一份工作时认识的客户，后来逐渐成为朋友，她渴望向我那样亦无反顾去旅行，自己却被种种原因束缚。她介绍了我去了她的公司，最终通过面试，成为500强外企的一名普通员工，开始学习了解一个新的行业。


    今年，我28岁，刚刚工作两年，如每一个平凡的上班族，偶尔有纠结，不时有期待。去年一度纠结是否等待机会回老家，就这么过安逸稳定的小城生活。可以考虑供房子，供车子，像我所有没有离开家乡的朋友一样。


    后来朋友发来松浦弥太郎在《100个基本》里的一段话：我们每天都会面临无数抉择。因此，每天都会有困惑和烦恼，在不知道选择什么好的时候，就选择艰辛的那条路吧，因为这样不管是对是错，都会更集中精力去做，会变得更加慎重，更加仔细地准备。从结果上说，也会学到更多的东西，更容易获得成功。相反，选择轻松的一条路，则不仅没有紧张感，也会所学甚少。她说看到这段话突然想起我向她诉说过的纠结。那么，让我们选择比较艰辛的那条路吧，因为那条路上，可能性也更多。


    古典老师在这周的专栏里说，如果我们不是很清楚自己的目标，不知道自己想要什么样的生活，那么，打开你的视野，去有更多可能的地方，修炼你的能力。


    不用纠结是小城房还是大城床，只要我们始终珍惜健康，家人，即使偶见丑恶也能依旧坚信美好，那么你已经赋予了自己足够的安全感，其实到哪里都可以安家。


    我想，我们大部分人从气温一闪，顿悟生命的真谛。但是我们会在自己的每一次选择，每一次成长与改变之中，塑造我们的个性与价值。


    真诚地对待我们遇见的每一个人，乐观地看待那些即使成为遗憾或是让我们挫折的事情，因为生命真的很奇妙，你永远不知道，也许随手种下的一颗种子，就会在某天开出鲜艳的小花。


    我们不必羡慕他人，甚至企图成为他人。


    其实，慢慢成为自己的样子，就很好。


