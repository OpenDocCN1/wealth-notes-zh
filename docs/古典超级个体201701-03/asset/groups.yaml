    # 问答 | 优秀到底是选择了优势，还是刻意练习？ 16-4


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_63_0.png)


    Hi，你好，发现你的优势，聚焦人生可能，欢迎来到《超级个体》优势管理专题！


    我看《异类》里说，只要刻意练习，任何人都能在某一个领域成为大师。为什么今天你却说只有在自己有优势的领域才能获胜呢？到底哪一个是对的？


    古典


    这是个好问题——到底是抓住一个领域刻意练习，还是找到自己的才干并且培养出优势？到底是“只要练习任何人都能成大师”还是“要找到自己的天赋并为之努力”？


    可能很多人都听过“刻意练习”这个概念，今天我们从源头说说这个话题。


    “刻意练习”的概念来自1993年Anders Ericsson发表的一篇重要的论文《刻意练习在获得专家级表现中的角色》（The Role of Deliberate
    Practice in the Acquisition of Expert Performance），在谷歌学术中被引用了6771次，非常有影响力。


    《异类》、《刻意练习》的理论基础都来自这篇论文。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_63_1.png)


    > 论文摘要提到 “在大部分的专业领域，个体在他们童年开始就进行了大量的刻意训练促成积极发展。个体之间的差异，即使在顶尖高手身上，也主要和他们刻意练习的总量紧密相关。”


    努力1万小时就能成功吗？仅仅靠时间是不够的，还需要掌握刻意练习的方法。


    这篇文章提到的方法与传统的训练方法最大区别是什么呢？首先他提出两个观点：


    ## 1.量的叠加并不会意味着能力的提升


    你看我坚持讲普通话这么多年还这个水平就知道了。人们的能力不会自然提升，而是在某个水平徘徊，主要原因有三个：想提升的太多、方法不对、不在乎是否提升。


    ## 2.天才也需要刻苦训练


    就是我们提到的“优势=才干X投入”，投入不足依然没法提高技能。而且即使是顶尖高手，练得越多才越厉害。


    ## —— 刻意练习的方法 ——


    ### 刻意


    什么是刻意？能力训练有三个状态——工作、玩和刻意训练。工作受外部激励，停止更高要求就停止进步；玩主要是享受和体验的过程；而刻意训练则是为了克服不足，提升能力。


    我上大学时已经玩了很多年羽毛球，结果被几个身高不如网高的身高的小盆友虐了。还有一个经验，大学学习散打时，老师用了三个月只教我们练习直拳，其他什么都教——半年以后，我们和“玩功夫”的人PK，只用直拳就能取胜了。


    ### 即时反馈


    这个在讲心流时提到过，想不起来的可以去文章15-2找找。


    ### 持续呆在学习区


    要有持续调整和挑战的意识，让自己呆在心流通道。


    ### 有专业督导


    当有了反馈，有专人马上给你新的建议很重要。所以如果想真心练好一个领域，找个好老师、师傅、教练是个很好的方式，如果支付得起。其实请教练是最省钱的，因为他会减少你大量时间，增强很多兴趣。


    ### 一招不灵换一招


    如果一种方式对你无效，就要考虑换一种训练方式。因为如果方式对了，提高速度应该是很可观的。所以要多学点儿策略。


    ### 刻意练习这么好，为什么不每个人都使用？因为刻意练习也有限制。


    第一是 资源限制 。前面提到的即时反馈、专业督导、各种方法都需要时间、钱和信息资源。


    第二是 努力限制 。刻意练习其实非常累，每天2小时效果递减，超过4小时基本无效了。所以一方面需要聚焦——每天就2小时，你投哪个？一方面不要过犹不及，合理休息、合理进度，否则会透支动机构和效率——比如方仲永，就是累太狠了。


    第三是 动机限制 。刻意练习并不快乐——不是说没法快乐，可以用游戏化、心流让它变成乐趣，但是刻意练习本身并不是件乐事。所以需要有强烈的动机、深刻理解其意义、价值，还要有吸引力。这就是我说的——热爱本身就是一种才干。


    ### 刻意练习是如何看待天赋的？


    论文并没有给出 “天赋是否能让你更成功” 的清晰观点。但是天赋确实是开始刻意练习的先决条件——那些表达出来领先优势的孩子吸引了老师、家长的注意力，让社会倾斜资源，让他们更早进入圈子也让他们有更多的舞台——天赋触发了这些刻意练习的条件。


    ## “刻意练习”和“天赋优势”的关系


    ## 1.天赋在“启动期”和“大师期”特别重要


    Ericsson 把能力的提升分成3个阶段：


    - 阶段一：靠兴趣、或者外界要求启动的启蒙学习，体验阶段

    - 阶段二：非全职、非专业的刻意练习阶段，爱好者阶段

    - 阶段三：全职、全身心的刻意练习阶段，专业人士阶段


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_64_0.png)


    在“专业人士”阶段之后，还有第四阶段——卓越（Outstanding）阶段，则是在专家阶段时达到突破性的创新和贡献。这就是我们说的“大师阶段”。这个部分，天赋的作用又显得重要起来。


    简单说——主动入门靠天赋，入门后60分看态度、60-80分靠刻意练习、90-100分更加看天赋，而达到120分的哪种一代宗师——还要几分时运。


    所以也是很著名的那句话“以大多数人的努力程度之低，根本轮不到拼天赋”的意思。其实大部分基础职业要求的沟通、表达、自律、守时……根本就不需要天赋，其实只要认真点就足够了。千万不要用“我没有天赋”来推诿，甚至说“方法不对”，其实就是态度不对，不爱下功夫。


    ## 2.“天赋”和“刻意练习”不仅不冲突，还相互辅助


    ### A策略：


    你可以 initialized 天赋的方式选择自己增长较快的领域，用刻意练习的方式快速提高能力。所谓：天赋选点，刻意深挖。这种方式的好处是挖到就是大宝，坏处可能直到最后都刻意练习不出来。


    ### B策略：


    如果暂时找不到，或者担心投入了，最后发现不是天赋，不妨先在“通用能力”领域（桶底）部分，比如“自我管理、沟通表达、情商……”这些领域先通过刻意练习达到80分，慢慢找自己的天赋，也不至于浪费时间。这也是为什么有些人会每一样都很好优秀的原因——他真正卓越的是刻意练习的能力。


    也就是：练习通用能力，寻找独特优势。


    最好的策略是AB一起来。


    ## 优势并不是“竞争优势”


    还有一个地方要提醒各位“成功迷”，不管是天赋还是刻意练习，快速成长和更好表现都指的是和自己比。并不承诺你有了优势就有了“竞争优势”。举个例子你就懂——左撇子的左手相对有优势，但是他并不一定就能在腕力游戏里用左手胜过另一个人非左撇子的人，因为对方可能是个大力士。


    最后，不管天赋还是刻意练习，都并不承诺社会意义上的成功——这种成功有太多非能力因素：


    - 看准时代潮流和趋势，靠眼光；

    - 家庭资源、社会阶层，靠命；

    - 躲开各种风险、疾病、灾害，靠运；

    - 进入优秀平台，有优秀的伙伴导师，靠情商。


    所以成不成功，真不好说。


    但是有没有精进，靠你自己。


    选个才干，开始精进吧。


