    # 费曼技巧：一张白纸提高学习效率 21-3


    21-3 费曼技巧：一张白纸...


    前面两天我们讲了两个概念：学习的功利性，以及如何找到知识的源头，今天我们谈谈看如何提高自己的学习效率。从结构化的角度看，本周就形成了一个很清晰的 why-what-how的过程。


    ## —— 一个概念 ——


    # 概念：学习效率金字塔


    学习金字塔是美国缅因州的国家训练实验室研究成果，由学习专家爱德加·戴尔（Edgar Dale）1946年提出。它用数字形式形象地呈现了：采用不同的学习方式，学习者在两周以后还能记得的内容（平均学习保持率）有多少。


    从上往下列出了：听大课、阅读、多媒体、现场示范、讨论、践行、教别人，这7种学习方式，学习效率也依次从5%递增到90%。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_126_0.png)


    这是个什么概念呢？


    假如你的一个小伙伴做错了事，


    - 你开会批评了10句话，2周后，他只记得半句。

    如果写封邮件说清楚，他记得1句。

    当面解释给他听，记得2句。

    陪他聊为什么做得不好，记得5句。

    不仅陪聊，还陪练，记得7句半。

    让他搞懂，然后教其他同事，记得9句。


    # 最重要的知识不在书上。


    更有意思的是，学习效率在30%以下的，都是单人的被动学习。而学习效率在50%以上的，都是团体主动学习。一群人学比一个人学要好——这也牵涉到一个很重要的概念——静默知识，又叫隐性知识。


    隐性知识（tacit knowledge）是显性知识的对应概念——显性知识指的是可以通过文字、图表、公式、手册等表述的知识。这些知识很容易在个体之间传播。而隐性知识则是一种策略性的元知识，是“如何利用知识解决问题”的策略，是个人信念、看问题视角和价值体系等专家自己都没有觉察的隐形要素。


    显性知识的门槛很低，其实高手和一般学习者的差异，主要是调用隐性知识的比重的差异。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_126_1.png)


    比如说做咨询，所有咨询和教练都有一套标准的问话、动作、回应和总结技巧。但是顶级的咨询师总能抓住一两个对方一闪而过的迟疑，提出一两个真理呀现的提问——这就只能是经验磨出来的。正如好演员的镜头感、好文章的“临场感”，只能感觉，没法说。


    有太多古训一次次重复这个真理了——“纸上得来终觉浅，绝知此事要躬行”、王阳明说“行到极处便是知”。他们都知道——更重要的知识根本就不在书本上，在人、在口口相传、在圈子里。


    商业成功也是一样——以前我偶遇过某位成功学大师（真的是鼻祖级的），喝酒聊嗨后，他说成功根本没法教，因为所有成功人士的关键因素，他都不告诉你。


    其实不是不告诉，而是这些隐性知识，根本无法表述，但是常年跟他呆着你就懂了。成功假如真的是门学问（我还心怀存疑），那也是在一个小圈子里的隐性知识。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_126_2.png)


    总之，要相信——二手知识比三四手有价值、经典比碎片化有价值、站在知识源头的人和圈子，比知识有价值。


    最后补一句，作为一个矫矫业业的老理论，学习金字塔在学术界常常被吐槽，主要槽点是：不能把记忆当成学会、学习效率用百分比描述并不准确，以及对于不同人，学习方式可以个性化调整。但对于大多数普通人，这个模型还是很有指导意义的。


    ## —— 一个技术 ——


    # 如何增加自己的学习效率？


    # 1. 多感官


    看一遍、听一遍、说一遍、画一遍、做一遍


    尽可能从更多感官通道学习——你能被刺激的感官通道越多，记忆越深刻。


    # 2. 进入好的圈子，好的社群，找到好的导师


    进入好圈子、好社群、好导师，不要那么快下结论——


    > “他无非就是……，”或者“这不就是XX书里写的……吗？”


    用你的三手知识诠释一手知识，这是弱者逻辑，只是让你安心。


    要认真品味优秀的人。


    # 3. 费曼技巧


    如何学得更快？你可以尝试下“费曼技巧”——其实就是通过教别人的方式让自己学会。


    教学是学习金字塔中最高效率的一种方式。之所以叫做费曼技巧，因为物理学家费曼经常使用这种方式——当他学习某样东西时，他就会尝试教别人，而且用最简单最简洁的方式教会别人。


    他在演讲集《发现的乐趣》里提到，这个方式其实是他父亲教他的。比如小时候学《大不列颠百科全书》时，有次学到：


    雷龙。有25英尺（7.6米）高，胸袋有6英尺（1.8米）宽。


    他父亲就会说：


    我们来看看这句话是什么意思——假如那个东西站在我们家前院。他那么高，足以把头伸进楼上的窗户，不过呢，因为他的脑袋比窗户稍微大点，他要是硬把头挤进来，他会弄坏窗户的。


    # a. 选择一个你想理解的概念


    找一张白纸、写下标题——要起范儿——真正觉得自己要讲课了。


    # b. 假装你在教某人


    入戏。假想一个新学生，他的年龄、身份、场景，然后就真的给他上课。


    当你一次次去解释的时候，你会对手自己理解了什么，误解了什么，还差什么，有所体悟。


    # c. 如果遇到问题，停下来翻书


    当你讲不下去的时候，跳回到学习资料上，重新学一遍。一直到自己能讲顺为止。


    # d. 简化你的语言


    不要用术语，使用自己的语言。假如你还在用生僻词汇，或者讲不清楚概念。其实就是你没有真正理解——试着简化语言，或者打个比方，让自己真的明白。


    ## —— 今日回顾 ——


    在脑子里回顾下学习金字塔的七种武器，还记得多少？


    什么是静默知识？你生活中接触过哪些静默知识？


    什么是费曼技巧？你用过费曼技巧吗？哪一步获得提升的？


    ## —— 每日践行 ——


