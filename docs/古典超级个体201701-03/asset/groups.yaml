    ### 如何清晰你的价值观？


    ## 1. 真实地感受自己


    价值观只有真假，没有对错。


    你可以在家里用十万字论述关于为什么“冒险是人类精神皇冠中最伟大的一颗明珠”，但是你就是觉得稳定有节奏的生活才适合你。


    > 罗素说：“关于‘价值’问题完全是在知识的范围之外。也就是说，当我们断言这个或那个具有‘价值’时，我们是在表达自己的感情，而不是在表达一个即使我们的感情各不相同却依然是可靠的事实。”


    所以你买个衣服可能各种比价，是理性行为，但人生最重要的决定，和谁结婚、去哪个城市……却往往是靠着觉拍板，因为最重要 的底层决定都是有情感参与的。


    道德观用来判断，而价值观是用来感受的。


