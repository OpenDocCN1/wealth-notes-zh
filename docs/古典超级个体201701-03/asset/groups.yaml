    # 成长加餐 | 做“斜杠”，业余时间如何投资更有效？ 12-7


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_25_1.png)


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    ## 超体们：


    这周我请到第二身份创始人、知名自媒体人Susan Kuang做我们的成长导师。她是本周主题的联合策划人，也是《斜杠青年：如何开启你的多重身份》一书的作者。


    这些天，大家的问题大多和如何成为斜杠青年有关。Susan从中挑选了有代表性的一个问题来回答。


    提问：有限的业余时间到底要如何“投资”才更有效呢？


    ## Susan：这个问题很典型，也是很多在职人士的困惑。


    在斜杠身份的挑选这个问题上，你首先要问自己发展斜杠的目的是什么，是为了让生活更充实，成为一个有意思的人，还是为了对抗未来的风险，让自己多一份保障？不同的目标，策略也会有所不同。


    如果仅仅只是想让自己的生活更加充实，成为一个有意思的人，那么选择就可以随性一点，以兴趣为主，多项爱好同时进行也没问题，只要有足够的时间。比如说，你喜欢网球，也喜欢书法，那就可以利用周末的时间去学习网球，然后再利用平日睡前的一个小时来练习书法，只要坚持的时间够长，技能就一定会有所提高。


    拿自己来举个例子，我生活中的一个重要的兴趣爱好就是跳舞，这纯粹只是爱好，没有任何除了享受舞蹈之外的目的，我在两年 origin 前开始系统学习舞蹈，每周投入的时间大约4小时，到如今我已经可以开始教课了。


    如果是想把“斜杠”作为一项自我投资来对未来不确定性，那么就应该选择那些有“投资价值”的技能来进行学习，即使你此时对它还没有任何兴趣。对于选择什么技能来进行投资，可以考虑从市场需求着手，以下是我认为比较重要的技能，用以抛砖引玉：


    ## 1.阅读和写作能力


    如果不知道要发展什么技能，我建议先从阅读和写作开始，因为知识不仅是知识经济时代的重要生产力，甚至还成了一种“大众消费品”。


    通过阅读进行系统输入，然后再通过写作进行系统输出，日积月累，你就能成为一个领域的小专家。那时，你便能顺利成为五大经典斜杠组合中的“写作＋教学＋演讲＋顾问”型斜杠青年。


    ## 2.审美能力


    毫无疑问，我们已经迈入了一个拼颜值的时代，“美”本身也成为了一种可消费的事务。在未来，不管什么类型的公司，做什么样的产品，都离不开“美”与“设计”，所以审美能力将是新时代人才的一个非常重要的能力。这种能力可通过学习手绘、平面设计或摄影来获得。


    ## 3.语言和表达能力


    最近音频节目的流行，突然间把语言和表达能力提高到了一个新的高度，文字虽然能够很好地体现思想，但优秀语言和表达能力能够极大地增加一个人的个人魅力，“个人魅力”也是这个时代的重要“消费品”，而我也认为声音作为一种传播载体，在消费市场的比重也会越来越大。我今年也把声音以及表达能力的训练作为一项自我投资内容。


    ## 4.编程的能力


    下一个时代必定是人工智能的时代，在可预见的未来，程序员都会比较紧缺，因此拥有编程能力算是买了个“保险”。不仅如此，它还能让你拥有不一样的思维方式，更好地理解人工智能时代的发展趋势，并且把握住未来的机会。我认为，对于男生来说，编程能力和算法思维是工作之余可以考虑的一个重点发展技能。


    不过我建议——不管学什么，最好能够先参与专业的课程，而不要要依赖自学，学习初期如果有老师指导会让你少走很多弯路。等到入门之后，就可以依靠自己练习来继续提高。


    关于到底是先发展“一个技能”还是同时发展“多个技能”这个问题，这取决于你是否有足够强的自我掌控能力。多项技能发展本身并不冲突，有时甚至还能互补，比如说文字能力配绘画能力，文字能力配语言能力，或者编程配设计能力，这都能更进一步提高你的竞争力。


    不过在自控力还很弱的时候，我建议还是先专注一个技能比较好，通过这个技能先培养起自律的习惯和一定的成就感。等到能力足够强的时候，再去考虑更多技能。


    还需要提醒一点的就是——所有技能发展都是一个长期过程，所以要尽量避免急躁和急于求成的 心态，用一种长线投资的心态去学习。


    “时间分配”似乎不是个大问题吧，那些工作之外的业余时间都可以用来自我投资，而且这些技能学习每周投入时间其实并不需要太多，10小时就足够了，关键还在于自我管理能力——你能否把想法转化为行动，并将行动持续下去。如果有兴趣了解更多，可以来看看我的新书。


    最后祝大家周末愉快！


