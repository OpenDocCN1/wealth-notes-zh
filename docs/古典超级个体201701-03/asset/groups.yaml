    # 过年回家，做好这8件事

    14-4


    Hi，欢迎来到超级个体，过个有意义的年，做一个有幸福感的人——超级个体春节专辑。


    据说地球上每年都要发生两次数量最大的动物迁徙——南非的动物大迁徙和中国的春运。动物迁徙为繁殖，而我们回家，是为了什么？


    我们在寒风中，挤向老家，挤向血脉相连的过去，短暂停留几天，又在硝烟中，重新冲回城市里，冲回不确定的未来。今年春节法定假期是7天，算上来回路上的时间，能在家里的时间实在太少——我们这样匆匆的奔忙，到底是为了什么？


    过年回家，我们主要是为了见这四类人——家人、亲戚、朋友和自己。拿出一张白纸，画一个圆，用十字四分——你也可以在脑子里描绘这个图形——然后填入这四个角色，这四种人是你春节回家的动力所在。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_39_0.png)


    但回家并不等于都能做好。我们是否都经历过：突然发现重要的人没见；重要的事情没做；自己也完全没有准备好迎接新的一年。只是咽着大嘴把春晚重播看了一遍，突然发现，明天就要上班了？


    下面是回家要做的8件事，每个角色2件。你可以写在你的图形的外侧——这当然不是标准答案，你可以按照自己的方式选择怎么做。


    ## 1.和家人做一次深谈


    家人是我们回家的主要动力，却常是我们最容易忽略的人。千万不要以为，陪他们坐在 Mehrheit 吃年夜饭，就是陪了他们。和你的家人安排一次单独的、长时间的、面对面的沟通，聊聊一年的思考和进步，听听他们现在的琐碎——做一次平日电话永远无法完成的深谈。


    ## 2.给家人服务一次


    是不是每年回家，你都会成为家里关照的对象？哪怕饭后拿起一个碗，父母也会赶紧说放下，放下？过年的你似乎什么都不用做，但其实过年正好是你服务他们的好机会。找个时间，给你的父母亲服务一次，让他们感觉你长大了。


    ## 3.和亲戚们大聚会


    亲戚和家人不同，血脉相连，却交往不多，亲戚见面要的是气氛热烈和面积广阔，大聚会再合适不过了。组织或者参与N次这样的大聚会。你不一定能认识每一个人，至少可以跟每一个人
    Say Hi、拜年。


    ## 4.帮助晚辈


    从外面回来的你，一定被编排了很多“帮帮你表弟……”之类的活。不要推脱，认真地和其中一两个谈谈，好好帮助他们也是你的责任。退一步说，亲戚也是你父母的支持系统，尽可能帮助他们，也等于为自己的家人存下善意。


    ## 5.和老友相聚


    我们奔回家乡的第二重要的理由，是因为这里还有几个多年的好友。不问公司职位，不不当妈。开肆无忌惮的玩笑，爆当年的糗事情事。就知道你还是那个初中二班的王小强。


    ## 6.见不常见面的朋友


    这是很容易被忽略的一件事。有意识地去见一个你不常见的，即使同学会遇到也不常聊天的人，了解一下他在做什么？近况如何？他和你当初的出发点一样，却进入完全不同的一段人生。某种意义上说，他其实是你生命的另一种可能。


    ## 7.给自己一个回顾与计划


    每当新年钟声响起，有没有感觉，一下子又过去了一年？时间的流逝其实是因为没有留下重要的记录。从今年养成这个习惯吧，试着给去年的自己一封信，回顾自己这一年的成长，感悟和思考。也为明年定一个计划。你可以在明年过年拿出来，记录自己的成长和变化。


    ## 8.给自己一个重回职场的准备


    上班前一到两天，给自己刻意安排大约半个小时做与职业相关的事，提醒自己的潜意识要准备回去工作了。你可以阅读相关的书，写写自己的工作计划，或者约上几个同事聚聚会。如果不提前热身，你也许会在开始上班的第一周，都恍惚回不过神来。


    最后，给上面的8件事情排一个序，然后好好做完前4件，其他的努力就好。回家过个好年远远不止这8件事，以上罗列只是个提醒。在所有角色中面面俱到，是生活的智慧。而把每个角色都做到最好，则是生活的能力了。


