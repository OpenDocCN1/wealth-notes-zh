    圈圈本名孙园媛，曾经是全球著名管理咨询公司的咨询总监，现在自己创业。因为一系列生动有趣、又干又长的职场分享，圈粉无数。


    大概每个人都有一两个这样的朋友：凡事不做则已，一做就会做得特别好。圈圈就是我的这类朋友。


    上班：她是中国区晋升最快的顾问，带团队获得大中华区咨询案例大赛第1名；


    做公众号：她用7个月积累10万读者，《未来，你可能不属于任何公司》等文章全网阅读累计超过1亿次。


    出版：新书《请停止无效努力：如何用正确的方法快速进阶》，亚马逊预售首日即登畅销榜第1名，豆瓣评分高达8.8。


    不过，很少人知道，刚上班那会儿，她曾经因为性格内敛，差点成为职场的“小透明”。圈圈常说：“理想很重要，但在实现理想的路上，方法论必不可少”。近十年的咨询、管理经验，让她不断帮助自己和他人实现自我突破。


    所以，这周我请到圈圈做“特约成长导师”。欢迎大家留言提出问题，圈圈老师将从中选择最具代表性的一个进行解答。


