    ## 2017年趋势三：进入AI职场时代的最好机会

    11-3


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    11-3 2017年趋势三：进入...


    当我们回顾2016的时候，谷歌AlphaGo战胜韩国棋手李世石，是一个绕不过去的大事件。


    谷歌的野心并不止步于做一个战胜人类的棋类程序。他们宣布，这套人工智能一旦成熟，将用于灾害预测、医疗健康和机器人等更广阔而复杂的领域。


    ## 来临速度比你想得快


    不管这个变化的结果是什么，它的速度都超过你的想象。


    +   2021年，首款机械药剂师将在美国登场；

    2025年，30%的公司审计工作将由人工智能完成；

    2026年，无人驾驶汽车将占美国汽车保有量的10%。


    ## 什么职业会受威胁？


    +   1. 蓝领 ——重复的、标准化程度高的机械性劳动。

    2. 初级白领 ——规则性、协作关系简单、维度少的智力活动


    那么——什么职位会越来越重要？


    +   高端技术人才：大数据、人工智能、程序编写者、生物科技等

    复杂模式判断者：需要强大的思维逻辑和模糊情景判断能力（政治家、企业管理者、投资人等）

    创意工作者：为追求趣味，发掘人类爱好而创作（艺术家、音乐家、导演、作家、演员）

    人际服务者：通过深度的人与人互动的服务来工作（高端服务业、高端手工业、厨师、心理咨询师等）


    ## 什么行业会有新机会？


    各个行业中与人工智能、大数据等搭接的领域会有新机会。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_6_0.png)


    ## 职场人该如何面对？


    对于职业新人来说：


    除了培养专业能力外，注意培养自己这些能力：创造力、社交能力、分析、思考和判断断能力、审美能力、当然还有学习能力。尤其是创造力和社交能力，这两项是人工智能无法拥有的。


    持续地尝最 ettiğini等于... 持续地尝最新 || 多关注一些大数据、人工智能的入门书籍。


    留意自己行业内与人工智能、大数据接口的职位和公司，保持对这件事情的观察和好奇。


    对于中高层管理者来说，他们也面临下面这些转型：


    +   1. 视智能机器为同事。


    根据埃森哲的研究，未来几年，机器人可能会成为你团队中的一员。他至少是下面3个角色中的一个或多个，他可能会做你的助理、顾问，甚至执行者，要懂得用好这些人。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_7_0.png)


    +   2. 专注于判断性工作


    未来，人工智能能承担越来越多的常规性工作，甚至辅助人们的决策，但它无法开展“判断性工作”。


    > “判断性工作”是指——在无法获得充分或可靠信息时，如何运用人类自身经验和专业知识来作出关键的决策。


    +   3. 专注业务——将行政工作交给人工智能


    今天的管理者花很多时间在协调和管理控上，而这部分工作未来很大部分会被人工智能接管。


    诸如时间安排、资源分配、报告等，未来的管理者应该是业务专家——如设计机构艺术总监、医院外科主任医生、科研项目负责人或是管理咨询项目经理等。有专业技能的管理者，会更加受欢迎。


    +   4. 像设计师和教练一样工作


    管理者的创造力固然重要，但激发他人创造力，并且整合的能力更重要。


    讲了这么多，来做个总结——其实你不妨把人工智能时代想象成一个初入职场的理工天才，比如《生活大爆炸》里的谢尔顿——他体力比你好，效率比你高，记忆力很好，而且知识更新还比你快——但是社交能力很糟糕、对于复杂和不确定的事情一筹莫展——你和他PK是无意义的，要学会与他快乐地玩耍。


    遵循原则——做机器不能做的事，同时要学会与机器合作。


    回到开篇的提问：未来的职场到底是“终结者”还是“大白”？——估计都不是，人机高度合作的《星际迷航》可能才是最后结局——人类通过与机器合作，成为更强大的物种，可以去到以前无法触及的地方。


    如果你也这么想——2017年正好是进入这些领域，提升这些技能的一个重要时机。


