    # 如何成为一个高度自我觉察的人？15-3


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_48_1.png)


    Hi，欢迎来到超级个体，过个有意义的年，做一个有幸福感的人——超级个体春节专辑。


    15-3 如何成为一个高度自…


    # 超级个体


    ## 冥想


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_48_2.png)


    一起职场加速的第104天


    练习冥想可以提升大脑的功能，甚至是脑的结构。最简单的入门方法还是正念冥想——不加判断地观察当下的自己。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_48_3.png)


    ## ——一个问题——


    如果说起“世界上最幸福的人”，你会想到谁？经过科学验证，居然是一个叫做马修·理查德(Matthieu Richard)的法国和尚。


    美国威斯康星大学的神经学家用256个传感器监测马修·理查德的大脑活动。结果显示，马修大脑中反映幸福感的脑波活动，远远超过正常范围，打破了所有神经科学文献里的历史记录！


    其实，马修只是众多参与研究的和尚之一。研究人员发现，这些和尚的幸福感普遍高于常人，源于他们日常的冥想（Meditation）训练。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_48_4.png)


    ## ——一个概念——


    说实话，我自己对于冥想一开始是有排斥的，冥想让我想到灵修、宗教或神秘主义，或者至少是件麻烦的事——在某个深山古寺，穿着某种衣服盘腿打坐，搞不好还要过午不食。


    我也时常听周围的朋友不无得意地炫耀自己双盘，这是一种高难度打坐的方式，对于我等胖子简直是杀猪。我对于过于仪式化的东西充满怀疑。


    心理学界在本世纪初开始了对冥想的研究，其中的神秘逐渐被解析，各样仪式轨迹逐渐被简化，冥想中最核心、也最有效的部分逐渐展示给了大众。


    2004年《美国国家科学院院刊》（基本上是美国科学的关键期刊）发表过对于冥想的神经科学研究。美国《时代周刊》2014年2月的封面文章，就是关于正念的。“达沃斯世界经济论坛”也有关于冥想的主题。中科院心理学的祝卓宏教授也把ACT（正念减压）理念介绍进入国内心理界。


    当科学完成神秘主义去魅，随之而来的是越来越多简单的方法和清晰的解释——这终于让我开始了解，愿意学习，一直到亲身体验。在和你聊这篇文章前，我完成了一个10天的封闭式冥想训练，也保持着一年左右的正念冥想的练习。我是个超级初学者，但是冥想已经对于我的工作和生活有了很大的好处。


    ### 冥想是什么？


    冥想到底是什么呢？Meditation 冥想，Med在英文中是“中间”的意思，比如 Middle。这个词源来自于巴利文 vipassana，意思是“为观察某事而深入其中”。冥想和观察有什么关系呢？


    我尝试用《美国国家科学院院刊》那篇神经科学研究中的定义：冥想是一个熟悉自身精神活动，通过心智训练带来长期的认知和情绪改变的过程。（Practitioners
    understand “meditation,” or mental training, to be a process of familiarization
    with one’s own mental life leading to long-lasting changes in cognition and emotion。）


    你不妨理解成一种大脑训练体操。常见的冥想有：


    - "专注冥想"——培养专注力；

    - "慈悲冥想"——产生同理心；

    - "正念冥想"——消除情绪困扰。


    不妨理解为针对不同身体部位的伸展运动、扩胸运动、力量训练。从外在指标来说，冥想练习会让你呼吸变缓，身体放松；脑血流量增加，精神焕发，反应的速度明显加快；长期的效果包括智商提高、免疫能力更好，心理上自尊感提升。


    正是因为冥想是特别有效的“大脑体操”，很多靠大脑吃饭的人都有冥想习惯——著名主持人奥普拉、乔布斯、经营之神的松下新之助、桥水基金的掌门人雷·达里奥，都有每天超过20分钟的冥想习惯。


    雷·达里奥在大学的时候开始接触冥想，一练就是40多年。他说“我从1968或1969年开始冥想，它彻底改变了我的生活……让我心思澄明，让我独立，让我的思路自由翱翔，它赐予了我许多天赋。”


    ### 冥想的科学原理


    练习冥想可以提升大脑的功能，甚至是脑的结构。冥想至少对大脑有3方面的积极作用：


    ## 1.冥想让你更聪明


    专注、记忆和学习是需要神经细胞高度配合才能完成的复杂动作，冥想则是这些动作的训练。比如在“专注冥想”里，需要你持续地专注自己的呼吸；在“正念冥想”中，则需要你不断把注意力在身体不同部位转移——这和狙击手注视目标、小孩子视觉追踪卡一样，都是特别好的专注力训练。


    冥想能显著提高神经系统的协调性，大脑血流量增加，这让你变得更加聪明。中午的时候做20分钟冥想，相当于2小时的睡眠效果。


    ## 2.冥想让你很平和


    所有的冥想中，都有“放空”、“静心”的需求——如果走神了或有情绪，不要自责，只需要看着他，情绪就会慢慢消失。网络用语“神马都是浮云”其实是个禅修术语——情绪来了，就当情绪是蓝天里的一朵浮云，逐渐飘散。


    当你在看情绪，你就已经不陷入情绪中间了。


    对于心理咨询师来说，这其实是个“心理位移技术”——在拖延症文章中，我曾提到过“你我他”的自由书写（见文章13-2），其实也是一个用第三人称产生心理位移。


    高僧点悟的时候，经常大喝一声：“主人翁何在？”，就是提醒你——现在陷入情绪的这个你是真的你吗？那位观察情绪的你去哪里了？


    落到生理层面，能检测到冥想让你的前额叶到杏仁核的神经连结加强了。前额叶是大脑的指挥部，而杏仁核主要与人的负面情绪有关，说明你对于情绪的掌控能力加强了。


    所以高人们并不是没有情绪，只是他们从情绪里面跳出来的速度比你快得多。你遇到讨厌事闷个2天，人家半秒就跳出来了。这样就比你多活了两天，这个练习还真的挺值


    ## 3.冥想可以让你更快乐


    冥想会增加左前额叶的活动性，减少右前额叶的活动性。右侧前额叶代表负面情绪，左侧代表快乐情绪。据抑郁症的人右侧前额叶发达，冥想的人会有更多快乐体验。禅修里叫做禅悦，积极心理学叫做积极情绪。


    正如古代的僧侣一样，我们也许没有必要非了解原理才开始去操作使用——事实上你也不知道你手机是怎么运作的，但你用得好好的。你也不知道你的胃怎么运作的，但你也长这么白白胖胖。下面谈谈怎么做。


    ## —— 一个策略 ——


    冥想是个很大的系统，今天只能介绍一个开头。我介绍一个最简单的方法“正念冥想”，你今天就可以试着看。在文末我加了很多的资料，有兴趣可以了解更多。


    “正念冥想”叫做 Mindfulness Meditation。正念简单来说，就是“不加判断地观察当下的自己”。动作是 观察，对象是 当下的自己，要求是 不加判断，没有分心。听上去简单，做起来很难。


    最简单的是从观呼吸开始：


    - 呼吸的时候，意识到自己在呼吸，吸气的时候，意识到自己在吸气；

    - 呼吸变大的时候，意识到自己呼吸变大；呼吸变小的时候，意识到自己的呼吸变小；

    - ……


    如果走神了，就意识到自己走神了。然后不要批评，尽快拉回来就是。


    让呼吸绵长，一次呼吸15秒左右。

    如果呼吸长不了怎么办？意识到自己长不了了，然后拉回来就是。


    所有的逻辑就是一个——不加判断地观察当下的自己。不加判断，所以没有情绪。


    进度：一开始千万不要长，每天一次，每次关注三次呼吸就够了。时间最好是早上，如果能在同一个地方最好。你可以放在三件事的前面。当你习惯了每天做三次，并且开始觉得不太够的时候，再逐渐把时间增加到2分钟、5分钟、10分钟、20分钟。一旦发现坚持不下来，就维持原来进度。


    在有重大情绪来临时，面临重大挑战前，可以做1分钟正念冥想。


    坐姿：一开始不需要盘腿、也不需要什么专门的坐垫，找到一个硬点的椅子坐好，双脚平放。背要立直，否则很容易睡过去。


    辅助工具：如果需要一些指导语或者背景音乐，也可以使用的一些辅助的APP，比如 Calm，Mindspace，或者关注“轻松冥想”等公众号。


    冥想其实不神秘，就是一种思维体操，贵在循序渐进和坚持。所以一开始千万不要求猛——我曾见过那种一上来就要盘腿冥想1小时的人，光腿疼了。


    但科学往往只表达出冥想可实证、具象的一面。在深入体验后，你也许会对冥想背后的哲学体系和价值观好奇和敬畏，关于烦恼的观点、关于人与世界如何相互作用，关于自我意识的升起和元认知管理……非常精妙和体系。当然后那还不是幸福践行里能容下的话题，有空我们专门讲吧。


    ## —— 一个总结 ——


    冥想是一种古老的自我修炼方法，从科学的实用角度看，它是一种思维体操；这种训练能让你更聪明，更平和也更幸福。


    我们今天介绍了一种正念冥想的入门技巧，他的核心理念，是“不加评价地观察当下的自己”。


    - 为什么说，冥想是一种思维体操？

    - 冥想带来的好处有哪些？为什么？

    - 如果用一句话来描述正念冥想的理念，是什么？

    - 你会什么时候开始第一次？


