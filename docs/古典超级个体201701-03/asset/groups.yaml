    ## 优势管理


    +   1、才干是你的守护神，越清晰、越具体地描述自己的才干，越能更好地调动它。


    +   2、才干可以从这4个方面来进一步描述 ——在那里用？如何用于个人成长？如何用更也好做事、做人？如何防止滥用？ 我们可以把这些资料写在一张“才干卡片”之上，随时拿出来提醒自己。


    > 正如茨威格说的那句话，“所有命运赠送的礼物，早已在暗中标好了价格。”


    +   3、优势取向的工作方式，就是在所有达成目标的路径中，找到最能发挥自己优势的那条。


    +   4、尤其要注意才干的阴暗面。要设计一套机制控制好自己的阴暗面。


