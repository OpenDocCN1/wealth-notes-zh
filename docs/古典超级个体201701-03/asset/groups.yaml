    # 超级个体


    # 幸福四象限


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_35_0.png)


    一起职场加速的第96天


    幸福=快乐+意义，通过加意义和+加快乐，我们每个人都可以更幸福。还有一句提醒：幸福不是用来学的，而是用来感受的。


    # —— 一个问题 ——


    一个多月前，《比利·林恩的中场战事》开始热映，李安接受采访被问到“现阶段你最大的幸福感是什么？”这个问题非常有意思，他只是腼腆地回答说，“我太太能对我笑一下，我就放鬆一点，我就会感觉很幸福。”


    李安的幸福观跟你不太一样吧？所以，当天看完以后，我的朋友就问我，“幸福这么主观的东西有没有一个统一的理论呢？”


    # —— 一个概念 ——


    说实话，心理学很难有统一的理论，但的确会有主流理论。今天我给你介绍一个关于幸福的模型，它是由哈佛大学的讲师，也是“哈佛幸福课”的讲者泰勒·本·沙哈尔提出的：幸福=快乐+意义。


    所谓“快乐”，其实就是短期的、当下的一些令自我很愉悦的感受；而“意义”是长期的对他人和社会的一种价值感。如果把快乐和意义作为2个要素，你可以把人群分成4种类型，即自我实现型、盲目奔波型、享乐主义型和虚无主义型。


    意义

    忙碌奔波    自我实现

    快乐

    虚无主义    享乐主义


    泰勒·本·沙哈尔《哈佛幸福课》


    # 第一种人：自我实现型


    有意义也很快乐，被称为“自我实现型”。


    # 第二种人：忙碌奔波型


    追寻意义但是常常忘记当下的快乐，被称为“忙碌奔波型”。


    # 第三种人：享乐主义型


    关注当下，却不太关注未来的意义，被称为“享乐主义型”。


    # 第四种人：虚无主义者


    既不追求快乐也不追求意义，被称为“虚无主义者”。


    # ——一个策略——


    一旦我们理解了4个类型，我们就可以很快地定位自己，并且给自己找到更幸福的路径。你是哪个类型的呢？


    有个方法很容易帮你辨别，就是尝试一下幸福笔记。你可以回想一下，上周你做过印象最深刻的关于幸福的5件事情，给它们的意义感和快乐程度分别打分，看看单独的分数是多少？你也可以把总分加起来，看看你上周获得的幸福和意义的总分是多少？很快你就会知道自己是属于哪个类型。


    建议你一定要动手做一做，因为做出来的结果跟你现在想的可能完全不一样。然后，你可以尝试下面这些“幸福维生素”：


    # 1.忙碌奔波型：与自己约会


    对于忙碌奔波型，增加目光达成过程中的快乐是很有帮助的。你不妨尝试一下与自己约会。


    什么叫“与自己约会”呢？比如说，今天晚上，你本来准备安静地读一本书，但突然有同事跑过来跟你说，“嗨，今天晚上我有话跟你说，你能停一停吗？”一般，人们都会放弃读书时间，去跟那个个人约会。


    但如果今天晚上你本来约了我，这时候别人过来询问，那么你一般会拒绝说，“对不起，我已经约古典了。”


    听上去很顺对不对？但是“细思极恐”啊！为什么约了我，你会推掉，而约了自己，你就会答应别人呢？难道我和你的关系比你和你自己的关系还重要吗？这就是“忙碌奔波型”人的下意识反应。


    你不妨试试和自己约个会：把自己当成是一位贵客，正儿八经的在日程表上面填上一个约会时间，推掉所有的工作和邀约，暂时忘记葛大屿深和朱伟的目标，用自己最享受的方式过一段时间——可以是听听音乐、读书读诗，或做一些无用又有趣的事情，享受独处或者跟你喜欢的人待在一起……总之，就是要正确地浪费掉这段时间。


    当然，这个练习进一步展开开来，就是给自己的礼物，给自己的体验。总之——把自己当成人生中很重要的人。


    # 2.享乐主义型：意义镀金术


    忙碌奔波型的人要“加快乐”，而对于享乐主义来说，就应该“加意义”，不妨称之为“意义镀金术”。


    但是，千万不要从什么“发现梦想和激情”这种意义界最高难度事开始。从小事开始，比如多做点善事，多帮帮别人，多参加一些公益活动。


    找到一个自己感兴趣的领域，持续地投入一段时你。可以尝试发现和利用一些自己的优势。如果暂时发现不了，那就学一些诸如读书写作、自我管理这种一定会有用的能力。


    你可以开始培养一个最小的好习惯，比如，尝试练习“延迟满足”。有一本书叫做《少有人走的路》，我推荐你看一看。慢慢的，你会在这些行动中间发现人生的意义和目标。


    # 3.虚无主义者：动机检索


    对于虚无主义者来说，你可以选择“加快乐”或者“加意义”中任何一条路径作为启动。不过，其实世界上没有真正彻底的虚无主义者，至少在读这个专栏的时候，你就不是。


    你不妨尝试一下，做“动机检索”。什么叫动机检索呢？——询问自己，是什么在推动你读这个专栏，并且见到这一篇的？无论这个力量是好奇、成就感，还是对自己的期待，就从这个地方开始努力下去。


    细小的、让你幸福的事情，就是你人生的火苗。关键是要持续地为这个火加柴，慢慢地把它变成一个真正能够燃烧你人生的燎原大火。


    # 4.自我实现者：努力更幸福


    对于“自我实现者”，你可以更幸福！你可以把问题从“我怎么样才算幸福呢？”改成“我如何才可以更幸福呢？”在“幸福笔记”里回顾上一周的5件事情，然后询问自己有哪些是希望增加更多快乐的，有哪些是希望增加更多意义的，有哪些事可以多做，有哪些事可以少做。


    总之——通过“加意义”和“加快乐”，每个人都可以更幸福。


    # ——一个总结——


    沙哈尔认为，幸福=快乐+意义。通过这两个要素，能把幸福分成四种类型。


    盲目奔波型信奉的是“到达谬误”，认为只有在达成一个有价值的目标之后，才有可能得到幸福。他应该做的事情是“加快乐”。


    享乐主义型的问题是快感至上。他们认为，只要不断地刷快乐，就算没有目标也可以幸福。他们应该更多地关注于梦想和价值，因为他们连有限的幸福都感受不到。


    你可以通过记“幸福笔记”了解自己是哪一种类型，然后通过“与自己的约会”、“意义镀金术”、“动机检索”，让自己变得更幸福。


    最后提醒大家一句：幸福不是用来学的，而是用来绾的。


    # 春节·幸福践行2


    今天的目标就是通过幸福笔记找到自己的幸福类型。方法说过了，你可以列出上周你做的最重要的5件事，然后给这些事情分别打上快乐和意义的分数，分数是从0分到10分。单独分析每件事情，你是哪个类型？整体加起来以后，你大概活在哪个象限呢？


    理清自己是哪个类型以后，你可以再“加快乐”，或者“加意义”。还可以从昨天给你提供的10条策略中间，选择一些让自己这个春节假期可以更幸福的方法。


