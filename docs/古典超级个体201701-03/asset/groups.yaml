    # 该怎样学习一个专栏？

    写在超级个体破四万

    21-4


    不知不觉，《超级个体》专栏人数近4万了。


    就在刘润老师过五万订阅的时候，我还在开玩笑地说，润总你商业这个真好卖啊！我自己都是订阅粉——估计我这里讲个人成长，没有这么多人吧。


    刚讲完几周，润总又过七万了。


    葡萄好像好好吃啊，润总。往下扔一个叼。


    这不，不知不觉《超级个体》就要过4万了。


    说实话，很开心——大卖自然很好。更加开心的是，终于有越来越多人员慢慢意识到：打开未来可能的钥匙，在自己身上。你是一切的基本面。


    不管你学了多少知识，看了多少观点，最后能改变的，还是只有自己。


    不管你多爱你的父母、恋人、一起拼搏的小伙伴，最后所有的爱都通过你自己的表达才能出去。


    不管你看到多少牛人，刷了多少认知，还是需要你自己的肉身一步步往前蹿。


    你自己的成长，是一切的基本面。


    # 讲啥的？我该学吗？


    “得到”这个平台，罗振宇和脱不花团队千辛万苦地聚拢了知识界最好的头部资源，这就已经让很多人省去了很多时间——但是更加花心思而外人看不到的是——他们挖空心思修建了每个知识工作者的赛道。


    每个专栏都有自己的核心主题、讲法和赛道：


    - 吴伯凡老师的《日知录》，谈的是知识迭代；刘润老师的《商学院》讲的是商业逻辑和概念；

    有万维刚博览群书的一篇篇中正转述，就有吴军老师看尽全书而融为一体的上帝视角；

    有从底层理解世界的李笑来《财富自由之路》；也有北大薛兆丰老师有趣翔实的《薛兆丰的北大经济学课》；

    也有现代人必备，而教育却缺失的科学常识《卓老板聊科技》；也有人文品味的《雪 wur 爱音乐会》；更有原汁原味的《老浦识字》；

    最新上线的Dr.魏以极其理性清醒的态度谈国内鱼龙混杂的家庭教育，妈妈们应该看看。


    # 《超级个体》的思路是方法论和方向感交替：


    - 开篇——谈到了职业发展的大趋势。（方向感）

    第二部分——提高自我效能的种种方法，自我管理的方法。（方法论）

    第三部分——有了执行力，开始讨论职业定位、如何选企业、行业、时机、地域等。（方向感）

    第四部分——学习的能力、思考的能力、写作演讲等输出的能力。（方法论）

    第五部分——讨论如何处理各种关系、情商等。（方法论）

    第六部分——开始讨论管理和领导能力；

    一直在跟进进度的伙伴，肯定有管理、领导的机会。（方法论）

    第七部分——最后站在人生高度，谈谈如何设计好这一生。（人生的方向感）


    # 《超级个体》还是个设计精巧的学习系统。


    # 跟着学习一年后，你会成为谁？


    # 很多专栏如何选？


    # 现在订阅，还来得及吗？


    - 1. 用一个可预期的、优质的东西先占领自己认知资源，比平时零无防备被热点、三四分钟知识刷屏要好。就好象提前投资一个好的项目把钱占住，比随退出门看什么火买什么成功概率大。

    2. 付费其实是给自己一个暗示——逼自己认真看。哪怕花一分钱，认知资源也不同。同样时间，认知资源越多，收益也越大。

    3. 几个人结成群，互相分享的模式其实很好，不仅省钱，主要是增进了探讨和互动，是个好方式。这么便宜还要盗版，只能说你真的是贫困思维。


    在终身学习的时代，学习永远来得及。犹豫自己是不是错过了最好时机，结果又错过了最好时机了，然后是次次错过好时机，最后就到嫌得追了。


    泰戈尔说的比我美：“如果你为失去太阳而哭泣，你将失去群星”。


    所以——现在就是开始学习的最好时机，来得及。

