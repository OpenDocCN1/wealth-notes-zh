    \n90后的职业价值观排名\n\n# 3. 85后前三个价值观依然一样。更追求有新意、同时安全感强一点的工作。管理能力依然不是很看重。\n\n85后的职业价值观排名\n\
    \n# 4. 80后依然更看重“成就感”、“经济報酬”、“独立性”，你们确定不是商量好的？除此之外，80后还很看重“安全感”，喜欢有环境舒适的工作，不太重视管理能力。\n\
    \n80后的职业价值观排名\n\n# 5. 75后依然看重“成就感”、“经济報酬”，但对于“独立性”的需求没有80后及90后大了，相比比较更看重“人际交往”，重视人脉资源。同时，“利他主义”的比重也上升了，更乐意去做对别人有价值的事情。\n\
    \n70后的职业价值观排名\n\n# 6. 65后最喜欢环境舒适的工作，他们也更乐意去做能帮助别人的工作。\n\n65后的职业价值观排名\n\n除此，再分享一张参与此次调研的人群年龄段分布，方便你们更了解咱们的超级共同体。\n\
