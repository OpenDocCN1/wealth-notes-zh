    ## 爱情心理学


    持久的感情需要三个因素：激情、亲密和承诺。


    前期靠激情、中期靠友情、长期靠承诺。通过PEA度过蜜月期，然后通过内啡肽进入亲密期，建立起承诺。


    情感账户是培养亲密感的好方式，情感账户存一取百的关键是“找对语言，选对时机”。


    “爱的五种语言”包括：精心时刻、礼物、服务行为、赞赏的语言和身体接触。你可以通过测评，观察对方开心或拒绝的情景，找到对方的“爱的语言”。


    要爱得智慧，而不是爱得努力。


