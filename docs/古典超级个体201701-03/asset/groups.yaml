    在我看来，她是一个特别“爱折腾”的人，本身就是“斜杠青年”理念的超级践行者：大学学计算机，在美国修 MBA；喜欢画画，办过两次个人画展；业余时间运营自媒体，3年时间写了4本个人杂志，出了1本书；还开办舞蹈工作室，专门跑去美国学习爵士舞；同时致力于理性和启蒙（Enlightment）教育的推广……


