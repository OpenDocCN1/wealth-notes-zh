    古典老师早！

    1.老师说的没错，没有一项特别的优势特长，不要去玩斜杠。对于当下来说，发展，提升，巩固技能，这才是斜杠的前提，本质。并且不能在当前的优势下，自鸣得意，洋洋自喜，止步不前。


    2.对，方法不是拿来看的，而是要去实践的。三件事，WOOP执行意图，结果思维，输出倒逼输入。这些工具，在这两个月的实践中给我带来了莫大的帮助。提前安排好，减少了精力方面的消耗。遇到一些问题，脑中会自动去执行一些动作。而结果思维，在做事情想到，做的事情对我是否有意义。这都是工具的实践中给我带来的，实际变化，就像我现在在这里留言一样，行动才是改变的开始，切忌人云亦云。

