    # 从天赋到优势，你还需要3副“催化剂” 16-6


    Hi，你好，发现你的优势，聚焦人生可能，欢迎来到《超级个体》优势管理专 题！


    # 古典


    超个体：

    这周我请到我的朋友、国内最优秀的优势教练之一——刘佳老师，做我们的成长导师。她也是本周“优势管理”主题的联合策划人。

    刘佳老师从大家的提问留言中，选择了一个最有代表性的问题进行解答。


    刘佳老师，您好。我想问一下关于“投入”的问题。从优势产生的公式——“优势=才干×投入”中，我们知道“才干”并不等于“优势”，而是需要持续“投入”，“才干”才有转换
    为“优势”。那么，该怎么“投入”，才能使才干转化为优势呢？


    这是一个非常好的问题，我被问到过很多次。其实，在优势的产生公式（才干×投入=优势）中，影成优势的充分必要条件不只有：1.发现才干；2.投入才干。还有一个关键的条件——才干的投入必须是有效和持续的。


    努力也好，刻意练习也好，都需要用在刀刃上——即有效且持续，才能形成优势，获得成功。


    所谓有效，指的是投入必须是和自己的天赋才干有关的，投入在短板上或是自己不擅长的事情上，会很难和那些在 कैल方面有天赋的人PK，这点古典老师在第一篇的“木桶理论”中已进行了详细的阐述。


    所谓持续，指的是对才干的投入必须达到一定的时间、一定的质量，才有机会从量变到质变，形成持续稳定的能力和业绩。


    好，那么问题来了——如果我发现了我的才干，又愿意投入，我如何才能保证我的投入是有效且持续的呢？我是否能有足够的动力，让投入持续发生？


    答案是——才干×投入的过程需要有一系列的催化剂来激活。在催化剂的作用下，才能保证刻意练习的持续发生，形成优势，创造价值。


    # 催化剂1：激情


    才干最重要的催化剂就是激情（Passion）。


    > “我当时在看《猫和老鼠》那个动画片，那只猫在弹琴，我当时就被那只猫的手给震住了，我就是特别渴望，就是想像那只猫一样，我也想弹琴……我就想当钢琴家，这一点我特别明确，欲望特别强。所以我爸跟我讲，你要是想当钢琴家，你就好好练琴，练那些枯燥的曲子，你如果不想当的话，那你就别练了。”


    # 催化剂2：支持系统


    这里的支持系统指的是人的支持——包含导师的指点，伯乐的提携，朋友的鼓励。


    # 催化剂3：市场需求


    我们需要问这个世界需要什么。


    > “仅仅拥有兴趣和才干是不会拥有长久的事业的，我们要去做那些真正对别人有所帮助的事情。”


