    威红 2

    古典老师好！

    我这样对待拖延症，做事的时候给自己设置截止日期，比被要求的时间提前一些，比如说一项工作要7天完成的话，那我会要求自己6天内完成，一来留点时间检查，二来，预防有其他突发事情干扰，留时间补足，三是紧迫感提前


    一起加速，成为更好的自己！

