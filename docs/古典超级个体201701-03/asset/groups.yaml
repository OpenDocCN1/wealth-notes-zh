    # —— 3 ——


    美国的盖瑞·查普曼博士（Dr.Gary Chapman），写了一本书叫做《爱的五种语言》，观察和分类了爱的5种语言，这个理论有点儿意思。


    第一种爱的语言：Quality Time—精心时刻。花高品质的时间跟对方在一起。心不在焉地玩手机不算。


    第二种爱的语言：Gift—精心的礼物。重点是在精心，而不在于花多少钱。


    第三种爱的语言：Acts of service—服务的行为。也就是说，在对方需要你的时候，尽量主动地提供帮助。


    第四种爱的语言：Physical Touch—身体的触​​​摸。很多时候，说不出来的爱，可以借着身体让对方感受到。尤其对于女生来说，亲密的、非性的拥抱，更容易让她们感受到爱意。


    第五种爱的语言：Words of Affirmation—肯定的言语。就是赞美的话。看到对方的好处，就随喜赞叹。当你感激对方的时候，可以直接告诉他。也可以通过电话、文字表达对方的鼓励、感激和想念。


    要在情感账户上“存一进百”，关键是——找对语言，找对时间。


    # 第一 找对语言


    我身边有这么一对伴侣：


    妻子出于爱，也出于责任，把家庭照顾得很好，在家里打点上下，洗衣做饭，细致入微；先生则实肯干，性格温厚，事业上也表现得很优秀。看上去一切都很完美。但妻子并不觉得自己被爱，她买了很多礼物送给对方，却被认为是浪费钱；她做了很多可口的饭菜（古训不是说，要抓住男人的胃吗），但是对方好像没有什么感觉；她时常暗自哭泣，觉得不被爱。


    我们身边有很多这样的故事——他们生活空间靠得只有10平米近，但是心里的平行宇宙却相隔10光年。他们都是懂得付出，值得被爱的好人，只是一直不懂对方的语言，做着存百得一的事情。


    在这个故事里，妻子的语言是服务、礼物和身体接触；而先生的语言是精心时刻和赞赏的语言。他们每天都在用自己“爱的语言”表达，彼此却很难产生互动。


    # 第二 找对时机


    老婆晚上十点半才到家，进门边拖鞋边对丈夫抱怨：“我这个老板实在是太变态了，自己不走也不让我们走，临下班才开会，忙到现在才结束。”


    这句话是正确的，但是一出口，就是扣了一大笔钱。其实这个时候，最需要的是陪伴和支持。假如这个时候稍微给点爱的语言，其实是一个存一得百的好机会。这和投资是一样的，在对方最难的前期投100万，你能占20%；如果等人家到B轮融资了再投100万，你顶多占0.1%。


    要爱得热烈、要爱得智慧、要爱得准确，愿你每天都是情人节。


