    试试看，找个群或者找个人，拿着本周的3张卡片，看能不能跟别人讲明白你学到的东西。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_127_0.png)


    更重要的知识根本不在书上，而在圈子里的人口口相传中。想获得更多隐性知识，不妨用“费曼技巧”——教别人求学。


