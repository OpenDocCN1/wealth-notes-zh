    ## 2017年趋势二：管理者的2个改变 11-2


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    11-2 2017趋势二：管理者...


    在2016年的校招活动中，网易推出了一首刷爆朋友圈的神曲——《浙江杭州网易互联网招聘了》。


    歌曲以一身红火狂奔在大草原上的丁磊为封面照片，搭配“快投简历啊”的蓝色大字；浓浓的“江南皮革厂大甩卖”风招聘文案，配以鬼畜的洗脑旋律——我们先一起来感受一下这首充满着江南皮革厂大甩卖风格洗脑神曲。


    ## 浙江杭州网易互联网招聘了


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_4_0.png)


    一首歌，让网易自黑的清奇画风呼之欲出。歌曲上线1天，网易就收到了近4000份技术类简历。短短10天，网易校招团队收到的简历数量已达到了2015年的2倍，营销效果显著。


    ## 1.像营销一样去招聘


    领英《2016年中国人才趋势报告》显示：72%求职者在申请职位之前，就已经对雇主品牌有印象了。求职者在得知职位信息后不会立刻申请，而是更趋向于去检索、阅读与该公司有关的文章或评价。一般他们会这么做：


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_4_1.png)


    在做完这些调查后，他们才会决定要不要给雇主公司投简历。也就可以说——在你面试求职者之前，你早就被别人网上面试过了。


    不知道你看出来没有，如果把岗位当作“产品”，通过社交媒体招聘，这越来越像一场雇主和雇员之间的双向营销——雇主打造自己的品牌，吸引潜在员工；而员工看到职位信息以后，除了调查雇主，也会回去根据要求精心地“打扮”一番，然后才开始面试。


    21世纪，最稀缺的是人才。未来一年里，企业的人才竞争会在三个层面打响：


    ## （1）空军：通过社交媒体招聘


    公司要充分利用各种社交媒体的新渠道、新玩法，展示公司的文化、价值观和招聘职位，以确保自己的信息，在海量的数据中脱颖而出，使应聘者在申请职位之前能发现公司和职位。


    网易的神曲传递给大家的就是一种自黑的公司文化，让人觉得没有距离感。


    圣诞节，我在朋友圈发了条微信，收到很多条评论和点赞。还有不少人问“公司还招人吗”，我顺手发了个招聘需求，现在招到了一位助理和一位运营人员。


    > 古典古少侠

    刚收到的一：一些虚伪的公司，他们圣诞节不放假，也不发礼物，却在公司里面放个圣诞树，说要给员工营造一个节日的气氛。这是险恶意思？清明节怎么没见你放个坟墓？这点就是我新精神罢？不过我们就做了一点点，默默收集了全公司人的护照，18号全公司开始去吴哥窟度假，然后一直放到2.6号！！圣诞🎄和新年快乐！！！


