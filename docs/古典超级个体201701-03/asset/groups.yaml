    有个教手机摄影的朋友，教过我一个小窍门——拍照时，你可以俯着拍，蹲着拍，可以各种姿势拍，但就是不要平视着拍。我问为什么，她说正常的视角眼睛就能看到，而相机就是要看到事情独特的一面。


    学习也是这样，我们之前在文章3-3时就聊过看事情的3种视角——显微镜、放大镜、望远镜。


    大部分人都被困在直接看事情的平面镜像角度。但如果你不断地往里面深入，细分、细分再细分，就能到达显微镜的角度。又或者你往远看或者跳出来看，比如从“离地三千里”的角度看这件事，你就能看到大的全景图。


    在职业定位的这一周，我们又重温了这个思考方式，在自己的工作目标上面，拉高一层——


    - 周一：从公司的角度，发现公司是个玻璃金字塔；

    周二：从行业角度看，发现了行业的价值链，这是CEO视角；

    周三：从时代行业趋势角度看，发现了行业生命周期，这是经济学家或者投资人的视角。


    所以从三个不同的视角，你可以看到完全不一样的职业定位。


    - 1.确定自己的职业发展方向是最大的时间管理。管好自己上班的8小时，还能挤出下班2小时来学习，要重要得多。


    - 2.职业金字塔横向看是8个功能区：市场、销售、研发、生产、服务、财务、人力和行政，纵向看是3个层级——底层是执行、中间是管理、顶层是决策。组织不管大小，都有这些职能。


    - 3.组织里的生涯发展有4个方向，向上、向深、左右和向外。一般是先找角度——做深度——上高度——再继续找角度。遇到阻力就向外发展一段时间，积累人脉和实力。


    # 企业中的发展路径


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_117_0.png)


    1. 原理职能 2. 专业精深 3. 转接职能 4. 第二职业 幸福指数


    最大的时间管理，是方向上的管理——我们要学会自己做定位，结合组织要求来工作，这样才是上班，不是让班上你。


    - 4. 组织会经常变化，技术和工作要求会缓慢进化，但是行业的需求和价值环节并没有变化。通过价值链条来定位自己的价值和竞争力更加接近本质。


    - 5. 定位价值链包括2个问题：第一，我这个行业的核心价值是什么？我处于其中的哪一个环节？第二，我需要什么能力才能更好地创造价值？


    - 6. 你可以通过问自己一个问题来获得这个行业眼光——“如果明年我离开了这家公司，收入增加了一倍，那是因为我拥有了什么能力，创造了什么价值？”然后真实地出去找一些应聘岗位，甚至去面试。


    # 看清全局，才知竞争力


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_117_1.png)


    个人价值链分解法


    职业定位必问题：1. 你的行业的核心价值是什么？你提供哪个环节的价值？2. 做好这个价值链，需要你有什么能力？


    - 7. 对于创业和职业发展来说，最影响幸福和成就感的是职业价值观和发挥优势，最影响外在成就的，其实是行业和进入的时机。每一个人都有一辈子3次左右的最好机会，平均每10年一次。


    - 8. 行业也有生命周期的，分成 曙光、朝阳、成熟、夕阳 四个阶段。最好的进入时期，是曙光后期到朝阳后期。与其什么火追什么，不如选择提前进入新机会——关注子产业、二级市场、有地域时间差的二三线城市。


    - 9. 怎么选择适合自己的地域？大城市优点是可能性多、收入高、资源丰富，缺点是竞争强、压力很大、没什么归属感，是个竞技赛场。小城市则相反。如果你不确定自己的价值观，不妨从体验自己的可能性开始。我的建议是——年轻人应该多去大城市看看，能去北上广很好，能去纽约则更好。最后，选择一个适合自己的环境和文化氛围。


    总之，要追不要逃。你永远无法逃离什么，直到有一天，你决定开始追寻什么。


    - 10. 有没有一些机会，特别的好，但是也许是你当时心智不足，也许是你性格使然，也许就是你不喜欢的，所以你没有进入，甘愿选择现在的生活？肯定会有这样的情况。我的自我解释是——这就是我自己的“命”，家庭出身、优势、基因、教育、价值观……有时候命和运搭不上，那就等待自己的运势，并且衷心地为搭上船的人祝福吧。


