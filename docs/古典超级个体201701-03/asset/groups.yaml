    他们真的喜欢这样的生活吗？他们只是习惯了而已。


    但这种人，你又能期待什么呢？


    如果一个人终身都希望安全、随大流、不犯错，他们又干嘛需要寻找优势？优势就是给那些希望活得不一样的人准备的。


    精彩、高效、节能、又幸福的一生是存在的，就是找到天赋，并持续的投入，形成优势。


