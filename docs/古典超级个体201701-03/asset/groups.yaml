    # 为什么说幸福的人才能到未来？14-1


    Hi，欢迎来到超级个体，过个有意义的年，做一个有幸福感的人——超级个体春节专辑。


    14-1 为什么说幸福的人才能...


    # 超级个体


    # 人人都能习得幸福


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_33_0.png)


    一起职场加速的第95天


    幸福这种能有50%来自基因，10%取决于环境，40%可通过习得行为获得——未来不一定每个人都能成功，但是每个人都可以通过修养变得更幸福。


    春节越来越近了。你可能已经心不在焉，心在回家的路上，或者正准备着假期怎么过。我也想专门用2周的时间，陪伴你过这个节日。这两周，我和你谈谈幸福这个话题。


    # —— 一个概念 ——


    # 我们都是幸福的人的后代


    你觉得这个世界幸福吗？


    不要“鸡汤”，理性判断下：如果说这个世界上大部分人的幸福程度是“0-10分”，0分代表“不幸”，5分是“不好不坏”，10分是幸福。那么，你觉得人们幸福程度的平均分是多少？


    你是不是觉得在世界范围内，大部分人应该都不太幸福？俗话说“家家有本难念的经”嘛！不过有趣的现实是：全世界范围内的大多数人在大多数的时候都是比较幸福的。


    一项对全球43个国家的调查表明，人们的平均幸福感是6.33分。


    +   美国的平均分稍高，在7-7.5左右。

    东亚国家稍低，也在5.7-6.2左右。

    86%的国家，历年的调查平均值都高于5.0。


    在对美国成人抽样统计中也发现，一般人觉得幸福的时间占54.13%，不幸福的时间占20.44%，持平的时间大概占25.43%。


    不仅是大范围内的数据如此，一些个案也超出了我们的“想当然”。


    如果一个人生下来就没有腿没有手，他会不会幸福？或者一出生就是共用一套消化系统和生殖系统的连体姐妹，会不会幸福？


    下面第一张图里的男子叫尼克胡哲，是个“海豹症患者”，同时也是全世界著名的演讲家，有空可以看看他的书《人生不设限》。第二张图里前排的两姐妹，一个叫艾比，一个叫布塔尼。她们现在已经大学毕业，跟自己的家人和朋友很愉快地生活在一起，她们的幸福度也不低。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_33_1.png)


    即使是在社会经济地位比较低的人群或者是身体有残疾的人群中，大多数人在大多数时间也是幸福的。心理学家和社会学家们给这种现象起了个名字，叫做正向情感偏移（Positive
    Mood Offset）。


    然而为什么会这样？总不能全世界的人都在“傻乐”吧？无论是问卷调查、长期追踪，还是实验室的实验，都指向一个推论：幸福感很可能是进化带来的结果，是人类繁衍生息的必需技能。


    因为幸福的人有下面几个优势：


    +   生理方面，幸福的人更健康，更长寿。

    社会关系方面，幸福的人可以交到更多朋友，大家都爱和积极向上的人相处。

    择偶中，性格比财富和美貌拥有更高的权重，性格好的人结婚的可能性更高，生育后代的机会也更多。

    职业方面，幸福的人创造力和效率都更高。


    在一个研究中，研究者把参与者分成几组：一些人看喜剧，另外一些人看其他中性的片子（有关数学）或者负面的纪录片（有关纳粹集中营），看完后让他们解决一个创造性问题，结果看喜剧的人成功解决这个问题
    的比例比其他对照组高出28%。


    所以，对于正向情感偏移最直接的解释是——幸福是一种基因优势，幸福的能力把我们从过去的非洲大草原带到了现代社会，我们中的大多数人都是偏幸福那一类人的后代。


    # 幸福的能力会变得越来越重要


    心理学研究显示，人均GDP超过3000美金线，人们会更关注心理与精神需求，而不仅仅是物质财富。越过8000美金线，收入和幸福感不再有强相关关系——对于物质条件的一味追
    求会腐蚀幸福感。


    有两个有趣的巧合——2008年，中国达到人均GDP3000美金线；2009年，大量积极心理学书籍、课程进入中国；2010年第一届中国国际积极心理学大会召开。


    2015年，人均GDP是8016美金，而这一年也正好是生涯、心理等行业爆发的一年，随之而来的2016年，是知识平台、知识IP变现的元年。


    幸福不仅仅带我们来到现在，幸福会带我们去未来，幸福是很重要的竞争力。


    # —— 一个策略 ——


    # 幸福是可以修炼出来的


    前面说过，幸福是一种基因，那么是不是有人天生就比我们幸福？或者从小生活在一个好的家庭、社会环境里的人，就比我们更幸福？大家可以看看这幅图。


    # 幸福的决定因素


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_34_0.png)


    基因基本决定了50%——有人天生就是比较幸福的，有人天生就比较悲观。这个基准点和上下限是基因决定。“贫贱夫妻百事哀”的观点有限正确——普遍认为很重要的环境和社会地位，只占到了10%的权重。


    但是幸福也并不是成功学说的一—心态最重要。积极心理学认为，真正能改变你40%幸福度的是你的行为，而不是心态——因为心态不可测量，但是只要你有持续去做的行为，就会有幸福的感受。更长远来说，环境、收入和社会地位在一定程度上也可以通过行为改变。


    所以，只要你持续做一些行为作为练习，就能显著提高自己的幸福感。


    积极心理学之父塞利格曼曾在互联网上招募了411名参与者，随机分配了5种练习方法来帮助人们提高幸福感（Seligman, Steen, Park, & Peterson,
    2005）。对比发现，所有方法都可以显著提高幸福感，而感恩、记录好事和运用自己的优势这三个方法在6个月以后仍然有效。


    我在文章后面列出来了这些策略，你不妨从今天开始试试看。


    # —— 一个总结 ——


    幸福是一种基因，也是一种越来越重要的能力。这种能力50%来自基因，10%取决于环境，还有40%可以通过习得行为获得——幸福是一种可以习得的行为习惯。


    每个人都应该开始学习、练习这种行为。未来时代不一定每个人都能成功，但是每个人都可以通过修炼变得更幸福。


