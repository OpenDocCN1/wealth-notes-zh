    # 预告：斜杠青年是新趋势还是一块遮羞布？

    11-6


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    在2017年的第一周，我们盘点了过去一年的职场关键词，对新一年的职场趋势做出展望。


    “变化”是贯穿其中的关键词。无论是新一代职场人的特征，管理者的调试，还是人工智能对职场的深刻影响，都是如此。


    > 凯文·凯利说，“在这个‘形成’的时代里，所有人都会成为菜鸟……我们永远都会是菜鸟……在未来，我们所有人会一次又一次地成为全力避免掉队的菜鸟，永无休止，无一例外。”——我们是需要不断适应变化的一代。


    在2016年，有一个新词——“斜杠青年”，被炒得火热。很多人////////////////////////////////////////////////////////在工作之余学习新技能。相应地，在自我介绍的时候，他们职业身份也变得多样，比如插画师/视觉引导师/小说家/心理咨询师/摄影师……这也是一种值得注意的变化。


    对于这种现象，人们的意见并不统一：一派认为斜杠青年是新的职业发展趋势，代表了职业的多重可能，而且多重技能、多重收入本身就为应对未来变化添加了更多保障。另一派则认为，“斜杠青年”不过是一事无成、样样稀松的“遮羞布”……


