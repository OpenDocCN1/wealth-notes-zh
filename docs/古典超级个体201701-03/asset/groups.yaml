    # 事后复盘，持续精进的重要法门 22-4


    我在周一的文章中提到“老事情写文档，新事情做复盘。复盘会使认知和学习效率提升10倍。”所以，不少人留言问怎么做复盘。


    Nancy187：

    不太喜欢复盘。每个季度老板要求复盘做过的项目时，都很痛苦，因为总觉得自己总结能力差，所以复盘有恐惧感，其次也没有什么具体复盘的思路，所以做项目时到处都是阻力。老师可以分享一些关于复盘的心得吗？


    # 1. 什么是复盘？


    “复盘”本来是围棋术语。对弈之后，棋手们通常会把对局重演一遍：

    去发现自己的错误，理解对手的思路，研究最妥善的走法。很多围棋高手都把“复盘”当做棋力精进的重要法门。


    后来，联想创始人柳传志先生将“复盘”思想引入企业管理领域，并使其广为人知。坊间流传一个“柳传志环”PDF，看上去是PDCA戴明环的对标。


    Preview——沙盘推演

    Do——过程，具体执行

    Fupan——复盘，通过执行过程和开始假设的对比，分析得出结论


    不知道是不是他原创，但这种HYP Y (han yu pin yin)的造字霸气，真是厉害了。


    简单来说——复盘就是将做过的事，重新推演，从中总结成功的经验，发现失败的教训。


    很多人之所以没有长进，其实是在不断重复自己的错误，不断掉进同一个“坑”。作为自我学习最重要的途径，复盘可以帮助你在自己身上克服自己的惰性。


    # 2. 复盘的流程


    先想象最近做过的一件事，然后跟着复盘流程：回顾目标-评估结果-分析原因-发现规律，一起复盘下。


    # (1) 回顾目标


    回忆下你做这件事之前，你的目的或期望是什么？

    这个目标设定得靠谱、精确吗？应用“SMART法则”扫描目标

    有没有发生“目标损耗”？事前定了一个高目标，事后没达到，安慰自己说：“还是有成长的”。

    团队是否还记得目标？是否对于目标有共同的认知？


    ps：目标损耗——由于不愿承认计划和现实差距而产生的偷偷降低目标标准的行为，比如你心里计划背100个单词，实际背了50个，你会安慰自己这也还不错。


    # (2) 评估结果


    满分100分，你给自己打多少分？

    差了多少分？差在哪里？

    如果能够再提高10分，你希望提高在哪里？


    # (3) 分析原因


    情景再现，一个个环节回顾事情的事前、事中、事后全流程，分析成功或失败的关键原因。

    可控的：有没有更好的做法？是不是全力以赴？

    需要合作的：自己的部分做好了吗？需要合作部分，是否为别人留出了足够的空间、时间和支持？

    不可控的：是否有充分沟通，及时跟进进度？有没有方式纳入控制？有没有控制风险？


    # (4) 总结经验


    哪些事情应该坚持做，哪些应该马上停止做？

    哪些人、行为的价值值得重新评估？

    哪些事可以做得更好？具体该如何做？

    对整个事情背后的规律，你有什么新的认识？

    有没有哪些“经验”，其实是假设？

    我们的很多行为，都基于我们对于事的假设：

    假设“努力”可以“成功”，所以拼命努力；

    假设“读书”可以“智慧”，所以屯集书单；

    假设“小习惯”不会有很大效应，所以不关注。


    一次次复盘，其实就是一次次自我升级“假设”的过程——假设变了，行为也会改变。


    所以可以在“假设”升级的基础上，再制定下一步行动计划，来进一步巩固这种“新假设”带来的习惯。'
