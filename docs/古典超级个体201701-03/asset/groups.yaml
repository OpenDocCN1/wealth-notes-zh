    # 跳槽季，教你一个跳槽动力学18-1


    Hi，入市有风险，跳槽需谨慎，欢迎来到本周的《超级个体》跳槽专题！


    18-1 跳槽季，教你一个跳...


    # ——一个观察——


    如果你今天走到底办公桌，发现旁边的桌子突然空了出来，你的同事不知所踪——而你四周看看发现并未走副房间——你隔壁的那位很可能是跳槽了。


    金三银四是动物发春，人类跳槽的高峰期——年终奖到手，各种公司大量招人，你是不是也蠢蠢欲动，想炒了老板鱿鱼。


    # ——一个概念——


    其实“跳槽”原意可不是什么好词。明代冯梦龙编的民歌集《挂枝儿》里就有一首名叫《跳槽》的歌，歌中的青楼女子哀婉地唱道：“你风流，我俊雅，和你同年少。两情深，罚下愿，再不去跳槽。”


    “跳槽”就是风月场所里面，妓女放弃了上一任金主，找到下家，相当于马儿换个槽吃饭。不过随着时代的变迁，这个词也变得没有了贬义。


    即使你热爱你现在公司和职位，新年也是一个重新思考自己职业定位的好机会——你不一定要换行业、企业，你可以考虑下转换部门、职位。数据显示，有95%的职场人都对新职位感兴趣，但是只有22%的人做出了行动。25-30岁的雇员在一份工作里的平均年限是1-2年。


    转换职位，是一个今年不想，可能明年你也会想的事。


    有些猎头或者所谓的人生导师会告诉你，“怎样跳槽一定会更好”，这其实都是扯淡。所有的人生选择都是概率事件，它不存在一个对照组，能再来一次，没到最后，谁都不知道是不是最好的选择。


    所以遇到人生选择，最重要的不是想着做一个“正确的决定”，而是尽量做一个“高概率正确的决策动作”。


    职业转换的核心原则是：要追，不要逃。


    职业收益 = 薪酬福利 + 职业发展 + 情感体验


    一个人的职业追求归纳起来有上面三方面。（“生涯三阶段”可以看到更多，详见文章3-3）。大部分人想动，不是因为有更好的收益，就是当前职位遇到了斥力。当吸引力和斥力之和明显大于阻力，跳槽动作就出现了。


    # 职业发展


    跳槽的最好理由，是你遇到了更好的职业发展机会。好组织和好行业，都是你职业发展的直通电梯——他们提供职业发展的吸引力。


    一种是你的发展速度跑赢了现有职位，有机会进入更大的空间和更好的团队；组织内就叫升职，组织外叫跳槽。


    一种则是看到更好的行业趋势，而原组织船大难掉头。比如2015年是在线教育元年，传统教育机构的老师纷纷跳出来进入在线的机构或平台，他们并不一定认为原东家不好，他们赌的是在线这个趋势。


    职业如投资——如果遇到真正好的发展机会，减薪进入也值得。就如险书COO桑德伯格说的“如果你得到了坐上火箭的机会，别管是什么位置，上去就行。”


    另一种情况是，因为各种原因，当前的职位遇到了玻璃天花板，或者更糟糕，变成个寡妇职位，实在沟通无果。跳槽也是个好选择。


    当年唐骏任微软中国区总裁，当大中华区总裁上任后，拿走了他的财权、人事权，但是还要他继续拿业绩。这种权、责、利不对等，谁干谁死的职位，彼得·德鲁克命名为“寡妇职位”。


    # 薪水


    薪水是身价的一种表现，跳槽常常带来20%-50%的涨薪。


    先别忙着数钱——跳槽并不会让你能力马上上涨，为什么你会涨薪呢？


    答案只有2个：要么是这个行业前景好，老板能看到未来的钱；要么是商业模式更优秀，相同的能力能产生更多价值，等于你把自己镶嵌到更高价值的链条中去了。


    所以身价到底上升没有，要看时薪而不是月薪——还有很多职位薪水高是因为工作量大、加班没边界，或职务没边什么都要你干——仔细一算，其实是降薪走量。


    35岁前如果不那么缺钱，不要仅仅为钱跳槽。


    # 情感关系


    最后一种跳槽理由是关系问题——和同事关系不好、客户关系不好、上司关系不好……我见过很多基于关系冲突离职的人，他们在新的职业中并没有建立起更好的关系。人际问题往往是个人心智模式与个性修缮、或者职业化的问题——跳槽往往只是再一次掩盖了问题，最好还是在当下修缮。


    还有很多回家备孕、老公换城市等等的特殊原因，就不一一讨论了。


    我把所有的因素都做成了“跳槽动力表”，你可以检索一下，你的跳槽动力到底是什么？


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_82_0.png)


    如果一个人对当下职业环境比较关注，他的注意力会停留在引力部分；而如果这个人真的智慧，他会越过短期、非核心要素，专注长期、核心要素。


    不要盯着不想想要的东西，盯紧自己想要的。


    要追，不要逃。向前跳，才不容易扑街。


    # ——一个策略——


    如何确保自己在追而不是在逃？还是那个答案：做尽可能好的决策动作。你可以用下面4个问题给自己做个决策的自检：


    +   1. 新工作是否能带来最想要的价值？


    曾有个做设计的来访者，前一份工作月薪8k，下家给12K，于是马上行动。半年后痛苦不堪——新公司人手紧张、工作疯狂，常常加班到下半夜。虽然加班费不少，但钱并不是她这个阶段的重点。


    设计是个体力活，她原来给自己安排的是周末读个在职硕士提升下品味，顺便谈谈恋爱，现在变得全无可能。最好的2年年华和一个在职硕士学习机会，值多少钱？


    反正她以每年不到5万元的价格，卖掉了。


    这个阶段，你最想要的东西是什么？新的工作是否真的能够给你这个价值？如果可以，你的能力足够匹配吗？'
