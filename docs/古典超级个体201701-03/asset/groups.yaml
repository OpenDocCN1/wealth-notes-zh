    # 预告：拖延症真是一种“病”吗？12-6


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    我们生活在一个职能越来越“斜杠”的时代。越来越多的 人，正在把兴趣与能力结合在一起，追求职能发挥优势又能创造价值的“多元人生”。


    不过，在此之前，你可能还要面对一个“超级拦路虎”——拖延症。


    # 下面的“症状”，看看有没有你中招的？


    +   每一年 的假期作业都是开学前一天赶完的；


    写稿之前，你撈地板、吃零食、刷微博、逛淘宝，直到天都黑了还没写出一个字；


    被项目截止日期逼得发疯，无数次指天发誓，下次一定早早开始，可事到临头还是 一拖再拖……


    有人说，这是一个“人人都有拖延症”的时代。根据卡尔加里大学教授皮尔斯·斯蒂尔（Piers Steel）的研究，从1978年到2002年，承认自己有“拖延症”的人数百分比翻了四番！目前这个数字还在大幅增加。


    # 为什么我们越来越拖了？


    # 拖延症真是一种“病”吗？


    # 怎么样才能有效克服拖延？


    拖延症被称为“一切自我管理理论的试金石”。什么时间管理、精力管理、结构思考力，都要过了拖延症这关，才能真正 在你身上发挥作用。


    那么，下周我们就来会会这个“终极大boss”。


    本周的奖品是本期联合策划人Susan Kuang的新作《斜杠青年：如何开启你的多重身份》。


    书中有趣地探讨了我们这一代人该如何工作，如何生活，如何与组织共赢。还有一些很值得琢磨的观点：斜杠青年不活在旧观念里，而是在财富/成本的平衡里，活出最大化的多样人生。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_24_0.png)


    古典


    # 这周获得“践行奖”的超级个体是：


    +   @维生素z


    @钛钯麒麟


    @天火仙人


    @蔡婷


    @硕果


    @Edie Dinger


    @御子柴幸


    @漫步华尔街


    @酒城小律


    @甜趣陶心


    以上10位中奖伙伴，赠送你们每人1本签名版《斜杆青年》。具体获取方式：请加我们运营伙伴静姗的微信，微信号：qxjing911 备注：超级个体。加为好友后，请提供中奖证明截图（截本文有你姓名的部分即可），并留下你的姓名、手机号、收货地址，我们会跟你联系。收到礼物后，欢迎在微博上@古典晒出来，分享分享你的喜悦。


    如果你平时经常看《超级个体》，肯定注意到了一个细节——我们将留言处“写下我的思考”改成了“我要留言践行”。


    其实，留言也是一种践行，是最能切入的一个践行方法——能帮你加深对文章的理解，触发了你的思考，写下你的践行计划，还可能产生人生超链接。如果你觉得践行难度比较大，先从留言开始吧。


    明天还有“Susan Kuang”的加餐分享，记得来！


    今天是古典陪伴你成长的第86天，一起加速，成为更好的自己。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_24_1.png)


    “请朋友读” “得到” “古典”


    # 思考精选


    黄健楠 3

    拖延才不是一种病，绝大多数人的拖延是指他们想干一件事情，却迟迟不开始。其实他们什么事情都想干，选择太多，以至于不知道做什么，然后干脆就不选了，最后只能靠最后期限定来倒逼自己的执行力。这本质上是不知道自己什么事情最重要，加上选择困难。


    如果说现在有什么建议来克服拖延，努力锻炼每天三件事（其实我更倾向于叫它每天三个结果）。只要这三件事不拖延就很好了，其他时间就玩呗！不重要的事情，该拖延就拖延；重要的事情，当天就完成。


    练习断舍离也有一定效果，因为拖延的本质是取舍的问题。

