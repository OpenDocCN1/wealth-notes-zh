    # 如何成为一个广结善缘的人？ 15-1


    Hi，欢迎来到超级个体，过个有意义的年，做一个有幸福感的人——超级个体春节专辑。


    如何成为一个广结善缘的人...


    # 超级个体


    ## 善意是最好的修行


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_44_0.png)


    一起职场加速的第102天

    善行有神奇的力量——它能让人宁静，战胜恐惧。

    “施比受有福”，“善有善报”，这些古老的教诲不仅仅仅是文学上的美丽，还有更深的科学原理。


    我们都听过一句话：“施比受更有福”。


    从道德上，这句话很好理解，但是从心理上，给予真的比接受更幸福吗？下面这个试验也许能给我们一个回答。


    一项心理学实验持续3年，研究5名患有多发性硬化症的女志愿者，她们的志愿工作是支持另外67名同样的患者。她们自己受过关于陪伴和心理疏导的训练，每周给这些患者打15分钟电话，为他们提供心理支持。


    3年下来，这5位志愿者在生活满意度、自我价值上都有很大的提高。他们转移了对自己病痛的注意力和变得更加耐心和宽容，而且让自己变得更有自尊和价值。其中一位女士说：“虽然还没找到治愈我的病的方法，但是我现在觉得无论发生什么我都能承受了。”


    最让人震惊的是他们从助人中获得的收益——他们人生满意度的提升是被他们帮助的人的7倍，而且在今后的日子依然存在。施比受有福，善有善报，这些古老的教诲看起来不仅仅是文学上的美丽，也许还有更深的科学原理。


    ## —— 一个概念 ——


    科学家发现，我们体内有两套情绪系统。其中一套是善意系统，当我们在做善事的时候，会分泌一种“催产素”（Oxytocin）的激素——这种物质在女人生孩子期间大量产生，被称为“拥抱荷尔蒙”。


    “催产素”能帮助母亲舒缓压力、降低血压、更好地养育婴儿，是“母爱”的生理基础。在平时，催产素让我们心情宁静、信任对方，甚至加速伤口愈合。


    与善意相对应的另外一套是保命系统，可以称之为恶意系统。当我们怨恨的时候，大脑中有关攻击性的区域被激活，身体中的“皮质醇”会升高。这种激素与压力有关，会加速心跳，并且会进一步增强攻击性。长期的高皮质醇是骨质疏松、学习能力减退的重要原因。


    当你行善的时候，你的身体也被善意地对待着；当你攻击怨恨，你身体里面也在大量分泌着让你焦虑的激素。这也许就是善有善报，恶有恶报的生理基础。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_44_1.png)


    更有趣的是善意往往会有“连锁效应”。被帮助过的人帮助他人的概率大大上升。很多心理咨询师助人的第一原因，就是自己曾经陷入心理陷阱时，被助人者帮助过，所以自己也希望成为帮助别人的人。


    首先先不谈你能不能帮到别人——帮助别人的过程，就是让自己幸福的过程。


    ## —— 一个策略 ——


    你也许会说，我也很想做点好事，但是我没有钱和时间，自己还养不活呢，怎么帮人？下面给你一些攻略：


    ## 1.每个人都有善意的资源，从小事开始


    第一，大部分的善意并不需要你有多么有钱，不过的确需要你更加用心和有创意。首先，每个人都有时间和能力资源，比如替人做点家务，花时间陪陪老人，力所能及范围内，不要惜力。


    第二，每个人都有情绪资源，为他人创造点惊喜或者快乐就是很好的事情。我曾经每天晚上坚持给一个不开心的朋友电话，有一搭没一搭给他讲一点开心的事。过了2年，那个朋友告诉我，那段时间他抑郁症，持续想自杀，我的段子陪他走了出来，熬过了那段最糟糕的日子。


    第三，传递有用的知识和讯息。超级个体有人叫@小芬，每周读完以后，都会重新给她脑图发到自己的朋友圈。也不刻意为涨粉、为变现。但是有很多<|message|>
    因为她的画理解了个人成长的知识，很多 f y 因为她的画更好地复习，节省了时间。这也是一种助人。（如果你也在做类似可以分享给更多超级个体事情，留言告诉我们。）


    佛教认为布施有：财布施，法布施和无畏布施。财、物、时间、知识、观点、情绪、勇气，这都是你能给予的善意，和有没有钱，没有关系。


    ## 2.从身边人开始，扩大范围


    因为我自己是一家公益机构的理事，所以我有机会接触到很多志愿者。有件事小事让我印象特别深刻——在去寄宿学校做心理支援活动里，团队里有一位女士特别热心，对待孩子也非常温柔细致，自己受过良好的心理学训练。


    不过在回去路上，她接了个电话，然后冲着电话里面语气很重地说了几句，就挂了。我问她怎么啦？她特别不屑地说，没事，我们家孩子又闹了，我老公根本就管不住。


    后来才知道，她有空花费整个周末去做公益，却时常找不到几小时陪家人。


    你不需要专门找到一家公益机构才能开始助人，不妨看看你身边的人，父母亲、你的兄弟姊妹、楼下送快递的小伙子、劳累了一天疲劳不堪却有点急需你的收银员、开“优步”又不小心走错路的司机……


    今年雾霾特别重，我们一位同事发起倡议，大家出门多带几个口罩，遇到没有口罩的环卫工人、老人、孩子随手送一个，这就是大范围。这善意形成了“进Langkah效应”，我们买了很多口罩放在公司，支持大家多拿多送。


    ## 3.有意识地去做，多种类地去做


    每周找一天时间，专门告诉自己：今天我要做一件大的，或者几件小的好事。还记得幸福鸡尾酒吗？（见文章14-3）你最好选择那些新奇的，与众不同的善意行为来做，这会让你的幸福感进一步提高。


    ## 4.一个提醒：别过头


    说了这么多善意的好处，最后的提醒是——别过头。很多人摔倒助人这件事上做过了头，有人变成了被道德绑架，有一些则是自虐型的助人。


    区分是助人还是自虐，有2个标准：


    第一：是否是自愿自发。非自愿自发，被道德绑架的助人只是还债。


    第二：是否可持续。自虐型助人者往往过多投入，甚至耗竭自己，其实他们只是需要“被需要”罢了。


    ## ——一个总结——


    “施比受有福”能被心理学实验验证。助人不仅对别人、对社会有好处，对于自己的幸福都大有益处——它是一件做了就有收获，不需要等待回报的事。当我们助人的时候，身上会分泌催产素，让我们变得幸福宁静起来。


    更好的助人方式有：1.从小事开始；2.从身边人开始，扩大范围；3.有意识地去做；多种类地去做。4.自动自发地去做，可持续地去做。


    # 春节·幸福践行8


    ## 善行：刻意做件善事


    佛教认为布施有财布施、法布施和无畏布施。财、物、时间、知识、观点、情绪、勇气，这都是你能给予的善意，和有没有钱，没有关系。关键是发心。


