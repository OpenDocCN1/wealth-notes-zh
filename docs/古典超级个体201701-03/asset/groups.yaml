    \ 01-05 06:52:44\n\n# 知识众筹｜你适合什么行业？要看这个行业的节气 11-5\n\nHi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。\n\
    \n## 古典\n\n该进入什么领域？其实我觉得和养生差不多——让身体符合行业节气。\n\n新年第一周，整周都在聊趋势——周三邀请大家一起来做“行业分析师”，大家参与的热情和质量，再次超出预期。后台共收到308条有效的留言（这个数字还在持续上涨），目前，已精选120人次，共涉及30个细分行业的观察。\n\
    \n## 一、新兴行业\n\n3D打印：爆发式增长之后，目前表现低迷\n\n行业分析师：且听风吟\n所在行业：3D打印\n总体态势：2015年这个行业呈现爆发式增长，2016年业绩逐渐下滑，一直到2017年初都处于低迷情况。\n\
    领先机构：3Dsystetm、Stratasys、EOS，国内在这个领域还稍显落后。\n行业热点：现在各大巨头在寻找能与3D打印结合的行业，扩大市场，使其普及化。\n\
