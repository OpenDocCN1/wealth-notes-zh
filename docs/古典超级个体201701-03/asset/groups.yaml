    最后是特殊资源——不同的地方拥有不同的资源。大城市几乎集中了中国最好的教育、艺术、医疗、金融资源；还有政治资源（如果你玩这个的话）。而小城市也有特殊的资源：和父母亲生活在一起，在家乡生活的归属感，以及来自家庭的各种人脉关系。


