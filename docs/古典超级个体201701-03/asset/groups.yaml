    留意自己行业内与人工智能、大数据接口的职位和公司，保持对这件事情的观察和好奇。


    对于中高层管理者来说，他们也面临下面这些转型：


    +   1. 视智能机器为同事。


    根据埃森哲的研究，未来几年，机器人可能会成为你团队中的一员。他至少是下面3个角色中的一个或多个，他可能会做你的助理、顾问，甚至执行者，要懂得用好这些人。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_7_0.png)


    +   2. 专注于判断性工作


    未来，人工智能能承担越来越多的常规性工作，甚至辅助人们的决策，但它无法开展“判断性工作”。


    > “判断性工作”是指——在无法获得充分或可靠信息时，如何运用人类自身经验和专业知识来作出关键的决策。


    +   3. 专注业务——将行政工作交给人工智能


    今天的管理者花很多时间在协调和管理控上，而这部分工作未来很大部分会被人工智能接管。


    诸如时间安排、资源分配、报告等，未来的管理者应该是业务专家——如设计机构艺术总监、医院外科主任医生、科研项目负责人或是管理咨询项目经理等。有专业技能的管理者，会更加受欢迎。


    +   4. 像设计师和教练一样工作


    管理者的创造力固然重要，但激发他人创造力，并且整合的能力更重要。


    讲了这么多，来做个总结——其实你不妨把人工智能时代想象成一个初入职场的理工天才，比如《生活大爆炸》里的谢尔顿——他体力比你好，效率比你高，记忆力很好，而且知识更新还比你快——但是社交能力很糟糕、对于复杂和不确定的事情一筹莫展——你和他PK是无意义的，要学会与他快乐地玩耍。


    遵循原则——做机器不能做的事，同时要学会与机器合作。


    回到开篇的提问：未来的职场到底是“终结者”还是“大白”？——估计都不是，人机高度合作的《星际迷航》可能才是最后结局——人类通过与机器合作，成为更强大的物种，可以去到以前无法触及的地方。


