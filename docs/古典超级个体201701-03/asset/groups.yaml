    后来，我们调研了一个能联系上的用户，她说——可以放，她写出来就是希望更多人认识到什么是正确的事，然后我们就果断上去了。如果其他超级个体认为有不便之处，请留言告诉我，好不好？以便我及时把名字隐去。


