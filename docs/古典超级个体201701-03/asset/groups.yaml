    # 超级个体


    # 追求幸福里踩到的三个坑


    一起职场加速的第97天

    参差多态，乃人类幸福之本源，且幸福犹如知教，是一种神秘的东西，永远不要对它加以理性的阐释。


    # ——三个误区——


    # 1.把幸福当人生目标


    亚里士多德曾说，“幸福是人生的意义和目的，是人类存在的全部目标和终点。”这句话貌似励志，却在心理学试验中一次次被挑战。心理学实验证明，以幸福为全部生活目标的人，并没有变得更加幸福。


    心理学家芭芭拉·弗雷德里克森（Barbara Fredrickson）和她的团队做了一个实验，他们给人们看能让他们愉悦的电影片段。一组人被提前告知“你会更幸福”；另一组则什么也不说。结果显示，被提前告知会“会更幸福”的人，情绪反而变糟糕了。


    难道追求幸福会恰得其反吗？


    结果发现，追求幸福的确会让人更幸福——但是要选对策略。她区分出2种不同的方式：


    +   - 幸福优先策略：优先把可能让自己幸福的事情安排在生活中，关注点在“安排生活”，幸福是随之而来的概率事件。

    - 幸福唯一策略：认为幸福是生活唯一和最有意义的目标，关注点在“幸福的感觉”本身。


    结果发现，幸福唯一策略的人满意度呈现下降状态（相关系数-0.34），而幸福优先策略的人则显得变好（相关系数0.45）。（一般绝对值大于0.2是有点关系，大于0.4则关系较大。）


    我们在正文里准备了这个量表，感兴趣的朋友可以自测区分一下你更加倾向于哪一种？


    | 幸福优先策略 | 幸福唯一策略 |

    |---|---|

    | 每天的生活，我会先考虑做哪些让事情变得更有趣 | 我生活的意义取决于我有多幸福 |

    | 多到程度上的幸福感会影响我的重要决定（如找工作、买房） | 如果没有凑到幸福感，可能是自己哪里出毛病了 |

    | 我会根据幸福程度安排我的一天 | 我很在乎是否幸福，即使当我感到开心的时候也一样 |

    | 我尊重那些根据幸福程度来做决定的 | 幸福对我来说极为重要 |


    # 幸福有点像赚钱，你把注意力放在做好事情、创造价值上，钱也就来了。你天天想着赚钱反而赚不到。


    # 2.重复过去的幸福


    我们每个人都曾有幸福不已的经历——第一次牵她的手，第一次拿到工资，第一次看到大海，第一次下雪……可是为什么随着时间久了，啥都没感觉了呢？当年那个吃个冰激凌就会很幸福的小男孩哪里去了？是你变了吗？


    其实吧，你真的变了。

    我们大脑具有很强的适应能力，幸福的事情反复做，边际效应会迅速降低，幸福感就会锐减，所以说，我们都在变。


    # 3.分析幸福


    你女朋友可能问过你：你喜欢我什么呀？我们为什么这么好呀？


    你怎么回答的？我敢打赌，只要你答，她都不会太满意。


    咨询师很早就发现，把伤心的事情写下来会降低负面情绪，这是一种重要的抗抑郁的手段。不过你可能不知道——把幸福的事情写下来也会降低幸福感。


    为什么呢？加州大学心理学教授、《幸福有方法》的作者索妮娅·柳博米尔斯基（Sonja Lyubomirsky）做了个这样的实验：


    实验中设置了4组参与者：


    +   第一组：在大脑里回放自己一个幸福的经历；

    第二组：需要思考这个经历的每一个步骤，还要分析：为什么会这样，这次经历和以往有什么不同等等；

    第三组：通过写作回顾那个幸福的经历；

    第四组：通过写作回顾和分析整个幸福的经历。


    结果发现，使幸福感降低的并不是写作，而是分析。脑补幸福片段的第一组最幸福。其次是第三组——因为要写出来有逻辑，必须进行一些分析。而脑子里分析和写作的那两组都那么幸福了。理性分析会降低所有情绪体验。


    如果你希望自己更加幸福，请一定记得这个结论：分析痛苦，品味幸福。遇到负面情绪，通过写作来分析是件好事。（第13周讲拖延症时教大家的自由书写，还记得吗？）但遇见幸福的事，体验就好。


    “好事经不起琢磨”至少从心理层面上是成立的——没事别总想“我怎么过得这么好，为什么呢？”“这段时间我怎么这么有运气，为什么呢？”——踏踏实实，心安理得地享受就好——我就是这么幸运、霸气、可爱的人啊！


    就好像英国作家切斯特顿 (Gilbert Chesterton)说：“幸福犹如宗教是一种神秘的东西,永远不要对它加以理性的阐释。”


    那我们昨天不是刚分析了幸福吗？——这就和学习游泳一样，刚开始要分解动作，但是实战的时候，千万要即时反应，别多想。


    如果再遇到女孩问：“你为什么爱我”“你爱我什么”这样的问题时，别傻乎乎分析了吧。一把抱住人家说，“不知道，我想可能这就是缘分吧，看，有流星！”


    既然出了题，我也给你个参考答案：


    +   梁思成问林徽因：“有一句话，我只问这一次，以后都不会再问，为什么是我？”

    林徽因答：“答案很长，我得用一生去回答你，准备好听我说了吗？”


    看人家这个境界。


    # ——一个总结——


    今天我们分析了幸福的三个误区：


    以幸福为最高目标往往不会幸福；总想回到过去，重复简简单单的幸福，不如给自己调一杯幸福鸡尾酒；最后，分析痛苦，而品味幸福。


    # 春节·幸福践行3


    # 品味：停下30秒品味生活以及能让你幸福的事


    一定有人曾告诉你——幸福在于发现与品味当下。但是我们总是太忙于目标，即使遇到精心时刻，我们还是忙着发朋友圈。


    心理学家发现，其实每天只要1分钟的品味精时时刻，就能让你幸福一整天。今天就开始试试看吧！


    找到一个让自己特别幸福的瞬间。如果是吃到特别想吃的东西，那就放慢咀嚼速度，静静地感受食物的香味、口感。假如看到很好的景象，也不要着急用手机拍下来，而是用眼睛和大脑默默的观察，记录在自己内心。如果是遇到了自己很想见的一个人，也不要着急说话，打招呼，用一分钟安安静静地品味在一起的感受和互动。


    总之，给自己一分钟时间，调用你的所有感官，看、听、嗅觉、味觉、感觉、心灵……深刻地体验一个美好的幸福时刻。


    并想想看，如果在春节假期里让自己更幸福，你会做哪8件事？然后每天做一件，边做边品味，试试看。


