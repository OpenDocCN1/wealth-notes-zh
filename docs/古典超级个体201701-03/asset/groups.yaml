    # 向拖延同志学习！ 13-1


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    13-1 向拖延同志学习！


    # —— 一个问题 ——


    有人说，这是一个“人人都有拖延症”的时代。一项调查数据显示，目前中国80%的大学生和86%的职场人都患有“拖延症”。50%的人不到最后一刻，绝不开始工作。13%的人，没有人催，不能完成工作。


    > 《福特2017趋势报告》(2017 Looking Further with Ford Trend Report)甚至把“拖延症”列入“新兴微观趋势”之一，认为“守时已成为濒临消亡的艺术，拖延症可能会成为一种‘新力量’”。


    本周我们谈谈拖延症。


    # —— 一个概念 ——


    拖延，Procrastination，在拉丁文中，“pro”意为向前、推进、支持，而“crasinus”则译为“明天的”。所谓的明日复明日，不断把今天的事情推到明天去，就是“拖延”拉丁词源的字面含义。


    心理学指的拖延，则是人们那些“主动选择的、不理性的、长期的拖延行为 ”(Steel, 2007; Solomon& Rothblum,1984)，即人们明知道可能会带来负面结果，却仍然选择拖延的行为。


    # 拖延不是“症”


    “拖延症”这个词的流行，让很多人把拖延当成疾病来看待。有病就得治啊。


    于是，有关治疗“拖延症”的书成为畅销书，网络上“战拖”、“治拖”的帖子特别受欢迎。有些方法短期有效，可能过了一段又“病情”复发，于是又找些新方子去对付。如此反复多次，无法“根除”，拖延症就变成了“拖延癌”。


    # 不是所有推迟都是拖延


    所有的拖延都是推迟，但并不是所有的推迟都叫做拖延。


    +   1. 要看工作和写作哪个更重要。假如工作确实更重要，而且占用的时间精力无法缩减，那么推迟创作计划虽然结果有害，却亦不可避免，是“必要推迟”。

    2. 你重新盘点了t一遍计划，发现自己不必赶在工作最忙的时候开始写作计划——完全可以推迟1个月才开始。这样每个阶段专心做一件事，进度也许反而更快，这叫做“积极推迟”。

    3. 如果你通过自我分析，发现从内心深处来说，你想写作只是一时冲动，并无真正的兴趣和动力，还不如踏实做好工作。写作既没有动力，也没有资源——这其实是妄念——直接“断舍离”掉好了。

    4. 只有当你分析完以后发现：写作对你有意义，而且推迟的确会妨碍进度。仔细分析下来——并不是时间不够，自己回家的时问并没有好好利用，周末陪孩子的时间算下来其实不多，更多花在无意义的事情上，分散了精力。这种本可以避免又有害的推迟，就是“真性拖延”。'
