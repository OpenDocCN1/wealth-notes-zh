    # 互动｜买买买买到幸福的攻略15-4


    Hi，欢迎来到超级个体，过个有意义的年，做一个有幸福感的人——超级个体春节专辑。


    关于幸福的互动讨论和提问都不算多——因为幸福本来就是个很主观的行为，所以你觉得幸福就好，没有什么唯一正确的方法，只能说某些方式概率大一些。不过下面这个问题，我想是很多人想问的。


    老师，听说中彩票不会让人幸福，是真的吗？有钱真的不会让人幸福吗？我怎么觉得买买买很幸福呢？


    这个问题很有趣，我先列举几个试验结果。


    # 中彩票会更幸福吗？


    1978年，西北大学的Philip Brickman和Dan Coates以及晏切斯特大学的Ronnie Janoff-Bulman在《个性与社会心理学杂志》上发表文章说，中了彩票大奖的人并不比常人觉得更幸福，长期来说，他们甚至比那些因为意外事件而瘫痪的患者更加不幸福。


    他们研究了22个中了彩票大奖至少30万美金的人（相当于今天的700万人民币）和22个普通人，还有29个在事故中瘫痪的患者。他们会每天做主观幸福感打分。


    在结果上，中彩票的人在刚开始会幸福很多，但是随着时间推移，幸福感的差异越来越小。同样的道理，患者的幸福度在刚开始的时候很低，但是长期来说，他们会恢复到常态——甚至有些人比中彩票的人更幸福。


    那么，如果不是彩票这种横财，有钱人会不会更幸福呢？


    1985年有过一个研究——抽取了100名福布斯的榜上人物和100名随机从电话簿上抽查到的人，其中有49名富人和69名普通人接受了测试，结果显示富人的幸福感比普通人略微高一些。


    # 收入增长会提高幸福感吗？


    哈佛商学院和伦敦大学帝国理工学院的一份研究报告，总结了欧洲和美国30年间人们对自己幸福的感觉。虽然这三十年来人们的平均收入都是在增长，但是人们却一点儿也没变得幸福起来。


    这个研究结果与中国的情况也类似，2008年中国人均GDP是3000美金，2015年是8016美金，但是整体国民幸福感并没有显著上升，反而抑郁症、自杀率上升了很多。这也证明了在超过一定阶段（人均年收入3000美金），收入与幸福感没有明显的关系，在人均年收入8000美金后，基本脱钩了。


    # 而且用钱追求幸福感的路径也是很有规律的：


    +   穷，买生存：安康健康

    买享乐：大吃大喝

    买物质：买名牌豪车、房产

    买奢侈品、艺术品：红酒、艺术品

    买体验：环游世界、潜水、读书

    追求内在、买不到了：幸福、自我价值


    和香港、日本、韩国、瑞典很多国家的朋友聊过，他们也都走过这样一条用钱买买买的道路。今天你鄙视“老佛爷”店里的中国人扎堆儿买LV，其实20年前日本人也干这事，再早点是美国人。这没什么不好的意思的。'
