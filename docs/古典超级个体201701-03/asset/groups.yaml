    ## 1. 跳槽的动力公式：


    职业收益=薪酬福利 + 职业发展 + 情感体验


    跳槽也有阻力，对于未来的不确定，新行业和企业的不熟悉，以及需要重新建立关系成本。当动力大于阻力的时候，跳槽的动作就会发生。


    2. 发展中要关注的是优秀的行业趋势、优秀的团队合作机会，要躲避的是玻璃天花板和虾米职位；不建议在35岁前为钱跳槽。即使是更好的薪水，也要躲避高薪背后的风险，很多时候只是走量的月薪。


    3. 如果把职业转换的动力按照“吸引力、斥力，短期、长期”4个要素分为四个区域，那么最需要关注的是长期的吸引力，也就是真正指向“职业发展”的那些因素。要追不要逃，不以职业发展为核心的跳槽都是要流氓。


    ## 4. 有四个问题一定要在跳槽之前自检一下：


    - 新工作是否能带来最想要的价值？

    我失去的是我能承受的吗？

    新工作中的最恶心的部分我看到了吗？我看到的是艺术照吗？

    我现在的工作是不是真的已经没有价值了？


    最好是提前一个月思考这些问题，收集相关信息，想清楚再选择。


    ## 超级个体


    ## 跳槽动力学


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_90_0.png)


    一起职场加速的第123天


    遇到人生选择时，最重要的是不是做一个正确的决定，而是尽量做一个高概率正确的决策动作。要追，不要逃，向前跳，才不容易后悔。


    5. 大部分的高级职位按照：内部提拔——亲身体验——熟人举荐——招聘发布的流程一层层漏出，所以如果你仅仅盯着招聘网站，也许很难找到好职位。选择好的求职路径很重要。


    6. 在你的熟人圈寻找工作机会——把你的想法告诉可以信任的人，展示自己的作品，在工作中创造里程碑，让更多人看到你的能力。这意味着在你现在的工作中就有许多机会，当你张口去问，睁眼去看，就会出现很多机会。


    ## 超级个体


    ## 最佳求职路径


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_90_1.png)


    一起职场加速的第124天


    普通人的求职路径，和好职位的招聘路径，几乎完全相反。选对路径，你几乎能避开80%的人，大部分的胜利，都是心智模式的胜利。


    7. 最好的离职时期是阶段性任务完成，功成身退的时候。为自己准备一个足够的理由；并且找到自己直接上级，口头谈几次，最后再用辞职信正式表达。


    8. 不要在现在同事、未来同事面前抱怨自己的上一家公司。如果有可能，在商务、人事方面多给一点支持，会为自己积累业内良好的口碑和以后的人脉资源。


    9. 换游泳池并不能解决不会游泳的问题。有一些问题比如自我管理、人际沟通、不懂得收集信息、不知道自己要什么，并不会随着转换工作而消失。反而会因为一次次过度新鲜感以后落到同样的状况而陷入习得性无助。这种情况跳槽不解决问题，不如原地修炼好。


    10. 人活着肯定不是只是为了发展发展发展发展，发展只是为了有一天你遇到了真正要追寻的东西，你有更多空间和机会去追逐。如果有一天你遇见了生命中更重要的事情——比如梦想、家庭、自由……上面的这些原则，都可以放弃。


    成长，长成自己的样子！


