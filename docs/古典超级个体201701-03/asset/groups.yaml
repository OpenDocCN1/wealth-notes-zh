    ## 问答 | 拖延的人怎么制定计划更靠谱？ 13-4


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    这两天拖延症这个话题发出后，后台很多人都说——我就是个很拖延的人，说的就是我啊。但从大家留言中，我们还发现一个问题，很多知道自己有拖延的人，平時也会制定计划，但就在执行过程中，不断地推迟，造成了任务没及时完成。


    ## 为什么明明制定了计划却没法实现呢？


    今天分享一篇之前写的文章，谈谈拖延症相关的一个话题——制定计划。


    在淘宝上看到一条喜欢又有點兒小貴的褲子，你点击丢入购物车，想着等双十一打折就买——虽然还没有下单，你心里就已经觉得挺满足；


    新年开头，单位要你提交一个计划——你肯定不愿意啊，但是当写完这个计划，你自己却变得挺踏实；


    ## 蔡格尼克效应


    在1927年的柏林，几个大学教授和学生一起去餐厅吃饭。一名侍应生记住每个人的点菜——老外点菜非常复杂的，牛排几分熟，加什么酱料……这群教授想，这个哥们肯定会搞砸的。

    最后让大家大跌眼镜的是——侍者把菜品和饮料准确无误地端了上来。

    饭后这群心理学家走出餐厅，一路还在聊这个神奇的侍应生。这时俄罗斯心理学生布尔玛·蔡格尼克突然发现，她把围巾落在了餐厅。她马上返回餐厅，找到那位记忆力超群的侍应生——我的围巾呢？

    没想到那个哥们一脸蒙圈，完全不记得她是谁。

    蔡格尼克愤怒地问：“你不是记忆力特好吗？怎么一转身就忘记了呢？”她以为他故意开玩笑。

    哥们儿回答：“我对客人点的菜，只记到端上来为止。”


    布尔玛·蔡格尼克研究了这个奇怪的现象，得到一个结论——我们和那位侍应生一样，都很少忘记自己脑子里没有完成的任务。这些任务会在我们的潜意识里，像没有拿到糖果的孩子，一直纠缠着我们。

    过多、过高的预期会压死我们的大脑。


    这个效应称为“蔡格尼克效应”——不知道你是不是和我一样，很羡慕那个心理学的启蒙年代，啥都能搞个效应啊。


    ## 大脑演练，放下了未完成任务


    去年，佛罗里达大学的罗伊博士解开这个谜。


    他把面临期末考试的童鞋分成三组，一组集中想着一个大馅饼；第二组集中想着考试；第三组想着考试，但是要制定一个具体的学习计划。


    ## 在我们制定计划的过程中，大脑至少完成了下面四个动作：


    ## 预演了未来


    走通了最好的一条路——如果你是一个围棋高手，你大脑里面至少向前演习了5步、近1000种可能性。所以创业都从一个好的BP开始，一个足够好的BP能让看的人也热血沸腾，因为在大脑里面，你已经预演了未来。


    ## 释放了焦虑


    计划完，大脑觉得：“哦，这事做完了，放松下。”你可以空出脑子想下一步事情了。


    ## 提高了信心


    当真实做的时候，大脑会觉得：“嗯，这个感觉又很熟悉，我很有信心。咦，我为什么要说又呢？”因为预演过成功，你会感觉比较有信心完成。


    ## 扩大了掌控范围


    当做完又达成了时候，你对自己说：“我的计划都完成了！”你的自我效能会向未来延伸，敢于制定更大更多的计划。你看到一个制定胆大包天的计划的人，不是怯懦。他们都是从小计划搞起的。


    理解了计划的底层逻辑，我们就知道为什么你的计划有时候没有用——那么如何制定更有效呢？


    ## 1. 先定个不靠谱的计划


    有时候，定计划搞不下来的原因是——计划赶不上变化，于是你焦虑到没法定计划，这个时候，即便是定下来不靠谱啊！


    甚至一遇到变化，很多人虽然没有意识到，他们脑子里开始上演“恐慌故事”——我做砸了以后怎么办？我如果失手怎么办？太可怕了！！


    这些预演的负效果很吓人，他把未来发生的恐惧全部压在了当下。你可能有ABCD四种路径，分别有10%、20%、30%、40%失败率。但是一旦陷入“恐慌计划”，你在当下承担的就是10+20+30+40
    = 100%的失败率——谁受得了？


    对外表达出来就是“做这个呢……有这个问题，做那个呢……有这个问题……哎呀，我好痛苦！”


    佛教里上这就叫“妄念”，心里叫做“远离颠倒梦想”，你被焦虑压死了。


    其实，定计划本身是降低焦虑的好方式——遇到任何让你焦虑的事情，尽可能多、详细地记录下来。然后列出一个最低线目标，并写下尽可能详细的步骤。简单来说，你可以制定一个“最糟糕结果的行动计划”——恐慌计划。


    写的时候，可以不用管这个步骤靠不靠谱，步骤前后顺序是不是对，也不要内心评价。先让自己尽可能详细地写下来。


    我说尽可能详细，不是“会议做砸了怎么办的三件事”或者“项目做不下去如何收场2个要点”这种。一定需要把这样的任务细分细分，分解成20-30个步骤，形成个大列表。


    相信我，写得越多，你肯定越宁静。越宁静，才越有可能思考真正靠谱的计划，你会发现在你这个最糟糕计划上，慢慢迭代出真正靠谱的计划。


    好啦，所以定计划没有用的第一个理由，往往就是，你的恐慌计划定得不够详细，没有详细到大脑愿意把焦虑排放清除。


    ## 2. 定计划时，把你的投入和时间乘以150%


    前面说过，定计划的时候，大脑在预演未来。


    不过大脑在预算时，往往比真实情况轻松很多。一项心理学研究要求即将毕业的学生估计自己的毕业论文提交的时间，结果只有30%的人按照自己预估的完成，大部分学生需要多一倍的时间。


    更加糟糕的是，如果人们彼此合作，这个计划拖延程度会更加夸张——悉尼歌剧院在1957年计划建造，澳大利亚顶尖的建筑施工团队的投资预算是700万澳元，目标1963年完成。真实的情况是，在1973年完成，用了1.02亿澳元——比计划多用了10年；预算是计划的14倍！


    是不是想起来，你的项目和计划还算靠谱的？


    计划是一个预演未来方式，不只过是一种比较容易的方式。所以，记得150定律——把你的投入和时间乘以150%，合作项目甚至可以乘以200%，是一个更加接近真实的数字。


    ## 3. 目标有压力，下一步行动要无压力


    定计划的障碍，有时候就是定计划本身。因为计划缓解了焦虑，而没焦虑你就行动呐。


    你有没有遇到那些定计划爱好者（或者就是你）——不管遇到什么事，先制定一个特别详尽的计划，然后贴在床头或者案头——你的焦虑锐减，但是因为没有了基本的焦虑，你再也不行动了。


    事情肯定会变糟糕，怎么办？再定一个计划呐！——因为在脑子里走一圈的能量和真实的走一圈相比，前者实在舒服太多呐。


    所以，计划要高，第一步要小。每次定计划、或者开会决议以后，一定要有个有压力的目标，以及一个无压力的“下一步行动”，让这个压力从行动释放出去，才有可能引发更多的行动。


    ## 顺便说一个功能——定计划，也可以做心理治疗


    那些没法告别的过去，是不是也可以通过定计划实现呢？


    其实也可以的。在完形心理学中认为，每个人都有很多很多“未完成事件”，如果这些事情没有办法了结，会持续盘旋在我们心里，寻找好的方式“完结”。


    定计划就是一个很好的方式！


    有一个朋友和父母关系一直很不好，因为从小在姥姥奶奶身边长大，父母对弟弟偏爱，对他有太多的不公平对待。长大后虽然能够理解，但却无法跨过那个伤害。每次面对父母成为一场酷刑——你也许也经历过——理智上要好好对待，心里却一次次的委屈，好多次生气的
    (>=) 话到了舌尖，又一点点吞回去。


    “好像吞刀片一样。”他说。


    我请他给父母亲写一封信，信中一定要声泪俱下，血泪无边地控诉他的父母。然后，一定要有 一个非常详细的计划——选择在什么时间、地点，然后再用什么样的语调给父亲读完，然后如何防止父母发颤，甚至发病……


    我请他把这些全部认真写下来，至少分成30个步骤，一定要写在纸上，不要用电子邮件。


    他在家一边哭一边写信，然后写到最后，心情舒服用起来，问我，我不太想和他们读了，怎么办？


    我说，烧了。


    烧掉信，我们留下那些计划。每次有不爽，看看这个计划，就平静了。


    你有没有忘不了的过去？完成不了的心愿？想做没机会做到的梦想？定一个计划，也许不一定能实现，至少能忘却。


