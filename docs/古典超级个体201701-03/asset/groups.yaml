    # 80%的人都踩过的3个幸福误区 14-3


    Hi，欢迎来到超级个体，过个有意义的年，做一个有幸福感的人——超级个体春节专辑。


    14-3 80%的人都踩过的3个...


    # 超级个体


    # 追求幸福里踩到的三个坑


    一起职场加速的第97天

    参差多态，乃人类幸福之本源，且幸福犹如知教，是一种神秘的东西，永远不要对它加以理性的阐释。


    # ——三个误区——


    # 1.把幸福当人生目标


    亚里士多德曾说，“幸福是人生的意义和目的，是人类存在的全部目标和终点。”这句话貌似励志，却在心理学试验中一次次被挑战。心理学实验证明，以幸福为全部生活目标的人，并没有变得更加幸福。


    心理学家芭芭拉·弗雷德里克森（Barbara Fredrickson）和她的团队做了一个实验，他们给人们看能让他们愉悦的电影片段。一组人被提前告知“你会更幸福”；另一组则什么也不说。结果显示，被提前告知会“会更幸福”的人，情绪反而变糟糕了。


    难道追求幸福会恰得其反吗？


    结果发现，追求幸福的确会让人更幸福——但是要选对策略。她区分出2种不同的方式：


    +   - 幸福优先策略：优先把可能让自己幸福的事情安排在生活中，关注点在“安排生活”，幸福是随之而来的概率事件。

    - 幸福唯一策略：认为幸福是生活唯一和最有意义的目标，关注点在“幸福的感觉”本身。


    结果发现，幸福唯一策略的人满意度呈现下降状态（相关系数-0.34），而幸福优先策略的人则显得变好（相关系数0.45）。（一般绝对值大于0.2是有点关系，大于0.4则关系较大。）


    我们在正文里准备了这个量表，感兴趣的朋友可以自测区分一下你更加倾向于哪一种？


    | 幸福优先策略 | 幸福唯一策略 |

    |---|---|

    | 每天的生活，我会先考虑做哪些让事情变得更有趣 | 我生活的意义取决于我有多幸福 |

    | 多到程度上的幸福感会影响我的重要决定（如找工作、买房） | 如果没有凑到幸福感，可能是自己哪里出毛病了 |

    | 我会根据幸福程度安排我的一天 | 我很在乎是否幸福，即使当我感到开心的时候也一样 |

    | 我尊重那些根据幸福程度来做决定的 | 幸福对我来说极为重要 |


    # 幸福有点像赚钱，你把注意力放在做好事情、创造价值上，钱也就来了。你天天想着赚钱反而赚不到。


    # 2.重复过去的幸福


    我们每个人都曾有幸福不已的经历——第一次牵她的手，第一次拿到工资，第一次看到大海，第一次下雪……可是为什么随着时间久了，啥都没感觉了呢？当年那个吃个冰激凌就会很幸福的小男孩哪里去了？是你变了吗？


    其实吧，你真的变了。

    我们大脑具有很强的适应能力，幸福的事情反复做，边际效应会迅速降低，幸福感就会锐减，所以说，我们都在变。'
