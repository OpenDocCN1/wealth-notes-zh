    ## 价值观：除了缺钱你还缺啥？19-1


    19-1 价值观：除了缺钱你...


    美剧《六人行》里，罗斯遇到了一选择难题。有两位女孩同时向他示好，一个是他从小暗恋的瑞秋，一个是美丽聪慧的女博士茉莉。他左右为难。


    在损友们的忿意下，他列了一张两个人的“优劣势清单”，列出两个人的优势、劣势……希望做个决策。


    茉莉，温柔美丽学历高而且对自己好；瑞秋，虚荣娇纵富家女没共同语言而且脚踝有点粗（最后一条被看到是死罪啊）……这张清单最后还不小心被瑞秋看到，你说糟糕不糟糕。


    不过故事最后，罗斯和瑞秋在一起了，因为瑞秋看到茉莉的缺点栏只有一个：


    She is not Rachel（她不是瑞秋）。


    你有没有遇到过这样的情况？别人都说“好”、“完美”的职业或者人生选择，你却并不一定买账，因为she is not Rachel——这背后就是你的个人价值观。


    ### —— 一个概念 ——


    每件事物对于自己都有不同的价值。这些价值在你心中的重要程度排序，就是你的价值观。价值观是我们判断对错和做选择的内在标准。价值观如指纹，每个人都不完全相同。


    心理学家统计，在你一天中，你有意识无意识做出的决策大概有100多个——所以每个人肯定都有自己的价值观，但是并不一定每个人都清晰自己的价值观。


    ### 搞清晰价值观有什么用？


    ### 1. 决定职业满意度


    调查显示，对于职业满意度最大的决定性因素不是钱，而是职业价值观的满足程度。


    对于实习阶段的人来说，拿多少钱不要紧，开阔眼界最重要，因为此时可能性是他的核心价值；


    对于职业发展前期的人来说，发展速度是他的核心价值，钱多钱少也不那么重要；


    而对于有个孩子，还背着房贷的中年人，稳定的收入也许成了他最看重的；


    等到家庭稳定，经济放宽，实现自身价值，做点有意义的事又成了他新的核心价值观。


    ### 2. 做好人生重大决策


