    \n这是“超级践行者”征文活动一等奖的获奖作品之一，作者：超级践行者001 ——威红。\n\n两个月了，每天6点半，准时报到，开启美好的一天。\n\n这两个月刷了许多新知，每天都在思考和行动，我的身上确实实发生了许多的变化，每天都在一点点变好。\n\
    \n## —— 两个月以来的改变 ——\n\n## 一、认知升级\n\n从专栏里学习升级大脑，学习转变思维方式，知道了付出就是抢便宜，消费观念发生了改变，知道了注意力、精力、时间都比金钱更重要，认识到了成长的重要性，开始懂得投资自己。\n\
    \n## 二、提高了时间利用率\n\n我一直有早起的习惯——6点，有时候会更早些，但起来之后不知道做什么，都浪费掉了。\n\n十月底正式开启学习模式，6点前刷得到其他内容，看海洋体系小伙伴们的文章并写评论。6点起床，6:30-8:00——“营养早餐”时间，《超级个体》专栏，每天坚持学习和思考，到目前近50条留言入了精选（老师给了这么多的奖励，最大的是签名书还有暖心回复，开心）。\n\
    \n这两个月我高效利用了早上的时间，很充实，满满的成就感。\n\n## 三、开始每天写文章\n\n以前我最怕的就是写东西，作文、方案、汇报材料、总结，一碰文字脑袋就短路，就想逃，不得不写时就百度、复制、粘贴。曾经多少次暗暗下定决心要好好练习，却从未行动过。\n\
    \n这次以写留言为契机，终于开始练习了。之后和一群超级个体成员组成了一个小团队——海洋体系拓展群，我们在一起每天写文，到目前我已经写了50来篇了，文章不长也不够好，但行动起来了就是最好的改变，完成比完美更重要。\n\
    \n## 四、朋友多了\n\n我性格比较孤僻，不爱跟别人交流，总把自己封闭起来。加入超级个体后，开始拓展自己的圈子，发展弱联系。另外还认识了很多新朋友——海洋体系拓展群的小伙伴们，我们约定一起写文，相互交流，分享经验，在这里我开始有了表达的欲望。\n\
    \n海洋体系是我们一些超级个体自己组织的一个小团队，我们有共同的目标，一起走在成长路上，我们相互学习，相互鼓励，相互监督，在努力长成为自己的样子。这是一个能发现、提升和实现自我价值的圈子，这是2个月来最意外的收获。\n\
    \n这个小团队里，几个小伙伴对我影响很大：微笑群主，初期创建这个小集体的時候，办事效率极高，深深地震撼到了我。追忆、木马、顺顾、山人、飞翔及其他人，看到他们发文章对于我就是一种鞭策，我就会竭尽所能去学习、去思考、去写文章。\n\
    \n## —— 踐行工具的体会 ——\n\n## 断舍离\n\n以当下的自己为坐标，以需要、适合和舒服为标准，清理物品的同时也清理自己。第一次大扫除后感觉自己重生了，轻装上阵踏上了成长之路。之后，也在践行，现在不需要的东西不会再买了，学习方面没以前那么贪心了，偶尔还是会有些\
    \ Yönet，不有弹窗提醒了。\n\n## 3秒禅\n\n在手机刷微信时运用得最多，效果最佳。现在基本可以保证至少2个小时不刷微信了，甚至有时半天都不记得打开，给自己留出了很多的大块时间。\n\
    \n## 电子静默\n\n电脑不用就不开机，必要时才联网，不再关注娱乐八卦和综艺节目等等，有了更多学习的时间。手机上关掉了除电话外的所有通知，刚开始尝试时心里总会想要看看有没有新信息，心里的通知也关不掉，所以专心做事和读书时就把手机放在伸手够不着的地方，结合3秒禅，忍了几天后，渐渐地适应了。\n\
    \n## 除法\n\n碎片化思考，大块时间执行，比如写这一篇文章，第一天构思基本框架，第二天完成初稿。之后五天每天修改一遍，并复习了《超级个体》之前的全部内容，做了进一步补充和完善。\n\
    \n## WOOP+执行意图\n\n坦白讲这个工具用得不是很好，只实践了3次。存在的问题是每天做的事都差不多，写来写去就那么点东西，总想不出来可能的if。原因是工具用太多了，思考不够深入，自己的知识匮乏，阅历不够，经验也不足。需要继续学习，尽力演绎更多的可能吧。\n"
