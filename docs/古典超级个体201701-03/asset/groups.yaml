  - "[PAGE 22]\n\n# 问答 | 斜杠时，为什么我支持你去收费 12-4\n\nHi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。\n\
    \n谈论“斜杠青年”、“多元人生”，容易引起一种误会：大家一上来就追求“多”。\n\n其实，“多”不是目的，而是表象或结果。况且，我们也提到并并不是所有行业、所有人都适合“斜杠”。从根本上说，无论“多重职业”还是“专精一门”，都是实现人生价值的途径。——没有最好，只有更适合。\n\
    \n阿树：两个斜杠一起做冲突吗？还是先做一个，成熟以后再做另一个更好？\n\n古典\n\n不是冲突的问题，而是你没有资源和时间。斜杠不仅仅仅和时间相关，也和经济实力、人脉资源相关。大部分人很难同时斜杠太多。\n\
    \n举个例子，扎克伯格每年会制定一个工作外目标，他往年的挑战目标是：\n\n+   2009年：每天戴领带上班\n2010年：学习汉语\n2011年：只吃自己杀死的动物的肉\n\
    2012年：每天写代码\n2013年：每天跟除Facebook员工之外的不同的人见面\n2014年：每天写一封感谢信\n2015年：每两周读一本新书\n2016年：制造自己的人工智能\n\
    2017年：今年是走遍美国的各个州（还差30个左右）\n\n列这么多，就想说明一件事：一个人同时做很多事不难，但是同时做好3件事已经很不容易了。所以——斜杠一个足矣。\n\
    \n紫帆：我在钻研某斜杠领域的路上，目前纠结的是主动获取收入，还是继续钻研？二者各有利弊，如何取舍？\n\n古典\n\n如果你目标最终包括获取收入，那么我建议你尽快开始获取收入——前期并不以赚钱为目的，而是以收费倒逼赚钱为目的。\n\
    \n很多人不理解为什么我非要支持大家收费？有三个理由：\n\n+   1. 收费会让你从业余爱好者变成专业人士——专业人士和业余爱好者最大的区别是什么？业余爱好者是做好一次就可以，专业人士是做到不能出错为止。这里面差着一个量级的技能水平，收费会倒逼你提高技能。\
    \ \n2. 收费会让你进入专业圈子，而专业圈子是技能提升的重要条件。 \n3. 收费会让你吸引更高期待值、更加挑剔的客户。他们也让你更好理解技能产品化的方向。\n\
    \n王贻波：“那种什么都懂一点，但什么都不精的人其实是复杂型人才，是一碗麻辣烫。”——老师，针对这句话我有点疑问：很多人都是从不懂到懂再到精这样一路下来的，这有什么问题吗？\n\
    \n古典\n\n问题不在于懂一点开始，而是在“什么都”懂一点——因为“什么都懂一点”所花的时间和精力，足够让你在某个领域有不错的挖掘。\n\n优质的知识结构是金字塔型的，底部开阔但是顶端精深，斜杠甚至是多头精深。而大部分人的知识结构是砖头型的——什么都有但是都不高。\n\
    \n所以，如果没有至少一项特别的优势特长，不要多元。\n\n# 看看还有哪些精彩留言\n\n关于做斜杠青年和做工匠的关系，感触深刻。实际上很多人容易陷入一种误区，觉得自己在所在范围内比较优秀是因为自己干这个工作很多年了。但时间的长度并不代表就一定优秀，关键还是回到基本的概念上：技能优势。像工匠一样专注于某一技能的刻意练习，才是斜杠青年们跨界的前提。\n\
    \n发现自己的长处，一个有效的途径是回馈分析法（Feedback Analysis）。每当做出重要决定或采取重要行动时，你都可以事先记录下自己对结果的预期。9到12个月后，再将实际结果与自己的预期比较。通过这种对自己的跟踪调查，检测自己的技能是否“优于大部分人，并且可以变现”。\n\
    \n程序员/曳步舞老师：『主业程序员，业余学习曳步舞，参加全国性的曳步舞比赛。几乎每天在广场上跳曳步舞，广场上的年轻人被带动，让他当老师，愿意付费学习。』\n\
    \n造价员/健身教练：所学专业是工程造价，从事造价员工作。学生时代开始健身，已有5年之久，每周会去健身馆锻炼，也是业余的私人教练，公司年会上爵士舞也跳得非常棒。\n\
    \n这些斜杠青年的特点是，一直坚持主业，同时对副业也是深深地热爱。副业是另一种自我价值的实现，他们乐此不疲，传授经验给他人。"
