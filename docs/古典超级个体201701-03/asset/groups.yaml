    知识躁狂不是因为知道得太少，而是因为知道得太多，能应用的却太少。


    能力有4个层次：无知无能、有知无能、有知有能、无知有能。分别对应：不知道，知道做不到，知道做得到，不知道（无意识了）但是还能做到。


