    # 如何管理劣势甚至化为优势？ 17-3


    Hi，你好，发现你的优势，聚焦人生可能，欢迎来到《超级个体》优势管理专题！


    17-3 如何管理劣势甚至化...


    谈了这么久的优势——我们谈谈一个绝对避免不开，处理不好也许比优点伤害更大的问题——如何管理好自己的劣势？


    今天谈谈关于劣势管理的三重境界，我们从一个故事开始：


    # 故事一：


    川普这次为什么能当选总统？里面有很多因素——有时代趋势、有民众意见、也有竞选策略等各种原因，今天我们仅从优势管理角度来做个分析——川普的优势管理比希拉里做得好多了。


    川普当选，是强大优势弥补劣势的教科书般案例。川普有着传统媒体所诟病的所有毛病——政治不正确、讲话不修边幅、商人的逐利和肤浅……但是他也精准地抓住他的拥护者的痛点——底层民众对于全球化的不满、对于老政客腐败的厌恶。于是他的战略基本上是——对啊，我就是个烂人，但是我有明确的优点。这就是一个强调优势，弱化劣势的打法。


    在整个竞选中，希拉里的团队大部分的精力都用来解释——为什么川普是烂人，他到底有多烂？却很少提及自己为什么好？好在哪里？


    整个竞选过程中，川普的策略就是不断地拉低底线——我是烂人我承认。但是你看希拉里，她也是烂人啊！尤其是最后的“邮件门”，更是致命一击。


    游戏玩到最后，前期很不被看好的川普，以微小优势获胜，不能不说，这是一个策略上的成功。


    用强大的优势压倒劣势——只要优势够强，劣势反而不重要了。


    # 故事二：


    在一次才干讨论会上，有人说，我有一对很矛盾的优势——我一方面有“做事要做到完美”的才干，但同时又有“总是能和谐地适应环境”的才干。这让我很纠结，自己想做到100分，但是适应大家的水准后，做到80分也很舒服，我觉得自己是个矛盾的人。


    我问她：“适应和完美有没有统一的机会？”


    # 最后要讲一个鸡汤故事，请端好碗。


    有个妹子从小白癜风，就是那种脸上、身上肆块白一块白的病，这病暂时找不到医治方法。作为一个妹子，基本算是半毁容了。你都能脑补她从小的外号——“奶牛”、“斑马”。


    在生命最低谷时，她甚至想过自杀，但是在这之后她决定就是要美好起来，和那些嘲笑她的人做斗争——她开始锻炼自己的形体、气质，立志成为模特。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_73_0.png)


    这就是 Chantelle Brown-Young 的故事。她后来参加了美国超模大赛，表现不俗。2015年参加了巴黎时尚周，2016年，被评为100位BBC年度女性之一。（你可以在英文维基百科上找到更多相关资讯）


    看Chantelle 演出的感受是奇特的——刚开始的几秒，你会有生理上的对于白癜风的不适，但是过一会你会被她的自信、自然所征服。这个时候，当你重新看她的身体造型——你发现白癜风在她完美的身体比例上，变成了一种类似符号的艺术。我想正是这种复杂、有层次的感受让人们喜欢她——人们喜欢不完美的超模，而不是一个天神般完美的女子——因为在她们身上，我们能看到自己。


    她就是那个 从劣势中升华出优势 的人。'
