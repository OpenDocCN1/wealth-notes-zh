    ## 问答｜高水平跳槽的三个趋势 18-4


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_88_0.png)


    Hi，入市有风险，跳槽需谨慎，欢迎来到本周的《超级个体》跳槽专题！


    那么简单：古典，我希望进入的领域，和过去从事的不一样，这种情况下机会还大吗？如果可以，如何提高自己的核心竞争力？


    古典


    可以，而且根据难度不同，分为三种方式：


    ## 1. 转行不转职，转职不转行


    职业=行业+企业+职位


    最安全的转换是行业、职位都不变，只换企业。你从中兴跳到华为，都做技术，这个基本平滑过渡。


    如果希望转换行业，则跨度有点儿大，建议转行不转职。原来是电商的BD，现在去做VR的BD，其实也不难。


    又或者是转职不转行，从电商的BD到产品经理，也有机会。


    以上是比较平滑的转换路径。如果用滑雪作比喻（最近比较迷，见谅），就是基础变道动作。


    如果你要同时换行业，还要换职位，那就属于高难度的滑行起跳了。


    ## 2. 尽量找内在关联点，寻求技能迁移可能


    第一个提示是找到两个工作的内在关联点。


    具体方法是这样——你可以尝试把2个工作的职位描述放在一起比较，职位描述招聘网站上会有很多，除掉必要的行业经验和知识（这些必须要你主动去学习）外，你会看到两个工作的很多技能方面的相同之处。


    找到其中的一到两个点，玩命地在过去的职业中寻找好例子——强调这些优势，同时也强调自己能学习。这个工作就是你的。


    ## 3. 进入全新的行业赌一把


    最后一种做法，就是完全进入全新的领域，这个领域本来就没有太多的原始积累，谁都是摸索，如果一定要从头学习，那就进入一个大家都需要从头学习的领域。


    ## 招募：知识挖掘师（KM）


    ## 招募条件：


    - 学历、年龄、经验都不限，但希望你对于某一个专业领域有深度阅读的能力。

    对以下领域有热情：个人成长、职业发展、心理学、社会学、企业管理等相关领域。交叉感兴趣的更好。（提示：具备英文读写能力的、发表过论文的、出过书的都会被优先接收哦！）


    ## 简历内容：


    简历+最近阅读的10本书的书名。


    另外，你需要从这10本书中分别摘录一段你认可的话。并选择其中一本书，写下你对这本书的见解（500字内）。


    如果你有近期写的文章也可以附上一篇。（别COPY，我也会搜。）


    ## 投递方式：


    简历发送到我助理于水水的邮箱 yumiao@xjy.cn


