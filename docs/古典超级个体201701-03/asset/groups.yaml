    # 5.诉诸权威


    由于我们多年来接受“填鸭式”教育，大脑热衷于权威，我们就很容易被人反制，而很多怠惰之所以能成功，正是因为选择了“诉诸权威”这条道路。


    举一个著名的“生命密码”理论的例子：


    关于“生命密码”百度百科的介绍是：

    “现今生命密码更是融合了博大精深的《易经》和希腓数学家毕达哥拉斯的《数字理论》以及西方科技统计学的科学工具，通过一个人的阳历出生年月日给出人生的密码图，这个图表可以解开一个人的天生潜质和性格特征。”


    核心逻辑是：“通过科技统计学（什么时候）来计算阳历出生年月日，来破解人的潜力，源头是毕达哥拉斯的《数字理论》。”


    这太逗了，我们一起来拆解下。


    维基百科显示：毕达哥拉斯没写过《数字理论》，也没有留下到今天的著作，他的思想主要是后世哲学家的描述。


    但以此判断“生命密码”是假的，也太以偏概全了。


    这个故事的笑点在于——毕达哥拉斯死于公元前495年，而计算生命密码的阳历出生年月则是按照耶稣诞生之年，也就是公元元年以后的时间来计量的。


    这就好比明朝科学家宋应星在《天工开物》里有个算法，能够通过你身份证后四位知道你性格一样荒谬。


    比假权威更荒谬的是跨界权威——比如“刘德华推荐了一本小说”，然后这本小说就会被大张旗鼓的追捧，抬得身价很高——但你冷静下来想想，刘德华真的对小说有专业鉴赏能力吗？这究竟是个人偏好，还是确有价值呢？


    其实专家对于跨领域的判断力，不仅不会更强，反而有可能更弱。因为他太专注本领域了，自然会相对削弱在其他领域的专业性。


    现在要考考你了，如果我说，我明年要推出专栏——《古典带你解密女人心》，你会买吗？


    千万别买，因为我是跨界假权威。


    今天主要要理解强盗逻辑的机理——怠惰的原理和技巧。


    明天我们谈谈如何提高独立思考的能力，打破自己心智的上限。


