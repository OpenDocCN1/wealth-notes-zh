    # 2. 为此我失去的是我能承受的吗？


    如果让你选择，下一顿吃什么？你也许会说：“火锅！”。连续吃一个月火锅，你可能就会求饶：“让我吃顿米饭吧”。我们会低估日常的需求，而高估新鲜的刺激性满足。我把这个称为“火锅效应”。


    职业回报也是一样——有必不可少的米饭，也有锦上添花的火锅。


    前者拥有的时候也许不会太兴奋，但是一旦失去未必承受得起——比如安全稳定、薪酬福利、生活平衡等。后者则是一些兴奋剂——偶尔拿到会觉得很爽，天天吃你未必真的需要——比如社会地位、智力刺激、多样和新鲜。具体因人而异。


    K先生在央企工作5年，户口、房子都有，觉得工作没意思，要追随我心。激动之下跳入民企准备大干一场，入职后才发现脱离了职位自己说话没人听、福利没人报销、连中午的工作餐都没有，自己其实并不真正适应快速变化的市场……回头看看，回不去了。


    # 3. 新工作中最恶心的部分我看到了吗？


    当没有进入新工作的时候，一切都想象得过于美好——等真正进入才发现，其实自己不一定能承受新工作最糟糕的一面。


    比如我身在公益机构服务几年，时常能看到这种状况——大家都觉得公益机构“有意义、有价值，能助人自己也能成长”的一面。等到真正进入，“工资低、缺乏上升空间、缺乏系统学习渠道、社会公益环境不好……”的一面就暴露出来了。


    > 玛丽莲·梦露说：“如果你不能接受我最糟糕的一面，你也就 programas 不配拥有我最好的一面。”


    所以，你真的知道新工作最糟糕的一面是什么吗？你HOLD得住吗？


    # 4. 现在的工作是否已真的没有价值？


    当我们工作遇到不适、过不去的坎，我们时常会想：“这里不适合我，肯定有更适合我的地方。”


    我管这个叫做“不知如何改进，于是换个环境”病——你不是不适合，而是<|reserved_special_token_1578|>応；岗位不是没价值，只是你不胜任。做个横向的对比，有利于你看清这一切。


