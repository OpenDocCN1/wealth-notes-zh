    # 古典


    如果你不按照你想要的方式来生活，迟早会按照你生活的去想。


    现实和心智地图就是这样一个相互影响的方式——你不是被自己改变，就是被生活改变，改变是不变的。


    所幸戚红选择了自我创造式的改变。TA应用了一整套系统让自己的行动得以落地——快速执行、不断尝试的应用、输出倒逼输入的思考、建立群组形成相互监督、持续观察他人行动同辈学习、在输入过多的时侯主动精简，甚至开始创造自己的工具。


