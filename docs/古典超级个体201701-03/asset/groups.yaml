    # 学完了价值观的你，听懂了吗？


    徐宏祖出生的时候，是万历十五年。


    在这个特定的年龄出生，真是缘分，但外面的世界，跟徐宏祖并没有多大关系，他的老家在江阴，山清水秀，不用搞政治，也不敢被人砍，比较清净。'
