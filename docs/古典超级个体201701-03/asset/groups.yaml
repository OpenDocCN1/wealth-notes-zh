    ## 2017年趋势一：3个职业发展关键词 11-1


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    11-1 2017年趋势一：3个...


    今天是2017年的第一周，这一周我们出一个新年特别版，谈谈2017年可能会出现的新趋势。我们会分3个方面来谈——职业的新趋势、管理组织的新趋势、人工智能对职业的影响。


    今天是第一篇——职业的新趋势。


    ## —— 3个职场变化趋势 ——


    谈到“工作”，字典常常给“职业”下面2种定义：


    +   一个稳定的带薪岗位。

    一项任务或者某种工作的一部分，尤指带薪的那种。


    前者强调是岗位，后者倾向于任务。未来对工作的定义，会越来越倾向于后面这种：


    工作是一件事，不是 一个组织或者一个岗位。


    下面有3个趋势来支持这个变化：


    ## 1.工作内容的不确定


    未来一年中，因为职业的变化、企业的转型，组织的工作内容越来越不确定，每个人都需要针对一个任务重新学习、适应和升级，而不是一个岗位的固定技能。而你做得好不好，是以最后的结果来判定。


    ## 2.零工经济抬头


    企业越来越倾向于为一个项目聘用相关技能的人才，而不是提供全职岗位。


    根据德勤年度报告来看，83%以上的高管反映：今后几年计划增加临时的兼职人员、工作时间灵活的员工，71%的高管和人力资源负责人认为零工经济重要或非常重要。


    所以未来几年，非全职员工、不坐班的员工、弹性上班的员工会越来越多。


    ## 3.分布式办公


    工作时间和个人时间互相交织，工作场所移动化，工作和私人界限日益模糊，工作也不再意味着某个场所。


    从格子间到联合办公空间，再到任何一个有网络的地方，咖啡厅、家里、酒店、80公里以外的地方，甚至不同的国度，都有可能成为新的办公空间。


    前段时间，一个著名的会计师事务所合伙人跟我说，现在他们公司已经取消了合伙人的独立房间，把他们赶到一个更开放的空间来。同时，公司还期待大家多往客户那边跑，尽量不要在公司呆着。


    不管你是管理者，还是员工，你都要逐渐适应或者有机会尝试这种移动分布式办公的方法。


    现在，我们再来看“工作”的第一种定义——一个稳定的带薪岗位，就 less...合适了。在今天——


    > 工作不再指代某个岗位、某个场所，而是指能不能在有限的时间内高质量地完成某 一件事。

    ----12笔笔记


    ## —— 3个职场关注重点 ——


    在这样的职场环境中，新一代职场人关注点也会有所改变。


    ## 1.个人时间


    根据拉勾2016年的报告来看，这群互联网从业者，对于“双休”与“弹性工作制”的看重程度超过了“五险一金”，分别排在了第二、第三名。


    “奖金与补助”毫无疑问成为从业者们最看重的福利，但对“双休”和“弹性工作制”重视程度的上升，说明——


    这一代职业人士会更加理性地看待自己的身体，他们并不像以前一样，拼命地挣钱，老的时候再用医保把自己治回来，而是在年轻时，就懂得保护自己的身体和状态。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_2_0.png)


    ## 2.看重自我发展


    这群人除了看重“个人时间”外，还非常看重“自我发展”。


    在美世全球人才趋势报告中，可以看到“更多的培训机会”和“提高工资”是各个国家人才都看重的2个因素，而在第三看重的因素上，则会有很大不同。（如下表）


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_2_1.png)


    中国的职场人，最看重三个因素：更多培训机会、提高工资、更多自主性。


    最不重视的是：更多职责，公平分配工作量、可提供支持的经理。


    而与中国相反的是新加坡和瑞典，他们最看重的是可提供支持的经理，最不看重自主性。


    这种差异，是因为中国正处于个体崛起的时代，人们觉得自己不需要组织——在职业中给他们提供自主空间，比提供支持更重要。


    现在，中国正处于一种年轻人唾沫顶上，疯狂学习，并觉得自己无所不能的时代，当然也有一部分是幻觉。


    同时，领英的报告也指出，职场人找新机会的理由主要是：“工作无聊无挑战”、“公司前景未卜”、“没有晋升机会”、“薪水不够”等。前三个都是自我发展受限导致的离职。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_2_2.png)


    ## 3.开放跨界


    领英《2016中国人才趋势报告》数据显示，高达 95% 的中国职场人士会对新的工作机会感兴趣，这一比例明显高于世界平均水平（90%）。


    更有趣的数据是——在这95%的人里，只有22%的人在主动找工作，也就是说有73%、近四分之三的人在观望，他们在寻找可能性。


    中国人的行业稳定性也相对较低——只有13%的职场人士从事本行业超过20年，而全球平均水平是17%，北美地区则高达28%。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_3_0.png)


    这种高流动性，一方面可以解释为：开放性、积极、跨界，另一方面也可以说是浮动、躁动。


    这些变化的原因，一方面是因为中国经济快速发展，企业转型、机会变多；另一方面也是因为新一代职场人经济压力不大，更多依靠自我感受、兴趣特长，或者趋势机会来选择就业方向。


