    “今天北京的空气质量指数为187，属于不健康，请减少户外活动，关闭门窗。”我把提示按掉，下意识深吸一口气，又马上呼出来。然后你打开门，做 出个跳崖前坚毅表情，一头扎入雾霾的北京。哦北京！北京！


