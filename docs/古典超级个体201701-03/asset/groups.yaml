    ## 独立思考决定心智上限 23-1


    23-1 独立思考决定心智上限


    我在美国参加一个名叫《设计思维》的国际会议时，听设计思维的大师Penny讲过一个印象深刻的小故事：


    美国宇航员在太空很郁闷，失重条件下钢笔和圆珠笔没法写字。NASA花费了10年时间200万美元的经费，希望研制出能在失重条件下使用的笔，但没有成功——因为要求太复杂：失重环境下书写自如，不会挥发、不磨损表面……


    于是NASA公开向社会征集方案，一个德国小学生寄来一个包裹，写了一行字“你们试过这个吗？”。打开包裹，发现是一支铅笔。其实，苏联宇航员在太空一直用的，就是铅笔。


    > Penny教授最后总结说——“好的设计，不是最新进，而是最实用。很多人认为设计师是拿出最酷的方案的人，其实他们是拿出最能解决问题的方案的人，这就是设计思维的本质。”


    每次我讲这个故事，都会有人露出恍然大悟的微笑。这微笑背后一般有两重会意：一方面觉得美国人傻，钱多但是脑子不好用。一方面觉得大师讲得很对，这是智慧。


    这真是个好故事。


    且慢。


    这个故事从头到尾都是错的。Penny教授嘛——其实就是“骗你”（Penny的谐音）教授。


    ## 第一个坑


    稍微做点调查，你发现这是个扯淡的故事。不信？接下来我陈述3个事实：


    - 1. 美国早期太空活动中宇航员使用的就已经是铅笔了。比如在水星计划和双子星计划中。美国人并不像故事里描述的那样，比苏联人傻。

    - 2. 太空钢笔也已经被发明出来了，直到今天还在用。1965年，美国一家叫做Fisher的公司开发了太空使用的AG7型太空笔（Fisher Space pen）。原理是笔芯里密封高压氮气，靠气压把油墨推向笔尖。这种油墨不挥发，能在各种环境下使用。笔尖经过特殊工艺配合超硬碳化钨笔珠，绝不会脱落，适应的温度范围是零下40到零上121度。神舟六号上用的就是这种笔，而且国外亚马逊就能买到，价格是35美金左右。


    ![](img/f3b148b1b2c51fd788bb1762dd156f4f_148_0.png)


    经过上述的论证，结论似乎再次浮现了：


    美国人并不傻，NASA也不是笨蛋。而且高投入的确研发出来了好产品。


    这才是真实情况。


    且慢。


    ## 第二个坑


    这里还有个你没有深想的问题：在太空钢笔发明之前，铅笔是一种好的太空书写工具吗？


    字迹模糊了怎么办？失重环境下如何削？如果铅笔芯断了，石墨到处飞会对电子元件造成致命威胁。这些情况是怎么处理的？现在这种铅笔还在服役吗？


    于是继续做调查发现——即使是美国人和苏联人使用的太空铅笔，绝非寻常物。

    首先，人家是自动铅笔，不用削。

    其次，人家用的也不是石墨笔芯，而是“软性有机粘合剂-有机染料”配方，这种笔芯类似蜡笔——不容易折断，也不会产生微粒。

    更好玩的是，这种笔今天还在大范围被宇航员使用，是太空站标配，并没有被取代。

    因为这两种笔各有优缺点，各有适应范围，不存在谁比谁差的问题。


    太空钢笔书写流利，使用时间长，字迹相对牢固，使用方便一些，但是成本高，结构复杂。太空铅笔则使用范围广，结构简单，成本低，是国际空间站上的标准装备。两者其实是根据不同思路开发，但共同解决了问题的好范例。并不存在谁比谁强。


    讲到这里，你以为事情终于真相大白了吧。

    且慢，

    其实背后还有一个坑。你猜是什么？


    ## 第三个坑


    其实Fisher公司也并没有耗资200万专门为NASA开发什么笔。美国都是私营公司，犯不着为了航天梦想把自己利润搭上。Fisher是看准了恶劣环境下的功能笔市场，先推出了笔，也正好能符合NASA的需求，借助NASA打了下品牌，是个很好的营销手段。而NASA通过鼓励他们扩大市场，让这种笔的庞大研发成本被分摊，单价低了，他们采购得也很积极。


    这才是商业的逻辑啊。


    在你的心智一次次的入坑又出坑以后，我希望你最后能发现一个事实：


    ## 人脑是很容易被忽悠的。


    只要稍加技巧，我们的大脑很容易就会被植入一个错误谬点。广告、营销、宣讲、谈判……有意无意都充满了这种错误的推导——你每天不接触50个误导信息，你都叫不现代人。有些错了无伤大雅，但有些重大决策，一旦错误，背后消耗的时间和人生成本就大了。


    这就是独立思考的重要性——对外防忽悠，对内心智纠偏。


    ## 心智的层级


    想要知道什么是正确的思想，我们先要确认下我们是如何判断一个理论或者思想是正确的。人的心智水平有三个层级——体验、解释、分析。


    ## 第一层级是体验。


    我们相信“听上去、感觉是对的”的事情。开头那个故事之所以显得可信，是因为我一讲“美国、设计思维、大师、教授”这些你看似权威的陌生词，大脑就自动开始放松警惕。而最后嘲讽美国的桥段又完美迎合了你幸灾乐祸的心理，于是你毫不犹豫的接受了。


    说白了，我们追求的不是正确答案，而是一个“爽”的答案。


    ## 第二层级是解释。


    我们相信“解释起来是对的”的事情；第二个故事更加可信，是因为我列举了证据——“双子星计划”“Fisher”““购物链接”，还翔实地说明了太空笔的物理属性，于是你推理这是对的。


    在这个层级，我们追求的是“合理”的解释。


    ## 第三层级是分析。


    我们不再相信现成的答案，而是寻找“接近真相的解释”。先提问，再搜索信息，然后你会找到好多相互矛盾的解释，这就需要你评估这些解释，找到真相——“提问，搜索、评价、结论”。


    在第三层级，也是最高层级，我们追求的是“更接近真相”的解释。


    第三层级之前，我们只能说是在学习，到了第三个层级，才算是独立思考——不被忽悠，接近真相。


    你在哪一层呢？


    中国大部分人都停留在第一层——这与受教育程度不相关——只要对方是大师、高管、企业家等看似权威的名头，人们的脑子就不具有分辨能力了，容易全盘接受对方传达的信息和结论。


    这几年民智有所上升，而我们“得到”的用户应该至少是在第二层的。讲完“要努力打磨自己”的鸡汤之后，最好再来个“刻意练习”理论，才有逼格，才是真的哲人王。


    但如何区分这些解释？比如说我在之前文章中提到《异类》中的“一万小时定律”和很多“大师”的一万小时训练营，也解释得很好很合理。但真的足够好吗？


    还需要有哪怕2%的人持续地“提问-搜索-辨别-结论”，向上游追寻，面对真相，获得一手知识。


    ## 心智的上限


    大部分人心智的上限，就在第二层与第三层之间。他们很难怀疑自己深信的结论，原因是有，人缺分辨的意识，有人缺分辨的能力。


    缺乏独立思考能力的人给什么吃什么。他们会在学习中逐渐迷失在各种解释中，无所适从。他们的信息源，就是他们心智的上限。


    而独立思考的人，因为有了怀疑和辨别的能力，所以能突破自己的信息源，向上追溯，直到站在真理的面前。


    这个过程其实挺痛苦的——怀疑自己曾深信不疑的东西，会让你重新陷入迷茫，不过这周为了教你学会独立思考，我也没有义务让你太舒服。


    > 王小波说：“一般人认为，善良而低智的人是无辜的。假如这种低智是先天造成的，我同意。但是人可以发展自己的智力，所以后天的低智算不了无辜——再说，没有比装傻更便当的了……我的结论是：假使善恶是可以判断的，那么明辨是非的前提就是发展智力，增广知识。”


