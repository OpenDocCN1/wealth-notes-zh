  - "[PAGE 111]\n\n# 价值链分析法，不盯职位盯行业 20-2\n\n20-2 价值链分析法，不盯…\n\n也许有人会想——在组织里的发展路径我懂了——但是这个时代，靠山山倒，靠水流。我也许在组织、团队里做得很不错，但公司倒闭，或者团队解散，我该怎么办？\n\
    \n今天我们谈谈这个话题——如何跳出企业的局限性，站在行业的高度，从创造价值的角度重新给自己定位。\n\n# —— 一个概念：价值链… ——\n\n价值链分析：哈佛商学院教授迈克尔·波特在《竞争优势》这本书里提出了这个概念。他认为公司经营的每一个环节，都是为了创造价值——这些环节叠加在最后的产品上，形成了整体的客户价值。组织可以从整体价值分拆出每个环节的价值，找到突破点，形成独特的竞争力和。\n\
    \n![](img/f3b148b1b2c51fd788bb1762dd156f4f_111_0.png)\n\n比如当年京东崛起，面对的第一大对手就是淘宝——该如何超越，好像处处是机会，又处处都难。京东从价值链反推——“我们这个行业的核心价值是什么？”\n\
    \n京东的生意就是个网店，网店的客户价值很好定义：最便宜、最放心、最快到达。\n\n“做好这个价值链条，需要什么核心能力？”\n\n京东发现：在价格的优惠力度上很难超越淘宝，在放心程度上可以做得比淘宝好，但页多和天猫差不多，唯一的突破口就在“更快到达”上，所以，京东的核心能力就是物流。\n\
    \n+   1. 好迁移——你的价值不受不同公司、职位的影响，可在行业内自由迁移。春江水暖鸭先知，行业变化你先知。 \n2. 能力提升得快——你不会被今天或明天的一个任务搞蒙，不是学学这个，搞搞那个，而是专注几门——清晰自己的目标和专业度是刻意练习的第一前提。\
    \ \n3. 能力可带走——能力是自己能带走的，职位、关系、资源都未必能带走。\n\n# —— 一个策略 ——\n\n# 怎样找到价值链背后的能力？\n\n\
    怎么更好地理解自己的价值链？你自己也许很难回答这个问题，除非你有很好的行业导师或顾问。我分享一个我时常问团队的问题——\n\n> 如果一年以后你离开团队，工资翻了一番，那么是因为你这一年有什么长进（隐性能力），创造了什么结果（可识别的显性指标）？\n\
    \n所以——盯着职位，越盯越怯。盯着本质，越盯越强。"
