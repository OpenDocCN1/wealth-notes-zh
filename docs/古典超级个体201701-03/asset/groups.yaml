    好啦，你学会了质疑、学会了提问——然后呢？


    当你学会了面对某个观点时，先停下来思考下是否值得接受，而不是盲目崇拜权威，或者头脑一热接受大众的潮流……然后呢？


    如果说不盲目接受观点，就像是不再乱吃垃圾食品一样，你很快就会面临第二个问题——你总得信点儿什么，总得有值得学的东西，那我们该信什么，学什么呢？


    其实，质疑只是独立思考的第一步。独立思考包括4个步骤——提出问题-搜索信息-分析推理-表达观点。完成好这个流程，需要你具体以下几种能力：开放的怀疑态度、分析能力、沟通表达能力、研究和调查能力、包容模糊性、创造性的解决问题。这些能力也是分阶段的，越往后面越难。


    ## 1. 以正确的方式，提正确的问题


    经过本周学习，我们超体提问勇气的确有所上升，但质量并没有提高。这就牵涉到一个更底层的修炼——你对自己提出的问题，提出过问题吗？（也就是说，你对自己提的问题，做过自问吗？）比如：


    +   这是一件值得争辩的事吗？（鸡毛蒜皮的破事，就不要讨论了。）

    这个问题有相对正确的答案吗？（我觉得电影好看，不好看，好看，不好看……）

    这是一个适合讨论的地点、时机吗？（老子上班前着急要死，非要和我谈韩局局势。）

    这个问题，我有主动尝试寻找答案吗？是否真的有必要找别人来求助或讨论？（每天的提问中，至少有20%是可以通过网上搜索找到答案的，你不珍惜别人时间，别人才嘛花时间来回答你？）


    比如一位超体的留言：


    > “一日电话闲聊，说到小孩蛀牙，我说我小时候蛀掉的那颗磨牙，是奶牙，后来换牙就掉了，谁想她不相信，严厉教训我，说小孩只换门牙和周围几颗牙，后面磨牙不会换，我发网上换牙的示意图给她，她依旧认为我胡说八道，我除了感叹天地良心，一点办法也没有。最后收场我是这么说的，妈妈我错了，你说的对。”


    我的回答是：“不是一日闲聊吗？闲聊的目的就是开心，越扯越远越好。你可以说，妈妈你真厉害，我蛀牙都是自己长好的，主要是你基因好。”


    当你具有了对“提问的内在提问”机制，我们就会减少很多无谓的争辩，把注意力留在重要的议题上。


    ## 2. 搜索信息


    当你提出质疑后，如果对方坚持自己的结论是正确的，你又该怎么办呢？你是不是需要自己去主动搜索，获得一些信息呢？


    这时就要用到前面提到的“功利学习法”（见专栏21-1）“一二三四手知识”（见专栏21-2）。因为当别人专注一个主题，并集中性的查找资料时，如果你想全面系统地学，根本跟不上讨论进度。你需要针对目标，找到关键词，去接触一手资料。


    这需要你具备对信息的敏感度。


    举个例子：我在本周二的文中末尾放了维基百科关于“认知偏差列表”的网址链接，如果你好奇，可以打开看看，里面列出了近100种认知偏差——有人挑选了其中9种，就写出了一本书——《影响力》。所以，这就是一个源头。


    当然，翻墙也是一种信息搜索能力。


    另外就是对自己的认知偏差有深刻的理解：知道自己在哪踩过坑，理解自己的局限。


    据说特别会吃的人，吃一顿饭就能知道里面用了什么食材、放了什么香料等等。好的独立思考者，看一篇文章就能看出作者的知识源头和表达技巧是什么。


    ## 3. 分析推理能力


