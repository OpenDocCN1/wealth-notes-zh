    有些事你必须做了才知道什么是好，什么是更好，而只是凭空单纯的想，单纯的看是没有办法去替代实践的。如果单从方法论的角度看，不断的去寻找更好的方法本身就不是一种好方法，真正的好方法可能是：实践，并在实践过程中结合经验和知识不断指导，调整自己的实践过程。可能一直在找好方法的人们并不清楚好方法的真正含义。
