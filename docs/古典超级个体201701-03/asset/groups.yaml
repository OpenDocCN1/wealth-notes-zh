    接下来有两条路：一条是通过践行把知识升级为能力，慢慢地提高能力；一条就是继续刷更多的知识，获得更多瞬间快感。时间一长，能力越学就越强，而且习得的速度更快；但是知识其实是越刷越多，永远无法穷尽的。


