    ## 三种路径，设计属于你的多元人生 12-2


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    12-2 三种路径，设计属于...


    我们上一篇文章讲到“为什么要斜杠”，其实我更喜欢用另一个词，叫做“多元人生”——它是一种不错的人生策略，可以帮我们补充生活，探索新的可能，也是一种不确定下的保险方式。


    ### —— 一个概念 ——


    ### 什么是完美职业？


    什么样的职业才算是一个比较圆满的职业呢？其实说起来也很简单，就是3个部分：


    - 第一，让你收获到价值的，这价值可能是钱，可能是安全感（上周谈过一个人的职业收益包括工资福利+职业发展+情感意义三个部分）。

    第二，它应该是你擅长做，有资源、甚至有天赋的。

    第三，它应该是你感兴趣，甚至是热爱的。


    ### —— 一个策略 ——


    ### 3种设计出发点


    ### 1.发挥优势


    ### 2.安放兴趣


    ### 3.获取价值


    第三种斜杠方向，是冲着价值去的，最直观的就是经济收益。比如说大部分人通过理财、炒股票、楼市赚钱，他们是不是也是一种斜杠？很多CEO、创始人也是不错的投资人，这也是一种斜杠方式。


    不过钱仅仅是价值之一，参与感、人脉资源也很重要。


    你关注下活跃在各大社群里的运营人，很多都是斜杠，他们有些追寻参与感，有...意义感。


    所以问问自己——有哪些价值你很需要，但是在你的本职工作无法完成的？


    ### ——一个总结——


    完美的职业有三部分——热爱、优势以及价值；我爱干，我能干，有需求，而且回报还不错；如果一份工作没法同时满足三种，给自己设计一个多元组合式的生...也是个好策略。


    ### ——今日精进——


    - 1. 自我评估：如果给你的主业打三个满意度的分：我热爱我的职业、我在这个方面能发挥优势、我对收入满意。0分为最低，10分为“完美”，你会给自己打几分？

    2. 如果让你重新设计自己的多元人生，你会用什么方式来满足和安放自己的一些兴趣、优势和价值？


