    ## 众筹 | 你做的每件事，都是你的名片 18-6


    Hi，入市有风险，跳槽需谨慎，欢迎来到本周的《超级个体》跳槽专题！


    周三，我在专栏发起了一个“故事众筹”活动，请大家分享自己知道的“跳槽故事”。这两天收到很多留言，有人回忆莽撞岁月，有人讲述华丽转身……其实，所有经历都是化了祝福的：当一个人开始总结并付诸行动时，就已经走在人生精进的路上了。


    今天和你分享其中4个故事和它们背后的道理。


    ## 一、跳槽后，你吐槽前东家了吗？


    不少人在跳槽之后，都会开启吐槽模式。这是特别值得警惕的一种倾向。就像下边这位——


    六梭雪：曾经有一个同事，他在考上研究生之后离职，此后每天都更新一篇文章，用连续一周的时间各种吐槽学校：从人到事，从校领导到系领导，再到同事，所有和他共事过的人或者他稍微接触过的人都榜上有名……有的同事说，这人研究生的日子也不会好过，毕竟大家都还在一个圈子里。


    这除了给自己宣泄情绪之外，只会向别人说明：你不但当时决策错误，而且现在还不愿意为自己的错误负责——不能担责，是不成熟的表现。另外，还无形中得罪一大票人。


    值得一提的是，故事中这位连吐槽都能“日更”？！这么勤奋干点别的什么不好吗？


    都说“分手见人品”，还真是一——


    纳修：我同事离职前就抢了属于组内其他同事的课题，接到高薪水的offer后，马上撂挑子辞职，连交接的资料都没好好整理，搞得接手的同事要重新开展工作。后来她还找人抱怨说大家针对她，害她辞职——现在没人愿意和她再联系。


    如果让前同事们描述故事中的这位换工作的朋友，他们大概会用到“自私”、“不靠谱”这些吧。如果有机会，你会和她合作吗？


    这也是为什么有的人路会越走越宽，而有些人则恰恰相反。其实，有一种跳槽，叫“好聚好散”。比如，下边ora的故事：坦诚沟通、理由充分、心怀感恩……都是她做得特别好的地方，值得我们学习、借鉴。


    ora：跳槽前，趁公司领导来的时候，准备先要告诉他这件事，再写邮件给HR。我们两人坐到办公室里，他突然变得不像平时那么严肃，笑着问我：你不是被竞争对手拐走了吧？我当时恰好也是收到竞争对手的offer，心想，呀，这下坏了。很巧的是，竞争对手给了我homebase（在家工作）的位子，我当时正好也考上了MBA，于是坦诚告诉他：这份工作对我目前要上学的情况更适合。本来心有忐忑的我却得到他的赏识说当初没看错你，果然没让他失望……后来出于尊重和感激，我一直和这位领导保持联系。在我跳槽到目前的这家公司时，他还亲笔为我写了推荐信。在这件事中，我的心态变化挺大的，之前面对离职，心里总是很害怕。其实，面对面的沟通比写邮件强很多倍。另外，我和之前的同事们也保持着良好的合作关系。前公司也变成了我的客户呢。


    ## 二、其实，你还可以为自己“背书”


    我曾说“80%的好工作都不在招聘网站上”，并提到被“信任的人背书”在换工作时起到的作用。其实，在这个“人人都是自媒体”的时代，不用等别人，你自己就可以为自己“背书”——你在网络上留下的每一条痕迹，拼凑在一起就是你的形象。


    比如，下边这位，她发了条微博，就换了份工作。


    Vikki(Φ e p υ з a)：六年前我MBA毕业，当时在一家公司工作。那个时候还没有微信，大家都在玩微博。五月，我还在忙工作，于是就发微博说，劳动节就是在努力的劳动，为了接待几个英国人，前期要学会那些专业术语……结果，就被一个人私信，问我做什么工作，问我是否知道XX公司，并告诉我说是这家龙头企业的National的部门经理，现在需要招聘一位BD，如果我有兴趣可以给他发简历看一下……后来，我顺利地进入这家公司并一直工作至今。在微博上跟我搭讪的人，就是我现在的领导。


    我领导说，当时他关注微博的几个关键词：南开大学、天津大学、MBA，放假时间忙工作，还很乐观，所以他就想跟我聊聊。我觉得这就像是一种机缘，用“功不唐捐”来形容再合适不过了。


    Vikki找到新工作，当然不只是因为发发微博那么简单，从文中我们也可以看出，她本身就很优秀而且懂得努力。新媒体的意义在于，它可以帮助你在更多人面前展示你的优秀。


    读过这些故事，你有没有这种感觉？我们所做的每一件事，都是自己的名片。你曾经的公司、同事，包括你自己都可以为你的未来“背书”。所以，每一个环节值得你认真对待。


    ## —— ◆ 精彩互动 ◆ ——


    “三个媳妇”理论


    derek.wang：找工作和找媳妇差不多，好的媳妇能让自己燃烧一生，中等的媳妇让自己平实一生，差的媳妇让自己毁了一生。好在工作可以随时调换，但也是需要付出代价的，诸君需谨慎！


    点评：好羡慕你有三个媳妇儿。


    ## 学关羽之前，先让自己“稀缺”


    刘哲敏：在学习本周三内容（《想优雅地离职？学关羽 18-3》）之前，首先要搞清楚你有没有像关公那么“稀缺”。比如，一个普通保安想要辞职，需要什么时机、理由、对象吗？没必要。所以，先收收心，赶紧让自己成为“超级个体”，变成“稀缺型人才”，然后再潇洒地学关公辞职。


    古典


    > 点评：个人求职的4P 是产品（实力）、价格（工资）、渠道（求职路径）、推广（个人营销），其中还是实力最重要。


    ## 非常好的入行攻略


    施辉波:无论你有多少能力和经验，到一个新公司，尤其是一个新的行业，都得从跟随者开始。一个业务成熟的公司，要在市场招人，有两种可能，一是业务发展需要增加基层员工，二是一定有一块难啃的骨头在等着你。所以公司通过你的简历找到你，要么不可能是要职，要么不可能容易拿高薪。


    - 1. 你到了新公司，一般依然要接受一定的时间考验才会被委以重任。那么，有没有更好的策略？

    2. 去创业公司。通常创业公司很缺乏有经验的人，可能待遇不会高——创业公司穷啊，但职位任你挑，一旦做起来，你就成功了。

    3. 自带资源。与新公司协作，比如人脉圈、客户资源，这样你才有谈判的条件。

    4. 熟人介绍。有熟人在中间搭线，就会增加新公司对你的信任。

    5. 如果以上三个条件都不具备，没熟人没资源没有适合的创业公司，那么把新公司当作一个协作对象，而不是雇佣关系。你还可以通过这个平台开发几个协作对象，但最好几个协作对象可以不冲突（可以同一时间做一件事，获得几种结果）。


    不管什么策略，在求职的过程中自我营销能力（能力的萃取）是核心。


    古典


    > 点评：一般公司都会做“内部空降”，外来人员会被空降到相对低的职位，让他自己靠实力爬到期望中的职位。所以要准备好打一场硬仗。


    ## —— 我要践行 ——


    不管是不是要跳槽，想想看现在你做的哪些事情正在为自己增值，可以让你的简历看起来更好看？


    还有哪些职场上的事情，其实你还可以做得更好？


    ## 还有一些想说的话：


