- - '####'
  - 交易守則
- - '###'
  - 守則 11：不可僅因為價格偏低而買進。不可僅因為價格偏高而賣出。
- - '###'
  - 守則 12：僅在流動性高的市場中交易。
- - '###'
  - 守則13：價格變動迅速時，不可建立部位。
- - '###'
  - 守則 14：不可根據特殊情報（tips）交易。換言之，「順勢交易，而不是順著朋友的意見」。另外，不論你對於某支股票或某個市場有多麼強烈的感覺，也不可以提供免費的消息或意見。
- - '###'
  - 守則15：永遠得分析自己的錯誤。
- - '###'
  - 守則16：務必提防「錯誤的併購消息」（takeunders）。
- - '###'
  - 守則17：如果一筆交易的成功與否，必須取決於交易指令的正確執行，則不該從事該筆交易。
- - '###'
  - 守則18：必須保有自己的交易記錄。
- - '###'
  - 守則 19：瞭解、並遵守法則！
