  md: '# 圖7.12


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_148_0.png)


    TQ 20/20 © 1991 CQG Inc.


    1989年12月份可可豆期貨——中期的2B。這份可可期貨日線圖顯示中期的2B。先前的中期高點爲A，價格在B點突破，但三天後又跌破A點的先前高價。'
