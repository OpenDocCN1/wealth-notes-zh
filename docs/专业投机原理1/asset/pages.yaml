  md: '許多現代的經濟學家在物價下跌與經濟衰退之間畫上等號，這是因爲自1920年代末期以來，物價普遍下跌僅發生在經濟萧條或衰退的期間。謹慎分析這些期間的情況，可以發現政府干預的程度最爲嚴重。以1930年代爲例，「聯邦準備理事會」減少三分之一的貨幣供給，國會卻同時通過法案維持1920年代的物價水準。爲了維持較高的價格，政府付款給農夫們燒毀馬鈴薯，並鏟犁棉花作物。（1930年代，許多農夫是以驢子犁田，而驢子是以頑固著稱。在鏟犁棉花時，驢子必須踏在作物之上前進，但據說驢子不肯這麼做。當時某份報紙發表評論道，驢子對於經濟學的瞭解遠勝過政府。）商家如果遵照政府擬定的偏高價格，可以把獲贈的「藍鷹」（Blue
    Eagle）徽章掛在窗口。羅斯福總統在「爐邊閒談」（fireside chats）中，鼓勵消費者在掛有「藍鷹」徽章的商店購物，並抵制價格偏低的商店。勞工法案授權工會調升工資，並鼓勵它們防止資方降低工資。於是，在經濟普遍衰退而失業嚴重的情況下，實質工資卻得以上升。基於某些緣故，政府官員似乎始終不瞭解，物價的下跌是來自於貨幣供給的減少。結果，當然導致美國歷史上最漫長的經濟大萧條。


    我們政府的支出與貨幣政策，總是擺盪在兩個相互矛盾的行爲之間，先是以寬鬆的信用政策驅動通貨膨脹的繁榮，接著又以緊縮貨幣與信用的手段控制通貨膨脹，於是又造成經濟衰退。由於政府的赤字支出政策與「聯邦準備體系」控制的貨幣供給，使得現代的美國人無法想像物價下降的經濟繁榮。如果你可以不擔憂通貨膨脹，把錢存在銀行而其購買力又會隨著時間經過而增加，難道不是很美妙嗎？你可曾想過，隨著科技的'
