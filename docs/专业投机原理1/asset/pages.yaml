- pgno: 259
  md: '現在，銀行體系擁有5,000萬美元的超額準備（excess reserves）；換言之，銀行體系根據既有支票存款，提列10％的準備金存入中央銀行的準備金帳戶之後，帳戶餘額尚多出5,000萬美元。代表它們的超額準備足以支持另外5億美元的放款（5,000萬美元除以10％，等於5億美元）。由於銀行的主管都非常慷慨而愛國，他們希望看見充分就業與經濟成長，所以立即同意各類放款。


    銀行放款時，創造的資產與負債在帳目上會自動平衡。就這個例子來說，銀行會在貸方的借款者支票帳戶中登錄5億美元，並在借方的貸款科目中登錄5億美元，所以資產負債表將為：


    # ABC整體存款機構：資產負債表相關部份


    | 主要資產（單位：1,000美元） | |

    | 貸款 | 1,500,000 |

    | 現金 | 5,000 |

    | 中央銀行的準備金存款 | 145,000 |

    | 政府與其他證券 | 100,000 |

    | 主要負債 | |

    | 支票存款 | 1,500,000 |


    所以，透過公開市場操作買進價值5,000萬美元的政府公債，中央銀行可以增加5億美元的貨幣供給——新創造的5億美元。如果中央銀行在公開市場賣出債券，整個程序恰好相反。'
