- pgno: 407
  md: '法則應該讓你感覺熱情、摯愛、快樂、成功…沒有必要設定困難或不可能的法則。


    沒有錯，生命永遠必須面臨挑戰，但在不斷追求目標的過程中，挑戰已經非常足夠，我們不需再「做些不可能實現的美夢」或「攻擊不可能被打敗的敵人」。人生苦短，我們不應該再為自己設定障礙而使生命顯得乏味。


    花費相當工夫做這些練習以後，你將瞭解對於自己造成限制的價值與信念，你對希望採用的價值與信念也應該有明確的概念。現在，問題是實際上如何進行。我們又面臨相同的問題，知識本身並不足夠；我們需要一種執行的方法。這便是投射（projection）發揮功能的時候。


    # 如何管理潛意識


    我們的生命中都曾經發生重大事件，回憶時，當時的快樂或痛苦又歷歷重新浮現。例如，你或許在事業中曾經贏得重大勝利，每當回想當時情況，你便面露微笑而覺得非常驕傲。或者，你曾經遭遇一段感情的波折，而每當憶起歷經的衝突與失去的一切，你便心痛如絞。


    當你將某些事件投射於未來時，也可以因此感受快樂或痛苦。你可以設想自己沐浴在巴哈馬的明媚陽光中，手中拿著飲料，陣陣涼風襲來，耳邊又隱約可以聽見浪花拍打岸邊的聲音。你想像這些景象，便覺得全身輕鬆而面帶微笑。或者，你開車的時候，想像某人突然衝到車前被你撞死，這將是一幕可怕的景象。'
  merge: -1
  img_proc: true
- pgno: 408
  md: '快樂與痛苦的感受不僅侷限於目前；我們可以將它們由過去呼喚出來，並投射至未來。


    因為潛意識是受到兩種主要情緒力量驅使——避開痛苦的需求與追求快樂的慾望——所以我們希望消除某種侷限性的聯想時，應該勸服潛意識瞭解，這個聯想可以造成痛苦，非常的痛苦。


    反之，希望建立積極的新價值觀或信念時，你必須勸服潛意識瞭解，它們將導致非常的快樂。


    在意識的層次上，我們需要將負面與侷限性的價值觀與信念，連結至過去、現在與未來的痛苦；並將積極而有益的價值觀與信念，連結至目前與未來的快樂。


    Anthony Robbins 設計一種方法，他稱爲「狄更斯模式」（Dickens Pattern），這個名稱取自狄更斯的小說「聖誕頌」（A Christmas
    Carol），其中一位神秘的精靈以類似的方法引用在Scrooge 身上。這位精靈帶著Scrooge 前往過去、現在與未來，並展示他一生中種種的快樂與痛苦。有一點特別值得留意之處，促成Scrooge
    改變最有效的誘因，是目前行爲將導致的未來痛苦。


    「狄更斯模式」的基本內容如下：


    +   1. 選取一種你希望改變的信念。閉上雙眼，回想這個信念在過去造成的種種痛苦。感受它形成的重擔。回憶這項信念導致的各種後果。想想你因此損失的一切，'
