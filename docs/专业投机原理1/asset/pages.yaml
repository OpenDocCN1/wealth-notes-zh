- pgno: 303
  md: '# 第十二章

    讓你發生虧損的方法

    至少有五十種


    # 4,017美元的吹風機


    1979 年的某一天，我在盤中交易時，接到朋友蘇珊的電話。我當時做多 40 口小麥契約，行情已經出現，所以我必須密切觀察市場的發展。我設定一個準備認賠的心理停損價位。總之，蘇珊打電話給我，她的情緒非常激動———把眼淚，一把鼻涕———我不清楚她在說什麼。


    我當然非常關心。我想她可能跟丈夫發生劇烈的爭吵而必須立即解決。結果，我總算瞭解事情的真相。


    她哭哭啼啼地說，「我的…吹風…機…壞了！」


    我幾乎不相信我的耳朵。「你的吹風機！這就是你這麼傷心的理由！」我看著多年的好兼同事 Norman Tandy …他僅是憨著嘴笑。


    「蘇珊，」我說道，「蘇珊，不要傷心。你的吹風機值多少錢？」'
  merge: -1
  img_proc: true
- pgno: 304
  md: '「…17塊。」


    這個時候，我幾乎忍不住要笑出來，「我買一個新的給你，如果這樣會讓你覺得好過一點的話。」


    當然，我瞭解，如果一個人會為了吹風機而難過到這種程度，那一定有別的問題。所以，我慢慢與蘇珊談著，希望知道究竟是怎麼回事。這個過程中，我忽略盤面的變化。


    我看著報價螢幕，突然發覺價格已經穿越至心理停損下方2美分。這是100美元乘以40——4,000美元！我立即拿起電話把部位平倉，結果我多損失了4,000美元。於是，我買了一把4,017美元的吹風機，甚至還不能挑選顏色。


    當時，我再也忍不住笑出來了，甚至現在每想到這件事，我都還想笑。我提這段故事的重點是：永遠有你想不到的事情會讓你發生虧損。有 działalność一段歌詞說道，「有五十種方法可以離開你心愛的人」，你至少也有50種方法發生虧損。


    然而，交易者發生虧損最常見的理由，則是未遵循交易守則，認為「這一次」例外。每個人都免不了發生這類錯誤，但這是可以控制的。如果你瞭解交易守則，而且——更重要地——瞭解它們存在的理由，這是一種幾乎可以全然避免的錯誤。


    # 交易守則與其背後的理由


    許多人誤以為市場行為是完全可以預測的。絕對不是如此。在市場中交易，這是一場有關勝算的遊戲，目標是要永遠'
  merge: -1
  img_proc: true
- pgno: 305
  md: '掌握勝算。猶如任何有關勝算的遊戲一樣，為了贏取勝利，你必須瞭解、並遵守規則。然而，交易守則有一項最大不同，它最主要功能是克制你的情緒。假定你已經俱備建立部位的必要知識，其中最困難的部份是以正確的方法執行交易。這便是交易守則的功能。


    市場行為會受到太多變數的影響，只要些微心理的衝動，你便可能扭曲它們，只需要些許的藉口，你便可能承擔不必要的風險，或過早獲利了結。


    最近，在一筆S&P 500 的期貨交易中，我在開盤後10分鐘進場賣空，並在盤中高點的上方5檔設定停損。隨後30分鐘，價格下滑至我進場點的下方10檔左右，然後盤勢似乎有反彈的徵兆。雖然我沒有看到任何明確的回補訊號，但我在情緒上不希望這些微薄的利潤轉為損失，於是我讓助理幫我回補，賺取10檔的利潤（每口契約250美元）。


    大約15分鐘之後，行情重挫兩大點（1大點為20檔，相當於每口契約500美元）。如果我遵照守則交易，我的獲利可以增加四倍。我當時的想法是，「行情看起來好像要反彈，我最好趁早獲利了結。」然而，這實際上僅是藉口而已，它掩飾我擔心在這筆交易中犯錯的恐懼感。事實上，價格確實稍微反彈，但從來沒有接近我的停損——原來準備讓市場證明我錯誤的價位。


    交易守則的宗旨，是在人性的許可範圍內，儘量以客觀而一致的態度交易。如果沒有交易守則，你的願望可能主導交易決策，在市場交易中，你的願望十之八、九無法實現。本章的'
  merge: -1
  img_proc: true
- pgno: 306
  md: '目的是介紹一些重要的交易守則，並說明它們背後的理由。另外，我還會列舉一些人們很少談論的虧損原因。


    # 交易守則


    守則1：根據計劃進行交易，並嚴格遵守計劃。


    在任何交易之前，你務必要知道自己的目標，以及打算如何達成目標。這不僅代表你必須瞭解風險／報酬的關係，而且還必須界定市場可能發生的所有狀況，並擬定相關的對策。換言之，在任何交易之前，你必須知道每一種可能發生的結果。在交易的過程中，思緒混淆是你最大的敵人；它會造成你的忿怒與情緒激動。根據定義，思緒混淆來自於無知，不瞭解當時的情况究竟是怎麼回事，不知道如何反應。


    擬定交易計劃時，首先必須決定你的時間架構。換言之，必須決定你的部位是屬於當日沖銷的交易（部位的建立與結束都在同一天之內）、短期交易（持有數天至數個星期）、中期投機（持有數個星期至數個月）、長期投資（持有數個月至數年）。


    上述決定可以讓你瞭解應該專注於什麼趨勢，以及如何根據相關趨勢設定停損（參考守則3）。一旦決定之後，你可以考慮所有可能的價格發展情節，並擬定每一情節的反應對策。特定而言，你應該如何設定停損、在何處設定獲利了結的目標價位、在何處追加部位、……。


    當然，有時候還是會發生你全然無法控制的混淆——50種'
  merge: -1
