  md: '# 第二章

    鱷魚原則：

    重點思考的必要性


    > 一個人捨棄原則時…會產生兩項主要的结果：

    就個人而言，無法規劃未來；就社交而言，無法溝通。①

    ——Ayn Rand


    # 活生生的吞噬


    我有一個交易法則稱爲「鱷魚原則」（Alligator Principle）。這源自於鱷魚的吞噬方式；獵物愈試圖掙扎，鱷魚的收獲便愈多。假定一隻鱷魚咬住你的腳；牠咬著你的腳並等待你掙扎。如果你用手臂試圖掙脫你的腳，則牠的嘴巴一張一合，便同時咬住你的腳與手臂。你愈掙扎，便愈陷愈深。


    所以，萬一鱷魚咬住你的腳，務必記住：你唯一的機會便是犧牲一隻腳。若以市場的言語表達，這項原則是：當你知道自己犯錯時，立即了結出場！不可再找藉口、期待、禱告、或採取其他任何動作，趕緊離場…不可試圖調整部位、避險、或其他無謂的措施；趕緊認賠出場！'
  merge: -1
  img_proc: true
- pgno: 46
  md: '猶如我學習的許多事物一樣，這項原則也是來自於慘痛的經驗。1970 年代中期，我在INA Insurance 上建立一個很小的選擇權部位。我買進20 口12
    月份到期而履約價格為25 美元的買進選擇權，價格為1¼（每口契約125美元）。我買進之後不久，股價開始下跌，選擇權的價格先是下跌1/8（每口契約12.5美元），接著出現1/4（每口契約25美元）的跌幅。根據我當時交易選擇權的法則，當我損失1/4
    美分時便認賠出場。然而，我當時不僅沒有接受500美元的損失，反而以3/8的價格銷售60 口12月份到期而履約價格為30 美元的買進選擇權。這個時候，股價因為併購的謠言而開始上漲。我以3/8
    美元銷售的12 月份30美元買進選擇權，其價格上漲至1 5/8美元，而12 月份25美元買進選擇權的價格則上漲至2 1/2 美元，現在該怎麼辦？沒問題，我仰仗著併購的謠言而以1
    1/8美元的價格銷售25 口賣出選擇權！接著，公司方面正式否認併購的謠言，賣出選擇權的價格由1 1/8美元上漲至1 3/8美元！我每採取一步挽救措施，情況便進一步惡化。這隻鱷魚終於飽餐一頓——我把500
    美元的損失擴大為6,000美元，這僅因為我沒有遵守一項我明明知道正確的原則。


    你知道嗎？INA 當時算得上是一支冷門股；沒什麼交易量，價格也罕有表現。一旦價格出現明顯變化時，應該很容易預測走勢。我當時認為，如果承認自己在INA 上犯了錯誤，相當於承認自己不認識英文字母。由於「謬誤的自尊」②（false
    pride）與虛榮，我一再地違背交易法則。


