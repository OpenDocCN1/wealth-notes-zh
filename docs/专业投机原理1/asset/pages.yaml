  md: '位相當成功的交易員，因為他有能力從事200口契約的交易。如果這筆交易很順利，他一定非常得意，因為他不僅可以獲利，而且市場證明他的判斷正確。這都是很合理的現象。然而，市場出現不利的走勢時，他產生遭到攻擊的威脅與恐懼感。他讓恐懼與謬誤的自尊（false
    pride）超越理性的判斷⑨。他雖然知道自己違背了交易守則，但仍然讓希望（wish）取代現實（reality）。


    交易者約翰或現實世界的任何人，他們的行為何以違背既有的知識，其中的理由非常複雜，我們將在下一章詳細討論。然而，如果我勉強將相關的理由簡化為一個句子，應該是：他試圖避開犯錯的痛苦。最嚴重的威脅並不是來自於金錢的損失——優秀的交易員會把偶爾的虧損視為是交易的一部份。導致非理性行為的強烈恐懼感是來自於犯錯的可能性。他採取行動規避痛苦，這便是他的問題。


    故事中，他採取的最後一項行動是——逃避。他逃離辦公室，試圖以酒精轉移自己的痛苦，恢復自己的情緒。結果：他的虧損超過原本設定的程度，錯失隔天的交易機會，忍受飲酒過量的痛苦，這一切都是因為他的價值觀過於強調避免犯錯的重要性。他的情緒引導他走上自我毀滅的道路。


    某些時候，即使你認為自己處於最佳狀態，仍然可能採取自我毀滅的行動。例如，你在場外進行S&P期貨的當日沖銷交易時，交易指令的執行經常十分不理想。情況的發展大致如此，我打電話給場內，要求報價。'
