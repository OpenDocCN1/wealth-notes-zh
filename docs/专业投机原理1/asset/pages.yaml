    # 應該的暴君


    根據截至目前的討論，可能導致一項結論，自我的理想化與其造成的追求榮耀，將形成一種傲慢的自我偏執（ arrogant egomaniac ），但這是因為我僅簡略討論追求完美的需求。假定在某種程度上，人們會建立超凡的自我形象，則在潛意識中，他們將「被迫」與這個形象共處，不論它是如何的不切合實際：


    他的心智保持著完美的形象，並在無意識中對自己說，「不論你實際上是多麼醜陋的生物；你應該是如此；理想化的自我才是最重要者。你應該容忍一切，應該瞭解一切，應該與每一個人融洽共處，應該具有生產力…因為它們都是屬於無情的應該，所以我稱為「應該的暴君」。'
