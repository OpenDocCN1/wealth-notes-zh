  md: '# 第九章

    世界真正的運作方式：

    經濟學的基本知識


    # 拼圖遊戲


    設想一種遊戲：在沒有圖形或模式可供參考的情況下，拼湊一副1萬片的拼圖。假定每一碎片都僅是灰色而沒有任何圖案，形狀僅有些許的差異。完成這個拼圖需要非凡的耐心，而結果僅是一個毫無意義的灰色長方形。你認爲你是否會嘗試拼湊它？我相當懷疑。雖然你可能會質疑設計者的意圖，但你應該會將它擱置一邊，讓少數有怪癖的人去尋找其中的莫名意義。


    對於大多數人來說，當代經濟學就如同上述拼圖——瑣碎而無意義——經濟學家都是具有怪癖的人，他們試圖解決無聊而複雜的難題。經營企業或從事任何行業，我們都很難發現它們與經濟學理論之間究竟有什麼顯著的關係。然而，如果你希望在金融市場中交易獲利，把經濟學視爲是無聊的東西而擱置一旁，可能是一種致命的錯誤。你必須瞭解，經濟學家的理論設計，以及政府官員與國會議員對於經濟問題提出的解決方法，將決定經濟活動的長期發展，並主宰價格的走勢方向。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '如果你曾經留意市場的情況，你應該可以發現股票、債券與期貨市場如何反映政府的政策，例如：新預算的赤字水準、「聯邦準備理事會」對於貨幣供給的態度、財政部對於美元幣值的報告、以及有關新貿易法案的謠言。金融市場認為政府可以主導美國的經濟。現在，絕大部份投資與投機行為，成功與否都取決於是否可以正確判斷政府的動作與影響——貨幣政策、財政政策、以及或就個別市場與一般經濟循環進行的干預性立法。


    我們的經濟是根據市場原理運作，但舞台的佈景是由政府決定——佈景隨時可能變動，這便是關鍵所在。如果你可以瞭解舞台經理人變更佈景依據的經濟理論，你可以預先判斷新的舞台佈置，調整自己的行為與立場。所以，成功的投機與投資，都需要俱備經濟學的知識；任何有效的市場預測系統都必須以它為基礎。讓我說明最後一句陳述。


    我到紐約市的「皇后學院」學習經濟學理論，但我發現它幾乎全無意義——除非由負面的角度考慮；換言之，我學習當代經濟學思想的錯誤、而不是正確之處。


    我的正式學校教育讓我瞭解主流凱恩思學派（Keynesian）的觀點，我們政府便是以這套理論擬定經濟政策。然而，在自修的過程中，我發現大多數大學傳授的經濟學理論都違背主要經濟學家的思想原則，例如：亞當史密思（Adam
    Smith）、米賽斯（Ludwig von Mises）、海耶克（Frederick Hayek）、海滋立特（Henry Hazlitt）、蘭德（Ayn Rand）、以及其他學者。我認為，凱恩斯僅不過是一位思想較周密的商人與一位泡'
  merge: -1
  img_proc: true
- pgno: 197
  md: '沐（bubble）的營建者。①我發現凱恩斯經濟理論中的根本矛盾，並在「現代奧國經濟學派」（Modern Austrian School of Economics）中發現正確的經濟原理。②於是，我開始瞭解如何利用政府的泡沫行為獲利，在通貨膨脹的初期進場，並即早離場；泡沫破裂時，我已經安然落地，並準備進場收拾。


    我不認為你需要接受正式的教育，取得金融交易活動需要的經濟學知識。事實上，我曾經鼓勵一位非常優秀的年青人不要上大學，並提供他一個交易的工作。我告訴他，在市場中學習，他的收獲將遠勝過大多數大學教育。透過觀察與經驗，他將學習這個世界真正的運作方式，而且很快成為一位優秀的交易員。


    另一方面，我認識一位在某大型金融機構服務的證券分析師，她主修經濟學，並有五年的市場經驗。我向她請教，美國政府究竟是否能夠清償公債。她回答：「不行，政府的債務將繼續擴大。」然後，我又問她，在人們質疑政府清償債務的能力以前，公債的規模還可以持續成長多久。她回答：「我不知道，但最後這些債務都必須被一筆勾消。它們畢竟只不過是一些紙張而已！」只不過是一些紙張！？不可思議！！在次一個空頭市場中，她將無助地看著股票與債券不斷創新低。不幸地，我曾經與無數人談論這方面問題，他們都持著類似的見解，顯示這是一種普遍性的觀點，它是源自對於經濟學基本原理的誤解。


    你不可以顛倒因果關係。華盛頓一些所謂為「經濟大師」，不可僅憑「國會」的紙上作業創造經濟繁榮。經濟學不'
  merge: -1
  img_proc: true
- pgno: 198
  md: '是一個神秘的領域，也不是少數專家與天才掌握的宗教啟示。許多政府決策者只不過是儒弱的政客，他們不敢告訴特殊的利益集團：天下沒有白吃的午餐。反之，他們採用種種複雜的技巧掩飾擴張支出的事實，並試圖逃避或故意忽略這些政策的必然結果——通貨膨脹或經濟衰退。然而，他們的行爲都是在經濟學的名義下進行。


    凱恩思在他所謂的「新經濟學」中，正式給予這些經濟謬論類似於科學的地位。他讓政府取得合理的根據，干預自由市場，控制貨幣與信用的供給，並採行不負責任的赤字預算與通貨膨脹的政策。除了極少數的例外，學術界將這些謬論視爲是經濟學的公理（axioms），並進一步將它們發展爲極端複雜的體系、術語、符號、以及數學方程式。難怪大多數人將經濟學視爲畏途，或一門沉悶的學問。


    如果你覺得經濟學非常沉悶或艱深，這一方面是因爲政治家與學術界多年來不斷主張，我們的社會與市場間的交互運作太過複雜，不適合於一般人自行處理。他們認爲，現代社會的「複雜經濟議題」需要相互權衡，必須在「理想」與「現實」之間取得平衡。


    他們蘊釀出一種普遍的見解，唯有政府——在無數人員、高薪顧問、眾多的委員會與官僚機構的協助下——才有能力在全國分歧的利益考量下，尋找一個正確的「妥協之道」。他們認爲政府應該管理經濟：透過通貨膨脹的手段，增加信用與貨幣的供給，以促進生產，同時又針對最具生產力的產業，課徵「超額利潤」的稅金；透過預算赤字的方式，提供「被剝削'
  merge: -1
  img_proc: true
- pgno: 199
  md: '者」公平的機會，同時又強迫可能提供他們就業機會的企業，支付最低的工資、社會安全的攤額與失業保險；透過貿易障礙保護國內的產業，同時又提供低利貸款或援助給「開發中」的第三世界國家，以便贏取它們的「友誼」；透過價格津貼政策以補助小麥、糖、黃豆、牛奶與其他農產品的生產，以「維持美國農民的獨立與競爭力」，同時又將剩餘的作物以免費或低於成本的價格賣給外國；以及其他無數的類似現象。


    我對於這套說法的反應，並不適合以文字表示，所以我僅提出一個忠告：「不要讓他們愚弄你！」如果你每個月都可以讓支票帳戶保持平衡，並瞭解不能永遠以債養債，則你對於經濟學的瞭解已經遠超過大多數政府決策者。他們與他們矛盾的計畫與法律，每年都耗費美國生產者無數的所得（我所謂的生產者，並不僅指產業界而言，而是指每一位有收入的人），這一切僅是毫無意義的拼圖遊戲。然而，如果你俱備正確的知識，可以利用這些碎片套入你自己的拼圖；你可以將政府的非理性行為，轉變為銀行帳戶內的鈔票。


    身為一為交易者、投機者或投資者，你的賺錢方式是基於預期中的價格變化而買、賣交易工具。若希望把這份工作做好，你需要有一些基本的認識：人們何以要交易、何謂市場、誰參與其中、價格如何決定、價格何以會發生變化、什麼因素會造成價格的變化、價格何時發生變化、……。另外，由於政府對於市場的干預，較其他任何因素都會造成更大的價格波動，所以你必須瞭解政府的政策如何影響市場。猶如一位新聞記者的報導一樣，你必須提出、並回答下列的問題：誰（who）？什麼（what）？何時（when）？那裡（where）？'
  merge: -1
  img_proc: true
- pgno: 200
  md: '爲什麼（why）？如何（how）？在一般而基本的層次上回答這些問題，這是屬於經濟學的領域。就特定的市場回答它們，則屬於行情預測的領域。經濟學提供行情預測的基本觀念。


    掌握正確的經濟學基本原理，你可以發展合理的市場預測方法，由無數的資料中篩選資訊，捨棄那些無謂的垃圾。你可以由一個簡單而正確的概念開始，觀察市場的資料，並推演出合理而精確的結論。你可以聽取分析師與「專家」的意見，並測試他們的結論是否俱備根本不變的有效性，判斷其中的矛盾與錯誤。總之，你可以成功地與那些「博學之士」相互競爭。


    知識的多寡並不重要，重點在於知識的素質與有效性。我認識一個人，並親自觀察他——正確地——回答每一項關於交易的問題，他卻是一位失敗的交易員。他花費無數時間發展傑出而錯誤的市場預測方法。我非常佩服他的智能，在交易中，他卻遭遇無法克服的問題——他無法辨識主宰市場行為的基本原則。


    本章的目的是要提出與界定經濟學上的基本原理與術語，稍後我將說明如何運用它們預測經濟循環，並以這些知識在市場中獲利。猶如拼圖遊戲說明書中的圖形一樣，這些原理將指引你如何拼湊市場預測的拼圖。


    # 魯賓遜的經濟學


    我認爲節儉（economy）是最重要的美德，而政府負債是最危險的行爲；我們必須在節儉（economy）與自由（liberty）或浪費與奴役之間做'
  merge: -1
  img_proc: true
- pgno: 201
  md: '> 選擇。如果我們可以防止政府假藉照顧之名浪費人民的血汗錢，他們將很快樂。


    ——傑佛遜（Thomas Jefferson）


    在這項陳述中，「節儉」（economy）具有兩種不太相同的意義。當傑佛遜說，「節儉是最重要的美德」時，他是指以謹慎而節約的態度管理公共收益。當他說「我們必須在節儉與自由或浪費與奴役之間做選擇」時，他是指政府的主要功能應該是什麼——應該擴張它的荷包提供公共服務，或應該保護人民的生命、自由與財產。


    傑佛遜較歷史上任何政治家都更瞭解，政府的「浪費」僅可以由「人民的血汗錢」清償。他知道，政府「假藉照顧之名」不斷增加預算，並不斷擴充服務，這必然需要犧牲私人的財產與個人的自由。


    不幸地，在過去兩個世紀以來，這個國家的 人民透過政治領袖的推舉，已經選擇浪費優於自由；所以，我們現在每工作三天，便需要把一天的收入交由政府花費。即使如此仍不足夠。如果目前每年超過1,000美元億的赤字持續發展下去，我們的子孫將繼承一筆無法負荷的財務重擔。如果傑佛遜地下有靈，恐怕將寢食難安。


    我們之所以陷入目前的困境，是因為我們採納錯誤的觀念，不僅是錯誤的經濟觀念而已，也包括錯誤的哲學觀念。美國人民被誘導而認為，世界上並無所謂的絕對正確與錯誤——一切都僅是相對因素之間的平衡；生命是一種非常複雜的過'
  merge: -1
  img_proc: true
- pgno: 202
  md: '程，所以應該把經濟政策交由「專家」處理。


    本書並不是一本哲學性的著述，但沒有任何事物比「生與死」更真實──所謂「生」是指經濟上的生存。我不認爲每一件事都很單純，但我認爲大多數事物都沒有表面上那般的複雜。我無法列舉每一項錯誤的經濟觀念、並反駁它，但我可以提供基本的定義與原理，我知道它們是正確而合理的觀念，它們或許無法以傳統的智慧證實，但我銀行帳戶內的的鈔票卻可以確認它們的有效性。所以，讓我們重頭開始，並探討何謂經濟學。


    經濟學是一門研究人類某些行爲的學問。根據經濟學家米賽斯（Ludwig von Mises）的定義，「它是一種科學，研究如何運用手段達成既定的目的③……它並不是討論有形的事物；它的對象是人類，他們的意義與行爲。」④換言之，經濟學是研究人類爲了達成目標，運用的工具、方法與行爲。這項定義是經濟分析與市場預測的第一原則；瞭解它之後才可以將其他的原則整合爲一貫的系統，並加以運用。


    大多數經濟學教科書對於經濟學的定義可能是：研究「生產與分配，以及如何運用所得、財富與商品」的一門學問。⑤這雖然是經濟學的處理範圍，卻不是真正的定義。例如，它指出所得與商品已經存在，而且有異於財富。它假定情況已經發展至某種程度，而分配是一項主要的考量。總之，它假定人類是生存在一個高度複雜化的社會；事實上，這種高度的複雜化是基本經濟原理發展的結果，但這些原理最初適用於個人，即使是單獨生存於荒島上也是如此。'
  merge: -1
  img_proc: true
- pgno: 203
  md: '以 Daniel Defoe 筆下的魯賓遜（Robinson Crusoe）為例。他的活動明確顯示個人經濟行為的基本層面，這也是市場經濟的構成基礎。漂流至一個只有食人族的荒島上，魯賓遜首先設計一種方法，以取得較目前所需更多的食物，並將它們儲存起來，如此他才可以設法取得其他的必需品。他利用節省的時間建造住所，佈置設備以防禦土著的攻擊，並製造衣物。然後，透過辛勤的工作、獨特的創意、以及時間的管理，他簡化取得必需品的程序，並在時間允許的範圍內，製造其他的奢侈品。


    在提高生活水準的過程中，關鍵在於：評估（evaluation）、生產（production）、儲蓄（saving）、投資（investment）與創新發明（innovation）。他評估當時可以掌握的目標與方法，根據他的需要做最適當的選擇。對於他追求的每一項事物，其價值（value）是根據許多因素判斷：對於需要之迫切性的感覺、追求它需要俱備的方法、以及需要花費的機會成本。他生產生存上的必需品，並加以儲蓄，所以他可以投資精力生產需要或想要的產品。每一事物的價格，是他評估自身的需要而願花費的精力與時間。他的活動是一種交易（exchange）的行為，從事某項活動而放棄另一項活動，機會成本間的差異便是他的利潤（profit）。如果判斷錯誤，他將遭遇損失（loss）。他安排與管理每一步驟的時間；他根據短期、中期與長期的考量選擇。透過技術的創新發明，生活必需品的成本（以所需支付的時間與精力表示）將降低，他禁得起以較多的時間與精力追求「奢侈品」。


    解釋魯賓遜的活動時，我以斜體字強調的概念，即是它們與市場經濟之間在行為與結果上存在的對應關係。事實上，市'
  merge: -1
  img_proc: true
- pgno: 204
  md: '場經濟僅不過是這項相同的概念表現在社會的層次上而已。在理性人類的個人基礎上，評估、生產、儲蓄、投資與創新發明，都是人類生存與成長的必要條件。


    在適當的考量下，經濟學的研究對象是人類維持生存可運用的方法，但因為人類是群居的動物，所以人與人之間的關係也是經濟學的重要領域。然而，經濟學的根本重心仍在於個人，因為社會僅不過是個人的集合。


    # 何謂市場？


    就群體而言，維持生存可以運用的基本方法也完全與個人相同。唯一的差異僅在於生產與交易（exchange）活動的複雜程度。就個人單獨而言，交易是從事某項活動而放棄另一項活動，交易的代價是以他個人的時間與精力表示。


    自由的社會中，個人能夠以自己的產品（財產）交換（交易，exchange）他人的產品與服務，並透過分工（division of labor）、專業化（specialization）、以及他人的創新發明而蒙受利益。所以，市場經濟使生存變得較簡單，但運用的方法則較個人複雜。就可供運用的資源與選擇而言，市場經濟活動較複雜；但就個人的生存與成長而言，市場經濟活動較簡單。如果魯賓遜擔任荒島上的清潔工作，他無法維持生存；但在紐約市，很多人可以靠著清洗摩天大樓的玻璃窗過著不錯的生活。


    類似魯賓遜這樣的個人，如果被迫生存在群體中，將基於自身的利益而試圖自願交換產品。他們會評估交換品的價值，根據自己的能力討價還價，並選擇最需要或最想要的對象。一'
  merge: -1
  img_proc: true
- pgno: 205
  md: '筆交易中，每一方都會以價值較低的物品交換價值較高的物品。交易涉及個人的判斷，每個人都會評估交換品的價值。評估價值的程序必然具有主觀的成份；換言之，這取決於個人的特定偏好、判斷、價值觀與目標。


    由於價值具有主觀的性質——人們對於價值的判斷不同——這使人們具有交易的慾望與動機，而交易的雙方也可以同時獲利。⑥玉米生產過剩而肉類不足的農夫，他對於玉米的價值判斷將低於牧人，後者需要玉米飼養牛隻——於是交易的機會便出現了。交換剩餘品（exchanging
    their surpluses）的活動涉及愈來愈多的人時，交易將變得相當複雜。許多個人之間的互動，社會將透過自由的結合而提供生產與交易的場所，這便是市場。


    人們根據供、需原理而自願交換時，便是以市場做爲交易的場所。這項定義同時適用於路邊攤與「紐約股票交易所」。雖然交易的系統可以簡單或複雜，但都適用相同的市場定義：市場是由一群從事交易的個人構成——他們基於自身的利益而試圖交換財產。


    # 貨幣的功能


    唯有市場成員俱備高度的生產力，並對於生命具有長期的控制能力時，貨幣才有其必要性。就最基本的形式來說，貨幣僅是一種人們普遍需要的商品，因爲它被公認爲交換的媒介。它就如同醃魚一樣是商品，但它具有耐久性，具有公認的價值，容易分割，而且攜帶方便。貨幣可以簡化交換的程序，人'
  merge: -1
  img_proc: true
- pgno: 206
  md: '們無需採用「以物易物」的交換方式。它使經濟價值可以計算；人們可以將主觀的經濟價值，轉換爲數據的形式。它提供一種計量的 方法，使人們能以貨幣的形式儲存未消費（unconsumed）的生產。接受美元、黃金或任何公認的交換媒介，人們可以相信它未來——不論是數分鐘、數天或數年之後——的購買力。所以，貨幣僅是一種俱備「交換媒介」與「儲存價值」的產品，它就如同任何其他的產品與服務一樣，必須受制於供、需的原理。


    信用（credit）是一種較複雜的貨幣形式。信用是市場創造的貨幣，它讓原本未被利用的儲蓄得以發揮功能。在信用發展的早期階段，當時是以黃金與/或白銀爲貨幣，金屬本身可以借、貸（通常是做爲抵押品），而清償借貸需要附加利息。於是，貨幣出現一種新的形式——紙鈔。


    放款者發現，承諾支付持有者特定數量黃金或白銀的紙鈔，較適合做爲交換的媒介。基於發行者的健全信譽，紙鈔一旦被普遍接受以後，發行數量總是會超過實質貨幣的存款，於是產生以信用爲基礎的交換媒介（fiduciary
    media，譯按：無準備發行的貨幣）。⑦


    發行者只要謹慎維繫它的清償能力，並讓存款者相信其信譽健全，它創造的替代貨幣（紙鈔）數量便可以超過實質貨幣的存款（譯按：以「金本位制」來說，實質貨幣爲黃金，以黃金爲準備發行的紙鈔，在理論上——但實際上並非如此——數量應該等於黃金存量，否則會造成通貨膨脹）。依此方式，財富可以加速成長，速度將遠超過實質貨幣借貸可能的範圍——'
  merge: -1
  img_proc: true
- pgno: 207
  md: '一切都取決於放款者如何判斷借款者未來的生產與交易能力。


    如果政府完全不介入，信用紙幣（fiduciary note）的成長主要取決於市場因素。⑧換言之，發行銀行最後必須有能力回贖所有在外流通的黃金或白銀紙幣，所以貴金屬的存量是信用擴張限度的一項客觀標準。猶如任何行業一樣，某些銀行會欣欣向榮，某些銀行會倒閉；某些存款者可以賺取利息，某些存款者會損失一切。然而，整體而言，將信用擴張至實際的儲蓄數量之上，確實可以大幅提升財富的成長速度。


    當今，不可兌換的貨幣（fiat money）——政府宣佈爲法幣（legal tender）的紙幣——是一種普遍被接受的交換媒介。不可兌換的貨幣與信用紙幣（fiduciary
    note）相當類似，都僅是一種交換的媒介，貨幣本身並無任何用途，前者卻沒有客觀的價值（譯按：黃金或白銀）做爲後盾。在不可兌換的貨幣體系內，貨幣與信用的供給數量並非直接取決於市場因素，而是由政府決定。貨幣發行數量已經不再有客觀的限度，一切都取決於政府官僚的主觀判斷。


    銀行體系不再以貴金屬爲準備，改採隨時可以支付的政府紙幣⑨，後者是由俱備課稅與印製鈔票權力的政府發行。⑩政府可以控制信用的寬鬆程度，採用的方法是規定銀行放款與買、賣政府貨幣市場交易工具的準備金比率，並直接或間接操縱利率水準。這大致上可以決定企業界與消費者的借款能力，後者又將決定貨幣供給的成長率。


    雖然政府可以控制貨幣與信用的供給，貨幣的購買力與信用成本卻仍然受制於市場原理。貨幣與信用仍然受制於市場的'
  merge: -1
  img_proc: true
- pgno: 208
  md: '供、需原理，供給面卻受到操縱。然而，健全的企業擴張仍然是以儲蓄為基礎，以謹慎的態度擴張信用。


    經過適當的管理，信用可以使財富加速成長，因為它能以最有效的方式運用儲蓄與潛在的產能。儲蓄的貨幣是一種對於未消費（unconsumed）物品的求償權。儲蓄者決定放棄目前的消費，選擇未來的消費（投資）。透過信用的發明，他們可以有所選擇，或是自行持有貨幣，或是將貨幣存於金融機構，並讓他人借用他們的儲蓄消費或投資，並因此在未來取得更高的購買力（譯按：這是指利息而言）。借款者利用借款購買未經消費的物品，並消費或投資，但他們都必須創造足夠的新財富清償借款與利息。放款機構在放款時，將創造新的貨幣，但如果借款者不能以創造的新財富償還這些貨幣時，實際的儲蓄將被消費。


    # 何謂財富？


    財富（wealth）是累積可供消費的產品與服務。唯有一種方式可以創造財富：生產多於消費，這需要仰賴科技（technology）的進步。科技是一種應用科學，而科學代表知識。人們取得知識而應用它，以提升生產力。由許多方面來說，我們的生命太過充實而遺忘科技的貢獻。我們將許多創新發明帶來的市場效率視為理所當然，例如：專業生產、分工合作與機械化程序。這些都是創新發現（discoveries），使人們的構想得以付諸實現。在市場經濟中，每個人都可以受惠於創新者的發現。科技創新帶來的效率可以延伸至整個市場，使每個人都得以更少的時間製造更多的產品與服務。每個人的生產力都提高'
  merge: -1
  img_proc: true
- pgno: 209
  md: '時，根據供給與需求的原理，每個人的消費都可以提升。


    不論產品與服務變得多麼複雜，不論整個程序涉及多少人，魯賓遜在荒島上適用的原理仍然有效。爲了生存，他必須評估自己需要或想要什麼以提高生活的品質，並生產以供交換。他支付的價格是取得交換品必須做的犧牲。爲了累積財富，他必須儲蓄，並投資當前的時間與產品換取未來的消費。分工合作需要創新發明，這可提高生產力。


    # 經濟學與人性


    > 經營事業猶如逆水而上。他毫無選擇；不進則退。


    ——Lewis E. Pierson


    自由市場經濟是人類創造的制度，它奠基於一種觀念，人類具有獨立而理性的思考能力，他們能夠維繫自身的生存。它雖然是人類創造的制度，卻是自然產生，它是個人在社會架構內理性行為的自然結果。政府並未創造市場；它們以強行的干預破壞市場。如果政府讓它的子民自由發展，市場將自動產生，它們猶如有自己的生命。


    我們可以觀察計劃經濟下的情況，雖然生產與交易受到嚴格的控制，「黑市」卻相當猖獗，而且主管當局大多默許這種現象，甚至鼓勵與援助。例如，最近有一個電視節目報導波蘭的情況，解釋某地方政府在一個小城選擇一塊幾英畝大的土地，劃分為許多小塊（每塊的面積甚至小於許多美國家庭的後'
  merge: -1
  img_proc: true
- pgno: 210
  md: '院），將它們分配給人們，他們可以種植蔬菜供自己消費。不久，使用這些土地的權利便在政府默許的黑市中交易，價格遠超過波蘭一般家庭的年收入。何以如此？因為新鮮的蔬菜水果當時（我想目前還是如此）幾乎不存在於國營市場，僅在黑市中高價交易。一個家庭如果可以取得幾塊土地，並將收成的作物在私有市場中賣出，可以增加數倍的收入。


    交易高度需求物品的「黑市」，雖然任何政府都會限制，但這種市場觀念在共產國家會受到嚴格的譴責。以蘇聯為例，它在研究「如何運用方法達成既定目標」時，採用一套截然不同的原理。人類並不被視為是一種具有獨立存在意義的實體，他們是另一種可供運用的天然資源以服務一個更高的主體——國家或共產社會。在這種觀點下，魯賓遜實現自我願望而提高生活水準的行為，確實違背共產主義的基本教條：「人盡其才，各取所需」（from
    each according to his ability，to each according to his need）。不論任何的議題，「共同利益」（common
    good）是唯一的價值標準；而「集體智慧」（collective wisdom）——由自以為是的監護者解釋——則是真理最後的裁決者。⑪


    對於他們來說，價值、價格、投資與創新發明，都有不同的意義與重要性。官僚根據政府的命令設定價值，以法令決定價格。國家計劃者的投資並不是基於獲利。他們要求人民的工作動機不可基於個人的利益。所以，這種社會的人民不願繼續生存在苟活的環境中，作者撰寫本書的時候，其政治領袖被迫逐步放寬市場的限制，因為他們擔心經濟將全面崩潰，政治將全然瓦解。'
  merge: -1
  img_proc: true
- pgno: 211
  md: '我基於非常重要的理由提及這些似乎是政治性的議題。你無法單純討論經濟思想而不考慮社會文化對於人性的看法。任何文化對於人性的主要哲學觀點，將決定政治結構的性質，並因此決定經濟活動的性質。哲學觀點愈正確，經濟政策也愈可能成功。人類被視為理性實體（這並不是指不會犯錯而言，而是指人類可以根據獨立思考維持自身的生存）的程度愈高，社會愈自由而不受到政府的干預。社會愈自由，人民的生活水準也愈高（這是指財富的累積而言）。⑫


    為了避免讓你覺得我的說法太過於抽象，我舉一個例子說明我如何利用這些思想獲利。在二十世紀裡，法國的政治始終充滿相當濃厚的左派社會主義色彩。1981年，激進的社會主義者密特朗（François
    Mitterrand）擊敗中間溫和派的對手季斯卡（Valéry Giscard d’Estaing）贏得總統的大選。當時，「紐約時報」非常推崇密特朗，雖然他的政見具有明顯的社會主義傾向。


    密特朗承諾創造一個充份就業的繁榮社會，他計畫將許多主要產業收歸國有，包括銀行體系在內，對富有者課征較高的稅金，引進大規模的社會福利計劃，並採取通貨膨脹的手段刺激經濟。⑬我知道（許多瞭解經濟狀況的其他人也是如此）密特朗試圖控制市場活動的政策將帶來一場大災難，而法國法郎將兌美元崩跌。


    我立即賣空法郎——當時它兌換美元的匯率為4：1——並在大約三週之後以6：1的匯率回補（它最後貶值為10：1），我在幾乎確定的情況下，輕鬆地賺取這筆利潤。我知道我的看'
  merge: -1
  img_proc: true
- pgno: 212
  md: '法正確，因為——套用亞里思多德的名言——「一個物品不能同時出現在兩地」。這句話在經濟學上則可以解釋為「你不能無中生有」。1983年時，密特朗的政策影響已經相當明顯。物價年增率為12％。政府預算赤字與貿易赤字都非常可觀。人們的生活水準普遍降低。法郎兌換其他貨幣的幣值進一步下滑。失業率佔總勞動人口的10％。實在令人訝異，密特朗竟然能夠執政到現在！我想這是可以理解的，因為我們的國父在「獨立宣言」的前文中曾經說道，「根據經驗顯示，人類的天性較願意容忍邪惡，卻不願更正他們習以為常的制度。」


    不幸地，包括美國在內，世界上每一個國家都存在集體主義（collectivist）的成份。因此，某種程度上，人們不僅需要對自己的生活負責，而且還必須照顧其他人的福利。根據集體主義的意識形態，政府的主要功能在於透過強制的手段，將共同利益重新分配給那些不能（或不願）生產、或生產水準較差的人。所以，美國與全世界的市場都存在不同程度的管制。


    尤其是貨幣與信用的供給，完全掌握在政治家的手中，所以市場大體上是受制於政府官僚的意念。然而，猶如優秀的偵探一樣，他可以根據動機逮捕罪犯，所以我們也可以根據當權人物的心智架構判斷政府政策的方向。他們的集體意識程度愈高，愈可能干預市場，並導致各種形式的不平衡。檢視政府干預政策對於生產、儲蓄、投資與創新發明的影響，並分析它們對於各個市場造成的衝擊（假定政府的政策不會半途修改，雖然它們經常如此），你可以預測價格變動的方向。


    如果希望預測未來的經濟政策，你必須瞭解政府可以運用'
  merge: -1
  img_proc: true
- pgno: 213
  md: '的政策武器，以及主要當權者的個性與意圖。就美國來說，最根本的政策武器有：稅制、融通預算赤字的方法與水準、「聯邦準備理事會」對於貨幣與信用的控制、以及限制生產與貿易的特殊法規。應該觀察的關鍵人物有：總統、Fed
    主席、財政部長、以及國會的重要領袖。首先必須瞭解這些人物能夠做什麼，然後再根據他們對於人性的觀點，推測他們可能做什麼，如此你便可以調整自己的部位配合政府未來的政策。


    相對於預測新政策來說，分析其影響較簡單。猶如亞當史密斯在「國富論」（The Wealth of Nations）所說：


    > 富裕的國家是可以讓人民輕易取得必需品與生活上的方便性。……談論國家的財富，便是談論其人民的富足。所以，任何政策如果會造成物價上漲，將減少大眾的富足程度與國家的財富，並因而減少人民的必需品與幸福。


    政府干預對於經濟造成的影響，將受制於市場原理。一個簡單的原理是：價格控制會造成供給缺乏，價格補助會造成供給過剩。例如，雷根（Ronald Reagan）1980年當選總統時（譯按：他在1981年1月份上任），國內的石油產業在政府的支持下一片繁榮，進口石油課徵偏高的關稅，OPEC操縱市場而造成人為的短缺，以及卡特政府運用複雜的價格控制與退稅制度限制「舊有油井產油」的價格，但放任新油井產油的價格。這造成瘋狂的鑽井熱潮——人們普遍參與鑽井的投機活動。


    雷根當選後，宣佈石油產業將自由化。在此之後不久，一位從事股票經紀業務的朋友打電話給我，建議我買進Tom'
  merge: -1
  img_proc: true
- pgno: 214
  md: 'Brown，這是一支店頭市場的石油股票，它在前一段期間由每股2美元上漲至68美元。我告訴他，「吉米，石油股的行情已經結束了；我可能會賣空這支股票。」他要求我不要這麼做，因為Tom
    Brown是他的好朋友，我聽從他的意思，但我賣空許多的石油股。


    我告訴吉米，中東的石油卡特爾（cartel）很快便會在競爭的壓力下瓦解，雷根的自由化政策絕對會扼殺國內的石油產業，因為自由競爭會導致價格下跌。於是，他減緩買進石油股，但基於稅金上的考慮，他仍然持有石油股的部位希望拖至1981年。然而，在1981年1月份，他的石油部位已經下跌25％。S&P
    500 指數在1980年11月出現頭部，因為指數內石油類股的權數很大。Tom Brown 最後又跌回2美元附近。不用多說，我大有斬獲，而我根據的僅是簡單的原理。


    現在，讓我運用相同的原理推測未來。最近，法定最低工資向上調整，這將造成速食店與零售商店的獲利能力降低，並迫使某些店面歇業或裁減員工。自動化設備將趨於更普遍，因為勞工成本提高使它更具有使用價值。年輕人與無特殊技術的勞工將出現更嚴重的失業，而政府的失業福利支出將增加。政府「假藉照顧之名」的行爲又將增添國家的困境。政府的干預無法迴避供、需的法則；它僅會胡亂更動天平兩邊的法碼。


    容我重覆強調，經濟學之所以重要，這是因為它說明人類在達成目標時，運用的工具、方法與活動。經濟學的重心，首先必須擺在個人單獨的行爲，其次才是社會架構內來研究個人的活動。適用於個人的原理也適用於任何團體或整體社會。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '正確的經濟學原理，必須假設人類是獨立思考的個體，並追求自身的福利。任何其他見解都會造成矛盾——根據這些見解進行的活動，必然造成錯誤的判斷與失敗的結果。猶如魯賓遜一樣，每個人都必須瞭解評估、生產、儲蓄、投資與創新發明等概念，如此才能維繫人類的生存與富足。對於交易者、投機者與投資者來說，市場預測絕對必須仰賴周詳而正確的經濟學知識，尤其是如何評估政府干預行為對於價格走勢的影響。


    # 生產造成富足


    > 如果可以掌握機會，將是無限的；如果忽略它們，機會將消失。生命中充滿許多機會。財富並不是在於賺錢，而是使人們能夠賺錢。成功是來自於生產而不是破壞。


    ——John Wicker


    假定你為某人工作，整天僅是坐著喝咖啡，看漫畫，玩弄公司文具——就這麼混日子。你認為你可以混多久？不會太久，我保證。你的老闆應該開除你，因為你對於公司沒有任何貢獻——因為你沒有任何的生產。


    為了生存與富足，人類必須生產，這是無法逃避的事實。生產是將天然資源或／與人造要素，重新排列與組合，並創造具有特定用途的新物品。我所謂的「創造……新物品」，並不是指「無中生有」。既有的魚類，漁夫把它們轉變為食物；透過其行為與創新，他生產食物。既有的鋼、銅、鋁、塑膠、…
    …，汽車製造者把它們轉變為汽車。製片家結合導演、演員、'
  merge: -1
  img_proc: true
- pgno: 216
  md: '編劇與技術人員，製成影片以供娛樂、廣告或教育之用。醫生試圖恢復病人的健康。股票交易員提供價格與交易。這些都是生產的行為。


    生產的行為可以簡單或複雜——由採集食物、製造塑膠品、乃至於石油精製品。產品可以是生理必需品或抽象概念——食物或詩歌——但每一種生產行為都是根據預定的用途或目標而創造出新的物品。某些重要的壓力團體，譴責過度的生產。他們認為，人類由於「過度生產」（overproduction）而愈來愈遠離「自然的境界」，並談論某些偏遠地區的人們仍然採集食物而過著「自然就是美」的Resumo。例如，「地球之友」（Friends
    of the Earth）的組織宣言中寫道，「唯一的理想科技便是沒有科技」，並進一步宣稱，經濟發展是「少數精英份子對於自然（natural）世界所課徵沒有對應選舉權的稅金。」（我懷疑何謂人為的[artificial]世界。）另一些人則渴望著童話中的「亞當樂園」（Garden
    of Eden），將它視為人類的烏托邦，並認為生產性工作是人類追求知識得到的懲罰。


    完全仰賴變幻莫測的大地之母，每天忙著打獵與收集食物，你是否希望過著這種一成不變而永無止盡的生活？你是否真正願意生活在「樂園」之中，那裡不需要思想，而「生產」也不具有任何重要性？如果你的生存必需品與所有的決策都已經被預先決定——任何選擇都無必要、也不可能——你的快樂將來自何處？不論這類「樂園」究竟如何，它絕對不是一種合乎「人性」的生存場所，我也絕不希望涉足其中。我實在不瞭解何以人們認為河狸所築的擋水壩是自然的景觀，而紐約的摩天大樓便不是——兩者都是動物根據天性創造的建築。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '根據Ayn Rand 的說法，生產的基礎是「將理性運用至生存的問題。」⑭人類的生存必須仰賴心智的運用；辨識他們的需求與欲望，根據認定價值的相對重要性排列先後秩序，尋找達成目標的方法，採取生產的活動。人類與其他動物的不同之處，是他們根據自然法則重新架構自然，並創造生存的環境。他們由艱困的自然環境中自我提升，使稀有的必需品變為富足，延長生命，開創嶄新領域的挑戰與機會。然而，他們之所以能夠創造這些成就，唯有他們可以自由地生產。


    我非常謹慎地提出生產的定義，它是泛指具備既定目標的所有活動。有一種相當普遍的經濟觀點認為，唯有創造有形物品的活動才屬於生產。許多經濟學家將產業劃分為生產部門與服務部門，似乎服務業並不俱備生產性。某些人悲嘆自動化與機械化生產程序日益普及，迫使勞工移往服務部門，因此造成有技術的高級勞工人口不斷減少。他們認為，服務業僅是扮演重新分配的功能，不是創造真正的財富。這是非常短視而錯誤的見解，它們來自對於經濟價值與財富觀念的誤解。


    可以滿足需求的任何東西都具有經濟價值，依此認定，商品與服務都有經濟價值。此處所謂的「需求」是泛指人類需要與想要的任何東西；我認為僅有一個人可以決定何謂需求——個人。如果相當數量的個人想要某種東西，並願意支付對應的經濟價值作為交換，它便具有市場價值。


    企業的目標是判斷或創造市場價值，並在滿足消費者慾望的過程中獲取利潤。追求這項目標時，企業家運用機械化、自動化與其他創新的程序製造更多的產品與服務，使更多人可以'
  merge: -1
  img_proc: true
- pgno: 218
  md: '享有更低廉的價格。因為科技創新而暫時遭到解雇的勞工，可以移往服務業，或留在製造機械化與自動化等高級資本財的產業。不論他們留在製造業或前往服務業，都是新的財富資源。機械化過程中儲蓄的人力、物力與時間，可以投資於新產品與服務，於是國家的淨財富可以增加。你可以稱此為人類生活的自然提昇。嶄新的生產程序淘汰舊有的方法，迫使社會上各層次人們提升知識與技術，以便在市場上競爭。


    雖然也有一些態度強硬的人們，尤其是 wanda 有組織的勞工團體，寧可選擇停滯不願成長，但那些擁抱變動、不斷提升知識的人，才可以成長——包括經濟與個人的成長。持續的思考、學習與生產，這是獲取自尊與自我價值感的基本必要條件。如果這項事實可以被更廣泛地瞭解與運用，就可以促進一個更健康、更快樂與更具生產力的文化。


    服務業不俱備生產價值，這種觀念完全沒有根據。除了食、衣、住、行等民生商品以外，人們還有許多可供消費的空間——財富的運用。如果他們挑選一家高級餐廳進餐，這是在消耗財富，但他們的消費可以用來支付餐廳的裝潢與設備、房東的房租、侍者的薪水、……。總之，他們的消費可以支持其他無數人的生產活動。


    經濟學家經常將人劃分為「生產者」與「消費者」，似乎兩者是不同的群體，或甚至於相互對立。這種劃分在經濟分析上當然有其價值，但每一位生產者也是消費者，每一位消費者也是生產者（除非你是靠祖產或政府的救濟過活）。在汽車裝配廠服務的工人，將各種零件組裝為汽車。他雖然僅從事組裝'
  merge: -1
  img_proc: true
- pgno: 219
  md: '的工作，仍是生產行為。餐廳侍者也是如此，她提供服務與氣氛，並因此獲得報酬。生產者交易產品以支付勞工的工資，後者又交易他們的工資換取其他產品與服務。對於每個人來說，都同時扮演生產者與消費者的角色，這是由生產與交易活動構成的鍊環。在自由市場的經濟中，生產與交易是達成個人目標的唯一合理途徑。


    生產是創造潛在的財富。財富是由未經消費的物品累積而成，不論這些物品是產品或服務都是如此——只要它們在市場上被視為有價值。在這種觀點下，餐廳侍者未經使用的服務也是一種財富。目前，我們通常都以金錢為單位衡量財富，這並沒有改變財富的基本性質。金錢的累積相當於是累積請求權，可以在市場上換取產品與服務，但金錢的購買力可能隨著時間的經過而變動。


    市場中，成功是以財富的累積能力衡量，財富來自於創造或預測其產品或服務的需求情況，使價格不僅可以維持當前的消費，並可以累積而促使經濟成長。這個程序中，第一步驟是生產，其次才是儲蓄。


    # 儲蓄，投資，信用與財富


    儲蓄即是投資。


    > ——Henry Hazlitt


    生產是生存的必要條件，儲蓄則是經濟成長的必要條件。為了累積財富，第一步驟便是生產的數量必須超過立即的消'
  merge: -1
  img_proc: true
- pgno: 220
  md: '費。其次則有兩種可能的選擇：將剩餘品儲存起來以供未來的消費，這稱爲單純的儲蓄（plain saving）；或者，被儲存的產品可以用來提升未來的生產力，或用來維持某些較費時間的生產活動，這稱爲資本儲蓄或資本累積（capital
    saving or capital accumulation）。


    在單純的儲蓄中，產品暫時被儲存，但遲早會被消費而不復存在。在資本儲蓄中，產品累積的目的是爲了提高生產力或創造全新的產品。資本儲蓄可以改善人類的物質生活條件，使他有充裕的能力提高生活的水準，不僅可以增加知識與生產，而且可以享有休閒娛樂。資本儲蓄是對於未來的投資，就此觀點而言，儲蓄就是投資。


    儲蓄是一種選擇的行爲，儲蓄者需要比較：將產品留至未來消費的目前價值，以及目前立即消費產品的價值。目前產品與未來產品之間的價值比率稱爲「基源利率」（originary
    interest）⑮——它衡量目前消費與未來消費之間的利率。基源利率愈高，資本儲蓄率愈低。反之，基源利率愈低，資本累積率愈高，財富的成長率也愈高。


    在金融市場中，基源利率將反映在資本財的成長或衰退率，⑯它直接關係著個人儲蓄與信用供、需的水準。資本累積與利率之間並沒有直接的關係。市場利率代表信用的成本，基源利率僅是信用的一部份成本。然而，人們決定在目前或未來消費時，基源利率是最根本的考量因素。基源利率取決於個人的偏好與其他的許多條件。下一章討論貨幣政策對於經濟循環的影響時，即可以瞭解上述區分的理由。總之，儲蓄是取決於'
  merge: -1
  img_proc: true
- pgno: 221
  md: '放棄目前消費以換取未來更高報酬的能力與慾望；它是爲了換取明天的成長，選擇今天不消費。


    新科技是經濟成長的動力，它來自於創新發明與知識、時間、精力、以及儲蓄資源的投資。科技是知識的應用，而發明則是創造的行爲。所以，科技發明是創造新方法以應用知識的行爲。第一位以魚網捕魚的漁夫是發明者，魚網便是新科技。事實上，魚網是一種儲蓄的形式——它是一種簡化生產程序的資本財。


    第一位以網捕魚的漁夫，必須儲蓄以取得知識、時間、精力與物料製造魚網。一旦他創造了魚網，並學習如何使用它之後，可以簡化生產程序。他不僅可以提供自己家庭所需的魚穫，還可以將剩餘的產量交換其他的物品。由於生產程序簡化，魚穫的稀少性也隨之降低，他的鄰居們可以專事於其他必需品的生產以交換魚穫。這個例子由較原始的層次上顯示，個人的儲蓄、創新發明、投資與資本的累積，帶來的效率如何貢獻給整體社會，並提升每個人的生產力。


    在文明進步的每一階段中，我們都繼承前人的知識，並加以改進。這也是促進成長的一種儲蓄形式。我們繼承獨木舟而發明帆船。帆船變爲蒸汽船。蒸汽船又變爲柴油動力的超級油輪。所有情況都是如此。整個程序是建立在前人的準備工作上，以及個人的創造力。如果我們的漁夫祖先們完全消費他們的魚網與獨木舟而不願投資時間來重置它們；如果我們的祖先沒有將種植小麥與製造麵粉的知識留傳下來；如果人類猶如其他動物一樣，僅是單純的消費者，目前的文明便無法存在。唯'
  merge: -1
  img_proc: true
- pgno: 222
  md: '有透過產品與知識的儲蓄，投資與成長才有可能。


    由社會發展的原始層次上觀察，我們很容易瞭解儲蓄是投資的基本。然而，在複雜的市場經濟內，我們很難體會兩者之間的關係。例如，一家工廠借款投資較有效率的新設備時，我們很難由這項行為中察覺儲蓄的功能。事實上，類似如凱恩斯之流的經濟學家，說服（或至少提出理由）其他具有影響力的經濟學家與政治家，生產與儲蓄並不是經濟成長的必要條件。


    根據凱恩斯學派的理論，生產的驅動力量來自於總需求（aggregate demand），後者是以可支配所得（disposable income）的貨幣單位衡量。他認為，讓每個人持有一些額外的鈔票，他們會支出，便可以創造需求，並促使生產者增加產量（這當然必須假定生產者不會僅以提高價格反應）。另一方面，儲蓄會造成「消費不足」，降低總需求與GNP，並妨礙經濟成長。根據這個觀點，政府僅需要運用赤字預算增加支出，採取寬鬆的信用政策增加經濟體系內的貨幣供給，並鼓勵每個人儘量支出而不要儲蓄，便可以保證經濟的繁榮。對於凱恩斯學派的經濟學家來說，問題僅是如何謹慎地管理政府的支出與貨幣的供給。


    我在前文曾經提及，貨幣是一種交換的媒介與儲存價值的工具，某人儲蓄金錢時，他或她持有對於未消費（unconsumed）產品或服務的請求權。單就這兩項陳述的表面意義來說，儲蓄似乎不俱備生產力；事實上，儲蓄與投資之間似乎沒有直接的關係。你可能認為，儲蓄將減少市場對於產品的需求，減少產業界的獲利，並因此導致經濟活動的衰退。這是完'
  merge: -1
  img_proc: true
- pgno: 223
  md: '全錯誤的推論。


    儲蓄基本上可以分為兩類：一種是將鈔票藏在床墊下的守財奴，另一種是普通的儲蓄者，他們將金錢存在銀行，或購買債券、黃金、股票、以及其他的儲蓄工具。一般來說，將鈔票藏在床墊下的守財奴不多，這種行為將造成貨幣流通量（相對於其他商品）減少，導致物價下跌的壓力，並提升貨幣的購買力。請留意，貨幣是一種商品，它就如同任何其他商品一樣也受制於供、需的原理。貨幣供給量減少時，它以其他產品表示的價值便提高。如果未考慮貨幣的購買力，財富不能以貨幣的數量表示。


    在第19世紀末的幾十年中，工業迅速擴張，美國的生活水準以罕見的速度提昇。如果僅以貨幣數量衡量財富，無法反映上述的現象。在經濟擴張的最巔峰20年內，以黃金與白銀為基礎的貨幣供給相當穩定，一般物價水準卻下降50％。事實上，在整個18與19世紀，除了政府在戰爭期間需要透過發行紙幣籌措經費以外，物價水準都處於普遍下跌的趨勢中。


    目前，物價下跌的現象被視為是奇觀，因為我們已經習慣於政府採用的通貨膨脹貨幣政策。然而，如果你將貨幣看待為一種商品，上述的現象便很容易理解。現在，企業界在擬定產品價格與估算收益時，都會考慮物價上漲的因素；同理，過去的企業經營都會預估物價下跌的影響。即使營業收入的金額下降，企業的獲利也可能增加，因為貨幣的購買力提高。過去之所以不同於現在，是因為貨幣與信用的供給是由市場因素──而不是政府──決定。'
