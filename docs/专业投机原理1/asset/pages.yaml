- pgno: 70
  md: '接替道氏擔任《華爾街日報》的編輯工作，直至他於1929年過逝爲止，他繼續闡揚與改進道氏的觀念，這些內容主要是發表在《華爾街日報》。另外，他也於1922年出版The
    Stock Market Barometer一書，並使「道氏理論」俱備較詳細的內容與正式的架構。


    李氏（Robert Rhea）是Hamilton與道氏的崇拜者，他由1922年開始直至1939年過逝爲止，在病榻上勉強工作，利用兩人的理論預測股票市場的價格，並有相當不錯的斬獲。透過周詳的研究，李氏使「道氏理論」俱備較嚴謹的原則與方法論，並公佈第一組「道瓊工業指數」與「道瓊鐵路指數」的每日收盤價圖形，其中還附成交量。


    李氏對於「道氏理論」的貢獻極多，他納入成交量的觀念，使價格預測又增加一項根據。另外，他也提出相對強度（relative strength）的概念，雖然他並未採用這項名稱；我們稍後將於第8章討論此概念。The
    Dow Theory一書是由Barron’s雜誌於1932年發行，目前已經絕版，李氏在此書摘取Hamilton的研究成果，並提出許多有助於瞭解「道氏理論」的參考資料。稍後，在Dow
    Theory Applied to Business and Banking一書中，李氏顯示「道氏理論」可以穩定而精確地預測未來的經濟活動。


    李氏在所有相關著述中都強調，「道氏理論」在設計上是一種提升投機者或投資者知識的配備（aid）或工具，並不是可以脫離經濟基本條件與市場現況的一種全方位的嚴格技術理論。根據定義，「道氏理論」是一種技術理論；換言之，它是'
  merge: -1
