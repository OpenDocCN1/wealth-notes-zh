  md: '# 第十一章


    # 衡量風險以管理資金


    # 風險的真正意義


    假定我告訴你，股票市場的風險可以根據客觀的方式衡量。如果你是經驗老道的市場專家，我知道你會怎麼想：「狗屎！不可能！」假定現在是1989年10月9日，你在市場中做多，我告訴你，市場大幅拉回整理的可能性是7：1。如果你知道這個比率，他相信它，你是否會改變既有的策略？如果你當時做多行情，我想你會的。


    事實上，在股票市場中，確實能夠以計量的（quantitative）方法衡量風險；有方法可以判定市場上漲x％與下跌y％的機率。它不是一種「系統」；它是一種一致性的方法，衡量當時市場趨勢持續發展或反轉的可能性。運用這種方法，投機者或投資者無需再仰賴變幻莫測的主觀「價值」判斷，而改採客觀的方式衡量風險。


    然而，何謂「風險」？我1966年初踏入金融圈時，對於撲克賭博的瞭解遠超過市場，我知道兩者之間有許多相似之處。兩者都需要技巧與運氣，但技巧的成份多於運氣。兩者都需要瞭解如何管理資金，所以即使連輸幾手牌，你還有本錢玩下去。'
  merge: -1
  img_proc: true
- pgno: 284
  md: '去。而且，兩者都暴露在發生虧損的可能性之下，這便是風險。


    我十幾歲時，並沒有在雜貨店裡賺那不能再低的工資，而是靠著賭撲克過著相當不錯的日子。我是一個撲克好手，因為我知道如何衡量與管理賭局內的風險。我考慮的重點不是檯面上的賭金多寡——以價值（value）為主的評估方法——唯有掌握有利的勝算時，我才會跟進；換言之，我跟進時，我的考量重點是相關的風險。風險涉及機率，機率涉及勝算。勝算有兩種形式：或是專業好手的主觀判斷，或是根據有限可能性的統計分配計算機率，然後再以機率衡量勝算。


    在撲克賭局內，勝算是明確、客觀而可以衡量的數據。例如，假定你坐在莊家右側，與五位對手玩五張牌的撲克。假定底注是10美元，第一輪後，檯面上有50美元。如果第一位對手喊10美元，除了你之外每個人都跟進，所以現在已經有90美元的賭金——你的潛在報酬是9：1（雖然其中有10美元是你自己的，你每一輪都必須分別考慮風險/報酬的關係）。假定你已經有四張紅桃，並希望最後一張牌可以凑成同花（同花能夠贏的機率最少為0.9963），最後一張牌是紅桃的機率是1/5.2——你的風險是5.2：1。風險為5.2：1，而報酬是9：1，所以風險/報酬的比率是1.73：1。風險/報酬的比率是1.73：1，同花贏牌的機率為0.9963，所以調整後的風險/報籌比率是1.73
    × 0.9963；換言之，你的勝算優於1.72：1。


    如果你完全根據這種策略撲克，某一手牌仍然可能輸錢。你偶爾還可能手氣甚差而連續輸錢，但長期來說，你贏的錢會'
  merge: -1
  img_proc: true
- pgno: 285
  md: '多過於輸的錢。我不認為這是賭博。賭博是盲目承擔風險。投機則是在掌握有利勝算的時候才承擔風險。這便是賭博與投機之間的根本差異。


    在紙牌中，專注於風險的策略相當有效，所以我到「華爾街」投機股票時，自然也希望以某種客觀的方法衡量勝算。然而，我向一些專家請教如何判斷風險時，他們總是哈哈笑道，「你不能在市場中衡量風險。這不是賭撲克。這與數學沒有關係。市場是隨機漫步的遊戲，」或「效率市場理論使風險/報酬的分析全然無效。」


    他們並不衡量風險，而是談論著如何分散風險，或更常專注於「價值」（value），並說「尋找價值，買進有價值的對象，然後抱牢。就長期而言，你將因此獲利。」這些建議不合我的胃口；除非我能客觀地掌握有利的勝算，否則我不希望暴露在風險中。


    目前，市場專家在這方面的建議要比60年代末期複雜許多，但基本態度還是相同。大多數專業目前都是根據某些相對性的績效或價值來分配資金。以股票投資組合的管理來說，Alpha
    與Beta 便是典型的工具。Alpha 是衡量素質的指標，比較個股相對於大盤的績效。假定某支股票的Alpha 值為1，代表這支股票的績效平均每個 月優於大盤1%。所以，如果大盤在六個月上漲10%，該股票將上漲17.8%。Beta
    是衡量價格的波動程度。如果某支股票的Beta 值為2，大盤上漲10%或下跌10%時，這支股票應該分別上漲20%或下跌20%。


    大多數帳戶經理人買進股票時，都是根據某一組合的'
  merge: -1
