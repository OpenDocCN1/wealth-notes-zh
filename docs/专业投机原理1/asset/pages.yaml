  md: '『成交沒有？』他說，『成交什麼？難道你不知道我的左耳不靈嗎？』」


    哦！當然！


    我這輩子最大的一筆虧損便是因為人為的疏忽。1982-1983年間，當時S&P期貨與NYSE期貨的交易非常熱絡（NYSE契約相當於在紐約交易的S&P契約）。在一筆套利交易中，我做多350口S&P，並賣空500口NYSE。我當時正打算平倉出場。於是，打電話給我在芝加哥的場內經紀人Paul，向他詢問行情報價。


    「買-賣報價，40-45，」Paul說道。


    我掛斷電話，並立即回補500口NYSE的契約，所以我僅剩下350口未抵補的S&P多頭契約。然後，我打算賣出S&P契約，根據Paul的報價，買進價為40。我連絡上在S&P交易塍的經紀人時，才發現價格不是40-45，而是20-25！結果，Paul看錯手勢！


    如果當時的報價確實是40-45，我已經獲利。如果我知道報價實際上是20-25，我便不會回補NYSE契約——在電腦程式交易尚未出現以前，4檔已經是相當不得了。


    當時，因為我的部位僅勉強浮出水面，所以我決定暫時持有S&P的部位。然而，市場突然出現新稅法的利空消息。在我了結部位之前，S&P下跌2、3大點。這筆交易讓我虧損數十萬美元。'
