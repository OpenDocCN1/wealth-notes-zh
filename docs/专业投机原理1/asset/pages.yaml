  md: '進步與價格的競爭，再加上貨幣購買力的提升，高科技產品價格的下跌速度會有多快嗎？重點在於：景氣衰退並不是由物價下跌造成，兩者之間未必存在任何的因果關係。


    守財奴減少貨幣流通數量的行為，對於物價與市場的影響非常有限。假定貨幣供給數量維持不變，物價將因爲貨幣流通數量的減少而向上調整。如果貨幣的供給數量相對於其他產品與服務而持續增加——猶如目前的情況——守財奴藏貨幣的購買力將減少。如果守財奴1940年在床墊下藏100萬美元，以美元的購買力而言，這筆資金現在僅值12萬美元。所以，在儲藏（hoarding）的行為中，守財奴僅會傷害自己。


    許多理由支持政府應該控制貨幣與信用，其中最具影響力的論點是由凱恩思提出來的主張，儲蓄是一種不具生產力的行為——經濟衰退是由「消費不足」造成，這是指儲藏（hoarding）而言。多年以來，儲蓄都被視爲是儲藏，但儲藏實際上是一種相對罕見的行為，通常並不會對整體經濟形成真正的傷害，頂多是造成自己的損失而已。


    一般來說，儲蓄者並不是守財奴，他們會把錢存在銀行與其他金融機構，或購買債券、股票、……等交易工具，並將儲蓄提供給信用市場。這類的儲蓄者委託他人或機構保管他的儲蓄，並預期未來可以獲得報酬。這種儲蓄便是經濟擴張的動力。另外，儲蓄水準愈高，信用成本愈低——這是簡單的供、需原理。


    魯賓遜儲蓄食物以便騰出時間建造住所，也是運用相同的原理。在市場經濟裡，這項原理僅發生在較抽象的層次上，而'
