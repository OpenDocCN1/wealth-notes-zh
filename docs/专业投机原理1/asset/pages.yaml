- pgno: 7
  md: '# 前 言


    有關金融市場的書籍……我個人的圖書館也至少有1,200本。它們是討論證券分析、選擇權策略、期貨策略、技術分析、以及其他相關內容的書籍。這些書籍大多包含相當不錯的構想，其中約2％是真正傑出的作品。然而，它們大多存在一個共同的問題：試圖推銷一種「戰勝市場」的方法，很多方法甚至沒有經過實際市場的完整測試。另一些書籍的內容非常專門，除非讀者已經擁有相當充分的相關知識與多年經驗，否則根本無法暸解。


    市場新手或專業老手都透過嘗試錯誤的途徑，花費無數的寶貴時間學習市場的知識，或試圖將某種方法運用在市場中。我希望尋找一本可以避免上述無謂浪費的書籍，它包含所有的市場基本觀念與獲利知識。結果，我找不到一本適當的書，所以我決定自己寫一本。另外，我也希望提供我對市場的觀察與發現，它們協助我在十年內，創出每年平均70.7％的名目報酬率，而且任何一年都未曾發生虧損，請參考表P.1。


    在華爾街的交易生涯中，我發展出一種獨特方法整合各方面知識，包括：勝算、市場與交易工具、技術分析、統計機率、經濟學、政治學、以及人類心理學。大多數市場玩家都倚賴其中一、二、或三種領域內的知識，我卻結合這些領域試圖'
