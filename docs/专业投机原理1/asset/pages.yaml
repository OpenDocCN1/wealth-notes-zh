  md: '信念之所以產生的原因與信念所造成的結果。例如，你對自己說，「我實在很笨！」不論這種感受多麼短暫，都會強化這個信念。你說這句話基本上可能並沒有自責的意思，但如果你經常如此對自己說，尤其在情緒激動的時候，你的心智將開始相信它。


