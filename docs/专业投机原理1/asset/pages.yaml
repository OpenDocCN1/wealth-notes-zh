  md: '情況便如同前文中有關ABC銀行體系的討論。然而，我們必須瞭解，銀行如何以各種不同方式提列準備金，以及Fed如何在這個範圍內，影響貨幣與信用的供給，並監督放款機構的活動。


    「理事會」利用準備金比率規範法定準備，後者僅能夠以兩種準備金資產的形式持有——現金與「聯邦準備區域銀行」的存款。就個別的放款機構來說，資金將不斷流進與流出，所以個別機構的準備金資產在短期內可能發生不足或過剩的情況。準備金不足時，銀行或放款機構有兩種解決的方式：在短期的基礎上，借取其他機構的超額準備；或者，可以向「聯邦準備區域銀行」的貼現窗口借款。


    金融機構超額準備的借貸市場稱爲「聯邦基金」（Federal Funds）市場，利率水準稱爲「聯邦基金利率」。這種「借債還債，東借西還」的市場，以及利率水準，都是非常值得觀察的重要指標。表面上，這個市場僅是讓銀行可以短期融通不足的準備金，但實際上使整個銀行體系得以做最充分的放款。


    事實上，在1979年以前，Fed的政策目標便是以聯邦基金利率表示，並以此爲公開市場操作的準則，這可以顯示聯邦基金市場的重要性。何以如此？因爲銀行間（interbank）利率水準可以決定準備金借款的寬鬆程度，並被視爲是整體信用市場的利率指標。然而，回顧卡特執政的期間（1976-1980），最初發生幾近失控的通貨膨脹，接著是利率管制，接著是信用緊縮，接著是自由化與22％的利率！


    將聯邦基金利率視爲唯一的目標利率，顯然不足以控制市'
  merge: -1
  img_proc: true
- pgno: 264
  md: '場的信用水準。猶如市場中的任何事物一樣，供給與需求將決定信用擴張的程度。卡特執政期間，銀行願意以高利率放款，人們也願意借款，因為他們認為利率將繼續走高。然而，1990年底體系內出現巨量的超額準備，但銀行就是不願意放款。


    1979年之後，除了控制聯邦基金利率之外，Fed也試圖利用重貼現率控制信用擴張。重貼現率是放款機構向「聯邦準備區域銀行」借取準備金時適用的利率。理論上，重貼現率是由各「聯邦準備區域銀行」決定，但需要經過「聯邦準備理事會」同意。然而，實務上，各「區域銀行」的重貼現率都一律相同，它們會自動接受「理事會」建議的重貼現率。


    融通準備金的時候，重貼現率與聯邦基金利率之間有相當大的差異。在貼現窗口融通，這是最赤裸裸的通貨膨脹。銀行向貼現窗口借款時，Fed以自己的名義開立一張支票，創造的貨幣便可以做為借款銀行的新準備金。


    借款銀行根據貼現率支付利息，整體銀行體系放款最高的增加額度，大約是借取準備金的10倍。由於貼現率必然低於市場利率，所以就如同我最初開始從事選擇權交易的情況一樣，借款銀行扮演「仲介的角色」，以較低的利率向貼現窗口融通，然後以較高的利率放款。


    然而，這種仲介交易有瑕疵。向貼現窗口借款，代表借款者超額放款。任何金融機構都不願意被Fed盯上，所以放款機構會嚴格限制貼現的次數。基本上，它們向貼現窗口融通時，都會接到一種沉默而明白的警告，「你要好好自我檢討。如果
    你需要準備金，由自己的管道籌措。」'
  merge: -1
  img_proc: true
- pgno: 265
  md: '相較之下，聯邦基金市場非常自由。銀行只要可以「居間仲介而撮合交易」，並清償向同業借取的款項，便可以在聯邦基金市場借款。1970年代末期，市場信用非常浮濫，因爲Fed不願賣出足夠數量的政府證券，推高聯邦基金利率，所以無法壓抑擴張信用的銀行間借款行爲。


    當時，Volcker所能做的僅是要求「理事會」同意（4票對3票），將重貼現率由10.5 %調升至11 %，這項策略的效果遠遜於以公開市場操作推高聯邦基金利率。


    Fed在1970年代顯然不瞭解，利率並不是決定信用與貨幣供、需的唯一因素。這需要回顧米賽斯對於市場毛利率的解釋，以及其三種成份在「繁榮/衰退循環」中的變化。


    在擴張期間，如果基源利率因爲物價走高而偏低，如果價格升水成份因爲市場利率走高而被市場認爲偏低，如果企業家成份在盈虧的計算中被視爲可以接受（不論名目利率多高），則市場參與者會盡可能地借款！


    換言之，不論實際的利率水準如何，只要信用的供給與需求都沒有問題，銀行將持續放款，信用也將持續擴張。Fed無法壓抑1970年代的信用擴張，其中還有另一項理由，因爲當時僅有聯邦準備的會員銀行才必須遵守法定準備的規定。這意味著不受管制的放款機構可以隨意創造貨幣，其中一部份會成爲Fed會員銀行新存款，並讓它們擴張信用。另外，會員銀行與其他機構的<|start|>外國負債（歐洲美元）都不需受到法定準備的規範，所以國外創造的美元可以回流至國內，並進一步刺激貨幣'
  merge: -1
  img_proc: true
- pgno: 266
  md: '供給的成長。


    當時，我們處於信用擴張的繁榮末期，物價普遍上漲，人們認為物價水準將永無止盡地攀升。群眾在房地產、股票、商品、以及其他任何可供投機的對象上累計龐大的帳面財富；同時，固定收益的一般勞工卻身受其苦，抱怨政府未能有效壓抑物價。這是「密西西比事件」的大規模重演。


    然而，只要利率繼續上揚，今天的貸款還是勝過明天的貸款，因為市場瞭解美元的購買力不斷下滑。政客們為了討好選民，頻頻向 Fed 施壓，要求保持偏低的利率水準。政府部門中雖然有些人瞭解情況的危急，卻不敢採取行動，因為擔心整個經濟像骨牌一樣的崩塌，會影響民主黨的下屆大選。


    1979 年最後一季美國經濟已經出現「囤積實物」的普遍心理。黃金價格飆漲，1980 年 1 月初期貨市場出現每英兩 875 美元的天價。沒有人願意持有紙幣。人們搶進股票、期貨、房地產或黃金，持有一年，甚至於幾個月，便可以獲得
    20 % 以上的利潤！太神奇了！垂手可得的財富！這難道不是警訊嗎？這看起來不正是「密西西比事件」嗎？


    非常幸運地，我們畢竟還具有最根本的經濟智慧，瞭解我們正邁向「崩解的繁榮」（crack-up boom），類似德國在 30 年代與南美洲某些國家目前的情況。1979
    年 10 月 12 日星期二，Paul Volcker 提早由南斯拉夫的貝爾格萊德返國，他當時正參加「國際貨幣基金」與「世界銀行」的會議，並宣佈 FOMC
    將於當週六召開緊急會議（Fed 偏愛挑選休假日集會，使市場無法立即反應）。'
