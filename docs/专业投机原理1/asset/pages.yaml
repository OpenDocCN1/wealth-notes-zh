  md: '者。我的情況也是如此——主要是以行情為取向。所以，本書的主要重點在於，如何預測市場的價格走勢，以及如何管理市場、股票或商品的風險。至於如何選擇值得進一步分析的類股，並解釋個別股票在何種條件下可以上漲，這在本書中僅居於次要的地位。有關如何詳細分析個別股票，讀者可以參考許多選股策略的好書，以及許多專業分析師在這方面的貢獻。非常感謝這些分析師的存在，因為他們提供很多有用的資訊，雖然這些資訊經常相互矛盾。


    我的市場經驗可以回溯至1966年。截至目前為止，我對於我的交易成就頗引以為傲。我發展出一套在金融市場中穩定獲利的方法，而且不需要埋首在無數的公司財務報表中，也無需綜合評估許多「專家們」的分歧意見。②本書的第I部份將解釋我使用方法的基本知識——這是較簡單的部份。第II部份將解釋如何整合這些知識，並讓它們發揮功能——這是較艱難的部份。


    自從本書1991年首度出版以來，市場出現一種不尋常而又普遍的現象：市場總是具有相同的性質，因為它們始終不斷變化。股票市場已經成為一種機制性的「泡沫」（institutionalized
    bubble）交易工具。我開始學習交易的時候，市場的起伏不定而波動相當劇烈。在1966年至1974年之間，有四年呈現上漲的行情，五年呈現下跌。然而，自從1974年以來，則有15年上漲而僅有3年下跌。這三次下跌的幅度都相當有限，分別為1977年的7.1％、1981年的4.9％、以及1990年的3.1％（這是以S&P
    500為準）。最近10年以來，S&P 500的年度化總報酬平均為19.1％。猶如1940年代至1980年代中期的房地產市場一樣，股'
  merge: -1
  img_proc: true
- pgno: 15
  md: '票市場已經成為「保證獲利」的交易管道。


    基於這個緣故，定期存單的投資者紛紛轉入股票市場，因為定期存單3％的殖利率顯然不具吸引力。一般民眾與機構法人抱持這種「絕對不會虧損」的心理，終將導致1930年代以來的最大財富損失。理由並不難以瞭解。1975年「聯邦準備銀行」與卡特總統選擇以通貨膨脹為手段，促進美國經濟恢復「成長」。1980年代預算赤字取代通貨膨脹成為「經濟成長」的動力。1990年代柯林頓總統又回頭選擇通貨膨脹。1991年至1993年之間，股票市場的表現如此耀眼，理由很簡單：


    +   1. 調降公司所得稅，平均稅率由43％降為37％。 2. 利率水準下滑，「聯邦基金」（Fed Funds）的利率由1989年3月的10％，降為1992年第二季的3％。這保證公司的盈餘可以改善。請留意，美國是一個信用高度擴張的國家——在創造每一美元的稅前盈餘時，企業界在1990年需要支付70美分的利息費用，現在僅需要支付50美分。
    3. 提高生產力（企業界大量裁員）！


    這並不代表美國經濟的成長，而僅是公司盈餘的暫時性增加。柯林頓執政期間，利率與稅率調高時，公司的盈餘將遭受致命的打擊！我建議你仔細閱讀第9章與第10章，以瞭解經濟體系目前的根本情況。另外，第6章與第7章的技術分析內容也完全適用於現今的市場。


    我真心希望本書能夠對你有所幫助，並祝福你一切幸運。'
