  md: '這裡我必須指出，雖然1987年的行情發展相當特殊（就歷史的角度來說），但根據「道氏理論」的嚴格判讀，在10月14日便出現明顯的中期賣出訊號，當時「工業指數」以大成交量向下突破9月21日的低點（「運輸指數」已經提早創新低點）。不論你將當時的長期趨勢視爲是多頭或空頭市場，這項中期賣出訊號都有效。然而，如果你把崩盤走勢視爲是空頭市場的第二支腳，則往後便沒有明顯的多頭進場訊號。


    在空頭行情的假定之下，我在1987年10月24日建立多頭部位，因爲我認爲當時將展開次級的向上修正走勢。在1988年3月份結束多頭部位之後，我在1989年10月份之前便未再大量介入股市，而後者的情況已在第二章做了說明。1989年10月13日，我對於市場的預測主要便是基於「道氏理論」。


    # 行情的四個階段


    我稱爲「訊號」（signals）的兩個關鍵指標分別是狹幅盤整與成交量關係。任何市場都必然處於四種技術階段之一：(1)承接（accumulation；長期投資者的買進），(2)出貨（distribution；長期投資者的賣出），(3)向上或向下的趨勢，(4)整理（consolidation；在經過確認的趨勢中，發生獲利了結之後的調整）。以另一種方式說明，如果市場並無趨勢，便是處於狹幅盤整（line）的走勢。李氏將狹幅盤整定義爲：


    狹幅盤整（Lines）：——「狹幅盤整」是長達兩、三個星期或以上的價格走勢，在此期間，兩種指數都在大約5％的價格區間內波動。這種走勢可能代'
  merge: -1
  img_proc: true
- pgno: 108
  md: '表承接（accumulation）或出貨（distribution）。兩種指數同時向上穿越盤整區間的上限時，代表是承接的盤整，而價格應該繼續走高；反之，當兩種指數同時向下穿越盤整區間的下限時，代表是出貨的盤整，價格應該繼續走低。如果僅根據一種指數判斷，另一指數並未確認，結論通常為錯誤。


    狹幅盤整的走勢通常發生在中期行情的頭部或底部，這種情況下，李氏的定義完全適用。在主要的市場頭部，擁有較佳資訊而態度謹慎的長期投資者，試圖在一段期間內出清（非常大量的）投資組合，又不希望明顯壓低價格。由於當時市場上的多頭投機氣氛仍然相當濃厚，他們可以分批出貨，將籌碼轉手給交易者與投機者。因此，在數個星期或以上的期間內，價格將狹幅波動而沒有明顯向上或向下的趨勢，這便形成狹幅盤整的走勢。這也可能發生在某特定的個股或商品市場。


    最後，市場共識認為價格將下跌時，將穿越狹幅盤整的下限。就市場術語來說，這是「突破」（break）——賣空股票或商品的絕佳時機（參考圖5.6）。


    在主要的市場底部經常也會發生相同情況，但方向相反。價格大幅下跌後，明智的長期投資者認為當時的股票價格具有長期投資的價值，於是開始建立大規模的部位。或許是為了試盤，或許是不希望推升股價，他們在數星期至數個月的期間內，默默地承接股票。結果也形成狹幅盤整的走勢。最後，市場共識認為價格將上漲時，將穿越狹幅盤整的上限。就市場的術語來說，這是「突破」（break）——買進股票或商品的絕佳'
  merge: -1
  img_proc: true
