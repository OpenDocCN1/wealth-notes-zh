  md: '金價格向上突破先前的反彈高點367.70美元，確認1-2-3中期趨勢變動的訊號，我進場買進黃金。在這個時候，根據相同的準則判斷，長期趨勢也可能發生變動——價格向上突破趨勢線（條件1），並已經測試先前的低點而未跌破（條件2）。①


