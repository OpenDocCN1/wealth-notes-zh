  img_proc: true
- pgno: 399
  md: '# 信念與個性


    許多人可能俱備類似的目的價值與反價值，但個人的體認則不相同。這是因為我們的信念有所差異。信念有兩種形式：對於生命、人性與事物的一般性概念；以及衡量自身與他人行動之意義的法則。


    一般性的概念——經常稱為整體信念（global beliefs）——反映我們對於世界、人性與自身的觀點。所以，整體信念的陳述，通常以動詞「是」表達，例如：「生命是__________，人類是__________，我是__________。」


    法則較為明確，它們決定某項結果必須以某些事件為前提。它們通常以「如果，則」的形式表達，例如：「如果我賺了100萬美元，我將很快樂。如果你愛我，你應該儘可能地陪伴我。如果我犯錯，我將可因此學習。」每個人都有一組獨特的整體信念與法則，決定我們獨一無二的個性。


    例如，不妨考慮我先前所提成功的必要條件：自信。自信的感覺是來自你對於個人意義與效力的體認。你對於自己的感覺，主要並不是取決於自己的行為實際如何，而是取決於你如何判斷自己的行為，行為的判斷又取決於判斷的標準——你對於意義與效力的信念。


    例如，假定一位極具才華的年輕交易員，他以下列信念判斷成功或失敗：


    如果我是一位優秀的交易員，則90％的交易都會'
  merge: -1
  img_proc: true
- pgno: 400
  md: '獲利。


    如果我是一位優秀的交易員，則我賺的錢必須多於世界上其他的交易員。


    如果我是一位優秀的交易員，則我在任何市場上的操作都必須優於世界上的其他交易員。


    相當有野心的年輕人！可是，他將因此註定陷入充滿挫折與不安全感的命運中。這些是不可能的標準，任何人都無法依此建立穩定的自信心。


    為了獲取自信，你應該採用可能達成的標準。這看起來似乎有循環論證的意味，實際上並非如此。例如，如果我對於經營事業的成功標準是：每個月的都有盈餘。這是可能達成的標準。反之，如果我將標準定為每個月的淨賺100萬美元，則我很難在這個標準下獲得自信心。


    標準不同於目標。目標是你追求的真正對象；標準則是判斷行為的參考依據。我希望每個月的都淨賺100萬美元，我認為這是可能的標準（實際上並不是我的目標之一），但以它判斷成功與自我價值，則屬於完全不切合現實的標準。我相信為了追求成功，一方面你應該嚴格要求自己——你設定的目標預高，你的成就也愈高；另一方面，用來評估自我價值的標準應該設定得寬鬆。


    在一般的情況下，侷限性的信念是失敗的根源，這包括不能把生命視為是愉悅的過程在內。以下是一些典型的侷限性整體信念：'
