- pgno: 254
  md: '# 貨幣與信用：如何創造與控制


    前文曾經說明，在銀行發展歷史的早期，放款者發行的金本位或銀本位銀行紙幣數量，可以超過它們實際持有的黃金或白銀。只要大眾相信發行機構隨時有能力以硬幣兌換紙幣，銀行可以創造紙幣（信用媒介，fiduciary
    media），這些紙幣在市場中普遍被視爲是交換的媒介。我在「密西西比事件」中也曾經說明，紙幣的發行數量如果過多（相對於黃金與白銀），會造成災難性的後果——價格的通貨膨脹與經濟的瓦解。


    在「聯邦準備體系」內，基本原理也完全相同，但有一項重大的差異——除了政府宣佈爲法幣以外，沒有任何東西支持美元。這是一種不可兌換的貨幣系統（fiat money
    system）。美元的價值完全取決於市場對於其購買力的信心，貨幣購買力最後則取決於通貨相對於市場中其他產品與服務的供、需關係。


    在貴金屬本位的制度中，相關金屬的數量可以限制紙幣的發行。在不可兌換的貨幣制度中，Fed 則是以法定準備（reserve requirements）控制貨幣的發行數量。自從「1980年貨幣管制法案」（The
    Monetary Control Act of 1980）通過以後，美國所有存款機構都必須遵守法定準備的規定。


    法定準備是指存款機構的準備金負債（reserve liabilities）必須提列一定百分率做爲準備金資產（reserve assets）。準備金負債包括交易存款、定期與儲蓄存款、以及對於國外銀行的淨負債（歐洲美元的負債）。準備金資產包括：存款機構持有'
  merge: -1
  img_proc: true
- pgno: 255
  md: '的現金（實際的鈔票與硬幣）、以及存放於「聯邦準備區域銀行」的準備金存款（reserve deposits）。基本上，存款機構擴張信用與貨幣供給時，法定準備是唯一的客觀限制。


    例如，假定某商業銀行擁有1億美元的交易存款（可以隨時開支票的存款），目前它至少必須提列120萬美元的資金，或是存入「聯邦準備區域銀行」，或以現金形式持有。1億美元是準備金負債，120萬美元是根據目前的準備率（reserve
    ratios）計算的法定準備。表10.1是「聯邦準備理事會」公佈的準備金比率。


    就貨幣的創造來說，準備金比率與存款機構所能創造的貨幣數量之間，存在一種反向的關係。例如，如果準備率為10%，銀行體系內每增加一美元，所創造的新貨幣為10。以較實際的例子來說，假定Fed在一週內買進價值2.5億美元的政府公債，以10%的準備金比率計算，貨幣供給的增加潛能為25億美元。相反地，Fed賣出2.5億美元的公債，則最高可以收縮25億美元的信用。


    如果我們由所有存款機構的整體角度思考，同時觀察它們在市場中的交易，以及它們與「聯邦準備區域銀行」之間的交易，或許容易造成混亂。所以，我們以一個假設性的模型解說，一個稱為ABC的國家，它的中央銀行是採用部份準備金的制度。


    現在，我將逐步介紹信用擴張的程序，並說明Fed（或任何中央銀行）如大筆一揮便創造或刪去貨幣。為了單純起見，我僅列出資產負債表中受到影響的部份，所以請不要介意資產'
  merge: -1
  img_proc: true
- pgno: 256
  md: '與負債之間的不平衡關係。在完整的資產負債表中，借、貸雙方必然平衡。


    # 表 10.1 準備金比率，1990年5月


    | 負債類型 | 準備金比率（%） |

    |---|---|

    | 交易帳戶 | |

    | 0-4,040萬美元 | 3 |

    | 超過4,040萬美元 | 12 |

    | 定期與儲蓄存款 | |

    | 個人 | 0 |

    | 非個人 | |

    | 到期時間少於11/2年 | 3 |

    | 到期時間在11/2年以上 | 0 |

    | 對於國外銀行的淨負債（歐洲通貨的負債） | 3 |


    爲了單純起見，假設ABC僅有支票存款，總額爲10億美元，全部都對外放款；另外，中央銀行設定的準備率爲10％。我們又假定ABC的銀行體系會在中央銀行的許可範圍內做最大額度的放款。在這種情況下，ABC整體存款機構與中央銀行資產負債表的相關部份將分別如下：'
