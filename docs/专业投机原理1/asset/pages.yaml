  md: '# 定理5：


    次級折返走勢（Secondary Reactions）：就此處的討論來說，次級折返走勢是多頭市場中重要的下跌走勢，或空頭市場中重要的上漲走勢，持續的時間通常在三個星期至數個月；此期間內折返的幅度為前一次級折返走勢結束後之主要走勢幅度的33％至66％。次級折返走勢經常被誤以為是主要走勢的改變，因為多頭市場的初期走勢，顯然可能僅是空頭市場的次級折返走勢，相反的情況則會發生在多頭市場出現頭部後。


    次級折返走勢（修正走勢；correction）是一種重要中期走勢，它是逆於主要趨勢的重大折返走勢。判斷何者是逆於主要趨勢的「重要」中期走勢，這是「道氏理論」中最微妙與困難的一環；對於信用高度擴張的投機者來說，任何的誤判都可能造成嚴重的財務後果。


    判斷中期趨勢是否為修正走勢時，需要觀察成交量的關係、修正走勢之歷史或然率的統計資料、市場參與者的普遍態度、各個企業的財務狀況、整體狀況、「聯邦準備理事會」的政策、以及其他許多因素。走勢在歸類上確實有些主觀成份，但判斷的精確性卻關係重大。一個走勢，究竟屬於次級折返走勢，或是主要趨勢的結束，我們經常很難、甚至無法判斷。然而，此處與稍後章節的討論，將可以提供一些有效的助益。


    我個人的研究與李氏的看法相當一致，大多數次級修正走'
