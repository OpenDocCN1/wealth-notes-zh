  md: '# 第十六章


    # 克服謬誤的自尊


    > 自我認識……本身不是目的，而是一種釋放同時成長力量的工具。

    ——Dr. Karen Horney


    # 交易失敗最重要的理由


    思考交易者成功與失敗的原因時，最令我困惑的是人們竟然俱備如此可觀的自欺能力。我不瞭解某些優秀的交易員何以會在交易中違反明顯的交易法則。我不瞭解某些交易員何以不斷重覆相同的錯誤，而且永遠無法由錯誤中學習。我不瞭解某些明顯不快樂而甚至於悲慘的人，每天早晨起床，都必須再面臨不快樂與悲慘的一天，卻完全不嘗試思考究竟出了什麼差錯，當然更別提改變了。


    我知道這種現象的根源應該與自欺（self-deception）和合理化的藉口（rationalization）有關，但其嚴重的程度卻讓我心驚肉跳。探索這方面的問題時，我覺得有點無助。我幾乎閱讀心理學領域內的每一本書，試圖瞭解這方面的問題。後來，我發現Karen
    Horney的著作Neurosis and Human Growth（神經症與人類的成長）。①這本書讓我深入瞭解人類的自欺行為，我'
  merge: -1
  img_proc: true
- pgno: 418
  md: '有強烈的慾望將其中的內容與你分享。它不僅讓我瞭解自欺的觀念，並讓我進一步瞭解我自己的某些動機，包括正面與負面的動機在內。


    根據Horney博士的說法，每個人天生都俱備一組「既定的潛力」（given potentialities），而且我們有天生的慾望去實驗它們。換言之，我們天生都俱備「真正的自我」（real
    self），生命的宗旨便是透過自我發現（self-discovery）的程序，實現這個自我。然而，我們生存在一個不完美的世界中，所以「在內在呈現壓力的期間…個人可能會與真正的自我產生疏離。於是，他會根據內在指示的嚴格系統以大部份精力塑造自己，並讓自己成爲絕對的完美。


    他會塑造一種神格化的完美自我形象，並讓自尊陶醉在他認爲能夠或應該的境界中。」


    這種人爲的觀點成爲一位暴君，驅使人們在心智上重建現實，符合他自身、他與世界之間、以及他與其他人之間的理想化形象。結果使謬誤與逃避的系統不斷膨脹，使人們愈來愈不能夠辨識與接受現實。


    我將解釋的問題非常微妙，必須分別討論其中的基本觀念，它們組成一個龐大的虛幻系統——謬誤的自尊（false pride）——這種幻覺不時困擾著交易者。Horney博士在她的著述中詳細地說明謬誤自尊的系統，本章僅提出我認爲最相關的部份：理想化的自我形象（the
    idealized self-image）、追求榮耀（the search for glory）、應該的暴君（the tyranny of the shoulds）、以及神經性的自尊（neurotic
    pride）。在金融交易'
  merge: -1
  img_proc: true
- pgno: 419
  md: '與社會中，這些概念都非常普遍，所以它們對於自我認知（self-awareness）的瞭解有不可忽略的重要性，猶如先前的討論，自我認知是個人任何改變與成長的第一步驟，對於交易者更是如此。


    我認為，在金融圈內，自我認知的重要性遠勝過其他行業。我有明確的理由支持這項看法，你交易的時候，法官的鎚子每天都會敲在帳冊上。醫生可以掩飾自己的錯誤而告訴病患的親屬，「我已經盡力了，但…」律師在結婚的前一天晚上，可以徹夜喝酒，輸了官司的時候，他可以說服自己與客戶，陪審團的立場不公正。然而，一位交易者無法欺騙任何人，也無法說服任何人。市場是最後的審判者，每天都會下達判決。所以，我認為，對於一位成功的交易者、投機者或投資者來說，瞭解謬誤的自尊系統究竟如何運作，絕對有其重要性。


    # 你的邪惡雙生兄弟：理想化的自我形象


    你可以將「既定的潛力」視爲是核心的自我，它是生命希望實現的對象。不幸地，許多人經常追求一組謬誤的潛力，這是我們在自我發現的過程中，所賴以防範痛苦的工具。我們發展出一種雙重的自我，並使自己陷入內在的衝突中。一方面，核心自我——我們的生命應該如何的一種標準——始終存在，我們自然希望實現真正的潛力。然而，另一方面，我們卻發展出一lakuan?出一「邪惡的雙生兄弟」，試圖凸顯不切實際而理想化的潛力，破壞核心自我的成長。


    透過想像力，這位邪惡的雙生兄弟建立一座堡壘，防範我'
  merge: -1
  img_proc: true
- pgno: 420
  md: '們感知充滿敵意的現實。基於保護的緣故，「不知不覺地，好像力開始發揮功能，並創造出一個自我的理想化形象。在這個程序中，它讓自己俱備無限的權力與超凡的能力；它成為一位英雄、天才、情聖與神祇。」


    # 追求榮耀


    根據前幾章建立的心智模型，我們的行動是由潛意識中的價值觀與信念驅動。根據Horney博士的見解，如果人們採用一種自我的理想化形象以防範基本的憂慮②，則以模型來做合理的推論，人們會試圖把理想化的自我形象實際化。引用Horney博士的說法：


    …自我理想化不可避免地會演變為一種更廣泛的慾望，我建議稱它為…「追求榮耀」。自我理想化始終保持中心的地位。其中的其他成份，永遠都會呈現——雖然不同情況會有不同程度的力量與認知——對於完美與神經性野心的需求，以及一種報復性勝利的需求。


    完美的需要，這與大多數人都有關係。錯誤與痛苦是人生中必然的成份，這是最難以接受的事實之一。我要提出一個問題：「這為什麼如此難以接受？」


    我想這可能是因為它違反了理想化的自我形象。如果我們自認完美，我們應該不會犯錯，我們應該不會蒙受痛苦，我們應該能與任何人相處，我們應該可以說服每一個人，我們應該…。'
  merge: -1
  img_proc: true
- pgno: 421
  md: '應該，應該，應該。完美的需求反映出一組僵化的「應該」與「禁忌」，它們是理想化自我形象的必要條件。前一章的例子曾經提及一位交易員，他採用全然不切實際的標準評估成功。這類人可能便是受到理想化自我形象所主導。


    以交易員的身份來說，我有一項嚴重的弱點，它至少一部分是來自於完美的需要。在市場的主要轉折過程中，我經常稱自己為「完美主義者」。自從1971年以來，我僅錯失兩個主要的下跌行情，其他的行情走勢我都能精確判定轉折點。然而，如果誤判轉折點時，我總是非常不願意進場順勢交易，這是相當嚴重的缺點。例如，在1990年7月底，我正等待賣空的機會，在我還沒有建立部位之前，伊拉克的海珊突然攻擊科威特，使我措手不及。


    我看著價格一路挫跌，卻無法迫使自己在下跌的過程中進場賣空。如果我採取行動，至少可以獲得10％的利潤，但我並沒有這麼做…一旦錯失了高點，我總是擔心在低點賣空。


    另一個例子發生在1989年，我未留意商品市場某些的發展，並因此錯失了理想的買進或賣空機會，我對自己非常生氣。身為交易者，我確實應該留意市場的發展，但身為人類與生意人，我當時的注意力並沒有擺在市場中。然而，我無法接受這個解釋，並因為不是一位完美的交易者而對自己非常不滿。


    這兩個例子都說明追求完美的需求如何影響我們的生命。完美的需求是一種非常激烈的力量，我準備在「應該的暴君」'
  merge: -1
  img_proc: true
- pgno: 422
  md: '一節再做完整的討論。


    神經性的野心（neurotic ambition）——追求外在成功的強制性慾望——即是追求榮耀的一個層面，這種特質在「華爾街」尤其普遍。這個現象並不令人訝異，因為這類野心需要在競爭性的環境中受到滋潤，而「華爾街」極具競爭性。


    神經性的野心是試圖證明與實現非凡的個人特質。一個缺乏真正自信心的 人，將追求較高的地位，達成 Nathaniel Branden 所謂的「虛假的自尊」（pseudo
    self-esteem）。在神經上充滿野心的人，相信自己是天才或無所不能，他們需要以外在的成就證明自己。這種人為了將理想化的自我實際化，他們必須追求「最佳」，並被認為「最佳」。


    然而，由於追求的理想在本質上屬於想像與不可能，所以一切勢必徒勞無功。因此，這些試圖將理想化自我實際化的人，他們永遠無法停止追求。停止追求需要承認他們對於自己與對於世界的觀點錯誤。基於這個理由，神經上具有野心的人，特色之一經常是才華橫溢，他們追求的一切在性質上都屬於強制性，而且永遠無法真正體會個人的成就感。Ivan
    Boeskey 便是典型的例子。他以金錢——而不是自己的努力——購買成功，這並不是完全為了金錢，而是因為神經性的野心。


    神經性的野心以及對於成功與財富真正的需求，兩者之間經常有明顯的差異。這種差異反映在個人的動機上，以及在目標達成時的情緒反應上。對於神經上具有野心的人來說，生命不被視為是一種程序，而是通往不可能未來的途徑。行動僅是一種宣洩：「他們獲得更多的金錢、更崇高的地位、更大的權'
  merge: -1
  img_proc: true
- pgno: 423
  md: '勢時，他們也將感覺徒勞無益的衝擊。他們不會因此覺得心靈的平靜、內在的安全感或生活的樂趣。他們追求榮耀的魅影，卻無法平息內在的沮喪。」


    我說神經性的野心在「華爾街」尤其普遍，我並不是指大多數人都有追求外在成功的強制性神經慾望。然而，我相信金融圈內，許多人（尤其是交易員）都有強烈的神經性野心成份。


    「如果我富有，則我將很快樂。」每當我們閃過這個念頭時，那便是神經性野心在作祟。在這類觀念的表面之下，蘊涵著謬誤與理想化的信念，認爲如果我們富有，便會或能夠如何。「精疲力盡」（burnout）也是神經性野心的症候，尤其是過氣的成功交易者。追求榮耀的徒勞行爲終究會使人精疲力盡。我們的慾望是否或多寡來自於神精性的野心，這是自我認知重點之一；它會破壞我們享受人生過程的能力。


    就造成的傷害與痛苦來說，追求榮耀最嚴重的影響是對於報復性勝利（vindictive triumph）的需求。這個成份在大多數人身上並不非常明顯，但每個人多少都沾染這種色彩。Horney博士認爲：


    > 〔報復性勝利的需求〕可能和實現個人成就與成功有著密切關係，若是如此，主要的目標便是羞辱他人，或以自身的成功擊敗他人；或是取得權勢與地位使他人受苦——通常都是以羞辱的方式表現。另一方面，由於追求超凡入聖的境界僅是一種幻想而已，所以報復性勝利的需求在表現上便成爲是一種不可抵擋'
  merge: -1
  img_proc: true
- pgno: 424
  md: '而無意識的衝動，主要是在於挫敗或凌駕他人。我稱此為「報復性」，因為其動機來自於報復孩童時期所受的羞辱——這種衝動在後來的神經發展上又受到強化。


    在「華爾街」這部電影中，Gordon Gecko的特性便充分反映報復性勝利的需求。Gecko擁有龐大的財富與權勢，主要便是基於報復性勝利的需求。他並不是根據世俗標準而以金錢的多寡衡量成功與失敗。他是以操控市場的能力衡量成功，並在這個過程中傷害與控制相關的人。在這種衝動的驅使下，他將一位（在神經上）野心勃勃的年輕人納為羽翼，Gecko利用他摧毀任何妨礙理想化自我形象的敵人。


    進一步說明以前，我希望提出一點澄清，「華爾街」這部電影使我很生氣，因為它由謬誤的角度形容「華爾街」的運作方式。它暗示具有權勢的人們，尤其是在購併活動中，大多是陰險狡猾而充滿報復心理。「華爾街」確實有Gordon
    Gecko這種人，但並不普遍；成功的人一般仰賴的是能力，而不是寄生的行為。我在一個電視節目中聽說，「華爾街」作者Oliver Stone的父親是一位股票經紀人。作者如此污衊他父親的職業相當有趣。或許報復性勝利的需求便是他的動機根源，誰知道？


    雖然如此，在現實世界中，許多大企業內確實存在「政治性」的運作與「勾心鬥角」的活動，Gecko具體反映出這些成份。另外，他也具體反映一般人受到傷害時的報復心理。


    報復性勝利的需求，本質上是一種破壞性的衝動，會傷害自己與周遭的人。它經常以明目張膽的方式表現。例如，我曾'
  merge: -1
  img_proc: true
- pgno: 425
  md: '與一位交易員共事，他最心愛的一本書便是馬基維利（Machiavelli）所著的「君王論」（The Prince）；他每天都與這本書同枕共眠。我看著他利用同事間的友誼與信賴，迫使同事遭到解雇。我質疑他的道德觀時，他回答，「如果你希望在這個世界上高人一等，你就必須這麼做。」


    我並不認為，「追求榮耀」在每個人身上都是非常重要的衝動；我也不認為，這個世界上充滿這種無助的神經病態。然而，我確實相信，幾乎每個人身上多少都有追求榮耀的成份，並導致許多無謂的錯誤、失敗與痛苦；尤其是金融交易者。可惜，這些衝動都深深隱藏在內心而難以認知，並且混雜在健康的動機中。所以，我們必須能夠辨識來自於追求榮耀的動機。


    # 強制與想像


    就特質上來說，來自於追求榮耀的動機與健康的動機有兩點不同：一是強制性（compulsive）的特質，一是Horney博士所謂的「想像的特質」（imaginative
    character）。


    強制性的行為，是指其動機來自於規避錯誤感知的痛苦。根據Horney博士的說法：


    我們稱某種慾望為強制性，是指它不同於自然的（spontaneous）慾望。後者來自於真正的自我，前者是由神經結構的內在需求決定。為了避免憂慮、被人拒絕、罪惡感、衝突、以及其他類似的痛苦感受，個人必須壓抑真正的慾望、感受與利益，而遵照強制性慾望的指示。換言之，規避某種危險時，自然'
  merge: -1
  img_proc: true
- pgno: 426
  md: '與強制的差別，也就是「我希望」與「我必須」的差別。


    這項評論完全符合我們在第十四與十五章所提的腦部模型。我們雖然俱備意識上的意圖，卻經常受到內在動機所驅使，它們來自於潛意識中我們未認知的價值與反價值。在追求榮耀的過程中，我們被迫採取行動，並使理想化的自我形象免於受損。所以，我們受到追求榮耀的慾望驅使時，行為上將呈現一種特色：不顧自身的最佳利益，採取強制性的行為，追求榮耀的強制性特質，可以使人「漠視真理，而不論這項真理是關係自身、他人或單純的事實。」例如，我們在第十三章曾經討論交易者約翰，他認為債券價格「必須下跌」。他實際上的意思是：「我的判斷必須正確！」再舉一個例子，對於絕大部份人來說，他們關心「自己正確」的程度遠超過事實的真相。


    除了強制性以外，追求榮耀的想像力特質也頗值得重視。想像力（imagination）是一種美妙的能力。它使我們可以將自己投射至未來，在心智上可以重新整理現實中的對象，以設定目標，使它們具有可行性與意義。然而，如果我們的行為只是基於純粹的想像，則想像力是一種破壞性的工具。


    # 願望被視為是權利時


    理想化的自我形象與榮耀的追求，都是想像力的產物，而且唯有不斷透過想像力的運作，才可以維繫。以這種方式運用想像力，它將成為一種自欺與尋找合理化藉口的工具。事實上，在追求榮耀的過程中，我們是生存在虛渺的幻境。易受騙'
  merge: -1
  img_proc: true
- pgno: 427
  md: '的潛意識將虛浮的幻境視為現實時，願望將轉化為對於現實的請求權利（ wishes become claims on reality ）。


    前一章曾經提及，我們必須留意自己與自己的對話，尤其是對自己提出的問題。我建議你防範某些問題，例如：「這種事情怎麼會發生在我身上？他（她）怎麼可以這樣對我？這個世界為什麼這麼不公平？」不妨考慮這些問題的意涵。


    當你問，「這種事情怎麼會發生在我身上？」這是否意味你有權利要求更多，這是老天爺或命運欠你的？當你問，「他（她）怎麼可以這樣對我？」這是否意味著其他的人應該自動地瞭解你，並提供你需要的一切？這是否意味著其他人必須迎合你的需要？當你問，「這個世界為什麼這麼不公平？」這是否意味現實世界並不符合世界應該有的定義？


    我認為正是如此，我認為所有的意涵都顯示，願望已經被轉化為對於現實的請求權。這更反映出一種潛意識的信念，現實應該遵從你的需要，而不是你的需要應該回應現實、你的目標、以及個人感受的事實。


    所有被視為是權利的慾望，都具有一個特色，它們被視為是不受法則管轄的例外。它們就是不一樣；它們是少數真正瞭解愛、正義、人性……的人特有的權利。以交易員來說，他們雖然瞭解交易守則的必要性，但其「超絕的智慧」使他們得以不受限於交易守則。行情出現不利走勢時，他們會有強烈的不公平感受。


    將需求視為權利的人，不願意承擔失敗的責任，不願意處'
  merge: -1
  img_proc: true
- pgno: 428
  md: '理現實的問題，僅根據自身願望判定真理與謬誤、對與錯、敵與友。這種與現實全然無關的願望，將成為評估一切的標準。


    我在本章之初曾經說過，人們的自欺能力使我非常困惑。現在，對於旁觀者來說，我瞭解自欺深植於被視為權利的願望中——換言之，存在於追求榮耀所驅動的想像力中——這些人幾乎不能夠辨識真理與合理化藉口之間的差異。Horney
    博士認為：


    神經性的請求權利…是以自身之外的世界為對象：他嘗試主張一種例外的權利，這是他特有的權利。他覺得自己有權利不受任何限制而生活在虛幻世界中，他實際上認為自己超越一切。他無法維持理想化的自我時，他所俱備的權利使他可以將失敗的責任歸咎於外在因素。


    你與這類人交談時，不論你的見解多麼合理與具有說服力，即使費盡口舌，他們就是聽不見你的話，因為經過扭曲的現實會過濾他們的感知與認知。


    自欺並不是意識的抉擇，它是在潛意識系統內經過長期發展而成。在心智中，它被視為真理而受到周全的保護，唯有現實當面挑戰它時，人們才會覺得受到威脅。即便如此，他們還是會訴諸於理想化的思考模式，例如：「我還沒有達到那種層次，但總有一天，我到達完美境界時，我會得到應有的報酬。」


