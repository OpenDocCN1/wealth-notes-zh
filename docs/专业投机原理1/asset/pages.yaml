    - 羞辱

    - 尷尬

    - 生理的危險

    - 忿怒

    - 沮喪

    - 禿頭


    回答相關問題時，請留意不要把答案神聖化，下一章將處理這方面的問題。儘可能深入而誠實地回答問題。其次，將你的價值與反價值依重要性排列。這可以反映價值體系的排列架構，或其重要性的秩序。現在，開始分析檢討，觀察其中的一致性、衝突、侷限性的價值與積極的價值。結果可能會讓你相當訝異。'
