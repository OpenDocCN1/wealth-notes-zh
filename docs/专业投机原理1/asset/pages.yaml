- pgno: 149
  md: '# 圖7.13


    黃豆的月線圖——以長期的2B交易。這份黃豆期貨的月線圖，顯示數個長期的2B。在B點，價格未能正式突破A點的高價時，2B代表絕佳的賣空良機。在點2，價格未能正式突破點1的低價時，2B代表絕佳的買進良機。在點4，依據2B準則交易的長期投資者，至少會捻一次耳光而出場。然而，稍後你應該再建立多頭部位，就其隨後的價格走勢而言，先前認賠的金額並不算大。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_149_0.png)


    TQ 20/20 © 1991 CQG Inc.


    依據2B準則交易，如果市場出現不利的走勢，你必須當機立斷，即刻承認錯誤。例如，在當日沖銷的交易中，如果你根'
  merge: -1
  img_proc: true
- pgno: 150
  md: '據2B賣空，當價格再度回升穿越新高價時，你必須立即平倉出場。


    如果價格仍然未能正式突破高價，你可以再賣空，但必須限制自己的損失，並讓自己揹耳光出場。只要能夠迅速認賠，你便可以「留得青山在，不怕沒材燒」。就當日沖銷來說，2B準則的成功機會大約僅有50％，錯誤時，如果可以限制損失，正確時，讓獲利部位持續發展，你可以因此享有巨額的獲利。就中期與長期來說，2B準則的成功機會則遠較爲高。


    1989年10月13日的「道瓊工業指數」便出現典型的中期2B（圖7.14）。在10月9日，「工業指數」以低成交量創新高2791.40，但新高並未受到「運輸指數」的確認——明確的中期空頭徵兆。隨後的幾天內，行情不斷下滑，10月12日的收盤指數爲2759.80，距離9月1日的先前高點2752.10僅有7.3點的差幅。所有相關指數也呈現跌勢。2B準則在10月13日成立的可能性很高。後續的發展都已經是歷史了。在些許的利空消息影響下，大盤竟然在恐慌性的成交量下暴跌191點。


    # 測試的發生緣由與2B模式


    爲了瞭解這些模式發生的緣由，你必須知道交易所場內的情況。以商品交易所的場內爲例，它是由場內交易員與經紀人構成——前者爲自己的帳戶交易，後者以執行交易指令來賺取佣金。場內經紀人僅是爲客戶執行交易指令，但場內交易員則試圖掌握盤中的趨勢，並依據價格走勢操作。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 圖7.14


    道瓊工業與運輸指數，其中工業指數呈現中期的2B。運輸指數未確認新高點，更增加賣空的成功機會。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_151_0.png)


    TC) 20/20 © 1991 CQCG Inc.


    透過經紀人而由場外交易商品的人們，通常會採用停損單。所謂的停損單，是指設定的價位一旦被觸及或穿越，則以當時「市價」（at the market）買進或賣出。以S&P
    500期貨的交易為例，你可能告訴經紀人，「以356.20的停損價幫我買進五口3月份S&P期貨。」如果市場價格一度在356.10成交，隨後又回升至356.40，則場內經紀人將以當時的市價為你買進五口契約，因為你的停損價位已經被「觸及」（hit）。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '交易者經常會以停損單限制損失。例如，一位交易者以市價買進五口契約，隨後可能遞入另一張交易指令，在市場證明他為錯誤的價位，設定賣出五口契約的停損賣單。因為場內交易員每天都在「交易塾」（pits）打滾，優秀的交易員非常瞭解交易的心理與狀況——尤其是交易者如何設定停損點。在沒有重大新聞的情況下，停損點通常都會設定在先前的（重要或次要）高點或低點。


    由於瞭解停損點的位置，場內交易員與交易自己帳戶的經紀人，基於利益的考量，都希望把價格推動至「支撑水準」的稍下方或「壓力水準」的稍上方，迫使停損單成交。這稱為「清除停損」（taking
    out the stops）。在停損單清除以後，市場將重新調整。這便是大多數2B模式發生的原因，而且每一種市場都會出現這類活動。清除停損最常發生在短線的基礎上，但也同樣適用於中期與長期。在股票市場中，又涉及另一項相當微妙的特色。


    股票交易所的場內也有場內交易員與經紀人，某些場內交易員稱為「造市專家」（specialists）——他們負責某些特定股票的交易。他們根據「登錄簿」（book）交易——登錄簿上列出買、賣單的價位與數量。造市專家的工作便是為他所負責的股票「造市」（make
    the market）——以有系統的方式，撮合股票的買、賣雙方。


    一般來說，登錄簿上每一價位的股票數量都是數萬股，而「造市專家」每撮合100股便可以收取固定佣金，所以他們實際上是經紀人。基於自身利益考量，他們當然希望推動價格以促'
  merge: -1
  img_proc: true
- pgno: 153
  md: '使較多的單子成交，而且他們已經事先知道各個價位所掛的買、賣單數量，至少就他們自己的登錄簿而言是如此。


    某些精明的交易員認識場內的造市專家，並培養出一種感覺而可以根據造市專業的行為判定他們登錄簿上的大單子。對於這些交易員說，他們也有理由推動價格而使大單子成交。


    例如，假定在多頭市場的行情中，IBM 買-賣報價爲 110 1/8-1/4，所掛的股數分別爲 5,000 股。某位造市專家登錄簿中的買單情況爲：3/8 爲
    1 萬股，1/2 爲 2 萬股，5/8 爲 2 萬股。


    一位精明的交易員可能對於這位造市專家的登錄簿相當瞭解，於是他在 1/8 買進 5,000 股。其他交易員發現這種情況也隨後跟進，他們精確地判定這位造市專家在上檔的數個價位都掛有大買單。於是，場內對於
    IBM 便產生一種多頭的氣勢。成交量擴大，價格向上跳動，這位造市者的單子不斷成交，不僅賺進他的佣金，而且一路向上爲自己的帳戶買、賣而獲利，因爲他知道他不會發生虧損。交易員們不斷驅動價格，並一路獲利。當走勢的動能耗盡後，價格又回跌至原先的水準。


    造市專家的世界是一個微妙的世界。前文中，我說造市專家在漲勢中爲自己的帳戶買、賣而獲利，這項陳述或許並不精確。實際的情況是如此：Prudential 打電話給這位造市專家，「幫我買進
    100 萬股的 IBM。」這位造市專家說道，「喔! 你要買進 100 萬股。真巧合，我也是。」於是，他與 Prudential 一起買進 IBM。


    每當他買進 1 萬股，自己分 5,000 股，Prudential 分 5,000'
  merge: -1
  img_proc: true
- pgno: 154
  md: '股。現在，猶如我先前的描述，IBM 將蘊釀出多頭的氣勢。然而，他與Prudential 不同，後者是買進而持有，造市專家則是買進股票以推動股價；換言之，他買進股票，但股價向上跳動時又反手賣出，而且他知道他的操作必然成功，因為買單已經掛在他的登錄簿。所以，造市專家的行業可以代代相傳而不會消失；這是金融市場中最沒有風險的賺錢行業。


    顯然地，賺錢雖然可以，但造市專家不可以不負責任。如果他們僅顧自己推動價格，完全忽略客戶的利益，他們將因此失業。此處希望強調的重點是：價格走勢圖中的明顯模式，主要都是來自於交易所場內的專業活動。


    討論2B 模式與發生的緣由時，我們假定市場並沒有出現重大的新聞，或個股的基本面沒有發生重大的變化。在沒有配合專門知識的情況下，單獨依據2B 交易，可能涉及相當的風險，尤其是商品市場，因為它們對於消息面的變化非常敏感。然而，如果在最廣泛的知識配合下，這項準則可以為投機者帶來可觀的獲利。


    # 次級修正走勢的ABC三波浪


    根據我個人的看法，「艾略特波浪理論」太過主觀，不適合運用於專業的投機活動，但其中有一項觀點則非常有助於判斷多頭與空頭市場次級修正走勢的頭部與底部。「艾略特波浪理論」認為，市場價格走勢會遵循周而復始的波浪模式。在這些模式中，艾略特提出如圖7.15
    的A-B-C 三波浪走勢。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 圖 7.15


    次級修正走勢的ABC三波波——多頭市場（上圖）與空頭市場（下圖）次級修正走勢的典型三波浪模式。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_155_0.png)


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_155_1.png)'
  merge: -1
  img_proc: true
- pgno: 156
  md: '不論在多頭或空頭市場中，次級修正走勢幾乎都呈現這種模式。此模式中的另一項特色，是BC浪的成交量會萎縮。一般來說，這種走勢必須配合其他重要指數的確認才有效。請留意，如果市場中出現重大的消息，上述模式可能被破壞。如圖7.15所示，在多頭市場次級修正走勢的C點，價格可能測試或向下突破A點的價位。空頭市場也有類似的情況。顯而易見地，如果你可以判定C點何時出現，則是做多（多頭市場）或賣空（空頭市場）的良機。


    在多頭市場次級修正走勢的BC浪中，價格向上突破BC浪的下降趨勢線時，是建立投機性部位的理想機會，但有一個先決條件：在BC浪的跌勢中，成交量必須縮小。停損點應該設定在A點與C點的較低價位，因為任何法則都有可能失敗。


    價格突破BC浪的下降趨勢線時，如果成交量並沒有明顯的變化，形成底部的可能性並不大。反之，如果突破時出現大量，突破走勢非常可能不是代表空頭的修正，而應該是主要多頭市場的第二支腳，當然這還需要基本面的配合。


    # 摘要


    投機的藝術是在中期趨勢中買進與賣出股票、債券、外匯、商品、以及其他交易工具。最理想的長期多頭部位，是建立在中期下降趨勢底部的附近，這可能是空頭市場的結束，或多頭市場次級修正走勢的轉折點。反之，最理想的長期空頭部位，是建立在多頭市場的頭部或空頭市場中期修正走勢的頭部附近。'
  merge: -1
  img_proc: true
- pgno: 157
  md: '如果你運用上述方法做為初步的篩選標準，可節省許多時間與精力。一旦熟悉這些準則後，你只要瀏覽圖形，便可以很快地整理出適合買賣的證券、期貨、以及其他交易工具，並剔除許多太過模焉兩可而不適合投機的對象。經過初步的篩選，你可以由較廣的角度做進一步的研究，並挑選報酬潛能最高而風險有限的對象，並實際的投機。下一章將討論另外一些技術分析的指標，它們可以協助你擬定投機決策。


    # 附註：


    +   ① 這類資料可以在大型書店或金融書籍的專賣店中找到適當的書籍。"Series 7"的初級讀物是相當不錯的起點，可以讓你概略瞭解金融市場的運作機制。關於保證金的問題，則可向你的經紀人查詢。
    ② 我說「相當於」，因為「道氏理論」僅處理股票指數的主要趨勢與次級修正走勢中的趨勢變動，此處的定義則適用於所有市場。 ③ 在交易所的場內，記錄員會觀察場內的活動，新價格成交時，他們會輸入新資料，並傳輸至場內與全球各地的報價螢幕上。在「快市」中，記錄員無法跟上價格的變動，所以螢幕的報價無法精確反映價格的變動。'
