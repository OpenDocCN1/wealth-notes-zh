  md: '# 動能指標（震盪指標）


    運動中的物體具有一種稱爲動能（momentum）的性質，你可以稱它爲物體的運動量（the quantity of motion of an object）。動能實際上是代表質量（mass）與速度的乘積。以搖動中的鐘擺爲例，它的動能不斷變化，若以時間做爲水平軸描繪動能，其形狀便如圖8.11所顯示。


    圖8.11


    以時間爲基準繪製鐘擺的動能。鐘擺的動能是以基線爲準而上下震動。你可以發現，這種模式與金融市場的動能震盪指標非常類似。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_176_0.png)'
  merge: -1
  img_proc: true
- pgno: 177
  md: '市場也具有動能，雖然它並不符合物理學上的嚴格定義。你可以將鐘擺動能的模式，視為是一種理想化的市場行為，價格以某點為中心而上下震盪，而價格變動的速度始終不斷變化；在圖形中，頭部與底部的反轉，則對應市場的頭部與底部。


    然而，鐘擁有固定的質量與變動的速度，市場動能的質量（成交量）與速度（價格變動率）都不斷變化。此外，還有一些外來的干擾力量，例如：政治上與經濟上的重大新聞，都可以隨時改變市場的動能。


    所以，我們無法以精確的方式衡量市場的動能，也無法利用它精確地預測市場未來的轉折點。然而，我們可以尋找一些高度相關性的市場動能，協助預測價格趨勢的變動。這類的最佳指標稱為「震盪指標」（oscillators）。


    「震盪指標」這項名詞目前已經是一種標準化的金融術語，根據我的瞭解，它最初出現於 Profits in the Stock Market，這是 H. M. Gartley
    在 1935 年的作品。猶如移動平均與相對強度一樣，震盪指標也有許多不同的計算公式，但這些公式之間都有共通的性質，它們都是衡量市場參數（parameter）在某期間內之差值。因此，它們是衡量重要市場參數的變動率（the
    rate of change），這些參數可以是價格、行情寬度（breadth）、移動平均、成交量、……；它們會以基線為準上下震盪，就如同鐘擺的動能一樣。


    在股票市場中，我採用兩種震盪指標——分別以行情寬度'
