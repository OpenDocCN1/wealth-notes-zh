- pgno: 129
  md: '# 第七章

    創造財富的契機：

    辨識趨勢的改變


    金融市場中最迅速而安全的賺錢方法，是儘早察覺趨勢的改變，建立部位（多頭或空頭），順著趨勢前進，並在趨勢反轉之前或之後不久，了結你的部位。任何市場的專業玩家都會告訴你，在低點買進而高點賣出（或是在高點賣空而低點回補），這僅能仰賴運氣的眷顧；但經過適當練習之後，你非常可能掌握中期或長期走勢的60％至80％。


    為了辦到這點，你首先必須知道有那些不同的市場，有那些金融工具可供交易，如何與在那裡交易，保證金的規定如何，以及其他類似問題。①瞭解這些相關知識以後，接著你需要以某種方法尋找俱備理想投資機會的市場。


    就此來說，你可以到圖書館，花費三、四年的時間研究全世界的所有市場，完成研究時，你已經忘記你所學習的大部份內容。另一種可行的方法，是學習如何觀察圖形。


    對於一位有經驗的市場玩家來說，如果希望在眾多的市場中，挑選潛在的買、賣機會，觀察價格走勢圖是最單純而有效的方法。學習一些簡單的技巧以後，你可以在一個小時內，瀏'
  merge: -1
  img_proc: true
- pgno: 130
  md: '覽兩、三百副圖形，並由其中篩選較理想的對象。然後，經過進一步地評估以後，你可以挑戰五至十個值得研究的市場。你在篩選圖形時，你是觀察個股、指數、商品是否存在趨勢變動的徵兆。


    前一章中，我曾經嚴厲批評技術分析的某些觀點，但我也表示技術分析是一種不可忽略的投機工具。現在，有關趨勢變動的判定，我希望提出一種我最心愛的方法。我之所以偏愛它們，基於一個理由：長久以來，它們為我創造穩定的獲利。它們非常簡單，很容易記憶，經過相當的練習以後，你甚至於不用鉛筆便可以判斷圖形的內容。


    根據圖形解釋資料——辨識價格模式，並推測未來的價格走勢——屬於技術分析的領域。如果你閱讀有關技術分析的書籍，你將發現無數的價格模式：三角形、頭肩排列、狹幅盤整、楔形、空頭旗形、多頭旗形、七山（7
    mountains）、… …。我僅選用其中可以歷經時間考驗的模式，並將我的技術方法維持在最簡單而根本的範圍內。


    我將我的技術性觀察分為兩大類。第一類包括本章內容，是處理趨勢與趨勢變動的根本原則；我在市場建立任何部位之前，都非常仰賴這部份內容的協助。第二類將在下一章中解說，它們是判斷趨勢變動的輔助性工具；我的市場決策會根據情況斟酌這部份因子。


    本章中列出的方法，來自於我對於「道氏理論」的瞭解，以及我個人多年來評估市場趨勢與轉折點的經驗。猶如「道氏理論」一樣，這些方法並不是完全沒有錯誤的可能性，它們扮'
  merge: -1
  img_proc: true
- pgno: 131
  md: '演的角色，僅是一個更廣泛預測結構中的輔助性工具而已。這套方法有一個優點，它們可以毫無例外地適用於每一個市場：股票、指數、商品與債券。根據它們判斷，正確的機會遠多於錯誤；在適當的運用下，一旦決策發生錯誤，它們也可以讓你迅速認賠。


    利用走勢圖擬定投機與投資的決策，這俱備兩項經常為人忽略的重要優勢。第一，對於大部份人來說，運用視覺思考較為簡單。第二，在走勢圖上設定明確的進場與出場點，你較可避免巨額輸贏時的情緒性壓力。


    務必記住，運用走勢圖擬定決策，技術上的一致性在長期中最為理想，中期稍差，而短期的變化情況最嚴重。走勢圖中之所以存在模式，是因為市場參與者對於類似的情況會產生類似的反應。就心態上來說，投資者與投機者並不相同，但他們之間有許多共通之處；這些共通性質將反映在走勢圖的模式中。然而，盤中的短線交易者是根據截然不同的法則交易，因此他們產生的模式必須另外考慮。我們必須感謝盤中交易者的存在，因為他們為投機與投資行為提供不可或缺的市場流動性；除了提供流動性以外，他們的行為對於中期與長期趨勢幾乎沒有什麼影響。


    走勢圖的判讀方法，雖然屬於「技術性」的觀察，但這是就最廣義的角度而言；換言之，它們在視覺上呈現人類行為的特質，而這些特質重複出現於市場價格走勢的歷史紀錄中。


    # 如何決定趨勢——繪製趨勢線'
  merge: -1
  img_proc: true
- pgno: 132
  md: "根據先前數章的講解，我們已經知道何謂趨勢。讓我們再複習一次；趨勢是某特定期間內，價格走勢的方向。在上升趨勢中，價格持續上漲而中間夾雜著暫時性的下跌走勢，但下跌走勢的低點不會低於前一波跌勢的低點。下降趨勢則相反——價格持續下跌而中間夾雜著暫時性的上漲走勢，但上漲走勢的高點不會高於前一波漲勢的高點。在圖形上，趨勢呈現鋸齒狀的模式；就上升趨勢而言，價格將持續創新高，其間所夾雜之回檔走勢的底部也不斷墊高；就下降趨勢而言，價格將持續創新低，其間夾雜之反彈走勢的高點也不斷下滑。\n\
    \n分析趨勢時，趨勢線是最有用的工具。不論業餘或專業的市場玩家經常觸犯一項嚴重的錯誤：趨勢線的定義與繪製，在方法上缺乏一致性。若希望趨勢線能夠發揮功能，必須精確反映趨勢的定義。我設計的方法非常簡單，而且具有一致性。它同時符合「道氏理論」中對於趨勢的定義，以及該理論對於趨勢變動的推論：\n\
    \n+   1. 選擇考慮的期間：長期（數個月至數年）、中期（數個星期至數個月）、或短期（數天至數個星期）。在既定的期間內，如果趨勢線的斜率變動非常明顯，可能同時存在數條趨勢線。\
    \  \n2. 上升趨勢線：在考慮的期間內，以最低的低點為起點，向右上方繪製一條直線，連接最高之高點前的某一個低點，而使這條直線在兩個低點之間未穿越任何價位（圖7.1與7.2）。延伸這條直線而經過最高的高點（譯按：這是指水平軸上的位置而言）。當趨勢線經過所考慮最高之高點後，它可能"
  merge: -1
  img_proc: true
- pgno: 133
  md: '穿越某些價位。事實上，這是趨勢發生變化的一種現象，稍後將討論這方面問題。


    3. 下降趨勢線：在考慮的期間內，以最高的高點為起點，向右下方繪製一條直線，連接最低之低點前的某一個高點，而使這條直線在兩個高點之間未穿越任何價位。延伸這條直線而經過最低的低點（圖7.3與7.4）。


