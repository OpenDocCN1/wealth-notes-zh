  md: '引：神經性的自尊。


    # 真實的自尊/謬誤的自尊


    真正的自尊是一種成就感，它來自於達成自我實現過程中建立的價值。神經性的自尊是一種虛幻的成就感，它來自於達成一種或數種的內部指令。


    神經性自尊是人無法改變的根本原因，令人停留在悲慘的境地，而非常諷刺地，這也提供他們繼續向前的動力。人們試圖以「應該」的成就，取代真正的價值成就，便會產生謬誤自尊的結果。這是一種特殊的感覺，它來自於理想化的自我與想像的潛能。


    然而，核心的自我始終存在。它不斷提醒我們，追逐竹桿上綁著的紅蘿蔔並沒有任何意義。如果我們希望達成生命中期待的結果，追求的價值與目標必須反映真實的自我，以及我們與世界的關係。我們需要學習傾聽自我的聲音，當它說：「這裡出了差錯」，我們必須掌握這稍縱即逝的機會。


    如果你缺乏動機達成目標；如果你認為命運欠你某些特殊的待遇；如果你認為達成目標並沒有意義；如果你覺得與自己之間產生疏離；如果你發覺我在本章討論的某些情況適用你；則你必須在最基本的層次上自我挑戰，並質疑自己最深層的動機。若是如此，你將發覺謬誤的自尊系統在運作著。


    你有能力克服謬誤的自尊。最困難而首要的步驟，是體認它的存在。挑戰謬誤的自尊，割捨理想化的自我形象。拋棄應'
