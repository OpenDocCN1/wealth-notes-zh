- pgno: 170
  md: 'Rhea）提出，這是刊登於1932年Barron’s雜誌的一篇文章中。當時，他並沒有採用「相對強度」的名詞，而稱此為「股票的習慣與相互對照的績效表現」。相對強度（relative
    strength）是一支股票與一群股票或大盤指數之間的比率關係，這種關係也可以存在於一群股票與另一群範圍更廣的股票或大盤指數之間。


    猶如移動平均一樣，相對強度也有許多不同的計算公式。在某些圖譜中，相對強度的計算較注重最近的價格資料。以 New York Stock Exchange Daily
    Graphs為例，每支股票都附有相對強度線，它是以週為單位來表示個股價格與S&P 500 指數之間的比率關係；除此之外，還有另一種根據時間加權的相對強度指標，它比較個股價格變動率與資料庫內股價變動率之間的關係，並給予每支股票一個介於1至99的數據（參考圖8.7）。以52為例，這代表這支股票的價格表現超過資料庫內其它52％的股票。④


    相對強度的觀念或許有些難以瞭解，因為我們是處在一個以消費者為主的環境內。當我們還小的時候，我們發現父母親都是在大減價的期間採購，我們本身也維持類似的傳統；我們希望在低價買進，在高價賣出。


    例如，假定你喜歡吃柑橘類的水果，如果你在水果店裡發現，橘子與葡萄柚的價格都是每磅50美分，你可能各買一些。一個星期以後，你再到這家店裡，卻發現葡萄柚的價格突然漲價為每磅一美元，橘子仍然是50美分，你可能僅願意買橘子，而等待葡萄柚的價格下跌。如果你以這種心態購買股票，你通'
