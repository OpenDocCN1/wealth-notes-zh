- pgno: 239
  md: '第一，他授權Law成立一家新公司，它擁有唯一的特權在「路易思安那特區」（Louisiana Territory）交易，這包括整個密西西比河西岸在內，當地蘊藏大量的黃金與白銀。這家公司發行20萬股的股票，票面金額為每股500銀幣（livres），購買者可以根據公債（billets
    d’etat）的面額抵繳股款，雖然公債當時的交易價格約僅面額的16％。


    第二，攝政王將Law的銀行改為國有銀行，並稱為「法國皇家銀行」（Royal Bank of France）。在隨後的幾年內，攝政王發行十幾億銀幣的紙鈔，他顯然不明白這項政策的後果。我們不知道Law當時是否同意這項政策，但銀行在他的管轄期間內，紙幣的發行量從來不曾超過6,000萬銀幣。


    十多億銀幣的紙鈔並不是在法國街頭散發，而是以放款的方式發行。換言之，以通貨膨脹方式發行的紙幣，造成大量而快速的信用擴張。除此之外，政府又以另一種方法回贖仍然流通在外的公債，攝政王又下令重鑄銀幣，人民可以拿舊有的4,000銀幣，再加上1,000銀幣面值的公債，交換重量較輕的5,000新銀幣。


    信用擴張立即的結果是投機性的繁榮。商人們大量舉債而買進國內、外 bề商品，國內產業大幅擴張，進口增加，建築業熱絡（尤其是巴黎近郊）。在這次繁榮期中，最閃亮的明星是Law的「密西西比公司」（Mississippi
    Company）。Orleans公爵授權該公司擁有唯一的特權在印度、中國、南海與「法國東印度公司」的所有屬地交易。公司也改名為「印度公司」（The Company
    of the Indies），Law立即發行5萬股新股票，'
  merge: -1
  img_proc: true
- pgno: 240
  md: '每股為500銀幣，購買者可以根據公債（billets d’etat）的面額來抵繳股款，而且承諾每年發放每股200銀幣的股息。


    新股票的發行立即造成投機的熱潮。民眾相信Law是金融奇蹟的創造者，數以千計的人在他的住宅外排隊等候，試圖購買價格每天不斷上漲的股票。攝政王目睹這種熱烈的反應，認為這是回贖所有公債的良機，於是又授權再發行30萬股新股票，每股價格5,000銀幣，購買者還是可以根據公債的面額抵繳股款。


    你可能認為發行如此巨量的股票，必然會澆熄瘋狂的投機熱潮。事實上並非如此。在信用擴張的煽火助威下，新股票的價格在幾個小時內便上漲10-20％。馬夫與女佣可以一夜致富，人們普遍認為這種神奇的繁榮可以永遠持續下去。非常令人訝異地，紙鈔的信用竟然維持了數年之久，但支持紙幣的黃金與白銀逐漸而穩定地流往國外。


    猶如所有信用驅動的繁榮一樣，以通貨膨脹方式發行紙幣，導致法國的物價普遍上漲，國外產品的價格相對低於國內。隨著進口的增加，出口的差額必須以硬幣結算，所以國內的黃金與白銀存量不斷減少。另外，有些人知道，「皇家銀行」的黃金與白銀準備金僅是紙幣流通數量的一小部份，他們悄悄地把紙幣兌換為銀幣，並移往國外的銀行。


    1720年，銀幣嚴重缺乏，以至於無法正常對外貿易，因為對外貿易必須以硬幣結算。為了防止人們儲藏黃金與白銀，政府首先宣佈銀幣對紙幣貶值5％，隨後又將貶值的幅度增加至10％，並規定銀行的硬幣付款不得超過100銀幣價值的黃金與'
  merge: -1
  img_proc: true
- pgno: 241
  md: '價值10銀幣的白銀。


    上述禁令使政府得以暫時渡過危機，直至Law 在1720 年2月又犯下一個致命的錯誤。在他的建議下，政府宣佈禁止任何人持有500銀幣價值以上的硬幣，並禁止民間儲藏貴金屬、寶石、銀器、…，若違反規定，不僅處以重罰，而且沒收收藏物。這項法令使得一些貪污的官吏們可以混水摸魚，以一半的價值出售沒收品。相關措施不僅沒有恢復人們對於紙幣的信心，反而徹底瓦解大眾的信心，並將法國推往革命的邊緣。


    1720 年5 月20 日，銀行終於停止支付硬幣，與Law 有關的股票價格劇挫。泡沫破裂，金字塔崩坍，我相信這是股票歷史上的第一次崩盤。「印度公司」的股票價格狂跌；雖然政府盡全力挽救，但紙幣對黃金與白銀的價值一路下滑。商業活動完全陷於停頓，政府的每一項措施都僅使問題更加惡化。Law
    曾經被視爲是法國榮耀的救星與英雄，現在卻成爲代罪羔羊而幾乎被忿怒的群眾謀殺。最後，他被迫離開法國，幾乎沒有帶走任何他曾創造的巨額財富。


    於是，法國成立一個緊急委員會，試圖恢復金融體系的秩序。經過查證以後，他們發現政府公債的金額不僅沒有減少，反而增加至31 億銀幣（livres）。他們又發現政府財政官員的腐敗程度非常嚴重，某些官員被終生監禁於巴士底監獄（Bastille）。最後，經濟秩序與政府償付能力終於稍有改善，但猶如歷史所顯示地，相同的錯誤不斷重演，造成人民的生活艱困，貴族與勞動階層的貧富差距也愈來愈大。這些與其他問題終於導致「法國大革命」的爆發，以及拿破崙的執政。'
