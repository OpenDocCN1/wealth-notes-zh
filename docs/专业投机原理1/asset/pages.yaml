    請留意，整體存款機構的準備金資產（現金與中央銀行的準備金存款），恰好等於準備金負債的10％（支票存款的10％）。這個時候，銀行體系創造貨幣的能力已經發揮至極限了。如果銀行增加新的放款，放款將成為支票存款，並使銀行體系違反10％的法定準備規定。


    假定中央銀行認為，ABC目前的失業率太高，決定增加貨幣供給，刺激經濟景氣，創造新的就業機會。'
