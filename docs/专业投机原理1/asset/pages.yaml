- pgno: 76
  md: '是人類，所以市場參與者也不可能永遠正確地預測他們的行為。我們可以提出一個典型的例子，1984 年7 月24 日「聯邦準備理事會」主席Paul Volcker
    宣佈，Fed 採用的緊縮性貨幣政策並「不恰當」。在預期銀根將轉鬆的情況下，股票市場當天的指數成為低點，並展開一波新的多頭行情。


    # 假設3：


    這項理論並非不會錯誤（The Theory Is Not Infal- lible）：「道氏理論」並不是一種萬無一失而可以擊敗市場的系統。成功利用它協助投機行為，需要深入的研究，並客觀地綜合判斷。絕對不可以讓一廂情願的想法主導思考。


    股票市場由人類組成，人類都會犯錯。幾乎在每一筆股票交易中，如果某一することで正確，另一方便錯誤。雖然市場指數是代表一種淨結果，或市場參與者對於未來判斷的「集體智慧」；但歷史告訴我們，數以百萬計的人們也像個人一樣會犯錯，股票市場當然也不例外。然而，市場有一項特性，它允許參與者迅速修正他們的錯誤。任何分析方法若認為市場不會犯錯，顯然是最根本的錯誤。


    「效率市場理論」（the theory of efficient markets）便是一個典型的例子。它的主要論點是，電腦普遍化後，資訊的傳播非常迅速而有效，所以任何方法都無法擊敗市場。它僅是將「道氏理論」的一項主張做無限的延伸——「市場指數會反映每一項資訊」。這實在是無稽之談。「效率市場理論」認為，'
  merge: -1
  img_proc: true
- pgno: 77
  md: '每個人會同時取得每一項重要的資訊。這是相當荒謬的假設，因為每個人對於「重要」的定義未必相同。即使每個人確實可以同時取得每一項重要資訊，但每個人還是會根據自身的環境與偏好反應。如果每個人掌握的資訊都相同，而且反應也相同，則市場根本就無法存在。務必記住，市場的存在是為了促進交易，交易之所以會產生，是因為參與者對於價值的偏好與判斷不相同。④


    市場指數具有預測能力，是因為它在統計上代表一種市場的共識，這項共識是以鈔票表達。終究來說，價格取決於人們的判斷與偏好。如果你問場內交易員，今天的價格何以上漲，很多人可能會半開玩笑的答道，「因為買進多於賣出。」這個回答的真正意思是，「我不知道為什麼，但場內資金所代表的市場主要看法認為，價格應該上漲。」


    投機者的基本工作是辨識主要的影响因素，它們會驅動或改變市場參與者的主要看法，而市場指數是這方面的最理想工具，因為它會反映大眾對於金融事件的看法。所謂的金融事件，涵概蓋面極廣，包括：政治與經濟的發展、科技的創新、服飾的流行趨勢、乃至於某家公司的盈餘展望。由於上述程序僅能在歷史範疇內進行，所以你頂多可以辨識過去的重要因素，並以此預測未來。某些因素在整個歷史上始終有效；一般來說，基本因素牽引的看法，變動相當緩慢。經過適當的研究後，你可以抽取這些基本的因素，並根據它們精確地預測未來。


    根據Hamilton 的說法，市場指數是經濟預測的氣壓器。在'
