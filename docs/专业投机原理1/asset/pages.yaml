- pgno: 69
  md: '生的原因，但可以顯示變動產生前的徵兆。它無法告訴你未來勢必如何發展，但可以提供未來較可能的發展概況。猶如 William Peter Hamilton
    ①所說，「道氏理論是一種根據普通常識推論的方法，由市場指數每天的價格波動記錄，預測未來的市場走勢。」


    # 好觀念經常被誤解


    我們一般所稱的「道氏理論」，是 Charles Dow（道氏）、William Peter Hamilton 與 Robert Rhea（李氏）等三人共同的研究結果。道氏是「道瓊公司」（Dow
    Jones & Company）的創辦人，也是「華爾街日報」的創辦人之一，並在1902年過逝以前擔任該報編輯。他首先提出股票指數的觀念，於是「道瓊工業指數」在1895年誕生。1897年他又提出鐵路股指數，因為他認為這兩項指數可以代表兩大經濟部門的生產與分配。


    道氏希望以這兩項指數做為經濟活動的指標，他本人並未利用它們預測股票價格的走勢。1902年過逝以前，他雖然僅有五年的資料可供研究，但他的觀察在範圍與精確性上都有相當的成就。


    道氏本人並未將他的觀點組織為正式的經濟預測理論，但他的朋友 A. J. Nelson 卻試圖這麼做，並於1902年出版 The ABC of Stock Speculation
    一書。Nelson 將道氏的觀點正式稱為「道氏理論」。


    William Peter Hamilton 在道氏的指導下研究，他是當時「道氏理論」最佳的代言人。道氏過逝後，Hamilton 在1903年'
