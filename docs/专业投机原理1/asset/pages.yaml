- pgno: 74
  md: '市場價格不會像汽球一樣地在風中到處飄盪。就整體價格而言，它代表一種嚴肅而經過周詳考慮的行爲結果：眼光深遠而消息靈通的人士，會根據已知事件或預期不久將發生的事件，調整價格。③


    就目前的情況來說，這項假定需要稍加修正。不僅適用於「道瓊工業指數」與「道瓊運輸指數」而已，任何主要的市場指數都適用這項假設，包括：債券、外匯、商品與選擇權在內。


    有關市場指數所俱備預先反映或經濟預測的功能，並沒有什麼神秘之處。投資者（長期持有證券與其他交易工具的人們）會利用股票市場與其他交易場所，將資本分配至他們認爲最有利的個別股票、商品、以及其他金融交易工具。他們會根據過去績效、未來展望、個人偏好、以及未來的預期等因素來做評估，然後配置他們的經濟資源。結果，最能夠預測未來消費者（這是指最廣義的消費者而言，包括：資本、批發與零售市場的消費者）需要情況的投資者與企業，他們將可以生存，並獲得最多的利潤。正確的投資將獲得報酬，錯誤的投資將蒙受損失。


    透過金融市場，投機者與投資者的行爲結果，通常會擴張有利的活動，侷限不利的活動。他們的行爲無法改變過去的事實，也無法解決既有資本財轉換性（convertibility）有限的問題，但他們通常確實可以防止劣幣驅逐良幣的現象。市場指數的變動僅是反映這種程序。'
