    ⑨ 過去，我們的政府政策是以通貨膨脹為手段，促進暫時性的景氣。然而，隨著經濟的成長，不斷膨脹的貨幣供給將反映在物價水準中，實質盈餘與儲蓄的成長將減少。人民開始瞭解，通貨膨脹只不過是未來的稅負；所以，通貨膨脹成為人們最關切的問題，而政客們當然也會反映。於是，「聯邦準備理事會」開始收縮信用，而信用高度擴張的經濟現象就如同骨牌般地崩潰。現在，我們大有為的政府以預算赤字的方式代理通貨膨脹，將未來的盈餘用於目前的消費，這是一種無法持續的行為。揭露偽裝的外衣，這兩種手段的長期淨結果完全相同。

    ⑩ 以1987年的崩盤為例。崩盤後，「道氏理論」從來沒有產生明確的買進訊號。當時的跌勢非常突然而猛烈，許多人受到嚴重傷害而不希望再投資。唯有基於經濟基本面的長期考量，人們才會再度進場投資。'
