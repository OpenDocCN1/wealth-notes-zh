  md: '# 第八章

    失敗可能來自於

    分析報告未提供的資料


    # 鯷魚的資料有何重要性？


    我非常倚服某些分析報告的周詳內容——嚴謹的研究，並由各種角度判定「市場價值」。無疑地，分析報告中包含許多有趣的資料，某些報告的推理健全，文筆流暢，而且極具說服力。然而，你知道嗎？許多年以來，我已經不再閱讀任何分析報告了！


    我對市場專業者發表演講時，我經常在開場白中提出一個問題：


    > 「如果秘魯沿岸的海潮向外移動，你應該買進或賣出黃豆？」


    一般來說，聽眾的反應是：「我原本以為這傢伙很棒，但他究竟在說些什麼？」


    然後，我會解釋，海潮向外移動時，秘魯沿岸的鯷魚便會隨著海潮移往太平洋的外海，所以鯷魚的捕獲量將減少。鯷魚主要是供日本人飼養牛隻，鯷魚的產量減少時，日本人便會以'
  merge: -1
  img_proc: true
- pgno: 160
  md: '黃豆做為飼料。黃豆的需求增加時，黃豆與黃豆粉期貨的價格也會上漲。因此，秘魯沿岸的海潮向外移動時，你應該買進黃豆。


    這個時候，我通常已經可以掌握聽眾的注意，但仍有一些人表現出一副「那又怎麼樣？」的態度。這個故事的重點並不是強調：你必須觀察秘魯沿岸的海潮，才可以有效地事交易黃豆。重點是：從事交易時，你沒有必要知道每一項可以被知道的知識。事實上，你不可能知道所有的相關知識；如果你根據特定市場的知識交易，則你很可能因為一件你不知道、或未曾考慮的事件而失敗。換言之，失敗可能來自於分析報告未提供的資料。


    猶如Peter Lynch在One Up on Wall Street一書的解釋，通常識總是勝過無數的報告與數據。然而，我與Peter Lynch的看法有一點不同，我認為如果你知道自己在尋找什麼，市場可以提供你需要的大部份知識。特定來說，有一些重要的技術指標，它們正確的機會大於錯誤，而且在我的交易生涯中，它們都歷經各種考驗。


    隨意翻閱Edwards與Magee所著的Technical Analysis of Stock Trends，在短短五章內，我便發現20多種不同的技術排列模式。我非常尊崇Edwards與Magee，以及他們的經典作品，但我並不建議以這些複雜的技術模式做為交易的主要工具。然而，適量的技術分析工具卻可以提供有效的助益，因為它們可以輔助我們判定任何交易中的潛能與陷阱，尤其是在股票市場中。我稱它們為「輔助性」的工具，因為我絕對不會僅'
  merge: -1
  img_proc: true
- pgno: 161
  md: '根據它們從事任何交易。相對上，它們是告訴我「不可以做什麼」，而不是「可以做什麼」。


    我最經常使用的輔助性技術工具爲：


    +   1. 移動平均（moving average）

    2. 相對強度指標（relative strength indicators）

    3. 動能指標（震盪指標）（momentum indicators [oscillators]）


    猶如我先前所說，唯有你掌握有利的勝算時，才投入資金，這便是投機的藝術。這些輔助性技術工具可以協助你衡量勝算。在我知道的所有技術分析指標中，除了前一章討論的內容以外，它們的效果最理想。


    # 移動平均的觀念


    移動平均是取某特定期間內數據的平均值，並不斷剔除最早的數據而以最新的數據取代，然後再重新加總與平均。


    以「道瓊工業指數」收盤價的10天期移動平均爲例，你首先取最近10個連續交易日的收盤價，計算總和與平均值。第十一天，你以當天的收盤價，加上前10天的總和，再減去第一天的收盤價，便是第十一天的10天期移動平均值。每天都重覆上述程序，則平均值將每天「移動」；換言之，平均值每天都會根據最新的收盤價而變動。如果你將計算的結果逐日繪製於價格走勢圖上，便呈現類似如圖8.1的情況。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 圖8.1


    道瓊工業指數日線圖——10天期移動平均線。虛線是道瓊工業指數收盤價的10天期移動平均線。請留意，相對於實際的價格走勢，移動平均線較平滑，在時間上有落後的傾向。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_162_0.png)


    TQ 20/20 © 1991 CQG Inc.


    這麼做有何意義呢？移動平均線會將不規則的價格波動平滑化，並凸顯趨勢與趨勢的反轉。由於它們是某特定期間的平均值，所以——根據定義——它們是經過鈍化的指數，落後於最近期的價格波動。採用的期間愈長，鈍化（落後）的效果愈大。詳細研究各種移動平均線的資料，可能發現某些重覆出現的模式，並根據這些模式判斷未來可能的價格趨勢。某些模式'
  merge: -1
  img_proc: true
- pgno: 163
  md: '非常明確，可以用來做為股票與商品的買、賣訊號。


    在我見過的每一本走勢圖譜中，幾乎都採用某些類型的移動平均線。許多技術分析家與交易者都採用他們自己設計的移動平均線，利用指數（exponentials）或其他加權方法計算。這裡我並不打算討論各種類型的移動平均，我僅提出我使用的移動平均線，並解釋我的運用方法。


    個人而言，我認爲股票市場（個股與指數）最理想的移動平均線，是200天期（200個交易日，相當於40週）的移動平均線（參考圖8.2）。


    # 圖8.2


    道瓊工業指數與200天期移動平均線。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_163_0.png)'
  merge: -1
