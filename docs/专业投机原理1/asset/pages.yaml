- pgno: 145
  md: '# 圖7.10


    1990年12月份的玉米期貨價格日線圖——一個適合於設定停損的市場。情況2滿足時，這是進場做多玉米的理想時機。市場的流動性高，停損點最初可以設定在最低點，當價格穿越上方的水平直線時，停損點可以往上移至該處。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_145_0.png)


    TQ 20/20 © 1991 CQG Inc.


    1-2-3準則是一種簡單而有效的交易方法，如果謹慎運用，成功的機會遠大於失敗。然而，它有一項缺點，三個條件完全滿足時，你通常已經錯失一段相當大的行情。所以，此處將討論一種可以協助你提早建立部位的法則，它是我個人偏愛的方法，我稱它爲2B準則。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 2B是否可以成立？往往是輸贏的分野！


    前文討論趨勢變動的第二準則時，我們曾經提及一種狀況：在測試先前的高點（或低點）時，價格往往可以實際突破先前的高點（或低點），但走勢卻未能夠持續。雖然這僅是一種特殊型態的測試，但這種情況一旦出現，通常即是趨勢變動的訊號。換言之，單單這種現象的本身，便代表趨勢非常可能發生變化；就或然率來說，它的重要性遠甚於趨勢變動三項準則中的任何一種。由於它具有特殊的重要性，所以可以被視為是一種法則：


    # 2B法則


    在上升趨勢中，如果價格已經創新高而未能持續挺升，稍後又跌破先前的高點，則趨勢很可能會發生反轉。下降趨勢也是如此。這項法則適用於三種趨勢中的任何一種：短期、中期與長期（參考圖7.11、7.12與7.13）。


    在盤中的短線趨勢中，價格創新高（新低）之後，如果2B法則成立，通常會發生在一天或以內（譯按：換言之，當價格創新高〔新低〕之後，如果2B法則得以成立，則在一天或以內便又向下跌破先前的高價〔向上穿越先前的低價〕）。在中期趨勢中，價格創新高或新低之後，如果2B法則得以成立，它通常會發生在三天至五天以內。在市場的主要（長期）轉折點，價格創新高或新低之後，如果2B法則得以成立，通常會發生在七天至十天以內。在股票市場中，價格創新高之後，隨後走勢'
  merge: -1
  img_proc: true
- pgno: 147
  md: '的成交量通常會低於正常水準，但反轉的確認（譯按：價格跌破先前的Oper高點時）卻會爆大量。


    # 圖7.11


    1989年12月份黃豆粉期貨——短期的2B。這份黃豆粉期貨日線圖顯示短期的2B。價格創新高，而隨後又跌破先前的Oper高點時，如果當日沖銷者在這個時候賣空，獲利相當可觀。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_147_0.png)'
