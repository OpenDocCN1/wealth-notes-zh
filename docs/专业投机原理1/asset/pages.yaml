    ```


    在長期走勢圖上（週線圖），上檔空間更廣。我判定目標價位在433.50美元（壓力水準）。如果可以突破，上檔的另兩個壓力區分別在469.50美元與502.30美元，如果觀察更長期的圖形（月線圖），目標價位在800附近。我不想再計算每一價位的風險/報酬比率，但這些比率顯然非常有利。


    由技術分析的角度來說，如此理想的機會不常出現。唯一的問題是計算成功的機率，並決定進、出場價位。你應該怎麼做：以中期趨勢為準來操作，或採取買進-持有的長期策略？


    為了解決這個問題，我採取最保守的假定。換言之，因為根據定義中期趨勢已經變化，所以我假定這是一個為期三週至三個月的中期趨勢。於是，我取出1981年以來的黃金價格資料，挑選為期三週至三個月的上升走勢，並登錄走勢的幅度。'
