  md: '中午過後不久，盤勢開始下滑，但成交量並沒有放大。我慢慢買進指數的賣出選擇權，持續擴大我的空頭部位，料想大盤下週將繼續向下探底。我非常留意成交量的變化。大約下午2：45的時候，消息傳出「聯合航空」（United
    Airlines）併購案的資金融通失敗，成交量暴增，S&P 500指數期貨開始一路挫跌，我也開始大量搶進賣出選擇權。大約下午3：00過後不久，我的買單再也無法成交——情況已經完全失控了。「道瓊工業指數」收盤重挫191點。


    週一早晨我預料開盤指數大約會下跌50點左右，如果情況真的是如此，我已經擬定一張清單，列示我希望做多的個股與選擇權。我持有的賣出選擇權都設定在開盤價賣出，然後等待開盤。在開盤後兩個小時內，市場籠罩在一片賣壓下，指數跌幅超過60點。我的空頭部位完全獲利了結，並建立股票與選擇權的多頭部位。我當初建立空頭部位的佣金成本約為73,605美元，毛利約為831,212美元，所以淨利為757,607美元。接下來幾週內，我繼續持有多頭部位，最後又獲得相當不錯的利潤。


    我完全不知道「13號星期五」的收盤指數會重挫191點——這是歷史上的單日第二大跌幅；我也不知道「聯合航空」併購案會爆發融通失敗的消息。如此重大的跌幅，確實是巧合，但我掌握這波跌勢，與運氣全然無關。我使用的每一項分析準則——包括前文中所未提及的多項理由——都顯示大盤即將修正；所有的勝算都站在我這邊。'
