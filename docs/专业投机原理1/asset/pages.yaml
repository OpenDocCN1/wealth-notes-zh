  img_proc: true
- pgno: 347
  md: '於亡靈尋找安息之所，他對於暴風的反應必然不同於受過訓練的氣象學家。情緒可以協助我們或傷害我們，可以保護我們或摧毀我們，這取決於我們對於未來現實環境之信念與判斷的精確性。


    # 情緒的助益


    心理學家Nathaniel Branden 將「情緒」定義爲「人類評估現實環境的某些層面對於自身將產生的利弊關係，並根據這些經驗所做的身心（psychosomatic）反應。」④情緒是一種「身心」的形式，這表示情緒是一種源自於心理程序的生理反應。這種心理程序是一種價值評估，以判斷相關事物對於我們是有利、還是有弊。


    以一把裝上子彈的鍍銀左輪槍爲例。一位小孩子如果不瞭解槍枝的殺傷力，他可能會被光亮的外表吸引。然而，這位小孩子如果曾經見過他的父母被槍枝殺害，他應該會排斥槍枝而躲開它。第一種情況下，左輪槍是有趣而好玩的東西，一項新發現。第二種情況下，左輪槍是危險而有害的東西，殺人的傢伙。


    同理，我們對於任何事物的情緒反應，取決於潛意識在既有的知識範圍內如何評估該事物。判斷與反應的速度非常快，遠甚於意識的作用。我們必須停頓、思考、反省，才可以辨識情緒的來源，如果確實可以理出頭緒的話。我們由何觀察呢？根據我的瞭解，Ayn
    Rand 提出一個最適切的答案：


    人類對於善良與邪惡的感受能力雖然沒有選擇的'
  merge: -1
  img_proc: true
- pgno: 348
  md: '餘地，但可以根據價值觀選擇何者是他所愛或所恨，希冀或恐懼。如果他選擇非理性的價值觀，他將把情緒的機制由保護的功能切換為摧毀。非理性即是不可能；它與現實相互矛盾；慾望無法改變事實，但事實可以摧毀慾望的所有者。如果人類希冀、並追求矛盾——如果他既希望吃下蛋糕，同時又保有蛋糕——他的意識將會崩解；他將會把內在的生命轉變為盲目的戰爭，一切都陷入黑暗、不協調、無意義的衝突…。⑤


    為了瞭解我們的情緒，必須瞭解情緒的來源：我們的價值觀。「價值是取捨的判斷標準。」⑥我們的價值觀是由許多我們認為必要或想要的事物、觀念與原則構成，不論喜歡或不喜歡，它們都存在我們的潛意識中，並排列為井然有序的架構。


    這個層次分明的架構，讓我們的心靈可以判斷價值——我們的慾望、目標與信念——我們是根據善、惡、利、弊的標準，擬定它們相對的重要性，並排列它們的秩序。在理想的狀況下，如果我們的評估標準與我們的理性相互協調，我們珍惜的每一種價值、信念與目標便不會矛盾，對我們的生活也有益。我們在意識或潛意識中選擇自身的價值，而所做的選擇將成為情緒電腦的程式軟體。⑦猶如一般電腦一樣，軟體的內容將決定結果的價值。


    人類是具有意志力（volitional）的生物。為了求取生存，人類必須選擇思考；辨識現實，整合可供運用的資料。這即是自由意志（free will）。我們俱備自由意志，這是指我們可以'
  merge: -1
  img_proc: true
- pgno: 349
  md: '提供或改變潛意識電腦的程式，但我們不能改變它的功能。


    我們的情緒便是這項功能的一部份。生物學上的演化使我們俱備一套機制，以迅速反應複雜的事件，但我們在潛意識中接受的價值與信念（beliefs），將決定情緒反應的形式。所以，價值觀的有效性（這是指在現實環境的有效性而言），將決定情緒的有效性。此外，因為人類俱備概念化的能力，並能夠預測未來的事件——不論這些能力是事實，或僅是想像——我們可以把情緒的功能擴張至其他動物在「設計上」的領域之外。根據Ayn
    Rand的說法：


    人類的肉體是一種舒適-痛苦的機制，可以自動顯示身體的健全或傷痛，它可以反映基本的抉擇，生或死。人類意識中的情緒機制也是如此，它俱備相同的功能，可以反映兩種情緒上的基本抉擇：快樂或痛苦…。情緒是一種評估，判斷何者可以提升他們的價值，何者將威脅他們…迅速的盤算將使他得知獲利或虧損的總和。


    然而，人類肉體上的舒適-痛苦生理機制，是一種自然存在的價值標準，並取決於個人的身體性質。情緒機制中的價值標準便非如此。因為人類沒有先天的觀念，所以不會有先天的價值判斷。⑧


    這種觀點截然不同於史波克與瓦肯人。史波克希望否決情緒的存在與有效性，因為他認爲情緒具有非理信與負面的性質。Rand在情緒與價值，以及價值與理性之間建立一種直接的邏輯關連。她認爲，價值觀的精確性與有效性，將決定情緒的'
  merge: -1
  img_proc: true
- pgno: 350
  md: '完整性與力量。根據Rand的觀點，情緒的衝突起源於價值觀的衝突，如果在理性的運作上認定價值觀為錯誤，人類有能力修正。


    所以，根據天性與遺傳來說，我們並非註定會陷入內在的衝突。然而，為了避免內在的衝突，我們必須選擇相互一致而有助於生活意義的價值觀，唯一的方式是透過理性的思考。


    俱備相互一致而明確界定的價值觀，情緒便可以擔任保護的功能，成為人類靈魂的快樂-痛苦機制，並在必要的情況下，針對複雜的事件提供立即而有效的反應。這便是人們所謂的「直覺」或「第六感」。更重要者，在工作、遊樂與人際關係中，凡是有助於提升生活意義的行為，情緒都可以提供報酬，這種奇妙的身心反映，我們稱為愉悅的心境。在健全的情緒架構下，我們不僅可以追求成就，而且可以享受生命的過程；其中的樂趣可以不斷強化我們的追求動機。


    # 情緒的破壞性


    不幸地，達成情緒的一致性，可能是我們面臨最艱困的挑戰。人類不能免於錯誤：我們會犯錯，我們的父母會犯錯，以及其他等等。我們每一項信念，每一項抉擇，都會影響潛意識的程式，並因而影響情緒的反應。新的抉擇與資訊出現時，我們的心智會重新檢驗，並試圖協調新、舊的成份，於是衝擊會貫穿整個情緒架構。


    新資訊在價值架構中所處的位置愈基本，它對於情緒反應的衝擊愈嚴重。現實環境迫使我們承受自身行為的後果——'
  merge: -1
  img_proc: true
- pgno: 351
  md: '筆好交易帶來獲利，一筆壞交易造成虧損。意識與潛意識中的價值結構與內容，將決定我們在情緒上如何體驗（experience）行為的後果——我們如何感受（feel）自身的行為。我們體驗快樂時，生命將充滿動力，並渴望地繼續向前邁進。我們體驗痛苦時，將陷入沮喪與恐懼中，並試圖逃離造成痛苦的原因。


    如果我們試圖將錯誤或相互矛盾的信念整合進入價值架構內，會如何呢？如果我們做了錯誤的抉擇，或在必要的時候未抉擇，又會如何呢？如果情緒是由價值與信念決定，持有錯誤的信念或相互衝突的價值觀，將會產生誤導或「混淆的」（mixed）情緒，也可能提供自我摧毀的行為動機。


    例如，如果某人相信人性本惡，而且應該以一生的時間贖罪，並準備死後前往天堂，則追求與取得物質的財富便不是十分重要。如果某人在潛意識中認為，自己沒有快樂的權利，在面對值得愉悅的事件時，他可能會有罪惡感。如果一個民族相信他們是最優秀的阿利安種族，相信上帝指派他們統治其他民族，他們將漠視無辜的屠殺。根據心理治療的現象顯示，某些情況下，面對積極的成就時，某些人會呈現痛苦、恐懼或罪惡感，面對著他人或自我的毀滅時，卻會呈現興奮的愉悅。


    很少人——如果有的話——的情緒架構是全然的自我提升（以正面的意義而言），或全然的自我毀滅。我們都會有混淆與矛盾的價值觀和前題；某些信念可以自我提升，某些則會自我否定。以先前的交易者約翰為例。他認定知識的重要性，並正確地運用它們（雖然時效的掌握不理想）。他充滿自信地建立部位，但他最初便承認自己可能犯錯。我們可以假定他是一'
