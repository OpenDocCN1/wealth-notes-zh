    「不，一定會暴跌…穩住。」


    約翰的聲音很平靜…或許太過於平靜了。他必須刻意壓低聲音，以防止腦袋爆開。心跳加速，他甚至於可以感覺腎上腺素不斷分泌。他又點了另一根香煙。價格又向上跳一檔…現在已經損失15檔，總共200口契約——93,750美元。


    接下來幾個鐘頭內，價格基本上都在原地打轉：向上跳一檔，又回跌一檔。約翰的心情也隨著價格起伏不定。


    突然間，價格又開始向上攀升，速度不快，但走勢非常穩定。煙灰缸已經堆滿煙頭，而汗水由他的額頭滾落，約翰以一種詭異的神情盯著報價螢幕，心中自動盤算著自己的虧損：10萬美元、106,250美元、112,500美元、118,750美元。內線電話又響了；他的助理。'
