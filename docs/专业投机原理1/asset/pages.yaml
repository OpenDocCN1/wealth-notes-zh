  md: '我撰寫這本書是為了協助世人在金融市場中追求最大的人生意義：自我滿足（self-satisfaction）。


    類似如 Ty Cobb、Babe Ruth、Willie Mays、Mickey Mantle、以及其他當代著名選手，他們都成為孩童們心目中的偶像，而讓孩童與成人都將運動視為是一種綻放榮耀的領域。然而，每位傑出的職業球員都有一段非凡的歷程。在強烈競爭的環境下，他們以經年累月的一致性表現脫穎而出。這群歷經考驗的運動選手，對我們孩童的影響可能更勝過電影明星，尤其近年來，許多頂尖的運動選手喪失對於自我的控制而沉迷於藥物之中，這些經常都是榮耀帶來的結果。


    我是一位市場專家——如果你認可的話，我稱得上是一位大聯盟的球員——我是這個領域內的頂尖好手之一。然而，如果有所謂的「交易者名人堂」（Trader’s Hall
    of Fame）的話，我想我可能無法入選。在任何特定的期間內，許多市場玩家都比我賺更多的錢。某些人曾經贏得交易競賽，某些人曾經大賭一番而獲勝。許多人曾經頂著榮耀的光圈，但隨後又黯淡下來。我從來沒有參加交易競賽，也從不參與我輸不起的賭局。我想我最大的長處是我的—致性表現。就如同那些榮耀焦點以外的棒球選手一樣，我引以為傲的是我可以不斷地留在場內比賽，並持續提昇自己的技巧，或隨著外在環境的變化調整自己。


    閱讀任何領域的書籍時，我總是要求這本書的作者或討論的對象擁有公認的成就。所以，如果我宣稱自己擁有—致性的表現，我應該提出證明。'
