- pgno: 301
  md: '7. 經濟面的情況如何？


    a. 通貨膨脹的情況如何？Fed 的政策取向如何？政府、民間、企業界與私有部門的負債情況如何？以自由準備衡量，信用的成長率如何？貨幣供給成長率如何？利率水準如何？市場對於政府債券的接受程度如何？


    b. 美元匯率的走勢如何，貶值的可能性如何？日圓與德國馬克匯率的走勢如何，日、德的政府是否會採取維護匯率的措施？


    c. 美國消費者普遍的心態如何：生產而儲蓄、借款而支出、或介於兩者之間？


    d. 什麼產業部門最強勁？什麼產業部門最疲軟？市場是否有領導類股？根據目前情況判斷，如果有些許利空消息，是否會使整個行情出現反轉？


    e. 什麼潛在的問題可能使人們對於整個經濟狀況的判斷，發生突然的改變？


    8. 是否存在可供運用的重大謬誤現象，尤其是行情發生變動的時候？


    一旦回答上述問題後，你便可以決定在何時、於何處、投入多少資金。決定採取行動時，你必須在嚴謹的紀律下操作。這便是交易守則的重要性所在，它們是下一章的討論主題。'
