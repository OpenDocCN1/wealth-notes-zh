- pgno: 361
  md: '# 第十四章

    成功之道


    # 成功的必要條件


    我認為，身為交易者、投機者與投資者，如果希望在金融交易中獲致穩定的成功，需要俱備一組個性上的特質。


    第一，必須俱備有根據的自信心（self-confidence），相信自己的心智可以學習真理，並由正面的角度運用在生活中的每一個領域。


    第二，必須俱備自我的動機（self-motivation）與決心（commitment），有能力與意願將時間與精力花費在交易的知識上，並學習如何交易。


    第三，必須俱備智識上的獨立性（intellectual independence），面臨各種不同的見解時，可以根據事實自行判斷。


    第四，真誠地熱愛自己的工作，體認最大的報酬來自於工作過程的本身，而不是工作得到的名與利。


    這些特質在生活中的每一個領域都很重要，金融圈內的快速步調與波動，更凸顯出它們的必要性。缺乏自信，你將永遠'
  merge: -1
  img_proc: true
- pgno: 362
  md: '處於恐懼犯錯的情境中，這種恐懼感遲早會令你無法思考或擬定決策。缺乏自我的動機與決心，市場中的劇烈競爭將會活生生地吞噬你。缺乏智識上的獨立性，你將迷失在變幻莫測的意見浪潮中，並陷入金融的漩渦內。缺乏誠實面對自己的能力，你的願望將取代現實，你將發現自己不是根據事實擬定決策，而是根據自身的願望與期待。缺乏對於工作的熱愛，你的工作將變得沉悶無趣；你將喪失持續工作的動機與力量。


    這些都是可以培養的特質，但你必須透過堅毅的決心瞭解自己，並釐清你與現實之間的關係；換言之，你必須瞭解你想由生命中得到什麼，你爲什麼想得到它，你如何得到它。自我瞭解是人生的指南針，它將指引你踏上成功的道路，它也是一座燈塔，因爲人生免不了挫折與痛苦，當你因此陷入徬徨與混淆時，它將指引你正確的方向。然而，唯有你試圖向前邁進，它才會指引你。


    第II篇的前言中，那位睿智的老人說道，「某些人僅有夢想而從來未付諸實現。某些人僅是默默地工作而從來沒有夢想。可是，還有少部份人不但有夢想，而且也將夢想付諸實現。」看看那些成功而快樂的人。他們最大的特徵是熱愛他們的所做所爲。觀察他們，你將發現，他們可以不接受報酬而工作，賺錢僅是附帶的收穫。對於他們來說，每天都是嶄新的挑戰，值得以全部的精力與熱忱來應對。在家裡、工作或休閒中，他們的行爲都反映出每個時刻、每天與一生的目標架構，並整合爲豐富的人生。他們採取的行動，是來自對於生命的熱愛；向前邁進時，失敗、痛苦與挫折僅是過程中的點綴，不是不可克服的障礙。他們將夢想付諸實現。'
  merge: -1
  img_proc: true
- pgno: 363
  md: '另一方面，看看那些兩眼空洞而缺乏精力的人，每天都在非常不情願的情況下掙扎地過日子。他們過著毫無意義的生活；或者，他們從來沒有夢想，每天就像機械一般地重覆著；或許他們也曾經有過夢想，但從來未付諸實際的行動，最後連夢想也消失了。這些人並不理解，他們的價值與目標便是他們自己；他們追求的一切完全無關乎明確界定與瞭解的自我利益，在此過程中，他們成爲犧牲者與自身的迫害者，陷入自我懷疑的恐懼與不安全感中。


    我們可以有所選擇：我們可以決心操控自己的生命，並且邁向成功；或者，我們可以選擇恐懼與痛苦，並讓其他人與事件控制我們。正確的抉擇非常明顯，並且可以由一個單純的決心開始：CARPE
    DIEM！！這是以拉丁文表示的「掌握現在！！」你必須認定，生命中的每一時刻都珍貴無比，都是你的，而且應該以最高的熱忱迎接它。在任何情況下的任何時刻，你都可以展開成功所必要的變動程序。掌握生命，決心擷取那無限的可能性。掌握現在！！夢想，但必須下定決心以所有的力量將夢想付諸實現。


    # 成功的意義


    在根本意義上來說，成功並不是來自於某特殊領域內的能力或成就。你可以在事業中獲致成功，而在個人生活中一敗塗地，就像霍華休斯（Howard Hughes）一樣，在富裕的生活中過著悲慘的日子。你也可能貧窮而快樂，享受生命中的「單純」。然而，如果有機會的話，大多數人難道不想同時擁有充裕的財富與充實的個人生活嗎？我相信，幾乎每個人都希望如'
  merge: -1
  img_proc: true
- pgno: 364
  md: '此。


    我相信，如果俱備正確的動機與決心，自由國家中的每一個人，都有機會達成個人的成就與經濟的成功。


    非常奇怪，在一個充滿經濟機會的國度裡，人們對於金錢竟然會存在愛-恨的關係。某些人將金錢視爲是一種奴役之物，「如果我不是被迫追求萬能的金錢，我可以做我想做的事，過著充實的日子。」另一些人把金錢本身視爲是目的，他們一直子追求金錢而從來沒想到要享受它們。一個人對於金錢的看法與他對於成功的概念，兩者之間存在著密切的關連。我們都知道一句古老的諺語，「金錢不能買到快樂，」話雖沒錯，但金錢還是充滿誘惑。爲什麼？金錢究竟能夠買到什麼呢？


    這個問題的答案實際上很簡單：金錢是一種工具，它讓人能以自身的努力生產交換他人的產品與服務，或儲存自身努力的結果以供將來之用。金錢是一種手段，將個人的精力轉變爲物質；它是將夢想轉變爲現實的工具。


    在當今的環境裡，我們幾乎都能夠從事個人熱愛的工作。金錢之所以迷人，是因爲它在工作的過程中可以提供許多物質的享受。就這個層面來說，個人必須決定金錢的重要性，必須在下列兩項問題的答案中找到均衡點。第一，「我熱愛的工作是什麼？」第二，「我在物質上想要什麼？」如果這兩個問題的答案無法相互協調，僅有一個解決的辦法：改變答案！否則，你註定會過著充滿挫折的生活。本書剩餘篇幅所要討論的便是這類的衝突，以及排除它們的方法。'
  merge: -1
  img_proc: true
- pgno: 365
  md: '我想，任何人在任何領域裡都可以擁有個人的成就感，以及滿意的經濟成就，這便是我所謂的成功。成功是一種生活的情境——一種活著的感覺。成功是一種變動；它是以目標為導向的一種動態行為程序，以不斷追求個人的成就、快樂與成長。


    現實環境不會把成功放在銀盤子裡交給少數的人。成功來自於自我創造（self-created）而不是給予。生命是一種程序。更特定來說，它是一種自我維繫（self-sustaining）與自發性（self-generated）活動的一種程序。①這對所有生命都是如此，包括最原始的植物、阿米巴與人類。生命是一種活動的程序，不能活動即是死亡。在這種意義上，僅有一個根本的抉擇，僅有一種方法判定最終的成敗：生或死。生物的每一項活動不是自我助益，便是自我破壞。人類也是如此，卻有一項重大的差異：有關目標與活動的自我助益與自我破壞，我們每一個個人都必須獨自判斷與界定其間的差異。我們必須根據人類的特殊稟賦——意識認知的理性概念形式——評估（evaluate）可行的抉擇。②生命的成功與失敗，乃取決於如何運用心智，如何思考、感覺與行動。所以，為了控制自己的生命與成功，你必須瞭解自身的心智如何運作，並瞭解如何運用它達成目標。


    # 心智的超級電腦


    我們採取的每一項行動，直接的刺激都是來自於潛意識，而不是意識。我拿起咖啡啜飲一口的時候，我是告訴意識說，「現在喝咖啡，」而潛意識從這裡開始便接管一切，將我由孩'
  merge: -1
  img_proc: true
- pgno: 366
  md: '童時期練習至今的無數技巧付諸行動。


    相同的程序不僅適用於生理活動，也適用於心理活動，包括思想與情緒在內。每天早上我觀察價格走勢圖時，大多數的思考與分析都不是在意識的層次上運作。我拿起資料，然後告訴潛意識，「看看這個，你有什麼意見。」觀察價格走勢圖時，我立即知道我的看法，以及對於行情的結論；我雖然可以將它們表達出來，但這些看法與結論都是在潛意識中形成。這猶如2
    + 2 = 4 一樣：我碰到這類問題時，不需在意識中重新回憶加法的運算法則；相關的知識已經整合進入我的潛意識中。


    人類的心智就像一部超級電腦，產出的品質將取決與輸入資料的品質，以及軟體程式的性質。輸入的資料包括過去的知識與經驗，以及日常生活中發生的事件。產出取決於你如何處理資料，如何訓練心智發揮功能。在任何時刻，你並不需要全然控制思考的程序；這基本上是一種自動化的程序。


    目前，你的動機——驅使你採取行動的信念與價值觀——已經擺在你的潛意識心智中。你或許覺得你可以控制自己的行動，但實際上你可以自由控制的範圍相當有限。


    你的潛意識就像是電腦的處理器與記憶體，而操作程式便是過去的知識與經驗。你唯一的控制工具是鍵盤——當時的意識與思想。如果不滿意產出，你必須更改輸入的資料，或程式的結構與內容，但通常是同時更改兩者。


    潛意識是一項可貴的資源，正確的處理下，可以驅使你邁向成功。你是否曾經注意，運動迷們可以輕鬆地舉出人名、統'
  merge: -1
  img_proc: true
- pgno: 367
  md: '計數據、比賽的時間表與各種攻防的策略？他們何以能夠辦到？在日常的資料輸入中，潛意識扮演非常重要的功能，它說，「這很重要；將它們記起來，以供不時之需！」只要在早上喝咖啡的時候，順便閱讀報紙的運動版，或一邊喝啤酒一邊觀賞電視轉播，運動迷們便可以輕鬆地吸收相當複雜的資訊。他們大多不會刻意地研究。閱讀運動版的新聞報導，這並不像在工作。他們僅是輕鬆地閱讀或觀賞，但意識非常集中，而其他便由潛意識接管。如果在生活中的每一個領域，你的心智都能夠如此運作，你認為你的成就將如何？你會有多麼成功？


    即使你並不是運動迷，但在生活的其他領域內，一定有你感到興趣的嗜好。如果你非常幸運的話，你對於工作與人際關係可能便有這類感覺。然而，讓我們採用較尋常的假設，你的興趣可能是在橋牌、高爾夫球或跳舞等娛樂中。不論你的嗜好是什麼，你在從事這些活動時，感覺如何？這些活動通常不是都很容易鬆，甚至於讓你感覺精力充�
    mort 嗎？你是否覺得，你的意識沒有在思考而由潛意識接管一切時，你的表現通常最理想？你是否希望在大多數情況下都能保持這種境界？


    你可能也有下列類似的經驗。假定你熱愛高爾夫球。某天，你前往打球，覺得一切都非常「對盤」。你打了畢生最完美的一場球，每一桿都很完美。你有飄飄然的感覺，但這種感覺僅是隱約出現而沒有讓你分神。


    你的球伴認為你是處於「失神」或「無意識」狀態下打球。打完八洞之後，整個過程開始在你的意識中浮現了，你想著：「哇！我實在打得太棒了。如果我可以繼續保持這種水'
