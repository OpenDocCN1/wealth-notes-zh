- pgno: 55
  md: '# 第三章


    # 一致性成功的事業經營哲學


    如果你閱讀歷史上偉大交易者的傳記，你發現他們之中許多都曾經至少破產過一次，有些甚至破產過兩、三次。另外，我們又知道，大約僅5％的商品交易者能夠賺錢。於是，你可能會覺得奇怪，「這究竟是怎麼一回事？」


    人們在市場中發生虧損，理由雖然很多，但有一項最嚴重、也最容易觸犯的錯誤，那便是把過多的風險資本投入單一的部位——孤注一擲。這項錯誤之所以產生，是因為人們在交易之前，並沒有為自己設定一種經營事業的哲學（business
    philosophy）。


    身為一位交易者，我的目標始終是：在經濟獨立的情況下保有自由；所以，我的目標是：經年累月地穩定賺錢。我一向都把自己的交易生涯視為是一種事業經營，而一位謹慎的企業家首先便希望能夠維持他的經常開銷，然後再追求盈餘的穩定成長。我從來不執著於大撈一票的機會，首要之務是保障資本，其次再追求一致性的報酬，然後以一部份獲利進行較有風險的交易。結果，大撈一票的機會還是會出現，但我並不需要承擔過度的風險——這一切並不是巧合。


    讓我們以經營事業的角度考慮，我的哲學基於三項原則，'
  merge: -1
  img_proc: true
- pgno: 56
  md: '重要性排列如下：保障資本、一致性的獲利能力、以及追求卓越的報酬。這三者是我的基本原則，因為它們是所有市場決策的最高指導原則。在我的投機策略中，每一項原則都有不同的份量，而且彼此之間有銜接的關係。換言之，資本保障將造就一致性的獲利能力，後者又使我可以追求卓越的報酬。


    # 保障資本


    在我的事業經營哲學中，保障資本是最核心的原則。換言之，在任何潛在的市場活動中，風險是我最重要的（prime）考量。在我問「可以實現的潛在利潤如何？」之前，我會先考慮「我所可能遭遇的潛在虧損如何？」就風險/報酬的角度思考，最大的可接受比率為1：3（這項比率將在本章與第11章分別說明）。如果市場的風險/報酬情況很差，我會持有現金，不論普遍看法如何。所以，我並不關心我的績效是否可以「超越大盤指數或平均水準」。我追求的是絕對的報酬，而不是相對的報酬。


    對我來說，鈔票並不是綠色（譯按：美鈔的顏色）…它是黑色或白色。黑色與白色是對應著「真理與謬誤」、「正確或錯誤」、「好或壞」。在倫理學的觀點上，社會的教導是「並無所謂的黑與白，僅有灰色」：灰色——妥協與矛盾——代表缺乏絕對。然而，帳冊上所有數據都是絕對數據：2＋2必然是4，而2－6永遠是－4！雖然如此，但在非常微妙的情況下，現代的投資人卻被訓練來接受基金管理圈子推銷的灰色觀念。如果大盤指數下跌20％，基金淨值僅下跌10％，投資人應該覺得高興——畢竟來說，他的績效仍超過平均水準10％！'
  merge: -1
  img_proc: true
- pgno: 57
  md: '「我有没有赚錢？」這是投資者唯一的問题。爲了確保這個問題有一個肯定的答案，你唯有在掌握明確的勝算時——換言之，保持最低的風險——你才可以投機或投資。例如，如果所有指標都顯示，股票市場（或黃豆、原油、……）的長期趨勢已經接近頭部，至少中期的發展是如此，則你的投資組合爲什麼還要100％站在多方呢？爲了賺取較國庫券殖利率多幾個百分點的報酬，難道便值得冒損失50％的風險嗎？


    請參考圖3-1的「價値線」（Value Line）。如果投資者在1984年12月的低點買進，並持有至1987年8月25日（我的指標在8月25日出現賣出訊號），不計算股息的獲利爲67.9％。如果這位投資者持有至10月2日（賣出訊號再度出現），獲利仍有65.9％。然而，如果他繼續持有，10月19日的時候，他將在14天之內損失兩年十個月累積的所有利潤——換言之，不計股息的報酬率將回歸至0％。很明顯地，當時市場完全不俱備合理的風險/報酬關係。你或許會說「後見之明永遠是正確的」，但在8月至10月的期間，我幾乎是兩手空空——我的資金大多轉至國庫券——並在價格崩跌時賣空。你繼續閱讀本書時，將發現這何以不是運氣。


    另一種我認爲風險過高而不適合參與的活動：在多頭市場的末期，大量投資兼併股票與垃圾債券。某些人或許會告訴你，「不論股票市場的情況如何，市場中永遠有理想的交易。」嗯，或許沒錯。然而，我已經有相當經驗瞭解空頭市場的真正景象。股票價格日復一日地下跌，似乎永無止盡。許多先前被視爲體質健全的企業，它們被迫清算流動資產以清償債務，而體質較差或/與信用高度擴張的企業則以倒閉收場。擴張'
