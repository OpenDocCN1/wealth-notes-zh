- pgno: 346
  md: '根據精神病理學家Willard Gaylin博士的看法，在達爾文的演化論中，忿怒與恐懼是在緊急或壓力的情況下，提升生存機會的情緒，但我們的某些遺傳已經不再有用。他認爲：


    在許多物種中，忿怒與恐懼都是應付危險的重要情緒反應。當我們的文明較接近動物的遠祖時，這些情緒對我們較有助益。當我們受到野獸威脅，忿怒可以凝聚我們的力量，並在智慧的配合下，展開攻擊。然而，現在的危險不再是來自於樹叢，大多是由信封袋裡落出來…。數百萬年的演化，可能僅因爲幾萬年的文明而顯得過時了。②


    Gaylin 並未主張，忿怒與恐懼在現代生活中全然沒有地位，但他暗示我們有責任適當引導它們。否則，它們反而會造成我們的危機。預期危險時，忿怒與恐懼的情緒，可以使野獸在心理上與生理上產生戰鬥或逃避反應——根本的生存工具。現代人與野獸不同，我們的反應並不侷限於戰鬥或逃避。我們面臨任何威脅時，通常可以消除造成威脅的因素。


    我們可以改變現實環境中的基本性質。在某種層次上，我們是自身未來的規劃者之一，不需被動地臣服於現實環境。③


    在另一方面，廣泛的選擇，配合著想像與預測未來事件的能力，可以讓我們預先掌握擔憂的事物。不同於野獸，我們的情緒不會對於現實環境自動產生反應。我們反應的對象是經過解釋（interpretation）的現實環境。一個人如果相信風是來自'
