    b 前一欄的10天移動總和。


    c 最近10天的淨移動總和。以8/3爲例：61866−63937=−1531。


    我採用的價格震盪指標稍微複雜一些，但評估行情時，它的重要性也高於寬度震盪指標。我是以「紐約綜合指數」每天的收盤價爲基準計算，每天早晨，我計算前一天與先前第五天的收盤價差值。然後，加總最近十天以來的上述差值，這便是10天期移動總和。最後，再以昨天的10天期移動總和，減去先前第10天的10天期移動總和，這便是5天價差的10天期淨移動總和（請參考表格8.2）。將每天的計算結果描繪爲圖形，並與'
