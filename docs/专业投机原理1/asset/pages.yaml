  img_proc: true
- pgno: 409
  md: '情愛與樂趣。這項信念對於你的經濟、事業與人際關係造成何種的影響？全心專注於你曾經遭受的痛苦與損失，就如同它們又重演一次。盡可能回想所有的痛苦楚經歷，這一切都是因為這項侷限性的信念。


    2. 仍然閉著雙眼，思考這項侷限性信念在目前造成的痛苦，包括過去經驗導致的一切傷害。你現在覺得怎麼樣？你是否覺得精疲力盡？你是否覺得無助，不能控制自己的生活？它們怎麼影響你的社交生活？你是否因此錯失許多歡樂的機會？它們如何在生理上、情緒上與精神上影響你？感受其中的痛苦。


    3. 移往未來，將這項信念引發的痛苦投射至一年以後。拖著過去的沉重包袱，感受它的壓力。這項痛苦會讓你在事業上付出什麼代價？會讓你在人際關係上付出什麼代價？對於你的自我形象與自信心會造成什麼傷害？在情緒的層次上，確實感受相關的痛苦；運用你的身體；深呼吸；擺出承受痛苦的姿勢。觀想鮮明的痛苦，專注其中。接著，將自己投射至五年之後，並重覆上述痛苦程序。想像這些失敗在你的生命過程中將擴大至何種程度，並感受這些失敗不斷累積的壓力。你對自己說些什麼？你對自己的感覺如何？你變得更堅強或虛弱？更能控制或更失控？觀想自己持有這項侷限性信念造成的結果。你看起來是否老態龍鍾？你看起來是否精疲力盡？
    你看起來是否狼狽不堪？你在生命的每個領域內付出什麼樣的代價？你心愛的人將如何受你拖累？漫長的五年。讓你感受的'
