- pgno: 9
  md: '習，直至有一天，我發現我已經不再模仿了，因爲我已經擁有這些技巧。我的 一生都以這種模式學習：選定一個目標，閱讀與觀察這些傑出專業者的教誨，透過模仿而不斷練習，最後我可以發展出一種屬於自己的獨特風格。


    然而，情況已經有了變化。我在孩童時代的願望是成爲英雄——成爲另一位Ty Cobb，希望在奧運會上贏得體操的金牌…。但是，在成長過程的某一階段，你總是必須放棄這種追求榮耀的想法。


    社會上普遍存在一種看法——在美國尤其如此——如果你不是相關領域內的第一把好手，則你必然仍有所欠缺。可是，第一號人物僅有一位，我認爲人們如果以成爲第一把好手爲主要的目標，這相當於是在追求挫折的人生，即使他們確實可以達成目標也是如此。以西部時代的快槍手爲例，一旦你被公認爲最快的槍手，你也是眾人希望擊倒的對象，最後你被擊倒時，你還擁有什麽呢？唯有在可以持續的情況下，榮耀才是美好的（當然你首先必須擁有它），但榮耀通常無法持續很久。以我最近觀賞「美國網球公開賽」爲例，某位評論家引用葛拉芙（Steffi
    Graf）的說法，她在每30場的比賽中僅滿意其中的一場。葛拉芙是最傑出的網球選手之一，最近三年的比賽中，她的勝率高達97％（！），但她基本上不滿意她的比賽。這非常不幸，以葛拉芙這樣擁有偉大成就的選手，她基本上卻對自己的表現不滿意。


    成功與快樂的精義是來自於自我潛能的實現，並體認錯誤是不可避免的過程，甚至是生命的一部份。在這項前提之下，'
