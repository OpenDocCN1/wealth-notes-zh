    Publishing Company, 1965）。

    ③ 場外觀察者（upstairs trader）是指在遙處一直使用螢幕從事交易的人。

    ④ 對於任何交易工具，買價（bid）代表當時場內願意買進的最高價格，賣價（offer）代表當時場內願意賣出的最低價格。

    ⑤ William J. O''Neil, "Program Trading vs. Investing in a New U. S.," Investor''s
    Daily, 10/17/89, p. 1。

    ⑥ 如果你在場內有熟識的朋友也有幫助。'
