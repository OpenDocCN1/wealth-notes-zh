  md: '期五早晨，我認為市場已經隨時可能出現拉回的整理走勢。開盤前，我開始打電話給客戶，告訴他們我的看法，重點如下：


    我認為市場即將出現一波主要的修正行情。自從3月23日以來，市場便持續處於主升段中。歷史上所有多頭行情中，僅有29％的主升段走勢，持續的時間比這波行情更久。另外，這段期間內，「道瓊運輸指數」已經上漲52％。相形之下，在「道瓊工業指數」92的年歷史中，包括多頭與空頭在內的174個上升走勢，其中僅8次的漲幅超過52％。垃圾債券市場已經幾乎瓦解——完全沒有買盤。此外，「道瓊工業指數」在10月9日創高價以後，已經連續下跌四天，而10月9日的高點並沒有受到「道瓊運輸指數」或行情寬度（breadth；譯按：這是衡量市場上漲與下跌家數之間的關係，通常以「騰落指標」[advance-decline；A/D]表示）的確認——這顯然是空頭訊號。


    「道瓊工業指數」持續攀升，市場氣氛十分樂觀，主要是受到公司併購消息與績優熱門股走勢的影響，但絕大部分個股都已經出現頭部，並處於中期跌勢中。日本與德國已經調高利率；美國目前的通貨膨脹率約為每年5.5％，在近兩個報告期間內，聯邦準備體系內的「自由準備」（Free
    Reserve）都有降低的趨勢。在目前情況下，我不認為「聯邦準備銀行」有放鬆銀根的可能性。


    所以，我目前正在買進指數的實出選擇權（put），建立空頭部位；現在的規模還不算大，但如果出現價跌量增的盤勢（大約1.7億股），「道瓊工業指數」跌破2,752的水準（8月份的高價），我會積極賣空。'
