  md: '# 第五章

    趨勢的精義


    # 上升趨勢？下降趨勢？


    # 趨勢的意義


    很少人（包括專業人士在內）真正瞭解何謂「趨勢」，這是最令我訝異的現象之一。例如，如果某人把圖5.1擺在我面前，並問我對於黃金趨勢的看法，你認爲我將如何回答？最合理的答案是：「你是指哪一種趨勢而言？」


    我觀察這份圖形時，其中存在三種截然不同的趨勢：長期趨勢，它是向下；中期趨勢向上；短期趨勢又是向下（參考圖5.2）。判斷價格趨勢時，你必須非常明確，而且有一致性的標準。


    我訓練交易員時，幾乎每個人都會拿出趨勢線繪製並不正確的圖形給我，並說道：「維克，你看這個，趨勢線已經被突破了，是不是很好的買進機會？」如果你並不真正瞭解何謂趨勢，你幾乎可以隨意繪製任何的趨勢線，但根據這種「趨勢線」所做的結論並無用處。


    第7章將詳細解說如何以一致性的方式正確地繪製趨勢線。目前，讓我們進一步探討何謂趨勢，以及它如何產生變'
  merge: -1
  img_proc: true
- pgno: 100
  md: '化。


    # 簡化為根本重點


    在「道氏理論」中，你能得到的最重要知識之一，可能是它對於趨勢的定義，但這僅蘊含在說明中，它並未明文解釋。道氏將趨勢劃分為三類：長期、中期與短期的趨勢。唯有真正瞭解趨勢的意義，才可能判斷趨勢何時發生變化。而且，唯有精確地判斷趨勢的變化，並精確地設定買、賣時機，才可以提升利潤或降低損失。由「道氏理論」中，我整理出下列的定義：


    # 圖5.1


    1990年12月黃金期貨——黃金的趨勢如何？圖5.2標示三種趨勢。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_100_0.png)'
  merge: -1
