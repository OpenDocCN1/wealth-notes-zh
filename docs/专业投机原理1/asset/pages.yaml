- pgno: 3
  md: '# 代 序


    當 Victor Sperandeo 將手稿交給我，我並沒有因爲文稿量大而感到驚訝。另一方面來看，我也不感到訝異，畢竟他只描繪出他對市場具有廣泛知識的一小部份。


    我每月和 Victor 會談三或四次。我們共同分享市場觀點，而且他總是慷慨地提出他對市場走勢的看法。我感到驚奇的是，他對於市場的看法從未脫離他對世界的論點。在談話時，他總會帶進哲學、心理學、政治學和經濟理論，然後才告訴你道瓊指數或重要商品的交易區間。他的興趣並非閒來無事。他主動積極的心智活動總會設法將上述主題及其對市場的影響力結合起來。


    他對市場的看法以及在本書中所陳述者，是獨特而統合的。Victor 並非技術分析師，也不是單純的基本分析派人士，更不是價值玩家或敏捷的時機掌握者。他的操作採折衷而專注的方式，我很高興他終於能訴諸文字。


    Victor 選擇了各種方法中最好的因素，以及他獨立研究的心得，使得本書對所有人都顯得有價值，不論讀者的興趣或專業屬於股票或是期貨市場。有關經濟及商業循環的章節，其寫作方式淺顯易懂，所提出的觀點有助於對經濟體系運作不理解的讀者。對於成功及失敗心理有興趣的讀者，務必閱讀第二'
  merge: -1
  img_proc: true
- pgno: 4
  md: '篇。


    我總是和Victor 或其它市場專家有相左的看法。但是對於討論市場的書籍來說，我相信只要從中汲取一個觀點，便能值回票價。從這樣的觀點來判斷，本書不僅值得購買，而且十分廉價，在探討市場的文獻中無異一大貢獻。


    Leon G. Copperman

