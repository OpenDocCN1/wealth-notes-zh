  md: '# 圖5.7


    12月瑞士法郎期貨——價格突破，通常是理想的買進訊號。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_110_0.png)


    TQ 20/20 © 1991 CQG Inc.


    觀察每天的價格波動時，「突破」是唯一對於每一種市場參與者——不論是交易者、投機者或投資者——都很重要的走勢。猶如李氏の評論：


    # 每天的波動（Daily Fluctuations）：——根據單


    日的指數波動推論，幾乎必然為錯誤，而且也沒有什麼價值，唯有「狹幅盤整」的走勢為例外。然而，每天的價格走勢都應該加以記錄，因為一系列的單日走'
  merge: -1
