- pgno: 314
  md: '能獲利而不可能損失。如果價格持續朝有利方向發展，並到達當初的目標價格，則了結三分之一或一半的獲利，並調高停損。如果價格仍朝有利方向發展，則繼續調高停損。如果你是以長期趨勢交易，甚至可以在適當的價位擴大部位的規模，當然這必須考慮你交易的市場性質。


    # 守則 8：在弱勢中買進，在強勢中賣出。應該以買進的意願來同等對待賣出。


    這條守則主要是適用於投機與投資行為，但也可以適用於短期交易。它是守則2——順勢交易——的輔助定理。如果 logistics 以中期趨勢投機，提升獲利潛能的方法，是在小漲勢中賣出，在小跌勢中買進。如果你是以長期趨勢投資，應該在空頭市場的中期漲勢中賣出，在多頭市場的中期跌勢中買進。


    不論在中期或長期趨勢中，上述的原理也適用於擴充已獲利的部位。在理想的狀況下，你當然希望在空頭市場的小漲勢高點附近投機賣空，在多頭市場的小跌勢低點附近投機買進；並在空頭市場的中期漲勢高點附近投機賣空，在多頭市場的中期跌勢低點附近投資買進。在許多情況下，2B準則非常適用這項策略。


    許多市場參與者都有明顯的多頭或空頭傾向，而且僅願意做多或做空。事實上，許多市場參與者把做空行情視為瘟疫，避之猶恐不及。這是嚴重的錯誤，完全違背市場的性質。如果「趨勢是你的朋友」，則雙向運作是維持友誼最佳的方式。任何精練的多頭玩家，也必然俱備做空的知識——他僅需要做反向的推理。在做空行情方面，獲利的速度通常較快，因為下跌'
