  md: '# 導 論


    # 「賭博例」的奧祕


    「賭博例」（Gamboni）的奧祕便是如何在金融市場中生存的奧祕。瞭解它…真正地瞭解它…你可以成爲一位成功的交易者、投機者或投資者。所以，故事的發展如下：


    喬是一位撲克好手，一位真正的玩家。事實上，他的技巧已經到達爐火純青的地步，所以他必須到處旅行，以尋找不認識他而又願意接受高賭注的對手。某天下午，在芝加哥鄰近的一家酒吧中，他與酒保閒聊著，並問道：「這附近有沒有好的撲克賭場？」


    「你是指多大的賭注？」


    「很大！」喬說道，「你所知道的最大賭注。」


    「嗯，我聽說附近的農場有一個賭局。距離這裡蠻遠的，但那裡農民賭得很大。讓我先打個電話確定一下。」


    於是，這位酒保打了電話，並告訴喬如何到達那個農場。


    當天晚上，經過長距離駕駛後，喬把車子停在一個荒涼的穀倉前。他慢慢走進穀倉內，小心避開地上的豬屎。他在穀倉後頭發現一個房門半開的房間，燈光夾著嫗嫗的香煙由房門中'
  merge: -1
  img_proc: true
- pgno: 22
  md: '透出。一股熟悉的興奮感覺穿過全身，他走進房間，並自我介紹。


    穿著工作服的農民圍坐在一張圓桌邊，每個人都嚼著雪茄或煙斗。喬粗略估計一下桌面上的賭注大約有4萬美元——太完美了。於是，他坐下來。負責發牌的農夫說道，「下注！」所以，喬開始他的賭局。


    經過約一小時後，喬沒有什麼輸贏。這個時候，他拿到三張A與兩張Q——富爾豪斯（full house）。桌面上的賭金已經相當可觀了，他又加碼1.5萬美元。接下來的兩家都沒有跟進，但坐在對面那位面無表情的農民不僅跟進，而且又加碼1.5萬美元。喬確定他一定想唬人，所以跟進後，把手上A帶頭的富爾豪斯攤下。那位農夫也攤下手中的牌：毫無配對的三張梅花與兩張方塊。強壓著笑容，喬開始整理桌面上的賭金。


    「請等一下，」這位農夫帶著不高興的語調說道。


    「等一下，你什麼意思，」喬說道，「你什麼也沒有。」


    「請你回頭看右方的標示，」這位農夫笑道。


    於是，喬回過頭看：


    # 三張梅花與兩張方塊構成「賭博例」，

    它在此處代表最大的一手牌


    喬實在非常生氣，但規則就是規則，於是他以剩餘的賭金繼續玩下去。又過了一小時左右，他拿到三張梅花與兩張方塊'
  merge: -1
  img_proc: true
- pgno: 23
  md: '…「賭博例」！於是，他把所有賭金都押進去了，對手仍然是這位面無表情的農夫，在最後一輪的加碼中，他把手腕上的純金勞力士也押上了。這位農夫攤開手中的牌：Q帶頭的黑桃同花順。喬也攤開他的「賭博例」，並開始整理賭金。


    「等一下，朋友，」這位農夫說道，臉上的笑紋幾乎可以夾死蒼蠅。


    「但我拿了一手賭博例，」喬大叫道。


    「完全沒錯，但請看看那邊的標示，」他指著喬的左後方。


    # 此處每晚僅允許一次「賭博例」


    喬除了鞋上沾滿的豬屎以外，身文分文的離開穀倉，不過他還是感謝信用卡的發明者。那位面無表情的農夫開著拖車回家，手腕上吊著純金的勞力士。


    所以，「賭博例」的奧祕是：如果希望獲勝，你必須瞭解規則；另外，你必須願意坐上賭桌，你才有獲勝的機會。


    這便是本書討論的範圍：界定賭桌上需要的知識與規則，並使你經年累月地獲取穩定的利潤。除非你可以利用適當的計劃將知識付諸執行，並以規則組織既定的計劃，否則全世界的知識毫無用途。在金融市場中，這意味著：取得相關的知識，界定操作的哲學，建立資金的管理方法，並嚴格遵守明確的規則，擬定每天的例行決策。根據本書所列觀念，你可讓資金發揮充分的功能，如果你能夠嚴格執行相關的方法，你必然可以'
  merge: -1
