  md: '市場指數必須相互確認」應該改為「所有的相關指數都必須相互確認」。1987年10月份崩盤後的情況便是一個典型的例子，它說明這項原則的必要性。


    首先，你應該記得「道氏理論」中有一項「假設」：「這項理論並非不會錯誤」。這項假設便適用於崩盤後的情況。根據「道氏理論」，我認為1987年10月份崩盤是空頭市場的第二支腳。所有相關指數都跌破先前的主要低點──這顯然是「道氏理論」中所謂的空頭市場。然而，空頭市場卻未出現。若由事後的角度而以嚴格的「道氏理論」解釋相關的發展，則1987年10月19日之後的盤勢是屬於主要多頭市場的次級修正走勢；然而，兩種指數都向下跌破前一波次級修正走勢的低點，市場卻未進入空頭行情，這是1991年以來首度發生的現象。


    它必須被歸類為修正走勢，因為它不符合李氏對於主要空頭市場的定義。根據我的看法，如果Fed沒有在10月份放鬆銀根，而德國與日本也沒有在12月份採取寬鬆的貨幣政策刺激經濟，則空頭市場應該是合理的發展，如此才可以修正先前數年不當的投資現象。然而，它們畢竟干預了，S&P在12月份見底，市場最後又創新的高點。這個時候，「所有的相關指數都必須相互確認」的原則便開始發揮它的功效。


