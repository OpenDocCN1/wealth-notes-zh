    我過去經常從事S&P期貨的當日沖銷交易。在電腦交易程式發明以前，你絕對不會見到長達1 1/2時的跌勢，中間沒有夾雜任何反彈。你也很少看見目前經常出現的尖銳V-型（或顛倒的V-型）走勢。由於機構法人的交易量非常龐大，一般大眾因為恐懼而退出市場，目前從事S&P的當日沖銷交易，你感覺好'
  merge: -1
  img_proc: true
- pgno: 125
  md: '像有人拿槍指著你。任何時候程式經理人都可以扣發板機，於是市場在毫無預兆的情況下，突然出現不利於你的走勢，而你根本沒有迅速認賠的機會，尤其交易部位如果很大的話。


    市場一旦出現電腦程式交流的短線波動，如果你站在錯誤的一方，可能造成致命的結果。當然，如果你站在正確的一方，獲利也相當可觀。問題是：這類走勢是由一個人發動，除了少數人之外，沒有人知道整個交易計劃，所以目前短線交易非常困難，而且經常演變為擲骰子的賭博。然而，分析S&P
    500現貨與S&P 500期貨的走勢圖，精明的投機者或投資者可以辨識電腦程式交易的模式，並以此設定最理想的買賣價位。⑥以此方式掌握進、出場的時機，這對於投資組合的績效有相當大的幫助。相反地，在電腦程式交易的威脅下，以「市價」大筆買、賣股票或期貨，是相當愚蠢的行為。


    就中期與長期的角度來說，電腦程式交易基本上無法操縱價格，但可以改變價格趨勢的性質，加速中期價格走勢的發展。就上升趨勢而言，它們可以引發大量的投機性買盤。就下降趨勢而言，可以對主要跌勢造成可怕的影響，就如同1987年10月崩盤的情況。


    在1987年10月初，市場對於基本面已經產生懷疑。本益比為21倍，這是歷史上最高的本益比之一。帳面價值對股價的平均比率在名義上（nominally）高於1929年的水準，若經過通貨膨脹的調整，更高得離譜。這些因素再加上經濟各部門的負債情況，使市場已經瀕臨一個主要的修正走勢——如果不是空頭市場的話。就當時的情況來說，問題已經不是「是否」而是'
  merge: -1
  img_proc: true
- pgno: 126
  md: '「何時」。


    10月19日以前，法人機構的數十億美元資金留在股市內，純粹只是為了追求短期避險、套利與操縱策略的利潤。顯而易見地，當時如果Fed大幅緊縮信用，或美元匯率大幅下跌，這些「熱錢」會抽離股市，加重市場跌勢。當時，Barron’s雜誌曾經訪問我，並將訪問內容刊登於1987年9月21日的一期中：


    > 股票市場的跌勢形成氣候時，電腦程式交易會誇大整個情況的嚴重性，並造成史無前例的急跌走勢…


    這種誇大的跌勢，通常稱為「集體倒貨」（unwinding），所以主要多頭走勢的頭部附近充滿不確定性與風險。這種情況 下，如果持續以全部資金投入股市，顯然完全忽略風顯/報酬的合理原則。情勢即將變化時，首先變化的人往往獲利最豐碩。


    # 純粹派信徒


    在正式的理論基礎上，某些技術分析者相信：價格即是一切；所有關於市場的已知或未來的可知資料都已經包含在市場價格與走勢中。這便是純粹的技術學派信徒，其中較著稱者為艾略特（R.
    N. Elliot）與Krondodiov；某些不全然瞭解Edwards與Magee理論的信徒們也是如此，還有某些異端的「道氏理論家」。在不同的形式與程度上，純粹的技術學派信徒主張，價格走勢中存在一種形而上的必然性（metaphysical
    inevitability），它們是由命運、上帝、演化、或某種宇宙的力量決定，經濟分析與預測僅是要找尋正確的相關性或循環時間架構，闡明這些價格走勢的性質。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '試圖以嚴格的循環理論或純粹的數學方法預測未來，完全忽畧市場活動中的主觀性質。另外，這種態度也忽略政府干預與聯邦準備政策對於長期趨勢可造成的明確影響，有關這方面的問題，我們將在第九章與第十章中討論。在某種程度內，這類理論系統確實可以成功地運用於行情預測與分析，這主要是因爲它們已經脫離一致性理論需要的嚴格基礎。或許它們的理論架構暫時符合市場的行爲性質，因爲市場參與者具有某些一致性的行爲，這種情況下，只是短期的技術性觀察；或許它們的理論架構非常普遍或界定過於鬆散，而使用者有相當程度的解釋與推論空間。


    就第一種情況來說，以技術分析模型擬定投機或投資決策，並預測未來走勢的幅度大小與時間長短，其績效將缺乏一致性——市況會急速的變化。就第二種情況來說，理論架構實際上將妨礙健全的推論與分析。總之，市況將改變，市場參與者的態度將改變，這類技術模型也終究會無效。


    我必須再度強調，此處談論的並不是指所有的技術分析方法與運用，我僅指其中某些學派，他們主張：未來一切都已經預先決定，並因此而能以嚴格的數學模型預測未來。


    # 摘要


    技術分析可以提供重要的資訊，但需要以合理的態度看待它：技術分析是歸納重覆發生之價格模式的一種方法。這些價格模式之所以產生，主要是因爲市場參與者在擬定決策時，都俱備類似的心理架構。在整個歷史上，市場對於類似情況通常'
  merge: -1
  img_proc: true
- pgno: 128
  md: '都會產生特定的反應，而技術分析的最大貢獻便是提供一種方法，衡量這種反應的趨勢。


    在這種體認之下，技術分析可以為市場分析與經濟預測提供一個新的觀察角度，這是投機者與投資者經常忽略的一個領域。經過適當地瞭解與正確地界定，技術分析可以擴張市場知識的領域，並顯示某些原本無法察覺的獲利機會。


