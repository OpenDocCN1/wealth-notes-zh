- pgno: 168
  md: '# 圖8.6


    英鎊期貨週線圖——10週/30週均線穿越法則的賣出點。當10週移動平均線穿越30週移動平均線，而兩者的斜率都向上，這代表賣出訊號。請留意，圖形中分別呈現一個賣出訊號與另一個買進訊號。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_168_0.png)


    TQ 20/20 © 1991 CQG Inc.


    當然，猶如所有的技術指標一樣，這些指標也絕對無法 100％的有效。以1989年10月19日的情況來說，如果你僅採用10週/30週均線穿越法則，你勢必陷入崩跌的走勢中。當你的指標發出賣出訊號時，崩盤早就結束了。


    在商品期貨市場中，並沒有明確的法則判斷什麼期間的移'
  merge: -1
  img_proc: true
- pgno: 169
  md: '動平均最理想；不同的市場與不同的時間，都需要採用不同期間的均線。例如，作者撰寫本文時，200天的期間適用於債券、美元指數與黃金，其他商品則不太適用。


    基本上，你必須體認一項事實，就如任何技術分析工具一樣，移動平均的效能也會隨市場情況的不同而改變。你的時間架構愈短，情況愈是如此。所以，你必須測試不同期間的均線，並尋找一個最理想的期間。當它們不再有效時，你便必須調整。以豬腩來說，我一向採用4週與11週的均線，並以類似10週/30週均線穿越的法則交易。然而，最近，這組均線的訊號開始顯得遲鈍，我可能需要再測試其他的期間了。


    運用移動平均線時——或任何其他技術分析工具——最嚴重的錯誤便是對它產生一種執著的態度。換言之，你絕對不可以認爲自己已經發現「終結所有法則的一項法則」；這世界上沒有這種玩意兒。每一個市場都是處在不斷變化的程序中，任何方法若未考慮這項事實，它已經觸犯最根本的錯誤。


    在哲學上，我非常不認同「實用主義」（Pragmatism）③，但就交易法則而言，我的態度卻相當務實。當它不再有效時，你便應該拋棄它。否則，就如同人與人之間的關係一樣，它會讓你大失所望。我便目睹許多這類情況，這些人都曾經是「華爾街」最頂尖的交易員。所以，不論你發現任何的技術性方法或指標，萬萬不可讓自己的感情涉入其中。


