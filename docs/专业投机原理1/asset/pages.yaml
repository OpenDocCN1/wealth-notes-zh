  md: '在」，我瞭解這項陳述並沒有足夠的證據，但中央銀行確實是起因。稍後。我將解釋中央銀行的貨幣與信用擴張，如何導致繁榮/衰退的循環。在此之前，我先提出一個歷史上的案例，這是一個不斷重覆出現的典型範例，只是玩家不同而已。


    雖然18世紀中期以前，經濟循環還沒有正式出現，但「英格蘭銀行」（Bank of England）在1692年已經開始從事中央銀行的業務。當時，第一種不可兌換的紙幣（fiat
    money）已經出現，稱爲The Royal Commonwealth of Massachusetts。即使是在銀行業務的早期發展階段中，某些政府顧問顯然已經知道，部份準備金制度與信用擴張的短期利益。說明這方面的情況，最佳的例子或許是所謂的「密西西比事件」（Mississippi
    Scheme），它發生於18世紀的法國。②


    路易十四當政期間（1643-1715），由於其奢侈荒唐的行爲，法國的財政與經濟狀況百病叢生。在王室超額支出的刺激下，巴黎與其近郊曾經出現一段繁榮期，但路易十四1715年過逝之後，國內與對外貿易都開始衰退，法國政府的償付能力出現嚴重的問題。


    法國的公債總金額高達30億銀幣（livres）③，公債的名稱爲billets d’etat，國家每年稅收爲14.5億銀幣，政府預算爲14.3億銀幣，但不包括30億公債的利息。政府是否應該宣佈破產而重新開始，當時曾經引起一場辯論，但政客們擔心這會引來革命，所以只有採用其他的權宜之計。


    政府最初的因應措施是採用重鑄貨幣的方式，將銀幣（livre）貶值20%。新銀幣的重量爲舊銀幣的4/5，面值卻相'
  merge: -1
  img_proc: true
- pgno: 237
  md: '同，並以法令強迫人民兌換新的銀幣。結果，國庫雖然增加0.72億銀幣的收入，但整個國家的貿易運作更加混亂，經濟也更加衰退。


    為了平息民眾對於貶值的抱怨，政府稍微調降稅率，並展開一項改革計劃，清除稅務人員普遍的貪污現象。這些措施轉移了大眾的注意力，並避開國家的財政危機，但政府的償付能力並沒有因此改善。


    這個時候，一位蘇格蘭人John Law 出現了。他是一位狂熱的賭徒，也是一位經常周旋於貴婦人之間的花叢老手，他因為某位女人而在決鬥中殺死一個人，被迫由蘇格蘭逃至歐洲大陸。他在歐洲得以發揮他的賭博技巧，並運用他對於貨幣、信用與政府融通的新穎觀念。Law
    堅信，在沒有紙幣的輔助之下，整體貴金屬貨幣體系無法因應商業交易的需求，並會侷限經濟成長。換言之，猶如凱恩斯一樣，Law 認為，透過妥善管理的信用擴張，並以通貨膨脹的方式發行貨幣，即可以達成經濟的繁榮。（我非常好奇，凱恩思的思想是否受到Law
    的影響。）


    Law 向當時法國攝政王Orleans 公爵進言，④說服攝政王相信私有中央銀行的必要性，並採行他的貨幣與信用理論，即可讓法國重新成為經濟強國。


    1716 年，攝政王發佈命令，授權Law 與他的兄弟成立一家銀行Law and Company，並發行1.2 萬股的股票，每股 500 銀幣（livres）。購買股票時，可以支付四分之一的銀幣，其餘以公債（billets
    d’etat）抵付。攝政王又授權Law 發行銀行紙幣，並'
  merge: -1
  img_proc: true
- pgno: 238
  md: '宣佈紙幣可以依據面額繳納稅金（某種程度內，這相當於是宣佈紙幣爲法幣[legal tender]）。


    Law並不是銀行業務的生手。他父親是蘇格蘭的銀行家，Law本人精通貨幣、信用與交易業務，他瞭解必須博得大眾對於銀行紙幣的信心，如此整套計劃才得以運作。所以，發行紙幣時，他宣佈銀行紙幣見票即可以兌換一定成色的銀幣。大眾普遍預期銀幣會進一步貶值，所以非常願意持有銀行的紙幣；發行之後不久，紙幣便對銀幣出現溢價（premium）。


    大眾對於Law與紙幣的信心迅速增強，紙幣兌換銀幣的溢價高達15％，而銀行也在法國的五大金融中心設立分行。這個期間，公債（billets d''etat）的交易價格則有78.5％以上的折價（discount）。


    截至目前爲止，Law完全根據健全的經濟學原理行事。畢竟，當時法國需要的是人民對於國家信用與貨幣的信心。Law發行充分可以兌換的通貨，便具有這些功能。


    事實上，持有紙幣可以防範銀幣的貶值。只要大眾繼續相信銀行的信用，以及紙幣與白銀之間的兌換能力，他的紙幣「就像黃金一樣有價值」。由於人們對於通貨恢復信心，國內與對外貿易也開始復甦。稅收情況趨於穩定，公債的清償雖然緩慢，但總是在逐步改善。


    Orleans公爵雖然不瞭解這究竟是怎麼回事，他卻知道神奇的紙幣治癒了法國所有的經濟病証。由於他認爲這是迅速清償政府公債的良機，攝政王在1717年犯下兩項致命的錯誤。'
