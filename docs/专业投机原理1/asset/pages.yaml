  md: '差異未必非常明顯，這也是「道氏理論」中的主觀成份之一。


    李氏將次級折返走勢比喻為鍋爐中的壓力控制系統。在多頭市場中，次級折返走勢相當於是安全閥，它可以釋放市場中的超買壓力。在空頭市場中，次級修正走勢相當於為鍋爐添加燃料，以補充超賣流失的壓力。


    # 結論


    「道氏理論」並不是一種俱備絕對包容性的市場預測方法，⑩但任何態度嚴肅的投機者都不應該忽略這項知識。「道氏理論」的許多原理都蘊涵於「華爾街」和市場參與者的日常用語中，只不過一般人並沒有察覺而已。例如，市場專業者對於「修正走勢」（correction）都有普遍的認識，但就我瞭解，唯有「道氏理論」對於這項名詞提供客觀的定義。


    研究「道氏理論」的基本原理之後，我們俱備一種根本的知識，瞭解如何根據目前與歷史的市場指數，評估未來的價格走勢。我們對於趨勢已經有一種普遍的概念。我們知道，任何市場都同時存在三種活躍的趨勢，它們的相對重要性對於交易者、投機者與投資者都各自不同。


    瞭解這些概念之後，可進一步探討價格的趨勢。畢竟，如果你知道何謂趨勢，而且也知道它在什麼時候最可能發生變化，你實際上已經掌握市場獲利的全部知識了。'
