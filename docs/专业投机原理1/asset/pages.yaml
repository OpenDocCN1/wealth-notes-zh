- pgno: 261
  md: '廣義衡量值M3為4.066兆美元，而「聯邦準備區域銀行」的準備金存款總額為603億美元。在4兆多美元的貨幣供給中，實際的鈔票僅有2,284億美元，代表其餘貨幣是存放於各個機構中的某種存款（負債）。


    所以，準備金資產對貨幣總存款的比率為1：70。即使我們認爲M3不足以代表真正的貨幣總供給，同期的一Barron’s雜誌也刊載，Fed持有價值233,966,000美元的政府證券。假定準備率的平均淨值為10％，則FOMC12位成員便有權力為整個經濟體系增加2.3兆美元的信用——超過M3的一半！


    現在，你是否瞭解公開市場操作，何以是如此強而有力的貨幣政策工具？


    希臘的大哲學家柏拉圖（Plato）相信，一般人無法管理自己的生活與周遭的事物。在理想的狀況下，世界應該由哲學之王掌管。某種層面上，柏拉圖的理想已經實現。FOMC的成員便是美國經濟的哲學之王，而由於美國是世界上最強大的工業國家，所以這12位成員足以影響全球的經濟。他們是國王，而市場是他們的子民——他們的行爲僅受到法律的規範。


    FOMC僅由12位成員構成——「理事會」的成員與五家區域銀行的總裁——他們投票決定政策，以主宰自由市場的經濟活動。他們根據總體經濟數據設定目標，並採取行動，重要的經濟數據包括：失業水準、產能使用率、消費者物價指數（CPI）、生產者物價指數（PPI）、貨幣供給（以M1、M2與M3來衡量）的成長與成長率、貿易餘額、貨幣供給水準（M1、M2與M3）的指數、準備金餘額、以及其他指標。他們隨'
