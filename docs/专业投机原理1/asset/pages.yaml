  md: '在複雜的市場經濟中，大多數的經濟交易會涉及某種形式的信用。零售店由批發商進貨，通常在30天或以上的時間才會付款。汽車經銷商可以借取資金購買存貨，這是因為它們可以高價轉售。公司企業可以發行債券融通事業的擴張。投資者可以融資買進股票。然而，不論信用的形式如何，都代表對於未經消費產品的請求權，交易的一方提供信用，另一方則承諾清償。放款者延後消費的行為，借款者則以未來的消費換取目前的消費。


    我先前曾經談及，銀行從事放款業務時，並沒有借出實際的儲蓄，而僅是創造新的貨幣。雖然如此，但實際的儲蓄（以資本的形式）確實必須承擔風險。往好處看，借款者將創造足夠的新財富，以清償貸款而仍有獲利或持平。往壞處看，如果借款者未履行清償的義務，既有產品（儲蓄）將被消費或變為無用。企業借取資金投資新的機械設備時，會造成雙重的影響：借款者承諾儲蓄一<|message|>
    份未來的利潤，放款者必須以實際的儲蓄承擔風險。由這個角度思考，不論政府的財政與貨幣政策如何，信用與儲蓄之間都有直接的關連。


    你借取資金時，實際上是借取某人對於未消費物品的請求權；如果你認爲我太過於強調這個觀念，我要提出辯解，因為實在太多的人不瞭解儲蓄、信用、投資與財富之間的關係。儲蓄是信用擴張的基礎。信用是加速資本財投資的燃料。資本財的累積則可以加速經濟財富的成長率。然而，不論任何時候，貸款被「一筆勾消」時，遲早某個人必須以某種方式完全承擔儲蓄的損失；換言之，物品被消費而沒有重置。'
