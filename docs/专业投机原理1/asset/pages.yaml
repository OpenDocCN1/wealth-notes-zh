  md: '「約翰？」


    「他媽的，不要！！！它一定會下來！」


    他用力掛斷電話，猛搥桌子，一面對螢幕叫道「下來，你這個XXX…！」突然之間，他再也無法承受了。


    「比爾！！！把那些XXX全部補回來…現在！」


    然後，他氣衝衝地離開辦公室，直奔「三一廣場」的酒吧，以威士忌澆熄心中的怒火。


    隔天早上，債券向下跳空開盤，連續五個小時都籠罩在沉重的賣壓下。場內傳出消息，日本方面大量拋售債券。比爾垂頭喪氣地看著盤面。約翰並不在辦公室；他宿酒未醒而在家裡睡覺。


    獵食者奧格與交易者約翰，兩者都是人類，他們的天性同樣都是源自於數百萬年來的演化程序。在奧格與約翰之間，相似性遠多過相異性，相異性僅是程度上的差異而已。兩者都俱備高度演化的智慧。兩者都俱備想像力（山洞內的壁畫便是證據）。兩者都有情緒。最大的差別是，約翰擁有較多的智能與知識。


    然而，何者的行為更可以配合天性與環境呢？顯然是奧格。他的忿怒與恐懼對他有所助益，協助他保護自己，並獲得食物。在另一方面，約翰也呈現基本上類似的情緒反應，他的行為卻有自我破壞的效果。'
