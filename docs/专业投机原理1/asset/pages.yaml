  md: '觀與積極的角度來觀察自己所犯的錯誤。


    追求完美的人，試圖把自身與理想化的自我形象和內部的指令視為是一體：


    在意識或潛意識中，〔他試圖〕以自己的標準為傲。他不會質疑它們的有效性，並嘗試透過某種方法將它們實際化。他可能以實際行為試圖實現它們。他應該是每個人推崇的對象；他對於每一件事的知識都應該優於每一個人；他絕不應該犯錯；他嘗試的每一件事絕不該失敗…而且，在他的心智中，他確實自認符合這些超級標準。他的傲慢甚至不考慮犯錯的可能性；萬一發生錯誤，他可以歸咎於外部因素。他專斷設定的正確性是如此的僵化，所以他的心智根本不可能犯錯。


    在一組特定的「應該」驅使下，透過遵循「應該」追求完美，他們必須嚴重地逃避現實。這些人要求讚美、尊敬與盲目的服從。他們可能非常� silence而迷人，尤其是對於願意讚美他們的新來者。他們試圖征服異性、影響周遭的朋友、蒐集奇珍異品…。


