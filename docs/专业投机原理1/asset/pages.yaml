- pgno: 324
  md: '這雖然是極端的案例，但重點是你有時候會因爲執行不当而受害，而且你不知道什麼時候會發生。你應該養成重覆核對的習慣，在可能的範圍內，應該再次確定報價。如果你覺得資料或情況有些詭異，應該澄清。不要理會場內的人有多忙碌，他們的工作是提供精確的資訊、適當的執行與及時的報告。


    我並沒有指責場內經紀人的意思。如果你有機會的話，應該在交易忙碌的時候，參觀交易所場內的情況。某些時候，情況會趨於白熱化，而經紀人也是人，他們也會犯錯。你不可誤以爲他們是永遠不會犯錯的機械。你必須保護自己的利益，尋找最可靠的經紀商，儘可能重覆確認。


    最近又發生另一個例子，我設計一套S&P期貨的當日沖銷系統。根據紙上作業判斷，這是一套相當不錯的系統，於是我把它交給助理作臨場測試。理論上，它的績效非常理想，但我沒有想到進、出場需要各浪費三檔。誰想得到市場的交易量竟然如此稀少，小量的測試便足以驅動3檔的價格！然而，實際情況便是如此，我們必須調整系統以涵蓋執行上的誤差。


    # 守則18：必須保有自己的交易記錄。


    某些情況下，尤其是交易自己帳戶時，你希望拿起電話，直接下達交易指令，而不留下任何的記錄，因爲你認爲經紀商會登錄所有相關資料。可是，經紀商也可能犯錯。


    每下達一個交易指令，你便應該記錄日期、時間、交易工具、買進或賣出、下單時的報價、以及實際的成交價格。定期核對自己的記錄與經紀商的報告。如果沒有自己的記錄，你無'
  merge: -1
  img_proc: true
- pgno: 325
  md: '從判斷經紀商的報告是否正確。


    # 守則 19：瞭解、並遵守法則！


    對於每一條交易守則，你至少有五種方法違背它，而且交易者總是會想出新的方法。依此推理，我列舉十八項交易守則，你至少應該有九十種方法違背它們。每當你違背一項交易守則，你又發現一種虧損的新方法。


    # 85％的法則


    沒有任何人可以永遠處於100％完美的狀況。有太多事物可能使你分神。你可能與妻子（丈夫）或心愛的人爭吵。某人可能在緊要關頭打電話給你。周遭的一切都可能使你分神。


    例如，1984年5月4日，我應邀到芝加哥演講。當時與我同台演講的還有Walsh Greenwood的總經理Steve Walsh，以及一位造市者Gary Knight。演講後回答問題時，一位聽眾提出，「我希望請教這位造市者。交易所的相關規定偏袒擁有席位的造市者。」


    毫不猶豫地，Gary說道，「是的。」


    「我認爲這並不公平，」這位聽眾說。


    「那你可以買一個席位，」Gary回答，「目前的價格大約25萬美元。」


    務必記住，遊戲規則有利於場內交易員；這是他們維持生'
