- pgno: 119
  md: '在上升趨勢中，高於目前價位的先前高點為壓力，低於目前價位的先前低點則為支撐。在下降趨勢中，低於目前價位的先前低點為壓力，而高於目前價位的先前高點則為支撐。在上升趨勢中，如果突破先前的
    // 高點而價格繼續攀升，波浪觀察者將是買家，而任何顯著的連續向下跳動（ticks，「跳動」是指價格的最低變動單位；股票為1/8，選擇權為1/16，以及其他等等）代表可能的賣出訊號。如果突破先前的
    stimuli？？？？？高價之後，價格未能繼續向上挺升，他們將賣出，任何顯著的向上走勢則代表可能的買進訊號。另一方面，向下的趨勢則適用類似而反向的推理。波浪觀察者永遠試圖掌握「他們」在想什麼、「他們」準備做什麼，他們是以價格走勢的性質做為判斷的方法。②


    由於場內交易員大多屬於波浪觀察者，所以投機者與投資者應該瞭解他們對於短期價格趨勢可能造成的影響。在短期內，某支個股或商品的價格，可能僅因為他們之間的互動行為而上漲或下跌數點。


    例如，假定某股票交易所的場內交易員發現，XYZ股票的賣壓很輕，而股價下跌也沒有引發明顯的追殺賣盤。如果這種情況持續一陣子，則他們可能認為XYZ幾乎沒有什麼賣壓。這種判斷下，他們可能乘著回檔的時機開始承接——在短線低檔開始買進——然後試盤。


    假定XYZ的買-賣報價為40 1/4-40 3/8，③而3/8的價位僅掛著500股的賣單。在1/2、5/8或更高的價位，賣單的情況究竟如何，僅能猜測，但他們認為買盤的力道相當強，一些精明的交易員開始買進股票測盤，以觀察買、賣單的變化。最重要'
  merge: -1
  img_proc: true
- pgno: 120
  md: '者，當價格開始變動時，他們將觀察外來的委託單是否變化，若是如此，這些買、賣單的關係如何。


    如果賣單不斷湧現，交易員只好放棄而拋出股票，再找另外的機會。然而，假定市場中出現買單，並在1/2與5/8的價位成交，接著又有一些經紀人跟進。如果這種情況持續下去，這支股票很快地便形成一種短線的多頭氣勢。


    這個時候，場內交易員根本不知道XYZ公司的盈餘展望是否存在任何變化，雖然當初的賣壓不重，很可能便是因為這方面的緣故。總之，不論該公司的展望如何，如果股票出現相當的漲幅，便形成一個小型的飆漲行情。對於場內的多頭交易員來說，他們關心的僅是價格上漲而已。


    另一方面，場外的大筆賣單隨時可能讓漲勢中斷。由於這個小型飆漲走勢純粹是投機行情，所以在上檔接手的買盤將遭到最嚴重的損失。小型的崩跌走勢也適用類似而反向的推理，這種走勢經常發生在小型飆漲走勢結束後不久。電腦程式交易可以發動、加速或/與擴大整個程序。


    如果投機者或投資者瞭解這類波浪觀察者的行為與影響，則可將此知識運用於許多方面。第一，場外的觀察者④在報價螢幕中發現這類活動時，可以根據盤中價格的循環，設定中期或長期的買、賣價位，提高獲利。第二，根據價格走勢與基本面之間、以及它與大盤之間的關係，可以在中期與長期的持續力道上判斷價格走勢的「合理性」(legitimacy)。最後，波浪觀察者活動的性質，代表市場共識的一項關鍵指標。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '最後一點對於投機者可能最爲重要。猶如地質學家監視火山活動預測地震，投機者可以監視盤中與每天的市場活動，衡量未來行情的發展。特定來說，成交量、漲-跌家數比率、重大經濟或市場新聞引起的短期反應、以及價格變動率等因素，都可以評估市場參與者的主要心理驅動力量。


    以1989年10月13日的情況來說，僅僅因爲「聯合航空」併構案發生融通失敗的消息，使市場陷入恐慌性的賣壓中。顯示市場當時的心理結構非常脆弱。市場顯然極度懷疑多頭走勢的持續力道——只要有一些空頭或次級修正的徵兆，跌勢便一發不可收拾。


    # 人爲操縱者


    在「華爾街」，人爲操縱（manipulation）是一項齷齪的字眼。它具有不公平與不誠實的涵意，這種行爲經常被聯想爲賭場中的作弊。事實上，情況截然不是如此。根據《Random
    House Dictionary》（1969年大學版）的解釋，人爲操縱是「以高明的技巧處理或影響」。《韋氏字典》（1972年大學版）又提出另一種解釋：「以不公平或狡猾的手段，有技巧地控制或處理」。然而，試圖以自身的買賣行爲造成價格的變動，並因此而獲利，這並沒有什麼明顯的「狡猾」或「不公平」——換言之，除非「證券交易委員會」（Securities
    and Exchange Commission）想法不同。若是如此，便有狡猾的問題，因爲你可能因此被判刑入獄。然而，個人會被判刑，但法人機構則否。


    大型的法人機構可以透過龐大金額的買賣，操縱市場的短'
  merge: -1
  img_proc: true
- pgno: 122
  md: '期價格。它們的目標是透過相關市場的背離價格獲利；價格的背離經常便是它們自身的行为誘導或造成。它們的成功，是利用波浪觀察者的心理。


    以一個規模為20美元億的退休基金為例，假定它希望賣出價值2億美元的股票。它知道，如此龐大的賣出將導致股票指數下跌，所以它可以根據這項判斷獲利。在市況較平靜的時間，通常是下午2：00左右，它開始賣空S&P的指數期貨，建立200萬美元的空頭部位。這相當於是股票現貨部位的兩倍，大約需要賣空1,000至1,500口契約——就S&P期貨市場的規模來說，這筆交易很容易被消化。


    然後，下午3：10左右，它開始以每五分鐘1,000萬美元的速度分批賣出股票，在臨收盤前，再賣出一筆大單。由於這一波波的賣壓，場內會出現相當明顯的空頭氣勢，價格開始下滑。相對地，期貨價格也會按比例下跌。在現貨與期貨市場中，波浪觀察者都會推波助瀾，使價格形成一種小型的崩跌走勢。


    在股價的下跌過程中，這家退休基金在現貨的處理上雖然發生虧損，但空頭部位（兩倍的數量）回補的獲利遠足以彌補現貨的損失。記住，期貨交易的保證金只不過是5％，而股票的融資為50％；所以，透過槓桿原理，期貨市場的獲利潛能是股票的10倍。


    第二天早晨，市場的整個浪潮又反轉過來，買氣開始蓄積，並造成一個小型的飆漲走勢。由於預先已經知道整個發展的——幾乎是必然的——結果，這家退休基金可以掌握理想的'
  merge: -1
  img_proc: true
- pgno: 123
  md: '買賣時機，在兩個市場的上漲與下跌走勢中，同時為自己與客戶創造可觀的獲利，再加上佣金的收入與免費的公共關係。最後，市場幾乎沒有任何變化，但卻有大筆的資金轉手了。法人機構採用各種電腦交易程式，有些非常複雜，它們雖然不完全是為了操縱市場，但總是不當的賺錢手段。


    就公正的原則來說，電腦程式交易蘊涵的「不公平性」並不是來自於市場本身，而是來自於政府對於市場的任意規範。如果個人的操縱行為應該被懲罰，而機構法人的操縱行為應該被忍受，其中顯然有不公平之處。猶如
    J. O. O’Neil 所說：


    主管當局允許他們〔法人機構〕直接與「紐約股票交易所」的電腦連線，在瞬間之內便可以下達大量的交易指令。你和我則需要透過經紀人，要求他們把交易指令轉至紐約，執行一項指令需要幾分鐘的時間。⑤


    就我個人來說，完全自由化的市場是最理想的狀況，但主管當局至少可以明確界定何謂「人為操縱」，使每個人都瞭解「合法」交易的範圍。


    自從1980年代中期以來，電腦程式交易已經完全改變盤中價格走勢的性質，並為市場帶來前所未有的不確定性。目前，在任何時刻，一位程式經理人的判斷便可以發動買進或賣出的電腦程式，並在純粹技術的基礎上（換言之，相關股票的盈餘展望沒有任何的基本變化），造成5至30點以上的短線走勢。（參考圖6.2）'
