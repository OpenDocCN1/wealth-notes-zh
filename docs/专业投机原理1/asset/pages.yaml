- pgno: 103
  md: '# 圖5.4


    1989年黃金期貨週線圖——黃金處於下降趨勢。下降趨勢是由低點與高點都不斷下滑的一系列價格走勢所構成。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_103_0.png)


    TQ 20/20 © 1991 CQG Inc.


    如果你希望在本書有所收獲，務必留意上述定義。它們非常簡單，卻具有絕對的重要性。它們是普遍性的定義，可以適用任何市場與任何的時間架構。由圖5.3與5.4中可以發現一項結論，順勢操作是在金融市場獲利的途徑。然而，上述定義並未明確說明，如何決定先前的高點與低點。這完全取決於你的交易活動是專注於短期、中期或長期的趨勢——換言之，你究竟是從事交易、投機或投資。'
