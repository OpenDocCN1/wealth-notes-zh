- pgno: 398
  md: '例如，在價值排列中，如果「愛」非常重​要，在反價值的排列中，「被拒絕」非常重​要，你找到「愛」的機會有多大？追求「愛」時，你難道不需要面對「被拒絕」的可能性嗎？當然是如此，而且請留意，避免痛苦的需求往往勝過追求愉悅的欲望。


    分析自己的答案，你應該可以發現許多行為何以會產生。例如，如果你認為「成功」最重要，把「愛」擺在第二或第三位，你很可能經常在辦公室加班，寧可招致配偶或伴侶的抱怨。如果「尷尬」是最重要的反價值，你在社交場合可能害怕公開說話或嘗試新的事物。你的價值觀與反價值觀將決定你的特質。你如何採取行動追求或避開它們——你的行為——將決定你的個性。


    如果你像大多數人一樣，你的特質並不是根據有計劃與有組織的方式界定，而是透過一種滲透（osmosis）的程序逐漸發展。你將在生命的過程中由外在吸收價值與反價值觀，例如：你的成長環境、教育與社交層面。你的價值觀可能非常混亂而毫無章法，甚至於相互矛盾。


    或者，價值觀的結構可能相當協調，但你的反價值觀非常混亂。總之，如果你希望控制自己的生命，就必須瞭解自己特質的結構，才能開始展開你希望的改變。


    所以，我希望你坐下來，開始上述程序，儘可能探索自己生命中的各個領域。你可能因此發現許多先前未察覺的心智層面。'
