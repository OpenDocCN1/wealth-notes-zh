- pgno: 406
  md: '性信念，它們妨礙你希望擁有的感覺，以及在生命中希望達成的境界與目標。面對這些心智視為是「自明的真理」時，你可能會說，「這實在沒有什麼道理。」你可以提醒自己，富人不完全是勢利鬼，如果你有錢的話，你並沒有必要成為一個勢利鬼。總之，你可以在心理上取消這些信念的有效性。


    現在，我告訴你的是：你俱備成功需要的智識與能力；只要排除自己設定的限制。所以，檢視所有的信念與法則，辨識其中具有侷限與不可能性質者。


    截至目前為止，我主要是討論如何辨識侷限性的信念，但為了修正，你必須排除這些信念，並代之以積極而有力的信念。讓我試舉一些積極的整體信念，你可以根據這些脈絡設定屬於你自己的適當信念：


    # 積極的整體信念：


    生命充滿無限的可能性。


    每個問題都代表新的挑戰與新的成長機會。


    我很幸運能夠擁有健康的身體。


    我有能力控制自己的命運。


    人們是提供知識、啟發與歡樂的泉源。


    我決心做的事，總有達成的方法。


    界定你希望採用的新法則時，務必讓自己容易獲勝。這些'
