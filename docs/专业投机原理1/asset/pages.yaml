    經理人，則可由本書獲得完整的交易技巧；對於某些專業老手，如果他們希望瞭解如何預測經濟與市場，也可由本書獲得一些助益。


    在股票與商品之中，都有所謂的「行情的玩家」（market player；譯按：有時候翻譯爲「市場玩家」）與「價值的玩家」（value player）。行情的玩家基本上是根據他對市場價格走勢的知識來交易。價值取向的基本分析者，則是買進價格低估的股票或商品，並持有相當時間以等待升值。就大多數成功的專業
    ,”

    “者來說，他們都同時具有這兩種取向，但前者多過於後'
