- pgno: 67
  md: '# 第四章

    在混沌的市場中尋找秩序：

    道氏理論簡介


    科學領域內有一項新理論——混沌理論（the theory of chaos）——它主張某些類型的自然活動具有混沌而不可預測的性質，僅能以或然率界定。舉例，醫生可以利用高度敏感的儀器監視與繪製心臟的跳動，但在某種情況下，心臟會進入隨機的心臟纖維顫動期（random
    fibrillation）（隨機而混沌的跳動可能導致生命危險），在這個期間，心跳無法以數學模型預測。這種混沌的現象可能危及生命，但研究者又發現，正常人在注意力集中的時候，腦波也會呈現混沌的現象，而在癲癇病發作或吸食毒品的「高潮期」，腦波的行為則有規律而可以預測。


    許多科學家認為，氣象預測是混沌理論適用的另一個領域。氣象的不可預測性是來自於所謂的「起始條件的敏感性」（sensitivity of initial conditions）。數學模型不完全適用於氣象預測，因為被模擬與實際的情況之間一旦有些微的差異，因果關係便會產生一連串的複雜反應，使得模型的預測結果完全不同於自然界的實際現象。混沌理論認為，氣象學家頂多僅可以再或然率的範圍內預測氣象。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '如果混沌理論看起來像是一套消極的理論，僅是因為我沒有談論它的正面功能。研究混沌行為何以發生的原因，科學家認為他們可以阻止其中某些行為發生，或歸納其中的另一些行為。這套理論的潛在應用領域極廣，例如：醫學，生物化學、精神科學、氣象學、電腦、……。所以，雖然承認自然界的某些事件並不遵循完美的數學秩序，也無法精確地加以預測，但混沌理論認為，它們仍然可以被瞭解，某些情況下，甚至可以被預測與控制。


    金融市場的情況也是如此。人類並不是數學可以控制的機械；他們是具有選擇能力的生物。而且，人類便是市場。每一日都會出現數以百萬計的市場決策，每一項決策都會影響價格。一組如此複雜的成份，其中還包括自由意志，若試圖以數學模型預測，是非常可笑的想法。你永遠無法以絕對的必然性來預測市場構成份子對於某些事件的總體反應，也無法預測市場將產生什麼新狀況。但是，混沌中也有秩序，尋找其中的秩序便是投機者的工作。


    市場預測是屬於或然率的領域，判斷錯誤的風險永遠存在。你頂多僅能夠將風險降至最低，並將知識提昇至最高——瞭解可能導致未來事件的最初狀況。依此方式，你可能掌握有利的勝算，並使市場決策的正確機會多於錯誤。取得這項知識的第一步驟，是尋找一種方法監視市場行為的脈動。


    經過適當的瞭解之後，「道氏理論」就像是外科醫生使用的高敏感心臟監視儀，或是預測氣象的氣壓計；它可以在或然率的範圍內，協助我們預測未來事件。它不會告訴你，變動發'
