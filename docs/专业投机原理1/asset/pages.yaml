  md: '假定中央銀行決定透過公開市場進行操作，向銀行體系買進價值5,000萬美金的ABC 政府公債。進行這筆交易時，中央銀行以自己的名義開立支票（無中生有？），然後商業銀行把支票存入它們在中央銀行的準備金帳戶。中央銀行大筆一揮便完全這筆交易。


    現在，整個銀行體系增加5,000萬美元的準備金。所以，它們的資產負債表將成為：


