  md: '# 定理4：


    主要的多頭市場（Primary Bull Markets）：主要的多頭市場是一種整體性的上漲走勢，其中夾雜次級的折返走勢，平均的持續期間長於兩年。在此期間，由於經濟情況好轉與投機活動轉盛，所以投資性與投機性的需求增加，並因此推高股票價格。多頭市場有三個階段：第一階段，人們對於未來的景氣恢復信心；第二階段，股票對於已知的公司盈餘改善產生反應；第三階段，投機熱潮轉熾而股價明顯膨漲——這階段的股價上漲是基於期待與希望。〔參考圖4.7〕


    這項定義也需要釐清。多頭市場的特色是所有主要指數都持續連袂走高，拉回走勢不會跌破前一個次級折返走勢的低點，然後再繼續上漲而創新高價。在次級的折返走勢中，指數不會同時跌破先前的rypted重要低點。主要多頭市場的重要特質如下：


    +   1. 由前一個空頭市場的低點起算，主要多頭市場的價格漲幅平均數為77.5%。


    +   2. 主要多頭市場的期間長度平均數為兩年又四個月（2.33年）。歷史上的所有的多頭市場中，75%的期間長度超過657天（1.8年），67%是介於1.8年與4.1年之間。


    +   3. 多頭市場的開始，以及空頭市場最後一波的次級折返'
