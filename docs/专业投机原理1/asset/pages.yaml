  md: '第二，「應該」並不考慮成就所必要俱備的條件。因此，交易者可能瞭解，他必須俱備充分的市場知識才可以有效地交易，但他認爲讀一、兩本書便足夠了。就如同任何技巧一樣，一位優秀的交易者需要長期的學習，每天專心研究，但他會故意忽略這項事實。在這種情況下，交易者不可避免地會犯錯，而且無法透過學習來修正。他不會把失敗歸因於知識不足，而會歸咎於某些的外部因素。


    第三，內部指令的運作「不理會自身的心靈條件——他當時所能夠感覺或做的條件。」他絕對不應該感覺受傷害、他絕對不應該感覺忿怒、他絕對不應該缺乏工作的慾望…。「他就是對自己下達絕對的指令，完全否決或漠視實際存在的缺少。」


    第四，「應該」具有抽象的性質——它們缺乏道德理想所俱備之真正與自然的特質。我的意思是，「應該」本身被視爲是目的，而不是達成目的的手段。


    前一章曾經討論人們對於自己設定的侷限性價值觀與信念。你是否察覺，在應該的暴君與侷限性的聯想之間存在著關連？再次地，應該的暴君會反映在你對自己與他人的對話中。


