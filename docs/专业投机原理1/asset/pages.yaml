  md: '而，我們始終不能避開政府的干預。所以，我們會有上下巨幅波動的經濟循環。每個人都喜愛向上的發展，卻很少人知道如何在景氣衰退時保護自己。


    猶如企業家一樣，經濟發生衰退或蕭條的時候，避開財務災難的唯一方法，是正確地預測行情的轉折點，並依此調整自己的立場。這是指在市場的底部擴張信用而做多，在市場頭部則由多轉空。這麼做需要俱備本章討論的經濟學原理，以及先前數章說明的法則。


    本章我提出一些經濟學的基本概念，這是瞭解政府干預政策如何影響市場的必要知識。接下來的兩章中，我將解釋政府如何透過預算赤字與「聯邦準備系統」，以財政與貨幣政策進行干預；並說明政府干預何以是經濟長期趨勢的主要決定因素。本章與次兩章的主要目標是教導你，如何運用基本的經濟學原理防止這些干預造成你的損失，並在這個程序中獲利。


