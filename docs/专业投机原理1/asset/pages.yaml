- pgno: 80
  md: '# 定理1：


    道氏的三種走勢（Dow''s Three Movements）：

    市場指數有三種走勢，三者都可以同時出現。第一種走勢最重要，它是主要趨勢（primary trend）：整體向上或向下的走勢而稱爲多頭或空頭市場，期間可能長達數年。第二種走勢最難以捉摸，它是次級的折返走勢（secondary
    reaction）：它是主要多頭市場中的重要下跌走勢，或是主要空頭市場中的反彈。修正走勢通常會持續三個星期至數個月。第三種走勢通常較不重要，它是每天波動的走勢。⑤


    李氏的用詞大體相當精確，道氏的三種走勢不僅適用於股票市場的指數，也適用所有市場。李氏第一項定理可以重新整理如下：


    股票指數與任何市場都有三種趨勢：短期趨勢，持續數天至數個星期；中期趨勢，持續數個星期至數個月；長期趨勢，持續數個月至數年。任何市場中，這三種趨勢必然同時存在，彼此的方向可能相反。


    長期趨勢最爲重要，也最容易被辨認、歸類與瞭解。它是投資者主要的考量，對於投機者較爲次要。中期與短期趨勢都是附屬於長期趨勢之中，唯有明白它們在長期趨勢中的位置，才可以充分瞭解它們，並從中獲利。


    中期趨勢對於投資者較爲次要，但卻是投機者主要考量。它與長期趨勢的方向可能相同，也可能相反。如果中期趨'
  merge: -1
  img_proc: true
- pgno: 81
  md: '勢嚴重背離長期趨勢，則被視爲是次級的折返走勢或修正（correction）。次級折返走勢必須謹慎評估，不可將其誤爲是長期趨勢的改變。


    短期趨勢最難預測，唯有交易者才會隨時考慮它。投機者與投資者僅有在少數情況下，才會關心短期趨勢：在短期趨勢中尋找適當的買進或賣出時機，以追求最大的獲利，或儘可能減少損失。


    將價格走勢歸類爲三種趨勢，並不是一種學術上的遊戲。一位投資者如果瞭解這三種趨勢而專注於長期趨勢，也可以運用逆向的中期與短期趨勢提升獲利。運用的方式有許多種。第一，如果長期趨勢是向上，他可在次級的折返走勢中賣空股票，並在修正走勢的轉折點附近，以空頭部位的獲利追加多頭部位的規模。第二，上述操作中，他也可以購買賣出選擇權（puts）或銷售買進選擇權（calls）。第三，由於他知道這只是次級的折返走勢，而不是長期趨勢的改變，所以他可以在有信心的情況下，渡過這段修正走勢。最後，他也可以利用短期趨勢決定買、賣的價位，提高投資的獲利能力。


    上述策略也適用於投機者，但他不會在次級的折返走勢中持有反向部位；他的操作目標是順著中期趨勢的方向建立部位。投機者可以利用短期趨勢的發展，觀察中期趨勢的變化徵兆。他的心態雖然不同於投資者，但辨識趨勢變化的基本原則相當類似。


    自從1980年代初期以來，由於資訊科技的進步以及電腦程式交易的影響，市場中期趨勢的波動程度已經明顯加大。由'
  merge: -1
  img_proc: true
- pgno: 82
  md: '1987年以來，一天內發生50點左右的波動已經是尋常可見的行情。基於這個緣故，我認爲長期投資的「買進——持有」策略可能有必要調整。對我來說，在修正走勢中持有多頭部位，並看著多年來的獲利逐漸消失，似乎是一種無謂的浪費與折磨。當然，大多數的情況下，經過數個月或數年以後，這些獲利還是會再度出現。然而，如果你可以專注於中期趨勢，這些損失大體上都是可以避免的。因此，我認爲，對於金融市場的參與者而言，以中期趨勢做爲準則應該是較明智的選擇。


    然而，如果希望精確掌握中期趨勢，你必須瞭解它與長期（主要）趨勢之間的關係。


    # 定理2：


    主要走勢（Primary Movements）：主要走勢代表整體的基本趨勢，通常稱爲多頭或空頭市場⑥，持續時間可能在一年以內，乃至於數年之久。正確判斷主要走勢的方向，是投機行爲成功與否的最重要關鍵。沒有任何已知的
    方法可以預測主要走勢的持續時間。〔斜體字是作者添加〕


    瞭解長期趨勢（主要趨勢）是成功投機或投資的最起碼條件。一位投機者如果對於長期趨勢有信心，只要在進場時機上有適當的判斷，便可以賺取相當不錯的獲利。有關主要趨勢的幅度大小與期間長度，雖然沒有明確的預測方法，但可以利用歷史上的價格走勢資料，以統計方法歸納主要趨勢與次級的折返走勢。'
