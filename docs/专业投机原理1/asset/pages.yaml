    由各種角度評估風險—獲利的關係，以確實掌握自己的勝算。這看起來似乎相當複雜與煩瑣，實際上並非如此。將所有領域的相關知識濃縮爲可以直接運用在市場中的原則，複雜的體系可以簡化爲相對單純而易於處理的根本觀念。這本書便是希望闡述這些根本觀念，它適用於像我這類市場玩家，以書籍做爲主要的資訊來源。


    孩童時代，我閱讀的第一本書是有關棒球選手的書。我非常熱愛棒球，並希望有一天可以成爲頂尖的職業選手。於是，我閱讀著名運動員的故事——「名人堂」內的選手，例如：Ty
    Cobb。我模仿他們，學習他們的打擊與防守風格，如此不斷練'
