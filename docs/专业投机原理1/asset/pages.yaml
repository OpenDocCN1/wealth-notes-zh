- pgno: 229
  md: '支出，這些債務遲早都必須全額清償，但經濟擴張所仰賴的寬鬆信用也將隨之消失。整體經濟不論以較高的稅金、通貨膨脹、普遍的景氣下降（經濟衰退或蕭條）、或是這三種方式的結合，我們支付的代價都完全相同——財富已經被消費了。


    # 結論：僅次於免費的早餐


    美國是一個始終令我覺得驚奇的國度。我的辦公室裡有一部價格 1600 美元的傳真機，我每週幾乎都會發現它令人不可思議之處。不知如何地，紙張上的影像可以轉變為電波，然後隨著電話線穿越數英哩的距離，並在另一部機器上轉為一模一樣的影像。


    我對於電子晶片、數據機、……等新奇的科技玩意見可以說是全然無知，但我僅花費 1600 美元的代價便可以享有如此神奇的機器，這項產品是由最傑出的心智，花費無數的時間與資金從事研究、發展與行銷。


    以日常生活的例子來說，我的早餐可能是兩個蛋，再加上吐司與果汁，如果我自己準備，成本不會超過一美元。如果我必須自己生產相同的一份早餐，種植小麥、磨成麵粉、種植果樹、飼養母雞、……，這份早餐的代價恐怕就難以想像。這真是太神奇了——僅次於免費的早餐。


    這雖然神奇，卻不是意外或奇蹟；這是一群人在市場上自由交易的结果。如果沒有政府的干預，新科技發明、消費者的偏好改變、或信用情況發生變化時，市場將調整而發生自然的小幅景氣循環；但生產與繁榮仍會保持永遠向上的趨勢。然'
