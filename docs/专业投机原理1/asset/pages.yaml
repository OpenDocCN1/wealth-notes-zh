- pgno: 333
  md: '成，完全沒有窗戶，光線非常微弱。那座櫻花木書桌上，堆放著一些看起來並不熟悉的檔案與帳冊。書桌旁有一張長方形桌子，上面僅擺著一個鍵盤，並接連著一個巨大的螢幕，上面正顯示著他的臉孔。鍵盤前，坐著一位蓄著白鬍鬚的老人，他穿著及地白袍。隱約地，這位交易員認為他便是「時間之父」。這位老人慢慢轉過身來，目光如炬，並以低沉的聲音說道，「什麼事情耽擱了你？我一直在等你。」


    「可是我根本不知道這是怎麼回事？我為什麼來到這裡？」交易員結結巴巴地說道。


    「你當然知道，你來這裡學習如何才能夠成功。」老人笑著說。


    「可是我已經知道什麼是成功，」交易員反駁道，「我就代表成功。」「或許吧！但根據什麼標準呢？」


    這位老人並不給交易員回答的機會，轉過身開始在鍵盤上輸入一些指令，螢幕上顯示出交易員一生的種種畫面。過去發生的點點滴滴又生動地展露在他的眼前。他看見長久以來忘記的事件，以及一些過去視而不見的事物。看著看著，這位自以為可以完全控制自己情緒的人，卻陷入了又哭又笑的情境中。他看見自己賣掉大學時期使用的吉他時，他哭了，因為他當時認為吉他是一種玩物喪志的東西。他看見自己某一天因為虧損30萬美元而悠怒的臉孔時，他大聲地笑著。當他看見前妻生下他們的小孩而他卻忙著工作，他又哭了。當他看見一位女孩，帶著甜美的笑容與優雅的動作，與她未來的丈夫打網球時，他又笑了。隨著畫面一幕一幕的變動，他又哭又笑，他終於瞭解'
  merge: -1
