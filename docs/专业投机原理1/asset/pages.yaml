  md: '你整體的快樂程度。


    1974 年以後，我在事業上的發展也不是完全沒有挫折。1983 年我同意管理一個4,000萬美元的基金Victory Partners。或許我當時有一點自以爲了不起，或許是因爲我想接受挑戰，我將基金的累積獲利目標設定爲每年25％（扣除佣金之後），唯有操作績效超過此標準時，我才收取報酬。第一年大盤下跌15％，基金的獲利爲13.3％。這意味著基金下一年度的獲利率至少需要40％！


    在1984-85年期間，市場的中期趨勢非常不適合交易。價格沒有什麼波動，行情幾乎呈水平狀發展，我被迫在短線上進出。雖然我其他三個交易帳戶都處於獲利狀況，Victory
    Partners卻發生13％的虧損，這最主要是來自於佣金費用。在Interstate，我是支付場內經紀商的費率，這相當於目前法人機構適用的費率。然而，Victory
    Partners卻必須支付零售的佣金費率——大約高出五倍——在沒有明顯行情的市況下，短線進出便成爲虧損的主要原因。另外，電腦程式交易也開始嚴重影響短期趨勢的性質，使我多年來運用的交易法則完全不再適用。於是，我建議解散基金，我們在1986年正式解散基金…一個慘痛的經驗。


    我預測行情時，並不是採用單一的分析方法。我永遠會結合技術分析、統計方法、以及經濟基本面等因素，評估任何投機部位的風險。唯有這三項因素相互配合時，我才會在市場中建立重要的部位。另外，根據我的經驗，瞭解政府當局對於市場的既定或潛在干預態度，對投機的成敗也有絕對的重要性。'
