- pgno: 312
  md: '卻一次也沒有。


    每一種市場指數、個股與商品，都有其獨特的步調、韻律與性質。唯有你熟悉市場的情況時，才可以考慮交易，而且你必須等待適當的機會：如果 你判斷正確，獲利潛能很高，如果你判斷錯誤，則損失有限。耐心地留意觀察，當你掌握有
    力的勝算時，斷然採取行動。


    就另一個層面來說，如果你僅是交易自己的帳戶，而且交易的時間架構很短，則應該把股票的種類侷限在十種以內；就期貨交易而言，則應該把商品的種類侷限在五種以內。最重要
    的理由僅是單純的注意力問題。你可以記住多少電話號碼？或許十個、八個。所以，如果記憶電話號碼有所困難，則你也很難同時留意十個或以上的交易部位。瞭解自己的部位，注意相關的行情發展，這是交易成功的必要條件。對於大多數人而言，同時考慮五種不同的事物，已經是嚴苛的挑戰了。


    # 守則6：迅速認賠；讓獲利部位持續發展。


    在所有的交易守則中，這是最重要、最常被引述、也最常被違反的一條守則。


    市場就像是法庭，你是被告——被證明為有罪以前，你是清白的。換言之，從事一筆交易時，你必須假定：被證明為錯誤以前，你是正確的。價格觸及你的停損點或你選定的心理出場價位時，市場便已經證明你為錯誤，這是「最高法院」的判決——不能繼續上訴，你已經沒有自由行動的權利，你必須出場。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '你的判斷正確時，必須「讓自由主宰一切！」如果你是根據1：3的風險/報酬比率交易，一般來說，每一次的獲利可以抵上三次的損失。守則7是例外。


    就某一層面的意義來說，守則6是前五條守則的總結。如果你有交易計劃，你瞭解何時應該獲利了結，何時應該加碼，何時應該出場。如果你順勢交易，你允許的損失，將由趨勢變動準則來客觀界定。如果你對於交易有信心，你不太可能過早獲利了結。如果你不過度擴張交易，你不僅可以減少損失，而且更可能掌握真正的機會。如果你確實瞭解「迅速認賠；讓獲利部位持續發展，」你至少可以把四條守則合併為一——相當經濟！


    # 守則7：不可讓獲利部位演變為虧損。（或者，儘可能持有必然獲利的部位。）


    這相當困難，因為你必須根據自己的交易架構界定「獲利」。為了便於說明起見，假定你是根據1：3的風險/報酬比率交易。如果價格朝有利方向發展，而風險/報酬比率成為1：2（譯按：這是指價格已經更接近目標價位，而且距離下檔的停損較遠，所以這項比率降低），守則6要求你讓獲利部位持續發展。然而，如果價格趨勢突然反轉，你最後被停損出場，你又違反守則7！你應該怎麼辦？


    我建議每當風險/報酬比率成為1：2時，你應該將停損點（或心理出場點）調整至成本之上，而持有必然獲利的部位。就某個角度來說，這個部位的風險/報酬比率已經是0。你只可'
