  md: '勉強讓雷納保持完整的狀況，又繼續經營了15個月，直至 Weeden & Company 提出非常有利的條件接收我們公司，包括所有員工與我在內。在Weeden的期間，我成爲「績優熱門股」（glamour
    stocks）——類似如：IBM、National Cash Register、Eastman Kodak等市場領導股——的大額交易員。我仍然將雷納維持爲一個獨立的經營實體，我目前還是透過它交易。


    在公司重組前，市場中出現某些狀況，這是我交易生涯的重要轉捩點之一。我錯失1974年十月初的急漲行情，以及隨後出現的暴跌走勢，後者使「道瓊指數」在12月跌至12年以來的最低點。這幾個月內，我還是勉強有所獲利，但整體發展卻令我十分震驚——我錯失了一個大好的獲利機會。我疏忽了什麼？我需要接受什麼教訓才不致重蹈覆轍？我自問，「趨勢究竟是什麼？它有什麼性質？它通常會持續多久？它向上或向下的幅度通常如何？修正的走勢有何性質？它通常會持續多久？」於是，我開始研究以往疏忽的問題。


    # 探究趨勢的性質


    爲了回答上述問題，我首先必須界定、衡量、歸納所有趨勢與修正走勢，並設定一個標準做爲「通常」的定義。1974年至1976年，我利用所有空閒時間研究市場歷史，這些研究是以「道氏理論」（Dow
    Theory）爲主軸，因爲我認爲這套理論對於市場走勢的界定最明確。我根據的資料是Robert Rhea在1939年過逝以前的研究工作。我標示「道瓊工業指數」與「道瓊運輸指數」由1896年至目前（我現今仍然從事這方面研究）的所有趨勢，將它們分別歸納爲短期、中期與長期的趨勢，衡量'
  merge: -1
  img_proc: true
- pgno: 41
  md: '它們的幅度與期間，並登錄於表格中。然後，透過統計分析的方法，將它們簡化為我能夠運用於交易格式，尤其是風險管理。本書後續章節會討論如何運用這些資料。


    這段期間我為自己的交易方法，建立起預測市場行為的根本觀念，這種方法也適用於期貨市場。毫無疑問地，我在這兩年內獲得的知識，是我在Interstate 續效傑出最主要的單一原因。我最佳的月份是1982年9月，這也是Interstate
    當時的最佳單月交易記錄，我管理的公司帳戶當月獲利是88萬美元，而帳戶的交易資本為100萬美元，其他兩個帳戶的獲利率大約也是如此。這個月份的巨額獲利來自於一個行情預測，而這項預測是直接引用我在1974年至1976年之間發展的統計方法與知識。


    此處，我想談論一段題外話。這兩年的專心研究雖然使我在行情預測上獲致重大突破，但我在個人生活上也付出慘重的代價。當時，我的女兒Jennifer 正處於關鍵的年齡（三歲至五歲），我幾乎完全沒有陪伴她。我由辦公室回家，吃過飯後便直接進入書房繼續研究。當她走進我的書房，我會不耐煩的趕她出去，完全忽略她非常需要她父親的關懷與愛心。這是一項嚴重的錯誤，我們父女倆人到今天還在為此錯誤付出代價。如果我可以重新來過，我一定會抽空多陪伴Jennifer。


    我提及這個事件並不是基於懺悔的緣故，而是希望強調一個非常重要的觀點。猶如我在「前言」的說明，本書是希望協助讀者在經濟上與個人生活上獲得成功。在我生命中的那一時刻，我未能整合這兩方面，顯然是一個嚴重的錯誤。生命應該是一種平衡而協調的過程，重點並不在於你賺了多少錢，而是'
  merge: -1
  img_proc: true
