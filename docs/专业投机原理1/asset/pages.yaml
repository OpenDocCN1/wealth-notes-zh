  md: '在多頭市場的中期主要走勢中，淨漲幅的平均數（假定你在中期修正走勢的谷底買進，並持有至次一個中期修正走勢的谷底，其股價淨上漲的百分率）為10％。另外，在歷史上的112個類似走勢中，僅有15個走勢的淨漲幅超過24.4％（這是10月9日已經出現的漲幅）。更重要者，不論多頭或空頭市場，在174個上升走勢中，僅有8個走勢的幅度等於或超過「運輸指數」當時的漲幅（54％）。換言之，根據歷史資料，當時趨勢結束的勝算介於7.46：1至21.75：1之間。這告訴我應該了結所有的多頭部位，並等待賣空的機會。若僅根據這項統計準則考慮，在1989年10月份做多行情，必須承擔非常不利的風險。此外，基本分析與技術分析也都支持統計分析的結論。


