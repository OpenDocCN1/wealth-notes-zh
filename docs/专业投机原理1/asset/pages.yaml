  md: '# 第十章


    # 繁榮與衰退：


    # 誰拿嘲筒？誰拿刺針？


    > 影響經濟體系的波浪狀變動，在經濟蕭條〔衰退〕之後又是經濟繁榮，這是不斷嘗試擴張信用而降低市場毛利率的必然結果。以擴張信用帶來的經濟繁榮，絕對無法避免最後的崩解。唯一的選擇僅有：自願放棄進一步的信用擴張而使危機較早到來，或是稍後等待整體貨幣系統的全然瓦解。①


    ——米賽斯（Ludwig won Mises）


    # 繁榮與衰退：經濟循環


    18世紀下半葉以來，人們便爭論市場經濟循環波動的起因究竟是什麼。我希望在本書的討論範圍內解答這個問題，使你不僅在市場的上升階段可以獲利，在下降階段也是如此，這個時候，許多企業家與大多數投資者都處於虧損狀態，或至少是流失先前大部份的獲利。


    本章之初，我引用米賽斯的評論，因爲就經濟循環的起因而言，這是最精闢而明確的見解。他的表達方式或許太過於樸'
  merge: -1
  img_proc: true
- pgno: 234
  md: '質，答案卻非常單純。然而，猶如愛因斯坦提出的簡單公式E = mc²一樣，在簡單的陳述下蘊涵著無限知識。


    如果你可以瞭解米賽斯的這段陳述，而且掌握其中所有細節，並運用在美國與世界的貨幣信用體系中，你對於市場主要轉折點的預測能力可以超過市場中90％的投機者。


    在這段陳述中，米賽斯認為，如果要瞭解經濟循環，你必須瞭解貨幣、利率、信用、以及信用擴張對於經濟的影響。


    # 經濟循環的性質


    幾乎每個人都瞭解金字塔式計劃（pyramid schemes）的性質（類似如連鎖信函），而且我們大多都不會參與這些活動，因為我們知道這些計劃的創始者可能心懷不軌，或我們可能成為金字塔頂部的最後一位「有輸無贏」的參與者。經濟循環非常類似於金字塔式的計劃，而且不斷重覆發生，它們或許不是故意的行爲，卻是來自於普遍被接受的錯誤經濟觀點。


    18世紀以前並無所謂真正的經濟循環，以往雖然有經濟蕭條的現象，但它們的起因都非常明確。或者是爲了籌措戰爭的經費，或者是爲了供自己隨意的揮霍，國王會派遣他的衛隊四處徵收稅賦。這些行爲將衝擊人民的「正常商業活動」，並導致經濟衰退。


    或者由於戰爭，一個國家可能剝奪另一個國家重要的經濟資源，例如美國內戰期間，北軍奪取英國在美國主要的棉花資源，衝擊相關產業，使經濟普遍衰退。不論原因是什麽，我們'
  merge: -1
  img_proc: true
- pgno: 235
  md: '都相對容易判定經濟衰退的起因。如果沒有發生外部的（exogenous）事件，經濟活動將呈現直線狀穩定而緩慢的成長。


    然而，大約從1750年開始，工業化國家的經濟活動出現重覆發生的循環波動，它們的起因並不明顯。這段期間，同時發生兩項重大的事件：一是工業革命，它起源於英國，並蔓延至整個西方世界；一是中央銀行的活動，更明確來說，這是由政府當局控制的部份準備金（fractional
    reserve）中央銀行活動。由於當時僅發生這兩項重大的經濟事件，所以政治經濟學家們開始探索，經濟循環是否起因於這兩項因素中的某一項。


    當時的基本看法可以分為兩個學派。一是「重商主義者」（mercantilists），他們認為經濟活動的循環波動，起因於市場經濟內部（endogenous）的某些因素。對於這個學派來說，研究重點是尋找這些起因，並運用政府的控制手段消除它們，提供一個經濟發展的穩定環境。另一個學派是以李嘉圖（David
    Ricardo）為首的古典經濟學派，他們是分析紙幣與信用擴張對於貿易的影響，並以此解釋經濟循環。


    根據古典經濟學的看法，經濟循環起因於外部（exogenous）因素；換言之，政府對於貨幣與信用市場的干預。不幸地，內部（endogenous）學派贏得勝利，後來並形成凱恩思（John
    Maynard Keynes）經濟學的獨霸地位，這套經濟學目前仍以各種不同形式主導世界的經濟思想。所以，世界上主要工業國家都採用部份準備金的中央銀行體系——也因此無法避免繁榮與衰退的經濟循環。


    「因為中央銀行存在，所以繁榮與衰退的經濟循環也存'
