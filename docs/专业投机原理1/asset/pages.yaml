- pgno: 115
  md: '# 第六章


    # 技術分析的優點與缺點


    「華爾街」中充滿了技術分析者。場內交易員、樓上的交易員（upstairs traders）、投機者、甚至於某些長期交易者，都試圖運用可能重覆出現的模式，預測未來的市場走勢。這些模式之所以發生，並沒有涉及什麼神秘的理由。由心理角度來說，人們通常會以一致性的方式反應一組類似情況。然而，人類心理非常複雜，而且沒有任何兩組市場情況會完全相同；所以，利用技術分析預測未來的市場行為，在態度上必須非常謹慎。


    根據Robert Edwards與John Magee的說法，「技術分析是一種科學，它記錄某支股票或「市場指數」的實際交易歷史（價格的變動、成交量、以及其他類似資料），通常是以圖形記錄；然後，再根據歷史圖形推測未來的可能趨勢。」①他們倆人採用的基本前題非常類似於「道氏理論」——市場的所有相關知識都已經反映在價格中。然而，技術分析者認為，價格與價格的模式是唯一的重要考量，這項假設則不同於「道氏理論」。


    我並不是一位純粹的技術分析者，但許多獲利都是來自於技術性的考量，所以我無法像某些「基本分析者」一樣，對技術分析嗤之以鼻。它是擬定市場決策的重要輔助工具，使你可'
  merge: -1
  img_proc: true
- pgno: 116
  md: '以掌握所有的勝算，但許多市場玩家不能體認這點。在另一方面，投資或投機行爲若單獨以它做爲主要的評估方法，則技術分析不僅無效，而且可能會產生誤導的作用。


    稍微調查一下專業交易者、投機者與投資者的看法，便可顯示技術分析的有效程度。完全仰賴圖形方法，其操作績效通常並不穩定。例如，1974 年一位技術分析者來找我，他的名字是Leo，他認爲我可以藉重他的知識。我以每週125美元的試用薪水任用他，如果他的建議確實有效，他還可以抽取某一百分率的紅利。Leo每天早晨6：30便到辦公室，開始研究120多副彩色圖形，並運用一些到目前爲止我還不懂的分析方法。他每天工作16個小時，顯然非常瞭解市場，但他在這方面的知識可能已經造成妨礙。


    我要求他提供建議時，他會展示一些圖形，並解釋道：「這支股票可能在做底，」或「這支股票可能會填補缺口。」總之，不論他說什麼，他的看法總是非常不明確，並提出一些相互矛盾的可能性。我通常會回答，「好的，但我究竟應該怎麼做？買進或賣出？」Leo無法給我一個簡單明白的答案。我對於他的印象非常深刻，尤其是他的襯衫袖口經常已經磨損而發毛，午餐總是由家裡帶來的鮪魚三明治。


    我並不是說，所有的技術分析者都是如此，但技術分析本身顯然無法以根本重點思考。如果你經常觀看「金融新聞頻道」（The Financial News Network；FNN）的節目，你應該瞭解我是甚麼意思。每位技術分析專家對於模式的解釋都各自不同，而且都可以提出自己的故事。根據我個人的觀點，我們僅'
  merge: -1
  img_proc: true
- pgno: 117
  md: '需要一些最根本的技術分析原則，並以它們做爲輔助工具。一套真正有效的系統，應該涵蓋嚴格而健全的經濟基本分析，以及對於個別證券與商品的評估方法，再納入根本的技術分析精義。


    在我們的討論範圍內，各位必須瞭解三種技術分析者的活動：波浪觀察者（tide watchers）、人爲操縱者（manipulators）與純粹派信徒（purists）。


    # 波浪觀察者


    所謂的波浪觀察者，試圖根據盤中價格趨勢的起伏而順勢操作。相對上講，他們並不關心經濟的狀況、個股本益比或盈餘成長、或任何其他商品的經濟基本面。他們所有的注意力幾乎完全擺在每天、每個時刻的價格走勢方向。隨著趨勢的上升、下降或橫向發展，他們將買進、賣空或保持空手。


    波浪觀察者通常是主要交易所內的場內交易員（floor traders）或造市者（market makers）。他們之所以被歸類爲波浪觀察者，因爲僅關心價格的趨勢——「趨勢是你的朋友」是他們的根本思想。一般來說，他們並不理會任何重要消息，他們僅試圖根據「壓力」（resistance）與「支撐」（support）——可能造成波浪轉向的先前高點與低點——掌握趨勢（參考圖6.1）。'
  merge: -1
  img_proc: true
