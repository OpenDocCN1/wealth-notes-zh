- pgno: 52
  md: '這個例子中，我們的重點並不在於你是否同意這個原則的正確與否。這個例子主要目的在於說明，一項陳述、一點點知識，如何可以形成一系列的推理與結論。如果我們瞭解基本原則，原本看似非常複雜的現象，便可以整理爲相對單純的知識。


    任何領域內，明智的決策都需要仰賴根本的知識（essential knowledge），使所有的觀察事件都可以訴諸於這項統轄因果關係的根本概念。在金融市場中，基本知識代表的是價格走勢與價格趨勢的原則。它們代表市場的普遍性質（nature），並界定各個不同市場的特質（distinguishing
    characteristics）。


    培養這種知識，需要持續將明確的事件轉化爲抽象的概念，並將抽象的原則套用在實際的事件上；根據今天事件的分析，預測長期的未來；以適用近期與過去歷史的同一個概念，瞭解今天發生的事件。我稱這種程序爲「根據重點思考」，或「根據原則思考」。


    認定你應該根據原則思考，是一回事；如何認定原則又是另一回事。閱讀有關金融市場的書籍與雜誌時，你會發現每個「專家」都有看法，這些看法卻經常相互矛盾。這一部份是來自於定義的問題。以我們每天都可以聽到的名詞爲例：多頭市場、空頭市場、趨勢、經濟衰退、經濟蕭條、經濟復甦、通貨膨脹、價值、價格、風險/報酬、相對強度、資產配置、…。金融圈內人士大多知道它們，但很少人可以明確地定義這些名詞。然而，界定這些名詞不僅是一種概念化的程序；更是瞭解市場的根本步驟，並認定統轄它們的原則。'
