- pgno: 71
  md: '根據價格模式的研究，推測未來價格行為的一種方法。就這個角度來說，它是現代技術分析的鼻祖。


    李氏過逝後，「道氏理論」落入一些無能之輩的手中。人們不再能夠掌握這項理論的精義，並做不適當的解釋與誤用，以至於它被視為是一套過時的理論，不再適用於現代市場。這是完全不正確的看法。我曾經做過研究，將「道氏理論」運用在1896年至1985年的「工業指數」與「鐵路指數」（現在的「運輸指數」），我發現「道氏理論」可以精確地掌握74.5％的經濟擴張價格走勢與62％的經濟衰退價格跌勢，這是分別由確認日至行情頭部或底部而言。


    另外，根據我的研究顯示，除了兩次世界大戰期間外，股票市場可以精確地預測經濟趨勢的變化，領先時間的平均數（median；譯按：在本書中，作者都採用 "median"[中位數]，但他實際的意思卻是指「平均數」[mean]而言，所以往後
    "median"一律譯為「平均數」）為六個月；並可以預測經濟循環的峰位與谷底，領先時間的平均數為一個月。1949年至1985年間，根據嚴格解釋的「道氏理論」來買、賣「工業指數」與「運輸指數」，理論上每年的平均報酬率（未經複利）為20.1％。就這方面來說，我還必須補充一點，投資者若運用「道氏理論」，他將於1987年的崩盤期間賣空（我便是如此）。沒有任何其他預測方法可以宣稱，它俱備這種長期的—致性預測能力。所以，每一位態度嚴肅的投機者或投資者，都應該深入研究「道氏理論」。


    # 道氏理論的「假設」'
  merge: -1
