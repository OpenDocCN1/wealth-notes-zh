- pgno: 111
  md: '勢最後必然會發展為一種易於辨識而具有預測價值的模式。


    某些情況下，頭部或底部形成後，趨勢往往會突然改變，沒有經過狹幅整理的期間。另外，狹幅盤整的走勢，有時也會發生在經過確認之主要趨勢的中間。這可能是因為下列兩項理由中的一種：價格走勢（上漲或下跌）相當陡峭，許多交易者與投機者獲利了結時，便造成趨勢暫時停頓；或者，市場對於未來發展並不確定，分歧的看法使得價格維持在相對固定的價位。第一種情況，我稱為「整理」（consolidation）。第二種情況，我稱為「等待行情」（waiting
    market）。


    # 重要的成交量關係


    在趨勢明顯的行情中，價量關係非常重要。猶如李氏的評論：


    成交量與價格走勢的關係（The Relation of Volume to Price Movement）：——在超買的行情中，會出現價漲量減而價跌量增的現象；相反地，行情處於超賣狀況時，會出現價跌量縮而價漲量增的現象。多頭市場結束的期間會出現活絡的交易，在開始的期間則交易相對冷清。


    根據定義，在「超買的」行情中，價格主要是受到感覺、希望與預期的驅動，但並非基於健全的經濟判斷與價值考量。這種情況下，掌握明確資訊的人已經離開市場，一般參與者的熱情也逐漸冷卻。市場已經俱備恐慌的條件，只要出現些許的'
  merge: -1
  img_proc: true
- pgno: 112
  md: '徵兆，便足以引發層層賣壓。所以，在超買的市場中，通常會出現價跌量增而價漲量縮的走勢。


    超賣的情況也適用類似而反向的推理。超賣的市場發展至某一階段後，由於股票價位已經明顯偏低，精明的投資者開始在低檔持續地買賣。市場中逐漸興起一股對於未來的希望與預期，在些許挑逗之下，便使股價在大成交量的情況下向上飆漲。這種價-量關係雖然適用於任何的金融市場，但——不幸地——僅有股票市場可以提供即時的成交量資料。在商品市場中，估計的成交量公佈於次一個交易日，實際的成交量則公佈於次兩個交易日。所以，請留意，價一量關係是一種通常而不是永遠適用的資料。它們應該是輔助工具，而不是主要的考量。


    # 結論


    現在，你已經知道什麼是趨勢，什麼是狹幅盤整，並瞭解一些造成趨勢變動的徵兆與原因。你也明白價格與成交量之間的重要關係，以及它們如何反映市場的心理狀況。如果你可以根據本章與前一章的內容思考市場的行為，你已經遠超過一般群眾的層次。


    下一個步驟是將這項知識——尤其是趨勢與趨勢變化的知識——簡化為一種單純而易於管理的系統。我將提出一種獨特而非常單純的圖形系統。這套系統是以模式認定為基礎，所以它是一種技術方法。然而，提出這種系統以前，我需要先說明技術方法的優點與缺點。'
