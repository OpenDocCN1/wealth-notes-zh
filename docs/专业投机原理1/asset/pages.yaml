  md: '美國國會、總統、聯邦準備理事會、外國政府、以及外國中央銀行，它們的貨幣政策與財政政策可能產生的影響，你也必須能夠瞭解。你不僅需要瞭解政府政策的影響，你也需要掌握主管當局負責人的個性與心態，並預期他們可能採取的政策。接下來幾章，我會探討這方面的問題，第II部份則會深入解說。


    # 自由的實現


    1978 年一位真正傑出的交易員 Howard Shapiro 邀我至 Interstate Securities 工作，於是我渡過一段最令我滿意的日子。最初，我是支領薪水，並全權管理一個50萬美元的交易帳戶。1979
    年 Interstate 將我的職務變更為獨立承包人（independent contractor），於是我成立了 Hugo Securities，這是一家目前仍然存在的私人交易合夥公司。唯一的條件是：Interstate
    交易帳戶的一切都是「50-50 平均分攤」，包括獲利、虧損與費用。這個條件也適用我管理的其他所有帳戶。表1所列的績效，涵蓋期間為1978年至1986年，這是我交易Interstate帳戶的毛利（尚未扣除費用）。我自己也有一個交易帳戶，但金額相對較小，另外還有一個帳戶，規模大約類似Interstate的帳戶；所以，我實際的交易績效大約兩倍於表P.1所列的數據。


    Interstate 的工作環境非常理想。我可以從事巨額交易，但除非發生虧損，否則完全不需動用自己的資金。由於營運上所俱備的經濟規模，這裡提供的資訊網絡設備非常完美。我的上班時間完全自己決定，我可以掌握自己的交易獲利，又可以完全根據自己方式生活。我已經找到我需要的自由。'
