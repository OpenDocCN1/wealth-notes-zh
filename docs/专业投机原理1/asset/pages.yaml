    有關空頭市場的情況，李氏的另一項觀察非常值得重視：


    空頭行情末期，市場對於進一步的利空消息與悲觀論調已經產生免疫的能力。然而，在嚴重挫跌之後，股價也似乎喪失反彈的能力，種種徵兆都顯示，市場已經達到均衡的狀態，投機活動不活躍，賣出行爲也不會再壓低股價，但買盤的力道顯然不足以推升價格……。市場籠罩在悲觀的氣氛中，股息被取消，某些大型企業通常會出現財務困難。基於上述原因，股價會呈現狹幅盤整的走勢。一旦這種狹幅走勢明確向上突破……市場指數將出現一波比一波高的上升走勢，其中夾雜的跌勢都未跌破前一波跌勢的低點。這個時候……明確顯示應該建立多頭的投機性部位。〔參考圖4.6。〕


