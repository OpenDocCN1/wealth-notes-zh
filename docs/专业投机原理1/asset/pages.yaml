  md: '信用交易程序的步調也稍快一些。


    信用交易是一種協定，放款者將產品或未經消費之產品的請求權（貨幣）借予他人或團體，在一段時間之後取得清償，通常還會附加利息。這類交易是奠基於放款者相信借款者能夠以未來的生產來清償。如果借款者清償借款，他雖然消費借來的請求權（資金），他創造的新財富具有更高價值的請求權（本金加利息）。對於放款者來說，清償價值大於借出價值之間的差額，便代表它未立即消費的報酬。


    如果借款者未履行清償的義務，他在運用產品的請求權時，至少已經消耗部份的商品，而創造的新財富又不足重置原來的請求權。債權人可以取回債務人持有的剩餘價值。借出與取回之間的市場價值差額便是損失——被消費的財富——它先前代表的市場產品已經不復存在。


    信用交易既不是禮物、也不是援助，它是市場上的交易。借款者（不論個人或團體）培養信用的方式，是穩定地從事生產，並根據交易協定（契約）履行清償義務。借取的資金可以用於消費或投資，但他必須承諾清償所借資金或物品。放款者選擇放款而不是立即消費或自行投資，是因為他相信借款者的清償能力。


    信用交易建立在債權人與債務人之間對於時間偏好上的（time-preference）差異。⑰債權人（更明確來說，儲蓄的存款人）決定延後自身的消費或投資，債務人則決定提前消費或投資，並以未來的生產清償。'
  merge: -1
  img_proc: true
