- pgno: 377
  md: '# 第十五章


    # 改變才能堅持


    如果你不知去向，很可能因此迷失。


    > ——David Campbell


    成為一位成功的交易者，必須保持一種心態：遵循交易守則代表快樂，違背交易守則代表痛苦。然而，即使你遵循交易守則，你偶爾還是會發生虧損，虧損總會帶來一些痛苦。你必須瞭解這種痛苦是自然而正常的現象，就如同你在刮鬍子的時候也難免割傷自己。在情緒的層次上，你必須能夠接受，這類痛苦並不重要，總會過去的。你必須明確體認，成功是一種改變的程序，而痛苦是程序一部份。


    由交易者與個人的角度來說，如果成功是一種由慾望驅動的改變程序，試圖調整當時的生理與心理狀況，成功的精義是掌控生理與心理環境的一門管理藝術。然而，猶如我先前所說，在俱備充份的知識下，改變生理環境的問題——採取有效的行動——取決於正確的動機，或根據知識採取行動的意志。


    我們知道，缺乏執行的意志，是來自於信念、價值觀與聯想的侷限性，所以在改變程序的最初階段，便該檢视心智的內容，並辨識這些侷限性的所在。'
  merge: -1
  img_proc: true
- pgno: 378
  md: '特定而言，改變的方法是揭開潛意識的內容；尋找侷限性的聯想、價值觀與信念；並以新的觀念取代，使我們得以邁向選擇的道路。務必記住，目的是達成一種心智狀態，使追求目標成為一種快樂——而不是痛苦——的程序。


    我們可以運用三項基本工具達成此目標：生理的軀體、意識與自動運作的潛意識。這三項工具早就相互配合而處於運作狀態中，每項工具都可支援或破壞其他兩者的功能。我希望提出一些基本原則，解釋如何控制它們，使它們一起支持你。


    # 運用你的身體


    維繫任何狀態都需要耗費精力，就如同設計不佳的機械將耗費較多的能源一樣，處於沮喪與挫折的心境中也將耗費較多的精力。不快樂與不滿足會造成額外的工作；它浪費精力，抑制慾望；對你的身體會產生負面的影響。


    設想某人處於沮喪的情境中。你可以由什麼生理特徵判斷他的感受？可能是行動緩慢、無精打采的動作、垂頭喪氣、語氣低沉而單調、呼吸短淺而夾雜著嘆氣。某人快樂而興奮的時候又如何呢？可能是行動迅速、姿態生動而富於表情、聲調高而頓挫分明、腰桿挺直、呼吸深沉…。其他如忿怒、得意、痛苦、戀愛或遭到拒絕，這些情緒又如何呢？它們也都有生理上的特徵。


    我們每一種感受都會反映在身體上，這種現象很有道理，因為猶如我先前所說，情緒是潛意識價值判斷的一種生理與心'
  merge: -1
  img_proc: true
- pgno: 379
  md: '理的反應。然而，由相反的角度來說——換言之，身體的改變也可以影響你的情緒——難道不也很地理嗎？。絕對是如此。例如，研究動機的專家Anthony Robbins在他的錄影帶中提出下列的動作練習。①你不妨試試看：


    站得筆直，兩肩擺正，抬頭看天花板。臉上露出大笑的表情，這看起來或許非常荒唐。現在，儘可能感覺自己很沮喪，但不可改變任何姿勢。繼續嘗試。


    你結果是不是大笑出來？如果感覺受到挫折、疲憊、悲痛或懶惰，你必須將自己的身體交給潛意識產生這種感覺。當你感覺動機充分時，身體便會表現充分的動機。覺得很舒暢時，動作便會表現出很舒暢的樣子。你感覺的精力充沛程度，便是你實際擁有的精力。所以，你的食物與運動，你如何運用與對待你的身體，都是重點所在。


    如果心智中存在某種聯想，阻止你採取積極的行動，你可以運用身體打斷這種聯想。Anthony Robbins將這一切整理為一種科學，所以我建議你參考他的書籍與錄影帶。然而，著手這項改變的程序時，你必須體認，透過身體的運作、練習與食物等方法，你有力量改變心智狀態。


    觀察職業運動選手時，你發現他們在重要時刻都會採取某種儀式。對棒球選手來說，可能是以球棒敲敲自己的腳，抓起一把砂子摩擦球棒，然後以腳整理打擊區。對網球選手來說，可能是在發球前在地面上拍一定次數的球，或在接球時來回跳動。足球選手更是以迷信著稱，比賽前總有一定的儀式。這些儀式都有共同的目的，重覆身體動作，以呼喚潛意識進入專注'
  merge: -1
  img_proc: true
- pgno: 380
  md: '的境界，準備因應接下來的挑戰。透過一定的儀式，運動選手以他們的身體管理潛意識。


    我在Interstate的時候，我們也有儀式。一為交易員戴著牛仔帽，並在腰上繫著手槍，行情出現不利走勢時，他會拔出手槍射擊報價螢幕。我經常戴著轟炸機員的皮帽，希望價格下跌或行情出現不利走勢時，我便會「轟炸」市場。這些動作或許有些稚氣，但都是很重要的儀式，可舒解鬱結的心情與交易的壓力。它們可以轉移忿怒的情緒，更重要者，它們使交易變得有趣，即使是虧損的時候！


    每個人都有身體上的儀式，雖然我們未必能察覺。每天早上繪製走勢圖，便是我的儀式之一。我可以輕易地把資料輸進電腦，讓它幫我計算，並列印圖形，但親自登錄數據，繪製趨勢線，可以使我的心智集中。


    然而，並不是所有儀式都具有正面的意義。由於工作的關係，我曾經在紐約住過一段時間，這裡最大的特色便是交通擁塞，駕駛人不斷地按喇叭（尤其是計程車司機）。這便是毫無意義的行為，僅是添加原本已經夠緊張的不健康氣氛。


    你的儀式是什麼？一定有。不妨考慮它們在你的生活中究竟扮演什麼角色？這些儀式有什麼功能？它們會舒解你的鬱悶或增添你的挫折感？會使你專注或使你分神？它們是否可以使你掌握快樂與避開痛苦，或是相反？


    留意你如何運用自己的身體——你的儀式。當你發現自己面對著報價螢幕咒罵著、由於虧損而沮喪、在擁塞的道路上忿'
  merge: -1
  img_proc: true
- pgno: 381
  md: '怒地按著喇叭、或任何使你覺得更不成功的行爲時，你不妨深深地吸口氣，並考慮上述問題。


    然而，最重要的是你必須採取行動使自己覺得舒服一些。把姿勢擺正、深呼吸、行動中表現出生氣、說話的聲調要有頊挫感、放一段你喜歡的音樂；根據你希望的感覺運用你的身體，你可以阻斷那些控制你行動的負面聯想。如果你可以成功地改變自己的感覺，應該珍惜這些改變；感受其中的樂趣，享受控制的快感。如果你經常如此練習，則可以在心智中建立新的聯想，在身體上培養新的儀式，在必要的時候，你可以仰賴它們改變你的情境。依此方式練習，你可以立即開始改變。


    僅仰賴生理上的改變而改變你的感受，似乎有些欺騙或不真實的意味。畢竟，我們的感受不才是真正的重點嗎？以機械性方式改變你的感受，難道不是對自己不誠實嗎？對於這些問題，我建議你考慮下列情況，究竟何者較有欺騙的意味或不真實：對著你無法控制的擁塞交通尖聲咆哮，或吸口氣而讓自己放輕鬆，並問自己一些問題？何者較爲實際：早上醒來感覺一種莫明的挫折感，並放縱這種感覺，或提起精神，拍拍手，歡欣地準備迎接新的一天？


    你的感覺確實是重點所在，但只要身體上的部分改變，你便可以大致上根據希望的感受，選擇你的感受。另外，改變你運用身體的方法，學習如何管理心境，這僅是永久性改變的一個层面而已。配合下面幾節討論的內容，運用你的身體加速這項變動的程序，協助你根據選擇的感受在潛意識中建立新的聯想。'
  merge: -1
  img_proc: true
- pgno: 382
  md: '交易中，情況尤其是如此。心情處於低潮的時候，你就看不見機會，反應不理想，缺乏信心。交易並不是一種例行的工作，而可以讓你安然渡過這些艱困的期間。你必須保持敏銳而專注的精神，才能夠做好工作。情況不理想時，你必須以身體的動作振奮自己。我經常會利用一副牌協助自己保持專注。我一面看著報價螢幕，一面洗牌、單手切牌或以其他的動作集中精神。曾經有人告訴我，僅要看我每分鐘的洗牌次數，便知道我是否擁有部位。


    運用身體方面，我尤其強調運動的重要性。許多研究報告都顯示，運動可以降低壓力，增進精力與心智的活力，並有助於提升自尊心。因為交易必須面對著市場中的不確定性，是一種壓力很大的活動。我個人可以為運動的效益做見證，停止做運動時，我的生理與心理狀態便會立即反應，顯示所有相關的研究報告都沒有錯。


    覺得疲憊或蒙受壓力的時候，通常你最不想做的事情便是運動。然而，這個時候，你知道你必須站起來，穿上運動服，到戶外或健身房，然後運動。根據我個人的經驗，當我克服心中猶豫而前往運動時，從來不會覺得後悔。另外，心情低潮往往是不運動最不恰當的時機。陷入低潮時，你必須中斷那些讓你陷入低潮的模式，運動便是最佳的方式之一。有些時候，這或許相當困難，但你會得到應有的報酬。


    我認識一些人，把運動時間看成重要的正式約會。猶如會議或商業聚會一樣，他們在行事曆上以色筆圈出運動的時間，唯有特殊的事故才會取消，例如：家中有 Velvet過逝。不妨想一'
  merge: -1
  img_proc: true
- pgno: 383
  md: '想。你的健康、你的精力與你的生命，難道不是和商業約會或社交聚會一樣重要嗎？運動是一種投資，它代表現在與未來的感覺，而且它還有助於你的事業經營，因為它可以提供更多的精力，更專注的精神，並提升你的自信心。這段話——讓你、我共勉。


    運用與管理身體的活動，這是改變處境最快的方式，但並不足以造成永久性的改變。你可以利用身體的活動中斷舊有的模式，建立新的聯想，但如果你想把這些新的聯想真正深植在潛意識中，你必須以信念與價值觀支持它們。若希望這麼做，你必須面對自己最重要的資產：意識。


    # 運用你的意識


    討論如何改變心境時，我雖然首先提及身體活動的運用，其中已經蘊涵著意識的運用。因為在你從事任何變動以前，你必須認知（aware）自己的問題，專注（focus）於發生的問題，評估（evaluate）目前行動的後果，並投射（project；譯按：將觀念具體化為心象的程序）即將採行之其他行動的影響。


    認知、專注、評估與投射都是可供運用的工具，我們必須學習如何使用它們，如此才能夠成功。雖然它們都已經在運作中，但由於不當的個人管理，這些工具的運作可能產生不利的功能。如果它們的運作並不恰當，這是因為我們的聯想、信念與價值觀呈現矛盾與侷限性，導致潛意識發出相互衝突的指令。非常諷刺地，我們瞭解這些侷限性的唯一方式，是透過它'
  merge: -1
  img_proc: true
- pgno: 384
  md: '們所壓抑的功能——認知、專注、評估與投射。


    1980 年代初期，我在辦公室訓練交易員時，我告訴他們，有效從事交易必須學習三件事情：觀察、專注與思考。我希望傳達的意念，是成功交易必須俱備的心智狀態。假定你已經擁有交易需要的基本知識，下一個步驟是觀察市場的行為；留意與思考當時發生的資料，例如：經濟與政治的新聞、市場的價格走勢、相關市場的價格互動、以及其他等等，這就如同你在閱讀運動版的報導、玩橋牌或其他你認為有興趣而易於學習的事物。


    如果你能夠進入專注的境界，你的意識將全然指向市場，遠離生活的其他問題。這種情況下，你將「感覺」市場的走勢方向，你將「聽見」來自潛意識的指令：「立即賣空 S&P
    指數期貨。」


    實際建立交易部位之前，你應該干預意識的運作，並評估潛意識的結論。所謂評估，是核對這筆交易是否符合你的交易法則。你必須問自己：「風險/報酬比率是否至少有 1：3？這筆交易是否順著你希望介入的趨勢？價格是否已經測試先前的重要高點而未能突破？…。」


    換言之，你必須根據自己擬定的交易法則，評估潛意識所做的判斷是否有效。如果潛意識的判斷確實有效，則交易。否則，放棄。如果你能以一致的態度進行這個程序，你的交易應該很理想，並對於潛意識的「聲音」愈來愈有信心；評估的程序也會愈來愈自動化，這時候你幾乎可以全然「信賴你的直覺」。'
  merge: -1
  img_proc: true
- pgno: 385
  md: '不幸地，訓練這些交易員時，我不能以上述的明確方式說明這個程序的性質，因爲這是我隱含的操作方法；換言之，我採用這種方法，但並不全然認知我的所做所爲。許多擅長某些事物的人，並不知道自己的技巧究竟是什麼。他們可能說，「我信賴我的直覺，」或「我只是隨心所慾地做，結果就是如此。」對於那些特別擅長某些事物的人來說，我相信他們都非常仰賴上述程序，程度上或許有差異，但性質上應該大致如此。


    在擬定適當決策與採取有效行動的時候，你必須「觀察、專注與思考」，以另一種方式表達，你必須整合認知、專注、評估與投射的功能。如果你瞭解這些功能如何運作，你便可以學習如何管理與控制生活中的每一個層面。所以，讓我更詳細地說明這些功能，並解說如何運用它們辨識與改變價值觀、信念與聯想的侷限性。


    # 認知


    究竟何謂認知（awareness）呢？哲學家對於這個問題的答案已經辯論了2000多年，我們僅準備採用一個簡單的答案：認知是感知（perceive）存在的能力或功能。我們感知的對象是現實的原始資料。我們如何認知對象，我們的心智如何解釋，取決於我們的知識與信念。


    例如，如果你拿一副股價走勢圖給某人看，他幾乎完全不瞭解金融市場，他可以認知什麼？基本上，他僅看到一大堆亂七八糟的線條與數字，或許還可以察覺價格呈現某種波浪狀。'
  merge: -1
  img_proc: true
- pgno: 386
  md: '我舉這個例子是要強調一個重點：你的認知範圍具有前後關連性（contextual）。爲了認知某個對象，你必須瞭解理對象的性質。這便是知識何以重要的原因——它擴大你的認知範圍。務必留意，潛意識僅能夠「閱讀」它在程式設計上所能瞭解的語言，不能接受太多外來的（extraneous）資訊——它根本不知道如何處理！


    然而，認知最大的障礙並不是知識的不足，而是在心智程式中發生無意的（inadvertent）疏忽。如果我們指示潛意識不要接受某些資料，它會聽從命令，也將因此而不可能全然瞭解相關的事物。然而，只要記憶你已知的某些事物，你便可以運用認知的功能，理解你疏忽的事物，並察覺其中的問題。


    如果生活中的結果不符合你的意圖，顯然出了差錯——你的心智出現矛盾。達成目標最大的障礙可能是認知的侷限性，這是因爲我們在無意中採用負面的聯想與信念。反之，正面的聯想與信念，可以提升認知。


    如果你不斷疏忽重要的事物，認知這種現象的唯一徴兆是某種類型的失敗，然後你可以利用失敗爲起點。爲了追求一致性的成功，你務必體認與接受一項事實：不僅是成功，你的失敗也是絕對重要的步驟。體認錯誤與失敗，並學習接受它們，這是一種積極的態度。


    我說你必須「接受」成功與失敗時，我強調的意念是：你造成的每一項結果，都是自己選擇的結果。你，也唯有你，必須對自己所造成的結果負責。超級交易員的訓練師 Van
    K. Tharp 如此解釋：'
  merge: -1
  img_proc: true
- pgno: 387
  md: '事情出錯的時候，投資者（或任何人）最應該做的事，是判斷自己如何造成這種結果。我並不是說你應該責備自己。我是說，在某個時間，在某種情況下，你做了某種選擇而導致目前的結果。分析那項選擇究竟是什麼，並在未來遭遇類似情況時，讓自己有其他可供選擇的方案。未來發生類似情況時，如果採用不同的決策，你得到的結果也將改變。而且，現在便設想你將採行的方案，以便將來易於執行。②


    人們經常將錯誤、失敗與痛苦歸咎於其他人或事件。然而，如果你不斷提醒自己，它們都是你個人行為的結果，你可以認知它們的原因。錯誤、失敗與痛苦都是生活的一部份，我們都希望規避它們，但我們不能以否認來規避。如果我們可以透過選擇接受它們，它們便無法支配我們。它們變得正常，甚至於是成長、學習與成就的正面機會。


    在 Reminiscence of a Stock Operator 一書中，Jessie Livermore 寫道，「我不介意犯錯，但我不願意處於錯誤之中。」我對於這句話的解釋是，犯錯是可以接受的，但不可以犯錯之後而不承認，並繼續置身於錯誤之中。我曾經在Lehigh大學演講，我問當場200多位的學生，有多少人願意承認自己的錯誤。只有一個學生舉手！我立即提供一個交易員工作給他，我是講真的。


    因此，以一部份心智留意自己的行為。傾聽頭腦中的「細微聲音」，以及你對自己說的話，並嘗試將錯誤的結果與痛苦歸咎於於外部的力量。你這麼做的時候，你是試圖改變現實符'
  merge: -1
  img_proc: true
- pgno: 388
  md: '合你的心智內容，而不是調整你的心智內容來精確感知現實。這種程序稱為「尋找藉口」（rationalization），這是避免痛苦採用最危險與混淆的方法。尋找藉口之所以危險與混淆，因為它總是偽裝在邏輯的外表之下。


    在生活的某些層面中，尋找的藉口可以存在很久的時間，你無需處理它造成的影響。在「華爾街」，藉口可以造成立即的傷害。如果你不願意接受失敗，如果你試圖將失敗歸咎於外部事件，你無法在先前的錯誤中學習，結果可能是徹底的失敗。


    關於錯誤與失敗，我們可以尋找的藉口實在太多了，它們通常都蒙著真理的外衣。例如，某人在男女關係中不斷遭受失敗，他被一位新認識的異性朋友吸引時，他可能對自己說道，「我只是在愚弄自己。我不能不斷更換女朋友。我還沒有準備另交女朋友。我需要時間建立自我的感受。」情況可能真的是如此，但實際的動機也很有可能是再度失敗的恐懼感。


    總之，我們必須謹慎留意試圖逃逸的慾望，尤其是真理在我們可以理解範圍內的時候。如果你可以掌握這些試圖否認的關鍵時刻，認知它們真正的情況，你便可以運用專注、評估與投射來消除它們。


    # 專注


    專注是指引認知的方法；在專注的情況下，我們同時縮小與擴大意識認知的領域。例如，對於市場俱備一般性知識的交易者，他同時只應該從事二至五個市場的交易（最好是相互關'
  merge: -1
  img_proc: true
- pgno: 389
  md: '連的市場）。他減少交易的市場數目時，對於這些特定市場所能處理的資訊也因此可以擴大。


    意識同時只能處理數量有限的資訊。爲了處理與瞭解層出不窮的認知對象，心智僅會選擇部份的感知對象，將它們整合納入知識與記憶的前後關連中。我們僅納入認爲重要的對象，並由價值觀與信念做爲濾網，以指引我們的專注。


    價值觀與信念決定我們專注的方向，後者又決定我們如何感知自身，以及如何感知我們與外在環境和他人之間的關係。透過自我認知（self-awareness），如果我們能夠辨識專注的方向，我們可以選擇相關的價值觀與信念，決定生活的方向，並控制這個方向。


    例如，我檢視自己由何處取得專注於市場的能力時，發現自己非常幸運，在孩童時代，我便採取一種非常有助於學習與成就的信念。在某一期間，我並不瞭解何以如此，但我決定，成就任何事物的唯一方法，是就我所認定的領域，儘量閱讀，不斷練習，並以成功者做爲模仿的榜樣。


    這種信念最初運用於棒球，其次是體操，再來是撲克牌，最後是在金融市場交易與投機。以一句話來說明這個信念：


    只要有足夠的知識與練習，我可以精通任何我所希望的事物。


    有關達成目標所需整個學習與練習的程序，我很早也採取一種非常重要的聯想：'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# 這很有趣！


    我當時並不瞭解，這種聯想讓我成功。這些聯想深植我的內心，它們現在發揮的功能遠勝於我當初玩棒球的時候，因為我現在更瞭解如何學習與成長。


    學習很重要，這個信念讓我專注於儘可能地吸收知識，擴大我的認知領域。例如，我學習棒球的時候，曾經閱讀一本有關棒球基本技巧的書籍，於是我觀察職業選手的動作，並思考他們如何運用這些基本技巧。這擴大我的認知領域與知識，因為職業選手的動作成為一種評估的標準，判斷我自己的表現。我將職業選手的動作映射在我的心中，並儘可能模仿他們的姿勢與風格，使自己的揮棒動作與守備技巧都達到理想的境界。


    目前，學習與練習並重的信念，以及我獲得的成果，使我充滿自信、精力與熱忱地追求我的目標。這使我對一般人所謂的「艱辛工作」產生積極而精力充沛的感覺。研究市場確實是艱辛的工作，但它們在我的內心並未產生負面的意涵。對我來說，工作是快樂的泉源。就如同棒球一樣，它很有趣。我將自己的作為視為是有趣的活動，這使我可以做開心智而無畏地接納所有資料。我的潛意識沒有理由遮斷我的認知，因為我基本上認為，只要根據這種方法行動，我終究是一個贏家。


    相反地，孩童時期的另一個聯想，對我造成嚴重的限制，我花費相當的精力克服這項聯想，甚至於現在還非常在意它。雖然我精通棒球、體操與撲克牌，但我高中時期的學業成績很差。我從來沒有認真學習，一切都僅求及格而已。我的成績大'
  merge: -1
  img_proc: true
- pgno: 391
  md: '多是C，外國語言不及格。學校生活對我來說是一種沉重的負擔，一種必須忍受的邪惡，因爲我沒有選擇的餘地。事實上，我的聯想是：


    學校是一個令人痛苦的沉悶場所，使我無法從事

    我熱愛的活動。


    你不知道我多麼希望，能夠把我懈有的精力與熱忱運用在學校的功課中。現在，我必須聘請一位作家協助我撰寫本書，這一方面雖然是因爲我沒有足夠的時間，主要更是因爲我在學校中沒有學得足夠的寫作技巧。


    非常幸運地，我始終熱愛閱讀，這對我幫助很大，每當我需要學習新事物時，免不了會有一种恐懼感。例如，我完全仰賴我的同事Douglas———位電腦天才———照料辦公室裡的電腦，教我如何使用這些設備。我們安裝新的報價系統時，我的心中總會想著，「還好有Douglas，我自己絕對沒有辦法搞清楚如何操作這些東西。」


    在有關電腦的學習方面，我對於正式教育的信念，嚴重侷限我的專注能力。我不認爲學習很有趣，它是一種沉悶的程序。所以，每當我不知道如何使用電腦設備，或有什麼差錯的時候，我總是找Douglas幫我解決。我知道，我可以學習電腦——它們不可能比市場更複雜——但我在這個領域內無法保持專注。很幸運地，我實在沒有必要學習，因爲我始終可以仰賴Douglas，但如果我真的必須學習的時候，我便需要挑戰上面的陳述。'
  merge: -1
  img_proc: true
- pgno: 392
  md: '「我自己絕對沒有辦法搞清楚如何操作這些東西，」不妨想想這句陳述的威力。這類的陳述會侷限我們的專注能力。潛意識的功能雖然非常可觀，但它也很易受騙——它相信你要它相信的任何事物。你對自己說，「我自己絕對沒有辦法，」或「我沒有能力做這個，」或「開玩笑，這是不可能的，」或「沒有人這麼做，」你的潛意識便會傻呼呼地說道，「噴得了！」於是開始強化你原本已經有的侷限性。


    這類侷限性很容易受到控制，你僅需認知你對自己說的話並改變；透過努力重新架構你說的話，迫使潛意識產生正面的行動。你必須善用潛意識易於受騙的性質，管理專注的能力。


    例如，你想說「我自己絕對沒有辦法」的時候，你可以修正為「這相當不簡單，我如何使它變得容易一些？」你想說「我沒有能力做這個」的時候，你可以修正為「我以前曾經失敗，現在應該怎麼解決呢？」你想說「開玩笑，這是不可能的」，你可以修正為「這為什麼看起來不可能，我到底疏忽了什麼？」你想說「沒有人這麼做」的時候，你可以修正為「奇怪，以前為什麼沒有人這麼做？」或甚至於「這可能是一個突破，以前從來沒有人這麼做過！」


    我們與自己的對話方式將引導我們的專注能力。我們對自己的說話內容與方式，代表我們對於人生是採取積極或消極的態度。另外，這也會影響潛意識產生之結果的質與量。


    如果你瞭解如何與自己對話，瞭解如何要求自己，瞭解如何對自己提出問題，你便能將心智專注由負面的聯想轉移至正'
  merge: -1
  img_proc: true
- pgno: 393
  md: '面的聯想，這只需要在意識上改變說話的語氣、語意的重心、要求的内容、以及問題的意涵。


    # 疑問的力量


    你是否曾經留意，上文中，我將大部份的陳述重新組裝爲疑問句？這並不是巧合。疑問句最容易改變認知的專注。


    每一個人的腦海裡，都蘊藏著非常可觀的知識，遠超過意識所可理解的範圍。對自己提出問題時，我們指引潛意識針對真正的問題尋找答案，而不是被動地接受自我的局限。許多情況下，答案早已經存在，你需要做的僅是提出問題！然而，你必須誠心誠意地提出正面的問題，並全心期待答案。


    本書第I篇中，我曾經提及一個問題，足以顯示疑問的功能。1974年，我錯失10月份的低點時，我問自己：「我需要學習什麼才不至於重蹈覆轍？」這個問題又牽引出系列的問題，例如：「趨勢究竟是什麼？它通常會持續多久？它的漲幅或跌幅通常如何？」回答這些問題的過程中，我「突然想到」——就像漫畫中所亮起來的燈泡一樣——運用歷史價格的統計分配評估風險。


    如果當時我提出來的問題是：「維克，你怎麼會這麼愚蠢而錯失這個走勢呢？！」或「看看你所錯失的良機！」我的一生會多麼的不同啊！若是如此，我雖然不知道現在會如何，但我確定自己絕對無法發展出獨特的統計方法分析風險，這可能是我一生最引以爲傲的成就。'
  merge: -1
  img_proc: true
- pgno: 394
  md: '所以，你必須留意對自己說的話，對話中不要採用譴責的口氣，應該提出問題引導積極的改變。有些問題絕對應該避免，例如：「這種事怎麼會發生在我身上？我怎麼如此倒楣？我怎麼會如此愚蠢？這個世界何以如此不公平？我為什麼不能也富有？為什麼大家都如此對待我？」你提出這類問題時，潛意識提出的答案可能與現實全無關連，例如：「因為你不值得這一切。因為你是一位天生的輸家。因為你是一個無知而毫無價值的人。因為除了少數的幸運者以外，人生本來就不公平。因為只有幸運者才能夠富有，而你只是一個天生的輸家。我早就告訴過你，因為你是一個無知而毫無價值的人，你不值得擁有這一切。」


    你對自己提出這類問題時，就如同你問某人，他是否還繼續打他的妻子，雖然你沒有任何證據顯示他曾經這麼做。這類問題都別有所指；它們都隱含地接受一些應該被挑戰——而不是被強化——的負面信念。


    我以相當篇幅談論如何提出問題，不僅因為它們可以有效改變你專注的方向，而且也因為其中含有根本的評估成份，透過評估才可以瞭解妨礙成就的侷限性價值觀與聯想。


    # 評估的重要性


    進一步討論以前，我想應該重新回顧心智的運作方式。我們的活動雖然直接受到潛意識心智的程式驅使，但根本的決定因素是我們持有的信念與價值觀（不論我們是否能夠認知）。特定而言，在潛意識的層次上，我們的行動是受到兩種主要情'
  merge: -1
  img_proc: true
- pgno: 395
  md: '績驅使：追求快樂的慾望與避免痛苦的需求。另一方面，這兩種情緒取決於潛意識中的聯想，而聯想的形成又是根據我們接受的價值觀與信念，這個程序未必受到意識的認可。


    截至目前爲止，我們似乎把「價值」與「信念」視爲相同，實際上並非如此。價值是我們所追求者，是行動希望獲得或保有的對象。爲了判定價值，我們首先必須評估（evaluate）；換言之，根據價值的某種標準排列重要性。信念是評估所根據的標準；它們決定我們對於價值的反應方式。價值是行動的對象，信念是標準，讓我們可以根據某種方式體驗價值。


    例如，假定兩個人都視金錢爲有價值；換言之，兩人都希望賺很多錢。其中一個人對於金錢的觀念很健康，認爲它是達成許多慾望的工具。然而，另一個人在潛意識中認爲「金錢是萬惡的根源。」如果兩個人都賺了很多錢，第一個人可以充分享受，買一棟漂亮的房子，經常渡假。第二個人可能無法真正享受他的財富。他使用金錢時，會隱約浮現罪惡感。


    你整體的道德架構——價值觀與信念——將決定你的特質（character）；決定你的行爲。信念決定個性（personality）；它們決定你如何行爲與如何體驗行爲。瞭解價值觀與信念，以及兩者之間的差別，是非常重要的概念，所以我們將分別詳細討論。


    # 價值與特質


    除了生理特徵之外，特質（character）與個性'
  merge: -1
  img_proc: true
- pgno: 396
  md: '（personality）讓你成爲真正的「個人」（individual）。你的特質取決於你的價值觀是什麼，你追求的是什麼。你的個性取決於你如何行爲。猶如先前的說明，你的行爲取決於你的價值觀。你如何行爲取決於你採用的一組獨特法則或標準——你的信念。首先，讓我們討論價值。


    價值有兩種基本的型態：手段（means）價值與目的（ends）價值。你是否記得，我在第I篇對於經濟學的定義？它是研究如何運用手段達成既定的目的。手段價值是我們生活中實際追求的形式，例如：金錢、事業、個人關係、健康與汽車。目的價值是我們希望達成的情緒性愉悅狀況，例如：愛、成功、快樂、滿足、舒適、安全與興奮。第II篇的討論範圍內，我們關心的主要對象是目的價值；生命是由目的價值驅動。


    我們持有的每一項目的價值，都存在一個負面的對應情緒，我們姑且稱爲「反價值」（disvalue）。反價值是我們希望避免的情緒性痛苦狀況，例如：被拒絕、失敗、挫折、憂慮、忿怒、羞辱與沮喪。我們是受到追求愉悅的慾望與/或避免痛苦的需求所驅動，我們的目的價值與反價值便是驅動者。


    你可以對自己提出下列的兩項簡單問題，來判定你的目的價值與反價值：


    在我的______中，什麼最爲重要？


    在我的______中，什麼是我所希望儘可能避免的事物？'
  merge: -1
  img_proc: true
- pgno: 397
  md: '首先在空格內填入「生命」，其次再填入較特定的內容，例如：事業、人際關係、或你希望考慮的任何生活層面。回答問題時，以最快的速度寫下答案，不可停頓。例如，你的答案可能是：


