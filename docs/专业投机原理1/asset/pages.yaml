- pgno: 39
  md: '股票組合。這是我正式踏入獨立交易員生涯的第一步。我第一次擁有完整的權利操作一個帳戶，交易績效列於表P.2中，我正邁向一致性獲利的目標。


    1973年「芝加哥選擇權交易所」（Chicago Board Options Exchange；簡稱CBOE）將選擇權的契約規格標準化，於是我們喪失了競爭優勢，因為我們過去的成功主要便是透過自己的程序將契約標準化。然而，我們買進交易所的三個席位，而且第一年交易量便佔整個交易所的15%。一切非常順利，但1975年7、8月間，我的主要合夥人在未經我的同意下，交易一筆非常龐大的部位，並造成嚴重虧損。雖然公司交易帳戶的情況相當理想，但因為我的合夥人發生虧損，所以我們被迫重組以符合最低資本的規定。


    透過一些果斷的處理，我們總算渡過難關。我記得當時與Jim Brucki會談的情況，他在CBOE主管稽核的工作（Jim後來也到Interstate，我們成為好朋友）。由於我的合夥人發生虧損，我們已經違反交易所的一些資本規定。Jim是一位身材高大而粗獷的人，他看著我說，「你準備怎麼處理這個問題？」


    我回答，「讓我們討論一下，我們會設法補足相關部位的保證金。」


    Jim說，「好的，你有20分鐘的時間考慮如何繼續經營。」


    我、John Bello、以及發生虧損的合夥人一起走進隔壁房間協商。我買斷這位主要合夥人的股權，補繳所需要的資金。我'
