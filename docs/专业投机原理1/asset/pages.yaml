- pgno: 72
  md: '在The Dow Theory一書中，李氏列舉「道氏理論」中他所謂的「假設」（hypotheses）與「定理」（theorems）。事實上，它們應該分別被稱爲原則與定義，因爲「道氏理論」並不是類似如數學或物理學等嚴格的科學系統。撇開這方面問題不談，因爲人們對於「道氏理論」的解釋並不正確，所以我將直接引用最初的資料來源。②以下，我將引用李氏本人的文字以及他的說明秩序。大體上，李氏的觀念仍然適用於目前，但我在引用文字之後會做一些必要的澄清與修正。


    根據李氏的看法，「道氏理論」奠基於三項基本假設上，它們必須被「毫無保留地」接受。


    # 假設1：


    人爲操縱（Manipulation）：指數每天的波動可能受到人爲操縱，次級折返走勢（secondary reactions）也可能受到這方面有限的影響，但主要趨勢（primary
    trend）絕對不會受到人爲的操縱。


    這項假設的立論根據是，股票市場非常龐大而複雜，任何個人或團體都無法長期影響整體股票市場的價格。這是「道氏理論」的重要根據，因爲整體股票市場的價格，如果可能經由個人意願改變，觀察市場指數便沒有任何意義了，除非你想瞭解操縱者的意圖。我們探討「假設2」時，可進一步理解「假設1」的重要性。


    道氏、Hamilton與李氏都認爲，當時人們都過於高估人爲'
  merge: -1
  img_proc: true
- pgno: 73
  md: '操縱（包括個人與集體的操縱）的嚴重程度。他們都認爲，人爲操縱的指控，主要是人們投機失敗時，用來推卸自身責任的一種藉口。


    我相信，今天的情況也是如此。就嚴格管制的現代市場來說，個人對於市場的操縱基本上是一種不可能的行爲，甚至於短期間的操縱也不可能。然而，電腦程式交易則是一種重要的人爲操縱形式，我們將在第6章討論這方面的問題。就基本而長期的角度來說，主要趨勢仍然無法被操縱，但趨勢的性質可能被改變，我們發現自從1987年10月份崩盤以來便有這種現象。機構法人的交易動輒數十億美金，這會加速主要趨勢的進行。


    # 假設2：


    市場指數會反映每一項資訊（The Averages Discount Everything）：每一位對於金融事務有所瞭解的人，他所有的希望、失望與知識，都會反映在「道瓊鐵路指數」與「道瓊工業指數」每天的收盤價波動中；基於這個緣故，市場指數永遠會適當地預期未來事件的影響（上帝的旨意除外）。如果發生火災或地震等天然災害，市場指數也會迅速加以評估。


    > 〔附註：李氏在括弧中的說明，應該改爲「上帝的旨意與政府的行動除外，尤其是聯邦準備理事會的行動」。〕


    道氏本人也提及相同的基本看法：'
