- pgno: 267
  md: '週六晚上6點，Volcker舉行記者會，宣佈他準備徹底改革Fed 貨幣政策的計劃。


    Volcker宣佈，重貼現率由11％調升為12％，而且法定準備也將適用於銀行的國外負債。這兩項行動顯示，Fed已經有控制通貨膨脹的決心。另外，Volcker又宣佈，從此以後，FOMC不再仰賴設定聯邦基金的目標利率，將透過公開市場操作直接控制銀行的準備金，並以此直接控制貨幣供給。這才是貨幣政策的關鍵改革。這個時候，Volcker僅是採用心理戰術平息投機熱潮。1980
    年大選之後，真正的緊縮才會開始。


    我詳述這段故事，目的是希望顯示，「哲學之王」確實控制我們的經濟，他們的知識卻相當有限。Fed 以嘗試錯誤的手段追求真理，卻以我們的經濟生活當做實驗品。在我進一步說明Fed
    這方面的問題前，讓我先討論公開市場的操作。


    # 公開市場操作


    任何的公開市場操作——Fed 買進或賣出政府證券——都會以一美元對一美元的效果影響銀行體系內的準備金數量；買進會增加準備金，賣出會減少準備金。如果賅解金本位制度的運作方式，則Fed在公開市場操作俱備的權力，相當於Fed
    擁有數百萬英兩的黃金，可以隨時注入或移出銀行體系——如果在私有部門，這應該被視為是一種獨佔的權力。


    公開市場操作有數種不同類型，每一種方法對於信用供應與貨幣成長的影響都稍有不同。某些操作相當隱密，某些相當'
  merge: -1
  img_proc: true
- pgno: 268
  md: '公開。如果你瞭解各種操作方法，並以此觀察Fed的活動，不僅可以掌握貨幣政策的方向，並可以瞭解「理事會」與FOMC成員的心理。由於經濟活動的方向，主要取決於這些大人物
    的心智，所以我們需要嘗試瞭解他們的思想。


    公開市場操作基本上可以分爲兩種：長期與短期。爲了達成長期的操作目標，主要的工具是買斷或賣斷證券，所謂「證券」通常是指財政部發行的國庫券、中期與長期債券。如果目標是增加準備金的供應量，經理人會在拍賣過程中，由交易商買進證券，直至準備金達到理想的水準爲止。如果目標是減少準備金的供應量，經理人會在拍賣過程中，將證券賣給交易商。另外一種增加準備金的方法，是聽任銀行體系投資組合內的證券到期而不替補。


    經濟體系內出現季節性的貨幣需求增加（例如：聖誕節的採購旺季），或因爲其他技術性的短期因素導致準備金不足時，Fed會運用附買回協定（repurchase agreement；RPs；市場簡稱爲repos）。在附買回交易中，Fed向交易商買進證券，交易商同意根據特定的價格，在特定期間（期間可能在1天至15天，通常爲7天）內買回這些證券，但交易商通常有權利在到期前終止契約。


    附買回協定的反面是「配對的賣出－買進交易」（matched sale-purchase transactions）。市場上通常稱爲「配對賣出」（matched
    sales），由兩部份構成，一是立即賣出證券（通常爲國庫券）的契約，另一是稍後（通常不超過7天）向同一位交易商買進相同數量證券的配對契約。發生季節性或'
  merge: -1
  img_proc: true
- pgno: 269
  md: '其他技術性情況時，Fed 可以在短期的基礎上，利用配對賣出減少體系內的準備金。


    根據上述的講解，這些操作似乎沒有害處，甚至相當合理。然而，容我重覆強調，你必須瞭解所有的公開市場操作都是創造或減少銀行帳面上的存款。增加額外的準備金時，銀行體系可以透過放款增加貨幣供給。在這種情況下，以米賽斯的用語表示，不論名目利率的水準如何，市場毛利率的水準都會下降。


    相反地，如果 Fed 賣出證券而抽取系統內的準備金，會減少銀行準備金帳戶內的餘額。如果 Fed 的緊縮使整個銀行體系的準備金不足，銀行將提早回收貸款，景氣將開始收縮——即使名目利率維持不變，市場毛利率的水準也會上升。


    附買回與配對賣出雖然是短期的操作工具，可能產生顯著的長期影響。如果 Fed 固定從事附買回交易，始終保持一定餘額的附買回協定，由銀行體系的角度來看，相當於是買斷。


    聯邦基金是一個非常有效率的市場。任何銀行基於利益的考量，一定會透過市場借出超額準備，即使僅是隔夜的放款也是如此。如果 Fed 透過附買回而持續釋出準備金，對於聯邦基金市場與聯邦基金利率都會構成重大的衝擊。如果
    Fed 終止以附買回提供短期準備金的例行性政策，相當於是以隱密的手法「稍加」緊縮。配對賣出或變動配對賣出的餘額，對於市場也會產生類似而反向的影響。


    在 Fed 所有的政策中，買斷與賣斷的意義最明顯。發生這'
  merge: -1
  img_proc: true
- pgno: 270
  md: '類的交易時，新聞媒體會立即加以報導，它們的影響通常很容易預測。


    然而，有關Fed政策影響的最佳指標，並不是買斷與賣斷的數量，而是銀行體系內自由準備（free reserves）的水準與變動量。


    自由準備等於超額準備減去貼現窗口不包括長期融通的借款餘額。①這項數據是衡量Fed政策寬鬆或緊縮的關鍵指標，每個週日都會刊載於Barron’s雜誌與其他金融刊物，你也可以直接向Fed取得這項資料。概略上，如果自由準備為正值，你可以將該數據乘以10，計算當前市場中的信用供給潛能。如果自由準備為負值，代表信用正趨於緊縮。然而，Fed在緊縮信用時，這項數據未必為負值。


    Fed緊縮信用時，這項數據也可以是正值。以米賽斯的市場毛利率思考，或許較清楚。如果自由準備的水準趨於下降，不論名目利率如何，市場毛利率的水準都會上升。


    這代表可供投資的資本已經看起來較先前為少。如果其他條件不變，自由準備的水準降低，則情況恰好相反。在判斷信用的發展時，你應該觀察自由準備水準的變動量，以及聯邦基金利率、貼現率、調整後貨幣基礎（adjusted
    monetary base）的成長（下降）率②、貨幣供給成長率、消費者物價指數（CPI）與生產者物價指數（PPI）。


    長期來說，Fed的政策有一個基本的趨勢，它將持續擴張，貨幣供給將繼續增加，美元的購買力將不斷下降。根據美'
  merge: -1
  img_proc: true
- pgno: 271
  md: '國勞工部與「勞工統計局」的資料顯示，1988年12月價值1.20美元的物品，在1961年爲30美分，在1913年12月份爲10美分。然而，Fed的擴張性貨幣政策，並不是導致美元價值下降的唯一因素。美國政府持續採用的赤字支出政策，也應該負起相當的責任，所以我們必須瞭解赤字支出對於經濟循環的影響。


    # 赤字支出：對於貨幣與信用的影響


    此處將提供一些令人心驚膽跳的事實。美國政府最近一次未出現赤字的年份是1969年，當年的預算盈餘大約爲40億美元。從此以後，赤字支出便處於惡性膨脹的趨勢中，所以1990年3月預算赤字——單月份的預算赤字——便大於1975年整個會計年度的預算赤字。


    根據Grant’s Interest Rate Observer的資料顯示，1989會計年度結束時，聯邦總負債毛額爲2.866兆美元，倘不包括政府保險計劃的面額4.124兆美元，以及在外流通的聯邦信用1.558兆美元。1989年，政府支出經費爲GNP的22%，創七年來的新低記錄！聯邦債務的利息費用佔GNP的3.3%，而且自從1983年以來便不曾低於3%。以1988年9月30日爲基準，「聯邦審計長」（Comptroller
    General）估計美國的淨值爲負的2.4526兆美元，不包括以面額計算的公有土地與採礦權。⑬


    基本上，這些數據本身便足以反映其意義。美國有一個舉債成癮的政府，這個趨勢如果持續發展，則滿足債癮的劑量終致命。


    假定你向兩家銀行各申請一張信用卡；你每個都以一張'
  merge: -1
  img_proc: true
- pgno: 272
  md: '信用卡支付另一張信用卡，而且你的支出始終大於你的收入。這兩家銀行都不瞭解你的行為，並因為你每月份都按時付款而增加你的信用額度——在銀行的心目中，你是信用最佳的客戶。


    雖然銀行不瞭解你的情況，但你開始半夜驚醒，盤算著每個 月不斷膨脹的利息費用，擔憂整個計劃不知還可以維持多 久。


    這基本上便是美國政府數十年來的運作方法。它有兩個主要的舉債管道：一般民眾或Fed；為了清償債務，它每年都必須借入更多的資金。


    如果你傾聽政治家們分析預算赤字的情況，以及它們對於美元價值與經濟循環的影響，你將一頭霧水。在野黨永遠責怪預算赤字造成惡性通貨膨脹，執政黨則宣稱預算赤字與通貨膨脹毫無關係。


    這兩種說法都不正確。如果財政部發行的債券是賣給一般民眾，並以此籌措資金來融通赤字，資金是由一般民眾的手中轉移至政府。然後，透過政府的支出，資金最後還是回流至一般民眾的手中。除了財富重新分配以外，上述的程序基本上並不會導致通貨膨脹——發行債券並未直接創造新的貨幣。


    另一方面，如果財政部發行的債券是直接賣給Fed，債券的款項是以「印製鈔票」的方式支付——Fed在「財政部」的帳戶中登錄一筆存款，它便擁有公開市場操作的籌碼了。這種程序顯然而直接地具有通貨膨脹的效果，但這並不是經常的作'
  merge: -1
  img_proc: true
- pgno: 273
  md: '業方式。赤字支出會以一種更微妙的方式引導Fed的通貨膨脹政策。


    如果我們有一個舉債成癮的政府，Fed便是毒品——信用——的供應者。整個過程大致如下：如果政府需要銷售1,000億美元的公債給一般民眾（包括銀行體系在內），Fed會透過公開市場操作買進100億美元的公債，使銀行體系可以增加放款1,000億美元，以融通新債券交易所需的資金。


    這是一套圓滿的計劃——本質上無異於「密西西比事件」。如果政府以這種方式運作，短期內可以保證自身的信用供給，長期則會為我們全體帶來經濟危機。


    有關公債的問題，經濟主流思想中存在許多錯誤的觀念。其中最嚴重的錯誤是政府的赤字融通對於私有部門的信用供給並無影響。某些分析家以1982-83年的情況證明這項論點，當時的赤字不僅龐大，而且還在增加中，但名目利率卻趨於下滑。


    事實上，根據我在1983年1月的研究顯示，預算赤字與名目利率之間通常存在一種反向的關係；赤字偏高期間，利率幾乎必然趨於下滑，赤字減少時，利率則攀升。然而，這並不表示赤字不會影響信用的供應。將名目利率視為是借款的實質利率，是非常嚴重的錯誤。


    赤字支出與名目利率之所以會呈現反向的關係，主要理由在於Fed的政策。經濟衰退期間，失業增加，產業界減少生產，借款較少，獲利也減退，所以政府的收入也減少。同時，由於經濟不景氣，人們更加仰賴政府的福利計劃。因此，經濟'
  merge: -1
  img_proc: true
- pgno: 274
  md: '衰退期間，政府的赤字支出會增加。


    爲了平息政治上的反衰退壓力，Fed 在公開市場中大量買進公債，創造超額的準備，以人爲方式降低市場毛利率。偏低的利率僅是一種假象而掩飾實際的情況——可供借取的實質資本相當缺乏。


    雖然如此，偏低的名目利率仍然吸引企業家投資，並刺激景氣復甦。復甦的步調加快時，貸款增加，信用需求增加的速度快於供給，利率開始攀升。隨著經濟復甦，就業增加，政府稅收增加，而赤字減少（至少赤字的增加速度會減緩）。


    透過供、需法則，赤字支出對於信用市場還有一項重大的影響。任何時候，政府在市場中借取資金時，私有部門的潛在資源便轉移至政府的手中。


    所借取的貨幣是對於未消費財（unconsumed goods）的請求權，市場在任何時候都僅存在有限數量的未消費財。所以，政府借取資金時，它取走原本屬於私有部門的未消費財請求權。沒有任何藉口可以改變這項事實。雖然政府大量借款，但Fed
    不斷在信用市場增加貨幣供給，使利率維持不變，甚至於降低，這將掩飾實際的情況——以人爲的方式降低市場利率，扭曲經濟的計算，並以不合理的方式分配經濟資源。


    以 1969 年開始的一個例子說明。Fed 降低貨幣供給的成長率，利率急速攀升，整個國家立即陷入衰退。信用需求降低後，利率開始下滑。政府由於稅收減少而支出增加，預算從
    1969 年的盈餘轉爲 1970 年的赤字 28 億美元，1972 年的赤字暴增'
  merge: -1
  img_proc: true
- pgno: 275
  md: '至234億美元！


    貼現率穩定下降，由1970年的6%降至1971年的4.5%。所以，信用擴張又開始產生預期的效果。景氣趨於活絡，就業水準提高，企業盈餘改善。於是，聯邦稅收增加，赤字急遽降為1974年的47億美元。


    消費者物價也受到影響——暴升！消費者物價指數（1982—1984+100）由1969年的35.6增加為1974年的46.6——五年之中上漲超過28%！


    面對不斷攀升的物價，Fed再度踩煞車，經濟也再度衰退。1974年至1976年之間，貼現率由8%降至5.25%，而赤字則由47億美元增加為664億美元。這個循環持續至今天。


    增加稅收可以減少赤字，這又是另一種普遍的誤解。猶如巴金森定律（Parkinson''s Law）所說，「支出會隨著收入而增加」。自從甘迺迪以來，政府的淨稅收每年增加，但目前的預算赤字已經創新記錄。減少預算赤字的唯一方法是減少預算。


    直接的預算赤字似乎還不夠嚴重，政府的另一項負擔也不斷加重，這是James Grant所謂的「潛在赤字」（the latent deficit）——自從「新政」（New
    Deal）時期以來累積之政府擔保與所有可能發生的負債。美國政府的保險計劃面額，由1979年的6,620億美元增加為1989年的4.214兆美元。直接貸款、政府擔保貸款與「政府支助企業」（Government
    Sponsored Enterprises）等可能發生的負債，則由1970年的2,000億美元增加為1989年的1.558兆美元。'
