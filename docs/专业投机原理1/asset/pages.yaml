    「價值線」的月線圖。如果投資者在1984年12月的低點買進，並持有至1987年8月份的高點，不計算股息的獲利為67.9％。如果這位投資者持有至10月2日，獲利仍有65.9％。然而，僅僅在兩週後的10月19日收盤，所有利潤將被一掃而空。


