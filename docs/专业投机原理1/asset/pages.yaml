  md: '改變。」一般來說，唯有整個世界都在他們面前崩解，唯有他們已經毫無退路而只有向前時，人們才會考慮改變。我討論這些內容，是希望你不要陷入追求榮耀的惡性循環中。不要被逼到牆角而毫無退路。


