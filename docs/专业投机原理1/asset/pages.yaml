  md: '截至目前爲止，我僅討論相對強度的一般使用方法。我們還可以由另一個角度運用相對強度的觀念，這直接關係著我對於趨勢的定義。在上升趨勢中，高價與低價都會不斷墊高。所以，我會觀察「道瓊工業指數」，指數創新高時，我會尋找在同一天或稍早也創新高的股票。


    這些便是最強勁的股票——市場領導股。如果市場處於上升趨勢中，這些股票便是你應該買進的對象——假定所有的條件都相同——但不是在創新高的時候買進。你必需等待回檔，在跌勢中買進，因爲它們迅速回升的機會較高。相對強度較高的股票，它們的上漲速度會快於其他的股票。


    在市場的頭部附近，你準備賣空的時候，我建議你不可選擇相對強度較高的股票，因爲萬一你判斷錯誤，損失將十分嚴重。我也不建議你賣空最弱勢的股票，因爲它們的下檔空間非常有限。我建議你賣空相對強度適中的股票，因爲萬一你判斷錯誤，受傷的程度不會太過嚴重，如果判斷正確，你還是有相當不錯的利潤。


    賣空強勢股的時機，是當「工業指數」與「運輸指數」都已經呈現中期或長期頭部的時候，而且趨勢變動的1-2-3準則也加以確認。這是在短期內迅速獲利的理想時機，因爲當你確認強勢股的頭部出現之後，如果行情持續下滑，很可能會出現一至三天的恐怖性暴跌走勢。在這類交易中，你最好迅速獲利了結，因爲許多買盤基於先前展現的相對強勢而在低檔準備接手，所以它們往往會迅速反彈。'
