- pgno: 280
  md: '只要政府繼續操控貨幣與信用市場，並導致景氣的循環波動，投機者的工作便是從中獲利。留意觀察政府的政策與政策的擬定者，你經常可以預先判斷他們可能採取的政策，並預測這些政策將產生的經濟後果。所以，這一切都回歸至我在第一章中強調的重點——根據原則思考。


    Fed 的政策與政府的財政政策明目張膽地違背經濟的基本原理時，根據相關的經濟學基本原理判斷，你的結論應該正確。之後，問題僅在於時間的拿捏——市場需要經過多久的時間才瞭解所發生的ㄧ切，並對政府錯誤政策的影響產生反應。於是，「道氏理論」、技術方法、以及我們截至目前爲止討論的所有基本重點，便是它們發揮功能的時候了


