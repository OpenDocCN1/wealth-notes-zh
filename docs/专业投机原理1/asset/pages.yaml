- pgno: 368
  md: '準，這將是畢生傑作！誰知道，我說不定可以成為職業選手！」結果如何呢？


    是的，你的注意力開始分散，而整場球也完蛋了。你非常生氣地對自己說道：「怎麼會這樣？我把一場最完美的球賽毀了！好了，放輕鬆，慢慢來，」但這場球就是不聽使喚。你打完最後一洞時，畢生最完美的一場球也不過是成績平平而已。你覺得非常懊惱，似乎人生最重要的成就已經由你的手中溜走了。你知道嗎？你的看法沒錯！


    個人的成就與成功，直接來自於心智超級電腦根據設計發揮的功能。我們全心投入某項生理或心理的活動時，意識認知與潛意識心智會相互協調而整合。在俱備如何運作的精確知識下，潛意識心智會立即輸入意識的認知，並提供最快速而精確的產出——生理或心理的活動。產出之所以精確，是因為程式正確而輸入資料有效。輸入資料之所以有效，是因為意識認知完全專注於與目標有直接關連的資料。


    例如，你全心打高爾夫球的時候，已經提供潛意識所需要的執行程式，這是來自於你對高爾夫球的知識，包括相關的規則、成功職業選手的著作、觀察模仿專家們的動作、以及在球場的練習。


    你的意識認知完全專注於蒐集潛意識需要的資料，以便有效的執行，例如：如何擺球、如何測量距離與風向…。失誤的恐懼與好球的興奮，完全不會干擾專注中的意識。你的注意力僅集中在一個目標：在能力範圍內打好每個球，而使總桿數達到最低；這項意識的目標，使心智得以專注，並使潛意識的心'
  merge: -1
  img_proc: true
- pgno: 369
  md: '理程序也得以專注。當你的意識專注由每一桿的動作，轉移至職業選手的幻想以後，潛意識中的另一個程式便開始執行，破壞你的整場球。然而，如果你希望在高爾夫球中獲致成功，你的超級電腦將提供你以目標為導向的動機。


    我相信，我們可以管理與控制這部超級電腦，並使它在大多數情況下都可以發揮有效的功能；而且，我也相信，大多數人都可以辦到這點。管理這部超級電腦的關鍵，是瞭解個人動機的性質與根源，並知道如何改變它們。


    # 動機的探索與運用


    你全心投入某項活動時，便擁有最高度的動機。讓我解釋這句話的意思。為了擁有動機，你必須俱備最充分的理由採取某項行動；換言之，決定自由意志（determines
    volition）。意志是意願或選擇的表現。當你擁有動機，而且意志已經決定，你已經沒有選擇的餘地，因為選擇已經完成，你的心意已經決定。你處於一種全然專注的境界，你的心智已經全然投入（committed）。


    這不是一種你可以隨意達成的境界。你可以整天告訴自己，「我要減輕體重，我要減輕體重。」但如果缺乏適當的動機，你的潛意識將不斷回答，「不！不！」你將感覺挫敗，並譴責自己。無法進步，你頂多僅能夠維持停頓。無法成功，你將失敗。


    在生活或任何專業領域內，成就與進步的程序有四項要素：'
  merge: -1
  img_proc: true
- pgno: 370
  md: '+   1. 目標（goals）：你必須知道希望追求的最後結果，並決心達成這些結果。

    2. 行動（actions）：你必須根據目標擬定計劃，並以果斷的行動執行計劃。

    3. 認知（awareness）：你必須觀察行動的結果，評估成功或失敗的程度，這不僅是就物質的角度而言，也包括個人的情緒層面在內。

    4. 改變（change）：如果你遭遇挫折，必須重新檢討目標與行動，判斷問題的所在，並願意修正。


    這四者都是成功的必要因素，設定目標是最根本的程序。設定目標的本身，看起來或許相當容易。任何人都可以拿出紙筆，寫下他希望的事物。然而，白紙黑字並不代表建立（establish）目標。目標本身並沒有任何力量，除非你認爲它們非常實在（real）；這並不僅僅是慾望而已，它們應該是你賴以爲生的必需對象——就如同食物一樣。


    如果目標被視爲是一種根本的需求，並設定在超級電腦的程式中，它會盡一切所能驅使你朝目標邁進，而其餘的三項步驟也變得相對簡單。這種心境稱爲「投入的決心」（commitment），它是一致性表現的根源，也是情緒紀律的依據。


    「決心投入」（commit）是來自拉丁文的 "committere"，它的本意是「結合在一起」（to bring together）。在這層意義上，投入的決心是指將意識與潛意識（包括情緒在內）結合在'
  merge: -1
  img_proc: true
- pgno: 371
  md: '一起，追求你的目標。達成投入的決心，這是使目標變爲可能的關鍵步驟，它也會使目標俱備力量，並使你有能力執行計劃。


    請留意，我說「達成」（acquiring）投入的決心，而不是說「擬定」（making）投入的決心。因爲如果你心智取向不正確，經常無法「擬定投入的決心」。在追求目標的過程中，涉及的並不僅是堅決的「意志力」（will
    power），或抗拒「誘惑」（temptation）；而是尋找一種方法改變心智的內容與聯想（associations），以確保真正的動機。


    人類具有自由意志（free will），通常是指個人在任何時間與任何議題上，都有力量選擇或控制他的活動。例如，我可以或不可以拿起面前的杯子，我可以或不可以回補目前的空頭部位，我可以或不可以維持減輕後的體重。我不認爲情況如此單純。


    以心智的超級電腦來說，你的行爲——心智活動的產出——取決於輸入的資料，取決於你的感知，取決於你的意識如何看待現實，取決於你如何訓練潛意識發揮功能。自由意志並不代表你可以做任何想做的事，也不代表你可以隨意選擇何時與如何；它僅代表你可以選擇心智的程式。


    歸根究底，自由意志僅有一項基本的抉擇：思考或不思考。這並不是說在你清醒的每一時刻與每一議題上，你都必須在意識中以邏輯判斷思考與行動的這項抉擇——意識的運作太過於緩慢。這項抉擇是要求你瞭解與認知動機的性質與根源，並在必要的時候修正。它代表內省（introspecting）——以意識'
  merge: -1
  img_proc: true
- pgno: 372
  md: '認知來辨識與評估潛意識的內容。所以，讓我們來討論潛意識的性質，並探究動機來自於何處。


    情緒決定動機。特定而言，我們受到情緒上的兩種根本力量驅動：追求快樂的慾望與避免痛苦的需求。不妨想一想。我們希望某件事物時，我們是否真正想要這件事物的本身？不，我們想要的是達成目標後的結果，它對於我們生理與心理將產生的變化，才是我們想要的。例如，許多人想要減輕體重，他們對於實際的脂肪並沒有興趣；他們是希望改變對於自己的感覺。他們實際想要的是對於生命的控制感、健康的感覺、身材更吸引人、覺得較有活力、可以長壽、…。


    再舉一個例子，大多數人都希望與異性保持良好的關係，但我們真正想要的是被瞭解與尊重的感覺、享受相互照顧的溫馨、一種朋友與知已永遠在那裡的安全感、性交的快感…。


    所有這些希望都蘊涵著改變現況的慾望。特定來說，它們蘊涵著由不滿意至滿意的慾望，或由滿意至更滿意的慾望；由痛苦至快樂的慾望，或由快樂至更快樂的慾望。快樂的潛在感覺才是真正的目標，才是慾望的直接對象。然而，這些欲望本身卻未必可以形成動機。我們還有相互衝突的慾望，它們來自於避免痛苦的需求。


    猶如交易獲利一樣，節制飲食以保持健康是大多數人的理想之一，而且人們也俱備成功需要的知識，實際成功的比率卻很小。一般來說，失敗的理由並不是因為人們不能做到，而是他們不願意做；缺乏真正的動機。'
  merge: -1
  img_proc: true
- pgno: 373
  md: '一位節食中的人，嗅著他的紅蘿蔔與蔔苴，配著檸檬汁，當他看見香噴噴的 16 盎斯牛排送到隔桌時說道，「搞什麼鬼！我受夠了！」或者，另一位男士遇到一位他很喜歡的女士，甚至於還拿到她的電話號碼，卻不曾撥過電話，因為他想，「如果她不喜歡我怎麼辦？」或，「我只會再度失望。」


    就第一個例子來說，節食是一種痛苦的程序，它代表由愉快的事物移開，而不是移往更快樂的事物。在他的心目中，達成減肥的目標並不真正代表快樂，而是痛苦！


    第二個例子中，這位男士的行為幾乎完全由避免痛苦的慾望主導：被拒絕的痛苦、失望的痛苦、發生錯誤的痛苦、失去「自由」的痛苦…。同樣地，採取行動以追求目標，這關連著心智中的痛苦，而不是快樂。在心智中存在一種快樂/痛苦的矛盾，潛意識無法有效處理這種困境：移往目標將造成痛苦，維持現狀又不滿意。在可以選擇的情況下，潛意識通常會讓避免痛苦的需求，壓抑追求快樂的慾望；所以，他在追求目標時將遭受失敗。


    觀察人們從事當日沖銷的交易時，我經常發現許多人呈現類似的狀況，包括我個人在內。在一份獲利的交易記錄中，虧損交易的筆數往往多於獲利交易。若是如此，獲利交易的利潤必須大於虧損交易的損失。然而，交易者經常觸犯一項錯誤：過早獲利了結而過遲認賠。何以如此？因為他們沒有遵循交易守則的動機。他們瞭解（understand）交易守則，但並不體認（realize）它們。'
  merge: -1
  img_proc: true
- pgno: 374
  md: '如果你根據1：3的風險/報酬比率交易，平均每筆交易的獲利至少應該是虧損的3倍。然而，上述比率演變爲1：2時，交易者經常無法忍受些微的不利走勢。他的潛意識投射出痛苦，並列印出許多錯誤的資料，在恐懼與混淆中，稍微出現不利的行情時，便倉促了結部位，可能僅實現一筆1：1.5的交易，當價格恢復原來的走勢，到達原訂1：3的目標價位時，他只能破口大罵。


    另一方面，行情立即出現不利走勢而觸及停損價位時，交易者不願認賠，而開始期待情況會好轉，希望幸運之神的照顧。可是，市場顯然不夠體貼，將原本1單位的虧損擴大爲1、5、2、甚至於更嚴重。避免痛苦（虧損與錯誤）的需求，使他違反他明知道正確的交易守則。這便是不相同形式的相同矛盾：執行交易守則造成痛苦，不執行它們又增添不滿意的程度，並剝奪交易的資本。


    如果你自我反省，我想你將發現，當你邁向目標而發生困難時，往往便是這種快樂/痛苦的矛盾在做祟。假定你俱備正確的知識，而在執行上發生問題，這是因爲動機產生衝突，潛意識中存在兩種對立的需求；一般來說，避免痛苦的需求往往會佔上風。


    非常諷刺地，在這種情況下，結果總是挫折與不滿意的痛苦。爲了避免某一類型的痛苦，潛意識卻造成另一類型的痛苦，並進一步強化挫折與不滿意的感覺。這種程序若不修正，將導致惡性循環而侵蝕個人的價值感、破壞成就、遏阻個人的成長；使你陷入失敗的命運。'
  merge: -1
  img_proc: true
- pgno: 375
  md: '爲了建立積極而不矛盾的動機，潛意識必須將追求目標視爲是一種快樂——而不是痛苦——的程序。如果你可以創造這種心境，採取行動達成目標的抉擇已經完成；抉擇已經不復存在。基本上，堅持既定的決策，便是投入的決心——在這種心智狀態下，知識、動機與執行都指向相同的目標。這是一種完全整合的境界，你的心智將驅使你邁向成就與必然的成功。


    # 結論


    成功是以目標爲導向的一種動態行爲程序，不斷地追求個人的成長、成就與快樂。成功的最關鍵因素是追求目標的決心；換言之，在共同的目標下，將意識與潛意識結合。許多人無法下定決心，這是因爲動機的衝突，而這又是因为情緒的衝突，而後者又是起源於相互衝突的價值觀與信念。一旦瞭解這種狀況之後，積極修正的處方便很明顯了：


    +   1. 辨識侷限性與破壞性的價值觀與信念，排除它們。\n2. 採納嶄新而有益的價值觀與信念。\n3. 排除那些造成侷限性情緒反應的潛意識聯想，代之以嶄新而有力的聯想。


    猶如大多數處方一樣，說起來相當容易，實際運用卻很複雜。下一章，我將說明如何將這個處方轉化爲積極而有益的活動。'
  merge: -1
  img_proc: true
