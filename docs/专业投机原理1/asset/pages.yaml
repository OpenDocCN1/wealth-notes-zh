  md: '現在，交易員約翰坐在他私人房間的報價機前，正等著 CBOT（Chicago Board of Trade；芝加哥期貨交易所）債券期貨的開盤。根據昨天的新闻報導，日本中央銀行調高利率，所以他在昨天收盤時建立一個新部位，賣空200口債券期貨契約。他的判斷簡單而合理。債券市場已經上漲了好幾個月，而目前正形成技術性的頭部。


    日本人是美國公債的最大持有者，而現在融資購買債券的利息已經高於殖利率。美元對日圓的匯率持續下滑，而因為美國經濟相當疲軟，Fed 不可能調高利率支撐美元。事實上，市場甚至謠傳Fed將調降利率。外國投資人持有20％的美國長期公債，他們將拋售公債…他有把握。這是多年來罕見的好機會！


    然而，他也知道自己的判斷可能發生錯誤。所以，他在昨天高價的上方5檔處設定心理停損，這相當於是在賣空價位的上方10檔。①在這筆交易中，他僅願意承擔62,500美元的風險…不能更多。


    開盤了！他的心跳稍微加快。價格以昨天的收盤價開出來！他原本預期會跳空下跌！一定發生什麼差錯。經過10分鐘之後，價格較開盤價上揚2檔。他拿起內線電話找他的助理。


