  md: '計的憑藉。


    總之，我在台上演講。當時我看空行情，而且我在1月份打了一支滿貫全壘打。行情已經由漲勢轉為狹幅盤整。我正在尋找做空的機會，我已經等了三個月。「墨菲定律」再度靈驗，我離開辦公室的那天，行情向下突破。Frankie
    Joe 掌握這個賣空機會而贏得交易大賽的冠軍…而我坐在飛機上。


    重點是：如果妳希望在市場尋求生，必須在生理上、心理上與情緒上儘可能維持100％的完美境界。根據我的估計，如果你實際上可以保持85％的平均水準，你的表現便相當不錯了。


    所以，從事交易時，心理上要有所準備，你可能因為夢想不到的理由而虧損。某個時候，你完全掌握行情的發展，你已經站好姿勢準備揮出全壘打，你卻與妻子爭吵，你的家人過逝，或發生你從來想不到的某些事。


    以100％來準備，但85％便可以接受；這便是現實。


