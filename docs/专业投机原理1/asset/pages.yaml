- pgno: 44
  md: '我非常幸運能夠與「華爾街」的一些頂尖交易員共事，包括：Frankie Joe、Howard Shapiro 以及其他人。我們雖然各有不同的交易風格，但除了少數人外，我們都賺進非常可觀的財富。然而，我觀察許多不同交易員時，我開始瞭解這個行業中的許多不同層面：那些在工作中不能控制自己情緒的交易員，付出嚴重的個人代價。我發現，某些在個別領域內的頂尖好手，基本上卻非常不快樂，我希望知道何以如此。我想瞭解，如何在最廣義的層面上獲致成功。我獲得的結論便包含於第Ⅱ部份中。


    天下沒有不散的宴席，1986年9月份Interstate決定將公司股票上市，並解散交易部門。主要的理由是交易部門的獲利，在季的基礎上過於不穩定，公司方面擔心，盈餘不穩定可能對於股價產生不良的影響。我認為這是一項錯誤的決定。根據我的瞭解，交易部門每年都有獲利。我記得有一年，我們10個人便創造3,000萬美元的收入，代表10個交易員便為公司帶來約1,500萬美元的盈餘。雖然如此，既然有了決定，便是我離開的時候。


    我在1986年10月成立自己的辦公室，並繼續積極交易。在1988年1月，我決定成立一家基金管理公司：Rand Management Corp.，這便是我目前交易的場所。


