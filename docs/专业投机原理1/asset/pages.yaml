- pgno: 11
  md: '我的交易生涯是起始於1966年，當時我在「華爾街」擔任報價的工作。我爲自己設定一個目標：在非常穩定的情況下，經年累月的賺錢。從1971年開始獨立交易以來，截至1988年1月停止從事例行的盤中交易爲止，我的交易帳戶不曾在任何一年發生虧損。在1972年7月1日至1987年12月31日之間，我自己與我管理的帳戶總共獲致1,000萬美元的毛利。①在這些帳戶中，我至少必須對於盈虧承擔一半的責任。


    表P.2列出我在1972年至1987年之間的績效。我在Interstate Securities服務時，也透過自己的公司Hugo Securities交易，這部分交易並沒有列入表P.2中。我在Hugo的交易績效大致與Interstate相同，所以表格內的總績效實際上應該再增加兩倍。然而，爲了避免混淆，我並沒有計入這段期間在Hugo的交易記錄，因此這些績效除了來自個人的操作外，其中還包括我所聘用人員的交易結果。即使不考慮這部份績效，我想表內所列數據應該也可以代表相當傑出的平均打擊率：足以讓我教導一些打擊的技巧。


    然而，除了基本的打擊知識以外，你還需要學習許多相關技巧。即使是最優秀的打擊手也有陷入低潮的時候，某些才華橫溢的大學選手始終不能擠身進入大聯盟。如果我在交易生涯中學到什麼，那便是——知識本身絕對不是成功的保證。除了知識外，你還需要一套執行知識的管理計劃，以及嚴格遵守計劃的心理規範，如此才可以免除情緒的干擾。這便是本書將討論的內容：在心理上與財務上界定一種在市場獲致成功的方法。'
