- pgno: 186
  md: '許多技術分析師運用極端複雜的震盪指標，不僅用在大盤指數，也應用在個股。我並不這麼做。


    投機者經常會運用過多的資訊。我認為，你最好僅採用少數幾個震盪指標，而且僅做為輔助性的工具，以確認或否定前一章討論的主要趨勢變動的指標。Frankie Joe
    有一條交易法則稱為 "KISS" ，它代表 "Keep it simple, stupid ! "（保持單純，笨蛋！）。這是一位「專家中的專家」提供的建議。


    # 個股的選擇


    截至目前為止，我討論的所有方法，幾乎都適用於每一個市場，包括：個股、商品與指數。無疑地，有些人僅交易個股——我過去也曾經以此為交易的重心。對於個股的選擇，我們有「道氏理論」可做為預測行情的一般性準則；在這個範圍內，你可以利用我們討論的技術方法選擇股票。現在，我再提出一些專門適用於個股操作的輔助性方法。目標當然是進一步提升你的勝算。


    # 技術分析與基本分析的比較


    市場中有一群人專門操作個股，他們在個別股票中投資、投機或交易。在這群人們中，基本上可以分為兩個學派——純粹的技術分析與純粹的基本分析。根據我個人的經驗判斷，這兩種純粹的學派都很難獲致穩定的績效。


    大多數成功的投機者都屬於折衷學派：他們結合上述兩種'
  merge: -1
  img_proc: true
- pgno: 187
  md: '學派的精華，同時採用技術分析與基本分析的工具。我個人採用折衷而偏向技術分析的方法。我結合這兩章討論的技術性方法與基本面的統計資料，前者非常可能反映市場參與者的未來判斷，後者則與價格走勢之間保持長期而穩定的相關性。


    基本分析者認為，長期來說股票價格取決於三項因素：股息殖利率（yield）、盈餘能力、以及個別公司的資產價值。換言之，任何股票的價值都是取決於這三項本質上的因素。我認為這種主張存在一個問題，它完全忽略價值的主觀性質。唯有當股息殖利率、盈餘能力、以及資產都必須直接反映在市場的集體判斷中，如此基本分析學派的主張才有效。事實上的情況並非如此。基本分析者經常發生一種現象：他們的判斷雖然「正確」，但時效的掌握卻錯誤。


    葛拉罕（Graham）與陶德（Dodd）的選股方法是基本分析學派的主流之一。葛拉罕與陶德的方法認為，你應該買進低本益比與低帳面價值的股票，這是一種過於簡化的原則。他們的主張蘊涵著一項假設性的前提，這類股票很可能是「價值低估」的成長型股票，因為高本益比代表市場已經認同，並給予股票「適當的評價」。股票市場處在多頭行情的初期至中期階段以前，這種選股方法確實相當有效——除了少數本質最差的股票之外，所有股票都會上漲。然而，假以時日，你可能會遭遇麻煩。一般來說，某支股票的本益比與帳面價值偏低，背後必然存在理由，而且市場已經知道這些理由。


    我認為本益比與帳面價值都是非常有用的工具，但我的運用方式截然不同。如果你觀察整體市場的本益比與帳面價值，'
  merge: -1
  img_proc: true
- pgno: 188
  md: '並以此比較過去的本益比與帳面價值，你可以發現一種理想的次要指標，顯示整體市場的超買與超賣情況。然後，你可以比較個股與大盤指數在本益比與帳面價值上的關係，並將這種關係視爲是次要的（或許應該稱爲更次要的）指標，以評估個股與大盤在超買與超賣上的相對表現。


    # 盈餘成長的變動率


    基本分析有一項非常理想的統計關係，它是盈餘成長變動率（譯按：作者是指盈餘的變動率而言）與股票價格變動率之間的相關性。Gordon Holmes 在1969
    年的作品中表示，「價格趨勢的斜率，在時間上幾乎都會領先對應或對等的盈餘趨勢斜率。時間的落差通常爲三個月。」⑥


    我對於這現象有三點評論。第一，它通常正確。第二，它禁得起時間的考驗。第三，它符合「道氏理論」根本觀點——市場會「反映所有事物」。然而，你如何運用這個現象呢？


    首先，你必須確定這種相關性是否存在於你評估的股票中。大多數企業的盈餘都會受到季節性因素的影響，因此你觀察的盈餘數據不可少於六季，如此盈餘成長才是未來股價變動的有效指標。將盈餘的數據描繪在股價走勢圖的同一時間座標軸上（盈餘的數據必須落後三個月），如此你可以比較盈餘成長（衰退）與股價上漲（下跌）之間的相關性。這種相關性必須存在於考慮的整段期間內，否則兩者之間的相關性便不顯著，其盈餘也不適合用來預測未來的股價。


    Holmes 根據盈餘成長與其他因子，設計一套相當複雜的選'
  merge: -1
  img_proc: true
- pgno: 189
  md: '股方法。⑦我的運用方法稍有不同。在William O’Neil提供的New York Stock Exchange Daily Graphs（紐約股票交易所每日圖形）中，盈餘的數據是以季為單位，其中還包括次一季的盈餘預估值。假定盈餘與股價之間的相關性確實存在。就買進方面來說，如果盈餘成長變動率小於股價變動率（或趨勢線的斜率），則可以考慮買進該股票。如果盈餘成長變動率大於或等於股價變動率（或趨勢線的斜率），另外尋找適當的對象。賣空方面也是如此。


    如果你以這種方法交易，我希望給你一些忠告：許多人根據企業盈餘交易，這種情況下，預估的每季盈餘報告可能會讓你一敗塗地，尤其是高本益比的股票——它們經常出現暴跌的走勢。務必要知道實際的盈餘報告何時公佈，如果股價已經接近高點，則在報告公佈前應該出場。如果實際的數據不如預期中理想，則股價可能向下跳空，你累積的獲利也將在一夜之間消失了！


    觀察殖利率與本益比的目的是在尋找高成長的潛力股。然而，事實上，盈餘成長是最能夠反映成長潛能的因子。以殖利率來說，它是股息除以股價。偏高的殖利率必然是因為股息偏高或/與股價偏低。可是，股價何以偏低呢？因為盈餘不佳！


    以Citicorp與Traveler’s為例，1990年7月，兩者股價大約持續下跌六個月，殖利率隨之上升。雖然股價持續下跌，但公司方面卻維持既定的股息。因為股價的下跌程度大於盈餘的衰退，所以本益比下降。這兩支股票的本益比都很低，殖利率則偏高，你覺得怎麼樣？是否代表它們是低價承接的理想對象？'
  merge: -1
  img_proc: true
- pgno: 190
  md: '我不認為如此。如果這兩家公司的表現持續不理想，怎麼辦？如果沒有在盈餘成長的範圍考慮，本益比與殖利率都是非常不可靠的數據。我經常喜歡把一個觀念表達為一個簡單的句子，「如果股價下跌，必然有下跌的理由！」你非常不可能在市場之前，發現價格低估的股票。


    讓我舉一個例子，說明盈餘成長何以是選擇股票的一個關鍵因素。在「紐約股票交易所」掛牌交易的所有股票中，大約八成的公司會將盈餘的30％至65％分派為股息。假定一家成立不久的公司，股票價格為10美元，每股盈餘為1美元，分派的股息為0.5美元（佔盈餘50％，殖利率為5％），盈餘成長率為25％。本益比10倍，殖利率5％，這都是屬於中等的數據，所以很難根據這兩項資料判斷這支股票是否適合買進。可是，25％的盈餘成長率卻代表非凡的意義！


    根據25％的盈餘成長率計算，該公司的盈餘在2.9年後將成長一倍。假定你現在持有這支股票，而且股息分派的比率維持不變，則你的殖利率在三年後便可增加大約一倍（譯按：約為9.8％，這是假定股價不變），再三年之後又可以再增加一倍（譯按：約為19％）。如果盈餘成長率保持不變，不到八年的，你的股息收益便約等於你當初投資的金額，這尚不包括股票非常可能出現的升值。根據本益比與殖利率挑選股票，將完全忽略這方面潛能。


    # 基本面的其他考量


    在兩支股票中選擇時，假定它們在其他方面都非常類似，'
  merge: -1
  img_proc: true
- pgno: 191
  md: '我會倚賴一些基本面的其他考量做最後的決策。


    第一，對於兩份多頭氣勢相同的走勢圖，我會選擇低本益比的股票。同理，對於兩份空頭氣勢相同的走勢圖，我會賣空高本益比的股票。葛拉罕與陶德的教誨還是有些份量！


    第二，考慮買進的時候，我會選擇信用擴張程度較低的公司；信用擴張的程度愈嚴重，愈容易受到銀根緊縮的影響。在賣空的情況下，我也會做類似的考量。第三，不論買進或賣空，都必須有足夠的市場流動性。


    最後，股票市場中的某些投機者會判斷一家新上市公司或已上市公司提供的產品或服務，是否可以受到市場的接受。這種情況下，股票市場的交易者可能會判斷錯誤，或是低估消費者的需求，或是高估產品的吸引力。


    雖然我通常不會參與這類投機活動，但這確實屬於一種投機行為。我之所以不參與，是因為我無從衡量其中的勝算。這種行為的成功與否，主要取決於普通常識。如果新產品很不錯、很有品味、很獨特，而且行銷策略很完善——總之，如果普通常識的評價很高——你大可買進一些股票，如果你禁得起損失的話。


    # 技術分析的最後補充


    除了本章與前一章討論的技術工具以外，我還希望就個股的技術分析提出一些補充。基本上，「道氏理論」的主張都適用於個別股票，但它們並不是十分有效。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '在任何統計分析中，你的樣本愈多，重覆發生的現象愈普遍。個別股票俱備許多大盤指數的性質。例如，某支股票所有的相關知識都會反映在價格走勢中。成交量的關係也大致相同。股票循環的心理也是如此。所有的判斷原則都相同。然而，「道氏理論」有一項「假設」：這項理論並非不會錯誤；它更適用於個股。另外，你僅可以根據個別股票推論，沒有其他指數可以提供確認。雖然如此，但「道氏理論」對於個股操作仍有很大的幫助。


    # 結論


    截至目前為止，我們已經俱備一組單純而有效的技術工具，可供分析金融市場的價格走勢。我們由普遍的原則與「道氏理論」的概念開始，接著討論主要與次要的技術分析方法，最後則就個別股票的技術面與基本面提供特定的考量。下一章將為投機的彈藥庫增添一項更有力的裝備——普通常識，或經濟的基本分析。


    # 附註：


