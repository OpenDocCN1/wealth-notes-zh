    10 月 18 日星期日對全世界宣佈，他「將聽任美元下滑。」這個時候，我知道金融市場將因為美元的貶值而崩跌。10 月 19 日，市場跳空下跌，我在開盤賣空
    S&P 500 期貨，單單這個部位就讓我獲得可觀的利潤。然而，整個情況並非毫無瑕疵，我聘用的一些獨立交易員（他們可以自行交易），當時是做多行情，所以他們的損失抵消我的一部份獲利。


