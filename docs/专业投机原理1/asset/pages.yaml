- pgno: 402
  md: '人們會盡可能利用你，然後將你棄之如敝屐。


    如果把持這類信念，如何達成你的目標呢？


    例如，如果你很重視「愛」的價值，你又認爲人們會盡可能地利用你，然後將你棄之如敝屐，每當你體驗「愛」的感受時，必然會興起戒心，擔心被利用。


    如果你堅信自己不夠聰明，不論你多麼認真學習，你在智識的領域內都不可能達到獨立的境界。面對不同看法時，你總是害怕別人比你聰明——你將覺得自己無法獨立抉擇。


    猶如馬克白（Macbeth）一樣，如果你堅信人生就如同「癡人說夢」般無意義，你將驅使自己邁向毀滅。


    你的信念是自我實現的最終預言。務必記住，潛意識很容易受騙——它相信你要它相信的一切。如果你相信自己不應該享有財富，你的心智便不會讓你富有。如果你認爲自己不應該擁有愛情，它便不會讓你擁有這種溫馨的感覺。如果你認爲自己不聰明，它就會讓你愚蠢。


    所以，如果你希望成功，就必須拋棄侷限性的信念。修正侷限性的信念，第一個步驟是要認知它們是什麼，而認知的對象則是來自於行動中的症狀。這些症狀非常類似於我們先前價值觀的討論；換言之，經常不能夠堅持追求自己的目標，並對自己提出負面的問題與陳述。這種類似性並不令人意外，因爲價值觀與信念之間存在密切的關連。


    我們與自己的對話，以及我們對自己提出的問題，它們是'
