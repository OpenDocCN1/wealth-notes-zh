  md: '根據政府的財政與貨幣政策預測市場的長期趨勢，基本上是在經濟循環的範圍內，運用經濟基本原理思考。整個問題的重心在於如何掌握政治家們的心態，如何評估總統、財政部長與Fed重要官員的講話。價格的長期可能性實際上僅有兩種：向上或向下的趨勢。Fed爲了配合政府財政政策，或試圖主動扭轉下降的市場趨勢時，轉折點將出現。容我在次重覆引用本章之初米賽斯的評論。這個時候，這段評論的意義應該更爲明白：


    > 影響經濟體系的波浪狀變動，在經濟蕭條〔衰退〕之後又是經濟繁榮，這是不斷嘗試擴張信用而降低市場毛利率的必然結果。以擴張信用帶來的經濟繁榮，絕對無法避免其最後的崩解。唯一的選擇僅有：自願放棄進一步的信用擴張而使危機較早到來，或是稍後等待整體貨幣系統的全然瓦解。


    # 結論


    本章中，我們知道經濟循環是信用擴展與收縮的結果，這是因爲我們採用不可兌換的貨幣制度，而由Fed以獨佔的方式操縱貨幣政策，以及政府政客們玩弄的財政政策。我們也瞭解，只要政府繼續控制貨幣政策，必然有繁榮與衰退。而且，只要有繁榮與衰退，投機者就有機會在價格上漲與下跌的過程中賺錢。說來或許有些荒唐，我是自由市場經濟最堅決的信徒，但如果我們改採金本位制度，並取消Fed的組織，我大部份的知識將全然無用。然而，不幸地，我恐怕無法目睹這種情況發生，至少在我的有生之年是如此。'
