  md: '以謹慎的資金管理系統達成。


    資金管理是配置金融資產與判斷進、出場時機的一種藝術。任何有效的資金管理系統都應該包括三種重要的成份：(1) 評估風險/報酬的方法，(2)判定一筆交易成功機率的方法（不論是短、中、長期的交易），(3)資產配置的系統。由於你處理的是資金，所以這三個成份基本上必須簡化為客觀而可以衡量的準則。


    前文已經討論風險評估的統計架構。另外，如果你還記得的話，我也曾經指出，我的風險/報酬比率最多只能3：1，而且我說明如何以技術分析的方法在價格走勢圖上計算這項比率。基本上，你只需要觀察圖形，判斷價格可能到達的價位——目標價位；並決定市場證明你為錯誤的價位——出場價位；然後計算下列比率：


    風險／報酬比率 = (買進價位－出場價位) / (目標價位－買進價位)


    這項比率是由技術分析的角度表示風險/報酬的關係：最大的可能損失與可能的潛在獲利。不論由任何角度考量風險/報酬，都應該是一種機率。然而，我們處理非技術性的因素時，如何計算量化的機率，就有些棘手了。評估整體性的風險/報酬關係時，應該考慮所有資訊，包括技術分析與經濟的基本原理。讓我以實例說明如何結合所有的相關因素。


    這個例子發生在1989年10月的黃金市場。在10/27/89，黃'
