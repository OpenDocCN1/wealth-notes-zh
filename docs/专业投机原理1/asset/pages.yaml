  img_proc: true
- pgno: 29
  md: 'Harry 是撲克牌魔術最傑出的專家之一，他有關記憶技巧的許多著述使他享有盛名。我當時非常崇拜他，而且目前也是如此。他每一項技巧都是自己的創新發明，它們結合了意志、精力、智慧、練習與想像力。他是一位全然自創風格的人，我當時在許多方面都盡可能地模仿他。Harry
    不僅是我的偶像，他也是我的朋友，每週六我大多泡在 Lou Tannen ，觀賞他和其他魔術師的表演。


    我不僅學習 Harry 的玩牌技巧，更重要的是他的記憶方法。為了練習玩牌的技巧，我隨身都帶著一副牌。我與女朋友去看電影時，我的左手會練習單手切牌，而右手就如同每一個
    16 歲男孩與女朋友看電影時所應游走的位置。在 16 歲至 20 歲之間，我的收入頗豐，這主要來自於撲克賭局與牌技魔術表演。


    然而，1965 年下半年，我發現撲克賭博是一種處身於法律邊緣的行業，顯然不適合做為一生的職業。所以，我翻閱《紐約時報》的就業版，並發現生物學家、物理學家與證券交易員的收入最高——每年
    2 萬 5,000 美元！因為我知道自己對於勝算的掌握技巧遠勝過分析細胞或原子，於是我便前往 Pershing & Co. 擔任報價的工作，目標則鎖定為「華爾街」的交易員，實現我對自由的理想。


    # 判讀盤勢的智慧


    我開始觀察金融領域內的成功操作技巧，並閱讀所有相關書籍。在 Pershing 的期間，我的崇拜對象是 Milton Leeds ，他穿著雪白的訂製襯衫與合身的西裝，坐在高臺上監視整個交易場'
  merge: -1
  img_proc: true
- pgno: 30
  md: '所，他在我的心目中就像天神一般。當他透過麥克風喊「99！」時，這代表公司方面即將下單，而且必須優先處理。所有員工都會保持肅靜而全神看著他，直到他下達類似如「以市價買進3,000股電話股」的指令為止。


    Leeds被視為「看盤高手」（tape reader；譯按：tape是指交易價格與數量的報導，但也泛指相關新聞的報導），但他通常都是根據新聞交易。他會監視「美聯道瓊社」與「路透社」的新聞報導，重要新聞發佈時，他可以迅速判斷而下單。幾秒鐘之內，場內經紀人便可以完成他的交易指令。由於他能夠迅速判斷新聞對於市場的影響，在加上整體組織的配合，所以他總是可以掌握行情的先機，這便是他成功的理由。他是一位非常精明的人，交易記錄極為傑出，尤其是記錄中表現的一致性。雖然我從來不曾模仿他的交易方法，但他卻是我心目中的成功偶像。我當時的最大願望，便是有一天我也可以成為一位看盤高手。


    在那個年代，大多數著名交易員與投機者都是以「判讀盤勢」交易，我希望有一天我也可以成為他們其中一員。我閱讀這方面有限的書籍，並練習看盤，記憶許多不同股票的最近價位。透過不斷的練習，我開始對市場產生感覺了。


    現在的人們或許並不瞭解何謂「判讀盤勢」，它是現代技術分析的雛形。猶如目前的技術分析一樣，判讀盤勢需要仰賴模式的認定。兩者之間的最大差異是，模式認定主要是依靠潛意識，而意識的判斷相對較不重要。這猶如運動比賽一樣，你停下來思考應該如何做時，你立刻會喪失注意力。你必須隨時'
  merge: -1
  img_proc: true
- pgno: 31
  md: "掌握所有因素，所以你無法根據意識反應。你必須同時觀察10支至40支股票，不斷記憶先前的高、低價位，以及重要的成交量。同時，你在潛意識中還必須知道價量跳動的速度與韻律、報價機聲的響、個股發佈新聞的頻率、大盤指數與個股價格的變動、以及價格與成交量的模式。所有這些因素構成的潛意識結論，就是通常所謂的「市場直覺」。\
    \ \n\n由於知識的進步——尤其是電腦與通訊的技術——盤勢判讀已經是一種消失的藝術。目前，只要你的經濟狀況可以負擔一套電腦化的報價資訊系統，僅要按下幾個鍵，便可以完全掌握過去所謂的「直覺知識」。你可以隨時知道任何個股、類股、指數或期貨的走勢圖，而且可以自動更新每次的價格跳動。配合某些電腦軟體，你還可以畫趨勢線、設定買賣的警示價位、…。我相信，這種需要特殊才華的盤勢判讀能力，目前已經不切實際，而且也沒有必要了；場內交易員或許是唯一的例外。因此，交易已經成為一種更開放而競爭更劇烈的領域。\n\
    \n然而，所有的看盤高手目前仍然掌握一項優勢。擬定交易決策時，你必須絕對相信自己的正確性，但你還必須接受一項事實：市場可以證明你為錯誤。換言之，在被證明為錯誤前，你絕對正確。因此，你必須根據原則與法則交易，任何感覺或願望都不得干涉這項程序。買進或賣空時，你都必須掙心自問：「在那一個價位上，市場將證明我為錯誤？」一旦你決定這項價格，市場又觸及此價位時，沒有任何理由可以阻止你出場。這是最根本的法則：迅速認賠。在金融市場中發生重大虧損，最通常的理由便是因為人們違背這項法則。雖然無數書籍不斷強調這項法則，並以各種不同方式解釋，但人們仍然觸犯"
  merge: -1
  img_proc: true
- pgno: 32
  md: '相同的錯誤，這顯示人類的天性實在非常難以捉摸。爲了探索這方面問題，並提出適當的解釋，所以我在本書第II部份，將討論交易情緒與心理層面。


    再回到遙古的歷史中。在Pershing工作的期間，我晚上也到「皇后學院」Queens College進修經濟學與財務學。此外，我也開始閱讀《華爾街日報》，以及任何與金融市場相關的書籍。我在Pershing每週的工資是65美元，如此經過六個月，我轉至「史坦普」擔任統計方面的可怕工作。此處的待遇較高，每週90美元，但這項工作實在不適合我的個性，這裡就如同圖書館般的寂靜無聲，每天花費數小時時間登錄與調整數據。如果有人打個噴嚏，我都會感激萬分；這讓我有機會打破令人窒息的寂靜而說句「老天保佑你！」我犯了太多錯誤，所以我被解雇了。這是我第一次在工作上遭遇挫敗，由於我當時實在太沮喪，所以我甚至沒有感謝那位介紹我到此追求交易生涯的人，但我又踏上另一條類似的條路。


    非常幸運地，我在大學修習的會計學讓我找到另一份簿記的工作。當時是1966年底，我來到Lehman Brothers，此處總共有32位合夥人，我負責爲其中12位合夥人整理帳目與交易記錄。Lehman
    Brothers是一家主要的投資銀行，它在許多投資中累積了龐大資產，例如：以每股4美分的價格大量買進Litton Industries，並持有至每股價格爲120美元。在Lehman
    Brothers工作，讓我有機會實際觀察投資銀行的作業情況，並瞭解這家世界上最大的市場參與者之一是如何操作股票與選擇權的投資組合。於是，我逐漸明白選擇權的運作方式，並因此成爲選擇權會計帳的專家。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '我在Lehman Brothers學到一件我永生難以忘懷的經驗。由於我負責 đăng錄帳目，所以我相當瞭解他們賺了多少錢。有一天 đăng錄帳目時，我發現Lehman
    不斷爲其信託基金買進Superior Electric 的股票。當時我對於投資尙櫈然無知，我猜想這家大投資機構應該瞭解自己在做什麼，所以我打電話給Harry
    Lorayne，並把這件事告訴他。Harry 聽信我的說法，他在44美元的價位買進不少的股票。在隨後的幾個月之內，我無助地看著股價一路跌至30美元。Harry
    最後賣出他的持股，總共虧損4萬美元。我當時的感受遠甚於我個人的任何損失。這是我最後一次建議朋友買進某支股票，但——不幸地——卻不是最後一次誤信別人「應該知道自己在做什麼」而建立部位。然而，我確實學到了一項教訓：不可基於幫助朋友的立場，免費提供任何有關市場的建議。在職業的立場上管理他人的資金，這種情況是可以接受的，即使這個人是你的朋友也是如此；如果發生虧損，這只不過是職業上的協定。然而，當你認爲是在幫助朋友而提供建議，又完全是另一回事——實際的結果通常是傷害而不是幫助。


    總之，我在Lehman Brothers工作的同時，仍繼續研究，並利用Harry 傳授的記憶方法，熟記「紐約股票交易所」掛牌交易的1458支股票代號。在1968年，向Filer
    Schmidt & Co. 應徵工作時，我將這方面的技巧展示給負責應徵的合夥人Ricky Bergman。在讚不絕口的情況下，Ricky 錄用我，我也充滿熱忱地開始我的交易生涯。


    # 選擇權交易'
  merge: -1
  img_proc: true
- pgno: 34
  md: '1968年選擇權尚屬於發展的初期階段。它們都在店頭市場交易，而且沒有統一的契約規格。讓我進一步解釋。股票選擇權是一種契約，持有者有權利在既定期間內，根據一定的價格（履約價格；strike
    price），買進或賣出一定數量的股票；買進選擇權稱為call，賣出選擇權稱為put。1968年，每口契約的標準股數為100股（目前也是如此）；履約價格通常都是選擇權發行當時的股票市價；最普遍的契約期間是6個月又10天（這是因為一項投資至少必須持有6個月又1天，才可以申報長期資本利得稅）。當時與目前的最大差異，是選擇權的價格（權利金；premium），它會隨著時間與交易商的不同而有不同的報價。


    某甲打電話給「ABC選擇權公司」，要求提供OXY（Occidental Petroleum）股票6個月又10天的買進選擇權報價時，並不保證他可以根據報價買進該選擇權。此外，如果他打電話給另一、兩位交易商，他可能發現價格有20％-30％的差異！交易商提供給某甲的報價假定為每口契約225美元，這只是「參考價」（workout
    price）而已，交易商隨後將尋找願意接受150美元-175美元價格的賣方。如果可以找到，交易商即可扮演中間人的角色，將低價買進的契約轉賣給某甲。如果交易商無法在合理價格找到賣方，只能算運氣不佳而毫無所得。


    1968年至1970年，我在Filer Schmidt便是擔任這種仲介選擇權的工作，每撮合一口契約可以賺取固定的佣金（6.25美元），稍後在「美國選擇權公司」（U.S.
    Options）則是根據「仲介價差」抽取某一百分率的佣金。在Filer工作期間，我也為一位客戶Starret Stephens管理我的第一筆避險基金（hedge'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'fund），他是我在Lehman Brothers服務時認識的客戶。他擁有一個價值100萬美元的投資組合，我建議他以賣出選擇權（put）避險，以取代直接賣空股票，於是他撥出5萬美元的資金供我操作。當時，這是相當新穎的操作手法。賣出選擇權可以提供一種具有槓桿效果的「保險功能」，並騰出資金做多。


    這個基金確實發揮它的功能，1968年12月份股價出現頭部前，7月與8月便發生一波拉回的走勢。非常不幸地，Starret Stephens在1969年便過逝了，恰巧是在1969-70年大空頭市場正式展開前。由於他的過逝，基金也隨之解散。這是我第一次直接管理他人資金，也是我第一次從事避險交易，它使我有機會在市場中測試我判讀盤勢的能力。這次經驗使我瞭解賣空交易的重要性——截至目前為止，這仍然是我的專長之一。


    這筆基金解散後不久，當時處於1969年的空頭市場，為了追求更大的獨立交易空間，我離開Filer Schmidt & Co.，前往「美國選擇權公司」（U. S.
    Options）。因為當時處於空頭行情中，公司方面不願意在薪水上做承諾，管理階層建議讓我就撮合選擇權的價差抽取固定百分率的佣金。我答應了，但我明白地告訴他們，我第一年便準備賺取10萬美元的收入。我這麼說相當於是一項警告，因為我知道公司副總裁每年的薪水才僅有2.5萬美元，而且其他選擇權交易員的年收入約為1.2萬美元至1.5萬美元之間。


    經過六個月，我的佣金收入已經累計至5萬美元。有一天，老板把我拉至一邊，輕聲告訴我，「維克，你幹得不錯，我打算讓你開始領薪水。」'
  merge: -1
  img_proc: true
- pgno: 36
  md: '「哦？」我說，「多少？」


    「每年$20,000，」他答道，似乎這是給我很大的面子。


    「但…，」我說，「我今年準備賺進10萬美元，而且我已經完成一半了。」


    「哦！沒錯，但我們準備成立一個按點數分紅的獎金制度。你每銷售一口契約，便可以得到一點。在年底的時候，我們提撥公司利潤15%爲獎金，每個交易員根據點數分紅。」


    「嗯…，」便是我的回答，但我的腦中立即浮現一些很明顯的疑問，例如：如果公司沒有獲利怎麼辦？公司的獲利又怎麼計算？不用說，我開始尋找另一個更適當的獵場。三週之後，我開始在Marsh
    Block管理一個股票與選擇權的投資組合，並抽取50%的績效獎金。一位好朋友（他最後也離開「美國選擇權公司」）後來告訴我，我過去的老板在三週休假中打電話告訴他，「我們讓維克領薪水完全是爲他著想；他這個月好像很不高興。」實在奇怪！他要求我減少80%的收入，而竟然還希望我覺得很高興！這更強化我對於自由的嚮往。


    在Marsh Block，我運用過去累積的盤勢判讀經驗與選擇權的知識，第一次利用股票與選擇權來配合交易。一般來說，我會買進一個選擇權的跨形價差交易（straddle）契約，並根據盤勢發展，隨後再決定買進或賣空股票。跨形價差交易是由一對選擇權構成：一單位的買進選擇權與一單位的賣出選擇權，它們的履約價格與到期時間完全相同。例如，假定XYZ股票目前市價是每股25美元，我認爲它將跌至21美元。若以同業價格計'
  merge: -1
  img_proc: true
- pgno: 37
  md: '算，我大約能以400美元的權利金（譯按：100股），買進95天期的跨形價差交易，並等待弱勢反彈來賣空股票。


    如果股價上漲至27美元，我將在盤勢轉弱時賣空100股。選擇權到期時，如果股價持續上漲至30美元，則我將根據25美元的契約價格履行買進選擇權，並回補空頭的股票部位，這時候的賣出選擇權將毫無價值，所以總共的虧損為200美元。（譯按：選擇權的成本為400美元，股票空頭部位損失300美元，履行買進選擇權獲利500美元，總共損失200美元。）如果在選擇權到期之前，股價正如我所預期地跌至21美元，則我將買進200股（譯按：包括回補100股的空頭部位），並實現股票空頭部位的600美元利潤。在這個時後，我仍然擁有200股的多頭部位（100股現股與買進選擇權），其中100股現股可以鎖定賣出選擇權的既得利潤（譯按：400美元），股價在選擇權到期前，如果回升至25美元以上，買進選擇權還可以獲利。（譯按：選擇權的成本為400美元，股票空頭部位獲利美元600，賣出選擇權獲利美元400，所以淨獲利為600美元，再加上買進選擇權仍有獲利的可能。）除此之外，我也可以在21的價位僅買進100股股票，實現股票空頭部位的利潤600美元，並讓選擇權的跨形價差交易繼續發揮功能。交易時，我永遠要求「風險/獲利」的比率至少為1：3。在我所採用的各種策略中，判斷正確時，我可以獲得巨額的利潤；若發生錯誤，損失卻相當有限——這便是資金管理的精義所在。


    不幸地，我在Marsh Block所獲待遇幾乎是「美國選擇權公司」的翻版，唯一的差別僅是手段而已。當我收到每月損益表時，發覺我的「費用」大得荒唐。例如，我僅佔用一線電話，'
  merge: -1
  img_proc: true
- pgno: 38
  md: '每個 月卻需分攤500美元的電話費！總之，我希望進一步控制我的管理費用。


    經過六個月後，我認爲唯有自行創業才是根本的解決之道。「華爾街」上的許多交易員顯然都遭遇相同的處境；幾乎我所認識而尊敬的每一位交易員，都準備承擔風險與我一起工作。我找到一位提供資金的合夥人，並聘用一些「華爾街」最棒的交易員，於是「雷納選擇權公司」（Ragnar
    Options Corp.）在1971年中正式開張。


    # 獨立的滋味


    在雷納（Ragnar）的時期，我們以非常前衛的方式經營選擇權業務。根據我的瞭解，我們是第一家提供明確報價與保證交割的經紀商/交易商，而且不因此收取較高的權利金。我們稱此爲「提供合理的明確報價」。如果我們不能在市場中找到既有的選擇權契約撮合一筆交易，我們便自己銷售（write）選擇權。我們的競爭對手認爲，我們一定擁有龐大資本才可承擔相關的風險。實際上，我們最初的資本僅有50萬美元——其中營運資本爲25萬美元，公司的交易帳戶爲25萬美元。我們的想法是，藉由明確報價與保證交割提高交易量，如此便可以吸收小額的虧損。這項策略確實有效。六個月內，根據我的瞭解，雷納已經是全世界選擇權店頭市場的最大交易商。


    1972年7月前，我負責管理公司，並與其他交易員共同從事選擇權的仲介業務；之後，我接替合夥人「操作存貨」（running the invertory）。「操作存貨」是指管理雷納的選擇權與'
  merge: -1
