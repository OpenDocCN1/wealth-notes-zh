  md: '李氏將道瓊指數歷史上的所有價格走勢，根據類型、幅度大小與期間長短分別歸類，他當時僅有30年的資料可供運用。非常令人訝異地，他當時歸類的結果與目前92年的資料，兩者之間幾乎沒有什麼差異。⑦例如，次級折反走勢的幅度與期間，不論就多頭與空頭市場的資料分別或綜合歸類，目前常態分配的情況幾乎與李氏當時的資料完全相同；唯一的差別僅在於資料點的多寡。


    這個現象確實值得注意，因為它告訴我們，雖然近半世紀以來的科技與知識有了突破性的發展，但驅動市場價格走勢的心理性因素基本上仍相同。這對專業投機者具有重大的意義：目前面臨的價格走勢，幅度與期間都非常可能落在歷史對應資料平均數（medians）的有限範圍內。如果某個價格走勢超出對應的平均數水準，介入該走勢的統計風險便與日俱增。若經過適當地權衡與運用，這項評估風險的知識，可以顯著提高未來價格預測在統計上的精確性。⑧


    # 定理3：


    主要的空頭市場（Primary Bear Markets）：主要 的空頭市場是長期向下的走勢，其間夾雜著重要的反彈。它來自於各種不利的經濟因素，唯有股票價格充分反映可能出現的最糟情況後，這種走勢才會結束。空頭市場會歷經三個主要的階段：第一階段，市場參與者不再期待股票可以維持過度膨脹的價格；第二階段的賣壓是反映經濟狀況與企業盈餘的衰退；第三階段是來自於健全股票的失望性賣'
