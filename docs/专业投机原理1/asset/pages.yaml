- pgno: 178
  md: '與價格爲參數。在商品市場中，我採用的震盪指標，則是以兩種移動平均之差值爲參數。


    在股價指數中，我運用的振盪指標（價格與市場寬度）從1975年1月採用以來便始終有效（參考圖8.12與8.13）。我在商品市場中運用的震盪指標，其計算公式已經設定在我的報價系統中，我可以隨時更改移動平均的計算期間，以便就特定商品尋找最佳的套入（a
    good fit）期間（參考圖8.14）。


    參考圖8.12至8.14可以發現，一個理想的震盪指標，會在市場趨勢開始變動的同時、或之前開始反轉。大多數情況下，我採用的震盪指標都相當精確。一般來說，市場處於上升趨勢時，震盪指標也會隨之上升。震盪指標愈高時，市場也愈呈現「超買」（overbought）的情況。在理想的狀況下，就如同圖8.11的鐘擺一樣，市場接近頭部時，震盪指標也會「遲緩下來」；換言之，它會趨於平坦而做頭。然後，價格開始反轉時，震盪指標會向下，而且持續向下，直至市場接近「超賣」（oversold）的情況，並出現類似於頭部的反轉走勢。


    一般來說，震盪指標的數值愈高或愈低時——相對於先前出現的其他高、低點而言——它們愈重要。現在，讓我說明這些震盪指標的計算方法，以及如何運用它們。


    衡量股票行情寬度的動能時，最理想的指標可以稱爲「10天約當期-淨變動-移動平均-行情寬度震盪指標」（10-day equivalent, net change,
    moving average, breadth oscillator）。這看起來十分複雜，實際上很簡單。在我正式討論它的計算方法前，先稍微解釋何謂「行情寬度」。'
