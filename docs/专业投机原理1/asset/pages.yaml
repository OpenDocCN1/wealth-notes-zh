  md: '# 謝 辭


    我看過「華爾街」（Wall Street）這部電影以後，興起撰寫本書的念頭。媒體經常扭曲金融界的實際情形，這是我希望澄清的觀點。透過辛勤的工作、合理的決策、幾陣的笑聲、以及一些好友，金融市場是一個可以同時提供快樂與成功的場所，絕對沒有必要訴諸電影中描述的那種邪惡情節。


    看完電影後興起的這股念頭，稍後演變爲一個遠超過我預期的計劃。如果沒有親朋好友與公司同仁們提供的協助，我絕對無法完成本書。首先，我非常感謝T. Sullivan
    Brown，他的流利文筆與相仿的理念，使本書可以成爲一本我深以爲傲的作品。我也很感謝我的合夥人Norman Tandy與Douglas Kent，他們的協助與建議都已經成爲本書的一部份。


    妻子Teresa對我的協助，已經不是言語所能夠表達。在整個交易生涯中，如果沒有她的貢獻、支持與耐心，我根本不可能培養出任何值得一提的技巧。我也希望感謝我兩個女兒對我的熱愛與瞭解，以及她們對於本書內容的興趣。


    我也希望感謝我過去與現在的員工與同事們，他們對我的協助實在太多了，在此無法一一致意。最後，我要感謝我的朋友們，他們的關心與愛護都已經成爲我個人成長與成就中的一部份。'
