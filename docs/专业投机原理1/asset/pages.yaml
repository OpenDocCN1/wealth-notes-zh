  md: '人，他們在某一程度上必須做多股票。假定根據基金的章程規定，股票最低的投資比率為20％，最高為60％，經理人希望決定股票市場適當的資本配置比率。如果股票市場處於多頭市場的第三主要上升波，根據統計數據顯示，第三主升波的漲幅與期間平均值分別為18.8％與139天。如果行情已經在103天內上漲12％，經理人必須瞭解，在歷史上23個多頭市場的第三主升浪中，有16個走勢持續得更久。單就這項數據來考慮，經理人的持股比率不應該超過最高水準60％的69％。換言之，單就歷史統計數據判斷，持股比率不應該超過41.4％。


    我希望再次強調，這僅是一個起點而已，一個評估市場風險的根據。如果在上述的統計數據背景下，通貨膨脹率為1％，本益比為9倍，利率為5％，而企業盈餘正處於快速成長的階段，則應調降統計數據代表的意義，並維持最高的持股比率60％。


    就我個人的成功而言，上述的風險衡量具有絕對的重要性，尤其是在判斷長期與中期走勢的轉折點方面。它讓我把思考重心擺在風險之上，這是我投機方法的基礎。不論你以什麼方法預測行情或選擇股票，都應該在市場平均剩餘壽命的架構內評估市場風險。這套方法都為風險管理提供一個嶄新而獨特的領域。


    # 以勝算管理配置資本


    第二章曾經提及，我主要的考量重心在於降低風險，同時將充分的資金擺在適當的場所，賺取穩定的利潤。這個目標是'
