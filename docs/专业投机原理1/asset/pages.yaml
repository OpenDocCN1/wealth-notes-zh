- pgno: 308
  md: '務必知道你是根據什麼趨勢交易，並瞭解它與另兩種趨勢的相關性。運用1-2-3趨勢變動的準則，判斷趨勢反轉的價位。價格觸及反轉價位時——立即出場！另外，你也應該留意2B模式與其他技術指標，儘可能預先掌握趨勢可能反轉的訊號。


    # 守則3：在許可的範圍內，儘可能採用停損單。


    建立部位之前，你應該預先決定市場證明你判斷錯誤的價位。對於許多交易者來說，行情觸及預定價位時，認賠出場是最困難的動作之一。你可以利用停損單減少這方面的困擾。行情觸及停損價位時，停損單會自動轉變爲市價單（market
    order）。


    如果你你的交易量很大，你僅能使用心理停損。如果你預先遞入一張大量的停損單，場內交易員會想盡辦法觸發你的停損。


    所以，建立一個部位時，應該遞入第二張交易指令，在停損價位上了結你的部位。確實的運作方法，取決於你以何種趨勢交易。一般來說，停損單的效力僅及於遞單當日收盤爲止。可是，你可以在停損單附上一個但書「取消前有效」（good
    ''til cancel，或GTC），這張交易指令在你取消前都有效。


    事實上，傳達任何交易指令時，必須留意措詞，不可引起誤解。我的好朋友John Malley，也是一位交易員，他告訴我有些人會下達涵意不明的指令，例如："Sell
    me 500 IBM at the market"（譯按：「以市價幫我賣出500股IBM」，但也可能解釋爲「以市價賣我500股IBM」）。所以，John回答，「嗯…'
  merge: -1
