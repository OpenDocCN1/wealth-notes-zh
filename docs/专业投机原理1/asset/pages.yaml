- pgno: 316
  md: '相對於多頭市場來說，如果你妥善管理資金，在空頭市場能夠以較短的時間獲取類似的利潤，風險並不會更高，甚至可能更低。就經濟循環的性質來看，你不曾見過「黑色星期一」的復甦，所以就某一角度而言，空頭市場較安全。


    # 守則10：不可攤平虧損——虧損部位不可加碼。


    「攤平虧損」（average down）僅是一種試圖避免承認錯誤或期待解套的藉口，而且是在不利的勝算情況下。它之所以被稱為「攤平虧損」，因為這是一種追加部位的行為，並因此降低整體部位的淨虧損百分率。這項行為的合理化藉口是：


    「這支股票（期貨、債券或任何交易對象）將上漲（下跌）。我現在雖然損失，但如果追加部位，可以降低平均成本，最後可以大賺一筆。」


    守則10實際上是守則6——迅速認賠——的輔助定理。然而，「攤平虧損」是一種極常見的錯誤行為，所以它應該有屬於自己的「不可」守則，這是為了提醒你，它是一項錯誤的行為。


    然而，某些行為看起來似乎是攤平虧損，實際上卻不是。例如，如果你在空頭市場中尋找中期的做空機會，猶如上文所說，最佳的做空時機是在小漲勢中。假定股票市場連跌四天，似乎將形成空頭市場的主要下跌走勢，理想的做空時機在第一天的反彈。如果價格連續反彈兩天，第三天再反彈的可能性很低，所以第二天可以追加部位。如果第三天又反彈，第四天繼續上漲的可能性不到5%，你可以再做空。然而，如果行情連'
  merge: -1
  img_proc: true
- pgno: 317
  md: '續上漲四天，中期趨勢很可能向上，你應該認賠出場。


    這項策略與攤平虧損之間的差異，在於你有一套交易計劃，並設定市場證明你錯誤的停損點。在計劃中，你將評估每天的反彈幅度，以及反彈的天數。交易之初，你不僅已經限定反彈的天數，而且也設定認賠的出場價位。攤平虧損的策略並不設定停損，部位的了結完全取決於主觀的情緒。


    # 守則 11：不可僅因為價格偏低而買進。不可僅因為價格偏高而賣出。


    這完全不同於在超級市場買水果，交易中並無所謂的「特價品」。交易的重點僅在於獲利或虧損，這與交易工具的價格沒有任何關係。價格僅在少數情況下會影響交易決策，例如：你可能因為保證金過高而無法從事某筆交易，或其他交易機會可以提供較佳的槓桿效果，而其風險/報酬比率相似或更理想。


    不可以存在這種心理：「這已經是歷史低價，它不可能再跌了！」或「這已經不可能再漲了，我必須賣出！」除非你見到趨勢發生變動的徵兆，否則趨勢持續發展的機會較高。當市場處於歷史高價或低價，但沒有任何徵兆顯示趨勢即將反轉，我建議你不要去挑逗它，繼續等待趨勢變動的訊號。順勢交易，耐心等待。


    # 守則 12：僅在流動性高的市場中交易。


    現在，許多住在美國東北部的人可能告訴你，他們的住宅價值 50 萬美元。然而，這句話的真正涵義可能是：他們過去以 50 萬美元的價格買進；或者，幾年前，他們以房屋作第二次抵'
  merge: -1
  img_proc: true
- pgno: 318
  md: '押貸款時，當時價值是50萬美元。事實上，現在市場上充滿價值50萬美元的待沽房屋，幾乎全無問津之人——房屋市場幾乎完全缺乏流動性。在財務報表上，50萬美元的數據或許暫時沒有問題，但這與市場價值全無關連。


    如果你在流動性不佳的市場交易，你也可能遭遇類似情況。價格的變動速度非常快，可以輕易地穿越你的停損，並讓你的損失較預期多出一倍。在商品與外匯的期貨交易中，僅選取最近月份的契約，在股票與選擇權中，選取成交量大而交易活絡的個股。


    # 守則13：價格變動迅速時，不可建立部位。


    這條法適用於場外交易者——他們仰賴電子報價系統取得最新的報價資料。「快速市場」（fast market）是指場內的交易進行得非常快速，報價系統的價格輸入速度跟不上實際的交易。發生這類狀況時，交易所通常會提出警告。換言之，在快速市場中，你在螢幕上看見的報價，並不是當時的實際報價。快速市場中，行情向上突破時買進，或行情向下突破時賣空，都是非常迷人的機會。你看見價格一飛沖天或直線下跌，滿腦子都是鈔票的影像。


    我辦公室裡有一位年輕的交易員不信邪，他在向下突破的快速市場中以市價賣空S&P 500期貨。他的成交價格較下單時的螢幕報價低16檔（每口契約400美元）。他回補時，根據螢幕報價顯示，這個部位有16檔的獲利，但實際的回補價格卻較成本高出10檔——每口契約虧損250美元。然而，這次教訓似乎還不夠，第二天他又犯同樣的錯誤。我不認爲他還會在快速'
  merge: -1
  img_proc: true
- pgno: 319
  md: '市場中交易。交易中，你唯有倚賴報價資訊。在快速市場中，報價資訊完全不可靠，所以不要交易！


    守則 14：不可根據特殊情報（tips）交易。換言之，「順勢交易，而不是順著朋友的意見」。另外，不論你對於某支股票或某個市場有多麼強烈的感覺，也不可以提供免費的消息或意見。


    不妨由機率的角度思考，在數以萬計的市場參與者之中，你的朋友知道某項全世界都不知的消息，你認爲這種可能性有多大？如果他或她真的知道某項特殊消息，這很可能是「內線消息」，根據內線消息交易是違法的行爲。


    所謂的「特殊消息」，99.9 %是屬於個人的看法。在The Secrets of a Professional Futures Trader 一書中，作者Henry
    Clasing指出，穩定的贏家幾乎絕口不提他們在市場中的活動細節，但穩定的輸家則會「向每一位聽眾說明他們在市場中的一舉一動，甚至於以強迫推銷的方式吹噓。」①就心理層面而言，人們迫切地希望提供特殊消息，他們可能是在尋求認同與贊許。他們絕對不是爲你著想，這點是可以確定的。所以，有人向你推銷特殊消息時，我建議你說，「不客氣，謝謝，我不需要。」


    我曾經聽信特殊消息…一次。前文中，我曾經提及Jim Bruckie，當年Ragnar 發生一些麻煩時，他當時在CBOE 負責稽核的工作，我們有過往來，他隨後也來到Interstate，我們舉辦了一個歡迎酒會。我正準備離開時，聽到熟悉的聲音，「嘿，維克，維克，等一下。」'
