- pgno: 290
  md: '# 圖 11.1


    自從1896年以來，道瓊工業指數在多頭市場中主要走勢的幅度與期間分配圖。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_290_0.png)


    如，「道瓊工業指數」在多頭市場中主要中期走勢的漲幅，目前的平均數為20％。1896年以來曾經出現112個多頭市場的主要走勢，其中57個走勢（50.89％）的漲幅介於15％與30％之間，最小的幅度為4.3％，最大的幅度為116.6％。在這些走勢中，25％的走勢漲幅超過30％，33.04％的走勢漲幅低於15％。單就這項準則而言，你可以判斷主要走勢的漲幅通常介於15％'
  merge: -1
  img_proc: true
- pgno: 291
  md: '至30％之間。當然，在做相關判斷時，你絕對不可以僅倚賴這項準則。


    不妨考慮人壽保險公司如何蒐集資料。它們提出的第一個問題是年齡。其次是工作的危險程度、醫療記錄、家庭記錄、……等。然而，死亡率統計表是標準的參考依據，並以此做為起點評估某項保單的風險。同理，我是以上述常態分配為依據，計算某行情到達或超過特定幅度與期間的機率。我絕對不會以此預測當時走勢的確切幅度與期間。大部分市場參與者的判斷改變時，市場轉折點便發生了……就是這樣。市場參與者改變他們的看法，通常是源自於經濟的基本因素、「聯邦準備理事會」的政策、主要的國際事件、以及我在前幾章討論的種種理由。


    以幅度與期間的分配架構預測某特定行情的確切轉折點，這就如同保險公司可以根據死亡率統計表，在你買保險的當時，判斷你將在那一天因爲什麼理由而過逝。我並不希望說不吉利的話，但每個人都會在不同的時間，在不同的情況下，因爲不同的理由過逝，行情的結束也是如此。然而，你明年在舞台上比較可能看見誰，Meryl
    Streep（瑪莉史翠普）或George Burns（喬治本斯）？這些架構是在歷史的層面上顯示概率分配，以供你判斷當前的市場趨勢會持續或結束。


    讓我們再回到保險的比喻中。如果有兩個男人，一個18歲，另一個75歲（美國男人的平均壽命），健康情況都非常理想，他們到保險公司購買期間相同的人壽保險，年輕人的保費將很低，老者的保費將很高。保費的水準是根據風險計算；換'
