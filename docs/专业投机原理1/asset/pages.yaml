- pgno: 104
  md: '不論你參與的是那一種市場或那一種時間架構，除非你知道趨勢的方向，並瞭解如何判斷趨勢的變化，否則你不可能獲利（運氣除外）。乘著「道氏理論」的記憶猶新時，此處另外將提出一些相當有用的觀點。其中某些內容僅適用於股票市場，但絕大部份都適用於任何市場。瞭解這些內容，將非常有助於你判斷趨勢可能在何時發生變化或已經發生變化。


    # 確認的重要性


    在股票市場的交易中，存在一種最嚴重的錯誤，那便是僅根據一種指數的走勢判斷。我們經常可以發現，某一市場指數出現反轉走勢達數星期或數個月之久，另一種指數卻呈現相反方向的走勢。這種現象稱之爲背離（divergence），它僅有負面性質的用途。猶如李氏所說：


    > 兩種市場指數必須相互確認（Both Averages Must Confirm）：——鐵路與工業指數的走勢永遠應該一起考慮。一種指數的走勢必須受到另一種指數的確認，如此才可以做有效的推論。僅根據一種指數的趨勢判斷，另一種指數並未確認，結論幾乎是必然錯誤。


    李氏在 1932 年提出這項觀察。目前，除了「道瓊工業指數」與「道瓊鐵路（運輸）指數」以外，我們還有「史坦普 500 指數」（S&P 500）、「價值線指數」（Value
    Line）、「主要市場指數」（Major Market Index）、債券指數、美元指數、商品指數、…。所以，上述原則經過更新之後，「兩種'
  merge: -1
