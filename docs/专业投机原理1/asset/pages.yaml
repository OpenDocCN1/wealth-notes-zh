  md: '氣象預測中，氣壓器是衡量空氣壓力的一種儀器。因為空氣壓力的變化會先於氣象的變化，所以氣壓器是預測氣象的一種重要工具。然而，氣壓器本身無法提供任何有關降雨量的資料，氣壓與溫度之間也沒有高度的相關性。同理，市場指數雖然是經濟預測的根本工具，但我們還需要許多輔助資訊才可以解開謎題。


    # 道氏理論的「定理」


    提出「道氏理論」的假設後，李氏繼續由道氏與Hamilton 的著述中，整理出他所謂的「定理」。這些定理出版於1932年，基本上仍然適用於今天。但是，我們不能以表面的意思解釋它們。為了確實瞭解這些定理的意義，我建議你準備一套「道瓊工業指數」與「道瓊運輸指數」完整的走勢圖，包括成交量在內，並配合Hamilton
    與李氏的相關評論，這些評論可以在《華爾街日報》或Barron’s 雜誌的歷史檔案中找到。不幸地，這是你必須自行完成的工作。一旦瞭解Hamilton 與李氏的思想精義之後，你可以很容易地將這套理論運用於目前的市場，但你還需要知道其中的部分修正，我會在下列討論中說明。（相關討論，請參考圖4.1。）'
