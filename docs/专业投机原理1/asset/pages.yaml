  md: '下降趨勢——下降趨勢是由連續一系列的跌勢構成，每一段跌勢都持續向下穿越先前的低點，中間夾雜的反彈走勢（換言之，漲勢）都不會向上穿越前一波漲勢的高點。總之，下降趨勢是由低點與高點都不斷下滑的一系列價格走勢所構成（參考圖5.4）。


    # 圖5.3


    道瓊工業指數週線圖——指數處於上升趨勢（多頭行情）。上升趨勢是由高點與低點都不斷墊高的一系列價格走勢構成。


