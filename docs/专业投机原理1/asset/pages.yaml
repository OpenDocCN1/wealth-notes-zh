  img_proc: true
- pgno: 292
  md: '言之，在所繳保費總額超過保單金額（包括利息在內）之前，受保人死亡的機率必須很低。然而，如果這位年長者的體溫高達102度，又是一位老煙槍，保險公司可能根本不願意賣保險給他。


    由相同的角度考慮1987年10月的崩盤與1989年10月的小崩盤。1987年崩盤當時的主要中期趨勢是起始於5/20/87。截至8/25/87為止，「道瓊工業指數」在96天以內上漲22.9％，「運輸指數」則在108天以內上漲21.3％。不論就幅度或期間而言，它們都已經是歷史上多頭市場中期走勢的平均水準。以人壽保險的術語來說，行情已經到達平均壽命；換言之，在歷史上所有中期走勢中，50％是結束於此之前。單就這個準則而言，提高警戒是必要的，所以應該進一步檢查病歷表。


    當時的市場已經不是身心健全的人。指標出現背離；「工業指數」在8月創新高，但「騰落比率」（advance/decline ratio）卻未創新高——空頭的徵兆。市場的平均本益比為21倍，這是1962年（當時為22倍）以來最高的水準。平均帳面價值（未考慮通貨膨脹的名目價值）對股價的比率高於1929年的水準。政府、企業界與消費者的負債都到達前所未有的水準。其他還有我先前討論的種種現象。1987年10月份，市場不僅不是一位身心健全的人，它是酒精中毒，再加上肺炎第三期，而且每天還抽三包無濾嘴的「新樂園」。


    所以，我斬然出場，並等待賣空的機會。10月份的第一個壞兆頭是「華爾街日報」刊登的一篇報導：「Fed主席葛林斯班認為，如果金融市場普遍存在通貨膨脹的憂慮，利率將『高'
