  md: '資金管理方法讓我全身而退，並保有ㄧ部份獲利。


    讓我說明上述程序與我的交易根本哲學之間的直接關係。


    首先，利用槓桿原理，挑選適當的買進點與停損點，我的資金並未暴露在偏高的風險中。如果發生非常罕見的情況，價格再度向下跌破趨勢線，我會認賠出場，損失頂多是1-2％。隨後，如果價格又回升，我有能力再進場。總之，這筆交易符合保障資本的原則。


    其次，價格到達目標價位時，我了結相當比例的部位鎖定獲利，這符合一致性獲利能力的目標。


    最後，我以一部份獲利繼續持有多頭部位而追求卓越的績效。我對於長期趨勢的判斷雖然錯誤，但整體部位卻仍有獲利。根據相關的風險配置資本，設定初步的目標價位以鎖定利潤，再運用一部份的獲利追求更高的績效，如此一來，即使連續發生數次的損失，你還有能力繼續留在市場交易。


    # 資本配置


    不幸地，我們沒有簡單的公式可以設定在電腦中，計算最佳的資本配置。例如，我無法在歷史資料與「工業指數」和「運輸指數」等買賣價位之間，建立一種線性的風險關係，因爲這違背市場的性質。你的市場判斷必須盡可能根據寬廣的知識，結合所有知識評估未來事件。


    假定我們處在一個強勁的多頭市場中，漲幅與期間都已經超過歷史的平均水準；通貨膨脹率僅2％；全球政局非常穩'
