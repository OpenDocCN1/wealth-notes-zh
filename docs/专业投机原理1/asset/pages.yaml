  md: '我減少交易次數，我交易時，心中已經準備接受搶劫。於是，我的血壓降低了。


    Gaylin 認爲，現代文明使恐懼與忿怒變得有些過時，他便是   指這種情況而言。我們回頭討論交易者約翰，他所有的情緒反應原本都是爲了保護自身，讓他以戰鬥或逃避因應危險。約翰面對著真實而有形的威脅，他可能發生虧損；這種情況下，某種程度的恐懼反應是可以理解的。然而，他的忿怒與實際發生的一切，完全失去了平衡。事實上，他無需選擇戰鬥或逃避，至少可以不採取實際的行動。他試圖逃避，卻愈陷愈深。執行停損是唯一的合理逃避方式。他試圖戰鬥，結果呢？如果你希望過著充滿挫折感的生活，那你不妨嘗試與市場戰鬥。


    如果約翰執行停損，情況又會如何呢？應該會好多了。他會蒙受一些痛苦，但也可以避免發生額外的損失；更重要者，他知道自己遵循交易守則，所以他可以很有自信地重新來過。他可以重新考慮當時的情況。他可能認爲，自己的判斷太過於精確而超過市場的反應，並決定等待另一個賣空機會。然而，他並沒有這麼做。他讓自身的矛盾擊敗自己；他讓情緒由保護者轉變爲摧毀者。


    # 一致性表現的根源：情緒的紀律


    我雖然還沒有達到全然一致性的整合境界，但我並不準備屏息以待。人們在這個佈滿荊棘的世界中成長，圍繞在各種瘋狂的哲學思想中，承受來自家庭方面的錯誤壓力，接受學校制度的矛盾教育，在社會上試圖謀取生計，並嘗試在整個價值體'
  merge: -1
  img_proc: true
- pgno: 355
  md: '系內納入完美的秩序，同時又必須調整情緒反應符合既有的價值結構，這一切幾乎已經超越可能的範圍。所以，我們能夠怎麼辦？我們能夠做的僅是盡可能地追求整合的境界——讓思想、行為與情緒相互一致——而使生活基本上成為是一種愉悅的過程。


    如果想獲得理想的交易績效，你必須：


    +   1. 建立目標。

    2. 取得市場的相關知識。

    3. 界定有效的交易守則。

    4. 嚴格遵循交易守則而執行上述三者。


    前三點相對容易，但付諸執行非常困難。如果對於自身與市場都俱備完整的知識，執行便很容易。不論我們在生命中追求什麼目標，情況都是如此。然而，我們的知識並不完整，而且無法全然避免錯誤，所以我們的行為必須根據既有的最佳知識，不可受到誘惑而違背交易法則，因為我們在心理上與生理上都必然會遭受恐懼與憂慮。猶如任何技巧一樣，克服非理性的衝動，需要訓練與紀律，就此處來說，這是情緒的紀律。


    紀律是一種態度，使行為可以完全依據一套既定的法則或原則。猶如先前的說明，情緒是一種與生俱來的功能，取決於我們的價值觀與信念。嚴格來說，情緒不能夠被直接訓練，而情緒上的紀律並不適用於情緒本身，適用於我們如何處理它們，如何以思想與行動回應情緒。'
  merge: -1
  img_proc: true
- pgno: 356
  md: '情緒的紀律是接受情緒的一種持續性程序，試圖辨識它們在價值觀上的根源，評估它們與當前事件在關係上的有效性，並在目標與行動之間建立一種經過整合的一致性關係。經過持續的練習，情緒的紀律將成爲一種習慣，使你可以處理情緒而不至於迷失在情緒之中。


    如果你可以接受情緒，瞭解情緒是與生俱來的功能而不應該與它們搏鬥，你便不會把它們視爲破壞者，而是自我中不可或缺的一部份，它們可以提供潛意識中的可貴資訊。如此一來，先前用來與情緒搏鬥的精力便可以轉移至他處，嘗試瞭解它們在價值體系中的根源，並評估你對於當前事件的反應。透過這種程序，並觀想情緒衝動的反應可能造成何等可怕的後果，你可以更加相信你有選擇的餘地，你可以選擇理性或非理性的行爲，這是在你的控制之中。


    情緒激動時，我們的精力與感知都會大幅提升。何以需要與它搏鬥呢？我們可以運用這些精力與感知。經過持續的練習，情緒的紀律可以協助我們營建自信心，並控制自身的行爲。它讓你可以將先前浪費的精力轉移至自我瞭解的有益目標。情緒的紀律是一種工具，它使你可以管理情緒，並選擇最佳的行動，而無需被迫接受強制性的反應——它使你俱備意志力執行你的知識。


    擁有執行的意志力，代表有能力或力量執行一套具有特定目標的行爲計劃。這代表有能力決定（decide）。「決定」在拉丁文的意思是「排除」（cut off）。一旦你真正做成決定時，你的心智已經認定沒有其他更理想的可能選擇。這種情況'
  merge: -1
  img_proc: true
- pgno: 357
  md: '下，執行計劃已經不是選擇性的問題，而是必要性的問題。計劃的本身變爲一種價值，如果能夠將它整合進入潛意識中，它實際上可以受到情緒的支持。依此方式練習，則情緒的紀律不僅可以提昇你的行爲能力，也可以降低情緒衝突的程度與頻率——它可以促成一致性的思想、行動與感覺。


    # 結論


    史波克的個性凸顯出我們共有的一个核心問題：情緒與理性的衝突。然而，他處理這類衝突時，違反了瓦肯哲學的最高原則：邏輯。他忽略一項事實，情緒是與生俱來的一種不可或缺的成份，否定或試圖排除它的存在，勢必造成內部的永恆衝突。他不瞭解，我們必須根據選定的標準——生命是一種理性的存在——界定個人的價值觀。


    在意識或潛意識的層次上，情緒取決於我們選定的價值觀。爲了確保情緒具有正面的意義，我們必須透過情緒的紀律，排列與整合情緒的反應。否則，情緒與理性將處於持續性的衝突中。


    身爲交易者、投機者或投資者，建立一個部位時，你的判斷與情緒便必須直接應付挑戰。根據定義，你必須接受風險，而風險必然伴隨著某種程度的恐懼與其他各種情緒。如果你像史波克一樣，忽略或試圖壓抑情緒，你造成的內部衝突在心理上與生理上都將構成嚴重的傷害。心理上，情緒的衝突將直接造成心理的負擔。生理上，情緒反應造成的壓力將導致失眠、高血壓、胃潰瘍、疲倦、或其他更嚴重的傷害。'
  merge: -1
  img_proc: true
- pgno: 358
  md: "將情緒的紀律視爲一種持續的程序而不斷練習，你可以控制自己的心智，並培養決斷力，同時也可以降低情緒衝突的程度與頻率，這不僅對交易重要，也是一種積極的生活方法。這是我知道唯一的方法，可以促使身心的一致性，並持續滋長自我的尊嚴。\n\
    \n然而，我們的價值觀與信念都有矛盾與混淆之處，它們隱藏在潛意識中，所以情緒的紀律在練習上並不容易。判定情緒反應的根源尤其困難。這需要透過自我的反省，以辨識與瞭解價值信念和現實之間的關係，並捨棄矛盾的信念。可是，捨棄不當的信念，採納新的信念，並不能保證我們的情緒反應會隨之改變。改變情緒的反應，需要透過長期的自我反省，誠實地面對自己，而且在放棄某些珍貴的價值時，必須願意承受相關的痛苦。\n\
    \n本章中，我提出一個問題，不僅在金融交易上非常重要，它與實際生活也有密切的關係：史波克症候群；並由一般性角度提出解決問題的方法：情緒的紀律。下一章我將討論成功的意義與根源，並將情緒衝突的問題分解爲更明確的部份。特定而言，我將說明動機與決心的性質。將情緒衝突的問題，畫分爲定義明確而易於瞭解的領域，目的是使它們較易於接受改變。\n\
