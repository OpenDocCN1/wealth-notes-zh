    1989 年 5 月至 10 月之間，我幾乎完全沒有進場，這一部份是為了籌備我的基金管理公司，但一方面也是因為擔心下檔的可能性。截至 10/9/89 為止，「工業指數」起於
    3/23/89 的主要中期走勢，漲幅為 24.4 %。同一期間，「運輸指數」在兼併股票的帶動下暴漲 52 %。讓我將這段發展納入我的統計架構內。'
