- pgno: 75
  md: '一般市場參與者如果不能正確預期未來的經濟活動，財富將持續減少，也無所謂的長期多頭市場。然而，事實上，一般的股票交易者可以適當地預測未來的經濟活動，並使股票價格的走勢循環，領先經濟循環的變動。兩者在時間上的落差，來自於股票市場具有流動性，經濟的調整則不俱備這種流動性，因爲資本財與存貨的轉換性較爲有限。


    李氏說「市場指數永遠會適當地預期未來事件的影響（上帝的旨意除外）」時（斜體字是作者的強調），他真的是這個意思。但是，這句陳述隱含另一層面的意思，「適當地」反映（properly
    discounting）涵蓋各種分歧的看法；換言之，它包括人們認爲目前事件對於未來經濟活動之影響的各種不同意見。市場指數同時代表樂觀主義者、悲觀主義者以及「務實主義者」（realists）——包括一系列個人與機構的特殊看法，絕對不是任何單一個人可以複製的見解。


    李氏的陳述並不意味，市場參與者對於未來事件的解釋大體上必然正確；但該陳述確實代表，市場指數必然反映市場參與者的主要看法。對於態度嚴肅的市場觀察者來說，市場指數將顯示長期趨勢的方向與力道，市場何時處於超買或超賣的情況，市場普遍的看法何時產生變化，市場何時的風險過高而不適合於積極參與。


    我在註中爲李氏的假設加上「政府的行動除外」，因爲政府的立法程序、貨幣與財政政策以及貿易政策，都會對於經濟發展造成長遠的影響，所以——就如同天然災害一樣——它們會對股票價格產生立即而明顯的衝擊。另外，政府的決策者也'
  merge: -1
