- pgno: 164
  md: '我1968年開始採用這項指標，當時我閱讀William Gordon的一份研究報告，他將200天期移動平均的買賣準則運用於1917年至1967年的「道瓊工業指數」，每年的平均報酬率為18.5％。同時，他的硏究報告顯示，投資者若在「道氏理論」對於多頭與空頭行情的確認日買賣股票，每年的平均報酬率為18.1％。①在這份研究報告中，Gordon以兩個簡單的法則決定移動平均的買進與賣出訊號：


    +   1. 如果200天移動平均線由先前的下降趨勢，開始轉為平坦或上升，而且價格由下往上穿越均線，代表主要的買進訊號（參考圖8.3）。

    2. 如果200天移動平均線由先前的上升趨勢，開始轉為平坦或下降，而且價格由上往下穿越均線，代表主要的賣出訊號（參考圖8.4）。②


    你不僅可以利用長期移動平均線預測市場指數，也可以將它運用於個股與商品中。對我個人來說，移動平均有兩項主要的功能——確認「道氏理論」以判斷長期趨勢，以及篩選個別股票。


    選擇個別股票時，如果價格低於移動平均，我絕對不會買進；如果價格高於移動平均，我絕對不會賣出。你只要拿起任何的圖譜，並採用35週或40週的移動平均線，則你便瞭解我為何這麼做——勝算的問題。'
  merge: -1
  img_proc: true
- pgno: 165
