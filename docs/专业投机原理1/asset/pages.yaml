  md: '發生虧損的方法。例如，某一天，我還在Interstate的時候，我做多40多種股票，每種大約2000股。我還持有股價指數的買進選擇權，以及指數期貨。我全心全意交易之際。突然……一片黑暗。


    不是，沒有瘋子闖進來拿鎚子敲我的腦袋。停電了！我們雖然有自動供電系統，當時也不靈光。另外，電話線也和供電系統混在一起，所以連電話也不通。


    當時，我透過數個不同的經紀人與幾個交易所交易，我完全不知道市場的行情發展。所以，我急忙衝出辦公室，順著樓梯下樓，沿路摸索口袋裡的銅板準備打電話。我甚至不知道交易所的電話號碼，因為辦公室的電話都是直接與交易所連線。


    最後，我來到路旁的公用電話亭，倉皇地了結我的部位。我還得打詢問臺請服務人員幫我查芝加哥S&P 500期貨交易<|message|> 的電話號碼，你可以想像我當時的狼狽狀。現在回想起來蠻有趣，但當時真是不知所措。而且，根據「墨菲定律」（Murphy’s
    Law），市場出現一波不利於我部位的行情。這是你無法控制的混淆，所以你或許應該準備兩套自動供電系統。


    # 守則2：順勢交易。「趨勢是你的朋友」。


    這可能是大家最耳熟能詳的交易法則。這看起來雖然很簡單，你卻很容易違背。記住，趨勢總共有三種——短期、中期與長期。每一種趨勢都不斷變動，任何一種趨勢的方向都可能與另兩種相反。短期趨勢最經常發生變動，程度也最劇烈，其次是中期趨勢。'
