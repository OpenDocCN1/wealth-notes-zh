- pgno: 300
  md: '定，沒有任何潛在的衝突；企業界的獲利情況與財務結構都很理想；每一個主要國家的預算大致維持平衡，或僅有小額的赤字，而且都採用自由的金本位制度。很棒，是嗎？這種情況下，你顯然應該投入100％的資金。


    事實上，你需要根據主要的市場驅動因素，建立一個風險評估的表格，考慮它們相對的重要性，判斷你應該以何種方式投入多少的風險資本。如果你決定投資，應該再根據上述背景，選擇最可能達成目標的交易工具。


    截至目前爲止，我僅討論抽象的原則，所以讓我做更明確的說明。評估股票市場的風險時，你應該回答下列問題：


    +   1. 長期趨勢如何？它是處於上升趨勢、下降趨勢、狹幅盤整、或趨勢正在變化中？


    +   2. 就歷史資料考慮，目前長期趨勢的期間與幅度如何？它是處於初期、末期或中間階段？


    +   3. 就歷史資料考慮，目前的中期趨勢如何？


    +   4. 「道氏理論」對於目前的行情有何看法？是否存在背離的現象？成交量是否有明顯的變化？行情寬度是否配合趨勢發展？


    +   5. 移動平均的情況如何——應該買進、賣出或持有？


    +   6. 根據震盪指標顯示，行情是處於超買、超賣或中間的階段？'
  merge: -1
