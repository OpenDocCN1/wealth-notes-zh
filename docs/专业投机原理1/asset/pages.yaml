- pgno: 311
  md: '「那我就不了」，富翁說，「價格已經跌5美元，現在是55美元。」


    分析師非常訝異：「55美元！你什麼意思。Cessna 目前的價位是24美元！」


    「Cessna！…CESSNA！」


    「沒錯，Cessna！我叫你買進飛機，」分析師非常震驚的說道。


    富翁說道，「但『西北航空』也會飛啊！」


    這位富翁立即了結他的部位，虧損200萬美元。在整個過程中，他的懷疑都是有根據的。多了一個故事可以驗證這項交易法則，「一旦心存懷疑，立即出場！」


    守則5：務必有耐心。不可過度擴張交易。


    Frankie Joe曾經說過，任何市場每年通常有三至五個交易良機，包括個股在內。Frankie是一位投機者，他主要是以中期趨勢交易。然而，他的評論基本上適用於每一種趨勢。如果你願意的話，你可以投擲銅板決定：「正面做多，反面賣空」，每天從事一百筆交易。可是，如果你這麼做，就必須全憑運氣了。


    如果希望取得穩定的獲利，必須觀察你有興趣的市場，建立部位之前，你必須儘可能掌握有利的因素。以S&P 500期貨的當日沖銷為例，每天通常有二、三次交易的好機會，有時候'
