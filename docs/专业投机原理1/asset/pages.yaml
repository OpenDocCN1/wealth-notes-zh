  md: '# 圖7.7


    1990年價值線現貨指數——價格跌破先前の中期低點。價格跌破先前的重要低點，這是趨勢變動的第三個徵兆。1-2-3趨勢變動準則的第3種情況。


    ![](img/ad03a8b2e7f40a67b6bb4e406b90fd6b_140_0.png)


    TQ 20/20 © 1991 CQG Inc.'
