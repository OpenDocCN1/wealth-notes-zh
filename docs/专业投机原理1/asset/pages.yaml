  md: '社會上普遍存在一種非常危險的錯誤概念，因為政府與銀行體系似乎能夠以「無中生有」的方式創造貨幣，一旦發生壞帳時，它們也應該可以「一筆勾消」而不用承擔實質產品與服務的損失。公債尤其被視為是一種幾近於無限的資源，唯一的限制是大眾的信心。然而，猶如「永遠不沉」的「鐵達尼號」（Titanic；譯按：初航便沉船）一樣，政府在特殊利益集團的要求下任意揮霍，在正常的信用標準下，公債早就應該被宣佈破產。


    有關政府的借款，以及政府擔保的紙幣與貸款，其中並沒有什麼神秘之處。政府發行債券或國庫券時，這是購買者延遲消費而讓政府消費，但政府承諾未來予以清償。然而，這與商業性借款不同，政府的清償能力並不是來自於未來的生產能力，而是來自於未來的課稅能力；換言之，政府借款的清償來源是我們與後代子孫未來的實質所得——美國人民的生產力。


    政府的所得——不論來自於課稅、借款、或以通貨膨脹的方式增加貨幣供給——性質上都必須由全國的產能（productive capability）承擔。這是一種強制性的財富重分配，並更動常態市場要素的均衡位置。大多數政府活動在本質上都是以消費為導向而沒有任何生產。⑱


    政府的借款與放款雖然經過「擔保」，但並沒有太大意義，因為擔保完全仰賴課稅與/或印製鈔票的能力。如果政府選擇以印製鈔票的方式清償債務，通貨膨脹會導致美元貶值，這是另一種形式的稅金（但會造成極端倒錯的影響）。你不能「無中生有」，但你可以「由有變無」。政府以預算赤字融通'
