- pgno: 64
  md: '# 追求卓越的報酬


    當我已經獲利時，仍然運用相同的推理程序，但會進一步追求卓越的報酬。唯有當報酬與風險之間存在著合理關係時，我才會以更大的風險追求更高的資本報酬率。這並不意味我改變風險/報酬準則；我僅是增加部位的規模。


    1974 年的7、8月間便發生一個典型的例子，當時我在操作「雷納選擇權公司」的帳戶。我們的會計年度是於6月底結束，每一個會計年度開始，我的起始交易資本都是25萬美元。在7月份，我已經賺進約10.4萬美元的利潤，所以當季報酬率已經超過40%。當時，我非常強烈地看空行情，所以決定下個月將以半數的獲利建立空頭部位。在那個時代，「芝加哥期貨交易所」（Chicago
    Board of Exchange；CBOE）並沒有賣出選擇權的交易，所以我的空頭部位是建立在所謂的「合成賣出選擇權」（synthetic puts）之上。我投入5萬美元的風險資金，分別賣空3500股「德州儀器」、「柯達」、「麥當勞」與IBM，並各買進35口的買進選擇權。所以，我實際承擔風險的資金是買進選擇權的成本；每100股賣空的股票完全由買進選擇權避險——這便是一個「合成賣出選擇權」。


    當「道瓊工業指數」跌破7月份的低點750時，我建立上述部位，行情也正如我預期地下跌。接著，8月8日尼克森宣佈辭職，股價開始加速崩跌。8月結束時，交易帳戶的當月獲利超過26.9萬美元，一個月的獲利便超過這個會計年度的起始資本。這便是我所謂的「積極地承擔風險」：勝算站在我這邊，我投入更多的資金。即使我的判斷完全錯誤，我也僅不過損失'
