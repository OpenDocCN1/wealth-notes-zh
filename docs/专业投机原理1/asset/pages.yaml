- pgno: 50
  md: '後文將逐項解釋我如何預測這類行情。然而，如果我必須將方法中的所有成份都以一句話表示，它將是：根據重點思考（thinking in essentials）。


    重點未必在於你知道多少，而是在於你知道內容的真實性與相關性。Barron’s雜誌，每週都有數十頁印刷精美的摘要說明，敘述當週股票、債券、商品、選擇權以及其他交易工具的行情。資訊如此繁多，處理所有資料並瞭解它們代表的意義，實在超出人類心智的能力範圍。


    簡化資料的方法之一是專精於其中一、兩項領域。另一種方法是運用電腦處理組織與篩選的工作。但是，不論如何簡化資料，處理資訊的關鍵還是在於：如何由每天無數的資料中抽取根本重點（essentials）的能力。


    爲了掌握這種能力，你必須以原則（principles）統轄資訊，原則是界定金融市場性質（nature）的基本概念。一項原則是由無數特定事件與無數相關資料中，所抽象化的一種普遍性概念。複雜的市場資料在原則的統轄下，將變爲相對單純而易於處理。


    以一項簡單的陳述爲例：「成長需要仰賴儲蓄。」③這是否真理？這是否是一項原則？在普通常識的層面上，這顯然是一項原則。購買一棟房子，你需要付頭期款；若要付頭期款，你便需要儲蓄。另一方面，凱恩思學派的經濟理論主張，能以預算赤字的方式刺激經濟景氣；所以，儲蓄實際上將妨礙成長，支出才是經濟持續繁榮的關鍵所在。那種看法才正確'
  merge: -1
  img_proc: true
- pgno: 51
  md: '呢？這涉及什麼原則呢？


    我們暫時假定，成長確實需要仰賴儲蓄，而且不僅適用於購買房屋的單一事件，也適用於經濟活動中所有個人與團體——換言之，該陳述是一項原則。就金融市場的角度來說，這項原則告訴你什麼？答案是「很多！」例如，它顯示信用擴張的企業兼併活動不可能永遠持續下去，尤其在股票市場的巔峰水準上。景氣不佳的情況下（經濟衰退或經濟蕭條），一家公司的負債若遠大於現金準備與流動資產的總價値，它的生存條件便相當脆弱。這類公司的生存，完全仰賴未來的所得或額外的信用。經濟衰退期間，信用高度擴張的公司，將遭逢銷售量減退與信用成本提高的雙重打擊。如果你考慮投資的風險與相對的報酬，你將會質疑這類公司的生存機會、未來的獲利潛能、乃至於投資的潛在價值。


    同理，這項原則也可以適用於整體經濟。如果成長確實需要仰賴儲蓄，國家整體生產者創造的財富，必須大於整體消費，如此才可以將餘額投資於未來產品與服務的生產。聯邦政府持續採用預算赤字的政策，相當於以明天的生產融通今天的支出。這種情況下，僅有兩個可能的结果。或是(1)美國未來的總產量呈現突破性的發展，政府得以染指原本屬於儲蓄的部份，並以此清償債務，而且剩餘的儲蓄仍足以融通投資；或者(2)由於政府不斷增加課稅，或以通貨膨脹的手段稀釋生產者既有的財富，導致成長或成長率的減退。更重要者，如果政府試圖繼續採用預算赤字的政策，試圖繼續支出目前並不存在的財富，終必造成一場金融大災難——嚴重的空頭市場。'
