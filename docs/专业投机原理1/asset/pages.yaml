  md: '勢的折返幅度，約爲前一個主要走勢波段（primary swing；介於兩個次級折返走勢之間的主要走勢）的1/3至2/3之間，持續的時間則在三個星期至三個月之間。對於歷史上所有的修正走勢來說，其中61％的折返幅度約爲前一個主要走勢波段的30％至70％之間，其中65％的折返期間介於三個星期至三個月之間，而其中98％介於兩星期至八個月之間。價格的變動速度是另一項明顯的特色，相對於主要趨勢而言，次級折返走勢有暴漲暴跌的傾向。


    次級折返走勢不可與小型（minor）折返走勢相互混淆，後者經常出現在主要與次級的走勢中。小型折返走勢是逆於中期趨勢的走勢，98.7％的情況下，持續的時間不超過兩個星期（包括星期假日在內）。它們對於中期與長期趨勢幾乎完全沒有影響。截至目前爲止（1989年10月），「工業指數」與「運輸指數」在歷史上共有694個中期走勢（包括上漲與下跌），其中僅有九個次級修正走勢的期間短於兩個星期。


    在李氏對於次級折返走勢的定義中，有一項關鍵的形容詞：「重要」。一般來說，如果任何價格走勢起因於經濟基本面的變化，而不僅是技術面的調整，而且其價格變化幅度超過前一個主要走勢波段的1/3，都稱得上重要。例如，如果Fed將股票市場融資自備款的比率由50％調高爲70％，這會造成市場上相當大的賣壓，但這與經濟基本面或企業經營狀況並無明顯的關係。這種價格走勢屬於小型（不重要的）走勢。另一方面，如果發生嚴重的地震而使一半的加州沉入太平洋，股市在三天之內暴跌600點，這是屬於重要的走勢，因爲許多公司的盈餘將受到影響。然而，小型折返走勢與次級修正走勢之間的'
