  md: '得危險」。葛林斯班指出，這種憂慮並沒有根據，但他暗示貼現率可能被迫調高以緩和市場的憂慮。」隔天，股票市場重挫 91.55 點，除了葛林思班發表的評價以外，似乎沒有其他立即的理由導致市場的暴跌。「道氏理論」在
    10 月 15 日發出賣出訊號，我想即使是最輕微的刺激，這位病人的心臟也可能因此停止跳動，於是我開始賣空。


