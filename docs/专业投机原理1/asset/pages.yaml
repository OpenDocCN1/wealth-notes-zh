- pgno: 309
  md: '賣我？你是說你要買進，你要我賣你500股IBM？」當然，客戶會不耐煩地說，「不，不，不，我要賣出！」


    John 的態度是正確的。當你買進「賣出選擇權」（put）時，你是做空。當你賣出「賣出選擇權」時，你是做多。「以市價幫我弄個10□12月份的S&P」，意思顯然不清楚。措詞必須明確，尤其是當你以市價下單的時候，務必清楚表達你的意思，也務必確定經紀人沒有誤解。


    # 守則4：一旦心存懷疑，立即出場！


    以另一個方式來說，評估自己的部位時，你持有的每一個多頭部位，今天都應該是個買進機會，你持有的每一個空頭部位，今天都應該是個賣出機會。換言之，如果你不俱備信心，絕對不應該建立部位。


    投入自己的資金，有些恐懼或憂慮，這是很自然的現象，並不代表每當你有些微懷疑時，便應該結束部位。然而，情況開始發生變化而勝算不斷減少，懷疑與不確定感始終環繞在你的心頭，則應該結束部位。


    這項交易法則還有另外一層意義。恐懼與有根據的懷疑，兩者之間存在明顯的界線。這聽起來或許有些令人混淆，但如果每建立交易部位，你便心存不確定感與懷疑，則你應該離開市場！如果你對於交易不俱備信心——至少在大多數時候——你根本不適合從事交易。習慣性的恐懼與懷疑，將嚴重傷害你的生理、情緒與財務狀況。這沒有什麼值得羞恥之處；這只是一種不適合交易的個性。'
  merge: -1
  img_proc: true
- pgno: 310
  md: '避免產生懷疑的最佳方法，是儘可能掌握所有的相關資訊。某些情況下，這甚至還不夠。


    我曾經聽過一段故事，一位大富翁與一位公司併購的分析師相互配合，兩個人的合作一向都很順利。有一次，分析師提出幾支可能可以買進的股票，其中包括Northwest
    Airlines 與 Cessna 在內，它們都是當時的潛在併購股票。某天，這位富翁接到分析師的電話，他說，「我剛接到消息，已經開始發動了。買進飛機。」


    這位富翁於是以每股60美元的價格買進40萬股的「西北航空」，總金額是2,400萬美元。隔天，股價跌至59美元，接著又跌至58美元。於是，富翁打電話給分析師。


    > 「怎麼回事，你不是說這筆交易已經發動了嗎？」


    分析師當時很忙，「是的，是的，還在進行中…沒問題…一定漲，」然後便把電話掛斷了。


    隔了兩天，股價跌至55美元，富翁又打電話。這次分析師並不忙。


    富翁問道，「什麼時候會宣佈？」


    > 「後天。」


    「什麼價格？」富翁也些困惑。


    > 「市價以上。」'
