- pgno: 331
  md: '學習的對象畢竟不是我們是否失敗，而是我們何以失敗，並如何根據失敗改進，汲取我們過去不會運用的知識。就某種微妙的層次來說，失敗即是勝利。


    > ——Richard Bach


    你拿起這本書時，很可能希望它可以幫助你在金融市場中賺錢——這是值得追求的目標。事實上，本書的宗旨在協助你達成真正的成功，而不僅是賺錢而已，因為達成經濟目標與成功的人生，兩者之間存在相當大的差異。根據多年來在「華爾街」的經驗，我看過太多人為了追求財富犧牲了他們的生活。以下這段寓言可以表達我的論點。


    # 一位交易員的夢境


    從前有一位富有而著名的交易員。他一生都致力於成為全世界最棒的交易員，並且賺很多錢。他實現了這項目標，現在他已經擁有一輩子都花不完的財富。他發言的時候，整個金融界都會肅然傾聽。然而，他卻陷入困境之中。不論睡眠多麼充分，他早晨起床時，始終覺得全身僵硬。工作的時候，他已經不再具有以往的精力與熱忱——他所有的努力似乎都毫無意義。一生中，他首次覺得無助與失控。


    某天，他覺得疲憊而全身乏力，勉強來到辦公室，當他坐在桌子前，卻完全沒有打開報價機的慾望。於是，他慢慢站起'
  merge: -1
  img_proc: true
- pgno: 332
  md: '來，打開窗戶，心想新鮮的空氣或許有所幫助。可是，窗外的空氣充滿濕氣與霉味。他甚至懶得日關上窗戶，便倒在躺椅上，心裡琢磨著：「我究竟是怎麼回事？我已經擁有一切。我應該很快樂才對。」在混亂的思緒中…他又睡著了。


    他跌入一個四無邊際的黑洞裡，覺得黑漆漆的虛空將他往下吸，突然一股冷流將他往上帶，於是他漂浮在太空中。在遙遠的地方出現一個小光點，他開始在虛空中掙扎，試圖朝光點前進。逐漸地，光點慢慢變大；最後，它已經不是一個光點了，而是通往一座桃花心木大門的明亮走道。在一種迫切的衝動驅使下，這位交易員加快自己的動作，覺得門後隱藏著某些重要的事物。在陰冷的虛空中仍然滿身大汗，他終於踏上堅實的走道，並舉步走向那座大門。


    他的腳步聲迴響在空洞的走道，四周籠罩在不知來自何處的明亮光華中。大門隱約可見，但隨著距離的縮短而愈來愈清晰。他看見大門上掛著一面銅牌，但還看不清楚寫些什麼。他加快自己的腳步，終於可以看見銅牌上的刻字。上面寫道：


    如果你在尋找問題，請進。


    如果你在尋求解答，請進。


    他走到大門前，這座大門較他六呎的身高至少還高出兩倍。他扭轉門把推動時，大門很輕易地滑開，當它靠上內壁，上方落下不少灰塵。稍微猶豫之後，他便踏進了大門。


    他處身在他最早使用的辦公室中，這是由一座倉庫改裝而'
