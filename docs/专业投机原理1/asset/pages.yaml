  md: '# 第一章

    由賭徒到市場宗師：

    一位專業投機者的歷程


    人們稱我為交易者，但這本書主要是為投機者與投資者而寫——如果你瞭解這三項名詞的差異，可以發現其中的矛盾。所以，首先讓我做一件政客永遠不會做的事：界定我的用詞。任何市場同時都存在三種價格的趨勢：短期趨勢，它可能持續數天至數個星期；中期趨勢，它可能持續數個星期至數個月；長期趨勢，它可能持續數個月至數年。在市場中，存在三種基本類型的參與者：交易者、投機者與投資者。


    交易者的活動主要集中在盤中交易或/與短期趨勢。他們買賣股票、債券、商品、或任何交易工具時間架構都在數分鐘至數星期之內。投機者專注於中期趨勢，他們建立市場部位，並持有
    Airways? 一段大約數個星期至數個月的時間。投資者主要是考慮長期趨勢，持有的部位可以長達數個月至數年之久。


    進一步討論前，我希望表明我的立場，當我提及投機者（specculator）時，我沒有任何貶損的意思。當我使用這項名詞時，它僅代表上述說明的意味：主要是參與中期趨勢的市場玩家。根據我個人的看法，投機行為（speculation）經常被賦與一種負面的意涵。一般來說，投機者被視為是炒作股票、房'
  merge: -1
  img_proc: true
- pgno: 26
  md: '地產或其他交易工具的人。然而，事實上，所有市場的投機者都是根據中期的價格趨勢，而希望透過買、賣行為獲利。投機者可以為市場提供不可或缺的流動性（liquidity），在大大多數情況下，也可以促進金融資產的平順移轉，並透過資產配置讓它們發揮最佳的功能。本書其他部分還會進一步區分投機者與其他市場參與者之間的差別。


    在我的職業生涯中，我大體是扮演投機者的角色，但這並不是我扮演的唯一角色，因為我會參與所有三種趨勢。在我所進行的每筆交易中，我都熟悉相關知識，所以我應該可以被稱為：一位願意投資的投機性交易者。因為缺乏更適當的名詞，所以我選用「交易者」這個頭銜。


    以我處理金融市場的方法來說，這三種行為都有相互重疊之處；換言之，投機行為的原理，經過適當的調整之後，它們也適用於交易與投資。如果你瞭解投機行為，你可以相當容易地轉換為交易者或投資者的角色。更重要地，就近十年來市場呈現的劇烈價格波動而言，我堅決相信，任何買、賣行為如果不瞭解進、出市場的重要性，或不根據中期趨勢調整投資組合的結構，都是相當愚蠢的態度。這便是我決定將本書主題鎖定在投機行為上的理由。


    本書內容是根據我對於投機藝術的瞭解，並摘選其中精義構成。此處所謂的藝術是就一般的意義而言，並不是指真正的藝術（fine art）。然而，猶如每一位畫家都有其獨特的表達方式，每位投機者也有獨特的市場風格。雖說如此，但每一位真正成功的市場玩家都必須運用一套類似的工具：根據一套有效'
  merge: -1
  img_proc: true
- pgno: 27
  md: '性始終不變的根本理念與知識擬定決策。由我的知識中，包括我對於其他投機者的觀察在內，我將抽取最根本的精義提供給你。


    我的投機方法，整合各方面知識，包括：勝算、市場與其交易工具、技術分析、統計機率、經濟學、政治學、人類心理學、以及哲學。我花費了 10 年時間（1966 年至
    1976 年）取得相關知識，並將它們組織為有系統的格式。在 1974 年之前，我是根據普通常識、技術分析、以及謹慎的風險管理交易。之後，我學習如何由宏觀的角度交易。如果金融交易有一個最致命的缺失，那便是根據單一的事件擬定投資或交易的決策——在不瞭解整體風險的情況下投入資金。若希望瞭解整體的風險，僅有一種方法：透過系統性的知識。


    講解我的方法與知識前，讓我概略說明我的交易生涯，並解釋一些關鍵的發展，它們引導我逐漸形成投機的知識。在 1966 年至 1977 年之間的 11 年，就像我的學徒期間（很長的學徒期間），經過這段訓練後，我掌握一個畢生難逢的良機：在
    1978 年 3 月至 1986 年 9 月間，我透過 Interstate Securities 成為一位獨立作業的承包人。在這段期間內，我交易股票、債券、期貨（包括：商品與指數）以及各種選擇權，我每年平均收入
    60 萬美元，其中包括我個人的帳戶，以及在「50-50 盈/虧均攤」的基礎上與 Interstate 和少數其他金融機構合作。我覺得我已經發現畢生追求的自由。


    # 對於自由的渴望'
  merge: -1
  img_proc: true
- pgno: 28
  md: '就我來說，自由（freedom）不僅僅代表政治上的自由（liberty）；它代表一種根據自己理想與希望過活的能力，這需要一種全然獨立的經濟條件，而唯有赤裸裸地搶劫或自身的愚蠢才可能喪失的狀況。即使是在十歲出頭時，我的心目中，送報或送貨的工作便相當於是奴隸的生活——太多外來的控制。所以，我便以自己較能夠控制的方式賺錢：賭博。


    我並不是從事實際的賭博；我是投機。賭博必須承擔不利勝算的風險，例如：彩券或吃角子老虎。投機是在掌握有利勝算的情況下才承擔風險。投機的藝術包括許多能力：精確地解釋當時的狀況；掌握勝算；知道如何下賭注，即使是在輸的情況下，你仍能夠參與下一盤賭局；俱備心理的紀律，執行客觀的知識，而不是由情緒主導決策。


    對我來說，「賭博」從來不是一種高風險的行為。我開始學習撲克時，我閱讀所有相關書籍，並發現輸贏的關鍵是取決於如何管理勝算；換言之，當你持有的牌可以掌握勝算時便跟進，否則便蓋牌，如此你便居於贏方。所以，我記憶每一種牌型的勝算機率，並依此決定對策。這便是風險管理方法的精義所在，雖然我當時並不瞭解這點。


    我曾經閱讀一本John Scarne寫的書①，它間接改變了我的一生。他談論許多欺騙的行為，並解釋作弊的手法。我瞭解，如果希望精通撲克，我必須學習如何識破作弊的手法。研究這項新知識時，我發現一家魔術牌戲的專賣店Lou
    Tannen’s Magic Shop 。在那裡，我認識一位影響我一生的人Harry Lorayne 。'
