- pgno: 440
  md: '應該是生命的重點。


    對許多人來說，災難與痛苦是生命的重點。這並不是說他們會深入思考痛苦與災難。某些人確實會如此，但一般都是情不自禁地專注於痛苦。他們花費的時間與精力不是用來追求價值，而是用來避免痛苦。這使痛苦成為生命的重點。


    你不能追求負面的東西。根據定義，如果避免痛苦成為生命的重點，積極的行動便受到局限。如果你允許痛苦成為生命的主導力量，將破壞自己的思考與成長的能力。你或許會躲入表面上安全的沉悶生活裡，或是追求榮耀，但兩者都使你無法享受生命過程中原本存在的熱情。


    生命中原本充滿風險。你的每一個行動，每一項抉擇，其中都有錯誤與失敗的可能。我對於這一切的體會可能較深，因為我的生活必須以客觀的方式控制市場的風險。如果你無法接受風險、失敗與痛苦是交易程序的一部份，你便不應該從事交易——否則你將發生虧損，或交易將是一種悲慘的活動。


    身為交易者，維持心智平衡最根本的條件，是建立自己擁有信心的部位，而且必須瞭解你的工作、思想與接受風險的意願，都可能不會帶來報酬。更重要者，失敗時，你必須願意繼續。你必須願意接受痛苦，因為誠實與成長經常都伴隨著它。


    生命中的每一個層面都是如此。


    許多人經常喜歡使用「愛」這個字眼，這使我在使用它時覺得相當猶豫。然而，生命中的每一項行動都應該出自於愛，它的精義是自我的施捨（giving of yourself）。讓我說清楚，'
  merge: -1
  img_proc: true
- pgno: 441
  md: '我並不是說無私或犧牲的施捨，不是 Bour不期待回報的施捨（我認爲這是不可能的），而是在施捨中知道自己可能無法得到報酬，並且在你沒有得到報酬時，你還能再度施捨。


    我所謂的施捨是指貢獻與給予。將自己貢獻給世界；在交易中提供你的產品與服務；貢獻你的成就、生產力、精力、思想與觀念：所有這一切都將在精神上與物質上豐富人的生命。


    以這種方式施捨，你的報酬將數以倍計——不論是以金錢衡量，或是以經驗的快樂來表示。這不是「給予與取得」，不是「給予而汝將得到」；這是「在交易中給予與取得」。


    你可以運用你的心智施捨自己——讓自己致力於學習與成長——並因此取得新的機會與經驗。透過自己的行爲與努力，你可以讓自己擁有新的抉擇與可行性。你可以讓自己在市場上承擔風險，並取得財務上的效益。你可以開放自己而施捨給他人，讓人們瞭解真正的你，丟棄那原本防範他人傷害或拒絕你的保護盾牌，你將因此獲得特殊的友誼回報，以及反映你靈魂的真正知己。


    開放自己而承受生命的風險，這或許令人害怕，但實際上你別無其他選擇。人生難免受苦。


    你沒有逃避風險的自由。你沒有免於恐懼的自由。你沒有規避痛苦的自由。你沒有不承受失敗可能性的自由。然而，你有自由接受這一切爲你生命的一部份，而且是最不重要的一部份。


    這並不是說風險、恐懼、痛苦與失敗都不重要。本書的第'
  merge: -1
  img_proc: true
- pgno: 442
  md: 'I篇完全用來說明如何侷限市場的風險，並盡可能掌握有利的勝算。第II篇，我以相當的篇幅說明如何管理逃避痛苦的慾望，並有效地運用這個慾望。是的，它們都很重要，但問題是如何看待它們的重要性——它們的地位與整合。


    追尋個人的自由，並不是說你可以不計後果，而隨心所欲地做你想做的事。這並不是說生命可以免除痛苦、錯誤與失敗。這也不是說「吞噬你的情緒」而假裝它們不存在。


    追尋個人的自由，意味著能夠全然地施捨給你自己、工作與他人。這意味著能夠建立真正的動機，控制自己的機能，例如：避免痛苦的需求與追求快樂的慾望，並指向相同的目標。然而，最重要者，這意味著學習享有生命過程中的愉悅。


    在你追求個人自由的過程中，我希望本書能夠協助你。


    祝你幸運，交易順利！'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# 術語一覧表


    A


    騰落線（advance/decline line） 衡量市場走勢的一種指標，它由證券價格的上漲家數（某天股價上漲的家數）與下跌家數（某天股價下跌的家數）差值累積而成。


    alpha 衡量素質的指標，以比較個股相對於大盤的績效。假定某支股票的alpha 值為1，代表這支股票的績效平均每個 Calder 優於大盤1%。所以，如果大盤在六個月上漲10%，則該股票將上漲17.8%。


    套利（arbitrage） 1.根據暫時性的價格差異，同時買、賣兩種可以互換的證券，例如：兩支合併的個股。2.在某一個市場買進證券或商品，同時在另一個市場賣出相關的交易工
    具，試圖賺取短期的價差利潤。


    賣出報價（ask） 交易所以內，商品或個別股票當時的最低賣出價格。


    平價（at-the-money） 在選擇權中，根本交易工具的價格恰好等於選擇權的履約價格。（參考：折價、溢價與選擇權。）'
  merge: -1
  img_proc: true
- pgno: 444
  md: 'B


    空頭（bear）　對於市場長期趨勢持悲觀看法的人；換言之，認爲市場已經或即將進入長期下跌趨勢的人。


    空頭市場（bear market）任何市場（尤其是股票市場）的長期下降趨勢（趨勢持續數個月至數年），其中夾雜著愈來愈低的中期（涵蓋的期間爲數個星期至數個月）低點與高點。


    beta　它是衡量價格的波動程度。如果某支股票的beta值爲2，大盤上漲10％或下跌10％時，這支股票應該分別上漲20％或下跌20％。


    買進報價（bid）　表示投資者、交易者或交易商願意以某價格買進證券或商品；另外，它也代表商品或個別股票當時最高的買進價格。


    買賣報價（bid and ask）　任何商品或個股在交易所當時的報價。買進報價是當時市場上所願意買進的最高價位。賣出報價是是當時市場上願意賣出的最低價位。


    大額交易（block）　相當大量的特定股票，通常爲1萬股或以上。


    藍籌股（blue chip）　某產業內的領導普通股，例如：IBM，其產品與服務被廣泛認可，盈餘績效在任何經濟環境下都有一定程度的表現。


    債券殖利率（bond yield）　將債券的票息表示爲價格的百分率。'
  merge: -1
  img_proc: true
- pgno: 445
  md: '底部（bottom） 市場價格走勢在反轉向上之前的最低價位。


    帳面價值（book value） 衡量普通股的每股淨值。以公司總淨值減去無形資產與優先股，再除以普通股在外流通的股數。


    向下突破（break） 一種向下的價格走勢，它突破先前的重要的低點，並持續向下。通常是指價格走勢經過相當期間的狹幅盤整後，向下突破。


    向上突破（breakout） 一種向上的價格走勢，它突破先前的重要的高點，並持續向上。它通常是指價格走勢經過相當期間的狹幅盤整後，向上突破。


    經紀費用（brokerage） 登記有案的證券商或商品經紀商在執行交易指令時收取的費用，又稱佣金。


    多頭（bull） 對於市場長期趨勢持樂觀看法的人；換言之，認為市場已經或即將進入長期上漲趨勢的人。


    多頭市場（bull market） 任何市場（尤其是股票市場）的長期上升趨勢（趨勢持續數個月至數年），其中夾雜著愈來愈高的中期（涵蓋的期間為數個星期至數個月）低點與高點。


    C


    買進選擇權（call） 一種選擇權的契約，持有者有權在特定時間內，以既定價格買進特定數量的股票、債券與商品。'
  merge: -1
  img_proc: true
- pgno: 446
  md: '資本（capital） 用於生產所得的累積資金或產品。


    car 市場中的慣用語，是指一口的商品契約。


    佣金（commission） 登記有案的證券商或商品經紀商在執行股票、債券、商品或選擇權等買、賣交易指令時收取的費用。


    商品（commodity） 在現貨或期貨市場所交易的大宗商品，例如：金屬、穀物、肉類…。一般來說，商品是指期貨市場的商品而言，包括股票指數在內。


    整理（consolidation） 是指證券或商品價格在一段相當期間中處於狹幅的區間內。就技術分析上來說，整理期間通常是指某金融交易工具在此期間內，呈現大規模的進貨或出貨，所以在整理期間之後通常會出現強勁的價格走勢。


    契約（contract） 商品市場的交易單位；契約的大小在不同的市場各自不同。


    修正（correction） 一種與長期趨勢或主要趨勢（涵蓋數個月至數年的時間）相反的中期價格走勢（涵蓋數週至數個月的時間）。一般來說，中期走勢的折返幅度為主要走勢在在折返前的三分之一至三分之二。


    D


    當日沖銷（day trade） 一筆交易部位由建立到了結都發生在同一天之內。'
  merge: -1
  img_proc: true
- pgno: 447
  md: '交割（delivery） 期貨契約結算時，以擁有或控制的商品交換現金。


    需求（demand） 在市場中，取得某種產品或服務的意願或慾望。


    股息（dividend） 公司以現金、股票或資產等方式分配給股東的盈餘。股息由董事會決定。


    重貼現率（discount rate） 會員銀行向「聯邦準備區域銀行」直接借款所適用的利率。


    道瓊工業指數（Dow Jones Industrial Average） 這是美國股票市場最廣被使用的股價指數之一，它是由30支工業類股構成。


    道瓊運輸指數（Dow Jones Transportation Average） 這是美國股票市場最廣被使用的股價指數之一，它是由20支運輸類股構成。


    # E


    盈餘（earnings） 普通股擁有的公司淨所得，除以在外流通股數，大多數公司都是每季公佈一次（又稱爲每股盈餘）。


    效率市場理論（efficient markets theory） 對於市場的一種觀點，它認爲市場價格會反映所有已知相關資訊。換言之，市場對於新資訊的反應將在瞬間完成。'
  merge: -1
  img_proc: true
- pgno: 448
  md: '交易所（exchange） 有組織的交易場所，其會員經紀商與交易員在此交易商品、期貨、證券等交易工具。


    履約（exercise） 履行選擇權或認股權證賦予的權利。例如，普通股買進選擇權的持有者有權利根據契約上的價格買進 100 股普通股。


    到期日（expiration date） 選擇權契約上規定的特定日期，選擇權在此日期之後將沒有價值，所有者不再享有契約上所載的權利。


    # F


    聯邦準備理事會（Federal Reserve Board） 由美國總統任命的七人小組，負責擬定美國的貨幣政策，並監督「聯邦準備系統」的運作。


    聯邦準備系統（Federal Reserve System；The Fed） 美國的中央銀行系統，主要構成份子有「聯邦準備理事會」、「聯邦公開市場操作委員會」、九個「準備區域銀行」與會員銀行。主要責任是規範貨幣與信用的流量。


    聯邦基金（Federal Funds） 銀行與某些金融機構擁有的超額準備金。這些資金可供其他銀行借取以做為法定準備金。


    聯邦基金利率（Federal Funds Rate） 金融機構相互借貸聯邦基金適用的利率。這項利率主要是受到 Fed 短期公開市場操作的控制。'
  merge: -1
  img_proc: true
- pgno: 449
  md: '明確報價（ firm quote ） 金融交易工具所實際可以買、賣的價格。


    場內交易員（ floor trader ） 交易所的會員，他在交易所內爲自己的帳戶進行交易。


    聯邦公開市場委員會（ The Federal Open Market Committee ； FOMC ） 它是「聯邦準備系統」的一個委員會，總共由12個成員構成，包括：「聯邦準備理事會」的七個成員、「紐約聯邦準備銀行」的總裁、以及八個區域銀行中的四位總裁，後者是以輪流方式擔任。委員會主要任務是擬定公開市場操作的決策。


    自由準備金（ free reserves ） 是指整體「聯邦準備系統」持有超過法定準備的準備金。這可以代表「聯邦準備系統」存在的信用擴張潛能。


    基本分析（ fundamental analysis ） 一種分析證券的方法，研究整體經濟與產業的狀況，以及個別公司的財務與管理狀況，並藉此評估特定公司的價值。


    期貨（ futures ） 在未來買賣商品的標準化契約。


    期貨契約（ futures contract ） 在未來某特定時間，於某特定地點，交割某特定類型與等級商品的標準化契約，而且它是在交易所內交易。期貨契約是一種可以轉讓的契約。'
  merge: -1
  img_proc: true
- pgno: 450
  md: '績優熱門股（glamour stock） 交易熱絡的股票，通常是指績優股而言。


    成長型股票（growth stock） 一種投機性相對較高的股票類型，一般是指成立不久的公司，預期的成長相當快速。這類股票的股息通常很低，本益比很高。


    # H


    避險（hedge） 降低既有商品或證券部位的一種投資行為，通常是建立與既有部位相反的部位。例如，某人在100美元的價位持有1萬股XYZ股票，他可以買進履約價格爲98美元的100□XYZ賣出選擇權。


    高價（high） 在特定期間內，商品或證券的最高交易價格。


    # I


    通貨膨脹（inflation） 增加貨幣供給量。貨幣供給增加的數量超過產品與服務的供給增加數量，物價水準將上升。


    內線（insider） 某人擁有一般大眾不知道的資訊，這項資訊可能在未來影響股票的價格。


    折價（in-the-money） 具有內含價值的選擇權。對於買進選擇權而言，這是指根本交易工具的市場價格高於買進選擇權的履約價格。對於賣出選擇權而言，這是指根本交易工具的'
  merge: -1
  img_proc: true
- pgno: 451
  md: '市場價格低於買進選擇權的履約價格。


    指數期貨（index futures） 以現貨市場指數做爲根本交易工具的期貨契約。這與商品期貨不同，它並無有形資產可供交割，而是以契約到期時期貨契約的現貨價值來交割。


    中期趨勢（intermediate-term trend） 在任何市場中，持續時間長達數週至數個月的價格走勢。


    投資者（investor） 一種市場參與者，他買進證券而持有相當長的期間（數個月至數年），目的通常是取得收益或資本利得。


    # J


    垃圾債券（junk bonds） 這是泛指擴張信用併購時，公司發行的債券，目的在於籌措資金以買進足以控制被併購公司的股票。垃圾債券與一般公司債的差別在於債券的發行數量與發行目的。這類債券之所以被稱爲「垃圾」，是由於這類債券在發行後不久，其市場價值便大幅下，因爲擔保債券發行之根本資產的市場價格下跌。這類債券並沒有其他的抵押擔保。


    # L


    槓桿效果，擴張信用（leverage） 借取資金交易或投資，增加潛在的淨報酬。


    擴張信用的併購（leveraged buyout） 向大眾或私人來源籌措資金，購買足以控制某公司的股份，資金的籌措方法是以'
  merge: -1
  img_proc: true
- pgno: 452
  md: '該公司的資產做爲抵押，以發行或銷售債券（垃圾債券）。


    負債（liabilities） 必須支付個人或法人的債務或法定清償義務。


    狹幅盤整（line） 技術分析的名詞，形容市場價格走勢在某期間內，在狹幅的區間（通常不超過5％）整理。


    做多（long） 擁有證券或商品，而預期其價值或價格將上漲。


    長期趨勢（long-term trend） 一般性的價格上漲或下跌走勢，持續的時間長達數個月至數年。


    低價（low） 在特定期間內，商品或證券的最低交易價格。


    M


    主要市場指數（Major Market Index；MMI） 是20種成份股的股價指數，用以追蹤與輔助30種的「道瓊工業指數」。MMI 是由是由15道瓊成份股與另5支「紐約證券交易所」（NYSE）的掛牌交易股票構成。


    操縱（manipulation） 某些情況下，這是「證券交易委員會」禁止的證券交易行為。操縱是指以有技巧的方式（有時候是不合法的方式）影響市場價格。


    保證金（margin） 在保證金帳戶內，淨值（現金）佔總'
  merge: -1
  img_proc: true
- pgno: 453
  md: '市場價值的比率。


    O


    賣出報價（offer） 表示投資者、交易者或交易商願意以某價格賣出證券或商品；另外，它也代表商品或個別股票當時最低的賣出價格。


    公開市場操作（open market operation） 「聯邦公開市場委員會」買、賣政府或政府機構的證券，目的在於增加或減少銀行準備金，以控制貨幣供給。


    選舉權（option） 在一期間內，根據特定的價格買進（買進選擇權）或賣出（賣出選擇權）特定數量證券（股票、債券、期貨…）的權利。


    溢價（out-the-money） 不具有內含價值的選擇權。對於買進選擇權而言，這是指根本交易工具的市場價格低於買進選擇權的履約價格。對於賣出選擇權而言，這是指根本交易工具的市場價格高於買進選擇權的履約價格。


    超買（overbought） 技術分析的術語，這是指市場的買進力道超過基本面支持的合理程度。


    超賣（oversold） 技術分析的術語，指市場的賣出力道超過基本面支持的合理程度。


    店頭市場（over the counter market；OTC market） 股票的交易市場，其中的股票並未在主要的交易所掛牌。'
  merge: -1
  img_proc: true
- pgno: 454
  md: '# P


    權利金（premium） 選擇權的市場價格，它取決於時間的長短、根本交易工具的價格與波動率高低。


    本益比（price/earnings ratio ，PE ratio） 股票當時的價格，除以每股盈餘。


    程式交易（program trading） 透過電子方法（通常是電腦）以執行預定程序的交易策略。


    賣出選擇權（put） 一種選擇權的契約，持有者有權利在特定的時間內，以既定價格賣出特定數量的股票、債券與商品。


    # Q


    報價（quote）   交易所以對於其交易證券提供的當時買、賣價格。


    # R


    區間（range）  在某期間之內，特定證券或商品的價格高、低界限。


    折返（reaction）  與當時趨勢相反的價格走勢。折返與次級修正不同，前者可以發生在短期趨勢、中期趨勢或長期趨勢之內，後者則是在長期趨勢內的中期折返走勢。'
  merge: -1
  img_proc: true
- pgno: 455
  md: '壓力（resistance）    任何價格水準被市場視為是重要高價。價格向上接近此水準時，價格走勢經常會趨緩或折返，價格向上突破時，通常會出現大幅的走勢。


    # S


    次級折返（secondary correction）  在股票市場，這是與主要（長期）趨勢相反的中期價格走勢，通常在至少14天內出現最低5％的折返。


    做空（short）  在擁有證券或期貨契約以前便賣出。持有空頭部位的人，如果不回補，則有履行交割的義務。


    短期趨勢（short-term trend）  涵蓋期間在數天至數週的價格趨勢。


    史坦普期貨（S&P futures）  位於芝加哥的期貨交易所，期貨契約的交易是根據史坦普500現貨指數。


    投機者（speculator）  一種市場參與者，他買、賣金融交易工具是試圖由中期（數個星期至數個月）價格變動中獲利。


    停損單（stop order）  這是一種交易指令，市場價格觸及或超過停損單上設定的價格時，停損單將成為市價單。


    跨形價差交易（straddle）  這是由一對買進選擇權與賣出選擇權構成的價差交易部位，兩個選擇權的根本交易工具、履約價格與到期日都相同。'
  merge: -1
  img_proc: true
- pgno: 456
  md: '履約價格（strike price） 選擇權契約上設定的價格，持有者執行選擇權時，可以根據此價格買進或賣出根本交易工具。


    支撐（support） 任何價格水準被市場視爲是重要的低價。價格向下接近此水準時，價格走勢經常會趨緩或折返，價格向下突破時，通常會出現大幅的走勢。


    # T


    併購股（takeover stock） 任何涉及或被認爲涉及併購交易裁的股票。


    技術分析（technical analysis） 一種預測行情的方法，完全仰賴過去的價格與成交量的行爲，預測未來的價格走勢。


    檔（tick） 交易所允許的最小價格跳動單位（股票爲1/8、股票選擇權爲1/16…）。


    頭部（top） 任何市場在特定期間內的高價（例如：盤中的頭部、每週的頭部與長期的頭部）。


    # V


    成交量（volume） 在某期間內，所有權發生變化的股票股數或商品契約口數。'
