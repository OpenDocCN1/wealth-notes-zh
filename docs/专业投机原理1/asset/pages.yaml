- pgno: 321
  md: '息。幫助朋友當然是一種可貴的感情，但如果你有朋友從事交易，你們僅該就一般的看法交換意見。如果すること。

    如果你真希望幫助朋友，務必不要提供建議；你的朋友也有大腦——讓他或她用自己的大腦。


    這項交易守則希望傳達的概念是：沒有任何東西可以替代個人的判斷。如果你沒有信心根據自己的判斷交易，不要交易。順勢交易，而不是順著朋友的意見


    # 守則15：永遠得分析自己的錯誤。


    虧損的交易未必代表錯誤，錯誤也未必導致虧損。一筆絕佳的交易可能發生虧損；另一方面，即使犯錯，你仍然可能獲利。如果你遵循交易法則而發生虧損，就放棄它；不需要再做分析。你可以對自己說道，「好吧！」然後再繼續下一筆交易。可是，如果過早了結一個部位，隨後眼見原本屬於你的獲利滾滾而入，你便該想想自己到底犯了什麼錯誤。


    何以需要分析自己的錯誤呢？因為錯誤與失敗是最好的導師；它們讓你更加明白，你必須永遠遵循交易守則。如果你可以真心反省發生錯誤的理由，重踏覆轍的可能性便很低。


    一般來說，錯誤並不是源自於無知，而是恐懼：恐懼犯錯、恐懼遭到羞辱、以及其他等等。你若希望提昇自己的交易境界，則必須克服恐懼；若希望克服恐懼，首先必須承認你有恐懼感。本書第II篇，我會詳細討論這方面的問題。


    # 守則16：務必提防「錯誤的併購消息」（takeunders）。'
