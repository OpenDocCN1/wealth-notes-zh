- pgno: 287
  md: '險。


    行情下跌時，花旗銀行、川普（Trumps）、或任何仰賴持續性通貨膨脹而以資產高度信用擴張的個體，都免不了價值下挫或失敗的命運。


    現在，讓我們考慮「買進並持有價值」的概念。這種觀點必須面對一項事實——唯有市場才可以判斷價值。例如，IBM 是「價值」的典型代表。然而，如果你在1983 年1
    月或以後買進這支「藍籌股中的藍籌股」，並持有至1989 年11 月份，你將發生虧損，這段期間是本世紀股票市場的第三大多頭市場！為什麼要「持有價值」而投資下跌中的股票呢？為什麼在你賺錢的時候而忍受這些痛苦呢？


    金融市場每一種傳統方法，都不能解答一個單純而根本的問題：「市場維持目前趨勢的勝算有多少？」換言之，目前做多或賣空的風險如何？Alpha、Beta、價值、本益比、殖利率、帳面價值——這些指標都有的功能，但都是次要的考量，首要之務在於判斷市場趨勢的最可能方向。最重要的是建立一種衡量市場風險的標準。所以，你在股票市場做多或賣空時，如何衡量風險？


    # 衡量風險的革命性方法


    我花費多年時間思考這個問題。為了衡量某項事物，你首先必須建立一種標準的參考單位，然後才能透過比較來計算數量上的關係。在金融市場中，這是一個非常複雜的問題：你如何建立一種衡量風險的標準，判斷成功的機率，而且程序中不'
