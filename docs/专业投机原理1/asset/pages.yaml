  md: '該的暴君而根據真正的價值觀行動，這會導致情緒上的痛苦。在追求榮耀的過程中，形成的信念與聯想對你有至高的重要性，所以可能非常難以割捨。


    200萬年前，我們的祖先面臨危險的時候，他們的判斷必須正確，否則便是死亡。相反地，在金融交易中，錯誤是一種不可避免的成份。謬誤自尊造成的不願意承認錯誤，使大多數交易者無法成功。這種基本的心裡，破壞他們遵循交易守則的能力。


    不論身爲交易者或個人，你都有所抉擇。你可以讓追求榮耀的情緒主導你的行為，並忽略事實；或者，你可以認定必須透過學習才能成長，學習將來自於錯誤。你勢必會犯錯——你有時候會獲勝，有時候也會失敗。當你犯錯的時候，你需要分析錯誤，並因此改變自己的行為，如此才能成長。這種程序將不斷地增進你的技巧，並提昇自我的價值。以一致性的態度練習，將造成真正的自尊感，並由交易中獲得穩定的利潤。


    務必記住，你在挑戰謬誤的自尊，並捨棄所追求的榮耀時，其中不論涉及多麼嚴重的痛苦，都是必要的經歷，否則它們將剝奪你由真正的成長與成就中享有愉悅與寧靜。運用本章與先前章節提供的知識，你可以克服謬誤的自尊，並發現真正的自尊是來自於「既有潛能的實際化」（actualizing
    your given potentialities）。


