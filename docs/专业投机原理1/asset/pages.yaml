- pgno: 430
  md: '在需求完美的表面之下，基本上是一種不滿意與缺乏自我價值（self-esteem）的感覺。追求完美僅是一種盾牌，以防範心智認知這種基本上的不滿意。這些人僅要保持著完美的形象，並追求它，則他們便可以感受自身的價值，甚至於呈現優越感。他們自認為是人類中的少數優秀份子，願意做必要的犧牲而使「真正的」自我實際化。他們將別人的快樂都視為是「膚淺」或「虛假」。唯有他們，以及少數「理想的女人」或「理想的男人」（這些理想的人是他們希望而不曾遇見的人），才理解這類的榮耀。然而，在最根本之處，卻是缺乏真實的自我價值感，而這種感覺會以不同的方式浮出表面。


    在追求榮耀的所有動機中，我相信需求完美是最重要者，而它反映在應該的暴君中。真正而自我選擇的價值觀與目標被擱置一旁，他在潛意識中受到完美的需求所驅動，並採用一套內部指令的僵化系統，「它包括…〔他〕應該能夠做、能夠成為、能夠感覺、能夠知道——以及不應該的禁忌。」


    每個人都需要仰賴真正的價值與反價值系統，並以其做為行為的準則，但這與上述的僵化系統之間通常都有明顯的差異。所以，我們必須瞭解兩者之間的主要差異，以辨識真正而有益的價值觀與信念，以及追求完美所關連的應該或內部的指令。


    第一，「應該」或內部的指令，並未考慮其可行性。人們相信他們應該同時是完美的交易者、完美的丈夫（妻子）、完美的父親（母親）、完美的音樂家與完美的運動選手。他們應該可以輕而易舉地解決自身與他人的問題。'
