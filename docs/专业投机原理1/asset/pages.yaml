- pgno: 411
  md: '是否可以嘗試以往不敢嘗試的事物？這些改變將如何擴展至生命中的每個領域？你的人際關係是否將更圓滿？感受相關的變化，讓它們反映在生活的每一層面。秉持著這個信念，你對於自己在這五年來的表現覺得如何？再往前移動五年，並重覆上述程序。看看這十年來的變化！一切是否大不相同？體會生命層次呈現的提昇。現在，往前移20年，感受其中的生命變化與擴展！


    +   6. 觀察這兩種信念帶來的結果，決定你選擇何者。回到目前，感受新未來將呈現的興奮與無限的可能性。


    +   7. 坐下來，記錄每項新信念將如何提昇生命的意義。


    上述程序是在你的潛意識中建立新的聯想。它將所追求的積極改變，連結至快樂——而不是痛苦。


    幾乎所有侷限性信念，都可透過這種方法改變。至於效力的程度，取決於你如何進行這項程序，如何讓相關的痛苦與快樂生動地呈現出來。我提出這種方法的動機，是希望你嘗試並體會其中的潛能。我強烈建議你從事這項實驗，研究Anthony
    Robbins與其他人的著作，自己能夠進一步提昇改變的能力，控制自己的生命。


    # 關連設定


    每一天的每一個時刻，你的潛意識都不斷形成聯想，將人、事、物連結至快樂與痛苦。本章所有的內容，便是說明如'
  merge: -1
  img_proc: true
- pgno: 412
  md: '何控制這個程序，並以此導引自己的生活。我最近學習的一種方法尤其強而有力，它稱爲「關連設定」（anchoring）。


    關連設定是一種潛意識的心智程序，它將某種感覺刺激，連結至某種或某組情緒狀況。這是什麼意思？每當你處於相對強烈的情境中，任何顯著又重覆的外在刺激可以關連至你經驗的情緒。如果這種關連足夠強烈，每當這項外在刺激發生，便可實際引發所關連的情境。


    外在的刺激可以由五種感官構成。例如，你由車子的後視鏡看到後方出現閃爍的警燈時，這會引發何種情緒？大多數人會覺得很懊惱，不論你當時是否做錯了什麼，因爲你過去曾經在這種情況下被開罰單。


    某首歌或許可以喚起你心中某種感覺或記憶。假定你與高中時代的異性知己，在某種特殊的情況下曾經一起聽一首「你們的歌」。現在每當聽到這首歌的時候，你可能會想起她（他），以及當時共享的歡樂或痛苦情緒。你的配偶或密友可能有某種特殊的小動作或說話語調，可以喚起親蜜與溫馨的感覺。你聞到麵包香味時，你可能會出現饑餓的感覺，即使你一個鐘頭以前才吃過午餐。


    我先前曾經提到身體的儀式，它們便可以引發潛意識中設定的關連。你實際上可以設定關連，讓它引發你希望的情境。如果你希望工作可以專注，你可以發展出一種「感官刺激-設定關連」的聯想，讓它喚起你需要的情境。我再引用
    Anthony Robbins 提出的方法：'
  merge: -1
  img_proc: true
- pgno: 413
  md: "這基本上涉及兩個步驟。首先，將自己投入某種希望關連的情境。其次，處在這種情境的巔峰狀態時，你必須不斷提供某種特定的刺激。例如，某人大笑的時候，處於一種特定的情境中——整個身體當時都完全配合這種情境。這個時候，如果你以某種特定方式扭他的耳朵，並發出數聲特定的聲音，稍後再提供相同的刺激（扭耳朵與聲音），這個人又會開始大笑。④\n\
    \n關連設定（anchoring）的四個基本要素是：⑤\n\n+   1. 情境的強烈程度——設定一個有效而持續的關連，你需要處於強烈的情境中；整個身體與心智都應該涉入這個情境。關連設定的強度與經驗的情緒強度之間，存在直接的正向關係。\
    \ \n2. 設定的時機——引發情境的感官刺激（可以是聲音、景象、觸覺、味道、或其綜合）應該建立於情境的巔峰狀態。 \n3. 刺激的獨特性——應該選擇不尋常的刺激。如果你有摸下巴的習慣，便不宜做爲設定關連的誘發因子，因爲你可能無意中引發刺激，你的心智並不知道如何因應。這種情況下，刺激的鮮明程度會稀釋，設定關連也將無效。設定關連最理想的誘因應該由幾種獨特的感官知覺組合而成。\
    \ \n4. 刺激的重覆性——刺激必須可以重覆。例如，如果設"
  merge: -1
  img_proc: true
- pgno: 414
  md: '定關連是以某種語調說「我愛你」，你必須能以相同的語調說「我愛你」，如此才能引發相同的反應。


    在設定關連的程序中，通常必須重覆數次才能成功。數次以後應該測試。我認識一位年輕人，他與漂亮的年輕女孩對視時，總是沒辦法微笑。他並沒有害羞的感覺，就是沒辦法微笑。於是，他開始設定關連。


    某天，一位非常迷人的女孩對他微笑時，他發覺自己也發出微笑。因為他剛學習了關連設定的方法，並認為這是理想的機會。當時的感受正是他希望的感覺，而微笑正是他希望的反應，於是他觸摸左耳垂上方的耳骨。現在，每當他以相同方式觸摸左耳時，便會露出一臉友善的微笑。


    改變心智時，我建議你採用關連設定做為輔助性的工具。這是一種非常有效的方法，因為它直接以潛意識為對象。它可以根據你的需要管理你的情緒。工作的時候，它可以協助你保持專注；疲倦的時候，它可以讓你精力充沛；沮喪的時候，它可以讓你興奮；演講的時候，它可以讓你覺得自信而熱忱。


    它何以有效？我實在不知道。在「小飛象」的故事中，一隻大耳的小象認為，只要它持有「神奇的羽毛」便可以隨意在天上飛翔。當然，羽毛實際上沒有任何的魔力；這只是一種心理的憑藉而已。關連設定或許僅是另一隻神奇的羽毛。然而，這又怎麼樣？它確實有效！


