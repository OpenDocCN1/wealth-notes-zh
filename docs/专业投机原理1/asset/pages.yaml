- pgno: 315
  md: '走勢總是快於上漲。


    守則.9：在多頭市場的初期階段，應該扮演投資者的角色。在多頭市場的後期與空頭市場中，應該扮演投機者的角色。


    投資者是追求長期的報酬與/或資本的所得流量。投資者主要是關心盈餘、股息與淨值的上升。


    另一方面，投機者主要是關心價格走勢，以及如何根據價格走勢獲利。由風險/報酬的觀點來看，投資最適當的時機是在多頭市場的初級階段，因為不論由任何的基本角度觀察，成長的機會都最理想。


    行情逐漸趨於成熟，價格走勢進入第三、第四波…時，價格水準的考量將愈來愈重要，謹慎的玩家在心態上應該轉為投機。我在第十章曾經解釋，在信用擴張驅動的多頭市場中，當行情發展至某一階段以後，價值將停止增長，企業界以浮濫的資金追求有限的資源，價格將開始膨脹──資金行情。


    在空頭市場中，投機是唯一的明智之舉。根據定義，我們無法以做空來投資。在空頭市場中，長期做空是透過預先賣出投資而獲利，這項行為本身並不是投資。撇開這點不談，空頭行情最佳的運作方式是不斷地進、出現場，在主要走勢中做空，在次級修正走勢中做多。一般來說，空頭市場歷經的時間短於多頭市場；空頭市場的主要走勢在幅度上與多頭市場相當類似，但期間則較短。'
