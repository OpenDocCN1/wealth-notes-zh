- pgno: 286
  md: 'Alpha與Beta，再配合其他的相對性指標，例如：本益比、帳面價值與殖利率；而他們稱此為「風險評估」（risk evaluation）。然而，這些指標究竟與風險有什麼關係呢？它們是否可以顯示當前的經濟趨勢，或Fed政策變動的影響？它們是否可以充分反映整體市場發生劇烈變動的可能性？答案是：「很少！」


    我並不是說這些指標全無用處，我完全沒有這個意思。然而，如果以價值做為投機或投資的主要工具，它應該是一種客觀而靜態的概念。價值（value）蘊涵著評估價值（evaluation），這是由個人心智決定。某項東西的價值如何，完全由市場中的個人決定它的價值。價值是一種變幻莫測的東西。不妨以Penn
    Central為例觀察。


    1970年初，「價值線投資公司」（Value Line Investment Service）評估Penn Central每股的「價值」（worth）為110美元（以該公司的資產衡量），當時的股價74美元處於「價值低估」（undervalue）狀態。根據這項衡量標準，股價應該大漲。然而，它下跌至每股2美元！分析家以該公司持有的資產來評估其價值，但他們顯然沒有考慮經濟衰退會使資產價值下降。他們假定市場衡量價值的標準將保持不變。


    以最近的例子來說，1990年6月，某些分析家認為花旗銀行的股價24.5美元處於低估狀態。我最近所查看的價格為14美元。他們假定花旗銀行的規模太大而不可能發生問題，經濟不會出現衰退，所以它先前的壞帳可以恢復為正常的應收放款。他們所有的結論都來自於上述的假定，而未考慮行情下跌的風'
