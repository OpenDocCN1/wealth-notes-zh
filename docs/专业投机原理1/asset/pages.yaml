  md: '# 第十七章


    # 追尋個人的自由


    本書最初，我曾經說過，自由（freedom）不僅僅代表政治上的自由（liberty）；它代表一種根據自己的理想與希望過活的能力，這需要一種全然獨立的經濟條件，唯有赤裸裸地搶劫或自身的愚蠢才可能喪失的狀況。事實上，它的涵意不僅如此而已。它意味著你可以不受經濟能力的限制，盡情享受人生的歡樂。然而，你在任何情況下都無需擔憂你自己與家人的生活時，更容易達成自由。


    我看著我的小女兒Janene 時，總是忍不住微笑。她身上散發出一種生命的狂喜，這是很少人所俱備的特質，我希望她一生都能夠維持這項氣質。以12 歲的年紀，她曾經寫了一首詩，其中一段即反映出這種生命狂喜的韻味：


    美好的事物很少時，不要專注於邪惡，


    這個世界無需完美便能得到我的熱愛。


    Ayn Rand 也以較精緻的手法表達幾乎相同的觀點，「價值而不是災難——才是目標，首要的考量，生命的動力。」Janene 的詩與 Rand 的評論都蘊涵著相同的精神：雖然人們與世界都不完美，雖然痛苦與災難確實存在，但它們並不是、也不'
