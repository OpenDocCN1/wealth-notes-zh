- pgno: 141
  md: '如果上述三種情況同時發生，相當於「道氏理論」對於趨勢變動的確認。②如果僅發生前兩種情況，代表可能的趨勢變動。在三種情況中，若出現兩種，則增加趨勢發生變動的或然率。三種情況同時產生，則界定所謂的趨勢變動。


    在走勢圖中觀察趨勢的變化，必須根據下列方式將先前的原則轉換為圖形的格式（參考圖7.5-7.7）：


    +   1. 繪製趨勢線。


    +   2. 在下降趨勢中，繪製一條水平的直線穿越目前的最低價，再繪製另一條水平的直線穿越前一波反彈的高點。


    +   3. 在上升趨勢中，繪製一條水平的直線穿越目前的最高價，再繪製另一條水平的直線穿越前一波回檔的低點。


    就上升趨勢來說。如果價格穿越趨勢線，在穿越的位置標示 。如果價格接近、接觸或稍微穿越該條對應目前高價的水平直線而未能突破，則在該點標示②。如果價格向下突破該條對應前一個回檔低點的水平直線，則在該點標示③。如果這三個情況出現兩者，則趨勢很可能會發生變化。如果三個情況全部出現，則趨勢已經發生變化，並最可能朝新的方向繼續發展。


    稍做練習，你便能夠以目測的方式判斷趨勢發生變動的準則，並以 1-2-3 思考：(1)突破趨勢線；(2)測試先前的高點或低'
  merge: -1
  img_proc: true
- pgno: 142
  md: '點；(3)向下跌破前一波回檔的低點或向上穿越前一波反彈的高點。1-2-3：趨勢已經發生變動了！


    當然，根據這些法則交易，未必有100％的效果——沒有任何方法具有絕對的效果。在流動性欠佳、對於消息面非常敏感、或高度投機的市場與個股中，特別容易出現突然的反轉（參考圖7.9）。假定你根據1-2-3準則或其他類似準則交易，而行情突然反轉，這稱為「捻耳光」（getting
    whipped或getting whipsawed；譯按：這是在價格波動甚為劇烈的行情中，當你買進之後，價格突然下跌，或當你賣空之後，價格突然上漲）。避免捻耳光或降低損失的最佳方法是遵循下列法則：


    +   1. 交易僅選擇流動性高的市場，並且歷史上甚少出現突然而大幅的反轉走勢。由圖形中觀察，流動性欠佳的市場經常出現成交量不大而價格劇烈波動的走勢。


    +   2. 在可能的範圍內，避開對於消息面非常敏感的市場，或對於政府貨幣與財政政策反應劇烈的市場。由圖形中觀察，這類市場經常出現「跳空缺口」（gaps）——價格出現突然而巨幅的變動，而中間的價格並未顯示③（圖7.9）。


    +   3. 唯有當你可以將出場點設定在先前的支撐或壓力價位，才可以建立交易部位。這種情況下，如果市場證明你的判斷錯誤，你可以迅速認賠。這類的出場點，如果事先已經遞入交易指令，稱為「停損」（stop
    losses）；如果僅是預先設定，而價格已經接近此價位時，才遞入交易指令，則稱為「心理停損」（men-'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'tal stop）（圖7.10）。（譯按：在譯文中，不論是獲利了結或認賠出場，這類的策略一律翻譯為「停損」；所以，停損代表：限制損失的擴大，或限制獲利的流失。）


    # 圖7.8


    1989年12月份商品指數期貨——流動性欠佳的範例。這是一份商品指數期貨的15分鐘走勢圖，它顯示成交量稀少、價格波動大、許多跳空缺口與沒有發生交易的期間。


