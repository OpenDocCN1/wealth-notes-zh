- pgno: 339
  md: '# 第十三章

    史波克症候群：

    理性與情緒之間的戰爭


    # 導論


    我的已故好友Frankie Joe稱金融交易活動爲一場戰爭。然而，戰場是在內心深處，戰爭的規模與性質則因人而異。


    我曾經見到交易員一動也不動地默默坐著，似平一切都在控制中，但他們的內心正在劇烈掙扎，無法了結一個明顯不利的部位。我曾經見過瘦骨如柴的交易員，揮動一座15磅重的時鐘，扔向兩英吋厚的實木牆壁，撼動兩個房間的玻璃窗。我還聽過連我也覺得詫異的髇話。我也見過人們縮在椅子上，捧著胃部強忍著壓力引發的疼痛。我面對著報價螢幕時，也經常雙手冒汗，心跳轉劇，面紅耳赤，腎上腺素大量分泌，似平我遭遇莫大的危機，而實際上僅不過面對著數字不斷跳動的報價螢幕而已。在這場戰爭中，我們面對的究竟是怎麼樣的內部敵人呢？當我們面對著數字這類的客觀事實，內心深處何以蘊釀如此非理性、甚至於狂烈的情緒呢？


    回答上述問題，並學習如何克服我們內部的敵人，或許是追求成功的最重要單一課題——不僅是就交易者或投機者的身'
  merge: -1
  img_proc: true
- pgno: 340
  md: '份來說，也是就個人整體而言。在交易生涯內，我曾經與許多人共事，其中僅少部份人可以穩定地獲利，他們是真正的專業者，但大多數人最後都以虧損結束，未繼續留在金融圈。例如，我在1980年代曾經訓練38位交易員，其中能夠獲利的只有五位，並繼續發展他們個人的交易事業。我教導他們在金融市場生存與獲利的知識與方法。他們都可以隨意運用辦公室裡的任何資訊，也可以隨時與我交談，但他們大多無法維持六個月以上。觀察與評估他們的
    hành爲，我開始瞭解成功與失敗之間的重大差異，這不僅是就交易而言，也包括任何領域與事業。


    差別並不在於智慧與知識，而是在於執行知識的意志力。取得交易或任何領域必要的知識都相對容易。以瘦身計劃爲例。你可以走進任何書店找到無數這方面的書籍，專家們提供許多有效的減肥方法。然而，每100位嚐試減肥計劃的人，僅12個人曾經實際減輕體重，這12個人當中僅2個人可以保持一年以上。所以，成功率爲2%——低於商品交易的成功率5%。


    不論交易、減肥或追求任何目標，最困難的部份並不是知道怎麼或如何做；而是下定行動的決心，並堅持下去。我們擬定決策時，通常至少有兩種以上的選擇。後續的執行之所以困難，是因為我們對於選擇仍然處於三心兩意的衝突中。這種衝突的來源與性質究竟如何呢？即使我們知道應該怎麼做時，何以經常還是難以實際去做呢？


    在一部老舊的電視影集「星際迷航記」中，主角之一的史波克便爲上述問題提供了最佳的解答。半爲瓦肯人（Vulcan），半爲地球人，史波克在天性上便處於相互衝突的狀況。'
  merge: -1
  img_proc: true
- pgno: 341
  md: '根據故事的說法，遠古的瓦肯人是一種殘暴而野蠻的人種。唯有在邏輯與理性的哲學嚴格規模下，瓦肯人才可以馴化野蠻的特質，並冷靜地致力於追求知識。在邏輯的嚴格規範下，「純粹的」瓦肯人應該不會被感情與情緒困擾。然而，史波克一半是人類，幼年時受到母親的情緒影響，所以他仍然有情緒上的問題。最感人的故事是形容他在理性與情緒之間的掙扎，他在生死關頭被迫處理情緒上的反應。


    我認為，史波克之所以吸引如此多的影迷，最主要是因为他的個性被戲劇性手法凸顯，並反映出人性的衝突。在影片的對白中，你經常可以聽到類似下列的對話，「我的頭腦告訴我停止，但我的心靈告訴我放手去做，」這意味著人類的天性有兩種截然不同的層面：一是理性，一是情緒。大多數人認為，人性這兩個層面是相互分離，毫無關連，而且經常處於相互衝突的狀況。接受這種情緒與理性的兩分法——認為它們必然沒有關連，甚至於相互衝突——這便是大多數人性衝突的根源，包括內心與人際之間的衝突在內。


    猶如史波克一樣，如果我們的天性也被截然畫分為二，如果我們的天性中有兩個不同而相互衝突的層面，我們將倚賴那一個層面呢？或許更重要地，我們如何可能避免內部永恆的衝突與挫折，並擁有一個經過整合的人性與完整的生活呢？


    如果你接受情緒與理性互不相容的前提，上述問題必然僅有否定的答案。如果你相信人類的靈魂必須永遠處於對決的狀態，它便會如此。我稱此為自我折磨的史波克症候群。這個行業之所以處於戰爭狀態，生活之所以是痛苦的掙扎，敵人便是'
  merge: -1
  img_proc: true
- pgno: 342
  md: '史波克症候群。然而，猶如大多數戰爭一樣，解決衝突未必需要仰賴暴力的手段，而僅需要拔除導致衝突的概念。就目前的案例來說，這是指我們必須挑戰上述前提，情緒與理性是兩種互不關連的人性層面；這是指我們必須正視情緒在人類生活中所代表的性質與目的，尤其是忿怒與恐懼代表的功能。


    # 由獵食者到交易者：人類情緒的演化


    山頂洞人奧格正在一棵大樹下打盹，並消化野香蕉的午餐，身旁擺著一隻木棒。突然傳出啪的一聲，不到30呎外有樹枝被野獸撞斷。奧格一躍而起，雙手持著木棒，肌肉緊繃而隨時準備攻擊，眼睛注視著聲音的來源。他嗅著空氣中的味道…野豬，雖然危險，但也是美味的獵物，它正在上風的位置。


    他悄悄地逼近獵物，心跳轉劇。10呎外的樹叢傳出磨擦的聲音，然後是一片死寂。奧格舉起他的木棒，雖然有一股轉身逃走的衝動，但他還是留在原地，一動也不動，準備攻擊。


    在恐怖的嚎聲中，野豬由樹叢裡衝出來，獠牙朝下而隨時準備殺死它的敵人。奧格也發出一聲可怕的呌叫，躍向一旁，並揮動木棒攻擊，但出棒太晚而僅擊中野豬的背部。腿部傳來一陣劇痛，奧格低頭看，大腿的外側被獠牙畫開一道血溝，鮮血不斷流出。野豬回過頭來，稍微猶豫一下，又開始衝過來。受傷後的奧格非常忿怒，以超人的力量揮舞木棒，這次攻擊恰到好處，野豬的頭顱被擊碎而當場死亡。稍微整理一下傷口後，奧格拖著野豬回到洞穴，他與他的伴侶將可以享受一個星期的野豬肉。'
