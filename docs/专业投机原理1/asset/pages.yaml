- pgno: 327
  md: '# 第Ⅰ篇結論：綜合整理


    情況便是如此，你已經瞭解如何由根本做起。截至目前為止，我討論的是個人交易成功的基本知識。我簡略描述我的交易生涯，然後說明我一路走來所汲取的知識。


    在我提出的所有內容中，存在一個共通的脈絡，便是我認為最基本的知識與原理。我想如果你可以運用這些基本的概念，發展出自己獨特的交易風格，這些知識也將適用於你。


    如果你根據基本重點思考，將你的交易方法依經過時間考驗的原理整合，你可以適應不斷變動的任何市況。你雖然會針對行情的變動調整短期的策略，但基本原理始終有效。


    如果你明確界定自己的交易哲學，並嚴格遵守，你在交易過程中可以掌握重心；避免脫軌。特定而言，如果你可以保障交易資本，維持穩定的獲利，不刻意追求全壘打，你可以避免大多數交易者一敗塗地的下場。


    如果你研習「道氏理論」，你對於市場——所有市場——行為的領悟將不是其他理論所可比擬。你將瞭解，市場活動基本上是一種心理現象，無法由絕對的角度衡量，但在機率的層次上卻有高度的可預測性。


    如果你瞭解何謂趨勢，它們何時發生變化，你所俱備的知'
  merge: -1
  img_proc: true
- pgno: 328
  md: '識可以節省許多無謂的探索。你可以避免隨意進、出市場，並掌握順勢操作的訣竅。


    如果你瞭解技術分析，包括優點與缺少，它們將協助你判定交易的時效。如果你僅採用少數基本的技術分析工具，你可以避開大多數技術分析者陷入的困境——過多指標造成的無所適從。


    如果你瞭解經濟學的一些基本原理，包括貨幣與信用如何影響經濟循環，你可以預測市場如何反應政府的干預政策，並從中獲利。


    如果你瞭解如何管理資金，根據合理的風險-報酬關係從事交易，你永遠不會被市場三振出局。


    如果你可以嚴格遵循交易守則，就能夠穩定達成你的交易目標——這是優秀交易者的典型特質。


    然而，猶如先前所說地，知識本身並不足夠。我曾經訓練38位交易員，灌輸他們本書截至目前為止的所有知識，但其中僅5人可以穩定獲利。這並不是因為知識本身有所瑕疵。問題發生在人的部份；特定來說，他們無法以一致態度運用知識。我訓練的每一位交易員都有賺錢的能力；他們都瞭解何時觸犯某項交易守則，或未根據我傳授的基本原理從事思考。然而，他們就是不斷地重覆犯錯。


    我非常困惑何以如此。我深入研究心理學，閱讀200多本相關的書籍。我獲得的答案則是第II篇的內容。'
