- pgno: 322
  md: '某天，我接到朋友的電話，他是某家大企業的董事。


    「維克，」他說道，「XYZ剛同意與ABC合併。你一定要買進XYZ。這是穩賺的交易。」


    「佛萊德，」我說，「你告訴我這項消息，是否合法？」


    「絕對沒有問題！我們與這兩家公司都沒有任何關係，而且它們已經宣佈了；只是媒體還沒有報導而已。」


    於是，我查看XYZ的價格，每股6美元，我買進了一些。兩週後，兩家公司合併了…ABC兼併XYZ，價格爲每股$4.50！結果，我發生虧損——標準的takeunder（譯按：這是對應takeover〔兼併〕而言）。


    我想這是我第二次根據特殊消息交易，它也是最後一次。我聽到的特殊消息中，這是唯一實現的一次。確實有兼併（takeover），價格卻不對（takeunder）。從此以後，我再也不碰這些潛在的「兼併」股票。


    守則17：如果一筆交易的成功與否，必須取決於交易指令的正確執行，則不該從事該筆交易。


    Norm還在Merrill Lynch主管國際選擇權交易部門時，他習慣將執行不當或時效不佳的交易記錄下來。某天，他遞入一張交易指令，經過10分鐘還沒有回報。於是，他打電話進入場內：「嘿！怎麼回事，10分鐘還沒有成交。」場內經紀人毫不猶豫地說道，「你知道嗎？我
    Changing坐... 我就坐在造市者的左側而大聲喊價，我想他一定聽見了。最後，我站起來，推他一把，問他，'
