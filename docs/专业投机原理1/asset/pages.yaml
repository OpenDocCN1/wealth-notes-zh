- pgno: 320
  md: '我回過頭來，看見一位好朋友急匆匆地跑過來。他低聲地說道，「維克，Dataforce。」我說，「哦？」我的朋友說道，「維克，相信我，把這支股票留給你的小孩。」他告訴我，這是Artie
    Wagnar提供的消息。Artie當時在Lehman Brothers負責店頭市場的交易被視爲是店頭市場的主宰者，他的交易記錄非常了不得。


    所以，出自於好奇心的緣故，我查閱這支股票。它在店頭市場的交易價格爲7/8。當時，我的交易手氣正順，所以把這支股票視爲是「永不到期的選擇權」而買進，心想「看你由7/8還能跌到那裡？」


    還能跌到0嗎？結果便是如此。我大約買進35萬股，而這支「「永不到期的選擇權」最後竟然跌到一文不值。更慘的是當它跌至3/8時，我又買進35萬股，心想「這次你總不致於再跌了吧！」我還是錯了。停止報價時，我試圖瞭解這家公司的背景，我甚至於找不到它。沒有電話號碼，沒有地址，它就是…消失了。


    只要早走一步，我就不會聽到這位朋友的特殊消息。真是非常特殊的特殊消息。猶如我最好的朋友Norm所說，「如果你不斷地聽信『把這筆交易留給你的小孩』的小道消息，你的小孩將在孤兒院長大。」他還提供一個非常明智的建議，聞到小道消息即將飄過來時，趕快說「對不起，我要上洗手間」，然後你整個晚上儘可能迴避他。


    你不可以聽信特殊消息；同理，你也不可以提供特殊消'
