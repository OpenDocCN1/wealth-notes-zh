- pgno: 334
  md: '他擁有一切是多麼貧乏，而拋棄的一切又多麼珍貴。最後，螢幕出現一片空白，那位老人轉過身來。


    他沉默了一會兒，然後說道，「你是否仍然認為自己非常瞭解何謂成功？你有相當的成就——名利雙全——但你把自己擺在何處？你想要什麼？你夢想著什麼？」他停頓了一下，拍拍桌面上的帳冊，然後繼續說，「某些人僅有夢想而從來未付諸實現。某些人僅是默默工作而從來沒有夢想。可是，還有少部份人，他們不但有夢想，而且也將夢想付諸實現。」


    交易員緩慢地搖搖頭，低聲地說，「你是誰？」可是，在他說話的一霎那，老人已經消失在雲霧中，他醒過來時，仍然大聲地重覆喊道，「你是誰？」


    陣陣涼風由窗口吹進來，早秋的冷風驅散了城市空氣中的潮濕霉味。交易員轉過頭望著窗外的天空，灰暗的雲朵已經逐漸散開。不久之後，樹葉將轉黃而枯萎，春天又將帶來新的生命。他慢慢地從躺椅中站起來，走向窗口。他又聽到那迴盪在走道的腳步聲…於是他開始夢想。


    我想這段寓意的意義非常明白：名與利並不代表成功。對於每一個領域內的每一個人，成功都不是來自於某項特定的成就——它是一種生活的境界。猶如某位市場交易員所說：「成功的生命是由成功的年份構成，後者是由成功的月份構成，它們又是由成功的星期、天、小時、以及短暫的時刻累積而成。成功是由一組目標構成。所以，你如果希望成功，則不僅必須有長期的目標，也要有短暫時刻的目標；每一個目標都應該相互關連，並結合為一個生命的宗旨——快樂而'
  merge: -1
  img_proc: true
- pgno: 335
  md: '充實的生活。」①


    成功必須俱備目標，這個概念並沒有什麼新的啓示。你可以翻閱任何討論如何成功的書籍，或成功者的傳記，你將發現成功與目標有密不可分的關係。如果缺乏明確的目標，就無法匯集精力，無法擬定計畫，自我提昇的努力將失去焦點。然而，僅有目標也無法確保成功。寓言中的那位交易員，在達成畢生的野心以後，卻充滿失落的空虛感——他喪失了生活的毅力。


    我想，那位交易者的經驗多少反映在我們每個人身上。或許形式與程度各有不同，但在情緒的心境與意識的信念（beliefs）之間，每個人都會有矛盾與衝突。衝突過於激烈而無法有效運作時，我們將犯錯…有時是大錯。在人類的生命中，最嚴苛的挑戰是如何達成整合的境界；在這種境界內，理智與情緒可以融合爲一個共同的架構，並提供我們成功所需的知識、方法與動機。達成這種境界，需要將外部的知識與內部的獨特經驗整合。核心的問題在於如何設定可行的目標，並且又具有驅動力的真實感——這些目標在情緒上具有重要性，而且又可以提升生命的意義。


    所有動物都面臨一個根本的選擇：生或死。每一物種都有本能的生存方法，但人類最爲獨特；老虎獵食，鹿到處尋求安全的草地，但人類會思考。人類是唯一必須透過意識與積極的心智運作選擇生存方式的生物。對於任何動物來說，成功代表根據本能的生活方式維繫生命。對於人類而言，成功代表以理性的方式來生存。人類必須運用邏輯與推理來辨識真實，界定'
