  md: '數與下跌家數的差值，並繪製為圖。一般來說，騰落線與「道瓊指數」會呈現相同方向的走勢，一旦兩者之間出現背離的，通常代表趨勢即將變動的訊號。


    寬度震盪指標是衡量市場動能的方法之一，發出的訊號通常早於價格趨勢與騰落線的本身。


    我實際上採用兩種寬度震盪指標，一為短期，一為長期，但通常較重視長期指標。就短期指標來說，每天早晨，我首先登錄上漲與下跌家數的淨值；我是以「紐約股票交易所」近10天以來的資料為準，並計算、登錄、繪製上漲與下跌家數之淨值的移動總和（moving
    sum）。換言之，我每天都會計算前一天上漲與下跌家數的淨值，然後加總近10天的數據。計算程序請參考表8.1。


    就長期的指標來說，我取30天的期間，並做相同的計算，但將計算結果除以3，以代表10天期的約當值（參考表8.1）。圖8.13便是將上述結果描繪為圖形。


    隨意瀏覽圖8.13便可以發現，在轉折的情況下，寬度震盪指標與「道瓊工業指數」之間存在顯著的相關性。然而，你也可以發現，如果你根據短期震盪指標交易，經常會「捱耳光」。在另一方面，長期震盪指標在轉折點上，經常會落後中期的價格趨勢；所以，若僅根據它交易，也無法即時掌握機會。這便是為什麼我僅以它們做為輔助性的工具。但是，就整體上來說，自從我1975年開始採用這兩項指標以來，它們與指數之間的相關性都很理想。⑤'
