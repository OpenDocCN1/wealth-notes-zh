- pgno: 185
  md: '「道瓊工業指數」比較（參考圖形8.12）。我們可以發現，在轉折的情況下，價格震盪指標與「道瓊工業指數」之間存在顯著的相關性。


    我運用寬度與價格震盪指標，以預測與確認行情的轉折點。瀏覽上述圖形可以發現，震盪指標的數值愈偏高或愈偏低時，中期價格趨勢發生變動的可能性也愈高。猶如鐵路平交道上的紅綠燈一樣，震盪指標接近或穿越先前的重要高點或低點時，代表即將有危險的狀況。它們不會告訴你，究竟會發生什麼危險，或危險什麼時候會出現，它們卻會提醒你是否需要謹慎行駛或全速前進。


    在商品方面，猶如先前所提，我的報價系統已經設定震盪指標的計算公式，它是由兩項移動平均的差值構成。如果你也做類似的設定，你可以隨時嘗試改變移動平均的期間，針對特定商品尋找最適當的移動平均。


    對於商品交易而言，這種設定有其必要性，因為個別商品與股價指數不同，前者的「正常」價格行為較常發生變化。所以，商品市場震盪指標的可靠性能遠不如股價指數。雖然如此，如果可以找到適當的震盪指標，它們在確認趨勢變動上有不可忽視的價值。


    事實上，有時候你可以發現非常理想的相關性，幾乎僅需要運用震盪指標便可以交易獲利。我個人絕對不會這麼做，我也不建議這麼做；但這是可能的，我也相信有許多交易者便是如此。這種做法存在一個問題：你判斷錯誤時，經常都是嚴重的錯誤。'
