- pgno: 410
  md: '痛苦不斷地強化，讓你的身體隨著痛苦而消沉。觀想生活每一層面所受的打擊。其次，將痛苦投射至10年與20年之後，並重覆上述程序。


    附註：如果кара進心進行這項程序，這是一種痛苦不堪的經驗。以Terry（本書作者之一）來說，他將痛苦投射至一年時，便有強烈的放棄衝動。然而，如果痛苦足夠強烈，你的心智將迫使你立即改變。盡你所能，讓未來的痛苦儘可能鮮明。


    4. 將自己拉回目前，活動一下筋骨，深深地吸幾口氣，運用你的身體讓自己覺得精力充沛。徹底忘掉侷限性的信念，專注於你希望採用的嶄新信念。你的心智已經準備接受變化…讓自己感覺期待的興奮。以意義明確的詞句表達新的信念，並想著：「如果我現在擁有這項信念，我的一生將因此截然不同。」


    5. 閉起雙眼。設想自己現在已經改變信念，會有什麼變化？觀想自己得到的控制感與自信心。體會控制與自信的感覺，運用身體強化這些感覺。儘可能的深呼吸，設想自己現在已經擁有這項信念。接著，將自己投射至五年之後，並攜帶著這項信念五年來累積的成就。你覺得如何？是否更能控制自己的生命？是否更覺得精力充沛？是否覺得自己更有魅力？是否覺得更能貢獻自己？是否更有自信？對於生命是否更充滿熱情？這項積極的信念又將如何影響你的經濟狀況？你'
  merge: -1
