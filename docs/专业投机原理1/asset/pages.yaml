- pgno: 336
  md: '生存的必要條件，學習如何滿足個人的需要。所以，人類必須採取行動實現自我。


    成功需要完全面對現實，辨識與生活在真理（truth）之中，這並不是因為它是上帝指示的真理，而是因為唯有真實，現實與真理，人類的生命才有動力。


    將真理付諸行動，是成功之所以有意義的根源。在哲學上，這是誠實的泉源與力量。誠實是不斷追求知識的心態，包括自我反省的知識在內，而所有的行動都只能以此為依據；這蘊涵著另一種意義，透過任何欺騙手段（包括自欺在內）達成的一切都沒有意義，而且會有破壞性的後果。誠實不是根據某種指令生活，例如：「你不可以做偽證」而怕受懲罰；它是理性人類生存的必要條件。


    在上述寓言中，這位交易者雖然有誠實的意圖，但卻未誠實地面對自己，使自己陷入幾近崩潰的境界。他沒有不斷檢視與評估內在與外在的狀況，而將名與利設定為目標，並在追求名利的過程中喪失了生命的意義。他以金錢與影響力衡量自我的價值，使他沒有能力享受生活的過程。他將自己設定為著名心理學家Karen
    Horney 所謂的「理想化的自我形象」（an idealized image of himself），使自己僅能構倚賴一套僵硬的「應該」（shoulds）來生活，但這些「應該」與提供快樂的價值並沒有明顯的關連。②他對於辛勤工作、效率與自尊的「應該」，原本可以用來提升生活，卻用來維繫理想化的自我形象，並使他與生活產生隔閡；原本可以用來充實自我的價值，但卻形成自我的疏離感。由於這位交易者未能追求自我的知識'
  merge: -1
  img_proc: true
- pgno: 337
  md: '——未誠實面對自己——他的價值與長處反而成為生命中的破壞因素。


    截至目前為止，我並未單就金融市場的角度討論成功，所以我究竟有何意圖呢？答案是：太多人進入金融市場追求名與利，他們都將無法逃避失敗的命運。寓言中的交易員反映出大多數市場參與者的心理：「只要有足夠的財富，我就可以隨心所欲地做任何的事，而每個人都將崇拜我…我將自由…我將快樂！」


    根據我個人的經驗與觀察，我認為這是一種致命的想法。財富雖然可以提升人們的生活，實際上卻經常造成破壞；理由是缺乏自我瞭解。許多在金融市場獲致成功的人們，卻染上壓力導致的心臟疾病。某些人每天晚上僅能在酒瓶裡找到安寧，利用財富逐漸瓦解他們創造財富的能力。另一些人能夠鎮靜地渡過數次破產的打擊，卻無法承受自己的經濟成功。更有許多人，充滿精力與熱忱地來到金融市場，卻垂頭喪氣地離開，信心遭到徹底的摧毀，再也無法在壓力下工作。


    追求財富的慾望，確實可以驅使你獲得更多的市場知識，並使你賺錢，但你的個人生活卻必須付出沉重的代價。追求名氣的慾望，通常是源自於缺乏自信與自尊，在這種心態上獲致的任何名氣都毫無意義。將名利視為唯一的追求對象，其程度的多寡即代表你失敗的程度——這不僅是就個人的生活而言，經濟的生活也往往是如此。


    相關的理由非常複雜，後文將會詳細討論。本書第II篇的內容希望提升你自我瞭解的能力，使你可以與真正的你打交'
