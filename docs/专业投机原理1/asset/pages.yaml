  img_proc: true
- pgno: 288
  md: '# 可涉及任意與主觀的成份？


    市場並不像撲克牌一樣僅存有限的可能排列，市場是由個人組成，每個人都有特定的價值與慾望，而價值與慾望在性質上都是主觀的概念——取決於個人的心智架構與情緒。所以，如果希望衡量市場的行為，並預測任何投資的成功可能性，你似乎必須無所不知——你必須隨時掌握每個人的心智，並瞭解他們對於未來事件的反應。在絕對確定的情況下，預測未來的價格走勢是不可能的。我們頂多僅能以機率處理，所以問題將是：你以什麼標準衡量市場的機率？


    所謂機率，這是根據統計分配計算某事件發生的可能性。保險公司便是根據死亡率統計表（mortality tables）計算保險費。例如，24歲白種女性每年在紐約死亡的可能性目前為
    50,000：1。對於這群人而言，假定金額10萬美元的保單，人壽保險的每年平均保費為$100。根據統計機率顯示，可能的結果是保險公司每支付1美元給死亡之24歲白種女性的受益人，保費的毛利為50萬美元。所以，保險公司掌握的有利勝算為50：1——相當不錯的勝算管理。難怪大多數管理完善的保險公司都有理想的獲利（這是指它們的資產負債表內沒有太多的垃圾債券與房地產）。


    對任何來說，都無法精確地衡量其剩餘壽命，但仍然可以界定一種標準，衡量某特定健康狀況的個人，活至某一年齡的可能性——保險公司便是以此為生。類似的推理也可以適用於股票市場。1974年，我以兩年的時間全心研究股票市場的走勢，資料可以回溯至1896年，這項研究目前仍然持續進行中。'
  merge: -1
  img_proc: true
- pgno: 289
  md: '我發現市場走勢也像人類一樣，其「平均剩餘壽命」（life expectancy）的分配，在統計上俱備顯著的意義。讓我進一步解釋。


    1974年10月，我錯失低檔的進場機會之後，我開始思考一些問題以避免重蹈覆轍，這些問題包括：趨勢到底是什麼？它們的幅度通常如何？它們持續的期間又如何？根據道氏對於同時存在之三種趨勢的定義——短期趨勢，持續數天至數個星期；中期趨勢，持續數個星期至數個月；長期趨勢，持續數個月至數年——我將「道瓊工業指數」與「道瓊運輸（鐵路）指數」的歷史價格走勢加以歸類，登錄它們的幅度（價格走勢相對於先前高點或低點的百分率幅度）與期間（價格走勢所持續的日數），並繪製統計分配的圖形。


    根據李氏（Robert Rhea）的分類方法（以及我的部分修正），我將走勢區分爲主要走勢（長期的多頭或空頭市場）、中期主要走勢（介於兩個次級折返走勢之間的一段主要走勢）、中期的次級修正走勢（與主要趨勢相反的重要中期走勢）、再加上其他較不重要的分類（這個程序的最困難部份，是區分次級折返走勢與逆趨勢的小型走勢）。研究結果顯示，自從1896年以來所有的市場走勢，幅度與期間形成一個具有顯著統計意義的常態分配（請參考圖11.1）。


    在這個常態分配中，統計樣本傾向於集中在分配的「平均數」（median）附近（譯按：本書中，作者都採用 "median"〔中位數〕，但他實際的意思卻是指「平均數」〔mean〕而言，所以往後
    "median" 一律翻譯爲「平均數」）。例'
