- pgno: 137
  md: '這種方法雖然簡單，卻非常精確而具有一致性。如果 thou 根 據相同期間內的資料線性迴歸分析（linear regression analysis），最佳套入直線的斜率將相當近似於趨勢線的斜率。這
    與其他方法不同，它使你可以避免依據個人的主觀看法繪製趨勢線——避免將個人的欲望強加在趨勢線之上。趨勢發生變動 時，這項方法也可以在圖形上提供判斷的基準。


    # 如何認定趨勢的變動：簡單的1-2-3準則


    在底部買進而在頭部賣出，當然是最理想的投機方式，但 這顯然不是一種可以穩定達成的境界：市場的發展太過不確 定。然而，我們可以在技術上判定，趨勢何時將發生變動，並
    因此掌握大多數股票與商品之長期價格走勢的60％至80％幅 度。


    價格走勢有三種基本的變動，它們之間的相互配合，可以 界定任何市場的趨勢變化：股票、商品、債券、……。它們分 別為：


    +   1. 趨勢線被突破。價格穿越繪製的趨勢線（圖7.5）。

    2. 上升趨勢不再創新高，或下降趨勢不再創新低。例如，在上升趨勢的回檔走勢之後，價格雖然回升，但 未能突破先前高點，或僅稍做突破又回檔。類似情況 也會發生在下降趨勢中。這通常稱為「測試」（test）高點或低點。這種情況通常——但不是必然——發生在趨勢變動的過程中。若非如此，則價格走'
  merge: -1
  img_proc: true
- pgno: 138
  md: '勢幾乎總是受到重大消息的影響，而向上或向下跳空，並造成異於「常態」的激烈價格走勢（參考圖7.6）。


    3. 在下降趨勢中，價格向上穿越先前的短期反彈高點；或在上升趨勢中，價格向下穿越先前的短期回檔低點（圖7.7）。


    # 圖7.5


    1990年價值線現貨指數——突破中期趨勢線。價格穿越一條繪製適當的中期趨勢線時，這是趨勢變動的第一個徵兆。1-2-3趨勢變動準則的第1種情況。


