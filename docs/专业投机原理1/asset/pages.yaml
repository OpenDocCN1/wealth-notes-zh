  img_proc: true
- pgno: 260
  md: '我希望讀者瞭解，這便是實際發生的情況，只不過是一個較簡化的版本罷了，不僅「聯邦準備體系」如此，也代表世界上每一個中央銀行運作的方式。實際情況雖然較複雜，但不論程序涉及多少銀行，對於信用與貨幣供給的潛在影響，大致上便如同前述ABC的情況。我將詳細說明這點，對於心存疑惑的讀者來說，這是一場不錯的心智練習。


    就淨效果來說，Fed買進政府證券時，在帳面上創造買進證券所需的貨幣——這僅是以自己的名義開立一張支票。這筆新的資金於是進入銀行體系內，並增加銀行體系的準備金資產。準備金資產增加的部份，可以透過信用擴張增加貨幣供給，貨幣供給的最大潛在增加數量，相當於準備金的增加部份除以準備金比率的平均淨值。我們離開ABC進入真實的世界時，情況將便得稍微複雜一些。


    如果回頭觀察表10.1，你可以發現「聯邦準備體系」目前規定的準備金比率介於0％與12％之間，不同的負債類型適用不同的比率。如果你由床墊下翻出1萬美元，並到銀行買進10年期的定期存單，這筆交易適用的準備金比率為0％（這是到期時間在1
    1/2年以上的定期存款），整個銀行體系潛在的貸款增加數量為10,000/0.12 = 83,000！Fed買進證券時，情況也完全相同。


    淨準備金比率——依此比率計算，整體存款提列的準備金恰好符合法定準備的規定——取決於市場如何處理貨幣。我們可以舉一個實際的例子，說明法定準備與存款負債之間的整體關係。根據1990年5月7日Barron’s雜誌的報導，貨幣供給的最'
  merge: -1
