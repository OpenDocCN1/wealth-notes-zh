  md: '成就與能力。我不希望指名道姓，但我認識幾位這類型的交易員。毫無例外地，他們在自己擅長的領域內都有一定的水準，非常慷慨地分享他們的知識，個性迷人而願意與人談論。然而，同樣毫無例外地，在某些他們認爲重要的領域內，他們拒絕辯論與質疑。


