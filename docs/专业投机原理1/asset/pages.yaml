- pgno: 59
  md: '根據我的哲學，在市場頭部附近介入LBO的唯一合理方法是，在風險/報酬比率優於1：10的情況下，即早進場而少量做多買進選擇權。然後，在股票價格到達兼併目標之前，獲利了結——走人！


    在另一方面，介入兼併股票最理想的時機，是在空頭市場的底部或在多頭市場的初期。這才是股票具有真實價值的時候。猶如Robert Rhea所說，空頭市場的最後階段「是來自於健全股票的失望性賣壓，不論價值如何，許多人急於求現至少一部份的股票。」市場玩家如果可以避免在多頭市場的頭部附近投資——恐慌性的崩跌可以造成嚴重的傷害——並在空頭市場中賣空，則這個時候便可以掌握這股失望性的賣壓。在多頭市場的頭部，你或許會錯失最後10％、甚至20％的獲利（不過仍可以收取國庫券的殖利率），但當股票具有可觀的上檔潛能，下檔風險卻非常有限時，你絕對有資金投資。根據我的看法，這種累積財富的方式便是：保障資本，掌握一致性的獲利能力，並耐心等待正確的機會以攫取非凡的利潤。


    # 一致性的獲利能力


    當然，市場不會永遠位於頭部或底部的附近。一般來說，在任何市場的多頭行情頭部與空頭行情底部之間，一位優秀的投機者或投資者應該可以掌握長期價格趨勢（不論向上或向下）的60％至80％。這段期間內，交易重點應該擺在低風險的一致性獲利。


    一致性的獲利能力是屬於保障資本的輔助原則（corrol-'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'lary） 。何謂輔助原則？輔助原則是一種概念，它直接來自於一個更根本的原則。就目前討論的情況來說，一致性的獲利能力是保障資本的輔助原則，因爲資本不是一種靜態的數量——它會增加（獲利）或減少（損失）。如果資本要穩定增加，你必須要有一致性的獲利能力；如果你要有一致性的獲利能力，必須要保障你的獲利，並盡可能降低損失。因此，你必須衡量每一項決策的風險與報酬的關係，根據已經累積的獲利或虧損評估風險，如此才能增加一致性的勝算。


    例如，假定你是以季爲基礎操作。在一季的開始，任何新部位的規模都應該很小（相對於風險資本而言），因爲當期還沒有累積獲利。另外，你應該預先設定承認自己錯誤的出場點，一旦行情觸及這個價位，你便應該認賠出場。如果第一筆交易發生虧損，任何新部位都應該根據損失而按比例縮小。依此方式交易，任何一季結束時，你都不會虧損所有的風險資本——你永遠還有籌碼。反之，如果你有獲利，應該將一部份獲利運用在新部位上，並將其餘獲利存入銀行；如此，你不但可以增加獲利的潛能，又可以保障一部份的獲利。


    如果我是一位年輕的投機者，並擁有5萬美元的資金交易商品期貨，我最初的部位不會超過總資本的10％——5,000美元——並設定停損而將潛在的損失侷限在10％至20％之間——500美元至1,000美元之間的損失。換言之，根據這項設計，我的虧損絕對不會超過總風險資本的1％至2％。如果第一筆交易發生1,000美元的損失，則次筆交易的部位將減至4,000美元，並將潛在損失設定在400美元至800美元之間。依此類推。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '就另一方面來說，如果我第一筆交易獲利2,000美元，我將存入銀行1,000美元，並將次一個交易部位增至6,000美元，這將增加我的起始（initial）風險資本（5,000美元）達20%，而實際（actual）風險資本也增加相同的金額。依此方式，即使我下一筆交易發生虧損，就整個期間來說還是有獲利（譯按：這是指一筆交易最多虧損20%而言）。如果我對於行情的判斷有50%的正確機會，則這種交易策略將可以創造相當可觀的收獲。假設我頂多只接受1：3的風險/報酬比率，即使我每三筆交易僅有一次獲利，我的收入仍然相當可觀。換言之，如果你每一筆交易，可能的（probable）報酬至少是客觀可衡量（objectively
    measurable）之潛在損失的三倍，長期下來，你便可以維持一致性的獲利能力。


    任何人進入金融市場，如果他預期所將有一半以上交易的會獲利，這項預期會被很粗魯地驚醒。你不妨以棒球的角度思考——最佳選手的打擊率也只不過是30%至40%。然而，優秀選手都知道，安打的效益總是大于三振的傷害。報酬總是大于風險。


    持續評估風險與報酬之間的關係而永遠掌握勝算，這項概念適用於所有趨勢。例如，我從事S&P 500指數期貨的盤中交易時，我有興趣的最小波段幅度，是我可以將潛在損失（通常在遞單時便已經決定）侷限在三檔至五檔之間（每檔相當於每口契約25美元），而獲利方向的最近壓力或支撐則在15檔至20檔以上。我在中期趨勢中尋找交易機會時，也會運用相同原則，僅是單位較大而已，例如：一點至三點的風險與三點至十點以上的利潤。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '以1989年10月的情況為例，由於槓桿效果的緣故，我雖然以選擇權建立空頭部位，但也考慮賣空S&P 500指數期貨。基於前一章說明的理由，10月12日星期四（請參考圖3.2），S&P指數跌破8月5日的高點359.85時，我應該賣空；而我的目標價位至少是346.50——前一波跌勢的低點。如果行情回升至364.50以上——10月10日的高價——市場便證明我的看法錯誤。所以，我的客觀風險如何？它是4.65點，相當於是每口契約2,325美元。可能的報酬又如何？它是13點，相當於每口契約6500美元——風險/報酬比率為1：2.8。雖然不完全符合我的準則，但其他風險評估因素則可彌補少許的不足。


    一旦價格向下穿越可能的報酬點時（點②），我會調降出場點以確保獲利。我會留意隨後的次要支撐（點③、⑤與⑥），觀察市場的反應，並向下調整我的停損。有 ‎一項交易法則說，「迅速認賠，但讓你的獲利部位持續發展。」我對於這項法則的解釋是，「任何既有的獲利都不可再損失50％。」就這個例子來說，一旦價格向下突破346.85（點②），我會將停損設定在347.10，價格繼續向下跌破點⑥與點⑦時，我會把停損再往下調整。這筆交易最可能的結果是在342.15（點⑦上方四檔）停損出場，獲利為17.7點，相當於每口契約美元8,850。因為所有徵兆都顯示大盤將出現拉回的修正走勢，我認為這是一筆低風險的交易；但我當時非常自信，所以我並沒有進行這筆交易，而採用槓桿倍數更高的選擇權。'
