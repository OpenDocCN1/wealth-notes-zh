- pgno: 262
  md: '時監視這些總體指標的變化，以多數同意的方式決定如何達成政策目標，並依此調整策略——在FOMC的秘密會議中。


    在這裡，我忍不住要插上一段題外話。FOMC集會時，他們會儘量防止市場得知會議的決定。然而，委員會的12位成員都會帶著他們的助理與會。大多數委員都已經結婚而有家庭，他們的助理也是如此。另外，還有許多秘書與員工需要整理會議記錄。我們知道美國是怎麼樣的一個國家，國家安全局的一舉一動都無法逃避媒體的掌握（我並沒有藐視的意思），你是否真正相信會議的決定絕對不會對外洩漏？我不認爲如此。事實上，這讓我有一種想法。


    我們無需再增加稅金與福利計劃，政府可以在FOMC集會之後，立即將會議記錄秘密地交給國內各貧困地區的特殊委員會。政府可以訓練這些委員會如何在市場中交易，於是他們可以根據這些內線消息在市場中獲利。如此便可以解決貧困地區所有的財政問題！當然，這只是開玩笑而已，但我相信必然有少數人可以取得這些內線消息。


    誰拿嘲筒？誰拿刺針？毫無疑問地，便是Fed，而嘲筒與針刺則是「公開市場操作」與其他政策武器，這使它們可以控制信用與貨幣的供給與需求。根據重要性的先後秩序排列，Fed掌握三項貨幣政策的主要工具：設定法定準備、設定貼現率、以及執行公開市場操作。


    # 法定準備，聯邦基金利率，貼現率


    就法定準備的運作機制來說，此處無需再多做說明，大致'
