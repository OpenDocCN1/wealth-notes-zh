  md: '我實在無法克制自己不提這段故事，因為它是一個顯示信用擴張對於經濟影響的典型範例。經濟歷史上每一個繁榮/衰退循環都呈現類似的模式，僅是程度或許沒有如此劇烈。經濟衰退持續一段時間以後，經濟活動趨於遲緩，社會要求政府必須提出「某些對策」。雖然市場已在調整，但某些自以為是的經濟學家配合政府提出復甦經濟的計畫。


    毫無例外地，這些計畫會呼籲停止以通貨膨脹的方式發行貨幣，平衡政府預算、減少政府赤字（如果有的話），穩定本國貨幣相對於外幣的價值。但是（永遠有一個但是），為了達成這些高貴的目標，政策上必然需要以某種形式干預市場的自由運作，最後又出現新的信用擴張，於是又是另一個繁榮/衰退的循環。


    中央銀行的信用擴張，何以必然造成繁榮/衰退的循環呢？簡單地說，它會不當地配置資源，混淆經濟計算；結果，或者必須像吸食毒品一樣，以愈來愈強烈的信用擴張預先防範不可避免的後果；或者，經濟將趨於冰冷——經濟衰退或蕭條。然而，如果希望真正瞭解其中的發展，則需訴諸經濟學的基本原理；你必須瞭解信用擴張對於基源利率（originary
    interest）的影響。


    前一章，我們曾經講解米賽斯對於基源利率的定義，它是目前物品與未來物品在價值上的比率；換言之，「將未來的物品折現（discount）為目前的物品」。⑤在市場從事交易的個人，便是根據基源利率為基準，判斷他的消費水準，以及單純（plain）儲蓄與資本（capital）儲蓄的水準。換言之，基源利'
  merge: -1
  img_proc: true
- pgno: 243
  md: '率將決定市場中的產品供給有多少是用於目前的消費，多少是用於未來的消費。它在市場中是表示為市場利率的一個成份（component）。


    市場利率會根據主要市場參與者的基源利率水準調整。然而，我們必須注意，市場是一個持續變動的機制，基源利率的水準也會不斷變動，它會因人而異，因市場（狀況）而異。然而，透過企業家之間的相互競爭，基源利率會趨於一致化的水準。


    如果希望瞭解信用擴張如何導致繁榮/衰退的循環，你必須瞭解基源利率與市場毛利率之間的差異。市場毛利率是由三個成份構成：基源利率、企業家的成份（entrepreneurial
    component）與價格升水（price premium）。企業家成份代表債權人提供資金供他人投資的誘因部份。價格升水是預期貨幣購買力發生變動的溢價（正值）或折價（負值）。以最簡單的方式來說，基源利率是市場評估目前消費相對於未來消費的主觀價值，企業家成份是債權人根據其對於債務清償信心所做的加碼，價格升水是債權人根據其對目前與未來之貨幣購買力預期變動所做的加碼。


    在每一筆信用交易中，市場毛利率一定包含這三項成份；它們都會持續變動，而且相互影響。猶如任何其他市場一樣，每筆貸款的名目（nominal）利率最後都是取決於供、需的力量。在自由市場中，企業家與推銷者都希望獲利，產品的銷售價格高於生產成本與市場毛利率的總和。市場毛利率顯示企業家與推銷者如何減少生產要素的立即消費，以供未來生產更多'
  merge: -1
  img_proc: true
- pgno: 244
  md: '的產品。市場毛利率讓企業家瞭解，如何最有效運用數量有限的既有資本財，後者來自於市場參與者的儲蓄（譯按：「既有」是指「可供運用」的意思）。


    某種情況下，中央銀行擴張信用時，市場毛利率的功能會完全遭到破壞。假定信用擴張採用的方式，是增加貨幣供給讓銀行放款，猶如法國在「密西西比事件」發生的情況。這種情況下，貨幣本身便是一股驅動的力量，而且在商品與勞工價格變動以前，貸款市場已經直接受到影響。


    最初，基源利率並不會變動，但因為資本明顯增加，會導致市場毛利率中的企業家成份降低。雖然額外的資本實際上並不存在，在企業家的紙上作業中，貨幣供給的增加確實使資本顯得實際存在。在此之前，某些計劃並不可行，但現在確可行了。在信用擴張的早期階段，企業家無法分辨既有資金與既有資本之間的差別──於是，整個經濟計算的基礎便受到扭曲。


    以人為的方式降低市場利率，這與既有資本財的供給或與基源利率當時的水準都沒有關係。然而，因為增加既有信用造成的扭曲，在擬定相關決策時，上 Ze 關係便如同存在。所以，資本會由最佳的用途中移開，鼓勵不當的投資，最後造成資本的消耗。


    此外，從事經濟計算時，市場利率中的價格升水成份，其功能也完全被破壞。因為貨幣供給增加，在影響物價以前，會先直接影響貸款市場，所以價格升水必須經過一段時間才可能合理反映物價的上漲，而後者是貨幣供給增加的必然結果。所以，在信用擴張初期，市場利率中的價格升水會明顯偏低，因'
  merge: -1
  img_proc: true
- pgno: 245
  md: '爲債權人無法合理估計貨幣未來的購買力。⑥


    在部份準備金的銀行體系（fractional reserve banking system）內⑦，信用擴張總是會導致通貨膨脹的貨幣供給，我稍後會詳加解釋。某些主張以通貨膨脹方式擴張信用的人們認爲，通貨膨脹的貨幣供給，造成物價上漲會先影響商品價格，其次才會影響工資。所以，生產者的成本將增加，消費者物價將走高，但因爲薪水與勞工階層的儲蓄傾向（譯按：換言之，每增加一單位所得時的儲蓄變動量）與能力都相對低於其他階層，他們將被迫減少支出，這些儲蓄便可以供應資本的擴張。


    另一方面，他們認爲，企業家與商業界的儲蓄傾向較高，所以價格上漲造成收入增加時，儲蓄的增加幅度將大於消費。所以，薪水與勞工階層的消費減少時，整體經濟的新資本累積將增加。這種強制性的儲蓄（forced
    savings）將促使基源利率下降（減少立即的消費），而資本投資將增加，於是加速經濟進步與科技創新的步調。


    這或許沒錯，過去也確實曾經發生如此的現象，但這種論證忽略數個重要的層面。首先，工資的反應未必落後商品價格。以1970年代的工會爲例，它們瞭解通貨膨脹的影響，並要求提高實質工資；換言之，工資的調整幅度大於消費者物價指數（CPI）的漲幅——所謂的「工資-物價的惡性循環」（wage-price
    spiral）。另外，企業家與商業界的儲蓄傾向也未必高於薪水與勞工階層。然而，這項論證忽略一項最重要事實，通貨膨脹將促使市場提高消費資本財的傾向。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '通貨膨脹——由於中央銀行擴張信用而導致貨幣供給增加——將扭曲經濟與會計的計算。中央銀行增加信用市場可運用的資金時，會創造原本並不存在的貸款機會。名目利率——實際的平均利率——或許不會變動，但因為貸款市場的資金增加，市場毛利率會降低。所以，市場會發生額外的貸款；如果沒有擴張信用，這些貸款原本都不會發生。這便是Fed
    目前（1991年2月）嘗試的行為。


    對於企業家來說，他們處理的是實際的金額數據，一旦信用市場可運用的資金增加時，先前原本不可行的計劃，現在變得似乎可行。對他們來說，信用是投資新計劃的未消費財（unconsumed
    goods）請求權。愈來愈多企業家著手新計劃時，將刺激商業活動，於是經濟趨於繁榮。然而，不論在任何時間，可供經濟擴張的產品與勞工數量都有限（換言之，它們都是稀有資源）。信用擴張造成這些稀有資源的需求增加，所以工資水準與生產財的價格都會趨於上漲。


    工資增加時，消費財的需求也會對等的增加，價格也會上漲。這些現象會發生在不同階段，在不同的時間，以不同的程度影響經濟中的不同部門。對許多廠家來說，它們的產品價格在消費市場中逐漸攀升，將造成實質獲利增加的假象。


    在實質獲利增加的假象影響下，商業界估計它們有能力消費更多，這也促使消費物價的上漲。生產者物價首先受到影響，影響的程度也最大，但消費者物價的上升使生產廠家覺得安心，雖然生產成本提高，但收入的增加可以因應資本的擴充計劃。'
  merge: -1
  img_proc: true
- pgno: 247
  md: '米賽思是第一位瞭解這整個程序的經濟學家。他的解說有些複雜，但我希望讀者耐心研究下列分析，因爲這可以使你避免在多頭市場的頭部全額投資而遭受損失。


    以米賽思的符號表示，p 代表信用擴張前夕可以運用的資本財數量，r 代表以 p 生產時所必須儲蓄的重置資本，而 g 則代表 p 可以生產的消費財數量。假定在信用擴張前，經濟是處於成長狀態而可以生產
    p1 與 p2 的剩餘資本（資本儲蓄），其中 p1 用來繼續生產原先已有的產品（數量爲 g1），而 p2 則用來生產新發明的產品（數量爲 g2）。


    如果沒有信用擴張，則 p（既有資本）將生產 r + g（必要的重置資本與消費財），以及 p1 + p2 的資本儲蓄（生產既有產品與投資新計劃所需的新資本）。經濟成長則是來自於
    p1 + p2 生產的 g1 + g2（更多的既有產品與新發明的產品），而科技創新可以加速這種程序。然而，實際情況並非如此，中央銀行爲了刺激就業與生產水準，在經濟體系內注入資金，並創造可供運用的額外信用。


    在信用擴張的刺激下，企業家決定生產額外數量的既有產品 g3，以及新發明的產品 g4。爲了生產 g3 與 g4，需要額外的資本財 p3 與 p4。然而，猶如先前所提，經濟擴張可以運用的資本財僅限於
    p1 與 p2；p3 與 p4 並不存在，它們僅是看起來存在而已！企業家計畫生產 g3 與 g4，這項決策來自於信用擴張所造成的假象。


    由另一個角度看，企業家在計劃中可以實際運用的資本財'
  merge: -1
  img_proc: true
- pgno: 248
  md: '數量爲p1 + p2 + r，但看起來似乎有p1 + p2 + p3 + p4 + r。企業家打算以看起來似乎存在的資本，生產g1 + g2 + g3
    + g4，但因爲缺乏實際存在的資本，於是市場會競價爭取p1 + p2 + r。生產財的價格可能首先上漲，並超過消費財的價格漲幅，導致基源利率在短期內下降。


    這段期間內，增加未來產量的意願，實際上可能創造新的實質財富。然而，信用持續擴張時，消費者物價的漲勢最後會超過生產者物價。在資本尚未形成以生產消費財以前，工資與企業利潤的增加（這主要都是似乎存在的增加，而不是實質的增加），將導致消費財的需求增加。於是，消費者物價上漲。如果消費者物價持續上漲，人們希望儘速擁有消費財，避免未來支付更高的價格。換言之，基源利率將趨於上升，人們希望增加立即的消費，而減少未來的消費。資本——以儲蓄的形態而言——被消費了。情況發展至此，類似如川普（Donald
    Trump）之流的投機客，將儘可能舉債買進他們認爲短期內價格將上漲的物品。


    就計算的角度來說，貸款的需求增加時，利率可能攀升。然而，利率中的企業家與價格升水的成份，其調整在時間上必然會落後，因爲資本的「適當」配置需要花費時間。銀行界認爲，偏高的利率應該可以彌補物價變動的影響，所以它們繼續放款給企業界，並相信經濟擴張將永遠持續。


    事實上，銀行界對於經濟擴張的信心並沒有合理的根據，因爲它們未察覺自己是扮演煽火助燃的角色，催動稀有資本財的價格戰爭。企業家判斷銷售金額的增加可以因應生產成本的'
  merge: -1
  img_proc: true
- pgno: 249
  md: '增加，所以持續增加貸款以擴充生產，利率將持續上升，生產財與消費財的價格也不斷上揚。銀行唯有持續創造貨幣，不斷增加貨幣供給，如此經濟繁榮才得以持續發展。


    然而，不需多久，甚至增加貨幣供給也無法支撐經濟繁榮。如果銀行持續採行擴張性政策，人們終究會瞭解真相。他們發現貨幣的實質購買力不斷下降，於是開始囤積實質的物品——基源利率將急速上升，貨幣需求暴減。於是演變爲失控的通貨膨脹，猶如不久前的巴西與目前的阿根廷。米賽斯稱這個階段的信用擴張爲「崩解的繁榮」（crack-up
    boom）。


    然而，事態通常不會演變至這種程度。固定收入的消費者因爲生活成本的提高，將向政治家激烈反應。政治家又會責怪某些人，於是迫使中央銀行踩煞車。中央銀行開始緊縮信用。企業家再也無法負擔目前轉爲稀少的貸款，他們察覺自己必然失敗時，便放棄新的擴張計劃。銀行停止放款，因爲它們發現自己的行爲已經超過謹慎經營的限度。銀行開始回收放款。信用停止擴張。


    這個時候，經濟繁榮反轉。企業界爲了清償債務，拋售存貨以求現，物價開始下跌。一般來說，生產財的價格跌勢遠甚於消費財，以1929 年至1933 年之間的情況爲例，當時的零售銷售量下降15
    %，資本財銷售量的跌幅高達90 %。工廠關閉。勞工失業。經濟體系內的信心趨於低迷時，利率中的企業家成份大幅調高，更加速通貨緊縮的發展。在這類的發展程序中，通常會爆發震撼性的新聞，使既有危機轉變爲恐慌，這經常反映在股票與商品的價格崩跌中。於是，經濟步入衰退。'
  merge: -1
  img_proc: true
- pgno: 250
  md: '在這種情況下，經濟學家通常會責怪資本主義制度的缺失，認為「過度投資」（overinvestment）是造成經濟衰退的主因。這是有關「繁榮/衰退循環」的最嚴重誤解。造成經濟循環的原因並不是過度投資，而是米賽斯所謂的「不當投資」（malinvestment）。信用擴張導致市場毛利率下降時，將鼓勵企業家把似乎存在的資本p1
    + p2 + p3 + p4 + r，視爲是實際存在的資本p1 + p2 + r，這才是發生問題的真正原因。這必然會使經濟體系在超出資本財實際供應的範圍外，從事投資與資源的分配。


    這猶如是以興建2500平方英呎房屋的水泥份量，打5000平方英呎房屋的地基——你或是必須修改設計，或是興建一個無法支撐整棟建築的超薄地基。


    我在前文曾經說明，增加財富必須以儲蓄投資，才可以增加未來的生產。科技的創新發明雖然可以加速財富的成長，但唯有透過儲蓄的資本才有可能。一般來說，在信用擴張的過程中，一部份p1
    + p2 + r將投資於創新發明，這雖然可以加速財富的成長，並抵消上述一些負面影響，但僅有緩和的功能。


    信用擴張造成的不當投資，遲早會令經濟繁榮趨於瓦解，財富也因此而被消費。在繁榮/衰退的循環結束時，實際的生活水準與整體經濟的財富，或許仍大於循環之初；雖然情況經常如此，但如果沒有不負責任的信用擴張，情況必然更理想。


    在中央銀行信用管制影響下的市場中從事投機活動，你必須能夠辨識「繁榮/衰退循環」的發展階段。爲了俱備這項能'
  merge: -1
  img_proc: true
- pgno: 251
  md: '力，你必須瞭解各種不同形式的信用擴張。特定而言，你必須瞭解「聯邦準備理事會」與財政部如何控制貨幣與信用。因為各國中央銀行的運作方式基本上都相同，所以你只要瞭解美國的體系，便可以明白所有中央銀行的情況。所以，政治家試圖協調國內與國際的貨幣政策時，你便可以理解、甚至於預測可能發生的經濟後果。


    # 聯邦準備體系的結構與功能


    在本章的標題中，我提出一個問題：「誰拿喀筒？誰拿刺針？」在「密西西比事件」的法國，答案是John Law與Orleans公爵。在當今的美國，類似的答案則是「聯邦準備理事會」（Federal
    Reserve Board）與「聯邦公開市場委員會」（Federal Open Market Committee；FOMC）。這兩個機構擁有獨佔的權力，控制整個「聯邦準備體系」的貨幣與信用供給，範圍實際上涵蓋全國所有存款機構。


    它們掌握的經濟權力絕對可以讓你心驚肉跳。事實上，我們都必須仰賴Fed的臉色來生活，判斷未來政策動向時，我們必須揣摩Fed主席、重要理事與FMOC成員的晤瀰評論。Fed主席的一句話便可以扭轉整個股票市場的走勢，這發生在1984年7月24日，當時Fed前主席Paul
    Volcker宣佈，「Fed的〔緊縮性〕政策並不恰當。」股票市場在同一天見底，隔天便展開新的多頭走勢。


    非常諷刺地，可以用一句話扭轉股票市場的政府機構，在「1913年聯邦準備法案」的章程中表示，Fed的目標在於穩定'
  merge: -1
  img_proc: true
- pgno: 252
  md: '貨幣與信用市場的運作。


    根據法案的規定，Fed的成立宗旨在「供應一種具有彈性的通貨，提供商業票據的貼現服務，改善與監督銀行的業務。」1963年，Fed擴大功能目標以「協助反制通貨膨脹與通貨緊縮的情況，共同創造有利的環境，以維繫高度的就業水準，穩定的美元幣值，國家的成長，並提升消費水準。」⑧請留意，重點在於消費而不是生產——凱恩思理論下的標準產物。）


    目前，Fed幾乎已經是政府的另一個部門，它擬定政策時，將配合「國會」、總統、財政部與其他國家的中央銀行。然而，Fed的主要功能是扮演美國中央銀行的角色。首先，讓我們觀察它在這方面的運作。


    身為一個國家的中央銀行，Fed的主要功能是：


    …管理銀行信用與貨幣的流量。執行這項主要的功能，基本上是蒐集與解釋有關經濟與信用情況的資訊。另一項功能是檢視與監督國有銀行…取得有關它們狀況的報告，並協調其他監督當局以發展與管理政策…。⑨


    Fed 最大的權力基礎在於「管理銀行信用與貨幣的流量」；簡言之，這是以通貨膨脹或通貨緊縮的方式，控制貨幣與信用的供給。


    進一步討論前，讓我簡單界定Fed的意義。「聯邦準備體系」有三個基本成份：「理事會」（Board of Governors）、'
  merge: -1
  img_proc: true
- pgno: 253
  md: '「聯邦公開市場委員會」（FOMC）與「聯邦準備銀行」。身爲聯邦政府的機構之一，「聯邦準備體系」的組織由法律規定。「理事會」與FOMC——「理事會」的七位成員佔FOMC12個席位中的七席——可以獨立擬定與執行美國的貨幣政策。提及Fed時，通常是指這兩個成份而言。


    「理事會」的七位成員是由總統提名，經過聯邦參議院同意而任命，任期爲14年。任期經過特殊的安排，每個偶數年份都有一名理事卸任，任滿14年的卸任理事不得再被提名。「聯邦公開市場委員會」共有12個席位，包括「理事會」的七位成員，「紐約聯邦區域銀行」的總裁，另外四個席位則由其他11個「聯邦準備區域銀行」（Federal
    Reserve District banks）的總裁輪流擔任，任期爲一年。


    FOMC負責擬定與執行美國的貨幣政策。「理事會」雖然有全權控制貼現率與法定準備金，但它的政策必須遵循FOMC集會多數投票決定的政策目標。


    目前，FOMC每年定期舉行八次集會。委員會可以自行決定開會的議程，並隨時都可召開臨時會議。另外，FOMC會根據政策目標擬定公開市場操作的計劃，並由「紐約聯邦準備銀行」負責執行。


    公開市場操作是由Fed在公開市場買、賣政府證券。這些交易會直接而立即地影響銀行體系持有的準備金，並藉此控制信用水準與貨幣供給的成長率。透過公開市場操作，Fed可以放寬或收縮信用，並操縱利率水準。讓我詳細介紹這項程序。'
