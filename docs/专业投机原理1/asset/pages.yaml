  md: '先前的半數獲利，我還有很多資金可以從事低風險的交易。


    # 結論


    保障資本、一致性的獲利能力、以及追求卓越的報酬，這是三項單純的原則，如果你確實瞭解其中的精義，則它們將指導你在市場中獲利。然而，如果要實際地運用這些觀念，你還需要更多的知識。最佳的起點是瞭解市場價格走勢的性質。一個人若希望真正瞭解市場的行為，他需要擁有一套不可或缺的知識：「道氏理論」（Dow
    Theory）。'
