- pgno: 276
  md: '這些天文數字似乎已經失去意義，但我們不妨由另一個角度觀察。在所有的農業貸款中，大約75％由政府融通；在房屋抵押貸款中，大約88％是由聯邦政府某種方式資助。⑭


    我不希望被視爲是悲觀的預言家，但這個程序遲早都必須結束。一旦結束時，由於影響的層面如此的深遠，我們將目睹歷史上最嚴重的經濟調整——大蕭條。然而，這取決於Fed、行政當局與美國國會如何處理問題，我們還很長的時間可以過目前的日子，一段繁榮的經濟擴張期，以及隨後一段短暫而劇烈的經濟衰退，以緩和先前的通貨膨脹擴張。


    身爲這種環境下的投機者，你必須隨時留意下檔的可能性。你必須密切觀察Fed與財政部的活動與宣示，並防範市場的反應。


    # 如何根據貨幣與財政政策以預測趨勢與趨勢的變動


    任何市場的長期價格趨勢最終都是由市場力量——供給與需求——決定。然而，不論任何市場，在供給與需求的方程式中，一部份都是貨幣與信用的供給與需求。不論是股價指數、個股或商品，Fed與政府的財政政策都會明顯影響貨幣與信用，以及價格趨勢。


    我最大的交易勝利，來自於我能夠預測政府政策的結果（當然還需要配合其他的方法）。然而，我最大的失敗，發生於我假定政府會採取合乎理性的行爲。'
  merge: -1
  img_proc: true
- pgno: 277
  md: '例如，1982年7月，我持有畢生罕有的龐大多頭部位。當時處於空頭市場中，「道氏理論」發出買進訊號。我一路買進，在三個星期內累積38.5萬美元的獲利。


    然而，7月23日，參議員Bob Dole提出一項稅法修正案，這是歷史上最大的增稅方案。我誤以為雷根會信守大選時不增稅的承諾，並因此認定這項法案不可能通過。14天內市場下跌12天，我結束部位出場時，已經轉盈為虧。單月虧損為9.3萬美元，這是我畢生第二大的單月虧損。（我實際的虧損約是這個數目的兩倍；9.3萬美元僅是我在Interstate的損失。）


    Fed準備採取寬鬆政策的消息傳出後，市場在8月12日見底。如果你認真思考當時發生的情況，這一切實在太荒唐了。因為赤字造成的壓力，聯邦政府在空頭市場瀕臨結束時宣佈增加稅金，以舒緩赤字的負擔。


    由於增加稅金很可能會使經濟陷入更深的衰退中，Fed瞭解，除非經濟能夠復甦，否則增稅法案毫無意義可言，於是開始增加貨幣供給，驅使利率下降，經濟也開始擴張。基本上，透過信用擴張，Fed使政府的增稅法案可以達成增加稅收的目的。人們稱此一切為自由市場經濟！


    因為誤信政治家的言論而造成的第二次虧損，發生在1984年11月，當時是雷根競選連任獲勝後不久。他提出所謂「簡化」（simplified）而「收益中性」（revenue
    neutral）的稅法。我相信他，並因此建立畢生最龐大的多頭部位——頁一頁數之不盡的股票買進選擇權。結果，所謂的「收益中性」是'
  merge: -1
  img_proc: true
- pgno: 278
  md: '指政府將拿企業界的錢補助個人，市場在11天之內下跌九天。當月虧損超過34.9萬美元，這是我畢生最大的單月虧損。同樣地，總虧損大約是這個數目的兩倍。


    這兩個案例中，我的失敗是因爲我未依照政治家的思路思考，但我至少學得一些教訓。不論這些政治家表露的意圖是什麼，你絕對可以相信他們能夠找到權宜之策（或務實的策略）。當我得知葛林斯班（Alan
    Greenspan）接任「聯邦準備理事會」主席時，實在忍不住笑出來，他一向是堅決提倡金本位制度與自由放任的（laissez-fair）資本主義，結果變成一位廢話連篇而毫無內容的專家——標準的「優秀」政治家。雷根大選時，高聲急呼「有限度的政府」與「回歸市場經濟的原則」；結果在他總統任內，預算不斷擴大，赤字完全失控。這個美國經濟史上最快速的信用擴張，使得經濟泡沫極度膨脹。1987年中我已經準備妥當，等待著刺穿泡沫的針刺出現，接下來的發展則是各位都已經耳熟能詳的歷史了。


    萬萬不可錯估Fed的角色，它是一個貨真價實的政治機構，必須接受來自總統、國會與其他利益集團的關說與壓力。何以如此？這是人類的本性。任何人如果膽敢抗拒這些壓力，他將喪失影響力，最後也會喪失他的官位。如果你相信Fed是一個真正「獨立運作的機構」，未免太過於天真了。大體上，Fed的成員將被迫根據執政黨務實而短期的政策行動，他們追求的並不是健全的經濟政策。「絕對不可以做多政治家——而且Fed是由一群政治家構成」，這條交易守則並未列入稍後講解交易守則的一章。'
