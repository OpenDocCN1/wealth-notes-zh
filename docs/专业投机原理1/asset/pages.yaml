  md: '截至目前為止，我提出一個核心問題，並提出解決之道：如何取得穩定性的能力，使你能夠根據自己的知識行動。我釐清問題的核心：理性與情緒之間的衝突。我討論人類心智中的超級電腦，並說明成功的關鍵是：建立的目標，能夠受到協調而強烈的動機與決心所支持。


    本章中，我簡略地談及一些技巧，獲得所需要的動機與決心。所有觀念都來自於閱讀與學習，並思考人們（包括我個人在內）何以產生各種行為，以及如何改變行為。然而，這方面的討論受限於本書的宗旨與篇幅，只能概括說明。在我討論的範圍之外，還有許多相關知識，建議你可以進一步探索。本書提供的參考書目是一個相當好的起點。


    我觀察自己與其他人的行為時，發現任何人都可以改變自己，只要他（她）有改變的慾望。我認識一個人，經常打電話給我，討論她個人的問題。她的生活是由一些不同形式的相同錯誤構成的一個永無止盡的循環。我非常關心她，因為她俱備無限的潛力。然而，我觀察她與周遭的人們時，我發現一種共通的現象：追求悲慘的熱情。


    我當初無法相信這種現象，後來在一位心理學家Karen Horney的著述中發現相關的解釋，某些人會陷入自我毀滅的循環中，並在一種強烈的熱情驅動下，不斷重覆相同的錯誤。


    這種程序纏繞在一種有組織的微妙體系中：謬誤的自尊。這是一種非常普遍的心理，幾乎存在於我認識的每一個人身上（包括我在內）。所以，我認為這是一個值得探討的主題。'
