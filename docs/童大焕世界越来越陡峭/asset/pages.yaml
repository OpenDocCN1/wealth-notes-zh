    2

    2019 年 8 月 26 日，中央财经委员会第五次会议举行，这是时隔四个月之后中央财经委再次开会，会议重点，是“研究推动形成优势互补高质量发展的区域经济布局问题、提升产业基础能力和产业链水平”。


    对于城市控人还是增强人口承载力？表述有变化——“当前我国区域发展形势是好的，同时经济发展的空间结构正在发生深刻变化，中心城市和城市群正在成为承载发展要素的主要空间形式。”


    还有这么一句话：增强中心城市和城市群等经济发展优势区域的经济和人口承载能力。


    补充一个重大历史背景：


    在 2014 年 7 月，国务院曾发布关于进一步推进户籍制度改革的意见，其中提到，城区人口 300 万至 500 万的城市，要适度控制落户规模和节奏，严格控制特大城市人口规模。


    2019 年 4 月，国家发改委印发的《2019 年新型城镇化建设重点任务》中提到，超大特大城市要调整完善积分落户政策，大幅增加落户规模、精简积分项目，确保社保缴纳年限和居住年限分数占主要比例。


    五年过去，表述的变化意味着对规律认知的变化，意味着未来政策的趋势性变化。


    就在 27 日，国务院研究中心助理研究员高敏在《21 世纪经济报道》上发表评论称：本次会议的提法意味着：特大、超大城市的人口政策可能发生巨大变化，原有限制发展的思路开始转变，而是顺应规律，通过扩大土地供给，提升人口承载能力等方式推动人口向大都市和周边城市集聚。未来，都市圈作为参与全球竞争与合作的主要载体，这是中国城镇化的重大趋势性变化。'
