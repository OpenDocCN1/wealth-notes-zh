  md: '加坡和伦敦是利用拥堵费成功解决城市交通拥堵的典范——笔者注）……前一阶段，根据《深圳经济特区道路交通安全管理条例》有关规定，深圳提出了拟征收路外停车场停车调节费调节交通出行、缓解交通拥堵的思路和措施。为充分听取市民意见，于
    2014 年 8 月和 10 月先后召开两次听证会。从听证会情况看，征收路外停车场停车调节费存在较大争议，大部分听证代表不赞同，部分听证代表提出了采取小汽车限购措施的建议。近期新的政策规定，对未列入国家、省两级目录管理的行政事业性收费，公民、法人和其他组织有权拒绝缴纳。因此，路外停车场停车调节费等经济手段目前已不具备实施的条件。根据《深圳经济特区道路安全管理条例》第七十六条第一款第（一）项的规定，市政府可以实行机动车保有量增量调控措施，治理交通拥堵。国务院《大气污染防治行动计划》明确规定，根据城市发展规划，合理控制机动车保有量，特大城市要严格限制机动车保有量。”


    说了那么多，关键词就一个：对公共权力而言，“法无授权不可为”——对于未列入国家、省两级目录管理的行政事业性收费，公民、法人和其他组织有权拒绝缴纳。也就是公权机关无权收，想收也收不到。另外一个则是国务院明确规定，可以控制汽车总量，特大城市更要严格限制机动车保有量。


    从这个角度来看，深圳有关方面其实是依法执教的典范。他们关心的是“于法有据”，至于“是否有用”、“是否侵犯公民权利”、“是否增加腐败机会”等，倒是只能退而求其次了。


    我们以前常说“政令不出中海南”、指责下面“歪嘴和尚念错经”，但仔细分析，往往发现常常是“问题出在下面，根子却在上面”。要剪掉计划经济、计划思维那根盘踞在脑后的无形辫子，要真正像十八届三中全会所说的让市场主导资源配置，还需要“从头做起”、“从上面做起”。不论是对于“超大城市”的人口和规模控制理念，还是对城市汽车保有量的控制理念，抑或是更大范围内的发改委，都不过是一个换了马甲甚至连马甲都没换的计划控制思维。对权力致命的自负、对社会超强的控制思维，必将带来致命的全社会的不讲理、腐败和混乱。


