    1300 多平方公里。美国纽约面积也不过 1214 平方公里，而日本东京圈也只有 2188 平方公里。今天，即使东京圈的人口已经超过 3500 万，占到全日本的三分之一，人们仍然在向东京迁移，而且这一人口向东京集聚的趋势出现在全日本总人口下降的背景下。如果不是因为市中心的区位越来越重要，谁愿意出越来越高的价格住在那里？上海复旦大学教授陆铭
