  md: '别看中国当下有十二三万家房地产开发商，但 99.9%以上都只配称得上融资商，他们既不懂建筑也不懂城市化，只知道拿地、融资、找建筑师设计、找建筑商盖楼，然后寻找或制造无数概念忽悠消费者，这些概念包括政府的政策、规划、山水田园，旅游度假，养生养老等等。他们惟一的追求就是把房子卖掉赚了钱走人，即使有心，也未必真正懂得如何给客户提供真正有人常住有价有市的房子。圈地，造概念，画饼，这就是过去
    17 年来中国大陆开发商干得最多最得心应手的事情，大开发商小开发商都一样。


    大开发商也会有失误，甚至也会公开跟人。我 2014 年底反对一个网友买某县的郊区别墅，没反对成功。大几百万元砸进去，也是大开发商的，卖房时还有托，说愿意加价一二百万买他的房子，我说你立即卖给他，却不见下文。其实房子还有的是，而且几个月过去到现在哪怕政府大规模救市了也一分钱没涨价。


    很多人没有注意到，环北京地区最有价值的燕郊，恰恰是大开发商最少甚至几乎没有全国性大开发商进驻的地方。燕郊比较大的兴达、燕大、汇福、福成、意华都是本土开发商，美林和天洋号称是北京开发商，但是美林在北京项目极少，剩下项目基本都不在环渤海；天洋号称北京注册，但算不得大开发商，更不是具有全国性影响力的开发商。但是，像香河、固安、廊坊等地，华夏幸福基金、万科、绿地、万达、万通等均已入驻。燕郊区位优势远高于香河固安廊坊等区域，1998
    年中国房地产市场化以来却几乎没有品牌开发商进驻。


    这说明了什么？说明了两个问题：一，一个优质地段，即使没有大开发商，房地产市场照样风生水起；而这些地方的好地块基本已经被当地开发商拿光，地方政府也没有像其它非优质地区一样俯下身来邀请大开发商给自己撑门面；二，这件事情从另外一个侧面说明大开发商的眼光也不怎么样，放着优质地块不要（等再想要时已经要不到了），偏偏一古脑儿扎堆到非优质区域。


    当然，大开发商纷纷扎堆非优质地区也是有原因的，那就是地方政府八抬大轿请这些大神，通过这些大神的品牌效应抬升当地房价，挽救当地半死不活甚至濒临死亡的房地产市场。中原某地在一场大的民间集资危机过后，房地产市场一片萧条，当地政府就是通过延请一批大开发商的方式，慢慢地把房地产市场重新救起来的。


    当然，地方政府延请大开发商的方式，不再是古代的八抬大轿，而是货真价实的真金白银。这个真金白银就是极低的地价。虽然说公开招已是国家规定房地产用地出让的唯一方式，但地方政府会有千种变通方式。


    这样一来，大开发商以极低的价格拿地，却往住能够卖出极高的价格，同时得到地方政府、银行和各种融资渠道的格外青睐，因此，他们的抗风险能力往往反而高于那些小开发商，所以可以守着高价待价而沽。


    在这场地方政府和大开发商的勾兑盛宴中，他们双方一拍即合的目的都是共同的：把一些本身没有多少区位优势的地块炒作成区域中心，然后把房子卖出高价，拍屁股走人。至于这个地方最终是否会成为区域中心，不是这些开发商考虑的问题，也不是任何短暂的政府官员考虑的问题。最后落到消费者手里的房子，是可以百年传承的宅子，还是最后空置无一人的鬼城，没有人管你着想，消费者只有自己考虑、自己兜底。所以，奉劝一切购房者，有钱也不能任性，创业容易守业难，挣钱容易花钱难（难在学问），没有足够的知识，守不住大业主。虽然大大小小的开发商也不断地在空间设计、室内设计上精益求精，但比起区域、地段战略性、方向性选择来说，这些只能是锦上添花的东西，不可能根本上改变区域格局。不管是商业地产，还是住宅地产，都改变不了“地段，地段，还是地


