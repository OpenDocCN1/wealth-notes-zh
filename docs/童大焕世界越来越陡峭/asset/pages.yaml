    # 政治家的远见与职责在造人而非造城


    通过《为什么政府规划都是失败的节奏？》一文，我们知道，由政府和官员主导城市规划普遍存在贪大求快、急功近利、只计眼前、不顾后果等现象。这是由官员任期有限的内在体制机制决定的，官员的短期任期与经济和城市发展的长远要求形成尖锐的、永远不可调和的矛盾。解决问题的惟一办法，是彻底转变政府职能，不插手微观经济活动。市场权利还给市场，政府只管国防、治安、法治规则与维护，以及，国民的教育、医疗、社会保障等公共事务。甚至，我认为政治家的惟一的远见与职责，就在于“造人”，而不在于“造经济”和“造城”。


    当一个国家把大部分政府收入和国债都用来做经济类、基础设施类投资而不是用来做“国民投资”的时候，这个国家再多的税收和债务都是不堪使用的，因为任期有限的官员是在用别人的钱办自己的事，既不讲节约也不讲效率，更追求“多多益善”快马加鞭，“有条件要上，没有条件创造条件也要上”，因为成本和债务都是别人的，政绩和腐败收入都是自己的。而教育、医疗、社会保障等“百年树人”的事情，自然被各级政府和官员抛诸脑后，顶上嘴上动动嘴皮，做些口惠而实不至的承诺。


    这样一种政府职能成本倒置的国家和时代，是不可能有未来的国家和时代。腐败和环境破坏与污染因此一骑绝尘，百姓被时代的车轮抛在身后甚至碾在脚下，国民的身体健康和智慧双双委靡。而最终，无论是地方债还是鬼城空城遍地，都要由中央和全体百姓来买单。无穷无尽“前仆后继”的官员，则每每成为政治斗争和反腐的牺牲品，或身败，或名裂，或战战兢兢不得安宁，没有几个能够功成圆满。这种时代背景下，上至天子下至庶民，没有一个人不成为牺牲品而得以欣然出任独善其身。借用黄仁宇《万历十五年》中的话来说：益因为这样的制度已经山穷水尽，没有一个人能够置身事外。


