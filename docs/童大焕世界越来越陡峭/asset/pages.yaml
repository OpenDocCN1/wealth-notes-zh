    # 乡村沦陷——管制失败加制管制和落后


    2014年12月16日，网友张祥前在凯迪社区猫眼看人发了篇附阳短文《农村老家一片荒凉》，全文614字：


    “昨天回到了农村老家，农村老家是一片荒凉。走很长的路都没有看见一个人。'
