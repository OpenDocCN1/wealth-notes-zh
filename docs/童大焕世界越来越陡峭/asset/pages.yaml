  md: '一定比有非正规就业好？中国号称没有贫民窟，但青壮年农民工只能住单身工棚，“五十岁以前没有性生活，五十岁以后没有社会保障”（秦晖语）是不是比“没有贫民窟”更没有人道？发达国家也并非没有大规模贫民窟，前几年的法国骚乱就是从贫民窟燃起。


    试图用“先验正确”来取代自我修正，是不少学者和政客的通病。它制造了无数人类悲剧。大的一般说，只举城市化本身之一例：台北建筑师夏铸九在《充满敌意的都市：台北建筑师眼中的中国城市问题》中谈到，人类历史上曾经发生过多国用行政力量将人口赶回乡村的悲剧。柬埔寨“红色高棉”时期，有几位留法学生根据他们所学的理论，认为这些涌入城市的贫民都不应该留在城市里，于是把人们大量的赶回乡，并由此引发流血冲突。这是柬埔寨最深刻的历史伤痛之一。资本主义城市不会产生这种状况——人们住在城里，你不能把他们赶回乡村——而是会以“市场规律”的形式，产生各种不同的追逐。


    非正规小商贩的地下就业形式，也比城管凶神恶煞灭绝地下就业强很多吧？既没有发达国家提供足够正规就业的能力，又想越过发展阶段要发达国家的表面光鲜，这样的政治洁癖难道不比非正规就业更恶？它不应该是严肃学者推崇的吧？


    其次是妄想用特殊性取代普遍性，犯了基本的逻辑错误。“中国是如此特殊，其复杂性必然是超越西方话语的。”这样的话，几代中国人耳朵里已经听出老茧。难道中国人不是人？中国特殊论可以取代普世价值和规律？世界上就你中国复杂？要说复杂，小到一个家庭都很复杂哩！


    第三，要么是故意隐匿信息，要么是缺乏全局视野下的理性思维能力（所谓理性，是指在正确认识全局基础上采取适当的行动——斯宾诺莎）。一叶障目甚至歪曲真相。在这篇
    5800 字访谈里，这一问题至少表现在两个方面：


    一方面，他反对资本下乡却没有反对权力下乡。他说：中国是发展中国家，但是城市化为什么还发展的不错？其中有一点很重要，就是恰恰中国有不同于一般发展中国家的特殊政策和制度安排。一是城乡二元结构，二是中国农村土地集体所有分包承包的基本制度，三是建设用地制度或者更大层面上说中国土地制度。这三个特殊制度使进城农民可以保留返回家乡的权利。他认为中国体制性的城乡二元结构正在发生历史性的变化，正在由过去剥削刚性的城乡二元变成保护刚性的城乡二元结构。他提醒，资本下乡和土地流转存在危险，稳健的城镇化是中国现代化之福，而激进的城镇化很可能翻车。


    这里多处存在混淆甚至颠倒事实之处。贺雪松自己也承认“我在全国调研时感觉很焦虑，因为全国的县城到处都在建鬼城，建大量的房子。”那么鬼城是怎么产生的？为什么我们的城市面积扩张会
    3 倍于城市人口增加？不正是因为由政府独家征地同时土地“集体所有”予取予夺更容易吗？这是“保护性的城乡二元结构”吗？那些几千万上亿被强行征地又没有获得应有的市场价补偿的农民，“保留返回家乡的权利”了吗？如果允许资本下乡和土地归农，斩断权力乱征地的手，鬼城是不是会更少一些？即使卖地后无法返乡，农民获得的补偿是不是会更高一些？无视现有城镇化模式下的超级激进，却被一顶“激进”的大帽子扣在了还未发生的资本下乡和土地自由交易上，这不是一个合格的学术研究态度和方法吧？


    不论是中国社科院2010年的调查，还是人口流人大省四川省 2014 年的调查，都发现一个问题：由于担心在城市入户以后农村的土地和房屋权利得不到保障，九成进城农民哪怕其中一半已经举家安居城市，甚至已经近半在城镇买房，也不'
