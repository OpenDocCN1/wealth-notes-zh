    # 第三章 进不了的城市回不去的故乡


    # 乡村从来不是文明的摇篮


    全球范围内的城市人口到 2011 年才过半，因此，今天的人们绝大多数都有乡村生活的记忆。在少年不识愁滋味、距离产生美等社会心理背景下，城市人的乡愁不断附加对乡村的美化。人人都说故乡好，不知农村有多糟。事实上，乡村不仅从来不是文明的摇篮，而且在农药、化肥、工业污染的多重作用下，仅仅半个世纪过去，多数农村早已是“寂静的春天”！而人与人之间的关系，为一堵墙搞得头破血流、为有后无后下药的并不在少数。乡村式淳朴，有时只是懦弱与无能的代名词；城市式宽厚，往往才是强大与慈悲的同义语。伟大的制度与文明构建，无疑更多地来自城市而非乡村。


    “早在卢班·普坎开始在（印度）班加罗尔为雅虎公司工作之前 2500 多年，城市就已经成为了文化交流的门户。珠江沿岸的港口、丝绸之路沿途的城市，以及古代帝国的其他中转港口，都为世界各地的旅行者提供了会面和交流思想的便利。文明的情感碰撞主要是在城市里进行的，知识通过城市从东方传播到了西方，也从西方传播到了东方。”（爱德华·格莱泽《城市的胜利》）


    今日人类最璀璨文明的源头，不在农村，而在城市，在古希腊的雅典，现代哲学和城邦制度发端于此。雅典是一个强大的城邦，希腊是哲学的发源地，是柏拉图学院和亚里士多德的讲学场所所在地。苏格拉底、克罗多德、伯里克利、索福克勒斯、阿里斯托芬、欧里庇得斯、埃斯库罗斯和其他著名的哲学家、政治家和文学家都在雅典诞生或居住过，雅典也因此被称作“西方文明的摇篮”和民主的起源地。当然，它也是奥运会的起源地。公元前
    5 世纪和 4 世纪，雅典在文化和政治上的成就即已对欧洲及世界文化产生重大影响。


    今日中国，除了梯田和一些少数民族的特色山寨，几乎所有的历史名村都是输血——即城市反哺乡村的产物。外出经商、做客、求学的人们，带着财富、人脉、学识、信息、技术、眼界，或叶落归根，或伸手指援，在故乡修桥施路、兴'
