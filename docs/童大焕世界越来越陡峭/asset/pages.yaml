    日前，大连万达集团老板又将一笔在中国赚得的 12 亿美元投向了美国，买下了位于贝弗利山庄的一块地。上个月，王健林刚刚在芝加哥开始进行一个 9 亿美元的酒店项目。据
    7 月底进行的一项私人调查，尽管中国政府最近采取措施支持房地产业，可是全国房地产市场上月出现了加速下滑的现象。这更多地意味着市场增长放缓，而非崩盘，但李嘉诚和王健林似乎认为，其资金如今可在其他地方实现更好的回报。王健林
    2012 年还耗巨资收购 AMC 连锁电影院，并于去年宣布计划在纽约投资 10 亿美元建酒店。大连万达集团还在西班牙和英国购买房地产。李嘉诚则将注意力转向了欧洲，今年早些时候他在欧洲获得了一个项目，在伦敦划易舍姆区开发
    3500 套公寓。去年，据说李嘉诚的和记黄埔有限公司在欧洲收购了总价超过 40 亿美元的资产。


    另据英国《每日邮报》8 月 13 日报道称，中国首富王健林正将其商业帝国拓展到澳大利亚，计划投资 17 亿澳元（约合人民币 97.1 亿元）在当地发展房地产项目。澳大利亚贸易与投资部长罗柏（Andrew
    Robb）欢迎万达的投资。


    当然，不同的企业和人生阶段有不同的境界和选择。李嘉诚、王健林、许家印的选择是他们自己的风向标，不是整个楼市风向标。他们过去的辉煌也不等于能够看清所有未来的方向。但是，在这中国城市化和房地产中场休息的当口，我们确有必要暂时放慢脚步听一听中国大地的脉搏和心跳，对上半场进行清晰的总结，然后才能对下半场进行准确的预判。“城市规划是一门基于远见的学科。”'
