    新华网 2014 年 12 月 15 日有一则消息说，国务院扶贫办国际合作和社会扶贫司副司长刘文 15 日在接受中国政府网在线访谈时说，尽管中国经济总量居世界第二位，但是面临的贫困形势依然严峻。按照中国扶贫标准，到
    2013 年底还有 8249 万农村贫困人口，全国有 12 万多贫困村，832 个国家扶贫开发工作重点县和集中连片特困困难地区县，长期困扰贫困群众的吃水难、行路难、用电难、上学难、就医难、增收难、贷款难等诸多问题还没有得到根本解决。目前全国有
