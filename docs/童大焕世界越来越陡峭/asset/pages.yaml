    # 第二篇城市化的逻辑指针


    # 什么是城市？


    人类最早的城，应该是作为军事防御工具而存在，可能称为城堡更合适。所以要有城墙，豪华一点的修上护城河。但全社会以农业为本位的生产方式并没改变，名义上有城，本质上还是农业社会。那个时代，北京故宫的紫禁城和福建永定土楼的土楼没有本质区别，只不过前者更大、更奢侈豪华。土楼是微缩的紫禁城，紫禁城是放大的土楼。


    另一层意义上的城，是传统农业社会下商旅落脚、码头等形成的小城镇。比如唐朝诗人张继著名的《枫桥夜泊》描述的场景：


    > 月落乌啼霜满天，

    江枫渔火对愁眠。

    姑苏城外寒山寺，

    夜半钟声到客船。


    当代台湾诗人郑愁予对这方面的描写可谓刻骨铭心，他的《野店》这样写：


    > 是谁传下这诗人的行业

