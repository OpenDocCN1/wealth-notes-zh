    # 我为什么敢说谁当总理谁降准

    ——兼论经济学研究的方法与范式


    2014 年 5 月 28 日，“凤凰财知道”@我，也许想让我关注或评论他们的《财知道第 186 期》：近日一些“首席经济学家”集体喊话降准，朱海就表示，很多降准呼声来自于房地产、金融部门，他们有自己的利益的考虑，决策者和公众应该擦亮眼睛，希望总理不要理睬这些呼声。结果我在评论后又重新原创一条微博，判断总理一定会降准（降低存款准备金率）：“每个人都从自己角度出发，总理必须从全局出发。所谓理性，就是在正确掌握全局基础上采取合适的正确的行动。谁当总理谁降准，不管他今天呼吁降还是不降。这是形势所迫。”“很多人只会套用经济学公式来谈中国问题，纸上谈兵，误国误己。殊不知经济学最应该研究的是各种环环相扣的变量和约束条件。生活不是写诗生活是数字。经济学也不是写诗是环环相扣的约束条件。无视普遍联系的各种现实约束关系，贸然呼呼房地产就让它死吧，是典型一叶障目不见森林的非理性，盲人摸象。”仅仅
    48 小时之后，我的判断就得到完全验证！新浪网 5 月 30 日 21:07 消息：“中国国务院周五（5 月 30 日）在常务会议中明确货币政策微调力度，明确对符合结构调整、满足市场需求的实体经济贷款达一定比例的银行适当降低准备全率。国务院表示，要保持货币信贷和社会融资规模合理增长，加大‘定向降准’措施力度。


    30 日下午 3 时左右还有搞经济研究和评论的朋友嘲笑我。我发了条微博：“有人说‘童老师，不是不想接手，北京的房价是工薪阶层的老百姓接的住的吗？’我说：‘你认为接得住就直接得，你认为接不住就接不往。’说此话绝无唯心主义，而是牵扯人生最基本的预期管理和欲望管理。‘真实购买力’在预期与欲望管理面前有巨大弹性！”这条微博被这位朋友理解为我在呼呼别人'
