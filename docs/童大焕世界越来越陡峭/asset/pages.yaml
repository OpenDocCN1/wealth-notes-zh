    # 绝对私有财产是对自由的亵渎

    ——再谈汽车限行


    每个人有自由，前提是不妨碍他人的自由。真正的自由主义的自由是不妨碍别人的自由，正如德国哲学家康德所坚持的：人要自律，不能为了个人的自由而妨碍他人的自由。


    以前，不仅人在大街上有格外的自由，就是猪在大街上也有格外的自由。熊培云写过一篇《中外历史上的几次“禁猪令”》，其中谈到 1539 年法国弗朗索瓦一世当政的时候，这年秋天，这位被称为“法国文艺复兴之父”的伟大皇帝颁布了一道敕令，解决巴黎的卫生问题——“我们充分认识到我们的巴黎城及其乡镇十分恶臭，如此破败乃至于一些地方骑马和乘车均有极大的危难和不便……”


    早在中世纪的时候，许多家猪在巴黎城中漫步，不仅随意吃喝拉撒，自由散漫，甚至危害到了皇家安全。1131 年一头猪钻到了国王胖子路易六世的儿子的马蹄之下，导致这位王位继承人坠马身亡。猪在巴黎的自由历史从此被改写了，它们纷纷被圈养起来。到十四世纪的时候，法律还专门规定小城堡的专员们有责任杀死在街上闲逛的猪。当然，圣安东皇家修道院里的猪仍然可以尽情享受巴黎街道上的繁华景象，可以在巴黎的烂泥里嬉戏、觅食，谈情说爱，因为国王弗朗索瓦一世先生恩准了这项特权。


    到了 1539 年秋天，弗朗索瓦一世的敕令其实是禁令，它涉及诸多清洁城市的条款，比如：


    > “我们要求和命令各街警卫官、区长和民团五十人队长向巴黎司法官及其刑事官在法令公布一周内书面报告各街区所有没有茅厕下水沟的房屋。一周后，命令所辖房屋领主和业主，门房和租户，让其知晓在接到书面在册命令三个月内必须修建茅厕下水沟，否则将没收其房屋……”（第二十四款）'
