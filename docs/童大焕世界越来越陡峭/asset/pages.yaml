  md: '个人的生命都不过是一个个时间单元而已。有太多等待保障房的人，由于等待时间长，等“幸运”地拿到保障房指标时，郊区保障房的价格已经超过开始登记排队时市区商品房的价格。


    第二大成本是比较优势的成本。很多人只会算赔钱看不到赔账，以为保障房比周边房价低就占到便宜。事实上，品质、人群、配套都决定了房屋价格，保障房即使若干年后能以商品房形式入市，它的价格也永远赶不上周边商品房价格。这叫一分钱一分货，放之四海而皆准。


    第三大成本就是由地段、地理环境和居住人群组成的环境成本。它看不见摸不着，却是非常昂贵的一项成本。


    地理环境成本跟周边的商业配套和文化环境息息相关。保障房往往建在偏远的缺乏配套和文化积淀的地方，形如文化沙漠和孤岛。打个比方，我有位朋友住在北京潘家园附近，孩子小时候经常跟着家长在周边逛，结果孩子就深深地迷上了翡翠石头，压岁钱零用钱都花在这上面了。家里摆满了石头。现在孩子上高中了，志向是将来学珠宝。如果小时候没有那样的环境，孩子的将来也许就是另一种选择。这另一种选择当然未必比现在的选择差，但越是文化丰富的地方，孩子选择的余地就会越大，靠近他真正的兴趣所在的可能性也越大。


    小区居住人群组成的文化环境和思维习惯成本也是看不见摸不着但无所不在的。环境有可能会左右一个人的性格和思维习惯，什么样的环境产生什么样的人。董藩说：“这话说出来有些刺激：穷人更要尽量躲避平民窟，不是市忿，是要防止消极态度和懒惰影响下一代，也要看孩子看到成功者的人生态度和行动力。”以我对贫穷世袭这个问题的思考和研究看，最难改变的往往是一个人从小养成的思维习惯。而这个，往才是决定人贫富差距的最关键因素。中国古代孟母三迁的故事，未必有多么深奥的理论，却是深谙其中的道理。


    我住的北京通州某小区，当初买房的时候是外销公寓，小区环境不错，当时是除了别墅以外的通州最高价。孩子上高中的时候，小区来了一对在国外酒店管理服务了很长时间的老外（女方是中国人），在小区开了个酒吧，孩子打球时认识了男老外，有时间就去他的酒吧，有时买点饮料，有时帮他们打打下手，一边学英语聊天，培养了英语口语能力和英语对话的自信。没想到这一点居然在高考后偶然申请美国大学时派上了用场，不仅顺利申请成功而且获得了不错的奖学金。所以，文化的作用无处不在，你不知道什么时候就有用处。


    有人会说，我拿到保障房的也未必是穷人，我见过200平方米的保障房，楼下好车不少。这个问题分两个方面看：一是早期保障小区的确是可以申请，当时开发商求着人们买，所以居住人群的品质未定，未必是穷人和穷人思维者扎堆。二是后来有一些地段较好的保障房小区，的确也有人钻空子或者利用权力关系鸠占鹊巢，但那人要么自己不住要么即使住了，用这种方式和穷人抢福利的人，人品素质也高不到哪里去。未来，随着保障性住房审批的严格化，穷人扎堆的现象可能会越来越严重。解决的办法之一，就是贫富混居，城市中心保留一些城中村或者村民自建小区，新区建设配建一部分保障房。


