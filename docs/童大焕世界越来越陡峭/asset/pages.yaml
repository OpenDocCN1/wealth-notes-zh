    2011 年 1 月，国务院出台新“国八条”，规定各直辖市、计划单列市、省会城市和房价过高、上涨过快的城市，在一定时期内，要从严制定和执行住房限购措施，即本地人限购第三套房，而外地人必须缴纳社保或纳税满一定年限方可购房。此后全国共
    46 个城市出台限购政策，至今已超过 3 年。限购之下除了延迟了一些高端楼盘开发商（比如绿城）、使房产供应下流化、使一些不限购的三四线城市不仅房价快速上涨而且很快供应过剩的同时，也使地方经济和财政受到严重打击。从决策层到许多经济学家，普遍高估了中国经济的健康程度、低估了中国经济对房地产的依赖程度。限购的退出，不仅是市场经济和公民自由权利保障的必然要求，也是经济回到正常水平的必然要求。


    今天，当我们回过头来检讨限购这一不符合市场逻辑和规律的政策之成败得失，会发现它对抑制大中城市房价上涨的作用并不明显或很难科学评估，但对购房人负担增加、市场资源错配的负面作用却非常明显。一切不符合市场规律的作为，最终一定会受到市场的惩罚。


    首先，限购不符合城市化的发展方向。限购政策首先保的是本地户籍人口的购房权益，要求外地户籍购房者须提供一年至五年社保或纳税证明，严重影响、误伤了外来投资者、大中专毕业生、外来务工人员，与城市化规律形成逆向政策导向。


    其次，限购误伤了改善性需求，包括首次改善型购房和再次改善型购房，都受到了抑制和限制。


    第三，以抑制投机投资、稳定房价为初衷，支持和保护自住性购房需求的限购政策，其实在某种程度上并没有让刚需族获益，反而加重了他们的负担。以济南为例，统计显示，济南成交的
    100-120 平方米三居室，2009 年占比为 8.09%，2010 年增至 12.06%，而在限购实施后，2011 至 2013 年占比均超过 20%；与之相对应，80-100
    平方米住房成交占比在限购之后有明显下降。在成交价格段中，总价 80 万-90 万的房子占比从限购前的不足 6%，一下增至 10% 以上，最高达 14.29%。价格与面积段的变化正好呼应。一大批原本可以先买小房子过渡，等条件具备再换大房子的“刚需”，受限购影响，“一步到位”买了更大的房子。因为限购产生的这种行为选择给刚需族增加的负担，真实发生着。更不说限购政策之后，银行按揭优惠利率的大幅度取消甚至在基准利率上上浮给刚需族造成的损失。


    第四，正如限购之初，我在 2011 年 2 月 11 日 FT 中文网的文章所预言的，在方兴未艾的中国城市化尤其大城市化的市场推动下，二线城市的房价没有泡沫，或者泡沫较小；相反，三四线城市房价虽低，但多数是由地方政府的强力推动，而非市场真实需求，这种情况下三四线城市的房价泡沫反而更高。如果严厉的限购政策进一步将社会流动性挤向三四线城市，那么我们将未必为三四线城市的泡沫买单，并且不排除大量基层地方政府因此加大征地拆迁热情，既加剧已经很激烈的征地、拆迁矛盾，也为将来留下更多类似“鬼城”、“烂尾城”之类的“城市化浪费”。事实不幸而言之。


    未来中国，全面取消限购是大势所趋。但由于事物发展都有惯性，在今天大量非限购三四线城市在过去三年多时间里住房供应大量过剩、隐含无限地方债和金融风险的背景下，需求高昂的一线城市取消限购的日程暂时还看不到，否则会加速其它城市的崩溃。除非三四线以下城市实现了房地产和金融软着陆，或者一'
