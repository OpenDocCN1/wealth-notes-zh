    # 收入和自由指引着人口和城市化方向


    马光远在微博上说：“经济学家奥尔森发现一个惊人的现象：每平方公里的人口密度越大，人均收入越高。低收入国家每平方公里的人口：肯尼亚 25 人、民主刚果 13
    人，阿根廷 13 人，巴西 16 人；高收入国家：德国 246 人，比利时 322 人，日本 325 人，荷兰 357 人，新加坡 4185 人，香港 5000
    人。人口密度越大，收入越高。”


    其实这个现象一点也不惊人，而是城市化发展的一个必然现象。在城市化背景下，传统农业社会的人口——资源关系发生了本质性的逆转，人口不再依赖人均资源而发展，而是人口本身成为最根本的发展资源：人口越多越密集，就越能吸引世界各地的资源为城市和人口服务！


    如果不是在全国或全地区范围内平均人口密度，而是在城市建成区范围内平均人口密度，会发现人口密度越大收入越高这个现象更加明显。为什么人类会走向城市化？根本原因就是城市使人更自由、使人均收入更高。世界上有很多地广人稀的地方，城市化程度也非常高。比如澳大利亚，700
    多万平方公里土地，只有 2000 多万人口，其中三分之一聚集在悉尼，六分之一聚集在墨尔本。


    而就是在这样的地区，建筑师们还在憧憬着它未来的城市天际线和人口密度更高！我手里一直保留着 2014 年 5 月 4 日的一份报道《建筑师憧憬悉尼未来 30
    年：楼高要增一倍》，报道说：几位顶尖的建筑师指出，悉尼必须在未来 30 年内将大厦的高度翻倍，才能保持国际都市的地位。


    服务于 Urban Taskforce Australia 的三家顶级建筑公司制作的 2050 年悉尼天际线图片被刊登在《每日电讯报》上，以鼓励公众对悉尼的未来进行讨论。此前澳洲统计局预测，墨尔本的人口将在未来二十年内超过悉尼。因为普华永道最近的一份报告发现，过去十年悉尼的年度经济增长率为
    2.2%，落后于墨尔本的 4.7% 和布里斯本的 4.4%。Urban Taskforce 的首席执行官强森（Chris Johnson）称，悉尼必须增加
    CBD 的经济产量才能保持领先于墨尔本的状态。强森指出，悉尼的都市规划者应该设定这么一个目标：让数万人住在市中心，并创造一支与国际金融和顾问服务有关的更大型劳动队伍。此外，关键的中心如帕拉玛打、车士份、好士国、Liverpool
    和 Penrith 也应该采取类似的方法，不过规模应该缩小。


    现在，墨尔本、布里斯本和帕拉玛打都有高于悉尼 CBD 楼群的摩天大厦即将兴建。强森认为，悉尼受到了当时的规划规则的限制，因此 309 名高强的悉尼塔（Sydney
    Tower）很长一段时间以来都霸占着 CBD 最高楼的名号。强森称，世界各地现在有多二十多座高楼是悉尼塔的两倍高，包括吉隆坡 452 米的 Petronas
    Towers，台湾 508 米的台北 101 大楼和迪拜 828 米高的 Burj Khalifa。


    未来世界城市的总趋势就是向越高、更密、更集中的方向发展。中国也一样。'
