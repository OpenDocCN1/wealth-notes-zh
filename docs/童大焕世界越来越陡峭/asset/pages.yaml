  md: '人口争夺战的一个历史性前奏。未来城市之间、区域之间的竞争，归根结底将落实到人口（而非人才）的竞争，谁能在竞争中“收获”更多的人口，谁就将在下一轮乃至更为久远的未来竞争中占据竞争优势和至高点，进而赢得最持久的繁荣和进步。


    众所周知，持续多年的各地地方政府招商引扩大竞赛，已经导致制造业地产总体系严重过剩；而持续时间长达8年以上的城市特别是中小城市住宅用地供应产量能高达人口增量3倍以上的小城镇大跃进或者说“空间城市化大于人口城市化”，使一些中小城市特别是中西部地区的中小城市鬼城、空城的风险日益显现。随着2014年楼市分化在毫无征兆中突如其来地降临，下至个人投资者，中至开发商，上至各级政府终于开始意识到传统的政府主导城镇化的风险，开始将更多的注意力转移到“人口的流向”、“人的城市化”方向上来。


    在广东之前，已经有无锡、南宁等地通过与户口挂钩的购房政策调整争夺人口，表面上是救楼市，客观上是争夺人口资源。无锡市2014年4月22日发布通知，自5月1日起，在无锡市购房面积60平以上且在该市有稳定工作的人员允许配偶和未成年子女来锡落户（此前条件为购房70平米以上），直接跟南京、扬州、苏州、常州争夺人口。南宁的救市政策，以促进北部湾经济区同城化为由，将北部湾经济区内的北海、防城港、钦州、玉林、崇左市户籍居民家庭视为南宁市户籍居民家庭，允许在南宁市购房。


    比起无锡和南宁直接让人口为楼市背书，广东户籍新政并没有将户口与楼市挂钩，因此更具有人口争夺战的示范意义，其内容一共也有6条，包括：全面放宽本科以上学历毕业生入户。凡在城市有固定住所、就业的大学本科以上学历毕业生，均可在全省大中城市落户，落户地与实际居住地不一致的，可随时迁移到实际居住地。逐步调整珠三角大城市入户政策。除广州、深圳外，在珠三角其它城市（珠海、佛山、东莞、中山、江门、惠州）有合法稳定职业满五年并有合法固定住所，参加社会保险达到三年的异地务工人员，可以迁入当地常户口。等等。其中中小城市的落户条件更为宽松。


    广东此次户籍新政也有遗憾，就是根据十八届三中全会关于“全面放开建制镇和小城市落户限制，有序放开中等城市落户限制，合理确定大城市落户条件，严格控制特大城市人口规模”的精神，仍然采取了“严格控制广州、深圳两个特大城市人口规模。广州、深圳两个特大城市将加快调整人口结构，重点吸纳社会经济发展需要的技能型人口落户”的政策。一方面，用户口控制不住人口的；另一方面，未来城市化的趋势仍然是越来越趋向中心城市、超大城市集中而不是相反。在这种情况下，及早预见并顺应超大城市的发展趋势，对个人和社会都有利。事实上，是不是“特大城市”，以及“特大城市”的城市人口区域范围划定，是否有明确的标准和名录呢？如果没有，各地方政府可以通过一定的“解释权”进行挪腾移，以更有利于城市发展和人权进步。


