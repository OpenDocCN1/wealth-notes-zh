    回到“一横”，即便使李嘉诚下定决心今日迁册英属开曼群岛的外部原因到底是什么？那就是“占中”及相关的政治环境。媒体都已经注意到，李嘉诚 9 日宣布旗下长江实业及和记黄埔重组的“千亿重磅”消息时，更直接了当地高调回应关乎香港发展前景的政改问题。


