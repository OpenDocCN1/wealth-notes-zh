- pgno: 154
  md: '虽然我不同洪晃关于“没有人去探讨中国司法问题，没有人询问中国制度中器官移植的细节”的判断，但是还是赞成她关于“群氓”找替罪羊作为“罪魁祸首”的判断。我认为洪晃对于自身面对这个问题时在道义和利害面前的反省是诚实、到位的：


    > “因为我妈妈是 1996 年换肾（另一次是 2007 年），我可以非常肯定地回答，我妈妈换肾所采用的器官与 1995 年被执行死刑的聂树斌无关。然而这并不说明我不用反思整个器官移植的过程。妈妈两次换肾，我们都不知道肾源是哪里，更不要说是谁的。作为病人和家属，我们只是庆幸在需要移植的时候，能够及时找到匹配的器官。我们从来没有参与寻找匹配的器官，也没有打听过器官的来源。这一切都是医生安排的。而为什么我们不参与、不打听，是因为我们有一种感觉，这个过程可能我们不想知道，可能很恐怖。所以虽然我肯定我妈妈的肾移植与聂案无关，但是我不能肯定她的肾移植跟王树斌、张树斌或者其他死囚无关。我们都得了选择性道德麻木症。……这里涉及到太多道德问题、利益问题、亲人的生死问题，这些问题的沉重有时候是难以接受的，所以当社会的‘恶’给我们带来利益和方便，我们选择合十，说一声阿弥陀佛，感谢老天爷的厚待。而对于‘恶’，我们假装看不见。我妈妈换肾的过程中，这的确是我们的行为。”


    但是丁启阵先生不同意洪晃的文章，写了一篇《司法杀人与器官移植——兼论洪晃女士的作法法》，认为“公众质疑权贫，一点儿都不无知，不愚蠢。因为，没有权贵阶层的存在，就没有这样粗暴的取肾。倘若公众全体（洪晃女士口中的‘群氓’）都敢于挺身而出，向权贵发出质疑声，说明公民化社会已经实现了。”并认为“洪晃女士开脱的方法有三个：一是无视事实，二是模糊视线，三是反戈一击。”


    我倒觉得洪晃的作文明法一是一二是二，边界非常清晰，值得所有人学习。倒是丁启阵见的全文立意“因为，没有权贵阶层的存在，就没有这样粗暴的取肾。”完全站不住脚，因为失之简单，所以就失之粗暴，进而使社会因边界不清而容易堕入洪晃所言只懂得找替罪羊的群氓社会。


    这个立意之所以简单粗暴，表现在三个方面：一是死刑的存在和对死刑犯在秘密状态下摘取器官的理由，并非是为了权贵阶层做肾移植，这是两个完全独立的体系，甚至迄冤案与死刑之间也没有必然联系；二是对死刑犯秘密摘取的器官，也并非为权贵服务，虽然有权有钱人的确是依次优先享受到这些服务；三是章含之本人既是器官秘密移植体制下的受益者，同时也也是受害者。在一个器官捐赠和使用合法透明的时代，捐赠者（不管捐赠者是正常死亡人还是死刑犯人）和使用者之间的信息是对称的、是透明公开的，捐赠者及其家庭可以得到适当的经济补偿和社会荣誉，使用者除了付出手术费用和“器官成本”之外，如果双方信息透明，有的还适于出于感恩适当帮助捐赠者，从而可以挽救一些濒临破产的家庭。


    但是在器官移植秘密黑箱制度下，原本可以是人间佳话的，只能变成丑闻。捐赠者可能得到的补偿或救拨被操纵黑箱的利益链条给切断截留了，器官使用者可能付出更高的经济代价和机会成本才能获得器官，同时也常年处在孤独无望地等待器官过程中，两败俱伤，惟一的得利者只有黑箱操作链条。在这种黑箱操作链条下，作为器官使用者章含之及其家属祝见等人，是更不知道器官来自哪里、是不是来自死囚或者哪个被黑社会非法摘取器官的人，也无法追溯那个死囚是不是缘于冤案，自然更无法知道，冤案的产生是出于司法制度本身的问题，还是出'
