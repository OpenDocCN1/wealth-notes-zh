  md: '度开发问题，城市建设空有房子却没有产业支撑，最终只能是人去楼空、当地政府负债率大幅上升。（李迅雷）


    “鬼城博士”杜猛则是定义空置率：“空置率是指某时段空置房屋面积占房屋总面积比率。又分存量和增量空置率，6个月未使用即为空置率标准。参照国际惯例，本人认为：空置率在5%-10%之间为合理区；10%-15%之间为警戒区；15%-20为危险区；20%-25%以上为积压区；25%-30%为存量和增量产能过剩区；30%以上楼宇房价溃败区。”


    我加一个：鄂尔多斯空置率超60%吧？但现在房价据说趋稳在八九千。这是有道理的，因为从政府到个人都钱太多，都是‘羊煤土气’浮财堆的，反正资金没有地方去，放着就放着。资金链没有像温州一样断裂，于是成了“吊在空中区”。但温州可以随着未来资金链恢复而房价恢复上涨，鄂尔多斯则会长期吊在半空有价无市。


    未来“鬼城”如何消化？空置率和银行杠杆率双高的，有可能出现房价较大幅度下跌；空置率还不算太高调的，或者银行杠杆率不那么高的，有可能长期维持。市场和行政的两种力量也会逐步化解一部分空置率：减少土地供应，减少银行贷款，城市开发权部分还给民众，尤其是在旧城改造方面。不要悲观和失望，老城区的旧城改造，如果开发权还给民众，未来还有很大的发展空间。


    如果过去有人太相信政府规划，在三四线以下城市的规划新区买了房和长期没有入住，有条件退出的尽量退出。办法是将非优质资产置换成中心城市和城市中心的优质资产。只要货币超发的态势不变，只要城市化还没有完成，一二线城市回流的人群还会有，今天的县城还有房价上涨的空间。过去的鬼城空城有两种情形，一种是城市跑太快了人口还没有跟上，农村的还没进来、一二线城市的还没回来，这些城市随着供应量的减少和人口的流入，未来还有消化空间。怕的是供应量过剩太多的城市，未来永远没有人口去填。尤其是警惕那些“大手笔规划”的新城，越是纸上描绘天花乱坠、空间扩得一口吃天的，越要退避三舍。


    未来会有很多过去供应量过大的中小城市，或被动或主动选择收缩城建规模。比如鄂尔多斯市长今年宣布未来3年内将不再新建商品房，并对积压待售房屋，一方面进行合理降价销售，另一方面鼓励入驻企业集团，并把符合条件的、符合国家标准的房屋由政府进行回购，转为保障房。（2014年3月8日《京华时报》而就在去年，鄂尔多斯还有官员表示要跨省追捕造谣其“鬼城”者，“我们已经把一些对鄂尔多斯造谣的相关材料往公安部报了。”（2013年9月23日每日经济新闻网）


    选择收缩城建规模的，还有南京市宣布2014年城建规模将由755亿元压缩为652亿元。2013年上半年还曾热衷于引进房地产开发商造城的贵阳市也调整了城市开发策略，2014年起，贵阳市住宅用地单宗将不能超过20公顷，且5万平米以上的项目将由贵阳市发改委核准。


    这些都说明政府开始在市场规律面前低下了一贯高昂的头。未来将会有更多城市采取集约化、高密度主城发展模式，改变以往的摊大饼、助长城市病和地方债务的城市扩张模式。如果说过去16年城市化和房地产扩张模式是“城市包围农村”往外扩张，那么未来的主流模式将回归“农村包围城市”，在主城区精耕细作。


    正是基于中国房地产在国民经济“支柱地位中的支柱地位”，社会经济承受不了它的过度震荡，因此，我在2014年2月25日和3月3日的微博中再一次准确预言了今年的楼市调控“新思路”：'
