    2018 研讨会”上如是说。


    周牧之认为，中国在城市治理上过分强调人口规模和密度给城市环境、基础设施带来的压力，缺乏对高密度人口是城市发展活力重要基础的认知。未来中国需要纠正这种错误认识，提升城市治理的智力，通过提高
    DID（Densely Inhabited District），即人口密集地区的质量和规模，提升城市的发展活力和品质。


    相关报告还从人口、GDP、二氧化碳排放量、PM2.5 等方面的表现，对东亚两大都市圈—北京都市圈（比较市域）和东京都市圈（由东京都、神奈川县、琦玉县、千叶县组成）进行了比较分析。


    分析表明，北京的城市面积约为东京都市圈的 1.2 倍，常住人口和 DID 人口都约为东京都市圈的 60%，北京的 GDP 大致只是东京都市圈的三成，人均 GDP
    只有东京都市圈的一半。但是，北京的单位 GDP 能耗却是东京圈的 7.4 倍，单位 GDP 二氧化碳排放量为东京都市圈的 4.7 倍。结果导致人口规模和 GDP
