    北京十五、十一五规划都以严格控制人口为目标，并没有成功，实际增长人口是控制目标的 4 倍。2014 年北京采取了史无前例的控制力度，效果也非常有限。统计显示，2014
    年，北京市关停退出了 392 家一般制造业和污染企业，拆除中心城市交易市场 36 个，淘汰老旧机动车 47.6 万辆。截至 2014 年年底，北京市常住人口
    2151.6 万人，比上年末增加 36.8 万人，增量比上年减少 8.7 万人，增速比上年回落 0.5%。


    在今天工业产能已经严重过剩（当下中国以 47%的工业化率对应 37%左右的真实城市化率，发达国家 20%工业化率对应 80%以上城市化率，世界平均 26%不到的工业化率对应
    50%以上城市化率；我国第二产业产能各行业过剩率都在20%以上，有的甚至高达百分之四五十，属于严重绝对过剩）的背景下，通过产业转移或再造带动城镇化的做法，已经基本上是一条死胡同。而像动物园批发市场、大红门批发市场一类去年被强行拆迁的服务业商品交易市场，则本身就必须以足够的人口聚集为前提，此类市场搬迁的同时，基本上已经宣告市场的消亡，不可能异地重建成功。在工业向服务业转型过程中，行业创新和新增基本上依赖于一个又一个智慧头脑的彼此合作与碰撞（以人口聚集为前提），此类智力资源，政府控制的能力将越来越小。这一切都决定控制人口不会最终获得成功。


    同时，环境污染问题是一个“同一片蓝天环球都如此滚烫”的问题，别说是北京郊区县镇，就是河北的污染都会严重影响北京，任何关起门来的办法都不可能杜绝“空气全球流通”问题。把污染产能转移出北京市区，未必能够减少北京的污染，甚至有很大可能，正是由于北京长期以来的人口关门主义使周边人口不能及时转移到北京服务业中来，以及北京周边地区缺乏长三角、珠三角周边一样良好的商业文化传统，导致北京周边被迫长期深陷于污染巨大的工业甚至重工业产能中无以自拔，加剧了环北京地区的污染，也严重妨碍了京津冀地区由第二产业向第三产业的转型与变革。


    人不可能踏进同一条河，人更不应该在同一个问题上一而再、再而三地犯同一个错误。如果北京郊区尤其是远郊区能够譬如一些理路所言的实现“就地城镇化”，那么人们为什么要背井离乡甚至“逃离首都”地跑到北京郊区来，而不会在自己有田有地别墅般的家门口实现“就地城镇化”？这是一个理论和现实必须面对的问题。


    在此本人严重建议北京有关方面重新审慎地讨论北京“要不要控制人口、如何控制人口”等问题，把这些重大理论问题切实解决了，再来付诸行动不迟。否则，行动的执行会打折扣、效果会打折扣甚至适得其反。同时，也向北京有关方面推荐一些城市化方面的理论专家，他们分别是：


