    # 京津冀一体化绝非扁平化


    叶檀说：法国经济学家 Thomas Piketty 的新著《二十一世纪的资本》引起广泛关注。克鲁格曼在纽约时报专栏专文评论，纽约客杂志也长文介绍作者及其观点。Piketty
    的主要研究对象是经济不平等和收入差异。通过对各国（尤其中国）大量数据的收集分析，认为资产收入所起作用已远超工资收入，正在对将来社会产生不可估量的影响。货币时代，工资不是主流，投资之神才受追捧。


    的确，货币的本质是信用，在金融信用消费时代，货币的信用本质格外突出，使“你不理财，财不理你”的事被迅速放大。如何有效打理货币和资产，成为21世纪人类生存必修课，谁不会投资理财谁将被财富抛弃，管你本是博士还是总理。我指的是法治社会的总理，不是总经理。


    在中国大陆，理财人最应该抛弃的一个观念，就是一切相信政府，把政府当成万能的神，以政府的指针为指针，以政府的导向为导向。我们在向市场经济艰难转型，市场的规律在顽强地起作用，不以任何人的意志为转移，但计划经济时代政府左右一切控制一切的“遗迹”还牢牢扎根在大陆多数人的脑海中，比剪掉前清遗老遗少的辫子还难。


    最新例子是关于“京津冀一体化‘和所谓’政治副中心‘。2014 年 3 月 19 日‘北京政治副中心初定河北保定’的消息从《财经》杂志传出，称未来将有一批国家部委下属的事业单位和教育机构率先搬迁至保定。当天，国家发改委和保定官方都表示不知情。3
    月 27 日，新华网称，保定确定为‘副都’并将承接首都部分行政事业功能。却原来是河北省单方面表示将打造京津冀三角核心区，做大保定城市规模，以保定、廊坊为首都功能疏解的集中承载地和京津产业转移的重要承载地，与京津冀形成京津冀城市群的核心区。


    风乍起吹皱一潭死水。明明是一群情愿的自作多情或短期政绩和开发商炒作，却引得楼市投资市场风生水起。在京津冀一体化概念的推动下，随着‘政治副中心’传言不胫而走，保定楼市如饮兴奋剂，一夜之间开始骚动。国企员工'
