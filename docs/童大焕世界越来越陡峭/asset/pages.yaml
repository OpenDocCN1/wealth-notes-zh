  md: '铁新城、度假海景山景房等方面也是过剩的，但由于房地产是不动产，在我们真实城市化率只完成 36% 的背景下，局部过剩不会演变成全国性的过剩。因此，银行资金再度向房地产行业集中，是一个九四归一的必然选择。虽然降低贷款利率、鼓励投资对银行有切肤之痛，但是比起迫在眉睫的金融风险，“两害相权取其轻”，何去何从，是一个再清楚不过的二选一选择题。


    未来的楼市调控，除了由限购限贷向鼓励投资至少是投资者与普通购房者一视同仁之外，另一大调控方向就是从价格调控向供应量调控转变。当下中国房地产的主要矛盾并不是价格与需求的矛盾，而是一些地方供给过量需求不足而另一些地方供给不足而需求量大的矛盾。价格与需求的矛盾是城市化过程中的必然结果，任何人无法改变。如果要说谁是其中的利益集团，那么每一个购房需求者都是利益集团的一部分，因为正是人口向少数城市集中带来了这些城市的房价上涨，没有房价上涨也就不会有地价上涨。而在人口迁出的地区，大量优质房源价格是在相对下跌甚至绝对下跌的，比如甘肃玉门市，以及未来像鄂尔多斯这样的地区。


    在 2014 中国房地产品牌价值研究成果发布会上，中国住房和城乡建设部政策研究中心主任秦虹表示，房地产市场总体保持上涨的态势正在发生变化，房地产市场的复杂程度上升，结构性问题突出，未来房价或涨或跌的波动将成为常态。今后的市场管理将去行政化为主要方向，因地制宜。“这并不意味着中国将放任楼市任意发展。”秦虹说，政府干预主要是从规划方面，提高科学化水平，以及加快长效机制的建设。


    所谓的结构性问题突出，其实就是房地产供应的结构出了问题而且是出了大问题：我们在不该搞小城市大跃进的地方搞了小城镇大跃进，结果供应严重过剩，这些地方就应该调整规划，努力消化库存甚至收回未建设的土地。而在供应不足的地方，应该在城市密度和城市面积扩张等方面调整规划，加大供应。当然，这样一种顺应城市化发展潮流的“新科学规划”，可能与“以中小城市为重点”的“新型城镇化”存在深刻矛盾与冲突。在冲突面前，我想，归根结底应该是市场说了算，规律说了算。


    面对房地产变局，个人买房和投资者怎么办？其实万变不离其宗：既不要认为房地产投资已经失去机会，也不要认为房地产仍然是遍地黄金。房地产投资是当下普通中国老百姓可以抵抗通胀的惟一工具，这个惟一性仍然牢不可破。但如果以为房地产仍是遍地黄金，闭起眼睛乱买，不学习，不思考，被各路公说公有理婆说婆有理的专家搞得无所适从，那你做什么也别想成功。


    而现在正处楼市调控政策变局当口，将是最后一次最好的投资时间窗。切记，在任何国家和地区，房地产都是国民经济重要支柱，都是普通老百姓财富的主要存在方式。中国由于过去“只筑城不强商”和政策一再延迟城市化反城市化，导致今天房地产和城市化的双重补课效应，使得中国房地产的国民经济支柱地位更加牢固，权重也更大。


    中国未来一定会向市场化方向改革，不改不行。包括国企改革、土地改革、金融改革、教育改革等，但改革活力需要很长时间才能释放，而且也不是瞬间释放而是缓慢释放，且改革过程中还会有很多曲折和阻力。因此，对房地产的依赖会相当长。


    楼市投资是中国普通老百姓最干净、机会最大的一个投资领域，机会面前人人平等，只不过看你敢不敢、会不会把握。一位未见过面的微友一则微信典型地说明了人们的心态：“据报道，国内四大国有银行对房贷已经暗自松绑了，只是'
