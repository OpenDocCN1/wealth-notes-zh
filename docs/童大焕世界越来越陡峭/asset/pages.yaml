  md: '提出，加快户籍制度改革，全面放开建制镇和小城市落户限制，有序放开中等城市落户限制，合理确定大城市落户条件，严格控制特大城市人口规模。


    2014 年 7 月，国务院《关于进一步推进户籍制度改革的意见》规定：城区人口 300 万至 500 万的城市，要适度控制落户规模和节奏，严格控制特大城市人口规模。


    # 2


    今天这个不到一百字的变法，却可谓之“70 年未有之大变局”，它意味着我们在经历了百般曲折之后，主流观念终于对城市化规律认知发生了根本变化，意味着未来相关政策趋势性变化。


    > 这是一个非常重大的、国家战略性的、趋势性的改变，事关国运和民运，值得每一个中国人认真关注和思考。


    为什么要有这种变化？在我看来，它的重要意义，正如我 2011 年 10 月出版的《世纪大迁徙》一书封面所言：“高密度大城市化”具有“拯救中国”的战略意义。


    高密度大城市化，对于提高人民生活水平；保护自然，保护环境；加快创新；提升中国的国际竞争力等方面，都具有全方位战略基础意义。大城市化，是解决中国许多问题的总开关，大而化之有：


    国与国之间的竞争，越来越变成城市与城市之间的竞争。竞争的实质是效率，是速度，看谁跑得更块，看谁效率更高。在同等制度、文化环境下，如果城市没有一定的规模和密度，就没有足够“创新的浓度”，也就没有足够的速度和效率，在国际竞争中必然落后。


    要想全面彻底提高人民生活水平，也必须从大城市化入手，让绝大多数人告别小农经济和小工业，全面提高效率，提高分工与合作。


    要想保护地球，保护自然，更是从大城市化入手，让更多的人远离自然，远离对自然环境的破坏，让自然回归自然。


    # 3


    国人有“不患寡而患不均”的传统思维，可能源自孔子。《论语·季氏篇》第十六写道：“丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之，既来之，则安之。”


    字面意思是：不担心少寡，而担心不平均；不怕人民生活服务劳，而怕人心不安定；均衡了，也就无所谓贫穷；和平了，也就不怕少；安定了，国家社稷才不会倾覆。而贫富差距太大，即使国家富裕也危机四伏；没有那么巨大的贫富差距，大家都会比较满足，民众和平团结，国家就会强大。做到这样，远方的人还不服，便发扬文治教化指引他们来。他们来了，就使得他们安心。'
