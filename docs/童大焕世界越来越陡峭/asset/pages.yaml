  md: '没有什么变化，实际上说明了人口分布受环境制约很严厉，是不可以轻易改变的。现在，有很多人给胡焕庸线扩充了内容，认为他不仅仅是一条人口线，也越来越证明这条线有存在的自然基础、经济基础和社会基础。人有选择性，地理环境的影响很深刻，我们能做的就是顺势而为。而科学家根本的任务就在于认识世界，在认识世界的过程中能够发现一些规律性的、稳定性的东西。


    对于胡焕庸线能不能破的问题，中国科学院政策与管理科学研究所研究员王铮认为，胡焕庸线很重要。胡焕庸线的存在主要依赖于两个因子，对于北方而言第一因子是降水，对南方而言则是地貌。地貌不等于地形，它包括海拔、地表崎岖度、地表覆盖物特征、水系特征等。这里的南方、北方以秦岭-淮河线为界，在秦岭淮河线附近，严格意义上即生态环境脆弱带中心线位置偏离高原直线，但是不影响胡焕庸线的基本走势。


    可以说，胡焕庸线锁定了中国经济地理格局，不承认这种锁定，是违背自然规律的。在中国，特别是苏联学派的代表，曾经想用另外的线代替它，搞产业布局和城市化（比如历史上的大小三线建设、西部大开发等——大焕注），结果摔得很重。实际上，胡焕庸线作为生态环境过渡的梯度带，环境特征不稳定，形成生态脆弱带，也是我国贫困县集中地带。研究它，很重要。


    换言之，如果气候没有大的变化，胡焕庸线是很难被突破的。其实，即使气候变化了，地貌的约束仍然存在。


    对于胡焕庸线的“打破”和“突破”问题（这两个词的区别，只有深谙文学游戏的部分中国人能懂，在我眼里，人为改变才叫“破”，自然改变那就叫变化或改变——大焕注），王铮认为，前者主要是指改变经济布局，而后者强调的是改变自然背景。


    尽管王铮认为只有解决了“突破”问题，才能回答李克强总理提出的“打破”问题，并且坦言，“李总理，你提的问题太难了。”但他依然表示，胡焕庸提出胡焕庸线的年代还没有克鲁格曼的（第二地理“天性”（nature，本性）即人口与产业集聚和交通区位也会影响区域发展）理论，第三产业特别是信息化也未兴起，全球变暖还没被发现。“刻舟求剑（认为胡焕庸线不能破——大焕注）的想法是书呆子想法。”


    “突破”是“打破”的基础，所以要先研究“突破”问题，在自然背景改变的前提下，经济布局可能会自然地突破某些约束，特别是西部某些水资源条件好的地方，既然改变不了它们的“第一地理天性”，那么我们可以改变“第二地理天性”，通过初始化适度聚集人口与产业，形成某些产业枢纽城市，突破经济格局，从而打破胡焕庸线锁定中国经济发展格局的现象。


    华东师范大学人口研究所终身教授桂世勋也认为“当时我们国家90%是农村人口，主要产业是农业。他在当时我国第二产业、第三产业很落后及其从业人员比重很低的情况下没有分析这些产业布局对中国人人口分布的影响，是完全符合当时国情的。现在我国农村常住人口占总人口的比重已低于50%，全年第一产业增加值在国内生产总值中所占份额也降到了10%。所以我认为胡焕庸线如果要“破”，关键是国家在推进新型城镇化建设中要加大胡焕庸线西北半壁第二、第三产业的发展及基础设施、公共服务资源的合理配置，更好地提高当地人们的综合生活质量，使得线西北半壁人口的比重有所上升。我们既要看到我国自然环境难以根本改变，由自然环境制约的产业和人们的居住环境、宜居意愿都会受到不同程度的影响，要大幅度地缩小胡焕庸线两半壁人口分布的比例可能性不大，但也应看到通过上述努力将以当时的县级行政区划为界的西北半壁人口占总人口


