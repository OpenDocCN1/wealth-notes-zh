    # 小学生房价指数三大致命缺陷


    我在一篇文章里说“服务业大发展，紧盯 CBD。当然，连片建成区人口低于 100 万的城市，不要轻易造什么 CBD 概念了。”有读者问我：“CBD 不正是政府一手主导和规划的吗？CBD
    多数不都在郊区新城吗？童教授怎么您的观点才几天就 180 度大转弯了？”我说：“你见过 CBD 都在郊区新城？你指的是上世纪 80 年代还没有房地产的时候的事情了吧？”


    如今北京、上海、广州的 CBD 在二十年前当然都是荒村僻野，但今天已经是非常成熟的市中心。我一再强调信规律不信规划，信市场不信市长，乃是基于过去政府主导的城市大跃进已经制造了大量“过剩城镇”的事实。但也没有完全否认政府规划的作用，只是建议大家不要只看规划，纸上谈兵小孩子都能画出世界上最美的蓝图：保守起见，至少要等规划的人口入住率达到
    6 成以上再投资不迟。我们面向未来思考问题，不能把一切都无边界往前推，否则，今天我们的哪一座城市过去不是乡村？这道意意味着每一座乡村未来都能成长为城市？


    题外话放在开头说。今天的主题是，网络上有一篇很火的文章，认为小学生人数的增城趋势，将在很大程度上决定未来几年该城市房价升降。文章根据各城市在 2008 年年底到
    2013 年年底小学生人数增城情况，排出《房价最有理由上涨的 10 城市》，分别是：厦门、上海、廊坊、东莞、深圳、苏州、郑州、北京、长沙、泉州。


    我赞成作者的一个观点：通过各城市统计局公报，是无法获得准确的人口流动情况的，因为人口涉及政绩效绩（比如根据多方信源进行推论，北京实有人口当在 4 千万上下，但公布的常住人口只有
    2 千万出头——大涣注）。对于大城市来说，人口增速太快，是很难向上交代的，因为主流意识形态尤其是历代最高决策层都在城市化进程中提倡均衡发展，强调“区域化”甚至“就地城镇化”，大城市都要控制人口增量。人口增长太快，反而是政绩瑕疵。此外，人口多了人均
    GDP 就少，就根难有机会在媒体上炫耀超过韩国、新加坡等发达国家和地区，官员政绩就不好看。


    但是，用小学生数量增减来反推人口增减、进而推断未来房价走势，也存在三个致命缺陷：第一，我们现在的人口数量、小学生数量统计都是按照行政区划进行统计的，而不是按照更为科学的城市连片建成区域进行统计。这样的统计一定会形成巨大的误差，就是把城郊和城乡结合部的人口和小学生数，误当成所在城镇的人口和小学生数。这个量级的误差可能会非常大。就像我前几天发文说到，上海五大郊区新城，人口增速事实上远远小于各新城所在区县全县人口增速。第二，由于各大城市拼命控制人口，甚至像北京这样地方黔驴技穷到把小学生当人手、想尽办法抬高小学、幼儿园入学门槛诸多原因，造成流动人口与小生流动不成比例，流动人口数量远大于流动儿童数量。标志是留守儿童人'
