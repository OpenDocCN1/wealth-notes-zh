    # 京津冀一体化将加速集中式大城市化


    有学生问：“怎么京津冀一体化？是不是依然有计划经济的基因。”我答：“基础设施完善和打破区域壁垒是必要的，但它只会加快集中而非分散。市场会沿着计划相反的方向走。”


    京津冀一体化的动议和设想，早已经不是一年两年的事，也不是十年八年的事，而是起伏跌宕酝酿十多年的事情，每一阶段都会有不同的提法，比如“环渤海都市圈”、“环首都经济圈”等等。名词和包装最不需要成本，因此这方面变化最多端，但本质内容基本上换汤不换药，就是希望京津冀地区协调均衡发展，改变首都“过于集中”和“环首都贫困带”现象。


    但是设想归设想，过去多年京津冀三省市基本上是同床异梦，各唱各的调，因此大多数设想基本上无疾而终。最搞笑的是北京方面甚至还曾担心到河北燕郊的轻轨通了会降北京房价，因此名义上支持带地里绝对反对改善交通。这个事情还是国家发改委城市和小镇发展研究组中心主任李铭在一次对话中透露的。他说，河北省环北京经济圈，沿着北京边界14个城市设立了环北京经济圈试点城'
