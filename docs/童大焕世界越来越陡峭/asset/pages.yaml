    # 第四部分 关于“城市极限”的经典文章与实践验证


    2016 年底，重庆邮电大学移动通信学院大焕城市化战略研究院推出《石破天惊大焕城市化战略研究院推导出城市半径极限！》一文（作者：童大焕、李亚琳，创作时间：2016
    年 10 月 17 日~11 月 4 日，11 月 7 日首次修订），文章主要观点：


    日本近半个世纪以来大力建设郊区新城以试图实现均衡发展的努力，基本上是完全失败的。和很多媒体所表达的最远半径 50 公里不同，琦玉、千叶、神奈川距离东京都最核心地段银座实际通勤半径都在
    30 到 40 公里之间。而且是就业中心与居住中心之间的距离。


    考虑到中日两国体制机制和人口总量的诸多不同（比如，中国不是轨道交通先行），中国超级大都市的极限半径应该比日本还短。


    最终结论：在服务业主导的城市收缩发展背景下，中国大城市的单极化积聚效应、收缩发展态势会越来越明显，“区域均衡发展”的城市极限半径不宜超过30公里，而且至少要有轨道交通和公交专用道配套。考虑到中国特色的户籍制度和住房限购限价等原因，再宽限距离不得超过总半径
    40 公里。超出这个范围，不论是城市规划还是企业和个人投资，中长期陷入“环大都市鬼城圈陷阱”的失败概率大增。


