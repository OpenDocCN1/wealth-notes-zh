    文章说，上世纪末开始，上海出台了一系列人口疏解的政策，其中主要包括以下几项：1，严格限制市中心的居住用地出让和住宅建设；2，对市中心进行大规模旧城改造，把旧区居民拆离市中心；3，在远近郊各处兴建大型居住社区，以承接新增人口与市中心迁出人口；4，在郊区建设独立新城，增加就业岗位。'
