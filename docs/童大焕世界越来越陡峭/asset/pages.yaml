    从 2019 年 8 月 26 日到 8 月 31 日，两次重要会议从宏观政策到实际操作层面，对中国未来城市化方向做出了重大战略转型，意味着城市价值大分化的时代正式到来！


    8 月 26 日，中央财经委员会第五次会议指出：经济发展的空间结构正在发生深刻变化，中心城市和城市群正在成为承载发展要素的主要空间形式……增强中心城市和城市群等经济发展优势区域的经济和人口承载能力，增强其他地区在保障粮食安全、生态安全、边疆安全等方面的功能。


    它意味着，“大中小城市协调、一体化发展”的城镇化战略时代渐行渐远，取而代之的是“大城市+城市群+都市圈”，大量中小城市和乡村，以后主要只承担粮食安全、生态安全、边疆安全等方面的功能。


    8 月 31 日，“国务院金融稳定发展委员会第七次会议”则从实际操作层面，再次确认和配合了上述战略方向的转变。


    金融委会议通稿指出：充分挖掘投资需求潜力，探索建立投资项目激励机制，支持愿意干事创业、敢于担当、有较好发展潜力的地区和领域加快发展。高度重视基础设施、高新技术、传统产业改造、社会服务等领域和新增长极地区的发展。


    2


    新的城市化战略更加符合世界城市化潮流，更加符合经济规律，会给未来中国带来更加持续、稳定、健康、快速的发展。


    以往的城镇化发展战略，姑且把它称为“土地的城镇化”，讲究的是投资一个地区，强调区域相对均衡，通过中央转移支付，发达地区支援不发达地区发展。但是效率很低，并且常常导致有借无还（因为有投入没产出）的地方债过度扩张甚至失控。


    现在，金融政策要支持有较好发展潜力的地区和领域加快发展，不再搞“一碗水端平”了！


    毫无疑问，它会使我们整个国家的发展效率更高，质量更好，速度更快，国际竞争力加强。


    那么落后和相对落后地区怎么办？有办法！通过“增强中心城市和城市群等经济发展优势区域的经济和人口承载能力”，鼓励和支持落后地区的人们自由迁徙到发达和相对发达地区。'
