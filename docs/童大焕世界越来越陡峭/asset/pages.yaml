  md: '府拿钱，即使表面上全覆盖，也是极低水平甚至只具有象征意义，无法解民众的后顾之忧。如果是那样，则再美好的愿景也是远水，解不了进城百姓的近渴。


    那边远水不解近渴，这边近忧就在，就是户口进楼，土地、农房怎么办？国务院的意见只说“现阶段，不得以退出土地承包经营权、宅基地使用权、集体收益分配权作为农民进城落户的条件”，落户以后呢？他们还是农村“集体成员”吗？如果是，双重身份如何解决？如果不是，今后权利的旁落就是农民心头之忧。


    农民不是傻瓜，户口进城实惠未得，农村财产随时有忧，他们是不会轻易让户口进城的，哪怕一家人可能已经进城定居半辈子。四川的调查已经显示，哪怕举家随迁城市的占近五成，已在城市购房或打算购房的均有两成多，也就是近五成农民工已经有一定能力在城市安家落户，但总量只有10.7%的农民愿意落户城市，充分说明，哪怕农民有能力落户，大多数出于自身利益考虑也不愿意落户。而从分析可得知，有能力在城市安家落户的农民不愿意落户，最重要的原因还是担心自己在农村的土地和房屋产权得不到保障。


    只要农民的土地和房屋没有实现完整的家庭财产化，没有脱离集体的束缚变成家庭可以完全自由支配和交易的财产，农民身在城市心在家乡的状况就将很难改变。这种情况下，将会导致很长历史时期内的农村居民“两栖人”状况：人在城市，心在农村；土地和农房即使荒废也不放弃，或者在城市赚钱回老家盖房，影响在城市的安居乐业。它可能导致的后果也是严重的：直接影响孩子的就地上学，造成旷日持久的留守儿童留守老人现象；从产量到品质，直接影响粮食安全。因为种粮是副业，三天打鱼两天晒网，所以土壤、种子、品质都没有严格的筛选；直接影响财富积累和城市安居，因为很多人赚了钱还是回乡盖房，长年空置，城市却无房可住。


    综上所述，耕地、宅基地退出机制是农民是否愿意进城落户的一个关键因素。而这个关键因素，取决于土地、农房是否成为农民独立的财产权利；取决于土地、农房是否能够建立不局限于“村集体内部”的城乡统一交易市场。


