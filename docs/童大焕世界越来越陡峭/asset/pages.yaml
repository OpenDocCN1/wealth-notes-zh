    《华尔街日报》的文章写道:


    20 世纪 80 年代开始，科技的发展使得人才越来越集中；超级明星员工进入超级明星公司工作，公司又把他们集中到超级明星城市。于是富者愈富，城乡差距拉大。


    人们曾以为互联网会引领人类走向劳动力分散的黄金时代。从某种程度上来说，确实如此：远程办公者的比例如今达到了至少 20%，并且还在增长。然而，超级明星公司却坚持让最优秀的员工集中到全球总部，至少也要是大区办事处，置成本和拥挤于不顾。


    哪怕是最先进的通信技术也有局限：它们承载的信息不如真实生活中面对面协作时那么丰富。Slack、电子邮件和即时消息无法传达语气，导致误解产生的例子太多了。


    一家公司越依赖创新——把所从事领域中的技术利用到极致——超级明星员工的合作也越趋紧密。众所周知，谷歌唯二的 “11 级” 工程师（一般是 1 到 10 级）是坐在一起编程的，他们注视同一块屏幕，使用同一个键盘。


    Mozilla Firefox 前任副总裁 Johnathan Neggle 指出，虽然远程办公长期看来是可持续的，然而对于一家创业公司而言，在最初几年里，任何减缓发展的举措都可能意味着输给另一个更迅速的竞争对手。不管情况是否如此，这已是科技领域公认的一种思维方式，各家公司——甚至只是
    “以创业公司方式思考” 的大企业都将其奉为金科玉律。


