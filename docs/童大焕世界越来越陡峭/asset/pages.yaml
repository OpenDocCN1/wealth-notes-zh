    # 失败的人口和产业郊区化


    从 2003 年起，和当下中国许多大城市的郊区化政策潮流相一致，上海在占其土地总面积九成以上的郊区实施土地、产业、人口“三个集中”战略，试图以此“根本打破郊区现有的经济结构和功能布局，确保实现土地集约、产业集聚和人口集中，使郊区成为上海人均
    GDP 向 8 千美元至 1 万美元能级跃升的‘主要发动机’。”其意图和做法，都与当下中国各大都市的郊区化发展意图相同。


    但是，事实却证明，这样的发展思路并不乐观。 2014 年 4 月 8 日《东方早报》发表上海社会科学院城市与人口发展研究所副所长周海旺讲话文章认为，上海郊区新城发展遇到了瓶颈，主要表现为人口导入少产业不配套。文章说，上世纪
    50 年代，上海就开始规划卫星城。在计划经济年代也做了很多努力，但总体上不是很成功。现在的新城则普遍人气不足，人口导入少。像松江新城造了很多房子，但入住率比较低，多数低于
    60%。空城最明显的还有临港新城，房子是造出来了，房价这两年都翻番了，但目前没什么人。（说明这个区域房价大部分是概念炒作和迷信政府规划的投资者盲目入市的结果，未来必将有价值无序或者逐渐下跌一大浇注。）另一个新城发展的问题就是产业不配套，就业机会少。像有些人住在松江，但要到市区来上班，这就给交通造成了拥堵。虽然也规划了每个新城人口发展规模，但是通过什么方式促进人口从中心城区向新城区集聚，还没有一个明确的政策和激励型措施。还有投入也有问题，轨道交通的投入，中心城区主要是市里投入，郊区有部分轨道交通需要地方政府投入。上海郊区新城的教育、卫生事业人均指标都远远低于中心城区。比如人均教育经费，像原卢湾区、黄浦区、静安区，都是金山区、奉贤区的好几倍。郊区的医生数量、医院床位数也远远低于中心城区，并且教育和服务的质量也比中心城区差得多。影响教育发展的重要原因是，他们缺钱，财政投入方面，转移支付不到位。郊区一些城镇在最初的城镇建设中，并没有考虑太多的停车场所。但现今，随着私家车数量的迅速增加，郊区连靠占路停车现象越来越严重。


    还在计划经济年代，北京也是搞过很长时间卫星城规划的，最后结果也是空'
