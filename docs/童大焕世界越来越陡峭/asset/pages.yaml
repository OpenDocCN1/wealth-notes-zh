    # ## 城市化一定要走出人定胜天的虚妄


    在中国城市化的历史版图上，有两条不可逾越的红线必须被我们的子子孙孙奉若神明：一条是著名的“胡焕庸线”。胡焕庸线是中国著名的人口地理学家胡焕庸于 1935 年绘制的人口规律线，他将中国地图上的东北角黑河（爱辉）和西南角的腾冲两点连接成线，在中国地理版图上形成一个约
    45 度角的直线。它所揭示的规律是：自宋代以来的千年历史中，线东南半壁 36% 的土地供养了全国 96% 的人口；西北半壁 64% 的土地仅供养 4% 的人口。二者平均人口密度比为
    42.6:1。胡焕庸线首次直观而又清晰准确地揭示了中国人口千年分布规律，成为人类地理学上一个伟大的贡献，正因此，这条线被国际科学界以胡焕庸的名字加以命名。


    另一条不可逾越的红线，是历史学家黄仁宇《万历十五年》中揭示的长城，他说，长城是一条气候学上的等雨线。因为降雨量的不同，长城以北是游牧地区，长城以南是农耕地区。


    这两条线的重大意义在于：谁要是试图把胡焕庸线东南部的城市梦想移植到西北部，那一定是西北部的灾难也是整个中国的灾难，必将意味着西部生态的恶化及整个中国整体生态的恶化。同理，谁要是想把长城以南田园牧歌耕读传家的梦想也移植到长城以北，试图把大片草原也变成稻田桑坡，那一定的意味着草场生态的迅速恶化甚至变为一一片沙海。


