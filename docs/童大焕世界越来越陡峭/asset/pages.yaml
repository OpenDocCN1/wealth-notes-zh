    # 乡绅、文育与赓青


    “大嘴开发商”任志强在第 14 届亚布力中国企业家论坛呼吁：过去我们看到县一级官就到头了，再往下没有官了，靠什么维护社会啊？是靠乡绅。他把学校盖了，大家巴不得，如果再盖一个医院，老百姓高兴得不得了。


    任志强说得很好。历史上连接乡村与城市命运的主体是商人和由外求学、官的人，其中尤以商人为主体。他们的心灵与命运紧紧连著两头：一头是乡村，一头是城市。连接的载体是什么呢？对于乡村，平时是修桥施路、办学办医、接济乡邻，到最后则是叶落归根告老还乡，经商的，做官的，求学的，都衣锦还乡，
    重新规划建设乡村，盖乡间别墅、兴文脉信仰。今日中国乡村留下的一座座具有鲜明特色的小镇和文物遗存，基本上就是他们衣锦还乡的产物，比如宏村、周庄等等。


    在城市，则是兴建和经营地方会馆，成为地方商会所在地，也为经商暂时失意或者初来乍到的乡人、前来求学的贫寒学子提供经济资助和落脚空间。这是一整套成熟的民间自助系统。


    1949 年改变了中国社会几千年“皇权不下县”的历史，权力无尽屈地延伸到民间社会的毛细管——乡和村，但是，政权对于乡村的功能更多的是 攫取、管控，而非给予和放权。但外出商人每年回家捐资办学、修桥施路的传统'
