  md: '怎么看待李迅雷先生的《库茨涅兹周期暗示房价将下跌》？李先生认为：“我对房价走势的判断是明年或者是后年全面下跌。房价下跌的拐点或已到来。这个过程或者可以放缓，但却无法避免。人民币还是会贬值的。人民币一旦贬值的话，就导致了热钱流出。这个时候房价就会下跌了。”


    对此，我再一次想强调一下时代大背景问题。和“库茨涅兹周期”一样经常拿来谈楼市整体下跌的，还有日本楼市泡沫经验和哈里森模型。后两者也已经说了好几年了。但是这三个观察模型，都建立在发达国家和城市化作完成百分之七八十以上的基础上，与当下中国楼市面对的
    1949 年以来前 50 年基本没建房、城市化率完成只有 36% 不可同日而语。未来中国内地楼市更多的是涨跌分化不一，而不是整体性的下跌或整体性的上涨。正如金岩石所言，城市化创造的空间是稀缺资源。“当城市人口比例增长，城市化加速后，城市化达到
    30%-50% 时，以楼市标示的城市，会出现迸发，大城大涨小城小涨。当城市人口超越 50%，接近 65% 的时候，可投资的楼市会逐渐收窄，一些城市的楼市开始崩溃，一些楼市的房价疯涨。具有空间价值的城市会逐渐减少，周边城市的楼市崩盘，反而会加剧中心城市的房价的增长。”


    我们现在的城市化率只是 36%。请大家注意，不是官方数据的 53%。因为大量农民工被统计在城市人口之内，但他们并没有真正城市化。我们刚刚宣布城市化率过半的时候，我就专门撰文认为真实城市化率只有
    35%。目前，包括国家发改委城市和小城镇中心主任李铁、北大教授周其仁等等，认同的也都是 35% 左右的城市化率。


    至于人民币贬值和热钱流出，也就是人民币对美元下跌会导数热钱流出，房价就会跌。如果的确会发生这种情况，也只能是一个暂时现象。一方面是热钱占比是少数，尤其是我们仍有外汇管制的情况下，它带动的只是短期预期。另一方面，货币超发过程就是货币贬值的过程，而这个过程正是资产价格上涨的过程。所以，中长期房价一定是由城市化规律和长期货币双重作用决定的。从事金融的人士和炒股的人士常常过度夸大短期资金的影响，因为金融产品的炒作都是快进快出，这和房地产投资理财以中长线为主是不同“物种”的思路。


    大家都非常关心北京市常务副市长李士祥说“市区房价肯定要下降”的消息，在此我也做一个分析。他这话是 2014 年 3 月 5 日就京津冀协同发展、打造首都经济圈接受记者采访时说的。京华时报记者问：“有消息说，随着京津冀一体化，北京的房价会下跌，周边的房价会涨起来，您怎么看？”李士祥答：“北京市区的房价肯定要下降，一是我们的供应量加大了，特别是保障性住房。二是我们的房地产结构发生变化，房价肯定要下来。河北、燕郊房价是不是会上升？这个也没有普遍性的结论。比如将来北京有些功能纾解出去了，就没有必要在那儿买房了，功能纾解出去了，就可以在河北住，在河北上班了。整体来说，随着政府扩大保障性住房的供给，房价会回到一个合理的理性空间，应该是有这个信心的。”


    （2014 年 3 月 6 日《京华时报》）


    但是 3 月 7 日，李士祥自己也对此做了澄清。他对此回应称，对于京津冀三地的协作以及北京一些城市功能的疏解，会引起北京房价下降的说法是误解。“涨价的大涨大跌都是不正常的。”李士祥表示，首先，房价的起落还是要尊重市场规律。在政府层面，首先是逐年加大保障房的建设力度，今年要建成
    47 万平方米的保障房，135 万平方米的共有产权房。同时，去年土地供应量达到 980 公顷，今年还将增加供给。


    “以政府为主的保障体系要建立，同时以市场为主的多样性的需求体系也要建立。”李士祥表示，通过政府这些作为，能够令房价实现稳中有降。“目前已有一定效果。”


    （2014 年 3 月 8 日《新京报》）'
