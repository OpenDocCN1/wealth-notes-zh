    年，信托业完成了几何级数的爆发式增长。如今，这个套路已经逐渐生疑，就在今年，中诚信托、超日债等事情，让人看到了信托业、债券的刚性兑付并不刚性，这种中国特色的刚性兑付，有逐渐要被打破的意味。信托对开发商的贷款开始谨慎，开发商的资金链纷纷出现问题。


    “如果再加上人民币贬值，导致早些时候从海外涌入国内的资金流出中国，让作为资金密集型产业的房地产业大大承压。”（许一力《楼市拐点到 了吗？）


    银行对房地产的态度由以往一刀切的“优质资产”转向谨慎防范风险，分化一二线和三四线及其以下城市，本质上就是金融市场对房地产市场的风险预期发生了改变，进而带动了全社会的风险预期。而社会的风险预期带有相当的盲目性，整体上缺乏细分市场的能力，因此带动的是全社会的“非理性预期”，与真实的市场供求关系既有重合，也有背离之处。每当这样的机会出现，往往正是具有全局理性思维的投资人抄底摸鱼大显身手的时候。


    大方问问题之三：政府会不会全面救市？会不会允许崩盘论继续存在？会不会引导非理性预期？本轮市场现望会持续到什么时候？


    政府主导的基础设施投资和招商引资会对其实从 2011 年起就开始大走下坡路。进入 2014 年来，中国各项宏观数据回落明显，而刚刚公布的前两月用电量增速回落，印证中国经济增速放缓。国内很多学者将用电量和货运量称为“克强指数”，认为数据能直接说明中国经济走势。而学界似乎也对中国经济增速放缓达成了共识。当下，“只有房地产能救数中国”早已经是一个事实判断而不是价值判断。2013年，房地产极为惊人的表现为中国
    7.7% 的增长立下头功，房地产投资占 GDP15%以上的比重、对中国经济 20%以上的贡献、土地收入占地财财政收入 70%的份额以及 12.2 万亿元的到位资金占全国全社会融资额
    70%以上这些数字，意味着中国经济对房地产的依赖程度已经欲罢不能。面对如此因徒困境， 中国政府唯一的选择就是如我今年以来多次强调的，从抑制房价上涨转向防止房价全面下跌引发中国金融和经济崩溃的系统风险。


    还好，中国还有很大的城市化和土地改革空间，为房地产软着陆提供支撑，否则就是政府再怎么救市、再怎么试图改变预期也无能为力。土地改革带来百姓收入和财富追房价的可能，城市化则为房价提供真实的需求依托。当下中国只有36%左右的真实城市化率，到
    75%的平均城市化率，未来 20 年至少还有 4 亿以上人口从农村进入城市，还有比 4 亿还多的人口从小城市进入大城市。今天这个时代楼市深邃益周期、日本楼市泡沫经验和哈里森模型都只是表象，日本
    1980 年代前城市化就已经基本完成，中国绝不会像日本那样的崩盘，但部分三四线城市房价下跌无可避免。


    最迟下半年，由于银行系统针对对不同区域和市场的金融政策发挥作用，市场的非理性预期将发生改变，市场进入更平静更长久的调整。而非理性预期改变前的这段时期，也就是
    2014 年上半年，正是在楼市长期上升的区域间机入市的绝佳时机，不论是资金链紧张的开发商，还是对预期不明朗的二手物业主，都给了市场更大的谈判空间。


    也就是说，政府不会允许也无法承受崩盘论持续半年以上的后果，会通过“只做不说”的金融货币政策对市场预期合理引导并微妙调整，本轮房地产的'
