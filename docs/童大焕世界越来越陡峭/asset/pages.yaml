    虽然弗朗索瓦一世的“环保风暴”并没有取得明显的效果，直到两个半世纪以后巴黎依旧污秽不堪，但今天我们已经再难看到家猪们大摇大摆在城市街头自由漫步的风景了。


    中国古代皇帝出行的时候，一左一右会有两个旗幡，一曰“回避”，一曰“肃静”。躲避不及的行人可能遭到惩罚。这固然是皇帝威严的需要，但也不排除一个可能或者一个副产品就是为了安全，既为皇家
    的安全也为行人的安全，因为马车的动力毕竟是畜牲，一旦在马路上跑起来，不是想刹就立即可刹住。


    到了现在，汽车社会，汽车的威力更大，启动和制动都更灵敏，如果你走在美国街头，和汽车不期而遇，不管是不是你的绿药，那年，路上的人，绝对不会动不动声色地停下来为你让路！


    一条大街看文明，文明就是这样一点一点地向前推进和积累，虽然很慢，甚至时不时会有各种各样的倒退，但青山遮不住，毕竟东流去。


    现代人还可以牵着宠物上街上公园，但受到的禁忌约束也越来越多：必须给宠物打狂犬病疫苗；不让上公共交通工具；宠物可以自由便是但主人必须收拾干净；等等。广州最近甚至拟立法禁止宠物进公园、广场舞噪音超标直接罚会开单。不知道宠物的主人会不会以“财产自由”表示反对？不知道广场舞大妈是不会以“我的身体我做主”为由表达抗议？


    现代汽车在给人类带来极大便利的同时，也在城市以交通拥堵的形式极大地蚕食人们的吋间和生命，以尾气污染的形式极大地损害人们的健康。未来城市，以某种方式限制汽车使用必然要成为世界性的潮流，但我们却听到了一种“限车侵犯私有财产”的观点。


    2014 年 12 月 26 日下午，全国人大常委会审议《大气污染防治法》修订草案，该草案第 45 条规定，“省、自治区、直辖市人民政府根据本行政区域大气污染防治的需要和机动车排放污染状况，可以规定限制、禁止机动车通行的类型、排放控制区域和时间，并向社会公告”。当天参加会议的全国人大常委会曾有
    7 位委员在发言中明确表示了反对，他们分别是幸胜阻、吴晓灵、李安东、姚胜、王毅、沈春耀和董中原。李安东认为，这样的修改，很可能为今后机动车单双号限行常态化提供法律依据。他说：“这种条款不应列入草案。要限制对地方政府的授权。”吴晓灵说：“现在北京是一周限制一天。从严格意义上来说，这是对公民财产权的侵犯。”王毅说：“北京市已经提供了一个不好的案例，过去本来限号行驶是一个临时的，结果很多家庭都是两辆车。这是一个无法解决空气污染的不良条款。”幸胜阻说：“如果立法通过了，就给单双号限行常态化开了口子。现在不停工、不停产，要停车，老百姓通行怎么办？”沈春耀认为，限行车辆这种行政措施涉及到私有财产保护和公共政策的底线，要把道理和底线说清楚，政府没有必要给老百姓增添不必要的担忧和烦恼。董中原说，即使要限行，也必须明确政府的补偿措施，否则政府的权力太大，私权利难以得到保护，立法应当妥善平衡好公权力与私权利的关系。姚胜建议，干脆删除前述第
    45 条的内容。


    要限制对政府的授权、汽车限行政权都无法根本上解决城市交通拥堵和汽车尾气污染问题，这些观点我都赞成。但是把迫不得已的有条件汽车限行与侵犯公民私有财产权画等号，尤其是在全国人大常委会里不乏这样的观点，还是让我非'
