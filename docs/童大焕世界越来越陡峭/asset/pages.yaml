  md: '不论是 QQ 大数据、还是麦肯锡历时一年的“迎接 10 亿中国城市人口大军”深度调查，抑或是中国东北、西北、中部、东部投资效率比较，等等，无一不指向一个共同的城市化规律和方向：大城市和大城市群。大城市的空气使人自由，大城市机会更高效更高，大城市更节约土地和能源，大城市能创造更好的条件处理垃圾和污染……


    当下中国的城市化一直想邯郸学步亦步亦趋地步美国早期郊区化的后尘，殊不知人家是自然而然的发展，我们则想凭着行政力量不受严格的法治约束可以为所欲为，想用行政力量强行打造一个“区域均衡发展”的“中国特色”城市化道路。却不知道美国当初的郊区化乃是由于黑人进城一度导致城内社会治安等不好，富人被追外迁。随着城市社会治安的逐步好转，郊区化的美国正越来越回归正常的中心化。而中国大陆的城市化呢？政府大于市场，规划大于规律。北京上海等大都市过去十几年来一直在用强制规划与拆迁的办法在城外迁移人口，导致城中户户籍人口不断下降。不仅如此，还强行用限购限贷等行政力量打击和限制市场力量，阻止人们正常的购房与投资行为。结果，三四线及其以下城市鬼城空城遍地不说，还制造出令人心惊胆战的金融危机，一些地方民间金融崩盘，房地产开发商负债逃跑，银行面临金融危机。最后又不得不服从市场和规律的力量，一切推倒重来。


    对此，我始终耿耿于怀。2014 年 9 月 27 日，还在“腾讯《大家》”发表专栏文章《限购松绑，中国楼市走向何方》（原标题：《中国楼市调控两大新方向》）说：“我们又到了‘只有房地产才能救中国’的历史时刻。从不符合市场规律和城市化发展方向的限购限贷，向尊重市场和城市化规律的鼓励投资转变，是必然的总方向。不一定会上大旗鼓地公开宣扬鼓励投资，但具体做法一定也是这样。未来的楼市调控，除了由限购限贷向鼓励投资至少是投资者与普通购房者一视同仁之外，另一大调控方向就是从价格调控向供应量调控转变。我们在不该搞小城市大跃进的地方搞了小城市大跃进，结果供应严重过剩，这些地方就应该调整规划，努力消化库存甚至收回未建设的土地。而在供应不足的地方，该在城市密度和城市面积扩张等方面调整规划，加大供应。”


    仿佛是为了“证明”我判断的正确性，9 月 30 日央行银监会解禁限贷，10 月 9 日媒体报道《国土部火线出新规严防鬼城：新区用地能不批就不批》两大新调控方向量身影制服一漏网！其实这一句就是“形势所迫”，判断的正确性也不过再次说明“知识就是力量”，知识有超越金钱和权力的力量！


    中国社会在城市化过程中对高房价充满了戾气。但是，人都往收入高的地方自由聚集是城市化的规律，人口聚集、收入高的地方一定高房价。有人说，北上广深楼价是全国均价的
    6-8 倍，美国这个数据是 20-30 倍。是不是这样？我没有去计算。但大城市未来房价还会超出今天多数人想像，也是一个无人能逆转的必然规律。


