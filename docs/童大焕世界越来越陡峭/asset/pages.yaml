    英国伦敦的发展历史，在当代世界城市化史上具有相当的典型性。2015 年 1 月 7 日，英国首都伦敦的人口首次超过 1939 年 860 万的最高峰。1939
    年，伦敦人口大增，成为继美国纽约之后的世界第二大城市。但随之而来的大伦敦计划（Greater London Plan）改变了这一切。1937 年，英政府为解决伦敦人口过于密集的问题，成立了“巴罗委员会”。该委员会于
    1940 年提出的报告“巴罗报告”指出：伦敦地区工业与人口不断聚集，是由于工业所引起的吸引作用，因而提出了疏散伦敦中心区工业和人口的建 议。当时被纳入大伦敦地区的面积为
    6731 平方公里，人口为 1250 万人。规划方案在距伦敦中心半径约为 48 公里的范围内，由内到外划分了四层地域圈，即内圈、近郊圈、绿带圈与外圈。该计划凸显了城市发展控制，并鼓励创建更多的公园绿地和户外空间。到
