  md: '将会持续很长时间。而二三线城市房价则取决于大量从一线城市回流的人群。正像我一再强调的“大城市房价由外来人口决定，小城市房价由回乡人口决定”。在人口剧烈流动背景下，
    “合理外来”、“房价收入比”、“租售比”等等都是伪命题。


    二是房地产与整体的金融、经济生死与共。各级政府包括中央政府比有房族更害怕房价整体动荡和下跌。今年二三季度货币供应会不会适当宽松？这个可能性在八成以上。因为工业全面过剩、控制污染淘汰过剩后中国背景下，根本不容许作为国民经济支柱的房地产长期动荡。在服务业尚未未成为中国经济主导产业的背景下，房地产是中国经济惟一救命稻草。两会上李克强总理作出的报告中，关于预算方面是一个赤字财政的预算报告。现在把经济增长的速度降到
    7.5%, 货币增长的速度在 13%（真实的可能会达到 15%甚至更高一些，因为我们的产出投入比已经徘徊在 0.5 上下），它意味着货币超发依然会和我们形影相随。从数据来看，所有新兴市场，特别是亚洲国家，超额货币的增长都会驱动房价上涨。


    友人问我：“前几天我高中同学从深圳回来，反映实体经济主要是制造业很不妙。他是一家电子公司副总，主要是作为美的微波炉工厂、飞利浦小家电等生产电路板。他说美的的小家电市场占有率高，是中国家电的晴雨表。以前，美的工厂都要开足马力每天加班加点才能完成订单，但是现在每周只开工
    5 天，而且 5 天都是勉强，其实 4 天就够了。还有，飞利浦上海公司，以前是我同学第一大客户，占公司毛利近一半，但是与去年一、二月比，飞利浦今年给的订单不足一半。请问，实体经济下滑，对房价何影响？”


    实体经济下滑，房价只能总体上涨（请一定记住在全国范围内是涨跌不一，视各地供应量不同而定，但全国平均和总体趋势必须是上涨的），才能保金融、保经济、稳就业、稳社会。


    三是中国老百姓很多富余资金无处去，房地产是他们惟一抵御通胀和资金保值增值的渠道。黄金投资大家都看到了，我去年初在凤凰周报《众议院》做的谈话内容再次应验：告别金本位以后，黄金是最没用的东西，不像翡翠、艺术品一样具有稀缺性和审美功能，黄金传统的审美功能是完全附着在它“天然货币”的金本位功能上。只是文化习惯使很多人不假思索地追逐它。A
    股市场则是个道德基本面和经济基本面都不存在的权贵圈钱工具和赌场，且小散户永远赔不过庄家——多年来我一再重复这个观点，可是总有人不愿意听，包括一些很近的朋友。


    很多人认为房地产市场太火爆导致实体经济状况不佳，企业主都“不务正业”去投资房地产。这是误解。一则前面说了，是房地产补贴工业导致工业产能严重过剩和污染加剧，过剩的结果必然是订单减少和利润微薄甚至亏损关门。即便如此，关了企业专事炒房的企业主也是少数，只要企业还能基本维持，大多数企业主还是愿意维持下去。还有人认为贪官大量购房、是购房大军的主体。也是误解。房地产（小产权房除外）是最透明最便于清查的资产，有多少贪官会把不明财产积极主动变成申报时的透明财产，要打一个大大的问号。


    真正的购房主体是很多中等收入群体。他们中的不少人，老家农村一栋房，家乡县城一套房，工作居住地一套房。还有不少人父母一套房，自己一套房，还有一套留给儿女。所以即使楼市偶有波动，也不会引起超幅进退而导致楼市崩溃。


    四是如何看待三四线及其以下城市的供应过量问题。如今，人们已经普遍开始担忧三四线城市的房地产过剩问题，事实上，在过去十余年中，城市人口增长 0.5 倍，而城市建成区面积增加了接近
    1 倍，很多三四线城市都存在建设用地过'
