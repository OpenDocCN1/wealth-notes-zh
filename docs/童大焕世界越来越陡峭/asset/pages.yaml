    +   41 红_曼：05 年，内地工作 13 年来到广州，仅有 11 万存款，向父母再借 11 万，凑足首付买了一套四房，三年后归还父母借款。


    +   42handsomeyang：我在北京通州新华联有两套，02 年一套，04 年一套，首付都是六万，没有靠父母资助，99 年工作，it 企业。


    +   43Pursuit-ME：我在深圳上班，在老家乌鲁木齐买了房，在我名下，但是是给爸爸妈妈住的。首付款爸妈出了一部分，我自己攒了一部分（工作四年时买的）。女生，不算节俭，也没有外快收入。


    +   44 海浪 07：我买房第一套房的首付完全是自己的。


    一共 44 个人，2 个全款但也有筹措；25 个贷款，首付来自自己一部分，向亲友或银行筹集一部分甚至全部，占比 57%；只有 17 个人首付完全是自己筹集的，占比
    38%。


    大部分购房人，在购买第一套房的初期，都面临着既要还月供又要还首付的艰难，有时这种艰难还会持续很长时间；但也有相当一部分人，在把压力化成动力的同时，比预想的容易得多还完了首付甚至贷款。


    还有一点是共同的，多数及时买了房的，长期看来都比没买房的过上了更好、更有财富自由的生活。由此我们可见，买得买不起房，很大程度上是由自己的心态决定的，这样的心态又决定了日后的人生状态。不论古今中外，买房都不是一件轻松的事情，每个人必须付出适合于自己的努力。如果一味抱怨高房价，房价决不会在你的抱怨声中下落，最终失败的不是房价，而是抱怨者的人生。


