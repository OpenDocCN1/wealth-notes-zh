    昏睡百年，国人仍未醒！睁开眼吧小心看吧，东北和中西部想留人留不住，长三角、珠三角想赶人也赶不走。将近 9 成跨省流动人口都进入了三大城市圈和福建省！


    **数据三**，如果说数据二还是以省为单位的人口流动统计，那么 QQ 大数据具体到城市，更令人目瞪口呆！笔者根据 QQ 大数据进行换算，2014 年春节后约
    1070 万人真正离开了北上广深，而节后则有 1994 万 QQ 活跃用户首次从全国各地来到北上广深。请注意，这里不含每年毕业的 700 多万大学生（学生
