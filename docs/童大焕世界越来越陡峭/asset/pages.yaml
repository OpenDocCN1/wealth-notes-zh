  md: '当干预市场，中国工业经济及商业地产的产能过剩暴露得更加明显和彻底，由此而反过来，中国经济的房地产依赖更为加深。这个现象说明，除了供应严重过剩的空城、鬼城之外，中国房地产尤其是除了旅游地产、商业地产、养老地产之外的住宅地产是否过热，需要打一个问号。同时，正因为房地产对中国经济有着牵一发而动全身的关键作用，2014年以来各地方政府纷纷解禁限购，甚至用各种放松户籍限制等办法吸引人们买房和入户。


    房价过高和供应过剩是人们对楼市悲观的主要原因，M2 和 GDP 之比过高也是房价泡沫论的主要观点支撑。但首先，发出去的货币如泼出去的水，想收是很难收回的。经济的货币依赖惯性也不允许政府短期内大规模收紧流动性。这方面，各经济体之间并不具备直接的可比性。就像有的生物已经习惯于陆生，有的生物已经习惯于水生，有的适应于高寒，有的适应于酷热。其次，如果不是房地产吸放了过度流动性并加速了财富流动，中国底层人士的生活将更加堪忧。中国大陆老百姓投资渠道狭窄，也迫使把保值增值的希望寄托在惟一的房地产上。所以，高房价将伴随着整个中国经济的全过程。事实上，现在东部农村乡镇自建房，也都动辄花费几十上百万元以上，这其中，政府和开发商可没有赚建房人的钱，更没有炒房人在其中搅浑水。第三，特殊的中国式住房消费结构也将长期支撑中国经济和房价。


    很多人认为中国的高房价都是炒作上去的，这种观念忽视了大迁徒大流动背景下中国特殊的住房消费结构。事实上，当下中国房产持有者多数是中产阶层，稍有条件者一般拥有
    3 套以上住房，基本上是大、中、小各一套：自己住一套，老人一套，准备给孩子一套暂时出租或将来留着孩子读书用。如果算上农村老家一栋房子，经济条件稍好的家庭将同时拥有
    4 套以上房子。这些房屋基本上没有一套是多余的。


    基于这样的特殊住房消费结构，中国住房的成长性依然巨大。基于中国经济对房地产市场的高度依赖性，房产税的推行将是一个非常艰难非常漫长的过程。更干脆地说，房产税绝不会轻易推出。否则，它会迫使人们大量出售非急需的住房，从而导致住房供应整体上严重过剩，进而带动房价全面下跌，人们资产迅速缩水。它换来的是经济崩溃并引发社会动荡。


