    # 最好投资机会在看不透的灰度空间里


    我把 2014 年称为城市和房地产领域市场力量翻转行政力量的一个分水岭，标志就是在行政调控没有任何加码、按兵不动的情况下，一些三四线城市甚至一线城市郊区房价跳水、成交下滑，个别开发商破产清算。对于未来的楼市走向，则出现全线下跌、继续上涨、楼市分化
    3 种主要观点。各种数据和观点令人目不暇接，眼花缭乱。


    但最好的投资机会，正是隐藏在这样一种既非一眼看到黑也非一眼看到白的灰度空间里！在灰度空间里，大部分人看不清明确的方向，于是才有少部分智者勇者从中受益。因 2008
    年金融危机暴得大名的塔勒布先生最新力作，书名就叫《反脆弱：从不确定性中受益》。如果一切都是确定无误的，那么大家都会往同一个方向，最后的结果，一定是朝着和预期相反的方向倾覆！就好比在一艘小船上，大家都认为船尾最安全，一窝蜂挤向船尾，或者首先落水的，一定是船尾。反之亦然。


    这是我第二篇众筹文章，本不希望如此密集推出众筹文章，但时不我待，是购房时机在催促。要和大家谈具体投资策略，在全局大判断基础上，细致入微，十一个小问题全部来自实际操作经验。问题很具体，具有很强的操作性，所以比前一篇要贵很多。读者的门槛也要高得多，必须是有条件能够马上进行楼市操作的，包括有现金流，或者有资产需置换，或者拥有全款的独立产权能够融资操作的。一如既往地会清晰地告诉你分析方法和路径——比起结论来说，这是干货中的干货，授人以鱼不如授人以渔。但仍然不涉及具体的楼盘选择和如何让个人资产配置效率最大化问题，那是个性化服务的范畴。认筹此文，赠送我的第一篇众筹文章《抽丝剥茧看扑朔迷离楼市
    2014》；已经认筹前一篇的，直接扣除 100 元。我希望这次认筹的读者不是 100 个，而是 3 个、5 个、10 个，不要太多。这批认购人，将是有潜力成为我将来的线下活动“大探险发现之旅”（暂名，兼具“探险”、“功旅”之意）会员（当然会有费用，也可能还会有收益），逐渐争取发展到每个重点城市都有城市助理。让大家在全国范围内一起分享信息和城市化、房地产的财智经验与机会，群策群力，共同进步。


    在介绍各种楼市投资技巧之前，还是要对未来楼市的大方向做好全局判断，和全局判断相比，投资技巧很实用但终归是雕虫小技。投资技巧只在大判断正确的前提下才能发挥最大效用。这就是我一再强调的“大处着眼小处着手”、“不谋全局者不足以谋一域”。


