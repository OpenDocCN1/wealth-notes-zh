  md: 'SOHO 中国董事长潘石屹最近想不通。1994 年那会，他带着还是女朋友的张欣来到北京东三环的一片工厂区，告诉张这里将成为比肩美国华尔街的商务区。20
    年过去，工厂区上真的建起了世界知名的北京 CBD，但该区域高聚集的人口密度、拥堵的交通却又被当作了北京城市病的一部分。为了“医治”特大型城市的城市病，政府提出了新型城镇化的概念，核心是控制特大型城市的人口规模，发展中小型城市，促进城乡一体化发展。“这就是个倒退！”潘石屹回顾人类历史，文明的发展程度总是和人口的聚集密度正相关，从牧业社会到农业社会再到工业社会，人口在聚集，文明也在进步。北京CBD
    的建造初衷，即是政府希望将容积率提高，产生大规模的聚集效应，使资金的拥有量和使用效率大幅度提高。“将人赶走，岂不是要退回到落后的牧业社会上去？人散开了，环境的问题就真能得到解决吗？”潘石屹实在解不开这个问题。（2014
    年 5 月 17《中国企业家》）


    潘石屹说得对。他想说的也是我是一直想说一直在说的。“新型城镇化”不仅是倒退而且必然不可能取得成功。从更长的历史长河看，人类历史其实只有两段历史：1820 年之前工业化城市化之前的历史，2000
    年里人均 GDP 只增长了 0.5 倍，1820 年工业化城市化之后，100 多年时间里不仅人均 GDP 翻了 8 番，而且生活方式、社会结构、政治及文化形态都发生了根本变革。


    城市化的本质就是人流、物流、资金流、技术流、思想流的高度碰撞和聚集，绝大多数的人集中在世界上极少数点的土地上市产生活，使地球环境压力大大缓解，人们的创造力和生活水平大大提高。“新型城镇化”本质上是反城市化，不仅会造成巨大的人力物力财力浪费，而且会给地球环境资源带来灾难性破坏。


    1949 年以来，我们在反城市化道路上走过了一而再、再而三、三而竭的道路：


    1978 年以前，农民被严厉禁止进城，甚至饿死也不能出村讨饭。备战备荒为人民，工厂大量搬到西部和山区进行“大三线”、“小三线”建设。后来又有了知识青年上山下乡。其不仅造成数千万农民饿死，而且与乱砍滥伐、大炼钢铁效应叠加，导致了
    300 多万平方公里土地沙漠化，大量生态环境被不同程度破坏。这个罪可谓殃及当代，祸及子孙。


    上世纪八九十年代，乡镇企业和小城镇运动在轻工业严重短缺的情况下遍地开花，造成了低效率、高能耗、高污染等一系列后遗症。除着新型现代工业的崛起，大部分乡镇企业和小城镇进入衰败或销声匿迹。


    1998 年城市住房私有化以来，通过降低土地、劳动力和环境成本，地方政府之间招商引资大竞赛，扭曲的工业投资价格导致工业产能严重过剩。而羊毛出在羊身上，被政府人为压低的工业用地价格，事实上来源于房地产用地的补贴。这又导致中国国民经济对房地产的高度依赖，各地方政府普遍实行房地产和城市建设的平面空间大跃进扩张，导致人口净流出地区鬼城、空城不断涌现。


    大家千万不要以为鬼城、空城和我们每个老百姓没有关系，甚至异想天开它们会降低房价给当地百姓带来福利。我们的房地产与银行、与政府地方债高度捆绑，鬼城、空城只会逼迫央行滥发钞票冲抵呆坏账，造成“政府失误，全民买单”的恶果。


    简单的三段历史概括可以清晰看出反城市化恶果累累。但是政府的政策丝毫不反省，不回头。不过从 2014 年开始，市场的力量必将反转到政府的力量，成为城市化中的决定性力量。因为很多开发商、住房投资者已经发现，很多沿着“新'
