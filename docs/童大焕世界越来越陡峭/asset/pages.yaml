  md: '入市以求抬升房价（通过这条微博要穿过多少隐晦的“思维曲线”才能往这里想？），他在跟帖中揶揄我说： “童老师还是多呼吁央行降息，赶紧印钱，其他的都不用管。”我回应说：“我不用呼吁。我说了，谁当总理谁降谁。包括你去当总理，你也得降，哪怕你今天呼呼不降。”这位朋友嘲笑我“看低新总理的智慧，人家考虑的是软着陆，慢慢刺破地产泡沫。”没想到
    6 小时后新浪网就发出国务院降准的消息！


    其实很多人不知道，一，诚如美联储主席格林斯潘说的，泡沫没有破就谁也也不知道是不是泡沫；二，即使有泡沫，中国的房地产泡沫也不能破，因为更大的泡沫在房地产补贴的制造业过剩（当然有一些是明知过剩只为圈地）。一旦房地产崩盘，紧接着就是金融和制造业大崩盘。因此我在
    2014 年 3 月的众筹文章《最好投资机会在看个透的灰度空间里》即已预言政府会救楼市。若不救，将是楼市崩盘大量失业银行大量呆坏账。这时屌丝能低价接盘？做梦！一是屌丝心态决定他们心里没底始終接不住，二是部分屌丝早已失业想接接不了，三是少数接盘者还是远见人。银行呆坏账咋办？印钱先抵，于是迎来新一轮房价大涨而屌丝仍在失业或找工作（经济也像人生病，病来如山倒病去如抽丝，垮掉容易恢复难）。有房人还有无房人屌丝则更惨。


    还有一种不印钞的办法，就是听任一些银行破产。但金融是经济的血液，那时候经济崩潰不说，直接受害的还是那些把钱存在银行的微产阶级，向银行借钱的有产阶级反而又从中得利。还钱？没有。超出住宅用的房产你可以拿走，但卖不出去。最后还是得等经济复苏。谁的房子还在谁的房子！


    更早的 5 月 20 日，马光远还在曲解我的原意，说我既然对楼市（确切说是对大城市楼市——大焕注）如此乐观，为何还呼吁救市？我说我从没呼吁救市，不要偷换概念。我会救市，不说要救市。会和要，大家都认得。此前的救市，包括一些城市放开限购、住建部表示除北上广深外其它城市限购可自行调节，都应验了我此前“北上广深一时难放开限购以防三四线城市加速崩盘的判断”。


    事实上，我在 2010 年 8 月写就、2011 年 10 月出版的《世纪大迁徙——决定中国命运的大城市化》一书里即已警告小城镇大跃进损失将可能超过计划经济时代的大小三线建设；2011
    年 2 月 11 日给 FT 中文网的文章也预言限购限贷造成的三四线楼市过剩危害远大于一线城市房价上涨；2012 年 11 月出版的《穷理查富思维》则详细分析了房地产补贴工业，经济绑架房地产，然后房地产反过来绑架金融和经济的逻辑关系，告诫大家，当下中国经济逻辑不允许房价停下来等收入增长，只能让收入追房价（包括解放和释放农民的土地、房屋等资产性收入），否则将是社会共同的灾难。当然，前提是如今楼市还没有整体过剩，否则就是观音菩萨和王母娘娘也救不了。


    这个时代很有意思，很多人一遇到问题潜意识里仍然充满“阶级斗争”思维，经济问题政治化，以为一切都是“利益集团”在搞鬼。从屌丝到学者，都充满了类似心态。已不得崩盘一次推倒重来，殊不知覆巢之下岂有完卵，碎得最快最惨的往往是那些“壳”最薄弱的屌丝阶层本身！政治解决不了经济问题，经济问题政治化反而会使情况变得更糟。只不过会使一些人心态感觉变好，以为富人真的崩溃了。类似阿
