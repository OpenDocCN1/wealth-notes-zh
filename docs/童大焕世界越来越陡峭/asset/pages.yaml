    # 为什么自由市场会比限制自由更道德


    网友问：“童老师你好，菜鸟想请教个问题。首先说我自己也在深圳买了房，房价涨对我是有好处的。但是我又想，政府如果不限购限售，那么房价肯定越来越脱离建城的靠劳动收入工薪族，在城市没买房的大学学生等更加没有买房的可能性。限购限售主要限制的是富裕阶层和炒房队伍，这样偏向劳动阶层的政策为什么在老师眼里是这么不对？放开了，不是穷的更穷富的富多？”


