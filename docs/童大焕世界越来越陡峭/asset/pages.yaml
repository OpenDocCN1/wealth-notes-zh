    在美国，大城市的大都会区工作的工人收入比不在大都会区工作的工人高出了30%。这些高出的工资被较高的生活成本所抵消，但这并不能改变高工资体现高生产效率的事实。公司之所以能够承受城市所带来的更高的人力
    和土地成本，唯一的理由是大城市能够带来足以抵消这些成本的生产效率优势。生活在居民人口超过100万的大都会区里的美国人比那些生活在规模较小的都会区里的美国人的生产效率平均高出50%以上。即使我们考虑到工人的文化程度、工作经验和行业等因素，这种关系也是一样的。甚至在我们把工人的智商考虑在内时，情况仍是如此。在其他富裕国家，城市和农村地区的收入差距也同样巨大，在较为贫穷的国家，这一差距甚至更为明显。


    圣雄甘地对于当时的反城市化运动是持赞赏态度的。这位伟人错了。印度的发展几乎完全依赖它的城市。印度的城市化与繁荣发展之间存在着近乎完美的关系。平均来看，印度的城市人口每增长10%，人均产值就会增长30%。城市人口占多数的国家的人均收入比农村人口占多数的国家几乎高出4倍。


    “城市人口占多数的国家的人们认为自己更为幸福。在城市人口超过50%的国家，有30%的人口认为他们非常幸福，有17%的人口认为他们不是很幸福或者一点也不幸福。在农村人口超过50%的国家，有25%的人口认为他们非常幸福，有22%的人口认为他们不幸福。就各个国家而言，即使考虑到居民的收入和教育水平，生活的满意度也是随着城市人口比例的提高而提高的。”


    曾经我们认为，信息互联网会使面对面的交流大大减少，从而节约我们的时间和空间。在1990年代末，当网络达到顶峰的时候，许多技术爱好者预测城市很快就会成为过时的东西，因为我们不再需要共享人行道和咖啡店。便宜的三明治意味着昂贵的办公室空间的结束。


    但是，数据显示正好相反：城市面对面交流已经变得流行增加。《城市的胜利》一书中指出的那样，自从电子邮件发明之后，商务旅行显著增加。自从视频会议发明之后，商务会议的参加人数猛增。


    在相当长的时间里，人们以为技术是他们的模拟人生的替代者，就像电话或者Google+让人们避开亲自参加聚会的麻烦一样。但是，技术取代面对面的交流不会很快甚至根本不会发生：面对面的交流有太大的价值，肢体语言和含蓄的信息都是在互联网上翻译的。这些局限性表明，社交网络不会成为老式社交的替代品，社交网络的重点将是成为一个更好的补充，扩大面对面交流的优势。


    如果让我来分析，为什么信息互联网反而刺激和扩大了面对面交流的需要，原因会有三个：一是信息互联网大大拓展了人们的社交圈子，以往互不相识的人们，通过互联网可以寻得数倍、数十倍的同情、同情。有人说“人生得一知己足矣”，互联网使世界上最小的众包信息都更多了。圈子的扩大使得面对面交流的需求也增加。而面对面交流的地点选择，大多数时候肯定是在一个交通、服务都更便捷的“中心地带”。二是人类大量的思想碰撞和创造需要通过对面的交流才能实现，尤其是碰撞和捕捉稍纵即逝的“灵感火花”，需要比书面语言之外丰富得多的面对面的交流信息。三是人类情感的需求与满足，也需要通过线下活动来实现。


    世界只会越来越集中，越来越陡峭。你，准备好了吗？


