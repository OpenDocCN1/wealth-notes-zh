  md: '于支持项目建设或项目配套”，这项颇具争议的政策意味着投资企业买地成本基本为零，当时已属成熟地块的响螺湾地价在3000元到8000元每平方米之间。中央政府对于响螺湾的政策优惠亦甚于其他。“当时的中央政府的要求是所有新的优惠政策都引入这个地区。”


    在响螺湾商务区的投资中，39个项目的无一不是来自于地方市政府或国企资本，而方无一不是清一色、整齐划一的写字楼、公寓及酒店。然而现在，48栋摩天大厦至今仅有两栋正式完成入驻，多数项目或半途停工或封盘，摩天大楼宛如鬼城。在响螺湾商务区内，仅高层写字楼的数量就多达30栋。按照世邦魏理仕的数据统计，到2014年，滨海新区的响螺湾、于家堡及泰达MSD三大商务区将有480万-540万平方米的写字楼供应。但在天津写字楼市场，一个背景是写字楼的价格长期低于高档公寓价格，且需求量有限。（《京津冀一体化风险样本：折戟响螺湾》http://finance.ifeng.com/news/special/jjjythfx/index.shtml）


    更早的2002年，河北唐山曹妃甸规划蓝图据说曾让当时的国务院总理激动得彻夜难眠。位于渤海湾西侧、隶属河北第一经济强市唐山、规划面积380平方公里的曹妃甸工业区，自2003年启动开发建设以来，累计填海造陆超过230平方公里，总投资超过3000亿元，高峰期日均投资4亿元，一度被称为“中国最大的单体工地”、国家级循环经济示范区。一度被访问称为“邓有深圳，江有浦东，胡温有曹妃甸。”它不仅是决定唐山城市和产业双重转型的“蓝色之梦”，亦在很大程度上决定着河北建设沿海经济强省战略的成败，更被视为重塑京津冀区域发展格局的战略之举。


    然而，仅仅十年之后，曹妃甸就从万众期待的荣耀巅峰坠落，挣扎于生死边缘：原计划构建的四大支柱产业——大港口、大钢铁、大化工、大电力正在一一落空，而早期用于基础设施开发的巨额投入，正迎来偿债高峰期，紧绷的资金链随时有断裂的危险。每日超千万元的还债额，并也不是它的全部。曹妃甸的融资结构中，包括银行委托贷款在内的银行金融机构融资只占2/3左右，还有1/3是民间融资，其中主要是基金。此外，曹妃甸还有大量的施工方垫资建设。因此，谁也不清楚曹妃甸的债务规模究竟有多大。这就跟谁也不清楚今天地方债务规模究竟有多大一模一样。


    一个甲子以来，我们在城市化问题上一直坚持着“信规划不信规律、信市长不信市场”的“致命的自负”。但市场不听卖市长（包括更大的长），规律不听命规划，人类犯下的错误，最终要由全体民众的“通胀税”和具体投资者的眼泪与破产来洗刷。


    为什么总是“种下龙种收获跳蚤”？为什么总是“美好愿望结下苦涩果实”？只因“美好愿望”本质上都不过是“想得很美”的乌托邦！


    曹妃甸和响螺湾为什么是“一京双凋”而非“一箭双雕”？原因一，这两个地方根本不像深圳和浦东，在相关城市群的地理辐射范围内。简言之，它们太远了，远得鸟不拉屎，远得地老天荒。曹妃甸距唐山市中心区80公里，距北京220公里，距天津120公里，距秦皇岛170公里，近在现代交通工具所能承载的“京津冀都市圈”之外。响螺湾亦然，这个距北京160公里、天津60公里，“预计到2010年全部建成并投入使用”的“天津滨海新区总部经济的核心区，省外事、中央企业驻滨海新区的办事机构、集团总部和研究中心，于于家堡金融区和泰达MSD共同构成滨海新区的中心商务区”，同样远在京津冀都市圈之外。现代大都市群（圈）的区位优势往往是由时间来决定的，区位优势取决于最现代交通工'
