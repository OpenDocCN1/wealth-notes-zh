  md: '这些人生最重大、泰山压顶般的价值排序面前，所谓的“乡愁”已经变成了轻于鸿毛的无病呻吟。


    腾讯网今日话题专题《“强奸 95 岁留守老人”是社会之耻》为我们揭开了当下农村留守问题下“恶人当道”的冰山一角：


    2014 年 3 月 7 日上午，河南商丘夏邑县业庙乡陈庄村小王庄 83 岁的老太杨某在亲属陪同下，颤颤巍巍到业庙乡派出所报案。杨某称，当日深夜自己被人挖窟入室强奸。民警调查后发现，受害的不仅仅是杨某，周边村庄已连续发生
    10 多起强奸空巢老人的案件。被强奸的老人中，年龄最大的 95 岁，最小的 73 岁。


    而多项调查都指出，针对农村留守老人中妇女的性侵，已经成为普遍现象。比如 2013 年，陕西商南县一男子半月连杀 7 名留守老人，对其中的 6 句老妇先强奸再实施杀害。2012
    年，广西全州县抓获一青年男子，其一年多时间抢劫强奸农村留守中老年妇女达 106 起。2011 年，山东省沂水、沂南警方破获一起案件，犯罪嫌疑人房某强奸 10
    多名留守老太，最大 99 岁最小 76 岁。这些案件的共同特点是，罪犯因为一起报案被抓，审讯时才抖出一连串案件。可见绝大多数作案都在水面之下，由此能推断曝光出来的情况只是冰山一角。上述案件的另一个共性是，对留守老人的性侵伴随着盗抢，且作案经常明目张胆、如入无人之境，目前农村的治安已经恶化为由“暗偷”变“明抢”。


    在农民整体上九成收入来自城市打工或创业的时代背景下，城市化是一个任何人难以改变的规律，呼唤青壮年农民回乡显然非现实。“加强治安”的呼吁也同样廉价而无力。十年砍柴在《我富裕同时又贫困着的故乡——甲午故乡春行记之四》里也写了一个发生在故乡的真实而悲惨故事：村里一座房屋空无一人，原来是男主人外出打工起豪宅，留下了妻子和父母在家。夏天的一个深夜，几个烂仔开车停到马路旁，然后翻墙而入，殴打了两位老人，性侵害了年轻的女主人，然后洗劫财物扬长而去。等到惊魂未定的被害者报警，警察赶到事发点，烂仔们早已不知道逃到何处。这一恶性案件，至今未破。因为家人的遭遇，男主人只能将父母、妻子接到谋生的城市，这栋豪宅也就成为蜘蛛、老鼠的乐园。作者感叹：乡村社会空心化最大的隐忧是老人和孩子的安全问题，这种安全问题既包括显性的被侵害的可能，也包括可能造成的心理上的问题。居住分散的乡村，当自身不具备自卫能力时，完全依靠政府的治安力量，是不现实的。整个镇
    105 平方公里，49 个行政村，5 万户籍人口，而派出所只有区区 6 名警察。这样的警力，在这样一个丘陵、山地混杂的乡镇维持治安，其难度可想而知。


    呼吁农村像城市一样到处布满摄像头、“加强警力”，就好像呼吁在农村也要建三甲医院和豪华歌剧院一样奢侈而虚妄。解决农村留守问题最现实可行的办法，就是如腾讯专题后面“新闻立场““你认为该让留守老人随子女迁到城市吗”这一问卷调查所揭示的，205398
    人认为“应该”，占 86.2%；只有 32899 人认为“不应该”，占 13.8%。


    “青春献给城市、老幼栖惶乡野”的农村留守现实，已经成为时代之恶国家之耻，它的根本原因就在于我们的城市对外来人“经济上吸纳，身份上排斥”的不当政策。彻底解决这个问题，关于社会良知、时代良、政治道德。“老吾老以及人之老，幼吾幼以及人之幼”，这个千年古训，不应和时代良知一起在我们这代人手里堕入万劫不复的深渊！


    让老人和孩子进城！让老人和孩子进城！它应该成为时代的最强音！不是说要给予他们什么，而是要把本该属于他们的自由迁徙自由上学的权利还给他们。'
