  md: '世界范围内，城市化的规律也都是完全突破行政区域限制，甚至超越国界，人口和财富自由地在全球甚至全世界范围内流动，这个流动趋势是：企业和人力都向房价高、地价高、技术水平高、新知程度高、人口密集的地方流动。因为在那样的地方，尽管各种成本似乎都大幅度提高，但效率和自由度则是更大幅度地提高。这就是经济发展和人性追求的基本规律。


    第四，城市规划和城市化研究中“皇冠上的明珠”———人口数量和结构变化，因为最不受行政力量的控制，最难把握，因此往往在规划过程中最受忽视。甚至因为新中国成立65年来行政力量一直在支配各种资源中起着决定性的作用（包括人口资源），养成了权力习惯成自然的致命的自负，以为权力可以随意通过产业、规划等形式指挥人口流向。城市发展中关键性的要素——人，却被放在了明陪末座的可有可无位置，甚至根本不入规划决策者的法眼。这种逻辑与决策思维，能不失败，那简直相当于中了体彩和福彩的亿元大奖。


    惟有市场力量能够遏制一些官员不负责任的疯狂与冲动，前提是市场的智慧本身能够起作用。我能奉献给大家的是说了千万遍的“信规律不信规划，信市场不信市长”，守卫你自己的腰包吧，你的市场化转型必须走在官员和政府市场化转型前面。否则，总是后知后觉甚至无知无觉的话，市场不相信眼泪，没有人替你买单。不知道规律在哪里怎么办？多学习，多思考，多观察。不学习而能够不上当，甚至赚得盆满钵满，这样天上掉馅饼的美事，我是没见过。多数人的失败，都是因为过于贪图便宜或者全部都要被我赚钱的心态。所以一看到政府贴上蓝图就热血沸腾。李嘉诚说不赚最后一个铜板，我则主张不要妄想赚过程中所有铜板。这话对所有开发商和投资者都适用。


