  md: '愿意把户口转入城市。从这个事实不难推导土地归农后的情况，并不是贺雪峰们想像的农民就会赌徒似地把土地房屋卖个精光进而斩断自己回乡的路。正如周其仁所言：


    > “有人请问：要是农民为了一时之急需卖了土地，他不就完了吗？这个问题的意思是，其他人会比农民本人更加关心他们自己的“长远利益”。还有一层意思，那就是允许农户拥有土地的转让权，会比现在的体制——有人以“集体”的名义贱卖土地，然后将贱卖所得的很小一部分分给农户——还要缺少“保障”。”


    在只许官员放火不许农民点灯的另一方面，贺雪峰们需要通过千方百计诗性和美化乡村田园生活来为自己的理论铺上一层绚丽的色彩。他说，“如果我在城市赚了钱，可以在城里买房，那我就顺利进城了。万一行，我回家乡还可以种田。回到农村还不一定差呢。农村有自给自足的经济，有新鲜的空气，有自己的住房，自己种的粮食还很安全，可以生活得既有体面又有尊严。农村家乡有土地，有住房，有熟人的社会关系，有祖祖辈辈的传统，有根，因此有归宿感。把土地流转给资本是没有道理的。农民种田都是精耕细作的。凡是老人种田都是精耕细作，粮食亩产都很高。凡是资本下乡的，粮食亩产都远途不如农民。如果你非要把土地流转给资本，甚至政府还补贴去刺激农业，这是没有道理的。”


    > “非要把土地流转给资本”的过去和时下正在进行的征地制度好不好？土地财产自由、交易自由、政府中立的话，农民卖不卖地还不一定呢！再说，乡村生活真那么美好，农民为什么要背井离乡抛家弃子进城并在地下室甚至一个人身子都躺不直的熱力井？除非你贺雪给我证明中国农民都是白自狂。人均不足
    2 亩地的小农经济当然只能精耕细作，但产量高又能怎样？农业收入己不到农民总收入的 10%，产量高一倍一年高出的农业总收入还不到打工一月的收入！现在，农村土地承包到户在缓慢变化，分配到个人的模式正在被机械化和雇佣、外包等新形式所替代，家里没有劳动力，完全可以包给种田专业户坐收年租，或者成熟季租来大型机械一天铲倒。如果你是农民，你会怎样选择？我倒是愿意长和给贺雪峰
    3 亩地，希望贺雪峰先生能够不拿一分钱稿费、讲课费和课题费，暂时冻结以前的一切财产，只靠精耕细作这 3 亩地自给自足！比当下农民平均耕地还多一亩，而且是江南旱涝保收的鱼米之乡哦。


    # 第四，最让我恶心的是，


    贺雪他们丝毫没有视农民的财产自主自由权利，却摆出一幅代表主为民作主的救世主姿态，一视我为农民好的家长心态。他们骨子里认为自已比农民的自由选择更高明，什么没有贫民窟和保护性二元结构全是狗扯。农民为何愿意待在贫民窟？土地自由他们就一定卖地？谁有权力代替农民做选择？农民是不是傻瓜只配列人代他作主？


    很多人正是被这种“我是为农民好”的外在情感包装迷惑了眼睛和理智，甚至在“目的正确”下视一切强制（如土地“被集体”）为理所当然。还是周其仁说得好：“用心中脑如果用错了地方，那就全盘皆输。要克服这个困难，我们不但要关注行为的动机或愿望，而且一定要观察行为的结果和实际效果，对事与愿违的事情，就要想办法改进。（周其仁《何处用心？何处用脑？》——非针对贺雪峰等人）”


    理智要战胜情绪怀和情感才，唯有坚硬理性的人才有大爱。


    # 第五，


    贺雪峰用情感牌、田园诗意境、用脑做学问牌、资本强制牌、激进城镇化牌等层层迷彩服包装的必须维持土地“被集体”现状的“学术理论观点”，恰恰是当下最主流的政策和观点，拿着国家的课题经费，带着博士硕士生，他却敢用“离经叛道”来包装，这个，我都想不出该用什么词来形容了！


    作于 2014 年 9 月 19 日


