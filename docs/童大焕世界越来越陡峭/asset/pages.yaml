  md: '马拉松里程，并非很快就能推出，更别指望它对楼市产生立竿见影的影响。相当长时期内中国经济对房地产的高度依赖，使政府征收房地产税的真实态度并不积极；中国当前不动产权质的多样与复杂，比如生产房、住房、军产房、小产权房、农房、经济适用房、商品房等等，如何统计、如何评估、如何定价和定税，都将是一个争论不休的话题，况且向民众收取直接税，谈何容易！再就是中国正处史无前例的城市流动之中，几乎每个家庭都面临在全国范围内多套房屋（含农村）的状况，一家人哪里的房屋缴税哪里的房屋不缴税，既是地方政府之间的激烈博弈也会是民众自身的激烈博弈。哪有那么简单？


    综上，从反腐败和房产税角度来解读不动产统一登记制度，显得非常的狭隘和一厢情愿。不动产地城乡统一登记的意义比这两者深远得多，一是更完整、更平等地保护权益人、利害关系人的利益；二是建立城乡统一房地产和资源要素市场，为市场在资源配置中起决定作用奠定基础，为土地和农房彻底回归农民家庭支起配备基础性的产权界定准备。房价的起落由市场自行决定，行政力量想决定也决定不了。平等地保护所有公民的权益，则是法律必须要做的事情。


    世界普遍联系，但联系一定要有逻辑有依据，否则就是胡乱联系。什么事情都捕风提影往“房价大跌”的想法中去联系，让我想起本人 2012 年 5 月发表的《信息选择中的“臆想昏厥症”》：


    在信息选择过程中，人们自然而然地会选择与自己看法相同的信息；对于发生的同一件事，往往也会进行选择性的、偏向于自己意愿和观点倾向的解读。


    医学人类学家汤姆·古德教授有一篇奇妙的论文，从文化角度研究疾病，题目是“宝莱坞电影和印度妇女的昏厥症”。他去印度考察，那里中年妇女昏厥症发作的几率非常高，古德教授看了各个时期的几百部印度电影，从中抽出一百部里面都有妇女昏迷场景的，昏迷或因爱情来得太甜蜜，或因生活中难以抵抗的严重打击。90%以上的女主角在昏厥过后，境况得到了改善，另
    10% 的女演员苏醒后发现环境没什么变化。古德教授分析，看电影的印度观众得到暗示，只要你应付不了一件事情，那你就昏过去算了，等你醒来，事情就变好了。论文用很大篇幅讲述了十余部印度电影的梗概，然后访谈当地妇女，古德教授的结论是，印度妇女喜欢看电影，喜欢其中的昏迷场面，这是昏厥症在印度高发的原因，电影既描述了这个现实，又塑造了这个现实。


    在信息选择和解读中，我认为也有一种“臆想昏厥症”在顽强地起作用，一旦先入为主的主观意愿顽强地占了上风，对每一种信息，都会朝有利于自己或有利于自己倾向的方向去解读，结果是，除了自己一次次“昏厥”过去、昏了头脑，现实却依旧是现实。


    信息选择中的“臆想昏厥症”毫无疑问是一种病，得治，治疗办法很复杂也很简单，就是要学会面对现实正常思考，改变“从观点到事实”而不是“从事实到观点”的思维方式。不是让所有的事实都拿来为自己的观点服务，而是要从现实的事实推导出观点和结论。


    作于 2014 年 8 月 17 日


