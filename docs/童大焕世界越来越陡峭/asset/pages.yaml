    CBD。报道说，2014 年约有 440 家企业的搬家动态，其中 407 家选择了在天河 CBD 内安新家，包括新成立、搬迁、扩租或续租的。占挪窝企业的 92.5%。在这
    407 家企业中，有 277 家分布在珠江新城，其他 130 家分布在天河路、体育西路、体育东路、林和西等地段的写字楼。


