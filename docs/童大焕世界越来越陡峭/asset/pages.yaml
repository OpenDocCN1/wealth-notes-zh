    # 保定的房价会暴涨十倍吗


    # —— 当保定成为北京政治副中心之后


    童大焕— 2014 年 3 月 19 日 14:24 发表于腾讯@大家


    今天（2014 年 3 月 19 日）国内最热的一则新闻当属“北京政治副中心初定河北保定”。据《财经》杂志了解，京津冀三地已经达成共识，初步确定将河北省保定市作为“政治副中心”的首选地。未来将有一批国家部委下属的事业单位和教育机构率先搬迁至保定。为了减少搬迁阻力，随机机构搬迁至保定的人员北京户口不改变。


    有关方面此举无疑是出于两个目的：一是疏解北京人口压力；二是试图以此带动京津冀都市圈的一体化发展；三大都市圈唯独北京是中心城市单极化发展，真让人着急。但这又何尝不是这一区域的长久商业文化所决定的呢？


    保定市中心距北京 140 公里，天津 145 公里，石家庄 125 公里，貌似正处在北京、天津、石家庄中心地带，以此为中心，形成京津冀都市圈的纽带，似乎倒也合适。但它的交通距离，目前还是略超出大城市圈最合适的范畴。若以城市轻型轨道交通的最远距离算，应该在半个半小时以内轨交车程是比较合适的。但不管怎样，这个设想比当初十年投资
    3000 亿元的“河北第一号工程”、“继珠江三角和长江三角后所发展的第三个极”的曹妃甸略靠谱一些。


    但它最终能否实现两个目的或曰两大功能，尚需拭目以待。第一，疏放国家部委下属的事业单位和教育机构，即使全面搬迁，其工作人员家属也未必能够随后，这毕竟是一个市场主导人口和就业的年代。因此，它对疏解北京人口压力的功能极其有限。第二，若要想它成为一个政治中心，进而带动京津冀的一体化发展，那更是指望小马拉大车，几乎完全没有这个可能。要实现这个功能，除非中央和北京的整体政治中心搬迁。而且还必须是，小市场小社会大政府的格局不变，而后者显然不符合市场经济和反腐败的基本要求。


    如是，如果保定成为北京政治副中心最后尘埃落定并且付诸实施，最可能的结果就是成为一个国家部委所属科研机构和大学集中地，类似于一个新的大学校。因为这些机构根本不具备真正的政治功能，而只是科研和教育教学功能。那么，它最好的结果就是另一个燕郊，但显然，燕郊的地理位置比它好多了。'
