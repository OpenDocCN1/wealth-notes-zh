    # 分散人口与资源严重加剧污染和城市病


    当代中国一直在反城市化的城市化道路上末路狂奔，其中最典型的发展模式就是俗称的一环一环“摊大饼”，以及产业和人口向郊区、远郊区转移。这样做非但没有减少污染和“城市病”，反而使这两者双双加剧。城市变得像一个巨大的铁锅型漏斗，四周都是垃圾围城、污染围城。原以为把污染企业转移出去就万事大吉，结果污染却从四面八方向中心蔓延，北京和环北京的灰霾基本上就是这样形成的。北京上海等大都市中心区近年来都采取了强制拆迁减少中心城区人口密度的办法，逼迫人口尤其是户籍人口向市郊迁移，这样做并没有带来郊区的产业发展，却把中国的城市化带入“美国化”的汽车化陷阱（纽约例外）而无以自拔，愈演愈烈的城市交通拥堵和汽车尾气污染据此而生。2014
    年 4 月 15 日上午，北京市环保局陈添透露了经过一年半研究的 PM2.5 源解析成果。其中显示，北京市 PM2.5 来源中，区域污染占到 28%至 36%，机动车的排放占到
    PM2.5 来源的 33.1%，比 2013 年所说的 22%还要多 10%左右。


