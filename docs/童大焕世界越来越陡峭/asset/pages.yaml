  md: '市强行关闭了多少打工子弟学校？这些学校没有要政府一分钱！这么多年来，北京上海等大城市户籍生源锐减关闭了多少公办中小学校？但他们宁可让外来人口子女失学、宁可关闭这些中小学校，也不愿意敞开大门欢迎新居民。


