    1 未来的中国经济和自然环境一点不悲观，因为服务业正迅速取代高能耗高污染的第二产业，很快将成为中国的支柱产业；


    2 服务业高度向一线城市核心区域集中的规律牢不可破，即使是在一线城市核心区域（CBD）内部，企业继续在更高、更密集处集中的路径也异常清晰。191 家公司由非
    CBD 地区搬进 CBD 或在 CBD 范围内“挪窝”，即是现实明证。


    经济潮流浩浩荡荡，顺之者昌逆之者亡。看到这则报道，我当即把它发给了一位 2014 年 10 月 1 日征求我意见后在珠江新城买了一套新房（次日每平米即涨 2
    千元）的客户朋友，她回复我说：“谢谢黄老师，国庆买的珠江新城的房子住宅现在市场价租金有 100/平/月，这个很高的，谢谢。不是您手把手教我，我还不知道要绕多大的弯。”我说，“服务业大发展，紧盯
    CBD。”当然，连片建成区人口低于 100 万的城市，就不要轻易造什么 CBD 概念了。


