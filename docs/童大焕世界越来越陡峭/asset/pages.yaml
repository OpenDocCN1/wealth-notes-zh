    # # 救楼市终于从蓋答答走向明晃晃


    2014 年至今，当中国经济和楼市双双陷入停顿、衰退的时候，笔者一而再再而三地强调：“只有房地产才能救中国经济”、“经济越不景气，越依赖房地产”、“又到了只有房地产才能救中国的时刻”以及政府必要要救房地产、决策层高估了中国经济健康程度从而延缓了救命、泡沫是消化泡沫的唯一办法等一系列持之以恒的不变观点。


    时光之轴进入 2015 年全国人大和全国政协“两会时间”，本届政府对房地产的态度终于由蓋答答答欲抱琵琶半遮面转向明晃晃亮出救命底牌！


    2015 年 3 月 4 日，中国最负盛名、官方地位一向最高的经济学家、全国政协委员厉以宁以 85 岁高龄亲自为自己的总理弟子站台，他在接受记者采访时表示，中国经济中房地产业的作用是不可低估的。没有房地产带动，经济增长的拉力是不够的。如果说经济发展中有一个大的机车在前面跑，那就是房地产。不要一谈到房地产就说泡沫，实际上今天仍然要振兴房地产。


    财政部财科学研究所原所长贡康则也表示，目前中国城镇化实际水平还不到 40%，要一路发展到 70%，在这个高速发展段里，房地产业必然是一个支柱产业。对于房地产业“泡沫”一说，他直言，“过去这一年多的调整，早已把房地产业泡沫挤得差不多了。”现在主要的问题不是泡沫，而是在经济下行过程中，房地产业的分化，应该得到必要的制度建设和政策引领。


    政府的政策层面，则已经于无声处听惊雷，正在酝酿着方向性的改变。这从 2015 年和 2014 年政府工作报告中可以清晰显现。2014 年的提法是：“针对不同城市情况分类调控，增加中小套型商品房和共有产权住房供应，抑制投机投资性需求，促进房地产市场持续健康发展。”
    2015 年的措辞为：“坚持分类指导，因地制宜，落实地方政府主体责任，支持居民自住和改善性住房需求，促进房地产市场平稳健康发展。” 短短一年之隔，已经天地上换了人间，楼市基调发生了根本性变化，主要变化有三：


    +   1、“调控”淡出，“指导”上场，为 2010 年以来所仅见。


    +   2、2014 年是“促进房地产市场持续健康发展”，2015 年变成了“促进房地产市场平稳健康发展。” 二字之差，在决策层眼里想必像打翻了五味瓶一样，别有一番滋味在。前者表示决策层认为房地产市场仍是健康发展的，并且有“抑制投机投资性需求”为前缀，打压楼市意图明显；后者表明决策层已经认识到楼市不稳的层面，在“经济下行压力还在加大”、“今年面临的困难可能比去年还要大”
    （李克强语）的时代背景下，稳定楼市已经成为当务之急。


