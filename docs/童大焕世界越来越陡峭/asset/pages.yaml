    # 第七章 最大的投资借力是借城市化大势


    # 乡愁是一道深不可测的陷阱


    乡愁是一道深不可测的陷阱，掉下去了就再也爬不上来，个体如是，国家亦如是。当然，对于“国家”来说，乡愁带来的损失再大，也只能个体来承担，国家本身并无痛感，决策者本身也无痛感。但对于个体来说，喜怒哀乐，甚至这辈了是贫穷还是富贵，却有可能全在其中了，一念天堂，一念地狱，一念定终身！


    发此感慨，是因为练了一幅字，曰：“四海无闲田，农夫犹饿死；唯有城市化，万民有饥子。”一位微信朋友给了条评论：“转一位老师的朋友圈内邻居老时参考；与龚空调工人闲聊。他说一间伴
