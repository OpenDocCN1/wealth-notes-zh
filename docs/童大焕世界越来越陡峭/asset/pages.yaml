  md: '多了一个城市，邯郸。已盛行近 10 年的河北邯郸房地产民间借贷大潮，在今年终于暴露危机。当地龙头开发商金地地产董事长史鹰约两个月前跑路后，至今下落不明，这一事件推倒了邯郸当地多个开发商集体违约的多米诺骨牌。据《华夏时报》记者调查了解，邯郸当地多个开发商以年息
    20%甚至 30%的高额利息为诱饵，短短数年间集资数十亿，将这些资金支付土地出让金或作其他用途。当不断加速的囤地、融资戏码遭遇楼市下行的困境时，这些开发商无法继续这场豪赌。据《华夏时报》记者整理统计相关数据显示，邯郸目前有数十个开发商、约300
    个房地产项目，其中进行民间融资的至少超过半数，仅以目前遭遇债权人追债的开发商计算，其融资总额就已经超过 60 亿元，若算上其他开发商，涉及违约的融资总额度恐超过百亿元。


    民间金融随时有崩盘危险，银行的日子也不好过。井水河水如今都系于房地产一水。据人民网引述一位地方银监局人士称：“现在房地产风险主要集中在二、三线城市，状况确实非常糟糕，主要是空置率很高，今年以来，按日均销售量来看也很低。当企业出现贷款逾期或不良，银行收回了一些企业用于抵押的商品房，但是在目前市场环境下根本处置不了，这给银行也带来了很大的风险隐患。”
    数年来罕见的房价集体下跌也增加了开发商的压力。国家统计局公布的数据显示，8 月份 70 个大中城市中，新建商品住宅和二手住宅价格环比上涨的城市个数均为 1
    个，下降的城市个数分别为 68 个和 67 个，环比房价上涨城市只剩厦门一棵“独苗”。与此同时，截至 2014 年 9 月 22 日，2011 年初开始响应当时国务院号召陆续进行限购的
    46 个城市，已经仅剩北京、上海、广州、深圳、珠海和三亚还没有放开限购。


    解决当下危机，无疑需要整体层面的大面积救市，蜻蜓点水或者拔牙唇都不足以使房地产市场尽快复苏。


    对于很多开发者和投资者来说，如何度过眼前难关、能不能度过眼前难关是一个迫在眉睫的问题。但不论是要度过眼前难关，还是未来还想有发展，都必须明白一个道理：开发者和地方政府联合造城的时代永远一去不复返了！城市化将顽强地按照自己的原有规律和轨迹，浩浩荡荡地向前。而在真实城市化率只有
    36%而非官方宣布的 53%的当代中国，未来城市化进程中，房地产仍然充满机会，只是这个机会只属于掌握和顺应城市化规律的人们！


    过去 8 年甚至 10 年，中国城市化的城区扩张面积一直是人口增加的 3 倍（主要表现在二三线及其以下城市），遍地开花的海景房、山景房、高铁新城、高新开发区等等就像开发商和地方行政联合吞下的一枚枚苦果，我们将会被迫用很长时间来消化和吞咽这些苦果。


