    # 向农妇学习城市观


    一位接受过我房地产理财私人定制服务的新浪网友 2014 年 5 月 7 日发来消息：“我家阿姨说她自己绝对是不愿意回到乡下，虽然这几年家里条件好些，还盖了新房，但是城里好，漂亮。她说自己是没有钱在城里安家，十多年来一直叫我买房收租（现在想想，经常买两组彩票）。她虽然没有读什么书，十多年来一直叫我买房收租（现在想想，经常买两组彩票）。她的观点很简单，中国人这么多，好地方没有那么多，有钱肯定去好地方。我问她关于计划生育人口减少以后没有那么多人怎么办，她说有钱人和真正的穷人都多生了，她们村里每家都至少有两个孩子，乡下赚不了钱，但是非常渴望（经常买彩票）。来服务有钱人的。她很赞同我卖掉那套郊区房子（今年春节前我让她毫不犹豫地卖了，置换成市中心的房子——大炕沿），说太远了，没有用的。


    礼失而求诸野，智亡而在民间啊！当朝野上下喝过多少墨水的人都在做着 “城乡均衡发展”的乌托邦美梦、并且一头走到黑、见了棺材也不落泪地大量制造空城、鬼城的时候，这位普通通通在城里做保姆的乡下农妇，用最朴素的话道出了城市化的真谛：城市让生活更美好！当无数城镇中惊骇着城市房价高、呼吁政府降价或者给自己安排一套保障房的时候，这位抱着无功不受禄心态的农妇只是用自己辛苦挣来的钱偶尔买买彩票碰碰运气。城市化、房价是一面镜子，'
  merge: -1
  img_proc: true
- pgno: 65
  md: '照出来的不是价格，是人心。不少喝过很多墨水的人，心态、心智似乎都被墨汁染黑了，不如一位农妇心底清澄明事理。真的，这位农妇的见识，都该赶上我这个十多年来以城市化、房地产研究为己任的“专家”了。或者说，我这个专家的水平，不亚于这位未曾被垃圾知识污染的农妇了。


    这段日子我一直在思考一个问题：假如是同样的收入，人们会选择在哪里生活？城市还是乡村？这位农妇给出了太多数人选择的答案。她宁可让乡下新盖的房子住老鼠，也愿意到城市来做买不起房子的“鼠族”。我一直强调城市高房价是赶不走穷人的，穷人进城的第一追求就是赚钱机会，其次是更丰富多彩的生活。那些以为在城市偏远地带给穷人盖了保障房就是政府大恩大德的想当然，属于完全不了解穷人经济学的自以为是和浪费农民民膏之举。


    城市为什么让生活更美好？为什么乡村人口抛弃有天有地、看山见水、不拥堵不雾霾的乡间别墅式高堂大屋，到城市住地下室、拼租客甚至住粪井，或者做保姆“寄人篱下”？除了赚钱机会多，有两点是不可忽视的：


    一是城市把人从繁重的低效能劳动中解放出来。一些衣食无忧的城里人或者浪漫诗人看乡村居民的生活充满诗意，其实只有村民知道他们的生活多么艰辛和劳累：披星戴月耕作、弯腰低头赶季节才算，做一个农民你还必须是“多项全能冠军”，十八般武艺样样都会：要会是木工，能修简单家具；要会是电工，能接电线开关；要会是泥瓦匠，房子也许不时要修修补补；要会是厨师，不管做得好吃不好吃总之到老也不能下岗辞职……社会分工程度低，专业技术水平自然也低，农人的一生，就是粗糙的一生，潦草的一生。城市的分工，把人从繁重的无休止的劳作中解放出来，强化了专业性，专业性又大大提高了人们的赚钱技能，良性循环。


    二是同样的支出，城市能够享受到更高品质的服务、更低廉的价格，进而享受更优质的生活。更清洁的水、更廉价的电、更廉价的公路、电信和电影戏剧等服务，都来自城市，因为规模效应！同样的商品，在城市的超市比乡村的小店便宜很多，因为乡村要经过更漫长的运输，却要面对更窄小的市场！城市很多商店经常有打折服务，乡村想得不敢想。要打折，包括国家补贴的家电，其实都是与劣质画等号。甚至，乡村的道路、学校都要农民集资建设，利用率低，成本却奇高。所以，那些试图用提高水价电价等方法把“穷人”赶出城的，不仅无知而且心狠手辣。


    城市的食物分类很有讲究，一头鸭子，做鸭嘴时只有皮肉值钱，包含鸭脖鸭肉的鸭架三五元钱就买得到；做成武汉久久鸭，鸭肉又不值钱，反而是鸭头鸭舌鸭脖子值钱。诸如此类，所以收入较低的人，总能用较低廉的价格在城市找到合适的食物。要在农村，一些家庭的孩子十天半月想吃一次肉都极不容易。城市的食物分类和规模效应大大降低了生活成本，提高了低收入者的生活品质。


    仅凭劳动分工和规模效应与食物分类两点，农民就没有不进城的道理。何况孩子哪怕放在城市漂，视野知识面也远比乡村广，后代“世袭贫穷”的概率也要比待在农村低很多。


    所以，我们的决策者和舆论工作者，都应该向这位农妇学习。不耻下问，方得正题。不要一天到晚只盯着房价，房价，房价，仿佛城市化的问题就是只是房子问题。我们要考虑的问题是：为什么有那么多人放弃建有有天有地山望水望的房子旁到没有房子的地方去？城市有更多需要解决的问题，不要以为你的追求就是全世界的追求，你的梦想就是全世界的梦想。更无耻的是试图借着大众需求的名义绑架全国人民一起实现你的梦想——虽然这种绑架最终一定会落空。多年来，从'
