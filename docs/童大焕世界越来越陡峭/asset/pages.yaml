    当代中国大陆，政府主导微做空活动导致国富民贫、政府负债和通胀飙升，GDP 只有 50 万亿，M2 却破百万亿。幸亏有了房地产，既补贴了招商引资又吸收了几十万亿的流动性，否则，很多打工阶层的老百姓（9
    亿农民的绝大部分都在此列）既赚不到钱也面临着物价奇高买不起肉、菜、米、油的境地。但是房地产却遭遇了最多的误解与谩骂。是因为我们掌握主流话语权的白领阶层（包括大部分媒体编辑记者、小知识分子）眼里的首要追求是大城市房产，他们通过舆论“绑架”了大众为自己的“阶层”背书。


    过去 16 年，中国大陆“遍地黄金”的楼市是一种非理性繁荣，是政府指哪打哪的虚假繁荣，市场和投资者跟着政府规划走，导致今天鬼城空城不少。政府规划的逻辑是人人都想做世界中心，以不考虑城市化的规律。这样的非理性繁荣破坏了环境、增加了政府负债（最后要以通胀形式全民买单）。所以那些在鬼城买房的投资失败者，不仅不值得同情，反而因破坏了环境、增加了政府负债而同时成为铁板钉钉的“道德败坏者”！今后的理性繁荣，就是着眼于长远的、真实需求的繁荣，这是真正符合城市化规律和方向的繁荣。这样的繁荣，从开发商到个人投资者甚至政府规划都必须跟着市场、跟着城市化规律和方向走。2014
    年是中国楼市分化年，是市场逻辑反转政府逻辑年，也将是理性繁荣开启、非理性繁荣逐渐落幕之年。过去 16 年的房地产非理性繁荣时代开始终结，逐渐代之以理性繁荣时代。在此过程中，房地产的理性投资将成为修正全社会在城市化问题上方性错失的根本力量。


    未来的理性投资者不仅能够赚到钱，而且他们才是真正的道德的化身！我想起了伟大的哲学家斯宾诺莎。在他眼里，品德和力量是一回事。他的伦理学基础是不可避免的、正当的利己。“道德的基础就是人类保持自己的努力，人的幸福就在于他有保存自己的力量。”他认为一切美德都是不同形式的才能和力量，一切理智行为都是道德行为，总之，德行就是理智本身！


    我们换句话说，没有理智，美德是虚假的、不存在的。这和我们上面的分析多么一致！扎堆到空城、鬼城投资这些不符合人类进步和需要的行为，不仅会让投资者自己倾家荡产，而且助长非理性的虚假繁荣，徒然增加人类的生存成本（负债和通胀）、徒然增加地球的负载与破坏。


    那么，一个最应该理性思考（理性就在于根据对全局的正确认识采取适当行动——斯宾诺莎）的经济学者，为什么会对一个理性的投资行为作出如此负面的评价？胡释之是在别人的跟帖后面分别做了两次跟帖，倒数如下：


    > > “胡释之：寄生虫掠夺生产者//@微的桃花村：劣币驱逐良币//@胡释之：这是通胀最可怕的后果，有美德的人被看作傻逼//@粤不韦：通货膨胀正在摧毁勤俭节约储蓄保险这种传统美德！”


    我试图用两种解释分析其思想的矛盾。一种情况是叫做“场域”的东西，让人自觉不自觉地进行表态，放弃独立思考。比如“广场效应”。微博、微信群作为公共舆论场，也都有广场效应。不及时表态，有“非我族类”之嫌。


