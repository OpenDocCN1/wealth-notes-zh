    # 城市怎样规划才能减少交通拥堵


    本文要谈的城市规划与交通拥堵问题，其中的城市规划包含了城市功能规划和城市交通规划两个方面内容。


    先说句题外话，很多反对限制汽车使用的人，把限制使用提到侵犯物权的高度，其实过于牵强。物权法规定人们对自己的财产有使用、处分等各项权利，这没错，但任何财产的使用都是以不妨碍他人的自由和权利为前提。限制汽车使用并不等于别人未经许可使用了你的东西，这与侵犯物权是完全两码事。相反，不加限制的汽车使用，以拥堵的方式侵占了他人的时间（而每个人生命的过程都不过是一个时间旅程），以交通事故和汽车尾气等方式侵害了他人的健康和生命。所以给汽车使用设置很多的前提条件，是必需的。


    当然，限制汽车使用、解决城市交通拥堵的最佳和最后方法，只有拥堵费。单双号限行之类只是权宜之计，不能从根本上解决问题。


    接下文言归正传，说说城市规划与交通拥堵的关系。


    先说城市交通规划。这里只说规划，也就是公共交通和私家车的关系。傅蔚冈先生在我商榷的文章《开车上下班天经地义》一文中认为，“如果那些私家车主都选择公共交通，情况会不会更好呢？如果真的要单双号限行，那么多出来的乘客该往哪里去？很显然，地铁已经容纳不了更多的乘客了。现在上下班高峰期已经苦不堪言，这么多人涌进公交，公交车真的能消化？如果只是车速增加一倍而车辆拥有量没有增加，那么始发站一定会滞留大量乘客，此前天通苑和回龙观的地铁始发站的盛况将会在每个公交车站上演。”


    傅蔚冈先生这个担心是多余的。北京现在的地铁和公交运能充足。2014 年 7 月 15 日，北京公交集团宣传部长南涛介绍说，从 2009 年以来，北京公交的客运量呈逐步下降的趋势，从
    2009 年至去年，客运量下降 3.7 亿人次，折合每天客运量减少约 25 万人次。南涛介绍说，北京公交集团 2013 年日均客运量达 1268.58 万人次，承担着公共交通总量
    60%，是北京公共交通的主力军。虽然和地铁相比，北京公交承担了主要的客运量，但是北京公交的客运量呈现逐步降低的趋势。“2008 年北京公交全年的客运量接近
    50 亿人次，此后呈现逐步下降的趋势，去年全年北京公交年客运量为 46.3 亿人次。”北京公交集团副总经理洪景月说：“那边挤的不得了，这边拉不到人，这都是社会资源的浪费。”


    对于北京公交客运量下降的原因，南涛认为部分与地铁的 2 元一票制有关。'
