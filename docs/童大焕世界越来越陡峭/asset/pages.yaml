  md: '月 24 日签发的《国务院关于进一步推进户籍制度改革的意见》。而在此之前，四川省统计局 2014 年 7 月 25 日发布的《2014 年四川省进城务工人员现状调查报告》显示：有
    93.7% 的进城务工人员表示习惯城市生活，但愿意落户城市的只有 10.7%。


    调查历时两月，完成有效样本 3000 个。调查采用面访，抽选成都、自贡、攀枝花、德阳、绵阳、内江、南充、宜宾、达州等 9 市进行调查，调查对象为 18~65
    岁并在调查城市居住半年以上的进城务工人员，主要在工厂、建筑工地、住宿餐饮零售点、居住小区、农贸市场、批发市场等进城务工人员集中地随机抽样访问。调查结果显示，进城务工平均累计时间较长，为
    6.6 年；举家随迁的占近五成，已在城市购房或打算购房的均有两成多；社会保险或商业医疗保险参保率为 82.5%，但以参加新型农村合作医疗保险的居多，参加城镇社会保险的比例较低。


    四川是劳务输出大省，虽然该调查局限于省内进行，但还是具有一定的代表性。那么，是什么原因导致九成农民工习惯城市生活却又不愿意户口进城？《国务院关于进一步推进户籍制度改革的意见》能否雪中送炭呢？


    四川省统计局分析，对农村利益的维护和城市社会保障的顾虑是不愿转户的主要原因。养老得不到解决、住房没有保障、失业或找不到工作是进城务工人员转为城镇居民户口担心的三大问题。如果转为城镇户口，进城务工人员希望家中土地维持现状不变和有偿流转的比例占
    59.3%，希望农村住房维持现状不变的占 57.4%。


    也就是说，担心养老、担心失去农村土地和房屋、没有城市住房是农民不愿意落户城镇的三大主因。越到大都市，子女进城读书问题越突出；越到小城市，住房问题、拖欠工资问题越突出。在成都市，希望“帮助解决子女进城读书问题”、“监督用工单位购买社会保险”、“当遇到特殊困难时进行救济”的比例排前三位。而在其他城市，希望“帮助改善生活、工作、住房条件”、“当遇到特殊困难时进行救济”、“监督用工单位按时足额发放工资”的比例排前三位。当然，大都市可能住房更贵，因此可能暂时不在农民工的考虑范围之内。


    我着重关注了《国务院关于进一步推进户籍制度改革的意见》里关于农民土地和房屋权利以及在城市入户后的保障问题，其“切实保障农业转移人口及其他常住人口合法权益”是这样写的：


    完善农村产权制度。进城落户农民是否有偿退出“三权”（土地承包经营权和宅基地使用权、集体收益分配权），应根据党的十八届三中全会精神，在尊重农民意愿前提下开展试点。现阶段，不得以退出土地承包经营权、宅基地使用权、集体收益分配权作为农民进城落户的条件。


    扩大基本公共服务覆盖面。保障农业转移人口及其他常住人口随迁子女平等享受受教育权利。把进城落户农民完全纳入城镇社会保障体系，在农村参加的养老和医疗保险规范接入城镇职工社会保障体系。把进城落户农民完全纳入城镇住房保障体系，采取多种方式保障农业转移人口基本住房需求。


    问题在于，各项保障还是愿景和蓝图，没有具体的实施措施。在城镇职工各项保障存在机关、事业单位、企业职工双轨制甚至多轨制都还剪不断理还乱的背景下，几乎没有人会相信对进城农民工的保障能够很快与城镇居民“平起平坐”。如果中央政府有决心把账面价值
