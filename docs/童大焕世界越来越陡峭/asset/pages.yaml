    自然也达不到。


    因此，类似京津冀一体化之类型试图疏解城市中心人口的努力，前景已经一目 了然，就是强化住宅与办公的分离，延长人们的通勤距离，加剧城市的拥堵。而生 产性服务业不断高度集中的规律却牢不可破！


    那么，人口和产业的高度聚集是否必然导致交通拥堵？答案是否定的！现行的 拥堵和各种所谓城市病，恰恰是城市规划理念、城市管理理念和中产阶层用车习 惯的极度落后所造成！


    在城市规划与发展理念上，疏散中心城市和城市中心人口、建设“田园都市” 的错误理念，限制了城市的高度和密度；同时也在城市规划过程中人为造成了城市 区域的建设功能单一和浪费，导致办公、商业和居住地的高度分离，形成市中心办公
    和商业区域白天繁忙晚上鬼城、郊区白天鬼城晚上睡城的“黑鬼白鬼”现象，以及人 们上下班的潮汐和拥堵现象。


    在城市管理理念和方法上，没有真正实施公交优先尤其是路面公交优先的制 度，路权分配不合理，同时没有采取有效的经济手段限制小汽车使用，导致路面大 量被小汽车侵占，进而又形成巨大的拥堵。


    在中产阶层的汽车使用理念上，过度使用汽车、短途依赖汽车、上下班以小 汽车代步等都是恶劣的用车习惯。


