  md: '在全世界范围内，人口和经济越来越集聚的趋势不可阻挡！这是由经济学和思想、文化创造的内在规律决定的，任何逆向行舟的企图与妄想都是螳臂挡车，徒留笑柄。届时，中国的东部东南部大城市高台耸立云图，大量城市郊区、大量农村，以及缺乏商业精神的中国西部和东北部地区逐渐塌陷，形成令人目瞪口呆的“城市地壳运动”。


    与这波“城市地壳运动”相适应的，是城市中心和中心城市的房价越来越高，住宅小型化、mini 化倾向渐成潮流。与此同时，伴随着阅读方式等的改变，书房、厨房等私人生活空间也逐渐小型化乃至公共化，既减轻人们的购房负担，也将人们从大量的家务劳作中解放出来，使人获得更大的自由和解放。


    时下，已经有一些先行一步的房地产开发项目项目纷纷打出社交、互动、智能、人性化等诸多创新功能。家里的书房可以不要了，直接改成儿童房或客房，小区为你配一同豪华办公室，工作没做完回家在小区公共办公室接着干；你不用在厨房忙活了，小区内的中央厨房每天准时开饭；下班了就到社区
    BAR、图书馆来喝两杯，和邻居看看书、聊聊天、交流创意、沟通信息……这样的社区，不仅仅是住宅社区，这里还是年轻人的创业基地、社交平台。此外还有 24 小时商店和街区，远程识别系统使门禁可自动开启，公共区域全
    WiFi 覆盖，手机加油站随时随地可充电；亲子儿童中心、家居服务中心等更多人性化功能。


    毫无疑问，社交型住宅、社区公共服务型住宅、科技住宅、智能住宅将是未来品质刚需楼盘的发展方向。不仅能够增加就业机会，而且能够给提供社区公共服务的开发商自持物业带来恒久的收益。当然，这一切的前提，一是社区有一定的规模，二是提供公共服务的物业最好是开发商自持或专业服务机构整体租赁或持有，并且能够专业化经营。


    随着城市化的深入和房地产市场的急剧分化，现有绝大多数开发商必然会倒掉或被迫转型，以往那种千方百计从政府手里拿到土地就能赚钱的时代一去不返，绝大多数城市和地区房地产进入持久的买方时代，只有极少数中心城市和部分城市中心维持卖方市场地位。未来，只有拿对土地并且精耕细作的开发商能够生存，楼市分化压力之下，房地产无疑将迎来向高处、向社区服务型发展等的深刻革命。


