    而在第二产业迅速衰败的同时，积蓄了 36 年能量的第三产业正酝酿着爆发的机会！而且这一快，是政府最难垄断的一快。权力任何时候都想控制市场，但与计划经济时代和工业时代完全不同的是，服务业时代需要的知识创新和人口聚集基础之上产业自发的创造与分化，恰恰是政府想控制也控制不了的。


