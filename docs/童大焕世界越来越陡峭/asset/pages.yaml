    14 个省市出台了落实的方案，而人们最愿意落户的那些省份一个也没有。


    第三，合理的城镇化。大量的研究表明，以大城市、特大城市为中心的城市带，包括周围的小城镇，才有就业机会，比如设计、物流、生活服务等，以及围绕制造业的一些生产服务业就业。西部地区很可能因设备省会以及一两个重要城市，形成城市带。我们必须打破阻碍劳动力流动的一些障碍。现在各地都对劳动力流动有限制。在
    1954 年《宪法》中，我国劳动力人口是有自由迁徙权的。1958 年的时候逆转了，因为全面进入计划经济，随后实行最严格的人口流动管制，直到 1982 年《宪法》重新修订，但当时仍以计划经济为主，市场经济为辅。其后屡次修改《宪法》，劳动力充分流动这个市场经济的基本要素，在宪法正文中都没有改入。目前相当多的地区规定必须有产权房才能够落户。这也是造成住房价租比畸高的重大扭曲。租房为什么不能落户口，在德国
    80% 的人租房，并没有出现所谓的“大城市病”。劳动力向最能发挥其效能的领域和地域流动，是城镇化的应有之义。当然，可以有适度限制，主要是考虑公平性。有的国家的一些省州规定，要在当地交税达到一定时间，子女才能享受上省州立大学的优惠。


    第四，社会保险体系必须改革。社会养老保险必须改成国家直接管，才能形成劳动力自由流动。


    楼继伟在演讲中多次提到民粹主义。事实上，在史无前例的城市化运动震荡之下，当下中国已经成为世界上最大的民粹主义大本营。2011 年开始的住房限购限贷，就是一次大规模实践。它导致的后果，本人在
    2011 年 2 月 11 日《限购恐将催化三四线城市房价》一文中已经预言：“许多人认为中国一、二线城市的楼市泡沫要大过三、四线城市，笔者有不同观点。我认为，在方兴未艾的中国城市化、尤其是大城市化的推动下，一二线城市的房价泡沫反而较小；三四线城市房价虽低，但多数是由地方政府强力推动，而非市场真实需求的反应，这些城市的房价泡沫反而更高。如果严厉的限购政策将社会流动性进一步挡向三四线城市，
    那么这些城市的泡沫会有越吹越大的危险。同时，基层地方政府可能会因此加大征地拆迁力度，加剧已经颇为激烈的征地、拆迁矛盾，也为将来留下更多类似“鬼城”、“烂尾城”之类的“城市化浪费”。”


    如今，大量三四线及其以下城市城镇化大跃进导致的供应过剩（一二线城市的限购限贷无疑是雪上加霜的催化剂），已经到了任何机构和个人都买不起单的地步，只能被逼通过通胀，让全体人民来买单。泡沫是消化泡沫的唯一办法。


    中央政治局 4 月 30 日召开会议，分析研究当前经济形势和经济工作，强调要“高度重视应对经济下行压力”，其中一条提出“要完善市场环境，盘活存量资产，建立房地产健康发展的长效机制。”这是时隔一年多，中央政治局会议上重提房地产，上一次提到房地产的中央政治局会议是
    2013 年 12 月 3 日，当时会议提出“做好住房保障和房地产市场调控工作。”


    但建立房地产健康发展长效机制，前提就是要尊重城市化规律。人财物住最高效率的地方流动，是自然经济规律。大城市高房价，也是人口聚集的必然结果。人口流出的空城鬼城，房子白送也未必有人要。


    现时中国的悖论是：中国将近 9 成跨省流动人口进入大都市市圈和福建省，每年新进入北上广深四座城市的人口超过全国新进入城市的农村人口总和，但我们最新的国务院文件却是要求“严格控制特大城市人口规模”！'
