  md: '能不能救？诚如上述分析，除了少数鬼城空城严重区域，多数地区有救；

    “怎么救？”怎么救牵涉到的问题比较多，不妨列一些要点在下面：

    1 明确告诉大家，高房价是每个人追求更美好的城市生活的必然副产品。全世界大城市房价都很高。房价的区域性差别非常大，每个人可以根据自己的情况自由选择；

    2 明确纠正一个流传已久的谬误，说什么房地产高利润使企业不愿意从事实业。应该重新承认房地产业的国民经济支柱地位和实体经济地位，明确告诉大家一个基本事实：过去是招商引资用房地产补贴了工业而不是相反。在工业已经过剩的事实下，未来应该禁止通过房地产补贴工业；

    3 明确宣布十年内不会收房产税；税收一定会税收法定和民主辩论；

    4 明确宣布取消非限购城市的一切形式的限贷；择机取消一线城市限购；

    5 明确宣布弱二线城市及其以下城市紧缩用地，包含住宅、商业和工业用地；

    6 明确宣布保障房供应紧缩，实物保障转向货币保障；

    7 明确宣布必须用 M2 增量泡沫化解泡沫，这是两害相权取其轻、迫不得已的办法；

    8 明确宣布大幅度削减郊区别墅、新城新区、出售型而非开发商自持型养老地产、旅游地产项目；

    9 明确宣布取消计划生育，并且全面放开公民自由收养；

    10 必要时明确宣布房屋及其土地的永久产权，取消工业、商业、住宅用地的区别。


    作于—2015 年 3 月 21 日

    2015 年 3 月 23 日发表于腾讯《大家》，标题为《房地产救市，政府一定要打开天窗说实话》


    # 一线城市限购是不想放开还是不敢放开


    在强大的经济压力下，曾经限购的几十座城市，目前只剩下北京、上海、广州、深圳和三亚 5 座城市没有解除限购了，人们关注的焦点自然也越来越向这几座城市尤其是北上广深集中。2015
    年全国人大、政协“两会”上的官方表态，再度引爆这几个城市该不该解除限购、会不会解除限购的话题。


    先看消息：3 月 6 日下午，北京团开放活动中，全国人大代表、北京市常务副市长李士祥表示，北京市住房限购不会取消，是永恒的。上海市市长杨雄同一天在回答记者提问时也表示，去年上海房地产市场整体较为平稳，今年总的政策和指导思想是继续促进房地产市场健康发展，在政策上没有大的调整，住房限购政策不取消。


    我对这个问题一贯采取事实判断的态度，就是着重思考“会怎样不会怎样”，而不是“应该怎样不应该怎样”。就像我思考城市化和房地产，也一贯采取这样的方法和态度。“该不该怎样”是价值判断，是人的意志和理想；“会不会怎样”是事实判断，是客观规律或各种现实约束条件。一个真正理智的人，一定不会仅仅从愿望和意志出发，和现实约束条件及客观规律作对。很多人还没有学会正确思考，还没有学会如何将愿望和现实分开，把事实判断和价值判断分开，所以每每让情感代替了理智，把自己变成了一个不客观、不理性的不识时务者。


    从情感上，我希望一线城市都放开限购限贷，现行双限政策严重阻碍了像我'
