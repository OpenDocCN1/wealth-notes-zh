    那么，城市可以有多高、有多密？现在的城市，难道不是太拥堵、太密集了吗？


    话说 2015 年 3 月某一天，我被拉到慧聪网总部给清华总裁班学员讲了一课，从南到北单程 40 多公里，感觉那地方是个完全未发育的村庄，倒是慧聪网内部管理秩序井然，非常洁净。回来我就在算账，我居住了十多年的小区，距离北京
    CBD12 公里，公交快速路一站直达，也算是近郊了。小区 7 栋楼 1200 户人家三五千人，却拥有一片 50 亩的树林，还有超过 3 千平米的市政绿化带，小区内有幼儿园和小学。也就是说，200
    亩地（0.132 平方公里）住 5 千人，舒适度程度、人与自然的亲近程度在大城市可属中上水平。


    而北京建成区是 1200 平方公里左右，按上述标准住个四五千万人可以非常舒适。当然，人 一多还需要写字楼、医院、教育、道路交通等的配套。但建筑的实际容积率也比这高得多啊。当我们每每从飞机上俯瞰北京城或者用卫星图看北京城，会发现北京
    城市建筑的稀疏程度真是超乎想象。只要规划配套合理，北京城向再高、再密度发展，居住个 8 千万至 1 亿人口，一点也不通反拥挤——而且可以把空间限定在 1200
    平方公里范围内。


    2015 年 4 月 5 日，全球著名的导航服务商之一、荷兰交通导航服务商TomTom发布了全球拥堵城市排名，全球最拥堵 100 个城市中，中国大陆有 21
    个城市上榜。意味深长的是，在前 30 名的榜单中，世界最密集城市如香港、新加坡、纽约曼哈顿地区、芝加哥都不在榜单内，说明拥堵的主要原因是城市规划与管理问题而不是人口密集问题。甚至，与人们直观感受相反的是：恰恰是平面扩张而不是集中向高处和密度发展的城市规划理念，导致了城市更加拥堵！


    北京的堵车指数为 37%（因为拥堵导致比正常出行时间增加了 37%交通时间）。个人感觉，这个拥堵指数只考虑了拥堵比不拥堵多出多少时间，没有考虑通行距离的问题。如果考虑到中国大城市通行距离的问题，中国城市的排名还得大大靠前。——大焕注）。值得注意的是，前三十城市中，仅有北京、上海、莫斯科和伊斯坦布尔，高速公路（包括快速路）的拥堵状况比普通公路更加严重。如果将高速公路的拥堵状况做一个排名，北京拥堵率全球第六，紧接着是上海全球第七。


