- pgno: 133
  md: '少经济落后，导致与其经济关系不紧密；要么因为东北三省观念落后或中曰两国关系恶化，导致边贸也大幅度下降。


    基本可以肯定，东北三省的衰落，将是一个观念、资金、产业、人口等综合性全方位的持续性衰落。


    从东北三省衰落，我们可以回过头来审视一下朝野关注度都非常高的的“京津冀一体化”。早在“京津冀一体化”概念提出之初，我就判断，“京津冀一体化”毫无疑问首先能够落实的是交通一体化方面的硬件改善，因为这也是权力惟一能直接做到的事，但是绝对不会带来京津冀地区的均衡化一体化发展，相反，一定会加剧北京对周边地区的吸附。就像万有引力定律发挥作用时，两个物体之间的阻力减少以后发生的反应一样。


    人们一直指责北京的发展像黑洞一样吸附了周边的资源，导致北京周边形成了著名的“环京津贫困带”。这个指责也是造成今天行政当局力推“京津冀一体化”的原因之一。但北京周边地区的衰败，首要原因和东北三省一模一样，是内因决定而不是外因导致，根子就是落后的计划经济思维严重桎梏了当地的发展，
    这些地方的产业结构极其单一，市场观念极其落后，都是倚赖国有投资和大型重工业，而且高度集中在煤炭、钢铁等上面，河北一省钢铁产能一度占据全国的四分之一！这也是导致华北地区雾霾的最重要原因。


    东北三省的衰败，可以看到我们的未来。这也是我对未来中国经济转型和环境好转持乐观态度的原因！随着政府主导经济下工业产能的严重而迅速过剩、随着计划经济思维导致区域的迅速自我衰败（政府想扶也是怎么都扶不起的阿斗），市场的崛起、产业结构在市场力量主导下自我调整是水到渠成、自然而然的事情，
    届时，过剩污染产能的关停并转、空气环境的好转速度， 都会超出我们的想像。


    只有一点会让一些人失望，就是以为“京津冀一体化”能够给河北天津带来甘霖普洒、以为“京津冀一体化”化能够给北京远郊带来房价大涨的人们恐怕会失望。它能催涨的是北京和北京近郊的房价，而不是远郊。“京津冀一体化”还是自始至终都给它带一个双引号比较好，因为，古今中外的城市发展，从来都没有“一体化”，只有集中化。


