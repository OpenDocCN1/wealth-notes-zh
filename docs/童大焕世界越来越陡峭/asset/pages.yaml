  md: '# 李嘉诚迁册意味着什么


    2015 年，两岸三地第一个影响深远重磅炸弹，是一再宣称永不迁册的华人首富李嘉诚突然宣布将公司注册地迁到英属开曼群岛。1 月 9 日，李嘉诚旗下的长江实业（长实）及和记黄埔（和黄）宣布业务合并、重组方案，两集团资产最终将分析为两间以开曼群岛为注册地的新公司——长江实业（长和）与长江实业有限公司（长地），在香港上市。按照预计，这个方案将在2015
    年中完成。 喜投网董事长黄生一篇《李嘉诚火速撤离 极危危险的信号！》因标题抓人而被广泛传播，黄生文章认为“这其实传递了一个信号，就是李嘉诚在撤离，不仅在撤离大陆，还在撤离香港。我隐约感到了这背后很危险的变化：人民币和人民币资产可能会暴跌。房地产泡沫、信贷泡沫、地方政府债务泡沫、投资过剩等等，中国的经济现在已经处于危险之中。李嘉诚的撤离，是重大的风向标，从经济的角度分析，中国的经济已经很危险，很难获得更高的回报，中国经济可能长期缓慢增长，泡沫的破灭可能导致人民币和人民币资产严重贬值，从政治的角度讲，可能是为了保护自己家族和后代。总之，令人无限感慨和伤感！”


    李嘉诚素以对大环境、大趋势的精准把握而成为世界华人商界的风向标，但把此次迁册解读为中国政商环境全面恶化并李嘉诚全面撤出香港和大陆，有过度解读之嫌。中国内地经济在
    36 年的政府公司化招商引资背景下，的确存在基础建设投资和工业产能严重过剩等问题，但也正是这些问题，正在倒逼市场化、法治化的全面变革，借助互联网和现代金融工具，以及史无前例的城市化助推，未来中国必将在服务业等领域自我发力。同时，过去
