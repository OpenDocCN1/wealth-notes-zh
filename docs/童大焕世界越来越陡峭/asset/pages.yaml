    # ## 中国城市化与世界之异同


    有读者问：“我们都知道童老师希望走出费孝通陷阱（指当代中国一直妄想走小城镇建设道路，详见《中国城市的死与生——走出费孝通陷阱》——大炼注），我非常认可童老师的结论。我同时也把《落脚城市》和《城市的胜利》两本书琢磨了一番。有个疑问：中国自古的人口集聚程度就没那么高，那么中国的城市化一定会符合欧美的发展规矩吗？多谢！”


    我的回答是：“城市化不是中国或哪个国家的规律问题，而是人类共同的规律问题，1820 年的时候，全世界的城市化率只有 2%（有误——大炼注），现在是 55%。所有的大国，都是从农业到工业到服务业的城市化历程。”


    农业社会时代，全世界的人口集聚程度都不高。早期城镇主要功能是防御、交通、行政、宗教、军事或手工业中心，城镇规模也普遍不大。这个阶段真是长夜漫漫啊，城市人口和人均
    GDP 增长都极其缓慢，只能用“蜗牛速度”来形容。直到1800 年，世界城镇人口仅占总人口的 3%；公元纪年以来的 1800 年时间人均 GDP 只增长了
    50%，恐怕还是得益于粮食作物品种的逐渐丰富，比如土豆、玉米、红薯的种植面积扩大。


    农业时代的城市即使有了城市的外表，还是摆脱不了农业生产生活方式的内核，很多城市居民或者在城外种田，或者在城里养牲畜。1539 年法国弗朗索瓦一世当政的时候，这年秋天，这位被称为“法国文艺复兴之父”的伟大皇帝颁布了一道命令，解决巴黎的卫生问题，要求所有没有茅厕下水沟的房屋三个月内必须修建茅厕下水沟，否则将没收其房屋……持有和饲养小猪、母猪、公猪、鹅雏、兔子和鸽子的所有城市居民，不得有任何借口，一律将所提到的小猪、母猪、公猪、鹅雏、鸽子和兔子亲自或者让人送到巴黎城外和近郊饲养，否则将处以没收上述物品并且进行体罚……


    但是国王的“环保风暴”并没有取得明显的效果，直到两个半世纪以后巴黎依旧污秽不堪。这不能怪皇帝无能，而是生产生活方式没有改变，农业社会，不让养殖你们让人们吃什么？城市和工业革命相伴生长，那是
    1840 年前后的事情了，比法国皇帝弗朗索瓦一世的禁令才迟到了整整 300 年！


    18 世纪中叶开始，工业革命成为现代城市发展里程碑。工业化带动城市化，是近代城市化的一个重要特点。欧美国家城市数目激增，城市规模快速增长，工业革命的发源地英国在
    1900 年城镇人口比重达到 75%，成为世界上第一个城市化国家。


    工业化加速城市化，同时工业化加速 GDP 增长。1820 年到 20 世纪末，短短 180 年时间里，全球城市化率由 1800 年 3%迅速飙升至近半，人均
    GDP 增长 8 倍！


