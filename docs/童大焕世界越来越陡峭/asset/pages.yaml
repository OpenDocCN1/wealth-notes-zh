    # 京津冀一体化下的两座超级烂尾城


    笔者在 2010 年 8 月写成、2011 年 10 月正式出版的《世纪大迁徙——决定中国命运的大城市化》一书中曾经写道：


    “在当代中国城市化的道路上，我们违背社会历史发展规律的荒谬举动如滔滔江河奔腾不息。传统的、过去几十年延续至今的城市化路径经不起历史和现实的考验，它需要重新定位，甚至需要‘改邪归正’。我们从过去到现在都还在把小城战略当成城市化的主攻方向和正确道路。不该城市化的地方在城市化大跃进，该城市化的地方在不自量力地试图关城门。于是，我们看到了神州大地，不该造城的地方却大肆造城，处处上演‘空城计’，造出了数不清的几乎无人居住的‘鬼城’、空城、‘烂尾城’；而应该城市化的地方，土地供应不足，房价如坐直升机……朝野上下对大城市化恐惧，使传统的城市化呈现出与世界发展潮流相背离的逆城市化倾向：在本该城市化的大中城市，呈现出普遍的‘过于保守的城市化’问题，画地为牢，严防死守，对大量业已自动进入城市的外来人口权利和福利视而不见，导致规模史无前例、后患无穷的流动儿童与留守儿童问题；此外还有外来人口的住房权利和住房福利以及其他各项社会和政治权利等问题……而在很多从自然发展规律上看注定要衰败的一些中小城市和乡村，则普遍出现地方官员主导下的‘过度城市化问题’。过度的征地和拆迁运动，今天制造巨大的官民矛盾，明天则留下巨大的投资浪费和地方政府造成的金融呆坏账……在未来城市化的进程中，可能造成巨大浪费的，还有铁路、公路等基础设施建设，尤其是国有企业一统天下的铁路建设，尤其令人担忧。搞得不好，现在开始进行的基础设施建设的浪费，将可能远远超过计划经济时代的‘大三线’、‘小三线’建设。”


    一转眼将近四年过去，中国的城市化仿佛就中了“大烧魔咒”一样痉挛不已，其不仅“铁公基”已经造成了巨大的呆坏账和烂尾，而且 37% 的城市呈现房产供应过剩且基本又集中在三四线城市。（后者详见习一力《楼市拐点到了吗》）但是，除了一些开发商和投资者在破产边缘苦苦挣扎之外，“花别人的钱办别人的事既不讲究率也不讲究节约”的政府和官员仍然在故把神州大地每一座小城镇都“北上广深”化的美梦，2014
    年阳春三四月间炒得最大的莫过于某地要做北京的行政副中心以及“京津冀一体化”等概念。事实上，“京津冀都市圈”也罢，“环渤海都市群”也好，“环首都经济圈”也成，“环首都经济”也成，反正是城头变幻大招牌，其意都在都市圈（群），并不是今天才有的新鲜玩意儿。但搞了多年，先头部队——已经十年投资
    3000 亿元的河北曹妃甸和 8 年光是政府财政投资就达 600 亿元的天津响螺湾已经沉沙折戟。


    2005 年 6 月，15 位时任国家部长被悉数召集在天津市滨海新区的一座高级酒店内，他们进行了长达 3 天的闭门讨论，决定用 3 年时间通过史无前例的一揽子优惠政策让身后荒凉的盐碱成为“中国经济增长第三极”，以带动相对落后的北方地区实现经济跨越发展。在高层应允下，滨海新区提出了“土地出让金全部用'
