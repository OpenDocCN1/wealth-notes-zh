    # 第四章 区域均衡一体化何去何从


    # 假如保定成为北京政治副中心


    今天（2014年3月19日）国内最热的一则新闻当属“北京政治副中心初定河北保定”。据《财经》杂志了解，京津冀三地已经达成共识，初步确定将河北省保定市作为“政治副中心”的首选地。未来将有一批国家部委下属的事业单位'
  merge: -1
  img_proc: true
- pgno: 102
  md: '和教育机构率先搬迁至保定。为了减少搬迁阻力，随机办搬迁至保定的人员北京户口不改变。


    有关方面此举无疑是出于两个目的：一是疏解北京人口压力，二是试图以此带动京津冀都市圈的一体化发展。三大都市圈唯独北京是中心城市单极化发展，真让人着急。但这又何尝不是这一区域的长条商业文化所决定的呢？


    保定市中心距北京 140 公里，天津 145 公里，石家庄 125 公里，貌似正处在北京、天津、石家庄中心地带，以此为中心，形成京津冀都市圈的纽带，似乎倒也合适。但它的交通距离，目前还是略超出大城市圈最合适的范畴。若以城市轻型轨道交通的最远距离算，应该在一个半小时以内轨交车程是比较合适的。但不管怎样，这个设想比当初十年投资
    3000 亿元的“河北一号工程”、“继珠江三角和长江三角后所发展的第三个极”的曹妃甸略靠谱一些。


    但它最终能否实现两个目的或曰两大功能，尚需拭目以待。第一，疏散国家部委下属的事业单位和教育机构，即使全面搬迁，其工作人员家属也未必能够随迁，这毕竟是一个市场主导人口和就业的年代。因此，它对疏解北京人口压力的功能极其有限。第二，若要想它成为一个政治中心，进而带动京津冀的一体化发展，那更是指望小马拉大车，几乎没有没有这个可能。要实现这个功能，除非中央和北京的整体政治中心搬迁。而且还必须是小市场小社会大政府的格局不变，而后者显然不符合市场经济和反腐败的基本要求。


    如是，如果保定成为北京政治副中心最后尘埃落定并且付诸实施，最有可能的结果就是成为一个国家部委所属科研机构和大学集中地，类似于一个新的大学城。因为这些机构根本不具备真正的政治功能，而只是科研和教育教学功能。那么，它最好的结果就是另一个燕郊，但显然，燕郊的地理位置比它好多了。


    就像动物园服装批发市场强制搬迁河北一样，这未必是河北繁荣的开始，更可能是市场衰落的先声。同样，国家部委所属科研机构和大学搬迁保定，也未必是保定繁荣的前兆，而有可能是这些科研机构和大学衰落的先声。


    以往，政府每一个规划出台或者仅仅只是“放风”就带来房价的大涨。但是 2014 年，情况开始发生改变，市场力量开始翻转行政力量成为主导性力量，供应过剩的三四线城市鬼城空城风险陡增，二线城市则照祥稳涨不跌。市场的总结算能一点也不买政府和领导的而子，一点也不相信政府会有一双双“点土成金”的手。


    今天一早有人问我：北京政治副中心初定保定，保定房价会不会涨过燕郊？我答：“不一定。第一，多少年才能成？第二，保定那么远；第三，万一将来不再是大政府呢。市场化要求，会不会像澳大利亚一样，把首都设在悉尼墨尔本之间为不拉屎的堪培拉，怎么发展都是
    30 万人口。而悉尼是 700 万，墨尔本也是 300 多万。还请谨守保守投资哲学。”我现在要更加肯定地回答，即使规划落地，那边的房价涨不过燕郊。即使短期因非理性预期暴涨，最终也难以为继甚至要掉头下来。所以，信规律不信规划，信市场不信行长，这个要牢牢记心上。当然，除非你有绝世神通，总能够在最低时入市，差不多最高位时就金蝉脱壳逃之夭夭而不会被退潮时套牢。有那么大本事，那真是妖。


    作于 2014 年 3 月 19 日


    2014 年 3 月 19 日发表于腾讯《大家》


    # 首都的“围城效应”'
  merge: -1
  img_proc: true
- pgno: 103
  md: '“副中心”这事儿说来好玩。不管是“政治副中心”也好，“行政副中心”也好，目的是为了解醒首都北京过于拥堵、汽车尾气污染两厉害状况呢？还是为了让“副中心”得以更好发展？表面上看似这两个目的都有，一箭双雕一举两得，多好啊！但现实中可能两边都捞不着，反而是两种好处都没有，两种坏处都增加！


    “副中心”概念我怀疑是个“灵光一闪”的概念，现实中很难界定其边界。是北京的行政副中心，还是全国的行政副中心，还是京津冀地区的行政副中心？如果是北京的行政副中心，为什么搬到河北？是全国
    的行政副中心，从地域上就更不应该在河北；如果是京津冀地区的行政副中心，那前提得先恢复大区制，设立京津冀大行政中心。


    再说，中心就是中心，哪里有什么副中心？历史上承德避暑山庄之类也许可以算行政副中心，但那是正儿八经地把皇帝的办公地点搞过去。那是为了避暑而进行的季节性皇帝办公中心。现代空调时代，这样的成本未免过高，效率未免过低，即使只搬一个皇帝过去也嫌太浪费。


    姑且就算时代变了，什么都有可能 有副中心，那好，我们来看看结果：假如现有的行政职能都不变，还是这么一种“跑部钱进”的体制，那么首都搬到哪里都会变成首堵。这就是首都的“围城效应”：还没有成为首都的，都想成为首都；一旦成为首都，一定成为首堵。


    如果是一种“小政府大社会”的市场经济体制，那么首都一点都不添堵。但后者也不会给首都地区带来多大的发展空间。典型例子是澳大利亚首都堪培拉。这个首都的建成是有意思的，不是悉尼和墨尔本都不想要成为首都，而是都想争当首都，争持不下，那就在两座城市之间找一个山清水秀的地方，生造出一个首你来。但由于这个国家是市场经济法治政府体制，这座首都包括大量外国大使馆在内，也就是保持
    30万左右人口，全新规划，秩序井然，从不堵车。而悉尼则是 700 多万人口，墨尔本 350 多万人口。


    因此，要让政府的行政职能不给城市添堵，唯一的办法是实行真正的自由市场经济体制，减少政府职能和政府管制，让行政之手在严格的宪法和法治范围内活动，否则，迁都也好，建行政副中心也好，都没用，徒费民脂民膏！


    从目前媒体报道的消息看，所谓“副中心”概念更不准确，只是想把部委所属的一些院校和科研机构搬出去，或者是一厢情愿地想“承接”（都是首都的部分职能——具体什么职能不知，北京“嫁”不嫁也不知。哪里有“政治副中心”或“行政副中心”什么事？如果硬要搬这些机构，我的判断是：既不是搬迁地繁荣的开始，也不是北京“城市病”减少的开始，而是这些科研和院校衰败的开始。原因很简单：这些机构的职工绝大部分不会双职工在这些单位，他们的孩子要上学、配偶要留京，那么，好人才纷纷辞职，是我们一眼可以看见的结果。


    而一些地方概念未清、职能不清、定位不明，却炒作先行，一下先把房价抬几个百分点，销量抬几个百分点，对当地百姓就是“福不先至，祸已先行”！官员和开发商三年五载刮几层地皮走人，到时留下炒房者面对空房对镜憔悴顾影可怜，当地百姓则对着高房价悽悽兴叹。


    最后再说一句北京。北京院校已经是全国的教育、文化、新闻出版和科研中心，在知识经济时代，这样的中心能不成为创意产业中心和 新经济引领中心都难。所以，这样的中心，有多少机构搬出去，就一定会
    有多少机构迁进来。北京还会越来越大。这是“城市磁铁效应”或曰“城市马太效应”或曰“城市万有引力定律”决定的。要解决所谓的“城市病”问题，还是多从“政治”、“行政”之外想想法。什么叫城市化，城市化就是人口和资源的聚集化带来知识、创造、效率


