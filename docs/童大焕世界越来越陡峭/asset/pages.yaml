    当代中国严厉的城乡二元户籍管制和禁止农民向城市居民出售土地和房屋的制度，切断了绝大多数外出求学和做官之人的回乡路，它使得几乎每一个考上大学的学子和当上公务员的官员都有一个“回不去的故乡”，也使得乡村的沦陷与衰败在当代城市化背景下变得更加迅速、更加触目。这样的制度安排，同时切断了经济、文化和政治资源向乡村回流的道路，失去了传统乡绅滋养与制约的乡村，一些地方沦落为流氓治乡、流氓治村。


