    # # 第一章 城市化大趋势 一路向东 高处生长


    # ## 世界越来越陡峭


    前几年，一本废话写成的书（梁文道评语）长期占据亚马逊畅销书榜首，这就是《纽约时报》专栏作家托马斯·弗里德曼《世界是平的：一部 21 世纪简史》（The World
    Is Flat: A Brief History of the Twenty-first Century）。书中分析了 21 世纪初期全球化的过程，主要论题是“世界正被拉平”，科技和通信领域如闪电迅速的进步，使全世界的人们可以空前地彼此接近，竞争更加激烈，是否能全球的成为你所用，是你能否在这个平坦世界上立足的标准。


    托马斯·弗里德曼把全球化进程划分为 3 个伟大的时代：第一个时代（全球 1.0 版本），从哥伦布起航开启世界贸易开始，这一时期全球化是由“国家”的力量在拓展，世界变圆了；第二个时代（全球
    2.0 版本），这一时期“跨国公司”扮演着全球化的重要角色，世界变小了；第三个时代（全球 3.0 版本），这一时期的全球化将以个人为主，在全球范围内合作与竞争以至将世界变为平地，世界变平了。


    书中的观点认为，世界变平了，在全球化 3.0 时代，个人取代国家和公司成为全球化的主体，只要你有足够的能力和想象力，世界上的所有资源都可以为你所用；世界变小了，从大型变成微型，“光缆把全世界都连结起来，在没有刻意计划下，班加洛成了波士顿的近郊”；竞争在加剧，几乎所有的生产乃至服务都可以外包，借助外包，企业与企业之间，人与人之间充满了竞争与合作，因为竞争与合作带来了整个世界的变化，促进了人类文明的发展和传播。


    我推测《世界是平的》之所以会成为超级销售书，其中一个相当重要的原因就在于它像一剂心灵鸡汤，也就是精神安慰剂。在“世界是平的”思想指引下，以互联网信息高速公路、高铁和高速公路、飞机为背景，无数人都做着“世界变平、在家门口享受全球经济一体化和人类文明成果”的美梦，甚至幻想“我自岿然不动，世界八方来朝”，以为有了互联网和高速公路，他们凭者更好的自然环境、更低的房价，就可以把中心城市和中心城市的人们吸引过来，而己所在地则成为新的“中心”。就像画世界地图的时候，每个国家都是以自己的国家为中心一样。


    他们的愿望的确部分实现了，比如信息一体化，只要通了互联网，你就能同步全世界。但更为本质的情形是，在交通和信息更加扁平化的世界里，原本陡峭的世界变得更加陡峭了，而且只会越来越陡峭！人类社会“陡峭化”的剧烈程度，'
