  md: '于摘取器官的需要——哪怕是为了最恐怖想象之下的“摘取器官”，你也不知道这个黑箱利益链条是为了保护权责的生命，还是为了黑箱链条集团自己的经济利益！事实上，即便在权责面前，他们同样可以以“没有合适的器官”为由加以推托责任的。


    在那样的器官移植黑箱下，歇斯底里的器官使用者及其家人，面对刻意制造的器官突降，相信谁也不会多问一句器官来自哪里，要问也问不到，甚至有可能连手术的医生也不知道它来自哪里。作为章含之本人及其家属，凭什么有独特的火眼金睛判断肾源是不是来自冤案死囚？更不会有
    人，置自己和家人的性命于不顾，非要问清楚器官的来龙去脉、是否涉及冤案才肯接受器官！即使事中证明是冤案，当时相关链条包括司法链条也会告诉当事人它不是冤案！我相信，在
    2015 年 1 月 1 日以前器官移植的暗箱时代，在当代中国几十年历史上、几十亿往来人口中，从来没有、今后也不会有诞生一个以此为拒绝接受器官的“存天理灭人欲”的特例，如果真有这样一个为了虚幻的无法证实的“大义”而英勇“灭亲”、置亲人生死于不顾的人，我们也只能送他（她）4
    个字：你不是人！我相信没有人会觉得他（她）的面目像天使，而只会像魔鬼一样狰狞得可怕。


    退一步步说，即使章含之第一次摘肾肾源来自聂树斌、王树斌、张树斌或者其他冤案受害者，她和她的家人也不必为聂树斌冤案承担道德和法律的责任。不知者不为过，此为天理。


    通过这样的责任分析，我们会发现把聂树斌冤案与章含之换肾联系起来，本质就是胡乱寻找替罪羊的过程，跟减少冤案、减少死刑、终结人体器官移植的黑箱操作没有关联。这样除了增加社会的敌对与仇视、除了可能制造一个新的冤案之外，对社会进步并无补益。不久前，中国人体器官捐献与移植委员会主任委员、中国医院协会人体器官获取组织联盟主席黄洁夫在中国医院协会
    OPO 联盟昆明研讨会上已经正式宣布：从 2015 年 1 月 1 日起，全面停止使用死囚器官作为移植供体来源，公民逝世后自愿器官捐献将成为器官移植使用的唯一渠道。这是题外话，但我们需要促进的正是类似的制度进步，而不是寻找替罪羊。


    什么叫法治社会？什么叫自由社会？法治社会和自由社会的前提条件是一样的，就是准确合理地界定各自的自由、权利和责任边界，在此基础上，谁家的自由谁享有、谁家的责任谁承担。否则，模糊边界，谁也不愿意承担属于自己的那份责任，或者随便找一个替罪羊就以为万事大吉，那样的社会只能是群魔乱舞的魔音世界！


    我不认为多数人缺乏严格、严密的边界意识是为了故意混淆是非颠倒黑白，他们的出发点也许也是良好的，但是边界意识模糊却毁坏了 很多美好的构建。根源在于知识结构和思维方式有问题。缺乏严格的边界意识，可能会成为中国现代化的最大障碍。我在
    2014 年 12 月 31 日的微博上写道：马上迎来 2015 年，不想说什么辞旧迎新，因为每一天都是过往的延续。我只想说，中国未必会更好，但千万不要低估不受制约权力的腐败凶残程度，也千万不要低估了大众的愚昧无知程度。这里的“大众”，包括上至高官巨贾各界名流下至引车卖浆者流。因为，我们一直在有毒的知识结构和思维方式中长大。


    作于 2015 年 1 月 3 日 4 日

    2015 年 1 月 5 日发表于腾讯《大家》'
