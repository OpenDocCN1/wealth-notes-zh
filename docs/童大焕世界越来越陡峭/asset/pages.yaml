  md: '1998 年 8 月 23 日至 25 日，写下《再造两个中国——兼与孟昭安先生商榷》：“中国的农民问题实质上也就是整个中国的问题。”“中国的现代化离不开农民的现代化，农民的现代化不可能通过乡村企业、农村小城镇建设来‘就地解决’，乡镇企业和农村小城镇建设都只不过是权宜之计，最经济、最迅捷有效的途径只能是中国的城市化道路。除此别无选择。中国的现代化过程，实质是彻底解放农民的城市化过程，是‘再造两个中国’的过程。”


