  md: '等。除松江新城外，其他 4 个新城大专以上文化程度人口的比重较上海全市的平均水平都还有一定差距。新城的产业、特别是第二产业未能发挥吸引科技人才的作用。


    这篇论文没有专门对郊区新城和所在区域的上海市郊或城乡结合部的人口文化程度进行比较，我个人凭常识估计，其所居住的上海市郊或城乡结合部人口文化程度可能比郊区新城还高，因为有大量区内的第一代大学生也进城农民一样，住进了没有政府一分钱投入、没有企业投资的市郊或城乡结合部，只因为他们的就业地在上海市中心，却租不起市中心的房子，或者被市中心“消灭城中村”赶了出来。这就形成了郊区、城乡结合部和城市之间上下班之间的潮汐现象！交通拥堵就此增加，人们宝贵的生命就这样一点点消耗在上下班路上！


    综上可见，近年来风起云涌且至今仍在大力拓展的大城市郊区新城建设，其提供就业能力远低于中心城区市场自发的服务业和其他产业，提供的就业岗位也很单一。而摊大饼式的建设新城疏解中心人口的愿望基本落空的同时，城市中心不断驱赶人口的努力，却在事实上不断地把刚进城的人口（包含农民的第一代大学生刚毕业的头几年）赶到更远的城乡结合部。郊区新城普遍吸引不了高层次人才，说明通过第二产业转移引导人口流动的思路已经严重滞后于大城市核心区域高端服务业的发展。随着第二产业产能在全国范围内的整体过剩，郊区新城以往提供的中低端二产就业岗位还有可能出现衰减，与之相关的生活类低端服务业岗位也将随之减少！


    目前的郊区新城普遍人气不足。像松江新城造了很多房子，但入住率比较低，多数低于 60%。空城最明显的还有临港新城，房子是造出来了，房价这两年都翻番了，但目前没什么人。说明早期的买房人——不论是外来投资者还是在中心城市工作的白领与中产阶层，多数是由于概念炒作而盲目入市。可以预见，随着郊区新城的人气不足以及第二产业的逐渐衰落，郊区新城与上海城市中心的落差还会加大，而不是缩小！接下来许多手里握着郊区新城房子的人们，将被迫像握着烫手山芋一样握着这些钢筋水泥丛林。


    这便是我们的悖论：总想用有限思维有限能力控制无限的市场空间，总想用计划经济的思维去“安排”就业和人口，结果总是事倍功半甚至适得其反！如果各级、各城市政府把疏散产业和人口的人力物力用一小半来把城中村、城乡结合部、城市近郊的卫生、治安和教育搞好，让进城农民能够把他们的孩子、老人接过来，这样的城市化是不是更符合规律、更人道、更有利于中国的进步和发展？赵晓说：“一个重要反‘新常态’的观点：中国增长下行是困收入差距引起的生产过剩，过去这块过剩被外需吸纳，次债危机后外需消失过剩产品没了出路就变成经济下行压力。而形成收入差距的最大因素是城乡差距，所以打开内需从城市化入手。城市化+收入分配公平=内需扩大，中国经济保持
    9%的增长至少还可十年以上。”


    但城市化的前提是市场化，包括土地农房的市场化和农民进城的市场化。而我们的城市化政策却一再反城市化！让人和资本都由流动起来，人人各尽所能各得其所，中国自然而然就繁荣昌盛了。我们现在最缺的，是人的自由、市场的自由。最亟须的，不是政府要做什么，而是不要干预市场，把手缩回来，尽量不要做什么。


    作于 2015 年 1 月 31 日


