    那么，类似曼哈顿这样的高密度地区是不是把人都变成了高楼阴影下的一只只长年不见天日的白蚁呢？答案是否定的！史伦《环美建筑日记》《摩天楼的温一 文告诉我们：


    > “纽约曼哈顿地区是全世界高坡度最大的地方，狭窄的街道却能看到阳光，这里是世界上行人密度最高的地方，但行人却不会感到拥堵。


    “长安街这样的超宽马路被许多人认为是只适合乘车检阅市容、但反人性的设计——行人不但很难走到马路对面，而且整条街上没有一处可供停留、驻足、休息的地方。但中国城市新建街道全都在向长安街看齐。中国的摩天楼也具备同样特色，它适合远观，作为城市名片。对路过的行人没有任何友好。


    “但是，曼哈顿街道却经常能有阳光照射——退台式高层建筑保证了阳光的照射路径，街道对行人也非常友好，摩天大楼纷纷将宝贵的底层架空，作为行人行走、休憩的公共空间，狭窄的街道事实上被拓宽了。”


    秘密何在？在1916年纽约出台的城市区划法案（1916 Zoning Resolution），明确规定了地块中建筑高度和体量的标准——地产开发者可以在一定的高度限制范围内，在用地上保持100%的建筑密度；超过这一高度，则应让出临街一侧的空间；高度如果更高，则继续让出面积。只有建筑体量出让到一定程度，即主楼的平面面积少于用地的25%时，才不必继续后退。


    此后40年，退台式建筑保障了纽约高楼之间的阳光与清风。后来的建筑师更加别出心裁；干脆一退到底，像利华大厦一样，只利用那最后 25%的用地面积，向高处发展，整出了修长、俊俏的城市华丽空间！而底层，全部让给了市民！1961年，作为对建筑师创造力的回应，纽约市颁布了相关法案：如果开发商采用此类为城市退让公共空间的设计方案，他们将因此而得到一定的奖励（奖励内容为允许加建
    20%的建筑面积）。


    同等容积率，土地退让面积越多，楼越高，居住越舒适，楼也越贵。北京东四环的金茂府，公开中标后在容积率不变的情况下提高了楼高度，就曾经引起开发商的抗议。因为这样楼间距变宽，地上空间增大，楼也卖得更贵。


    未来城市到底可以有多密、有多高？取决于城市规划管理和建筑水平。著名的迪拜，就是高楼的博物馆，迪拜塔已经高达 800 多米，不是缺地，而是密集更舒适便捷。


    未来的中国城市，在“欲与天公试比高”的道路上必将当仁不让。美国高层建筑与城市住宅委员会（CTBUH）日前发布了一年一度的《2014 高楼数据研究报告》。报告显示，过去一年，全球共有
    97 栋高 200 米或 200 米以上的摩天大楼竣工，其中 58 栋落在中国，占全球总数的 60%。高度 541.3 米高（1776 英尺，为美国独立宣言发表年份）的纽约世贸中心一号楼是去年建成的最高楼。即使是恐怖分子，也挡不住高楼拔节生长的脚步！重建后的世贸中心，比原来的
    415 米更高了！


