  md: '层层递进的关系，把国家安定的基础系于“不患寡而患不均”。


    我们不做是对是错的价值判断，只做事实判断，1949年以来，我们国家在“均衡发展”方面所花费的气力、时间、规模恐怕都是在人类历史上空前绝后的，但是很多不知经济和城市发规律的人们，包括一些知识分子，他们还是不满足，认为今天的人们背井离乡往大城市发展，是因为政府在均衡公共资源和发展机会上做得不够，从而导致大量留守儿童、留守老人等人道悲剧。


    事实上我们在这方面不是做得不够，而是做得太多，甚至把很多不该做的都做了，把很多不该用的手段都用了：二元户籍制度限制农民进城，知/青/下/乡，乡镇企业和小城镇建设，就地城镇化，新/农村建设、美丽/乡/村建设，西部大开发，东北振兴等等，控制大城市人口规模，等等。


    每年国家还有大量的转移支付，从东南沿海发达地区收税由中央支配，源源不断地转移支付到西部、中部和东北等相对落后地区。


    这其实是对高效率地区掐尖，用以支持低效率地区发展，重视了国内的“平衡”，却在相当程度上自废武功，自我降低效率，削弱国际竞争力。


    这种做法在国际上也没有成功的先例。美国哈佛大学经济学和历史学教授戴维·S·兰德斯在《国富国穷》一书中说，人类一直想改变这种状况，给予不发达地区各种项目支持，但是戴维在书中无情地告诉我们：“人类所犯的错误，即使出于善心，也会加重大自然的冷酷无情。有时甚至善无善报。毫不奇怪的是，这些地区依然贫穷，许多甚至比以前更穷了，许多广泛宣传的发展项目遭到了惨败。”


    4


    对于今天，城市化政策发生重大战略转折这一顺应规律之举，本人表示十分的欣慰和赞成，它将给中国经济带来新的活力，也将给中国参与国际合作与竞争带来新的动力。


    我们的城市化，实际完成率还不到 40%，比全球平均城市化率还低，比发达国家动辄 80%、90%的城市化率，更是差距巨大。


    这个落差，就是势能所在。


    5


    在大的城市化战略下，14 亿国人应该彻底抛弃以往均衡发展的乌托邦幻想了。在这个梦里，我们沉睡了太久，付出了太多、太过于沉重的代价。


    应该醒醒了。


    在全球性的高密度大城市化潮流之下，绝大多数人的故乡是注定要衰退，而且是迅速衰退的。


