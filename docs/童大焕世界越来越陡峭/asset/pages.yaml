    年至 2014 年， 中心城区的高峰拥堵时段由 38 分钟上升至 55 分钟。据测算，目前机动车尾气排 放占深圳 PM2.5 本地排放源的 41%，已成为主要大气污染源，是导致灰霾天气的
    重要原因。目前深圳停车位总计约 104 万个，相比 314 万的机动车总量，缺口 达三分之一。


