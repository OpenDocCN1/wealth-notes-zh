    # “土地自由降房价”为什么错


    继 2012 年获得“米尔顿·弗里德曼自由奖”之后，2014 年 4 月底，85 岁的茅于轶老先生被英国《前景》（Prospect）杂志评为十大“2014
    世界思想家”之一，位列第四，第一位是诺贝尔经济学奖得主阿玛蒂亚·森，第五位是教皇方济各。


    茅老先生说“我的经济学不是从哪儿学来的，是我自己发明的，和我一模一样啊！”茅老先生还说：“我认为中国应该继续保持 10-15 年的中速发展还是没有问题的。中国目前的人均
    GDP 仅为日本的 1/10，经济发展的空间还很大。而且，未来改革释放的红利还很大。比如，各种各样的资源能源和劳动力浪费，土地还不能自由买卖，金融业还没有实现充分竞争等。但是，要释放这些红利，就必须下大决心推动改革。如果土地能够自由买卖，农民能够把土地卖给开发商，他们得到的价格就高了，他们就有钱了。而且，开发商能买到便宜土地，房价就降低了。农民有钱，房价降低，农民就可以进城了。现在的情况是，有钱人买了房子不住，而需要住房的人又买不起。如果这种情况一直持续下去的话，楼市泡沫必将破裂。”


    茅老先生前一个关于中国经济还有 10-15 年的中速发展我很赞同，甚至认为时间还更长。当然，其中必然伴随着现有模式无法持续背景下的经济结构大调整，以及被迫的土地改革和国企改革。但茅老先生说土地自由能够降低房价的说法，我却不赞成。因为茅老先生对城市化的背景因素亦即城市化的规律还没有搞清楚：城市化的规律是大城市化，还是小城镇化？如果是小城镇化，土地自由买卖，全国遍地开花，少了政府一征一卖补贴工业的环节，开发商可以更便宜买到地（相对于政府独家卖地），农民也可以更贵卖出地（相对于政府独家征收），这种情'
  merge: -1
  img_proc: true
- pgno: 220
  md: '况下会出现茅老先生的农民有钱而房价降低情形。


    问题是城市化的规律不是小城镇化而是大城市化，大部分进城农民直接进入大中城市。据东南大学经济管理学院名院长长生介绍，过去 20 多年来城郊失地农民只占农民总人口的
    2%~3%。这说明两方面的问题：一是大部分进城农民的土地是没有开发商想要的；二是将来进城农民也只集中在极小面积的土地上生活。如果小城镇建设遍地开花，那么那些地方房价低也没人要，其实今天已经遍地空城鬼城。而那些人口集中的地方，即便房价很高人们还是要加速进来。


    同样的，土地自由化是否能让大多数农民土地都卖出更好的价格？答案是否定的，因为政府征地或者开发商买地过程中只有 2%~3% 的农民土地是他们想要的，更多的土地他们不要。但土地自由可以让一部分农民，包括偏远地区的农民把土地卖给一些有“衣锦还乡”情结的人，还有就是可以集中到一些农场主手中，实现农业的规模化产业化经营，增加附加值。土地自由化在增加农民财产性收入方面，也许更应该寄托于土地可以在合理定价基础上进行抵押贷款，作为农民进城创业的第一桶金。


    任何一种市场，最终最后决定性的结算因素都是供求关系。即使在计划经济时代，稀缺资源的权力“公平分配”背后，隐形价格也就是拉关系走后台的腐败价格其实是非常高的，没有“关系”或者“关系不够硬”的，付出的腐败价格将远高于市场经济竞争条件下的透明价格，最高的腐败价格甚至高到让你“有钱也买不到”。


    房地产和其它商品的最大区别是，房地产是不动产，不能够此处生产移到彼处使用。有限土地（比如一小时通勤圈）上的房屋产出量受容积率、高度、交通和电梯、建筑技术等方面的多重制约，因此出现“通勤时间决定空间和房屋价值”的现象，这是其它商品所不具备的属性。这种属性导致越是城市的房屋越受追捧，全国乃至全球资金都追逐大城市中心城区有限房屋。因此，传统的供应自由降低价格的规律自然失效。这不是经济规律失效，而是相对于无法限制的人对稀缺空间的追逐，稀缺空间总是有限！一切商品的价格最终决定因素是供给与需求关系。成本说明了什么。甘肃玉门市的房价只有造价的十分之一也没人买。空壳村也一样。香港、温州的店面却可以卖到
    80 万元一平米。


    研究中国的政治、经济、文化，含房地产等，一定要放在大城市化和互联网这两个最大的动态时代背景下才靠谱，一切静态思维和研究方法在这两个大背景下都会失效。但是对中国城市化未来的判断，包括相当部分专业城市化研究者都不靠谱。大前提不对，研究再精细再浩瀚都扫拍。


    为什么包括我十分敬重的茅于轼老先生在内的许多经济学家都看不透房价，就是因为背后更为宏大的城市化背景和规律他们没有看清。而只有看清楚城市化规律的大背景大方向，才能看清楚包含在其中的房地产这个小局部。此之谓谋全局然后可以谋一域。茅老在倡导与坚守中国的经济自由这个“价值判断”上功勋卓著，但“吾爱吾师，吾尤爱真理”，在城市化、房地产的未来会如何诸如此类“事实判断”上，我们在坚持人的自由流动这一最大的市场自由理念的同时，应该在掌握更大全局基础上保持清醒和理性，要知道大师和当局也会盲点。


    房地产投资具有天然的区域垄断性，就是人口只占小土地面积极小的区域集中。谁能看清人口流动的趋势，谁就占据天然的垄断优势。人聚财聚人散财散，人口越聚集，楼市与成本关系越疏；人口越疏，楼价与成本关系越紧。上帝都奈何不了。


    作于 2014 年 6 月 7 日'
