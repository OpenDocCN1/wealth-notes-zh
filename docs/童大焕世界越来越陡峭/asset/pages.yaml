    # 为什么政府规划多是失败的节奏？


    上帝欲使其灭亡，必先使其疯狂。尽管内地城镇大跃进过程中已经出现“千村薛荔人遮失，万户萧疏鬼唱歌”的鬼城空城现象，但由于“政绩是官员的，棺材是百姓的”这一难解的体制机制，造城运动在中国丝毫没有降温迹象，反而因“新城镇化”的提法带来新一轮疯狂。


    新华社 2014 年 4 月 21 日消息：12 个省会城市拟建 55 个新城新区，其中一个城市就要建 13 个，“空城”“睡城”“死城”等现象频现……记者从
    2014 年 4 月 19 日在上海召开的中国新城新区发展论坛获悉，国家发改委改革委城市和小镇改革发展中心日前调查显示，90%的地级市正在规划新城新区，某西部省会城市提出
    3 个新区、5 个新城，总面积是现有建成区的 7.8 倍。郑州建成区面积 132 平方公里，已规划郑东新区达 150 平方公里。“这种大尺度、大生特的空间，将导致服务业发展成本过高，可能形成‘死城’。”国家发改委改革委城市和小镇改革发展中心主任李铁说。


    另据 2014 年 4 月 22 日《第一财经日报》报道，地方官员称新型城镇化资金饥渴，勒紧裤带在搞建设。某中西部城市发改委相关人士在接受《第一财经日报》采访时称，近年的扩张式发展已经是“勒紧裤带”在搞建设，城市改造和重点项目都是按
    5 年规划、10 年规划搞的，有些已经规划到 2020 年。随着 2014 年地方债券债高峰来临，地方政府如何负担大规模的新型城镇化投资？“什么全不缺，就缺钱。”一位西部省份地方官员
