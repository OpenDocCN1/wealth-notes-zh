  md: '# 没有合理边界就是魔兽世界


    ——再论限制汽车，兼为洪旻辩护


    写了一篇反对把限制汽车与侵犯私有财产权划等号的文章《绝对化私有财产是对自由的亵渎——再谈汽车限行》，不无所料，大多数跟帖和评论是反对意见甚至破口大骂。首先声明，我也反对限购限行，但我反对把限购限行当成侵犯私有财产。我赞成拥堵费或变相拥堵费并且认为它是解决拥堵的惟一有效途径。反对限购限行仅仅是因为这种做法不能治本而且增加腐败、侵犯后来者的市场公平。淑女骂街的不必理会，反对意见值得整理，主要可以概括为以下几个方面：


    污染为什么就是汽车的错？那燃油呢？路面交通管理呢？城市规划呢？建筑设计呢？


    当今城市的拥堵不是车辆增多，而是市政和道路跟不上需求；


    作为城市化砖家，你该知道世界其他城市没有如此多公车；该知道北上广的污染是行政垄断导致资源过度集中的结果；更应该知道中国城市的规划和管理水平对交通拥堵要负多大责任；


    解决拥堵一定要靠“限”？“疏”呢？北京最大的问题是城市规划和路网设计不合理，环路等大动脉看似宽阔，可毛细血管少且不畅。各种大院导致断头路，环路出入口、路口左右拐线和红绿灯长短均未根据实际车流科学规划。在公共服务未做到极致、公车问题和各种交通管制未解决的情况下限私权是一种腐败和蛮横；


    美国为什么没有拥堵？为什么不对拥堵采取措施？


    看到上面有什么问题了吗？是，大家都承认拥堵以及汽车尾气污染，但是大家都不承认拥堵和尾气污染是开车人的责任。那是谁的责任呢？是公车的责任，是油企的责任，是交通管理、城市规划、建筑设计的责任，一句话：都是别人的责任，惟独没有开车人自己的责任！


    在上述那些人的逻辑里，必须别人把所有的责任都承担了，他才可以、才愿意作为承担责任的最后一分子来承担属于自己本应承担的那份责任。甚至，如果我不足以小人之心度这些“先富起来”的“君子之腹”的话，他们是从来都没有想过、也从来不愿意承担属于自己的那一份责任，而是把所有造成混乱和我们的生存环境恶化的原因都混在一起，达到混淆黑白、逃脱责任的目的。


    如果每个人都不愿意分清责任，然后“谁家的孩子谁抱走”、谁家的责任谁承担，那么让我们看一看，问题是不是有解？


    道路跟不上需求或者城市规划不合理导致交通拥堵。那么如果要重新规划，势必要拆除很多建筑，那么业主们也会问：凭什么要侵犯我的私有财产为你的汽车让路？


    至于“北上广的污染是行政垄断导致资源过度集中的结果”，此类认知恰恰是导致城市摊大饼式向外发展、进而加剧城市拥堵和污染的原因！


    美国的拥堵是比我们少，但也不是不拥堵，也不是不对拥堵采取措施。中国交通过检测网 2012 年 10 月 23 日消息：1995 年在美国加州的 S・R・91
    线上首次施行道路拥挤收费，事实证明效果很好。出行高峰时段，道路总容量 33% 的收费路段承担了 48% 的交通量，且车速达到 105 公里/小时，而免费车道车速只有
    16—30 公里/小时。调查显示，收费公路的使用者 30 至 50 岁女性居多，尽管拥挤费使他们直接利益受损，但她们感受到了更高的驾驶舒适度和安全感。'
