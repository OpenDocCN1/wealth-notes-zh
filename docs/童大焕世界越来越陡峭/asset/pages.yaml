    李培林先生的文章说了许多无比正确的话，比如说新型城镇化要守住三条底线：第一条底线是不能损害农民利益。第二条底线是要保持乡土田园风光和地方特色。第三条底线是要符合长远发展的乡村规划。但是怎么样才能守住这三条底线，作者没有说。就像我们一再说要平等，但不知道怎样才能平等。


