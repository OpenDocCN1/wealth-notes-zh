  md: '# 中国的天下永远是东南部的天下


    2014 年 7 月，我到沈阳进行图书签售的时候，对在场听众说：在东三省，如果你是自要买住房，请一定尽量在城市中心买，哪怕小一点。如果你买的是投资房，请一定要放眼全国乃至全世界。


    2014 年 12 月 14 日，《21 世纪经济报道》刊出文章《中国东三省人口危机：每年净流出 200 万人 面临后继无人》，文章说：


    在振兴东北战略支持下，2007-2010 年，东北经济增速一直高于东部地区。然而从去年开始，“十一五”期间增速靠前的东北，开始陷落。2013 年，辽、吉、黑三省在全国
    31 个省份的 GDP 增速排行中全都位于后 10 名，其中黑龙江位列倒数第三。继 2013 年经济明显减速后，2014 年东三省这种趋势有增无减。这股寒意直接来自于全国钢铁、煤炭以及重工业的不景气和产能过剩，是东三省长久以来形成的产业结构不够优化所致。黑龙江
    10 月底召开省政府常务会议指出，大庆油田明年将下调产量，这导致“量价齐跌”将继续对黑龙江省工业增速下降带来挑战。


    还有一个隐蔽但更为棘手的问题——人口危机。多年的人口净流出以及明显的老龄化，让东三省面临“后继无人”的尴尬。按照第六次全国人口普查数据，东三省每年净流出的人口约
    200 万人。东北三省中，黑龙江和吉林都是人口净流出，虽然辽宁每年还有大约 20 万的净流入，但是远比不上一个北京市。除了人口净流出外，东北的总和生育率超低。按照六普数据，黑龙江总和生育率
    1.03，吉林 1.03，辽宁 1.0，远低于全国 1.5%，比江苏、浙江等经济更发达地区都低，仅高于北京、上海等极少城市。甚至比基本同纬度的韩国和日本要低，2013
    年韩国女性的总和生育率为 1.19，日本为 1.34。


    东三省是当代中国工业化也是城市化的摇篮，从日据时代开始工业化以及由此带动的城市化就遥遥领先。整个东北作为装备制造业和能源原材料基地，是中国工业发展的晴雨表：现在全国性制造业产能过剩问题严重，以装备制造作为特色的东北影响就更大了。可以说，东北三省无可避免地“陷落”，意味着中国工业化时代和产业造城时代的彻底终结！接下来，仍在试图以工业投资带动城市发展的“开发区模式”，90%
    以上将会遭遇失败的命运。它同时意味着，城市按自身规律发展、城市化带动服务业、服务业推进城市化的时代正无可避免地到来，政府在其中的角色，除了建设更好的法治环境之外，传统的降低土地、环境、劳动力等成本的竞争手段，能够起到的作用将越来越式微。


    与工业造城相辅相成的一个基本规律是：越是依赖外在投资力量工业造城的城市和地区，越是市场自发力薄弱的城市和地区，人口生育率也越低——这个也好理解，尤其是早期计划生育往往以砸饭碗的形式强行推动，越是市场化程度低的地区和，“饭碗”越掌握在“单位”和“公家”手里，由此带来的人口衰减、地区衰退和老龄化程度也越深！最终结果是：越是依赖外部输血的地区和城市，人口生育率越低、流失率越高；越是东南部自由市场化程度高的地区，越是“不服从”简单粗暴的行政命令的地区，发展的潜力和后劲越大，对外吸引力也越大。


    2014 年 12 月 15 日网易新闻报道，因为人口流失、生育率低，不仅东北三省，全国近半数省份正在失去活力。依照全国第六次人口普查得到的数据，在全国 31
    个省级行政区中，人口净流入地区有 14 个，净流出地区相对较多有 17'
