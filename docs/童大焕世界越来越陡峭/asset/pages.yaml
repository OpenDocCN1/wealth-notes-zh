  md: '为什么人们一旦进入城市，乡村就再也难以回去？原因也许正在这里：城市的那种自由，那种妥帖，那种安定，那种丝丝入扣的细密与温暖，那种人与人之间的陌生与平等，是乡村永远无法抵达的彼岸！更为关键的是，城市的那种自由，
    那种妥帖，那种安定，那种丝丝入扣的细密与温暖，是上至达官显贵下至贩夫走卒人人可以感受人人可以享有的！这正应验了我一位网友风纯碎的话：“幸福是什么？幸福不是炫目的豪宅，幸福不是童子抬手上的鸽子里。幸福是一颗不屈服这个尘世的自由的心。”正因为城市的熨帖与自由，三教九流各色人等都愿意在温暖的城市寻找自己的一席之地，这一席之地，哪怕是城市的桥洞、地下井，哪怕是迷宫一般的地下室，哪怕是郊区扯起的几片塑料布！


    人生就是各种小小的愿望得到满足，小小的自由得到呵护，小小的心得到熨帖，正是为了这些，人们不断地从四面八方涌向城市！与这些小愿望小自由小心灵相比，城市高昂的房价似乎算不了什么，乡村阔绰的住宅也拦不住人们的脚步。也正因为三教九流都来到城市，那些富豪也挡不住城市的魅力，纷纷用脚投票用钱投票。FT
    中文网 2014 年 10 月 28 日消息说，在英国，价值两百万英镑以上的房子 90%都坐落与伦敦，其中大部分业主聚集在核心地带。换一个角度的信息则是：麦肯锡研究显示，全球有
    3.3 亿城市家庭要么体面住房或对居住成本“疲于应付”。纽约、东京和伦敦属于遭受影响最严重的城市。北京、圣保罗和布宜诺斯艾利斯属于较低收入城市中间面临最大压力的城市。换句话说，是全世界的人们宁肯往房屋质量降低也要涌向城市。而在大城市迅速膨胀的同时，大量城市郊区和农村房屋将永久空置：据日本政府估计，到
    2050 年 20%的日本居民区将成为鬼城。据野村证券(Nomura)的估计，到 2023 年日本五分之一的房屋将会空置。据 Sakakibara 计算，只要
    20 年，物业的价值就跌得只剩土地价值了。


    因为自由与温暖的感召，人们宁愿放弃乡村房屋重重的外壳，也要奔向城市哪怕缺少住房的内在温暖与自由！这样的追求，不分国籍和人种，人同此心。


