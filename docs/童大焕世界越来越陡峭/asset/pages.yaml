    71%。


    根据经济普查数据，上海市生产性服务业的就业岗位高度聚集在市中心。除了浦东张江，其聚集的范围连中环线都没突破。这就是魔都每天早高峰挤地铁的人们们的目的地——上海各类高端服务业就业岗位所在地：市中心。


    总体而言，在高端就业岗位仍然聚集在市中心的情况下，即使市中心人口密度降低，但被疏解的群体依然需要每天通勤至市中心工作。因此，疏解人口本身只会大幅度增加居民的出行距离，从而加剧城市的拥堵程度。


    政府努力地为中心城之外的地区（以新城为主）鼓励高端服务业的发展。通过补贴，减税，供地，等，试图对市中心服务业功能进行疏解。企业会去注册（便于领补贴），但是人不会去那里上班。根据经营数据分析的上海四个主要产业部门就业密度在空间上的分布特征，金融业高度聚集在市中心
    3km 处，其次是文创，8km，再次是科技，12km。向郊区新城疏散就业岗位，本质上就是逆市场规律而行。


    无论是市场规律还是国际城市经验都告诉我们：一个以服务业为主国际大都市将不可避免仍会保持其市中心就业岗位的高速增长和持续集中。即使是被学界认为新城战略非常成功的东京，在过去的十几年中，其岗位的空间集聚度仍然在不断加强，岗位总体上仍然呈现空间极化的趋势。假如我们依然严守人口疏解的政策，严格控制市中心的人口，使郊区（包括新城）人口不断增长扩大，我们不会得到传说中的“田园城市”，只会得到一个无论你修多少地铁到郊区早高峰时永远是一边挤不上另一边是空车厢的城市；一个通勤距离越来越长的城市；一个人和岗位越来越远的城市；一个综合交通不堪重负的城市；一个越来越拥堵的城市。


    正如本文开头一段提到的一篇文章《广州 CBD 逆势热租说明了什么》所揭示的，广州服务业和上海一样，呈现的是加速向市中心高密度区域集中而不是向郊区分散的趋势。


    制造业在距离市中心 15km 之外还能有一个新的高点。只有制造业能够在城市郊区保持其就业密度，也只有以制造业为主的产业新城能够实现人口疏解和岗位疏解的双重目标。


    但大焕先生要告诉大家，中国的制造业已经全面过剩且已经严重超前于城市化的发展！未来中国的突围之路，只有生产性服务业！'
