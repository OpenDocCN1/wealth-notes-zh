    # 千万别以为大开发商就一定靠谱


    我一再强调环北京宝地区除了燕郊都不值得买。燕郊还看得地段，不能过于偏远。别其它地方也都在涨价，等到进入二手房时代大家就看清它逐渐有价无房无人吧。实践也证明，哪怕是一线城市的远郊区域，房价涨幅也未未追得上一些小县城的核心区域。全国性的中心城市优于区域性中心城市，小区域中心则有可能优于大区域边缘。这个事实说明，不仅全国性的人口在往中心城市集中；区域内人口也在进一步向城市中心集中。


    有学员问我：老师，您说，香河那里为何某某，某某，某某（此处隐去真实房地产公司名称）这些大企业都大片大片拿地？


    我说，千万别以为大开发商就一定靠谱，9 成以上开发商不懂城市化规律，他们只管把房子卖出去就算。'
