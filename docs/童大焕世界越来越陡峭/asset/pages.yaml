    # 中国城市化的两大明显趋势


    左边是山居仙境，右边是都市繁华：抬头是明山秀水，低头是大道通衢。鼓励中小城市落户，控制特大城市落户，历来是“民心所向”和“政策所指”，于今尤甚，甚的是对权力的自负和对政策的迷信。这个源头，甚至可以追溯到《桃园记》，可以追溯到百年前晏阳初们的乡村建设运动，更可以追溯到新中国成立之初的大三线小三线建设，追溯到上世纪
    90 年代的乡镇企业和小城镇建设成为国策，追溯到西部大开发和东北振兴，追溯到包括曹妃甸、天津滨海新区等等在内的各种开发区建设。之所以会如此，“城市综合承载能力”和“区域均衡发展”两大幻觉是重要原因。


    但东风不与周郎便，现实总理想拧。城市化发展的大趋势，不管从整个世界还是整个中国的角度，还是从城市群内部看，都是不断地集中，集中，再集中！而不是分散，分散，再分散！城市综合承载能力是个伪问题，恰恰是人口越多效率越高就业机会也越多，因为服务业分工越来越细越来越专业，根本不需要计划性地创造就业机会。而那些通过大建工业开发区之类人为“制造”就业机会的地区，一遇产能过剩就上演全城衰退的戏码。


