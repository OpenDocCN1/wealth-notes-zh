    问：“但是短期内半年左右保定的房价应该会阶段性上涨吧？等涨到合适的位置出手不是更加合适？”


    答：“天才都掌握不了最高出最低进的节奏，不要什么好处都想占。过了两个月保定就回归平静。”


    背景分析：2014 年 3 月 19 日《财经》杂志传出保定成为北京政治副中心的消息，说要把中央部委一些科研机构和大学搬往那里。虽然当天国家发改委和保定官方都表示不知情，但
    3 月 23 日《北京青年报》报道《保定利好传言致楼市迅速升温 开发商称新盘肯定涨价》称，消息传出后，来保定看房的客户有不少来自北京、内蒙古等河北以外的省市，北青报记者到保定市区楼盘探访发现，确实购房热度高涨，虽未涨价，但“买房送装修”等优惠没有了。


    我只能说中国还是人傻、钱多。姑且不论这只是个没影的传闻，就是传闻落地，“政治副中心”也是个伪概念，要么就是行政办事处要么就不是行政办事处，哪有什 么政治副中心之说。没错，历史上保定的直隶总督府是清代直隶省的最高行政机关，自清雍正八年（1730）直隶总督驻此，直到清亡后废止，历经
    182 年。但那是全部行政供养的军政机关，长城居庸关以北深山老林里也有这样的军事机关，但它们跟老百姓的房地产市场一毛钱关系也没有。


    而传闻中要搬过去的部委科研机构和大学，能担当得起“政治副中心”重任？充其量是个半拉子大学城。它们自己都自身难保，会因为搬到那些地方而导致 3 优质人才和生源流失，想靠它们托起楼市，做梦！如果因保定地理位置上处在北京、天津、石家庄中心，而以为加上一个“政治副中心”的噱头，它就能成为京津冀都市圈的中心并带来房价大涨，那更是典型的中国梦里的白日梦！


    保定距北京 140 公里，天津 145 公里，石家庄 125 公里。它不可能成为京津冀中心，那就只能成为这三地的陪衬。那么算算在这里居住到北京、天津、石家庄上班的成本吧。以北京到保定为例，最快是高铁：40
    分钟，二等座位票价 63.5 元，一等座 101.5 元；动车：北京西站到保定东站，55 分钟-1 小时 13 分钟，二等座位票价 42.5 元，一等座 68.5
    元；快车：北京站到保定站，约 2 个小时，硬座票价 23.5 元。公路及高速，高速过路费 50 元左右，约 2 小时。这样的时间成本和经济成本，不含市内交通时间，不含私车汽油费，多少上班族可以承受？


    所以，不管是开发商还是个人投资者，趁现在人傻钱多，出货才是硬道理。开发商的策略是，不涨也不跌，只造声势。降价会改变预期，涨价也是自寻死路。个人投资者也一样，最多虚张声势，装装要涨的样子。真要涨，真的想着大涨，只怕到时黄花菜都凉了。而传闻留下的遗迹，不过是“竹影扫阶尘不动，月穿潭底水无痕。”待到水落石头出，一场欢喜一场空。


