    1958年北京农业用水5.73亿立方米，1980年农业用水30.5亿立方米，接近北京现在城市的总用水量，现在城市总用水量34.5亿立方米。工业用水原来是10亿立方米，现在是5亿立方米，工业用水节约了五分之四。农业用水从30.8亿立方米减少到12亿立方米。工业和农业用水都还有巨大节约空间。


    比起南水北调这些可能凶多吉少弊多利少 的巨大工程，拆除大坝、恢复河流曲线、重塑北方农业这些尊重自然的选择将更为明智和有效。除了拆除有形的大坝，北京更要拆除妄想控制城市人口观念的大坝！


