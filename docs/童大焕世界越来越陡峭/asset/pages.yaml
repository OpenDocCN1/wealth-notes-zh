    城市是向中心化还是郊区化发展，决定因素有很多，最顽强的是集聚效应，高密度集聚大幅度降低时间、经济等成本，大幅度提高规模效应。这是经济社会内在规律的最大决定因素。比起市中心的生活质量，郊区生活无论从车耗、房屋能耗还是时间消耗等成本上看，都要远高于市区。虽然房价可能低一些，但中心城区可以采取小户型小房型等办法加以抵消，而且大HOUSE真正是名副其实的“大耗能”，从购房总价、物业、取暖、照明、取暖、取暖与清洁等各方面，都会“大大地把人耗死”。其次的影响因素有治安、教育、人才、人口生育状况和家庭结构、交通因素等。治安因素因为直接涉及到人们的安全感问题，有可能“喧宾夺主”超越集聚效应反过来成为决定因素。美国历史上的城市中心化和南非经济首都约翰内斯堡的中心空城化，首要因素都跟当时的治安状况直接相关。


