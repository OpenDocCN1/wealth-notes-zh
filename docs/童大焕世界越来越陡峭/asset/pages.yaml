    1949 年以来，当代中国城市化一直处在国家政策、国民愿望和城市自身规律相悖、扭曲的道路上兜兜转转反复折腾。1980 年代才允许农民“自带口粮进城”；1998
    年住房商品化才真正开启了中国城市化和房地产元年。即使打开了城市化大门，还是处处提防步步为营，从小城镇、就地城镇化、大中小城市协调发展、严格控制 500 万人口以上特大城市人口规模（2013
    年）等重大的战略方向上，不情不愿地一步步退让，而不是积极主动去研究规律、顺应规律。


