    # 第三部分 “高密度大城市化”与“城市圈”、“城市群”的天壤之别


    互联网和现代交通加快了世界范围的中心化过程，与之相应的，是大量城市乡村在人口意义上的衰退，大量的城市乡村还归大自然，全球范围内都呈现出人口向少数中心城市收缩的态势。


    但这不是我的“高密度大城市化”所指的城市收缩概念。**我指的城市收缩，是大量人口迅速涌入少数大城市以后，大城市的边界是有限的，大城市本身也将是呈收缩态势而不是扩张态势的！**


    **“高密度大城市化”与“城市圈”、“城市群”有天壤之别！**


    中国的城镇化道路先是经历了几十年的反城市化政策（1949~1978），1998 年才正式回归城市化道路（标志是城市住房商品化），但一开始走的还是乡镇企业和小城镇发展政策的弯路歧路，直到近年才明确了以城市群、城市圈作为基本型态的新型城镇化政策。但是城市群（和周边已有城市形成互补互动）和城市圈（在大城市郊区建郊区新城）的道路，从理论到实践，都仍然是误入歧途！它们的本质仍然是城市均衡和城市扩张的思路。


    而高密度大城市化理论，坚持的是城市收缩观念，认为在经济效率、土地和时间节约等内在经济规律指引下，大城市边界不是在向外扩张，而是不断收缩的。世界越来越陡峭，城市收缩，向高高度和密度发展，电梯战胜汽车。


    错误的城市化战略一再延误中国的现代化进程。小城镇大跃进给中国带来的损失当以数十万亿元计，而且仍在不断叠加。


    有人迄今北上广一线城市住在老城小小区的比例在 80%上下，往城区漂房子房的不足 5%。我想，如果不出现城市化战略的反复失误和浪费，每一个中国人的生活水平可能在今天的
    3 倍以上。


    高密度、陡峭型、收缩型大城市化，是最具效率和创新能力、最节约土地和资源，人与自然最和谐的城市形态。人们在高度密集中，可以在几平方公里范围内解决一生的工作生活的所有问题，骑行或跑步甚至是步行几公里之外就可以'
