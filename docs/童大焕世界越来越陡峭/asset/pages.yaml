  md: '# 轨道交通是大城市的骨架


    交通拥堵和汽车尾气污染几乎是大城市共同的恶梦，能够重新把人类从恶梦中拯救出来的，惟有轨道交通。人类从这两个恶梦中走出的同时，生活空间的变化也正是在从小城市向大城市圈、大城市群迅速转变，21
    世纪的全球竞争将以大城市圈为单位进行。日本现在有很多中小城市都面临严峻的衰退问题——工业化时代，日本的人口和经济向四大城市圈集中，而现在却在向东京一极集中。伴随着人口和发展空间集中的是，是城市容量扩大、城市活力增强、城乡差距迅速拉近与缩小。


    而这一切，都有赖于四通八达、便捷廉价的轨道交通，是它们的钢筋铁骨，成为现代化大都市穿越时空的不朽脊梁。纵观各国都市圈形成和发展的历史不难看出，任何一个城市圈的形成和发展，无不先从交通尤其是快速轨道交通的拉近开始。我国已经开始重视完善城市圈交通体系，但维系与城市周边地区的交通设施仍然以公路为主。我们应该明白，大城市圈一定要有交通“大骨路”支撑，不管在中心城市内部，还是在城市圈内的城际之间，这个“大骨路”就是快速、环保、高运能、低成本的轨道交通。以汽车为主的交通骨路是根本不可能支撑起高密度、大规模的城市圈的。


    北京、上海也在大力发展轨道交通，但在人性化、城际之间的公交化程度等方面，与发达国家和地区仍有巨大差距。突出表现在：轨道交通密度不够，地铁出口少，换乘时间长，等等。日本东京市内轨道交通网的覆盖面非常广，每平方公里的地铁站数量为
    1.66 个。居民步行到最近车站的平均时间只有 10 分钟；出站口最多达几十个，往往是直达写字楼和居民楼，风雨无阻；零换乘更是不在话下，连地铁和郊区轻轨之间的转换，乘客都不用下车，只有乘务员和司机进行交换，有效避免了乘客的时间损失和换乘站的拥挤不堪。它使得从东京市中心出发，不用换乘，乘一趟车就可以到达周围
    50 公里内主要城市和居民区。它使城市居民都乐于坐地铁上班。调查显示，74%在东京中心 23 区工作的人，每天利用轨道交通上下班。尽管东京市的轿车拥有量比北京高许多，但是，只有
    9%的人用汽车作为上下班的交通工具。看看如今北京的城轨地铁，哪一次换乘不需走上几分钟，跟着拥挤的人群，不断地上上下下，像西直门 2 号线与 13 号线的换乘，更是令人费解地还要钻出地面再钻进另一个地面！


    据悉，东京的轨道交通不仅是方便的、快捷的、廉价的，而且运营公司还是能够实现盈利的，一举打破公交亏损的铁律。高密度的人群支撑着它的运营是关键，国家建设私人运营也是其秘诀。国家投资解决了前期巨额投资的问题，运营公司可以在
    20-25 年归还投资的本金和利息。为了鼓励市民利用公共交通，日本政府鼓励员工发交通补贴，且在税前支付。


    人们曾经认为，伴随着城市规模大到一定程度，城市效率将随着人口和城市空间的扩大而递减，甚至如热岛效应、汽车尾气、交通拥堵等将给城市带来越来越多的负面影响。但是轨道交通却成功地化解了这个问题，不仅缓解了中心城市的人口压力，而且进一步使人口实现区域集中从而提高了经济和社会效率。显然，面对城市群、城市圈发展的必然态势，除了轨道交通的延伸之外，户籍制度改革、金融、医疗、保险、电信等服务的“城市圈一体化”等软环境建设，也需要与轨道交通一道，同步辅轨。


    2008 年 9 月 15 日发表于《新京报》'
