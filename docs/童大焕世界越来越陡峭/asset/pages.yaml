  md: '性先期进入城市，以从事家政等服务业为主体，也不排除其中一些女性用自己的身体赚钱，然后逐渐拖家带口把老公孩子带到城市来。在人类艰苦跋涉的进城道路上，女性就业往往高于男性就业。史学家亨利发现，家庭服务是19世纪的乡村移民进入都市最常见的管道：“大体上而言，迁入都市的农民在服务业与商业当中找到了底层就业的机会……实际上去两百年来看（这实际是人类城市历史的全程——大焕注），对于欧洲的乡村移民而言，最重要的都市就业类别很可能是家庭服务。只是因为一般观察都过度聚焦于男性的制造业，以致掩盖了这项事实。”（【加拿大】道格·桑德斯《落脚城市》）在人类早期，男性主要从事狩猎，女性从事采集。因为狩猎产品没有保证，采集成为食品的基本来源，所以形成母系社会。想不到在城市化过程中，我们也正经历着这样的一个由女性就业主导的“新母系社会”时代。


    当代中国的城市化进程，由于要补前50年不让农民进城、很少盖房的课，因此房地产需求在1998年城市住房私有化以后呈现爆炸式增长，这种情况下人们更多地关注进城男性在建筑业和制造业方面的就业，更少关注女性的家庭服务业就业。甚至把农民工集体宿舍和工棚这样一种“50岁以前没有性生活，50岁以后没有社会保障”的非人道行为，视为“中国城市化没有贫民窟”的“优越性”。事实上女性为主的服务业（包括家政服务、餐饮业等）才是进城农民留在城市的最终决定力量，她们及其家庭的住房、教育需求难以回避。在住房方面，要么是类似小产权房的贫民窟，要么是蜂鸟式的迷你公寓，是城市鸵鸟政策永远躲不开的问题。视而不见不等于不存在。


    在人类社会中，男性负责做梦，女性负责安定。男人常常异想天开地盼望自己回到蛮荒世界，比如幻想在一个无人的海岛盖一栋别墅，黄沙白云碧海青天，养几只鸡，种几株果。当真有一天，男人发达了，海岛也租了或买了，别墅也建成了，男人很兴奋地带着老婆孩子去采摘。但是孩子的兴奋一般不会超过半天，采摘完了果子捉完了鸡，剩下的就是百无聊赖到处找WIFI。女人也绝对不能容忍在这里住上第二个晚上，受不了的潮湿忍不了的苍蝇蚊子还有恐怖的“涛声依旧”。此外不可忍受的还有，这里没有3G或WIFI信号，甚至手机信号也不通，简直是与世隔绝。所以女人第二天天才麻麻辣亮就开始鼓捣算计着要赶紧回城。


    男人爱做梦，女人把他拽回现实。抛开极少数超级成功在家中占据绝对支配地位同时又兼具大男子主义的男人家中说一二之外，世界绝大多数时候是由女性支配和主导的。


    女性的独立对生育率具有革命性的影响。女性越独立，生育率越低。一来她不要通过生育确立自己在家庭乃至家族中的地位；二来她也不靠生育来养儿防老；三来她追求自己的幸福，不再愿意把自己的一生都奉献给人类传宗接代的事业。城市化和女性独立都会大大降低生育率。因此我们事实上已经到了需要像世界上大部分发达国家一样补贴生育甚至需要由国家提供把孩子养到18岁的经济支持的时候了！


