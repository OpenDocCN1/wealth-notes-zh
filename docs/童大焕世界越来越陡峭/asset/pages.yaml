    # 自序 2：不惧乡村无人 不忧城市无业


    乡村人在眼巴巴地盼着都市，都市人在假惺惺地回望乡村。乡下人拼了命地往城市挤，城市里那些打着饱嗝的，则心不在焉地发着“故乡沦陷”、“乡村复兴”的世纪感叹。世界和人生，像一座困城围着我们的心灵和智慧。“溪水正急于奔向大海，浪潮却渴望重回陆地”，这是一个世界性的规律，人性使然，乡村人向往城市的富裕与自由，城市人向往乡村的缓慢与清新，都是“缺什么什么就显得最重要”的体现。


    但是中国的情况似乎颇为特殊。最近我和重庆邮电大学移通学院大焕城市化战略研究院的团队成员们准备梳理一下百年中国城市化简史，以我 18 年观察和思考中国城市化历史的经验来看，几乎不出所料，与其说这是这是一段百年城市化的历史，莫如更准确地说这是一段百年乡村化（去城市化）的历史！一代又一代的人们念念在兹的是如何建设乡村，如何就地把农民带上富裕、文明之路。


    当然，从全世界范围看，直到 2011 年，城市人口才占到全球总人口的一半以上。当年，我国也宣布城镇人口所占比例首次超过半数达到 51.27%。也就是说，人类从
    2011 年起才真正进入城市社会时代，而中国当年 51.27% 的城镇化率名不副实，因为有高达 2.6 亿农民工并没有真正进入城市却被计入了城镇人口，当年真正的城市化率不会超过
    35%。因此，我们可以说，在 2011 年之前的世界，基本上都是乡土社会，因此我们看到的历史，基本上都是“乡村建设史”也就不足为奇。


    但中国的情形的确颇为不同。不同之处在于，当世界的时钟进入 21 世纪，世界主流思潮都承认解决农村问题的钥匙在城市，也就是应该尽一切力量减少农民，才能达到农村和农业更高水平的发展，达到农村居民与城市居民更均衡的收入水平。我们的主流意识形态和具体政策做法，却依然对大城市化心存恐惧，依然害怕农民进城，依然在通过户籍、土地和农房产权限制、城市居民下乡购房置地限制等办法人为阻碍着农民人身和财产的自由流动。网友李云鹏先生
    2015 年 1 月 19 日发了一条微信，本人深表赞同：“关注了几个农业部微博，满篇都是为粮食和农民离开土地宽担担忧，大爱不濡啊！！！~~~我想说的是谁担忧谁先去农村实干，要求呼吁别人去的，说委婉些是忽悠难听点是法西斯！”，


    中国顽固的去城市化思潮跟历史史实有关，也跟思维定式有关。叶落归根的精神造梦，告老还乡的制度历史，衣锦还乡的摆阔习习，桃花园梦的文人虚构，一切都在告诉我们：还乡，还乡，只有故乡最美好！'
