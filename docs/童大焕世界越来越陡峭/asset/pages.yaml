  md: '硕回报。我毫不讳言对李光耀评价很高，发表长文《李光耀是一种伟大政治实践的集大成者》，并且认为当代中国所有领导人的知识结构，取其优点去其糟粕加起来恐怕不到李光耀一个人的十分之一。所以他们老被伪专家伪学者所忽悠。喜欢吹牛的人，喜欢画饼充饥的人，大国崛起、亚洲共荣之类的。踏踏实实，理性的观点，告诫前方有风险的观念，通常难入法眼。他们要的是牛逼的感觉。结果往往是眼高手低一地鸡毛甚至逆潮流而行。


    最后我们来回到本文的标题——资源是决定国家兴衰的要素吗？答案是肯定的！


    农业时代，资源对人口的增长起到了关键性作用。比如陈志武跨国研究团队的量化历史研究表明，玉米、红薯、土豆三种作物的引进使粮食增加进而增加了中国的人口。按照 Nathan
    Nunn 和 Nancy Qian 两教授的估算，仅土豆一项就使欧洲人口在 1700-1900 年两百年间增长 25%，使欧洲城市化率增加 27% 到 35%，并帮助催化工业革命的发生。香港科技大学宫启圣教授等人经过各种严格计量方法的验证，得出的结论为：是玉米带动了中国的
    人口增长，而不是人口增长压力迫使 中国引进玉米、红薯。而且从 1776 年到 1910 年间，中国 14.12% 的人口增长 是由玉米所致。而从 16 世纪初到
    20 世纪初，中国粮食增量的 55% 是由于这玉米、红薯、土豆这三种新作物。


    可见 农业时代，资源尤其是农作物的食物资源对人口增长有决定性的作用。但对 GDP 贡献却不大。同样是量化历史研究，证明工业革命前 1800 年里，人均 GDP
    增长仅 50%；工业革命后 180 年里，人均 GDP 增长则达到 8 倍。


    近代以来的经济发展史表明，工业革命初期，自然资源的确对于一国国民财富的初始积累起到了非常关键的作用，如美国、澳大利亚、加拿大和斯堪的纳维亚地区的快速工业化与其丰裕的自然资源密不可分。


    但 20 世纪 80 年代以来，越来越多资源富裕的国家陷入了增长陷阱的事实引起了经济学家的深思。经验数据显示，从一个较长的时间范围来看，资源丰裕国家经济增长的速度是缓慢的，甚至是停滞的。1965—1998
    年全世界低中收入国家人均 GNP 以年均 2.2% 的速度递增，而 OPEC(石油输出国组织) 国家同期却下降了 1.3%。在全球 65 个资源相对丰裕的国家中，只有四个国家（印度尼西亚、马来西亚、泰国、博茨瓦纳）人均
    GNP 年增速达到 4%(1970—1998)，而一些东亚资源稀缺的经济体(中国香港、新加坡、韩国、中国台湾)，经济增长却超过了发达国家的平均水平(世界银行，2000)。请记住新加坡
    1965 年建国。


    1993 年，Auty 在研究产矿国经济发展问题第一次提出了“资源的诅咒”(Resource Curse)这个概念，即丰裕的资源对一些国家的经济增长并不是充分的有利条件，反而是一种限制。在此之后，Sachs
    和 Warner(1995, 1997, 2001) 连续发表了三篇文章，对“资源诅咒”这一假说进行开创性的实证检验。他们选取 95 个发展中国家作为样本，测算自
    1970—1989 年这些国家 GDP 的年增长率，结果发现仅有两个资源丰裕型国家年增长速度超过 2%。回归检验表明，自然资源禀赋与经济增长之间有着显著的负相关性，资源型产品(农产品、矿产品和燃料)
    出口占 GNP 中的比重每提高 16%，经济增长速度将下降 1%。即使将更多的解释变量纳入回归方程，比如制度安排、区域效果、价格波动性等，负相关性依然存在。


    中国的经验也一样。徐康宁的研究表明，1978—2003 年间我国资源富裕的地区经济增长速度普遍要慢于资源贫瘠地区。


    国内国外的实证研究都可以充分说明，即使在工业化大量依赖自然资源的时'
