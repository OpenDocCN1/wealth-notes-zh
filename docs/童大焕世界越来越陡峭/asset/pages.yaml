    事实上，像北京、上海、广州、深圳这样追捧名校比较热的地区，往往也是优秀生出国热的地区，名校高中高考前空班、空校的事实年年都在发生。在这样的变局中，小学名校一定是进入初中名校的通行证、初中名校一定是进入高中名校的通行证吗？况且小学初中都属义务教育阶段，都有可能政府安排下各自划片招生。所以，小学名校不一定能保进入初中名校，初中名校不一定能保进入高中名校。


    第二个风险是，越是追捧名校的地区，学位房越是被炒得价格高的地区，往往也是户籍政策最封闭的地区，像北上广深，都对外实施严厉的户籍封锁。这种情况下，学位房的炒作基本上是在现有户籍人口中“体内循环”，而这些户籍人口的生育率越来越低，将意味着未来生源越来越少。而人们炒作学位房，其实是炒作配额，相当于花了一笔大钱，买了孩子的一个入学配额，并且几年后还可以把这个配额再卖给别人甚至以更高价卖给别人。但随着生源减少，配额稀缺性降低，学位房“配额价格”远高于房地产实际价格的一路高涨势头还能持续多久呢？这一切


    都需要炒作学位房的人们理性、冷静地进行思考，对于一个充满不确定性的东西，是否值得那么执着地去追捧。不考虑学位房投资回报，只是为了给孩子上个好学校而不惜代价的，不在此列。


