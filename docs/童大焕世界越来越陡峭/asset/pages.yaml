    以往，政府每一个规划出台或者仅仅只是“放风”就带来房价的大涨。但是 2014 年，情况开始发生改变，市场力量开始翻转行政力量成为主导性力量，供应过量的三四线城市鬼城空城风险陡增，一线城市则照样稳涨不跌。市场的总结算功能一点也不买政府和领导的面子，一点也不相信政府会有一双双“点土成金”的手。


    今天一早有人问我：北京政治副中心初定保定，保定房价会不会涨过燕郊？

    我答：“不一定。第一，多少年才能成？第二，保定那么远；第三，万一将来不再是大政府呢。市场化要求，会不会像澳大利亚一样，把首都设在悉尼墨尔本之间乌不拉屎的堪培拉，怎么发展都是
    30 万人口。而悉尼是 700 万，墨尔本是 300 多万。

