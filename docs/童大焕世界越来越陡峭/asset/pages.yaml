  md: '越是老年，越要与丰富多彩热闹多姿的生活为伍，与年轻人为伍，与少年儿童为伍，这样他们才更有活力与激情；即使偶然遇到“险情”，在人群之中也比在山*之*间更容易被及时发现救助，人海中比*自然*中更安全。让一堆老人扎堆凑在一起的养老方式，多数时候是迫不得已，并不是最科学最人性最人道的办法。天天都只有一堆老人在一起，不断看着熟悉的人逐渐离世，会加剧老人的暮年心态，未必是一种好选择。


    所以我判断现在大量建设的养老地产（其实还应该包括大城市郊区休闲度假类项目，甚至不排除一些豪宅）会成为真正的“断代产品”，就是只有现在买的那批中青年年老时去住，成为“自买自型产品”，只住了一代人的一小段时间，以后就会乏人问津逐渐衰败，像日本今天正在发生的状况一样，等这批老人相继离世以后，这些养老和郊区地产就再也卖不出去也无人居住了，最终唯一的命运就是等待被拆除。


    1949年以來直到1998年，长达半个世纪的时间里中国人几乎不盖房子，不知道房地产怎么回事，所以1998年以后房地产市场一启动，什么新鲜概念都能卖钱，什么郊区豪宅、养老地产、海景房、人景房、旅游度假村等等，加上过去十几年通货膨胀给房地产带来的财富效应，让
    people 以为只要买房就能挣钱而且是稳赚不赔挣大钱。但是很快，买单的时候就要到了！


