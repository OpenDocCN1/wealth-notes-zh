    有那大本事，那真是妖。【完】


    # 大焕视界：京津冀一体化前景一目了然


    董大焕—2015 年 3 月 18 日 星期三


    关于区域城市一体化如京津冀一体化，一段时期以来我至少写了十五六篇文章以上，比如：假如保定成为北京政治副中心，首都的“围城效应”，京津冀一体化下的两座超级烂尾城，京津冀一体化绝非扁平化，自我中心式思维毁坏城市构建，分散人口与资源严重加剧污染和城市病，迁都和迁企都是馊主意——人再也不是企业的附庸，人为控制人口和产业当城市中心式大城市化，京津冀一体化将加速集约式大城市化，从东北衰落看京津冀一体化，世界越来越陡峭，广州
    CBD 逆势热销说明了什么，城市化与区域发展三条大线，向北京推荐几个城市化理论专家，失败的产业和人口郊区化，穹顶之下为大城市化去污名……等等，书名号就都省略了吧。总结论就是四个字：痴人说梦。


