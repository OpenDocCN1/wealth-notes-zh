  md: '考虑到中国城市化人口大迁徙的原因，部分区域依然供不应求。北上深广四座一线城市和部分强二线城市没有问题。两会之后，低迷了近一年的大中城市房地产市场迎来小阳春，具体从近期的成交数据就可以看出。中国指数研究院
    3月 16 日发布的数据显示，上周（2015 年 3 月 8 日至 3 月 14 日），24 个主要一二线城市住宅成交面积较前一周（3 月 1 日至 3 月
    7 日）上升 27.6%。其中，一线城市总体成交量环比涨幅达 25.6%，其中上海涨幅最大，达 48%，深圳涨幅也超过 20%，二线城市城市成交总量较前一周上涨
    28.2%，超七成城市呈现环比上涨。


    三四线以下城市因为存在打工和创业的大中城市买不起房的“告老还乡”回流人口，也仍将源源不断但会大量分散到全国两千多个县尤其是东部地区；县一级的旧城改造和居民改善性需求也仍在。但相当多地方供应过剩的情况又事实存在，很多过去胡子眉毛一把抓盲目入市的人们，手里也握着空城、鬼城房子和一些郊区别墅、新开发海景山景房如烫手山芋。这些活生生的例子会让一些人望房止步。


    中国每年有 1270 万左右人口净流入北上深广四大区域，20 年后，全国将会有一半左右人口生活在三大都市圈。因此从现在开始就要未雨绸缪，正确管理“狡兔三窟”下人们对未来房地产的预期和不同城市的供应管理。


    在各种综合、复杂因素的共同作用下，此番救市政府一定要打开天窗说亮话，才能给社会一个明确的预期，谁叫中国老百姓大多数都那么笨呢！他们不会自己独立思考去考判断，只会盲目猜测，猜政府的向风。比如对于房地产税的问题，笔者
    2014 年 8 月 19 日在《新华每日电讯》撰文，认为界定和保护产权是政府找准了自己本职，从反腐和房产税角度来解读不动产统一登记制度显得狭隘和一厢情愿。董藩甚至以教授职位打赌它五年内不会出台。但人微言轻，人们还是心惊胆怕甚至不断传播今年
    3 月 1 日以后要把多套房的人“收死”的谣言。在现在普遍的“狡兔三窟”之下，这样的谣言让多少人不敢买房！


    所以，新京报 3 月 21 日报道总理要求部长们主动回应社会关切，明显是有的放矢。在 3 月 18 日的国务院常务会议上，李克强总理对参会的国务院各部门负责人说：“现代社会已经变为一个透明度很高的社会。对于媒体关切、特别是一些重大关切，在座的各位部长们也要主动回应!”


    总理的指向性其实非常明确，他说，现代社会瞬息万变，国务院推出的各项政策、文件，有时也难免会被“误读”。“比如我们之前出台的不动产登记条例，本来是想把相关业务理顺，归口到一个部门管理，更加方便群众办事。结果呢？社会上出现了一些误读。”他说，“还好有关部门出来作了解释。所以各部门的政策，该解释的就要解释，而且回应要主动、要及时!”这就明确告诉大家，不动产登记不是冲着收税来的！


    其实，界定和保护产权，是政府最本职的工作！全世界的房地产证都是政府发的，没有开发商的，也没有业主个人做的。就是为了避免纠纷。没有界定何来保护？


    但仅仅在这个口子上开天窗，还不足以树立老百姓对楼市的信心，此番救市，一定要在“为什么要救？能不能救？怎么救？”这三大问题上解释清楚，给社会一颗定心丸。


    为什么要救？因为房地产关系到五六成的银行贷款和上下游五六十个行业，以及大多数有房一族的资产性收入，还有企业估值，如果不救，则金融和社会有危机，就业有危机，没有人会真正从中受益；


    更多课程：'
