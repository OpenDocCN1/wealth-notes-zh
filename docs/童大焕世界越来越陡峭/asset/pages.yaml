  md: '自从本人把思维方式作为一个专题研究的方向以后，越来越觉得思维的精密程度必须丝毫不亚于精工瑞士手表，非常的精细，令人着迷。人类对自然科学和社会科学的研究，也必须像最伟大的工匠一样，精益求精。


    这两天一位网友发了一篇《京津冀规划将直接影响房价》报道给我，报道说，多家研究机构认为，2015年2月26日是习近平总书记京津冀战略一周年，从现在在开始的一个月左右时间，将是京津冀相关政策出台的重要时间窗口。名为《京津冀协同发展总规划》的京津冀发展顶层设计方案已经通过审批下发至地方，可能本月底正式发布。这一区域一体化进程直接影响到天津以及河北省一些城市的未来定位，尤其会影响到这些城市的房价，国泰君安认为，从受益区域和产业来看，城市受益次序是：廊坊、保定、唐山、沧州、天津、石家庄。产业受益依次是：房地产、交运、基建、建材、环保、医疗、教育等公共服务行业。


    **我简单回了这哥们六个字：“我等着他失败。”**对方曰：“屁股决定脑袋，角度不一样。我等着与北京的房价慢慢的拉近，不像现在差好几倍，在轨道的作用下。”我说，“思维决定选择，不是屁股决定脑袋。”


    这哥們所言“屁股决定脑袋”，指的是他的房子在郊区，他希望望郊区房价上涨甚至逐步拉近与城市中心房价的距离；而我的房子都在市区，对未来的期望与判断与他相反。


    但如果我们不是用静态的思维，而是用历史的目光来看问题，就会发现真实的情况并非“屁股决定脑袋”，而是“思维决定选择”：这位哥們相信京津冀一体化战略会逐渐拉近北京中心城区与周边远郊区区域房价，所以把北京二环内的房子换到了北京郊区的河北某“价格洼地”；而我正相反，把河北郊区的大房子换成了北京东二环小得多了贵得多的小房子。因为我认为城市越来越集中才是真实的社会发展潮流，在这个潮流之下，目前房价高得多的中心城区反而是真正的“价格洼地”。这个房屋置换过程中，是我们对未来的判断决定了各自不同的选择方向，而不是因为我们房屋所在位置不同而选择了不同的观点。对于我们双方来说，在未来相当长时期内，如果观点发生变化，各自都有反向操作的机会，因此并不存在屁股决定脑袋的问题，是脑袋决定屁股坐到哪里。


    总体上看，随着货币的不断贬值，不论北京中心地带还是“京津冀一体化”涉及的郊区，房价都会逐渐上涨，但是各地的涨幅是不一样的，中心城区涨幅高于郊区是基本趋势。如果郊区在“一体化”概念下房价短期内透支性上涨、同时伴随着对“一体化”过于乐观下的过度供应，在短暂的概念炒作之后，必将面临长期有价无市甚至房价下跌的痛苦。就像“自购房”和“保定房价涮中心”的概念炒作一样，而国泰君安列出的依次受益城市（廊坊、保定、唐山、沧州、天津、石家庄），几乎毫无例外地在大城市一小时生活圈的范畴之外，也就是在人的时间忍受极限之外，属于“八杆子打不着”的区域，只有短期概念炒作价值，愿意飞蛾扑火的，悉听尊便。


    文章最后，举一个例子，最近很火的一篇文章《倒下的凡客给中国制造业带来的启示》写到一个迁址的故事，非常有意思：


