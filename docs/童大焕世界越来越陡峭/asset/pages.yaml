    # 理性投资是修正社会错失的根本力量


    2014 年 5 月 4 日，知名作家十年炊柴发了一条微博，说 2006 年将余钱果断还了贷款，而没有听我的话拿去做首付在北京五环附近再按揭一套房，不然现在资产起码增加
    300 万。经济学研究者胡释之居然说：“这是通胀最可怕的后果，有美德的人被看作傻瓜。”“寄生虫掠夺生产者。”除了“通胀的后果”说对一半（因为城市化因素更关键，否则无法解释同样的通胀背景下，为什么有的地方买房会亏本），其它两个道德判断令人不寒而栗。


    在一个民粹盛行的时代，如果是一个缺乏思考能力的愤青愤中愤老说出这样的话，我一点也不会觉得奇怪。不解的是一个长期为自由市场经济鼓与呼的经济研究者，却做出了如此令人匪夷所思的判断，让我刮目相看的同时也让我百思不得其解！


    而就在此前不久的 2014 年 4 月 19 日，胡释之还发了一条微博：“物欲横流的社会才是健康、伟大的社会。”我当时还专门另起了一条微博，在引用他这句话的基础上加上评论：“巧得很，我今天晚上想到的一句话是：赚钱就是世界上最伟大的事业。会写成一篇文章的。我们过去把劳动太夸大了，无数的劳动都是无效劳动甚至负效劳动，只有能赚钱的劳动才是真正有价值的，有利于节约资源和增进人类福利的劳动。”我当时就存下了微博并写好了文章标题“赚钱就是世界上最伟大的事业”。现在，两篇文章可以合成一篇来写了。


    其实，“赚钱就是世界上最伟大的事业”这个判断不能归功于我，而要归功于弗里德曼自由奖获得者、2014 年度世界十大思想家之一茅于轼先生。几个月以前，在首届“大午·天则论坛”上，他说“赚钱就是创造财富”，让我沉思到现在。茅于轼先生这句话，让我深刻认识到，只有能够赚钱的劳动才是在真正创造财富，一切不能够赚钱的劳动都有可能是无益于社会的无效劳动甚至是负效劳动！道理其实非常简单：没有垄断、没有强制、没有欺骗前提下的自由交易是人类福利增进的源泉。在这种自由交易下如果能够挣到钱，说明你的劳动和你劳动基础上提供的服务和产品是他人需要的，是符合人类进步和发展要求的。只有他人觉得需要才愿意花钱买单。如果他不必要，肯定不会花钱买单，或者只有在被强迫、被欺骗的情况下非自愿买单。


    投资理财本身也是有利于社会的。哪怕是最微小的个人投资者，投资过程本身也是劳动过程，而且是比简单生产更为复杂的劳动。他们的劳动，完全可以和企业家相媲美，都是通过复杂的脑力劳动智力思考、以及冒着巨大风险的成本付出，使社会的资源得到最有效的配置和利用。有效的投资理财和有效的企业家行为一样，一定是赚钱的。简单劳动哪怕是无效的，因为是受命于企业家，因此有时简单的无效劳动也能赚到钱。但是无效的、无益于社会和他人
    的投资理财和企业家行为，除了欺骗和强制之外，大部分是赚不到钱的。正是在这个意义上，先知先觉的投资者无疑是在用自己的智慧和力量修正市场、社会和政府的错误决策和非理性盲目目投资行为！他们通过人人看得见的“赚钱”甚至赚到大钱，引领着时代正确的方向。把赚不到钱的人视为美德的捍卫者和守护者，把投资赚到钱视为“寄生虫掠夺生产者”，那么，那些投资在鬼城修得将裤衩都不剩的又怎么评价？是不是反过来，生产者成了掠夺投资者的寄生虫？


