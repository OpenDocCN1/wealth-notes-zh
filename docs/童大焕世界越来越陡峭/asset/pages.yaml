  md: '从古至今中外，我们可以清晰地看见，越有魅力的城市总是房价越高，那些说高房价会赶走精英的说法完全不着调。你看看房价 100 万一平米的甘肃玉门口，宣称“高房价会把层次比较低的人淘汰，然后把最有能力最有竞争力的人吸引到这个城市来”的简单思维，纯属不过脑子的想当然！因为在城市生物链中，并不是所有进城的人都把住房当成自己的第一追求，而是生物链中的各种人群“各就其位，各取所需”。很多人根本无法想像，为什么北京郊区有农民放着有天有地的别墅式农房不住，甚至地方政府提供养老院的工作给她也不干，偏偏要到城市中心捡垃圾为生、住着连腰都伸不直的地下热力井！


    在全球经济一体化的时代背景下，房价越高的城市和地区，意味着居于全国乃至全球顶尖位置的各种社会精英越多，他们承受得起相应的房价，才会有相应的房价——任何时候我们都要记住，价格一定是由市场需求支撑着的！没有市场需求，价格分分钟就会崩塌！而一座城市、一个社会精英越多、房价越高，从高到低的整个“社会生物链”就越长，“物种”和社会生态系统就越丰富越复杂，社会的活力也越强，什么阶层的人都能很好地生活。


    同样的，为提高水电价地铁公交价等生活成本可以“驱逐”中低端人口，进而达到“控制城市人口”的目的，同样是一种想当然。世界上许多贫困国家的用水、用电、开路电视甚至单位面积房租等都远远高于中产阶级城市（但是平均总使用面积和用量小），但丝毫不妨碍穷人从四面八方涌来。一座城市的吸引力取决于就业机会和就业工资，也取决于就业分层即社会生物链的长短。房价越高的城市和地区，高收入以下的就业分层空间就越大，能够吸引和容纳的就业空间也越大、就业层次也越多。


    那么，对于大学毕业生这个未来精英群体，高房价对他们又意味着什么呢？会不会把他们赶向农村和中小城市？答案也是一个非常显然的否定！


    中国社科院《社会蓝皮书：2015 年中国社会形势分析与预测》调查显示，毕业一年后，约 3 成 90 后大学毕业生居住面积不足 20 平米，但他们更希望提高自己的生活质量，而不愿做穷放。换句话说，他们宁愿蜗居城市也不愿意回农村。报告显示，对
    90 后毕业生而言，拥有自己住房仍是刚需，但只有 1/3 强的非常同意或比较同意“为了买房，我愿意降低生活质量”；超 55% 的 90 后毕业生非常同意或比较同意“如果要背上沉重的房贷，我宁愿不买房”；超
    50% 的 90 后毕业生意识到买房是是当前资产保值的最佳手段，不过如果给他们一笔相当于住房首付的钱，有超一半的人会选择创业，或做更有成就感的事情，而不是买房。这份调查报告共访问全国
    12 所高校的 4110 名大学生，其中在校 90 后大学生 2730 人，已毕业或进入职场的 90 后大学生 1380 人。


    90 后大学毕业生放弃毕业即买房的梦想，这就对了一！一方面，城市尤其是大城市房价本就不该他们一半人钱就买得起，全世界都如此。另一方面，90 后这一代，他们中很多家庭经济条件不错，不像父辈当年一样，毕业马上要找工作养家糊口。所以
    90 后可以任性一下，不想上班，可以创业。创业当然绝大部分只能是在城市创业，而不是回农村创业。


    房价太高加上创业需求，年轻人并不是因此不买房，更不是因此而离开城市， 而是真正和国际接轨，把买房年龄自动推后。据链家地产市场研究中心与光大银行 2010 年合作完成的一份报告显示，北京首套住房者的平均年龄只有
    27 岁，而在英国为 37 岁，在德国和日本为 42 岁。我算过一笔账，从 2003 年到 2013 年，北京平均工资只增长到 2.89 倍，房屋首付却增长到
    7.8 倍！说明随着中国从计划'
