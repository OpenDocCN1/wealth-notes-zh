  md: '丝毫不亚于地壳运动引起的沧海桑田，它最重要的表现，就是在新一拨世界性的城市化过程中，城市越来越高耸，乡村越来越扁平，甚至，世界上绝大多数原来炊烟袅袅的乡村，会逐渐变成无人区。而城市，越来越来县密越来越高，与之相应的，则是城乡之间、城市之间房价的落差也会像地壳运动一样天差地别。到时，就像大部分人只能成为雇员而不是公司老板一样，城市尤其是大城市的房屋也将只为少数人拥有。而在城市内部，收入和财富的差距也会越来越大，正像我所说的房价越高的城市生态链越长一样，这个世界上最为富裕的人口，往往总是会与最为贫穷的人口比邻而居——或者反过来说也一样，这个世界上最为贫穷的人口，往往总是会与最为富裕的人口比邻而居——因为富裕的人口总在不断创造着就业机会。


    互联网和高铁、高速公路、飞机等现代交通工具是这样共同作用于与历史截然不同的现代城市化进程的：


    信息互联网打开了以往信息封闭中的人们的眼界，拨动了人们驿动的心：越来越便捷且越来越廉价的交通，则直接给驿动的心插上飞翔的翅膀，越来越多的人积极主动投入到“外面的世界很精彩”中来！城市变得越来越有魅力和活力，乡村的人越来越少，只有一部分人偶尔从城市回到乡村旅游、休闲、度假、观光、回望。


    在信息闭塞和交通阻隔的时代，只要隔着十里八里的山路，小村庄和小村庄之间的方言和口语可能就完全不一样，甚至互相不能听懂。在全球信息一体化的时代，人们走出去的愿望比任何时候都更强烈。二十五六年前，当我还在上大学的时候，一封信来回至少要半个月，从闽西家乡的小村庄到北京，光是火车车程至少需要
    48 小时。如今，世界最远两点之间，飞机航程不会超过 20 小时。（思考城市化问题的时候，头脑中请始终要有一根弦，就是：每个人的生命都不过是一个时间的旅程，时间成本永远是生命中最重要的成本。）


    曾经我们认为，便捷的交通会使世界更加去中心化。但事实是，人口的集聚化中心化才能带来更高的效率、更多的创造、更美好的生活。快递公司可能超出一一条街就不能给你提供送一个新鲜比萨的服务，城乡之间相隔五公里就业机会就可能相差十倍。


    哈佛大学教授爱德华·格莱泽在《城市的胜利》一书中告诉我们：


    > “在美国，有 2.43 亿人口拥挤在仅占全国总面积 3%的土地上，那就是我们的城市。生活在东京及其周围的人口高达 3,600 万，这里是全球生产率最高的城市区域。孟买中心城区域居住着
    1,200 万人口，上海的人口规模与其相差无几。在一个空间如此辽阔的星球上（全球所有的人口可以全部住在得克萨斯州，而且每人拥有一套私人别墅），我们选择了城市。尽管长途旅行者从密苏里州到阿塞拜疆的远程办公已经变得非常方便，但还是有越来越多的人正在越来越近距离地聚集在大型的城市地区。每个月有
    500 多万人迁居到发展中国家的城市里，截至 2011 年，城市人口已经占到了全球总人口的一半以上。


    “尽管技术方面的突破已经导致了距离的消失，但事实证明这个世界并不是平坦的，它经过了铺装。


    “在 2009—2010 年间，美国经济基本上处于停滞状态，但曼哈顿的工资水平仍然上升了 11.9%，高于任何一个规模较大的县。2010 年，曼哈顿的平均周薪为
    2,404 美元，比美国的平均水平高出 170%，比硅谷所在的圣塔克拉拉县高出 45%，后者是除大纽约之外工资水平最高的地区。


    “纽约振兴——衰退——振兴的经历向我们揭示了这座现代大都市的核心悖论：尽管远距离的交流成本已经下降，接近性却变得更有价值。从剧情的波澜'
