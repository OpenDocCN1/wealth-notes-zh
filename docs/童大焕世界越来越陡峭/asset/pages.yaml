  md: '感，让我在无限信息中捕捉到寥寥数条重要的有限信息，并且建立起它们和城市化之间有机联系的人和文章，并向这些人和文章作者致以最崇高的敬意。


    2011年10月出版的《世纪大迁徙——决定中国命运的大城市化》很清晰地揭示了中国城市化的未来趋势，也是我城市化研究的奠基之作。


    在这本书的《引言》和最后一节《奔向大都市》里，我如是写道：


    大城市化是解决中国许多问题的总开关、总阀门。农业、环境、水资源、贫富差距缩小、人的自由、独立、平等、梦想等等，都通过这道总阀门进入进一步求解之道。这不是凭人类的主观智慧和意志开出的所谓“药方”，而是自然社会自身的客观发展规律。


    在当代中国城市化的道路上，我们违背社会历史发展规律的荒谬举动如滔滔江河奔腾不息。过去几十年延续至今的城市化路径经不起历史和现实的考验，它需要重新定位，甚至需要“改邪归正”。


    古今中外，世界上没有任何一个国家是可以做到地区性的均衡发展的，惟一能做的是“人的均衡发展”，而人的均衡，也只是人的权利方面的自由与均衡发展，比如：平等的受教育和社保权利，自由迁徙权利的保障等等。


    我们曾经以为，大城市应该关起门来阻止更多的人进入，才能解决大城市资源尤其水资源紧张的矛盾。但人类是一个整体，中国是一个完整的家园，东部大城市关起门来，各地新增人口只能就地消化，在水土流失和农业人口增加、人均耕地面积减少的双重作用下，土地越种越薄，许多地方陷入“越穷越垦、越垦越穷”的恶性循环。人类不适合居住地区的大规模开发，带来生态和环境的严重恶化。


    不论从古代风水还是现代科学角度，大江大河的发源地、中西部地区都是中国的后山圣地，应当以生态保护为主。保护中华民族的“龙脉”，应该是中西部/江河上游地广人稀，谨慎开发；东部，江河中下游尤其是下游大城市化。


    “高密度大城市化”具有全面的“拯救中国”的全局性战略意义。我国半个多世纪以来人为阻止城市化，已经让我们付出了惨重的环境代价和人口增长代价。半个多世纪以来，荒漠化及严重水土流失地区的面积各增加了约一倍半，中国等于丢失了大约350万平方公里土地，可居住土地由于水土流失从600多万平方公里减少到300多万，少了一半。


    # 大城市化是保护中国生态环境的关键步骤也是根本举措。


    目前，最严峻的挑战还是来自观念和理论准备不足，并导致政策的严重滞阻和阻碍。朝野上下对大城市化恐惧，使传统的城市化呈现出与世界发展潮流相背离的逆城市化倾向；在本该城市化大中心城市，呈现出普遍的“过于保守的城市化”问题，画地为牢，严防死守，对大量业已自动进入城市的外来人口权利和福利视而不见，导致规模史无前例、后患无穷的流动儿童与留守儿童问题；而在很多从自然发展规律上看注定要衰败的一些中小城市和乡村，则普遍出现地方官员主导下的“过度城市化问题”。


    在未来城市化的进程中，可能造成巨大浪费的，还有铁路、公路等基础设施建设，尤其是国有企业一统天下的铁路建设，尤其令人担忧。搞得不好，现在开始进行的基础设施建设的浪费，将可能远远超过计划经济时代的“大三线”、“小三线”建设。


