    A 股股东无关。这就决定了 A 股只如吴敬琏所说，类似于一个合法的赌场。赚钱的人一定是从亏钱的人身上赚的，还被抽了税。甚至，赌场还比它规范。因为 A 股还是一个容易被大资金操纵的赌场。虽然监管部门一直在努力，但审批制到这方面的进步实在微乎其微得微。同时，既然是赌场，就是培养人性的赌性，而丧失人性的理性：亏了的想回本，赚了还想更多更大的赚。而这一切，都完全寄寄托在自己不能掌控的偶然上。


