    如果商业银行对 7 折利率的积极性不高，救市预期达不到，降息和降准将是央行喂给市场的另两颗糖。毕竟接下来的 MBS 正式推出还需要时间，而挽救经济衰退和规避大范围金融风险已经成了刻不容缓的当务之急。


    先说说 MBS 是什么。MBS 是银行把贷出的住房抵押贷款中符合一定条件的贷款集中起来，形成一个抵押贷款的集合体，利用贷款集合体定期发生的本金及利息的现金流入发行证券，并由政府机构或政府背景的金融机构对该证券进行担保。也就是所谓的盘活资产，把目前已经存在的房地产贷款以证券化的方式出去，回现金给市场。专业人士分析说，这将给中国房地产市场带来史无前例的变化，这就是房地产市场的金融化，房屋不再仅仅是居住品，同时变成了可以流通的金融产品。这将大大增强这个行业的金融流动性，提高其金融效率，大大降低这个行业的资金成本。银行拥有这个无风险杠杆以后，其房屋抵押贷款的积极性将史无前例的提高，而全社会的闲置资金将会高效持续的流入
    MBS 市场。若 MBS 顺利推行，8.5-9 折房贷利率将会遍地开花！


    本次房贷新政最大的不同就在这里，不仅扯掉了以往羞羞答答遮遮掩掩“定向宽松”之类的面纱，直接对楼市敞开大门，而且首次推出 MBS，把银行对房屋的贷款证券化，既向全社会分散房贷风险，也源源不断地向社会上直接吸取房贷资金！国际上
    MBS 规避风险的办法是：高风险贷款提供高收益，低风险贷款证券化时相应的是低收益。不排除一些类似鬼城的地区房贷也会以打包的方式证券化出售，由于风险高，短期收益也高，如果是我，对这类产品应该是避而远之；但中国大妈是有名的短视，只看得见眼前的蝇头小利，人傻钱多，也许这类高风险高收益的反而卖得更好呢。也未可知。


    我在年初的时候估计今年 6 月份就会出大规模救市计划，但经济数据在 6 月短暂回升使政策层盲目乐观，推迟了全面救市的时间；GDP 增幅第三季度快速回落至 6
    点几，为改革开放 30 多年来所仅见，这才推出一揽子直接针对房地产的救市计划。所见，中国主流经济学界和决策层一直高估了中国经济的健康程度、一直低估了房地产对中国金融乃至经济的重要支柱地位。都知道它是国民经济支柱，但到底支柱到何种程度，经过了这一番折腾，终于有更多的人对此看得更清楚了：救房地产就是救中国金融和中国经济，房地产不仅是国民经济的支柱，而且是命根子！当然，有一些装睡的人你永远叫不醒，他们就只能在期待楼市“崩盘”的美梦中等着自己的梦崩盘。


    即使在西方成熟市场经济国家，楼市的复苏依然是经济的主力，比如此轮美国和英国经济的复苏，房地产就起了中流砥柱的作用。范埃林在《房市调整的反面冲击或被低估》（21
    世纪经济报道 2014 年 9 月 27 日一文中写道：“根据国际货币基金组织 IMF（2008）对二战后 122 次经济衰退、112 次信贷收缩、114
