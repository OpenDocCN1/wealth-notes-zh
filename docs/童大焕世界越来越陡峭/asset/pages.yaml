    10,000/平方英里地区的家庭，平均每年使用的汽油为 687 加仑；居住在人口密度小于 1,000/平方英里地区的家庭，平均每年使用的汽油为 1,164
    加仑。如果把家用能源算进去，差别就更大了。从市区移居到郊区，往往是离开公寓搬进独门独户的大房子，这意味着家庭用电量将增长 88%。标准的郊区家庭比都市家庭每年多排放
    6 吨二氧化碳，其中包括 4,400 磅的取暖释放和 1,800 磅的电力排放。


    所以，格莱泽大声疾呼，如果你热爱自然的话，就远离瓦尔登湖，到拥挤的波士顿市中心去定居。郊区环境保护主义者已经过时了。环境真正的朋友是曼哈顿以及伦敦和上海的市中心，而非郊区。与居住在城市里的人口相比，居住在树木和草地周围的大自然的爱好者们消耗了更多的能源。高密度的城市生活，不仅有利于保护自然生态，而且还能刺激创新。高密度都市中面对面对的人际交流、多元文化的碰撞，自古以来就是人类进步的引擎。有效的环境保护主义需要世界的视野和全球的行动。如果中国和印度的人均碳排放增长到美国的人均水平，全球的碳排放将提高
    139%。这两个国家的驾车出行和城市化模式可能会成为 21 世纪最为重大的环境问题。


    当代中国一直在以小肚鸡肠的狭隘心胸和视野面对环境和人口问题，甚至不惜以“城市资源有限”的伪科学堵截外来人口进入高密度城市尤其是大城市。关起门来的“城市资源有限论”根本无法解释香港、台湾、日本等资源奇缺地区和国家的发达，更无法解释拉斯维加斯、迪拜等如何在沙漠上建起了世界上最繁华、人口增长最快的城市！


    在“环球同此煎热”的环境问题上，我们必须重新建立全国乃至全球视野，否则，65 年来，我们的环境被不允许农民进城的过度农业化破坏了一通，改革开放后又过度工业化糟蹋了一通，还将势必被错误的城市化道路再破坏一通！我们把大量的污染企业向内地、向西部、向农村转移，我们一再提倡所谓的小城镇建设，殊不知破坏的却是中国大江大河的源头和原本更为脆弱的中西部和农村生态。我们做着“见山望水”的黄梁美梦，无形中却大大增加了人流、物流成本和碳排放！


    在人口高密度的大城市，“人多力量大”和民众的环保意识抬头能够较有效地遏制污染企业，迫使他们在治污上付出更多有效的真实行动；人口密集也使城市的人均治污成本降低，从而使治理污染变得更为现实和可能。把污染企业向城外、向西部、向农村转移的鸵鸟政策,
    和人与人更为陷阱的五害型安排，除了加大人流物流成本，也使企业对江河源头、农村的污染和破坏更加肆无忌惮、更加畅通无阻！这些污染和破坏，最终仍将通过河流、空气等向江河下游的大中城市蔓延。


