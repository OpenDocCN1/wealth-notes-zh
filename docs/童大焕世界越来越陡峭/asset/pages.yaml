    # 广州 CBD 逆势热租说明了什么？


    2014 年中国 GDP 增长率创下 1990 年 3.8%以来的第二个低年度，国家统计局公布的数据为 7.4%，但本人根据当年用电量增长 3.8%的事实进行评估，实际增长率应为
    4%左右。楼市的冷漠甚至萧条，则是普通老百姓更直观的一个年度事件。


    是不是因此而对未来中国充满悲观呢？答案是完全否定的！正如我一向对中国的政治、经济变革抱以乐观态度，恰恰是因为对过去那种经济模式抱以极其悲观的态度一样，“中国模式”2014
    年的突然失速，恰恰是未来中国更好成长的开始，所以我才会把 2014 年称为继 1949 计划经济时代开始、1978 权力市场经济开始之后的当代中国第三次大变革元年。它意味着传统工业主导时代结束、服务业主导时代开始；权力主导时代结束，市场主导时代开始。


