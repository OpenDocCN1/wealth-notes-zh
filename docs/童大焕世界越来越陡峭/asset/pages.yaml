  md: '口增长超过了中心市区。③逆城市化阶段。在郊区城市化继续发展的同进，中心市区显现衰落景象，出现人口净减少。④再城市化阶段。中心市区经济复兴，人口出现重新回升。


    发达国家的城市化过程中第三阶段即逆城市化的出现，跟汽车战胜电梯这段历史息息相关。在逆城市化之后，又经历了城市环保运动、教育复兴、金融和科技创新带来生产性高端服务业发展等一系列变革，加上城市平面化扩张带来的交通拥堵等一系列后遗症，城市又经历中心区域重新复兴的新阶段。


    当代中国的城市化进程，第一、第二阶段与世界经验大体相同，但第三第四阶段却大有不同。中国的城市化还没来得及进入逆城市化阶段，世界就早已经进入环保、金融和科技时代，尤其是半路杀出个程咬金，闯进来一个不速之客：互联网。互联网对城市化的影响，将比工业化还大。1987
    年 9 月 14 日，中国的第一封电子邮件发出，内容为英文：“Across the Great Wall we can reach every corner
    in the world.” 中文大意：“跨越长城，我们可以到世界上任何角落。” 1994 年 4 月 20 日，中国实现与互联网全功能连接，成为接入国际互联网的第
    77 个国家。


    在时代已然发生天翻地覆改变的背景下，中国迟到的城市化进程自然不会走与西方国家完全一样的道路。尤其是逆城市化阶段即城市中心衰败现象将不再出现在中国（除非拆迁成本过高导致局部暂时性衰落）。尽管城市尤其是大政府一直在有目的地利用强制手段“疏解中心人口”，但疏解出去的只是居住人口，就业人口反而更加集中到市中心来。“腾笼换鸟”的结果，是腾出了居住的笼子，换上了高端服务业就业的鸟儿！上海的数据显示，金融行业高度集聚在市中心
    3km 处，其次是文创，8km，再次是科技，12km。因此，这么多年来政府一切疏导市中心的努力，只是给中国添了两个世界冠军：拥堵和上下班通勤距离的世界冠军都在中国，这就是北京和上海。北京以单程平均通勤时间
    53 分钟左右稳居世界拥堵第一位，上海以 51 分钟左右屈居亚军。


    因此，中国人为的“逆城市化”是个笑话。最后势必更快地回到再城市化阶段，在工业过剩、高端服务业和互联网大发展的背景下，城市中心向更高、更密集处发展，富人从郊区回归中心，留在城市郊区的，将是被中心挤出的中低收入人群，或者新进城住不起市中心的人群。


    这就牵涉到下一个问题：城市可以有多高、多密？这个问题，留给下一篇文档。


