    # ## 李嘉诚迁册剑指何方？


    一千个人眼有一千个哈姆雷特。时间进入 2015 年新年以来最牵动中国人神经的消息，莫过于世界华人首富和商界领袖李嘉诚旗下两大上市企业——长江实业（长实）及和黄黄埔（和黄）1
    月 9 日宣布业务合并、重组方案，两集团资产最终将分拆为两间以英属开曼群岛为注册地的新公司长和与长地。其中，长和将持有目前长实及和黄的非房地产业务，而长地将持有并经营房地产业务。作为世界华人商界的标志性人物，李嘉诚一举一动格外引人关注，这一“世纪大重组”特别是开曼群岛注册，自然引发各界人士强烈关注和各种解读。


    而在去年，李嘉诚反复强调，长实、和黄不会将注册地迁出香港，自己爱港爱国，永不迁册。此番“迁册”举动自然引发更大关注和猜测，被外界解读为李氏商业帝国大撤离，不仅在撤离大陆，还在撤离香港；意味着人民币和人民币资产可能会暴跌，中国的经济已经很危险。有人认为李嘉诚如此决绝的撤离行动，一定是已经闻到了一些变化，不管是政治上的还是经济上的考虑。有人解读为李嘉诚的儿子不擅长政商关系，李嘉诚此举是为了保护自己家族和后代。当然，也有人认为这只是种商业策略，无须过度解读，在开曼群岛注册能够享受的财务便利性是其中一个原因。香港上市公司只可从其可供分派的利润中拨款以向股东派息，开曼群岛公司则可以由股价溢价派中分派，这有利于长和长系股东的利益。李嘉诚自己也解释为“方便做生意”。但如果仅仅出于股东利益，不必如此大费周章。怎样才叫做“方便做生意”，本身也可以有一千种解读，尤其是风口浪尖的标志性商界人物，有时候不得不像政客一样话只能说一半，甚至真假难辨。


    要清晰解读李嘉诚此次迁册行动，我认为需要一横一纵两条线才能精准定位。一横，是指他除了关于迁册还说了什么？是什么横向的外部原因促使他迁册？一纵，是李嘉诚商业王国内部过去多年在时间纵轴上都做了什么？这两个脉络理清，李氏商业王国此次“世纪大重组”的迁册行动，目的和原因也就自然而然拨云见日水落石出。


    纵向时间轴看，在李嘉诚 2013 年撤离大陆房地产时，《新财富》杂志曾作了一篇图文并茂、数据详实的独到分析，这篇由范博豪、钱梦吟共同完成的《李嘉诚资产腾挪背后的传承逻辑》，仍然是解读今日李嘉诚迁册的重要标尺。它根据数据看出李氏商业王国十年前就开始把资产从发展中地区向海外发达市场迁'
