    # 让我来扒贺雪峰的五层皮


    2014 年 9 月 9 日，澎湃新闻网刊登李丹对贺雪峰 5800 多字的访谈《农民要审慎进城，中国若搞激进城市化有可能翻车》。在三农和城市化问题上，本来我是不太关注名声很大的温铁军、贺雪峰、李昌平的，但由于好几几位朋友都推荐我看这篇，于是认真地把它看了几遍。最大的感想是：你品尝一个厨师的菜，只要尝过第一口就知道了。一个厨师，通常第一口是什么味道，最后一口也就是什么味道。


    贺雪峰的学问给我的感觉也是这样。他口口声声标榜自己用脚做学问，“从90 年代双腿跑遍全国”，“痛感学界多懒汉，没有经过亲身调研”，想以此占据道德和真理至高点，但是拜托，做学问首先应该是用脑吧？！否则关于三农有谁能比农民更懂？最关键的是你双脚做出来的学问应该像那么一回事。所以我用了一句不客气的比喻：“屎克郎即使在广袤大草原眼里也只有一堆牛粪”。有人说观点不同何必恶言相向，必有私仇。我没有私仇只有公愤。平生立志“杀戮权贵杀戮精英杀戮假道学”，最看不惯名为百姓代言实际效果却是为权贵张目的诈派。


    我发现贺雪峰老师做的中国搞的城市化几乎没有好的。发达国家城市化的“好”表现在三个方面：第一基础设施很完善，第二没有大规模的贫民窟，第三进城的人口有稳定、正规的就业，非正规的小商小贩、打工临工、赚点小钱的情况比较少。中国是发展中国中唯一没有大规模城市贫民窟的国家。在他这里，好与坏有很多的主观性评价。比如没有贫民窟就一定比有对？没有非正规就业就'
