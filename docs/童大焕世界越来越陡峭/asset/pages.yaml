    # 城市化的规律恰恰是由小水滴汇成的


    人们一直期待着交通和互联网的发展能够使城乡发展更加均衡，当代中国几乎所有的重大决策也一直在试图控制大城市人口、鼓励中小城镇甚至“就地城镇化”。但是，2015
    年 4 月 13 日《21 世纪经济报道》的相关报道（即将开始的人口“战争”）则指出，梳理数据发现，来自中西部地区的年轻人不仅没有“逃离北上广”，而是继续向珠三角、长三角和北京聚集。“逃离北上广其实是个伪命题，人口向东部大城市聚集的趋势不会变，这一点与日韩等国的人口变化一致。”接受
    21 世纪经济报道记者采访的一位学者表示。


    根据国家卫生和计划生育委员会发布的数据，截至 2013 年底，全国流动人口达 2.45 亿人。这意味着，全国有超过 18%的人口离开本地或本省在外生活。根据国家卫生计生委的数据测算，目前跨省流动人口已占全部流动人口的
    38.9%。其中，人口主要从中部和西南地区流出，安徽、四川、湖南、河南、贵州和江西六省占全国跨省流出人口的 71.07%。


    虽然最近 10 多年来已出台西部大开发、中部崛起、新农村建设战略等政策，但人口从中西部向东部转移的趋势未变。跨省流入人口，人口主要流向珠三角、长三角和北京地区，“逃离北上广”成为不折不扣的“伪命题”。国家卫生计生委的数据显示，截至
    2013 年，广东的珠三角，长三角的浙江、上海、江苏，北京，海西经济区的福建六省市占全国跨省流入人口总数的 87.83%，较 2012 年同期上升了 4.5%。


