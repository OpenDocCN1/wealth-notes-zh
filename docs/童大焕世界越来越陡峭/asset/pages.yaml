    塔勒布的《反脆弱：从不确定性中受益》理论之一就是用小崩溃换来大安全。如感冒时不服药，每年有一两次发烧，调动体内免疫系统，以免身体全面崩溃。又像原始森林，你不能一见小火就立即扑灭而应该让其自我燃烧，否则时间一长就会酝酿成不可控的森林大火。经济规律和自然规律一样，要让每个利益主体、每个不同区域自我承担风险，才能让他们不断从风险中总结经验教训，从而避免整体性的风险爆发。因此，对于那
    37%楼市过剩的城市，这一回不要抱任何侥幸心理。暂时还未过剩的城市，也要小心谨慎看供需状况。


    # 大势向囚：未来楼市如何分化？


    经济学家李稻葵认为：“过去十年房产价格是高涨狂热期，未来十年一定是走缓的趋势，相对理性的时期。未来十年的房产价格和投资收益同过去十年相比增长幅度会下降，以此印证房价上涨放缓的节奏。”如果从整体的全国平均数上来看，房地产收益和投资总量增长会放缓，但是这样的判断无助于我们如何学会投资如何获得投资收益最大化。更有操作意义和价值的判断是：从
    2014 年开始，中国内地房地产进入两极分化时代，遍地黄金的时代过去了，闭起眼睛非理性投资都能赚钱的时代完全彻底地过去了，楼市进入理性投资才能赚钱的时代！理性投资必须严格遵从城市化和市场化的自有规律！1949
    年以来，中国经济或者中国经济管理者在城市化问题上一直存在反市场化思路，城市规模大就要控制，城市规模小就要提升，这是反市场化的思路。而市场趋势实际上相反的，城市化根本上呈现出的是集聚效应。年轻人到北上广深证明大城市的集聚效应，这是城市化发展自然而然的市场趋势也是必然趋势。2014
    年后的楼市全面分化使得过去非理性投资者和开发商全面觉醒（因为他们已经感觉到了痛），将使大城市的集聚效应和吸引投资者的效应更加明显，与之相应的，就是大城市房价真正进入稳步飞速增长的黄金期！因为过去十几年大量旅游地产和三四以下城市房地产投资失利者将有可能实现资产置换，反而有可能助长一线城市房价进入更快更稳定的飙升期。


