  md: '常的吃惊。一方面是我们农民的土地、农房等私有财产权利得不到最基本的法律保护，城市房屋土地使用权也只是 40、50、70 年，另一方面对汽车的私权又被上升到绝对的高度，其间反差，到了令人不可思议的程度。这既是对财产自由的极端漠视，也是对自由的亵渎。


    在论证以某种方式限行（比如单双号限行、尾号限行、以收取进城费拥堵费的经济调节节方式“限行”）是否侵犯了公民私有财产之前，我们不妨“快闪”一笔，写写著名歌手尹相杰近日因涉嫌非法持有毒品罪被刑事拘留一事。据警方通报，尹相杰抓获后，现场起获冰毒等毒品
    10 余克。他本人对非法持有毒品和吸食毒品的行为也供认不讳。有律师推测他可能因此被判 7 年徒刑。


    如果我们绝对化理解私有财产，那么，尹相杰持有冰毒和吸食冰毒，非偷非抢，无害于他人和社会，何罪之有？警察和公安机关岂非多管闲事？


    但私有财产神圣不可侵犯的前提，是尽可能减少财产占有和使用过程中对内、对外的负作用。毒品的使用和拥有完全无涉社会和他人，社会和法律尚且有干预的权力；对于污染企业和汽车之类的财产占有和使用，同样需要社会和法律的外部力量干预。因为大多数时候，人的理性是有限的，要把野性和兽性关进经验和法律的笼子里，社会才不会崩溃，人类才不会在自私自利中“同归于尽”。


    汽车的负外部性大致有三：一是超速或超高速行驶将危及公共安全，因此对汽车的使用限制其实从它出厂那一天就开始了，比如限速。一方面是与公路匹配的路段限速，另一方面则是对超高速飙车的限制。不管时段和路段，谁要是胆敢以
    200 迈以上的速度飙车，等待他的惩罚将可能是以危害公共安全全入罪入刑，并且终身吊销驾照。无证、醉酒和超速驾车都是被严厉禁止和惩罚的行为。二是汽车尾气污染。对于企业的污染处理一般有三种形式：要求自行处理污染达到合格标准，要求缴纳一定的污染税费，达不到要求或不缴污染税费的关停处理。对汽车尾气不可能像对待工厂一样要求自行处理污染，虽然对汽车和汽油厂家会有一定的环保品质要求，但有开车才有污染，每个车主的污染制造跟开车里程成正比，替代方法就是可以要求车主缴纳污染税。三是交通拥堵造成他人的时间损失，管理的办法就是收取拥堵费或进城费，直到让多数私家车司机自动放弃驾车出行，使道路回归畅通。


    有人说你收取拥堵费或进城费是势利眼，只为富人说话，因为富人缴得起这个费用。那好啊你要绝对公平不了，那我们可以从路权方面来做这件事，就是根据出行比例来界定路权，比如公交出行人群占
    60%，那么在本该收取拥堵费或进城费的、容易拥堵的区域，所有机动车道路 60% 划为公交车道，私家车只能在另外 40% 车道上行驶，如果私家车侵犯路权，闯进去公交车道，人行道或自行车道，一次罚款
    1 千元甚至更高，发动人人拍违章活动，从罚款中拿出固定比例奖励举报人，直到无人敢侵犯路权。至于你爱买车，爱一天 24 小时堵在路上，那是你的绝对自由，无人干涉。如果是那样，汽车尾气污染作为这个时代性能乏和中产、有产阶层道德沦陷的共同业障，我个人愿意为此共同承担雾霾和汽车尾气损害健康的后果。


    如果有人觉得罚款还是对富人有利，因为他们交得起罚款。那就改一种形式，不罚款，累计侵犯他人路权达到一定次数，一律没收汽车并且终身禁驾，逼得你回到公交一族来。好不好？


    作于 2014 年 12 月 31 日


    2015 年 1 月 2 日发表于腾讯《大家》'
