- pgno: 61
  md: '医办学、建祠堂、修祖屋。今天中国农村遍地开花的建房运动，绝大部分资金也是来自外出打工和经商收入。在农业社会，中国历史上从未真正诞生过自我造血式的富裕村庄。只有未来城市化和土地自由化以后，少数人拥有大量土地和农业产业，自我造血式的富裕和美丽乡村才有可能在中国真正出现。当代中国风头鹞角的“明星村”之流，更是政策制造政治典型、慷国家之慨选择性输血的特殊产物。


    吾之朋友邬烈山在《历史文化名村的兴衰——从闽西客家古村落叶归村说起》一文中写道：“在中国人的传统观念里，出门闯世界的人，一是要‘衣锦还乡’、‘叶落归根’，否则就如‘衣锦夜行’，就是孤魂野鬼；二是要‘光宗耀祖’、‘封妻荫子’，这是人生最大的成就和荣耀；三是要回报整个家族，造福乡梓，使作为家族命运共同体的亲属利益均沾，有福同享才能遇难共当。因此，在外面当官和经商发达了的人，一定会回乡建府第。你听‘大夫第’、‘进士第’、‘明经第’、‘镛经别墅’，这些名称一望而知与读书做官有关。……为官有品而致仕，经商发财而返乡，作为成功人士，一来他们有见识有威望；二来他们有权力有财力，自然就成了乡绅自治和宗族自治的领袖。修族谱，建宗祠，定族规，建祭田，设义仓，办义学，这样家族共同体的公益事业便兴旺起来了。这就造成一种‘马太效应’，或曰良性循环，氏家族子弟有更好的受教育条件，经商、出仕有更广的人脉资源。埕田村容不下了，他们便向江西、浙江等地迁移。


    然而，这样历史，再也不会重现了。当代中国，户口从农村迁出的为官者、求学者，法律上再不能回乡置地建房，告老还乡的物质血脉被抽掉近半（经商那一半还在，走政策擦边球的也还在）；计划生育使传统的家庭崩溃，到老还有乡村兄弟姐妹的在告老还乡的精神血脉断裂。更有全球性的大城市化浪潮，使得回乡成为越来越奢侈的逆流。


    未来中国更多的一种情形是：大多数今天大兴土木的村镇，都会不可避免地重复上世纪二三十年代广东开平碉楼的历史，再过二三十年全部人去楼空，“昔人已乘黄鹤去，此地空余黄鹤楼。黄鹤一去不复返，白云千载空悠悠。”开平碉楼建设的精美与繁复，下的血本之高昂，大量昂贵建材直接从国外进口，肩挑手提走在泥泞的乡间小道上，尚且挡不住“此地空余琉璃楼（有人口外流为主因，新中国成立初期闭关锁国为辅因）的最终归宿，今天的城市化浪潮更汹涌，乡村建设更粗制滥造，自然更加挡不住历史的潮流。


    有人问历史文化名村有什么保存的好办法？政府只给个名头，不给钱。我说没有好办法。靠输血总不是办法。今后最好的办法恐怕是把一些典型的精美建筑异地保存，像龙脊壮老房子。或者集中到一些山水优美、气候适宜、交通便利的小镇或县城，重新建设休闲、教育、文化旅游类小镇，成为消费型村镇的一个品种。


