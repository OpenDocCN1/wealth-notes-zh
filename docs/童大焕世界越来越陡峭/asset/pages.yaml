    # # 城市化不能只有动脉没有静脉


    如果把城市化进程中多数人口和财富向城市转移视为城市化的大动脉，那么，少数人口和资金、技术向乡村回流就是城市化的静脉，只有动脉和静脉都畅通，社会的肌体才算健康。这应该是一个基本常识。农民在乡下的土地、宅基地要有人买，才更有利于他们带着资本进城、从而在城市安居乐业。这个常识和规律如果被违背，毫无疑问是在阻碍城市化的进程，在推行“逆城镇化”。


    2014 年 1 月 10 日，国土资源部部长姜大明明确表示，决不允许城里人到农村买地建房的所谓“逆城镇化”行为。土地改革要守住底线、试点先行：不论怎么改革，不能把农村土地集体所有制改掉，不能把耕地改少，不能把粮食产能改下去，不能把农民利益改掉。


    而此前召开的十八届三中全会指出：改革完善农村宅基地制度，选择若干试点，慎重稳妥推进农民住房财产权抵押、担保、转让。很显然，如果要保护农民利益，坚持自愿有偿转让原则无疑是天下第一等要事，而不是这也不准那也不准。至于城市化进程中耕地会减少还是增加，其实也取决于我们的土地制度。如果土地和宅基地可以自由流转，在多数人口向少数城市地区集中的城市化过程中，耕地肯定是越来越冗余越来越多的；反之，如果土地和宅基地不能自由交易，大量农民进城自然要占据城市郊区土地，但农民原有的宅基地却不能置换出来，几十上百年荒废在荒郊野岭。我们现在几乎每天消失
    200 座村庄，大部分情况就属于后者。


    世界各国的城市化进程，都是经济效率和市场自由选择的结果。换句话说，市场的自由选择不会导致“逆城镇化”的结果，相反，1949 年以来的许多政策选择才导致了当代中国“一枝独秀”的奇葩式逆城市化行为：1978
    年以前严历阻止农民进程以及知识青年上山下乡是逆城市化；1990 年代以来乡镇企业和小城镇建设是逆城市化；时至今日的大城市户籍管制是逆城市化；阻止城市人才、资本、技术和文化回流的严禁城里人到农村买地建房也是逆城市化。没有少数城里人带着资本、技术和文化回流农村，多数农村人就只能赤手空拳地进城；甚至于是即使农村有大量的土地荒废和空置出来，没有城市资本、技术和视野的进入，留守农村的农民也是根本无法、无力实现“就地城镇化资本”的！


    虽然 1949 年以来的当代中国总体上的政策选择是逆城市化的，但严禁城市居民到乡下购地置房仍是 1998 城市住房私有化以后的事。中国历朝历代的官员更是哪拍官至一品最终仍要“解甲归田，告老还乡”。1982
