    其实我更早就清楚地意识到了，新的超级大城市化， 世界上都没有经历过， 过去也没有成熟的理论， 不少方面， 我们可以贡献原创性的思想。2017 年， 我在微博上就说过样的话：


    > “服务业主导的超级大城市化， 世界上没有任何经验可循， 惟正确理论可抵达未来。2017-10-23 08:58”


    这篇文章， 主要回答马力建先生 “你为什么成为这方面的专家” 的提问， 也借机回顾、 整理一下自己的城市化研究和房产投资历程， 分上中下三部分：


    上：22 年的前瞻历程；

    中：给我 “顿悟” 的重大事件；

    下：我所影响和不能影响的人和事。


    ![](img/649adaed3df98c553c2b8cbd120550f9_276_0.png)


    大学（无线电通信专业）期间， 偶然读到过普列汉诺夫一句话： “一个人要想对社会有所贡献， 必须使他的才能比别人更适合时代的需要。” 有如电闪雷鸣， 从此念念不忘，
    牢记在心。


    大学毕业（1990 年）开始， 我就一直在写散文、 杂文和评论， 富翁广泛涉猎， 尤攻经济， 笔耕不辍， 自称 “日暴十万， 三年可成百万（字） 富翁矣。”
    这份耐心与坚持， 不仅给我日后带来超过工资的稿费收入， 而且全面系统地锻炼了我的跨领域、 跨专业思维和表达能力。1997 年开始在 《杂文报》 和 《南方周末》
    频繁发表文章以后， 写作渐入佳境， 我给自己的定位要求是 “重大事件尽量都能有自己的声音”。 产量最高的时候， 一天发表 6 篇文章， 一年发表 500 多篇。


    如是坚持， 在评论领域慢慢有了自己的全国性声誉。 其中， 2009 年度获腾讯网 “年度教育时评家” 称号， 2011 年度获南方周末中国传媒年度致敬等。


    但写作日久， 终有疲态： 重复自己， 更无快意。 所以终究是要转到专业研究时代最需要（最缺乏） 的重大题材上来。我选择了城市化这个领域， 认为它对当下和未来每一个人的深刻影响，
    比很多人概念都还没搞清就在那边鼓呼的民主问题重要不止千万倍。


    有迹可寻的城市化专业思考， 最早可以追溯到 1997、1998 年。


    +   * 【1997、 1998 年， 开始思考中国的城市化问题。】


    当时， 乡镇企业和小城镇建设成为国策且蔚为壮观【1980 年代就提出 “小城镇， 大战略”】。 我认为农民应该进入大中城市， 而不是乡镇企业和小城镇。 当时的判断，
    即已显出很强的独立性和前瞻性。


    后来还有一篇获孙冶方经济学奖的博士论文， 认为中国区别于世界其他国家城乡二元结构的 “三元结构”， 即乡镇企业和小城镇结构。这其实是把产能落后和农民不能自由迁徙导致乡镇企业遍地这一政策扭曲的结果通过理论包装合理化了。我说，
    如果真有这个结构， 论文该获得诺贝尔经济学奖， 因为它解决了全世界都解决不了的 “就地城市化” 和 “均衡发展” 问题。


    1997 年 11 月 30 日， 写下 《现代农民要进城》 一文： “一个国家， 理应有 80%人口集中在城市。” “把一代一代农民拴在那片只觅减少不见增多的亩亩分地上，
    他纵有经天纬地之功、 倚天横剑之壮志， 英雄无用武之地， 又能有什么大出息？ 中国农民祖祖辈辈朝黄士背朝天子里刨食， 刨来刨去还不是仅够糊一张嘴， 很多时候甚至连一张嘴也糊不住。”'
