  md: '“地面公交与轨道交通低票价政策不匹配的问题造成客流分布不合理。地铁适合长距离快速乘客人群，公交适合中短距离人群，由于地铁实行的全网网“一票制2元”低票价政策，造成地铁客流激增，其中很多中短途乘客流向地铁，不仅导致地面公交企业客流降低、收入降低，也导致地面公交未能很好地发挥在公共交通体系中应有的功能作用。”


    目前北京公交车总量不超过2万辆，与之相对应的是，截至2014年10月末，北京市机动车保有量达561.3万辆，驾驶人892.8万人。2013年底出台的《北京市空气重污染应急预案》中指出，若启动单双号限行，北京全市公共交通预计增加客流200万人次。这200万人次的客流，现有的公交运能绰绰有余。


    当然，上下班高峰期形成公交客流高峰，也会形成小汽车客流高峰。但如果此时通过小汽车限行、征收拥堵费等手段，使道路畅通起来，加快公交车速度，那么，高峰时段的公交运输能力提高一倍，并不是什么难题。运输能力提高一倍，不仅意味着装上原本开小汽车上下班的人们绰绰有余，而且意味着原有的拥挤程度也会大大减轻。北京的二环、三环、四环被定义为城市快速路，所谓快速路，指机动车运行速度至少应在60公里/小时以上，但目前实际行驶速度不过40公里/小时。拥堵时段平均一小时才20公里左右。如果能够通过对限行和拥堵费，将公交车的速度在拥堵时也提高到40至60公里，则不仅人们的出行时间可以节省一半，而且地面公交高峰时的运营能力可以提高一倍。地面公交的运行效率提高了，不仅不需要增加公交车辆和公交司售人员，而且公交的经济效率也会提高，平均每公里运营的财政补贴也会大大下降。


    傅蔚冈先生说“如果北京市投入更多的公交车辆和驾驶员，那意味着政府的财政补贴还会进一步增加。而在目前，那些开车上下班的人则是自己承担自己的出行成本，而不依赖于政府的财政补贴。到底是自己承担出行成本好，还是依赖于政府财政补贴好？我倾向于前者。尽管我不是上下班开车，但我支持那些开车上下班的朋友，你们是独立自立的个体，好样的，不丢人！”


    第1方面，前面说了，只要公交速度上来，不需要投入更多的车辆和司售人员。


    第2方面，乘客是否享受补贴，是公共政策决定的。如果公共政策决定乘坐公交不享受补贴，人们照样会自己承担相应成本。事实上，自2014年12月28日起，北京公共交通已经做了价格调整。轨道交通起步价调整为6公里（含）内3元；地面公交起步价调整为10公里（含）内2元。


    第3方面，说私家车没有享受政府补贴，也是不客观的。私家车主们并没有全额付出和分担城市道路的建设、拆迁、维护等成本。高速路除外。


    差别只在于，乘坐公交的人们享受到的是明补，开私家车的人们享受到的是暗补。在这些方面，开私家车的人们并不具备一分钱的道德优越感。


    挂一万篇简谈说完了城市交通的现规划——如何交通地铁、路面公交和私家车的关系，接下来简谈说城市功能规划与交通拥堵的关系。


    北京市政府公布的数据显示，从2003年到2011年，北京中心城区建设规模增加了30%：73%的就业、90%的优质医疗和教育资源集中在中心城区内；约80%的机动车出行集中在六环路以内地区。北京城六区仅占全市8.3%的域面积，却集中了全市60%的人口、70%以上的经济总量、90%的三甲医院和优质教育资源。


    社会普遍的观点认为，人口、车辆过快增长、城市功能过度聚集，是北京市交通拥堵的深层次原因。必须从调整城市规划、疏散城市功能、控制机动车总量'
