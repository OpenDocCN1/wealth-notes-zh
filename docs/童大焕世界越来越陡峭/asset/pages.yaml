  md: '至北上广深，下至偏远乡镇，每个地方都大肆圈地、大兴土木、大举借债、大幅扩城，尤其是小城镇大跃进乐此不疲；在城市建设突飞猛进的同时，各城市尤其是各大城市却在想尽一切办法以“城市病”、“资源极限”等未经详细严谨的证据和理论论证、巧立名目的各种理由，冠冕堂皇地搞人口调控“遏制城市‘肥胖症’”，限制公民的迁徙自由。


    不遵循经济和城市化自身发展的规律，过多规划区域布局，或者总想不自量力做救世主，以为行政力量有一只点土成金的手，最终结果是人口与投资的逆向流动，是资源的错配和房地产泡沫的破裂，即短期发展红利造成长期滞条。各地“鬼城”、“空城”如雨后春芽拔节生长，是不尊重经济规律、政府投资主导下的“中国经济奇迹”一枚硬币的必然反面，是这种不符合规律的经济和城市化成发展式从一开始就埋下的“定时炸弹”。只不过，人们也许没有想到，这一次降价事件发生在一线或者至少也是准一线城市杭州。但古今中外，道法自然，规律如天，何曾见过有例外乎？此番降价楼盘为桥西板块的德信北海公园和天鹅香榭里，降幅约20%。区域供给过高、竞争激烈以及开发商资金链紧张是事件本质原因。除了杭州，常州也曝出楼盘价格“双跳水”，襄阳一楼盘曝出开发商资金链断裂无法继续。


    为城市化大跃进买单的时候到了！这是市场爆发最后总结算的开始。和历史上所有的危机倒逼改革一样，这一次的危机链条也是从终端消费者开始，继而传递到开发商，再传递到地方和中央政府。最后倒逼市场化改革。危机从小城镇开始，大跃进程度越深的小城镇危机越深重：继之波及到大城市远郊区域。鉴于中国经济模式一开始是房地产补贴工业的招商引资绑架了房地产，继而是土地抵押的非市场金融模式使房地产反过来绑架中国金融和经济，加之当下中国的实有城市化率只有区区35%，仍处在城市化快速上升阶段，因此，短期内的全线危机尚不会发生，危机当头资金还有往城市中心和大城市集中以“抱团取暖”防范风险的趋势，所以，接下来更多的是市场剧烈分化，一些缺乏足够分析和判断能力的购房者和开发商必须为自己的决策买单，甚至不乏大量被洗擀出局者。而政府的市场化改革也已经时不我待，把更多的土地权利和开发权归还给民众和市场，已是别无选择的选择。否则，紧抱在手上的是烫皮烫肉还烫骨的烫手山芋。


    作于 2014 年 2 月 23 日


