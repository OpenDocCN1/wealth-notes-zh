  md: '户籍控制、上学和高考歧视都阻挡不了千军万马奔向大中城市的脚步，严厉的住房限购政策同样改变不了人口的流向，但它却有可能极大地改变大中城市出租屋的供应结构，像北京上海这样的一线城市，每年净增加外来人口高达
    60 万以上，在限购政策下，这些人全部必须租房居住，如果二套房以上的购房被严历限制，房租的飙升将不言而喻。同时，社会上充足的流动性资金仍然在一刻不停地寻找投资渠道。原本城市化速度较快、也是房价较高的全国
    72 座城市如果不暂停实行严厉限购政策，那么意味着市场的需求和价格信号被行政手段所屏蔽，将会带来另一个巨大的弊端，就是助长三四线城市房价泡沫。使自然的城市化需求并不充足的三四线城市，一定程度上有可能成为资金追逐的热点。而这些城市的楼盘规模总体较小，不需要多大的资金量就可以抬高房价；推高的房价进一步刺激资金进入，形成不符合市场要求的真实泡沫。市场信号一旦被非市场力量屏蔽，其可能造成的社会矛盾和国民损失，相比于遵从真实的价值规律——哪怕是残酷的高房价而言，从个人到社会到自然界（比如宝贵的土地上是烂尾楼），为此付出的代价要高得多。”


    市场规律一定会作为社会的最后结算力量出现。如果政策不符合规律，那就是报复性结算，结果就是楼市惨赔至降价。至于这一天何时到来，任何经济学家都很难准确预判。但我认为，这一基于
    2014 年春夏后正式到来了，最重要的标志还不是杭州和广州郊区房价下跌，而是三四线城市楼市成交量不断下跌，以及从 2012 年底开始，大开发商、包括一向以三四线城市为主战场的恒大集团纷纷从小城市逃离，到一线城市寻找避难港，到一线城市一年多来地头频出。从
    2011 年 2 月 11 日我在 FT 中文网发表专题文章，到 2012 年底大开发商开始撤离三四线城市，仅仅经过了零至十个月时间。


    杭州和广州远郊区在 2014 年初的房价大跌，是在没有任何行政调控加码的情况下发生的，可以被视为市场力量开始翻转行政力量的标志性事件。杭州此番降价楼盘为桥西板块的德信北海公园和天鸿香榭里，降幅约
    20%。区域供给过高、竞争激烈以及开发商资金链紧张是事件本质原因。广州降价楼盘也在郊区。说明除了一些小城镇大跌进导致空城、鬼城层出不穷之外，一线城市郊区供应过量的风险同样存在。它意味着中国内地房地产十几年里几乎只涨不跌、点土成金、遍地黄金的时代一去不复返了！接下来，不论是购房者、开发商还是各级政府，都必须把市场规律当财神供着，才能使自己立于不败之地。


    回头看肇始于 2011 年初的限购和限贷政策，它没有改变楼市的走向，但在短期内改变了楼市的部分预期（尤其是大中城市郊区），给了人们极好的入市时机。期间我动员了几个研究生刚毕业不久的小朋友在北京入市买房，短短两年多时间从一无所有变成了净资产增值百万元以上的百万富翁。限购限贷还加快了三四线城市房屋供应量见顶，加快了市场觉醒和市场清算的步伐。


    很多人担心杭州广州郊区楼价下跌和三四线及以下城市楼市成交量的下滑，是不是楼市整体崩盘的征兆？在我看来，2014 年一季度至上半年是多年来对于楼市心理预期最为波动的时期，也差不多是最后一次预期大波动的入市好时机。如何在心理和市场波动期选择好天时、地利、人和的好项目，看大家各自的努力和造化。大城市房价继续看涨，中小城市即使存在供应过量的地区，也未必完全没有机会。还是要看地段、项目和区域供需比、房地产资金结构等等。


    接下来的楼市会呈现涨跌不一的长期分化现象，总体稳中有升，局部下跌。总体稳中有升有几个坚硬理由：一是中国的城市化只完成三成，居民住房换代完成也极不充分。从 QQ
    大数据揭示的人口流向上，就会知道一线城市的上涨势头'
