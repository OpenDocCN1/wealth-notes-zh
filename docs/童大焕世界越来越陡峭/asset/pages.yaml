    相比之下，本人 1997、1998 年 29、30 岁时提出的意见和建议显然更具前瞻性。今天仍然限制个别超大城市人口落户，也依然不符合城市化规律，城市圈、城市群和高密度高集中的超级大都市也有本质区别，相信不出
    5 年，国内超大城市的户籍壁垒终将被打破。


