    # 需求数量峰值是房价上涨拐点吗？


    国务院发展研究中心副主任刘世锦 2014 年 7 月 19 日表示，房地产是今明两年最突出的不确定因素。他预计，房地产需求高峰期已经出现，几年以后房地产投资要增长
    5%难度相当大，“这次是一个历史性的拐点”，他说，“我们两三年前已经算过这个账，构成中国房地产 70%以上住宅的需求峰值是 1200-1300 万套住房，这个峰值预计在今年是能够达到的，达到以后基本就是走半程逐步回调。”刘世锦分析说，中国的高增长主要靠高投资带动，高投资中主要三块，基础设施占
    20-25%，房地产占 25%，制造业投资占 30%以上，中国基础设施投资高峰期出现在 2000 年左右，最近几年实际比重在逐步降低，出口也经下来了，“房地产的‘靴子’如果落地，中国经济中高速增长的底基本上也就找到了。那么，第三只“靴子”的落地还需要多长时间呢？刘世锦估计也就是一'
  merge: -1
  img_proc: true
- pgno: 232
  md: '两年的时间。


    我赞成刘先生这个观点： “但（房地产）这只 “靴子” 落得不能太急，要争取软着陆。因为很多地方政府这些年就是靠土地或者卖地的收入去银行贷款， 如果房地产下得太快，
    一系列的风险包括银行的风险、地方政府财政的风险都会爆发。” 但不赞成他的另一个观点： “我们的研究不支持房价长期地增长，我几年前 一直是这么一个观点。 ”
    中国房地产城乡遍地开花的需求量需求峰值也许的确已经出现， 但未必是投资总额增长的拐点，更不等于房价止跌的拐点。


    首先，导致房价上涨的重要因素——货币增发机制并没有丝毫改变，2014 年 6 月份新增人民币贷款达到 1.08 万亿元，同比多增 2156 亿元，也远超 5
    月份 的 8708 亿元规模。M2 则同比增长 14.7%，也远高于央行设定的 13%增速目标。 这意味着 6 月货币宽松程度远超预期，信贷增速偏快，宽货币、宽信贷政策的刺激
    在增强。这一切也应验了我年初的判断：要想保持 7.5%的经济增长，实际 M2 增量 当在 15%以上。除严重空城鬼城之外的房屋资产价格自然将随货币增长而水涨船高。


    其次，过去多年，特别是 1997 年政府土地储备制度实施以来，政府主导的 城市化的确制造了数不胜数的空城和鬼城，而旅游地产、养老地产、商铺门面房 等则从乡镇一直过剩到一线大都市。但是，住宅地产的情形却有很大不同，尤其是
    在大迁徙大流动时代，先富和中产阶层一家人在大中城市乃至乡村各拥有一套以上 住房司空见惯，几乎全是 “刚需”。另外，住房地产产能过剩和基础设施建设、工业 产能过剩有一个根本不同，就是住房不能移动，其过剩的产能只是区域性、结构性
    过剩，并非全国性过剩。随着 “人聚财聚，人散财散” 潮流涌动，中小城市和乡镇 供应过剩，大城市供应则依旧短缺。而大都市房价比中小城市和乡镇高得多，足 以支撑更高的投资率。


    中国目前只有 36%左右的真实城市化率，未来二十年左右，将会有绝大多数 人口进入大中城市，这些人的住房需求依旧旺盛。刘世锦以呼和浩特和 10 多年前 曾经在海南三亚看到过的房地产泡沫为典型观察窗口，正是看到了一些中小城市
    地产和旅游地产过剩，却没有看到大城市依旧短缺的情形。而在做房地产这个 “小 判断” 的时候，一定要用对城市化的大判断和全局视野，方能机械和要领。如果认 为城市化就是像今天这样政府主导遍地造城、人们集中在住房，主要由政府主导
    的工业产业带动就业，那么房地产业真的是已经差不多全面过剩；但如果相信城市化 的根本规律还是人口大规横高密度聚集、主要由市场自发的服务业支持就业，那么， 中国的城市化和房地产无疑只能用
    “方兴未艾”来形容。至于城市化为什么会以大城 市化为主流方向，则需要更多的理论和数据支持，一篇短文难尽只能说结论，在这方 面，我有 2011 年出版的《世纪大迁徙——决定中国命运的大城市化》和刚刚上市
    的《中国城市的死与生——走出费孝通陷阱》两本书证明我的结论。


