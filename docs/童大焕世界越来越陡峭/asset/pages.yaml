    # 中国楼市调控两大新方向


    中国房地产重新进入一个微妙时刻，2014 年是当之无愧的房地产“市场化元年”，它标志着市场的力量开始顽强地成为房地产领域的主导性决定性力量。不管是政府、开发商还是投资者个人，不听从市场召唤、不仔细倾听和服从城市化规律的声音，随时都有可能被摧枯拉朽的市场浪潮卷走最后一层底裤。


    从这个视角来看全国 46 座限购城市如今只剩北、上、广、深和珠海、三亚未取消，也是不符合市场规律的东西最终必须回到市场的一个必然。接下来，这最后几座城市取消限购，以及全国范围内限贷放松也是一个必然现象。这既是市场经济由市场配置资源的必然要求，也是当下经济和金融危机四伏背景下的必然要求。


    接下来的楼市会怎么样？我的判断是：从不符合市场规律和城市化发展方向的限购限贷，向尊重市场和城市化规律的鼓励投资转变，是必然的总方向。不一定大会张旗鼓地公开宣扬鼓励投资，但具体做法一定会是这样。人们千万不要妖魔化甚至敌视投资。大家不妨心平气和地想一想，如果没有楼市投资，那些根本没有开发商和政府赚他一分钱的农民，有没有能力像
    2000 年中后期至今一样，在广大农村遍地建新房？而限购限贷并没有根本上伤及拥有大笔资金的投资，却严重伤害了国内经济本身。不符合市场配置资源要求的限购限贷，过去几年制造了巨大的笑话和危机，它导致资金迅速向不限购的二三线城市集中，助长了中小城市楼市泡沫和过度供应的鬼城风险，使一些不该热销的边缘产品得到热销，同时使一些本来和普通消费者毫无关系的高端产品遭遇滞销，企业陷入危机。而限购限贷带来的房屋降价，很快被银行利率上浮和首付提高所抵消，刚需房没有钓到任何好处。有人算过一笔账，同样
    80 平米房子，1.4 万元单价和 1.2 万元单价，30 年按揭，前者在限购限贷前优惠利率 7 折，后者利率上浮 10%，后者总支出反而多出 15 万元。与此同时，大量投资者向海外转移，近几年国内转向海外的房地产投资资金大幅度攀升，减少了国内的就业和发财机会。


    真正能够拥有大智慧、大定力的人真正具备人类大情怀。急功近利鼠目寸光的妇人子仁常常事与愿违，以高尚的名义毁坏人类许多美好的构建和长远的福利。


    为什么房地产要回到市场经济并且回到鼓励投资？因为在长达十数年房地产补贴招商引资的大背景下，我们已经面临全方位产能过剩的危机。前中国工商银行行长杨凯生的文章也指出了这一点。他说，产能过剩的范围已从过去常说的钢铁、水泥、电解铝、平板玻璃、造船等行业扩展到许多所谓的新兴产业了，目前几乎找不到几个不过剩的行业了。另，我国经济增长对银行贷款是过度依赖的，企业从银行的融资是过度的。


    此情此景下，我们可以忍受 GDP 下降，但也无法忍受经济全面衰退尤其是房地产危机带来的民间金融和银行金融的风险。于是乎，我们又到了“只有房地产才能救中国”的历史时刻。房地产供应在不少地方尤其是三四线城市鬼城、高'
  merge: -1
