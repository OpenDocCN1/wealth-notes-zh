  md: '这样的人不断优化、配置资源以求充分利用金融杠杆做大做强资产的进程，给我们带来了巨大的现实损失。但是从理智上，我亦清醒地知道，一线城市短期内很放开限购，不管限购政策多么不得人心、多么侵犯人权、多么妨碍市场自由、多么地与十八届三中全会提出的“市场在配置资源中起决定性作用”的承诺相背离，短期内要放开，都是一个不可能的任务。至于短期内不会放开限购的理由，市场上也是见仁见智，各有各的说法。


    刘晓博在《京沪取消楼市限购，后果将不堪设想》一文中认为，如果一线城市全面放开限购，特别是北京上海放开限购，很可能会带动全国楼市再“疯狂一把”，加速全国楼市见顶、泡沫破裂的节奏，最终引导着全国楼市重演“亚洲金融危机”时香港楼市的那一幕。所以，如果经济不出现重大困难，国家不可能取消“一线城市”尤其是北京、上海楼市的限购，只能能针对市场状况进行一些微调。


    我分析的原因与他正相反！正是因为当初国内主要一二线城市的限购限贷政策导致资金加速向三四线及其以下城市回流，推高了中小城镇房价的同时也大大加快了这些地方供应过剩的步伐，导致今天中小城市由于面临房屋过剩和人口流失，普遍地市场状况非常不好；在这个背景下，房地产中的投资性需求，越来越向少数中心城市集中。而房地产业百分之五六十的资金，又直接间接成为银行贷款。因此，如果放开四大一线城市限购限贷，会迅速推高一线城市房价，但并不可能再带动全国楼市“疯狂一把”，反而会会把全国范围内的投资投机性资金（只有它们是最敏感最具折腾性的）迅速集中到一线城市，使原本嘛哦贷摊的中小城市资金更加短缺，雪上加霜，进而引发楼市和金融崩盘！而中小城市的楼市危机，也会发生连锁反应，反过来导致一线城市的楼市信心危机，引发一线城市房价非理性下跌。后者的情形，和刚刚过去的
    2014 年几乎一模一样。


    如果一线城市放开限购限贷能够带来全国普遍的房价上涨，那是决策层和银行再高兴不过的事情。现在他们正在为楼市一蹶不振发愁呢！但现实不会如此所愿。


    因此，一线城市限购不是要不要放开、想不想放开的问题，而是敢不敢放开的问题。一旦放开，崩盘后果不堪设想。这是从决策层到银行到普通储户都无法承受之重。理想主义者常常从理念和理想出发，想总不顾一切达到目标。但现实主义者一定要充分考虑各方面面的现实约束条件，充分考虑各种后果。


    这就叫做骑虎难下！神容易送神难。当初限购限贷政策不受法律和专业知识的约束，不管不顾贸然出台，结果就像三峡大坝一样，蓄水高达 175 米，贸然炸掉，会有多少生灵涂炭啊！所以，限购政策是有病，但病来如山倒，病去如抽丝。


    一个驼背病人，不可能两个夹板一夹就让他直起来，那是要死人的。一棵歪脖子树，硬把它拉直，它只有断成两截一途。


    还有一种观点认为，限购政策和户籍、孩子入学政策收紧一样是为了控制大城市人口。也不准确。当初限购限贷政策的出发点，就是为了控制房价。今天和今后，限购限贷政策也起不到任何控制人口的作用。它能控制的只是外部纯投资资金进入一线城市。从控制人口的角度，放任投资性资金进入一线城市，迅速推高房价，反而有可能在一定程度上通过高房价“驱赶”一部分中产或白领。至于更低一些层次的外来劳动者，他们进入一线城市主要寻找的是工作的机会，购房并不在他们的目标之列，他们平时主要也只是租住城中村和城乡结合部，赚了钱以后回家农村打盖房或家乡县城买房，限购不限购与他们无关。


    作于 2015 年 3 月 8 日


    2015 年 3 月 10 日发表于香港东网'
