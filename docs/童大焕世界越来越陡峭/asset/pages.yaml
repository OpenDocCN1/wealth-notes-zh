  md: '2014 年 12 月 29 日，深圳汽车限购从 18 时起实施，有效期暂定 5 年。深圳成为北京、上海、天津、广州、杭州、贵阳之后第 7 个汽车限购城市，每年指标
    10 万个：针对电动小汽车的指标数 2 万个，采取摇号方法；针对普通小汽车的指标 8 万个，50% 采取竞价，会根据当地汽车市场需求等去适度调整。


    限购消息一出，舆论哗然。深圳此番汽车限购，问题不仅在汽车限购本身，而在此前一再表示不会限购；而在说谎与突袭之间，不乏可能有巨大的腐败空间——提前走漏的消息，可能给一些人围车围牌的机会。至于将来限购过程中的腐败，北京交管局长宋建国腐败案已是前车之鉴。我在微博上提了一个问题："杭州天津等地在汽车限购之前民众得到消息引起抢购骚乱，深圳这次突然袭击也有情有可原之处。但各地方政府为什么总要采取这种为腐败留下巨大空间、而且效果不佳的汽车限购措施，令人不解。经济学理论和实践经验都表明，只有拥堵费才能最终解决拥堵问题，为什么不采用？"


    得到的回答五花八门，最典型的是两种：“限购可以寻租，而且是‘立竿见影’的政绩。而限制公车、提高使用成本（他们多数是有车族）是他们不愿意用的有效手段！”“用钱解决了问题，权力干嘛？让钱来解决问题，权力就不值钱
    了。”


    网友的回答，可能有激愤情绪，但一个耐鄙的真理是：只要管制，就一定会有腐败；只要诱惑达到一定程度，人就不一定难以抵制。


    现行城市汽车管理办法中的汽车限购和尾号限行有很多后遗症，不可能从根本上解决城市交通拥堵的汽车尾气污染问题：客观上增加汽车需求和持有；侵犯后来者权益；制造腐败机会；伴随着对外地车辆的限制，破坏全国统一大市场；边际效用逐年逐月递减，腐败成本却逐年逐月提高。网络上有人放数中国与世界潮流背道而驰的荒唐事，有“大航海时代禁海，大贸易时代禁贸，大数据时代禁网（虹
    儿）”，其实还应该加一句：大交通时代限购。


    深圳是中国改革开放的前沿阵地，市场化程度在全国即使不是最高也是最高之 一，此前深圳有关部门和领导也一再强调不学北上广搞什么汽车限购，而要用市场 手段解决交通拥堵和汽车尾气污染问题。为什么此番要冒着“对公众撒谎”的指责
