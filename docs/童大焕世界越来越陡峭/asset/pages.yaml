    # 城市到底可以有多高有多密


    在《中国城市化与世界之异同》一文中，笔者认为，在工业过剩、高端服务业和互联网大发展的时代背景下，中国迟到的城市化进程自然不会走与西方国家完全一样的道路。尤其是作为城市化第三阶段的逆城市化阶段、即城市中心衰败现象将不再出现在中国（除非拆迁成本过高导致局部暂时性衰落）。这么多年来'
