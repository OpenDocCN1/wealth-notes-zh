  md: '出现了中心城区人口净减少现象，但这种减少，却没有从总量上减少该城市人口，而只是有大量人口被迫疏散到了更远的郊区，使城市发展更加呈现出撒环保、不经济、低效率的平面扩展特征。例如唐家折迁，只是让这些“蚁族”搬迁到了更远的郊区，但他们的工作还是在城里，每天回到城里来上班，只不过距离更远、时间更长了。这样做不但没有将人口疏散走，反而加重了交通系统的负担和环境污染。


    随着中心城区人口密度的减少、自居程度上升，房价大幅度上升的同时，一种产业向郊区转移的逆向交通形式将会产生，就是一些中产和富裕阶层人士，居住在内城，但是他们办的企业或他们上班的地方却在城外。如果大部分产业都转移到主城外，当然可以有效缓解主城区的交通拥堵和污染，这也符合当下政府当局推的产业和人口转移愿望。但是产业转移本身也面临着巨大的成本和区域税收分割等问题。因此，这种转移并不可能全部做到“老板在城里，公司在城外”进而全面缓解交通堵、环境污染等城市病。况且，社会是一个完整的生态系统，有高端人士高端产业，就一定如影随形地有中低端人群和中低端产业，甚至，哪怕把北京四环以内都变成纯住宅区，只有高端人群在那里居住和消费，也会吸引进无无数的“中低端人群”在城里上班，在城外居住。典型例子是，“在美国，2008年在杂货店里工作的人口是在提供全方位服务的饭店里工作的人口的1.8倍。但在纽约，这一比例完全倒过来不止。在曼哈顿，在饭店里工作的人口是在杂货店里工作的人口的4.7倍；在1998-2008年间，曼哈顿地区的饭店就业人口增长了55%。”（爱德华·格里泽《城市的胜利》）这就像没有国家，人民照样存在；而没有了人民，国家哪能都不是。你说是人民高还是国家高？没有了高端人群，中低端人群照样存活；没有了中低端人群，高端人群一天也高端不起来。你说是“中低端人群”高，还是“高端人群”高？教科书明明告诉我们职业没有高低贵贱之分，现实中又搞三六九等并且强行驱散“微生物”，这又是唱的哪出戏？


    试图用人为力量去强行转移产业和人口，只会加剧城市的平面扩张，却不能改变人口和产业的城市化集聚潮流。城市平面化发展而不是垂直增长将导致城市的运行效率下降，运营成本上升。这方面，一个管理失败的城市样板就是印度孟买。


    “1964年，孟买规定大部分分地区的容积率不得超过1.33（最近有所放松，但变化非常温和）。限制建筑的高度似乎为限制城市的增长提供了一种方式，这与非常流行的英国城市规划理念是一致的。限制高度没有能够阻止城市的增长，它导致的结果是，不断涌入的移民不得不挤在非常狭小的空间里。保持孟买的平面化还导致通勤距离的延长，从而使交通拥堵更加严重。只要孟买对于生活和工作来说仍然是一个非常高效的地方，新的居民就会继续在那里聚集。高度限定只会迫使人们挤在肮脏和非法的贫民窟里，而非住进合法的公寓楼里。据一项研究估计，孟买家庭的平均居住面积只有30平米左右，而中国城市的人均居住面积是140平方尺。人们在孟买被被挤进如此狭小的空间里，因为它的房地产价格超过了远比它更为富裕的城市，比如新加坡。新加坡的房价低于孟买，并不是因为那一座繁华都市的需求不够旺盛，而是因为新加坡允许开发商在它们的土地面积上建造更多的居住空间。”“伟大城市的运转都很顺畅，因为它们的的高度提供了这种可能——大量人口在一块非常狭小的土地上工作，有时还要生活。新加坡中心城区的运转是非常顺畅的，因为它的建筑是高大而且彼此联通的。商务人士在彼此靠近的地方工作，可以非常方便地步行赴约。中国香港甚至更加立体化，人'
