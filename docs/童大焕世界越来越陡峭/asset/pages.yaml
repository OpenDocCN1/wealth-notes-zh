    碍于同一个杨家，其他姓杨的憋着没说什么。可姓黄的姓刘的受不了，这不是你们家的水塘，凭什么你在这里养鱼？于是姓黄的姓刘的纷纷买了鱼竿鱼饵渔网，到水塘里捞鱼去了。杨家人一看，这还了得，明明自家养鱼，却变成了全村人的鱼，有什么好呀？这户杨家人就闹姓黄的姓刘的在水塘边干起架来。其他杨姓人家虽然不满养鱼的这户杨家人，但好歹也是同一本族谱上的人，于是被动或主动卷入了混战，最终演变为全村人的群殴，被头发发的，满脸鲜血的，一瘸一拐的……第二天，水塘里的鱼——无论大的小的、不管青的红的——全部鱼肚朝上，静静漂在水面上：有人往水塘里倒入了大量农药。


    那户养鱼的杨家人哭天喊地绕着村子骂了三天三夜，累得发了五天烧，也没有找到投毒者，这件事情也慢慢成了人们茶余饭后的谈资，不了了之。


    几个月后，水塘恢复了平静，孩子们有事没事又去洗澡游泳了。一个懒洋洋的中午，一声凄厉的哭喊划破整个村庄，接着便是“我可怜的孩子呀”的嚎叫。躺在凉席上睡午觉的人们光着脚子跑出来，看到徐妈妈拖着被淹死的六岁孩子的尸体，哭得不像人样。


    村民邻居们很自觉地帮忙料理后事，一些神神叨叨的老人则负责出谋划策。正当大家以为事情都过去的时候，徐妈妈跑到村支书和姓杨老板的爹妈——杨老板仍然在外面开厂——不堪其扰，后来大家实在没办办法，由姓杨老板出钱，赔偿了徐妈妈一万块钱。


    经过了一连串的事情之后，姓杨老板觉得挖水塘这事儿纯粹是给自己找麻烦，干脆一不做二不休，又出了一份工钱，雇人将那个水塘填平。从此，村民们聊天的时候总有这么一句：“唉，要是那个水塘还在就好了。”


    这个寓言般的故事被拿来作为批评“农村思维”的靶子：“太多了，整天为些鸡毛蒜皮的事，闹得鸡飞狗跳。道德水平低下，全村人都愁穷了。”


    这其实是一个公地悲剧的微观景观，不怪农民道德水平低，只怪产权无边界。因为产权不明，大家都不想为水塘负责，但大家都想从水塘中得到最多的好处。拿来指责“农村思维”，也是作者自身的表现。


    在这个故事中，只要产权明晰，责权利就可以实现对等，养鱼人可能会成为乡村企业家，鱼塘照样可以成为灌溉和游泳的乐园，村民们也许过年有鱼吃，孩子也许不会被淹死，水塘最终命运不是被填平！全村人的道德水平和福利水平，至少会在这件事情上得到提高。


    鉴于水塘是外出乡贤捐赠给全村人的，用的是村民的地，同时由于对灌溉的重要性等诸多复杂原因，它短期内不可能成为私有财产，但是，养鱼人可以通过村民承保的方式、在不影响灌输的前提下获得管理权和使用权。这样，养鱼人不仅可以从水塘获得养鱼收入，而且会加强水塘的维护和管理，孩子们也许就不能再进入其中游泳，或者万一出事也有明确的第一责任人——就是承包人；村民


