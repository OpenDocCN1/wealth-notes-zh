  md: '# 中国最亟需城市战略家


    2015 年 4 月 22 日，在芜湖参观考察的中巴车上，不知怎么和同行的人说起了厉以宁的“就地城镇化”，我说“就地城镇化”狗屁不通。对方说，不能一棍子打死嘛，人家怎么也当过北大光华管理学院院长；再说人家
    85 岁了，调研的范围有限，主要局限于珠三角和长三角地区，因此他的理论需要修正，但不能一棍子打死。


    我心想，我才不管你曾经什么职位现在是不是帝王师呢，也不管你年纪多大，尊老可以，对可以尊重你，但是理论狗屁不通就是狗屁不通！我想，世界那么大，任何人都不能事事亲历为去亲自调研，但全局理性思维是一个合格经济学家的基本学术训练和逻辑思维能力所在。如果连这点能力都没有，至少还该有起码的历史常识。上世纪
    90 年代作为基本国策的乡镇企业和小镇建设，难道不就是“就地城镇化”的表现吗？失败了一回我们还想再来第几回？那个时候厉以宁先生年纪比我大比我成熟吧，我都清楚地记得，厉先生不至于那么健忘吧？绝大多数中国人可以健忘，做学术理论研究的有人认为不可以那么健忘。除非实在是老糊涂了。


    北大教授周其仁这两天有一篇文章《中国需要一批城市事业家》，他说：


    > “先让我们回到常识。城市之所以成其为城市，就是很有限的空间承载大量、多样、复杂也更丰富多彩的经济文化活动。这样看，城市免不了要用密度来定义。至于为什么人口、资源要在空间上凑成一个高密度形态，答案是积聚提升分工水平，而分工水平提升生产率，从而大大提高城里人的收入。


    > “回来后再查对我们这里的城市密度，比起美国纽约曼哈顿甚至整个纽约城，发现还差很远。如果作为城市之核的市区，密度过低，城市集聚的能量不足，就断然难以通过发挥辐射作用引领国民经济增长。”


    > “城市化下程非转不可，比较现实的选项，是在已撑开的城市骨架范畴之内，将城市投资和建设的重点转向集聚和合理的密度提升。譬如各地修建了不少大剧院，要问一问有没有演出，有多高频率的演出，以及什么品味的演出？”


    > “巴塞罗那不过 200 万人口，却拥有享誉国际的加泰罗尼亚国立歌剧院，是一百几十年前修的，有 1000 个座位，迄今为止每年演出 300 多场。纽约百老汇和伦敦西区音乐剧，更是让这两个全球级城市具有持魅力之不可调和要素。


    > “对比之下，近年我国建成的大型歌剧院不少，设施的硬件条件可到世界上任何地方去搭台，挑战是节目组织得怎么样。好苗头当然也有，像天津大剧院音乐厅，慧眼识英雄，把北大医院的一位毕业生先送去领衔打理，两年半时间办成
    800 场演出，俨然已成一中国的一座音乐重镇。这说明，城市发育的设施硬件等‘骨架’一旦撑开之后，关键就转到有没有一批‘城市事业家’能组织积极活跃的城市生活。”


    文章说：上一程我国的城镇化，似乎比的是谁家征地多，谁家新区远、马路宽，谁家的建筑高端大气上档次。现在到了换赛季，要比一比赛本领，赛一赛哪个城市、哪一个街区、哪一个建筑群的人气更旺，活性化程度更高，经济文化活动的品质更好，让普通市民生活更便利、事业更活跃。


    周其仁先生是在朝野都有影响力的经济学家里，对城市化方向有着较为清醒认识的风毛麟角几个人之一。我赞成同周其仁先生关于需要城市事业家、以及“在已撑开的城市骨架范畴之内，将城市投资和建设的重点转向集聚和合理的密度提升”的观点。甚至，我们还应该更加“激进”一些，将原有在城市扩张大跃进意'
