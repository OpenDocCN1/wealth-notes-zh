  md: '请假看房，一些“看多”后市的开发商也蠢蠢欲动以涨价来回应投资需求。2014年3月27日《第一财经日报》：我远在新加坡的一位朋友也发来微信问“保定的房可买吗？我想买。”我只回答了她在三个宇：“不可以！”。


    环首都经济圈说了十多年哪个做起来了？谁都想承接北京的某些功能最好把自己变成首都呢你保定乃至河北优势何在？部属大学和科研机构搬过去，也许不是保定兴奋的开端反而是这些科研机构和部分大学衰落的肇始。因为优秀人人才会纷纷辞职，凭什么由你单位来绑架我？和保定相比，北京昌平和河北廊坊离北京市中心近得多，“风水”也好，但它们的高校园、大学城如何呢？大家都不愿意去！这就是市场力量！除非用行政强制力量把中央和北京的一些政治机构实质性搬出去，否则“政治副中心”更是彻头彻尾的伪概念。像北戴河和承德避暑山庄这样临时办公的“陪都”可以，军事要塞则是驻军所在地，皇粮供养，几乎没有百姓房产市场什么事。


    保定距北京140公里，天津145公里，石家庄125公里。按现有北京五环内平均4公里半径一环，保定都在北京35环外了，在天津36环外！保定能把北京变成它的35环吗？保定到北京最快是高铁，40分钟，最低票价单程63.5元；最便宜北京站到北京票点票约2个小时，硬座票价23.5元。又贵又慢的是公路及高速，过路费50元左右，约2小时。这样的时间成本和经济成本，不含市内交通时间，不含私车汽油费，多少上班族可以承受？


