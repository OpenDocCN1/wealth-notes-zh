    # 像经营企业一样经营房子


    今天是中国农历乙未羊年正月初一，我像一只勤奋的工蜂，送给读者朋友们一个甜蜜的祝福。祝愿从新的一年开始，越来越多的人们有一个崭新的观念：像经营企业一样经营房子，借着现代金融按揭制度的翅膀，不仅及时追赶通胀的步伐，而且尽快实现自己的财务独立和自由。


    像经营企业一样经营房子，第一步是要把攒钱买房当成人生起步的目标之一。按揭买房的同时是在养成一个良好的习惯：从赚钱拿工资开始，我们就把一份收入分成 5 份：一份孝敬父母，一份养活自己，一份养育儿女，一份按揭供房以备未来，还有一份用于自己不断地充电学习。中国还是个农业社会的时候，家家户户养猪就是农民攒钱以备大用或急需的方式，当中国正式进入城市社会以后，按揭供房就成为替代养猪的攒钱方式。


    观念上，要把按揭买房当成企业一样来经营，而不是非得买一个房子自己住。企业的第一理念是满足市场需求，用企业经营理念买房，一是我们买的房子是别人也愿意买愿意租的，要沿着城市化的方向购房人口流入地区的房子，而不是沿着衣锦还乡的方向逆城市化而行；二是有多大的能力做多大的事，就像企业慢慢做大做强一样，房子也是慢慢地从买到买到、从相对便宜到相对贵；三是买房和住房分开，买房要买自己能力范围内最有投资价值的房子，住房则要租离自己最近、生活工作最舒适最方便的房子。如此不断实现财富增长。


    像经营企业一样经营房子，在任何时候都要有一个清晰的理念：可以向银行按揭和抵押贷款的房子，不论大小，都是可以作为必要时候的“提款机”来使用的。当我们在年轻的时候，以日积月累之功按揭着一套房子，积少成多，聚沙成塔，遇到孩子需要留学、老人需要治病的时候，万一那时一次性拿不出大额甚至巨额现金，房子抵押贷款将是最好的融资方式，既不欠人情，也可以把短期急需


