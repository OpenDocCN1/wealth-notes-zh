  md: '节回家住十多天。现在他们一家都在广州城中村租屋。这是想起来就让他后悔莫及的事情。看来买房不纯是许多城市居民之痛，也是数以亿计的流动就业人员之痛。”


    我说：“这些情况遍地都是。多数人劝也不听只有事后后悔。”


    当代中国城市化的病和痛，三分之二原因在人们的落后观念里，三分之一原因在不合理的政策里。甚至也可以说，不合理的制度和政策，根源也是落后的观念所致，跟利益争夺没有多大的关系。当下中国有6千多万留守儿童、3千多万流动儿童、数千万留守老人，城市化伴随着无数的妻离子散。原因？自然有相当一部分是由于城市、尤其是北上广深这样的大城市排斥外来人口子女在流入地就地上学和就地高考，导致很多孩子被迫与父母分离，留在户籍所在地上学和高考，而他们的爷爷奶奶则成为留守老人，以老迈之身照顾孙辈的生活起居。


    大量留守儿童、留守老人、留守妇女的存在，全部归罪于政策原因是不公平的，部分原因还应该归结于当事人自己，归结于中国传统的、极端落后的衣锦还乡、叶落归根等观念，导致绝大多数进城打工的人们，赚了钱不是用来租更宽敞一点的房子，不是用来在城市购房居住，而是大部分钱寄回家乡，盖新房、起高楼，在城市则只住得起小得不能再小、破得不能再破的房子，无法接纳老人和孩子在城市一起生活！


    像本文开头说的例子，很多进城打工和经商者，其实在城乡结合部多是买得起房的，但是绝大多数人观念落后，把钱投回家乡，盖起了有天有地有山有水的乡村别墅式高楼，而且互相攀比，比盖盖的更高。结果，一边是平均每天消失300座村庄，一边是乡村集镇大建鬼村、建那些一年住不上十天半月的豪华住宅，一边是他们在打工的城市居住条件恶劣，恶劣窄小到容不下老人和儿童！


    1998年中国城市住房私有化以来，到2014年作为一个转折点（其实理念根本还没有转过来，只不过是现实逼迫一部分投资者在亏本面前被迫转向），短短16年时间，中国大地上制造了人类历史上从未有过的、如此大规模的鬼城和鬼村，这些鬼城和鬼村，将作为一个个特殊符号，以未来几十年不倒的顽强姿态，彰显当代中国人的愚昧无知和顽固不化，见证着中国人的健忘并且缺乏反省能力，见证着他们物质富裕并且精神贫货的现实！


    尤其不可思议的是，即使今天已经制造了无数的空城鬼城、空村鬼村，但稍微富起来的绝大多数中国人，有了钱还是首先想到回家盖房！很多人拦都拦不住，别人的经验教训一点都不吸取，非得要自己亲身经历一番失败才善罢甘休！只不过，多数人会计像本文开头的那位空调安装工人——如果你缺乏对未来思考与预见的思魅力、学习力或者接受不同意见的能力，那么对不起，世上永远没有后悔药可吃。面向未来，才有未来的富裕与幸福；面向过去，你就只会回到过去的贫穷与落后。


    一个不可思议的中国，一群不可思议的中国人！


