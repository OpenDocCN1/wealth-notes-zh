    # 居住环境是孩子最直接的教育环境


    有人让我说说绿色建筑保障房。我是第一次听说，一查才知道原来是住建部要在保障房领域推广绿色建筑标准。绿色建筑面积含厨*垃圾家庭化处理我认为是必需的，尤其是厨*垃圾家庭处理，也许是解决垃圾围城难以回避的问题。但对保障房我持老态度：除了棚户区改造之外，我不建议大家去买居住保障房，那是导致贫穷固化的一个陷阱。想想孟母三迁吧。


    多年来我一再建议大家不要去追逐保障房，张五常也有同样的观察并持类似观点。有人说，谁愿意自甘堕落住贫民窟？我说，贪小便宜吃大亏的，在我们这个国度海了去了。请大家务必记住：居住环境是孩子最直接的教育环境！


    有人说我劝人别买保障房是“何不食肉糜”，有人说除非抢银行。其实我*人出身，不至于那么不接地气。据我观察，至少三分之二以上保障房申请者买得起地段好得多的商品房，关键在于欲望和贪婪心管理：想一步到位买大房子是不是？觉得有便宜不占白不占是不是？我曾亲手把等保障房的人拉回市场，买的商品房两年净赚百万元！


    这其实是一个算大账还是算小账的问题。有人说，穷人有有时候就穷在只会算小账上，越算越小器，越小器越穷。这话言过耳但绝对有道理，日常生活用品、耐用消费品也一样道理。有人贪便宜买很差的东西，很快就坏了，被迫很快又添置新的。总费用未必更少也许反更多。居住环境的选择上，大账更算不清楚甚至很多人根本看不见。


