    # 农民有了产权就会卖地卖房？


    不论是社科院四年前的调查，还是人口流出大省四川省今年（2014）的调查，都发现一个问题：由于担心在城市入户以后农村的土地和房屋权利得不到保障，九成进城农民哪怕其中一半已经举家安居城市，甚至已经近半在城镇买房，也不愿意把户口转入城市。


    农村的土地和房产脱集体入家庭，全部家庭独立支配，享有独立产权，自由流动，显然有利于农民更快更好地进城，有利于他们把农村户籍变成城市户籍。但是很多人和决策者又有一个担心，就是担心土地集中，万一农民在城市待不下去了怎么办？农村他回不去了，国家的失业救济和劳动与养老保障又跟不上，他们会不会成为导致社会不稳定的城市流民？忧心忡忡之下，总想有计划地来，以时间换空间，完成全面的覆盖城乡的保障体系建设再考虑土地、农与养老产权化问题。


    但是计划总是赶上不变化。我们一定要摆脱对计划的致命的自负，用计划的方式指令经济不会取得最终的成功，用计划的方式指令人口生育与人口流动，也'
  merge: -1
  img_proc: true
- pgno: 70
  md: '不会取得最后的成功。现在的情况是什么？是农民进城安居了也不要城市户口，是一些城市白领为了多生孩子少罚款，宁可不耍大城市户口而迁回老家！他们在农村既没有土地没有房屋，为什么还要迁回乡下？因为我们现在计划生育政策，农村和城市是两个政策，农村可以生二胎，超生罚款也是按户籍所在地收入水准来罚。如今的二胎超生，如果你是北京城市户口，至少也得罚得一辆低配奥迪的钱，但是在乡下农村，可能一两万元就搞定。虽然孩子户口在乡下可能未来在城市尤其是大城市遭遇上学难高考难，但一方面，未来的事情未来再说，不人性、不合理的政策总要改变而且一直在改变；另一方面，几十万元的罚款从孩子一岁开始，如果拿去合适的地方投资房产，利用银行杠杆，等孩子上高中15岁的时候，可能已经变成几百万了，足够孩子上国际学校、将来上世界上任何一所好大学（只要TA考得上）。这个账，老百姓自己会算。


    这里面有三个问题要仔细理清：


    第一个问题是，把土地、农房由集体所有制变成家庭所有制，农民就会迫不及待地土地、房屋卖掉吗？答案是否定的。这里面有经济因素的考虑，也有文化观念的原因。很多人即使在城市过得很好，在城市买房安家立业，也不一定会急于把农村的土地和房产卖掉。那是情感的寄托，也是万一发生变故的念想。


    第二个问题是，如果遇到城市经济危机，进城农民在城市待不下去了，农村是他们最好的归宿吗？答案也是否定的。其实即使在最困难的时候，城里的办法也更多一些，每个人匀出半两米，城市人多，就能养活很多人。“三年自然灾害”的时候，就是因为不许人口流动，导致饿死那么多入。


    第三个问题是，“流民”在城里遇到经济危机，就会成为社会不稳定因素吗？从世界各地贫民窟即“落脚城市”的发展状况来看，并没有这样的证据可以证明他们会成为社会不稳定因素。相反，是城市对他们的驱赶拆散，反而有可能使他们流离失所进而成为不稳定因素——不管他们在乡下有没有土地。而历史上所谓“农民起义”、“流民”，多数也并不是农民起来，而是小商人、小官吏、小知识分子起来，农民被挟持被裹胁的多。


    农民都不在乎城市户口了，你还用户口管他，管得住么？只不过是他 的孩子在城市上学难一点而已，老家总还是可以上学的。


    农民很在乎他在家乡的土地和农房，集体所有没有独立产权时他在乎，非集体所有大家各自拥有独立产权时会变得更不在乎会轻易卖掉土地房屋？想必也是想当然了。在土地、农房产权独立背景下，很多已经在城市买房定居、安居乐业、户口也已经迁到城市、社会保障也不缺的农民，未必也愿意很快就卖掉农村的土地和房屋，一来这是祖产祖业，感情上难以割舍，文化上愧对乡邻；二来也未必卖得出多少钱，那点火对他们无关痛痒。


    在土地、农房产权独立背景下，倒是有两类农民可能会比较倾向于直接卖掉农村的土地和房屋：一类是要在城市创业或者买房急于用钱的。对于这类人来说，卖地卖房是给他们晋升之阶啊！虽然日后也有可能遭遇不测，但任何人都可能遭遇不测。第二类是混得很惨急于用土地、农房变现了还债的。人们最担心这类人把土地、农房卖了以后怎么办？事实上，他们卖了土地或农房，或者两者都卖，正是有一个缓冲给他们啊。如果像现在这样集体所有，他们又不能缓冲又从土地、农房中得不到多少收益，那才是更要人命的东西呢！


    所以，只要在别人思维止步的地方多想一想一点点，就会发现很多事情远远不是我们想象的那么回事。在土地、农房问题上，并非一实现独立产权化，农民就迫不及待地把土地、房屋卖个精光，土地就来了个大集中，都流到资本或农业大户'
