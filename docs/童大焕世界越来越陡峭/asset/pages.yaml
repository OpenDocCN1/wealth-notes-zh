    +   1 高密度大城市化救中国！


    无论自然还是社会环境改善，不论乡村自然化还是城市宜居化，都有赖于人口更高密度的聚集。城市大楼越高，人口密度越大，效率越高，使用越节约越环保（电梯战胜汽车），向上的空间拓展代替平面占地。人大部分进入服务业，工业农业污染大减。


