  md: '全。据测算，根据地方产业结构的不同和测试季节的不同，汽车尾气污染在冬季大约占总空气污染 的 20%以上，而在蓝天白云的海南，汽车尾气贡献了空气总污染的
    70%左右，而城市中的 PM2.5 一般一半都是由汽车贡献的。


    二是交通拥堵已经成为城市驱之不散的噩梦。在北京，汽车行驶速度大约 15 公里每小时，和 100 年前坐马车、30 年前骑自行车没有任何区别。据瑞典最新研究结果，夫妻中有一方每天上班路上耗材超过
    45 分钟，离婚率增加 40%。该研究结果的依据是：上班路远、道路拥堵、公共交通工具拥挤以及等候时间不可预测等，会让人心情变差，甚至影响健康，破坏家庭和谐。


    三是汽车虽然扩大了城市半径，并因此降低中心城市房价，但道路过多地占用了中心城市 的空间，无形中减少了城市中心的房屋供应，在使城市中心宜居程度下降的同时，对房价的作用却相互抵销。


    鉴于这么多的负外部性以及城市雾霾、交通拥堵、道路扩张给城市管理者带来的巨大财政和管理压力，越来越多的城市对汽车采取限购或限制使用的措施，政府和民众一齐向汽车宣战，不仅是一种必需，而且是一种必然。根据发达国家经验，一旦交通堵塞变得严重时，政府会引入相关政策来抑制汽车消费，如新加坡和伦敦采取征收交通拥堵费，香港采取收取高额停车费、汽车购买税以及高额油费等措施。中国目前已有北京、贵阳、上海和广州四个城市实施了汽车限购政策，限购方式各不相同，天津也准备马上加入。数据显示，在出台了限购政策后，这些城市的新车销售量锐减了
    30-50%。


    虽然中国的汽车税费几乎是全世界最高的，但地方政府获得的收益大部分来自汽车生产企业。虽然消费者购车后主要在所在城市使用，但其上缴的消费税、车辆购置税、成品油消费税统统都属于国税，归中央财政支配，而道路建设、停车场建设、环境污染治理等则需要由地方政府来解决。因此快速增长的汽车消费对中央政府来说是庞大的税收收入，而对地方政府则是巨大的财政窟窿。在交通拥堵和环境污染的双重压力下，预计将有更多的城市实施限制汽车购买的政
    策， 特别是车牌额度拍卖制度的采用。


    但这又难免与现行中国汽车占有率低形成矛盾，同时对民众的用车自由权构成损害。抽签制度对民众自由权损害尤甚。因为抽得抽不到是自由有自由而无自由，但卖车牌以及汽车使用费用的提高则是为自由必须付出的价码问题，也就是说自由多
    和少的问题。各级政府应该找到既不损害汽车工业、又不损害民众自由的汽车管理办法，最佳办法自然是不限制购买但通过经济手段限制使用，比如征收高额拥堵费、高额中心城市停车费和在汽车中增加排污税等等。


    交通拥堵、汽车尾气污染是每个人都只考虑自己的个体理性导致群体 不理性的必然结果和代价。每个人都必须为此买单。与其都堵在路上都没有节约时间， 并且徒增空气污染，不如退一步海阔天空，让一部分人通过付出巨额经济成本之后，让道路畅通起来，让世人重现天日。


    作于 2013 年 12 月 8 日星期日


    # 离开全局理性 汽车将让我们同归于尽


    2013 年底，我国汽车保有量达 1.37 亿辆，正好平均每 10 个中国人一辆，其中私家车过亿。总量上已经“超英赶美”，人均拥有量还差着老鼻子远。但就这样一种低人均拥有量，已经把中国内地大中
    小城市都变成了一座座停车场。再这'
  merge: -1
  img_proc: true
- pgno: 143
  md: '样无节制动拥右和使用小汽车，第一步把城市乡村变成停车场，第二步把城市变成癌症高发地（北京的汽车尾气已占高浓度致癌物 PM2.5 总量的 36%），第三步直接将城市道路变成生命杀手（严重交通拥堵和混乱的交通秩序将严重耽误分秒必争的事故抢救和病人救治）。


    一提起应该大幅度提高车辆进城的使用成本，通常会招来有车一族的怒骂，他们觉得自己纳了税、花了汽油费，一切都理所应当。但人们没有认真想过，城市道路的免费使用给社会增加了许许多多的负外部性，使人与人之间陷入了一个“一个人是另一个人的陷阱”的恶性循环。这样的负外部性至少包括：拥堵、噪声和尾气污染、道路扩张减少了城市房屋建设用地稀释了城市的“聚集效应”等等。越到后来，我们越陷入“每个人都是受害者，每个人又都是施害者”的“互不让步、自食其果”的死胡同！即使不论噪声、尾气污染以及拥堵造成的健康和生命等损失，就是时间损失本身也是生命不可承受之重。城市化的基本功能就是通过人口集聚降低时间成本，而拥堵则大大增加了时间成本。每个人的生命都不过是一个个时间单元而已，我们都是时间的过客，时间的无端损耗与浪费，就是生命的无端损耗与浪费。


    我相信，人类的智慧与远见当然不应该、也不至于让自私自利的“个体理性”汇聚起来变成同归于尽的集体非理性。任何理性的行动都必须建立在掌握全局的基础上，完全从一己之利出发就不是真正的理性。如何科学、理性、公平地拥有和使用汽车，需要借助经济学家和决策的力量。哈佛大学经济学教授爱德华·格莱泽《城市的胜利》告诉我们：


    > “数十年来，我们一直试图通过修建更多道路的方式来解决道路太少、汽车太多的问题。但是，每一条新修建的道路或桥梁在投入使用之后都会吸引来更多的交通流量。经济学家吉勒·杜兰顿和乌休·纳特们已经发现，随着新建公路的增加，汽车的行驶里程基本上会呈现出一对一的增长。他们将这种现象称为道路拥堵的基本法则。”


    “减少交通拥堵的最好方法是由一位曾经获得过诺贝尔奖、出生在加拿大的经济学家威廉·维克瑞提出的。在 20 世纪 50 年代末，维克瑞在一份关于华盛顿公交系统的报告中第一次赞同对驾车者造成的交通拥堵进行收费。他还建议，当交通拥堵更加严重的时候，提高高峰时段的收费。数十年来的经验证明，维克瑞是正确的。修建更多的公路几乎从未能有效地减少交通延误，但征收拥堵费做到了。1975
    年，新加坡采取了一种简单的征收交通拥堵费的方式——就中心城区的驾车行为向驾车者收费。现在，这一系统实现了电子化和精密化，并使这座城市消灭了交通拥堵。2003
    年，伦敦开始征收拥堵费，也导致了交通流量的大幅度下降。”


    “既然如此，为什么美国很少征收交通拥堵费呢？因为政治学战胜了经济学。对成千万的驾车者新增一项收费是不受欢迎的。在美国，交通拥堵浪费了价值数十亿美元的时间。但是，它在发展中国家的城市造成的后果可能更加严重，因为那里人口更加集中，可供选择的交通方式还有待开发，如地铁。建筑物更加低矮，从而导致了城市范围的向外延伸，再加上人行道常常不完善，使得步行的选择更加不现实。在像孟买这样的城市里，交通拥堵可能会使城市生活的运转陷入停顿。正因如此，消除交通拥堵不仅关系到生活的方便，也确保城市可以实现其最基本的功能——让人们聚集在一起——的战斗。”


    我们用很多经济问题政治化的理由来阻止向小汽车收取拥堵费。比如说要先完善公交。事实上在同等道路条件下，不先解决拥堵问题，再多的公交车也是要'
  merge: -1
  img_proc: true
- pgno: 144
  md: '堵在路上的。再比如说认为公车太多，必须先从公车开始。公车的使用成本都摊给政府，拥堵费当然不会使公车节制使用。但是节制公车和控制私车使用完全是一个同等重要的问题，并不存在谁先谁后的排序问题。


    大幅度增加市内汽车停车费的办法似乎解决不了拥堵问题，因为很多停车费用会被单位停车场所化解。即使是出租写字楼单元的单位，也可以通过减免停车费换取竞争优势。而把私家停车场公共化，由政府统一收费，则牵涉到侵犯公民财产权问题而难以实施。


    燃油税排污税也解决不了城市拥堵问题。诚如刘远举先生说的，道路稀缺性是不能转移的。城市和乡村、城市与城市、市中心与市郊、高峰期与非高峰期公路的稀缺性都不一样。拥堵费不仅必须而且必然，除非我们愿意接受玉石俱焚同归于尽的命运。


    一些城市采取限号出行的办法，最终效果也枉然。一是它反而刺激了购车需求。未来的汽车价格还会越来越低，人们可以通过增加购买低价车作为限号时的代步工具。二是限号出行的比率有限，甚至有可能赶不上车辆增长的速度。


    相辅相成的办法就是限购。但是限购无法解决存量已经超过使用的问题。同时限购制造腐败机会。北京从 2010 年 12 月 24 日起开始对购买小汽车采取摇号方式无偿分配购车指标，这也是国内首次实施以摇号方式分配买车指标。2012年底，便有媒体报道北京市公安局公安交通管理局局长宋建国涉嫌在机动车摇号过程中存在违规行为而被调查，虽然有关部门在第一时间进行了辟谣，但
    2013年 2 月起宋便不再担任局长职务（宋建国 2007 年就开始担任北京市公安局交通管理局任局长）。2014 年 5 月底，据中央纪委监察部网站消息，宋建国涉嫌严重违纪，目前正接受组织调查。


    最关键问题还在于，限购严重侵犯了人类公平。类似于大城市以“资源有限论”为借口，限制外来人口进入。这是对人类基本公平的严重侵犯。正确做法是：不限制汽车购买和拥有，但是对城市中心路权限制使用，办法就是收取进城拥堵费。拥堵费收到多少为合适？收到汽车不再拥堵就是合适的。


    现代电子摄像技术已经非常成熟，对收取汽车进城费基本不费吹灰力，把大量用于无休止加建扩建道路的费用匀一小部分在电子摄像技术就绰绰有余。问题只在于观念的转变。


    作于 2014 年 6 月 11 日星期三


    2014 年 6 月 11 日发表于腾讯《大家》，标题为《我们将可能与汽车同归于尽》


    # 限车的正义利见当代功在千秋


    2014 年 11 月 26 日，在人民日报社举行的京津冀协同发展论坛上，北京市委常委、常务副市长李士祥说，前段时间 APEC 蓝给大家留下深刻印象，改善空气质量不能总靠天帮忙。最近社会对单双号汽车上路也有各种积极的意见，就是建议单双号要成为常态，包括星期六日，我们将听取和论证这个意见。


    此论一出，网络上照例是一堆谩骂。有人认为政策大多是由不受政策约束的人制定。但我想，假如搞一人一票的民主投票，决定城市中心尤其是大城市中心小汽车要不要限行或者要不要收取拥堵费，没准儿一半以上的市民和准市民会赞'
  merge: -1
  img_proc: true
- pgno: 145
  md: '成收拥堵费或限行。这个时候，平时嚷嚷市民最厉害的小资们可能要大骂了。仅从人数而定，像北京这样常住人口 2000 多万实际人口超过 3 千万的城市，小汽车数量也不过
    500 多万，拥有小汽车的家庭可能不到半数，而拥有小汽车的人们，也不乏有着坚强的理性、支持限制使用小汽车的人们。


    事实上，小汽车限行或收取拥堵费，不只为解决雾霾，主要还是解决拥堵本身。APEC 蓝除了小汽车单双号限行之外，还有大量工厂停产工地停工为代表。仅河北就有 8000
    家工厂停产五六个工地停工。大家都知道，每个人的生命都只是个时间的过程，时间成本才是每个人一生中最大的成本。汽车拥堵在浪费我们时间和生命的同时，也在严重损耗我们的健康。汽车拥堵和尾气都有巨大的负外部性，科学合理的控制符合人类的当下正义，也符合节能减排、增加城市中心房屋供应等的人类长远正义。


    解决城市拥堵问题只有两个办法：限行，或者进城费。新加坡和伦敦都采用后者，卓有成效。伦敦市长还因此得了诺贝尔奖并跻身一流学者行列。肯•利文斯通于 2000 年
    5 月当选伦敦市长后，大刀阔斧对伦敦进行改革，其中最重要的一项就是解决困扰伦敦多年的交通问题。在利文斯通的努力下，伦敦 2003 年开始正式征收进城费，车辆进入伦敦市中心方圆
    8 英里地区都会被征收 5 英镑。虽然此举在公布之初不乏反对的声音，但是，事实证明，征收进城费确实缓解了伦敦市中心长期以来交通拥堵的状况，为其他城市解决此类问题提供了一个成功的模版。由于在解决伦敦市中心交通堵塞问题上的创造性成就，利文斯通跻身诺贝尔奖获得者、美国长青藤名校教授之列，成为《科学美国人》2003
    年的 50 位科技名家之一。


    我个人坚持多年来的老观点：开车上下班，是人和社会病态甚至变态的体现，是个体理性导致集体非理性的结果。我当下支持单双号限行——这是迫不得已的权宜之计，长远认为单双号限行不解决问题而要收取高额拥堵费。


    有人说，单双号限行，每天多出几百万人不开车，公交地铁不更拥挤？出租车不更难打？车贵不会继续涨价？有钱有权者买不到车？但要算另一笔账：小汽车停一半，公交车岂不快一倍！人一下子就装进去了。但是通过单双号限行而不是通过经济形式上收取拥堵费的办法来解决问题的，的确很难解决更多人买更多车的问题，同时如果辅以汽车限购，也会导致腐败和对后来者的不公平。因此最终办法还是要回到诺贝尔奖获得者、出生在加拿大的经济学家威廉•维克瑞在
    20 世纪 50 年代末提出的拥堵费上。维克瑞不仅建议收取拥堵费，而且建议当交通拥堵更加严重的时候，提高高峰时段的收费。


    很多人谩骂政府不得力，没有修足够道路和公共汽车来保障交通，反而把责任推托在小汽车出行人上面。但这里有两个方面的问题：一是如果交通拥堵，再多的公交车也会被堵在路上，动弹不得。二是更多的交通只会刺激更多的小汽车出行。经济学家吉勒•杜兰顿和马休•特纳已经发现，随着新建公路的增加，汽车的行驶里程基本上会呈现出一对一的增长。他们将这种现象称为道路拥堵的基本法则。


    道路拥堵的基本法则和河流疏通、互联网促进人类直接交往的原理完全一样。《万历十五年》里曾写到疏通黄河河道的两种办法：一种是加宽河道，一种是缩小河道。事实证明后者成功了！缩小河道的办法加快了流速，更快的流速同时带走了更多的泥沙。而拓宽河道只会增加泥土的沉积和淤塞！


    加宽车道、增加道路的道理也一样。我们浪费了城市中心极其宝贵的可以盖楼的用地拿来加宽车道、增加道路，也会导致车流在拥堵处附近更多的夹塞和穿插。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '也增加了红绿灯时间，由此反而加重了拥堵；增加道路则刺激了更多的车辆出行。互联网则刺激人类面对面的交往的原理与上述道路原理、河流原理一模一样。表面上人们会认为互联网使人类面对面的交往变得更加不必要，但此种观点却没有看到，互联网使“同类相吸”的概率发生了千万倍增加，而人类思想和创造力的碰撞，需要的是面对面对点的“火花对撞”。


    既然科学的原理在互联网与面对面交往、城市交通拥堵、河道疏通等方面呈现出高度一致性的特征，单纯指责政府交往是不公平的。我们更应该反思的是小汽车出行方式本身。它带来的负外部性至少有：拥堵、尾气污染、占用宝贵的城市用地。


    为什么汽车拥堵费在伦敦和新加坡行得通，在美国却无法推行？因为美国一开始就是个汽车社会，几乎人人有车，所以遭遇的反对不同凡响。最后结果是政治学战胜了经济学。但是美国相对而言地广人稀，而且美国是世界上人均收入最高的国家之一，支撑得起这样的消费。如果汽车社会复制到中国这样的发展中国家，就是一个不折不扣的灾难。为什么？两大原因：


    +   1. 越是发展中国家，城乡差距地区差距在越明显，因此大城市化趋势也越明显；

    2. 越是人口众多的国家和地区，大城市化趋势也越明显。


    同时，在中国这样的发展中国家，过去相当长一段时期“崇洋媚外”的城市化发展历程中，多数城市发展是以小汽车为尺度，而非以人为尺度，一旦交通陷入拥堵，带来的时间损失远大于美国这样的发达国家，因为人们可选择的步行、自行车等替代出行方式更加不现实。同时，我们过去的城市化历程一直害怕人口集中，一直在疏散中心城区和大城市人口，导致城市的面积扩张和扁平化发展问题更加严重，出行距离和时间都更长。拥堵不仅在白白浪费人们的时间和生命，甚至有可能使城市生活直接陷入停顿。


    在任何决策上，科学的、整体的、宏观的理性应该战胜感性的、局部的、个体的理性。只有这样的决策才会真正有利于人类的长远利益和整体利益。为什么科学总是比民主还重要？为什么人类总是要孜孜不倦地去努力学习新知识？为什么教育越来越重要？原因就在于，知识的理性才能让我们不断摆脱蒙昧，不断走出狭隘与自私，从而，用智慧的头脑去思考、去决策，而不是只用懒惰的屁股去决策。


    城市道路应该留给公交，留给病患，留给老人和孩子。


