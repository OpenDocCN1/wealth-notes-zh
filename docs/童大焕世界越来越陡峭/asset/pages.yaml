    # 跟着万达你一定能发财吗？


    1998 年开启的中国城市住房私有化进程，是当代中国大陆 13 亿人口从无产者向有产者身份转变的一个分水岭，也是当代中国城市化的一个重要分水岭。它在催生无数“有产阶层”的同时，也催生了无数房地产大亨。而在生死厮杀此起彼伏的十二三家中国大陆房地产公司及商业领域中，最为成功的，非王健林及其万达集团莫属，迄今没有出其右者！万达集团开创的大型城市商住综合体+超高速开发模式，让官方和百姓都求之不得，所向披靡，甚至在一线城市也能突破官方一再试图把居住人口迁往郊区的努力，顽强地保持万达城市综合体的宜居与宜商。


    大型城市商住综合体+超高速开发+主体综合商业和电影业自持经营，是万达模式的铁三角和三是鼎，当然最后一项是万达发展到后期、逐渐成熟的产物，同时也是在中国大陆房地产开发到了一定时期、竞争加剧而且相当多地已经供应过量后的竞争性产物，非如此不足以吸引客户，非如此无以维持万达地产快速销售的优势。


    万达集团能够给地方百姓带来实实在在的生活品质提升和房价上涨，给地方政府带来实实在在的税收，尤其是，给地方主政官员带来“任期内”就能完全实现的政绩。这是万达集团所向无敌的关键。这么多年，你从来没有听说过万达集团出现过什么恶性拆迁事件，因为地方政府早就为它铺好了路，不需要万达自己动手拆迁。在中国复杂的房地产政商关系中，万达是少数宣称可以不行贿的企业之一。其实，旁观者只需用简单的逻辑就可以判断，成功后的万达集团，不仅不需要行贿，反而有可能地方官员请八抬大轿抬王健林。说不定官员的乌纱帽就在万达集团浩大的工程里呢！


