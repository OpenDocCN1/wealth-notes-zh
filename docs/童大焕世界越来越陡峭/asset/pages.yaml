  md: '作为道的皮之不存，作为德的毛也将无以依附。当然，这里的市场自由是有边界的，不是不受任何约束的自由。这个边界就是自由本身的边界，是各个自由主体在竞争中所形成的规则，通常以法律、行规等形式出现。大部分经济学家都认为经济学的分析应该撇开道德判断，而只是做逻辑推演或实证研究。人类社会的很多真知也往往以拒人于千里之外的冰冷面目出现，那些嘻皮笑脸四处逢迎讨好的东西，反而往往是口蜜腹剑的毒药。


    我们可以就楼市限购限贷的市场均衡和政府均衡角度，来简要谈谈市场的道德和政府的道德问题。就从“政府如果不限购限贷，那么房价肯定越来越脱离进城靠劳动收入工薪族”这个问题入手。


    首先，“政府如果不限购限贷，那么房价肯定越来越脱离进城的靠劳动收入工薪族”，这个问题本身有问题。前期买房者，大部分也是靠工薪收入。尤其是1998年城市住房私有化以前，基本上可以说全国人民都没有什么财产。以前的房价低，但是收入也低；今天和未来房价高，但是收入也高而且赚钱机会越来越多。未来中国，绝大多数人购房，同样需要靠工薪收入而不是祖先遗产或者政府分给一套房。这个工薪收入的钱来自哪里？其中有很大一部分就来自房地产行业以及和房地产直接紧密相关的
    60 多个行业。限制了房地产的自由市场，也就限制了工薪收入的活水源头。


