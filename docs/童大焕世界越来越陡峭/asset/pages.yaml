  md: '（厦门市规划局局长赵燕青）没有远见，只在黑暗中摸石头，撞个鼻青脸肿甚至坠入深渊的可能性大大增强。


    1949年以来，由于严厉的户籍限制加上粮食计划供应、大小三线建设、知青下乡、知识分子流放、乡镇企业和小城镇建设等一系列逆城市化举动，原本应该大河奔流的正常城市化运动，遭遇了一道道三峡大坝一样的人为拦挡。这种状况，直到1997年政府土地储备制度建立、1998年城市住房私有化开启，市场的光芒才真正逐渐融化计划的坚冰，当代中国的城市化才算真正重启。在一个世界上人口最多的国度里，被“筑坝蓄水”拦截长达50年之久的当代中国城市化浪潮，自然裹胁着巨大的势能，一泄千里，浩浩荡荡。也因此，正常国家80到100年完成的城市化历程，当代中国将用三四十年时间完成，其间的惊心动魄和上至最高决策层、下至普通老百姓的各种极端不适应，都在情理之中。满打满算，从1998年到2014年，16年过去，当代中国城市化从时间上也正好走到了中场时分。


    过去这些年我们做了些什么？用天津市城市规划设计研究院总院副院长黄晶涛《有多少城市可以重来》一文里的话说，“回顾过去的三十余年，关于城市我们使用最多是这样的动词：‘开发’、‘打造’、‘改造’、‘拆旧建新’。随着这些尺度宏大、力道十足的话语潜移默化地成为了我们的语言习惯，我们‘打造’出了超越人类历史的城市奇迹，30年后（确切地说应该是16年后——大烛注）的建筑面积增量远超过了在3000年内积累的、剩余至今的存量之和，而这一增速完全超出了任何一个国规划师在30年前编制城市总体规划时所能具有的远见。”另据国土资源部2013年才披露的信息，此前8年，我们的城市住宅用地供给增量是人口增量的3倍！


    今天我们可以看到中国城市化图景，一边是大量商业和住宅区形同鬼城，三四线及以下城市以及大城市远郊区尤其，一边又在“宏伟规划”谋划建新城。为什么会这样？因为中国城市化上半场的基本特征是政府规划主导，GDP挂帅，市场只是作为配角充当辅助性力量。主政领导又有巨额灰黑色收入又有红色政绩，乐此不疲，我走后哪管洪水滔天。自下而上的信息汇报方式报喜不报忧。招商引资大竞赛又强化了各地“土地财政”依赖。于是乎，中央政府睁眼瞎甚至不遗余力推动“小城镇化”，地方政府“破旧立新”没有需求也要人为制造需求。


    但是，2014年上半年的全国楼市楼潘潮是一个沉重而尖锐的警告，告诉我们如果继续沿用中国城市化上半场的政府主导、城市空间不断平面扩张的模式，必然很快迎来全面供过于求引发的崩盘，进而引发足以导致社会动荡的金融危机和经济危机。因此，中国城市化的下半场，必须用城市发展的自身规律为主导，市场主导，政府规划成为辅助性力量。而所谓市场主导，并非指政府规划无为而治，而是让政府规划服从市场规律。


    具体而言，不管是仍然总体上供不应求的大城市，还是已经供过于求的中小城市，都亟待从传统的平面扩张模式中转过头来，立即启动平面收缩模式或者向空中生长的新型城市增长模式！城市平面收缩模式的总体原则是：除非在上半场城市化运动中一些严重落后还未来得及建设的城市之外，中国绝大多数城市应该立即着手城市面积零扩张的准备，尤其是从人口增减这一城市化最根本指标看，楼市供应已经过剩或者即将过剩的城镇，更是如此。大城市向远郊区无限扩张、城区内部却限制供地以妄图限制城区人口的不科学做法也应该立即停止（北京已经基本在五环以内停止住宅用地供应，四环以内基本上停止商业用地供应）。未来的城市发展和房地产增量应该从已有的城市建成区内部挖潜力，精耕细作，通过提高容积率、增强多样性等方式入手，在充分尊重人口流动自由和流动规律'
