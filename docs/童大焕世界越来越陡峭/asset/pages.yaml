  md: '中国城市尤其是大城市拥堵更甚，一则因为人口太多道路太宽而司机素质太低，胡乱变道加剧拥堵。二因我们共同的弊端——渴望均衡发展而不是高密度发展城市导致城市不是集中发展而是不断向外摊大饼客观上增加汽车需求。


    对于汽车尾气污染问题，我们的确可以通过汽车厂家和汽油标准以及汽油附加污染物等方式来解决，但即使汽车是零污染排放，拥堵100%是汽车造成的吧？限行、拥堵费最主要的就是解决拥堵问题。有人说，解决拥堵的方案有很多，惟独不应该限行或者收取拥堵费。但你倒是拿出几个切实可行解决方案来呀，不要跟我说“只要我来承担责任或承担部分责任的方案是惟一必须排除的方案”之类就行了。如果谁都不愿意为自己那一份额担责任，这个世界只有同归于尽一途。


    不分清合理边界，既可以达到混水摸鱼逃避责任的目的，也可以达到美化自己把自己包装得很崇高的目的。它不仅可以让这个社会无人真正承担责任，也可以很容易地在这个社会中寻找替罪羊而不去承受和自我爱痴中狂欢。接下来就要说到名门痞女洪晃及其母亲、著名外交家章含之以及一个沉冤多年未昭雪的冤案了。


    1995年，未满21岁的石家庄青年聂树斌因被怀疑故意奸杀妇女被判处死刑立即执行。2005年，王书金承认自己为“聂树斌案”的真凶。此案多年未昭雪，最近突然在网络上流传一个传闻，说当年聂树斌案因为犯罪证据不够充分，石家庄法院准备疑罪从轻，判他死缓。但是，由于聂树斌的肾跟因伤病需要换肾的外交部前官员章含之相匹配，被高官下令，执行死刑（以便摘取肾脏）。


    这当然是一个相当恐怖和惊人的指控，如果指控成立，则不仅章含之的后人要承受极大的社会和道德压力，而且那个当事高官也要承担涉嫌故意杀人的指控。作为章含之的后人、也是当今著名意见领袖之一的洪晃坐不住了，在接到记者疑问后写下短文《受害者的狂欢》，发表在南都周刊第838期，经作者授权，“腾讯·大家”以《母亲肾移植与聂树斌冤案无关》为题进行了转载。这篇短文除了撇清章含之换肾与聂树斌案的关系，还把批评的矛头指向了非理性的媒体与公众情绪：


    > “去追寻聂树斌的肾移植到谁的身上没有意义，去追究聂树斌错案的原因来完善中国的司法制度则是有意义的，是唯一能让更多冤案的措施。如果聂树斌的器官真的被移植采用，那么其他犯人呢？固然聂可能是冤案，那如果不是冤案的死囚的器官被任意采用呢？我们不要保护死囚的人权以及他们的器官？


    > “但公众和媒体对这件事情的态度让我吃惊。没有人去探讨中国司法问题，没有人询问中国医疗制度中器官移植的细节，所有人像当年除四害、打麻雀一样冲到我的微博上，敲锣打鼓地高喊：‘肾哪？’


    > “对我来说，这是中国社会最无知、愚蠢和恐怖的一面，这比暴君、不公正的司法等都恐怖，这是中国社会永远不能进化到公民社会的原因。


    > “因为的这种群氓，法治的公民社会总是跟中国社会擦肩而过。群氓的社会对公正不敢兴趣，他们对所谓公正的关心是伪的，是一种发泄和自我安慰。群氓的社会是自私的，愚蠢的。在承受了长时间的公之后，这种群体只需要找几个‘罪魁祸首’出来，让大家发泄一下，批斗躺尸，这种群众运动实际上是一群长期受害者的变态的狂欢。”'
