  md: '的基础上提前布局，统筹规划。


    这样做，对于中小城镇而言，可以使现有存量过多的中小城市逐步消化楼市存量，使其中“有救的”一部分实现城市化和房地产软着陆，减轻整体的金融和经济风险。对于大城市而言，可以优化城市结构和布局，使之向真正节地、低碳、高效的现代化高效城市迈进。如果还沿袭今天的“控制大城市，发展小城镇”；“控制中心，发展远郊”模式，用不了十年，日本的今天就是中国大城市的明天。


    新华网东京 8 月 3 日消息，随着新建住宅增加、人口下降和老龄化加剧，日本许多城市都出现了住宅过剩问题。日本总务省日前发布的《住宅和土地统计调查》结果显示，截至
    2013 年 10 月 1 日，日本全国共有 5240 多万个家庭，住宅总数约为 6063 万套，按每户一套计算，闲置住宅约为 820 万套。闲置空置住宅（日本总务省对闲置住宅的定义为：长期没有人居住且连续
    5 年没有使用过自来水和电）占日本全国住宅总数的 13.5%，创历史最高纪录。特别是以别墅区闻名的山梨、长野、和歌山县，闲置率更加惊人，分别高达 22%、19.8%和
    18.1%。日本的住房闲置问题不仅限于偏僻乡村和中小城市，还涉及大城市和首都圈。如东京周边地区，上世纪 70 年代购买该地住宅的居民，现在大多已进入高龄，有的住进了养老院，有的已经去世，造成很多闲置房。由于闲置及废弃住宅缺乏管理，不仅影响城市景观，还会导致犯罪率增加，并存有火灾、倒塌伤人等隐患。


    “老少边穷”往远郊和小城镇，活力四射的年轻人往城市中心。个体独立性增加，人口就越来越大城市中心聚集。越独立，越自由，越城市化。这是一个全球性规律。不出十年，不仅大量农村和小城镇房屋大量空置，大城市远郊区的大量房屋也难以幸免“人去楼空”的归宿。


    城市平面收缩模式虽然会给土地财政带来挑战，但是一方面，土地财政并不可持续，到了市场总结算的临界点会自动戛然而止。另一方面，城市平面收缩模式虽然减少政府收入，但同时也减少了政府在基础设施建设、城市维护和管理等方面的支出；城市平面收缩模式虽然让地方政府失去了补贴工业招商引资的重要工具，但靠补贴的企业并不是地方真正的福音，真正有竞争力的企业只需要公平竞争，不需要特殊政策。靠特殊政策才能存活的企业，不少是扶不上墙的泥泥，离开了扶持就难以为继。换句话说，其中不少企业赚的就是政府扶持那部分钱。


    城市平面收缩模式带来的好处非常多：节约土地；防止房地产严重过剩引发金融、经济危机和社会动荡；从长远上从根本上降低城市的运营、管理、生产生活成本和犯罪率；使更多的人集中在更少的土地上生产生活，人与自然更加和谐。


