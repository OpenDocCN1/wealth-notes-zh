    # **问题 10：啥叫农村包围城市？**


    问：你说正确策略是不断实施资产置换，实现战略转移，“农村包围城市”。这句话我不理解，请讲解一下吧老师。


    答：所谓“农村包围城市”，就是把农村资产置换成城市资产，把小城市资产转换成大中城市资产，把城郊资产置换成城市核心区资产。……建议留意通州万达广场 和 大 亦
    庄 板 块 ， 还 有 通 州 新 城 核 心 区 。问：童老师，这些地方的商品房房和石家庄相比，投资优势体现在哪里呢？日后收益二者相比，哪个更稳？例如同样投
    200 万，五年或十年之后，北京和石家庄相比，收益会有多大差距？值不值得我得先出石家庄去京投一把？


    答：人口往哪里集中哪里房价就涨得快。北京当然优于石家庄。


    # **问题 11：人民币会不会进入长期贬值通道？**


    随着国内经济结构由投资、出口主导向内需主导调整转型，以往人民币对内贬值对外升值的畸形状态必将改变。有人总结，人民币贬值将有 8 类人可能损失惨重：第一类，股民，本币资产估值下跌，引发金融、地产相关板块走弱，加上国际热钱流出，导致股市低迷；第二类，房价因热钱流出下跌，有房产产缩水；第三类，出国留学省，换的外汇少了；第四类，海淘族亏了；第五类，出境游成本高；第六类，大型出口企业受损了；第七类，做多人民币的中国企业大亏；第八类，来中国投资人民币的炒家损失惨重。


    我个人认为这个判断适用于其他七类人群，惟独不适用于居民。热钱流出对房价只是短期和局部影响，人民币贬值对房价却是长期影响，越贬值越需要寻找保值增值的固定资产，房产、珠宝、艺术品、古董是首选。货币贬值对房产、珠宝、艺术品、古董价格上涨是长期利好。


    还有，在货币贬值过程中，最大的得利者是政府，货币贬值是悄无声息的税收；其次得利的是借款人，不论私人借款还是向银行借债。最大的损失人是现金持有人或银行储蓄人，存款人补贴了借款人。因此，在人民币进入长期贬值通道下，买房，尤其是贷款投资买房是上上之选。


    总结论：2014 年上半年是投资买房最好时机，下半年二线城市供应趋紧楼价大涨。市道低迷时以小变大、农村包围城市的最好时机。你不理财财不理你，理财的本义就是通过打理资产变出财富，要让不动产“动”起来，才能更好地保值增值。（写于
    2014 年 3 月 22 日～24 日）


