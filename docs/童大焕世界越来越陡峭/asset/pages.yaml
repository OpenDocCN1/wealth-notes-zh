    2015年3月26日，星期四，上午9:35，一位响应领导号召不断把自己的房子往郊区置换的网友说：“童老师您好！给您打个招呼。除非河北廊坊管辖地及涿州的房价与北京的房价拉近了，否则，我不会打扰您。只浏览，理性思考你的理论。”


    我下午 13:47 回答他说：“那你永远没这个机会了。”


    后来他又补充说：“我说的是房价因轨道的打通慢慢与北京拉近。不可能超过。”


    我也补充说：“价格的绝对差距和相对差距（涨幅）都会拉大而不会拉近。”


    话说中国的城市发展一直有一个“公交车效应”——前面上车的想快点开走，后面上车的想挤上来。尤其是北上广深这样的大都市，男女老少官员庶民都在说，市中心的人怎么越来越多啊，好拥挤好堵车，不开心，怎么办？


    于是有横竹竿进城门的专家说：既然市中心车多人多，那就打通周边廊疏导中央吧，郊区化，那里美天美地好山好水，乡愁都得得见。这样，市中心人口少了，自然就不拥堵了嘛！


    于是，大拆市中心，大建郊区，严格限制中心城区住宅规模，北京上海，都活生生在城市人口大增长的背景下，把市中心的居住人口降了下来！


