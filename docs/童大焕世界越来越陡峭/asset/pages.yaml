  md: '水湖畔七平方公里水域。我们到这里的目的据说是为了泡个温泉。但可能旅游公司没有沟通好，不知温泉的管道坏了，据说半个月以后才能修复。既来之则安之， 怠在郊区空气清新每个房间又都面湖的状况，我们还是决定住一晚，提前问过每个房间的宽带网络都不会有问题，只要开通一下就好了。


    但一入往，问题还是“接踵而至”。先是告诉我们网络房间，正在修理，大概半个小时就会好。不久还真打电话告诉我们，网络好了，报告房间号和姓名就开通了。但是怎么开通，却没有告诉我们。再电话询问，才知道是要搜索找到信号最强的那个，输入房间号，再输入个人身份证后六位做密码。可是“信号最强”的有一堆，链接哪个都一直没出现跟我们要用账号和密码的。这是曾经也算走南闯北的我遭遇的最麻烦的上网方式。直到离开，我们一行只有一人接上了线，而且几分钟后就断开了网，所以干脆通过“个人热点”用自己的手机
    3G 信号。我也是手机信号往外传的固定专栏稿。


    我说，每一个房间入住都有身份证登记，为什么上网还有一一报上姓名才能开通？我知道这个过程，并非宾馆有意不让顾客上网，而是缘于当地公安部门的管理要求。在一个公共权力以管理而不是服务为导向的时代，不论是对于言论还是其它方面的管理，一个共同点是越到权力末端往往管制越严，而不是传统的“山高皇帝远”，天王老子管不着。管理者的心态，我也完全可以理解：越到乡村和基层，一份稳定的工作越难找，所以他们珍惜的程度也变本加厉，不希望自己的管辖区域出任何问题麻烦。而生命中至为宝贵的自由，就是一点点在这样那样可以理解的原因下逐渐衰减乃至丧失。


    而乡村的每一个细胞，似乎都在诉说它无可避免的衰落。不管它有多好的交通、多美妙的自然、多宏伟阔大的建筑，也不管它打着多么“国际”的旗号，它的自由和敏锐，和城市尤其是大城市相比，都无可避免地陷入全面衰减甚至丧失的行列。


    除非富豪们自己拥有和管理的乡村别墅或庄园，否则一个基本情形是：不管乡村如何照画虎做出城市的模样，其制度、文化和管理软环境上总是难以摆脱乡野的冷漠与孤傲，总是无法做到城市那种丝丝入扣的温暖与熨帖。


    我住的房间洗手池堵了。先是一个女服务员，我说肯定要有专门的木工师傅，而且必须是男的啊，您一个女保洁员怎么对付得了？果然对付不了， 才又来一位男师傅，拧开弯管，居然在里面找出长得茂盛的豆芽儿来！也不知那豆芽儿是怎么来的！


    晚上去吃当地最有名的农家乐，房屋簇新，菜品味道也不错，但一抬脚，就发现走廊和房间之间都有一个坎，这是为了防止雨水漏进房间而进行的粗陋设计，就这样一个小设计，毁了一栋房子的品位。


    这就是小镇。每一个细节，每一丝空气似乎都透着凉薄，不似城市的绵密与妥帖。


    和城市相比，小镇和乡村更像是一个无机体，各种元素被随意且生硬地拼凑组合。而城市则更像一个有机体，各种细胞和元素彼此紧密地联系着，购物的快递网，多样的早点摊，夜晚把黑暗穿透的各种灯光，面对寒风呼啸也不必有丝毫恐惧闪灭次栉比的高楼，一张张彼此陌生却又平等亲切的脸，今天丢了工作明天就可以重新找一个回来的安定……城市的风，尽管有着雾霾的气息，但丝丝都透着心的自由、安定与暖意。乡村也想向城市学习和靠拢，但因为没有那样的境界，完全没有可能，因为人太少，所以每一步都被“成本太高”的经济制约顽强地拽回冰冷的现实里！'
