    MBS 在中国是新鲜事物，它的意义恐怕不亚于当年个人住房按揭贷款制度的出台，相信会对房地产市场的整体发展起到一个正面的激励作用。2014 年 10 月 11
    日《经济观察报》报道，在美国，住房抵押贷款证券化在完成利率市场化之后快速发展。MBS 余额从 1980 年的 111 亿美元大幅增至 2007 年的 9.3
    万亿美元，同期住房抵押贷款的资产证券化率也从 7.6%上升至 64%，极大促进了美国金融市场和房地产市场的发展。在中国，到目前为止，个人房屋贷款的余额已达
    10 万亿元左右，这是 MBS 潜在的存量资产。


    MBS 的推行，对中国大陆房地产市场来说，同时意味着潜在贷款额度的增加和房地产金融化，今后，玩房地产就是玩金融，二者的界限越来越模糊。有人指望着他提高房价，有人则以美国次贷危机为参照，提醒人们说“房价悬了”。在我看来，中国大陆楼市的未来就是分化、分化再分化。有大小城市之间的大分化，也有城市内部的小分化。到处都有投资机会同时到处也可能有陷阱。总的指导原则就是我一再强调的：信规律不要信规划，信市场不要信官话。而规律所就是：人聚财聚人散财散。MBS
    不论怎么推行，都不改变楼市自身的这个内在逻辑和规律。


    面对 MBS 这个新生事物，我们不能指望它迅速抬高房价，更不能指望它迅速普遍地抬高房价。“从国外经验看，MBS 在房地产市场份额非常重要的角色，但是国内市场有大量短期高收益的产品，MBS
    动辄 10 年以上的期限，和相对较低的收益率，如果没有像（美国）两房那样的投资者，很难做大规模。从负债规模和负债端久期、风险偏好来看，保险类资金、银行可能是比较合适的买家。”一位四大会计师事务所人士表示。也就是说，MBS
    能够有效扩大房贷资金来源，但未必然能够在短期内迅速扩大房贷资金来源。所以，短期内迅速刺激楼价飙升的愿望会落空。另外，面对有的地方面临过剩甚至永久过剩、有的地方仍然供应不足的楼市分化大格局，即使拥有海量的房贷资金，也不会普遍地促进楼价上涨。决定楼价涨跌的最终价值规律仍然是内在供求关系，货币资金量只是外在因，虽然它是非常重要的外因。


    MBS 推行即意味着房价风险的观点也是危言耸听。的确，证券化使银行扩大了融资放贷规模，同时把风险转移给了金融市场即 MBS 的证券持有人。但如前所述，一方面，这种“风险转嫁”在现实操作过程中将是一个非常漫长的过程。另一方面，中国大陸的房贷和美国次贷债相比，最大的差别是前者有
    20% 到 30%的首付款，而后者是零首付；前者的利率相对稳定，后者则有一个迅速提高利率的过程。所以，中国式房贷和美国次贷的不同还是非常明显的。过去几年，为配合根本不可能实现的打压房价的行政诉求，一些金融官员频频发出银行可以承受
    40%房价下跌风险之类的不负责任的信息，一些经济学者和评论人也纷纷预言房价要下跌 30%、50%甚至 80%，但其实，只要平均真实下跌 10%，整个银行体系就将无以承受。因此，正如我在《穷思维富思维》一书中所强调的，整体上，中国内地房地产市场并不允许房价停下来等老百姓的收入上涨，而只有通过土地、金融、打破行政垄断等市场化改革方式让老百姓的收入追赶房价。未来，这一逻辑仍然顽强地存在着。尽管不能排除
    MBS 在一定程度上是为了转嫁银行风险，但放任楼市崩盘而自保银行安全的可能性在未来相当长时期内都不存在。美国的金融市场化程度比我们高得多，但从 1980 年到
    2007 年这 27 年时间里，住房抵押贷款的资产证券化率也只从 7.6%上升至 64%。本次中国大陆 MBS'
