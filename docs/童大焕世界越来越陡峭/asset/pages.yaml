  md: '# 对雄安新区规划建设中的困难的几点分析


    陆大道


    一、 “京津冀协同发展规划纲要” 对京津冀整体功能定位在“世界级城市群”，首都北京是这个“世界级城市群的核心城市”，这是构建和提升中国应对全球竞争的国家竞争力的重大决策。将京津冀发展成为世界级城市群及首都北京成为世界级城市群的核心城市”是“国家大事”“千年大计”。


    “纲要”，突出体现了中国大国发展的意志与决心。中国对未来世界发展能够发挥重要影响乃至起控制作用的核心城市（之一），首选只能是首都北京。首都北京是中国国家的首位枢纽与门户，需要并且可能成为影响乃至控制世界经济的一个“节点”（城市），即当今全球几个这样的“节点”城市（控制体系）中需要有一席。同时，成为未来世界财富的主要集聚地之一。由此给广大发展中国家与人民以一个（政治、经贸、金融与货币、信贷等）新的选择与新的安全感。对京津冀城市群成为世界级大城市群、首都北京作为世界级大城市群核心城市的如此定位，是中国为维护中国国家（贸易、金融、市场）利益并对人类命运共同体做贡献的客观需要。今天中国的强大已经具备这样的可能。


    为使首都北京达成上述宏伟目标，必须疏解北京的非首都功能。因此，在北京附近选择与规划建设新郊（新城）就十分重要。


    二、首都北京早己是我国开放开发的“政策高地”，占了全国改革开放的最大先机。深圳、浦东的开发是因为顺应了国内外发展的大势而获得了伟大的成功。雄安新区的开发却难有这样的“大势”


    北京，作为国家的首都，随着国家经济实力的迅速强盛，较早就成为我国最大的国际金融、商贸、高技术以及大规模研发、信息、中介等高级服务业的基地，国际经济机构云集之地。这一重要性质不像东南沿海和浦东开发那样是通过中央政府的政策文件规定的，而是由国家首都的特殊性质与功能决定的。国际性的高级服务业机构进入我国，需要与我国中央政府及各部门合作，它们的首选落地地自然是北京。30多年来，总部设在北京的金融机构占据中国金融资源的大半壁江山，成为对内对外最大的金融服务中心。2012年世界500强地区总部84家（包括日、美、英、德、法等国一批世界级企业地区总部）在北京，成为全球500强企业总部最多的城市之一，2013年北京有48家企业入选“财富”世界500强，这个数量首次超过东京。早在2010年，跨国公司在北京设立的投资性公司达165家，占跨国公司在华设立的
    инвести性公司总数的40%。多年前，首都北京就已是全国金融GDP最大的城市。首都北京集聚了全国的资金、技术、人才资源，建设了中央商务区（CBD）、金融街、中关村国家自主创新示范区等。中关村国家自主创新示范区拥有以联想、方正为代表的高新科技企业近2万家，以北大、清华为代表的高校院校39所，以中国科学院和国家部委在京院所、民营研究院所140多家。技术交易额达到全国的四分之一以上。按照习总书记的指示，正在向具有全球影响力的科技创新中心发展。


    首都北京的开放开发，已经占了全国改革开放的最大先机，也占了京津冀改革开放的最大先机。这个作用当然超过深圳、浦东。


