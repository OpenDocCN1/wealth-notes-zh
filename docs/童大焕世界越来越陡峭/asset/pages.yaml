  md: '“7 月新增贷款 3852 亿元，同比少增 3145 亿元。社会融资规模 2731 亿元，分别比上月和去年同期减少 1.69 万亿元和 5460 亿元。广义货币
    M2 余额同比增长 13.5%，比上月下降 1.2 个百分点。7 月金融数据的回落，再次验证，定向调控政策效果有限，同时说明：一，实体经济对贷款需求下降，包括房地产融资需求主动减少；二，银行风险偏好降低，没有政治动力，银行不会任意扩大风险敞口；三，宏观调控信号扭曲，市场预期继续宏观下滑轨迹。


    “在银行信贷下降的背后，是按揭贷款的萎缩。目前多家银行收缩了住房贷款规模，有的银行公开控制开发贷款数量，也有银行以紧瑉贷款审核来变相减少按揭业务。不管各家银行对住房贷款态度如何，传统的安全产品按揭贷款的利率价格已经难见优惠，可以说，银行对房地产地产业的风险偏好迅速下降，这使得金融杠杆对房价的支撑不复存在。


    “在下半年宏观政策和各地救市政策刺激下，不排除一定范围的房价和销售反弹，但在短期政策用尽后，房价将在明年开启主跌浪，维持至少三年的中期调整。目前二三线城市普遍存在供需失衡局面，即便是一线城市，也存在不确定性，在人口向境外流动，以及房地产税开征预期背景下，一线城市存量房将被历年一个市场出清过程。房地产税作为财税改革主要内容，其登台亮相已不可避免。由于货币超发局面不再，价格预期逆转，对存量房的征税势必增加保有住房成本，因此，在房地产税正式开征前，投资者将会积极抛出手二手房。鉴于大势清晰，在今年刺激政策过后，明年一定开始新一轮房价下跌过程，并在房地产地业风险预期下，这一波下跌将完成市场出清，实现住房价格再平衡。如果以‘利空出尽是利好’的逻辑看，至少在房地产税正式登台后，房价才能止跌企稳。”


    别的不论，就谈作者这篇文章，支持房价“大跌新浪潮”的三个支点完全不存在，这三个支点是：货币超发局面不再；银行借贷；房地产税开征。


    先说银行借贷。今年以来的楼市预期开始由上涨向下跌改变，起初的确是银行借贷，因为看到三四线以下一些城市存在供应过量风险。但是很快，银行发现所谓的实体经济都不景气（主要缘于严重过剩）都不愿贷款，银行也不敢贷款，正如《2015
    准备迎接中国房价大跌新浪潮》所说的“实体经济对贷款需求下降”。在这种情况下，银行只储不贷，岂不明白着准备亏损？而且中国内地银行当前主要利润就来自存贷差，不贷岂不明确准着准备亏？在实体经济明显严重过剩的情境下，银行的优质贷款客户还得从房地产投资和消费者中寻找。


    更可怕的是，如果银行继续对房地产开发尤其是住宅用对住房按揭借贷，将有可能因改变楼市预期而直接导致房价下跌城主断供。银行等着变成房东？这样一来，银行会发现，救楼市其实是救自己，慢慢地就不仅不借贷而且要说服政府解除限贷才好，才有优质客户买房。所以，由借贷向积极寻求优质客户放贷，是自然而然的事情。


    银行万一呆坏账巨额累积，政府也不敢掉以轻心更不能袖手旁观。在银行保险制度出台之前，银行呆坏账乃至破产，都要由中央政府兜底。怎么办？除了货币超发放无他途！因此，救房地产地业就是救银行救政府。


    再说房地产税，那本是一个杯弓蛇影完全还没有边的事。姑且不论这房地产的登记都还没个谱，什么农房、央产房、军产房、房改房、小产权房、商品房等等，边界、数量、评估、征税力量等都没搞清楚弄明白，怎么征？怎么税？楼市本身在观望甚至在下跌尤其是三四线以下一些城市供应过于，房产税一出怕是压死骆驼最后一根稻草，其必金融动荡经济动荡进而引发社会动荡。会有人敢下这样的决心？


