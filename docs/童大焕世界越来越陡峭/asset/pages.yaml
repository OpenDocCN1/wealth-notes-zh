    # 城市化的物理学解释


    Katie Silver 的《人类真的能找到万物理论吗？》（来源：译言网）是一篇很迷人的文章。文章说，物理学家们希望找到一个单一的万物理论来解释整个宇宙，牛顿的万有引力定律可以解释宇宙中大部分普通的现像，然而在一些情况下他的法则却会被打破。虽然这些情况非常罕见，并且常常牵扯到极端的速度或超强的引力，可是它们却实实实在在的存在着。


    其中之一便是水星的运行轨迹。水星是离太阳最近的行星。每个行星在公转的同时也会自转。通过牛顿的法则可以计算出它们是如何自转的。然而水星的自转却是反常的，同样奇怪的是它的公转也是偏心的。


    两个世纪后，爱因斯坦的广义相对论解释了水星现象。它宏大设想是，巨大如行星的物体，或是快速移动的物体，可以扭曲时空。想象一张紧绷的蹦床，如


