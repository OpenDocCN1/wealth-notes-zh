    # 打车难和私车泛滥互为因果


    灰霾、拥堵、打车难，正越来越成为汽车时代中国城市不堪承受的“三座大山”或曰三大拦路虎！为此，上海采取牌照拍卖、北京采取小汽车限购等各种办法，都无法解决小汽车的快速增长和市民打车难等问题。这，难道是当代都市癌症之一？


    广州打车难也是闻名全国，但出租车司机一直反对增加运力。最近广州拟增加 1400 辆的士，有司机认为，如果运力增加，应减少份子钱。还有人认为不是的士少，而是都堵在路上。另外广州也准备步北京后尘，拟限制外地车在早晚高峰进入中心市区。


    出租车由公司垄断经营本身是个怪胎，技术门槛和资金门槛都不高的开车活儿，为什么要垄断经营配额管理？这个问题不解决，打车难甚至城市小汽车暴'
