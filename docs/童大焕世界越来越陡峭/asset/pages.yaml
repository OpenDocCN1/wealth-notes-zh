    # 北京是否也应该考虑拆坝？


    参考消息网 2014 年 8 月 8 日报道：美国《基督教科学箴言报》网站 8 月 3 日称，水坝曾被视为现代工程的壮举，是人类改造大自然的标志，如今，它们正在被拆除。一些水坝被拆除是出于安全考虑，一些则是因为维护成本太高。但在'
  merge: -1
  img_proc: true
- pgno: 131
  md: '大多数情况下，拆除水坝是为了恢复河流的原貌。环保人士说，随着大坝被拆除，大自然复原的速度令他们吃惊。


    在过去 25 年里，美国有近 900 座水坝被拆除，现在，每年都有 50 至 60 座水坝被拆除。比起美国现有约 8 万座高于 6 英尺的大坝、200 万座小型水坝，拆除部分还是少数，但是由此带来的观念转变非常可喜。马萨诸塞州生态学家艾莉森·鲍登说：“我们的目标是，让河流在最大程度上恢复原貌。”她说：“我们真的认为，能回到
    17 世纪吗？不会的。但是，我们希望，尽自己所能，让河流恢复自我维护的状态。”


    相比于美国而言，也许中国北京更应该考虑拆除一部分水坝的事宜。过去多年，作为中国的首都，北京一直试图以水资源短缺等理由控制外来人口，并且给中国大都市控制人口做出了很多违反人道、人权、侵害儿童上学权益等的恶劣示范。虽然控制人口的妄想每次都被现实击得粉碎，但侵犯外来人口权益的举动也一直没有停止甚至不断变本加厉。


    北京历史上是个土肥水美的地方。永定河、温榆河、潮白河自北向南，形成一个巨大的“川”字川流不息灌溉北京；昆明湖、玉渊潭、北海中南海南海后海、龙潭等彼此有水系相连的湖泊台湖翠景点缀其间。想当初祖先起的地名，就知道当年是怎样情景：海淀，积水潭，中海，南海，北海，后海，西海子……“永定河”大概是希望滔滔大河永远风平浪静，“潮白河”涨潮时恐怕是浪花卷起千堆雪……


    历史上北京水资源非常丰富，到处都是水面、湿地，地处南北往来的通道。商周时人们只能沿着太行山东部才能通行。但是今天，北京已成为世界上缺水最严重的大城市之一。


    北京今天的水资源匮乏，和我们的大坝建设等一系列人为因素皆有关系。新中国成立以后防洪而非保水的做法，是今天北京水危机的重要原因之一。1949 年建国后，北方最初需要应对的是水危机而不是缺水。与大多数水坝修建是为了给机器提供动力、蓄水、灌溉或利用水力发电不同，北京的水坝很多是为了防止洪水威胁，治理思路从一开始就偏重工程治理办法，忽视恢复生态环境、利用森林植被保持水土，大批树木反而在大跃进时期被砍伐。1950
    年代开始修水库。以后，北京相继建设了 84 座水库，主要目的是为了防洪，大量水坝拔地而起，大量河道被扯直，导致大量河水一泻千里。


    水坝危害的不只是鱼类等，也导致水资源过度被蒸发。被水坝拦住的水体流动缓慢，温度高，不仅不适合那些喜欢清澈、流速快、温度低的水体的生物生存，而且加大了水资源的挥发。水中的含氧量下降，沉积水淤积，有毒物质增加。所以和大多数人的直观印象不同，大坝的建设，不是在保持水土，而是在加剧水资源蒸发；不是在降低环境温度，而是在提高环境温度；不是在改善流域环境，而往往是在破坏流域环境！三峡大坝修建前，专家宣传说这就像给重庆装了个大空调，以后重庆会冬暖夏凉。但三峡大坝蓄水成功后，人们却惊讶地发现：怎么“空调”装了后——夏天吹暖气，冬天给冷风！当初的承诺他们永远兑现不了！


    不适宜的农业政策也是北京水资源匮乏的原因。人口与环境问题专家王鑫海博士在《中国国内移民限制导致的环境与人口危机——南水北调 VS 北民南移》一文中写道：“华北地区本不适宜发展需水量大的农作物，但是
    1949 年以后为了‘扭转南粮北调’，各地大举在水资源不丰富的华北地区发展水田，种植水稻，大大增加了农业需水量。京津地区每亩水稻需水约 800—1000 立方米，而旱地每亩用水量一般为
    300 立方米左右，两者相差巨大。京津地区仅仅由于水稻种植面积的增加，每年农业需水量就增加了 7 亿立方米。华北两亿亩农田进行节水灌'
