    在中国人口呈净流出趋势的省份中没有一个达到 2.1 的基本生育率，甚至还有多省低于全国平均水平。四川、重庆黑龙江、陕西、山东、吉林、山西的生育率均低于全国平均。湖南、湖北、广西、贵州、山东等劳务输出大省，老年抚养比也高于全国平均水平。这些省份在人口迁移大潮和低生育率的夹击之下不仅人口会渐渐凋零，也将率先成为老人省。


    1935 年，著名的人口地理学家胡焕庸在画出“胡焕庸线”（东北黑河至云南腾冲的一条直线，自宋代千年来，线东南 36%的土地生活着全中国 96%的人口）时恐怕不会想到，后世在“西部大开发”、“振兴东北”等一系列强化民众对政府的依赖过程中，恰恰也加速了这些地方的民众从市场观念到人口增长的衰减，从而带来更大的、远大于外部输血的内在损耗。这一切，只会进一步加速中国西部、东北部和中国的东南部地区之间的发展落差，从而加速“人往高处走”的步伐。


    中国的天下，永远是东南部的天下。


