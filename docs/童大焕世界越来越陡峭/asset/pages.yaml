    更严重的是，实体经济产能过剩还会追累金融业，造成银行坏账，增加诱发金融危机甚至经济危机的风险。当前，我国经济运行中的风险，主要是金融风险、债务风险、房地产风险以及产能过剩风险等。归根结底，其它一切风险都会归结为金融风险和经济风险。因为我国企业债务占
    GDP 的比重超过了 120%，而美国约为 72%，日本约为 99%，意大利约为 82%，澳大利亚约为 59%，加拿大约为 53%，德国仅为 49%左右。在西方发达经济体中只有西班牙的企业负债率高于我国。


    以上两个指标，都可见第二产业过剩已经到了非常惊人的程度，都已经宣告传 统的工业造城的开发区模式已经终结。


    我们唯一能够庆幸的是，由于政府管制过多，我们的城市化、市场化程度还 非常低，由于经济和国家财政恶化的倒逼，城市化、市场化（法治化）还会带来 巨大的生产力释放空间。而政府对未来创造性市场的控制能力将会越来越弱，行
    政垄断的威力也会渐渐式微。危机中总是充满机会，危机危机，对于一些人是危 险，对于另一些人就是机会。就看谁能正确地看清和把握未来。


    当下中国，正处在 1949 年以来当代中国第三次转型的重要历史关口。从百 年中国的历史转型来看，1949 至 1978 年的第一个 30 年是计划经济和以阶级斗
    争为纲时代；1978 到 2014 年的第二个 36 年是权力主导的半计划半市场经济时 代；从 2014 年起，半计划半市场的中国模式时代终结，以经济增速突然大幅度
    放缓和 2014 年的十八届三中全会、四中全会为标志，第三次大转型大变革时代 正式启动。在第三次转型的时代背景下，市场化、法治化将成为社会主流，财富 将越来越流向高智力和高技术这两类人。


    作为面向未来的企业家和个人投资者，必须紧紧抓住自由市场化和城市化两 条主线，充分利用大数据，沿着市场化、城市化、互联网三大方向去思考、去学 习、去努力。要记住，不管是个人还是企业还是国家，最大的失误是借贷，是顺应时代
    的发展潮流，而不是借权力，借人。紧跟政府也许有失败，紧跟规律和潮流才 能站在时代潮头。互联网则把知识经济提到了前所未有的高度，知识经济是创新 型经济，是最不能通过行政垄断的经济。沿着人口流动的城市化方向、沿着法治
    化市场化的方向、沿着互联网在全世界范围内跨国籍同道、同仁、同趣、同好的方 向，沿着这三个大方向，未来有无限商机、无限可能。


