  md: '建筑物及标志性建筑。


    2001 年 9 月 11 日，两架遭到恐怖分子劫持的飞机分别撞向世贸中心一号楼和二号楼，两座大楼在两个小时内相继倒塌，导致包括世贸中心其余 5 栋大楼、德意志银行大楼在内的多栋建筑物严重受损。


    2013 年 5 月 10 日，2002 年开始重建的世界贸易中心一号楼塔尖安装成功，比原来更高，建筑总高度达到 541 米，高度超过帝国大厦成为纽约最高的建筑，成为西半球最高建筑和世界第四高建筑。


    奥林匹克格言是“更快、更高、更强”，城市化规律则是更高、更大、更集中。美好城市电梯上上下下比汽车进出进出更频繁，摩天大楼摘月星，城市胜利在此期。


    2015 年年后，当我看到广州金融街某地块将成为超高层住宅集中营、6 号楼都在 40 层以上的消息时，不禁心中暗想：这才是未来城市的本来模样，这样的房子值得拥有！


    正视城市未来，必须告别“摩天大楼诅咒”。摩天大楼诅咒是一种将经济衰退与摩天大楼关联的奇怪现象，首先提出这一看法的是德意志银行研究主管劳伦斯，他认为“摩天大楼立项之时，是经济过热时期；而摩天大楼建成交之日，即是经济衰退之时”。巴克莱资本（BarCap）甚至言之凿凿地说，过去
    140 年里摩天大楼狂热潮都是经济即将崩盘的肯定指标。但是，哈佛大学教授爱德华·格莱泽《城市的胜利》告诉我们，摩天大楼诅咒只是一个偶然的巧合，摩天大楼的建设跟经济衰退本身没有必然的联系。全世界的经济每天都在起起落落，但是越来越高的城市却是我们不断变化着的风景。经济学研究通常需要对多种变量和表现作出精确评估，过度强调单一因素的作用和表现，既是简单粗暴的表现，往往也与真相离题十万八千里。


    不管厌恶城市成为怎样一种思想病、文化病、政策病，都挡不住人类通往城市的脚步，都挡不住摩天大楼在电梯助推下不断向更高处揽月摘星！哪怕你拿时髦的低碳生活来说事，想要证明摩天大楼是多么的不环保，但《城市的胜利》用数字告诉人们，高楼大厦是城市最好的产物。哪怕摩天大楼作为建筑本身显得不那么环保，但综合评估，住在摩天大楼的生活方式，才是人类最环保、最高效的健康生活方式。


    住在郊区对于地球来说，是一种原罪。城市调和反城市化规划，导致很多城市大肆平面扩展。以休斯顿为例，这个低矮的城市平面向扩展，大量住在郊区的表现，让休斯顿成为美国最大的碳排放城市，电力消费惊人。田园牧歌式的居住，是最浪费资源的居住方式，住在城市的摩天大楼里才是最环保的生活方式！在那里，人们的公寓面积小、家庭规模小、空间距离近、驾车机会少，碳排放量要远远低于农村或郊区。郊区或乡村的房子通常比城市的公寓大很多倍，于是夏天制冷冬天制热都需要消耗更多的能源；而如果你在城里上班，每天开车也要贡献碳排放；即使你不在城里上班，那时也得去城里的好餐厅就餐，还得去百货公司购物，又是碳排放。


    随着中国住宅供应的大量过剩，人们选什么样的房屋才能使保值凸显得越来越迷茫、专业化要求越来越高，这里就提供一个较简单的判断方法，同样的城市入住成熟地带，哪里的高楼就选哪里的；哪里的高价就选哪里的。


