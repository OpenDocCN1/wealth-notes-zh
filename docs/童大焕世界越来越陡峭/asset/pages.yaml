  md: '具体而言，不管是仍然总体上供不应求的大城市，还是已经供过于求的中小城市，都亟待从传统的平面扩张模式中转过身来，立即启动平面收缩模式或者向空中生长的新型城市增长模式！城市平面收缩模式的总体原则是：除非在上半场城市化运动中一些严重落后还没来得及建设的城市之外，中国绝大多数城市应该立即着手城市面积零扩张的准备，尤其是从人口增减这一城市化最根本指标看，楼市供应已经过剩或者即将过剩的城镇，更是如此。大城市向远郊区无限扩张、城区内部却限制供给以妄图限制城区人口的（不）科学做法也应该立即停止（北京已经基本上在五环以内停止住宅用地供应，四环以内基本上停止商业用地供应）。未来的城市发展和房地产增量应该从已有的城市建成区内部挖潜力，精耕细作，通过提高容积率、增强多样性等方式入手，在充分尊重人口流动自由和流动规律的基础上提前布局，统筹规划。


    这样做，对于中小城镇而言，可以使现有存量过多的中小城市逐步消化楼市存量，使其中“有救的”一部分实现城市化和房地产软着陆，减轻整体的金融和经济风险。


    对于大城市而言，可以优化城市结构和布局，使之向真正节地、低碳、高效的现代化高效城市迈进。如果还沿袭今天的“控制大城市，发展小城镇”；“控制中心，发展远郊”模式，用不了十年，日本的今天（注：指大量远郊区变成无人区，房屋严重空置）就是中国大城市的明天。**【完】**


    # 城市化战略大转折应该警醒 14 亿国人


    童大焕—2019 年 8 月 30 日星期五


    1

    2019 年 8 月 26 日，中央财经委员会年内第五次会议认为：“经济发展的空间结构正在发生深刻变化，中心城市和城市群正在成为承载发展要素的主要空间形式。”为此，应该“增强中心城市和城市群等经济发展优势区域的经济和人口承载能力。”


    什么意思？


    简单说就是两句话：发展规律和逻辑变了，现在和将来主要靠中心城市和城市群。为了顺应这种发展规律，必须让更多人和资源进入中心城市和城市群。


    诚如国务院研究中心助理研究员高敏次日在《21 世纪经济报道》上发表评论称：本次会议的提法意味着：特大、超大城市的人口政策可能将发生巨大变化，原有限制发展的思路开始转变，而是顺应规律，通过扩大土地供给，提升人口承载能力等方式推动人口向大都市和周边城市集聚。未来，都市圈作为参与全球竞争与合作的主要载体，这是中国城镇化的重大趋势性变化。


    之前的 2013 年 11 月 12 日，《中共中央关于全面深化改革若干重大问题的决定》'
