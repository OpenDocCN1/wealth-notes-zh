    依我看，能够让偏僻乡村农民搬出来的还是要尽量让他们搬出来，把三通一平的钱用来改善他们的异地房屋安置和培训，可能比三通一平的效果要好得多。否则，你修通了公路，要么路上看不见一个人影，要么可能只是方便了盗木贼进山伐木！中国大部分条件恶劣的乡村，本来就应该让它们回归自然。一些城市近郊环境优美、土质优良的乡村，则应该由有知识有资本有销售人脉的土豪们去建设。

    一次在旅途中，海南大学法学院教授王琳讲了个真实的乡村扶贫故事，它像一则寓言，飘在今日中国城乡之间灰蒙蒙的雾霾背景中：有这么一个乡村，很偏很穷，历任领导想尽了一切办法挂村扶贫，可是怎么也不见效，给村民钱，他们两天就吃完。后来有人想了一个办法，给村里送了两台电视机，然后，通过电视，村里的姑娘们发现了外面精彩的世界，于是有一两个大胆的走出了村，进入城市，过年衣着光鲜地回来，过完年，更多的青年跟着出去了！如此往复，这个寂静的村庄从此改观。


