    # 自我中心主义思维毁坏城市构建


    编了一本书，编辑回话说：“这本书首先解决了我很多的困惑……原来这个社会，很多人都是围绕着自己的利益和立场来自圆其说的，心量、眼量以及世界观，决定智慧的高度。”


    确实如此。世界上相当多数人，思考问题都是以自己和自己所处的地方为原点、为中心、为圆心。你若说他仿佛觉得世界都围绕着他转，他肯定矢口否认， 但在思维深处的潜意识里，这种思维方式却又鬼使神差地控制着人们的心智。只有少数有着坚硬理性的人们，能够跳出三界之外，站在更高、更远的位置上全面审视庐山真面目，进而准确定位自己所处山中的位置，并在此全局视野基础上，
    正确选择自己通往未来的方向。


    最近“京津冀一体化”和北京某某副中心之类的喧嚣，就让更多八竿子打不着几十上百公里外的“周边城市”打了鸡血似的兴奋，规划虚无缥缈中，房价已然到半空，仿佛“京津冀一体化”一下子都以它它它为中进行“一体化”了。


    关于轨道交通首先会延伸到哪里，坊间也颇多猜测。一些人认为轨道交通延伸到哪里，哪里就能获得发展。这其实也是自我中心思维。在这种思路下，甚至有一种观点认为，如果开通燕郊等周边城镇至北京的地铁、轻轨等交通快速路线，
    对北京市、区政府并没有带来好处，凭什么自己花钱修地铁、轻轨，这些交通上的人群在本地上空仅仅成为匆匆过客而不肯下来消费呢？这种为他人做嫁衣的事情是不愿意做的。所以，北京周边地区到北京的交通改善是不切实际的。


    这也确可能是一些专家甚至北京市一些领导的看法。但为什么就不能“换位思考”想一想，交通便利，为什么只有利于资源向郊区分散，而不是更加有利于资源向市中心集中？什么叫城市化？城市化难道是资源分散化而不是人口和资源的集中化？以为地铁、轻轨等现代快速交通模式只有利于郊区的想法，是没有调查没有数据支持的拍脑袋想当然，
