    当下中国的城市化，是中国历史上规模最大、速度最快的亿万民众自发自主的市场化运动，但是无数的人们，头脑中牢牢盘踞的却依然计划经济那根辫子， 苦心孤诣，总妄想用计划把市场自由关进笼子、用权力把公民权利关进笼子。不剪掉计划思维那根无形辫子，中国的市场化、城市化之路将走得格外曲折、格外艰辛，户籍改革以及儿童和老人权益保护也将如镜花水月。但这一切，都阻止不了
