    余位衣衫褴缕的旅人，面对广袤无垠得几乎“取之不尽用之不竭”的新大陆，首先想到的是确立一个共同遵守的公约，然后才慢慢地有了世界第一强国——美国；想想澳大利亚，也是一群流放的犯人，建立起的一个自由、繁荣的国家，其中的要害，也是“契约”！为了一个公正的契约，各自争取自己的权利和利益，进行各种博弈，理所应当。所以，在本文讲述的故事中，村民们在水塘选址上的“争夺”，本身就是自然博弈的基本组成部分，无可非议，以此指责村民的“奉献精神”不够，本身就是知识落后观念落后的表现。想想澳大利亚首都堪培拉，那也是悉尼和墨尔本长期争执不下的妥协产物，谁都希望首都建在自己所在的城市，最后才决定在两者之间建设一座全新的堪培拉！有什么不对吗？


