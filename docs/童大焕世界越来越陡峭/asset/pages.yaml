  md: '但一方面，过去国人还没富起来，有钱有闲两者兼具的尤其少；另一方面，海南也一直没有非常清楚地找准自己的定位。即便上下方来了个“国际旅游岛”，也未必一下子就知道自己的核心竞争力是什么。是免税商店购物吗？它能否竞争得过香港？能否长期间面对越来越开放的世界经济一体化趋势？是美丽风光旅游资源吗？那又该将海南旅游定位在什么层次上？是迪拜一样全世界富人云集向往之地？还是寻常港市井人家遛恋留恋之所在？


    海南全岛独一无二的竞争力，一是气候；二是由于四周都被大海包围，同时岛内污染工业又少，PM2.5 几乎全国最低。而这两样东西，恰恰都是像土地和房产一样的“不动产”，必须人们亲自来这里才能享受！于是，旅游、休闲、度假，尤其是冬季旅游休闲度假的定位就变得清晰明确了。


    知道自己的核心竞争力了，接下来要怎么样让自己的核心竞争力卖合适的价格？在这方面，海南也许也没有做好足够的“客户分割”，不知道到底如何隔离高端旅游消费和市井消费，导致近年来几乎常年都背上了“宰客”的坏名声，给温暖的宝岛蒙上了一层“拒人于千里之外”的冰箱。


    海南不像迪拜，迪拜是沙漠上凭空造出来的一座新城，可以单极化向高端发展。海南有悠久的历史和 800 万一直在全国范围内比较起来收入不太高的当地人。因此海南的发展应该始终兼顾两端。海南国际旅游岛的发展，同样应该达成这两端之间的平衡。


    除了一些最著名的历史文化遗存之类的东西应该全面免费开放之外，海南岛的旅游定位应该在市井与旅游之间有明显的分割和界线，两者都不能拒绝，但是两者一定要有无形的“楚河汉界”。形成两者楚河汉界的，就是区域区隔，以及相应的服务和价格。


    海南的旅游、会议服务当然还需要继续像迪拜一样向高端发展，以配合国际旅游岛的高端定位，同时对待起全国独一无二的气候资源。与此相关的各项服务价格也很“高端”，这是没有商量的，随行就市。凡进入这些区域提供餐饮等服务的机构和人员，在获得高额利润回报的同时（前提当然是服务水准也更高），可能要忍受一年里不到半年经营有效期的代价。


    另一类“古镇式游客”，属于穷游一类，也包括旅行大于旅游和休闲的旅行者，则应该融入当地市井生活，享受的也是当地市井生活的平民服务和平民价格。近年来，随着东北老工业基地的逐渐衰落，东北就业机会的减少和当地寒冷的气候，越来越多东北人冬天到海南旅游甚至定居，海口一带较为廉价的专门出售给外地人的房子颇受欢迎。东北人到了海南以后，一般要在当地寻找工作或自我创业，餐饮等服务往往是一个门槛相对较低、受众相对较广的服务行业。他们中，绝大部分人的餐饮服务就应该定位于“平民市井消费”水准，一年四季都在经营，既服务于当地居民，也服务于各种穷游背包客。


    在市场自发形成的基础上，海南对国际旅游岛的管理应该以街区形式划分哪里是高档消费区，哪里是市井消费区。如果在市井消费区店家宰客，一律取缔经营资格。这个问题管理起来也许不必那么艰难。就像云南有不少城市以翡翠加工和销售为主业，业主一经发现售假，立即会被永久性取消在当地的经营资格一样。


    海南房地产的开发应当与此相适应，“鼓励两头，压缩中间”不妨成为海南全岛房地产开发的基本方针。此话怎讲？就是过去开发得非常多的、针对外地消费者的自有产权型旅游休闲度假性质的房产应该大大压缩。不要只贪图眼前的一次性利益，破坏了海南岛的长远未来。因为这类房屋属于“中间型产品”，大部分是外地稍微有点闲钱但又未必有足够闲暇的人们投资和投机所用，真正能够利'
