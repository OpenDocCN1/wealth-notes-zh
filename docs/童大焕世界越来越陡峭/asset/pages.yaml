  md: '果你在上面放一个沉重的物体，它会发生弯曲和凹陷，而任何其他物体都会滚向这个重物。按照爱因斯坦的说法，这就是物体互相吸引的原理。这个理论很好的解释了水星的奇怪轨道。根据广义相对论，太阳的巨大质量扭曲了它周围的时空。


    作为离太阳最近的行星，水星比其它行星经受了大得多的扭曲，广义相对论的公式描述了弯曲的时空对水星轨道的影响，并且可以精确的测算出它的位置。广义相对论可以推演出黑洞的存在，它们是恒星向自身中心塌缩的产物。它们的引力场是如此强悍以至于连光线都无法逃脱。


    但是万有引力定律和广义相对论能够解释宏观，却对微小的物体束手无策。这时量子力学和弦理论出场了。


    就此打住，我是想把它拿来解释一下城市化的规律问题。


    当长三角的上海、浙江、江苏、珠三角的广东省以及北京和福建 6 大省份像磁石一样牢牢吸引全国 34%以上的流动人口、87.83%的跨省流动人口，我们用什么来解释？我们可以用牛顿的万有引力定律来解释。


    但在中国的城市化版图上，北京似乎是个另类，它像黑洞一般吸附了周边所有地区，甚至有可能包括天津，形成著名的“环北京贫困带”。很多人说，那是北京政治中心的怪胎形成了这种吸附效应。但这对是一种刻板成见。在农业时代，所有的城市都是缘于行政中心或者交通中心，但是当它们发展到一定程度，加上工业时代和服务业时代的助推，其中一些城市、包括像北京这样的城市就会脱离行政的羽翼，获得独立自由的发展。就像孩子长大了独自飞翔一样。


    北京在教育、科研、传媒、艺术方面对全国的集聚以及其独特的自由特质，在三大都市圈中独一无二，这些未来创造力最根本的因素集中在北京，就是它黑洞能量的根本来源，这也是它将打遍上海、广州、深圳乃至香港无敌手的地方。这方面，不仅仅在于相关机构数量之多，更在于其精神自由度方面无与伦比。


    宏观方面，城市化的规律完全符合万有引力定律和广义相对论：绝大多数人口向少数能量巨大的城市集中，紧紧围绕着它们运转。


    但是在微观方面，总是有少数另类人物紧紧遵从自己内心的另类需求，往逃离城市喧嚣的方向，去追求自己的内心世界，比如离群索居，箪食瓢饮，甚至不事稼穑在陕西的终南山下修身养性。就像最近网络流行的各类搞笑“最牛辞职信”：


