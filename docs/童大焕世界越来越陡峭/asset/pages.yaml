    # 女性最深刻地改变着世界


    在我们的直观印象中，男人是改变世界的先锋战士。但事实可能与我们的直观印象相去十万八千里，那些叫声和动静很大的未必真有力量，倒是那些水面之下，润物无声的女性力量在温柔却又顽强地改变着世界的进程和方向。


    这两天微信朋友圈流传着一篇FT中文网2014年9月3日的短文《在县城买房的大表哥》，作者白天。这篇短文之所以流传，是因为它触动了几乎每个人的神经，也就是触动了时代的神经。文章说，城市里流行讨论剩女，农村愁的是大把剩男没人可娶。女方精挑细选，男方一妻难求。早的彩礼三大件自行车缝纫机电视机，已经发展到无明确标注却暗地流行的新三小，小楼小车小婆婆（指婆婆尚年轻）。小楼可不是有天有地的农村别墅，而是城里套房。很多人明明暂时不住，但也要先买了占着。农村土地承包到户在缓慢变化，分配到个人的模式正在被机械化和雇佣、外包等新形势所替代，家里没有劳动力，完全可以包给种田专业户收年租，或者成熟季租来大型机械一天铲倒。对劳动力的需求减少，农村剩余劳动力都往城市跑。年轻的不再读书的小伙姑娘，已经不再安于农村的土地。哪怕城市的月薪扣除房租和日用所剩无几，他们也愿意呆在城市寻找更多的机会。当掌握婚配主动权的姑娘们释放出进城的信号，按照中国人的习惯，先置地后成家，县城房子就这么卖出去了。


    社会最深刻的变革，往住就是这样悄无声息地由女性引领着。为什么城里流行谈剩女、农村男人愁娶媳妇？因为女性率先进城了。女性以静水流深的温柔力量，改变着人口和财富的流向，中国如此，日本也如此。近年来日本女性越来越独立—越进城越独立，越独立越难求，导致城市化的发展呈现出越向城市中心、向中心大都市集中的现象。农村和小镇镇，以及大城市郊区出现越来越多房屋空置。日本的今天，必然是中国的明天。所以忠告中国的楼市投资者，紧跟女性的脚步你才不会错哦。


    女性越来越独立越来越自由，也会带来家庭规模小型化。那种和双方父母住在一套房子里的家庭会越来越少。它会带动城市住房的套数需求，同时也会带来住房小型化的发展趋势。据悉，1900年美国户均人口达4.6人，2000年时已降至2.6人；1920年日本户均人口达5.1人，2000年时已降至2.7人。我国户均人口数量已由1995年3.7人，降至2010年的3.1人。按美国和日本，我国家庭规模未来20年还将继续减小，家庭数量还将增长。


    重男轻女的传统观念和农村二胎、单独二胎的计生政策，加上胎儿男女鉴别技术的提高及成本下降，二胎政策有可能加剧第二胎对男女婴儿的筛选，使得未来男女性别比例更加失调，女性人数更少。这会进一步刺激女性在婚姻市场中的地位和“议价权”提高，进而间接带动女性整体地位的提高，使得女性在城市化过程中的主动权也大大提高。


    当然，即使在正常男女比例时代，即使是已婚人士，女性也往住是城市化进程中的主力部队和先遣军。尤其是那些发展中国家的城市化进程，往往都是由女'
