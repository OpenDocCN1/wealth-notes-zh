  md: '20世纪80年代以后，日本、香港、台湾、新加坡、韩国亚洲五小龙的崛起，宣布了工业化时代城市和国家告别传统资源依赖的新时代！“资源的诅咒”随之出现——不管什么样的制度环境下，资源越丰富的国家和地区，经济、社会和政治发展速度越慢。


    20世纪以来，特别是二战以后，世界城市化进程大大加速。1950年世界城市化水平为29.2%，1990年上升到47%，2011年超过50%。发达国家早在1950年城市化水平已超过50%，1950年至1980年间的城市化速度仍较快，1990年发达国家的平均城市化水平已达75%。期间，发展中国家的城市化仍以乡村向城市移民为主，1990年发展中国家平均城市化水平为37%。


    当代中国的城市化要明显滞后于世界城市化的步伐。


    1950年世界城市化水平为29.2%。中华人民共和国1949年宣布成立，中国城市化率时为10.64%，差不多只是世界平均水平的三分之一。但这是情有可原的，八年抗战三年内战，哪里有什么发展，把胆大的胆小的都赶到深山老林了。


    但此后直到城市住房私有化元年的1998年，我们用半个世纪时间也没有追上发展中国家平均水平：


    1949—1978（改革开放元年），中国城市化率由10.64%上升到17.92%，30年时间才举步维艰地提升了7个百分点，年均0.23个百分点。主因是1958年开始的二元户籍制牢牢捆住了农民的双脚。


    1990年，世界平均城市化水平47%，发展中国家37%，发达国家75%以上，中国只有26.41%。直到1998年（城市住房私有化元年），才达到30.40%。原因是，虽然1980年代后“允许农民自带口粮进城”，但城市住房计划供应，半个世纪里又是“只筑城不筑窝只生产不生活”，进城到哪里去住呢？同期乡镇企业和小城镇建设也延缓了城市化进程，所以1978年到1998年，又一个20年，城市化率还是只提高了12.48%，年均0.62个百分点。


    2011年，全球城市化率过半，中国也宣布过半达到51.27%。从1998年（城市住房私有化元年）30.40%到2011年51.27%，13年增长20.87%，年增1.6个百分点，大大提速。


    但综上所述，城市化是农民彻底告别农业、进入工业和服务业并且在城市安居乐业的过程。中国官方数据2013年是53.7%，但扣除2.6亿候鸟式农民工，实有也就36%上下。比世界平均水平落后一大截。


    中国的统计数据会跟老百姓捉迷藏：在计算城市化率的时候，为了跟国际接轨，把农民工算做城市居民；在计算农民收入的时候，为了让它和城市居民收入差距不那么大，把进城农民打工或创业的收入也算作农民收入（它们占到农民总收入的90%以上）。尽管如此，城乡居民工资性收入差别还是达到三四倍甚至五六倍，算上城市化过程中的房产资产涨跌，那就更是天高地下了。'
