  md: '美国物业税（房产税）基本上等同于社区税，大部分税收可以留给社区建更好的学校、聘更好的安保，彼此互相影响，形成了“富人郊区化”现象。曼德拉上台执政后的南非约翰内斯堡的城市历史演变，几乎是美国那段城市历史的一个时间和空间浓缩版。但是随着城市中心治安状况的好转，美国的城市发展正越来越回到集中化的原有规律中来。而法国当年的郊区化社区发展，则创造大量只有居所没有商业的绝警和犯罪之地，这是导致类似2005年大规模法国骚乱的重要原因。正如桑德斯在其名作《落脚城市》一书中所列举的肯尼亚和法国的一些现代化低收入公寓建设案例，指出：“像这类计划所建造的建筑，通常只是纯粹的住宅，这些建筑内部与周围都没有空间可供经营店铺、作坊或者小工厂。这种住宅没有任何实际机会可让人扩大居住空间，或者把部分空间转为商业用途。更重要的是，这种住宅与街道隔绝开来，住户无法与经过的路人做生意。没有商业空间的住宅可能会导致住户永远无法自立。”作者以法国埃夫里的金字塔小区为例说明这种现代主义住宅区的必然失败：“缺乏人际网络是市郊小区本身造成的结果，是这些小区的功能与环境规划带来的产物。像金字塔小区这种大型高楼公共住宅区的一项矛盾之处，就是这种小区都有人口密度低的问题。最理想的都市小区和落脚城市——建筑物通常只有二到五层楼高，而且直接位于道路旁边，一楼都是店面——人口密度都非常高。把为数那么少的人口集中在一座孤立的住宅区里，又没有可供居民自行搭设建筑物的空间，这里的居民必然无法建立起紧密的关系。”作者援引埃夫里市长的话说：“看看那里的建筑规划，整个都是非常笛卡尔式的。把金字塔小区兴建得密度这么低，而且又只有人行步道，等于是扼杀了那个地区真正发展为城市的可能性。那里没有市区，没有商店和小生意凝聚整个小区。”


    由于青壮年的持续减少和乡村、中小城市就业机会少，中国的治安恶化将首先起于乡村，并且由于工业过剩带来的企业倒闭潮而逐渐向中小城市漫延。所以中国的大城市化趋势会更加明显。但是限制大城市中心供地和限制大城市人口自然发展的不良政策会与此形成巨大拉扯。本来，向大城市聚集不是坏事，有利于节约土地、提高效率、增加就业、减少污染，不知道为什么，我们总要和大城市做对，让人自由进出，想乡村和县城生活的，撤到乡村和县城去；想到大城市的，通行无阻地去大城市，来去自由，不是很好吗？不明就里的人们总以为进行行政资源调配不导致大城市化，其实大城市化是一个世界性的潮流，谁也无法逆转。小政府大社会的日本，其国土交通省2014-03公布的一项预测报告称，由于人口减少，到2050年，约六成国土将成为无人区。另据日本总务省人口统计报告：全国人口数量下降趋势明显，与此同时，人口大量向东京、大阪、名古屋等都市集中也是日本人口问题的一大特征。


