    # 养老地产多是“断代产品”


    我完全不好养养老地产，原因比较简单——它们离想像近，离人性远！那是一个近乎都靠臆想和美化描述出来的一桩生意——我有一座房子，面向大海，春暖花开；或者——我有一座房子，面向自然，鸟语花香。这其实是中青年对老年生活的想像。我们正在经历但未曾经历过老年社会，养老地产所虚构的生活成为如今中青年的海市蜃楼。


    绝大多数养老地产都是打着养老的旗号夹定位尴尬的郊区房产，这些房地产完全不合适间紧张又有孩子要上学的中青年，那就只好打着周末休闲度假或者养老的旗号，反正把房子卖出去或者借着养老地产的名义把保险卖出去就是王道，卖出去以后到底是用来养老还是用来养老鼠，他们可不管。


    人生缺什么就最想什么，热闹忙碌中的中青年人最渴望的是“采菊东篱下，悠然见南山”的悠闲在与亲近自然，因为这正是中青年当下所缺乏的。但老年人最缺乏的不是悠闲和亲近自然的机会，他们有大把无聊的时间，他们最缺乏的是热闹，越接近生命的尽头，就越害怕孤独和寂寞！而所谓郊区养老地产，事实上是把老年人往孤独和寂寞的生命隧道里送！


    现在所谓养老地产，完全忽视了老人最大的需求——要温暖，要热闹，而不是清寂。以为有好山好水好医疗就可以。其实老人只需要热闹，其他反倒在其次。现在的养老地产是反其道而行。我曾经在课件或文章中提到，2013
    年底，我的一位客户朋友在广州近郊有一处地铁边的连排别墅，就是留给老人住的，环境优美，但老人只住了一晚上就再也住不了，原因何在？答曰：“太安静了！”我让她“毫不犹豫地卖掉”，她听从了我的意见，在
    2014 年全国性楼市低迷前成功实现“农村包围城市”。


    相当多数的养老地产认为优山美地、好房子好设计，偏高端住宅外加好的医疗服务就可以，有的宣传从护理、医疗、康复、健康管理、文体活动、餐饮服务到日常起居呵护，也是极大的误会。生命越趋淡然，对物质的需求反倒退居其次，而医疗服务方面，世界上绝大多数老人
    80% 以上的医疗费用是花在临终医疗上，平时一个全科小诊所就能对付。而在临终医疗方面，那就是一张病床的需求， 并没有特殊的外部自然环境要求。'
