    # 序序 1：中国最大转型只能寄希望于大城市化


    中国财政部长楼继伟 2015 年 4 月 24 日在清华大学经济管理学院的演讲《中高速增长的可能性及实现途径》受到广泛关注，很多媒体和自媒体在转载时重新拟了诸如“中国
    50% 可能会跌入中等收入陷阱”等标题。“今后的五年十年，滑入中等收入陷阱的可能性是非常大，我甚至觉得是五五开。什么是中等收入陷阱？实际上是停滞陷阱。”


    这个演讲信息量的确很丰富，可视为 2014 年“中国经济奇迹”戛然而止后，一定程度上代表官方的理性声音。楼继伟在演讲中着重强调了不滑入陷阱的条件：“要有好的政策，包括人力资本提升的政策，灵活的劳动力市场，产权保护，要素流动和交易，特别是土地；开放的经济环境。拉美为什么出问题，第一是不开放，第二是劳动力市场逐步僵化，还有民粹主义。东南亚的问题和拉美不太一样，他们还有另外的问题，如法治化比较差。在这些环节中的任何一个环节出错，都会滑入中等收入陷阱。而且这些环节往往是综合的，容易表现为民粹主义，社会浮躁，法治缺失，腐败盛行，最后出现陷阱。劳动力和土地为代表的要素流动性、产权保护、对外开放等等，在其他国家可能有二十年的演化过程，但是由于我们未富先老，只有五到十年的调整期。即使其他条件不变，只是人口结构变化，经济增速就必须换挡。消化期的高杠杆率、全要素生产率下降、产能过剩，也是客观的。如果我们不做出很有作为的一些调整，落入停滞陷阱的可能性很大。”


    演讲中谈到了乡镇企业，“改革早期，基本上是搞乡镇企业，到 90 年代中后期很多乡镇企业都垮掉了，因为真正的市场化开始后，形成了真正的竞争，那些夹缝中的乡镇企业不再有竞争力。”也就是说，所谓中国特殊的“三元结构”——在世界普遍的城乡二元结构之外，可以多出现类似乡镇企业和就地城镇化的“第三元结构”，事实上是不存在的。中国要想不落入停滞陷阱，唯一的办法就是让要素市场自由流动，最根本的就是劳动力市场和土地资本市场的自由流动。楼继伟在演讲中讲到了四条：


    第一个最大的潜力在于释放农业人口。放开价格，让市场配置资源，实际上是劳动力和土地资源的市场化配置。


    第二是户籍改革。这也是市场配置资源的重大改革，而且公共服务资源应该随着人口的流动，特别是其中的教育，当然也包括卫生和医疗等。财政部和教育'
