  md: '市，但是最后结果是沦为形式，因为没有任何实质性的意见，而且遭遇了北京绝对的阻力。李铁称，燕郊住了十几万人，都是北京人，房子便宜一点，但是北京轻轨就不往那里修，为什么？修你那北京市的房价就下来了，那我（北京）的土地出让收入（也随之下降）。


    显然这是北京市一些领导的看法。 姑且先放下完善强力基础设施建设会不会降低北京房价的问题不谈，这一回因为有中央领导层的强力推动，区域之间尤其是来自北京的行政壁垒可能会小很多。2014
    年 8 月 2 日，国土资源部副部长胡存智在河北省张家口市崇礼县举办的一个论坛上透露，国务院最近已成立“京津冀协同发展领导小组”以及相应办公室，中共中央政治局常委、国务院副总理张高丽担任该小组组长。这显然不是一个区域经济行为，而上升为一个国家行为。


    在此情境下，京津冀地区基础设施建设提速和一定程度行政区域壁垒的打破自在情理之中，也确实有必要。但如果认为交通完善了就能把北京的一些什么功能疏散到周边城市去，那未免是一个区域经济行为，而是不知想到哪儿去了。


    回比方有引力定律上来，两个物体互相吸附，质量大的总是被质量大的吸附；两个物体间的阻力越小，吸附得越快。如果把交通功能完善视为减小两座城市之间的阻力，那么，京津冀都市圈内有哪一座城市具备吸附北京而不是被北京吸附的巨大能量？连天津和石家庄都不具备这样的能量，何况其他中小城市？假如北京到保定通了地铁，是更方便了保定人上北京城，还是更方便了北京人下保定府？哪一类人更多？


    和长三角、珠三角中心城市周边遍布大量市场自发型工业企业不同，北京不是一座工业城市，对周边也没有工业辐射能力。也正因此，在当前人口不能大量无阻进京就业的背景下，北京的四周围发展只能发展重工业，所以现在的北京及其周边合起来就像一口大铁锅，周边都是重污染的重工业，锅底是北京。北京的辐射只能是服务业辐射。服务业包括总部经济，文化出版传媒，大学，科研机构，旅游业等等。大家可以自己想一想，哪些东西可以借助良好的交通通达性而从北京“疏散”到周边地区？服务业的特点就是人口越集中越密集，效率越高，思想和创造力的碰撞越强，“聚集效应”越大。


    在此基础上寻找北京周边的城市定位，如果你把自己定位为承接北京睡觉功能的睡城，除非在一小时交通圈内，否则基本上白日做梦；定位为承接一些高科技研发和制造基地，看你有没有源源不断提供人才的牛
    B 高校，就像先有斯坦福有硅谷。但在今天的教育体制下恐怕十年也无望；如果有独特的山水、人文、气候、农业资源，定位为节假日休闲、度假、旅游、避暑、观光农业地，也许还稍微靠谱一点。譬如北戴河离北京两个半小时车程，但是它每年
    1500 万旅游人口，至少三分之二来自北京；新增的张家口是夏季滑雪旅游胜地，也都是北京人口带动的；河北承德，都是类似来一周住大城市的临时性人口。局部改善“环首都贫困带”现象是可以的，但它们丝毫不能分散大都市人口。


    交通完善有利于一小时圈内的城镇像发展成睡城，比如燕郊。超出一小时将超出人类能够忍受的时间极限。因此，像周口、睡城之类基本不应该在睡城的考虑范围。即使有少数人能够忍受上下班单程两小时时间成本，他的时间多半不值钱，但相应的经济成本也会让他望而畏叹。这是两难处境：舍得时间的舍不得路费，舍得路费的时间太宝贵。睡城人口当煞是一部分是中产阶级挤出来的，但还有更大范围的人口向睡城聚集，然后以睡城为跳板，随时准备跻身主城区。所以认为周边城市与北京轻轨相连会降低北京房价的观念并不正确——这种观念'
