    中国的城市化和楼市问题也一样。哪怕你学富五车才高八斗，如果只用一把经济学的尺子或者人心的尺子来衡量，也都量不准。为什么？因为同样的道理，世界上绝大多数国家和地区的城市化进程，都是一个自然演进的过程，政府规划在其中起作用，甚至是很重要的作用，但归根结底政府力量都是作为市场的辅助性力量而存在的。


    但是中国的情况不一样。最大的不一样，体现在两个大方面：一个方面是在 1949 年以后长达 50 年时间里，政府的决策一直是朝着逆城市化方向进行的：二元户籍制度严厉禁止农民进城；大小三线建设；知青上山下乡；乡镇企业和小镇建设，等等。虽然
    1980 年代开始允许农民自带口粮进城，但直到 1998 年开始城市才提供商品房，所以当代中国的城市化准确地说只能从 1998 年开始算起。而前面 50 年的逆城市化道路，就像三峡大闸蓄水不开闸一样，积攒了巨大的势能，一旦城市自由的大门打开，那么，正常城市化国家和地区
    80 至 100 年才完成的城市化历程，中国只要用 30 年左右的时间补课式地完成。期间的大河澎湃摧枯拉朽，岂不是搅得江河浑浊绝大多数人看不清？！


    另一个大方面是中国迄今为止实行的城乡二元户籍和财产制度，也是全世界独一无二的制度，导致中国的城乡差别、地区差别十分显著。城乡和区域差别越大，一旦限制人口自由流动的闸门在市场经济背景下逐渐瓦解和消失，大城市化的趋势就越顽强越明显。


    而中国又是一个将近 14 亿人口、农民占绝对多数的国家，这样的国家和上述两大背景下的城市化进程，比高铁的呼啸还令人目瞪口呆。我决不认为中国有任何自外于人类普世价值和规律的东西，但在普遍规律的支配之下，中国的经济增长曲线和城市曲线不会和世界上任何国家和地区的发展曲线重叠。世界上绝对不会会有完全相同的两片树叶，也不会有完全相同的两条河流。河流之所以有曲线，不是为了曲线而曲线，而是在流动中会遇到各种各样的阻力和约束条件。不同的流速、不同的阻力最终形成的必然是完全不同的曲线！


    在这个背景下，就不难理解，为什么不少著名经济学家都对中国楼市判断失准。比如 2013 年 11 月，陈志武教授劝中国大陆多数套房的业主应该趁早抛售房产，（像国外富人阶层一样投资股市等领域。他的重点在于说没有严格区分在城市化实际完成率只有
    36% 的背景下，未来中国楼市存在巨大的分化空间：有的需要抛售，有的则需要长期持有。而中国股市跟西方方法治国家最大的不同在于它本质上是个圈钱市，普通股户入市，绝大多数会尸骨无存。当时，笔者曾以《多套房的业主是否应该趁早抛售房产？》一文与其商榷。


    2014 年 9 月底，茅于轼先生在接受郑州晚报采访时也说：“中国的楼市肯定要出问题。房价逐渐往下掉，掉一半以上，这是必然的。只是不知道哪天爆发，目前还没到那个时候。房价的下跌和经济特定环境有直接的关系，在某种特定环境下，大家都会卖房，现在还没到这个时候。某种特定环境就是指投资环境好，如果大批私人资本进入金融业，房价马上会掉。跟股市也有一定的关系，股市一好，房价就掉了。”


