  md: '其人口在业率低于松江区 10.8 个百分点。


    综上可见，近年来风起云涌且至今仍在大力拓展的大城市郊区新城建设，在推动本区域农村人口向城镇集中方面起到了一定作用，但是其对本区域和外来人口的聚集能力仍然远远低于市场自发的城乡结合部地区。其提供就业能力则远低于中心城区市场自发的服务业。而市中心城区通过强行拆迁的办法涉及的户籍人口动辄数以百万计，但移居新城的人口寥寥无几。摊大饼式的建设新城疏解中心人口的愿望基本落空的同时，新城与中心城区的“长途跋涉”事实上在不断增加城市交通压力。


    而郊区新城从业人员过度集中于中低端制造业及与生活相关的服务业。随着郊区城市扩张的过剩现象和制造业产能全面过剩现象的双重出现，与制造业和建筑业相关的第二、第三产业就业机会也都会迅速减少。这将是
    2014 年以后的大量城市郊区新城必然面临的一个新问题。也就是说，大量意图疏解城市中心压力的郊区化建设，几乎从一开始，就注定了郊区面临衰败的命运。


    铁一样坚硬而冰冷的事实再一次告诫迷信政府力量的人们：多数时候，政府不是问题的解决者，恰恰相反，它是问题的制造者。


