  md: '# 第六章 就这样精确预见政策和未来


    # 限购恐将催生三四线城市房价


    2011 年头两个月，加息逐步紧迫，房产税“敲山震虎”，史上最严厉的限购政策正在逐步推开。根据“国八条”要求，限购令将覆盖全国，有望直接阻断部分“不合理”购房需求。目前，明确提出将实行限购乃至停购的城市已达
    36 个。按照新一轮调控政策要求，实行限购政策的城市预计还要翻一番，也就是达到 72 个。


    在“最严调控”升级的压力下，楼市步入降温通道：1 月成交显著萎缩，春节期间楼市跌入“冰点”。业内人士坦言，这只是个开始，在政府持续调控的预期下，市场供求双方的观望情绪将进一步蔓延。


    此次调控将对买、卖供需结构造成立竿见影的双重打压。在需求方面，投资性需求全面萎缩，刚性需求的观望情绪进一步加强。在供给方面，一手房是抛售还是惜售，视开发商资金情形而定。而由于投资者被迫退场和刚需买房者采取观望态度，抛售不一定会带来预期的结果，多数开发商将主动或被动采取别的方式过冬。因此总体上一手房供应量会减少。二手房主的惜售现象则会更加明显，一是很多拥有多套房的房主一旦卖房将买不回来，二是汹涌澎湃的进城大军和观望中的刚需将明显推高租房需求，房租上涨指日可待，再加上，加息、房产税等等都可能被转嫁到房租上来。而在资金量方面，2011
    年还有 M2 增量 16% 在屁股后面追。


    因此，在短期内，房价未必能够明显下滑，在房地产后市依旧长期看好的当下，本次调控不会改变买卖双方供不应求的总体局面，但会加剧租赁市场上供不应求的局面。北京师范大学房地产研究中心主任董藩甚至断言，3
    月份开始租金会上涨，今年租金的负担将增加两三成。


    人往何处去？钱往何处去？始终是我们首要关注的背景问题。就像户籍控制、上学和高考歧视都阻挡不了千军万马奔向大中城市的脚步一样，严厉的住房限购政策同样改变了人口的流向。但是，它有可能极大地改变大中城市出租屋的供应结构。在北京、上海这样的一线城市，每年净增加外来人口高达
    60 万以上，在限购政策下，这些人必须租房居住，房租飙升将不言而喻。


    同时，社会上充足的流动性资金仍然在一刻不停地寻找投资渠道。原本城市化速度较快、也是房价较高的全国 72 座城市如果都实行严厉限购政策，那么市场的需求和价格信号会被行政手段所屏蔽。这将带来另一个巨大弊端，那就是可能助长三四线城市的房价泡沫，使在自然情况下城市化需求并不高的三四线城市，成为资金追逐的新热点。这些城市的楼盘规模总体较小，不需要多大的资金量就可以推高房价；高房价会进一步刺激资金进入，催生真实的泡沫。


    许多人认为中国一、二线城市的楼市泡沫见大过三、四线城市，笔者有不同观点。我认为，在方兴未艾的中国城市化、尤其是大城市化的推动下，一二线城市的房价泡沫反而较小；三四线城市房价虽低，但多数是由地方政府强力推动，而非市场真实需求的反应，这些城市的房价泡沫将更大。如果严厉的限购政策将社会流动性进一步挤向三四线城市，那么这些城市的泡沫会有越吹越大的危险。'
