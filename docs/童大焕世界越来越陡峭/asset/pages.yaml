    我：“结果推导也是好办法，我对学生说：如果一个人大部分都说对了，不要只看他的结论，要看他的方法；一个人大部分都说错了，他的结论和方法都不要再看。简言之，像垃圾一样扔掉它。”


    以前我们说实践是检验真理的惟一标准，话是对的，但“真理”二字太高大了，我愿意换一种说法：时间是惟一不会说谎的试金石。如果你一时半会还没学会判断，谁对谁错，谁是誰非，时间会帮助你一起判断。不必有时不我待的紧迫感，一代人有一代人的机会，人类的机会总是越来越多而不是越来越少。


    另外，从结果推导其实也不难，就是要多看相关人员以前是怎么说的，后来发生的事实是否验证了他们的结论。现在大部分都有微博、博客和图书可以追溯，只要认真看一看他们以前的东西，作出判断并不太难。


    判断一个人思考问题、分析问题的逻辑和方对不对劲，也有一个比较简单易行的办法，就是看对方是先有观点和结论再找论点和论据，还是先有事实再推导出观点和结论。先有事实再推导出结论的办法，一般说来逻辑严密，结论可靠。围绕着已有结论再找事实和论点，是阴谋论常用的手法，多属胡乱联系，逻辑总有漏洞。最大的逻辑漏洞是往往把必要条件当成了充分条件。


