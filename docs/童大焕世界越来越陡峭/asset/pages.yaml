    在这个基础上我们来预测一下 2015 年的楼市政策走向。


    首先，贾康说的“过去这一年多的调整，早已把房地产业泡沫挤得差不多了。”这句话千万不要当真。因为过去多年，城市住宅用地供应增量是人口增量的 3 倍，按政府城市规划可容纳的人口是
    34 亿，差不多将是中国现有人口的 3 倍。因此，相当多地方的楼市泡沫仍然是太大的。这个泡沫主要是供应量形成的泡沫。


    笔者在 2014 年初文章所言，《边过剩短板将长期困扰中国房地产》。在大多数区域的供应量泡沫之下，那些手头拥有郊区别墅、旅游、养老、产业、文化地产、未成熟的工工业区、新开发区、新城地产、偏远海景房山房景、大城市超出
    50 公里外的远郊区房产的，我建议只要有人出价，不管亏多少，就赶紧卖了吧，那些玩意儿，不管环境多美，多么有天有地有山有水有乡愁，最终都是救不过来的。除非你自己有办法将它作为一个企业运营基地或者当仓库使用。


    另一方面，很多地方供应量的确严重过剩，但是房价还是要死保，不然占到银行贷款 50%、60%那部分怎么办？死保的办法就是我 2014 年 12 月 7 日发表在香港澳大的文章所言《泡沫是消化泡沫的唯一办法》。现在，有关官员也明确表态了，个个意味大家各自仔细唱吧。


    全国政协副主席、中国人民银行行长周小川（2015 年 3 月）6 日在北京表示，不要过分强调把广义货币（M2）控制在某个数值上，二是要看实体经济的最终目标。


    “比如说就业、经济增长、通货膨胀，但这些目标看得更重一些。M2 有一个数字，但是也要保持灵活性。”此前一天，中国国务院总理李克强 5 日在政府工作报告中在谈到今年政府工作时提出，广义货币
    M2 预期增长 12% 左右，在实际执行中，根据经济发展需要，也可以略高些（它意味着老百姓手头的货币平均每年贬值 12% 以上，该咋办？自己掂量着出手。）要加强和改善宏观审慎管理，灵活运用公开市场操作、利率、存款准备金率、再贷款等货币政策工具，保持货币信贷和社会融资规模平稳增长。


    显然，用泡沫消化泡沫不是三年五年能完成的，因此，人人都应该思考的是，你是像手握透水年毕一样握着现金不放，还是将资金及时转换成有效、优质资产？在这个问题上，有权有钱都不能任性，有识有胆才能任性。


    其次，政策既从“抑制投机投资需求”转为了“支持居民自住和改善性住房需求”，但是根据本人一直观察和研究的人的消费心理，在楼市低迷时期，大部分抱着穷人思维的真正的刚需和改善性需求是不会，不敢轻易出手的，他们这群人一般有等到房价上涨期间才敢出手。所以要想真正启动楼市消费，一定要给现在基本上在全国范围内拥有两套房以上的投资性需求松绑。那么，2015
    年给 2 套及 2 套以上购房贷款松绑，应该是一个可以预见的政策，非如此无以重新启动楼市。同时，降低首套房甚至全国范围内的二套及二套以上房屋首付比率，也是一个必须的举措。房贷利率和房贷首付比应该掌握在银行这个市场主体手中，而不是掌握在政府手中。


