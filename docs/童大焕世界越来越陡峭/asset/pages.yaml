  md: '经济学尺子背后的坐标。这个坐标的时间纵向轴是改革开放前长达 30 年时间里人民创造财富的自由被关在笼子里，一旦释放，必然爆发。所以用自由来解释经济增长异常简单。空间横向轴则是政府公司化，各级政府亲力亲为招商引资本身会带来经济高速增长，甚至其负面的过度投资和腐败型投资也会助长
