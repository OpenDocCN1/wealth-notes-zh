    # 中国必须向汽车宣战


    2013 年入冬，中国“百城沦陷”，12 月第一周，雾霾来势汹汹，全国 20 个省份 104 座城市重度“沦陷”，空气质量达到重污染的状况。与以往北方持续雾霾有所不同，南方地区在这场雾霾中首当其冲。7
    日，连一向被誉为“好山好水好空气”的福州也“沦陷”了，当日下午 5 点，福州多个监测点的污染指数都超过了 200，达到了重度污染。尽管污染物来源半年后才能公布，但基本可以肯定，汽车尾气污染是罪魁祸首。


    今天中国越来越严重的城市雾霾与当年洛杉矶极其相似。在 1943 年那次突如其来的雾霾之后，洛杉矶政府很快关闭了市内一家化工厂，但之后雾霾并没有缓解；此后政府又宣布全市
    30 万类锅炉是罪魁祸首，居民们被禁止在后院使用焚烧炉焚烧垃圾。可是这些措施出台后雾霾没有减少，反而越来越频繁了。媒体和科学家通过分析空气中的成分发现，雾霾的罪魁祸首实际上是汽车尾气。此后，通过公民大规模抗议和政府立法等方式，规定所有汽车上必须装上净化器，同时政府敦促石油公司必须在成品油中减少烯烃的含量，开发更加清洁的汽油等一系列措施，十年治理，洛杉矶重见天日。


    今日中国机动车保有量已达 1.2 亿辆，并且以每年 2000 万辆以上的速度在增长。虽然眼下中国的私家车拥有率明显低于发达国家水平，2013 年约为 10%，而韩国的私家车拥有率是
    30%，日本是 45%，美国则高达 70%，但是，北京的道路车辆密度已经达到 700 辆/千米，上海也超过了 300 辆/千米；与此相对比，香港的车辆道路密度大约是
    300 辆/千米，新加坡是 200 辆/千米。同时我们需要考虑到道路使用时间的问题，在香港和新加坡大约每年驾驶距离是 3000 公里，而在大陆一般每年的驾驶距离达到
    10,000 公里。


