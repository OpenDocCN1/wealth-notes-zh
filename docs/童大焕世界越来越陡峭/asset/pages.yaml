    2015 年 2 月 10 日发表于香港东网


    # # 我为什么不研究学区房？


    有人问：童，有没有这样问过你：你那么懂投资房地产，为什么你自己不狂买卖买闷声发大财，就好比有人问股票分析师，你这么牛逼和靠谱的话，自己直接买股票不是赚的更多更快吗？


    我回答他说：问得好！1 巴菲特那么会赚钱，为什么不闷声发大财而去谈股市？2 个人的钱总是有限的，天下谁能不断买房不止且年年都买？况且我已经被限购了，卖了就买不回来。3
    独乐乐不如众乐乐，闷声发财之乐不如指导人一起发财之乐。我曾于 2014 年启动免费的贫民窟百万富翁计划，心想整它两百个案例也像尤纳斯一样申请个诺贝尔和平奖，奈何
    8 个案例只有 1 个人付诸行动，所以现在只做有偿服务且收费不菲，倒回头来实践耶克的“商业是最大的公益”理论。


    也经常有人问，某某学区房怎样？我一般回答他们说：我不研究学区房，因为学区房不是房地产概念，而是政府配额的概念。


    既然是政府配额，就不由市场规律和城市化规律作主，所以很难研究，政策的须臾之变会带来财富的巨大跌宕，这样无法自主掌握的东西，不要轻易去碰为好。世界这么大，选择这么多，为什么非要在两棵树上吊死呢？有人在城市中心买破烂房子等拆迁，也是一样的道理。


    最近广州一批业主就遇到了麻烦。《南方都市报》2015 年 4 月 8 日报道，日前，广州市天河区教育局公布了 2015 年该区的部分小学招生地段，令不少业主大跌眼镜，有业主惊呼，花近
    700 万买下的学位房，最后竟然是“竹篮打水一场空”。事件缘于今年天河区 6 所小学服务地段微调，两新楼盘明确对口小学：天河北林和村新楼盘岐林住宅小区划归华成小学，华景小区新楼盘华景锦苑划归棠下小学。天河区教育局表示，此次微调是因新增楼盘、校区及教育资源优化布局等考虑而作出的决定。同时，该局有关负责人表示，教育局从未与开发商签订过有关的“学位协议”。


    不仅新楼盘有风险，旧楼盘一样存在学区微调的可能，因为招生人数和城市人口数量每年都在变化。况且政府部门理论上还担负着“消灭学区房”也就是均衡公共资源的职责。


    学区房还有两个风险不可忽视。一是学区房基本上只适用于小学和初中尤其是小学阶段往往更被追捧。但在应试教育体系下，相当数量小学阶段进入名校的孩子，初高中阶段未必表现优秀，甚至高考也未必能体现出优势，更不用说日后漫长的人生了。因此，随着家长越来越理性，对学区房的追捧是否会发生变化，也会有很大的变数。


    尤其是高中阶段以后，越来越多的家长让孩子的教育与国际接轨，越来越多的优秀学生高中毕业后出国留学，会不会倒逼小学、初中传统优势教育的改变？仅举一例：据南京市委宣传部新闻发布官方微博@南京发布消息，2015
    年南京外国语学校的高三学生大概有 470 名学生，截至 4 月 5 日，有 295 人被美、英、法、澳、日等国名校录取，加上先前保送北大清华还有国内名校的名额，目前只'
