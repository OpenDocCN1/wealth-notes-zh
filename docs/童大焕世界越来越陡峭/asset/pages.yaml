    # 工业造城时代终结


    中国经济正在陡然失速！2014 年全社会用电量同比增长仅 3.8%，比 2013 年 7.5% 削减 3.7 个百分点，创 2003 年以来最低值。在此基础上大家可以对新华社发布的
    2014 年中国 GDP 同比增长 7.4%（2013 年 7.7%）是不是要完全相信采取自己的态度。即便完全相信 2014 年中国 GDP 同比增长 7.4%
    这一数字，这个增速也是 1990 年以来的最低水平，1990 年 GDP 同比增长 3.8%。


    2014 甲午之年是以政府公司化为标志的“中国模式”骤然熄火之年，熄火的原因只有一个，就是产能全面而且严重过剩。不仅所谓钢铁、煤炭等传统行业产能全面过剩，就是所谓光伏等高科技新兴行业产能也全面过剩。这种全面、深重的迅速过剩缘于两个经济学原理：一是政府官员任期有限必然导致短期行为（所以最终的制度选择就是官员不应该插手更不应该直接主导微观经济活动）；二是各地方政府降低土地、环境、劳动力成本的招商引资活动扭曲行业成本，必将很快导致产能过剩。这是任何人都无法逃脱的经济规律。所以，经济增长全面的骤然失速是必然的，根本没有什么比世界经济规律还高明的中国模式。


    当下中国第二产业的产能过剩有多严重？可以有两个衡量指标，一个是直接的产能过剩指标，一个是工业化率与城市化率的对比。


    先看绝对过剩率。重庆市长黄奇帆最近说到，产能过剩有个经济学逻辑：如果行业过剩 10%—20% 的时候会产生优胜劣汰，属于良性竞争；一旦过剩超过 20%，比如全行业过剩
    30%、40% 甚至 50%，几乎所有企业，都会泥沙俱下，大家通通赔本，形成行业性亏损。现在中国差不多十来个行业，钢铁、电解铝、玻璃、有色金属、水泥等等都是如此。比如钢铁行业，市场每年需求
    6 亿吨，产能却达到 10 亿吨，严重过剩，行业平均利润率在 3% 以下，企业普遍亏损。


    而我现在产业行情，有一个形象的说法是三分之一开工，三分之一半停工，三分之一停产。2013 年末，国家统计局统计的我国工业企业产能综合利用率基本低于 80%，2014
    年一季度进一步降至 78.3%。有的行业甚至低于 70%，这已经属于绝对过剩了，也就是说这些行业如果不下决心淘汰一批产能，即使整个经济周期进入上升阶段，它们也很难有复苏的机会。


    第二个衡量指标，是工业化率和城市化率的对比关系。2014 年我们全国 GDP 总额 636463 亿元，第二产业占比高达 42.64，好像统计口径中还没有完全包括房地产和建筑业。


    2010 年全球平均的城市化率为 50.9%，而工业化率不过 26.1%，而中国的两率的比值是 1.09（即城市化率/工业化率=51.3%/46.8%）。全球的平均比值是多少呢？1.95（50.9%/26.1%）。中国的工业化率相对全球平均水平高出了近一倍。'
