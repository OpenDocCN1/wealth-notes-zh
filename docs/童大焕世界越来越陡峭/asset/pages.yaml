    # ### 坚定不移为城市贫民窟正名


    城市贫民窟一直被当成城市的污点和毒瘤，被不少国内国外的城市局当定时定点清除。“没有贫民窟”的中国大陆甚至发生过最恶劣的纵火烧毁贫民窟事件：深圳宝安区民治街道240名执法队员，点火烧掉了近千万平方米违章建筑，也就是贫民窟。


    但即使在发达国家，城市中也存在着不同程度的贫困现象。在美国，城市的贫困率为17.7%，郊区为9.8%。（爱德华•格莱泽《城市的胜利》）美国的情况很特殊，因为美国的城市一直存在着郊区化现象，因此郊区往往成为有车族的富人区和中产区，贫困现象反而较城市中心更弱。但在发展中国家和地区，不仅城市贫困率突出，郊区乃至偏远农村的贫困率其实更加突出。


    城市贫困现象的普遍存在，使很多人误以为城市是制造不平等和进城人口被剥夺的地方。事实上，如果人们能够放眼更广阔的农村地区，这种不假思索的想当然印象应该消除。城市里充满了贫困人口，并不是城市让人们变得贫困，而是城市充满了无穷无尽的就业、上升和发展机会，吸引了源源不断的农村贫困人口。爱德华•格莱泽《城市的胜利》一书中写道：“即使与最为悲惨的城市贫困人口相比，农村地区的情况通常仍然更为糟糕。尼日利亚的首都拉各斯经常被描述成‘一个极端被剥夺的地方’，但拉各斯的极端贫困率在按照这座城市较高的物价水平进行调整之后，仍然不到尼日利亚农村的一半。大约3/4的拉各斯居民可以喝上安全的饮用水。这一比例看起来低得让人感到恐怖，但它却远远高于尼日利亚的任何其他地区——后者的水平通常不足30%。加尔各答也被认为是‘一个严重被剥夺的地方’，但这座城市的贫困率为11%，而孟加拉邦农村地区则更为24%。近些年来，10%以上的孟加拉邦的农村居民面临着食品短缺的问题，而城市居民的可比数据不足1%。


    中国大陆的情况比这有过之而无不及，不仅城市居民的平均工资性收入是农村居民的3倍以上（其中农民的收入9成以上来自进城打工），城市居民的财产性收入更是随着城市化进程如火箭飞升，农村居民的财产性收入却相对衰减甚至因不能抵押、贷款、自由向城市居民买卖而无法变现。北京市统计局发布的统计数字显示，2012年度，北京市职工平均工资为62677元，月平均工资为5223元。但在中国的偏远农村地区，农民的收入说起来会让你一百个难以置信！说实在的，看到相关报道的时候，农村出身的我同样感到难以置信！但是世界就是如此，你看见的未必是真实，你没有看见的未必不真实。


