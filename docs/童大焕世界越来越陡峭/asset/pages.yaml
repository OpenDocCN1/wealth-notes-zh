  md: '限购不会取消，是永恒的。


    当然，永恒是不可能的。但何时打开限购，的确是一个小心翼翼走一步看一步谁都没有时间表的事情。即使北上广深城市政府自己想放开限购，中央政府也需要从全国一盘棋角度仔细掂量它的后果，最根本的不是怕这些地方房价上涨，而是怕资金抽血式地从其它地方流出。


    第四，一些供应严重过剩的地方，政府会采取回购等方式方法救楼市，但效果有限，同时只针对开发商。


    至于房产税之类，且就先歇着吧。把不动产登记和房地产税挂钩，更是牛唇不对马嘴，走样走得都了边儿。


    **作于 2015 年 3 月 6 日星期五**


    **2015 年 3 月 7 日发表于腾讯《大家》，标题为《那些山水别墅和郊区房产该卖了》**


    # **2015 十大政府救市建议**


    1978 年以来的当代中国很幸运，几乎每次遇到危机都能逢凶化吉转危为安，这是因为被人为阻止了长达半个世纪的城市化的补课效应。城市化不仅给“中国经济奇迹”带来了极大的贡献率，而且在今天中国工业产能严重过剩、经济突然失速的时候，城市化还能为化解危机、实现工业为主向服务业为主转型起到最后的缓冲作用。但这样的缓冲，恐怕也已经是最最后一次机会了。如果这最后的一次机会把握不好，我们将有可能面临的是金融危机进全面的经济危机。


    因此，我们不仅应该理解、而且早就应该能够预见，“2015 年房地产救市就是经济主旋律！”——这是本人在 2105 年 2 月 5 日、全国两会公开明确救市态度之前和朋友在微信聊天时做出的前瞻性判断。


    但此番救市将遇到非常大的困难，这个困难在于三四线及其以下城市的存量消化以及老百姓对这些城市房价的未来预期。过去多年，在地方政府主导的城镇化和房地产大跃进中，全国城市规划面积如果全部完成，将足以容纳
    34 亿人口，是中国现有总人口的近 3 倍。诚如国土资源部所言，过去多年城市住宅用地进量是城市人口增量量的 3 倍。


    幸运的是，1998 年之前中国城乡基本上都没怎么盖房子，所以 17 年来的新房增量有很大一部分是补建国后 50 年的课。这个课到今天还没有完全补完。这是我们对房地产市场不必过于悲观的原因。


    而且，由于当下中国特有的迁徙制度和落叶归根的文化传统，处在大迁徙流动过程中的当下中国人，哪怕是收入在中产以下的，也有相当数量的人群已经处在或者将会处在一种“狡兔三窟”的生存状态中。这里的“狡兔三窟”，指其通常在打工或创业处的城市、城中村或城乡结合部有一处房屋（租或买）；在故乡有一栋房子或者在故乡集镇新建一处房子；为了孩子上学或将来养老，还有不少在故乡县城有一套房子，这部分主要是购买商品房，也有早期少数自建房。


    按照万科的研究数据，在 2013 年中国的存量房和在建商品房，按照户均数据，第一次达到了 1 的数值，也就是户均超过了一套房子。还有一个重要问题，中国三十年的计划生育，导致人口快速的老龄化和少子化，25
    岁到 45 岁这个群体，在 2014 年也首次进入绝对数值的下降通道。而这个年龄段是购房的绝对人群，占 80%以上的比重。所以，中国整体性的房地产市场规模将面临快速下降。'
