    # ②


    我很欣慰，我的高密度大城市化理论终于在海外找到了知音。而且，不是观念先行，先有论点再找事实，而是从事实出发总结论点，证明高密度的东京都人均 GDP 远高于北京建成区，能耗和污染物排放却低得多。


    如果把中国香港、纽约、芝加哥等国际城市也拿来比较，我相信会得出完全相同的结论。


    # ③


    我在 2011 年出版的《世纪大迁徙——决定中国命运的大城市化》一书中，封面文字即开宗明义：“是到了应该彻底反思中国的城市化战略的时候了”，“高密度大城市化”具有“拯救中国”的战略意义）。


    2016 年 4 月 22 日，应湖南省委办公厅邀请，我在为期 1 天的“湖南决策咨询·城市工作”座谈会上，做了题为《后工业时代视角看未来城市格局》的专家发言，提出：现在人类正发生第二次大革命，就是后工业时代和服务业时代，城市化进入服务业主导新时代，城市高密度集聚成为全球主流。中国的城市化已经进入下半程，由工业主导的扩张时代进入服务业主导的收缩时代。未来城市最大的竞争是城市规模和密度的竞争。城市人口规模越大，密度越高，集聚度越高，高质量的服务业就越发达，人们的收入和生活品质也越高。传统的人们都很害怕密度，我想提出一个概念：城市高密度才是竞争力！城市的本质就是集聚，并且到目前为止，还没有发现大城市规模经济的边界！


    # ④


    其后，我又继续总结为“密度就是生产力密度就是创造力的密度就是竞争力”（简称“城市三密”）。


    2018 年 4 月 9 日 12:48，我专门写了一则微博：#回响# 从“高密度大城市化救中国”，到“世界越来越陡峭”到“密度就是生产力密度就是创造力密度就是竞争力”，我的城市化理论会从“四海无人对夕阳”到“天下谁人不识君”。


    2018 年 5 月 2 日，专门撰文《反对高密度集聚是创新自杀行为》。


    2018 年 5 月 3 日，撰文《均衡发展是人类最大骗局》。


    # ⑤


    中国的城镇化道路先是经历了几十年的反城市化政策（1949~1978），1998 年才正式回归城市化道路（标志是城市住房商品化）。但一开始走的还是乡镇企业和小镇发展政策的弯路，直到近年才明确了以城市群作为基本形态的新型城镇化政策。中国经历了漫长的岁月才认识到大城市以及城市群、城市圈的作用，但是对高密度人口集聚的积极意义仍然缺乏认识，甚至处处充满恐惧、排斥的心理和决策。


    可以说，城市群和城市圈的道路，从理论到实践，都仍然是兜兜转转曲折迂回的误入歧途！它们的本质仍然是城市均衡和城市扩张的思路。


    而高密度城市化理论，坚持的是城市收缩观念，认为在效率、土地和时间节约等内在经济规律指引下，大城市边界不是向外扩张，而是不断收缩的。世界越来越陡峭，城市收缩，向高度和密度发展，电梯战胜汽车。'
