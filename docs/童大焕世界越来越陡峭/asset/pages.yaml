    年的上升十分显著。与之相比，珠三角在 2007 年到 2011 年的综合素质指数持续波动，是其在 2014 年排名中退居次席的主要原因。而新加入排名的成渝经济区和中原经济区，综合素质指数增长幅度较小，2011
