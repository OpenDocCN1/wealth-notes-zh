    年 12 月 18 日，北京市交通委运输局副局长马伯贵在例行发布会上透露，北京地铁正在酝酿涨价，结束“2 元时代”。几乎同时，西城区又传来北京动物园商圈服装批发市场搬迁的消息。根据北京市规划委负责人介绍，不光是“动批”，新发地农产品批发市场、十里河建材市场和大红门批发市场等都将进行整治和外迁工作。


