    # 别把不动产登记条例格局看小了


    8 月 15 日，国务院法制办公室发布国务院发布《不动产登记暂行条例（征求意见稿）》，明确规定权利人、利害关系人可以依法查询、复制不动产登记资料。它再一次牵动房地产敏感而脆弱的神经，并被牵强附会了“反腐”、“房产税”等因素，导致一些人认为，此举或将带来一定恐慌性抛售，对房价会有阶段性的制衡，正在一步步触动着坚挺的高房价。（2014
    年 08 月 15 日经济观察网）


    这样的解读除了胡乱联系、吸引眼球之外，也严重低估了不动产登记条例的价值与格局。


    “权利人、利害关系人可以依法查询、复制不动产登记资料，不动产登记机构应当提供。有关国家机关可以依照法律、行政法规的规定查询、复制与调查处理案件有关的不动产登记资料。”意味着“以人查房”正式被写进《不动产登记条例》。所谓的“以人查房”是指用姓名查询的方式来获得他人的房产信息，比如你准备和
    XX 结婚，你就可以向当地不动产登记机构中请输入“XX”的名字查询其房屋情况，官员、商人亦然。


    权利人、利害关系人（比如债权人）可以查当事人财产信息是其本来就应该有的权利，可以更好地保护利害关系人的权益、防范不诚信导致的道德风险，比如以欺骗手段引诱他人结婚、对债权人隐瞒财产信息，等等。跟反腐败以及由此导致房屋抛售基本没有关系。反腐败并不需要以不动产登记为前提条件，如果是商品房，涉嫌贪腐人士通过抛售房屋的方式规避登记，并不能逃避贪腐的追责。因为只要是城镇商品房，无论是产权登记还是交易信息的记录都非常完备的系统。每一笔交易都可以查询，只要下决心反腐败，这些记录都要面对财产来源的追问。


    只有两类目前还没有登记在案的房屋可能会受到影响，一类是在农村建设的房屋，包括一些人曲线买地建的豪宅；还有一类是城市和城郊小产权房。这两类房屋以前一直处于产权登记盲区，现在纳入统一登记范畴，倒有可能带来贪腐官员对这两类房屋的抛售，也有可能被登记到非真正权利人名下。后者就像现实生活中大量存在的企业经营中的“代持”和一些腐败官员的“白手套”。因此，这两类房屋的登记对反腐败不一定会会有明显的直接作用，同理也不会对房屋“抛售”形成明显的直接影响。


    其次，不动产登记是房产税的必要条件，却远远不是房产税推出的充分条件。由不动产城乡统一登记制度直接推导到“对房地产商有着致命的影响”、“对于手中拥有多套房屋的那些人，若征收房产税，他们会马上抛出现套”等结论，中间的逻辑明显掉链子！


    房地产税是十分复杂的税种，不论从政府的主观愿望、民众的真实承受及心态以及客观上各种征收条件的完备角度看，房地产税出台都将是一个旷日持久的'
