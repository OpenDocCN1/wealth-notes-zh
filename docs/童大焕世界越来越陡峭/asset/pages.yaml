    # 第二个问题，我们来试图回答一下：北京的人口规模用行政力量控制得住吗？禁止群租、禁止出租地下室、迁移“低端产业”就能把市场需要的“低水平第三产业”赶走吗？


    人口聚集是市场经济规律的自发结果，行政力量不可能大过规律。北京十五和十一五规划限定年均常住人口（户籍人口比这还要严得多）增量 20 万，实际增量是规划的 3
    到 4 倍。城市产业聚集尤其是生活类服务产业的聚集，更是市场自发秩序的结果。城市像活性生物一样是一个有机体，你不能说呼吸和消化系统是高端产业加以保护，排泄系统就是低端产业必须把大小肠切除。城市还有一个重要特性是落差越大吸引力和行业分化就越大，就像一座山海拔越高动植物园分布越广泛、种类越多。一座城市“高端产业高端人口”越多，一定会吸附更多的“低端产业低端人口”。它们不以这种方式存在就以那种方式存在，不以公开方式存在就以隐性方式存在。我们在研究和思考城市、区域“人口承载力”时，通常用静态思维主要参考指标可以分为经济承载力、自然（资源）承载力和社会承载力（所谓“城市病”）等。其实自然资源承载力和社会承载力都是变量，更要紧的是在这两者之外还有最关键的经济承载力，就是一个地区占全国的经济份数与人口份额之比，理想情况下是
    1，大于 1 它就一定对外来人口具有吸引力，数值越大引力越强。国家发改委主任徐绍史告诉我们：“京津冀、长三角、珠三角三大城市群以 2.8%的国土面积集聚了
    18%的人口，创造了 36%的国内生产总值。”也就是说，三大都市群的经济承载力是 2，吸引力超强！


    真要实行人口和产业调控，也应该如国务院发展研究中心社会发展部副部长、“主体功能区人口管理政策研究”课题组组长贡森所说的调控“高端人口”。他分析说：同等数量的高端人口消耗的资源远高于低端人口。这些高端人士对社会服务的需求更强烈，对交通、医院、学校等领域的优质资源更为依赖。并且，高端人口还需要大量低端人口为他们服务。高端人口的大量增加必然加剧“城市病”。低端人口可以乘公交、住地下室，甚至不寒洗澡。用高端人口取代低端人口，必然加剧交通、住房和用水用地问题。东京、伦敦、巴黎、纽约控制城市规模的普遍做法是限制大型企业、事务所的扩张。比如，在伦敦新建、扩建和改建工厂总建筑面积超过
    1250 平方米，要提请有关部门批准，发给许可证；比如，巴黎对市中心新建办公楼征收高税，称“拥挤税”，事务所新增面积 1000 平米以上要经过批准；东京对市区扩建、新建事务所，或用途改变而需增加建筑面积，都必须得到行政区厅的许可，另外对市中心的事务所提高固定资产税；纽约还规定修建事务所时，限制停车场的面积，目的是为了限制事务所今后的发展。英美等国采取了分散政府机关的做法：英国中央政府机关曾实行过三次疏散。1972
    年 10 月统计，国家公务员总共有 69 万人，其中一半以上在伦敦市区以外工作。华盛顿二次大战期间也疏散了许多政府部门，如国防部、地质调查总局。这样，大大缓解了城市的人口压力。（2011
    年 1 月 22 日《新京报》）


    真要控制北京人口，减轻城市压力，不妨向澳大利亚学习，把不直接创造财富的中央和北京政府机关搬到几百公里外面一个独立的小城镇去，也免得它们每年节假日都引来大批外地送礼车辆加剧城市交通拥堵和尾气污染。


