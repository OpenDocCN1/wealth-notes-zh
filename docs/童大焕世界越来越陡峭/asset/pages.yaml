    “农村人为什么要出去，关键是农村挣不到钱，还有买东西、看病、孩子教育等各个方面都不方便。”


    “我们这一个姓王的医生，手段好，农村来看病的人很多，可能是他没有拿到执照，上面经常来人检查，这个医生躲到别人家偷偷行医，都被发现了。检查的人经常 6、7 个一起来，比公安抓杀人犯还凶，把药品和医疗器械统统缴走，然后张嘴就是几万的高额罚款。”


    “后来，这个医生实在受不了，跑到合肥去了。附近一个老人打听到王医生的确搬走了，回去立即上吊自杀了。原来这个老人有慢性前列腺炎，需要定时导尿，儿子们说，给钱可以，导尿他们不会，就是会也不干，因为太呕心了。老人花点钱，每次都是王医生导尿，听说王医生走了，感到没有指望，就回去自杀了。”


    “我很奇怪，一个乡村医生，至于官方这样高规格的对待吗？后来，了解到农村开小店烟草证很难办到，没有烟草证不但发不到香烟还不允许卖香烟，在农村，开小店不卖香烟，开个鸡巴商店。”


    “后来我终于明白了，原来这是政府有意这么干，让农民看不上病，买不到东西，农民在乡村实在是混不下去了，就要进城了。”


    这段文字，前面基本上是白描，代表了当下中国不少城市远郊区农村的真实面貌。文章最后一句话，说政府有意让农村衰败，逼农民进城，这就属于臆想出来的阴谋论了，也完全不符合事实。百年中国，从知识分子，到有钱有闲的文艺中年，到政府，到社会企业家，到军阀，都有深厚的乡土情结；中国历史上告老还乡的传统，更是使得人们不论在外做了多大官、赚了多少钱，年老时一定要叶落归根，回乡购置产业。一部中国文明史，基本上是被乡土半牛半驼的农业文明乡村文明史。即使到了工业文明城市文明时代，我们的政策搞的还是匪夷所思的“就地城镇化”。


    当代中国，政府在“西部大开发”、“新农村建设”、“村村三通”等方面可没少花心思，也没少花钱，乃至于汶川地震后，专家、当地百姓都说要异地重建，但是各级政府就是要“在哪里倒下就要在哪里爬起来”，采用发达地区对口支援的办法，楞是就地重建了一座座外表整齐美丽的乡村。但紧接着泥石流一夹，新的家园又归入泥土，甚至还有人因此丧命。中国人就是天不怕地不怕，就是有死也要死在乡村的精神！但百年来不论什么力量，都挡不住乡村日落两山的颓势！


    在目前这个例子中，并不是政府阴谋论故意要让乡村衰败逼农民进城，而是乡村自身的资源短缺，导致了管制的混乱与失败：管制的混乱与失败又进一步加剧资源的短缺和乡村的衰败。越管制越落后，越落后越管制，恶性循环。


    在当下自上而下管制型而非乡村自治型行政体制下，乡村管制的特点是上面千条线，下面一根针，上面无数机构下面都要有人对应，导致人浮于事，同时工资福利待遇又差。虽然工资福利待遇差，但在就业机会极度匮乏的乡村，一个稳定的政府工作岗位又是非常令人艳羡非常值得珍惜的职位。这样一种内在的紧张会导致一种非常奇怪的结果：乡村公职人员处在权力最末梢，有事常常是首先被抛弃的对象，加上乡村乃至县城就业机会奇缺，因此他们非常害怕因工作失


