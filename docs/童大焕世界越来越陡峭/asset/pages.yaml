    点向您学习，也许就不会向市场交这么昂贵的学费了。信用信息不能信市长，信规 律不能信规划，房地产市场补贴工业，房地产是经济发展的救命稻草，地方经济严重 依赖土地财政等，这些基于楼市事实抽丝剥茧的判断，
    都让我对房地产市场有了全 新的认识。世上没有后悔药可吃，但亡羊补牢为时不晚，我决心循着您的判断调整 我的思路，尽快抛掉手中成长性弱的项目，争取在核心城市的潜力区域（如北京通
    州、大兴亦庄）置换一套房产，以实际行动来验证您的结论。同时，也希望童老师 日后有更多好文章、好见解让我们这些渴望深入了解房地产市场的求知者认等。”


    答：“很好。壮士断腕一点不迟。未来中心城市房地产还有很大、很长的升空间， 对于理性投资者还充满机会。”


