  md: '等的优惠，相当于房价实质上降了几万元。当然，这种模式与真正的众人筹款还是略有所差异。


    据悉，2014年11月11日京东金融与远洋合作的众筹7个城市11套1.1折房活动，24小时内的支持人数达到18万人次，筹资金1220万元，参与人数和筹资金额都破了中国实物众筹的记录。本次11元筹首付最终会取得什么样的成果，要到12月3日才能正式揭晓。


    在11个人获得1.1折购房资格和9个人以11元的成本获得价值四五十万首付劵的同时，美中不足的是，眼下这种接近于零成本的房地产众筹模式，因为门槛过低而缺乏普惠性。比起每年数千万人在城市乡村之间流动、数百上千万套的住房需求而言，眼下这种购房众筹模式，作为思想和商业模式变革的启迪意义，远大于满足人们真实购房需求的意义。


    为了使房地产众筹模式真正可以成为一种市场化、大众化的商业模式，就必须适当提高参与者的经济门槛和信用门槛，比如，参与资金不再是11元，而是接首付款的三分之一或十分之一；参与人不再仅仅是中奖取胜，而是人人有份，以期不断向真实的购房需求靠近。这样的靠近，借助现代商业的众筹模式、现代金融创新模式和伟大的互联网，能够很轻易地将参与者的购房门槛降低一半、三分之二甚至更多。互联网把有更多相同认识的人连结在一起，也必将促成更多的合作与共赢！我有十分的把握相信，房地产众筹模式将会是一个非常有前途的。这也是我和我的智库下一步准备着重重研究和具体落实到行动中的问题。如何做？和谁做？暂时在这里留一点悬念。大家都可以期待，更加广泛、更加大众的众筹购房模式就在触手可及的明天，踏著款款深情的步伐，向我们碎步走来！


    作于 2014 年 11 月 21 日


    2014年11月24日发表于《新华每日电讯》


    # 房价越高的城市越有活力


    从长沙到武汉演讲，再到在北京刚刚结束的第一期“大族财智分享会”，我都顺带提到了一个观点：高房价是城市竞争力的体现；房价越高，生物链越长，城市越有竞争力和活力，城市人口的多样性也越丰富。对这个题，我一直没有展开分析。今天就写一篇小文，对此作一阐述吧。


    房价高低，首先是一个市场自由选择、自然形成的过程。世界上没有一个房东和开发商不想把自己的房子卖出高价，与天的中国地方政府也没有一个不希望当地房价高——只有高房价，才能支撑起高地价，政府的“土地财政”才能有源头活水。


    但是，房屋能不能卖出高价，取决于有没有人愿意付出高价。这一点，从政府，到开发商，到房东个人，都无法强迫，不能强制交易，只能听凭市场自由选择（当然他们可以采用宏伟规划、各种概念等方式方法进行包装，但最终有没有人愿意买单，还是只能凭市场）。而市场的自由选择，取决于这座城市、这个区域、这套房子一系列各种复杂的综合因素，这种综合因素，甚至复杂到难以精确量化的程度！大多数人、大多数时候，根本不必要去精确计算带来高房价的各种因素，相反，只需凭借房价高低，一目了然就可以判断一个区域、一座城市、一个小区甚至一套房子的价值——房价越高的地方，往往越值得人们拥有（短期炒作原因导致的除外）！房价，是城市竞争力的综合且直观体现！'
