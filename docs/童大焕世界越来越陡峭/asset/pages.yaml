  md: '过一系列大型工程予以解决或缓解。不过代价很大，有些方面的作用难以持久。


    新区选择在河北省北部平原上的一个大洼地（洼地中心部分是白洋淀的“边坡”上，平均海拔 10 米左右。历史上洪涝灾害频发。未来的雄安新区可能需要按照极高的洪水标准设防。在严重洪水发生时，白洋淀有可能必须泄洪，可能会使城市被淹。历史上，包括春秋战国时代以及元、明、清三朝，在河北省建的都城或重镇，基本上都在太行山东麓、（部分）燕山南麓的海拔
    50 米左右的高程上。京广铁路的路基标高也在这个高程附近。


    2、白洋淀水质污染严重。白洋淀现在的面积为 200-300 平方公里，长期以来污染严重，水质属五类时多为多。污染物来源是白洋淀上游三万多平方公里内 1500
    万亩灌溉面积上化肥农药造成的面源污染及 1000 万人口（包括 300-400 万城市人口）的生活、生产污水。淀区大约居住有 10 万人依靠养殖业，主要是家禽养殖及其加工，带来了大量的污染物。三个县大约
    200 亿元的 GDP 基本上是小 的羽绒加工厂及皮革加工厂。2017 年 7 月底媒体报道已经关停 3900 多家“非法排污”的不达标的企业。


    3、城水融合、“生态宜居之城”是很大的难题。在人居环境环境本底基础很差的地方建设最美丽、人居条件最好的城市，如何达此目标并如何能够长期得以保障？人们所设想的世界上许多大城市处在海边、大河边、大湖边那种天青色、水城一色的壮观美景，在雄安新城将不可能看到。遇到
    200 年甚至 100 年一遇洪水，新区中生活的人，可能头顶上是一盆洪水（不垫高地表），或者城市周边（东、南、西三面）一片汪洋（建成区地表垫高 5 米后）。


    4、大规模动迁、就业、治污、生态修复等需要巨额（长期）支出，且面临非常棘手的社会困难。除了诸多机构、企业的大规模搬迁费用外，以下可能是长期的难题：白洋淀内的
    10 万人从事的养殖及其加工的经济系统要彻底改造与调整，要使他们有新的职业，能逐渐适应并富裕起来。“转业”后将从事哪些产业，还不带来污染？动迁涉及到三县大部范围，开始阶段就要大量赔偿，长期则涉及到上百万人口的生计即就业与致富问题；三县遍布污染企业几千家，绝大部分是小企业。白洋淀上游
    3 万多平方公里范围内中小企业与农业化肥农药面源污染的治理，各地县污染企业的关停并转，需要大量投资与经济补偿；解决水安全、生态保护问题需要大规模调水、堤坝等的工程措施，白洋淀淀区内的补水、清淤、水生生物生态环境的改善等，亦需要大量投入与长期维护费用；新区工程地质条件不好，城市及大部分建筑物都将落在潮湿的钢筋水泥桩子上，额外增加工程费用。


    以上可能是现阶段一系列起步工程规划、建设出现诸多困难的原因，需要找出克服困难的办法，推进新区建设的前进。


    结束语：上述是对雄安新区规划与建设中正在出现或可能出现的困难与问题原因的简要分析。之所以会如此，我以为与早期工作队伍专业组成不够完善有关。他们不很了解这样的新区新城建设与发展需要哪些区域性条件，不很熟悉北京周围
    100-200 公里范围内的自然结构及社会经济的空间结构如何。另外，河北省与水利部的同志，是不是将这里的实际情况作了客观全面的汇报，可能也是原因。我以为，这些领导同志对这里将要出现的种种难题心中是清楚的。


