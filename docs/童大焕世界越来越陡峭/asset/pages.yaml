    看出问题来了没有？上述两位学者的理论，都说是，胡焕庸线是在农业社会基础上的规律总结，工业和信息化社会，可以利用克鲁格曼的第二地理天性即人口与产业集聚和交通区位反过来影响区域发展的理论“破解”胡焕庸线！这不就又落到了这个长篇报道中“在中国，特别是苏联学派的代表，曾想借用另外的线代替它，搞产业布局和城市化，结果挨得很重”的巢臼中，自相矛盾很！


    大三线小三线建设、西部大开发、汶川地震后就地重建、东北振兴，我们不是没有实践克鲁格曼的第二地理天性理论，而是一直鲁贵脸肿地实践着呢！而这么多努力的结果，大小三线纷纷衰落，东西部差距依旧在拉大，汶川重建后很快迎来泥石流，东北持续衰退，西部地区荒漠化面积建国后新增
    300 多万平方公里。而人口分布呢？根据 1982 年的全国人口普查资料，东部面积占 42.9%，西部占57.1%，而东部人口占 94.4%，西部仅占 5.6%（此前该比例一直是
    96：4）。自胡焕庸线发现后，许多年来这个状况并没有大的改观。有时候看起来西部人口密度在上升，实际上还有领土面积变更等相对因素存在（比如外蒙古独立），1.6
    个百分点的变化还是不大。同时，东部仍然有相对稀疏的地方，还可以容纳比较多的人口。到了1990 年第四次全国人口普查，东南半壁人口占全国 94.2%，西北半壁则仅占5.8%。历经半个世纪，中国人口分布的基本格局未变，东南半壁占全国人口之比例，仅由
    1934 年的 96%微降 1.8%。


    还有一个问题，既然胡焕庸线是一个客观规律，我们为什么一定要去破它？人为改变它，难道是一件比不改变它更能造福中华民族、更能造福子孙后代？


    在今天这个中国工业严重过剩、工业化严重超前于城市化的时代，试图通过工业化来聚集西部人口与产业则更无可能。而信息产业和城市化自身达成的人口聚集，则更受制于区域的公共服务、商业文明水准、社会观念等一系列软环境，东部越发达城市越有吸引力，西部的落后，不仅是产业和城市布局的落后，而且是公共服务、营商环境和社会观念等无形资产和软实力的整体落后。


    强者恒强、弱者愈弱的马太效应，是城市化过程中无可改变的规律。中国的城市化将在无形中严格遵守三条天线：胡焕庸线、长城线（胡焕庸线在北方地区与长城线有重合之处），还有一条是我在《世纪大迁徙》一书中提出的“人文社会线”即百万人口线，城市连片建成区人口超过一百万，个体才容易挣脱落后的社会关系网，获得更大的自由和自尊；超过百万人口，城市的内生系统将会全面激活。


    任何时候都不必过于担心马太效应，只要保障人的自由流动和财产的自由流动，“人的均衡”与机会平等就会在不断的自由竞争与合作中得到实现，而区域的均衡，在任何时候都只是遥远的乌托邦。


