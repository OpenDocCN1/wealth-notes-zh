    为什么今天不存在这样的特定环境？因为金融业不是无源之水无本之木，今日中国高端服务业因行政垄断而难以发展，其它各行各业都已经过剩（详见 2014 年 9 月
    12 日中国工商银行行长杨凯生文章《国内已难避非产能过剩行业》），无论是民间金融还是银行理财产品，事实上都已高度依赖于房地产的健康发展。本轮楼市萧条，直接导致民间金融崩溃和银行风险的“邯郸现象”就是冰山一角。未来，资本大批量进入股市和私人银行的前提条件，一是股市不再是圈钱市，二是各产业经济发展得以支撑起银行和股市。但现在看来，十年后我们都未具备这样的条件。因此，大批私人资本进入金融业的条件不成立，“股市一好，房价就掉了”的状况不仅过去没有出现（即使出现也是昙花一现），未来相当长时间也还不不会出现。因为股市的圈钱市特征，过去我们更多的情形是：楼市好的时候股市不好，股市好的时候楼市也好。


    我所尊敬的茅于轼、陈志武等著名经济学家都多次谈过房价问题，他们认为房价必跌或劝人们逃离楼市的原因，当然是觉得中国房价太高，不正常。但我认为他们基本上说得都不准。何以如此？因为他们的理论未必有问题，但他们采用的参照系出了问题。就像本文开头所述，中国房地产市场必须以城市化为大背景，而这个城市化跟别的国家和地区都不一样，1949
    年以来的前 50 年都不正常。现在突然要通过正常的市场力量发挥作用了，其剧烈的补课效应应让所有人看来都不正常！其中最典型的“房价收入比”。在世界各国各地区，人口流动比较缓慢，用房价收入比这把尺子衡量房价的合理程度，是可以的。但是中国人口流动极其剧烈而且其中不少人候鸟式的“在大中城市打工，在中小城镇居住和消费”，于是出现我
    2010 年 8 月出版的《买房的革命》一书所描述的现象：“大城市房价由外来人口决定，小城镇房价由回乡人口决定”。以往世界通用的经济学尺子用不上了！


    还有，中国的城乡差距、地区差距非常巨大，差距越大，赚钱城市和大城市聚集的趋势将越明显，可是我们的主流经济学者和政策制定者在迷信和迷恋根本不可能“以中小城市为主”的“就地城镇化”迷梦中，在这个观念背景下人们怎么可能理解大城市的高房价呢？比我国收入低得多的印度孟买，2008
    年 8 月平均商品房价格已经超过 6 万元人民币每平米了！同时，中国这样一个征信系统极不完善的国度，很多人的第二第三职业收入、官员的灰色收入、个人和家庭的资本和资产增值收益等，都没有计入总收入项。房价收入比的分母少了很大一块。


    黑格尔说“存在就是合理”，也就是说“任何存在的事物都有其存在的原因，存在的一切事物都可以找到其存在的理由。”经济学解释为什么会这样而不是那样存在的。如果真的没有购买力支撑，房价是不可能维持的。


    城市化对于中国 98%以上的经济学界来说都是没有前人理论可供参照的全新课题，甚至中国 99%以上的人在城市化到底是不是大城市化还是小城镇化上判断错误。别说学者，就是身处其中的多数开发商也都看不懂。所以未来会有数不清的开发商和富人因为看不懂城市化的发展趋势而导致财富被洗劫一空。


