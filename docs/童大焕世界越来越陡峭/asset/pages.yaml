    # 作者简介：


    童大焕，男，1968 年生于福建长汀，1990 年毕业于中国人民警官大学科技系，现居北京。当今国内最活跃的时评人之一，视角独特、文笔犀利。笔触涉及时政、财经、法律、教育诸领域，对城市化、房地产、中国宏观经济等有深入而独到的研究。


    中国大城市化理论领军人物之一，是中国最具前瞻性的城市化和房地产研究与实践专家，具有丰富的楼市投资实战经验，对中国房地产和城市化的深刻洞见和观点屡被市场验证，尤其是对于政策和趋势具有精确的预见性，如《限购恐将催涨三四线城市房价》、《我为什么说谁当总理谁降准》、《只有房地产才能救中国》、《泡沫是国化泡沫的唯一办法》、《经济越下行，一线城市越坚挺》等诸多篇章一再被时间应验。2011
    年 2 月 11 日准确预见限购限贷将会加剧三四线城市鬼城风险，现在正在预警“环大都市鬼城圈”。


    曾被评 2006、2008 年度“百位华人公共知识分子”、2009 年度“中国百大公共知识分子”，2009 年度被腾讯网评为“年度致敬之教育评论家”，2013
    年度“中国百位意见领袖”点评“他从公安大学的理科生，活生生‘拐曲’成了‘文科’专家，他对于中国经济的深入观察，让他成为广大民众意见选择的意见领袖”。微博《中国，请停下你飞奔的脚步》获南方周末
    2011 中国传媒年度致敬。'
