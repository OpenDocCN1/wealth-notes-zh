  md: '那些有“大城市恐惧症”的人们要努力学习一点关于城市化的基本常识：大城市化而不是小城镇化才是人类最健康环保、高效低碳、自由尊严的生活方式。外来人口即使增加了城市的拥挤和医疗、教育等公共资源紧张，那也是因为政府一厢情愿的“小城镇化”战略导致的政策失误导致。为什么全世界的城市化都是大城市化为主潮流，唯独中国内地的“城市病”格外突出？是中国人种有问题还是政策有问题？外来人口给城市原住民带来的更多是福利，使他们的土地和房屋变得寸土寸金；即使是一无所有没有土地和房屋的最底层民众，人口的增加也给他们大大增加了就业机会！谓予不信，偏远地区的农民就没有这样的就业机会。


