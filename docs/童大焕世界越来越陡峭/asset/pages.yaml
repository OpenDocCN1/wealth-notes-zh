  img_proc: true
- pgno: 158
  md: '增和暴堵恐怕都很难解决。因为随着城市化进程的加快，城市公共交通拥堵化倾向只会越来越明显，像日本东京这样的地方，据说地铁也是超挤，远甚于北京，地铁工作人员每一站都是由外向里把人群往车厢里推。这样的公交状况，势必不适合老人、孩子、孕妇、病人、残疾人等，如果城市出租车服务跟不上，就会逼迫人们自行买车，形成越买车越堵、越堵越打不上车、越打不上车越买车的恶性循环。


    而在出租车由公司垄断经营和管理部门的配额管理制度取消之前，每增加一部分出租车配额，原有出租车司机要求降低份子钱（也就是交给出租车公司的每月份额钱）合情合理，因为现在有管理方式，正是出租车公司借着垄断地位向司机收取垄断租金，而出租车司机则分享垄断经营利润。配额增加，垄断程度就降低，份子钱自然也应该降低。


    但是配额制和垄断经营永远不可能从根本上解决问题。一方面是包括行政管理者在内的人，根本不可能先知先觉地知道城市到底需要多少出租车。随着城市人口的增加，这个需要本身也是随时动态变化着的；另一方面是配额和垄断经营带来的寻租和牟利空间，使出租车公司和管理者都倾向于尽量减少配额而不是尽量满足市场需求。因此，根本还是要全面打破垄断和配额制管理，只用资格准入管制出租车司机，用行业标准管理出租车车型车况，别的，完全交由市场竞争，人们自由准入，个体经营。包括出租车价格方面，都不妨交由市场，随行就市。这样，市场需求和供给才能真正进入动态平衡状态。


    在此基础上，城市应该大幅度提高私人小汽车的使用成本。比如进入一定内城一定区域的，收取高额停车费和“进城费”，直到大部分人用不起。尤其是开着小汽车上下班的工作和生活习惯，是当代都市最大陋习之一，应该通过经济管理手段加以摒弃。


    只有大幅度降低私人小汽车的使用率，城市的道路才能畅通，城市的空气才能清洁，城市的天空才能变蓝。只有在那样的情况下，路面公交和出租车才能真正跑起来——跑起来就意味着大幅度提高了城市公交和出租车的运能和利用率。否则，再怎么增加公共交通和出租车的数量都无济于事。


    出租车市场化和大幅度提高私人小汽车的城市使用成本以后，道路变得畅通，打车难的问题迎刃而解。城市出租车虽然是市场化管理，但相对私人小汽车而言，成本还是低廉得多，这就相当于出租车成为准公交。人们上班更多选择公共交通，而老人、妇女儿童和病患则更多选择出租车，出租车司机也因一路畅通赚到他们自己的钱。各得其所，城市进入交通和环境改善良性循环。简单计算，如果一辆私人小汽车每天上下班花费3小时，一辆出租车每天满勤9小时，那么，一辆出租车的效能至少相当于3辆私人小汽车。如果打车难的问题解决了，相应地可以减少多少城市私家车啊！


    这些问题理顺以后，城市根本无需再出台外地车辆限行之类严重涉嫌歧视的管理政策。


    如果不能解决好城市公交、出租车和私家车的关系问题，城市灰霾、交通拥堵和打车难就会像癌症一样不断裂变。如果连出租车垄断和配额管理这样小得不能再小、却严重危害城市环境、市民权利和健康的利益集团都无法排除，这个国家还有什么利益能够排除？


