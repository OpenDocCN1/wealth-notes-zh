    # 给我“顿悟”的重大事件【我怎样在城市上空自由飞翔（中）】


    # 童大焕—2019 年 2 月 24 日


    +   1. 在淬炼思想力洞察力思辨力方面，最难、同时也是最惊险刺激、成就感最大的，是在万千信息中，建立起事物之间正确的有机/有关联系。


    多数时候，我们以为自己看到了真相，但往往看到的只是表面现象，甚至是假象，把无机/无关的联系当成了有机/有关的联系，而且，信息越闭塞的人越自负，越无知越无畏。


    即使看到局部真相，也是千百个变量只看到十个八个，十个八个里面可能还有五个甚至更多是错误或虚假信号。以此去指导自己的理论和实践，犹如盲人摸象，摸石头过河。


    信息千万条，相关第一条，信息不相关，亲人泪两行！


    尽管信息繁杂且变化多端，但真正影响事物突变的重大变量，往往只有那么一两个、两三个。一旦建立起了真正的有机/有关联系，一切问题就会变得非常简单。一旦我们能够“删繁就简三秋树”直击要害，“领异标新二月花”一枝独秀的春天就来到了。你尽可以大道至简，八风不动，站如松，坐如钟，行如风。


    这篇文章，着重说一说这么多年来的城市化研究中，给我“顿悟”给我灵'
