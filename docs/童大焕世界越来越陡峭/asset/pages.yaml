  md: '这才是真正符合市场规律和国际城市化潮流之举，也是真正的“人的城市化”。让人全面融入更发达的环境，比发达地区对不发达地区的转移支付，对人从财富到精神的提升，速度更快，也更全面彻底。


    # 3


    很明显，新的顺应规律、顺应潮流的城市化战略，会给“强者恒强”的经济和城市化发展规律加持，像广东、浙江、上海、北京、江苏、福建等财政盈余的省市，有望得到更快的发展。


    至于人口不断流失、财政能力低下、地方债不断累积的地区和城市，则会呈现“弱者恒弱”的局面，必须彻底改变过去摊大饼的规划思路，从紧凑型、集约化发展的道路上寻找出路，从而让人口流失的城市仍能保持一定活力，延续更持久一些的城市生命。


    # 4


    城市化战略的重大转型，也意味着城市价值分化的时代加快到来！我再强调的“世界越来越陡峭”会加速到来，少数城市像珠穆朗玛峰一样高高升起，多数城市将房屋价格将迅速被矮化。而且，有价无市的城市会逐渐增加。预计未来真正有较高投资价值的内地城市，不会超过
    15 到 20 个。


    早在 2014-8-13 23:46 甚至更早时间，我就开始提楼市分化，在当日新浪实名认证微博上写道：“2014 年，人类历史上规模最大速度最快的中国城市化以突如其来的全国性格楼房滞销形式进入中场休息时刻。中场休息时间不会超过一年但接下来的分化会非常漫长，半数以上开发商会倒闭，行业向大城市和行业巨头集中，无数楼市投资者会血本无归。没买上房的也别兴灾乐祸，通胀就是为你为鬼城空城买单的方式。”


    很多人不知道什么叫楼市分化，看不清哪里的房价太高哪里的房价太低。特别是过去两三年来，一线大城市普遍下跌或横盘，二线城市普遍横盘，三四线城市反而大涨。


    这其实是短暂的资金现象，在去库存的政策背景下，限购限贷收紧一二线城市放松三四线及以下城市，实现完美的“库存转移”。


    最终，房价一定是由人口来结算，不是由资金来结算。有人口持续流入的，资金一定会持续流入；没有人口流入而只有资金流入的，资金流入一定不可持续。


    # 5


    最后，摘录我 2014 年 8 月 29 日发表在腾讯•大家的专栏文章《中国城市化必须立即启动收缩模式》作为本文结尾：


    > “中国城市化的下半场，必须由城市化发展的自身规律来主导，市场主导，政府规划成为辅助性力量。而所谓市场主导，并非指政府规划无为而治，而是让政府规划服从市场规律。”'
