    而市中心通过减少住宅供应往外驱赶居住人口的办法，会遭遇它自身难以克 服的天然矛盾，就是减少住宅供应只能增加写字楼和商业地产供应，无形中却“顺应” 和满足了高端服务业集中的需求！如果减少了住宅供应却可以不加写字楼和商业地
    产供应来替代，则城市中心的拆迁将难以进行！


    因此，在就业加速向市中心集中的情境下，被人为减少的市中心住宅供应反而 出现物以稀为贵的情形。因此，根据自己的能力和实力，最佳购房区域当然是两类：一类是已成熟又在蓬勃发展的区域，比如
