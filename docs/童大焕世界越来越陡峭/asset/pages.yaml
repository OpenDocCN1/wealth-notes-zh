  md: '2 月 25 日：“从今年开始，中国政府的主要任务由防范房价过快上涨变成了严防死守房价大范围下跌引发全面的金融和经济危机。危难之中房地产业的救命地位更加突显。楼市分化和局部震荡调整，政府无能为力；整体下跌则绝无可能。有下跌风险地区放开限购限贷、供应过量地区严格限制土地和新增房屋供应量，都将可能。”“有人说房地产是政府坐庄，所以房价难降。事情并非如此简单。补贴了工业、抵押了土地的房地产关乎全面的金融和经济风险，事关全局，也是事关就业。世界普遍联系，并非只与‘政府’相关。农民九成收入来自打工。就业是比房价更大的政治。”


    3 月 3 日：“三中全会强调要市场决定性配置资源，北京市政府却始终‘以X控人’‘以 X 管人’，楼市限购也不退出。‘以 X 控人’‘以 X 管人’属于智慧和理性有问题，限购属于‘前年放火后人遮映’，尤其是三四线楼市供应过量下资金都往一线取暖。骤然放开，一线城市暴涨事小，三四线城市被抽血崩盘事大。”


    2014 年 3 月 5 日，北京师范大学金融研究中心教授钟伟在《第一财经日报》撰文《楼市调控应转为防范房价下跌》：“如果无视现状，继续放大供给并以行政手段严厉限制合理需求，甚至风险防范住房地产下滑，那么泡沫破裂的风险恐怕难以避免。对中国政府而言，中长期视野内，防范房价下跌风险，远比严控房价上涨更为棘手和艰险。”


    同一天，全国人大代表、中国人民大学校长陈雨露指出：中国应着手防范房地产市场下跌的风险。防范房价下跌的风险比控制房价上涨的风险来的更为棘手、更为艰险。上世纪七八十年代，新经济自由主义在美国、英国政策化以来，50%的经济金融危机与房地产市场有关系。而且日本、美国、爱尔兰都相继失守、没能化解房地产市场的泡沫，继而出现硬着陆的金融危机。房地产下行的风险一旦变成现实，影响是巨大的。“这里有‘三个
    60%’必须正视：一是房地产市场关连着 60%的实体经济产业，二是房地产业关连着 60%左右的银行资产负债，三是目前中国民众财产保有形式的 60%以上是房产。由于房地产市场过度繁荣已经造成了这样的家庭财产格局，必须面对并考虑把这种现实变成未来经济发展的重要基础。”（中新网北京
    3 月 5 日电）


    3 个人不约而同地呼吁严防楼市下跌风险，所谓“英雄所见略同”。而 2014年 3 月 5 日的《政府工作报告 2014 年》，则以“分类调控”取代了之前无差别的“房地产调控”。住建部副部长齐骥
    3 月 6 日就“双向调控”做出了权威解释：所谓双向调控亦可称分类指导，即对一线城市继续增加供应，抑制、遏制投资投机性需求，限购政策不退出。而对于库存量比较大的城市，要控制供地结构、供应结构。齐骥透露，所谓高库存是指库存量高于月销售量的
    12-15 倍，高过 1 年到 1 年半的销售量的，就是高库存。齐骥同时对杭州部分楼盘降价的事件做出回应，称了解显示，杭州楼盘降价后，所有楼盘都销售一空。所以杭州这种城市只是有阶段性的下滑，而不是大的问题。


    “一线城市限购不退出”、“‘库存量大的城市调控供应、供应结构’，和我2 月 25 日判断‘供应过量地区严格限制土地和新增房屋供应量’、3 月 3 日推断大城市限购不可能放开一模一样。为什么我们每每能够预见政策？不是因有比总理部长更大的权力，也不是在中央和国务院中枢机构有人、可以提前知道他们的动向，而是知识可知规律、透过规律可知方向。一定要相信知识的价值，知识比权力更久远、更贴近，过去那些相信权力能降房价的吃大亏了，接下来相信权力能托涨房价的也要吃大亏！'
