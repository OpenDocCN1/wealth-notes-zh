    1000 万人口城市外，预计 30 个以上城市将在年内取消限购，占限购城市的 65%以上。事实上，很多限购城市迫于经济和财政压力，早就跃跃欲试要取消限购，但大多数害怕抢出头鸟，犹抱琵琶半遮面。据亚太城市房地产研究院统计，今年
    4 月份以来，尽管实施举措各不相同，但抛出各种“救市”政策的城'
