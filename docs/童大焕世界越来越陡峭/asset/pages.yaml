    中国历史上乡贤们兴医办学、修桥施路，乃是乡村振兴的基本传统甚至基本路径依赖。今天，即使农地转市用受到严厉管制，也仍然给乡镇企业建设用地留有余地，否则，中国的乡村真的再也没有一丝喘息和活路的空间了！大午集团在原有农贸市场的建设用地上兴建乡村罕见的三中医院，不仅客观上可以造福乡邻，法律上也合理合法，因为乡村建设用地完全可以用来建设学校、医院、其它企业等乡镇企业！谁要是成为它的拦路虎，则不仅是在阻碍士绅和企业家造福乡梓的传统文脉，也是在切断当下中国社会进步与发展进步的源头活水，更是在与法律与政策的进步为敌。众所周知，十八届三中全会，明确表示农村建设用地可以直接入市，可以抵押贷款，同地同权，同房同价。


