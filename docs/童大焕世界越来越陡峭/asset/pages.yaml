  md: '有规划和概念，纸上蓝图不了了之。很多迷信权力、不相信经济规律的人们总是认为，城市，尤其是一线城市集中发展，都是因为政府资源分配太集中所致。他们既不放眼世界也不回顾历史，不看一看计划经济时代政府可以掌控几乎一切资源，为什么连个卫星城也搞不定；不看一看小政府大社会、政府力量极其有限的法治国家，为什么城市也是高度集中。


    如果我们认真分析一下上海郊区新城的人口现状，应该更能对类似政府主导的郊区化建设保持清醒和警惕。2012年第10期《统计科学与实践》发表了查波、季芳、王春兰（第1、第3位作者单位为上海市人口与发展研究中心，第2位作者单位为上海市统计局）3人合作的论文《上海郊区新城人口集聚现状分析》。这篇论文用详实的数据，揭示了以下几个重要问题：


    郊区新城常住人口大幅度增长，但并没有成为人口集聚的高地。2010年，嘉定、松江、青浦、南桥、临港五大新城常住人口分别是44.38、46.63、36.29、36.12、23.1万人。2000-2010年，这五大新城常住人口增长率分别是（%）80.1、111.2、85、84.8、37.3。而这五大新区的全区人口增长率分别是（%）95.4、146.8、81.4、73.6、58.3。


    也就是说，虽然嘉定等4个新城人口增速均大幅度高于同期上海市全市37.5%的水平，但与其全区人口增速相比，松江、临港、嘉定3个新城都比其所在全区低35.6-15.3个百分点。临港新城人口增幅甚至低于上海全市增幅。也就是说，政府的产业和人口导向带来的人口聚集，比市场自发的人口聚集要低得多。某种程度上，5大新区的人口聚集，只不过是顺应了整个郊区人口增长的“大流”。


    郊区新城新增人口主要为外来人口。新城的新增外来人口占各新城全部新增人口的比重在52.3%至80.2%之间。但是，与其所在全区的人口构成变动比较，5个新城人口中的外来人口占比普遍低于其所在区的水平，如松江新城就比松江全区低24.2个百分点。也就是说，郊区新城对外来人口的吸引力还弱于城郊结合部地区或近郊地区。


    对于上述两大类型数据的解读，得出的结论是：郊区新城对外来人口的居住和就业吸引力都远远低于城郊结合部地区或近郊地区！本人首创的“时间成本决定空间价值”在此得到完整的应验：外来人口大量集聚在城郊结合部地区或近郊地区，是因为进入上海市区打工的时间和经济成本相对于新城都更低，而新城的产业带动能量有限。


    再看新城能否疏解中心城区人口。数据显示，十年间，5大新城人户分离现象有所增加，嘉定等4个新城的人口分离占其常住人口的比例在16.6%至26.4%之间，临港仅为4%。不过，郊区新城的人户分离主要是本区户籍人口，跨区人户分离人口占各新城人户分离总人口的比重不会超过20%，上海市内跨区居住的人户分离人口大都未流入各郊区新城。由此可见，郊区新城对疏解市中心人口的作用非常有限，与政策期望的目标存在较大差距。


    郊区新城没有集聚人才的明显优势。新城常住人口中的大专文化程度人口的比例均高于其所在区的水平（临港除外），但总体差异很小，如松江新城较松江区高10个百分点，嘉定、南桥、青浦3个新城较所在区高4-6个百分点不等。


    郊区新城未能成为郊区的人才高地。除松江新城外，其他4个新城大专以上学历人口的比例较上海全市的平均水平都还有一定差距。新城的产业、特别是第二产业未能发挥吸引科技人才的作用。


    新城人口在业率在郊区地带处于较低水平。2010年，各新城人口在业率在52.9%至63.8%之间。与所在区比较，新城人口在业率略低，松江新城尤其明显，'
