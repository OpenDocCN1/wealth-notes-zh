  md: '市化过程中家庭结构和地域结构变化这两大变量，导致“一叶障目，不见森林”，只见房屋过剩，不见房屋短缺。


    其实不要说十年后，就是今天，中国的房地产已经面临严重过剩和严重短缺同时并存的局面：一是农村和一些小城镇房屋严重过剩，二是大中城市房屋严重短缺，中小城镇同时还面临着严重的结构性过剩和结构性短缺问题。


    十多年来，中国已经有超过三分之一的村庄消失，相应的便是相关房屋过剩。乡村级小镇和一些县级小城镇虽然还在大兴土木，但十年后必将面临严重过剩问题，尤其是在一些远离大都市圈又热衷于小城镇大跃进的地方，用不了十年房屋严重过剩的“鬼城”现象将越来越突出。而县一级小城镇同时还面临着大量祖传老房子因产权复杂、街区狭窄破败等导致不适合居住，上世纪七八十年代大量私人建设的四五层楼老房子又浪费又不宜居等的结构性过剩问题。这些结构性过剩的老房子，面临着比以前更艰难的拆迁问题，但它们占据的都是城市优质的核心地段。


    中国的真实城市化率目前已达 35%，正进入加速城市化的关键时期，不管人们抱着多么美好的理想，“区域均衡发展”、“就地城镇化”注定都是不符合节约资源和提高效率的不可能实现的乌托邦，大城市化才是不可阻挡的历史潮流。到
    2008年底全国城镇常住人口比 1991 年增加 90.3%，平均每年增长 5.6%。未来人口城市化增速将超过这个比例，但也绝非十年可以基本完成城市化。


    在此城市化加速的未来 20 年左右时间里，人口与流入的大中城市住房短缺明显，与此相适应的是中小城镇住房过剩加剧，冰火两重天的局面越来越突出，所谓“90”后“00”后一人有几套房之类的判断完全没有意义，如果是在远离大都市圈的乡镇或农村，有十套八套房又如何？有价无市。有人住、有人愿意住的房子才叫房子，没有人住、没有人愿意住的房子以后只能叫做建筑垃圾。前不久媒体集中报道的北京“井下人生”最能说明问题：北京远郊农民放着家乡“有天有地”房子不住，进城市中心捡破烂，十几年住在地下热力井里，媒体“发现新大陆”后大为惊讶，集中报道后引起政府关注，封了热力井，其中一位当事人被老家政府安排在养老院工作，但很快她又离开了养老院，继续回到城市捡垃圾。


    随着中国的城市化进程和人们生活方式转变的加快，未来大中城市的家庭结构也将发生革命性的变化。几代同堂、父母和兄弟姐妹同住一个屋檐下的居住生活方式将很快成为历史，甚至父母和几乎几儿媳妇、女儿夫妻同套房居住都会越来越少，儿女成年后两口之家将成为常态，甚至于夫妻之间各住一房套的都不罕见。因此，你不知道未来城市需要多少房子，我们只知道大中城市住房大户型会受到市场需求的抑制，房子的套数要求会增加。


    而在小城市中，经过了过去 16 年左右大跃进式的向主城区外摊大饼式过剩式发展，未来的趋势将是回归主城！过去的向外扩张是因为城市拆迁艰难，随着外围住房供应过剩，这种扩张将受到市场规律的抑制。人类过去几千年发展对宜居地址的选择及由此带来的文化历史积淀，绝非近十几年的人类城市经验可以超越，“回归主城”将成为一个更为长远、更加顽强的潮流和趋势。因此，未来中小城镇的旧城和老房子改造，将会面临巨大而漫长的发展过程和空间。


