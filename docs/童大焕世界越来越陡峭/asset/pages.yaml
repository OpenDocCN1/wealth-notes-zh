    # 理直气壮为楼市投资正名


    2014 年 8 月 18 日晚上，一学员和我聊天：


    **学员**：“是房地产成就了罗振宇（著名自媒体“罗辑思维”创始人兼主持人）吗？”


    **我**：“不能这么说。房地产升值让他感到了财务自由，然后职业自由。财务自由和职业能力二者缺一不可。”


    **学员**：“没有财务自由，你再有能力可能也没地方去施展，你也没有勇气离开现在的岗位去发展。比他有才华的人很多，还是房子给他撑了腰。房地产是最简单也最难的。简单是你不要那么多时间去维护人与人之间的乱七八糟。只要有足够专业知识。别的行业可以说大部分让人心力交瘁，你有能力可能也被这些人情世故给左右的几乎没有时间去思考。你的脑海里天天就是怎么去维护圈子，怎么去巴结一些人赚钱。房地产投资不需要（这些）。只要有首付，有月供，我就是我，心如止水。你影响不了我，我不需要你。”“我是底层人我感受特别深刻。大部分人的心思都放在怎么去维护圈子，巴结官员拿项目。他们早已经够了。其实他们的财力入房市很容易。但是国人已经天生从小到大就被这样的环境给影响了，迷信权力。周而复始的做着这些非常痛苦的事。钱有了，人也快废了，生活没有规律，甚至死在酒桌。我认识一个老板特别有钱，天天陪政府官员喝的什么都不知道，尿血了都还在酒桌上喝，何必呢。钱赚到了，命没了。所以这也是我喜欢（房产）这个行业的原因。我不需要求人。”


    说得非常好！每个人都有思维定势和行为路径依赖，当代中国人最可怜可气又可悲的就是权力迷信关系迷信。我呢，希望用最简单纯净的手段抵达人生美好彼岸。我开门教学，就是要教人们活得轻松自由有尊严。在现代社会，真正有能力的人一定必须要包含财务能力这一项。自己的财务能力无法自由，无法很好的对自己和家庭负起责任，就别扯什么为国为民了。也只有在财务自由基础上，才能更好地实现职业自由、思想独立和精神自由，不说违心话，不干违心事。财务能力是指个人努力实现财务自由，也就是努力实现不工作而有钱花。当然不是倚大款不是啃老不是偷鸡摸狗贩毒走私权钱交易。


    楼市投资不仅有助于个人经济独立财务自由人格和精神独立，而且实实在在地在造福社会与他人的。所以我不仅要自己要努力做房东做好房东，而且要带领更多人努力做好房东做好房东！有人说：“扯腿吧，想创业的，利润全归房东有点钱，干什么都不如买房做房东；实体经济纯亏完，然后，房东就只能继续做房东吧。”一些愤愤思考问题从来顾头不顾腚，以为自己空中飞来飞去不要家居的孙悟空呢，天天躲在租来的办公室、租来的卧室里骂，都是你们这些买套以上房的人推高了房价！哎，狗咬吕洞宾，他们不买房你住哪儿呀？房东们挺直腰杆吧，没有你们降低创业和居住门槛，创业、就业者人必得先买房或者只能街头躲城管！一些考虑问题不过脑子只用屁股的情苦贫困很厉害房东就罢了，一些严肃的学者和决策者也把房东当敌人，这个社会问题就会很大，我们必须坚决反对它。


