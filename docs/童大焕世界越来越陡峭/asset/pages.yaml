    # # 中国需要怎样的劳动密集型产业


    劳动密集型产业是指进行生产主要依靠大量使用劳动力，而对技术和设备的依赖程度低的产业。在今日中国劳动力素质普遍较低的背景下，将会会有一个相当长期依赖劳动密集型产业的过程。


    中国当然需要大量劳动密集型产业。但劳动密集型产业是以服务业为主还是以制造业为主，是生死攸关大问题。很多人一想到劳动密集型产业，条件反射就是发展制造业，要发展中小城镇。而在当下中国
    47% 的工业化率对应只有 36% 左右的真实城市化率（世界平均水平是 26% 工业化率对应 70% 左右城市化率，发达国家 20% 工业化率对应 80%
    以上城市化率）、工业产能严重过剩、城市化率严重滞后于工业化率背景下，再想用小城镇工业带就业，比十八年前乡镇企业和小城镇建设还要难。城市化并不是住楼房有公共社区服务和均衡社会保障就叫城市化，城市化的根本还是生产生活方式的改变，尤其是服务业的发展。而服务业的发展，前提就是人口一定程度的聚集。人口规模越大越密集，服务业分工越细。如果我们仍然一概斥行地排斥大城市化，而试图一副情愿以制造业带动就地小城镇化，除了制造更多的过剩和污染之外几乎可以说一无是处！


    我的腾讯微博网友“风格纯粹”我为的言论提供了佐证：“制造业劳动密集型的模式，可能逐渐衰竭了。富士康已经减少了 30% 多的员工，很多的制衣厂，一些传统的劳动密集型制造业都在减少雇员。技术的发展，让机器越来越多的取代了流水线上的工人。上海已经把工业用地的出让年限从原来的
    40 年改为了 20 年。因为上海发现制造业的平均寿命只有 10 年绝大多数就玩完了。以制造业为基础建起来的小镇寿命多长呢？东莞不就是很好的衰落的例子吗？好不容易从制造业转型成性格，却被无情的推毁了。”


    人口的流动、产业的转型一直沿着市场化的道路飞奔，但我们的主流观念却一直停留在计划经济思维里。如果我们放开对各种要素的管制，让各种包括人力在内的资源自由流动，人尽其才，物尽其用，顺其自然，那么可以肯定，发展主流一定是大城市化和服务业自然发展，而不是以制造业为龙头的小城镇化和城市分散化。


