    # 进城农民和城市居民都不爱郊区新城


    ——众人时髦说乡愁，我独孤清说城愁


    众人时髦说乡愁，我独孤清说城愁。大伙儿都爱eneric交写乡愁的时候，我更愿意情有独钟写城愁。


    根据国家统计局 2015 年 1 月 20 日公布的数据进行计算，2014 年农业全中国生产总值 58332 亿元，占 GDP 总额 9.17%。同期城镇化率
    54.77%。刘凯，45.23% 的农村居民，只占全国 GDP 的 9.17%。美国是世界第一大农业生产国，1% 的农民，农业占全国 GDP1.2%。那么，中国进阶的
    2.6 亿左右农民工在哪里？在政府的统计数据里，这些人是没有温度的棋子，统计农民收入的时候把他们算作农民，以提高农民收入水平；在统计城镇人口的时候把他们算作市民，以提高中国的“城镇化率”。如果没有
    2.6 亿农民工背井离乡妻离子散外出打工，将近 9 亿农民，占全国总人口 66%，却只产出 9%GDP，他们的日子不知道该怎么做过？


    在冰冷的现实面前，政治家、文学家心里牵挂、口头念叨的“乡愁”二字，显得多么的廉价和矫情！显然，解决农村问题的钥匙在城市！如果不能通过城市包容的办法大幅度减少农民，政治家和文人眼里的“乡愁”就只能农民逃之不及避之不及的无可奈何之地。


    但是城市宽容吗？城市对外来人口可是一点不宽容不客气，在“就地城镇化”、“发展中小城市、严格控制特大城市”的政策下，大城市住房限购，外地户籍的孩子不能在城市里随地就读和就地高考，出租屋清洗、禁止群租、大量拆除城市贫民窟（城中村），以产业结构调整为名，将一部分“低端产业”赶出大城市，目的是为了赶走“低端人群”，将穷人群赶出大城市。从上世纪
    50 年代开始，就在大城市周边建设“卫星城”，现在也在大建“郊区新城”，目的就是转移大城市人口和产业。但事实却证明，这样的产业和人口政策效果微乎其微，人口的流向根本不听政策和“产业结构调整”的使唤。'
