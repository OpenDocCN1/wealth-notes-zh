    # 政府大楼引领的是伪城镇化


    在当代中国城市化和房地产发展历程中，一个经久不息的概念性话题是政府搬迁。从一线城市到偏远乡镇，政府大楼搬迁一直是政府和开发商拿来诱导购房者的一個刺激性话题。越小越落后的城镇，政府搬迁在城镇化和房地产发展中的“权重”越大，甚至于不少中西部地区和偏远地区，把政府搬迁作为当地城镇化发展的惟一救命稻草。


    2013 年 3 月全国两会后，李克强总理在与中外记者见面时郑重提出：本届政府任期内，政府性的楼堂馆所一律不得新建，财政供养人员只减不增，公费接待、公费出国、公费购车只减不增。此后，中共中央办公厅、国务院办公厅印发通知，进一步对此提出明确要求，规定
    5 年内各级党政机关一律不得以任何形式和理由新建楼堂馆所。


    面对政府性的楼堂馆所一律不得新建的严要求，很多新城、新区“捆绑”了新行政中心等政府项目的地区感到进退两难。基层反映，在中西部等后发达地区， 政治中心带动模式现阶段仍很必要。湘西某县县委书记说：“就城镇化和城市经'
  merge: -1
  img_proc: true
- pgno: 100
  md: '济社会发展而言，发达地区可以走市场配置资源的路子，比如产业园区带动等。但后发达地区不具备产业基础，还是要走政治中心带动新区发展的路子，而且作用很大。”厦门大学教授赵燕菁表示：“政府卖掉地价昂贵老城办公楼，迁往地价较低的新区，然后将新区升值的土地在一级土地市场上出售，获得公共服务和基础设施建设的原始资本，是快速发展的城市为基础设施融资的基本做法。”


    个人认为，城市化是一个人口聚集带动城市和服务人聚集的自然发展过程，不论是以工业、文化、旅游、气候、服务业等各种方式带动，都应该是一个需求刺激供给的过程，任何通过制造供给来刺激需求的做法都有可能城市化规律背道而驰，以政治中心带动新城、新发展的路子，更是一种为城市化而城市化的短效、短效之路，既不符合城市发展的规律本身，也不符合建设廉洁和廉价政府的现代政治文明方向。


    过去有很多没有人口和产业聚集的小城镇，通过将政府大楼、学校、医院等公共服务设施大规模规划和搬迁的路子，逼迫老城区居民、诱导农村进城新移民搬迁到新区，短时间内有可能取得“显著效果”，为短期地方财政立下汗马功劳，
    但这种蚂蚁搬家式的城镇化既撕裂城市的历史，也大大抬高了民众城市化的成本，是一种短期高效但高能耗、高代价的城镇化，一边在创造财富，一边在破坏和毁灭财富，类似于将一个石头搬来搬过去创造
    GDP，可以说是一种伪城镇化。其大手笔的政府规划为供应过量的“鬼城”埋下伏笔，不久的将来，随着政府廉洁化的政治之文走向，以及“国富民贫”式财政和经济结构的不可持续，靠党政机关及其人员高消费支撑的短暂的新区繁荣也将难以持续。


    新华社记者湖南、江西、湖北等省采访发现，新一轮城镇化背景下，新城、新区“搭建”公共建筑的现象较为普遍。2013 年 6 月中旬，中部某市城区辖区内，十余公里长的道路两旁，各类施工机械来回穿梭，村庄拆迁、村民安置、路网及部份学校医院建设如火如荼。记者了解到，这些工程是该市新城建设项目，
    规划总面积达 30 平方公里。在一幅树立于道路旁的规划介绍图上，记者看到，行政中心组团是该新城的核心区域，位于新城中间位置，在一个 482 亩湖面的周边，将分别建设占地
    77 亩的行政中心、两个总占地 244 亩的会议中心，以及十余个占地为 20 余亩到 60 余亩不等的行政办公区。


    这种情形并非始自“新型城镇化建设”，而是历来如此。只不过如今可能遭到“停建政府楼堂馆所”的严厉狙击。


    但是仅靠自上而下行政力量的严厉监管，根本管不住地方政府以政治中心带动新城建设的冲动，治本之策还是要综合运用市场、经济的手段，全面束缚住地方政府只顾大规模举债发展、不管后世和后人谁来买单的无度扩张之手。具体的办法是：


    鉴于经济下行情况下税源不断减少而各级政府部门和国有企事业单位奢靡挥霍浪费之风不减，应该全面启动党政机关、国有企事业单位的地租、房租收取计划，占地占房越多，将缴纳的税费也越多。以此实现对国企和党政机关由监督的软约束转向硬约束。


    在此基础上，启动县以下（含县一级）党政机关的政府破产计划，财政破产的党政机关必须通过裁员、减支等办法恢复内部财政的良性运转。


    “政治中心带动城镇化”的中国式城镇发展路径依赖，让我想起了澳大利亚首都堪培拉。2012 年 9 月我们游澳新的时候，16 岁起就在澳洲读书、生活的中国留学生导游小黎一路上却把澳大利亚首都堪培拉称为“鸟不拉屎的地方”。他说每到周末，这里有一半人回到悉尼或者墨尔本。这真是一个名实仅仪聚会'
  merge: -1
  img_proc: true
- pgno: 101
  md: '的“聚会之地”（堪培拉的当地语意）。


    堪培拉是座“无中生有”的年轻城市，白纸上画的最精最美最新的图画。早在100多年前，这里还是澳大利亚阿尔卑斯山麓堪培拉的一片不毛之地，1820年被人发现，此后有移民来建牧场，到1840年发展成一个小镇。1901年，澳大利亚联邦政府成立以后，为定都问题，悉尼和墨尔本两大城市争执不下，一直争了八九年，直到1911年，联邦政府通过决议，在两个城市之间，选一个风调雨顺、有山有水的地方建立新首都，于是选了这块距悉尼280公里、距墨尔本660公里的空地。1912年，联邦政府主持了一次世界范围内的城市设计比赛，一年之后，国会从送来的137个版本中，选中了美国著名风景设计师、36岁的芝加哥人沃尔特·伯里·格里芬（Walter
    Burley Griffin）的方案。建设过程中，因第一次世界大战的停顿，共用了14年，于1927年建成，并迁都于此。


    尽管堪培拉是澳大利亚首都，是全世界各国驻澳使领馆聚集之地，尽管它风景和气候宜人，鲜花四季，被誉为“大洋洲的花园城市”。但就是这样一个美丽的花园城市，定都后经过了八九十年的发展，仍然只是澳大利亚城市中的老八，30多万人口，只有悉尼人口的20分之一不到、墨尔本人口的十分之一。这30多万人口中，还包括各国驻澳使领馆人员，以及澳大利亚周末候鸟般的大量官员。


    所见，政治中心并不天然地成为经济和文化中心，政治中心所在地也并不天然地成为所在国最大城市。这样的例子信手拈来比比皆是，比如印度第一大都市孟买人口1300万（2006年），首都新德里人口约900万；美国第一大城市纽约人口1947万，首都华盛顿人口540万（都会区，2009年）；越南第一大都市胡志明市人口700万，首都河内市350万（2009年，市区）……


    不管是计划经济、半计划经济还是完全的市场经济，市场的力量都要顽强地突破计划的制约，在地缘经济和文化过程中起决定性的作用。其最终成果和最明显表现就是城市的聚集效应。城市在哪里生长、人口在哪里聚集，绝不是我们想像的政府计划将过多资源向哪个城市配置就可以起决定作用。试想，像北京上海这样的大都市，年增上百万人口，平均每人带动资金10万计（注意是平均），每年就是1000亿；如果其中三分之一的人买房，人均百万计，每年就是3000亿。政府的力量哪有这么大？


    我赞成在交通堵痨厉害的城市将党政办公机构迁至相对独立和集中的郊区，以减少经常性交通管制导致的交通拥堵和扰民现象，但不认为迁移地方政治中心就能引领城镇化的发展方向、改变城镇化的基本格局。一切为城镇化而城镇化的做法，都必须引起各方力量的警惕。这“各方力量”，既包括各级党政机关，也包括开发商、建筑商、个人投资者和买房者。


