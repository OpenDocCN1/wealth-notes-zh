  md: '# 迁都和迁企都是馊主意

    ——人再也不是企业的附庸


    人类告别计划经济和奴隶时代以后，社会告别农业农村时间进入城市时间以后，人就不再是企业简单的附庸和工具，而是华丽丽转身为企业的主人。至少，进入城市以后，人类的选择机会十百倍倍地增加，此处不留爷自有留爷处从此变成活生生触手可及的现实，而非梦想。“城市的空气使人自由”，当在这个层面上理解才算到位。从这个视角上再来观察最近甚嚣尘上的“京津冀一体化”及所谓“迁都”或“迁央企”设想，会发现都不过是一个个吹得很大五彩斑斓的肥皂泡。尽管“将央企搬出北京”、“央企总部离京有助降低北京房价”、“迁走
    20 家央企总部可为北京减少 50 万人”之类言论说得有鼻子有眼，甚至据说连名单都出来了——有媒体报道称北京第一批外迁公司有 207 家，主要涉及化工、建材、铸造等门类，但我相信，这些不过是又一次“茶杯里的风暴”，出了大门就又是各部委辟谣“我什么也不知道”。


    有鉴于官员体系的金字塔结构和当下当官的巨大物质和名誉诱惑，迁都是能够把官员们都一井迁出去的。但只要大政府小社会体制不变，首都迁到哪里、哪里很快就会变成“跑部钱进”的首峰，各种地上地下驻京办就会如苍蝇逐臭如影随形（央企的“驻京办”同样“一个也不能少”）。而迁都同样牵涉到官员自身非常迫切的利益，他们会拿自己开刀吗？可能性几乎为零。而如果真能实行市场决定性支配资源的自由经济体制，首都在哪里又有什么关系呢？


    迁央企同样不靠谱。如果迁的只是拿高薪的总部及其官员，对缓解北京“城市病”如杯水车薪。如果迁的是一整套从生产直到管理庞大的央企（姑且不论庞大的生产机构其实遍布全国各地），那何必呢。姑且不论成本，只说搬迁后的结果会怎样，咱们不妨分析一番。


    一种情形是企业人才特别是未必拿到高薪的中下层企业人才纷纷逃离央企。这是完全可能的。因为这些人要面临配偶和孩子两地分居等问题。如果留在大都市的孩子意味着更好的教育、更开阔的视野、更美好的前途，那么多数人才会选择离开，导致央企的逆淘汰现象。


    另外一种情形是央企迁入地陷入“大树底下不长草”的“底特律陷阱”。所谓“底特律陷阱”，就是整座城市就业机会被少数几家大垄断，导致城市产业结构单一和创新精神与活力灭失。当城市不再成为创新的发动机，它就注定会走向自我衰亡和毁灭。而此时，企业中的人们不仅意味着转型的艰难，而且其精神和能力也严重退化！这哪里是“一体化”，分明是央企和人才的衰败化！在《城市的胜利》一书中，哈佛大学教授爱德华·格莱泽写道：“底特律令人可怜又可悲的是，它充满活力的小型企业及独立供应商培养出了一批大型的、全面一体化的汽车公司，后者却逐渐成了‘停滞’的代名词。福特指出，规模化可以让他的汽车更加便宜。但是，城市优势在于竞争和交流，规模过大、自我封闭的工厂是与此相违背的。福特明白如何合理地设计生产线，以便能够利用文化水平较低的美国人的才能。但从长远看，技能水平较低的底特律人给传统制造业造成了经济上的损害。”


    这个也可以反过来解释，为什么独立王国似的富士康踩楼事件会层出不穷。因为在富士康“企业办社会”的与世隔绝中，不少员工看到的只有单调和绝望。他们只是生产线上的木偶和工具，未来的可能性一望到底。


    在城市，企业和人才是互相吸引的！今天早已告别了企业走到哪里人才就跟'
