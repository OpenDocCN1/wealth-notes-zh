  md: '如果遵循自然规律，中国的城市化速度还会比现在快得多。但是农民没有财产自由，土地集体所有制，大幅度降低了农民进城定居的能力；农民和市民没有迁徙自由尤其是没有迁徙到大城市的自由，甚至通过限制儿童上学、就医，以图达到“限制大城市人口”的目的，所以制造出了大量留守儿童以及留下来照顾他们的留守老人和留守妇女。


    有两种交通工具给城市带来革命性的影响，一种上上下下，一种来来往往。前一种是升降机（电梯），后一种是汽车。它们几乎同时出现在 19 世纪末期 20 世纪初叶。


    1908 年 8 月 12 日，第一辆 T 型小汽车从底特律的福特汽车公司的装配线上开了出来，这种敞篷车可乘坐两人，价格为 850 美元。私人汽车时代从此开启。


    1880 年，德国人西门子发明使用电力的升降机，从此名副其实的“升降机”正式出现。中国首个安装升降机的城市是上海。1907 年，位于公共租界内的六层高的汇中饭店安装了两部奥的斯升降机。


    升降机的发明令摩天大楼变得可能，只要保养得宜，升降机是十分安全的。若以乘客数量计算，升降机的安全纪录应该超过其他各种交通工具。


    但是很明显，到目前为止，在汽车和电梯的争夺战中，至少从数量上看，汽车取得了阶段性的绝对胜利。世界上大部分城市成为了汽车轮子上的城市。


    新华网北京 2014 年 11 月 27 日消息，记者从中国公安部交管局获悉，截至当时，中国民用机动车保有量已达 2.64 亿辆，其中汽车 1.54 亿辆，汽车数量仅次于美国居世界第二位。目前中国汽车保有量占世界汽车总量的
    15%。持有小型汽车驾驶证的驾驶人达到了 1.8 亿人，是 10 年前的近 20 倍。如此反弹，2014 年全球光是小汽车就达到 10 亿辆。中国每年丧生在汽车轮下的生命高达
    10 万人。


    但是电梯数量又是多少呢。维基百科显示，据统计，2002 年全球升降机总数超过 600 万部，是现代使用最多的垂直运输工具。即使十年增加 10 倍，也不过 6000
    万部。当然，电梯共享程度比汽车高得多。


    汽车战胜电梯有它的历史和现实原因：对汽车的新奇；对速度和人类活动半径扩大的向往；对大房子的迷恋；工业化早期污染治理意识和能力低下，导致城市中心污染严重同时房价又昂贵；农业文明有山有水有天有地的居住习惯，像剪不掉的辫子一样拖着人们的后腿。等等。


    根据发达国家的城市化经历，当人口城市化水平达到 30%左右时，进入快速发展阶段，达到 70%左右时，进入相对稳定阶段。发达国家的城市化过程至今经历了四个阶段：①集中趋向的城市化阶段。该阶段城市化的主要特征是中心城市人口和经济迅速增长，特别是市中心城区形成高度集聚。②郊区城市化阶段。这个时期城市化的特征是，在工商业继续向城市特别是大城市中心集中的同时，郊区人'
