    但是，由于观念和智力水平不够，想不到“产权明晰”这个要害结合，因此，全村人只能忍受道德败坏进而共同贫穷的命运！从智力不够，到道德败坏，到社会贫穷落后，这是一个环环相扣的、异常清晰的因果链条！而认识不到这一点的，不仅仅是村民，还包括原本打算去搞生态农业、讲述这个故事的人，以及，写下这则故事的“城里人”，以及不加任何评论、侧面默认作者观点的转发人。因此，单独拿它来指责“农村思维”是完全没有道理的，倒足可以说明我们国人普遍缺乏起码的经济学常识是千真万确的。动不动用“道德”来评判和指责他人，事实上，是普遍的无知导致普遍的缺德，普遍的缺德又导致普遍的贫穷落后。


    这方面，由于一个小村子内公共资源少，而且大家都处在熟人社会中，一切都在光天化日众目睽睽之下看得清清楚楚明明白白。换一种场合，在全国范围内搞“公有制”、“集体所有制”和“民主”，几十、几百、几千亿元被蛀空偷光也许也没有人知道，很多人还在做着“公有”比“私有”更好的千秋大梦！


    一切没有清晰边界的东西都是可疑的，包括词语本身。像“集体所有”、“公有”、“国有”、笼统的“贫富差距”、“平等”等等，都非常可疑，也制造了非常多的混乱甚至灾难。因此，这一一切都运不如边界清晰之后的“风能进雨能进国王不能进”来得伟大。界定清晰的边界，边界之外，服从合理、和平的博弈及其博弈后共同遵守的规则。


