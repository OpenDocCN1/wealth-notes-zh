  md: '（2018.12.7），试图用三大科学公式来解释城市化的内因问题：


    牛顿，万有引力定律，F=G（M₁ ×M₂ ）/R²


    两座城市、两个人之间的吸引力，与此同。如果彼此质量相当，则彼此“和平共处”互动频繁；如果彼此之间畸轻畸重，则会形成吸附和被吸附的关系。


    交通和互联网的改善，相当于减少了彼此之间吸引过程中的阻力。或者相当于以时间缩短的方式缩小了距离。


    爱因斯坦，质能方程，E=mc²


    质量 m 就是能量 E，而且要乘以光速的平方，这是多么大的能量聚变？！


    它同样适用于城市化：人口的集聚【质量的增加】，带来的不是 1+1 的相加关系，而是思想、观念、创新、能量、效率、分工、城市多样性、成本降低等等的倍增关系！这个关系，周其仁教授称之为“创新需要浓度”，我称之为“能量的核聚变”并提出“密度就是生产力，密度就是竞争力，密度就是创造力”概念。


