    的教训吧。近几年楼市火爆，从 2008 年起，和很多人一样，投资了房产。那时市场还未明显分化，我在 H 市的投资收益还算满意。当时也曾考虑在北京或上海追加投资，但最终因为价格过高而作罢（回过头看，后悔极了）。从
