  md: '# 产权匮乏是中国农民贫困之根源


    一位网友 “mushroom-罗” 私信我，说老家在江西高安新街镇办塘大洞渊里村，父亲罗会生。现在老家一占地 90 平米，平时放些柴火杂物之类的老房子被村委以新农村建设名义强拆，但其周边房屋并未全拆。村委给出的条件是：如果不再建的话，就补偿
    50 元一平米（合计 4500 元）；如果再建的话，重新划块地，全部统一 120 平米，每平米缴交村委 120 元，合计交给村委 14400 元。更麻烦的情况还在于，你自己的房屋被人强拆了，重新买的地还不够，还要自己重新建房，不能闲置。
    “我们姐妹三个，都出来了。也不愿在老家建房子。就是觉得自家的财产为什么别人说拆就拆，跟强盗有什么区别。老家离城市较远，在有制度下土地也不值钱，父母就是为了心里这口气。看了您一些书，
    ‘土地集体所有’ 真是万恶，其实就是村里几大家族（兄弟多，以拳头说话）私有。老百姓没有任何反对的权利。” 这种做法，说白了就形同没收你的宅基地。这块宅基地及其房屋，是当事人父母
    30 年前从本村一老人手中购得，拥有土地使用权。其父母没有在强拆手续上签字。


    “问了市里面相关领导，上面没有具体政策，都是各村自己弄。现在我父母要求就是：补偿我不要，拆也可以，但必须所有同样面积的地给我家宅基地。请问碰到这种情况咋办？村委会可以
    ‘土地集体所有’ 没收宅基地吗？”


    法律上讲，村委会当然没有没收村民宅基地的权力。像这种事情，如果放在中国城市，别人的房子你要强拆，最坏也是给一笔可观的补偿，或者返还几套房子。放到风能进雨能进国王不能进的法治国家，未经主人许可敢拆房上梁，一枪击毙不偿命。


    但在中国农村，土地被抢占、房屋被强拆，你说连理的地方都没有。尤其是如果被 “代表” 村集体财产所有权的村委会强拆，你不知道衙门八字门开何处！ 这一切，只因为中国农村的土地、房屋是村
    “集体所有”！ “父母老宅实交一辈子，辛辛苦苦把我们三养大都供着上大学。现在我们需要我们这些上了学的女儿的一发现即使你懵法也没有用处，比不过 ‘拳头’ ，真是一种悲哀。我们了解了周围村庄的一些情况，所谓的宅基地
    ‘集体所有’，其实都是村干部 ‘私人所有’， 他们说怎样就怎样。”


    是的。这种情况才是真正的 “中国特色”。任何名义公有事实上几乎都是干部私有官僚所有。法律上，农村村民委员会是农村居民自治组织，城市业主委员会是城市居民自治组织。大家想一想，如果赋予城市居民业主委员会和农村村民委员会一样的权力，业委会成员可以随他们的意定价出租、出卖或收走小区内任何人家的房子，这个世界是不是会乱套？是不是天因此充满杀戮和仇敌？答案是肯定的。但是这种情形，在中国农村已经实施了几十年，至今丝毫没有改观的迹象。农村只能凭民间传统的道德力量维持基本的稳定与平衡。一旦遇到流氓治乡流氓治村，农民没有任何抵抗力。这是中国农民苦、农村穷、农业危的根源。


    城市居民的房子因为有独立财产权，可以向银行按揭、抵押贷款，可以自由交易卖给世界上任何独立个人或法人，换句话说，可以把死的不动产随时变现，变成他们纵横世界的
    “可动产”。中国农民的土地、房屋和宅基地，因为是 “集体所有”，不能与村民之外的任何个人进行交易（本村民都带有宅基地，事实上此规定基本等同于禁止交易，当然禁绝不了地下交易），不能向银行抵押贷款，只'
