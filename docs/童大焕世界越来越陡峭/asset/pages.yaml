    4728 亿元，比去年同期少 2018 亿元。2014 年 1-10 月社会融资规模为 13.59 万亿元，比去年同期少 1.24 万亿元。仔细分析社会融资总量的结构变化会发现，内需、特别是中小企业需求依然疲弱。”


    尽管 9 月 30 日央行、银监会联合出台《关于进一步做好住房金融工作的通知》，放松了房贷政策，并鼓励银行通过发行 MBS（房贷证券化）和期限较长的专项金融债券等筹集资金以增加贷款投放。但是，放松房贷政策同时配套的降息指导意见，各商业银行不积极配合；放松限贷和此前的定向降准降息措施对缓解流动性的作用也非常有限，房贷证券化更是远水解不了近火。


    因此，当务之急还是要通过短期迅速降低再准备会率，及时配合降息。我们的 M2 增长虽然是世界第一，1998 年到 2014 年，中国广义货币总量增长了 12
    倍，但根据吴晓波《谁才是房价上涨真凶》一文揭示，从 1998 年到 2013 年，猪肉价格上涨 4.5 倍，大米 4 倍，城镇居民人均收入 4.5 倍，北京人均年收入
    4.76 倍，北大学生年平均 5 倍，大学教授平均 7-10 倍，北京房价 10-20 倍，十年 53 度茅台酒 20 倍。也就是说，绝大多数物价和多数人工资都没有赶上
    M2 增长，物价上涨并没有那么可怕。在中国土地流动性没有解决、没有像世界上绝大多数市场经济国家和地区一样成为货币蓄水池的情况下，物价居然没有疯掉，这是怎样的“中国奇迹”？这个“中国式奇迹”一方面说明我们经济的活跃度不高，另一方面也说明“沉淀资金”和外逃资金非常大，官员贪腐而在“体内循环”（互送）没有进入流通领域的异常惊人。最近频频曝出的贪腐官员家中随随便便就能抽出几亿或几十亿的现象，小小科级官员、小小村官贪腐过亿等现象，足以说明现实中的真实流动性并没有那么多，甚至有可能局部呈现不足现象。加上此轮经济衰退中大量民间借贷的崩盘，流动性不足将更加突出。


    因此短期内降准不是备选项而是必选项。要在降息的同时趁热打铁。降息和降准同时进行，也可以扩大银行的规模效应，降低银行因不对称降息带来的损失。


