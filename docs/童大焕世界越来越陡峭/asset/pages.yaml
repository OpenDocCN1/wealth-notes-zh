    # 我不对居住证管理办法寄予希望


    2014年12月4日，国务院法制办公室就《居住证管理办法（征求意见稿）》向社会公开征求意见，有关单位和各界人士可在2015年1月2日前提出修改意见。


    意见稿展示的前景很明朗、前途很光明，它明确居住证持有人可与当地户籍人口享有同等的包括免费接受义务教育、平等劳动就业等多项权利，并可逐步享受同等的中等职业教育资助、就业扶持、住房保障、养老服务、社会福利、社会救助、随迁子女在当地参加中考和高考的资格等权利。


    意见稿规定的申领居住证的条作，似乎也非常宽松，即公民离开常住户口所在地，到其他设区的市级以上城市居住半年以上，符合有稳定就业、稳定住所、连续就读条件之一的，可以依照本办法的规定申领居住证。


    但实话实说，以我1997年以来对中国城市化与户籍制度的持续观察与思考来看，我不对此次《居住证管理办法》修改抱以很大期望。它到底是一部权利保障办法还是权利限制办法？我认为它成为后者的可能性更大，尤其是在大中城市，它成为权利限制办法的可能性更大！因为不管是居住证制度，还是说了多年都只见打雷不见下雨的户籍制度改革，其背后的计划经济思维像清朝那根剪不掉的辫子一样，几乎到了“留发不留命，留命不留发”的根深蒂固程度。


    尤其是作为“首善之都”的北京，为了落实“严格控制人口”的计划经济指'
