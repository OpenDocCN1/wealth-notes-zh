  md: '数远大于流动儿童人数（越到高年级流动儿童比例越低），全国留守儿童至少 6 千万以上，但 2014 年流动儿童数量只有 3500 万左右。因此，小学生数量增减无法真实反映流动人口增减情况。尤其是越大的城市越不能真实反映。第三，由于北京这样的大城市采取排斥小学入学等方式“驱赶”“低端”劳动人口，导致大量流动人口子女被迫到燕郊这样的地方买房、上学，实际就业人口在北京，实际上学人口可能在距离北京
    CBD30 公里的北京东部的燕郊镇，但小学生统计数目却归到了距离北京 CBD50 公里的北京南部的廊坊市容下！仅仅是因为廊坊从行政上代管三河，而燕郊又属三河下面的一个镇！而燕郊距离廊坊也不下
    50 公里！好曲折的统计路径啊！这样的统计已经荒谬到了张冠李戴南辕北辙的程度，若把它作为未来衡量房价的指数，以此判定廊坊的人口增量全国第三，不知道会荒腔走板到什么程度？！


    虽然作者也提到“城市等级比较高、经济总量最大的北京、上海、深圳更有竞争力。其他城市，可能存在更多的变数。比如厦门，虽然人口增速最快，但总量小，经济总量和资金总量也比较小，抗风险能力就比较弱。”但是仅此还不够，必须深刻指出“小学生房价指数”的致命缺陷，才有可能让路人误入歧途。


    “小学生房价指数”具备一定的参考价值，不就像国外好大学录取学生时高考成绩仅仅只是很小的一个参考一样，“小学生房价指数”也只能作为一个很小的参考。切莫被后面详实的数据唬住了。


    世界上有很多东西很唬人，特别是罗列很多详实数据的时候，比如西南某大学教授时髦以全国多少人、多少房屋面积断定中国房屋过剩，就很有“说服力”迷惑力，但是不考虑人口剧烈流动的背景事实，这样的判断就会失之毫厘谬以千里。中国古话早就说过，不仅要知其然，还要知其所以然。但是真落到实践中，知其然很难，知其所以然更难，后者竟有“难于上青天”之感。


    苏格拉底说，未经思考的人生是不值得过的。但思考任何问题都是一件颇不容易的事情，需要有宏观大视野，才能具备全局理性能力；需要有瑞士手表一样精细入微的工匠精神，不能只看结论，要把推理和逻辑万里长征一样重走一遍，才不会失之毫厘谬以千里。思考虽然艰难，但比起未经思考而追悔莫及，思考将会变成人生莫大的乐趣。


