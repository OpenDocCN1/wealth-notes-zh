    我在微博上说，古今中外，拿儿童做“人质”的事闻所未闻。全社会必须消除对大城市化的无知、恐惧和敌视（恐惧和敌视来自无知），中国才会有儿童的美好未来，才有高密度、低碳型、人与自然和谐发展的美好未来。必须知道大城市化的发展潮流和规律是不可战胜的，人心必须对自然规律有所敬畏，心中有敬畏，执政有底线。有人跟贴说：“不怕无知，怕的是无德！”我说，无德就是因为无知。因为无知，做起无德的事情来还理直气壮，还以为是救民于水火解民于倒悬。的确，60多年来我们把知识踩在脚下，零落成泥碾作尘，结果是全社会陷入无知进而无德状态。只有回到真正的尊重知识尊重规律，中国才会回到苏格拉底所言“智慧即美德”的时代。没有知识，不仅无德还会为洪恩浩荡，而且会陷入茅于轼先生说的“许多人根本不知道自己的利益所在”。


    对于此事，我和一位朋友有一段有趣的对话：


    友：“我还是对大城市化有恐惧。但赞成执政有底线。若大城市化不可避免，也只有接受。但在逻辑上，不能把无可奈何的东西说成是好的，把人的选择说成是‘自然规律’。”


    我：“大城市化是自然规律，人顺应大城市化的选择是服从规律。人顺应生死是无奈，但大城市化却有利于自然和人类福利。前者无奈后者却是真好。”


