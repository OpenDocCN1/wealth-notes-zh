    # 大城市狙击孩子入学能否减少人口流入？


    1949年以来当代中国的城市化政策，几乎自始至终是在做着反城市化的无用功。最高决策层《关于进一步推进户籍制度改革的意见》，白纸黑字写着“严'
  merge: -1
  img_proc: true
- pgno: 22
  md: '控特大城市人口规模”。哪怕北上广深真实人口已经比官方公布数据多出近一倍，他们也要通过对公众隐瞒数据的姿势，证明自己的决策正确。比如，电信提供的北京活跃移动电话终端数量是
    4200 万，扣除一人双机和多机占比，加上无手机老人小孩数量，北京实有人口怎么也在 4 千万上下；公安部门官员私下透露的数据也在 4 千万；QQ 大数据反推也在
    4 千万。但官方公布的数据是 2100 万！


    无独有偶，深圳官方公布 2013 年常住人口 1062.89 万人，户籍人口占 70%。但《21 世纪经济报道》2015 年 4 月 13 日一篇报道披露，深圳市
    2013 年的一份报告显示，截至 2012 年底，深圳市流动人口已达 1532.8 万，为户籍人口的 5 倍。换句话说，深圳市常住人口不少于 1839 万，官方公布数据多出
    80%！


    从 QQ 大数据反推，上海、广州与北京、深圳做法一样，都存着数量巨大的数字隐瞒现象。


    为应对外来人口“过快增长”，北京历来采取越来越严的一系列人口调控“组合拳”，对于外来流动人口，北京市实行“以证管人、以房管人、以业控人”模式。包括强行拆迁动物园服装批发市场等“低端市场”、强行关闭打工子弟学校、清理地下出租屋、打击群租等等。2014
    年还首次提出常住人口增长速度明显下降的目标，在“以证管人、以房管人、以业控人”模式之外，又加了一个“以学赶人”（当然这个名字是我创造，他们也不敢有公开的新名词）的新模式，就是从幼儿园一直到高中（不论公立私立学校），试图通过给外来人口孩子设立高昂入学门槛的方式，达到“以学赶人”的目的。人们说，政治家眼里应该有一个
    6 岁的孩童，但是，当代中国大城市秘而不宣的“以学赶人”模式，开创了古今中外从未有过的非人道强行扼杀孩子上学之政策先河，不仅为一切有识之士所不齿，而且势必以失败而告终。


    自古不谋全局者不足以谋一域，我们只需从下面一系列宏观数据，就可以轻而易举地得出结论：试图以阻止孩子入学的办法阻止人口流入大城市，必败无疑！


    数据一，2014 年全年国内生产总值 636463 亿元，第一产业 58332 亿元（国家统计局数据）。据此，农林牧副渔等第一产业只占 GDP 比重 9.165%，这还是终端价值，根据流通规律估算，实际留到农民牧民渔民手里的想不足
    3%，还要刨除巨额人工、种子、化肥、农药等成本，还要扣除统计数据水分。这 3% 的 GDP 是断然养活占中国人口 60%以上的农民渔民牧民的，所以他们哪怕要离乡背井离乡也要进城打工或创业。


    随着第二产业因产能严重过剩于 2014 年陷入突然停顿，并直接导致中国经济增速戛然而止，进城农民可能会短暂的回落，但平均每天消失 300 座村庄的农村衰败和第一产业无法养活农民的现实逼着他们很快又重新进入城市寻找机会。这一回进入城市与以往有很大的不同，就是第二产业衰退导致中小城市就业机会迅速减少，因此再进城将更多直接进入北上广深等特大城市，从事的工作也将由以往的第二产业向第三产业艰难转型。


    在此背景下，阻止流动儿童在大城市上学，最大可能是减少流动儿童比例，增加留守儿童比例，对进城寻找工作机会的人口影响则微乎其微，进城就业人口总量仍将保持高速增长。


    2014 年 5 月 16 日，全国妇联称，全国留守儿童达 6102.55 万，占全国儿童总数 21.88%。新公民计划《中国流动儿童数据报告——2014》指出，截止到
    2010 年 11 月 1 日，流动儿童已达 3581.5 万。留守儿童总数一直高于流动儿童。在残酷的生存与发展面前，妻离子散、背井离乡算得了什么？


