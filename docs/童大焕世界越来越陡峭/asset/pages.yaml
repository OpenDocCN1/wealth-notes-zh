  md: '不同于移民国家、联邦制国家及金权政治国家的美国。这些不适宜向外地迁移。


    深圳、浦东的开发是因为顺应了国内外发展的大势而获得了伟大的成功，雄安新区要发展成为类比深圳、浦东那样的新区、新城，困难很大。较有可能的，是成为一个普通新区。


    深圳（特区）开发的“大势”。1973年第一次世界“能源危机”之后，能源价格上升，西方国家在国内的投资成本与生产成本大幅提高，由此向外大量转移产业和资本，到70年代末已经到了我们“家门口”了。中央决定在深圳等建设特区。资金、技术、海外市场、外贸渠道等经过香港大量集聚而来。在最初的十多年，深圳可算得是香港的“新区”。中央政府、广东省政府在政策、人才、资金、土地、基础设施、城市规划、法律等方面给予强大的配套支持，深圳一下子就大发展起来了。


    浦东（新区）开发的“大势”。上海浦东开发迅速达到现在的规模与水平，是由于上海及其浦东的经济腹地是差不多半个中国，即经济技术发达的长江三角洲及整个长江流域。那时，经过十多年改革开放，以上海为核心的长三角及整个长江流域对外开放、大规模资本与技术引进、进出口取得很大发展。到80年代末90年代初，上海和整个长江流域的大发展更是潜力待发。这时，非常需要上海提供更好的信息服务（世界的商品与服务市场信息等）、金融服务（投融资、信贷、财务结算、货币兑换）、研发、中介服务、期货市场、港口运输等物流服务、人员培训、以及法律服务等；上海市范围之内浦西已特别拥挤，进一步发展需要大大拓展空间。在这种大形势下，浦东新区的设立与开放，使整个长江流域广阔经济腹地的进出口物资及大量资金、机构、技术与创新人才等迅速集聚到上海及其浦东。中央政府与上海市、江苏省政府给予大力支持、保障，使浦东新区开发非常成功。


    # 三、雄安新区难以吸引大量经济要素特别是技术创新要素的集聚


    我国国家特区、国家级新区、高新技术开发区及综合配套改革试验区已经接近200个，国家级经济技术开发区200多个。全国各地的新区新城，总体上已经“饱和”。所谓的“饱和”，不是指内部已经“填满”，没有地方了，而是没有足够新的经济增长要素、技术创新的要素进去，进去以后怎么做也是问题。对于大多数新区、新城、高新技术园区而言，现阶段特别重要的是苦练“内功”，即构建区域创新体系，这已经成为长期发展的关键。


    +   1、规划一个新区、新城有没有相应的产业支撑及发展什么样的产业，最主要的要看以下两个主要条件：其一，从宏观上分析，经济发展与经济要素、技术创新要素的集聚动力与流向。从全国特别是沿海地区看，这种流向由西向东。原因是人类社会经济活动受海洋的吸引是长期趋势，在今天的中国就更加如此。雄安新区选址不符合我国经济要素“自西向东”的宏观流向，难以吸引有利于产业发展的要素集聚。其二，新区新城，要考虑大区域内或特大城市能否给与产业支撑，附近的“母城”是否有较强大的经济辐射力，形成主体（母城）与新区相互需要的带动与互动的特别关系。雄安新区发展的“母城”是首都北京，由于上述原因北京的经济辐射力达于全国。北京的经济要素和技术创新要素是否需要迁到雄安，现在看，可能迁去的趋势不明显。


    天津市及其滨海新区具有很大规模与实力的制造业，但有没有经济与技术创新“要素”愿意往“西”迁移到雄安新区来？我们认为也是个问题。


    作为河北省新区，但河北省不像多数省市那样以一个经济实力很强的特大城市引领全省经济的发展。河北省的主导产业是能源重化工。石家庄、唐山、'
  merge: -1
  img_proc: true
- pgno: 308
  md: '保定、沧州、邯郸等一般大中型城市，除能源原材料外，很少有大型的制造业及其龙头企业。（河北省现在有6个国家级经济技术开发区，但至今没有一个其他类型的国家级新区。这与省领导两个时期的决策不到位可能有关：其一，在改革开放开始的20多年内，全省发展重点仍然在太行山东麓。经济发展重心不置于沿海秦、唐、沧，是导致经济增长较其他沿海省市发展为慢的重要原因之一。2007年四月份第七次党代会省委领导书记检讨了长期的“内陆意识”——经济日报，2007/04/11。其二，在发现河北由改革开放初始沿海地区的经济大省变成了经济小省后，又急于追赶，大搞能源重化工。GDP很快上去，2006—2008年间每年增长14%。2005—2012年间，河北省的钢和生铁产量都翻了一番，钢年产量达到1.8亿吨的惊人数字。钢铁、火电、水泥等规模迅速扩张，成为京津冀城市群地区的主要污染源，并酿成了相当突出的结构性困境。这两种情况使河北省失去了如沿海其他省市所抓住的有利机遇，没有为在河北建立如国家级新区、高新技术开发区或综合配套改革试验区等新区准备必要的条件。因此，河北省在一时期内难有较大规模的经济要素、技术创新要素进入雄安。


    2、如果在雄安大规模新建产业，则要考虑到：现阶段全国制造品产能普遍过剩、国民经济进入以提高质量为核心发展转型阶段、一系列大型制造设备（动力、工业、工程、交通运输、国防军工、通讯、轻工食品等）制造已经布置在全国相应的大型综合性工业基地与特大城市等容易确定背景。这里应该新建哪些龙头企业及大规模产业链工程呢？现在是回答不客观的课题。


    3、要在雄安这里大规模搞“高端制造”、“智能制造”，“发扬改革创新精神，建立体制机制新高度。”但可能性、合理性如何？如何操作呢？现有的中关村国家自主创新示范区、亦庄、天津经济技术开发区、滨海新区等发展条件要明显优越。它们已经有了一批高新科技企业，已经是京津冀乃至全国的经济增长极。从区域层面，其一，要使大量经济发展与科技创新的要素来此集聚；其二，要建设与创新目标相适应的多种类型的平台；其三，要组织（企业家、行业、机构）多层次的、多领域、多范畴的彼此相互链接的创新“空间”，即各种功能平台和群体的决策与运作“空间”；其四，要使各种平台与“空间”成为彼此互动与交流的网络型（多重空间）组织结构，在这种组织机构的某一地点或几个地点（区域）形成空间（创新空间）的接触枢纽。位于这个枢纽的附近即可获得更多、更大的创新优势。还有，从政府层面，制定和实施相应的制度、政策和措施。这样的区域，才是具有创造力与竞争力的区域，对于大量的企业而言，最大问题是使工业自动化和IT技术的密切结合，推动信息化诸多前沿技术的发展与应用。


    我以为，我国京津地区、长三角地区、珠三角地区以及成都、西安、沈阳等特大城市的部分新区、高技术园区，其政府、研究所、高校及许多企业可能正在考虑进行上述区域创新体系的构建与企业信息化改造工作，这些区域的区域创新体系还在起跑线上。企业自身发展空间仍然很大。对于津这些地方这些区域的发展，很可能会影响到一些“园区”正在构建的各种要素聚集的（有形的与虚拟的、刚性的或“柔性的”的“平台”、“空间”、“枢纽”，从而会影响到具有创新能力的企业不同程度延迟创新升级的时间，对
    一些重要环节或具有“节点”意义的企业、“平台”等可能会带来伤筋动骨的影响。


    # 四、新区选址带来的困难很多


    1、雄安新区的区位无论从宏观与微观看都没有优势，人居环境的底本条件很差，资源环境承载力低，现有的交通系统也不算便捷。其巨大影响虽然可以通'
