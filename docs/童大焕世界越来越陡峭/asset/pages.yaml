  md: '# 【2019年11月7日，关于《世界越来越陡峭》】


    2015年1月15日，当写下《世界越来越陡峭》这个完全颠覆传统发展模式的文章标题的时候，我并没有想到，这是22年城市化研究中，我最得意的三个概念之一。


    另外两个得意概念，一是“人生最大的不平等是出生地的不平等”。君不见很多人，即使背井离乡，即使债台高筑，即使冒着生命危险偷渡也要到更好的地方去发展。


    再一个是“密度就是生产力，密度就是竞争力，密度就是创造力”，人们将越来越见证城市密度带来的巨大能量。


    所以，当我以《世界越来越陡峭》作为书名，结果近年力作、出版社辗转数年终难付印、要求更改书名再出的时候，我拒绝了。我太珍惜这个书名，确切说是太珍惜这个概念了！


    因为，后来大量活生生的事实，正一点一点全方位地证明我书中的预见。


    也因此，当我最终决定以数字文本的方式，将文稿奉献给关心未来命运的人们的时候，我还专门在后面加了一章，集中呈现我的前瞻性判断在几年后一被验证的事实。


    这是我多年来关于城市化研究方面最轻松好读的一部文稿。一方面，缘于多年的研究已经使我对城市化规律的把握，从宏观趋势到微观观察，不敢说炉火纯青，至少已胸有成竹；另一方面，这些都是篇幅短小的随笔，读起来自然也更轻松。'
