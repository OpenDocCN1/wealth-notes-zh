    以 2014 年为界，未来的城市发展应该告别摊大饼平面发展，走向面积萎缩高度凌空 的集中式向上生长。


    除了一些中小城市房地产面临供应过剩危险，中国还有几种类型的房地产面临严重过剩，比如旅游、养老、休闲地产。“在共计 1.28 亿套的美国存量住宅中，只有不到
    300 万套是用于休闲度假的第二套住宅。”（《城市的胜利》）而“未富先休”的中国，休闲和旅游地产早已过剩。中产阶级奢侈的田园梦想，看来除了增加碳排放、破坏环境、把人变成房子的奴隶而非主人之外，并没有能够给我们带来真正的惊喜和健康生活方式。


    至于所谓“城市病”，根本不是城市有病，而是规划有病管理有病。试图控制人口，把企业迁走，是规划有病百姓吃药，不仅无效而且适得其反。怎么个“规划有病”？一是如华远地产董事长任志强所举例，芝加哥城市核心区人口
    270 万，北京只有 240 万，但芝加哥并没有发生像北京的城市病，其原因是城市的交通网络非常发达和便捷，而北京 CBD 及周边的城市道路规划建设则很杂乱。二是城市决策层对密度的恐惧，妨碍了城市的高度、密度和低碳发展。三是城市区域功能单一，没有实现居住、办公、商业混和多功能高强度利用。导致有些地方白天人密晚上空荡荡，另一些地方白天空荡荡晚上人密集，商业成本和交通成本大大提高。


    正确做法是城市高密度集中发展，区域多功能设计使商业和交通利用率最大化，区域内摒弃小汽车交通为主，而以步行和自行车交通为主。


    如果你真的热爱自然，请进入城市；如果我们真想克服城市病，请让城市更高更密、更亲近步行和多功能混合。


