  md: '中国人还有一种癌症一样的文化思维习惯：缺乏逻辑，缺乏全局理性思考的能力，缺乏对科学与规律的敬畏，相信精卫填海、愚公移山，有志者事竟成。中国古代的儒道哲学“人定胜天”，原指“人心安定高于一切”，这里的“天”和“民以食为天”的“天”同义，但在现代中国，这个词却被偷梁换柱变成了“人类一定能够战胜自然”，可以置一切科学与规律于不顾，在城市化问题上尤其如此。认为只要人类想在哪里建城市，就一定能够在哪里建成城市；人类只要想阻止人们进入哪座城市，也就一定能够阻止他们进入城市。这便是当代中国城市化过程中的奇葩运动：一边大建无人居住的鬼城空城，一边大肆阻止外来人口进入大城市。


    他们的理由很高尚：大家都进城，农村怎么办？谁来种粮？大家都进城，谁能安排那么多就业？他们买不起房怎么办？正是在这样的杞人忧天和进退失据中，我们被迫沦为城市的候鸟：城市进不去，乡村回不了！


    其实，乡村的衰退并没有那么可怕，甚至，没有乡村的衰退，就不会有乡村的重生。过去十年左右，中国有三分之一、90万座的村庄成为空心村，并且这样的消失依然在进行。但从空心村里流出的人们，整体上生活只会更好不会更差；那些空心村，人退自然进，环境也只会变得更好。大量人口从农村流出也是提高农业规模经营程度和劳动生产率的前提条件。


    人口的空间再配置是世界普遍现象。人口的流出只是人们不断在寻求更高的收入和更好的工作。贫困人口没有办法迅速地富裕起来，但他们可以在城市和农村之间作出选择，其中许多人有理地选择了城市。


    美国有3亿多人口，其中住在农村地区的人口仅约2%，从事农业生产的人不到1%，其中又只有半数以农业作为主业。美国农民平均年龄接近60岁，并且近年来一直呈上升趋势。但这并不妨碍美国成为世界第一农业大国。1%的农业人口，农业产值占美国的1.2%。意味着农民从平均上比市民更富裕。（2013年5月30日新华网）美国的人口在整体空间上也是高度集聚的，大约80%的人仅仅集中在大约3%的国土面积上。其中，9个人口最多的州拥有略多于一半的总人口，25个人口最少的州拥有的人口占比不到六分之一。但是每个人州的人均GDP却是高度均衡的。这是一种自然均衡，非刻舟求剑的人为控制。


    我们根本不必担心农民进城以后没有就业。我那刚刚从山西毕业的学生胡宇飞在河南安阳这个百万人口的城市感叹：“一个普普通通一个一个月5000工资，出租车司机5000块没问题，用的是天然气不是汽油。人多带来的能量太恐怖了……”


    除了大规模的乡村向城市迁徙运动，城市之间也会出现人口逐渐流向大城市及其周围的都市圈集聚过程。继大量空心村之后，还会不断出现规模较小但数量不少的空气城。


    在大城市圈内部，郊区环境保护主义已经过时。环境真正的朋友是曼哈顿以及伦敦和上海的市中心，而非郊区。与居住在城市里的人口相比，居住在树木和草地周围的大自然爱好者们消耗了更多的能源。


    我们必将迎来一个人口越来越集中、城市越来越高耸、世界越来越“陡峭”的时代。面对浩浩荡荡的城市化潮流，面对广袤中国大地上巨大的城乡差距和地区差距，公共政策只应该帮助贫困的人们，而非贫困的地区。任何人都没有能力迅速抹平差距、给予福利，但至少，我们可以、也应该把自由还给人们！


    这是我多年来关于城市化研究方面最轻松好读的一本书，一方面，缘于多年'
