    # 治安状况深刻影响城乡格局


    十年惊荣 2014 年年中写的《我富裕同时又贫困着的故乡》，讲到故乡最豪华的楼房人去楼空，原因是“这层没人敢住。”原来房屋男主人和务工多 3 年，积攒了一笔钱，回乡建起了房屋。然后男主又外出打工，留下妻子和父母在家。夏天的一个深夜，几个烂仔开车停在马路旁，然后翻墙而入，殴打了两位老人，性侵了年轻的女主人，然后洗劫财物扬长而去。由于地广人稀，警察一时也做不了案，主人们最后只得远走他乡，到男主打工的城市去生活。


    2014 年年底，网络上又在传另一篇据作者为王德培的文章《回家乡的恐惧——中国部分县城的现状》，文章描述的是广西全州县，一个 80 余万人口的农业大县，近
    10 年县里的几家国有企业已倒闭并被变卖。县城除了农业、服务业，基本没有其它产业。这样“ 1 ”县，仅有的少量矿产资源被黑社会垄断，城里就业岗位差，年轻人抢劫成风，外地人连个馆子都不敢开；满城赌、毒，没有安全感、没有希望是一种普遍的生存状态。


    我简单查了一下，这篇文章最早似乎发表于 2007 年 1 月，天涯热淡 2010 年 1 月转发，迄今已有 86 万个点击。 2014 年，随着微信普及，它可能又一次得到了大范围的传播。每一次旧文重发，都意味着它触动了时代的痛感神经，和时代的脉搏发生了共振。我的一位在省城当警察的朋友在我的微信转发后留言：“我相信。”


    我们以前常说的“故乡沦陷”，大部分指的是乡村衰落。《回家乡的恐惧——中国部分县城的现状》则是相当多 1 县城的缩影，说明衰落的不仅仅是乡村，还有大量的小城镇。随着政府亲历亲为招商引资主导的“中国模式”下工业产能的大量而迅速过剩，一些县城将有可能迎来新的一轮企业倒闭潮，由此带来的就业机  会减少和治安状况恶化将有可能长期困扰中国一些不发达地区的小县城。而治安状况的好坏将深刻影响城乡发展的格局。


    今天中国人谈城市化往往言必称美国，把美国当成一个高度乡村化的地方。这既是一个误解，人口众多的中国无法承受郊区化生活和汽车社会之重。美国三大都市区（大纽约区、五大湖区、大洛杉矶区）GDP
    占全美国的份额为 67%，日本三大都市圈 GDP 占全日本的份额则达到 70%。美国的芝加哥大楼之高、之密，中国任何一座城市都望尘莫及。是他们人多地少？完全不是！


    治安状况对城市格局的演变发展，往往起着至关重要的  用。因为治安的恶化不仅威胁财  安全，也威胁人身  安全，其对人心制造  恐惧与创伤，比物质伤害大得多，久久难以弥合。美国早期的郊区化发展态势的形成，跟黑人解放后城市中心地区治安状况恶化有很大关系（越是穷人越需要人口多的城市中心才能较好地生存和发展，这是一个全球性的规律），它逼得富人不断地迁往郊区；加上'
