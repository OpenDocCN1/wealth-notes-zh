    # 人为控制人口和产业当心城市孟买化


    2014 年 5 月 1 日起，北京开始执行第二套阶梯水价方案，90%的居民家庭用水价格由 4 元上上调为每立方米 5 元，中水价格由 1 元上涨为 3.5
    元。


    而在 4 月 26 日，昌平区刚刚立下“军令状”，未来将通过全面清退低端产业，加大拆除违建力度，全面清理“群租房”，严控“五证”审批考核等一系列措施，尽快将外来人口比例降低到
    50%以下，从而甩掉“外来人口比例倒挂区”的帽子。


    这一切都只是北京加大控制人口力度的一个组成部分。其基本思路是要通过提高北京生活成本控制规模和人口，不排除包括提高房价本身。如五环内允许新增建筑面积，只能通过用地结构调整获得土地。


    据悉，在 2013 年底召开的中共北京市委十一届三次全会上，市长王安顺已经将“着力破解人口资源环境矛盾，坚决控制人口过快增长”列为 2014 年的首要任务，并表示，“这是解决交通、环境等诸多问题的关键，也是中央对北京市提出的明确要求。”（《华夏时报》2014
    年 5 月 4 日）


