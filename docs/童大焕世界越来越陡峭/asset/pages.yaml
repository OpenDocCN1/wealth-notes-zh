    # 哪里楼高就买哪里


    世界贸易中心（World Trade Center），是位于美国纽约曼哈顿岛西南端的一个建筑群，由 2 座 110 层并立的塔式摩天楼与 1 座 8 层、2
    座 9 层、1 座 22 层、1 座 47 层的大楼组成。其中世界贸易中心一号楼和二号楼曾为美国纽约最高的'
