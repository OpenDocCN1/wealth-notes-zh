    7 千万流动性的，但由于作为抵押品的土地和房屋评估值大大降低，也许只能贷到三千万，不足部分企业就有可能被迫借高利贷，最后有可能导致企业破产，企业、民间金融和银行一齐倒霉。整个经济则倒退不前，失业增加。


    当下中国房地产对经济的作用更可以用“空前绝后”四个字形容，因为长期以来有两个经济的基本面都靠城市商品房市场来输血。一是各地方政府的招商引资，都是通过把工业用地成本转嫁到商品房用地的办法来吸引投资，进而导致神州上下无一产业不过剩的困局；二是农村住宅虽然没有得到银行贷款，但也需要靠城市商品房输血。没有城市商品房的发展，就不会有大量农民工从房地产的产业各种行业中赚到钱，进而也没有可能回盖新房。想想
