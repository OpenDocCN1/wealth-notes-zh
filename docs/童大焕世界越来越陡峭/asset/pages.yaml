    # ## 从东北衰落看京津冀一体化


    2015年1月1日的元旦钟声刚刚响过，晚间就传来英国《经济学人》关于东北经济再度告急的声音：沈阳五爱批发市场的店主李晓莉（音）称：“人们挣钱越来越难了，花钱也不像以前那么随便了。”李晓莉卖不出去的
    汽车坐垫反映了中国东北不断恶化的经济状况。汽车销量下滑、房地产市场下行，这是全中国 的情况，但东北尤其严重。作为该地经济支柱的重工业也不再景气。


    报道说，东北三省黑龙江、吉林和辽宁2014年前三个季度GDP增速在中国31省市中位居最后五位，其6%的增速较全国水平落后1.4个百分点。更糟的是，10月东三省工业产出同比仅增长0.5%，远低于全国7.7%的平均水平。


    东北三省的衰落，演绎的正是“成也萧何败也萧何”的故事。中国“锈带”东北有居民1.1亿，毛泽东时代成为重工业中心，但从1980年代改革开放起光环就开始褪色，珠三角和长三角地区成为企业家的乐土。只因东北地区老式的计划经济思维根深蒂固，在1990年代末大规模破产发生后，一些城市官员认为他们需要中央资金发展更多国有企业，国有企业和私营企业都涌人采矿业、重型设备和房地产行业。辽宁社科院的梁启东（音）甚至认为，东北是全球苏联式经济的最
    佳典范，因为其中 央计划思维持续了如此之久。他称：“很多人仍不理解或不相信 市场的作用。”


    在全球经济一体化的市场背景下，传统落后的计划经济思维将成为经济、社会和家庭、个人衰败的最致命原因，不论是国家、地区还是家庭都是如此。头脑中有顽强依赖“国家”思维的，即使富也超不过二代，也就是第二代即衰败。东北地区从官员到民众根深蒂固的计划经济思维，不仅导致经济迅速衰退，国家层面的振兴东北计划也无济于事；而且导致人口大量衰减，生育率降低使社会活力降低，加速青壮年人口流出，东北三省每年净流出人口200万，这一切又进一步加速这一地区的整体观念落后于时代，前不久曝出的东北三省大量五十至七十岁中老年人拆迁获得的几十万养老本被河南人来开的资产公司席卷一空，即是写照。而东北三省近邻的俄罗斯远东地区、日本、韩国、朝鲜等地，要么人口稀'
  merge: -1
