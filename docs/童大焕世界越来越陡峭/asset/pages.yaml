    和货币超发两个因素的强力挤压，悄无声息却惊心动魄，有如地壳运动，会挤压出价值连城的钻石翡翠， 也会淘汰多得多的沙石泥土。你是成为翡翠钻石还是成为沙石泥土，取决于你今天的学习能力和学习态度。靠天靠地靠权力靠关系，都不如靠你自己。


