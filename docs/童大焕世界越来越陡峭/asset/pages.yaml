    * 彩票中了 800 万，回家学土豪包二奶；

    * 厂小，女孩少，不好泡妞；

    * 回家养猪；

    * 回家炒股；

    * 极度不开心；

    * 本人智商低，无法胜任此工作；

    * ......


    不管是宏观上遵循万有引力和广义相对论，还是微观上追随自己的内心世界，只要是自由选择就应该得到尊重。最可怕的是，微观一方想用自己的选择和价值观强制宏观一方遵从自己的意愿，搞什么就地城镇化；或者宏观一方自以为代表潮流强迫微观服从，试图逼迫他人进城，迁农民上楼。本质上都是把别人当成没有自由权利和自主能力的工具。这些，都是悲剧。


