    横向比较，城市群之间层级分化突出，且日趋固化。比如，山东半岛城市群尽管在东部仅居于二线，但总体发展水平仍高于中部的成渝和中原。中原经济区和成渝经济区不仅综合素质指数偏弱，发展速度和发展质量均滞后，在发展思路与模式上也比较被动，依附并受制于东部。在具体指标上，中西部城市群环境污染情况不容乐观，主要是东部城市群落后产业、环境污染产业转移导致，急需规避。


    如果我们把目光聚集在城市圈内，以更加科学合理的城市聚集体（空间上连成一片的建成区）概念来定义和研究城市群，一定会发现另一个规律：不仅城市群外的人口不断向城市群、向东面一线城市集聚，而且会发现城市群内部，人口和产业也在不断地加速集中。换句话说，城市化不仅带来中西部差距的拉大，而且城市群内部也在加速人口和产业集中以及由此带来的区域分化。形成与当年行政主导的大三线（向西部进发）和小三线（各省各区域内向山区开发）刚好完全相反的城市化走向。傅蔚冈《人到底应该去哪儿》给我们揭示了更清晰的人口流动方向数据：


