    但我想提醒的是，不论是地方政府，还是开发商，抑或是购房者，对于“超级大都市”都要有清醒、理性的认识。真正的超级大都市，是人口和资源的超级聚集，不是单纯的面积扩大。越是超级大都市，越是人口与资源的集聚远甚于面积的扩大。一个基本常识是：只有人口和资源的集聚，才能提高能效效率，才能降低对环境与资源的浪费与破坏，才能更好地集中处理污染。


