  md: '而且会助长落后地区民众的“左倾”甚至无赖心理：仇富，等靠要，仇视自由市场经济，呼吁强权，等等。恶性循环。经济学、房地产专家董藩的真实遭遇非常典型，他说：“免费一般玩不下去，故人类未进来共产社会而是进入了市场经济社会。我偶尔也免费讲，但常带来很多麻烦，人数与安全把握不住，报了不来，来的有人要求车接、报销差旅，没参加上的有人私信骂我。”


    尊重市场和商业法则，比政府充大哥重要得多。哈耶克说，商业就是最大的公益。只有严格遵守商业法则的市场自由，才是帮助穷人的最高最及时福利形式。中国现在最大的问题，不在于有些地方在迅速崛起、有些地方在迅速衰落，而在于政府力量一直在不自量力地螳臂当车，既违背商业投资逻辑和公共财政职责不断地在衰败地区追加投资，也违背市场自由逻辑不断限制公民从不发达地区向发达地区流动！一边是“西部大开发”、“东北振兴”，一边是“严格控制特大城市人口规模”！


    事实上，市场和人口流动的邏輯一直不按政府的意志走。《21世纪经济报道》2015年4月13日文章《即将开始的人口“战争”》告诉我们：东北地区是人口流出最明显的区域之一。但东北地区并非人口流出最多的省份，安徽、四川等中西部和西南省份跨省流出人口最多。根据国家卫计委的数据测算，目前跨省流动人口已占全部流动人口的38.9%。其中，人口主要从中西部和西南地区流出，安徽、四川、湖南、河南、贵州和江西6省占全国跨省流出人口的71.07%。


    你看，这 6 大跨省流出人口大省，在中国意识形态光谱里，除了四川“不左不右”，其它全是“左派”阵营！


    再看跨省流入地情况。国家卫计委的数据显示，截至2013年，广东的珠三角，长三角的浙江、上海、江苏，北京，海西经济区的福建6省市占全国跨省流入人口总数的87.83%，较2012年同期上升了4.5%。


    你看，这 6 大跨省流入人口大省，在中国意识形态光谱里，全部处在“右派”阵营前 6 名！


    这一出一进，人口奔向自由，奔向开放，奔向商业文明的趋势不是再清晰不过了吗？自由流动不仅可以让流动起来的人们变得更加富裕，让经济更加快速健康发展，而且也是在文明层面上消除社会上的左倾、封闭、敌对和阶级仇恨心理！因此，财产自由、市场自由、迁徙自由不仅可以使经济提速，也必将使社会文明、政治文明也大幅度提速！


    可是，我们的理念，我们的政策却每每要逆潮流而动。这是为什么呢？我们的市场经济口号喊了三十多年，至今竟仍然不知市场与自由为何物，依然想走已经穷途末路的政府主导、投资刺激老路，好大喜功，追求短期政绩效应；同时依然在限制公民土地财产自由和迁徙自由的脚步。这，就不仅是东北危局、经济危局，而应该称之为中国危局甚至中国的文明危局了。


