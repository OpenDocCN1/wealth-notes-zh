    ## 租房时应注意的法律风险！


    对刚出来工作的程序员，尤其是计算机专业的毕业生来说，租房、买房是必不可少的日常行为。但是在租房、买房过程中会遇到种种法律风险，也会遇到各种套路，如何识别，本文档将会给你透露部分干货，供你参考。


    - 1. 无效租赁合同及其处理


    按照《民法通则》第61条和《合同法》第58条规定，房屋租赁合同确认无效后，其处理上主要是承租方腾退房屋，租赁房屋恢复到签订合同之前的状态，承租方负责将租赁期间添附物拆除或与出租方协商抵销。承租方实际使用房屋的，出租方不返还租金，作为租赁期间出租人不能使用房屋的损失。


    - 2. 未经验工验收的房屋出租，房屋租赁合同无效。


    依照我国《建筑法》的规定，工程未经验收或者验收不合格的，不得交付使用。《消防法》的规定，消防未经验收或者验收不合格的，不得使用。依据《合同法》的规定，违反法律强制性规定的合同无效。


    根据我国《合同法若干问题的解释》第4条的规定，人民法院确认合同效力时，应当以全国人大及其常委会制定的法律和国务院制订的行政法规为依据。现实中，房屋未经验收或验收不合格就入住的情况很多，作为承租方很难查清房屋是否验收合格，因此为避免此种无效合同风险，承租方除尽职调查外，应在签订租赁合同中约定无效合同处理条款，以保护自己一方权益。


    - 3. 违章建筑的房屋出租，房屋租赁 合同无效。


    违章房屋是指未经主管部门许可或不按主管部门许可而擅自建筑的房屋。违章房屋大体可分为三种情况：


    ①建造人未取得土地使用权即擅自建造房屋，这种情况不但违反了《土地管理法》、《城市房地产管理法》相关规定，而且侵害了他人或国家的土地使用权，不能取得建筑物的合法所有权；


    ②是已取得土地使用权，但尚未取得建筑规划许可证、施工许可证等相关批准文件的情况下擅自建造房屋，该房屋用于出租，则签订的租赁合同因违反法律强制性规定而归于无效。


    - 4. 防范措施


    承租方一方防范的唯一办法就是租赁前认真看出租人的房产证，没有产权证书或产权登记不符的房屋不能租。

