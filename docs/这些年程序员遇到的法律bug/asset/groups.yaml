    # 房屋合同纠纷


    # Tips1


    +   * 《团购住房协议》一方违约另一方可以主张损害赔偿。


    《团购住房协议》是商品房买卖的认购、订购、预订等协议般是指商品房买卖合同双方在签署预售契约或买卖契约之前所订立的文书,是对双方交易房屋有关事宜的初步确认,其性质即属于商品房买卖预约合同。《团购住房协议》一般仅从整体上约定了所建楼房的户型种类、套数、房屋均价,每购房者所购房屋的具体面积、楼号、单元号、层数、购房款总额等具体细节尚需“甲乙双方协商确认”,说明双方有将来再行订立具体的买卖合同的合意。据此,《团购住房协议》应当属于商品房买卖的预约合同,不等于商品房买卖的本约合同。但是一方存在违约的情况下,另一方可以根据《买卖合同司法解释》第二条：“当事人签订认购书、订购书、预订书、意向书、备忘录等预约合同,约定在将来一定期限内订立买卖合同,一方不履行订立买卖合同的义务,对方请求其承担预约合同违约责任或者要求解除预约合同并主张损害赔偿的,人民法院应予支持。”的规定,来主张赔偿。


    # Tips 2


    +   * 未取得商品房预售许可证前签订的《商品房认购书》等预约合同均为有效


    详见《最高人民法院有关负责人就《最高人民法院关于审理商品房买卖合同纠纷案件适用法律若干问题的解释》答记者问》,载最高人民法院民事审判第一庭编:《民事审判指导与参考》总第15集,法律出版社2003年版,第10页。


    记者《解释》在对合同效力的认定上,是如何体现促进商品房市场健康发展和维护稳定的商品房交易秩序这一目标的?


    答:商品房买卖合同的效力不仅关系着交易关系的稳定和当事人合法权益的保护,而且关系到商品房市场的健康发展。《解释》根据《合同法》的规定,对当事人在平等自愿基础上订立的合同,只要没有《合同法》第五十二条规定的合同无效情形,就应尽量尊重双方当事人的意思表示,不轻易确认合同无效。同时要求法官应当注意区分司法审判权和行政管理权的不同职能,正确行使审判权。因此,人民法院对出卖人预售资格的审查,主要是看其是否取得商品房预售许可证明,对其他预售条件的审查则是行政管理部门的权限。对商品房买卖合同的登记备案问题,我们认为这应当属于行政管理部门的种合同管理措施,不是确认合同效力的必要条件。《解释》对此予以明确,避免了司法审判权与行政管理权之间的冲突。另外,考虑到我国房地产市场目前的实际情况,《解释》第二条还明确规定当事人在向人民法院起诉前取得商品房预售许可证证明的,可视为其具备预售资格。这样,人民法院在适用法律过程中既能维护法律的严肃性,又能维护合同的严肃性,确保当事人合同权利的实现。'
