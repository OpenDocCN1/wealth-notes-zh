    ## 竞业禁止


    ### 1 Question


    ![](img/8bf480dc4432e799d299f98ca8474e98_16_0.png)


    ### 竞业限制超过2年是否有效？


    超出2年的期限部分无效。主要理由在于：首先，竞业限制义务对劳动者的择业自由权和生存权会产生影响，而劳动者的择业自由权和生存权在法益体系中至少不比合同自由低。其次，如果不认定超出2年期限部分的竞业限制条款无效，就难以通过其他手段达到《劳动合同法》所追求的将竞业限制期限限制在合理范围内的立法目的。当然，如果双方当事人已经履行完毕超过2年期限的竞业限制义务，劳动者请求用人单位按约定支付经济补偿金的，自然应予支持。


    ### 2 Question


    ![](img/8bf480dc4432e799d299f98ca8474e98_16_1.png)


    ### 劳动合同解除或者终止后，竞业限制的对接经济补偿是否继续履行？


    《最高人民法院负责人就<最高人民法院关于审理劳动争议案件适用法律若干问题的解释(四)>答记者问》，载最高人民法院民事审判第一庭编著：<最高人民法院劳动争议司法解释(四)理解与适用>，人民法院出版社2013年版，第14页。


    不论是用人单位还是劳动者违法解除合同，都不必然导致竞业限制的约定失效。劳动合同解除实行的是法定制度，而竞业限制实行的是约定制度，竞业限制具有相对独立性，其与解除劳动合同同属于并列关系，而非逻辑递进关系。当用人单位违反不同的义务时，劳动者可以依据不同的法律规定获得相应的救济。所以用人单位违法解除劳动合同不影响竞业限制约定的有效性。


    对于用人单位违法解除劳动合同，《劳动合同法》已经为劳动者提供了相应的民事补偿或者救济措施，以制裁用人单位的违法解雇行为。用人单位承担了相应法律责任后，劳动者和用人单位双方理应受竞业限制协议的约束。《解释(四)》正是基于上述法律原理作出了规定。这样的规定同样有利于对用人单位的商业秘密加以保护，否则劳动者从事与用人单位有竞争关系的业务，会导致市场公平竞争秩序的混乱。因此，《解释(四)》将竞业限制条款的有效性与违法解除劳动合同相分离，有助于正确区分二者的关系。


    ## 婚姻家庭纠纷


    ### Question 1


    - 登记结婚时使用假身份怎么处理？


    烟柔为了骗取包子彩礼钱，使用假身份证与包子登记结婚后，玩起了失踪。包子为了解除与烟柔之间的夫妻关系，遂向法院提起诉讼，后被法院判决驳回。


    ### Legal Analysis


    - 法律分析


    在这种情况下烟柔借用或冒用他人身份证明进行登记、婚姻登记机关材料有瑕疵等，欠缺了结婚的实质要件，在法律规定的的情形内，可以被人民法院宣告无效。结婚登记在性质上属于行政行为，但对仅有程序瑕疵的结婚登记的法律效力，只能向法院提出行政诉讼的方式，请求法院宣告婚姻无效。


    ### Laws


    - 法律规定


    《婚姻法司法解释三》第一条规定：“当事人以婚姻法第十条规定以外的情形申请宣告婚姻无效的，人民法院应当判决驳回当事人的申请。当事人以结婚登记程序存在瑕疵为由提起民事诉讼，主张撤销结婚登记的，告知其可以依法申请行政复议或者提起行政诉讼。”


    ### Question 2


    - 登记时未满婚龄，起诉时已到婚龄，这样处理！


    沐橙与少天两个人是高中同学，都是18周岁。两个人早恋后，沐橙怀孕。为了尽早的办理结婚登记手续，沐橙的家人通过熟人帮助沐橙和少天在民政局办理了结婚登记手续。结婚后，随着两人性格之间的差异，两个人的感情越来越差。五年后，少天向法院提起诉讼，称自己与沐橙两人之间因结婚时未达婚龄，请求法院判决婚姻无效。


    ### Legal Analysis


    - 法律分析


    按照《婚姻法司法解释一》的有关规定，少天在起诉时，如果沐橙和少天确实没有到达法定婚龄，法院应当宣告婚姻无效。但是如果起诉的时候双方都已经达到法定婚龄了，法定的无效婚姻情形已经消失了，那就只能依法向法院提出离婚。


    ### Laws


    - 法律规定


    《婚姻法司法解释一》第八条规定：“当事人依据婚姻法第十条规定向人民法院申请宣告婚姻无效的，申请时，法定的无效婚姻情形已经消失的，人民法院不予支持。”


    ### Question 3


    - 问：未成年人子女的抚养权如何判决？


    - 果果与晓晨结婚后，生下了一名男孩，不到两岁，双方因感情不合，晓晨后向法院提出离婚，请求小孩的抚养权。开庭过程中，晓晨指出双方之间感情不合是因为果果长期赌博，而且果果也没有任何收入来源，遂请法院将小孩的抚养权判归晓晨。


    ### Legal Analysis


    - 法律分析


    在抚养权案件里面，小孩如果未满两岁，一般判归母亲抚养，但是如果男方能够举证明，女方对小孩的身心成长明显不利，那么法院还是可以将小孩判给男方抚养。判决小孩抚养权，一般从最有利于小孩身心健康、保障子女合法权益的角度出发，最大的保护未成年子女的利益。果果有赌博的恶性，对小孩的成长不利，所以晓晨是可以争取到小孩的抚养权。


    ### Laws


    - 法律规定


    《最高人民法院关于审理离婚案件处理子女抚养问题的若干具体意见》1、两周岁以下的子女，一般随母方生活。母方有下列情形之的，可随父方生活：


    - （1）患有久治不愈的传染性疾病或其他严重疾病，子女不宜与其共同生活的；

    - （2）有抚养条件不尽抚养义务，而父方要求子女随其生活的；

    - （3）因其他原因，子女确无法随母方生活的。


    ### Question 4


    - 抚养费用增多，可以要求另一方支付子女抚养费？


    陌上花开因为双方之间感情不合，一起去民政局协议离婚，协议离婚时双方对小孩的抚养权和抚养费作出了特别的约定。小孩抚养权归陌上所有，花开不承担小孩任何抚养费用。几年过后，陌上因为遭遇变故，导致欠下大量外债，一人无力承担小孩的抚养费用。为了能够正常抚养小孩，陌上向法院提起诉讼，请求花开承担小孩一半抚养费。


    ### Legal Analysis


    - 法律分析


    父母与子女间的关系，不因父母离婚解除。离婚后，子女无论有父亲还是母亲抚养，仍是父母双方的子女，离婚后，父母对子女仍有抚养的义务，如果经法庭审核实双方经济情况有无变化，子女的生活费有无增加，从而作出是否变更或维持原协议的判决。在陌上经济情况发现变化后，法院是可以判决花开承担小孩一半的抚养费的。


    ### Laws


    - 法律规定


    > 《关于人民法院审理离婚案件处理子女抚养问题的若干具体意见》第15条：离婚后，一方要求变更子女抚养关系的，或者子女要求增加抚养费的，应另行起诉。


    ### Question 5


    - 问：怀疑小孩并非自己所生，妻子不愿意做鉴定怎么办？


    - 宁少与妻子结婚后，发现妻子经常与其他异性频繁沟通，怀疑妻子有出轨的嫌疑。妻子怀孕后，宁少担心小孩并非自己的亲生小孩，想给小孩做个亲子鉴定，但是妻子不愿意配合。此后，宁少与妻子之间的矛盾日益深刻。后来宁少向法院提起离婚诉讼，庭审时，宁少向法院申请亲子鉴定，但是妻子拒不配合。


    ### Legal Analysis


    - 法律分析


    《最高人民法院关于适用<中华人民共和国婚姻法>若干问题的解释(三)》第二条夫妻一方向人民法院起诉请求确认亲子关系不存在，并已提供必要证据予以证明，另一方没有相反证据又拒绝做亲子鉴定的，人民法院可以推定请求确认亲子关系不存在一方的主张成立。当事人一方起诉请求确认亲子关系，并提供必要证据予以证明，另一方没有相反证据又拒绝做亲子鉴定的，人民法院可以推定请求确认亲子关系一方的主张成立。因此，法院可以判决宁少与小孩无血缘关系。


    ### Laws


    - 法律规定


    《最高人民法院关于适用<中华人民共和国婚姻法>若干问题的解释（三）》第二条做出了详细的规定：“夫妻一方向人民法院起诉请求确认亲子关系不存在，并已提交必要的证据予以证明，另一方没有相反证据又拒绝做亲子鉴定的，人民法院可以推定请求确认亲子关系不存在一方的主张成立。


    ### Question 6


    - 问：虐待未成年人子女的，可以申请变更监护人资格？


    - 玄羽与黑鸦协议离婚，双方生育的小孩一直跟随黑鸦生活，由黑鸦进行监护。离婚后，黑鸦长期沉迷赌博、生活困难。为了满足自己的赌欲，黑鸦要小孩到处乞讨。玄羽知道此事后，要求黑鸦让小孩由自己抚养，但双方因无法协商一致，玄羽向法院提起诉讼，要求变更抚养权。


    ### Legal Analysis


    - 法律分析


    答：根据《最高人民法院最高人民检察院公安部民政部关于依法处理监护人侵害未成年人权益行为若干问题的意见》35，玄羽可以申请法院变更监护人资格。


    ### Laws


    - 法律规定


    《最高人民法院最高人民检察院公安部民政部关于依法处理监护人侵害未成年人权益行为若干问题的意见》35.被申请人有下列情形之一 的，人民法院可以判决撤销其监护人资格：


    - （一）性侵害、出卖、遗弃、虐待、暴力伤害未成年人，严重损害未成年人身心健康的；

    - （二）将未成年人置于无人监管和照看的状态，导致未成年人面临死亡或者严重伤害危险，经教育不改的；

    - （三）拒不履行监护职责长达六个月以上，导致未成年人流离失所或者生活无着的；

    - （四）有吸毒、赌博、长期酗酒等恶习无法正确履行监护职责或者因服刑等原因无法履行监护职责，且拒绝将监护职责部分或者全部委托给他人，致使未成年人处于困境或者危险状态的；

    - （五）胁迫、诱骗、利用未成年人乞讨，经公安机关和未成年人救助保护机构等部门三次以上批评教育拒不改正，严重影响未成年人正常生活和学习的；

    - （六）教唆、利用未成年人实施违法犯罪行为，情节恶劣的；


    ## 夫妻共同财产问题的处理


    - 问：婚姻无效的情况下财产如何处理？


    叶星云与叶嫣然两个是表兄妹。两个人在一起时间久了，双方成了情侣。为了能够在办理结婚登记手续，叶星云与叶嫣然隐瞒表兄妹的真实情况。后来双方感情不合请求，请求法院判决婚姻无效，并且分割夫妻共同财产。


    按照《婚姻法司法解释一》第九条的有关规定，婚姻宣告无效，夫妻共同财产问题，还是按照离婚的有关程序处理。


    《婚姻法司法解释一》第九条规定：“人民法院审理宣告婚姻无效案件，对婚姻效力的审理不适用调解，应当依法判决；有关婚姻效力的判决一经作出，即发生法律效力。涉及财产分割和子女抚养的，可以调解。调解达成协议的，另行制作调解书。对财产分割和子女抚养问题的判决不服的，当事人可以上诉。”


    - 问：如果一方转移财产，在不离婚的情况下可以分割夫妻共同财产？


    叶辰和安雪结婚后，因叶辰身患疾病向安雪提出需要医疗费治病。但是安雪为了防止将婚后共同财产全部被叶辰治疗，偷偷的将家里的财产分次转走。为了保证自己的医疗费能有着落，叶辰无奈向法院提起诉讼。


    在夫妻生活期间，在一方隐瞒财产的情况下或者一方有重大疾病的情况下，是可以在不离婚的前提条件下要求法院分割夫妻共同财产的。但是仅限于一方隐瞒财产或者一方有重大疾病的情况下，其他情形是不能直接要求分割财产。


    《婚姻法司法解释三》第四条婚姻关系存续期间，夫妻一方请求分割共同财产的，人民法院不予支持，但有下列重大理由且不损害债权人利益的除外:(一)一方有隐藏、转移、变卖、毁损挥霍夫妻共同财产或者伪造夫妻共同债务等严重损害夫妻共同财产利益行为的；(二)一方负有法定扶养义务的人患重大疾病需要医治，另一方不同意支付相关医疗费用的。


    ## 夫妻共同财产问题的处理


    - 问：夫妻之间的共同财产主要包括哪些？


    按照法律的有关规定，夫妻之间的共同财产主要包括：工资、奖金，生产、经营收益，股票、证券，知识产权收益等。但是按照属于《婚姻法》第十八条规定的这些财产，则属于个人财产，是不能向法院主张分割的。


    > 《婚姻法》第十七条 夫妻在婚姻关系存续期间所得的下列财产，归夫妻共同所有：

    > （一）工资、奖金

    > （二）生产、经营的收益

    > （三）知识产权的收益

    > （四）继承或赠与所得的财产，但本法第十八条第三项规定的除外

    > （五）其他应当归共同所有的财产。

    > 夫妻对共同所有的财产，有平等的处理权。


    - 问：一方婚前购买的股票，婚后增值是否可以请求分割？


    菲特在结婚前购买了阿里巴巴的股票。与艾美结婚后，双方之间没过几年就因为性格有差异，需要离婚。但双方因阿里巴巴股票的增值部分产生了争执，后艾美起诉到法院请求分割股票增值的收益。


    增值根据发生的原因，可分为自然增值和主动增值两种。自然增值是指该增值的发生是因通货膨胀或市场行情的变化而致，与夫妻一方或双方是否为该财产投入物质劳动努力、管理等无关。比如，夫妻一方婚前所有的房屋、古董、字画、珠宝、黄金等,在婚姻关系存续期间因市场价格上涨而产生的增值。主动增值是指该增值的发生原因与通货膨胀或市场行情变化无关，而是与夫妻一方或双方对该财产所付出的劳务、投资、管理等相关。如夫妻方的婚前房屋因在婚姻关系存续期间装修而产生的增值部分。具体到股票的增值问题,应当分析股票增值产生的原因。如果在婚前就持有股票，一直没有操作过，则股票的增值完全是市场行情变化导致的，应当将这种增值理解为自然增值,适用《婚姻法司法解释(三)》第五条的规定,将其认为婚前个人财产。


    ## 夫妻共同财产问题的处理


    - 问：夫妻共同出资登记在未成年子女名下的，是否为夫妻共同财产？


    实际生活中，夫妻双方共同出资购买房屋后,可能基于各种因素的考虑而将房屋产权登记在未成年子女名下,但这并不意味着该房屋的真正产权人即为未成年子女，需要考虑夫妻双方在购买房屋时的真实意思表示。如果真实意思确实是将购买的房屋赠与未成年子女，离婚时应将该房屋认定为未成年子女的财产，由直接抚养未成年子女的一方暂时管理；如果真实意思并不是将房屋赠与未成年子女，离婚时将该房屋作为夫妻共同财产处理比较适宜。为了避免纠纷，夫妻双方之间可以写一个协议，明确是赠与给小孩的财产，还是作为投资房。


    《婚姻法解释三》第七条婚后由一方父母出资为子女购买的不动产，产权登记在出资人子女名下的，可按照婚姻法第十八条第(三)项的规定，视为只对自己子女一方的赠与，该不动产应认定为夫妻方的个人财产。由双方父母出资购买的不动产,产权登记在一方子女名下的,该不动产可认定为双方按照各自父母的出资份额按份共有,但当事人另有约定的除外。


