    # 租房时应注意的法律风险！


    对刚出来工作的程序员，尤其是计算机专业的毕业生来说，租房、买房是必不可少的日常行为。但是在租房、买房过程中会遇到种种法律风险，也会遇到各种套路，如何识别，本文档将会给你透露部分干货，供你参考。


    # 11  租赁房屋被拍卖、抵押、查封等相关问题


    我国《物权法》第190条规定，“订立抵押合同前抵押财产已出租的，原租赁关系不受该抵押权的影响；抵押权设立后抵押财产出租的，该租赁关系不得对抗已登记的抵押权”。也就是说，如果出租在前，抵押在后，那么出租方的权益优先保障，可以说是“抵押不破租赁”；反之，已登记的抵押在前，出租在后，根据物权优于债权的民法原则，租赁关系应予以解除。承租人只能向出租人主张赔偿。《最高人民法院关于人民法院民事执行中拍卖、变卖财产的规定》第31条第2款规定：“拍卖财产上原有的租赁权及其他用益物权，不因拍卖而消灭，但该权利继续存在于拍卖财产上，对在先的担保物权或者其他优先受偿权的实现有影响的，人民法院应当依法将其除去后进行拍卖”。


    在进行房屋租赁时，承租方一定要查验出租方财产的权属情况，如要求出租方提供产权证、使用权证等材料，并核实该财产是否存在抵押、查封等权利瑕疵，以避免不必要的经济损失。


    # 12  租金支付问题


    《民法通则》第136条规定：“延付或者拒付租金的，诉讼时效期间为一年”。在房屋租赁合同中，支付租金是一个重要条款，一般双方都很重视，但提醒合同双方应注意时效问题，因租赁合同延付或者拒付租金时效为1年，争议出现后及时主张权利，避免丧失胜诉权。


    # 13  转租问题


    +   1、承租人转租房屋必须经出租人同意

    《合同法》第224条规定：“承租人经出租人同意，可以将租赁物转租给第三人。承租人转租的，承租人与出租人之间的租赁合同继续有效，第三人对租赁物造成损失的，承租人应当赔偿损失。承租人未经出租人同意转租的，出租人可以解除合同”；承租人转租房屋是可以的，但事先应征得出租人的同意。因此租赁合同中双方应明确约定转租条款，出租人可对转租附加一些必要的条件，只要不违反法律、行政法规的规定即可。


    +   2、房屋租赁后次承租人享有优先购买权

    在房屋租赁合同合法有效的情况下，出租人转让房屋，承租人与次承租人同等条件下均享有优先购买权，次承租人因已经实际占有、使用房屋，因此其优先购买权优先于承租人。

    次承租人取得房屋所有权后，其取代了原合同出租人的地位，原租赁合同依然有效，承租人转租收益权依然存在。那么在合同有效期内，次承租人需向承租人支付转租收益，否则会损害承租人合同利益，不符合“买卖不破租赁”的法律宗旨。'
