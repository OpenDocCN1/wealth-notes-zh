    # ## Preface


    程序员日常法律常识：根据程序员日常生活中可能遇到的主要法律问题进行简要的梳理，并且提供法律知识提高程序员的法律知识。


    # CataLog

    目录


    # **劳动争议**


    在日常工作中，程序员经常会与老板发生劳动争议，所涉及的情况复杂，本文档列举以下几个方面劳动争议的日常知识，帮助你进行判断，维护好你的合法权益。

    ①这种情形码农可以直接向人民法院起诉！

    ②单位不缴社保，码农败诉，怎么回事？

    ③错把劳务关系搞成了劳动关系，纵然努力也枉然！

    ④竞业限制


    # **婚姻家庭**


    以前接触过很多程序员，程序员给人最大的特点就是钱多、话少。结婚之后，很多程序员的老婆/老公总是觉得程序员生活只知道撸码，没有共同的语言，导致离婚率大量上升，本文档将从婚姻的效力、夫妻共同财产的分割、小孩抚养权三个方面，提供一些小的常识，帮助你预防婚姻关系中的法律BUG。


    # **房屋合同纠纷**


    对刚出来工作的程序员，尤其是计算机专业的毕业生来说，租房、买房是必不可少的日常行为。但是在租房、买房过程中会遇到种种法律风险，也会遇到各种套路，如何识别，本文档将会给你透露部分干货，供你参考。


