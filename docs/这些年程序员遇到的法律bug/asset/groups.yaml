    # Tips 3


    +   出卖人房二卖，不管其是否具有恶意违约故意，无法取得房屋的买受人均可请求出卖人承担不超过已付购房款-倍的赔偿责任


    详见湖北金华实业有限公司与苏金水、武汉皓羽地产顾问有限公司商品房买卖合同纠纷案[最高人民法院(2012 )民抗字第24号民事判决书]


    根据本院《商品房买卖合同解释》第八条规定，具有下列情形之一-，导致商品房买卖合同目的不能实现的，无法取得房屋的买受人可以请求解除合同、返还已付购房款及利息赔偿损失，并可以请求出卖人承担不超过已付购房款倍的赔偿责任:(一)商品房买卖合同订立后，出卖人未告知买受人又将该房屋抵押给第三人;(二)商品房买卖合同订立后，出卖人又将该房屋出卖给第三人。”可见，只要出卖人在商品房买卖合同订立后事实上存在将该房屋出卖给第三人的行为，无法取得房屋的买受人即可请求出卖人承担不超过已付购房款-倍的赔偿责任，且上述规定中并不存在此种赔偿责任的适用以出卖人具有恶意违约故意为前提的规定。


