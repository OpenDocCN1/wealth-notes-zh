    ## 租房时应注意的法律风险！


    对刚出来工作的程序员，尤其是计算机专业的毕业生来说，租房、买房是必不可少的日常行为。但是在租房、买房过程中会遇到种种法律风险，也会遇到各种套路，如何识别，本文档将会给你透露部分干货，供你参考。


    - **被确定为拆迁的房屋出租，房屋租赁合同无效。**


    《城市房屋拆迁管理条例》第12条规定：“拆迁范围确定后，拆迁范围内的单位和个人，不得进行下列活动：(三)租赁住房”。因《城市房屋拆迁管理条例》属于行政法规，该条为强制性规定，因此按《合同法若干问题的解释》第4条的规定，签订的租赁合同为无效合同。


    - **承租人装修改变房屋构造后的返修责任**


    《合同法》第223条规定：“承租人经出租人同意，可以对租赁物进行改善或者增设他物。承租人未经出租人同意，对租赁物进行改善或者增设他物的，出租人可以要求承租人恢复原状或者赔偿损失”。


    为避免此种争议产生，作为出租人要慎重答应承租人的改造要求，约定好如出现返修责任承担主体，切不可把房先租出去，而回避返修责任问题。


    - **房屋维修责任的相关法律问题**


    房屋维修责任应该是《租赁合同》中最常见的条款，合同双方一般会根掘《合同法》第220条规定，即“出租人应当履行租物合的维修义务，但当事人另有约定的除外。”，双方可以来约定维修责任。


    房屋维修责任是指在房屋租赁期间对房屋自然损坏或人为损坏的维修责任由哪一方承担的问题。出租住宅用房的自然损坏或合同约定由出租人修缮的，由出租人负责修复。不及时修复，致使房屋发生破性事故，造成承租人财产损失或者人身伤害的，应当承担赔偿责任。租用房屋从事生产、经营活动的，维修责任由双方当事人在租赁合同中约定。但“因承租人过错造成房屋损坏的，由承租人负责修复或者赔偿。明确在租赁双方签订的租赁合同中房屋维修责任条款中，以减少不必要的争议。


    - **承租人恶意添附的补偿责任**


    实践中，对于承租人对房屋进行改建、改装或者增加附着物而形成的添附物，如果是征得出租人同意的，或者按合同约定的承租目的属于合理添置的，那么按以下情况分别处理：①有约定的按约定处理；②合同没有约定而又协商不成的，拆除后并不会严重影响其价值的，一般由承租人自行拆除。不能拆除的可以对添附物现价值进行评估，归出租人所有，并对承租人予以适当补偿。


    现实中也存在承租人恶意添附的情况，在租赁合同终止时获得更多补偿的行为：客观上进行牟利而乱添附。通常承租人会采取在装饰时就出具一些假票证明自己购买的质优价廉的漆财物价值很高或是将一些没有价值的产品故意进行添附来讹取补偿等手段，造成出租人不惜补偿的严重后果，侵犯出租人合法权益。


    承租人应与对方明确约定添附物种类、价值及补偿标准等，并对装修过程进行尽职调查，以保护自己合法权益不受侵害。


    - **租赁房屋的拆迁补偿问题**


    租赁合同终止，出租人返还剩余租金，承租人赔偿房屋。虽然拆迁不能完全被认定为不可抗力，但这种约定从法律上应认定是有效的，是双方真实的意思表示。有些合同对此没有约定，遇到拆迁问题时就容易产生争议。


    如果出租人隐瞒了出租房屋的事实，单独与拆迁人签订了拆迁补偿安置协议，从而使承租人的权益受到了损害，承租人可以向出租人追偿应得的补偿部分，也可以根据具体情况主张原拆迁补偿安置协议无效，并重新签订拆迁补偿安置协议。但是，如果《房屋租赁合同》中对拆迁补偿问题有明确约定的，应该按约定处理。因此，这就需要承租人在签订《房屋租赁合同》时，对此作出明确约定，以免将来产生纠纷或者遭受财产损失。


    2、优先购买权的行使


    行使优先购买权时因区分受让人是善意的恶意。①善意，即受让人不知房屋被出租的事实，其购买并办理产权变更手续，取得房屋合法所有权。租赁合同如经过备案，承租人可依法对抗受让人，申请撤销房屋产权变更登记；如租赁合同未经过备案，承租人只能向出租人主张权利。赔偿范围是因对方违约所造成的损失，包括合同履行后可以获得的利益，但不得超过违反订立合同时预见到或者应当预见到的因违反合同可能造成的损失。因此双方在合同中确定违约赔偿标准是必要的②恶意，即受让人明知房屋被出租的事实而购买，那么承租人可依法行使撤销权。


    3、优先购买权的转让和继承


    《民通意见》第119条第1款规定：“承租人以一人名义承租私有房屋，在租赁期间，承租人死亡，该户共同居住人要求继续租赁的，应当准许”，即如果承租房是供家庭共同使用的，则承租人死亡时，承租人的家庭成员视为享有优先购买权。


    - **承租人优先购买权问题**


    1、优先购买权的法律性质


    《合同法》第230条规定：“出租人出卖房屋的，应当在出卖之前的合理期限内通知承租人，承租人享有以同等条件优先购买的权利。”承租人的优先购买权并不是具有在任何时候都享有的一种现实权利，只有当出租人出卖出租房屋时，承租人才能在同等条件下由实现优先购买权的可能性转变为现实的利利。


    4、承租人在放弃优先购买权后享有继续承租权


    按《民通意见》第119条第2款规定：“私有房屋在租赁期内，买卖关、赠或者继承发生房屋产权转移的，原租赁合同对承租人和新房主继续有效”；《合同法》第229条规定：“租赁物在租赁期间发生所有权变动的，不影响租赁合同的效力”。承租人在放弃优先购买权后享有继续承租权，即“买卖不破租赁”。


    ### 租赁房屋被拍卖、抵押、查封等相关问题


    我国《物权法》第190条规定，“订立抵押合同前抵押财产已出租的，原租赁关系不受该抵押权的影响；抵押权设立后抵押财产出租的，该租赁关系不得对抗已登记的抵押权”。也就是说，如果出租在前，抵押在后，那么出租方的权益优先保障，可以说是“抵押不破租赁”；反之，已登记的抵押在前，出租在后，根据物权优于债权的民法原则，租赁关系应予以解除。承租人只能向出租人主张赔偿。《最高人民法院关于人民法院民事执行中拍卖、变卖财产的规定》第31条第2款规定：“拍卖财产上原有的租赁权及其他用益物权，不因拍卖而消灭，但该权利继续存在于拍卖财产上，对在先的担保物权或者其他优先受偿权的实现有影响的，人民法院应当依法将其除去后进行拍卖”。


    在进行房屋租赁时，承租方一定要查验出租方财产的权属情况，如要求出租方提供产权证、使用权证等材料，并核实该财产是否存在抵押、查封等权利瑕疵，以避免不必要的经济损失。


    ### 租金支付问题


    《民法通则》第136条规定：“延付或者拒付租金的，诉讼时效期间为一年”。在房屋租赁合同中，支付租金是一个重要条款，一般双方都很重视，但提醒合同双方应注意时效问题，因租赁合同延付或者拒付租金时效为1年，争议出现后及时主张权利，避免丧失胜诉权。


    ### 转租问题


    - 1、承租人转租房屋必须经出租人同意


    《合同法》第224条规定：“承租人经出租人同意，可以将租赁物转租给第三人。承租人转租的，承租人与出租人之间的租赁合同继续有效，第三人对租赁物造成损失的，承租人应当赔偿损失。承租人未经出租人同意转租的，出租人可以解除合同”；承租人转租房屋是可以的，但事先应征得出租人的同意。因此租赁合同中双方应明确约定转租条款，出租人可对转租附加一些必要的条件，只要不违反法律、行政法规的规定即可。


    - 2、房屋租赁后次承租人享有优先购买权


    在房屋租赁合同合法有效的情况下，出租人转让房屋，承租人与次承租人同等条件下均享有优先购买权，次承租人因已经实际占有、使用房屋，因此其优先购买权优先于承租人。


    次承租人取得房屋所有权后，其取代了原合同出租人的地位，原租赁合同依然有效，承租人转租收益权依然存在。那么在合同有效期内，次承租人需向承租人支付转租收益，否则会损害承租人合同利益，不符合“买卖不破租赁”的法律宗旨。


    ## 知识产权问题


    ![](img/8bf480dc4432e799d299f98ca8474e98_32_0.png)


    ### 专利申请


    申请专利首先申请人应向国家知识产权局提交专利申请，在提交专利申请时应提交必要的申请文件，并按规定交纳相关的费用。同时专利申请可以采用书面形式或者电子形式。


    ![](img/8bf480dc4432e799d299f98ca8474e98_32_1.png)


    ### 专利局的受理


    申请人提交了专利申请后，专利局确定专利申请日，给予申请号，并发出受理通知书。


    ![](img/8bf480dc4432e799d299f98ca8474e98_32_2.png)


    ### 初步审查


    专利局受理申请后，会对专利申请进行初步审查。在初步审查合格之后，自申请日起满18个月内公布。


    初步审查的结果有：


    ①申请的专利是发明专利的，初步审查合格后，将授予专利权；初步审查不合格的，申请人应补正，如果补正合格的，将授予专利权，补正仍然不合格的，将驳回专利申请人的申请；


    ②申请的专利如果是实用新型或者外观设计专利的，初步审查合格后，将进入实质性的审查；如果初步审查不合格的，申请人应补正申请，补正合格的也将进入实质性的审查，补正仍然不合格的将驳回申请；


    ![](img/8bf480dc4432e799d299f98ca8474e98_32_3.png)


    ### 实质审查


    实用新型或者外观设计专利申请初步审查合格的或者经过补正申请合格的，专利局将专利申请启动实质性的审查。


    实质性审查主要是评价专利的新颖性、创造性、实用性等。


    如果实质性审查合格的，专利局将对申请的实用新型或者外观设计专利授予专利权；如果不合格的，申请人应相应的修改申请文件，合格的授予专利权，不合格的驳回专利申请。


    ### 授予专利权


    申请人在接到授予专利权通知书后，需要办理登记手续。申请人应当在规定的期限内缴纳专利登记费、年费和公告印刷费，同时还应当缴纳专利证书印花税。申请人在办理登记手续后，方可专利权证书。


    ![](img/8bf480dc4432e799d299f98ca8474e98_33_0.png)


    ## 知识产权问题


    ### 要点1


    - 专利法第三十三条中原说明书权利要求书记载的范围的理解


    （2013）行提字第21号行政判决书


    关键要点：


    基于先申请原则，专利申请人对发明和实用新型专利申请文件的修改不得超出原说明书和权利要求书记载的范围。为了鼓励专利申请人在申请日充分公开其发明创造，防止专利申请人将其在申请日未公开的发明创造通过修改纳入申请文件而不正当地获得先申请利益。


    ### 要点2


    - 专利法第三十三条 当事人的意见陈述的理解


    （2010）知行知第53-1号行政裁定书


    关键要点：


    当事人的意见陈述在通常情况下只能作为理解说明书以及权利要求书翻译的参考，而不是决定性依据。至于其参考价值的大小，则取决于该意见陈述的具体内容及其与说明书和权利要求书的关系。尤其需要注意的是，如果当事人意见陈述的内容超出了原说明书和权利要求书中记载的范围，则该部分内容将完全丧失参考作用，不能继续该意见陈述的相关内容对说明书或者权利要求书进行解释。


    ### 要点3


    - 专利审查、修改


    （2011）知行字第53-1号行政裁定书


    关键要点：


    专利申请人对申请文件进行修改，国家知识产权局依法行使对专利申请进行审查职权，并不负有也不可能负有保证专利授权正确无误的责任。申请人对其修改行为所造成的一切后果应自行负责。


    ### 要点4


    - 专利法第四十七条：“宣告无效的专利权视为自始即不存在”如何理解？


    （2009）民申字第1573号民事裁定书


    关键要点：


    专利复审委员会作出的效力最终确定的无效宣告请求审查决定所宣告无效的专利权；在该无效决定效力最终确定之前，不宜一律以之为依据直接驳回权利人的诉讼请求。


    ### 要点5


    - 专利法第四十七条：“宣告专利权无效的决定，对在宣告专利权无效前人民法院作出并已执行的专利侵权的判决、调解书，已经履行或者强制执行的专利侵权纠纷处理决定，以及已经履行的专利实施许可合同和专利权转让合同，不具有追溯力。”
    如何理解？


    （2012）民提字第110号民事判决书


    关键要点：


    应该考虑如下因素：一是该时间点应有对世性，应是社会公众均可公开得知并明确知晓的；二是该时间点应有确定性，应是一个确定的时点，原则上不宜随当事人的具体情况或者其他人力因素发生变动；三是该时间点应是焦躁的具有法律意义的时点，尽量增加无效宣告请求审查决定发挥追溯力的机会。


    ### 要点6


    - 计算机软件著作权在软件上具有相同缺陷的举证责任


    （2007）苏民三终字第0018号民事判决书


    关键要点：


    在被告拒绝提供被控侵权软件的源程序或者目标程序，且由于技术上的限制，无法从被控侵权产品中直接读出目标程序的情形下，如果原、被告软件在设计缺陷方面基本相同，而被告又无正当理由拒绝提供其软件源程序或者目标程序以供直接对比，则考虑到原告的客观举证难度，可以判定原、被告计算机软件构成实质性相同，由被告承担侵权责任。


