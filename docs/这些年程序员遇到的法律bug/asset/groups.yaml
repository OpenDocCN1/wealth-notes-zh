    # Lamor Dispute


    # 劳动纠纷


    程序员在公司上班的过程中，经常会与老板发生劳动方面的争议，例如：公司不缴纳社保；辞职后老板不予批准；为了在录取的时候获得优势，提供虚假学历或者谎称自己拥有某些经验。在与老板对发生纠纷后，不知道如何启动诉讼程序，不知道诉讼时效为多久等等，都会严重影响程序员合法权力。'
