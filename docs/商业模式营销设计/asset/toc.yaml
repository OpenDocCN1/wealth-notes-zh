  - 第三章 营销战术
- - '###'
  - 一、设计致胜营销的 24 招
- - '####'
  - 1、与有影响力的人合作，让产品成为影响力中心
- - '####'
  - 2、营销中加入直接反馈的概念
- - '####'
  - 3、开发多个增加盈利和提供安定因素的收入来源
- - '####'
  - 4、清楚地列出并且记录理想顾客的特征和条件，然后对照这个记录来确认可能的销售对象
- - '####'
  - 5、明确说明产品的独特优点跟竞争对手划清界线
- - '####'
  - 6、明确说明产品和服务能满足顾客哪些需求
- - '####'
  - 7、把一个和你有关的故事讲给顾客听和营销有效结合
- - '####'
  - 8、确认产品和服务所针对的特定市场对象并准确量化
- - '####'
  - 9、提供无法辩驳的理由购买你的产品或服务
- - '####'
  - 10、所有广告或者营销活动都应该是销售的一个延伸。
- - '####'
  - 11、要让别人觉得跟你做生意可以得到更多好处
- - '####'
  - 12、销售应该建立在多步骤的基础上，一步步寻找可能的顾客，一步一步地卖出东西。我们做的是 一种 多层次的沉积
- - '####'
  - 13、创建一套可以轻易复制并能够自动运作的营销系统
- - '####'
  - 14、不断寻找改造的方法
- - '####'
  - 15、营销策略的设计要使每一个组成部分都可以发挥最大的作用，行销系统做出来可以有效地协助销售系统，销售系统的收款模式必须带给会计系统最大的方便。要把系统做到最好，并且要让你的系统和其他系统有最大的包容与互动
- - '####'
  - 16、在正式推荐你的产品和服务之前，要先经过测试让你产品的风险降到最低。
- - '####'
  - 17、为顾客提供某种超水准的服务
- - '####'
  - 18、你要愿意把一些费用投资在数据软件上，用来分析和顾客相关的数据，尤其是那些真正的大顾客那些数据显示没有再回来的顾客，你要想办法和他们保持联系，让他们可以重新回到你的身边
- - '####'
  - 19、引用别人的成功概念和策略协助自己，让自己的营销策略可以获得一定程度的提升
- - '####'
  - 20、要向更多人推荐你的产品
- - '####'
  - 21、你要把投资放在能够吸取顾客终身性投资的营销活动上，而不能只带给顾客一次性营销
- - '####'
  - 22、确认并且使用更多的无形资产
- - '####'
  - 23、为自己作一个好的定位
- - '####'
  - 24、利用别家公司的投资来争取符合你理想条件的顾客
