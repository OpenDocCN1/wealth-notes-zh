    这些价值如果打包的话，是不是比花3000块钱请一个员工或投资上万元的广告还厉害，这样一个平台，一年值不值3万的价值呢？现在给予一个超级折扣，只收费1500元每年，仅限前30个名额，是不是就很容易促成成交！'
