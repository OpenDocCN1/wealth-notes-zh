- pgno: 106
  md: '# 3、导图的设计


    设计 3~5 个关键步骤或里程碑。有人说：“我有不只 5 个步骤。” 你可以有多个步骤，但是你最好选出 3~5 个。为什么？因为人类的大脑无法同时处理太多的信息。在短时间内，人的记忆容量为
    7±2，也就是在 5~9 之间波动，这是美国心理学家米勒教授提出的。如果你的步骤太多，客户根本就记不住；如果太少，比如只有两个步骤，客户又会觉得：“不可能吧，这么简单？”
    他不相信这是真的。所以，我通常设计 3~5 个核心步骤。如果你的步骤很多，你可以再组合，把 3~5 个核心步骤提炼出来。这是可以的，这样客户也容易记住。一般的信息组织都是这样的，你的导图也需要这样做（在《商业模式·顶层设计》一书有详细讲过相关内容）。我相信你一定能找到
    3~5 个核心步骤，如果找不到，你就反复问自己：“为了帮助客户达到这个状态，我必须做到哪几个关键步骤？” 每个人都有一套自己的哲学、自己的理念、自己的方法。如果没有，你就说不清楚你的产品。'
  merge: -1
  img_proc: true
