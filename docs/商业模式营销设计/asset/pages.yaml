  md: '# 第二章 营销兵法


    营（赢）在起点 先胜后战'
  merge: -1
  img_proc: true
- pgno: 20
  md: '在本章开始之前，先跟大家谈谈我国古代的兵法巅峰之作《孙子兵法》，孙子兵法中不是教人如何练枪，如何排兵，而是定义并描绘了军事理论的原则和框架，出现了一个从战略到战术的标
    准蓝本，孙子兵法所有的理论，是基于以下三个原则：


    1、 知己知彼 知彼知己，百战不殆，是《谋攻篇》中提出的重准 则。这也是孙子兵法最广为人知的一。毛爷爷当年纵观全书， 亦是对此句最为钟爱。多次引用提及。知己知彼，看似简朴，
    实则运用极其艰难。在本书中会对商业竞争当中的营销从战略 到战术层层解析，将企业领导人要考虑衡量的元素进行一一列 举，远离一刀一枪，一个决策就是千军万马。


    2、 先胜后战 先胜后战，在第三篇《军形》中提出。所有百胜之 将，无不奉守此教条。不胜便不战，战必胜。吴起、白起、戚 继光，在历史上，享有百战百胜的荣耀，他们并非神人，只是
    极其精懂此道。以白起为例，长平之后，他宁可反抗军令，也 不愿再攻赵。就是判断战无胜算，不如不战。而战斗本是热血 之事，大有刚勇血性之将，不论敌我，先战再说。恰巧胜利，
    愈加寡谋；倘若不利，便满脑子以少胜多、背水一战，如此将 领，有勇无谋，在历史上数不胜数。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '3、致人而不致于人 在古代帝王中，唐太宗的军事天赋，当属超一流。在他和军事奇才李靖的兵法答对中，提到：朕观诸兵书无出孙武，孙武十三篇无出虚实。李靖亦是深表同意，说道：千章万句，不出乎“致人而不致于人”而已。致人不至于人，强调的是掌握战争主动权。攻，能调动敌人不能防守；守，能牵掣敌人无处可攻。敌军士气高昂；能避其锐，攻其惰；敌众多，能分之而灭。战术万千，不一而足。


    孙子无法穷尽，但一句致人而不致于人，却高屋建瓴讲透了精妙。基本要素：五事七计 五事七计，出于孙子开篇《计篇》，讲的是战前的庙算，考量五事七计，能胜则战，无胜算则不战。这也是百胜之将超越一流名将之处。


    庙算定胜负，究竟算什么呢？孙子兵法开篇就提到了战争五要素：道、天、地、将、法。道，天道人心。得道多助，失道寡助（在我们的课程中曾多次提到：得人心者得天下，正是本意）。敌方是否失去人心，我军是否师出有名（营销设计中须先行设计你的品牌关键词以及企业文化）。天，天时，考虑作战天气和季节，如风向，雨天等（进入趋势行业）；地，地利，考虑作战地形（精准地理定位）。地形的重要性要远高于天时，《九变篇》、《地形篇》、《九地篇》，都是讲述利用地形作战的原则技巧。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '将，将领，千军易得一将难求。兵可练，可招募，但一流将帅，都是世出，无法被培养（人是环境的产物）。法，法度，严苛的军法，是将领带兵必守之道；军法以严，不尚宽容。带领百十人，能考魅力靠威信，但带领百万之众，治众如治寡，靠的就是军法（制定企业的标准化流程及企业管理制度）。


    五要素中，没有提到兵，但孙子在七计中提到了。七计，就是<|message|>算要考虑的七个问题。主上是否得道得人心，天时地利是否合宜，将领是否​​有能力，士卒是否强盛，是否精炼，军法是否实行，赏罚是否有度。'
  merge: -1
