  img_proc: true
- pgno: 67
  md: '加关心顾客以及公司的行为，给大环境带来的影响，比如说联合利华的 CEO，保罗博尔曼，他就认为公司的目标啊，不全是为了盈利，为了提高股票的价格，他觉得，自己是在为客户服务，不光是公司领导现在开始追求深层的价值了，就连客户现在也更加看重产品的意义和真实性了，我们看到了今天，越来越多的人啊，不再去追求大规模生产，又可以批量复制的产品了，现在叫私人定制、叫个性化，现在的时代，个性化，和具有实在价值的东西，都能成为市场的宠儿。比如说，消费者会更加喜欢用那种真花瓣制作的手工皂，而不是到处都能买到随处可见的人工添加的香氛皂，说到这里，你可能明白这超级品牌是怎么回事儿了吧，接下来重点来了，咱们该如何打造超级品牌呢？接下来我们开始讲到几个秘诀。


    # 你的营销策略和多少人有关，就会有多少人来帮你实现他。'
