- pgno: 226
  md: '如果你开了一家烤鱼店，用市场售价 88 元的烤活鱼对接理发店引流，理发店便可以用以下方式做情感维护。


    理发师可以对自己的顾客说：“上次我们店里聚餐，老板带我们吃了烤活鱼，味道非常好，所以他特意团购了一批 88 元每张的烤活鱼卡回来，发给我们每人五张，要求我们送给自己最喜欢的客户，今天我已经送出去
    3 张了，现在还剩两张，送您一张，以表示您一直以来对我们店的支持，现在您持这个卡就可以去卡片上的烤活鱼店免费享受一条 88 元的烤活鱼了，您一定要笑纳我们的这份心意哦！”


    假如你是理发店的客户，在理发的时候，理发师对你说了这些话，还送你一条烤活鱼，你的心情会是怎样的呢？是不是瞬间对这家店产生了强烈的好感。


    还有一种情况，鱼塘需要回馈的老客户数量比较多，比如，银行、物业、单位组织等，全部一对一的沟通，会耽误很多时间，遇到这种情况，一般采用感谢信的形式做回馈，然后把引流卡放置于感谢信当中。


    当然，在对接鱼塘的时候你需要帮塘主写好感谢信，让他只'
