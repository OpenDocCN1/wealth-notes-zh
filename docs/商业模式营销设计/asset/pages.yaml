- pgno: 12
  md: '上的企业，没有一家不是以诚信经营为本，全球最大的电脑制造商 IBM 公司，国内老牌药企北京同仁堂等等这些大企业，都是诚信经营的典范。我们一定要谨记：没有百年的产品，只有百年的品牌。


    陶朱公范蠡，中国商道的祖师爷，典型的慧智共运型商人。他无论是在政治上还是在商业上，他都是成功的，真正做到功成身退，急流勇退。据说他发明了十六两制的称。这里面含有道德的内涵，这个设计象天法地，采用南斗六星的主生和北斗七星的主死，来作为秤杆的标记。一颗星就是一两重，十三颗星就是一斤，这就是最早的统一计量工具一称。他还前瞻性观察到，追逐于利者常为利而亡，逐利很容易败坏经商者的道德品质和摧毁经商者的道德品格。为了避免德性较差的商人缺斤少两，丧失自己的道德品质和品格，范蠡在南斗六星和北斗七星之外，还加上福禄寿三星，以十六两为一斤，并且告诫商人，缺一两的时候，就折福；如果缺二两，就折禄；缺三两，就折寿。将每个人自身的福禄寿和家庭的福禄寿，直接与这个称量是否公平捆绑在一起。这在我们目前整个社会道德水平下滑之时，多看看古代具有道德慧智之人的做法，无不是一个警醒。司马迁在《史记》里就有一句名言：“天下熙熙，皆为利来；天下攘攘，皆为利往。”这段话高度概括了商业活动对人心的腐蚀。在没有道德驾驭心灵的时'
  merge: -1
