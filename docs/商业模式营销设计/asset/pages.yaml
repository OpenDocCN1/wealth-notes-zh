- pgno: 56
  md: '# 三、营销就是塑造客户心中的梦中情人


    # 1、我们卖的是欲望而非产品


    营销是一种营造并销售人性欲望的科学，

    什么叫人性的欲望?那就是，那就是等咱有了钱：


    +   *戴劳力士表，满足的是面子的欲望；

    *开法拉利，满足的咱有钱的欲望；

    *到美国买食品，满足的是安全的欲望；

    *到远郊买别墅，满足的是给别人讲故事的欲望；


    产品是为特定欲望服务的；

    满足了欲望的产品才好卖；

    欲望越虚，价格往往越贵；


    ![](img/a2a85069a929343f7800dedd7a9d5065_56_0.png)


    欲望的现实动作——愿你的梦中出现我；

    欲望运作公式——等我有钱了，我就（对什么想入非非）；

    需求运作公式——等我们有钱了，我们就（直奔想入非非）；


    欲望无限，所以产品创新也就无限，营销思维

    无限！'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 2、顾客需要、欲望及需求的商业价值应用


    顾客需求——当有购买力做后盾时，欲望就变成了需求：


    如：满汉全席，蛋炒饭


    顾客欲望——指顾客需经由文化和个性塑造后采取的形式：


    如：顾客饿了，有吃的需要，就形成以下形式：


    +   1、满汉全席；2、蛋炒饭；3、面包。


    顾客需要——是指顾客感受到匮乏的状态：


    +   1. 对事物、衣物及房屋等物质生理需要；

    2. 对安全的心理或物质需要

    3. 对亲密忠诚和慈爱仁义的社会需要

    4. 对知识和自我表达的个人（自尊或自我实现）


    需要本身，并非是企业创造出来的，而是人类自身本能意识的基本组成。


    ![](img/a2a85069a929343f7800dedd7a9d5065_57_0.png)'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 3、经典营销法则


    市场营销不是产品之间的竞争，而是思维模式之间的竞争，把观念直接输入顾客大脑，产品就能做到不卖而卖。


    在市场营销的世界里，不存在事实，不存在最好的产品，只有存在于用户头脑之中的观念。那么，我们要做的是找到你的品牌关键字，并给出相关的标准。


    如：国酒—茅台 去屑—海飞丝 宝马—驾驶的乐趣


    +   ※ 你对美女的标准是什么？

    ※ 我去对手机的标准是什么？

    ※ 可口可乐和百事可乐到底哪个好？


    ![](img/a2a85069a929343f7800dedd7a9d5065_58_0.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 4、营销三部曲


    # 1）、找标准


    营造一种价值观——好的标准(方向)


    如：美国轿车与日本轿车为何有不同的品质方向？


    理念：营销之争首先是标准之争(为谁服务?)需要精准定位你的消费群体。


    # 2）、营造一种梦想


    卖结果(房地产广告)


    宝马车为何成了无数人的梦中情人？


    为何无数的女士疯狂的追求减肥？


    # 3）、营造一故事——让顾客乐意接受


    百事可乐演绎什么样的故事打动消费者？


    接下来，我们一起来学习当今商业上的超级品牌是如何进行品牌营销的，他们又有什么独到之处呢？'
