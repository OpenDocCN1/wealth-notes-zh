  md: '的总裁和明星设计师联手创造了公司的辉煌，还有个经典的案例就是我们改变世界商学院，一诺老师负责掌舵，无为老师和唯心老师还有其他的老师们来共同执行和落地。充分发挥团队的力量！


    # 我们要言行一致，说我所做，做我所说！'
