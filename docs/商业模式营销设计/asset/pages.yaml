- pgno: 25
  md: '某大型购物连锁发现，孕妇通常会花很多的时间购物，再加上孕期容易情绪化，所以她们在这个阶段会更容易受到潜意识的影响。利用这点，这个购物中心开始有意识的增加一些特殊的声音和气味。比如在服装区的角落里喷洒强生的爽身粉，在食品饮料区，喷洒樱桃气味，在商场里面播放孕妇儿童时代的流行乐，结果呢，一年之后购物中心收到了许多妈妈的信息反馈，她们说啊，这家购物中心对他们刚出生的宝宝有一种神奇的安抚效果，就算是孩子本来又哭又闹，只要一进购物中心的门儿，就马上能够安静下来，从这个案例大家应该会发现，我们的购物习惯从小就会养成，那么精明的商家当然不会放过这个机会了，他们会放长线钓大鱼，从娃娃抓起，塑造孩子对品牌的偏好。


    国外某知名化妆品公司，专门做年轻人的流行彩妆，他们会在小区里边打广告，对关只有七岁的小女孩宣传，大家可能会觉得，这公司傻了吧。这群孩子，一不化妆，二又没钱，根本就不是他们的目标用户，打广告只是白费力气罢了，但真的是这样吗？他们啊，其实是培养潜在用户，公司知道，如果能早早的吸引孩子们的注意力，就意味着将来可能收获一大批衷实的消费者，在比如：吉列公司的研究发现，一个男孩，只要用过两次吉列剃须刀，那么他成年之后啊，继续'
