- pgno: 44
  md: '# 2、怀旧营销正在崛起


    在微博上有各种话题，比如：失眠、吸猫、喜欢乡村生活等。每一个小小的爱好，都能在互联网找到“知己”。这是不是说明互联网与消费者的现实生活已经高度重合？这种高重合度基于兴趣，会将市场渐渐细分，有了更大的市场呢？细分市场太多了，我们该怎样抓住消费者的共同属性？


    可以说是，过去的“大市场”现在被细分成了密密麻麻的“小市场”，我们要想再次抓住消费者的共同属性，更好的办法是追本溯源，寻找这些“小市场”的消费者们过去都有相似的经历。那么，市场细分和差异化到底有什么分别呢？市场细分与差异化都是基于消费者的不同需求。我们来举一个例子：


    这两年手机的竞争非常激烈，OPPO 主打拍照，小米主打性能，华为主打颜值…（我们先不要纠结华为是不是主打颜值）


    那么问题来了，对于他们来说，无论是主打拍照、性能、造型，这是市场细分还是差异化？你可能会说，这很'
  merge: -1
  img_proc: true
- pgno: 45
  md: '明显是差异化嘛！这些都只是手机的次级需求，手机的功能主要还是通信啊！没错，你想的没错，确实是差异化！那么，我再举一个例子：


    手机的拍照和单反相机的拍照是差异化还是市场细分啊？你可能会回答这当然是市场细分啊，这两者的受众需求不同啊，不同的需求当然是市场细分啊！这还用想吗？！！但为什么人们对手机拍照、性能、颜值的不同需求是差异化，而手机和单反相机也是不同的需求确实市场细分呢？同样都是不同的需求，为什么一个是市场细分，一个却是差异化呢？其实原因很简单，那就是人们虽然有不同的需求，但有强需求和弱需求！


    对于手机而言，无论是拍照，性能，还是颜值，都是弱需求！什么是强需求？——当然是通信啦！所以说，拍照、性能等都是产品的差异化策略，是产品的亮点！但是如果你对手机拍照的需求逐渐升级、加强，成为你的强需求的时候，也就是说你的弱需求转化为强需求的时候，手机的拍照已经满足不了你了，你就要寻找能满足你的需求产品——单反相机！因此，单反相机就是市场的细分！'
  merge: -1
  img_proc: true
