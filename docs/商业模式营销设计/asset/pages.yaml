- pgno: 47
  md: '# 3、怀旧长什么样子


    # 过去的，总是很美好的


    一项针对80后的调查也显示，43.7%的人表示自己有时怀旧，37.5%的人经常怀旧，从不怀旧的人只有1.5%。怀旧的内容有2种类型。这两种类型的故事主角都是自己，但Wildschut等人（2006）发现，大多数人怀旧内容更类似于以下第1种，也就是说，比起单独回忆起过去某一个时间段的自己，我们更倾向于怀念自己与重要Ta人的互动，彼此共同经历的那些有纪念意义的时刻等等。


    第1种：“那时候的我，还是一个少女，在他面前我毫不搓饰。我在马路上大声呼喊‘我喜欢你’，看着他在人群中羞怯的窘态，我内心竟有一种得逞了的狂喜！


    第2种：“那时候的我，还是一个少女，我总喜欢花花洋装和妈妈梳妆台上那支色彩最鲜艳的唇膏，喜欢在校园里的马路中央，小跳奔跑，高声歌唱。”'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 怀旧的重要作用有 3 种：


    +   1. 补偿性作用。

    当现在的生活让我们感到恐惧、不满、焦虑和不确定时，我们会希望回到那个（至少在现在看来是）确定而美好的过去。研究者认为，这是由于怀旧有一些补偿性的作用，能够使我们平静和镇定下来。


    2. 获得积极的自我认知。

    人们不断地通过怀旧，与过去的、年轻的自己建立情感上的联结，能够帮助我们持续地对自我进行肯定，从而逐渐形成一个积极的自我认知。


    3. 对抗“存在无意义”的消极情绪。

    Routledge 等人（2008）的研究发现，怀旧能够帮助人们感受到更多生命的意义，更少产生与“存在无意义”有关的想法。因此，对于对生活感到绝望或身患重病的人而言，怀旧能够使他们重新振作起来！（所以，为啥那些跳楼的人，在下落的瞬间回忆起过去，就不想死了）'
  merge: -1
  img_proc: true
- pgno: 49
  md: '根据 2016 年的最新研究表明，以往指的怀旧都是怀旧过去，而还有一种怀旧是怀旧现在，指人们在当下过去之前，就开始怀念，这被称之为“可预期的怀旧”。


    当一个人认为自己总有一天会失去当下的美好，就会产生一种提前到来的怀旧感，于是陷入了可预期的怀旧中。前段时间流行的“丧文化”， 一部分 90 后不要思考，不要目的，不要复杂的人际，不要清晰意识，不要约束，躬躬而行。


    从内心深处来说，他们或许预料到了糊口养家，老病死终会到来，不如现在好好地快活~ 这种行为就属于可预期的怀旧。'
  merge: -1
