  md: '为了让业务员有积极性，通过他的单页过来的客户，今后购买了电动车，可以再得到200—300元的提成，我相信会有很多人愿意干这个事情的！


    相信此刻你也跟电动车店的老板一样感叹，原来生意还可以这样做呀！对的，这就是商业模式顶层设计的做法，要不然电动车店怎么可能实现自动化的客流导入呢？'
