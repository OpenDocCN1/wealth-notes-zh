    如果你要让别人传递、传播一个东西，那么这个东西一定要简练。如：“打土豪分田地”、“星星之火，可以燎原”等，这些都是非常简单的语言。你不能搞得大复杂，否则别人是不会传播的。如果你到百度上去查，你会发现很多人的博客、网站的标题就用到一些简单而易记又让人印象深刻的词句。只要是大家喜欢概念，都会主动的传播它。判断一个东西有没有传播价值是很简单的，你只需要在搜索引擎中查这个词的搜索量就知道了。我们创造了很多东西，比如“商业模式”、“顶层设计”、“改变世界商学院”、等，这些词都有上万的搜索量。包括搜索一诺老师的，在百度上也有几'
