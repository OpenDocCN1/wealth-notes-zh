  md: '回忆往事，所以“怀旧”二字是带有情感的。文字是非常有意思的，不同的文字会让人产生不同的联想。文字代表什么呢？文字就是一种符号。当我们感受某种情景之后，我们会用某些文字或单词来命名它。比如“震撼”二字，你必须感受到震撼，才知道什么叫“震撼”。


