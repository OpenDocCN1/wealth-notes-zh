- pgno: 122
  md: '# 一、成功营销的标准


    一个伟大的商人不是天生的，他们是培养出来的。


    营销是一门科学而非艺术：它有一些基本的要素，有一些可预测的事情，有一些基本的规律可以加以运用。世界是以一定的事实为基础的，所以你不一定需要有很好的天赋，才能成为很好的商人，没有这样的天才。但是成功有不同的方式，这就需要来学习。


    # 1、发现隐藏的资产


    你的客户可能会买你很多的其它产品和服务，但是你从来没有想过在他们买过之后，再介绍其它产品。如果你意识到这一点，意识到客户的存在，能够向他销售不同产品、不同服务的话，你就能够很快的获得很多意外的收益。这样你是在用一种有系统的思维方式，来增加收益，那为什么不考虑更多的做法呢？'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 2、被忽略的机会


    本书后面章节和我的正式课中会详细讲到会谈合作这个观念。怎么和其他企业来进行合作，实现一种交叉销售，通过合作获取一个你从来没有涉及的市场，进入一个新市场。这些机会都是存在的，但是你忽略了这些机会，在后面会讲一些案例来说明。


    # 3、成效欠佳的工作


    这一点非常重要，你不管是谁，每天你都会做各种各样的业务活动，可能投放广告、有人给你打电话、或者在销售点上和客户打交道、或者有推荐的客户来找你，每次发生这样的事情时候呢，有更多的机会会使你的工作绩效更好。但是你往往没有意识到这一点，因为你没有衡量过到底能达到怎么样的绩效、怎么样的成果。所以你很难去判断，在未来怎么样去提高这种绩效。我们看一下他们做的各种各样的活动，他们目前活动的绩效，以及他们怎么样来开展这些工作，对这些现象要了解，怎么样可以改善？所以必须要知道你在这上面花的时间，制定好相应的标准，这些事情怎么样来做的更好。如果你不知道现在做的怎么样，怎么能够提效益呢？'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 4、被低估的关系


    包括你的客户，你和客户之间的关系，可能你的某些客户在他的行业里面有一定的影响力，那你怎么样来利用他的影响力？如果你利用好的话，你有可能会获得成百上千或更多的客户，使得你能够投放更好的媒体；或者说能够利用这些关系让他们写一些证词，你不需要支付任何的费用，使得你在与竞争对手竞争当中拥有足够有力的地位。所以各种各样的关系，你要去利用它。


    还有你与供应商的关系，这些供应商可能会借助某些投资来帮助你进入新的市场，或者帮助你建立新的销售体系，因为他们的思路和你的目标是一样，因为他们希望你成功，这样才能给他们带来更多的业务。因为我相信没有一刀切的模式，我相信有不同的方式、不同的模式。所以说你可以选用不同的方式来用于不同的客户，这个不需要投入大量的成本。但是我想最初的一点你必须开始思考这方面的问题。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 5、被充分利用的销售渠道


    通过终端零售渠道，充分利用跟终端零售的关系，然后来改变业务模式，一定要意识到你有怎样的分销渠道，哪些渠道你没有充分利用的，同学⼉可以作好相关的记录并进行梳理、排列后重新制定你的渠道战略。


    # 6、没有充分利用的销售系统


    销售有很多种非常有效的方法，几乎没有一个中小企业能够把这些销售工具用足用全的。


    举个例子，不知你的企业做过顾问式销售没有？我知道有很多⼈他们都纳闷的就是这个销售系统的方法，但我建议应该去学习一下咨询顾问式的销售培训课程（推荐参加改变世界商学院唯心老师的课程学习，或者购买唯心老师书籍《成交心法》中有详细的介绍），你应该跟你的客户或者合作伙伴，来尝试一下这种顾问式的销售。我们看一下，所谓咨询顾问式的销售说到底就是说你要动员你的客户，让他知道你是一个最守信用的一個咨询顾问，你是为他排忧解难的，而不只是简单的卖他一个产品和服务。如果你和你的团队去接'
  merge: -1
  img_proc: true
- pgno: 126
  md: '受这个顾问式的销售培训的话，那么你的销售业绩马上就会提高 10%到 500%，而且业绩以后会保留更高的水平。所以记住你一定要去参加咨询顾问式销售的培训，还有很多其他的销售工具方法，那么我们可以看到几乎没有一个人去使用所有的方法，那就是说你有很多空间可以提高。同时我激动的是你的竞争对手几乎也不会全部知道这些销售方法。


    # 7、鲜为人知的营销方法


    市场营销的方法大概有一百种，你是不是用了其中的五十种呢？不是的！但是如果说你现在一种都不用，或者只用了两三种的话，那难道你没有意识到我们现在要学的东西有很多？学完之后，你的经营情况将会有多大的提高空间？


    在这里我告诉大家的是耳熟皆准的、通用的一些方法。这些方法实际上在世界各地都被运用过，而且有很多人用这种方法获得成功。但同时，我讲的所有这些方法，你必须根据你的行业、公司具体的情况来进行调整和采纳，因为没有哪两个行业是一样的。比如说我会给大家举不同的例子，你头脑当即也会有不同的观点等等。那当你在自己公司中使用的时候，你要记住不能简单的抄袭，你要做调整分类使用。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '我们来看一下，如果你不知道你现在身处何境，也就是说你不知道自己做的怎么样，那你就不知道怎么样来提高，何去何从！我讲的不仅仅是你的经营收入，而是你对于你衡量做事的方法有哪些？这对每个公司也会不一样。


    比如你要卖掉一个产品或服务，有多少潜在客户呢？你去搞定一个客户需要多长时间呢？有多少客户买你这个产品，也会买你其他的产品和服务呢？然后你又要花多长的时间，所谓的交叉销售，把这个客户介绍给其他部门，让他们买你公司的其他产品和服务呢？这个客户一般跟你做生意需要多长时间呢？还有你要找到一个潜在客户，你要发现这个线索，那么成本是多少呢？


    整个销售过程从头到尾达成这个销售成本又是多少呢？不管是时间还是金钱。还有你的竞争对手在缔结业务的成本比你高还是低？你到底要做到怎样一个目标？你觉得你整个系统怎么样去改变才能更快、更好的去达成你的目标？我们举个例子，假如你有一个公司，下面有
    1000 个客户，每个人他们每次买你的东西花 200 块人民币，然后每年是两次，那一年就是 400 块人民币，这是你的销售收入，对吧？实际上我们可以算的很清楚，但在运作当中并不是这样，大部分人'
