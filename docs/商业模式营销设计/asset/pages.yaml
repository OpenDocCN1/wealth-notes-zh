  md: '客承诺：“你使用我的东西如果无效的话，我可以按原价退款。”当一个人得到这样的保障。就算是他后来真的因质量问题来退款也不会有太多的抱怨。而且这种情况通常会为你增加更多的销售量。为什么？因为人家看到的是你的信心、你的保证。信心就是能有这么大的能量。对自己的产品有信心，这是很重要的。


