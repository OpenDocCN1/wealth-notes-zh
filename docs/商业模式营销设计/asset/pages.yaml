  md: '# 2、成瘾营销


    既然戒不掉，那就接着买啊！

    我想问问各位同学，你能做到多久不看手机呢？一整天不看手机，不看微信，不刷朋友圈，能不能做到？最多能做到8个小时不看手机，那就是睡着了的时候。。。


    具一项研究发现，现在的年轻人，有超过40%会对智能手机上瘾！还有30%正走在上瘾的路上。再比如说，大家平时对网购的频率有多高呢？是不是没事的时候就想看看，某宝、某东是不是有打折，有没有送券、有没有团购之类的？你们小区的小快递小哥是不是跟你都特熟了呢？实际上啊，产品成瘾的现象，在现代社会中是非常常见的。这又是怎么搞的呢？其实啊，这跟烟瘾、酒瘾、毒瘾都一样，都是通过大脑分泌的多巴胺在起作用，在网购的时候挑东西加入购物车付款，这一系列的动作会刺激大脑分泌大量多巴胺，随之而来的就是愉悦和兴奋，但问题是什么？这个多巴胺他来的快去得也快，疯狂购物之后呢，多巴胺水平很快就会回归到正常水平，情绪也会随之变得低落，自然而然的我们会怀念之前兴奋的感觉很简单，想要再次享受这种美好的体验。那怎么办呢？当然就是接着买了，不过在这个过程中呢，大脑对多巴胺的'
