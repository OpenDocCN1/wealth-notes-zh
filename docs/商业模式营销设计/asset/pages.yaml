- pgno: 77
  md: '# 6、需要用符合期望值的产品维持声誉


    好了，现在有了引人入胜的品牌故事了，那新顾客是兴趣满满的想要了解你的公司以及你的产品，怎么样才能保证他们看完之后真的会消费呢？我们要记住最重要的一点，超级品牌，你首先要能提供超级产品，也就是说啊，你故事讲得再好听没用，吹牛逼的。产品拿得出手那才行，产品得要货真价实，要不然你光说空话，你拿出来的产品一碰就碎，那不就成了自食其言了！


    假如说你先给品牌设立了神话般的光环，但是最后产品没能达到，或者没能超过顾客的预期，那么这永远也成不了超级品牌的，这一点我们必须要牢记啊，一诺老师的课程中有说过，一个
    100 分的商业模式+0 分的产品=0，我们做事一定要以终为始，不忘初心啊，不要搞了一大堆的各种设计、营销、到最后产品本身出了问题那就是个大乌龙！超级名牌也不是光靠广告吹出来，所以我们要用符合客户期望值的产品来维持良好的品牌声誉。


    我们看格力空调，他们的品牌形象就是突出空调的性能的（好空调格力造，那如果产品都有问题不是打自己的嘴巴'
  merge: -1
  img_proc: true
- pgno: 78
  md: '吗？相信董小姐不会干这种事情啊！），所以人家没吹牛逼啊，反过来如果公司的产品货不对版，那品牌故事吹得天花乱缀的，结果产品达不到客户的要求，产品太水了，这种落差会让人一下子就失去了兴趣，这公司就会损失大批大批的潜在消费者，相信这个各位都能理解，不过呢，光靠着高质量的产品可能只是刚好能达到客户的要求，毕竟你之前也是这么说的啊，符合我的标准，那想要保证超出预期，那得怎么办呢？我们就得知道怎么用吸引人的方式去展示产品，怎么做呢？可以把产品打造成行业的权威，就是说要让消费者觉得我们家的东西比别家的更高大上。这就超出预期了。


    比如说：雀巢旗下有一个公司是专门生产一种特殊的咖啡胶囊，和配套的咖啡机的，在他们的专卖店里啊，咖啡机是被放在展台上的，灯光一打，特别有质感，就看起来像什么呢？把它弄得特别像是珍贵的艺术品，让人看了忍不住想买，高端啊，除了这个之外，还有一
    #+# 策略，就是为产品打造一个仪式，这个又怎么理解呢？我们说个案例：雅诗兰黛旗下有一款叫海蓝之谜的面霜，这个面霜在用之前一定要先把它放在手上，把适量的面霜给暖热了，等他变成透明的之后，再涂抹到脸上，他们公司的网站上还有相关的视频，教大家怎么用才能增强效果，这其实就是打造出了一个仪式，'
  merge: -1
