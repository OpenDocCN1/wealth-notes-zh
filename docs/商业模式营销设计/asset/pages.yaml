- pgno: 73
  md: '# 5、需要深入人心的品牌故事


    这就得要从人类围在篝火旁边讲神话故事，神话传说开始，讲故事就成了社交里头不可或缺的一部分，看过人类简史那本书的同学们应该知道，我们人类并不是地球上最强大的生物，但是为什么如今人类统治了地球？是的，就是因为人类创造了语言，学会了讲故事的能力！人们通过使用语言和讲故事组成了社会，有了国家，有了民族，有了宗教和信仰，有了道德和知识。我们掌握的一切技能都是听来的，比如成语故事，历史故事之类就像小时候你的父母告诉你：这个不能做，那个不能吃等等。。。！所以说，我们不是活在真相里，而是活在印象里。


    在商业领域里，讲故事同样有着强大的力量。我们千万不要小看了讲故事的能力，更应该去学习如何讲好故事，在一诺老师的校长秘训班上，就有详细的步骤，一步步教你如何去讲故事，如何通过讲故事来提高营销的能力，以及让你的产品深入人心！如果说，你能够抓住人们对故事的热爱，再加上对意义的追求，那就有提升品牌声誉的强大武器。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '给大家举个例子：有一家生产纸质记事本的公司，他们就创造了一个很好的故事，在数字时代的压力下，这个品牌呢，提醒人们不要忘记手写笔记的传统，在宣传的时候，公司还搬出了一些伟大的作家，比如说海明威，说这些大作家经常把自己的想法都记录在随身携带的笔记本上，人家那都是这么做的（这是一诺老师课程里说的傍名人啊），这么一说是不是就等于告诉消费者，如果你选择我们品牌的笔记本，那就是在追随文学巨星的脚步呢，他们说得没有那么直接，但是潜意识当中，会给人这方面的想法。除了历史人物之外，我们的品牌呢，还可以讲讲神话故事、我们发现在今天，宗教对社会的影响越来越弱了，我们企业呢，可以趁机填补这方面的空白，打自己的品牌历史可以打造成神话故事，把他描述成时代的英雄（可参考商学院福州分校陈校长的“闽王贡”老枞茶的品牌故事）。


    而这个打造品牌故事，不一定要全靠公司的努力，事实上消费者其实是很愿意效劳的，他们的联想能力就是你能利用的最好的工具，公司要做的，就是提供一些好的素材（我们类似以常在微信朋友圈内看到有奖征集广告方案，或者是有奖征集广告语等等）。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '首先，我们可以打造一个消费者容易认同的角色，这些角色往往基于典型的人物，讲什么英雄或反派也行，一旦设定的人物，就可以围绕着他如何克服挑战来展开故事情节，这当中，就可以和您的品牌相结合。


    再说一个案例，时尚奢侈品牌香奈儿，他讲的故事就是品牌创始人加布里埃香奈儿的人生故事，这个香奈儿的母亲呢，是一个洗衣工人，未婚先孕，她的母亲早逝之后，香奈儿在修女院里长大，克服了种种困难，不断挖掘自己的设计天赋，最终成为了
    20 世纪最著名的时尚偶像之一，还有德芙巧克力的故事，王兰油的品牌故事，LV 的品牌故事等等，他们有一个共同点，那就是给自己的品牌创造了一个深入人心的凄美型的爱情故事。包括马云的阿里，刘强东的京东，小米的雷军，联想柳传志。大家可以上网查阅品牌相关故事作为参考。


    如此，我们脑海当中就会浮现出品牌故事中所描绘的主要元素和这种场景，我们会觉得有种认同感，带着这种感觉你再去看产品，会不会觉得这个产品你更加的熟悉他了呢？更加认可他了呢？慢慢的，大家就会把这个品牌和臻舞人心'
  merge: -1
  img_proc: true
- pgno: 76
  md: '的成功故事联系起来，这就是你品牌的内涵和意义（更详细的品牌故事策划以及编写的技巧和步骤，可以参加无为老师正式课程学习）。


    我们总结一下：故事，赋予品牌以灵魂！喜欢听故事，是人类的天性，你的产品有一旦有了故事，就可以活过来了。


    故事，能够赋予产品以灵魂！'
