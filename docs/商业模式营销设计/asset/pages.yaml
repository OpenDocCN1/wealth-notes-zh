- pgno: 132
  md: '# 4、你要来增加新的产品和新的服务


    你可以提供更昂贵的产品。或者提供一些相对来说比较便宜的产品，这样的话，降低客户来买你这个产品的门槛，首先建立这种客户之间的关系，慢慢把这种关系发展下去。还有在现有的正常的产品和服务基础之上，提供一些新的附加的产品和服务。当然在这里讲新产品的时候，未必完全是你自己研发的产品，你也可以去找现成的别人的产品，只要你获得这个使用权你就可以去卖。总之，如果你能够找到卖给现有客户更多的产品和服务，你就可以大大提高你的利润。


    # 5、要从竞争中获益


    第一个方法：比如有人推荐给竞争对手客户，这个客户最后并没有选择这个竞争对手，那么你就可以把这些客户呢吸引过来。


    第二种方法：你的竞争对手有可能只是能够满足这个客户所需要的一部分产品和服务，那么这个时候你就可以跟你的竞争对手讲：我跟你没有直接竞争的关系，因为你的产品跟我们是不一样的，而我们的产品你的客户也是需要的，我们就通过你来进行销售。


    第三个方法：如果说你找到一个比较弱的竞争对手，这个竞争对手和他的客户关系是很不错的，他的信誉也不'
  merge: -1
  img_proc: true
- pgno: 133
  md: 错，而他们的业务比较弱。那么这时候我们怎么做呢？你就直接去争取他的客户。我们可以去找那个公司的业主跟他讲：你们公司的业务一直不佳，很多设备、资产都闲置没有很好的利用，如果你可以把你的客户名单、资源交给我们的话，我们可以更好的运作。那你可以成为我们的股东，让我们权衡利弊、扬长避短，把我们两家公司的优势结合起来，短处规避掉，这样可以获得更大的利益，那么你也可以从中获得好处，你想如果你这样继续做下去的话，也不会有什么收益，大家都可以看到这一点。所以，你还不如把你的客户交给我们，我们可以好好的照料他们，那么你也可以从中获利，我们是不是应该好好来计划一下。其实我们可以看到，不像以前有人说，你看到一个竞争对手难以为继的时候，你就会上去一下把它踩死，这样来说我们就不会那么野蛮了，甚至来说是比较文明的，我们去找快要破产的那家公司的业主，讲清楚你是希望怎么样跟他合作，这也是一种方法。
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 6、收回以前的支出


    我想对于大部分人来说，这一招会刺激很多人的猜测，未必来说是完全成功的。比如说你这个产品不是销售全球，甚至不是全国，只是在本地市场销售，你在当地卖得不错。如果你自己要走向全国市场比较困难的话，你就来看一下其它城市的一些公司，你可以把你的方法推荐给他们，然后让他们来用你的营销方法，你收取一定的佣金或分成。举个例子，如果有一家公司比他的对手获利能力超过51%以上，肯定他在某些方面做的与众不同，有比竞争对手更强的地方。可能是囤货管理、物流管理呀、或者是市场营销呀等等，任何一种其它的技能。你就要想方设法把这个技能卖出去，通过技术许可，或者说技能培训等方式。关键就是，有很多的办法来帮助你把你过去的支出收回来，也就是把你的技能传播出去。


    # 7、就是注重战略还是战术


    一个伟大的战略家也不是天生的，也是需要培养的。你这种战略性的思考，也是通过长期的实践和培训而形成的。像这种市场营销、战略这些东西都是科学而不是艺术，也就是说这些都可以传授和学会的。对于大部分企业来说，他们都是一些战术性的商人，他们只看到眼前的利益。但对于顶'
  merge: -1
  img_proc: true
- pgno: 135
  md: '尖的公司往往都是用战略性思考的，他们有长期的、不断增长的一个计划，他们的销售和市场营销的活动都是经过专门设计的，他们能够不断的吸引人，使得他们的产品业务不断的发展，使得客户不断的跟着他们的发展去买更多、更新、更好的产品，并且把他们的产品不断的推进。所以说战略是什么？他并不是简单的眼前做的事情，它是从长远的角度来思考，做所有的事情都是为了长远的目标。对于我们很多的成功创业者来说，他们成功的关键就是把自己对既定长期目标的高度热情与他们的同事、员工一起来分享，让团队共同认识到未来的目标是美好的，值得去实现的，而且利用计划去实现企业的长远目标。战术就是去配合战略去做的一些做法。所以说战略是目标，战术是实现目标当中一些小的具体的事情。很多小的企业或企业家们往往都是战术性的，可能这个地方亏损了，他们就不愿再做下去。但是我要大家记住必须有这种能力不要关注每天日常过于小的事情，不要让自己工作的时间越来越累，要更多的从战略的这个角度去思考你的业务发展，如果你能够做到这一点的话，你就得到了我的精髓，能够使你的业务不断的发展。


    所以说首先你要改变你的思维方式。如果你不知道你的目标，你要什么样的结果，那就不可能在你的具体工作当中去寻'
  merge: -1
  img_proc: true
- pgno: 136
  md: '找最佳的方法。战术就是你要到哪里找到你的准客户。很多情况下战略是一个长期的方向，是连续不断的一项活动，而战术更多是实际性的，有一定时间都是通过这种方式来达成你的战略目标。我们直接讲到战略的时候，你的活动或说你的行为会带来比较大的影响，也就是长期的影响就是战略；讲到战术的时候更多的是一些短期的活动，这样就说明了战略和战术的区别了，理解了吗？希望大家能够明白，战略和战术之间有很大差异的。所以对于你的工作不要只从战术方面去考虑问题，来看待你的国家、你的市场、你行业的产品，要拥有全局观。


    > “战略上藐视一切对手，战术上重视一切对手！”

    毛泽东'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 三、营销中常犯的错误


    在营销中的错误，看起来非常简单，但影响却很大。

    请记住：如果الحق犯了错误，那就立即停止。每一个错误就是你改进的机会（成功就是不断试错的过程，但是我们也可以通过正确有效的学习来尽量避免此类的错误）。这些错误是很多的企业家，不管他是有多大，有多小，或者是零售还是批发，或者服务业等等，都可能犯这些错误。所以你不要觉得只有小企业才可能碰到，大企业同样也可以碰到。接下来，我们找出一些典型的常见错误进行分析。


    # 1、营销计划没有经过测试和验证


    在无形当中，我曾经了解、分析、检查，价值百万以上的这种营销方式，广告的宣传方式我研究过，做过各种各样的测试，从一种方法换成另一种方法的测试，不同的销售、在客户服务、在制造业，在产量做过很多种测试。当你用不同的方法测试比较的时候，你会发现一种方法比另外一种会带来很大的好处。比如，如果在广告中做个调整，就能使广告产生几何式倍增的效果；如果是在营销方案当中，把你介绍的主题内容写对了，就可能会有3、4倍的人来关注这份文'
  merge: -1
  img_proc: true
- pgno: 138
  md: '案；不同的方法会有不同的效果，使用这种方式效果提高了百分之十几到百分之五十。那么在后面章节我会讲到在测试的时候有那些关键点和参数，通过这种测试，通过这种组合，我们可以找到一个点，让我们的营销方式获得突破。


    # 2、广告推广的方式选择错误


    不管你是发邮件，还是网站上做广告，还是电话销售，电视、电台、微信、手机端等投放的广告，像所有的广告，你要获得直接的回应广告，也就是你这个广告向听众发布的信息，就是让他们看到这个广告采取行动，有可能是请他们试用产品，或者参加研讨会，或者是提供一个诊断，或者是一个宣传手册，请他们参加一个短期的免费培训，这些实际上需要有直接效果的。在这些广告里就是要求他们直接和你取得联系，让他们直接打电话给你，这些人也就是对你产品有兴趣的观众或者听众，也就是说你做广告需要直接回应的广告，而不是那些机构式的广告。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 3、缺少与众不同的独到之处


    如果你希望你的客户从你这里而不是从竞争对手那里购买产品，那你要说服他们，要给客户一个理由。你的产品为什么比别人好？为什么值得他们长期来购买？为什么可以让他们获得更好的体验？你只有把这个理由讲得清楚明白，不然你是不能打动消费者的。只有你能够直截了当的说明你的与众不同，才能说服消费者，打动他们。你要有独特的销售主张，然后贯穿到你所有营销的活动当中。比如客户说你刚才说的很好，但当客户实际来购买交易的时候，发现并不是这么一回事情，你要说到做到（说我所做，做我所说）。


    # 4、没有设计延伸产品和服务


    没有很好的来扩大你的产品线、延长你的产品生命周期，这样使得你的业务稳定性不够。你要有后续的产品和服务，才能获得利润。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 5、不了解客户的需求和愿景


    我们希望这样做：


    首先我们要去询问一下这些客户，他们使用了我们的产品和服务，他们为什么感到满意，然后把它记录下来，看一下当时这个客户是怎么说的，这个语言措辞造句是怎么讲的。然后再找不买我的而去买竞争对手的产品客户，去问他们为什么选择对方，看一下客户是怎么回答的。这样你可以从中学到很多东西，竞争对手为什么比你做的好。第三，你最好去买一下东西，体验一下这个采购的过程，比如说到一家新酒店，他的服务技能相对来说不是非常的高，但是你看到这些酒店的人员非常真诚努力的想提高对你的服务，这些是非常的感动。所以你要诚挚的、真诚的去了解你的客户，了解他们这是很重要的。


    # 6、没有具备诱人、简单而有趣的卖点


    你要让公司业务简明，充满乐趣，你要让客户觉得在你公司购物享受服务是非常愉悦的一个过程，要让客户获得体验。你要对他们彬彬有礼，不能让他们久等，给他们送上咖啡，不能不把他们当回事，得罪他们。而且你的卫生间'
  merge: -1
  img_proc: true
- pgno: 141
  md: '要很干净，不能到了卫生间很脏，而且没有手纸。比如说我们到了餐厅吃饭的时候，服务生拿过菜单来，菜单脏兮兮的，你一定感觉不爽。所以你一定要站在顾客的角度来审视你整个购物享受的服务过程，你要做到每一个细节，都是一丝不苟，让他们觉得和你公司业务往来是非常的轻松有趣。


    # 7、向客户介绍时不够详细和准确


    没有解释清楚为什么你的产品、服务与众不同，为什么你的产品比竞争对手的好？为什么你的服务对客户而言是最佳选择？如果你来参加我的课程，我们会告诉你参加我的课程有什么样的益处？为什么大家值得花这么多钱，走这么远的路，还要花钱住高档的宾馆。所以你一定要铭心自问，有没有让客户得到了物超所值的东西？不要让客户失望。如果你不能打动消费者，那么你所做的都是无用功，你一定要问自己有没有充足的理由来说服消费者，你提供的产品和服务是物超所值、物有所值的！是不是给他们提供的是唯一有效的解决方案，我们有没有解释清楚他们购买了我们的产品和服务，能够有效的改善帮助客户解决他们的问题，改善他们的经营，改善他们的生活，如果你没有说清楚的话你肯定就不能说服这个消费者。'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# 8、放弃了原有有效的营销方式


    也就是你不要停止目前正在进行或过去有做过行之有效的营销活动。我有个学员，他们已经养成习惯就是每年对所有的老客户只要逢年过节都要发问候信息，并不是说有多好的效果，只是他们养成了这种习惯，他们觉得所有这些活动是证明有效的。只要是证明有效的就不应该停下来，因为他每次都会给你带来额外的效果。如果你做了一次营销活动，做了一次广告，只要是有效果的，尽管这个效果越来越弱，但是只要有效果你就不要停止下来。尽管你想到更好的定位，更好的产品，更佳的渠道，即使是有效的，你也不要放弃原来证明有效的渠道。


    # 9、营销的对象定位不准确


    有可能你的产品和服务是针对一个市场的，有可能这个市场是非常细分的，在这个市场购买你产品和服务的可能性比别的市场高10倍，你就可以起到事倍功半的效果。当你在起草营销方案时，只关注你潜在的客户；不要关注别人。审查潜在客户的资格。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 10、没有建立详细的客户档案


    不同的客户类型，他带来的价值是不一样的，而且你跟客户交流的越多，购买的金额也就越大，但是这些之前你必须有一个详细的客户数据库。我们有很多的不同的数据库，包括网上的服务等。你要充分的来利用这些渠道来获得这些潜在客户的联系方式，要了解这些潜在客户的电话、EMAIL、他们企业的规模、他们会购买什么样的东西、购买的金额是多少？建立好详细的客户档案，有了这些数据库，你就可以进行挖掘，这样做实际上会给大家带来非常大的回报。


    # 11、注重战术忽略战略


    这个前面有讲到过，就是要定制适合你企业的市场营销战略，其中包括你的企业的远景，看看你有什么资源，以及如何利用这些资源，整合这些资源。我们知道不同的企业、不同产品、不同部门都是不一样的，不管怎样我们都是需要有一个战略，而且这个战略是需要通过逆向工作来实施的。我们知道有战略没有战术是不行的，但是没有战略只有战术是万万不行的。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 12、营销体系不完善，没有系统化、标准化


    一个企业要获得持久的成功，他必须要有一个体系。我相信对你个人的生活肯定是井井有条的，你会定时起床，之后去洗澡呀、穿衣、喝杯咖啡、然后上班，可以看到这是你整个个人生活当中的一套体系。那么在你工作当中，市场营销当中肯定也有一套体系，你每天在固定的时间会做一个固定的工作，或者对你的营销、你的库存会定期的去检查，那么没有一套系统，我相信这个企业是运作不下去的。但是我们看到在营销上很多企业他们都是求乱无章。我们知道个人生活一团糟的话，有可能早上起来衣服穿错啦、或者早晨六点钟没有醒过来。但在市场营销当中是行不通的，很多时候我们恰恰是在市场营销体系当中一团糟，我们一旦制定了一个市场营销战略之后，就要把它贯彻到市场营销当中去。


    对于如何找到潜在客户，那么你也有一套体系，比如说你会去找特定的市场，房地产公司、其他的专业公司、行业协会等等。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 13、没有充分利用互联网营销


    在过去，我们的很多业务都是传统的经营方法。那么现在有互联网，你就可以把产品卖到全国，或是全世界。而且24小时人们都可以在互联网上下订单。所以互联网是一个非常好的交流的工具，建立一个社区网络，然后和你的供应商、客户呀等等建立很好的关系，同时你可以进行网上教育，不管是书面的，还是音频的，或者是网络会议。


    你如果就想在不增加你的时间、精力的情况下能够获得更高的回报，那么因特网就是一个方法，你可以把它用到任何的支柱上，它可以大大提高你的绩效。


    # 14、输在了行动太快


    如果说你有一个卓越的战略，你会努力的去帮更多的客户来买你的产品和服务，为什么呢？是你的产品和服务的确能给你的客户带来价值，所以你给他们提供产品实际上是为他们好，同时你就会意识到你有这样一种社会责任，把你的产品和服务推荐给你的客户，的确是能够给他们产生价值的。当然你必须有个战略思考，能够有条例的去做这些事情。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 15、当一天和尚撞一天钟，得过且过


    中国的经济正在高速成长，大家的日子挺好过，但你忘了没有充分挖掘自己的潜力，你没有理解到实际上可以做得更好，本书将会改变营销的思维方式，从一成不变的、普通的、中庸的商人，变成一个有战略思维的企业家。如何优化自己的资源？如何使自己的资源最大化？如何把你的潜力发挥到极致？所谓创新就是抛弃你现有的陋习。管理大师彼得德鲁克说：如果不能自己淘汰自己的商业模式的话，你的竞争对手会帮你完成这个任务的。你要力求不断的找出创新的方法，改变现有的这种做法。而且，德鲁克还说：市场营销它是唯一可以给企业带来利润的活动！所以市场营销和创新是关键的两点。


    # 16、不对产生利润的营销方式复投


    这是一个经常犯的错误，很大的一个错误，不管是大企业还是小企业，他们不会把利润投资到营销当中去。当然这不是你的错误，很多人并没有意识到市场营销的投入，它会给你带来最大的投资回报。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '如果我们进行定量的分析，可以看到可能在市场营销当中一美元的投入，会给你带来百分之两百、三百、甚至四百的回报。但是很多时候中小企业的业主并没有从这个角度来考虑这方面的投资，你舍得花钱去买设备，因为你eci可以很容易的算出这个机器生产多少产品，给你带来多少回报，这个是非常容易计算的，你觉得扩建自己的厂房，购买原材料，销售出去可以给你带来多少利润。这是可以算得出来的、定量的。


    当然他们是以企业的利益为中心，对于市场营销的投入可以带来多少的回报？能够允许在市场营销当中投入多少的资金？很多人都忽略了。对企业来说在培训和市场营销方面应该舍得投入。因为只有通过市场营销才能够使你的企业与众不同，才能够让消费者了解你的产品和服务，甚至你的技术并不是最先进的，但是如果你做到家喻户晓的话，大家都会慕名而来。


    所以对于市场营销的投入是一个回报率非常大的投资。你勇于在这方面的投入，才能获得成功。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 17、不懂得利用客户的终身价值


    可参考《商业模式·顶层设计》书籍或无为老师正式课。


    # 18、没有充分利用和整合各方资源


    你首先要了解你的资产，你的库存到底有哪些？了解你这个企业到底拥有哪些资产、哪些关系、哪些资源？因为在这些方面企业有很多没有挖掘经常被忽略的机会。


    # 19、将营销和销售看作互不相干


    如果大家具有战略性思考的话，这个市场活动、营销活动、你跟市场之间的互动、你跟潜在的客户之间的互动，这些活动是应该整合在一起的，它们应该是必须互相促进的，最终的目标是吸引客户，让他们来更加容易的来购买你的产品，让他们第一次尝试你的产品，不断的购买你的产品和服务。然后能够实现更多的客户价值，而且能够购买我们后续推出的产品和服务。要让他们发自内心的满意，形成口碑后主动介绍新的客户。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 四、简化购买过程，降低购买门槛


    如果和你做生意很难，谁还会成为你的客户呢？


    向你订货要非常简单，不需要复杂的思考，也绝不需要留意如何才能正确订货，要降低客户跟你打交道的门槛。人们来买东西他们是承担风险的，那么他们肯定是有担心、有顾虑，那你怎么样能想方设法来排除他们的顾虑，降低他们所承担的风险，这样你就可以比竞争对手做的更好。(无为老师正式课中会讲到如何消除客户的顾虑，使业绩大幅提升。)


    对售前问题的解答要积极、及时，坦诚！不要让客户有这样的反应：“哇，这产品真不错！但是我怎么购买呢？”营销导师乔维托讲过这样一个故事：他看见了一张宣传Tacoma
    Chief 吉他的广告，很受感染，于是想马上买一把。但他仔细读完了广告，却没有在上面发现该公司的联系方式，既没有公司电话也没有公司地址，什么联系方式都没有。他想，该公司一定是希望客户到当地的吉他店购买，于是他拿出电话簿开始打电话咨询。但只找到一家吉他店听说过这种吉他，而且这家店也不知道怎样才能购买这种吉他。这样，乔最后还是没有能买到那把吉他。该公司如果把网站或电话号码印在了广告上，乔肯定会买到Tacoma
    Chief 吉他的。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '销售程序中任何不必要的或容易引起混淆的因素都会对销售产生负面影响。该公司却忽略了这一点，在销售一开始就给客户设置了重重障碍。在自己的购买程序当中，你要思考如果你是客户，会感觉如何？流程足够简单吗？怎样能把购买程序变得更加简单容易呢？


    或者，我们只需要一个小小的二维码就可以让商品相关介绍信息变得简单又清晰。'
