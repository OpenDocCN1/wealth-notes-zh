- pgno: 153
  md: '# 一、永远以品质为第一


    在任何时候，尽最大的可能使你销售的产品和服务以及为你工作的每位员工的工作达到最高的质量！对这个要求必须毫不松懈。如果你的产品非常棒，但是你的工作人员却不懂与人良好沟通、常常漠不关心或者不能留意到一些他们能够给客户带来价值的新方法，那么在你的企业内无意间形成一道“品质”鸿沟，并给你的竞争对手创造了销售的立足点！


    希望同学们能够下定决心使“高品质”成为你“独特卖点”，一个卓越的企业家要具备工匠精神。要成为一名成功的企业家，“你必须先成为一个服务和品质的狂热分子”。仅有两项绝对根本的要求排在品质之前：


    +   1. 必须拥有洞察别人所需所想的能力。


    +   2. 必须找到一个市场缺口。


    即使是世界上最牛逼的营销计划也会很快被较差的品质破坏殆尽（100分的商业模式+0分的产品=0）。'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 下面是我对品质问题的看法：


    如果你销售一种产品，那么就使它成为你所能制造的最好、最有用的产品。如果你销售一种服务，那么就使你的服务成为最出色的服务。如果你遇到一个问题，那么尽可能公平地从客户的利益出发将其解决，要时刻谨记利他精神！


    制定广告或宣传计划时，在人力所及的范围内尽可能多考虑、多考察、多回顾。如果你所做的一切都保持最高品质，那么你一定会做的更好！你可以写出更具有影响力的广告和宣传语，因为你已经具备了强大的真实实力。同样，你将会获得无线增长的重复业务和追加业务，因为你拥有如此多满意的客户和推荐人。你将会对你自己以及你所做的一切感到非常满意，这种很棒的感觉会反映在你与客户签订的每一份合同中，并感染到你的员工。实际上，你将更严格的要求自己的企业，使一个曾经非常沉闷的企业再次充满活力，勇于自我挑战并成就更多。从今天开始，从现在开始，使业务的各个方面保持最高品质。这样会为你带来非常巨大的回报。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 二、把产品展示给有强烈购买欲望的人


    假设你的销售业务是把关节炎药物卖给老年人，你会挑一群绣着纹身、穿着鼻环的重金属乐队在 MTV 中为自己的产品做广告吗？或者你会到专门为小孩们播放卡通片的频道去做宣传吗？当然不会，你可以构建最强大的销售，但如若不能把它展示给对你所销售产品真正有兴趣的购买者，那么你就是浪费时间。


    因此，要向真正有兴趣的购买者展示你的销售。如何找到这些渴望人群？只要你肯用心去找，到处都有。当大多数人想把自己的销售信息传播出去时，一般都会想到典型的广告方式：网络、电视、电台、报纸、杂志、广告牌等等，当然，适当地运用这些媒体可以带来直接接近渴望人群的机会，实际上有无限多的途径可以发现，有一些相当便宜，甚至是免费的。


    比如：你可能发现某 APP 的用户群正是你要寻找的目标客户群，那你就可以购买下该 APP 的广告位。很明显的，在合适的目标媒体上做广告要比错误的地方有更大的吸引力。当然你不会向秃头的人做发梳的广告（除非你有能生发的神奇梳子）。你不仅可以购买典型媒体的广告，还可以购买那些与你在同一市场上销售的企业已经创造的接近客户的途径。事实上，通过后一种方式'
  merge: -1
  img_proc: true
- pgno: 156
  md: '你更有可能找到最优反应的目标客户。试想，一个观看钓鱼节目的观众和一个刚买了鱼竿的人之中，你认为谁更有可能买你的鱼饵呢？那么这又如何运作呢？很多企业都知道有一种很好的提高收益的方式，那就是出租他们的客户名单。你可以发现有许许多多的企业乐于以相当合理的价格出售他们手中的名单。比如：中国移动、银行、保险公司、航空公司等等，然而，这都还是一些浅显的办法。不想为接近客户而付费吗？是的没有问题，你可以不必付费。


    许多已经有办法接近目标客户的人会教给你一些巧妙的方式。让我们假设你在出售某种相当高档的产品，目标客户是那些只看品质不看价格的富人。你发现了一个都是一些高层次的顾客参加的时尚沙龙，于是你接近店主：“让我把我的产品免费放在你的沙龙里，只要你卖出一件就可以得到
    50%的好处，如果卖不出去不用付一分钱。”这种方式极其简单，不费吹灰之力，你们双方都像掏钱一样抓住了共赢机会。如果在这个沙龙售出几瓶之后，你可以建议店主：“为什么不向你所有的顾客发出一条信息，告诉他们你可以打折出售我的产品呢？我甚至可以支付你一定的宣传费用，每卖出一件我都可以付给你售价的
    50%。”如此一来，你就以相当低的成本和极小的风险赢取了你的目标客户。'
  merge: -1
  img_proc: true
- pgno: 157
  md: '还想进一步降低风险吗？等到该沙龙下一次发出邀请函时，要求他们把你的广告写在上面。天哪，你已经把成本降低到只需要付给印刷公司的价钱了，或者电子的只需支付设计费。


    这种可能性是无穷无尽的。事实上，在营销中，有大部分利润是通过这种策略赚取的。还有，每次你遇上潜在的客户，即便他们不买，你也应当留下他们的联络方式并获取他们的同意，以便在未来向他们推荐你的产品。如果有人进店闲逛，尽量记在你的客户档案上。如果有人浏览你的网站或公众号，要求他们注册以便于给他们发送推荐信息。如果你做促销活动，某人走向你的展位，请记得留下这人的联络信息。每一项细小的、与潜在客户的联系都是一个慢慢建立起自己的渴望人群的机会。这期间你会发现一些意想不到的案例。


    有时候渴望人群就在那里，所有你要做的就是悄悄地发布自己的营销信息。在网络上，有数以万计的社区，可以肯定的是你会找到一些适合你的。通过向那里的会员伸出援助之手，会使你在他们中间很有知名度，你会形成一批忠实的追随者。这时候要慷慨地送出样品。一些会员会因为对你的服务十分着迷而替你进行宣传。'
  merge: -1
  img_proc: true
- pgno: 158
  md: '还有另外一种方式，如果去某些夜总会，在打烊之前你不可避免地会受到来自其他竞争对手的推销搭讪，并且都会赠送给你他们那里的入场券。这是一种边缘性的抢夺客户的行为，如果我是你，我会像瘟疫一样多开，不过这的确是极有可能打动你的。被遗漏的人群就在世界的某个地方游荡，等待你的发现。


    以下一些章节里，你会发现应用这些策略的其他一些让你更加难以想象的途径。


    # 谁拥有你的客户，就和谁合作！


    # 我的产品，就是你的产品，你的客户就是我的客户！'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# 三、创造独特的卖点


    如何创造独特的卖点，并从中获益不论在互联网上或在实体店里，人们多半不了解他们卖的是什么东西，卖的对象是谁。普遍的认为“我的产品与服务适用于每个人”。因此，很多人进军网络，期盼能吸引在网络世界中遨游的数亿人。事实却证明，你的焦点越集中，成效才越佳。因此，你得了解属于自己的独特卖点。你的独特卖点会帮你找到市场定位，进而找到你的黄金屋。


    独特卖点就是宣告你在市场上的差异性。它透过一句标语，便说明了产品之独特性。于是，独特卖点便成为你的广告标语，使你卓尔不群，与众不同。若能了解独特卖点，便能锁定服务与市场范围；若能宣传独特卖点，便能吸引特定消费群。


    比如，亚马逊网络书店不败的卖点是：全世界最大的网络书店；达美乐拥有一个打造皮萨王国的独特卖点：保证三十分钟内将新鲜又热腾腾的皮萨送到你家；可口可乐长久不衰的独特卖点：可口可乐真正的可乐；凡是成功的企业都有一个独特的卖点。'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 如何创造独特的卖点呢？


    你的独特卖点透过与众不同又优异于他人的方式，在销售市场中界定你的地位。以下有一些问题，能帮你想出你自己的独特销售卖点。


    +   1、你销售的是什么？写下你认为自己的产品或服务是什么。你的答案可能如“我们销售地毯”一般清楚明了，或者你会加油添醋地说明你的服务：“我们销售的地毯，能让你的双脚更舒适自在，使你的家更富丽堂皇。”


    +   2、你所销售的东西有何独特性？或者你将如何做销售？理所当然，你有竞争对手。什么特点使你有别竞争对手？你能提供什么东西，是竞争对手无法提供的？你的独特性是什么？或者你能做何事来增加企业的独特性？写下你的答案。


    +   3、你如何将前两个答案以一句精简又具说服力的文辞表现出来？这可能得耗费一些心力，但尽可能写下数个脑力激荡下的文辞。然后，将它们拼拼凑凑，看看是否能构思一句能点出你独特性的文辞，这句话文辞便成为你独特的销售卖点的开端。谨慎使用如“品质”、“服务”或者“最佳”这些抽象'
  merge: -1
  img_proc: true
- pgno: 161
  md: '字眼。宣称你销售最高品质的家俱，听来似乎言之无物。“品质”的意思究竟如何？意指你采用一种特殊的木材吗？果真如此，便说出来。宣称你提供“一流服务”，同样也传达的讯息不够。你的服务如何能称为“一流”？意指你接听电话迅速、到家服务或周末无休吗？如果是这样，就说出来。


    # 如何撰写自己的独特卖点，有三项建议：


    1、每则广告必须传达讯息给消费者


    你的独特卖点应该确切说明，人们购买你的产品或服务中能获得什么？不论是虚拟空间还是实体空间，了解你的企业特点，便能帮你在销售市场上作自我定位(关于具体如何定位在我们的正式课中会的详细介绍)。


    2、传达的讯息必须是竞争对手无法提供或者尚未提供


    你的企业独特性是什么？如果你要潜在顾客走向你，那么你务必从群众中脱颖而出。你如何不同于竞争对手？你能做什么，连竞争对手也无法做到的吗？'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 3、传达的信息必须强烈的撼动群众


    你也许能够写出一句独一无22的标语，不过除非它能说服人们及刺激消费，否则便不够完美。你的独特销售卖点必须具有说服力。它必须提出让人们愿意掏腰包的理由。否则，人们为何要花钱在你的服务上？所以撰写一句能使你的事业闪耀的独特销售标语，你才能脱颖而出，也才能奠立举足轻重的地位。


    # 顾客最大的痛点，就是你最大的卖点！


    # 数码相机+MP3+MP4+电脑+电子书+手机...=苹果！'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 四、如何打造爆款产品


    爆品不是产品，而是一种创新的商业模式。


    本段中我将以小米的爆品思维来进行讲解如何打造爆款产品，小米去年 200 亿营收，80% 来自不到 10 款产品。在小米生态链中，一百万销量、10 亿营收的单型号产品，才能被称之为“爆品”。


    比如，智米生产的小米空气净化器，年销 300 万台。这是典型的爆品逻辑。而本质上讲，只沿着一个既定思路做出一个产品，使得企业获得系统运转效率的本质提升，最终在竞争中形成系统性的结构优势，这才是爆品逻辑的核心。这种优势能够体现说供给链的议价、市场、运营、研发费用的摊薄等等方面。这个优势如何形成？我梳理了苹果和小米的方法论，形成了五个步骤。


    # 步骤一：产品从人性出发


    出发点确定之后，产品的发展方向才能变得聚焦、收敛、唯一。例如，苹果的 AirPods 耳机，取下一只耳机时，音乐会停止，两只耳朵都带上，音乐又会自动启动。这与此前蓝牙耳机使用时，'
  merge: -1
  img_proc: true
- pgno: 164
  md: '打开耳机、打开蓝牙、选择蓝牙等等一系列复杂的动作完全不同。这源自对便利性需求的理解。人的需求有很多，需要通过观察去获得。而人性就更是深层的体验，喜悦、连接等体验都需要洞察。


    # 步骤二：用底层技术来支撑。


    发现需求的不只是苹果，但实现需求却很难。苹果能够做出来，是因为他们的底层创新技术开发。比如，AirPods 耳机里集成了全球最好的资源；供应商给苹果提供了体积最小、性能最可靠、技术最先进的元器件。但是有一个东西其它元器件厂商做不了，就是里面达到两耳协同效应的连接芯片，没有一家蓝牙芯片公司能够提供这样的解决方案。在这种情况下，苹果直接做底层开发，研发出了
    W1 芯片。


    # 步骤三：聚焦在一个方向，找到最优解。


    需求和技术确定后，聚焦才能找到最优解。因为方向清晰又聚焦。这就能够使团队用一种非常彪悍、高效的方式来运作，对一个方案、一个方向做出无限趋近的打磨。这个是能以小型团队支撑爆品设计的前提。你能看出这几台净化器的区别吗？'
  merge: -1
  img_proc: true
- pgno: 165
  md: '比如，智米在开发小米净化器的过程中，为确定净化器孔的大小，就做了十多个方案。因为同样都是 5730 个孔，太大了会让净化器显得黑，不好看；太小了会影响进风、出风、过滤，从而影响产品性能。每个方案都是用计算机模拟，数控加工做出实物，检测性能，仔细打磨，最终确定了每一个孔的直径
    0.2 毫米。很多人不能理解，但其实一件产品如果想成为爆品，设计者就应该有这个能力或者信心把它打磨到最好，努力去寻找最佳的平衡点。


    # 步骤四：沿着确定的方向迭代


    产品获得成功后，又会面临一个新问题，即“迭代。因为对手会跟进，而技术也在前进，所以产品要往前走。这里面有几个需要注意的问题：


    +   1. 要笃定方向。

    2. 要做减法，这是硬件产品的一个颠扑不破的思路。

    3. 一定要靠技术革新推动升级，不是为变而变。


    比如，Mac 从 2014 年到今天，基本样式没有什么变化。如果你是一个追求多样性的人，你会觉得设计师太懒了。Mac 的四次迭代，并没有看出明显的区别。其实，Mac
    迭代的思路很清晰，'
  merge: -1
  img_proc: true
- pgno: 166
  md: '它要创造的是一种底层的愉悦感：轻灵的体积内蕴含着非常强悍的运算能力。所以它一直沿着一个非常笃定的思路在前进：收薄、收薄、收薄，但这里面有非常大的技术进步在推动。


    比如液晶显示屏背光模组的贴合，厚度的简化，产生高性能运算能力的核心元器件的转化，机器从塑胶到铝合金散热性能的提升，产生的结构堆叠的更紧凑性，最终使得这个产品一步一步往前走。智米空气净化器的迭代也一样，思路就是更简洁，更精致，更强大。所以，我们的新款和老款外观并没有太明显的变化。但新增加的数字显示功能，源自于用户对生存环境的评估需求。但能在不明显增加售价的前提下，把激光颗粒物传感器安装进空气净化器，是技术研发来实现的。增加的孔则是把产品效能提高的同时不破坏美观。而数字的显示采用
    OLED 屏则是为了把光污染值降低，不对用户的睡眠产生影响。


    # 步骤五：以满足最终需求为目的，不以目前产品为终局


    产品从做成爆品到迭代，然后，再往上跨升，就变成升维了。这种升维是如何完成的呢？


    回归需求，意识到现在的产品只是阶段性结果，而非终局，'
  merge: -1
  img_proc: true
- pgno: 167
  md: 不受品类限制，不断积累。如果给硬件爆品排名，iPhone 是绝对的 No. 1。但我相信苹果已经在多个维度上为下次升级做准备了。比如 iPhone X
    的面部识别和 AR 功能，这些技术的积累，一定孕育着跃升到下一个层级的能力，最终从量变到质变。他们思考的是，用手机的最核心目的是连接和通讯，如果我们探讨这个需求，那就不局限于手机这个产品本身。美国纽约第五大道的苹果专卖店，苹果通过与制造商合作研发，耗资
    650 万美元，将玻璃数量从 90 块缩减至 15 块，苹果标志更加清晰醒目，最终形成这个产品的仪式感。
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 能不能做出爆品，是谁决定？


    1. 一个企业能不能做出爆品，一定是由最顶层的人确定的。最顶层的人包括：最高水平的设计师以及这个企业的最高管理者。


    2. 设计师只有层级的区分，没有量的区分。对于爆品而言，如果说 100 分的设计师是 1，那么 80 分的设计师就是 0。所以 100 个 80 分的设计师，也很难干过一个
    100 分的设计师。


    3. 最优秀的设计师一定站在了艺术和科学的交叉点上。因为他们需要懂人性，而人既有感性的一面，又有理性的一面。如果只偏一面，就无法感知另一个维度。


    4. 设计师都具有成为企业家的天然优势。因为他们是对于用户体验有一种特殊关注的人。


    5. 但是设计师不一定能成为企业家。当我以企业家而非设计师的身份参与到产品中时，就会出现设计只是其中一环。爆品跟技术的创新、整个的供应链支撑、成本、市场、甚至切入这个领域的机会、时间点，都有很重要的关联性。'
  merge: -1
  img_proc: true
- pgno: 169
  md: '6. 设计师追求细节，而企业家要看清格局。智米能成长为独角兽的关键点就是短短几个月时间做出产品，抢在雾霾季之前推出。这与设计师的追求极致有天然的矛盾，但这是企业的第一要务，已经超越了产品本身。


    7. 因此，企业家需要做一个有判断力的人，而非一个设计师。他拥有超级视觉和超级感知，也相信设计的力量，给予优秀的设计人才充分信任，为他创造平台和空间，决定了企业的产品所能达到的高度


    8. 创业者打造自己的判断力，可以上混沌大学的课堂。在涵盖商业、艺术、科学、美学各方面的课程中进行长时间的浸染和酿造，最终提升你的综合能力。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 本章结束小结：


    苹果之前，没有企业敢在做产品的时候，只做一个方案，沿着一个既定的思路只出一个产品。而小米一开始的思路就与之一脉相承，加上这么多年来在技术和供应链上的积累，才有了今天的反弹，成为真正爆品逻辑的实践者。很多企业，是不敢冒这样的风险的。我很庆幸小米生态链提供了一个特别好的平台。就像周星驰电影里的「猪笼城寨」一样，提供了一个巨大的保护屏障，使我可以安安心心地做产品，最终做成一家产品创新型的公司。1945
    年，索尼株式会社在战后的一片废墟中，推出了第一款产品——像洗脚盆一样的电饭煲，但就是在这个基础上，用技术革新和产品设计的方法，创造出了神话的产品创新公司。所以，只要聚焦，按照一个既定方向持续知难而进，荣耀一定属于你。'
