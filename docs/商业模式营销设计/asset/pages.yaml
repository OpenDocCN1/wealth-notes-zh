    而且立下军立状，以安周瑜之心。


    诸葛亮其实早已暗观天象 知道第三天必定起大雾 所以早已想好草船借箭之计， 果然第三天起了大雾 诸葛亮问周瑜借来几十艘船只和百余兵丁，锣鼓齐备 并且在船上遍扎草人
    开到曹营面前擂鼓呐喊 明知曹兵在大雾天定不会出战，只会射箭退敌，果不其然 曹操并不出战，直命曹兵乱箭拒敌 在曹兵乱箭之下 几十万只箭全扎在草人之上 遍布船只的现象，
    诸葛亮估计箭支早已20万足够有余 命众军士高喊谢曹丞相赐箭，待曹兵知道上当来追时，早已返回江东大营了！


