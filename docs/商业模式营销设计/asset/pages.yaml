- pgno: 50
  md: '# 4、怀旧情绪在什么时候产生


    # 1、处于沉重的压力下。


    人们在遇到困难，压力的时候，倾向于从记忆中寻找缓冲点，沉溺其中，暂时缓解现实的压力。比如，你工作太累时会想念家乡，想念爸爸妈妈；被追杀过后狼狈不堪的时候，会提起“想当年。。。。”


    # 2、对“经典”本身的爱好。


    复古风、古典乐、莎士比亚等等，都是对过去“经典”的一种追溯。


    # 3、简单的联想。


    单纯的由某件事引发的对过去回忆的联想。比如某首儿歌、某场动画片、某一种食物的气味等等。哪个，网易的刷屏H5就可以被划进这一类。


    # 4、人生出现断层时（这是最重要的一点）。


    # 5、当你所处环境和生份发生变化时。'
  merge: -1
  img_proc: true
- pgno: 51
  md: 从一个环境到了另一个环境，当你从 Y 身份变成了 Z 身份，当你从一种状态转换成了另一种状态的时候，这种环境、身份、状态的突然变化，让一个平整的人生出现了“断层”。人们为了缓解这种“断层”产生的不适应，便会心生怀旧情绪，使自己平静下来。
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 5、如何设计一次有效的怀旧营销


    产生怀旧情绪最重要的一个因素——人生出现断层。无论对于个人还是集体而言，“断层”这个因素都是一定存在的，定期爆发，等待被使用。


    比如各种电影，每隔一段时间，就运用怀旧营销来挣一笔生活费，帮我们回想一遍曾经做过的事：《前任3：再见前任》、《英雄本色》翻拍版、《芳华》、《那年八岁》、《捂跶吧！爸爸》、《原谅他77次》、《大话西游》加长纪念版。


    还各种金句段子，不断爆火，让我们一遍遍回到过去，确认“自己曾经是谁”；


    小时候刮奖刮出“谢”字还不扔，非要把谢谢惠顾刮得干干净净才舍得放手，和后来太多的事情一模一样。


    我的意中人是个盖世英雄，有一天他会踩着七色云彩来娶我！结果呢？还是嫁给了中意我的人。但那时的美好，是依然存在的。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '那么在营销上，如何利用这种怀旧情绪让消费者心甘情愿的参加某个互动呢？


    很简单，既然怀旧情绪的重要作用是补偿这种“断层”，让人觉得“我还是过去的我”，你就问自己两个问题就行了：


    第一：我想让消费者（或用户）做什么？


    第二：我想让他们做的这件事，和过去他在什么身份下做的什么事，是类似的？举个例子，我们可以策划这样一个活动：


    《我准备好了 40 张书桌，等你回到高中》


    “你有多久没有连续 10 小时读书学习了？有人说，他这辈子智力的巅峰就是高考结束的那一刻。现在，我们策划一个活动，让你这周末回到高中……“


    再比如，企业家俱乐部的活动：


    第一：我想让用户做什么？


    想让这些企业家参加我的“行走戈壁”活动，来吃苦。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '第二：我想让他们做的这件事，和过去他在什么身份下做的什么事，是类似的？让这些企业家找到年轻时的自己（吃苦奋斗）。所以，可以这么说：


    “企业家们，我们当年浴血奋战、吃进苦头才有了今天。到现在，我们在私人会所里喝茶，在豪华轿车里躺着，那么，让我们想起当年吃苦的企业家精神，跟我一起徒步走戈壁！”


    简言之，对于身份、环境、状态不断变化的消费者（用户）来说，“怀旧”是一种很容易定期爆发的情绪，且不像“热点”元素一样泛滥互联网：“魔兽”让而立之年的玩家最后再战一次；《摔跤吧！爸爸》让观众为爸爸感动一次，怀念曾经自己“最恨”的虎爸；最后来一大包“辣条”让消费者再一次体验童年。


    通过对上述内容的学习，我们发现，从出生开始就在被各种品牌影响，培养出了购物习惯，还有恐惧、愉悦等等情绪的驱使，以及从众心理和怀旧心理的推动。再加上记录我们一举一动的数据，营销手段可说是防不胜防啊，消费者想要完全消除掉这些弱点，做到百毒不侵，是不大可能了。可以说是一个一环扣一环的连环套。那么我们学习了这些营销的设计原理之后，是否可以应用在自己的企业和产品之上'
  merge: -1
  img_proc: true
