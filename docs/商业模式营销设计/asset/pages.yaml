- pgno: 86
  md: '# 一、设计致胜营销的 24 招


    # 1、与有影响力的人合作，让产品成为影响力中心


    每一个经营者都一定要不断地思考这个问题：我如何去让我的产品成为最有影响力的产品，成为被公众讨论的产品，最终成为被顾客使用的产品？我的市场占有率不一定是最高，可是我的影响力一定要是最大，我的顾客不一定要最多，可这些人必须都要具有一定程度的影响力。譬如说，改变世界商学院的课堂里面有
    70%到 80%的人是企业家。一个企业家比一个营销代表能影响更多的人。


    企业家能成为你的学员，你的影响力就更大。你要不断把焦点集中在创造更大的影响力这个目标上，通过你的产品和服务尽可能地去发挥影响力。但是要注意，不能够用最高的风险和投资去达到发挥影响力的目的，你的影响力一定要在最低风险和最低投资的情况之下得到。以我们实践家公司为例，如果我们可以使用网络，就绝对不使用实体，因为网络发挥的影响力是可以复制并且足够及时的。同样一个场合里面，如果我们可以跟
    1000 个人见面，就不要只见 100 个人；同样做一件事情，如果一次可以影响 3 亿人，就不要只'
  merge: -1
  img_proc: true
- pgno: 87
  md: '影响 30 人。这就是影响力。每 一个人都 要思考：什么是你影响力的来源？找到影响力的中心是很重要的。


    这些影响力中心跟你结合之后，就可以帮助你创造更大的价值。其实大家常常忽略掉的一点是，全世界大概没有一个地方像中国一样，这么愿意开放和共享影响力中心。我要说的是，如果你真的愿意去结识这些影响力中心，其实他们是可以和你产生互动的。有时候他们真的并不是你们所想的那么遥远。或许你就能在偶然的情况下认识一个堪称影响力中心的人。所以我要说：要努力让自己创造更多的
    影响力。如果你自己还不是影响力的中心，你就要去结识更多已经有影响力的人。


    # 2、营销中加入直接反馈的概念


    你愿意先反馈你的顾客，顾客就相对地更加支持你。如果你愿意先为别人服务。后面你就一定会有机会创造更多财富。这是毫无疑问的。


    # 3、开发多个增加盈利和提供安定因素的收入来源


    除了直接销售以外，你还要利用电话销售、广告作为销售手段，还有就是跟别人结盟，进行资源整合。你还可以把一些产品绑在一起变成套装去卖，等等。如果你能够做更多'
  merge: -1
  img_proc: true
- pgno: 88
  md: '的尝试和组合，你就不会只是通过单独销售这唯一的手段销售你的产品。


    # 4、清楚地列出并且记录理想顾客的特征和条件，然后对照这个记录来确认可能的销售对象


    你的力气应该花在可能的销售对象上。我们都希望我们的顾客是最理想的。如果一开始就针对每个顾客建立完整的档案，作完整的顾客分析，你就能比较容易地知道自己有没有找错顾客。你就不需要打电话给他，避免浪费力气和增加自己的挫败感。所以，降低挫败感的方法就是找到正确的人。找一个不合适的人，既辛苦又没有收获。你要把理想顾客的样子就像挑情人一样先决定好。譬如说我在跟学员讲课的时候，我发现某些人很认真努力，一直点头、微笑、赞美、鼓掌，这些人可能就是合适的顾客。下课的时候我跟他们交换名片，可能就会很有收获。如果没有这样一个过程，你会很辛苦。每个人都要拜访的话，非常累人。所以你要花力气过滤你的顾客。你要知道某个类型的顾客会有个特定的门坎。如果你肯跨过那个门坎，自然就能争取到他们。你可以调整你自己进入的门坎，这会帮助你直接接触到你想要接触的人。'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# 5、明确说明产品的独特优点跟竞争对手划清界线


    顾客说：“我看你们都一样。”你要肯定地告诉他：“不一样！”那么最大的不一样是在哪里？最大的不一样刚好是顾客最需要的部分。这就是你的工作。你永远要让顾客知道，你最大的特色就是他需要的部分；所以他一定要找你。你要努力找到你跟同行间最大的不同，并且你要让这个差异成为跟顾客最直接发生关系的连接点。有关系找关系，没有关系就强迫产生关系，总有一天你和他之间能够存在一定程度的关系。


    同样的道理，你一定可以找到你跟旁边那个人的共同关系点。比如我跟你一样都戴眼镜，我跟你一样个子不高，我跟你一样是男的，还有，我跟你一样有个太太。我跟你一样有一个孩子，而且是儿子，等等。每一个人都一样，你绝对可以找到很多共同的关系点。可是偏偏很多时候我们忘记想办法把产品最大的特点跟顾客直接发生关系连结起来。所以就算你很辛苦地每天说服顾客，也没有效果。直接发生关系才比较容易出成果。你在那个地方胡乱挣扎，怎么能卖得出产品呢？所以一定要记得，你要把力气花在寻找自己最强的地方，然后再去找到跟顾客的连接点。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 6、明确说明产品和服务能满足顾客哪些需求


    很多人跟你握手之前，已经被握过很多次手了。在你拜访他之前已经有很多人拜访过他了。可能他对此产生了 quiz 的恐惧跟挫败感。你的任务是让他知道，这次你终于遇对人了！就像一个女孩子谈了很多人恋爱，受了很多伤害，最后终于遇到了白马王子，她这一生大概都会跟着这个人了。


    # 7、把一个和你有关的故事讲给顾客听和营销有效结合


    人人都喜欢听故事。你们有没有注意到，海尔就讲了一个很好的故事。海尔人反复讲述当年海尔把品质不好的产品搬出来用铁锤打烂的故事。这个故事就代表了海尔对品质的专注。肯德基也在说故事，说他们的炸鸡配方。可口可乐也说故事，说他们那个神秘的配方。所有成功的品牌都在说故事。你们要做的事情是给你的顾客讲一个最好的故事。这就是为什么那么多企业在广告里都用顾客做产品的见证，因为这就是故事最重要的一部分。'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 8、确认产品和服务所针对的特定市场对象并准确量化


    你要知道你的服务是为了满足哪一个特定市场。注意，你不需要满足所有的市场。记住六个字——小需求，大市场。任何一个看起来很小的需求。后面其实都隐藏着非常大的市场。不要以为，什么东西都要做到很大，不是的。任何一个小地方都可能创造大市场。所以我们要设定好自己的特定市场。


    # 9、提供无法辩驳的理由购买你的产品或服务


    像我们改变世界商学院，我们提出：只要你参加过一次学习，一次付费终身免费复训。这就是一个无法辩驳的理由。就算是你这次没学会，下次会学会，下次没学会，一辈子那么长的时间里总会学会。总要有一个东西让人不可拒绝。你就要找到一个这样的理由。


    # 10、所有广告或者营销活动都应该是销售的一个延伸。


    营销活动的每一个组成部分都应该为产品或服务提供完整并且不可拒绝的优惠。简单讲，你做很多的广告和促销是'
  merge: -1
  img_proc: true
- pgno: 92
  md: '为了帮助你的销售，而不是为了打击你原来的销售成绩。任何行动都不能造成这种结果：因为做了这些促销，反而影响到正在进行的销售。任何促销和广告都要有助于现有销售成绩的提升，这才是最有效的广告和最有效的促销。


    # 11、要让别人觉得跟你做生意可以得到更多好处


    只要你愿意帮助人家，你就会得到更多的生意，你就能创造更多的机会了。


    # 12、销售应该建立在多步骤的基础上，一步步寻找可能的顾客，一步一步地卖出东西。我们做的是 一种 多层次的沉积


    # 13、创建一套可以轻易复制并能够自动运作的营销系统


    一定要确保你不在时它一样可以运作。比如说做销售，你不在现场但是你可以训练更多的销售员，你可以通过他们去创造财富，这就是重点：创造一个系统，让企业可以完全摆脱个人而存在。'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# 14、不断寻找改造的方法


    更多绝学课程，请加私人微信：A3162209188


    比如通过测试改进生意，同时知道如何用最小的花费、最少的精力和最短的时间去提高我们的业务成绩。所以我们在前面讲过，要通过电话行销、广告、推荐等营销手段。但是你要先去了解这些方法起作用的比例。如果你不了解，你就不知道到底把力气花在哪个地方会更有效。可能你投入80%的时间，只能产出20%的功用，那就没有意义了。所以你要去了解各种营销手段的每一个细节，要统计出精确的比例。


    # 15、营销策略的设计要使每一个组成部分都可以发挥最大的作用，行销系统做出来可以有效地协助销售系统，销售系统的收款模式必须带给会计系统最大的方便。要把系统做到最好，并且要让你的系统和其他系统有最大的包容与互动


    # 16、在正式推荐你的产品和服务之前，要先经过测试让你产品的风险降到最低。'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 17、为顾客提供某种超水准的服务


    你可以给顾客承诺，但你最好让你的服务的实际水平超出顾客的企盼。永远超出顾客的企盼，这是很重要的。


    # 18、你要愿意把一些费用投资在数据软件上，用来分析和顾客相关的数据，尤其是那些真正的大顾客那些数据显示没有再回来的顾客，你要想办法和他们保持联系，让他们可以重新回到你的身边


    # 19、引用别人的成功概念和策略协助自己，让自己的营销策略可以获得一定程度的提升


    # 20、要向更多人推荐你的产品


    名人的认可很重要，因为很多人还是会相信公众人物的推荐。所以看一下你的行销系统里面是否有名人见证这个部分，是否缺乏这方面的内容，或者比较薄弱。如果比较缺乏或者比较薄弱的话，你就要收集更多的名人见证。'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 21、你要把投资放在能够吸取顾客终身性投资的营销活动上，而不能只带给顾客一次性营销


    尽量建立一种终身性营销流程，让顾客买了 A 之后需要 B，买了 B 之后需要买 C。如果你的东西是最好的，你本来就有义务为顾客提供最佳的终身供应，你应该觉得这是你的使命、你的职责。你要帮助顾客终身受益。


    # 22、确认并且使用更多的无形资产


    什么是无形资产？公司的形象、品牌信誉度等等，这些都是无形的资产。你要有效地去使用这些无形的资产，帮助你创造更多有形的资产。


    # 23、为自己作一个好的定位


    比如你可以把自己定位在一个教育资源家，这个定位可以提升你在市场中的公信力。你要告诉自己：“我不是在销售产品，我是一个教育公司工作者，我的职责是在教育我的顾客，让我的顾客了解到为什么人生要解决这些问题。因此我是在教育我的顾客。”如果你是在销售化妆品，你要让你'
  merge: -1
  img_proc: true
- pgno: 96
  md: '的顾客知道她的美丽和她的形象可以带来更多的奇迹，所以她需要来买你的化妆品。所以记得，你不是在销售产品，你是的最好的教育工作者。所有的顾客最后愿意跟你买东西是因为你教育了他。
    “买”的繁体字为“買”，而“卖”的繁体字为“賣”，“賣”比“買”上面多出一个“士大夫”的“士”。你看，买卖之间最大的差别就是一个字：士。士是代表读书人，读书人就是搞教育的。所以买卖真正的关键，其实不是在买卖本身，而是在于教育，在于如何通过更好的系统，教育更多的人，让他们知道自己的价值以及存在的必要。


    # 24、利用别家公司的投资来争取符合你理想条件的顾客


    做事情不能只依赖自己的投资。你可以争取更多别人的投资来壮大你的力量，可以来带给更多的顾客更好的服务。'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 二、设计客户心中的梦想蓝图


    # 1、什么是梦想蓝图


    佛教的终极蓝图：西方极乐世界。


    基督教的终极蓝图：天堂。


    蓝图就是客户心中想要实现梦想。你需要用简单的语言告诉客户：“使用我们的产品之后，你能够得到什么样的好处。”人们对梦想的追求，对未来的幻想，是永无止境的。我们都希望自己的未来是光明的、清晰的，但是大部分人是想不清楚的，没有清晰画面。如果你能够给他一个明确、清晰的描绘：“未来你将达到什么样的状态”，威力将是十分巨大！就像我和一诺老师共同创立改变世界商学院，我们也规划了一个蓝图：“致力于帮助中小企业走出困境，打造更多的民族品牌，造就一大批威震全球的企业家队伍”！这是很多中小企业家的梦想。很多人去创业、做老板、经营企业，做了一段时间后，发现梦想很美好，然后现实却很残酷。当初创业时的满腔热情，最后却被现实磨得身心疲惫。这时候，他们最需要的就是找到一种好的商业模式，让自己的企业走出困境，做强做大。这就是改变世界商学院的蓝图。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '你的客户不喜欢现状——他们渴望改变，渴望实现梦想；但是他要改变到什么程度，你需要为他定义清楚。所有的客户都有梦想，但是如果你问他：“你的梦想是什么？”他不一定能说清楚。不信的话，你可以到马路上问过路的人：“你有梦想吗？”“有。”“你能花
    3 分钟时间给我描绘一下梦想吗？”


    事实就是很多人都会讲不清楚，他们无法用语言清楚描绘自己的梦想。所以，你需要帮助他们简单地描绘出梦想，用了我的产品之后，你将达到的理想状态是什么样子的。你需要把清晰的画面带给客户，让他意识到你的产品将给他的生活带来多大的改变。不管你卖的是生活用品、食品，还是教育产品，你的服务都一定会给客户带来改变。你需要列出这些变化，比如客户将得到哪些具体的价值（列举
    5-10 个），他的情感会发生什么样的变化，他的身份会发生什么样的变化……这些都需要你用语言描绘清楚。这非常重要！这种描绘很容易让客户产生共鸣！


    为什么？因为每个人都在思考未来要实现梦想。但是，我们总是想不清楚，总感觉有点模糊，很不全面。如果这时候有人能够用简单的语言告诉你：“你需要的就是这个梦想，'
