- pgno: 68
  md: '# 3、确定品牌的独特使命


    在物质泛滥的今天，你说一个产品他光是好看好用，就能打造出高端品牌吗？那是远远不够的，现在的消费者，他喜欢那些有内涵的东西，他觉得，要让自己花的钱啊，变得更加的有意义，所以，为了在激烈的市场竞争当中，脱颖而出，你的企业首先需要定一个，不惜一切代价去坚持的目标，这就是打造超级品牌
    dog的第一个秘诀，确定品牌的独特使命。


    既然我们知道客户想让自己的消费更加的有意义，咱们就问问自己，激励品牌存在的力量是什么，这背后有什么鼓舞人心的故事呢？当然啦，话说白一点啊，这大多数公司做生意不就为了赚钱吗？这个我认为对也不对，但是一定不能这样说。如果你把公司的宗旨定义成我要赚大钱，你说哪个消费者会买你的帐呢？至少这些有口味，高端的消费者是不会买啊，相反啊，咱们不要老想着挣钱，而是去找到一个更加有意义的目标，就算是这会让公司损失掉一批客户，但是我们做企业必须要从长远来，不是今天卖完一批产品明天就关门了，所以我们就算内疚也得去干！


    在德国有一个叫艾德卡连锁超市，他们的使命是：致力为消费者提供优质食品。而阿里巴巴的品牌使命是：让天下'
  merge: -1
  img_proc: true
- pgno: 69
  md: '没有难做的生意。这些都是跟钱没有关系的。我们再回头想想刚刚那个我要赚大钱！结果人家不挣钱吗？看看现在的马云！当然啊，我们光喊口号，用户是不会相信的，那怎么做，才是给消费者提供优质食品呢？


    更多绝学课程，请加私人微信：A3162209188


    艾德卡他们重新设计了超市的门面，还给员工提供各种培训课程，让他们更加深入的了解艾德卡的产品，然后把艾德卡的形象定位为：这里只提供优质的，有保障的食品！你看，这么一个动作，那些想买便宜货的消费者，那些不想花太多钱的消费者不就损失掉了吗？可能这些消费者在这儿满足不了需求，以后他也不会来了，但是这么一来越来越多的追求质量，注重品质的新客户，就会成为艾德卡的忠实用户了，这一来二去的，他们不光是生意做起来了，品牌形象也会日益突出，成为市场知名的优质食品大品牌！刚刚提到的这个艾德卡的案例，其实已经很清晰的说明了确定品牌独特使命的重要性了。那么，怎么定义和推广我们自己企业的独特使命呢？'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# 两个办法：


    # 第一、坚持一个和社会或者环境相关的责任，


    比如说农夫山泉的品牌使命：我们不生产水，我们只是

    大自然的搬运工。


    # 第二、重新制定一套新的标准。


    比如说：星巴克，他们的使命是激发并孕育人文精神，为此呢，他们开始努力的打造欧式特色的咖啡厅，给他们的产品一些特别的名字，就连星巴克的大小，中杯的这个说法也跟别人不一样，叫法都不同，而这些，都成了星巴克的代名词，让这个品牌在市场上占有一席之地，而这个标准啊，就属于星巴克的。


    我们想想，我们想要打造自己的高端品牌，那他的独特使命是什么呢？比如说我们改变世界商学院的使命是：让人类更文明，更进步，打造一大批威振全球的民族品牌。


    # 做企业必须要从长远规范，并坚持你的使命！'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 4、找到高端和亲民的平衡


    当一个产品进入大众消费市场的时候，经常会出现一个情况，就是变得烂大街了，随处可见，谁都能买，那这么一来呢，这个品牌啊，也就不再特别了。


    我们都知道哈根达斯冰淇淋啊，不过还有一个品牌您可能不知道，他就是美国的第二大冰淇淋制造商，斑杰瑞公司。这个斑杰瑞冰淇淋在很多地方都能买到，但是他依然保持着很酷的形象，怎么做到的呢？这就是打造超级品牌的第二个秘诀：找到专享和亲民之间的平衡！这个平衡点怎么找呢？我们来看看他们是怎么做的。


    首先他们找了一群漂亮时尚，以及这个所谓的成功人士来做广告，这些人呢，其实就是他们的目标客户群，在首先成功的吸引了这个高端群体之后啊，就有更多的人跟风而来，后来的这群人呢，可能不够成功，也不够漂亮，但是他们也选择了斑杰瑞的产品，为什么呢？这就是因为斑杰瑞的广告宣传，让他们觉得我吃了你的产品，那就是和时尚人士，成功人士一样了，我也很时尚了，我很有钱了，这就好像颁奖礼上的明星和粉丝一样，这漂亮亮的明星，走在红毯上，'
  merge: -1
  img_proc: true
- pgno: 72
  md: '而在隔离线的另一边，是长相和气质都比不上明星的大批的粉丝，他们之所以会来颁奖礼的现场，一方面是想沾点明星的光，但是另一方面甚至有一部分群体 rooted
    dreaming 着自己有一天也能走向红地毯（这是我们俗称的 YY 啊，你想想也就算了）。


    所以要打造一个受人欢迎的超级品牌啊，就得在吸引特定群体和普通大众之间找到这个平衡点，另外，这超级品牌吸引客户的方式也很关键，既要微妙，又要有诱惑力。而不是那些强行硬推的广告啊，我们都知道，这些马路上的折扣店，一些大众品牌，都会搞大促销，什么广告牌呀，公告牌呀，商场里头拿大喇叭喊呀，店员拿个拍手在那门口叫卖等等。但你想想，对于超级品牌来说，人家能用这种手段来促销吗？对吧，这么做，不是砸自己的招牌嘛！但是他们也不能不做广告呀，再牛的高端品牌人家也得做广告吧，没错！他们打广告的秘诀就是微妙，这个技巧呢，叫作软营销。


    # 最好的广告形式就是：犹抱琵琶半遮面。'
  merge: -1
