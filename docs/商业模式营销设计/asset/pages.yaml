    Bros的生活经历中没有震撼的经历，你是理解不了“震撼”二字的。同理，在营销中，你的目标客户接触过什么文字，他对什么词语有反应，对什么词语没有反应，这都是有规律可循的。所以，通过选择这些目标客户有反应的字、词，你就能够影响目标客户的思维和情感。再比如“小人”二字，这肯定是带有情感的。任何人想到“小人”二字，都会产生情感的变化，只是大小不同而已。所以，你的文字需要情感化，你要通过语言文字让客户的情感发生变化。文字本身就是一种激发工具。'
