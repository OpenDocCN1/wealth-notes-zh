- pgno: 82
  md: '# 8、合理控制增长速度


    很多人可能不是太理解这一点的意思是什么。我的企业增长不是好事吗？为什么还要慎重呢？我增长了，企业不就做大了呢？想要在现在这激烈的竞争当中生存下来，活下来，公司当然需要增长，但是，是不是咱俩就得这个勒紧裤腰带，去追求增长速度呢？这个不一定啊，超级品牌啊，一开始往往会慢慢的增长，精耕细作的，我们要打好基础，这对以后的长期发展来说，不用说都知道有好处，也有利于产品、使命以及品牌故事的完善，我之前在商业模式顶层设计那本书中曾多次强调：“当你的产品或商业模式设计出来后，首先得小范围测试，如果好，那就大量的复制和推广，如果不好，还可以及时的刹住车，调整过来，这样你的损失会降到最少”。其实呢，控制增长速度的另外一个体现，就是保持品牌的独特性，当中就包括坚持公司的使命。


    有些公司为了维护使命，甚至不惜损失利益，不惜牺牲自己的增长速度，比如说：你公司的品牌使命是生产高端时尚产品，这个时候，一定要注重社会责任感，那就一定不能做一些偷工减料，污染环境这类的事情！千万不要为了利益，而牺牲使命！也许刚开始消费都无法理解你，但是假以时日，'
  merge: -1
  img_proc: true
- pgno: 83
  md: '你的品牌一定能立于行业的巅峰。但是还有一个工作要去做，就是我们这样做了，要让客户明白我们为什么这么去做，为什么我们不要这方面的利益，不愿意去做某些事情，在这个过程当中，公司有可能会损失一部分的销售额，但是这样做的话，让消费者明白了，哦，我们是为了保持环境，为了坚持产品的质量，这样，消费者就知道了，你们公司啊，特别在乎自己的使命，这样一来，反而客户会对你的品牌更加的忠诚，总而言之，随着经济环境的变化，打造高端品牌的重
    点和策略，也发生了改变，想要成为新时代的超级品牌，就需要以企业使命和品牌故事为中心，然后去合理的用好我们 今天课程所说的六大秘诀，来吸引客户，实现增长。


    # 水满则溢，欲速则不达！'
