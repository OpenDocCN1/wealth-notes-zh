- pgno: 27
  md: '# 1、恐惧营销


    害怕吗？那就买吧！可能每个人都有恐惧或者说害怕的东西，比方说怕蝉螂，怕蜘蛛，怕看恐怖电影，怕黑，不敢走夜路，不过这些恐惧啊都比不上担心生命安全受到威胁，所以很多人愿意付出很大的代价去避免这种风险，什么买各种保险啊，还有很多各种保证安全的产品啊，也不管有没有用，反正呢为了自己和家人的人身安全很多人就会疯狂的买买买。


    那为什么会这样呢？问题出在我们的大脑，正常的情况下，大脑会利用前额页做出理性的判断，但是在生命安全遭到威胁的时候，大脑当中负责处理恐惧情绪的区域，也就是杏仁核会被激活，他的反应速度要比前额页快和多，导致我们没有办法去理性思考，最明显的一个例子就是除菌洗手凝胶，每次出现全球性传染病暴发，比方说：流感，人们就会一窝蜂的去买洗手液，像机场，酒店，这些公共场所也会提供，大家这么做啊，无非就是不想得病。但是事实上，并没有证据能证明洗手液能有效抗击空气传播的疾病。最后，唯一得到好处的就是卖这些除菌产品的公司。还记得当年非典时期，全国上下疯抢板蓝根和白醋也是这么回事，其实这些都'
  merge: -1
  img_proc: true
- pgno: 28
  md: '是高手在幕后策划出来的营销模式！


    还是那句话：“防不胜防啊”！有一家安防公司，他们的广告收视率一直很高，里面的都是一些这样的镜头，一个二十几岁的单身女子正准备在家练瑜伽，突然听到外面传来一阵可疑的声音，一个十几岁的女孩子晚上独自在家，深夜突然听到楼下大门有开锁的声音。一位母亲忙着在厨房准备晚餐，孩子们在院子里面玩耍，镜头里出现一个行迹可疑的男子正在盯着孩子看，听听，这些是不是都挺让人害怕的？其实这就是广告想要的效果，通过这些广告画面，把你带入情景之中，然后这家安防公司的报警器的销量暴涨。


    利用恐惧营销还有一个长用的方法，就是先让你绝望，然后再推一个产品给你，让你看到希望，就像在绝境之中的到了一根救命的稻草。在唯心老师的正式课中有一节叫做思想病毒的植入法，就是通过一些巧妙的话术让你在不知不觉之中感到绝望，然后进入设计好的拯救计划，一诺老师正式课中也有讲到类似的案例，就是用几百上千倍的显微镜来放大你脸上的毛孔，让你看到你的皮肤问题多么的严重，从而让你立即做出改变。因为不实在是太他妈恐怖了！比如某著名的止痛药的广告里面，著名的滑冰运动员得了关节炎，观'
