- pgno: 128
  md: '并不 知道那些积极买他产品的客户有多少个？然后每年买几次？每次金额是多少？那假设你是知道的，现在你要发展你的业务，变成了一年是400万人民币，肯定你有一些其他的改变。不然的话，你现在所有的部分要增加10倍，从40万变成400万。


    比如说一个客户他每年购买的数量翻一倍，就是他一年买四次，你这样就可以大大的增加你的销售收入，也就是达成你这个增长目标的时间、精力可以降低90%，但你要知道前面讲的，你现在的客户是多少？他每次购买产品花多少钱？一年他买几次？然后你要搞定一个客户平均需要找多少的潜在客户？所有这些东西你要知道，就是所谓了解你目前的现状。就好比我现在不知道你在那里，你说你要去北京，然后人家问你你现在在哪里呢？你说你不知道。即使你知道你要到哪里去，你不知道在哪里的话，你也不知道怎么走。所以这就是我要表达的意思。我们都说业务要增长，利润要提高！但是你要不知道你现在的处境，现在的状况是什么，你都搞不清楚。所以你一定要对你现在做的活动进行评测。我知道你是非常希望提高利润的，对吧？总之，你要知道你要去哪里？你现在在哪里？'
  merge: -1
