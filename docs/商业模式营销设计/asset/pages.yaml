  md: '立刻显示出袜部的弹力，为了加强卖点的震撼效果，还举办了两辆摩托车用裤子拔河的表演，拍成视频，在顾客进店之后播放给他们看，视频演示和亲自参与，就轻松虏获了顾客心！


