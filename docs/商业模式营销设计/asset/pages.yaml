  md: '购买6张套券，至少就是消费6次，加上开始收回的2元，总共能收回74元，每份快餐的成本是6元。消费6次加上前面2次，一共8次，总计48元，最后净赚26元，1000个顾客，8次可以净赚26000元，而顾客的终身消费绝对不止8次，今后继续原价12元订餐的比例将非常高。


    我们再回过头分析隐藏在其中的智慧：


