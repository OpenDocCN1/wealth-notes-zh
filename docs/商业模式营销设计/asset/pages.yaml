  md: '接受。为什么呢？因为这次成交其实等于做了一次广告，等于是增加了一个见证人。这就是为什么有一些商场刚开始营业的时候，为了增加更多的顾客，它会运用一些优惠策略。某百货公司曾经做过买
    800 送 400 的活动，还有买 500 送 300。他们愿意这样做，是因为可以让更多的顾客走进来。实际上做这些活动时他们的收支还是可以平衡的。虽然没能赚到钱。可现在这些人以后会成为公司的顾客，他们会渐渐习惯到这里来购买东西。他买的东西中某些有优惠，某些没有优惠，两者之间就打平了。百货公司还是没有赔本的。有些公司开张的时候会到路上btddd发广告。例如一个美容美发沙龙会去街上先发给路人一个牌子，说：“你到我们公司可以免费做一次脸部护理。”但是其实这个路人去了以后。免费做完了脸部护理可能就想做一下身体护理，也可能想要买一些化妆品。所以虽然某些部分是免费的，但其实这个顾客会为你带来其他的利润。因此即使目前只能做到收支平衡，你也要接受这个顾客。以后再去考虑利润的问题。


    # 3、给顾客一个原价退款的无风险保证


    你是不是真的对自己的产品很有信心？如果你认为自己的东西是最好的，那为什么不敢作出这样的承诺？你要对顾'
