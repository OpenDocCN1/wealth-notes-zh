- pgno: 173
  md: '# 一、换算客户的终身价值


    之前在《商业模式·顶层设计》书籍中有提及过换算客户的终身价值，在本章节将进一步作出详细解析。一般而言，你要获得一个新客户是非常难、非常慢，也是非常贵的，我们知道获得一个新客户，他们可能会购买
    5 到 10 次你的产品，这样的话如果您能够知道他们会来不断的购买你的产品，你可以策略的给他们一些折扣，给他们充分的激励，让他们继续来购买。


    有一个朋友成功的案例，他们是卖一款治疗关节炎的药，这家公司的一罐药 30 元，他们的成本大概只有 4.5 元，每次交易的钱虽然很少，但是我们分析了人们的购买习惯，发现如果有
    10 个人花 30 元购买了这罐药，那么有 5 个人他们会一辈子每个月购买一罐。那么我们算一下，5 个人乘以 12 罐，乘以 30 元，乘以一辈子，他们会带来多少的销售收入？那么我们发现
    5 个人每个月购买这药，其中有 3 个人会购买其他的产品，这样一来，我们就可以算出来用在销售或市场营销这个费用，我们应该投多少。


    如果我们知道前期的投入可以带来不断的、重复的价值，那么你要舍得投入，当然这个投入建立在你分析之后，你知道后期可以给你带来多少的销售额。这样一算，你就敢把前期
    6 个月的'
  merge: -1
  img_proc: true
- pgno: 174
  md: '收入作为营销投入，因为你知道这样一来，以后会收回这些投资。而他就进行了这个投资，获得了巨大的收入。尽管一开始我们会有一定的亏损，但是只要我们能够处理好前期6个月的负的现金支出，撑过这段时间的话，后面会持续不断的重复购买，那些支出会很快收回。


    还有一个客户在广州，他们做的是某品牌运动鞋，他们当时有6个销售人员，当时他们的利润率是非常低的，刚刚是保本而已，那么他们来找我的时候，当然是没有钱，他们没有办法赚到更多钱。


    我说那这么办吧，首先算一下你的一个客户他这一辈会给你带来多少价值、多少好处？也就是说我们来算一下，如果有一个人买你的产品，比如说，第一年他买你一次产品，以后会继续买你更多的产品，那么在整个交易的过程当中，假如一辈子他是你的客户的话，他会给你达成多少金额的交易？为什么我们要来这样计算呢？因为这样你会知道准客户的终身价值是多少，而有的客户你就没有必要在他身上花血本，对吧？所以就给了他们这个公式，他们去计算回来后，就告诉我数据的结果。他说平均来说，第一次买的可以带来200元的利润，通常来买他产品的人呢，一年会来买两至三次，这样的话，一次是200元利润，一般来讲，'
  merge: -1
  img_proc: true
- pgno: 175
  md: '他们会连续买3到5年。如果一个客户一次给他们带来200元的利润，那么一年是3次，乘上3年一共是200乘以3乘以5，总利润是3000，对吧！他们给销售代表的佣金是利润的10%，比如说有客户到公司来买，销售人员拿20元提成。然后我问他：你的销售代表在过去给你带来多少新客户呢？他们说很少，我说就是因为没有精神上的激励。我分析了他们客户的长期终身价值，还有客户带来的边际收益。然后给这家公司出谋划策：你就跟你的销售人员这样说，如果每年你能够保留你原来的收益，比如给公司的利润是15000元，如果你能够带来新客户的话，那么新客户给公司带来的第一次利润呢，100%的提成给你销售人员。他们当然是大吃一惊，大出血的样子，说那我怎么赚钱呢？我告诉他，你想那这是第一次，以后这个客户还会给你带来利润，所以第一次你就把这个佣金给了销售人员，销售人员的积极性就大大提高了，这样他会再给你找客户，那么这个新客户成为老客户以后各年的利润都是公司的了，这样一来他的利润在短短一年之就翻了五倍。


    在这里我说是以保本的价格来获得新客户，你想你获取利润总是要投资的，要么是做广告，要么是做营销。如果 你把第一次交易的利润给你的销售人员，把它作为是获得这个客户的营销投资，这样你就赚他所谓后续的钱。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '还有一种，就是你第一次交易用很低的价格达成。那也就是说说把你本来赚到的利润作为一种投资，投资一件和客户长久的关系。


    我们刚刚起家的时候，也不是有很多的钱；那么我们在网络、电视做的这些广告，往往也采用这个方法，就是让这个销售人员拥有第一次所有交易的利润，然后我们赚后期的钱。


    比如有的推出会员卡也是一样的，他可能第一次给你做交易的时候，根本是不赚钱的，但是他靠什么盈利呢？靠你的回头客，以后重复购买的时候他就会赚钱。那么你怎么知道第一次你可以牺牲多少利润，来留住这个客户？你首先要知道这个客户跟你站在一起，所谓终身价值是多少，给你带来多少钱。这样你才能知道投资多少利润，来赢得一个新客户。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 二、如何利用人性


    对于沟通过程，不管是广告，销售信，传单或建议书，你越研究就越发现，成功的交际行为都利用了人类行为的特性。你越意识到这些常识，人的基本品质，你的沟通就会变得愈加的效果卓著。


    # 1. 人们会听从自信的领导


    从商务上讲，人们会支持那些他们看作领袖的公司。有意的是，这些形象可以是真实的，也可仅仅是形成的一种认知，这对你的意义就是，如果你在某一方面造诣颇深，那就要确保自己让别人了解你的学问，要经常做提升自我形象的事情。


    # 2. 人们集体行动中有趋同性


    所谓“乐队车”现象。沟通时可以运用，这是一个可以推动你事业的有效市场工具。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 3. 对有期限压力的任务，人的回应最佳


    1/10 的销售信，50 个广告中，有一个广告的可以收到较好的反应。所以，加上一个真实的期限和一个真实的理由，就能大大提升人的回应率。


    # 4. 人比较容易失去自我身份感


    流动性不断地让人忘掉过去的兴趣，面对新的事物可能产生新的兴趣。这是一个好的商机。如果仅有你一家公司给人写信，或者谨说：你欣赏他们，你会赢得极大的忠心。有趣的是，我们的客户(零售，公司对公司或一些事务所)已经利用过这一机会，起初，几乎没人对他们的信有回应。但是，那些长期进行的销售活动中，这一树立忠诚度的活动是卓有成效的。


    # 5. 人的注意是有不完全的


    你也明白，人都是如此，我们专注于自己的状况，但是，想到别人也这样，我们会惭愧。不只要他们注意我们，更要对我们拥有的兴奋。但事实上，他们被自己的生活分散了注意力，他们不会理会我们，直至我们把这些说明可给他们带来什么。'
  merge: -1
  img_proc: true
- pgno: 179
  md: '有什么对我有用的？你得引起他们的注意，努力保持他们的注意，听从老讲道者的建议：告诉他们你要告诉他们什么，告诉他们要说的内容，再重申告诉他们的内容。


    # 6. 人喜欢浏览不爱阅读


    很多人不善阅读，或懒于读书，所以信息要短而宜人。当然，不是说，短的一定比长的好，意思是说，如果一个词能达到目的，就不要多写。如果你要纸上营销，就要比把出售的信息放在赠券的信封里，费更长的篇幅，更充分的论证。有力量的标题，引言段，短词句是吸引人浏览的关键，然后再吸引他们读下去。


    # 7. 人怀疑完美


    简言之，对准客户，要告诉你所有优点和成就，也要讲自己的弱点，这种坦诚的方法能为你赢得很多朋友和更多的销售量。'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 8. 人对普遍性有认同感


    很多人期待有人领导，被人指引，喜欢跟随。而且，人认同寓言，见证，例子，过去的案例。这不是操控，这是说服别人的艺术所在。


    # 9. 人喜欢知道常规和易行的公式


    想想是不是这样。比如说：经常有人告诉我们做事情的公式，5 点计划，3 个容易的步骤，4 个重要因素等。人们不愿做决定，希望有人帮他们做决定。我猜他们希望有些惊奇的东西。


    # 10. 很多人热衷于权利


    人抵制做决定是因为做决定会使人失去高高在上的感觉。所以，关键是强调购买之后会有这种感觉。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 三、消除顾客的购买障碍


    通过向潜在顾客承诺从你这里购买的所有东西都有保障，以此来逆转风险是消除“客户顾虑”的一种非常好的方法。然而有相当一部分小型企业主和专业人士不愿承担全部一有时甚至是部分交易风险。这正事目光短浅的表现。这对于客户来说不公平。我们可以这样考虑：如果商家对其所销售的产品与服务考虑不周，那顾客又凭什么购买他的产品呢？影响销售成功的最大的障碍就是：购买人担心有风险。如果你能消除潜在客户这种担心，那么你就可以成功销售（在唯心老师的成交心法一书中有详细步骤）。


    利用风险逆转来确保购买，这是什么意思？我们来解释一下，对以一个公司、一个供应商或者企业来说，你一定要确保新客户跟你打交道做生意时非常容易的，那么你就要让他放心。


    如果销售时你不愿意提供退款保证，那么，你一旦了解了以下几点，就会马上改变你的做法：


    +   1. 大多数人并不会因为你有退款保证就真正要你退款，哪怕他们对产品非常不满意。'
  merge: -1
  img_proc: true
- pgno: 182
  md: '2. 与消除风险而带来的销售额增长相比，任何退款都是微不足道的。


    3. 美国的法律有一项相关规定：如果在 30 天内顾客对产品不满意，卖方有义务退款。许多国家也有类似的法律规定。


    4. 如果产品或服务真正是物超所值的。从原则上讲很少有客户会要求退款，因为他们买到产品后高兴还来不及呢！


    在消除顾客的心理障碍方面，其策略要具有灵活性。如果能够消除客户与你做交易的担心，你就会有稳定的客户资源。


    5. 你要管理好预期，你不能漫天的让他们感觉这个预期非常的高。你根本达不到的话，你肯定是注定要失败的。


    6. 你一定要在承诺之前，这个风险要很好的做评量，不能盲目的承担风险。也就是在你做出很大的承诺担保之前，我建议你在小范围内做下测试，来看一下你的成果会增加多少，也就是到时候会有多少人要你承诺担保的要你兑现？你的成本会有多高，你不能盲目的来逆转这个风险。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '我们可以看到你这种承诺就是要降低客户跟你打交道的所谓门槛，也就是说，人们来买你的东西他们是承担风险的，那么他们肯定是有担心、有顾虑，那你怎么样能想方设法来排除他们的顾虑，降低他们所承担的风险，这样你就可以比竞争对手做得更好。


    让我们从理论层面过渡到实际操作层面，你要能够随意组合这些具体策略，但也要谨防被它们束缚。如果你想要“消除顾客心里障碍”，但却又不想“保证退款”，那么你可能会马上想到其他风险逆转策略。这种思维方式会把你的竞争对手打得毫无喘息之地，因为他们怎么也想不出，你什么时候变得这么聪明了。


    # 第一种方式：提供全部退款保证


    “如果对我们的产品不能 100%感到满意，可以退货，我们会当场全额退款。”比如，如果你使用了我这个药会长头发，或瘦身 10 公斤，或者晚上可以睡得着觉了等等，你跟客户说如果在
    30 天不见效的话，我全额退款。有的公司提供 30 天的满意保证，如果你在 30 天内用我们的产品，不满意的话，我们全额退款。但是我并不赞成这样的做法，你要保守的来做，可能你的产品不完全能够实现其价值，当然如果你很有自信的话，你的产品确实能够带'
  merge: -1
  img_proc: true
- pgno: 184
  md: '来这样的利益和价值，你就可以这样做。


    这是最常见、最明显的一种策略，之所以常见，是因为它非常有效。但我所认为的“常见”。却是因为它“常见于各种策略”中。事实上，大多数公司并不对此大作宣传，因为他们担心购买者会利用这一点，大肆敲诈他们。而现在你应该清楚，如果你的竞争对手还在担心这一点，那么你就能轻松打败他们。


    # 第二种方式：部分风险逆转


    在中国买方和消费者是参差不齐的，如果我们向客户完全的风险逆转，可能有些风险，我们可以部分风险逆转。


    比如，如果你完成我们的运动课，我们可以书面保证至少减肥15公斤，还会增加20%的肌肉强度，50%的精力，没有任何附加条件。但是同时我也需要你给我写下一个保证书，你会按照我的锻炼计划，每星期来几次、每次锻炼多长时间，你要知道这个锻炼不完全取决于我，而是你本人，假设我的方法很好，你不用的话还是减不了肥。所以在中国要做风险逆转的话，最好让客户也做一定的承诺，这是相互的承诺。实际上很多产品和服务给客户带来的利益是最大的。你会发现客户在使用你这个产品或服务的时候，使用得当的话给他们带来的好处和利益是最大的。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 第三种方式：提供分期付款服务


    “只给 19 元，就马上把产品带回家。”


    如果最初客户只需要付很少一笔钱，那么他们就会认为整体风险也很低。大多数人对首次付款之后的事情并不多做考虑，他们只是认为：“哇，才 19 元呀！”，尽管实际情况是，他们在以后几年每个月都要附上
    19 元。如果对产品有足够自信，你可以把这一策略与返利策略综合运用，客户会觉得这样的购买风险就显得微不足道了。


    # 第四种方式：提供免费试用产品


    “第一件商品免费。”


    药品经销商提供免费试用样品，并不是没有原因的。你可能还记得，在之前的内容中，我们讲过降低客户购买的门槛。如果特价商品完全免费或定价低得可以忽略不计，那么客户在购买时几乎没有任何风险，这样，你就能获得更多的反馈。但是，如果是财务状况不佳的公司或者行销新手，这一策略显然是不合适的。因为这一策略要产生收益要较长的一段时间。但是，对于更有经验、具有抗风险能力强的销售人员以财务状况良好的公司来说，它却是最具功效的行销武器之一。'
  merge: -1
  img_proc: true
- pgno: 186
  md: '第一件产品免费虽然看起来有点划不来，但是，正是这第一次免费将我们的产品展示给了购买者，并且，如果你的产品质量过硬，那么，这次免费也可以让购买者对你产生信赖感，从而一而再、再而三地光顾你。


    # 第五种方式：提供产品的后续服务


    “如果5年内产品有任何问题，我们会24小时上门维修。”如果客户非常担心你提供的产品会出故障，那么这样的保证在某种程度上能够消除顾客的心理障碍。如果客户了解到，一旦产品出现故障，他们只需打个电话，你就会派人上门当场维修好，那么他们就没有后顾之忧了。


    # 第六种方式：提供见效后付款的承诺


    “一开始你不用付钱。如果我为你撰写的广告方案帮助你增加了利润，你只需把增加利润的10%付给我就可以了。”聪明的销售人员运用这种“为结果”付钱的策略，因为他们对自己的能力完全有信心。而这种策略对于客户来说能够彻底消除他们的心理障碍——好，如果他能帮助我增加利润，那么分给他10%的利润也是应该的，否则我就一分钱也不用付给他。'
  merge: -1
  img_proc: true
- pgno: 187
  md: '如果你对所销售产品的效果非常有信心，并能以有效方式进行结果追踪，而且能确保客户值得信赖，那么这一策略相当不错。


    # 第七种方式：提供免费的支持服务


    “通常，我们买了一种产品，但根本不知道它的使用方法，而销售该产品的公司却对我们置之不理，还要让我们付支付服务费用。”


    这一策略对软件公司非常适用。我曾经成功销售过一些软件，所以我知道提供免费支持服务并不总是一种可行的赢利模式，因为要让客户一次性付费太难了，而且你还得数十年如一日地为他们提供支持服务。那么怎么能达到收支平衡呢？如果你的产品装备精良，几乎不需要任何支持服务，那么你可以安全地承担这种风险。


    # 第八种方式：购买之前先试用


    “在 30 天的试用期内，使用我的产品不用支付任何费用。”


    在国外广告文案传奇人物加里·哈尔波特 (Gary Halbert) 看来，这是功效最强大的一个策略，他的原话是：“只有少数人真正敢试用。”他还曾先让客户把支票寄过来，但许诺自己
    30 天内'
  merge: -1
  img_proc: true
- pgno: 188
  md: '不会去兑现，直到客户完全满意产品为止。而实际情况是：在这 30 天内，大多数人都会忘记他们曾经寄出过支票，所以这样做的风险其实比我们想象的要小得多。


    # 第九种方式：对承诺的深入思考


    “3 倍返还”这似乎有点不可思议，但如果你的产品在 99% 的情况下都能有效使用，那么这样的承诺又是怎样一种情况呢？即使你做出这种 3 倍返还的保证，也只有
    1% 的客户可能会要求返还，而其中真正要求你按 3 倍返还的客户却是少之又少。将返还额与你从中获得的收入增长相比，这种 3 倍返还的承诺还是有赚头的。如果客户不会使用该产品，我们还可以上门免费服务！


    当然，你自己必须试用过这个产品，确保其真正能够有效使用，但我敢打赌，真正会向你提出返还要求的客户一定会很少（除非你的产品确实很难安装）。即使对于通常很难安装的产品，这一承诺也会有效，但你必须为产品附带上简单易懂的安装指南或步骤说明书。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 第八章 精准客户渠道


    （鱼塘）对接篇


    我们都知道：得粉丝者得天下，但如何建立粉丝社群以及有效的互动和变现，通过学习本章（目前通用术语为“鱼塘思维”）可以让你茅塞顿开！'
  merge: -1
  img_proc: true
- pgno: 190
  md: '要想获得真正高质量的客户，绝不能像大部分实体店那样随便乱送礼品，否则吸引过来的全部是占便宜的客户。


    我在课程和《商业模式·顶层设计》书中一直对学员强调，利用买客户思维设计引流产品吸引客户，必须做到“精准投放”。


    为了适应现在市场上通用的名字，所以引入“鱼塘”的概念，也就是接下来，我们会以“鱼塘”的命名代替“精准客户渠道”。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 一、鱼塘前奏


    能够对接到大量精准客户的地方，称之为鱼塘。鱼塘的概念很好理解，但是大多数商家，因为无法描述目标客户的特征，连目标客户是谁都不知道，所以不能对接到精准鱼塘，这也导致了市面上才出现那么多没有针对性的广告投放……


    通过细分定位，找到最有购买能力和最有需求的目标人群，作为撬开市场的切入点，这是对接精准鱼塘的前提！


    比如销售家具，放眼望去，每户人家都有购买需求，不过有需求并不一定会购买，只有结婚或新装修房子的业主才会添置……做记忆力培训的认为每个人都有提升记忆力的需求，但不是所有人都会为提升记忆力而掏钱，只有渴望孩子成绩优异的家长，才会主动关注。


    下面分享两个案例，让你更清晰的理解客户定位在对接精准鱼塘时的重要性：'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 案例：蜂蜜专卖店的精准客流吸引方案


    每个城市都有蜂蜜专卖店，他们总感觉自己的蜂蜜是最棒的，认为每个人都会选择蜂蜜养生，以为所有人都是自己的精准客户。


    当大脑中出现这种错误的认知时，只有两种选择，要么坐等生意，要么漫无目的做广告宣传，王婆卖瓜式的告诉大众，自己的蜂蜜有多好……可惜，这两种做法都不能起到明显的效果。


    正确的思路是：分析出最有需求、最有购买能力的人群作为主打客户，并找到精准鱼塘用引流产品进行对接。


    到底哪类人群才是蜂蜜专卖店的优质客户呢？答案是：孕妇！

    因为喝蜂蜜可以增强免疫力，增强疾病的抵御能力，有效预防怀孕期间的各种疾病；而且能避免怀孕后由于运动量不足引起的便秘、上火，蜂蜜营养丰富，葡萄糖含量高，安神助眠，滋润皮肤、养颜美容；还可以促进胎儿大脑的发育。如果能够把这些价值塑造出来，传递给精准客户，提供大量的权威见证和客户见证，促使他们购买的几率是非常高的。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '如何把目标客户吸引过来呢？分析清楚锁定一个忠实客户所贡献的终身价值，计算出买客户的成本，以此成本打造一款前端体验类引流产品（可以是蜂蜜本身）对接鱼塘让目标客户免费领取，领取时塑造蜂蜜价值，通过设计无法抗拒的成交主张锁定购买。


    从蜂蜜专卖店的启示，我们不难发现，很多店之所以不知道如何对接精准客户，是因为他们认为自己的产品适合所有人，如果你也是这样的思路，建议尽快定位出最有需求和购买能力的人群，否则盲目出击的生意会越做越难。


    # 案例：礼品店产品切割的引流思维


    礼品专卖店有针对不同人群的各种礼品，常规的思维会认为，每个人都有送礼的需求，所以，每个人都是我的目标客户，可惜的是，当你把产品向所有人推销时，就不能做到有效的聚焦，除了在大街上做广告宣传之外，似乎没有其他更好的选择，而这种盲目的宣传，基本上产生不了任何效果。


    正确的思路应该是先选择一类礼品作为市场切入点，获得大量的客户基数，再顺利推出其他产品，或者每一类礼品同时分开'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 找精准鱼塘销售，切忌“一锅煮”式的宣传。


    有一家礼品店打开市场的方式就非常简单，他们采购了一批非常精致漂亮的儿童牙刷（牙刷还配有口哨），阿里巴巴进货才2块钱，但是市场售价至少可以标价到5块，然后对接精准鱼塘，把牙刷领取卡送给孩子的妈妈，持卡可以免费领取4套，这可是非常有诱惑力的引流产品。


    当妈妈持卡过来之后，并不是立刻拿走4套，而是先给一套，余下的每个月领取，这样就顺利获得了跟她们长期联系的机会，并且，在第一次免费领取时，还会推荐儿童牙膏以及其他产品，一部分家长就会购买。


    如果第一个月发2000张卡出去，仅需4000元的成本即可获得2000个客户，通过推荐销售其他产品，成本就收回来了，更重要的是，此时有2000个家庭与礼品店接触，还建立了长期联系的机会，后续推荐购买其他礼品和做转介绍就会变得非常简单。


    这就是告别实验宣传，先切割某个特定目标人群，从而带动其他产品销售的思路，所以，再次强调，如果你的产品有很多，一定要找出主打人群和产品切入市场，切忌盲目推广。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 二、鱼塘途径一组织单位


    我们想要的客户，除了购买我们的产品和服务来满足需求之外，他们还需要到其他地方消费，拥有自己的生活、朋友圈及获取信息的渠道，所以，在寻找客户的时候，完全没有必要大海捞针般的在大街上广撒网；只需要找到拥有我们目标客户的鱼塘（也就是他们消费、生活、交际以及获取信息的地方）合作，达成一个共赢的模式即可，这才是最快、最省力的方式！


    虽然很多人的大脑中早就有鱼塘的概念，但往往在对接鱼塘的时候总是显得比较迷茫，他们不知道如何找到精准鱼塘，更不知道找谁对接，接下来分享 6 种鱼塘选择途径供你参考，让你看到更多寻找鱼塘的思考角度。


    +   1、组织单位 2、媒体网络 3、互补商家 4、竞争对手 5、老客户 6、商圈展会


    摄影家协会、太极拳协会、自行车俱乐部等，这些属于组织，学校、医院、政府等属于机构单位，完全可以通过这些地方找到想要的精准目标客户。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 案例：不为人知的保洁业务开发渠道


    我曾经帮一个保洁公司老板毕总做个一个策划，运了很多策略拓展业务，其中，通过太极拳协会这个组织鱼塘，拿下了很多保洁订单。


    太极拳协会都是哪些人群构成的呢？有领导干部（退休和没退休的都有），有40-60岁左右的生意人，还有家庭条件比较好的大爷、大妈，不难发现，这些人全部都是保洁公司的精准客户，他们手上有闲钱，有需求的时候一般都会雇佣保洁人员。


    知道了鱼塘，就必须跟鱼塘的塘主认识。所以，我们先找到一个片区，跟这个片区的太极拳大师认识，并拜师学习，还交钱加入了太极拳协会，为什么要跟这位大师搞好关系呢？因为他威望很高，很多协会会员都是他的学生，通过他就能够对接到其他人。


    跟塘主建立信任之后，为了跟其他会员接触，并跟塘主建立共赢的关系，我们拿DV机鼓动大师在镜头前打拳和讲解，花了一个星期，录制了一套拳术教程，由我们义务刻录出100多个光盘，以他的名义免费送给协会其他成员。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '他们本来就知道我们是这位太极拳大师的徒弟，如今还给他们免费送光盘，所以赢得了他们的好感，此时，我就顺势把名片递给他们，希望得到他们的关照，通过这样一个简单的举动，最终得到了什么好处呢？


    我要告诉你的是，我们获得了大量的家庭保洁业务，他们身边的亲戚朋友也会推荐给我们，并且，几个银行的保洁业务也都交给我们全权负责！


    为什么还能承接到银行的保洁业务呢？因为，在这个片区有两个协会会员是以前的银行行长，按辈分来说现在是我们的师兄，虽然已经退出二线，但推荐保洁业务的面子还是有的……后来更多单位上的业务也接踵而来。


    其实，找到某个组织对接，并运用与诸主利益共赢的方式，比花钱送礼搞关系，陪酒吃饭做人情，效果要好千百倍。'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# 三、鱼塘途径—媒体和网络


    目标顾客经常聚集和关注的媒体、网络平台，也是非常不错的鱼塘，比如，报纸、杂志、百度竞价、网盟、论坛门户、QQ群、微信朋友圈等。


    做婚庆的商家，可以选择百度做区域竞价，假如成交一单的利润是2000元，百度竞价点击一次的投入是1元，那么，点击两千次成交1单就不亏，成交2单就赚了，其实投放百度竞价，就是买客户思维的演变。


    也可以找到相关论坛、杂志投放引流广告，通过测试，计算出投入产出比，如果每投入1000元就能获得超过1000元以上的收益，便可继续优化、放大投放，这也是买客户思维的做法。


    # 案例：服装店狂赚钞票的运作策略


    肥姐服饰坐落在某县城非常偏僻的街道上，整条街还有很多铺面没有租出去，路人都很少能看到几个，店面装修非常简陋，服饰摆放也没有章法，并且，从来不做任何宣传……'
  merge: -1
  img_proc: true
- pgno: 199
  md: '像这样一家小店，生意状况会是什么样子的呢？按常规的逻辑，应该是没有几个人光顾，对吧！


    但我要告诉你的是，就这样一家“烂店”，一年可以轻松赚到20几万，对于大生意来说这个数目不算什么，但是，对于很多奢华装饰且不赚钱的店来说，简直是一个奇迹！要想卖货，必须有人光顾，可是街道既没有人气，也不做广告宣传，到底通过什么方式经营的呢？很简单，所有的客户都是通过当地QQ群开发的，且听我一一道来。肥姐加入了当地很多QQ群（商家群、交友群），这些群聚集的都是经济条件比较宽裕的中小店铺老板和单位公务员。


    她在群里非常活跃，所以大家都认识她，平时也会经常参加每个群组织的AA制聚会，没特殊情况，可以说每场必到，在聚会时，她会主动跟每个人打招呼，并留下联系电话，一年下来，累积了好几百的人脉圈子，而且，还会经常跟这些人QQ私聊，以兄弟姐妹相称，感情维护得非常好。


    为了让这些兄弟姐妹平时到店里坐坐，她会经常从老家带一些特产过来邀请大家品尝，有时还会送一些给他们带回家（就拿橘子来说，从农村拉几百斤橘子的成本也就几百块钱，每人送一'
  merge: -1
  img_proc: true
- pgno: 200
  md: '小袋五六个橘子），由于这种情感的付出，生意很快做开了，转介绍也越来越多。


    当然，如果仅仅只是搞人际关系，别人不一定会找她买衣服，这里还要说到她对服饰搭配很有研究的特长，她会告诉你怎么看衣服的材料、教你如何搭配更显气质，并且，这些衣服全部是外贸出口的高价衣服，她会跟你说，是有特殊渠道才弄到手的，如此一来，锁定了大量的忠实客户。


    每次订货之前都会发几个图片样品给你看，并隆重介绍一番，接受提前预定，你能想象的到吗？就这么一家不起眼的店能够做到此等程度，正是借助互联网鱼塘，建立圈子培养情感，再加上优质产品和专业程度所带来的结果。'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 四、鱼塘途径一互补商家


    不同行业，却拥有同样目标客户的商家，我们称之为互补商家，比如，少儿英语点读机的互补商家是幼儿园，墙面高端涂料的互补商家是装修公司，瑜伽馆的互补商家是中高端女装、女包、理发店、汽车美容店、高端会所等，跟这些互补商家共赢合作是吸引客流非常高效的方式。


    # 案例：理发店打造自动化赚钱系统


    这是一家开业不久的理发店，100 平米左右，装修档次还算不错，此次老板从外地深造回来雇佣了十几个员工准备大干一场。


    为了快速提升影响力和客流量，大家胸有成竹的忙活起来，促销宣传单轮番轰炸，上各大团购网低价引流，就等着店里人气瞬间引爆，可惜近半个月过去了，店内冷清的程度让老板有些无助，偶尔也会过来一些低价理发的，但很难促销其他的服务。


    于是理发店的老板在认识了我之后，就像是抓住了一根救命稻草，一定要我她帮忙出出主意。'
  merge: -1
  img_proc: true
- pgno: 202
  md: '出于老板的热情，我答应了他的请求，并开始做深入的调查了解，第二天就给了他一套运作思路，没想到就是这样一套简单的方法，让他们的业绩立刻增长了40多倍，从100多元每天的收入，不到一周的时间直接提升到4000元左右每天，而且持续上升。更多绝学课程，请加私人微信：A3162209188


    # 具体操作仅仅两步：


    +   1、 包装2款免费引流产品，分别是市场价168元的【理发+烫发】和店长亲自服务的市场价368元的【理发+烫发+染发】；


    +   2、 找到互补商家作为引流的鱼塘，分别是：发饰店、流行美盘发、4S店等，把两款引流产品免费提供给他们当做促销的赠品，168元的服务直接赠送，368元的服务提供每天限1位的抽奖。


    虽然后来理发店店长对我佩服无比，但在刚开始提出上面两个步骤时，她是坚决反对的，因为她认为，通过团购低价吸引过来的都赚不到钱，现在居然大胆免费提供，简直是天方夜谭，为此还跟店老板发生了争执，由于店老板的强烈要求，还是把这个方案执行了下去，才有了前面看到的结果。'
  merge: -1
  img_proc: true
- pgno: 203
  md: '后来店长还是想不明白，为何免费比低价的威力要大这么多，直到我分析完4点之后，她才豁然开朗。


    +   1、团购和传单折扣吸引过来的并不是目标客户，这群人基本上都是以占便宜的屌丝为主，哪里便宜去哪里，同时，他们的消费能力有限，不管你的促销力度有多强，也很难从他们身上甩出更多的钱，这就是为什么团购虽然吸引了很多

    人，但业绩并不能提升的根本原因。


    2、我们需要的目标客户具备2个特点，1、拥有一定的消费能力的女性，2、头发一定要长；如果不能同时具备2点，至少要具备第1点。到哪里才能找到这些人群呢？千万不能在大街随便宣传，否则吸引过来的大多数都达不到理想的标准，所以我们选择与互补商家合作，因为我们想要的客户，她们还需要在其他地方消费，早已经是别人的客户了，只要跟他们合作，用我们的理发卡免费帮他们促销与成交，他们会拼命的赠送，还会主动塑造价值。


    3、更重要的是，顾客到互补商家消费了，才得到的免费理发卡，此时，会把对互补商家的信任转嫁给我们，并认可到理发卡的价值，此时，来我们这边享受服务，就成了理'
  merge: -1
  img_proc: true
- pgno: 204
  md: '所当然的事情。


    4、 虽然是 168 元的服务，但成本仅需 20 元左右，你有没有发现，烫发的时候推荐染发是很容易成交的，一次染发随便都能收到 160 元，如果还做一下头发，收费几百元更不在话下。


    用买客户思维计算，你就会明白，进店 8 个，成交 1 个染发就不会赔钱，成交 2 个就赚了，而现在的成交比例是 60% 左右，也就是进店 8 个能够成交 4-5
    个，是不是赚大了，后续办卡或是持续消费的全部都是净赚的。这就是为何免费送比团购低价卖，效果要好 N 倍的原因，关键是通过跟互补商家的对接，找对了有消费能力的精准客户！在找互补商家合作的时候，并非只能跟店老板达成合作关系，有的时候他们能够对接到市场的员工，也是非常不错的选择。


    # 案例：让别人的业务员帮你拿订单的巧妙计谋


    如果你是经营建材类生意的，可以找到很多互补商家的业务员跟他们合作，把引流卡给他们，让他们送给自己手上的客户，只要客户来你店里领了礼品，业务员就可以得到 20
    元，如果在领'
  merge: -1
  img_proc: true
- pgno: 205
  md: '礼品之后成交了，还给他一定比例的佣金。这样的政策对于互补商家的业务员来说，是非常有吸引力的，他不需要帮你沟通介绍，只要送礼就行了，不但回馈了自己的客户，还能赚到外快，而对于你来说，不但省去了业务员的工资成本，还对接到了大量的目标客户。有一家房产中介公司，为了获得更多优质的房源，请了很多业务员通过各个渠道找房屋信息，但效果很一般，后来找到物业，希望跟各个小区的物业合作，让物业帮忙推荐房源，但物业公司并不感兴趣。


    后来直接每月发200元的补助，买通物业公司的保安，让保安帮他们收集房源信息，并承诺后续还会给一定比例的佣金提成，一下子就火了。据说后来已经跟500多个保安建立了合作关系，每月仅10万的补助却创造了一年三千多万的业绩，比请业务员的效率高出了N倍。


    为什么保安愿意合作呢？我们都知道，小区保安的工资并不高，200元的补助对于他们来说，可是一笔不小的收入，何况成交一套房子还可以分到钱，利益的诱惑就很容易驱使他们行动，更重要的是，这种弱势群体在受到优待之后，会更加珍惜这种赚钱的机会，何况，小区的房源信息本来就是一个近水楼台先得月的买卖。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 五、鱼塘途径—竞争对手


    当你看到“竞争对手”4个字的时候，或许会大吃一惊，竞争对手会愿意把客户介绍给我吗？你的惊讶我能够理解，但是对于商业顶层设计的高手们来说，从竞争对手那里获取客源是见怪不怪的事情了。


    获取竞争对手的客户，一般有两种方式，第一种是“合作”，第二种是“劫流”，下面分别给你剖析。


    # 1、合作


    竞争对手没能成交的客户，对于他们来说就是闲置资源，要知道，当初为了吸引这些客户，他们可是投入了大量的人力物力，如果不能有效利用变现，等于是eya种浪费，还不如提供信息跟同行合作，成交之后，大家一起分钱皆大欢喜。


    # 案例  保洁公司与竞争对手的联盟


    我们做保洁公司的时候，虽然同行之间竞争激烈，但业务合作方面却是非常密切的。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '比如，新开茶楼的整体拓荒工程邀请竞争对手现场报价，如果没能谈成，竞争对手就会打电话联系我们，把具体情况汇报一遍，并告知我们电话和地址，我们便主动出击。


    由于竞争对手提供了信息，我们对茶楼的底价以及一些需求就会比较了解，提前做好应对策略，这样拿单的几率就会更高，最后跟竞争对手分成即可，大家皆大欢喜。


    我们一般会同时找到另外两家同行合作，独立跟他们彼此提供信息或推荐业务，比较繁忙的时候，我们会把业务先谈下来给同行做，抽成即可，同样，同行在人手不够的情况下，也会给我们业务做，这样就能确保任何订单都不会丢掉。


    很多小的房屋中介公司跟保洁公司的联盟一样，他们也会彼此共享房源和客源，如果客户来了没有满意的房子，他们会打电话给竞争对手说“我这里有一个朋友，需要找一套房子，你们那里有没有？有的话我现在把他推荐过来”，最后成交了分钱即可。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 2、劫流


    劫流就是直接“打劫”同行的客流，在外界看来是比较阴险的手段，不过商场如战场，只要不触犯法律，不损害客户利益，就可以操作执行，劫流策略只要执行到位，是将非常厉害的，吸引的全部是精准客户。


    # 案例：电动车店的自动化客流引爆模式


    有一家新开的电动车专卖店，由于地理位置比较偏，没有在电动车销售集中的市场，所以业绩一直不理想，投了上万元的DM广告费，结果才卖出去了3辆车，一直处于亏损状态。


    经过我不到20分钟的指导彻底解除了他的困惑，并实现了自动化客户倍增，下面是咨询对话全过程。


    我：你说现在最缺的是客源，我想确认一下，你的成交率有多高？电动车老板：我自己本身是电动车维修出身，并且算是电动车发烧友，不管是电动车的性能调试把控，还是电动车改装，我都能一并解决，只要是购买电动车的准客户，60%的成交率是完全没有问题的！'
  merge: -1
  img_proc: true
- pgno: 209
  md: '我：成交率非常高呀！不过这是你估算出来的比例，真正成交还得看你的真功夫哦，平均一台电动车销售出去，你的利润是多少？


    电动车老板：我的电动车都属于比较高端的，有的利润高一点，有的低一点，如果平均来算的话，一台利润在1000元左右应该是没问题的！


    我：如果进来50个精准顾客，有没有把握成交一个？


    电动车老板：你也太小看我了吧！进来50个连一个都不能成交，这生意直接关门算了，我敢保证如果都是有购买需求的，进店50个，成交一半绝对没问题，现在就是不知道怎么找客户，我都快愁死了！


    我：那你这个生意就太简单啦！运用买客户思维，用20元的成本吸引一个目标客户进店，每进来50个，成交1个就不亏，成交2个你就赚了，按照你所说的成交比例，岂不赚大啦！现在你要思考的是，20元的成本转换成什么样的高诱惑，且关联度强的产品来吸引顾客进店了！'
  merge: -1
  img_proc: true
- pgno: 210
  md: '电动车老板：20 元的成本？我我想……哦，对了，我这款半盖式头盔，成本就是 20 元进货价，市场标价 80 元，这个应该还是有吸引力的，而且与我的电动车直接挂钩，可是我怎么知道谁是我的目标顾客呀？


    我：有一个找精准客户的方法，那就是劫流竞争对手的客户，电动车销售市场知道吧？直接到大门前面的街道上去找客户就行啦！


    电动车老板：如何做？有点不理解。


    我：很简单，印刷一些广告单页，在单页的正面塑造头盔的价值，在背面介绍一下你的优势，找几个头脑灵活一点的业务员，让他们蹲点在电动车市场的各个街道路口。只要发现有意向购买的顾客走出来，在他走出市场之后就直接扑上去说“只要您拿这张单页去我们店里面，就
    𝐠 免费送您这个头盔，保证绝对不做任何胁迫销售的行为，只求获得一次让您了解我们的机会，我们的初衷很简单，与其花大把广告费，还不如如何直接做回馈让您得到好处！”反正就是类似的这种话术！'
