- pgno: 103
  md: '# 3、规划内容：


    虽然你给客户描绘了很好的蓝图，但是从现状到蓝图的这条路怎么走，他不知道，所以你需要给他“导图”。


    我们每一个人都渴望达到一个目标，但是我们常常不知道怎么走。导图的作用就是要告诉我们如何走。比如，很多心理学家都提出了自己的心理学理论，包括弗洛伊德、卡尔·荣格等。在这么多心理学理论当中，最著名也最广为人知的当属马斯洛的“需求层次”。其实与马斯洛一样有贡献的心理学家有很多，但是其中的大多数人，我们甚至都不知道他们的名字，为什么？因为他们没有导图。而马斯洛提出了这个著名的“金字塔”，所以我们记住了他的名字。没有体系的东西是不值钱的！因为客户希望有系统地学习。他不希望今天学一个秘诀，明天学一个秘诀，那样很散乱，没有用。人人们都希望把所学的东西串联起来，形成一个体系，形成一个系统。这样做有两个优点：第一，容易记忆和掌握所有的要点；第二，在运用上可以发挥自己的想象力和创造力。其实导图就是“成功路线图”，它会告诉你：从这里到那里，你需要走几步。所以，同学们对于商业模式课程一定要系统性的进行学习。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '除此以外，导图还有一个很重要的作用。比如你帮客户画了一个导图，如果他相信这个导图，那么说明他是信任你的，所以他更可能购买你的产品。因为导图的作用是潜移默化的，所以它对客户的购买判断有非常重要的影响。导图还有第三个作用，是什么呢？当客户相信你的导图时，接下来他可能会一直问：我已经到哪儿了？我需要具备什么条件才能走下一步？也就是说，根据导图，他可以随时衡量自己的掌握程度——还需要多少努力，还需要多少进步，还需要再往前走多远。


    如果你的导图设计得很巧妙，它就有潜移默化地销售的作用。当然，更妙的是，你所有的产品设计都可以围绕着导图、围绕着蓝图进行。为什么？因为这是你的魔术，这是你的哲学。你所有的产品只是实现你的哲学、实现你的理念的一种手段而已。所以，你的产品设计当然要沿着你的导图，沿着你的路线图进行。比如，有一位女士走进美容店，如果你的第一个想法就是卖产品给她，这是错的！你需要在这位女士决定购买之前，帮她做一个免费测试，这样你就有了判断依据，准确的掌握客户的真实需求。然后，你坐下来告诉这位女士：在未来的
    3 个月、6 个月、12 个月内，她将达到什么样的理想状态。比如，她的皮肤会怎么样，她脸上的'
