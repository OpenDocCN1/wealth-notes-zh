  md: '耐受力，也变得越来越强，这意味着需要更大量的多巴胺，才能获得同样的愉悦感受！结果就是你买的东西越来越多，每次购物都会花掉更多的钱，最后活活把自己买破产也是有可能的。


    产品和购物上瘾，会让人做出不理性的行为，这点商家又怎么会放过？对吧，特别是在这个二马奔腾的年代！所以啊，大家不要再埋怨你老婆败家了，因为这“真的不能怪她”！有些食品或小吃，在设计产品的时候，他们会尽量的融入一些上瘾的配料，比如糖、盐、脂肪等等，不知道你有没有发现，你平时买的巧克力、薯片、曲奇之类的零食，是不是会让你欲罢不能呢？科学家曾对小白鼠做实验，发现高糖高油脂的食物跟毒品的作用方式几乎是一模一样，小白鼠为了获得满足，会越吃越多，更让人震惊的是垃圾食品的成瘾效果比海洛因和可卡因还要高7倍！你没听错，是高7倍！高7倍！高7倍！重要的事情说三遍啊。哎妈，吓到我了，等一会儿我就叫个麦当劳套餐来吃掉压压惊！如果你要说我不吃垃圾食品，总行了吧，没那么简单，就连你觉得无害的产品，一样会让人觉得上瘾，比方说，润唇膏，天气干燥的时候大家会不会也随身带一支呢？一会儿就要涂一次，这说明你可能已经上瘾了，润唇膏里面经常会添加薄荷醇和食炭酸，薄'
