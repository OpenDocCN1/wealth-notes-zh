- pgno: 62
  md: '# 1、高端品牌营销已经进入了新的变革


    人们都说现在全球经济环境有大的改变，既然经济环境变了，做生意的策略也跟过去不一样了，所以在开始自己的企业之前一定要先进行商业模式顶层设计。那么现在，我们想要打造自己的高端品牌，首先们得要知道这些变化，我们就来说说具体都有那些变化。


    首先高价策略的营销效果已经大不如以前了，什么意思呢？以前高端品牌他们可以通过夸张的价格让自己脱颖而出，就是卖得贵，定价足够高，品牌够奢侈，这个产品呢，就会成为身份和地位的象征。别人拿着出去用，都感觉很有面子，我有钱我买得起啊。但是现在啊，这消费高档品，变得越来越大众化了，买奢侈品不再是土豪的专利了，我们前面说的例子，现在的些女孩就算收入不算特别高，宁愿省吃捡用几个月去省钱，而后花几万块去买个包包，我们看看现在大街上这
    LV 包包，是不是都快烂大街了，到处都是，而且就算原价买不起，但在网上还时不时有些高端品牌打折的，那也不会放过了。


    而且很多的豪华汽车，有些人买不起，为了面子问题，'
  merge: -1
  img_proc: true
- pgno: 63
  md: '就去租来开。就这样，这些大品牌就丧失了曾经的专享地位！

    还有第二点变化，知识，已经变成了决定社会地位的新力量了。在过去啊决定社会地位是什么呢？有钱、有权、这可能是身份的主导象征，但是在现在这个信息时代啊，越来越多的人开始崇尚智慧、知识，我们知道现在有个词叫“土豪”，你看光有钱，没有知识的人主会被人称为土豪、土大款。有钱有品味的，这才叫精英。在过去被人嘲笑的书呆子们，而现在一个个可都是赚钱的
    IT 大佬，这种趋势说明了什么呢？

    说明品牌，也可以利用知识来提高地位。


    比如说，我们采用一项新技术，这也得有知识才会啊，

    没知识根本就不会，或者说你懂时尚，你可以走在流行潮流的前沿，这一些，都叫精英。再比如说，一个人，他只会用那些死贵死贵的品牌，就会花钱，别的啥也不懂，你去问他你买个这么贵的到底好哪？他也不知道，就是贵他才买的。

    这就叫暴发户。而别一类更加高端的人呢，他们这些群体啊，不光有钱还有品位，现在越来越多的人去追求什么低调的奢华，又低调，又有品位，越来越多有内涵，有故事的品牌，被这些高端人士追捧，因为他们知道，我用这个东西不光显

    得我有钱，还显得我见多识广啊，道理很简单，很多时候只有真正懂行的人，才会明白一个高端品牌的价值所在，贵！'
  merge: -1
  img_proc: true
- pgno: 64
  md: '人家贵得也有道理啊，而且能把贵在哪里给说出来。说一个在生活中很常见的例子，比如说钓鱼，一个有经验的钓鱼的人，他知道哪些品牌的装备专业、好用，所以呢，同样是买贵的，他们就比那些只知道看价钱看品牌，而不知道专业知识的人，显得更加有品位，更加有格调了。这是第二点，还有第三点，道德、诚信对于今天的品牌来说太重要了，现在的消费者，人家不光是看你产品的质量，对你这个产品的生产过程当中，道德要求也更高了，你比如说一个企业污染环境这类的，这些做法非常不可取，分分钟就让您的品牌进了黑名单了啊，别人就全部排斥你，以前呢，穿皮草，那是名媛贵妇的高档消费，但是今天，穿皮草，有些人就在想这个皮草是从哪儿来的？那都是一个个生命没有了，这是捕杀动物的行为啊！所以现在就不再有那么多人对皮草去过于追求了，从上面几点不难发现，今天那些消费者对于高端品牌的心里定义，已经发生了很大的转变，这同时也给一些企业去推广高端品牌，提出了新的挑战。


    特别是在今天的网络时代，信息交流越来越方便了，消费者可以迅速的分享各种品牌的消息，咱门老话不都说嘛，好事不出门，坏事传千里，现在互联网时代下更夸张了，不管你好事还是坏事，绝对不止传千里，分分钟都能传到万里'
  merge: -1
  img_proc: true
- pgno: 65
  md: '之外，这个时候如果公司的不道德行为被曝光出去了，那你过去千辛万苦建立起来的品牌形象，就可能在一夜之间毁于一旦，这样的事我们见得可真不少啊！前些年国内某著名牛奶品牌因三聚氰胺事件被闹得沸沸扬扬，很多消费者就通过社交网络来公开指责，甚至发起抵制活动，给果一下就把他整废了，不过也是他自己作死啊！确实是太过分了，刚刚出生的孩子有什么错，一个良知泯灭、道德丧失的企业，他就不配存在！这种人就应该拉出去直接枪毙。


    所以说，在今天这个互联网的时代，过去的那种打造奢侈品牌的传统打法，已经不太合适了，新时代下的高端品牌就应该是超级品牌，看到现在啊，你们可以还不是很明白，这超级品牌到底是什么意思呢？各位同学，我们继续往下看！


    世界上最富有的人，是为最多的人解决问题的人。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 2、必须自己成一派


    1873 年德国的哲学家尼采提出了一个著名的“超人学说”，什么叫超人呢？它构建了一种理想，而超人人格特别多，总是走在大众前列，有着自成一派的规则和价值观，这就叫超人。而在商业领域当中，这个超人学说也能用上，这个尼采口中的超人正如现在的高端品牌、超级品牌，他们呢，坚持自己定下的原则和理念，绝对不会追求那些，泛泛的，早已经存在的，满大街都有目标去发展。比如做汽车生产的，我要成为市场上速度最快的汽车；或者做餐饮的，我要达到米其林三星的餐厅级别等等；这些啊，其实也没什么毛病，但是我们不觉得这有点俗吗？说白了，想要打造超级品牌就不能按照别人的标准来，而是要自己来另立卓越！


    那什么样的品牌才能算得上是超级品牌呢？


    我们来看看苹果公司的例子：苹果他们的目标，不是说我要做出市面上最先进的产品，我要卖出最贵 Bre手机，而是把科技艺术品融入到人们的日常生活当中，这样的使命其实就是不少企业的发展趋势，有很多的领导者，他们都希望自己能做一些更有意义的事情，而不光是为了挣钱谋利，让股东开心，所以，这些企业不仅是在乎自己的产品，他们也更'
