- pgno: 254
  md: '对方的从众心理，比如，准备一本登记本展示给对方，并说：“您看，今天有好几个跟您一样持卡过来的客户，已经享受了这项超值待遇了！”


    案例：母婴用品店的会员登记本追售锁客策略有一家母婴用品店就把顾客消费记录，打造成了追售锁定会员的工具。


