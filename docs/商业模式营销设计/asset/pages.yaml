  md: '# 二、怀旧营销深度解析


    我们现在都知道热点是最赚流量的，搞品牌营销的大多数人都去追热点 了，最终成就了热点，让热点越来越热，而“我的品牌”掉进海量的所谓的热点中。其实，“热点”营销中的主要力量来自“神经刺激”，如果每次你都能抢先抓到“热点”那还是不错的。但现实情况是，品牌抓的热点，已经基本上已变成了普通“信息”。那“热点”营销还有什么意义？热点对于不能在短时间反应的品牌来说，“热点”营销已死。或许，用人的记忆激活市场的怀旧营销，可能是一个更好的选择，如果近期同学们有看
    CCTV-1 的节目你会发现，越来越多的版面都是体现了“怀旧”的元素，无论节目，还是广告片段。'
