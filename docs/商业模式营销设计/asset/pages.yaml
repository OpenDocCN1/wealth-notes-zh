- pgno: 212
  md: '# 六、鱼塘途径—老客户


    自古有云“物以类聚，人以群分！”，你的老客户身边，就聚集着跟他们有着相同生活条件和属性的人，我们可以利用老客户进行病毒式转介绍，这样每个老客户都是你的小鱼塘。


    老客户推荐过来的人，对你的信任指数是极高的，他们现身说法，塑造产品的价值，能够帮助你减少大量的沟通成本。


    # 案例：净水机的转介绍策略


    张姐在某净水机品牌的推广期间，仅花了 2980 元购买到市场价 3400 元的净水机，活动期结束恢复了原价，张姐庆幸自己早下的决定。


    然而，卖净水机的营销人员再次打电话联系到张姐，并对她说了这样一席话：“张姐，您对我们净水机的功能和服务还满意吧！是这样的，我们活动期已过，净水机恢复了 3400
    元的价格，恭喜您做出了明智的决定，同时我还要报告你一个好消息，我们公司再次决定，对像您这样的老客户给出了一个特别的政策，只要是您推荐朋友过来购买，他们还可以享受到
    2980 元的超值优惠，'
  merge: -1
  img_proc: true
- pgno: 213
  md: '仅限1个名额，如果您需要的话，我马上把优惠代码发送到您的手机，更重要的是，如果您介绍的朋友，在一个星期之内购买的话，您和您的朋友都可以获得我们公司额外赠送的价值500元的超值大礼包”。


    你能感受到吗？当客户已经购买了净水机，并且对功能和服务非常满意，然而，身边的朋友很可能已经错失了机会，现在他手上额外获得了一个名额，可以送给自己的朋友，还有双向礼品刺激，诱惑力是非常大的。


    # 案例：摩托车店的疯狂病毒策略


    我有一个学员陈总，他讲述了自己买摩托车的亲身经历。他购买摩托车付款之后，摩托车店的老板就对他说：“你已经是我们的老客户了，感谢您对本店的支持，今后您可以享受一项特权，这里有一张卡，您可以借给身边需要购车的亲友，持这张卡来可以给他九五折优惠，并且您还能额外获得价值200元的超级礼包，不持卡的话，一律原价没有礼品，这张卡的有效使用期是6个月”。


    陈总告诉我说，当他拿到这张卡，只要听到身边哪个人想买摩托车，神经马上就敏感起来，有时还会主动给身边的朋友说，'
  merge: -1
  img_proc: true
- pgno: 214
  md: '买摩托车的话可以找她，摩托车店的简单策略，让陈总在6个月之内给他们介绍了3个朋友购车。


    如果你也把这个策略运用起来，让老客户源源不断像病毒一样扩散新客户，1个带2个、2个带4个、4个带8个……如此循环下去，根本就不会缺客源。


    子母卡模式，也是策划高手们常用的转介绍策略，如果操作到位，客户基数将瞬间放大。


    子母卡操作方式：通过超值折扣让A客户充值办卡，同时赠送A客户一定数量的“副卡”，这些副卡可以赠送给身边的朋友，朋友（非本店会员）只要持卡过来低价或免费体验了服务，A客户充值的金额就全部返还或抵现金消费。


    # 案例：化妆品店的子母卡病毒模式


    有一个做化妆品兼护肤服务的朋友找到我说：


    “无为老师，我现在想拓展更多的新客户，准备做几期广告，想请教一下广告文案有要如何写，配合做什么样的活动比较好？”'
  merge: -1
  img_proc: true
- pgno: 215
  md: '在交流时得知他有 600 个老客户会员，我立刻否认了他的想法，直接建议他运用子母卡病毒模式，并给他分享了以下想法。


    +   1、 通知老会员，推出一个超值优惠政策，比如，推出 600 元的套餐，只收费 300 元，600 个人不管通过打电话还是发短信，100 个人响应即可。


    +   2、 给这 100 位充值的会员，每人发 5 张副卡，持卡过来可以 3 折享受一次超值服务，这个服务需要依照实际情况包装，并且告诉会员说：“你可以把这
    5 张副卡送给自己的朋友，只要这 5 张副卡都过来体验激活，您今天充值的 300 元就立刻返回给您，可以拿回现金或者直接消费产品。”


    是不是非常简单，100 个老客户只要发动起来，很快就能吸引好几百个进店体验的新客户，更重要的是，子母卡还有三个好处：


    +   1、 虽然给老客户提供了一次超值折扣充值，但并不会赔钱，换个角度理解，相当于请了 100 个业务员帮忙找客户。


    +   2、 赠送的 5 张副卡需要全部体验激活，才能返还 300 元现金，'
  merge: -1
  img_proc: true
- pgno: 216
  md: '很多会员的副卡并不会全部激活，所以现金不一定会全部返还，就算是返还，大多数也不会领取现金，而是选择消费产品，如此一来，吸引一个新客户进店的成本是非常低的。


    3、由于是老客户转介绍，而且又有利益捆绑，新客户的信任指数会很高，后续成交也会变得简单。曾经有家新开的养生馆运用这种模式，一个星期就发展了上千个会员，以老客户作为鱼塘的子母卡不容小视，在此提醒，一定要好好思考如何将这个模式落地到你的生意中。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 七、鱼塘途径—活动展会


    各种类型的活动或展会，都聚集了大量具备某个共性的消费群体，如果属于你业务相关的目标客户群体，一定要利用起来，运用引流产品吸引他们进店，从而跟进销售。


    很多参加活动展会的商家，只有现场促销的概念，如果现场不能完成销售，展会结束，一切都结束了，作为商业顶层设计的学员一定要记住，在展会现场如果不能成交的客户，一定要通过引流产品吸引进店继续跟进销售。


    # 案例：借助建材类展会的蓄客策略


    家居建材类的展会都汇聚了大量的人气，大多都是现场高折扣促销的形式，然而，很多客户在选购产品时，有一个选择周期，有可能需要过一段时间才会有购买的需求，所以，很多参加活动展会的商家连展会的成本都收不回来，他们只考虑到了现场成交，忽视了通过定金锁定，吸引进店之后做跟进销售。


    如果你也参加了这样的活动展会，可以给出这样的主张“您今天只需要缴纳1元的定金，即可获得原价200元的礼品（礼品'
  merge: -1
  img_proc: true
- pgno: 218
  md: '现场展示样品），持这张卡到我们店里可以领取礼品，再详细向您介绍完我们产品的特点后，如果需要我们的产品，这100元可以抵500元使用，并且依然享受展会的价格，如果我们的产品您不满意，绝对不强制推销，您还可以拿回100元的定金，更重要的是，200元的礼品依旧属于您，您没有任何损失！"


    交定金后可以免费进店领取的礼品可以是一套茶具，也可以是电饭锅等，只要是家居刚需类产品就行，这样才能更有交钱的欲望，标价200元的礼品成本控制在100元左右。


    采取这种策略，在目标顾客没有顾虑的情况下进行初步锁定，并获得后续沟通跟进的机会，礼品就算被白领走了也不会赔钱，用买客户思维计算，如果成交一单可以赚2000元，来20个成交一个就不亏，成交2个就赚了。


    其实各个行业都可以这样操作，当然，除了交定金之外，还可以用现场免费送赠品的形式获得更多意向客户的联系方式，为后续跟进销售做好铺垫。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 八、鱼塘的三种利用形式


    当熟悉了鱼塘的原理之后，还必须知道利用鱼塘可以为我们做哪些事情，通过长期的实践发现，在找到精准鱼塘之后，有三种利用形式。


    # 形式 1：引流客户


    前面已经分享了很多在鱼塘投放引流产品实现客源引爆的案例，这就是借力鱼塘所带来的直接价值。


    # 形式 2：植入宣传


    通过利益共赢的模式把自己的广告植入到鱼塘进行品牌宣传。


    比如，高端涂料跟装修公司合作，把艺术涂料电视背景墙免费提供给装修公司，让他们回馈客户，装修公司为了塑造背景墙的价值，增加促销的诱惑点，就可以把高端涂料公司以及电视背景墙宣传出去。'
  merge: -1
  img_proc: true
- pgno: 220
  md: '如果联合几个商家，把彼此提供的引流产品送给物业公司，让他们当做回馈给业主礼品，为了让业主认识到礼品的价值，完全可以把产品以及店面宣传的海报张贴到小区各个楼道，在引流的同时，相当于还免费做了品牌宣传。


    # 形式3：销售渠道


    设计好分配机制及合作方式，可以把鱼塘直接发展成自己的销售渠道。


    比如，在城市中心开的干洗店，想要获得所有小区的干洗业务，只需跟小区附近的超市达成合理的利益分配协议，让超市成为为收衣点，小区的居民都可以把衣服和钱交给超市，然后由中心干洗店统一送取衣物即可。如今很多蛋糕店都铺货到各个社区超市，跟超市分取利润，超市不需要提前进货，只是作为销售渠道售卖蛋糕。


    利用鱼塘作为渠道的运用，很多行业都可以联盟，超市可以销售电影票、酒店可以销售足浴券、KTV可以订酒店房间……只要跟精准鱼塘达成销售分成模式，可以对接大量的地方销售你的产品。'
  merge: -1
  img_proc: true
