  md: 斑点会怎么样，她的发质会怎么样，等等。你需要帮她描绘出这些效果，这是不是她想要的？如果这是她要达到的目标，那我们就一起来制订一个 12 个月的保养计划。然后，你告诉她：第一个月会达到什么样的状态，第二个月会达到什么样的状态，第三个月会达到什么样的状态，以此类推。如果她同意这样的蓝图，同意这样的成功路线图，那就相当于她同意了你的产品购买计划。但是在这个过程中，你并没有刻意销售，你只是在帮她描绘一个成功路线图而已。这就是导图的威力。几乎所有的产品或服务的销售都可以这么做。
