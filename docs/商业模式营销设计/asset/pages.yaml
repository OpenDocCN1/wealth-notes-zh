  md: '众一看，天哪！奥运会滑冰运动员都会得关节炎，我可能也会得，怎么办呢？吃药呗！你该吃药了，因为药不能停啊！还有一个生发产品的广告是这么说的，你的爸爸希望你拥有他从没有过的东西，比如头发，那些步入中年的男性一听，哎！我这几年发际线的确越来越往后了，真担心有一天变秃头啊，不行我得赶紧去用用生发水。类似的案例还有很多啊，我们可以看到，利用这种恐惧心理给人用户洗脑的确不是太难！不过呢，积极情绪，也能让人上钩，这又是怎么回事呢？


