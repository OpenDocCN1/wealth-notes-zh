  md: '# 二、决胜竞争对手的7种方法


    当我去给企业做咨询顾问的时候，在给他提任何建议之前，我首先会看一下这个企业，他们现在到底在做些什么事情，哪些是对于实现他们的目标有帮助的，哪些是应该立即停止不要做的，哪些是做得不错，但还可以大大完善提高的（扬长避短，延时做减法）！所以，你首先要了解你现在做的哪些事情对于达成目标是有帮助的，哪些是没有帮助的，你要知道你现在的处境，你现在在哪里，你才知道怎么样到达你想要去的地方。


    比如说，我们所考虑的怎样进入新的市场，生产新产品呀等等，这还是第二步。首先，你要来看一下，你目前做的事情，做的市场、你目前做的产品，在现有的基础上怎么样才能做的更好！'
