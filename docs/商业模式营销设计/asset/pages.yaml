  img_proc: true
- pgno: 246
  md: '如何计算买客户成本，如何打造高诱惑引流产品，如何对接鱼塘吸引客流进店，通过前面章节的学习，相信你已经有了全貌的认识，然而这所做的一切，都是为了实现最终目的，那就是“成交”！


    只有成交才能产生利润，不论前面做多少铺垫，也不管引流了多少客源，如果不能让顾客掏钱购买，一切都是空谈，可惜的是，99%的实体店在成交方面显得非常软弱无力，除了卑躬屈膝般的恳求购买，就是没有章法的降价促销。'
