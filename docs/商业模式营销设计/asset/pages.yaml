- pgno: 227
  md: '# 要做“送”的动作就行！


    所以在对接鱼塘的时候，要帮塘主把实施方案和工具都做好，在看到有利可图，操作简单的情况下，他才会更愿意配合你的行动。当包装了高价值、高诱惑的引流产品，在对接时依然失败，就是因为没有告诉塘主需要如何做，更没有让他感觉到具体的好处。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 十、失败的鱼塘合作谈判方式


    在跟鱼塘对接的时候，很多营销新人头就大了，高诱惑的引流产品包装好了，成交流程也设计到位了，可是在跟鱼塘塘主沟通的时候，很难获得塘主的信任，吃闭门羹的几率相当高，甚至很多塘主连谈合作的机会不给就回绝了。通过这些年对学员回馈和观察发现，他们基本上都是以求人办事的态度去洽谈合作，比如，他们会说：“我这里有一些礼品卡，你可以回馈给你的客户，我免费提供给你！”


    假如用以上类似的话术跟鱼塘谈合作，拒绝率基本上是100%，他们看不到你给他带来的价值，帮你发卡，反而还会增加他们的行为成本，甚至还会感觉，凭什么把我的顾客吸引到你的店里去，就算碍于面子答应了，也是你前脚卿出门，后脚就扔。


    要想改变局面，跟塘主谈判时的心态是非常关键的，要认识到，你不是求着鱼塘帮你发卡，更不是偷偷摸摸搞他的客户，你是在帮他，因为你的引流卡有足够的价值，可以帮助他提升营业和维护老客户，现在是他需要你的帮助，而不是你求着他。摆正心态之后，才能更好的表达跟合作主张，也就是合作的谈判话术。'
  merge: -1
  img_proc: true
- pgno: 229
  md: '但是，如果话术不到位，同样也失败，这也是很多新手始终无法对接到鱼塘的原因，不过有一种情况，对方正准备整合别人的礼品，刚好你又送上门了，此时很快就能达成合作，不过这种几率非常小，当然，你可以把本书送给对方学习。


    下面给你展示三种比较失败的沟通模式，以避免你犯同样的错误。


    # 鱼塘合作谈判失败的沟通方式 1


    “老板！我这里有一张价值 98 元的理发卡,你帮我发一下吧！”这样的沟通方式，给别人的第一反应就是，我凭什么帮你发，帮你发不就是帮你引客户吗？我自己都忙不过来了，还帮你引客户！你想的大美了，所以这种沟通方式失败率极高，就算是勉强答应了，也只会对你的引流卡置之不理。


    # 鱼塘合作谈判失败的沟通方式 2


    “老板，我送些礼品卡帮助你提升业绩，你看行不？你可以拿这个卡促销呀！”这种表达方式，又比第一种好多了，至少表'
  merge: -1
  img_proc: true
- pgno: 230
  md: '达了能够给予到对方的价值，不过很多老板也会疑惑，送礼品帮我提升业绩，你有什么目的，所以在合作中也会受到很大的阻力。


    # 鱼塘合作谈判失败的沟通方式3


    “我们店为了做宣传，现在免费拿出一些礼品对外赠送，如果你有需要的话，我可以给你一些，帮你促成交易或维护客户关系……”，这种沟通话术，虽能够吸引到开明的老板尝试合作，但还是不能够起到主导地位，隐约让人感觉这依旧是在帮你发卡，所以，还是需要进一步扭转局面。'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 十一、高手搞定鱼塘合作的3套话术模板


    接下来我会给你分享一些成功的沟通话术，也是我们这些年实践证明有效的一些对话模型，当你看了之后就会明白，为什么高手们总能够很轻松的谈成各种鱼塘合作。


    # 搞定鱼塘合作的话术模板1


    很多高手不会以自己店里的名义谈合作，他会以消费者讨价还价的形式先做试探，这样能够减少对方的防备心理，并让他主动接见你，下面是对话参考。


    高手：你这个产品太贵了，如果能送几十块的礼品，我感觉更容易促使我们购买！


    塘主：这已经是很低的价钱了，我们的利润很低的！


    高手：不见得吧！我给你打个比方，如果今天你家对面开了一家店，跟你销售同样的产品，如果他挂出横幅，购买100元，赠送90元实实在在的礼品，如果你们是同样的折扣，你感觉消费'
  merge: -1
  img_proc: true
- pgno: 232
  md: '者会去哪一家购买呀！是不是更愿意选择你的竞争对手？


    塘主：如果这样当然会选择他，不过，我们这行不可能有这么高的利润的，除非他亏本差不多！


    高手：你还别说，还真不会亏一分钱，而且可以在赚得更多的情况下实现，你有听说过买客户思维没？


    塘主：什么？


    高手：意思是说，这些礼品不是你掏钱采购，整俗别人的就行，比如，理发店平时花 5000 块钱打广告，不一定有效果，不如直接把 5000 块钱的广告费转换成 100
    张理发卡，每张理发卡价值 90 元，成本还没有 5000 块的广告费那么多，这样是不是可以保证 100% 吸引 100 个目标客户呀，而且维护得好，后期会不会可能
    30 个长期消费，理发店就赚了吧！现在，你的客户刚好是理发店想要的客户，你完全可以找理发要 100 张理发卡过来，当做赠品帮你促成成交啊！那我就会更痛快的买你的产品呀！


    塘主：哪有这么简单，你要别人给别人就会给呀，这个不现实！'
  merge: -1
  img_proc: true
- pgno: 233
  md: '高手：那你的意思是说，如果真的能够整合过来，你肯定会要是吧！


    塘主：那当然，只要我的顾客过去不强制推销就行！


    高手：如果我帮你弄 100 张过来，你的同行肯定没法跟你竞争了，你给我什么好处？


    看明白了吗？不但可以把引流产品对接过去，还能问他要好处，当然，要好处仅仅只是谈判的技巧，不要好处，交个朋友会更好，最终的目的达到了。


    # 搞定鱼塘合作的话术模板2


    碰到打折促销的店，如何切入话题呢？下面为你展示商业顶层设计鱼塘整合高经常用的沟通话术模板。


    高手：我感觉，你这样打折会降低自己产品的价值，你们同行都在打折，利润会越来越低，而且今后恢复原价，客户就很难接受了！'
  merge: -1
  img_proc: true
- pgno: 234
  md: '塘主：那有什么好办法呀！我也是没有其他办法，都这样做，我不做，会更没有顾客！


    高手：你感觉，如果买你100块钱的产品，送实实在在100块钱的礼品，会不会价值更高，出量更多呢？而且还不降低产品本身的价值。


    塘主：我们可没这么高的利润，要是这样做，肯定赔钱！


    高手：你不是打8折吗？买100元赠送100元礼品，也相当于8折，你接受不了？


    塘主：没明白你的意思，怎么是八折？


    高手：很简单呀，这些礼品你完全可以去整合的，你知道我们圈子里做生意的是怎么玩的吗？都是整合别人的产品来帮助自己促成成交。给你打个比方，稍微高档一点的瑜伽会所，为了宣传自己的瑜伽项目，一年花掉万把块钱的广告费不多吧，还不一定有效果，如果把这一万块钱的广告费转换为瑜伽课程，场地和教练费用分摊下来，至少可以变成200张半年卡哟！半年的瑜伽课程市场价也得1200块！最少能带200个目标客户过去吧，比打'
  merge: -1
  img_proc: true
- pgno: 235
  md: '广告效果好多了，如果服务到位，很可能有一部分办年卡哦。


    现在，你的客户正好是这些瑜伽会所想要的客户，并且你的客户平时都是花钱才能享受他们的瑜伽服务，为什么不去跟瑜伽会所谈，整合他们的半年卡来帮你促销呢？假如你的对手懂了这一招，他去整合了，你就完全没有优势了！


    塘主：没那么简单就可以整合的！


    高手：这个不难呀，我们经常做这样的整合，如果你需要的话，我可以帮你去整合过来，你给我什么好处嘛！


    塘主：你要什么好处？


    高手：要不这样，我整合过来的半年卡，每帮你促成成交一单，你给我销售额10%的提成如何？到时在你店门口挂个条幅，比如“九折优惠，消费满500元还送800元礼品！”也就是说，给了我提成之后，还是八折时的收入，但是比你竞争对手的优势就大多啦！按照上面的话术，把引流产品嫁接给鱼塘是非常简单的，更重要的是，还可以分到提成哦！'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 锁定鱼塘合作的话术模板 3


    前面的两套话术是以顾客的身份进行沟通，本套模板为你展示的是以策划人员的身份整合鱼塘的话术。


    策划人员：您好，我是浪淘沙理疗会所那边的，我们店准备过两天做活动，这里有一张卡，到时候持卡过来，可以免费享受市场价40元的能量药疗养肾服务，我们老板经常来您这里消费，所以特意要我给您送一张过来，邀请您参加我们的活动。


    塘主：真的免费？不额外收费？


    策划人员：当然是免费，老板特意要我来送给您的！


    塘主：谢谢你啊！


    策划人员：其实我是专门给浪淘沙理疗做策划的，我给您提个建议，或许还能让您借助浪淘沙的活动小赚一笔，我放一些卡到您这里回馈客户，您就说这些卡是自己花钱买的，反正你的同行那里没有，客户关系不就维护好了吗？你也可以挂个横幅在门口搞促销，进店消费就送服务，这样不就促销了你的产品吗？'
  merge: -1
  img_proc: true
- pgno: 237
  md: '塘主：那你就放一些卡到这里，我来帮你发吧！


    策划人员：怎么是帮我们发了，要知道，这些都是需要成本的，这是我们平时可以实打实收费 40 元的服务，之所以免费送只是把本来准备投入的广告宣传费省去，转换成直接的服务而已，并且考虑到成本太高，我只能先给你
