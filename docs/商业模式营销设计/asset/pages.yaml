- pgno: 238
  md: '# 十二、鱼塘整合话术设计流程


    通过上一节的话术模版，相信你在鱼塘整合方面，已经有了更多的把握，本节主要针对上一节前两段话术模版为参考，带你总结其中的步骤和原理，从而让你做到随机应变。


    经过多年的实践经验，一般只需四步就能轻松搞定鱼塘合作，下面逐步为你剖析。


    # 第一步：身份转换，提高姿态；


    很多新手会以自己店的名义，直接进入了引流卡对接合作的环节，总是抱着求别人的态度，塘主自然会把姿态摆高，（如果能量够高的话，以自己店的名义洽谈合作也是可以的）整合高手为了提升自己的能量，会以顾客的身份开始谈判。就像上一节第一套话术模板中表现的那样，先以顾客的身份讨价还价，对方的抗拒心就会降低，潜意识认为他需要你，他的能量自然就会降低下来，你便占据了主导位置。


    比如，我们去整合超市做活动，如何找到负责人呢？很简单，只要找到超市的任何一位工作人员，跟他们说：“我需要在你们'
  merge: -1
  img_proc: true
- pgno: 239
  md: '超市采购 60 万的购物卡，请问谁负责这一块……”，基本上不出 2 分钟就能见到负责人，此时你是能量强者，他需要你，见面之后，再表达出你的方案是如何让他轻松额外创造
    60 万业绩的就可以 了。


    # 第二步：挖掘痛苦，引出需求；


    当你要求对方给予更低的折扣，并反复强调他们是暴利行业时，对方自然会向你吐苦水，为什么要挖掘痛苦？因为只有知道他们的痛苦，才能引出自己的解决方案。


    比如，我们整合物业公司时，会转换自己的身份，以租广告位的租客切人交谈，立马就能见到相关负责人，然后拼命的砍价，并带有讽刺的口吻说：“你们物业公司成本这么低，就请几个人，暴利啊，广告位还舍不得让利！”，此时，物业公司基本上都会向我们倒苦水，说出自己现在的难处，并举例证明自己现在的痛苦。


    # 第三步：提出震撼，刺激欲望；


    当对方说出自己的痛苦，在认可他的同时，给予一个震撼性'
  merge: -1
  img_proc: true
- pgno: 240
  md: '的解决方案，让他的思维瞬间惊爆。上节话术中“买100元送100元”的解决方案，就打破了对方的思维定势，即坏又好奇，在整合物业公司时，当物业公司说出自己的痛苦，我们会立刻问他，为什么不像其他城市一样，给每户业主送礼品维护关系，他们立刻表示震惊和怀疑，并有欲望知道别人是怎么做到的。


    # 第四步：讲明原理，合作共赢；


    当对方震惊和怀疑的时候，你需要告诉他已经很多人都这样做了，或者让他知道，你经常在做这样的整合，然后通过案例和计算，讲明原理，此时，基本都会认可你的说法，但是他并没有整合能力，你再跟他谈合作，就很容易成交。


    看到这里，请再结合上一节的话术模板好好感悟，并尝试着设计出适合自己的话术吧！切忌照本宣科，一定要融入到谈话中自然的表达。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 十三、判断优质鱼塘的 4 大参考标准


    通过前面的分享，我们知道了如何找鱼塘、如何利用鱼塘、如何整合鱼塘，这一节教你如果判断优质鱼塘，因为只有优质的鱼塘它才能给你带来源源不断的精准客源。


    判断鱼塘是否优质有 4 大标准，下面逐个为你讲解。


    # 标准 1：精准程度


    在对接鱼塘的时候千万不能莽撞一定要做好初步调查，否则你自认为精准的鱼塘，很可能并不是目标客户聚集的地方，否则努力白费，引流产品也浪费。


    就像前面理发店的案例，为了拓展客源，本以为团购网会员多，结果吸引来的全部是占便宜的，完全没有自己想要的高端客户，最后的结果是费力不讨好，生意越来越冷淡。（注：这里并没有贬低团购，对于定位不同客户人群的生意来说，团购网也是很多商家的精准鱼塘）'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 标准2：客户基数


    选择的鱼塘，除了精准，潜在客户基数一定要大（老客户转介绍除外），如果鱼塘就那么十几条鱼，这样的鱼塘费对接之后，浪费的时间成本和转化产出是不成正比的，除非这个鱼塘的是塘主或影响力人群，否则对接的意义不大。


    # 标准3：塘主口碑


    对接鱼塘，除了可以获得精准客户之外，还有一个非常重要的作用，就是可以获得塘主的信任转嫁。为什么引流产品不能在大街上乱发，首先就是精准程度不够，然后缺少信任度，所以，你需要借力客户对塘主的信任，让这种信任因为塘主的推荐而转嫁给你。


    如果塘主在圈子里或顾客心目中的口碑不好，他赠送给顾客的引流卡，响应率可能会很低，甚至会让顾客有一种“天下乌鸦一般黑”的错觉，套在你身上。


    比如，有很多伙伴跟物业公司合作，向业主赠送引流产品，结果业主和物业公司之间存在很大的矛盾，业主根本不相信物业'
  merge: -1
  img_proc: true
- pgno: 243
  md: '公司，所以迟迟受阻，这样的话，付出了很多，但起不到很好的效果。


    # 标准4：影响力


    其实，选择鱼塘只要做到前面 3 个标准就 K 了，但如果你对接的鱼塘，塘主的影响力越高，引流的效率就会越高，并且过来的客户对你的信任指数也会越高，这里指的影响力，是塘主在他们圈子里或顾客心目中的权威地位。


    比如，我在课程学员们的心目中，具备一定的专家地位，如果我推荐他们学习某本营销类书籍或免费上哪个老师的网络公开课，绝对会有很大比例的响应，鉴于此，找到有影响力的塘主，绝对会事半功倍。'
  merge: -1
  img_proc: true
- pgno: 244
