- pgno: 261
  md: '# 四、超级赠品策略


    有价值的赠品是促成客户下决策的催化剂，每个人都有占便宜的心理，如果认识到产品的价值，但又犹豫不决的时候，只要给一个强有力的赠品去刺激他，立刻就能成交。


    获取赠品的途径有两个思考方：自主采购、筹码整合，下面逐个讲解。


    # 自主采购


    所谓自主采购，就是自己花钱购买赠品，把折扣的让利成本，转换成对顾客有价值的赠品，将瞬间放大对方心中的价值感，比如，100 元的产品 8 折销售，相等于让利
    20 元，但是，这 20 元的成本可以采购到市场价 50 元的产品，也就是说，让利 20 元与赠送 50 元的产品对比，只要赠送的产品有价值，后者的诱惑力会更大，更重要是，主营产品本身的价值没有贬低。


    自主采购赠也有两种思路供你参考。'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 思路1：将折扣让利转换为赠品


    比如，饭店用餐8折优惠，平均每桌消费200元，8折相当手让利了40元，如果把40元的成本转换为赠品，完全可以放大到100元的菜品，促销主张就是“消费200元赠送100元的现金卡！”，下次可以直接抵100元现金消费，100元以内不需要额外支付现金，这样的回馈力度是非常大的。


    再比如，服装7折优惠，如果购买1件300元的外套，7折相当于少收90元，然而，90元的成本可以放大到100元每件的2件衬衫当作赠品，想象一下，300元的外套，反复强调品质的保证，告诉对方从不降价，现在唯一的政策就是赠送2件衬衫，只要塑造好衬衫的价值，我想，比7折优惠反而更容易促成成交。或者把7折改为8.5折，对比7折而言，还有45元的让利成本，可以采购到市场价100元的衬衫1件，也就说，购买300元的外套，享受8.5折优惠，还赠送1件100元的衬衫，这样的促销力度也远远大于单纯的7折优惠。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 思路2：将提价收益转换为赠品


    不用产品本身的折扣让利额度采购赠品，而是直接提价，把提价的收益转换为促成成交的赠品。


    比如，在第一章说到的少儿英语点读机，推广期间 540 元每台，为了提高成交率，把 540 元提价到 640 元销售，多收人的 100 元转换 300 元的学习资料和用品作为促销赠品，成交率瞬间提升。


    再比如，饭店可以每道菜提价 2 元，对于消费者来说是很难感知的，那么，10 道菜就多收了 20 元，将 20 元的成本，转换为 50 元的火锅当作积分赠送，回馈力度让人有更直观的感觉。


    所以，千万不要只知道死板的打折，折扣和赠品需要相互搭配，要么折扣让利的部分转换为赠品，要么直接提价，把提价收益转换为回馈和促销的赠品，往往会起到意想不到的效果。


    # 筹码整合


    我们的引流产品可以帮助鱼塘促销，同样，也可以把自己的'
  merge: -1
  img_proc: true
- pgno: 264
  md: '店定义为鱼塘，整合别人的引流产品帮我们促成成交，这是非常厉害的一招。为了放大自己的成交力度，完全可以整合互补商家大量的引流产品帮助自己促销，只要把买客户思维跟对方讲清楚，让对方有一个风险测试的评估，很容易整合到各种产品。


    # 赠品促销的4大核心要素


    要素1: 必须先塑造主营产品的价值 别人不会因为你赠品而购买产品，赠品和折扣只是促使顾客下决策的催化剂，只是临门一脚的工具，所以，在给出赠品之前，必须让对方认识主营产品的价值。很多人总希望通过赠品或折扣，就实现疯狂抢购的场面，往往消费者并不买账，为什么？因为他不是购买你的赠品，如果消费者还没有认识到主营产品价值，想通赠品和折扣打动消费者，是很不现实的想法。


    # 要素2: 赠品必须塑造价值


    比如购买70元送原价40元的赠品，赠品不是你说40元，在消费者的心目中就值40元的，赠品也要像主营产品一样，把价值塑造清楚，甚至要让别人感觉掏钱购买赠品都很值，赠品价值塑造到位，临门一脚会变得非常简单。'
  merge: -1
  img_proc: true
- pgno: 265
  md: '以前我们帮足浴按摩中心打造了能量药疗养肾的赠品项目，成本4元左右，但可以放大到近40元的价值，为了让顾客认识到赠品的价值，我们提前一个月就在店里宣传，推出能量药疗养肾的服务，并贴出海报，还在地面投放几轮宣传广告，让大众以为这就是主营服务，一个月之后再用这个服务当做赠品进行促销，威力立马显现出来了。


    再次强调，赠品的价值必须塑造出来，否则促销的力度将大打折扣。


    # 要素3：赠品要体现稀缺性和紧迫感


    不要让人感觉谁都可以获得，什么时候来都可以获得，应该营造出一种氛围，让人感觉赠品的数量是有限的，赠送的人群是有条件的，稀缺性就体现出来了，并反复提醒活动将在几月几号截止，紧迫感又出来了，如此一来，赠品促销的威力就会变的更大。


    # 要素4：充分引发从众心理


    前面在四重引导中已经讲过，不要让对方感觉自己会因为下决策，而成为上当受骗的傻瓜，要让他知道，已经有很多人都因为赠品而购买了产品，记得把赠品领取手'
  merge: -1
  img_proc: true
- pgno: 266
  md: '册拿给他看。


    请务必严格按照以上 4 个要素，包装出自己的促销赠品，你的成交率绝对指数级提升。'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 五、增值抵现策略


    把顾客得到的好处或付出的成本，进行金额放大，放大后的金额可抵现金购买其他产品，这种促销策略我们称之为“增值抵现”！


    增值抵现有三种常用的形式，分别是：引流产品增值抵现、押金增值抵现、成交金额增值抵现；


    # 引流产品增值抵现策略：


    我们包装的引流产品都有相应的价值额度，将额度放大之后抵现金购买其他产品，这就是引流产品增值抵现的操作方式。


    # 案例：服装超市的高效的增值促销方案


    有一位开服装超市的学员，分享了自己运用增值抵现成功促销的案例。操作方式如下：'
  merge: -1
  img_proc: true
- pgno: 268
  md: '1、跟相距近300米远的超市达成合作，到超市购买任意金额，持购物小票在第二天早上9点-11点即可到他们服装超市，免费领取两双丝袜，过时作废！


    2、把店里50元以下的衣服挑选出来，放置在特价区！


    3、凡是过来领取丝袜的，给他们两个选择，选择一，直接拿走两双丝袜（市场价2元），选择二，不拿走丝袜，丝袜的2元额度放大到20元抵现金购买衣服（特价区除外）；


    最后的结果是：拿小票过来领取丝袜的有130多人，直接拿走丝袜的只有27人，当天增值抵购买衣服的有70多人，其他的人都预留下次购买名额。


    # 案例：童装店让老客户回头的现金卡增值方案


    作为服装店，如何在新装上市的时候让老顾客回头呢？操作方法非常简单，我有一个开童装店的学员刘总就巧妙的运用增值抵现策略，轻松操纵着顾客的回头率。


    操作方法如下：'
  merge: -1
  img_proc: true
- pgno: 269
  md: '1、在顾客购买产品之后，赠送一张 10 元的现金领取卡。持卡可以在下次活动期间免费兑换 10 元现金；


    2、在新装上市的时候，打电话通知所有的老顾客，告诉他们，将在几月几日开展活动，上次的现金卡在活动期间可以激活免费领现金，并且还可以参与抽奖。


    3、顾客过来之后，给她们两个选择，第一，直接拿走 10 元，并参与一次抽奖；第二、不拿走现金，可以放大到 30 元，抵现购买新装区的童装，仅限持卡者，其他任何人原价，并且还可以参与三次抽奖。


    这个策略的巧妙之处在于，免费领取的 10 元现金，是上次购买衣服的利潤中分割出来的，这次过来就算全部领走，也不会赔钱，更重要的是，这种形式，老顾客的回头率很高，由于新款上市，又放大到
    30 元的金额抵现，在稀缺性、紧迫感和从众心理的氛围下，能够促使大部分顾客放弃现金领取，直接抵购服装。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# 押金增值抵现策略：


    将缴纳的押金进行金额放大，抵现金购买其他产品，这种促销的策略，我们称之为押金增值抵现。


    # 案例：培训公司的押金增值促销方案


    2013年年底，我在广州的培训公司招募营销合伙人，就运用了这个模式，当时我们通过QQ群持续预热20多天，预告接下来要推出的项目，当时每天都有很多人关注，欲望也逐步推高，都很期待本次网络的项目说明会。


    在项目说明会的前几天，我们开了一堂公开课，在课堂宣布：“由于本次合伙人的项目讲解，只能分享给最有意向的人听，所以凡是想听项目说明会的伙伴，需要缴纳1000元的押金，在项目说明会结束之后退钱，并且我敢保证，仅仅听本次项目讲解，你就能学到很多营销运作的奥秘……”


    如此一来，居然有近170人参加了我们的项目说明会，由于交了押金，我们就顺利的推出了增值优惠策略“凡是押金不退还直接补缴余款的，可以享受到一项超值优惠政策，原价2万的合'
  merge: -1
  img_proc: true
- pgno: 271
  md: '作人资格，现在只需1万元……”，很快就成交了80人（当然，其中有很多细节需要把控，一般人不好模仿）。


    不过，在操作押金抵现时，培训公司有一套比较容易复制的模式，下面给你展示操作流程：


    +   1、录制一套音频课程，塑造好课程的价值，做好客户见证，市场售价为500元每套：

    2、找到鱼塘做好宣传，给出主张“现在只需要缴纳100元押金，即可免费领走音频课程学习一周，学完之退还押金”；

    3、在快到一周的时候，打电话邀请音频领取者，免费参加地面公开课程，课程的内容是音频课内容的实战精华延伸，同时可以来现场退还押金；

    4、在现场2个小时分享，再次深入的教育了潜在客户，并顺利推出一套1500元的课程，此时，如果押金不退的话，100元的押金可以抵500元报名，并且音频U盘无需退还，如果本次没有抓住机会，今后报名需要直接支付全价，没有音频课赠送……最终实现大批量的成交。'
  merge: -1
  img_proc: true
- pgno: 272
  md: '成交金额增值抵现策略就是：让顾客购买产品已经支付的金额进行放大，抵现金购买其他产品，这种促销的方式称之为成交金额增值抵现。


    # 案例：广告公司的增值抵现方案


    作为广告公司的经营者，在拜访客户的时候，第一次成交几百几千的版面比较难，如何才能锁定顾客下一次优先选择我们呢？运用成交金额增值抵现方式，是非常不错的选择，我的一个学员陈总分享了他的模式，具体操作流程如下。


    +   1、销售一个低价格且超值的公益广告服务，作为引流产品，设计一个无法抗拒的成交主张，促使对方第一次掏钱购买，比如，销售20元的广告位，给予相应的附加值，每个目标商家逐个拜访成交。


    +   2、在下期拓展报纸业务时，打电话给已经购买20元广告位的商家，告诉他们“由于您上次支持了我们的★★公益广告服务，所以本期您获得了一项特权，您上次支付的20元，现在可以分别抵50、200、600元现金，做其他3种不同版面大小的报纸广告……”，这样就顺理成章的获得了第二次推荐和销售的机会。'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 案例：美容院会员卡充值金额抵现操作方案


    美容院基本上都是用充值锁定会员，可惜的是，在催促顾客继续充值时，往往陷入了误区，她们总是在顾客把卡里的钱用完之后，才推荐其他的充值优惠政策。


    正确的做法应该是，顾客卡里的钱还剩三分之一，就开始催促充值，而采用的策略就是成交金额增值抵现，比如，顾客的卡里还剩1000元，现在推出一个4000元的套餐，告诉顾客，如果现在充值，卡里的1000元余额可以抵2000元使用，也就是说，现在只需要支付2000元就可以享受到4000元的套餐，如果卡里的余额消费完，就没有这个优待了，在套餐价值塑造到位的情况下，这样的充值促销方式是非常容易成交的。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# 六、整体部分策略


    想要理解【整体部分】的促销方式，请再次回到《商业模式·顶层设计》书本中寻找答案，“打造基础套装类引流产品”。


    首先回顾一下基础套装类引流产品：人们使用产品的目的是为了解决问题和实现梦想，然而问题的解决和梦想的实现，并不能一步到位，必须经历一个发展过程或做好多个方面的配合，所以，在包装产品的时候，分阶段进行策划，把第一阶段的产品或服务作为基础套装类引流产品，是超级具有杀伤力的策略！


    基础套装类引流产品，是拿整体服务的前半部分进行引流，那么【整体部分】的促销策略，是在目标顾客接受了前半部之后，把后面部分的产品或服务采取超值折扣、超级赠品或增值抵现的形式打包销售。'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 案例：整体定制家具的自动化赚钱模式


    我曾经遇到一家做整体定制家具的公司，老板是做定制家具生产的技术人才，看到自己所在的企业赚了不少钱，所以毅然选择离职，倾注多年的积累，还外借了一些资金，创办了属于自己的事业。


    可惜的是，现实并没有想象的那么美好，请了大量的业务员扫楼式的拜访装修业主，经营大半年下来，业绩几乎无法维持整个工厂的运营，最苦的时候连员工的工资都没有着落。


    在参加我的商业顶层设计课程之后，制定了详细的营销方案，回去之后就狠狠的执行，结果起死回生，不到一年的时间，公司的业绩已经做到了几千万，并且整个业务体系实现了全自动化！到底如何做到的呢？下面就是操作步骤。


    +   1、 包装一张引流卡，持卡可以免费获得一张 3000 元的定制餐桌（成本价只有 500 元左右）;


    +   2、 由于整体定制家具的目标客户比较高端，在选择鱼塘的时候，必须找到高端装修业主聚集的鱼塘，经过最后的市场分析测'
  merge: -1
  img_proc: true
- pgno: 276
  md: '试，发现高端地砖店是最佳的合作选择；


    3、跟高端地砖店达成合作协议，我来帮你促销，凡是到你店里购买地砖的客户，可以免费赠送一张市场价 3000 元的定制餐桌，但是，通过我赠送的餐桌，每帮你促成一单，你给我
    500 元的佣金，由于地砖店竞争激烈，很快就达成了合作协议（这里的巧妙之处在于，连引流的成本都收回来了）；


    4、地砖店的客户获得餐桌定制卡之后，拨打整体定制家具公司的电话，由于是定制，所以并不能立刻拿走桌子，需要安排工作人员上门量房以及沟通具体的装修风格，这样，就无阻力的被请进了目标顾客的家。在量完房及沟通好装修风格后，告知目标客户说：“我们会针对您的实际情况，做出桌子的效果图，电话通知您到我们公司查看，设计师再配合您的需求，面对面的做相应调整！”，这样就顺利的获得了邀请目标客户进公司互动的机会。


    5、把房屋参数和装修风格拿回来之后，除了做出餐桌的效果图还把整套家具效果图都配套设计出来，让业主直观的看到立体效果；'
  merge: -1
  img_proc: true
- pgno: 277
  md: '6、邀请目标客户来公司，首先给他展示餐桌效果图，在确定餐桌效果图之后，询问对方想不想看看他们家的全套定制家具是什么效果，这样就顺利的引出了全套效果图的展示，并开始讲述定制家具的优势及客户见证。


    通过前面6个步骤，测试的结果是，每赠送10个餐桌就能成交2-3套整体定制家具，其他没有购买整体定制家具的，难道就不能从他们身上赚钱了吗？当然不是，因为只送了餐桌，并没有送配套的椅子，所以，基本上都会花钱购买。


    当通过前面的步骤测试成功了，他们跟更多的高端地砖店建立了合作关系，由于后端的利润空间巨大，前端跟地砖店合作时，把索要的500元佣金降低，让地砖店的积极性更加高涨，彻底实现了自动化。'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 七、诊断方案策略


    诊断的目的是为帮助目标客户发现错误和漏洞，并通过制定有效的解决方案；弥补即将发生的损失，最终销售我们的解决方案。


    把解决方案的价值塑造好，让目标客户认可之后，便可以采取超值折扣、超级赠品或增值抵现的形式展开销售了。


    # 案例：高端灯具的销售解决方案


    2016 年的一次课程现场，有一位年销售额做到 8000 万的灯饰厂老总遇到了发展的瓶颈，在他的阐述中可以得知现在遇到的 2 大难题：


    +   1、市场竞争越来越激烈，不能找到有效的方式区隔竞争对手。\n2、全国各地的几千个经销商，在拓展业务的时候参差不齐，没有一套可复制的终端营销系统。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '我当时给他的建议是，必须调整经营思路，要想区隔竞争对手，并打造终端可复制的营销系统，就应该从销售产品改为销售解决方案。


    # 具体建议如下：


    +   1、购买高端灯饰的客户，除了照明的需求之外，还必须挖掘更多的需求，我们可以从三个角度来思考。


    +   (1) 灯饰是体现室内装饰风格和档次非常重要的点缀物；

    针对这个需求，我们提出一套灯饰与装修风格搭配的解决方案，依照客户室内不同的位置以及装修风格，配合客户的欣赏品味，针对性的定制灯饰搭配方案，以体现出最佳的点缀效果。


    +   (2) 灯光明暗及色调，会影响室内装修的效果及身体健康；

    针对这个需求，我们需要有专门的灯光设计师按照不同的灯光需求，及装修材料的颜色，搭配最能体现每个部位装修材料档次和符合人体健康的灯光解决方案。


    +   (3) 灯饰还是室内风水最好的调节法器；'
  merge: -1
  img_proc: true
- pgno: 280
  md: '针对这个需求，我们需要有专门的风水调节师，依照室内的方位及客户的五形属性，设计出最佳的风水搭配解决方案。


    2、上面的解决方案虽然能够快速虏获客户的心，但是一定要杜绝个人能力的干预，所以针对以上三大板块，必须由总部设计出一套系统的问卷和参数表，终端经销商跟顾客沟通的时候，只需要按照问卷来实地考察和沟通，并在每大板块的每个问题上，填写参数和打勾做选项即可。


    3、每个终端经销商都有一套由总部直接控制授权的软件，只要把问卷选项和参数据，依照步骤在软件中重新选择和填写一遍，软件将自动生成一套解决方案，然后通过打印机直接打印完成了整个操作。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 案例：微信第三方平台的销售解决方案


    有一个专门给商家做微信网站的企业，虽然技术一流，但在拓展业务的时候，收取商家几百元都成了很困难的事情。


    为什么会这样，因为他们是在卖产品，而没有想到为客户提供一套解决问题的方案，要知道，客户购买的是结果，而不是一个简单的网站，如果能够让商家清晰的感知到，你的平台能够轻松实现商家渴望看到的几个场景，那么销售起来将变得非常简单。


    比如，商家都渴望看到客户心甘情愿的为自己的产品做口碑宣传，这个场景完全可以通过微信公众平台来实现。


    消费者在购买产品的时候，都想付出更少得到的更多，所以才会跟商家讨价还价，最后商家只能无可奈何的通过让利。


    然而，这种让利形式并没有为商家实现价值最大化，我们提出假设，消费者需要让利的时候，商家这样对他说：“我们的服务和品质是 100%有保障的，价格方面实在不能优惠了，这已经是最低价格了，不过我们有一项政策，因为您知道，我们店为了宣传品牌，每年的广告宣传投入是很多的，如果您愿意关注我们的'
  merge: -1
  img_proc: true
- pgno: 282
  md: '公众号平台，并把指定的文章发送到您的朋友圈，为我们做品牌宣传，完全可以再给您更多的优惠，就相当于您帮我们做了广告……”。 更多绝学课程，请加私人微信：A3162209188


    想象一下，商家平时给顾客打折，并没有得到额外的回报，而现在简单的表明打折优惠的理由，不但不会损害品牌形象，而且通过朋友圈的转发，每转发一次就意味着有几百个人看到这条软文广告。


    如果每天有 20 个顾客消费，就意味着每天可以传递给上几千上万的目标人群，更重要的是，朋友圈的软文推荐，拥有高信任基础，商家的品牌很快就能传开，这样一算，花几百上千元做一个平台，是不是太值了！


    比如，商家渴不渴望让更多的消费者给他做见证呢？通过微信公众平台嫁接的网站就能实现，假如你是卖童装童鞋的，消费者在购买之后，只需要给孩子拍照晒单，给予点评，就可以获得一份小礼品，是不是会有大量的顾客响应，今后其他顾客购买的时候，完全可以翻出这些照片和点评来引导成交，而且这些评论还可以进行转发宣传，还起到了强有力的宣传作用！'
  merge: -1
  img_proc: true
- pgno: 283
  md: '再比如，商家想不想其他店也宣传他的品牌？如果把他的二维码放在其他店，别人扫描就可以参与抽奖，是不是帮他抓了粉丝，并且在参与抽奖的过程中，还了解到了产品的卖点。


    如果是饭店，把特色菜的价值塑造好，扫描二维码抽奖送道具，把二维码贴到很多互补商家的店内，互补商家为什么愿意让他贴？很简单，把他们邀集过来开个会，彼此宣传即可。


