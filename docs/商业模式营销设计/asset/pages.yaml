- pgno: 42
  md: '# 1、什么是怀旧营销


    怀旧营销就是在营销活动中给予消费者一定的怀旧元素刺激，激发消费者的怀旧情怀，勾起他们记忆深处的共同记忆符号，以此来引发购买倾向。如果说“热点”营销需要向前的争分夺秒；那怀旧营销就是向后的有条不紊。


    随着2008年金融危机的影响逐步深化，企业、产业和整个市场摇摇欲坠。在这个动荡的时代下，人人自危。人们的不安和恐惧心理逐渐显露出来，消费者开始选择一种安全的心理慰藉，用来逃避残酷现实，以得到暂时的心理安宁。于是，怀旧日渐成为一种普遍的社会现象。王菲和那英在1998年的春晚上演唱了《相约98》，时隔20年，今年再度合作，一起演唱了《岁月》。


    在2008年，80后集体怀念起了他们的初中时代，回忆被聚焦在了人教版（1991年）的初中英语课本上的李雷和韩梅梅身上，就这两个人的IP，还延伸出了不少话题呢！对，最可惜的就是这对终没成眷属的老情人。


    这一年，《南方周末》把这种把集体回忆李雷和韩梅梅的现象上升到社会学高度，认为这一现象属于集体记忆，'
  merge: -1
  img_proc: true
