- pgno: 101
  md: '4. 身份化，人 的需求有 3 个层次：利益、情感和身份。你在帮客户描绘蓝图的时候，也需要给客户一种身份，或者你需要框定他的身份（可以理解为身份标签，你希望对方成为什么样的人，你就得把对方说成什么样的人）。


