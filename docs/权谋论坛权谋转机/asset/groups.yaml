    # 如果你出身卑微


    你可以出身卑微，但必须卓尔不群，纵使你将众叛亲离，

    也注定要从头再来。最迷人的剧情不是后来居上，而是王者

    归来；最伟大的战局不是巅峰对决，而是独孤求败；最完美

    的谢幕不是激流勇退，而是戛然而止！


    ————乔布斯 《乔布斯》'
  - '[PAGE 15]


    # **历史背景**


    和珅，字致斋，钮祜禄氏，满洲正红旗人。少贫无藉，为文生员。


    # 《清史稿·卷三百十九·列传一百六》


    通常我们在给一个人写传记的时候早一点的会参照司马迁的《史记》，司马光的《资治通鉴》等正史书籍，但正史中的“列传”，因为收录的人数太多，大都写得非常简略。


    记载和珅的正史《清史稿》中的《和珅传》，不但简略，而且写得很差劲，有的地方前言不搭后语，简直不知所云。其原因，就是因为和珅这个人物的传记很不好写。


    《和珅传》的第一稿，不但被嘉庆皇帝所否定，连起草的翰林都被罢职了；因此后任起草者难免有些胆战心惊，最终弄成了这个样子。不是专门研究历史的人，对历史背景不太清楚的人，难免会一头雾水。'
  - '[PAGE 16]


    有一点可以肯定和珅其实出身并不好。他的前半生在向我们讲述一个逆袭的故事，能做到一人之下，万人之上的“二皇帝” 可全都是人家和珅一步一个脚印，苦心孤诣地爬上来的。'
  - '[PAGE 17]


    # 贫困生涯


    乾隆十五年五月二十八日(公元 1750 年 7 月 1 日)和珅出生在福建副都统常保家中。


    三岁时母亲因难产而去世临终时产下弟弟和琳，父亲常保在和珅九岁时亦因病去世，幸得一位老家丁和父亲的一位偏房保护和珅、和琳两兄弟才能免于被赶出家门。


    他更成功考上咸安官官学，和珅仪表俊雅，精通满、汉、蒙古、西藏四种语文，更精通四书五经。


    更得老师吴省钦、吴省兰器重。十八岁娶直隶总督冯冯英廉之孙女冯氏，和珅从此一鸣惊人。'
  - '[PAGE 18]


    # 选择一所好的学校


    曲意逢迎，阿谀谄媚自然是和珅少不了的致胜法宝，但是，倘若没在真才实学的积淀，他也不能博得乾隆的如此信任。将国家大权玩弄于股掌之中。


    这一点，和珅早在进入咸宁宫官学的时候就已经明白了。咸宁宫官学对学生的要求极益严格。


    读书诸生清晨入学，日暮散归。如果遇到天气不好，经过请求，学生可以留宿在学内学校没管理大臣，协理事务大臣，另外还有满汉总裁两名，必须是翰林才能担任，学内的敝师也大多是翰林，极少数不是翰林的，也是享有盛名的饱学之士。'
  - '[PAGE 19]


    # ### 从小励志


    和珅能够在窘迫，贫寒的家境中脱颖而出，成为权倾朝野，富可致国的巨贪。与他很早就立下志向是分不开的。


    和珅生于乾隆十五年，他的父亲常保曾经是乾隆时期的福建都统。常保为官清廉，而且多年征战戍守在外，所以，没留下多少家产。等他乾隆二十五年病逝在福建任上时，和珅的家境立刻窘迫起来。


    和珅的亲生母亲生下他的弟弟和琳之后不久就病逝了。继母对待他们兄弟二人极其苛刻。这些都使和珅从小就饱尝了人间冷暖，受尽了别人的白眼。然而这些并没有让和珅就此消沉下去，反而激起了他出人头地的强烈欲望。


    乾隆二十四年，和珅和弟弟和琳一起被远入威安官宦学。这是京城最好的学校，入读的大多是家境殷实的八旗子弟或是内务府子弟。这些人倚仗着父祖的富有和权力，宝马'
  - '[PAGE 20]


    轻工业衰，骄横拔扈。贫寒好学的和珅兄弟，虽然天资聪颖，才智过人，却屡屡遭人歧视、侮辱。


    有一次，一位大员的儿子写了一首嘲讽老师的诗，却说是和珅作的。恼羞成怒的教师不容和珅分辩就抄起戒尺一通乱打。和珼知道，向这样的教师只敢在他这等学生身上发泄自己的怒火，却无论如何不敢招惹大员的儿子。戒尺一下下打在和珼的身上，渐渐打碎了他心中的良知。


    和珼知道 在这样的社会中 最重要的就是权力和金钱。只有有了这二样，才会得到别人的尊重，才能尽情的享受人生，才能要那些势利的人们服从奉承自己。


    从此，权力和金钱就成了和珼生命中最重要的目标。为了得到权力，他刻苦攻读，处心机虑，想尽一切办法去接近皇帝，放弃了做人的人格和尊严，不惜一切的阿谀奉承，曲意逢迎讨得了乾隆的欢心，以罕见的速度一路攀升，终于成'
  - '[PAGE 21]


    了一人之下，万人之上的宰相。他几乎把握过大清帝国所有有实权的职位，国家的人事权、财权、军权，文化教育大权，民族事务及外交大权都直接的控制在他的手里，以改于朝鲜使者英国使者都把当成二皇帝。


    对于金钱，和珅更是显示出了绝无仅有的贪婪，他对金钱的执着几乎是变态的。他被嘉庆帝查抄时的财产，相当于他执政二十年间整个大清帝国财政收入总和的一半还要我多。堪称当时的世界首富。


    纵观和珅的一生，他从来对自己少年时立下的志向有过一丝一毫的动摇，也可以说得上是矢志不渝了。这也许是人权力和金钱的追求因为欲望的驱使更容易持守，但和珅为此而作的种种努力与忍耐，付出的种种艰辛，对我们或许也不无教益。'
  - '[PAGE 22]


    致寒门学子：


