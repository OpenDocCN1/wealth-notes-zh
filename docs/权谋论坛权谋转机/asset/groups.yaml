    有史家举要清朝三大惩贪大案，一是甘肃布政使王亶望折监冒贩案，二是云贵总督李侍尧贪纵营私案，三是嘉庆帝立诛和珅案。这三个大贪案均发生在乾隆朝，王亶望后来被


