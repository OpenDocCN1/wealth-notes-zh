    # 长期向上级输送财富


    李侍尧为官二十多年 ,是以进贡见长而备受众人瞩目 的。乾隆帝也不得不承认 ,李侍尧和山东巡抚国泰贡品在同僚中最优。进贡 ,是中国古代社会的一个传统。贡品成为天子与诸侯间政治经济联系的纽带
    ,也是臣工取悦于皇帝的主要手段之一。进贡主要有三种形式 ,一是朝贡 ,二是地方向朝廷进献的常贡 ,三是个人向皇帝的进贡。当然 ,并不是每个人 都有资格向皇帝进贡的
    ,具有进贡资格是社会地位和权力的象征。乾隆时期 ,有资格向皇帝进贡的人主要有六类 ,其中地 方大吏包括总督、巡抚、将军、提督等。


    作为具有进贡资格的地方大吏 ,李侍尧从乾隆十八年任热河 副都统起至乾隆四十五年 ,进贡次数有档可查的达一百二十 多次 ,有学者统计 ,李侍尧一年之中进贡次数最多达九次。
    按例 ,督抚进贡只有年节三贡 ,但李侍尧进贡的次数和名目'
