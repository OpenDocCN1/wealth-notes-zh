    国各地的珍玩迅速的聚拢到和珅手中，和珅得以从容的从中择选出精品，进献乾隆。乾隆四十五年，朝鲜来访的使臣就曾记下了他见到和珅向皇帝进献金佛的过程：“京城内有佛铺子，互相卖买，朝臣用此做为贡献，皇帝亦以赏赐贵臣。于秋节晨朝，有进贡覆黄帕架子，盛以金佛一座，长可数尺许，异入阗中，闻户部尚书和珅所献。”


    由此种种，和珅得到了乾隆空前的信任真可谓是“用而不疑，疑而不用。”对满朝大臣对和珅的不满，弹劾和珅的奉章视而不见，置若罔闻，甚至对弹劾之人加以打击、压制。每每这种时候，乾隆首先想到的是某人嫉妒和珅的精明能干，嫉妒自己对他的宠信要拆散他的左膀右臂。绝不会想到和珅的所作所为有什么不当之处
    和珅在他眼中俨然一位忠心耿耿遂招致同僚不满的忠臣。时间一久朝中逐渐很少有人再敢参奏和珅。和珅更加专横跋扈，地位甚至超过了亲王、


    皇子。正如在乾隆晚年来使的英国人马戛尔尼所见：‘（皇帝）刚燥之性，仍不以此少减，即如现在所有皇子，仅止四人，而此四人之中，乃无一人能略握政柄。宁举全国政柄，界诸相国和中堂一人，而绝不计将来承继问题，其意见如何，颇非他人所能揣测，然论者每谓现有之皇子四人，均为皇帝所不喜之。”由此可见，乾隆皇帝对和珅的依赖和信任。远远超过了他对他自己儿子的儿子。


