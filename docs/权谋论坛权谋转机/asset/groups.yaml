    “叙述了十年中惊魂骇魄、迁徙流离之苦，花悲月惨，涕泪沾衣……” （黄钧宰《金壶七墨》) 在走投无路的情况下，吴卿怜于和珅自杀两天后上吊自尽，追随和珅而去，得年三十岁。


