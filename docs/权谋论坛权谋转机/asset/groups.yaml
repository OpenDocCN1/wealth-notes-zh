    李侍尧，八旗勋旧大臣之后，其父李元亮官至户部尚书。


    乾隆初年，李侍尧以荫生授印务章京。乾隆十四年，乾隆帝初见李侍尧，即夸其“天下奇才”，立擢副都统。此后，李侍尧又历任工部侍郎，户部侍郎，广州将军等职。乾隆二十一年后，李侍尧历任两广总督、户部尚书、湖广总督、工部尚书等高官，乾隆四十二年，李侍尧调任云贵总督，官至从二品。此人精明干练，颇有才略。《清史稿》评价他：“短小精敏，过目成篇。见属僚，数语即辨其才否。拥几高望，语所治肥瘠利害，或及其阴事，若亲见，从皆悚惧。”这是说他很会驾驭属僚，对他们的长短处尤其是“阴事”了解的清清楚楚，故属下都怕他。我想，这就为李侍尧之立功和贪贿'
