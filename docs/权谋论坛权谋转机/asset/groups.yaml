    盈千累万，甚至向属员妻卖珠子，赃私狼藉。如此不堪，实朕梦想所不到，不特朕用入颜面攸关，即各省督抚闻之谅无有不惭愧痛恨矣。”


    这一年四月初三日，“李侍尧专案组”的和珅、喀宁阿等奏请皇帝，拟将“李侍尧除挟势求索罪至满流，办理案件将承审官员呈供词任意删改，以致轻重失实，各轻罪不议外，按侵盗钱粮一千两以上例拟斩监侯”。和珅他们的意见说，即使不论李侍尧别的罪行，就是按侵盗钱粮一千两以上的罪行，就可以判处死刑缓期执行。五月初七日，大学士九卿核议奏拟从重改拟斩决，也就是说他们不同意和珅等“专案组”的意见，提出“将李侍尧即行正法”。


    然而，李侍尧案经大学士九卿核议具奏后，乾隆却没有批依议，也没有对此提出不同意见驳回重拟，而是于同日发上谕一道，一方面要求各督抚以李侍尧案为戒，一方面要求他们对此案发表各自意见，“毋得游移两可”。乾隆这一招极为老辣。当时，大多数督抚认为大学士九卿从重改拟斩立决的定案“洵属平允”“只有这样更足以惩一儆百，为诸臣之炯戒”，一致赞成将李侍尧从重请旨即行正法。两广总督富勒浑和江南河道总督陈辉祖的意见却被乾隆认为“自异其说”、“游移其辞”，有不同程度的欺君嫌疑而交部察议。惟有安徽巡抚闵鹗元直抒己见，极力主张留李侍尧一条活路。其实，闵鹗元猜准了乾隆帝不想杀李侍尧的心思，他认为李侍尧“勤劳久著”的这一点与乾隆帝想到了一起。因为李侍尧得以免死，可以使得乾隆在众臣僚面前洗去李侍尧进奉见长加恩从宽的嫌疑。


    ## 长期向上级输送财富


    李侍尧为官二十多年，是以进贡见长而备受众人瞩目的。乾隆帝也不得不承认，李侍尧和山东巡抚国泰贡品在同僚中最优。进贡，是中国古代社会的一个传统。贡品成为天子与诸侯间政治经济联系的纽带，也是臣工取悦于皇帝的主要手段之一。进贡主要有三种形式，一是朝贡，二是地方向朝廷进献的常贡，三是个人向皇帝的进贡。当然，并不是每个人都有资格向皇帝进贡的，具有进贡资格是社会地位和权力的象征。乾隆时期，有资格向皇帝进贡的人主要有六类，其中地方大吏包括总督、巡抚、将军、提督等。


    作为具有进贡资格的地方大吏，李侍尧从乾隆十八年任热河副都统起至乾隆四十五年，进贡次数有档可查的达一百二十多次。有学者统计，李侍尧一年之中进贡次数最多达九次。按例，督抚进贡只有年节三贡，但李侍尧进贡的次数和名目远远超出，其名目有迎銮贡、木兰贡、谢恩贡、传办贡、贺捷贡等。据考证，在今天故宫博物馆钦安殿御座前，立有一对髹胎珐琅太平有象香薰驮于象背之上，其通高174厘米，长102厘米，髹工极精，珐琅鲜艳如初，是广州髹胎珐琅的代表作之一。此对香薰就是李侍尧在乾隆四十一年(1776年)的进贡物品之一，至今还立于殿上熠熠生辉。


    进献贡品需要大投入，李侍尧在置办贡品时不但费心，更要花银的。譬如，李侍尧进贡龙袍要在苏州订做，龙袍、龙褂共九套，计银四百五十两。李侍尧仅在苏州置办古玩、玉器、龙袍等物，就用银二万三千多两。再如，李侍尧任两广总督时，在广东以紫檀木、花梨木、红木为基本材料加工制作宫廷家具进贡，这批家具从订制到完工花了二年多时间，工银花费自然不菲。如此频繁进贡，投入巨大，银从何来？按例，办贡费用应从官员养廉俸银中支付，除织造、盐官、关差每年有专门银两用来办赍外，所有臣工置办商品均由自己出资。但是，云贵总督岁给养廉也不过二万两左右，这二万两银也仅仅是李侍尧万寿供中一盘朝珠的价格。李侍尧自然不会自己掏腰包的，来源就是“众人头上刮”喽，他仅仅被查实勒索下属的银两就达三万多两。


    李侍尧上任云贵总督后，对云南钱局铸钱之事特别关心，常常亲自过问钱局的事情，并当众以钱局应有出息为由责难臬司汪圻。汪圻知道其中原委，立备三柄金如意送给李侍尧。但李侍尧并非满足，传话让汪圻每年必须奉上例银五千两。临安府、署东川府知府看见别的官员都送银给李侍尧办赍，知道李侍尧“素性傲戾，不讲情理，若不从便有祸患”，也连忙筹措银子交给道员庄肇奎送李侍尧。结果，庄肇奎发现银子尚未凑齐，离李侍尧交待的数额还差二千两，为避免惹麻烦，他不动声色地自己拿了二千两银补足了一万六千两，准时如数地将银子交给李侍尧家人带赴苏州办赈。这样，李侍尧的努力并没有白费。从他每年进呈贡品的单子里可以看出，其所呈上的贡品，颇受乾隆帝的喜欢，被驳回的数量极少，无怪乎乾隆帝夸他为“贡优奇才”。


    由此可以看出，精明的乾隆帝不想杀李侍尧，原因是多方面的。看中李侍尧的才干是一个方面，李侍尧婪赃大多与办赈有关也是一个方面。据有史家分析，乾隆让和珅来办理李侍尧案，似乎要借此扼制督抚以进贡为名而肥己的贪婪劣迹，一方面可以为皇帝纳贡正名，另一方面可以制止督抚贪婪日盛的势头。所以，乾隆在上谕中教训各督抚“须痛自梦省，毋谓查办不及幸逃法网，辄自以为得计。总之，有则改之无则加勉。触目警心，天良具在，人人以李侍尧为炯戒，则李侍尧之事未必非各督抚之福也。”


    乾隆四十五年（1780年）十月初三日，乾隆帝依阅闵鹗元的意见下谕，留下了李侍尧一条性命。《清史稿》记载说：“屡以贪黩坐法，上终怜其才，为之曲赦。”第二年初，乾隆帝派李侍尧任陕甘总督镇压回民起义。具有讽刺意义的是，同年五月又任命李侍尧查办甘肃布政使王亶望折监冒赈案。李侍尧感恩不尽，效力自然不在话下。然而，乾隆这一赦免之举，更推动了地方大吏以进贡为借口的侵贪之风。虽然皇帝屡颁谕旨停止进贡，但臣工们的进贡就从来没有停止过。公事废弛，贿赂公行，官官相护，进贡成了各级官吏“升迁倚仗”的法宝，与进贡相伴的官吏侵贪对清代吏治产生了恶劣的影响。


    ## 巧借领导名义


    李侍尧也建立了一整套的生财之路。乾隆既好财又好名，他担心民间骂他盘剥百姓。因此乾隆的规矩是留下珍宝的三分之二，剩余的三分之一退回给地方。即想当表子又想立牌坊，被乾隆退回来的那三分之一也回不到百姓的手里。李侍尧发的就是这个财，他每年都会给乾隆献宝。乾隆每次退回来的那一部分就落入了李侍尧自己的腰包，李侍尧利用这种方式一共弄了多少钱，已经没有详细的数字。


    ### 借他人之手


    李侍尧自己是汉军旗出身，在乾隆早期就开始进入官场，在和珅出现之前，李侍尧绝对是最得乾隆欢心的官员之一。正是由于这个原因，李侍尧这个没有功名的人也开始步步高升高，成为了总督、巡抚一级的封疆大吏。李侍尧在地方上确实有一些成绩，但他确实是一个贪官。在乾隆朝，好大喜功的乾隆皇帝喜欢各种稀奇的珍宝。作为地方大员，那些封疆大吏每年都会献给乾隆一批自己辖区内的珍宝。这明显是在赋税之外的一种变相摊派，李侍尧出任两广总督时，使用的也是这个办法。他自己不会拿一分钱，他会先各级政府在征收时，肯定会增加一部分，不经自己还要捞一分。所以说，在乾隆朝，对老百姓额外征收的费用，比赋税还高。


    李侍尧主政地方将近30年，每年都是这样，来来回回他究竟贪了多少，已经无法计算。在和珅崛起之前，李侍尧绝对是一只大老虎，这是毋庸置疑的。朝廷方面对此也不会不知道，只是他是乾隆的宠臣，每次弹劾都是不了了之。


    ## 领导者心里


    对噬噬国基的人，皇帝虽然很生气乃至生出杀气，内心却对他们有感情，常常放一马。这一点，和他们用强硬手段对付“谋反”的人是有些不同的。乾隆对李侍尧就是一例。据说，云贵总督李侍尧贪污索贿一案败露后，经钦差大臣和珅初审，定为“斩监候，秋后处决”，但大学士、九卿奉旨核议时，认为应从重，改为即行斩决。覆审报告送达皇帝那里，办事果断的乾隆皇帝不仅不再果断，而且相当犹豫。为什么犹豫？因为李侍尧乃乾隆的宠臣，乾隆帝不想让他这么死掉。乾隆最看重的不仅在于李侍尧对自己的忠诚，也看重李侍尧的能力。他曾多次当着其它臣子的面表扬李侍尧“天下奇才”、“最能办事”、“最会办责”，言外之意“人才难得”。一般而论，对领导宠幸、看重的人，集体讨论其善恶美丑时，讨论云云，只是一种形式，讨论者往往只是奴性地揣摩领导意图。因此，当大学士、九卿会审认为李侍尧应“请从重立决”时，乾隆很不满意。


    皇帝不满意，但又不想抛开“尊重律令”这块金字招牌，同时又需要装上倾听“众议”的姿态，没完没了召开商讨会议便是持有权力者爱用的一招。没完没了的讨论，会使人精神懈怠、崩溃，最后服从权力的意志，使权力者满意。


    不满意的乾隆，又命令“各省督抚议”，而督抚依然是“咸请如大学士九卿议”，主张从重处理，判斩立决。就在乾隆有点伤脑筋的时候，江苏巡抚闵鄂元(当时他还在安徽巡抚任上)主张给李侍尧一条活路。据《清史稿》云，闵鄂元是窥得了皇上的真实意图——“宽侍尧”，所以，他才别出心裁，与众不同地认为：“侍尧历任封疆，勤干有为，中外推服。请用议勤、议能例，稍宽一线。”闵鄂元做这样的表态，并不是毫无根据的乱说，而是有《大清律例》的“八议”做理论依据。


    所谓“八议”，包括“议亲”、“议故”、“议功”、“议贤”、“议能”、“议勤”、“议贵”、“议宾”等内容。《大清律例》的“八议”对象，实际说来都是统治集团的“亲贤勋旧”，他们即使犯了法，执行过程中的程序也与芸芸众生不同，法理上获得特殊待遇。


    “八议”的好处究竟有哪些，害处又如何理解，为什么自从它在三国曹魏时期入律以来，直到清朝都成为历代法典中的一项重要制度？只简单否定或苍白肯定，未免显得稚嫩和空洞。但就李侍尧一事来讲，“八议”使铁案迅速软化，最后乾隆皇帝下诏：“罪疑惟轻，朕不为已甚。”改斩监候。也就是说，李侍尧判了个死缓。至于那个闵鄂元，因为此事做得合于圣意，而被调任到富庶的江苏做巡抚。


    大约半年之后，乾隆寻了一个机会，李侍尧便走出监狱。乾隆皇帝授予他三品顶戴，命他赴甘肃“总办军务”，接着又任陕甘总督。自此李侍尧不仅获得了生命，仕途也相当坦顺。


    乾隆五十二年(1787年)，李侍尧又转任闽浙总督一职。《清史稿》称李侍尧虽“屡以贪黩坐法，上终怜其才，为之曲赦”。又曰：“侍尧眷遇尤厚，屡坐赃败，屡屈法贷之。盖特怜其才，非以其工进献也。”李侍尧病逝后，乾隆帝赐银祭葬，并赐谥号“恭毅”。李侍尧生前的所为所行，与死后备极哀荣的现实，如巨石投进湖里，荡起的涟漪由近及远，深刻影响着人心。


    乾隆对李侍尧的所作所为，粗看和他的治国理念有矛盾之处，因为这位皇帝一直认为：“劣员多留一日，则民多受一日之残，国多受一日之蠹”，“斧钺一日未加，则侵贪一日不止”。实际上，他对官员贪腐是有所区分的，并不认为李侍尧这类能臣之贪之腐和蠹国害虫有关联。乾隆时代，重能轻贤的倾向明显。乾隆中后期，士大夫的道德操守日益懈怠，官员不以清廉品节相尚，出于能员的贪官倒不乏其人。帝王的这种理念直接源于专制的皇权思想。因为专制体制下，皇帝需要的是听话的官员，哪怕他是一个贪官，但只要效性十足，效忠主子，也会得到恩宠。这些贪官，喜爱的只是财色酒，根本不会公然挑衅皇权，不会导致皇权不稳固。老百姓的日常生活虽然也是皇帝思考的，但与权力的垄断和独占比较起来，永远处于第二位，甚至是末位。这种逻辑，虽然没有一位帝王肯明确加以表述，但观其行为，却大多如此。而且愈到皇朝末期，那些皇帝秉持这种逻辑的痕迹愈明显，直至新王朝建立。


    缘何立国皇帝重贪吏甚于重臣子个人的能力？皆因他们亲眼见到腐败对国家的侵噬，亲眼看到官员的贪腐怎样激起民愤，亲眼见到贪腐怎样把老百姓逼上梁山，亲眼见到敌手如何推枯拉朽。所谓能臣创造的价值，与贪腐巨大的负效应比较起来，不仅不如九牛一毛，而且连皇朝的基础都敢于吞噬的人，哪里谈得上贡献？但第一代帝王耳闻目睹的事情，后代帝王则是仅有耳闻无缘目睹，久而久之也就有一搭没一搭了。以后新王朝循环往复，重走前朝路。


    反腐败与忍让腐败，实际总在纠缠乾隆的心智。究竟哪一个更可怕？是腐败可怕，还是将反腐败的措施诉诸社会更可怕？是宽恕李侍尧这样贪腐者可怕，还是将其一网打尽可怕？置腐败于何地，粗看是反贪坚决不坚决的问题，其实与如何治国相关。《清史稿》曰：“人君驭群臣，既知其不肖，乃以一日之爱憎喜怒，屈法以从之，此非细故也。”诚哉斯言！


    ## 洗钱黑变白


    “洗钱”一词的由来：20世纪20年代，美国芝加哥一黑手党金融专家开了一家洗衣店。他在每晚计算当天的洗衣收入时，就把其他非法所得的钱财加入其中，再向税务部门申报纳税。这样，扣去应缴的税款后，剩下的其他非法所得钱财就成了他的合法收入。这就是“洗钱”一词的由来。


    “洗钱”是指通过金融或其他机构将非法所得转变为“合法财产”的过程，一方面，通过洗钱，有组织犯罪掩盖了其犯罪活动踪迹，得以“正当地享受”犯罪所得；另一方面，洗钱为犯罪集团介入合法企业提供了资金，使其能够“以合法掩护非法”，不断扩大犯罪势力。


    和珅是中国洗钱“鼻祖”：尽管“洗钱”一词直到20世纪初才出现，但事实上，中国最早的洗钱犯罪雏形可以追溯到我国清朝乾隆年间。大贪官和珅开创了一项直到现在还在被广泛应用的洗钱手法。由于和珅位高权重，又深得乾隆皇帝的宠爱，所以想托和珅“办事”的人很多，和珅自然也不会放过这么一个发财的机会。但“受人钱财、与人消灾”时间不长，和珅意识到，送到家里的钱多了，太容易出问题。于是，他想出了一个办法——成立一间当铺，把家里不值钱的瓶瓶罐罐拿到当铺出售。每当有人想托和珅办事送礼的时候，就到和珅开的当铺以极高的价格赎出一件根本不值钱的东西，或者是以极低的价钱当掉一件极其珍贵的物件。这样一来，送给和珅的钱表面上根本没有经过和珅的手，钱都来源于他的当铺，都是正当收入，但合法的外表下，却掩盖行贿受贿的实质。当铺掌柜会定期向和珅进行汇报，当和珅发现谁送的钱多的时候，就会派人去问有什么事，然后利用手中的权利搞定。如此一来，和珅的不义之财安全地在他的当铺中越积越多。


