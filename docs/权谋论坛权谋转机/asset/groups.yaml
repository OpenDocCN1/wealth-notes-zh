    认知效果的作用上是不容忽视的。最先输入的信息作用最大，最后输入的信息也起较大作用。大脑处理信息的这种特点是形成首因效应的内在原因。首因效应本质上是一种优先效应，当不同的信息结合在一起的时候，人们总是倾向于重视前面的信息。即使人们同样重视了后面的信息，也会认为后面的信息是非本质的、偶然的，人们习惯于按照前面的信息解释后面的信息，即使后面的信息与前面的信息不一致，也会屈从于前面的信息，以形成整体一致的印象。当不同的信息结合在一起的时候，人们总是倾向于重视前面的信息。'
