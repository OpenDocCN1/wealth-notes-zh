    ## 恶人先告状


    和珅恶人先告状，妙用就在于抢在乾隆正式发难之前，先给他造成一种与己无关的假象：要么自己早就发现了别人举报的案件，要么自己就是被人蒙在鼓里，总之是“人不知而不咎”。这样，重大的责任就可以推脱干净了。剩下的类似不察之罪的小过失则不妨应承下来，不但不会有什么损失，反而能给乾隆留下好印象。恶人先告状，每见奇效，则是因为乾隆皇帝心中无论如何总是偏袒和珅。别人在他面前告和珅的状，他的第一反应是和珅得恩宠太多，遭人嫉妒了，实情如何先存在几分疑虑，等到和珅稍加辩解，就立刻觉得他说的有理有据，合情合理，对他的话马上深信不疑，纵使铁证如山，乾隆的想法也很难改变了。这种情形，在御史曹锡宝弹劾和珅管家刘全一案中表现的最为明显。


    他给乾隆上了一道奏折，说他知道了曹锡宝弹劾刘全的事，非常气愤，马上拷问刘全，刘全坚决否认有这些不轨之举，而他自己，虽然平素多有过失，对待家人却从来十分严厉，家人常因生活过于俭朴暗地里埋怨他，却从没出现过过于奢侈之事。料想刘全即使果真如曹锡宝所言，多有逾制之举，也是背着他所做的，他对刘全的所作所为并不清楚。这样，一方面把他自己开脱出来，既然他平日对家人甚严，那他的家人应该不会胆敢在外招惹事非；另一方面，也为开脱刘全做好了铺垫。乾隆听了和珅的话，马上就信以为真了，认为是曹锡宝逃税不成，公报私仇。这件事以曹锡宝被革职查办而告终，乾隆裁决到：“锡宝未察虚实，以书生拘迂之见，证为正言陈奏，姑宽其罚，革职留任。”就这样，在和珅的能言善辩面前，乾隆失去了往日的明察，被他的恶人先告状弄得是非不明，不辨黑白。


    恶人先告状指坏人或理亏的人抢先诉说或歪曲事实。鲁迅《两地书》：“经我强硬的答复，没法对付，便用最终的毒计，就是以退为进，先发制人，亦即所谓‘恶人先告状’也。”恶人先告状利用的就是首因效应。首因效应是指个体在社会认知过程中，通过“第一印象”最先输入的信息对客体以后的认知产生的影响作用。对于这种因信息输入顺序而产生的效应的现象，有种种原因不同的解释。一种解释认为，最先接受的信息所形成的最初印象，构成脑中的核心知识或记忆图式。后输入的其他信息只是被整合到这个记忆图式中去，即这是一种同化模式，后续的信息被同化进了由最先输入的信息所形成的记忆结构中，因此后续的新的信息也就具有了先前信息的属性痕迹。另一种解释是以注意机制原理为基础的，该解释认为，最先接受的信息没有受到任何干扰地得到了更多的注意，信息加工精细；而后续的信息则易受忽视，信息加工粗糙。


    实验心理学研究表明，外界信息输入大脑时的顺序，在决定认知效果的作用上是不容忽视的。最先输入的信息作用最大，最后输入的信息也起较大作用。大脑处理信息的这种特点是形成首因效应的内在原因。首因效应本质上是一种优先效应，当不同的信息结合在一起的时候，人们总是倾向于重视前面的信息。即使人们同样重视了后面的信息，也会认为后面的信息是非本质的、偶然的，人们习惯于按照前面的信息解释后面的信息，即使后面的信息与前面的信息不一致，也会屈从于前面的信息，以形成整体一致的印象。


