    乾隆三十四年，承袭三等轻车都尉。寻授三等侍卫，挑补粘杆处。四十年，直乾清门，擢御前侍卫，兼副总统。次年，遂授户部侍郎，命为军机大臣，兼内务府大臣，镶蓝旗用。又兼步军统领，充崇文门税务监督，总理行营事务。


    《清史稿·卷三百十九·列传一百六》


    和珅曾参加乾隆三十四年(1769 年)己丑年科举，但名落孙山。他以文生员承袭三等轻车都尉。具体来说，这是从事管理最卑微士兵的职位。由于和珅的精明能干，乾隆三十七年(1772
    年)，22 岁，十一月，被授予三等侍卫。终于在二十三岁的时候，得到一个机会，做了皇上的仪仗队的侍从。具体的工作是抬轿和举旗杆的。由于他懂得利用机会，在乾隆面前展示自己的才学，终于在四年后，当上了大臣。有一次，乾隆帝准备出外巡视，叫侍从官员准备仪仗。官员一下子找不到仪仗用的伞盖，急得不知道怎么才好。


    乾隆帝非常生气，眉头一皱，龙颜大怒，说道：“虎兕（sì）出于柙，龟玉毁于椟中，是谁之过？”官员们听到皇帝责问，吓得张口结舌。


    这时和珅说了：“是典守者不能辞其责耳。”和珅的大意是说，是守卫的责任。乾隆发现这个侍卫居然懂《论语》篇章，于是乾隆又顺带考了考和珅，结果和珅应答如流。乾隆对他另眼相看，开始加以提拔。这样的机遇看似偶然，但却是和珅带有先见之明的人为制造的结果。自此以后和珅正式进入乾隆皇帝的视野中，开始了他火箭般的升官之路


    # 靠近给你带来机遇的人


    在人的一生中，不能把注意力过多地集中在“机遇”上，而应放在提高把握客观规律的能力上。不能认为机遇会找上门来，所以自己就守株待兔。和珅的所有权力都是乾隆给的，他的人生因遇到乾隆皇帝而改变的，和珅更是不惜手段接近乾隆。


    打个比喻在正常情况下，狗是吃不上牛肉的。不管是身材还是力量，狗和牛都不在一个数量级上。狗即使成帮结伙，也难以战胜牛。在自然生态里，狗捕捉不到牛，当然就吃不到牛肉。狗吃牛肉纯粹是沾了人的光。狗投靠了人，成了人的帮凶，才吃上了牛肉。为了吃饭就出卖自由，这是狗的活法。所以狗成了最早被驯化的动物。狗的经验表明，当奴才是很实惠的，依附权贵，可以改善生活，消除生存的不确定性。古今如此，连狗都不例外。


    另外秘书也是见习领导。其官场经验是领导手把手教出来的。所以说，秘书与领导是一种师徒关系。俗话说，师徒如父子，秘书与领导的关系也是这种类似父子的共生关系。比朋友近，跟领导的家人差不多。一荣俱荣、一损俱损。
    领导走到哪里，秘书就跟到哪里。领导升官，秘书跟着上天；领导坐牢，秘书跟着下地狱。秘书跟领导，第一是要有忠心，第二是要会办事。把事办到领导发话之前，领导就会分外喜欢。领导退二线以前，一般会给秘书安排一个实惠的职位。年轻时秘书靠领导，年老时领导靠秘书，这与养儿防老是一个道理。领导老了，秘书还孝顺不孝顺，全靠秘书的人品和忠心。一般来说，秘书和儿子一样，不孝顺的多。不是领导走眼
    而是世态炎凉本来就是这样。老了摊上个孝顺的秘书，是领导在任上没作孽积下来的福气。当领导 就得往开了想，不管怎么说，秘书都得用，徒弟都的带。对于想当官，尤其


    是想当大官的人来说，一定要先给领导当秘书。正所谓不会当孙子的人，就当不了爷爷。秘书是当官最平稳的捷径。


    接近什么样的人就会走什么样的路,穷人带给你缩衣节食，小人带给你坑蒙拐骗，牌友只会催你打牌，酒友只会催你干杯，而成功的人会带给你成功，人生最大的是靠运气，不是中奖，不是捡钱，而是有人可以带你走向更高的平台，限制你发展的不是学历，也不是智慧而是你所处的生活圈和工作圈，以及你身边的人。


    # 积累知识


    想得到别人的赏识首先要积累足够的知识，平凡的人普天之下很多，为何和珅得到乾隆的赏识，无非就是他懂的你 也懂，他问的你也知道。


    猎人外出打猎，人们劝他装上子弹，他却大为恼火说：


    > “打猎的地方还远着呢，装一百发子弹都来得及！”


    走着走着，他看见一大群野鸭密密地浮在水面上，此时放枪，准能收获不小。可惜，就在他匆匆忙忙装子弹时，野鸭有了警觉，早已飞得无影无踪迹。


    猎人失去猎物，只因为他把“机遇”放在了“口袋”里。人 只能去等待机遇，而机遇却是从来不等人的。


    在等待的过程中，你需要不断地加强学习，努力提高自身素质，才会抓住和创造机遇。所谓“工欲善其事，必先利 其器”，说的就是这个道理。说到底，人要是想抓住机遇，


    必须要有真才实学。


    # 善于表现自己


    一个人的才华，唯有显现出来，为人所知，才可能成就事业，然而古人云：“木秀于林，风必摧之。”才华的展示，往往会招来平庸之辈的嫉妒与摧折，机遇与风险并存，想要把握机遇，必须勇于担当由此要能带来的风险，放开胆子，一往无前，畏手畏脚的人只会看着大好时机在眼前溜走，时机只会青睐那些勇敢的人。


    和珅在他 23 岁时，被授为三等侍卫，后来以被挑选进入粘杆处，粘杆处又称为上虞备用处，即是皇家的仪仗队，皇帝的出巡等一切仪仗事宜都由上虞备用处负责 和珅由此得以经常有机会在皇上身边，一般的侍卫都安于现状，不思进取，加上“
    伴君如伴虎 “的古训，整日唯唯诺诺、小心谨慎、唯恐一时差错，招来杀身之祸，更别说敢在皇帝面前直陈已见了，而这正是和珅等待的机会。


    清人陈康祺在《郎潜记闻》中记录了和珅发迹的过程 “一日警驿出官，上偕于舆中阅边报，有奏要犯脱逃者，上微愠，谕《论语》虎兕出于柙语。虑从诸校尉及期门羽林之属，咸愕贻，互询天子云何。和珅独曰：‘
    爷谓典守者不能辞其责耳 ’。上为霁颜问：‘ 汝读《论语》乎？ ‘对曰：‘ 然 ’。又问家世年岁，奏对皆称旨，自是恩礼日隆。”


    可以看出，当皇上发怒，众人惊愕，惶恐不安的时候，和珅敢于挺身而出，勇于应答，才把握住了这一稍纵即逝的时机，只要我们想想，和珅面对的是一言九鼎的封建帝王，稍有不慎就有可能身首异处，就不得不佩服他过人的胆识了。


    和珅自从被乾隆发现以后，就凭着自己的才思敏捷，精明干练，一次次在乾隆面前加以展示，使乾隆对他的良好印象愈来愈巩固，对他到了坚信不疑的地步，这种几十年如一


    日的努力，就绝非一般的弄臣之流可及的了。


    # 投其所好


    和珅对乾隆的脾气、爱好、生活习惯都了如指掌，可以想乾隆之所想，为乾隆之所欲为。甚至乾隆尚未想到的，他也可以预先想到，据朝鲜使臣的记载：乾隆每问和珅一件事。和珅不但能立即回答的有条有理，而且还能把事情的前后经过，来龙去脉说的―清二楚，怎能不让皇帝喜欢呢。乾隆因此就逐渐养成了任何事情都要询问和珅的习惯，对他的话不会有丝毫疑心，远远胜过朝中其他的大臣。


    乾隆皇帝还爱夸耀自己的文采，喜欢吟诗作赋，和珅早年便已对乾隆的诗作下过一番功夫，对他作诗的风格、用典、喜用的词句都知道的一清二楚。他偶尔会在乾隆面前表现一下自己对诗文的偏爱，甚至闲瑕时以“骚人”自居，与和珅同时代的钱泳曾评价他的诗说：他的诗偶有佳句，很通诗律，和珅的诗作统统合乎乾隆的审美趣味，乾隆阅后，怎能不喜，


    很多时候就命和珅即景赋诗，以代替自己亲来了。在和珅的诗集《嘉乐堂诗集》中就有很多首是奉乾隆皇帝的命令所为。


    乾隆皇帝喜好虚荣，贪图享乐，讲究排场，和珅便投其所好，百般逢迎。乾隆每次巡幸江南，木兰秋狝，东巡祭祖，祭陵等出行，和珅总是尽力陪侍在侧，鞍前马后，不辞劳苦，出巡的费用，和珅想出了种种办法广开财路，减轻了内务府的负担，尽量少用国库的银两，令乾隆非常高兴。他还抓住乾隆讲究排场的心理
    积极筹划为他扩建圆明园 避暑山庄，修缮皇宫内殿，等皇家宫院，使乾隆的虚荣心得到了极大的满足，视和珅为心腹。


    和珅知道乾隆喜爱收藏古玩、字画、对于文物有着特殊的偏爱。于是便挖空心思四处搜罗奇珍异宝，向乾隆进献，天长日久，向和珅行贿的人也都知道“和相”性喜收藏，一件珍稀的古玩在和珅眼里往往可以胜过两万黄金，于是，全


    国各地的珍玩迅速的聚拢到和珅手中，和珅得以从容的从中择选出精品，进献乾隆。乾隆四十五年，朝鲜来访的使臣就曾记下了他见到和珅向皇帝进献金佛的过程：“京城内有佛铺子，互相卖买，朝臣用此做为贡献，皇帝亦以赏赐贵臣。于秋节晨朝，有进贡覆黄帕架子，盛以金佛一座，长可数尺许，异入阗中，闻户部尚书和珅所献。”


    由此种种，和珅得到了乾隆空前的信任真可谓是“用而不疑，疑而不用。”对满朝大臣对和珅的不满，弹劾和珅的奉章视而不见，置若罔闻，甚至对弹劾之人加以打击、压制。每每这种时候，乾隆首先想到的是某人嫉妒和珅的精明能干，嫉妒自己对他的宠信要拆散他的左膀右臂。绝不会想到和珅的所作所为有什么不当之处
    和珅在他眼中俨然一位忠心耿耿遂招致同僚不满的忠臣。时间一久朝中逐渐很少有人再敢参奏和珅。和珅更加专横跋扈，地位甚至超过了亲王、


    皇子。正如在乾隆晚年来使的英国人马戛尔尼所见：‘（皇帝）刚燥之性，仍不以此少减，即如现在所有皇子，仅止四人，而此四人之中，乃无一人能略握政柄。宁举全国政柄，界诸相国和中堂一人，而绝不计将来承继问题，其意见如何，颇非他人所能揣测，然论者每谓现有之皇子四人，均为皇帝所不喜之。”由此可见，乾隆皇帝对和珅的依赖和信任。远远超过了他对他自己儿子的儿子。


    # 形象加分


    据《清官遗闻》和《清朝野史大观》记载：乾隆做太子的时候，一次因事进宫，看到父王雍正的一个妃子娇艳无比，正对镜梳妆，不禁想和她开个玩笑，于是就从后面用双手捂住了那个妃子的眼睛，妃子不知就里，遂用梳子往后击打，正好打到了乾隆的额头上。乾隆的母亲后见了，就说那个妃子调戏太子，将她赐帛自尽。乾隆觉得对不住这个妃子，就用朱砂在妃子的颈上点了一下，悲痛地说：“我害尔矣，魂而有灵，俟二十年后，其复与吾相聚乎？”


    后来，和珅入宫侍驾，乾隆越看和珅越像那个冤死的妃子，验其项颈，果见其颈上有一红色胎记。叩其年龄，也与那妃子死去的时间相合，正是25年。乾隆愈发吃惊，遂认为和珅就是那冤死的妃子之后身所化。为偿还年轻时的“孽债”，后来乾隆还把自己疼爱的十公主许配给了和珅的儿子


    丰绅殷德, 宠幸大臣加上皇亲国戚的身份, 让和珅的心境发生了变化。


