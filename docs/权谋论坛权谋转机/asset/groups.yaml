    # 巧借领导名义


    李侍尧也建立了一整套的生财之路。乾隆既好财又好名，他担心民间骂他盘剥百姓。因此乾隆的规矩是留下珍宝的三分之二，剩余的三分之一退回给地方。即想当表子又想立牌坊，被乾隆退回来的那三分之一也回不到百姓的手里。李侍尧发的就是这个财，他每年都会给乾隆献宝。乾隆每次退回来的那一部分就落入了李侍尧自己的腰包，李侍尧利用这种方式一共弄了多少钱，已经没有详细的数字。'
  - '[PAGE 96]


    # **借他人之手**


    李侍尧自己是汉军旗出身，在乾隆早期就开始进入官场，在和珅出现之前，李侍尧绝对是最得乾隆欢心的官员之一。正是由于这个原因，李侍尧这个没有功名的人也开始步步高升高，成为了总督、巡抚一级的封疆大吏。李侍尧在地方上确实有一些成绩，但他确实是一个贪官。在乾隆朝，好大喜功的乾隆皇帝喜欢各种稀奇的珍宝。作为地方大员，那些封疆大吏每年都会献给乾隆一批自己辖区内的珍宝。这明显是在赋税之外的一种变相摊派，李侍尧出任两广总督时，使用的也是这个办法。他自己不会拿一分钱，他会先各级政


    府在征收时，肯定会增加一部分，不经自己还要捞一分。所以说，在乾隆朝，对老百姓额外征收的费用，比赋税还高。


    李侍尧主政地方将近 30 年，每年都是这样，来来回'
  - '[PAGE 97]


    回他究竟贪了多少，已经无法计算。在和珅崛起之前，李侍尧绝对是一只大老虎，这是毋庸置疑的。朝廷方面对此也不会不知道，只是他是乾隆的宠臣，每次弹劾都是不了了之。'
