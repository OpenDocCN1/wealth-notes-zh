    任陕甘总督。自此李侍尧不仅获得了生命，仕途也相当坦顺。


    乾隆五十二年(1787 年)，李侍尧又转任闽浙总督一职。《清史稿》称李侍尧虽 “屡以贪黩坐法，上终怜其才，为之曲赦”。又曰：“侍尧眷遇尤厚，屡坐赃败，屡屈法贷之。盖特怜其才，非以其工进献也。”
    李侍尧病逝后，乾隆帝赐银祭葬，并赐谥号 “恭毅”。李侍尧生前的所为所行，与死后备极哀荣的现实，如巨石投进湖里，荡起的涟漪由近及远，深刻影响着人心。


    乾隆对李侍尧的所作所为，粗看和他的治国理念有矛盾之处，因为这位皇帝一直认为：“劣员多留一日，则民多受一日之残，国多受一日之蠹”，“斧钺一日未加，则侵贪一日不止”。实际上，他对官员贪腐是有所区分的，并不认为李侍尧这类能臣之贪之腐和蠹国害虫有关联。乾隆时代，重能轻贤的倾向明显。乾隆中后期，士大夫的道德操守日益懈怠，'
  - '[PAGE 102]


    官员不以清廉品节相尚，出于能员的贪官倒不乏其人。帝王的这种理念直接源于专制的皇权思想。因为专制体制下，皇帝需要的是听话的官员，哪怕他是一个贪官，但只要效性十足，效忠主子，也会得到恩宠。这些贪官，喜爱的只是财色酒，根本不会公然挑衅皇权，不会导致皇权不稳固。老百姓的日常生活虽然也是皇帝思考的，但与权力的垄断和独占比较起来，永远处于第二位，甚至是末位。这种逻辑，虽然没有一位帝王肯明确加以表述，但观其行为，却大多如此。而且愈到皇朝末期，那些皇帝秉持这种逻辑的痕迹愈明显，直至新王朝建立。


