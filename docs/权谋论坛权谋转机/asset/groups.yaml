    远远超出，其名目有迎銮贡、木兰贡、谢恩贡、传办贡、贺捷贡等。据考证，在今天故宫博物馆钦安殿御座前，立有一对髹胎珐琅太平有象香薰驮于象背之上，其通高 174
    厘米，长 102 厘米，髹工极精，珐琅鲜艳如初，是广州髹胎珐琅的代表作之一。此对香薰就是李侍尧在乾隆四十一年( 1776 年）的进贡物品之一，至今还立于殿上熠熠生辉。


    进献贡品需要大投入，李侍尧在置办贡品时不但费心，更要花银的。譬如，李侍尧进贡龙袍要在苏州订做，龙袍、龙褂共九套，计银四百五十两。李侍尧仅在苏州置办古玩、玉器、龙袍等物，就用银二万三千多两。再如，李侍尧任两广总督时，在广东以紫檀木、花梨木、红木为基本材料加工制作宫廷家具进贡，这批家具从订制到完工花了二年多时间，工银花费自然不菲。如此频繁进贡，投入巨大，银从何来？按例，办贡费用应从官员养廉俸银中支付，除织造、盐官、'
  - '[PAGE 92]


    关差每年有专门银两用来办赍外，所有臣工置办商品均由自己出资。但是，云贵总督岁给养廉也不过二万两左右，这二万两银也仅仅是李侍尧万寿供中一盘朝珠的价格。李侍尧自然不会自己掏腰包的，来源就是“众人头上刮”喽，他仅仅被查实勒索下属的银两就达三万多两。李侍尧上任云贵总督后，对云南钱局铸钱之事特别关心，常常亲自过问钱局的事情，并当众以钱局应有出息为由责难臬司汪圻。汪圻知道其中原委，立备三柄金如意送给李侍尧。但李侍尧并非满足，传话让汪圻每年必须奉上例银五千两。临安府、署东川府知府看见别的官员都送银给李侍尧办赍，知道李侍尧“素性傲戾，不讲情理，若不从便有祸患”，也连忙筹措银子交给道员庄肇奎送李侍尧。结果，庄肇奎发现银子尚未凑齐，离李侍尧交待的数额还差二千两，为避免惹麻烦，他不动声色地自己拿了二千两银补足了一万六千两，准时如数地将银子交


