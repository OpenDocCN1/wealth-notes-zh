    终的毒计，就是以退为进，先发制人，亦即所谓“恶人先告状”也。”恶人先告状利用的就是首因效应，首因效应是指个体在社会认知过程中，通过“第一印象”最先输入的信息对客体以后的认知产生的影响作用。对于这种因信息输入顺序而产生的效应的现象，有种种原因不同的解释。一种解释认为，最先接受的信息所形成的最初印象，构成脑中的核心知识或记忆图式。后输入的其他信息只是被整合到这个记忆图式中去，即这是一种同化模式，后续的信息被同化进了由最先输入的信息所形成的记忆结构中，因此后续的新的信息也就具有了先前信息的属性痕迹。另一种解释是以注意机制原理为基础的，该解释认为，最先接受的信息没有受到任何干扰地得到了更多的注意，信息加工精细；而后续的信息则易受忽视，信息加工粗糙。


