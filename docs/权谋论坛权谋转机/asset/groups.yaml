    ## 《旍机近志·第二卷》


    吴卿怜苏州女子，又称苏卿怜，出身低微，但能歌善诗词，色艺兼胜，早年在苏州做歌女。十五岁时，被苏州知府王亶望纳为妾。乾隆四十六年 (1781)，王亶望因虚报数百万以上旱灾被劾诛死，(苏卿怜若生于
    1769 年，则至 1781 年王亶望被诛时为十二岁，这与上句十五岁被王亶望纳妾矛盾。若生辰无误，则十五岁被纳妾一说有误。) 吴卿怜为戟门侍郎蒋锡桂得之，献于和珅。当和珅擅权纳贿、贪赃枉法，网罗亲信，祸国害民而被抄家时，吴卿怜吓得六神无主，连夜写下一组自诉之诗，诗中
    “叙述了十年中惊魂骇魄、迁徙流离之苦，花悲月惨，涕泪沾衣……” （黄钧宰《金壶七墨》) 在走投无路的情况下，吴卿怜于和珅自杀两天后上吊自尽，追随和珅而去，得年三十岁。


    ## 困难时候伸手


    自小对妓女这一名词的认知就只停留在书本和电视剧中，尽管妓女也分成三六九等，但还是从心底里厌恶这一职业的所有女性，潜意识里认为是不好的人，却不知古代妓女中的豪杰也不少，有的是因为身世的原因不得已成为了妓女，而有的只是卖艺不卖身。今天小编跟大家讲的是一个比较悲情的妓女，她虽然有令别人羡慕的美貌，但却有着无比悲惨的身世，她就是吴卿怜。


    她的命运同许多漂泊的妓女一样，出身于贫穷的家庭，如果她不是出生在这样的家庭，而是出生在富贵人家或许就有不一样的人生。人家的子女都是教养良好准备进宫当贵人的，而她并没有这个机会，家里贫困的时候，家人一般只会把女子卖了赚点钱，又因为她长得实在好看便被一个老鸨看中带回馆中。


    当时老鸨很喜欢这个女子，并感叹她将来必定有很大的出息，所以老鸨在她的身上花了很大一番功夫去培养她，找了很多名人师傅去传授给她琴棋书画、舞蹈礼仪，而吴卿怜也学得非常快，很快就成了那一片的名人。很多男子都是因为她名声所以想要看到她的真人。她的美不是俗气的美，而是腹中的才气使她的身上也有书卷的气味，这种类型最受当时的才子喜爱，所以每天被她的名声吸引的人不计其数。


    后来又有一个大官看到她之后就移不开眼睛了，当场陷入不能自拔的境地。并且立刻为她赎身，没有把她隐匿在外边，而是立刻把她带回了家中，之后吴卿怜就成了王亶望的小妾，那个时候吴卿怜只有十五岁。虽然王亶望的权势很大，可是她也只是众多小妾中的一个，最开始的激情褪去之后也就没什么热情了，毕竟吴卿怜对男女之事还比较羞涩，没有其他小妾那么熟练到可以讨得王亶望的欢喜。


    后来就在吴卿怜对未来迷惘时，王亶望的贪污被别人告发到皇帝面前，就这样王亶望立即被皇帝下旨处死，还未成年的吴卿怜就变成了一个无依无靠的人。就在她还没来得及哭泣时，又被另一位大臣看中，没有因为她伺候过别人而嫌弃她，依旧把她带回府中作为妾室。也许是因为吴卿怜实在是太抢手了，如果不立刻带走并给予她名分的话她会被别人抢走。


    之后吴卿怜就又成了蒋侍郎的宠妃。吴卿怜肯定无数次在心里思考为什么我每次都只能做别人的妾，主要她每次遇到的都不是好人。蒋锡桂虽然对吴卿怜也非常喜爱，把她带回家中之后几乎就是独宠她一人，但蒋侍郎也是一个负心的人，不知道从哪打听到和珅的喜好，就想要借吴卿怜发一次财。为了他的官途他就把吴卿怜献给了当时的大官，也就是当时最大的贪官和珅。和珅对于他的献媚当然不会拒绝，立刻就接受了吴卿怜。


    就这样吴卿怜辗转反复就又到了和珅的身边。和珅在朝野的势力可谓无人能及，他对于貌美的吴卿怜也是喜爱得很。要说吴卿怜跟了和珅这样有权势的人也算是有面子了，她在和珅府里的恩宠无人能及，金银珠宝也被和珅源源不断的送给她，别人见了她也不得不讨好，如果这样下去给和珅生个孩子也就有了依靠了。


    ## 征服她的胃


    和珅讨好小妾很有一套，很有生活情趣，古时有千金难买一笑的说法，和珅为了讨小妾的欢心，也不惜使出浑身解数，甚至把讨好主子乾隆的手段都用上了，比如说其中一个爱妾爱吃荔枝，生性吝啬的和珅为了讨好小妾，不惜叫下属用快马把荔枝从广东运到京城来。依稀为唐时明皇讨好杨贵妃之遗风。几个小妾在和珅的蓄意讨好之下，对他更加依赖了，因此在和珅被嘉庆赐死之后，好几个小妾都为他自杀殉身了。


