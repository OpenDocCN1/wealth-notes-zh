    # 上学时处一个对象


    清朝把随清军入关的满人分为八旗，其中，和珅属正红旗，在注重门第的清朝社会中，已属平常，他的父亲常保官职不高，仅因为堂叔啊哈顿色跟随康熙皇帝出征准葛尔时，英勇阵亡，常保才得以承袭一等云骑尉的世职。常保至乾隆是出任福建都统，多年戍守在外，官职低微，家资也不丰厚，等到他在福建任上病故的时候
    和珅一家立刻失去了所有的经济来源，变的困窘不堪。和珅兄弟四处举债，才能够进入当时最好的学校咸安宫官学读书。所以以和珅的出身，如果不是他善于把握机遇的话，很有可能会平凡的终此一生。


