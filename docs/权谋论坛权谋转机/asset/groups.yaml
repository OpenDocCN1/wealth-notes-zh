    晓妆惊落玉搔头（正月初八日，晓起理鬓，惊闻籍没），宛在湖边十二楼（王中丞抚浙时，起楼阁饰以宝玉，传闻迷楼，和相池馆皆仿王苑）。


    确定暗伤楼外景，湖边无水不东流。


    香稻入唇惊吐日（和处查封，有方餐者，囚掠吐哺），海珍列鼎厌尝时（王处查封，庖人方进燕窝汤，列屋皆然，食厌多陈几上，兵役见之纷纷大嚼，谓之洋粉云）。


    蛾眉屈指年多少，到处沧桑知不知。


    缓歌慢舞画难图，月下楼台冷绣褥。终夜相公看不足，朝天懒去情人扶。


    莲开并蒂岂前因，虚掷莺梭廿九春。回首可怜歌舞地，两番俱是个中人。


    最不分明月夜魂，何曾芳草怨王孙。梁间燕子来还去，害杀儿家是戟门。


    白云深处老亲存，十五年前笑语温。梦里轻舟无远近，一声款乃到吴门。


    村姬欢笑不知贫，长袖轻裾带翠颦。三十六年秦女恨，卿怜犹是浅尝人。


    冷夜痴儿掩泪题，他年应变杜鹃啼。晞时休向漳河畔，铜爵春深燕子栖。


