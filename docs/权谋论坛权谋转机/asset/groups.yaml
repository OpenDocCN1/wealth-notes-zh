    # 历史背景


    四十五年，命偕侍郎喀凝阿往云南按总督李侍尧贪私事。侍尧号才臣，帝所倚任。和珅至，鞫其仆，得侍尧婪索状，论重辟，奏云南吏治废弛，府州县多亏帑，亟宜清厘。上欲用和珅为总督，嫌于事出所按劾，乃以福康安代之。命回京，未至，擢户部尚书、议政大臣。及复命，面陈云南盐务、钱法、边事，多称上意，并允行。授御前大臣兼都统。赐婚其子丰绅殷德为和孝公主额驸，待年行婚礼。又授领侍卫内大臣，充四库全书馆正总裁，兼理藩院尚书事，宠任冠朝列矣。


    # 《清史稿·卷三百十九·列传一百六》


    三月，和珅、喀凝阿到云南。和珅选择李侍尧的“家人”(古时称仆人为“家人”)张永受作为李侍尧案的突破口，刑讯张永受，他终于开口说话，交代了李侍尧以下罪状：借办'
  - '[PAGE 71]


    贡品和派人回京城修房屋之名，向下属勒索银两；将珍珠卖给下属，收取银两后，又索回珍珠等等，勒索下属银两共计 3 万余两。李侍尧被革职拿问，由和珅将其解京审讯。主动或被迫送银子给李侍尧的下属们一并革职，审问定罪后，均被送新疆伊犁充当苦役。李侍尧在云南的住所被查抄，计金银、珠宝、洋货、名画共
    901 项，也由和珅押解进京。


    因成功办了此案，和珅更得乾隆帝赏识、宠信。和珅向乾隆帝奏报，云南吏治废弛，府、州、县官库多亏空银两，亟宜清查、整顿。乾隆帝拟委派和珅为云南总督，让他来解决云南的问题，只是考虑到前任云南总督李侍尧是和珅查办的，不宜由和珅接替李侍尧，乃改由福康安接任云南总督。在回京的路上，和珅就被提拔为户部尚书、议政大臣。和珅完成使命，向皇上汇报情况，涉及云南食盐管理、钱币制度、边境事务，说得头头是道，符合皇上旨意。乾隆帝当场表态，'
