    # **学习有用的东西**


    和珅的博闻记在中国的封建社会中也许并不罕见。由唐朝开始的科举制度，到了清朝已经日臻完善，也更加僵化。不只是儒家传统的典籍，朱熹的注也一样成为经典，所以，读书人将朱子的注解一同背诵下来的，也有很多。和珅在经典上的才学比起与他同朝的清燧，纪晓岚来，未免还是差的很多。


    但是和珅自有他的过人之处。要想在人材济济，竞争激烈的朝廷中出类拔萃，就必须有别人所没有的才能，必须赴到，别人无法取代的作用。


    乾隆一朝民藏、蒙关系密切，经常有文书往来，然而朝臣中却少有人懂得这两种文字。和珅在成安官官字中，不畏艰深努力研修精通汉、满、蒙、藏四种文字，往往在紧要关头，挺身而出，令人刮目相看。'
  - '[PAGE 26]


    乾隆七十寿诞之时，朝廷上下都在紧张的安排祝寿典礼。恰在此时，西藏六世班禅飞骑呈来一份文书。乾隆接过文书，却是藏文，随行的众位官员无一人懂得。乾隆立刻威到了和珅的重要，派人火速传他前来。


    和珅到来后，拿起信，随即念道：“小僧自动仰承文殊菩萨大皇帝拳养之恩，不胜尽数，非他人所能比。小僧乃一出家人，无以极称，虽然每日祝祷文殊菩萨大皇帝金莲座亿万年牢固，并让众喇叭等啭经祈祷，但仍时时企望见文殊菩萨大皇帝。庚子年为大皇帝七旬万寿，欲往称祝，特致书皇帝膝前，以达敝意。”


    乾隆听罢大喜。人生七十古来稀，七十大寿若有班禅额班诵经，宣扬佛教，会见蒙藏王公贵族，一人来朝而万众归心，必然会使祝寿活动大放异彩。当即命和珅拟诏。和珅用满、藏、汉三种文字拟好了诏求。乾隆见了更是高兴，又命'
