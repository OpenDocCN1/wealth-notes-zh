    ## 故事二：南园遗爱，故剑情深的刘病已


    汉宣帝刘询是西汉中兴之主，早年在权臣霍光的支持下登上了帝位。一开始刘询对他都是言听计从，百依百顺的。就只有一件事例外，这就是立皇后。当时众公卿都认为霍光之女是最好的皇后人选，甚至于集体上书。这时候，皇帝却下了一道莫名其妙的诏书：“我在贫微之时曾经有一把旧剑，如今我十分的想念它啊，众位爱卿能否为我将其找回来。”群臣揣摩上意，开始一个个请立许平君为皇后。许平君与刘询于公元前
    75 年成婚，前 74 年生下后来成为汉元帝的刘奭。


    至此，宣帝如愿以偿。依例，皇后的父亲一定要封侯，但霍光却始终不允。后来才封了个“昌成君”。故剑情深的浪漫典故从此开始流传，这是中国历史上一道最浪漫的诏书，王子对贫女的许诺。


    霍光死后，霍家的势力还很大，霍家的亲属和亲信还控制着中央政府的各个机要部门，兵权也掌握在他们手中。为此，汉宣帝采取一系列行动，剥夺霍家把持的权力。


    面对汉宣帝全面夺权的行动，霍家集团内部惶恐不安，决定铤而走险，举行叛乱，推翻汉宣帝，保住他们的既得利益。


    但叛乱在严阵以待的汉宣帝面前很快瓦解了。汉宣帝大规模地镇压了霍氏集团的叛乱，将参加叛乱的人都处以极刑，并废除了霍皇后（霍光次女霍成君），在西汉朝廷中盘踞了十几年的霍家势力一朝覆灭，汉宣帝最终确立了他的绝对统治。


    ## 故事三：“周公在世”的王莽


    王莽，字巨君，魏郡元城人，新显王王曼长子、西汉孝元皇后王政君的侄子。王莽为西汉外戚王氏家族的重要成员，其人谦恭俭让，礼贤下士，在朝野素有威名。西汉末年，社会矛盾空前激化，王莽被朝野视为能挽危局的不二人选，被看作是“周公再世”。很快，为了登上帝位，王莽开始撕开他的面具，大肆屠杀异己，不久后建立新朝，建元“始建国”，宣布推行新政，史称“王莽改制”。


    王莽统治的末期，天下大乱，新莽地皇四年，更始军攻入都城长安，王莽死于乱军之中。而新朝也成为中国历史上很短暂的朝代之一。


    ## 故事四：“以狐媚取天下”的司马懿


    司马懿，三国时期辅佐曹魏四代君主的重臣，早年被曹操视为不安于人臣的隐患，晚年又被曹睿临终托孤，委以重任。他用五十年的时间来证明我是个忠臣，最后却重演了曹家篡汉的一幕。


    司马懿晚年通过高平陵政变，消除了由曹爽领导的曹氏宗室在朝中的势力，曹氏宗室力量日渐薄弱，司马氏得以完全掌握了权力，控制了曹魏朝政，逐步消灭支持曹氏的势力，向篡夺曹魏政权的目标前进，为日后司马炎代魏立晋莫下了根基。


    ## 故事五：嗜杀的北齐高洋


    北齐高洋，没继位之前，在众人面前装弱智，脸上永远挂串鼻涕——及长，黑色，大颊兑下，鳞身重踝。（不但貌丑，且怪）“内虽明敏，貌若不足”（人不好看连智商都会被人无视）“神武以帝貌随，神彩不甚发扬。


    兄弟们都把他当作傻瓜看待，在减弱他们戒备心的同时，甚至他最喜欢的妻子李祖娥被哥哥高澄调侃，他仍然忍气吞声。同时偶尔展露能力博得父亲高欢的欢心，又尝令诸子，各使理乱丝，帝独抽刀斩之，曰：“乱者须斩。”神武以为然。（“快刀斩乱麻”事件，高欢觉得高洋见解独特，有魄力）。


    到后来夺取王位后，便露出真面目了，强行和高澄遗孀静德皇后发生关系，之后看上父亲的宠妃尔朱氏，想要用强，被其母娄太后制止，高洋竟还想将母亲嫁给胡人。之后高洋变本加厉，在金銮殿上设有一口锅和一把锯，每逢喝醉了酒，必须杀人才能快乐。而他从早到晚都在喝醉，所以他必须从早到晚不停地杀人。宫女宦官和亲信每天都有人惨死在他的盛怒之下。


    ## 故事六：木讷孤僻的唐宣宗


    唐宣宗李忱从小就孤僻木讷，一直被皇宫里的人当作傻子嘲弄，在当上皇帝之前几乎从未享受过真正的亲王待遇。可谁也想不到，三十六岁登基之后，唐宣宗突然爆发出前所未有的聪明与英武，短短一年，就消灭了为患大唐帝国长达半个世纪的牛李党争，而且遏制了一贯嚣张跋扈的藩镇势力和宦官势力，收复了沦陷于吐蕃人手里近百年的河、湟全境，缔造了唐朝中晚期的最后一抹辉煌。简直把古代“扮猪吃老虎”运用到极致。


    ## 故事七：装疯卖傻的朱棣


    朱允炆上台后听信齐黄等人的建议实行“削藩之策”。削藩手段也很是毒辣，前几个藩王不是被杀就是被逼死。


    装疯，目的是为了博取同情心！自古以来，藩王造反很难成功，冒天下之不韪，是没有民心的，想要成功必须要民心，要民心就可以通过博同情心。如果朱棣装疯，那么人们心里会这样觉得：父亲去世，侄子步步紧逼，把叔叔们逼得死流放的流放，如今还到了不得不依靠装疯卖傻来苟延残喘的境地。北平的人心会慢慢倾向他，天下人都会开始同情他。而且必先朝廷先动手，士兵们会感到：侄子连一个装疯的叔叔都不放过，简直灭绝人伦。这个时候的朱棣即使造反，也不太会看成十恶不赦的乱臣贼子。


    一系列的计划确定后，从此朱棣每日都去王府外的大街上装疯卖傻，风雨无阻。建文四年，朱棣带兵攻下南京，杀入皇宫，朱允炄葬身于一片火海之中，是死是逃至今是迷。


    ## 从身边人下手


    和珅这次反贪，主要经验是反贪要选准突破口。他选的突破口是深知内情的仆人。撬开了仆人的嘴，掌握了大量线索和证据，然后扩大战果，查办对象就难以守住自己的防线。


    **和珅的“反腐高招”告诉我们，一个官员若贪腐，是瞒不过身边人的。不法的事，他不便直接出面去做，常常要借身边人之手。这样，他做的见不得人的事，便为身边人所掌握。一般情况下，身边人会为他保守秘密；然而，当身边人受到审查时，为自保，会供出所掌握的主子的情况。**
    所以，撬开家奴的嘴，是彻查贪官罪行的好办法。


    这办法果然奏效，几天下来，他就收集到了一些证据，然而，这些证据全都不怎么重要，远不足以置李侍尧于死地，和珅不肯就此罢休，开始打李侍尧的大管家赵一恒的主意，赵一恒身为李府的大管家，所有财物交易必经他手，如果能敲开他的嘴巴，整个案件就可以水落石出了。


    和珅命人绑来了赵一恒，严刑逼供，赵一恒起初还拼死抗争，拒不招认，后来终于奈不住痛楚，把李侍尧的所作所为——向和珅作了交待，和珅有了坚实的证据，心里就有了底，踏实下来。他把赵一恒交待的事项笔录下来，又命人召来了云南李侍尧的属下的大上官员，当着他们的面宣告了赵一恒的供述，一桩一件全都清清楚楚，那些原来忠于李侍尧的官员见和珅已然掌握了全部证据，自己顽抗下去也毫无意义了，还不如从实招来，也许还能保全自己呢。


    于是他们纷纷倒戈一击，出面指控李侍尧的种种罪行，就连那些曾向李侍尧行贿的官员，也申明自己是迫于李侍尧的淫威，被迫行贿的。


    一切准备就绪之后，和珅才提审李侍尧，他就在总督府的公堂中央摆下公案声势逼人，李侍尧来到公堂后还有恃无恐的强辞争辨，和珅见状，命人将赵一恒带上公堂，让他当与李侍尧对质，和珅每问一句，赵一恒就机械的回答一句，李侍尧的心也就往下一沉，等和珅问完最后一个问题的时候，李侍尧已经感到大势已去，放弃所有希望了。


    史书上写到李侍尧认罪时说：“他自任得道府以下贿赂不讳。震怒谕曰：‘侍尧身为大学士、历任总督、负恩婪索、朕梦想不到。’夺官，逮诣京师。”


    ## 怎样办事领导满意


    人最大的能力，就是让他人舒服的能力，让人舒服的次数越多，你的成就就越大！


    ## 历史背景


    四十五年，命偕侍郎喀宁阿往云南按总督李侍尧贪私事。侍尧号才臣，帝所倚任。和珅至，鞫其仆，得侍尧婪索状，论重辟，奏云南吏治废弛，府州县多亏帑，亟宜清厘。上欲用和珅为总督，嫌于事出所按劾，乃以福康安代之。命回京，未至，擢户部尚书、议政大臣。及复命，面陈云南盐务、钱法、边事，多称上意，并允行。授御前大臣兼都统。赐婚其子丰绅殷德为和孝公主额驸，待年行婚礼。又授领侍卫内大臣，充四库全书馆正总裁，兼理藩院尚书事，宠任冠朝列矣。


    *《清史稿·卷三百十九·列传一百六》*


    三月，和珅、喀宁阿到云南。和珅选择李侍尧的“家人”(古时称仆人为“家人”)张永受作为李侍尧案的突破口，刑讯张永受，他终于开口说话，交代了李侍尧以下罪状：借办贡品和派人回京城修房屋之名，向下属勒索银两；将珍珠卖给下属，收取银两后，又索回珍珠等等，勒索下属银两共计
    3 万余两。李侍尧被革职拿问，由和珅将其解京审讯。主动或被迫送银子给李侍尧的下属们一并革职，审问定罪后，均被送新疆伊犁充当苦役。李侍尧在云南的住所被查抄，计金银、珠宝、洋货、名画共
    901 项，也由和珅押解进京。


    因成功办了此案，和珅更得乾隆帝赏识、宠信。和珅向乾隆帝奏报，云南吏治废弛，府、州、县官库多亏空银两，亟宜清查、整顿。乾隆帝拟委派和珅为云南总督，让他来解决云南的问题，只是考虑到前任云南总督李侍尧是和珅查办的，不宜由和珅接替李侍尧，乃改由福康安接任云南总督。在回京的路上，和珅就被提拔为户部尚书、议政大臣。和珅完成使命，向皇上汇报情况，涉及云南食盐管理、钱币制度、边境事务，说得头头是道，符合皇上旨意。乾隆帝当场表态，授予和珅御前大臣，兼都统，赐婚其子丰绅殷德为和孝公主额驸，等结婚年龄一到，即举行婚礼。和珅查办李侍尧案，是名利双收。


    ## 给领导带来好的名声


    李侍尧从乾隆十八年任热河副都统起至乾隆四十五年，进贡次数有档可查的达一百二十多次，有学者统计，李侍尧一年之中进贡次数最多达九次。按例，督抚进贡只有年节三贡，但李侍尧进贡的次数和名目远远超出，其名目有迎銮贡、木兰贡、谢恩贡、传办贡、贺捷贡等。据考证，在今天故宫博物馆钦安殿御座前立有一对鼍胎珐琅太平有象香薰驮于象背之上，其通高
    174 厘米，长 102 厘米，鼍工极精，珐琅鲜艳如初，是广州鼍胎珐琅的代表作之一。此对香薰就是李侍尧在乾隆四十一年（1776 年）的进贡物品之一，至今还立于殿上熠熠生辉。


    进献贡品需要大投入，李侍尧在置办贡品时不但费心，更要花银的。譬如，李侍尧进贡龙袍要在苏州订做，龙袍、龙褂共九套，计银四百五十两。李侍尧仅在苏州置办古玩、玉器、龙袍等物，就用银二万三千多两。再如，李侍尧任两广总督时，在广东以紫檀木、花梨木、红木为基本材料加工制作宫廷家具进贡，这批家具从订制到完工花了二年多时间，工银花费自然不菲。如此频繁进贡，投入巨大，银从何来？


    “雁过留声、人过留名。” 人人都希望自己一生有个好名声，领导干部同样渴望自己有个好名声。和珅来办理李侍尧案，借此扼制督抚以进贡为名而肥己的贪婪劣迹，一方面可以为皇帝纳贡正名，另一方面可以制止督抚贪婪日盛的势头。


    ## 把决定权交给皇帝


    和珅在搜寻到李侍尧贪污证据的时候并没有直接建议领导怎么处置，而是将李侍尧所犯错误列出清单，并且给领导两条建议。给领导两条建议的好处是，让领导有决定权，不至于让领导为难，还有就是无论怎么做都会体现出领导高明。这也是和珅拍马屁的高超之处。


    乾隆接到和珅的奏折，见海宁弹劾李侍尧的本章句句属实，恼怒非常，命和珅把他带回京师治罪，和珅有意置他于死地，几经审问，和珅上奏：“拟斩监候，夺其爵以授其弟奉尧。”后又建议将他侍尧“斩立决。”乾隆感念他曾屡立战功，又颇有才干，不忍心就这样把他杀了，就不批准“斩立决”的决议，让和珅等人再行商议，有江苏巡抚闵鄂元领悟了乾隆的本意，上书奏请道：“侍尧历任封疆、干力有为，请用仪勤议能之例，宽其一线。”乾隆遂最后判李侍尧“斩监候”，将他囚禁在刑部大牢之中，籍没了他的家产，虽然和珅没有达到将李侍尧斩首的目的，却向乾隆展示了自己办事的才干，可谓不虚此行。


    ## 给皇帝提出两条方案


    四十五年，云南粮储道海宁诉侍尧贪纵营私状，命尚书和珅、侍郎喀宁阿按治。侍尧自承得道府以下贿赂，不讳，上震怒，谕曰：“侍尧身为大学士，历任总督，贪思婪索，朕梦想所不到！”夺官，逮诣京师。和珅等奏拟斩监候，夺爵以授其弟奉尧。又下大学士九卿议，改斩决，上心欲宽之，复下各直省督抚议。各督抚多请照初议定罪，独江苏巡抚闵鹗元迎上意，奏：“侍尧历任封疆，千力有为。请用议勤议能之例，宽其一线。”上乃下诏，谓：“罪疑惟轻，朕不为已甚。”改斩监候。


    *《清史稿·卷三百二十三·列传一百十》*


    在清代，《大法律例》中没有“贪污罪”这个罪名，与现代贪污罪相似的，是“监守自盗仓库钱粮”。本来根据《大清律例》的规定，犯这种罪，是赃至 40 两，斩。但是在司法实践中，随着生活水平的提高和工资产价的上涨，贪官们贪污的数额也越来越多，如果
    40 两就斩的话，恐怕没几个官员能活着了。所以，雍正三年，针对这一律条又附加了一个“例”，即“凡侵盗钱粮入己，自 1000 两以下，仍照监守自盗律拟斩，准徒五年；数满
    1000 两以上者，拟斩监候，秋后处决，遇赦不准援免。”也就是说，贪污 1000 两以下的，可以用 5 年徒刑抵死罪，1000 两以上的，判处斩监候。李待尧以金换银
    3300 两，属于监守自盗，就这一条就够了得上斩监候了。


    那么对于贿赂罪呢，《大清律例》对于贿赂罪的处罚要严于贪污罪。清代对于贿赂罪分为“枉法赃”和“不枉法赃”两种，也就是说，如果官员收受贿赂并为对方谋取利益了，那就是“枉法赃”，赃至
    80 两就是死罪，绞刑；如果只收礼而没有为对方谋取利益，就是“不枉法赃”，赃至 120 两以上处绞刑。但在司法实践中，量刑的金额也加倍了，也就是枉法赃超过
    80 两，不枉法赃超过 240 两才处绞刑。如果依法治罪，李侍尧贪贿金额总共 35000 两，死多少次都够了。


    和珅有意置李侍尧于死地，可他清楚乾隆是十分爱惜人才的，于是拿出两种方案，最终和珅上奏：“拟斩监候，夺其爵以授其弟奉尧...后又建议将李侍尧‘斩立决’。”乾隆有心免李侍尧一死。在将李侍尧交大学士、九卿会审的时候，把和珅所拟的“斩监候”的判决意见一并交给大家讨论，其实也就是暗示大家：就按照和珅的意见判吧！


    如何给领导提意见？牢记“一不”“二多”原则，领导高看一眼！在工作中，领导的决策安排有问题，很常见，但是我们该如何给领导提意见呢？有的人干脆就不提，领导怎么说我就怎么做，最后出了事情反倒自己背黑锅，领导反正不会背锅的；还有的人脾气比较暴，跟领导对着干，遇到比较心胸开阔不计较的领导那还好说，遇到小心眼的领导，脸上挂不住，就暗暗给你使绊子，穿小鞋，这就难办了。很多说话无所顾忌的人在朋友面前还沾沾自喜地炫耀自己和领导又公开吵嘴了。给领导提意见，一个别说，两个多说，领导不仅听得进，还得感谢你。“一不”指的是：不要反对领导的方案。即使领导的方案听起来非常不靠谱，有很明显的漏洞，如果你当众反对领导的意见，然后给出了充足的理由，这不是当众给领导打脸吗，其实我们真正的目的并不是要让领导难堪，而是让领导不要在错误的方案上继续走下去，但是不一定非要用否定方案的方式来表达，该怎么说呢？可以遵循“二多”原则。“二多”原则的第一个“多”是“多肯定领导正确的部分”。领导当出了一个方案以后，里面肯定有一些事值得借鉴，有一些是不太可行的，这时候呢我们既然不能完全的否定他的方案，就要肯定他的方案当中哪些是比较好的，单独的把学习好的内容给摘出来，因为无论是你的方案还是他的方案，好的东西都是可以用的，所以先肯定领导正确的部分，让他不会一开始就会有排斥感，不会丢面子。第二个“多”是“多说这样做可能会更好”。意思是领导的很好，不过有些部分这么做可能会更好，并没有否认领导的说法，但同时又说出了可能更加好一点的行动方案，由于刚才也指出了领导里面特别好的部分，领导好的地方和你认为还有哪些可以更好的地方结合在一起就显得是你和领导一起想出的方案，而不是否决领导的方案，最后用你的方案。大家都知道，狗毛一定要顺着毛摸，如果你反着摸是会被咬的。为人处事也是一样，首先要顺着别人的想法，顺着别人的方案，让别人舒服了，然后再指出更好的方案，这样提意见，不仅顾全领导的面子，而且成功推销了自己的想法，时间长了，一定会得到领导重用的。


