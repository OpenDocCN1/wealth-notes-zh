    当时民间流传这样一句话和珅跌倒,嘉庆吃饱,那么和珅这么多钱放到今天他在世界能排第几呢?


    按照当时的购买力来计算。根据清朝军机处档案记载,光绪十五年上半年直隶省顺天府、大名府、宣化府的粮价,以谷子、高粱、玉米三种粮食计算,平均每石计银一两四钱六分。"
    当时的一石是 94.4 公斤,那么一两银子大概就是 70 公斤粮食。按照现在的粮食价格,每公斤 2.5 元计算,那么一两银子就是 175 元人民币。在此基础上乘以
    11 亿两白银等于 1925 亿人民币,换算成美元,根据目前汇率,大约等于 310 亿美元。这个数字在目前最新的世界富豪排行


    10'
  - '[PAGE 11]


    榜上是世界第 24 位！


    但是这样的计算是有点问题的，因为和珅还有大量的古玩字画，数不胜数，如果将那些文物也换算成人民币，那估计保守可以排进世界前十的。


    还是有点保守了。因为和珅的财产相当于清朝当时 10 年的税收。如果换算成现在的数据估计会吓你一跳！2017 年中国上半年的税收 收入是 7 万多亿，全年就是
    14 万亿，而和珅的财产就相当于 140 万亿，这个数据，让前 100 位的富豪加起来也不够啊 所以如果考虑到历史的影响和多国家财富的聚敛程度，现在的这些富豪是没法比的！


    和珅出身贫寒，怎么从一无所有到富可敌国，几百年来一直没人用权谋的角度分析这件事 本书带你解开这个谜团，本书前半部分写个人对权谋的应用，后半部分讲企业对权谋的应用，让处于社会各个阶段各个阶层的人群都可以拥'
  - '[PAGE 12]


    有取之不完用之不尽的财富。'
