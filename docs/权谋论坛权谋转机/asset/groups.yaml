    伪君子比真小人可怕，如今看来怎么做君子，是门大学问。


    ## 历史背景


    御史曹锡宝劾和珅家奴刘全奢僭，造屋逾制，帝察其欲劾和珅，不敢明言，故以家人为由。命王大臣会同都察院传问锡宝，使直陈和珅私弊，卒不能指实。和珅亦预使刘全毁屋更造，察勘不得直，锡宝因获谴。逾月，授和珅文华殿大学士。诏以其管崇文门监督已阅八年，大学士不宜兼榷务，且锡宝劾其家人，未必不因此，遂罢其监督。


    《清史稿•卷三百十九•列传一百六》


    乾隆上谕《夏季档》中也记载了这件事。御史曹锡宝本想先参劾和珅的家人刘全，从中打开缺口，攻一攻和珅。但曹锡宝做事不慎，他将奏折稿子拿给他的老乡吴省钦过目，没想到吴省钦是和珅的老师、亲信。吴省钦连夜派人赶赴热河向和珅告密，和珅知道后，在乾隆跟前吹了风，仅仅隔了一个月，乾隆《秋季档》中就记载了这件事的查办结果，曹锡宝反而被革职留用。


    ## 不给小人机会


    御史曹锡宝写了一篇弹劾和珅的管家刘全，说他建造的府第深宅大院，早已超出了应有的住房规格，平时出行的穿戴及所用舆也是超出限制，想借此来扳倒和珅。消息被吴省钦得知之时，和珅正陪同乾隆在热河行宫，吴省钦立刻回到府中，命家人对来访的客人一律称病不见，自己不带一名随从，骑一骑快马赶到热河，通报和珅。


    和珅急忙命人传见刘全，要他风雨无阻，入手头的一切事务，火速到热河见他。刘全起点到后，和珅把御史曹宝锡参劾他“恃势营私、衣服、车马、居室皆逾制”的事告诉他，然后命他火速回去，迅速拆掉逾制房屋，烧掉超过规格的车舆，把不该穿戴的东西统统销毁，不留一丝痕迹。等到曹锡宝乘车来到热河，面见乾隆，呈递奏折的时候，刘全家中一切逾制的东西已经荡然无存了。


    乾隆立刻召见满朝文武，质问和珅，和珅说道：“启奏皇上，奴才蒙皇上器重，官是一宰辅，焉能不知自重，臣对家中人也一向严加管束，深恐有负皇上深恩，今御史曹锡宝弹劾刘全，臣也不敢庇护，臣多年跟随皇上方边，手下人等趁臣不知，做了些不轨之事也有可能，可命人即刻拘捕刘全，严加审问，若果如曹御史所言，臣定当领罪。”和珅的这一番言辞，有理有据，说得乾隆心中的怒气已然消掉了大半，当下询问百官，以为和珅所言如何，百官中有不少已是和珅的党羽，自然连连应和，说和中堂所言极是，乾隆立即命人将刘全抓到热河，短短两、三日之内，刘全已是二进热河了。


    和珅力请皇上在金殿亲自审问刘全，以正视听。乾隆端坐在金殿之上，命人带过刘全，问他：“曹御史弹劾你衣服、车马、居室皆超出祖制，可是属实吗？”刘全诚惶诚恐的说道：“相爷一向对小人严加管束，奴才绝不敢招惹是非，奴才们的衣物全都是粗布衣衫，怎么可能有逾制的东西，奴才们的生活实是清苦非常。”说着，竟装出了一付饱受清苦的样子，哭了起来，和珅趁机说道：“据奴才所知，刘全平素为人朴素老实，安分守己，决不至做出违礼的行为，依臣之见，曹御史的弹劾，应是听信了不知何处的谣言，乃一面之辞，实是不是为信，请皇上明察。”


    乾隆原本就存着偏袒和珅之心，加上他们看上去真情真意切的一唱一合，早就忘记了派人细查曹锡宝所奏到底是不是真实的事，站到了和珅一边，此刻，即使是实有此事，乾隆也一定会觉得情有可原了。他在御旨中说：“和珅家人全儿，久在崇文门代伊主办理税务每年，其例有应得之项，稍有积蓄亦属事理之举。”“至于盖房屋数十间居住，亦属人情之常，天下各处关榷其管理人员不能不派佣家人分管税口，自不免皆有羡余。既吏胥等亦藉余润，其服居居室，稍有润饰，亦若事理所有。”这就是说，即使刘全靠主人和珅，积蓄了点钱财，盖了房子，也是人之常情，有什么值得大惊小怪的呢？


    乾隆接着把矛头指向了曹锡宝。怀疑起他弹劾刘全的动机来，御旨中接着写到：“若伊（刘全）倚藉之势，实有招摇、撞骗或于额税之外，擅自加增，以肥私囊，或如富礼擅殴人命项凶吝情节亦未可知，应令曹锡宝逐条指实，如有以上情节，即在面从严审办，一面据实具奏，或曹锡宝及伊亲友有应过税之物，全儿多索税银，或畏伊不肯免税之嫌，架词耸听，尚为情理所有。若曹锡宝竟无指实，不过捋拾浮簿建白三名，亦难以无根之谈，处人罪之理，况曹锡宝与和珅之家人何能熟识，伊于何处深知详细，亦应详问实在，方成信谳。”


    乾隆咄咄逼人的要曹锡宝把刘全的罪状一条条指实，他不但不认为曹锡宝的弹劾是真凭实据，反而认为曹锡宝弹劾刘全是因为自己亲友携带的东西被刘全课以重税，或者是他要求刘全免税而不可得，才陡起私债，公报私仇，甚至，乾隆进而怀疑，曹锡宝是为了搞垮和珅才有此所为，上谕中说：“故以家人为由，隐约其词，旁敲侧击，以为将一波及地步。”满朝的官员都听明白了，分明是乾隆有意偏袒和珅，再也无人敢出面声援曹锡宝，反而都暗暗为他担心起来，乾隆命步军统领郡王锡图恩、都察院大学士梁国治同曹锡宝一起至刘全家查验。和珅已经命刘全将一切安排妥当，当然查不出什么来。调查的结果报告给乾隆，乾隆又召见曹锡宝，斥责他本无真凭实据，凭空捏造。弹劾家人刘全是假，借机打击和珅是真，完全是公报私仇、图谋报复，曹锡宝眼见证据皆无，乾隆显然又偏向和珅，自己这次的弹劾早就一败涂地，只好改口说，自己是为了防微杜渐，给和中堂预先提示，让他约束好家人，免得等到惹出乱了，自己为

