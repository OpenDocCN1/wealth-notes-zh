    时候呢我们既然不能完全的否定他的方案 就要肯定他的方案当中哪些是比较好的，单独的把学习好的内容给摘出来，因为无论是你的方案还是他的方案，好的东西都是可以用
    的，所以先肯定领导正确的部分，让他不会一开始就会有排 斥感，不会丢面子。第二个“多”是“多说这样做可能会更 好”。意思是领导的很好 不过有些部分这么做可能会更好，
    并没有否认领导的说法，但同时又说出了可能更加好一点的 行动方案，由于刚才也指出了领导里面特别好的部分，领导 好的地方和你认为还有哪些可以更好的地方结合在一起
    就 显得是你和领导一起想出的方案，而不是否决领导的方案， 最后用你的方案。大家都知道，狗毛一定要顺着毛摸，如果 你反着摸是会被咬的。为人处事也是一样，首先要顺着别人
    的想法，顺着别人的方案，让别人舒服了，然后再指出更好 的方案，这样提意见，不仅顾全领导的面子，而且成功推销'
