    # 怎么铲除敌人


    要在你的对手背后插上一刀，需手上戴着天鹅绒的手套，脸上挂着最甜美的微笑。


    # 历史背景


    四十五年，命偕侍郎喀凝阿往云南按总督李侍尧贪私事。侍尧号才臣，帝所倚任。和珅至，鞫其仆，得侍尧婪索状，论重辟，奏云南吏治废弛，府州县多亏铬，亟宜清理。


    《清史稿•卷三百十九•列传一百六》


    乾隆四十五年(1780)正月 乾隆帝趁着担任云南粮储道的海宁来京觐见，向他询问有关云南总督李侍尧违法之事。海宁供出了李侍尧在总督任内，借办贡品和修房屋之名勒索下属的罪行。乾隆立即派和珅、喀凝阿(一作喀宁阿)乘驿站的快马赶往云南查办李侍尧，并查封了李侍尧在京城房屋家产。


    # 利用第三方力量举报


    这天曾任云南粮储道与贵州按察史的海宁库存和珅关系被解除旧职调任沈阳奉天府尹，他上任之前，特意到和珅府上拜望，感谢和珅把他调离了西南蛮荒之地，连同丰富的礼物一同带给和珅的，还有李侍尧在云南贪赃受贿的消息，海宁求见和珅之后，对和珅说:"当今圣上对纳贿，贪赃深恶痛绝，几番下圣谕要官员洁自自好，奉公守法，可那李侍尧在云南作威作福横行无忌，他有心要向皇上参奏李侍尧，又恐怕自己官卑言轻，起不到什么作用，不知如何是好，所以特来向和珅求教。说完还向和珅呈上了他平日搜罗的李侍尧受贿的证据，和珅听罢大喜，立刻把海宁夸讲了一番，并鼓励他不必畏李侍尧的淫威，尽管上奏，一切都有他照应。


    第二天早晨，乾隆处理完当日的政务，正准备退朝，和珅跨出一步说道:"云南粮储道并贵州按察使海宁有本要


    奏。”乾隆一向对远道而来的官吏较这宽容，就命他上殿奏本。海宁来到殿上，跪拜乾隆之后，把自己书写的奏折呈递上去。乾隆读罢勃然大怒，说他对李侍尧在云南贪赃营私早有察觉，只是念他征战多年，立功无数才网开一面，孰料他竟然愈发不成体统，当即命和珅赴云南查清李侍尧贪赃一案。为什么要利用第三方力量举报，据史料记载，李侍尧因“年老位高，平日儿畜和珅。和珅早就想铲除掉这个人，这也是正常人的心里，如果单位内部有人成天看不起你，你怎么办？可单位人人皆知和珅与李侍尧不和
    若和珅跳出来举报，必定引起公报私仇的嫌疑，另一个原因和珅深深知道，李侍尧颇为领导看重，若自己在领导面前说他的罪状，领导肯定会不高兴。还有一点就是可以争取办案权，以第三者的身份去评判李侍尧便可起到抬高身份为领导办事监督作用。


    # 扮猪吃虎


    和珅到达云南之后，先向李侍尧宣读了圣旨，将他暂且革职，然后就不再过问此案，游山玩水去了。因为他明白，云南毕竟是李侍尧的地方，他在此地经营多年定然耳目众多，根柢深厚，寻找他贪赃的证据，恐怕不是一件容易事。他先装作懦弱无能，不思公务的样子麻痹李侍尧，暗地里派出得力家人细心查访。


    什么叫作“扮猪吃虎”呢？即是说猎人要捉老虎，在无法力擒的时候，就装扮成一只猪罗，学成猪叫，把老虎引出来，待走近时，然后出其不意，猝然向它袭击。这突击结果，虎纵不死也会带伤。以此策略施于强劲的对手人，一样可以使用，在其面前，尽量把自己的锋芒敛蔽，“若愚”到像猪一样，表面上百依百顺，脸上展开微笑，嘴边抹上猪油，装出一副为奴为婢的卑躬样子，使他对自己不起疑心，一旦


    到了时机成熟、有隙可乘之时，才一下子以闪电手段，把他结束了，这就是“扮猪吃虎”的妙用。所谓“扮猪”，即孙子所说的“藏于九地之下”，“吃虎”是“动于九天之上”。


    扮猪吃虎是铲除敌人最常见的方式，也是历史上应用最多的。


