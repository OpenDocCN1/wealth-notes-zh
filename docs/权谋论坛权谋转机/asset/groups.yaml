    苏卿怜到了和珅府中以后，和珅家的内部事务大都由她和长二姑主持，外面的一切帐目报到和府中，则由苏卿怜一人主持整理，她把这些帐目处理得井井有条，成了和珅家里家务以及理财的不可缺少的左右手。


