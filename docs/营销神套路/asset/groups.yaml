    ## 食用油大战


    大战的起因是为了促使消费者转换产品，清香油广告的内容影射，沙拉油不宜高温炒炸，也暗示使用一些胆固醇并不是坏事。初期 13 家沙拉油经营者对清香油的广告并未在意。


    但是经过一年多持续不断的攻击，家庭用沙拉油的市场占有率已明显地被清香油所替代，再加上黄豆开放进口，而国际上黄豆价格又已上涨，市场流失，利润降低，因此双重打击，才逼得植物油工会不得不开始反击，于是一场食用油大战正式展开。


    首先，植物油工会借食品卫生营养研究基金会之名，举办了一场“食用油专家”座谈会，广邀专家、学者、官员参与。


    座谈会上，多数专家学者，包括农委会食品加工技师林子清等官员，以及几位营养学界的名博士、教授，均认为家庭比较适合使用沙拉油，但餐厅高温反复使用者才应使用安定性较高的猪油。


    不料，这份座谈会的记录内容，却被植物油工会拿来作为反击清香油的广告，广告大标题为：“食用油之战，专家开口，水落石出”，副标题为：“我们呼吁：沙拉油适合家庭使用，顾


    点论述了摄取动物性油脂的道理。由此证明清香油有其存在的价值。


