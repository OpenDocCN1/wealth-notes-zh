    # 惊天地,泣鬼神!《神套路14》拒绝教条和理论,只有实操和落地!


    你知道发出去1000张传单会有多少人来你店里消费吗？”


    不知道”


    当我与他聊完后，我深深地体会到，他是凭着感觉在做项目，对项目中每一个关键数字的计算，他都不清晰。


    你对上面的那3个问题清晰地知道吗？


    富豪们知道：成功是可以通过关键数字推导出来的。也就是说:成功是通过预先计算好的数字一步步推导出来。


    ![](img/e907008141dfe06a048568f43ad61148_86_0.png)


    今天我们一起来深入地分析做事业与做营销中你不得不知道的一些关键数字。


    +   1、清晰地知道获取客户的成本


    我把这个称之为获得客户的单位成本，也可以称为 CPA。它可以帮助你确定在市场营销或者广告活动上该投入多少。


    比方说，在当地报纸刊登了一则价值 2000 元的广告。您得到了 100 次反馈，其中有 10 次产生了消费。那么您为每个客户'
  - '[PAGE 87]


    投入的成本为200元。


    如果您的每一笔生意利润都在200元以上，那么要恭喜你，你成功了。但是如果利润只是200元，那几乎无利可图，甚至处于亏损状态，那么是时候重新评估您的营销手段了。


    ![](img/e907008141dfe06a048568f43ad61148_87_0.png)


    来看一个案例：


    假设你有3500元本金，你花2000元批发了20件衣服，每件成本是100元。你设想的售价是300元，这样你可以从每件衣服中赚到200元。


    于是你把其中的800元用来印制传单，可以印出8000份传单。每份传单上你印了50元的现金抵用券用来做促销。


    8000份传单发出去了，一共吸引来了80人，其中16人购买了。


    那么800元/16=50元。也就是说你吸引一个客户的宣传成本花了50元。'
  - '[PAGE 88]


    此时你的每个客户净利润（除去固定成本与人工工资后）超过 50 元，那么你可以盈利了！否则就需要审视你的营销手段，或你的文案，或者你发放的对象，又或者媒介。


    这是你第一个要掌握的重要数字，它代表着你的钱花得明明白白，这个数字帮助你，指导你得把钱花在刀刃上！


    ![](img/e907008141dfe06a048568f43ad61148_88_0.png)


    # 2、清晰地知道成交转化率


    此时你决定加大投入宣传，一共发出去 5 万份传单，来到店里的有


    2000 人, 这时, 2000 人中有 400 人消费了, 400 除以 2000, 就是你的成交转化率。


    20%, 是不是不够理想？慢慢来，在转化率这一块，在成交流程中，你可以再优化。调整你在成交过程当中缺陷，提高客户服务质量，准确定位消费群体，你将事半功倍。


    这个数字告诉你，在接触与成交客户的过程中，有哪些细'
  - '[PAGE 89]


    节需要优化，比如要培训销售团队，在宣传的过程中要更加精准。这个数字让你明白赚钱要在哪些方面做努力！


    # 3、清晰地知道客户终生价值


    在你经营一段时间后，你会发现总会有一些忠实的客户，他们每年来4次（消费频率），每次消费1000元（单次消费额），并且他们5年内（这个5年称为消费者生命周期）稳定地在你店里消费。


    ![](img/e907008141dfe06a048568f43ad61148_89_0.png)


    那么客户终生价值=单次消费额*消费频率*客户生命周期。


    由此计算，一个客户对你来说的终生价值是：20000元。


    这个数字告诉我们，维护一个客户可以获得更多的利润。研究表明，维护一个客户的成本只占开发一个新客户成本的1/6。


    这个数字也指示我们，要对客户进行分类，挑选出优质的客户进行合理的客户服务，从而维护公司的长期利润来源。


    如今你可以实实在在的了解，每个顾客的价值和资源的类'
  - '[PAGE 90]


    本控制,产品结构调整等等。


    # 5、全面规划附加利润点


    如果你正在寻找提高收入,增加利润的办法,那么每一笔客户的成交都至关重要。也就是说,你必须借助成交的过程让客户再买一些东西。


    ![](img/e907008141dfe06a048568f43ad61148_90_0.png)


    附加销售省去了吸纳客户的成本，人工的成本,因此它成为提高利润的关键点。我们常常说的：每一次成交之后，都要搭上成交的顺风车,附加销售另外的产品。


    “附加产品”其实很简单，同时可以迅速增加收入。例如，一家经营优质炸鸡和瓶装饮料的熟食店通过一个“促销”，可以使每一笔销售平均增加5.42美元至13.11美元，在短短几周之内，整体收入就会增加144%。肯德基的“第二杯”半价，就是附加销售的原则。'
