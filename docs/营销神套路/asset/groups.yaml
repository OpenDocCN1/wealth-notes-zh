    其实，当有一天你成为一诺老师亲传弟子，你会学到更多这样的案例思维，这一切对你来说都不是问题。


    目前的工商情势下，支付一个较高的价格，是符合他的利益的。


    并且，你应该告诉顾客，在1973年，就是因为这种成本暴涨，而使得某些工商业遭受亏损。你应该让他了解，一个不健全的贩卖者，并不一定最符合顾客的最佳利益。同时，一个产业如果不健全，可能会导致更严重的问题。


    就一个产业而言，如果要提供顾客日渐增加的需要，他必须首先保持适当的利润，否则，顾客终会面临延迟交货，或是品质下降的情形，甚至，由于成本增加，导致价格过度上涨。


    如果你的顾客支持这种价格上涨，你可以答应给他优先交货，增加在运货、交货上的服务。因为，一个良好的顾客，应该给他适当的回报。


    第五、帮助顾客了解：今天的工商情势变化莫测。并且提醒他：他过去的经验，并不一定能适用于今天的环境，就这点，推销人员和公司，彼此应就长期的目标共同配合行动，不可仅仅为了争取一笔订单，而破坏了公司的惯例。


    第六、你的顾客应该了解，你的公司将会协助他就订价一事，去应付他的顾客。常常他的顾客可以增加成本，或者采取证明你的公司正向更经济的生产效率途径迈进。


    你应该明确地指出：由于一个竞争者的反应迟钝，以及成本制度差劲，而使你能占到便宜的话，并不是一个从事采购的最佳途径。同时，在目前这种市场情况下，还可能是一种非常危险的作法。


    第八、你必须考虑周详，并且最好也使你的顾客如此。让你的顾客认识到：在今日的市场中，你们公司是合作的最佳对象。你们公司反应迅速，富有专业化精神，也不图短视近利，产品优良，而且整个组织十分健全。


    如果你能以上列八点做参考，改进你的行销策略的话，相信你必稳操胜算！


