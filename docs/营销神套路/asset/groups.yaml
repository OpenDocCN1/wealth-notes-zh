    ## 成功金钥匙

    一个富人永远想的是通过整合别人的力量来赚钱。


    这句话让我思考了很久，也一直印在脑海里。于是老李通过走访一些投资人士、企业家、公益人士，逐一分析他们成功的道路，找到他们成功的秘密是什么？因为我相信：成功不一定可以复制，但一定有迹可循！


    我通过分析之后，发现他们的成功都有惊人的相同之处！而且精华地概括起来，就3句话！


    **成功3把金钥匙**：


    1. 第一把金钥匙：找有钱的人，因为钱流向那里。

    2. 第二把金钥匙：找有客户的人，因为客户走向那里。

    3. 第三把金钥匙：找有方法的人，因为方法就在那里！


    **金钥匙一：找有钱的人，因为金钱流向那里；**


    大家都可以发现社会一个普遍存在的现象：有钱的人，越来越有钱，没钱的人，越来越没钱。为什么？很多人都回答说：因为有了钱后，钱生钱啊。难道就是这么简单吗？


    不是的。如果要用来一句话来回答，那就是：因为钱会流向有钱人！钱知道答案。金钱流动的方向代表着市场趋势的方向！


