    ## 第 47 课：无中生有的市场细分套路


    下面是一诺老师在线下交流时，给亲传弟子分享的一个案例。


    大茂从事食品业有数十年的历史，过去的作风相当保守，产品品种单一，所以知名度较低。但是，最近几年，经营手法改变，创意不断，才被视为市场上强劲的竞争者。


    ![](img/e907008141dfe06a048568f43ad61148_184_0.png)


    大茂之所以能以黑马姿态异军突起，令人刮目相看，完全是依靠营销产品差异化策略。它的所谓差异化，实际上也仅仅是“无中生有”的创新名词而已。


    但是这无中生有的创意，却成为它披荆斩棘，无往不胜的特点，不但为产品增加了附加价值，从而有利于市场的开拓，也提高了公司的形象。


    首先是大茂“黑”瓜，瓜的种类当然多不可数，名称也令人记不胜记，不过查遍所有的植物本名、学名，都没有一种瓜称为“黑”瓜的。


    任何用小黄瓜经酱油淹制过的酱瓜都会呈黑色。所以基本上所有罐装瓜应该都是黑瓜才对。不过大家都称之为花瓜或酱瓜，没有人叫黑瓜，唯独大茂大胆的称为“黑”瓜。


    这一“黑”字就将它与其他品牌的产品作了差异化的区隔，也为它的销量拉出一条通道。


    ![](img/e907008141dfe06a048568f43ad61148_185_0.png)


    其次是“大”土豆面筋。


    土豆面筋的品牌很多，产品本身也没有什么特色可言，口味的淡、咸则随个人感觉喜好而异。至于土豆，当然有大有小，很少有人会刻意的去加以比较。


    然而，大茂却在它的土豆面筋上加了二个“大”字，这个“大”字即大大的使它的产品异于其它品牌，因此也使它的销


    ## 第 48 课：婴儿洗发的市场细分套路


    下面是一诺老师在线下交流时，给亲传弟子分享的一个案例。


    “让强生婴儿润肤油保护您的肌肤！”美国强生公司靠这两句广告词，在国内市场上开拓了属于自己的一片天空，奠定了以后发展的基础。


    洗发精在国内品牌众多，竞争激烈，加之市场饱和，要赢占市场，对于任何新品牌都是困难重重。在这种情况下，强生公司只好另辟蹊径，开发属于婴儿专用的洗发精。


    ![](img/e907008141dfe06a048568f43ad61148_186_0.png)


    本来这只是不得已而为之的市场策略，没想到却歪打正着，不但成功地区隔市场，建立了专业的领域，而且更因创意的突出，扩大了行销的空间，获得了意想不到的效果。


    婴儿洗发精专供宝宝用的洗发品。一般洗发精和肥皂会伤害宝宝的头发和眼睛，而强生婴儿洗发精则以特殊配方，适合宝宝稚嫩的皮肤和发质，而且不刺激眼睛为宣传重点。开发初期原本不被行销专家特别看好。


    不料，上市之后，因为广告的宣传及表现，深具吸引力和亲和力，打动了初为人父人母者的心，于是销路就此打开。


    ![](img/e907008141dfe06a048568f43ad61148_187_0.png)


    强生洗发精在婴儿市场旗开得胜之后，自然也有信心进攻成人市场，只是没有具备强有力的产品，因此迟迟不敢介入。


    后来，在一次企划会议中，有人无意间提到，既然婴儿洗发精连宝宝的头发都不会伤害，那么应该更不致于伤害成人的头发，这一概念立即成为会议的主题，经过热烈讨论后，大家都认为以婴儿洗发精进攻成人市场是极为可行的创意。


    这就是用“强生婴儿洗发精保护你的秀发”，产品创新定位的由来。


    ## 第 49 课：口香糖的市场细分套路


    下面是一诺老师在线下交流时，给亲传弟子分享的一个案例。


    英伦心心口香糖在上市的时候，曾以密集式的广告来提高产品的知名度，为了配合该产品的名称——心心，大部分的宣传主题侧重在青年，为了吸引青年消费对象，他们以恋爱及爱情为主题，整个产品的推广也是以谈情说爱为中心而展开的。


    ![](img/e907008141dfe06a048568f43ad61148_188_0.png)


    按理说，其销售对象的设定是正确的，但其广告表现，却未能含蓄而触发购买动机，以致于对青年人缺乏刺激作用，另一方面，它在广告表现上，又过分地直接，尤其以电视广告为甚，令人看了以后，在心理上产生畏怯的感觉，虽然内心想要买，却不敢付诸行动。


    口香糖对于成年人也具有吸引力。为激发成年人对童年的回忆，心心口香糖十分注意产品的造型，具有与众不同之处。传统的口香糖形状为粒状与片状，这两种造型，为中外口香糖的共同特征。


    心心口香糖为了在产品上立求创新，不顾消费者在食用时的动机，与食用时满足的来源，“创造”出了一种棒形口香糖。这可以说是一大冒险。


    ![](img/e907008141dfe06a048568f43ad61148_189_0.png)


    虽然广告上说，要吃多少就吃多少，但也没有收到好的销售效果；另一方面，一男一女各持一棒口香糖，男的肉麻兮兮地说，我吃一口，你吃一口，这种情况尽管现实生活中存在，但以电视广告表现，则颇令人难以“消化吸收”。


    把握购买者的动机，应用暗示的方法，激发消费者快乐源泉，才能最终把握住消费者，增加销售。


