    # 第 09 课：广西养猪户神套路 1 年多赚 2.5 倍


    下面是一诺老师在线下交流时，给亲传弟子分享的一个神套路：广西养猪户神套路 1 年多赚 2.5 倍。


    什么是平台呢？平台是相对一个点来讲的，平台其实就是 一个面。


    对经营某一种产品，或者某一类产品来说，一家小店就是一个点，只能交换这一种特定的产品。


    ![](img/e907008141dfe06a048568f43ad61148_57_0.png)


    而平台的概念呢？是通过这个点创造一个面，不仅仅是交换这一种，一类商品，而是交换相关产品的上游，或者下游产品，甚至是不相关的产品，而这种产品是有不同的提供商提供。


    例如：广西壮族的黑猪肉非常的有市场，黑猪肉每斤销售价格一般都在 80-100 元之间，黑猪肉在市场上已经形成了有力的


    品牌竞争，因此有一家销售黑猪肉的商家想继续扩大市场，但是由于黑猪总数量较少，所以开设连锁加盟有非常大的有难度。


    老师就给他们策划了一个黑猪厨房，这个黑猪厨房就是建立了一个平台，因为有能力消费黑猪肉的客户，消费能力都非常的强，他们通过对黑猪肉品牌的信任，从而消费了黑猪厨房所提供的其他的商品，例如有机菜，高档水果等等。


    从今年 1 月中旬到现在，这家黑猪厨房已经开设了 18 家店铺。


    ![](img/e907008141dfe06a048568f43ad61148_58_0.png)


    这就是通过经营某一个产品从而打造了一个销售平台的真实案例。又或者我们的家纺行业，不仅仅做床上用品，还有窗帘，布艺等等相关产品，这也是一个平台。


    在我们的一般思维里，一家小店只是谋生的手段，根本无从谈起平台的概念，所以一家小店成为平台的可能性也非常小。


    在这里我们要谈的是，小店能不能做成一个平台，其实就取


    # 惊天地，迈鬼神！《禅堂路 14》拒绝教条和理论，只有实操和落地！


    一般都是品牌商家，对于那些非品牌商家，或是一个小店来说。


    运作到这一步是非常难的。因为它需要品牌的力量。


    也就是说一个小店如果要成为一个平台，常规条件下必须走品牌这一路。


