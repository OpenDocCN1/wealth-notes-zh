    \ DVD 给您的。\n\n![](img/e907008141dfe06a048568f43ad61148_28_0.png)\n\n同时，我这个月的业绩还差\
    \ 2 套没有完成，黄总您是否可以帮我完成一套，或是推荐您的朋友帮我完成一套呢？……”\n\n一般人爱面子，看到女孩子还没有卖光碟的时候，就送 DVD 机过。将心比心，受人家一个人情，这些老板总是会想办法还上的。\n\
    \n很多时候，这个女孩还会加上一句：“如果您现在手头上没有现金不要紧，您先收着光碟，方便的时候再把货款打到我们公司账户上。”\n\n## 第04课：大师神套路放长线钓大鱼\n\
    \n下面是一诺老师在线下交流时，给亲传弟子分享的一个神套路：大师神套路放长线钓大鱼。\n\n营销点评：商业模式就是帮你做产业链。\n\n一个企业的价值链的每一个环节，都能创造价值。比如说设计环节增加资源，比如说施工环节增加资源，比如说在拿项目环节增加资源。有了资源，就会产生竞争优势。\n\
    \n> 现在是客户之间的竞争，现在是平台之间的竞争！\n> ——一诺老师\n\n比如很多企业通过改革开放搞加工，你加工鞋我也加工鞋，你加工冰箱我也加工冰箱，你加工空调我也加工空调，于是，大家都变成了性质差不多的加工企业，同质化严重。\n\
    \n这个时候谁做品牌谁厉害，这个时候谁做技术谁厉害，这个时候谁做渠道谁厉害。\n\n所以说价值链里面某一个环节重点增加资源，你就拥有优势，尤其是稀缺资源的开发和增加，打通产业链。\n\
    \n我们知道，红星美凯龙是一个家具城，其实你只看到了表面。\n\n其实红星美凯龙现在有三个身份。第一个是零售公司，就是卖家具的。\n\n第二个是地产公司，类似麦当劳占地为王，收租金。第三个就是金融公司，准确点叫类金融公司，有点跨界经营的性质。\n\
    \n它的东西卖了钱不马上给客户付费，押你三个月，它用这三个月的钱去做房地产，做金融投资。\n\n![](img/e907008141dfe06a048568f43ad61148_30_0.png)\n\
    \n所以，红星美凯龙是一个类地产公司、类金融公司，最后才是零售公司，醉翁之意不在酒。大家从这个层面就可以看出来，它突破了专业化的概念。\n\n理解这个时代在发生什么变化，你才能把握这个时代的脉搏。\n\
    \n## 第05课：大师神操作事件营销引爆市场\n\n下面是一诺老师在线下交流时,给亲传弟子分享的一个神套路:大师神操作事件营销引爆市场。\n\n在20世纪80年代,一个名为爱德华·劳埃德的英国人,在德国莱比锡,以制造了“马口铁事件”的犹太人保罗·朱利叶斯的名字,创办了世界上第一家新闻事件策划公司。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_31_0.png)\n\n在爱德华·劳埃德看来,在这个麻木的世界 上,再没有比“新闻事件”更能够神速有效地传播“信息”了。\n\
    \n一次“车祸”,一场“诈骗”,一起“纠纷”,甚至自然界的每一种天灾人祸,都是可被借来进行宣传推广活动的。\n\n正是基于这种“谬论”,劳埃德成立了奇特的“保罗·朱利叶斯公司”,专业设计和制造任何有利商品促销,和名人包装的。\n\
    \n300元融资500万,签订《零风险+对赌》协议,实操请联系一诺老师助理!\n\n## 惊天地，泣鬼神！《神套路 14》拒绝教条和理论，只有实操和落地！\n\
    \n期间，他还接受三家电视台的采访，表示了自己对保罗·朱利叶斯家族的尊敬和爱戴，决心继承和发扬保罗·朱利叶斯的商业精神。\n\n![](img/e907008141dfe06a048568f43ad61148_32_0.png)\n\
    \n采访实况在黄金时间滚动式播出，用劳埃德自己的话说，这些都是免费的，也是合法的。\n\n法院结案时，劳埃德主动要求承担所有诉讼费用，包括“原告”的旅行和食宿用账，并付给“原告”200\
    \ 万马克的署名权。\n\n就这样，官司了结了，劳埃德和他的公司成了这一年度莱比锡最受关注的新闻和话题。\n\n当他的副手将他“赢得”的 200 万马克送还给他时，他实际上为推销自己的公司，只花了\
    \ 6000 马克的诉讼费，只相当于当时电视台黄金时间 2 秒钟的广告费用。\n\n这一策划后来被许多人认为是世界上最成功、最有效、最省钱的一次经典的“广告”。\n\
    \n300 元融资 500 万，签订《零风险+对赌》协议，实操请联系一诺老师助理！\n\n就是这么简单，大师用了这个神套路事件营销引爆市场，实现轻松赚大钱。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_33_0.png)\n\n这只是一诺老师课程的冰山一角，如果有一天你有幸听了一诺老师的弟子内训，你将会醍醐灌顶……\n\
    \n## 第 06 课：新瑜伽馆神套路疯狂引爆客流量\n\n在我的学员中有个开瑜伽会所的，开张之后一直苦于没有客源，她一般的广告宣传都是传单，传单这种模式现在都已经被大家用烂了，广告的载体一定要遵循离目标受众最近的原则。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_34_0.png)\n\n所以传单随着时间的流逝，越来越无效，传单就是垃圾广告，因为对受众是没有利益的！因为利益才是最大的驱动力。\n\
    \n张总开了一家瑜伽馆，门可罗雀、发不起工资、交不起房租，后来经过一诺老师亲自辅导，通过一个神套路，疯狂引爆客流量，她是如何做到的呢？且听我细细道来。\n\n\
    做任何行为都要事前定位，不做定位你就找不到努力的方向，像这家瑜伽会所呢，每天派很多人去发传单，最后发现派的人越多，越发发出去，而且还要防着城管，所以老板很苦恼。\n\
    \n300 元融资 500 万，签订《零风险+对赌》协议，实操请联系一诺老师助理！\n\n原因是她不知道瑜伽的产品定位，她的瑜伽馆是在一个别墅群里面，环境很优美，课程项目非常丰富，价格当然是偏高，唯一的缺点就是教学面积小一点，一次只能接纳五六十人，传单效果没有太大作用之后，她综合自己的瑜伽馆的特点，进行了进一步的定位。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_35_0.png)\n\n她拿着瑜伽半年卡去找那些高档服装店、美发店、美容院、化妆品店去合作，找到卖服装的老板跟她讲，你卖一套衣服\
    \ 1000 块钱，你就把 880 元的塑身卡送给她做促销，店老板会不会跟你合作？肯定会对不对？因为这对她有利的，便于她的成交和造就好的口碑。\n\n如果你卖\
    \ 880 元，肯定有障碍，如果你通过一些有价值的渠道，送 880 元出去，这个就没有障碍了，对吧？\n\n大家看案例不要看热闹似的，看过之后激动一下就忘记了，要从案例中提炼出规律来，这个案例的精髓是，把别人的利益放在自己的利益之前，先让别人得利，把利益前置。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_36_0.png)\n\n这时候肯定有人心里纠结，用880元来做促销，会不会成本太高，不划算以至于会亏本，这里我再向你分析一下。\n\
    \n瑜伽馆有客人要花钱，没客人也要花钱，这是固定成本，不可能客人没来你就不开空调、不开灯，不发工人的工资，对吧？\n\n人来了，也不过还是这些开支，只不过人来了，多出2瓶矿泉水，这个就不算什么费用了。\n\
    \n因为开一家店，重要的成本是固定成本，而不是运行成本，开任何的店，固定成本都很高，运行成本都很低。\n\n自己的目标客户到底是谁？做瑜伽的男人多还是女人多？因为定位的很大一大部分的重点是聚焦，把市场范围缩小。\n\
    \n而这家瑜伽馆的目标客户就是那些高收入的、有钱的女人，这种有钱的女人来瑜伽馆来锻炼身体，或者是塑形啊、调养皮肤。\n\n这群，找到有共同客户的店铺谈合作，这样引来了500人的流量，而这家健身会所容纳不了这么多人，所以就采用先到先得的方式。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_37_0.png)\n\n她已经把人流量吸引过来了，通过那些服装店、美发店，在短期内吸引500人有没有可能？这500人有没有可能全部都是你的顾客？这几乎是不可能的。\n\
    \n我们提供的是初级的瑜伽课程，在免费体验的过程中我们就可以向顾客推出中级的课程，因为人都来到你这里了，要过滤是不是就变得很简单了，她天天来这里练习，练一个月、两个月，让她们升级课程是不是就变得容易了，教练基本就可以成交！\n\
    \n你要明白这些人在不在乎钱？她在乎的是你说的那个结果，一开始你讲的时候，她是不相信，如果她跟你打了一个月的交道，请问一下还有没有障碍？\n\n## 惊天地，泣鬼神！《神套路\
    \ 14》拒绝教条和理论，只有实操和落地！\n\n后来从 500 人里面得出一组数据：17%人购买了中级瑜伽课程，36%的人买了瑜伽服，11%的人购买了其他课程，比如减肥的、塑形的、丰胸的，留下学习的\
    \ 100%购买的各种瑜伽用品。\n\n所以现在你应该明白，前面的 880 元是用来引流的，是让别人来这里体验的，你想一想她在这里半年，你都对她促销，有没有可能对她促销成功？\n\
    \n![](img/e907008141dfe06a048568f43ad61148_38_0.png)\n\n这样的话她的瑜伽馆会不会爆满？爆满是不是有利于口碑的传播，这种口碑在有有钱人的圈子里面是很容易传播的，就会吸引更多的有钱人，说那家瑜伽馆多火爆！！所以后面推出的东西就可以越卖越贵。\n\
    \n所以目前体验式营销，还很少人做，如果你在你的行业内，能够做到前面，你就是这个行业的标杆！\n\n在这个案例内，练习瑜伽的人得到了好处，服装店、美容店、美发店得到了好处，瑜伽馆自然也得到了好处，所以这个是一个三方共赢的局面。\n\
    \n## 第 07 课：营销大师的 70 个神套路\n\n下面是一诺老师在线下交流时，给亲传弟子分享的 70 个营销神套路。\n\n### 价格折扣\n\n\
    - **方案 1：错觉折价——给顾客不一样的感觉**\n  （例：“花 100 元买 130 元商品”错觉折价等同打七折，但却告诉顾客我的是优惠不是折扣货品。）\n\
    \n![](img/e907008141dfe06a048568f43ad61148_39_0.png)\n\n- **方案 2：一刻千金——让顾客蜂拥而至**\n\
    \  （例：超市“10 分钟内所有货品 1 折”，客户抢购的是有限的，但客流却带来无限的商机。）\n\n- **方案 3：超值一元——舍小取大的促销策略**\n\
    \  （例：“几款价值 10 元以上的货品以超值一元的活动参加促销”，虽然这几款\n\n- **方案7：百分之百中奖——把折扣换成奖品**\n  （例：将折扣换成了奖品，且百分之百中奖只不过是新瓶装老酒，迎合了老百姓的心里中彩头，而且实实在在的实惠让老百姓得到物质上的满足，双管齐攻收益匪浅。）\n\
    \n- **方案8：“摇钱树”——摇出来的实惠**\n  （例：圣诞节购物满38元即可享受“摇树”的机会，每次摇树掉下一个号码牌，每个号码牌都有相应的礼物。让客户感到快乐，顾客才会愿意光顾此店，才会给店铺带来创收的机会。喜庆元素，互动元素，实惠元素让顾客乐不思蜀。）\n\
    \n![](img/e907008141dfe06a048568f43ad61148_40_0.png)\n\n- **方案9：箱箱有礼——喝酒也能赢得礼物**\n\
    \  （例：此方案涉及的顾客多，且没有门槛要求，所以是最为广泛应用的。）\n\n- **方案10：退款促销——用时间积累出来的实惠**\n  （例：“购物50元基础上，顾客只要凭前6年之内的购物小票，送到店铺收银台，就可以按照促销比例兑换现金。6年以前的，退款比300元融资500万，签订《零风险+对赌》协议，实操作请联系一诺老师助理！\n\
    \n- **方案 15：组合销售——一次性的优惠**\n  （例：将同等属性的货品进行组合销售提高利润。）\n\n- **方案 16：加量不加价——给顾客更多一点**\n\
    \  （例：加量不加价一定要让顾客看到实惠。）\n\n![](img/e907008141dfe06a048568f43ad61148_41_0.png)\n\
    \n### 按年龄促销\n\n- **方案 17：小鬼当家——通过儿童来促销**\n  （例：六一儿童节让孩子自己选择喜欢的玩具,在导购阿姨的陪伴下自己当家选物品，父母则在休息区等候付账。注意时间点，立足点，促销方案，细节取胜。）\n\
    \n- **方案 18：自嘲自贬——中年人最求实在**\n  （例：一家饭店门前门帘为“缺山珍少海味唯独便宜，无名师非正宗图个方便” 模拟“隔壁好小吃店”。自曝取点却突出有点“便宜，方便”。）\n\
    \n300 元融资 500 万,签订《零风险+对赌》协议,实操请联系一诺老师助理！\n\n- **方案 26：爱屋及乌——做好追星女孩的文章**\n  （例：将流行的东西附加赠送给追星的女孩，提高销量。）\n\
    \n![](img/e907008141dfe06a048568f43ad61148_42_0.png)\n\n- **方案 27：“情人娃娃”——让单身女性不再孤单**\n\
    \  （例：在情人节，推出购物即可领“情人娃娃”，加上广告的宣传达极好的效果。）\n\n### 心理与情感促销\n\n- **方案 28：货比三家——顾客信任多一点**\n\
    \  （例：售前劝告“货比三家”提高客户的信任度。）\n\n- **方案 29：吃出幸运——为幸运而疯狂消费**\n  （例：餐馆消费可抽奖，消费越多抽奖次数越多，获奖留影张贴墙上，广告词“幸运，越多越好”。）\n\
    \n惊天地，泣鬼神！《神套路14》拒绝教条和理论，只有实操和落地！\n\n- **方案 30：能者多得——引诱推销的法宝**\n  （例：零食铺，推出买零食即可翻卡片，答对问题送同样的零食，赠品零食小、少、精。抓住孩子喜欢逞能的特点，又有小赠品的满足感。）\n\
    \n- **方案 31：档案管理——让顾客为之而感动**\n  （例：在特定的日子给顾客以短信送礼品的问候打动顾客。）\n\n- **方案 32：一点点往上加——让顾客喜欢上你**\n\
    \  （例：“多一点点商铺”在称重时，拿的少一些，然后一点点往上加，这样顾客有种增加的感觉。顾客消费同样看重感觉哟。）\n\n- **方案 33：模范双星——紧抓民族文化传统不放**\n\
    \  （例：老年用品店用“模范双星”评选活动，评选“寿星”“孝星”。巧用事件传播，提高品牌知名度。）\n\n![](img/e907008141dfe06a048568f43ad61148_43_0.png)\n\
    \n### 摆设促销\n\n- **方案 34：“绿叶效应”——新鲜水果自由呼吸**\n  （例：水果铺体现水果的新鲜，水果上带着叶子。）\n\n### 店铺广告促销\n\
    \n- **方案 41: 现场效应——在现场为自己做广告**\n  （例：羽绒系列当场拆开衣服、被褥让大家看内里的东西。卖点: 眼见为实, 口碑相传, 邀请顾客体现互动性。）\n\
    \n![](img/e907008141dfe06a048568f43ad61148_44_0.png)\n\n- **方案 42: 暗示效应——让顾客自以为是**\n\
