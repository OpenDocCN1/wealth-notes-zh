    2. 第二把金钥匙：找有客户的人，因为客户走向那里。

    3. 第三把金钥匙：找有方法的人，因为方法就在那里！


    **金钥匙一：找有钱的人，因为金钱流向那里；**


    大家都可以发现社会一个普遍存在的现象：有钱的人，越来越有钱，没钱的人，越来越没钱。为什么？很多人都回答说：因为有了钱后，钱生钱啊。难道就是这么简单吗？


    不是的。如果要用来一句话来回答，那就是：因为钱会流向有钱人！钱知道答案。金钱流动的方向代表着市场趋势的方向！


    ## 客户效应

    户，你就成功了一半！


    同时，我们在生活中还会发现一个有趣的羊群效应：哪一家店面或公司的客户多，他的客户会越来越多，哪一个公司的客户少，他的客户会越来越少。


    这是为什么呢？很多时候，我们回答到：因为大家喜欢跟从啊。如果要用一句话来回答，那就是：客户会走向有客户的人；有客户的人越来越有客户，背后有着三个因素：


    - 1、有客户的人，一定有一套很好的与客户建立信任的方法；

    - 2、有客户的人，一定有一套很好的满足客户需求的方法；

    - 3、有客户的人，一定有一套很好的留住客户的方法；


