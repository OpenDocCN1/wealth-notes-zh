    对客户发短信营销1：“恭喜你中了2等奖，获得5折的优惠券！在月底前凭此短信消费有效！”


    短信营销2：“今天是你的生日！祝你生日快乐！本餐厅免费赠送你1个生日蛋糕！并且今天在本餐厅消费5折！”


    联合其他商家一起促销3：联合餐厅附近的KTV游乐场服装店电影院等等，只要在本餐厅消费的，都可以到以上联合的商家9折消费！反过来，到联合的商家消费9折！你，看明白了吗？再到本餐厅消费也打九折。


    ## 商业模式

    段，剪发只需5元，而其他店是30元，这样会吸引很多客户上门，然后再销售1000个会员卡，之后再对会员销售3000元的美容产品。


