    ## 第41课：占据市场的细分套路


    下面是一诺老师在线下交流时，给亲传弟子分享的一个案例。


    雀巢咖啡打入日本市场之前，该公司曾委托当地的市场调查机构从事一项调查分析工作。结果表明，战后出生的年轻人对咖啡的排斥性低于年纪大的人，男性接受的程度高于女性。


    针对这种情况，雀巢公司针对不同对象，制定了不同的行销策略，并通过广告传达产品的信息。


    ——针对以茶为主的老年人，雀巢公司极力塑造日本风味的印象，以日本的传统文化来表现咖啡的味道，说明这是具有深度，对日本有深刻认识的人的饮料。这一做法的目的，仅在于降低老年人对咖啡的排斥，并不是要取代喝茶。


    ——针对年轻人，雀巢则刻意塑造欢乐的气氛，以新潮、时髦、感情和爱情为表现主题。让年轻人感受到雀巢咖啡的超越国界和时代感，视其为年轻一代生活中，一项不可或缺的消费品，从而接受它、认同它。


    ——针对成熟、稳重、事业有成，有社会地位和经济条件优越的中年人，则用金牌咖啡来吸引，暗示成功的人应与金牌咖啡同在。


    雀巢咖啡虽然针对三种不同的消费者，制定了不同的细分化行销战略，但在商品风格的塑造上，却表现了统一的特点，即“高品位的格调，现代人的饮料”。由于雀巢把握了广告的策略和技巧，尽管广告表现的方式有异，却能收到互为补充，相辅相成的效果。


    其实，当有一天你成为一诺老师亲传弟子，你会学到更多这样的案例思维，这一切对你来说都不是问题。


