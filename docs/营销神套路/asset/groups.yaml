    # 第 09 课：广西养猪户神套路 1 年多赚 2.5 倍


    下面是一诺老师在线下交流时，给亲传弟子分享的一个神套路：广西养猪户神套路 1 年多赚 2.5 倍。


    什么是平台呢？平台是相对一个点来讲的，平台其实就是 一个面。


    对经营某一种产品，或者某一类产品来说，一家小店就是一个点，只能交换这一种特定的产品。


    ![](img/e907008141dfe06a048568f43ad61148_57_0.png)


    而平台的概念呢？是通过这个点创造一个面，不仅仅是交换这一种，一类商品，而是交换相关产品的上游，或者下游产品，甚至是不相关的产品，而这种产品是有不同的提供商提供。


    例如：广西壮族的黑猪肉非常的有市场，黑猪肉每斤销售价格一般都在 80-100 元之间，黑猪肉在市场上已经形成了有力的'
  - '[PAGE 58]


    品牌竞争，因此有一家销售黑猪肉的商家想继续扩大市场，但是由于黑猪总数量较少，所以开设连锁加盟有非常大的有难度。


    老师就给他们策划了一个黑猪厨房，这个黑猪厨房就是建立了一个平台，因为有能力消费黑猪肉的客户，消费能力都非常的强，他们通过对黑猪肉品牌的信任，从而消费了黑猪厨房所提供的其他的商品，例如有机菜，高档水果等等。


    从今年 1 月中旬到现在,这家黑猪厨房已经开设了 18 家店铺。


    ![](img/e907008141dfe06a048568f43ad61148_58_0.png)


    这就是通过经营某一个产品从而打造了一个销售平台的真实案例。又或者我们的家纺行业，不仅仅做床上用品，还有窗帘，布艺等等相关产品，这也是一个平台。


    在我们的一般思维里，一家小店只是谋生的手段，根本无从谈起平台的概念，所以一家小店成为平台的可能性也非常小。


    在这里我们要谈的是,小店能不能做成一个平台，其实就取'
  - '[PAGE 59]


    # 惊天地，迈鬼神！《禅堂路 14》拒绝教条和理论，只有实操和落地！


    一般都是品牌商家，对于那些非品牌商家，或是一个小店来说。


    运作到这一步是非常难的。因为它需要品牌的力量。


    也就是说一个小店如果要成为一个平台，常规条件下必须走品牌这一路。


    而今天我们想告诉你的是，一个小店如何直接进入平台运作的最最核心的秘诀。


    ![](img/e907008141dfe06a048568f43ad61148_59_0.png)


    如果你知道，并且运用好它，你就会远远甩开其它小店，如果大家的终点都是一样的，别人走的是七七四十九道弯，你却是直接进入了一条光明大道，直直的进入，没有任何的障碍！


    经营一家小店从经营人心开始，只要你开始懂得经营人心，你的小店就会直接进入平台的经营。


    人心是人对人情感的形象化，经营人心其实就是经营人的情感！人的情感表达主要分为，对物的情感表达和对人的情感'
  - '[PAGE 60]


    表达，如果价值来源于对物的情感表达，那么我们就要增加对人的情感表达，从而增加我们小店的价值感。


    从而区别其他经营者，对物的情感表达这种单一方式，又或者弥补我们对人的情感表达方式的不足！


    在海底捞，当你看到员工跪着擦地，当你看到她们为你抱孩子，搀扶老人，当你发现有人帮你擦皮鞋等等，这个时候我们心里感受到的不仅仅是对物的情感，还有对人的情感。


    ![](img/e907008141dfe06a048568f43ad61148_60_0.png)


    服务到让客户（感动），这也是我们超常规营销十大思维，之口碑思维让客户感动。


    如果说物的情感表达，是冷冰冰单纯物品所体现的价值。那么人的情感表达，就是活生生真实人性的情感价值。而往往这种情感价值更形象、更持久的保留在我们的记忆中，牢牢挥之不去。'
  - '[PAGE 61]


    那我们如果是一家小店, 我们有没有从人的情感价值入手, 去经营我们的小店呢?


    当客人来到店里, 我们能不能投入更多的情感, 来提高我们的总体价值观, 而让客户感知至到, 我们所提供的不仅仅是物品, 而有更多的价值呢?


    如果我们通过情感价值的投入来区别于其它小店, 从而凝聚了一批忠实的粉丝, 那么我们就可以、直接打造平台, 客户需要什么, 我们就可以提供什么。


    ![](img/e907008141dfe06a048568f43ad61148_61_0.png)


    同样我们受制于小店的客户群体受众小的缺陷, 我们有没有把这种情感价值传递给更多的人呢?


    如果我们在经营一家小店的时候, 有客人遗失了钱包, 我们把客户的钱包放在店里, 等着客户自己想起来取走, 那是非常正常的一件事。


    但是当我们第一时间发现钱包被客户遗失在交款台上, 如'
  - '[PAGE 62]


    果客户刚走不久,有可能赶上客户并及时归还,我们有没有立即行动呢?


    又或者客户自己都不知道遗失到哪里了，我们有没有写上一块提醒警示呢？


    又或者甚至我们通过这个小小的事情，引发一个小的故事，来让更多的客户认可我们的情感价值,传播我们的情感价值呢？


    ![](img/e907008141dfe06a048568f43ad61148_62_0.png)


    一家小店,我们如果不把物品作为我们交易的核心,而是人与人真诚的交往,通过这种交往，我们凝聚一批忠实的粉丝,通过真诚的交往,我们创造了各种各样的有趣的故事,传播我们的故事，凝聚更多的粉丝进入我们的平台，最后形成良性循环,持续的打造一个小店的平台。那发展小店的生意是不是就容易多了?


