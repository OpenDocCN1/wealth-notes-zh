    ## 方案56：诱导促销

    办公室同事准备趁国庆到香港血拼，众美眉纷纷请她捎带化妆品，买什么？杨美眉介绍：敏感性肌肤用雅漾护肤产品好；懒人保湿，用兰芝锁水保湿面膜，涂在脸上可以过夜；碧欧泉紧致霜能去除橘皮……男同事一旁听了不由得疑惑：你怎么会熟悉这么多的护肤品？美眉答：全是体验促销的功劳。


    ## 方案57：体验式促销

    也叫“诱导”促销。走进南京路上的置地广场，一楼化妆品柜台都会热情地邀请消费者试妆。在旧貌换新颜的过程中，化妆师就会不着痕迹地进行推介。


    体验过程其实是一个心理诱导过程，品牌化妆品价格不菲，但在实际使用过程中，会渐渐产生物有所值的印象，加上化妆师不断灌输：“女人要对自己好点”，于是，就对自己好点再好点啦。


    ## 促销，还盼再创意

    尽管价格优惠是最有诱惑力的促销手段，但奇特的创意，会起到比降价更有效的促销效果，且让人留下难忘的回忆，这方面，国外有不少成功的案例，值得我们借鉴。


    ### 方案58：伤感促销

    苏联解体时，一位中国台湾商人组织出售了一批印有“苏联制造”字样的消费品，已经或即将绝版的邮票、代表证、书、地图等，广告词很煽情：“挥泪别苏联”、“再见，苏联制造”……消费者心中勾起一股伤感之情，不由自主地掏钱购买，以作为一个国家一个时代的留念。


    ### 方案59：免费促销

    外国某商业公司的旅游车免费提供服务，司机便是义务导游。车上供应各种食品、饮料、纪念品和日用消费品等，品种与商店基本一样，但价格略高。由于是免费坐车观光，游客过意不去，于是解囊购买。


    ### 方案60：奇物促销

    外地有家小烟酒店养了几只八哥，店主常常让八哥直接将火柴、口香糖之类的小商品送到周围高层住宅顾客的阳台或窗台。


    ### 方案63：团购家装俱乐部

    今年年内，俱乐部前后吸纳会员千余名，成功举办四场团购，为上千户业主找到了最理想的家装方案，让他们购买到最便宜的建材。


    俱乐部的口号是“做南京最好的家装俱乐部”，活动现场，我们听到最多的是“感谢”；每场活动结束后，我们听到的最多呼吁是“俱乐部能否长期举办”。


    **点评**：团购引起了市民和企业的广泛关注，会员称俱乐部为其提供了一个便捷、放心的装修途径；众多家装、建材、家电企业主动联系俱乐部，期待成为合作伙伴。根据签约企业的反馈，六成多会员在活动当日下单，一个“家装团购俱乐部”，让业主和签约企业两头获益。


    ### 方案64：买电器送演唱会门票

    **创意方**：苏宁、五星两大家电卖场


    十运会前夕，南京市民惊讶地从报纸上得知，凭家电卖场的购物小票，就能换取演唱会的门票，而演唱会主角分别是同一首歌和莫文蔚。消息一经见报，家电卖场人流滚滚，销量激增，其中不乏大举团购的队伍以及从附近县市赶来的顾客；目标明确。


    ### 方案65：深夜狂购

    其实南京商家的午夜狂购也并非首次，只是今年的声势尤其浩大；早在今年入伏的第九天，就有家电卖场在夜里22点开业，次日凌晨，周边其他家电卖场开门应战，上演了一幕又一幕南京市民深夜狂购的沸腾场景。


    **点评**：深夜促销在上海等城市已经是屡见不鲜，一经运用到南京，立即刺激了各大卖场的消费业绩，收效显著的商家也爱上了这一促销法宝。


    透过众商家皆大欢喜的场面，我们还看到南京商业的升级提档，也许过不了多久，商家和市民就不会再把南京归为二线城市，更多行业翘楚也将在南京拉开。


    ### 方案66：鲨鱼养进浴场

    **创意方**：某休闲中心


    今年上半年，某休闲中心的男宾部建起了一个巨大的水族馆：高2米，占地约10平方米，全玻璃的封闭式鱼缸紧靠浴池边，当中有三条小鲨鱼和一只300多岁的海龟和平共处。蔚蓝的海水，直达天花板的玻璃墙，客人泡澡时，仿佛就置身于海水之中。


    在浴池旁建一个气派的鲨鱼馆，在南京是第一家。工作人员介绍，这种微型海底世界之所以受欢迎，是因为它实在是太壮观了！谁不记得《大白鲨》里那让人闻之色变的海上霸主？如今它们被困在小小的鱼缸中沦为宠物，让人悠闲自在地观赏。


    此外，这也彰显了商家的财力。像他们的鲨鱼，每条是7000-12000元，海龟的价格则在1万元左右，建个大鱼缸，加上净化水的装备，再加上氧气泵、水泵等等，至少也要花50万，此后的维护费更是无底洞。但是，客人们对此无不赞叹有加。


    **点评**：自从比尔·盖茨家那个以巨型鲸鱼缸为背景墙的客厅图片广为流传后，有钱的商人就按捺不住养鲨鱼的欲望了，当海上无敌的鲨鱼也被玩弄于股掌之间时，所获得的心理满足感是不言而喻的。


    ### 方案67：旅行线路附带详细行程表

    **创意方**：某国际友好旅行社


    该旅行社推出的澳大利亚豪华8日游的行程表上，何时出发，几点到几点参观哪个风景区，什么时候是自由活动时间，每顿饭是吃中餐还是西餐，哪些游览项目是自费等所有细节标注得清清楚楚。


    ### 方案70：不定时吃免费饭菜

    **创意方**：某餐馆


    在该餐馆大厅就餐的顾客，只要碰上商家宣布“此时段就餐免费”，已经点好的菜肴、酒水就都属于免费赠送范围。


    活动开始前商家并没有做任何的宣传，活动开始的第一天，被幸运砸中的顾客似乎都没回过神来，认为是商家在开玩笑。待到结账时不少顾客迟疑的脚步，在服务小姐欢迎再次光临的送客声中，脚步才变得坚定起来。


    **点评**：对商家来说这种活动本身代价太高，不可能常常进行，对消费者来说这种活动完全是赌运气，运气好的去一次就能碰上，运气不好的去十次也未必能碰上一回。


    ### 方案71：影像骑士登陆南京

    **创意方**：某酒吧


    10月，某著名的连锁酒吧开业，一大卖点是请来了专业的VJ为酒吧打碟，这在南京尚属首家。


    一般人都比较熟悉酒吧里打碟的DJ，所谓VJ，指的是Visual Jockey影像骑士，他们不但要为Party、Disc Jockey提供视觉冲击，还要负责现场灯光、视频效果的配合。


    ## 以物易物

    再比如我自己，因为是一名营销顾问，曾经对于某一行业公司的内部营销操作非常感兴趣，就以20万的1年顾问费为代价，换取其内部营销操作的知情权。


    看到了吗？


    没钱就做不到的事情，“以物易物”就可以让你做到！


    为什么你要做“以物易物”？有什么好处？


    - 1、超低成本，最省钱的购买方式

    - 2、如果你是美容院的，一次美容要1000元，但实际成本只要100元；如果你是卖家具的，一套沙发要5000元，但成本也许只有2000多！


    明白了吗，当你交换时，你付出的只是“成本价”，而交换的却是“市场价”！


    此时，你将迅速提升2倍、5倍、10倍的购买力！


    - 2、你交换的资本，还可以分期付款！


    比如你是餐饮行业，你用餐饮券去兑换，对方肯定不可能一次性使用，甚至要1年的时间才可能消耗完！而你，将实现修办公室，打算用等值的空调设备和服务来交换！


    如果交易不成，怎么办？请看：


    “以物易物”谈判的2大成交策略！


    **成交策略1**：用对方的零售价来交换。


    这里，为了提升交易的成功率，你最好告诉对方，你可以以“家具零售价”来交换，不是以他的促销折扣价来交换。


    大家都知道，商家产品的零售价一般都会定的非常高，卖的都是折扣价，这是商场常见的“高价低收”策略！


    此时，店老板会在心里算一笔帐的，他会觉得，这笔交易可以让自己赚到很多的利润！


    **成交策略2**：告诉对方如何使用你的产品。


    比如，你可以告诉家具店老板，他可以拿这个空调去做为营销的赠品，提升顾客购买的成交率！


    ### “三角交易”

    假设你是一家餐厅的老板，你的产品零售价是产品成本的5倍。现在，你想用餐卡去换一辆你喜欢了很久的10万元汽车！


    但是，经销商他不需要你价值10万的餐饮服务，那你怎么办？再找其他经销商？也许你还是被拒绝！


    我们知道，营销必须100%站在对方的角度上，什么样的产品或服务可以让他愿意交换呢？肯定是能让他赚钱的、或者是省钱的！


    而汽车经销商，每个月都要花大量的广告费用于电台、电视台、报纸等广告媒体。于是，办法出来了，你可以利用“三角交易”，来达成你换取汽车的目的！


    餐饮——广告媒体——汽车经销商


    第1步：找到汽车经销商喜爱投放广告的电台、电视台、报社，以餐厅的消费来交换广告。


    （注意，参考文章上方所讲到的谈判的成交策略，可以告诉对方你可以把交换的餐卡用作企业福利，或者回馈观众、读者。）


    第2步：用广告跟汽车经销商交换汽车。


    （这里需要注意的是，像汽车这样产品的利润是很小的，所以交换时的价格可能要车价的2倍，这样三角交易才可能成。）


    抵销电脑价格的50%，你只需要支付电脑价格的一半。


    但你实际购买电脑的成本也许降低了3分之一，而且还是免息的分期付款。


    ### 旅游杂志

    有一家旅游杂志，用全页广告跟航空公司交换机位，而这个版面通常很难卖出去，一页的实际成本也不高，却换取了超过10倍价值的机票！


    为此，这家杂志设有专业的“以物易物”部门，将机票以8折转售，比其他渠道购买要便宜2成。于是，这页卖不出去的广告，迅速变现盈利，而这个“以物易物”部门居然成为他们新的利润中心！这有没有激发你的灵感？


    你的公司是否也可以“以物易物”变成利润中心，让你在30天内迅速赚到2倍、5倍、10倍的利润！


    其实，当有一天你成为一诺老师亲传弟子，这一切都不是问题。


    ## 格局决定命运

    决于店主的格局。


    心有多大，舞台就有多大！有多少人从经营一家小店开始，就梦想着通过这家小店打造的是一个辉煌的未来呢？


    更多的人想的是如何糊口，如何马上能赚到更多的钱，一旦盯在线上，人的格局就很难提高的起来。


    所以一家小店的命运就这样被决定了。


    如果你想改变自己小店的命运，如果你不甘于一家小店，而是在努力的铺设自己的未来。那么你就可以继续往下看，下面的内容一定会触动你，让你重新规划自己的小店。


    当我们经营一家小店的时候，我们经常想的就是如何打造自己小店的品牌，通过塑造品牌，来锁定消费群体，争取更大的利润空间。这也是我们看到的最多的一步。


    只有极少人能看到如何通过一个品牌来运作成一个平台。让平台为自己赚钱。在这个平台下，交换的已经不是自己特有的商品，甚至自己的商品已经转化为免费产品，而真正的营利性产品却是其它相关产品。


