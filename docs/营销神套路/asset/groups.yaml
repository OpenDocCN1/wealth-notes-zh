    ### TOP 赞助商雏形：


    尤伯罗斯发现，赞助商掏钱的热情取决于宣传回报的多少，他下决心改变以往奥运会赞助小而散的局面，专心“钓大鱼”。


    本届奥运会规定，总赞助商数目不超过 40 家，尽量控制在 30 家以内，每个行业的赞助商只要一家，底价 400 万美元，诱导企业之间激烈竞争。这个价格使赞助奥运会的“门槛”比以前提升了许多，但有利于树立一个行业唯一的企业形象。


    这一招使大公司都全力投入到竞争中来，可口可乐大战百事可乐而甩出 1200 万美元，富士则以 700 万美元“闪电袭击”击败柯达。


    最后，尤伯罗斯以“5 选 1”的比例选定了 32 家赞助公司。据统计，本届奥运会组委会共收到企业赞助 3.85 亿美元，而上一届赞助商达 381 家公司，总赞助仅为
    900 万美元，还不如可口可乐一家的赞助费。


