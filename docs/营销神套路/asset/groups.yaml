    有钱的人代表钱流向那里，说明项目在那里，或钱就在那里。


    有人的人代表客户就在那里，说明需求在那里。


    会做的人代表方法在那里。


    那么：通过借力有钱的人获得项目或钱，通过借力有人的人获得客户与市场需求，通过借力会做的人把项目与需求结合起来，把钱收回来。


