  md: "\n\n除了以上提及的“开源”，尤伯罗斯还使用了各种节流手法。\n\n最著名的就是大大加大奥运志愿者的人数。在洛杉矶奥运会时，有 28742 名志愿者经过统一和有组织的安排，从事着各类工作：\n\
    \n![](img/e907008141dfe06a048568f43ad61148_25_0.png)\n\n- 赛场支持\n- 医疗卫生\n- 媒体\n\
    - 陪同代表团和个人\n- 公共关系\n- 鉴定服务\n- 技术和通讯\n- 运输\n- 赛场的入口控制\n- 餐饮\n- 财政\n- 行政管理\n\n同时，有一支特别的志愿者在奥运会下设的\
    \ 25 个分委员会中工作。\n\n除此之外，洛杉矶奥运会尽量不修体育场馆，不新建奥林匹克村，以租借的两座大学宿舍代替。\n\n另外，还以拉赞助的形式，兴建了一座现代化的竞赛用游泳池及自行车赛场。\n\
    \n最终，洛杉矶奥运会盈利 2.25 亿美元，尤伯罗斯本人也赚到一个多亿，开创了私人举办奥运会的先河并载入史册。\n\n就是这么简单，美国富翁通过神操作，身价倍增\
    \ 8 倍。\n\n## 第 03 课：培训业务神操作一招成为销售冠军\n\n下面是一诺老师在线下交流时，给亲传弟子分享的一个神套路：培训业务神操作一招成为销售冠军。\n\
    \n某公司是销售培训光盘产品的，针对企业老板、高管等高端人士。他们主打的产品是 980 元一套的光碟，处于市场的中等价位。\n\n![](img/e907008141dfe06a048568f43ad61148_26_0.png)\n\
    \n由于这类的培训产品在市面上非常多，其 980 元的内容早就被“盗版”过了，别人完全可以十几块钱就买一份。甚至到网上还可以免费下载观看。\n\n因此，产品本身并没有突出的竞争优势，也没有什么销售卖点。公司内有一个入职不久的年轻女推销员，由于缺乏经验，销售业绩一直不好，处于公司的倒数几名。\n\
    \n有一天这个女孩子找到了我，询问对策。\n\n我告诉她，要“整合资源，放大价值”。\n\n在我的指导下，她首先锁定了一些核心客户，都是以前联系过的老客户——那些人都属于可买可不买，但一直都没有成交的人。\n\
    \n接下来，她找到广州海印桥附近的电器商场。那里有很多卖DVD播放机的商家，物美价廉。一套普通的DVD播放机才200多块，量大更便宜。\n\n![](img/e907008141dfe06a048568f43ad61148_27_0.png)\n\
    \n所以，她就开始把光碟捆绑DVD机，一起出售。\n\n这样的组合就是针对“老板们”来设置的。\n\n光碟是一定要通过DVD来播放的，虽然很多老板家里可能已经有了DVD机，但是多一套也无所谓。\n\
    \n第三步，她就开始带上光碟及DVD机，上门跟这些老客户沟通。\n\n“……黄总，您好。我是公司最优秀的员工，我这段时间做的业绩非常不错，因此，公司奖励了我一套\
    \ DVD。\n\n但是，我要这套 DVD 没有用；因为我是打工的，我住在宿舍里，因为每天很晚才回去，也没有时间看电视。\n\n而您一直以来非常支持我的工作，所以，为表示感谢。我想把它送给您。我今天专程送\
    \ DVD 给您的。\n\n![](img/e907008141dfe06a048568f43ad61148_28_0.png)\n\n同时，我这个月的业绩还差\
    \ 2 套没有完成，黄总您是否可以帮我完成一套，或是推荐您的朋友帮我完成一套呢？……”\n\n一般人爱面子，看到女孩子还没有卖光碟的时候，就送 DVD 机过。将心比心，受人家一个人情，这些老板总是会想办法还上的。\n\
    \n很多时候，这个女孩还会加上一句：“如果您现在手头上没有现金不要紧，您先收着光碟，方便的时候再把货款打到我们公司账户上。”\n\n## 第04课：大师神套路放长线钓大鱼\n\
    \n下面是一诺老师在线下交流时，给亲传弟子分享的一个神套路：大师神套路放长线钓大鱼。\n\n营销点评：商业模式就是帮你做产业链。\n\n一个企业的价值链的每一个环节，都能创造价值。比如说设计环节增加资源，比如说施工环节增加资源，比如说在拿项目环节增加资源。有了资源，就会产生竞争优势。\n\
    \n> 现在是客户之间的竞争，现在是平台之间的竞争！\n> ——一诺老师\n\n比如很多企业通过改革开放搞加工，你加工鞋我也加工鞋，你加工冰箱我也加工冰箱，你加工空调我也加工空调，于是，大家都变成了性质差不多的加工企业，同质化严重。\n\
    \n这个时候谁做品牌谁厉害，这个时候谁做技术谁厉害，这个时候谁做渠道谁厉害。\n\n所以说价值链里面某一个环节重点增加资源，你就拥有优势，尤其是稀缺资源的开发和增加，打通产业链。\n\
    \n我们知道，红星美凯龙是一个家具城，其实你只看到了表面。\n\n其实红星美凯龙现在有三个身份。第一个是零售公司，就是卖家具的。\n\n第二个是地产公司，类似麦当劳占地为王，收租金。第三个就是金融公司，准确点叫类金融公司，有点跨界经营的性质。\n\
    \n它的东西卖了钱不马上给客户付费，押你三个月，它用这三个月的钱去做房地产，做金融投资。\n\n![](img/e907008141dfe06a048568f43ad61148_30_0.png)\n\
    \n所以，红星美凯龙是一个类地产公司、类金融公司，最后才是零售公司，醉翁之意不在酒。大家从这个层面就可以看出来，它突破了专业化的概念。\n\n理解这个时代在发生什么变化，你才能把握这个时代的脉搏。\n\
    \n## 第05课：大师神操作事件营销引爆市场\n\n下面是一诺老师在线下交流时,给亲传弟子分享的一个神套路:大师神操作事件营销引爆市场。\n\n在20世纪80年代,一个名为爱德华·劳埃德的英国人,在德国莱比锡,以制造了“马口铁事件”的犹太人保罗·朱利叶斯的名字,创办了世界上第一家新闻事件策划公司。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_31_0.png)\n\n在爱德华·劳埃德看来,在这个麻木的世界 上,再没有比“新闻事件”更能够神速有效地传播“信息”了。\n\
    \n一次“车祸”,一场“诈骗”,一起“纠纷”,甚至自然界的每一种天灾人祸,都是可被借来进行宣传推广活动的。\n\n正是基于这种“谬论”,劳埃德成立了奇特的“保罗·朱利叶斯公司”,专业设计和制造任何有利商品促销,和名人包装的。\n\
    \n300元融资500万,签订《零风险+对赌》协议,实操请联系一诺老师助理!\n\n## 惊天地，泣鬼神！《神套路 14》拒绝教条和理论，只有实操和落地！\n\
    \n期间，他还接受三家电视台的采访，表示了自己对保罗·朱利叶斯家族的尊敬和爱戴，决心继承和发扬保罗·朱利叶斯的商业精神。\n\n![](img/e907008141dfe06a048568f43ad61148_32_0.png)\n\
    \n采访实况在黄金时间滚动式播出，用劳埃德自己的话说，这些都是免费的，也是合法的。\n\n法院结案时，劳埃德主动要求承担所有诉讼费用，包括“原告”的旅行和食宿用账，并付给“原告”200\
    \ 万马克的署名权。\n\n就这样，官司了结了，劳埃德和他的公司成了这一年度莱比锡最受关注的新闻和话题。\n\n当他的副手将他“赢得”的 200 万马克送还给他时，他实际上为推销自己的公司，只花了\
    \ 6000 马克的诉讼费，只相当于当时电视台黄金时间 2 秒钟的广告费用。\n\n这一策划后来被许多人认为是世界上最成功、最有效、最省钱的一次经典的“广告”。\n\
