    \n（一诺老师亲传弟子文字分享记录）\n\n今晚跟大家分享的主题是：如何通过免费模式来撬动整个后端市场！\n\n希望大家先不要去怀疑接下来我分享的案例是否可行，先看下他们的商业模式。\n\
    \n![](img/e907008141dfe06a048568f43ad61148_128_0.png)\n\n先分享日本的一个宠物租赁案例，是这样的：\n\
    \n在日本，人们只需要支付少量的租金和押金，就可以带走一只善解人意的可爱宠物。\n\n免费模式可以降低消费者的心理屏障，因为免费让他们觉得没有任何损失。\n\
    \n所以看到免费的东西，即使消费者本来不感兴趣，也会去\n\n惊天地,泣鬼神!《神套路14》拒绝教条和理论,只有实操和落地!\n\n那么, 这些宠物租赁商店,\
    \ 依靠什么获得收入呢?\n\n人是很容易与宠物产生感情的, 哪怕客观条件再有限, 那些与宠物难舍难分的消费者最终也会将宠物买回家。\n\n通过这种无利润出租或免费出租的方式,\
    \ 商家创造了足够的时机, 令消费者与宠物建立深厚的感情, 最终达到销售宠物的目的。\n\n![](img/e907008141dfe06a048568f43ad61148_129_0.png)\n\
    \n很多租着租着, 就喜欢上了它, 后面就更愿意花钱购买了, 哪怕再贵。\n\n运用免费模式取得的宠物销售成果, 只是阶段性的胜利, 而绝非是终点！更牛逼的还在后头,\
    \ 我们接下来看看他们是怎么通过免费模式撬动后端整个市场的！\n\n### 三、后端市场分析\n\n宠物租赁商店的工作重点, 其实放在后端, 前端靠租赁宠物、销售宠物,\
    \ 建立其客户资源, 后端可以引入其他产品或服务\n\n务，如产品使用情况追踪调查、上门维修、免费检测等等。那么我们来看看，他们是怎么布局他们的后端的。\n\
    \n#### 1、宠物疾病检查\n\n对于租出或售出的宠物均设有跟踪服务，定期提醒消费者或者直接为消费者的宠物检查免疫。\n\n![](img/e907008141dfe06a048568f43ad61148_130_0.png)\n\
    \n#### 2、建立VIP制度\n\n- 1）为VIP客户提供免费传授宠物护理知识、免费为宠物拍摄艺术照、赠送宠物饰品等优质服务。\n- 2）还会邀请VIP客户们，参加店内举办的宠物秀，或定期举行宠物交流会等活动。\n\
    \n这些活动以情感交流为诱饵，旨在提供一个平台，让众多拥有宠物的人亲近自然，互相沟通，交流饲养心得，与宠物欢乐共舞，使其不再把宠物视为玩物，而是当作自己的家庭成员或者好朋友。\n\
    \n在这过程中，抓住一切有利时机，向这些消费者长期出售宠物食品、药品、饰品、打理工具等一系列宠物相关商品。\n\n由于持续不断地抛出情感性诱饵，充分强化了宠物交流平台的粘性，使得消费者的忠诚度进一步提高。\n\
    \n#### 3、升级服务\n\n![](img/e907008141dfe06a048568f43ad61148_131_0.png)\n\n一方面会协助政府、社区和其他社团组织建立《宠物公约》，并免费发放《宠物公约》手册，以约束养宠者在公共场所的行为，并定期到社区宣传宠物疾病防治、寄生虫危害和治理等养宠物相关知识，号召广大爱好宠物者文明养宠。\n\
    \n另一方面向客户展示自己是如何将宠物训练得乖巧可人的，同时又向客户提供宠物训练服务。\n\n通过不断提供升级服务，人们就很容易养成养宠物的习惯了，当然就会对宠物租赁商店这样的一个平台进行持续消费。\n\
    \n比如，可以提供的后端盈利服务：销售宠物食料、健康免疫检查、宠物洗澡服务、宠物训练、宠物交配服务，等等\n\n大家看下这个案例的思维导图\n\n![](img/e907008141dfe06a048568f43ad61148_132_0.png)\n\
