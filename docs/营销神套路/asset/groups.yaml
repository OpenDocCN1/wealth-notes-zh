    在“尤伯罗斯模式”中，电视转播权招标和“选择唯一商家模式”（奥运 TOP 赞助商计划的最早启蒙形式），是核心的组成部分，后来也成为了历届奥运会掘金的两大主要手段。


    ### 电视转播权招标：


    在电视转播权的出售中，尤伯罗斯首度采用了招标的办法。组委会规定每个有意竞标奥运会转播权的电视公司须先支付 75 万美元的定金。这些定金存在银行里，仅每天的利息就有
    1000 美元。


    漫长的招标谈判过程结束后，这些巨额利息已经成为组委会的第一桶金。


    同时，尤伯罗斯亲自出马游说。在美国三家最大的广播公司的竞争中，美国广播公司最终以 2.25 亿美元买下 16 天比赛的转播权，并同意提供 7500 万美元的技术设备。而在之前最高的电视转播权收入，也不过是
    1980 年莫斯科奥运会的 1.01 亿美元。


    ![](img/e907008141dfe06a048568f43ad61148_23_0.png)


