  - '[PAGE 17]


    # 第 01 课: 羊毛出在狗身上,让猪来买单


    中国市场上出现过一品牌，他只 做一款女式睡衣产品，销售价格为 188 元一件，只有两种款式，吊带的和齐肩的，也只有两种颜色，橙色和紫色。他们 用了一个不一样的销售方式：
    送。


    ![](img/e907008141dfe06a048568f43ad61148_17_0.png)


    怎么送呢？免费!!!


    如果你穿了感觉很好，就请你帮 我们做口碑宣传。如果这件 睡衣送给你，你会要吗？当然会。


    但是他提了另外一个要求，我们 送给你是可以的，快递费 你出可以吗？快递费是 23 块钱一件，并且支持货到付款，支持退货，消费者是零风险。


    也就意味着你花 23 块钱快递费，可以拿到一件价值 188 元的女士睡衣，你们愿意吗？'
  - '[PAGE 18]


    # 惊天地,泣鬼神!《神套路 14》拒绝教条和理论,只有实操和落地!


    也许第一次你看到可能不会动心，但是如果你发现同一时

    段竟然有 157 家网站都在为他打广告，您会不会点开看一看？


    那么，伯良老师相信至少有 80%的人都会订上一件。


    那么送多少呢？


    第一阶段我们就送 1000 万件，各位，我们计算一下，188

    元一件，1000 万件，等于多少钱？


    18.8 亿人民币！


    这家公司愿意拿 18.8 亿砸一个市场，各位，请问大家有这

    样的公司吗？


    应该没有，或者很少。也许很多人都会想，他们是赔钱赚

    吆喝。


    ![](img/e907008141dfe06a048568f43ad61148_18_0.png)


    但是这家公司既不是中国 500 强，也不是世界 500 强，这

    时候，很多人即使只为了满足一下好奇心，都会定一件。于是，

    你就会留下名字、电话、地址，13 天后，快递真的送到你家了，'
  - '[PAGE 19]


    你打开信封一看，这个睡衣质量真不错，在商场里面可能超过188 或者 288，你要不要付这 23 块快递费？


    很多人看不明白，这家公司是干嘛的？是做慈善？还是赔钱赚吆喝？好，下面我带着大家算一笔账，首先我们需要解决货源问题。做生意的人都知道，中国义乌小商品批发市场世界闻名，在那有很多小型的服装加工厂，所以制作起来，成本可以很低。


    而且我要 1000 万件，那么你给别人做 10 块，给我做 8 块可不可以。注意，是夏天的女式睡衣，第一，款式简单，第二，省布料。


    ![](img/e907008141dfe06a048568f43ad61148_19_0.png)


    为什么 8 块钱成本的睡衣，在商场里面可以卖到 188 元？今天如果我们买双鞋子，假如成本是 50 元，可是到商场里面不是名牌的卖 300，是名牌的卖 500，好，请问
    50 元到 300 元中间的钱去哪儿了？商场，没错，商场收了 27%到 33%，营业员'
  - '[PAGE 20]


    分了12%。


    睡衣生产成本只有8块钱，但是到消费者手中没有任何商场环节，所以8块钱的睡衣拿到商场里卖188元。


    这样消费者真正得到了实惠，消费者开心不开心？接下来就是快递的问题了，我们平时快递一样最小的东西，至少需要10块钱。


