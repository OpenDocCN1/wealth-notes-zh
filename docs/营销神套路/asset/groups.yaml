    ## 第33课：温克勒动态定价的价格套路


    下面是一诺老师在线下交流时，给亲传弟子分享的一个案例。


    定价关系到公司的利润，任何一家公司在定价决策前，都应去了解顾客的接受程度。然而，有的公司则认为，价格只是影响消费者购买与公司利润的因素之一。


    行销专家约翰·温克勒曾说，“太多公司企图维持稳定的价格，尤其是那些小公司，这可能就是他们的规模做不大的原因。价格必须随时检视，并不是一直不变，而是注意它是否恰当。由于它是很重要的决策，因此不能稍有忽略。”


    怎样检视价格呢？根据一项定价研究，发现81%的公司，竟然没有任何定价的检视系统，只是单纯地使用成本加价法，


    更有甚者，2/3 的公司，很少运用非成本因素来修正其成本导向的定价。温克勒形容这叫 “令人毛骨悚然的情形”。


    而有的公司即使利用非成本因素定价时，通常也只是参考竞争者的定价，并不是对市场做研究。如果能够从市场研究，定价会做得更好。


    除此之外，温克勒在他的著作《有效定价法》中提及，所有的卓越行销人都要：“计算他们的成本，但是并不让成本左右他们的决策。


    如果成本过高，没有利润可言，他们可以想办法降低成本，或是放弃这个产品。如果你和业务人员商讨定价，一定促使价格滑落低谷。除非你很有技巧，而且业务人员也很客观，否则这是最糟的办法。”


    定价并不是一成不变的，它的目标在于 “弹性、惊奇与经济”，也就是说，在动态的公司里，定价是一个动态的过程。


