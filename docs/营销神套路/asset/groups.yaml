    截至目前为止, 已开发出来专供左撇子使用的产品有: 剪刀、削铅笔机, 左手开的冰箱、棒球用具、高尔夫球用具、左手玩的特制桥牌、开罐器、镰刀、锯子、手表、照相机、内裤、衬衫、玩具手枪……等等。


