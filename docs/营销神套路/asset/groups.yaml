    ## 第 17 课：油漆店神套路年销 5000 万


    **无限可能：40 平店面，年销 5000 万油漆，如何赚更多？**


    这是厦门一家立邦漆的专卖店，典型的南方夫妻店，从 2000 年左右就开始代理经销立邦油漆，至今将近 10 年。


    开店之初，地段不成熟，生意几乎不赚钱。然而，随着经济发展，城市化进程的扩展，这家小店终于等到了春天。别看小店只有 40 平方多点，经过一诺老师亲自辅导，现在每天营销额平均高达
    6 万多元，年销售额高达 2000 万元。


    他是如何做到的呢？且听我细细道来。


    > 最顶级的营销就是——教育！

    >

    > ——诸老师


    这是绝大部分南方人做生意的模式，先从一个小店开始，代理经销一款好产品，等待市场成熟，熬到春天，开始赚钱。


    同样是这个商业区域的另外一家店，是小超市，仅作为王老吉的终端区域经销商。


    只用一辆货车、两个工人专门用于运送配货，仅经销王老吉一项就年赚纯利上百万元，还不算小超市所涉及的其它烟酒代理。


    ![](img/e907008141dfe06a048568f43ad61148_93_0.png)


    所谓树大好乘凉，正是这个意思。


    同时也正是因为这棵大树，虽然遮住了风雨烈日，却也挡住了很多空间。


    我问立邦漆店老板：“你们店有做营销吗？”


    店老板说：“没有啊。如果立邦总部有支持活动，我们就跟着做。如果没有，我们就不做。”


    我问：“为什么自己不做些活动？”


    店老板说：“为什么自己要做活动？如果总部没有这个计划支持，这些钱都要自己掏。”


    我问：“你自己掏钱做活动，多卖出产品，赚的钱也不是自己的吗？”


    店老板说：“但是我现在 的店已经很赚钱了啊，又不是卖不出产品，为什么要做活动？”


    当店老板说到这里时，我终于恍然大悟，明白了一件事。


    这个问题一直困扰了我很多年：为什么大部分的实体店铺没有营销，只是坐等顾客上门？


    ![](img/e907008141dfe06a048568f43ad61148_94_0.png)


    最大的原因不在于他们不懂营销，而是因为他们认为：现在生意不错，不需要营销。


    他们认为，营销是雪中送炭，而非锦上添花！这个道理正如吃药与养生的辩证关系。


    一个活蹦乱跳、没有生病的人，绝不会去吃药；吃药的时候就是生病的时候。


    也就是说：这些店老板认为只有生意差的时候，才需要做营销！生意顺时，他们连想都没有想过“营销”这两个字。


    而且，在他们认为，“营销是需要花大价钱的。”


    如果当你认为“不需要营销”，那么你就永远不会去了解营销。


    ![](img/e907008141dfe06a048568f43ad61148_95_0.png)


    如果当你认为“营销需要花大价钱”，那么你考虑的任何营销都将需要大价钱。


    除非你换另外一种方式问自己问题：“如何花小钱做营销才能多赚钱？”


    我跟油漆店老板说：


    “首先，营销是让你赚钱的，不是让你花钱的。


    第二，有很多种营销方式不需要花大价钱，有时候甚至是零成本的；


    第三，越是生意好的时候，越需要营销，这是为将来生意不好时打基础。”


    油漆店老板问：那你说，“我这个小店，怎么才能不花钱做营销？”


    我说：“很简单，只要做三件事就可以马上让你多赚一倍的钱。”


    **第一：为你的产品进行套餐打包。**


    ![](img/e907008141dfe06a048568f43ad61148_96_0.png)


    如果你仔细统计你的客户群体，你会发现，某类客户往往倾向某类产品组合；比如，作为油漆来讲，有底漆、面漆、木器漆等等分类，而这里面又可以分为非常多的小类，有环氧富锌底漆、水性丙烯酸漆、抗碱封闭底漆等等，面漆又有合成树脂乳液、溶剂型、水溶性、无机料等等。


    80%的普通客户往往会被这些东西弄得眼花缭乱，不知如何选择。因此，这时候决定客户选用哪种油漆，往往是以价格为决定因素的。有钱的客户，无论在底漆、面漆、木器漆，都会选择高档产品；经济型客户，则是另外一种省钱选择；而工程客户，则又是一种选择。


    这些不同的产品选择，形成以价格为决定因素的产品组合。


    高档组合，经济组合，工程组合等。


    那么，你只需将这些产品组合进行套餐打包，针对性进行销售，就可以立即提高你的销售额。


    ![](img/e907008141dfe06a048568f43ad61148_97_0.png)


    不仅减少客户挑选时间，而且能降低服务成本和不必库存，更重要的是，套餐打包能销售更多的产品。


    **第二：改变销售观念，你卖的不是油漆，你卖给家装客户的是关于家的憧憬，你卖给工程客户是关于长期伙伴的友情。**


    油漆店老板在给客户介绍产品时，几乎全部是在现场根据客户需要销售讲解，而其中的大部分问题都是大同小异，往往是价格、性能、使用、调色、售后等事项。


    但是，有一些问题是深深地隐蔽在客户心中，没有说出来。


    正是因为这些问题，决定了客户选购何种产品。这些问题，是客户使用你的产品想获得的心理满足和快乐幸福。


    ![](img/e907008141dfe06a048568f43ad61148_98_0.png)


    仅就这么一个简单的销售更新表，至少能提高生意 10%。


    这个数据不是我杜撰，而是经过大量营销总结后的实证。


    以上这三件事，需要花很多钱的吗？是不是很简单？


    而且，不管你从事什么行业，以上这三个营销技巧只要稍加修改，马上就能应用到你自己的生意当中。


    就是这么简单，老板用了这个神套路锁定客户终身价值，实现轻松赚大钱。


    这是一诺老师的首席顾问弟子天宇老师给我透露的商业秘密，这里不方便向大家透露更多，将来有机会成为一诺老师的亲传弟子，在一诺老师三个月一次的亲传弟子落地内上课上，你们一定要认识天宇老师（顾问落地派）！


    **奇葩：25 张桌的店、员工 5 人，不端茶送水**


    江北区建新东路长安医院对面，横着一排大排档，在众门店中，一家名为“钓龙无刺鲫鱼”的馆子，吊丝得容易被忽略。灯箱广告的 LED 灯坏了一排，除去两扇贴了广告的玻璃门，顾客进出的过道仅
    1.5 米。记者慕名前去采访时，往返了两趟才找到了门。


    ![](img/e907008141dfe06a048568f43ad61148_99_0.png)


    好在店内也算别有洞天，进门上楼拐角，贴着二维码的海报抢眼：扫码加微信，一律 8.8 折。这店好生得怪，上二楼即为天台、下一楼则是背街，就这么也摆下了 25
    张桌，门面虽小，夏季生意却好得让人眼红。


    > “主打无刺鲫鱼和干锅，95%订单从微信来，员工 5 人，其中 1 人为服务员，不端茶送水，只收发票顺便兼职打扫清洁。”陈星宇说，旺季一个月流水能达 15
    万，冬天稍冷清，但也时不时有微信好友的企业高管来包场。


    ### 发现：全靠微信、一道菜曾火了 3 个月


    才开馆子时，陈星宇也走过传统路线。发传单、做车载广告什么的，折腾三五次，10 万元的退伍费就见底了。2012 年，陈星宇守着这家不温不火的小门面。“店面小，还挤在一堆大排档里，很少引人注意。”陈星宇说，直到
    2013 年初，在朋友的指点下，他才开始用微信做生意。


    ![](img/e907008141dfe06a048568f43ad61148_100_0.png)


    刚开始几十个好友，却有能力让一道“奇葩”菜火了三个月。“去年 4 月，一位老顾客忽然想吃番茄味的炒丝瓜，我硬是让厨子整了出来，顾客相当满意，当即传了微信，好友一转发，第二天有人点名来吃‘番茄炒丝瓜’。”


    陈星宇说，这道黑暗料理捧红了馆子 3 个月，也让陈星宇见识了微信之威。“爆点、爆点、爆点，不怕门店小就怕爆点少。”后来，陈星宇通过打折，进店就让顾客扫码关注，天天挖空心思想着如何和顾客玩。


    ### 玩法


    “饮食选择有很多，能带给食客快乐，才会成为首选。”陈星宇说，而这得靠互动性极强的玩法。通过玩，他的微信好友，仅一年就从最初的三四十人增加到数千人：营业额从一天三四百元到旺季一月超过十五万元。


    ![](img/e907008141dfe06a048568f43ad61148_101_0.png)


    ### 玩法一：玩微信要有“店魂”


    **要点：不开公众号，用私号写段子**


    商家玩微信，一定要有可持续的“店魂”，比如金晶妹儿的买家秀，烧白哥的相亲秀。“我的特点就是吊丝爱玩也爱吹垮垮。”陈星宇确定了路线，用玩的方式天天送福利。


    “要和顾客玩起来，公众号不行，没人看，还要靠私号，但私号也讲究人格化。”陈星宇的第一招就是讲故事，写段子。他善于利用自嘲来逗顾客开心，每天段子不超过 3 条，绝对不打硬广告，有时候他还像顾客一样去批评某道菜不好吃，将私号人格化。


    ### 玩法二：玩微信要有米巴活


    **要点：一起打飞机打进前三就送礼**


    “除了吹垮垮，这个私号还喜欢打游戏，所以独乐乐不如众乐乐。”去年夏天，陈星宇邀约微信好友玩手游“雷霆战警”、打飞机竞赛，每周公布一次战果，超过他的前 40
    名送花生一份，前三名免费送菜品。游戏一推出，天天都有人加好友私聊：老板，我今天第几名？加微信：631088107


    ![](img/e907008141dfe06a048568f43ad61148_102_0.png)


    另外，店里每出一道新菜品，陈星宇会在微信上发布征集菜名。名字被选用的，素菜可在店里终生免费，荤菜则享受高额折扣。被选中菜名的顾客钟宇姣，就获得了一道素菜的终生免吃权：“吃了一个夏天现在都吃够了，不过关键是好耍！”


    ### 玩法三：线下跟着微信玩


    **菜单做成答题卷，点菜请做简答题**


