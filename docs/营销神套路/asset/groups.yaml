    ## 杠杆借力分析一:你最擅长什么？


    我们的突破口，是找到自己最擅长的领域！


    不管你从事什么行业，不知道你你有没有这样的一种感觉，当你做自己最感兴趣、最擅长的事，是不是效率非常高，是不是做起来非常轻松愉快呢？


    我时常跟咨询过我的网友交流，他们会经常问到的问题是“我现在很迷茫，不知道要做什么才好？”、“不知道去做这行业好不好？”“不知道如何选择行业？”“我手头上有很多资源，不知道怎么利用？”


    我给他们的一致回复是:只有适合自己的，才是最好的。最好的，就是最适合自己的，是自己最能胜任的事，不管是方


    记得，我在第二期杠杆借力营销特训营中，讲到杠杆借力的借力对象，分析这个课程中，特地问你们一个问题：你们知道吗？杠杆借力的最高境界是什么？


    我们很多学员都冥思苦想着，就出现了各种各样的答案，比如，资源、人脉、金钱、工具、店铺、广告等等，但是没有一个答案让老师满意，思考一下，你认为杠杆借力营销中借力的最高境界是什么？


    ![](img/e907008141dfe06a048568f43ad61148_141_0.png)


    最后我给了一个答案，告诉大家说："你们真笨啊，是借智慧啊，谁能够借助老师的智慧，还用担心不成功的吗？这一固执的营销思维，顿时被老师打开了。


    我相信很多人，一定会想到老师的答案，但是令我深有体会的不是这个，而是：


    我们一定要跳出固有的思维方框，固有的思维观念，不能太执着，太固执，也许换一个思维，换一个角度，换一个方向，象的特征属性，比如年龄、性格、职位，然后分析，他目前所需解决的问题，也就是他的需求，再则，就是切入到他的愿景模式中去，满足他的这种心理需求，自然地，他就会权衡利弊，与你建立合作关系，让你轻松借力于他了。


    前面分析了如何向借力对象借力，那么接下来，一起来探讨下，当你借到了力，你该如何运用这个资源，来完成你想做的事情呢？


    ![](img/e907008141dfe06a048568f43ad61148_142_0.png)


    ## 杆借力分析五：


    ## 借力第二环：借闲置场地


    在跟很多网友聊天过程中，我发现有以下几个特征：一是身处在大量资源环境中，却不知道资源在哪里；二是身处在大量资源环境中，却不知道如何充分利用；三是不知道如何挖掘


    ![](img/e907008141dfe06a048568f43ad61148_143_0.png)


    我常说，资源不是发现的，也不是创造的，而是整合的！整合资源，是杠杆借力中的一个重要的环节。关于资源分类，可以是人脉资源，自然资源，物质资源，人力资源，信息资源，社会资源等。


    在杠杆借力营销课程中，我给大家分享了一些如何轻松借力周围资源的方法，请认真思考以下几个问题：


    - 1. 他们在做什么？

    - 2. 他们身上有什么优势？

    - 3. 他们是运用哪些资源在做自己的事情？

    - 4. 他们在用哪些资源帮助他们把生意做得更好？


    > “我借用你的场地，我不是用来做任何商业行为，只是用来带领学校里的学生晨读英语。”


    这样，借力是不是合情合理，后勤主任那边肯定没有太多……


    压力了，而且能够达到一举两得的结果，甚至超出了后勤主任的思维，他没想到的是，你用这块闲置的资源来带领学生晨读英语。后勤主任听了之后，是不是会很乐意接受你呢？


    这也是杠杆借力的客户愿景模式公式中的最高境界，超出客户的想象，给客户一个惊喜！


    ![](img/e907008141dfe06a048568f43ad61148_144_0.png)


    ## 杆借力分析六：借力第三环：借力于新东方


    新东方，相信，已经是家喻户晓，知名品牌的英语培训机构。


    再次迎合了学校的教学理念，满足学校教学的需求，解决了学校的一个疑难，帮助学生提高英语成绩。


    从这次借力来看，不仅借力权威，更借力新东方的影响力，这样是不是更有说服力呢？


    在你借力过程中，肯定会得到借力对象发来的疑问，为何我要借力给你？我借给你，你真的能达成对我的承诺？我凭这


    三是你的客户在哪里，你就要去哪里找，这也是杠杆借力 营销流程七步中的一个重要环节，参加英语俱乐部的学员，是 不是也是英语爱好者，是不是很想提高英语成绩，这样就省下
    来广撒网的费力局面了。很快地找到了潜在客户。


    ## 无本连环借力，完美展现


    ![](img/e907008141dfe06a048568f43ad61148_145_0.png)


    于是，一个多方借力、多方获利的经典营销案例产生了。 看完这个案例，你明白了吗？是不是杠杆借力是如此的神 奇？带着疑问与期待，接着来听老师的分析：（重点之处）


    - 1、 投资合作是杠杆借力营销吗？

    答案是：不一定，借助别人的资金合作开办项目，或借助别 人的势力合作开办项目，共同经营，这是一种很低级的杠杆借 力。这种借力经常失败，原因在于你要让别人出很大的力气。


    - 2、 周华案例成功之处在哪里？


    答案是：这个案例的成功之处在于，不仅仅只思考了借力于别人，还帮助别人省力。这种杠杆借力将会是最好的成功模式。


    3、杠杆借力只向一个人或一个单位借力吗？


    答案是：不一定，周华的案例就说明了，杠杆借力不仅仅只向一方借力。周华现在见到老师时，经常说的一句话是：老师您的1+2+3+4=10，真是神奇！


    > 走自己的路，不如踏着成功者的脚步！

    > — 潜 意 师


    这句话是什么意思呢？


    假如我只有一份能量，这份能量通过+2 再+3 再+4 就能够=10了，我不仅仅自己圆满地达成了目标，也帮助那些2份能量，3份能量，4份能量的人一起达到10的目标。


    这里，不管是周华，后勤处、英语俱乐部，还是新东方，他们都得到了十全十美的结果。尽管他们有比周华更多的能量，但 他们也期待着这个1份能量的出现，来达到共同的完美结果。


    就是这么简单，英语培训用了这个神套路一年多赚100万。


