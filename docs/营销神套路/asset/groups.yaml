    # 第二篇章：揭秘连环杠杆借力营销思维


    ## 杠杆借力分析一:你最擅长什么？


    我们的突破口，是找到自己最擅长的领域！


    不管你从事什么行业，不知道你你有没有这样的一种感觉，当你做自己最感兴趣、最擅长的事，是不是效率非常高，是不是做起来非常轻松愉快呢？


    我时常跟咨询过我的网友交流，他们会经常问到的问题是“我现在很迷茫，不知道要做什么才好？”、“不知道去做这行业好不好？”“不知道如何选择行业？”“我手头上有很多资源，不知道怎么利用？”


    我给他们的一致回复是:只有适合自己的，才是最好的。最好的，就是最适合自己的，是自己最能胜任的事，不管是方


    记得，我在第二期杠杆借力营销特训营中，讲到杠杆借力的借力对象，分析这个课程中，特地问你们一个问题：你们知道吗？杠杆借力的最高境界是什么？


    我们很多学员都冥思苦想着，就出现了各种各样的答案，比如，资源、人脉、金钱、工具、店铺、广告等等，但是没有一个答案让老师满意，思考一下，你认为杠杆借力营销中借力的最高境界是什么？


    ![](img/e907008141dfe06a048568f43ad61148_141_0.png)


    最后我给了一个答案，告诉大家说："你们真笨啊，是借智慧啊，谁能够借助老师的智慧，还用担心不成功的吗？这一固执的营销思维，顿时被老师打开了。


    我相信很多人，一定会想到老师的答案，但是令我深有体会的不是这个，而是：


    我们一定要跳出固有的思维方框，固有的思维观念，不能太执着，太固执，也许换一个思维，换一个角度，换一个方向，象的特征属性，比如年龄、性格、职位，然后分析，他目前所需解决的问题，也就是他的需求，再则，就是切入到他的愿景模式中去，满足他的这种心理需求，自然地，他就会权衡利弊，与你建立合作关系，让你轻松借力于他了。


    前面分析了如何向借力对象借力，那么接下来，一起来探讨下，当你借到了力，你该如何运用这个资源，来完成你想做的事情呢？


    ![](img/e907008141dfe06a048568f43ad61148_142_0.png)


    ## 杆借力分析五：


    ## 借力第二环：借闲置场地


    在跟很多网友聊天过程中，我发现有以下几个特征：一是身处在大量资源环境中，却不知道资源在哪里；二是身处在大量资源环境中，却不知道如何充分利用；三是不知道如何挖掘


    ![](img/e907008141dfe06a048568f43ad61148_143_0.png)


    我常说，资源不是发现的，也不是创造的，而是整合的！整合资源，是杠杆借力中的一个重要的环节。关于资源分类，可以是人脉资源，自然资源，物质资源，人力资源，信息资源，社会资源等。


    在杠杆借力营销课程中，我给大家分享了一些如何轻松借力周围资源的方法，请认真思考以下几个问题：


    - 1. 他们在做什么？

    - 2. 他们身上有什么优势？

    - 3. 他们是运用哪些资源在做自己的事情？

    - 4. 他们在用哪些资源帮助他们把生意做得更好？


