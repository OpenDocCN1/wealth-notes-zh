    ## 第 13 课：营销大师神套路快速引爆市场


    下面是一诺老师在线下交流时，给亲传弟子分享的一个神套路：营销大师神套路快速引爆市场。


    有一位学员对我说：“我的餐厅看来马上就要关门了，我原本做的是午餐，可是我发现我的竞争能力不够，在技术上搞不赢别人（同样价格的菜没有别人做得好吃）。


    后来我就选择了做晚餐，但是晚餐生意也不怎么好。我又改做盒饭，但是生意还是没有起色。


    正在我准备放弃时，我发现周围有八家网吧，我想，如果我为那些在网吧上网的人送盒饭，应该可以维持餐厅的生意并赢利。


    因为网吧是通宵营业，晚上上网的人，没人为他们送热饭，我想这应该是个不错的思路。现在的问题是，我们的盒饭进不了网吧，准确地说时网吧的老板不让我们销售。


    我的盒饭每盒五元，本来利润很薄，白天销量又少，现在实在做不下去了。我的餐厅还是借钱开的，现在确实是太难了，请老师指点。”


    听了他的陈述后，我对他的餐厅进行了一快速的分析，总结出以下三点：


    - 1. 餐饮特色不够，技术含量不高。

    - 2. 市场小，竞争对手太强。

    - 3. 面对细分市场，在执行上没办法了。


    针对这三个问题，我给他想了一个对策。我将原来每盒统一卖五元的盒饭做了如下调整：


    - 1. 每晚6点到7点，盒饭每盒五元；

    - 2. 每晚7点到8点，盒饭每盒六元；

    - 3. 每晚 8 点到 9 点，盒饭每盒七元；

    - 4. 每晚 9 点到 10 点，盒饭每盒八元；

    - 5. 每晚 10 点到 11 点，盒饭每盒九元；

    - 6. 每晚 11 点到早上 5 点，盒饭每盒 10 元。


    并将每个时段的菜品做了适当的调整。然后再去和网吧老板谈判，如果网吧老板能够接受销售盒饭，可每销售一盒给网吧老板提成 30%。


    试运行一个月后，盒饭每晚有 80-200 份的销量，开始赢利！


    总结分析：


    快餐厅是一个传统的创业项目，但正是因为这样的普通项目，所以常常有人会不假思索就决定开始投资创业了。


    结果投资之后才发现自己有很多困惑不能解决。小小项目伤脑筋，欲进不能，欲退不得，进退两难。


