    ## 第 45 课：营销策略和转移的市场细分套路


    下面是一诺老师在线下交流时，给亲传弟子分享的一个案例。


    1971 年，台湾的摩托车年生产总量已达 15 万台以上，加之其替代产品汽车的需求日增，各厂家为了避免在激烈的市场竞争中遇到困难，其营销策略已渐渐开始转移，主要表现在以下几个方面：


    ![](img/e907008141dfe06a048568f43ad61148_181_0.png)


    - ① 强调摩托车的载重量。摩托车原以速度取胜于脚踏车，成为多数人的交通工具，目前摩托车的广告文题已渐渐转变为运输工具，以此为销售中心，吸引了一大批小型企业和半劳动工人的购买。

    - ② 强调摩托车的荣誉性。摩托车在都市曾是白领阶层的交通工具，渐渐地也成为乡镇购买者心目中的象征性产品。它不但代表购买者的成就，也代表购买者的地位。


    基于这一点，广告的表现以乡土气息为主，尤以方言最多，诸如“赞!”、“三阴摩托车全省跑透透”等等。


    ![](img/e907008141dfe06a048568f43ad61148_182_0.png)


    - ③ 强调摩托车的娱乐性。摩托车的广告及销售以年轻人为对象，在广告的表现上，以气氛情调为主题，借以吸引顾客。


    新三东摩托车的广告，曾以女人的乳房为山峰的化形图片，一部摩托车拾坡而上，旁边写道：“爬山、郊游、舒适!”，企图通过性感广告引起读者注意，从而扩大消费市场。


    其实，当有一天你成为一诺老师亲传弟子，你会学到更多这样的案例思维，这一切对你来说都不是问题。


    了解书籍和课程，请在微信内搜索添加一诺老师官方公众号【梦想教练】。


    ## 第 48 课：迷你冰箱的市场细分套路


    下面是一诺老师在线下交流时，给亲传弟子分享的一个案例。


    国际牌迷你花束电冰箱的推出，是产品寿命周期理论的应用，这一“迷你”的特点，不但为电冰箱开发了新的用途，也给电视机、冷气机等产品的发展带来启示。


    电冰箱在台湾的家电市场中，是最先达到成熟期的产品，在 1976 年时它的普及率即已高达 85%左右。众厂商皆视之为既无利可图亦无远景的商品，即使广告也大都是降价打折的促销。


