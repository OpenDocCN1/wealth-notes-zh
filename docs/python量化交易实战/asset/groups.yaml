    \n## 图 6-6 好的因子与坏的因子\n\n从传统的方法来看，对于不同的候选因子，在模型设定的初期，计算每个周期每只正常交易股票的该因子的大小，按从小到大的顺序对样本股票进行排序，并平均分为\
