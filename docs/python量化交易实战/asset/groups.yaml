    ```\n\n### 9.2.2 线性回归的姐妹——逻辑回归\n\n最后将少用数学公式而采用浅显易懂的方法解释一些量化策略中用到得基本理论和算法。下面将顺带介绍一下线性回归的姐妹算法——逻辑回归。本小节内容的难度较大，读者可以不看数学理论部分，9.4节将以实例的方式进行展示。\n\
    \n逻辑回归主要应用于分类领域，其主要作用是对不同性质的数据进行分类标识。逻辑回归是在线性回归的算法上发展起来的；它提供一个系数 θ，并对其求值。基于此，可以较好地提供理论支持和不同的算法，轻松地对数据集进行分类。\n\
    \n图 9-8 是房屋面积与价格回归示意图，在这里使用逻辑回归算法对房屋价格进行了分类。可以看到，其被较好地分成了两部分，这也是在计算时要求区分的内容。\n\
    \n![](img/66b32d04cb77b904cead314891984c93_199_0.png)\n\n图 9-8 房屋面积与价格回归示意图\n\n\
    逻辑回归的具体公式如下：\n\nf(x) = 1 / (1 + exp(-θ^T x))\n\n与线性回归相同，这里的 θ 是逻辑回归的参数，即回归系数。如果将其进一步变形，使其能够反映二元分类问题，那么公式为：\n\
    \nf(y = 1|x, θ) = 1 / (1 + exp(-θ^T x))\n\n这里 y 值是由已有的数据集中的数据和 θ 共同决定的。而实际上，这个公式求的是在满足一定条件时，计算最终数据被归于某一类的概率。通过公式表示为：\n\
    \n```\nlog(x) = ln( f(y = 1|x,θ) / f(y = 0|x,θ) ) = θ₀ + θ₁x₁ + θ₂x₂ + ⋯ + θₙxₙ\n\
    ```\n\n通过这个逻辑回归倒推公式可以看到，最终逻辑回归的计算可以转化成由数据集的特征向量与系数 θ 共同完成，然后求得其加权和，得到最终的判断结果。\n\
    \n由前面的数学分析来看，最终逻辑回归问题也可以称为对系数 θ 的求值问题。这里读者只需要知道原理即可。\n\n# 实战：回归分析——短时间开盘价与\n收盘价之间的关系\n\
