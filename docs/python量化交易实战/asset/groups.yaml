    ## 前言


    量化投资是一种新兴的系统化的金融投资方法，它综合利用现代金融、计算机、数学以及其他相关行业的知识和方法（包括行为学、心理学等），把投资理念、科学理论和实际数据量化为客观的数理模型，使用计算机技术完成全部或部分的投资决策。


    由于量化投资需要把数据、策略、系统、执行 4 个方面综合起来形成一个有机的整体，因此想使用量化策略去对金融市场进行分析的投资者，除了需要有基本的计算机编程知识外，还需要掌握对金融市场的分析，研究过基本的投资方法。目前图书市场上关于金融投资方面的图书不少，但多数书只是浅显地进行讲解，过于注重零碎的知识和心得体会。本书以实战为宗旨，通过不同方面的阶段案例，让读者全面、深入、透彻地理解量化投资的原理，提高实际开发水平和项目实战能力。


    本书是基于作者 2017~2018 年参与 “北京四两资本” 与 “南京红树林（量化掘金）” 私募项目的实战工作的总结。感谢投资人兼基金经理谭云博士给我的很多指导性意见，感谢黄雪雪女士对本书基础工作的大力支持，也感谢夏编写给予的很多写作意见和巨大的支持和鼓励，最后感谢吴雪女士在本书出版过程中给予的协助。


    ## 本书写作特色


    +   1. 详细深入的解说


    为了便于读者理解本书内容，提高学习效率，本书从最基本的 Python 程序设计开始介绍，直到使用专用的程序工具包进行多种金融投资回测，便于初学者快速入门。


    +   2. 原理与实战结合


    为了让有一定量化投资技术基础的读者进一步提升自己,本书部分内容更偏向于原理的讲解，结合书中的实战案例能使初级量化投资者快速提高自己。


    +   3. 项目案例典型，实战性强，有较高的应用价值


    本书使用项目实战案例进行解说，这些案例来源于作者所开发的实际项目，具有很高的应用价值和参考性。学习这些案例便于读者把所介绍的技术融会贯通，部分案例稍加修改，便可用于实际项目开发中。


    ## 本书内容


    ## 第1、2章 程序设计语言的基本介绍


    第1、2章是本书的基本内容，包括程序设计语言 Python 的基本介绍和安装，以及使用专用编辑器（IDE）PyCharm 进行程序设计的方法。此外，还介绍了部分统计学习方法，为后续的内容打下基础。


    ## 第3~5章 量化掘金的基本使用


    第3~5章介绍了量化掘金工具包的安装和专用编辑器的使用，以及专用金融工具分析包 Talib（官网名为 TA-Lib，遵从中国用户的习惯，本书称为 Talib）的使用。


    ## 第6、7章 多因子策略介绍和应用


    第6、7章是本书首要讲述的重点内容，主要介绍量化投资中最重要的分析方法——多因子策略，详细介绍了基本面多因子以及技术分析多因子策略，以及综合运用多因子策略进行基金组合的设计。


    ## 第8~11章 回归分析和应用


    第8~11章主要介绍回归分析的使用以及使用其进行量化投资的方法，并且额外介绍了一种单独的投资方法——配对交易。这些都是量化投资最基本的策略方法。


    ## 源码及相关资源下载地址


    本书配套的示例源码及相关资源下载地址可以通过扫描右边的二维码获取。

