    \n### 7.2.1 阻力支撑相对强度因子介绍\n\n- 1. 阻力支撑相关概念\n\n阻力位是指指标价格上涨时可能遇到的压力，即交易者认为卖方力量开始反超买方，从而价格难以继续上涨或从此回调下跌的价位；支撑位则是交易者认为买方力量开始反超卖方，从而止跌或反弹上涨的价位。\n\
    \n常见的确定阻力支撑位的方法有，布林带上下轨突破策略（突破上轨建仓买入，突破下轨卖出平仓）和均线策略（如超过 20 日均线建仓买入，低于 20 日均线卖出平仓）。然而，\n\
    \n布林带突破策略在震荡期间出现了持续亏损，均线策略交易成本巨大，且在震荡期间的回撤很大。\n\n- 2. 阻力支撑相对强度\n\n阻力支撑相对强度（Resistance\
    \ Support Relative Strength，RSRS）是另一种阻力位与支撑位的运用方式，它不再把阻力位与支撑位当作一个定值，而是看作一个变量，反映了交易者对目前市场状态顶底的一种预期判断。\n\
    \n下面按照不同市场状态分类来说明支撑阻力相对强度的应用逻辑。\n\n（1）市场在上涨牛市中\n如果支撑明显强于阻力，牛市持续，价格加速上涨。\n如果阻力明显强于支撑，牛市可能即将结束，价格见顶。\n\
    \n（2）市场在震荡中\n如果支撑明显强于阻力，牛市可能即将启动。\n如果阻力明显强于支撑，熊市可能即将启动。\n\n（3）市场在下跌熊市中\n如果支撑明显强于阻力，熊市可能即将结束，价格见底。\n\
    如果阻力明显强于支撑，熊市持续，价格加速下跌。\n\n- 3. 阻力支撑相对强度的计算方法\n\n每日最高价和最低价是一种阻力位与支撑位，它是当日全体市场参与者的交易行为所认可的阻力与支撑。一个很自然的想法是建立最高价和最低价的线性回归，并计算出斜率，即：\n\
    \n```\nhigh = α + β · low + ε, ε ~ N(0, σ2)\n```\n\n当斜率值很大时，支撑强度大于阻力强度。在牛市中阻力渐小，上方上涨空间大；在熊市中支撑渐强，下跌势头欲止。\n\
    \n当斜率值很小时，阻力强度大于支撑强度。在牛市中阻力渐强，上涨势头渐止；在熊市中支撑渐弱，下方下跌空间渐大，如图 7-5 所示。\n\n![](img/66b32d04cb77b904cead314891984c93_154_0.png)\n\
