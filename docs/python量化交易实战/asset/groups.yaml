    \n图 8-3 中证红利指数行业权重分布\n\n## 8.2 基于中证红利的指数增强基金策略的构建\n\n对于不同的指数特点和关系的内容，构建基于其内容的指数基金，最为合适的方法就是尽可能地组合出能够反映基金特点的组合策略。\n\
    \n从前文分析来看，中证红利选择沪深两市中现金股息率高、分红稳定、具有一定规模及流动性的 100 只股票，其特点就是稳定性强、业绩较好，同时具有一定的规模。但是由于要\n\
    求其稳定性，对其个股的成长性并没有太大要求。\n因此，基于分析可以得出，对于中证红利，主要有以下几个方面要进行关注。\n\n- 股息率：股息率（Dividend\
    \ Yield Ratio）是一年的总派息额与当时市价的比例。以占股票最后销售价格的百分数表示年度股息，该指标是投资收益率的简化形式。股息率是股息与股票价格之间的比率。在投资实践中，股息率是衡量企业是否具有投资价值的重要标尺之一。\n\
    - 市净率：市净率指的是每股股价与每股净资产的比率。市净率可用于股票投资分析，一般来说市净率较低的股票，投资价值较高，相反则投资价值较低。但在判断投资价值时，还要考虑当时的市场环境以及公司经营情况、盈利能力等因素。\n\
    - 市盈率：市盈率（Price Earnings ratio，即 P/E ratio）也称“本益比”“股价收益比率”或“市价盈利比率”。\n- 贝塔值：与大盘的联动波动率。\n\
