    \ ID，即每行的标签。标签是独一无二的，一般不会有重复现象。第二列是价格，一般被称为矩阵的目标。目标可以是单纯的数字，也可以是布尔变量或者一个特定的表示。表\
    \ 3-2 中的标签是房屋的 ID，是一个数字标签。第 2、3、4 列是属性值，也是标签所对应的特征值，根据此特征值的不同，每行所对应的目标也有所不同。\n\
