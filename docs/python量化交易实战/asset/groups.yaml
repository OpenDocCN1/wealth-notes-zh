    \ RSRS 修正标准分与 RSRS 斜率值相乘得到 RSRS 右偏标准分。\n\n改进后的 RSRS 计算方法如下：\n\n```\n#斜率越大，支撑强弱（RSRS）越强，反之越弱\n\
    def get_rsrs_weight_classic(symbol,now,length = 200,window = 18):\n    last_day\
