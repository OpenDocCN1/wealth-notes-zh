    \ 上可以独立运行的可执行程序 |\n| 其他 | pefile | Windows PE 文件解析器 |\n\n表 2-1 中给出了 Python 中常用类库的名称和说明。到目前为止，Python\
    \ 中已经有 7000 多个可以使用的类库供计算机工程人员以及科学研究人员使用。\n\n### 2.2.1 threading 库的使用\n\n对于希望充分利用计算机性能的程序设计者来说，多线程的应用是一个必不可少的技能。多线程类似于使用计算机的一个核心执行多个不同的任务。多线程的好处如下：\n\
    \n- 使用线程可以把需要使用大量时间的计算任务放到后台去处理。\n- 减少资源占用，加快程序的运行速度。\n- 在传统的输入输出以及网络收发等普通操作上，后台处理可以美化当前界面，增加界面的人性化。\n\
    \n下面将详细介绍 Python 中操作线程的模块：threading，相对于 Python 既有的多线程模块 thread，threading 重写了部分\
    \ API 模块，对 thread 进行了二次封装，从而大大提高了执行效率。\n\n### 2.2.2 threading 模块中最重要的 Thread 类\n\
    \nThread 是 threading 模块中最重要的类之一，可以使用它来创建线程。其具体使用方法是创建一个 threading.Thread 对象，在它的初始化函数中将需要调用的对象作为初始化参数传入，具体代码如【程序\
    \ 2-1】所示。\n"
  mdcn: "\n诊一样。但是，在大概率下，医生是不会出错的，同样地，模型在大概率下也是不会出错的，所以，还是需要相信模型。\n\n纪律性的好处很多，可以克服人性的弱点，如贪婪、恐惧、侥幸心理，也可以克服认知偏差，行为金融理论在这方面有许多论述。纪律性的另一个好处是可跟踪。量化投资作为一种定性思想的理性应用，客观地在组合中体现这样的组合思想。一个好的投资方法应该是一个“透明的盒子”。\n\
    \n这样做的好处是每一个买卖决策都是有理有据的，特别是有数据支持的。当打开模型时，模型会显示当时选择的这只股票与其他的股票相比在成长面上、估值上、动量上、技术指标上的得分情况，这个评价是非常全面的，只有汇总得分比其他得分高才有说服力。\n\
    \n## 2. 系统性\n\n系统性具体表现为“三多”：\n\n- 首先表现在多层次，包括在大类资产配置、行业选择、精选个股三个层次上都有对应的取舍模型。\n\
    - 其次是多角度，定量投资的核心投资思想包括宏观周期、市场结构、估值、成长、盈利质量、分析师盈利预测、市场情绪等多个角度。\n- 再者就是多数据，就是海量数据的处理。\n\
    \n人脑处理信息的能力是有限的，当一个资本市场只有 100 只股票时，对定性投资基金经理是有优势的，他可以深刻分析这 100 家公司。但在一个很大的资本市场，比如有成千上万只股票的时候，强大的定量投资的信息处理能力能反映它的优势，捕捉更多的投资机会，拓展更大的投资机会。\n\
    \n## 3. 套利思想\n\n定量投资正是在找估值洼地，通过全面、系统性的扫描捕捉错误定价、错误估值带来的机会。定性投资经理大部分时间在琢磨哪一个企业是伟大的企业，哪个股票是可以翻倍的股票；与定性投资经理不同，定量基金经理大部分精力花在分析哪里是估值洼地，哪一个品种被低估了，买入低估的，卖出高估的。\n\
    \n## 4. 概率取胜\n\n表现为两个方面：\n\n- 一是定量投资不断地从历史中挖掘有望在未来重复的规律并且加以利用。\n- 二是依靠一组股票取胜，而不是一个或几个股票取胜。\n\
    \n## 1.3 量化投资的应用\n\n量化投资主要应用于以下几个方面。\n\n## 1. 量化择时\n\n股市的可预测性问题与有效市场假说密切相关。如果有效市场理论或有效市场假说成立，股票价格充分反映了所有相关的信息，价格变化服从随机游走，股票价格的预测就会毫无意义。\n\
    \n众多的研究发现，股市的指数收益中存在经典线性相关之外的非线性相关，貌似随机、杂乱，但在其复杂表面的背后却隐藏着确定性的机制，因此存在可预测成分。\n\n\
    ## 2. 股指期货\n\n股指期货套利是指利用股指期货市场存在的不合理价格，同时参与股指期货与股票现货市场交易，或者同时进行不同期限、不同（但相近）类别股票指数合约交易，以赚取差价的行为。股指期货套利主要分为期现套利和跨期套利两种。股指期货套利的研究主要包括现货构建、套利定价、保证金管理、冲击成本、成分股调整等内容。\n\
    \n## 3. 商品期货\n\n商品期货套利盈利的逻辑原理基于以下几个方面：\n\n- 相关商品在不同地点、不同时间，对应都有一个合理的价格差价。\n- 由于价格的波动性，价格差价经常出现不合理。\n\
    - 不合理必然要回到合理。\n- 不合理回到合理的这部分价格区间就是盈利区间。\n\n## 4. 统计套利\n\n有别于无风险套利，统计套利是利用证券价格的历史统计规律进行套利，是一种风险套利，其风险在于这种历史统计规律在未来一段时间内是否继续存在。\n\
    \n统计套利在方法上可以分为两类：\n\n- 一类是利用股票的收益率序列建模，目标是在组合的 Beta 值等于零的前提下实现 Alpha 收益，我们称之为\
    \ Beta 中性策略。\n- 另一类是利用股票价格序列的协整关系建模，我们称之为协整策略。\n\n## 5. 期权套利\n\n期权套利交易是指同时买进卖出同一相关期货但有不同的敲定价格，或不同到期月份的看涨或看跌期权合约，希望在日后对冲交易部位或履约时获利的交易。期权套利的交易策略和方式多种多样，是多种相关期权交易的组合，具体包括水平套利、垂直套利、转换套利、反向转换套利、跨式套利、蝶式套利、飞鹰式套利等。\n\
    \n## 6. 算法交易\n\n算法交易又被称为自动交易、黑盒交易或者机器交易，它指的是通过计算机程序来发出交易指令。在交易中，程序可以决定的范围包括交易时间的选择、交易的价格，甚至可以包括最后需要成交的证券数量。根据各个算法交易中算法的主动程度不同，可以把不同算法交易分为被动型算法交易、主动型算法交易、综合型算法交易三大类。\n\
    \n## 7. 资产配置\n\n资产配置是指资产类别选择，投资组合中各类资产的适当配置以及对这些混合资产进行实时管理。量化投资管理将传统投资组合理论与量化分析技术结合，极大地丰富了资产配置的内涵，形成了现代资产配置理论的基本框架。\n\
    \n它突破了传统积极型投资和指数型投资的局限，将投资方法建立在对各种资产类股票公开数据的统计分析上，通过比较不同资产类的统计特征建立数学模型，进而确定组合资产的配置目标和分配比例。\n\
    \n## 1.4 量化投资在我国股市的发展前景\n\n首先，相较于海外成熟市场，我国股票市场的发展历史较短，投资者队伍参差不齐，投资理念还不够成熟，留给主动投资发掘市场非有效性，产生阿尔法的潜力和空间也更大。\n\
    \n总体来说，国内的量化投资整体还处于起步阶段，不像国外那样成熟。但好在国内的资本市场没有完全放开，而且期指、期权等对冲手段也不够成熟，很多品种还是 T+1\
    \ 交易，即使国外对冲基金进来也需要修改策略来适应国内的资本市场，所以国内的量化投资者们还是有很多投资机会的，还有一定的时间可以充分吸收国外已有的知识和模型，从而做出更好的量化投资模型。\n\
    \n## 1.5 小结\n\n本章讲述了量化投资的诞生背景、特点、应用范围，并简单介绍了量化投资在我国股市的发展前景。读者掌握这些内容能对量化投资的概念和方法有个基本的印象。\n\
    \n## 第 2 章\n\n## ▶ Python的安装与使用 ◀\n\n“人生苦短，我用 Python”。\n\n这是 Python 在自身宣传和推广中使用的口号，做投资也是这样的，简单朴素的投资策略和思想永远是最好的。\n\
    \n对于相关研究人员，最直接、最简洁的需求就是将自己的想法从纸面进化到可以运行的计算机代码，在这个过程中，所需花费的精力越少越好。\n\nPython 完全可以满足这个需求，在计算机代码的编写和实现过程中，Python\
    \ 简洁的语言设计本身可以帮助用户避开没必要的陷阱，减少变量声明，随用随写，无须对内存进行释放，这些都可以极大地帮助用户使用 Python 编写出需要的程序。\n\
    \n其次，Python 的社区开发成熟，有非常多的第三方类库可以使用。在本章中还会介绍 NumPy、PIL 以及 threading 三个主要的类库，这些开源的算法类库在后面的程序编写过程中会起到极大的作用。\n\
    \n最后，相对于其他语言，Python 有较高的运行效率，而且得益于 Python 开发人员的不懈努力，Python 友好的接口库甚至可以加速程序的运行效率，而无须去了解底层的运行机制。\n\
    \n“人生苦短，何不用 Python”。Python 让其使用者专注于逻辑和算法本身而无须纠结一些技术细节。Python 作为深度学习以及 TensorFlow\
    \ 框架主要的编程语言，更需要读者去掌握与学习。\n\n## 2.1 Python 的基本安装和用法\n\nPython 是深度学习的首选开发语言，但是对于安装来说，很多第三方提供了集成大量科学计算类库的\
