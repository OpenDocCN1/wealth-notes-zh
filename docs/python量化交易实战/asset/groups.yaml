    \n## 3.4.3 数据的标准化\n\n继续对数据进行分析，相信读者在进行数据选择的时候，可能会遇到某一列的数值过大或者过小的问题，即数据的显示超出其他数据部分较大时，就会产生数据图形失真的问题，如图\
    \ 3-12 所示。\n\n![](img/66b32d04cb77b904cead314891984c93_48_0.png)\n\n图 3-12 数据超预期的四分位图\n\
    \n因此，需要一个能够对数据进行处理，使其具有共同计算均值的方法，这样的方法称为数据的标准化处理。\n\n顾名思义，数据的标准化是将数据根据自身一定比例进行处理，使之落入一个小的特定区间，一般为(-1,1)之间。这样做的目的是去除数据的单位限制，将其转化为无量纲的纯数值，使得不同单位或量级的指标能够进行比较和加权，其中最常用的就是\
    \ 0-1 标准化（0-1 normalization）和 Z-score 标准化（zero-mean normalization）。\n\n### 1.\
    \ 0-1 标准化\n\n0-1 标准化也叫离差标准化，是对原始数据的线性变换，使结果落到[0,1]区间，转换函数如下：\n\n```\nX = (x -\
    \ min) / (max - min)\n```\n\n其中，max 为样本数据的最大值，min 为样本数据的最小值。这种方法有一个缺陷，就是当有新数据加入时，可能导致\
    \ max 和 min 的变化，需要重新定义。\n\n### 2. Z-score 标准化\n\nZ-score 标准化也叫标准差标准化，经过处理的数据符合标准正态分布，即均值为\
    \ 0，标准差为 1，其转化函数为：\n\n```\nX = (x - μ) / σ\n```\n\n其中，μ 为所有样本数据的均值，σ 为所有样本数据的标准差。\n\
    \n一般情况下，通过数据的标准化处理后，数据最终落在(-1,1)之间的概率为 99.7%，而在(-1,1)之外的数据被设置成-1 和 1，以便处理。\n\n\
    ## 【程序 3-10】\n\n```\nfrom pylab import *\nimport pandas as pd\nimport matplotlib.pyplot\
    \ as plot\nfilePath = (\"c://dataTest.csv\")\ndataFile = pd.read_csv(filePath,header=None,\
    \ prefix=\"V\")\n\nsummary = dataFile.describe()\ndataFileNormalized = dataFile.iloc[:,1:6]\n\
    for i in range(5):\n    mean = summary.iloc[1, i]\n    sd = summary.iloc[2, i]\n\
    \ndataFileNormalized.iloc[:,i:(i + 1)] = (dataFileNormalized.iloc[:,i:(i + 1)]\
    \ - mean) / sd\narray = dataFileNormalized.values\nboxplot(array)\nplot.xlabel(\"\
    Attribute\")\nplot.ylabel((\"Score\"))\nshow()\n```\n\n从代码中可以看到，数据被处理为标准差标准化的方法，dataFileNormalized\
    \ 被重新计算并定义，大数值被人为限定在(-1,1)之间，请读者自行运行验证。\n\n> 提示\n【程序 3-10】中所使用的数据被人为修改，请读者自行修改验证，这里不再进行演示。此外，读者可以对数据进行处理，验证更多的标准化方法。\n\
    \n## 3.4.4 数据的平行化处理\n\n从 3.4.2 小节可以看到，对于每种单独的数据属性来说，可以通过数据的四分位法进行处理、查找和寻找离群值，从而对其进行分析处理。\n\
    \n但是对于属性之间的横向比较，每个目标行属性之间的比较，使用四分位法则较难判断，因此为了描述和表现每一个不同目标行之间数据的差异和不同，需要另一种处理和展示方法。\n\
    \n平行坐标（Parallel Coordinates）是一种常用的可视化方法，用于对高维几何和多元数据进行可视化。\n\n平行坐标为了表示在高维空间的一个点集，在\
    \ N 条平行的线的背景下（一般这 N 条线都竖直且等距），一个在高维空间的点被表示为一条拐点在 N 条平行坐标轴的折线，在第 K 个坐标轴上的位置就表示这个点在第\
    \ K 维的值。\n\n平行坐标是信息可视化的一种重要技术。为了克服传统的笛卡尔直角坐标系容易耗尽空间、难以表达三维以上数据的问题，平行坐标将高维数据的各个变量用一系列相互平行的坐标轴表示，变量值对应轴上的位置。为了反映变化趋势和各个变量间的相互关系，往往将描述不同变量的各个点连接成折线。所以平行坐标图的实质是将欧式空间的一个点\
    \ X_i(X_i1,X_i2,...,X_im) 映射到二维平面上的一条曲线。\n\n平行坐标图可以表示超高维数据。平行坐标的一个显著优点是具有良好的数学基础，其射影几何解释和对偶特性使它很适合用于可视化数据分析。\n\
