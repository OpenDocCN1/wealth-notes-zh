    \n### 第一步：导入所使用的库包，创建回归分析代码\n\n这里所使用的库包较多，因此第一步需要分析不同的股票标的之间的相关系数。而量化掘金网站上提供了相关行业的分类代码，如图\
    \ 11-5 所示。\n\n![](img/66b32d04cb77b904cead314891984c93_264_0.png)\n\n从获取的二级行业代码可以获取全部证券编号。而根据获取的代码可以获取相关的行业股票代码，完整代码如下：\n\
    \n### 【程序 11-9】\n\n```\nimport numpy as np\nfrom gm.api import *\nimport pandas\
