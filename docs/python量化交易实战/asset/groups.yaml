    配对交易实际上就是一种基于统计学的统计建模过程。


    进行配对策略最常用的是统计学方面的知识，这里涉及相关系数、均值方差等方面的内容，相信读者应该不陌生。但是除此之外，还有一个新的概念——“协整”。这是为配对交易引入的在计量经济学中特定出现的一个新的名称。本节将对可能涉及的概念进行统一介绍。'
  - "[PAGE 254]\n\n# 11.1.1 相关性分析\n\n相关性的统计与分析是经济学中常用的一种方法。相关性是指当两个因素之间存在联系时，一个典型的表现是：一个变量会随着另一个变量变化。相关又分成正相关和负相关两种情况。\n\
    \n本节我们不讨论正负的相关性，而是要看不同的数据集和中相关性的绝对量。相关性的绝对值越大，可以认为相关性越高。一般来说，取绝对值后，0~0.09 为没有相关性，0.1~0.3\
    \ 为弱相关，0.3~0.5 为中等相关，0.5~1.0 为强相关。\n\n这里不介绍具体的相关性公式，只介绍使用的方法和代码设计。\n\n# 第一步：创建数据集\n\
    \n为了简便起见，这里首先使用恒定的线性方程表示两组数据集：\n\n```\narr_a = np.arange(0,100,1)\narr_b = 3 *\
    \ arr_a + 1\n```\n\n这里使用了 NumPy 作为数据的创建库，之后从 0~100 中取出 100 个数据组成一个数组：\n\n```\n\
    [0,1,2,3...]\n```\n\n而 arr_b 是通过 arr_a 计算出的数据集，这里采用一个线性方程对数据进行计算，并存储数据计算结果。\n\n\
    # 第二步：计算相关系数\n\n对于相关系数的计算，NumPy 中提供了专门的函数 corrcoef，用于对其内容的相关性进行计算，其结果打印如下：\n\n\
    ```\n[[ 1.  1.]\n [ 1.  1.]]\n```\n\n除了常用的 NumPy 之外，Python 还提供了其他方法计算数据的相关系数。pandas\
    \ 是另一种常用的计算库文件，同样，也提供了对不同数据集之间的相关度的计算方法。\n\n```\nimport pandas as pd\narr_a =\
    \ pd.DataFrame({\"arr_a\":arr_a})\narr_b = pd.DataFrame({\"arr_b\":arr_b})\n```\n\
