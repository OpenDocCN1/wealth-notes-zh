    # 6.3 实战：基于成长因子的模型测试


    成长模型是一种以公司未来成长为基础的选股模型。


    成长投资理论由现代投资理论的开路先锋之一，Philip A.Fisher（费雪）最早提出，他在1959 年的名著《怎样选择成长股》中对该投资理念进行了详细阐述，解释了成长股的标准、如何寻找成长股、怎样把握时机获利等一系列重要的问题，为广大投资者称道。


    在实际操作中，成长型投资通常是在对经济周期和行业景气分析的基础上，结合股票基本面情况，包括收益率和增长率等属性的分析，来评估和选择成长型股票。


    在量化形式上，成长型投资主要是通过 ROE、ROA、ROIC、营业收入增长率、主营业务利润率等参数来挖掘成长性相对更高的股票。


