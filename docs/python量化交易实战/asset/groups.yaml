    \n## 简单的技术性因子——波动率因子\n\n读者看完了 7.2 节中部分因子的计算与写法，可能对相关内容比较难以理解，其实大多数的内容也是仅仅涉及了回归分析，这应该是大学本科一二年级的课程。\n\
    \n本节将继续介绍一个最常用的技术性因子——波动率因子，难度会有所降低，但是会更加具有普遍性和适用性。\n\n### 7.3.1 波动率因子介绍\n\n“低波动率影响现象”，从字面上解释为低风险和低波动率的股票有更高的风险调整后的回报率。\n\
    \n然而这一理论与传统金融学的思想相悖。传统金融学认为，风险和收益之间存在权衡，高风险往往带来高收益，低风险则对应低收益，因此在传统金融学背景下，低风险低波动率的股票也能带来更高的回报率这一说法似乎难以成立。\n\
    \n在论文《The Volatility Effect: Lower Risk without Lower Return》中，作者给出了对于这一现象的几种解释：\n\
    \n- 低波动的资产投资组合需要杠杆来匹配市场风险，进而充分利用低风险股票所特有的绝对回报，但是现在对于杠杆存在制度限制。\n- 低效投资过程。管理者通常对高波动的股票支付过高，以期待在牛市中得到更高回报。\n\
    - 私人投资者的行为偏差。\n\n而在实际中，波动率因子又根据波动的相对条件分为“自波动”与“相对波动（Beta）”值，这是波动率计算的两个最基础的方面。其主要区别是，“自波动”主要计算标的自身的时间序列的波动性，而“相对波动”主要是计算标的时间序列与相对的时间序列之间的波动性。\n\
    \n其代码实现如下：\n\n#### 1. 对数收益率自波动的计算方法\n\n自波动的计算方法是根据每个时间段的收益率的标准差进行计算，代码如下：\n\n\
