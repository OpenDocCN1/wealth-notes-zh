    \n## 3.3 常用的统计分析方法——相似度计算\n\n我们从 3.2 节的内容中可以看到，由于不同目标行之间的属性不同，画出的散点图也是千差万别的，而不同的属性对于数据处理来说，需要一个统一的度量进行计算，即需要对其相似度进行计算。\n\
    \n相似度的计算方法很多，这里选用最常用的两种，即欧几里得相似度计算和余弦相似度计算。如果读者对此不感兴趣，可以跳过本节内容继续学习。\n\n## 3.3.1\
    \ 基于欧几里得距离的相似度计算\n\n欧几里得距离（Euclidean Distance）是最常用的计算距离的公式，它用来表示三维空间中两个点的真实距离。\n\
    \n欧几里得相似度计算是一种基于用户之间直线距离的计算方式。在相似度计算中，不同的物品或者用户可以将其定义为不同的坐标点，而将特定目标定位为坐标原点。使用欧几里得距离计算两个点之间的绝对距离。欧几里得相似度的计算如【公式\
    \ 3-1】所示。\n\n【公式 3-1】\n$d = \\sqrt{(x_1 - x_2)^2 + (y_1 - y_2)^2}$\n\n从【公式 3-1】可以看到，作为计算结果的欧式值显示的是两点之间的直线距离，该值的大小表示两个物品或者用户差异性的大小，即用户的相似性。两个物品或者用户距离越大，可以看到其相似度越小；距离越小则相似度越大。\n\
    \n> 提示 简而言之，欧几里得的计算数值与最终的相似度计算成反比，欧氏距离越小，两组数据相似度就越大，欧氏距离越大，两组数据相似度就越小。因此，在实际中往往使用欧几里得距离的倒数作为相似度计算的近似值，即使用\
    \ 1/(d+1)作为近似值。\n\n下面来看一个常用的用户-物品推荐评分表的例子，如表 3-3 所示。\n\n## 表 3-3 用户与物品评分对应表\n\n\
    |  | 物品 1 | 物品 2 | 物品 3 | 物品 4 |\n|---|---|---|---|---|\n| 用户 1 | 1 | 1 | 3 |\
    \ 1 |\n| 用户 2 | 1 | 2 | 3 | 2 |\n| 用户 3 | 2 | 2 | 1 | 1 |\n\n表 3-3 是 3 个用户对物品的打分表，如果需要计算用户\
    \ 1 和其他用户之间的相似度，通过欧几里得距离公式可以得出：\n\n$d_{12} = \\sqrt{(1-1)^2 + (1-2)^2 + (3-3)^2\
    \ + (1-2)^2} \\approx 1.414$\n\n可以看到，用户 1 和用户 2 的相似度为 1.414，而用户 1 和用户 3 的相似度是：\n\
    \n$d_{13} = \\sqrt{(1-2)^2 + (1-2)^2 + (3-1)^2 + (1-1)^2} \\approx 2.449$\n\n\
    从得到的计算值可以看出，d₁₂的分值小于 d₁₃的分值，根据欧氏距离与相似度成反比的法则，可以认为用户 2 相对于用户 3 更加近似于用户 1。\n\n##\
    \ 3.3.2 基于余弦角度的相似度计算\n\n与欧几里得距离相类似，余弦相似度也将特定目标（物品或者用户）作为坐标上的点，但不是坐标原点，与特定的计算目标进行夹角计算，具体如图\
    \ 3-7 所示。\n\n![](img/66b32d04cb77b904cead314891984c93_41_0.png)\n\n从图 3-7 可以很明显地看出，两条直线分别从坐标原点鸽发，引出一定的角度。如果两个目标较为相似，那么其线段形成的夹角较小。如果两个用户不相近，那么两条射线形成的夹角较大。因此，在使用余弦度量的相似度计算中，可以用夹角的大小来反映目标之间的相似性。余弦相似度的计算如【公式\
    \ 3-2】所示。\n\n## 【公式 3-2】\n\n$\\cos@ = \\frac{\\sum (x_i \\times y_i)}{\\sqrt{\\\
    sum x_i^2} \\times \\sqrt{\\sum y_i^2}}$\n\n从【公式 3-2】可以看到，余弦值一般在[-1,1]之间，而这个值的大小同时与余弦夹角的大小成正比。如果用余弦相似度计算表\
    \ 3-3 中用户 1 和用户 2 之间的相似性，结果如下：\n\n```\nd₁₂ = (1×1 + 1×2 + 3×3 + 1×2) / (√(1²+1²+3²+1²)\
    \ × √(1²+2²+3²+2²)) = 14 / (√12 × √18) ≈ 0.95\n```\n\n而用户 1 和用户 3 的相似性如下：\n\n\
    ```\nd₁₃ = (1×2 + 1×2 + 3×1 + 1×1) / (√(1²+1²+3²+1²) × √(2²+2²+1²+1²)) = 8 / (√12\
    \ × √10) ≈ 0.73\n```\n\n从计算结果可得，用户 2 相对于用户 3，与用户 1 更为相似。\n\n## 3.3.3 欧几里得相似度与余弦相似度的比较\n\
    \n欧几里得相似度以目标绝对距离作为衡量的标准，而余弦相似度以目标差异的大小作为衡量标准，其表述如图 3-8 所示。\n\n![](img/66b32d04cb77b904cead314891984c93_42_0.png)\n\
    \n可以看到，欧几里得相似度注重目标之间的差异，与目标在空间中的位置直接相关。而余弦相似度是不同目标在空间中的夹角，更加表现在前进趋势上的差异。\n\n欧几里得相似度和余弦相似度具有不同的计算方法和描述特征。一般来说，欧几里得相似度用以表现不同目标的绝对差异性，从而分析目标之间的相似度与差异情况。而余弦相似度更多的是对目标从方向趋势上区分，对特定坐标数字不敏感。\n\
    \n示 举例来说，两个目标在不同的两个用户之间的评分分别是 (1,1) 和 (5,5)，这两个评分在表述上是一样的。但是在分析用户相似度时，更多的是使用欧几里得相似度而不是余弦相似度对其进行计算。余弦相似度更好地区分了用户的分离状态。\n\
    \n## 3.4 数据的统计学可视化展示\n\n在 3.3 节中，读者对数据，特别是大数据的处理有了基本的认识，通过数据的可视化处理，对数据的基本属性和分布都有了较为直观的理解。本节将对数据进行更多的分析处理，需要用到更为精准和科学的统计学分析方面的知识。\n\
    \n## 3.4.1 数据的四分位\n\n四分位数（Quartile）是统计学中分位数的一种，即把所有数据由小到大排列并分成四等份，处于三个分割点位置的数据就是四分位数。\n\
    \n- 第一四分位数（Q1）又称“下四分位数”，等于该样本中所有数据由小到大排列后第 25%的数据。\n- 第二四分位数（Q2）又称“中位数”，等于该样本中所有数据由小到大排列后第\
    \ 50%数据。\n- 第三四分位数（Q3）又称“上四分位数”，等于该样本中所有数据由小到大排列后第 75%的数据。\n- 第三四分位数与第一四分位数的差距又称四分位距（Inter\
    \ Quartile Range，IQR）。\n\n首先确定四分位数的位置，n 表示项数的话，四分位数的位置分别为：\n\n- Q1 的位置 = (n+1)\
    \ × 0.25\n- Q2 的位置 = (n+1) × 0.5\n- Q3 的位置 = (n+1) × 0.75\n\n通过图形表示如图 3-9 所示。\n\
    \n![](img/66b32d04cb77b904cead314891984c93_43_0.png)\n\n图 3-9 四分位的计算\n\n从图 3-9\
    \ 可以看到，四分位在图形中根据 Q1 和 Q3 的位置绘制了一个箱体结构，即根据\n\n一组数据的 5 个特征绘制的一个箱子和两条线段的图形。这种直观的箱线图反映出一组数据的特征分布，还显示了数据的最小值、中位数和最大值。\n\
    \n## 3.4.2 数据的四分位示例\n\n首先介绍本例中的数据集。本数据集来源于真实世界中某借贷机构对申请贷款人的背景调查，目的是根据不同借款人的条件分析判断借款人能否按时归还贷款。一般来说，借款人能否按时归还贷款是所有借贷最为头疼的问题，其中的影响因素很多，判别相对麻烦，判断错误后果也较为严重。而通过数据处理可以较为轻松地将其转化成一个回归分类问题进行解决。\n\
    \n数据集中数据如图 3-10 所示。\n\n![](img/66b32d04cb77b904cead314891984c93_44_0.png)\n\n\
    图 3-10 小贷数据集\n\n这个数据集的形式是每一行为一个单独的目标行，使用逗号分割不同的属性；每一列是不同的属性特征，不同列的含义在现实中至关重要，这里不做解释。具体代码如【程序\
    \ 3-9】所示。\n\n## 【程序 3-9】\n\n```\nfrom pylab import *\nimport pandas as pd\nimport\
    \ matplotlib.pyplot as plot\nfilePath = (\"c://dataTest.csv\")\ndataFile = pd.read_csv(filePath,header=None,\
    \ prefix=\"V\")\n\nprint(dataFile.head())\n```\n\n```\nprint((dataFile.tail())\n\
    \nsummary = dataFile.describe()\nprint(summary)\n\narray = dataFile.iloc[:,10:16].values\n\
    boxplot(array)\nplot.xlabel(\"Attribute\")\nplot.ylabel((\"Score\"))\nshow()\n\
