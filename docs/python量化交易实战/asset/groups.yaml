    \ θ - α(f(θ) - y_i) x_i\n\n公式中，α 是下降系数，用较为通俗的话表示就是用以计算每次下降的幅度大小。系数越大，每次计算中的差值越大，而系数越小，差值越小，但是计算时间也相对延长。\n\
    \n随机梯度下降算法模型如图 9-7 所示。\n\n![](img/66b32d04cb77b904cead314891984c93_195_0.png)\n\
