    # 霍华。罗斯曼的投资模型


    华尔街永远不缺传奇与经典，对于纵横华尔街的一些传奇投资人，自有其生存与发展之道。霍华·罗斯曼就是其中之一。下面使用掘金 API 重现其投资模型和方法。


    # 6.4.1 霍华。罗斯曼简介


    霍华·罗斯曼（Howard Rothman）是华尔街著名的投资分析公司——远见投资顾问公司（Vision Investment Advisor, VIA）的首席投资分析师和总裁（1997~2002年），也曾为美国折扣券商协会（the
    National Introducing Brokers Association）的主席及创始会员。


    他于1990年一月被折扣券商会员（Introducing Broker Membership）推荐进入国家期货协会董事会（the National Futures
    Association Board of Directors）担任董事，并连任达3届。目前为期货产业协会的纪律委员会（the Law and Compliance
    Division of the Futures Industry Association）会员。


    霍华·罗斯曼的投资方式强调“在正确的时机买入并紧握持股”与“选择优质股票并长期持有”（“buy right and hold tight” and “buy
    strong and hold long”）。


    他认为只要在适当的价格买入稳定且持续成长获利的股票，不需要经常更换持股，投资報酬率必然指日可期。由此可见，霍华·罗斯曼的投资哲学虽然简单，却充分显现了首席投资分析师的谨慎风范。


