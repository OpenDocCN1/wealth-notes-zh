    \n## 第 8 章\n\n## 人人都是基金经理——中证红利指数增强策略\n\n人人都是基金经理。\n\n对于基金经理这个词读者可能非常熟悉，那些掌管几十亿甚至于上百亿资金，在证券市场运筹帷幄、指点江山、挥斥方遒、好不潇洒的股市健儿就是人们印象中的基金经理。\n\
    \n作为一个基金经理，一般要求具有金融相关专业硕士以上教育背景，具备良好的数学基础和扎实的经济学理论功底，如有海外留学经历或获得 CFA 证书，则将更具竞争力。基金经理的工作是负责决定该基金的组合和投资策略，投资组合是按照基金说明书的投资目标去选择，投资策略由该基金经理决定。\n\
    \n做基金经理难吗？\n\n是的，做一个基金经理很难。\n\n人人都可以成为基金经理吗？\n\n是的，人人都可以成为基金经理。\n\n通过学习相关的内容与投资组合策略，任何人都可以成为一名合格的基金经理。本章将以中证红利为基础介绍通过构建指数增强基金，在这个过程中将全面复习以前学到的内容，综合运用基本面因子和多种技术因子，并且通过最终的回测验证基金组合的收益和成果。\n\
    \n注意 本章只是 Clinic 有一个索引增强组合的例子，如果读者将其用于真实的股票组合和操作，还需要进一步细致和专业地对其进行分析和处理。\n\n##\
    \ 8.1 中证红利指数基金介绍\n\n本节从理论开始介绍，如果读者已经有金融相关从业经验，那么可以忽略本节。\n\n### 8.1.1 红利指数基金的由来\n\
    \n红利策略最初叫作“狗股策略”（Dogs of the Dow Theory），是由美国基金经理迈克尔·奥希金斯在 1991 年提出的。该策略的具体做法是每年年底在道琼斯工业平均指数成分股中找出\
    \ 10 只股息率最高的股票，新年买入，一年后按股息率高低更新股票池，如此循环往复。\n\n如果将股息率最高的股票按一定方法编制成指数，该指数就叫作“红利指数”，围绕红利指数进行的一系列投资方式，例如指数定投、指数长持等，都属于“红利策略”的范畴。\n\
    \n据投资百科（Investopedia）统计，狗股策略在 1957 年~2003 年期间的年均回报率为 14.3%，高于道指 11%的年均回报率。而在 1973\
    \ 年~1996 年，狗股策略年均回报率达 20.3%，高于道指同期 15.8%的平均回报率。数据证明，狗股/红利策略长期来看是能够战胜市场平均的。\n\n\
    ### 8.1.2 中证红利简介\n\n中证指数有限公司 2005 年 5 月 12 日宣布，为反映沪深证券市场高股息股票的整体走势，为投资者提供新的业绩基准和投资标的，将于\
    \ 5 月 26 日正式发布中证红利指数。\n\n中证红利指数挑选了上海、深圳交易所中现金股息率高、分红比较稳定、具有一定规模及流动性的 100 只股票作为样本，以反映\
    \ A 股市场高红利股票的整体状况和走势。基日为 2004 年 12 月 31 日，基点为 1000 点。中证红利指数简称“中证红利”，指数代码为 000922（上海）/399922（深圳）。\n\
    \n目前来说，中证红利指数的主要权重行业集中在钢铁、电力、石化、汽车、航运、煤炭、有色等。此外，对于 A 股市场而言，有持续分红能力的公司是稀缺资源，只占整个市场的三成左右。分给投资人的真金白银显示了这类公司良好的财务状况与内在价值。\n\
    \n从近 5 年的走势来看（见图 8-1），自 2015 年 6 月 A 股自高点回落进入震荡市以来，中证红利指数长期跑赢大盘。值得一提的是，随着价值的回归，在大盘蓝筹和行业龙头备受市场关注的同时，红利投资策略的优势更为明显。\n\
