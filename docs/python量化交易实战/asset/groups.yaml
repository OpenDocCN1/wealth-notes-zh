    \ value 对数据排序，之后将排序后的值返回到数据字典中。具体结果请读者自行打印查看。\n\n# 6.1.3 单因子选股轮动测试\n\n下面使用选定的因子进行选股轮动。在使用某个策略的时候，最重要的是确定策略所使用的方案，本节中所使用的方案如下：\n\
