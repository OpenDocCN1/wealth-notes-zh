    \n图 9-13 买还是卖\n\n对于大多数投资者来说，买或者不买实际上是一种经验的总结，其更多的是通过历史数据的分析做出判断。那么能否提供一种方法，通过模拟历史数据来对未来做出判断，这就是逻辑回归。\n\
    \n### 9.4.1 逻辑回归是一种分类算法\n\n前面对逻辑回归已经有了一个大致的介绍，如果有读者跳过了其中的数学部分也没关系，你需要记住的就是逻辑回归并不是数值回归，逻辑回归是一种分类算法。\n\
    \n逻辑回归是一种广义的线性回归分析模型，常用于数据挖掘、疾病自动诊断、经济预测等领域。例如，探讨引发疾病的危险因素，并根据危险因素预测疾病发生的概率等。\n\
    \n以胃癌病情分析为例，选择两组人群，一组是胃癌组，另一组是非胃癌组，两组人群必定具有不同的体征与生活方式等。因此，因变量就为是否是胃癌，值为“是”或“否”，自变量就包括很多了，如年龄、性别、饮食习惯、幽门螺杆菌感染等。\n\
    \n自变量既可以是连续的，也可以是分类的。然后通过 logistic 回归分析可以得到自变量的权重，从而可以大致了解到底哪些因素是导致胃癌的危险因素。同时，利用该权值可以根据危险因素预测一个人患癌症的可能性。\n\
    \n逻辑回归的主要用途如下。\n\n- o 寻找危险因素：寻找某一疾病的危险因素；\n- o 预测：如果已经拟合出回归模型，那么可以根据模型预测在不同自变量的情况下发生某病或某种情况的概率有多大。\n\
    - o 判别：根据逻辑回归模型判断某人属于某病或属于某种情况的概率有多大。\n\n这是逻辑回归最常用的三个用途，实际上逻辑回归的用途是极为广泛的，逻辑回归几乎已经成了流行病学和医学中最常用的分析方法，因为它与多重线性回归相比有很多的优势，后面会对该方法进行详细的阐述。实际上还有很多分类方法，只不过逻辑回归是最成功也是应用最广的方法。\n\
