    名称：Kicking - bull/bear determined by the longer marubozu（由较长缺影线决定的反冲形态）

    简介：二日 K 线模式，与反冲形态类似，较长缺影线决定价格的涨跌。

    函数：def CDLKICKINGBYLENGTH(open, high, low, close)


    ### 37. 函数名：CDLSTALLED PATTERN

