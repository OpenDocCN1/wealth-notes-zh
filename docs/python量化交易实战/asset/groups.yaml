    \n本节将简略介绍支持向量机的用法。\n\n支持向量机是机器学习的一种，相对于线性回归和逻辑回归来说，支持向量机实际上是一种有监督的机器学习算法。将机器学习算法应用于股市分类中，与上一节的逻辑回归类似，实际上也是通过训练模型学习不同因子对未来的走势的影响去做出判断。\n\
    \n### 9.5.1 支持向量机的基本概念\n\n支持向量机解决的是有监督的二元分类问题（supervised binary classification）。\n\
    \n例如，对于股票市场来说，对于某只股，希望根据它的属性以及一系列已经分类好的历史样本，将这个新样本分到两个不同的目标类中的某一类。\n\n股市的涨跌识别就是一个例子：一只股票在股市中每日的行情要么涨要么跌。因此，对于股票的走势判定，我们希望机器学习算法能够自动对它分类。为此，我们首先通过人工对大量的历史数据进行标识，然后用这些标识后的历史数据对机器学习算法进行训练。\n\
    \n在处理这类分类问题时，SVM 的作用对象是样本的特征空间（feature space），它是一个有限维度的向量空间，每个维度对应着样本的一个特征，而这些特征组合起来可以很好地描述被分类的样本。\n\
    \n为了对新的样本分类，SVM 算法会根据历史数据在特征空间内构建一个超平面（hyperplane），它将特征空间线性分割为两部分，对应着分类问题的两类，分别位于超平面的两侧。构建超平面的过程就是模型训练过程。对于一个给定的新样本，根据它的特征值，它会被放在超平面两侧中的某一侧，这便完成了分类。不难看出，SVM\
    \ 是一个非概率的线性分类器。这是因为 SVM 模型回答的是非此即彼的问题，新样本会被确定地分到两类中的某一类。\n\n在数学表达上，每一只股票的历史样本点由一个（X,\
    \ y）元组表示，其中粗体的 X 是特征向量，即 X=（x₁, …, xₚ），而其中每一个 xⱼ 代表股票的某一个特征，而 y 代表该样本的已知分类（通常用+1\
    \ 和 0 表示涨和跌）。SVM 会根据这些给定的历史数据来训练算法的参数，找到最优的线性超平面。\n\n理想情况下，这个超平面可以将两类涨跌完美的分开（即没有错分的情况）。对于给定的训练数据，可以将它们完美分开的超平面很可能不是唯一的，比如一个超平面稍微旋转一个角度，便得到一个仍然能够完美分割的超平面。在众多能够实现分类的超平面中，只有\n\
    \n个是最优的。\n\n在实际应用中，很多数据并非是线性可分的。SVM 的强大之处在于，它不仅仅局限于是一个高维空间的线性分类器。它通过非线性的核函数（kernel\
    \ functions）把原始的特征空间映射到更高维的特征空间（可以是无限维的），在高维空间中再将这些样本点线性分割。高维空间的线性分割对应着原始特征空间的非线性分割，因此在原始特征空间中生成了非线性的决策边界。此外，这么做并不以增加计算机的计算负担为代价。因此，SVM\
    \ 相当高效。\n\n### 9.5.2 使用支持向量机进行回测\n\n对于这部分内容，由于难度关系，只给出回测代码，有兴趣的读者可以自行研究完成。策略的判定：\n\
