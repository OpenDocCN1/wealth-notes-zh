    \n### 7.1 技术面多因子介绍\n\n相对于基本面因子，技术面因子的设计和组合是多种多样的，甚至可以说是天马行空、无奇不有的。因为基本面因子本质来源于公司的财务、供销、利润以及产出等，而技术面因子的组合计算更多涉及数学、统计等。本节主要介绍一些常用的数学技术性指标。\n\
    \n### 7.1.1 101 个技术因子\n\n2015 年 12 月，WorldQuant LLC 公布了 101 个阿尔法表达式（见图 7-2），并声称其中\
    \ 80% 的因子仍然在实盘中使用。国内众多量化爱好者如获至宝，蜂拥实现并验证其因子的有效性。\n\n虽然从检验结果来看，公布的大部分因子在中国股市的效果平平或已失效，但是其因子\n\
    \n的构造形式却值得深入研究。论文中说到，目前量化交易中使用的因子数量早已成百上千，甚至达到了数百万的数量级。这已远远不是通过人工搜索并试验有效因子所能企及的。\n\
