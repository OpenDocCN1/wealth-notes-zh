    \ MACD 函数。可以看到，在函数说明中，MACD 函数的默认值分别为 12、26、9。这里分别是快速（一般选 12 日）移动平均值与慢速（一般选 26\
    \ 日）移动平均值。\n\n以这两个数值作为测量两者（快速与慢速线）间的“差离值”的依据。所谓“差离值”（DIF），即 12 日 EMA 数值减去 26 日\
    \ EMA 数值。因此，在持续的涨势中，12 日 EMA 在 26 日 EMA 之上。其间的正差离值（+DIF）会愈来愈大。反之在跌势中，差离值可能变负（-DIF），也愈来愈大。至于行情开始回转，正或负差离值要缩小到一定的程度，才真正是行情反转的信号。MACD\
    \ 的反转信号界定为“差离值”的 9 日移动平均值（9 日 EMA）。\n\nMACD 的使用代码如下：\n\n```\nmacd, signal, hist\
