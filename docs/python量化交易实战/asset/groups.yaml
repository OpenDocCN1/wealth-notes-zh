    # 9.1.4 回归法的解法——最小二乘法详解


    最小二乘法（LS 算法）是一种数学优化技术，也是一种回归分析的常用解法。它通过最小化误差的平方和寻找数据的最佳函数匹配。利用最小二乘法可以简便地求得未知的数据，并使得这些求得的数据与实际数据之间误差的平方和最小。最小二乘法还可用于曲线拟合，其他一些优化问题也可通过最小化能量或最大化熵用最小二乘法来表达。


    下面通过一个图示向读者演示最小二乘法的原理，如图 9-4 所示。


    ![](img/66b32d04cb77b904cead314891984c93_190_0.png)


    图 9-4 最小二乘法的原理


    从图 9-4 可以看到，若干个点依次分布在向量空间中，如果希望找出一條直线和这些点达到最佳匹配，最简单的方法就是希望这些点到直线的应用于下面的最小二乘法实现公式最小。


    ```

    f(x) = a x + b

    δ = Σ (f x_i - y_i)^2

    ```


    这里直接应用真实值与计算值之间的差的平方和，这种差值有个专门的名称为“残差”。基于此，表达残差的方式有以下三种。


    +   - 范数: 残差绝对值的最大值 max_{1≤i≤m} |r_i|，即所有数据点中残差距离的最大值。


    +   - L1-范数: 绝对残差和 Σ_{i=1}^m |r_i|，即所有数据点残差距离之和。


    +   - L2-范数: 残差平方和 Σ_{i=1}^m r_i^2。


    可以看到，所谓的最小二乘法也就是 L2-范数的一个具体应用。通俗地说，就是看模型计算的结果与真实值之间的相似性。


    因此，最小二乘法可由如下公式定义：


    对于给定的数据 (x_i, y_i) (i=1,⋯,m)，在确定的假设空间 H 中，求解 f(x)∈H，使得残差 δ = Σ (f(x_i)-y_i)^2
    的 L2-范数最小。


    看到这里，可能有读者会提出疑问，这里的 f(x) 又该如何表示呢？实际上，函数 f(x) 是一条多项式曲线：'
  - '[PAGE 191]


    $f(x,w)=w_0+w_0x+w_0x^2+w_0x^3+\cdots+wx^n$


    继续讨论下去，最小二乘法就是找到这么一组权重 w，使得δ=∑f(x_i)-y_i)^2最小。那么问题就来了，如何能使得最小二乘法最小？


    对于求出最小二乘法的结果，通过数学上的微积分处理方法，这是一个求极值的问题，这里只需对权值依次求偏导数，最后令偏导数为0，即可求出极值点。


    $\frac{\partial f}{\partial w_0}=2\sum_{1}^{m}(w_0+w_1w_i-y_i)=0$


    $\frac{\partial f}{\partial w_1}=2\sum_{1}^{m}(w_0+w_1w_i-y_i)x_i=0$


    $\vdots$


    $\frac{\partial f}{\partial w_n}=2\sum_{1}^{m}(w_0+w_nw_i-y_i)x_i=0$


