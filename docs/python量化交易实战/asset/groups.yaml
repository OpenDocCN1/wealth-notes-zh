    \n随机梯度下降算法在神经网络特别是机器学习中应用较广，但是由于其天生的缺陷，噪音较多，使得在计算过程中并不是都向着整体最优解的方向优化，往往可能只是一个局部最优解。因此，为了克服这些困难，一个最好的办法是增大数据量，在不停地使用数据进行迭代处理的时候，能够确保整体的方向是全局最优解，或者最优结果在全局最优解附近。\n\
    \n### 【程序 9-2】\n\n```\nx = [(2, 0, 3), (1, 0, 3), (1, 1, 3), (1,4, 2), (1, 2,\
