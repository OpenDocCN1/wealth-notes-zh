    )\n    lows = msci_tools.get_data_value(data, \"low\")\n    for i in range(len(highs))[window:]:\n\
    \        data_high = highs[i - window + 1:i + 1]\n        data_low = lows[i -\
    \ window + 1:i + 1]\n        X = sm.add_constant(data_low)\n        model = sm.OLS(data_high,\
    \ X)\n        results = model.fit()\n\nans.append(results.params[1])\n# 计算 r2\n\
    ans_rightdev.append(results.rsquared)\n\n# 计算标准化的 RSRS 指标\n# 计算均值序列\nsection =\
    \ ans[-length:]\n# 计算均值序列\nmu = np.mean(section)\n# 计算标准化 RSRS 指标序列\nsigma = np.std(section)\n\
    zscore = (section[-1] - mu) / sigma\n# 计算右偏 RSRS 标准分\nzscore_rightdev = zscore\
    \ * ans[-1] * ans_rightdev[-1]\n\nreturn (zscore_rightdev)\n```\n\n下面使用右偏 RSRS\
