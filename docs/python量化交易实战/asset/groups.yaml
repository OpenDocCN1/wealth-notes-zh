    \n## 8.3 小结\n\n构建一个基于指数的指数增强组合的步骤如下：\n\n- （1）根据自己的目标找到对应特征的指数。\n- （2）综合采用多个因子增强指数的特征。\n\
    \n本章中采用中证红利作为基本示例，演示了构建一个基于已有指数的指数增强基金。对于不同的指数，如果需要构建对应的指数增强组合，最重要的任务是根据其标的特征采用多个因子增强所关注的方向，这也是构建指数增强组合的基础。\n\
