    Dual Thrust 简称 DT，是 Michael Chalek 在 80 年代开发的，是海外 TOP10 交易系统中的一个，属于开盘区间突破类交易系统，以今日开盘价加/减一定比例的昨日振幅确定上下轨，如图
    5-13 所示。日内突破上轨时平空做多，突破下轨时平多做空。


