    \ 基于 Talib 的技术因子重写\n\nTalib 库有很多现成的工具和计算工具，但是某些技术指标的确定和国内还是有差别的，例如 MACD 和 RSI\
    \ 等函数。在这里按国内的指标重写了部分函数，方便读者在回测时使用。\n\n+   1. SMA 简单移动平均\n\n算术移动平均线是简单而普遍的移动平均线。平均线是指算术平均数，计算方法为一组数字相加，除以该组数据的组成个数，其中每一个给定时限在计算平均值时的权重均相等。\n\
    \n```\ndef SMA_CN(close, timeperiod):\n    return reduce(lambda x, y: ((timeperiod\
    \ - 1) * x + y) / timeperiod, close)\n```\n\n+   2. RSI 指标\n\nRSI 是根据一定时期内上涨点数和涨跌点数之和的比率制作出的一种技术曲线，能够反映出市场在一定时期内的景气程度。RSI\
    \ 由威尔斯·威尔德（Welles Wilder）最早应用于期货买卖，后来人们发现在众多的图表技术分析中，强弱指标的理论和实践极其适合股票市场的短线投资，于是被用于股票升跌的测量和分析中。\n\
    \n该分析指标的设计是以三条线来反映价格走势的强弱的，这种图形可以为投资者提供操\n\n作依据，非常适合做短线差价操作。\n\n```\ndef RSI_CN(close,\
    \ timeperiod):\n    diff = map(lambda x, y: x - y, close[1:], close[:-1])\n  \
    \  diffGt0 = map(lambda x: 0 if x < 0 else x, diff)\n    diffABS = map(lambda\
    \ x: abs(x), diff)\n    diff = np.array(diff)\n    diffGt0 = np.array(diffGt0)\n\
    \    diffABS = np.array(diffABS)\n    diff = np.append(diff[0], diff)\n    diffGt0\
    \ = np.append(diffGt0[0], diffGt0)\n    diffABS = np.append(diffABS[0], diffABS)\n\
    \    rsi = map(lambda x: SMA_CN(diffGt0[:x], timeperiod) / SMA_CN(diffABS[:x],\
    \ timeperiod) * 100, range(1, len(diffGt0) + 1))\n    return np.array(rsi)\n```\n\
    \n### 3. KDJ 指标\n\nKDJ 指标又叫随机指标，是一种相当新颖、实用的技术分析指标，它起先用于期货市场的分析，后被广泛用于股市的中短期趋势分析，是期货和股票市场上最常用的技术分析工具。\n\
    \n随机指标 KDJ 一般用于股票分析的统计体系，根据统计学原理，通过一个特定的周期（常为 9 日、9 周等）内出现过的最高价、最低价及最后一个计算周期的收盘价及这三者之间的比例关系，来计算最后一个计算周期的未成熟随机值\
