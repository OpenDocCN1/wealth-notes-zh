    \nTalib 的简称是 Technical Analysis Library，主要功能是计算行情数据的技术分析指标，用来开发技术分析策略。官网称其为 TA-Lib，为了简便起见，本书使用\
    \ Talib 指代 TA-Lib。\n\n## Talib 金融工具库的介绍\n\nTalib 的中文翻译为技术分析库，是一种以 Python 为基础的广泛用于量化交易中对金融市场数据进行分析的函数库。其通过内置的函数给使用者提供了多种技术分析函数和多种变量，极大地方便了量化投资中的数据编程工作。下面以股票分析为例进行介绍，其他如期货、期权的交易在程序设计上类似，就不再额外阐述了。\n\
    \n### 5.1.1 使用 Talib 获取 3 日、7 日、15 日均线\n\n学习一个新的技术，最好的方法是实际进行在实际中学习。\n\n（1）对于\
    \ Talib 的使用，首先需要获取实时的股票数据，通过使用第 4 章所提供的 API 可以很方便地取得所需要的数据，代码如下：\n\n```\nfrom\
