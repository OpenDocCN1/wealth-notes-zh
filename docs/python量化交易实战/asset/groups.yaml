    # PB-ROE 回归模型的使用


    PB-ROE 是另一种回归模型。


    众所周知，选股的核心思想在于寻找价格低于内在价值的股票，从而获取未来价格修复的收益。具体来看，符合价值投资理念的标的首先要具有良好的基本面，其次要有合理的价格。PB-ROE
    选股模型便是价值投资中的一种经典方法。该模型中，ROE 作为基本面指标，用于衡量公司质地是否优良，PB 作为估值指标，用于衡量当前价格是否低估。


    # 10.3.1 PB-ROE 模型介绍


    PB-ROE 是英文 Price/Book ratio-Return On Equity 的缩写。其中 PB 与 ROE 的含义如下：


    ```

    PB=股价/账面价值 .

    ROE=[(净利润一优先股股利)/期初普通股股东权益]*100%

    ```


    账面价值的含义是：总资产一无形资产一负债一优先股权益。而所谓的账面价值，是公司解散清算的价值。因为如果公司清算，那么债要先还，无形资产则将不复存在，而优先股的优先权之一就是清算的时候先分钱。


    一般来说，用每股净资产来代替账面价值，PB 就用市净率来替代，而 ROE 又叫股权收益率，ROE 使用净资产收益率来替代。


    因此，可以简单地理解 PB-ROE 就是“市净率一净资产收益率”。这个模型的意思是，净资产收益率高的股票，其实净率也应该高些。从图 10-5（可参看本书下载包中的图片文件）可以看到，某年的
    A 股市场中，根据 PB-ROE 回归图示化的结果，大多数的股票都在回归曲线的上方，从模型上看，其值都被高估。'
