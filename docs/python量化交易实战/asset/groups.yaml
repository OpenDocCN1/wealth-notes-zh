    \ 的组合对数有' +str( (np.sum(corr.values.ravel()>0.95) - len(symbols))/2)+ '对')\n\n\
    print(corr[corr>0.95])\n```\n\n从【程序 11-9】中可以看到，首先从掘金量化数据库中读取了其对应的数据，之后按 DataFrame\
    \ 生成对应的数据格式，使用生成的 DataFrame 数据集自带的数据相关性计算数据集内部的数据相关性。\n\n打印结果如下：\n\n相关系数大于 0.9\
