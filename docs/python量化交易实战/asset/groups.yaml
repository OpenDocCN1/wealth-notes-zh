    ```\nfrequency=\"3600s\"\n```\n\n即可。\n\n### 5.1.2 EMA 的计算\n\nEMA 的中文意思是指数平均数指标，也叫\
    \ EXPMA 指标，是一种趋向类指标，是以指数式递减加权的移动平均。\n\nEMA 的公式如下：\n\nEMA = α × Price_N + (1 -\
    \ α) × Price_(N-1)\n\n其中，α 为平滑指数，一般取作 2/(N+1)。\n\n### 【程序 5-3】\n\n```\nfrom gm.api\
