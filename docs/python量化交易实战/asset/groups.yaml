    \n### 5.4.2 Dynamic Breakout II 策略\n\nDynamic Breakout II 策略是一种动态自适应策略。所谓动态自适应策略，指的是这种系统的参数会依据市场当前的状态而自行调整。\n\
    \n传统的轨道线采用固定比率的价格差值来计算轨道的上下阈值，例如 Talib 中的 BBANDS 函数，通过固定采样区间标准差的计算来确定轨道的上下阈值。这样便于计算，可以获得一个稳定的计算公式。但是采样区间的选取是比较困难的，如果采样区间太短，那么在趋势比较明显的情况下会表现优秀，信号对于入场和出场的展示比较紧密。但是采样区间太短会因为信号过于敏感而使其出现得较为频繁。\n\
    \n在趋势不明显的市场中，采样区间设置较短会使得信号出现过多。一个较好的解决 方法是把采样区间设置得更长一些，使其信号出现得不那么频繁。但是对参数进行调整并不是那么简单的一件事，最好的方法是依据当前市场本身的状况自行调整参数的值，而不是使用固定参数值的方式来进行设置。\n\
    \nDynamic Breakout II 策略就是采用动态自适应的 方法，根据市场的波动作为衡量的标注。在震荡幅度较大的市场中，波动率自然而然较大，需要增加采样区间的值，这样不容易反复出现买卖点信号，而在趋势稳定的市场中，市场有较为明显的走势，波动率会随之变小，因此要减少采样区间的值，使得信号的出现较为敏感。\n\
    \nDynamic Breakout II 策略最重要的是波动率的计算。这个波动率的计算方式如下：\n\n- （1）计算当日的标准差。\n- （2）计算上一个交易日的标准差。\n\
    - （3）根据公式\n\ndeltaVolatility = (todayVolatility − yesterDayVolatility) / todayVolatility\n\
    \n每日比较市场波动度的增减，如果市场波动度变大 10%，就把采样区间的参数值增加 10%。而如果市场波动度减少 10%，就把采样区间的参数值减少 10%。\n\
    \n代码如下：\n\n```\ntodayVolatility = np.std(close)\nyesterDayVolatility = np.std(close[:-1])\n\
    deltaVolatility = (todayVolatility - yesterDayVolatility) / todayVolatility\n\n\
    lookBackDays = np.round(lookBackDays * (1 + deltaVolatility))\nlookBackDays =\
    \ np.min([lookBackDays,context.ceilingAmt])\nlookBackDays = np.max([lookBackDays,context.floorAmt])\n\
    ```\n\n其中的 todayVolatility 和 yesterDayVolatility 是当日和上一个交易日的标准差，deltaVolatility\
    \ 用于计算当前的波动率，lookBackDays 则用于计算采样区间，根据不同波动率对其进行增减。\n\ncontext.ceilingAmt 和 context.floorAmt\
    \ 是人为设定的采样区间上下限，根据公开的数据和已有回测，一般高值设置为 60，而低值设置为 20 较为合适。\n\n至于买卖点的判定，当上一日的收盘价在区间上轨时买入，而收盘价低于区间下轨时则卖出。\n\
    \n### 【程序 5-13】\n\n```\nfrom gm.api import *\nimport numpy as np\nimport talib\n\
    def init(context):\n\n    context.symbol = \"SZSE.300296\"\n    context.frequency\
    \ = \"1d\"\n    context.fields = \"open,high,low,close,volume\"\n    context.ceilingAmt\
    \ = 60\n    context.floorAmt = 20\n    context.bolBandTrig = 1\n\n    schedule(schedule_func=algo,date_rule=\"\
    1d\",time_rule=\"09:30:00\")\n\nlookBackDays = 30\n```\n"
