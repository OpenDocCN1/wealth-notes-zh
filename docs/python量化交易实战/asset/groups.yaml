    \n账面价值的含义是：总资产一无形资产一负债一优先股权益。而所谓的账面价值，是公司解散清算的价值。因为如果公司清算，那么债要先还，无形资产则将不复存在，而优先股的优先权之一就是清算的时候先分钱。\n\
    \n一般来说，用每股净资产来代替账面价值，PB 就用市净率来替代，而 ROE 又叫股权收益率，ROE 使用净资产收益率来替代。\n\n因此，可以简单地理解\
    \ PB-ROE 就是“市净率一净资产收益率”。这个模型的意思是，净资产收益率高的股票，其实净率也应该高些。从图 10-5（可参看本书下载包中的图片文件）可以看到，某年的\
    \ A 股市场中，根据 PB-ROE 回归图示化的结果，大多数的股票都在回归曲线的上方，从模型上看，其值都被高估。\n\n![](img/66b32d04cb77b904cead314891984c93_231_0.png)\n\
