    ## 内容简介


    在目前不断变化、蓬勃发展的中国资本市场，量化投资作为新兴的投资方法，引来越来越多的关注，使用量化投资技术的证券从业人员也越来越多。


    本书分为 11 章，内容包括 Python 环境的搭建、Python 数据相关类库的使用、掘金量化终端的使用、Talib 金融库的详解、多因子策略的介绍、带技术指标的多因子策略、中证红利指数增强策略、回归分析与
    TensorFlow、回归模型的经典应用、配对交易的魔力等。


    本书可作为量化投资技术初学者、证券从业人员、金融投资人员的自学用书，也可作为金融机构的培训用书，还可作为高等院校相关专业师生的教学参考书。


