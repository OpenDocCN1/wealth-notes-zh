    \ Anaconda 自带的一个数据矩阵化的包。对于 NumPy，读者只需要知道，NumPy 系统是 Python 的一种开源的数值计算扩展。这种工具可用来存储和处理大型矩阵，比\
    \ Python 自身的嵌套列表（nested list structure）结构要高效得多。\n\n第一行代码的意思是引入 NumPy，将其重命名为 np\
    \ 使用，第二行使用 NumPy 中的 mat() 方法建立一个数据矩阵，row 是引入的计算行数的变量，使用 for 循环将 data 数据读出到 line\
    \ 中，而每读一行则 row 的计数加一。data.size 是计算数据集中全部数据的数据量，一般其与行数相除，则为列数。最终打印结果请读者自行测试。\n\n\
    需要说明的是，NumPy 将数据转化成一个矩阵的形式进行处理，其中具体的数据可以通过二元的形式读出，如【程序 3-2】所示。\n\n# 【程序 3-2】\n\
    \n```\nimport numpy as np\ndata = np.mat([[1,200,105,3,False],[2,165,80,2,False],\n\
