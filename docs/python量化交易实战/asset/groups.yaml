    \n## 6.5 小结\n\n本章介绍了量化选股中最基础的多因子选股策略，从一个简单的例子介绍了因子的选择和对一个股票标的产生的影 响。之后介绍了使用 IC\
    \ 值计算某个时间段的因子与下一个时间段股票收益之间的关系，作用是通过比较和计算不同的因子对下一个时间段股票收益的影响，从而选出较为合适的相关因子。\n\n\
    因子的选取方法有很多，但是万变不离其宗，其根本就是需要找到当前的因子与下期股票的涨势相互之间的关系，这点请读者牢记。\n\n成长模型是读者接触到的第一个较为完整的选股模型，核心是使用特定的因子综合起来计算最终因子得分，这里是使用等权法计算的，也是最为传统的方法。而在回测框架上，使用的是最为简单的模型框架，选择模型时没有考虑止损和止盈相关的影响。而这些都是在现\
    \ 实中需要极其注意的地方。\n\n本章介绍了多因子入门的知识，主要是基本面选股，但是在实际使用时，除了基本面因子外，还有很多技术面因子，这点将在下一章向读者介绍。\n\
