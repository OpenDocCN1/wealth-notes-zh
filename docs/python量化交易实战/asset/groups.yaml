    \ 重现其投资模型和方法。\n\n### 6.4.1 霍华·罗斯曼简介\n\n霍华·罗斯曼（Howard Rothman）是华尔街著名的投资分析公司——远见投资顾问公司（Vision\
    \ Investment Advisor, VIA）的首席投资分析师和总裁（1997~2002年），也曾为美国折扣券商协会（the National Introducing\
    \ Brokers Association）的主席及创始会员。\n\n他于1990年一月被折扣券商会员（Introducing Broker Membership）推荐进入国家期货协会董事会（the\
    \ National Futures Association Board of Directors）担任董事，并连任达3届。目前为期货产业协会的纪律委员会（the\
    \ Law and Compliance Division of the Futures Industry Association）会员。\n\n霍华·罗斯曼的投资方式强调“在正确的时机买入并紧握持股”与“选择优质股票并长期持有”（“buy\
    \ right and hold tight” and “buy strong and hold long”）。\n\n他认为只要在适当的价格买入稳定且持续成长获利的股票，不需要经常更换持股，投资報酬率必然指日可期。由此可见，霍华·罗斯曼的投资哲学虽然简单，却充分显现了首席投资分析师的谨慎风范。\n\
    \n### 6.4.2 霍华·罗斯曼的投资模型\n\n霍华·罗斯曼强调其投资风格在于为投资大众建立均衡且以成长为导向的投资组合。其选股方式偏好大型股、管理良好且领导产业趋势以及产生实际报酬率的公司，不仅重视公司产生现金的能力，也强调有稳定成长能力的重要性。\n\
    \n下面介绍几个要点。\n\n- （1）总市值大于等于 50 亿美 元。\n- （2）良好的财务结构。\n- （3）较高的股东权益报酬。\n- （4）拥有良好且持续的自由现金流量。\n\
    - （5）稳定持续的营收增长率。\n- （6）优于比较指数的盈余报酬率。\n\n将其投资模型用程序语言组织起来：\n\n- （1）总市值≥市场平均值*1.0。\n\
    - （2）最近一季流动比率≥行业平均值。\n- （3）近四季股东权益报酬率≥市场平均值。\n- （4）最近三年 CPS≥0 且最近四季 CPS≥0。\n-\
    \ （5）近四季营收成长率为 6%至 30%。\n- （6）近四季盈余成长率为 8%至 50%。\n\n### 6.4.3 对霍华·罗斯曼模型的分析\n\n\
