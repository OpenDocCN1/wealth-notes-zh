    \ 的计算\n\nMACD 称为指数平滑移动平均线，是金融分析指标中常用的一个数据指标，用于对股票趋势的分析。\n\nMACD 的意义和双移动平均线基本相同，即由快、慢均线的离散、聚合表征当前的多空状态和股价可能的发展变化趋势，但阅读起来更方便。当\
    \ MACD 从负数转向正数时，是买的信号。当 MACD 从正数转向负数时，是卖的信号。当 MACD 以大角度变化时，表示快的移动平均线和慢的移动平均线的差距非常迅速地拉开，代表一个市场大趋势的转变。\n\
    \n同样，Talib 中也提供了这个指标的处理函数，代码如下：\n\n```\ndef MACD(real, *args, **kwargs): # real\
    \ signature unknown; NOTE: unreliably restored from __doc__\n    \"\"\"\n    MACD(real[,\
    \ fastperiod=?, slowperiod=?, signalperiod=?])\n        Inputs:\n            real:\
    \ (any ndarray)\n        Parameters:\n            fastperiod: 12\n           \
    \ slowperiod: 26\n            signalperiod: 9\n        Outputs:\n            macd\n\
