    ## 2. ADOSC ( Chaikin A/D Oscillator Chaikin ) 震荡指标


    ADOSC 将资金流动情况与价格行为相对比，检测市场中资金流入和流出的情况。其函数如下：


    ```

    def ADOSC(high, low, close, volume, *args, **kwargs):

    ```


    ## 3. ATR ( Average True Range , 平均真实波幅 )


    ATR 主要用来衡量价格的波动。因此，这一技术指标并不能直接反映价格走向及其趋势的稳定性，而只是表明价格波动的程度。


    ```

    def ADOSC(high, low, close, volume, *args, **kwargs):

    ```


    ## 4. OBV ( On Balance Volume , 能量潮 )


    OBV 通过统计成交量变动的趋势推测股价趋势。它以某日为基期，逐日累计每日上市股票总成交量，若隔日指数或股票上涨，则基期 OBV 加上本日成交量为本日 OBV。若隔日指数或股票下跌，则基期
    OBV 减去本日成交量为本日 OBV。函数如下：


    ```

    def OBV(real, volume):

    ```


    以上只是对部分常用的函数进行说明，其他相关函数请读者自行演示。


    ## 5.2.2 Talib 图像形态识别


    除了常用的函数之外，Talib 还提供了蜡烛图（K 线图）的图像识别方法。


    ### 1. 函数名：CDL2CROWS

    名称：Two Crows（两只乌鸦）

    简介：三日 K 线模式，第一天长阳，第二天高开收阴，第三天再次高开继续收阴，收盘比前一日收盘价低，预示股价下跌。

    函数：def CDL2CROWS(open, high, low, close)


    ### 2. 函数名：CDL3BLACKCROWS

    名称：Three Black Crows（三只乌鸦）

    简介：三日 K 线模式，连续三根阴线，每日收盘价都下跌且接近最低价，每日开盘价都在上根 K 线实体内，预示股价下跌。

    函数：def CDL3BLACKCROWS(open, high, low, close)


    ### 3. 函数名：CDL3INSIDE

    名称：Three Inside Up/Down（三内部上涨和下跌）

    简介：三日 K 线模式，母子信号+长 K 线，以三内部上涨为例，K 线为阴阳阳，第三天收盘价高于第一天开盘价，第二天 K 线在第一天 K 线内部，预示着股价上涨。

    函数：def CDL3INSIDE(open, high, low, close)


    ### 4. 函数名：CDL3LINESTRIKE

    名称：Three-Line Strike（三线打击）

    简介：四日 K 线模式，前三根阳线，每日收盘价都比前一日高，开盘价在前一日实体内，第四日市场高开，收盘价低于第一日开盘价，预示股价下跌。

    函数：def CDL3LINESTRIKE(open, high, low, close)


    ### 5. 函数名：CDL3OUTSIDE

    名称：Three Outside Up/Down（三外部上涨和下跌）

    简介：三日 K 线模式，与三内部上涨和下跌类似，K 线为阴阳阳，但第一日与第二日的 K 线形态相反，以三外部上涨为例，第一日 K 线在第二日 K 线内部，预示着股价上涨。

    函数：def CDL3OUTSIDE(open, high, low, close)


    ### 6. 函数名：CDL3STARSINSOUTH

    名称：Three Stars In The South（南方三星）

    简介：三日 K 线模式，与大致当前相反，三日 K 线皆阴，第一日有长下影线，第二日与第一日类似，K 线整体小于第一日，第三日无下影线实体信号，成交价格都在第一日振幅之内，预示下跌趋势反转，股价上升。

    函数：def CDL3STARSINSOUTH(open, high, low, close)


    ### 7. 函数名：CDL3WHITESOLDIERS

    名称：Three Advancing White Soldiers（三个白兵）

    简介：三日 K 线模式，三日 K 线皆阳，每日收盘价变高且接近最高价，开盘价在前一日实体上半部，预示股价上升。

    函数：def CDL3WHITESOLDIERS(open, high, low, close)


    ### 8. 函数名：CDLABANDONEDBABY

    名称：Abandoned Baby（弃婴）

    简介：三日 K 线模式，第二日价格跳空且收十字星（开盘价与收盘价接近，最高价与最低价相差不大），预示趋势反转，发生在顶部下跌，底部上涨。

    函数：def CDLABANDONEDBABY(open, high, low, close, penetration=0)


    ### 9. 函数名：CDLADVANCEBLOCK

    名称：Advance Block（大敌当前）

    简介：三日 K 线模式，三日都收阳，每日收盘价都比前一日高，开盘价都在前一日实体以内，实体变短，上影线变长。

    函数：def CDLADVANCEBLOCK(open, high, low, close)


    ### 10. 函数名：CDLBELTHOLD

    名称：Belt-Hold（捉腰带线）

    简介：两日 K 线模式，下跌趋势中，第一日阴线，第二日开盘价为最低价，阳线，收盘价接近最高价，预示价格上涨。

    函数：def CDLBELTHOLD(open, high, low, close)


    ### 11. 函数名：CDLBREAKAWAY

    名称：Breakaway（脱离）

    简介：五日 K 线模式，以看涨脱离为例，下跌趋势中，第一日长阴线，第二日跳空阴线，延续趋势开始震荡，第五日长阳线，收盘价在第一天收盘价与第二天开盘价之间，预示价格上涨。

    函数：def CDLBREAKAWAY(open, high, low, close)


    ### 12. 函数名：CDLCLOSINGMARUBOZU

    名称：Closing Marubozu（收盘缺影线）

