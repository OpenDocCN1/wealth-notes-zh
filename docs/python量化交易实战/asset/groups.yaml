    # 5.4.2 Dynamic Breakout II 策略


    Dynamic Breakout II 策略是一种动态自适应策略。所谓动态自适应策略，指的是这种系统的参数会依据市场当前的状态而自行调整。


    传统的轨道线采用固定比率的价格差值来计算轨道的上下阈值，例如 Talib 中的 BBANDS 函数，通过固定采样区间标准差的计算来确定轨道的上下阈值。这样便于计算，可以获得一个稳定的计算公式。但是采样区间的选取是比较困难的，如果采样区间太短，那么在趋势比较明显的情况下会表现优秀，信号对于入场和出场的展示比较紧密。但是采样区间太短会因为信号过于敏感而使其出现得较为频繁。


