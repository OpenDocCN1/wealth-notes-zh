    \n图 9-16 支持向量机回测结果\n\n## 9.6 小结\n\n本章带领大家进行了线性回归的基础学习，介绍了一元回归和多元回归的基本概念，讲解了回归分析的计算方法。这些内容可能有些难度，希望读者量力而行。\n\
    \n本章使用了一个简单的例子去实践线性回归的拟合方法。虽然这是一个非常简单的例子，但是这个例子可以变化的部分很多，例如可以加入前一日的最高最低点判定以及将其改成逻辑回归，就像\
    \ 9.4 节中的示例一样。\n\n9.5 节的支持向量机采用的是机器学习的方法，这也是未来发展的趋势。\n\n本章主要介绍了某些常用的策略算法，无论是线性回归、逻辑回归，还是最后的支持向量机，都是通过建立模型拟合影响因子对真实结果的量化模拟，涉及开盘价、闭盘价、最高价、最低价以及交易量等基本面数据，并且涉及若干“技术性”因子。\n\
    \n## 第 10 章\n\n### ▶ 回归模型的经典应用 ◀\n\n回归分析是最常用的量化策略之一。前面在回归模型的基础讲解中，对使用 Python 进行回归模型计算做了介绍，包括使用回归模型对股价进行预测以及使用逻辑回归帮助股票买卖者进行决策等。\n\
    \n事实上，更多的回归模型应用于对股票的基本面数据进行分析，例如经典的 CAPM 模型、Fama-French 三因子模型以及最新的 PB_ROE 模型。这些都是已经应用于现实中的金融市场并获得认同和较好的收益的经典模型。图\
    \ 10-1 所示为回归模型的示例。\n\n![](img/66b32d04cb77b904cead314891984c93_219_0.png)\n\n\
    图 10-1 回归模型\n\n本章着重介绍 Fama-French 三因子模型和 PB_ROE 模型，这也是目前常用的模型方法，CAPM 模型由于一些问题被\
    \ Fama-French 模型所替代，因此并不重点介绍，只做简单的讲解。\n\n## 10.1 CAPM 模型简介\n\n资本资产定价模型（Capital\
    \ Asset Pricing Model, CAPM）是由美国学者夏普（William Sharpe）、林特纳（John Lintner）、特里诺（Jack\
    \ Treynor）和莫辛（Jan Mossin）等人于1964年在资产组合理论和资本市场理论的基础上发展起来的。\n\n证券市场中资产的预期收益率与风险资产之间的关系，以及均衡价格的形成原因，是现代金融市场价格的理论支柱，广泛应用于投资决策和公司理财领域。\n\
    \nCAPM 资产定价模型假设所有投资者都按马科维茨的资产选择理论进行投资，对期望收益、方差和协方差等的估计完全相同，投资人可以自由借贷。基于这样的假设，CAPM\
    \ 资产定价模型研究的重点在于探求风险资产收益与风险的数量关系，即为了补偿某一特定程度的风险，投资者应该获得多少的報酬率。\n\n### 10.1.1 CAPM\
    \ 定价模型的提出\n\n马科维茨（Markowitz）的分散投资与效率组合投资理论，第一次以严谨的数理工具向人们展示了一个风险厌恶的投资者在众多风险资产中构建最优资产组合的方法。应该说，这一理论带有很强的规范（normative）意味，告诉投资者应该如何进行投资选择。\n\
    \n但问题是，在 20 世纪 50 年代，即便有了当时刚刚诞生的电脑的帮助，在实践中应用马科维茨的理论仍然是一项烦琐、令人生厌的高难度工作；或者说，与投资的现实世界脱节得过于严重，进而很难完全被投资者采用。美国普林斯顿大学的鲍莫尔（William\
    \ Baumol）在其 1966 年的一篇探讨马科维茨-托宾体系的论文中就谈到，按照马科维茨的理论，即使以较简化的模式，要从 1500 只证券中挑选出有效率的投资组合，当时每运行一次电脑需要花费\
    \ 150 美元~300 美元，而如果要执行完整的马科维茨运算，所需的成本至少是前述金额的 50 倍，而且还必须有一个前提，就是分析师必须能够持续且精确地估计标的证券的预期報酬、风险及相关系数，否则整个运算过程将变得毫无意义。\n\
    \n正是由于这一问题的存在，从 20 世纪 60 年代初开始，以夏普、林特纳和莫辛为代表的经济学家开始从实证的角度出发，探索证券投资的现实，即马科维茨的理论在现实中的应用能否得到简化。如果投资者都采用马科维茨资产组合理论选择最优资产组合，那么资产的均衡价格将如何在收益与风险的权衡中形成？或者说，在市场均衡状态下，资产的价格如何依风险而确定？\n\
    \n这些学者的研究直接导致了 CAPM 的产生。作为基于风险资产期望收益均衡基础的预测模型之一，CAPM 阐述了在投资者都采用马科维茨的理论进行投资管理的条件下市场均衡状态的形成，把资产的预期收益与预期风险之间的理论关系用一个简单的线性关系表达出来，即认为资产的预期收益率与衡量该资产风险尺度的\
    \ β 值之间存在正相关关系。\n\n应该说，作为一种阐述风险资产均衡价格决定的理论，单一指数模型或以之为基础的 CAPM 不仅大大简化了投资组合选择的运算过程，使马科维茨的投资组合选择理论朝现实世界的应用迈进了一大步，而且也使得证券理论从以往的定性分析转入定量分析，从规范性转入实证性，进而对证券投资的理论研究和实际操作，甚至整个金融理论与实践的发展都产生了巨大影响，成为现代金融学的理论基础。\n\
    \n当然，近几十年，作为资本市场均衡理论模型关注的焦点，CAPM 的形式已经远远超越了夏普、林特纳和莫辛提出的传统形式，有了很大的发展，如套利定价模型、跨时资本资产定价模型、消费资本资产定价模型等，目前已经形成了一个较为系统的资本市场均衡理论体系。\n\
    \n### 10.1.2 CAPM 定价模型公式与假设\n\n当资本市场达到均衡时，风险的边际价格是不变的，任何改变市场组合的投资所带来的边际效果是相同的，即增加一个单位的风险所得到的补偿是相同的。按照\
    \ β 的定义，代入均衡资本市场条件下，得到资本资产定价模型。\n\n#### 1. CAPM 的定价模型\n\n定价模型如下：\n\n```\nRa =\
    \ rf + βa × (rm − rf)\n```\n\n- rf（Risk Free Rate）是无风险回报率（相对于一年期国债）。\n- βa 是证券的\
    \ Beta 系数。\n- rm 是市场期望的回报率（Expected Market Return）。\n- rm − rf 是股票市场溢价（Equity\
    \ Market Premium，EMP）。\n\nCAPM 公式中的右边第一个是无风险收益率，其一般使用一年期国债。如果股票投资者需要承受额外的风险，那么将需要在无风险回报率的基础上多获得相应的溢价。股票市场溢价就等于市场期望回报率减去无风险回报率。证券风险溢价就是股票市场溢价和一个\
    \ β 系数的乘积。\n\n#### 2. CAPM 定价模型的假设\n\n但是事实上，CAPM 定价模型需要大量的假设，归类如下：\n\n- 投资者希望财富越多越好，效用是财富的函数，财富又是投资收益率的函数，因此可以认为效用为收益率的函数。\n\
    - 投资者能事先知道投资收益率的概率分布为正态分布。\n- 投资风险用投资收益率的方差或标准差标识。\n- 影响投资决策的主要因素为期望收益率和风险两项。\n\
    - 投资者都遵守主宰原则（Dominance Rule），即同一风险水平下，选择收益率较高的证券；同一收益率水平下，选择风险较低的证券。\n- 可以在无风险折现率\
    \ R 的水平下无限制地借入或贷出资金。\n- 所有投资者对证券收益率概率分布的看法一致，因此市场上的效率边界只有一条。\n- 所有投资者具有相同的投资期限，而且只有一期。\n\
    - 所有的证券投资可以无限制地细分，在任何一个投资组合里可以含有非整数股份。\n- 买卖证券时没有税负及交易成本。\n- 所有投资者可以及时免费获得充分的市场信息。\n\
    - 不存在通货膨胀，且折现率不变。\n- 投资者具有相同预期，即他们对预期收益率、标准差和证券之间的协方差具有相同的预期值。\n\n上述假设表明：第一，投资者是理性的，而且严格按照马科维茨模型的规则进行多样化的投资，并将从有效边界的某处选择投资组合；第二，资本市场是完美/完全市场，没有任何摩擦阻碍投资。\n\
    \n但是问题在于，这些假设太过于完美主义，任何一个现实中的交易者或者现实中的股票交易场所都不可能达到 CAPM 的要求。\n\n#### 3. CAPM 资本资产定价模型的优缺点\n\
    \n##### （1）优点\n\n- CAPM 最大的优点在于简单、明确。它把任何一种风险证券的价格都划分为三个因素：无风险收益率、风险的价格和风险的计算单位，并把这三个因素有机结合在一起。\n\
    - CAPM 的另一优点在于它的实用性。它使投资者可以根据绝对风险而不是总风险来对各种竞争报价的金融资产做出评价和选择。这种方法已经被金融市场上的投资者广为采纳，用来解决投资决策中的一般性问题。\n\
    \n##### （2）局限性\n\n当然，CAPM 也不是尽善尽美的，它本身存在着一定的局限性，表现在：\n\n- 假设市场处于完善的竞争状态。但是，实际操作中完全竞争的市场是很难实现的，“做市”时有发生。\n\
    - 假设投资者的投资期限相同且不考虑投资计划期之后的情况。但是，市场上的投资者数目众多，他们的资产持有期间不可能完全相同，而且现在进行长期投资的投资者越来越多，所以这个假设就变得不那么现实了。\n\
    - 假设投资者可以不受限制地以固定的无风险利率借贷，这一点也是很难办到的。\n- 假设市场无摩擦。但实际上，市场存在交易成本、税收和信息不对称等问题。\n\
    - “理性人假设”和“一致预期假设”。这两个假设也是一种理想状态。\n\n### 10.1.3 CAPM 中 Beta 的定义\n\nCAPM 中的 Beta\
    \ 值与在前面用于衡量股票变动性的 Beta 值相似，这里请读者注意。\n\n按照 CAPM 的规定，Beta 系数是用以度量一项资产系统风险的指针，是用来衡量一种证券或一个投资组合相对总体市场的波动性（volatility）的一种风险评估工具。\n\
    \n也就是说，如果一只股票的价格和市场的价格波动性是一致的，那么这只股票的 Beta 值就是 1。如果一只股票的 Beta 值是 1.5，就意味着当市场上升\
    \ 10%时，该股票价格上升 15%；而市场下降 10%时，股票的价格亦会下降 15%。\n\nBeta 值是通过统计分析同一时期市场每天的收益情况以及单个股票每天的价格收益来计算的。1972\
    \ 年，经济学家费歇尔·布莱克（Fischer Black）、迈伦·斯科尔斯（Myron Scholes）等在他们发表的论文《资本资产定价模型：实例研究》中，通过研究\
    \ 1931 年到 1965 年纽约证券交易所股票价格的变动，证实了股票投资组合的收益率和它们的 Beta 值间存在着线性关系，如图 10-2 所示。\n\n\
    当 Beta 值处于较高位置时，投资者便会因为股份的风险高而相应地提升股票的预期回报率。例如，如果一个股票的 Beta 值是 2.0，无风险回报率是 3%，市场回报率（Market\
    \ Return）是 7%，那么市场溢价（Equity Market Premium）就是 4%（7%-3%），股票风险溢价（Risk Premium）为\
    \ 8%（2×4%，用 Beta 值乘以市场溢价），那么股票的预期回报率则为 11%（8%+3%，即股票的风险溢价加上无风险回报率）。\n\n![](img/66b32d04cb77b904cead314891984c93_223_0.png)\n\
    \n图 10-2 CAPM 中的 Beta 值\n\n理论上来说，一个风险投资者需要得到的溢价可以通过 CAPM 计算出来。换句话说，我们可以通过 CAPM\
    \ 知道当前股票的价格是否与其回报相吻合。\n\n但是事实上，在计算某些股票时，由于缺乏历史数据，其 Beta 值不易估计。此外，由于经济不断发展变化，各种证券的\
    \ Beta 值也会产生相应的变化，依靠历史数据估算出的 Beta 值对未来的指导作用也要打折扣。因此，Beta 值的计算有时候难以确认。\n\n对于 CAPM\
    \ 模型的设计和回测，这里不再详细介绍，有兴趣的读者可自行完成。\n\n## 10.2 Fama-French 三因子模型\n\nCAPM 作为一种资产定价模型统治了金融市场很长一段时间。直到后来，Fama\
    \ 和 French（见图 10-3）两个人研究股票超额收益率的时候发现了一个神奇的现象：有两类股票的历史平均收益率会高于一般人们所预测的收益率。它们是小公司股票以及具有较高股权账面市值比的股票。\n\
    \nFama 和 French 分别分析了原因，他们认为：\n\n- 市值比较小的公司通常规模比较小，公司相对而言没那么稳定，因此风险较大，需要获得更高的收益来补偿。\n\
    - 此外就是账面市值比。账面市值比就是账面的所有者权益除以市值（以下简 B/M）。若 B/M 较高，则说明市场上对公司的估值比公司自己的估值更低。这些公司一般都是销售状况或者盈利能力不是十分好的公司，因此相对于低\
    \ B/M 的公司来说需要更高的收益来补偿。\n\n一般对于股票收益的解释认为收益风险同源。市场风险是唯一能给股票带来超额收益的风险。但是基于以上两个事实的研究发现，除了市场风险外，Fama-French\
    \ 认为市场上还存在市值风险、账面市值比风险等，据此建立的模型被称为 “Fama-French 三因子模型”。本节旨在深入浅出地介绍三因子模型的思想并提供一个实用的三因子策略。\n\
    \n![](img/66b32d04cb77b904cead314891984c93_224_0.png)\n\n### 10.2.1 Fama-French\
    \ 模型的基础公式\n\n1992 年，Fama 和 French 对美国股票市场决定不同股票回报率差异的因素的研究发现，对于传统的股票模型来说，股票市场的\
    \ Beta 值不能解释不同股票回报率的差异。在此基础上，有实证研究表明，股票市值、账面市值比、财务杠杆（leverage）和市盈率的倒数（E/P）等指标可以很好地解释股票收益。\n\
    \n于是，Fama 和 French 在 1992 年发表了一篇文章，把这些因子都考虑进去，研究 1963 年~1990 年在 NYSE、AMEX 和 NASDAQ\
    \ 交易的股票（除金融类股票外）的平均收益和这些因子的关系。在横截面回归（cross-section regression）后发现，在独立检验 4 者对平均收益的影响时，4\
    \ 者都表现出了很强的解释能力；而在进行多变量回归时，市值和账面市值比这两个因子吸收了另外两个因子的解释能力，成为解释平均收益的决定性变量。公式如下：\n\n\
    ```\nRi = ai + bi Rm + si E(SMB) + li E(HMI) + εi\n```\n\n这里的 Ri 指的是股票相对无风险投资（一年期国债）的期望额外收益率。\n\
