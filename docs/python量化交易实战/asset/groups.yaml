    # 11.2 协整性的判定与检验


    配对交易是一种基于统计建模分析的交易策略，它是通过计算不同股票之间是否具有同样的趋势与走势进行股票交易的策略。


    在股市交易中，由于人们的心理作用以及行业内部的周期相似性，同行业中的股票往往具有相同的趋势，同时涨跌受与本行业相关的消息等因素的影响。即使股价在表现上有所偏离，但是最终还是会趋于一致。这种性质被称为“协整性”。


    # 11.2.1 协整性


    协整性的解释较为复杂，这里先看两只股票在 2015 年的走势图，如图 11-1 所示。


    ![](img/66b32d04cb77b904cead314891984c93_258_0.png)


    从图 11-1 中可以看到，两只股票非常相似，在跌的时候一起下跌，而涨的时候会有共同上涨的趋势。更进一步可以看到，两只股票的价差较为平稳，其在变化过程中，前进的方向也是一致的。这种性质被称为“协整性”。


    在继续探讨协整性之前，提出一个新词——平稳性。简单来说，平稳性就是在一个时间序列中不随外界噪音改变而能够保持稳定不变的性质。'
