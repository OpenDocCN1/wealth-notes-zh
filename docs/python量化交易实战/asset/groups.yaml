    # 6.2.1 基于 IC 值的多因子计算方法


    随着金融行业的发展，在金融系统中产生能够表述某一方面问题的因子越来越多，大概可以分为估值与市值类因子、偿债能力和资本结构类因子、分析师预期类因子、均线型因子、成交量型因子、成长能力类因子、每股指标因子、现金流指标因子、盈利能力和收益质量类因子、能量型因子、营运能力类因子、超买超卖型因子、趋势型因子这些大类。


    大类因子进一步细分下去，目前来说会形成 5000 个左右的可观测因子，因此要从中找出有效因子，一个有效而合适的测试方法必不可少。


    目前最常用的就是因子 IC 的计算方法。因子 IC 法来自于多因子模型的打分法，指的是选用若干能够对股票未来时间段收益产生预测作用的因子，根据每个因子在对应位置的状况给出股票在该位置上的得分，然后按照一定的权重将各个因子的得分相加，从而得到该股票各个因子的最终得分。


    因此可以看到，在打分模型中，各个因子的权重设定和计算非常重要，即使是非常好的因子，在权重配置下也可能会有不好的结果。


    IC 的计算公式如下：


    ```

    r12 = (∑_{k=1}^{n} (x_{1k} - x̄1)(x_{2k} - x̄2)) / sqrt( ∑_{k=1}^{n} (x_{1k} -
    x̄1)^2 ∑_{k=1}^{n} (x_{2k} - x̄2)^2 )

    ```


    从公式中可以看到，IC 的计算公式实际上就是不同序列的相关系数的计算，那么 IC 值的计算用一句话解释就是：“IC 值为因子与对应的下期收益率之间的关系”。下面通过
    Python 对 IC 进行计算。假设不同的股票在某个时间段对应的因子值和下期的收益率如表 6-1 所示。


    # 表 6-1 股票因子与收益率表


    | | 因子 A | 因子 B | 下期收益率 |

    |---|---|---|---|

    | 股票 a | 6 | 2 | 0.02 |

    | 股票 b | 1 | 4 | 0.004 |

    | 股票 c | 2 | 8 | 0.005 |

    | 股票 d | 7 | 9 | 0.007 |


    读者可以手动计算此时的 IC 值，但是 Python 中的 NumPy 工具包提供了更为方便的计算方法，即 corrcoef 函数：


    ```

    corr = np.corrcoef()

    ```


    完整代码如下：'
