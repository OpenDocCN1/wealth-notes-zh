    \n人脑处理信息的能力是有限的，当一个资本市场只有 100 只股票时，对定性投资基金经理是有优势的，他可以深刻分析这 100 家公司。但在一个很大的资本市场，比如有成千上万只股票的时候，强大的定量投资的信息处理能力能反映它的优势，捕捉更多的投资机会，拓展更大的投资机会。\n\
    \n## 3. 套利思想\n\n定量投资正是在找估值洼地，通过全面、系统性的扫描捕捉错误定价、错误估值带来的机会。定性投资经理大部分时间在琢磨哪一个企业是伟大的企业，哪个股票是可以翻倍的股票；与定性投资经理不同，定量基金经理大部分精力花在分析哪里是估值洼地，哪一个品种被低估了，买入低估的，卖出高估的。\n\
