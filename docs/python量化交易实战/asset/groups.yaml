    \n# 2. algo 函数\n\nalgo 是回测框架的主要算法框架，这里定义了每个时间周期需要进行的策略的主要内容。在本策略中，为了简单起见，首先在每个\
    \ frequency（设定的策略运行周期）上进行清仓操作，之后获取当前时间段的上证 50 成分股，下一步获取成分股对应的因子数据，之后对因\n"
  mdcn: "\n```\ndef algo(context):\n\n    global lookBackDays\n\n    today = context.now\n\
    \    last_day = get_previous_trading_date(\"SZSE\",today)\n\n    data = history_n(symbol=context.symbol,\
    \ frequency = context.frequency,\ncount=int(lookBackDays),\n        end_time=last_day,\
    \ fields=context.fields,\n        fill_missing=\"last\", adjust=ADJUST_PREV, df=True)\n\
    \n    close = np.asarray((data[\"close\"].values))\n    high = np.asarray((data[\"\
    high\"].values))\n    low = np.asarray((data[\"low\"].values))\n\n    todayVolatility\
    \ = np.std(close)\n    yesterDayVolatility = np.std(close[:-1])\n    deltaVolatility\
    \ = (todayVolatility - yesterDayVolatility) / todayVolatility\n\n    lookBackDays\
    \ = np.round(lookBackDays * (1 + deltaVolatility))\n    lookBackDays = np.min([lookBackDays,context.ceilingAmt])\n\
    \    lookBackDays = np.max([lookBackDays,context.floorAmt])\n\n    MidLine = np.average(close)\n\
    \    Band = np.std(close)\n\n    upBand = MidLine + context.bolBandTrig * Band\n\
    \    lowBand = MidLine - context.bolBandTrig * Band\n\n    buyPoint = np.max(high)\n\
    \    sellPoint = np.min(low)\n    current_data = current(symbols= context.symbol)\n\
    \    current_price = current_data[0][\"price\"]\n\n    if ((close[-1] > upBand)\
    \ and (current_price > buyPoint)):\n        order_percent(symbol=context.symbol,\
    \ percent=1,\nside=OrderSide_Buy,position_effect = PositionEffect_Open ,\norder_type=OrderType_Market,\
    \ price=0)\n\n    if ((close[-1] < lowBand) and (current_price < sellPoint)):\n\
    \        order_percent(symbol=context.symbol, percent=0,\nside=OrderSide_Sell,position_effect\
    \ = PositionEffect_Open ,\norder_type=OrderType_Market, price=0)\n\nif __name__\
    \ == \"__main__\":\n```\n\n```\nrun(\n    strategy_id='c08eed5a-00c2-11e8-9308-902b3463caf1',\n\
    \    filename='Dynamic_Breakout_II.py',\n    mode=MODE_BACKTEST,\n    token='********************************',\n\
    \    backtest_start_time='2017-01-01 09:00:00',\n    backtest_end_time='2017-12-31\
    \ 15:00:00',\n    backtest_initial_cash=20000,\n    backtest_adjust=ADJUST_PREV\n\
    )\n```\n\n具体回测请读者自行完成。\n\n# 5.5 小结\n\n本章介绍了 Talib 的基本使用方法，Talib 是金融分析中最常用的技术分析指标工具，通过图表或技术指标的记录研究市场过去及现在的行为反应，以推测未来价格的变动趋势。\n\
    \n但是从更深一个层次来说，仅依靠技术分析指标对走势做出预测并不可行，因为决定一个公司股票价格的最终因素是其内在的价值，而技术分析只关心证券市场本身的变化，不考虑会对其实产生某种影响的经济方面、政治方面等各种外部的因素。\n\
    \n后续的介绍将以基本面分析为主，这也是本书的重点。\n\n# 第 6 章\n\n# ◁ 多因子策略 ▷\n\n技术分析与基本面分析是股票价格分析最基础也是最经典的两个部分。\n\
    \n技术分析是针对股票的特定走势与价格趋势做出分析策略，主要根据某个特定时间段的开盘价、收盘价、最高价与最低价以及特定时间段的成交量等基本因素做出分析结果。\n\
    \n基本面分析是基于公司本身的素质，对影响公司估价走势的基本因子进行处理和排序，生成可以被量化统计的结果数据。\n\n# 6.1 一个奇怪的问题\n\n为什么要“买买买”（见图\
    \ 6-1）？\n\n![](img/66b32d04cb77b904cead314891984c93_110_0.png)\n\n图 6-1 买买买\n\n\
    相信读者在买东西之前一定会综合考虑要买的这个东西的形状大小、颜色类型甚至是重量是否符合自己的要求。也就是说，读者在最终决定要买卖一个商品之前，一定会认真比较某个商品的某些特点，还有可能会列出不同的备选方案，从而最终决定买入哪个商品。\n\
    \n那么有一个非常奇怪的问题，为什么大多数人在买入一只股票的时候都没有任何思考的过程，甚至是在一秒钟之内就做出了买卖的决定呢？\n\n下面将给出解释。\n\n\
    # 6.1.1 因子是什么\n\n因子是什么？\n\n通俗地说，因子就是在选择一只股票时，能够帮助你做出决定的一个因素。例如，如果你觉得净利润增长率大于 25%的公司就是一个好公司，那么只需要关注净利润增长率大于\
    \ 25%的公司即可。这个净利润增长率大于 25%就是因子。\n\n这只是举一个例子，真正影响公司股价、推动资金进入和股价波动的因子是各种各样的，有基本面、消息面、政策面以及关于研报和分析师预测的预期等。\n\
    \n下面举例来说，对于国内 A 股，长时间能够表现出色的因子主要有哪些。\n\n# 1. 规模因子：小市值因子\n\n无论是在 A 股市场，还是港台以及欧美市场，小市值因子一直存在，并且小市值因子的逻辑很简单易懂。市值越小，其操纵涨跌所需要的资金越少，股票被操纵的可能性就越大。\n\
    \n# 2. 技术因子：动量反转因子\n\n动量反转因子是典型的技术因子，指的是单个标的涨跌幅度的反转效应明显。简单地说，就是涨得多了就要跌，跌得多了就要涨，远离要回归，价格归于价值。这个其实就是在股市里说的补涨补跌。\n\
    \n# 3. 预测因子：预测收入的因子\n\n预测因子指的是能够预测下一个财务周期的各种因子。预测收入增长的越高越好，净利润增长的越高越好，支出费用越低越好。这些都是能够帮助决定股价的一些因子。\n\
    \n一般来说，因子包括 9 类，即规模因子、估值因子、成长因子、盈利因子、动量反转因子、交投因子、波动因子、股东因子、一致性预测因子。\n\n- 规模因子，如总市值、流通市值、自由流通市值。\n\
    - 估值因子，如市盈率（TTM）、市净率、市销率、市现率、企业价值倍数。\n- 成长因子，如营业收入同比增长率、营业利润同比增长率、归属于母公司的净利润同比增长率、经营活动产生的现金流金额同比增长率。\n\
    - 盈利因子，如净资产收益率（ROE）、总资产报酬率（ROA）、销售毛利率、销售净利率。\n- 动量反转因子，如前一个月涨跌幅、前 2 个月涨跌幅、前 3\
    \ 个月涨跌幅、前 6 个月涨跌幅。\n- 交投因子，如前一个月日均换手率。\n- 波动因子，如前一个月的波动率、前一个月的振幅。\n- 股东因子，如户均持股比例、户均持股比例变化、机构持股比例变化。\n\
    - 一致性预测因子，如研报或者分析师预测当年净利润增长率、主营业务收入增长率、最近一个月预测净利润上调幅度、最近一个月预测主营业务收入上调幅度、最近一个月上调评级占比。\n\
    \n# 6.1.2 选取因子\n\n最简单的方法是选取一些自己喜欢的因子，比如前面所说的增长率、市值、营业收入等，一个一个计算不同因子的收益，看看效果如何，效果好就留下，效果不好则剔除，再选择下一个。\n\
    \n下面就以前面所说的净利润增长率为基础做出因子的效果表现。\n\n# 1. 从表中提取因子\n\n对于读者使用掘金量化来说，选取因子的第一步就是从掘金量化所提供的财务数据表（掘金量化主界面→帮助中心→数据文档）中抽取特定的数据。掘金量化提供了特定的财务因子代码供选取，代码如下：\n\
