    可以看到，ADX 函数在常规的 high、low、close 参数后面还有更多的参数可以输入，这和 5.1 节的 MACD 类似，可以对不同的时间函数进行设定。这里默认的
    timeperiod 为 14。


    AD 为资金趋势函数，向上的 A/D 表明买方占优势，而向下的 A/D 表明卖方占优势。AD 与价格的背离可视为买卖信号，即底背离考虑买入，顶背离考虑卖出。


    ## 【程序 5-7】


    ```

    from gm.api import *

    import talib

    import numpy as np

    import matplotlib.pyplot as plt


    set_token("9e02621e7fcf850731def2e8a9de1fdbd5b21ad6")


    data = history_n(symbol="SZSE.002310",frequency="1d",count=100,end_time="2017-12-31",fields="high,low,close,open,volume",fill_missing="last",adjust=ADJUST_PREV,df=True)


    close = np.asarray(data["close"].values)

    open = np.asarray(data["open"].values)

    high = np.asarray(data["high"].values)

    low = np.asarray(data["low"].values)

    volume = np.asarray(data["volume"].values).astype(np.double)


    adx = talib.ADX(high,low,close)

    adx = np.nan_to_num(adx)

    adx = adx/np.max(adx)


    ad = talib.AD(high,low,close,volume)

    ad = np.nan_to_num(ad)

    ad = ad/np.max(ad) + 20

    plt.plot(ad,"r",adx,"b")

    plt.show()

    ```


    【程序 5-7】中，首先获取了对应股票的数据集，之后使用 NumPy 库包将其提取，对提取后的数据进行命名，输入到 ADX 与 AD 函数中进行计算。最终显示结果如图
