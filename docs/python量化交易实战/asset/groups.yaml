  - "[PAGE 262]\n\n那么什么是差分呢？很难吗？\n\n“差分法”就是序列后一点的值减去当前点的值，用公式表示为 yₜ-y₍ₜ₋₁₎。值得注意的是，每一次差分之后，都会少一个序列值。\n\
