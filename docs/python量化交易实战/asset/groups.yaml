    \ 计算 softmax 函数\n\n对于 Python 科学计算来说，最简单的想法就是可以将数学公式直接表达成程序语言，可以说，Python 满足了这个想法。本小节将使用\
    \ Python 实现和计算一个深度学习中最为常见的函数——softmax 函数。至于这个函数的作用现在不加以说明，这里只是带领读者尝试实现其程序的编写。\n\
    \nsoftmax 计算公式如下：\n\n$s_i = \\frac{e^{v_i}}{\\sum_{0}^{j} e^{v_i}}$\n\n其中 $V_i$\
    \ 是长度为 $j$ 的数列 $V$ 中的一个数，带入 softmax 的结果其实就是先对每一个 $V_i$ 取 e 为底的指数计算变成非负，然后除以所有项之和进行归一化，之后每个\
    \ $V_i$ 就可以解释成观察到的数据 $V_i$ 属于某个类别的概率，或者称作似然（Likelihood）。\n\n示 softmax 用以解决概率计算中概率结果大占绝对优势的问题。例如，函数计算结果中，两个值\
    \ a 和 b，且 a>b，如果简单地以值的大小为单位衡量的话，那么在后续的使用过程中，a 永远被选用，而 b 由于数值较小而不会被选择，但是有时候也需要数值小的\
    \ b 被使用，softmax 就可以解决这个问题。\n\nsoftmax 按照概率选择 a 和 b，由于 a 的概率值大于 b，在计算时 a 经常会被选择，而\
    \ b 由于概率较小，选择的可能性也较小，但是也有概率被选择。\n\n公式 softmax 的代码如下：\n\n```\nimport numpy\ndef\
    \ softmax(inMatrix):\n    m,n = numpy.shape(inMatrix)\n    outMatrix = numpy.mat(numpy.zeros((m,n)))\n\
    \    soft_sum = 0\n    for idx in range(0,n):\n        outMatrix[0,idx] = math.exp(inMatrix[0,idx])\n\
    \        soft_sum += outMatrix[0,idx]\n    for idx in range(0,n):\n        outMatrix[0,idx]\
    \ = outMatrix[0,idx] / soft_sum\n    return outMatrix\n```\n\n可以看到，当传入一个数列后，分别计算每个数值所对应的指数函数值，之后将其相加后，计算每个数值在数值和中的概率。\n\
    \n```\na = numpy.array([[1,2,1,2,1,1,3]])\n```\n\n结果如下：\n\n[[ 0.05943317  0.16155612\
