    # 第 1 章


    # ◁ 走进量化投资 ▷


    “量化”这个词来自于数字图像处理，指的是把经过抽样得到的瞬时值进行幅度离散，即用一组规定的电平把瞬时抽样值用最接近的电平值表示出来，如图 1-1 所示。经过抽样的图像只是在空间上被离散成像素（样本）的阵列。而每个样本灰度值还是一个有无穷多个取值
    的连续变化量，必须将其转化为有限个离散值，赋予不同码字才能真正成为数字图像。这种转化称为量化。


    ![](img/66b32d04cb77b904cead314891984c93_11_0.png)


    图 1-1 量化——数字信号处理


    而将量化用于投资的历史已经无法追溯。从“按数据买股票的第一个人”依照自己的判断听取“卖股票的人”介绍想要推销标的的盈利和增长状况时，量化已经产生。投资人依照自己的认知和对数据的掌握做出买卖决定的想法，就是量化的雏形。


    # 1.1 量化投资的诞生背景


    接触过资本市场的人，大都听说过基本面投资和价值投资，这方面的天才人物“股神”巴菲特更是几乎家喻户晓，妇孺皆知。他以企业财务报表的分析见长，擅长挖掘企业的内在价值，一旦买入便长期持有，持续获得稳定高额收益，为股东创造了丰厚利润，无人能及。


    但并不是人人都能成为巴菲特，那需要长时间的认知积累、敏锐的判断和丰富的经验。20 世纪 90 年代，使用量化工具进行股票和期货买卖的西蒙斯（见图 1-2）横空出世，不久就'
  - '[PAGE 12]


    被称为最能赚钱的基金经理人，在 20 年的时间里，他创造了年均净回报率高达 35%的惊人传奇，而他使用的就是量化投资技术。


    ![](img/66b32d04cb77b904cead314891984c93_12_0.png)


    图1-2 詹姆斯·西蒙斯


    但是，没有前期来自象牙塔的现代金融理论，没有其他大师的相关研究，便没有量化投资的兴起，西蒙斯的成功也就无从谈起。


    夏普 1963 年 1 月提出了“投资组合的简化模型”，一般称为“单一指数模型”。1964 年，夏普又发展出了资本资产定价模型（CAPM），这是他最重要的突破，这个模型不仅可以作为预测风险和预期回报的工具，还可以衡量投资组合的绩效，以及衍生出在指数型基金、企业财务和企业投资、市场行为和资产评价等多领域的应用和理论创新。


    1976 年，罗斯在 CAPM 的基础上提出了“套利定价理论”（APT），提供一个方法评估影响股价变化的多种经济因素。布莱克和斯克尔斯提出了“期权定价理论”。莫顿则发明了“跨期的资本资产定价模型”。


    有趣的是，不少人最初并非经济学家，如巴契里耶和布莱克原先是数学家，夏普则从事医学，奥斯伯恩为天文学家，沃金与坎德尔是统计学家，而特雷诺则是数学家兼物理学家。他们转行都是因为被金融市场研究深深吸引，沉迷于其中的无穷魅力。


    量化投资不会出现在个人投资者为主的时代。个人投资者既缺乏闲暇的时间，也普遍无此技术能力。同时随着退休基金和共同基金资产的大幅增加，财富基金逐渐取代个人投资者成为市场上的主要投资者，并委托专业机构进行投资管理和操作。管理大规模资产需要新的运作方式和金融创新技术，同时专业的投资管理人也有能力和精力专注地研究、运用这些技术。


    没有发达的电脑技术，量化投资将成为无源之水，无本之木。在电脑革命发生前，根本无法根据上述模型进行运算。1961 年，获得 1990 年诺贝尔奖的夏普曾说，当时即使是用
    IBM 最好的商用电脑，解出含有 100 只证券的问题也需要 33 分钟。当今，面对数不胜数的证券产品以及庞大的成交量，缺少了先进电脑的运算速度和容量，许多复杂的证券定价甚至'
  - '[PAGE 13]


    不可能完成。


    1973~1974 年，美国债券市场和股票市场全面崩盘，明星基金经理人烟消云散，财富缩水堪比 30 年代大萧条时期。当时，颇有先见的投资顾问兼作家彼得·伯恩斯坦认为，必须采用更好的方法管理投资组合，因此他创办了《投资组合》杂志，一出刊便获得成功。此后，随着
    80 年代以来各类证券和期权类产品的丰富和交易量的大增，量化投资光彩炫目，但它同时也具有魔鬼般的力量。


    1987 年 10 月大股灾，黑色星期一，当天股市和期货成交量高达令人吃惊的 410 亿美元，价值瞬间缩水 6000 亿美元。很多股份直接通过电脑而不是经由交易所交易。一些采用投资组合保险策略的公司，在电脑模式的驱使下，不问价格，机械地卖出股票。很多交易员清楚这些投资组合会有大单卖出，宁愿走在前面争相出逃，加剧了恐慌。针对整个投资组合而非单个证券，机械式的交易、电脑的自动操作使得这种量化投资出现助跌之效，大量的空单在瞬间涌出，将市场彻底砸垮。


    虽然麻烦不断，但量化投资依然必要且有效。要知道，在金融危机发生前，量化基金的表现连续 8 年超过其他投资方式。当然，挫折也会带来量化投资技术的更新和完善，比如在模型中设定新的变量，尤其是加入以往并未包含的宏观经济参数。时过境迁，从
    2017 年开始，量化基金再次表现优异。虽然量化投资能否就此再度复兴仍属未知，一旦趋势形成就会不可逆转，量化投资依然拥有光明的未来。


    # 1.2 量化投资的特点


    量化投资并非只可远观而不可<|start|>玩，在本质上它和传统投资是相同的，二者都是基于市场非有效或弱有效的理论基础之上，而投资经理可以通过对个股估值、成长等基本面的分析研究建立战胜市场，产生超额收益的组合。不同的是，传统投资管理较依赖对上市公司的调研，以及基金经理个人的经验及主观的判断，而定量投资管理则是“定性思想的量化应用”，更加强调数据。


    量化投资有以下几个优点：


    +   1. 纪律性


    所有的决策都是依据模型做出的。量化投资中一般有三个模型：


    +   ○ 大类资产配置模型，根据大类资产配置决定股票和债券的投资比例。

    ○ 行业模型，按照行业配置模型确定超配或低配的行业。

    ○ 股票模型，依靠股票模型挑选股票。


    纪律性首先表现在依靠模型和相信模型，每一天决策之前，首先要运行模型，根据模型的运行结果进行决策，而不是凭感觉。


    可能有读者会提出疑问，模型出错怎么办？不可否认，模型可能出错，就像医生可能误'
