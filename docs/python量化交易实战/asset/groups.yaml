    # 图 10-2 CAPM 中的 Beta 值


    理论上来说，一个风险投资者需要得到的溢价可以通过 CAPM 计算出来。换句话说，我们可以通过 CAPM 知道当前股票的价格是否与其回报相吻合。


    但是事实上，在计算某些股票时，由于缺乏历史数据，其 Beta 值不易估计。此外，由于经济不断发展变化，各种证券的 Beta 值也会产生相应的变化，依靠历史数据估算出的
    Beta 值对未来的指导作用也要打折扣。因此，Beta 值的计算有时候难以确认。


