    间的回归方程，并将回归方程作为预测模型，根据自变量在预测期的数量变化来预测因变量关系，大多表现为相关关系。因此，回归分析预测法是一种重要的市场预测方法。


    当对股市或者其他金融市场现象未来的发展状况和水平进行预测时，如果能将影响预测对象的主要因素找到，并且能够取得其数量资料，就可以采用回归分析预测法进行预测。回归分析预测法是一种具体的、行之有效的、实用价值很高的常用预测方法，多用于中短期预测。


    # 9.1.1 回归法简介


    在处理测量数据时，经常要研究变量之间的关系。变量之间的关系一般分为两种，一种是完全确定关系，即函数关系；另一种是相关关系，即变量之间既存在着密切联系，但又不能由一个或多个变量的值求出另一个变量的值。


    例如，学生对于高等数学、概率与统计、普通物理的学习，会对统计物理的学习产生影响，它们虽然存在着密切的关系，但很难从前几门功课的学习成绩来精确地求出统计物理的学习成绩。对于彼此联系比较紧密的变量，人们总希望建立一定的公式，以便变量之间互相推测。回归分析的任务就是用数学表达式来描述相关变量之间的关系。


    +   ○ 多元回归是指一个因变量（预报对象）、多个自变量（预报因子）的回归模型。基本方法是根据各变量的值算出交叉乘积和。


    +   ○ 这种包括两个或两个以上自变量的回归称为多元回归。应用此方法可以加深对定性分析结论的认识，并得出各种要素间的数量依存关系，从而进一步揭示出各要素间内在的规律。


    +   ○ 一般来说，多元回归过程能同时提供多个备选的函数关系式，并提供每个关系式对实验数据的理解能力，研究者可以结合自己的理论预期，据此做出选择。


    回归分析预测法有多种类型。依据相关关系中自变量的个数不同进行分类，可分为一元回归分析预测法和多元回归分析预测法。在一元回归分析预测法中，自变量只有一个，而在多元回归分析预测法中，自变量有两个以上。依据自变量和因变量之间的相关关系不同，可分为线性回归预测和非线性回归预测。


    # 9.1.2 一元线性回归


    回归分析只涉及两个变量的，称一元回归分析（见图 9-2）。一元回归的主要任务是根据两个相关变量中的一个变量去估计另一个变量，被估计的变量称为因变量，可设为
    Y；估计出的变量称为自变量，设为 X。回归分析就是要找出一个数学模型 Y=f(X)，使得从 X 估计 Y 可以用一个函数式去计算。'
  - '[PAGE 187]


    ![](img/66b32d04cb77b904cead314891984c93_187_0.png)


    图 9-2 一元线性回归


    当 Y=f(X)的形式是一个直线方程时，称为一元线性回归。这个方程一般可表示为 Y=A+BX。根据最小平方法或其他方法，可以从样本数据中确定常数项 A 与回归系数
    B 的值。A、B 确定后，有一个 X 的观测值，就可得到一个 Y 的估计值。回归方程是否可靠，估计的误差有多大，都要经过显著性检验和误差计算。有无显著的相关关系以及样本的大小等，是影响回归方程可靠性的因素。


    # 一元线性回归方程的形式


    如果只有一个自变量 X，而且因变量 Y 和自变量 X 之间的数量变化关系呈近似线性关系，就可以建立一元线性回归方程，由自变量 X 的值来预测因变量 Y 的值，这就是一元线性回归预测。


    如果因变量 Y 和自变量 X 之间呈线性相关，也就是说，对于自变量 X 的某一个值，因变量 Y 对应的取值不是唯一确定的，而是有很多可能的取值，它们分布在一条直线的上下，这是因为
    Y 还受除自变量以外的其他因素的影响。这些因素的影响大小和方向都是不确定的，通常用一个随机变量（记为ε）来表示，也称为随机扰动项。于是，Y 和 X 之间的依存关系可表示为：


    y = a + βx + ε


    上面就是总体的一元线性回归模型。其中 α β 是常数。随机扰动项 ε 是无法直接观测的随机变量。一般为了便于求解，将上述公式表示为：


    y = a + bx


    a 和 b 分别为总体回归方程参数 α β 的估计量，a 是样本回归方程的常数项，也就是样本回归直线在 Y 轴上的截距，表示除自变量 X 以外的其他因素对因变量
    Y 的平均影响量；b 是样本回归系数，即样本回归直线的斜率，表示自变量 X 每增加一个单位，因变量 Y 的平均增加量。'
