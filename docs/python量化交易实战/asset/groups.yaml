    设想道士有一天和道友一起到一座不太熟悉的山上去玩，在兴趣盎然中很快登上了山顶。但是天有不测，下起了雨。如果这时需要道士和其同来的道友以最快的速度下山，那么怎么办呢？


    最好的办法是顺着坡度最陡峭的地方走下去。但是由于不熟悉路，道士在下山的过程中，每走过一段路程，就需要停下来观望，从而选择最陡峭的下山路。这样一路走下来的话，可以在最短时间内走到底。


    图 9-6 中的路线可以近似地表示为：


    ① → ② → ③ → ④ → ⑤ → ⑥ → ⑦


    每个数字代表每次停顿的地点，这样只需要在每个停顿的地点选择最陡峭的下山路即可。


    这就是道士下山的 phrases。随机梯度下降算法与此类似，如果想要使用最迅捷的方法，最简单的办法就是在下降一个梯度的阶层后，寻找一个当前获得的最大坡度继续下降。这就是随机梯度算法的原理。


    从上面的例子可以看出，随机梯度下降算法就是不停地寻找某个节点中下降幅度最大的那个趋势进行迭代计算，直到将数据收缩到符合要求的范围为止。通过数学公式计算的话，公式如下：


    ```

    f(θ) = θ0 x0 + θ1 x1 + … + θn xn = Σ θi xi

    ```


    前面介绍最小二乘法的时候，说明了直接求解最优化变量的方法，也介绍了在求解过程中的前提条件是要求计算值与实际值的偏差的平方最小。


    但是在随机梯度下降算法中，对于系数需要不停地求解出当前位置下最优化的数据。通过数学方式表达的话，就是不停地对系数 θ 求偏导数，公式如下：


    ```

    ∂/∂θ f(θ) = ∂/∂θ 1/2 Σ (f(θ) - yi)2 = (f(θ) - y) xi

    ```


    公式中，θ 会向着梯度下降最快的方向减少，从而推断出 θ 的最优解。


    因此，可以说随机梯度下降算法最终被归结为通过迭代计算特征值从而求出最合适的 Renewal 值。θ 求解的公式如下：'
  - '[PAGE 195]


    θ = θ - α(f(θ) - y_i) x_i


    公式中，α 是下降系数，用较为通俗的话表示就是用以计算每次下降的幅度大小。系数越大，每次计算中的差值越大，而系数越小，差值越小，但是计算时间也相对延长。


