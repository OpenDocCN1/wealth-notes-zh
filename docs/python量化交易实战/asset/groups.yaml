    \ = d_value\n\nreturn d_value_dict\n```\n\n因子 IC（信息系数）代表因子预测股票收益的能力。IC 具体为全部股票在调仓周期期初的排名和本调仓周期收益排名的线性相关度。IC\
    \ 的均值是多个调仓周期 IC 的平均值。\n\nIC 越大，表明是排名越靠前的股票，未来收益排名也越靠前。IC 的理论最大值为 1，但对于多时间段的 IC\
    \ 均值来说，当其值大于 0.05 时，就可以认为因子是有效的阿尔法因子，大于 0.1 时，就可以认为因子是特别好的阿尔法因子。当 IC 均值接近 0 时，因子可被认为是无效因子。当\
    \ IC 均值小于-0.05 时，因子可以被认为是反向有效因子，只要将排名次序颠倒过来，因子就是正向的阿尔法因子。简而言之，IC 均值的绝对值越大，因子越有效。\n\
    \n因子 IR（信息比率）代表因子在历史上表现的稳定性，公式如下：\n\n```\nIR = IC_mean / IC_std\n```\n\n因子在不同历史时期的表现有可能差别很大，有的时候表现得很好，有的时候表现得很差，表现在\
    \ IC 上，就是 IC 的波动率很大。假设 IC 均值一定，IC 的波动率越小，因子表现得越稳定，IR 就越大。\n\n## 6.2.3 因子 IC 值计算的目标，等权法因子值的合成\n\
    \n对于单个因子的测试来说，直接使用掘金程序进行测试即可，如果回测人员觉得有必要选用更多的因子一起更新使用的内容的话，需要对因子进行合成，生成一个新的数量因子。\n\
    \n对于选定的因子，最常用的方法是按等权重进行合成，如表 6-2 所示。\n\n## 表 6-2 股票多因子与收益率表\n\n|  | 因子 A | 因子\
    \ B | 因子 C | 下期收益率 |\n|---|---|---|---|---|\n| 股票 a | 6 | 2 | 1 | 0.02 |\n| 股票\
    \ b | 1 | 4 | 5 | 0.004 |\n| 股票 c | 2 | 8 | 6 | 0.005 |\n| 股票 d | 7 | 9 | 2 |\
    \ 0.007 |\n\n表 6-2 在表 6-1 的基础上做了修改，增加了一个因子 C。下面根据不同的值计算对应的 IC 值。其代码如下：\n\n###\
    \ 【程序 6-5】\n\n```\nimport numpy as np\n```\n\n```\nfactor_A = [6,1,2,7]\nfactor_B\
    \ = [2,4,8,9]\nfactor_C = [1,5,6,2]\nreturn_profit = [0.02,0.004,0.005,0.007]\n\
    ```\n\n```\ncorr = np.corrcoef(factor_A,return_profit)\nprint(\"factor_A:\",corr[0][1])\n\
    ```\n\n```\ncorr = np.corrcoef(factor_B,return_profit)\nprint(\"factor_B:\",corr[0][1])\n\
    ```\n\n```\ncorr = np.corrcoef(factor_C,return_profit)\nprint(\"factor_C:\",corr[0][1])\n\
    ```\n\n打印结果如下：\n\n```\nfactor_A: 0.593641001409\nfactor_B: -0.651000828374\nfactor_C:\
    \ -0.790625442073\n```\n\n可以看到对应不同的因子值，其IC值也不相同，因子 A 的 IC 值约为 0.59，而因子 B 和因子 C\
    \ 对应的 IC 值约为 -0.65 和 -0.79 。此时，因子 B 和因子 C 被视为反向因子，因此在选取时需要对其进行辨别。\n\n如果从表中的 3\
    \ 个因子中选出两个组成一个新的因子，根据上面的计算方法，选择因子 A 和因子 C 是最为合适的。需要注意的是，由于因子 C 是负相关的，因此在计算时需要将其转成正值计算，代码如下：\n\
    \n```\nfactor_total = np.asarray(factor_A) + np.asarray(factor_C) * -1\n```\n\n\
    这里 factor_A 与 factor_C 共同组成了一个新的因子，factor_total：\n\n```\n[ 5 -4 -4  5]\n```\n\n\
    下面计算新的因子与收益率之间的 IC 值，代码如下：\n\n```\nfactor_total = np.asarray(factor_A) + np.asarray(factor_C)\
    \ * -1\n\ncorr = np.corrcoef(return_profit,factor_total)\nprint(corr[0][1])\n\
    ```\n\n打印结果如下：\n\n```\n0.69853547\n```\n\n可以看到，相较于单独的因子 A，因子 A 和因子 C 合成的因子，其 IC\
    \ 值正向增加了 0.1，因此可以认为合成的因子能够提高对收益率的反映。\n\n> 意 这里选用等权法进行计算，由于因子 A 是正相关的，可以认为值越大越好，其权值为\
    \ +1；而由于因子 C 为负相关的，可以认为对收益率的影响越小越好，从而权值被设定为 -1。至于在计算多因子时到底是越大越好还是越小越好，需要综合认定和对最终结果的判定，一定要在一个模型中统一判断标准。\n\
    \n在前面 6.1 节已经介绍了，除了基本面因子外，还可以根据不同的条件生成各种有代表性的因子，这点在下一节会介绍。\n\n## 6.3 实战：基于成长因子的模型测试\n\
    \n成长模型是一种以公司未来成长为基础的选股模型。\n\n成长投资理论由现代投资理论的开路先锋之一，Philip A.Fisher（费雪）最早提出，他在1959\
    \ 年的名著《怎样选择成长股》中对该投资理念进行了详细阐述，解释了成长股的标准、如何寻找成长股、怎样把握时机获利等一系列重要的问题，为广大投资者称道。\n\n\
    在实际操作中，成长型投资通常是在对经济周期和行业景气分析的基础上，结合股票基本面情况，包括收益率和增长率等属性的分析，来评估和选择成长型股票。\n\n在量化形式上，成长型投资主要是通过\
    \ ROE、ROA、ROIC、营业收入增长率、主营业务利润率等参数来挖掘成长性相对更高的股票。\n\n## 6.3.1 模型说明\n\n以 ROIC-NPG\
    \ 两个指标来构建成长模型。根据我们对各项指标的重新梳理，现将 ROIC 列为质量指标，另外构建包括 EBITG（息税前收益增长率）、NPG（净利润增长率）、MPG（主营利润增长率）、GPG（毛利润增长率）、OPG（营业利润增长率）、OCG（经营现金流增长率）、NAG（净资产增长率）、EPSG（每股收益增长率）、ROEG（净资产收益率增长率）、GMPG（毛利率增长率）10\
    \ 个考核公司成长能力的指标。\n\n### 1. 因子的构建形式\n\n在多因子计算的初始，需要建立一个能够存储因子的矩阵，Python 中对于矩阵的建立，一般使用的是\
