    # 6.1.1 因子是什么


    因子是什么？


    通俗地说，因子就是在选择一只股票时，能够帮助你做出决定的一个因素。例如，如果你觉得净利润增长率大于 25%的公司就是一个好公司，那么只需要关注净利润增长率大于
    25%的公司即可。这个净利润增长率大于 25%就是因子。


    这只是举一个例子，真正影响公司股价、推动资金进入和股价波动的因子是各种各样的，有基本面、消息面、政策面以及关于研报和分析师预测的预期等。


    下面举例来说，对于国内 A 股，长时间能够表现出色的因子主要有哪些。


    # 1. 规模因子：小市值因子


    无论是在 A 股市场，还是港台以及欧美市场，小市值因子一直存在，并且小市值因子的逻辑很简单易懂。市值越小，其操纵涨跌所需要的资金越少，股票被操纵的可能性就越大。


    # 2. 技术因子：动量反转因子


    动量反转因子是典型的技术因子，指的是单个标的涨跌幅度的反转效应明显。简单地说，就是涨得多了就要跌，跌得多了就要涨，远离要回归，价格归于价值。这个其实就是在股市里说的补涨补跌。


    # 3. 预测因子：预测收入的因子


    预测因子指的是能够预测下一个财务周期的各种因子。预测收入增长的越高越好，净利润增长的越高越好，支出费用越低越好。这些都是能够帮助决定股价的一些因子。


    一般来说，因子包括 9 类，即规模因子、估值因子、成长因子、盈利因子、动量反转因子、交投因子、波动因子、股东因子、一致性预测因子。


    +   - 规模因子，如总市值、流通市值、自由流通市值。

    - 估值因子，如市盈率（TTM）、市净率、市销率、市现率、企业价值倍数。

    - 成长因子，如营业收入同比增长率、营业利润同比增长率、归属于母公司的近利润同比增长率、经营活动产生的现金流金额同比增长率。

    - 盈利因子，如净资产收益率（ROE）、总资产报酬率（ROA）、销售毛利率、销售净利率。

    - 动量反转因子，如前一个月涨跌幅、前 2 个月涨跌幅、前 3 个月涨跌幅、前 6 个月涨跌幅。

    - 交投因子，如前一个月日均换手率。

    - 波动因子，如前一个月的波动率、前一个月的振幅。

    - 股东因子，如户均持股比例、户均持股比例变化、机构持股比例变化。

    - 一致性预测因子，如研报或者分析师预测当年净利润增长率、主营业务收入增长率、最近一个月预测净利润上调幅度、最近一个月预测主营业务收入上调幅度、最近一个月上调评级占比。'
