    ## 3.1 从小例子起步——NumPy 的初步使用\n\n从小例子起步，本节将介绍 NumPy 的基础使用。\n\n### 3.1.1 数据的矩阵化\n\n\
    对于数据处理来说，数据是一切的基础。而一切数据又不是单一存在的，其构成往往由很多的特征值决定。表 3-1 是用以计算回归分析的房屋面积与价格对应表，主要参数为面积、卧室以及地下室的个数等。\n\
    \n# 表 3-1 某地区房屋面积与价格对应表\n\n| 价格（千） | 面积（平方米） | 卧室（个） | 地下室 |\n|---|---|---|---|\n\
    | 200 | 105 | 3 | 无 |\n| 165 | 80 | 2 | 无 |\n| 184.5 | 120 | 2 | 无 |\n| 116 |\
    \ 70.8 | 1 | 无 |\n| 270 | 150 | 4 | 有 |\n\n表 3-1 是数据的一般表示形式，但是对于数据处理的过程来说，这是不可辨识的数据，因此需要对其进行调整。\n\
    \n常用的数据处理表示形式为数据矩阵，即可以将表 3-1 表示为一个专门的矩阵，见表 3-2。\n\n# 表 3-2 某地区房屋面积与价格计算矩阵\n\n\
    | ID | Price | area | bedroom | basement |\n|---|---|---|---|---|\n| 1 | 200 |\
    \ 105 | 3 | False |\n| 2 | 165 | 80 | 2 | False |\n| 3 | 184.5 | 120 | 2 | False\
    \ |\n| 4 | 116 | 70.8 | 1 | False |\n| 5 | 270 | 150 | 4 | True |\n\n从表 3-2 中可以看到，一行代表一个单独的房屋价格和对应的特征属性。第一列是\
    \ ID，即每行的标签。标签是独一无二的，一般不会有重复现象。第二列是价格，一般被称为矩阵的目标。目标可以是单纯的数字，也可以是布尔变量或者一个特定的表示。表\
    \ 3-2 中的标签是房屋的 ID，是一个数字标签。第 2、3、4 列是属性值，也是标签所对应的特征值，根据此特征值的不同，每行所对应的目标也有所不同。\n\
    \n不同的 ID 用于表示不同的目标。一般来说，数据处理的最终目的就是使用不同的特征属性对目标进行区分和计算。已有的目标是观察和记录的结果，而数据处理的过程就是创建一个可进行目标识别的模型的过程。\n\
    \n建立模型的过程称为数据处理的训练过程，其速度和正确率主要取决于算法的选择，而算法是目标和属性之间建立某种一一对应关系的过程。这点在前面介绍数据处理过程的时候已经有所介绍。\n\
    \n继续回到表 3-2 的矩阵中。通过观察可知，矩阵中所包含的属性有两种，分别是数值型变量和布尔型变量。其中第 2、3、4 列是数值变量，这也是数据处理中最常使用和辨识的类型。而第\
    \ 5 列是布尔型变量，用以标识对地下室存在的判定。\n\n这样做的好处在于，数据处理在工作时是根据采用的算法进行建模的，算法的描述只能对数值型变量和布尔型变量进行处理，而对于其他类型变量的处理相对较少。即使后文有针对文字进行处理的数据处理模型，其本质也是将文字转化成矩阵向量进行处理。\n\
    \n当数据处理建模的最终目标是求得一个具体数值时，即目标是一个数字，那么数据处理建模的过程基本上可以被转化为回归问题，差别在于是逻辑回归还是线性回归。\n\n\
    对于目标为布尔型变量时，问题大多数被称为分类问题，而常用的建模方法是决策树方法。一般来说，当分类的目标是两个的时候，问题被转化为二元分类；而分类的结果多于两个的时候，分类称为多元分类。\n\
    \n许多情况下，数据处理建模和算法的设计是由程序设计和研究人员所选择的，而具体采用何种算法和模型也没有一定的要求，回归问题可以被转化为分类问题，而分类问题往往也可以由建立的回归模型解决。这点没有特定的要求。\n\
    \n### 3.1.2 数据分析\n\n对于数据来说，在进行数据处理建模之前，需要对数据进行基本的分析和处理。\n\n从图 3-1 可以看到，对于数据集来说，在进行数据分析之前，需要知道很多东西。首先需要知道一个数据集数据的多少和每个数据所拥有的属性个数，对于程序设计人员和科研人员来说，这些都是简单的事，但是对于数据处理的模型来说，是必不可少的内容。\n\
    \n![](img/66b32d04cb77b904cead314891984c93_32_0.png)\n\n除此之外，对于数据集来说，缺失值的处理也是一个非常重要的过程。最简单的处理方法是对有缺失值的数据进行整体删除。但是问题在于，数据处理的数据往往来自于现实社会，因此可能数据集中大多数的数据都会有某些特征属性缺失，而解决的办法往往是采用均值或者与目标数据近似的数据特征属性替代。有些情况替代方法可取，而有些情况下，替代或者采用均值的办法处理缺失值是不可取的，因此要根据具体情况具体处理。\n\
    \n首先从一个小例子开始介绍。以表 3-2 的矩阵为例，需要建立一个包含数据集的数据矩阵，之后可以利用不同的方法对其进行处理。代码如【程序 3-1】所示。\n\
    \n# 【程序 3-1】\n\n```\nimport numpy as np\ndata = np.mat([[1,200,105,3,False],[2,165,80,2,False],\n\
