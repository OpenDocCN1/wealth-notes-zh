    \n图 4-25 显示策略回测结果\n\n## 4.3 小结\n\n本章主要介绍使用掘金 IDE 对数据进行回测，首先使用的是掘金专用的客户端，但是这并不是作者建议的方式，建议使用专门的\
    \ PyCharm IDE 编辑器对数据进行编辑。\n\n## 第 5 章\n\n## ◀ Talib金融库使用详解 ▶\n\n工欲善其事必先利其器。\n\n\
