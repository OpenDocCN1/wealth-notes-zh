    Dual Thrust 在形式上和传统的区间突破类似。不同之处主要体现在两方面：


    +   (1) Dual Thrust 在 Range 的设置上，针对不同的标的引入前若干天的 4 个价位，使得一定时期内的 Range 相对稳定，可以适用于日间的趋势跟踪。
    (2) Dual Thrust 对不同的趋势追踪设置了不同的上轨和下轨，这里主要引入两个参数：K1 和 K2。当 K1<K2 时，买点相对容易被触发；当 K1>K2
    时，卖点相对容易被触发。


