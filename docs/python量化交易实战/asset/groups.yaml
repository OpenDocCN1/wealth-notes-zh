  - '[PAGE 253]


    # 第 11 章


    # ◁ 配对交易的魔力 ▷


    大家小时候应该都玩过跷跷板，两个小朋友分作两边，一头翘起来，一头沉下去，一头再翘起来，一头再沉下去，最后两个小朋友都玩得很approx。


    如果说股市交易有一种工具能够像跷跷板这样，有两个“跷跷板”标的，当一头的标的价格低的时候，去买入价格低的投资产品；而当买入的标的价格抬起时，卖出高价股票，买入另一头的低价股票，等待低的那头被抬起后卖出。


    可能这里的表述不是很正确，将其引申为本章的配对交易来说，就是基于两只股票的价差来盈利，对于不同的两只股票，一般而言会存在一定的价差，而由于其具有特定的相关性，股价的价差长期来看是保持一种稳定的状态。


    但是在实际市场上，由于交易员的非理性行为或者突发事件的存在，打破了这种稳定的价差。


    也就是说，两只标的（股票）的价差长期稳定，但是在某个特定事件会出现价差扩大的现象。配对交易就是利用这种价差变化的机会进行牟利，卖出相对被高估的股票，买入相对被低估的股票，等价差减少，股价波动重新趋于稳定时，结束交易并获取收益。


    配对策略是一种经典的量化交易策略，配对交易首先要找到合适的配对交易资产标的，而在筛选配对资产的过程中，需要充分掌握一些基本的统计学知识。


