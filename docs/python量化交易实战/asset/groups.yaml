    \   # 计算30,60,90日波动率,年化之\n    daily_vol = stocks_change.std()\n    annual_vol\
    \ = daily_vol * 252 ** 0.5\n    return annual_vol.values[0]\n```\n\n其主要思想是计算收益率的对数时对其进行年化处理。get_data_value\
