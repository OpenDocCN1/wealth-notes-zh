  - '缺陷一: 上证指数, 全名上海证券综合指数, 所以它天然就漏掉了在深圳证交所交易的那些股票。'
- - '####'
  - '缺陷二: 上证指数对于新发行的股票纳入期非常短。'
- - '####'
  - '缺陷三: 上证指数采用的计算方法叫做全市值加权, 而不是流通市值加权。'
- - '####'
  - '缺陷四: 作为一个全市场指数, 也就是要包含在交易所所有上市公司的指数, 上证指数几乎是“只进不出”。'
