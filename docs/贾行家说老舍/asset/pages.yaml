  md: '面对前辈高峰，我们当然要尊敬。然后呢，就是默念“不着急，不害怕，不要脸”，以自己的节奏，做好眼下事。也许，不一定什么时候，真的越过了高峰呢。


    # 本讲小结


    总结一下，关于《茶馆》创造的高峰，我觉得模仿是无法超越的，对创新最好致敬，还是创新。面对前人的压力，就是九个字“不着急，不害怕，不要脸”。


