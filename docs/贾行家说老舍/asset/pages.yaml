  md: "# **发刊词 | 为什么你一定要读老舍？**\n\n### 发刊词 | 为什么你一定要读老舍？\n\n> 老舍说北京话\n> \n> 发布\n\n\
    ![图片](占位符)\n\n发刊词 | 为什么你一定要读...\n\n说古论今天下事，拾故事学贯行书。\n\n你好，我是贯行。这一次我们一起来读老舍。\n\n\
    老舍先生生于1899年2月3日，到2019年，正好120年。而且，2019年距离他的代表作《茶馆》的首演，刚好过去八十周年。\n\n可以说，对于老舍，对于中国近现代，这都是一个大事年。在这样的时间点，我想和大家来细细品尝老舍的经典作品，以及我们现在当下的处境。\n\
    \n我一共选了三个方向，把总共八九万字的老舍《老舍全集》梳理了一番，结合学术界的阅读、老舍自己的创作史、老舍和他同时代人的《老舍全集》（包括《老张的圣诞》《二马》《我这一辈子》《四世同堂》《骆驼祥子》《月牙儿》《猫城记》《小坡的生日》《济南的冬天》《断魂》《正红旗下》《月牙儿》《茶馆》还有《离婚》《我这一辈子》《四世同堂》《文殊》《猫城记》。我会帮你一起细读这些作品。\n\
    \n我会详细地谈《茶馆》，谈为什么老舍是中国近现代最著名的作家之一，也谈他的文学创作。\n\n你也许会问：老舍是谁？为什么一定要读老舍？\n\n下面，我们就从理解民族性经典样本，学习经典现代小说文风，以及作品的时空穿透力，这三个方面来了解老舍。\n\
    \n# **\"文化中国\"的经验样本**\n\n我们是中国人，当然应该理解中国文化中的情感。可我们什么说自己是中国人？这个并不仅仅是国籍，也不只是民族血统的范畴，而是一种文化概念。一个文化概念里的文化认同，包括一个群体，一种价值认同，以及一种文化归属。\n\
    \n读老舍，就是一个非常好的方法。在\"五四\"以后的现代中国小说里，老舍对中国民族文化的观察和反思，是他深入骨子骨子骨髓之处，也是他文学创作的根基。\n\n\
    \"以故事写文化，以人生写文化\"是这部作品的主要主题。下面，我们先来聊聊老舍的两部著名长篇小说：《四世同堂》和《骆驼祥子》。"
