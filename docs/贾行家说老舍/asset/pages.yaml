- pgno: 30
  md: '加缪的解读是，西绪福斯不是悲剧英雄，而是能战胜这种荒诞处境的英雄。他清醒地知道结局，但却没有怨愤、没有犹豫地一道道地推石头上头。他对这种荒诞命运感到轻蔑，但却在庄严地完成自己的行动。


    写这类故事，现在叫传播“丧”文化，据说我也要算一个。但我理由是，人首先需要对真实：我们解决不了困惑，不代丧就放弃真实。人不能为逃避生活本质的难以下，就给自己编造一个假象。像“都是婚姻不如想象中的”这种念头，是很容易就被撕破之后的结果戳破的。


    存在主义总被看成是一种虚无主义，但它更是一种人道主义：它告诉每个迷茫和危机中的人，不要等待生活的意义出现，要行动起来，赋予它意义。


    人类精神的高贵，就是在知道一切无意义的情况下，仍然选择炽热地生活下去。这就等于给所有的虚无感赋予意义。


    # — 本讲小结 —


    总结一下：本讲的内容，简单地说就是，离婚出轨、争名夺利的老胡折腾，完全无益于解决焦虑。更好的方式是直面它，通过行动，给自己的生命赋予独特意义。


    讨论题：你所战胜的最大困境，是什么呢？如果比较私人，可以用“我有一个朋友”的方式开头……


