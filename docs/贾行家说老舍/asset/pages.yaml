  md: '老舍不满于当时英国小说和电影对中国的蔑视，也看不起萨伊伯师那种高高在上的态度。他感受到了精神上的伤害之后，不是用更恶毒的语言骂回去，而是先问自己一个问题：这是为什么？


    他看到，当时的欧美人也同样看不起日本人，但当面对却要恭维他们，不会直接拍进电影里。因为那时候中国的经济落后，中国人在欧美只能开餐馆，开洗衣店，骂起来没风险。而日本人虽然开妓院赌馆，但他们也开了轮胎公司和银行。


    所以，获得外国人尊重的办法，不是去和他们吵架，而是自己变得强起来。老舍借李子荣的口说：“要是自己不争气，就别怨人家。”


    老舍注意分析中国人的缺点和英国人的优点，是希望中国人能学得这些更符合现代文明社会的民族性格，在未来获得真正的尊重。老舍期望的平等，不是自己变得更坏，而是让对方变得更坏。


    # ## 本讲小结


    这一讲，其实就一句话：爱国是一种具体的爱，而不是宣泄型的恨。爱国应该爱得具体，爱得富于建设性。这也算是我对第11讲思考题的回答。


    讨论题：你最爱中国的哪一点？如果是中国的美食，也不要不好意思留言。美食里有中国的历史、物产、风俗和智慧，非常值得热爱。


